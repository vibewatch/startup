  evidenceGaps:
  - type: private-evidence-only
    severity: major
    topic: NRR, GRR, and logo churn not publicly disclosed
    missingEvidence: "Island has not disclosed any retention metrics \u2014 NRR, GRR, logo churn, or seat-level retention\
      \ cohorts. This is the single most important unknown for assessing business durability."
    whyItMatters: For a per-seat SaaS model, NRR is the primary indicator of whether the business is compounding or decaying.
      Without it, the $4.85B valuation cannot be validated from a revenue durability perspective.
    diligencePath: Request quarterly NRR and GRR for FY2023, FY2024, and YTD 2025 under NDA. Request top-10 customer renewal
      schedule.
    relatedQuestionRefs:
    - QU012
    - QU013
    - QU020
  - type: private-evidence-only
    severity: major
    topic: No named enterprise customer references publicly available
    missingEvidence: Island has not published any named enterprise customer case studies with specific outcomes. The 7-of-10
      financial institution claim is unverified and non-specific.
    whyItMatters: Named customer proof is essential for validating that the 450+ customer claim represents production deployments
      rather than pilots or paid POCs.
    diligencePath: Request named customer references in financial services, healthcare, and government segments under NDA.
      Request call with 3 production customers in each vertical.
    relatedQuestionRefs:
    - QU004
    - QU009
    - QU019
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: Top-10 customer concentration and ACV distribution not disclosed
    missingEvidence: The ARR distribution across Island's customer base is unknown. Top-10 customer ARR as a % of total is
      a critical concentration risk indicator.
    whyItMatters: If top-7 banks represent 50%+ of ARR, each renewal cycle carries meaningful binary risk. This would significantly
      affect risk-adjusted valuation.
    diligencePath: Request ARR waterfall by vertical and top-10 customer ACV under NDA.
    relatedQuestionRefs:
    - QU017
    - QU006
  - type: no-public-evidence
    severity: minor
    topic: Geographic distribution of customer base not disclosed
    missingEvidence: Island has not published geographic breakdown of its 450+ customer base. US-centric adoption is inferred
      from the company's Dallas HQ and Series E international expansion plans.
    whyItMatters: International customer mix affects both growth trajectory and FX risk. Understanding the US vs. international
      split helps size the international opportunity.
    diligencePath: Request geographic breakdown of ARR and customer count under NDA.
    relatedQuestionRefs:
    - QU007
  - type: no-public-evidence
    severity: minor
    topic: Average contract value (ACV) and typical seat count per enterprise customer not disclosed
    missingEvidence: Island has not publicly disclosed ACV, average deal size, or seat count distribution. These metrics are
      necessary to validate the $87M ARR estimate and understand deal economics.
    whyItMatters: Without ACV data, it is impossible to assess whether the 450+ customer count represents 450 large enterprise
      contracts or a mix of large and small deployments.
    diligencePath: Request ACV distribution, median deal size, and seat count per customer tier under NDA.
    relatedQuestionRefs:
    - QU011
  - type: no-public-evidence
    severity: minor
    topic: Customer acquisition efficiency metrics (CAC, payback period) not available
    missingEvidence: Island has not disclosed CAC, payback period, or sales efficiency ratios. With 500 employees and significant
      VC funding, Island is likely in aggressive growth mode.
    whyItMatters: CAC payback and magic number ratios indicate whether growth is capital-efficient or if sales machine spending
      is creating temporary growth that erodes at scale.
    diligencePath: Request CAC payback period, LTV/CAC ratio, and quarterly magic number (new ARR / S&M spend) under NDA.
    relatedQuestionRefs:
    - QU024
  - type: no-public-evidence
    severity: minor
    topic: Enterprise AI and SASE module upsell attach rate not disclosed
    missingEvidence: "Island has not disclosed what fraction of existing Enterprise Browser customers have adopted Enterprise\
      \ AI or Enterprise Network modules \u2014 key leading indicators for NRR expansion."
    whyItMatters: Module attach rate determines whether the land-and-expand thesis is executing. Low attach rates would indicate
      limited upsell potential in the existing base.
    diligencePath: Request module attach rate, incremental ACV from upsell, and pipeline of module upgrades under NDA.
    relatedQuestionRefs:
    - QU026
