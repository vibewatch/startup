  rows:
  - - Financial services concentration
    - "7 of 10 largest global banks implies ~50\u201360% ARR concentration in one vertical"
    - "High risk \u2014 financial services IT budget compression or regulatory change disproportionately impacts Island"
    - Request ARR breakdown by vertical; assess top-5 customer as % of total ARR
  - - Seat expansion within accounts
    - BYOD and contractor population growth drives seat count expansion; land-and-expand is core motion
    - "Positive \u2014 organic ARR growth without new logo acquisition cost"
    - Request average ACV expansion rate per existing account year-over-year
  - - Enterprise AI module upsell
    - AI governance is a high-urgency CIO/CISO priority; Island AI extends the base product
    - Positive expansion opportunity; AI module may double ACV for existing customers
    - Track Enterprise AI module attach rate and average incremental ACV
  - - Enterprise Network (SASE) upsell
    - Network module displaces Netskope/Zscaler; large TCV if successful
    - "High upside; high risk \u2014 displacing established SASE vendors requires deep account trust"
    - Request Enterprise Network revenue as % of total; pipeline conversion rate
  - - Top customer concentration
    - "Unknown \u2014 but 7-of-10 banks implies top accounts may be individually large"
    - "Medium risk \u2014 loss of even one top-10 bank customer is a material ARR event"
    - Request top-10 customer ARR as % of total; assess renewal schedule
  - - Government channel (Carahsoft) dependence
    - Federal revenue flows through Carahsoft GSA; government sales cycles are long and FedRAMP-gated
    - "Medium risk \u2014 FedRAMP ATO delay pushes government ARR timeline; channel fees reduce margin"
    - Track FedRAMP ATO timeline; assess Carahsoft exclusivity terms
