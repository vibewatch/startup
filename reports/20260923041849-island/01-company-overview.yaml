company:
  name: Island
chapter:
  number: 1
  title: Company Overview
  summary: "Island is a Dallas-headquartered, Tel Aviv R&D-led cybersecurity company that created and\ncommercialised the\
    \ enterprise browser category. Founded in August 2020 by veteran security\nexecutives Mike Fey (CEO, ex-Symantec President/COO,\
    \ ex-McAfee CTO) and Dan Amiga (CTO,\nfounder of Fireglass, acquired by Symantec for $250 million in 2017), Island builds\
    \ a\nChromium-based browser purpose-built for enterprise needs: native data-loss prevention,\nzero-trust network access,\
    \ web isolation, granular policy enforcement, and workforce\nvisibility \u2014 all without plugins or bolt-ons. The company\
    \ emerged from stealth in February\n2022, has grown to 450 enterprise customers (Pfizer, Swiss Life, Fiverr, Mattress\
    \ Firm,\nTaskUs) and approximately 500 employees with ARR roughly doubling each year since launch,\nreaching an estimated\
    \ $87 million in 2024. Island raised $250 million in a Series E round\nat a $4.85 billion valuation in March 2025, bringing\
    \ cumulative outside investment to\napproximately $730 million. Investors include Coatue, Sequoia Capital, Insight Partners,\n\
    Canapi Ventures, Cyberstarts, Cisco Investments, Citi Ventures, Capital One Ventures,\nGeorgian, Prysm Capital, ServiceNow\
    \ Ventures, and Stripes.\n"
sections:
- id: S-identity
  title: Identity, Headquarters, and Business Model
  body: "Island Technology Inc. is incorporated in Delaware and headquartered in Dallas, Texas,\nwith its primary research-and-development\
    \ centre in Tel Aviv, Israel. The company defines\nitself as the creator of the enterprise browser category \u2014 a purpose-built,\
    \ Chromium-based\nbrowser that embeds security, IT governance, and productivity controls natively, replacing\nconsumer\
    \ browsers that were never designed for corporate environments. Island's product is\ndelivered as a managed SaaS subscription:\
    \ enterprises pay per seat for the Island\nEnterprise Browser, receiving continuous updates, policy management tooling,\
    \ and a cloud-\nbased management console. The browser itself runs locally on endpoints and supports\nWindows, macOS, and\
    \ select Linux distributions.\n\nThe business model targets chief information security officers (CISOs), chief information\n\
    officers (CIOs), and IT and security teams in mid-market and enterprise accounts. Revenue\nis subscription-based (annual\
    \ contracts), with pricing tiers tied to seat count and\nfeature module selection. Island positions itself as a platform\
    \ that consolidates and\nreplaces spending on several adjacent security products \u2014 virtual desktop infrastructure\n\
    (VDI), data-loss-prevention (DLP) agents, web-isolation gateways, and secure web gateways\n\u2014 enabling demonstrable\
    \ return-on-investment. The Forrester Total Economic Impact study\ncommissioned by Island documented a 344% ROI for a\
    \ composite enterprise customer.\n\nIsland serves customers across every major vertical: financial services, healthcare,\n\
    pharmaceutical, retail, manufacturing, government, and higher education. As of March 2025\nthe company reported 450 enterprise\
    \ customers, including multiple Fortune 100 accounts\nand government agencies. Island is based in Dallas with R&D led\
    \ from Tel Aviv; it has no\npublished geographic segment revenue disclosures.\n"
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  figureRefs:
  - FO002
- id: S-founding
  title: Founders, Leadership, and Governance
  body: "Island was founded in August 2020 by Mike Fey and Dan Amiga, who met when Symantec\nacquired Amiga's previous company,\
    \ Fireglass, in 2017. Fey served as President and Chief\nOperating Officer of Symantec (now Broadcom) and as General Manager\
    \ and Chief Technology\nOfficer of McAfee (now Trellix), accumulating more than two decades of enterprise security\nleadership.\
    \ Amiga invented remote browser isolation technology at Fireglass \u2014 a category-\ndefining Israeli security startup\
    \ \u2014 and has served as a founding investor or adviser in\nmultiple Israeli cybersecurity companies including Axis\
    \ Security, Cycode, and\nBuild.Security.\n\nThe two founders identified a structural gap: as enterprise work shifted to\
    \ SaaS and web\napplications, the browser became the primary attack surface and data-exfiltration vector,\nyet enterprises\
    \ universally deployed consumer browsers that provided no enterprise controls.\nTheir insight was to leverage the open-source\
    \ Chromium engine \u2014 standardised across the\nindustry \u2014 to build a browser indistinguishable to end users but\
    \ fully manageable by IT\nand security teams. Two years of stealth product development followed the August 2020\nfounding\
    \ before the February 2022 public launch.\n\nIsland's leadership team beyond the founders includes senior hires from enterprise\n\
    security, identity, and SaaS ecosystems; the company has not publicly disclosed the\nnames of its extended C-suite. The\
    \ board includes representation from Sequoia Capital\n(Doug Leone, who led Series A through D participation) and Coatue\
    \ Management (David\nSchneider, lead investor in Series D and E). No independent directors have been publicly\nnamed as\
    \ of the report date. Key-person risk is concentrated in the two founders, who\nretain de-facto technical and commercial\
    \ leadership. The R&D hub in Tel Aviv employs more\nthan 200 engineers and is the primary product-development centre.\n"
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
