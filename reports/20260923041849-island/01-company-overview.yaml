  - FO001
- id: S-milestones
  title: Product Launch, Customer Traction, and Key Milestones
  body: "Island spent approximately eighteen months in stealth product development before publicly\nlaunching the Island Enterprise\
    \ Browser on February 1, 2022. Within one month of launch\nthe company raised its $115 million Series B. By October 2023\
    \ (Series C close) Island had\nsold over 2 million licensed browser seats across its customer base, including multiple\n\
    companies ranked in the Fortune 100 top 20. By April 2024 (Series D) it had grown to\napproximately 200 enterprise customers\
    \ and 280 employees. By March 2025 (Series E) it\nexpanded to 450+ customers and approximately 500 employees, with ARR\
    \ more than doubling\neach year since launch and reaching an estimated $87 million in calendar 2024.\n\nThe product was\
    \ recognised by Fast Company as one of the \"Next Big Things in Tech 2025,\"\nappeared on the Forbes Cloud 100 in 2024\
    \ and 2025, won the TechForward Award 2025 for\nZero Trust Architecture, and has been listed on the Fortune Cyber60 in\
    \ 2023, 2024, and\n2025. Gartner Peer Insights rates Island at 4.9/5 from 238 reviews as of 2026, placing\nit first in\
    \ user satisfaction in the Secure Enterprise Browser market category. G2 rates\nIsland at 4.7/5 from 21 verified enterprise\
    \ reviews.\n\nNotable enterprise customer proof points include: Pfizer (global biopharmaceutical,\n87,000+ employees),\
    \ whose Head of Insider Risk states Island is the company's single most\nimportant security tool; Mattress Firm; Swiss\
    \ Life; Fiverr; TaskUs; Hendrick Motorsports;\nand Brightline. Use cases span BYOD enablement, contractor onboarding,\
    \ VDI replacement,\nSaaS data-leakage prevention, zero-trust network access, and M&A transition security.\nOne CEO-cited\
    \ customer saved $300 million annually by replacing VDI rack infrastructure.\n\nKey adverse event: Palo Alto Networks\
    \ completed its acquisition of rival enterprise-\nbrowser startup Talon Cyber Security in December 2023 for approximately\
    \ $458 million,\nimmediately offering a free enterprise browser to qualifying SASE AI customers \u2014\nintensifying competition\
    \ through platform bundling.\n"
  claimRefs:
  - CO001
  - CO002
  tableRefs:
  - TO001
  figureRefs:
  - FO003
- id: S-metrics
  title: Cover Metrics and Evidence Gaps
  body: "Island's publicly disclosed metrics as of the report date: approximately $730 million\ntotal raised; $4.85 billion\
    \ post-money valuation (March 2025); 450+ enterprise customers;\napproximately 500 employees; and ARR approximately doubling\
    \ each year since launch,\nreaching an estimated $87 million in 2024 per LATKA analyst data. Island has not publicly\n\
    disclosed gross margin, net revenue retention (NRR), burn rate, free cash flow, or\nspecific revenue guidance. No audited\
    \ financial statements are publicly available.\n\nThe Israeli R&D concentration (200+ engineers in Tel Aviv out of approximately\
    \ 500 total\nemployees) represents both a talent advantage and a geopolitical risk factor. Island has\nnot disclosed any\
    \ business-continuity or geographic-diversification plans for its R&D\noperations. The company's valuation of $4.85 billion\
    \ at an estimated $87 million ARR\nimplies an ARR multiple of approximately 55x \u2014 exceptionally high even by cybersecurity\n\
    SaaS standards \u2014 making independent financial validation critical for any investor.\n\nNo adverse events \u2014 including\
    \ data breaches, regulatory actions, or lawsuits \u2014 involving\nIsland were identified in public research conducted\
    \ for this chapter.\n"
  claimRefs:
  - CO001
  - CO002
