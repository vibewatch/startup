  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ARR, gross margin, NRR, and burn rate
    missingEvidence: Island has not disclosed audited financial statements; ARR estimate of ~$87M (2024) relies on LATKA analyst
      data, not company confirmation.
    whyItMatters: Without verified ARR and unit-economics data, the $4.85B valuation multiple cannot be independently assessed.
    diligencePath: Request audited financials or management-confirmed ARR, NRR, and gross-margin under NDA from Island management
      or lead investors.
    relatedQuestionRefs:
    - QO008
    - QO023
  - type: private-evidence-only
    severity: material
    topic: Valuation multiple versus peer comparisons
    missingEvidence: Island's ARR multiple of ~55x cannot be compared to peers on a disclosed-ARR basis because most peers
      are also private with undisclosed financials.
    whyItMatters: 55x ARR is at the high end of even top-quartile cybersecurity SaaS; without peer-ARR data the implied premium
      is unverifiable.
    diligencePath: Cross-reference comparable cybersecurity SaaS companies (Abnormal Security, Chainguard, etc.) for ARR multiples;
      obtain Island audited ARR under NDA.
    relatedQuestionRefs:
    - QO022
  - type: private-evidence-only
    severity: material
    topic: Board composition and independent governance
    missingEvidence: Island has not publicly disclosed its full board, audit-committee structure, or whether independent directors
      sit on the board.
    whyItMatters: Absence of known independent board oversight is a governance risk at $4.85B valuation as the company approaches
      potential IPO.
    diligencePath: Review Delaware incorporation filings; interview CEO or board members for governance structure under NDA.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: material
    topic: Investor cap-table completeness and ownership percentages
    missingEvidence: Ownership percentages, preference-stack terms, and full cap-table details are not publicly available
      for Island as a private company.
    whyItMatters: Without knowing ownership distribution and preference terms, economic rights and liquidation waterfall cannot
      be assessed.
    diligencePath: Obtain cap-table summary and investor rights agreements under NDA from Island management or lead investors.
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: Internal product and partnership milestones not publicly documented
    missingEvidence: Island has not disclosed internal product launch details, government certifications, or partnership announcements
