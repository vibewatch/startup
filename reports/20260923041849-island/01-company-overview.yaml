  title: Palo Alto Networks offering enterprise browser free as a bundle with SASE
  body: 'Palo Alto Networks completed its acquisition of rival Talon Cyber Security in December 2023

    and immediately offered its enterprise browser free to qualifying SASE AI customers. This

    zero-dollar price point from the world''s largest cybersecurity vendor is a structural

    competitive threat to Island''s independent per-seat subscription model.

    '
  claimRefs:
