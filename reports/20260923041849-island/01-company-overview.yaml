- id: S-funding
  title: Funding History, Valuation, and Investors
  body: "Island has executed six priced rounds since its 2020 founding, raising approximately\n$730 million in cumulative\
    \ outside investment as of the March 2025 Series E. The company\nreached unicorn status with its March 2022 Series B at\
    \ a $1.3 billion post-money\nvaluation, only one month after emerging from stealth. Subsequent rounds substantially\n\
    re-rated the business: Series C (October 2023) at $1.5 billion; Series D (April 2024) at\n$3 billion; and Series E (March\
    \ 2025) at $4.85 billion \u2014 a 3.2x valuation step-up in\nunder twelve months.\n\nThe Series A (January 2022, approximately\
    \ $100 million) was led by Insight Partners and\nSequoia Capital. The Series B (March 2022, $115 million at $1.3 billion)\
    \ was led by\nInsight Partners and joined by Stripes and Sequoia. Additional B-round capital came from\nCisco Investments\
    \ (approximately $10 million strategic, July 2022) and Georgian\n(approximately $60 million, November 2022). The Series\
    \ C (October 2023, $100 million at\n$1.5 billion) was led by Prysm Capital, with Canapi Ventures joining as a new financial-\n\
    sector specialist investor. The Series D (April 2024, $175 million at $3 billion) was\nco-led by Coatue Management and\
    \ Sequoia; total raised reached $487 million at closing.\nThe Series E (March 2025, $250 million at $4.85 billion) was\
    \ led again by Coatue, with\nInsight Partners, Sequoia, and Canapi Ventures participating.\n\nStrategic corporate investors\
    \ across rounds include Capital One Ventures, Citi Ventures,\nCisco Investments, EDBI (Singapore), and ServiceNow Ventures.\
    \ There is no public record\nof secondary transactions, tender offers, or structured liquidity events. CEO Mike Fey\n\
    stated in April 2024 that Island intends to become a \"strong IPO candidate someday,\" but\nthe company has not filed\
    \ for a public offering or set a timeline.\n"
  claimRefs:
  - CO001
  - CO002
  tableRefs:
  - TO002
  - TO004
  - TO005
