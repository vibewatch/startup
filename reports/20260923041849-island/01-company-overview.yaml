  title: 'Israeli R&D nucleus: talent advantage and geopolitical concentration'
  body: 'With 200+ engineers in Tel Aviv out of approximately 500 total employees, Island benefits

    from elite Israeli cybersecurity and Chromium engineering talent. Military reserve obligations,

    regional security environment, and potential geopolitical disruptions represent a

    concentration risk that differs from US-only engineering teams.

    '
