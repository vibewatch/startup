  topStrengths:
    - 作为品类先驱，在企业级浏览器领域拥有极深的金融服务行业渗透率（拿下全球前十大银行中的 7 家）。
    - 由 Coatue、Sequoia、Stripes 等老牌顶级机构领投 $4.85B Series E 轮，侧面印证其内部增长指标通过了严格验证。
    - 企业级浏览器 TAM 正在迅速扩张——Gartner 预计到 2025 年，25% 的企业 Web 安全决策将涉及企业级浏览器。
    - 监管顺风（CISA 零信任架构、处于审核推进阶段的 FedRAMP High 认证）直接将 Island 带入合规驱动的采购周期。
    - 多产品线扩张（Enterprise AI、Enterprise Network）将单一客户的 TCV 拓展至核心浏览器 SKU 之外。
  topRisks:
    - Google 和 Microsoft 能以零边际成本向企业客户捆绑提供具竞争力的企业级浏览器功能。
    - NRR、烧钱速度与单客经济模型全未公开——仅凭公开基本面难以支撑 $4.85B 的高估值。
    - 对一家立足安全、为 450 多家企业实施集中策略管控的公司而言，管理控制台一旦被攻破将带来灭顶之灾。
    - 专利组合仅局限于一项较窄的专利——竞争壁垒主要取决于执行速度与客户关系。
    - 关键人物风险集中：Mike Fey 与 Dan Amiga 是企业客户及投资机构的核心信任基石。
  unresolvedGaps:
    - FY2023–2025 年度的 NRR 与 GRR 完全未公开——这是评估其财务健康度最关键的缺失指标。
    - 累计融资 $730M 之后的烧钱速度与现金跑道未披露——无法推演 IPO 前的稀释性融资风险。
    - 管理控制台的渗透测试结果与历史安全事件记录均未公开。
    - Chromium CVE 漏洞修补 SLA 及针对高危 CVE 的历史修补时效未披露。
    - $730M 优先股的优先股堆叠与清算负担未公开——直接影响回报测算。
