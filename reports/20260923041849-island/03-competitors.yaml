- id: SP-pricing
  title: Pricing and Packaging Comparison
  body: "Island uses custom per-seat enterprise pricing with no public list price. AWS Marketplace\nlists reference 12-month\
    \ contracts at ~$250,000/year for enterprise deployments. Palo Alto\nPrisma Browser is offered free to qualifying SASE\
    \ AI customers \u2014 making it effectively\nzero incremental cost for existing Palo Alto customers. Microsoft Edge for\
    \ Business is\nincluded at no cost with any Microsoft 365 commercial license. Chrome Enterprise is free\nin basic form;\
    \ the premium management add-on (Chrome Enterprise Premium) is $6/user/month.\n\nThis pricing dynamic creates a structural\
    \ disadvantage for Island in accounts already\ncommitted to Palo Alto SASE or Microsoft 365 at enterprise scale. Island\
    \ must prove a\nmulti-hundred-dollar per-seat value premium versus free alternatives \u2014 typically by\ndemonstrating\
    \ tool consolidation savings (VDI, DLP, SWG reduction) or unique capability\ngaps (BYOD contractor access, AI governance).\n"
  claimRefs:
  - CP001
  - CP002
  tableRefs:
  - TP003
  figureRefs: []
- id: SP-moat
  title: Moat and Competitive Risk Assessment
  body: "Island's competitive moat has four components: (1) Technical depth \u2014 rendering-engine-level\ncontrol not replicable\
    \ by extensions or network proxies; (2) Category creator advantage \u2014\nIsland coined the \"enterprise browser\" category,\
    \ has the longest track record, and has\nbuilt proprietary workflow automation tools unique to its platform; (3) Customer\
    \ switching\ncosts \u2014 once enterprise browser policies are configured and employees adopt Island as their\ndaily driver,\
    \ switching requires IT change management across the entire workforce; and\n(4) Talent moat \u2014 deep Israeli elite\
    \ Chromium engineering talent in Tel Aviv is difficult\nto replicate.\n\nCompetitive risks: (a) Platform bundling at zero\
    \ cost by Palo Alto and Microsoft could\ncap Island's addressable market in their respective installed bases; (b) Chromium\
    \ is open\nsource \u2014 any well-resourced player can fork it to build a competing enterprise browser;\n(c) Palo Alto\
    \ and Google have much larger security R&D budgets; (d) Market commoditization\nrisk if basic browser security features\
    \ become part of default enterprise browsers.\n"
  claimRefs:
  - CP001
  - CP002
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: SP-gaps
  title: Competitive Intelligence Gaps
  body: "Key evidence gaps in competitive analysis: (1) Prisma Browser's enterprise win rate and\ncustomer count are not publicly\
    \ disclosed post-Talon acquisition; (2) Seraphic's ARR\nand funding are not publicly disclosed, making it difficult to\
    \ assess its threat level;\n(3) Island's specific win/loss record against each competitor is proprietary; (4) The\nextent\
    \ to which Palo Alto is actively displacing Island in joint-prospect accounts is\nunknown from public sources. (5) No\
    \ named enterprise has publicly disclosed switching from\nIsland to a competitor, nor has Island disclosed its churn rate\
    \ or net revenue retention\n\u2014 key metrics for assessing whether the competitive bundling threat is materializing.\n\
    (6) Patent landscape for the enterprise browser category has not been comprehensively\nmapped; it is unclear whether Island,\
    \ Palo Alto, or other vendors hold blocking patents\nthat could affect competitor product development.\n"
  claimRefs:
  - CP001
  - CP002
  tableRefs: []
  figureRefs: []
