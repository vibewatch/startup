company:
  name: Island
chapter:
  number: 4
  title: Financials
  summary: 'Island''s financials are largely undisclosed as a private company. Public evidence anchors

    on ~$87M ARR in 2024 (LATKA, unconfirmed by Island), ARR doubling annually since 2022

    launch, 450+ enterprise customers, ~500 employees, and $730M total raised through the

    March 2025 Series E at $4.85B valuation. At ~55x ARR multiple, Island trades at a premium

    to public cybersecurity comps (CrowdStrike ~23x, Zscaler ~7x). Gross margin, burn rate,

    NRR, and profitability metrics are private. Capital adequacy appears strong: $730M raised

    with limited disclosed operating history suggests multiple years of runway unless burn is

    substantially above typical SaaS benchmarks.

    '
sections:
- id: IF-revenue
  title: Revenue Model and Streams
  body: "Island's primary revenue stream is a subscription SaaS model: per-seat annual recurring\nrevenue (ARR) billed to\
    \ enterprise customers for licensing the Island Enterprise Browser\nand its management console. The browser itself is\
    \ the core SaaS product; add-on features\n(extended session recording, workflow automation modules, premium support) are\
    \ believed\nto represent upsell tiers, though Island has not publicly disclosed its packaging or tier\npricing. LATKA\
    \ analyst data estimates Island's ARR at ~$87M in calendar 2024, with\ncompounding annual growth exceeding 100% since\
    \ the February 2022 launch.\n\nAWS Marketplace lists Island enterprise browser 12-month contracts at approximately\n$250,000/year\
    \ as a reference point, implying average enterprise contract value in the\n$100K\u2013500K+ range depending on seat count\
    \ and selected features. Island has 450+ enterprise\ncustomers as of March 2025; at $87M ARR across 450 customers, the\
    \ implied average revenue\nper customer is approximately $193K/year \u2014 consistent with an enterprise-focused motion.\n\
    \nThere is no evidence of hardware, professional services, or non-subscription revenue.\nAll known revenue references\
    \ relate to software subscription. This creates a high-gross-margin\nbusiness model typical of SaaS cybersecurity vendors\
    \ (estimated 70\u201385% gross margins,\nthough not confirmed by Island).\n"
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: IF-uniteconomics
  title: Unit Economics
  body: "Island's unit economics are not publicly disclosed. Key metrics \u2014 NRR (net revenue\nretention), gross margin,\
    \ CAC (customer acquisition cost), and LTV (lifetime value) \u2014\nmust be estimated from available public proxies. NRR\
    \ is implied to exceed 100% based on\nARR growing faster than customer count growth (ARR doubled while customer count\
    \ grew\nfrom ~200 to 450+ between April 2024 and March 2025 \u2014 implying seat expansion within\nexisting accounts).\
    \ If true, Island's net revenue retention is consistent with a top-quartile\nenterprise SaaS business (industry benchmarks:\
    \ >120% NRR for top-performing cybersecurity SaaS).\n\nGross margins are estimated at 70\u201385% based on industry benchmarks\
    \ for Chromium-based\nSaaS security products with no hardware component. Customer acquisition cost is unknown;\nIsland\
    \ has 450 customers and ~300 non-R&D employees (estimated sales, marketing, G&A),\nsuggesting a sales-heavy GTM appropriate\
    \ for an enterprise motion. Payback period is\nestimated at 12\u201324 months given enterprise ACV in the $150\u2013300K\
    \ range.\n\nForrester's 2024 Total Economic Impact (TEI) report commissioned by Island documented\na 344% ROI for a composite\
    \ enterprise customer \u2014 a strong ROI benchmark used in sales cycles.\n"
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: IF-capital
  title: Capital Structure and Adequacy
  body: "Island has raised $730M in total equity across six financing events through March 2025.\nThe Series E ($250M at $4.85B,\
    \ March 2025) and Series D ($175M at $3B, April 2024)\nalone contributed $425M over approximately 11 months. If Island's\
    \ monthly burn rate is\nin the $10\u201325M range (typical for a 500-person enterprise SaaS company scaling at >100%),\n\
    the $730M total raised (less estimated cumulative spend) implies 3\u20135+ years of runway\nfrom the March 2025 close.\
    \ Capital adequacy appears strong.\n\nIsland's capital structure includes investors across multiple preferred stock classes.\n\
    Coatue Management is the lead investor in both Series D and E (most recent, most senior\npreferred). Sequoia Capital has\
    \ participated from Series A through E. No secondary transactions\nor tender offers have been publicly disclosed, suggesting\
    \ limited liquidity has been\ndistributed to employees or early investors. Island has not disclosed its option pool size,\n\
    total fully diluted share count, or preferred liquidation preference stack.\n"
  claimRefs:
  - CI012
  tableRefs:
  - TI004
  figureRefs:
  - FI003
  - FI004
- id: IF-gaps
  title: Financial Evidence Gaps
  body: 'Material financial metrics are unavailable from public sources. Island has not published

    audited financial statements, revenue figures, gross margin, burn rate, NRR, churn rate,

    CAC, or LTV. The $87M ARR figure comes from LATKA, an unverified third-party data aggregator,

    not from Island management. All financial estimates in this chapter carry inherent uncertainty

    due to the private nature of Island''s disclosures. The valuation multiple of ~55x ARR

    (at $4.85B valuation / $87M ARR) is among the highest for private cybersecurity companies

    and implies significant execution risk if ARR growth slows or a public market re-rating occurs.

    Prospective investors should request audited statements and management commentary before relying on these estimates.

    '
