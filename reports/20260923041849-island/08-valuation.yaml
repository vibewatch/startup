  evidenceGaps:
  - type: private-evidence-only
    severity: major
    topic: "NRR and GRR not disclosed \u2014 single most important unknown"
    missingEvidence: Island has not disclosed NRR, GRR, or logo churn. These are the most important valuation-relevant metrics
      for a per-seat SaaS company.
    whyItMatters: "At 56x ARR, Island's valuation requires proof of compounding ARR through expansion \u2014 without NRR data,\
      \ the $4.85B cannot be justified from fundamentals alone."
    diligencePath: Request quarterly NRR and GRR for FY2023, FY2024, and YTD 2025 as the single highest-priority diligence
      ask.
    relatedQuestionRefs:
    - QV014
    - QV025
  - type: private-evidence-only
    severity: major
    topic: Preference stack and liquidation overhang not publicly disclosed
    missingEvidence: "Island's $730M raised includes preferred shares with liquidation preferences. The exact preference stack\
      \ \u2014 participating vs. non-participating, multiples, conversion terms \u2014 affects common stockholder returns\
      \ at IPO or acquisition."
    whyItMatters: "A 2x participating preferred stack from $730M preferred would require $1.46B in exit proceeds before common\
      \ stockholders see any value \u2014 material for return calculations at the $4.85B exit."
    diligencePath: Request cap table, option pool, and liquidation preference waterfall from Island's CFO under NDA.
    relatedQuestionRefs:
    - QV013
  - type: private-evidence-only
    severity: minor
    topic: Burn rate and runway not disclosed
    missingEvidence: Island's cash burn rate and remaining runway from $730M total raised are not disclosed. This prevents
      modeling the risk of a dilutive capital raise before IPO.
    whyItMatters: A forced capital raise in a multiple-compressed environment could price below $4.85B, destroying returns
      for Series E investors.
    diligencePath: Request monthly burn rate and projected runway at current burn from CFO under NDA.
    relatedQuestionRefs:
    - QV009
  - type: no-public-evidence
    severity: minor
    topic: "Comparable valuation table \u2014 private comparables (Netskope, Island ARR) rely on estimates"
    missingEvidence: "The comparable valuation table (TV004) draws on estimated private-company ARR for Netskope (~$300M)\
      \ and Island (~$87M). These are not disclosed by the companies and are sourced from Pitchbook, CBInsights, and LATKA\
      \ \u2014 which may be materially incorrect."
    whyItMatters: If Island's actual ARR is significantly above or below $87M, the 56x multiple and return calculations change
      materially. Similarly, if Netskope's ARR is different from $300M, the private-market comparable calibration shifts.
    diligencePath: Verify Island ARR under NDA. Cross-check Netskope estimates with Pitchbook, CBInsights, and any public
      Netskope investor disclosures.
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV007
    - QV018
