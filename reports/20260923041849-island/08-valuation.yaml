- id: TV002
  title: Thesis / anti-thesis table
  description: Island's investment thesis vs. anti-thesis organized by key diligence dimensions.
  columns:
  - dimension
  - thesis
  - anti-thesis
  - key-question
  rows:
  - - Market
    - Enterprise browser is a genuinely new $10B+ TAM category; Gartner projects 25% web security adoption by 2025
    - Category may remain niche; SASE vendors may absorb use cases at lower price points
    - Does the market grow to $10B+ or stay a premium niche at $2B?
  - - Product
    - Chromium-based browser is architecturally superior to extension-based products; 21-day cadence leads incumbents
    - Google/Microsoft can match key features at zero incremental cost to enterprises
    - "Does differentiation hold 18\u201336 months against Google Chrome Enterprise?"
  - - Customers
    - 450+ enterprise customers including 7/10 largest global banks; 4.9/5 Gartner satisfaction
    - "No disclosed NRR, logo churn, or named enterprise references \u2014 claims unverified"
    - What is actual NRR and per-customer ACV in the financial services segment?
  - - Financials
    - $4.85B reflects sophisticated investors (Coatue, Sequoia, Stripes) pricing in high-conviction growth
    - $87M estimated ARR at 56x is fully-priced; no margin for deceleration
    - What is the actual ARR, NRR, and burn rate under NDA?
  - - Competition
    - Financial services moat (7/10 banks) takes years for competitors to displace; network effects forming
    - Palo Alto acquired Talon; SASE incumbents bundling browser security; Google hardening Chrome Enterprise
    - When do incumbents offer parity? How much runway does Island have?
  - - Risks
    - FedRAMP In Process reduces regulatory risk; SOC2/ISO27001 shows process maturity
    - Management console breach risk is existential; CVE patch lag is structural; key-person concentration
    - Can Island survive a major security incident? What is the Chromium patch SLA?
