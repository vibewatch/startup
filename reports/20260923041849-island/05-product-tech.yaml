  evidenceGaps:
  - type: private-evidence-only
    severity: minor
    topic: Island's exact Chromium version lag and patch SLA not publicly disclosed
    missingEvidence: Island has not publicly disclosed how quickly it patches Chromium CVEs relative to Google Chrome's patch
      releases. For a security-positioned product, the Chromium version lag is a material security question.
    whyItMatters: Enterprises replacing Chrome with Island assume equivalent or better vulnerability response. If Island lags
      on Chromium patches, it creates security risk for customers.
    diligencePath: Request Island's Chromium version tracking policy, CVE patch SLA, and bug bounty scope from security team
      under NDA.
    relatedQuestionRefs:
    - QE023
    - QE025
  - type: private-evidence-only
    severity: minor
    topic: Detailed product roadmap not publicly committed
    missingEvidence: Island has not published a dated, committed product roadmap. Roadmap items are inferred from public statements
      by CEO and from analyst reports.
    whyItMatters: Without a committed roadmap, customers cannot assess whether FedRAMP High, Enterprise AI deepening, and
      mobile parity will be delivered on timelines relevant to their procurement cycles.
    diligencePath: Request Island's 12-month product roadmap and FedRAMP ATO timeline under NDA.
    relatedQuestionRefs:
