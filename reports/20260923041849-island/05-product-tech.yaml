company:
  name: Island
chapter:
  number: 5
  title: Product and Technology
  summary: "Island delivers the Enterprise Browser \u2014 a Chromium-based, enterprise-hardened browser\nbuilt natively for\
    \ security, IT control, and productivity. The product has three converging\nlines: Enterprise Browser (core), Enterprise\
    \ AI (secure generative AI access), and Enterprise\nNetwork (SASE). The technology stack runs on AWS (EKS, S3, CloudFront,\
    \ GovCloud) with a\nChromium-derived rendering engine modified by 200+ Tel Aviv engineers. Island holds SOC 2\nType II\
    \ and ISO/IEC 27001:2022 certifications; FedRAMP High is In Process. The browser\nintegrates with IdP, MDM, EDR, and SIEM\
    \ tools and supports Windows, macOS, Linux, ChromeOS,\niOS, iPadOS, and Android. A 21-day feature delivery cadence and\
    \ patent IP in browser data\ndeletion underpin its differentiation claim. Known challenges include performance overhead\n\
    from the isolation architecture, legacy-app compatibility gaps, and BYOD management complexity.\n"
sections:
- id: SE-product
  title: Product Lines and Module Architecture
  body: "Island ships three converging product lines. The Enterprise Browser is the core SKU \u2014 a\nChromium-derived browser\
    \ rebuilt with enterprise policy enforcement natively embedded. Unlike\nconsumer Chrome or Edge, every tab, session, and\
    \ interaction is governed by an IT-administered\nmanagement console. The browser replaces or consolidates legacy tools\
    \ including VPN clients,\nVDI platforms, web-filtering proxies, DLP point solutions, and remote browser isolation.\nEnterprise\
    \ AI extends the browser with secure access to generative AI tools (ChatGPT, Copilot,\nGemini) under enforced data-loss\
    \ prevention policies \u2014 preventing prompt injection, IP leakage,\nand shadow AI adoption. Enterprise Network is a\
    \ SASE overlay providing zero trust network\naccess (ZTNA) to private and internal apps without a separate VPN agent.\
    \ The management console\nis a centralized SaaS platform for administering policies, users, and device posture across\
    \ all\nthree product lines. Across all SKUs, Island targets IT administrators and CISOs in enterprises\nof 500+ seats\
    \ with regulated data or BYOD complexity.\n"
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: SE-usecase
  title: Enterprise Use Cases and Workflow Integration
  body: "Island's market positioning clusters around six high-value deployment patterns. First, BYOD\nand contractor access:\
    \ Island allows non-GFE devices to access SaaS and private apps without\nrequiring MDM enrollment or full-device management\
    \ \u2014 the browser enforces policy boundaries at\nthe application layer. Second, VDI reduction: organizations replace\
    \ costly Citrix or VMware\nHorizon deployments with Island's browser, which replicates VDI access controls without the\n\
    server-side infrastructure. Third, merger and acquisition onboarding: Island's policy-level\naccess provisioning accelerates\
    \ employee onboarding across different identity domains. Fourth,\nprivileged access management: shared accounts and admin\
    \ consoles are accessible via browser\nsession control without exposing credentials. Fifth, regulated industry compliance:\
    \ healthcare\norganizations use Island to enforce HIPAA controls for PHI access; financial services firms use\nit for\
    \ PCI/SOX DLP requirements. Sixth, AI governance: Island creates guardrails around\nChatGPT, Copilot, and other AI tools,\
    \ preventing data leakage into model training pipelines.\n"
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: SE-tech
  title: Technology Stack and Cloud Architecture
  body: "Island's core technical foundation is an enterprise fork of the open-source Chromium browser\nengine. Google's Chromium\
    \ project powers Chrome, Edge, Arc, Brave, and most enterprise\nbrowsers \u2014 Island layers its proprietary policy engine,\
    \ management plane, and security controls\non top of this shared base. The Island back-end runs on AWS, using Elastic\
    \ Kubernetes Service\nfor microservices, RDS for management-plane data, S3 for audit-log and session storage, and\nCloudFront\
    \ for global content delivery. AWS GovCloud is used for federal customers requiring\nFedRAMP High-equivalent isolation.\
    \ Key differentiating IP sits in the management plane: a\ncentralized policy engine that pushes per-user, per-app, per-device\
    \ controls to browser\nendpoints without requiring routing through a central proxy. Island holds U.S. Patent\n12,235,922\
    \ covering enterprise browser data deletion by URL hostname grouping. The R&D center\nis in Tel Aviv with 200+ engineers,\
    \ and the engineering culture is modeled on the Israeli\nmilitary-adjacent tech tradition that produced Fireglass (acquired\
    \ by Symantec for ~$250M\nin 2017 \u2014 co-founder Dan Amiga's prior company).\n"
  claimRefs:
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: SE-roadmap
  title: Deployment, Integration, and Roadmap
  body: "Island delivers new browser features on an approximately 21-day cadence \u2014 a cadence confirmed\nby CEO Mike Fey\
    \ in ISMG's GovInfoSecurity interview. The browser integrates with identity\nproviders (Okta, Azure AD, Ping Identity)\
    \ via SAML/OIDC, with MDM platforms (Jamf, Intune,\nVMware Workspace ONE) for device posture signals, and with SIEM systems\
    \ (Splunk, Microsoft\nSentinel) for activity log export. Deployment is end-user driven (browser download and install),\n\
    with IT-administered policies pushed from the management console; no network appliance or proxy\nis required. For mobile,\
    \ Island ships iOS, iPadOS, and Android apps that enforce browser\npolicies on personal devices. The near-term roadmap,\
    \ inferred from public statements, focuses\non: (1) building deeper SASE integrations to displace Netskope, Zscaler, and\
    \ Palo Alto\nPrisma; (2) expanding the Enterprise AI module to cover more AI platforms; and (3) achieving\nFedRAMP High\
    \ authorization, which would open the federal civilian and DoD market. The company\nships customers as \"design partners\"\
    \ who co-develop features, reducing requirements-discovery\nlag and accelerating product-market fit iteration.\n"
  claimRefs:
  - CE001
  - CE002
  tableRefs:
  - TE005
  figureRefs: []
- id: SE-trust
  title: Trust, Compliance, and Quality Controls
  body: "Island has achieved SOC 2 Type II certification (since mid-2022, just four months after\nemerging from stealth \u2014\
    \ an unusually fast compliance trajectory for a startup). It achieved\nISO/IEC 27001:2022 certification in May 2025. FedRAMP\
    \ High authorization is In Process,\nwhich would enable deployment across US federal civilian agencies and DoD environments.\
    \ The\ntrust.island.io portal serves as the public compliance disclosure portal. Island's browser\nblog documents how\
    \ the SOC 2 framework maps to Island's product capabilities across all nine\nAICPA common criteria, including CC6 logical\
    \ access, CC4 monitoring activities, and CC8 change\nmanagement. For healthcare, Island's browser provides HIPAA audit\
    \ trail capability, PHI\nboundary enforcement, and device posture assessment. For financial services, DLP 360 controls\n\
    govern PCI and SOX compliance. A zero-knowledge password manager is integrated into the\nbrowser, ensuring credentials\
    \ are encrypted client-side. Gartner Peer Insights rates Island\n4.9/5 from 238 reviews as of early 2026, with users citing\
    \ security granularity and deployment\nspeed as top strengths. Known weaknesses include performance lag on resource-constrained\n\
    devices and legacy-application compatibility gaps, as documented by third-party analysts.\n"
  claimRefs:
  - CE001
  - CE002
