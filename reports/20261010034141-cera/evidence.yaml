evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-margins-and-unit-economics
    missingEvidence: >-
      Audited group financial statements detailing gross margins, carer wage cost ratios, and operating EBITDA
      profitability for Cera Care.
    whyItMatters: >-
      Social care service businesses typically operate on thin gross margins (15-25%); without audited unit economics,
      valuation defensibility cannot be confirmed.
    diligencePath: >-
      Request audited consolidated statutory accounts and management P&L breakdowns during confirmatory institutional
      diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: debt-covenants-and-capital-structure
    missingEvidence: >-
      Detailed schedule of debt maturities, interest covenants, and senior ranking terms for Cera's conventional debt
      facilities.
    whyItMatters: >-
      Debt facilities raised in 2022 and 2025 create fixed debt service burdens that could compress equity value in a
      high interest rate environment.
    diligencePath: Review debt facility agreements and lender covenants in virtual data room.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: public-sector-savings
    missingEvidence: >-
      Independent audit or published health economics evaluation confirming Cera's claimed £1 billion cumulative NHS
      savings and £1.5 million daily savings figure.
    whyItMatters: >-
      Public sector cost savings claims form the core economic rationale for Cera's valuation and local authority
      contract pricing, but rely entirely on company-reported model projections.
    diligencePath: >-
      Review NHS Integrated Care Board (ICB) public meeting minutes and tender award evaluations across contracted
      geographic regions.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: market-share-enumeration
    missingEvidence: >-
      Granular regional market share breakdown and contract allocation registries across UK Integrated Care Boards
      (ICBs) and local municipal authorities.
    whyItMatters: >-
      Without comprehensive council-level commissioning data, exact market penetration rates and displacement dynamics
      versus traditional local home care agencies cannot be precisely quantified.
    diligencePath: >-
      Request Integrated Care Board procurement records, local authority tender award announcements, and Freedom of
      Information social care framework disclosures.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: clinical-validation
    missingEvidence: >-
      Independent clinical evaluation data or peer-reviewed health economics studies confirming the claimed 70%
      reduction in hospitalisations.
    whyItMatters: >-
      Hospital admission reduction is Cera's primary value proposition to NHS payers; unsubstantiated claims risk
      procurement pushback or regulatory scrutiny.
    diligencePath: >-
      Engage NHS commissioning partners and request clinical audit documentation or academic partnership evaluation
      reports.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited breakdown of Cera Care's statutory gross margins, hourly billing rates, frontline care worker wage costs,
      and corporate software G&A.
    whyItMatters: >-
      Without verified gross margins and unit-level economics, institutional underwriters cannot distinguish
      software-margin leverage from low-margin domiciliary care staffing.
    diligencePath: >-
      Request statutory UK Companies House audited accounts for Cera Care Operations and parent entity, plus sample
      local authority care package rate cards.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Detailed covenant terms, amortization schedule, interest rates, and maturity profile for Cera's $150M January 2025
      and £130M August 2022 debt facilities.
    whyItMatters: >-
      Heavy debt financing creates non-discretionary cash outflow obligations that materially shorten operational cash
      runway under any revenue plateau or margin compression.
    diligencePath: >-
      Review credit agreements and debt covenants from lead lenders BDT & MSD Partners and Schroders Capital in data
      room diligence.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: clinical-validation
    missingEvidence: >-
      Peer-reviewed clinical outcome studies or independent NHS trust evaluations validating Cera's claimed 50%
      reduction in hospital admissions and 20% reduction in falls.
    whyItMatters: >-
      Without independent clinical validation, Cera's core value proposition and cost-saving metrics remain unverified
      company-reported marketing assertions.
    diligencePath: >-
      Request unblinded clinical audit reports, NHS partner evaluation data, and peer-reviewed methodology documentation
      from Cera management.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: technical-transparency
    missingEvidence: >-
      Technical architecture specifications, model training benchmarks, data privacy schemas, and EHR integration
      interface documentation.
    whyItMatters: Technical risk assessment and algorithmic defensibility cannot be confirmed through public marketing materials.
    diligencePath: >-
      Obtain architecture diagrams, Data Security and Protection (DSP) Toolkit audit submissions, and API integration
      specifications under NDA.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer retention and renewal rates
    missingEvidence: >-
      Formal disclosures of Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and local authority contract
      renewal rates.
    whyItMatters: Prevents precise verification of customer cohort durability and long-term contract renewal stability.
    diligencePath: Request anonymized council tender renewal records and historical cohort revenue retention schedules.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: minor
    topic: commercial terms for RWE partnerships
    missingEvidence: >-
      Revenue-sharing terms and signed pharmaceutical sponsor contracts under the Promptly Health real-world evidence
      partnership.
    whyItMatters: >-
      Obscures the direct commercial contribution of high-margin health data monetization relative to labor-intensive
      care visits.
    diligencePath: Review commercial partnership agreements between Cera, Promptly Health, and life sciences sponsors.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Branch-level CQC inspection ratings, regional compliance notices, and full audit logs for all UK operating hubs.
    whyItMatters: >-
      Individual local council care contracts depend on maintaining Good or Outstanding CQC ratings across all regional
      operating entities.
    diligencePath: >-
      Audit public CQC API database for all provider IDs registered under Cera Care and its regional subsidiary
      entities.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: gross-operating-margins
    missingEvidence: Audited gross margin and direct labor cost breakdowns per care hour delivered.
    whyItMatters: >-
      Home healthcare models operate under statutory wage floors and travel time compensation mandates, exposing unit
      economics to wage inflation.
    diligencePath: >-
      Request management accounts detailing carer travel reimbursements, national living wage sensitivity, and gross
      margin per delivery hour.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-margins
    missingEvidence: Audited gross margins, operating expenses, and EBITDA figures for UK and German home care operations.
    whyItMatters: >-
      Without audited margins, it is impossible to evaluate unit economics, cash burn rate, and sustainable debt
      coverage for Cera's $1.0B valuation.
    diligencePath: Review audited statutory financial filings at Companies House and request private management accounts under NDA.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: debt-covenants
    missingEvidence: Covenant terms, maturity schedules, and interest rates on Cera's conventional debt facilities.
    whyItMatters: >-
      Conventional debt tranches may introduce senior liquidation preferences and refinancing vulnerabilities in
      higher-for-longer rate environments.
    diligencePath: Request loan facility agreements and creditor term sheets during Phase 2 confirmatory diligence.
    relatedQuestionRefs:
      - QV008
