company:
  name: "Cera"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Cera is a UK-based digital home healthcare platform combining algorithmic scheduling and clinical monitoring with frontline care delivery across the NHS and European health ecosystems. Founded in 2015, the company has raised $400 million in cumulative equity and conventional debt financing, achieving a $1 billion post-money valuation in its January 2025 Series C while self-reporting $600 million in annualised run-rate revenues."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity and Healthcare Delivery Model"
    body: "Cera operates as a digital-first home healthcare technology and clinical services provider headquartered in London with statutory registration under Cera Care Limited and Cera Homecare Limited. Established in 2015, the organisation positions itself as Europe's largest digital care provider, addressing systemic demographic pressures across public healthcare systems by shifting non-acute monitoring and rehabilitation out of overcrowded hospitals and directly into domestic settings. The operating model combines direct employment of community caregivers and visiting nurses with a proprietary software application that facilitates algorithmic route scheduling, real-time vital sign tracking, and machine-learning-driven deterioration prediction. This dual digital-physical posture enables Cera to contract directly with NHS integrated care boards, local government councils, and private payers, creating an integrated care management backbone that claims significant emergency hospitalisation reductions."
    claimRefs:
      - "CO001"
      - "CO003"
    tableRefs:
      - "TO001"

  - id: "founders-leadership-and-governance"
    title: "Founding Team, Executive Leadership, and Governance Architecture"
    body: "The enterprise was co-founded by physician, entrepreneur, and health policy advisor Dr Mahiben (Ben) Maruthappu MBE alongside technology operators Marek Sacha and Martin Ocenas. Dr Maruthappu serves as Chief Executive Officer, contributing deep clinical insight and health service policy relationships derived from advisory roles within the National Health Service. The founding complement combined digital marketplace execution with specialized healthcare software architecture, guiding Cera from an initial urban domiciliary agency to a scaled institutional provider. Governance is anchored by an external Advisory Board chaired by Sir David Behan, former Chief Executive of the Care Quality Commission, providing regulatory oversight and compliance rigor. Board composition further incorporates experienced public policy leaders including Lord Stewart Wood, Alzheimer's Research UK executive Hilary Evans, strategic communications advisor Benjamin Wegg-Prosser, and former Downing Street social care advisor Samantha Jones OBE."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"

  - id: "capitalization-investors-and-valuation"
    title: "Capitalization History, Institutional Investors, and Valuation Structure"
    body: "Across thirteen discrete financing events since inception, Cera has raised approximately $400 million in aggregate institutional capital spanning equity and debt instruments. The capitalization trajectory accelerated in January 2025 with the completion of a $150 million Series C equity round that established a headline post-money valuation of $1 billion, accompanied by a synchronous conventional debt facility. Lead institutional sponsors include BDT & MSD Partners and Schroders Capital, joined by growth participants such as Guinness Global Investors, Credo Ventures, DigitalHealth.London, and Vanderbilt University. However, the capital structure displays material complexity: substantial funding tranches are structured as conventional debt rather than pure equity, and full liquidation preference schedules, loan covenants, and interest servicing obligations remain undisclosed in public registries. Consequently, the headline unicorn valuation reflects structured capital arrangements that require detailed covenant inspection."
    claimRefs:
      - "CO002"
      - "CO004"
      - "CO006"
      - "CO010"
    tableRefs:
      - "TO003"

  - id: "scale-operations-and-growth-milestones"
    title: "Operational Scale, Caregiver Network, and Chronological Milestones"
    body: "From its initial London launch in 2016, Cera has expanded rapidly across England, Scotland, and Germany, covering an addressable catchment of 30 million individuals. The organisation delivers roughly 60,000 community care appointments each day, representing a frontline capacity equivalent to nearly one hundred district general hospitals. Internal operating disclosures claim annualised run-rate revenue expansion from $6 million to $600 million over a five-year horizon, supported by a workforce footprint exceeding 9,000 registered employees within main operational subsidiaries. The technology platform incorporates predictive AI algorithms that the company claims reduce service user falls by 20% and hospital readmissions by more than half. Strategic development milestones demonstrate consistent scaling from local domiciliary care delivery to nationwide public sector integration, culminating in the 2025 unicorn funding round."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO005"
      - "CO014"
    figureRefs:
      - "FO001"

  - id: "entity-disambiguation-and-diligence-screening"
    title: "Entity Disambiguation and Public Disclosure Screening"
    body: "Comprehensive investment diligence requires rigorous disambiguation of Cera Care from unrelated entities sharing identical or similar corporate names across global databases. In automated market intelligence feeds, keyword search queries frequently conflate the UK digital healthcare startup with Cera Sanitaryware Ltd (BOM:532443), an Indian publicly traded manufacturer of architectural ceramics and bathware that reported Q4 FY26 EBITDA margin compression to 15.2% due to rising brass and energy input costs. Similarly, energy policy feeds capture CERAWeek, a premier international energy conference in Houston Texas convened by Daniel Yergin and attended by North American energy ministers, which bears no relation to domiciliary healthcare. Discarding these irrelevant corporate homonyms ensures that valuation benchmarks, risk signals, and regulatory assessments remain strictly anchored to Cera's genuine home care operational perimeter."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"

