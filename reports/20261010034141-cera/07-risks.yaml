callouts:
  - calloutType: risk
    title: "Frontline Carer Supply and Wage Mandate Squeeze"
    body: "Because home healthcare requires physical in-person visits across distributed geographic territories, Cera remains vulnerable to statutory wage increases and competition for frontline carers. Technology-driven recruitment accelerates hiring pipelines, but sustained inflation in living wages creates margin compression unless public commissioning contracts provide compensatory rate adjustments."
    claimRefs:
      - CR007
      - CR011
  - calloutType: insight
    title: "Clinical Safety and Algorithmic Triage Verification"
    body: "Cera's strategic differentiation rests upon AI models predicting clinical deterioration and reducing hospital admissions by up to seventy percent. Establishing rigorous, independently audited validation of these clinical prediction algorithms is essential to demonstrate that algorithmic scheduling preserves patient safeguarding standards across large-scale public contracts."
    claimRefs:
      - CR003
      - CR009
