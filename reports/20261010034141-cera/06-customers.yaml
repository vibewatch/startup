chapter:
  number: 6
  title: Customers
  summary: Cera's customer base spans UK public-sector commissioning bodies—principally local authorities and NHS Integrated Care Boards—alongside emerging life sciences research partnerships. Production deployments across approximately 150 local authorities and 29 of 42 NHS Integrated Care Boards support high-frequency home visits, while commercial expansion into real-world evidence partnerships with platforms like Promptly Health introduces secondary monetization vectors. However, high dependence on UK public healthcare procurement and regional commissioning budgets presents severe concentration risks and limited direct visibility into private retention cohorts.
sections:
  - id: customer-segmentation-and-commissioning-structure
    title: Customer Segmentation and Commissioning Structure
    body: >-
      Cera's commercial customer model is structured primarily around institutional healthcare commissioners rather than direct out-of-pocket retail consumers, reflecting the operational realities of the UK home health and social care sector. The core buyer population consists of municipal local authorities and National Health Service (NHS) Integrated Care Boards (ICBs), which contract home-based care packages, reablement services, and post-acute discharge monitoring. In this institutional framework, the purchasing decision-maker and institutional payer (the council or NHS trust) is distinct from the end service recipient, who is typically an elderly or vulnerable patient over 65 years of age receiving daily domiciliary care.


      According to data analyzed by consultancy Faculty regarding Cera's Digital Care Plan (DCP) deployment, the platform has been utilized across approximately 150 of the UK's 382 local authorities, as well as 29 of 42 NHS Integrated Care Boards [CU001]. This institutional footprint establishes Cera as an integrated delivery partner embedded directly into regional social care workflows and public discharge pathways. Beyond primary public-sector commissioning, Cera has initiated life sciences commercial relationships, highlighted by a global real-world evidence (RWE) partnership with Promptly Health to bridge geriatric evidence gaps for pharmaceutical sponsors [CU003]. In addition, Cera maintains a private-pay channel for self-funded elderly care, though institutional commissioning represents the vast majority of operational volume.
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU013
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: operational-adoption-and-clinical-utilization
    title: Operational Adoption and Clinical Utilization Trajectory
    body: >-
      Adoption scale is evidenced by operational visit volume and workforce deployment across community settings. Cera operates a frontline network of approximately 10,000 carers and nurses delivering roughly 2.5 million technology-enabled home healthcare visits each month on behalf of governments, insurers, and the NHS [CU004]. This operational volume equates to approximately one visit delivered every second on average, providing a continuous, distributed interface with high-need elderly populations [CU005]. Independent evaluation indicates that the deployment of Cera's digital care technology across community care operations has reduced emergency hospitalizations among patients over 65 by 52% to 70%, preventing hundreds of acute emergency admissions through early detection of falls and infections [CU002].


      The clinical utility and utilization trajectory of the platform are closely tied to NHS capacity constraints and emergency department pressures. Independent analysis highlights that Cera's home healthcare model generates estimated savings of £1 million per day for the NHS through avoided emergency admissions and reduced bed occupancy, freeing up more than 1,210 hospital bed days monthly [CU009]. However, while Cera claims broader societal impact of £1.5 million daily, precise commercial pricing per visit and individual local authority contract terms remain undisclosed, leaving contract-level unit economics opaque [CU007].
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU007
      - CU009
    tableRefs:
      - TU002
  - id: named-partnerships-and-expansion-loops
    title: Named Commercial Proof and Expansion Dynamics
    body: >-
      Named commercial proof in Cera's operating history demonstrates expansion from core domiciliary care delivery into specialized clinical data monetization and digital health research. A primary example of secondary customer expansion is Cera's partnership with Promptly Health, which connects Cera's longitudinal home care dataset covering 2.5 million monthly visits and 260 billion data points with Promptly's European hospital network spanning 48 million lives across 370 hospitals [CU010]. This collaboration targets pharmaceutical developers and Health Technology Assessment (HTA) bodies seeking post-market surveillance and geriatric clinical trial optimization [CU011].


      Despite these expansion initiatives into life sciences, Cera faces material procurement concentration risks and operational scrutiny. The company's heavy reliance on NHS ICBs and local councils subjects revenue to public budgetary cycles, municipal social care funding squeezes, and rigid tender frameworks [CU014]. Furthermore, skepticism regarding aggressive company-sponsored cost-saving projections—such as claims that nationwide rollout could save £1 billion annually by 2026—highlights the diligence friction inherent in selling AI-enabled efficiency gains to cost-constrained public healthcare commissioners [CU012]. Rigorous diligence screening across external public databases confirms that market records under the Cera brand token frequently conflate the UK digital healthcare provider with unrelated commercial entities—notably Indian architectural ceramic manufacturer Cera Sanitaryware Ltd and Houston energy summit CERAWeek—underscoring the necessity of strict entity disambiguation when evaluating corporate customer contracts [CU015, CU016].
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU014
      - CU015
      - CU016
    tableRefs:
      - TU003
callouts:
  - calloutType: risk
    title: Public-Sector Commissioning and Budgetary Concentration Risk
    body: >-
      Cera's dominant reliance on UK local authorities and NHS Integrated Care Boards concentrates revenue exposure in publicly funded social care programs subject to statutory procurement rules and municipal fiscal strain [CU014].
    claimRefs:
      - CU014
  - calloutType: insight
    title: Data Monetization Expansion via Life Sciences RWE Partnerships
    body: >-
      By partnering with Promptly Health to commercialize real-world longitudinal geriatric data from 2.5 million monthly home visits, Cera is pursuing secondary B2B life sciences revenue streams beyond physical care delivery [CU010, CU011].
    claimRefs:
      - CU010
      - CU011
