companyProfile:
  summary: >-
    Cera is a London-based home care and community health provider founded in 2015 that combines AI-enabled scheduling,
    mobile care workflows, and predictive monitoring with direct frontline service delivery. The company serves NHS
    Integrated Care Boards, local authorities, and private-pay households across the UK and Germany, and it has scaled
    through a mix of equity and conventional debt financing. Public disclosures point to large operational throughput
    and a reported $600 million annualized revenue run-rate, but statutory margins, cash generation, and debt covenant
    details remain opaque.
