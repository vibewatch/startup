      - CV005
      - CV008
      - CV012
      - CV013
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - What Would Change View
    rows:
      - - Market & Demand
        - Aging European demographics drive shifting of care from congested hospitals to home
        - Public healthcare budgetary freezes and local authority procurement delays
        - Multi-year contracted revenue visibility with index-linked price escalation
      - - Technology Platform
        - Predictive AI reduces hospitalisations by over half and streamlines carer routing
        - AI benefits are non-defensible operational software with standard dispatch functionality
        - Peer-reviewed clinical validation demonstrating measurable readmission reduction
      - - Financial Model
        - Rapid top-line expansion from $6M to $600M annualised run rate over 5 years
        - High labor overhead across 5k-10k care workers suppresses net margins and cash conversion
        - Audited statutory accounts demonstrating positive operating cash flow after debt service
      - - Capital Structure
        - Backing from BDT & MSD Partners and Schroders validates franchise quality
        - Multiple conventional debt rounds create senior repayment claims ahead of common equity
        - Full cap-table transparency and debt refinancing with extended maturity profile
    notes: Evaluates core investment drivers against counter-theses and identifiable monitoring milestones.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Annualised revenue grows past $800M; AI routing expands EBITDA margins to 12-15%; debt refinanced
        - $1.6B-$2.0B enterprise value (2.0x-2.5x revenue multiple); 2.0x MOIC for Series C entry
        - Wage inflation accelerates; German expansion falters
        - Low (20%)
      - - Base Case
        - Revenue stabilizes near $600M-$650M; single-digit EBITDA margin (4-6%); debt service maintained
        - $900M-$1.1B valuation (1.5x revenue multiple); flat return profile near Series C post-money mark
        - Public procurement pricing caps; regulatory compliance overhead
        - Medium (55%)
      - - Bear Case
        - Public sector tariff cuts; caregiver churn elevates recruitment costs; debt covenant breach
        - $400M-$600M restructured valuation (0.7x-1.0x multiple); severe dilution to equity holders
        - Refinancing failure; loss of key NHS regional care partnerships
        - Elevated (25%)
    notes: Scenario analysis models return sensitivities against operating margin and capital structure execution.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV009
      - CV012
