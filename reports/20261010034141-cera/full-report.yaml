              - CO004
              - CO005
              - CO006
              - CO007
              - CO014
      - number: '1.5'
        title: Entity Disambiguation and Public Disclosure Screening
        blocks:
          - type: paragraph
            body: >-
              Comprehensive investment diligence requires rigorous disambiguation of Cera Care from unrelated entities
              sharing identical or similar corporate names across global databases. In automated market intelligence
              feeds, keyword search queries frequently conflate the UK digital healthcare startup with Cera Sanitaryware
              Ltd (BOM:532443), an Indian publicly traded manufacturer of architectural ceramics and bathware that
              reported Q4 FY26 EBITDA margin compression to 15.2% due to rising brass and energy input costs. Similarly,
              energy policy feeds capture CERAWeek, a premier international energy conference in Houston Texas convened
              by Daniel Yergin and attended by North American energy ministers, which bears no relation to domiciliary
              healthcare. Discarding these irrelevant corporate homonyms ensures that valuation benchmarks, risk
              signals, and regulatory assessments remain strictly anchored to Cera's genuine home care operational
              perimeter.
            claimRefs:
              - CO011
              - CO012
              - CO013
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid Digital-Physical Model Bridges NHS Capacity Gaps
            body: >-
              Cera's strategic differentiation lies in coupling machine-learning dispatch algorithms with thousands of
              directly employed frontline carers, positioning the platform as a core capacity release valve for NHS
              integrated care boards.
            calloutType: insight
            claimRefs:
              - CO003
              - CO005
          - type: callout
            title: Debt-Heavy Capital Structure and Unaudited Margin Opacity
            body: >-
              While Cera advertises a headline $1B valuation and $600M annualised run-rate, substantial portions of
              recent capital injections consist of conventional debt facilities, and consolidated gross and operating
              margins remain private.
            calloutType: risk
            claimRefs:
              - CO002
              - CO004
              - CO006
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Entity Disambiguation
        blocks:
          - type: paragraph
            body: >-
              Cera's addressable market is strictly bounded by technology-enabled domiciliary social care, community
              nursing, and post-acute virtual ward services across the United Kingdom and selected European
              jurisdictions. In contrast to facility-based residential care or acute hospital inpatient stays, Cera
              positions its software and frontline carer network to deliver home-based interventions that substitute for
              institutional hospitalization. A rigorous diligence assessment requires immediate disambiguation from
              unrelated commercial entities sharing the 'Cera' name. In automated research discovery, search aggregators
              routinely conflate Cera Care with Cera Sanitaryware Ltd (BOM:532443), an Indian publicly traded
              manufacturer of ceramic sanitaryware and faucets, as well as industrial specialty wax producers operating
              in the Cera Microcristallina and Copernicia Cerifera Cera commodity markets, and dental clear aligner
              segments. These non-healthcare manufacturing sectors represent entirely separate industrial value chains
              and must be systematically excluded from Cera's addressable healthcare market boundaries.
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: TAM Sizing Lenses and Constrained Addressability
        blocks:
          - type: paragraph
            body: >-
              Evaluating Cera's total addressable market requires a multi-lens sizing framework anchored in public
              healthcare budgets rather than top-down speculative estimates. The macro ceiling is set by total UK
              healthcare and social care spending, but Cera's realistically serviceable market is defined by the £12
              billion to £15 billion UK domiciliary care and community health services envelope. Within this envelope,
              Cera has claimed an annualized revenue run-rate of $600 million, scaling 100-fold over five years from an
              initial $6 million base. However, external market sizing benchmarks identified in automated discovery
              often misapply industrial chemical projections—such as the $1.3 billion Cera Microcristallina market or
              $412.6 million Copernicia Cerifera wax sector—which bear zero relevance to domiciliary healthcare
              delivery. Because social care commissioning in the UK is fragmented across hundreds of local councils and
              Integrated Care Boards, top-down TAM figures fail to capture localized procurement constraints, making
              contract-level budget tracking the only robust sizing methodology.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
