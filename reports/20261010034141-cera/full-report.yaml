chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Healthcare Delivery Model
        blocks:
          - type: paragraph
            body: >-
              Cera operates as a digital-first home healthcare technology and clinical services provider headquartered
              in London with statutory registration under Cera Care Limited and Cera Homecare Limited. Established in
              2015, the organisation positions itself as Europe's largest digital care provider, addressing systemic
              demographic pressures across public healthcare systems by shifting non-acute monitoring and rehabilitation
              out of overcrowded hospitals and directly into domestic settings. The operating model combines direct
              employment of community caregivers and visiting nurses with a proprietary software application that
              facilitates algorithmic route scheduling, real-time vital sign tracking, and machine-learning-driven
              deterioration prediction. This dual digital-physical posture enables Cera to contract directly with NHS
              integrated care boards, local government councils, and private payers, creating an integrated care
              management backbone that claims significant emergency hospitalisation reductions.
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: Founding Team, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              The enterprise was co-founded by physician, entrepreneur, and health policy advisor Dr Mahiben (Ben)
              Maruthappu MBE alongside technology operators Marek Sacha and Martin Ocenas. Dr Maruthappu serves as Chief
              Executive Officer, contributing deep clinical insight and health service policy relationships derived from
              advisory roles within the National Health Service. The founding complement combined digital marketplace
              execution with specialized healthcare software architecture, guiding Cera from an initial urban
              domiciliary agency to a scaled institutional provider. Governance is anchored by an external Advisory
              Board chaired by Sir David Behan, former Chief Executive of the Care Quality Commission, providing
              regulatory oversight and compliance rigor. Board composition further incorporates experienced public
              policy leaders including Lord Stewart Wood, Alzheimer's Research UK executive Hilary Evans, strategic
              communications advisor Benjamin Wegg-Prosser, and former Downing Street social care advisor Samantha Jones
              OBE.
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capitalization History, Institutional Investors, and Valuation Structure
        blocks:
          - type: paragraph
            body: >-
              Across thirteen discrete financing events since inception, Cera has raised approximately $400 million in
              aggregate institutional capital spanning equity and debt instruments. The capitalization trajectory
              accelerated in January 2025 with the completion of a $150 million Series C equity round that established a
              headline post-money valuation of $1 billion, accompanied by a synchronous conventional debt facility. Lead
              institutional sponsors include BDT & MSD Partners and Schroders Capital, joined by growth participants
              such as Guinness Global Investors, Credo Ventures, DigitalHealth.London, and Vanderbilt University.
              However, the capital structure displays material complexity: substantial funding tranches are structured
              as conventional debt rather than pure equity, and full liquidation preference schedules, loan covenants,
              and interest servicing obligations remain undisclosed in public registries. Consequently, the headline
              unicorn valuation reflects structured capital arrangements that require detailed covenant inspection.
            claimRefs:
              - CO002
              - CO004
              - CO006
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO004
              - CO006
              - CO010
      - number: '1.4'
        title: Operational Scale, Caregiver Network, and Chronological Milestones
        blocks:
          - type: paragraph
            body: >-
              From its initial London launch in 2016, Cera has expanded rapidly across England, Scotland, and Germany,
              covering an addressable catchment of 30 million individuals. The organisation delivers roughly 60,000
              community care appointments each day, representing a frontline capacity equivalent to nearly one hundred
              district general hospitals. Internal operating disclosures claim annualised run-rate revenue expansion
              from $6 million to $600 million over a five-year horizon, supported by a workforce footprint exceeding
              9,000 registered employees within main operational subsidiaries. The technology platform incorporates
              predictive AI algorithms that the company claims reduce service user falls by 20% and hospital
              readmissions by more than half. Strategic development milestones demonstrate consistent scaling from local
              domiciliary care delivery to nationwide public sector integration, culminating in the 2025 unicorn funding
              round.
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
