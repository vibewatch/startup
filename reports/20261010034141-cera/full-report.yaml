  - id: FI001
    title: Care delivery to revenue and gross profit conversion bridge
    type: flow
    summary: >-
      End-to-end operational and financial flow showing how patient referrals convert into delivered care hours, gross
      billings, and residual gross profit.
    data:
      nodes:
        - label: 1. NHS & Local Authority Referrals
          detail: Patients requiring home care or hospital discharge channeled via public procurement frameworks.
        - label: 2. Algorithmic Matching & Rostering
          detail: Cera AI platform schedules visits, matches carer skills, and optimizes travel corridors.
        - label: 3. Service Delivery & Patient Visits
          detail: Frontline carers and nurses deliver in-person care; >60,000 daily appointments claimed.
        - label: 4. Digital Logging & Fall Risk Monitoring
          detail: Carers log vital signs and risk alerts in-app, reducing falls by a claimed 20% and hospital admissions.
        - label: 5. Payer Invoicing & Framework Billing
          detail: Hourly and per-diem billing submitted to local authorities and NHS Integrated Care Boards.
        - label: 6. Direct Labor & Travel Cost Deduction
          detail: Carer hourly wages, national insurance, pension, and travel allowances deducted from billings.
        - label: 7. Residual Gross Profit & Debt Service
          detail: Net gross contribution remaining to absorb central software G&A and service $150M+ debt facilities.
    approximationNotes: >-
      Process flow models standard UK tech-enabled home care mechanics; proprietary AI routing margins vs baseline care
      delivery are estimated.
    claimRefs:
      - CI002
      - CI003
      - CI009
      - CI011
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Layered architecture map of Cera's home healthcare platform from frontline mobile capture to predictive modeling
      and NHS commissioning interfaces.
    data:
      layers:
        - label: Frontline Mobile Client & Care Capture Layer
          description: In-home caregiver application for checklist execution, vital observation, and visit confirmation.
          modules:
            - Caregiver Android and iOS mobile application
            - Structured visit logging and task checklists
            - Real-time notification and clinical supervisor alerts
        - label: Operational Logistics & Dynamic Dispatch Engine
          description: Automated routing algorithms scheduling visits and managing geographic travel corridors.
          modules:
            - Geospatial carer route optimization
            - Real-time shift matching and rescheduling
            - Travel time minimization engine
        - label: Predictive Analytics & Clinical Intelligence Layer
          description: Machine learning algorithms analyzing visit logs to forecast deterioration and fall risks.
          modules:
            - Fall risk prediction and scoring engine
            - Deterioration detection and early warning models
            - Clinical escalation recommendation rules
        - label: Workforce Recruitment & Pipeline Automation Layer
          description: Digital applicant tracking and candidate vetting engine supporting high-volume hiring.
          modules:
            - AI applicant screening and communication
            - Career Pathways training workflow
            - Back to Work program onboarding pipeline
        - label: Data Integration & Public Sector Interface Layer
          description: Data exchange interfaces connecting with NHS Integrated Care Boards and Council systems.
          modules:
            - Local Authority commissioning compliance reporting
            - NHS clinical record export adapters
            - Electronic visit verification audit logs
        - label: Core Cloud Infrastructure, Security & Compliance Layer
          description: Cloud hosting, data encryption, role-based access governance, and CQC audit logging.
          modules:
            - UK GDPR and patient data privacy controls
            - NHS Data Security and Protection Toolkit alignment
            - Audit logging and role-based access management
    approximationNotes: >-
      Architecture layers synthesized from operational disclosures, service specifications, and public healthcare IT
      standards; internal ML model parameters and API interfaces are proprietary.
    claimRefs:
      - CE004
      - CE005
      - CE007
      - CE008
      - CE012
