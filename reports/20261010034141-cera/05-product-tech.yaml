callouts:
  - calloutType: risk
    title: "Proprietary Black-Box Algorithm & Lack of Independent Clinical Trial Evidence"
    body: "Cera's marketing prominently asserts that its AI-driven predictive technology cuts hospitalisations by more than half and reduces falls by 20%. However, no independent clinical trial, peer-reviewed study, or published technical whitepaper exists in public registries to corroborate these figures. Diligence must treat these claims as unverified management metrics until partner NHS trust data can be audited."
    claimRefs:
      - CE005
      - CE008
      - CE012
  - calloutType: strength
    title: "Operational Delivery Scale Across UK Integrated Care Systems"
    body: "Delivering over one visit every second across England and Scotland provides Cera with high operational throughput and an expanding dataset of frontline home-care interactions. This high-frequency operational footprint creates data density that pure-software healthcare vendors cannot easily replicate."
    claimRefs:
      - CE001
      - CE003
      - CE004
