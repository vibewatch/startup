            body: >-
              居家医疗交付的单位经济性由一线劳动报酬、出行时间、里程报销和本地分支合规开支决定。Cera 用自研机器学习软件优化访视调度、缩短护理员通勤路线，并在急性住院前识别恶化迹象。管理层称，自动筛选系统两年处理了 1
              million 名一线候选人，以维持护理产能。即使有这些数字化工具，一线工资、雇主 National Insurance、养老金缴费和强制出行时间补偿仍占直接服务成本绝大部分。传统英国居家护理机构历史毛利率为
