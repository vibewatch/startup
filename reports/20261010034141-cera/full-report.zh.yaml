            title: 全栈交付的取舍
            body: >-
              纯护理管理软件商把软件卖给机构，能获得较高 SaaS 毛利率；Cera Care 则采用全栈模式，雇佣数千名护理人员。这样可以在每天 60,000 次访视中端到端收集数据并使用自研 AI
              路由，但业务也被线下护理固有的低毛利率、招聘摩擦和工资通胀绑住。
