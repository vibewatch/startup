            body: >-
              Cera 是技术赋能的居家医疗服务商，在英国和德国提供老年居家护理、复杂临床护理、远程医疗和支持性居住。核心商业机制依赖 NHS Integrated Care Boards
              和地方政府成人社会服务部门管理的公共采购框架。机构客户通过时薪框架协议、批量产能合同或临时出院套餐采购上门服务，以缓解急性医院床位压力。Cera
              报告其网络平均每秒完成超过一次访视，并声称数字调度和远程监测平台已为英国政府和 NHS 累计节省 £1 billion，即每日公共支出约节省 £1.5
              million。但公共采购通常受严格市政收费上限约束，收入增长需要增加线下服务时长和护理员数量，而不是靠高毛利软件许可费。
