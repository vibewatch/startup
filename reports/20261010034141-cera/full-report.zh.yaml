  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策流程展示从运营规模和 AI 声称的效果到风险逆风及跟踪立场的转变。
    data:
      nodes:
        - label: 运营规模
          description: 英国和德国每日 60,000 次社区预约，覆盖 30M 人口
        - label: 技术与有效性
          description: 据报告，AI 预测算法将住院率降低一半
        - label: 顶线扩张
          description: 自报年化运行率在五年内从 $6M 达到 $600M
        - label: 运营与利润率风险
          description: 5k-10k 名护理人员带来劳动密集度，EBITDA 利润率尚未验证
        - label: 资本结构摩擦
          description: 多项传统债务融资使 $1.0B 估值面临清算悬垂风险
        - label: 建议立场
          description: 在财务透明度提升前，维持跟踪建议和偏高估值立场
