figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Cera 从创立到 Series C 独角兽，再到拓展医疗服务的演进历程。
    approximationNotes: 里程碑日期来自 Tracxn 融资记录、英国 Companies House 注册数据和公司官方公告。
    data:
      items:
        - label: 2015 创立与注册
          date: '2015-11-15'
          detail: Cera Care Limited 在英国注册成立；由 Mahiben Maruthappu 医生、Marek Sacha 和 Martin Ocenas 共同创办。
          tone: positive
          claimRefs:
            - CO001
            - CO007
        - label: 2016 种子轮与机构支持
          date: '2016-03-04'
          detail: 首轮融资完成；开始在伦敦开展初步数字化居家护理试点。
          tone: positive
          claimRefs:
            - CO002
        - label: 2017 运营扩张
          date: '2017-04-02'
          detail: Cera Homecare Limited 注册成立；扩大护理人员网络和算法排班平台。
          tone: neutral
          claimRefs:
            - CO001
        - label: 2020 新冠疫情扩张与数字分诊
          date: '2020-06-30'
          detail: 加速推进 NHS 合作合同，缓解急症医院压力；推出预测型 AI 症状追踪。
          tone: positive
          claimRefs:
            - CO003
            - CO005
        - label: 2022 债务融资与欧洲大陆扩张
          date: '2022-08-04'
          detail: 获得由 Vanderbilt University、Jane Street 和 Schroders 领投的传统债务融资；将居家护理服务拓展至德国。
          tone: neutral
          claimRefs:
            - CO002
            - CO004
        - label: 2023 规模里程碑与创新荣誉
          date: '2023-12-31'
          detail: Cera Care Limited 收入达到 £100M-£500M 区间；赢得 Great British Entrepreneur of the Year 奖项。
          tone: positive
          claimRefs:
            - CO001
            - CO005
        - label: 2025 Series C 与 $1B 估值
          date: '2025-01-12'
          detail: 募集 $150M Series C，投后估值为 $1B；同时获得由 BDT & MSD Partners 和 Schroders Capital 共同领投的传统债务融资。
          tone: positive
          claimRefs:
            - CO002
            - CO004
        - label: 2026 运行率自报与筛查审计
          date: '2026-10-10'
          detail: 公司自称年化运行率为 $600M；尽调指出经审计集团账目和偿债细节仍未公开。
          tone: warning
          claimRefs:
            - CO003
            - CO006
