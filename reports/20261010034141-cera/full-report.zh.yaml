  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与采购结构
        blocks:
          - type: paragraph
            body: >-
              Cera 的商业客户模式主要面向机构医疗采购方，而非直接自费零售消费者，这符合英国居家医疗和社会护理行业的运营现实。核心买方是地方政府和 National Health Service (NHS)
              Integrated Care Boards (ICBs)，它们采购居家护理套餐、康复服务和急性期后出院监测。在这种机构框架中，采购决策者和付款方（议会或 NHS
              trust）与最终服务对象不同；后者通常是接受日常居家护理的 65 岁以上老年或脆弱患者。


              根据咨询机构 Faculty 对 Cera Digital Care Plan (DCP) 部署数据的分析，该平台已覆盖英国 382 个地方政府中的约 150 个，以及 42 个 NHS Integrated
              Care Boards 中的 29 个 [CU001]。这一机构足迹使 Cera 成为嵌入区域社会护理流程和公共出院路径的综合交付伙伴。除主要公共部门采购外，Cera 也开展生命科学商业合作，例如与
              Promptly Health 建立全球真实世界证据（RWE）合作，为制药企业弥补老年医学证据缺口 [CU003]。公司还保留自费老年护理渠道，但机构采购占绝大多数运营量。
            claimRefs:
