          detail: 高急症度患者出院加速和医院居家治疗合同
        - label: Cera 可服务采购区域
          value: £1.5B-£2.0B
          detail: Cera 签约的地方政府和 NHS 综合医疗委员会区域支出
        - label: Cera 居家医疗年化运行率
          value: $600M
          detail: 公司披露的年化运行率，五年内规模扩大 100x
        - label: 技术直接带来的每日节省
          value: £1.5M/day
          detail: 据称来自跌倒减少 20% 和避免住院的公共部门节省
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按数字化能力和运营交付整合度，展示英国老年护理与居家医疗服务商的战略定位。
    data:
      points:
        - label: Cera Care
          x: 8.5
          'y': 8
          description: 数字化能力高，并完整雇用运营护理人员
        - label: 传统居家护理机构
          x: 2
          'y': 8.5
          description: 完整提供一线实体护理，但自有数字化能力极少
        - label: 护理管理 SaaS（Birdie）
          x: 8.5
          'y': 2
          description: 数字化工作流工具先进，但不承担实体护理交付责任
        - label: 公共地方政府再适应服务
          x: 3
          'y': 6.5
          description: 公共部门护理协调，使用传统行政 IT
        - label: 私营住家护理服务商
          x: 2.5
          'y': 7.5
          description: 高接触、个性化的住家护理，依靠定制化非自动协调
        - label: 非正式护理人员与家庭护理者
          x: 1.5
          'y': 1.5
          description: 无偿家庭支持的现状，没有软件或正式运营基础设施
      xAxis:
        label: 技术与软件赋能
        min: 0
        max: 10
      yAxis:
        label: 护理交付与运营整合
        min: 0
        max: 10
    approximationNotes: 定位基于已报告交付模式，对技术赋能和运营整合度进行定性序数评分；坐标未按美元规模换算。
    claimRefs:
      - CP001
      - CP004
      - CP008
      - CP009
      - CP012
  - id: FI001
    title: 从护理交付到收入和毛利的转换桥
    type: flow
    summary: 展示端到端运营与财务流程：患者转介如何转化为已交付护理时长、总开票额和剩余毛利。
    data:
      nodes:
        - label: 1. NHS 与地方政府转介
          detail: 需要居家护理或出院服务的患者，经公共采购框架转介。
        - label: 2. 算法匹配与排班
          detail: Cera AI 平台安排上门服务、匹配护理技能并优化出行路线。
        - label: 3. 服务交付与患者上门
          detail: 一线护理人员和护士提供面对面护理；据称每日预约超过 60,000 次。
        - label: 4. 数字记录与跌倒风险监测
          detail: 护理人员在应用内记录生命体征和风险预警，据称将跌倒和住院减少 20%。
        - label: 5. 付款方开票与框架计费
          detail: 按小时和按日向地方政府及 NHS 综合医疗委员会提交账单。
        - label: 6. 直接人工与出行成本扣除
          detail: 从开票额中扣除护理人员时薪、国民保险、养老金和出行补贴。
        - label: 7. 剩余毛利与偿债
          detail: 剩余净毛贡献，用于承担中央软件管理费用及偿付 $150M+ 债务融资。
    approximationNotes: 流程模拟英国技术赋能居家护理的标准机制；专有 AI 路由相较基础护理交付的利润率为估算值。
    claimRefs:
      - CI002
      - CI003
      - CI009
      - CI011
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 分层展示 Cera 居家医疗平台，从一线移动端采集到预测建模和 NHS 采购接口。
    data:
      layers:
        - label: 一线移动客户端与护理采集层
          description: 供居家护理人员执行清单、观察生命体征并确认上门服务的应用。
          modules:
            - 护理人员 Android 和 iOS 移动应用
            - 结构化上门记录和任务清单
            - 实时通知和临床主管预警
        - label: 运营物流与动态调度引擎
          description: 通过自动路线算法安排上门服务并管理地理出行路线。
          modules:
            - 地理空间护理路线优化
            - 实时班次匹配与重新排班
            - 出行时间最小化引擎
        - label: 预测分析与临床智能层
          description: 机器学习算法分析上门记录，预测病情恶化和跌倒风险。
          modules:
            - 跌倒风险预测与评分引擎
            - 恶化检测与早期预警模型
            - 临床升级处置建议规则
        - label: 人员招聘与管道自动化层
          description: 支持大规模招聘的数字化申请人跟踪和候选人审核引擎。
          modules:
            - AI 申请人筛选与沟通
            - Career Pathways 培训工作流
            - Back to Work 项目入职管道
        - label: 数据整合与公共部门接口层
          description: 连接 NHS 综合医疗委员会和地方政府系统的数据交换接口。
          modules:
            - 地方政府采购合规报告
            - NHS 临床记录导出适配器
            - 电子上门服务验证审计日志
        - label: 核心云基础设施、安全与合规层
          description: 云托管、数据加密、基于角色的访问治理和 CQC 审计日志。
          modules:
            - 英国 GDPR 与患者数据隐私控制
            - NHS 数据安全与保护工具包对齐
            - 审计日志与基于角色的访问管理
    approximationNotes: 架构层根据运营披露、服务规范和公共医疗 IT 标准综合整理；内部 ML 模型参数和 API 接口属于专有信息。
    claimRefs:
      - CE004
      - CE005
      - CE007
      - CE008
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 分阶段展示公共部门和商业客户的获客、入驻、交付和扩张旅程。
    approximationNotes: 阶段和互动触点根据 NHS 采购路径及 B2B 合作结构建模。
    data:
      nodes:
        - label: 公共部门采购招标
          touchpoints:
            - Local Authority RFP & NHS ICB statutory tender qualification
            - Baseline care-hour pricing and digital scheduling compliance review
        - label: 多分支护理入驻
          touchpoints:
            - Deployment of Digital Care Plan app to frontline nurses and carers
            - Service user risk assessment and daily care schedule activation
        - label: 运营交付与远程监测
          touchpoints:
            - Daily care visits delivering symptom tracking and fall prediction
            - Real-time alert escalation to community nursing and GP teams
        - label: 急症升级与避免住院日
          touchpoints:
            - Early clinical intervention by visiting carers and community nurses
            - Reduction of avoidable A&E presentations and acute hospital bed-day usage
        - label: 结果验证与服务评审
          touchpoints:
            - Commissioning audit demonstrating reduced hospital admissions and bed-day savings
            - Council reablement outcome tracking and KPI compliance verification
        - label: 客户扩张与生命科学合作
          touchpoints:
            - Expansion into specialized complex nursing and discharge bridging
            - Secondary real-world evidence data collaboration with life sciences partners
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU010
