            body: >-
              商业融资记录显示，Cera 在 10 次历史融资事件中累计募集约 $556.7 million。近期融资结构明显转向结构化债务，而非纯股权扩张。2025 年 1 月，公司获得由 BDT & MSD
              Partners 和 Schroders Capital 主导的 $150 million 债务融资，另有未披露股权部分。此前，2022 年 8 月交易将 £130 million 股权与 Kairos HQ
              主导的等额 £130 million
              债务融资配对。资本结构中的大量债务带来强制付息和还款契约，直接消耗运营现金流。劳动力通胀期间，地方政府报销率调整往往滞后于法定最低工资上涨；沉重的偿债义务因此提高再融资脆弱性，除非运营现金流明确转正，否则资产负债表灵活性受限。
