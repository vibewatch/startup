chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与医疗服务交付模式
        blocks:
          - type: paragraph
            body: >-
              Cera 是一家总部位于伦敦、以数字化为先的居家医疗技术和临床服务商，法定注册实体为 Cera Care Limited 和 Cera Homecare Limited。公司 2015
              年成立，自称欧洲最大的数字护理服务商；它把非急性监测和康复从拥挤的医院转移到家庭，回应公共医疗体系面临的人口结构压力。运营模式一端直接雇佣社区护理员和上门护士，另一端使用自研软件进行算法路线排程、实时生命体征追踪和机器学习驱动的病情恶化预测。这个数字与线下结合的模式，让
              Cera 能直接与 NHS integrated care boards、地方政府和私人付款方签约，搭建一套据称可显著减少急诊住院的综合护理管理底座。
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: 创始团队、高管领导层与治理架构
        blocks:
          - type: paragraph
            body: >-
              公司由医生、创业者兼健康政策顾问 Dr Mahiben (Ben) Maruthappu MBE 与科技运营者 Marek Sacha、Martin Ocenas 共同创办。Dr Maruthappu 任
              CEO，凭借在 National Health Service 担任顾问时积累的临床洞察和医疗服务政策关系带领公司。创始团队把数字平台执行力与专业医疗软件架构结合，推动 Cera
              从早期城市居家护理机构成长为规模化机构服务商。治理由外部 Advisory Board 牵头，主席为 Care Quality Commission 前首席执行官 Sir David
              Behan，负责监管监督和合规把关。董事会还包括多位公共政策资深人士：Lord Stewart Wood、Alzheimer's Research UK 高管 Hilary Evans、战略传播顾问
              Benjamin Wegg-Prosser，以及前唐宁街社会护理顾问 Samantha Jones OBE。
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 资本化历程、机构投资者与估值结构
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Cera 通过 13 次独立融资事件累计募集约 $400 million 的机构资本，涵盖股权和债务工具。资本化进程在 2025 年 1 月提速：公司完成 $150 million 的 Series
              C 股权轮，名义投后估值达到 $1 billion，同时配套一笔传统债务融资。主要机构出资方包括 BDT & MSD Partners、Schroders Capital，以及 Guinness Global
              Investors、Credo Ventures、DigitalHealth.London 和 Vanderbilt University
              等成长型投资者。但资本结构相当复杂：大额融资分批采用传统债务而非纯股权，完整的清算优先权安排、贷款契约和利息偿付义务均未在公开登记中披露。因此，名义独角兽估值背后是结构化资本安排，需要详细检查债务契约。
            claimRefs:
              - CO002
              - CO004
              - CO006
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO004
              - CO006
              - CO010
      - number: '1.4'
        title: 运营规模、护理员网络与发展里程碑
        blocks:
          - type: paragraph
            body: >-
              Cera 2016 年在伦敦起步后，迅速扩展至英格兰、苏格兰和德国，覆盖 30 million 人的可服务区域。公司每天提供约 60,000 次社区护理服务，前线产能接近 100
              家地区综合医院。内部运营披露称，年化收入运行率在 5 年内从 $6 million 增至 $600 million，主要运营子公司的注册员工超过 9,000 人。技术平台采用预测性 AI
              算法，公司声称可将服务对象跌倒减少 20%，将再入院减少一半以上。发展里程碑显示，公司持续从本地居家护理交付扩展到全国公共部门整合，最终在 2025 年完成独角兽融资。
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO014
      - number: '1.5'
        title: 实体消歧与公开披露筛查
        blocks:
          - type: paragraph
            body: >-
              完整的投资尽调必须在全球数据库中严格区分 Cera Care 与其他使用相同或相近公司名称的无关实体。自动化市场情报源的关键词搜索经常把这家英国数字医疗创业公司与 Cera Sanitaryware Ltd
              (BOM:532443) 混为一谈；后者是印度上市建筑陶瓷和卫浴制造商，因黄铜和能源投入成本上升，报告 Q4 FY26 EBITDA 利润率压缩至 15.2%。同样，能源政策信息源会抓取 CERAWeek——由
              Daniel Yergin 在德州休斯敦主持、北美能源部长参加的国际能源会议——它与居家医疗没有关系。剔除这些无关同名实体，才能让估值基准、风险信号和监管评估严格锚定 Cera 真正的居家护理业务边界。
            claimRefs:
              - CO011
              - CO012
              - CO013
      - number: '1.6'
        title: 证据展项
        blocks:
          - type: callout
            title: 数字与线下结合的模式填补 NHS 产能缺口
            body: Cera 的战略差异化在于把机器学习调度算法与数千名直接雇佣的一线护理员结合起来，使平台成为 NHS integrated care boards 释放医疗产能的关键阀门。
            calloutType: insight
            claimRefs:
              - CO003
              - CO005
          - type: callout
            title: 债务偏重的资本结构与未经审计的利润率不透明
            body: Cera 宣传的名义估值为 $1B、年化收入运行率为 $600M，但近期注资中相当大部分是传统债务融资，合并毛利率和营业利润率仍未公开。
            calloutType: risk
            claimRefs:
              - CO002
              - CO004
              - CO006
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与实体消歧
        blocks:
          - type: paragraph
            body: >-
              Cera 的可服务市场严格限定为英国及部分欧洲司法辖区内由技术赋能的居家社会护理、社区护理和急性期后虚拟病房服务。不同于机构住宿护理或急性住院，Cera
              依靠软件和一线护理员网络提供居家干预，替代机构住院。严谨尽调必须立即与其他使用 “Cera” 名称的商业实体区分开。自动化研究发现中，搜索聚合器经常把 Cera Care 与印度上市陶瓷卫浴和水龙头制造商
              Cera Sanitaryware Ltd (BOM:532443) 混淆，也会混入 Cera Microcristallina、Copernicia Cerifera Cera
              工业特种蜡市场和牙科透明矫正器领域。这些非医疗制造行业属于完全不同的产业链，必须从 Cera 的医疗可服务市场边界中系统排除。
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: TAM 测算视角与受限可服务范围
        blocks:
          - type: paragraph
            body: >-
              测算 Cera 的 TAM，应以公共医疗预算为锚，采用多视角框架，而不是自上而下地猜测。宏观上限是英国医疗和社会护理总支出，但 Cera 现实可服务的市场是规模 £12 billion 至 £15 billion
              的英国居家护理和社区健康服务。Cera 声称其年化收入运行率达 $600 million，5 年内从 $6 million 起点增长 100 倍。然而，自动化发现中常见的外部市场基准会误用工业化学品预测，例如
              $1.3 billion 的 Cera Microcristallina 市场或 $412.6 million 的 Copernicia Cerifera
              蜡市场，这些与居家医疗交付完全无关。英国社会护理采购分散在数百个地方议会和 Integrated Care Boards，顶层 TAM 无法反映本地采购约束，因此只有跟踪合同级预算才是可靠的测算方法。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
      - number: '2.3'
        title: 机构买方与采购流程
        blocks:
          - type: paragraph
            body: >-
              Cera 所在市场的采购结构分成两层：护理服务的最终使用者通常不是付款方。在主要法定渠道，地方政府成人社会服务部门采购居家护理套餐，帮助老年和脆弱居民处理日常生活、个人卫生和营养维持。在第二类公共渠道，NHS
              Integrated Care Boards (ICBs)
              采购快速响应社区护理、过渡床位和虚拟病房监测，以缓解急诊拥挤、加快出院。私人自费个人及其家属代理构成第三类客户，利润率潜力更高，但获客更难。所有公共流程的采用主要由急性危机触发，例如急性入院或术后出院堵点，因此
              Cera 成为紧张公共基础设施的关键产能阀门。
            claimRefs:
              - CM001
              - CM003
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM005
      - number: '2.4'
        title: 采用驱动、运营约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Cera 的商业扩张受人口老龄化、NHS 急性床位持续短缺，以及在低成本家庭场景提供护理的经济必要性推动。公司声称，预测性 AI 软件可将服务对象跌倒减少 20%、住院减少一半以上，累计带来 £1 billion
              公共部门节省和每日 £1.5 million 节省。此外，Cera 通过全国 Back to Work 项目应对劳动力短缺，员工中 35%
              来自此前失业人群。尽管运营叙事很强，重要尽调约束仍在：公共部门节省数字是公司自报，尚无公开发表的同行评审健康经济学验证。法定护理工作本质上仍高度依赖人工，并受地方政府预算上限约束；技术调度能缓解利润压力，却无法消除。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 尽调中的商业同名混淆
            body: 投资者和自动聚合器必须把 Cera Care 的数字优先居家护理模式，与使用 “Cera” 品牌的无关工业实体严格分开，包括印度卫浴制造商和工业蜡生产商。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: callout
            title: 公共部门节省的验证缺口
            body: Cera 声称累计为 NHS 节省 £1 billion、每日财政减负 £1.5 million，这构成其商业价值主张的核心，但目前仍是公司建模结果，缺少独立第三方健康经济学验证。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与运营类型
        blocks:
          - type: paragraph
            body: >-
              英国和欧洲大陆的居家医疗、社会护理生态高度分散，法定监管严格，人口需求持续上升。Cera Care 是技术赋能的居家护理商，直接向服务对象提供老年护理、复杂护理、住家支持和远程医疗
              [CP001]。传统居家护理机构依赖人工排程和分支机构管理，Cera 则在英国和德国把数字物流与线下护理结合起来 [CP001, CP002]。竞争者可分为四类：Cera Care
              这类全栈技术服务商、地方议会采购的传统居家护理机构、Birdie 这类轻资产护理管理软件平台，以及 NHS trust 和地方议会直接运营的公共部门康复团队 [CP008, CP009]。Cera
              声称已扩张到日均 60,000 次患者服务，但传统机构凭借长期议会框架合同和本地分支网络仍占据可观区域份额 [CP002, CP010]。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP009
              - CP012
      - number: '3.2'
        title: 能力差异化与服务交付架构
        blocks:
          - type: paragraph
            body: >-
              评估居家护理商的差异化，必须把核心软件功能与一线服务执行分开看。Cera Care 的技术核心是自研移动应用和算法调度引擎，可自动规划护理员访视路线、记录访视任务，并用机器学习模型识别服务对象病情恶化的早期迹象
              [CP004]。Cera 声称这些预测算法可将可避免的急诊住院减少最多 70%，将服务对象跌倒减少 20% [CP005]。Birdie
              等纯软件厂商只向独立机构授权护理计划和电子用药管理（eMAR）平台，并不雇佣护理员；Cera 则直接雇佣并管理一线团队 [CP008, CP009]。这种垂直整合让 Cera
              能掌控护理数据和服务质量，但也背负一线医疗人员招聘、留任和临床治理责任，这是纯软件供应商完全没有的负担 [CP006, CP007]。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 定价结构、产品打包与采购动态
        blocks:
          - type: paragraph
            body: >-
              英国居家护理经济由双重付款方决定：法定公共资金与个人自费并存。绝大多数居家护理服务由地方政府议会和 NHS Integrated Care Boards (ICBs)
              通过多年框架协议采购，时薪报销受市政预算严格控制 [CP010, CP014]。Cera Care 直接参与竞争性招标，靠高访视密度和软件调度在议会价格上限内运营，同时向自费客户销售利润率更高的住家护理和个人支持
              [CP001, CP014]。B2B 软件厂商则按用户或护理员收取月度 SaaS 订阅费，避开法定收费上限，但只能分得护理总支出中的小部分软件收入 [CP008]。传统护理机构常受议会冻结费用和法定
              National Living Wage 上涨挤压，为能消除本地路线低效的技术运营商创造阶段性整合机会 [CP007, CP010]。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP010
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP014
      - number: '3.4'
        title: 护城河持久性、在位者防守与替代风险
        blocks:
          - type: paragraph
            body: >-
              Cera Care 的市场地位主要靠运营规模、算法路线密度和既有采购资质，而非专利保护技术。Cera 自报年化收入从 $6 million 增至 $600
              million，显示商业推进速度很快，但线下护理仍受严重劳动力约束和投入成本通胀影响 [CP003,
              CP007]。区域老牌居家护理商依靠与地方护理管理者的个人关系、本地家庭对品牌的信任，以及数字界面难以轻易撼动的地域根基守住市场 [CP010]。此外，Cera 临床差异化的关键部分，包括声称的住院减少和 NHS
              成本节省，在可获得的尽调文件中都没有独立第三方审计验证；若公共医疗付款方要求严格的结果证据，平台就会暴露脆弱性 [CP005,
              CP011]。尽调还发现，工业制造商和能源咨询公司等同名实体经常干扰外部市场追踪，因此必须用医疗行业一手证据核验实体级运营指标 [CP012, CP013]。
            claimRefs:
              - CP003
              - CP005
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 证据展项
        blocks:
