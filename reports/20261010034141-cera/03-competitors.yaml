callouts:
  - calloutType: "insight"
    title: "The Full-Stack Delivery Tradeoff"
    body: "Unlike pure-play care management software providers that capture high SaaS gross margins by selling software to agencies, Cera Care operates a full-stack model employing thousands of care workers. This enables end-to-end data collection and proprietary AI routing across 60,000 daily visits, but tethers the business to the low gross margins, recruiting friction, and wage inflation inherent in physical caregiving."
    claimRefs:
      - "CP002"
      - "CP007"
      - "CP009"
  - calloutType: "risk"
    title: "Incumbent Inertia in Local Authority Commissioning"
    body: "While Cera has secured contracts across both the UK and Germany, public sector domiciliary care procurement remains heavily localized and framework-driven. Incumbent regional agencies possess longstanding relationships with council social care commissioners, creating friction against rapid displacement and subjecting margins to municipal budgetary constraints."
    claimRefs:
      - "CP001"
      - "CP007"
      - "CP010"
