chapter:
  number: 4
  title: "Financials"
  summary: >
    Chai Discovery has raised approximately $230 million across three rounds in under two years, reaching a
    $1.3 billion valuation at its December 2025 Series B co-led by Oak HC/FT and General Catalyst.
    The company operates a freemium model in which Chai-1 structural prediction is free for all users
    (including commercial) and Chai-2 de novo antibody design is available only through partner engagements
    under a Responsible Deployment policy. The sole publicly confirmed revenue deal is a custom-model
    collaboration with Eli Lilly, whose financial terms are not disclosed. With an estimated headcount of
    approximately 29 employees and a capital-light, partner-dependent model, Chai's cash burn is plausibly in
    the range of $15–35 million per year, implying three-to-six-year runway from the December 2025 close.
    Critical financial metrics—revenue, ARR, burn rate, Lilly deal economics, and compute cost profile—are
    entirely undisclosed. Until Chai files an IND or discloses commercially validated milestones, financial
    diligence rests on inferred proxies rather than audited data.

sections:
  - id: revenue-model
    title: "Revenue Model and Monetization Architecture"
    body: >
      Chai Discovery operates a two-tier revenue architecture built around differentiated access to its platform
      models. Chai-1, its first-generation molecular structure prediction model released in late 2024, is available
      at no cost for all users—including commercial applications—via its web interface. Chai-1 model weights are
      open-source under the Apache 2.0 license for non-commercial use, with commercial web access provided free
      directly through the Chai platform. The Crunchbase profile for Chai Discovery specifically notes that
      "Chai-1 is available for free for commercial applications," and the Chai-1 preprint on bioRxiv confirms
      this commercial web-access model. This freemium base layer is designed to drive platform adoption, generate
      proprietary usage data, and establish Chai as the default molecular modeling tool for computational
      drug discovery teams at biopharma companies.

      Chai-2, the company's flagship de novo antibody design system, is not publicly available. Access is governed
      by a "Responsible Deployment" policy under which Chai provides selective partner access—currently only to
      named pharma collaborators. The January 2026 collaboration with Eli Lilly represents the first publicly
      confirmed commercial deal under this model: Chai will develop a purpose-built AI model trained exclusively
      on Lilly's large-scale proprietary datasets, deployed within Lilly's TuneLab frontier AI unit for biologics
      discovery across multiple drug targets. Lilly also gains access to Chai's core platform models alongside the
      custom-trained system. The financial terms of the Lilly deal—including any upfront licensing fee, milestone
      payments tied to discovery outcomes, or royalty provisions—are not publicly disclosed.

      The medium-term revenue model implied by this architecture has four components: (1) platform licensing
      fees for Chai-2 partner access, potentially structured as annual software agreements; (2) custom model
      development fees for biopharma companies that want proprietary data-fine-tuned versions (as with Lilly);
      (3) potential discovery milestone payments if Chai-generated candidates advance into preclinical or clinical
      development; and (4) a longer-horizon co-development economics layer where Chai takes financial participation
      in programs it generates if pharma partners choose a co-development structure. General Catalyst, which
      co-led the Series B, publicly projected that early adopters of AI drug design tools such as Chai's may
      see first-in-class biologics entering clinical trials by end of 2027—implying GC expects the revenue model
      to graduate from software-fee to milestone-and-royalty income within a two-year horizon.

      The company's publicly stated vision—a "computer-aided design suite" for molecules—signals ambitions toward
      a broadly accessible platform, but current commercial execution remains early-stage, partner-dependent, and
      opaque in financial terms. Chai's revenue as of May 2026 has not been publicly disclosed, and no ARR figure,
      contract count, or paying-customer number has been confirmed by the company or any third party.
