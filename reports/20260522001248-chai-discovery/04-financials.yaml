callouts:
  - calloutType: risk
    title: "Revenue Opacity Is the Dominant Financial Diligence Blocker"
    body: >
      Chai Discovery has disclosed $230 million in funding, a $1.3 billion valuation, and the existence of an
      Eli Lilly collaboration—but has disclosed zero revenue metrics. No ARR, no contract count, no deal economics,
      no burn rate, and no gross margin data are available from public sources. At a $1.3 billion valuation, this
      level of opacity creates a structurally challenged diligence environment: any financial analysis rests on
      proxy estimates rather than auditable data. The most critical immediate diligence ask is access to Chai's
      internal financial summary—specifically the Lilly deal economics, any additional partnership pipeline with
      stage and economics, and a burn rate bridge from Series B proceeds to current cash position.
    claimRefs:
      - CI027
      - CI028
      - CI029
  - calloutType: insight
    title: "The Capital-Light Model Is Chai's Most Distinctive Financial Feature"
    body: >
      Chai's complete absence of wet-lab infrastructure is a genuine structural financial advantage relative to
      its closest de novo design peers. Generate:Biomedicines operates 140,000 square feet of wet lab; AbSci
      operates 77,000 square feet. Both carry substantial fixed-cost bases. Chai's partner-dependent validation
      model allows it to operate at a fraction of these companies' cost structures—at the expense of validation
      speed and data ownership. If Chai's Chai-2 design claims hold at scale, this capital efficiency advantage
      could enable faster path to profitability at a given revenue level. If partner validation bottlenecks
      emerge—as is common in pharma collaboration timelines—the lack of owned experimental infrastructure
      could slow commercial data generation and pipeline building.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016

