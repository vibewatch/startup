  - id: financial-transparency
    title: "Financial Transparency Gaps and Diligence Asks"
    body: >
      Chai Discovery's financial picture is characterized by an unusually high ratio of capital raised to
      financial information disclosed. The company has confirmed its funding amounts, valuation, and investor
      syndicate through official press releases; everything else—revenue, ARR, burn rate, deal economics, compute
      cost, margin structure, and balance sheet—is either undisclosed or must be inferred. This opacity is
      standard for a two-year-old private company, but the $1.3 billion valuation creates a heightened burden
      of proof for diligence purposes.

      The Eli Lilly collaboration is the most material unknown. As the company's sole publicly confirmed commercial
      deal, the Lilly contract's financial structure—including any upfront payment, annual license fees, milestone
      triggers, and royalty provisions—defines Chai's current revenue trajectory. Eli Lilly, as a public company,
      may reference the collaboration in financial filings if it meets materiality thresholds, but no Lilly SEC
      disclosure has confirmed specific deal economics. The pda.org analysis of AI drug discovery's regulatory
      and commercial challenges highlights that AI platform deals typically involve milestone-based payment
      structures tied to discovery outcomes, making the economic value of early-stage collaborations highly
      contingent on candidate advancement.

      Beyond the Lilly deal, several categories of financial information are structurally absent. Chai has not
      disclosed headcount officially; the ~29-person figure from BuiltInSF is an indirect estimate. Compute
      spend is entirely opaque despite being a potential multi-million-dollar annual cost line. No contract
      pipeline, sales cycle data, or additional partner names beyond Lilly have been confirmed. The mavenbio.com
      analysis of big pharma R&D capital allocation shows that software-for-discovery tools typically command
      annual platform fees in the $1–20 million range per large pharma engagement, but actual Chai deal sizes
      cannot be estimated without deal count and contract structure.

      The drugdiscovery industry economics literature consistently shows that the transition from AI hit generation
      to clinical candidate requires substantially greater capital investment than the discovery phase itself—
      typically two to three orders of magnitude more once clinical costs are included. Chai's current model
      defers this cost to partners, which may limit upside (partner captures clinical value) while preserving
      capital efficiency in the near term. The drugdiscoverynews.com analysis of AI-transformed drug discovery
      economics highlights that AI software platforms generating discovery hits must negotiate favorable
      milestone and royalty terms early to capture long-term economic value, as pharma partners become more
      sophisticated about these terms over time.
