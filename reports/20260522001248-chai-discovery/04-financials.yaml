  evidenceGaps:
    - type: private-evidence-only
      severity: critical
      topic: revenue-and-deal-economics
      missingEvidence: >
        Complete Eli Lilly deal financial structure (upfront fee, annual license, milestone triggers,
        royalty provisions, exclusivity terms), revenue recognition policy, and Chai's total ARR
        or revenue from all partnerships as of May 2026.
      whyItMatters: >
        The Lilly deal is Chai's only confirmed commercial revenue source; without its financial
        terms, the $1.3B valuation cannot be stress-tested against actual or projected revenue
        multiples. This is the single highest-priority financial diligence item.
      diligencePath: >
        Request full deal term sheet or financial summary from Chai management; cross-reference
        any Eli Lilly SEC filings (Form 10-K, 8-K) for deal materiality disclosures; engage
        Lilly IR for confirmation of collaboration scope; request Chai P&L or revenue bridge.
      relatedQuestionRefs:
