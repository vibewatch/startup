evidenceGaps:
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Officially confirmed employee count from company HR filings, LinkedIn data, or company disclosure.
    whyItMatters: >-
      Headcount is a proxy for operational scale, burn rate, and team capacity; ~29 employees at a $1.3B valuation
      implies extremely lean structure.
    diligencePath: >-
      Request official headcount figures from Chai management; cross-check against LinkedIn employee count and
      Crunchbase staffing data.
    relatedQuestionRefs:
      - QO010
      - QO023
  - type: access-blocked
    severity: material
    topic: peer-review-status
    missingEvidence: Peer-reviewed publication confirming Chai-2 hit rate and developability claims in an independent journal.
    whyItMatters: >-
      All Chai-2 performance data rests on company-authored preprints (bioRxiv) not yet independently peer-reviewed;
      independent validation is critical before clinical deployment decisions.
    diligencePath: >-
      Monitor bioRxiv and journal submission status for Chai-2 preprints; seek independent academic replication studies;
      request peer-review timeline from company.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: minor
    topic: platform-failures
    missingEvidence: >-
      Any public or disclosed instances of Chai platform failures, false-positive designs, or targets where Chai-2
      produced zero hits.
    whyItMatters: >-
      Chai has only disclosed successes; the distribution of failure cases determines realistic platform reliability and
      shapes partner expectations.
    diligencePath: >-
      Request internal validation data from company; assess preprint supplementary materials for negative-result
      targets; engage independent biopharma scientists who may have tested early access.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: material
    topic: lilly-deal-terms
    missingEvidence: >-
      Financial terms, milestone payments, royalty structures, exclusivity provisions, and performance benchmarks of the
      Eli Lilly collaboration.
    whyItMatters: >-
      The Lilly deal is Chai's most concrete commercial validation; understanding its financial terms and performance
      conditions is critical to modeling future revenue and platform adoption.
    diligencePath: >-
      Request deal term sheet or term summary from Chai; review any SEC filings from Eli Lilly (as public company) that
      may reference collaboration economics.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete investor registry with check sizes, pro-rata rights, board observer rights, and governance provisions for
      all disclosed and undisclosed investors across seed through Series B.
    whyItMatters: >-
      Governance structure and investor control provisions affect company strategy, exit outcomes, and founder dilution;
      key smaller investors (DST Global, SV Angel, Avenir, DCVC) are not fully profiled.
    diligencePath: >-
      Review cap table through data room access; cross-check Delaware formation documents and any publicly available
      funding disclosures; request investor rights agreement.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: de-novo-antibody-design-standalone-market
    missingEvidence: >
      No analyst report isolates de novo AI antibody design as a standalone revenue category distinct from broader
      AI-assisted antibody discovery or AI drug discovery. The exact commercial addressable market for pure de novo
      antibody design platforms like Chai-2 is not quantified in public analyst coverage.
    whyItMatters: >
      Without a standalone market size for de novo antibody design, Chai's SOM estimate ($100–300M for 2026–2028) is
      inference-derived and not independently validated. This makes it difficult to assess the platform's revenue
      ceiling against the broader market it participates in.
    diligencePath: >
      Engage CRO pricing data and comparable platform deals (e.g., Isomorphic Labs, Generate Biomedicines IPO
      disclosures) to triangulate per-program economics; seek proprietary analyst research from Evaluate Pharma or
      PharmaIntelligence on computational antibody design commercial activity.
    relatedQuestionRefs:
      - QM027
  - type: private-evidence-only
    severity: material
    topic: chai-sam-validation
    missingEvidence: >
      Chai has not publicly disclosed the number of active commercial partnerships, total partner count, per-program
      economics, or pipeline of prospective buyers as of May 2026. The SOM estimate cannot be validated from public
      data.
    whyItMatters: >
      The gap between Chai's $1.3B valuation and unconfirmed commercial revenues requires investors to trust the
      platform's discovery performance and the Lilly deal as forward proxies. Without commercial pipeline disclosures,
      SOM is speculative.
    diligencePath: >
      Request Chai commercial pipeline data, LOI/MOU counts, and per-collaboration economics through data room access;
      cross-check against Eli Lilly's public disclosures for any referenced milestones.
    relatedQuestionRefs:
      - QM020
      - QM027
  - type: access-blocked
    severity: minor
    topic: market-estimate-revisions
    missingEvidence: >
      No systematic time-series of analyst estimate revisions was accessible; it is unclear whether current estimates
      represent material upward/downward revisions from prior-year forecasts or merely continuations of the same growth
      trajectory.
    whyItMatters: >
      If leading analysts have recently revised AI drug discovery estimates downward due to clinical trial failures or
      market saturation signals, current forecasts may be overstated; conversely, significant upward revisions would
      strengthen the bull case.
    diligencePath: >
      Subscribe to GVR and Mordor Intelligence annual report updates; track year-over-year estimate changes; monitor
      AllAboutAI and Axis Intelligence for quarterly market updates.
    relatedQuestionRefs:
      - QM024
  - topic: chai2-vs-absci-generate-head-to-head-benchmarks
    type: missing-source
    severity: material
    missingEvidence: >
      No publicly disclosed head-to-head benchmarking study comparing Chai-2's de novo antibody design output (affinity,
      specificity, developability) against AbSci's ACE Assay outputs or Generate:Biomedicines' Generative Biology™
      outputs on the same target classes or antigen panels.
    whyItMatters: >
      Without head-to-head benchmark data, commercial pharma partners cannot independently assess whether Chai-2
      outperforms or is merely equivalent to AbSci's and Generate:Bio's approaches on realistic discovery targets. This
      gap weakens the commercial differentiation narrative and makes it harder to evaluate Chai-2's performance claims
      relative to clinical-stage peers.
    diligencePath: >
      Request Chai-2 technical report supplementary benchmarks; search preprint servers (bioRxiv) for independent
      evaluations; seek side-by-side antibody design experiments from academic collaborators or CROs that have used both
      platforms; identify published AbSci ACE Assay performance data on common therapeutic targets.
    relatedQuestionRefs:
      - QP020
      - QP027
  - topic: competitor-pricing-and-deal-economics
    type: private-evidence-only
    severity: material
    missingEvidence: >
      Pricing terms, deal economics, and revenue sharing arrangements for Isomorphic Labs–Eli Lilly, Isomorphic
      Labs–Novartis, AbSci–Merck, AbSci–AbbVie, and Generate:Biomedicines partnerships are not publicly disclosed.
      Schrödinger enterprise license pricing is partially accessible via NASDAQ earnings disclosures but not at
      individual customer level.
    whyItMatters: >
      Without pricing comparisons, assessing competitive positioning on cost-per-program, milestone economics, or ROI
      versus status-quo alternatives (e.g., traditional CRO-based antibody discovery) is not possible. Commercial buyers
      making platform selection decisions consider cost as a primary criterion, and the absence of pricing data makes
      competitive analysis at the commercial level speculative.
    diligencePath: >
      Engage pharma procurement contacts who have evaluated multiple AI design platforms; review NASDAQ earnings call
      transcripts for Schrödinger (SDGR) and Recursion (RXRX) for per-seat or per-program revenue benchmarks; identify
      published technology licensing studies or industry reports from Evaluate Pharma or PharmaIntelligence.
    relatedQuestionRefs:
      - QP013
    relatedTableRefs:
      - TP003
  - topic: isomorphic-labs-biologics-expansion-timeline
    type: missing-source
    severity: minor
    missingEvidence: >
      No public disclosure from Isomorphic Labs confirms or denies a specific roadmap for expanding its platform from
      small molecule-primary into de novo biologics design. The company has referenced biologics capabilities in general
      terms but has not disclosed a timeline, specific biologics pipeline programs, or investment level for this
      potential expansion.
    whyItMatters: >
      If Isomorphic Labs expands into biologics design with Alphabet capital, it would become the most well-funded
      direct competitor to Chai's core market. The timeline of this potential expansion is therefore the single most
      consequential unknown in Chai's competitive risk assessment.
    diligencePath: >
      Monitor Isomorphic Labs press releases and LinkedIn posts for biologics-related hiring; track whether Isomorphic's
      pharma partnership announcements begin to reference biologics design programs; review academic preprints from
      Isomorphic-affiliated authors for biologics-targeted methodological development.
    relatedQuestionRefs:
      - QP016
      - QP026
  - type: private-evidence-only
    severity: critical
    topic: revenue-and-deal-economics
    missingEvidence: >
      Complete Eli Lilly deal financial structure (upfront fee, annual license, milestone triggers, royalty provisions,
      exclusivity terms), revenue recognition policy, and Chai's total ARR or revenue from all partnerships as of May
