  - id: milestones-and-partnerships
    title: "Milestones, Partnerships, and Adverse Context"
    body: >
      Chai's milestone cadence over its first two years is unusually fast. The company progressed from seed capital
      in September 2024 to unicorn status in December 2025—a roughly 15-month arc. Its Chai-1 and Chai-2 launches
      landed technical credibility quickly in the research community and biopharma sector. On January 8, 2026, Chai
      announced a collaboration with Eli Lilly—one of the world's largest pharmaceutical companies—under which Lilly
      will deploy Chai's AI platform across multiple drug targets and Chai will develop a purpose-built model trained
      exclusively on Lilly's proprietary large-scale datasets. The collaboration was described by at least one analyst
      as among the largest AI software deals in biotech; financial terms were not publicly disclosed. General Catalyst
      projects that early pharma adopters of tools like Chai's may see first-in-class molecules enter clinical trials
      by end of 2027.

      Against this momentum, investors and analysts note a material adverse backdrop. The broader AI drug discovery
      sector attracted more than $60 billion in venture funding since 2015 yet had not produced a single FDA-approved
      AI-designed drug as of early 2025, according to a detailed sector analysis published by LoonBio. High-profile
      first-generation AI biotechs including Exscientia, BenevolentAI, and Recursion have all seen significant
      clinical failures, pipeline reductions, and stock price collapses. Critics question whether high early-stage
      computational hit rates translate to clinical success, and whether Chai's valuation at $1.3 billion can be
      sustained without a clinical-stage asset. Chai's Chai-2 performance data rests on company-authored preprints
      that have not yet undergone peer review. As of the run date, no Chai-designed molecule has entered human
      trials. Chai's direct competitors include Isomorphic Labs, an Alphabet subsidiary led by Nobel laureate Demis
      Hassabis that raised $600 million in March 2025, as well as Formation Bio and Manas (backed by Reid Hoffman).
