callouts:
  - calloutType: strength
    title: "Breakthrough Platform Performance Claims"
    body: >
      Chai-2's reported ~16–20% de novo antibody design hit rate—supported by a June 2025 preprint testing 52
      diverse targets—represents a claimed 100-fold improvement over prior computational methods. The November 2025
      full-length mAb preprint further extends this to drug-like developability profiles (>86% clean designs),
      expanding the credibility of the platform's potential clinical relevance. The Eli Lilly collaboration in
      January 2026 provides early third-party validation of the platform's real-world applicability.
    claimRefs:
      - CO030
      - CO033
      - CO035
      - CO038

  - calloutType: risk
    title: "No Clinical-Stage Asset; Sector-Wide Translation Risk"
    body: >
      As of May 2026, no Chai-designed molecule has entered human clinical trials, and the company's performance
      data rests on company-authored preprints not yet peer-reviewed. The broader AI drug discovery sector had
      attracted over $60 billion in investment by 2025 with zero FDA approvals, and first-generation AI biotechs
      have experienced significant clinical failures and valuation collapses. Chai's $1.3 billion valuation
      implies substantial commercial expectations that are not yet supported by clinical or regulatory milestones.
    claimRefs:
      - CO040
      - CO041
      - CO042

  - calloutType: insight
    title: "Partnership Model Reduces Binary Drug Development Risk"
    body: >
      Unlike AI biotechs that own drug pipelines and absorb the full clinical failure risk, Chai's platform-as-a-
      service model means its revenue will depend on partner adoption and platform licensing rather than drug
      approvals. This reduces direct binary outcomes but shifts risk to platform adoption rate, pricing power, and
      the ability to demonstrate measurable productivity gains within partner R&D workflows—an as-yet unresolved
      commercial question at the run date.
    claimRefs:
      - CO005
      - CO008
      - CO039
      - CO044

