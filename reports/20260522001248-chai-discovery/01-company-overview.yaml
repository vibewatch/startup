  - id: funding-and-investors
    title: "Funding History and Investor Map"
    body: >
      Chai Discovery has raised capital at an exceptional pace for a two-year-old company. In September 2024, roughly
      six months after founding, it closed a $30 million seed round led by Thrive Capital, OpenAI, and Dimension
      Capital at an estimated $150 million valuation. The seed round provided initial runway and supported the
      release of Chai-1. In August 2025, the company raised a $70 million Series A led by Menlo Ventures through
      its Anthology Fund—a joint partnership with Anthropic—with participation from new investors including Yosemite,
      DST Global Partners, SV Angel, Avenir, and DCVC, and from existing backers Thrive Capital, OpenAI, and
      Dimension. The Series A valued Chai at approximately $550 million and brought cumulative funding to
      approximately $100 million. Just four months later, in December 2025, Chai closed a $130 million Series B
      co-led by Oak HC/FT and General Catalyst at a $1.3 billion valuation, achieving unicorn status. New Series B
      investors included Emerson Collective (Laurene Powell Jobs) and Glade Brook Capital. The Series B brought total
      capital raised to more than $225 million; Chai's January 2026 press release stated it had raised "nearly $230M
      to date," representing a minor rounding difference across public disclosures. The investor syndicate is notable
      for combining frontier AI investors (OpenAI, Thrive, Menlo/Anthology) with healthcare-focused growth equity
      (Oak HC/FT) and transformation-oriented venture (General Catalyst), suggesting conviction across both the
      technical and commercialization dimensions of the thesis.
