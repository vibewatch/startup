  evidenceGaps:
    - type: missing-source
      severity: minor
      topic: headcount
      missingEvidence: "Officially confirmed employee count from company HR filings, LinkedIn data, or company disclosure."
      whyItMatters: "Headcount is a proxy for operational scale, burn rate, and team capacity; ~29 employees at a $1.3B valuation implies extremely lean structure."
      diligencePath: "Request official headcount figures from Chai management; cross-check against LinkedIn employee count and Crunchbase staffing data."
      relatedQuestionRefs:
        - QO010
        - QO023

    - type: access-blocked
      severity: material
      topic: peer-review-status
      missingEvidence: "Peer-reviewed publication confirming Chai-2 hit rate and developability claims in an independent journal."
      whyItMatters: "All Chai-2 performance data rests on company-authored preprints (bioRxiv) not yet independently peer-reviewed; independent validation is critical before clinical deployment decisions."
      diligencePath: "Monitor bioRxiv and journal submission status for Chai-2 preprints; seek independent academic replication studies; request peer-review timeline from company."
      relatedQuestionRefs:
        - QO018

    - type: private-evidence-only
      severity: minor
      topic: platform-failures
      missingEvidence: "Any public or disclosed instances of Chai platform failures, false-positive designs, or targets where Chai-2 produced zero hits."
      whyItMatters: "Chai has only disclosed successes; the distribution of failure cases determines realistic platform reliability and shapes partner expectations."
      diligencePath: "Request internal validation data from company; assess preprint supplementary materials for negative-result targets; engage independent biopharma scientists who may have tested early access."
      relatedQuestionRefs:
        - QO019

    - type: private-evidence-only
      severity: material
      topic: lilly-deal-terms
      missingEvidence: "Financial terms, milestone payments, royalty structures, exclusivity provisions, and performance benchmarks of the Eli Lilly collaboration."
      whyItMatters: "The Lilly deal is Chai's most concrete commercial validation; understanding its financial terms and performance conditions is critical to modeling future revenue and platform adoption."
      diligencePath: "Request deal term sheet or term summary from Chai; review any SEC filings from Eli Lilly (as public company) that may reference collaboration economics."
      relatedQuestionRefs:
        - QO022
      relatedTableRefs:
        - TO004

