company:
  name: "Chai Discovery"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Chai Discovery is a San Francisco-based AI drug discovery company founded in 2024 by a quartet of researchers
    from OpenAI, Meta FAIR, Stripe, and Absci. In under two years it raised more than $225 million across seed,
    Series A, and a $130M Series B at a $1.3 billion valuation, then secured a landmark collaboration with Eli Lilly
    in January 2026. Its Chai-2 platform claims a ~16–20% de novo antibody design hit rate—a 100-fold improvement
    over prior computational methods—though no Chai-designed molecule has yet entered clinical trials.

sections:
  - id: identity-and-mission
    title: "Identity, Headquarters, and Mission"
    body: >
      Chai Discovery is an artificial-intelligence company headquartered in San Francisco, California, incorporated in
      early 2024. The company's stated mission is to "transform biology from science into engineering," applying
      frontier AI to predict and reprogram interactions between biochemical molecules—proteins, antibodies, nucleic
      acids, and small molecules—that underlie nearly all biological processes. Rather than building its own drug
      pipeline, Chai operates as a platform company: it develops foundation AI models and deploys them to
      biopharma partners who use the technology to accelerate early-stage therapeutic discovery. The company
      describes its vision as creating a "computer-aided design suite" for molecules, analogous to the role CAD
      software plays in mechanical and civil engineering—shifting upstream work from brute-force experimental
      screening to purposeful, computationally guided design. Chai was founded while its team was working out of
      OpenAI's San Francisco office space, reflecting the company's deep ties to the broader AI research community.
      The four co-founders—Joshua Meier, Jack Dent, Matthew McPartlon, and Jacques Boitreaud—share a decade-long
      history across Harvard research, OpenAI, Meta FAIR, Absci, Stripe, and Aqemia. OpenAI became one of the
      company's earliest seed investors. Chai operates under a "Responsible Deployment" policy, offering selective
      partner access rather than open commercial availability. As of early 2026, the company was reported to have
      approximately 29 employees, though this figure has not been officially confirmed in public disclosures.
