  - id: leadership-and-governance
    title: "Leadership, Founders, and Governance"
    body: >
      Chai Discovery's founding team combines deep AI research expertise with biopharma and large-scale engineering
      experience. Joshua Meier, co-founder and CEO, spent time on OpenAI's research and engineering team in 2018
      before joining Meta FAIR, where he co-led development of ESM1—the first transformer protein-language model
      and a foundational precursor to modern protein AI. Meier then spent approximately three years at Absci, where
      he and co-founder Matthew McPartlon led the AI division and pioneered early research on de novo antibody
      design, contributing to multiple drug candidates now in clinical trials. Jack Dent, co-founder and president,
      is a former Stripe engineering and product leader with experience building resilient large-scale machine learning
      systems; he and Meier first met in computer science classes at Harvard and were later introduced to a potential
      collaboration by OpenAI CEO Sam Altman. Jacques Boitreaud served as AI lead at Aqemia, productionizing ML
      tools for small molecule discovery. The four founders are described by investors as having a partnership "a
      decade in the making." On the governance side, Mikael Dolsten—former Chief Scientific Officer of Pfizer, where
      he oversaw the advancement of more than 150 molecules into clinical trials and the delivery of 36 approved
      medicines—joined Chai's board of directors in 2025. Following the December 2025 Series B, Annie Lamont,
      co-founder and managing partner of Oak HC/FT, and Hemant Taneja, managing director at General Catalyst,
      also joined the board. Key-person risk is elevated: Meier anchors the technical vision and team reputation
      with top-tier investors and partners.
