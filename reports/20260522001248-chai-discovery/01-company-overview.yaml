  - id: technology-platform
    title: "Technology Platform and Product Claims"
    body: >
      Chai's platform is built around two foundation model generations. Chai-1, released in late 2024 as an
      open-source model, established the company's reputation in the research community by achieving state-of-the-art
      performance in biomolecular structure prediction—roughly on par with or improving upon Google DeepMind's
      AlphaFold benchmarks in certain categories. Chai-2, unveiled June 30, 2025, is the company's flagship product
      and claims a fundamental step-change in antibody design. The model accepts only the target antigen and epitope
      as input and generates all complementarity-determining regions (CDRs) from scratch in a zero-shot setting—
      without templates, extensive screening, or prior experimental examples. In a preprint submitted to bioRxiv in
      June 2025, Chai reported a 16% hit rate across 52 diverse antibody targets, prompting fewer than 20 designs
      per target and completing wet-lab validation in under two weeks; roughly half (26/52) of targets yielded at
      least one validated hit. A companion November 2025 preprint extended these results to full-length monoclonal
      antibodies, reporting that more than 86% of Chai-2 designs showed strong developability profiles—thermostability,
      expression, purity, humanness—comparable to approved therapeutics. The same preprint demonstrated functional
      GPCR agonism and selective binding of tumor-specific neoepitopes, two categories that represent historically
      challenging drug targets. The company also reports a 68% wet-lab success rate in miniprotein binder design.
      Chai claims that a drug discovery challenge consuming over $5 million and more than three years of traditional
      R&D was resolved computationally in a few hours and validated in the lab in under two weeks. These published
      results are company-authored preprints and as of the run date have not undergone formal peer review.
