      Positions the seven main competitive entities on two evidence-backed axes: modality focus
      (x-axis, 0 = pure small molecule, 1 = pure biologics/antibodies) and clinical validation stage
      (y-axis, 0 = pre-clinical tools only, 1 = Phase 3 or commercial). Chai Discovery occupies a high
      biologics focus but low clinical-stage quadrant, sharing the biologics territory primarily with
      AbSci and Generate:Biomedicines, both of which are clinically more advanced.
