  - id: direct-peers-and-adjacent-platforms
    title: "Direct Peers and Adjacent Platforms"
    body: >
      Among Chai's most direct competitive peers, three companies stand out as particularly relevant
      for modality, capability, and commercial-stage comparison: Generate:Biomedicines, AbSci, and Isomorphic
      Labs—along with Recursion/Exscientia and Insilico Medicine as adjacent but expansive platforms.
      Generate:Biomedicines (Cambridge, MA), founded in 2019 and backed by Flagship Pioneering and ARCH
      Venture Partners, has generated and experimentally validated 42,000+ designed proteins across antibodies,
      enzymes, and other functional proteins. Its lead candidate GB-0895, a de novo designed anti-TSLP antibody
      for severe asthma, entered Phase 3 clinical trials—making Generate the most clinically advanced
      generative protein design company. Generate operates 140,000+ square feet of physical wet-lab space,
      providing an integrated design-make-test advantage that Chai's capital-light, partner-dependent model
      does not replicate. AbSci Corporation (Vancouver, WA; NASDAQ: ABSI), founded in 2011, focuses on
      AI-driven antibody and protein engineering using its ACE Assay, SoluPro® expression system, and deep
      learning platform. AbSci's ABS-201—designed de novo with AI—became the first AI de novo antibody to
      enter human Phase 1 clinical trials as of 2025, providing clinical proof-of-concept ahead of Chai.
      AbSci claims a 6-week design-to-characterization cycle that directly competes with Chai-2's rapid
      biologics design workflow. Isomorphic Labs (London), the Alphabet spinout, is the sector's most
      well-capitalized pure-play AI drug discovery company, having raised approximately $600 million in its
      November 2024 Series A. While Isomorphic's platform extends capabilities into biologics, its historical
      focus and co-development portfolio with Eli Lilly and Novartis has been predominantly small-molecule.
      Schrödinger presents a distinct competitive dynamic: its LiveDesign collaborative platform and
      physics-based tools (FEP+, Glide for docking, BioLuminate for biologics modeling) are deeply integrated
      into pharmaceutical workflows after 35+ years, creating the sector's highest switching-cost moat.
      Insilico Medicine's ISM001-055 for idiopathic pulmonary fibrosis has reached Phase 2—the furthest
      an AI-designed small molecule has advanced—demonstrating that AI drug design can produce viable clinical
      candidates even if no AI drug has received final FDA approval as of May 2026. Recursion's merged
      platform with Exscientia now spans both phenomics and AI-chemistry, but remains predominantly focused
      on small molecules with multiple Phase 1/2 candidates. Pricing across all these competitors is not
      publicly disclosed: partnerships are bespoke deal-by-deal arrangements, with Schrödinger being the
      notable exception as a licensed software platform with recurring enterprise subscription revenues.
