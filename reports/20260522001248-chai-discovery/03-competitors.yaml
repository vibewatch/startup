callouts:
  - calloutType: risk
    title: "Boltz-2 Is the Most Asymmetric Competitive Threat to Chai's Structure Prediction Value"
    body: >
      Boltz-2 (github.com/jwohlwend/boltz, MIT license) represents a category of risk distinct from
      commercial competitors: a permissively licensed open-source model that explicitly benchmarks
      against Chai-1 and adds binding affinity prediction Chai-1 lacks. Unlike AbSci or Generate:Bio,
      Boltz-2 does not need commercial traction, a sales team, or a pharma deal to displace Chai-1
      usage—a pharma computational team can simply deploy it in-house. Chai must argue that Chai-2's
      de novo design output (not just structure prediction) is what creates commercial value, because
      Chai-1's structure prediction function is already challenged by at least three permissively
      licensed open-source alternatives. This distinction—prediction vs. generation—is the central
      commercial narrative Chai must establish and defend.
    claimRefs:
      - CP017
      - CP023
      - CP036
  - calloutType: insight
    title: "The Clinical-Stage Gap Is Chai's Most Actionable Risk"
    body: >
      Every biologics-focused AI competitor that has disclosed a clinical program (Generate:Bio in Phase 3,
      AbSci in Phase 1) reached that milestone before Chai despite being founded earlier and having more
      physical wet-lab infrastructure. The commercial implication is that pharma partners will have
      independent clinical benchmark data from AbSci and Generate:Bio against which to evaluate Chai-2's
      design claims before Chai files an IND. If ABS-201 succeeds in Phase 1 and GB-0895 advances in
      Phase 3, those outcomes will establish AI de novo antibody design as a proven modality—but with
      AbSci and Generate:Bio as the definitional reference points, not Chai. Closing this gap requires
      either accelerating Chai's own IND timeline or securing additional pharma partnership data that
      can serve as surrogate clinical validation.
    claimRefs:
      - CP003
      - CP005
      - CP026
      - CP034

