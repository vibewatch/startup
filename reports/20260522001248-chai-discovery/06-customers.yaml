figures:
  - id: FU001
    title: "Customer Journey Map"
    type: journey-map
    layout: wide
    summary: >
      Six-stage journey from initial platform awareness through active multi-program deployment, illustrating
      how a pharma or biotech customer progresses from Chai-1 open-source discovery to a formal Chai-2
      collaboration agreement. Eli Lilly's completed journey through all six stages is the only confirmed
      instance; other potential partners are estimated to be at stages two through four.
    data:
      nodes:
        - id: j1
          label: "Awareness"
          description: "Researcher or BD lead encounters Chai-1 via GitHub, biorxiv preprint, or TechCrunch coverage; downloads PyPI package or uses web server for internal benchmark"
        - id: j2
          label: "Evaluation"
          description: "Internal team benchmarks Chai-1 or Chai-2 on proprietary targets; assesses hit rate vs. existing in-house tools; BD leader submits Responsible Deployment access request"
        - id: j3
          label: "Access Granted"
          description: "Chai reviews application and grants Chai-2 early-partner access; partner signs NDA and receives API access for select programs"
        - id: j4
          label: "Pilot Collaboration"
          description: "Partner runs Chai-2 on 1–3 biologic targets; evaluates antibody sequence quality, developability scores, and wet-lab validation hit rate"
        - id: j5
          label: "Partnership Agreement"
          description: "Formal multi-program collaboration signed; milestone or fee structure agreed; announced via joint press release (as with Eli Lilly, Jan 2026)"
        - id: j6
          label: "Production Deployment + Custom Model"
          description: "Chai trains custom model on partner's proprietary compound library; partner integrates Chai API into ongoing discovery workflows across multiple target programs"
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU007
      - CU009
      - CU013

