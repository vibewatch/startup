callouts:
  - calloutType: risk
    title: "Extreme Customer Concentration — Single Named Partner"
    body: >
      Eli Lilly is the sole publicly confirmed commercial partner as of May 2026. With no ARR disclosure,
      no second named customer, and no contract-duration information, investors cannot assess revenue
      sustainability. A deterioration in the Lilly relationship—whether from internal reprioritization,
      clinical program failures, or a competitive alternative—would materially impair Chai's commercial
      trajectory. The absence of a disclosed diversification timeline or logo-count target is a material
      oversight that should be addressed before Series C discussions.
    claimRefs:
      - CU001
      - CU010
      - CU026
      - CU028

  - calloutType: strength
    title: "CB Insights AI 100 and Institutional Demand Signal"
    body: >
      CB Insights named Chai in its AI 100 2026 list under Healthcare and Life Sciences, noting valuation
      growth from $150 million to $1.3 billion in fifteen months. Menlo Ventures' statement that "a meaningful
      fraction of the biotech industry" applied for Chai-2 early access suggests substantial pipeline demand.
      If Chai converts even a small percentage of applicants to paying partnerships at Lilly-scale terms,
      the growth profile improves materially.
    claimRefs:
      - CU011
      - CU012
      - CU008
      - CU036

  - calloutType: risk
    title: "No Clinical Proof and Sector Headwinds"
    body: >
      No AI-designed drug has achieved FDA approval as of 2025, and peer companies including Exscientia,
      BenevolentAI, and Recursion have suffered high-profile clinical failures. Pharma customers are
      increasingly skeptical of AI discovery tools that do not demonstrate downstream clinical value.
      Chai's 16–20% antibody design hit rate is a discovery-stage metric; without at least one candidate
      entering IND, the Lilly partnership renewal case will be difficult to build on scientific grounds alone.
    claimRefs:
      - CU030
      - CU031
      - CU032
      - CU033

  - calloutType: insight
    title: "Open-Source Developer Adoption as Commercial Funnel"
    body: >
      Chai-1's 1,938 GitHub stars and 274 forks represent a meaningful developer ecosystem for an eighteen-
      month-old company. Academic and research adopters who validate Chai-1 internally become internal
      advocates for enterprise adoption. The conversion funnel from open-source user to paying commercial
      partner is well-established in developer-tools companies, though conversion timelines in biopharma
      are substantially longer than in software due to procurement and compliance cycles.
    claimRefs:
      - CU016
      - CU017
      - CU024
      - CU040

