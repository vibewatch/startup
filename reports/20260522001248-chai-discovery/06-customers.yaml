company:
  name: "Chai Discovery"
chapter:
  number: 6
  title: "Customers"
  summary: >
    Chai Discovery's paying customer base is extremely concentrated: Eli Lilly is the sole publicly named commercial
    partner as of May 2026. The January 2026 collaboration deploys Chai's frontier AI across multiple biologic
    targets and includes custom model training on Lilly's proprietary data. Beyond Lilly, an unspecified number
    of early-access biotech companies are in pilot or partnership discussions enabled by Chai-2's July 2025 launch,
    with Menlo Ventures citing "a meaningful fraction of the biotech industry" having applied for access.
    Chai-1's open-source release has driven significant developer and academic adoption—1,938 GitHub stars and
    274 forks as of May 2026—but non-commercial users generate no direct revenue. No ARR, logo count, NPS,
    or retention metrics have been publicly disclosed. The chapter documents extreme customer concentration risk,
    an underdeveloped evidence base for post-Lilly expansion, and the broader sector challenge that no AI-designed
    drug has yet achieved FDA approval, limiting Chai's ability to demonstrate end-to-end clinical proof.

sections:
  - id: customer-segmentation
    title: "Customer Base, Buyer and User Segmentation"
    body: >
      Chai Discovery's customer structure spans three operationally distinct segments. The first is large
      pharmaceutical companies—specifically Eli Lilly—who function simultaneously as buyer, user, and payer.
      Lilly's collaboration, announced January 8, 2026, deploys Chai's frontier AI across multiple biologic
      targets and includes training a custom Chai model on Lilly's proprietary data. This represents the
      paradigmatic Chai commercial relationship: a multi-program engagement in which the pharma partner
      integrates Chai's platform into its own internal discovery workflows. The collaboration followed a
      disclosed "period of evaluation," confirming that large pharma customers subject Chai to a due-diligence
      phase before committing. No financial terms were disclosed; Chai operates a "Responsible Deployment"
      policy, selectively gating access rather than offering open commercial self-service.

      The second segment is early-access biotech partners. Chai-2's July 2025 launch explicitly opened
      partnership applications to "select partners," and Menlo Ventures, a Chai Series A lead investor,
      stated publicly that "a meaningful fraction of the biotech industry" had already applied for Chai-2
      access. None of these applicants or confirmed early-access partners have been publicly named by Chai.
      These represent pipeline—potential future paying customers—but should not be counted as confirmed revenue
      until formal agreements are announced.

      The third segment is academic, research, and non-commercial users of Chai-1, Chai's open-source
      structure-prediction model. Chai-1 is available for free download on GitHub and PyPI, and for free
      web inference at lab.chaidiscovery.com. These users drive developer ecosystem strength and brand
      credibility but are not payers unless they convert to commercial agreements. CB Insights recognized
      Chai in its AI 100 2026 list under Healthcare and Life Sciences, noting the company's rapid valuation
      growth from $150 million at seed to $1.3 billion at Series B in approximately fifteen months—further
      validating Chai's positioning in the pharma AI market even as its paying customer count remains limited.
