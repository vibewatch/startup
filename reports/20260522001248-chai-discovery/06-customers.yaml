  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: paying-customer-count
      missingEvidence: "Chai has not disclosed ARR, logo count, or any revenue figure. Only one named paying customer (Eli Lilly) has been publicly confirmed."
      whyItMatters: "Without revenue or logo disclosure, it is impossible to assess whether Chai is building a scalable customer base or remains reliant on a single anchor deal."
      relatedQuestionRefs:
        - QU014
        - QU022
        - QU028

    - type: enumeration-incomplete
      severity: material
      topic: early-access-partners
      missingEvidence: "No early-access Chai-2 partner names have been publicly disclosed despite the access program launching July 2025, ten months before this report."
      whyItMatters: "Undisclosed partnerships prevent independent verification of Chai's demand pipeline and conversion rate."
      relatedQuestionRefs:
        - QU002
        - QU012
        - QU013

    - type: missing-source
      severity: material
      topic: responsible-deployment-policy
      missingEvidence: "Chai's Responsible Deployment access policy page returned 404 during research; the policy contents and screening criteria are not publicly available."
      whyItMatters: "Without the policy text, it is impossible to assess the gatekeeping criteria, biosafety provisions, or IP protection terms that govern customer access."
      relatedQuestionRefs:
        - QU017
        - QU026

    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: "No NPS, churn rate, renewal rate, or expansion revenue metric has been disclosed for any customer segment."
      whyItMatters: "Customer retention data is essential for assessing revenue durability, especially for a company with a single named paying customer."
      relatedQuestionRefs:
        - QU015
        - QU027

    - type: missing-source
      severity: minor
      topic: independent-benchmark-replication
      missingEvidence: "No independent CRO or academic group has published a replication of Chai-2's 16–20% antibody design hit rate on external targets."
      whyItMatters: "All performance claims originate from Chai-authored preprints; independent corroboration would materially strengthen customer adoption confidence."
      relatedQuestionRefs:
        - QU019
        - QU024

    - type: stale
      severity: minor
      topic: lilly-collaboration-updates
      missingEvidence: "The Eli Lilly collaboration was announced January 8, 2026; no subsequent updates on target progress, milestone triggers, or scope changes have been disclosed in the four months since announcement."
      whyItMatters: "Without updates, investors cannot determine whether the collaboration is advancing, stalled, or expanded beyond the initial announcement scope."
      relatedQuestionRefs:
        - QU003
        - QU008
        - QU021
        - QU023

