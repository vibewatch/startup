  - id: retention-concentration-gaps
    title: "Customer Retention, Concentration Risk, and Evidence Gaps"
    body: >
      Chai's customer profile presents substantial concentration risk. Eli Lilly is the sole publicly named
      paying partner as of May 2026. No ARR, logo count, retention rate, NPS score, or any other customer
      health metric has been publicly disclosed. While the Lilly collaboration is likely multi-year given
      the scope—multiple biologic targets, custom model training—no contract duration or renewal terms have
      been announced. The absence of a second named paying customer means any deterioration in the Lilly
      relationship would materially impair Chai's commercial trajectory.

      Retention durability is also complicated by clinical translation risk. As of 2025, no AI-designed
      drug candidate has received FDA approval. Peer companies including Exscientia, BenevolentAI, and
      Recursion have experienced high-profile clinical failures that eroded pharma confidence in AI drug
      discovery platforms. The adverse source loonbio.com documents a collective $60 billion invested in
      AI drug discovery with zero FDA approvals, a dynamic that raises questions about long-term pharma
      customer willingness to pay for discovery-stage AI tools absent demonstrated clinical proof. The typical
      timeline from discovery to IND filing is four to seven years, meaning that even the earliest Chai-Lilly
      collaboration outputs are unlikely to generate clinical proof until 2029 at the earliest.

      Evidence gaps are material: no independent third-party audit of Chai's hit-rate benchmarks exists,
      the Responsible Deployment access policy has not been made publicly available, and no early-access
      biotech partner name has been disclosed. The combination of a single named customer, no disclosed
      revenue metrics, and no clinical proof creates a monitoring obligation—investors should demand
      quarterly reporting on logo count, Chai-2 partner conversion rate, and Lilly collaboration milestone
      progress before the Series B capital is fully deployed.
    claimRefs:
      - CU026
