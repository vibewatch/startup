- id: regulatory-quality-risks
  title: Regulatory and Quality Risks
  body: 'Regulatory risk is not that FDA is hostile to AI; it is that Chai still has to satisfy the same quality and clinical readiness burden as any therapeutic developer while also carrying model-specific uncertainty. FDA publishes AI guidance for software and broader discussion of AI in drug development, but neither source provides a bespoke approval pathway for AI-designed antibodies. That means Chai should be treated as a biologics discovery company that happens to use advanced AI, not as a company entitled to shortcut CMC, assay validation, or IND-quality evidence. FDA''s own CMC materials emphasize batch data, process description, purity, stability, and sterility or endotoxin control as safety-critical. Chai''s public materials do not disclose a manufacturing partner, release specification set, or stability package for any lead asset. The Lilly announcement proves commercial interest in discovery workflows, but it does not yet prove that Chai can progress an antibody through IND-enabling
    work, regulator dialogue, or manufacturing scale-up. The result is a classic biotech timing risk: discovery claims may mature much faster than quality systems and clinical evidence.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  tableRefs:
  - TR001
- id: market-competitive-risks
  title: Market and Competitive Risks
  body: 'Chai''s commercial story is still narrow in public. Eli Lilly is the only named pharma partner in fetched materials, and Chai does not disclose revenue, customer count, or retention metrics that would show whether the platform is becoming a diversified business rather than a single-anchor collaboration story. That concentration matters because the market is not waiting. AlphaFold 3 remains the benchmark reference point for biomolecular interaction prediction, while Absci, Generate Biomedicines, and EvolutionaryScale each market overlapping AI-biologics or frontier protein-model capabilities. Competition can compress pricing, lengthen procurement cycles, and make buyer proof requirements harsher—especially if pharma customers can ask why Chai is better than a mix of AlphaFold-class tools, incumbent biology teams, and rival AI-biotech vendors. The strategic twist is licensing: competitor access terms can themselves become moats or friction. In short, Chai is competing on scientific
    credibility, platform usability, and commercial terms at the same time, while public proof of partner diversification is still sparse.'
  claimRefs:
  - CR006
