  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: wet-lab-replication
    missingEvidence: Blinded third-party replication or raw assay tables for Chai-2 hit-rate claims and downstream developability outcomes.
    whyItMatters: The central product thesis depends on converting computational hits into reproducible wet-lab antibodies; company-issued benchmark claims are not enough for underwriting.
    diligencePath: Request program-level assay logs, blinded external replication, and attrition funnels from design to expressed lead.
    relatedQuestionRefs:
    - QR004
    - QR007
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: cmc-manufacturing
    missingEvidence: Named manufacturing partner(s), batch genealogy, release specs, stability data, impurity controls, and sterility or endotoxin plans for any lead candidate.
    whyItMatters: FDA CMC requirements can stop a program before or during IND if process and quality systems lag the science.
    diligencePath: Review pre-IND decks, CMC workstreams, analytical methods, and manufacturing contracts for the most advanced program.
    relatedQuestionRefs:
    - QR009
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: capital-efficiency
    missingEvidence: Quarterly burn, runway, headcount cost, and partner revenue concentration metrics are not publicly disclosed.
    whyItMatters: Without capital-efficiency disclosure, investors cannot determine whether recent funding is enough to reach next value-inflection points.
    diligencePath: Request monthly cash burn, committed compute spend, wet-lab budget, and partner-revenue waterfall through next financing gate.
    relatedQuestionRefs:
    - QR014
    - QR029
    relatedTableRefs:
    - TR005
  - type: enumeration-incomplete
    severity: material
    topic: partner-diversification
    missingEvidence: Only one named pharma partner is public; the rest of the partner pipeline is undisclosed.
    whyItMatters: A single-anchor commercial story creates concentration risk and weakens negotiating leverage with future buyers.
    diligencePath: Request full partner pipeline, stage, scope, renewal probability, and contribution to future revenue forecasts.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR024
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: governance-controls
    missingEvidence: Public materials do not show a detailed responsible-deployment policy, biosecurity red-team process, or formal succession plan for key technical leaders.
    whyItMatters: Open biological model distribution raises misuse risk while a small founder-heavy team raises execution concentration risk.
    diligencePath: Review governance documents, board committees, model-access controls, incident procedures, and named succession coverage for the top four leaders.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR020
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
