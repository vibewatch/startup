- id: ip-legal-biosecurity-risks
  title: IP, Legal, and Biosecurity Risks
  body: 'The most explicitly adverse evidence in this chapter concerns IP boundary-setting and biosecurity. Chai has chosen a relatively open software posture for Chai-1, releasing code and weights under Apache 2.0 and distributing artifacts through multiple developer channels. That choice accelerates ecosystem adoption, but it also reduces the amount of product moat that can be attributed purely to software packaging. At the same time, the surrounding market shows how unstable the policy environment can become: AlphaFold 3''s release sparked a public fight over code access, and DeepMind''s published terms reserve weights for non-commercial use only. Independent biosecurity literature goes further, arguing that advanced biological AI models can present dual-use capabilities of concern and may warrant safeguards or restrictions. For Chai, this creates a double bind. If access is too open, misuse and leakage risk rise; if access is too restrictive, commercial conversion and community adoption
    slow. The company needs explicit governance, logging, and deployment controls to keep that trade-off investable.'
  claimRefs:
  - CR032
  - CR033
  - CR037
  - CR038
  - CR039
  - CR040
  - CR043
