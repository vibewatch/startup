callouts:
- calloutType: risk
  title: The thesis still hinges on a science-to-wet-lab leap that outsiders cannot yet reproduce
  body: Chai's most commercially important claim—the Chai-2 antibody hit-rate improvement—remains sourced to company-issued financing material. Independent replication and raw assay disclosure are still missing from public materials, while external reviews say developability attrition remains a major bottleneck even after a promising binder is found.
  claimRefs:
  - CR012
  - CR018
  - CR034
- calloutType: insight
  title: Open distribution cuts both ways
  body: GitHub, Hugging Face, PyPI, and a hosted lab product make Chai visible and developer-friendly. The same openness can narrow software exclusivity, create misuse surface, and force the company to defend its moat through proprietary data, wet-lab execution, and partner relationships instead of code alone.
  claimRefs:
  - CR002
  - CR037
  - CR043
  - CR045
- calloutType: recommendation
  title: 'Diligence priority: replication package, second partner, and CMC readiness'
  body: 'Before underwriting more upside, investors should demand three things: blinded wet-lab replication of Chai-2 claims, visibility into whether Lilly is still the only named partner, and concrete CMC evidence for the lead program''s path to IND. These are the cleanest external thesis-break triggers for the current thesis.'
  claimRefs:
  - CR023
  - CR026
  - CR034
  - CR046
