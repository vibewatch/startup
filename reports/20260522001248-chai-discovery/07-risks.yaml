company:
  name: Chai Discovery
chapter:
  number: 7
  title: Risks and Risk Mitigation
  summary: 'Chai Discovery faces a compound risk stack typical of frontier-biology platforms: public model benchmarks and partnership announcements are advancing faster than independent wet-lab replication, CMC readiness, and diversified commercial proof. The central scientific risk is that strong structure or hit-rate claims may not survive downstream developability screens such as aggregation, poor expression, instability, or immunogenicity. Regulatory risk remains meaningful because FDA discusses AI in software and drug development but does not provide a dedicated pathway for AI-designed antibodies, while standard biologics CMC burdens still apply. Commercially, Lilly is the only publicly named pharma partner in fetched sources, competition from AlphaFold3-adjacent and AI-biologics players is intense, and reported private-round valuations raise the cost of delay. Open software distribution also creates governance, IP-boundary, and biosecurity exposure that the company will need to manage
    explicitly.'
sections:
- id: technical-scientific-risks
  title: Technical and Scientific Risks
  body: 'Chai''s technical promise is ambitious: the company markets Chai-2 as de novo antibody design with atomic precision, while Chai-1 is positioned as an open, state-of-the-art multimodal structure model. The risk is not that the models are uninteresting; it is that benchmark quality and therapeutic quality are not the same thing. Chai''s public evidence still sits mainly in a preprint stack and company-authored launch material rather than in independent, peer-reviewed translational studies. The strongest external reviews in this chapter all point to the same failure mode: even if a model proposes binders or plausible structures, antibodies still fail later because of aggregation, poor expression, instability, clipping, off-target interactions, or immunogenicity. Chai has not published raw wet-lab data or third-party replication sufficient to independently verify its most commercially important claim—the near-20% Chai-2 hit rate. That gap does not invalidate the company, but it does
    mean investors are still underwriting a partially black-box science-to-product conversion problem rather than a fully proven platform.'
  claimRefs:
