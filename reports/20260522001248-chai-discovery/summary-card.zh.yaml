  topStrengths:
    - >-
      突破性基准表现：Chai-2 声称在 52 个多样化靶点上 de novo 抗体命中率约 16–20%，比此前低于 0.1% 的计算领域最优水平高出 100× 以上；设计出的全长 mAbs 中，86%+
      达到已获批疗法的可开发性基准，并在 GPCR、肿瘤新抗原等历史难题靶点上实现功能成功。
    - >-
      一线创始团队，罕见跨学科深度：Meier（Meta FAIR ESM1 共同负责人、Absci AI 负责人）、McPartlon（Absci de novo 抗体设计）、Dent（Stripe 基础设施）和
      Boitreaud（Aqemia ML）把前沿蛋白 AI 研究与大规模工程履历结合在一起。
    - >-
      顶级投资人和董事会构成：Oak HC/FT、General Catalyst、Thrive Capital、OpenAI 和 Menlo Ventures 参与三轮融资；董事 Mikael Dolsten（前 Pfizer
      CSO，150+ 个临床项目、36 个获批项目）以及投资人 Annie Lamont、Hemant Taneja，显示机构信心高，也能打开深度生物制药网络。
    - Eli Lilly 合作验证平台质量：与全球前五药企开展定制模型合作，覆盖多个 biologic 靶点，并用 Lilly 专有数据训练；这是现阶段最严格商业验证，也削弱了“没有真实药企客户”的叙事风险。
    - 轻资产、高潜在毛利模式：公司不自建湿实验室基础设施（相比 Generate:Biomedicines 的 140,000 sq ft），约 29 名员工即可运营；若平台靠合作交易规模化，软件经济性有望带来结构性更高毛利。
  topRisks:
    - >-
      基准证据完全由公司撰写且未经评审：所有 Chai-2 性能主张都来自 biorxiv 预印本，尚未经历同行评审；截至
      2026-05-22，独立湿实验室复现实验包仍未发表。若后续可开发性筛查（聚集、稳定性、免疫原性、表达不佳）暴露公司实验未捕捉的缺口，复现风险会很大。
    - 客户极端集中且没有财务披露：Eli Lilly 是唯一公开点名的商业伙伴；交易条款、ARR、合同数量和收入全部未披露，仅凭公开来源无法验证商业牵引力和财务健康度。
    - >-
      估值溢价要求多个正面结果同时兑现：在无披露收入情况下拿到 $1.3B 估值，Series C 投资人需要湿实验室验证、Lilly ARR 高于约
      $15M、以及至少新增一家具名药企伙伴同时成立，才能支撑该估值；若三项都缺席，基于公开可比 DCF 分析，估值结构上应下调 30–50% 至 $700M–$900M。
    - >-
      没有临床概念验证，也缺监管路径清晰度：截至 May 2026，没有 Chai 设计分子进入 IND 或临床试验；FDA 没有为 AI 设计 biologics 提供专门审批路径；Chai
      也未披露任何资产的制造伙伴、工艺规模或稳定性包。
    - 关键人物集中，团队可见度有限：Joshua Meier 支撑技术身份、投资人关系和合作战略；约 29 人团队公开治理面有限；若 Meier 或其他联合创始人离开，技术路线图和合作伙伴 pipeline 都会明显受损。
    - >-
      竞争和生物安全逆风：Isomorphic Labs（融资 $600M、Alphabet 背书）、Generate:Biomedicines（估值
      $1.9B、湿实验室一体化）、AbSci（上市公司）和开源替代方案（Boltz-2、ESMFold）都在争夺药企注意力和人才；此外，前沿蛋白设计 AI 的 dual-use 生物安全担忧，可能带来监管压力。
  unresolvedGaps:
    - Eli Lilly 合作的收入、ARR、烧钱速度和交易经济性完全未披露；没有 data room access，就无法独立验证财务风险画像和隐含估值。
    - Chai-2 de novo 抗体命中率和可开发性主张仍没有独立、同行评审的湿实验室复现；复现风险是科学尽调中最高优先级。
    - Lilly 之外尚无其他具名 pharma 或 biotech 伙伴获确认；early-access partner pipeline 的规模和状态未知，客户集中度风险无法量化。
    - 股权结构、优先股堆叠和稀释画像不公开；缺少这些信息，下行情景收益建模无法完成。
    - 没有披露 IND 阶段项目、制造伙伴、CMC 包或监管沟通，无法确认任何 Chai 设计分子是否走在可信临床入组路径上。
    - 估计员工数（约 29 人）和计算支出未经确认；烧钱速度估计（$20–35M/year）置信度低，没有官方披露就不能用于评估现金跑道。
