summary:
  headline: Chai Discovery 是技术上可信的 AI 抗体平台，背后有蓝筹投资人和标志性 Lilly 合作；但 $1.3B 估值完全押在未经验证的预印本基准、单一披露收入伙伴和零公开财务数据上，任何投入前都需要更深尽调。
