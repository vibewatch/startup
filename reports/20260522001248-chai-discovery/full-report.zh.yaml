      - number: '1.5'
        title: 里程碑、合作与反向背景
        blocks:
          - type: paragraph
            body: >
              Chai 在前两年的里程碑节奏异常快。公司从 2024 年 9 月拿到种子轮，到 2025 年 12 月成为独角兽，全程约 15 个月。Chai-1 和 Chai-2
              的发布，让公司很快在研究社区和生物制药行业获得技术可信度。2026 年 1 月 8 日，Chai 宣布与全球最大制药公司之一 Eli Lilly 合作：Lilly 将在多个药物靶点上部署 Chai 的 AI
              平台，Chai 则会开发一个专用模型，仅用 Lilly 专有的大规模数据集训练。至少一位分析师将该合作描述为生物技术领域最大的 AI 软件交易之一；财务条款未公开。General Catalyst 预计，像
              Chai 这类工具的早期制药采用者，可能会在 2027 年底前看到 first-in-class 分子进入临床试验。

              动能之外，投资者和分析师也指出了实质性反向背景。LoonBio 发布的一份详细行业分析显示，自 2015 年以来，更广泛的 AI 药物发现行业吸引了超过 $60 billion 风险投资，但截至 2025
              年初仍未产出一款获得 FDA 批准的 AI 设计药物。Exscientia、BenevolentAI、Recursion 等高知名度第一代 AI
              生物技术公司，都经历了重大临床失败、管线缩减和股价崩跌。批评者质疑，早期计算命中率高能否转化为临床成功，也质疑 Chai 在没有临床阶段资产的情况下，能否支撑 $1.3 billion 估值。Chai 的
              Chai-2 性能数据建立在公司撰写、尚未同行评审的预印本之上。截至运行日期，没有任何 Chai 设计的分子进入人体试验。Chai 的直接竞争对手包括 Isomorphic Labs——由 Nobel
              laureate Demis Hassabis 领导的 Alphabet 子公司，2025 年 3 月融资 $600 million——以及 Formation Bio 和 Reid Hoffman 支持的
              Manas。
