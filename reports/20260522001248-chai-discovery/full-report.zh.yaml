      - number: '1.3'
        title: 融资历史与投资者版图
        blocks:
          - type: paragraph
            body: >
              对一家成立两年的公司来说，Chai Discovery 的融资节奏异常快。2024 年 9 月，成立约六个月后，公司完成 $30 million 种子轮，由 Thrive Capital、OpenAI 和
              Dimension Capital 领投，估值约 $150 million。种子轮提供了初始现金跑道，并支持 Chai-1 发布。2025 年 8 月，公司完成 $70 million Series A，由
              Menlo Ventures 通过 Anthology Fund 领投；Anthology Fund 是 Menlo 与 Anthropic 的联合基金。新投资方包括 Yosemite、DST Global
              Partners、SV Angel、Avenir 和 DCVC，老股东 Thrive Capital、OpenAI 和 Dimension 也继续参与。Series A 将 Chai 估值推至约 $550
              million，累计融资约 $100 million。仅四个月后，2025 年 12 月，Chai 完成 $130 million Series B，由 Oak HC/FT 和 General Catalyst
              共同领投，估值 $1.3 billion，成为独角兽。Series B 新投资方包括 Emerson Collective（Laurene Powell Jobs）和 Glade Brook
              Capital。Series B 后累计融资超过 $225 million；Chai 2026 年 1 月新闻稿称公司「迄今已融资近 $230M」，与其他公开披露存在轻微四舍五入差异。投资者组合值得注意：前沿
              AI 投资方（OpenAI、Thrive、Menlo/Anthology）与医疗健康成长股权投资方（Oak HC/FT）和转型导向风投（General
              Catalyst）同时在场，说明技术和商业化两个维度都获得了信任。
