      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              AI 药物发现平台的主要买方是制药公司和生物技术公司，两者合计占 2025 年 AI 制药 R&D 支出的 59.45%。在这一群体中，大型制药公司（年 R&D 预算超过 $8 billion，例如 Eli
              Lilly、AstraZeneca、Roche 和 Novartis）支出最高，但采用外部新平台较慢。它们通常通过研究合作、股权投资或里程碑驱动的授权协议接触 AI 发现公司；Eli Lilly 仅在 2026
              年 Q1 签署的 AI 药物发现交易总额就超过 $3.75 billion，正是例证。中型和专科制药公司往往每年向 AI 药物发现分配 $10–50
              million，主要通过里程碑驱动合作，而不是大额前期承诺。AI-native 生物技术公司是增长最快的买方分部，AI 采用率比大型制药公司高 73%。它们在整个管线中部署
              AI，也是重要的转介绍和验证渠道。传统生物技术公司更挑剔，通常只运行一两个 AI 试点。合同研究组织（CRO）是按 CAGR 计算增长最快的终端用户分部（到 2031 年为 33.15%），因为它们整合 AI
              能力，为制药客户提供扩展后的发现服务。高校和研究机构是增长中的分部，但不是主要商业预算持有者。预算负责人通常是 Discovery Biology 负责人或首席科学官，采购中也越来越多涉及首席 AI
              官和平台架构师。采用触发点通常是：某一具体靶点类别上，传统方法已经失败或太慢，同时专利悬崖时间表带来压力。
