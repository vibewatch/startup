  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 的收入架构分两层，核心是对平台模型开放不同级别的访问。第一代分子结构预测模型 Chai-1 于 2024 年末发布，所有用户都可通过网页界面免费使用，商业用途也包括在内。Chai-1
              模型权重按 Apache 2.0 许可证开源，但仅限非商业用途；商业网页访问则由 Chai 平台直接免费提供。Chai Discovery 的 Crunchbase 资料特别写明，“Chai-1
              可免费用于商业应用”，Chai-1 在 bioRxiv 上的预印本也确认了这种商业网页访问模式。这个免费增值底座意在拉动平台采用，沉淀专有使用数据，并让 Chai
              成为生物制药公司计算药物发现团队默认使用的分子建模工具。

              Chai-2 是公司的旗舰级从头抗体设计系统，目前不公开开放。访问由一套“负责任部署”政策约束，Chai 只向经过选择的合作伙伴开放；目前仅限具名药企合作方。2026 年 1 月与 Eli Lilly
              的合作，是该模式下首个公开确认的商业交易：Chai 将开发一个专用 AI 模型，只用 Lilly 的大规模专有数据训练，并部署到 Lilly 的 TuneLab 前沿 AI
              单元，用于多个药物靶点的生物制剂发现。除定制训练系统外，Lilly 还可访问 Chai 的核心平台模型。Lilly 交易的财务条款没有公开披露，包括任何预付许可费、与发现成果挂钩的里程碑付款或特许权使用费安排。

              这套架构暗示的中期收入模型有四块：（1）面向 Chai-2 合作伙伴访问的平台许可费，可能按年度软件协议设计；（2）面向希望基于专有数据微调版本的生物制药公司的定制模型开发费，Lilly 即属此类；（3）如果
              Chai 生成的候选物推进到临床前或临床开发，可能获得发现里程碑付款；（4）更长期的共同开发收益层，即药企伙伴选择共同开发结构时，Chai 参与其生成项目的经济收益。共同领投 Series B 的 General
              Catalyst 公开预测，Chai 等 AI 药物设计工具的早期采用者，可能在 2027 年底前看到同类首创生物制剂进入临床试验；这意味着 GC 预计收入模型将在两年内从软件费用升级为里程碑和特许权使用费收入。

              公司公开愿景是打造一套分子“计算机辅助设计套件”，这表明其志向是做更广泛可访问的平台。但当前商业落地仍处早期，依赖合作伙伴，财务条款也不透明。截至 2026 年 5 月，Chai
              的收入尚未公开披露；公司或任何第三方都没有确认 ARR、合同数量或付费客户数量。
