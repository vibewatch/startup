      - number: '6.3'
        title: 客户留存、集中度风险与证据缺口
        blocks:
          - type: paragraph
            body: >
              Chai 的客户画像存在显著集中度风险。截至 2026 年 5 月，Eli Lilly 是唯一公开具名的付费合作伙伴。公司没有公开披露 ARR、logo 数、留存率、NPS
              分数或任何其他客户健康指标。鉴于合作范围包括多个生物制剂靶点和定制模型训练，Lilly 合作很可能是多年期；但合同期限或续约条款没有宣布。第二个具名付费客户缺席，意味着 Lilly 关系若出现恶化，将实质性损害
              Chai 的商业轨迹。

              留存韧性也被临床转化风险复杂化。截至 2025 年，没有任何 AI 设计药物候选物获得 FDA 批准。Exscientia、BenevolentAI、Recursion 等同行公司经历了知名临床失败，削弱了药企对
              AI 药物发现平台的信心。反向来源 loonbio.com 记录称，AI 药物发现累计投入 $60 billion，却没有 FDA 批准；这一动态会让人质疑，缺乏已证明临床证据时，药企客户是否愿意长期为发现阶段
              AI 工具付费。从发现到 IND 申报的典型时间线是四到七年，意味着即便最早的 Chai-Lilly 合作产出，最早也不太可能在 2029 年之前产生临床证据。

              证据缺口很重要：没有独立第三方审计 Chai
              的命中率基准，“负责任部署”访问政策没有公开，早期访问生物技术合作伙伴的名称也没有披露。单一具名客户、无披露收入指标、无临床证据三者叠加，形成了监控义务——投资人应要求在 Series B
              资本完全部署之前，按季度报告 logo 数、Chai-2 合作伙伴转化率和 Lilly 合作里程碑进展。
