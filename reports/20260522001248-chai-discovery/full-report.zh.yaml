  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，AI 药物发现竞争格局包含五类功能上不同的竞争者，各自瞄准相互重叠但有差异的买方需求。第一类是 AlphaFold 谱系的结构预测和通用 AI 平台——主要是 Isomorphic
              Labs（Alphabet spinout），其在 2024 年 11 月 Series A 融资约 $600 million，并把 AlphaFold 衍生模型用于小分子药物设计。Isomorphic
              主要聚焦小分子，公开伙伴包括 Eli Lilly 和 Novartis，与 Chai 生物药优先的方向不同，但争夺同一制药 R&D 预算和伙伴关系。第二类是全栈 AI 药物发现编排平台——Recursion
              Pharmaceuticals（NASDAQ: RXRX）于 2025 年完成收购 Exscientia，形成覆盖基于 phenomics 的靶点发现到 AI 化学候选物设计的端到端平台；Insilico
              Medicine 则运营 Pharma.AI 平台，覆盖靶点识别（Biology42）、分子设计（Chemistry42）和临床优化（Medicine42）。Recursion 通过 BioHive-2
              机器人基础设施生成超过 50 petabytes 专有实验数据，构成行业内最强的数据护城河。第三类是面向蛋白和抗体设计的生成生物学公司——Generate:Biomedicines 的
              GB-0895（anti-TSLP）已进入重度哮喘 Phase 3，且已生成并测试 42,000+ 个蛋白；AbSci 的 ABS-201 是首个进入人体临床试验的 AI 设计从头抗体。两者都是 Chai
              生物药设计抱负的直接类比对象，但临床验证更早。第四类是物理 + ML 混合既有玩家：Schrödinger（NASDAQ: SDGR）运营超过 35 年，与 1,750+
              制药和生物技术客户保持授权关系，并用可解释的物理方法（FEP+、Glide、BioLuminate）区别于纯深度学习路径。第五类是开源和学术替代方案，下一节会详细讨论；它们对 Chai
              的结构价值主张构成最不对称的商品化威胁。
