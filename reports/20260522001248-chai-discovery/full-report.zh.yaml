      - number: '3.2'
        title: 直接同行与相邻平台
        blocks:
          - type: paragraph
            body: >
              在 Chai 最直接的竞争同行中，三家公司在 modality、能力和商业阶段对比上尤其相关：Generate:Biomedicines、AbSci 和 Isomorphic
              Labs；Recursion/Exscientia 与 Insilico Medicine 则是相邻但覆盖更广的平台。Generate:Biomedicines（Cambridge, MA）成立于 2019
              年，由 Flagship Pioneering 和 ARCH Venture Partners 支持，已经在抗体、酶和其他功能蛋白中生成并实验验证 42,000+ 个设计蛋白。其领先候选物 GB-0895
              是一款从头设计的 anti-TSLP 抗体，用于重度哮喘，已进入 Phase 3 临床试验，使 Generate 成为临床推进最靠前的生成蛋白设计公司。Generate 拥有 140,000+
              平方英尺实体湿实验空间，形成一体化设计-制造-测试优势；Chai 的轻资产、依赖伙伴模式无法复制这一点。AbSci Corporation（Vancouver, WA；NASDAQ: ABSI）成立于 2011
              年，聚焦用 ACE Assay、SoluPro® 表达系统和深度学习平台推进 AI 驱动的抗体与蛋白工程。AbSci 的 ABS-201 由 AI 从头设计，截至 2025 年成为首个进入人体 Phase 1
              临床试验的 AI de novo 抗体，比 Chai 更早提供临床概念验证。AbSci 声称拥有 6 周设计到表征周期，直接竞争 Chai-2 的快速生物药设计工作流。Isomorphic
              Labs（London）是 Alphabet spinout，也是行业内资本最充足的纯 AI 药物发现公司，2024 年 11 月 Series A 融资约 $600 million。尽管 Isomorphic
              平台能力延伸到生物药，其历史聚焦和与 Eli Lilly、Novartis 的共同开发组合主要仍是小分子。Schrödinger 呈现出不同竞争动态：其 LiveDesign 协作平台和基于物理的工具（用于
              docking 的 FEP+、Glide，以及用于生物药建模的 BioLuminate）经过 35+ 年已经深度嵌入制药工作流，形成行业最高的切换成本护城河。Insilico Medicine 的
              ISM001-055 用于特发性肺纤维化，已进入 Phase 2，是 AI 设计小分子推进最远的案例；即使截至 2026 年 5 月没有 AI 药物最终获得 FDA 批准，它也表明 AI
              药物设计可以产出可行临床候选物。这些竞争者的定价均未公开披露：合作通常是一单一议的定制安排，Schrödinger 是一个显著例外，它作为授权软件平台拥有经常性企业订阅收入。
