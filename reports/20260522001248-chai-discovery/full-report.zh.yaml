        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery 不是一个容易做空的投资论点：公司融资金额可观，招到的创始团队具备真实的前沿模型信誉，并说服 Eli Lilly 用专有生物制剂数据开展定制模型合作。公司 2024
              年才成立，这些证明点并不常见。但这些证明点不会自动让最近披露的价格变得有吸引力。在 $1.3 billion 的 Series B 估值上，Chai 已经按严肃 AI
              生物技术平台定价，尽管公开材料仍未披露收入、ARR、利润率或任何临床阶段资产。因此，合适的建议是跟踪，而不是买入，也不是回避。跟踪意味着技术故事真实，并已有一个高质量战略客户；同时也意味着当前估值给执行失误留下的余地很小。投资人应把
              Chai 当作一份押注未来证明的期权，而不是一个已降风险的软件或生物技术运营模型。公司能够证明重复客户需求、更清晰的商业经济性，或 Lilly 之外的转化证据之前，入场纪律应保持严格，并对价格敏感。
