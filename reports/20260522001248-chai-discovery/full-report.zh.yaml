chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与使命
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 是一家人工智能公司，总部位于 California 州 San Francisco，2024 年初注册成立。公司自称使命是「把生物学从科学变成工程」，用前沿 AI
              预测并重写生化分子之间的相互作用——蛋白质、抗体、核酸和小分子几乎支撑着所有生物过程。Chai 不建设自己的药物管线，而是以平台公司运作：开发 AI
              基础模型，并部署给生物制药伙伴，让对方加速早期疗法发现。公司将愿景描述为打造分子的「计算机辅助设计套件」，类似 CAD
              软件在机械和土木工程中的角色——把上游工作从蛮力实验筛选，转向有目的、由计算引导的设计。Chai 创立时，团队在 OpenAI 的 San Francisco 办公空间工作，反映出公司与更广泛 AI
              研究社区的深度联系。四位联合创始人 Joshua Meier、Jack Dent、Matthew McPartlon 和 Jacques Boitreaud，在 Harvard 研究、OpenAI、Meta
              FAIR、Absci、Stripe 和 Aqemia 之间有长达十年的交集。OpenAI 是公司最早的种子轮投资方之一。Chai 按「Responsible
              Deployment」政策运营，选择性开放伙伴访问，而非全面商业开放。截至 2026 年初，据报道公司约有 29 名员工，但该数字未在公开披露中得到官方确认。
