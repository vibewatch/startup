      - number: '4.2'
        title: 成本结构、单位经济与资本强度
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 的成本结构主要由两项构成：人力资本（旧金山的 AI 研究人才）和算力基础设施（AI 模型训练与推理）。根据 BuiltInSF 的间接报道，截至 2026 年初，公司约有 29
              名员工；该数字尚未得到官方确认。旧金山 AI 公司若处在这一人才层级，含税含福利的单人年成本通常在 $250,000 至 $400,000 之间，意味着估算年薪资消耗约为 $7–12
              million。管理层称代码库完全自研——“我们代码库里的每一行代码都是自研的”——不使用现成大语言模型，架构也高度定制；这说明技术团队偏向资深 AI 研究员，薪酬大概率落在区间上沿。

              算力成本是关键且未披露的第二条成本线。Chai 训练其规模下的前沿蛋白质结构预测和从头设计模型，需要大量 GPU 算力。行业基准显示，训练 Chai-2 这一级别的前沿 AI 生物模型，每次主要训练运行成本约在
              $1–15 million，合作伙伴部署还会叠加持续推理成本。Lilly 合作明确涉及在 Lilly 专有数据上训练定制模型，这会产生额外算力支出，但公开披露中看不到。Chai 没有披露
              AWS、Azure、GCP 或其他算力开支，公开报道中也没有出现对其算力预算的独立估算。

              Chai 成本画像中的一个关键结构性优势，是没有湿实验室基础设施。不同于 Generate:Biomedicines（140,000 sq ft 湿实验室空间）或 AbSci（77,000 sq ft），Chai
              完全依赖合作伙伴做湿实验室验证，而不是自建内部实验设施。这压低了资本开支，也让软件模式具备较高毛利潜力；但它也意味着 Chai 声称的命中率需要合作伙伴实验室确认，由此形成验证依赖，既有财务含义，也有科学含义。

              大药企研发支出背景凸显机会规模，也凸显竞争成本：头部制药公司合计每年研发支出超过 $200 billion，Roche、J&J、Merck 等单家公司每年都超过 $15
              billion。在这个背景下，与单一合作伙伴签下的 AI 药物发现交易，收入很可能只占成功平台最终必须捕获金额的一小部分，才足以支撑 $1.3 billion 估值。S&P Global Market
              Intelligence 的行业数据确认，生物制药风投活动仍集中在临床前阶段平台，Series B+ 交易需要可信的商业化证据；Chai 通过 Lilly 交易部分跨过了这道门槛，但尚未用已披露收入指标完全证明。
