  - id: FI004
    title: 财务风险热力图
    type: kpi
    layout: standard
    summary: |
      评估截至 2026 年 5 月的五项关键财务风险及其发生可能性和影响。收入不透明与交易集中度（仅 Lilly 确认）是短期评分最高的财务风险。
    data:
      items:
        - label: 收入不透明风险
          value: High — no ARR, contract count, or deal economics disclosed
          detail: 除存在 Lilly 交易外，没有任何已确认收入指标；尽调需要完整资料室访问才能评估商业牵引力
        - label: 交易集中风险
          value: High — only one publicly confirmed commercial partner (Eli Lilly)
          detail: 单一客户集中；如果 Lilly 合作丢失或 Lilly 研发策略转向，已确认商业收入将消失；可能存在其他未披露合作方
        - label: 算力成本扩张风险
          value: Medium — undisclosed but structurally significant
          detail: 随着模型改进或合作方定制模型增加，前沿 AI 生物模型训练成本可能快速上升；云算力成本有通胀风险；未披露成本上限
        - label: 资本市场 / 再融资风险
          value: Low-Medium — mitigated by strong investor syndicate
          detail: Oak HC/FT、General Catalyst、Thrive Capital、OpenAI 均为储备深厚的一线投资方；多家投资者连续参投多轮；在当前现金跑道内，困境风险较低
        - label: 临床转化财务风险
          value: High — deferred but structurally critical
          detail: 将 AI 命中物推进到 IND 所需资本是发现阶段的 100-1000x；Chai 将这部分后置给合作伙伴；若合作方不推进项目，收入天花板仍停留在平台费，里程碑也无法兑现
    approximationNotes: |
      风险评级是基于截至 2026 年 5 月公开证据的定性评估。低、中、高评级反映对未来 3 年内 Chai 商业模式中发生可能性和潜在财务影响组合的判断。
    claimRefs:
      - CI027
      - CI028
      - CI030
      - CI031
      - CI035
  - id: FE001
    title: Chai Discovery 产品架构栈
    type: stack
    layout: standard
    summary: 从数据输入到模型核心再到输出交付的五层架构，展示开放（Chai-1）与专有（Chai-2）边界。
    data:
      layers:
        - label: 数据输入与条件化层
          detail: FASTA 序列、PDB 结构、MSA 比对、实验约束、表位规格
          items:
            - 蛋白 FASTA / PDB 输入
            - 小分子 SMILES / SDF
            - MSA 比对（MMseqs2 / ColabFold）
            - 湿实验室约束（交联 MS）
            - 抗体表位区域规格
        - label: 基础模型核心（Chai-1，Apache 2.0 开源）
          detail: 自研多模态 transformer，同时编码蛋白、小分子、DNA、RNA、聚糖；自有架构（非现成 LLM）
          items:
            - 多模态 transformer 编码器
            - 单序列与 MSA 条件模式
            - 聚糖 / RNA / DNA 共折叠
            - Apache 2.0 开源发布
        - label: 生成式设计引擎（Chai-2，专有）
          detail: 为抗体和纳米抗体设计从头生成 CDR；由目标抗原和表位提示驱动；输出 VHH 和 VH-VL 格式；未开源
          items:
            - 全 6 个 CDR 从头生成
            - 支持 VHH（纳米抗体）和 VH-VL（IgG）格式
            - 集成可开发性评分
            - 面向合作伙伴的早期访问 API（Eli Lilly 为锚定客户）
        - label: 结构预测与评分模块
          detail: 对生成设计做原子级 3D 结构预测；评估可开发性；针对目标抗原评分亲和力和特异性
          items:
            - 原子级 3D 结构预测
            - 结合亲和力估计
            - 多反应性 / PSR / 稳定性评分
            - 置信分数（pTM、ipTM）
        - label: 输出与交付接口
          detail: 输出带置信分数的 PDB 文件；lab.chaidiscovery.com 免费网页实验室；Chai-2 早期访问合作伙伴 API；负责任部署框架
          items:
            - PDB / CIF 结构文件下载
            - lab.chaidiscovery.com 免费网页访问
            - Chai-2 合作伙伴 API（早期访问）
            - Responsible Deployment Framework（负责任部署框架）
    approximationNotes: Chai-2 层细节来自 biorxiv 预印本和 GitHub 引用推断；确切架构边界属专有信息。
    claimRefs:
