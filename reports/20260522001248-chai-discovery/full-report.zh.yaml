      - number: '1.4'
        title: 技术平台与产品主张
        blocks:
          - type: paragraph
            body: >
              Chai 的平台围绕两代基础模型构建。Chai-1 于 2024 年末作为开源模型发布，通过在生物分子结构预测中实现最先进表现，迅速在研究社区建立声誉——某些类别的表现大致持平或超过 Google
              DeepMind 的 AlphaFold 基准。Chai-2 于 2025 年 6 月 30 日发布，是公司的旗舰产品，声称在抗体设计上带来根本性跃迁。模型只需要输入目标抗原和表位，就能在 zero-shot
              场景下从零生成所有互补决定区（CDR）——不需要模板、大规模筛选或既有实验样本。Chai 在 2025 年 6 月提交给 bioRxiv 的预印本中报告称，模型在 52 个多样化抗体靶点上的命中率为
              16%，每个靶点提示少于 20 个设计，并在不到两周内完成湿实验验证；约一半靶点（26/52）至少产出一个已验证命中。2025 年 11 月的配套预印本把结果延伸到全长单克隆抗体，报告称超过 86% 的
              Chai-2 设计呈现强可开发性特征——热稳定性、表达、纯度、人源性——可与已获批疗法相比。同一预印本还展示了功能性 GPCR
              激动作用和对肿瘤特异性新表位的选择性结合，这两类靶点历来难以成药。公司还报告称，小蛋白结合物设计的湿实验成功率为 68%。Chai 声称，一个传统 R&D 需要投入超过 $5
              million、耗时三年以上的药物发现挑战，被其在数小时内用计算解决，并在不到两周内完成实验室验证。上述公开结果均为公司撰写的预印本，截至运行日期尚未经过正式同行评审。
