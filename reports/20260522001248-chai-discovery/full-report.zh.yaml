      - number: '5.2'
        title: 技术表现——抗体设计基准与验证
        blocks:
          - type: paragraph
            body: >
              Chai-2 的核心主张是：面对 52 个多样化抗原靶点，在完全从头抗体设计中达到 16% 命中率；这些靶点在 RCSB Protein Data
              Bank（PDB）中都没有既有抗体或纳米抗体结合体。每个靶点测试不超过 20 个设计，模型在单轮湿实验室检测中，让 50%
              的靶点至少产生一个经实验验证的结合体。经验证抗体展现出纳摩尔级结合亲和力、对目标靶点的特异性，以及可比已获批疗法的开发属性。从 AI 设计到实验确认的端到端流程少于两周。

              传统计算抗体发现方法——包括免疫、定向进化，以及基于酵母表面展示的计算筛选——报告的命中率持续低于 0.1%，这让 Chai-2 声称的表现高出 100 倍以上。在迷你蛋白设计上，Chai-2 达到 68%
              的湿实验室成功率，并经常产出皮摩尔级结合体。2025 年 11 月的困难靶点预印本进一步显示，超过 86% 的全长单克隆抗体（mAb）设计，其可开发性画像与已获批治疗性抗体相当；Chai-2
              设计的实验解析结构也与 in silico 预测高度吻合（原子级准确度）。Chai-2 还成功为 GPCR 激动作用设计出功能性抗体，并为肿瘤特异性新表位设计出高度特异性抗体。

              关键基准注意事项：AlphaFold 3（DeepMind/Google）于 2024 年 5 月发表在 Nature，是生物分子结构预测领域主导性的同行评议基准；Chai-1 预印本明确说明，AlphaFold
              3 基准值取自公开发布的预测结果，而不是独立运行。ESMFold（Meta/FAIR）于 2023 年 1 月发表在 Science，使用蛋白质语言模型，仅凭序列预测原子级蛋白质结构。AlphaFold 3 和
              ESMFold 都主要是结构预测工具；二者都不是为从头抗体生成而设计，因此直接比较命中率在方法上并不等价。CASP（Critical Assessment of Protein Structure
              Prediction）仍是结构预测的国际金标准盲测竞赛。截至 2026 年 5 月，所有 Chai-2 抗体设计数据都只发布在公司作者撰写的 biorxiv 预印本中，尚无独立同行评议。
