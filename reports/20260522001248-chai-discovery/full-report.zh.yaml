      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Boltz-2 是 Chai 结构预测价值最不对称的竞争威胁
            body: >
              Boltz-2（github.com/jwohlwend/boltz，MIT license）代表一类不同于商业竞争者的风险：一个宽松授权的开源模型，明确对标 Chai-1，并增加了 Chai-1
              缺失的结合亲和力预测。不同于 AbSci 或 Generate:Bio，Boltz-2 不需要商业牵引、销售团队或制药交易，就能替代 Chai-1 使用——制药计算团队可以直接在内部部署。Chai
              必须证明，创造商业价值的是 Chai-2 的从头设计输出，而不只是结构预测；因为 Chai-1 的结构预测功能，已经至少受到三个宽松授权开源替代方案挑战。预测与生成的区别，是 Chai
              必须建立并守住的核心商业叙事。
            calloutType: risk
            claimRefs:
              - CP017
              - CP023
              - CP036
          - type: callout
            title: 临床阶段缺口是 Chai 最可行动的风险
            body: >
              所有披露临床项目的生物药聚焦 AI 竞争者（Generate:Bio 进入 Phase 3，AbSci 进入 Phase 1）都比 Chai
              更早达到该里程碑，尽管它们成立更早且拥有更多实体湿实验基础设施。商业含义是，在 Chai 提交 IND 之前，制药伙伴将拿到 AbSci 和 Generate:Bio 的独立临床基准数据，用来评估 Chai-2
              的设计主张。如果 ABS-201 在 Phase 1 成功，GB-0895 在 Phase 3 推进，这些结果将把 AI 从头设计抗体确立为已验证 modality——但定义性参照点会是 AbSci 和
              Generate:Bio，而不是 Chai。缩小这一缺口需要 Chai 加快自己的 IND 时间表，或获得更多制药合作数据，作为替代性的临床验证。
            calloutType: insight
            claimRefs:
