      - number: '8.3'
        title: 估值方法与可比公司
        blocks:
          - type: paragraph
            body: >-
              对今天的 Chai 做传统 DCF
              是虚假精确，因为公司没有披露收入、利润率、合同期限或产品层面的商业化模型。更干净的方法，是把最近一轮估值与公开和私营参照点交叉核对；这些参照点至少披露收入、现金、情绪或临床阶段中的若干项。在这个基础上，Chai
              的 $1.3 billion 估值要求很高。Recursion 市值约 $1.65 billion，且披露收入、现金并具备公开市场透明度。Generate 市值约 $1.79 billion，同时已经拥有一个
              Phase 3 先导项目，并披露现金和季度收入。Schrödinger 拥有数亿美元收入和公开财务报表，市值约 $0.99 billion，低于 Chai；Absci 更低，接近 $0.79
              billion。私募资本形成也有两面性：Isomorphic 和 Xaira 表明投资人仍会积极资助前沿 AI 生物技术平台，但它们更大的资本基础并不能改变一个事实：Chai
              的估值已接近或高于证据深度明显更强的上市公司。
