      - number: '4.4'
        title: 财务透明度缺口与尽调问题
        blocks:
          - type: paragraph
            body: >
              Chai Discovery
              的财务图景有一个异常特征：已融资金额很高，已披露财务信息却很少。公司通过官方新闻稿确认了融资金额、估值和投资人联盟；其他所有内容——收入、ARR、现金消耗、交易经济性、算力成本、利润率结构和资产负债表——要么未披露，要么只能推断。对一家成立两年的私营公司而言，这种不透明并不反常；但
              $1.3 billion 估值让尽调所需的举证责任明显提高。

              Eli Lilly 合作是最重大的未知数。作为公司唯一公开确认的商业交易，Lilly 合同的财务结构——包括任何预付款、年度许可费、里程碑触发条件和特许权使用费安排——定义了 Chai 当前的收入轨迹。Eli
              Lilly 是上市公司，若合作达到重大性门槛，可能会在财务申报中提及；但目前没有 Lilly 的 SEC 披露确认具体交易经济性。pda.org 对 AI 药物发现监管和商业挑战的分析指出，AI
              平台交易通常采用与发现成果挂钩的里程碑付款结构，因此早期合作的经济价值高度取决于候选物推进情况。

              Lilly 交易之外，还有几类财务信息在结构上缺失。Chai 没有正式披露员工数；BuiltInSF 给出的约 29
              人只是间接估计。尽管算力开支可能是一条每年数百万美元的成本线，具体数额完全不透明。合同管线、销售周期数据，以及 Lilly 之外的其他合作伙伴名称，都没有得到确认。mavenbio.com
              对大药企研发资本配置的分析显示，发现软件工具在每个大型药企合作中的年度平台费用通常在 $1–20 million 区间，但没有交易数量和合同结构，无法估算 Chai 的实际交易规模。

              药物发现行业经济学文献一贯显示，从 AI 命中生成走向临床候选物所需资本，显著高于发现阶段本身；纳入临床成本后，通常要高出两到三个数量级。Chai
              当前模式把这部分成本递延给合作伙伴，近期保住资本效率，但也可能限制上行空间，因为合作伙伴捕获临床价值。drugdiscoverynews.com 对 AI 改造药物发现经济性的分析强调，能产生发现命中的 AI
              软件平台，必须及早谈下有利的里程碑和特许权使用费条款，才能捕获长期经济价值；随着时间推移，药企伙伴对这些条款会更熟练。
