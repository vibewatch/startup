          score: 8
          detail: 基准主张和创始团队履历在这个阶段异常强。
        - label: 外部验证
          score: 7
          detail: Lilly 合作有意义，但仍然集中。
        - label: 客户广度
          score: 3
          detail: 已保留来源中只出现一个具名头部客户。
        - label: 收入可见度
          score: 2
          detail: 未公开披露 ARR、定价、毛利率或队列数据。
        - label: 临床证明
          score: 1
          detail: 未公开披露临床阶段资产或获批产品。
        - label: 资本基础
          score: 7
          detail: 已融资超过 $225M，让 Chai 有时间，但仍少于最大型未上市同业。
        - label: 估值支撑
          score: 4
          detail: 当前估值只有在更多证明到位后才站得住；它不是明显便宜的交易。
        - label: 证据质量
          score: 5
          detail: 融资和合作伙伴公告证据强，经济性、股权结构和临床转化证据弱。
