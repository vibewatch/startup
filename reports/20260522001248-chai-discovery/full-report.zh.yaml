      - number: '7.2'
        title: 监管与质量风险
        blocks:
          - type: paragraph
            body: >-
              监管风险不在于 FDA 敌视 AI，而在于 Chai 仍需满足任何治疗开发公司都要承担的质量和临床就绪负担，同时还叠加模型特有的不确定性。FDA 发布了面向软件的 AI 指引，也更广泛讨论了药物开发中的
              AI，但两个来源都没有为 AI 设计抗体提供定制审批路径。因此，Chai 应被视为一家恰好使用先进 AI 的生物制剂发现公司，而不是一家可以绕过 CMC、检测验证或 IND 级证据的公司。FDA 自身 CMC
              材料强调批次数据、工艺描述、纯度、稳定性，以及无菌或内毒素控制，这些都是安全关键项。Chai 的公开材料没有披露任何先导资产的生产合作伙伴、放行规格集或稳定性包。Lilly
              公告证明了市场对发现工作流有商业兴趣，但尚未证明 Chai 能推动一个抗体完成 IND 支持性工作、监管沟通或生产放大。结果是典型的生物技术时点风险：发现主张可能成熟得远快于质量体系和临床证据。
