  - id: FI002
    title: 成本结构与毛利率敏感性
    type: kpi
    layout: standard
    summary: |
      Chai 的成本结构由相对克制的人力成本（精简的 29 人团队）和前沿 AI 模型训练的大额算力开支组成。没有湿实验室基础设施是一项结构性优势；只要算力成本可控，Chai 可以跑出高毛利的软件模式。
    data:
      items:
        - label: 估计年度薪酬烧钱
          value: $7–12M/year
          detail: ~29 名员工 × $250–400K 全成本；旧金山 AI 人才溢价；员工数来自 BuiltInSF，未经确认
        - label: 估计年度算力支出
          value: $3–20M/year
          detail: 前沿蛋白 AI 模型训练（每次主要训练 $1–15M）加推理；定制 Lilly 模型训练增加增量成本；完全未披露
        - label: 湿实验室基础设施成本
          value: $0 (zero)
          detail: Chai 没有自有湿实验室；验证完全依赖合作伙伴；相较 Generate:Bio 和 AbSci，具备结构性的轻资本优势
        - label: 估计年度总烧钱
          value: $15–40M/year
          detail: 薪酬 + 算力 + G&A + 早期商业化搭建；仅基于代理估算；实际数字未披露
        - label: 潜在软件毛利率
          value: 60–80%+ (estimated)
          detail: 如果平台授权收入规模化且算力成本可控，毛利率有较高潜力；API / SaaS 模式支撑这一点；未经确认
    approximationNotes: |
      所有数值均为代理估算，依据是旧金山 AI 劳动力市场数据、前沿 AI 算力成本基准，以及 Chai 公开描述的团队规模和架构。Chai 未披露任何财务数字。毛利率估算为方向性判断，基于可比 AI 软件平台模式。
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
