companyProfile:
  summary: >-
    Chai Discovery 是一家 AI 药物发现平台公司，2024 年初由四位来自 OpenAI、Meta FAIR、Stripe 和 Absci 的研究人员在 San Francisco 创立。不到两年，公司以 $1.3
    billion 估值融资约 $230 million，并在 2026 年 1 月宣布与 Eli Lilly 达成标志性合作。公司采用双层产品：开源的 Chai-1 用于分子结构预测，自研的 Chai-2
    用于从头设计抗体，目标是生物制药 R&D 工作流。基于公司撰写、仍待同行评审的预印本，Chai-2 声称在 52 个多样化靶点上实现约 16–20% 的从头设计抗体命中率（是此前计算方法的
    100×）。公司以轻资产平台运作，没有内部药物管线、没有湿实验基础设施，也没有公开披露收入指标。
