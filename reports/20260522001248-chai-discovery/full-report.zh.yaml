      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 的竞争护城河仍处早期，同时面临近期和结构性风险。截至 2026 年 5 月，公司最主要的差异化资产是：（1）Chai-2 带来的 zero-shot
              从头设计抗体能力，已在已发表技术报告中的难靶点上验证；（2）Eli Lilly 合作，它既提供商业验证，也可能带来真实世界生物药设计数据，用于强化训练；（3）开放权重的 Chai-1
              模型，它推动社区采用，但展示能力的同时也会加速竞争者商品化。上述优势在多个方向上面临耐久性挑战。最尖锐的风险是开源替代：Boltz-2 的 MIT license 以及直接对标 Chai-1，意味着免费使用的
              Chai-1 网页服务器，要与一个可商业部署、且增加了 Chai-1 所缺结合亲和力预测的开源替代方案竞争。AbSci 凭 ABS-201 进入 Phase 1 的先发位置，意味着临床基准和制药关系数据会在
              Chai 推进自己的 IND 候选物之前由竞争对手设定——可能围绕 AbSci 的设计路径和时间表塑造商业伙伴预期。Isomorphic Labs 背靠 Alphabet 的资本优势显著：其融资约 $600
              million，而 Chai 累计约 $200 million，Isomorphic 可以在模型开发、BD 能力和制药共同开发安排上投入更多。如果 Isomorphic 从小分子扩展到从头设计生物药——其
              AlphaFold 谱系架构在技术上具备这种能力——它将成为资本充足的直接竞争者。Recursion 的 50+ PB 数据护城河在结构上很难被较小竞争者复制：它需要与 NVIDIA
              共同开发的专用机器人生物学基础设施（BioHive-2）、实体实验室设施，以及多年化合物库筛选。虽然这道数据护城河目前主要适用于小分子，但如果 Recursion 把基于 phenomics
              的数据生成扩展到生物药靶点，它就会成为数据不对称如何变成耐久竞争壁垒的先例。Schrödinger 通过 35+ 年 LiveDesign 工作流整合形成的切换成本护城河，与 Chai
              的目标买方画像（发现阶段生物药团队）不完全直接相关，但提供了一个警示模型：长期竞争位置最终可能由深度整合带来的锁定效应决定，而不是模型优越性。Generate:Biomedicines
              的实体湿实验基础设施优势，也向 Chai 提出资本配置问题：是继续保持轻资产并依赖伙伴做实验验证，还是建设内部湿实验能力，以增强可信度并降低对 Eli Lilly 等伙伴的依赖。对 Chai
              最不利的情景，是三件事叠加：（1）Boltz-2 或后继者完全商品化基于结构的设计；（2）AbSci 或 Generate 在 Chai 推进自己的 IND 之前建立临床先例；（3）Isomorphic Labs
              借 Alphabet 资本扩展到生物药。这些风险单独看都可管理，但合在一起会压缩 Chai 在市场结构固化前建立差异化的窗口。
