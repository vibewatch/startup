  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              精确定义市场很重要，因为分析师估算会随「AI 药物发现」的窄口径或宽口径相差一个数量级。最窄定义由 Axis Intelligence 和 Grand View Research 使用，只覆盖在 IND
              申报前，对靶点识别、命中物和先导物生成、先导物优化、从头分子设计以及临床前候选物选择提供实质支持的 AI 软件和相关服务。这个定义排除了用于临床试验运营、监管申报、药物警戒、制造和商业分析的
              AI。按这个窄口径，2026 年市场规模为 $2–5 billion。Mordor Intelligence 使用的中等定义加入 AI 赋能的制剂和药物再利用分析，2026 年规模为 $4.36
              billion。Global Market Insights 和 Towards Healthcare 采用最宽定义，把触及整个制药价值链的所有 AI 软件都纳入——临床试验、制造、患者匹配——得到 2026 年
              $24.51 billion。对 Chai Discovery 来说，相关边界是最窄定义：Chai-2 平台瞄准实验筛选前的早期生物药设计（抗体、纳米抗体、小蛋白），而不是临床或制造
              AI。相邻但排除在外的支出类别包括：不依赖 AI-native 设计的 CRO 生物信息服务、传统湿实验抗体发现（杂交瘤、噬菌体展示）以及 AI
              临床试验招募工具。主要现状替代方案是传统抗体发现方法（杂交瘤和噬菌体展示，2024 年占更广泛抗体发现市场的 38.1%）、手工计算 docking 流水线，以及制药公司完全自建的内部 AI 团队。全球制药
              R&D 基数约为 2025 年 $300 billion 年支出，构成需求背景，但 AI 药物发现软件目前只占其中约 1.5%。
