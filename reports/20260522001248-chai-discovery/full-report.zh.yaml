      - number: '4.3'
        title: 资本充足性、现金跑道与融资风险
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 三轮累计融资约 $230 million：2024 年 9 月完成 $30 million 种子轮（Thrive Capital 与 OpenAI 领投，估值约 $150
              million），2025 年 8 月完成 $70 million Series A（Menlo Ventures/Anthology Fund 领投，估值约 $550 million），2025 年 12
              月完成 $130 million Series B（Oak HC/FT 与 General Catalyst 共同领投，估值 $1.3 billion）。Series B
              新闻稿称资金将用于“加速研究和产品开发，并扩大商业化投入”；这套表述符合公司从研发高投入阶段转向搭建商业基础设施的状态。

              按每年 $20–35 million 的估算消耗率计算——这与 29 人 AI 研究团队、显著算力开支以及早期销售和商业开发成本相符——仅 $130 million Series B 就可从 2025 年 12
              月交割起提供约三到六年现金跑道，且尚未计入任何合作收入。如果 Lilly
              合作或其他药企交易带来的收入显著降低净消耗，现金跑道还可进一步延长。反过来，团队快速扩张、算力投资加速，或战略性湿实验室合作资本支出，都可能缩短消耗周期。在缺少已披露财务报表的情况下，所有现金跑道估算都带有推测性。

              投资人联盟质量很高，构成安全垫，显著降低了稀释性过桥融资风险。General Catalyst、Oak HC/FT、Thrive Capital、OpenAI、Menlo Ventures 和 Emerson
              Collective
              都是一线机构资本，储备雄厚。多家投资人（Thrive、OpenAI、Dimension、Menlo）参与了多轮融资，释放出对未来融资能力的信心。这套名单降低了当前现金跑道内被迫降估值融资或困境过桥融资的风险。

              行业融资背景同时带来顺风和风险。S&P Global Market Intelligence 数据显示，2025–2026 年生物制药 VC 资金不成比例地流向 AI 驱动的临床前平台，这一趋势有利于 Chai
              的定位。但同一时期，多家知名 AI 药物发现公司在临床阶段遭遇挫折；loonbio.com 的行业分析认为，自 2015 年以来 AI 药物发现风投资金超过 $60 billion，但截至 2025 年初产生的
              FDA 批准为零——这提出了一个问题：投资人对临床前到临床转化的耐心是否正在逼近上限。Chai
              必须在当前融资周期内，证明其能够走向临床里程碑或有意义的平台收入，否则下一轮融资可能面临估值重置。drugdiscoverynews.com 关于 AI 从命中到临床候选物缺口的分析，特别指出从 in
              silico 设计转向经验证的临床候选物，是成本最高、失败率最高的阶段；Chai 尚未用任何公开披露项目走过这道关。
