            body: >
              Chai-1 于 2024 年 9 月开源后，已经获得有意义的第三方开发者采用；即使这种采用不直接转化为收入，也能作为商业兴趣的领先指标。截至 2026 年 5 月，chaidiscovery/chai-lab
              GitHub 仓库累计 1,938 个 star 和 274 个 fork，87 个开放 issue 说明社区互动活跃。该仓库创建于 2024 年 9 月，最近一次 push 在 2026 年 4
              月，约二十个月持续开发。这条轨迹与同成熟阶段的其他计算生物学开源项目相比并不逊色。

              PyPI 上的 chai_lab Python 包——注意这里是下划线版本，不同于更早的连字符包名——已达到 0.6.1 版本，发布日期为 2025 年 3 月，显示仍在积极维护。Chai Discovery 的
              HuggingFace 组织页托管模型权重和文档，为研究社区提供额外分发渠道。PyPI 和 HuggingFace 的采用信号，都是研究者到商业转化漏斗的代理指标：在学术工作流中使用 Chai-1
              的开发者，可能成为其机构内部推动企业采用的支持者。

              Chai-1 的 biorxiv 预印本在 2024 年 10 月更新到第 2 版，Chai-2 技术报告于 2025 年 7 月作为 biorxiv 预印本发布，显示 Chai
              对科学透明度的承诺，也把它与完全封闭的竞争者区分开。但开源模型的非商业许可证限制了创收型部署，意味着庞大的开发者采用基础不会直接变现，除非转成付费合作协议。lab.chaidiscovery.com
              的商业网页界面仍向个人研究者免费开放，这进一步限制了非药企用户基础的直接变现。
