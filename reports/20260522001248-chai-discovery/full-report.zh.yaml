          - type: callout
            title: 临床验证缺口限制商业动能
            body: >
              尽管 2015 年以来全球 AI 药物发现投入超过 $60+ billion，截至 2026 年 5 月仍没有 AI 设计药物获得 FDA 批准。IQVIA 2026 报告发现，AI 项目的 Phase I
              成功率优势（75%）是真实的，但只限于新兴生物制药分部，尚未转化为全行业整体成功率改善。Chai 的买方要求平台先证明能产出临床阶段资产，再投入大额里程碑预算，是理性的；因此 Eli Lilly
              合作是关键商业证明点，但截至运行日期仍未兑现。
