      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              AI 药物发现采用的首要结构性驱动，是 R&D 生产率危机。开发一个新的分子实体平均成本为 $2.8 billion（资本调整后），耗时 12–15 年，并承受约 90% 的 Phase I 失败率。2024 至
              2030 年间，年美国收入超过 $180 billion 的药物将面临专利独占期丧失，董事会层面急需比传统时间表更快地补上收入。AI 能带来可衡量的效率提升：在特定工作流中，它可以把临床前开发周期从 5–6
              年压缩到 12–18 个月，并将开发成本降低 25–50%。IQVIA Global R&D Trends 2026 报告给出最权威的行业信号：AI 赋能的新兴生物制药项目 Phase I 成功率达到
              75%，传统项目为 40–65%；这一结果在 EBP 分部可见，即便尚未扩展到全行业。AlphaFold 映射 200M+ 蛋白结构，是基础性使能因素；FDA 在 2024 年对 12 款 AI
              识别的肿瘤药物给予 fast-track designation，也释放了监管接纳信号。2026 年 1 月，FDA 和 EMA 联合发布药物开发中 AI 实践的 10
              条指导原则，降低了买方的监管不确定性。风险投资也验证了行业：2025 年投入 $5.7 billion，较 2024 年增长
              78%。采用约束同样关键。最主要障碍不是数据量，而是数据就绪度：组织拥有足够数据，却难以完成清洗、语境化，并对齐具体发现问题；这是 CAS Life Sciences Summits 在 2025
              年的发现。尽管投入很高，只有 22% 的生命科学领导者成功规模化 AI。切换成本高：整合 AI
              平台需要深入连接数据流水线、重新培训员工适应新工作流、按监管标准验证模型输出，并推动化学和生物部门的变革管理。模型可解释性仍是约束——监管方和实验室科学家需要可解释输出，黑箱深度学习模型在内部会遭遇怀疑。人才缺口（AI
              + 生物学复合能力）和预算限制卡住了较小生物技术公司。也许最重要的是：截至 2026 年 5 月，没有 AI 设计药物获得 FDA
              批准，意味着买方购买的是尚未被证明的长期结果，这会拉长决策周期并限制前期合同规模。
