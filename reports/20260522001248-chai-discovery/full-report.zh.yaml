      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 突破性平台性能主张
            body: >
              Chai-2 报告的约 16–20% 从头设计抗体命中率，由一篇 2025 年 6 月预印本支撑，测试覆盖 52 个多样化靶点；公司声称这比此前计算方法提升 100 倍。2025 年 11 月的全长 mAb
              预印本进一步把结果延伸到类药可开发性特征（>86% 干净设计），增强了平台潜在临床相关性的可信度。2026 年 1 月与 Eli Lilly 的合作，为平台在现实场景中的适用性提供了早期第三方验证。
            calloutType: strength
            claimRefs:
              - CO030
              - CO033
              - CO035
              - CO038
          - type: callout
            title: 没有临床阶段资产；全行业存在转化风险
            body: >
              截至 2026 年 5 月，没有任何 Chai 设计的分子进入人体临床试验，公司性能数据也来自尚未同行评审的公司预印本。到 2025 年，更广泛的 AI 药物发现行业已吸引超过 $60 billion
              投资，却没有 FDA 批准案例；第一代 AI 生物技术公司经历了重大临床失败和估值坍塌。Chai 的 $1.3 billion 估值隐含了可观商业预期，但临床或监管里程碑尚未支撑这一预期。
            calloutType: risk
            claimRefs:
              - CO040
              - CO041
              - CO042
          - type: callout
            title: 伙伴模式降低二元药物开发风险
            body: >
              与拥有药物管线、独自承担完整临床失败风险的 AI 生物技术公司不同，Chai
              的平台即服务模式意味着收入取决于伙伴采用和平台授权，而不是药物获批。这降低了直接二元结果风险，但风险转向平台采用速度、定价权，以及能否在合作伙伴 R&D
              工作流中证明可衡量的生产力提升——截至运行日期，这仍是未解的商业问题。
