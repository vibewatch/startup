        - 抗体库高通量筛选（>10⁶ 个设计）；周期数周到数月
        - 基于靶点 + 表位生成 ≤20 个计算模拟候选物；2 周内完成湿实验验证
        - 16% 命中率，对比传统方法 <0.1%；52 个靶点中目标成功率 50%
        - 性能为自报；没有与同类最佳文库筛选进行前瞻性头对头比较
      - - 面向紧凑型生物制剂的纳米抗体（VHH）设计
        - 骆驼科动物免疫 + 噬菌体展示；周期 3–6 个月；大量使用动物
        - Chai-2 零样本生成 VHH；在小蛋白基准中获得皮摩尔级结合物
        - 小蛋白设计成功率 68%；报告案例达到皮摩尔级亲和力
        - VHH 专用验证集小于完整 IgG 数据集；可开发性数据有限
      - - 具备类药性质的全长 mAb 设计
        - 杂交瘤、噬菌体展示，或动物源抗体人源化
        - 生成全长 VH-VL 格式，并集成可开发性评分
        - '>86% 的设计具备治疗级可开发性画像（challenging-targets 论文）'
        - 晶体结构验证仅覆盖子集；GPCR 靶点仍具挑战
      - - 面向此前难以攻克靶点的抗体设计
        - 失败模式：靶点无法通过常规手段生成有功能的抗体
        - Chai-2 据称在数小时内解决了此前耗资 >$5M、耗时 3+ 年的难题
        - 一个记录案例在 2 周内完成实验室验证；已设计 GPCR 激动剂抗体
        - 仅为单个案例研究层级；关于「难以攻克」靶点类别的系统数据尚未发表
      - - 零成本学术蛋白结构预测
        - AlphaFold2/3 Server、ESMFold API 或本地 ColabFold 安装
        - lab.chaidiscovery.com 免费提供 Chai-1 预测 Web 访问，包括商业用途
        - 根据公司报告基准，在 CAMEO/CASP 任务上准确度可与 AF3 相当
        - Web 界面容量未记录；MSA 集成需要调用外部 MSA 服务器
    notes: 收益数据来自公司预印本；传统方法命中率（<0.1%）来自 businesswire 和 techcrunch 对行业标准的引用；尚无独立头对头研究发表。
