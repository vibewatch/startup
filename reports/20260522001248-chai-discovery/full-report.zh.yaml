  productSummary: >-
    Chai 采用双层产品架构。Chai-1 是开源多模态基础模型，用于生物分子结构预测（蛋白质、小分子、DNA、RNA、糖基化），2024 年 10 月以 Apache 2.0 发布，可通过网页和 PyPI 免费商用。Chai-2
    是用于完全从头设计抗体的自研生成模型；输入只需要目标抗原和表位，就能从零生成所有 CDR，在 52 个多样化靶点上实现 16% 命中率（每个靶点 ≤20 个设计），超过 86% 的全长 mAb
    满足与已获批疗法相当的可开发性标准。Chai-2 按 Responsible Deployment 政策控制访问，需要合作伙伴申请并获批。
  customerFocus: >-
    客户主要是希望加速早期生物药疗法发现的大型生物制药公司和生物技术公司，尤其是抗体方向。截至 2026 年 5 月，Eli Lilly 是唯一公开具名的商业伙伴，另有数量未披露的生物技术公司获得 Chai-2 早期访问。Menlo
    Ventures 称，「相当一部分生物技术行业」已经申请访问；尚未确认更多具名伙伴。
  businessModel: >-
    公司采用平台即服务模式，并带有 freemium 结构：Chai-1 免费开源，用来积累开发者心智；Chai-2 则按 Responsible Deployment
    政策，通过定制合作开放访问。收入预计来自前期平台授权费、定制模型开发费（例如 Lilly 交易中基于 Lilly 专有数据训练的模型），也可能来自临床候选药物推进的里程碑付款或 royalties。所有交易经济性均未公开。
