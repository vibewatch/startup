      - number: '8.5'
        title: 投资逻辑失效触发点与最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应盯住四个公开信息仍答不清的问题。第一，Lilly 合作的真实经济条款是什么：首付款、里程碑、排他边界和续约逻辑。第二， 种子轮、Series A 和 Series B 之后，Chai
              的股权结构表到底怎样，包括任何会影响普通股结果的优先股堆叠或投资人保护条款。第三， 除 Lilly 之外的客户集中风险多高，是否已有另一家具名设计伙伴接近转化。第四，Chai
              的技术基准优势有什么证据能延伸到更广的可开发性、 可制造性并最终进入临床。如果估值继续上行，而这些答案让人失望，投资逻辑就会失效。具体说，缺少第二个标杆客户、无法独立验证 Chai-2 的下游实用性，
              或在缺少增量证据时又以高得多价格融资，都应成为投资人后退的理由。现阶段，上行空间真实存在，但为今天的证据支付明天的价格，风险同样真实。
