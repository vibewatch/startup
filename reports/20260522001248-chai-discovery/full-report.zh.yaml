        - 驱动因素
        - 正向
        - 当前且持续
        - 更快、更便宜药物发现的结构性需求——Chai 的核心价值主张
        - 跟踪现有合作伙伴验证的平台 ROI，并与传统周期对比
      - - 专利悬崖（2030 年前 $180B+ LOE）
        - 驱动因素
        - 正向
        - 2024–2030 年紧迫窗口
        - 大型药企董事会优先推动大规模管线提速
        - 监测 Chai 与 2026–2028 年专利到期公司之间的交易管线
      - - IQVIA：AI EBP 的 Phase I 成功率为 75%
        - 驱动因素
        - 正向
        - 已验证的 2022–2025 队列
        - 临床验证信号增强买方对 AI 平台的信心
        - 评估 Chai 合作伙伴是否属于呈现该优势的 EBP 细分群体
      - - FDA/EMA 联合 AI 指南（2026 年 1 月）
        - 驱动因素
        - 正向
        - 监管清晰度立即提升
        - 降低投资人和药企合作伙伴对 AI 设计资产的不确定性
        - 核验 Chai 技术报告是否符合新的 FDA 可信度框架
      - - AlphaFold：已映射 200M+ 结构
        - 驱动因素
        - 正向
        - 基础层（2020–2024）
        - 结构生物学底座支撑 AI 原生抗体设计管线
        - 评估 Chai-2 的结构预测能力，对比 AlphaFold 3 / Isomorphic
      - - VC 激增：2025 年 $5.7B（增长 78%）
        - 驱动因素
        - 正向
        - 2025–2026 年峰值
        - 平台估值处于高位；Chai 的 $1.3B 估值符合市场水平
        - 监测 2026 年回调是否压低交易量
      - - 数据就绪瓶颈
        - 约束
        - 负向
        - 持续存在；需要 2–4 年修复
        - 没有经过整理的自有数据集，合作伙伴无法充分使用 AI 平台
        - 评估 Chai 如何将合作伙伴数据就绪度作为售前或入驻要求处理
      - - 仅 22% 生命科学领导者已规模化 AI
        - 约束
        - 负向
        - 当前（2025–2026）
        - 显示组织阻力普遍存在；限制部署速度
        - 获取 Lilly 合作中内部部署成功的案例证据
      - - 尚无 AI 药物获得 FDA 批准（2026 年 5 月）
        - 约束
        - 负向
        - 首个批准前持续存在
        - 限制合同规模，也压低把整条管线押注在 AI 平台上的意愿
        - 跟踪 Insilico Medicine rentosertib Phase IIb（最接近获批的 AI 药物）
      - - 切换成本与组织惯性
        - 约束
        - 负向
        - 高；需要 2–4 年投入
        - 需要多年集成；买方谨慎，避免锁定在早期平台上
        - 了解 Lilly 交易期限和排他条款；评估切换条款
    notes: >
      截至 2026 年 5 月，增长驱动因素与采用约束大致均衡。来自 IQVIA 的临床验证信号（Phase I 成功率 75%） 和监管清晰度，是短期最重要的正向催化。尚无 FDA 批准的 AI
      药物，以及数据就绪瓶颈，仍是两个最显著逆风。
