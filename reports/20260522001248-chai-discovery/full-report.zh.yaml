    type: kpi
    layout: standard
    summary: 针对 Chai 当前估值点，从证明、商业化、估值支撑和证据质量给出的 IC 式记分卡。
    approximationNotes: 分数是 0-10 的启发式评估，用于衡量当前披露估值下的可投性，不是公司质量的绝对分。
