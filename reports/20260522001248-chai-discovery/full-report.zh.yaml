  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础、买方与用户分层
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 的客户结构横跨三个运营上不同的分层。第一类是大型制药公司，具体就是 Eli Lilly；它同时扮演买方、用户和付款方。Lilly 合作于 2026 年 1 月 8
              日宣布，在多个生物制剂靶点上部署 Chai 的前沿 AI，并包括用 Lilly 专有数据训练一个定制 Chai 模型。这代表了典型的 Chai 商业关系：多项目合作，药企伙伴把 Chai
              平台接入自身内部发现工作流。该合作之前有一段已披露的“评估期”，确认大药企客户在承诺前会先对 Chai 做尽调。财务条款没有披露；Chai 采用“负责任部署”政策，选择性把关访问，而不是开放式商业自助服务。

              第二类是早期访问生物技术合作伙伴。Chai-2 在 2025 年 7 月发布时明确向“精选合作伙伴”开放合作申请；Chai Series A 领投方 Menlo Ventures
              公开表示，“生物技术行业中相当一部分”已经申请 Chai-2 访问。Chai 没有公开点名这些申请方或已确认早期访问合作伙伴。它们代表管线，即潜在未来付费客户；但在正式协议宣布前，不应计入已确认收入。

              第三类是 Chai-1 的学术、研究和非商业用户；Chai-1 是 Chai 的开源结构预测模型。Chai-1 可在 GitHub 和 PyPI 免费下载，也可在 lab.chaidiscovery.com
              免费网页推理。这些用户增强开发者生态和品牌可信度，但除非转化为商业协议，否则不是付款方。CB Insights 将 Chai 列入 AI 100 2026
              的医疗健康与生命科学类别，并指出公司估值在约十五个月内从种子轮 $150 million 增至 Series B $1.3 billion；这进一步验证了 Chai 在药企 AI
              市场中的定位，即便其付费客户数量仍有限。
