    approximationNotes: |
      现金跑道估算由代理烧钱率假设（见 TI003）和已确认 B 轮融资额（$130M）构建。假设此前轮次在 B 轮交割前已大体投入。收入抵消具有推测性，并取决于不同情景。由于 Chai 未披露财务数据，所有估计置信度较低。
