      - number: '5.3'
        title: 开源策略与开发者生态
        blocks:
          - type: paragraph
            body: >
              Chai-1 是 Chai Discovery 技术策略中的开源锚点。Chai Discovery 按 Apache 2.0 发布
              Chai-1，包括模型权重和推理代码，由此打造了一个社区飞轮，推动采用、外部验证和人才信号。Python 包（chai_lab）通过 PyPI 分发并定期更新；最新发布版本为
              0.6.1，开发分支每天更新。GitHub 仓库（chaidiscovery/chai-lab）提供完整源码、可复现环境的 dev-container 设置，以及 Chai-1 和 Chai-2
              预印本的引用元数据。HuggingFace 托管 Chai-1 模型卡，包含安装说明和模型文档。Chai-2 的引用块已经出现在 GitHub README 中；即便 Chai-2 模型本身仍为专有，Chai
              也在把该库定位为社区接口。

              这种开源核心策略对应着 MLOps（如 Hugging Face）和生物信息学（如 ColabFold）中的成功先例：免费提供强大的基线模型，建立生态依赖，再通过下一代能力的商业访问变现。Chai-2
              保持专有，因为公司认为抗体设计能力是核心商业差异点。PLOS Computational Biology 的 LAP（Liability Antibody Profiler）工具包可以说明补充 Chai
              平台的开源工具类型：它会对抗体负债进行测序和结构映射，并与天然和治疗性抗体库比对，用于可开发性评估；未来也可能与 Chai 平台集成。
