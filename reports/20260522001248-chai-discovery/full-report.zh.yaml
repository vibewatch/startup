      - number: '5.4'
        title: 部署、路线图与信任控制
        blocks:
          - type: paragraph
            body: >
              Chai-2 只通过早期访问合作部署给经过选择的学术机构和生物制药组织。公司运行一套自称“负责任部署框架”的机制，重点放在有利健康、低风险的应用，生物安全，以及与社会目标一致。2026 年 1 月 Eli
              Lilly 合作——Lilly 的 TuneLab 项目将 Chai-2 集成到生物制剂发现中——是迄今最受关注的合作伙伴部署。Menlo Ventures 合伙人 Greg Yap 在 Series A
              公告中公开表示，“生物技术行业中相当一部分已经申请 Chai-2 访问权限”，但具体申请数量或批准率没有披露。

              从监管合规角度看，FDA 于 2025 年 1 月发布题为《使用人工智能支持药物和生物制品监管决策的考量》的指导草案，并称自 2016 年以来已审查超过 500 份纳入 AI 的药物申报。Chai-2
              设计的抗体候选物仍需完成完整的 IND 支持性研究、临床试验（I–III 期）和监管审评，才能获批；Chai 平台加速的是发现阶段设计，不是临床或监管批准。截至 2026 年 5 月，没有专门面向 AI
              设计生物制剂这一独立类别的 FDA 路径。从头抗体设计带来的生物安全担忧已经被承认，包括生成针对危险靶点的新型结合体的双重用途风险，但公开文件尚未充分缓解。公司路线图包括把 Chai-2
              扩展到更多模态（肽、酶、小分子），也可能扩展到更广格式（双特异性抗体、ADC），但具体时间表没有公开披露。
