            body: >-
              Chai 的投资论点建立在技术野心和机构验证的罕见组合上。Chai-2 报告的命中率、底层零样本抗体设计框架，以及创始团队来自 OpenAI、Meta 和 Absci 的履历，共同构成一个可信案例：Chai
              正在生成式生物制剂设计前沿工作。Lilly 愿意评估 Chai
              输出并资助定制模型合作，是最强的外部证明，说明公司模型不只是学术新奇物。反论点同样重要。今天支撑估值的几乎每一个头条事实，都仍位于临床和商业证明的上游：性能主张由公司自报，Lilly
              交易经济性未披露，公司在保留来源中只有一个具名大客户，也没有任何 Chai
              设计资产进入临床试验的公开证据。换句话说，当前估值承销了大量未来转化：从基准成功转为持久收入，并最终转为治疗证明。这种转化可能发生，但公开来源尚未证明。
