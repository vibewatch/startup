  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主导失败路径从未经复现的模型主张开始，经可开发性和 CMC 摩擦，传导到合作伙伴证明延迟、收入放慢，并再次带来融资压力。
    data:
      nodes:
        - id: model_claims
          label: 未复现的模型主张
        - id: developability
          label: 可开发性隐患
        - id: cmc_gap
          label: CMC / 质量缺口
        - id: partner_conc
          label: 单一具名合作伙伴
        - id: ind_delay
          label: IND / 临床证明延迟
        - id: commercial_delay
          label: 商业证明延迟
        - id: capital_pressure
          label: 资本压力
        - id: valuation_risk
          label: 降价轮 / 估值重设
      edges:
        - from: model_claims
          to: developability
          label: 基准表现不保证抗体可制造
        - from: developability
          to: cmc_gap
          label: 表达或稳定性差会加重质量负担
        - from: cmc_gap
          to: ind_delay
          label: 批次 / 稳定性工作成为闸门项
        - from: ind_delay
          to: commercial_delay
          label: 没有临床信号会拖慢买方信心
        - from: partner_conc
          to: commercial_delay
          label: 客户多样性有限，放大单个项目结果
        - from: commercial_delay
          to: capital_pressure
          label: 收入证明来得比支出慢
        - from: capital_pressure
          to: valuation_risk
          label: 下一轮可能把执行不确定性计入定价
        - from: ind_delay
          to: capital_pressure
          label: 开发周期拉长现金需求
    approximationNotes: null
    claimRefs:
      - CR018
      - CR021
      - CR023
      - CR024
      - CR026
      - CR030
      - CR034
