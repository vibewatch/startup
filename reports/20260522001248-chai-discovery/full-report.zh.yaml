      - number: '4.5'
        title: 重点观察
        blocks:
          - type: callout
            title: 收入不透明是财务尽调的最大障碍
            body: >
              Chai Discovery 已披露 $230 million 融资、$1.3 billion 估值以及与 Eli Lilly 的合作存在，但收入指标为零。公开来源没有
              ARR、合同数量、交易经济性、现金消耗或毛利率数据。在 $1.3 billion 估值下，这种不透明让尽调环境结构性受限：任何财务分析都只能建立在代理估算上，而不是可审计数据。最关键的即时尽调要求，是获取
              Chai 内部财务摘要，尤其是 Lilly 交易经济性、任何额外合作管线的阶段和经济性，以及从 Series B 资金到当前现金头寸的现金消耗桥。
            calloutType: risk
            claimRefs:
              - CI027
              - CI028
              - CI029
          - type: callout
            title: 轻资本模式是 Chai 最突出的财务特征
            body: >
              Chai 完全没有湿实验室基础设施，相对于最接近的从头设计同行，这是真正的结构性财务优势。Generate:Biomedicines 运营 140,000 平方英尺湿实验室；AbSci 运营 77,000
              平方英尺。两者都有相当重的固定成本基础。Chai 依赖合作伙伴验证，因此能以这些公司成本结构的一小部分运营，代价是验证速度和数据所有权。如果 Chai 对 Chai-2
              的设计主张在规模化后站得住，这种资本效率优势可能让公司在给定收入水平下更快走向盈利。如果合作伙伴验证瓶颈出现——这在药企合作时间表中很常见——缺少自有实验基础设施可能拖慢商业数据生成和管线建设。
