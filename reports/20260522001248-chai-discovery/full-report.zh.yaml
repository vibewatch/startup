  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模型架构
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 的产品组合分为两个明确层级。Chai-1 于 2024 年 10 月以 biorxiv 预印本形式发布，并在 PyPI（chai_lab，目前为
              v0.6.1）开放，是一个多模态基础模型，在单一架构中统一预测蛋白质、小分子、DNA、RNA、糖基化以及混合模态复合物。它接收 FASTA 输入，可选连接 MSA 服务器（MMseqs2/ColabFold
              集成），也可用交联质谱数据等实验约束提示模型，把预测准确率提升两位数百分点。Chai-1 按 Apache 2.0 发布，允许学术和商业使用。推荐推理硬件是 NVIDIA A100 80 GB 或 H100 80
              GB；A10 和 A30 支持更小的复合物，用户也报告过用消费级 RTX 4090 GPU 成功运行。

              Chai-2 于 2025 年 6 月发布，是一个专有多模态生成模型，专为完全从头抗体和迷你蛋白设计而建。不同于 Chai-1 预测现有或假设序列的结构，Chai-2
              只用目标抗原和表位规格，就能从零生成新型抗体序列，在没有任何种子序列或既有结合体的情况下设计全部六个互补决定区（CDR）。联合创始人 Jack Dent 表示：“我们代码库里的每一行代码都是自研的。我们不是从开源
              [生态] 中拿现成 LLM 再微调。这些都是高度定制的架构。”Chai-2 的模型权重和训练数据没有公开披露；访问由早期访问合作伙伴计划把关。lab.chaidiscovery.com
              的浏览器界面在认证后提供免费的 Chai-1 预测，包括商业药物发现用途。
