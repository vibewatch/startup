        - 首付款、里程碑、排他性、续约权和收入确认处理。
        - 没有这些信息，投资者无法判断 Lilly 到底是有意义的商业锚点，还是主要只是信号事件。
        - 要求管理层披露，或在 NDA 下进入资料室查看。
      - - 股权结构表与优先股堆叠
        - 清算优先权、按比例跟投权，以及任何影响普通股结果的结构。
        - 不了解收益如何在不同证券之间分配，私营估值意义有限。
        - 审查投资条款清单和最新股权结构分配瀑布。
