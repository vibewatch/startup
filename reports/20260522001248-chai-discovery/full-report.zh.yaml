      - number: '3.3'
        title: 开源与现状替代方案
        blocks:
          - type: paragraph
            body: >
              开源和免费工具对 Chai Discovery 构成一类独立且被低估的竞争威胁。AlphaFold Database（alphafold.ebi.ac.uk）由 EMBL-EBI 与 Google
              DeepMind、NVIDIA 和 Seoul National University 合作维护，按 Creative Commons Attribution（CC-BY-4.0）许可提供超过 200
              million 个蛋白的预测结构。2026 年 3 月更新后，覆盖扩展到蛋白复合物结构。蛋白结构预测作为独立价值层由此被永久商品化——任何具备标准生物信息能力的制药团队都可以免费访问这些预测。Google
              DeepMind 发布的 AlphaFold3 把覆盖范围扩展到蛋白-核酸和蛋白-小分子相互作用；不过，模型权重下载需要 Google DeepMind 明确批准，商业使用条款也较严格，限制了它作为 Chai
              潜在客户自托管替代方案的可部署性。最尖锐的开源商品化风险是 Boltz-2（github.com/jwohlwend/boltz），它按 MIT License 发布。Boltz-2 在结构预测准确性上明确对标
              Chai-1，并额外预测结合亲和力——这是 Chai-1 不提供的能力，也把它的用途从结构预测扩展到配体排序。完全宽松的许可（MIT）意味着任何制药公司或学术团队都可以在生产环境部署
              Boltz-2，无需授权费或限制。Meta AI 按 MIT license 开发的
              ESMFold（github.com/facebookresearch/esm），不需要多序列比对就能从单一序列预测蛋白结构，支持早期筛选所需的快速推理。OpenFold（github.com/aqlaboratory/openfold）提供按
              Apache 2.0 授权的 AlphaFold2
              复现，让学术实验室可以用专有数据微调结构预测模型，进一步模糊商业能力与学术能力边界。除这些计算工具外，现状替代方案还包括传统抗体发现方法（杂交瘤融合和噬菌体展示）；这些方法在 2024 年占更广泛抗体发现市场的
              38.1%，并且仍被充分理解、风险更低，也有成熟 CRO 基础设施支持。Genentech、AstraZeneca、Pfizer 等大型制药公司的内部 AI 团队，则代表自建替代方案，可能压缩外部 AI
              设计平台的总可用市场。战略含义很直接：Chai 必须在从头设计和候选物生成层做出差异化，而不是结构预测层；结构预测正越来越像免费的公共品。
            claimRefs:
              - CP015
              - CP016
