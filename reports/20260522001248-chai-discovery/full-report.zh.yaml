      - number: '7.5'
        title: IP、法律与生物安全风险
        blocks:
          - type: paragraph
            body: >-
              本章最明确的负面证据集中在 IP 边界设定和生物安全。Chai 对 Chai-1 选择了相对开放的软件姿态，按 Apache 2.0
              发布代码和权重，并通过多个开发者渠道分发制品。这个选择加速生态采用，但也削弱了单靠软件封装形成的产品护城河。与此同时，周边市场显示政策环境可能多么不稳定：AlphaFold 3
              发布后引发了关于代码访问的公开争议，DeepMind 发布的条款也把权重限定为非商业使用。独立生物安全文献更进一步，认为先进生物 AI 模型可能具备令人担忧的双重用途能力，并可能需要保护措施或限制。对 Chai
              而言，这形成双重束缚。访问太开放，误用和泄漏风险上升；访问太严格，商业转化和社区采用放慢。公司需要明确的治理、日志记录和部署控制，才能让这组权衡仍具可投资性。
