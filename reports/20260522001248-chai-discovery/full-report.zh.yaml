      - CE021
      - CE022
      - CE026
  - id: FE002
    title: Chai-2 抗体设计工作流
    type: flow
    layout: standard
    summary: 从靶点规格到实验室验证抗体命中物的端到端工作流，使用 Chai-2 可在两周内完成。
    data:
      nodes:
        - id: n1
          label: 定义靶点 + 表位
          description: 研究者指定感兴趣的抗原靶蛋白和表位区域；不需要已有结合物
        - id: n2
          label: Chai-2 从头生成序列
