      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              Chai 的悲观情景不是技术崩盘，而是在商业转化跑通前先遭遇估值压缩。如果 Lilly 仍是唯一有分量的验证点，后续可开发性数据无法走出公司自述材料， 或者 AI 药物发现板块继续带着验证折价交易，Chai
              的估值可能更接近 $0.4 billion 至 $0.8 billion。基准情景约 $0.9 billion 至 $1.4 billion，前提是 Lilly 需求可复制而非一次性交易，Chai
              守住技术可信度，并在短期内不进临床的情况下， 把基准测试热度转成更持久的客户价值。乐观情景约 $1.8 billion 至 $2.6 billion，不能只靠又一轮亮眼融资。它需要反复出现的大药企需求、 证明
              Chai-2 或后续模型能稳定交出达到湿实验室标准输出的证据，以及从设计成功案例走向临床收益或软件式经常性收入的更清晰路径。这些里程碑出现之前， Chai 当前估值更像落在基准情景上半区，而不是明显便宜。
