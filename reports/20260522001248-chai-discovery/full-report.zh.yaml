      - number: '2.5'
        title: AI 抗体设计子赛道
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 的核心方向——完全从头设计 AI 抗体——位于两个市场的交汇处：更广泛的抗体发现市场（2025 年 $9.78 billion，2026 年增至 $10.75
              billion）以及该市场中由 AI/ML 赋能的子分部；后者 2025–2030 年 CAGR 为 22.4%，高于整体抗体市场的
              10.1%。抗体发现市场涵盖识别治疗性抗体候选物的所有方法：杂交瘤技术（2024 年 38.1% 份额）、噬菌体展示、B 细胞工程、转基因小鼠平台，以及 AI/ML in-silico 设计。AI/ML
              分部装机基础最小，但增长最快，驱动因素是 AI 平台可以把命中物识别周期从数月压缩到数周，并降低下游可开发性测试中的流失。制药和生物制药公司占 2024 年抗体发现支出的 48.3%；生物技术初创公司则以
              14.8% CAGR 推进。North America 在 2024 年占据 41.5% 市场，Asia-Pacific 以 13.5% CAGR 增长最快。在 AI
              抗体子赛道中，关键差异点是从头设计，而不是对实验发现先导物做 in-silico 优化。Chai 的 Chai-2
              平台瞄准从头设计用例——只给定目标蛋白，不给实验种子分子，就从零设计抗体。这个问题明显比序列优化或亲和力成熟更难，相比 AI 辅助筛选，它也对应更高价值主张（以及更高采用门槛）。AI
              蛋白结构预测市场是紧密相关的使能层，估计 2025 年为 $1.8 billion，2026 年以约 30% CAGR 增至 $2.33 billion，并在 2030 年达到 $6.62
              billion。这一结构生物学基础设施支撑所有 AI-native 抗体设计平台，也是 Chai 与竞争对手竞争的计算基础。Chai 在这一子赛道中的 SAM
              受限于当前伙伴访问模式，以及从头设计抗体市场作为独立商业类别仍处早期。
