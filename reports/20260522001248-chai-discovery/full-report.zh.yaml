      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 定义范围推动市场规模估算相差 9 倍
            body: >
              2026 年 AI 药物发现估算的 $1.94B–$24.51B 区间，核心不是预测分歧，而是定义分歧。窄口径分析师（GVR、Axis）只计算 pre-IND AI 软件；宽口径分析师（GMI/Towards
              Healthcare）纳入临床 AI 和制造 AI。买方和投资者必须根据问题选择正确参照物：评估 Chai 竞争位置时，窄口径 $2–5B 区间才是正确市场。若看制药采购预算背景，$194B 全球 R&D
              支出才是正确分母。
            calloutType: insight
            claimRefs:
              - CM003
              - CM010
