    layout: wide
    summary: |
      矩阵从五个证据维度评估四类已识别客户或用户群体：来源独立性、财务确认、部署阶段、结果可见性和总体证据质量。确认用户结构极度偏向非商业用户；只有 Eli Lilly 达到已验证付费合作伙伴门槛。
    data:
      columns:
        - 来源独立性
        - 财务确认
        - 部署阶段
        - 结果可见性
        - 总体证据质量
      rows:
        - label: Eli Lilly（大型药企）
          values:
            - 官方新闻稿 + 独立新闻
            - 已确认（条款未披露）
            - 生产部署——多个靶点、定制模型
            - 无（尚无临床产出）
            - 高
        - label: 早期访问生物技术公司（未具名）
          values:
            - 仅投资者评论
            - 未确认
            - 试点 / 评估
            - None
            - 低
        - label: 学术 / 研究（Chai-1）
          values:
            - GitHub API、PyPI、HuggingFace（独立）
            - 不适用（免费）
            - 非商业使用
            - 论文发表、GitHub 活动
            - 中
        - label: Chai 内部（基准测试）
          values:
            - 公司撰写的 biorxiv 预印本
            - 不适用
            - 内部研发
            - 预印本，无同行评议
            - 低
    claimRefs:
      - CU001
      - CU007
      - CU010
      - CU015
      - CU017
      - CU024
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: >
      以三个队列、四个时间窗口观察 Chai 客户管线留存。第 1 行模拟 Chai-2 申请方向正式付费合作伙伴的估计转化漏斗。第 2 行将 Chai-1（2024 年 9 月队列）已确认 GitHub star 增长标准化为
      0–100，显示开发者社区建设。第 3 行估计学术用户留存衰减。所有数值均为估计或标准化结果——Chai 未披露任何分部的实际留存百分比。
    data:
      columns:
        - 第 3 个月
        - 第 6 个月
        - 第 12 个月
        - 第 18 个月
      rows:
        - label: Chai-2 合作伙伴管线（2025 年 7 月队列，估算）
          values:
            - 100
            - 25
            - 8
            - 3
        - label: Chai-1 GitHub 社区增长（归一化，2024 年 9 月队列）
          values:
            - 26
            - 52
            - 77
            - 100
        - label: 学术 / 研究用户留存（估算）
          values:
            - 100
            - 80
            - 60
            - 40
    approximationNotes: >
      第 1 行：第 3 个月的 100% 代表早期访问管线中的全部申请方；估计第 6 个月有 25% 获得早期访问（根据 Menlo Ventures 评论和典型制药 BD 周期推断）；约 8% 在第 12 个月转为试点；约 3%
      在第 18 个月成为正式付费合作伙伴。公司未披露实际转化率。第 2 行：归一化 GitHub star 数（M+3 估计 500、M+6 为 1,000、M+12 为 1,500、M+18 确认为 1,938），以第 18
      个月重新索引为 100。第 3 行：学术用户留存根据典型研究软件采用衰减估算；Chai 未披露实际学术留存数据。
    claimRefs:
      - CU027
      - CU028
      - CU034
      - CU036
