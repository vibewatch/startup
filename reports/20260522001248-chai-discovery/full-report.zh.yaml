    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 决策流把 Chai 的技术前景、有限商业证明、行业风险和当前定价串起来，导向跟踪建议。
    approximationNotes: 本图面向决策而非穷尽所有因素；重点是当前估值尽调中最关键的变量。
