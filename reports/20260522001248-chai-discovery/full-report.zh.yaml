  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与科学风险
        blocks:
          - type: paragraph
            body: >-
              Chai 的技术承诺很大胆：公司把 Chai-2 定位为具备原子级精度的从头抗体设计，同时把 Chai-1 定位为开放、领先的多模态结构模型。风险不在于模型没意思，而在于基准质量和治疗质量不是一回事。Chai
              的公开证据仍主要来自一组预印本和公司发布材料，而不是独立、同行评议的转化研究。本章最强的外部评论都指向同一个失败模式：即便模型提出了结合体或看似合理的结构，抗体后续仍会因为聚集、表达差、不稳定、剪切、脱靶相互作用或免疫原性而失败。Chai
              尚未公布足够的原始湿实验室数据或第三方复现，外部无法独立验证其最具商业意义的主张——接近 20% 的 Chai-2
              命中率。这个缺口并不否定公司，但意味着投资人承销的仍是一个部分黑箱的科学到产品转化问题，而不是一个已完全验证的平台。
