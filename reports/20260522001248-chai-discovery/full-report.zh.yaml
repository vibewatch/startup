      - number: '2.2'
        title: 市场规模测算：TAM、SAM、SOM 与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              Chai 的总可用市场（TAM）可以分两层来看。最宽层面，全球制药 R&D 支出约 $300 billion，代表更好的发现工具最终可能替代或增强的全部支出。更实际地看，Statista 估计 2026
              年管线接近 23,000 个在研候选药物，来自超过 7,000 家公司——这些都是 AI 辅助分子设计的潜在受益者。可服务市场（SAM）是其中流向 AI 发现软件和生物药平台的支出子集。以 Mordor
              Intelligence 对 AI 制药 R&D 的 $4.36 billion（2026 年）作为最宽可信商业估算，再与 $10.75 billion（2026 年）的抗体发现市场交叉校验，Chai 的
              SAM——聚焦生物药的 AI 设计——可估计为 2026 年约 $1–2 billion，并会随从头设计能力成熟而上升。可获取市场（SOM）要小得多：Chai
              仍处商业化前，依赖选择性伙伴访问，并与既有玩家竞争；对 2026–2028 规划期而言，$100–300 million 的早期部署收入 SOM 属于保守且合适的估算。分析师对窄口径 AI 药物发现市场的估算相差
              9 倍，主要由定义范围驱动。Grand View Research 将 2025 年市场定为 $2.35 billion（到 2033 年 CAGR 24.8%）。Axis Intelligence 将其收窄至
              $1.94 billion（2025 年），CAGR 27%。Fortune Business Insights 报告为 $4.46 billion（2025 年），CAGR 更保守，为
              12.2%。最乐观报告（Global Market Insights/Towards Healthcare）把临床 AI 纳入后，给出 2026 年 $24.51
              billion；这个数字高估了纯发现平台的相关市场。相互矛盾的 CAGR 估算（11.3%–32.25%）大体跟随范围差异：窄范围 CAGR 较低，宽范围吸收了增长更快的临床分部。
