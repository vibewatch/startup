      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              Chai Discovery 的创始团队把深度 AI 研究能力、生物制药经验和大规模工程经验组合在一起。联合创始人兼 CEO Joshua Meier 2018 年曾在 OpenAI 研究和工程团队任职，之后加入
              Meta FAIR，共同主导 ESM1 的开发——ESM1 是首个 transformer 蛋白语言模型，也是现代蛋白 AI 的基础前身。Meier 随后在 Absci 工作约三年，他与联合创始人 Matthew
              McPartlon 领导 AI 部门，率先开展从头设计抗体的早期研究，并贡献了如今进入临床试验的多个候选药物。联合创始人兼总裁 Jack Dent 曾任 Stripe
              工程和产品负责人，具备构建高韧性大规模机器学习系统的经验；他和 Meier 最早在 Harvard 计算机科学课堂相识，后来由 OpenAI CEO Sam Altman 介绍潜在合作。Jacques
              Boitreaud 曾任 Aqemia AI 负责人，将面向小分子发现的 ML 工具推向生产。投资者把四位创始人的合作称为「酝酿了十年的伙伴关系」。治理层面，Mikael Dolsten 于 2025 年加入
              Chai 董事会；他曾任 Pfizer 首席科学官，负责推进超过 150 个分子进入临床试验，并交付 36 款获批药物。2025 年 12 月 Series B 之后，Oak HC/FT 联合创始人兼管理合伙人
              Annie Lamont，以及 General Catalyst 董事总经理 Hemant Taneja 也加入董事会。关键人物风险较高：Meier 支撑技术愿景和团队声誉，也是顶级投资者与合作伙伴信任的核心。
