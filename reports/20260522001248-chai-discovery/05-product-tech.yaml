  - id: deployment-roadmap-trust
    title: Deployment, Roadmap, and Trust Controls
    body: >
      Chai-2 is deployed exclusively through early-access partnerships with select academic
      institutions and biopharma organizations. The company operates what it calls a Responsible
      Deployment Framework, focused on health-positive, low-risk applications, biosafety, and
      alignment with societal goals. The January 2026 Eli Lilly collaboration—in which Lilly's
      TuneLab program integrates Chai-2 for biologics discovery—is the highest-profile partner
      deployment to date. Menlo Ventures partner Greg Yap noted publicly that "a meaningful
      fraction of the biotech industry already applied for Chai-2 access" at the Series A
      announcement, though no specific applicant count or approval rate has been disclosed.

      From a regulatory compliance standpoint, FDA published draft guidance in January 2025
      titled "Considerations for the Use of Artificial Intelligence to Support Regulatory
      Decision-Making for Drug and Biological Products" and had reviewed over 500 AI-incorporating
      drug submissions since 2016. Antibody candidates designed by Chai-2 would still require
      full IND-enabling studies, clinical trials (Phase I–III), and regulatory review before
      approval; the Chai platform accelerates discovery-stage design, not clinical or regulatory
      approval. No FDA pathway specifically addresses AI-designed biologics as a distinct
      category as of May 2026. Biosafety concerns related to de novo antibody design (dual-use
      risk of generating novel binders to dangerous targets) are acknowledged but not fully
      mitigated by public documentation. The company's roadmap includes expanding Chai-2 to
      additional modalities (peptides, enzymes, small molecules) and potentially broader formats
      (bispecific antibodies, ADCs), but specific timelines are not publicly disclosed.
