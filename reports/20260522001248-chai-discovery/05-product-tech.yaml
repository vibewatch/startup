company:
  name: Chai Discovery

chapter:
  number: 5
  title: Product & Technology
  summary: >
    Chai Discovery operates a two-tier product architecture: Chai-1, an open-source multimodal
    foundation model for molecular structure prediction released under Apache 2.0, and Chai-2, a
    proprietary generative model achieving a company-reported 16% de novo antibody design hit
    rate—over 100× above prior computational methods—tested across 52 diverse targets with no
    preexisting PDB binders. All Chai-2 benchmark data originates from company-authored biorxiv
    preprints that have not yet undergone peer review, representing a material reproducibility gap.
    The developer ecosystem around Chai-1 is active (PyPI package, HuggingFace hub, GitHub repo),
    while Chai-2 access is gated through a selective partner program governed by a Responsible
    Deployment Framework.

sections:
  - id: product-suite-architecture
    title: Product Suite and Model Architecture
    body: >
      Chai Discovery's product portfolio has two distinct tiers. Chai-1, released in October 2024
      as a biorxiv preprint and made available on PyPI (chai_lab, currently v0.6.1), is a
      multimodal foundation model that unifies prediction of proteins, small molecules, DNA, RNA,
      glycosylations, and mixed-modality complexes in a single architecture. It accepts FASTA
      inputs, optionally connects to an MSA server (MMseqs2/ColabFold integration), and can be
      prompted with experimental restraints such as crosslinking mass spectrometry data to boost
      prediction accuracy by double-digit percentage points. Chai-1 is released under Apache 2.0,
      permitting academic and commercial use. The recommended inference hardware is an NVIDIA A100
      80 GB or H100 80 GB; A10s and A30s support smaller complexes, and users have reported
      success with consumer RTX 4090 GPUs.

      Chai-2, unveiled in June 2025, is a proprietary multimodal generative model purpose-built
      for fully de novo antibody and miniprotein design. Unlike Chai-1—which predicts the
      structure of existing or hypothetical sequences—Chai-2 generates novel antibody sequences
      from scratch using only a target antigen and epitope specification, designing all six
      complementarity-determining regions (CDRs) without any seed sequence or prior binder.
      According to co-founder Jack Dent, "Every line of code in our codebase is homegrown. We're
      not taking LLMs off the shelf that are in the open source [ecosystem] and fine-tuning them.
      These are highly custom architectures." Chai-2 model weights and training data are not
      publicly disclosed; access is gated through an early-access partner program. A browser-based
      interface at lab.chaidiscovery.com provides free Chai-1 predictions including for commercial
      drug discovery after authentication.
