  - id: TE002
    title: Antibody Design Workflow Use-Case Table
    columns:
      - User Job / Goal
      - Current / Prior Workflow
      - Chai-2 Solution
      - Measurable Benefit (Reported)
      - Key Limitation
    enumerationScope:
      coverage: partial
      basis: Representative use-cases from Chai-2 biorxiv preprints and businesswire announcements; not exhaustive across all therapeutic modalities
    rows:
      - - De novo antibody hit discovery against novel antigen
        - High-throughput screening of antibody libraries (>10⁶ designs); weeks-to-months timelines
        - Generate ≤20 in silico candidates from target+epitope; wet-lab validate in under 2 weeks
        - 16% hit rate vs <0.1% traditional; 50% target success rate across 52 targets
        - Self-reported performance; no head-to-head prospective comparison with best-in-class library screening
      - - Nanobody (VHH) design for compact biologics
        - Camelid immunization + phage display; 3–6 month timelines; significant animal use
        - Chai-2 zero-shot VHH generation; picomolar binders achieved for miniprotein benchmarks
        - 68% success rate for miniprotein design; picomolar affinity in reported cases
        - VHH-specific validation set smaller than full IgG dataset; developability data limited
      - - Full-length mAb design with drug-like properties
        - Hybridoma, phage display, or humanization of animal-derived antibodies
        - Full-length VH-VL format generation with developability scoring integrated
        - ">86% of designs with therapeutic-grade developability profiles (challenging-targets paper)"
        - Crystal structure validation limited to subset; GPCR targets remain challenging
      - - Antibody design against previously intractable targets
        - "Failure mode: target unable to generate functional antibodies via conventional means"
        - Chai-2 reported solving a challenge previously costing >$5M and 3+ years in hours
        - Lab validation within 2 weeks in one documented case; GPCR agonist antibodies designed
        - Single case-study level; systematic data on "intractable" target class not yet published
      - - Academic protein structure prediction at no cost
        - AlphaFold2/3 Server, ESMFold API, or local ColabFold installation
        - lab.chaidiscovery.com free web access to Chai-1 predictions including commercial use
        - Comparable accuracy to AF3 on CAMEO/CASP tasks per company-reported benchmarks
        - Web interface capacity not documented; MSA integration requires external MSA server call
    notes: "Benefit data from company preprints; traditional method hit rates (<0.1%) from businesswire and techcrunch sources citing industry standards; no independent head-to-head published."
