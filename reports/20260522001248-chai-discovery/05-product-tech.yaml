  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk / Constraint
    enumerationScope:
      coverage: partial
      basis: Derived from biorxiv technical reports and GitHub documentation; Chai-2 architecture is proprietary and not fully disclosed
    rows:
      - - Multimodal transformer (Chai-1 core)
        - Simultaneous encoding of protein, small molecule, DNA, RNA, glycan modalities
        - Custom homegrown architecture; CUDA GPU (A100/H100 preferred)
        - Architecture details partially disclosed in biorxiv preprint; not peer-reviewed
      - - MSA generation module
        - Provides multiple sequence alignment context to boost prediction accuracy
        - External MMseqs2/ColabFold MSA server; optional but performance-enhancing
        - Dependency on third-party server availability; single-sequence mode degrades accuracy
      - - Experimental restraint conditioning
        - Allows wet-lab data (e.g., crosslinking MS) to guide structure prediction
        - Upstream experimental data from laboratory partners
        - Requires experimental data as input; not always available in early discovery stages
      - - CDR generative engine (Chai-2 proprietary)
        - De novo generation of all six antibody CDR loops from target+epitope specification
        - Proprietary training data including PDB antibody structures and epitope–antibody pairs
        - Proprietary; no independent replication possible; training data composition undisclosed
      - - Developability assessment integration
        - Evaluates generated antibodies for drug-like profiles (polyreactivity, PSR, stability)
        - Internal scoring models + LAP-style liability profiling
        - Developability metric thresholds and scoring methodology not publicly documented
    notes: "Chai-2 architecture is proprietary; information derived from biorxiv preprints and GitHub README. Specific model hyperparameters, training data volumes, and fine-tuning protocols are not publicly disclosed."
