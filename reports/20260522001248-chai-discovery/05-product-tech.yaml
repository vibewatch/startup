callouts:
  - calloutType: strength
    title: 100× Antibody Design Hit Rate — a Potential Paradigm Shift
    body: >
      Chai-2's reported 16% de novo antibody hit rate against 52 PDB-novel targets, compared to
      sub-0.1% for prior computational methods, represents a step-change if confirmed by
      independent validation. The two-week design-to-validation cycle and nanomolar affinities in
      reported cases suggest genuine functional value rather than marginal incremental gain.
    claimRefs:
      - CE007
      - CE009
      - CE010

  - calloutType: risk
    title: All Benchmark Data is Self-Reported and Not Peer-Reviewed
    body: >
      Every Chai-2 antibody design performance claim originates from biorxiv preprints authored
      exclusively by Chai Discovery employees. No independent academic group or third-party CRO
      has published a replication or head-to-head validation. The Chai-1 preprint similarly
      benchmarked AlphaFold3 using AF3's own publicly released predictions rather than running
      AF3 natively. Until peer-reviewed publications or independent external validations appear,
      performance claims carry material uncertainty.
    claimRefs:
      - CE016
      - CE034

  - calloutType: insight
    title: Open-Core Apache 2.0 Licensing Creates Developer Ecosystem Lock-In
    body: >
      By releasing Chai-1 under Apache 2.0 with a PyPI package and HuggingFace model card,
      Chai Discovery is building the same developer-community foundation that successful open-core
      companies use to entrench commercial upsell. Research teams that build workflows on Chai-1
      become natural buyers for Chai-2 early access when they need antibody design capabilities.
    claimRefs:
      - CE003
      - CE022

