  - id: antibody-subsegment
    title: "AI Antibody Design Subsegment"
    body: >
      Chai Discovery's core focus—fully de novo AI antibody design—sits at the intersection of two markets:
      the broader antibody discovery market ($9.78 billion in 2025, growing to $10.75 billion in 2026) and the
      AI/ML-enabled subsegment of that market, which is growing at 22.4% CAGR (2025–2030) versus 10.1% for
      the overall antibody market. The antibody discovery market encompasses all methods of identifying
      therapeutic antibody candidates: hybridoma technology (38.1% share in 2024), phage display, B-cell
      engineering, transgenic mouse platforms, and AI/ML in-silico design. The AI/ML segment is the smallest
      by installed base but fastest growing, driven by AI platforms' ability to compress hit identification
      timelines from months to weeks and reduce attrition in downstream developability testing. Pharma and
      biopharmaceutical companies represented 48.3% of antibody discovery spend in 2024; biotechnology
      startups are advancing at 14.8% CAGR. North America commanded 41.5% of the market in 2024, with
      Asia-Pacific growing fastest at 13.5% CAGR.
      Within the AI antibody subsegment, the critical differentiator is de novo design versus in-silico
      optimization of experimentally discovered leads. Chai's Chai-2 platform targets the de novo use case—
      designing antibodies from scratch given only the target protein, without experimental seed molecules.
      This is a significantly harder problem than sequence optimization or affinity maturation, and it commands
      a premium value proposition (and a higher barrier to adoption) relative to AI-assisted screening. The
      AI protein structure prediction market—a closely related enabler—is estimated at $1.8 billion in 2025
      growing to $2.33 billion in 2026 at approximately 30% CAGR, reaching $6.62 billion by 2030. This
      structural biology infrastructure underpins all AI-native antibody design platforms and represents the
      computational foundation on which Chai and its competitors compete. Chai's SAM within this subsegment
      is bounded by its current partner-access model and the nascent state of the de novo antibody design
      market as a standalone commercial category.
