chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    The AI drug discovery market is large, fast-growing, and beset by wide definitional disagreement: 2026 estimates
    range from roughly $2.9 billion (narrow software-only platforms) to $24.5 billion (broad ecosystem including
    clinical AI and manufacturing). The most credible midpoint for AI pharma R&D software and services is $4–5 billion
    in 2026, growing at 25–32% CAGR. Within this market, the antibody discovery subsegment ($10.75B in 2026) is
    the most directly relevant to Chai's focus, and AI/ML-enabled antibody platforms are growing at 22.4% CAGR—more
    than twice the overall antibody discovery rate. Pharma and biotech companies remain the primary buyers; large
    pharma dominates spend but AI-native biotechs are fastest to adopt. The key growth driver is a structural R&D
    productivity crisis ($2.8B per NME, 90% Phase I failure) that AI partially addresses—but clinical validation
    remains incomplete, no AI-designed drug has received FDA approval as of May 2026, and scale-up barriers
    (data readiness, organizational inertia, switching costs) keep Chai's near-term SAM small relative to the TAM.

sections:
  - id: market-boundary
    title: "Market Boundary and Scope"
    body: >
      Defining the market precisely matters because analyst estimates span an order of magnitude depending on
      whether "AI drug discovery" is defined narrowly or broadly. The narrowest definition—used by Axis Intelligence
      and Grand View Research—covers only AI-enabled software and related services that materially support target
      identification, hit and lead generation, lead optimization, de novo molecular design, and preclinical
      candidate selection before IND filing. This definition excludes AI used for clinical trial operations,
      regulatory submissions, pharmacovigilance, manufacturing, and commercial analytics. On this narrow basis,
      the 2026 market is $2–5 billion. The medium definition used by Mordor Intelligence adds AI-enabled
      formulation and drug repurposing analytics, yielding $4.36 billion in 2026. The broadest definition, adopted
      by Global Market Insights and Towards Healthcare, includes all AI software touching the full pharma value
      chain—clinical trials, manufacturing, and patient matching—arriving at $24.51 billion in 2026.
      For Chai Discovery, the relevant perimeter is the narrowest definition: its Chai-2 platform targets
      early-stage biologics design (antibodies, nanobodies, miniproteins) before any experimental screening, not
      clinical or manufacturing AI. The adjacent, but excluded, spend categories are: CRO bioinformatics services
      that do not rely on AI-native design, traditional wet-lab antibody discovery (hybridoma, phage display), and
      AI clinical-trial recruitment tools. The primary status-quo substitutes are traditional antibody discovery
      methods (hybridoma and phage display, representing 38.1% of the broader antibody discovery market in 2024),
      manual computational docking pipelines, and fully in-house pharma AI teams. The global pharmaceutical R&D
      base—approximately $300 billion in annual spend as of 2025—provides the demand context, though AI drug
      discovery software currently represents only about 1.5% of that total.
