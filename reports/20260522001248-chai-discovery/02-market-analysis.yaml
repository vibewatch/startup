callouts:
  - calloutType: insight
    title: "Definitional Scope Drives the 9x Market Size Spread"
    body: >
      The $1.94B–$24.51B range in 2026 AI drug discovery estimates is not primarily a forecasting disagreement
      but a definitional one. Narrow analysts (GVR, Axis) count only pre-IND AI software; broad analysts
      (GMI/Towards Healthcare) include clinical AI and manufacturing AI. Buyers and investors must select the
      right comparator depending on their question: for Chai's competitive position, the narrow $2–5B range is
      the correct market. For pharma procurement budget context, the $194B global R&D spend is the right
      numerator.
    claimRefs:
      - CM003
      - CM010
      - CM037

  - calloutType: risk
    title: "Clinical Validation Gap Constrains Commercial Momentum"
    body: >
      Despite $60+ billion invested globally in AI drug discovery since 2015, no AI-designed drug had
      received FDA approval as of May 2026. IQVIA's 2026 report found that the Phase I success advantage
      for AI programs (75%) is real but limited to the emerging biopharma segment and does not yet translate
      to improved overall industry success rates. Chai's buyers are rational to demand evidence that the
      platform can produce clinical-stage assets before committing large milestone budgets—making the
      Eli Lilly collaboration a critical commercial proof point that remains unresolved at the run date.
    claimRefs:
      - CM019
      - CM020
      - CM021
      - CM038

