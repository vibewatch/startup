  evidenceGaps:
    - type: missing-source
      severity: material
      topic: de-novo-antibody-design-standalone-market
      missingEvidence: >
        No analyst report isolates de novo AI antibody design as a standalone revenue category distinct from
        broader AI-assisted antibody discovery or AI drug discovery. The exact commercial addressable market
        for pure de novo antibody design platforms like Chai-2 is not quantified in public analyst coverage.
      whyItMatters: >
        Without a standalone market size for de novo antibody design, Chai's SOM estimate ($100–300M for
        2026–2028) is inference-derived and not independently validated. This makes it difficult to assess
        the platform's revenue ceiling against the broader market it participates in.
      diligencePath: >
        Engage CRO pricing data and comparable platform deals (e.g., Isomorphic Labs, Generate Biomedicines
        IPO disclosures) to triangulate per-program economics; seek proprietary analyst research from
        Evaluate Pharma or PharmaIntelligence on computational antibody design commercial activity.
      relatedQuestionRefs:
        - QM027

    - type: private-evidence-only
      severity: material
      topic: chai-sam-validation
      missingEvidence: >
        Chai has not publicly disclosed the number of active commercial partnerships, total partner count,
        per-program economics, or pipeline of prospective buyers as of May 2026. The SOM estimate cannot
        be validated from public data.
      whyItMatters: >
        The gap between Chai's $1.3B valuation and unconfirmed commercial revenues requires investors to
        trust the platform's discovery performance and the Lilly deal as forward proxies. Without commercial
        pipeline disclosures, SOM is speculative.
      diligencePath: >
        Request Chai commercial pipeline data, LOI/MOU counts, and per-collaboration economics through
        data room access; cross-check against Eli Lilly's public disclosures for any referenced milestones.
      relatedQuestionRefs:
        - QM020
        - QM027

    - type: access-blocked
      severity: minor
      topic: market-estimate-revisions
      missingEvidence: >
        No systematic time-series of analyst estimate revisions was accessible; it is unclear whether
        current estimates represent material upward/downward revisions from prior-year forecasts or
        merely continuations of the same growth trajectory.
      whyItMatters: >
        If leading analysts have recently revised AI drug discovery estimates downward due to clinical
        trial failures or market saturation signals, current forecasts may be overstated; conversely,
        significant upward revisions would strengthen the bull case.
      diligencePath: >
        Subscribe to GVR and Mordor Intelligence annual report updates; track year-over-year estimate
        changes; monitor AllAboutAI and Axis Intelligence for quarterly market updates.
      relatedQuestionRefs:
        - QM024
