  - id: buyer-segmentation
    title: "Buyer, User, and Payer Segmentation"
    body: >
      The primary buyer segments for AI drug discovery platforms are pharmaceutical and biotechnology companies,
      which together accounted for 59.45% of AI pharma R&D spend in 2025. Within this group, large pharmaceutical
      companies (those with R&D budgets exceeding $8 billion annually, such as Eli Lilly, AstraZeneca, Roche,
      and Novartis) are the highest-spending buyers but are slower to adopt new external platforms. They
      typically engage AI discovery companies through research collaborations, equity investments, or milestone-
      based licensing agreements—as evidenced by Eli Lilly's more than $3.75 billion in AI drug discovery deals
      signed in Q1 2026 alone. Mid-size and specialty pharma companies tend to allocate $10–50 million per year
      to AI drug discovery, primarily through milestone-driven collaborations rather than large upfront commitments.
      AI-native biotechs are the fastest-growing buyer segment and show 73% higher AI adoption rates than big
      pharma. They deploy AI across their entire pipeline and represent an important referral and validation
      channel. Traditional biotechs are more selective, typically running one or two AI pilot programs. Contract
      research organizations (CROs) are the fastest-growing end-user segment by CAGR (33.15% through 2031) as
      they integrate AI capabilities to offer expanded discovery services to pharma clients. Academic and research
      institutes are a growing segment but are not major commercial budget holders. The budget owner is
      typically the Head of Discovery Biology or Chief Scientific Officer, with procurement increasingly
      involving Chief AI Officers and platform architects. The adoption trigger is typically the need to address
      a specific target class where traditional methods have failed or are too slow, combined with pressure from
      patent cliff timelines.
