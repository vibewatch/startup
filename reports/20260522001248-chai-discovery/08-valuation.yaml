- id: valuation-method-and-comparable-set
  title: Valuation method and comparable set
  body: 'A classical DCF is false precision for Chai today because the company has not disclosed revenue,
    margins, contract duration, or a product-level commercialization model. The cleaner method is cross-checking
    the last-round mark against public and private reference points that do disclose at least some combination
    of revenue, cash, sentiment, or clinical stage. On that basis, Chai’s $1.3 billion mark is demanding.
    Recursion trades around $1.65 billion of market cap with disclosed revenue, cash, and public-market
    transparency. Generate trades around $1.79 billion while already carrying a Phase 3 lead program plus
    disclosed cash and quarterly revenue. Schrödinger, with hundreds of millions of revenue and public
    financial statements, sits below Chai at about $0.99 billion market cap, and Absci sits lower still
    near $0.79 billion. Private capital formation also cuts both ways: Isomorphic and Xaira show that
    investors will still fund frontier AI-biotech platforms aggressively, but their larger capital bases
    do not remove the fact that Chai is already valued near or above public names with materially stronger
    evidence depth.'
