- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status / stage
  - Current value marker
  - Why relevant
  - Main limitation
  rows:
  - - Chai Discovery
    - Private, founded 2024, preclinical platform
    - Last round $1.3B valuation
    - The asset being judged.
    - Private-company economics, cap table, and revenue remain undisclosed.
  - - Recursion Pharmaceuticals
    - Public AI-drug-discovery platform
    - ~$1.65B market cap; ~$1.07B EV
    - Closest public AI-platform reference with disclosed cash and revenue.
    - Public-market volatility and much larger share count complicate clean comparison.
  - - Schrödinger
    - Public software + drug-discovery platform
    - ~$0.99B market cap; ~$0.70B EV
    - Shows what disclosed revenue and software economics can trade at in this sector.
    - Business mix is broader and more software-heavy than Chai’s.
  - - Absci
    - Public AI biologics platform
    - ~$0.79B market cap; ~$0.67B EV
    - Closer biologics-design framing and still early commercial proof.
    - Small revenue base and public-market risk make it a low-proof comp.
  - - Generate:Biomedicines
    - Public techbio with Phase 3 lead asset
    - ~$1.79B market cap
    - Useful upper-quality benchmark because it has disclosed cash, revenue, and Phase 3 proof.
    - Clinical-stage company with a very different asset profile.
  - - Isomorphic Labs
    - Private AI drug-design platform
    - Raised $600M in 2025 and $2.1B in 2026
    - Shows how much capital top-tier AI-biotech platforms can attract.
    - No disclosed valuation anchor in retained sources.
  - - Xaira
    - Private AI-drug-discovery launch
    - $1B committed funding at launch
    - Illustrates continued private appetite for frontier AI-biotech formation.
    - Funding size is not the same thing as a priced valuation.
  notes: 'Comparable set is intentionally partial: it spans the public and private reference points actually
    used in this valuation discussion rather than every AI-biology company in the market.'
