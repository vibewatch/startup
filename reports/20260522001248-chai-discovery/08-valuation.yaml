company:
  name: Chai Discovery
chapter:
  number: 8
  title: Valuation
  summary: 'Chai Discovery’s December 2025 Series B priced the company at $1.3 billion after barely a
    year in market, which is enough to validate serious investor and partner belief but not enough to
    prove the valuation is cheap. The bull case rests on Chai-2’s reported benchmark performance, elite
    AI founding talent, and Lilly’s willingness to run a custom-model collaboration; the bear case is
    that Chai still has no public revenue, no disclosed clinical-stage asset, and only one named marquee
    customer while public comps with stronger disclosure or clinical proof trade at similar or only modestly
    higher equity values. Recommendation: track, confidence medium, valuation stance stretched.'
sections:
- id: recommendation-and-entry-discipline
  title: Recommendation and entry discipline
  body: 'Chai Discovery is not an easy short thesis: the company has raised a meaningful amount of capital,
    recruited a founding team with real frontier-model credibility, and convinced Eli Lilly to run a custom-model
    collaboration on proprietary biologics data. Those are unusual proof points for a company founded
    in 2024. But they do not automatically make the last disclosed price attractive. At a $1.3 billion
    Series B mark, Chai is already priced as a serious AI-biotech platform even though public materials
    still do not disclose revenue, ARR, margins, or any clinical-stage asset. The right recommendation
    is therefore track, not buy and not avoid. Track reflects a real technology story with one high-quality
    strategic customer; it also reflects the fact that the current mark leaves little margin for execution
    missteps. Investors should underwrite Chai as an option on future proof, not as a de-risked software
    or biotech operating model. Until the company can show repeat customer demand, clearer commercial
    economics, or translational proof beyond Lilly, entry discipline should remain strict and price-sensitive.'
