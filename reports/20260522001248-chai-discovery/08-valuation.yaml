- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What changes the view
  rows:
  - - Technical proof
    - Chai-2 claims near-20% hit rates and >100-fold improvement in de novo antibody design.
    - The strongest performance evidence is still company-authored and not yet translated into clinical
      proof.
    - Independent wet-lab replication or broader downstream data would strengthen the case.
  - - Customer validation
    - Lilly evaluated Chai designs and funded a custom-model collaboration.
    - Only one named marquee customer is visible in retained sources.
    - A second major pharma customer would reduce concentration risk.
  - - Team quality
    - Founders bring OpenAI, Meta, and Absci experience with protein-language and design models.
    - Great founder pedigree does not guarantee commercial conversion.
    - Durable execution against customer and pipeline milestones matters more than biographies.
  - - Capital position
    - More than $225M raised gives Chai time to iterate.
    - Capital raised is still far smaller than the best-funded private AI-biotech peers.
    - Sustainable proof matters more than simply raising more money.
  - - Valuation
    - Chai is below Recursion and Generate on headline market value.
    - Those public comps disclose revenue, cash, or clinical proof that Chai lacks.
    - Move positive only if Chai closes that evidence gap faster than valuation rises.
  notes: The anti-thesis focuses on what public sources do not yet prove, not on dismissing the underlying
    technology effort.
