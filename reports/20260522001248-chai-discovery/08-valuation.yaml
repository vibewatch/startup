  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lilly-economics
    missingEvidence: Upfronts, milestones, exclusivity boundaries, renewal logic, and revenue-recognition
      terms for the Lilly collaboration.
    whyItMatters: These terms determine whether Lilly is mostly signaling value or a meaningful commercial
      and valuation anchor.
    diligencePath: Request management disclosure or NDA access to the collaboration economics and usage
      metrics.
    relatedQuestionRefs:
    - QV013
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Fully diluted cap table, liquidation preferences, and any investor rights that shape
      common-equity outcomes.
    whyItMatters: A private-company valuation is not actionable without understanding dilution and preference
      overhang.
    diligencePath: Review the latest financing documents and updated cap-table waterfall before underwriting
      a higher mark.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: customer-diversification
    missingEvidence: Named second marquee customer or credible evidence of diversified commercial pipeline
      beyond Lilly.
    whyItMatters: Platform businesses with one named major customer deserve lower valuation support than
      repeatable commercial motions.
    diligencePath: Request customer pipeline, conversions, and concentration metrics for paid or late-stage
      partner discussions.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV004
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: translation-proof
    missingEvidence: Independent wet-lab replication or downstream developability/manufacturability evidence
      for Chai-2 outputs.
    whyItMatters: Benchmark excitement only deserves premium valuation support if it translates into therapeutically
      usable outputs.
    diligencePath: Ask for partner case studies, third-party validation packages, and any preclinical
      dossiers showing reproducibility.
    relatedQuestionRefs:
    - QV015
    - QV020
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: commercial-model
    missingEvidence: Pricing model, contract duration, gross margins, and recurring-revenue profile for
      Chai’s platform or services motion.
    whyItMatters: Without this, investors cannot decide whether Chai should be valued more like software,
      services, or speculative platform biotech.
    diligencePath: Obtain management’s commercial build, pricing sheets, and cohort economics before underwriting
      a materially higher price.
    relatedQuestionRefs:
    - QV005
    - QV016
    relatedTableRefs:
    - TV006
