- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / signal
  - Why it matters
  - Action implication
  rows:
  - - No second marquee customer
    - Lilly remains the only named major partner through the next financing cycle.
    - Customer concentration stays extreme and weakens repeatability of the commercial story.
    - Keep recommendation at track or downgrade if price rises anyway.
  - - Benchmark-to-product slippage
    - Independent or downstream data fail to support Chai-2-level claims on developability or manufacturability.
    - The premium technology narrative would lose credibility.
    - Move toward bear-case range.
  - - Higher valuation without proof
    - New financing clears materially above the last round without new customer or clinical evidence.
    - Risk-reward worsens because future upside is pre-priced.
    - Pass on entry at richer terms.
  - - Sector proof disappointment
    - AI-designed drugs continue to miss Phase II differentiation or approvals remain absent.
    - The sector’s proof discount would stay in place or widen.
    - Raise required margin of safety.
  - - Lilly economics disappoint
    - Terms imply shallow adoption, narrow scope, or limited renewal potential.
    - The strongest external validation point would weaken materially.
    - Re-cut commercial assumptions and base-case range.
  notes: Triggers are ordered by how directly they would damage valuation support rather than by public
    relations impact.
  claimRefs:
  - CV012
  - CV043
  - CV044
  - CV058
  - CV060
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Lilly deal economics
    - Upfronts, milestones, exclusivity, renewal rights, and revenue-recognition treatment.
    - Without this, investors cannot tell whether Lilly is a meaningful commercial anchor or mostly a
      signaling event.
    - Request management disclosure or room-data access under NDA.
  - - Cap table and preference stack
    - Liquidation preferences, pro-rata rights, and any structure that shapes common-equity outcomes.
    - Private valuation means little without knowing how proceeds distribute across securities.
    - Review term sheets and the latest cap-table waterfall.
  - - Customer diversification
    - Evidence of additional paying or committed partners beyond Lilly.
    - A one-customer story deserves a lower multiple than a repeatable platform.
    - Ask for pipeline of commercial accounts and conversion metrics.
  - - Technical translation
    - Independent wet-lab replication and downstream developability/manufacturing evidence.
    - Benchmark excitement must convert into therapeutically usable outputs.
    - Request partner case studies or third-party validation packages.
  - - Commercial model
    - Pricing, usage model, gross margin profile, and expected contract duration.
    - These inputs are necessary for any credible software-style or services-style valuation frame.
    - Obtain product and finance build with cohort economics.
  notes: 'None of these asks is cosmetic: each materially affects what fraction of the current valuation
    can be defended on evidence rather than optimism.'
