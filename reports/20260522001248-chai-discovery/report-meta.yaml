companyProfile:
  summary: >-
    Chai Discovery is an AI drug-discovery platform company founded in early 2024 in San Francisco by four
    researchers from OpenAI, Meta FAIR, Stripe, and Absci. In under two years it raised approximately $230 million
    at a $1.3 billion valuation and announced a landmark collaboration with Eli Lilly in January 2026. Its two-tier
    product—open-source Chai-1 for molecular structure prediction and proprietary Chai-2 for de novo antibody
    design—targets biopharma R&D workflows. Chai-2 claims a ~16–20% de novo antibody hit rate (100× prior
    computational methods) across 52 diverse targets, based on company-authored preprints pending peer review.
    The company operates as a capital-light platform with no internal drug pipeline, no wet-lab infrastructure,
    and no publicly disclosed revenue metrics.
  foundedDate: "2024-01-01"
  founders:
    - name: Joshua Meier
      role: CEO and co-founder
      background: >-
        Former OpenAI researcher (2018) and Meta FAIR co-lead of ESM1, the first transformer protein-language
        model. Subsequently led Absci's AI division alongside co-founder McPartlon, pioneering de novo antibody
        design that contributed to multiple clinical candidates. Anchors Chai's technical vision and investor
        relationships; elevated key-person risk.
      claimRefs: [CO011, CO012, CO013]
    - name: Jack Dent
      role: President and co-founder
      background: >-
        Former Stripe engineering and product leader focused on large-scale machine learning systems. Met Meier
        at Harvard computer science; introduced to the proteomics collaboration concept by OpenAI CEO Sam Altman.
      claimRefs: [CO014, CO004, CO009]
    - name: Matthew McPartlon
      role: CTO and co-founder
      background: >-
        Hands-on AI expert in de novo antibody design from time at Absci alongside Meier; co-led Absci's AI
        division contributing to multiple drug candidates now in clinical trials.
      claimRefs: [CO015, CO013]
    - name: Jacques Boitreaud
      role: Co-founder
      background: >-
        Former AI lead at Aqemia, where he productionized machine learning tools for small molecule discovery;
        brings computational chemistry and ML-to-production expertise to the founding team.
      claimRefs: [CO016]
  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >-
    Chai operates a two-tier product architecture. Chai-1 is an open-source multimodal foundation model for
    biomolecular structure prediction (proteins, small molecules, DNA, RNA, glycosylations) released under
    Apache 2.0 in October 2024 and available free for commercial use via web and PyPI. Chai-2 is a proprietary
    generative model for fully de novo antibody design; it accepts only the target antigen and epitope as input
    and generates all CDRs from scratch, achieving a 16% hit rate across 52 diverse targets (≤20 designs per
    target) with 86%+ of full-length mAbs meeting developability criteria comparable to approved therapeutics.
    Access to Chai-2 is gated under a Responsible Deployment policy requiring partner application and approval.
  customerFocus: >-
    Large biopharma companies and biotech firms seeking to accelerate early-stage therapeutic discovery of
    biologics, particularly antibodies. Eli Lilly is the sole publicly named commercial partner as of May 2026,
    with an unspecified number of biotech companies in Chai-2 early access. Menlo Ventures cited "a meaningful
    fraction of the biotech industry" having applied for access; no additional named partners have been confirmed.
  businessModel: >-
    Platform-as-a-service model with a freemium structure: Chai-1 is free and open-source to build developer
    mindshare; Chai-2 access is provided through bespoke partner engagements under a Responsible Deployment
    policy. Revenue is expected to derive from upfront platform licensing fees, custom model development fees
    (as in the Lilly deal involving a model trained on Lilly proprietary data), and potentially milestones or
    royalties on clinical candidate advancement. All deal economics are non-public.
  stage: early-stage private (Series B)
  fundingStatus: >-
    Approximately $230 million raised across three rounds: $30M seed (September 2024, led by Thrive Capital,
    OpenAI, Dimension Capital, ~$150M valuation); $70M Series A (August 2025, led by Menlo Ventures/Anthology
    Fund, ~$550M valuation); $130M Series B (December 2025, co-led by Oak HC/FT and General Catalyst, $1.3B
    post-money valuation). Additional investors include Lachy Groom, Yosemite, Neo, SV Angel, Emerson Collective,
    and Glade Brook Capital. Board includes Mikael Dolsten (former Pfizer CSO), Annie Lamont (Oak HC/FT),
    and Hemant Taneja (General Catalyst).
