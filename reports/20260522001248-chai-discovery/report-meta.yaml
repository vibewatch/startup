summary:
  headline: >-
    Chai Discovery is a technically credible AI antibody platform with blue-chip backers and a landmark Lilly
    partnership, but its $1.3B valuation is entirely premised on unvalidated preprint benchmarks, a single
    disclosed revenue partner, and zero public financial data—warranting deeper diligence before any commitment.
