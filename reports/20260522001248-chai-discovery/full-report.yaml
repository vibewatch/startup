      - number: '7.4'
        title: Operational, Capital, and Governance Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Chai sits in the expensive middle ground between software startup and therapeutics company.
              The company has raised substantial capital and a billion-plus valuation has been reported, but public
              materials still do not disclose burn, runway, or unit economics. That makes it impossible to tell whether
              recent financing is enough to reach the next truly de-risking milestone—independent wet-lab replication, a
              second named pharma partner, or visible IND-enabling progress. Public distribution across GitHub, Hugging
              Face, PyPI, and a hosted lab product broadens reach, but it does not automatically produce durable
              enterprise revenue. Governance is also concentrated. Public materials repeatedly center the company on a
              small founding and research group, with Mikael Dolsten adding board credibility but not solving succession
              risk. If one or two of the core founders depart, Chai could face simultaneous scientific, recruiting,
              fundraising, and partner-confidence disruption. Investors therefore need to monitor not only scientific
              results but also capital efficiency, org depth, and evidence that the business can scale beyond founder
              energy.
