      - number: '2.5'
        title: AI Antibody Design Subsegment
        blocks:
          - type: paragraph
            body: >
              Chai Discovery's core focus—fully de novo AI antibody design—sits at the intersection of two markets: the
              broader antibody discovery market ($9.78 billion in 2025, growing to $10.75 billion in 2026) and the
              AI/ML-enabled subsegment of that market, which is growing at 22.4% CAGR (2025–2030) versus 10.1% for the
              overall antibody market. The antibody discovery market encompasses all methods of identifying therapeutic
              antibody candidates: hybridoma technology (38.1% share in 2024), phage display, B-cell engineering,
              transgenic mouse platforms, and AI/ML in-silico design. The AI/ML segment is the smallest by installed
              base but fastest growing, driven by AI platforms' ability to compress hit identification timelines from
              months to weeks and reduce attrition in downstream developability testing. Pharma and biopharmaceutical
              companies represented 48.3% of antibody discovery spend in 2024; biotechnology startups are advancing at
              14.8% CAGR. North America commanded 41.5% of the market in 2024, with Asia-Pacific growing fastest at
              13.5% CAGR. Within the AI antibody subsegment, the critical differentiator is de novo design versus
              in-silico optimization of experimentally discovered leads. Chai's Chai-2 platform targets the de novo use
              case— designing antibodies from scratch given only the target protein, without experimental seed
              molecules. This is a significantly harder problem than sequence optimization or affinity maturation, and
              it commands a premium value proposition (and a higher barrier to adoption) relative to AI-assisted
              screening. The AI protein structure prediction market—a closely related enabler—is estimated at $1.8
              billion in 2025 growing to $2.33 billion in 2026 at approximately 30% CAGR, reaching $6.62 billion by
              2030. This structural biology infrastructure underpins all AI-native antibody design platforms and
              represents the computational foundation on which Chai and its competitors compete. Chai's SAM within this
              subsegment is bounded by its current partner-access model and the nascent state of the de novo antibody
              design market as a standalone commercial category.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM002
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Definitional Scope Drives the 9x Market Size Spread
            body: >
              The $1.94B–$24.51B range in 2026 AI drug discovery estimates is not primarily a forecasting disagreement
              but a definitional one. Narrow analysts (GVR, Axis) count only pre-IND AI software; broad analysts
              (GMI/Towards Healthcare) include clinical AI and manufacturing AI. Buyers and investors must select the
              right comparator depending on their question: for Chai's competitive position, the narrow $2–5B range is
              the correct market. For pharma procurement budget context, the $194B global R&D spend is the right
              numerator.
            calloutType: insight
            claimRefs:
              - CM003
              - CM010
              - CM037
          - type: callout
            title: Clinical Validation Gap Constrains Commercial Momentum
            body: >
              Despite $60+ billion invested globally in AI drug discovery since 2015, no AI-designed drug had received
              FDA approval as of May 2026. IQVIA's 2026 report found that the Phase I success advantage for AI programs
              (75%) is real but limited to the emerging biopharma segment and does not yet translate to improved overall
              industry success rates. Chai's buyers are rational to demand evidence that the platform can produce
              clinical-stage assets before committing large milestone budgets—making the Eli Lilly collaboration a
              critical commercial proof point that remains unresolved at the run date.
            calloutType: risk
