      - number: '7.2'
        title: Regulatory and Quality Risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is not that FDA is hostile to AI; it is that Chai still has to satisfy the same quality
              and clinical readiness burden as any therapeutic developer while also carrying model-specific uncertainty.
              FDA publishes AI guidance for software and broader discussion of AI in drug development, but neither
              source provides a bespoke approval pathway for AI-designed antibodies. That means Chai should be treated
              as a biologics discovery company that happens to use advanced AI, not as a company entitled to shortcut
              CMC, assay validation, or IND-quality evidence. FDA's own CMC materials emphasize batch data, process
              description, purity, stability, and sterility or endotoxin control as safety-critical. Chai's public
              materials do not disclose a manufacturing partner, release specification set, or stability package for any
              lead asset. The Lilly announcement proves commercial interest in discovery workflows, but it does not yet
              prove that Chai can progress an antibody through IND-enabling work, regulator dialogue, or manufacturing
              scale-up. The result is a classic biotech timing risk: discovery claims may mature much faster than
              quality systems and clinical evidence.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
