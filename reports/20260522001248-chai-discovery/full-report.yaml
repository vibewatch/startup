      - number: '3.3'
        title: Open-Source and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Open-source and freely available tools constitute a distinct and underappreciated competitive threat for
              Chai Discovery. The AlphaFold Database (alphafold.ebi.ac.uk), maintained by EMBL-EBI in collaboration with
              Google DeepMind, NVIDIA, and Seoul National University, provides predicted structures for over 200 million
              proteins under a Creative Commons Attribution (CC-BY-4.0) license. A March 2026 update extended coverage
              to protein complex structures. This permanently commoditizes protein structure prediction as a distinct
              value layer—any pharma team with standard bioinformatics capability can access these predictions for free.
              AlphaFold3, released by Google DeepMind, expands coverage to protein-nucleic acid and protein-small
              molecule interactions; however, model weights require explicit approval from Google DeepMind for download,
              and commercial use terms are restrictive, limiting its deployability for Chai's potential customers as a
              self-hosted alternative. The most acute open-source commoditization risk is Boltz-2
              (github.com/jwohlwend/boltz), released under the MIT License. Boltz-2 explicitly benchmarks its
              performance against Chai-1 in structure prediction accuracy and additionally predicts binding affinities—a
              capability Chai-1 does not provide, and one that extends its utility beyond structure prediction into
              ligand ranking. A fully permissive license (MIT) means any pharma company or academic group can deploy
              Boltz-2 in production without licensing fees or restrictions. ESMFold (github.com/facebookresearch/esm),
              developed by Meta AI under MIT license, enables protein structure prediction from a single sequence
              without requiring multiple sequence alignment—providing rapid inference useful for early-stage screening.
              OpenFold (github.com/aqlaboratory/openfold) provides an Apache 2.0-licensed reimplementation of AlphaFold2
              that allows academic labs to fine-tune structure prediction models on proprietary data, further blurring
              the line between commercial and academic capability. Beyond these computational tools, the status-quo
              substitutes also include traditional antibody discovery methods (hybridoma fusion and phage display),
              which represented 38.1% of the broader antibody discovery market in 2024 and continue to be
              well-understood, de-risked, and supported by established CRO infrastructure. Internal pharma AI teams at
              Genentech, AstraZeneca, Pfizer, and other large pharma companies represent self-build alternatives that
              may reduce the total addressable market for external AI design platforms. The strategic implication is
              that Chai must differentiate at the de novo design and candidate generation layer—not structure
              prediction—since structure prediction is increasingly a free public good.
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP018
              - CP019
