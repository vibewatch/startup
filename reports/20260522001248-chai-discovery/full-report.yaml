      - number: '7.3'
        title: Market and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Chai's commercial story is still narrow in public. Eli Lilly is the only named pharma partner in fetched
              materials, and Chai does not disclose revenue, customer count, or retention metrics that would show
              whether the platform is becoming a diversified business rather than a single-anchor collaboration story.
              That concentration matters because the market is not waiting. AlphaFold 3 remains the benchmark reference
              point for biomolecular interaction prediction, while Absci, Generate Biomedicines, and EvolutionaryScale
              each market overlapping AI-biologics or frontier protein-model capabilities. Competition can compress
              pricing, lengthen procurement cycles, and make buyer proof requirements harsher—especially if pharma
              customers can ask why Chai is better than a mix of AlphaFold-class tools, incumbent biology teams, and
              rival AI-biotech vendors. The strategic twist is licensing: competitor access terms can themselves become
              moats or friction. In short, Chai is competing on scientific credibility, platform usability, and
              commercial terms at the same time, while public proof of partner diversification is still sparse.
            claimRefs:
              - CR006
              - CR007
              - CR008
