        title: Exhibits
        blocks:
          - type: callout
            title: Boltz-2 Is the Most Asymmetric Competitive Threat to Chai's Structure Prediction Value
            body: >
              Boltz-2 (github.com/jwohlwend/boltz, MIT license) represents a category of risk distinct from commercial
              competitors: a permissively licensed open-source model that explicitly benchmarks against Chai-1 and adds
              binding affinity prediction Chai-1 lacks. Unlike AbSci or Generate:Bio, Boltz-2 does not need commercial
              traction, a sales team, or a pharma deal to displace Chai-1 usage—a pharma computational team can simply
              deploy it in-house. Chai must argue that Chai-2's de novo design output (not just structure prediction) is
              what creates commercial value, because Chai-1's structure prediction function is already challenged by at
              least three permissively licensed open-source alternatives. This distinction—prediction vs. generation—is
              the central commercial narrative Chai must establish and defend.
