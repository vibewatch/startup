      - number: '5.2'
        title: Technical Performance — Antibody Design Benchmarks and Validation
        blocks:
          - type: paragraph
            body: >
              Chai-2's headline claim is a 16% hit rate in fully de novo antibody design against 52 diverse antigen
              targets, none of which had a preexisting antibody or nanobody binder in the RCSB Protein Data Bank (PDB).
              Testing ≤20 designs per target, the model produced at least one experimentally validated binder for 50% of
              targets in a single round of wet-lab assays. Validated antibodies exhibited nanomolar-range binding
              affinities, specificity for intended targets, and developmental profiles comparable to approved
              therapeutics. The end-to-end workflow from AI design to experimental confirmation ran in under two weeks.

              Traditional computational antibody discovery approaches—including immunization, directed evolution, and
              yeast-surface display-based computational filtering—report hit rates consistently below 0.1%, making
              Chai-2's claimed performance more than 100-fold higher. For miniprotein design, Chai-2 achieved a 68%
              wet-lab success rate, routinely yielding picomolar binders. The November 2025 challenging-targets preprint
              further showed that >86% of full-length monoclonal antibody (mAb) designs had developability profiles on
              par with approved therapeutic antibodies, and that experimentally solved structures of Chai-2 designs
              closely matched their in silico predictions (atomic accuracy). Chai-2 also successfully designed
              functional antibodies for GPCR agonism and highly specific antibodies for tumor-specific neoepitopes.

              Key benchmarking caveats: AlphaFold 3 (DeepMind/Google), published in Nature in May 2024, is the dominant
              peer-reviewed benchmark for biomolecular structure prediction; the Chai-1 preprint explicitly notes that
              AlphaFold 3 benchmark values were taken from publicly released predictions rather than independently run.
              ESMFold (Meta/FAIR), published in Science in January 2023, predicts atomic-level protein structure purely
              from sequence using a protein language model. Both AlphaFold 3 and ESMFold are structure-prediction tools
              primarily; neither is designed for de novo antibody generation, so direct hit-rate comparisons are
              methodologically distinct. CASP (Critical Assessment of Protein Structure Prediction) remains the
              international gold-standard blind benchmarking competition for structure prediction. All Chai-2 antibody
              design data has been published only as company-authored biorxiv preprints without independent peer review
              as of May 2026.
