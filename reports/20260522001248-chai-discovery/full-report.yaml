      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, SOM and Contradictory Estimates'
        blocks:
          - type: paragraph
            body: >
              The total addressable market (TAM) for Chai can be framed at two levels. At the broadest level, global
              pharmaceutical R&D spend of approximately $300 billion represents all spending that better discovery tools
              could eventually displace or augment. More practically, Statista estimates the 2026 pipeline approaching
              23,000 drug candidates in development from over 7,000 companies—all of which are potential beneficiaries
              of AI-assisted molecular design. The serviceable addressable market (SAM) is the subset of that spend
              directed toward AI discovery software and biologics-focused platforms. Using Mordor Intelligence's AI
              pharmaceutical R&D figure of $4.36 billion in 2026 as the broadest credible commercial estimate, and
              cross-referencing with the antibody discovery market of $10.75 billion (2026), Chai's
              SAM—biologics-focused AI design—can be estimated at roughly $1–2 billion in 2026, rising as de novo design
              capabilities mature. The serviceable obtainable market (SOM) is dramatically smaller: Chai is
              pre-commercial, relies on selective partner access, and competes with incumbents; a conservative SOM of
              $100–300 million in early-deployment revenue appears appropriate for a 2026–2028 planning horizon. Analyst
              estimates for the narrow AI drug discovery market span a 9x range, driven primarily by definitional scope.
              Grand View Research places the 2025 market at $2.35 billion (CAGR 24.8% to 2033). Axis Intelligence
              narrows that to $1.94 billion (2025), growing at 27% CAGR. Fortune Business Insights reports $4.46 billion
              (2025) with a more conservative 12.2% CAGR. The most bullish report (Global Market Insights/Towards
              Healthcare) cites $24.51 billion in 2026 by including clinical AI—a figure that overstates the relevant
              market for a pure-play discovery platform. Contradictory CAGR estimates (11.3%–32.25%) largely track the
              scope difference: narrower scopes show lower CAGRs; broader scopes absorb faster-growing clinical
              segments.
