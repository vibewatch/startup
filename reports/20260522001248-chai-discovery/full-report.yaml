      - number: '4.2'
        title: Cost Structure, Unit Economics, and Capital Intensity
        blocks:
          - type: paragraph
            body: >
              Chai Discovery's cost structure is characterized by two primary buckets: human capital (AI research talent
              in San Francisco) and compute infrastructure (AI model training and inference). The company has
              approximately 29 employees as of early 2026, per indirect reporting from BuiltInSF—a figure that has not
              been officially confirmed. For a San Francisco-based AI company operating at this talent tier, fully
              loaded per-headcount costs typically range from $250,000 to $400,000 per year, implying an estimated
              annual payroll burn of roughly $7–12 million. Leadership has described the codebase as entirely
              homegrown—"every line of code in our codebase is homegrown"—with no off-the-shelf large language models
              and highly custom architectures, suggesting a technical team that skews toward senior AI researchers
              commanding the upper range of compensation brackets.

              Compute costs represent a critical and undisclosed second line. Training state-of-the-art protein
              structure prediction and de novo design models at the scale Chai operates requires substantial GPU
              compute. Industry benchmarks for training frontier AI biology models of Chai-2's class range from $1–15
              million per major training run, with ongoing inference costs for partner deployments layered on top. The
              Lilly collaboration specifically involves custom model training on Lilly's proprietary data, which will
              generate additional compute expense not visible in public disclosures. Chai has not disclosed its AWS,
              Azure, GCP, or other compute spend, and no independent estimate of its compute budget has appeared in
              public reporting.

              A critical structural advantage in Chai's cost profile is the absence of wet-lab infrastructure. Unlike
              competitors such as Generate:Biomedicines (140,000 sq ft of wet-lab space) or AbSci (77,000 sq ft), Chai
              relies entirely on partner wet-lab validation rather than internal experimental infrastructure. This keeps
              capital expenditure low and enables a high gross-margin software model—but it also means Chai's claimed
              hit rates depend on partner labs for experimental confirmation, creating a validation dependency that has
              both financial and scientific implications.

              Big pharma R&D spending context underlines the scale of the opportunity but also the cost of competition:
              the top pharmaceutical companies collectively spend over $200 billion per year on R&D, with individual
              companies such as Roche, J&J, and Merck each exceeding $15 billion annually. Against this backdrop, an AI
              drug discovery deal with a single partner generates revenue that is likely a small fraction of what a
              successful platform must ultimately capture to justify a $1.3 billion valuation. Industry data from S&P
              Global Market Intelligence confirms that biopharma venture capital activity continues to concentrate in
              preclinical-stage platforms, with Series B+ deals requiring credible commercialization evidence— a gate
              Chai has partially cleared through the Lilly deal but has not fully demonstrated through disclosed revenue
              metrics.
