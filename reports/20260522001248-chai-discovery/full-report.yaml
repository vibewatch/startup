  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The AI drug discovery competitive landscape as of May 2026 contains five functionally distinct competitor
              segments, each targeting overlapping but differentiated buyer needs. The first segment consists of
              AlphaFold-lineage structure prediction and generalist AI platforms—primarily Isomorphic Labs (an Alphabet
              spinout) which raised approximately $600 million in a November 2024 Series A and applies AlphaFold-derived
              models to small molecule drug design. Isomorphic's primary focus is small molecules with Eli Lilly and
              Novartis as disclosed partners, occupying a different modality focus than Chai's biologics-first approach
              but competing for the same pharma R&D budget and partner relationships. The second segment covers
              full-stack AI drug discovery orchestration platforms—Recursion Pharmaceuticals (NASDAQ: RXRX), which
              completed its acquisition of Exscientia in 2025, creating an end-to-end platform spanning phenomics-based
              target discovery through AI-chemistry candidate design; and Insilico Medicine, which operates the
              Pharma.AI platform covering target identification (Biology42), molecular design (Chemistry42), and
              clinical optimization (Medicine42). Recursion holds over 50 petabytes of proprietary experimental data
              generated via BioHive-2 robotic infrastructure, representing the sector's most formidable data moat. The
              third segment covers generative biology companies targeting protein and antibody
              design—Generate:Biomedicines, with GB-0895 (anti-TSLP) in Phase 3 for severe asthma and 42,000+ proteins
              generated and tested; and AbSci, whose ABS-201 is the first AI-designed de novo antibody to enter human
              clinical trials. Both are direct-analogues to Chai's biologics design ambitions but with earlier clinical
              validation. The fourth segment is physics-plus-ML hybrid incumbents: Schrödinger (NASDAQ: SDGR) has
              operated for 35+ years, holds licensing relationships with 1,750+ pharma and biotech customers, and
              differentiates from pure deep-learning approaches with interpretable physics-based methods (FEP+, Glide,
              BioLuminate). The fifth segment is open-source and academic alternatives, discussed in detail in the
              following section, representing the most asymmetric commoditization threat to Chai's structural value
              proposition.
