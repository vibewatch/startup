  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              Defining the market precisely matters because analyst estimates span an order of magnitude depending on
              whether "AI drug discovery" is defined narrowly or broadly. The narrowest definition—used by Axis
              Intelligence and Grand View Research—covers only AI-enabled software and related services that materially
              support target identification, hit and lead generation, lead optimization, de novo molecular design, and
              preclinical candidate selection before IND filing. This definition excludes AI used for clinical trial
              operations, regulatory submissions, pharmacovigilance, manufacturing, and commercial analytics. On this
              narrow basis, the 2026 market is $2–5 billion. The medium definition used by Mordor Intelligence adds
              AI-enabled formulation and drug repurposing analytics, yielding $4.36 billion in 2026. The broadest
              definition, adopted by Global Market Insights and Towards Healthcare, includes all AI software touching
              the full pharma value chain—clinical trials, manufacturing, and patient matching—arriving at $24.51
              billion in 2026. For Chai Discovery, the relevant perimeter is the narrowest definition: its Chai-2
              platform targets early-stage biologics design (antibodies, nanobodies, miniproteins) before any
              experimental screening, not clinical or manufacturing AI. The adjacent, but excluded, spend categories
              are: CRO bioinformatics services that do not rely on AI-native design, traditional wet-lab antibody
              discovery (hybridoma, phage display), and AI clinical-trial recruitment tools. The primary status-quo
              substitutes are traditional antibody discovery methods (hybridoma and phage display, representing 38.1% of
              the broader antibody discovery market in 2024), manual computational docking pipelines, and fully in-house
              pharma AI teams. The global pharmaceutical R&D base—approximately $300 billion in annual spend as of
              2025—provides the demand context, though AI drug discovery software currently represents only about 1.5%
              of that total.
