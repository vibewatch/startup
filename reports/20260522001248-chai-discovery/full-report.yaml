      - number: '5.3'
        title: Open-Source Strategy and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >
              Chai-1 is the open-source anchor of Chai Discovery's technical strategy. By releasing Chai-1 under Apache
              2.0—including both model weights and inference code—Chai Discovery created a community flywheel that
              drives adoption, external validation, and talent signaling. The Python package (chai_lab) is distributed
              via PyPI and updated regularly; the latest released version is 0.6.1 and the development branch updates
              daily. The GitHub repository (chaidiscovery/chai-lab) provides complete source code, dev-container setup
              for reproducible environments, and citation metadata for both Chai-1 and Chai-2 preprints. HuggingFace
              hosts the Chai-1 model card with installation instructions and model documentation. The citation block for
              Chai-2 is already present in the GitHub README, positioning the library as the community interface even
              while the Chai-2 model itself remains proprietary.

              This open-core strategy mirrors successful precedents in MLOps (e.g., Hugging Face) and bioinformatics
              (e.g., ColabFold): give away a powerful baseline to build ecosystem dependency, then monetize
              next-generation capabilities through commercial access. Chai-2 is held proprietary because the company
              believes the antibody design capability is the core commercial differentiator. The PLOS Computational
              Biology LAP (Liability Antibody Profiler) toolkit, which sequences and structurally maps antibody
              liabilities against natural and therapeutic antibody repertoires, is illustrative of the open-source tools
              that complement—and potentially integrate with—the Chai platform for developability assessment.
