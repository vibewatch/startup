    approximationNotes: >
      Row 1: 100% at month 3 represents all applicants in the early-access pipeline; 25% estimate receive early access
      at month 6 (inferred from Menlo Ventures commentary and typical pharma BD cycles); ~8% convert to pilot at month
      12; ~3% become formal paying partners at month 18. No actual conversion rates disclosed. Row 2: Normalized GitHub
      star counts (500 estimated at M+3, 1,000 at M+6, 1,500 at M+12, 1,938 confirmed at M+18) re-indexed to 100 at
      month 18. Row 3: Estimated academic user retention based on typical research software adoption decay; no actual
      academic retention data disclosed by Chai.
