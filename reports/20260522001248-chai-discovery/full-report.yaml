          - type: callout
            title: The Clinical-Stage Gap Is Chai's Most Actionable Risk
            body: >
              Every biologics-focused AI competitor that has disclosed a clinical program (Generate:Bio in Phase 3,
              AbSci in Phase 1) reached that milestone before Chai despite being founded earlier and having more
              physical wet-lab infrastructure. The commercial implication is that pharma partners will have independent
              clinical benchmark data from AbSci and Generate:Bio against which to evaluate Chai-2's design claims
              before Chai files an IND. If ABS-201 succeeds in Phase 1 and GB-0895 advances in Phase 3, those outcomes
              will establish AI de novo antibody design as a proven modality—but with AbSci and Generate:Bio as the
              definitional reference points, not Chai. Closing this gap requires either accelerating Chai's own IND
              timeline or securing additional pharma partnership data that can serve as surrogate clinical validation.
