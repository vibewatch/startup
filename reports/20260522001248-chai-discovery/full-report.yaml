          - type: figure
            figureRef: FV003
            claimRefs:
              - CV001
              - CV052
              - CV053
              - CV054
      - number: '8.5'
        title: Thesis-break triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should focus on four questions that public sources do not answer well today.
              First, what are the real economics of the Lilly collaboration: upfronts, milestones, exclusivity
              boundaries, and renewal logic? Second, what does Chai’s cap table actually look like after the seed,
              Series A, and Series B rounds, including any preference stack or investor protections that would shape
              common-equity outcomes? Third, how much customer concentration risk exists beyond Lilly, and is there
              another named design partner close to conversion? Fourth, what evidence exists that Chai’s technical
              benchmark wins survive into broader developability, manufacturability, and eventually clinical settings?
              The thesis breaks if those answers disappoint while valuation rises further. Specifically, investors
              should treat lack of a second marquee customer, inability to independently validate Chai-2’s downstream
              usefulness, or another financing at a much richer price without incremental proof as reasons to step back.
              At this stage, the upside case is real, but so is the risk of paying tomorrow’s price for today’s
              evidence.
            claimRefs:
