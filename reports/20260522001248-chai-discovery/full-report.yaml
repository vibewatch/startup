  - id: FE001
    title: Chai Discovery Product Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Five architectural layers from data inputs through model cores to output delivery, illustrating open (Chai-1) vs
      proprietary (Chai-2) boundaries.
    data:
      layers:
        - label: Data Input & Conditioning Layer
          detail: FASTA sequences, PDB structures, MSA alignments, experimental restraints, epitope specifications
          items:
            - Protein FASTA / PDB input
            - Small molecule SMILES / SDF
            - MSA alignments (MMseqs2 / ColabFold)
            - Wet-lab restraints (crosslinking MS)
            - Antibody epitope region specification
        - label: Foundation Model Core (Chai-1, open Apache 2.0)
          detail: >-
            Custom multimodal transformer encoding protein, small molecule, DNA, RNA, glycan simultaneously; homegrown
            architecture (no off-the-shelf LLMs)
          items:
            - Multimodal transformer encoder
            - Single-sequence & MSA-conditioned modes
            - Glycan / RNA / DNA co-folding
            - Apache 2.0 open-source release
        - label: Generative Design Engine (Chai-2, proprietary)
          detail: >-
            De novo CDR generation for antibody and nanobody design; prompted by target antigen and epitope; outputs VHH
            and VH-VL formats; not open-sourced
          items:
            - All-6-CDR de novo generation
            - VHH (nanobody) and VH-VL (IgG) format support
            - Developability scoring integration
            - Early-access API for partners (Eli Lilly anchor)
        - label: Structure Prediction & Scoring Module
          detail: >-
            Atomic-level 3D structure prediction of generated designs; developability assessment; affinity and
            specificity scoring against target antigen
          items:
            - Atomic 3D structure prediction
            - Binding affinity estimation
            - Polyreactivity / PSR / stability scoring
            - Confidence scores (pTM, ipTM)
        - label: Output & Delivery Interface
          detail: >-
            PDB file outputs with confidence scores; free web lab at lab.chaidiscovery.com; partner API for Chai-2 early
            access; responsible deployment framework
          items:
            - PDB / CIF structure file download
            - lab.chaidiscovery.com free web access
            - Chai-2 partner API (early access)
            - Responsible Deployment Framework
    approximationNotes: >-
      Chai-2 layer detail is inferred from biorxiv preprints and GitHub citations; exact architecture boundaries are
      proprietary.
