      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Chai rests on the unusually strong combination of technical ambition and institutional
              validation. Chai-2’s reported hit rates, the underlying zero-shot antibody-design framing, and the
              founding team’s OpenAI, Meta, and Absci lineage create a plausible case that Chai is working at the
              frontier of generative biologics design. Lilly’s willingness to evaluate Chai outputs and fund a
              custom-model collaboration is the strongest external proof that the company’s models are not just academic
              curiosities. The anti-thesis is just as important. Nearly every headline fact that supports the valuation
              today is still upstream from clinical and commercial proof: the performance claims are company-reported,
              the economics of Lilly’s deal are undisclosed, the company has only one named major customer in retained
              sources, and there is still no public evidence of a Chai-designed asset in clinical trials. In other
              words, the valuation is underwriting a lot of future conversion from benchmark success into durable
              revenue and eventual therapeutic proof. That conversion may happen, but open sources do not yet prove it.
            claimRefs:
