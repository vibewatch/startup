  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >
              Chai Discovery operates a two-tier revenue architecture built around differentiated access to its platform
              models. Chai-1, its first-generation molecular structure prediction model released in late 2024, is
              available at no cost for all users—including commercial applications—via its web interface. Chai-1 model
              weights are open-source under the Apache 2.0 license for non-commercial use, with commercial web access
              provided free directly through the Chai platform. The Crunchbase profile for Chai Discovery specifically
              notes that "Chai-1 is available for free for commercial applications," and the Chai-1 preprint on bioRxiv
              confirms this commercial web-access model. This freemium base layer is designed to drive platform
              adoption, generate proprietary usage data, and establish Chai as the default molecular modeling tool for
              computational drug discovery teams at biopharma companies.

              Chai-2, the company's flagship de novo antibody design system, is not publicly available. Access is
              governed by a "Responsible Deployment" policy under which Chai provides selective partner access—currently
              only to named pharma collaborators. The January 2026 collaboration with Eli Lilly represents the first
              publicly confirmed commercial deal under this model: Chai will develop a purpose-built AI model trained
              exclusively on Lilly's large-scale proprietary datasets, deployed within Lilly's TuneLab frontier AI unit
              for biologics discovery across multiple drug targets. Lilly also gains access to Chai's core platform
              models alongside the custom-trained system. The financial terms of the Lilly deal—including any upfront
              licensing fee, milestone payments tied to discovery outcomes, or royalty provisions—are not publicly
              disclosed.

              The medium-term revenue model implied by this architecture has four components: (1) platform licensing
              fees for Chai-2 partner access, potentially structured as annual software agreements; (2) custom model
              development fees for biopharma companies that want proprietary data-fine-tuned versions (as with Lilly);
              (3) potential discovery milestone payments if Chai-generated candidates advance into preclinical or
              clinical development; and (4) a longer-horizon co-development economics layer where Chai takes financial
              participation in programs it generates if pharma partners choose a co-development structure. General
              Catalyst, which co-led the Series B, publicly projected that early adopters of AI drug design tools such
              as Chai's may see first-in-class biologics entering clinical trials by end of 2027—implying GC expects the
              revenue model to graduate from software-fee to milestone-and-royalty income within a two-year horizon.

              The company's publicly stated vision—a "computer-aided design suite" for molecules—signals ambitions
              toward a broadly accessible platform, but current commercial execution remains early-stage,
              partner-dependent, and opaque in financial terms. Chai's revenue as of May 2026 has not been publicly
              disclosed, and no ARR figure, contract count, or paying-customer number has been confirmed by the company
              or any third party.
