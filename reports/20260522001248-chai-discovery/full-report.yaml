      - number: '7.5'
        title: IP, Legal, and Biosecurity Risks
        blocks:
          - type: paragraph
            body: >-
              The most explicitly adverse evidence in this chapter concerns IP boundary-setting and biosecurity. Chai
              has chosen a relatively open software posture for Chai-1, releasing code and weights under Apache 2.0 and
              distributing artifacts through multiple developer channels. That choice accelerates ecosystem adoption,
              but it also reduces the amount of product moat that can be attributed purely to software packaging. At the
              same time, the surrounding market shows how unstable the policy environment can become: AlphaFold 3's
              release sparked a public fight over code access, and DeepMind's published terms reserve weights for
              non-commercial use only. Independent biosecurity literature goes further, arguing that advanced biological
              AI models can present dual-use capabilities of concern and may warrant safeguards or restrictions. For
              Chai, this creates a double bind. If access is too open, misuse and leakage risk rise; if access is too
              restrictive, commercial conversion and community adoption slow. The company needs explicit governance,
              logging, and deployment controls to keep that trade-off investable.
            claimRefs:
              - CR032
              - CR033
              - CR037
              - CR038
              - CR039
              - CR040
              - CR043
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The thesis still hinges on a science-to-wet-lab leap that outsiders cannot yet reproduce
            body: >-
              Chai's most commercially important claim—the Chai-2 antibody hit-rate improvement—remains sourced to
              company-issued financing material. Independent replication and raw assay disclosure are still missing from
              public materials, while external reviews say developability attrition remains a major bottleneck even
              after a promising binder is found.
            calloutType: risk
            claimRefs:
              - CR012
              - CR018
              - CR034
          - type: callout
            title: Open distribution cuts both ways
            body: >-
              GitHub, Hugging Face, PyPI, and a hosted lab product make Chai visible and developer-friendly. The same
              openness can narrow software exclusivity, create misuse surface, and force the company to defend its moat
              through proprietary data, wet-lab execution, and partner relationships instead of code alone.
            calloutType: insight
            claimRefs:
              - CR002
              - CR037
              - CR043
              - CR045
          - type: callout
            title: 'Diligence priority: replication package, second partner, and CMC readiness'
            body: >-
              Before underwriting more upside, investors should demand three things: blinded wet-lab replication of
              Chai-2 claims, visibility into whether Lilly is still the only named partner, and concrete CMC evidence
              for the lead program's path to IND. These are the cleanest external thesis-break triggers for the current
              thesis.
            calloutType: recommendation
            claimRefs:
              - CR023
              - CR026
              - CR034
              - CR046
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery is not an easy short thesis: the company has raised a meaningful amount of capital,
              recruited a founding team with real frontier-model credibility, and convinced Eli Lilly to run a
              custom-model collaboration on proprietary biologics data. Those are unusual proof points for a company
              founded in 2024. But they do not automatically make the last disclosed price attractive. At a $1.3 billion
              Series B mark, Chai is already priced as a serious AI-biotech platform even though public materials still
              do not disclose revenue, ARR, margins, or any clinical-stage asset. The right recommendation is therefore
              track, not buy and not avoid. Track reflects a real technology story with one high-quality strategic
              customer; it also reflects the fact that the current mark leaves little margin for execution missteps.
              Investors should underwrite Chai as an option on future proof, not as a de-risked software or biotech
              operating model. Until the company can show repeat customer demand, clearer commercial economics, or
              translational proof beyond Lilly, entry discipline should remain strict and price-sensitive.
            claimRefs:
              - CV001
              - CV004
              - CV007
