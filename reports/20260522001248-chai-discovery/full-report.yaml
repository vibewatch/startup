  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and Scientific Risks
        blocks:
          - type: paragraph
            body: >-
              Chai's technical promise is ambitious: the company markets Chai-2 as de novo antibody design with atomic
              precision, while Chai-1 is positioned as an open, state-of-the-art multimodal structure model. The risk is
              not that the models are uninteresting; it is that benchmark quality and therapeutic quality are not the
              same thing. Chai's public evidence still sits mainly in a preprint stack and company-authored launch
              material rather than in independent, peer-reviewed translational studies. The strongest external reviews
              in this chapter all point to the same failure mode: even if a model proposes binders or plausible
              structures, antibodies still fail later because of aggregation, poor expression, instability, clipping,
              off-target interactions, or immunogenicity. Chai has not published raw wet-lab data or third-party
              replication sufficient to independently verify its most commercially important claim—the near-20% Chai-2
              hit rate. That gap does not invalidate the company, but it does mean investors are still underwriting a
              partially black-box science-to-product conversion problem rather than a fully proven platform.
