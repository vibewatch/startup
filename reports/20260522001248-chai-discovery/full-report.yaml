companyProfile:
  summary: >-
    Chai Discovery is an AI drug-discovery platform company founded in early 2024 in San Francisco by four researchers
    from OpenAI, Meta FAIR, Stripe, and Absci. In under two years it raised approximately $230 million at a $1.3 billion
    valuation and announced a landmark collaboration with Eli Lilly in January 2026. Its two-tier product—open-source
    Chai-1 for molecular structure prediction and proprietary Chai-2 for de novo antibody design—targets biopharma R&D
    workflows. Chai-2 claims a ~16–20% de novo antibody hit rate (100× prior computational methods) across 52 diverse
    targets, based on company-authored preprints pending peer review. The company operates as a capital-light platform
    with no internal drug pipeline, no wet-lab infrastructure, and no publicly disclosed revenue metrics.
