      - number: '8.4'
        title: Bull, base, and bear scenario analysis
        blocks:
          - type: paragraph
            body: >-
              The bear case for Chai is not technological collapse; it is valuation compression before commercial
              conversion. If Lilly remains the only marquee validation point, if downstream developability data fail to
              generalize outside company-authored materials, or if the AI-drug-discovery sector continues to trade with
              a proof discount, Chai could be marked closer to $0.4 billion to $0.8 billion. The base case, roughly $0.9
              billion to $1.4 billion, assumes Lilly becomes repeatable demand rather than a one-off, Chai sustains
              technical credibility, and the company closes the gap between benchmark excitement and durable customer
              value without reaching the clinic near term. The bull case, roughly $1.8 billion to $2.6 billion, requires
              more than another flashy fundraise. It needs repeat big-pharma demand, evidence that Chai-2 or successor
              models consistently deliver wet-lab-quality outputs, and a clearer path from design wins to clinical or
              software-style recurring economics. Until those milestones appear, Chai’s current mark looks closer to the
              upper half of base than to an obvious bargain.
            claimRefs:
              - CV043
              - CV044
              - CV045
              - CV052
              - CV053
              - CV054
              - CV060
          - type: table
            tableRef: TV003
            claimRefs:
