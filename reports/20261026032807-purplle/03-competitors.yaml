callouts:
  - calloutType: insight
    title: Portfolio breadth is the strongest visible distinction
    body: Purplle combines partner assortment with owned labels and a reported focus on underserved tier-2/3 consumers; available public evidence does not yet show that this translates into superior retention or unit economics.
    claimRefs: [CP001, CP002, CP003, CP015, CP016]
  - calloutType: risk
    title: A defensible moat is not yet demonstrated
    body: Peer prices, customer overlap, repeat rates, and switching costs are missing, while the identified alternatives include horizontal marketplaces and digital-native brands.
    claimRefs: [CP005, CP006, CP010, CP011, CP012, CP013, CP016]
