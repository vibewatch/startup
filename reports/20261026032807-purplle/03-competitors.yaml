      - [Nykaa, "Direct beauty-specialist peer; a comparable target segment is not documented.", "Tracxn labels it public; no same-period peer metric is available.", "Tracxn describes online cosmetics, skincare, haircare, and beauty accessories.", "Competitor identification is not a share or capability ranking."]
      - [Tira, "Beauty-specialist peer; Tracxn lists it as a competitor.", "Tracxn says founded in 2023 and labels it unfunded; the profile does not establish current funding or scale.", "Online makeup, skin, hair, fragrance, and wellness products.", "No comparable sales, coverage, or pricing data."]
      - [Myntra, "Horizontal lifestyle-commerce alternative; a beauty-specific target is not shown.", "Its app listing claims 7 lakh+ products and 3,500+ brands platform-wide.", "App listing includes beauty and skincare alongside fashion, home, and lifestyle.", "Platform-wide figures cannot be compared with beauty-only assortment."]
      - [Sugar Cosmetics, "Digital-native beauty brand named in StartupTalky's competitor list.", "Economic Times reported financing pressure in September 2026; no like-for-like peer scale is available.", "Competitor-specific assortment and channel detail are not established in this pool.", "Rival financing pressure does not demonstrate Purplle share gains."]
      - [MyGlamm, "Digital-native beauty brand named in a third-party competitor list.", "No comparable scale or funding measure is retained.", "No specific product or channel comparison is available.", "Roster inclusion is not evidence of current market position."]
      - ["FOXY, Leeford, My Derma Store, Arish Shoppe", "Other online beauty or personal-care alternatives named by The Company Check.", "No comparable scale or funding measures are retained.", "The profile lists names but supplies no matched capability data.", "Classification and current buyer overlap need verification."]
      - [Offline stores and beauty parlors, "Status-quo product discovery or service alternatives; one founder anecdote describes an occasion-use case.", "No current outlet count, share, or buyer incidence is available.", "Mint reports Purplle's historical store count and expansion plan; Blume recounts a beauty-parlor anecdote.", "The anecdote and dated plan do not quantify current substitution."]
      - ["Brand-direct, internal build, and future entrants", "Potential routes or entry paths; no current buyer evidence identifies their scale.", "Unknown in the assigned evidence.", "No supplier access, build-versus-buy, or entrant pipeline data is retained.", "Treat as diligence gaps, not established competitors."]
    notes: >-
      This is an illustrative, non-exhaustive profile table built from third-party
      rosters and reported descriptions. Unknowns are intentional; the table does
      not estimate market shares, buyer overlap, or relative rank.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP009, CP010, CP014, CP016]
  - id: TP002
    title: "Pricing and packaging comparison: no matched basket"
    columns: [Platform / alternative, Public price or packaging evidence, Promotion or service signal, Realized-price evidence, Comparison status]
    rows:
      - [Purplle, "No matched SKU prices, package terms, or category-level fee schedule in the assigned sources.", "No dated promotion sample is retained.", "Not disclosed in the assigned evidence.", "No price advantage can be inferred."]
      - [Nykaa, "No matched SKU prices or package terms are retained.", "No comparable promotion sample is retained.", "Not disclosed in the assigned evidence.", "Peer identity alone does not establish price position."]
      - [Tira, "No matched SKU prices or package terms are retained.", "No comparable promotion sample is retained.", "Not disclosed in the assigned evidence.", "No comparison on identical products, geography, or date."]
      - [Myntra, "App listing promotes offers and prices but gives no matched beauty-SKU basket.", "Listing advertises a 14-day exchange/returns option and Insider points tied to 10% of bill value.", "No realized net price, eligibility, or beauty-category discount is reported.", "Platform-wide promotions are not a beauty-price benchmark."]
      - [Sugar Cosmetics and MyGlamm, "No matched public price or packaging evidence is retained.", "No comparable promotion sample is retained.", "Not disclosed in the assigned evidence.", "Competitor rosters do not establish current realized prices."]
    notes: >-
      Public listing claims and service terms are not realized transaction prices.
      A defensible comparison requires the same SKU, geography, date, eligibility,
      and net price after seller- or platform-funded promotions.
    claimRefs: [CP008, CP012, CP015]
  - id: TP003
    title: Moat evidence versus open diligence questions
    columns: [Potential advantage or pressure, What the evidence supports, What remains unproven, Underwriting implication]
    rows:
      - [Owned-brand portfolio, "Purplle combines third-party assortment with owned or acquired labels.", "Brand-level gross margin, repeat rate, exclusivity, and cross-sell contribution.", "Portfolio breadth is a differentiation hypothesis, not proof of durable economics."]
      - [Segment and distribution focus, "Mint describes a tier-2/3 target and a historical offline expansion plan.", "Current outlet reach, incremental conversion, fulfillment advantage, and partner access.", "Channel access may broaden discovery, but its economics and persistence are unknown."]
      - [Customer lock-in, "Myntra's app listing promotes returns and loyalty rewards.", "Purplle switching costs, multi-homing, retention, and peer-specific repeat behavior.", "No basis for a quantified lock-in premium."]
      - [Competitive pressure, "Profiles identify specialist and horizontal alternatives; Blume describes D2C crowding and Economic Times reports pressure at Sugar.", "Relative share, prices, buyer overlap, and incumbent response.", "A credible pressure set is visible; its net effect on Purplle is not measured."]
      - [Supplier access and future entry, "No source establishes exclusive access, internal build, or a quantified entrant pipeline.", "Partner terms, supplier dependence, brand-direct migration, and new entry.", "No supply-side or entrant moat can be credited."]
    notes: >-
      The table distinguishes source-backed observations from diligence gaps.
      It does not estimate margins, market shares, retention, or switching rates.
    claimRefs: [CP001, CP003, CP008, CP009, CP010, CP011, CP013, CP014, CP016]
