company:
  name: Purplle
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Purplle is reported as an Indian beauty and personal-care commerce platform
    combining third-party brands with owned labels. Public accounts support a
    significant funding and operating history, but disagree on founding details
    and do not provide primary evidence for current governance or audited scale.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      Purplle is described as an Indian online beauty and personal-care
      marketplace. Reporting and the company's app listing describe a mix of
      third-party products and owned brands, but the available evidence is not
      a current corporate filing. Sources disagree on whether the company was
      founded in 2011 or 2012; neither date is resolved by the assigned
      materials. Neoma Capital identifies Manash Lifestyle Private Limited as
      the legal entity and reports IPO preparation, while also saying no DRHP
      had been filed as of its August 2026 publication. These remain
      third-party-reported details, not verified issuer or registry disclosures.
      The snapshot separates reported measures from diligence gaps and avoids
      treating a potential transaction valuation as a completed financing.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Available profiles name Manish Taneja, Rahul Dash, and Suyash Katyayani
      among Purplle's founders. StartupTalky identifies Taneja as co-founder,
      CEO, and managing director, and describes Dash and Katyayani as
      co-founders; those role descriptions are not corroborated by a current
      company leadership page or filing in this pool. The sample therefore
      indicates founder-led operating history but cannot establish today's
      complete executive roster, board composition, investor appointment
      rights, or key-person succession arrangements. Those omissions matter
      because the same sources describe substantial institutional investment
      without publishing the governance terms. The table is a partial roster,
      not an exhaustive enumeration of management or directors.
    claimRefs:
      - CO006
      - CO007
    tableRefs:
      - TO002
  - id: financing-and-scale
    title: Financing, valuation, and reported scale
    body: >-
      The Economic Times reports an ADIA-led ₹1,500 crore Series F round in
      2024 and cites Tracxn for approximately $560 million raised across 18
      rounds. The same coverage describes a possible 2026 investment that
      could value Purplle at about $1.5 billion; it presents discussions, not
      a closed deal. FY24 coverage reports about ₹680 crore in revenue from
      operations and a ₹124 crore net loss, while a January 2026 Economic
      Times article reports ₹1,410 crore of FY25 revenue. These figures have
      different periods and are secondary reporting rather than audited
      statements in this evidence set. No precise current customer or
      headcount figure is treated as verified.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs:
      - TO003
  - id: milestones-and-open-evidence
    title: Milestones and unresolved evidence
    body: >-
      The retained reporting documents acquisitions, financing, reported
      financial performance, and later transaction discussions, but provides
      uneven detail on product launches, regulatory events, partnerships,
      leadership changes, and store expansion. The timeline uses only dated
      milestones stated in the assigned sources and labels the 2026 investment
      discussion as prospective. Its founding entry preserves the year
      conflict rather than selecting one account. The source set does not
      include an issuer filing or current registry record that could settle
      the legal name, founding date, ownership, or reported financials. These
      gaps limit confidence in a current company profile and should be closed
      with primary corporate and financial records.
    claimRefs:
      - CO003
      - CO004
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO016
    figureRefs:
      - FO001
