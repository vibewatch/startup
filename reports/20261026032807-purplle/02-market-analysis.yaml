        - Broad category universe; category definitions vary by publisher
      - - Skincare and sun care
        - Consumer product sales for skincare and sun protection
        - Dermatology services and clinic procedures
        - Consumer / household
        - IMARC reports 35% of BPC market value in 2025
      - - Cosmetics and colour products
        - Makeup and colour cosmetics
        - Non-beauty fashion and general merchandise
        - Consumer / household
        - StartupTalky's cosmetics-only estimate is narrower than BPC
      - - Online beauty retail
        - Beauty and personal-care goods sold through online stores
        - Offline-only transactions
        - Online shopper; budget owner is not separately measured
        - IMARC reports a 30% channel share in 2025
      - - Omnichannel beauty commerce
        - Product sales through digital and physical retail touchpoints
        - Standalone salon service revenue
        - Consumer / household
        - Purplle's reported model spans marketplace, owned brands, and offline touchpoints
    notes: >-
      Boundary is product spend, not all beauty-related services. Publisher
      taxonomies differ; buyer/payer descriptions are analytical labels where
      source data do not separately identify budget ownership.
    claimRefs:
