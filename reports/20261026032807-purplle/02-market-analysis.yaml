  - id: TM003
    title: Buyer, payer, and adoption map
    columns:
      - Segment
      - Buyer / user
      - Payer / budget owner
      - Workflow or channel
      - Adoption trigger
    rows:
      - - Broad beauty shoppers
        - Individual consumers across product categories
        - Consumer or household; exact budget ownership is not disclosed
        - Online and physical retail
        - Product fit, trust, convenience, and price
      - - Skincare and sun-care shoppers
        - Consumers buying skincare / sun protection
        - Consumer / household
        - Online discovery with product information; channel mix not segmented
        - Category need; this is a large product segment in IMARC's 2025 estimate
      - - Online beauty shoppers
        - Digitally active consumers
        - Consumer / household
        - E-commerce and quick commerce
        - Convenience and digital discovery; online share is not Purplle share
      - - Value-conscious shoppers
        - Price-sensitive consumers
        - Consumer / household
        - Compare price and availability across retailers
        - Affordability; evidence does not quantify price elasticity
      - - Trial-led / shade-matching shoppers
        - Consumers seeking tactile or shade validation
        - Consumer / household
        - Store trial followed by digital or physical purchase
        - Confidence in shade, feel, and product quality
    notes: >-
      Consumer/household payer labels are working segmentation assumptions, not
      disclosed budget data. Available sources describe channel behavior but
      do not provide comparable cohort spend, conversion, repeat, or payer
      breakdowns.
    claimRefs:
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
figures:
  - id: FM001
    title: "Addressability ladder: broad market to Purplle capture"
    type: pyramid
    summary: >-
      Published market and channel benchmarks narrow toward a company-specific
      share that the assigned evidence cannot size.
    data:
      items:
        - label: Broad market estimate
          value: USD 31.19bn (2025; IMARC)
          valueNote: Market-wide estimate, including online and offline products.
        - label: Independent broad-market range
          value: USD 28-31bn (2024-25; Entrepreneur India)
          valueNote: Different vintage and underlying methodology.
        - label: Online channel share
          value: 30% of BPC market value (2025; IMARC)
          valueNote: Channel dimension, not a product category.
        - label: Implied online channel proxy
          value: About USD 9.36bn (derived)
          valueNote: USD 31.19bn x 30%; not a Purplle-specific SAM.
        - label: Purplle-fit categories and buyers
          value: Not separately quantified
          valueNote: Requires category, geography, price-point, and channel overlap.
        - label: Purplle obtainable share
          value: Not established
          valueNote: Company revenue is not a market-share denominator.
    approximationNotes: >-
      Ordered scope ladder only, not to scale. The values are not conversion
      rates, additive components, or proportional layer widths; published
      estimates use different periods and scopes.
    claimRefs:
      - CM003
      - CM005
      - CM006
      - CM007
      - CM016
callouts:
  - calloutType: risk
    title: The online proxy is not Purplle's SAM
    body: >-
      The approximately USD 9.36bn figure is derived from a broad BPC market
      estimate and an online-channel share. It does not isolate Purplle's
      product categories, customer cohorts, geographies, or competitive share.
    claimRefs:
      - CM007
      - CM016
