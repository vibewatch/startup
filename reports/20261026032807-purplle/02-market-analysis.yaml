    notes: >-
      Values are publisher-reported nominal USD estimates unless explicitly
      marked derived. Broad BPC, cosmetics-only, product-segment, and channel
      measures are distinct scopes. Forecast vintages and methods are not
      harmonized; the USD 9.36bn figure is a calculation, not a separate
      publisher estimate.
    claimRefs:
      - CM003
