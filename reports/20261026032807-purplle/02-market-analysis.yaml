company:
  name: Purplle
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public estimates place India's beauty and personal-care market at roughly
    USD 30-31 billion around 2025, but forecasts vary materially by source and
    vintage. Online channel estimates provide a broad proxy, not a Purplle
    serviceable market; buyer economics and company-specific share remain
    unquantified.
sections:
  - id: market-boundary
    title: Market boundary and addressability
    body: >-
      The relevant market is consumer spend on beauty and personal-care
      products, including skincare and sun care, colour cosmetics, hair care,
      fragrances, and related product categories. It is broader than online
      beauty retail: the cited market materials also distinguish mass and
      premium products and describe both online and physical channels. Salon
      services and appointments are adjacent services rather than product
      spend, and should not be added to the goods market without a separate
      definition. Purplle's company profile describes a marketplace alongside
      owned and acquired brands and an omnichannel footprint, but the profile
      does not establish its share of any of these category totals. [CM001,
      CM002]
    claimRefs:
      - CM001
      - CM002
    tableRefs:
      - TM001
  - id: market-sizing
    title: Multiple sizing lenses, not one addressable-market figure
    body: >-
      The strongest current broad-market estimates cluster near USD 30-31
      billion around 2025: IMARC reports USD 31.19 billion for 2025, while
      Entrepreneur India summarizes estimates of USD 28-31 billion for
      2024-25. Their forward views also converge near USD 49 billion, but
      IMARC's horizon is 2034 and Entrepreneur India's is the mid-2030s; their
      underlying methodologies are not reconciled in the accessible text.
      Personal Care Insights reports a faster, shorter-horizon path from USD
      21 billion in 2024 to USD 34 billion in 2028, so the 10-11% stated CAGR
      should not be blended with the other forecasts. IMARC's 30% online-store
      share implies approximately USD 9.36 billion using its 2025 total, but
      this is a derived channel proxy, not a measured Purplle SAM. [CM003,
      CM004, CM005, CM006, CM007, CM008, CM009, CM010]
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyer behavior, route to market, and constraints
    body: >-
      Adoption is shaped by product needs and how shoppers assess trust,
      convenience, and price. IMARC identifies skincare and sun care as 35%
      of the 2025 BPC market and reports price sensitivity and counterfeit
      products as restraints. Entrepreneur India describes quick commerce as
      an important discovery and delivery route while noting offline trials
      remain relevant for shade matching and tactile confidence. The Economic
      Times reported that Purplle was focusing on in-house brands and offline
      expansion in 2026; that is evidence of the company's route-to-market
      choices, not proof of market-wide conversion or repeat purchase. Public
      evidence here does not disaggregate payer budgets, category-level
      customer economics, or Purplle's obtainable share. [CM002, CM011,
      CM012, CM013, CM014, CM015, CM016]
    claimRefs:
      - CM002
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM003
