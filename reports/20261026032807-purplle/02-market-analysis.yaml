        - Product segment; not comparable to channel shares
      - - StartupTalky; 2025 article
        - India; cosmetics market, narrower than broad BPC
        - USD 6.90bn expected revenue (2025)
        - 2.86% estimated annually (2024-2028)
        - Article attributes the estimate to a Statista report analysis
        - Low
        - Secondary attribution; cosmetics is not the full BPC universe
      - - Worldmetrics; updated 2026-06-27
