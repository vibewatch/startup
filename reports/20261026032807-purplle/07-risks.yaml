      - CR009
      - CR010
tables:
  - id: TR001
    title: Financial and financing risk register
    columns:
      - Risk / evidence
      - Likelihood
      - Impact
      - Mitigation maturity
      - Residual exposure / diligence trigger
    rows:
      - - "Profitability and liquidity visibility: FY24 consolidated net loss was ₹124 crore; current cash burn and runway are not reported in this pool."
        - Medium; current position unknown
        - High if losses persist without adequate liquidity
        - Unknown; current cash-flow controls not evidenced
        - Obtain FY25/FY26 audited cash flow, working capital, and monthly runway; do not equate accounting loss with cash burn.
      - - "Financing and capital-structure dependence: Mint reports a ₹1,500 crore ADIA-led Series F, with additional investors; current availability and terms are unknown."
        - Medium; future capital access unverified
        - High if a funding gap coincides with continued losses
        - Unknown; round terms and preference stack not disclosed here
        - Review executed financing documents, primary versus secondary proceeds, debt, preference rights, and a downside liquidity plan.
      - - "Margin / acquisition-cost pressure: a low-reputation SWOT analysis asserts discount dependence and rising customer acquisition costs; no underlying metrics are supplied."
        - Unknown; assertion not independently verified
        - Medium to high if contribution economics deteriorate
        - Unknown; no cohort or contribution-margin evidence
        - Request channel-level contribution margin, discount funding, CAC payback, and repeat-purchase cohorts.
      - - "Public financial-data visibility: Tofler says its detailed FY25 financials are available through Tofler Pro; this is access on that listing, not proof that statutory filings are unavailable."
        - Unknown; accessible and consistent records are not established
        - Medium; delayed validation could obscure current liquidity
        - Unknown; no current statement reconciliation is available here
        - Reconcile audited FY25/FY26 statements, operating cash flow, and debt schedules to primary filings and bank records.
    notes: FY24 figures are reported accounting metrics, not current forecasts or cash-burn measures. Risk likelihood and impact are analyst assessments under uncertainty; the SWOT statements are unverified signals, not findings.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR012
      - CR013
  - id: TR002
    title: Regulatory / legal risk register
    columns:
      - Exposure
      - Jurisdiction / status
      - Likelihood
      - Severity
      - Mitigation and diligence path
    enumerationScope:
      coverage: partial
      basis: Publicly available general control sources and the assigned Purplle evidence pool; not a complete review of product rules, litigation, or enforcement through 2026-10-26.
    rows:
      - - Product standards and safety obligations for listed and owned-brand goods
        - India; BIS states requirements are mandatory for some products; Purplle-specific applicability unverified
        - Unknown pending catalog-to-rule mapping
        - High if a covered product is noncompliant; no breach identified
        - Map SKUs and manufacturers to applicable standards, licenses, test reports, labeling, and recall ownership.
      - - Advertising and product-claim review
        - India; ASCI is a voluntary self-regulatory body; no Purplle complaint or finding established
        - Unknown; campaign review controls unverified
        - Medium; potentially higher for misleading safety or efficacy claims
        - Sample paid, influencer, and owned-brand claims against substantiation records and approval logs.
      - - Consumer complaints and conduct escalation
        - India; company policy routes customer complaints to a separate mechanism; its operation is unverified
        - Unknown; no complaint-rate evidence in this pool
        - Medium; unresolved material complaints could impair trust or invite regulatory attention
        - Obtain complaint volumes, closure times, escalation records, and evidence of the alternate redressal mechanism.
    notes: The rows describe applicable exposure and diligence gaps, not findings of noncompliance, litigation, or consumer harm.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
  - id: TR003
    title: Operational, customer, and partner dependency register
    columns:
      - Failure mode / dependency
      - Evidence and likelihood
      - Impact
      - Current mitigation evidence
      - Residual exposure / diligence ask
    rows:
      - - Product-quality incident or unclear recall ownership across owned and third-party brands
        - No incident evidence; exposure is an inference from the mixed portfolio
        - High if a safety issue affects consumers or multiple products
        - The policy describes investigation processes; product-specific controls are not evidenced
        - Obtain supplier quality agreements, batch traceability, complaint records, and recall drills.
      - - Fulfillment, delivery, or customer-support deterioration
        - SWOT page asserts last-mile complexity and service concerns without supporting data
        - Medium to high if persistent, but magnitude is unknown
        - Unknown; no service-level or complaint cohort evidence
        - Review delivery SLA attainment, cancellations, returns, complaint rates, and resolution time by region.
      - - Supplier, brand, or platform dependency interruption
        - Mint reports a mix of third-party brands and owned brands; concentration and contract terms are unavailable
        - Medium to high depending on substitutability and concentration
        - Unknown; no counterparty concentration or contingency evidence
        - Request top-brand/supplier shares, exclusivity and termination clauses, inventory coverage, and substitution plans.
    notes: Operational failures and concentration are diligence hypotheses, not reported incidents. No service, supplier, or customer concentration metric is available in the assigned evidence.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR011
