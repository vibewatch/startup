company:
  name: Purplle
chapter:
  number: 7
  title: Risks
  summary: Public evidence confirms historical FY24 losses and a formal whistleblower policy, but does not establish current cash runway, control effectiveness, or an adverse legal or operating event. The most decision-relevant exposures are profitability and financing visibility, product and advertising compliance across a mixed brand portfolio, and unverified service and partner dependencies.
sections:
  - id: financial-resilience
    title: Financial resilience and financing visibility
    body: >-
      The clearest quantified financial risk is historical, not a current cash-burn measure. Mint reported FY24
      revenue from operations of about ₹680 crore, up from ₹475 crore, while the loss narrowed to ₹124 crore
      from ₹230 crore in FY23; The Economic Times independently lists the same FY24 loss movement and reports
      total expenses of ₹850 crore versus ₹738 crore (CR001–CR003). Those results show a large accounting loss
      despite growth, but do not establish operating cash flow, runway, or the present funding need. Mint also
      reported a ₹1,500 crore Series F led by ADIA, with other investors participating (CR004). This is evidence
      of sizeable external financing, not proof that funds remain available or that one investor controls the
      company. The 2026 SWOT page's cash-burn assertion is a low-confidence, unsubstantiated signal rather
      than a replacement for current statements (CR005). None of the assigned sources reports a current cash
      balance, operating cash flow, or runway calculation (CR013). Obtain audited FY25/FY26 statements, cash-flow and
      working-capital schedules, round terms, preference rights, and a current liquidity forecast before
      assigning a present severity.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR013
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: compliance-and-conduct
    title: Product, advertising, and legal-control exposure
    body: >-
      Purplle's reported mix of its own brands and third-party brands creates distinct product-governance
      questions: who owns product specifications, safety documentation, labeling, recalls, and supplier
      remediation for each item. BIS says certification is generally voluntary but that the Central Government
      makes compliance with Indian Standards compulsory for some products; the available source does not
      establish which Purplle-listed products are covered or whether any have failed a requirement (CR009).
      ASCI describes its independent self-regulatory role in requiring fair and honest advertising. That is
      relevant to product claims and promotions, but it is not evidence of a Purplle complaint or breach
      (CR010). The company's whistleblower policy lists legal and policy violations among covered concerns,
      while excluding customer complaints from that route and referring them to a separate mechanism (CR007–
      CR008). The existence of written controls is positive but says nothing about implementation or outcomes.
      Map applicable product rules and advertising approvals to the live catalog, and test complaint handling,
      escalation, and recall readiness; no enforcement or litigation conclusion is supported by this pool.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
    tableRefs:
      - TR002
  - id: operational-and-customer-exposure
    title: Operating quality and customer exposure
    body: >-
      The assigned evidence does not document a Purplle outage, product-safety incident, recall, delivery
      failure, or substantiated customer-service trend. That is an evidence limitation, not proof that such
      events have not occurred. A low-reputation SWOT analysis asserts last-mile complexity, discount
      dependence, and customer-service shortcomings without showing a method or underlying data; use these
      only as hypotheses to test (CR005). A separate AI-generated company page claims high customer
      engagement and retention but supplies no retention metric, cohort, or denominator (CR006). Neither
      statement establishes operating performance. Because the business combines marketplace products and
      owned brands, diligence should separate failures attributable to Purplle's fulfillment and support
      from brand-manufacturer quality issues, then inspect complaint volumes, resolution times, repeat
      purchase cohorts, delivery SLAs, returns, and recall procedures. Until those measures are provided,
      customer durability and service-control maturity remain unresolved rather than rated as observed
      failures.
    claimRefs:
      - CR005
      - CR006
      - CR011
    tableRefs:
      - TR003
  - id: governance-and-monitoring
    title: Governance controls and thesis-break monitoring
    body: >-
      Manash Lifestyle's whistleblower policy, effective 1 April 2023, covers employees, directors, and other
      stakeholders with commercial dealings and describes confidentiality, investigation, and escalation
      procedures. It also gives the company discretion not to investigate anonymous complaints lacking
      specified details and excludes customer complaints from this channel (CR007–CR008). These provisions
      establish documented mechanisms only; the pool contains no complaint counts, investigation outcomes,
      independent control testing, or evidence that the mechanisms operated effectively. A separate
      financial-data listing says its FY25 detailed financials are available through a paid tier, which is
      about that listing's access, not proof that no statutory filings exist (CR012). Monitor verified
      disclosures rather than treating low-detail sources as proof of concealed information. Thesis-break
      indicators should include a failure to provide current audited accounts and cash-flow data, repeated
      unresolved consumer complaints, a product-safety or advertising enforcement action, or evidence that
      partner or supplier failures materially interrupt availability.
    claimRefs:
      - CR007
      - CR008
      - CR012
