      - ["Confidence", "Medium-low on the call; low on fair value", "The direction is supported by valuation friction and disclosure gaps, not a complete valuation model."]
      - ["Risk rating", "High", "Recent operating metrics and transaction terms are not sufficiently verified for a downside-protected entry."]
      - ["Valuation stance", "Stretched / unverified", "₹10,000 crore and ₹11,300 crore are reported transaction markers, not validated fair value."]
    notes: "Reported transaction values are third-party coverage, not audited valuations; no target return or exact entry price is supportable from this evidence."
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence and limitation, What would change the view]
    rows:
      - ["Thesis: scalable beauty-commerce platform", "Purplle's own site lists beauty and personal-care categories; coverage reports FY24 operating revenue of ₹680 crore.", "Audited channel and category economics, customer repeat rates, and contribution margins."]
      - ["Thesis: historical funding validation", "The 2024 Series F closed at ₹1,500 crore, with reported prior-tranche valuation around $1.25 billion.", "Current primary round documentation, security terms, and independent confirmation of the fully diluted mark."]
      - ["Anti-thesis: price friction", "Coverage says PE fundraising paused over valuation mismatch; founders reportedly purchased existing shares near ₹11,300 crore.", "Closed financing at the claimed price with terms and evidence of sustainable cash generation."]
      - ["Anti-thesis: earnings quality remains unproven", "FY24 losses narrowed, but FY25 reporting conflicts and FY26 growth is an estimate rather than audited guidance.", "Audited FY25–FY26 financials and reconciliation of operating income, profit, and cash flow."]
    notes: "FY24 amounts are reported metrics; the ₹11,300 crore secondary mark is not primary capital raised. The competitor down-round item is not used as a Purplle multiple."
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "FY26 revenue estimate is verified; growth converts to stronger gross margin, repeat purchases, and positive cash generation; dilution and preferences are manageable.", "No numeric range is supportable. A value above the reported ₹11,300 crore secondary mark would require verified earnings quality and a risk-adjusted return; no target return can be calculated.", "Conditional upside; probability is not estimable from the available evidence.", "Audited growth or margin fails to support the current transaction reference."]
      - ["Base", "Reported FY24 growth persists but recent results and cash conversion remain uncertain; the fundraising pause is resolved without evidence of a materially higher-quality earnings base.", "₹10,000 crore (reported 2024 mark) to approximately ₹11,300 crore (reported secondary mark) are observed references only, not an analyst fair-value range; hold pending diligence.", "Central working case, but unquantified; confidence low.", "A verified financing requires materially weaker terms or reveals adverse preference overhang."]
      - ["Bear", "Revenue growth slows, operating losses or working-capital needs persist, or a new capital raise is required on dilutive terms.", "Value may be below the reported ₹10,000 crore 2024 mark; no numerical floor, downside percentage, or expected return is supportable.", "Material downside risk; probability is not estimable.", "Audited results show stalled growth, worsening cash conversion, or common-equity impairment from preferences."]
    notes: "Scenario markers reproduce reported historical/current transaction references; they are not independently derived valuation ranges. No numerical probability, return, or multiple is invented."
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011]
