company:
  name: Purplle
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public reporting places Purplle's 2024 Series F at ₹1,500 crore and a later
    founder secondary transaction near ₹11,300 crore, while fundraising talks
    reportedly paused over price. The financing marks are not a substantiated
    fair-value range: audited recent financials, unit economics, capital terms,
    and comparable evidence remain insufficient, supporting research-more.
sections:
  - id: decision-and-entry-discipline
    title: Price-sensitive recommendation
    body: >-
      Recommendation: research-more, with medium-low confidence in the direction
      of the call and high uncertainty about fair value. The latest reported
      ₹11,300 crore mark is a founder-led secondary share purchase, not a disclosed
      primary financing or proof that this amount entered Purplle. The reported
      pause in private-equity fundraising because of valuation disagreement is
      direct evidence of price friction, not proof that either side's price is
      correct. A prior 2024 investment mark and a recent secondary reference
      bound observed transactions, but neither supplies a current fully diluted
      equity value, security terms, or investor return. Do not convert the
      reported revenue estimate into ARR or a valuation multiple; wait for
      audited financials and transaction documentation before setting an entry
      ceiling or target return.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: operating-evidence-and-thesis
    title: Scale, proof, and anti-thesis
    body: >-
      The positive case is a large, multi-brand beauty platform with reported
      operating revenue growth: FY24 revenue from operations was reported at
      ₹680 crore versus ₹475 crore in FY23, while the reported consolidated net
      loss narrowed to ₹124 crore from ₹230 crore. These are revenue and
      accounting-loss measures, not ARR or cash burn. Media coverage also
      describes rapid FY25 growth and estimates FY26 revenue growth of 35–40%,
      but the FY26 figure is attributed to an unnamed source and is not audited
      guidance. A separate Venture Intelligence page reports materially
      different FY25 operating income and profit figures; until the underlying
      filings reconcile the periods and metric definitions, the scale story is
      not a reliable earnings base for a multiple or DCF.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-valuation-references
    title: Scenario cases and observed price markers
    body: >-
      Scenario analysis is directional because the assigned evidence does not
      support defensible intrinsic-value ranges or numerical probabilities. The
      2024 ₹10,000 crore mark reported in current coverage and the roughly
      ₹11,300 crore founder secondary mark are transaction references, not
      verified valuation floors or ceilings; the ₹13,000 crore financing
      valuation discussed in coverage was not achieved in a closed round.
      Upside requires audited growth, margin improvement, repeat purchasing, and
      cash conversion sufficient to support the price after dilution and
      preference rights. The downside case is material if reported growth fails
      to convert into profits or if capital needs force a lower-priced raise.
      The Sugar Cosmetics down-round report is a sector risk illustration only,
      not an independent Purplle comparable or a source of a peer multiple.
    claimRefs: [CV001, CV002, CV004, CV005, CV008, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-thesis-breaks
    title: Conditions to underwrite an entry
    body: >-
      Before underwriting a new investment, obtain audited FY25 and FY26
      statements and a reconciliation of reported revenue, operating income,
      accounting profit, cash flow, and working capital. Request the cap table,
      share-class waterfall, preference and liquidation terms, employee-option
      pool, and exact consideration and share class in the founder secondary
      purchase; these determine dilution and proceeds, and cannot be inferred
      from a headline valuation. Ask management to substantiate gross margin by
      owned versus third-party brands, contribution after discounts and
      fulfillment, repeat-order cohorts, and offline-store payback. Thesis-break
      triggers are a verified revenue slowdown, persistent operating losses or
      negative cash conversion, a materially dilutive financing below the
      reported 2024 mark, or preference claims that leave common equity with
      inadequate exit proceeds.
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV010, CV011, CV014, CV015]
