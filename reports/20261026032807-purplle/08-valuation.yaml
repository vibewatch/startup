callouts:
  - calloutType: recommendation
    title: Do not price from a secondary headline
    body: >-
      The reported ₹11,300 crore founder purchase is a secondary-share mark.
      Require audited financials and transaction terms before treating it as a
      valuation anchor or setting an entry ceiling.
    claimRefs: [CV002, CV003, CV009, CV010, CV011]
