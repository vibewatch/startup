evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Current board composition, executive roster, investor appointment or veto rights, founder ownership, and
      succession arrangements.
    whyItMatters: >-
      Publicly named investors and founders do not establish who controls the company or how governance and key-person
      risks are managed.
    diligencePath: >-
      Obtain the current board roster, fully diluted cap table, articles, shareholder agreement, and organization chart
      from the company or filed IPO materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: An incorporation record or contemporaneous company document that establishes the legally relevant founding date.
    whyItMatters: >-
      Assigned profiles report both 2011 and 2012, so company age and milestone ordering cannot be stated as a single
      verified year.
    diligencePath: Verify the incorporation date in MCA records and reconcile it with the operating launch date.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited FY25/FY26 statements and the accounting basis for FY24/FY25 revenue, losses, and consolidated entities.
    whyItMatters: >-
      Secondary reports do not establish audited revenue, cash generation, or whether periods and entities are
      comparable.
    diligencePath: >-
      Request audited financial statements and entity-level reconciliations; verify filings through MCA or a DRHP if
      filed.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: customer-scale
    missingEvidence: Dated customer or monthly-active-user counts with consistent definitions, and a current employee count.
    whyItMatters: >-
      Scale metrics are useful context but should not be inferred from product availability, funding, or undated profile
      estimates.
    diligencePath: Request dated MAU, transacting-customer, repeat-rate, and headcount disclosures with definitions.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map
    missingEvidence: A complete, current shareholder register and the rights attached to each share class.
    whyItMatters: >-
      The selected names are not an exhaustive cap table and reported participation does not establish current ownership
      or control.
    diligencePath: Reconcile the current cap table to MCA filings, transaction documents, and the shareholder agreement.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: purplle-addressable-market
    missingEvidence: >-
      Purplle revenue and gross merchandise value split by category, owned versus third-party brands, customer
      geography, channel, and repeat cohort, together with market denominators for the same periods.
    whyItMatters: >-
      The broad BPC TAM and online-channel proxy do not establish the spend Purplle can serve or its obtainable share;
      they cannot support a company-specific SOM or conversion assumption.
    diligencePath: >-
      Request audited category/channel sales, active and repeat buyer cohorts, price-band mix, and geographic
      penetration; reconcile these against a dated third-party market dataset using the same category boundaries.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Buyer-level spending, payer identity, repeat purchase, conversion, and price-elasticity data segmented by product
      need, income band, and online/offline purchase path.
    whyItMatters: >-
      The available reports describe broad consumer preferences and channels but do not verify budget ownership or
      unit-level adoption economics.
    diligencePath: >-
      Obtain anonymized cohort and transaction data, including payer, purchase frequency, discounting, returns, and
      channel-level contribution by segment; test against customer interviews and store conversion data.
    relatedQuestionRefs:
      - QM003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Purplle and peer cohort retention, repeat purchase, cross-shopping, and multi-homing data by customer segment.
    whyItMatters: >-
      Without buyer-level evidence, assortment breadth and owned labels cannot be translated into durable lock-in or a
      defensible lifetime-value advantage.
    diligencePath: >-
      Request monthly cohort retention, repeat-order frequency, cross-shopping, and customer-level channel data for
      Purplle and key peers.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Current matched-product list and realized-price comparisons across Purplle, Nykaa, Myntra, and digital-native
      beauty brands.
    whyItMatters: >-
      Price, promotion, and assortment trade-offs affect conversion and margin, but the retained evidence contains no
      common basket or realized discount data.
    diligencePath: >-
      Compare a dated, matched SKU basket across public storefronts and request realized net prices, promotion funding,
      and category margins from Purplle.
    relatedQuestionRefs:
      - QP010
  - type: missing-source
    severity: material
    topic: competitor-economics
    missingEvidence: Like-for-like peer revenue, beauty-specific assortment, market share, buyer overlap, CAC, and channel economics.
    whyItMatters: Directory competitor lists and platform-wide catalog totals do not establish relative scale or share gains.
    diligencePath: >-
      Obtain current company filings and a consistent third-party category dataset, then reconcile category scope,
      period, and channel definitions.
    relatedQuestionRefs:
      - QP002
      - QP010
  - type: missing-source
    severity: minor
    topic: trust-regulatory-posture
    missingEvidence: >-
      Comparable evidence on product authenticity controls, seller quality, returns disputes, and regulatory posture
      across the named peers.
    whyItMatters: Trust failures or uneven product assurance can change buyer preference and repeat purchase in beauty commerce.
    diligencePath: >-
      Review current platform policies, customer complaint data, product verification controls, and regulator records
      for Purplle and its principal peers.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized prices, discounts, seller take rates, gross and contribution margins, CAC, cohort payback, and
      channel-specific fulfillment costs.
    whyItMatters: >-
      Revenue or GMV growth alone does not show whether an order or customer cohort contributes profit after
      acquisition, discounts, and service costs.
    diligencePath: >-
      Obtain audited brand- and channel-level revenue bridges, merchant contracts, order cohorts, marketing attribution,
      and fulfillment costs.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly net burn, debt and project-finance schedules, and primary proceeds actually
      received from the announced mixed transaction.
    whyItMatters: >-
      Historical funding and a combined primary-secondary announcement do not establish cash available, committed uses,
      or downside runway.
    diligencePath: >-
      Request the latest balance sheet, bank reconciliation, cash-flow forecast, debt schedule, transaction documents,
      and board-approved financing plan.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-fy25
    missingEvidence: >-
      Audited FY25 financial statements and a bridge specifying legal entity, consolidation perimeter, and
      gross-versus-net revenue treatment.
    whyItMatters: The available profile figures cannot support a dependable FY24-to-FY25 growth rate or comparable revenue multiple.
    diligencePath: >-
      Reconcile audited consolidated statements and entity schedules to the underlying statutory filings and management
      accounts.
    relatedQuestionRefs:
      - QI003
      - QI010
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: current-technical-assurance
    missingEvidence: >-
      Current engineering documentation, API and integration references, deployment status for the case-study
      components, independent security assurance, and recent privacy/data-flow evidence.
    whyItMatters: >-
      The detailed technical evidence is historical and supplier-published, while the privacy controls are company
      statements; neither establishes current architecture, release status, or independently tested controls.
    diligencePath: >-
      Request a current engineering walkthrough, architecture and data-flow diagrams, release status for recommendation
      and visual-discovery features, recent security assessments, and access-review evidence.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: service-quality
    missingEvidence: Representative, dated delivery, return, refund, support-response, complaint-resolution, and uptime metrics.
    whyItMatters: >-
      A single self-selected review cannot establish frequency, trend, severity, or whether a reported service problem
      is systemic.
    diligencePath: >-
      Request cohort-level service and support metrics plus recent incident summaries, then corroborate them with dated
      customer evidence.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: seller-onboarding
    missingEvidence: >-
      Current Purplle-issued seller onboarding requirements, dashboard capabilities, catalog-feed integrations, and
      fulfillment/service terms.
    whyItMatters: >-
      The only assigned seller workflow is a third-party checklist that explicitly says requirements vary and should be
      confirmed with Purplle.
    diligencePath: >-
      Obtain the current seller portal documentation and validate a sample onboarding and listing workflow with a
      participating brand.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Referenceable, consented end-consumer examples with verified purchase status, use case and outcome.
    whyItMatters: Aggregate platform reach cannot establish production use, satisfaction, reference quality or customer-level value.
    diligencePath: >-
      Request a consented sample of repeat and first-time shoppers across metro and tier-2/3 cohorts, then conduct
      independent reference checks.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: Current cohort-level repeat-purchase, churn, NRR/GRR and satisfaction data with explicit periods and denominators.
    whyItMatters: The available historical app-retention figure does not establish repeat purchasing or durable customer economics.
    diligencePath: >-
      Obtain monthly order cohorts, repeat-order curves, returns and cancellations, and reconcile these to
      active-customer definitions.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer, geography, channel and brand concentration schedules with reconciled revenue denominators.
    whyItMatters: >-
      Reported revenue concentration in six cities cannot reveal dependence on a small number of customers, suppliers or
      acquisition channels.
    diligencePath: Request top-customer and top-brand revenue shares plus city/channel contribution and sensitivity analyses.
    relatedQuestionRefs:
      - QU005
      - QU007
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: customer-service-quality
    missingEvidence: A current independent sample of complaints, returns, failed deliveries and customer-service resolution outcomes.
    whyItMatters: No incident or complaint evidence in this assigned pool is not proof that adverse customer outcomes are absent.
    diligencePath: Review a dated third-party review sample and management's complaint, refund, delivery and escalation dashboards.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
