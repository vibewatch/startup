company:
  name: Purplle
chapter:
  number: 6
  title: Customers
  summary: >-
    The reviewed sources portray Purplle as a broad-reach beauty platform with
    reported demand in tier-2/3 cities, but customer counts vary by source,
    date and denominator. Public evidence does not establish named end-consumer
    references, repeat-purchase quality, retention cohorts or customer-level
    concentration.
sections:
  - id: customer-segments
    title: Customer segments and commercial reach
    body: >-
      Public reporting describes Purplle's target market as households with
      annual income of ₹5–30 lakh and says most of its target market is in
      tier-2 and tier-3 towns; Mint also reports that about half of revenue
      came from six named cities, not that half of customers lived there
      (CU001, CU002). A separate company-focused analysis attributes roughly
      70% of revenue to tier-2/3 cities, explicitly presenting this as the
      company's account rather than an independently audited customer mix
      (CU009). These are useful segmentation signals, not a complete
      customer-base breakdown: no disclosed customer counts by income,
      geography, age, channel or revenue band appear in the assigned sources.
      ITD GrowthLabs also describes the strategy as focused on tier-2/3
      markets, but supplies no customer-level count or denominator for that
      positioning (CU015).
      The platform spans app and website shopping and carries third-party
      products alongside owned brands (CU010). That assortment description
      establishes a multi-brand retail offer, but it does not show which
      segment buys each assortment or the revenue and margin contribution by
      segment. For diligence, management should provide customer and order
      distributions with consistent periods and denominators, plus gross
      contribution by channel and product ownership.
    claimRefs: [CU001, CU002, CU009, CU010, CU015]
    tableRefs: [TU001]
  - id: adoption-quality
    title: Adoption trajectory and durability
    body: >-
      The available scale indicators should not be read as a single growth
      series. An Economic Times report in January 2026 cites around 7 million
      monthly active users, Mint and Entrackr each report more than 10 million
      consumers reached monthly, and an undated Google Cloud case study says
      the company averaged four million monthly users. The Brand Hopper also
      repeats a figure of more than 7 million registered users as of 2021;
      registered users, monthly active users and monthly consumers are
      different measures, and the sources do not reconcile their dates or
      methods (CU003, CU004, CU005, CU016). The Google Cloud account reports
      52% app retention within 30 days,
      a 45% improvement in overall conversion, and 75,000 monthly interactions
      with a chatbot assistant (CU006, CU007, CU008). These are vendor-hosted
      customer-story metrics attributed to Purplle's account, not current,
      independently audited cohort results; the source does not define the
      relevant baselines or denominators. In particular, app retention is not
      equivalent to repeat-purchase retention, and chatbot interactions are
      not unique customers. No assigned source supplies current NRR/GRR,
      repeat-order rate, churn, renewal, cohort or satisfaction data. The
      trajectory table therefore keeps each metric, source and limitation
      separate rather than inferring a common trend.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU012, CU016]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Customer proof remains mostly aggregate
    body: >-
      Purplle is a consumer retailer, so a supplier's customer case study is
      not a named end-consumer reference. Google Cloud's case study names
      Purplle and attributes product-discovery and usage metrics to its CTO,
      but it documents Purplle as Google's customer, not a Purplle shopper's
      independently validated outcome (CU005, CU006, CU007, CU008, CU010).
      The other assigned sources describe aggregate reach, assortment,
      channel or geography; none provides an identifiable consumer
      testimonial, a referenceable named shopper, or a customer-level
      production outcome. The partial enumeration below makes that evidence
      boundary explicit rather than treating logos, product counts or user
      estimates as named proof. A diligence reference set should include
      consented shoppers across metro and non-metro cohorts, with purchase
      history and independently checkable service outcomes, while protecting
      personal data. Without that evidence, the public record supports broad
      reach but not reference quality, satisfaction or durable use.
    claimRefs: [CU005, CU006, CU007, CU008, CU010, CU011]
    tableRefs: [TU003]
  - id: concentration-and-gaps
    title: Expansion and concentration are not fully observable
    body: >-
      Mint's reported revenue share from six cities and the tier-2/3
      positioning indicate geographic reach beyond the largest metros, while
      also raising a concentration question: the public data do not reveal
      city-level revenue denominators, top-customer shares, or whether sales
      are concentrated in a small number of brands, marketplaces or
      acquisition channels (CU002, CU009, CU013). An Economic Times article
      reports more than 1,000 brands and 60,000 products alongside around
      7 million monthly active users, but breadth of assortment is not proof
      of customer retention or balanced supplier dependence (CU003). Nor do
      the sources establish an expansion loop from first purchase to repeat
      purchase. This chapter found no directly reviewed sample of complaints,
      returns, failed deliveries or independent customer reviews that could
      quantify adverse service outcomes; that is an evidence limitation, not
      evidence that such incidents are absent (CU014). The key asks are
      cohort-level repurchase and churn, service-quality data by geography,
      and customer- and brand-concentration schedules with consistent
      revenue definitions.
    claimRefs: [CU002, CU003, CU009, CU013, CU014]
tables:
  - id: TU001
    title: Customer segments and disclosed reach
    columns: ["Segment or dimension", "Buyer / user", "Use case or scale evidence", "Revenue / strategic value", "Diligence gap"]
    rows:
      - ["Target household income", "Indian beauty and personal-care shoppers", "Mint reports household annual income of ₹5–30 lakh for the typical target market", "Reported target segment; no segment revenue split", "Customer count and order value by income band are not disclosed"]
      - ["Tier-2/3 geography", "Consumers outside the largest metros", "Mint describes most of the target market as tier-2/3 towns; Invincible India attributes about 70% of revenue to these cities as a company account", "Signals reach beyond metro markets; not a customer-share measure", "Reconcile geography definitions and source revenue mix"]
      - ["Six named city markets", "Consumers in Mysore, Coimbatore, Kochi, Ernakulam, Kozhikode and Siliguri", "Mint reports these cities together generated about half of revenue", "Potential geographic concentration; period and city-level denominator are not provided", "Provide city-level revenue, order and active-customer shares"]
      - ["Digital channel", "App and website users", "Google Cloud reports four million average monthly users in an undated case study; Mint later reports more than 10 million consumers reached monthly", "Core discovery and shopping surfaces; the measures are not comparable", "Provide dated unique-user, buyer and order definitions"]
      - ["Marketplace and owned assortment", "Shoppers buying third-party and Purplle-owned brands", "Google Cloud and Mint describe third-party brands alongside owned brands", "Assortment breadth is established, but segment economics are not", "Disclose sales, repeat rate and contribution by brand ownership"]
    notes: >-
      Sources are public reporting and a supplier-hosted company case study,
      not a complete customer census. Revenue mix claims are attributed to
      their named sources; missing customer counts, periods and denominators
      remain gaps.
    claimRefs: [CU001, CU002, CU005, CU009, CU010]
  - id: TU002
    title: Reported adoption indicators and comparability limits
    columns: ["Metric", "Reported value", "Period / source", "Confidence and implication", "Missing denominator or limitation"]
    rows:
      - ["Monthly active users", "Around 7 million", "Economic Times report, 2026-01", "Third-party reported scale indicator", "Active-user definition and measurement window not specified in the retrieved text"]
      - ["Monthly consumers reached", "More than 10 million", "Mint and Entrackr articles; publication dates not established from retrieved text", "A reach claim, not necessarily unique purchasers", "Unique-user, active-user and buyer definitions are not reconciled"]
      - ["Average monthly users", "4 million", "Undated Google Cloud customer case study", "Historical supplier-hosted case-study statement", "Measurement period and user definition are not supplied"]
      - ["Registered users", "More than 7 million", "The Brand Hopper profile; as of 2021", "Historical registered-user count, not an active-user measure", "Registration is not evidence of monthly activity or purchasing"]
      - ["App retention within 30 days", "52%", "Undated Google Cloud customer case study", "Historical company-reported product metric", "Cohort, baseline, qualifying event and repeat-purchase relation are unspecified"]
      - ["Overall conversion improvement", "45%", "Undated Google Cloud customer case study", "Historical improvement claim", "Baseline, period and conversion denominator are unspecified"]
      - ["Chatbot Beauty Assistant interactions", "75,000 per month", "Undated Google Cloud customer case study", "Reported interaction volume, not unique customers", "No unique-user count, resolution rate or satisfaction outcome"]
    notes: >-
      Values are reproduced with each source's metric name and qualifiers.
      The different populations, periods and definitions do not form a
      comparable time series; neither app retention nor interaction volume
      establishes repeat purchasing.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU016]
  - id: TU003
    title: Named customer proof table
    columns: ["Proof category", "Public evidence in assigned sources", "Deployment / use status", "Outcome evidence", "Limitation"]
    rows:
      - ["Named Purplle end-consumer reference", "No identifiable shopper or consented customer reference located", "Not established", "No named shopper outcome available", "Aggregate reach cannot substitute for reference checks"]
      - ["Independent shopper case study", "No independently documented named shopper deployment or case study located", "Not established", "No independently validated shopper outcome available", "Google Cloud's story concerns its supplier relationship with Purplle"]
      - ["Aggregate product-use signals", "Google Cloud reports monthly users, app retention, conversion improvement and chatbot interactions", "Reported use of Purplle's consumer platform", "Historical aggregate metrics only", "Undated case study; denominators and independent verification are absent"]
    notes: >-
      Partial evidence review of the assigned successful prefetched URLs. Rows
      distinguish missing reference evidence from aggregate product-use
      claims; they do not imply an exhaustive search of all possible customers.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial review of customer and adoption evidence in this chapter's
        assigned prefetched source pool, not an exhaustive consumer census.
    claimRefs: [CU005, CU006, CU007, CU008, CU010, CU011]
