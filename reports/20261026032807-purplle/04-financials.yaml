    title: Qualitative revenue-to-earnings bridge
    type: flow
    summary: >-
      Public profiles describe sales channels, while reported FY24 expenses
      exceeded revenue from operations and the company reported a net loss.
    approximationNotes: >-
      Qualitative only: no channel mix, take rate, gross margin, or cash-flow
      bridge is disclosed; the reported figures are not drawn to scale.
    data:
      nodes:
        - id: owned-label
          label: Owned-label product sales
        - id: marketplace
          label: Third-party marketplace fees, commissions, and advertising
        - id: operating-revenue
          label: FY24 revenue from operations reported at ₹680 crore
        - id: expenses
          label: FY24 total expenses reported at ₹850 crore
        - id: net-loss
          label: FY24 consolidated net loss reported at ₹124 crore
        - id: missing-inputs
          label: Channel margins and current cash / runway not disclosed
      edges:
        - from: owned-label
          to: operating-revenue
        - from: marketplace
          to: operating-revenue
        - from: operating-revenue
          to: expenses
        - from: expenses
          to: net-loss
        - from: net-loss
          to: missing-inputs
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI014
callouts:
  - calloutType: risk
    title: Revenue growth is not yet an underwritable margin or liquidity story
    body: >-
      FY24 revenue from operations grew in secondary reporting, but the
      company still reported a net loss; FY25 revenue figures are unreconciled,
      and no assigned source establishes current cash, burn, runway, or
      contribution economics.
    claimRefs:
      - CI003
      - CI005
      - CI010
      - CI014
      - CI015
