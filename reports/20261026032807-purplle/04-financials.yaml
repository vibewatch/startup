schemaVersion: "report-v2"
artifact: financials
slug: purplle
runDate: 2026-10-26
company:
  name: Purplle
chapter:
  number: 4
  title: Financials
  summary: >-
    Public profiles describe a hybrid beauty-commerce model and report FY24
    operating-revenue growth alongside a substantial accounting loss. FY25
    revenue figures are not reconciled across databases, and channel economics,
    current cash, burn, and runway remain unavailable in the assigned evidence.
sections:
  - id: revenue-model
    title: Revenue model and reported scale
    body: >-
      Public profiles describe Purplle as a beauty-commerce retailer combining
      third-party marketplace assortment with owned-label sales (CI001). They
      list private-label product sales, seller fees or commissions, advertising,
      and salon-booking commissions as revenue mechanisms, but do not quantify
      their mix or realized take rates (CI002). These are commerce revenues,
      not ARR. A company announcement syndicated by Indian Retailer claimed
      gross merchandise value (GMV) had quadrupled over the preceding three
      years (CI012); it gives no absolute GMV or conversion from GMV to
      recognized revenue. The FY24 revenue figure of ₹680 crore is reported as
      revenue from operations, while a separate profile reports total revenue
      of ₹725 crore including other income (CI003, CI004). The figure below
      connects these reported measures only as a qualitative bridge; it does
      not allocate revenue to channels or imply a gross-margin calculation.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI012
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: reported-performance
    title: Reported performance and data quality
    body: >-
      Economic Times' 11 September 2024 report summary and two company-profile
      databases put FY24 revenue from operations at about ₹680 crore, up 43%
      from ₹475 crore in FY23 (CI003). Economic Times reports FY24 consolidated
      net loss of ₹124 crore, down from ₹230 crore in FY23, while total expenses
      rose to ₹850 crore from ₹738 crore and employee-benefit expenses to ₹191
      crore from ₹170 crore (CI005, CI006). The smaller accounting loss is not
      evidence of positive cash generation or order-level contribution.
      Available FY25 profiles disagree: Inc42 displays ₹542.8 crore+, Venture
      Intelligence shows ₹542.84 crore in its summary but ₹462.17 crore in its
      financial table, and Affluense gives a separate FY24 set of ₹650 crore
      revenue, ₹45 crore net loss, and -18% EBITDA margin (CI007–CI010).
      Their scopes and metric definitions are not reconciled, so these figures
      should not be combined into a growth series. A company-issued phrase
      describing the business as “operational profitably” is also undefined
      and does not replace the reported FY24 net-loss measure (CI011).
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
    tableRefs:
      - TI002
  - id: economics-and-capital
    title: Unit economics and capital adequacy remain unproven
    body: >-
      The assigned sources do not establish realized selling prices, discount
      rates, seller take rates, gross or contribution margin, CAC, cohort
      payback, or channel-level fulfillment costs (CI014). StartupTalky
      identifies market saturation, marketing budgets, and operating
      efficiency as challenges, but supplies no corresponding Purplle-specific
      cost or acquisition metrics (CI013). The July 2024 announcement describes
      a ₹1,000 crore transaction combining primary and secondary shares and
      ₹50 crore of employee ESOP liquidity, without splitting the proceeds
      (CI011). That transaction is not a current cash balance: the assigned
      evidence does not disclose unrestricted cash, net burn, runway, debt, or
      project-finance obligations (CI015). With the FY25 revenue basis
      unresolved and these private operating and liquidity inputs absent,
      revenue quality, margin conversion, and capital sufficiency cannot yet
      be underwritten from public evidence (CI016).
    claimRefs:
      - CI011
      - CI013
      - CI014
      - CI015
      - CI016
    tableRefs:
      - TI003
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
      - Revenue stream
      - Mechanism described in profiles
      - Publicly quantified value
      - Revenue-quality implication
      - Diligence ask
    rows:
      - - Owned-label product sales
        - Retail sales of Purplle-owned or private-label products
        - No brand-level sales or margin disclosed
        - Gross product sales and net recognized revenue are not reconciled
        - Request brand-level net sales, discounts, returns, and contribution
      - - Third-party marketplace
        - Seller listing fees and commissions on products sold
        - No fee schedule or realized take rate disclosed
        - Gross-versus-net presentation and merchant economics are unknown
        - Obtain merchant contracts and gross-to-net revenue schedules
      - - Advertising and marketing
        - Paid brand placements on the app or website
        - Revenue, pricing, and utilization not disclosed
        - A described stream does not establish material contribution
        - Request advertising revenue, inventory utilization, and renewals
      - - Salon-booking commissions
        - Commission-based salon-reservation services described by one profile
        - Current activity, booking volume, and commission not verified
        - Scale and continuity of this stream are unknown
        - Verify current status and request completed bookings and fee data
    notes: >-
      Profile descriptions are not audited channel disclosures; unavailable
      mix, rates, and margins are unknown, not zero.
    claimRefs:
      - CI001
      - CI002
  - id: TI002
    title: Publicly reported revenue, expenses, and earnings
    columns:
      - Metric
      - Period
      - Reported value
      - Source basis and limitation
      - Underwriting implication
    rows:
      - - Revenue from operations
        - FY23
        - ₹475 crore
        - Reported by Economic Times, StartupTalky, and BusinessIdeas.live
        - Baseline for the reported FY24 operating-revenue comparison
      - - Revenue from operations
        - FY24
        - ₹680 crore; 43% growth from FY23
        - Secondary reporting; not an audited statement in this pool
        - Growth does not identify channel mix or margin conversion
      - - Total revenue and other income
        - FY24 / FY23
        - ₹725 / ₹509 crore total; ₹45 / ₹34 crore other income
        - StartupTalky profile separates other income from operations
        - Do not substitute total revenue for revenue from operations
      - - Consolidated net loss
        - FY24 / FY23
        - ₹124 / ₹230 crore; loss narrowed 46%
        - Economic Times and profiles report accounting loss
        - Net loss is not cash burn or proof of positive cash flow
      - - Total expenses
        - FY24 / FY23
        - ₹850 / ₹738 crore
        - Economic Times report summary and StartupTalky profile
        - Expense growth still requires category and contribution analysis
      - - Employee-benefit expenses
        - FY24 / FY23
        - ₹191 / ₹170 crore
        - Economic Times report summary
        - Headcount cost alone does not explain total cost-to-serve
      - - Revenue
        - FY25
        - Inc42 displays ₹542.8 crore+
        - Profile does not state gross/net basis or consolidation perimeter
        - Not a comparable growth rate without scope reconciliation
      - - Revenue
        - FY25
        - Venture Intelligence summary ₹542.84 crore; table ₹462.17 crore
        - Internal profile discrepancy; metric definitions are not provided
        - Reconcile against entity-level audited statements
      - - Revenue, net loss, and EBITDA margin
        - FY24
        - Affluense reports ₹650 crore, ₹45 crore, and -18%, respectively
        - AI-generated profile does not reconcile these figures to its sources
        - Treat as an unverified conflicting report, not a normalized result
    notes: >-
      Values retain each source's reported metric and period; secondary
      estimates are not normalized across entities or accounting bases.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
  - id: TI003
    title: Unit economics and capital inputs still required
    columns:
      - Metric
      - Public value in assigned sources
      - Why it matters
      - Specific diligence request
    rows:
      - - Realized selling price and discounts
        - Not disclosed
        - List price does not establish realized net sales
        - Obtain SKU-level realized prices, promotions, returns, and refunds
      - - Marketplace take rate and ad yield
        - Not disclosed
        - Needed to distinguish GMV from recognized platform revenue
        - Request seller fee schedules, take rates, and advertising yield
      - - Gross and contribution margin
        - Not disclosed
        - Needed to assess product, fulfillment, and discount economics
        - Obtain brand- and channel-level gross-to-contribution bridges
      - - CAC, retention, and cohort payback
        - Not disclosed
        - Required to test whether acquisition spend compounds profitably
        - Request channel CAC, repeat-order cohorts, and payback calculations
      - - Fulfillment, returns, and inventory working capital
        - Not disclosed
        - Determines service cost and cash tied up in stock
        - Request delivery, return, inventory-turn, and payable schedules
      - - Capital expenditure and debt obligations
        - Not disclosed
        - Needed to assess fixed funding needs and senior claims
        - Obtain capex plans, debt schedule, and any project-finance terms
      - - Cash, net burn, and runway
        - Not disclosed
        - A historical raise does not establish current liquidity
        - Obtain latest unrestricted cash, monthly net burn, and downside runway
      - - Primary versus secondary proceeds
        - ₹1,000 crore announced as a combined transaction; split not stated
        - Only primary proceeds can directly increase company cash
        - Reconcile transaction documents and actual proceeds received
    notes: >-
      Missing private metrics are shown as not disclosed rather than estimated;
      funding raised is not treated as cash available.
    claimRefs:
      - CI011
      - CI014
      - CI015
figures:
