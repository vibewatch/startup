  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and reported scale
        blocks:
          - type: paragraph
            body: >-
              Public profiles describe Purplle as a beauty-commerce retailer combining third-party marketplace
              assortment with owned-label sales (CI001). They list private-label product sales, seller fees or
              commissions, advertising, and salon-booking commissions as revenue mechanisms, but do not quantify their
              mix or realized take rates (CI002). These are commerce revenues, not ARR. A company announcement
              syndicated by Indian Retailer claimed gross merchandise value (GMV) had quadrupled over the preceding
              three years (CI012); it gives no absolute GMV or conversion from GMV to recognized revenue. The FY24
              revenue figure of ₹680 crore is reported as revenue from operations, while a separate profile reports
              total revenue of ₹725 crore including other income (CI003, CI004). The figure below connects these
              reported measures only as a qualitative bridge; it does not allocate revenue to channels or imply a
              gross-margin calculation.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
              - CI014
      - number: '4.2'
        title: Reported performance and data quality
        blocks:
          - type: paragraph
            body: >-
              Economic Times' 11 September 2024 report summary and two company-profile databases put FY24 revenue from
              operations at about ₹680 crore, up 43% from ₹475 crore in FY23 (CI003). Economic Times reports FY24
              consolidated net loss of ₹124 crore, down from ₹230 crore in FY23, while total expenses rose to ₹850 crore
              from ₹738 crore and employee-benefit expenses to ₹191 crore from ₹170 crore (CI005, CI006). The smaller
              accounting loss is not evidence of positive cash generation or order-level contribution. Available FY25
              profiles disagree: Inc42 displays ₹542.8 crore+, Venture Intelligence shows ₹542.84 crore in its summary
              but ₹462.17 crore in its financial table, and Affluense gives a separate FY24 set of ₹650 crore revenue,
              ₹45 crore net loss, and -18% EBITDA margin (CI007–CI010). Their scopes and metric definitions are not
              reconciled, so these figures should not be combined into a growth series. A company-issued phrase
              describing the business as “operational profitably” is also undefined and does not replace the reported
              FY24 net-loss measure (CI011).
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Unit economics and capital adequacy remain unproven
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not establish realized selling prices, discount rates, seller take rates, gross or
              contribution margin, CAC, cohort payback, or channel-level fulfillment costs (CI014). StartupTalky
              identifies market saturation, marketing budgets, and operating efficiency as challenges, but supplies no
              corresponding Purplle-specific cost or acquisition metrics (CI013). The July 2024 announcement describes a
              ₹1,000 crore transaction combining primary and secondary shares and ₹50 crore of employee ESOP liquidity,
              without splitting the proceeds (CI011). That transaction is not a current cash balance: the assigned
              evidence does not disclose unrestricted cash, net burn, runway, debt, or project-finance obligations
              (CI015). With the FY25 revenue basis unresolved and these private operating and liquidity inputs absent,
              revenue quality, margin conversion, and capital sufficiency cannot yet be underwritten from public
              evidence (CI016).
            claimRefs:
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI011
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue growth is not yet an underwritable margin or liquidity story
            body: >-
              FY24 revenue from operations grew in secondary reporting, but the company still reported a net loss; FY25
              revenue figures are unreconciled, and no assigned source establishes current cash, burn, runway, or
              contribution economics.
            calloutType: risk
            claimRefs:
