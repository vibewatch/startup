      - number: '3.3'
        title: Differentiation durability remains unverified
        blocks:
          - type: paragraph
            body: >-
              Blume, an investor in Purplle, credits technology, product relevance, and data with competitive edge; that
              is an interested partner view, not an independent benchmark (CP016). The assigned evidence does not show
              exclusive supply access, repeat purchase, switching costs, customer acquisition economics, or retention
              against named peers (CP013, CP016). The Economic Times reported in September 2026 that Sugar Cosmetics was
              seeking capital at a valuation more than 80% below its peak amid falling revenue and losses (CP010). This
              is adverse evidence about a named rival, not proof of Purplle share gains or relative resilience. Blume
              also described newer D2C brands crowding the category (CP011). No common-SKU price basket or realized
              discount comparison is available, and broad Myntra offers do not prove beauty-category price advantage
              (CP008, CP012). Switching, multi-homing, buyer overlap, and supplier terms remain diligence priorities.
            claimRefs:
