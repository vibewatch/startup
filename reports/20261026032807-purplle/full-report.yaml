              - CU005
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The available scale indicators should not be read as a single growth series. An Economic Times report in
              January 2026 cites around 7 million monthly active users, Mint and Entrackr each report more than 10
              million consumers reached monthly, and an undated Google Cloud case study says the company averaged four
              million monthly users. The Brand Hopper also repeats a figure of more than 7 million registered users as
              of 2021; registered users, monthly active users and monthly consumers are different measures, and the
              sources do not reconcile their dates or methods (CU003, CU004, CU005, CU016). The Google Cloud account
              reports 52% app retention within 30 days, a 45% improvement in overall conversion, and 75,000 monthly
              interactions with a chatbot assistant (CU006, CU007, CU008). These are vendor-hosted customer-story
              metrics attributed to Purplle's account, not current, independently audited cohort results; the source
              does not define the relevant baselines or denominators. In particular, app retention is not equivalent to
              repeat-purchase retention, and chatbot interactions are not unique customers. No assigned source supplies
              current NRR/GRR, repeat-order rate, churn, renewal, cohort or satisfaction data. The trajectory table
              therefore keeps each metric, source and limitation separate rather than inferring a common trend.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
      - number: '6.3'
        title: Customer proof remains mostly aggregate
        blocks:
          - type: paragraph
            body: >-
              Purplle is a consumer retailer, so a supplier's customer case study is not a named end-consumer reference.
              Google Cloud's case study names Purplle and attributes product-discovery and usage metrics to its CTO, but
              it documents Purplle as Google's customer, not a Purplle shopper's independently validated outcome (CU005,
              CU006, CU007, CU008, CU010). The other assigned sources describe aggregate reach, assortment, channel or
              geography; none provides an identifiable consumer testimonial, a referenceable named shopper, or a
              customer-level production outcome. The partial enumeration below makes that evidence boundary explicit
              rather than treating logos, product counts or user estimates as named proof. A diligence reference set
              should include consented shoppers across metro and non-metro cohorts, with purchase history and
              independently checkable service outcomes, while protecting personal data. Without that evidence, the
              public record supports broad reach but not reference quality, satisfaction or durable use.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
      - number: '6.4'
        title: Expansion and concentration are not fully observable
        blocks:
          - type: paragraph
            body: >-
              Mint's reported revenue share from six cities and the tier-2/3 positioning indicate geographic reach
              beyond the largest metros, while also raising a concentration question: the public data do not reveal
              city-level revenue denominators, top-customer shares, or whether sales are concentrated in a small number
              of brands, marketplaces or acquisition channels (CU002, CU009, CU013). An Economic Times article reports
              more than 1,000 brands and 60,000 products alongside around 7 million monthly active users, but breadth of
              assortment is not proof of customer retention or balanced supplier dependence (CU003). Nor do the sources
              establish an expansion loop from first purchase to repeat purchase. This chapter found no directly
              reviewed sample of complaints, returns, failed deliveries or independent customer reviews that could
              quantify adverse service outcomes; that is an evidence limitation, not evidence that such incidents are
              absent (CU014). The key asks are cohort-level repurchase and churn, service-quality data by geography, and
              customer- and brand-concentration schedules with consistent revenue definitions.
            claimRefs:
              - CU002
              - CU003
              - CU009
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Financial resilience and financing visibility
        blocks:
          - type: paragraph
            body: >-
              The clearest quantified financial risk is historical, not a current cash-burn measure. Mint reported FY24
              revenue from operations of about ₹680 crore, up from ₹475 crore, while the loss narrowed to ₹124 crore
              from ₹230 crore in FY23; The Economic Times independently lists the same FY24 loss movement and reports
              total expenses of ₹850 crore versus ₹738 crore (CR001–CR003). Those results show a large accounting loss
              despite growth, but do not establish operating cash flow, runway, or the present funding need. Mint also
              reported a ₹1,500 crore Series F led by ADIA, with other investors participating (CR004). This is evidence
              of sizeable external financing, not proof that funds remain available or that one investor controls the
              company. The 2026 SWOT page's cash-burn assertion is a low-confidence, unsubstantiated signal rather than
              a replacement for current statements (CR005). None of the assigned sources reports a current cash balance,
              operating cash flow, or runway calculation (CR013). Obtain audited FY25/FY26 statements, cash-flow and
              working-capital schedules, round terms, preference rights, and a current liquidity forecast before
              assigning a present severity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
