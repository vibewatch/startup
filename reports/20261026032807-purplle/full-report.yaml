chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Purplle is described as an Indian online beauty and personal-care marketplace. Reporting and the company's
              app listing describe a mix of third-party products and owned brands, but the available evidence is not a
              current corporate filing. Sources disagree on whether the company was founded in 2011 or 2012; neither
              date is resolved by the assigned materials. Neoma Capital identifies Manash Lifestyle Private Limited as
              the legal entity and reports IPO preparation, while also saying no DRHP had been filed as of its August
              2026 publication. These remain third-party-reported details, not verified issuer or registry disclosures.
              The snapshot separates reported measures from diligence gaps and avoids treating a potential transaction
              valuation as a completed financing.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
