              - CP016
      - number: '3.2'
        title: Portfolio breadth and segment focus are visible, not yet proven as a moat
        blocks:
          - type: paragraph
            body: >-
              Purplle's visible distinction is a channel and portfolio combination, not verified superiority. Mint
              reported third-party brand partnerships alongside owned labels, while BusinessIdeas describes a
              marketplace with in-house and acquired brands; neither source establishes brand-level share, margins,
              repeat rates, or exclusivity (CP001, CP002). Mint also locates most of Purplle's target market in tier-2/3
              towns and describes households with annual income of ₹5–30 lakh; this is reporting about Purplle, not a
              comparable peer cohort (CP003, CP004). Myntra's own app listing promotes beauty alongside fashion, home,
              and lifestyle categories and advertises platform-wide catalog, returns, and loyalty features (CP007,
              CP008). These catalog counts cover different scopes and do not establish relative scale. The matrix marks
              unsupported competitor capabilities as unknown rather than turning product descriptions into a benchmark
              (CP015, CP016).
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
