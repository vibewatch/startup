              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Product, advertising, and legal-control exposure
        blocks:
          - type: paragraph
            body: >-
              Purplle's reported mix of its own brands and third-party brands creates distinct product-governance
              questions: who owns product specifications, safety documentation, labeling, recalls, and supplier
              remediation for each item. BIS says certification is generally voluntary but that the Central Government
              makes compliance with Indian Standards compulsory for some products; the available source does not
              establish which Purplle-listed products are covered or whether any have failed a requirement (CR009). ASCI
              describes its independent self-regulatory role in requiring fair and honest advertising. That is relevant
              to product claims and promotions, but it is not evidence of a Purplle complaint or breach (CR010). The
              company's whistleblower policy lists legal and policy violations among covered concerns, while excluding
              customer complaints from that route and referring them to a separate mechanism (CR007– CR008). The
              existence of written controls is positive but says nothing about implementation or outcomes. Map
              applicable product rules and advertising approvals to the live catalog, and test complaint handling,
              escalation, and recall readiness; no enforcement or litigation conclusion is supported by this pool.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operating quality and customer exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not document a Purplle outage, product-safety incident, recall, delivery
              failure, or substantiated customer-service trend. That is an evidence limitation, not proof that such
              events have not occurred. A low-reputation SWOT analysis asserts last-mile complexity, discount
              dependence, and customer-service shortcomings without showing a method or underlying data; use these only
              as hypotheses to test (CR005). A separate AI-generated company page claims high customer engagement and
              retention but supplies no retention metric, cohort, or denominator (CR006). Neither statement establishes
              operating performance. Because the business combines marketplace products and owned brands, diligence
              should separate failures attributable to Purplle's fulfillment and support from brand-manufacturer quality
              issues, then inspect complaint volumes, resolution times, repeat purchase cohorts, delivery SLAs, returns,
              and recall procedures. Until those measures are provided, customer durability and service-control maturity
              remain unresolved rather than rated as observed failures.
            claimRefs:
              - CR005
              - CR006
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
      - number: '7.4'
        title: Governance controls and thesis-break monitoring
        blocks:
          - type: paragraph
            body: >-
              Manash Lifestyle's whistleblower policy, effective 1 April 2023, covers employees, directors, and other
              stakeholders with commercial dealings and describes confidentiality, investigation, and escalation
              procedures. It also gives the company discretion not to investigate anonymous complaints lacking specified
              details and excludes customer complaints from this channel (CR007–CR008). These provisions establish
              documented mechanisms only; the pool contains no complaint counts, investigation outcomes, independent
              control testing, or evidence that the mechanisms operated effectively. A separate financial-data listing
              says its FY25 detailed financials are available through a paid tier, which is about that listing's access,
              not proof that no statutory filings exist (CR012). Monitor verified disclosures rather than treating
              low-detail sources as proof of concealed information. Thesis-break indicators should include a failure to
              provide current audited accounts and cash-flow data, repeated unresolved consumer complaints, a
              product-safety or advertising enforcement action, or evidence that partner or supplier failures materially
              interrupt availability.
            claimRefs:
              - CR007
              - CR008
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current liquidity is not established
            body: >-
              FY24 accounting losses and a reported financing round do not reveal current cash, burn, or runway; obtain
              audited current statements and a cash-flow bridge before underwriting solvency.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR013
          - type: callout
            title: Controls are documented, not tested
            body: >-
              The whistleblower policy and general product/ad rules identify control obligations, but this evidence pool
              contains no outcome data or verified company-specific enforcement finding.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more, with medium-low confidence in the direction of the call and high
              uncertainty about fair value. The latest reported ₹11,300 crore mark is a founder-led secondary share
              purchase, not a disclosed primary financing or proof that this amount entered Purplle. The reported pause
              in private-equity fundraising because of valuation disagreement is direct evidence of price friction, not
              proof that either side's price is correct. A prior 2024 investment mark and a recent secondary reference
              bound observed transactions, but neither supplies a current fully diluted equity value, security terms, or
              investor return. Do not convert the reported revenue estimate into ARR or a valuation multiple; wait for
              audited financials and transaction documentation before setting an entry ceiling or target return.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: Scale, proof, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a large, multi-brand beauty platform with reported operating revenue growth: FY24
              revenue from operations was reported at ₹680 crore versus ₹475 crore in FY23, while the reported
              consolidated net loss narrowed to ₹124 crore from ₹230 crore. These are revenue and accounting-loss
              measures, not ARR or cash burn. Media coverage also describes rapid FY25 growth and estimates FY26 revenue
              growth of 35–40%, but the FY26 figure is attributed to an unnamed source and is not audited guidance. A
              separate Venture Intelligence page reports materially different FY25 operating income and profit figures;
              until the underlying filings reconcile the periods and metric definitions, the scale story is not a
              reliable earnings base for a multiple or DCF.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario cases and observed price markers
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is directional because the assigned evidence does not support defensible intrinsic-value
              ranges or numerical probabilities. The 2024 ₹10,000 crore mark reported in current coverage and the
              roughly ₹11,300 crore founder secondary mark are transaction references, not verified valuation floors or
              ceilings; the ₹13,000 crore financing valuation discussed in coverage was not achieved in a closed round.
              Upside requires audited growth, margin improvement, repeat purchasing, and cash conversion sufficient to
              support the price after dilution and preference rights. The downside case is material if reported growth
              fails to convert into profits or if capital needs force a lower-priced raise. The Sugar Cosmetics
              down-round report is a sector risk illustration only, not an independent Purplle comparable or a source of
              a peer multiple.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
