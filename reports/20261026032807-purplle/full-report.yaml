      - Evidence and limitation
      - What would change the view
    rows:
      - - 'Thesis: scalable beauty-commerce platform'
        - >-
          Purplle's own site lists beauty and personal-care categories; coverage reports FY24 operating revenue of ₹680
          crore.
        - Audited channel and category economics, customer repeat rates, and contribution margins.
      - - 'Thesis: historical funding validation'
        - The 2024 Series F closed at ₹1,500 crore, with reported prior-tranche valuation around $1.25 billion.
        - Current primary round documentation, security terms, and independent confirmation of the fully diluted mark.
      - - 'Anti-thesis: price friction'
        - >-
          Coverage says PE fundraising paused over valuation mismatch; founders reportedly purchased existing shares
          near ₹11,300 crore.
        - Closed financing at the claimed price with terms and evidence of sustainable cash generation.
      - - 'Anti-thesis: earnings quality remains unproven'
        - >-
          FY24 losses narrowed, but FY25 reporting conflicts and FY26 growth is an estimate rather than audited
          guidance.
        - Audited FY25–FY26 financials and reconciliation of operating income, profit, and cash flow.
    notes: >-
