  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and addressability
        blocks:
          - type: paragraph
            body: >-
              The relevant market is consumer spend on beauty and personal-care products, including skincare and sun
              care, colour cosmetics, hair care, fragrances, and related product categories. It is broader than online
              beauty retail: the cited market materials also distinguish mass and premium products and describe both
              online and physical channels. Salon services and appointments are adjacent services rather than product
              spend, and should not be added to the goods market without a separate definition. Purplle's company
              profile describes a marketplace alongside owned and acquired brands and an omnichannel footprint, but the
              profile does not establish its share of any of these category totals. [CM001, CM002]
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
              - CM014
              - CM015
      - number: '2.2'
        title: Multiple sizing lenses, not one addressable-market figure
        blocks:
          - type: paragraph
            body: >-
              The strongest current broad-market estimates cluster near USD 30-31 billion around 2025: IMARC reports USD
              31.19 billion for 2025, while Entrepreneur India summarizes estimates of USD 28-31 billion for 2024-25.
              Their forward views also converge near USD 49 billion, but IMARC's horizon is 2034 and Entrepreneur
              India's is the mid-2030s; their underlying methodologies are not reconciled in the accessible text.
              Personal Care Insights reports a faster, shorter-horizon path from USD 21 billion in 2024 to USD 34
              billion in 2028, so the 10-11% stated CAGR should not be blended with the other forecasts. IMARC's 30%
              online-store share implies approximately USD 9.36 billion using its 2025 total, but this is a derived
              channel proxy, not a measured Purplle SAM. [CM003, CM004, CM005, CM006, CM007, CM008, CM009, CM010]
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: Buyer behavior, route to market, and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is shaped by product needs and how shoppers assess trust, convenience, and price. IMARC
              identifies skincare and sun care as 35% of the 2025 BPC market and reports price sensitivity and
              counterfeit products as restraints. Entrepreneur India describes quick commerce as an important discovery
              and delivery route while noting offline trials remain relevant for shade matching and tactile confidence.
              The Economic Times reported that Purplle was focusing on in-house brands and offline expansion in 2026;
              that is evidence of the company's route-to-market choices, not proof of market-wide conversion or repeat
              purchase. Public evidence here does not disaggregate payer budgets, category-level customer economics, or
              Purplle's obtainable share. [CM002, CM011, CM012, CM013, CM014, CM015, CM016]
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The online proxy is not Purplle's SAM
            body: >-
              The approximately USD 9.36bn figure is derived from a broad BPC market estimate and an online-channel
              share. It does not isolate Purplle's product categories, customer cohorts, geographies, or competitive
              share.
            calloutType: risk
            claimRefs:
              - CM007
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans specialist and horizontal channels
        blocks:
          - type: paragraph
            body: >-
              Public profiles place Purplle in a set of specialist beauty retailers, digital-native labels, and
              horizontal marketplaces, but their lists are not a counted market map. Tracxn identifies Nykaa and Tira
              among its top competitors; The Company Check and StartupTalky add names including FOXY, Leeford, Myntra,
              Sugar Cosmetics, and MyGlamm (CP005, CP006). These are discovery candidates, not measured shares or
              capability rankings. Adjacent alternatives include Myntra's broader lifestyle app, brand-direct routes
              whose volume is unmeasured, and physical stores or beauty-parlor advice described in a Blume founder
              anecdote (CP007, CP009). Mint reported two Purplle offline stores and a plan to add five to ten more, but
              that historical plan does not establish the current footprint (CP014). Buyer overlap and substitution
              rates remain unknown.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP014
