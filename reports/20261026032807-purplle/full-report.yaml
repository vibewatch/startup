  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          FY26 revenue estimate is verified; growth converts to stronger gross margin, repeat purchases, and positive
          cash generation; dilution and preferences are manageable.
        - >-
          No numeric range is supportable. A value above the reported ₹11,300 crore secondary mark would require
          verified earnings quality and a risk-adjusted return; no target return can be calculated.
        - Conditional upside; probability is not estimable from the available evidence.
        - Audited growth or margin fails to support the current transaction reference.
      - - Base
        - >-
          Reported FY24 growth persists but recent results and cash conversion remain uncertain; the fundraising pause
          is resolved without evidence of a materially higher-quality earnings base.
        - >-
          ₹10,000 crore (reported 2024 mark) to approximately ₹11,300 crore (reported secondary mark) are observed
          references only, not an analyst fair-value range; hold pending diligence.
        - Central working case, but unquantified; confidence low.
        - A verified financing requires materially weaker terms or reveals adverse preference overhang.
      - - Bear
        - >-
          Revenue growth slows, operating losses or working-capital needs persist, or a new capital raise is required on
          dilutive terms.
        - >-
          Value may be below the reported ₹10,000 crore 2024 mark; no numerical floor, downside percentage, or expected
          return is supportable.
        - Material downside risk; probability is not estimable.
        - Audited results show stalled growth, worsening cash conversion, or common-equity impairment from preferences.
    notes: >-
      Scenario markers reproduce reported historical/current transaction references; they are not independently derived
      valuation ranges. No numerical probability, return, or multiple is invented.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
