              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Conditions to underwrite an entry
        blocks:
          - type: paragraph
            body: >-
              Before underwriting a new investment, obtain audited FY25 and FY26 statements and a reconciliation of
              reported revenue, operating income, accounting profit, cash flow, and working capital. Request the cap
              table, share-class waterfall, preference and liquidation terms, employee-option pool, and exact
              consideration and share class in the founder secondary purchase; these determine dilution and proceeds,
              and cannot be inferred from a headline valuation. Ask management to substantiate gross margin by owned
              versus third-party brands, contribution after discounts and fulfillment, repeat-order cohorts, and
              offline-store payback. Thesis-break triggers are a verified revenue slowdown, persistent operating losses
              or negative cash conversion, a materially dilutive financing below the reported 2024 mark, or preference
              claims that leave common equity with inadequate exit proceeds.
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not price from a secondary headline
            body: >-
              The reported ₹11,300 crore founder purchase is a secondary-share mark. Require audited financials and
              transaction terms before treating it as a valuation anchor or setting an entry ceiling.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
