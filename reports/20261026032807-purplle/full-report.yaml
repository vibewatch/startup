        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Available profiles name Manish Taneja, Rahul Dash, and Suyash Katyayani among Purplle's founders.
              StartupTalky identifies Taneja as co-founder, CEO, and managing director, and describes Dash and Katyayani
              as co-founders; those role descriptions are not corroborated by a current company leadership page or
              filing in this pool. The sample therefore indicates founder-led operating history but cannot establish
              today's complete executive roster, board composition, investor appointment rights, or key-person
              succession arrangements. Those omissions matter because the same sources describe substantial
              institutional investment without publishing the governance terms. The table is a partial roster, not an
