  - id: TE003
    title: Technology and operating architecture evidence
    columns:
      - Layer or process
      - Components and role stated
      - Evidence and vintage
      - Risk or diligence gap
    rows:
      - - "Cloud deployment"
        - "Google Cloud; the case says the 2017 migration took three days, with five to ten minutes of actual switch downtime."
        - "Supplier-published historical case; current topology is not described."
        - "No current deployment map, service-level objective, or uptime record is provided."
      - - "Personalized recommendation serving"
        - "Cloud Bigtable served personalized recommendations within milliseconds, according to the CTO's statement."
        - "Company statement in the historical Google Cloud case."
        - "No current latency distribution, model-quality measure, or independent benchmark is available."
      - - "Event processing and analytics"
        - "Pub/Sub and Dataflow are described as the event pipeline; BigQuery supports behavioral-event warehousing, segmentation, and product analytics."
        - "The case reports up to 40 million event data points per day but does not date the operating metric."
        - "Event definition, data lineage, retention, and current volume are not verified."
      - - "Privacy and access"
        - "Purplle says event identifiers are not stored in BigQuery and app logic plus Cloud IAM controls access to personally identifiable information."
        - "Company statement quoted by the infrastructure supplier."
        - "No independent audit, current data map, access review, or incident evidence is supplied."
      - - "Other services named"
        - "App Engine, Cloud Data Loss Prevention, Cloud Datastore, Cloud Functions, Cloud SQL, Cloud Storage, and Firebase appear in the case's product list."
        - "The case does not assign a specific role to every listed service."
        - "Current deployment status and service boundaries are not established."
    notes: >-
      The Google Cloud case is a vendor-published account of historical
      architecture and company-reported metrics, not an independent audit or
      current production inventory.
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
