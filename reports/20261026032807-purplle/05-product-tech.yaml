artifact: product-tech
slug: purplle
runDate: 2026-10-26
company:
  name: Purplle
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Purplle combines a beauty-and-wellness shopping app and marketplace with
    owned-brand assortment. The strongest technical detail is a historical
    Google Cloud case study describing recommendations, analytics, data controls,
    and product experiments; it does not establish the current architecture,
    independently verified security, or service quality.
sections:
  - id: shopper-product-surface
    title: Customer product and operating workflow
    body: >-
      Purplle's Google Play listing presents a beauty and personal-care shopping
      app spanning skin care, makeup, hair care, bath and body, men's grooming,
      and mom-and-baby categories; StartupTalky's 2025 profile also describes a
      multi-brand beauty retailer (CE001). BusinessIdeas.live describes a
      third-party marketplace alongside in-house and acquired brands, while
      Google's partner case separately names Purplle-created beauty brands
      (CE002). These sources support a hybrid assortment model, not current
      SKU counts, owned-brand share, or product quality. StartupTalky reports a
      Mumbai physical location with preference-based recommendations in 2017,
      but the allocated evidence does not establish the present store format or
      its role in the digital journey (CE003).

      Seller-side evidence is weaker: EcomSarthi advises prospective sellers to
      prepare business and category documentation, catalog data, and commercial
      terms before a controlled launch; it warns that requirements vary and
      directs sellers to confirm current terms through Purplle's official route
      (CE011). This is a third-party preparation guide, not Purplle-issued
      onboarding documentation. No assigned source describes a current seller
      dashboard, catalog-feed integration, moderation process, or fulfillment
      standard, so the actual merchant workflow remains only partly visible.
    claimRefs: [CE001, CE002, CE003, CE011]
    tableRefs: [TE001, TE002]
  - id: disclosed-technology
    title: Disclosed technology and operating model
    body: >-
      The most specific architecture evidence is Google's customer case study.
      It says Purplle selected Google Cloud in November 2017, completed the
      migration in three days, and experienced five to ten minutes of actual
      downtime during the connection switch (CE004). The case identifies
      Cloud Bigtable for personalized recommendations, and BigQuery,
      Pub/Sub, and Dataflow for event processing, analytics, and segmentation
      (CE005, CE006). It reports up to 40 million event data points per day and
      75,000 monthly Beauty Assistant chatbot interactions, but gives no
      measurement date or event definition for those figures (CE006, CE007).

      Purplle's CTO told Google Cloud that identifiable event information was
      not stored in BigQuery and that application logic and Cloud IAM limited
      access to personally identifiable information in the application
      database (CE008). Those are company statements in a supplier-published
      case, not independent control testing. The figure groups the case's
      named functions and components; it is not a verified current system
      diagram, and its vertical order does not imply a data-flow sequence.
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-assurance
    title: Differentiation, trust, and evidence limits
    body: >-
      The technical case describes Vision AI selfie-based skin analysis and
      lipstick matching as experiments, and reports a plan to expand live
      video try-on to ten more categories; that is evidence of a past experiment
      and stated roadmap, not confirmation of current rollout (CE009). A
      Blume Ventures interview carries founder Manish Taneja's account that
      Purplle doubled down on makeup videos in Indian languages and that views
      grew from thousands to millions; this is a company-reported discovery
      channel, not an independently measured conversion or retention effect
      (CE016). The undated FundForge overview also invokes technology and
      personalized shopping but names no implementation or measured outcome,
      so it does not independently verify current maturity (CE012).

      The App Store page displayed 4.6/5 from 214k ratings when fetched on
      2026-10-26 (CE013). One undated review describes a wrong or short
      shipment, a return-pickup mismatch, and difficulty obtaining an initial
      refund or replacement; that same review later says a Purplle
      representative resolved the issue and the reviewer changed the rating
      from one to five stars (CE014, CE015). This is a useful service-quality
      signal but a single self-selected account, not a complaint rate or proof
      of a systemic incident. Current security assurance, architecture,
      feature status, uptime, and representative support metrics remain
      material diligence gaps.
    claimRefs: [CE009, CE010, CE012, CE013, CE014, CE015, CE016]
