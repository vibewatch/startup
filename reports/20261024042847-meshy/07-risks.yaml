company:
  name: Meshy
chapter:
  number: 7
  title: Risks
  summary: Meshy's principal public-evidence risks are production-output acceptance, incomplete downstream workflows, cross-border and training-data governance, and reliance on unaudited company metrics. No assigned source establishes a Meshy-specific lawsuit, enforcement action, breach, or outage, so those areas remain diligence gaps rather than cleared risks.
sections:
  - id: ranked-risk-view
    title: Ranked residual risk and investment implication
    body: >-
      The highest residual exposure is execution quality rather than a verified legal or security
      incident. Independent user comments describe unusable geometry, inconsistent prompt fidelity,
      stalled processing, and billing friction, while a 2026 comparison places Meshy behind Tripo on
      workflow depth and technical transparency. Naavik separately identifies missing scene assembly,
      limited animation tooling, and absent downstream rendering or physics capabilities. These sources
      do not provide failure-rate denominators, so they cannot establish prevalence, but they do define
      an underwriting test: Meshy should demonstrate production acceptance by asset class, latency and
      failure-rate service levels, refund controls, and customer retention after human-cleanup costs.
      Until those measures are available, rapid adoption and financing do not by themselves de-risk
      product execution.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR015, CR016]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and data-governance exposure
    body: >-
      The assigned evidence contains no verified Meshy-specific litigation, enforcement, breach, or
      certification record. That is not proof of absence. Naavik explicitly flags potential regulatory
      pressure from Meshy's cross-border position and training-data governance. Sector precedent shows
      why provenance matters: the Anthropic book case distinguished legally acquired training material
      from pirated copies and produced a $1.5 billion settlement, while leaving broader precedent
      unsettled. This is an analogy, not an allegation about Meshy. The investable mitigation is a
      counsel-reviewed inventory of training and user-input rights, output licenses, takedown controls,
      enterprise indemnities, data residency, subprocessors, sanctions and export-control exposure, and
      claims history across the United States, China, and customer jurisdictions.
    claimRefs: [CR006, CR007, CR008, CR013]
    tableRefs: [TR001]
  - id: operating-quality
    title: Operational, quality, and customer-control risk
    body: >-
      Adverse evidence is anecdotal but specific. Reddit users report poor hard-surface geometry,
      incorrect character structure, upload or download failures, slow or stalled jobs, blurred
      textures, and one disputed trial charge. A separate review lists limited advanced customization
      and slower generation during peak demand, while the broader comparison warns that production
      assets still require inspection and cleanup. Countervailing comments in the same Reddit thread
      describe improvement and useful prototype workflows, so the evidence supports segmented testing
      rather than a blanket product-quality conclusion. Management should supply benchmark sets,
      acceptance rates, incident history, support-ticket cohorts, chargebacks, refunds, uptime, and
      p95 latency for game, printing, mobile, and API workloads.
    claimRefs: [CR001, CR002, CR003, CR015]
    tableRefs: [TR002]
  - id: dependencies-financial-triggers
    title: Dependencies, financial-model risk, and kill criteria
    body: >-
      Meshy reported more than $100 million in ARR in October 2026 after a nearly $400 million Series B
      at a $1.5 billion valuation. Allstar Discounts cautions that the ARR and operating-scale figures
      are company-reported and unaudited, and ARR is neither profit nor cash availability. The financing
      release says proceeds are intended for research and development and global expansion; it does not
      disclose present cash, burn, runway, or unit economics. Naavik also reports a US-and-Beijing
      operating footprint and China-focused investors, creating governance and regulatory dependencies
      alongside model, cloud, integration, app-store, and customer concentration risks. Thesis-break
      triggers should include failed production acceptance, sustained SLA misses, a material rights or
      privacy claim, ARR-to-cash reconciliation failure, or an unreplaceable provider or customer
      concentration above an investment-committee-approved threshold.
    claimRefs: [CR009, CR010, CR011, CR012, CR014]
    tableRefs: [TR003]
