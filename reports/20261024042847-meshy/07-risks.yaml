figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Qualitative placement separates evidenced failure modes from plausible and unknown exposures; it does not imply measured probabilities.
    data:
      columns:
        - label: "Likelihood: evidenced"
          detail: "At least one current source reports the condition; prevalence may remain unknown."
        - label: "Likelihood: plausible"
          detail: "The operating model or sector precedent supports diligence, without a verified Meshy incident."
        - label: "Likelihood: unknown"
          detail: "Assigned evidence is insufficient to classify likelihood."
      rows:
        - label: "High impact"
          note: "Could materially impair production adoption, enterprise access, or valuation."
          values:
            - label: "Output acceptance"
              detail: "User and comparative evidence identifies geometry, fidelity, and cleanup failure modes."
            - label: "Training-data provenance"
              detail: "Sector precedent demonstrates acquisition-method liability; no Meshy-specific case is established."
            - label: "Security/privacy incident"
              detail: "No Meshy-specific record or control evidence in the assigned pool."
        - label: "Medium-high impact"
          note: "Could slow growth or increase cost without necessarily breaking the thesis alone."
          values:
            - label: "Workflow incompleteness"
              detail: "Naavik identifies missing scene assembly and downstream production capabilities."
            - label: "Cross-border governance"
              detail: "Naavik flags regulatory challenges from cross-border positioning."
            - label: "Customer concentration"
              detail: "Customer totals are reported, but account concentration and renewals are unavailable."
        - label: "Medium impact"
          note: "Requires monitoring and control evidence."
          values:
            - label: "Billing friction"
              detail: "One trial-charge complaint is visible without a denominator."
            - label: "Peak-load reliability"
              detail: "Review evidence reports slow generation during peak demand."
            - label: "Provider concentration"
              detail: "Infrastructure counterparties and failover are not disclosed."
        - label: "Low-medium impact"
          note: "Likely manageable if controls and substitution paths are demonstrated."
          values:
            - label: "Support friction"
              detail: "User reports identify transfer and cancellation friction without prevalence data."
            - label: "Feature catch-up"
              detail: "Competitors may narrow creator-facing differentiation."
            - label: "Certification gap"
              detail: "No certification status was established in the assigned evidence."
        - label: "Impact depends on concentration"
          note: "Loss severity cannot be classified without denominator data."
          values:
            - label: "Customer renewal"
              detail: "The company reports organizational adoption but not renewal or top-account concentration."
            - label: "Platform migration"
              detail: "Portable exports may mitigate workflow-platform changes, but replacement testing is unavailable."
            - label: "Capital availability"
              detail: "Financing size is reported, while cash, burn, commitments, and runway are not."
        - label: "Unclassified impact"
          note: "Insufficient public evidence prevents a defensible impact rating."
          values:
            - label: "Complaint prevalence"
              detail: "Anecdotes have no user, job, or transaction denominator."
            - label: "Rights-claim frequency"
              detail: "Sector precedent exists, but no Meshy-specific claims history was established."
            - label: "Incident loss"
              detail: "No incident history, insurance notice, or quantified loss evidence was available."
    approximationNotes: "Qualitative analyst classification from the assigned sources; no probability, frequency, or loss magnitude was reported."
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Evidence is not incident clearance
    body: No assigned source verifies a Meshy lawsuit, breach, enforcement action, or outage, but the evidence set is insufficient to conclude that none exists.
    claimRefs: [CR008]
  - calloutType: recommendation
    title: Investment gating package
    body: Require audited ARR-to-cash reconciliation, cohort retention, workload-level margins, production acceptance, security controls, data-rights provenance, and concentration data before treating financing as risk reduction.
    claimRefs: [CR007, CR009, CR010, CR011, CR012, CR015]
