chapter:
  number: 4
  title: Financials
  summary: Meshy presents unusually rapid ARR growth and a large 2026 financing, but the available evidence is company-reported, inconsistent across publications, and insufficient to underwrite margins, cash burn, retention, or runway.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Meshy appears to monetize a product-led 3D-generation platform spanning text-to-3D,
      image-to-3D, texturing, animation, API workflows, and 3D-printing use cases. Public
      descriptions support a mixed customer base ranging from individual creators and
      educators to game studios, film teams, manufacturers, and enterprise accounts. The
      strongest current revenue signal is the company's reported ARR milestone: Dealroom
      and Pulse2 both report more than $100 million in ARR in 2026, while Naavik reports
      earlier company-reported ARR of $15 million in November 2025, $30 million in March
      2026, and $40 million in April 2026. These figures imply rapid expansion, but they
      are not audited revenue, cash receipts, or proof of recurring gross profit. The
      allstardiscounts account explicitly says the ARR figure has not been independently
      verified and notes a separate valuation discrepancy. Registered users, generated
      models, and company/customer counts are useful adoption proxies, not substitutes
      for paid conversion, cohort retention, realized price, or revenue concentration.
      The monetization table therefore separates reported metrics from unavailable
      underwriting inputs rather than converting usage into revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The available evidence indicates that Meshy is selling compute-intensive generation
      into workflows where speed and production readiness can support paid usage, but it
      does not disclose the cost stack needed to test that thesis. TechFundingNews repeats
      a company-linked estimate of roughly one dollar per generated model, while Naavik
      reports an 85% gross-margin figure and labels the underlying metrics company-reported.
      Neither source supplies the denominator, accounting policy, inference mix, storage,
      support, moderation, third-party model, or customer-success costs needed to reproduce
      the margin. Meshy's product surface also includes mobile, API, enterprise, and
      printing workflows, so unit economics may differ materially by plan and workload.
      Public review evidence describes free and paid tiers and usage/output restrictions,
      but does not establish realized price or discounting. Consequently, a plausible
      monetization mechanism exists, yet CAC, payback, gross margin by segment, usage
      elasticity, and net revenue retention remain diligence items. The unit economics
      table records those unknowns explicitly and identifies the data required to close
      each gap.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Meshy closed a nearly $400 million Series B at a reported $1.5 billion valuation in
      July 2026, with proceeds described as supporting model research, algorithmic
      infrastructure, and global enterprise sales. The financing provides a meaningful
      disclosed capital event, but it is not evidence of cash currently available: the
      sources do not provide post-money cash, current burn, debt, committed obligations,
      runway, or the portion already spent. EquityZen's page confirms that private-market
      financials and cap-table information are gated rather than publicly disclosed.
      Capital concentration is also relevant: TechFundingNews describes a China-linked
      investor roster and flags the need to confirm cross-border structure and procurement
      implications. The financial verdict is therefore positive on demonstrated commercial
      momentum and financing access, but cautious on revenue quality and capital efficiency.
      Underwriting should require monthly revenue and cash schedules, customer cohorts,
      usage-to-cost data, debt and vendor commitments, and a financing plan tied to the
      next-round trigger. Until those are supplied, the financing supports strategic
      capacity, not a quantified runway conclusion.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    figureRefs: [FI001]
callouts:
  - calloutType: strength
    title: Commercial momentum is visible
    body: Meshy's reported ARR, user, model-generation, and enterprise-adoption figures indicate meaningful scale, although they remain company-reported and not independently audited.
    claimRefs: [CI001, CI002, CI004]
  - calloutType: risk
    title: Financing is not runway
    body: The nearly $400 million Series B establishes financing capacity, but no retained source provides current cash, burn, debt, or runway; those omissions are material to underwriting.
    claimRefs: [CI010, CI012, CI013]
