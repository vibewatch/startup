      - number: '5.2'
        title: Modules, maturity, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The product surface is differentiated by combining several asset stages in one service: generation,
              texturing, print preparation, animation, and programmable access. Meshy’s reported 7.1 release and mobile
              workflow extend the surface, while the 3D Agent adds conversational iteration and the API provides a route
              into custom applications. These are meaningful workflow advantages, but most detailed performance,
              model-version, and customer-scale assertions in the assigned pool are company claims or secondary
              summaries. A buyer should therefore separate feature availability from repeatable production quality and
              require task-level acceptance tests for geometry, texture fidelity, licensing, and export behavior before
              standardizing on the platform.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
