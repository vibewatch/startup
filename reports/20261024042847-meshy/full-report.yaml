      - number: '1.2'
        title: Leadership, governance, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Publicly available material names Hu as the founder and CEO and describes his MIT doctoral background and
              creation of the Taichi GPU programming language. The assigned evidence does not provide a complete
              executive roster, board composition, option pool, or formal governance disclosures. That makes founder
              dependence a live diligence issue: the company’s technical narrative and product identity are closely
              associated with one person, while evidence about functional leadership is fragmentary. The funding record
              names IDG Capital, Matrix Partners China, Monolith Management, Granite Asia, HSG, BAI Capital, and Source
              Code Capital as investors or participants, but the sources do not establish control, liquidation
              preferences, secondary sales, or board rights. The investor map therefore separates disclosed
              participation from unknown governance economics.
