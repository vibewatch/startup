      - number: '1.3'
        title: Scale, funding, and milestone interpretation
        blocks:
          - type: paragraph
            body: >-
              Meshy announced nearly $400 million of Series B financing on July 21, 2026, at a $1.5 billion valuation,
              described as its first publicly disclosed valuation. A third-party funding report gives a valuation above
              $1.38 billion, while another assigned article cites a lower $970.6 million estimate without reconciling
              the methodologies. The company and syndicated coverage subsequently reported ARR above $100 million in
              September 2026, more than 15 million registered users, over 3,000 companies and educational institutions,
              and 100 million models; one independent article explicitly says the ARR figure is not independently
              verified. Earlier assigned material reported 12 million users and 12x year-over-year ARR growth in July,
              illustrating how quickly the disclosed figures changed. Revenue, valuation, and funding are distinct
              measures, and no assigned source establishes cash burn, runway, gross margin, or total capital on an
              audited basis.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
