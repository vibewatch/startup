      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates that Meshy is selling compute-intensive generation into workflows where
              speed and production readiness can support paid usage, but it does not disclose the cost stack needed to
              test that thesis. TechFundingNews repeats a company-linked estimate of roughly one dollar per generated
              model, while Naavik reports an 85% gross-margin figure and labels the underlying metrics company-reported.
              Neither source supplies the denominator, accounting policy, inference mix, storage, support, moderation,
              third-party model, or customer-success costs needed to reproduce the margin. Meshy's product surface also
              includes mobile, API, enterprise, and printing workflows, so unit economics may differ materially by plan
              and workload. Public review evidence describes free and paid tiers and usage/output restrictions, but does
              not establish realized price or discounting. Consequently, a plausible monetization mechanism exists, yet
              CAC, payback, gross margin by segment, usage elasticity, and net revenue retention remain diligence items.
              The unit economics table records those unknowns explicitly and identifies the data required to close each
              gap.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI012
              - CI013
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Meshy closed a nearly $400 million Series B at a reported $1.5 billion valuation in July 2026, with
              proceeds described as supporting model research, algorithmic infrastructure, and global enterprise sales.
              The financing provides a meaningful disclosed capital event, but it is not evidence of cash currently
              available: the sources do not provide post-money cash, current burn, debt, committed obligations, runway,
              or the portion already spent. EquityZen's page confirms that private-market financials and cap-table
              information are gated rather than publicly disclosed. Capital concentration is also relevant:
              TechFundingNews describes a China-linked investor roster and flags the need to confirm cross-border
              structure and procurement implications. The financial verdict is therefore positive on demonstrated
              commercial momentum and financing access, but cautious on revenue quality and capital efficiency.
              Underwriting should require monthly revenue and cash schedules, customer cohorts, usage-to-cost data, debt
              and vendor commitments, and a financing plan tied to the next-round trigger. Until those are supplied, the
              financing supports strategic capacity, not a quantified runway conclusion.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial momentum is visible
            body: >-
              Meshy's reported ARR, user, model-generation, and enterprise-adoption figures indicate meaningful scale,
              although they remain company-reported and not independently audited.
            calloutType: strength
            claimRefs:
