              - CI002
              - CI004
          - type: callout
            title: Financing is not runway
            body: >-
              The nearly $400 million Series B establishes financing capacity, but no retained source provides current
              cash, burn, debt, or runway; those omissions are material to underwriting.
            calloutType: risk
            claimRefs:
