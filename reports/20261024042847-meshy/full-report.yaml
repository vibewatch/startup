chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Meshy is described as an AI-powered 3D-generation platform for turning text, images, and sketches into
              models that can be used in games and increasingly in physical 3D printing. A public company profile
              identifies Ethan (Yuanming) Hu as founder and CEO, places the company in Sunnyvale, California, and dates
              its founding to 2021; a separate trade profile dates the founding to 2023, so the discrepancy should
              remain explicit rather than being silently resolved. The product surface includes text-to-3D, image-to-3D,
              texturing, rigging, APIs, and a conversational 3D Agent. Meshy says its output can move into Unity,
              Unreal, Blender, and common interchange formats. Independent product commentary supports the accessibility
              thesis but also notes that advanced customization is more limited than in high-end software.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
