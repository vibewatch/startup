      - number: '1.4'
        title: Diligence implications and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal is the combination of a large financing, broad reported usage, and a product
              that extends from generation into export, collaboration, and printing workflows. The principal
              underwriting caution is evidence quality: many scale and ARR figures originate with Meshy and are repeated
              by distributors, while the assigned independent review both flags unverified company metrics and
              identifies limitations in customization. Valuation is therefore anchored to a reported transaction, not to
              an independently audited revenue base. The chapter can establish identity, founder, product scope,
              financing event, and reported scale, but cannot establish cap-table control, board governance, retention,
              paid conversion, margins, cash runway, or the completeness of the leadership team. These gaps should
              remain visible in subsequent underwriting.
            claimRefs:
              - CO010
              - CO012
              - CO014
              - CO016
