      - - Bear
        - >-
          AI-3D generation is commoditized, customers treat Meshy as a feature, inference costs stay high, and
          enterprise adoption remains pilot-heavy.
        - A material down-round, preference overhang, or inability to finance growth can impair common-equity outcomes.
