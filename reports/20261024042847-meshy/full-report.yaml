              - CE003
              - CE005
          - type: callout
            title: Production-readiness gap
            body: >-
              The evidence supports faster draft creation, not autonomous delivery of optimized, reliable, secure, and
              fully production-ready assets.
            calloutType: risk
            claimRefs:
