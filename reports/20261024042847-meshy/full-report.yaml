              - CP007
              - CP010
      - number: '3.2'
        title: Capability, workflow, and pricing differentiation
        blocks:
          - type: paragraph
            body: >-
              Meshy's official product page describes text-to-3D in about a minute, PBR texturing, printability checks,
              remeshing, eight export formats, and direct Blender, Unity, and Unreal workflows. A third-party guide
              describes a broader chain covering generation, texturing, remeshing, rigging, animation, API access, and
              plugins, while noting that hard-surface geometry and complex prompt fidelity still require cleanup.
              Independent testing gives Meshy a niche around iteration speed and established Blender, Unity, and Unreal
              plugins, while ranking Rodin higher for production-ready geometry and Tripo higher for game-oriented
              workflow depth. Pricing evidence is not stable enough for a clean price leaderboard: an alternatives guide
              lists Meshy at $19 per month for 200 credits, while Meshy's own page states that each text-to-3D
              generation costs 20 credits and that plans and task pricing can change. That uncertainty itself raises
              switching and procurement friction for customers comparing output cost rather than headline subscription
              price.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Meshy's strongest apparent moat is workflow accumulation rather than a permanently unique generation
              model. The company-reported materials cited by third parties describe more than 15 million registered
              users, more than 3,000 companies and educational institutions, and more than 100 million generated models,
              but those metrics are company-reported and not independently audited in the cited coverage. Distribution
              and usage history can improve iteration, integrations, and habit formation, yet competitors can attack
              each layer: Rodin emphasizes geometry and multi-image fidelity, Tripo emphasizes game-ready topology and
              auto-rigging, aggregators reduce single-vendor lock-in, and open models appeal to buyers seeking control
              or lower marginal cost. A competitor-authored comparison says Meshy is locked to a single model and
              reports topology issues on some outputs, while an independent review says the right choice depends on
              which limitations a buyer is willing to accept. The durable question is whether Meshy can convert breadth
              and distribution into repeatable production quality without making customers pay for cleanup, retries, or
              a second specialist tool.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth is the clearest differentiation
            body: >-
              Meshy combines generation, refinement, export, and integrations in one browser workflow; that is more
              defensible for adoption than a single benchmark score, but only while output quality remains adequate for
              the buyer's downstream job.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Specialists and open alternatives cap pricing power
            body: >-
              Rodin, Tripo, Hunyuan3D, TRELLIS 2, Hitem3D, Luma AI, Stability AI, Blender, and multi-model aggregators
              give buyers credible ways to multi-home or bypass a single Meshy subscription.
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Meshy appears to monetize a product-led 3D-generation platform spanning text-to-3D, image-to-3D,
              texturing, animation, API workflows, and 3D-printing use cases. Public descriptions support a mixed
              customer base ranging from individual creators and educators to game studios, film teams, manufacturers,
              and enterprise accounts. The strongest current revenue signal is the company's reported ARR milestone:
              Dealroom and Pulse2 both report more than $100 million in ARR in 2026, while Naavik reports earlier
              company-reported ARR of $15 million in November 2025, $30 million in March 2026, and $40 million in April
              2026. These figures imply rapid expansion, but they are not audited revenue, cash receipts, or proof of
              recurring gross profit. The allstardiscounts account explicitly says the ARR figure has not been
              independently verified and notes a separate valuation discrepancy. Registered users, generated models, and
              company/customer counts are useful adoption proxies, not substitutes for paid conversion, cohort
              retention, realized price, or revenue concentration. The monetization table therefore separates reported
              metrics from unavailable underwriting inputs rather than converting usage into revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
