        - Verified retention or margin materially below underwriting expectations.
      - - Base
        - >-
          Usage remains strong, monetization improves, but competition and output cleanup constrain pricing; financing
          terms remain opaque.
        - Track the company and wait for a price or evidence reset rather than target a return from the headline mark.
        - 'Medium: consistent with the mixed evidence and conflicting reports.'
