  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and user workflow
        blocks:
          - type: paragraph
            body: >-
              Meshy’s customer-facing product is a self-serve creation workflow rather than a conventional 3D editor.
              Sources describe text-to-3D, image-to-3D, AI texturing, remeshing, rigging, animation, and exports for
              game, design, AR/VR, and printing workflows. The practical user journey is prompt or image input, model
              generation, refinement or repair, and export into another tool or slicer. That breadth reduces the skill
              barrier for game developers, artists, designers, educators, and hobbyists, while leaving the final
              production step with the customer. Independent descriptions consistently frame the tool as an accelerator
              for blockout and asset creation, not evidence that it replaces topology, scale, or in-engine quality
              control.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
