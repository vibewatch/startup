  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand logic
        blocks:
          - type: paragraph
            body: >-
              The relevant market is software and API-enabled creation of 3D assets from text, images, or sketches,
              including mesh generation, texturing, remeshing, rigging, animation, and workflow integrations. It
              excludes the full spend on downstream game production, CAD systems, physical printers, cloud
              infrastructure, and bespoke human art services except where those budgets are displaced or accelerated by
              the software. This boundary matters because Meshy's actual job is to compress early and middle pipeline
              work, not to replace every production tool. Design News records Meshy's framing that “the gap between
              demand for 3D content and the cost of producing it” is the core problem, while Naavik describes a workflow
              spanning asset generation, texturing, rigging, optimization, and API access. The practical substitutes are
              Blender/Maya workflows, outsourced artists, internal art teams, and open or research-led models. A buyer
              therefore compares usable output, cleanup burden, rights, integrations, and throughput, not merely a model
              demo.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The strongest available sizing evidence is a set of non-comparable lenses. GII Research projects the AI 3D
              asset generation and texturing market to reach $12.84 billion by 2036 at a 20.8% CAGR, but this is a
              paid-report forecast with a broad global scope. MarketsandMarkets places the adjacent metaverse market at
              $83.9 billion in 2023 and over $1,303.4 billion by 2030 at a 48.0% CAGR; that is an ecosystem estimate,
              not Meshy's serviceable software market. The Business Research Company reports $2.96 billion of expected
              five-year market gain for deterministic generative AI in gaming and $0.81 billion for nondeterministic
              techniques, another adjacent lens. These figures establish category tailwinds, not SAM or SOM. A
              constrained serviceable market should instead start with reachable workflows—game props, product
              visualization, 3D printing, XR, VFX previsualization, and education— then apply buyer budget, required
              quality, geography, and integration constraints. No assigned source isolates Meshy's SAM or verified
              conversion from registered users to paid revenue, so any precise SOM would be speculative.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Buyer ownership differs by segment. In game studios, art or production leadership can fund tools that
              reduce prop and prototype cycle time, while technical artists and designers are the daily users. In 3D
              printing, individual creators or small businesses pay for credits and print-ready output; in product
              design, innovation or engineering teams own the budget but still hand off to CAD for mechanical
              interfaces. XR, ecommerce, VFX, and education are adjacent demand pools with different procurement and
              quality thresholds. The adoption trigger is measurable throughput: Design News reports Meshy generation
              moving from weeks and about $1,000 to minutes and around $1, while Naavik cites a Room8 report of 10–15%
              faster prop production and 30–40% savings on low-poly optimization. Constraints remain material: Naavik
              says Meshy lacks scene assembly and several downstream production tools; the Business Research Company
              identifies computational cost, copyright and privacy uncertainty, and inconsistent AI output as adoption
              restraints. The market can grow rapidly while enterprise penetration remains gated by cleanup, provenance,
              and workflow fit.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting implication
            body: >-
              The market opportunity is credible but should be valued as segmented workflow software with expansion
              options, not as a claim on the full metaverse or gaming economy. The key diligence variable is paid
              workflow adoption and retention by buyer segment.
            calloutType: insight
            claimRefs:
              - CM008
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Meshy's competitive set is broader than direct text-to-3D peers. Independent testing identified
              Hyper3D/Rodin, Tripo, Hunyuan3D, TRELLIS 2, Hitem3D, Luma AI, and Stability AI as alternatives with
              different tradeoffs in production readiness, topology, openness, capture, printing, and speed. Blender is
              a durable status-quo and internal-build substitute: its official site describes a free and open-source
              project with modeling, sculpting, UV, VFX, animation, rigging, and Python extensibility. A buyer can
              therefore choose a general workflow platform, a specialist model, an open/self-hosted stack, a traditional
              DCC, or a human-in-the-loop production service. The market is segmented by the downstream job: game assets
              prioritize topology and rigging; product visualization prioritizes fidelity; printing prioritizes
              watertight geometry and slicer success; and studios may prioritize API and pipeline integration. A
              separate technology publication names Tripo and Rodin as direct competitors and identifies Meshy's
              distribution as its current advantage.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
