  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Meshy’s observable product stack runs from creator inputs through hosted generation and post-processing to exports
      and customer-side production validation.
    data:
      layers:
        - name: Reference preparation
          label: Reference preparation
          detail: Users select prompts or visual references before submitting a generation task.
          items:
            - Prompt and image selection
            - Reference mesh upload
        - name: Inputs
          label: Inputs
          detail: Creator-provided prompts, images, sketches, and uploaded meshes enter the hosted workflow.
          items:
            - Text prompts
            - Images and sketches
            - Uploaded meshes
        - name: Generation
          label: Generation
          detail: Hosted multimodal generation produces a 3D asset from text or visual input.
          items:
            - Text-to-3D
            - Image-to-3D
            - 3D Agent
        - name: Enhancement
          label: Enhancement
          detail: Post-processing features add materials, repair, remeshing, rigging, or animation.
          items:
            - AI texturing
            - Remeshing and repair
            - Rigging and animation
        - name: Delivery
          label: Delivery
          detail: API access and interchange exports move assets into downstream applications or printers.
          items:
            - API access
            - FBX / GLB / OBJ exports
            - STL / USDZ / 3MF exports
        - name: Customer production
          label: Customer production
          detail: Customer-side operators validate topology, scale, materials, and target-engine or slicer behavior.
          items:
            - Retopology
            - Normal baking and scale checks
            - Engine or slicer validation
