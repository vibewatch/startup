      - number: '5.3'
        title: Architecture, deployment, and trust risks
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is a hosted generation layer with web access, API integration, model and
              post-processing stages, and downloadable interchange formats. This makes integration comparatively
              straightforward, but it also creates dependency on Meshy’s service availability, model-version
              compatibility, credit limits, and export semantics. Practitioner evidence says generated meshes still
              require retopology, normal baking, scale checks, and engine validation for XR use. The assigned evidence
              does not establish uptime, incident history, security certifications, data-retention controls, enterprise
              isolation, or a complete change-management contract. Those are material diligence gaps for teams placing
              proprietary references or automated production pipelines on the service.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Product verdict
        blocks:
          - type: paragraph
            body: >-
              Meshy appears strongest where a user needs many plausible 3D drafts quickly, especially when a team values
              a single workflow spanning generation, texturing, rigging, printing, and API export. Its strategic risk is
              not lack of features; it is the gap between fast generation and dependable, finished production output.
              Competitive comparisons place Meshy behind faster or more specialized alternatives on some dimensions, and
              the evidence base does not independently verify the most ambitious quality, scale, or reliability claims.
              Adoption should therefore be staged around representative assets, explicit polygon and texture budgets,
              reproducible exports, and documented data-governance terms.
            claimRefs:
              - CE002
              - CE007
              - CE010
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product strength
            body: >-
              Meshy compresses several 3D asset steps into one accessible workflow, with API and standard-format export
              paths that can fit existing creative pipelines.
            calloutType: insight
            claimRefs:
