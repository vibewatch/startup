schemaVersion: "report-v2"
artifact: customers
slug: meshy
runDate: 2026-10-24
company:
  name: Meshy
chapter:
  number: 6
  title: Customers
  summary: Meshy's customer evidence spans individual creators, game and creative teams, education, and 3D-printing workflows. Public sources indicate rapid top-of-funnel scale and several named deployments or partner workflows, but do not establish active usage, paid conversion, retention, or customer-level revenue concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and use-case segmentation
    body: >-
      Meshy presents a broad, self-serve customer surface rather than a single
      vertical. An independent review names game developers, 3D artists, AR/VR
      creators, animation studios, product designers, 3D-printing enthusiasts,
      and educational institutions as intended users. The product-directory
      description similarly frames the tool for game developers, designers,
      makers, and indie developers. These are user or workflow segments, not
      proof of paid accounts or recurring revenue. Naavik reports that Meshy
      serves gaming, academia, XR, and 3D printing, with most gaming clients
      described as mobile studios and at least one AAA developer named. The
      resulting customer mix appears diversified by use case, but the public
      record does not disclose segment-level bookings, conversion, or revenue
      bands.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption scale and durability
    body: >-
      Public adoption indicators are large but heterogeneous. Meshy's April
      2026 guide described more than 10 million creators, Naavik reports 12
      million registered users and more than 100 million models by July, and
      Pulse2 reports more than 15 million registered users, over 3,000
      companies and educational institutions, and more than 100 million models
      by October. Registered users and generated models are cumulative
      top-of-funnel measures; they are not active customers, paid accounts,
      retention, or revenue. Small marketplace signals - a 4.2/5 average from
      nine ratings and 172 upvotes - are directionally positive but not
      comparable to registrations or paid usage. The sources therefore support
      momentum, not a quantified durability conclusion. No assigned source
      supplies NRR, GRR, churn, renewal rates, contract length, cohort
      retention, or a paid conversion denominator.
    claimRefs: [CU002, CU004, CU005, CU006, CU007, CU008, CU015, CU016]
    tableRefs: [TU002]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and concentration
    body: >-
      Named proof is present but uneven. A customer-reference directory lists
      university use cases, while 3D Printing Industry reports a Formlabs
      manufacturing integration that connects generation to physical
      production. Naavik also names Square Enix among Meshy's customers and
      identifies NetEase Games, FunPlus, and 37 Interactive Entertainment as
      China-based clients, but this is still reported evidence rather than
      audited customer-level usage. The partner workflow suggests an expansion
      path from asset creation into printing and hardware ecosystems, yet no
      source quantifies expansion revenue, attach rates, procurement duration,
      account-level concentration, or whether named relationships are
      production deployments versus pilots. A skeptical review source flags
      limited advanced customization, plan restrictions, peak-demand delays,
      and competition as practical adoption risks.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation by buyer, user, and workflow
    columns: [Segment, Buyer or user, Use case, Public scale or value signal, Diligence gap]
    rows:
      - [Individual creators and 3D artists, Creator or maker, Rapid asset ideation and export, "Independent review names creators and 3D artists; no paid-user count disclosed", "Paid conversion, repeat usage, and creator retention"]
      - ["Game and creative teams", "Studio or production team", "Game assets, animation, AR/VR, and film workflows", "Naavik reports gaming, XR, and creative-industry use; Square Enix is named", "Production deployment, spend, and outcome metrics by account"]
      - [Education, University or institution, Teaching and student Unity or 3D-scene workflows, "Featuredcustomers lists Istanbul Topkapı University and Southeast Bangkok University references", "Contract status, seat counts, renewals, and institution-wide adoption"]
      - ["3D printing and hardware ecosystem", "Consumer, maker, or hardware partner", "Photo or prompt to printable model and physical manufacturing", "3D Printing Industry reports Formlabs integration and other hardware ecosystem activity", "Order conversion, print-failure rate, partner economics, and repeat orders"]
    notes: "Sources combine independent reviews, a customer-reference directory, an industry report, and company-reported positioning; public segment revenue and active-account denominators are unavailable."
    claimRefs: [CU001, CU002, CU003, CU009, CU010]
  - id: TU002
    title: Public adoption and usage trajectory
    columns: [Metric, Value, Date or period, Source posture, Implication, Missing denominator]
    rows:
      - [Creators, "10M+", "2026-04-23", "Meshy company guide", "Large awareness and top-of-funnel reach", "Registered creators; no active-user, paid-user, geography, or cohort denominator"]
      - [Registered users, "12 million", "2026-07", "Naavik report citing company-reported scale", "Rapid acquisition and broad creator reach", "Monthly active users, conversion, and churn"]
      - [Registered users, "More than 15 million", "2026-10", "Pulse2 report citing Meshy statements", "Continued reported growth versus July", "Active accounts, paid mix, and duplicate or dormant accounts"]
      - [Generated models, "More than 100 million", "By 2026-07 and reiterated in 2026-10 reporting", "Naavik and Pulse2 reporting", "High cumulative creation volume", "Models per active user, commercial-use rate, and repeat-generation cohorts"]
      - [Companies and educational institutions, "More than 3,000", "2026-10", "Pulse2 report citing Meshy statements", "Evidence of an organizational customer surface", "Named-account list, paid status, ACV, and concentration"]
      - [Directory rating, "4.2 / 5 from 9 ratings", "Accessed 2026-10-24", "There's An AI For That", "Directionally positive sentiment", "Nine-rating sample is too small for cohort inference"]
      - [Directory upvotes, "172", "Accessed 2026-10-24", "Future Tools", "Some marketplace discovery engagement", "Upvotes are not users, customers, retention, or willingness to pay"]
    notes: "Values are not directly comparable measures: creators and registered users are accounts, models are cumulative creations, the 3,000 figure combines companies with educational institutions, and directory engagement uses different denominators. None establishes active or paying customers."
    claimRefs: [CU002, CU004, CU005, CU006, CU007, CU008, CU015, CU016]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or relationship, Segment, Deployment or use case, Production versus pilot, Outcome or scale signal, Limitation]
    rows:
      - [Istanbul Topkapı University, Education, Students build AI-generated Unity scenes, "Customer-reference entry; deployment stage not stated", "Directory title says 40 students participated", "No contract value, renewal, duration, or learning-outcome metric"]
      - [Southeast Bangkok University, Education, Converts 2D sketches into 3D models for student workflows, "Customer-reference entry; deployment stage not stated", "Directory title says models were produced in under a minute", "No participant count, contract value, renewal, or learning-outcome metric"]
      - [Formlabs / Form Now, Manufacturing partner, Connects Meshy generation to professional physical manufacturing, "Partnership and workflow integration reported; customer purchase volume not stated", "Reported end-to-end path from prompt or photo to manufactured part", "Internal 97% slicer-pass figure is not independently verified and no order cohort is disclosed"]
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer and partner references found in the assigned June-October 2026 source pool; not a complete customer list."
    notes: "Rows are a partial public-reference sample. The directory and industry report do not disclose account economics or retention, and the Formlabs workflow includes company-provided performance language."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from creation to expansion
    type: journey-map
    summary: "Meshy's public customer journey runs from creator discovery through asset generation, workflow deployment, organizational adoption, and physical-output or partner expansion."
    data:
      items:
        - label: Discovery
          detail: "Creators, makers, students, and studios encounter a browser-based AI 3D workflow."
          touchpoints: ["Text or image input", "Self-serve access", "Education and creator use cases"]
        - label: First asset
          detail: "Users generate a textured model and inspect or export it."
          touchpoints: ["Text-to-3D", "Image-to-3D", "Exports to common 3D tools"]
        - label: Workflow fit
          detail: "Teams test the output in games, animation, XR, product design, or printing."
          touchpoints: ["Game and creative pipelines", "Unity scenes", "3D-printing workflows"]
        - label: Organizational adoption
          detail: "Reported company and education relationships broaden usage beyond individual creators."
          touchpoints: ["More than 3,000 companies and educational institutions reported", "Named university references"]
        - label: Expansion
          detail: "Partner integrations connect generation to physical manufacturing and hardware ecosystems."
          touchpoints: ["Formlabs / Form Now", "Hardware ecosystem integrations"]
        - label: Durability test
          detail: "The public record does not yet show retention, expansion revenue, or account concentration."
          touchpoints: ["NRR and GRR not disclosed", "Paid conversion and renewal cohorts not disclosed"]
    claimRefs: [CU001, CU004, CU008, CU009, CU010, CU013]
callouts:
  - calloutType: strength
    title: Broad adoption surface
    body: "Meshy has public evidence across creator, studio, education, and 3D-printing workflows, reducing reliance on a single stated use case."
    claimRefs: [CU001, CU002, CU003, CU009]
  - calloutType: risk
    title: Scale is not durability
    body: "Reported users, registered users, generated models, and organizational counts do not establish active paid accounts, retention, expansion, or concentration."
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU013]
