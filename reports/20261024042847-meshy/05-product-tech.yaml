chapter:
  number: 5
  title: Product & Technology
  summary: Meshy is a browser-first generative-3D workflow that converts text and images into editable, textured assets and exposes API and export paths for downstream tools. Evidence supports broad workflow coverage and improving model capability, but independent proof of production reliability, security controls, and finished-asset quality remains limited.
sections:
  - id: product-workflow
    title: Product and user workflow
    body: >-
      Meshy’s customer-facing product is a self-serve creation workflow rather than a conventional 3D editor. Sources describe text-to-3D, image-to-3D, AI texturing, remeshing, rigging, animation, and exports for game, design, AR/VR, and printing workflows. The practical user journey is prompt or image input, model generation, refinement or repair, and export into another tool or slicer. That breadth reduces the skill barrier for game developers, artists, designers, educators, and hobbyists, while leaving the final production step with the customer. Independent descriptions consistently frame the tool as an accelerator for blockout and asset creation, not evidence that it replaces topology, scale, or in-engine quality control.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: product-maturity
    title: Modules, maturity, and differentiation
    body: >-
      The product surface is differentiated by combining several asset stages in one service: generation, texturing, print preparation, animation, and programmable access. Meshy’s reported 7.1 release and mobile workflow extend the surface, while the 3D Agent adds conversational iteration and the API provides a route into custom applications. These are meaningful workflow advantages, but most detailed performance, model-version, and customer-scale assertions in the assigned pool are company claims or secondary summaries. A buyer should therefore separate feature availability from repeatable production quality and require task-level acceptance tests for geometry, texture fidelity, licensing, and export behavior before standardizing on the platform.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
  - id: operating-risks
    title: Architecture, deployment, and trust risks
    body: >-
      The observable architecture is a hosted generation layer with web access, API integration, model and post-processing stages, and downloadable interchange formats. This makes integration comparatively straightforward, but it also creates dependency on Meshy’s service availability, model-version compatibility, credit limits, and export semantics. Practitioner evidence says generated meshes still require retopology, normal baking, scale checks, and engine validation for XR use. The assigned evidence does not establish uptime, incident history, security certifications, data-retention controls, enterprise isolation, or a complete change-management contract. Those are material diligence gaps for teams placing proprietary references or automated production pipelines on the service.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
  - id: product-verdict
    title: Product verdict
    body: >-
      Meshy appears strongest where a user needs many plausible 3D drafts quickly, especially when a team values a single workflow spanning generation, texturing, rigging, printing, and API export. Its strategic risk is not lack of features; it is the gap between fast generation and dependable, finished production output. Competitive comparisons place Meshy behind faster or more specialized alternatives on some dimensions, and the evidence base does not independently verify the most ambitious quality, scale, or reliability claims. Adoption should therefore be staged around representative assets, explicit polygon and texture budgets, reproducible exports, and documented data-governance terms.
    claimRefs: [CE002, CE007, CE010, CE013, CE014]
callouts:
  - calloutType: insight
    title: Product strength
    body: >-
      Meshy compresses several 3D asset steps into one accessible workflow, with API and standard-format export paths that can fit existing creative pipelines.
    claimRefs: [CE001, CE003, CE005]
  - calloutType: risk
    title: Production-readiness gap
    body: >-
      The evidence supports faster draft creation, not autonomous delivery of optimized, reliable, secure, and fully production-ready assets.
    claimRefs: [CE010, CE011, CE012, CE013]
