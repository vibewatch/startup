callouts:
  - calloutType: strength
    title: Technical founder and product expansion
    body: "Meshy's public narrative combines a technically credentialed founder with a product that spans generation, APIs, games, and 3D printing workflows."
    claimRefs: [CO002, CO006, CO004]
  - calloutType: risk
    title: Scale metrics require verification
    body: "ARR, users, and customer counts are primarily company-reported or syndicated, and the assigned independent coverage explicitly notes that the figures are not independently verified."
    claimRefs: [CO013, CO014, CO016]
  - calloutType: recommendation
    title: Underwrite the transaction, not the headline
    body: "Treat the $1.5B valuation as a reported financing reference point while requiring cap-table, financial-quality, retention, and runway evidence before relying on the headline growth rates."
    claimRefs: [CO010, CO011, CO016]
