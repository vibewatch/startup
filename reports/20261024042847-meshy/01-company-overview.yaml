company:
  name: Meshy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Meshy is a Silicon Valley AI 3D-generation company founded by Ethan Hu that
    converts text, images, and sketches into production-oriented 3D assets. The
    July 2026 financing established a publicly reported $1.5 billion valuation,
    while later ARR and user disclosures are company claims with uneven
    independent corroboration.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: >-
      Meshy is described as an AI-powered 3D-generation platform for turning
      text, images, and sketches into models that can be used in games and
      increasingly in physical 3D printing. A public company profile identifies
      Ethan (Yuanming) Hu as founder and CEO, places the company in Sunnyvale,
      California, and dates its founding to 2021; a separate trade profile dates
      the founding to 2023, so the discrepancy should remain explicit rather
      than being silently resolved. The product surface includes text-to-3D,
      image-to-3D, texturing, rigging, APIs, and a conversational 3D Agent.
      Meshy says its output can move into Unity, Unreal, Blender, and common
      interchange formats. Independent product commentary supports the
      accessibility thesis but also notes that advanced customization is more
      limited than in high-end software.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder map
    body: >-
      Publicly available material names Hu as the founder and CEO and describes
      his MIT doctoral background and creation of the Taichi GPU programming
      language. The assigned evidence does not provide a complete executive
      roster, board composition, option pool, or formal governance disclosures.
      That makes founder dependence a live diligence issue: the company’s
      technical narrative and product identity are closely associated with one
      person, while evidence about functional leadership is fragmentary. The
      funding record names IDG Capital, Matrix Partners China, Monolith
      Management, Granite Asia, HSG, BAI Capital, and Source Code Capital as
      investors or participants, but the sources do not establish control,
      liquidation preferences, secondary sales, or board rights. The investor
      map therefore separates disclosed participation from unknown governance
      economics.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: scale-funding-and-milestones
    title: Scale, funding, and milestone interpretation
    body: >-
      Meshy announced nearly $400 million of Series B financing on July 21,
      2026, at a $1.5 billion valuation, described as its first publicly
      disclosed valuation. A third-party funding report gives a valuation above
      $1.38 billion, while another assigned article cites a lower $970.6 million
      estimate without reconciling the methodologies. The company and
      syndicated coverage subsequently reported ARR above $100 million in
      September 2026, more than 15 million registered users, over 3,000
      companies and educational institutions, and 100 million models; one
      independent article explicitly says the ARR figure is not independently
      verified. Earlier assigned material reported 12 million users and 12x
      year-over-year ARR growth in July, illustrating how quickly the disclosed
      figures changed. Revenue, valuation, and funding are distinct measures,
      and no assigned source establishes cash burn, runway, gross margin, or
      total capital on an audited basis.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
  - id: diligence-implications
    title: Diligence implications and unresolved gaps
    body: >-
      The strongest positive signal is the combination of a large financing,
      broad reported usage, and a product that extends from generation into
      export, collaboration, and printing workflows. The principal underwriting
      caution is evidence quality: many scale and ARR figures originate with
      Meshy and are repeated by distributors, while the assigned independent
      review both flags unverified company metrics and identifies limitations in
      customization. Valuation is therefore anchored to a reported transaction,
      not to an independently audited revenue base. The chapter can establish
      identity, founder, product scope, financing event, and reported scale, but
      cannot establish cap-table control, board governance, retention, paid
      conversion, margins, cash runway, or the completeness of the leadership
      team. These gaps should remain visible in subsequent underwriting.
    claimRefs: [CO010, CO012, CO014, CO016]
