      - [Workflow integration, "Exports to FBX, OBJ, GLB, USDZ, STL, BLEND, 3MF, and DXF; direct Blender, Unity, and Unreal paths", "Independent testing also cited established Meshy plugins, while open tools trade convenience for control", "Integration and switching costs can support retention"]
      - [Rigging and animation, "Third-party guide describes auto-rigging and animation in the broader workflow", "Tripo was reported to offer auto-rigging; Rodin auto-rigging was reported as coming soon", "Specialist capability can narrow Meshy's breadth advantage"]
      - [API and automation, "Third-party guide describes API access and plugins", "Independent comparison ranks Tripo highly for API access; open models offer technical control", "Enterprise diligence should include reliability, limits, and support terms"]
    notes: "Cells summarize source-backed capabilities; unsupported relative scores are intentionally omitted. Product features and competitor capabilities can change quickly."
    claimRefs: [CP001, CP002, CP004, CP005, CP006]
  - id: TP003
    title: Pricing and packaging signals
    columns: [Offer or tool, Published price or model, Included or stated capability, Confidence and limitation]
    rows:
      - [Meshy, "$19/month for 200 credits in a competitor-authored comparison", "Single-model access with Blender, Unity, and Unreal plugins described", "Medium; competitor-authored and should be checked against current checkout"]
      - [Meshy official text-to-3D, "20 credits per generation", "About one minute generation, PBR mesh, printability checks, eight export formats", "High for the cited official page; plan pricing is not specified"]
      - [Rodin/Hyper3D, "Free to generate and pay to download in an independent test", "Production-ready geometry and multi-image fusion were reported", "Medium; one tester's April 2026 observation, not a contract quote"]
      - [Tripo AI, "From $11.94/month in an independent test", "Clean quad topology and auto-rigging were reported", "Medium; tester-reported and time-sensitive"]
      - [Blender, "Free and open source", "Modeling, VFX, animation, rigging, and Python extensibility", "High for the official project description; labor and workflow cost are not quantified"]
    notes: "Prices are list or observed plan signals, not realized revenue, gross margin, or total cost of ownership. Credit consumption, quality, support, and labor can dominate headline price."
    claimRefs: [CP006, CP007, CP008, CP011]
