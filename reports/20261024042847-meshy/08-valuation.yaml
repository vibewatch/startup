schemaVersion: "report-v2"
artifact: valuation
slug: meshy
runDate: 2026-10-24
company:
  name: Meshy
chapter:
  number: 8
  title: Valuation
  summary: Meshy has credible category traction and a disclosed $1.5B valuation, but public evidence does not establish revenue quality, margins, retention, or a defensible moat at that price. The evidence therefore supports tracking rather than buying, with a high bar for entry and explicit financing, unit-economics, and commercialization diligence.
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is unusually concrete for an AI-3D application company. A July 2026
      financing release says Meshy raised nearly $400M in Series B capital at a $1.5B valuation,
      while the same release reports annual recurring revenue growing about 12x year over year,
      more than 12M registered users, and over 100M models created. A later October account reports
      more than $100M ARR and more than 15M registered users, but explicitly says the ARR was based
      on company reporting and had not been independently verified. That distinction matters:
      ARR is not cash generation, and registered users are not paying customers. Independent
      product testing is also more qualified than a marketing claim: one 2026 comparison ranked
      Tripo first overall and called Meshy the best mainstream self-serve alternative, while
      describing the category as immature and warning that generated assets may still need cleanup.
      Meshy can therefore have real adoption and a strong product position without the public
      record proving durable pricing power.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: price-and-scenarios
    title: Price sensitivity and scenarios
    body: >-
      The financing headline implies a simple 15x valuation-to-ARR ratio if the $100M ARR figure
      is used, but that is a cross-source calculation rather than an audited company metric and
      should not be treated as a market-standard multiple. The July release instead says ARR was
      growing about 12x year over year without giving a dollar denominator. Earlier coverage cited
      roughly $40M ARR, and another assigned source reports a lower $970.6M valuation, so the
      available record contains both metric and valuation disagreement. Sacra's Baseten estimate
      implies roughly 21.7x annualized revenue, but AI inference infrastructure is not an
      apples-to-apples benchmark for creative software. A defensible underwriting range must
      therefore be scenario-based: the bull case requires verified conversion, retention, gross
      margin, and expansion; the base case assumes strong usage but incomplete proof of
      monetization and continued competition; the bear case assumes the category remains a
      workflow feature with pricing pressure and a financing reset. The public pool does not
      independently verify preference, dilution, burn, or runway inputs, so a target return or
      precise entry price would be false precision.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation and diligence path
    body: >-
      The appropriate decision is track, with a stretched valuation stance and high risk rating.
      The call is price-sensitive: a buyer should not underwrite the $1.5B mark from user counts,
      a press release, or an unverified ARR claim alone. The most important diligence is to obtain
      monthly recurring revenue by cohort, paid conversion from the registered-user base, gross
      margin after model-inference costs, retention or NRR, CAC payback, enterprise contract
      concentration, and a fully diluted cap table showing liquidation preferences and the actual
      financing consideration. Commercial diligence should test whether production-ready output
      claims survive independent customer workflows, because a 2026 reviewer lists topology,
      character consistency, and additional professional editing as limitations. The thesis breaks
      if verified retention is weak, inference costs prevent durable gross margin, major customers
      remain pilots, or a new round prices materially below $1.5B. Conversely, verified net
      retention, audited ARR quality, and repeat enterprise expansion could justify revisiting the
      stance.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: []
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits distinguish reported facts from analyst inference and keep unlike valuation
      references separate. The flow is a reasoning aid, not a computed valuation model: it shows
      how evidence quality, commercialization proof, and price discipline lead to the recommendation.
      It should be read alongside the scenario assumptions rather than as a claim that the
      reported user base converts to revenue at any particular rate. The recommendation remains
      conditional because the evidence does not disclose the financing preference stack, cash
      runway, or customer-level retention needed to translate category momentum into common-equity
      value. This separation prevents a large financing headline from being mistaken for proof of
      durable margins or a guaranteed exit.
    claimRefs: [CV006, CV011]
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track, "Disclosed financing and adoption are promising, but revenue quality and unit economics are not independently established.", "Wait for verification before underwriting an entry."]
      - [Confidence, medium, "Multiple sources corroborate the round and product traction; ARR and valuation marks conflict or rely on company reporting.", "Confidence can rise with audited operating metrics."]
      - [Risk rating, high, "Competition, workflow limitations, cross-border governance, and financing uncertainty remain material.", "Require downside protection and milestone-based diligence."]
      - [Valuation stance, stretched, "The $1.5B mark is substantial relative to the public evidence; a precise multiple is not supportable.", "Do not buy at the headline price without stronger proof."]
    notes: "Assessment is analytical; cited operating metrics are reported by company or third parties and are not treated as audited cash flow or profit."
    claimRefs: [CV001, CV003, CV007, CV011, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Category leadership and usage scale", "The July release reports 12M+ registered users and 100M+ models; October coverage reports 15M+ users and 3,000+ organizations.", "Cohort-level paid conversion and repeat usage would validate economic scale."]
      - ["Financing validates investor demand", "The July 2026 Series B was reported at nearly $400M and a $1.5B valuation.", "Independent financing documents and preference terms would validate the mark."]
      - ["Product is not yet a complete moat", "Independent testing ranked Tripo first overall and called Meshy a mainstream self-serve alternative; another review cites topology and refinement limitations.", "Evidence of superior production yield, retention, and workflow ownership would strengthen defensibility."]
      - ["Down-round and multiple-compression risk", "A separate assigned account cites a $970.6M valuation and says the discrepancy is unexplained.", "Reconciled valuation marks, audited ARR, and a profitable or financeable cost structure would reduce the risk."]
    notes: "This table separates the thesis from its falsification conditions; company-reported adoption is not treated as independently verified revenue."
    claimRefs: [CV001, CV003, CV005, CV008, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "ARR is verified, paid conversion and retention are strong, gross margin supports scaling, and Meshy expands from asset generation into durable workflow infrastructure.", "A higher valuation could be supported by verified growth and quality; no precise range is assigned because public inputs are incomplete.", "Low-to-medium: product traction is visible but the required operating proof is not.", "Verified retention or margin materially below underwriting expectations."]
      - [Base, "Usage remains strong, monetization improves, but competition and output cleanup constrain pricing; financing terms remain opaque.", "Track the company and wait for a price or evidence reset rather than target a return from the headline mark.", "Medium: consistent with the mixed evidence and conflicting reports.", "New financing below the prior mark or weak paid conversion."]
      - [Bear, "AI-3D generation is commoditized, customers treat Meshy as a feature, inference costs stay high, and enterprise adoption remains pilot-heavy.", "A material down-round, preference overhang, or inability to finance growth can impair common-equity outcomes.", "Medium-to-high: independent testing identifies category immaturity and workflow limitations.", "Cash runway, gross margin, or customer concentration fails diligence."]
      - [Research-more, "The public pool cannot establish cap table, burn, runway, NRR, CAC, gross margin, or independently verified ARR.", "No actionable price target; preserve optionality until primary diligence closes the evidence gap.", "High: the missing inputs are decision-critical, not cosmetic.", "Management cannot provide the requested operating and financing evidence."]
    notes: "Scenarios are qualitative because the assigned evidence does not provide a consistent audited revenue denominator, cap table, dilution, burn, or preference schedule; valuation/return logic is intentionally not false precision."
    claimRefs: [CV006, CV007, CV009, CV010, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Reported scale and product evidence support interest, but unresolved monetization, competition, and price uncertainty lead to a track recommendation.
    data:
      nodes:
        - {id: scale, label: "Reported scale", detail: "12M+ to 15M+ registered users; 100M+ models reported"}
        - {id: product, label: "Product traction", detail: "Fast generation and broad workflow coverage, with independent limitations"}
        - {id: price, label: "Price", detail: "$1.5B disclosed valuation; other valuation mark reported"}
        - {id: gaps, label: "Underwriting gaps", detail: "ARR quality, retention, margin, burn, runway, cap table"}
        - {id: risk, label: "Downside risks", detail: "Competition, commoditization, financing reset"}
        - {id: recommendation, label: "Track", detail: "Revisit after primary diligence or price discipline"}
      edges:
        - {from: scale, to: product}
        - {from: product, to: price}
        - {from: price, to: gaps}
        - {from: gaps, to: risk}
        - {from: risk, to: recommendation}
    claimRefs: [CV001, CV005, CV007, CV008, CV011, CV014]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: Meshy's disclosed financing and usage trajectory merit continued attention, but the assigned evidence does not support buying at the headline valuation without verified revenue quality, margins, retention, and financing terms.
    claimRefs: [CV001, CV007, CV011, CV015]
  - calloutType: risk
    title: The key risk is evidence quality at price
    body: A large round and rapid ARR claims can coexist with weak cash economics; the decision turns on audited operating metrics and the fully diluted financing structure.
    claimRefs: [CV003, CV006, CV009, CV013]
