- id: TV006
  title: Final diligence asks table
  type: enum
  coverage: partial
  enumerationScope:
    coverage: partial
    basis: Priority diligence asks derived from evidence gaps identified in this research process; not exhaustive of all standard due diligence items.
  summary: Prioritized final diligence asks to move from HOLD / RESEARCH-MORE to a positive commitment recommendation at or near $1.6B.
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  - Priority
  rows:
  - - Series D preference stack / secondary component
    - Terms of the $1.37B round including liquidation preferences, ratchets, governance rights, and any employee/founder secondary
    - Determines whether the headline price translates into attractive common-equity economics
    - Request definitive financing documents and cap-table waterfall from counsel / CFO
    - CRITICAL — cannot underwrite the round economically without this
  - - Audited or CPA-Reviewed Financials
    - No P&L, balance sheet, or cash flow statement for any year publicly available
    - Cannot verify revenue recognition, gross margins, burn rate, or cash runway without audited statements
    - Request audited financials 2023–2024 or CPA review; make LOI or binding offer conditional on delivery
    - CRITICAL — gate to buy recommendation
  - - 2025–2026 Revenue Run Rate
    - No current-year revenue figure or monthly run-rate disclosure
    - Needed to judge whether $7.87B is growth underwriting or narrative underwriting
    - Management accounts, investor updates, or audited interim financials
    - CRITICAL — central to present valuation
  - - Revenue Concentration by Customer
    - Top-3 customer share of revenue not disclosed; 80% long-term contract mix implies concentration
    - Anduril concentration could be >50%; single-customer loss risk; affects DCF and downside resilience
    - Customer revenue schedule in data room; top-10 customer agreement summaries with committed volumes
    - HIGH — affects risk rating and thesis break levels
  - - Factory 4 Milestone Schedule
    - No confirmed completion timeline, construction phase milestones, or contractor progress data public
    - F4 is the primary bull-case catalyst; milestone slippage beyond 60 days is a thesis-break trigger
    - Site visit to Cherokee AL; construction contractor progress reports; confirmed milestone calendar from company
    - HIGH — near-term thesis monitoring
  - - Gross Margin by Factory and Tier
    - No cost of revenue, gross margin, or segment-level economics disclosed for any period
    - Central to whether unit economics support $1.6B+ valuation at scale; cannot model base case without this
    - Detailed cost-of-revenue schedule by factory and service tier in financial data room from CFO
    - HIGH — affects all fair-value modeling
  - - Cap Table and Liquidation Preference Stack
    - No cap table, liquidation preference schedule, or anti-dilution terms disclosed publicly
    - Determines effective equity return at exit; preference overhang could dramatically reduce common equity value
    - Cap table summary plus preference waterfall from legal counsel; review investor rights agreement
    - MEDIUM — affects return modeling at exit
  - - Defense Contract Pipeline — Binding vs. MOU
    - LM MFC MOU and other MOUs are non-binding; binding backlog size unknown beyond Anduril programs
    - Binding backlog drives revenue visibility and scenario probability weighting; MOUs do not guarantee revenue
    - Contract registry with signed POs vs. MOUs vs. LOIs breakdown; review supply agreement terms
    - MEDIUM — affects base and bull case confidence
  notes: 'Priority: CRITICAL = blocking condition for investment; HIGH = required before signing term sheet; MEDIUM = important for return modeling accuracy. All items should be addressed in formal due diligence before commitment.'
