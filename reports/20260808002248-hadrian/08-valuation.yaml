- id: section-scenarios
  title: Bull / Base / Bear Scenarios
  body: 'Three scenarios remain useful, but they must now be judged against a $7.87 billion entry price rather than the old $1.6 billion mark.


    BEAR CASE (~25% probability): Factory 4 qualifies more slowly than expected, revenue growth lags capacity buildout, and the next marked financing or liquidity event reprices the company at $2-4 billion. This still represents a significant business, but it would be a large markdown from the Series D price.


    BASE CASE (~50% probability): Hadrian converts the Alabama and future-factory footprint into real scaled production, discloses materially improved revenue in 2027-2028, and earns a $5-9 billion value range through a late-stage private round, secondary, or strategic process. This would imply roughly flat to modest upside from the Series D.


    BULL CASE (~25% probability): Hadrian proves that Opus and its factory model can support multiple product lines at national scale, reaches several hundred million dollars of annual revenue with visible margins, and becomes IPO-credible or strategically indispensable. In that case a $12-20 billion outcome is plausible, but even the bull case now offers much lower multiple expansion than the prior report because so much upside has already been capitalized into the August 2026 price.'
