- id: section-comparables
  title: Comparable Companies and Transactions
  body: 'Hadrian''s valuation is now better compared with late-stage defense and industrial AI platforms than with conventional manufacturing comps alone. Public peers like Xometry, Proto Labs, TransDigm, Heico, and Moog still frame the range of what established manufacturing businesses trade for, but none justify a $7.87 billion mark on disclosed $30 million revenue. They are helpful mainly as downside anchors.


    The more relevant question is whether Hadrian should be underwritten like a pre-IPO strategic infrastructure company. The Series D investor mix suggests that some buyers now view it that way. Even so, strategic-platform pricing only holds if the company can show that factory capacity converts into durable revenue, margin, and backlog. Until those metrics are public, comparables can explain the narrative but not validate the price.'
