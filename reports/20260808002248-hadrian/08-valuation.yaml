company:
  name: Hadrian
chapter:
  number: 8
  title: Valuation
  summary: 'Hadrian''s August 2026 Series D raised $1.37 billion at a $7.87 billion post-money valuation, nearly 5x the prior $1.6 billion Series C mark. Operationally the company looks stronger than it did in mid-2025: it opened new factories, broadened Opus-backed production ambitions, and attracted crossover capital. Financially, however, the public evidence base still lags the valuation. The last clearly disclosed revenue datapoint remains approximately $30 million for 2024, and there is still no public gross-margin, burn, or cap-table disclosure. The resulting stance is RESEARCH-MORE with a high risk rating and an expensive valuation view.'
sections:
- id: section-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The investment thesis for Hadrian at $7.87 billion rests on five interconnected pillars. First, the market opportunity: the U.S. defense precision-manufacturing market remains structurally under-capacity, and submarine, missile, and autonomy programs continue to create demand for domestic supply-chain scale. Second, product differentiation: Hadrian''s Opus manufacturing platform still appears meaningfully differentiated in scheduling, inspection, and workforce enablement. Third, customer validation: Anduril, the U.S. Navy, and Lockheed Martin MFC remain strong public proof points even if customer disclosure is still narrow. Fourth, financing capacity: the August 2026 Series D materially lowers near-term balance-sheet risk and gives Hadrian the resources to keep building factories while competitors struggle to raise equivalent capital. Fifth, institutional sponsorship: the new investor mix gives Hadrian a more credible path to IPO readiness or a premium strategic outcome.


    The anti-thesis is sharper than in the prior report because the valuation moved faster than disclosure. At $7.87 billion, the company is now worth roughly 262x its last disclosed 2024 revenue of ~$30 million. Even if actual 2025-2026 revenue is substantially higher, public investors still lack the data needed to judge whether the round prices in one, two, or three full factory cycles of future growth. Gross margins, burn rate, cash conversion, the Series D preference stack, and the exact structure of future factory capital remain opaque. The business may well deserve a premium multiple, but the public evidence does not yet support underwriting this price with high confidence.'
