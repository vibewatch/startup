- id: TV002
  title: Thesis / anti-thesis table
  type: enum
  coverage: exhaustive
  summary: Structured bull-thesis and bear-anti-thesis across six valuation-critical dimensions with explicit view-change criteria.
  columns:
  - Dimension
  - Bull Thesis
  - Anti-Thesis (Bear)
  - What Would Change View
  rows:
  - - Market Opportunity
    - $50B+ TAM in defense precision CNC and related sovereign-manufacturing needs; submarine, missile, and autonomy programs support multi-cycle demand
    - Program timing, budget noise, and qualification cycles may slow revenue conversion relative to the valuation curve
    - Signed backlog or disclosed current revenue demonstrating the market is converting into scaled throughput
  - - Product / Technology
    - Opus plus four-site factory network creates a differentiated operating stack that appears hard to copy quickly
    - The moat is only worth the price if software and process claims hold at multi-factory, multi-product-line scale
    - Independent throughput/quality audit across the larger network
  - - Customers
    - Anduril, the Navy, and Lockheed MFC provide sophisticated anchor proof
    - Public customer proof remains concentrated; narrative expansion has outpaced disclosed customer breadth
    - More named production customers and evidence no single account dominates revenue
  - - Financials
    - Series D lowers near-term liquidity risk and funds further buildout
    - 2025-2026 revenue, gross margin, burn, and preference-stack data remain undisclosed
    - Current operating metrics plus cap-table detail showing the round can be justified fundamentally
  - - Execution / Operations
    - Mesa and Alabama openings show Hadrian can add capacity quickly
    - Future-factory and Alabama ramp execution are still unproven at the scale implied by the mark
    - Evidence of qualification, utilization, and repeat output from the expanded footprint
  - - Valuation
    - Institutional and crossover sponsorship create IPO optionality and strategic scarcity value
    - At $7.87B the price already embeds a large share of the future upside and leaves little margin of safety
    - A later round, secondary, or disclosed financial profile that validates the current mark
  notes: Research-team interpretations of public evidence. Operational metrics based on company-stated figures; competitive claims are judgment-based.
