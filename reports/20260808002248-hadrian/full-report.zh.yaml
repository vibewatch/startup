              Opus 仍是运营的软件核心，也是最关键的产品 / 技术护城河。公司把它描述为面向工厂自治的全栈 AI
              平台，串起报价、排产、检验、一线人员上手和生产控制。当前公开材料显示，制造版图扩大后，平台范围也在扩张：管理层现在明确把软件与工厂栈连接到未来的弹药和自主系统产线，而不只是精密零件和造船。


              这套产品还没有表现出单独卖软件的迹象。所有公开价值捕获仍来自 Hadrian 自有制造产出，因此技术成熟度不能看软件采用指标，只能看工厂吞吐量、质量和爬坡表现。
