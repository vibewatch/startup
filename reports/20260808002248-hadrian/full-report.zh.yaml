      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Xometry 和 Hadrian 解决的是不同客户问题
            body: >
              Xometry 和 Hadrian 常被一起称为“数字制造”公司，但它们处理的是结构上不同的客户需求。Xometry 解决的是采购发现问题：买方上传 CAD 文件，拿到即时报价，订单被路由给 10,000+
              供应商中的一家。这个模型针对商业客户、原型和非关键零部件优化。Hadrian 解决的是生产可靠性问题：国防主承包商或政府项目办公室需要有保证的 ITAR
              合规、量产级、长周期机加工部件，并且质量持续稳定——这需要专用且合格的工厂，而不是市场平台。Siemens 2026 年对 Xometry 投资 5000 万美元，确认了市场平台在设计到报价智能上的价值，但不会把
              Xometry 变成工厂运营商。两者直接竞争只存在于国防相邻商业业务的窄带。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP009
          - type: callout
            title: 护城河风险：CAM 软件商品化和 AI 制造智能
            body: >
              Hadrian Opus 平台护城河的主要长期风险，不是直接竞争对手复制工厂模型，而是 AI 驱动 CNC 编程本身走向商品化。商业 CAM 软件（Siemens NX、Mastercam、Autodesk
              Fusion 360）正在越来越多加入 AI 辅助刀路生成，开源 CNC 自动化项目也在进步。如果 AI 驱动 CNC 编程作为软件商品被广泛获取，Hadrian
              的差异化会收窄到工厂网络和已认证客户关系——这些护城河仍有意义，但低于当前“平台 + 工厂”组合。2026 年 5 月宣布的 Siemens–Xometry
              整合，是这一向量的最早形态：把制造智能嵌入设计工具，而不是嵌入工厂运营。
            calloutType: risk
            claimRefs:
              - CP024
              - CP025
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和收入流
        blocks:
          - type: paragraph
            body: >
              Hadrian 运营三层商业模型：客户关系越深，模型捕获的价值越多。第一层——Precision Components——按需供应批量 CNC 机加工金属零件；客户提供图纸，Hadrian
              按采购订单或供应协议交付合格零件。第二层——Manufacturing-as-a-Service（MaaS）——是在多年合同下嵌入客户生产计划的专用加工单元；Hadrian
              代表客户运营这部分单元产能。第三层——Factories-as-a-Service（FaaS）——是由 Hadrian 在客户场地或附近运营的完整工厂部署；这是最深的整合层级，已由美国海军（Factory
              4，Cherokee AL）确认，也写入了与 Lockheed Martin Missiles and Fire Control 的谅解备忘录（2025 年 12 月）。


              公司报告 2023 年收入约 300 万美元，这是其第一个完整商业化年份；2024 年收入约 3000 万美元，同比增长 10 倍。Forbes 和 Yahoo Finance 分别确认了约 3000 万美元的
              2024 年数字；公司尚未发布包含具体收入数字的官方新闻稿。截至 2026 年第一季度，Hadrian 未披露 2025 年或 2026
              年收入，只把增长描述为“激进”。收入确认与绑定生产里程碑的标准权责发生制一致；Precision Components 层级看不出递延收入或订阅 SaaS 结构。


              按公司口径，约 80% 收入来自多年生产合同（3–7 年）。多年合同带来强收入可见性并降低流失风险，但也把履约集中在少数锚定项目上（Anduril、Lockheed MFC、美国海军）。剩余约 20%
              估计来自按需零部件和周期更短的业务。
