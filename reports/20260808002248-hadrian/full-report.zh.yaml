chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命和商业模式
        blocks:
          - type: paragraph
            body: >
              Hadrian 于 2020 年注册成立，并在 2023 年启动商业化运营。公司的使命是“让美国再工业化”：建设 AI
              驱动工厂，以比传统国防工业基础更快、更低成本、更高质量的方式生产精密机加工组件。公司总部位于加州 Torrance，其他设施位于加州 Hawthorne、亚利桑那州 Mesa 和阿拉巴马州 Cherokee。

              Hadrian 将自己定位为全栈先进制造公司，而不是合同制造商或软件供应商。它的核心判断是：数千家小型、老化的机加车间，靠一批正在退休的熟练工支撑，已经无法满足现代国防采购的激增需求；把 AI
              驱动的自动化部署在专门建设的工厂里，才能规模化补上这道缺口。创始人兼 CEO Chris Power 曾把中国制造主导地位带来的竞争威胁称为“生死攸关”，并把 Hadrian 定位成国家安全基础设施。

              公司运营三层商业服务：（1）按需精密部件——从原型到量产，为客户生产飞行级机加工零件；（2）制造即服务——在 Hadrian 或客户设施内部署专用加工或检测单元；（3）工厂即服务——由 Hadrian
              设计和运营完整产品、装配和零部件工厂，瞄准美国国防工业基础最关键的产能短板。三层服务都运行在 Hadrian 自有软件平台 Opus 之上，后者自动化处理设计解读、CNC 编程、工作流排产和自主检测。

              Hadrian 的工厂模型靠几件事拉开差距：24/7 自动化运行、75–80% 设备稼动率（传统航天机加厂约 30%），以及一条能让没有制造背景的工人在 30 天内达到完全产能的培训管线。
