        - CNC OEM 传感器 API 或加装传感器硬件；有线 / 无线工厂网络；符合 ITAR 的网络分段
        - 联网车间会扩大网络安全攻击面；必须同时按 CMMC Level 2 和 ITAR 管住
      - - 自动化物料搬运
        - 跟踪在制品流转；自动搬运托盘和工装夹具；降低单件人工投入
        - 机器人与输送系统（供应商未披露）；与 Opus 调度器集成，用于备料
        - 具体供应商和系统架构未公开披露；机器人供应链有风险；F4 规模下集成复杂度高
      - - CNC 机群
        - 多轴铣削和车削中心；按航空航天公差生产精密部件
        - OEM 供应——Haas、DMG Mori、Mazak 或同类厂商（未确认）；切削刀具耗材；原材料坯料
        - 先进 5 轴 CNC 机器交期长（6–18 个月）；OEM 供应集中风险；机器可用性限制扩产速度
      - - 原材料供应
        - 航空航天级铝、钛、Inconel 和钢；特定项目使用受 ITAR 管制的合金
        - 材料分销商；满足 AS9100D 可追溯要求的钢厂认证材料；大宗商品价格易波动
        - 钛和 Inconel 价格波动；部分特种合金受 ITAR 限制；钢厂认证材料存在单一来源风险
    notes: 架构层来自公司表述的能力，以及贸易出版物对类似 AI 驱动加工运营的描述；Opus 具体实现细节未公开披露。
