      - number: '2.3'
        title: 买方和付款方分层
        blocks:
          - type: paragraph
            body: >
              Hadrian 的买方格局分为三个清晰层级，各自采购画像、预算归属和采用触发点不同。第一层（商业化最成熟）是国防初创公司和新航天 / 自主系统公司：Anduril、SpaceX、Rocket Lab、Shield
              AI、Hermeus 以及类似公司。它们缺少传统供应链关系，行动速度快，也会奖励能跟上速度的伙伴。今天，Precision Components 和 Manufacturing-as-a-Service
              两条收入线主要由这一层驱动。

              第二层是传统国防主承包商（Lockheed Martin、RTX、Northrop Grumman、General Dynamics、BAE Systems）。这些公司已经意识到，在
              PAC-3、F-35、GMLRS 和 THAAD 产能爬坡推动下，内部机加工产能不足以覆盖当前激增需求，因此越来越多转向外部自动化制造商。2025 年 12 月签署的 Lockheed Martin MOU 覆盖
              PAC-3/THAAD/PrSM/GMLRS 零部件，是首个确认的主承包商层级合作，也代表 Hadrian FaaS 模型最大的潜在收入层级。

              第三层是美国政府（DoD 直接采购）：海军 OBBBA 支持的 Factory 4 公私合作，是首个确认的直接政府合作。DoD 的 National Defense Industrial
              Strategy（NDIS，2023 年 12 月发布）明确要求投资现有工业基础无法支撑的制造产能，为 Hadrian 成为 DoD
              指定基础设施伙伴打开路径。预算归属分散在项目办公室（PEO）和国会批准的项目线中。

              三个买方层级的采用触发点都是产能压力：F-35、PAC-3、GMLRS 和潜艇项目的零部件短缺正在推迟交付节奏。这一需求并非推测，而是记录在国会证词、项目办公室简报和媒体报道中。
