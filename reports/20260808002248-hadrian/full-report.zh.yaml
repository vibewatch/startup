  - id: TV006
    title: 最终尽调问题表
    type: enum
    coverage: partial
    enumerationScope:
      coverage: partial
      basis: >-
        Priority diligence asks derived from evidence gaps identified in this research process; not exhaustive of all
        standard due diligence items.
    summary: >-
      Prioritized final diligence asks to move from HOLD / RESEARCH-MORE to a positive commitment recommendation at or
      near $1.6B.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 优先级
    rows:
      - - Series D 轮优先权结构 / 二级出售部分
        - 本轮 $1.37B 条款，包括清算优先权、ratchet 条款、治理权，以及任何员工 / 创始人二级出售
        - 判断名义价格是否转化为有吸引力的普通股经济性
        - 向律师 / CFO 索取最终融资文件和股权结构表瀑布模型
        - 关键 — 没有这些，无法从经济性上承销本轮
      - - 经审计或 CPA 审阅财务报表
        - 公开渠道没有任何年份的 P&L、资产负债表或现金流量表
        - 没有经审计报表，无法验证收入确认、毛利率、烧钱速度或现金续航期
        - 要求提供 2023–2024 年经审计财务或 CPA 审阅；将 LOI 或约束性报价设为交付后生效
        - 关键 — 买入建议的门槛
      - - 2025–2026 年收入运行率
        - 没有当年收入数字或月度运行率披露
        - 需要判断 $7.87B 是按增长承销，还是按叙事承销
        - 管理账、投资者更新或经审计中期财务
        - 关键 — 当前估值核心
      - - 按客户划分的收入集中度
        - 未披露前三大客户收入占比；80% 长期合同组合暗示集中度
        - Anduril 集中度可能 >50%；单一客户流失风险；影响 DCF 和下行韧性
        - 数据室客户收入明细；前十客户协议摘要及承诺量
        - 高 — 影响风险评级和论点击穿水平
      - - Factory 4 里程碑计划
        - 没有公开确认的完工时间线、建设阶段里程碑或承包商进度数据
        - F4 是多头情景的主要催化剂；里程碑延误超过 60 天就是击穿论点触发项
        - 走访 Cherokee AL 场地；建设承包商进度报告；公司确认的里程碑日历
        - 高 — 近期论点监控
      - - 按工厂和服务层级划分的毛利率
        - 任何期间都未披露收入成本、毛利率或分部经济性
        - 这是单位经济性能否支撑 $1.6B+ 规模化估值的核心；没有这些，无法建模基准情景
        - CFO 在财务数据室提供按工厂和服务层级拆分的详细收入成本表
        - 高 — 影响所有公允价值建模
      - - 股权结构表和清算优先权结构
        - 未公开披露股权结构表、清算优先权明细或反稀释条款
        - 决定退出时的有效股权回报；优先权悬置可能大幅压低普通股价值
        - 法律顾问提供股权结构表摘要和优先权瀑布模型；审阅投资者权利协议
        - 中 — 影响退出时回报建模
      - - 国防合同管线 — 有约束力订单与 MOU
        - LM MFC MOU 和其他 MOU 不具约束力；除 Anduril 项目外，有约束力在手订单规模未知
        - 有约束力在手订单决定收入可见度和情景概率权重；MOU 不保证收入
        - 合同登记册，拆分已签 PO、MOU 和 LOI；审阅供应协议条款
        - 中 — 影响基准和多头情景置信度
    notes: 优先级：关键 = 投资的阻断条件；高 = 签署投资条款清单前必须完成；中 = 对回报建模准确性重要。承诺出资前，所有事项都应纳入正式尽调。
