      - number: '8.3'
        title: 估值背景与当前轮次
        blocks:
          - type: paragraph
            body: >-
              Hadrian 当前估值背景由 2026 年 8 月 Series D 定义，而不是 2025 年 7 月 Series C。新一轮融资 $1.37 billion，估值 $7.87 billion，由 WCM
              Investment Management、Washington Harbour Partners、Valor Equity Partners、137 Ventures 和 Baillie Gifford
              共同领投，JPMorganChase 的 Strategic Investment Group 担任锚定共同领投方。投资者名单还包括 Morgan Stanley Wealth Management、Apollo
              管理的基金、T. Rowe Price 顾问账户、CapitalG、Andreessen Horowitz、Founders Fund、Lux Capital、Altimeter、Construct
              Capital 和 1789 Capital。


              这次规模跃迁很关键。新估值在一年多一点的时间里约为上一轮 Series C 估值的 4.9x。用最后明确披露的收入数字（2024 年约 ~$30 million）作分母，意味着约 262x
              的过往收入倍数；这与其说是可用的承销指标，不如说是在提醒投资者：他们买的是多个未来产能周期，而不是当前已披露的盈利能力。换句话说，要支撑今天 $7.87 billion 的估值，并按 15–20x
              未来收入计算，Hadrian 很可能需要约 $400–525 million 年收入，加上一条可信的利润率曲线。


              如果公司能把工厂版图和产品扩张成功转成规模化项目，这个收入目标可能可以达到，但公开证据还没跟上。缺少当前收入、毛利率、现金消耗和优先权结构披露时，Series D
              更应被解读为强烈的市场信号，而不是经过独立验证的公允价值。
