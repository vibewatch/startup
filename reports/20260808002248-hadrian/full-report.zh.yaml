      - number: '2.2'
        title: 市场规模测算——TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >
              测算 Hadrian 的可服务市场，必须从多个视角交叉校准，因为没有单一分析师报告能覆盖自动化 CNC 国防精密机加工这一特定细分。最宽口径是美国国防采购总额（FY2025 预算约 8860
              亿美元），它涵盖全部国防支出，其中约 30–35% 用于商品和系统采购。在采购内部，精密机加工金属部件只是子集：行业估计占采购支出的 5–10%，意味着仅 CNC 机加工零件的年度采购价值为 150 亿–300
              亿美元。

              更窄的视角来自航空航天零部件制造市场：Grand View Research 估计，2024 年全球航空航天零部件制造市场约 9080 亿美元，并以约 6.3% CAGR 增长至 2030 年。该市场中的精密
              CNC 机加工子行业约占航空航天零部件总市场的 5–8%，意味着全球精密航空航天 CNC 机加工 TAM 为 450 亿–750 亿美元。美国国防部分约占全球航空航天支出的 20–30%，对应美国国防精密 CNC
              TAM 为 90 亿–220 亿美元。

              第三个视角：Hadrian CEO 曾称，美国国防机加工是未来十年的“数千亿美元机会”，依据是海军需要把潜艇产量从每年 1.3 艘提升到 2 艘以上。Congressional Budget Office
              (CBO) 估计，海军 30 年造舰计划总项目成本超过 1 万亿美元，其中相当大一部分会流向工业基础中的精密机加工部件。

              Hadrian 目前现实可触达的 SAM，是国防机加工中同时满足三点的部分：（a）能用当前 5 轴 CNC 技术自动化；（b）属于产率型合同，而非一次性原型；（c）目前被传统车间服务不足。按这一基础，仅公司
              Factory 4 承诺（初始周期内 24 亿美元）就意味着 Hadrian 认为中近期立即可服务市场在 50 亿–200 亿美元。假设 Factory 4 到 Factory 8 的建设计划顺利执行，未来五年的
              SOM 估计为 10 亿–50 亿美元年收入。
