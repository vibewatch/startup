      - number: '5.6'
        title: 信任、安全、安防与质量控制
        blocks:
          - type: paragraph
            body: >
              Hadrian 位在航空航天质量标准和国防网络安全要求的交叉处，因此背着多层合规负担。AS9100D——基于 ISO 9001 的航空航天质量管理体系标准——已确认用于 Hadrian
              的生产运营；Lockheed Martin、Anduril、Raytheon 同级企业等主承包商下生产订单前也要求供应商具备该标准。AS9100D
              要求记录化流程控制、校准记录、供应商资质流程、纠正措施跟踪和管理层评审周期；鉴于其已确认的长期供应关系，Hadrian 看起来已经落实了这些要求。


              制造 PAC-3 导弹系统、THAAD 拦截器、PrSM 精确打击弹药等受控国防项目零部件，ITAR（International Traffic in Arms
              Regulations，国际武器贸易条例）合规是入场券。Hadrian 在能力清单中明确列出 ITAR 合规，并运行物理访问控制、人员筛查和出口申报流程，符合 ITAR 要求。截至 2026 年
              Q1，Hadrian 尚未公开确认已完成 CMMC Level 2 认证；该认证要求 110 项与 NIST SP 800-171 对齐的网络安全实践，并需每三年接受一次第三方评估。处理 Controlled
              Unclassified Information（CUI，受控非密信息）的 DoD 承包商必须按 DFARS 252.204-7021 满足 CMMC Level 2，而导弹和潜艇零部件制造相关技术数据大多属于
              CUI。联网工厂架构（IoT 传感器、云遥测、数字孪生数据流）制造出一块必须同时按 CMMC 和 ITAR 管理的网络安全攻击面。DOD 设施安全许可——用于进入涉密项目和 Special Access
              Programs（特别访问项目）——也被报道为目标，但尚未公开确认。
