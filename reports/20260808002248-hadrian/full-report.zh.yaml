      - number: '5.5'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              Hadrian 的部署模型接入客户采购和质量系统，而不是要求客户操作任何软件。客户在 Hadrian 门户提交图纸并管理交付排期，Hadrian 则返回面向 AS9100D
              的质量记录。当前路线图的重点，已经不再是开出第一批大型工厂，而是把 2026 年 8 月融资注入的资金消化成新设施和新产线。


              Factory 1 到 Factory 4 如今都是公开里程碑。Factory 3 在 $200M 投资后于 2026 年 1 月在 Mesa 开业，Alabama 潜艇零部件站点则在 2026 年 3
              月开业。管理层称 Series D 将资助更多工厂、扩张后的研发，以及弹药和自主系统新产线；这意味着 Opus 必须从精密机加工零件推广到更广产品类别，同时守住可追溯性和正常运行时间承诺。


              可靠性主张——机器正常运行时间 75–80%——仍未经过独立审计。因此，下一次更新的核心技术问题，不是 Hadrian
              能否运行一座自动化工厂，而是同一套软件和运营栈能否支撑多个地理位置、更多项目和更广产品范围，同时不出现质量或安全倒退。
