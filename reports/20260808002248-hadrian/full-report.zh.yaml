      - number: '3.3'
        title: 定价和套餐对比
        blocks:
          - type: paragraph
            body: >
              国防精密制造供应商的定价通常不透明，原因是合同保密、项目级定价，以及国防采购多层级结构复杂。以下分析基于公开表述、分析师报告和代理指标。

              Hadrian 不公布标价，通常通过谈判签订三到七年的长期生产合同。其 Opus 驱动的报价系统据称可在数分钟内为标准几何形状生成报价，但底层单件价格没有公开披露。分析师评论认为，Hadrian
              按单件计价相对传统机加车间有溢价，支撑理由是报价速度、质量一致性和产率可靠性。FaaS（Factory-as-a-Service）模型代表最高价值层级，把 Hadrian
              制造单元嵌入客户或公共设施内；Lockheed Martin MFC 合作和海军 Factory 4 是两个已确认的公开案例。

              Xometry 的市场平台使用 AI 驱动的 Instant Quoting Engine（IQE），根据上传的 CAD 文件实时生成价格；机加工零件典型交期为一到四周。Xometry
              对标准机加工业务的定价具备竞争力，但多供应商网络天然带来波动：质量、交付可靠性和 ITAR 合规取决于被分配的具体供应商。

              Protolabs 提供快速原型和小批量制造，支持在线报价，部分工艺交期达到行业领先的一到三天。其定价针对工程迭代（原型到试产）优化，而不是量产级国防项目。

              传统机加车间通过询价（RFQ）流程报价，通常需要数天到数周，且没有标准化定价。多数按采购订单或总括订单商业条款运营，不提供国防主承包商越来越需要的长期产能预留。
            claimRefs:
