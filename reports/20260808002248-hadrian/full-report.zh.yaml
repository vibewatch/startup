            body: >
              Hadrian 没有提供 NRR 或 GRR 数据，并不意味着留存不可知——国防生产合同的结构性经济决定了，合同期内流失极不可能。一旦供应商通过 AS9100D 认证并进入项目，换供应商的成本（12–18
              个月重新认证、首件检验项目、潜在项目延误）通常高于任何竞争者在正常情况下能给出的价格让步。


              80% 长期收入占比（3–7 年合同）意味着 Hadrian 已确认收入的绝大部分在多年周期内有合同承诺。Anduril 关系已有 3
              年以上活跃历史，且没有任何公开流失信号，与这个结构性留存模型方向一致。尽调的关键问题不是 Hadrian 能否在合同期内留住现有客户，而是它能否把剩余 20%
