  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    caption: |
      各层级防务客户如何发现、评估、认证、签约并扩展与 Hadrian 的关系——从最初认知，到多年期生产合作，再到 FaaS 部署。三个具名客户细分的切入点明显不同，但最终都收敛到同一个长期生产合同终点。
    data:
      nodes:
        - id: n1
          label: 发现 / 转介绍
          detail: 防务主承包商或创业公司发现机加工产能缺口；通过 CEO 人脉、防务科技圈层或同行转介绍听到 Hadrian
        - id: n2
          label: RFQ / 自动报价
          detail: 潜在客户提交图纸；Hadrian 的 Opus 平台几分钟内给出自动报价，传统机加工店通常要数天；价格和交期对比触发后续沟通
        - id: n3
          label: 技术认证
          detail: AS9100D 审核、首件检验、质量计划评审；防务级零件通常需要 3–9 个月；Hadrian 借助 Opus 检验自动化提速
        - id: n4
          label: 试点 / 初始生产
          detail: 小批量生产的首张采购订单；客户在放量下验证重复性、公差和交付；可能包含 9 个月验证期
        - id: n5
          label: 生产合同授予
          detail: 客户授予多年期生产 SOW 或总括采购协议；Hadrian 80% 收入绑定 3–7 年合同；客户锁定产能和价格
        - id: n6
          label: MaaS 扩展
          detail: 客户从按需零件供应升级为专属 MaaS 单元——Hadrian 为客户项目排期运营预留机加工产能块
        - id: n7
          label: FaaS / 工厂即服务
          detail: 最深度的集成：Hadrian 为客户设计、建设并运营整座工厂，地点在客户现场或附近（如 Lockheed Martin MFC MOU Dec 2025；Navy Factory 4）
