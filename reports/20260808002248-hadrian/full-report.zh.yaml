      - number: '4.2'
        title: 单位经济和毛利率
        blocks:
          - type: paragraph
            body: >
              Hadrian 是私营公司，没有向任何公共监管机构提交财务报表（SEC Regulation D
              表格除外，这些表格确认轮次规模，但不披露收入、利润率或现金消耗率），因此单位经济只能用公开代理数据估算。Hadrian 的商业模式有两个不同经济层：工厂层经济，以及单件或单项目经济。


              在工厂层面，Hadrian 声称机器稼动率为 75–80%，而传统机加车间约为 30%；一名工人可同时操作 10
              台机器，而传统设施是一名熟练技师操作一台。如果属实，这些生产率主张意味着单位人工成本显著降低，单位面积收入更高。截至 2026 年第一季度，Factory 2（Torrance，100,000 平方英尺）和
              Factory 3（Mesa AZ，270,000 平方英尺）是主要生产设施。Factory 3 需要约 2 亿美元公司口径资本投入，并获 Arizona Commerce Authority
              确认——这意味着资本强度约为每平方英尺 740 美元，约为传统机加车间建设的 2–4 倍。


              公司没有披露毛利率。研究团队使用公开 CNC 机加工基准和 Xometry（XMTR）作为可比对象（市场平台毛利率约 28–32%；垂直整合车间更高），并叠加 Hadrian 声称的生产率优势，估算
              Precision Components 成熟期毛利率为 35–50%。MaaS 和 FaaS 层级可能因经常性合同经济具备更高贡献毛利，但前置的资质和工装成本会压低新项目早期利润率。


              资本强度是工厂层面的主导财务风险：每座新设施在达到 Factory 4 规模（15 亿美元以上私募资本）之前，也需要 5000 万–2 亿美元以上初始资本。按当前生产爬坡速度，工厂回本期估计为 3–5
              年，但不确定性很大。
