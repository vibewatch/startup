      - number: '1.4'
        title: 里程碑、运营轨迹和负面事件
        blocks:
          - type: paragraph
            body: >-
              Hadrian 的运营时间线现在覆盖 2020 年注册、2023 年商业化启动，以及到 2026 年的加速扩张。收入在 2023 年达到 300 万美元，2024 年约增长 10 倍至估计 3000
              万美元；管理层称 2025 年增长激进，但没有披露具体数字。2025 年或 2026 年收入至今没有公开发布，与当前估值规模相比，透明度缺口明显。


              这一时期的关键合作包括 2023 年 6 月与 Anduril Industries 达成的战略制造伙伴关系、2025 年 12 月与 Lockheed Martin Missiles and Fire
              Control 签署的导弹防御和精确打击零部件 MOU，以及由美国海军支持、专门生产潜艇部件的阿拉巴马工厂。公司还在 2024 年 8 月收购 Datum Source，2026 年 1 月在 Mesa 开出
              Factory 3，2026 年 3 月在阿拉巴马开出 Factory 4，并在 2026 年 8 月宣布 13.7 亿美元 Series D。管理层称，Series D
              将支持更多工厂和弹药、自主系统新产线，把公司范围从精密零部件推进到完整任务关键系统。


              在已审阅来源中，没有发现公开监管处罚、召回或重大法律程序。主要负面事实仍是估值与披露之间的错位：Hadrian 的产能和投资人支持显然已经扩大，但当前 78.7 亿美元估值仍主要建立在未披露的 2025–2026
              年运营指标之上。
