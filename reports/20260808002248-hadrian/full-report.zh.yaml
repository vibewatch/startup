        - Mesa 和 Alabama 开业表明 Hadrian 能快速新增产能
        - 未来工厂和 Alabama 爬坡仍未在当前估值暗含的规模上验证
        - 扩张后网点的资质认证、利用率和重复产出证据
      - - 估值
        - 机构和跨界投资者背书带来 IPO 可选项和战略稀缺价值
