      - number: '4.4'
        title: 公开财务缺口和披露限制
        blocks:
          - type: paragraph
            body: >-
              Hadrian 作为私营公司，不需要向任何公共机构提交财务报表。公司的公开财务披露只有 SEC Regulation D 表格（确认轮次金额、投资人姓名和股份结构）以及选择性媒体层面表述（公开沟通过的收入数字只有
              2023 年 300 万美元和 2024 年约 3000 万美元）。


              关键财务未知项包括：毛利率、运营现金消耗率、账上现金、收入成本（包括 CNC 加工耗材、人工、材料）、MaaS / FaaS 合同条款、单厂收入、Factory 4
              私募资本来源结构和长期债务安排。没有审计财务报表、管理账或投资人信公开发布。


              Toarn 的对抗性分析估计，根据员工扩张和建厂成本，Hadrian 的现金消耗率大幅超过已披露收入，因此继续获得股权市场资金至关重要。这个观点与研究团队模型在方向上一致，但没有内部信息无法确认。


              在这一融资阶段（已融资 6.25 亿美元）缺少盈利信号，对重资本、工业规模制造初创公司来说并不罕见；但如果宏观环境恶化、项目里程碑滑坡，或后续股权 / 项目融资延迟，这会构成有意义的财务风险。Factory 4
              的 15 亿美元私募资本承诺——如果以债务或项目融资形式构成——会增加实质资产负债表义务，而外部观察者目前完全看不清。



              Series D 可以说提高了透明度需求，而不是降低了需求：在 78.7 亿美元估值下，投资人需要当前收入、利润率和优先权结构数据，才能判断公司究竟是按规模化工业企业估值，还是按 pre-IPO 战略平台估值。
