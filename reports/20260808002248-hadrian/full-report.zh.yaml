      - number: '6.4'
        title: 留存、合同韧性与客户满意度
        blocks:
          - type: paragraph
            body: >
              Hadrian 没有公开披露任何期间的净收入留存率（Net Revenue Retention，NRR）、毛收入留存率（Gross Revenue Retention，GRR）、客户流失率或客户净推荐值（Net
              Promoter Score）。作为服务 B2G 和 B2B 工业市场的私营公司，Hadrian 不在 G2、Capterra、Gartner Peer Insights
              或任何其他面向消费者的评价平台上。因此，公开资料无法支持定量留存分析。


              从合同模型做结构性留存分析，可以得到一个定性替代指标。按公司披露口径，Hadrian 约 80% 收入来自多年生产合同（3–7
              年），意味着大部分收入按生产计划锁定，而不是受年度续约影响。国防生产客户的切换成本极高：更换合格机加工供应商，需要重跑 AS9100D 审核、首件检验和资质项目，耗时 12–18 个月，成本可达数百万美元。一旦
              Hadrian 作为合格供应商进入项目，合同期内流失在结构上极不可能。


              Anduril 关系是目前最强的留存数据点。自 2023 年 6 月至报告日期，这段合作一直活跃，并持续被公开引用，约三年时间内没有公开迹象显示订单量下降、重新寻源或合同争议。Anduril 在 2025 年和
              2026 年官方材料中继续把 Hadrian 称为制造伙伴，为持续活跃生产提供了合理信心。


              Lockheed Martin MOU 太新（2025 年 12 月），不足以提供留存证据——生效时间还不够长，谈不上续约。Navy Factory 4
              关系因设施投资规模天然是长期关系；有效期限会以十年计，而不是以年计。


              客户满意度完全来自推断，而非测量。Hadrian CEO Chris Power
              在多次采访中把客户需求描述为「强到超过我们的交付能力」，意味着需求侧有拉力。如果属实，这会指向极低的留存风险。不过，这些都是公司单方说法，未被任何公开来源中的客户背书证实。
