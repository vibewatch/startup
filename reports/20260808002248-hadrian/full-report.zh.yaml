      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Hadrian 的收入基础几乎肯定集中在少数锚定客户上。Anduril Industries 是唯一公开确认的具名客户；研究团队基于合作深度估计，它贡献 2024 年收入的 30%
              以上，其中包括专属加工单元和多年生产合同。Anduril 自身融资充足（已融资 $3.5B+），但尚未盈利；一旦 Anduril 的国防项目中标或政府合同回款放缓，Hadrian
              订单量会在很短滞后后受到影响。公司没有公开披露收入多元化时间表。

              US Navy 对 Factory 4 的 $900M OBBBA 承诺，是第二个关键依赖。AUKUS / 潜艇资本重整计划有政治支持，但仍受年度国会拨款、预算交易结构和持续决议风险约束。Hadrian 没有披露
              OBBBA 里程碑付款安排，而这本可澄清现金流时点风险。CNC 机床供应商——主要是 Haas Automation、DMG Mori、Mazak 和
              Okuma——构成资本设备供应链依赖；任何单一供应商的集中采购，尤其在 Haas 国内制造产能受限的情况下，都会制造 F4 设备建设风险。

              RTX Ventures 作为 Hadrian Series B 领投方，带来更微妙的战略依赖风险。Raytheon Technologies 的投资部门可以接触 Hadrian
              的战略计划、客户关系和技术路线图。如果 RTX 制造战略转向，或 Raytheon 自建竞争能力，董事会观察员身份和投资者权利制造的信息不对称可能对 Hadrian
              不利。国防预算拨款风险影响整个客户基础：Hadrian 几乎全部收入都来自国防项目（Anduril、Lockheed MFC、Navy），DoD 项目削减 15%+ 会成为系统性收入风险。
