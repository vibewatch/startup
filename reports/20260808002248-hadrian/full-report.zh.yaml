      - number: '6.2'
        title: 采用轨迹与商业爬坡
        blocks:
          - type: paragraph
            body: >-
              Hadrian 的商业轨迹可以从营收披露、客户公告日期和工厂投产里程碑拼出来。公司 2023 年商业化启动——这是 Precision Components 和 MaaS 销售的第一个完整年份——并披露约 $3M
              收入，几乎全部来自 Anduril 锚定关系和早期按需客户。2024 年收入 10× 增至约 $30M，说明公司已经在单一锚定客户之外形成实质扩张；除 Anduril 外，多个未具名生产合同也在贡献收入。


              Hadrian 的获客漏斗被国防采购周期显著约束。新生产客户从首次接触到资质认证、AS9100D 审核、首件检验和合同授予，通常需要 12–24 个月。Hadrian 的 Opus
              平台能把报价阶段压缩到几分钟，但资质和采购周期由客户侧决定，会压低漏斗转化率。


              RTX Ventures 在 Series B（2024 年 2 月）中领投，是一个重要采用信号：若没有把 Hadrian 作为潜在精密机加工供应商做过供应链审查，Raytheon Technologies
              的投资部门不太会领投 $117M 轮。虽然 Hadrian 与 Raytheon 之间没有披露明确生产合同，但这笔投资意味着 Tier-1 主承包商验证，也可能指向前置采购订单管线。


              Datum Source 收购（2024 年 8 月）和 Lockheed Martin MOU（2025 年 12 月）代表两条不同采用路径：前者借现有市场扩展按需（Tier-1
              零件）管线，后者把关系从零件供应深化到嵌入式工厂产能。Navy Factory 4 承诺代表最深的客户集成——FaaS 层级——也可作为未来 DoD 机构和主承包商评估 FaaS 的参考锚点。



              Series D 之后改变的是规模，不是客户披露。管理层现在谈的是更多工厂，以及弹药和自主系统新产线，但公开客户证据仍落在同一批锚定项目上。因此，投资人应把 2026
              年估值上调理解为市场对未来客户扩张的信心，而不是当前已有广泛客户名单被公开证明的证据。
