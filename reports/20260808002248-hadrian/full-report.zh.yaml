      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 53× 收入倍数完全押注未经证实的 Factory 4 成功
            body: >
              在 $1.6 billion 估值和 2024 年 $30 million 收入下，Hadrian 的定价是过往收入的 53×——这一倍数在公开国防制造公司中没有先例。即便是质量最高的国防零部件可比公司
              TransDigm Group，也是在已证明盈利能力和数十年定价权的基础上，以 12–15× 收入交易。Hadrian 的溢价只有在 Factory 4（计划 2026 年 3 月开业）成功规模化、并支撑
              $300–500 million 年收入时才合理。Factory 4 的私人资本结构（$1.5 billion）完全不透明；这一建设在公司内部没有先例；任何 6
              个月以上延迟都会把乐观情景推入基准情景，甚至更差。以 $1.6 billion 进入的投资者，承担的是一个 $2.4 billion 公私合作项目的全部执行风险，而其私人资本条款未披露。
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV027
              - CV040
          - type: callout
            title: RTX Ventures 领投 Series B，形成战略收购方协同
            body: >
              RTX Ventures（Raytheon Technologies 的风险投资部门）在 2024 年 2 月领投 Hadrian 的 Series B，并参与 Series
              C。处于领投层级的战略投资者通常会获得更强的信息权、董事会观察员席位，以及收购讨论中的优先了解权。这种协同，加上 RTX 暴露于 Hadrian
              所服务的同一批国防项目，形成了一条隐含收购方路径，相比纯财务赞助方退出，可能降低退出风险。不过，如果 Hadrian 争取与 RTX 竞争的主承包商，或向 RTX 供应链边界以外多元化，RTX
              的战略兴趣也可能制造冲突。
            calloutType: insight
            claimRefs:
              - CV031
              - CV006
              - CV029
          - type: callout
            title: $1.6B 下 HOLD / RESEARCH-MORE——上调至 BUY 需要三个条件
            body: >
              研究团队的建议是 HOLD / RESEARCH-MORE。三个条件将支持上调至 BUY：（1）经审计或 CPA 复核的财务报表确认毛利率 >30%、现金跑道 >18 个月；（2）确认 Factory 4
              私人资本结构为股权或项目融资，而非高级担保债；（3）披露 2025 年收入，显示从 2024 年 $30 million 基数继续实现 2–5× 增长。三项全部满足后，研究团队才有足够信心支持在 $1.6
              billion 附近投入。任何一项未满足，都应触发入场价重谈，或改为与里程碑挂钩的结构化投资，并把阶梯上调定价绑定 F4 建设确认。
            calloutType: recommendation
            claimRefs:
