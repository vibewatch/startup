      - number: '4.3'
        title: 资本充足性、融资和现金消耗
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月 Series D 之后，Hadrian 的融资基础发生实质变化。SEC Form D 数据仍为种子轮到两笔 Series C 分批交易提供历史锚点，但新的官方轮次公告在 78.7
              亿美元估值下增加了 13.7 亿美元新股权资本。把这笔融资与此前披露的约 6.25 亿美元融资合并计算，在计入海军为 Factory 4 单独提供的 9 亿美元公共承诺之前，公开披露的私募资本累计约 20
              亿美元。


              投资人组合也变了。早期轮次以风投和战略资本为主；Series D 加入了 WCM Investment Management、Washington Harbour Partners、Valor Equity
              Partners、Baillie Gifford、JPMorganChase 的 Strategic Investment Group、Morgan Stanley Wealth
              Management、Apollo 管理的基金、T. Rowe Price 账户和 CapitalG。这显著降低了设备采购、工厂启动和营运资金支持的近期融资风险，但也提高了市场对 Hadrian
              最终提供公开市场级报告纪律的期待。


              这一轮没有解决的是底层运营模型。管理层仍未披露 2025 年或 2026 年收入、毛利率、现金消耗或股权结构细节，支撑 Factory 4 的私募资本具体结构也未披露。因此，Series D
              更清楚地解决了公司的短期流动性问题，而不是投资人的承销问题。
