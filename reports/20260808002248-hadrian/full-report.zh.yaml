      - number: '6.3'
        title: 具名客户证据与生产证明
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 8 月，Hadrian 公开披露了三个具名生产客户：Anduril Industries、Lockheed Martin Missiles and Fire Control、US
              Navy。三者分别代表国防工业基础中的不同层级，也分别落在 Precision Components → MaaS → FaaS 价值链的不同位置。


              Anduril Industries 是最强的客户证明。2023 年 6 月宣布的战略制造合作，已由双方新闻稿（Business Wire）和 Anduril 官网共同确认。Anduril 从 Hadrian
              工厂获得火箭组件、无人机零件和武器子系统，合同性质是生产合同，不是试点。截至报告日期，这段关系已持续三年以上，是生产级交付最耐久的证据。


              Lockheed Martin Missiles and Fire Control 于 2025 年 12 月与 Hadrian 签署 MOU，将在 Lockheed 设施内由嵌入式 Hadrian 制造单元生产
              PAC-3 MSE、THAAD、PrSM 和 GMLRS 零部件。该 MOU 由 Lockheed Martin 官方新闻网站确认，并经国防媒体（Defense News、Breaking
              Defense、National Defense Magazine）独立核实。MOU 代表从 Precision Components 供应转向 FaaS 层级合作，是一次重要向上销售，也是 Tier-1
              主承包商释放生产级意图的最强信号。


              US Navy 在 Cherokee, Alabama 锚定的 Factory 4，是 FaaS 层级最完整的形态：Hadrian 设计、建造并运营一座 220 万平方英尺设施，专门生产潜艇零部件。Navy 的
              $900M OBBBA 出资已由联邦支出数据库和 Navy 官方通信确认。这是一段政府合同关系——不是试点——Navy 实际上共同资助该设施，并充当锚定承购客户。


              RTX / Raytheon 的位置更模糊：RTX Ventures 于 2024 年 2 月领投 Hadrian Series B，意味着它在内部把 Hadrian
              作为供应链伙伴做过审查，但尚未宣布明确生产合同。Hadrian 2024 年 $30M 收入中，按已知零件定价推算，Anduril
              单独不太可能解释全部增量，因此可能还存在少量未具名国防承包商；但这些客户仍未确认。


              Toarn 的对抗性分析指出，Hadrian 的客户披露高度有限：在 $30M 收入和 $625M 融资背景下，仅有三个具名客户，造成明显的集中度风险不确定性，也限制了外部独立验证采用叙事的能力。
