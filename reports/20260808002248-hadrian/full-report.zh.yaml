      - number: '6.6'
        title: 附录
        blocks:
          - type: callout
            title: 客户集中度：Anduril 和 US Navy 是结构性锚点，也是单点失效
            body: >
              Hadrian 的公开证据显示，客户基础高度集中：Anduril Industries（自 2022 年起的锚定客户）可能贡献公司早期生产收入的 30–50%+，US Navy 则借一个依赖 OBBBA
              拨款的政府项目锚定整座 Factory 4 设施。两个客户支撑两条不同收入流，也支撑 Hadrian 四座工厂中的两座。


              如果 Anduril 下调采购量——无论是因为自身融资挑战、项目取消，还是决定把机加工零件内制或重新寻源——Hadrian 都会失去不成比例的收入，短期替代空间有限。国防采购周期长达 12–24
              个月，快速替换客户在结构上不可能。


              Navy Factory 4 依赖会放大风险：一旦 OBBBA 支持的潜艇项目取消或大幅重组，专门为该项目建设的设施中已承诺的 $1.5B 私人资本就会沉没。投资人应定量建模集中度情景，并在形成观点前从数据室索取
              Anduril 收入占比。
