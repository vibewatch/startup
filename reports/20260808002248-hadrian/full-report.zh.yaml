      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: Factory 4 是 Hadrian 历史上最大且未经验证的执行项目
            body: >
              Cherokee, Alabama 的 Factory 4 同时叠加了所有运营风险类别：前所未有的规模（220 万平方英尺，约为此前全部工厂合计的 8 倍）、$2.4B 公私融资结构且其中 $1.5B
              私人资本部分不透明、1,000-2,000 名员工需求、数百台 CNC 加工中心采购且交期 12-24 个月，以及对 US Navy 潜艇生产的合同履约义务。Hadrian
              没有披露公开施工计划、独立项目管理监督或设备采购里程碑。2026 年评估 Hadrian 的投资人，本质上是在押注一个没有公开进度审计的项目能够成功交付。
            calloutType: risk
            claimRefs:
              - CR011
              - CR024
              - CR027
          - type: callout
            title: ITAR 尾部风险随规模非线性上升
            body: >
              Hadrian 的 ITAR 合规义务不会随员工人数或工厂数量线性扩张；它随接触出口管制技术数据、硬件和制造流程的人数扩张。408 名员工分布在四座设施，ITAR 风险面已经很大。Factory 4 所需
              2,000+ 员工规模下，技术控制计划必须在一个新州、不同人才池中筛查、制证并监控数量级更多的人员。一名 Hadrian 员工故意违反 ITAR，就可能带来最高 20 年监禁和每项违规 $1.3M
              的刑事处罚。关于 Hadrian 技术控制计划架构、审计节奏或 DDTC 自评项目，公开资料没有披露任何信息。
            calloutType: risk
            claimRefs:
              - CR001
