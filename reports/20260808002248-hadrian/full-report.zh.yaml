      - number: '1.2'
        title: 领导层、创始人和治理
        blocks:
          - type: paragraph
            body: >
              Forbes 2024 年 8 月发布报道时，Chris Power 33 岁；他是唯一创始人并担任 CEO。Power 在澳大利亚 Melbourne 长大，从 Monash University
              退学，曾在零售和 SaaS 初创公司做增长岗位。2019 年，他带着 6000 美元来到美国，并认定美国工业衰退构成地缘政治威胁。2020 年注册 Hadrian 前，他花了六个月走访机加车间。创办
              Hadrian 之前，Power 运营过 ADSC，一家专注收购中型国防供应链公司的小型投资载体；后来他解散 ADSC，转而从零建设新工厂。

              运营副总裁 Chris Baker 此前在 SpaceX 管理机加车间。Power 连续六个月联系 Baker，把他招为技术运营负责人；Baker 起初怀疑这件事能否做成。Baker
              现在负责工厂现场系统和员工项目。Andreessen Horowitz 的 Katherine Boyle 和 Lux Capital 的 Brandon Reeves 担任董事会观察员；RTX Ventures
              的 Daniel Ateya 则代表战略投资方参与公司治理架构。

              Hadrian 向全体员工授予股权，这是有意设计的留才机制；传统制造商很少把所有权延伸到生产工人。Power 同时是 Hadrian 再工业化叙事的公众面孔，也是与 DoD
              官员和国防主承包商关系的主要负责人，因此关键人依赖是实质风险。
