      - number: '8.5'
        title: 可比公司与交易
        blocks:
          - type: paragraph
            body: >-
              Hadrian 现在更适合与后期国防和工业 AI 平台比较，而不是只看传统制造业可比公司。Xometry、Proto Labs、TransDigm、Heico 和 Moog
              等公开可比公司仍能框定成熟制造企业的交易区间，但没有一家能用已披露 $30 million 收入支撑 $7.87 billion 估值。它们主要用来提供下行锚。


              更关键的问题是，Hadrian 是否应按 IPO 前战略基础设施公司来承销。Series D
              投资者组合显示，部分买方现在确实这样看它。即便如此，战略平台定价只有在公司能证明工厂产能转化为持久收入、利润率和积压订单时才站得住。那些指标公开之前，可比公司能解释叙事，但不能验证价格。
