      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 国防工业基础的机加工缺口是结构性的，不是周期性的
            body: >
              过去四十年，美国国防工业基础约流失 190 万名专业制造工人——国防和航空航天制造部门员工从约 300 万降至 110
              万。这不是短期需求冲击，而是结构性劳动力流失叠加制造资本投资不足。留下来的劳动力正在老化（机加工技师平均年龄 45 岁以上），也没有证据显示补充管线接近满足
              AUKUS、乌克兰和太平洋威慑需求所需的规模。正是这道结构性缺口，让 Hadrian 的 30 天培训管线和 AI 自动化运营成为真正的市场必需品，而不是锦上添花。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: 没有单一第三方来源能精确测算 Hadrian 的 SAM
            body: >
              国防精密 CNC 机加工子细分并不对应任何标准 SIC/NAICS 代码，主流市场研究机构也没有单独测算。Grand View Research 测算的是更宽的航空航天制造市场，约 9080
              亿美元，口径过宽。NDIA 定性量化缺口，但没有给出美元规模。因此，任何锚定精确市场数字的财务预测都存在模型风险。投资人应把本章所有 SAM 估计视为研究团队综合模型，而不是第三方验证的数据点。
            calloutType: risk
            claimRefs:
              - CM006
              - CM010
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Hadrian 的竞争宇宙覆盖五类公司：（1）数字制造市场平台（Xometry、Fictiv、Protolabs），把买方匹配给第三方车间；（2）AI 驱动的增材制造公司（Divergent
              Technologies、Velo3D），重点是金属 3D 打印，而不是 CNC 减材工艺；（3）传统机加车间——美国国防工业基础（DIB）中约 60,000
              家私营中小机加工企业，合计掌握当前国防精密机加工收入的绝大多数；（4）国防主承包商自有制造（General Atomics、L3Harris、Boeing Defense），这些公司保留部分内部 CNC
              产能；（5）潜在未来进入者，包括资本充足的工业科技公司（例如 Siemens、General Electric Aerospace），它们可能建设自动化工厂能力。

              Hadrian 相对五类对手的核心差异，是完全垂直整合的所有权模型——它拥有并运营 CNC 机床、厂房和 AI 软件栈，而不是授权技术或充当市场中介。所有权模型让其 AI/MES
              平台（Opus）能够生成运营反馈闭环，在编程、排产和质量上规模化改进，这是市场平台做不到的。Hadrian 已明确表示，Opus 不对外销售，而是嵌入工厂网络的专有优势。

              Xometry 是最显眼的公开市场可比公司，本质上是数字制造市场平台，拥有约 10,000+ 活跃供应商，FY2024 年度市场收入约 1.2 亿美元。其商业模式根本不同：Xometry
              聚合需求，并把订单路由给第三方车间，不拥有机器或设施。因此，Xometry 无法像 Hadrian 的专用 ITAR 认证工厂模型那样，保证 ITAR 合规、量产级产能或长期合同履约。Siemens 于 2026
              年 5 月宣布对 Xometry 进行 5000 万美元少数股权投资，凸显该市场平台向 AI / 软件平台演进，但不改变其非一体化工厂模型。

              传统机加车间宇宙——数千家私营车间，平均机器稼动率 30%，深度依赖熟练工——是 Hadrian 正在替代的主要既有供给。这些车间掌握当前大部分国防机加工收入，但缺少自动化、规模和培训管线，无法按 DoD
              所需速度扩大产能。
