      - number: '6.5'
        title: 扩张动态与集中风险
        blocks:
          - type: paragraph
            body: >
              Hadrian 的扩张模型是清晰的先落地、再扩张路径：Precision Components 按需 → Manufacturing-as-a-Service（专属产能）→
              Factories-as-a-Service（完整设施运营）。Anduril 关系从精密零件供应开始，扩展到嵌入式 MaaS 产能。Lockheed Martin 正按 2025 年 12 月 MOU
              从按需零件转向嵌入式工厂单元，这是标准向上销售案例。US Navy 则直接进入 FaaS 层级，代表最深度集成的关系层级。


              客户集中是重大反向风险。公开确认客户只有三个，而 Anduril 很可能贡献 2023–2024 年收入的 30–50%（Hadrian 年收入还只有 $3–30M 时，Anduril
              是最早也最具战略性的关系），公司高度暴露于单一客户风险。只要 Anduril 下调采购量——无论原因是 Anduril 自身融资约束、项目取消，还是竞争性重新寻源——Hadrian 收入都会受到重大不利影响。


              Navy Factory 4 是第二条集中风险轴：整座 220 万平方英尺设施都为政府项目下的潜艇零部件生产而建。如果 OBBBA 拨款削减、Navy 项目重组，或采购时间表滑动，承诺投向 Factory 4
              的私人资本（$1.5B）就会利用不足，甚至可能沉没。政府项目风险与商业客户风险在结构上不同——它包含 Hadrian 无法控制的政治、预算和监管变量。


              RTX / Raytheon 可能抵消一部分集中度：如果 RTX Ventures 的投资演变为生产供应关系，Raytheon 会成为第三个大型主承包商锚点。SpaceX、Boeing Defense
              和其他大型主承包商也可能进一步扩展客户基础。不过，截至报告日期，这些关系都没有被确认为生产客户。


              地理集中度是完全的：受 ITAR 约束，仅限美国。行业集中度也极高：只做国防和航空航天。截至报告日期，没有商业航空航天、工业或医疗器械收入。Toarn
              的对抗性分析特别指出，客户集中、行业集中和客户多元化公开证据有限叠加，是投资论断的关键风险。
