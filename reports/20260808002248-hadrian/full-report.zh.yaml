  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与买方画像
        blocks:
          - type: paragraph
            body: >
              Hadrian 的可服务客户范围几乎完全由 ITAR 注册和仅限美国运营决定。三个已确认客户账户均为美国本土实体，管理层也明确表示 Hadrian
              不向海外买家销售。因此，实际可服务市场就是美国国防工业基础——包括防务科技创业公司（Tier 0）、Tier-1 主承包商，以及作为直接买方的美国政府。


              当前主要细分是防务科技创业公司，Anduril Industries 是典型代表。这类公司需要给自主系统、火箭和无人机配套精密机加工零件，节奏快、交期短；相比传统订单式机加工厂，Hadrian
              的自动化、快速周转模型明显更匹配。Anduril 是 Hadrian 首个公开确认的生产客户，双方 2023 年 6 月开启战略制造合作，并将机加工零件交期最高缩短 50%。


              第二个细分是 Lockheed Martin 这类 Tier-1 防务主承包商。这些公司运行 PAC-3、THAAD、PrSM、GMLRS 等超大规模项目，正在探索 Hadrian 的
              Manufacturing-as-a-Service（MaaS）和 Factories-as-a-Service（FaaS）层级，用嵌入式工厂产能服务自身项目。2025 年 12 月 Lockheed
              Martin Missiles and Fire Control 签署的 MOU，是 Tier-1 主承包商愿意把关系从按需零件推进到工厂级集成的最明确信号。


              第三个细分是作为直接买方的美国政府，由 US Navy 2026 年 3 月委托 Hadrian 在 Cherokee, Alabama 建设 Factory 4 锚定。这个 $2.4B 公私合作项目把 Navy
              的 $900M OBBBA 资金和 $1.5B 私人资本合在一起，让 Navy 既是客户，也是 Hadrian 最大制造设施的共同出资方；该设施为 Virginia 级和 Columbia 级潜艇生产零部件。


              商业航空航天（Boeing/Airbus 供应链）和 Tier-2 国防分包商是潜在未来细分，但尚未公开确认。Hadrian 2024 年收购 Datum Source——一款把客户连接到机加工厂的 SaaS
              工具——意味着公司有意扩展 Tier-2 从原型到量产的管线，但目前没有披露具名 Tier-2 客户。
