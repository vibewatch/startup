      - number: '5.7'
        title: 附录
        blocks:
          - type: callout
            title: Opus 数据飞轮才是核心防御引擎
            body: >
              Hadrian 最深的竞争护城河不是 Opus MES 软件本身——原则上它可以被复制——而是随每座新工厂和每个生产项目累积的机器遥测、刀路程序、质量结果和排产历史。每多生产一个零件，AI 排程器报价更准，CV
              QC 系统检验更精细，数字孪生更早发现瓶颈。从零复制 Opus 的竞争对手一开始没有训练数据，面对 Hadrian 既有生产基础会出现持续复利的差距。这个飞轮让 AI
              驱动精密机加工的先发优势比可比软件创业公司更耐久，因为数据在内部生成，外部拿不到。需要警惕的是，目前没有发现专利，因此抵御资金充足的模仿者，法律保护完全取决于商业秘密状态和组织知识留存。
            calloutType: insight
            claimRefs:
              - CE015
              - CE032
              - CE017
          - type: callout
            title: CMMC Level 2 缺口威胁完整 DOD 合同资格
            body: >
              截至 2026 年 Q1，Hadrian 尚未公开确认完成 CMMC Level 2 第三方评估，尽管它运营联网工厂 IoT 基础设施，并处理与多个导弹防御和潜艇项目有关的 Controlled
              Unclassified Information（CUI，受控非密信息）。CMMC Level 2——DFARS 252.204-7021 要求的等级——强制要求 110 项与 NIST SP 800-171
              对齐的网络安全实践，并由 C3PAO（认证第三方评估机构）每三年评估一次。若 Level 2 状态未获确认，随着 2026 年 CMMC 执法推进，Hadrian 可能在某些 DoD
              主承包和分包授予上遇到合同障碍。联网工厂架构会放大风险：IoT 传感器网络、云遥测管道和数字孪生数据流共同形成攻击面，必须先加固才能接受评估。未来 12 个月拿到 CMMC Level 2
              应被视为优先执行事项，而不是行政手续。
            calloutType: risk
            claimRefs:
