  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分和现状替代方案
        blocks:
          - type: paragraph
            body: >
              Hadrian
              的可服务市场是为美国航空航天和国防供应链生产精密机加工金属部件。该市场覆盖五个主要支出类别：（1）飞机结构件（机身框、翼肋、隔框）；（2）推进和发动机部件（涡轮叶片、压气机壳体、燃烧室）；（3）武器和导弹部件（导引头、翼片组件、火箭发动机阀体、作动器壳体）；（4）海军和潜艇精密部件（压力壳体、泵轴、阀歧管、声呐支架）；（5）地面车辆和电子设备精密壳体。公司战略上优先投入（2）、（3）和（4），因为这些类别中当前美国产能与所需产率之间的缺口最尖锐。

              立即可服务市场不包括增材制造（3D 打印）、复合材料制造、大型结构锻件和电子装配；每一类都需要不同的资本设备和制造系统。不过，Hadrian
              的工厂即服务层级最终计划把多种工艺类型纳入同一座自动化工厂，长期会扩大可服务版图。

              国防工业基础（DIB）中 90% 以上企业的现状，是碎片化的中小型机加车间。NDIA 估计，国防工业基础约有 60,000 家公司，其中绝大多数员工少于 20 人。这些车间依赖老化的 CNC
              设备，由经验丰富的机加工技师操作，而其中许多人接近退休。美国精密机加工技师平均年龄超过 45 岁；自 1980 年代以来，该行业约流失 190 万制造工人（航空航天 / 国防特定细分从 300 万降至约 110
              万）。DoD 已明确把这种劳动力流失和产能缺口列为美国军事准备度最紧迫的风险之一。
