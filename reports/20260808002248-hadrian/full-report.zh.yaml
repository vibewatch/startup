      - number: '2.4'
        title: 增长驱动、市场顺风和采用约束
        blocks:
          - type: paragraph
            body: >-
              Hadrian 最主要的增长驱动，是美国 DoD 弹药和武器系统需求与美国国防工业基础现有产能之间急迫且有据可查的缺口；乌克兰、台湾和 AUKUS 潜艇承诺进一步加速了这一缺口。NDIA 的 Vital
              Signs 2024 调研覆盖 1,397 名受访者（568 名政府、829 名私营部门），结果显示，扩大生产产能仍是政府和行业受访者共同认为最重要的工业准备度议题。报告指出，“过去 30
              年里，美国政府在两党共识下，仍未为赢得近似对手冲突所需的工业版图提供足够资源。”

              五个离散催化因素正在拉动近期需求加速：（1）AUKUS：澳大利亚采购 Virginia-class 和 SSN-AUKUS 潜艇，需要大幅扩充美国潜艇部件生产；海军在 Factory 4
              公告中明确表示，至少需要三座 F4 类型自动化工厂才能补上缺口。（2）乌克兰 / 弹药：乌克兰冲突暴露了 155mm 炮弹、GMLRS 火箭和 ATACMS
              导弹产能短缺；美国必须重建库存，同时继续向盟友供货。（3）NDAA 条款：FY2024 National Defense Authorization Act 包含“工业基础再投资”条款，One Big
              Beautiful Bill Act（OBBBA）则设立直接制造基础设施拨款，为 Factory 4 的 9 亿美元海军份额提供资金。（4）国防科技主承包商外包：Anduril、SpaceX
              等公司正在扩大自主系统和运载火箭生产，需要的机加工零件速度已经超出自有制造团队供给能力。（5）后 COVID
              供应链回流：围绕降低国防供应链对单一海外供应商暴露的两党政策共识已经变硬，为本土自动化制造创造监管和采购激励。

              采用约束同样实质存在。ITAR 合规和 DoD Quality Management System（QMS）资质（AS9100D、NADCAP）会让新供应商进入主承包商项目的认证周期达到 12–24
              个月。资本强度很高：Hadrian 每座新工厂成本随规模不同在 2 亿–24 亿美元之间。国防预算不稳定（持续决议、自动削减风险）可能推迟项目资金支持的承诺。而 DoD 传统的最低成本 /
              技术可接受（LCTA）合同框架，会把精密机加工压向商品化，而不是为速度支付溢价。



              第六个催化因素现在也重要：资本市场验证。Hadrian 2026 年 8 月 Series D
              证明，大规模跨界资本和机构资本愿意按基础设施规模为自动化国防工厂融资，这应会加速既有企业形成产能，同时让资本不足的新进入者更难竞争。
