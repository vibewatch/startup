      - number: '7.6'
        title: 缓释措施、论断破裂标准与尽调问题
        blocks:
          - type: paragraph
            body: >
              所有风险类别中的缓释措施设计上可信，但在 Hadrian 目标规模上证明程度不均。ITAR 合规项目覆盖最高严重度监管风险，且 Hadrian 未见 DDTC
              执法记录，降低了发生概率。不过，公司运营扩张，尤其是在 Alabama 招聘并让数百名新员工接触出口管制技术数据和硬件，会显著扩大 ITAR 风险面。监测指标包括：DDTC 禁入名单发布、CMMC 自我证明的季度
              SPRS 分数更新，以及四座设施的 AS9100D 证书公开注册信息。

              运营风险的论断破裂标准更具体。Factory 4 从 2026 年 3 月开业起进度滑动超过 12 个月、DCSA 审计发现导致项目暂停，或任何设施 CMMC Level 2
              评估失败，都应构成论断破裂事件，需要投资人立即复核。CNC 供应中断可借 Haas/DMG Mori 财报电话会和交期披露监测，并辅以卫星图像或 Cherokee, AL 施工许可活动跟踪 F4 设备安装进度。

              财务论断破裂标准包括：（1）$1.5B F4 私人资本承诺被披露含有使股权次级化的债务；（2）Anduril 收入因不续约而非多元化降至总收入 20% 以下；或（3）Factory 4
              开业后收入爬坡滞后，同时经营亏损持续高于每年 $100M。关键尽调问题包括：经审计的 ITAR 技术控制计划、所有设施 AS9100D 证书编号、CMMC 评估时间表和 SPRS 分数、Factory 4
              施工计划和里程碑结构、Anduril 与 Navy 收入占总收入百分比，以及 $1.5B F4 私人资本承诺的法律结构。
