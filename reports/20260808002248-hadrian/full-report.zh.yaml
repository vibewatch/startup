      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              三种情景仍有用，但现在必须放在 $7.87 billion 入场价下判断，而不是旧的 $1.6 billion 估值。


              悲观情景（约 25% 概率）：Factory 4 认证慢于预期，收入增长落后于产能建设，下一次有标价的融资或流动性事件把公司重估到 $2–4 billion。这仍是一家重要公司，但相对 Series D
              价格会是大幅减记。


              基准情景（约 50% 概率）：Hadrian 把 Alabama 和未来工厂版图转成真实的规模化生产，在 2027–2028 年披露显著改善的收入，并通过后期私募轮、二级交易或战略进程获得 $5–9
              billion 的价值区间。这意味着相对 Series D 大致持平到小幅上行。


              乐观情景（约 25% 概率）：Hadrian 证明 Opus 和工厂模型能够在全国规模支撑多条产品线，年收入达到数亿美元且利润率可见，并具备 IPO 可信度或成为战略上不可或缺的资产。若如此，$12–20
              billion 结果具备可能性；但即使在乐观情景下，倍数扩张也远低于上一份报告，因为大量上行已经被计入 2026 年 8 月价格。
