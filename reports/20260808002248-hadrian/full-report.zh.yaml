      - - Navy Factory 4 单一项目依赖
        - 整个 2.2M sqft Factory 4 绑定潜艇部件需求；OBBBA 政府出资 $900M
        - 项目取消或 OBBBA 被撤回，会让 $1.5B 私人资本承诺搁浅
        - 高
        - 跟踪 OBBBA 拨款状态；审查 Navy 潜艇建造速度、Columbia-class 项目进度和 DoD 造舰预算
      - - 落地扩张式追加销售轨迹
        - Anduril：零部件 → MaaS。Lockheed：零部件 → MaaS/FaaS（MOU）。Navy：直接 FaaS。
        - 正向：单客户 ACV 提升，可降低流失风险并改善单位经济模型
        - 低（机会而非风险）
