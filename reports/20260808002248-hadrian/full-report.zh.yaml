  - id: TR005
    title: 缓释与论点破裂标准表
    type: enum
    coverage: partial
    enumerationScope:
      coverage: partial
      basis: >-
        Thesis-break criteria and mitigations derived from risk register analysis and standard defense-tech investor
        diligence frameworks; Hadrian's internal risk management plans are not publicly disclosed.
    rowCount:
      minimum: 3
    summary: >-
      Eight risk scenarios with monitorable triggers, thesis-break thresholds, and investor action implications.
      Designed as a diligence monitoring tool aligned with the severity-ranked risk register.
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - ITAR / 出口管制违规
        - DDTC 禁入名单；Federal Register 执法通知；Hadrian 新闻稿；自愿披露文件
        - 针对 Hadrian 或具名员工的任何 DDTC 执法通知、自愿披露文件或禁入行动
        - 立即暂停投资；要求提交带时间表的书面整改计划；通知 LP 法律顾问；事件后 24 个月监测 DDTC 民事处罚登记
      - - CMMC Level 2 评估失败
        - CMMC 评估结果；DoD SPRS 门户；C3PAO 认证通知；OBBBA 里程碑报告
        - Hadrian 收到有条件拒绝、任何设施未通过 Level 2 C3PAO 评估，或 OBBBA 合同因等待 CMMC 整改而暂停
        - 在整改时间表明确前暂停投资；评估影响范围和 DoD 项目影响；要求管理层就整改里程碑出具声明函
      - - Factory 4 进度延误 > 12 个月
        - 施工许可动态（Cherokee, AL 公开记录）；F4 场地卫星图像；Navy 新闻稿；Hadrian 博客或公关公告
        - F4 全面投产日期延后至 March 2027 之后，或 Navy OBBBA 里程碑付款延迟 >90 天
        - 要求更新 F4 进度表和美国海军里程碑状态；评估营运资金影响；考虑将后续资本承诺按里程碑分批拨付
      - - Anduril 收入集中度连续两个季度 >40%
        - 季度管理报告；Anduril 融资新闻；公开 DoD 公告中的 Anduril 项目赢单或失单
        - 任何连续两个季度，Anduril 占 Hadrian 收入 >40%，且管线中没有可信的多元化客户来抵消
        - 要求提交客户多元化路线图，列明目标客户和时间表；考虑在下一轮融资中加入保护性条款
      - - 美国海军取消 OBBBA 或启动不可抗力
        - NDAA 修正案；美国海军新闻稿；DoD 项目办公室公告；OBBBA 修正案文件
        - 美国海军正式撤回、实质重组，或就对 Hadrian 的 $900M OBBBA 承诺援引不可抗力
        - 击穿投资论点的触发项：F4 经济性依赖美国海军 $900M 资本；重估所有 DCF 情景；若未获得替代承诺，180 天内启动退出规划
      - - 质量逃逸导致 DoD 项目取消资格
        - DCSA / DCMA 审计通知；客户 RMA 模式；AS9100D 监督审计结果；Aviation Week 和 Defense News 的零件故障报道
        - 已确认 DoD 量产零件发生质量逃逸，导致项目资格被取消、触发 DCSA 审计，或收到主承包商正式纠正措施要求
        - 暂停追加资本投放，直到根因分析完成；要求独立 AS9100D 审计；评估项目恢复资格时间线和收入影响
      - - Chris Power 离任或无法履职（>90 天）
        - 反映新投资者牵头方的 SEC Form D 文件；公司新闻稿；LinkedIn 动态和投资者沟通
        - Power 卸任 CEO 且未指定合格继任者，或在无解释情况下 >90 天缺席公开 / 投资者活动
        - 创始人依赖型投资论点的击穿触发项；加速继任尽调；评估董事会构成和临时 CEO 能力
      - - 国防预算封存或锚定项目削减 15%+
        - OMB 总统预算；NDAA 协商报告；持续决议公告；Lockheed MFC 财报电话会
        - DoD 正式宣布将 Virginia 级或 Columbia 级潜艇项目，或 Anduril 主要国防科技项目组合削减 15%+
        - 按低收入情景重估 DCF 模型；找出非海军收入替代路径；评估国防预算替代项能否在 24 个月内补上
    notes: 所有触发项都设计成无需内部访问、仅靠公开来源即可观察。击穿投资论点的标准具有累积性：若同时出现两个或以上触发项，投资者行动的紧迫性会显著上升。
