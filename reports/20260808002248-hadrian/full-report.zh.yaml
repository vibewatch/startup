        - 项目节奏、预算噪音和资质认证周期可能让收入兑现慢于估值曲线
        - 签约在手订单或披露当前收入，证明市场正在转化为规模化产能
      - - 产品 / 技术
        - Opus 加四地工厂网络拼出差异化运营栈，短期看难以快速复制
        - 只有软件和流程主张在多工厂、多产品线规模下站得住，护城河才值这个价格
        - 对更大网络进行独立产能 / 质量审计
      - - 客户
        - Anduril、美国海军和 Lockheed MFC 提供高要求锚定客户验证
        - 公开客户证据仍然集中；叙事扩张已经快于披露客户广度
        - 更多具名量产客户，以及无单一账户主导收入的证据
      - - 财务
        - Series D 轮降低近期流动性风险，并为进一步扩建提供资金
        - 2025–2026 年收入、毛利率、烧钱速度和优先权结构数据仍未披露
        - 当前经营指标，加上能从基本面证明本轮合理的股权结构表细节
