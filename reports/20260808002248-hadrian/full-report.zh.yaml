      - number: '3.2'
        title: 竞争对手能力对比
        blocks:
          - type: paragraph
            body: >
              将 Hadrian 与最接近的竞争对手并排比较，可以看到替代方案在自动化深度、国防资质和量产级产能上存在系统性缺口。

              在 AI 自动化 CNC 编程上，Hadrian 的 Opus 平台能在数分钟内根据零件几何文件自动生成机床程序；Xometry
              提供报价自动化，但依赖第三方供应商解读并为每个订单编程；传统机加车间完全依赖经验丰富的机加工技师手工编程（中位年龄 45 岁以上）。Divergent Technologies 的 AI
              自动化用于增材制造的拓扑优化，而不是减材 CNC。

              在 ITAR 和国防资质上，Hadrian 的工厂基础设施已完成 ITAR 注册，并围绕国防级质量管理（AS9100D / NADCAP 路径）设计，Factory 4
              更是在美国海军直接公私合作下运营。Xometry 具备市场平台层面的 ITAR 处理能力，但无法保证其网络中每个供应商都符合 ITAR 设施要求。传统机加车间差异很大——有些已注册 ITAR，大多数没有
              NADCAP 认证。Protolabs 的产线是商业级，不是国防认证产线。

              在生产规模上，Hadrian 的工厂模型针对高产量、长周期生产而设计（每个项目每月 1,000–10,000+ 件），不是原型或一次性订单。该模型契合 DoD
              对持续提升产率的需求，而不是工程样件需求。Xometry、Protolabs 和多数机加车间服务范围从原型到小批量都有；没有一家展示出 Hadrian 已为军工生产合同搭建的工厂级运营模型。

              配套矩阵（FP002）中的功能广度评分基于公开证据评估；标记为“Unknown”的单元格代表公开证据缺口，而不是确认缺少能力。
