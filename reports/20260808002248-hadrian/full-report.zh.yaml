      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >
              Cherokee, Alabama 的 Factory 4 是 Hadrian 最集中的运营风险。它面积 220 万平方英尺，约为 Factory 1-3 合计面积的 8 倍，并锚定 $2.4B
              公私承诺；施工、设备采购、员工爬坡或项目资质认证只要出现重大延误，都会直接损害整个投资论断。CNC 机床采购是最直接瓶颈：Haas Automation、DMG Mori、Mazak、Okuma
              的高精密加工中心有 12-24 个月的有记录交期。Factory 4 的设备需求可能达到数百台；公司没有公开说明 F4 采购时间表或供应商承诺。

              质量风险是所有 AS9100D 国防供应商的结构性风险。一次确认的质量漏失若影响 DoD 生产项目，可能触发 DCSA/DCMA 审计、项目失格或供应商状态临时暂停。Hadrian 的自动化 CMM
              检验确实能缓释风险，但尚未在所有项目类型上经过独立验证，公司也没有披露返工率或不符合历史。对于一家处在 Series C（$1.6B
              估值）的公司，一次高曝光质量事件会给主承包商关系造成不成比例的声誉损害；这些客户记忆长，供应链治理保守。

              网络安全是横贯运营的风险。Hadrian 的 Opus AI MES 平台把运营技术（OT，即 CNC 机器控制）与 IT 基础设施连接起来；这种 OT/IT 融合，是瞄准美国国防工业基础的国家级 APT
              的公开重点目标。DISA STIG 合规和 CMMC Level 2 控制提供框架，但 Hadrian 没有披露 Opus 平台的网络安全态势、事件历史或 STIG
              合规状态。员工规模风险是次级运营担忧：Hadrian 的 30 天培训流程在 500 人以下规模有效运行，但 Factory 4 目标是 1,000-2,000
              名员工；该规模下培训质量下降，可能同时损害安全指标和产品质量。
