      - number: '5.3'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >
              Opus 最适合被理解为专门打造的 MES + APS 组合；它不是卖给外部客户的企业软件，而是从零开始为 Hadrian 自己的高混合精密机加工环境设计。核心层面，AI
              调度器读取客户工程图纸，选择工艺和材料，生成刀路和 CNC 程序，再用优化算法在多轴 CNC 机群中分配机时，压低换型时间、拉高吞吐量。数字孪生持续建模车间实时状态——机器占用、WIP
              位置、刀具剩余寿命——让系统能预测排程，并在瓶颈影响交付承诺前提前识别。


              计算机视觉质检在加工检查点执行过程内尺寸检测，替代或补充人工坐标测量机（CMM）检验，覆盖相当一部分质量流程。每次检验都会生成绑定零件序列号或批次的数字质量记录，支撑 AS9100D 追溯要求，并产出
              AS9102 首件检验文件。IoT 传感器网络监测 CNC
              机群的主轴振动、冷却液液位、刀具磨损特征和机器健康参数，喂给预测性维护模型，以减少计划外停机。自动化物料搬运——很可能使用机器人托盘和夹具系统——跟踪在制品，并在无需人工搬运的情况下把坯料送到机器旁，进一步压低单件人工含量。Hadrian
              尚未公开确认具体 CNC 设备 OEM（Haas Automation、DMG Mori、Mazak 等在行业里都合理）和自动化供应商。
