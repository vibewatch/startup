      - number: '1.5'
        title: 地理版图和员工队伍
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 8 月，Hadrian 的制造版图横跨加州、亚利桑那州和阿拉巴马州。公司称目前运营四处设施，总面积略低于 300 万平方英尺：两处位于南加州，一座 270,000 平方英尺工厂位于亚利桑那州
              Mesa，另有一座新的潜艇部件工厂位于 Alabama 的 Muscle Shoals/Cherokee 地区。阿拉巴马基地仍然是网络中规模最大的设施，也是 Hadrian
              主张自己能为关键海军项目工业化生产的核心支撑。


              公司也在用新资本扩展到潜艇部件和精密机加工零件之外的更多产品线，尤其是弹药和自主系统。新产品线会扩大未来工厂的地理和技术范围，但也提高执行复杂度，因为每座新设施都必须在压缩时间内完成设备、员工、项目资质和营运资金安排。


              Hadrian 继续强调招聘和技师股权，但 Series D 材料没有公布当前员工人数。最新公开员工数据仍是 2026 年第一季度的第三方早期估计，因此员工规模只能视为方向性增长，不能视为精确确认。
