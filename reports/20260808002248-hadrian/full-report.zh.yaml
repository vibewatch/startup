      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              International Traffic in Arms Regulations（ITAR，国际武器贸易条例，22 CFR 120-130）管辖 Hadrian
              的全部国防生产运营。作为飞机、导弹、海军舰艇和其他国防物项精密零部件制造商，Hadrian 必须维持有效 DDTC 注册，执行技术控制计划，按 US Person
              身份筛查所有员工和访客，并为任何国防物项或技术数据出口、再转让取得许可。ITAR 违规最高可承担 20 年监禁的刑事处罚，以及每项违规最高 $1.3M 的民事罚款。截至 2026 年 Q1，公开来源没有披露
              Hadrian 受到任何 DDTC 执法行动或主动披露。

              32 CFR Part 170 下的 CMMC（Cybersecurity Maturity Model Certification，网络安全成熟度模型认证）于 2024 年 12 月定稿，要求涉及
              Controlled Unclassified Information（受控非密信息）的 DoD 合同达到 Level 2 认证。Hadrian 为潜艇零部件（Virginia 级和 Columbia 级）服务的
              Navy OBBBA 合同几乎肯定触发 Level 2 要求，迫使 Hadrian 完成第三方 C3PAO 评估。公开 SPRS 门户只能有限验证自我证明分数；Hadrian 没有披露任何设施的 CMMC
              评估时间表或 SPRS 分数。Alabama 的 Factory 4 还需要单独界定 CMMC 范围。

              Hadrian 在公司材料中声称拥有 AS9100D 质量管理认证。该标准管辖航空航天质量体系，并要求年度监督审核；审核失败或不符合项可能触发认证暂停。没有独立来源确认 AS9100D 在 Hadrian
              四座设施中的覆盖范围。OSHA 29 CFR 1910 和 EPA RCRA 危险废物法规适用于所有制造地点；Hadrian 没有披露可记录事故率或环境合规记录。NLRB 组织化风险潜伏但真实：408
              人员工分布在 California 和 Alabama，两州劳动力市场条件不同，带来工会组织活动的潜在敞口。
