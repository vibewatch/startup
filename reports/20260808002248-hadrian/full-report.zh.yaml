  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户流程
        blocks:
          - type: paragraph
            body: >
              Hadrian 的商业产品分为两层，服务航空航天和国防客户。第一层 Precision Components 是按需、固定价服务：客户把工程图纸提交到 Hadrian 数字门户，几分钟内拿到 AI
              报价，而传统机加工厂通常要几天到几周；客户随后按长期供应协议下采购订单。Hadrian 负责制造零件，并随货提供完整 AS9100D 质量记录。第二层
              Manufacturing-as-a-Service（MaaS）在多年合同下提供专属加工产能，等于 Hadrian 代表客户运营其工厂网络中预留的一部分产能。第三层
              Factories-as-a-Service（FaaS）则在大客户现场或附近部署一座由 Hadrian 运营的完整工厂；Factory 4（Cherokee, AL）是第一个已确认 FaaS 实例，由 US
              Navy 在 OBBBA 框架下锚定。


              已确认商业客户包括 Anduril Industries（战略合作伙伴）、Lockheed Martin Missiles and Fire Control（2025 年 12 月签署 MOU，覆盖
              PAC-3、THAAD、PrSM、GMLRS 零部件供应）和 US Navy（Factory 4 承包商关系）。按 Forbes 报道的公司口径，Hadrian 约 80% 收入来自多年生产合同（3–7
              年），可见度强，现货市场敞口有限。公司披露 2023 年收入约 $3M、2024 年约 $30M——同比增长 10×——并称 2025 年仍在高速增长。
