  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险全景概览
        blocks:
          - type: paragraph
            body: >-
              Hadrian 的风险画像在风险投资支持的创业公司里并不常见：范围广，结构性严重程度高。不同于软件公司，Hadrian
              的核心业务需要持续满足联邦监管合规（ITAR、CMMC、AS9100D），投入前所未有规模的实物资本（Factory 4：220
              万平方英尺、$2.4B），依赖由国防预算周期锚定的集中客户基础，并由一名创始人驱动所有机构关系。

              五个主导风险类别是：（1）监管与法律风险，ITAR 不合规或 CMMC 失格可能让 Hadrian 被所有 DoD 合同排除；（2）运营风险，Factory 4 执行失败、CNC
              供应中断或质量漏失可能同时损害收入和声誉；（3）伙伴与依赖风险，Anduril 集中度和 Navy OBBBA 连续性是近期生死攸关的依赖；（4）财务与模式风险，极高资本强度、不透明的 F4
              资本结构和未披露现金消耗率制造资产负债表不确定性；（5）人员与执行风险，单一创始人依赖、员工快速扩张，以及未经 F4 规模验证的培训流程，都是结构性脆弱点。

              本章按四级量表校准风险严重程度：致命（足以让公司或项目终止）、高（重大收入或财务损害）、中（显著扰动）和低（可用当前资源管理）。发生可能性按当前轨迹下 3 年周期内的概率衡量。



              2026 年 8 月 Series D 降低了一个子风险，同时加剧另一个。近期融资风险下降，因为 Hadrian
              现在有大量新股权资金；但估值和预期风险显著上升：任何吞吐量不达标、质量事件或项目资质延误，都会撞上大得多的资本化叙事。
