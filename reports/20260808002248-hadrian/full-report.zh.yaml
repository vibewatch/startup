      - number: '1.3'
        title: 融资历史、投资方和估值
        blocks:
          - type: paragraph
            body: >-
              Hadrian 的融资历史已从种子轮延伸到 Series D。公司在 2022 年完成约 9000 万美元 Series A，2024 年 2 月完成 1.17 亿美元 Series B，2025 年 7 月宣布
              2.6 亿美元 Series C；SEC Form D 文件显示，Series C 最终通过两笔分批交易售出约 2.92 亿美元证券。2026-08-06，Hadrian 宣布以 78.7 亿美元估值完成
              13.7 亿美元 Series D，较此前 16 亿美元 Series C 估值标记接近 5 倍跳升。


              Series D 投资阵容显著超出传统风投圈。该轮由 WCM Investment Management、Washington Harbour Partners、Valor Equity Partners、137
              Ventures 和 Baillie Gifford 联合领投，JPMorganChase 的 Strategic Investment Group 作为锚定联合领投方参与。Morgan Stanley
              Wealth Management、Apollo 管理的基金、T. Rowe Price Associates 顾问账户、CapitalG、Andreessen Horowitz、Founders
              Fund、Lux Capital、Altimeter、Construct Capital 和 1789 Capital
              也参与其中。这一组合的重要性不只在于资金供给，还在于它引入了跨界资本和后期机构资金；这类资金通常出现在公司从风投叙事承销转向具备 IPO 选择权的规模化阶段时。


              结合此前公开轮次披露和 Series D 公告，Hadrian 公开披露的累计资本现在约为 20 亿美元，尚未计入海军为 Factory 4 单独提供的 9 亿美元公共资金。管理层称，新融资将用于新工厂、扩大
              R&D，以及提升弹药和自主系统生产能力。公司仍未公开说明清算优先权、是否包含老股转让，或支撑 Factory 4 的私募资本具体结构；此前只披露过与 Series C 相关的 Morgan Stanley
              设施贷款。
