      - number: '8.6'
        title: 退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Hadrian 目前最可行的退出路径包括：（1）从跨界融资走向公开市场，等收入和利润率披露成熟后进入 IPO
              准备状态；（2）被寻求主权制造能力的国防或工业买家大额战略收购；（3）带有二级交易成分的更多后期私募流动性。2026 年 8 月 Series D 让每条路径都比一年前更可信，但并不让任何路径变成必然。


              下一次更新的关键问题，不是 Hadrian 能否再次融资，而是公司能否长进当前估值，并让新投资者拿到有吸引力的条款。也就是说，公司需要证明当前收入规模、利润率结构、Factory 4
              利用率，以及符合公开市场预期的治理和报告成熟度。
