      - - 披露毛利率低于 25%
        - 经审计报表、数据室或媒体中任何可靠披露显示毛利率 <25%
        - 削弱单位经济性叙事；说明当前规模下成本结构差异化不足
        - 重估溢价倍数；重校到 8–12× 收入；要求详细工厂级成本结构
      - - 下一次标记融资或流动性低于 $7.87B
        - 任何可靠的标记交易、二级交易或 IPO 区间低于 Series D 轮估值
        - 表明市场不支持当前私募估值
        - 按新的清算价格重估持仓；将其视为 Series D 轮跑过基本面的证据
      - - 单一客户收入占比超过 50%
        - 任何可靠迹象显示某一客户（包括 Anduril）超过 2025–2026 年收入的 50%
        - 极端集中度风险；失去该锚定客户可能危及公司生存
        - 在交易条款中加入收入集中度约束条款；触发信息披露治理权
      - - 美国海军取消或实质削减 OBBBA 承诺
        - 美国海军或国会正式通知削减或取消 OBBBA
        - F4 项目可行性坍塌；$1.5B 私人资本承诺面临风险；整个 F4 论点失效
        - 立即评估退出；投资论点击穿；密切跟踪国防拨款协调流程
      - - 竞争对手以更低成本达到可比开机率
        - 媒体核实或审计确认的竞争对手，在国防级 CNC 中达到 75%+ 开机率，且单件成本更低
        - 侵蚀主要运营护城河；若没有产品差异化，53× 入场倍数无法辩护
        - 委托独立开机率审计；重评技术护城河溢价；考虑倍数压缩
      - - Chris Power 作为唯一 CEO / 创始人离任
        - 公开宣布辞任、失去履职能力，或治理变更使 Power 不再负责日常运营
        - 单一创始人依赖落地成风险；未披露继任计划，也没有共同创始人兜底
        - 要求治理兜底条款；聘任 COO 或共同创始人作为继续持有的前置条件
    notes: 触发阈值是监控指引，不是自动动作。每个触发项都应放在完整语境下评估。下轮融资和美国海军取消接近自动击穿论点；其他触发项需要判断。
