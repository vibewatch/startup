              - CR030
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              以 $7.87 billion 估值投资
              Hadrian，核心论点建立在五个相互咬合的支柱上。第一是市场：美国国防精密制造长期产能不足，潜艇、导弹和自主系统项目继续拉动本土供应链扩产需求。第二是产品差异化：Hadrian 的 Opus
              制造平台在排程、检测和一线员工赋能上仍显出明显差异。第三是客户验证：Anduril、U.S. Navy 和 Lockheed Martin MFC
              仍是强有力的公开证明，尽管披露的客户面还很窄。第四是融资能力：2026 年 8 月 Series D 显著降低短期资产负债表风险，让 Hadrian
              有资源继续建厂，而竞争者很难筹到同等资本。第五是机构背书：新投资者组合让 Hadrian 更有希望进入 IPO 准备状态，或拿到溢价战略退出。


              反向论点比上一份报告更尖锐，因为估值跑得比披露更快。在 $7.87 billion 估值下，公司相当于 2024 年最后披露收入约 ~$30 million 的约 262x。即便 2025–2026
              年实际收入大幅更高，公开投资者仍缺少判断这一轮价格到底计入一轮、两轮还是三轮完整工厂周期未来增长的数据。毛利率、烧钱速度、现金转化、Series D
              优先权结构以及未来工厂资本的具体结构仍不透明。公司或许确实配得上溢价倍数，但公开证据还不足以让人高信心承销这个价格。
