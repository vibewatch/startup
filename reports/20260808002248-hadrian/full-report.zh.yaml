      - number: '8.2'
        title: 建议与信心
        blocks:
          - type: paragraph
            body: >-
              基于截至 2026 年 8 月可获得的证据，研究团队对 $7.87 billion Series D 价格下的新资本给出 RESEARCH-MORE
              建议。这不是对公司质量的负面判断。自上一份报告以来，Hadrian 已开出新工厂，吸引更深的投资者基础，并延伸生产范围，战略位置明显改善。问题在估值纪律：公开市场式价格先到了，公开市场式财务披露还没跟上。


              风险评级仍为 HIGH。主导风险包括：（1）执行风险——公司必须证明 Alabama 工厂和未来工厂能够按规模完成认证并爬坡；（2）披露风险——2025 和 2026
              年收入、毛利率、烧钱速度以及优先权结构细节仍缺位；（3）集中度风险——公开客户证明仍集中在三组锚定关系；（4）资本结构风险——支撑工厂网络的私有 / 公共资金组合仍未完全透明。


              对 RESEARCH-MORE 立场的信心为中等。Series D 消除了短期融资疑虑，但也抬高了证明当前估值合理所需的证据门槛。转向正面承销判断仍有路径，但需要当前经营指标、更清晰的股权结构表和融资披露，以及
              Factory 4 正在把产能转成合格、可重复生产的证据。
