      - number: '1.5'
        title: Geographic Footprint and Workforce
        blocks:
          - type: paragraph
            body: >-
              Hadrian's manufacturing footprint spans California, Arizona, and Alabama as of August 2026. The company
              says it now operates four facilities covering just under 3 million square feet: two Southern California
              sites, a 270,000-square-foot factory in Mesa, Arizona, and the new Alabama submarine-components plant in
              the Muscle Shoals/Cherokee area. The Alabama site remains by far the largest facility in the network and
              is central to Hadrian's claim that it can industrialize production for critical Navy programs.


              The company is also using its new capital to expand into additional product lines beyond submarine
              components and precision machined parts, especially munitions and autonomous systems. This broadens the
              geographic and technical scope of future factories, but it also raises execution complexity because each
              new facility requires equipment, workforce, program qualification, and working capital on compressed
              timelines.


              Hadrian continues to emphasize hiring and technician equity, but it has not published a current employee
              count in the Series D materials. The latest public workforce datapoint remains earlier third-party
              estimates from Q1 2026, so workforce scale should be treated as directionally growing rather than
              precisely confirmed.
