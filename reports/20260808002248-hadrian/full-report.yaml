      - number: '8.6'
        title: Exit Readiness and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Hadrian's most plausible exit paths are now: (1) a crossover-to-public path culminating in IPO readiness
              once revenue and margin disclosure mature, (2) a large strategic acquisition by a defense or industrial
              buyer seeking sovereign manufacturing capacity, or (3) additional late-stage private liquidity with
              secondary components. The August 2026 Series D makes each route more believable than it was a year
              earlier, but it does not make any route inevitable.


              For the next refresh, the critical question is not whether Hadrian can raise money again. It is whether
              the company can grow into the current valuation on terms attractive for new investors. That means proving
              current revenue scale, margin structure, Factory 4 utilization, and governance/reporting maturity
              consistent with public-market expectations.
            claimRefs:
