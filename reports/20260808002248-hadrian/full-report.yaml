      - number: '8.3'
        title: Valuation Context and Current Round
        blocks:
          - type: paragraph
            body: >-
              Hadrian's current valuation context is defined by the August 2026 Series D rather than the July 2025
              Series C. The new round raised $1.37 billion at a $7.87 billion valuation and was co-led by WCM Investment
              Management, Washington Harbour Partners, Valor Equity Partners, 137 Ventures, and Baillie Gifford, with
              JPMorganChase's Strategic Investment Group as anchor co-lead. The investor list also included Morgan
              Stanley Wealth Management, Apollo-managed funds, T. Rowe Price-advised accounts, CapitalG, Andreessen
              Horowitz, Founders Fund, Lux Capital, Altimeter, Construct Capital, and 1789 Capital.


              The scale jump matters. The new mark is roughly 4.9x the prior Series C valuation in just over a year.
              Using the last clearly disclosed revenue figure (~$30 million in 2024) as a denominator implies a multiple
              of roughly 262x trailing revenue, which is not a usable underwriting metric so much as a reminder that
              investors are paying for multi-cycle future capacity rather than current disclosed earnings power. Put
              differently: to support today's $7.87 billion mark at 15-20x forward revenue, Hadrian likely needs on the
              order of $400-525 million of annual revenue plus a credible margin profile.


              That revenue may be achievable if the company successfully converts its factory footprint and product
              expansion into scaled programs, but public evidence has not caught up. Without current revenue, gross
              margin, cash-burn, and preference-stack disclosure, the Series D should be read as a powerful market
              signal rather than as independently validated fair value.
