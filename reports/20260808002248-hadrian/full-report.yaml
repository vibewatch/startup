              detail: >-
                Allocates and sequences jobs across machine fleet using optimization algorithms; minimizes changeover;
                generates CNC programs from drawings
            - label: Digital Twin Engine
              detail: >-
                Real-time factory state model tracking machine occupancy, WIP location, and tool life; predicts
                bottlenecks before they impact delivery
            - label: Automated Quoting Engine
