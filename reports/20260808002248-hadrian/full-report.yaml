companyProfile:
  summary: >-
    Hadrian is a South Bay Los Angeles manufacturing company founded in 2020 by Chris Power to rebuild U.S. industrial
    capacity with software-defined factories. Its Opus automation stack powers a network of four facilities that produce
    precision parts and increasingly full mission-critical systems for defense and aerospace programs. After opening
    major sites in Mesa, Arizona and Alabama, Hadrian raised a $1.37 billion Series D at a $7.87 billion valuation in
    August 2026, giving it unusual scale and investor depth for a manufacturing startup.
  foundedDate: '2020-01-01'
  founders:
    - name: Chris Power
      role: Founder and CEO
      background: >-
        Australian-born founder who built Hadrian around the thesis that U.S. defense manufacturing needs highly
        automated, software-defined factories rather than fragmented job shops.
      claimRefs:
        - CO001
        - CO009
  foundingLocation: Los Angeles South Bay, California, USA
  headquarters: Torrance, California, USA
  productSummary: >-
    Hadrian sells precision components, dedicated manufacturing capacity, and factories-as-a-service powered by Opus,
    its internal AI operating system for quoting, scheduling, machining, inspection, and workforce enablement.
  customerFocus: >-
    U.S. defense technology companies, Tier-1 defense primes, and government-backed industrial programs needing rapid,
    domestic precision manufacturing capacity.
  businessModel: >-
    Capital-intensive contract manufacturing and factory operations. Revenue comes from on-demand parts, multi-year
    dedicated-capacity agreements, and deeper factory-services deployments; software value is captured through internal
    operations rather than external licensing.
  stage: Series D private
  fundingStatus: >-
