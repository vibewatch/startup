          unit: score
          note: $7.87B is difficult to justify on disclosed fundamentals alone
        - label: Team and Founder Quality
          value: 7/10
          unit: score
          note: Strong founder-led vision with persistent key-person risk
        - label: Evidence Quality
          value: 4/10
          unit: score
          note: Company quality signal is better than valuation-evidence quality
