              added $1.37 billion of fresh equity capital at a $7.87 billion valuation. Combining that raise with the
              previously disclosed ~$625 million of funding implies roughly $2.0 billion of lifetime disclosed private
              capital before counting the Navy's separate $900 million public commitment for Factory 4.


              The investor mix also changed. Earlier rounds were dominated by venture and strategic capital; the Series
              D added WCM Investment Management, Washington Harbour Partners, Valor Equity Partners, Baillie Gifford,
              JPMorganChase's Strategic Investment Group, Morgan Stanley Wealth Management, Apollo-managed funds, T.
              Rowe Price accounts, and CapitalG. This materially lowers near-term financing risk for equipment
              purchases, factory launches, and working-capital support, but it also raises the expectation that Hadrian
              eventually provides public-market-grade reporting discipline.


