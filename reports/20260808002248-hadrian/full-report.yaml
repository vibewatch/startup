  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision flow from scale gains and financing strength into a RESEARCH-MORE recommendation at the $7.87 billion
      Series D entry.
    data:
      nodes:
        - id: n1
          label: Scale Evidence
          detail: >-
            Four-site footprint, just under 3M sq ft, and much deeper capital base; last clearly disclosed revenue still
            ~$30M for 2024
        - id: n2
          label: Market Tailwinds
          detail: $50B+ TAM; DoD domestic manufacturing mandate; bipartisan defense modernization
        - id: n3
          label: Product Moat
          detail: Opus MES; 75–80% machine uptime vs. 40–50% industry; 10 machines per worker
        - id: n4
          label: Customer Validation
          detail: Anduril anchor customer; Navy OBBBA $900M; Lockheed Martin MFC MOU Dec 2025
        - id: n5
          label: Financial Opacity Risk
          detail: No audited financials; gross margin unknown; burn undisclosed; 2025 revenue not confirmed
        - id: n6
          label: Capital Structure Risk
          detail: Series D lowers financing stress but preference-stack and future factory-capital structure remain opaque
        - id: n7
          label: 'Recommendation: RESEARCH-MORE'
          detail: >-
            At $7.87B the price outpaces public evidence; require current revenue, margin, and capital-structure
            disclosure before underwriting
    claimRefs:
