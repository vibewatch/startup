  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    caption: >
      How defense customers at each tier discover, evaluate, qualify, contract with, and expand their Hadrian
      relationship — from initial awareness through multi-year production partnership and FaaS deployment. All three
      named customer segments follow materially different entry points but converge on the same long-term production
      contract endpoint.
    data:
      nodes:
        - id: n1
          label: Discovery / Referral
          detail: >-
            Defense prime or startup identifies machining capacity gap; hears about Hadrian via CEO network,
            defense-tech cohort, or peer referral
        - id: n2
          label: RFQ / Automated Quote
          detail: >-
            Prospect submits drawing; Hadrian Opus platform returns automated quote in minutes vs. days for legacy job
            shops; pricing and lead time comparison triggers engagement
        - id: n3
          label: Technical Qualification
          detail: >-
            AS9100D audit; first article inspection; quality plan review; typically 3–9 months for defense-grade parts;
            Hadrian accelerates via Opus inspection automation
        - id: n4
          label: Pilot / Initial Production
          detail: >-
            Initial purchase order for small-batch production; customer validates repeatability, tolerance, and delivery
            at volume; may include 9-month validation phase
        - id: n5
          label: Production Contract Award
          detail: >-
            Multi-year production SOW or blanket purchase agreement awarded; 80% of Hadrian revenue tied to 3–7 year
            contracts; customer locks capacity and pricing
        - id: n6
          label: MaaS Expansion
          detail: >-
            Customer upgrades from on-demand parts supply to dedicated MaaS cell — Hadrian operates a reserved machining
            capacity block for the customer's program schedule
        - id: n7
          label: FaaS / Factory-as-a-Service
          detail: >-
            Deepest integration: Hadrian designs, builds, and operates an entire factory for the customer at or near
            customer site (e.g., Lockheed Martin MFC MOU Dec 2025; Navy Factory 4)
    claimRefs:
      - CU006
      - CU008
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    caption: >
      Estimated defense customer acquisition funnel from total addressable US defense industrial base through
      qualification, production contract, and long-term FaaS deployment. Funnel reflects structural constraints: 12–24
      month procurement cycles, AS9100D qualification requirements, and ITAR-limited addressable market. Values are
      research-team estimates; Hadrian has not disclosed pipeline or conversion data.
    data:
      items:
        - label: Total addressable US defense primes and Tier-2 contractors
          value: 15000
          note: ITAR-eligible US defense suppliers with precision machining needs — DIB-relevant companies
        - label: Tier-1 primes and defense-tech startups (priority targets)
          value: 300
          note: >-
            Tier-1 primes (Lockheed, RTX, Northrop, Boeing Defense, General Dynamics) plus defense-tech cohort (Anduril,
            Shield AI, Joby, AeroVironment, etc.)
        - label: Qualified prospects (engaged with Hadrian)
          value: 60
          note: >-
            Estimated companies that have received an automated Opus quote or entered active sales discussions;
            research-team estimate
        - label: Qualified suppliers (AS9100D certified and approved)
          value: 15
          note: >-
            Customers that have completed or are in progress of AS9100D qualification with Hadrian; includes named and
            unnamed production customers
        - label: Active production customers
          value: 5
          note: >-
            Estimated from named evidence (Anduril, LM MFC, Navy) plus 2 unnamed primes implied by $30M 2024 revenue;
            research-team estimate
        - label: MaaS / FaaS long-term deployment
          value: 3
          note: 'Named MaaS/FaaS accounts: Anduril (MaaS-level), Lockheed Martin MFC (FaaS MOU), US Navy (Factory 4 FaaS)'
    claimRefs:
      - CU007
      - CU009
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: standard
    caption: >
      Evidence quality scoring for each named Hadrian customer across key diligence dimensions: production maturity,
      outcome specificity, contract depth, evidence freshness, and source independence. Green (High) = strong evidence;
      Yellow (Medium) = partial evidence; Red (Low) = weak or inferred evidence. RTX and unnamed primes are included for
      completeness.
