  - id: FE003
    title: Critical dependency map
    type: dag
    caption: Key dependencies in Hadrian's operational model — technology, supply, regulatory, and customer anchors
    data:
      nodes:
        - id: n1
          label: Hadrian Factory Network
          detail: >-
            F1-F4 factory assets; core production infrastructure; F4 opening March 2026 is the critical near-term
            milestone
        - id: n2
          label: Opus MES Platform
          detail: >-
            AI Manufacturing Execution System; single-software dependency for quoting, scheduling, QC, and all factory
            operations
        - id: n3
          label: CNC Equipment OEMs
          detail: >-
            Multi-axis machine tool vendors (Haas, DMG Mori, Mazak likely); 6–18 month lead times for advanced 5-axis
            machines
        - id: n4
          label: Raw Materials Supply
          detail: >-
            Aerospace-grade aluminum, titanium, Inconel; commodity pricing volatility; ITAR restrictions on some
            specialty alloys
        - id: n5
          label: Cloud / Data Infrastructure
          detail: >-
            ML model training, digital twin telemetry, operational analytics; single cloud vendor creates concentration
            risk
        - id: n6
          label: US Navy (OBBBA Anchor)
          detail: $900M government commitment for F4; strategic anchor customer; Factory-as-a-Service contract model
        - id: n7
