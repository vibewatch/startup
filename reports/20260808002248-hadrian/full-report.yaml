    caption: >
      Modeled customer retention by cohort based on contract structure, public customer status signals, and long-term
      production contract economics. All values are research-team estimates derived from defense procurement norms and
      public evidence; Hadrian has not disclosed NRR, GRR, or cohort retention data. 2022 cohort (Anduril) is
      empirically grounded in 3+ years of active relationship. 2023 and 2024 cohort values are modeled assumptions based
