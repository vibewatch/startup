      - number: '1.4'
        title: Milestones, Operational Trajectory, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Hadrian's operational timeline now spans incorporation in 2020, commercial launch in 2023, and accelerated
              scaling through 2026. Revenue reached $3 million in 2023, grew roughly 10x to an estimated $30 million in
              2024, and management described 2025 growth as aggressive without disclosing a specific figure. No 2025 or
              2026 revenue number has yet been publicly released, leaving a significant transparency gap relative to the
              size of the current valuation.


              Key partnerships over this period include the Anduril Industries strategic manufacturing partnership (June
              2023), the December 2025 Lockheed Martin Missiles and Fire Control MOU for missile-defense and
              precision-strike components, and the U.S. Navy-backed Alabama factory dedicated to submarine components.
              The company also acquired Datum Source in August 2024, opened Factory 3 in Mesa in January 2026, opened
              Factory 4 in Alabama in March 2026, and then announced the $1.37 billion Series D in August 2026.
              Management says the Series D will fund additional factories and new production lines in munitions and
              autonomous systems, extending the company's scope from precision parts toward full mission-critical
              systems.


              No public regulatory actions, recalls, or major legal proceedings were identified in reviewed sources. The
              principal adverse fact pattern remains valuation versus disclosure: Hadrian has clearly expanded capacity
              and investor support, but the current $7.87 billion mark still rests on largely undisclosed 2025-2026
              operating metrics.
