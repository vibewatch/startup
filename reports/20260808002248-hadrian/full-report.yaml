      - number: '5.5'
        title: Deployment, Integration, Reliability, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Hadrian's deployment model integrates with customer procurement and quality systems rather than requiring
              customers to operate any software. Customers submit drawings and manage delivery schedules through
              Hadrian's portal, while Hadrian returns AS9100D-oriented quality records. The current roadmap is now
              defined less by opening the first large factories and more by absorbing the August 2026 capital infusion
              into new facilities and production lines.


              Factories 1 through 4 are now all public milestones. Factory 3 opened in Mesa in January 2026 after a $200
              million investment, and the Alabama submarine-components site opened in March 2026. Management says the
              Series D will finance additional factories, expanded R&D, and new lines in munitions and autonomous
              systems, implying that Opus must generalize from precision-machined parts into broader product categories
              while preserving traceability and uptime claims.


              Reliability claims — 75–80% machine uptime — still have not been independently audited. The core
              technology question for the next refresh is therefore not whether Hadrian can run one automated factory,
              but whether the same software and operating stack can support multiple geographies, more programs, and
              broader product scopes without quality or security regressions.
