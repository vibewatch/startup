      - number: '8.2'
        title: Recommendation and Confidence
        blocks:
          - type: paragraph
            body: >-
              Based on available evidence as of August 2026, the research team assigns a RESEARCH-MORE recommendation
              for new capital at the $7.87 billion Series D price. This is not a negative judgment on company quality.
              Hadrian has clearly improved its strategic position since the previous report by opening new factories,
              attracting a far deeper investor base, and extending its production scope. The problem is valuation
              discipline: the public market-style price arrived before public market-style financial disclosure.


              Risk rating remains HIGH. The dominant risks are: (1) execution risk — the company must prove that the
              Alabama plant and future factories can qualify and ramp at scale; (2) disclosure risk — 2025 and 2026
              revenue, gross margin, burn, and preference-stack detail remain absent; (3) concentration risk — public
              customer proof still centers on three anchor relationships; and (4) capital-structure risk — the
              private/public funding mix behind the factory network is still not fully transparent.


              Confidence in the RESEARCH-MORE stance is medium. The Series D removed near-term funding doubt, but it
              increased the burden of proof required to justify the current mark. A path to a positive underwriting view
              exists, but it requires current operating metrics, clearer cap-table and financing disclosures, and
              evidence that Factory 4 is converting capacity into qualified, repeatable production.
            claimRefs:
