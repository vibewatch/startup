      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Factory 4 Is the Largest Unproven Execution in Hadrian's History
            body: >
              Factory 4 in Cherokee, Alabama combines every operational risk category simultaneously: unprecedented
              scale (2.2M sqft, 8x all prior factories combined), a $2.4 billion public-private financing structure with
              an opaque $1.5B private capital tranche, a workforce requirement of 1,000-2,000 workers, equipment
              procurement for hundreds of CNC machining centers with 12-24 month lead times, and contractual performance
              obligations to the US Navy on submarine production. Hadrian has not disclosed a public construction
              schedule, independent project management oversight, or equipment procurement milestone. Investors
              evaluating Hadrian in 2026 are essentially underwriting the successful delivery of a project with no
              publicly available progress audit.
            calloutType: risk
            claimRefs:
              - CR011
              - CR024
              - CR027
          - type: callout
            title: ITAR Tail Risk Grows Non-Linearly With Scale
            body: >
              Hadrian's ITAR compliance obligation does not scale linearly with headcount or factory count; it scales
              with the number of people having access to export-controlled technical data, hardware, and manufacturing
              processes. At 408 employees across four facilities, the ITAR surface area is already substantial. At the
              2,000+ worker scale required for Factory 4, the technology control plan must screen, badge, and monitor an
              order of magnitude more individuals in a new state with a different talent pool. A single willful ITAR
              violation by a Hadrian employee carries criminal penalties of up to 20 years imprisonment and $1.3M per
              violation. No information about Hadrian's technology control plan architecture, audit cadence, or DDTC
              self-assessment program has been disclosed.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR030
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Hadrian at $7.87 billion rests on five interconnected pillars. First, the market
              opportunity: the U.S. defense precision-manufacturing market remains structurally under-capacity, and
              submarine, missile, and autonomy programs continue to create demand for domestic supply-chain scale.
              Second, product differentiation: Hadrian's Opus manufacturing platform still appears meaningfully
              differentiated in scheduling, inspection, and workforce enablement. Third, customer validation: Anduril,
              the U.S. Navy, and Lockheed Martin MFC remain strong public proof points even if customer disclosure is
              still narrow. Fourth, financing capacity: the August 2026 Series D materially lowers near-term
              balance-sheet risk and gives Hadrian the resources to keep building factories while competitors struggle
              to raise equivalent capital. Fifth, institutional sponsorship: the new investor mix gives Hadrian a more
              credible path to IPO readiness or a premium strategic outcome.


              The anti-thesis is sharper than in the prior report because the valuation moved faster than disclosure. At
              $7.87 billion, the company is now worth roughly 262x its last disclosed 2024 revenue of ~$30 million. Even
              if actual 2025-2026 revenue is substantially higher, public investors still lack the data needed to judge
              whether the round prices in one, two, or three full factory cycles of future growth. Gross margins, burn
              rate, cash conversion, the Series D preference stack, and the exact structure of future factory capital
              remain opaque. The business may well deserve a premium multiple, but the public evidence does not yet
              support underwriting this price with high confidence.
