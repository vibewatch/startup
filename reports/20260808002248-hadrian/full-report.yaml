      - number: '1.3'
        title: Funding History, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >-
              Hadrian's financing history now spans Seed through Series D. The company raised roughly $90 million in
              Series A (2022), $117 million in Series B (February 2024), and $260 million in announced Series C
              financing in July 2025, with SEC Form D filings indicating the Series C ultimately extended to roughly
              $292 million of sold securities across two tranches. On 2026-08-06 Hadrian announced a $1.37 billion
              Series D valued at $7.87 billion, a nearly 5x step-up from the prior $1.6 billion Series C mark.


              The Series D investor base materially broadened beyond traditional venture capital. The round was co-led
              by WCM Investment Management, Washington Harbour Partners, Valor Equity Partners, 137 Ventures, and
              Baillie Gifford, with JPMorganChase's Strategic Investment Group participating as an anchor co-lead.
              Morgan Stanley Wealth Management, Apollo-managed funds, accounts advised by T. Rowe Price Associates,
              CapitalG, Andreessen Horowitz, Founders Fund, Lux Capital, Altimeter, Construct Capital, and 1789 Capital
              also participated. This mix is important not only for capital supply but because it introduces crossover
              and late-stage institutional money that usually appears when a company is moving from venture-style
              narrative underwriting toward IPO-optional scale.


              Using public prior-round disclosures plus the Series D announcement, Hadrian's disclosed lifetime capital
              now totals roughly $2.0 billion before including the Navy's separate $900 million public contribution to
              Factory 4. Management says the new financing will fund new factories, expanded R&D, and additional
              production capabilities in munitions and autonomous systems. The company still has not publicly detailed
              liquidation preferences, any secondary component, or the exact structure of the private capital supporting
              Factory 4 beyond the previously disclosed Morgan Stanley facility loan associated with Series C.
