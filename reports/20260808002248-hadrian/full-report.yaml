        - id: n8
          label: Defense Prime Customers
          detail: Anduril (strategic partner), Lockheed Martin MFC (MOU Dec 2025), future prime contractor relationships
        - id: n9
          label: Skilled Engineering Workforce
          detail: >-
            Opus software engineers, robotics integration engineers, applications engineers; retention risk is IP
            concentration risk
