  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >
      Risk heatmap plotting Hadrian's identified risks by likelihood (X-axis) and impact (Y-axis) on a 4x4 grid. Cells
      contain abbreviated risk names. Most critical risks cluster in the high-impact / medium-likelihood quadrant,
      reflecting the structural nature of regulatory, execution, and customer concentration risks at this stage of
      Hadrian's development.
    data:
      columns:
        - Remote (< 5%)
        - Possible (5-25%)
        - Likely (25-60%)
        - Almost Certain (> 60%)
      rows:
        - label: Catastrophic (company-ending)
          values:
            - null
            - Navy OBBBA cancellation
            - Factory 4 execution failure
            - null
        - label: Critical (major business impairment)
          values:
            - ITAR criminal violation
            - Quality escape / CMMC disqualification
            - Founder departure
            - null
        - label: Significant (major disruption)
          values:
            - EAR/BIS violation; Titanium supply disruption
            - CNC supply crunch; Cyber breach OT/IT
            - Anduril revenue loss > 30%
            - Defense budget cut
        - label: Moderate (manageable)
          values:
            - null
            - OSHA/EPA compliance gaps; Cloud provider outage
            - Labor union drive; AL labor market issues
            - Training pipeline quality degradation
    approximationNotes: >-
      Risk positions are research-team assessments based on public sources. Actual probability estimates require access
      to Hadrian's internal risk management program and compliance records.
