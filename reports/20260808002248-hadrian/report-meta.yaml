  topStrengths:
    - >-
      Series D adds $1.37B of fresh capital and brings in crossover/institutional investors that most manufacturing
      startups cannot access.
    - >-
      Opus plus a four-site factory network creates a differentiated operating stack with real proof from Anduril, the
      U.S. Navy, and Lockheed Martin MFC.
    - >-
      Policy tailwinds in submarines, munitions, and sovereign industrial capacity align directly with Hadrian’s
      expansion roadmap.
  topRisks:
    - >-
      The $7.87B valuation now far outpaces public financial disclosure; 2025-2026 revenue, gross margin, and burn
      remain undisclosed.
    - Factory 4 and future-factory execution are still unproven at the scale implied by the current private mark.
    - >-
      Public customer proof remains concentrated in a small number of anchor relationships, creating material
      single-program risk.
    - >-
      Series D economics, preference stack, and the precise mix of debt/project finance versus equity behind expansion
      are still opaque.
  unresolvedGaps:
    - >-
      Current 2025-2026 revenue and margin profile needed to judge whether the Series D price is grounded in operating
      performance or option value.
    - Series D terms, liquidation preferences, governance rights, and any secondary component.
    - >-
      Customer concentration by revenue and evidence that the named public roster is broadening beyond Anduril, Lockheed
      MFC, and the Navy.
    - Factory 4 qualification, utilization, and throughput milestones after opening.
