companyProfile:
  summary: "LimX Dynamics (凌犀科技) is a Shenzhen-based embodied-AI robotics company founded in January 2022 that develops full-size humanoids (Luna, Oli), multi-form legged and wheeled-legged robots (TRON 2, TRON 1), research platforms (P1, W1), and the LimX COSA agentic operating system. The company closed a US$200 million Series B in February 2026, reaching unicorn (>US$1B) valuation, backed by JD.com, NIO Capital, SAIC-linked Shangqi Capital, Oriental Fortune Capital, CoStone Capital, and UAE-linked Stone Venture. It sells robot hardware and developer toolkits to research, industrial, and service buyers, but commercial traction and financials remain largely undisclosed."
  foundedDate: "2022-01-01"
  founders:
    - name: "Wei Zhang"
      role: "Co-founder & CEO"
      background: "Purdue ECE PhD, UC Berkeley postdoc, former tenured associate professor at Ohio State and professor at SUSTech; expert in reinforcement learning and legged locomotion."
      claimRefs: [CO007]
    - name: "Zhang Li"
      role: "Co-founder & COO"
      background: "Former COO of autonomous-driving company WeRide; joined LimX Dynamics in November 2023."
      claimRefs: [CO009]
  foundingLocation: "Shenzhen, China"
  headquarters: "Shenzhen, China"
  productSummary: "Full-size humanoids Luna and Oli (Oli priced around RMB 158,000 / ~US$22,000); TRON 2 multi-form embodied robot (dual-arm, bipedal, wheeled-leg; from ~US$6,800); TRON 1 biped; P1 and W1 research platforms; LimX COSA agentic operating system with open-source SDKs and reinforcement-learning / sim-to-real stack."
  customerFocus: "Robotics researchers and universities, solution integrators, and prospective industrial, logistics, and service-automation buyers, primarily in China with announced Middle East and US expansion."
  businessModel: "Hardware platform sales plus developer toolkits/SDK; B2B enterprise and institutional sales; early commercialization stage."
