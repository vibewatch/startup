- id: contradictions-and-diligence-gaps
  title: Contradictory estimates and diligence gaps
  body: 'The market is investable only if forecast uncertainty is preserved rather than averaged away. Morgan Stanley’s externally
    sold China unit lens is grounded and specific, but it still depends on ASP, production, and buyer conversion assumptions.
    Global market estimates also diverge: Axis and Fortune Business Insights support a roughly US$6.2B 2026 market, while
    CNBC’s Barclays coverage describes a small US$2B-US$3B current market that could rise to US$200B by 2035, and older Goldman
    Sachs work framed a lower long-run base case. Those differences are not mere noise; they reflect whether the publisher
    counts revenue, units, capacity, prototypes, labor-substitution potential, or blue-sky services. The missing diligence
    package is audited shipments, realized ASP, utilization hours, renewal or repeat orders, segment-level gross margin, and
    a clean split between humanoid revenue and broader legged research-platform revenue.'
  claimRefs:
  - CM031
  - CM032
  - CM033
  - CM034
  - CM040
  - CM041
  - CM042
  - CM043
