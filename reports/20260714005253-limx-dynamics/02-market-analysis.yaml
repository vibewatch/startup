- id: buyers-and-adoption-path
  title: Buyer, user, payer, and adoption path
  body: Buyer segmentation is more important than a single TAM headline. In automotive and logistics, the economic buyer is
    usually operations or plant leadership, the user is a production or warehouse team, and the payer is an operations, automation,
    or transformation budget. In research and education, the buyer is a principal investigator, lab director, or department,
    and the payer is an R&D, capital equipment, or grant budget. In utilities and public infrastructure, procurement may be
    centralized and heavily influenced by safety, security, and standards teams. The adoption path therefore usually begins
    with R&D evaluation or a controlled pilot, proceeds through safety certification and workflow integration, and only then
    converts into operations-owned fleet deployment. Household and elder-care use cases may be strategically large, but the
    evidence supports treating them as later-timed demand pools rather than the 2026 commercial core.
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM037
  - CM038
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'The demand case rests on three reinforcing drivers: China production scale, policy-backed deployment pressure, and
    a cost-down path that could make robots economically comparable to labor or fixed automation in selected workflows. TrendForce
    and other sources point to rapid China output growth, while Morgan Stanley-linked reporting highlights factory/logistics
    commercialization and SOE procurement signals. Standards such as HEIS 2026 can also accelerate adoption by giving buyers
    a framework for safety, interfaces, and evaluation. The constraints are equally material. Actuators remain a large share
    of the bill of materials, dexterous manipulation lags human performance, and ROI depends on utilization, integration quality,
    and effective output. Geopolitical restrictions are not abstract: the GUARD Act and related proposals could remove Chinese
    robots from U.S. public-sector or sensitive-infrastructure channels, lowering accessible SAM even if global TAM expands.'
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
