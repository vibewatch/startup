chapter:
  number: 2
  title: Market Analysis
  summary: The strongest near-term market lens is China humanoid robots at approximately US$2B and approximately 50,000 units
    in 2026, expanding to approximately US$15B and approximately 446,000 units by 2030. Global 2026 revenue is approximately
    US$6.2B, but buyer conversion depends on industrial ROI, standards, component cost-down, and geopolitical access.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'This chapter treats the market as externally sold humanoid robots and closely adjacent legged-robot platforms that
    can perform, test, or accelerate humanoid-style mobility and manipulation workflows. Included spend is hardware, onboard
    software, developer tooling, deployment support, and fleet integration when those elements are bundled into a robot purchase
    or pilot. Excluded spend is conventional industrial arms, AMRs, cobots, pure software, prototype-only units, internal
    demo builds, and preorder trial units that do not represent external sales. That distinction matters because the most
    cited China forecast explicitly filters out prototypes and internal-use units. The relevant substitutes are not only rival
    humanoids; buyers can also keep human labor, install fixed automation, use AMRs or cobots for narrower tasks, rely on
    teleoperation, or build internal robotics tooling. Legged research kits sit at the boundary: they may not be production
    humanoids, but they cultivate developers and prove locomotion in workflows that can later migrate to humanoids.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM034
  tableRefs:
  - TM001
  figureRefs: []
- id: sizing-lenses
  title: Evidence-constrained TAM, SAM, and SOM lenses
  body: 'The cleanest evidence-constrained TAM lens is global humanoid robotics annual revenue of approximately US$6.2B in
    2026. The clearest SAM lens for a China-centered humanoid and legged-robot supplier is Morgan Stanley’s China estimate:
    approximately US$2B in 2026, approximately 50,000 shipped units, and expansion to approximately US$15B and approximately
    446,000 units by 2030. Those figures are used exactly because they are repeated in the dossier and directly reflected
    in market reporting. A narrower SOM should not be asserted as a company fact; it can only be framed as a sensitivity.
    At 1-3% share of the 2026 China revenue pool, a challenger’s implied annual revenue opportunity would be about US$20M-US$60M
    before execution, price, product mix, and regulatory filters. Multiple publishers create wider long-run TAM stories, but
    they mix different endpoints and methods, so near-term valuation work should privilege the externally sold-unit lens.'
  claimRefs:
