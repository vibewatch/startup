  evidenceGaps:
  - type: missing-source
    severity: material
    topic: diligence-gaps
    missingEvidence: Audited 2026 unit shipments, realized ASP, utilization hours, and repeat orders by buyer segment.
    whyItMatters: These data determine whether the US$2B China market converts into durable revenue rather than pilots or
      demos.
    diligencePath: Request signed purchase orders, acceptance certificates, fleet utilization logs, and renewal records from
      vendors and reference buyers.
    relatedQuestionRefs:
    - QM033
    relatedTableRefs:
    - TM002
    - TM003
  - type: conflicting-data
    severity: material
    topic: contradictory-estimates
    missingEvidence: Publisher-by-publisher reconciliation of whether forecasts count external sales, production, capacity,
      prototypes, or labor-substitution potential.
    whyItMatters: Forecast dispersion can inflate TAM and valuation if incompatible estimates are averaged together.
    diligencePath: Build a source-methodology bridge using primary analyst notes, disclosed model definitions, and buyer-level
      revenue proof.
    relatedQuestionRefs:
    - QM026
    - QM035
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: humanoid-versus-legged-revenue
    missingEvidence: Vendor revenue split between full humanoid robots, legged research platforms, software/tooling, and deployment
      services.
    whyItMatters: A clean split is needed to isolate SAM for humanoid deployment versus adjacent developer-platform revenue.
    diligencePath: Request management revenue cohorts and contract line-item detail; compare against invoice samples and customer
      references.
