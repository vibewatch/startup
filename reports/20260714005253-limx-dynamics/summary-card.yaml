summary:
  headline: >-
    LimX Dynamics has secured top-tier Chinese strategic and Middle Eastern backing and a >US$1B valuation for its
    modular legged-robot and humanoid platform, but trails volume leaders Unitree and AgiBot and carries undisclosed
    financials plus mounting geopolitical risk.
