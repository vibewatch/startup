  topStrengths:
    - >-
      Modular, multi-form robot architecture (TRON 2 dual-arm/biped/wheeled-leg) plus full-size humanoids and the COSA
      agentic OS enabling reuse across industrial, logistics, and service use cases
    - >-
      Top-tier strategic backers — JD.com, SAIC-linked Shangqi Capital, NIO Capital, and UAE-linked Stone Venture —
      provide capital, deployment channels, and international reach
    - >-
      Deep technical credentials: founder Wei Zhang and chief scientist Jia Pan bring reinforcement-learning and
      legged-locomotion research depth, with an active open-source GitHub developer footprint
    - >-
      Rode a fast 2026 cadence of product (COSA, TRON 2, Oli), a $200M Series B, and Middle East/US expansion
      announcements
  topRisks:
    - >-
      Revenue, margins, burn, runway, and unit economics are undisclosed; capital-intensive hardware scaling with an
      unclear path to profitability
    - >-
      Intense competition from far higher-volume Chinese peers Unitree (~40%) and AgiBot (~39%), with LimX a
      low-single-digit-share challenger
    - >-
      Geopolitical exposure: proposed US GUARD Act and American Security Robotics Act could restrict Chinese-robot
      imports and federal use, limiting international deployment
    - Key-person dependence on founder Wei Zhang and unproven at-scale commercial deployment beyond demonstrations
  unresolvedGaps:
    - Audited revenue, ARR, gross margin, burn, and runway not publicly available
    - Verified customer count and named production (non-pilot) industrial deployments unclear
    - Lifetime capital raised conflicts across sources (~US$250M vs ~US$296M) and exact headcount is unconfirmed
    - Autonomous navigation, dexterity, and reliability versus competitors not independently benchmarked
    - Post-Series B runway, governance/board composition, and next-financing plan not confirmed
