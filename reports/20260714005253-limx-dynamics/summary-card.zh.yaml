  topStrengths:
    - 模块化多形态机器人架构（TRON 2 双臂 / 双足 / 轮足）叠加全尺寸人形机器人和 COSA 智能体 OS，可在工业、物流、服务等场景复用
    - 一线战略投资方——JD.com、SAIC 关联的 Shangqi Capital、NIO Capital、UAE 关联 Stone Venture——带来资本、落地渠道和国际触达
    - 技术底子深：创始人 Wei Zhang 与首席科学家 Jia Pan 具备强化学习和足式运动研究积累，GitHub 开源开发者足迹活跃
    - 2026 年节奏快：COSA、TRON 2、Oli 产品发布，$200M Series B，以及中东 / 美国扩张公告接连落地
  topRisks:
    - 收入、利润率、烧钱速度、现金跑道和单位经济未披露；硬件规模化重资本，盈利路径不清
    - 中国同行 Unitree（约 40%）和 AgiBot（约 39%）出货高得多，竞争激烈；LimX 仍是低个位数份额挑战者
    - 地缘政治暴露：拟议中的美国 GUARD Act 和 American Security Robotics Act 可能限制中国机器人进口和联邦使用，压缩国际部署
    - 依赖创始人 Wei Zhang；商业落地仍停留在演示之外，尚未证明可规模化
  unresolvedGaps:
    - 审计收入、ARR、毛利率、烧钱速度和现金跑道未公开
    - 已核实客户数和具名量产（非试点）工业部署仍不清楚
    - 累计融资在不同来源间冲突（约 US$250M vs 约 US$296M），准确员工数未确认
    - 自主导航、灵巧操作和可靠性相对竞争对手缺少独立基准
    - Series B 后现金跑道、治理 / 董事会构成和下一轮融资计划未确认
