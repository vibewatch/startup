- id: moat-durability-risk
  title: Moat durability, commoditization risk, and adverse competitor evidence
  body: 'The adverse competitor evidence is straightforward: LimX trails the two shipment leaders by a wide margin, and public
    sources show competitors attacking both price and scale. Unitree and AgiBot together define the volume benchmark; Unitree''s
    low-price product ladder can pull buyer price expectations down, and AgiBot''s mass-production signal can make smaller
    rivals look less bankable for large deployments. Regulatory evidence cuts both ways. China HEIS 2026 can professionalize
    the domestic market, but U.S. legislative proposals such as the GUARD Act can also push Western and allied buyers toward
    Figure, Apptronik, Tesla, 1X, or NEURA. LimX''s moat is therefore durable only if COSA and modular hardware translate
    into deployed autonomy, service reliability, and partner access before the market commoditizes around cheaper bodies plus
    third-party AI. The right diligence posture is to value LimX''s technology option while discounting it for volume gap,
    opaque realized pricing, and export-market trust risk.'
