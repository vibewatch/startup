- id: switching-lock-in-distribution
  title: Switching cost, lock-in, multi-homing, supply access, and partner power
  body: 'Switching cost is real but uneven. At the pilot stage, buyers can multi-home across Unitree, LimX, UBTECH, Apptronik,
    and other platforms because procurement can compare form factors, developer tools, teleoperation, payload, and price before
    committing. After scaled deployment, multi-homing becomes harder: safety cases, spare-parts inventory, fleet-management
    tooling, operator training, SDK integration, maintenance contracts, and facility-specific workflows create platform-specific
    lock-in. This favors vendors with production capacity, channel partners, service networks, and component supply more than
    it favors the vendor with the best single demo. Unitree''s capacity expansion signals, AgiBot''s mass-production messaging,
    and UBTECH''s broad commercial surface are therefore competitive moats. LimX''s public GitHub assets and TRON 2 research
    platform help developer adoption, but distribution power and supply access remain diligence asks until LimX proves repeatable
    deliveries, service coverage, and parts economics at a materially larger installed base.'
