  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: installed base
    missingEvidence: Audited shipped units, active deployed fleets, backlog conversion, and customer cohort retention for
      LimX and private peers.
    whyItMatters: The key adverse question is whether LimX can move from challenger demos to repeatable deployments against
      Unitree and AgiBot scale.
    diligencePath: Request management KPI pack with shipped units by model, paying customers, backlog, delivery dates, warranty
      claims, and cancellations.
    relatedQuestionRefs:
    - QP006
    - QP024
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: realized pricing
    missingEvidence: Realized ASP, discounts, service attach, warranty terms, and RaaS contract economics across LimX, Unitree,
      AgiBot, UBTECH, and Western peers.
    whyItMatters: Public list pricing can overstate price defensibility or understate total cost of ownership.
    diligencePath: Collect recent quotes, invoices, channel contracts, warranty schedules, and buyer references for comparable
      configurations.
    relatedQuestionRefs:
    - QP007
    - QP020
    - QP025
    relatedTableRefs:
    - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: emerging competitors
    missingEvidence: Full source-backed detail for every regional entrant, including Fourier pricing and Galbot deployment
      metrics.
    whyItMatters: Long-tail entrants can pressure talent, components, and niches even if they are not current share leaders.
    diligencePath: Refresh competitor tracker and Chinese-language filings before investment committee, then add row-level
      updates for any entrant with commercial deployments.
    relatedQuestionRefs:
