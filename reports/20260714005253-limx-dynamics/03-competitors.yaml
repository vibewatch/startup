- id: competitor-profiles
  title: 'Competitor profiles: scale, funding, target customer, product scope, pricing, and direction'
  body: The profile evidence creates a two-tier market. Unitree and AgiBot are the China volume leaders; TrendForce's nearly-80%
    combined shipment projection and the canonical 40% versus 39% split should be treated as estimates, but they are directionally
    consistent with capacity, IPO, and mass-production signals. UBTECH is smaller by share but has a broader institutional
    and education/commercial surface. LimX has credible product and software differentiation through TRON 2, Oli, COSA, and
    public developer assets, but its estimated 1% to 3% share means buyers should see it as a challenger until it discloses
    comparable shipment, service, and production metrics. Outside China, Figure, Apptronik, Tesla, 1X, and NEURA compete less
    on low unit price and more on enterprise trust, home-help narratives, fleet tooling, and strategic capital. EngineAI,
    Galbot, Fourier, and DEEP Robotics matter as regional or adjacent challengers that can pressure pricing, component access,
    and recruiting even when their target customers differ.
