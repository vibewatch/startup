- id: architecture-operating-model
  title: Architecture and operating model
  body: 'The architecture splits into robot bodies, motion-control software, developer tooling, and the COSA agent layer. At the hardware layer, the company publishes enough specifications to verify degrees of freedom, batteries, compute boxes, cameras, IMUs, grippers, payloads, and safety behaviors for the flagship products. At the developer layer, the GitHub surface is unusually concrete for a private hardware startup: TRON 2 model assets include URDF, xacro, MuJoCo XML, meshes, and optional USD; Isaac Lab training repos expose PPO locomotion tasks; MuJoCo and ONNX deployment repos outline sim-to-real flows; and the documentation center lists SDK guides and manuals. At the agent layer, third-party coverage describes COSA as foundational movement control, skills, and cognition, but the internal model weights, data governance, and production orchestration remain undisclosed.'
  claimRefs:
  - CE005
