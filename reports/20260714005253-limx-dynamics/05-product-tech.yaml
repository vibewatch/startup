- id: deployment-reliability-support-roadmap
  title: Deployment, reliability, support, and roadmap
  body: 'Deployment maturity is mixed. TRON 2 has the strongest integration story because it combines official manuals, SDK documentation, ROS compatibility, simulation assets, and independent pilot-delivery labeling. Oli has a stronger humanoid story but still looks research-led: public sources cite shipping or preorder channels and demos, while named production customers and uptime data are absent. Luna appears closer to packaged commercial use because its workflow centers on choreography, group control, and venue interaction, but support still needs buyer diligence on installation, supervision, and post-sale service. Reliability evidence is mostly procedural rather than statistical: warranties, OTA, manuals, safety-boundary descriptions, and suspended bring-up guidance are useful, yet they do not substitute for field MTBF, incident history, or service-level commitments.'
  claimRefs:
  - CE007
  - CE008
  - CE012
  - CE027
