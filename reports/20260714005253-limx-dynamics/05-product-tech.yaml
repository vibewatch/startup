  - type: missing-source
    severity: material
    topic: security privacy
    missingEvidence: Robot-specific security architecture, data retention policy, remote-access controls, penetration testing, and privacy handling for cameras, microphones, VLA datasets, and semantic memory.
    whyItMatters: COSA and VLA workflows increase data-security diligence requirements, especially outside China.
    diligencePath: Request SOC-style controls, network architecture, encryption/key management details, vulnerability process, and customer data-processing agreements.
