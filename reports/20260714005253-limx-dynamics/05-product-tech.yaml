- id: module-sku-map
  title: Module, SKU, and product-line map
  body: 'The official catalog now privileges four named hardware families plus the FluxVLA/COSA software surface. TRON 2 has the most modular SKU logic because the same body can be diligence-tested as arms-first manipulation hardware, sole-foot locomotion, or wheeled-leg mobility. Oli and Luna are full-size humanoids with different jobs to be done: Oli is an extensible research and early industrial platform with higher-end compute options, while Luna is optimized around interaction, dance routines, synchronized control, and an AI task editor. TRON 1 remains a smaller multi-modal biped research platform with point-foot, sole, and wheeled foot-end variants. CL-1, P1, and W1 are important for historical capability claims, but the public evidence supports CL-1 and P1 only as demo/research lineage and leaves W1 as a current-status diligence gap.'
