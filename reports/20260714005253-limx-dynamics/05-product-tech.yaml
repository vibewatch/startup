    - Specified on official and RobotHub pages
    - Collision/equipment-damage prevention around dual arms
    - Independent validation, limits, and failure logs
  - - Power-loss arm behavior
    - Official/RobotHub pages describe lock or safe folding
    - Manipulator safety during unexpected power loss
    - Test standard and certification not provided
  - - Suspended controller bring-up
    - GitHub deployment README warning
    - Real-hardware RL deployment procedure
    - Formal safety checklist and training requirements
  - - Warranty and OTA
