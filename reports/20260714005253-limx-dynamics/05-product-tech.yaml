  - - GUARD Act exposure
    - Proposed U.S. scrutiny/import restriction for risky Chinese robots
    - International regulatory and national-security risk
    - Customer-specific legal review and data-security architecture
  - - Sensor data privacy
    - Cameras, microphones, semantic memory and VLA data workflows visible
    - Data collection and robot memory
    - Robot-specific privacy/security white paper absent
