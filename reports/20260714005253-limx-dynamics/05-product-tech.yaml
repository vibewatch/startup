- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - LimX solution
  - Measurable benefit to verify
  - Known limitation
  rows:
  - - Embodied-AI researcher
    - Hard to collect robot-specific VLA and locomotion data
    - TRON 2 with VLA workflow, SDK, URDF/MuJoCo/Isaac assets
    - Time from unboxing to first policy training or teleop dataset
    - Tutorial claims do not prove policy robustness
  - - Manipulation developer
    - Separate arm, base, and simulator stacks slow iteration
    - TRON 2 dual-arm configuration and ONNX deployment repos
    - Successful sim-to-real task transfer rate
    - Controller safety requires suspended bring-up and careful validation
  - - Humanoid research lab
    - Need full-size platform with APIs and perception compute
    - Oli with motion/perception compute and sensor APIs
    - API coverage, uptime, support response, availability by region
    - Named production deployments remain sparse
  - - Commercial venue operator
    - Human performances are costly and inconsistent
    - Luna choreography, group control, AI task editor
    - Show setup hours, supervision ratio, incident rate
    - Safety certification and crowd interaction constraints unavailable
  - - Operations pilot owner
    - Wants multi-robot autonomous setup without bespoke paths
    - Oli/COSA coordinated unpacking and formation demo
    - Repeatability in uncontrolled receiving and factory environments
    - Demo is not audited production uptime
  notes: Benefits are diligence metrics to request; public evidence mostly proves product intent and demos rather than sustained customer KPIs.
