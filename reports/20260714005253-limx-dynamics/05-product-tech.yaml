company:
  name: LimX Dynamics
chapter:
  number: 5
  title: Product & Technology
  summary: LimX has a credible product/technology surface anchored by TRON 2 developer tooling, Oli/Luna full-size humanoid specs, and COSA autonomy claims. The diligence issue is not whether public artifacts exist, but whether demos, SDKs, and sim-to-real assets translate into safe, repeatable customer deployments under regulatory and data-security constraints.
sections:
- id: workflow-definition
  title: Product definition in customer workflow terms
  body: 'LimX''s product surface is best understood as a ladder of embodied-AI workflows rather than a single humanoid SKU. Luna packages synchronized performance, visitor interaction, choreography, and natural-language content creation for venues that need repeatable shows or guided engagement. Oli is a fuller general-purpose humanoid platform for research, manufacturing pilots, and commercial experiments where perception compute, APIs, and interchangeable end effectors matter more than theatrical finish. TRON 2 is the clearest developer platform: buyers can configure dual-arm manipulation, bipedal sole-foot mobility, or wheeled-leg mobility, then use VLA data tools and open SDK paths to collect demonstrations, train policies, and test loco-manipulation. TRON 1, CL-1, P1, and W1 sit behind this surface as legacy or research assets: useful for lineage and capability diligence, but not all are current, purchasable SKUs in the public navigation.'
  claimRefs:
  - CE001
  - CE006
  - CE009
  - CE013
  - CE015
  - CE017
  - CE018
  - CE019
  - CE044
