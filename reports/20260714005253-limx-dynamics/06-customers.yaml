- id: adoption-trajectory
  title: 'Adoption trajectory: from platform sales to fleet demonstrations'
  body: 'LimX’s adoption trajectory is best read as a staged funnel, not a mature customer cohort. At the base are product
    and developer surfaces: official pages, specs, GitHub repositories, and distributor listings that make the robots discoverable
    and purchasable for technical users. The next layer is lab or integrator experimentation, where TRON 1 and Oli appear
    in research-oriented use cases such as CLIO, museum guidance, and developer reviews. The third layer is field validation:
    Datang’s mountainous PV inspection proof and the 18-Oli autonomous deployment video show capabilities that resemble real
    customer needs, but they do not disclose paid contract terms, fleet uptime, or repeat orders. The 18-Oli coordinated deployment
    is the flagship proof of scalable activation and fleet orchestration in early 2026; it is fresh and impressive, but still
    a demonstration. The top of the funnel—named scaled industrial production adoption—remains empty in public sources reviewed
    for this chapter.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU019
  - CU020
  - CU021
  - CU022
  - CU027
  - CU032
  tableRefs:
