chapter:
  number: 6
  title: Customers
  summary: 'LimX’s public customer evidence is research-first: universities, RL developers, distributors, and validation partners
    are visible, while scaled industrial customers remain unnamed. The strongest proof points are HKU/CLIO, Sichuan University
    museum-tour work, Datang PV inspection validation, and the 18-Oli autonomous fleet demo; none yet proves repeatable production
    revenue or retention.'
sections:
- id: segmentation
  title: 'Segmentation: research-first buyers, channels, and use cases'
  body: 'The public customer picture is research-first. LimX’s strongest visible buyer group is universities, research labs,
    RL developers, and AI robotics teams that need a configurable humanoid or legged platform rather than a turnkey industrial
    labor replacement. Oli, TRON 1, and TRON 2 are all described around development support, modular configurations, SDK-friendly
    experimentation, and embodied-AI research workflows. The buyer is usually a principal investigator, robotics lab, innovation
    center, or advanced R&D manager; the user is a researcher or developer; the payer is a lab budget, grant, innovation department,
    or distributor-supported procurement process. Geography is broader than China because USRobotStore, RobotShop, and TRON
    K.K. create U.S. and Japanese channel surfaces, while 2026 reporting points to Middle East and U.S. expansion. The industrial
    buyer segment exists mostly as aspiration and validation proof: PV inspection, museum/cultural-heritage guidance, manufacturing/logistics
    concepts, and future service applications are visible, but public evidence does not yet show a named high-volume factory
    customer.'
  claimRefs:
