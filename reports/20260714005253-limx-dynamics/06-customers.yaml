- id: named-proof
  title: 'Named proof: credible research and validation users, weak production proof'
  body: 'Named customer proof is improving but remains uneven. The best evidence is not a classic commercial case study; it
    is a set of research and validation artifacts with identifiable users or counterparties. HKU’s CLIO story, reinforced
    by an arXiv paper, shows a university team building a guide robot on TRON 1 and evaluating user engagement with 28 participants.
    A LimX cultural-heritage video names a National Key Laboratory from Sichuan University and claims fully autonomous museum-tour
    navigation. Another LimX video names Datang North China Electric Power Test and Research Institute and reports mountainous
    PV inspection validation with over 92% AI image diagnostics accuracy. These are useful proof points because they tie a
    platform to named users, tasks, and outcomes. However, they are pilots, research projects, or validations, not disclosed
    production contracts. WhichHumanoid and Robotics Press both underline the adverse point: no named industrial customer
    or revenue-scale deployment is publicly verified.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU028
  - CU037
  - CU038
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-durability
  title: 'Retention and durability: public metrics are absent'
  body: 'Retention is the biggest empty field in LimX’s customer diligence. Public sources reviewed here do not disclose NRR,
    GRR, churn, renewal rates, contract length, customer satisfaction, formal references, top-account revenue concentration,
    or repeat purchase behavior. For hardware platforms sold into research labs, retention may be less like SaaS renewal and
    more like follow-on purchases, support contracts, upgrades, spare parts, and additional robots for new experiments. For
    industrial deployments, retention would need uptime, task-completion rates, maintenance response, safety incidents, ROI,
    and expansion to additional sites. None of those metrics is public. The available proxies are weak: continued distributor
    availability, developer-surface activity, a user-study publication, and fresh video validations. Those proxies show interest
    and experimentation, but not durable revenue. This chapter therefore treats retention as unknown and escalates it to private
    diligence rather than inferring satisfaction from demos.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU030
  - CU031
  - CU040
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration
  title: 'Expansion and concentration: broad ambition, narrow verified demand'
  body: 'The expansion story is broad but still under-evidenced. January 2026 coverage says Chinese humanoid robots, including
    LimX, are targeting the Middle East and U.S., and other sources describe partnership-led internationalization rather than
    simple capital seeking. That can be strategically sensible: local distributors, integrators, and sovereign or enterprise
    partners can reduce procurement friction and create first deployments. Yet the same evidence does not identify the customers
    that would absorb thousands of units, nor does it prove conversion from developer platform to production fleet. Near-term
    concentration risk is therefore qualitative rather than numerical: demand may be clustered in research institutions, early
    adopters, distributors, and strategic-investor ecosystems, while the large industrial accounts that would validate the
    valuation narrative remain unnamed. Diligence should focus on de-anonymizing pipeline by geography and vertical, separating
    paid orders from demos, and testing whether any one partner controls access to demand.'
  claimRefs:
  - CU021
