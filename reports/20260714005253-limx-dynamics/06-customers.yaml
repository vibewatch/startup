  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: commercial traction
    missingEvidence: Named large-scale industrial customers, paid production deployments, signed orders, and active unit counts
      by customer.
    whyItMatters: Without this evidence, demos and research validations cannot prove repeatable industrial demand.
    diligencePath: Request customer list under NDA, match invoices to deployments, and conduct reference calls with at least
      three industrial users.
    relatedQuestionRefs:
    - QU022
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention metrics
    missingEvidence: NRR, GRR, churn, renewals, support contract attach, repeat purchases, and customer satisfaction data.
    whyItMatters: Retention is the clearest test of whether robot deployments deliver durable value after novelty and pilot
      budgets fade.
    diligencePath: Review cohort retention exports and support-ticket history; interview renewing and non-renewing customers.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU016
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: Exhaustive list of public and private pilots, deployments, distributors, and end users with status and
      dates.
    whyItMatters: The public proof set is partial and may undercount private pilots or overstate channel listings.
    diligencePath: Ask management to reconcile public proof table against CRM pipeline and post-sale deployment records.
    relatedQuestionRefs:
    - QU008
    - QU017
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: international expansion
    missingEvidence: Middle East and U.S. customer names, local partners, unit commitments, deployment sites, and delivery
      schedules.
    whyItMatters: Expansion articles create a growth narrative, but investment underwriting needs evidence of booked demand.
    diligencePath: Request signed MOUs, purchase orders, distributor contracts, and site-level deployment plans.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-account revenue concentration, distributor concentration, and strategic-investor affiliated demand
      by account.
    whyItMatters: A narrow early-adopter base could make apparent traction fragile even if headline unit plans are large.
    diligencePath: Build an account-level revenue and units bridge; tag each account by investor, distributor, geography,
      and use case.
    relatedQuestionRefs:
    - QU021
    - QU024
    relatedTableRefs:
    - TU005
