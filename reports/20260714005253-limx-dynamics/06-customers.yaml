- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Public evidence
  - Diligence path
  rows:
  - - Research/developer platform adoption
    - Demand may cluster in small-budget labs
    - Limits unit volume and revenue durability
    - Oli/TRON pages and RobotTesters research positioning
    - Segment paid units by lab, product, and geography
  - - Distributor-led overseas sales
    - Channel listings may be mistaken for adoption
    - Inflates perceived customer proof
    - USRobotStore, RobotShop, TRON K.K.
    - Request sell-through, active accounts, and support burden
  - - Middle East and U.S. expansion
    - Target markets named but customers not named
    - Pipeline could be narrative-led
    - CNBC and derivative January 2026 coverage
    - Identify signed partners, orders, and deployment sites
  - - Strategic-investor ecosystems
    - Pilots may depend on affiliated channels
    - Customer quality could be correlated and fragile
    - Expansion and financing coverage plus Robotics Press critique
    - Map pilots by investor relationship and independent procurement
  - - Flagship fleet demo
    - Demo proof could mask lack of paid demand
    - Adoption overstatement risk
    - 18-Oli coverage and adverse reviews
    - Separate demo fleet from customer-owned or customer-paid robots
  - - Industrial validation proofs
    - Validation may not convert to production
    - Long sales cycles and missing ROI
    - Datang and museum proofs
    - Track conversion to repeat sites, uptime, safety and ROI
  notes: Risk ratings are qualitative because LimX does not disclose top-customer revenue, customer count, active units, or
    signed backlog.
