      - number: '7.4'
        title: 合作方、依赖与关键人风险
        blocks:
          - type: paragraph
            body: >-
              LimX
              的依赖面比普通软件创业公司更宽。市场准入靠监管，执行器和算力靠组件供应链，资本和渠道帮助靠战略投资人，还要有客户愿意在混乱的物理环境里运行机器人。公开融资来源显示，股东混合了汽车、商业、老股东和中东相关资本；这可能帮到分销，也会带来治理和地缘政治观感尽调。客户侧证据仍不足：扩张文章谈到中东和美国野心，却没有给出稳定的已签客户名单、商业条款、验收里程碑或续约经济。人员风险也很重要。公开资料把技术叙事集中在
              Wei Zhang 博士的运动和控制专长上；运营班底有一些正面信号，但制造领导层深度并不透明。真正的缓释计划必须证明工程、质量、销售、合规和售后能力已经制度化，而不是靠创始人英雄主义硬撑。
