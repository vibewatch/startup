        - 若产品胜出，挑战者身份仍留有上行空间
        - 公开规模信号上，Unitree 和 Agibot 看起来领先
        - 相对中国龙头的份额提升证据
      - - 风险
        - 国内标准可能为市场增长背书
        - 美国限制可能压窄出口和退出路径
        - 关于受限名单暴露的法律备忘录
      - - 估值
        - US$1B 入场价远低于 Figure 的离群估值标记
        - 收入不透明让同一价格难以自证
        - 经审计收入和利润率证明
      - - 退出
        - 里程碑成熟后，战略出售 / IPO 仍有选择权
        - 现有数据不足以支撑公开退出假设
        - 经审计 KPI 和退出买方图谱
    notes: 各行把证据支撑的上行空间，与足以改变建议的尽调条件拆开。
    claimRefs:
      - CV011
      - CV012
      - CV021
      - CV024
      - CV026
      - CV028
      - CV029
      - CV031
      - CV034
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 付费部署放量；COSA 改善任务经济性；战略投资者渠道转化
        - 下一阶段 US$2.5B–US$4.0B 估值在重度稀释前可支撑 >3x
        - 具名客户、复购订单、正向毛利桥
        - 部署失败或没有复购订单
      - - 基准
        - 技术可信度延续，但商业化证明慢慢补齐
        - US$0.9B–US$1.4B 围绕 Series B 入场价盘住，因此适合观察
        - 新增试点和标准推进，但没有经审计毛利证明
        - 后续估值持平，或融资中优先权过重
      - - 悲观
        - 人形机器人估值倍数压缩；中国龙头占优；出口限制收紧
        - US$0.3B–US$0.7B 结局会让新股入场面临实质亏损风险
        - 不利法规、客户数据弱，或没有毛利证明
        - 降价融资、禁令扩大，或客户流失证据
    notes: 情景区间是方向性的承销区间，不是 DCF；它们依赖未公开收入和股权结构表 尽调。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV026
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标 / 状态
      - 估值或倍数参考
      - LimX 参照意义
      - 局限
    rows:
      - - Figure AI
        - 拥有主要 AI 投资者的私有人形机器人离群样本
        - ~US$39B 投后估值；>US$1B Series C；~US$1.9B 融资参考
        - 为高溢价 AI 人形机器人叙事设定全球天花板
        - 部署证明和投资者画像强于 LimX 的公开证据
      - - Apptronik
        - 西方私有人形机器人创业公司
        - ~US$5.5B 分析师数据集参考
        - 显示美国人形机器人平台故事的溢价
        - 地域、客户和监管风险不同
      - - NEURA Robotics
        - 欧洲人形机器人 / 认知机器人公司
        - ~US$7B 分析师数据集参考
        - 显示中国以外的软件加硬件溢价
        - 不是中国成本-规模可比样本
      - - 1X Technologies
        - 消费和仓储人形机器人参考
        - ~US$1.1B+ 融资数据集参考
        - 更接近私有人形机器人的绝对估值底部
        - 消费者策略和披露画像不同
      - - Unitree
        - 以低成本机器人和 IPO 动能领先的中国规模龙头
        - 估计为低个位数十亿美元估值区间
        - 中国份额和定价压力的最佳基准
        - 私有估计差异较大，产品组合也不同
      - - AgiBot
        - 与 BYD 生态相连的中国规模挑战者
        - 市场评论中的低于 US$1B 估值区间估计
        - 显示规模玩家压低市场定价的风险
        - 估值和出货披露仍然碎片化
      - - UBTech
        - 港股上市机器人公司
        - 基于监管文件的公开财务和亏损画像
        - 用经审计披露锚定收入 / 毛利 / 亏损预期
        - 更老的上市公司，产品组合更宽
      - - LimX Dynamics
        - Series B 成长期挑战者
        - 情景测算采用的 US$1,000M 入场锚
        - 标的投资入场价和战略财团
        - 收入、毛利、积压订单和优先权未披露
    notes: 列举的是部分估值可比样本，基于截至 runDate 抓取的分析师数据集、公开文件和融资 报道。
    enumerationScope:
      coverage: partial
      basis: >-
        Major public and private humanoid robotics valuation references fetched for the July 2026 LimX valuation
        chapter.
    claimRefs:
      - CV008
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV036
  - id: TV005
    title: 投资逻辑破裂和否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价融资
        - 下一轮融资低于 Series B 入场锚
        - 证实公开可比样本高估了当前证明
        - 除非条款修复上行空间，否则从观察转向回避
      - - 优先权悬顶
        - 清算优先权堆叠实质损害普通股上行空间
        - 新资金回报目标变得不可达
        - 要求更低入场价，或放弃
      - - 缺少付费部署证明
        - 没有已签订单、定金或复购客户转化
        - 产品叙事仍由演示驱动
        - 只保持观察；不出新股报价
      - - 毛利缺口
        - 低机器人价格缺少 BOM、良率和服务成本支撑
        - 规模扩大不是带来经营杠杆，而是加重亏损
        - 要求毛利约束，或推迟
      - - 监管排除
        - 中国机器人限制堵住目标出口渠道
        - 退出买方范围和收入 TAM 缩小
        - 套用地缘政治折价，或回避
      - - 竞争对手抢份额
        - 中国出货证据上，Unitree / AgiBot 进一步拉开差距
        - LimX 作为挑战者的上行空间收窄
        - 下调情景概率，并重看价格
    notes: 这些触发因素是可监控的尽调闸口；具体阈值应结合公司私有数据校准。
    claimRefs:
      - CV012
      - CV023
      - CV026
      - CV033
      - CV037
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 客户证明
        - 已签订单、定金、积压订单、演示转化
        - 验证需求和收入质量
        - 审查合同、发票，并访谈客户
      - - 单位经济性
        - BOM、良率、质保、服务成本、毛利桥
        - 公开低价可能吃掉毛利
        - 在 NDA 下开展工厂和财务尽调
      - - 股权结构表
        - 当前持股、清算优先权、期权池、附函
        - 决定入场价能否跑出风投回报
        - 由律师牵头审查融资文件
      - - 部署可靠性
        - 正常运行时间、人工干预率、安全事故、退货
        - 机器人必须在受控演示之外跑得起来
        - 现场走访和客户技术尽调
      - - 监管 / 出口
        - 受限名单暴露、数据安全姿态、标准合规
        - 决定中国以外收入和退出买方范围
        - 法律备忘录和逐渠道审查
      - - 可比样本校准
        - 收入倍数和上市公司亏损基准
        - 约束公允入场价和下一轮预期
        - 对照 UBTech 文件和私人市场可比样本
      - - 退出图谱
        - 潜在战略买方、IPO 准备度、董事会时间表
        - 判断持有期是否现实
        - 投行访谈和投资者权利审查
    notes: 尽调索取优先围绕会改变建议或估值立场的证据。
    claimRefs:
      - CV034
      - CV035
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
