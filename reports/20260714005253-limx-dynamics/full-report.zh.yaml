            body: >-
              正面论点由几项因素拼在一起：中国人形机器人采用曲线很大，创始团队技术可信，模块化产品公开价格点相对低，COSA
              又承载软件野心。这些要素足以支持继续覆盖，因为这个品类可能跑出创投规模赢家。反论点同样强：从中国销量信号看，LimX 似乎落后于 Unitree 和
              Agibot；公开材料也尚未证明企业需求或单位经济。人形机器人还处在炒作周期，投资人可能在持久毛利出现前就奖励演示。正确姿态是保留期权价值，但不要在证据出现前，为一个已经完全跑通的商业故事付钱。
