            body: >-
              资本充足性是本章最大缺口。2026 年 2 月 US$200 million Series B 是有意义的跑道和扩产输入，规范累计融资输入约为 $250 million，另有一份冲突画像报告 $296
              million。但保留的公开来源均未披露剩余现金、月度烧钱、已承诺资本开支、债务、租赁、项目融资义务、营运资本额度、客户定金或供应商融资。因此，跑道只能用私有数据做情景建模。一个保守承保触发条件很简单：LimX
              必须在 Series B 跑道迫使下一轮融资前，把可见价格、演示和战略背书转化为可重复付费部署。备案和登记查询有助于披露纪律，但 JD.com 的备案门户和登记式页面都无法补足 LimX 的股权经济性或现金余额。
