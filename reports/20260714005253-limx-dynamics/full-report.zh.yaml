            body: >-
              人形机器人是硬件优先的成本结构，但存在软件上行情形。公开来源未披露 LimX
              的物料清单、良率曲线、保修准备金、现场支持人员、组装资本开支或供应商预付款条款。相关成本驱动包括执行器、传感器、电池、算力、材料、QA、集成劳动力和现场支持，以及控制与自主性的持续
              R&D。同行证据混杂：TrendForce 引用 Unitree 招股书数据，显示合并毛利率强劲；负面行业分析则强调零部件成本、定价压力和规模化生产的生存挑战。LimX
              的低入门定价可能扩大开发者需求，但除非零部件成本、良率和附加率快速改善，也会压缩毛利率。营运资本也可能很重，因为库存和测试现金支出先于验收与回款。
