            body: >-
              财务结论是继续研究。LimX 有足够公开证据来承保变现假设：低标价、硬件组合、潜在 COSA
              软件层、可观战略资本和庞大的中国市场背景。但公开证据不足以承保收入质量、毛利率、烧钱速度、跑道或资本效率。最大风险包括低 ASP
              下硬件利润率为负或偏薄、扩产期营运资本吸收、渠道经济性不确定、海外市场监管摩擦，以及估值依赖未来规模而非已披露当前收入。下一步尽调应要求管理层数据室证明：发票、ASP
