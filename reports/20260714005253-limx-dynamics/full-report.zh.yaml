  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              本报告把 LimX Dynamics 视为深圳足式机器人和人形机器人公司的规范主体，后续章节均以此为身份锚点。稳定事实包括：2022 年 1 月成立、总部位于深圳、仍为私营 Series B
              阶段，以及产品范围围绕全尺寸人形机器人、多形态足式机器人和具身 AI 开发者工具展开。官方页面列出 Luna、Oli、TRON 2、TRON 1、COSA
              和开发者支持；独立报道则把业务与硬件平台、科研和教育销售、未来工业或服务部署联系起来。因此，一句话模型是：LimX
              向开发者、实验室、制造商和潜在服务运营方销售并支持人形与多形态机器人平台，同时提供软件和仿真资产。需要提醒的是，这还不是有公开收入、利润率或客户数量证据支撑的财务模型；它是从产品发布、定价、交付表述和开放开发者技术栈推断出来的商业化路径。本概览也刻意在此集中身份和封面事实，便于后续章节引用各自更窄的证据，而不反复改写规范数值。
