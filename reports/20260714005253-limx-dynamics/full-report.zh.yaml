      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录支持一个高质量技术创始故事，但治理视图仍不完整。张巍是核心人物：多个来源一致描述他为创始人兼 CEO、Purdue ECE 博士、UC Berkeley 博士后、Ohio State
              前终身教职学者和 SUSTech 教授，研究方向与 LimX 的全地形运动定位直接契合。张力于 2023 年 11 月从 WeRide
              加入，带来运营和自动驾驶系统信誉，对机器人从实验室演示走向规模化很关键。Robot Testers 还将曾任 University of Hong Kong
              副教授的潘家列为首席科学家。治理缺口与人才信号同样重要：公开来源未披露董事席位、观察员权利、股权控制、创始人持股或继任机制。鉴于技术叙事高度绑定张巍，投资人应把 LimX
              作为创始人-市场匹配度强、但关键人依赖也显著的公司来承保，直到管理层厚度和治理权利在私下得到验证。
