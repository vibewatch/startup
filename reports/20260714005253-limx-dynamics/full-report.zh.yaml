      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑建立在三项相互强化的驱动上：中国生产规模、政策支持的部署压力，以及一条降本路径——它可能让机器人在部分流程中与人工或固定自动化具备经济可比性。TrendForce
              和其他来源指向中国产量快速增长，Morgan Stanley 相关报道则强调工厂 / 物流商业化和国企采购信号。HEIS 2026
              等标准也可能通过给买方提供安全、接口和评估框架来加速采用。约束同样关键。执行器仍占物料成本大头，灵巧操作落后于人类表现，ROI 取决于利用率、集成质量和有效产出。地缘政治限制并不抽象：GUARD Act
              和相关提案可能把中国机器人排除在美国公共部门或敏感基础设施渠道之外，即便全球 TAM 扩张，也会压低可进入 SAM。
