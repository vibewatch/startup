      - number: '7.5'
        title: 财务、单位经济与估值模型风险
        blocks:
          - type: paragraph
            body: >-
              仅靠公开材料无法承销财务模型。融资文章能证明 LimX
              正在投入研发和市场扩张，但没有披露收入、毛利率、现金消耗、资金跑道、保修准备金、获客成本或产品级单位经济。人形机器人比纯软件更怕这种不透明，因为每台设备都带着材料、制造良率、库存、物流、安全、安装、服务和潜在召回敞口。更大行业里的
              IPO
              冲刺和竞争对手规模，制造了融资窗口风险：如果公开市场风险偏好降温，或主导同业重置定价，挑战者可能在部署成熟前被迫以更弱条款融资。低成本机器人作为战略楔子产品时，毛利风险尤其尖锐。因此投资论点应建模下行情景：ASP
              下滑、BOM 节省滞后、保修成本上升，出口限制迫使公司为不同司法辖区做重复产品版本。
