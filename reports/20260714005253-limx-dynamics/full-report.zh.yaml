    summary: LimX 的依赖横跨监管许可、实体供应链、软件保障、投资人和标杆部署。
    data:
      nodes:
        - id: limx
          label: LimX 运营计划
        - id: regulators
          label: 美国 / 中国监管方
        - id: standards
          label: HEIS / 安全标准
        - id: suppliers
          label: 执行器 / 计算 / 电池供应商
        - id: software
          label: ROS / SDK / COSA 技术栈
        - id: capital
          label: 战略与财务投资人
        - id: customers
          label: 工业 / 科研客户
        - id: service
          label: 售后服务网络
        - id: team
          label: 创始人与执行班底
      edges:
        - from: regulators
          to: limx
        - from: standards
          to: limx
        - from: suppliers
          to: limx
        - from: software
          to: limx
        - from: capital
          to: limx
        - from: team
          to: limx
        - from: limx
          to: customers
        - from: limx
          to: service
        - from: service
          to: customers
        - from: customers
          to: capital
    approximationNotes: 依赖图基于公开证据和尽调缺口绘制，并非完整供应商清单。
    claimRefs:
      - CR029
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR040
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 证据链从品类上行空间和产品可信度展开，再过风险与价格纪律两道筛，最终落到“跟踪”建议。
    data:
      nodes:
        - id: market
          label: 2026 年中国市场预测空间大
        - id: product
          label: COSA + 模块化机器人撑起技术期权价值
        - id: proof
          label: 客户经济性与利润率仍未披露
        - id: risk
          label: 竞争与地缘政治风险高
        - id: price
          label: US$1,000M 入场锚点公允，但不便宜
        - id: call
          label: 建议：跟踪
      edges:
        - from: market
          to: call
        - from: product
          to: call
        - from: proof
          to: price
        - from: risk
          to: price
        - from: price
          to: call
    approximationNotes: 定性流程；节点顺序体现投资判断逻辑，而非数学权重。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV021
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 当前入场情景对商业化证明和估值倍数压缩最敏感，头部融资规模反而不是关键变量。
    data:
      items:
        - label: 收入规模验证
          value: 5
        - label: 毛利率改善路径
          value: 5
        - label: 终值倍数
          value: 4
        - label: 故障 / 保修率
          value: 4
        - label: 监管准入
          value: 4
        - label: 战略投资人牵引
          value: 3
    approximationNotes: 分数是 1-5 的方向性敏感度权重，依据本章证据推导。
    claimRefs:
      - CV028
      - CV029
      - CV037
      - CV041
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 方向性情景区间解释了为什么当前价格算公允；若没有非公开证据补强，吸引力仍不足。
    data:
      items:
        - label: 悲观估值结果（US$M）
          low: 300
          high: 700
        - label: 基准估值结果（US$M）
          low: 900
          high: 1400
        - label: 乐观估值结果（US$M）
          low: 2500
          high: 4000
        - label: 稀释前目标总回报（x）
          low: 3
          high: 5
    approximationNotes: US$M 区间仅作方向参考；目标回报是倍数，不是美元金额。
    claimRefs:
      - CV005
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 评分卡权衡市场和产品上行空间，也压入公开经营证据薄弱与高风险。
    data:
      items:
        - label: 市场拉力
          value: 4
        - label: 产品验证
          value: 3
        - label: 客户验证
          value: 2
        - label: 护城河证据
          value: 3
        - label: 经济性可见度
          value: 1
        - label: 风险负担
          value: 5
        - label: 估值公允性
          value: 3
        - label: 证据质量
          value: 3
    approximationNotes: 评分采用 1-5 尽调尺度；风险负担得分越高，代表风险越大，而不是吸引力越高。
    claimRefs:
      - CV002
      - CV003
      - CV011
      - CV024
      - CV030
      - CV034
      - CV045
