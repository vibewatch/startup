companyProfile:
  summary: >-
    LimX Dynamics（凌犀科技）是一家总部位于深圳的具身 AI 机器人公司，成立于 2022 年 1 月，开发全尺寸人形机器人（Luna、Oli）、多形态足式和轮足机器人（TRON 2、TRON
    1）、科研平台（P1、W1）以及 LimX COSA 智能体操作系统。公司于 2026 年 2 月完成 US$200 million Series B，估值达到独角兽水平（>US$1B），投资方包括 JD.com、NIO
    Capital、SAIC 关联的 Shangqi Capital、Oriental Fortune Capital、CoStone Capital 以及阿联酋关联的 Stone
    Venture。公司向科研、工业和服务客户销售机器人硬件与开发者工具包，但商业牵引和财务数据大多仍未披露。
  foundedDate: '2022-01-01'
  founders:
    - name: Wei Zhang
      role: 联合创始人兼 CEO
      background: Purdue ECE 博士、UC Berkeley 博士后，曾任 Ohio State 终身副教授和 SUSTech 教授；专长为强化学习和足式运动。
      claimRefs:
        - CO007
    - name: Zhang Li
      role: 联合创始人兼 COO
      background: 自动驾驶公司 WeRide 前 COO；2023 年 11 月加入 LimX Dynamics。
      claimRefs:
        - CO009
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    全尺寸人形机器人 Luna 和 Oli（Oli 定价约 RMB 158,000 / ~US$22,000）；TRON 2 多形态具身机器人（双臂、双足、轮足；起价约 ~US$6,800）；TRON 1 双足机器人；P1 和 W1
    科研平台；LimX COSA 智能体操作系统，配套开源 SDK 以及强化学习 / sim-to-real 技术栈。
  customerFocus: 机器人研究人员和高校、解决方案集成商，以及潜在工业、物流和服务自动化买家；以中国为主，并宣布拓展中东和美国。
