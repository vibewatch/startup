            body: >-
              典型负面证据集中在这里：GUARD Act、American Security Robotics Act 的适用范围，以及更广泛的中美合规分析，都会直接影响收购方或投资人如何评估 LimX
              的非中国上行空间。GUARD Act 重要，因为它会启用国家安全审查路径和 FCC Covered List 概念；这比常规采购摩擦更宽，一旦中国机器人平台被归为不可接受风险系统，进口可能受损。American
              Security Robotics Act 的适用范围更窄，但仍有价值，因为它说明联邦采购风险已经具体落到机器人，而不只是电信或无人机类比。中国的 HEIS 2026
              是混合风险：标准、安全和伦理规则能让行业更专业，也会带来文件、合规性和全生命周期义务。远程操作、摄像头、ROS/SDK 工具，以及 COSA
              的软件自治层，都会放大隐私和数据安全风险。留存来源未发现公开诉讼或召回记录，应视为证据缺口，而不是免责。
