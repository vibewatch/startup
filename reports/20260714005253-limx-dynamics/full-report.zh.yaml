      - number: '2.2'
        title: 受证据约束的 TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              最干净、受证据约束的 TAM 视角，是 2026 年全球人形机器人年收入约 US$6.2B。对一家以中国为中心的人形和足式机器人供应商而言，最清晰的 SAM 视角来自 Morgan Stanley
              的中国估计：2026 年约 US$2B、出货约 50,000 台，并在 2030 年扩张至约 US$15B 和约 446,000
              台。这些数字之所以原样采用，是因为它们在资料包中反复出现，并被市场报道直接反映。更窄的 SOM 不应被断言为公司事实；只能作为敏感性框架呈现。若按 2026 年中国收入池 1–3%
              份额计算，挑战者隐含年收入机会约为 US$20M–US$60M，且尚未扣除执行、价格、产品组合和监管过滤因素。多家发布方给出更大的长期 TAM 故事，但终点和方法混杂，因此近端估值工作应优先采用对外销售单位视角。
