      - number: '2.5'
        title: 相互矛盾的估计与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              只有保留预测不确定性，而不是把它平均抹平，这个市场才值得投资。Morgan Stanley 的中国对外销售单位视角扎实且具体，但仍依赖 ASP、产量和买方转化假设。全球市场估计也分叉：Axis 和 Fortune
              Business Insights 支持 2026 年约 US$6.2B 的市场，CNBC 对 Barclays 的报道则描述当前 US$2B–US$3B 的小市场，2035 年可能升至 US$200B；更早的
              Goldman Sachs 研究给出了更低的长期基准情形。这些差异不是噪音；它们反映发布方统计的是收入、单位、产能、原型、劳动力替代潜力，还是蓝天服务。缺失的尽调包包括经审计出货、实际
              ASP、利用小时、续购或复购订单、分部毛利率，以及人形机器人收入与更广泛足式科研平台收入之间的清晰拆分。
