      - number: '7.6'
        title: 缓释措施、监测指标、终止标准与尽调问题
        blocks:
          - type: paragraph
            body: >-
              正确的风险应对不是因为行业难就直接否决 LimX，而是把里程碑说清楚。法律缓释要求在计入美国或政府邻近收入前，先完成司法辖区地图、产品原产地分析、FCC/GUARD
              情景计划、数据流架构、出口管制审查和采购资格法律意见。运营缓释需要一份机队档案：已部署单元、机队小时数、主要故障模式、事故严重度、保修准备金、软件更新控制、渗透测试和客户验收证书。商业缓释需要已签客户合同，明确用例、价格、可用性义务和续约条款。财务缓释需要从
              BOM 和制造良率桥接到毛利率和现金消耗。论点失效触发器包括：覆盖中国机器人的进口禁令生效、无法说出可背书客户、拿不出可靠性日志、Unitree/Agibot 在份额上持续占优且 LimX
              没有差异化细分位，或新融资条款显示估值支撑跑在部署证据前面。
