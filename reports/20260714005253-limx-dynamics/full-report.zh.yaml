              自主部署演示，并报道向中东和美国扩张的雄心。这些点有助于判断产品成熟度和市场叙事，但不等同于付费单位、已确认收入、利用率、留存或毛利率。即便是多机器人演示，也不是客户队列，除非它包含交易对手、价格、验收标准、服务义务和回款时点。同样，所谓数千台交付计划，在有已签订单证据前不能成为积压订单。尽调文件应保留这一区分：公开牵引支持需求可信度，私有指标才决定收入质量、可重复性和现金转化。
