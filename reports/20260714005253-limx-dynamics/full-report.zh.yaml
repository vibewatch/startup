  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价与确认
        blocks:
          - type: paragraph
            body: >-
              LimX 的公开财务表面异常狭窄：公司展示了产品广度和标价锚点，但没有披露收入、订单双、ARR、毛利、积压订单或收入确认政策。最清晰的收入流是 Oli、TRON 2
              和其他机器人平台的硬件单机销售，COSA、SDK、部署、培训和维护周围可能还有软件与支持层。Oli 约 RMB 158,000 / $22k 的标价，以及 TRON 2 约 $6.8k–$7.0k
              的入门价，提供了有用的数量级 ASP
              边界，而不是实际折扣、捆绑服务、回款时点或利润率证据。因此，收入确认仍是尽调事项：预订、定金、试点单位和演示机的会计处理，可能与已验收商业交付完全不同。承保模型应把产品价格视为变现信号，并在管理层提供队列级发票和确认时间表前，将实际收入组合保持为空值。
