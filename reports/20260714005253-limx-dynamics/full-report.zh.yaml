            body: >-
              退出准备度仍有条件。若 LimX 能拿出经审计的收入增长、毛利率改善、安全合规，并降低对演示的依赖，中国或香港 IPO
              路径可能成立。零售、汽车、工业自动化和中东资本关系带来战略退出可选性，但这些路径需要合同证据。非中国退出需要法律折扣，因为针对中国机器人的拟议限制会缩小买方范围和渠道准入。最终尽调包应优先证明：客户正在付费，机器人可靠，低价位下毛利撑得住，融资结构在优先权之后仍给普通股留下上行。缺少其中任何一项，建议都应停留在跟踪。
