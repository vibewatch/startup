  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              LimX
              的风险栈由几类可能在产品-市场匹配完全证明前就关门的风险主导：海外法律暴露、国内标准合规，以及残酷的中国竞争。最高严重度问题不是某个公司特定执法行动，而是一条政策向量。美国立法者明确讨论对中国机器人实施进口和采购限制；与此同时，中国正在加速
              HEIS 标准和 MIIT / SASAC 真实场景部署计划。这会造成分裂世界路径：国内政策可能创造需求和标准清晰度，但海外买方可能把中国人形机器人视为联网国家安全硬件。第二层是执行风险：Unitree 和
              Agibot 看起来扩张更快，LimX 必须拿出可靠部署、制造良率、安全日志和客户
              ROI。第三层是财务风险：公开来源显示融资势头，却不显示收入、利润率、烧钱速度或保修经济性。投资含义是维持跟踪姿态，除非管理层能把演示和融资转化为经审计部署，并配套可防守的合规架构。
