        title: 建议与价格判断
        blocks:
          - type: paragraph
            body: >-
              LimX 值得跟踪，而不是立即买入，因为 Series B 轮给了可信资金跑道和战略背书，但公开证据仍把核心承销变量留在私域。IC 案例对价格敏感：以 10
              亿美元作为入场锚点，放在全球人形机器人异常高估样本旁并不明显过高；但在 LimX
              尚未公开收入运行率、毛利率、在手订单或付费部署留存前，也谈不上便宜。我会继续监测这家公司，只有尽调确认客户经济、股权结构条款和监管退出路径后，才准备一级或二级出价。本章的工作判断是：中等置信度、高风险、估值公平；在进一步稀释前，需要至少
              3 倍总回报路径。
