              监测节奏应由里程碑驱动，而不是由新闻驱动。最重要的正面信号是具名且已付款的部署、重复订单、保修表现，以及能解释低机器人价格如何变成可投资毛利的制造良率。最重要的负面信号是估值下调融资、优先权过重的融资、被目标出口市场监管排除，或演示与客户经济之间的缺口持续存在。如果
