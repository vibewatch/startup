  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              本章把市场定义为对外销售的人形机器人，以及能够执行、测试或加速人形机器人式移动和操作流程的近邻足式机器人平台。纳入的支出包括硬件、机载软件、开发者工具、部署支持和车队集成，前提是这些元素捆绑进机器人采购或试点。排除的支出包括传统工业机械臂、AMR、协作机器人、纯软件、仅原型机、内部演示机，以及不代表外部销售的预订试用机。这一区分很重要，因为最常被引用的中国预测明确过滤掉原型和内部使用单位。相关替代方案也不只是竞品人形机器人；买方还可以继续使用人工、安装固定自动化、用
              AMR 或协作机器人处理更窄任务、依赖遥操作，或自建机器人工具。足式科研套件处在边界上：它们可能不是量产人形机器人，但能培养开发者，并在未来可迁移到人形机器人的流程中证明运动能力。
