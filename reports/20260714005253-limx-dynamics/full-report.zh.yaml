            body: >-
              Go-to-market 证据指向直接企业销售和合作驱动动作，而不是自助式机器人电商。LimX 展示了订单咨询、门店 /
              合作和企业支持路径；融资报道则显示战略投资人可能转化为工业渠道或供应链伙伴。这有帮助，但不足以计算
              CAC、回本期或销售产能。最好的公开代理是定性的：人形机器人仍高度依赖试点、集成和证明，演示与多年市场进入计划通常早于已确认付费部署。战略投资人或许能降低进入成本，但公开记录没有披露转介绍转化、经销商利润率、最低采购承诺、伙伴出资部署或客户集中度。因此，销售效率分析应停留在代理层面，并要求按阶段拆分管线、已签订单金额、实施成本、销售人头和伙伴经济性。
