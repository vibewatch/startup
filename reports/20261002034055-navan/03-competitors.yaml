callouts:
  - calloutType: "insight"
    title: "The Enterprise Disruption Chasm"
    body: "While Navan has demonstrated rapid expansion in mid-market accounts and achieved a record $4.0 billion in signed SLG Gross Booking Volume, unseating SAP Concur at Global 2000 enterprises remains constrained by legacy ERP integrations. Large enterprises frequently treat expense reporting not as an employee productivity app, but as a compliance subsystem of SAP S/4HANA or Oracle Financials, where implementation inertia and multi-entity global tax compliance outweigh user satisfaction advantages."
    claimRefs:
      - "CP001"
      - "CP008"
      - "CP012"
  - calloutType: "risk"
    title: "Supplier Pushback Against Behavioral Demand Shifting"
    body: "Navan's reliance on rewards to steer employees toward cost-effective booking choices introduces friction with major hotel suppliers. Because Navan Rewards actively redirects corporate travelers toward cheaper properties to capture cost savings, hotel operators face margin compression and rate dilution. Over the long term, this algorithmic demand shaping risks supplier resistance or reluctance to grant favorable corporate inventory access."
    claimRefs:
      - "CP013"
      - "CP014"
