            body: >-
              Navan 的竞争壁垒建立在高平台切换成本、Ava 智能体的自研 AI 编排，以及基于新分销能力（NDC）的直接供应商连接上，例如与 Hilton 的直连酒店-TMC 集成，以及与 Iberia 和 ITA
              Airways 的航司合作。在销售驱动增长（SLG）板块，Navan 商业拓展势头迅猛，截至 Q2 FY2027 的过去 12 个月内，新签约总预订额（GBV）达到创纪录的 $4.0
              billion。然而，这条护城河的持久性面临实质性的结构性考验。传统巨头拥有深厚的销售网络以及沿用数十年的企业审计配置，极难被轻易替换。与此同时，Navan 的员工激励机制（如 Navan
              Rewards，为选择实惠住宿的员工发放个人差旅奖励金）引发了供应商的不满反弹。独立酒店业分析显示，酒店合作伙伴对算法推荐和将客流导向低价酒店的做法日益担忧，这可能削弱供应商的价格体系完整性，并增加长期商业合作的变数。
