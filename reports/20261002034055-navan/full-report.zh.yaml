chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、经营演进与商业模式
        blocks:
          - type: paragraph
            body: >-
              Navan, Inc. (NASDAQ: NAVN) 运营一体化云平台，整合商务差旅预订、企业费用管理、会议会务及企业支付卡 [CO001]。公司由联合创始人 Ariel Cohen（首席执行官）与 Ilan
              Twig 最初于 2015 年创立，原名 TripActions，后于 2023 年 2 月更名为 Navan，反映其业务已从企业差旅预订延伸至企业卡、自动化合规执行及财务工作流 [CO001,
              CO002]。Navan 总部位于加利福尼亚州 Palo Alto，2025 年 10 月首次公开募股后在纳斯达克全球精选市场挂牌交易 [CO001,
              CO002]。公司采用重交易量的混合变现模式：基于用量的平台费、供应商差旅预订佣金及企业卡刷卡分成约占总收入的 91%，软件订阅费贡献其余 9% [CO001, CO004]。FY2026 全年总收入同比增长
              31% 至 $702 million，其中用量费用为 $640 million，软件订阅收入为 $62 million [CO001]。截至 Q2 FY2027 的近期季度中，单季总收入达到 $233
              million，总预订额（Gross Booking Volume）增至 $3.0 billion，印证了中型市场与跨国企业客户持续的采纳势头 [CO004, CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
