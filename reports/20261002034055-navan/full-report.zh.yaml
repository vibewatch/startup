      - number: '1.3'
        title: 资本结构、诉讼披露与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              上市之前，Navan 累计从 Lightspeed Venture Partners、Andreessen Horowitz、Greenoaks Capital 和 Coatue Management
              等机构筹得约 $2.3 billion 风险股权与债权融资 [CO002, CO006]。2025 年 10 月，Navan 将纳斯达克 IPO 发行价定为每股 $25.00，获得 $713 million
              净募集资金，建立起 $740 million 现金及短期投资储备，而长期债务仅为 $125 million [CO006]。FY2026 期间，自由现金流从 FY2025 的负 $66.7 million
              跃升至正 $14.8 million，提前整整一年实现现金流转正，经营执行印证了管理层的自我造血时间表 [CO001, CO006]。然而，披露风波导致公开市场估值在 2026 年 4 月承压下挫至约每股
              $12.00（折合市值 $3.6 billion）[CO002, CO006]。2026 年 2 月 23 日，原告方向美国加利福尼亚北区联邦地区法院提起假定证券集体诉讼，指控公司违反《证券法》第 11 条和第
              12 条，重点指向未披露的销售及营销费用走向以及逐步停用收购来的 Reed & Mackay 品牌 [CO006]。与此同步，Non-GAAP 营业利润率从 FY2025 的负 5% 升至 FY2026 的正
              5%；但 Q2 FY2027 高达 $43 million 的股权激励费用拖累 GAAP 营业亏损扩大至 $26 million，凸显出 Non-GAAP 盈利能力与 GAAP 净亏损之间的持续分化
              [CO001, CO004, CO005]。
