      - number: '7.2'
        title: 运营、安全与 AI 可靠性
        blocks:
          - type: paragraph
            body: >-
              Navan 平台汇集了高度敏感的差旅、支付及费用数据；公司披露其工作流可在每笔预订中抓取超过 110 个数据点，在每笔报销交易中抓取超过 130 个数据点
              [CR015]。这种广泛度加剧了访问权限控制、隐私泄露、欺诈或服务可用性故障的潜在后果，但并不意味着已经发生了安全事件。10-K 报告指出，Navan
              承担企业卡产品的全部信用风险，对发卡银行负有最终清算责任，且此前曾遭遇第三方基础设施引发的服务中断 [CR010,
              CR011]。已披露的防范措施包括首席信息安全官（CISO）主导的跨职能安全机制、审计委员会监督、应急响应、业务连续性方案、加密技术、渗透测试及供应商风险评估 [CR012]。引入 AI
              带来了额外的控制暴露面。一份总结 Navan 架构师发言的独立行业材料指出，智能体存在非确定性测试瓶颈，以及尚未解决的算力成本、回放与调试难题，尽管系统配备了工具调用前后的护栏与细粒度授权机制 [CR013,
              CR014]。核心投资逻辑的潜在破坏点十分明确：一旦发生重大数据泄露、长周期预订宕机、企业卡未收回坏账攀升，或者 AI 行为绕过客户合规政策，均应直接触发逻辑重审，而绝不能仅凭控制机制的存在便高枕无忧。
