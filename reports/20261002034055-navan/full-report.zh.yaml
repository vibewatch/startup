      items:
        - label: 2015：以 TripActions 品牌创立
          details: Ariel Cohen 与 Ilan Twig 在 Palo Alto 联合创立，旨在打破传统企业差旅管理平台的格局。
          claimRefs:
            - CO001
            - CO002
        - label: 2021：欧洲及全球业务扩张
          details: 收购英国差旅服务商 Reed & Mackay，扩大国际企业客户布局及高端 VIP 差旅业务。
          claimRefs:
            - CO001
            - CO006
        - label: 2023 年 2 月：品牌更名为 Navan
          details: 由 TripActions 更名为 Navan，整合差旅预订、费用管理及企业卡业务。
          claimRefs:
            - CO001
            - CO002
        - label: 2025 年 10 月：首次公开募股（IPO）
          details: 在 Nasdaq 完成首次公开募股，发行价为每股 $25.00，募集一手净资本 $713M。
          claimRefs:
            - CO006
        - label: 2026 年 2 月：证券诉讼与 CFO 换届
          details: 因 S-1 销售与营销费用披露问题遭遇证券集体诉讼；Aurélien Nolf 出任 CFO。
          claimRefs:
            - CO006
        - label: 2026 年 3 月：自由现金流转正拐点与 FY26 财报公布
          details: 公布 FY2026 收入为 $702M（同比增长 31%），全年自由现金流转正达 $14.8M。
          claimRefs:
            - CO001
            - CO006
        - label: 2026 年 4 月：财务领导层架构整合
          details: 首席会计官（CAO）离职；CFO Nolf 兼任首席会计官职责；董事 Williams 以 $12 买入 100k 股。
          claimRefs:
            - CO006
        - label: 2026 年 9 月：Q2 FY2027 扩张与收购
          details: Q2 收入达到 $233M（同比增长 35%），GBV 达 $3.0B；收购 Smartrips 与 BoomPop。
          claimRefs:
            - CO004
            - CO005
    approximationNotes: 里程碑日期整理自经审计的 SEC 报告、监管披露文件及企业新闻稿。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO006
  - id: FM001
    title: Navan 市场规模测算架构与收入机会金字塔
    type: pyramid
    summary: 对 Navan 总可用市场（TAM）的分层拆解，从宏观全球商务差旅支出层层细化至可获取的软件与支付收入机会。
    data:
      items:
        - label: 全球商务差旅总支出（$2,900B）
          value: 2900
          valueNote: Euromonitor 预测截至 2029 年的宏观企业差旅支出（65% 未由传统 TMC 管理）
        - label: 总可用收入市场（$185B）
          value: 185
          valueNote: Navan 估计在差旅、费用、支付与公私兼顾差旅（Bleisure）领域的全球 TAM
        - label: 商务差旅管理机会（$86B）
          value: 86
          valueNote: 全球托管及非托管差旅预订的商业变现机会
        - label: 费用管理与支付机会（$76B）
          value: 76
          valueNote: 费用 SaaS 软件（$39B）与银行卡净交换费（$37B）的合计规模
        - label: 公私兼顾差旅变现机会（$24B）
          value: 24
          valueNote: 按 7% 使用费率乘以 $324B 可服务公私兼顾差旅市场测算
        - label: Navan 年化总预订金额运行率（$12.5B）
          value: 12.5
          valueNote: 当前平台规模占核心可用市场的渗透率不足 8%
    approximationNotes: 数值直接提取自 Navan Form 424B4 SEC 申报文件、Euromonitor International 市场报告及 Q2 FY2027 已披露财务数据。
