      - number: '8.3'
        title: 情景分析、催化剂与尽调框架
        blocks:
          - type: paragraph
            body: >-
              涵盖乐观、基准与悲观路径的概率情景模型表明，Navan 在当前交易估值下的风险收益比趋于均衡。在乐观情景下（25% 概率），Navan 保持 35%+ 的营收扩张，顺利将高接触 Reed & Mackay
              客户迁移至核心基础设施，并将 non-GAAP 营业利润率提升至 10% 以上，从而超出指引上限。沿这一路径，企业价值倍数向 10.0x 远期销售额扩张，支撑起 $9.0 billion 至 $9.5
              billion 的估值区间。在基准情景下（55% 概率），Navan 业绩落在调整后的 FY2027 指引区间内，实现营收 $866 million 至 $913 million、non-GAAP 营业利润
              $58 million 至 $80 million，同时年度 GAAP 净亏损适度收窄。按 7.0x 至 7.5x 企业价值倍数测算，基准估值与当前 $6.2 billion 至 $7.0 billion
              的交易区间相符，收益预期持平至温和。在悲观情景下（20% 概率），全球企业差旅削减、聚合商预订故障与持续 GAAP 亏损引发倍数压缩至 4.0x 销售额，将估值压低至 $3.5 billion 至 $4.0
              billion。因此，我们的评级建议维持跟踪，较具吸引力的重新买入触发点设在股价回调至 $18.00 以下，或经审计确认实现可持续的 GAAP 营业盈利。
