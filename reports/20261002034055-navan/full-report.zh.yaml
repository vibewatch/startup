  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 法律、监管与公司治理风险敞口
        blocks:
          - type: paragraph
            body: >-
              直接面临的法律悬念是 2026 年 2 月 23 日向美国加州北区联邦地区法院提起的拟定证券集体诉讼。诉状指控 Navan 在 IPO 招股文件中就销售及营销费用发表了重大虚假与误导性陈述；SEC
              申报文件记录了指控内容、Navan 积极应诉抗辩的意图，并注明可能发生的损失目前尚无法估计，这并非已裁决的违法行为 [CR004]。监管合规敞口则不仅限于此案。Navan
              披露其支付业务涉及银行业务、资金转账、借贷、反洗钱、制裁及 PCI-DSS 合规制度，同时个人与财务信息的处理亦受制于不断变化的美国及国际隐私规则 [CR008,
              CR009]。治理层面的风险缓释措施仍不完备：管理层表示此前财务报告存在的重大缺陷已在 FY2025 前完成整改，但受成长型新兴企业（EGC）豁免政策保护，外部审计机构目前尚无需出具鉴证意见 [CR005,
              CR006]。B 类普通股每股拥有 30 票投票权，而 A 类股仅为 1 票，使创始人对重大交易保持高度集中的话语权 [CR007]。后续应密切监控法庭诉讼日程、牌照问询、隐私执法行动、2027
              财年内部控制报告，以及外部审计结论或创始人投票权集中度的任何变动。
