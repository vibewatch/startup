      - number: '6.2'
        title: 采纳增长轨迹、AI 工作流与用户体验摩擦
        blocks:
          - type: paragraph
            body: >-
              平台采纳在 FY2026 达到可观的运营规模：Navan 服务超过 12,500 家活跃客户（定义为过去 12 个月内产生 6 笔或以上交易的账户），处理逾 1,200
              万（12M）次出行，对应总预订额（GBV）达到 $9.1 billion [CU001, CU005]。用户预订行为展现出深厚的数字化习惯，移动端与线上渠道占预订总量的 90%，并将平均预订耗时压缩至 7
              分钟，远优于传统差旅服务机构 45 分钟的行业基准 [CU003]。为进一步加快自动化报销流转，Navan 部署了包括 Navan Expense Chat 在内的智能体 AI 能力；该功能平均每张票据仅需
              2.6 秒即可自动提取细分明细，彻底免除人工报销提交，在内测阶段取得 94% 的客户满意度（CSAT）评分 [CU002]。然而，来自企业行政人员与差旅采购专业人士的独立反馈指出了持续存在的落地摩擦
              [CU006]。一线实务评估显示，当通过第三方差旅聚合平台（如 Booking.com 和
              Hotels.com）流转的订单遇到退改签问题时，容易出现客服响应瓶颈，外加复杂的合并开票延迟阻碍企业对账，以及一线客服初审分流机制给差旅协调员带来额外运营负担 [CU006]。
