  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              企业商旅及费用管理生态涵盖受控差旅方案、非受控员工自订、商旅兼休闲（'bleisure'）行程、自动化报销及企业卡支付处理。从历史上看，企业支出管理长期割裂在传统差旅管理公司（TMC，如 American
              Express Global Business Travel 和 BCD Travel）、独立的费用管理 SaaS 平台（如 SAP
              Concur）以及商业发卡行之间。这种分割给财务团队带来繁重行政负担，员工面对僵化的预订系统也体验欠佳。Navan
              将其总可用市场定义为软件加支付的一体化市场，而非狭隘的代理佣金模式，将预订、支付、发卡和自动化费用捕获整合进统一云平台。其纳入口径的核心支出包括机票、酒店住宿、火车、租车、商业支付刷卡分成以及企业费用工作流订阅费；核心人力资本管理软件、广义企业资源计划（ERP）套件以及与企业无关联的个人度假休闲消费均排除在外。当前的替代方案依然根深蒂固：许多企业仍停留在自订模式，靠员工用电子表格手动贴票报销；或受制于传统
              TMC 合同，面临移动端采纳率低及违规脱落差旅政策等问题。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
