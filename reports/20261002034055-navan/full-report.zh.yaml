              Mackay（R&M）客户从传统高人工服务平台迁移至 Navan 核心数字化云基础设施上。智能体 AI
              工作流与老旧服务迁移的双重推进，带来了显著的技术与尽调风险：基于大语言模型的自主报销审批必须具备严苛的防护栏以防范审计漏洞与欺诈风险；高吞吐全球分销系统（GDS）API
