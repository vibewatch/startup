  - id: FE001
    title: Navan 企业级平台架构技术栈
    type: stack
    summary: 六层云架构栈展示 Navan 从用户展现层到企业 ERP 集成的端到端平台体系。
    data:
      layers:
        - label: 客户端展示层
          detail: 响应式 Web 门户与原生 iOS/Android 移动端应用，提供一体化的企业差旅预订、收据采集和管理看板。
        - label: 智能体 AI 与辅助层
          detail: Navan Edge 对话式差旅助手与自主 AI Expense Agent，实现复杂行程自动化管理和零人工介入收据对账。
        - label: 核心企业服务与政策引擎
          detail: 运行在 AWS 上的 Java 与 Spring Boot 微服务，执行实时政策评估、动态多级审批流及合规校验。
        - label: 事件流与数据管道
          detail: 基于 Apache Kafka 与 AWS Kinesis 的分布式事件流骨干，处理高吞吐量的预订事件、审计日志及交易元数据。
        - label: 数据持久化与交易存储
          detail: 运行在 AWS 上的可扩展关系型 SQL 与分布式 NoSQL 数据库，提供 ACID 事务保证、用户画像存储及加密财务记录。
        - label: 企业 ERP 与外部集成层
          detail: 安全的双向 API 连接器，与 SAP、Oracle、NetSuite、银行支付网关及全球分销系统（GDS）实现集成。
    approximationNotes: 逻辑架构抽象基于 Navan 技术招聘要求、公开产品文档及工程规范整理。
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程与扩张生命周期
    type: journey-map
    summary: 详细标绘从初步认知、自主 / 企业入驻、平台采用到多产品扩张的客户全流程触点。
    data:
      items:
        - label: 1. 认知与定向触达
          details: 借助付费社交媒体、SEO 及针对 CFO 和财务主管的外呼获客，开展多渠道需求挖掘。
          touchpoints:
            - 付费搜索与数字广告
            - 客户总监（AE）主动拓展节奏
            - 出差员工口碑推荐
          claimRefs:
            - CU001
            - CU004
        - label: 2. 评估与概念验证（PoC）
          details: 产品演示量化对比传统 TMC 带来的开支节省，并针对动态差旅政策规则提供解决方案。
          touchpoints:
            - 交互式平台演示
            - 差旅政策校准工作坊
            - 征求建议书（RFP）提交与评审
          claimRefs:
            - CU001
            - CU004
        - label: 3. 入驻与落地实施
          details: 以 60 天以内为目标的快速部署，配备强制使用政策与自动化主体核验。
          touchpoints:
            - 专属实施顾问
            - ERP 与 HRIS 集成配置
            - 员工平台培训
          claimRefs:
            - CU001
            - CU007
        - label: 4. 日常预订与支出捕捉
          details: 员工高频使用移动端预订并刷企业卡消费，系统自动对账收据。
          touchpoints:
            - 移动端 7 分钟机酒预订
            - 虚拟卡与实体卡刷卡消费
            - 对话式 AI Expense Chat 记账
          claimRefs:
            - CU002
            - CU003
        - label: 5. 运营支持与服务
          details: 依托 Ava 虚拟助理提供 24/7 AI 优先服务，并设有转接人工客服的升级通道。
          touchpoints:
            - 自动化聊天改签工作流
            - 聚合渠道库存问题排查与解决
            - 行程受阻与恶劣天气保障
          claimRefs:
            - CU001
            - CU006
        - label: 6. 客户拓展与成熟跃迁
          details: 搭售附加软件模块（Payments、Expense、Events、VIP），带动第 2 年收入扩张 3x 至 5x。
          touchpoints:
            - CS 季度业务复盘
            - 发卡与报销业务扩张
            - 从 PLG 跃升至企业级 SLG
          claimRefs:
            - CU001
            - CU003
    approximationNotes: 生命周期各阶段综合整理自 Navan 的 GTM 运营蓝图、实施指南和客户评价。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU007
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性排序区分已披露风险敞口与应对成熟度，并明确可监控的投资逻辑破灭信号。
    data:
      columns:
        - id: likelihood
          label: 发生概率
        - id: impact
          label: 影响程度
        - id: mitigation
          label: 应对成熟度
        - id: trigger
          label: 投资逻辑破灭触发条件
      rows:
        - id: securities-litigation
          label: 证券诉讼
          values:
            - 现存
            - 高
            - 早期
            - 不利实体裁决、无保险覆盖的重大损失，或诉讼主张扩大
          tones:
            - negative
            - negative
            - warning
            - negative
        - id: gaap-losses
          label: GAAP 亏损与现金流逆转
          values:
            - 高
            - 高
            - 改善
            - 经营现金流持续为负，且 GAAP 亏损长期延续
          tones:
            - negative
            - negative
            - warning
            - negative
        - id: supplier-dependence
          label: 差旅供应商依赖
          values:
            - 中
            - 高
            - 成形
            - 核心库存重大流失或佣金率承压
          tones:
            - warning
            - negative
            - warning
            - negative
        - id: card-credit-fraud
          label: 卡业务信贷与欺诈
          values:
            - 中
            - 高
            - 成形
            - 未追回损失持续上升，或发卡合作方施加限制
          tones:
            - warning
            - negative
            - warning
            - negative
        - id: cloud-privacy
          label: 云服务、网络安全与数据隐私
          values:
            - 中
            - 严重
            - 成熟
            - 重大安全泄露、长时间宕机，或数据处理受限
          tones:
            - warning
            - critical
            - positive
            - critical
        - id: ai-reliability
          label: AI 智能体可靠性
          values:
            - Unknown
            - 高
            - 起步
            - 多次绕过差旅政策、出现预订错误，或推理成本失去经济性
          tones:
            - neutral
            - negative
            - warning
            - negative
    approximationNotes: 发生概率、影响程度与应对成熟度均为分析师结合已披露敞口和控制举措做出的定性评估；并非实测概率、事故率或预测指标。
