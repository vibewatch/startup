      - number: '2.3'
        title: 买方细分、采购动态与采纳路径
        blocks:
          - type: paragraph
            body: >-
              Navan
              的市场开拓架构覆盖三大核心群体：高增长中型企业、复杂跨国集团，以及依托产品驱动增长（PLG）触达的个人商务旅客。在中型企业中，采购决策权归属于首席财务官（CFO）、财务副总裁或财务审计长，他们看重自动化政策执行、两周快速上线，以及借助一体化发卡消除手工报销单。在大型跨国企业中——Navan
              客户现已囊括 Adobe、Visa、Enbridge 和 Ingersoll Rand 等 50 家标普 500 强企业——评估流程由企业采购部门、差旅项目经理和内部审计委员会主导。这类大型买家要求接入覆盖全球
              600 家航空公司与 200 万（2M）处住宿资源的库存，对接人力资源信息系统（HRIS）及 ERP
              平台，并满足企业对员工安全关照（duty-of-care）的合规要求。然而，大型企业的采纳面临阻力：方案招标（RFP）周期通常长达 6 至 9 个月，随后是 2 个月的实施期和约 5
              个月的用户导入期。与此同时，以 Navan Edge 和对话式助手 Ava 为代表的 PLG 引擎直接面向终端用户，带动自下而上的自发使用，后续再转化为销售主导的大型企业合同。
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
