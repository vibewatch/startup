              Navan 股价从 2026 年 3 月的 $8.50 迅速回升至 2026 年 7 月的 $27.25，展现出华尔街对 AI 驱动的企业差旅自动化与营收再度提速的热情。然而，机构投资者必须区分 non-GAAP
