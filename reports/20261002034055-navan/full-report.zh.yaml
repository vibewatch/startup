  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 结构化流程展示决策逻辑，串联平台规模、运营阻力与市场估值，推导出「观察」评级建议。
    data:
      nodes:
        - label: 规模：FY26 收入 $702M（+31% YoY），总预订量达 $9.1B
        - label: 现金生成：自由现金流转正（FY26 为 $15M）
        - label: 盈利拖累：FY26 录得 $197M 大额 GAAP 营业亏损
        - label: 服务阻力：第三方聚合渠道支持引发客户投诉
        - label: 估值反弹：市值自 3 月低点反弹 3x 至 $6.9B
        - label: 投资建议：「观察」评级，目标在 $18.00 以下重新入场
      edges:
        - from: 'Scale: $702M FY26 revenue (+31% YoY) and $9.1B gross booking volume'
