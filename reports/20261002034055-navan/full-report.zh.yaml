  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块范畴
        blocks:
          - type: paragraph
            body: >-
              Navan 将自身核心产品定义为一体化企业差旅与费用管理平台，旨在以集成式软件套件替代零散割裂的传统企业系统。该平台将商业航班、酒店住宿、铁路与租车在内的企业差旅库存接入，与动态差旅政策实时核验、全天候 24/7
              自动化差旅支持、实体及虚拟企业卡发卡，以及自动化费用核对工作流统一整合至单一界面。终端用户借助具备消费级体验的 Web
              端与移动端应用完成操作，减少预订摩擦并消除员工差旅自垫费用；企业财务与差旅管理团队则使用集中式管理控制台，获取实时透明度，执行自动化审批流转与合规治理。Forrester Consulting
              展开的独立经济影响测算显示，将割裂的企业差旅与费用单点方案整合至 Navan 统一平台，能够带来显著运营效率提升：每趟行程可为企业差旅员工节省多达 10 分钟预订时间，单笔报销提交耗时缩短 24
              分钟，并为差旅管理人员释放约 85% 原先用于手工协调与制表统计的行政精力。
            claimRefs:
              - CE001
