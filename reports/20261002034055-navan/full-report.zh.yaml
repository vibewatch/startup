  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 按时间顺序展现 Navan 从 2015 年成立，历经多轮融资、品牌重塑、Nasdaq IPO 以及 FY2027 规模化运营的发展历程。
