  - id: FI001
    title: Navan 总预订金额转化与收入流向
    type: flow
    summary: 直观呈现总预订金额与银行卡支付规模如何转化为使用费收入、订阅费、毛利率及经营活动现金流。
    data:
      nodes:
        - id: gross-booking-volume
          label: 总预订金额（$9.1B FY26 / $3.0B Q2 FY27）
        - id: payment-volume
          label: 卡支付金额（$4.1B FY26 / $1.3B Q2 FY27）
        - id: usage-revenue
          label: 使用费收入（~7% 费率；$640M FY26 / $211M Q2 FY27）
        - id: subscription-revenue
          label: 费用订阅收入（$62M FY26 / $21M Q2 FY27）
        - id: net-revenue
          label: 净收入总额（$702M FY26 / $233M Q2 FY27）
        - id: gross-profit
          label: 毛利 74% GAAP / 75% 非 GAAP（$172M Q2 FY27）
        - id: free-cash-flow
          label: 正向自由现金流（$15M FY26 / $21.5M Q2 FY27）
      edges:
        - from: gross-booking-volume
          to: usage-revenue
        - from: payment-volume
          to: usage-revenue
        - from: usage-revenue
          to: net-revenue
        - from: subscription-revenue
          to: net-revenue
        - from: net-revenue
          to: gross-profit
        - from: gross-profit
          to: free-cash-flow
    approximationNotes: 基于 FY2026 全年披露业绩及 Q2 FY2027 财务表现呈现商业变现架构。节点标示出核心现金与收入分流关口。
