      - number: '7.3'
        title: 财务、合作伙伴与执行依赖
        blocks:
          - type: paragraph
            body: >-
              Navan 依然面临账面亏损与现金流改善之间的背离。2026 财年 GAAP 净亏损为 $398 million，而公司自定口径的自由现金流为 $14.764
              million；因此，自由现金流转正只是流动性改善信号，绝非实现 GAAP 盈利的证明 [CR002, CR003]。申报文件亦指出，2027
              财年经营现金流可能在正负之间波动，业务扩张可能需要额外资金支持。在商业端，差旅库存与用量收入依赖供应商协同、GDS 商业条款、直连协议、佣金率以及获取具备竞争力库存的能力
              [CR001]。企业卡产品增加了对发卡银行与卡组织的依赖，云服务商及其他供应商则位于关键交付链路上 [CR010,
              CR011]。公开招聘动向侧重于产品、工程、设计及客户支持的跨职能交付，但并未提供人员编制冗余、员工流失率或项目交付效能的基准分母 [CR016]。后续需将季度 GAAP
              亏损与现金流合并审视，并关注供应商佣金或库存策略变动、银行或卡组织合同限制、客户支持服务质量等级（SLA），以及平台迁移中的客户留存。若经营现金流再度转负，同时供应商库存或支付渠道受阻，将实质性动摇规模化扩张的核心逻辑。
