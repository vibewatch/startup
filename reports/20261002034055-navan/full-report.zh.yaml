      - number: '5.3'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Navan 底层技术架构采用主要托管在 Amazon Web Services（AWS）上的分布式云原生微服务体系。核心后端服务采用 Java 语言及 Spring Boot
              应用程序框架构建，专为跨全球地理区域的高并发、低延迟与水平扩展能力而设计。关键事务引擎——包括差旅政策评估、动态多级审批流以及合规审计微服务——作为高吞吐状态机运行，由分布式关系型（SQL）与非关系型（NoSQL）数据库共同承载。高吞吐异步数据流与事件管道借助
              Apache Kafka 和 AWS Kinesis 等分布式流处理基础设施，处理实时交易事件、企业预订变更及企业审计日志。在数据集成边界，Navan 维护双向数据管道与 ERP
              连接器产品，直接对接顶级企业资源计划平台，尤其是 SAP、Oracle 和
              NetSuite。这类集成服务负责会计科目映射、税务合规、总账凭证分录及自动化银行对账，需依赖完善的重试机制与模式校验以降低财务记录同步偏差风险。
