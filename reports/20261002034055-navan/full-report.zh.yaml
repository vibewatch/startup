      - number: '8.2'
        title: 融资历程与当前估值背景
        blocks:
          - type: paragraph
            body: >-
              Navan 的资本轨迹折射出后期企业级软件公司的激进扩张，以及随后公开市场的估值重校。首次公开募股前，Navan 经多轮风险投资与成长期融资筹集了大量一级市场资金；在 Coatue、Andreessen
              Horowitz 及 Premji Invest 领投的 $300 million 融资后，公司于 2022 年 10 月达到 $9.2 billion 的最高投后估值。2025 年 10 月 30
              日，Navan 在 Nasdaq Stock Market 完成首次公开募股，以每股 $25.00、折合 $6.21 billion 的发行估值筹资 $923 million，较其 Series G 顶峰估值折让
              32%。上市后交易剧烈波动：投资者对持续 GAAP 亏损的疑虑拖累股价于 2026 年 3 月 24 日跌至 $8.50 低谷，截至 2026 年 3 月下旬，公司公开交易的非关联方股权估值约为 $1.4
              billion。然而，2027 财年初超预期的运营表现引发强劲反弹，股价到 2026 年 7 月已反弹逾三倍至 $27.25，市值升至约 $6.9 billion。按目前估值水平，Navan 交易倍数约为其
              FY2027 预期营收指引（$866 million 至 $913 million）的 7.6x 至 7.9x，当前买入估值面对宏观减速或企业预算收紧几乎未留安全边际。
