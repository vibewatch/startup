companyProfile:
  summary: >-
    Navan 是一家上市企业级 SaaS 平台，为企业客户整合商旅预订、费用管理与企业卡工作流。公司 FY2026 收入增至 $702 million，全年自由现金流成功转正，活跃账户规模超过 10,000
    个且持续扩张。与此同时，公司面临 IPO 后的证券集体诉讼、持续的监管与隐私合规义务、持续存在的 GAAP 净亏损，并依赖差旅供应商、发卡伙伴、云基础设施及 AI 控制可靠性。
