  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户群体细分与买方动态
        blocks:
          - type: paragraph
            body: >-
              Navan 将客户拓展机会划分为受控与非受控商务差旅两大板块，服务对象涵盖高成长初创企业到跨国大型集团 [CU001, CU003]。在受控差旅领域，Navan
              主要依靠面向大型企业及中型市场的销售驱动增长（SLG）模式，切入预估达 $30 billion 的市场，锁定对集中化政策治理与费用透明度有明确诉求的首席财务官（CFO）、财务负责人、差旅经理及企业财务总监
              [CU001, CU004]。与此同时，Navan 借助面向中小企业（SMB）及中型团队的产品驱动增长（PLG）模式，切入体量达 $56 billion
              的非受控商务差旅市场；这类群体以往极少采用专业受控工具，Navan 为其提供轻量化在线注册、快速实体核验与自助式入驻服务 [CU001, CU003]。大型企业客户的销售周期通常为 2 至 9
              个月，企业客户经理在正式签署合同前，需要跨越采购、人力资源及核心财务管理层建立多方共识 [CU001, CU004]。客户实施交付依托双渠道架构扩展：企业级客户配备专门的解决方案顾问与客户成功经理；自助式 PLG
              层级则依托自动化产品指引与 AI 辅助入驻，待高频高支出账户沉淀后再转交专属客户管理团队对接 [CU001, CU003]。
