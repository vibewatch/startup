      - number: '1.2'
        title: 高管团队、治理架构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Navan 由联合创始人兼首席执行官 Ariel Cohen 与联合创始人 Ilan Twig 掌舵，后者奠定了公司早期的产品愿景与技术架构 [CO001, CO003]。2025 年 10
              月首次公开募股后，高管团队经历了显著重组。前任首席财务官在 FY2026 期间交接离职，产生 $6.7 million 遣散与过渡费用，随后公司于 2026 年 2 月 11 日任命 Aurélien Nolf
              为首席财务官 [CO001, CO006]。2026 年 4 月，战略财务高级副总裁兼首席会计官 Anne Giviskos 离职，公司治理与会计监督职责进一步合一，由 CFO Aurélien Nolf
              兼任首席会计官 [CO006]。Navan 董事会包含多位独立董事，例如董事 Anré Williams 于 2026 年 3 月 30 日以每股 $12.00 从公开市场自主增持 100,000 股（耗资
              $1.2 million），展现与公司利益的一致性 [CO006]。当前关键人物风险主要集中在 CEO Ariel Cohen 的战略领导上，而在诉讼未决期间，首席财务官与首席会计官职能的合并也是内控重点关注环节
              [CO006]。
            claimRefs:
