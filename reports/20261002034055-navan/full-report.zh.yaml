            body: >-
              Navan 借助在面向客户及后台工作流中部署专业人工智能能力，加速推进平台创新。在 FY2026，公司推出超个性化 AI 差旅助手 Navan Edge，提供情境化行程推荐与自动化客户自助服务，同时推出全新 AI
              报销智能体（AI Expense Agent），自主归类复杂的企业卡交易，消除人工报销制单。与此同时，Navan 拓展至特色差旅与会展活动领域（Specialty Travel and
