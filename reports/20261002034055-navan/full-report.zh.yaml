        - from: 'Valuation Rebound: Market cap rebounded 3x from March low to $6.9B'
          to: 'Recommendation: Track rating with target re-entry below $18.00'
    approximationNotes: 流程图将运营规模与财务表现关联至估值立场及投资建议。
