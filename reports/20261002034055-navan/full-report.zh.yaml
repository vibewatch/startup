              - CM005
      - number: '2.2'
        title: 市场规模测算：TAM 测算视角与细分拆解
        blocks:
          - type: paragraph
            body: >-
              Navan 的市场空间由多重视角交叉构成，跨越企业差旅总预订额、软件订阅预算与商业交易刷卡分成。根据 Navan 向美国证券交易委员会提交的 Form 424B4
              招股书，公司估计其目前所提供服务的全球总可用市场（TAM）约为 $185 billion。该市场由四大支柱构成：商旅管理在受控与非受控类别中共计约 $86 billion；基于 Euromonitor
              定制研究所评估的 $324 billion 可服务市场及 7% 用量变现率，商旅兼休闲（bleisure）贡献 $24 billion；按中小企业密度与平均收入基准测算，软件驱动的费用管理占 $39
              billion；基于估算为 $3.1 trillion 的商业借记与信用卡交易额的净刷卡分成，企业卡支付在全球占 $37 billion。来自 Euromonitor International
              的独立研究预计，到 2029 年全球商务差旅支出将接近 $2.9 trillion，目前约 65% 的支出仍未被传统 TMC 管理。Navan 当前体量——季度总预订额（GBV）超过 $3.0
              billion，年化客户运行规模逾 $12.5 billion——意味着在其可用市场中的渗透率不足 8%，在中型市场和大型企业客群中仍有广阔扩张空间。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
