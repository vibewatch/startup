  - calloutType: "risk"
    title: "Operational Complexity in Autonomous AI Agents and ERP Synchronization"
    body: "The deployment of autonomous AI agents (Navan Edge and AI Expense Agent) alongside custom ERP integrations (NetSuite, SAP, Oracle) introduces material diligence risks. Autonomous expense categorization requires uncompromising auditability to prevent accounting inaccuracies, while enterprise ERP pipelines face recurring schema drift and integration latency that can impede real-time financial reporting."
