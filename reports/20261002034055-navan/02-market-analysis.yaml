callouts:
  - calloutType: "insight"
    title: "Unmanaged Spend Represents Modern Travel Tech's Largest Expansion Vector"
    body: "Euromonitor research demonstrates that 65% of global business travel spend remains unmanaged by traditional travel management companies, while even managed corporate accounts experience 10% booking leakage outside mandated systems. Modern platforms like Navan capture this unmanaged volume by providing intuitive consumer-grade booking tools paired with real-time automated expense tracking, converting previously invisible rogue employee spend into compliant corporate volume."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM009"
  - calloutType: "risk"
    title: "Enterprise RFP Cycles and Entrenched Incumbent Switching Costs Delay Realization"
    body: "Although Navan's RFP volume tripled year-over-year in first-half fiscal 2027, large enterprise sales cycles require six to nine months to negotiate, followed by seven months of implementation and ramp-up. Entrenched relationships with SAP Concur and legacy global TMCs impose significant switching friction, requiring extensive integration proof points before enterprise procurement committees authorize complete vendor replacement."
    claimRefs:
      - "CM010"
      - "CM012"
      - "CM013"
