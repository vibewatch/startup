callouts:
  - calloutType: "insight"
    title: "Dual GTM Engine Drives Scaled Account Acquisition"
    body: "Navan's bifurcation between an enterprise sales-led motion ($30B TAM) and a frictionless product-led motion ($56B TAM) provides an efficient dual-funnel acquisition strategy. High-velocity PLG accounts build initial usage volume before graduating to dedicated account executives who layer high-margin expense and corporate card modules onto the baseline travel subscription [CU001, CU003]."
    claimRefs:
      - "CU001"
      - "CU003"
  - calloutType: "risk"
    title: "Aggregator Customer Service Bottlenecks Pose Retention Risks"
    body: "While corporate buyers value automated policy enforcement and travel savings, independent feedback from executive assistants and travel coordinators indicates operational friction with third-party lodging aggregators and tier-1 support responsiveness. When flight cancellations or complex hotel modifications occur, support handoffs create customer friction that could imperil long-term renewal durability [CU006]."
    claimRefs:
      - "CU006"
