evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: customer-segmentation
    missingEvidence: >-
      Audited breakdown of customer accounts and Net Retention Rate (NRR) segmented strictly between enterprise (>1,000
      employees) and SMB customers.
    whyItMatters: >-
      Enterprise contracts exhibit higher gross booking volumes and longer retention cycles, whereas SMB customers are
      more susceptible to macroeconomic travel budget volatility.
    diligencePath: >-
      Review subsequent Form 10-K disclosures, investor day presentations, or request customer cohort segmentation from
      investor relations.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: segment-nrr-disclosure
    missingEvidence: >-
      Granular breakdown of net revenue retention (NRR) and gross retention segmented specifically between
      small-and-medium businesses (SMB) and large global enterprise cohorts.
    whyItMatters: >-
      Without segmented retention data, it is difficult to isolate whether rapid revenue expansion is driven by durable
      upmarket enterprise expansion or masked by higher churn in lower-tier SMB customers.
    diligencePath: >-
      Review subsequent Form 10-Q disclosures or request customer cohort retention metrics during future investor
      management roadshows.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Customer acquisition cost (CAC), CAC payback period by customer segment (enterprise SLG versus SMB PLG), and gross
      margins broken down specifically by software subscription versus travel booking fees.
    whyItMatters: >-
      Without segmented CAC payback and unit contribution margins, underwriting cannot evaluate whether the 60%
      expansion in SLG signed GBV generates accretive long-term return on invested capital.
    diligencePath: >-
      Request management's internal cohort LTV/CAC schedules and cost of revenue allocation between support labor,
      server hosting, and merchant processing fees.
    relatedQuestionRefs:
      - QI008
  - type: conflicting-data
    severity: minor
    topic: historical-funding
    missingEvidence: >-
      Reconciliation between secondary market database tracking of $1.58B historical funding and company-reported
      lifetime pre-IPO equity and debt proceeds of ~$2.2B.
    whyItMatters: >-
      Clarifies lifetime capital intensity and aggregate historical cash consumption prior to achieving cash flow
      positivity.
    diligencePath: >-
      Inspect S-1 filing capitalization tables and debt issuance disclosures to trace exact historical primary equity
      injections versus structured warehouse credit lines.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: ai-accuracy-benchmarks
    missingEvidence: >-
      Quantitative production error rates, hallucination benchmarks, and human intervention frequencies for the Navan
      Edge travel assistant and AI Expense Agent.
    whyItMatters: >-
      Autonomous travel booking changes and expense approvals without disclosed audit benchmarks pose financial loss and
      corporate governance risks.
    diligencePath: >-
      Request customer SOC audit reports, AI governance policy documentation, and empirical
      false-positive/false-negative reconciliation metrics.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: erp-latency-metrics
    missingEvidence: >-
      Empirical transaction throughput, API failure rates, and batch reconciliation latency metrics for enterprise
      NetSuite, SAP, and Oracle ERP integrations.
    whyItMatters: >-
      General ledger reconciliation failures or delayed synchronizations disrupt month-end financial close cycles for
      enterprise finance teams.
    diligencePath: >-
      Review enterprise integration SLAs, customer engineering incident post-mortems, and ERP connector uptime
      telemetry.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-segmentation
    missingEvidence: >-
      Disaggregated active customer account counts, average contract values (ACV), and net dollar retention (NDR) broken
      down specifically between enterprise and SMB tiers.
    whyItMatters: >-
      Without distinct enterprise vs SMB cohort data, it is difficult to determine whether top-line customer durability
      is driven by stickier enterprise multi-year contracts or higher-churn SMB usage.
    diligencePath: >-
      Request confidential cohort analysis and segment-specific gross and net retention metrics during formal management
      diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-deployments
    missingEvidence: >-
      Comprehensive registry of enterprise customer production deployments, churn records, and renewal rates across
      historical cohorts beyond self-selected public case studies.
    whyItMatters: >-
      Public case studies (such as EMJ and Corvel) represent positive selection bias, whereas practitioner discussions
      suggest friction with third-party aggregators that may affect renewal rates.
    diligencePath: >-
      Audit full customer renewal rolls, logo churn by industry vertical, and aggregator-related support escalations
      during technical diligence.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      An exhaustive jurisdiction-by-jurisdiction register of licenses, inquiries, claims, proceedings, and material
      compliance exceptions.
    whyItMatters: The public sample cannot establish the complete population or aggregate downside of legal and regulatory exposure.
    diligencePath: >-
      Obtain the legal matter register, regulator correspondence log, license inventory, and auditor legal-confirmation
      letters.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: card-credit-and-fraud
    missingEvidence: >-
      Corporate-card delinquency vintages, gross fraud losses, recoveries, customer concentration, stress losses, and
      risk-limit breaches.
    whyItMatters: >-
      Navan bears card credit and settlement exposure, but public disclosures do not quantify loss frequency or tail
      severity.
    diligencePath: >-
      Review monthly receivable vintages, fraud dashboards, issuer-bank reporting, loss waterfalls, and underwriting
      overrides.
    relatedQuestionRefs:
      - QR003
      - QR006
  - type: private-evidence-only
    severity: material
    topic: ai-reliability
    missingEvidence: >-
      Production AI task-error rates, human-escalation rates, policy-bypass events, replay coverage, rollback frequency,
      and inference cost per completed workflow.
    whyItMatters: >-
      Architecture descriptions do not establish that guardrails control customer-facing errors or that autonomous
      workflows are economic.
    diligencePath: Request redacted production evaluations by task, incident postmortems, escalation logs, and model-cost cohorts.
    relatedQuestionRefs:
      - QR007
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Supplier, GDS, issuing-bank, card-network, cloud-provider, and payment-processor concentration shares plus
      termination and renewal terms.
    whyItMatters: >-
      The filing confirms dependencies but does not quantify how quickly lost inventory, settlement capacity, or
      infrastructure could be replaced.
    diligencePath: >-
      Inspect top-partner spend and revenue shares, contract renewal calendars, termination rights, failover tests, and
      substitution lead times.
    relatedQuestionRefs:
      - QR006
