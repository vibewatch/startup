    body: "Navan presents a stark bifurcation between operating fundamentals and disclosure overhang: core revenue continues to expand at 31-35% with positive free cash flow achieved ahead of target, yet stock price compression reflects governance friction, finance leadership turnover, and putative securities litigation [CO001, CO006]."
