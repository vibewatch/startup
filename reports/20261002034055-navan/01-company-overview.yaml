    body: "While non-GAAP operating margin expanded to 7% in Q2 FY2027, GAAP operating loss widened to $26 million due to $43 million in quarterly stock-based compensation, indicating ongoing equity dilution that tempers headline profitability metrics [CO004, CO005]."
    claimRefs:
