callouts:
  - calloutType: "risk"
    title: "Do not net GAAP loss against free cash flow"
    body: "Navan reported a $398 million fiscal 2026 GAAP net loss and $14.764 million of company-defined free cash flow. The cash metric improved liquidity, but it does not erase accounting losses or prove durable self-funding; both measures should be monitored on their own definitions and periods [CR002, CR003]."
    claimRefs:
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "Controls reduce exposure; their existence is not outcome evidence"
    body: "Navan describes mature cybersecurity governance and tool-level AI guardrails, while the same evidence set identifies limited third-party visibility, non-deterministic agent testing, and unresolved replay and cost management. Underwriting should require operating metrics for outages, fraud, human escalation, and policy bypass rather than infer effectiveness from control descriptions alone [CR011, CR012, CR013, CR014]."
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
