company:
  name: "Navan"
chapter:
  number: 7
  title: "Risks"
  summary: "Navan's highest-evidence risks are an unresolved post-IPO securities action, persistent GAAP losses despite positive fiscal 2026 free cash flow, and dependence on travel suppliers, issuing banks, card networks, and third-party infrastructure. Disclosed control remediation, cybersecurity governance, vendor review, and AI tool-call guardrails reduce but do not eliminate residual legal, financial, privacy, fraud, and execution exposure."
sections:
  - id: "legal-regulatory-and-governance"
    title: "Legal, Regulatory, and Governance Exposure"
    body: >-
      The immediate legal overhang is a putative securities class action filed on February 23, 2026 in
      the U.S. District Court for the Northern District of California. The complaint alleges materially
      false and misleading statements about sales and marketing expense in Navan's IPO documents;
      the filing records the allegation, Navan's intention to defend itself, and that a possible loss
      could not yet be estimated, not an adjudicated violation [CR004]. Regulatory exposure is broader
      than that case. Navan says its payments activities touch banking, money transmission, lending,
      anti-money-laundering, sanctions, and PCI-DSS regimes, while its processing of personal and
      financial information is subject to changing U.S. and international privacy rules [CR008, CR009].
      Governance mitigants remain incomplete: management says a prior financial-reporting material
      weakness was remediated by fiscal 2025, but the external auditor is not yet required to attest
      under the emerging-growth-company exemption [CR005, CR006]. Class B shares carry 30 votes
      each versus one for Class A, preserving concentrated founder influence over major transactions
      [CR007]. Monitor the court docket, licensing inquiries, privacy enforcement, the fiscal 2027
      control report, and any change in auditor conclusions or founder voting concentration.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR001"
  - id: "operational-security-and-ai"
    title: "Operational, Security, and AI Reliability"
    body: >-
      Navan's platform concentrates sensitive travel, payment, and expense data, and the company says
      its workflows can capture more than 110 data points per booking and more than 130 per expense
      transaction [CR015]. That breadth increases the consequence of access-control, privacy, fraud,
      or availability failures; it does not establish that an incident has occurred. The 10-K states
      that Navan bears the entire credit risk on its corporate card product, is liable to issuing banks
      for settlement, and has previously experienced service disruptions involving third-party
      infrastructure [CR010, CR011]. Disclosed mitigants include a CISO-led cross-functional program,
      audit-committee oversight, incident response, business continuity, encryption, penetration
      testing, and vendor-risk reviews [CR012]. AI introduces an additional control surface. An
      independent summary of comments by Navan architects describes non-deterministic agent testing
      and unresolved cost and replay/debugging problems, alongside pre- and post-tool guardrails and
      fine-grained authorization [CR013, CR014]. The residual thesis break is measurable: a material
      breach, sustained booking outage, rising unrecovered card losses, or AI actions that bypass
      customer policy should trigger re-underwriting rather than reliance on the existence of controls.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "financial-partner-and-execution"
    title: "Financial, Partner, and Execution Dependencies"
    body: >-
      Navan remains exposed to a mismatch between accounting losses and improving cash generation.
      Fiscal 2026 GAAP net loss was $398 million, while company-defined free cash flow was $14.764
      million; positive free cash flow is therefore a liquidity signal, not proof of GAAP profitability
      [CR002, CR003]. The filing also says operating cash flow may move between positive and negative
      through fiscal 2027 and that additional capital could be required for growth. Commercially,
      travel inventory and usage revenue depend on suppliers, GDS economics, direct agreements,
      commission rates, and access to competitive inventory [CR001]. The card product adds dependence
      on issuing banks and card networks, while cloud and other service providers sit in the critical
      delivery path [CR010, CR011]. Public hiring signals emphasize cross-functional delivery across
      product, engineering, design, and customer support, but they provide no staffing capacity,
      attrition, or project-performance denominators [CR016]. Monitor quarterly GAAP losses and cash
      flow together, supplier commission or inventory changes, bank or network contract restrictions,
      customer-support service levels, and retention through platform migrations. A simultaneous return
      to negative operating cash flow and deterioration in supplier or payment access would materially
      weaken the scale thesis.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR010"
      - "CR011"
      - "CR016"
    tableRefs:
      - "TR003"
