callouts:
  - calloutType: "insight"
    title: "Public Market Rebound Versus Underlying GAAP Profitability"
    body: "Navan's swift stock recovery from $8.50 in March 2026 to $27.25 in July 2026 illustrates Wall Street's enthusiasm for AI-driven enterprise travel automation and top-line reacceleration. However, institutional investors must distinguish between non-GAAP operating margin improvements and GAAP accounting deficits. With a full-year FY2026 GAAP net loss of $398 million, Navan's equity valuation at ~7.8x forward sales leaves little cushion against multiple compression if corporate IT and travel budgets contract."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV014"
  - calloutType: "risk"
    title: "Aggregator Integration and Customer Service Friction"
    body: "Enterprise feedback highlights operational risks stemming from Navan's travel supply integrations. While Navan provides unified booking interfaces, bookings routed through third-party travel aggregators frequently lead to dispute handling runarounds, inaccurate invoicing, and unempowered tier-1 chat support. Left unmitigated, service friction risks eroding net revenue retention and impairing large-enterprise customer acquisitions."
    claimRefs:
      - "CV008"
