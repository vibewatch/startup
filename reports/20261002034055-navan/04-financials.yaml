chapter:
  number: 4
  title: "Financials"
  summary: "Navan generated $702 million in revenue in FY2026 (+31% YoY) and achieved its first full year of positive free cash flow ($15 million), accelerating further in Q2 FY2027 with $233 million in revenue (+35% YoY) on $3.0 billion in gross booking volume. The company operates a hybrid monetization model dominated by usage-based travel transaction fees (~90% of revenue) alongside expense software subscriptions (~10%), while persistent GAAP net losses driven by stock-based compensation and legacy brand amortization remain key diligence hurdles."
sections:
  - id: "revenue-streams-and-mix"
    title: "Revenue Model, Pricing Mechanics, and Stream Distribution"
    body: "Navan operates a multi-stream monetization engine that bridges enterprise travel management, software subscriptions, and corporate payments. For the fiscal year ended January 31, 2026, the company recorded total revenue of $702 million, reflecting a 31% year-over-year increase from fiscal 2025. Monetization is heavily weighted toward usage-based mechanisms: transaction-based travel booking fees, supplier commissions, and interchange yields accounted for approximately 90% of total revenue in FY2026 ($640 million), while recurring software subscriptions from its expense management platform represented roughly 10% ($62 million). In the second quarter of fiscal 2027 (ended July 31, 2026), total revenue expanded 35% year-over-year to $233 million, comprising $211 million in usage-based revenue (+35% YoY) and $21 million in subscription revenue (+39% YoY). The platform's overall usage yield has held steady at roughly 7% of gross booking volume across FY2024 through FY2026, although enterprise mix shifts introduce minor yield compression as larger accounts negotiate lower booking fee schedules."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI008"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "gtm-efficiency-and-unit-economics"
    title: "Go-To-Market Efficiency, Net Retention Dynamics, and Channel Economics"
    body: "Navan couples a high-velocity sales-led growth (SLG) channel with product-led expansion (PLG), driving significant visibility through forward-contracted volume. Over the trailing twelve months leading into Q2 FY2027, newly signed GBV in the SLG segment reached a record $4.0 billion, expanding 60% year-over-year. Net revenue retention (NRR) for fiscal 2026 landed at 107% overall, masking a distinct divergence between platform segments: the core AI-native Navan platform sustained a 110% NRR (exceeding 120% when accounting for new customer cohort ramping), whereas the legacy Reed & Mackay high-touch travel agency business exhibited lower growth and retention, exerting a temporary drag on consolidated metrics. The retirement of the Reed & Mackay standalone brand for new sales and migration of those accounts onto the core infrastructure aims to harmonize unit economics, improve gross margin capture, and open upselling pathways for meetings, events, and corporate payments across more than 10,000 customers."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI002"
  - id: "cost-structure-capital-adequacy"
    title: "Cost Structure, Operating Leverage, and Capital Adequacy"
    body: "Navan's margin profile has demonstrated structural operating leverage alongside its transition to a public company. GAAP gross margin reached 74% in Q2 FY2027 ($172 million gross profit on $233 million revenue), compared to 73% in Q2 FY2026, while non-GAAP gross margin stood at 75%. FY2026 marked the company's first full year of positive operating cash flow ($34 million) and positive free cash flow ($15 million), reaching cash flow self-sufficiency one full year ahead of management's original target. Non-GAAP operating income reached $17 million (7% non-GAAP operating margin) in Q2 FY2027, and full-year FY2027 non-GAAP operating income guidance was raised to $82M–$86M (9% margin at midpoint) on guided revenue of $927M–$933M. However, GAAP profitability remains absent: GAAP net loss was $(29) million in Q2 FY2027 and $(398) million for FY2026, driven by stock-based compensation ($42 million in Q2 FY2027; $79 million in H1 FY2027) and brand amortization charges. With $653 million in cash and cash equivalents, $167 million in short-term investments ($820 million in total liquid cash/investments), and minimal current debt outside credit facilities supporting the payments business, Navan possesses strong balance sheet runway and negligible near-term financing dependency."
    claimRefs:
