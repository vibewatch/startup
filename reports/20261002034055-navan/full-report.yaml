  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Third-party cloud or critical-service disruption
        - 'Medium: the filing reports past service disruptions but no frequency'
        - High
        - 'Established: multi-location recovery plans, continuity processes, and vendor review are disclosed'
        - Booking, payment, or support interruption outside Navan's direct control
        - Provider concentration, tested RTO/RPO, regional failover results, and customer SLA performance are not public
      - - Corporate-card credit loss or sophisticated fraud
        - 'Medium: exposure is inherent and historical fraud schemes are disclosed, but loss frequency is not'
        - High
        - 'Developing: proprietary risk assessment and transaction controls are described'
        - Navan bears credit risk and issuing-bank settlement liability for its own card product
        - Gross fraud losses, recoveries, delinquency vintages, and stress-loss limits are not separately disclosed
      - - Privacy or cybersecurity compromise
        - 'Medium: large sensitive-data surface and third-party processing increase exposure; no incident rate is given'
        - Critical
        - >-
          Established: CISO-led governance, audit-committee oversight, response plans, encryption, testing, and cyber
          insurance
        - Regulatory action, litigation, operational interruption, and customer loss remain possible
        - Material-incident history, control exceptions, penetration-test findings, and insurance limits are private
      - - Non-deterministic AI-agent action or evaluation failure
        - 'Unknown: no production error denominator is public'
        - High
        - 'Emerging: trajectory evaluation and pre/post-tool authorization guardrails are reported'
        - Incorrect booking, policy, or support action plus unpredictable model cost and difficult replay
        - Task-level error, escalation, rollback, cost, and policy-bypass rates are not disclosed
    notes: >-
      The 10-K supplies disclosed consequences and controls; the AI row also uses an independent technical summary of
      statements by Navan architects. Qualitative rankings are analyst judgments and do not imply measured incident
      probabilities.
