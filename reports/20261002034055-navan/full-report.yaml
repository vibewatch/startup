      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Monetization Asymmetry: Usage-Heavy Yield Masks Software Valuation Multiples'
            body: >-
              While Navan markets itself as an AI-powered corporate SaaS platform, approximately 90% of revenue
              originates from transaction-based travel booking fees, supplier commissions, and interchange. This creates
              sensitivity to corporate travel cycle fluctuations compared to pure recurring seat-based software, but
              allows Navan to capture upside from swelling enterprise travel budgets and payment volume.
            calloutType: insight
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: callout
            title: GAAP Net Profitability Gap and Post-IPO Dilution Overhang
            body: >-
              Despite turning non-GAAP operating profitable ($17 million in Q2 FY2027) and generating positive free cash
              flow ($21.5 million in Q2 FY2027), Navan continues to log substantial GAAP net losses ($29.1 million in Q2
              FY2027; $398 million in FY2026). Diligence must focus on stock-based compensation expenses ($41.9 million
              in Q2 FY2027 alone) and long-term equity dilution before underwriting GAAP earnings stability.
            calloutType: risk
            claimRefs:
              - CI001
              - CI007
              - CI013
              - CI014
