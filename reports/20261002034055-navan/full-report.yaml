chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Evolution, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Navan, Inc. (NASDAQ: NAVN) operates an integrated cloud platform unifying business travel booking,
              corporate expense management, meeting logistics, and corporate payment cards [CO001]. Originally
              incorporated in 2015 as TripActions by co-founders Ariel Cohen (Chief Executive Officer) and Ilan Twig,
              the company completed a corporate rebranding to Navan in February 2023 to reflect its expansion beyond
              corporate travel reservations into corporate cards, automated policy enforcement, and financial workflows
              [CO001, CO002]. Navan maintains its corporate headquarters in Palo Alto, California, and trades publicly
              on the Nasdaq Global Select Market following its October 2025 initial public offering [CO001, CO002]. The
              company monetizes through a hybrid revenue model heavily weighted toward volume transactions: usage-based
              platform fees, supplier travel booking commissions, and corporate card interchange revenue comprise
              approximately 91% of total revenue, while software subscription access fees generate the remaining 9%
              [CO001, CO004]. Total full-year fiscal 2026 revenue expanded 31% year-over-year to $702 million, led by
              $640 million in usage fees and $62 million in subscription billings [CO001]. In recent quarters through Q2
              FY2027, top-line quarterly revenue reached $233 million with Gross Booking Volume rising to $3.0 billion,
              demonstrating sustained commercial adoption across mid-market and multinational enterprise clients [CO004,
              CO005].
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Navan is led by co-founder and Chief Executive Officer Ariel Cohen, alongside co-founder Ilan Twig, who
              established the company's early product vision and technological architecture [CO001, CO003]. Executive
              leadership underwent notable reorganization following the October 2025 initial public offering. Former
              Chief Financial Officer leadership transitioned during fiscal 2026 with $6.7 million in severance and
              transition charges, culminating in the appointment of Aurélien Nolf as Chief Financial Officer on February
              11, 2026 [CO001, CO006]. Governance and accounting oversight saw further consolidation in April 2026 when
              Senior Vice President of Strategic Finance and Chief Accounting Officer Anne Giviskos departed, leading to
              CFO Aurélien Nolf assuming the concurrent role of Principal Accounting Officer [CO006]. Navan's board of
              directors includes independent members such as Director Anré Williams, who demonstrated alignment through
              an open-market discretionary purchase of 100,000 shares ($1.2 million) at $12.00 per share on March 30,
              2026 [CO006]. Key-person dependence remains concentrated in CEO Ariel Cohen's strategic leadership, while
              the consolidation of chief financial officer and principal accounting officer functions represents a
              heightened internal control area during an ongoing litigation period [CO006].
            claimRefs:
              - CO001
              - CO003
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO006
      - number: '1.3'
        title: Capitalization, Legal Disclosures, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Prior to its public listing, Navan raised approximately $2.3 billion in cumulative venture equity and debt
              financing from institutional backers including Lightspeed Venture Partners, Andreessen Horowitz, Greenoaks
              Capital, and Coatue Management [CO002, CO006]. In October 2025, Navan priced its Nasdaq IPO at $25.00 per
              share, generating $713 million in net primary proceeds and establishing a cash and short-term investment
              reserve of $740 million against $125 million in long-term debt [CO006]. Operational execution validated
              management's self-funding timeline in FY2026 as free cash flow inflected from negative $66.7 million in
              FY2025 to positive $14.8 million in FY2026, reaching cash-flow positivity a full year ahead of plan
              [CO001, CO006]. However, public market valuation compressed to approximately $12.00 per share by April
              2026 (translating to a market capitalization of $3.6 billion) following disclosure friction [CO002,
              CO006]. On February 23, 2026, a putative securities class action was filed in the U.S. District Court for
              the Northern District of California alleging violations of Sections 11 and 12 of the Securities Act,
              focusing on undisclosed sales and marketing expense trajectories and the retirement of the acquired Reed &
              Mackay brand [CO006]. Concurrently, non-GAAP operating margin expanded from negative 5% in FY2025 to
              positive 5% in FY2026, although heavy stock-based compensation of $43 million in Q2 FY2027 continued to
              widen GAAP operating losses to $26 million, highlighting ongoing divergence between non-GAAP profitability
              and GAAP net income [CO001, CO004, CO005].
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
