companyProfile:
  summary: >-
    Navan is a public enterprise SaaS platform that unifies corporate travel booking, expense management, and corporate
    card workflows for business customers. The company grew FY2026 revenue to $702 million, reached positive full-year
    free cash flow, and continues to scale across a base of more than 10,000 active accounts. Its operating story is
    balanced by a post-IPO securities class action, ongoing regulatory and privacy obligations, persistent GAAP losses,
    and dependence on travel suppliers, card partners, cloud infrastructure, and AI control reliability.
