- id: workflow-quality-and-dependencies
  title: Workflow, Quality Signals, and Critical Dependencies
  body: 'Abogen’s product workflow can be reconstructed from public evidence even if many engineering details remain undisclosed. A target or antigen concept is designed computationally, encoded into RNA, chemically modified, packaged in proprietary lipids, formulated into liquid or lyophilized presentation, produced under GMP, and then advanced through preclinical and clinical development. Publications and patents reinforce that the company is not only talking about the workflow but also filing and publishing around it. Yet the public quality layer is thinner than the scientific layer. There is no software-style status page, no public batch-yield dashboard, and no release-management log. Quality is inferred mainly from trial execution, publications, and cGMP claims. That leaves real dependencies: proprietary lipid performance, scale-up yield, regulatory CMC scrutiny, and the ability to translate bench innovations like circRNA or modified nucleosides into reliable manufacturing practice.'
  claimRefs:
  - CE018
  - CE019
  - CE020
  - CE021
  - CE029
  - CE030
  - CE031
  - CE032
  - CE035
