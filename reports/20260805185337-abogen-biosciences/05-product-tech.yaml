- id: roadmap-and-differentiation
  title: Differentiation, Roadmap, and What Still Needs Proving
  body: The strongest case for differentiation is the combination of clinically validated LNP execution, lyophilized formulation ambition, late-stage infectious-disease progress, and an oncology pipeline that is already inside U.S. and China regulatory channels. Independent technical documents strengthen this story by validating parts of the platform from outside the company’s own voice, especially the ABO1020 phase 3 paper and the circRNA publication trail. But public evidence still does not prove everything investors would want to know. Manufacturing throughput, cost, yield, service reliability, and broad commercial economics remain private. The right conclusion is that Abogen looks technically serious and unusually well-articulated, but some of its most important product-technology claims will remain provisional until manufacturing and commercialization evidence becomes more visible. In diligence terms, that means the science looks ahead of the operating disclosure, not that the science
    is weak today.
  claimRefs:
  - CE033
  - CE034
  - CE036
  - CE037
  tableRefs:
  - TE005
  figureRefs:
  - FE004
