- id: buyer-segments
  title: Buyer Segments, Adopter Types, and Geographic Reach
  body: 'The buyer map is more varied than the named-customer list suggests. Adult-vaccine programs point toward government or distributor-mediated procurement. Oncology programs point toward hospitals, investigators, and clinical sites first, then eventual pharma and payer stakeholders later. Platform and manufacturing capabilities point toward pharma or biotech partners that may act as customers even before a product launch. The Ruijin collaboration fits the institutional-research segment. AWcorna fits the public-health procurement segment. TB, RSV, and shingles programs expand the plausible set of public-health or specialty-vaccine buyers. Geographic reach is also emerging in layered form rather than direct country sales: Indonesia is the most concrete external market signal, Malaysia-linked TB collaboration broadens international relevance, and clinical registrations show the company can participate in formal development settings beyond a single lab environment. The important nuance
    is that buyer diversity is plausible from the pipeline, but directly observed buyer diversity is still limited.'
  claimRefs:
