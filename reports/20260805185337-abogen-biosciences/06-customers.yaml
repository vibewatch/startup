  figureRefs:
  - FU003
  - FU004
- id: customer-verdict
  title: Concentration, Missing Metrics, and Customer Verdict
  body: 'The customer verdict is therefore mixed but usable. On the positive side, Abogen has enough public proof to show it is not customerless: a named medical-institution collaboration exists, a partner-linked international vaccine authorization exists, and multiple pipeline shapes align with plausible buyer segments. On the negative side, public evidence remains far too thin to prove customer scale or quality. There is no disclosed customer count, no revenue-by-customer view, no reorder data, no contract value, and no retention evidence. That makes customer concentration appear high by default because the visible proof set is so small. The correct investment reading is that Abogen has demonstrated credible external adoption routes, but customer diligence still depends on private operational evidence before one can score traction quality with confidence. In other words, customer diligence remains one of the clearest areas where management data can change the investment view quickly.'
