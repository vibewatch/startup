  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接、区域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Abogen 同时在几条战线上竞争。最明显的全球可比公司是 Moderna 和 BioNTech，它们仍在规模上定义 mRNA 类别。第二组包括 CureVac、Arcturus、Sanofi 相关 mRNA
              项目，以及其他在给药路径、递送或平台专精上竞争的挑战者。第三层是区域竞争：Walvax、Immorna、Stemirna 和其他中国公司塑造 Abogen 的近场运营环境。最后一层是现状替代。在带状疱疹和 RSV
              中，买方仍可选择已获批的非 mRNA 疫苗，或等待成熟替代品。在肿瘤中，mRNA 疫苗和 RNA
              编码构建体不仅彼此竞争，也与小分子、检查点组合和其他实验性疗法竞争。因此，正确竞争集合包括公司、替代疗法和伙伴主导的市场进入路径。这也意味着，任何单张对比表都无法不过度简化 Abogen
              到底在哪里赢、在哪里输，同时捕捉完整决策框架。
