              创始人集中度高。Bo Ying 仍任创始人、董事长兼 CEO，外部记录仍把公司层面的可信度大多连到他身上。Xi’an Jiaotong-Liverpool University
              的履历页比普通公司简介更有信息量，确认了他在 Fudan 和 Northeastern 的学术背景；Abogen 自己的领导层页面则显示出一支精简但功能齐备的运营班底：CMO Wenjie Song、CTO
              Peng Gao、CFO Ziyi Song、首席 AI 官 Iain
              McFadyen。这个配置足以覆盖临床、技术、财务和计算能力，但不足以消除关键人风险。公开来源没有给出当前董事会名单、委员会结构或股东控制概览。2026 年 5 月 Weimin Li
              出任临床前研究总裁很重要，说明组织仍在补强；同时也说明执行带宽仍系于相对小的高管团队。
