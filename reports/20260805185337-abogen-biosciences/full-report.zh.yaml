      - number: '6.4'
        title: 集中度、缺失指标与客户结论
        blocks:
          - type: paragraph
            body: >-
              因此，客户结论是混合但可用。正面看，Abogen
              的公开证明足以显示它不是没有客户：存在具名医疗机构合作，存在伙伴关联的国际疫苗授权，多种管线形态也匹配合理买方板块。负面看，公开证据仍远远不足以证明客户规模或质量。没有披露客户数、按客户拆分收入、复购数据、合同价值或留存证据。由于可见证明集合很小，客户集中度默认显得偏高。正确投资解读是，Abogen
              已证明可信的外部采用路线，但在能有信心给牵引质量打分前，客户尽调仍依赖私有运营证据。换句话说，客户尽调仍是管理层数据最能快速改变投资判断的领域之一。
