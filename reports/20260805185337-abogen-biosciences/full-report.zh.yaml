      - number: '3.2'
        title: 全球龙头与中国同行
        blocks:
          - type: paragraph
            body: >-
              全球龙头在规模、批准和分销上明显超过 Abogen。Moderna 和 BioNTech 拥有更广商业基础设施和上市产品提供的深得多的验证，Walvax 则展示了国内分销广度和有意义出口触达。但 Abogen
              不只是另一个泛化挑战者。它已经通过 ABO1108 III 期拿到后期证据，通过 ABO1020 获得 COVID 时代 III 期论文支持，也通过 ABO2102 和 ABO2203
              展示清晰肿瘤推进。在中国同行中，传染病广度、治疗性肿瘤野心和一体化技术主张的组合相对强。可是证据也显示，单有平台广度并不独特。Walvax、Immorna 等也公开宣传广泛 R&D 能力，所以 Abogen
              需要靠执行赢，而不是靠词汇赢。关键分水岭在于这些能力能否转化为后期资产、可重复合作，最终转为营销材料之外可见的产品经济性。这正是 Walvax 同时是标杆也是警示的原因：有规模但缺乏独特 mRNA
              差异化，会给新进入者留下空间；有技术但没有渠道，也可能严重卡住。
