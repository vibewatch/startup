              买方地图比具名客户列表更丰富。成人疫苗项目指向政府或分销商介导采购。肿瘤项目先指向医院、研究者和临床点位，之后才是未来药企和支付方
              利益相关方。平台和制造能力指向药企或生物科技伙伴，它们可能在产品上市前就成为客户。Ruijin 合作对应机构研究板块。AWcorna 对应公共卫生采购板块。TB、RSV
              和带状疱疹项目扩大了潜在公共卫生或专科疫苗买方集合。地理触达也在以分层形式出现，而不是直接国家销售：印尼是最具体的外部市场信号，马来西亚相关 TB
              合作扩大国际相关性，临床注册显示公司能在单一实验室环境之外参与正式开发场景。关键细节是，买方多样性可从管线中推断，但直接观察到的买方多样性仍有限。
