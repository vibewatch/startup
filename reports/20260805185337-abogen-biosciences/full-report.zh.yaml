      - number: '2.4'
        title: 增长驱动、约束与仍需证明的事项
        blocks:
          - type: paragraph
            body: >-
              Abogen 的需求驱动足够清楚：传染病负担持续存在；Abogen IND 时中国对更新 RSV 产品有明确未满足需求；带状疱疹存在成熟成人疫苗需求；肿瘤领域对共享抗原和个性化 mRNA
              策略的兴趣持续。采用约束同样重要。Research and Markets 明确强调冷链和监管复杂度，Walvax 的制造产能披露也显示放大生产和合规灌装成品基础设施有多烧钱。Abogen
              自己的答案是冻干和模块化平台能力；如果临床数据站得住，这应能降低物流摩擦。即便如此，没有买方预算证据，市场论证仍不完整，肿瘤尤其如此。证据集中没有公开的 Abogen 专属 SOM 模型。诚实结论是：行业 TAM
              支撑投资人继续关注，但 Abogen 专属份额捕获仍是尽调问题，不是既成事实。
