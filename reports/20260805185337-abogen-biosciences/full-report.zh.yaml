  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Abogen 不适合塞进一个狭窄类别。公开材料描述的是一家公司横跨传染病疫苗、治疗性肿瘤学和赋能平台服务。尽调时，正确市场边界应分层。最宽一层是全球 mRNA
              疗法。更窄、也更利于决策的一层，是传染病疫苗加治疗性肿瘤疫苗和 mRNA 免疫疗法。最窄一层是 Abogen 自身：公司已有临床阶段资产、平台合作野心，或制造 / 制剂差异化的项目。通用平台 TAM
              数字有参考价值，但必须先剔除无关支出，例如非 mRNA 生物药、消费者健康或无关基因组工具。因此，正确边界不是一句「mRNA
              很大」。它是一组相邻但彼此不同的产品市场和伙伴市场，共享技术、监管和制造约束。这样的边界也能避免宽泛市场数字悄悄把伙伴收入和产品收入当成同一回事而重复计算。
