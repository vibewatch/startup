      - number: '4.2'
        title: 融资历史、资本用途与历史支撑
        blocks:
          - type: paragraph
            body: >-
              Abogen 的历史融资记录以 2019 年成立的公司标准看异常强。官方公告覆盖 RMB 150M A 轮、RMB 600M B 轮、超过 $700M C 轮，以及 2021 年 $300M C+
              轮。公告也解释了融资原因：平台搭建、GMP 产能、更广管线、国际化和商业化。第三方汇总把图景延伸到约 $1.13B 的累计融资数字，尽管低置信数据库对准确总额和估值存在分歧。关键推断不是外部每个数字都精确，而是
              Abogen 明显筹到了足够资本，能尝试多资产平台策略。仍未知的是，这些资本以多高效率转化为当前经济位置，因为当前现金和
              烧钱速度仍属私有。历史融资证明能接触投资人，但不能单独证明当前偿付能力或健康经营杠杆。实际中，投资人仍需要管理层账目，才能知道历史资本是被保留、消耗，还是重新部署到最新项目中。
