    title: 技术风险矩阵
    type: matrix
    layout: standard
    summary: 风险仍分散在 CMC、规模化、IP 和多资产复杂度上，并不集中在单一科学问题。
    data:
      columns:
        - 当前水平
        - 原因
      rows:
        - label: CMC / 规模化
          values:
            - 高
            - 多步骤工艺负担
        - label: IP / FTO
          values:
            - 中高
            - 专利版图密集
        - label: 管线复杂度
          values:
            - 高
            - 多条工作流并行
        - label: 纯科学可信度
          values:
            - 中等
            - 近期里程碑有所加分
    claimRefs:
      - CR008
      - CR009
      - CR012
      - CR014
      - CR018
      - CR031
  - id: FR003
    title: 组织与市场风险联动图
    type: flow
    layout: standard
    summary: 领导层集中度、同业竞争和披露不透明彼此作用，并不是孤立风险。
    data:
      nodes:
        - id: l
          label: 领导层可见度
          detail: 对外足迹以 Bo Ying 为中心
        - id: b
          label: 梯队深度不透明
          detail: 公开组织细节有限
        - id: k
          label: 竞争压力
          detail: 中国和全球同行
        - id: d
          label: 披露边界
          detail: 私有指标未公开
        - id: x
          label: 执行压力
          detail: 更难吸收挫折
      edges:
        - from: l
          to: x
          label: 推高关键人敏感度
        - from: b
          to: x
          label: 推高执行风险
        - from: k
          to: x
          label: 推高时间线压力
        - from: d
          to: x
          label: 掩盖韧性
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR021
      - CR022
      - CR023
      - CR024
      - CR032
  - id: FR004
    title: 风险缓释区间
    type: range
    layout: standard
    summary: 部分风险已被里程碑缓释，但最不透明的运营风险，公开层面仍最难压低。
    data:
      items:
        - label: 平台可信度风险
          low: 2
          base: 3
          high: 4
          unit: residual score /10
        - label: 合作伙伴集中风险
          low: 6
          base: 8
          high: 9
          unit: residual score /10
        - label: CMC / 执行风险
          low: 6
          base: 8
          high: 9
          unit: residual score /10
    approximationNotes: 该区间只表示方向，用来比较相对剩余风险，不是数值化风险模型。
    claimRefs:
      - CR025
      - CR026
      - CR027
      - CR033
      - CR034
      - CR035
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 当前判断来自一个冲突：平台验证很强，但公开投资判断可见度很弱。
    data:
      nodes:
        - id: p
          label: 平台验证
          detail: III 期、双 IND、FIH 肿瘤
        - id: c
          label: 商业验证
          detail: 真实但仍稀疏
        - id: o
          label: 不透明
          detail: 现金、烧钱速度、条款、收入均未披露
        - id: r
          label: 风险
          detail: 合作伙伴与执行负担仍高
        - id: x
          label: 建议
          detail: 基于公开证据，跟踪而非投资
      edges:
        - from: p
          to: x
          label: 支持继续尽调
        - from: c
          to: x
          label: 支持保留选择权
        - from: o
          to: x
          label: 阻碍形成确信
        - from: r
          to: x
          label: 需要价格纪律
    claimRefs:
      - CV001
      - CV003
      - CV018
      - CV020
      - CV025
      - CV030
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 判断最敏感的不是 TAM 叙事本身，而是融资清晰度、合作伙伴耐久性和里程碑转化。
    data:
      items:
        - label: 当前融资条款可见度
          value: 9
          description: 确信感最大的缺口。
        - label: 合作伙伴耐久性
          value: 8
          description: 商业路径韧性很关键。
        - label: 临床里程碑转化
          value: 8
          description: 项目必须持续降风险。
        - label: 客户变现验证
          value: 7
          description: 支撑溢价所必需。
        - label: 表观市场规模
          value: 4
          description: 重要，但单独不够。
    approximationNotes: 敏感性评分是比较性分析判断，不是正式财务模型的输出。
    claimRefs:
      - CV010
      - CV011
      - CV020
      - CV026
      - CV027
      - CV028
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据只能支撑一个很宽的区间，基准情景低于高溢价独角兽式乐观预期。
    data:
      items:
        - id: bear
          label: 悲观情景
          low: 0.7
          value: 1
          high: 1.5
          unit: $B equity value
        - id: base
          label: 基准情景
          low: 1.8
          value: 2.3
          high: 3
          unit: $B equity value
        - id: bull
          label: 乐观情景
          low: 3.5
          value: 4.2
          high: 5
          unit: $B equity value
    approximationNotes: 这些区间是基于里程碑质量、披露薄弱和同行成熟度框架给出的判断带，不是 DCF。
    claimRefs:
      - CV006
      - CV011
      - CV012
      - CV013
      - CV026
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 基于当前最佳公开证据，对 Abogen 给出的 IC 式快照。
    data:
      items:
        - label: 建议
          value: Track
          note: 保持跟踪，不要付过高价格。
        - label: 确信度
          value: Medium
          note: 方向清楚，经济性不完整。
        - label: 风险评级
          value: High
          note: 执行与不透明仍是实质问题。
        - label: 估值立场
          value: Stretched
          note: 溢价情景跑在公开证据前面。
        - label: 最佳可比视角
          value: Hybrid maturity anchors
          note: Walvax 加全球 mRNA 平台。
        - label: 公开分母数据质量
          value: Weak
          note: 收入 / 现金 / 条款未公开。
        - label: 期权价值
          value: Real
          note: 技术上行仍有意义。
    approximationNotes: 这些 KPI 标签是从保留证据集综合出的投资判断，不是公司披露的指标。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV014
      - CV015
      - CV030
      - CV033
      - CV038
