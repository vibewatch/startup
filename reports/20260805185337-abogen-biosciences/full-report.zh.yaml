      - number: '7.4'
        title: 已缓解事项、未缓解事项与风险结论
        blocks:
          - type: paragraph
            body: >-
              近期证据最能缓解的，是 Abogen
              只是一个没有技术兑现的投机故事这一担忧。这项风险显然已经下降。缓解最少的风险是伙伴集中、制造准备度，以及围绕当前运营健康的私营公司披露缺口。这些正是新闻稿看起来积极、底层执行却仍可能断裂的领域。因此，公开记录支撑一个平衡但谨慎的结论：Abogen
              是可信的前沿生物科技平台，但仍暴露在前沿生物科技的经典失败模式下——合同、试验、CMC
              和资本纪律。严肃投资人需要对这些主题做私有尽调，才可以把近期里程碑节奏视为足以支持高置信判断。正确框架不是否定平台，而是识别少数可监控指标；一旦这些指标早期且实质恶化，投资假设会快速破裂。速度很重要。
