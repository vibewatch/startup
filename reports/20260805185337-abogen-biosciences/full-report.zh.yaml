      - number: '8.2'
        title: 融资背景、上一轮估值与仍缺失的事项
        blocks:
          - type: paragraph
            body: >-
              融资历史令人印象深刻。官方公告显示 Abogen 成立后很快完成大额轮次，并吸引一线投资人。这很重要，因为它证明了资本可得性和外部对平台的信任。但这不能解决当前估值争论。2021
              年独角兽估值是在不同融资气候下形成的，也早于今天对商业化耐久度和运营健康提出更硬证据要求的阶段。公开来源也没有披露当前投资条款清单、股权结构表
              保护、内部人权利、现金位置或烧钱速度。没有这些要素，投资人无法判断一家看似有吸引力的公司是否真的给出了有吸引力的进入点。这就是估值立场保持谨慎的原因：公司可能强于公开资料所能支撑的投资论证，但这不意味着当前价格站得住。在私营生物科技中，进入纪律往往与资产质量同样重要。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV024
              - CV029
              - CV035
