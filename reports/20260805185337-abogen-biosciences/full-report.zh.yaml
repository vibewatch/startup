chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Abogen Biosciences 更像一家中国起家的临床阶段 mRNA 平台公司，而不是单一产品的疫苗项目。官网首页、关于页面和领导层页面都把公司叙事放在端到端 mRNA 药物上：靶点选择、RNA
              设计、脂质递送、GMP 生产和临床交付都在同一套运营叙事里。这个判断很关键，因为后文要判断的是 Abogen 只是授权了一个 COVID
              时代资产，还是确实掌握了一套可复用的发现与制造栈。公开记录支撑平台叙事，也支撑公司总部在江苏苏州、成立于 2019 年 1
              月。但公开资料没有披露当前收入、ARR、客户数或清晰员工数。这些缺口对私营生物科技公司很正常，却意味着所有成熟度判断都必须锚定产品、融资和监管里程碑，而不是利润表可见度，并且要严守下行情景。
