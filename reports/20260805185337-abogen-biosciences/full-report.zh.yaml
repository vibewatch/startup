  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义：RNA 设计、递送与制剂
        blocks:
          - type: paragraph
            body: >-
              Abogen 的技术叙事在私营生物科技公司里异常明确。平台页面描述了一套工作流：从 AI 辅助序列设计开始，经过核苷修饰和自动化 RNA 合成，再进入专有 LNP 递送、制剂、GMP
              制造和临床交付。这很重要，因为许多 RNA 公司公开只描述技术栈的一层；Abogen 则声称掌握所有层。这个层级上的证据仍由公司自己撰写，但在技术和合作伙伴页面之间内在一致。最大的实际差异化不只是 Abogen
              会制造
              mRNA，而是它声称递送路径灵活且有多种制剂模式，包括冻干。如果在商业规模上成立，那就是一个有意义的平台，而不是单资产能力。隐藏问题是，当多个资产同时推进、制造标准超过早期临床批量后趋严，公司能否保持同样的一体化质量。这个放大问题如今已是最重要的技术尽调主题之一。
