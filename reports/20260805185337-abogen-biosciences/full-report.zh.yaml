      - number: '7.2'
        title: 制造、CMC 与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              Abogen 的第二大风险块位于研究和商业化之间的技术运营中层。mRNA 项目对工艺控制、放大、制剂和放行质量容错很低。Walvax 和同类平台材料凸显出，一个看似简单的管线标题背后有多少基础设施。这很关键，因为
              Abogen 正试图同时推进多种模态和多个临床阶段。IP 方面，公司围绕稳定结构 mRNA 和 circRNA
              工作建立了专利和论文，但这应被解读为活动，而不是免疫。稠密专利格局后续仍可能带来谈判、授权或诉讼压力。实际含义是，制造准备度和 FTO
              尽调应获得几乎与头条疗效里程碑同等的关注。在许多生物科技失败中，这些中层环节会在科学首次看起来有前景很久之后成为瓶颈。
