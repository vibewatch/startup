      - number: '2.3'
        title: 买方 / 用户 / 支付方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              Abogen 的买方地图随适应症变化。AWcorna 这类产品的经济买方通常是政府或公共卫生机构，使用者是临床点位和接种成人。ABO2102、ABO2203
              这类肿瘤资产的初始采用界面根本不是支付方决策，而是由研究者、医院、CRO、伦理审查和监管机构组成的临床开发链。因此，早期客户证明更像试验参与、医院合作或伙伴互动，而不是已确认产品收入。Ruijin
              合作和中国-马来西亚 TB 项目即便不是经典 SaaS 意义上的「客户」，仍然相关。Abogen 的合作伙伴页面还显示第二条采用路径：平台合作，由药企 或疫苗公司购买 AI
              设计、RNA、递送、制剂或制造能力。只有这两条采用路径相互强化、而不是争夺稀缺资本，市场论证才最强。这种互动是今天任何现实商业化模型的核心。
