      - number: '8.3'
        title: 情景框架与可比锚点
        blocks:
          - type: paragraph
            body: >-
              用情景框架比单一倍数更合适。牛市情景中，Abogen
              继续把技术进展转成临床和商业化里程碑，并开始通过合同或财务证据弥合披露缺口。基准情景中，公司仍有战略重要性，但仍太不透明，无法获得完整溢价重估。熊市情景中，在经济性可见之前，融资或伙伴脆弱性压过里程碑动能。可比公司也要谨慎使用。Walvax
              是有用的成熟度锚点，因为它展示了规模化疫苗运营商的样子。Moderna、Arcturus 和 CureVac 是有用的平台锚点，因为它们说明更成熟 RNA 平台是什么形态。它们没有一个能给 Abogen
              提供干净的一行倍数可比，所以区间判断比虚假精确更安全。因此，可比工作最好用来限定预期，而不是制造假确定性。
