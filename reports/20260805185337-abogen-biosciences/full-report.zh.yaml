      - number: '3.3'
        title: 护城河主张、切换成本与竞争耐久度
        blocks:
          - type: paragraph
            body: >-
              Abogen 的护城河论证可信但有选择性。最强主张集中在一体化内部能力、冻干制剂诀窍、经临床验证的 LNP 表现，以及有意义的国际专利足迹。PatSnap 2026 年格局有用，因为它独立把 Abogen
              放进中国领先专利集群；Abogen 的合作伙伴页面则补充了公司自己更大的专利数量主张。制造、制剂和递送很难快速复制，所以这些优势重要。但护城河耐久度不是绝对的。西方龙头继续收购或吸收挑战者
              IP，买方往往可以多栖，许多关于 mRNA 广度的公开说法也开始商品化。因此，Abogen 的防御性在具体工作流和适应症里更强，而不是作为整个 mRNA
              经济的普适平台赢家。这个细节很重要，因为投资人常为宽泛平台叙事付出过高价格，却低估渠道摩擦、伙伴依赖和后续融资风险。
