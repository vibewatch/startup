      - number: '2.2'
        title: 规模、区域增长与疾病需求逻辑
        blocks:
          - type: paragraph
            body: >-
              独立市场出版商对方向判断一致，尽管具体规模不同：2025–2031 年，mRNA 疗法仍是一个大且继续增长的板块。The Business Research Company 报告 2025 年市场规模约
              $35.9B，Research and Markets 则给出更大的 2026 年基数和更快
              CAGR。绝对数字不同是因为方法不同，但方向结论一致：亚太仍是最重要增长剧场之一，肿瘤学继续越过传染病向外扩展，平台投资没有随着 COVID 常态化而结束。Abogen
              最相关的需求口袋是带状疱疹、RSV、KRAS 驱动肿瘤，以及中期 TB。ChinaMedAccess 还给出实用现实校验：中国已有 35
              项以上活跃癌症疫苗试验，赛道已经拥挤。所以市场很大，但临床和商业捕获仍需要差异化证据，而不是只参加热门类别。拥挤环境下，适应症选择和渠道策略与原始行业增长同样重要。
