      - number: '1.3'
        title: 融资历史、估值与资本背景
        blocks:
          - type: paragraph
            body: >-
              Abogen 融资史最清晰的部分是 2020–2021 年。公司公开宣布 2020 年 10 月 RMB 150M A 轮、2021 年 4 月 RMB 600M B 轮、2021 年 8 月超过 $700M C
              轮，以及 2021 年 11 月 $300M C+ 轮。官方公告也明确了资金用途：加速 COVID 和更广泛临床项目、建设或扩展制造产能、增强 mRNA 平台、加快商业化。随后第三方数据库补齐概览。Tracxn
              汇总公司累计融资约 $1.13B，GetLatka 等低置信来源重复约 $3.7B 的独角兽估值。考虑到 2021
              年轮次规模和投资人质量，这一估值方向上说得通，但不应视为完全验证，因为最强公开证据仍是二手资料。2021
              年之后没有公开融资细节，并不证明没有融资；只能证明不透明。把旧有私募估值转成当前投资判断时，这一区别很重要。
