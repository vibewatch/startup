      - number: '1.4'
        title: 里程碑、当前阶段与不利事件
        blocks:
          - type: paragraph
            body: >-
              Abogen 的里程碑记录对一家 2019 年成立的公司来说异常密集。2020 年 6 月，它拿到中国首个国产 mRNA COVID 疫苗临床试验批准。2022 年 9 月，AWcorna 在印尼获得 EUA，让
              Abogen 和 Walvax 拿到中国之外真实世界监管与分销里程碑。2025 年，平台进入肿瘤领域，pan-KRAS 治疗性癌症疫苗 ABO2102 获美国 FDA 和中国 IND 批准。2026
              年，管线继续拓宽：ABO1108 进入带状疱疹 III 期，ABO2203 产生首次人体 AACR 数据，中国-马来西亚 TB mRNA 合作推进。主要不利事实不是科学失败，而是伙伴路径脆弱：Walvax 在
              2024 年终止了 COVID 和带状疱疹 mRNA 项目的技术开发合作。这不会抹掉 Abogen 的平台进展，但确实降低了外界对商业化、制造放大和分销可以直接沿用旧 COVID 时代伙伴关系的信心。
