  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 论证质量与价格质量
        blocks:
          - type: paragraph
            body: >-
              Abogen 的核心估值问题不是公司看起来弱。相反，累积证据现在显示的平台比 2021 年融资标题单独暗示的更严肃。带状疱疹 III 期进展、双 KRAS IND
              和首次人体肿瘤数据都强化了战略案例。定价问题在于，公开证据没有跟上战略进展。投资人更清楚地看到里程碑质量，却看不清当前经济性。这造成一种不对称：可以相信公司不错，同时仍相信价格可能太高。因此，建议必须对价格敏感，而不是对欣赏程度敏感。基于当前公开证据，结论是跟踪，而不是投资。Abogen
              值得持续关注，但不值得盲目接受溢价估值叙事。公司达到了战略兴趣门槛，但尚未达到估值自满门槛。换句话说，Abogen 可能值得积极研究，却仍不值得积极买入。
