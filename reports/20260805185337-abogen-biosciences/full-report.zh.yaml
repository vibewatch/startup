      - number: '8.4'
        title: 最终判断、终止触发器与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              最终判断很直接。Abogen
              适合作为尽调目标，但还不能仅凭公开证据、在溢价估值姿态下投资。公司有真实期权价值、可信科学和有意义战略上行。它也有严肃执行、伙伴和披露风险，使价格纪律成为必要条件。更好的设置来自两件事之一：私有尽调明显更好，或进入价格明显更好。终止投资假设的触发器同样清楚：重大试验挫折、伙伴关系再次走弱、融资压力，或无法把里程碑转成耐久商业化证明。在这些问题澄清之前，最佳投资人姿态是参与但克制。这个姿态保留学习价值，不强迫投资人为缺失的经济性承销；如果私有尽调在经济性和条款上都带来正面惊喜，也留出上调空间。该姿态让投资人暴露于上行学习，同时防御前沿生物科技常见模式：强科学跑在可见经济性前面。
