figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Abogen 2019 年成立，已推进到 2026 年多资产管线里程碑，但 2024 年中合作伙伴路径出现断点。
    data:
      items:
        - date: 2019-01
          label: 成立
          detail: Abogen 在苏州成立，定位为聚焦 mRNA 的生物技术公司。
        - date: 2020-06
          label: 首个临床批准
          detail: COVID mRNA 疫苗获批在中国开展临床试验。
        - date: 2021-08
          label: 超大额融资
          detail: 宣布完成超过 $700M 的 C 轮融资。
        - date: 2022-09
          label: 印度尼西亚 EUA
          detail: AWcorna 获得海外紧急使用授权。
        - date: 2024-06
          label: 合作伙伴终止合作
          detail: Walvax 终止 COVID 和带状疱疹 mRNA 项目的技术合作。
        - date: 2025-05
          label: ABO2102 FDA IND
          detail: 泛 KRAS 肿瘤项目进入美国临床。
        - date: 2025-08
          label: ABO2102 中国 IND
          detail: 肿瘤项目新增国内 IND。
        - date: 2026-06
          label: ABO1108 III 期
          detail: 后期带状疱疹疫苗试验启动。
