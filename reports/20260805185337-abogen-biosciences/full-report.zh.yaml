            body: >-
              Abogen 的公开客户证据真实但狭窄。最清晰的两个证明是 Ruijin 合作和 AWcorna 印尼路径。两者合起来说明 Abogen
              已触达具名外部机构，并至少通过伙伴关联路线进入一个海外公共卫生市场。这很重要，因为许多私营生物科技公司发布管线新闻，却从不展示任何买方侧信号。但同一证据也有明显限制。两个证明都没有披露收入、合同价值、复购行为或客户集中度。因此，正确解读是
              Abogen
              已证明客户准入路径，而不是已经建立规模化、多元客户群。本章因此强调经验证的交易对手和采用路线，而不是假装客户指标已知。投资人应把证据读作早期牵引力证明，而不是完成版商业评分表。公开指标稀疏且伙伴集中度有意义时，这一区分对投资承销很关键。
