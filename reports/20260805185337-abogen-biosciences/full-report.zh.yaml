      - number: '3.4'
        title: 底线定位与仍未知的事项
        blocks:
          - type: paragraph
            body: >-
              最平衡的读法是，Abogen 已在中国及跨境 mRNA 生态内建立了严肃竞争位置，但在商业化证明、分销触达和公开价格可见度上仍落后全球领导者。它的差异化足以值得重视，尤其在后期带状疱疹、pan-KRAS
              肿瘤和一体化平台叙事上。它还没有强到可以忽略伙伴依赖、替代疗法或未来份额压缩。最大的未知单元不是 mRNA 是否重要，而是 Abogen
              能否把技术广度转成耐久合同、重复采购，并最终转成在更大、资本更厚的对手面前仍站得住的产品级经济性。竞争力真实存在，但变现优势仍是推断，不是定论。因此，任何承销案例都应压力测试公司面对资金更充足对手、伙伴不续约、疫苗采用慢于预期，以及
              Abogen 捕获耐久商业规模之前技术差异化收窄的情景。
