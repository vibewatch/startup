companyProfile:
  summary: >-
    Abogen Biosciences 是一家总部在苏州、由创始人带队的私营 mRNA 平台公司，成立于 2019 年。2020-2021 年的大额融资和 COVID 阶段 AWcorna
    推进帮它建立早期可信度，此后管线扩展到带状疱疹、RSV、TB 和肿瘤。到 2026 年中，公开证据里最强的验证点是 ABO1108 III 期进展、ABO2102 获 FDA 和中国 IND 批准，以及 ABO2203
    早期人体数据；最大的尽调约束仍是私营公司经济性、合作伙伴耐久度和当前融资条款。
  foundedDate: '2019-01-01'
  founders:
    - name: Bo Ying
      role: 创始人、董事长兼 CEO
      background: 公开面对外界的科学与战略负责人，个人履历承载了公司大部分外部可信度。
      claimRefs:
        - CO005
        - CO006
  foundingLocation: Suzhou, Jiangsu, China
  headquarters: Suzhou, Jiangsu, China
  productSummary: >-
    Abogen 依托自有 RNA 设计、递送、制剂和制造能力，开发覆盖传染病和肿瘤的 mRNA 疫苗与疗法。当前最显眼的资产是带状疱疹 ABO1108、KRAS 肿瘤 ABO2102，以及 mRNA 编码 T 细胞衔接器肿瘤项目
    ABO2203。
  customerFocus: 可见外部交易对手集中在公共卫生和机构渠道，而不是广泛商业客户群：印尼 / AWcorna 是最清晰的公共卫生路径，Ruijin 是最清晰的具名机构合作。
  businessModel: 商业化前生物科技模式：历史融资支撑当前平台和管线开发，未来价值大概率取决于产品上市、伙伴主导商业化，以及平台或制造合作。
