      - number: '7.3'
        title: 组织深度、竞争压力与市场风险
        blocks:
          - type: paragraph
            body: >-
              第三层风险是组织和战略。Bo Ying
              仍是外部最容易识别的领导者，这对可信度有价值，也提醒关键人集中。招聘页面和公开活动节奏显示公司在建设，但不足以证明支撑后期生物科技执行所需的运营系统深度。竞争压力会放大这一问题。中国 mRNA
              肿瘤赛道在推进，全球 mRNA 玩家拥有更广平台和更深试验板凳。Abogen
              因此身处一场竞赛：技术能力必须配上速度、运营纪律，以及跟上资源更充足同行的能力。私营公司围绕财务的不透明又增加一层风险，因为外部观察者不容易测试它抵御不利情景的韧性。这意味着，在投资人从报告指标中看清之前，组织和竞争风险可能已经复合。团队板凳浅，可能一直隐藏到时间线滑坡或伙伴意外调整优先级才暴露。
