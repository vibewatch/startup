              最大财务问题不是缺少融资历史，而是缺少当前披露。公开来源没有显示手头现金、月度烧钱速度、毛利率或当前收入结构。这迫使投资人用里程碑和伙伴证据当代理指标。代理指标 有正反两面。正面看，AWcorna、ABO1108
              和肿瘤 IND 显示 Abogen 仍在把资本转成资产进展。负面看，Walvax 合作终止削弱了此前可见商业化路径，也没有公开来源证明 Abogen
