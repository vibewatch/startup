  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 伙伴集中与临床执行风险
        blocks:
          - type: paragraph
            body: >-
              公开记录把一件事说得异常清楚：Abogen 的风险不再是它是否有平台活动，而是它能否在不过度依赖少数外部关系的情况下承载沉重执行负荷。Walvax
              终止合作是最重要的负面信号，因为它说明一条可见的商业化和制造路径可能发生实质变化。同时，带状疱疹 III 期进展和双 IND 获批又说明 Abogen
              没有停滞。因此，正确解读是混合的。临床动能降低了存在性怀疑，但也把公司推入更难、更资本密集的运营阶段。早期肿瘤活动还增加了更多不确定性，因为初步人体信号很少足以消除开发风险。因此，投资人应把进展视为真实，也把风险视为仍然活跃。主要尽调错误，是把更多里程碑误当作执行更简单；事实上，每一次成功都在抬高运营负担。在前沿生物科技中，后期成功常常创造更窄、但更昂贵的失败模式。
