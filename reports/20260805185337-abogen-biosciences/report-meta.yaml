  topStrengths:
    - Abogen now has real milestone depth across infectious-disease and oncology programs, including ABO1108 Phase III and dual KRAS IND approvals.
    - The company proved unusually strong early capital access for a 2019-founded biotech, which supports platform seriousness and investor interest.
    - Public evidence shows at least narrow but real external adoption pathways through AWcorna in Indonesia and the Ruijin collaboration.
  topRisks:
    - Partner concentration and the Walvax cooperation termination weaken confidence in commercialization durability and channel independence.
    - Public sources still do not show current cash, burn, revenue mix, margin, or current financing terms, making valuation support weak.
    - Frontier-biotech execution risk remains high across Phase III, oncology follow-through, manufacturing scale-up, and capital intensity.
  unresolvedGaps:
    - Current cap-table terms, liquidation preferences, and current financing ask are not public, so entry-price discipline cannot be underwritten cleanly.
    - Public evidence does not provide current cash balance, burn, or program-level budgets, limiting scenario confidence.
    - "Customer monetization remains thinly disclosed: there is no public revenue-by-customer, reorder, or contract-value evidence."
    - Manufacturing readiness, quality-system detail, and partner economics remain insufficiently visible for high-conviction underwriting.
    - The most important open question is whether recent clinical progress can translate into durable commercialization and financing leverage before dilution pressure rises.
