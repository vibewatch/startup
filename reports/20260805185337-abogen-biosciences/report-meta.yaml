companyProfile:
  summary: >-
    Abogen Biosciences is a Suzhou-based, founder-led private mRNA platform company founded in 2019. The company
    built early credibility through large 2020-2021 financing rounds and COVID-era AWcorna progress, then broadened
    into shingles, RSV, TB, and oncology programs. By mid-2026, the strongest public proof points were ABO1108 Phase
    III progress, FDA and China IND approvals for ABO2102, and early human ABO2203 data, while the biggest diligence
    constraints remained private economics, partner durability, and current financing terms.
  foundedDate: "2019-01-01"
  founders:
    - name: Bo Ying
      role: Founder, chairman, and CEO
      background: Public-facing scientific and strategic leader whose profile anchors most of the company's external credibility.
      claimRefs: [CO005, CO006]
  foundingLocation: Suzhou, Jiangsu, China
  headquarters: Suzhou, Jiangsu, China
  productSummary: >-
    Abogen develops mRNA vaccines and therapeutics across infectious disease and oncology, using in-house RNA design,
    delivery, formulation, and manufacturing capabilities. The lead visible assets are ABO1108 in shingles, ABO2102
    in KRAS oncology, and ABO2203 in mRNA-encoded T-cell engager oncology.
  customerFocus: >-
    Visible external counterparties are concentrated in public-health and institutional channels rather than a broad
    commercial customer base: Indonesia/AWcorna provides the clearest public-health route, while Ruijin is the clearest
    named institutional collaboration.
  businessModel: >-
    Precommercial biotech model: historical funding supports platform and pipeline development today, while future value
    likely depends on product launches, partner-led commercialization, and platform or manufacturing collaborations.
  stage: private-clinical-stage
  fundingStatus: >-
    Private company. Publicly evidenced financing includes a RMB 150M Series A in 2020, RMB 600M Series B in 2021,
    an over-$700M Series C in 2021, and a $300M C+ in 2021; third-party databases often cite roughly $1.13B total
    funding and a 2021-era ~$3.7B unicorn mark, but current financing terms are not public.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO012, CO013, CO019, CI008, CI010, CE009, CE011, CU024, CV003, CV030]
