chapter:
  number: 2
  title: Market Analysis
  summary: 'Abogen addresses a large and still-expanding mRNA therapeutics market, but the relevant diligence lens is narrower than generic TAM rhetoric: shingles, RSV, pan-KRAS oncology, and selected public-health programs are the real addressable wedges. Independent sources support strong sector tailwinds and China’s dense oncology activity, while the main constraints remain regulatory burden, manufacturing capital intensity, and still-unproven company-specific share capture.'
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: 'Abogen does not fit a single narrow category. The public materials describe one company spanning infectious-disease vaccines, therapeutic oncology, and enabling platform services. For diligence purposes, that means the correct market boundary is layered. The broadest layer is global mRNA therapeutics. A narrower and more decision-useful layer is infectious-disease vaccines plus therapeutic oncology vaccines and mRNA immunotherapies. The narrowest layer is Abogen-specific: programs where the company has either clinical-stage assets, platform-partnering ambitions, or manufacturing/formulation differentiation. Generic platform TAM numbers can be helpful, but only after stripping out irrelevant spend such as non-mRNA biologics, consumer wellness, or unrelated genomics tools. The right boundary is therefore not just “mRNA is huge.” It is a set of adjacent but distinct product markets and partner markets that share common technology, regulatory, and manufacturing constraints. It also
    prevents broad market numbers from silently double-counting partner revenue and product revenue as if they were the same thing.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM025
  - CM026
  tableRefs:
  - TM001
  figureRefs:
