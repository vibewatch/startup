- id: sizing-and-growth
  title: Sizing, Regional Growth, and Disease-Demand Logic
  body: 'Independent market publishers agree on the direction of travel even when they disagree on exact scale: mRNA therapeutics remains a large and still-growing sector in 2025–2031. The Business Research Company reports a roughly $35.9B 2025 market size, while Research and Markets frames a larger 2026 base and faster CAGR. The absolute numbers differ because methodologies differ, but the directional takeaway is consistent: Asia-Pacific remains one of the most important growth theaters, oncology continues to expand beyond infectious disease, and platform investment has not ended with COVID normalization. For Abogen specifically, the most relevant demand pockets are shingles, RSV, KRAS-driven oncology, and medium-term TB. ChinaMedAccess adds a useful reality check by showing that China is already crowded with 35-plus active cancer-vaccine trials. So the market is large, but clinical and commercial capture will still require differentiated evidence rather than mere participation in a hot
    category. Crowding makes indication choice and channel strategy just as important as raw sector growth.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM006
