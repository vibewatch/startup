- id: drivers-and-constraints
  title: Growth Drivers, Constraints, and What Still Needs Proving
  body: 'The demand drivers for Abogen are clear enough: continued infectious-disease burden, clear unmet need in China for newer RSV products at the time of Abogen’s IND, established adult-vaccine demand in shingles, and persistent oncology interest in shared-antigen and personalized mRNA strategies. Yet the adoption constraints are just as important. Research and Markets explicitly highlights cold-chain and regulatory complexity, while Walvax’s manufacturing-capacity disclosures show how expensive scale-up and compliant fill-finish infrastructure can be. Abogen’s own answer is lyophilization and modular platform capabilities, which should reduce logistics friction if clinical data hold up. Still, the market case is incomplete without buyer-budget evidence, especially for oncology. There is no public Abogen-specific SOM model in the evidence set. The honest conclusion is that sector TAM supports continued investor attention, but Abogen-specific share capture remains a diligence question,
    not a finished fact.'
