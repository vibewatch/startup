  - - Platform partnering market
    - AI design, RNA engineering, delivery, formulation, manufacturing services
    - Generic CRO revenue without platform differentiation
    - Biopharma partners
    - Supports non-product upside
  notes: Definitions separate platform and asset markets so broad TAM does not overstate Abogen-specific capture.
