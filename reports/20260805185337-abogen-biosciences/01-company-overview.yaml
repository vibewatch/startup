- id: capital-and-valuation
  title: Funding History, Valuation, and Capital Context
  body: 'The clearest part of Abogen’s financing history is the 2020–2021 period. The company publicly announced a RMB 150M Series A in October 2020, a RMB 600M Series B in April 2021, an over-$700M Series C in August 2021, and a $300M C+ round in November 2021. Those official releases also make the use of funds explicit: accelerate COVID and broader clinical programs, build or expand manufacturing capacity, enhance the mRNA platform, and speed commercialization. Third-party databases then fill in the summary picture. Tracxn aggregates the company at roughly $1.13B raised, while lower-confidence sources such as GetLatka repeat a ~$3.7B unicorn valuation. The valuation number is directionally plausible given the size and investor quality of the 2021 rounds, but it should not be treated as fully verified because the strongest public evidence is still secondary. The absence of any post-2021 public financing detail is not proof of no financing; it is proof of opacity. That distinction matters
    when translating old private marks into a current investment view.'
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
