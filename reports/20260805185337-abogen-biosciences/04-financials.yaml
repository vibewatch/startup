- id: cost-structure-and-capital-needs
  title: Capital Intensity, Cost Structure, and Forward Financing Needs
  body: 'The strongest public evidence on cost structure is indirect. Walvax’s manufacturing disclosures show that fill-finish and vaccine production infrastructure are expensive, and Abogen’s own recent milestones show the company is now funding both a Phase III shingles program and continuing oncology clinical work. Those are not cheap activities. Even without exact cost figures, the implication is clear: Phase III vaccines, oncology IND programs, multiple RNA modalities, and integrated manufacturing aspirations create a heavy capital burden before broad revenue can show up. Lyophilization may help the eventual unit-economics profile by reducing logistics friction, but it does not remove the need to fund clinical trials, quality systems, and manufacturing scale-up. The most likely next-round trigger is program advancement, not just corporate overhead. Peer mRNA platforms also demonstrate that sustained spending on process, formulation, and CMC work often continues long before durable revenue
    is visible.'
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI024
  - CI025
  - CI028
  - CI032
  - CI035
