- id: capital-history
  title: Funding History, Capital Use, and Historical Support
  body: 'Abogen’s historical financing record is unusually strong for a company founded in 2019. Official releases cover a RMB 150M Series A, RMB 600M Series B, an over-$700M Series C, and a $300M C+ round in 2021. Those same releases also explain why the money was raised: platform build-out, GMP capacity, broader pipelines, internationalization, and commercialization. Third-party aggregation then extends the picture with a roughly $1.13B total-raised figure, though lower-confidence databases disagree on exact totals and valuation. The key inference is not that every outside number is precise; it is that Abogen demonstrably raised enough capital to attempt a multi-asset platform strategy. What remains unknown is how efficiently that capital has translated into current economic position, because current cash and burn remain private. Historical fundraising proves access to investors, but it does not by itself prove present solvency or healthy operating leverage. In practice, investors still
    need management accounts to know whether historical capital has been preserved, consumed, or redeployed into the latest programs.'
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
