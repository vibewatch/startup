    severity: material
    topic: economics-and-runway
    missingEvidence: Cash balance, burn, revenue mix, margin, and program-level spend.
    whyItMatters: These numbers determine whether scenario ranges should center on optionality or financing stress.
    diligencePath: Request management accounts, budget by program, and partner economics.
    relatedQuestionRefs:
      - QV008
      - QV010
      - QV023
    relatedTableRefs:
      - TV003
      - TV006
  - type: private-evidence-only
    severity: minor
    topic: exit-readiness
    missingEvidence: Board-approved exit path, IPO readiness, audited controls, and banker feedback.
    whyItMatters: Without exit-readiness evidence, valuation upside should be discounted for execution time.
    diligencePath: Review audit readiness, governance materials, and any bank pitches.
    relatedQuestionRefs:
      - QV021
      - QV022
    relatedTableRefs:
      - TV005
