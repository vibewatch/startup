      - QR002
      - QR021
    relatedTableRefs:
      - TR001
      - TR004
  - type: private-evidence-only
    severity: minor
    topic: org-depth
    missingEvidence: Management depth, turnover, succession plans, and critical-role vacancy data.
    whyItMatters: Key-person concentration can worsen quickly in deep-tech biotech if bench strength is shallow.
    diligencePath: Request org chart, turnover metrics, and succession planning materials.
    relatedQuestionRefs:
      - QR011
      - QR024
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-terms
    missingEvidence: >-
      Current valuation ask, liquidation preferences, pro-rata rights, option pool changes, and any structured financing
      terms.
    whyItMatters: >-
      Valuation stance cannot be underwritten cleanly without knowing what price and protections investors are actually
      being offered.
    diligencePath: Request current financing materials, cap table, and term sheet.
