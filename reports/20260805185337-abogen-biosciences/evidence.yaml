evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, independent-director list, and shareholder-control table.
    whyItMatters: >-
      Governance quality and investor rights matter for a private biotech that has already raised over $1B equivalent
      capital.
    diligencePath: Request the latest board deck or capitalization table from the company or lead investors.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cap table, preference stack, secondary sales, and any venture debt or policy-bank facilities.
    whyItMatters: Without cap-table terms, dilution and downside protection cannot be underwritten.
    diligencePath: Obtain term sheets for the 2021 C/C+ rounds and any 2022+ financing amendments.
    relatedQuestionRefs:
      - QO020
      - QO025
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Auditable employee count, site-level headcount, and current manufacturing footprint.
    whyItMatters: Scale claims affect cost structure, burn assumptions, and execution readiness.
    diligencePath: Request a current org chart or HR snapshot; corroborate with site visits and payroll summaries.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: budget-evidence
    missingEvidence: Named payer, tender, or reimbursement evidence for oncology-vaccine purchasing pathways.
    whyItMatters: >-
      The buyer-user-payer chain in oncology determines how quickly clinical milestones can translate into commercial
      revenue.
    diligencePath: Request target-customer lists, hospital collaboration MOUs, or tender/reimbursement dossiers.
    relatedQuestionRefs:
      - QM024
  - type: enumeration-incomplete
    severity: material
    topic: market-share
    missingEvidence: An Abogen-specific SOM or penetration model by indication and geography.
    whyItMatters: Broad sector TAM does not prove company-level upside without a realistic share bridge.
    diligencePath: >-
      Build indication-level bottoms-up models using incidence, eligible patients, pricing, and trial-to-launch
      probabilities.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: minor
    topic: public-procurement
    missingEvidence: Current mix of government procurement versus partner-led commercial channels after AWcorna and the Walvax reset.
    whyItMatters: Channel mix affects cycle time, pricing power, and geopolitical sensitivity.
    diligencePath: Request post-2024 channel strategy from management and verify via tender databases.
    relatedQuestionRefs:
      - QM019
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Actual pricing, contract structure, and realized economics for Abogen versus relevant peers.
    whyItMatters: Without pricing evidence, competitive positioning can overstate monetization strength.
    diligencePath: Collect partner term sheets, list-price disclosures, or procurement contracts.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: lock-in
    missingEvidence: Evidence of renewal, repeat procurement, or partner exclusivity that would prove switching costs.
    whyItMatters: Partnership-heavy biotech platforms can appear sticky while actually being replaceable.
    diligencePath: Request repeat-order history, exclusivity clauses, and renewal terms.
    relatedQuestionRefs:
      - QP023
  - type: enumeration-incomplete
    severity: minor
    topic: unsupported matrix cells
    missingEvidence: Consistent public pricing and packaging details for all major global and China peers.
    whyItMatters: A capability matrix can be built from public sources, but pricing and packaging still contain unknown cells.
    diligencePath: Use filings, tender databases, and partner procurement docs to fill unknown fields.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, burn rate, runway months, and any debt or project-finance obligations.
    whyItMatters: Without cash and burn, financing risk cannot be quantified.
    diligencePath: Request management financials, board materials, and any lender covenants.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: COGS, gross margin, pricing realization, partner economics, and program-level spend.
    whyItMatters: Late-stage biotech value depends on whether technical progress can translate into economic returns.
    diligencePath: Request program budgets, supply contracts, and partner term sheets.
    relatedQuestionRefs:
      - QI010
      - QI024
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: revenue-visibility
    missingEvidence: Current revenue mix across products, grants, and partnerships.
    whyItMatters: Without mix detail, investors cannot separate durable income from one-off milestones.
    diligencePath: Obtain historical P&L by program or partner.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: architecture-detail
    missingEvidence: Batch-level process controls, yield, cost, throughput, and release metrics for Abogen’s manufacturing stack.
    whyItMatters: Technical claims can be real while manufacturing economics still fail at scale.
    diligencePath: Request CMC summaries, engineering run data, and CDMO or internal plant metrics.
    relatedQuestionRefs:
      - QE023
      - QE025
  - type: private-evidence-only
    severity: material
    topic: platform-reliability
    missingEvidence: Public or private reliability evidence such as deviations, out-of-specification rates, or support metrics.
    whyItMatters: Clinical-stage platform companies still need operational-quality proof beyond publications and patents.
    diligencePath: Request quality-system KPIs, audit findings, and manufacturing release data.
    relatedQuestionRefs:
      - QE019
      - QE024
  - type: private-evidence-only
    severity: minor
    topic: commercial-economics
    missingEvidence: Product-level gross margin, cost-of-goods, and formulation-cost comparisons.
    whyItMatters: Without cost data, it is impossible to know whether the platform edge is only scientific or also economic.
    diligencePath: Request program economics for ABO1108, RSV, and oncology assets after pilot-scale manufacturing.
    relatedQuestionRefs:
      - QE025
  - type: private-evidence-only
    severity: material
    topic: customer-metrics
    missingEvidence: Named customer count, revenue by customer, reorder data, retention, and contract value.
    whyItMatters: These metrics determine whether external adoption is broad and durable or concentrated and pilot-like.
    diligencePath: Request CRM export, procurement history, top-customer revenue bridge, and renewal data.
    relatedQuestionRefs:
      - QU021
      - QU022
    relatedTableRefs:
      - TU001
      - TU005
  - type: private-evidence-only
    severity: material
    topic: channel-dependence
    missingEvidence: Exact economics and exclusivity terms for Walvax or other channel partners.
    whyItMatters: >-
      Partner-led customer access can be powerful or fragile depending on rights, margin share, and termination
      protections.
    diligencePath: Review partner agreements and country-by-country commercialization rights.
    relatedQuestionRefs:
      - QU011
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: enterprise-sales-capability
    missingEvidence: Team size, sales coverage model, business-development funnel, and lead conversion data.
    whyItMatters: Without operating detail, it is hard to distinguish deliberate customer-building from episodic partnership luck.
    diligencePath: Request org chart, hiring plan, and BD funnel metrics.
    relatedQuestionRefs:
      - QU013
      - QU020
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: operational-risk-indicators
    missingEvidence: Program budgets, enrollment dashboards, manufacturing readiness KPIs, deviation history, and quality observations.
    whyItMatters: These indicators determine whether visible milestone momentum is robust or fragile.
    diligencePath: Request trial operating reviews, CMC readiness packs, and quality-system summaries.
    relatedQuestionRefs:
      - QR020
    relatedTableRefs:
      - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-contract-durability
    missingEvidence: Current partner rights, exclusivity, revenue share, termination protections, and replacement channel strategy.
    whyItMatters: Partner dependence is the clearest public risk and cannot be scored precisely without contracts.
    diligencePath: Review all partner agreements and post-termination contingency plans.
