- id: financing-context
  title: Financing Context, Last Mark, and What Is Still Missing
  body: 'The financing history is impressive. Official releases show that Abogen raised large rounds quickly after founding and attracted top-tier investors. That matters because it proves access to capital and external belief in the platform. But it does not settle the present valuation debate. The 2021 unicorn mark was set in a different financing climate and before today’s need for harder evidence on commercialization durability and operating health. Public sources also do not reveal the current term sheet, cap-table protections, insider rights, cash position, or burn. Without those elements, an investor cannot tell whether a seemingly attractive company is actually offering an attractive entry. This is why the valuation stance remains cautious: the company may be stronger than the public underwriting, but that does not mean the current price is defensible. In private biotech, entry discipline often matters as much as asset quality.'
  claimRefs:
  - CV007
  - CV008
  - CV009
  - CV010
  - CV024
  - CV029
  - CV035
  - CV039
- id: scenarios-and-comps
  title: Scenario Framing and Comparable Anchors
  body: A scenario framework is more appropriate than a single multiple. In the bull case, Abogen keeps converting technical progress into clinical and commercialization milestones and begins to close the disclosure gap through contracts or financial evidence. In the base case, the company remains strategically important but still too opaque for a full premium rerating. In the bear case, financing or partner fragility overwhelms milestone momentum before economics become visible. Comparable work should also be used carefully. Walvax is a useful maturity anchor because it shows what a scaled vaccine operator looks like. Moderna, Arcturus, and CureVac are useful platform anchors because they illustrate what broader RNA-platform maturity looks like. None of them is a clean one-line multiple comp for Abogen, which is why range-based judgment is safer than false precision. The comp exercise is therefore best used to bound expectations, not to manufacture fake certainty.
  claimRefs:
