  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operational-risk-indicators
    missingEvidence: Program budgets, enrollment dashboards, manufacturing readiness KPIs, deviation history, and quality observations.
    whyItMatters: These indicators determine whether visible milestone momentum is robust or fragile.
    diligencePath: Request trial operating reviews, CMC readiness packs, and quality-system summaries.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-contract-durability
    missingEvidence: Current partner rights, exclusivity, revenue share, termination protections, and replacement channel strategy.
    whyItMatters: Partner dependence is the clearest public risk and cannot be scored precisely without contracts.
    diligencePath: Review all partner agreements and post-termination contingency plans.
    relatedQuestionRefs:
    - QR002
    - QR021
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: minor
    topic: org-depth
    missingEvidence: Management depth, turnover, succession plans, and critical-role vacancy data.
    whyItMatters: Key-person concentration can worsen quickly in deep-tech biotech if bench strength is shallow.
    diligencePath: Request org chart, turnover metrics, and succession planning materials.
    relatedQuestionRefs:
    - QR011
    - QR024
    relatedTableRefs:
    - TR003
