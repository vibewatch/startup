  topStrengths:
    - Abogen 在感染病和肿瘤项目上已有实质性里程碑，包括 ABO1108 Phase III 和两个 KRAS IND 获批。
    - 对一家 2019 年成立的生物科技公司来说，Abogen 早期融资能力异常强，证明平台有严肃度，也能吸引投资人。
    - AWcorna 在印度尼西亚的落地和瑞金合作说明，公司至少跑出了一条较窄但真实的外部采用路径。
  topRisks:
    - 合作伙伴集中，加上 Walvax 合作终止，削弱了商业化耐久度和渠道独立性的可信度。
    - 公开来源仍看不到当前现金、烧钱速度、收入结构、利润率或最新融资条款，估值支撑偏弱。
    - 前沿生物科技的执行风险仍高，Phase III、肿瘤管线推进、生产放大和资本强度都会继续考验公司。
  unresolvedGaps:
    - 当前股权条款、清算优先权和本轮融资要价都未公开，入场价格纪律无法干净承销。
    - 公开证据没有给出当前现金余额、烧钱速度或项目级预算，情景判断缺少底气。
    - 客户变现披露仍很薄：公开材料没有按客户拆分收入、复购或合同金额证据。
    - 生产准备度、质量体系细节和合作伙伴经济性仍不够透明，难以支撑高信心承销。
    - 最关键的开放问题是：稀释压力上来之前，近期临床进展能否转化为持久商业化能力和融资筹码。
