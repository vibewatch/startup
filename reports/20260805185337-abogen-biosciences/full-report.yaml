      - number: '3.2'
        title: Global Incumbents and China Peers
        blocks:
          - type: paragraph
            body: >-
              Global incumbents clearly exceed Abogen on scale, approvals, and distribution. Moderna and BioNTech have
              broader commercial infrastructure and much deeper proof with marketed products, while Walvax has
              demonstrated domestic distribution breadth and meaningful export reach. Yet Abogen is not just another
              generic challenger. It already has late-stage evidence through ABO1108 Phase III, COVID-era Phase III
              publication support through ABO1020, and a visible oncology push through ABO2102 and ABO2203. Among
              China-based peers, that combination of infectious-disease breadth, therapeutic oncology ambition, and
              integrated technical claims is comparatively strong. Still, the evidence shows that platform breadth is
              not unique by itself. Walvax, Immorna, and others also publicize broad R&D capabilities, which means
              Abogen needs to win on execution, not vocabulary. The crucial separator is whether those capabilities
              convert into later-stage assets, repeatable partnering, and eventually product economics visible outside
              marketing materials. That is why Walvax matters as both benchmark and warning: scale without unique mRNA
              differentiation still leaves room for new entrants, but technology without channels can also stall badly.
