    title: Customers
    sections:
      - number: '6.1'
        title: Visible Customer Proof and What It Really Shows
        blocks:
          - type: paragraph
            body: >-
              Abogen’s public customer evidence is real but narrow. The two clearest proofs are the Ruijin collaboration
              and the AWcorna Indonesia path. Together they show that Abogen has reached named external institutions and
              at least one foreign public-health market through a partner-linked route. That matters because many
              private biotech companies publish pipeline news without ever showing any buyer-side signal at all. But the
              same evidence also has obvious limits. Neither proof discloses revenue, contract value, reorder behavior,
              or customer concentration. So the right interpretation is that Abogen has demonstrated customer access
              pathways, not that it has already built a scaled, diversified customer base. This chapter therefore
              emphasizes verified counterparties and adoption routes rather than pretending that customer metrics are
              known. Investors should read the evidence as early traction proof, not as a finished commercial scorecard.
              That distinction matters materially for underwriting, especially when public metrics are sparse and
              partner concentration is meaningful today.
