      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Founder concentration is high. Bo Ying remains founder, chairman, and CEO, and the external record
              continues to route most company-level credibility through him. Xi’an Jiaotong-Liverpool University’s
              profile provides more substance than a simple corporate biography by confirming his Fudan and Northeastern
              academic background, while Abogen’s own leadership page shows a compact but functionally complete
              operating bench: CMO Wenjie Song, CTO Peng Gao, CFO Ziyi Song, and Chief AI Officer Iain McFadyen. That is
              enough to show clinical, technical, financial, and computational coverage, but not enough to eliminate
              key-person risk. Publicly accessible sources do not provide a current board roster, committee structure,
              or shareholder-control overview. The May 2026 appointment of Weimin Li as President of Preclinical
              Research is important because it signals active organizational build-out, yet it also reinforces that
              execution bandwidth still depends on a relatively small senior team.
