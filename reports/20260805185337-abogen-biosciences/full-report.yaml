chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Abogen Biosciences is best understood as a China-origin, clinical-stage mRNA platform company rather than
              a single-product vaccine venture. Across the homepage, about page, and leadership pages, the company
              consistently describes itself as building mRNA medicines end to end: target selection, RNA design, lipid
              delivery, GMP production, and clinical delivery all sit inside one operating narrative. That matters
              because later chapters depend on whether Abogen is merely licensing a COVID-era asset or whether it truly
              owns a reusable discovery and manufacturing stack. The public record supports the platform framing. It
              also supports a Suzhou, Jiangsu headquarters and a January 2019 founding date. What it does not support is
              any current public disclosure of revenue, ARR, customer count, or a clean headcount number. Those
              omissions are normal for a private biotech, but they mean every maturity judgment must anchor on product,
              funding, and regulatory milestones rather than income-statement visibility and disciplined downside
              framing.
