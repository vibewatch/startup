      - number: '8.2'
        title: Financing Context, Last Mark, and What Is Still Missing
        blocks:
          - type: paragraph
            body: >-
              The financing history is impressive. Official releases show that Abogen raised large rounds quickly after
              founding and attracted top-tier investors. That matters because it proves access to capital and external
              belief in the platform. But it does not settle the present valuation debate. The 2021 unicorn mark was set
              in a different financing climate and before today’s need for harder evidence on commercialization
              durability and operating health. Public sources also do not reveal the current term sheet, cap-table
              protections, insider rights, cash position, or burn. Without those elements, an investor cannot tell
              whether a seemingly attractive company is actually offering an attractive entry. This is why the valuation
              stance remains cautious: the company may be stronger than the public underwriting, but that does not mean
              the current price is defensible. In private biotech, entry discipline often matters as much as asset
              quality.
            claimRefs:
