  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct, Regional, and Status-Quo Alternatives'
        blocks:
          - type: paragraph
            body: >-
              Abogen competes on several fronts at once. The most obvious global comparables are Moderna and BioNTech,
              which still define the mRNA category at scale. A second group includes CureVac, Arcturus, Sanofi-linked
              mRNA efforts, and other challengers that compete on route, delivery, or platform specialization. A third
              layer is regional: Walvax, Immorna, Stemirna, and other China-based companies shape Abogen’s immediate
              operating environment. The final layer is status quo. In shingles and RSV, the buyer can still choose
              approved non-mRNA vaccines or wait for established alternatives. In oncology, mRNA vaccines and
              RNA-encoded constructs compete not only with one another but with small molecules, checkpoint
              combinations, and other experimental modalities. The correct competitor set therefore includes companies,
              substitute therapies, and partner-led routes to market. It also means no single comparison table can
              capture the whole decision frame without over-simplifying where Abogen actually wins and loses.
