      - number: '4.3'
        title: Capital Intensity, Cost Structure, and Forward Financing Needs
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence on cost structure is indirect. Walvax’s manufacturing disclosures show that
              fill-finish and vaccine production infrastructure are expensive, and Abogen’s own recent milestones show
              the company is now funding both a Phase III shingles program and continuing oncology clinical work. Those
              are not cheap activities. Even without exact cost figures, the implication is clear: Phase III vaccines,
              oncology IND programs, multiple RNA modalities, and integrated manufacturing aspirations create a heavy
              capital burden before broad revenue can show up. Lyophilization may help the eventual unit-economics
