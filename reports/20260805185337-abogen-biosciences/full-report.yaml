  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis Quality Versus Price Quality
        blocks:
          - type: paragraph
            body: >-
              Abogen’s core valuation problem is not that the company looks weak. On the contrary, the accumulated
              evidence now shows a more serious platform than the 2021 funding headlines alone implied. Phase III
              shingles progress, dual KRAS INDs, and first-in-human oncology data all strengthen the strategic case. The
              pricing problem is that public evidence has not kept pace with strategic progress. Investors can see
              milestone quality much more clearly than they can see present economics. That creates an asymmetry: it is
              possible to believe the company is good while still believing the price may be too high. The
              recommendation therefore has to be price-sensitive rather than admiration-sensitive. On current public
              evidence, that means track, not invest. Abogen deserves continued attention, but not blind acceptance of a
              premium valuation narrative. The company clears the bar for strategic interest, but not yet the bar for
              valuation complacency. Put differently, Abogen may be worth studying aggressively while still not being
              worth buying aggressively.
