      - number: '4.4'
        title: Disclosure Gaps, Partner Risk, and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The biggest financial problem is not lack of capital history; it is lack of current disclosure. Public
              sources do not show cash on hand, monthly burn, gross margin, or current revenue mix. That forces an
              investor to use milestones and partner evidence as proxies. Those proxies cut both ways. On the positive
              side, AWcorna, ABO1108, and the oncology INDs show Abogen is still converting capital into asset progress.
              On the negative side, the Walvax cooperation termination weakened a previously visible commercialization
              path, and no public source proves that Abogen has replaced it with equally durable contracts. The most
              supportable verdict is therefore cautious: historically well funded, presently capital intensive, and
              still too opaque for high-confidence underwriting without private financial disclosure. Private financial
