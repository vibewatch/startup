      - number: '1.4'
        title: Milestones, Current Stage, and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Abogen’s milestone record is unusually dense for a company founded in 2019. In June 2020 it reached
              China’s first domestic mRNA clinical-trial approval for a COVID vaccine. In September 2022 it achieved
              Indonesia EUA for AWcorna, giving Abogen and Walvax a real-world regulatory and distribution milestone
              beyond China. In 2025 the platform moved into oncology with both U.S. FDA and China IND approvals for
              ABO2102, a pan-KRAS therapeutic cancer vaccine. In 2026 the pipeline broadened further: ABO1108 moved into
              Phase III for shingles, ABO2203 generated first-in-human AACR data, and a China-Malaysia TB mRNA
              collaboration advanced. The main adverse fact is not scientific failure but partner-path fragility: Walvax
              terminated technical development cooperation on COVID and shingles mRNA programs in 2024. That does not
              erase Abogen’s platform progress, but it does reduce confidence that commercialization, manufacturing
              scale-up, and distribution can simply be assumed from old COVID-era partnerships.
