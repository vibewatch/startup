      - number: '8.3'
        title: Scenario Framing and Comparable Anchors
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more appropriate than a single multiple. In the bull case, Abogen keeps converting
              technical progress into clinical and commercialization milestones and begins to close the disclosure gap
              through contracts or financial evidence. In the base case, the company remains strategically important but
              still too opaque for a full premium rerating. In the bear case, financing or partner fragility overwhelms
              milestone momentum before economics become visible. Comparable work should also be used carefully. Walvax
              is a useful maturity anchor because it shows what a scaled vaccine operator looks like. Moderna, Arcturus,
              and CureVac are useful platform anchors because they illustrate what broader RNA-platform maturity looks
              like. None of them is a clean one-line multiple comp for Abogen, which is why range-based judgment is
              safer than false precision. The comp exercise is therefore best used to bound expectations, not to
              manufacture fake certainty.
