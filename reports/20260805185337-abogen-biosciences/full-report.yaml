      - number: '8.4'
        title: Final Call, Kill Triggers, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              The final call is therefore straightforward. Abogen is investable as a diligence target, but not yet
              investable on public evidence alone at a premium valuation stance. The company has real option value,
              credible science, and meaningful strategic upside. It also has serious execution, partner, and disclosure
              risks that make price discipline essential. A better setup would be one of two things: materially better
              private diligence or materially better entry price. Kill triggers are equally clear: major trial setbacks,
              renewed partner weakness, financing stress, or inability to convert milestones into durable
              commercialization proof. Until those issues are clarified, the best investor posture is engaged but
              disciplined. That stance preserves learning value without forcing investors to underwrite missing
              economics. It also keeps room for an upgrade if private diligence surprises positively on both economics
              and terms. That posture keeps exposure to upside learning while protecting against the familiar
              frontier-biotech pattern of strong science outrunning visible economics.
            claimRefs:
              - CV021
