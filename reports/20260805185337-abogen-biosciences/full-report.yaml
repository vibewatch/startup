      - number: '2.3'
        title: Buyer/User/Payer Map and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Abogen’s buyer map changes by indication. For products like AWcorna, the economic buyer is typically a
              government or public-health authority, while users are clinical sites and vaccinated adults. For oncology
              assets such as ABO2102 and ABO2203, the immediate adoption surface is not a payer decision at all but a
              clinical-development chain involving investigators, hospitals, CROs, ethics review, and regulators. That
              makes early customer proof look more like trial participation, hospital collaboration, or partner
              engagement than recognized product revenue. The Ruijin collaboration and China-Malaysia TB program are
              therefore relevant even if they are not “customers” in the classic SaaS sense. Abogen’s partnering page
              also indicates a second adoption path: platform partnerships where pharma or vaccine companies buy
              capabilities in AI design, RNA, delivery, formulation, or manufacturing. The market case is strongest when
              those two adoption paths reinforce one another rather than compete for scarce capital. That interaction is
              central to any realistic commercialization model today.
