  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Partner Concentration and Clinical Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The public record makes one thing unusually clear: Abogen’s risk is no longer whether it has any platform
              activity at all, but whether it can carry a heavy execution load without overreliance on a small set of
              external relationships. The Walvax termination is the most important negative signal because it shows that
              a visible commercialization and manufacturing path can change materially. At the same time, Phase III
              shingles progress and dual IND wins show that Abogen is not stalled. The correct reading is therefore
              mixed. Clinical momentum reduces existential skepticism, but it also pushes the company into harder and
              more capital-intensive operating stages. Early oncology activity adds still more uncertainty because
              preliminary human signals are rarely enough to remove development risk. Investors should therefore treat
              progress as real and risk as still very active. The main diligence mistake would be to confuse more
              milestones with simpler execution, when in fact the operating burden is rising with every success. In
              frontier biotech, later success often creates narrower but more expensive failure modes.
