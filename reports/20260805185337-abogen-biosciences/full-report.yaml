figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Abogen progressed from 2019 founding to multi-asset 2026 pipeline milestones, but with a mid-2024 partner-path
      break.
    data:
      items:
        - date: 2019-01
          label: Founded
          detail: Abogen founded in Suzhou as an mRNA-focused biotech.
        - date: 2020-06
          label: First clinical approval
          detail: COVID mRNA vaccine approved for China clinical trials.
        - date: 2021-08
          label: Mega-round
          detail: Series C over $700M announced.
        - date: 2022-09
          label: Indonesia EUA
          detail: AWcorna obtains overseas emergency use authorization.
        - date: 2024-06
          label: Partner termination
          detail: Walvax terminates technical cooperation on COVID and shingles mRNA programs.
        - date: 2025-05
          label: ABO2102 FDA IND
          detail: Pan-KRAS oncology program enters U.S. clinic.
        - date: 2025-08
          label: ABO2102 China IND
          detail: Oncology program adds domestic IND.
        - date: 2026-06
          label: ABO1108 Phase III
          detail: Late-stage shingles vaccine trial begins.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO026
      - CO027
      - CO029
      - CO035
