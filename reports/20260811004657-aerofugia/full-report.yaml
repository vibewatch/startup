      - number: '2.3'
        title: Buyers, growth drivers, and the economics case
        blocks:
          - type: paragraph
            body: >-
              The buyer map for passenger eVTOL in China is institution-first. Aerofugia’s public order and partnership
              trail points toward airlines, leasing companies, tourism operators, and emergency-service platforms far
              more clearly than toward retail consumers. That matters because institutional buyers can tolerate longer
              certification lead times and can spread infrastructure and utilization risk over fleets or routes.
              Consumers generally cannot. In other words, the earliest market is not “flying cars for everyone”; it is
              aircraft procurement for a small number of well-capitalized operators.


              The strongest drivers are therefore policy support, domestic certification velocity, and institutional
              route formation. EHang’s progress demonstrates that Chinese regulators can move more quickly than Western
              peers under a sequenced approach. Aerofugia also claims meaningful operating-cost advantages versus
              helicopters, and KR-Asia quotes management suggesting that a typical premium helicopter price point could
              fall substantially on an electric basis. If that cost case proves out in real routes, the company’s buyer
              logic becomes more persuasive.


              But the economics case is still more directional than proven. No public source discloses Aerofugia’s
              route-level utilization assumptions, ticket yields, maintenance costs, or achieved margins. The market
              thesis is credible; the operating model is not yet publicly underwritten.
            claimRefs:
              - CM014
              - CM015
              - CM017
              - CM018
              - CM026
              - CM027
              - CM028
