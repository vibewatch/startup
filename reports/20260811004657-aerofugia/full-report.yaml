  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and technical risk dominate the first layer of the thesis
        blocks:
          - type: paragraph
            body: >-
              Aerofugia’s highest-severity risk is still certification timing. The company has a real and comparatively
              strong milestone track, but the investment case continues to depend on converting that progress into final
              type certification and then into deployable production output. The revised Civil Aviation Law improves the
              structural environment, yet it does not reduce the remaining program-specific work. Nor does the CCAR-135
              operating certificate eliminate the need to prove the aircraft itself under full certification and
              production-quality requirements.


              Technical risk sits immediately beneath that regulatory layer. Aerofugia has published unusually detailed
              company-authored material about battery performance, thermal protection, crash-load tolerance, wind-tunnel
              hours, propulsion redundancy, and composite or avionics design. Those are real positive signals because
              they show the company is thinking in aviation-grade system terms rather than in generic startup language.
              But they remain mostly company-side claims. Independent validation, certified-service reliability data,
              and supplier-level disclosure are still missing.


              The correct interpretation is therefore balanced: the company appears technically serious and procedurally
              advanced, yet technical maturity is not the same thing as low technical risk.
