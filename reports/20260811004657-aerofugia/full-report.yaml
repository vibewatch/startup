      - number: '5.4'
        title: 'Product-tech verdict: serious program, incomplete transparency'
        blocks:
          - type: paragraph
            body: >-
              The most defensible conclusion is that Aerofugia has a serious, advancing passenger-eVTOL program, but not
              yet a publicly transparent technical stack. The company has enough milestone evidence to show that AE200
              is real: official specs, named variants, transition-flight milestones, production configuration, a
              production-aircraft rollout, and regulator-facing progress across both certification and operations
              preparation. Those are meaningful signals and they compare reasonably well with what the market expects
              from a pre-commercial program.


              But the public record still stops short of what deep technical diligence would require. Investors do not
              yet have component-level design choices, reliability distributions, supplier concentration, or independent
              performance validation beyond the milestone headlines. The practitioner-community signal is also naturally
              weak because this is a hardware program, not a public-software platform.


              Aerofugia therefore deserves a positive product-tech read on momentum and seriousness, paired with a
              persistent diligence discount for subsystem opacity and unresolved production-readiness questions.
