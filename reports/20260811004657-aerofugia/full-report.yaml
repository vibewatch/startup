      - number: '1.3'
        title: Funding, valuation, and early commercial proof
        blocks:
          - type: paragraph
            body: >-
              Aerofugia’s public financing story sharpened materially in 2026. CnEVPost and EVMagz both reported that
              the company completed a nearly RMB1 billion round in February 2026 and then moved into STAR Market IPO
              tutoring one month later. The use of proceeds described in those reports is operational rather than
              cosmetic: type certification, headquarters build-out, and commercial low-altitude deployment. That
              sequencing makes sense for an eVTOL developer. Capital is being raised against manufacturing readiness and
              certification progression rather than against pure narrative expansion.


              The best third-party valuation anchor is Hurun’s Global Unicorn Index 2026, which places Aerofugia at
              US$1.8 billion and groups it with other low-altitude-economy unicorns such as Volant, Tengden, AVIC, and
              XAG. This is useful but not definitive. Hurun establishes that Aerofugia sits in the unicorn tier and in
              the upper tranche of China’s private low-altitude ecosystem, but it does not disclose pricing mechanics,
              liquidation preferences, or whether the February 2026 round fully matches that index valuation. The
              valuation should therefore be treated as a credible external marker, not a substitute for round documents.


              Commercial proof is visible but still somewhat coarse. Public order and partnership evidence includes the
              100-unit Hualong agreement, Sichuan Airlines ecosystem cooperation, Chuanfa Leasing’s 200-aircraft
              intention order, and CITIC Offshore Helicopter scenario development. These are meaningful proof points
              because they span airline, leasing, business aviation, tourism, and rescue contexts. But public sources
              still blend firm orders, intention orders, partnerships, and scenario MOUs. That blend is strong enough
              for a company-overview chapter; it is not strong enough to underwrite backlog quality without deeper
              diligence.
