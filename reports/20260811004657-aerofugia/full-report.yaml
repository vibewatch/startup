      - number: '3.3'
        title: Commercial model, pricing opacity, and the real source of moat
        blocks:
          - type: paragraph
            body: >-
              Public price comparison is weak across the entire peer set. Aerofugia, EHang, Joby, Archer, AutoFlight,
              Volant, and AeroHT all disclose enough to support strategic comparisons, but not enough to benchmark true
              realized aircraft pricing or service economics cleanly. As a result, the more useful comparison lens is
              buyer type and contract model: who is signing, under what structure, and with what likelihood of
              conversion into delivered aircraft and operating routes.


              By that lens, Aerofugia looks clearly institutional. Its order narrative emphasizes airlines, leasing
              platforms, and operators, and January 2026 coverage added another 300 reported orders on top of the larger
              backlog already cited in pre-IPO reporting. That is strategically positive because institutional channels
              can eventually reinforce financing, maintenance, and route formation. But it is not the same as a durable
              moat. In this stage of the market, customers can still multi-home across OEMs and keep optionality until
              certification and infrastructure readiness become real.


              The most plausible moats in the sector are therefore not software lock-in or brand alone. They are
              milestone timing, distribution depth, financing support, supply access, and the ability to turn channel
              announcements into repeatable route deployments.
