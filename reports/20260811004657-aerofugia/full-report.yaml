            body: >-
              Once an eVTOL program leaves pure prototyping, manufacturing and ecosystem risks become more important.
              Aerofugia is now clearly in that zone. Official sources highlight supply-chain conferences, strategic
              battery work, production-certificate progress, training initiatives, and route-validation pilots. Each of
              those items is constructive. Each also reveals that commercialization requires a large web of interlocking
              systems to work at once.


              That makes partner dependency a core risk. Operators such as Xiaoxiang, Sichuan Airlines-linked entities,
              and CITIC COHC can accelerate market entry by contributing routes, maintenance, pilots, or operating
              experience. Financing channels such as Jinshi and Chuanfa can lower procurement friction. But every such
