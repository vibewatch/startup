      - number: '8.3'
        title: Anti-thesis, exit readiness, and what still has to be true for the mark to hold
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is not that Aerofugia lacks substance. It is that the current private valuation could
              already be capitalizing too much future success relative to what is publicly proven. Official July 2026
              updates on add-on orders, tourism commercialization tools, and ecosystem development are helpful, and they
              do support an IPO-style narrative of accelerating market readiness. The company is clearly trying to show
              that its story kept strengthening after the 2026 financing round.


              But IPO readiness and valuation durability require more than narrative freshness. Investors still need
              evidence on revenue quality, backlog conversion, certification detail, and capital structure. Without
              those disclosures, a future listing story could look better in presentation than it does in underwriting.


              In other words, Aerofugia appears increasingly exit-ready at the strategic level, but not yet at the
              transparency level. That gap is central to the valuation stance.
            claimRefs:
              - CV016
              - CV017
              - CV023
              - CV024
