  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Certification delay
        - TC timeline slips beyond 2027 without compensating proof
        - Material schedule reset
        - Re-rate commercialization timeline and valuation
      - - Backlog conversion weakness
        - Large order fails to convert into deposits / deliveries
        - Anchor customer deterioration
        - Increase concentration discount
      - - Battery / safety event
        - Publicly disclosed serious failure or unresolved safety issue
        - Certification setback or incident
        - Pause conviction until root-cause resolution
      - - Infrastructure bottleneck
        - Repeated route-validation pilots without scale-up
        - No cluster expansion
        - Lower near-term market penetration assumptions
      - - Financing-channel fragility
        - Lessor or financing partner exits / slows
        - Funding support weakens
        - Raise CAC and working-capital assumptions
      - - Management overextension
        - Overseas push accelerates before domestic path stabilizes
        - Priority dilution
        - Question sequencing discipline
    notes: These are the concrete thresholds most likely to break the thesis.
