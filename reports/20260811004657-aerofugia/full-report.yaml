            body: >-
              The central limitation in the customer chapter is durability. No retained public source discloses churn,
              renewal, cancellation rates, contract length, deposit conversion, or utilization. That means Aerofugia’s
              visible backlog cannot yet be treated as a mature cohort. The best public durability proxy is repeat-order
              behavior, and the Xiaoxiang add-on order is helpful in that regard, but it still does not solve the
              underlying problem: investors cannot see the legal and economic terms that determine whether the backlog
              is sticky.


              Concentration risk also matters. Public traction is strong, but it is visibly concentrated in a handful of
              large announced customers and route partners. If even one or two of those anchors fail to convert into
              certified deliveries or real operations, the read-through would be meaningful. Procurement friction
              further compounds the issue because customers need routes, pilots, maintenance, infrastructure, financing,
              and regulatory approvals all at once.


