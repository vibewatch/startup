              technically impressive while commercialization slips.


              Infrastructure is especially important here. Aerofugia’s tourism-route and operating-handbook initiatives
              are sensible mitigations, yet they also show the company must still solve city-by-city infrastructure and
              operating-template problems rather than plug into a finished network.
