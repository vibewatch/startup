            body: >-
              Aerofugia’s capital-access story is good by private-China eVTOL standards, but the risk is still elevated
              because the sector is inherently cash consumptive. Certification, production tooling, supplier
              qualification, route enablement, and customer support all absorb money before sustained revenue arrives.
              Public peer failures and public-market volatility in the eVTOL category show that narrative strength does
              not immunize a program against funding stress.


              People and sequencing risk are also real. Aerofugia’s official recognition of its R&D and airworthiness
              team is a positive cultural signal, and its training ecosystem work is a practical mitigation. But those
              same facts underline how much highly specialized execution must happen in sequence. The company is
              building aircraft, proving airworthiness, coordinating partners, and trying to shape operating standards
              at the same time.


              Overseas ambitions add one more layer. Hong Kong and broader international outreach can diversify
              opportunity, yet they also create incremental approval, partnership, and geopolitical complexity before
