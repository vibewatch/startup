chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Aerofugia presents itself as a Geely-affiliated low-altitude mobility company headquartered in Chengdu and
              focused on commercializing pure-electric passenger eVTOL aircraft. The company’s official Chinese-language
              overview does more than brand positioning: it explicitly describes Aerofugia as the vehicle for Geely’s
              new general-aviation strategy, combining aircraft R&D with future commercial operations. That matters
              because investors are not underwriting a hobby-aircraft concept or a software-only routing layer; they are
              underwriting a capital-intensive aviation platform whose success depends on certification,
              industrialization, and operating-scenario buildout.


              The product surface is still concentrated around one core family. Official AE200 materials describe a 3-6
              seat piloted eVTOL family with a published 200-kilometer range, flexible cabin layouts, and target use
              cases across passenger transport, tourism, and aeromedical missions. Later batch-production reporting
              narrows the most concrete near-term variant to AE200-100, the model Aerofugia is pushing through
              certification first. That concentration is strategically coherent: one aircraft family, one regulator, one
              primary production base, and one domestic policy tailwind. It also means that downstream chapters should
              treat AE200 execution as the central variable for the entire company rather than as one option among
              several independent businesses.


              Physically, the operating footprint is anchored in Chengdu’s Future Science and Technology City near
              Tianfu International Airport. Gasgoo and CnEVPost reporting indicate that the headquarters base is
              intended to integrate R&D, manufacturing, testing, and delivery. Official company materials also mention
              branch presence in Shenzhen, Xi’an, and overseas. The footprint is therefore broader than one office
              address, but the Chengdu base is the industrial locus that later chapters should treat as the company’s
              primary scale-up asset.
