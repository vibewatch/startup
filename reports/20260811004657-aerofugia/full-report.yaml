      - number: '5.2'
        title: Architecture, certification logic, and what trust evidence is public
        blocks:
          - type: paragraph
            body: >-
              The public architecture is clear at a system level and opaque at a subsystem level. Aerofugia openly
              describes the AE200 family as a piloted, pure-electric passenger eVTOL with flexible cabin layouts and
              multiple mission variants. The company has also disclosed a development sequence that includes project
              launch in 2021, TC-application acceptance in 2022, full-envelope tilt-transition testing by mid-2024, a
              production configuration in late 2024, and a production-certificate application accepted in 2025. That
              sequence is far more concrete than many startup product roadmaps.


              Yet critical subsystem detail remains absent from the open record. The retained source set does not
              disclose battery suppliers, chemistry, pack design, avionics vendors, software architecture, or redundancy
              philosophy. That means outsiders can judge milestone progression better than they can judge the deep
              engineering stack.


              Trust evidence follows the same pattern. Formal certification milestones and the 2026 CCAR-135 operating
              certificate are real strengths. Reliability statistics, incident data, and component qualification
              outcomes are not publicly visible. The result is a product-tech case that is credible on process and
              weaker on technical transparency.
