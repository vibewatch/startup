      - number: '3.2'
        title: Peer profiles and what each one means for Aerofugia
        blocks:
          - type: paragraph
            body: >-
              EHang is the most important China benchmark because it combines public-market disclosure with a visible
              operating narrative in human-carrying UAM. That does not make it a perfect like-for-like comparison—its
              autonomy-forward architecture differs from Aerofugia’s piloted AE200—but it does mean investors can use
              EHang as evidence that a Chinese company can progress faster than Western peers on domestic
              commercialization. Joby and Archer are different again: they are piloted aircraft peers with stronger
              Western investor visibility and deeper public disclosures, yet their operational center of gravity remains
              in FAA-regulated markets rather than in China.


              AutoFlight and Volant are more directly relevant on product lane because they also sit in the Chinese
              passenger-eVTOL discussion, while AeroHT is best treated as an adjacent entrant. AeroHT’s
              roadable-aircraft framing competes for policy attention, consumer imagination, and possibly some future
              budget, but it is less comparable to Aerofugia’s institutional, operator-led route to market.


              The European read-through is adverse rather than flattering. Volocopter and especially Lilium demonstrate
              that category visibility is not enough if funding, certification, and commercialization fall out of sync.
            claimRefs:
