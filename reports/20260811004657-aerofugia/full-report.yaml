      - - Order and ecosystem momentum still appears to be building into mid-2026
        - Proof that backlog quality is weak or repeat-order signals are superficial
      - - Valuation may still have room if major milestones clear soon
        - Public data showing revenue or margin is far weaker than expected
      - - 'Anti-thesis: valuation has outrun open-data economics'
