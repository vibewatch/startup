      - number: '2.4'
        title: The bottlenecks between macro TAM and investable market
        blocks:
          - type: paragraph
            body: >-
              The main reason broad market excitement must be discounted is that the bottlenecks are unusually concrete.
              Battery energy density still limits mission design, particularly for passenger aircraft trying to carry
              meaningful payload over regional routes. Infrastructure is also uneven: some cities are planning
              vertiports at scale, but the route-by-route reality depends on grid, siting, community acceptance, traffic
              management, and operating permissions. Certification, meanwhile, remains faster in China than elsewhere
              but is still expensive and sequential.


              Capital intensity compounds these bottlenecks. Even well-funded public peers such as Joby and Archer
              remain pre-profit while pushing through certification and manufacturing scale-up. Aerofugia’s own market
              position is therefore best thought of as leveraged to domestic policy and domestic route formation, not as
              a frictionless claim on the entire low-altitude economy. Export TAM should be discounted further because
              foreign certification would require separate FAA or EASA work.


              The correct investment frame is therefore narrower and more operational. The question is not whether
              China’s low-altitude economy will be large in some aggregate sense. It is whether Aerofugia can convert
              institutional orders and policy tailwinds into certified, infrastructure-supported, economically
              repeatable passenger missions before capital intensity and competitive crowding catch up with the
              narrative.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
