  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and current pricing context
        blocks:
          - type: paragraph
            body: >-
              The valuation chapter starts from a simple fact: Aerofugia has a real third-party valuation anchor but
              does not yet have public operating disclosures that would let investors precision-underwrite that anchor.
              Hurun placed the company at US$1.8 billion in June 2026, and the broader record shows why that mark
              exists. Aerofugia has meaningful product milestones, a large visible order surface, a sizable 2026
              financing round, and pre-IPO tutoring that signals management ambition. These are legitimate ingredients
              of value.


              They are not the same thing as financial visibility. Public sources still stop well before recognized
              revenue, gross margin, cash-burn, backlog-quality detail, or preference overhang. As a result, the current
              mark is better interpreted as a strategic milestone valuation than as a hard economics valuation. That
              distinction is the core reason the recommendation must remain price-sensitive.


              The right stance is therefore conditional-pass. Aerofugia looks too credible to dismiss, but too opaque to
              endorse without reservation at any price or structure.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV013
              - CV014
              - CV015
