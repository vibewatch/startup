      - number: '5.3'
        title: Industrialization, peer framing, and the practical source of differentiation
        blocks:
          - type: paragraph
            body: >-
              Aerofugia’s strongest product signal in 2025-2026 is industrialization progress. Independent outlets
              reported the rollout of the first AE200-100 production aircraft in Chengdu, while the official product
              timeline adds a first-stage verification flight by December 2025. Taken together with the
              production-certificate path, that suggests the company has moved beyond an eye-catching demonstrator and
              into the more difficult zone of design freeze, production quality, and repeatable manufacturing.


              Relative to peers, Aerofugia appears closest to the piloted passenger-eVTOL lane occupied by companies
              such as Joby and AutoFlight, while diverging from autonomy-forward or shorter-range architectures such as
              EHang, Wisk, or Volocopter. The key differentiation is therefore not a single published component
              breakthrough. It is the combination of a China-specific certification path, tangible manufacturing
              progress, and a willingness to build operating-readiness capability before full service.


              That can be a meaningful edge in China, but it is also a narrow edge. If certification slips or
              quality-system progress stalls, the current differentiation would erode quickly because much of the story
              rests on milestone velocity rather than on uniquely disclosed underlying technology.
