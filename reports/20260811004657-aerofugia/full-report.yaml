  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, substitutes, and the real Aerofugia addressable slice
        blocks:
          - type: paragraph
            body: >-
              The most common mistake in low-altitude-economy analysis is treating China’s entire drone-and-airspace
              ecosystem as if it were Aerofugia’s practical market. It is not. Research sources consistently define the
              low-altitude economy as a broad umbrella spanning civil flight activity below roughly 1,000 meters,
              sometimes extending to 3,000 meters in designated corridors, and covering drones, logistics, agriculture,
              inspection, tourism, and passenger eVTOL operations. That broad framing is useful for policy context, but
              it overstates the commercial market that matters to Aerofugia.


              Aerofugia is positioned inside the passenger-eVTOL and premium low-altitude transport slice. Official
              AE200 materials and independent coverage point to intercity transfer, airport shuttle, sightseeing, and
              emergency-rescue missions. Those use cases map to a much narrower addressable market than the total
              low-altitude economy because they exclude much of the drone-heavy activity that drives the headline
              trillion-yuan figures. In practical terms, the closest substitutes are helicopters, premium ground
              mobility, and in some corridors high-speed rail plus airport surface transport—not agricultural drones or
              powerline inspection.


              This distinction matters for underwriting. A large macro TAM can still coexist with a much smaller
              practical SAM if only a limited set of corridors have the vertiports, customer budgets, certification
              approvals, and payload economics required for passenger eVTOL. Aerofugia therefore sits in the most
              visible and symbolically attractive part of the low-altitude economy, but not the largest by near-term
              revenue.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
