      - number: '2.2'
        title: Policy architecture, scaling signals, and regional clusters
        blocks:
          - type: paragraph
            body: >-
              China’s policy backdrop for the sector is unusually strong. The low-altitude economy entered the central
              government work report in 2024 and then moved into the 15th Five-Year Plan period as a strategic emerging
              industry. The revised Civil Aviation Law that took effect in July 2026 adds a stronger regulatory
              foundation for low-altitude operations and new aircraft categories. In parallel, research and Xinhua-style
              summaries describe a standards-and-identification push intended to make operations more traceable and
              scalable. In plain language, Beijing is trying to convert a collection of pilot projects into a governable
              industrial system.


              The headline market figures show why this matters. CAAC-linked and analyst summaries cluster around a
              roughly RMB1.5 trillion market in 2025 and around RMB3.5 trillion by 2035, but those totals are driven
              heavily by drones and adjacent services. The passenger-eVTOL layer is still much smaller. Even so,
              operational metrics such as registered drone volumes, flight hours, and enterprise formation suggest that
              the supporting ecosystem is already large enough for policy to matter. The sector is not hypothetical.


              Regional clustering sharpens the story further. The Yangtze River Delta is increasingly framed as the
              manufacturing-heavy hub, the Greater Bay Area as the deployment-and-infrastructure leader, and the
              Sichuan-Chongqing region as the mountainous and regional-connectivity cluster. Aerofugia’s Chengdu base
              gives it a home-field advantage inside one of the few named regional clusters rather than outside the
              policy map.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM023
              - CM024
              - CM025
              - CM029
          - type: table
