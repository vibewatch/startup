        title: Mitigations are visible, but the residual risk stays elevated until several dependencies clear together
        blocks:
          - type: paragraph
            body: >-
              Aerofugia does not look careless about risk. The public record shows a company that is actively building
              mitigations: certification discipline, operating-readiness experiments, battery and safety testing,
              route-validation projects, training capacity, and a multi-partner ecosystem. That is exactly what
              investors should want to see from a program at this stage.


              The problem is not absence of mitigation; it is accumulation of dependency. Too many critical variables
              still sit outside the company’s direct control or lack open-data verification. That is why clear kill
              criteria matter. A material slip in the TC timetable, a visible safety or quality-system failure, or
              evidence that named customers are not converting into deposits and route launches would each force a sharp
              downgrade in conviction. Softer warning signals—such as endless pilot-route experiments without
              scale—should also be monitored closely.


              The final risk verdict is therefore elevated but not disqualifying. Aerofugia is a high-potential program
              whose outcomes remain highly contingent on synchronized execution across certification, safety,
              infrastructure, counterparties, and capital.
