chapter:
  number: 5
  title: Product & Technology
  summary: Aerofugia’s AE200 program is a credible, advancing passenger-eVTOL effort defined by visible certification and
    industrialization milestones rather than by public subsystem disclosure. The open-data strength is milestone progression
    and China-specific operating-readiness work; the open-data weakness is missing detail on batteries, avionics, redundancy,
    quality metrics, and supplier concentration.
sections:
- id: product-definition-and-workflow
  title: What Aerofugia is actually delivering in customer workflow terms
  body: |-
    Aerofugia’s product is not best understood as a generic “flying car.” The public record instead supports a specific description: a pure-electric, piloted passenger eVTOL family under the AE200 label, with AE200-100 as the lead variant being pushed through certification. Official materials position the aircraft for low-altitude passenger transfer, tourism, and medical-rescue use cases, which means the real workflow is institutional and route-based rather than consumer-retail. Operators must identify a route, prepare a compliant operating model, adapt supporting infrastructure, and then absorb aircraft delivery and support requirements.

    This workflow framing matters because it clarifies what the product really includes. Aerofugia is implicitly selling more than an aircraft shell. It is also building an operating-readiness pathway through scenario validation, route adaptation, and future service enablement. The CCAR-135 operating certificate is part of that logic: management is trying to learn the operational side of low-altitude mobility before AE200 enters full service.

    The product therefore has two layers. One is the aircraft family itself, centered on a 3-6 seat, up-to-200-kilometer, 230-km/h envelope. The other is the implementation layer that helps customers convert aircraft capability into an actual route or service.
