  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入面，以及公开市场进入证据如何转化为钱
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Aerofugia 更适合被理解为一家商业化前期飞机
              OEM，围绕硬件核心搭建若干未来收入面。最清晰的一面是向机构客户直接销售飞机，因为公司的公开牵引始终通过订单、运营商关系和航线使用场景来描述。但保留来源也暗示了更宽的商业化栈。租赁和交易服务伙伴关系指向融资赋能销售，公司自己的用例页面则暗示，未来围绕已部署机队会有支持、培训和运营赋能收入。


              这一点重要，因为 Aerofugia
              卖的不是消费电子玩具。它试图把安全关键飞机放进企业或公共服务场景，而这些场景需要融资、航线规划、培训、支持和持续运营信任。这意味着，收入模型随着时间推移可能比单一飞机交付项目更分散。问题是，这些次级收入面没有一个被公开量化。


              因此，当前财务故事由管线牵引：外部观察者能看到合同动能和生态形成，但看不到确认收入或已实现毛利。除非交付、定金和支持收入被披露，最诚实的描述就是：Aerofugia
              有多条合理变现路径，但只有一个清晰可见的商业证明点——订单。
