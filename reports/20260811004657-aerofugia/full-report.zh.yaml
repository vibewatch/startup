chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品面与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Aerofugia 将自己定位为一家背靠 Geely、总部位于成都的低空出行公司，重点商业化纯电载人 eVTOL 飞机。公司官方中文概览不只是品牌定位：它明确把 Aerofugia 描述为 Geely
              新通航战略的载体，把飞机研发和未来商业运营放在一起。这一点重要，因为投资人投的不是一个爱好型飞机概念，也不是一层纯软件航线系统；他们投的是一个重资本航空平台，成败取决于认证、产业化和运营场景搭建。


              产品面仍集中在一个核心系列。官方 AE200 材料描述的是 3-6 座、有人驾驶 eVTOL 系列，公布航程为 200
              公里，座舱布局灵活，目标场景覆盖客运、旅游和航空医疗任务。后续批量生产报道把最具体的近期型号收窄到 AE200-100，这是 Aerofugia
              正优先推进认证的机型。这种集中有战略一致性：一个飞机系列、一个监管机构、一个主要生产基地和一股国内政策顺风。它也意味着，后文应把 AE200 执行视为整家公司最核心的变量，而不是几项独立业务中的一个选项。


              从实体布局看，运营足迹锚定成都天府国际机场附近的未来科技城。Gasgoo 和 CnEVPost
              报道显示，总部基地计划整合研发、制造、测试和交付。公司官方材料还提到在深圳、西安和海外设有分支。因此，足迹不止一个办公地址，但成都基地才是后文应视为公司主要扩产资产的工业重心。
