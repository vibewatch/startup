      - number: '2.3'
        title: 买方、增长驱动与经济性逻辑
        blocks:
          - type: paragraph
            body: >-
              中国载人 eVTOL 的买方图谱首先是机构。Aerofugia
              的公开订单和伙伴线索更明确地指向航空公司、租赁公司、旅游运营商和应急服务平台，而不是零售消费者。这很重要，因为机构买方可以承受更长的认证周期，也可以用机队或航线分摊基础设施和利用率风险。消费者通常做不到。换句话说，最早的市场不是“人人都有飞行汽车”，而是少数资本实力强的运营商采购飞机。


              因此，最强驱动因素是政策支持、国内认证速度和机构航线形成。EHang 的进展证明，中国监管机构在分阶段路径下可以比西方同行推进得更快。Aerofugia 也声称，相比直升机拥有有意义的运营成本优势；KR-Asia
              引用管理层称，典型高端直升机的价格水平在电动化基础上可能大幅下降。如果这套成本逻辑在真实航线中跑通，公司的买方逻辑会更有说服力。


              但经济性案例仍更像方向判断，而不是已被证明的事实。没有公开来源披露 Aerofugia 的航线层面利用率假设、票价收益、维修成本或已实现利润率。市场论点可信；运营模型还没有在公开层面被承销。
