      - number: '2.4'
        title: 从宏观 TAM 到可投资市场之间的瓶颈
        blocks:
          - type: paragraph
            body: >-
              必须给广义市场热度打折，主要因为瓶颈异常具体。电池能量密度仍限制任务设计，尤其是载人飞机要在区域航线上承载有效载荷时。基础设施也不均衡：一些城市正按规模规划垂直起降点，但逐条航线落地取决于电网、选址、社区接受度、交通管理和运营许可。认证方面，中国仍快于其他地区，但依旧昂贵，而且要按顺序推进。


              资本强度会放大这些瓶颈。即便 Joby 和 Archer 这类资金充足的上市同业，在推进认证和制造扩张时仍未盈利。因此，Aerofugia
              的市场位置最好理解为受益于国内政策和国内航线形成，而不是无摩擦地占有整个低空经济。出口 TAM 还应进一步打折，因为海外认证需要另行完成 FAA 或 EASA 工作。


              正确的投资框架因此更窄、更运营化。问题不是中国低空经济在总量意义上是否会很大，而是 Aerofugia
              能否在资本强度和竞争拥挤追上叙事之前，把机构订单和政策顺风转化为已获认证、有基础设施支撑、经济上可重复的载人任务。
