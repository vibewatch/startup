  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 版图定义：直接同业、相邻玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              不应把 Aerofugia 放进单一“飞行汽车”类别里做比较。真正的竞争集合至少覆盖四组：EHang、AutoFlight、Volant 等中国直接载人 eVTOL OEM；Joby、Archer 等全球有人驾驶
              eVTOL 领导者；AeroHT 等相邻概念驱动玩家；以及直升机加高端地面交通这些现状替代品。Wisk 也重要，因为它作为架构相邻玩家，让自动驾驶问题保持存在感，即便其运营模型不同于 Aerofugia
              的有人驾驶路径。


              这个框架重要，因为不同竞争者威胁的是投资论点的不同部分。EHang 施压认证和国内商业化时间。Joby 与 Archer 在资本可得性和工程预期上给 Aerofugia 施压。AutoFlight 与
              Volant 施压中国国内产品竞争。AeroHT 更多争夺注意力和政策想象，而不是争夺完全相同的机构飞机预算。Aerofugia 公开最常描述的航线里，直升机仍是现实替代品。


              因此，好的竞争图谱必须纳入买方完成同一任务的直接和间接方式。如果航空公司、旅游运营商或公共服务平台可以等待、多供应商下注，或继续使用直升机，Aerofugia 的竞争压力就不只来自其他载人 eVTOL 品牌。
