      - number: '1.4'
        title: 认证、产业化与剩余公开缺口
        blocks:
          - type: paragraph
            body: >-
              到 2025-2026 年，Aerofugia 的公开里程碑弧线已不再停留在概念开发。官方和第三方来源显示：2022 年 TC 申请受理，2023 年认证流程启动，2024 年生产基地建设，2025 年 PC
              受理，2025 年 9 月首架 AE200-100 下线。官方展会材料随后披露 CCAR-135 运营合格证，Aerofugia 正把它用作 eVTOL
              规模部署前的运营学习路径。公司自己的表述很务实：先用直升机积累场景验证数据，再把运营系统适配到 AE200，之后扩展成更完整的低空交通网络。


              这条顺序有战略意义，因为它展示的是工业和监管雄心，而不只是产品演示。Gasgoo 和 CnEVPost 报道称，公司拥有超过 1,000 架商业订单，并在积极分配首年产能；官方材料则指向 2026-2027 年
              TC 目标。与此同时，KR-Asia 给出了最清醒的制衡意见：电池航程仍是瓶颈，海外认证仍要另走流程，大规模运营大概率晚于首个认证里程碑。这些保留意见没有否定进展，而是界定了进展的经济边界。


              因此，当前最强结论是：在中国 eVTOL 民营同组公司中，Aerofugia
              的公开档案密度已经明显高于许多同业。身份、产品、母公司支持、产业化、融资和里程碑推进都看得见。收入、利润率、现金消耗、董事会治理和真实订单质量看不见。报告后文应持续把这些缺口摆在明处。
