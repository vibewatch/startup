      - number: '6.3'
        title: 耐久性、集中度与订单背后的隐藏摩擦
        blocks:
          - type: paragraph
            body: >-
              客户章节的核心限制是耐久性。没有保留公开来源披露流失、续约、取消率、合同期限、定金转化或利用率。这意味着 Aerofugia
              的可见订单还不能被视为成熟客户组。最好的公开耐久性代理指标是复购行为，Xiaoxiang 的追加订单对此有帮助，但它仍未解决底层问题：投资人看不到决定订单是否有粘性的法律和经济条款。


              集中度风险也重要。公开牵引强，但明显集中在少数大型已公告客户和航线伙伴上。如果其中一两个锚点未能转化为认证交付或真实运营，读数会很有分量。采购摩擦进一步放大问题，因为客户需要同时解决航线、飞行员、维修、基础设施、融资和监管批准。


              简言之，今天的客户质量最好描述为有前景，但尚未被承销。伙伴展示面很宽；持久的生产客户基础仍在证明中。
