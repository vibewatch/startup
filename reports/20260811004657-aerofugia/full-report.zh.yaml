      - number: '6.4'
        title: 客户判断：实名客户展示面较强，但仍处于交付前
        blocks:
          - type: paragraph
            body: >-
              在中国民营载人 eVTOL 项目中，Aerofugia 已搭建出较强的实名客户展示面。Hualong、Sino Jet、Xiaoxiang Aviation、Sichuan Airlines 关联合作、CITIC
              COHC 和多个出租人关系组合在一起，说明公司正在吸引正确类型的交易对手。客户组合在战略上也合理：它强调运营商和航线搭建方，靠它们帮助形成商业市场，而不是等待市场自发出现。


              不过，多数证据仍停留在交付前，且偏生态导向。公司证明客户兴趣和关系深度，比证明留存、转化或已部署利用率更有说服力。这意味着客户章节支持一个方向上正面的需求论点，但不支持高置信度的收入耐久性论点。


              因此，正确结论仍是有条件的。客户形成看起来真实且在改善。客户耐久性、集中度和订单质量仍是重大尽调事项。
            claimRefs:
              - CU030
