      - number: '8.2'
        title: 可比公司框架与牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              公开可比公司能提供有用约束，但给不出一句话答案。Joby 和 Archer 是最有参考价值的全球同业，因为它们展示了公开市场如何给尚未盈利、认证压力重、资本需求大的 eVTOL 故事定价。EHang
              是最值得参考的中国相邻样本，因为它提供了本土市场和公开股权框架，尽管其偏自主飞行的架构不同于 Aerofugia
              的有人驾驶路线。合在一起，同业样本说明：投资人会为可信的品类领导者买单，但必须承受剧烈波动和持续证明。


              因此，情景思维比虚假精确更合适。牛市情景下，Aerofugia
              把认证进展、客户动能和航线集群策略转化为更强的国内领先地位，当前私募估值之上还有上行。基准情景下，公司战略地位仍强，但财务不透明，当前估值大致撑得住，却谈不上明显便宜。熊市情景下，如果订单转化或时间节奏低于预期，市场会把故事重估到更接近资本密集、收入前飞机开发。


              因此，情景表和区间图展示的是结果分布，而不是声称今天的价值可以用第一性原理干净建模。
