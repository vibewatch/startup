  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代方案与 Aerofugia 真正可触达的切片
        blocks:
          - type: paragraph
            body: >-
              低空经济分析最常见的错误，是把中国整个无人机和空域生态都当成 Aerofugia 的实际市场。事实并非如此。研究来源对低空经济的定义一贯较宽：大致覆盖 1,000 米以下的民用飞行活动，有时延伸到指定航路中的
              3,000 米，并包括无人机、物流、农业、巡检、旅游和载人 eVTOL 运营。这个大框架适合做政策背景，但会夸大与 Aerofugia 真正相关的商业市场。


              Aerofugia 位于载人 eVTOL 和高端低空交通切片中。官方 AE200
              材料和独立报道都指向城际接驳、机场摆渡、观光和应急救援任务。这些场景对应的可触达市场远窄于整个低空经济，因为它们排除了很多支撑万亿元标题数字的无人机密集型活动。落到实际替代品，最接近的是直升机、高端地面出行，以及部分走廊里的高铁加机场地面交通，而不是农业无人机或电力线巡检。


              这个区分影响承销判断。宏观 TAM 可以很大，但如果只有少数走廊具备载人 eVTOL 需要的垂直起降点、客户预算、认证批准和载荷经济性，实际 SAM 仍会小得多。因此，Aerofugia
              站在低空经济中最可见、最有象征意义的部分，但并不是近期收入最大的部分。
