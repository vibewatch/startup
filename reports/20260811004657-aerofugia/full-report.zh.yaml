      - number: '6.2'
        title: 实名客户证明，以及采用轨迹真正显示了什么
        blocks:
          - type: paragraph
            body: >-
              Aerofugia 的客户证明强于许多民营 eVTOL 同业，因为它不止停留在泛泛 logo 上。公司在多个类别拥有实名客户证据：Hualong 对早期高端航空采购的证明，Sino Jet
              对公务航空机队战略的证明，Xiaoxiang Aviation 对培训加运营深化的证明，Sichuan Airlines 通航平台对航线和基础设施合作的证明，以及 CITIC Offshore
              Helicopter 对低空出行、旅游和应急救援场景的证明。这是一组宽而且战略上连贯的证据。


              采用轨迹也可见，尽管并不完美。公开报道称，截至 2026 年初已有超过 1,000 架商业订单，2026 年 1 月又新增 300 架订单。Aerofugia 自己在 2026 年 7 月的公告中，又通过
              Xiaoxiang Aviation 追加订单给出更强复购信号，并强调上海展会上低空旅游运营商需求延续。这些都是正面指标，说明客户形成在继续，而不是停滞。


              但证明仍主要停在交付前。公开来源更能展示意向、生态形成和航线验证规划，而不是飞机已经在稳定商业服务中承载付费乘客飞行。
