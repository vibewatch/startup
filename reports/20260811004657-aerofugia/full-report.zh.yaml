      - number: '3.2'
        title: 同业画像及其对 Aerofugia 的含义
        blocks:
          - type: paragraph
            body: >-
              EHang 是最重要的中国基准，因为它把公开市场披露和载人 UAM 的可见运营叙事结合在一起。这不意味着它是完全同类可比对象——它偏自动驾驶的架构不同于 Aerofugia 的有人驾驶
              AE200——但它意味着投资人可以用 EHang 证明，中国公司在国内商业化上可能比西方同行推进更快。Joby 和 Archer
              又是另一类：它们是有人驾驶飞机同业，西方投资人可见度更高，公开披露更深，但运营重心仍在 FAA 监管市场，而不是中国。


              AutoFlight 和 Volant 在产品赛道上更直接相关，因为它们也处于中国载人 eVTOL 讨论中；AeroHT 则更适合作为相邻进入者。AeroHT
              的可上路飞机叙事会争夺政策注意力、消费者想象力，也可能争夺部分未来预算，但与 Aerofugia 面向机构、由运营商牵引的市场路径可比性较低。


              欧洲读数是反向的，而不是加分项。Volocopter，尤其是 Lilium，说明如果融资、认证和商业化失去同步，品类可见度并不够。
