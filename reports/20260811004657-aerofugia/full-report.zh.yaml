      - number: '7.3'
        title: 财务、人才与地缘政治风险重要，因为它们会放大其他所有延误
        blocks:
          - type: paragraph
            body: >-
              按中国民营 eVTOL 标准，Aerofugia 的资本可得性故事不错，但风险仍高，因为这个行业天生消耗现金。认证、生产工装、供应商资质、航线赋能和客户支持都会在持续收入到来前吞掉资金。eVTOL
              品类里的公开同业失败和公开市场波动说明，叙事强并不能让项目免疫融资压力。


              人才和顺序风险也真实存在。Aerofugia
              官方认可其研发和适航团队，是正面的文化信号；培训生态工作也是实际缓释。但这些事实同样强调，必须按顺序跑通的专业执行有多重。公司正在同时造飞机、证明适航、协调伙伴，并试图塑造运营标准。


              海外雄心再加一层。香港和更广国际触达可以分散机会，但在国内商业路径完全去风险前，也会带来额外审批、伙伴和地缘政治复杂度。
