  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与当前定价背景
        blocks:
          - type: paragraph
            body: >-
              估值章节从一个简单事实开始：Aerofugia 有真实的第三方估值锚，但公开运营披露还不足以让投资人精准承销这个锚。Hurun 在 2026 年 6 月将公司估值定为
              US$1.8B，更完整的记录也解释了这个价格从何而来。Aerofugia 拿下了有意义的产品里程碑，可见订单盘子大，2026 年融资规模不小，IPO
              前辅导也传递了管理层的资本市场野心。上述要素都是估值的正当组成。


              但价值要素不等于财务可见度。公开资料仍远未触及已确认收入、毛利率、现金消耗、订单质量细节和优先权负担。因此，当前估值更适合理解为战略里程碑估值，而不是硬经济账估值。两者的区别，是建议必须保持价格敏感的核心原因。


              因此，合适立场是有条件通过。Aerofugia 可信到不能一笔勾销，但透明度又低到不能在任何价格或结构下无保留背书。
