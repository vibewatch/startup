      - number: '1.3'
        title: 融资、估值与早期商业证明
        blocks:
          - type: paragraph
            body: >-
              Aerofugia 的公开融资故事在 2026 年明显变清晰。CnEVPost 和 EVMagz 均报道称，公司在 2026 年 2 月完成近 RMB1 billion 融资，一个月后进入科创板 IPO
              辅导。报道所述资金用途偏运营，不是包装叙事：型号认证、总部建设和商业低空部署。对 eVTOL 开发商而言，这个顺序合理。资本募集的依据是制造就绪度和认证推进，而不是单纯扩张故事。


              最好的第三方估值锚点是 Hurun Global Unicorn Index 2026，其中 Aerofugia 估值为 US$1.8 billion，并与 Volant、Tengden、AVIC、XAG
              等低空经济独角兽并列。这有用，但不是定论。Hurun 证明 Aerofugia 已进入独角兽层级，且位于中国民营低空生态上沿，但没有披露定价机制、清算优先权，也没有说明 2026 年 2
              月这一轮是否完全对应榜单估值。因此，估值应被视为可信的外部标记，而不是轮次文件的替代品。


              商业证明可见，但颗粒度仍偏粗。公开订单和伙伴证据包括 Hualong 100 架协议、Sichuan Airlines 生态合作、Chuanfa Leasing 200 架意向订单，以及 CITIC
              Offshore Helicopter 场景开发。它们是有意义的证明点，因为覆盖航空公司、租赁、公务航空、旅游和救援场景。但公开来源仍把确定订单、意向订单、伙伴关系和场景 MOU
              混在一起。这个组合足以支撑公司概览章节；若要判断订单质量，还不足以承销。
