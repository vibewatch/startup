  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户工作流看，Aerofugia 实际交付的是什么
        blocks:
          - type: paragraph
            body: >-
              Aerofugia 的产品不应被理解成泛泛的“飞行汽车”。公开记录更支持一个具体描述：AE200 标签下的纯电、有人驾驶载人 eVTOL 系列，其中 AE200-100
              是正在推进认证的主导型号。官方材料将飞机定位于低空客运接驳、旅游和医疗救援场景，这意味着真实工作流是机构化、按航线组织，而不是面向消费者零售。运营商必须识别一条航线，准备合规运营模型，适配配套基础设施，再承接飞机交付和支持要求。


              这个工作流框架重要，因为它说明产品真正包含什么。Aerofugia 隐含卖的不只是飞机外壳。它也在通过场景验证、航线适配和未来服务赋能，搭建一条运营就绪路径。CCAR-135
              运营合格证属于这个逻辑的一部分：管理层试图在 AE200 全面投入服务前，先学会低空出行的运营侧。


              因此，产品有两层。一层是飞机系列本身，以 3-6 座、最高 200 公里航程、230 km/h 包线为中心。另一层是落地层，帮助客户把飞机能力转化为实际航线或服务。
