      - number: '4.4'
        title: 财务判断：入口有吸引力，透明度弱
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Aerofugia 目前更像一个重资本、商业化前期的飞机项目，具备有前景的渠道形成，而不是一个已证明收入的交通业务。正面案例很直接：Geely
              关联背书、独角兽级估值支持、机构订单和多个融资伙伴，都说明公司在推进认证和产业化时，有能力继续吸引资本和商业注意力。如果这些要素成功合在一起，Aerofugia 可能比联系更弱的国内对手扩张更快。


              负面案例同样直接。公开证据止步于决定价值的关键变量之前：确认收入、真实价格、毛利、烧钱、跑道、债务和营运资本需求。行业历史也提醒谨慎。披露更强的 eVTOL 领导者仍未盈利，Lilium
              等较弱同业则展示了时间表滑坡时资本故事恶化的速度。


              因此，正确结论仍是有条件的。资本可得性方向上偏正面，但透明度差到足以让财务信心在管理层向尽调开放单位经济性和流动性栈之前保持低位。
