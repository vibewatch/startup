      - number: '4.3'
        title: 资本强度、融资充足性，以及 2026 年融资真正改变了什么
        blocks:
          - type: paragraph
            body: >-
              2026 年初报道的近 RMB1 billion 融资，显著改善了 Aerofugia 的资本可得性故事，但没有解决资本充足性问题。披露用途——型号认证、成都总部 /
              基地建设和商业化搭建——正是那些在有意义收入到来前最会吞现金的类别。生产基地开工和原型生产公告进一步说明，现金需求并不局限于纸面工程；实体产能正在建设。


              融资和租赁伙伴关系在战略上有帮助，因为它们可能降低获客摩擦，并提升下游飞机可负担性。但这些协议不能替代现金余额披露。结构化融资可以加速需求转化，但如果底层航线不经济，也可能制造订单质量的错觉。


              公开可比公司强化了这一点。Joby、Archer 和 EHang 的财务透明度远高于
              Aerofugia，但它们主要展示的是，即便披露更充分的同业，商业化依然昂贵。资本可得是正面因素。缺少跑道披露仍是承销中的重大红旗。
