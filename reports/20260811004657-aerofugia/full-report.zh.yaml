      - number: '3.3'
        title: 商业模型、定价不透明与护城河的真实来源
        blocks:
          - type: paragraph
            body: >-
              整个同业集合的公开价格可比性都很弱。Aerofugia、EHang、Joby、Archer、AutoFlight、Volant 和 AeroHT
              都披露了足以支持战略比较的信息，但不足以干净地比较真实成交飞机价格或服务经济性。因此，更有用的比较镜头是买方类型和合同模型：谁在签约、用什么结构签，以及多大概率转化为交付飞机和运营航线。


              通过这个镜头看，Aerofugia 明显偏机构。它的订单叙事强调航空公司、租赁平台和运营商；2026 年 1 月报道又在 IPO 前报告已引用的大订单基础上，新增了 300
              架已报道订单。这在战略上是正面的，因为机构渠道最终可以强化融资、维修和航线形成。但这不等同于持久护城河。在这个市场阶段，客户仍可以在多个 OEM 间下注，并在认证和基础设施真正就绪前保留选择权。


              因此，该行业最可能的护城河不是软件锁定或单纯品牌，而是里程碑时间、分销深度、融资支持、供应可得性，以及把渠道公告转化成可重复航线部署的能力。
