      - number: '3.4'
        title: 护城河耐久性、反向证据与最终竞争判断
        blocks:
          - type: paragraph
            body: >-
              Aerofugia 足以留在中国第一波载人 eVTOL 讨论中，但还不足以声称明显的品类领导地位。Geely
              背书、国内生产基地和可见机构牵引都是有意义的正面因素。不过，这些优势所处的行业里，多家同业也资金充足、享受政策支持，并且愿意在大规模交付被证明之前宣布庞大订单。因此，护城河耐久性仍是中等，而非高。


              更广行业的反向证据很重要。Lilium 的困境表明，可见度和技术雄心并不保证偿付能力。CNBC 关于美国首批投放法律冲突和延误的报道显示，即便资本最充足的上市公司也仍暴露在执行风险下。给 Aerofugia
              的教训不是这个行业已经坏掉，而是这个行业仍然脆弱：订单宣称、估值信号和伙伴关系只有转化成已认证飞机、运营航线和可重复经济性，才真正有意义。


              因此，最终判断是有条件的。如果国内监管和基础设施栈继续快速推进，Aerofugia 仍可在中国市场跑赢资本更强的海外同业；但如果 EHang、AutoFlight 或 Volant
              率先拿出更强交付证明，它也可能很快失去相对位置。
