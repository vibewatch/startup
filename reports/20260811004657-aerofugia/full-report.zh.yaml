      - number: '1.2'
        title: 领导层、控股方控制与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Aerofugia 公开领导层信息有意义，但不完整。保留来源中最清晰的实名高管是 Guo Liang，官方公司材料和访谈将其标为 CEO 兼首席科学家。KR-Asia 还引用 Fei Lan
              为联合创始人，这很重要，因为公开档案里其他创始人细节偏薄。组合起来看，管理层叙事围绕技术领导力和母公司支持下的执行，而不是创始人明星品牌或完全透明的风险投资治理模型。


              相比之下，控制权比治理更清晰。多篇 2026 年 4 月 IPO 准备报道称，Geely Terrafugia Hubei 仍是控股股东，持股
              40.02%。这给外部读者一个具体的所有权锚点，也强化了一个战略判断：Aerofugia 并非脱离 Geely 工业与资本生态独立运转。KR-Asia 明确认为，公司是 Geely
              专门布局低空出行的载体，并从一开始就复用了汽车供应链、充电和内饰开发能力。


              缺口恰好落在后期投资判断最在意的地方。保留公开来源没有披露现任董事会名单、委员会结构、优先权堆栈或关联方治理细图。这不等于治理弱；它意味着公开投资人还无法审视。Aerofugia
              转入科创板辅导后，治理披露已经从边缘事务变成一线尽调议题。
