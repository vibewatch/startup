        - 目标窗口明显移到 2027 年之后
        - 削弱时间领先优势，拉长现金需求
        - 降低确信度并重估时点
      - - 在手订单转化乏力
        - 大额订单未能产生定金或交付排期
        - 削弱客户验证叙事
        - 加重集中度折价
      - - 流动性压力
        - 出现下轮降价融资或优先权很重的融资
        - 改变回报顺位与市场信心
        - 重估普通股上行空间
      - - 安全 / 质量问题
        - 公开可见的未解决事故或测试受挫
        - 挑战信任与航线启动时点
        - 暂停或后退一步
      - - 叙事跑在证据前面
        - IPO 故事比运营证据更快升温
        - 推高估值过高风险
        - 要求更好价格或披露
