      - number: '2.2'
        title: 政策架构、扩张信号与区域集群
        blocks:
          - type: paragraph
            body: >-
              中国给该行业的政策背景异常强。低空经济在 2024 年进入中央政府工作报告，随后在十五五期间被纳入战略性新兴产业。2026 年 7
              月生效的修订版民用航空法，为低空运营和新型航空器类别提供了更强监管基础。同时，研究和新华社式综述描述了标准与识别体系推进，目标是让运营更可追踪、更可规模化。直白地说，北京正试图把一组试点项目转化为可治理的工业体系。


              标题式市场数字说明了这件事为何重要。CAAC 关联和分析师综述集中在 2025 年约 RMB1.5 trillion、2035 年约 RMB3.5 trillion
              的市场规模附近，但这些总量很大程度由无人机和相邻服务拉动。载人 eVTOL 层仍小得多。即便如此，注册无人机数量、飞行小时和企业成立等运营指标显示，支撑生态已经大到足以让政策产生影响。这个行业并非假想。


              区域集群让故事更清晰。长三角越来越被定义为制造权重高的枢纽，大湾区是部署和基础设施领导区，成渝地区则是山地和区域连通集群。Aerofugia 的成都基地让它处在少数被点名区域集群的主场，而不是政策地图之外。
