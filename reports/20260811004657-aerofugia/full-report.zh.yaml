      - number: '8.4'
        title: 最终判断、纪律，以及会改变结论的触发因素
        blocks:
          - type: paragraph
            body: >-
              最终结论是有条件通过，信心低，估值立场谨慎。Aerofugia 值得继续研究，因为它已积累足够多的市场、产品、客户和融资证据，仍是中国载人 eVTOL
              项目里更有意思的标的之一。但要支撑一个不看价格也能背书的判断，关键证据仍然缺席。


              因此，纪律比热情更重要。推动结论上修的最好方式，是新增财务披露、订单质量细节，或拿到更好的价格 / 结构，真正留出安全边际。击穿论点最快的路径，则是认证延误、订单转化疲弱，或融资压力改变普通股回报序列。


              换句话说：Aerofugia 值得关注、尽调，甚至可能值得支持——但条款必须尊重一个事实：价值案例的大部分仍活在未来执行里，而不是已验证经济性里。
