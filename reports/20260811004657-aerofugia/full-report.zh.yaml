  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和技术风险主导论点第一层
        blocks:
          - type: paragraph
            body: >-
              Aerofugia
              最高严重度风险仍是认证时间。公司拥有真实且相对强的里程碑轨迹，但投资案例仍取决于能否把这些进展转化为最终型号认证，再转化为可部署的生产产出。修订版民用航空法改善了结构性环境，但没有减少剩余的项目特定工作。CCAR-135
              运营合格证也不能替代飞机本身在完整认证和生产质量要求下的证明。


              技术风险紧贴在这层监管风险之下。Aerofugia
              已发布异常详细的公司自述材料，涉及电池性能、热防护、坠撞载荷容忍度、风洞小时、推进冗余，以及复合材料或航电设计。这些是真实的正面信号，因为它们显示公司在用航空级系统思维思考，而不是泛泛使用初创公司话术。但它们大多仍是公司侧说法。独立验证、认证服务可靠性数据和供应商层面披露仍缺席。


              因此，正确解读应保持平衡：公司看起来技术上严肃、流程上先进，但技术成熟不等于技术风险低。
