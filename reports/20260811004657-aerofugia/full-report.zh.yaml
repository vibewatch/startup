      - number: '5.4'
        title: 产品技术判断：项目严肃，但透明度不完整
        blocks:
          - type: paragraph
            body: >-
              最可辩护的结论是，Aerofugia 拥有一个严肃、正在推进的载人 eVTOL 项目，但还没有公开透明的技术栈。公司已有足够里程碑证据证明 AE200
              是真实项目：官方规格、实名型号、过渡飞行里程碑、生产构型、生产型飞机下线，以及在认证和运营准备两条线上面向监管的进展。这些信号有意义，与市场对商业化前期项目的期待相比也算合理。


              但公开记录仍未达到深度技术尽调所需的水平。投资人还看不到组件级设计选择、可靠性分布、供应商集中度，或里程碑标题之外的独立性能验证。实践者社区信号也自然偏弱，因为这是硬件项目，不是公开软件平台。


              因此，Aerofugia 在产品技术上值得获得基于动能和严肃性的正面解读，同时应因子系统不透明和生产就绪问题未解而持续打尽调折扣。
            claimRefs:
              - CE030
              - CE031
              - CE032
              - CE035
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：谁买、谁用、谁促成购买
        blocks:
          - type: paragraph
            body: >-
              Aerofugia 的可见客户群明显是机构。保留来源指向公务航空运营商、航空公司关联运营平台、直升机和通航运营商、旅游航线伙伴，以及出租人等融资渠道。这正是现实早期 eVTOL
              客户组合应有的样子：这些组织已经理解受监管航空工作流，或有战略理由去搭建它们。没有令人信服的公开证据显示，零售消费者是 2026 年的主要客户路径。


              买方、用户、付款方的拆分也比简单飞机销售更复杂。有些情况下，运营商实际上同时是买方、用户和初始付款方。另一些情况下，运营商可能是用户，而出租人或融资平台帮助出资。因此，Aerofugia
              的客户分析不能和渠道分析分开。融资伙伴重要，因为即便它们不是最终用户，也可能扩大可部署客户池。


              最重要的含义是，Aerofugia 正在搭建网络化客户模型。它不只是卖飞机；它试图拼出一个让客户真正运营这些飞机的生态。
