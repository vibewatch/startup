      - number: '7.2'
        title: 产业化和伙伴依赖构成第二层风险
        blocks:
          - type: paragraph
            body: >-
              一个 eVTOL 项目离开纯原型阶段后，制造和生态风险会变得更重要。Aerofugia
              现在显然已进入这个区间。官方来源强调供应链大会、战略电池工作、生产许可证进展、培训计划和航线验证试点。这些项目各自都有建设性；同时也揭示商业化需要一张庞大的互锁系统网络同时运转。


              因此，伙伴依赖是核心风险。Xiaoxiang、Sichuan Airlines 关联实体和 CITIC COHC 等运营商可以通过贡献航线、维修、飞行员或运营经验，加快市场进入。Jinshi 和 Chuanfa
              等融资渠道可以降低采购摩擦。但每一种依赖也都是故障点。只要网络中的一环变慢，飞机仍可能技术上很亮眼，商业化却会滑坡。


              基础设施在这里尤其重要。Aerofugia 的旅游航线和运营手册计划是合理缓释，但也说明公司仍要逐城解决基础设施和运营模板问题，而不是接入一个已经完成的网络。
