      - number: '4.2'
        title: 定价、单位经济性与公开承销的边界
        blocks:
          - type: paragraph
            body: >-
              定价问题很直接：公开来源显示商业兴趣，却不显示商业经济性。和多数 eVTOL 同业一样，Aerofugia 在保留来源中没有公布标价、真实飞机 ASP、定金节奏或服务附加率。即便最好的方向性经济性说法——载人
              eVTOL 最终应比直升机服务便宜——也仍是管理层评论和行业叙事，而不是已披露运营结果。


              这让几乎所有决定性的单位经济变量都看不见。投资人没有飞机制造成本、推进系统成本、质保准备金、维修负担、航线利用率或实际座位收益。这些变量决定运营商能否赚到可接受的 ROI，也决定 Aerofugia
              能否赚到可接受的毛利。公开记录因此可用于搭建模型框架，却不能解出模型。


              实操上，这意味着 Aerofugia 还不能按运营效率估值。只能按选择权、技术进展和商业信号质量估值，并因经济性缺席加入很大的尽调折扣。
