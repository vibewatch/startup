      - number: '5.2'
        title: 架构、认证逻辑与公开信任证据
        blocks:
          - type: paragraph
            body: >-
              系统层面的公开架构清晰，子系统层面仍不透明。Aerofugia 公开把 AE200 系列描述为有人驾驶、纯电载人 eVTOL，座舱布局灵活，有多个任务型号。公司也披露了一条开发顺序：2021 年项目启动，2022
              年 TC 申请受理，2024 年中完成全包线倾转过渡测试，2024 年末形成生产构型，2025 年生产许可证申请获受理。这条顺序比许多初创公司产品路线图具体得多。


              但关键子系统细节仍未进入公开记录。保留来源没有披露电池供应商、化学体系、电池包设计、航电供应商、软件架构或冗余理念。这意味着外部人士更能判断里程碑推进，而难以判断深层工程栈。


              信任证据也呈现同样模式。正式认证里程碑和 2026 年 CCAR-135 运营合格证是真实优势。可靠性统计、事故数据和部件鉴定结果则没有公开可见。结果是，产品技术案例在流程上可信，在技术透明度上较弱。
