- id: certification-industrialization-and-open-gaps
  title: Certification, industrialization, and the remaining public gaps
  body: |-
    By 2025-2026, Aerofugia’s public milestone arc had moved beyond conceptual development. Official and third-party sources show TC application acceptance in 2022, certification-process launch in 2023, production-base construction in 2024, PC acceptance in 2025, and the first AE200-100 rollout in September 2025. Official exhibition materials then disclosed a CCAR-135 operating certificate, which Aerofugia is using as an operations-learning path before eVTOL deployment at scale. The company’s own framing is pragmatic: use helicopters first to accumulate scenario-validation data, then adapt operating systems to AE200, then expand into a fuller low-altitude transport network.

    This sequence is strategically important because it demonstrates industrial and regulatory ambition rather than only product demos. Gasgoo and CnEVPost report more than 1,000 commercial orders and active first-year production-slot allocation, while official materials point to a 2026-2027 TC target. At the same time, KR-Asia offers the clearest sober counterweight: battery range remains a bottleneck, foreign certifications would still be separate, and large-scale operations likely sit later than the first certification milestone. Those caveats do not negate the progress; they define its economic limits.

    Accordingly, the strongest current conclusion is that Aerofugia now has a materially denser public file than many private peers in China’s eVTOL cohort. Identity, product, parent backing, industrialization, funding, and milestone progression are all visible. Revenue, margins, cash burn, board governance, and true backlog quality are not. Those omissions should remain explicit throughout the rest of the report.
