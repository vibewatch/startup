- id: leadership-and-governance
  title: Leadership, parent control, and governance visibility
  body: |-
    Aerofugia’s public leadership surface is meaningful but incomplete. The clearest named executive in the retained source set is Guo Liang, identified in official company materials and interviews as CEO and chief scientist. KR-Asia additionally quotes Fei Lan as a co-founder, which is important because founder detail otherwise remains thin in the public file. The combination suggests a management narrative built around technical leadership and parent-backed execution rather than around a founder celebrity brand or a fully transparent venture-governance model.

    Control, by contrast, is clearer than governance. Multiple April 2026 IPO-preparation reports say Geely Terrafugia Hubei remains the controlling shareholder with a 40.02% stake. That gives outside readers a concrete ownership anchor and reinforces the strategic view that Aerofugia is not operating independently from Geely’s industrial and capital ecosystem. KR-Asia explicitly argues that the company was created as Geely’s dedicated low-altitude mobility venture and has reused automotive supply-chain, charging, and interior-development capabilities from the outset.

    What is missing is exactly what matters for late-stage underwriting. The retained public sources do not disclose a live board roster, committee structure, preference stack, or a detailed map of related-party governance. That does not mean the governance is weak; it means public investors cannot yet inspect it. Given Aerofugia’s shift into STAR Market tutoring, governance disclosure has become a first-order diligence topic rather than a peripheral housekeeping item.
