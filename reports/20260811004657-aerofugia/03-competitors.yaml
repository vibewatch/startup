  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Signed price-per-aircraft, deposit schedules, and after-sales economics for Aerofugia and most peers.
    whyItMatters: Without price transparency, competitor comparisons overstate the importance of spec sheets and understate
      commercial terms.
    diligencePath: Request customer term sheets, deposit schedules, financing assumptions, and service-contract economics.
    relatedQuestionRefs:
    - QP011
    - QP012
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: order-quality
    missingEvidence: Breakdown of firm orders versus MOUs/options across Aerofugia and peers.
    whyItMatters: Multi-homing risk makes headline backlog counts hard to compare across OEMs.
    diligencePath: Request order-book staging, cancellation rights, deposits, and delivery windows.
    relatedQuestionRefs:
