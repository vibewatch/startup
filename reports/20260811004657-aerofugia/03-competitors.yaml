- id: durability-and-verdict
  title: Moat durability, adverse evidence, and final competitive verdict
  body: |-
    Aerofugia has enough to remain part of the first-wave China passenger-eVTOL conversation, but not enough to claim obvious category leadership. Geely affiliation, a domestic production base, and visible institutional traction are meaningful positives. Yet those advantages sit in a sector where several peers are also well-funded, policy-supported, and willing to announce large order books before large-scale deliveries have been proven. That is why moat durability is still moderate rather than high.

    Adverse evidence from the broader sector is important. Lilium’s distress shows that visibility and technical ambition do not guarantee solvency. CNBC’s reporting on legal conflict and delays around U.S. launches shows that even the best-capitalized public names remain exposed to execution risk. The lesson for Aerofugia is not that the field is broken, but that the field remains fragile: order claims, valuation signals, and partnerships only matter if they convert into certified aircraft, operating routes, and repeat economics.

    The final judgment is therefore conditional. Aerofugia can still outperform better-capitalized foreign peers inside China if the domestic regulatory and infrastructure stack continues to move quickly, but it can also lose relative positioning quickly if EHang, AutoFlight, or Volant reach stronger delivery proof first.
