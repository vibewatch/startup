  title: Competitors
  summary: Aerofugia competes in a layered field that includes direct Chinese passenger-eVTOL peers, better-capitalized Western
    public developers, adjacent flying-car entrants, and helicopter substitutes. Its strongest competitive attributes are
    domestic institutional traction and Geely-linked execution capacity, but the moat remains only moderately durable because
    pricing is opaque, customers can multi-home, and several rivals could reach stronger commercialization proof first.
sections:
- id: landscape-definition
  title: 'Landscape definition: direct peers, adjacencies, and substitutes'
  body: |-
    Aerofugia should not be benchmarked against a single “flying car” category. Its real competitive set spans at least four groups: direct Chinese passenger-eVTOL OEMs such as EHang, AutoFlight, and Volant; global piloted eVTOL leaders such as Joby and Archer; adjacent concept-driven entrants such as AeroHT; and the status quo substitutes of helicopters plus premium ground transport. Wisk also matters as an architectural adjacent because it keeps the autonomy question alive, even if its operating model differs from Aerofugia’s piloted approach.

    This framing matters because different competitors threaten different parts of the thesis. EHang pressures certification and domestic-commercialization timing. Joby and Archer pressure Aerofugia on capital access and engineering expectations. AutoFlight and Volant pressure it on China domestic product competition. AeroHT competes more for attention and policy imagination than for the exact same institutional aircraft budget. Helicopters remain the practical substitute in the routes Aerofugia most often describes publicly.

    A good competitor map therefore has to include direct and indirect ways a buyer solves the same job. If an airline, tourism operator, or public-service platform can wait, multi-home, or keep using helicopters, Aerofugia’s competitive pressure is not limited to other passenger-eVTOL brands alone.
