- id: final-verdict-and-kill-triggers
  title: Final verdict, discipline, and the triggers that would move the call
  body: |-
    The final call is conditional-pass with low confidence and a cautious valuation stance. Aerofugia deserves continued work because it has accumulated enough market, product, customer, and financing proof to remain one of the more interesting China passenger-eVTOL programs. Yet the exact evidence needed to justify a price-insensitive endorsement is still missing.

    That means discipline matters more than enthusiasm. The best way to upgrade the call would be through new financial disclosure, order-quality detail, or a better price or structure that creates real margin of safety. The fastest way to break the thesis would be certification slippage, weak backlog conversion, or any financing stress that changes the common-equity return stack.

    Put differently: Aerofugia looks worthy of attention, diligence, and possibly support—but only on terms that respect how much of the value case still lives in future execution rather than in proven economics.
