- id: comparables-and-scenarios
  title: Comparable framing and bull/base/bear scenarios
  body: |-
    Public comparables provide useful discipline, but they do not provide a clean one-line answer. Joby and Archer are the most helpful global peers because they show how public markets price pre-profit, certification-heavy eVTOL stories with large capital needs. EHang is the most helpful China-adjacent signal because it offers a domestic-market and public-equity frame, though its autonomy-forward architecture differs from Aerofugia’s piloted approach. Together, these peers suggest that investors will pay for credible category leadership—but only with heavy volatility and constant proof demands.

    That means scenario thinking is more appropriate than false precision. In the bull case, Aerofugia converts certification progress, customer momentum, and route-cluster strategy into a stronger domestic lead, leaving upside above the current private mark. In the base case, the company remains strategically strong but financially opaque, making the current mark roughly supportable yet not obviously cheap. In the bear case, the market re-rates the story closer to capital-intensive pre-revenue aircraft development if conversion or timing disappoints.

    The scenario table and range chart therefore show a distribution of outcomes, not a claim that today’s value can be modeled cleanly from first principles.
