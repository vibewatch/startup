- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Certification slip
    - Target window moves materially beyond 2027
    - Weakens lead-time advantage and stretches cash needs
    - Reduce conviction and re-price timing
  - - Backlog conversion weakness
    - Major orders fail to produce deposits or delivery schedule
    - Undercuts customer-proof narrative
    - Apply heavier concentration discount
  - - Liquidity stress
    - Down-round or preference-heavy financing emerges
    - Changes return stack and market confidence
    - Reassess common-equity upside
  - - Safety / quality issue
    - Publicly visible unresolved incident or test setback
    - Challenges trust and route-launch timing
    - Pause or step back
  - - Narrative outruns proof
    - IPO story builds faster than operating proof
    - Raises overvaluation risk
    - Demand better price or disclosures
  notes: These are the events most likely to change the recommendation quickly.
