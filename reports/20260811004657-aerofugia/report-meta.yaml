companyProfile:
  summary: >-
    Aerofugia (沃飞长空, Wofei Changkong) is a Chengdu-based, Geely-affiliated low-altitude
    mobility company developing the piloted AE200 passenger eVTOL family and a surrounding
    commercialization stack spanning certification, operating validation, route templates,
    training, maintenance, and financing partnerships. Public evidence shows one of the
    stronger named-customer and partner surfaces among private China passenger-eVTOL programs,
    but the company remains financially opaque and pre-commercial.
  foundedDate: '2020-09-01'
  founders:
    - name: Guo Liang
      role: CEO and Chief Scientist
      background: Public company and media materials identify Guo Liang as Aerofugia's CEO and chief scientist.
      claimRefs: [CO008]
  foundingLocation: Chengdu, Sichuan, China
  headquarters: Chengdu, Sichuan, China
  productSummary: >-
    AE200 series pure-electric piloted passenger eVTOL platform, led by the AE200-100 launch
    variant, with use cases spanning low-altitude passenger transport, tourism, and medical rescue.
  customerFocus: >-
    Institutional operators, business-aviation platforms, airline-affiliate route partners,
    helicopter operators, tourism-route operators, and financing / leasing channels.
  businessModel: >-
    Aircraft sales plus future support, training, maintenance, route-enablement, and financing-assisted
    commercialization revenue surfaces.
  stage: late-stage private / pre-commercial
  fundingStatus: >-
    Private financing anchored by a nearly RMB1 billion 2026 round and a US$1.8 billion Hurun valuation mark,
    with pre-IPO tutoring disclosed in April 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO008, CI009, CI010, CU013, CV001]
