  topStrengths:
    - AE200 has visible certification and industrialization milestones, including TC/PC progress and operating-readiness work.
    - Aerofugia has one of the stronger named-customer and partner surfaces among private Chinese passenger-eVTOL peers.
    - China-first positioning, Geely affiliation, and a sizeable 2026 round support continued strategic relevance.
  topRisks:
    - Final type-certification timing remains the core gating risk for value realization.
    - Revenue, margin, backlog quality, and cash-runway disclosure are insufficient for conventional underwriting.
    - Customer conversion, infrastructure readiness, and partner dependence could compress the valuation if milestones slip.
  unresolvedGaps:
    - Recognized revenue, gross margin, cash burn, runway, and cap-table / preference detail.
    - Deposit quality, cancellation rights, and delivery timing behind the reported order surface.
    - Regulator-by-regulator certification confidence and any open conformity or quality-system issues.
    - IPO-readiness detail beyond tutoring disclosures and market narrative.
