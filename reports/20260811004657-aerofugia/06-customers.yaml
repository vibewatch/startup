- id: named-proof-and-adoption
  title: Named customer proof and what the adoption trajectory really shows
  body: |-
    Aerofugia’s customer proof is stronger than many private eVTOL peers because it is not limited to generic logos. The company has named-customer evidence across several categories: Hualong for early premium-aviation procurement, Sino Jet for business-aviation fleet strategy, Xiaoxiang Aviation for training-plus-operations deepening, Sichuan Airlines’ general-aviation platform for route and infrastructure cooperation, and CITIC Offshore Helicopter for low-altitude travel, tourism, and emergency-rescue scenarios. That is a wide and strategically coherent proof set.

    Adoption trajectory is also visible, though imperfectly. Public reporting cited more than 1,000 commercial orders by early 2026 and another 300 new orders in January 2026. Aerofugia’s own July 2026 announcements then added a stronger repeat-order signal with Xiaoxiang Aviation and highlighted continuing demand from low-altitude-tourism operators at the Shanghai expo. Those are all positive indicators that customer formation continued rather than stalled.

    But the proof still sits mostly before delivery. Public sources show intent, ecosystem formation, and route-validation planning much better than they show aircraft actually flying paying customers in steady-state commercial service.
