- id: customer-verdict
  title: 'Customer verdict: one of the stronger named-customer surfaces, but still pre-delivery'
  body: |-
    Aerofugia has built one of the stronger named-customer surfaces among private Chinese passenger-eVTOL programs. The combination of Hualong, Sino Jet, Xiaoxiang Aviation, Sichuan Airlines-linked cooperation, CITIC COHC, and multiple lessor relationships shows that the company is attracting attention from the right classes of counterparties. The customer mix is also strategically sensible: it emphasizes operators and route builders that can help form a commercial market rather than waiting for one to appear spontaneously.

    Still, most of the evidence remains pre-delivery and ecosystem-oriented. The company is proving customer interest and relationship depth more convincingly than it is proving retention, conversion, or deployed utilization. That means the customer chapter supports a positive directional demand thesis, but not a high-confidence revenue-durability thesis.

    The right conclusion is therefore conditional. Customer formation looks real and improving. Customer durability, concentration, and backlog quality remain major diligence items.
  claimRefs:
