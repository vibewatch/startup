chapter:
  number: 6
  title: Customers
  summary: Aerofugia’s public customer evidence is unusually rich for a private eVTOL company, spanning named operators, airline-linked
    partners, helicopter operators, tourism-route collaborators, and financing channels. The strongest positive is the breadth
    of institutional proof and repeat-order signals; the strongest negative is that almost all of it remains pre-delivery,
    with retention, conversion, and concentration still opaque.
sections:
- id: segments-and-buyer-map
  title: 'Customer segments: who buys, who uses, and who enables the purchase'
  body: |-
    Aerofugia’s visible customer base is clearly institutional. The retained source set points to business-aviation operators, airline-linked operating platforms, helicopter and general-aviation operators, tourism-route partners, and financing channels such as lessors. This is exactly what a realistic early-stage eVTOL customer mix should look like: organizations that already understand regulated aviation workflows or have a strategic reason to build them. There is no convincing public evidence that retail consumers are the main customer path in 2026.

    The buyer-user-payer split is also more complex than a simple aircraft sale. In some cases the operator is effectively the buyer, user, and initial payer. In others the operator may be the user while a lessor or financing platform helps fund the aircraft. That is why customer analysis for Aerofugia cannot be separated from channel analysis. Financing partners matter because they may widen the pool of deployable customers even if they are not the final end users.

    The most important implication is that Aerofugia is building a networked customer model. It is not only selling aircraft; it is trying to assemble the ecosystem that lets customers actually operate them.
