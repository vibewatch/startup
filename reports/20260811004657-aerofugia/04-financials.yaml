- id: pricing-unit-economics-and-gaps
  title: Pricing, unit economics, and the limits of public underwriting
  body: |-
    The pricing problem is straightforward: public sources show commercial interest without showing commercial economics. Aerofugia, like most eVTOL peers, does not publish list pricing, realized aircraft ASP, deposit schedules, or service attach rates in the retained source set. Even the best directional economics claim—that passenger eVTOL should eventually underprice helicopter service—remains management commentary and industry narrative rather than a disclosed operating result.

    That leaves nearly every decisive unit-economics variable unobserved. Investors do not have aircraft manufacturing cost, propulsion cost, warranty reserve, maintenance burden, route utilization, or actual seat yield. Those are the variables that determine whether an operator can earn acceptable ROI and whether Aerofugia can earn acceptable gross margin. The public record is therefore useful for framing the model, but not for solving it.

    In practice, this means Aerofugia cannot yet be valued on operating efficiency. It can only be valued on optionality, technical progress, and commercial signal quality, with a very large diligence discount for absent economics.
