- id: capital-intensity-and-adequacy
  title: Capital intensity, financing adequacy, and what the 2026 round really changes
  body: |-
    The nearly RMB1 billion financing round reported in early 2026 materially improves Aerofugia’s capital-access story, but it does not resolve the capital-adequacy question. The stated uses of proceeds—type certification, Chengdu headquarters/base construction, and commercialization buildout—are precisely the categories that tend to absorb cash aggressively before meaningful revenue arrives. The production-base groundbreaking and prototype-production announcements reinforce that cash demand is not limited to paper engineering; physical capacity is being built.

    Financing and leasing partnerships are strategically helpful because they may lower customer-acquisition friction and improve downstream aircraft affordability. But those agreements are not a substitute for cash-balance disclosure. Structured financing can accelerate demand conversion, yet it can also create a false sense of order quality if the underlying routes are not economic.

    Public comps reinforce the point. Joby, Archer, and EHang provide much more financial transparency than Aerofugia, but they mainly show how expensive commercialization remains even for better-disclosed peers. The existence of capital access is positive. The absence of runway disclosure is still a major red flag for underwriting.
