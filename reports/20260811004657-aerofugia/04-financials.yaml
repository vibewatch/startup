  title: Financials
  summary: Aerofugia’s public financial story is dominated by capital access and commercial signal quality rather than disclosed
    income-statement performance. The company appears to have multiple potential revenue surfaces around aircraft delivery,
    but absent revenue, margin, cash, and runway disclosure, the 2026 verdict is that access looks promising while underwriting
    confidence remains low.
sections:
- id: revenue-surfaces-and-gtm
  title: Revenue surfaces and how public GTM evidence translates into money
  body: |-
    Public evidence suggests that Aerofugia is best understood as a pre-commercial aircraft OEM building several eventual revenue surfaces around a hardware core. The clearest surface is direct aircraft sales into institutional customers, because the company’s public traction is consistently described through orders, operator relationships, and route-use scenarios. But the retained source set also implies a broader commercialization stack. Leasing and transaction-service partnerships point to financing-enabled sales, while the company’s own use-case pages suggest future support, training, and operations-enablement revenue around deployed fleets.

    This matters because Aerofugia is not selling a consumer gadget. It is trying to place safety-critical aircraft into enterprise or public-service contexts that require financing, route planning, training, support, and recurring operational trust. That means the revenue model could become more diversified over time than a single aircraft-delivery line item would suggest. The problem is that none of those secondary surfaces is publicly quantified.

    As a result, the current financial story is pipeline-led: public observers can see contracting momentum and ecosystem formation, but not recognized revenue or realized gross profit. Until deliveries, deposits, and support revenue are disclosed, the most honest description is that Aerofugia has multiple plausible monetization paths but only one clearly visible commercial proof point—orders.
