- id: financial-verdict
  title: 'Financial verdict: attractive access, weak transparency'
  body: |-
    Financially, Aerofugia currently looks like a capital-intensive pre-commercial aircraft program with promising channel formation rather than a revenue-proven transportation business. The positive case is straightforward: Geely-linked backing, unicorn-level valuation support, institutional orders, and multiple financing partners all suggest the company can keep attracting capital and commercial attention while it works through certification and industrialization. If those elements combine successfully, Aerofugia could scale faster than a less-connected domestic rival.

    The negative case is equally straightforward. Public evidence stops before the key variables that decide value: recognized revenue, realized price, gross margin, burn, runway, debt, and working-capital needs. Sector history also argues for caution. eVTOL leaders with stronger disclosure remain pre-profit, and weaker peers such as Lilium have shown how quickly the capital story can deteriorate when timelines slip.

    The correct conclusion is therefore conditional. Capital access appears directionally positive, but transparency is poor enough that financial conviction should remain low until management opens the unit-economics and liquidity stack to diligence.
