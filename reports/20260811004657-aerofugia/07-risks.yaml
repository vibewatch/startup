chapter:
  number: 7
  title: Risks
  summary: Aerofugia’s risk profile is dominated by certification timing, capital intensity, and multi-party execution dependence
    rather than by any single fatal flaw already visible in public data. The company is clearly building mitigations, but
    residual risk remains elevated because battery validation, quality systems, infrastructure, customers, and financing all
    have to clear together for the thesis to work.
sections:
- id: regulatory-and-technical
  title: Regulatory and technical risk dominate the first layer of the thesis
  body: |-
    Aerofugia’s highest-severity risk is still certification timing. The company has a real and comparatively strong milestone track, but the investment case continues to depend on converting that progress into final type certification and then into deployable production output. The revised Civil Aviation Law improves the structural environment, yet it does not reduce the remaining program-specific work. Nor does the CCAR-135 operating certificate eliminate the need to prove the aircraft itself under full certification and production-quality requirements.

    Technical risk sits immediately beneath that regulatory layer. Aerofugia has published unusually detailed company-authored material about battery performance, thermal protection, crash-load tolerance, wind-tunnel hours, propulsion redundancy, and composite or avionics design. Those are real positive signals because they show the company is thinking in aviation-grade system terms rather than in generic startup language. But they remain mostly company-side claims. Independent validation, certified-service reliability data, and supplier-level disclosure are still missing.

    The correct interpretation is therefore balanced: the company appears technically serious and procedurally advanced, yet technical maturity is not the same thing as low technical risk.
  claimRefs:
