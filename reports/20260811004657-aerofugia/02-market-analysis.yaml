  evidenceGaps:
  - type: missing-source
    severity: material
    topic: aerofugia-sam
    missingEvidence: A company-authored SAM or route-density model for the AE200 rather than broad low-altitude-economy rhetoric.
    whyItMatters: Without route-level density assumptions, investors cannot bridge national TAM narratives to Aerofugia-specific
      sales potential.
    diligencePath: Request route-priority maps, target city list, and customer-segment pipeline sizing from management.
    relatedQuestionRefs:
    - QM010
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: ticket economics
    missingEvidence: Detailed willingness-to-pay research and route-level pricing assumptions behind the helicopter discount
      narrative.
