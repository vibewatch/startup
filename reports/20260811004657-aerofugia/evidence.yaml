evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, voting-control map, preference stack, and shareholder agreement terms.
    whyItMatters: >-
      Aerofugia is entering IPO-tutoring mode, so control rights, minority protections, and related-party governance
      will materially affect underwriting.
    diligencePath: >-
      Request the latest cap table, board list, charter documents, and any shareholder or VIE-style agreements from
      management or intermediaries.
    relatedQuestionRefs:
      - QO008
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Revenue, gross margin, burn, runway, deposit-backed backlog split, and audited financial statements.
    whyItMatters: >-
      Without hard financial disclosures, public valuation and order-book evidence cannot be converted into an
      investment-grade commercialization model.
    diligencePath: Obtain audited 2024-2025 financials, 2026 management accounts, and orderbook/deposit schedules during diligence.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
