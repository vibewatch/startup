callouts:
  - calloutType: insight
    title: The Public-Private Network Effect as an Adoption Flywheel
    body: Flock's primary commercial moat is not standalone optical camera performance, but the multi-agency network topology. Because private commercial customers (HOAs, retailers, hospitals) purchase sensors that connect into the same FlockOS platform used by local police departments, each private sale effectively expands municipal police surveillance density without taxpayer capital expenditure. This alignment drives municipal agency lock-in, as switching vendors would mean disconnecting from surrounding community-funded camera feeds.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM008
  - calloutType: risk
    title: Regulatory Backlash and Municipal Contract Vulnerability
    body: While public-private camera density accelerates regional coverage, it simultaneously creates political and civil liberties friction. Contested use cases—such as warrantless cross-jurisdictional travel reconstruction, protest monitoring, and potential federal agency data sharing—have spurred organized community resistance and contract cancellations in over 30 municipalities. Even with the introduction of 7-day default retention and Evidence Mode, procurement vulnerability remains a critical ceiling on municipal SAM expansion.
    claimRefs:
      - CM007
      - CM009
      - CM010
      - CM011
