companyProfile:
  summary: >-
    Flock Safety is a late-stage private public-safety technology company that sells a bundled safety-as-a-service
    network spanning ALPR cameras, video, audio detection, investigative software, and drone-response workflows. Its
    appeal comes from a large installed base, cross-jurisdiction network effects, and heavy venture support, but
    investors still lack clear disclosure on margins, retention, and the ultimate durability of its social license.
