      - number: '3.2'
        title: 'Architectural Differentiation: Turnkey Cloud Networks vs. Open Enterprise VMS'
        blocks:
          - type: paragraph
            body: >-
              Flock's primary technical and operational advantage lies in removing installation friction while creating
              proprietary network linkages across jurisdictions. Unlike conventional license plate recognition systems
              that demand trenching for power, wired network drops, and complex systems integration, Flock's Falcon
              cameras deploy on breakaway poles with self-contained solar panels and integrated cellular modems. Once
              deployed, detections feed into the FlockOS platform, where proprietary machine-learning analytics—such as
              Vehicle Fingerprint technology—extract make, model, color, and unique vehicle attributes beyond flat
              alphanumeric plate reads. Crucially, Flock enables reciprocal camera sharing across municipal boundaries,
              allowing neighboring law enforcement agencies to track suspect vehicles across city and county lines at no
              added software cost. Conversely, enterprise competitors like Genetec prioritize system interoperability,
              hardware freedom, and on-premises data custody, appealing to buyers wary of single-vendor lock-in.
              Meanwhile, commercial physical security competitors lack public-safety dispatch integrations and
              inter-agency hotlists, relegating them to isolated perimeter deterrence.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
