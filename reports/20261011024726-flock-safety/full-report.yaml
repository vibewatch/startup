      - number: '6.4'
        title: Retention Durability, Land-and-Expand Mechanics, and Governance Concentration
        blocks:
          - type: paragraph
            body: >-
              Flock's underlying business model functions as a safety-as-a-service subscription that eliminates upfront
              municipal capital expenditure in exchange for high-margin recurring operating revenue. Under this lease
              structure, customers never own the physical roadside camera hardware; instead, Flock bundles ongoing LTE
              connectivity, cloud hosting, software feature upgrades, and routine field maintenance into the annual fee.
              If a municipal council votes against renewal, Flock de-installs and removes the equipment, leaving the
              agency with no residual surveillance assets. Account expansion follows a multi-tier land-and-expand
              trajectory: an initial deployment of 10 to 30 Falcon LPR units typically expands into citywide coverage,
              followed by software upsells including FlockOS real-time crime center software, FreeForm natural language
              search, and Condor video monitoring. High-value expansion tiers incorporate Raven gunshot audio detection
              ($12,000 to $35,000 per coverage zone) and Alpha autonomous drone-as-first-responder quadcopters.
              Nevertheless, long-term durability faces structural headwinds from municipal concentration, budget
              reallocations, and inter-agency data sharing disputes. Without audited cohort retention and renewal rates
              disaggregated between public police departments and private commercial accounts, investors cannot verify
              whether expansion revenue masks localized municipal churn.
