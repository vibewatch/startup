        title: Cloud-Edge Operating Model and Integration Platform
        blocks:
          - type: paragraph
            body: >-
              Flock Safety's technical architecture is built upon a distributed cloud-edge operating model designed for
              rapid municipal deployment without hardwired electrical or fiber-optic infrastructure. Edge camera devices
              operate autonomously on integrated solar power panels and rechargeable battery packs, transmitting
              encrypted vehicle capture payloads and audio alerts over commercial LTE cellular networks to cloud
              endpoints. In the cloud, the Flock Nova platform unifies disparate municipal data streams, ingesting
              first-party sensor feeds alongside third-party Computer-Aided Dispatch (CAD), Record Management Systems
              (RMS), and open-source intelligence into an ESRI-powered geospatial visualization map. To facilitate broad
