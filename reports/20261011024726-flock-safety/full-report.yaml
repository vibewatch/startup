  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and Constitutional Exposure
        blocks:
          - type: paragraph
            body: >-
              Flock Safety operates in an increasingly hostile legal and regulatory environment as courts and
              legislatures re-evaluate the constitutional boundaries of pervasive vehicular surveillance. The company is
              defending against class action lawsuits in California, Virginia, and Georgia alleging that mass camera
              networks systematically track travel patterns and share vehicle movements across state lines in violation
              of state privacy laws and constitutional guarantees. In California, plaintiffs allege violations of Civil
              Code section 1798.90.55 following state-level scrutiny over out-of-state and federal data sharing.
              Compounding judicial risks, the United States Senate Judiciary Subcommittee on Crime and Counterterrorism
              opened a formal investigation in August 2026, demanding comprehensive audit logs and error documentation
              regarding false stolen-vehicle alerts and wrongful detentions. Furthermore, Washington State enacted
              Senate Bill 6002 in March 2026, establishing strict statutory bounds on automated license plate reader
              data retention and transfers. If federal courts extend Fourth Amendment warrant requirements to long-term
              vehicular pattern matching or if additional states ban cross-border hotlist queries, Flock's primary
              competitive advantage—its interconnected 49-state agency sharing network—could be legally dismantled.
            claimRefs:
