  - id: FV001
    title: Recommendation logic flow
    type: flow
    summary: >-
      Sequential decision framework connecting operational scale, margin opacity, Fourth Amendment legal risks, and
      valuation multiples to the Track stance.
    data:
      nodes:
        - id: scale-and-market
          label: 1. Operational Scale & Market Dominance
          detail: Over 5,000 communities and 4,800 law enforcement agencies deployed across 49 states with $300M+ ARR.
        - id: hardware-margin
          label: 2. Gross Margin & Capital Intensity Uncertainty
          detail: Blended hardware-as-a-service model, drone manufacturing facility, and lack of line-item gross margins.
        - id: governance-risks
          label: 3. Fourth Amendment & Governance Overhang
          detail: Norfolk ruling on warrant requirements, high audit record fees ($500K/month), and council pushback.
        - id: valuation-discipline
          label: 4. Stretched Valuation Multiple
          detail: 27.5x ARR on private marks ($8.25B-$8.4B vs $300M ARR) leaves zero margin of safety against public comps.
        - id: downside-triggers
          label: 5. Downside & Procurement Shock Scenarios
          detail: Procurement pauses, state DOT permitting enforcement, and potential down-round or flat IPO risk.
        - id: recommendation-track
          label: '6. Final Stance: TRACK (Wait for Margin Clarity & Downside Reset)'
          detail: >-
            Maintain disciplined Track recommendation until gross margin disclosures and secondary entry pricing
            rationalize.
