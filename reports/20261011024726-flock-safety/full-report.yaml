      - number: '5.2'
        title: Investigative Workflows and Real-Time Crime Mitigation
        blocks:
          - type: paragraph
            body: >-
              The Flock Safety platform redefines public safety operations by shifting agency workflows from reactive
              post-incident investigation to real-time situational awareness and rapid suspect interception. When edge
              Falcon cameras detect passing vehicles, on-device and cloud optical character recognition engines ingest
              plate numbers and immediately cross-reference active national hotlists, state stolen vehicle registries,
              and Amber Alerts, broadcasting sub-second dispatch notifications to field patrol units. For incidents
              where partial or no license plate information is available, Flock FreeForm and Vehicle Signature machine
              learning algorithms allow investigators to search historical detections using natural language queries
              across vehicle make, model, color, body alterations, roof racks, and custom bumper markings. These
              investigative workflows extend beyond single police jurisdictions through an interconnected national
              network spanning more than 4,800 public safety agencies across 49 states. Channel distribution partners
              like SoftwareOne further deliver FlockOS into municipal and enterprise procurement pipelines as an
              integrated operational command suite.
