      - number: '4.2'
        title: Unit Economics, Cost Structure, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Because Flock Safety remains a private entity, audited income statements, gross margin by product line,
              and precise cost-of-goods-sold (COGS) breakdowns are completely withheld from public disclosure. Under the
              surface of pure-play software-as-a-service optics, Flock carries substantial physical operations, service
              delivery, and working capital obligations. Each deployed roadside camera requires solar panels,
              rechargeable battery packs, commercial LTE cellular data backhaul, physical roadside installation, local
              municipal permitting, and ongoing maintenance or field replacement. Public contract records from
              municipalities including Beaumont, California ($225,900 for 36 cameras over two years) and La Cañada
              Flintridge, California ($78,800 for 37 cameras in year one) illustrate that initial deployment requires
              significant field coordination and pole infrastructure. To mitigate field-service drag and expand device
              margin, Flock established a dedicated 100,000-square-foot manufacturing and assembly facility in metro
              Atlanta in 2025. While cloud software tiers and inter-agency network data queries incur minimal marginal
