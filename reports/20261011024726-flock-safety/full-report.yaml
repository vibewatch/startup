            body: >-
              Disclosed public agency contracts reveal consistent pricing mechanics and operational tradeoffs across
              diverse municipal environments. Standard commercial terms list the core Falcon license plate recognition
              camera at $2,500 to $3,000 per unit per year, plus an upfront installation fee of $250 to $350 per camera,
