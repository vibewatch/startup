chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Flock Safety operates legally under the registered entity name Flock Group Inc. and is headquartered in
              Atlanta, Georgia. Established as a private technology company in 2017, Flock has evolved from a
              neighborhood surveillance provider into a dominant nationwide public safety infrastructure platform. The
              company sells an integrated subscription stack known commercially as safety-as-a-service. This commercial
              model bundles purpose-built hardware, cellular connectivity, cloud hosting, software updates, and ongoing
              equipment replacement into an annual recurring fee. The flagship Falcon automated license plate
              recognition camera is typically priced between $2,500 and $3,000 per camera annually, alongside an upfront
              professional installation charge of $250 to $350. Beyond pure software licensing, municipal customer
              deployments frequently encounter unquoted local expenditure requirements, including electrical
              infrastructure drop lines, dedicated mounting poles, and municipal right-of-way permitting. Over the past
              four years, Flock has systematically expanded its core product architecture beyond roadside optical
              sensors into an interconnected ecosystem encompassing gunshot audio detection sensors under the Raven
              brand, pan-tilt-zoom video cameras under Condor, and drone-as-first-responder technology following its
              strategic acquisition of Aerodome.
            claimRefs:
              - CO001
              - CO008
              - CO010
              - CO011
              - CO013
