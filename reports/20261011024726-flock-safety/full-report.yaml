  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Modular Edge Hardware and Integrated Sensor Catalog
        blocks:
          - type: paragraph
            body: >-
              Flock Safety delivers a comprehensive, infrastructure-free hardware suite engineered to capture vehicular,
              audio, and video evidence across diverse municipal and commercial environments. The core of this physical
              capture ecosystem is the Falcon automated license plate recognition (ALPR) camera line, which includes the
              standard fixed Falcon pole camera, the short-range Falcon SR for tight municipal parking lots and campus
              choke points, the long-range Falcon LR designed for high-speed multi-lane interstate highways, and the
              Falcon Flex for tactical deployment against mobile crime patterns. In addition to vehicle identification,
              Flock incorporates the Raven acoustic sensor, introduced in 2021, which provides real-time gunshot
              detection and acoustic triangulation within ninety feet, triggering synchronized video and license plate
              capture across nearby Falcon units. To augment vehicular and acoustic surveillance, the company introduced
              Condor, an infrastructure-free video subscription service offering fixed bullet and pan-tilt-zoom (PTZ)
              optical cameras with thirty days of cloud video retention. Furthermore, following its late-2024
              acquisition of drone developer Aerodrome, Flock is developing autonomous aerial response systems to
              establish an integrated drone-as-first-responder capability.
