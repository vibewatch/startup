      - number: '1.3'
        title: Capitalization History, Private Valuations, and Stakeholder Alignment
        blocks:
          - type: paragraph
            body: >-
              Flock Safety has raised approximately $658 million in cumulative outside equity financing across multiple
              institutional rounds since its 2017 incorporation. In March 2025, the company closed a pivotal $275
              million Series H growth financing round that established a $7.5 billion post-money private valuation. This
              marquee financing round was led by Andreessen Horowitz, demonstrating sustained tier-one Silicon Valley
              conviction in municipal surveillance infrastructure. The investor syndicate exhibits exceptional depth and
              continuity, including long-term backing from Greenoaks Capital, Bedrock Capital, Meritech Capital, Matrix
              Partners, Sands Capital, Founders Fund, Kleiner Perkins, Tiger Global Management, and Y Combinator. By
              early 2026, indicative trading activity and capitalization updates on secondary liquidity platforms such
              as Forge Global reported a Class I private valuation benchmark of approximately $8.25 billion. While the
              high-quality cap table provides substantial capital reserves and strategic runway, late-stage underwriting
              requires transparency into liquidation preference seniority, secondary share transactions, and syndicate
              expectations regarding public listing timing versus continued private market consolidation.
