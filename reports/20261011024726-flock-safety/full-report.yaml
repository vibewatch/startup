        title: Customer Base Segmentation and Multi-Buyer Architecture
        blocks:
          - type: paragraph
            body: >-
              Flock Safety has structured its commercial go-to-market around a dual public-private buyer model that
              converts fragmented local monitoring into a unified regional intelligence network. The core public sector
              segment comprises more than 4,500 to 5,000 municipal police departments, county sheriffs, and regional law
              enforcement agencies across 49 U.S. states. These public buyers fund deployments through municipal
              operating budgets, council appropriations, and federal or state public safety grants. In parallel, Flock
              targets non-police buyers including thousands of homeowner associations (HOAs), business improvement
              districts, commercial retail centers, and school districts. Non-police buyers purchase perimeter security
              cameras to deter localized property crime, yet their hardware feeds the exact same National LPR Network
              and FlockOS investigative platform used by sworn law enforcement. Commercial enterprises—including
              shopping malls, automobile dealerships, and logistics yards—represent over 1,000 accounts seeking asset
              protection and parking lot surveillance. By enabling private entities to co-fund roadside camera
              infrastructure that feeds public police command centers, Flock lowers taxpayer acquisition resistance
              while rapidly increasing regional camera density.
