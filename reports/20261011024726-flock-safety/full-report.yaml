      - number: '1.4'
        title: Operating Scale, Platform Milestones, and Public Sector Headwinds
        blocks:
          - type: paragraph
            body: >-
              By late 2024, Flock Safety reported that it had surpassed $300 million in annual recurring revenue,
              reflecting an exceptional 70 percent year-over-year revenue expansion. The platform operating footprint
              spans more than 4,800 law enforcement agencies and thousands of private commercial and homeowners
              association clients across the United States. Flock asserts that its automated detection and investigative
              software platform has supported more than one million criminal investigations and directly assisted in
              locating thousands of missing individuals. Platform milestones reflect rapid technical maturation, moving
              from solar-powered neighborhood cameras in 2017 to integrated real-time crime center software and
              autonomous drone response units in 2024 and 2025. Concurrently, the business model confronts acute
              regulatory and operational headwinds. Civil liberties organizations, public records investigations, and
              community privacy groups have increasingly scrutinized Flock inter-agency data sharing policies, vehicle
              search audit trails, and widespread deployment of unpermitted cameras on public state highways. In several
              jurisdictions, these controversies have culminated in contract terminations, exemplified by the City of
              Lynnwood, Washington terminating its municipal camera contract in February 2026, demonstrating that
              municipal customer retention remains vulnerable to public oversight challenges.
