      - number: '8.2'
        title: Business Model, Unit Pricing, and Margin Dynamics
        blocks:
          - type: paragraph
            body: >-
              Flock Safety operates on an annual subscription lease structure termed 'safety as a service,' bundling
              hardware provisioning, cellular data transmission, cloud storage, maintenance, and software updates into a
              single annual fee. Field contracts, such as a municipal agreement with the Columbia Heights Police
              Department, demonstrate standard recurring terms of $28,500 annually for seven Falcon cameras alongside
              one-time professional implementation fees. Base camera pricing historically centered around $2,500 per
              unit annually, rising toward $3,000 per camera following an across-the-board $500 annual increase
              instituted in 2024. Despite strong subscription optics, Flock's underlying gross margin structure remains
              undisclosed and highly controversial among prospective growth equity investors. Disclosed pricing
              teardowns indicate that specialized add-ons, dedicated utility pole infrastructure, electrical
              interconnects, and extended video retention beyond 30 days significantly increase the total cost of
              municipal ownership. Furthermore, the capital demands of operating a dedicated 100,000-square-foot drone
              and hardware manufacturing facility in metro Atlanta cast doubt on whether Flock can achieve pure-software
              gross margins above 75%. If substantial hardware replacement cycles, cellular connectivity costs, and
              field servicing compress blended gross margins into the 50% to 60% range, Flock's long-term operating
              leverage will fall far short of top-tier SaaS benchmarks.
            claimRefs:
              - CV005
