      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Flock Safety was co-founded by Garrett Langley and Matt Feury, both alumni of the Georgia Institute of
              Technology. Garrett Langley serves as Chief Executive Officer and acts as the public face and primary
              strategic architect of the company, actively driving venture capital relationships, high-profile municipal
              sales engagements, and public defenses of automated surveillance utility. Matt Feury serves as the
              foundational technical lead and Chief Technology Officer, credited as a primary co-inventor alongside
              Langley on the core vehicle identification, feature extraction, and distributed network patents that
              underpin Flock intellectual property fortress. The executive leadership team has progressively expanded to
              include specialized veterans from municipal law enforcement, federal defense, and cybersecurity
              backgrounds. This broadening leadership structure is vital for navigating complex public procurement
              frameworks, maintaining compliance with CJIS standards, and securing critical operational authorizations,
              such as Flock 2026 accreditation by CISA as a CVE Numbering Authority. However, day-to-day operations have
              encountered reputational friction from community investigations revealing undisclosed field maintenance
              partnerships, such as third-party Dish Network technicians servicing roadside hardware without prior
              municipal disclosure, highlighting the need for institutional governance formalization.
            claimRefs:
