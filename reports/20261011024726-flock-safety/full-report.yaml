      - number: '5.4'
        title: Security Certifications, Audit Governance, and Civil Liberties Safeguards
        blocks:
          - type: paragraph
            body: >-
              Operating ubiquitous surveillance hardware across thousands of residential and commercial communities
              subjects Flock Safety to intense public scrutiny regarding data privacy, security, and Fourth Amendment
              civil liberties protections. In response to widespread pushback against dragnet vehicle tracking, Flock
              updated its default data retention recommendation from 30 days to 7 days, introducing Evidence Mode to
              isolate and preserve specific investigative records under cold storage only when tied to active criminal
              cases. The platform enforces enterprise-grade security controls, including mandatory multi-factor
              authentication for all agency accounts, SOC 2 Type II compliance, ISO 27001 information security
              certification, and regular independent assessments conducted by external penetration testing firm Bishop
              Fox. To prevent unauthorized officer surveillance and policy violations, Flock deployed proactive audit
              assistance tools that flag anomalous search patterns and initiate automated user lockouts. Furthermore,
              Flock introduced offense filtering controls, allowing municipalities to restrict cross-jurisdictional
              camera queries by crime category and explicitly prohibit data sharing for civil immigration enforcement.
