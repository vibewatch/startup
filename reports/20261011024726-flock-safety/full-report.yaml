      - number: '8.3'
        title: Valuation Benchmarks and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              In March and April 2026, private market share transactions and institutional secondary platforms recorded
              Flock Safety's valuation at approximately $8.25 billion to $8.4 billion, reflecting a Class I share price
              of $15.63 recorded by Forge Global. Against trailing ARR of approximately $300 million, this pricing
              establishes an implied enterprise value multiple of roughly 27.5x to 28.0x ARR. This represents an
              aggressive valuation premium compared to public market comparables in government technology,
              cybersecurity, and public safety. For context, established defense and public safety leaders such as Axon
              Enterprise trade at enterprise multiples of 14x to 18x forward revenue while demonstrating robust GAAP
              profitability and documented 60%+ gross margins. High-growth horizontal SaaS companies trade between 8x
              and 14x ARR in current market environments. Scenario modeling reveals asymmetric downside at current price
              levels. A bull scenario generating $600 million in ARR by 2027 at a 20x multiple yields a $12.0 billion
              exit, offering a modest 25% annualized return. Conversely, a base case where growth moderates to 35% and
              public markets re-rate Flock to a blended hardware-software multiple of 16x forward revenue results in an
              exit valuation of $7.0 billion to $8.5 billion—essentially flat against recent private rounds. In a bear
              scenario where procurement friction slows adoption and compresses multiples to 9x, the equity experiences
              a severe 50% drawdown to $3.5 billion.
