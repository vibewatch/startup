            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why Track is the Only Disciplined Call at 27.5x ARR
            body: >-
              Flock Safety's operational footprint across 5,000 communities is undeniably formidable, but underwriting
              an equity investment at an $8.25B to $8.4B private valuation requires either visible 80%+ software gross
              margins or a substantial valuation discount to public comps. With public markets valuing hybrid
              hardware-software defense and security platforms at 12x-18x revenue, paying 27.5x ARR into an escalating
              Fourth Amendment legal environment provides zero margin of safety.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
          - type: callout
            title: The Constitutional Overhang of Mass ALPR Networks
            body: >-
              The Norfolk Circuit Court ruling in Commonwealth v. Moore marks a pivotal shift: treating persistent,
              multi-camera ALPR location tracking as a Fourth Amendment search requiring a warrant directly threatens
              Flock's core marketing value of nationwide cross-jurisdictional searches. If appellate courts uphold
              warrant requirements for aggregated ALPR queries, the investigative utility of the network could be
              severely curtailed, slowing law enforcement renewal velocity.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV012
