company:
  name: Flock Safety
chapter:
  number: 1
  title: Company Overview
  summary: Flock Safety (Flock Group Inc.) is an Atlanta-based public safety platform that reached a $7.5 billion valuation and over $300 million in ARR in 2025 by bundling license plate recognition, audio detection, and video surveillance into an integrated subscription for more than 4,800 law enforcement agencies. Despite rapid venture-backed adoption led by Andreessen Horowitz, the company faces growing municipal pushback, unpermitted installation controversies, and opaque unit economics that require rigorous diligence.
sections:
  - id: corporate-identity-and-architecture
    title: Corporate Identity, Product Architecture, and Business Model
    tableRefs:
      - TO001
    figureRefs: []
    claimRefs:
      - CO001
      - CO008
      - CO010
      - CO011
      - CO013
    body: Flock Safety operates legally under the registered entity name Flock Group Inc. and is headquartered in Atlanta, Georgia. Established as a private technology company in 2017, Flock has evolved from a neighborhood surveillance provider into a dominant nationwide public safety infrastructure platform. The company sells an integrated subscription stack known commercially as safety-as-a-service. This commercial model bundles purpose-built hardware, cellular connectivity, cloud hosting, software updates, and ongoing equipment replacement into an annual recurring fee. The flagship Falcon automated license plate recognition camera is typically priced between $2,500 and $3,000 per camera annually, alongside an upfront professional installation charge of $250 to $350. Beyond pure software licensing, municipal customer deployments frequently encounter unquoted local expenditure requirements, including electrical infrastructure drop lines, dedicated mounting poles, and municipal right-of-way permitting. Over the past four years, Flock has systematically expanded its core product architecture beyond roadside optical sensors into an interconnected ecosystem encompassing gunshot audio detection sensors under the Raven brand, pan-tilt-zoom video cameras under Condor, and drone-as-first-responder technology following its strategic acquisition of Aerodome.
  - id: executive-leadership-and-governance
    title: Founders, Executive Leadership, and Governance Structure
    tableRefs:
      - TO002
    figureRefs: []
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO014
      - CO015
    body: Flock Safety was co-founded by Garrett Langley and Matt Feury, both alumni of the Georgia Institute of Technology. Garrett Langley serves as Chief Executive Officer and acts as the public face and primary strategic architect of the company, actively driving venture capital relationships, high-profile municipal sales engagements, and public defenses of automated surveillance utility. Matt Feury serves as the foundational technical lead and Chief Technology Officer, credited as a primary co-inventor alongside Langley on the core vehicle identification, feature extraction, and distributed network patents that underpin Flock intellectual property fortress. The executive leadership team has progressively expanded to include specialized veterans from municipal law enforcement, federal defense, and cybersecurity backgrounds. This broadening leadership structure is vital for navigating complex public procurement frameworks, maintaining compliance with CJIS standards, and securing critical operational authorizations, such as Flock 2026 accreditation by CISA as a CVE Numbering Authority. However, day-to-day operations have encountered reputational friction from community investigations revealing undisclosed field maintenance partnerships, such as third-party Dish Network technicians servicing roadside hardware without prior municipal disclosure, highlighting the need for institutional governance formalization.
  - id: capitalization-and-investor-syndicate
    title: Capitalization History, Private Valuations, and Stakeholder Alignment
    tableRefs:
      - TO003
    figureRefs: []
    claimRefs:
      - CO002
      - CO004
      - CO005
      - CO006
    body: Flock Safety has raised approximately $658 million in cumulative outside equity financing across multiple institutional rounds since its 2017 incorporation. In March 2025, the company closed a pivotal $275 million Series H growth financing round that established a $7.5 billion post-money private valuation. This marquee financing round was led by Andreessen Horowitz, demonstrating sustained tier-one Silicon Valley conviction in municipal surveillance infrastructure. The investor syndicate exhibits exceptional depth and continuity, including long-term backing from Greenoaks Capital, Bedrock Capital, Meritech Capital, Matrix Partners, Sands Capital, Founders Fund, Kleiner Perkins, Tiger Global Management, and Y Combinator. By early 2026, indicative trading activity and capitalization updates on secondary liquidity platforms such as Forge Global reported a Class I private valuation benchmark of approximately $8.25 billion. While the high-quality cap table provides substantial capital reserves and strategic runway, late-stage underwriting requires transparency into liquidation preference seniority, secondary share transactions, and syndicate expectations regarding public listing timing versus continued private market consolidation.
  - id: operating-scale-and-platform-milestones
    title: Operating Scale, Platform Milestones, and Public Sector Headwinds
    tableRefs: []
    figureRefs:
      - FO001
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO012
      - CO013
      - CO014
      - CO015
    body: By late 2024, Flock Safety reported that it had surpassed $300 million in annual recurring revenue, reflecting an exceptional 70 percent year-over-year revenue expansion. The platform operating footprint spans more than 4,800 law enforcement agencies and thousands of private commercial and homeowners association clients across the United States. Flock asserts that its automated detection and investigative software platform has supported more than one million criminal investigations and directly assisted in locating thousands of missing individuals. Platform milestones reflect rapid technical maturation, moving from solar-powered neighborhood cameras in 2017 to integrated real-time crime center software and autonomous drone response units in 2024 and 2025. Concurrently, the business model confronts acute regulatory and operational headwinds. Civil liberties organizations, public records investigations, and community privacy groups have increasingly scrutinized Flock inter-agency data sharing policies, vehicle search audit trails, and widespread deployment of unpermitted cameras on public state highways. In several jurisdictions, these controversies have culminated in contract terminations, exemplified by the City of Lynnwood, Washington terminating its municipal camera contract in February 2026, demonstrating that municipal customer retention remains vulnerable to public oversight challenges.
