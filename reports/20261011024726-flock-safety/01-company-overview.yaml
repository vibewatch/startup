callouts:
  - calloutType: insight
    title: Platform Bundling and Network Lock-In Economics
    body: Flock Safety core economic moat is rooted not simply in commodity camera hardware, but in its nationwide inter-agency network connecting over 4,800 law enforcement agencies. By selling safety as a service with inclusive cloud maintenance and automated inter-jurisdictional lead sharing, Flock creates powerful municipal switching costs. However, recurring hardware refresh obligations and unquoted municipal site preparation expenses create procurement friction that prospective investors must monitor closely.
    claimRefs:
      - CO008
      - CO010
      - CO011
  - calloutType: risk
    title: Public Sector Transparency and Subcontractor Oversight
    body: Flock Safety aggressive municipal rollouts face intensifying scrutiny over deployment practices, including unpermitted roadside camera installations and undisclosed reliance on third-party contractor networks such as Dish Network technicians. In an environment of tightening civil liberties oversight, procurement cancellations like Lynnwood highlight how trust and compliance deficits can directly impair net revenue retention.
    claimRefs:
      - CO011
      - CO012
      - CO015
