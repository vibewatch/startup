callouts:
  - calloutType: risk
    title: Constitutional and Regulatory Headwinds Threaten Network Moat
    body: 'Flock Safety''s primary commercial moat is its interconnected 49-state agency sharing network, which allows participating departments to query billions of vehicle sightings nationwide. However, this model faces existential legal challenges: active class actions in California, Virginia, and Georgia argue that warrantless cross-jurisdictional tracking violates state privacy statutes and Fourth Amendment protections. If appellate courts require individualized warrants for historical travel queries or if state laws ban out-of-state sharing, the software''s collaborative network effect will fragment.'
    claimRefs:
      - CR003
      - CR004
      - CR006
  - calloutType: insight
    title: Municipal Contract Cancellations Signal Emerging Procurement Churn
    body: While Flock reports rapid expansion across 4,800+ customer agencies, community pushback has triggered contract cancellations or non-renewals across at least 265 local government entities since early 2025. Because municipal contracts represent multi-year recurring revenue commitments, accelerating non-renewals not only degrade local camera coverage density but also threaten the high revenue growth and retention multiples needed to justify Flock's private market valuation.
    claimRefs:
      - CR005
      - CR007
      - CR014
