        - "Rapid top-line scale to $300M ARR is offset by private multiple expansion to 27.5x ARR without gross margin proof."
        - "Do not initiate a buy at the 2025-2026 headline private valuation; wait for secondary reset or margin clarity."
      - - "Confidence"
        - "Medium"
        - "High visibility into customer count (5,000+ communities) and funding ($950M+), but zero visibility into cohort retention and unit margins."
        - "Position sizing must be zero until confidential financial and churn cohorts can be underwritten."
      - - "Risk Rating"
        - "High"
        - "Active Fourth Amendment litigation (Norfolk ruling), contract pushback in Cambridge/Fort Worth, and FOIA audit fee controversies."
        - "Procurement vulnerability requires a higher equity risk premium and margin of safety."
      - - "Valuation Stance"
        - "Stretched"
        - "Implied $8.25B-$8.4B valuation requires flawless 50%+ software-like growth and 80%+ gross margin outcomes."
        - "Current entry prices price in an idealized monopolistic outcome while ignoring hardware replacement cycles and legal friction."
    notes: "Valuation stance and recommendation based on disclosed ARR, funding history, secondary pricing benchmarks, and unresolved governance risks."
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV010
  - id: TV002
    title: "Thesis / anti-thesis table"
    columns:
      - "Dimension"
      - "Thesis (Bull Argument)"
      - "Anti-Thesis (Bear Argument)"
      - "What Would Change View"
    rows:
      - - "Market & Network Effects"
        - "Defensible 49-state interconnected camera network creates irresistible cross-jurisdictional investigative value."
        - "Local communities and city councils push back on mass surveillance; network effects are fragile if key municipalities terminate."
        - "Sustained net expansion rate above 120% across police departments with zero churn from privacy pushback."
      - - "Product & Architecture"
        - "All-in-one platform bundling LPR, video, gunshot detection, and drones establishes an operating system for public safety."
        - "Bundled hardware leases increase balance sheet capital intensity, field maintenance overhead, and Section 889 compliance friction."
        - "Proof of 75%+ software-only gross margins and successful autonomous drone deployments without technician dependency."
      - - "Commercial & Pricing"
        - "Disruptive annual subscription pricing ($2,500-$3,000/camera) undercuts legacy players like Motorola Solutions."
        - "Municipal budget caps and price hike friction limit willingness to absorb add-on costs for extended retention and extra sensors."
        - "Multi-year enterprise contract commitments and accelerated non-police revenue growth (HOAs, commercial security)."
      - - "Valuation & Exit Discipline"
        - "Pre-IPO scarcity premium positions Flock as the sole pure-play modern public safety tech champion alongside Axon."
        - "At 27.5x ARR, multiple compression in public markets could result in a flat or down-round IPO."
        - "Private secondary transactions pricing the company below 15x ARR or verifiable ARR acceleration past $500M."
    notes: "Thesis and anti-thesis drivers synthesized from municipal contracts, pricing teardowns, legal rulings, and platform disclosures."
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV010
      - CV012
      - CV014
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Key Assumptions"
      - "Valuation & Return Logic"
      - "Key Downside Risks"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "ARR scales to $600M+ by 2027; gross margins proven above 70%; drone and RTCC software expansion succeed; federal adoption begins."
        - "$12.0B - $15.0B IPO valuation (20x-25x ARR); upside IRR > 25% from current private marks."
        - "Federal procurement delays, severe FAA drone restrictions, or unexpected high hardware replacement churn."
        - "Low (20%): Requires near-perfect execution and complete insulation from Fourth Amendment precedent."
      - - "Base Case"
        - "ARR grows at 30-40% toward $420M-$450M; blended gross margins settle near 60%; law enforcement core remains sticky despite municipal friction."
        - "$7.0B - $8.5B exit valuation (16x-19x ARR); flat to modest return relative to 2025 Series F / Class I price."
        - "Public market skepticism of hardware-heavy revenue mix; public comps trade below 15x forward revenue."
        - "Medium-High (55%): Most consistent with historical growth, capital requirements, and public sector adoption cycles."
      - - "Bear Case"
        - "Fourth Amendment rulings expand warrant mandates; city contract cancellations accelerate; hardware maintenance costs erode margins to 45%."
        - "$3.5B - $4.5B distressed valuation (8x-10x ARR); 45-55% capital loss from peak private round valuation."
        - "Procurement moratoriums across major progressive metros; margin collapse from drone manufacturing and field service costs."
        - "Medium (25%): Substantial risk given current constitutional litigation and aggressive municipal pushback."
      - - "Kill Criteria / Diligence Breaker"
        - "Federal court ruling declaring warrantless ALPR network aggregation unconstitutional, or discovery of sub-50% gross margins."
        - "Immediate valuation write-down; complete thesis break requiring total exit from the position."
        - "Uninsurable regulatory liability or mandatory data deletion orders crippling the nationwide network."
        - "Threshold Event: Monitored via federal appellate appeals and pre-IPO audited financials."
    notes: "Scenario valuations model forward ARR multiples against business model mix (pure software vs hardware-as-a-service)."
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV012
