evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-equity-distribution
    missingEvidence: >-
      Detailed capitalization table disclosing common versus preferred share classes, liquidation preference seniority,
      and founder voting control rights.
    whyItMatters: >-
      Without verified share-class liquidation structures from the 2025 Series H financing, investor downside risk and
      distribution priority in a sale or IPO cannot be modelled.
    diligencePath: >-
      Request amended and restated certificate of incorporation filings and investor rights agreements from management
      under confidentiality.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: operating-retention-metrics
    missingEvidence: >-
      Audited financial documentation detailing customer cohort retention, annual contract churn, and law enforcement
      net revenue retention percentages.
    whyItMatters: >-
      Topline $300 million ARR claims cannot validate sustainable SaaS unit economics without verified gross margin by
      product line and municipal renewal track records.
    diligencePath: >-
      Require audited GAAP financial statements and customer cohort renewal schedules during formal confirmatory due
      diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-enumeration
    missingEvidence: >-
      Complete executive directory detailing non-founder C-suite officers, VP of Government Affairs, and regional
      regulatory compliance leadership.
    whyItMatters: >-
      Operating a nationwide public surveillance network across 4,800+ jurisdictions creates organizational
      single-point-of-failure risks if compliance depends on a small executive cadre.
    diligencePath: Review formal organizational charts, executive employment contracts, and key-person insurance covenants.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: subcontractor-compliance-oversight
    missingEvidence: >-
      Standardized disclosure protocols and municipal approvals regarding third-party field installation and maintenance
      contractors.
    whyItMatters: >-
      Undisclosed subcontractor arrangements like third-party technician visits invite municipal audit scrutiny,
      contractual breach allegations, and procurement moratoria.
    diligencePath: Review standard municipal master services agreements and vendor subcontractor compliance warranties.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Audited net revenue retention, gross revenue retention, and annual contract renewal rates segmented by municipal
      law enforcement agencies versus private commercial clients.
    whyItMatters: >-
      Without segmented cohort renewal data, investors cannot determine whether municipal contract cancellations and
      public protests are creating material customer churn or if enterprise account expansion offsets local government
      headwinds.
    diligencePath: >-
      Request historical SaaS cohort retention curves, gross churn percentages, and net expansion rates segmented by law
      enforcement versus private enterprise customers in confidential diligence.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: >-
      Independent third-party industry sizing reports isolating the North American municipal automated license plate
      recognition subscription market from broad legacy video surveillance hardware sales.
    whyItMatters: >-
      Broad surveillance estimates conflate legacy capital equipment with recurring public-safety subscription software,
      obscuring the true serviceable addressable market ceiling.
    diligencePath: >-
      Commission specialized public sector IT research or aggregate municipal RFP budget allocations across the top 100
      U.S. metropolitan statistical areas.
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: contract-cancellations
    missingEvidence: >-
      Comprehensive nationwide municipal contract termination logs and renewal rate disclosures across public-sector
      agencies.
    whyItMatters: Determines whether privacy backlash causes material ARR churn or remains isolated to headline cancellations.
    diligencePath: >-
      Systematic public records FOIA requests across municipal council agendas and cooperative purchasing contract
      renewal filings.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited GAAP gross margin percentages, hardware bill-of-materials costs, and cellular data backhaul expenses.
    whyItMatters: >-
      Without segmented gross margins, investors cannot determine whether Flock achieves SaaS software economics or
      operates with physical infrastructure margin drag.
    diligencePath: >-
      Request audited revenue and cost-of-goods-sold statements segmented by hardware lease, cellular connectivity, and
      software subscriptions under NDA.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Net revenue retention (NRR), gross revenue retention (GRR), and logo churn curves split across municipal police
      departments versus private HOA communities.
    whyItMatters: >-
      Assessing whether high growth is driven by expansion within existing cities or masking high residential customer
      turnover is essential to underwrite LTV/CAC.
    diligencePath: Obtain historical cohort retention curves and customer renewal data by buyer segment from company management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
