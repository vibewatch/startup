            - "Investigative lead generation"
        - label: "5. Cross-Agency Expansion Loop"
          stage: "Expansion"
          description: "Success in one municipality or HOA creates network adjacency demand, prompting neighboring towns and private businesses to deploy cameras."
          touchpoints:
