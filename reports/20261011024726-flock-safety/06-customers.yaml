            - "Drone-as-First-Responder demonstration"
callouts:
  - calloutType: "insight"
    title: "Network Effect Geometry Overcomes Single-Department Budget Constraints"
    body: "Flock's primary commercial moat is not individual camera hardware but the cross-jurisdictional sharing network. When an HOA or commercial entity deploys cameras, local police departments gain free access to the resulting intelligence, creating an organic expansion loop where neighboring municipalities are compelled to subscribe to maintain cross-border investigative visibility."
    claimRefs:
      - "CU003"
      - "CU014"
  - calloutType: "risk"
    title: "Procurement Backlash and Governance Breaches Threaten Renewal Durability"
    body: "Because Flock operates on an annual lease subscription without customer hardware ownership, contract cancellations lead directly to camera removals and immediate revenue loss. High-profile contract terminations in cities like Cambridge, Massachusetts—triggered by unauthorized camera siting—demonstrate that municipal procurement friction and oversight pushback present material churn risks."
    claimRefs:
      - "CU002"
      - "CU009"
      - "CU010"
