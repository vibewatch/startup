            - "Solar and cellular activation"
            - "FlockOS credential setup"
        - label: "4. Network Integration & Case Solves"
          stage: "Operational Use"
          description: "Agency links detections to National LPR Network and hotlists, generating real-time vehicle alerts and investigative clearance evidence."
          touchpoints:
