chapter:
  number: 6
  title: "Customers"
  summary: "Flock Safety serves more than 5,000 law enforcement agencies, 6,000 communities, and over 1,000 commercial enterprises across 49 U.S. states via an annual safety-as-a-service lease model. Commercial traction relies on network effects connecting municipal police, homeowner associations, and business districts into a shared vehicle intelligence platform, though lack of cohort retention data, municipal contract cancellations, and public oversight pushback highlight concentration and governance risks."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Multi-Buyer Architecture"
    body: "Flock Safety has structured its commercial go-to-market around a dual public-private buyer model that converts fragmented local monitoring into a unified regional intelligence network. The core public sector segment comprises more than 4,500 to 5,000 municipal police departments, county sheriffs, and regional law enforcement agencies across 49 U.S. states. These public buyers fund deployments through municipal operating budgets, council appropriations, and federal or state public safety grants. In parallel, Flock targets non-police buyers including thousands of homeowner associations (HOAs), business improvement districts, commercial retail centers, and school districts. Non-police buyers purchase perimeter security cameras to deter localized property crime, yet their hardware feeds the exact same National LPR Network and FlockOS investigative platform used by sworn law enforcement. Commercial enterprises—including shopping malls, automobile dealerships, and logistics yards—represent over 1,000 accounts seeking asset protection and parking lot surveillance. By enabling private entities to co-fund roadside camera infrastructure that feeds public police command centers, Flock lowers taxpayer acquisition resistance while rapidly increasing regional camera density."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-scale"
    title: "Fleet Adoption Trajectory and Deployment Velocity"
    body: "Flock Safety's deployment velocity has scaled rapidly from neighborhood gate monitoring into critical public surveillance infrastructure. Across 49 states, the company's sensor footprint spans more than 5,000 to 6,000 distinct community networks that collectively capture and process over 20 billion vehicle scans each month. Independent community tracking registries document more than 150,000 reported Flock camera sightings nationwide, reflecting extensive penetration across high-traffic intersections, city gateways, and suburban arterials. Flock's commercial expansion is driven by clear operational utility metrics marketed directly to municipal decision-makers. Company census releases claim that Flock evidence assisted in locating over 10,000 missing persons in 2025 and contributed to clearance outcomes in one out of five resolved criminal cases within deployed jurisdictions. However, rapid network expansion has precipitated intense regulatory and privacy scrutiny regarding mass vehicular tracking. In response to municipal oversight pushback and Fourth Amendment legal challenges, Flock announced in August 2026 that it reduced its default data retention recommendation from 30 days down to 7 days for new law enforcement customers, introducing stricter audit controls and mandatory multi-factor authentication."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU012"
    tableRefs:
      - "TU002"
  - id: "named-deployments-outcomes"
    title: "Municipal Case Evidence, Production Deployments, and Contract Friction"
    body: "Disclosed public agency contracts reveal consistent pricing mechanics and operational tradeoffs across diverse municipal environments. Standard commercial terms list the core Falcon license plate recognition camera at $2,500 to $3,000 per unit per year, plus an upfront installation fee of $250 to $350 per camera, following an estimated $500 per unit price increase enacted in 2024. In Beaumont, California, the municipal council approved a $225,900 two-year contract covering 36 Falcon cameras, structuring payments as $117,900 in year one and $108,000 in year two. Similarly, the City of La Cañada Flintridge, California contracted 37 cameras for an initial annual commitment of $78,800. In Alamogordo, New Mexico, signed contract documents from June 2026 show full citywide integration into Flock's nationwide sharing network following formal budget hearings. Despite widespread municipal adoption, procurement friction and governance failures have triggered visible contract terminations. The City of Cambridge, Massachusetts terminated its Flock ALPR contract after discovering unauthorized camera installations that city officials designated as a material breach of public trust. Similar controversies over permitting in right-of-way corridors and Fourth Amendment evidentiary rulings underscore that municipal retention is highly sensitive to vendor compliance and civil liberties pushback."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-risks"
    title: "Retention Durability, Land-and-Expand Mechanics, and Governance Concentration"
    body: "Flock's underlying business model functions as a safety-as-a-service subscription that eliminates upfront municipal capital expenditure in exchange for high-margin recurring operating revenue. Under this lease structure, customers never own the physical roadside camera hardware; instead, Flock bundles ongoing LTE connectivity, cloud hosting, software feature upgrades, and routine field maintenance into the annual fee. If a municipal council votes against renewal, Flock de-installs and removes the equipment, leaving the agency with no residual surveillance assets. Account expansion follows a multi-tier land-and-expand trajectory: an initial deployment of 10 to 30 Falcon LPR units typically expands into citywide coverage, followed by software upsells including FlockOS real-time crime center software, FreeForm natural language search, and Condor video monitoring. High-value expansion tiers incorporate Raven gunshot audio detection ($12,000 to $35,000 per coverage zone) and Alpha autonomous drone-as-first-responder quadcopters. Nevertheless, long-term durability faces structural headwinds from municipal concentration, budget reallocations, and inter-agency data sharing disputes. Without audited cohort retention and renewal rates disaggregated between public police departments and private commercial accounts, investors cannot verify whether expansion revenue masks localized municipal churn."
    claimRefs:
      - "CU010"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
