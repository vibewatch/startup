            - "Business improvement district co-sponsorship"
            - "Adjacent jurisdiction network density"
        - label: "6. Multi-Sensor Platform Upsell"
          stage: "Platform Upsell"
          description: "Matured accounts expand contract scope from base Falcon ALPR to Condor video, Raven gunshot audio, Wing VMS, and Alpha DFR drones."
