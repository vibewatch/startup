callouts:
  - calloutType: risk
    title: "Network Moat Collides With Municipal Privacy Pushback"
    body: "Flock Safety's central competitive advantage—an interconnected nationwide vehicle detection database that makes individual camera subscriptions more valuable—is simultaneously its primary vulnerability. While inter-agency search capabilities create immense switching friction for police departments, that same cross-jurisdiction visibility has catalyzed council contract cancellations across more than 30 municipalities, forced a seven-day retention retreat, and invited federal scrutiny, creating an opening for localized or privacy-centric alternatives."
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP013
