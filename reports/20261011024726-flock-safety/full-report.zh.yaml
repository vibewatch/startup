      - number: '1.3'
        title: 资本化历史、私募估值与利益相关方一致性
        blocks:
          - type: paragraph
            body: >-
              自 2017 年成立以来，Flock Safety 在多轮机构融资中累计获得约 $658M 外部股权融资。2025 年 3 月，公司完成关键的 $275M Series H 成长融资，投后私募估值达到
              $7.5B。该轮融资由 Andreessen Horowitz 领投，显示一线硅谷资本持续看好市政监控基础设施。投资者联盟深度与延续性突出，包括 Greenoaks Capital、Bedrock
              Capital、Meritech Capital、Matrix Partners、Sands Capital、Founders Fund、Kleiner Perkins、Tiger Global
              Management 和 Y Combinator 的长期支持。到 2026 年初，Forge Global 等二级流动性平台的指示性交易与资本化更新显示，Class I 私募估值基准约为
              $8.25B。高质量股权结构虽然提供了充足资本储备和战略跑道，但后期投资判断仍需厘清清算优先权、二级股份交易，以及投资者对上市时点与继续留在私募市场整合的预期。
            claimRefs:
