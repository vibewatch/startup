        title: 收入模式与变现渠道
        blocks:
          - type: paragraph
            body: >-
              Flock 主要通过名为“public safety-as-a-service”的年度经常性订阅变现，把路侧传感器硬件与云分析、多机构联网结合起来。公司不把 ALPR
              摄像头作为永久资本资产出售，而是将硬件使用权与安装支持、蜂窝连接、云端视频托管、软件更新和现场维护打包出租。核心变现引擎 Falcon ALPR 每台每年收取 $2,500-$3,000，另加 $250-$350
              的前期安装费。账户扩张有三条路径：提高市政或社区摄像头密度；追加 Condor 云台摄像头（每年 $3,000-$3,750）和 Raven 枪声传感器（每年 $8,500-$35,000）等硬件；部署
              FlockOS RTCC 数据流、通过 Wing LPR 集成第三方视频管理（每年 $1,500）及 DFR 指挥流程等软件层集成。Flock 还以五至十年协议销售 Safe City
              企业套餐，按人口规模打包多产品，带来可预测的合同收入可见性，却把硬件利润率压力留到后面。
