            body: >-
              Flock 在多轮股权融资中累计获得超过 $1.17B 外部风投，既反映机构支持，也说明现金消耗较高。2025 年 3 月 Andreessen Horowitz 以 $7.5B 估值领投 $275M
              Series H 后，2026 年 3 月的二级交易和 Class I 轮将投后估值推至估计 $8.25B。公司报告称 2024 年 ARR 超过 $300M、同比增长 70%，商业规模正向 $500M ARR
              运行率迈进，覆盖 4,800 多家签约执法机构和数千个私人社区。但投资判断无法验证未来资本充足性或自由现金流盈亏平衡。现金消耗率、资产负债表现金、债务或授信约束，以及分部 NRR
