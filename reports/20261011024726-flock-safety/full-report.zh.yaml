      - number: '3.2'
        title: 架构差异：交钥匙云网络与开放式企业 VMS
        blocks:
          - type: paragraph
            body: >-
              Flock 的技术和运营优势在于减少安装摩擦，同时跨辖区建立专有网络连接。传统车牌识别系统需要挖沟铺电、布线并进行复杂系统集成；Flock Falcon
              摄像头则安装在可折断杆上，自带太阳能板和蜂窝调制解调器。部署后，检测结果进入 FlockOS，由 Vehicle Fingerprint
              等机器学习分析提取品牌、车型、颜色和独特车辆属性，不局限于车牌字符。Flock 还支持市政边界间相互共享摄像头，让邻近执法机构无需额外软件费用即可跨市、县追踪嫌疑车辆。相比之下，Genetec
              等企业竞争者强调系统互操作性、硬件自由和本地数据控制，吸引担心单一供应商锁定的买家；商业实体安防竞争者缺少公共安全调度集成和跨机构热名单，只能做孤立的周界威慑。
