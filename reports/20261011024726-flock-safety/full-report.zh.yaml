  - id: FV001
    title: 建议逻辑流程
    type: flow
    summary: 这套顺序决策框架将运营规模、利润率透明度、第四修正案法律风险和估值倍数串联起来，得出 Track 立场。
    data:
      nodes:
        - id: scale-and-market
          label: 1. 运营规模与市场主导地位
          detail: 已在 49 个州部署，覆盖 5,000 多个社区和 4,800 家执法机构，ARR 超过 $300M。
        - id: hardware-margin
          label: 2. 毛利率与资本密集度不确定性
          detail: 硬件即服务混合模式、无人机制造工厂，以及缺少按项目拆分的毛利率数据。
        - id: governance-risks
          label: 3. 第四修正案与治理压力
          detail: Norfolk 关于搜查令要求的裁决、高昂的审计记录费用（$500K/月），以及议会反弹。
        - id: valuation-discipline
          label: 4. 估值倍数过高
          detail: 私募估值按 ARR 计算为 27.5 倍（$8.25B-$8.4B，而 ARR 为 $300M），相较上市同业没有安全边际。
        - id: downside-triggers
          label: 5. 下行情景与采购冲击
          detail: 采购暂停、州 DOT 执行许可要求，以及潜在下轮融资或 IPO 平开风险。
        - id: recommendation-track
          label: 6. 最终立场：TRACK（等待利润率明朗与下行重置）
          detail: 在毛利率披露清晰、二级市场入场价格回归合理之前，维持纪律性的 Track 建议。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV012
