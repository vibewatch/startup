            body: >-
              Flock Safety 仍是私营公司，审计损益表、产品线毛利率和精确 COGS 拆分均未公开。看似纯软件订阅业务，实际上还承担大量实体运营、服务交付和营运资金义务。每台路侧摄像头都需要太阳能板、可充电电池、商业
              LTE 回传、路侧安装、市政许可以及持续维护或现场更换。Beaumont、加州的公开合同（两年 $225,900，覆盖 36 台摄像头）和 La Cañada Flintridge、加州的合同（首年
