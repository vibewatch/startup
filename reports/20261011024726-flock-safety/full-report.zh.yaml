              - CV010
              - CV012
      - number: '8.4'
        title: 法律拖累、建议与尽调路径
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 长期企业估值面临的核心威胁，是围绕大范围自动监控不断升级的法律、宪法和市政反弹。在 Commonwealth v. Moore 案中，Norfolk
              巡回法院法官作出里程碑式裁决，认定汇总 172 台 Flock ALPR
              摄像头获取的无搜查令位置数据，构成违反宪法的第四修正案搜查。若联邦上诉法院采纳这一逻辑，要求对历史出行分析取得个别搜查令，网络自动生成线索的效用将大幅下降。与此同时，未经授权安装摄像头和高昂公共记录费用引发的市政争议——例如佐治亚州
              Dunwoody 每月 $500,000 的审计日志报价——已促使 Cambridge、马萨诸塞州和 Fort Worth、得州等辖区终止合同。在非凡商业势头与严重宪法拖累、以及偏高的 27.5 倍 ARR
              倍数之间权衡后，审慎的尽调建议是 TRACK。投资者应避免按 headline 估值参与二级交易，并在投入资本前要求取得按产品线审计的毛利率、客户群留存指标，以及对上诉法院第四修正案判例走向的明确判断。
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
              - CV012
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 为何在 27.5 倍 ARR 下，TRACK 是唯一审慎选择
            body: >-
              Flock Safety 覆盖 5,000 个社区的运营版图确实强大，但若按 $8.25B 至 $8.4B 的私募估值承销股权投资，就必须看到 80%+
              的软件毛利率，或相对上市可比公司有大幅估值折价。公开市场给硬件与软件混合的国防及安全平台定价为 12 倍至 18 倍收入，在第四修正案法律风险不断升级的环境下支付 27.5 倍 ARR，几乎没有安全边际。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV010
          - type: callout
            title: 大规模 ALPR 网络的宪法风险拖累
            body: >-
              Norfolk 巡回法院在 Commonwealth v. Moore 案中的裁决标志着关键转折：若将持续、多摄像头 ALPR 位置追踪认定为需要搜查令的第四修正案搜查，就会直接威胁 Flock
              以全国跨辖区查询为核心的营销价值。若上诉法院维持汇总 ALPR 查询必须取得搜查令的要求，网络的调查效用可能受到严重限制，执法部门续约速度也会放缓。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV012
