        - label: 实体边缘感知
          detail: Falcon ALPR 摄像头（SR/LR/Flex）、Sparrow、Raven 枪声传感器及 Condor PTZ 摄像头，配备设备端太阳能和电池供电
        - label: 无线传输与摄取
          detail: 加密的商业 LTE 蜂窝上行链路，将车牌读取、音频特征和视频片段传输至云端摄取端点
        - label: 云端摄取与热名单匹配
          detail: 实时流处理在数秒内将车牌号码与 NCIC、州级被盗车辆热名单及 Amber 警报进行比对
        - label: 机器学习与属性提取
          detail: Flock FreeForm 和 Vehicle Signature 神经网络对车辆品牌、型号、颜色、改装及车队模式进行分类
        - label: FlockOS 与 Nova 集成平台
          detail: ESRI 驱动的地理空间地图界面，统一 CAD/RMS 记录、实时警报调度及多机构案件协作
        - label: 应用与治理界面
          detail: Web / 移动端 UI、零成本机构 REST API、审计辅助日志、主动锁定控制及 Evidence Mode 存储
    approximationNotes: 架构层级反映已发布的产品能力、技术集成文档及专利申请。
    claimRefs:
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 六阶段采购与扩张旅程，展示从最初的社区或市政试点采购，到全州网络共享和多传感器增购的过程。
    approximationNotes: 工作流阶段和接触点综合自市政议会文件、采购指南及公司产品文档。
    claimRefs:
      - CU013
      - CU014
    data:
      items:
        - label: 1. 问题发现与选址
          stage: 评估
          description: 社区 HOA、商业地产或警察部门识别出持续存在的财产犯罪或道路走廊盲区。
          touchpoints:
            - HOA 董事会审查
            - 警察局长犯罪简报
            - Flock 现场勘察
        - label: 2. 协作采购
          stage: 采购
          description: 买方利用采购合作组织（OMNIA Partners、TIPS）绕过单独 RFP 的阻力，锁定标准租赁费率。
          touchpoints:
            - 搭用合作合同
            - 市议会公共安全议程
            - 标准年度租赁协议
        - label: 3. 快速交钥匙部署
          stage: 安装
          description: Flock 将太阳能 Falcon LPR 设备安装在可折断杆上，通过 LTE 蜂窝网络回传，无需市政开挖。
          touchpoints:
            - 电杆与道路使用权许可
            - 太阳能与蜂窝网络激活
            - FlockOS 凭证设置
        - label: 4. 网络整合与案件侦破
          stage: 运营使用
          description: 机构将检测结果接入 National LPR Network 和热名单，生成实时车辆警报及调查结案证据。
          touchpoints:
            - 热名单配置
            - 跨机构摄像头共享
            - 调查线索生成
        - label: 5. 跨机构扩张循环
          stage: 扩张
          description: 一个市政辖区或 HOA 的成功部署催生网络邻接需求，促使邻近城镇和私营企业部署摄像头。
          touchpoints:
            - 区域警察局长转介
            - 商业改进区共同赞助
            - 邻近辖区网络密度
        - label: 6. 多传感器平台增购
          stage: 平台增购
          description: 成熟客户会扩大合同范围，从基础 Falcon ALPR 扩展到 Condor 视频、Raven 枪声音频、Wing VMS 和 Alpha DFR 无人机。
          touchpoints:
            - 实时犯罪中心捆绑方案
            - 多年期 Safe City 合同续签
            - 无人机作为第一响应者演示
