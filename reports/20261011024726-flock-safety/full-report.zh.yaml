              云软件和跨机构查询在 AWS 上的边际托管成本虽低，但硬件租赁核算、技术人员调度、运营商承诺和无人机折旧会结构性压低毛利率，使其估计处于 55%-65% 的混合水平，而非软件式 80%+。
