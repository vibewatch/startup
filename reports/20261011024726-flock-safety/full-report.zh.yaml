  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出分类
        blocks:
          - type: paragraph
            body: >-
              评估 Flock
              Safety，首先要把传统实体安防硬件采购与现代云原生公共安全监控基础设施拆开。过去，市政机构和企业把监控视为高资本开支的实体资产采购：摄像头、网络布线、数字录像机和本地服务器存储通过竞标采购，由第三方系统集成商安装，再靠临时工单维护。Flock
              Safety 反其道而行，将固定式 ALPR、云台变焦摄像头、枪声检测和无人机响应打包成统一订阅模式，称为“public safety-as-a-service”。 在这一交付结构下，Flock
              负责实体设备、蜂窝连接、云端接入和现场维护，把不可预测的资本开支转成可预测的年度运营费用。其市场不覆盖传统场所门禁、楼内 CCTV
              或警务记录管理系统（RMS），而是聚焦外部车辆追踪、自动周界监控和实时调查情报。软硬件一体化年度订阅消除了前期资本阻力，使客户从高预算大城市警局扩展至全国数千个小型市政机构、郊区业主协会和商业零售走廊。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM015
      - number: '2.2'
        title: 可服务市场规模与测算视角
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 的市场规模不能只接受一个宽泛的自上而下估算，而要从多个角度拆解。行业报告常把全球实体安防和视频监控市场估为超过 $55B，但其中大量来自商业楼宇门禁、设施 CCTV
              和工业资产监控，不能代表 Flock 的实际 TAM。在美国，市政执法科技和智慧警务支出约为 $14.5B，包括警用无线电基础设施、计算机辅助调度（CAD）和执法记录仪系统。


              如果严格限定为自动车牌识别、实时犯罪中心（RTCC）软件集成，以及公共机构和商业实体的周界安防订阅，美国 SAM 约为每年 $4.8B。该估算覆盖全国约 18,000 家执法机构的经常性订阅部署，以及约
              50,000 个高密度商业零售综合体、医疗园区和托管住宅项目。Flock 当前 ARR 超过 $300M、资本化估值为 $8.4B，已拿下 $1.2B 近期 SOM 的约 25%。未来维持高增长，取决于通过
              FlockOS 等高阶软件包和 DFR 等高价值硬件扩展平均合同金额。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM014
              - CM015
