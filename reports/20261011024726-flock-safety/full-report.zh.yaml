            body: >-
              已披露的公共机构合同显示，不同市政环境中的定价机制和运营取舍较为一致。标准商业条款规定 Falcon ALPR 每台每年 $2,500-$3,000，另收每台 $250-$350 前期安装费，2024
              年价格预计每台上涨 $500。加州 Beaumont 市议会批准一份 $225,900 的两年合同，覆盖 36 台 Falcon，第一年支付 $117,900、第二年 $108,000。加州 La Cañada
              Flintridge 市签约 37 台摄像头，首年承诺 $78,800。新墨西哥州 Alamogordo 2026 年 6 月签署的合同显示，正式预算听证后全市接入 Flock
              全国共享网络。尽管市政采用广泛，采购摩擦和治理失败仍触发合同终止。马萨诸塞州 Cambridge 市发现未经授权的摄像头安装后终止 Flock ALPR
              合同，并将其定性为对公共信任的重大违约。道路用地许可争议和第四修正案证据裁决也表明，市政留存高度依赖供应商合规和对公民自由反弹的应对。
            claimRefs:
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
