              Flock Safety 将机构工作流从事后被动调查转向实时态势感知和快速拦截嫌疑人，重新定义公共安全运营。边缘 Falcon 摄像头检测到经过车辆后，设备端和云端 OCR
              引擎读取车牌号，并立即对照全国热名单、州失窃车辆登记和 Amber Alert，在不到一秒内向巡逻单位发送调度通知。车牌信息不完整或缺失时，Flock FreeForm 和 Vehicle Signature
              机器学习算法允许调查人员用自然语言按品牌、车型、颜色、车身改装、车顶行李架和定制保险杠标记搜索历史检测记录。互联全国网络覆盖 49 个州、4,800
