      - number: '5.4'
        title: 安全认证、审计治理与公民自由保障
        blocks:
          - type: paragraph
            body: >-
              Flock 在数千个住宅和商业社区运营无处不在的监控硬件，因此受到有关数据隐私、安全和第四修正案公民自由保护的强烈审查。针对大范围车辆追踪的反弹，Flock 将默认数据留存建议从 30 天改为 7 天，并推出
              Evidence Mode：仅在记录与活跃刑事案件相关时，才将特定调查记录隔离并以冷存储保存。平台实施企业级安全控制，包括所有机构账户强制多因素认证、SOC 2 Type II 合规、ISO 27001
              信息安全认证，以及 Bishop Fox 定期开展的独立评估。为防止未经授权的警员监控和政策违规，Flock
              部署主动审计辅助工具，标记异常搜索模式并自动锁定用户；同时增加犯罪类型过滤，让市政机构限制跨辖区摄像头查询，并明确禁止为民事移民执法共享数据。
