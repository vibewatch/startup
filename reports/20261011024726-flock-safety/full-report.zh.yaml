  - id: TV002
    title: 核心论点 / 反论点表
    columns:
      - 维度
      - 核心论点（看多理由）
      - 反论点（看空理由）
      - 什么会改变观点
    rows:
      - - 市场与网络效应
        - 可防御的 49 州互联摄像头网络创造了不可抗拒的跨辖区调查价值。
        - 地方社区和市议会反对大规模监控；一旦关键市政机构终止合同，网络效应就很脆弱。
        - 警察部门的净扩张率持续高于 120%，且隐私反弹没有带来任何流失。
      - - 产品与架构
        - 将 LPR、视频、枪声探测和无人机打包成一体的平台，构成公共安全操作系统。
        - 打包硬件租赁会提高资产负债表资本强度、现场维护开销和 Section 889 合规阻力。
        - 证明软件独立毛利率达到 75%+，并在不依赖技术人员的情况下成功部署自主无人机。
      - - 商业与定价
        - 颠覆性的年度订阅定价（$2,500-$3,000/摄像头）低于 Motorola Solutions 等传统厂商。
        - 市政预算上限和涨价阻力限制了客户为延长留存期及增加传感器而承担附加成本的意愿。
        - 多年期企业合同承诺，以及非警务收入（HOA、商业安防）加速增长。
      - - 估值与退出纪律
        - IPO 前的稀缺性溢价，使 Flock 成为 Axon 之外唯一专注现代公共安全技术的冠军标的。
        - 以 ARR 的 27.5 倍计，公开市场倍数压缩可能导致 IPO 平价或下轮融资。
        - 私募二级交易将公司定价压到 ARR 的 15 倍以下，或有可验证的 ARR 加速并超过 $500M。
    notes: 核心论点和反论点驱动因素综合自市政合同、定价拆解、法律裁决及平台披露。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV010
      - CV012
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值与回报逻辑
      - 关键下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 到 2027 年 ARR 增长至 $600M+；毛利率证明高于 70%；无人机和 RTCC 软件扩张成功；联邦政府开始采用。
        - $12.0B - $15.0B IPO 估值（ARR 的 20 倍—25 倍）；相对当前私募定价的上行 IRR > 25%。
        - 联邦采购延迟、FAA 严格限制无人机，或硬件更换流失率意外走高。
        - 低（20%）：需要近乎完美的执行，且完全不受第四修正案判例影响。
      - - 基准情景
        - ARR 以 30%—40% 的速度增长至 $420M-$450M；综合毛利率稳定在约 60%；尽管市政阻力存在，执法核心业务仍具黏性。
        - $7.0B - $8.5B 退出估值（ARR 的 16 倍—19 倍）；相对于 2025 年 Series F / Class I 价格，回报持平至小幅增长。
        - 公开市场对硬件占比较高的收入组合持怀疑态度；公开可比公司交易价格低于未来收入的 15 倍。
        - 中高（55%）：与历史增长、资本需求及公共部门采用周期最为一致。
      - - 悲观情景
        - 第四修正案裁决扩大令状要求；城市合同取消加速；硬件维护成本将毛利率侵蚀至 45%。
        - $3.5B - $4.5B 困境估值（ARR 的 8 倍—10 倍）；相对私募最高轮估值损失 45%—55% 的资本。
        - 主要进步都市区普遍暂停采购；无人机制造和现场服务成本导致利润率崩塌。
        - 中（25%）：鉴于当前宪法诉讼和市政方面的强烈反弹，风险很大。
      - - 清仓标准 / 尽调阻断点
        - 联邦法院裁定无令状汇总 ALPR 网络违宪，或发现毛利率低于 50%。
        - 估值立即减记；核心论点彻底破裂，必须全部退出仓位。
        - 无法投保的监管责任，或强制删除数据的命令令全国网络陷入瘫痪。
        - 阈值事件：通过联邦上诉审理进展和 IPO 前审计财务数据持续监测。
    notes: 情景估值根据商业模式组合（纯软件与硬件即服务）对未来 ARR 倍数建模。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV010
      - CV012
