      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 平台打包与网络锁定经济学
            body: >-
              Flock Safety 的核心经济护城河不只是普通摄像头硬件，而是连接 4,800 多家执法机构的全国跨机构网络。Flock 将云维护和跨辖区线索自动共享纳入
              safety-as-a-service，显著抬高市政客户的迁移成本。但硬件持续更新义务和未报价的市政场地准备费用会拖慢采购，潜在投资者需密切关注。
