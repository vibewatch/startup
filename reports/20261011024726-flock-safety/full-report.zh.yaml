      - number: '1.2'
        title: 创始人、高管团队与治理结构
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 由 Garrett Langley 和 Matt Feury 共同创立，两人都是 Georgia Institute of Technology 校友。Garrett Langley 任
              CEO，是公司的公开代表和主要战略设计者，负责风投关系、重要市政销售以及公开捍卫自动监控的实用性。Matt Feury 任 CTO，担任技术核心负责人；他与 Langley 共同发明了支撑 Flock
              知识产权壁垒的车辆识别、特征提取和分布式网络核心专利。高管团队逐步吸纳来自市政执法、联邦防务和网络安全领域的专业人士，以应对复杂公共采购框架、维持 CJIS 合规并取得关键运营授权，例如 CISA 在 2026
              年授予 Flock CVE Numbering Authority 资质。但社区调查发现，Flock 曾未披露与第三方 Dish Network
              技术人员合作维护路侧硬件，日常运营因此遭遇声誉摩擦，也凸显制度化治理的必要性。
