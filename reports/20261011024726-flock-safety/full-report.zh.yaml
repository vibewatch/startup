      - number: '3.3'
        title: 采购经济学：订阅租赁与资本持有 TCO
        blocks:
          - type: paragraph
            body: >-
              采购结构是 Flock Safety 与传统监控供应商的主要战场。传统市政固定 ALPR 安装通常要为硬件、挖沟、布线和服务器许可支付每台 $15,000-$25,000
              的前期资本开支，之后还要承担年度维护合同。Flock 以 safety-as-a-service 租赁模式反转这一门槛，旗舰 Falcon 每台每年约 $2,500-$3,000，初始安装费仅
              $250-$350。取消前期资本拨款后，市警察局长和社区协会可以用运营预算或单一来源合同支付摄像头网络。但长期总拥有成本差异很大：客户租赁而非拥有设备，取消订阅就会拆除硬件，使买家陷入持续续费；扩展 Raven
              枪声检测或 Wing 第三方摄像头集成也会迅速推高年度支出，迫使企业重新评估资本采购方案。
            claimRefs:
