chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 的注册实体名为 Flock Group Inc.，总部位于佐治亚州亚特兰大。公司 2017 年以私营科技企业成立，已从社区监控供应商成长为全国领先的公共安全基础设施平台。Flock
              将这套整合订阅栈商业化为 safety-as-a-service，把专用硬件、蜂窝连接、云托管、软件更新和持续设备更换打包进年度经常性费用。旗舰 Falcon 自动车牌识别摄像头通常每台每年收费
              $2,500-$3,000，另收 $250-$350 的前期专业安装费。除软件许可外，市政部署还常遇到未报价的本地支出，包括电力基础设施引线、专用安装杆和市政道路用地许可。过去四年里，Flock
              持续把核心架构从路侧光学传感器扩展为互联生态，涵盖 Raven 枪声音频检测传感器、Condor 云台变焦视频摄像头，以及战略收购 Aerodome 后的无人机先行响应技术。
            claimRefs:
              - CO001
              - CO008
              - CO010
              - CO011
              - CO013
