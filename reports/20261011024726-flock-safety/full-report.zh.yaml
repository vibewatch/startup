              杆载摄像头、适用于狭窄市政停车场和校园瓶颈点的短程 Falcon SR、面向高速多车道州际公路的远程 Falcon LR，以及用于应对流动犯罪模式的战术型 Falcon Flex。除车辆识别外，Flock 还采用
              2021 年推出的 Raven 音频传感器，可在 90 英尺内实时检测枪声并进行声学三角定位，触发同步视频和车牌 采集。为补充车辆和音频监控，公司推出 Condor
