      - number: '2.4'
        title: 增长驱动、网络护城河与采用约束
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 的主要增长动力是覆盖 49 个州的平台跨辖区网络效应。传统车牌读取系统各自封闭，机构只能查询经过自有传感器的车辆；Flock
              则让参与机构跨数千个合作机构开展全国调查。其机器学习算法提取“Vehicle Fingerprint”属性，包括品牌、车型、颜色、车顶行李架和保险杠贴纸，即使车牌缺失、改动或被遮挡，侦探也能识别嫌疑车辆。


              但网络快速扩张也引发严重的公民自由反弹和监管抵制，构成 Flock
              最重要的市场天花板。公民自由组织、隐私倡导者和学生联盟指出，摄像头网络曾被用于监控抗议活动，并担心数据可能在无搜查令的情况下与联邦移民机构共享。争议已促使 30
              多个市政府和大学校园取消、重新评估或暂停部署。Flock 于 2026 年加强治理护栏：把建议默认留存期从 30 天缩短至 7 天，为活跃刑事案件推出 Evidence
              Mode，并强制多因素认证。这些让步能否缓解公众质疑或拖慢销售周期，仍是长期渗透率的关键变量。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 公私网络效应构成采用飞轮
            body: >-
              Flock 的商业护城河不在单台光学摄像头性能，而在多机构网络拓扑。私营客户（HOA、零售商、医院）购买的传感器接入当地警察使用的同一 FlockOS
              平台，因此每笔私营销售都能在不增加纳税人资本开支的情况下提升市政监控密度。供应商切换会断开周边社区资助的摄像头数据流，因而形成市政机构锁定。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM008
          - type: callout
            title: 监管反弹与市政合同脆弱性
            body: >-
              公私摄像头密度虽然加快区域覆盖，也同时制造政治和公民自由摩擦。无搜查令的跨辖区行踪重建、抗议监控以及可能与联邦机构共享数据等争议用例，已在 30 多个市政机构引发有组织的社区抵制和合同取消。即使引入 7
              天默认留存和 Evidence Mode，采购脆弱性仍是市政 SAM 扩张的关键天花板。
            calloutType: risk
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：从单点 ALPR 到公共安全操作系统
        blocks:
          - type: paragraph
            body: >-
              Flock Safety 所处竞争场景横跨多个供应商类别，而非一组同质化摄像头厂商。核心竞争者包括 Motorola Solutions，其同时提供 Vigilant ALPR、Avigilon 视频监控和
              CommandCentral 计算机辅助调度；以及 Axon Enterprise，凭借执法记录仪、数字证据管理和借助 Fusus 提供的实时运营能力占据执法市场。Genetec
              等相邻专业厂商以开放架构视频管理和 AutoVu 车牌识别软件服务于需要自主管理基础设施的企业及市政交通买家。商业和教育领域则有 Verkada 等云管理实体安防供应商争夺私营校园周界。Flock
              把车牌识别纳入统一门禁和视频监控平台，覆盖这些类别；再将专用太阳能硬件、蜂窝连接、云分析和持续维护打包为单一运营订阅，直接替代高资本开支的传统市政系统。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
