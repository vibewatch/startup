      - number: '2.3'
        title: 买家分层与采购动态
        blocks:
          - type: paragraph
            body: >-
              Flock Safety
              面向两类购买逻辑、采购速度和预算归属截然不同的客户：公共部门执法机构和私营商业组织。公共部门的主要经济买家是市警察局长、县治安官和市政管理者，他们遵循严格的公共采购流程，使用市政一般基金、联邦及州刑事司法拨款，以及
              Sourcewell 或 OMNIA Partners 等合作采购协议。对执法机构而言，决定是否采用的关键是调查成效，尤其是盗车、暴力犯罪和 Amber Alert 的破案率。


              私营商业客户目前贡献 Flock 总收入约
              30%，预算来自企业损失预防、运营安保或住宅业主协会会费。全国零售连锁和物流枢纽等企业买家关注实际损失下降、停车场犯罪威慑和员工安全；业主协会则把周界摄像头视为社区房产价值保护。私营买家通常还会通过 Flock
              平台直接向当地警察局共享视频流。这种公私合作无需动用市政税收，却能补贴市政执法的监控密度，巩固 Flock 在两类客户中的位置。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
