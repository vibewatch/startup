      - number: '3.4'
        title: 护城河韧性：网络效应对抗监管与 incumbent 压力
        blocks:
          - type: paragraph
            body: >-
              Flock 的长期竞争护城河靠两种相互强化的机制：网络密度和流程锁定。49 个州超过 4,800
              家执法机构参与后，网络中每增加一台摄像头，整体平台的调查价值都会提升，形成单点方案竞争者无法复制的共同数据池。平台嵌入日常警务调度流程和社区安全委员会后，也抬高了运营切换门槛。但该护城河极易遭遇监管与公民自由反弹。警方未经授权查询数据库的调查报道，迫使
              Flock 在 2026 年 8 月把历史上的 30 天默认留存缩短为 7 天，并强制自动审计控制。公众审查升级和第四修正案诉讼已导致 30 多个市政机构终止或暂停合同，说明 Flock
              最大的替代威胁并非竞争者硬件更强，而是其市政社会许可可能流失。
            claimRefs:
              - CP009
