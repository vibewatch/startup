      - number: '1.4'
        title: 运营规模、平台里程碑与公共部门阻力
        blocks:
          - type: paragraph
            body: >-
              截至 2024 年末，Flock Safety 报告 ARR 已超过 $300M，同比增长 70%。平台覆盖美国 4,800 多家执法机构，以及数千家私营商业客户和业主协会客户。Flock
              声称，其自动检测与调查软件平台已支持超过一百万起刑事调查，并直接协助寻找数千名失踪人员。平台从 2017 年的太阳能社区摄像头，快速发展到 2024 和 2025
              年的实时犯罪中心软件及自主无人机响应单元。与此同时，业务正承受强烈的监管与运营阻力。公民自由组织、公共记录调查和社区隐私团体越来越关注 Flock
              的跨机构数据共享政策、车辆查询审计轨迹，以及在州级公共高速公路上大规模安装未经许可的摄像头。在多个辖区，这些争议已导致合同终止；例如华盛顿州 Lynnwood 市于 2026 年 2
              月终止市政摄像头合同，说明市政客户留存仍容易受到公共监督挑战影响。
