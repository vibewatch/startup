callouts:
  - calloutType: "insight"
    title: "The Hardware Lease Moat Converts CapEx Resistance into OpEx Stickiness"
    body: "Flock Safety's breakthrough in municipal procurement was eliminating the steep upfront capital expenditure typical of legacy ALPR vendors like Motorola or Leonardo. By bundling hardware, maintenance, solar power, and LTE connectivity into a single operating expenditure subscription of $2,500 to $3,000 per camera, Flock fits directly within routine discretionary police chief and HOA operating budgets, sidestepping multi-year municipal bond approvals."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
  - calloutType: "risk"
    title: "Unaccounted Field Service and Manufacturing Drag Challenge SaaS Margin Assumptions"
    body: "While investors value Flock at over $8 billion on software-like recurring revenue multiples, Flock operates as a vertically integrated hardware manufacturer and field maintenance provider. Building a 100,000-square-foot manufacturing plant in Atlanta and servicing tens of thousands of outdoor battery-operated cameras exposes Flock to cellular carrier inflation, battery degradation, and hardware replacement capex that pure-play software peers do not bear."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI012"
