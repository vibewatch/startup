  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context, valuation anchor, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              ONE's valuation debate starts with an awkward but important fact: the latest fully disclosed price anchor
              in retained public sources is still the February 2023 Series B at a $1.2 billion post-money valuation. The
              March 2025 strategic round clearly matters, because it returned founder Mujeeb Ijaz to the CEO role and
              brought in Crescent Ventures, Trousdale Ventures, and Ivanhoe Capital. But the round did not publicly
              disclose size or valuation. That omission matters more than the headline itself. Investors cannot tell
              from public evidence whether the new capital came in above, flat to, or below the 2023 benchmark, nor can
              they see whether the round carried strong preference protections. The same period also included the failed
              Just Climate-led Series C attempt, which is a direct warning that capital was not freely available on
              prior expectations. Entry discipline therefore has to treat $1.2 billion as a historical benchmark, not as
              a clean current mark. The business underneath that price has changed too: the company reset away from the
              broader passenger-EV ambition and now asks investors to underwrite a narrower grid, rail, defense, and
              industrial manufacturing story.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
