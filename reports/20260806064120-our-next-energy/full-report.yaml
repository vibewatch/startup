    Our Next Energy (ONE) is a Novi, Michigan-based battery manufacturer founded in 2020 by Mujeeb Ijaz. The company
    built its brand around safer lithium iron phosphate systems, Gemini long-range concepts, and domestic cell
    manufacturing at ONE Circle in Michigan. Publicly disclosed equity totals at least $390 million through the February
