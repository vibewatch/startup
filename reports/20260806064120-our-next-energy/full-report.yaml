            body: >-
              The public record points to a project-and-hardware revenue model rather than a software or subscription
              model. ONE now frames its commercial focus around rail, defense, utility-scale storage, and industrial
              microgrid use cases, with the strongest near-term disclosed number being $35 million of new purchase
              orders. That figure matters because it is more concrete than a generic market-opportunity claim, but it
              still should not be confused with recognized revenue. The other visible demand signals are design wins,
              term sheets, expected supply volumes, and partner selections: GE Vernova for grid storage, Shyft for
