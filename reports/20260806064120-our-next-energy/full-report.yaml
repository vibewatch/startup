      - number: '8.3'
        title: Public comparable bounds and scenario range
        blocks:
          - type: paragraph
            body: >-
              Public comps help bound the case, but they do not price it automatically. Fluence looks like the closest
              scaled Western BESS exposure and sits around a roughly 1x market-cap-to-revenue relationship, but it still
              shows negative earnings and high customer concentration. Stem screens far lower on a market-cap-to-revenue
              basis, reflecting a painful transition away from hardware resale and an unresolved software-scale story.
              Energy Vault trades richer than Fluence on revenue despite heavy concentration and project-timing risk.
              Eos trades richest of the set on current revenue despite negative gross margin, which shows how much
              future improvement and financing optionality can still matter in storage valuations. This is the right
              lesson for ONE. A sector range of roughly 0.35x to 8.6x trailing revenue is too wide to convert into a
              precise private-company target without company-specific economics. Still, the range is valuable because it
              shows how demanding a $1.2 billion benchmark really is. Depending on which public lens an investor uses,
              ONE would need anything from roughly $140 million to over $3.4 billion of annual revenue to support that
              mark mechanically. No retained public source gives confidence that ONE is currently near any of those
              thresholds.
            claimRefs:
              - CV017
