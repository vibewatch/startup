      - number: '2.2'
        title: Sizing lenses show huge macro demand but a narrower ONE wedge
        blocks:
          - type: paragraph
            body: >-
              Macro demand is undeniably large. IEA puts 2025 EV battery deployment at about 1.2 TWh, while global
              battery-storage additions reached 108 GW and broader BESS installations about 315 GWh. In the United
              States, SEIA and Benchmark reported 57.6 GWh of storage deployments in 2025 and a record 9.7 GWh in Q1
              2026, with annual installations projected to exceed 110 GWh by 2030. Clean Investment Monitor shows the
              domestic battery-manufacturing pipeline is also enormous: 202 GWh of operating cell capacity and 208 GWh
              of operating module capacity by Q1 2025, with potential to scale above 1 TWh by 2035. But those numbers
              are not ONE's SAM. They describe the ocean, not the fishable pond. ONE's supportable wedge is a
              domestic-content-oriented subset where buyers need U.S.-made LFP components or systems and are willing to
              absorb integration and qualification cycles to get them.
