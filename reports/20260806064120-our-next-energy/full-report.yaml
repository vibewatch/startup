            title: ONE has a credible wedge where domestic policy matters more than global volume
            body: >-
              ONE cannot out-scale CATL, BYD, or LGES, but it does not need to if buyers specifically value U.S.
              sourcing, Michigan manufacturing, and a domestic grid-component narrative.
            calloutType: strength
            claimRefs:
