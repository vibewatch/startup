          - type: callout
            title: The biggest valuation risk is not market size—it is denominator opacity
            body: >-
              Without recognized revenue, gross margin, cash runway, and round terms, investors cannot tell whether the
              historical benchmark reflects durable economics or just a prior narrative regime.
            calloutType: risk
            claimRefs:
