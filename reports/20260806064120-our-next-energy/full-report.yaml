              - CV033
              - CV034
              - CV035
      - number: '8.2'
        title: Thesis versus anti-thesis after the 2026 reset
        blocks:
          - type: paragraph
            body: >-
              The positive side of the valuation case is real. ONE still has named proof points after the reset: $35
              million of disclosed purchase orders, a GE Vernova term sheet, the Shyft program, the Pomega supply
              agreement, and a West Virginia industrial-site reference. Michigan incentive support and the ONE Circle
              buildout show the company is operating at industrial scale rather than at slide-deck scale. Market context
              is also supportive: IEA says battery storage is the fastest-growing power technology, so a pivot toward
              stationary storage is not irrational. The anti-thesis is just as real. Most of those proof points are
              still commercial signals rather than recognized revenue. The strongest current metric is purchase orders,
              not audited sales. Some key product delivery timelines still extend into 2027. The company also abandoned
              the broader passenger-EV frame that originally helped justify its unicorn label, and the public record
              remains thin on revenue, margin, and cap-table quality. So the valuation question is not whether there is
              a company here. There is. The question is whether the current public evidence justifies paying as though
              the narrower post-reset business is already proven economically. It does not.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
