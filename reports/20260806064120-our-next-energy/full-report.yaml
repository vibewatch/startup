      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Three buyer groups matter most. First are utility-scale storage developers, EPCs, and utility planning
              teams that need domestic-content-qualified cells, modules, BMS hardware, and eventually full systems.
              Second are commercial-vehicle and specialty-platform OEMs that care about pack fit, durability, and
              charging performance more than about flashy chemistry claims. Third are industrial, infrastructure, and
              defense-related buyers looking for resilient domestic power systems. Across all three, the public record
              suggests a qualification-heavy adoption motion. Buyers define a duty-cycle or reliability problem, review
              technical fit and compliance, validate a pilot or early deployment, and only then broaden procurement.
              That is why named proof points matter more than abstract TAM math. BMW, Shyft, GE Vernova, and the West
              Virginia microgrid each illuminate a different customer segment and show that ONE's market is
              multi-vertical but still early in conversion from proof point to scaled purchasing.
            claimRefs:
