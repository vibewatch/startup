      - number: '7.4'
        title: Financial-model risk, residual exposure, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The financial-model risk is that the turnaround story may still depend on assumptions the public record
              cannot verify. The Just Climate setback, the undisclosed terms of the 2025 funding reset, and the claim of
              end-2026 cash-flow breakeven all point to a business that still needs careful scrutiny on runway, margin,
              and order conversion. Even if market demand is real, the post-pivot business can fail if orders do not
              convert quickly enough, if incentives stop mattering, or if incumbents localize and compress pricing. The
              right mitigation posture is therefore trigger-based: investors should monitor delivery milestones,
              workforce stability, evidence of repeat orders, and whether domestic-policy advantages remain strong
              enough to offset scale disadvantages. Without those proofs, the residual exposure stays high. This is why
              the risk posture should stay conservative even if the narrative sounds improved. A turnaround that depends
              on faster order conversion, steadier policy support, and a leaner operating base can work, but only if
              those moving parts line up quickly. Until the company provides stronger operational and financial proof,
              the prudent stance is to underwrite downside first and upside second.
            claimRefs:
