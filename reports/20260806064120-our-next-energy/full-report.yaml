  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the right comparison set
        blocks:
          - type: paragraph
            body: >-
              ONE should not be sized as though it were pursuing every battery end market simultaneously. The public
              product set and 2026 strategy point to a narrower market boundary: domestic lithium-iron-phosphate
              components and systems sold into commercial mobility, stationary storage, and infrastructure or defense
              applications. Included spend therefore starts with cells, modules, battery-management hardware, mobility
              packs, and containerized storage systems where buyers value U.S. manufacturing, safety, and supply-chain
              transparency. Excluded spend includes unrelated renewable-generation capex, pure consumer-EV battery
              demand that ONE no longer appears to prioritize, and grid upgrades with no battery component. The
              substitute set is also broader than one rival startup. Chinese LFP imports, incumbent NCM vehicle packs,
              and non-battery backup or resilience solutions all compete for the same buyer budget depending on use
              case. In practice, this framing keeps the later customer, competitor, and valuation chapters anchored to
              the markets the company is still visibly trying to serve.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM034
