      - number: '3.3'
        title: Distribution power, switching costs, and the role of partners
        blocks:
          - type: paragraph
            body: >-
              Competitive power in batteries is not only about chemistry. It is also about who can qualify quickly,
              deliver repeatedly, and support the system after install. Public evidence suggests Fluence and the largest
              global battery makers still have the upper hand on those dimensions because they disclose global operating
              scale, broader controls stacks, and more mature service narratives. ONE fights back with a different
              bundle: Michigan manufacturing, 45X-tailwind positioning, and counterparties such as GE Vernova, BMW,
              Shyft, and Pomega that help it look more bankable than an unvalidated battery lab. Even so, buyer
              switching costs cut both ways. Once a platform is validated, BMS and system choices can lock in; before
              that, multi-homing is common and suppliers can be swapped or dual-sourced. That dynamic favors the largest
              or most localized supplier unless ONE keeps converting proof points into repeatable programs. That makes
              partner quality and post-install execution more strategically important than a simple feature checklist,
              especially when customers can dual-source cells but not easily requalify full systems mid-program.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
