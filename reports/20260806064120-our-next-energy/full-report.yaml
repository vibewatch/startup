      - number: '1.4'
        title: Manufacturing milestones, customer proof points, and the 2026 strategic reset
        blocks:
          - type: paragraph
            body: >-
              The strongest part of the public record is operational progress before the 2026 pivot. ONE selected
              Michigan for ONE Circle in 2022, launched Aries Grid in early 2023, entered pilot LFP cell production in
              late 2023, and produced Aries packs at Piston Automotive. Customer-facing proof points include BMW's
              Gemini demonstration, Shyft's commercial-truck battery selection, and GE Vernova's term sheet for
              U.S.-made LFP cells and modules. Supply-chain mitigation also appears in the May 2025 Pomega agreement,
              which adds near-term 314 Ah cell supply ahead of full-scale Michigan ramp. Yet the same chronology also
              shows stress. ONE announced 128 layoffs in late 2023 and 37 more in March 2024. TechCrunch reported that
              an earlier Series C plan unraveled when Just Climate withdrew a planned $100 million lead check. The
              culminating event was the January 2026 reset: ONE paused automotive EV investments, cut roughly 45% of
              staff, and recast itself around rail, defense, and utility-scale storage with $35 million of new purchase
              orders. That makes the company materially different from the 2022-2023 narrative that supported the $1.2
              billion Series B valuation.
