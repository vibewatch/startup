      - number: '3.2'
        title: Competitor profiles, capability breadth, and buyer evaluation
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive fact in the public record is scale concentration. CATL and BYD alone controlled
              more than half of global EV battery installations in 2025, while China still held over 80% of
              manufacturing capacity. That means ONE is not fighting a fragmented field; it is fighting scale. Against
              that backdrop, competitor roles differ. Fluence is the mature grid integrator with software, warranties,
              and operating scale. Form Energy is a long-duration technology substitute for some utility budgets but not
              a direct 2-4 hour LFP peer. LGES, CATL, BYD, and Gotion represent broad cell-manufacturing capacity and
              customer reach. ONE's public strengths are narrower: domestic-content fit, safety-oriented LFP
              positioning, and a still-credible set of named partners and customers in several verticals. The practical
              implication is that ONE must win on wedge fit and qualification economics, because it cannot win a pure
              scale contest against the largest global manufacturers or the most mature grid integrators.
