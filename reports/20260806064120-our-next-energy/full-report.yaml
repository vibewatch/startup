            title: Public comps show both promise and danger in storage valuations
            body: >-
              The sector can support meaningful valuations for strategic assets, but it also punishes weak execution and
              hidden financing risk. ONE needs more proof before it belongs near the optimistic end of that range.
            calloutType: insight
