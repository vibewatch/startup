          - type: callout
            title: The category can commoditize quickly if larger players localize
            body: >-
              ONE's moat is vulnerable if bigger incumbents add U.S. capacity or if domestic-content economics weaken.
              In that scenario, the contest shifts back toward price, service breadth, and installed-base scale.
            calloutType: risk
            claimRefs:
