        title: Product Platforms and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              ONE's public product story is now a component-and-system portfolio, not a single moonshot EV battery. The
              retained materials show four distinct layers buyers can touch: configurable Aries LFP packs for commercial
              mobility, Gemini as a dual-chemistry long-range architecture, OTP / TTP cells as sellable building blocks,
              and the Aries Grid stationary stack spanning cells, modules, BMS, and future containerized systems. The
              workflow matters because customers are not buying a generic battery pack off a shelf. Truck, bus, or
              specialty-vehicle integrators need configurable pack voltage, chassis fit, and validation support;
              stationary-storage buyers need domestic-content-qualified components that can slot into a familiar rack,
              BMS, and ESS architecture. ONE therefore looks less like a consumer-product company and more like a
              systems integrator selling chemistry, controls, and manufacturing access together. That framing is
              essential for later financial and customer analysis because purchase friction likely sits in
              qualification, compliance, and support, not only in battery list price.
