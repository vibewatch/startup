  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Decision chain from historical price anchor and current proof to the research-more call.
    data:
      nodes:
        - id: n1
          label: Historical $1.2B anchor
          detail: Last fully disclosed price mark is from February 2023 Series B.
        - id: n2
          label: 2025 round terms opaque
          detail: Latest round disclosed investors but not size or valuation.
        - id: n3
          label: 2026 reset changes thesis
          detail: Passenger EV story narrowed to grid / rail / defense / industrial.
        - id: n4
          label: Proof exists but is narrow
          detail: Orders, GE, Shyft, Pomega, and industrial-site references matter.
        - id: n5
          label: Comp band is wide and unstable
          detail: Public storage comps range from distressed to speculative.
        - id: n6
          label: Research-more
          detail: Do more diligence before treating the historical anchor as investable today.
      edges:
        - from: n1
          to: n6
          label: Old anchor alone is insufficient
        - from: n2
          to: n6
          label: Price cannot be underwritten cleanly
        - from: n3
          to: n6
          label: Business changed materially since anchor
        - from: n4
          to: n6
          label: Enough proof to keep diligencing
        - from: n5
          to: n6
          label: Public comps bound the case, not price it
    approximationNotes: The flow is qualitative by design; the bottleneck is disclosure quality more than narrative potential.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV013
      - CV030
      - CV038
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Revenue needed to support a $1.2B mark under different public-comp revenue-multiple lenses.
    data:
      items:
        - label: Stem-like ~0.35x
          value: 3460
          unit: USD M required revenue
          detail: Very low-confidence public-market lens for a struggling transition story.
        - label: Fluence-like ~1.0x
          value: 1180
          unit: USD M required revenue
          detail: Closest scaled Western BESS benchmark.
        - label: Energy Vault-like ~2.6x
          value: 470
          unit: USD M required revenue
          detail: Richer project-platform comp.
        - label: Eos-like ~8.6x
          value: 140
          unit: USD M required revenue
          detail: Speculative upper-bound U.S. battery-manufacturing lens.
    approximationNotes: >-
      These are mechanical public-comp sensitivity points anchored to the historical $1.2B figure, not claims about
      ONE's actual current revenue.
