    title: Valuation / return range
    type: range
    layout: standard
    summary: Public-evidence current-value range versus the historical unicorn benchmark.
    data:
      items:
        - label: Bear
          low: 400
          value: 525
          high: 650
          unit: USD M
          detail: Delay, defensive financing, or weak order conversion.
        - label: Base
          low: 700
          value: 825
          high: 950
          unit: USD M
          detail: Strategic relevance holds but economics and terms stay incomplete.
        - label: Bull
          low: 1100
          value: 1250
          high: 1400
          unit: USD M
          detail: Orders convert, 2027 launch lands, and diligence clears economics plus cap-table quality.
    approximationNotes: >-
      These are discussion ranges derived from the public evidence package and peer boundaries, not a DCF or management
      forecast.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style snapshot of why the company remains interesting but not yet priceable from public evidence.
    data:
      items:
        - label: Recommendation
          value: research-more
          note: Commercial proof exists, but price support still fails.
        - label: Confidence
          value: medium
          note: Directional judgment is stronger than exact fair-value precision.
        - label: Risk
          value: high
          note: Execution, financing, and concentration risks remain stacked.
        - label: Historical disclosed anchor
          value: $1.2B
          note: Still the last fully disclosed valuation mark in retained sources.
        - label: Strongest disclosed current denominator
          value: $35M orders
          note: Useful signal, but not recognized revenue.
        - label: Public-comp revenue-multiple band
          value: ~0.35x to ~8.6x
          note: Storage equity pricing remains highly unstable.
        - label: Underwriting readiness
          value: low-medium
          note: Needs cap-table, liquidity, margin, and backlog conversion proof.
    approximationNotes: These are investment-committee heuristics derived from retained evidence, not company-reported board KPIs.
    claimRefs:
      - CV001
      - CV006
      - CV030
      - CV038
      - CV039
      - CV040
      - CV041
