  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and the right comparison set
        blocks:
          - type: paragraph
            body: >-
              ONE is easy to misclassify because its portfolio spans multiple battery jobs at once. The company now
              sells or markets commercial-mobility packs, domestic grid components, and advanced passenger-EV concepts,
              so the right competitor set is not one neat row of battery startups. The direct comparison for Aries Grid
              includes integrators like Fluence and large LFP cell or module suppliers. The direct comparison for Aries
              mobility packs includes scaled cell suppliers serving vehicle OEMs or specialty integrators. Factorial and
              similar advanced-battery companies are adjacent rather than perfect direct matches because they compete
              more with Gemini or Aries II than with today’s domestic grid stack. Finally, substitutes matter: imported
              Chinese supply, incumbent NCM programs, and non-battery resilience solutions can all absorb the same buyer
              budget. This matters because later valuation work should compare ONE with the vendors that can actually
              win the same budget line today, not just with any company that uses the word battery.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP032
