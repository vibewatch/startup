              design win, and a GE Vernova project term sheet are all valuable, but they imply different buying motions,
              decision makers, and revenue conversion odds. The chapter therefore treats named counterparties as proof
              of segment relevance first and proof of scaled monetization only when the source discloses actual
              deployment scope or expected purchase volume. Investors should therefore read logos as a map of where ONE
