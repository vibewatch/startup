      - number: '7.3'
        title: Partner dependency, customer concentration, and people risk
        blocks:
          - type: paragraph
            body: >-
              ONE's dependency map is unusually concentrated for a company that still needs multiple external proofs to
              support its story. Pomega matters for cell supply, GE Vernova matters for channel credibility in grid
              storage, Shyft matters for commercial-mobility proof, and the West Virginia industrial ecosystem matters
              for project-level relevance. None of those dependencies are inherently bad, but each concentrates risk if
              execution stalls. The people story is similarly fragile. Repeated layoffs, founder-centrality, and broad
              ongoing hiring needs imply that the company is simultaneously shrinking and rebuilding. That combination
              can create knowledge loss, morale issues, and execution discontinuity precisely when the post-pivot
              operating model requires fast and disciplined delivery. Dependency also creates sequencing risk: one
              delayed supplier or one cautious launch customer can hold back several downstream proofs at once. In the
              current public story, that means lost evidence can matter almost as much as lost revenue, because the
              company still depends on a small number of counterparties to validate its reset.
            claimRefs:
