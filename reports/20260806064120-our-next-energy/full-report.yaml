      - number: '2.4'
        title: Growth drivers, adoption constraints, and what matters for valuation
        blocks:
          - type: paragraph
            body: >-
              The growth drivers are real: storage deployments are accelerating, data-center and manufacturing loads
              support more grid flexibility needs, LFP chemistry is now dominant in storage, and domestic incentives
              such as 45X and the ITC bonus meaningfully improve the case for U.S. manufacturing. Yet the constraint set
              is just as important. China still dominates manufacturing capacity, pricing power remains fierce, upstream
              LFP materials are not meaningfully diversified, and policy volatility has already produced billions of
              dollars of U.S. manufacturing cancellations. Even demand itself is mixed: the U.S. storage segment is
              strong, but passenger-EV battery momentum was much weaker in 2025, which helps explain ONE's strategic
              pivot. For valuation, the right conclusion is not “the market is huge.” It is that ONE now sits in a real
              and fast-growing domestic storage and component wedge, but one where procurement friction, China-linked
              competition, and policy instability can materially delay monetization. Investors should therefore test not
              only market size, but also which verticals can clear policy, sourcing, and qualification hurdles fast
              enough to support repeat orders before competitors compress pricing further.
