        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more'
            body: >-
              The company is real enough to keep diligencing, but the current public evidence still does not justify
              treating the historical unicorn benchmark as a clean buy opportunity.
            calloutType: recommendation
