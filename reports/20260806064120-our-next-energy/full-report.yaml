            body: >-
              ONE's customer base is easiest to understand if it is split into four groups: passenger-EV development
              partners, commercial-mobility OEMs or integrators, grid or channel counterparties, and industrial or
              infrastructure buyers. The public record also shows why definitions matter. Some counterparties are true
              end customers, some are development partners, and some are channel-like project partners who can carry ONE
