chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product scope
        blocks:
          - type: paragraph
            body: >-
              Our Next Energy, commonly branded as ONE, is a Michigan-based battery company founded in 2020 and
              headquartered in Novi. The company now uses one.ai as its main public website and describes its mission as
              building durable, safe, and sustainable energy storage solutions for vehicles, renewables, and the grid.
              The retained official pages show a two-site Michigan operating footprint: headquarters in Novi and the ONE
              Circle gigafactory in Belleville/Van Buren Township. Public materials present a broader product family
              than a single passenger-EV battery story. In addition to Aries LFP packs for commercial mobility, ONE
              markets Gemini dual-chemistry range-extension technology, Aries Grid stationary storage systems, and OTP
              prismatic LFP cells for mobility, infrastructure, and defense applications. This matters because the 2026
              story is not merely whether ONE can build a longer-range EV battery; it is whether the company has
              assembled enough real product breadth and domestic manufacturing capability to survive a market pivot
              after abandoning passenger-EV scale ambitions.
