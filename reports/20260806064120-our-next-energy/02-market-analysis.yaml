  title: The right market lens is domestic component qualification, not global commodity share
  body: ONE's addressable market is best framed around buyers who value domestic LFP supply, safety, and integration support. That is a much smaller but more defensible wedge than the full battery TAM.
  claimRefs:
  - CM001
  - CM034
  - CM039
