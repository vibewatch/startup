company:
  name: Our Next Energy (ONE)
chapter:
  number: 2
  title: Market Analysis
  summary: ONE sits at the intersection of several large battery markets, but the defendable 2026 opportunity is much narrower than global EV or storage TAM headlines. Public evidence points to a U.S.-tilted wedge in domestic LFP components and systems for utility storage, commercial mobility, and infrastructure or defense applications, supported by storage growth and industrial-policy incentives but constrained by Chinese pricing power, upstream supply concentration, and long qualification cycles.
sections:
- id: market-boundary
  title: Market boundary and the right comparison set
  body: 'ONE should not be sized as though it were pursuing every battery end market simultaneously. The public product set and 2026 strategy point to a narrower market boundary: domestic lithium-iron-phosphate components and systems sold into commercial mobility, stationary storage, and infrastructure or defense applications. Included spend therefore starts with cells, modules, battery-management hardware, mobility packs, and containerized storage systems where buyers value U.S. manufacturing, safety, and supply-chain transparency. Excluded spend includes unrelated renewable-generation capex, pure consumer-EV battery demand that ONE no longer appears to prioritize, and grid upgrades with no battery component. The substitute set is also broader than one rival startup. Chinese LFP imports, incumbent NCM vehicle packs, and non-battery backup or resilience solutions all compete for the same buyer budget depending on use case. In practice, this framing keeps the later customer, competitor, and
    valuation chapters anchored to the markets the company is still visibly trying to serve.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM034
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing lenses show huge macro demand but a narrower ONE wedge
  body: 'Macro demand is undeniably large. IEA puts 2025 EV battery deployment at about 1.2 TWh, while global battery-storage additions reached 108 GW and broader BESS installations about 315 GWh. In the United States, SEIA and Benchmark reported 57.6 GWh of storage deployments in 2025 and a record 9.7 GWh in Q1 2026, with annual installations projected to exceed 110 GWh by 2030. Clean Investment Monitor shows the domestic battery-manufacturing pipeline is also enormous: 202 GWh of operating cell capacity and 208 GWh of operating module capacity by Q1 2025, with potential to scale above 1 TWh by 2035. But those numbers are not ONE''s SAM. They describe the ocean, not the fishable pond. ONE''s supportable wedge is a domestic-content-oriented subset where buyers need U.S.-made LFP components or systems and are willing to absorb integration and qualification cycles to get them.'
  claimRefs:
