    - Industrial sponsors, public-sector buyers, defense-adjacent contractors
    - Core
  - - Passenger-EV battery adjacency
    - Advanced passenger-EV battery programs such as Gemini or Aries II
    - Commodity EV battery share outside ONE's current strategy focus
    - OEM advanced-battery teams
    - Adjacent / selective
  - - Status-quo substitutes
    - Imported LFP supply, incumbent NCM solutions, or non-battery backup systems
    - Any spend that never solves an electrification or storage job
    - Same buyer budgets as above
    - Important comparison set
  notes: ONE's addressable market should be bounded by the product lines it still sells and funds, not by the entire global battery industry.
