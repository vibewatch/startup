- id: buyers-budget-owners-and-adoption-path
  title: Buyer segmentation, budget ownership, and adoption path
  body: Three buyer groups matter most. First are utility-scale storage developers, EPCs, and utility planning teams that need domestic-content-qualified cells, modules, BMS hardware, and eventually full systems. Second are commercial-vehicle and specialty-platform OEMs that care about pack fit, durability, and charging performance more than about flashy chemistry claims. Third are industrial, infrastructure, and defense-related buyers looking for resilient domestic power systems. Across all three, the public record suggests a qualification-heavy adoption motion. Buyers define a duty-cycle or reliability problem, review technical fit and compliance, validate a pilot or early deployment, and only then broaden procurement. That is why named proof points matter more than abstract TAM math. BMW, Shyft, GE Vernova, and the West Virginia microgrid each illuminate a different customer segment and show that ONE's market is multi-vertical but still early in conversion from proof point to scaled purchasing.
  claimRefs:
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM031
  - CM032
  - CM033
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: drivers-constraints-and-valuation-relevance
  title: Growth drivers, adoption constraints, and what matters for valuation
  body: 'The growth drivers are real: storage deployments are accelerating, data-center and manufacturing loads support more grid flexibility needs, LFP chemistry is now dominant in storage, and domestic incentives such as 45X and the ITC bonus meaningfully improve the case for U.S. manufacturing. Yet the constraint set is just as important. China still dominates manufacturing capacity, pricing power remains fierce, upstream LFP materials are not meaningfully diversified, and policy volatility has already produced billions of dollars of U.S. manufacturing cancellations. Even demand itself is mixed: the U.S. storage segment is strong, but passenger-EV battery momentum was much weaker in 2025, which helps explain ONE''s strategic pivot. For valuation, the right conclusion is not “the market is huge.” It is that ONE now sits in a real and fast-growing domestic storage and component wedge, but one where procurement friction, China-linked competition, and policy instability can materially delay
    monetization. Investors should therefore test not only market size, but also which verticals can clear policy, sourcing, and qualification hurdles fast enough to support repeat orders before competitors compress pricing further.'
