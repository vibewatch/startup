  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: A defensible company-specific SAM or SOM by product line, geography, and buyer type.
    whyItMatters: Battery TAM figures are easy to find, but valuation depends on how much of that market ONE can actually target and supply. Public sources stop far short of a defensible share-of-market view.
    diligencePath: Request management's bottom-up pipeline model by segment, region, product family, win rate, ASP, and capacity-constrained supply assumptions.
    relatedQuestionRefs:
    - QM024
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: procurement-friction
    missingEvidence: Public cycle-time data showing how long utility, defense, or commercial-vehicle buyers take to move from qualification to revenue.
    whyItMatters: The market may be large, but slow procurement or homologation cycles can materially delay monetization and cash conversion.
    diligencePath: Collect CRM funnel aging, homologation timelines, utility procurement milestones, and pilot-to-program conversion data by segment.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A single apples-to-apples unit for every battery market lens used in this chapter.
    whyItMatters: Public sources mix GWh, GW, unit sales, and policy-support amounts. That is acceptable for a market map but not for precise underwriting without a normalized model.
    diligencePath: Build an internal market model converting each target segment into volume, ASP, and gross-margin pools that align with ONE's products.
    relatedQuestionRefs:
    - QM024
  - type: stale
    severity: material
    topic: strategy-shift
    missingEvidence: An updated post-2026 market plan showing how much passenger-EV exposure remains versus grid, rail, defense, and industrial applications.
    whyItMatters: Historical product announcements can overstate market breadth if capital and sales resources have already shifted elsewhere.
    diligencePath: Request the current sales plan, segment headcount allocation, pipeline by vertical, and board-approved strategy materials.
    relatedQuestionRefs:
