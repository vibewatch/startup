- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - The company still has real counterparties, disclosed purchase orders, and domestic-policy support after the reset.
    - More named customers, repeat orders, and recognized-revenue disclosure would strengthen this materially.
  - - Thesis
    - Battery storage demand growth makes the pivot toward grid and infrastructure markets strategically rational.
    - This strengthens if the grid product launch and project pipeline convert into visible deployments and economics.
  - - Thesis
    - ONE has an industrial asset base and manufacturing footprint large enough to matter if execution holds.
    - This improves if yield, utilization, and working-capital data prove the factory can scale economically.
  - - Anti-thesis
    - The strongest current metric is still orders and partner proof, not revenue, margin, or cash generation.
    - Audited revenue-recognition, gross-margin, and cash-collection data would directly weaken this objection.
  - - Anti-thesis
    - The historical $1.2B anchor predates the 2026 strategic reset and may no longer fit the narrower business.
    - A clearly disclosed up-round or stronger 2026-2027 operating proof would be needed to support parity or upside.
  - - Anti-thesis
    - The 2025 round terms remain undisclosed, so dilution and preference overhang cannot be underwritten.
    - A clean cap-table package and latest term sheet would materially improve valuation support.
  notes: Rows separate company quality from investability at a specific price; the main gap is economic visibility, not the absence of a business.
