- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Commercial-conversion failure
    - Disclosed orders and partnerships still do not convert into visible revenue or deliveries by late 2026 / 2027
    - Undermines the argument that the reset has created a monetizable business rather than a new narrative
    - Move from research-more toward avoid unless price resets sharply
  - - Defensive financing terms
    - Next diligence shows punitive preferences, deep dilution, or structured rescue capital
    - Can wipe out common-equity upside even if operations improve
    - Require a materially lower effective entry price or step away
  - - Manufacturing delay
    - 2027 cell roadmap or facility ramp slips materially
    - Pushes value realization further right while fixed costs and financing needs persist
    - Cut bull-case probability and raise required return
  - - Concentration intensifies
    - One or two counterparties remain responsible for most proof and potential revenue
    - Makes the business easier to de-risk narratively than economically
    - Treat growth assumptions as fragile until customer breadth improves
  - - Policy support weakens
    - Domestic-content, incentive, or tariff advantages shrink meaningfully
    - Narrows ONE's wedge against larger or cheaper suppliers
    - Re-rate the moat downward and compress acceptable valuation
  notes: The triggers are intentionally monitorable and tie directly to whether the current benchmark can ever be supported.
  claimRefs:
  - CV013
  - CV016
  - CV037
  - CV040
  - CV042
  - CV044
  - CV049
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preference stack
    - Latest share count, liquidation preferences, anti-dilution, participating features, and any pay-to-play structure
    - Can dominate common-equity returns even if operational progress is decent
    - Request latest financing docs, cap-table bridge, and counsel summary
  - - Revenue and backlog conversion
    - Recognized revenue by vertical, backlog aging, ASP, customer acceptance milestones, and deposits
    - Separates demand narrative from monetization reality
    - Request monthly bookings-to-billings bridge and customer contract summary
  - - Margin and warranty profile
    - Gross margin by product line, warranty reserve policy, and service / field-failure cost
    - Determines whether scale creates value or destroys cash
    - Request audited margin bridge plus reliability / warranty reports
  - - Cash, burn, and debt
    - Current liquidity, monthly burn, debt covenants, and any factory or project financing
    - Late-stage manufacturing businesses fail more often on cash timing than on market need
    - Request 13-week cash flow, debt schedule, and covenant package
  - - Customer concentration durability
    - Repeat-order status, account-level pipeline, cancellations, and diversification beyond the current proof-point set
    - Needed to distinguish a few anchors from a durable commercial base
    - Request CRM export, revenue concentration schedule, and renewal / expansion status
  notes: The missing evidence is numerical and document-based, which means management either can clear the valuation debate quickly or cannot.
  claimRefs:
