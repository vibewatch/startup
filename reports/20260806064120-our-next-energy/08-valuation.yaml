- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Explicit assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Orders convert into recognized revenue quickly, the 2027 cell roadmap lands on time, and diligence reveals reasonable margin plus a clean cap table.
    - $1.10B-$1.40B current-value range; the old benchmark becomes defensible only if new evidence closes the economics gap.
    - Still depends on a late-stage manufacturing ramp and partner conversion proving durable.
    - Possible, but requires several missing proofs to arrive in the next 12-18 months.
  - - Base
    - Partner proof remains intact and the grid pivot stays credible, but public revenue, margin, and round-term opacity continue.
    - $0.70B-$0.95B current-value range; this points to a mark below the old benchmark despite strategic relevance.
    - A real company can still be overvalued if the economics and cap stack remain hidden.
    - Most consistent with the current retained public evidence.
  - - Bear
    - Orders slip, 2027 launches move right, financing terms look defensive, or concentration intensifies.
    - $0.40B-$0.65B current-value range; this implies a material markdown versus the historical unicorn anchor.
    - Battery-manufacturing scale-up, funding resets, and customer concentration can compress value quickly.
    - Meaningful if 2026-2027 execution disappoints or capital markets tighten.
  notes: These are public-evidence valuation discussion ranges, not management guidance or discounted-cash-flow outputs.
