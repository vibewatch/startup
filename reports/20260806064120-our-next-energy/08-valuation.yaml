- id: recommendation-exit-and-final-diligence
  title: Recommendation, exit logic, and final diligence asks
  body: 'The chapter lands on research-more with medium confidence, high risk, and a stretched valuation stance. That is not a dismissal of the company. It is a statement that public evidence still falls short of what a new investor should demand before treating the old unicorn benchmark as investable. The best case is understandable: a domestic battery manufacturer with real counterparties, policy support, and a clearer grid narrative than it had in 2023. But the more durable public conclusion is that the price support is still thinner than the product and market story. A buyer at or near the historical $1.2 billion anchor should want a credible path to strong multi-year returns even after dilution, preferences, and additional factory capital needs. From today''s public evidence set, that requires more than optimism. It requires direct proof on round terms, liquidity, backlog conversion, gross margin, and repeat-order durability. Until those appear, the most plausible exit path is another
    private round or a strategic transaction after more commercialization proof, not a near-term IPO. Price can move the call, and evidence can move the call, but neither has moved enough yet.'
