- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Fluence (FLNC)
    - Market cap and TTM revenue
    - ~$2.62B market cap on ~$2.58B TTM revenue (~1.0x)
    - Closest scaled Western BESS integrator and a strong benchmark for grid relevance.
    - Still negative on earnings and carries concentration risk, so it is not a clean mature-profit comp.
  - - Stem (STEM)
    - Market cap and TTM revenue
    - ~$52M market cap on ~$150M TTM revenue (~0.35x)
    - Shows how harsh public markets can be when execution and business-model transitions weaken confidence.
    - Now more software-transition story than direct battery-manufacturing comp.
  - - Energy Vault (NRGV)
    - Market cap and TTM revenue
    - ~$0.54B market cap on ~$0.21B TTM revenue (~2.6x)
    - Useful mid-range comp for a project-heavy storage platform with real deployments.
    - Revenue concentration is high and business mix is not identical to ONE's.
  - - Eos Energy (EOSE)
    - Market cap and TTM revenue
    - ~$1.38B market cap on ~$0.16B TTM revenue (~8.6x)
    - Shows how public markets can still value future optionality in U.S. battery manufacturing.
    - Negative gross margin and financing complexity mean it is a speculative upper-bound comp, not a clean peer median.
  notes: The set is intentionally narrow and public-market-based. It brackets how investors price U.S.-relevant storage businesses, but it does not replace direct diligence on ONE's own economics.
