tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Interesting enough to continue diligence, not transparent enough to buy at the historical benchmark.
  - - Confidence
    - medium
    - Direction of the call is clear, but exact fair value remains sensitive to hidden terms and undisclosed economics.
  - - Risk rating
    - high
    - Manufacturing, financing, partner concentration, and disclosure risks still stack rather than offset one another.
  - - Valuation stance
    - stretched
    - The historical $1.2B anchor looks demanding relative to the current public evidence package.
  - - Target return / hold
    - Want >3x gross over 4-6 years
    - At a late-stage battery-manufacturing entry, anything less does not compensate for execution and dilution risk.
  - - Most likely exit path today
    - Another private round or strategic sale before IPO
    - IPO readiness still requires publishable operating and financial metrics.
  - - Upgrade trigger
    - Cleaner entry or much stronger evidence
    - A lower price, or audited proof on revenue, margin, and cap table, could move the call toward track.
  notes: The recommendation is explicitly price-sensitive and treats the old unicorn benchmark as a historical reference point rather than a clean current common-equity mark.
