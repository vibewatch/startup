  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Latest price per share, share count, liquidation preference stack, anti-dilution terms, and any participating preferred features from the 2025 round.
    whyItMatters: Late-stage private valuations can look acceptable on enterprise narrative and still produce poor common-equity returns after defensive terms.
    diligencePath: Request the latest financing documents, cap-table bridge, and counsel memo summarizing seniority and dilution mechanics.
    relatedQuestionRefs:
    - QV002
    - QV003
    - QV027
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-and-margin
    missingEvidence: Recognized revenue by vertical, backlog aging, ASP, gross margin, warranty accruals, and contribution margin by product family.
    whyItMatters: The difference between a promising battery company and an investable one is usually found here, not in headline partner names.
    diligencePath: Request audited P&L detail, customer contract summaries, and a bookings-to-billings bridge for 2025-2026.
    relatedQuestionRefs:
    - QV006
    - QV008
    - QV009
    - QV014
    - QV028
    relatedTableRefs:
    - TV002
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-capital-plan
    missingEvidence: Current cash balance, monthly burn, debt schedule, project-finance obligations, covenant package, and 12-18 month capital plan.
    whyItMatters: Factory-scale battery businesses often fail on cash timing long before market demand disappears.
    diligencePath: Request latest liquidity report, 13-week cash flow, board budget, and debt or structured-finance documents.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV022
    - QV028
    relatedTableRefs:
    - TV001
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: repeat-order-durability
    missingEvidence: Independent public evidence on repeat orders, cancellations, account-level expansion, or retention after the 2026 reset.
    whyItMatters: Current proof points may be strategically meaningful yet still too concentrated to support a durable valuation case.
    diligencePath: Request CRM export, account concentration schedule, and signed follow-on POs by customer.
    relatedQuestionRefs:
    - QV005
    - QV023
    - QV028
    relatedTableRefs:
    - TV005
    - TV006
