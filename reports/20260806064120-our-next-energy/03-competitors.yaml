  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable public pricing, ASPs, warranty reserve assumptions, or LCOS figures across ONE and key competitors.
    whyItMatters: Competitive position can change dramatically if domestic-content benefits are outweighed by import pricing or better service packages from incumbents.
    diligencePath: Request bid sheets, battery or system quotes, warranty terms, and at least three lost-deal analyses versus named competitors.
    relatedQuestionRefs:
    - QP018
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-rate-gap
    missingEvidence: ONE's win rates, reorder rates, and conversion rates by segment versus named competitors.
    whyItMatters: Named proof points show relevance, but they do not prove the company consistently wins when directly compared against larger suppliers or integrators.
    diligencePath: Request CRM stage-conversion data, lost-deal reasons, and segment-level win/loss summaries for 2024-2026.
    relatedQuestionRefs:
    - QP017
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: service-depth
    missingEvidence: Third-party evidence on ONE's field-service, software-update, and post-install support depth versus Fluence-like incumbents.
    whyItMatters: Lifecycle support can be a decisive moat in grid storage, but ONE's public record is much thinner here than its product pages on hardware.
    diligencePath: Collect customer references, service SLAs, uptime guarantees, and integrator feedback on support responsiveness.
    relatedQuestionRefs:
    - QP013
    - QP014
    relatedTableRefs:
    - TP002
    - TP004
  - type: stale
    severity: material
    topic: strategy-shift
    missingEvidence: A current post-pivot competitor map from management showing which product lines still matter strategically.
    whyItMatters: Historic BMW- and passenger-EV-centered comparisons can overstate competition that no longer receives real capital or go-to-market effort.
    diligencePath: Request the latest segment strategy, capital allocation plan, and product prioritization materials approved after the 2026 reset.
    relatedQuestionRefs:
    - QP020
