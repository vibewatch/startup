company:
  name: Our Next Energy (ONE)
chapter:
  number: 3
  title: Competitors
  summary: 'ONE competes from a narrow but real wedge: domestically positioned LFP components and systems for U.S. grid, commercial-mobility, and industrial applications. The adverse fact is scale concentration—CATL, BYD, LGES, Gotion, and grid integrators like Fluence have far more operating breadth—so ONE''s moat is not size but policy fit, domestic manufacturing optics, and enough named proof points to matter if they convert into repeatable programs.'
sections:
- id: landscape-and-comparison-set
  title: Landscape and the right comparison set
  body: 'ONE is easy to misclassify because its portfolio spans multiple battery jobs at once. The company now sells or markets commercial-mobility packs, domestic grid components, and advanced passenger-EV concepts, so the right competitor set is not one neat row of battery startups. The direct comparison for Aries Grid includes integrators like Fluence and large LFP cell or module suppliers. The direct comparison for Aries mobility packs includes scaled cell suppliers serving vehicle OEMs or specialty integrators. Factorial and similar advanced-battery companies are adjacent rather than perfect direct matches because they compete more with Gemini or Aries II than with today’s domestic grid stack. Finally, substitutes matter: imported Chinese supply, incumbent NCM programs, and non-battery resilience solutions can all absorb the same buyer budget. This matters because later valuation work should compare ONE with the vendors that can actually win the same budget line today, not just with
    any company that uses the word battery.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP032
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: profiles-capabilities-and-buyer-evaluation
  title: Competitor profiles, capability breadth, and buyer evaluation
  body: 'The strongest competitive fact in the public record is scale concentration. CATL and BYD alone controlled more than half of global EV battery installations in 2025, while China still held over 80% of manufacturing capacity. That means ONE is not fighting a fragmented field; it is fighting scale. Against that backdrop, competitor roles differ. Fluence is the mature grid integrator with software, warranties, and operating scale. Form Energy is a long-duration technology substitute for some utility budgets but not a direct 2-4 hour LFP peer. LGES, CATL, BYD, and Gotion represent broad cell-manufacturing capacity and customer reach. ONE''s public strengths are narrower: domestic-content fit, safety-oriented LFP positioning, and a still-credible set of named partners and customers in several verticals. The practical implication is that ONE must win on wedge fit and qualification economics, because it cannot win a pure scale contest against the largest global manufacturers or the most
    mature grid integrators.'
