- id: moat-durability-and-competitive-risks
  title: Moat durability, commoditization risk, and what would break the story
  body: 'The public record does not support a view that ONE owns an unassailable technical moat. Its best moat is situational: domestic policy alignment, U.S.-based manufacturing narrative, safe-LFP system design, and enough partner proof to matter. That can be valuable, but it is easier to erode than a scale monopoly. If larger incumbents localize more production in the U.S., or if policy support loses force, ONE risks becoming a smaller seller in a price-driven LFP market. The 2026 strategy pivot sharpens both sides of this argument. It helps ONE focus where domestic storage demand is growing, but it also weakens the company''s earlier passenger-EV differentiation and increases the importance of execution against much larger grid and component competitors. The adverse case is therefore commoditization, not technological impossibility. A durable positive case would therefore require evidence that ONE can keep enough domestic advantage, service depth, and partner conversion to avoid becoming
    a niche reseller in someone else''s supply chain.'
