callouts:
- calloutType: strength
  title: ONE has a credible wedge where domestic policy matters more than global volume
  body: ONE cannot out-scale CATL, BYD, or LGES, but it does not need to if buyers specifically value U.S. sourcing, Michigan manufacturing, and a domestic grid-component narrative.
  claimRefs:
  - CP016
  - CP019
  - CP028
- calloutType: risk
  title: The category can commoditize quickly if larger players localize
  body: ONE's moat is vulnerable if bigger incumbents add U.S. capacity or if domestic-content economics weaken. In that scenario, the contest shifts back toward price, service breadth, and installed-base scale.
  claimRefs:
  - CP017
  - CP029
  - CP035
- calloutType: insight
  title: Fluence is the most revealing grid comparator because it shows what mature software-plus-service competition looks like
  body: Against Fluence, ONE is not just competing on battery hardware. It is competing against a fuller integration, controls, warranty, and lifecycle-support stack that most young manufacturers have not yet matched publicly.
