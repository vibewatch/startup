- id: deployment-roadmap-and-maturity
  title: Deployment Proof, Roadmap, and Maturity
  body: 'Maturity is uneven across ONE''s portfolio, and the distinctions are important for diligence. The near-term proof set is strongest where the company can point to current hardware, pilot production, or third-party deployment references: OTP cells in Michigan production, commercial-vehicle integration with Shyft, grid hardware with published specs, the GE Vernova term sheet, and the West Virginia Aries Grid microgrid example. Gemini and Aries II provide more exciting upside, but the current public record around them is still more demo- and roadmap-oriented than revenue-oriented. That maturity gap widened after ONE paused passenger-EV investment and shifted the company narrative toward infrastructure, defense, rail, and grid applications. The practical result is that ONE now looks most credible as a domestic LFP component and system supplier, while the long-range passenger-EV roadmap remains the part of the stack most exposed to strategy drift and commercialization uncertainty.'
