- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role in system
  - Primary dependency
  - Key risk
  rows:
  - - LFP chemistry base
    - Provides safety, durability, and abundant-material cost narrative
    - Reliable domestic cell manufacturing and integrator acceptance
    - Energy-density gap versus high-nickel incumbents still has to be closed at system level
  - - Gemini dual-chemistry control layer
    - Combines daily-use LFP cells with long-range anode-free cells through DC-to-DC conversion
    - Converter efficiency and control logic
    - Commercial durability and cost remain mostly unproven publicly
  - - Module and pack system design
    - Raises usable density by using safety margin differently at pack and site level
    - Thermal/mechanical packaging expertise
    - Public data favors design claims over long-run field evidence
  - - Grid BMS and monitoring stack
    - Optimizes state-of-charge, balancing, safety, and integration
    - Firmware / software support and customer integration
    - Cybersecurity and performance claims are company-authored
  - - Michigan cell manufacturing + Piston pack assembly
    - Turns design claims into shippable domestic hardware
    - Yield, line uptime, and supplier coordination
    - Throughput and margin disclosure are absent
  - - Domestic-content compliance layer
    - Lets projects target IRA-style incentives and procurement screens
    - Evolving tax / sourcing rules and documentation quality
    - Rules can shift faster than marketing pages update
  notes: The architecture table treats chemistry, controls, manufacturing, and compliance as one operating system because ONE sells the combination, not just a cell datasheet.
