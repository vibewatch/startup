company:
  name: Our Next Energy (ONE)
chapter:
  number: 5
  title: Product & Technology
  summary: 'ONE''s product stack is materially broader than the early Gemini headline: the current public record spans commercial-mobility packs, fast-charge prismatic cells, grid modules and BMS hardware, plus Michigan pilot cell manufacturing and partner-led pack assembly. The strongest public proof sits with current LFP components and domestic grid products, while the most ambitious passenger-EV technologies—Gemini and Aries II—now carry more roadmap risk after the company''s 2026 strategic pivot away from heavy passenger-EV investment.'
sections:
- id: product-platforms-and-customer-workflow
  title: Product Platforms and Customer Workflow
  body: 'ONE''s public product story is now a component-and-system portfolio, not a single moonshot EV battery. The retained materials show four distinct layers buyers can touch: configurable Aries LFP packs for commercial mobility, Gemini as a dual-chemistry long-range architecture, OTP / TTP cells as sellable building blocks, and the Aries Grid stationary stack spanning cells, modules, BMS, and future containerized systems. The workflow matters because customers are not buying a generic battery pack off a shelf. Truck, bus, or specialty-vehicle integrators need configurable pack voltage, chassis fit, and validation support; stationary-storage buyers need domestic-content-qualified components that can slot into a familiar rack, BMS, and ESS architecture. ONE therefore looks less like a consumer-product company and more like a systems integrator selling chemistry, controls, and manufacturing access together. That framing is essential for later financial and customer analysis because purchase
    friction likely sits in qualification, compliance, and support, not only in battery list price.'
  claimRefs:
