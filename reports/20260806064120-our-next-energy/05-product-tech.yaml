- id: trust-quality-controls-and-open-risks
  title: Trust, Quality Controls, and Open Technical Risks
  body: 'ONE does provide more trust-language than many hardware startups. Its product pages cite UN 38.3, UL 1973, UL 9540A, MESA-compatible communications, cybersecurity-sensitive domestic BMS design, battery-passport traceability, and zero-waste or renewable-power manufacturing intentions. Those are valuable signals, especially for utility and government-adjacent buyers. But they are not the same thing as underwriting-grade reliability proof. The retained public set still does not disclose pack warranties, audited manufacturing yields, degradation curves in field use, or independent long-duration deployment data for Aries Grid. The same caveat applies to developer or practitioner signal: unlike a software company, ONE has no visible public code ecosystem, so the best public proxies are engineering recruiting and practitioner-media explainers. That is acceptable for a hardware company, but it still leaves technical depth and support quality harder to inspect from the outside than the product
    pages suggest. For diligence purposes, that means the next evidence tier should come from customer engineering references, audited quality systems, and post-install performance reporting rather than from additional marketing copy alone.'
