- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - ONE solution
  - Measurable benefit
  - Current limitation
  rows:
  - - Commercial truck or bus OEM needs durable pack for chassis integration
    - Select pack voltage and capacity, package hardware into chassis, validate durability and safety
    - Aries LFP configurable pack family
    - 62-316+ kWh flexibility and safe-LFP positioning
    - No public warranty or deployed-fleet-scale disclosure
  - - Passenger-EV advanced-battery team needs more range without NCM dependence
    - Prototype range-extender architecture, integrate controls, run validation car program
    - Gemini dual-chemistry pack and DC-to-DC converter
    - 608.1-mile BMW iX demonstration and reduced nickel/cobalt usage claims
    - Commercial path became less concrete after the 2026 pivot
  - - Mobility, defense, or infrastructure integrator needs a high-power domestic cell
    - Source cell samples, qualify fast charging and abuse performance, validate domestic content
    - OTP 110-116 Ah LFP cell
    - 12-minute 20-80% charging and Michigan production story
    - Customer adoption breadth and production economics are undisclosed
  - - Grid developer needs domestic-content-qualified stationary components
    - Choose cells, modules, and BMS that fit common racks and tax-credit rules
    - Aries Grid 314 Ah cell, 104.5 kWh module, and 1,500 V BMS
    - Common-form-factor rack path with IRA messaging
    - No public enclosure pricing or warranty data
  - - Utility or community microgrid sponsor needs an integrated storage project
    - Move from cell/module specs to site design, procurement, and deployment
    - Aries Grid systems and partner delivery path
    - West Virginia microgrid example and GE Vernova partnership
    - Field-performance and project-level economics remain sparse
  notes: 'ONE''s workflow is integration-heavy: customers buy pack, cell, controls, and domestic-compliance support together rather than a purely turnkey commodity product.'
