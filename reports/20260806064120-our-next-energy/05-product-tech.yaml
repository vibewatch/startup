  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: Audited warranty terms, degradation curves, recall history, and field-performance data for Aries Grid, OTP, and Aries mobility packs.
    whyItMatters: Hardware diligence depends on how cells and packs behave after shipment, not just on published specifications or certification labels. Without field data, public proof still overweights design intent relative to operating outcomes.
    diligencePath: Request warranty schedules, RMA data, field-failure logs, degradation datasets, and customer operating reports by product family.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: manufacturing-throughput
    missingEvidence: Current yield, throughput, scrap, and line-ownership metrics for ONE Circle cell production and Piston pack assembly.
    whyItMatters: The product thesis depends on repeatable domestic manufacturing. Without audited throughput and yield, it is impossible to tell whether public product readiness reflects commercial-scale operations or a pilot line with limited output.
    diligencePath: Request weekly production reports, line-capacity plans, FPY / yield dashboards, and the manufacturing-responsibility split between ONE and Piston.
    relatedQuestionRefs:
    - QE015
    - QE016
    relatedTableRefs:
    - TE001
    - TE005
  - type: stale
    severity: material
    topic: passenger-ev-roadmap
    missingEvidence: An updated post-2026 commercialization roadmap for Gemini and Aries II, including SOP timing, validation gates, and any surviving OEM programs.
    whyItMatters: Gemini and Aries II still shape the upside narrative, but the company pivoted away from passenger-EV investment. Without a fresh roadmap, historical demos can easily be mistaken for active go-to-market programs.
    diligencePath: Request the current product roadmap, OEM program list, validation milestones, and board-approved capital allocation by product line.
    relatedQuestionRefs:
    - QE023
    - QE024
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: developer-gap
    missingEvidence: A stronger practitioner-community proxy than recruiting pages and media explainers for technical support depth and product integration reputation.
    whyItMatters: ONE is a hardware company, so code-forge metrics are not expected. Still, better practitioner evidence would help assess how customers experience engineering support, firmware updates, and integration responsiveness.
    diligencePath: Collect integrator testimonials, conference talks by engineers using the product, installer forums, or public support materials that show real technical adoption patterns.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: grid-field-proof
    missingEvidence: Project-level operating data from the West Virginia microgrid, GE-related deployments, or other named Aries Grid installations.
    whyItMatters: Named deployments help the narrative, but investors need operating hours, uptime, round-trip performance, safety events, and customer outcomes to treat them as durable proof rather than marketing references.
    diligencePath: Request project commissioning reports, uptime / incident metrics, round-trip efficiency data, and customer signoff documents for named grid deployments.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE002
    - TE005
