tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Aries LFP mobility packs
    - Commercial-vehicle OEMs and specialty integrators
    - Shipping / integrator-facing pack platform
    - Configurable 62 kWh and 79 kWh packs with safe-LFP positioning
    - Need actual deployed fleet count, warranty terms, and ASPs
  - - Gemini dual-chemistry pack
    - Passenger-EV advanced battery teams
    - Prototype / demonstration stage
    - 600-plus-mile architecture using LFP plus anode-free range extender
    - Need post-pivot commercialization timing, cost, and validation beyond demo vehicles
  - - OTP mobility cell
    - Infrastructure, defense, and mobility integrators
    - Current sellable component with production underway
    - Fast-charge LFP cell with Michigan manufacturing and UN 38.3 certification
    - Need customer list, yields, and long-duration field data
  - - Aries Grid cell / module / BMS suite
    - Utility-scale storage developers and system integrators
    - Current component stack with technical pages and launch PR
    - Domestic-content-qualified cell, module, and BMS building blocks
    - Need third-party performance data and actual order conversion
  - - Aries Grid DC ESS
    - Utility and infrastructure buyers needing containerized DC systems
    - Roadmap / NDA-stage system
    - High site-level energy-density pitch with full-stack domestic positioning
    - Need released specifications, certifications, and pricing
  - - ONE Circle + Piston manufacturing stack
    - ONE and its downstream customers
    - Pilot cell production plus dedicated pack assembly line
    - Domestic cell-plus-pack narrative instead of imported-only supply
    - Need audited throughput, yield, and line-ownership detail
  notes: The matrix separates sellable products from enabling production assets because ONE's commercial story depends on both hardware SKUs and the manufacturing path behind them.
