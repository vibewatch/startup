      the milestone chronology.
    whyItMatters: >-
      The public milestone record is strong but still incomplete on the internal decisions and counterparties that drove
      the company's 2025-2026 reset.
    diligencePath: >-
      Request the internal board timeline, financing data room chronology, and customer cancellation notices to complete
      the record around the strategic pivot.
    relatedQuestionRefs:
      - QO021
      - QO024
      - QO027
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: som-gap
    missingEvidence: A defensible company-specific SAM or SOM by product line, geography, and buyer type.
    whyItMatters: >-
      Battery TAM figures are easy to find, but valuation depends on how much of that market ONE can actually target and
      supply. Public sources stop far short of a defensible share-of-market view.
    diligencePath: >-
      Request management's bottom-up pipeline model by segment, region, product family, win rate, ASP, and
