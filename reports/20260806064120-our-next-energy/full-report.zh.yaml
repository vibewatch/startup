      - number: '8.4'
        title: 建议、退出逻辑和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              本章结论是继续研究，置信度中、风险高、估值姿态偏高。这不是否定公司，而是说公开证据仍未达到新投资人应要求的门槛， 不能把旧独角兽基准当成可投资价格。最好情景可以理解：一家本土电池制造商，有真实对手方、政策支持，
              以及比 2023 年更清晰的电网叙事。但更稳固的公开结论是，价格支撑仍比产品和市场故事薄。若买方在历史 $1.2 billion 锚附近进场，
              即便扣除稀释、优先权和额外工厂资本需求后，也应看到强劲多年回报的可信路径。按今天的公开证据，这不能只靠乐观，
              还需要融资条款、流动性、积压订单转化、毛利率和复购韧性的直接证明。在这些出现前，最可能的退出路径不是短期 IPO，
              而是在更多商业化证据之后再进行一轮私人融资或战略交易。价格可以改变判断，证据也可以改变判断，但两者目前都还不够。
