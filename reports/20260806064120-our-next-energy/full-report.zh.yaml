        - 关税回撤、税收抵免弱化或不符合资格事件
        - 重新评估护城河，把它主要视为价格型优势
      - - 制造执行风险
        - 工厂和伙伴产出仍不透明或不及预期
        - 没有经审计的良率 / 吞吐量证据；相对既定里程碑延迟
        - 提高要求折现率或停止
      - - 客户集中风险
        - 具名验证点未能扩大
        - Shyft、GE 或工业项目没有带来后续需求
        - 大幅下调增长假设
      - - 人员风险
        - 再次大规模裁员或关键人员离职
        - 创始人、CTO、COO 或关键制造负责人流失
        - 除非补位异常强，否则视为投资逻辑破裂
    notes: 终止标准刻意设计成可监测项，投资人无需等完整年度周期就能更新判断。
    claimRefs:
      - CR035
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 投资建议
        - 继续研究
        - 足够值得继续尽调，但透明度不足以支撑按历史基准买入。
      - - 置信度
        - 中
        - 判断方向清楚，但精确公允价值仍受隐藏条款和未披露经济性左右。
      - - 风险评级
        - 高
        - 制造、融资、合作伙伴集中和披露风险仍在叠加，并没有相互抵消。
      - - 估值立场
        - 偏高
        - 相比当前公开证据包，历史 $1.2B 锚点支撑起来吃力。
      - - 目标回报 / 持有
        - 希望 4-6 年毛回报 >3x
        - 对后期电池制造项目入场而言，低于这个水平就补偿不了执行和稀释风险。
      - - 当前最可能退出路径
        - IPO 前再融资一轮私募，或战略出售
        - 要达到 IPO 准备状态，仍需要可公开披露的经营和财务指标。
      - - 上调触发项
        - 更干净的入场条件，或强得多的证据
        - 更低价格，或收入、毛利率和股权结构表的审计证据，可能把建议推向观察。
    notes: 该建议明确对价格敏感，把过去的独角兽基准视为历史参考点，而不是清晰的当前普通股估值标记。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV045
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 投资逻辑
        - 重置后，公司仍有真实交易对手、已披露采购订单和本土政策支持。
        - 更多具名客户、重复订单和已确认收入披露，会显著强化这一点。
      - - 投资逻辑
        - 电池储能需求增长，让其转向电网和基础设施市场具备战略合理性。
        - 如果电网产品发布和项目管线转化为可见部署和经济性，判断会更强。
      - - 投资逻辑
        - 只要执行守得住，ONE 的工业资产基础和制造版图足够大，足以产生影响。
        - 如果良率、利用率和营运资本数据证明工厂能经济化扩产，判断会改善。
      - - 反向逻辑
        - 当前最强指标仍是订单和伙伴验证，不是收入、利润率或现金生成。
        - 经审计的收入确认、毛利率和回款数据，会直接削弱这条反对意见。
      - - 反向逻辑
        - 历史 $1.2B 锚点早于 2026 年战略重置，可能已不适合收窄后的业务。
        - 需要清晰披露的估值上行融资，或更强的 2026-2027 经营证据，才能支撑持平或上行。
      - - 反向逻辑
        - 2025 年融资条款仍未披露，因此无法评估稀释和优先权包袱。
        - 干净的股权结构表资料包和最新条款清单，会显著增强估值支撑。
    notes: 各行把公司质量和特定价格下是否可投分开；主要缺口是经济性可见度，而不是没有业务。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV013
      - CV015
      - CV036
      - CV037
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 显性假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 订单快速转化为确认收入，2027 年电芯路线图按时落地，尽调显示利润率合理且股权结构表干净。
        - 当前价值区间 $1.10B-$1.40B；只有新证据补上经济性缺口，旧基准才站得住。
        - 仍取决于后期制造爬坡和伙伴转化是否被证明可持续。
        - 有可能，但未来 12-18 个月需要补齐多项缺失证明。
      - - 基准
        - 伙伴验证保持完整，电网转型仍可信，但公开收入、利润率和融资条款继续不透明。
        - 当前价值区间 $0.70B-$0.95B；即便战略相关性成立，标记也应低于旧基准。
        - 即便是真实公司，只要经济性和资本堆叠仍隐藏，也可能估值过高。
        - 最符合当前保留下来的公开证据。
      - - 悲观
        - 订单滑坡，2027 年发布延期，融资条款显得防守，或集中度加剧。
        - 当前价值区间 $0.40B-$0.65B；相对历史独角兽锚点意味着明显下调。
        - 电池制造爬坡、融资重置和客户集中会快速压缩价值。
        - 如果 2026-2027 年执行不及预期或资本市场收紧，这一情景权重不低。
    notes: 这些是基于公开证据的估值讨论区间，不是管理层指引或现金流折现结果。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Fluence (FLNC)
        - 市值和 TTM 收入
        - 市值约 $2.62B，TTM 收入约 $2.58B（~1.0x）
        - 最接近的已规模化西方 BESS 集成商，也是衡量电网相关性的强基准。
        - 盈利仍为负且有集中风险，因此不是干净的成熟盈利可比公司。
      - - Stem (STEM)
        - 市值和 TTM 收入
        - 市值约 $52M，TTM 收入约 $150M（~0.35x）
        - 当执行和商业模式转型削弱信心时，公开市场会多严苛，Stem 给出了参照。
        - 现在更像软件转型故事，而不是直接的电池制造可比公司。
      - - Energy Vault (NRGV)
        - 市值和 TTM 收入
        - 市值约 $0.54B，TTM 收入约 $0.21B（~2.6x）
        - 对有真实部署、项目属性重的储能平台，是有用的中档可比公司。
        - 收入集中度高，业务组合也不完全等同于 ONE。
      - - Eos Energy (EOSE)
        - 市值和 TTM 收入
        - 市值约 $1.38B，TTM 收入约 $0.16B（~8.6x）
        - 显示公开市场仍会给美国电池制造的未来期权定价。
        - 毛利率为负且融资结构复杂，意味着它是投机性的上限可比，而不是干净的同业中位数。
    notes: 这个集合刻意收窄，并以公开市场为基础。它圈定了投资人如何给美国相关储能业务定价，但不能替代对 ONE 自身经济性的直接尽调。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the four most relevant named public storage comparables requested for this chapter; excludes diversified
        Asian battery majors and distressed micro-caps outside the requested set.
    claimRefs:
      - CV019
      - CV020
      - CV022
      - CV023
      - CV024
      - CV025
      - CV027
      - CV028
      - CV030
      - CV031
  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 商业转化失败
        - 到 2026 年底 / 2027 年，已披露订单和伙伴关系仍未转化为可见收入或交付
        - 削弱“重置创造了可变现业务、而非新叙事”的论点
        - 除非价格大幅重置，否则从继续研究转向回避
      - - 防守型融资条款
        - 下一轮尽调显示惩罚性优先权、深度稀释或结构化救援资本
        - 即便运营改善，也可能抹掉普通股上行空间
        - 要求有效入场价大幅降低，否则退出
      - - 制造延误
        - 2027 年电芯路线图或设施爬坡明显延后
        - 在固定成本和融资需求持续存在时，把价值兑现推得更晚
        - 下调乐观情景概率，并提高要求回报
      - - 集中度加剧
        - 一两个交易对手仍贡献大部分验证和潜在收入
        - 叙事层面比经济性层面更容易降风险
        - 在客户广度改善前，把增长假设视为脆弱
      - - 政策支持减弱
        - 本土化含量、激励或关税优势明显收缩
        - 压窄 ONE 相对更大或更便宜供应商的切入优势
        - 下调护城河评级，并压低可接受估值
    notes: 这些触发项刻意设计成可监测，并直接对应当前基准最终能否站得住。
    claimRefs:
      - CV013
      - CV016
      - CV037
      - CV040
      - CV042
      - CV044
      - CV049
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先股堆叠
        - 最新股数、清算优先权、反稀释、参与型条款，以及任何强制跟投结构
        - 即便运营进展不错，这些也可能主导普通股回报
        - 要求提供最新融资文件、股权结构表桥接和律师摘要
      - - 收入与积压订单转化
        - 按垂直领域确认的收入、积压订单账龄、ASP、客户验收里程碑和定金
        - 区分需求叙事和变现现实
        - 要求提供月度订单预订到开票桥接和客户合同摘要
      - - 毛利率和质保状况
        - 按产品线划分的毛利率、质保准备金政策，以及服务 / 现场故障成本
        - 决定规模化是在创造价值，还是吞掉现金
        - 要求提供经审计的毛利率桥接，以及可靠性 / 质保报告
      - - 现金、烧钱速度和债务
        - 当前流动性、月度烧钱速度、债务契约，以及任何工厂或项目融资
        - 后期制造企业更常死在现金时点，而不是市场需求
        - 要求提供 13 周现金流、债务明细表和契约资料包
      - - 客户集中度耐久性
        - 重复订单状态、账户级管线、取消情况，以及当前验证点之外的多元化
        - 需要用它区分少数锚点和可持续商业基础
        - 要求提供 CRM 导出、收入集中度明细表，以及续约 / 扩张状态
    notes: 缺失证据都是数字和文件。因此管理层要么能快速澄清估值争议，要么不能。
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
