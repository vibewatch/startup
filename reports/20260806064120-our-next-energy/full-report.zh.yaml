              固定式储能栈。工作流很重要，因为客户买的不是货架上的通用电池包。卡车、公交或专用车辆集成商需要可配置的电池包电压、底盘适配和验证支持；固定式储能买家需要符合本土含量要求的组件，能接入熟悉的机架、BMS 和 ESS
              架构。因此，ONE 更像一家把化学体系、控制和制造入口打包出售的系统集成商，而不是消费产品公司。这个框架对后续财务和客户分析至关重要，因为采购摩擦很可能落在认证、合规和支持上，不只落在电池标价上。
