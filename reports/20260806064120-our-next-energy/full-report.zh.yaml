      - number: '2.2'
        title: 测算口径显示宏观需求巨大，但 ONE 的楔形市场更窄
        blocks:
          - type: paragraph
            body: >-
              宏观需求无疑很大。IEA 认为 2025 年 EV 电池部署约 1.2 TWh；全球电池储能新增达到 108 GW，更广义 BESS 装机约 315 GWh。在美国，SEIA 和 Benchmark
              报告称，2025 年储能部署 57.6 GWh，2026 年 Q1 创纪录达到 9.7 GWh，并预计到 2030 年年装机将超过 110 GWh。Clean Investment Monitor
              也显示，美国本土电池制造管线规模庞大：截至 2025 年 Q1，运营中电芯产能为 202 GWh，运营中模组产能为 208 GWh，2035 年潜在规模可超过 1 TWh。但这些数字不是 ONE 的
              SAM。它们描述的是海，不是可捕捞的池塘。ONE 能支撑的楔形市场，是一个重视本土含量的子集：买家需要美国制造 LFP 组件或系统，并愿意承受集成和认证周期来获得这些供应。
