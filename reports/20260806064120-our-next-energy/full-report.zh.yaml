      - number: '6.2'
        title: 采用轨迹和具名客户证据
        blocks:
          - type: paragraph
            body: >-
              最好的漏斗顶部客户指标已经较旧，但仍有用。ONE 曾表示，截至 2022 年 3 月拥有 4 份客户合同，总量超过 25 GWh；截至 2023 年 2 月拥有 10 份协议，总量 36
              GWh。这些说法显示客户兴趣不止一个吸睛演示，但底层账户并未全部具名，因此仍很难承销。具名证据在公开来源给出具体交易对手和项目时最强。BMW 显示工程验证和商业化对话。Shyft
              显示一个具体商用车平台及预期电池包量。GE Vernova 显示进入美国储能项目的渠道，而 West Virginia 微电网证明 Aries Grid
              已到达工业场地用例。合在一起，这些都是有意义的信号，但仍只是一个小而异质的具名基础。实际含义是，客户宽度在协议层面看起来强于具名账户层面，这就是后续财务分析必须对收入转化保持保守的原因。Blue Arc
              自己的商业网站也显示，Shyft 关系绑定的是一个真实工作卡车平台，面向包裹、零售和公用事业工况，而不只是概念车。BMW 同样仍有战略相关性，因为其 Debrecen 工厂已在 2025 年底让 Neue
              Klasse iX3 进入量产，确认 ONE 与 BMW 的关系靠近一个正在运行的 OEM EV 项目，尽管公开来源仍未给出生产采购授予。
