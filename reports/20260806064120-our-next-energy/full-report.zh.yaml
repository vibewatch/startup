      - CR021
      - CR025
      - CR036
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律、运营和依赖风险如何传导到收入、融资和估值。
    data:
      nodes:
        - id: r1
          label: 政策与激励依赖
        - id: r2
          label: 制造 / 良率不确定性
        - id: r3
          label: 合作伙伴与客户集中度
        - id: r4
          label: 收入转化风险
        - id: r5
          label: 融资信心
        - id: r6
          label: 估值与投资逻辑韧性
      edges:
        - from: r1
          to: r4
          label: 可能改变竞争力和项目资格
        - from: r2
          to: r4
          label: 拖慢交付并挤压利润率
        - from: r3
          to: r4
          label: 验证点或订单流失会伤及增长
        - from: r4
          to: r5
          label: 转化疲弱会加大现金跑道压力
        - from: r5
          to: r6
          label: 融资压力削弱估值韧性
        - from: r1
          to: r6
          label: 政策支持退潮，护城河就会变弱
    approximationNotes: 该图简化了反馈回路，但抓住了运营和政策向融资与价值传导的主线。
