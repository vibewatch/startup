  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和正确对标集
        blocks:
          - type: paragraph
            body: >-
              不能把 ONE 当成同时追逐所有电池终端市场的公司来测算规模。公开产品集和 2026
              年战略指向更窄的边界：面向商用移动出行、固定式储能、基础设施或国防应用销售的美国本土磷酸铁锂组件和系统。因此，纳入的支出应从电芯、模组、电池管理硬件、移动出行电池包和集装箱式储能系统开始，因为这些场景的买家看重美国制造、安全性和供应链透明度。排除的支出包括无关的可再生能源发电资本开支、ONE
              似乎已不再优先追逐的纯消费 EV 电池需求，以及没有电池组件的电网升级。替代方案也不止一家对手创业公司。中国 LFP 进口、既有 NCM
              车用电池包，以及非电池备电或韧性解决方案，都会按具体用例争夺同一笔买方预算。实际操作中，这一框架能让后续客户、竞争者和估值章节锚定在 ONE 仍清楚想服务的市场上。
