  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 2026 年转向后，ONE 主要剩余风险的相对可能性和严重性。
    data:
      columns:
        - 可能性
        - 严重性
        - 缓释成熟度
        - 剩余敞口
