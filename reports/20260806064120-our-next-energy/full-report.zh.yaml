  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和政策暴露
        blocks:
          - type: paragraph
            body: >-
              ONE 公开层面的法律和监管风险，更能说明它省略了什么，而不是清楚证明了什么。公司发布了承包商条款和隐私政策，但没有丰富的公开诉讼、许可或执法记录。这意味着可见法律风险主要是结构性的：Michigan
              法下的合同责任分配、隐私和信息安全义务、潜在传票或业务转让暴露，以及与公共激励和本土含量主张绑定的合规义务。Michigan
              工厂支持包带来真实上行空间，但如果就业、投资或运营目标落空，也可能带来返还追索或里程碑合规风险。贸易政策也有双面性：对中国电池提高关税和 45X
              式激励可以在战略上帮助公司，但也让业务更依赖不稳定的政策支持。同样的法律图景延伸到雇佣和隐私监管。只要重组加剧，WARN 式义务就重要；只要制造商在控制环境未被充分证明的情况下收集网站、客户或招聘数据，FTC
              式隐私和安全预期就重要。由于 ONE
              尚未披露完整合规材料包，这些问题仍是活的尽调事项，而不是已经关闭的问题。融资沟通是另一个治理表面。即使是私人公司，也处在活跃证券执法背景之下；因此，叙事重置、未披露融资细节和新的募资需求叠加，提高了董事会和披露控制纪律的重要性。
