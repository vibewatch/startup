    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局和产品范围
        blocks:
          - type: paragraph
            body: >-
              Our Next Energy 通常以 ONE 为品牌，是一家 2020 年成立、总部位于 Novi 的 Michigan 电池公司。公司现在把 one.ai
              作为主要公开网站，并称自己的使命是为车辆、可再生能源和电网打造耐用、安全、可持续的储能解决方案。保留下来的官方页面显示，ONE 在 Michigan 有两个运营地点：Novi 总部，以及位于 Belleville
              / Van Buren Township 的 ONE Circle 超级工厂。公开材料呈现的产品族也不止乘用 EV 电池。除面向商用移动出行的 Aries LFP 电池包外，ONE 还推广 Gemini
              双化学体系续航扩展技术、Aries Grid 固定式储能系统，以及面向移动出行、基础设施和国防应用的 OTP 方形 LFP 电芯。这一点很重要，因为 2026 年的故事不只是 ONE 能否造出续航更长的 EV
              电池，而是公司放弃乘用 EV 规模化野心之后，是否已经拼出足够真实的产品宽度和本土制造能力，撑过一次市场转向。
