  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、估值锚和入场纪律
        blocks:
          - type: paragraph
            body: >-
              ONE 的估值争论要从一个尴尬但重要的事实开始：保留公开来源中，最新完全披露的价格锚仍是 2023 年 2 月 Series B 轮， 投后估值 $1.2 billion。2025 年 3
              月战略轮显然重要，因为它让创始人 Mujeeb Ijaz 回到 CEO 位置，也引入了 Crescent Ventures、Trousdale Ventures 和 Ivanhoe
              Capital。但该轮没有公开金额或估值。这个缺口比标题本身更重要。 投资人无法从公开证据判断，新资本相对 2023 年基准是溢价、平价还是折价进入，也看不到该轮是否带有强优先权保护。 同一时期还包括 Just
              Climate 领投的 Series C 尝试失败，这直接提醒投资人：资本并没有按此前预期自由流入。 因此，入场纪律必须把 $1.2 billion
              视为历史基准，而不是干净的当前价格标记。支撑该价格的业务也变了： 公司退出更宽的乘用 EV 野心，如今要求投资人承销一个更窄的电网、铁路、防务和工业制造故事。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
