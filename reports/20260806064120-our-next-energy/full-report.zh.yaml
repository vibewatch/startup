      nodes:
        - id: u1
          label: 宽泛协议主张
          description: 2022 年 4 个客户 / 25 GWh，2023 年 10 份协议 / 36 GWh
        - id: u2
          label: 具名开发或供应交易对手
          description: BMW、Shyft、GE Vernova、BHE Renewables / PCC 生态
        - id: u3
          label: 验证或部署里程碑
          description: 608 英里演示、Shyft 验证、GE 条款清单、West Virginia 站点
        - id: u4
          label: 复购 / 留存证据
          description: 公开来源基本未披露
      edges:
        - from: u1
          to: u2
        - from: u2
          to: u3
        - from: u3
          to: u4
    approximationNotes: 这个漏斗解释了为什么客户广度在协议层面看起来更强，但到留存证据层面会变弱。
    claimRefs:
      - CU002
      - CU003
      - CU019
      - CU021
      - CU036
