        title: 分销权力、切换成本和合作伙伴作用
        blocks:
          - type: paragraph
            body: >-
              电池领域的竞争力不只看化学体系，还看谁能快速通过认证、反复交付，并在安装后支撑系统。公开证据显示，Fluence
              和全球最大电池制造商在这些维度上仍占上风，因为它们披露了全球运营规模、更完整的控制栈和更成熟的服务叙事。ONE 用另一套组合反击：Michigan 制造、45X 顺风定位，以及 GE
              Vernova、BMW、Shyft、Pomega 等能让它看起来比未验证电池实验室更可融资的交易对手。即便如此，买方切换成本会双向作用。平台一旦验证，BMS
              和系统选择会形成锁定；验证之前，多供应商并行很常见，供应商也能被替换或双来源采购。这种动态偏向最大或最本土化的供应商，除非 ONE
              持续把证据点转化为可重复项目。因此，合作伙伴质量和安装后执行比简单功能清单更具战略意义，尤其是在客户可以双来源采购电芯，却很难在项目中途重新认证完整系统时。
