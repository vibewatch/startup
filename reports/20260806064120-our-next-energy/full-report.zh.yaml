companyProfile:
  summary: >-
    Our Next Energy（ONE）是一家位于 Michigan 州 Novi 的电池制造商，由 Mujeeb Ijaz 于 2020 年创立。公司围绕更安全的磷酸铁锂系统、Gemini 长续航概念，以及 Michigan
    ONE Circle 的本土电芯制造建立品牌。截至 2023 年 2 月 Series B，公开披露股权融资至少 3.9 亿美元；2025 年 3 月战略轮披露了新投资方，但未披露轮次规模或估值。2026 年 1 月，ONE
    暂停乘用 EV 投资，转向轨道交通、国防、公用事业级储能和工业韧性市场，并希望借 3500 万美元新增采购订单实现现金流盈亏平衡。
