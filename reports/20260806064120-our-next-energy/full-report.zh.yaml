      - number: '2.3'
        title: 买方分层、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              最关键的是三类买方。第一类是公用事业级储能开发商、EPC 和公用事业规划团队，它们需要符合本土含量要求的电芯、模组、BMS 硬件，并最终需要完整系统。第二类是商用车和专用平台
              OEM，它们更在意电池包适配、耐久性和充电表现，而不是亮眼的化学体系主张。第三类是寻找韧性本土电力系统的工业、基础设施和国防相关买家。三类买家都有一个共同特征：公开记录显示采用路径很吃认证。买家先定义工况周期或可靠性问题，再审查技术适配和合规性，验证试点或早期部署，之后才会扩大采购。这就是为什么具名证据比抽象
              TAM 数学更重要。BMW、Shyft、GE Vernova 和 West Virginia 微电网分别照亮不同客户分层，说明 ONE 的市场多垂直，但从证据点转化为规模采购仍处于早期。
