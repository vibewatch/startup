              电芯和模组签署条款清单。2025 年 5 月与 Pomega 的协议也显示，公司在缓解供应链风险：在 Michigan 完全爬坡之前先增加短期 314 Ah 电芯供应。但同一条时间线也暴露压力。ONE 在
              2023 年末宣布裁员 128 人，2024 年 3 月又裁员 37 人。TechCrunch 报道称，早前的 Series C 计划在 Just Climate 撤回拟领投的 1 亿美元支票后瓦解。最终事件是
              2026 年 1 月重置：ONE 暂停汽车 EV 投资，裁减约 45% 员工，并围绕轨道交通、国防和公用事业级储能重塑自己，同时披露 3500 万美元新增采购订单。与支撑 2023 年 12 亿美元 Series
              B 估值的 2022–2023 年叙事相比，这已经是一家实质不同的公司。
