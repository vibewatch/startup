  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分层地图和什么算客户
        blocks:
          - type: paragraph
            body: >-
              理解 ONE 客户群，最清楚的办法是分成四类：乘用 EV 开发伙伴、商用移动出行 OEM
              或集成商、电网或渠道交易对手，以及工业或基础设施买家。公开记录也说明了定义为什么重要。有些交易对手是真正终端客户，有些是开发伙伴，还有一些像渠道型项目伙伴，能把 ONE 硬件带进更大的部署。这个区别重要，因为
              BMW 工程项目、Shyft 设计定点和 GE Vernova
              项目条款清单都有价值，但它们意味着不同购买动作、决策人和收入转化概率。因此，本章先把具名交易对手当作细分市场相关性的证明；只有来源披露实际部署范围或预期采购量时，才把它们当作规模化变现的证明。投资人应把客户标识读成
              ONE 能在哪些地方拿到会议和验证工作的地图，而不是每个可见名字都已是耐久生产客户的证明。
