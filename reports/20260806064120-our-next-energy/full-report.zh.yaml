      - number: '1.3'
        title: 融资历史、投资人组合和公共支持
        blocks:
          - type: paragraph
            body: >-
              对一家年轻电池制造商来说，ONE 已经搭起很大的资本栈，但其中真正披露清楚的部分少于头部叙事给人的印象。公开记录中的股权轮次始于 2021 年 10 月 2500 万美元 Series A，随后是 2022 年由
              BMW i Ventures 领投的 6500 万美元轮次，最后是 2023 年 2 月 3 亿美元 Series B，投后估值 12 亿美元。也就是说，在 2025 年 3 月战略轮之前，已披露股权融资至少
              3.9 亿美元；这轮战略融资披露了领投方，但规模和隐含价格仍未公开。与此同时，Michigan 为 ONE Circle 工厂承诺了 2.366 亿美元公共支持，包括 2 亿美元赠款、1500
              万美元贷款和一项税收豁免。风险投资 / 成长资本与大额公共激励并行，是尽调案例的核心：ONE 不是资本轻薄的实验室创业公司，而是一家规模化命题同时押注私募资本市场和州支持产业政策的公司。未解的问题是，未披露的
              2025 年融资到底是强势跟投增长资本、平价救助融资，还是早期 Series C 努力受挫后条件更让步的资本重组。
