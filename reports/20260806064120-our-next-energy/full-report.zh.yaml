            body: >-
              公开记录里最强的竞争事实，是规模集中。2025 年 CATL 和 BYD 两家就控制了全球 EV 电池装机的一半以上，而中国仍掌握超过 80% 的制造产能。这意味着 ONE
              面对的不是碎片化战场，而是在和规模作战。在这个背景下，竞争者角色各不相同。Fluence 是成熟电网集成商，有软件、质保和运营规模。Form Energy 对部分公用事业预算来说是长时储能技术替代品，但不是直接的
              2–4 小时 LFP 同行。LGES、CATL、BYD 和 Gotion 代表广泛的电芯制造产能和客户触达。ONE 的公开强项更窄：契合本土含量要求、以安全为导向的 LFP
              定位，以及在多个垂直里仍可信的一组具名合作伙伴和客户。实际含义是，ONE 必须靠楔形市场适配和认证经济性取胜，因为它不可能在纯规模竞赛中赢过全球最大制造商或最成熟的电网集成商。
