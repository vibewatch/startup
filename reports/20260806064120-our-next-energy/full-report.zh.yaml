      - number: '5.4'
        title: 信任、质量控制和未解决技术风险
        blocks:
          - type: paragraph
            body: >-
              相比许多硬件创业公司，ONE 确实给出更多信任语言。其产品页面提到 UN 38.3、UL 1973、UL 9540A、MESA 兼容通信、重视网络安全的本土 BMS
              设计、电池护照可追溯性，以及零废弃或可再生电力制造意图。尤其对公用事业和政府相邻买家来说，这些都是有价值的信号。但它们不等于可用于承销的可靠性证明。保留的公开材料仍未披露电池包质保、经审计制造良率、现场使用中的衰减曲线，或
              Aries Grid 的独立长周期部署数据。同样的保留意见也适用于开发者或从业者信号：不同于软件公司，ONE
              没有可见的公开代码生态，所以最好的公开代理变量是工程招聘和从业者媒体解读。对硬件公司来说这可以接受，但它仍让外部比产品页面暗示的更难检查技术深度和支持质量。尽调上，下一层证据应来自客户工程引用、经审计质量体系和安装后性能报告，而不是更多营销文案。
