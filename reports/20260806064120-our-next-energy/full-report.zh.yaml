            body: >-
              公开扩张故事可信，但还不耐久。BMW 可能从演示推进到产品路线图，Shyft 从验证推进到车队项目，GE Vernova
              从条款清单推进到重复项目拉动，电网组件销售也可能从样品推进到更广部署。但集中度风险仍高，因为公开可见的具名集合很小，且战略上混杂。2025–2026 年转向让风险更尖锐：如果乘用 EV
              项目放缓，未来收入更大比例可能依赖电网、基础设施和国防渠道，而这些渠道销售周期长，披露交易对手更少。换句话说，ONE
              可能有多条扩张路径，但除非公司能证明具名证据在战略重置后转化为可重复订单，否则这些路径看起来狭窄且高度依赖执行。当前客户风险因此不只是总市场兴趣，而是少数具名账户能否继续撑起商业叙事，同时更新的电网和基础设施买家仍在认证中。制造背景在这里也重要。Piston
