      - number: '8.2'
        title: 2026 年重置后的投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              估值逻辑的正面确实存在。重置之后，ONE 仍有具名证据点：已披露的 $35 million 采购订单、GE Vernova 条款清单、 Shyft 项目、Pomega 供应协议，以及 West Virginia
              工业场址引用。Michigan 激励支持和 ONE Circle 建设表明， 公司在工业规模上运营，而不是停留在演示文稿规模。市场背景也帮忙：IEA 称电池储能是增长最快的电力技术，
              因此转向固定式储能不是没道理。反向逻辑同样真实。这些证据点多数仍是商业信号，不是已确认收入。 当前最强指标是采购订单，不是经审计销售额。一些关键产品交付时间表仍延伸到 2027
              年。公司也放弃了最初支撑其独角兽标签的更宽乘用 EV 框架， 而公开记录在收入、利润率和股权结构质量上仍很薄。因此，估值问题不是这里有没有一家公司。公司当然存在。
              问题是，当前公开证据是否足以让投资人按“更窄的重置后业务已在经济性上跑通”来付费。答案是否定的。
