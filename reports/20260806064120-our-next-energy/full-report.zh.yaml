      - number: '2.4'
        title: 增长驱动、采用约束和估值真正该看什么
        blocks:
          - type: paragraph
            body: >-
              增长驱动是真实的：储能部署正在加速，数据中心和制造负载带来更多电网灵活性需求，LFP 化学体系已在储能中占据主导，45X 和 ITC bonus
              等本土激励也明显改善了美国制造的论证。但约束同样重要。中国仍主导制造产能，价格压力激烈，上游 LFP 材料并未真正多元化，政策波动已经导致数十亿美元美国制造项目取消。需求本身也并不单一：美国储能强劲，但 2025
              年乘用 EV 电池动能弱得多，这有助于解释 ONE 的战略转向。估值上，正确结论不是“市场巨大”。更准确地说，ONE
              现在位于一个真实且快速增长的美国本土储能和组件楔形市场，但采购摩擦、中国相关竞争和政策不稳定都可能实质推迟变现。因此，投资人不应只测试市场规模，还要测试哪些垂直能足够快地跨过政策、采购来源和认证门槛，在竞争对手进一步压低价格前支撑重复订单。
