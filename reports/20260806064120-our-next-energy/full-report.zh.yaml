          - type: callout
            title: 证据点过于集中，比公开市场叙事暗示的更危险
            body: 少数合作伙伴和客户——GE Vernova、Shyft、BMW 以及 West Virginia 项目——撑起了很大一部分故事。只要其中一两个转弱， 叙事就可能迅速松动。
