      - number: '8.3'
        title: 上市可比公司的边界与情景区间
        blocks:
          - type: paragraph
            body: >-
              上市可比公司能给案例划边界，但不能自动定价。Fluence 看起来是最接近的规模化西方 BESS 标的，市值 / 收入大约 1x， 但它仍亏损，客户集中度也高。Stem 按市值 /
              收入看低得多，反映它从硬件转售撤出时的痛苦转型，以及软件规模化故事仍未解开。 Energy Vault 在收入倍数上高于 Fluence，尽管集中度重、项目时点风险高。Eos
              按当前收入在这组中最贵，尽管毛利率为负， 这说明在储能估值里，未来改善和融资选择权仍能影响很大。ONE 要吸取的教训就在这里。约 0.35x 到 8.6x 的过去收入倍数区间太宽；
              没有公司特定经济性，不能把它换算成精确的私营公司目标。不过这个区间仍有价值，因为它说明 $1.2 billion 基准有多苛刻。 取决于投资人采用哪一种公开视角，ONE 需要大约 $140 million 到超过
              $3.4 billion 的年收入，才机械支撑这一估值。 保留的公开来源没有一个能让人相信 ONE 目前接近任何门槛。
