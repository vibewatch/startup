  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从历史价格锚和当前验证出发，推导“继续研究”的决策链。
    data:
      nodes:
        - id: n1
          label: 历史 $1.2B 锚点
          detail: 最后一次完整披露的价格标记来自 2023 年 2 月 Series B。
        - id: n2
          label: 2025 轮次条款不透明
          detail: 最新轮次披露了投资方，但未披露规模或估值。
        - id: n3
          label: 2026 年重置改变投资逻辑
          detail: 乘用 EV 故事收窄到电网 / 铁路 / 国防 / 工业。
        - id: n4
          label: 有验证，但范围窄
          detail: 订单、GE、Shyft、Pomega 和工业场景引用都重要。
        - id: n5
          label: 可比公司区间宽且不稳
          detail: 公开储能可比公司从困境到投机，跨度很大。
        - id: n6
          label: 继续研究
          detail: 在把历史锚点当作今天可投的依据之前，先做更多尽调。
      edges:
        - from: n1
          to: n6
          label: 旧锚点本身不够
        - from: n2
          to: n6
          label: 价格无法清晰尽调
        - from: n3
          to: n6
          label: 锚点之后业务已显著改变
        - from: n4
          to: n6
          label: 验证足够支撑继续尽调
        - from: n5
          to: n6
          label: 公开可比公司只能框定案例，不能给它定价
    approximationNotes: 该流程有意保持定性；瓶颈在披露质量，而不是叙事潜力。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV013
      - CV030
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在不同公开可比收入倍数视角下，支撑 $1.2B 标记所需的收入。
    data:
      items:
        - label: 类 Stem ~0.35x
          value: 3460
          unit: USD M required revenue
          detail: 针对艰难转型叙事的公开市场视角，置信度很低。
        - label: 类 Fluence ~1.0x
          value: 1180
          unit: USD M required revenue
          detail: 最接近的已规模化西方 BESS 基准。
        - label: 类 Energy Vault ~2.6x
          value: 470
          unit: USD M required revenue
          detail: 更高倍数的项目平台可比公司。
        - label: 类 Eos ~8.6x
          value: 140
          unit: USD M required revenue
          detail: 偏投机的美国电池制造上界视角。
    approximationNotes: 上述点位锚定历史 $1.2B 数字，只是机械的公开可比敏感性点，并不是对 ONE 当前实际收入的判断。
    claimRefs:
      - CV019
      - CV022
      - CV024
      - CV027
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于公开证据的当前价值区间，对照历史独角兽基准。
    data:
      items:
        - label: 悲观
          low: 400
          value: 525
          high: 650
          unit: USD M
          detail: 延期、防御性融资，或订单转化疲弱。
        - label: 基准
          low: 700
          value: 825
          high: 950
          unit: USD M
          detail: 战略意义还在，但经济性和条款仍不完整。
        - label: 乐观
          low: 1100
          value: 1250
          high: 1400
          unit: USD M
          detail: 订单完成转化，2027 年推出落地，尽调厘清经济性与股权结构表质量。
    approximationNotes: 上述区间来自公开证据包和同业边界的讨论，不是 DCF 或管理层预测。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会式快照：为什么公司仍值得关注，但仅凭公开证据还无法定价。
    data:
      items:
        - label: 建议
          value: research-more
          note: 商业验证已有，但价格支撑仍不成立。
        - label: 置信度
          value: medium
          note: 方向性判断强于精确公允价值。
        - label: 风险
          value: high
          note: 执行、融资和集中度风险仍层层叠加。
        - label: 历史披露锚点
          value: $1.2B
          note: 仍是留存来源中最后一个完整披露的估值标记。
        - label: 当前披露中最强的分母
          value: $35M orders
          note: 信号有用，但不是已确认收入。
        - label: 公开可比收入倍数区间
          value: ~0.35x to ~8.6x
          note: 储能股权定价仍高度不稳。
        - label: 投资判断准备度
          value: low-medium
          note: 需要股权结构表、流动性、利润率和在手订单转化验证。
    approximationNotes: 上述指标由留存证据推导，是投委会启发式判断，不是公司上报的董事会 KPI。
    claimRefs:
      - CV001
      - CV006
      - CV030
      - CV038
      - CV039
      - CV040
      - CV041
