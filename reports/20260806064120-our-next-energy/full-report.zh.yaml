  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局和正确对标集
        blocks:
          - type: paragraph
            body: >-
              ONE 很容易被归错类，因为它的产品组合同时覆盖多种电池任务。公司现在销售或推广商用移动出行电池包、本土电网组件和先进乘用 EV 概念，所以正确的竞争对手不是整齐一排电池创业公司。Aries Grid
              的直接对标包括 Fluence 这样的集成商，以及大型 LFP 电芯或模组供应商。Aries 移动出行电池包的直接对标，是服务整车 OEM 或专用集成商的规模化电芯供应商。Factorial
              及类似先进电池公司更像相邻玩家，而非完全直接对手，因为它们更多是在与 Gemini 或 Aries II 竞争，而不是与今天的本土电网栈竞争。最后，替代方案也重要：进口中国供应、既有 NCM
              项目和非电池韧性解决方案都可能吸收同一笔买方预算。这一点很重要，因为后续估值工作应拿 ONE 与今天真正能赢下同一预算科目的供应商比较，而不只是与任何使用“battery”这个词的公司比较。
