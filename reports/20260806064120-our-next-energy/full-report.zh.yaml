      - number: '1.2'
        title: 管理层梯队、治理能见度和关键人集中度
        blocks:
          - type: paragraph
            body: >-
              ONE 仍是一家创始人色彩很重的公司。Mujeeb Ijaz 在一个商业化困难阶段离开 CEO 岗位约 15 个月后，于 2025 年 3 月回任首席执行官。公司公开列出的高管团队相对精简，包括 Mujeeb
              Ijaz、Dr. Deeana Ijaz、Nathan Saliga、Carl Sickles 和 Erik Strang；这更像紧凑的运营架构，而不是层级完整的后期公司高管班子。领导层时间线很关键。2023 年
              12 月，创始董事 Paul Humphries 接替 Ijaz 出任 CEO，Ijaz 转任 CTO 和副董事长，Faysal Sohail 出任董事长。到 2025 年 3 月，Humphries
              退休，Ijaz 重新担任 CEO，Mansoor Ijaz 和 Hinrich Woebcken 随新资本一同加入董事会。这些动作说明，公司从乘用 EV
              野心转向商业化止血时，投资人和内部人正在主动重组控制权。主要治理缺口在于，ONE 会在新闻稿中披露部分董事，但网站上没有完整的现任董事名单、委员会结构，或清晰的独立治理框架。
