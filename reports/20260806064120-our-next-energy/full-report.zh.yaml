      - number: '7.4'
        title: 财务模型风险、剩余暴露和放弃标准
        blocks:
          - type: paragraph
            body: >-
              财务模型的风险在于，转型修复故事可能仍压在公开资料无法验证的假设上。Just Climate 受挫、2025 年融资重置条款未披露， 以及公司所称 2026
              年底现金流盈亏平衡，都指向同一个问题：这家公司在现金跑道、利润率和订单转化上仍需要仔细审查。 即便市场需求真实，转向后的业务也可能失败：订单转得不够快、激励不再起作用，或在位厂商本地化后压低价格。
              因此，正确的缓释姿态应以触发条件为核心：投资人要盯交付里程碑、团队稳定性、复购证据，以及本土政策优势是否仍足以抵消规模劣势。
              没有这些证明，剩余风险仍高。这也是为什么即便叙事听起来好转，风险姿态仍应保守。一个依赖订单更快转化、政策支持更稳定、
              运营底座更精简的转型可以成立，但前提是这些变量迅速对齐。在公司拿出更强的运营和财务证据前，审慎做法是先承销下行， 再给上行定价。
