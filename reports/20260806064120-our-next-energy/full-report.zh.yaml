            body: >-
              客户分析最大的弱点是耐久性。保留的公开来源没有给出净收入留存、毛留存、续约率、流失、活跃部署、满意度分数，甚至没有给出 2026 年当前客户数量。这很重要，因为 ONE
              所处品类里，初始兴趣容易宣布，转化为重复销量却很难：原型需要认证，电池需要安全和耐久签核，电网项目需要采购、融资和许可。因此，当前证据证明的是相关性和部分早期采用动作，不是一台成熟的经常性客户机器。即便最好的引用——BMW、Shyft、GE
              Vernova 和 West
              Virginia——也仍需按阶段区分：演示、设计定点、渠道条款清单，还是项目部署。尽调中缺少的桥梁不是另一句宣传引语，而是客户层面的证据：已部署系统或车辆项目保持活跃足够久，能产生重复需求。
