  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: Exact size, price, and post-money valuation of the March 2025 strategic round.
    whyItMatters: Without round size and price, it is impossible to know whether the 2025 capital came in flat, up, or down to the 2023 Series B and whether dilution or rescue financing terms were punitive.
    diligencePath: Request the 2025 financing deck, board consent, and cap-table bridge showing new money, instrument type, and ownership changes.
    relatedQuestionRefs:
    - QO025
    - QO027
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and investor control rights after the 2025 board additions.
    whyItMatters: Governance visibility is limited to selective press-release mentions, which prevents assessment of board independence, veto rights, and whether investors or insiders now dominate strategic decisions.
    diligencePath: Request the current board list, observer rights, protective provisions, and the latest governance deck or charter package.
    relatedQuestionRefs:
    - QO006
    - QO028
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-burn
    missingEvidence: Current revenue, gross margin, monthly burn, and cash balance behind the end-2026 cash-flow breakeven target.
    whyItMatters: The turnaround thesis hinges on near-term financial performance, but retained public sources do not disclose revenue quality, backlog conversion, or liquidity.
    diligencePath: Request monthly management accounts, 13-week cash flow, backlog-to-revenue bridge, and FY2026 budget versus actuals.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: An independent 2026 source reconciling the 100+ employee claim with the post-layoff operating footprint.
    whyItMatters: Current headcount is a proxy for operating scale and cost discipline, but the company statement is not independently corroborated in retained sources.
    diligencePath: Cross-check payroll or benefits census with an HR roster and the January 2026 WARN filing attachments.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone coverage
    missingEvidence: Private board decisions, undisclosed customer cancellations, and unpublished financing terms that would complete the milestone chronology.
    whyItMatters: The public milestone record is strong but still incomplete on the internal decisions and counterparties that drove the company's 2025-2026 reset.
    diligencePath: Request the internal board timeline, financing data room chronology, and customer cancellation notices to complete the record around the strategic pivot.
