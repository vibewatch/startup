- id: leadership-governance
  title: Leadership bench, governance visibility, and key-person concentration
  body: ONE remains a founder-centric company. Mujeeb Ijaz returned to the chief executive role in March 2025 after spending roughly fifteen months out of the CEO seat during a commercially difficult period. The company publicly lists a relatively small senior team—Mujeeb Ijaz, Dr. Deeana Ijaz, Nathan Saliga, Carl Sickles, and Erik Strang—which suggests a compact operating structure rather than a fully layered late-stage executive bench. The leadership chronology is important. In December 2023, founding board member Paul Humphries replaced Ijaz as CEO while Ijaz became CTO and vice-chairman, and Faysal Sohail became chairman. By March 2025, Humphries retired, Ijaz resumed the CEO role, and new board members Mansoor Ijaz and Hinrich Woebcken were added alongside fresh capital. These moves imply that investors and insiders were actively reconfiguring control as the company moved from passenger-EV ambition toward commercialization triage. The main governance gap is that ONE discloses selected
    directors in press releases but does not publish a full current board roster, committee structure, or clear independent-governance framework on its site.
