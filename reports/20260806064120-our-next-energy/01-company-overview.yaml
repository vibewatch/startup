- calloutType: strength
  title: ONE has real industrial proof points that many battery startups never reach
  body: Michigan factory incentives, pilot LFP cell production, pack manufacturing with Piston Automotive, the Shyft supply award, and the BMW Gemini demonstration collectively show that ONE progressed well beyond lab-stage battery storytelling.
  claimRefs:
  - CO026
  - CO028
  - CO030
  - CO033
  - CO035
- calloutType: risk
  title: The 2026 story is a strategic retreat from the original passenger-EV scale thesis
  body: By January 2026 ONE had paused automotive EV investments, cut roughly 45% of staff, and reframed itself around rail, defense, and grid systems. That may improve survivability, but it also breaks comparability with the assumptions implicit in the 2023 unicorn valuation.
  claimRefs:
  - CO022
  - CO043
  - CO044
  - CO045
  - CO047
