- id: capital-public-support
  title: Funding history, investor mix, and public support
  body: 'ONE has assembled a large capital stack for a young battery manufacturer, though less of that stack is cleanly disclosed than the headline narrative often suggests. Publicly documented equity rounds start with a $25 million Series A in October 2021, expand with a $65 million 2022 round led by BMW i Ventures, and culminate in a $300 million Series B in February 2023 at a $1.2 billion post-money valuation. That puts disclosed equity at at least $390 million before the March 2025 strategic round, whose size and implied price remain undisclosed even though the lead investors are named. In parallel, Michigan committed $236.6 million of public support to the ONE Circle factory, including a $200 million grant, a $15 million loan, and a tax exemption. This pairing of venture/growth capital with large public incentives is central to the diligence case: ONE is not a lightly capitalized lab startup, but a company whose scale-up thesis relied on both private capital markets and state-backed
    industrial policy. The unresolved question is whether the undisclosed 2025 funding represented strong follow-on growth capital, a flat rescue financing, or a more concessionary recapitalization after the earlier Series C effort faltered.'
  claimRefs:
  - CO019
  - CO020
  - CO022
