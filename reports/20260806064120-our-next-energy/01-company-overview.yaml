company:
  name: Our Next Energy (ONE)
chapter:
  number: 1
  title: Company Overview
  summary: Our Next Energy (ONE) is a Novi, Michigan battery manufacturer founded in 2020 that built its brand around safer lithium iron phosphate systems, Gemini long-range architecture, and a domestic battery supply chain. Publicly disclosed equity funding totals at least $390 million through the 2023 Series B, with a March 2025 strategic round led by Crescent Ventures, Trousdale Ventures, and Ivanhoe Capital but without publicly disclosed size or valuation. The company secured unusually large Michigan factory support, launched cell and pack pilot production, then materially reset strategy in January 2026 by pausing passenger EV efforts and pivoting toward rail, defense, and utility-scale storage after multiple layoffs.
sections:
- id: identity-footprint
  title: Identity, footprint, and product scope
  body: 'Our Next Energy, commonly branded as ONE, is a Michigan-based battery company founded in 2020 and headquartered in Novi. The company now uses one.ai as its main public website and describes its mission as building durable, safe, and sustainable energy storage solutions for vehicles, renewables, and the grid. The retained official pages show a two-site Michigan operating footprint: headquarters in Novi and the ONE Circle gigafactory in Belleville/Van Buren Township. Public materials present a broader product family than a single passenger-EV battery story. In addition to Aries LFP packs for commercial mobility, ONE markets Gemini dual-chemistry range-extension technology, Aries Grid stationary storage systems, and OTP prismatic LFP cells for mobility, infrastructure, and defense applications. This matters because the 2026 story is not merely whether ONE can build a longer-range EV battery; it is whether the company has assembled enough real product breadth and domestic manufacturing
    capability to survive a market pivot after abandoning passenger-EV scale ambitions.'
