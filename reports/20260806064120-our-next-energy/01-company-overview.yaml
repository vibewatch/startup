  title: Publicly disclosed capital is large, but the newest money is the least transparent
  body: The early funding history is relatively clear, whereas the March 2025 strategic round names its lead investors but omits size and pricing. That opacity makes it impossible to tell whether the company reset from strength or negotiated a rescue-oriented bridge during a restructuring period.
