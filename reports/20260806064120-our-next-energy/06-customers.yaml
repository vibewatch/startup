  - CU009
  - CU012
  - CU013
- calloutType: risk
  title: The named customer set is still small and strategically mixed
  body: Because the public proof base is concentrated in a handful of development, channel, and project references, a single stalled program can have an outsized impact on the perceived customer story.
  claimRefs:
  - CU023
  - CU024
  - CU035
- calloutType: insight
  title: The hardest missing metric is not logo count but durability
  body: Public sources show who is interested in ONE, but not who renews, reorders, or scales after initial validation. That is the difference between proof of relevance and proof of a durable customer franchise.
  claimRefs:
  - CU021
  - CU022
  - CU036
