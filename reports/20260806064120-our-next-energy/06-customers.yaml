- id: durability-retention-and-what-public-sources-cannot-prove
  title: Durability, retention, and what public sources cannot prove
  body: 'The main customer-analytics weakness is durability. No retained public source gives net revenue retention, gross retention, renewal rates, churn, active deployments, satisfaction scores, or even a current customer count for 2026. That matters because ONE operates in categories where initial interest is easy to announce but hard to convert into recurring volume: prototypes need qualification, batteries need safety and durability signoff, and grid projects need procurement, financing, and permitting. The current evidence therefore proves relevance and some early adoption motion, not a mature recurring customer machine. Even the best references—BMW, Shyft, GE Vernova, and West Virginia—still need to be distinguished by stage: demo, design win, channel term sheet, or project deployment. For diligence, the missing bridge is not another promotional quote but customer-level evidence that deployed systems or vehicle programs stayed active long enough to generate repeat demand.'
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU032
  - CU033
  - CU034
  - CU036
