  - TU006
- id: expansion-paths-concentration-and-post-pivot-customer-risk
  title: Expansion paths, concentration, and post-pivot customer risk
  body: 'The public expansion story is plausible but not yet durable. BMW could have progressed from demo to product roadmap, Shyft from validation to fleet programs, GE Vernova from term sheet to recurring project pull-through, and grid component sales from samples to broader deployments. Yet concentration risk remains high because the publicly visible named set is small and strategically mixed. The 2025-2026 pivot makes that more acute: if passenger-EV programs slowed, then a larger share of future revenue may depend on grid, infrastructure, and defense channels that have long sales cycles and fewer disclosed counterparties. In other words, ONE may have multiple paths to expand, but those paths appear narrow and execution-sensitive unless the company can show that named proofs converted into repeatable orders after the strategic reset. That makes current customer risk less about total market interest and more about whether a handful of named accounts can continue carrying the commercial
    narrative while newer grid and infrastructure buyers are still being qualified. Manufacturing context matters here too. Piston Automotive’s assembly-centered operating model is a reminder that even apparently simple design wins need an execution stack behind them before they become durable production customers.'
