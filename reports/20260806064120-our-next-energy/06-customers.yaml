callouts:
- calloutType: strength
  title: ONE has more real customer proof than a pure lab-stage battery startup
  body: BMW, Shyft, GE Vernova, and the West Virginia project show that the company has crossed from concept pitch to named counterparties across multiple verticals.
  claimRefs:
