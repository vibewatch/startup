  - - Component buyers
    - Integrators seeking domestic cells or samples
    - OTP / TTP cell qualification
    - Sample or volume-order language on product pages
    - Expands surface area beyond full packs or systems
    - No named 2026 component customer roster
  notes: The table separates end customers, development partners, and channel relationships because each implies a different level of commercial maturity.
