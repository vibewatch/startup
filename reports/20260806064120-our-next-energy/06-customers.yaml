  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Customer-level renewals, reorders, active deployments, satisfaction scores, and churn metrics by segment.
    whyItMatters: Battery design wins matter, but a durable customer franchise is built on repeat orders and stable deployments. Public sources do not yet prove that transition.
    diligencePath: Request cohort revenue, reorder logs, active-site status, reference calls, and support-ticket escalation data by named customer.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by customer, channel, and product line after the 2026 pivot.
    whyItMatters: A small named customer set can hide dangerous dependency on one or two counterparties, especially when some references are still pre-production or channel-based.
    diligencePath: Request top-10 customer revenue, backlog, pipeline weighting, and cancellation exposure for 2025-2026.
    relatedQuestionRefs:
    - QU021
    - QU026
    relatedTableRefs:
    - TU005
  - type: stale
    severity: material
    topic: customer-shift
    missingEvidence: An updated 2026 account map showing which historical agreements survived the strategic reset.
    whyItMatters: Historical customer counts can overstate current traction if passenger-EV or other pre-pivot programs slowed, paused, or were cancelled.
    diligencePath: Request the current CRM export or board customer summary that tags every historical account as active, paused, lost, or converted.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU002
    - TU005
  - type: missing-source
    severity: minor
    topic: proof-quality
    missingEvidence: Additional named customer references beyond BMW, Shyft, GE Vernova, and the West Virginia project.
    whyItMatters: The public evidence base is credible but concentrated; more named accounts would reduce the risk that the visible story is atypical.
    diligencePath: Collect case studies, conference talks, procurement notices, or customer quotes for at least three additional named accounts.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU003
