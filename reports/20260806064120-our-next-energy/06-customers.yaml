chapter:
  number: 6
  title: Customers
  summary: ONE has progressed beyond anonymous demand claims into a real but still narrow set of named counterparties. The strongest public customer proof spans BMW as a development validator, Shyft as the clearest commercial-mobility design win, GE Vernova as a grid channel, and the West Virginia microgrid as an industrial site reference, but public evidence still stops short of durable metrics such as renewals, repeat orders, active deployments, or revenue concentration after the 2026 strategic pivot.
sections:
- id: segment-map-and-what-counts-as-a-customer
  title: Segment map and what counts as a customer
  body: 'ONE''s customer base is easiest to understand if it is split into four groups: passenger-EV development partners, commercial-mobility OEMs or integrators, grid or channel counterparties, and industrial or infrastructure buyers. The public record also shows why definitions matter. Some counterparties are true end customers, some are development partners, and some are channel-like project partners who can carry ONE hardware into a broader deployment. That distinction matters because a BMW engineering program, a Shyft design win, and a GE Vernova project term sheet are all valuable, but they imply different buying motions, decision makers, and revenue conversion odds. The chapter therefore treats named counterparties as proof of segment relevance first and proof of scaled monetization only when the source discloses actual deployment scope or expected purchase volume. Investors should therefore read logos as a map of where ONE can get meetings and validation work, not as proof that
    every visible name is already a durable production customer.'
  claimRefs:
  - CU001
  - CU005
  - CU011
  - CU015
  - CU016
  - CU017
  - CU019
  tableRefs:
  - TU001
- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named customer proof
  body: The best top-of-funnel customer metrics are old but still useful. ONE said it had four customer contracts totaling more than 25 GWh by March 2022 and ten agreements totaling 36 GWh by February 2023. Those claims show that customer interest was broader than one splashy demo, but they remain difficult to underwrite because the underlying accounts are not all named. Named proof is strongest where the public source gives a concrete counterparty and program. BMW shows engineering validation and commercialization dialogue. Shyft shows a specific commercial-vehicle platform with an expected pack volume. GE Vernova shows a channel into U.S. storage projects, while the West Virginia microgrid proves that Aries Grid reached an industrial site use case. Together these are meaningful signals, but they still represent a small and heterogeneous named base. The practical implication is that customer breadth looks better at the agreement level than it does at the named-account level, which is why
    later financial analysis must stay conservative on revenue conversion. Blue Arc’s own commercial site also shows that the Shyft relationship is attached to a real work-truck platform aimed at parcel, retail, and utility duty cycles, not just a concept vehicle. BMW similarly remains strategically relevant because its Debrecen plant moved the Neue Klasse iX3 into series production at the end of 2025, confirming that ONE's BMW relationship sits next to a live OEM EV program even if public sources still stop short of a production sourcing award.
  claimRefs:
