    - Deploy Aries packs in Class 3-5 trucks
    - Shyft / Blue Arc design win
    - Potential recurring pack demand if fleets launch
    - Need active fleet rollout and reorder data
  - - Utility / storage channel
    - Storage solutions business, project developers, utility projects
    - Supply modules and cells into BESS projects
    - GE Vernova term sheet
    - Could scale through channel partnerships
    - Need actual deployed project count and economics
  - - Industrial / microgrid sponsor
    - Industrial-site sponsor, renewable developer, project capital stack
