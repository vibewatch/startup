    - TR002
  - type: private-evidence-only
    severity: material
    topic: runway-and-cap-table
    missingEvidence: Current cash balance, burn rate, debt or project-finance obligations, and post-2025 cap-table terms.
    whyItMatters: The turnaround can fail even with demand if financing terms are weak or runway is too short.
    diligencePath: Request cap-table bridge, monthly cash reports, debt schedule, and 13-week cash flow.
