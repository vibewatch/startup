- id: operational-and-quality-risk
  title: Operational, quality, and manufacturing risk
  body: 'The public operational risk picture is still dominated by scale-up uncertainty. ONE has pilot cell production, retooled facilities, battery-safety messaging, and clear technical documentation for some products. But none of those prove that the company has solved yield, throughput, warranty, or field-performance risk at commercial scale. Public safety pages emphasize validation and chemistry advantages, yet they do not substitute for independent operating data. The same is true for grid controls and cybersecurity: the BMS page highlights security, but the public record does not show external audits or breach history. Because battery companies fail more often on industrialization than on lab claims, these unresolved manufacturing and quality-data gaps remain among the most serious risks in the file. The additional challenge is that the company is changing both product mix and commercial segment at the same time. A factory can hit technical milestones but still miss commercial readiness
    if line changeovers, supplier quality, or warranty learning curves take longer than planned. For investors, that makes the lack of audited operational dashboards a central rather than peripheral concern.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
