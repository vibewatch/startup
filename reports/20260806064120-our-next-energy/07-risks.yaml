  - - Policy-sensitivity risk
    - Domestic-content economics weaken materially
    - Tariff rollback, credit erosion, or non-qualification event
    - Re-underwrite moat as mostly price-based
  - - Manufacturing execution risk
    - Factory and partner output remain opaque or disappoint
    - No audited yield / throughput evidence; delays against stated milestones
    - Increase required discount rate or stop
  - - Customer concentration risk
    - Named proof points fail to expand
    - Shyft, GE, or industrial projects do not lead to follow-on demand
    - Cut growth assumptions sharply
  - - People risk
    - Further major layoffs or key departures occur
    - Loss of founder, CTO, COO, or critical manufacturing leaders
    - Treat as thesis break unless backfill is unusually strong
  notes: Kill criteria are intentionally monitorable so investors can update the view without waiting for a full annual cycle.
