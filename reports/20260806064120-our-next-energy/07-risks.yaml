  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: manufacturing-data
    missingEvidence: Audited yield, throughput, scrap, warranty, and field-performance data across ONE Circle, Novi, and partner lines.
    whyItMatters: Most scale-up failures appear here, yet public sources provide only milestone and marketing signals.
    diligencePath: Request weekly production dashboards, FPY / yield reports, warranty accruals, and field-failure logs.
    relatedQuestionRefs:
