callouts:
- calloutType: risk
  title: The biggest risk is industrial execution after a strategic reset
  body: ONE no longer lives or dies on a single passenger-EV battery dream; it now lives or dies on whether retooled facilities and a narrower customer set can ship reliably into grid, rail, and defense markets.
  claimRefs:
  - CR009
  - CR010
  - CR018
  - CR035
- calloutType: strength
  title: Policy alignment and domestic manufacturing still offer real protection
  body: Tariffs, domestic-content rules, and Michigan-backed manufacturing can help ONE against imported competitors if the company actually executes on delivery and qualification.
  claimRefs:
  - CR005
  - CR006
  - CR012
  - CR016
- calloutType: insight
  title: Proof-point concentration is more dangerous than the public market narrative implies
  body: A small set of partners and customers—GE Vernova, Shyft, BMW, and the West Virginia project—does a large amount of work in supporting the story. If even one or two of those weaken, the narrative could unravel quickly.
