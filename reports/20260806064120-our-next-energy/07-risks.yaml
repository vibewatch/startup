company:
  name: Our Next Energy (ONE)
chapter:
  number: 7
  title: Risks
  summary: ONE's risk profile is no longer dominated by whether the underlying battery idea is interesting; it is dominated by whether a smaller post-pivot company can execute industrially, keep enough domestic-policy advantage, and convert a handful of strategic proof points into repeatable revenue before financing pressure returns. The public record points to serious but not fatal risk in manufacturing scale-up, policy dependence, partner concentration, and runway opacity, with limited mitigation evidence beyond the company's strategic narrowing and domestic-manufacturing narrative.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory, legal, and policy exposure
  body: 'ONE''s public legal and regulatory surface is more revealing for what it omits than for what it clearly proves. The company publishes contractor terms and a privacy policy, but not a rich public litigation, permit, or enforcement record. That means the visible legal risk is mostly structural: Michigan-law contract allocation, privacy and information-security obligations, potential subpoena or business-transfer exposure, and compliance obligations tied to public incentives and domestic-content claims. The Michigan factory package created real upside but also potential clawback or milestone-compliance risk if jobs, investment, or operating targets are missed. Trade policy cuts both ways too: higher tariffs on Chinese batteries and 45X-style incentives can help the company strategically, but they also make the business more dependent on unstable policy support. The same legal picture extends into employment and privacy oversight. WARN-style obligations matter whenever restructuring
    intensifies, and FTC-style privacy and security expectations matter whenever a manufacturer collects web, customer, or recruiting data without a fully evidenced control environment. Because ONE is not yet disclosing a broad compliance pack, these issues remain live diligence items rather than closed questions. Capital-raising communications are another governance surface. Even private companies operate against an active securities-enforcement backdrop, so the combination of narrative resets, undisclosed financing details, and a renewed fundraising need increases the importance of disciplined board and disclosure controls.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR031
  - CR032
  - CR042
  - CR043
