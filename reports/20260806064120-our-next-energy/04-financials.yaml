chapter:
  number: 4
  title: Financials
  summary: ONE's financial story is easier to describe than to underwrite. Public materials now show orders, named counterparties, factory-scale ambition, and policy support, but they still do not disclose the accounting and liquidity numbers required to judge revenue quality, margin path, or runway. The result is a company with visible commercial opportunity but persistently high financing and transparency risk.
sections:
- id: revenue-model-and-public-traction
  title: Revenue model and public traction signals
  body: 'The public record points to a project-and-hardware revenue model rather than a software or subscription model. ONE now frames its commercial focus around rail, defense, utility-scale storage, and industrial microgrid use cases, with the strongest near-term disclosed number being $35 million of new purchase orders. That figure matters because it is more concrete than a generic market-opportunity claim, but it still should not be confused with recognized revenue. The other visible demand signals are design wins, term sheets, expected supply volumes, and partner selections: GE Vernova for grid storage, Shyft for commercial EV packs, and BHE-linked industrial microgrid work in West Virginia. Each supports the existence of demand, yet none discloses price, gross profit, or revenue-recognition timing. The 314 Ah grid-cell page also pushes part of the story into 2027 deliveries, which means portions of the current top-line narrative are still about future conversion rather than present
    monetization.'
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI007
  - CI010
  - CI011
