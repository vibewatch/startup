- id: cost-structure-unit-economics-and-capital-intensity
  title: Cost structure, unit economics, and capital intensity
  body: 'ONE''s economic profile looks like that of a manufacturing-heavy battery company: large factory investment, long ramp cycles, supplier dependence, and meaningful working-capital needs before cash is collected. Michigan described the ONE Circle campus as up to $1.6 billion of capital investment, while ONE itself has emphasized pilot production, a 20 GWh site, and manufacturing expansion. Those disclosures say more about capital intensity than about profitability. They show that the company is building an industrial asset base that could create scale leverage, but also one that could consume cash for longer than management expects if yields, utilization, or project conversion lag. The Pomega supply arrangement may improve delivery confidence, yet it also underscores that key cost and margin variables sit inside private partner economics. Public comps reinforce the point: even companies with disclosed revenue and SEC filings can show dramatically different valuation and margin expectations,
    meaning investors cannot back into ONE''s unit economics from market narrative alone. That missing numerical detail matters enormously.'
  claimRefs:
  - CI005
  - CI006
