- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: The public evidence on capital adequacy is directionally useful but numerically incomplete. On the positive side, ONE still has policy support, named counterparties, and enough order narrative to argue for continued financing relevance. On the negative side, TechCrunch reported that a planned $100 million Just Climate investment failed to materialize, and the January 2026 reset paired the new strategy with a 45% workforce reduction and a target of end-2026 cash-flow breakeven. That combination strongly suggests management is pulling both financing and expense-control levers simultaneously. Yet the decisive numbers—cash, burn, runway, debt, and project-finance obligations—remain undisclosed in the retained public sources. Investors therefore can see the financing dependency, but not quantify it. The incentive package helps, but it does not replace unrestricted balance-sheet cash or eliminate the risk that a factory-scale battery business needs more capital before the narrower strategy
    reaches durable self-funding.
  claimRefs:
  - CI002
