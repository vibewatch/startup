  and the reality of its January 2026 reset. It is not strong enough to establish current revenue, gross margin, cash
  runway, cap-table seniority, or the price of the March 2025 strategic round. The final judgment therefore stays
  price-sensitive and evidence-sensitive rather than treating the old unicorn benchmark as settled fair value.
