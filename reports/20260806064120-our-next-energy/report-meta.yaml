  topStrengths:
    - Named counterparties still exist after the reset, including GE Vernova, Shyft / Blue Arc, BMW validation work, and the West Virginia industrial-site reference.
    - Michigan support, ONE Circle, and domestic-manufacturing positioning give the company a real industrial wedge rather than a lab-only battery story.
    - The pivot toward grid, infrastructure, and resilience markets aligns with a battery-storage market that is still growing rapidly.
  topRisks:
    - The March 2025 round did not disclose valuation or preference terms, so entry discipline remains impossible from public evidence alone.
    - Revenue, gross margin, cash runway, and debt remain undisclosed, which is unusually problematic for a capital-intensive battery manufacturer.
    - The named customer and partner set is still narrow, so valuation depends heavily on whether a few proof points convert into repeatable revenue.
  unresolvedGaps:
    - Latest price per share, cap-table seniority, liquidation preferences, and anti-dilution terms from the 2025 financing.
    - Recognized revenue, backlog conversion, ASP, gross margin, warranty profile, and working-capital requirements by product line.
    - Current cash balance, monthly burn, debt or project-finance obligations, and the next 12-18 month capital plan.
    - Repeat-order durability and concentration after the 2026 strategic pivot, including actual conversion of orders into delivered systems.
