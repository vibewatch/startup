companyProfile:
  summary: >-
    Our Next Energy (ONE) is a Novi, Michigan-based battery manufacturer founded in 2020 by Mujeeb Ijaz. The
    company built its brand around safer lithium iron phosphate systems, Gemini long-range concepts, and domestic cell
    manufacturing at ONE Circle in Michigan. Publicly disclosed equity totals at least $390 million through the
    February 2023 Series B, while the March 2025 strategic round named new investors but not round size or valuation.
    In January 2026, ONE paused passenger-EV investment and repositioned toward rail, defense, utility-scale storage,
    and industrial resilience markets while targeting cash-flow breakeven on the back of $35 million of new purchase
    orders.
  foundedDate: '2020-01-01'
  founders:
    - name: Mujeeb Ijaz
      role: Founder and CEO
      background: Former battery and vehicle executive who returned as CEO in March 2025 and remains the central strategic, product, and financing figure in ONE's public story.
      claimRefs: [CO001, CO007, CO014, CO015]
  foundingLocation: Michigan, USA
  headquarters: Novi, Michigan
  productSummary: >-
    Battery platforms spanning Aries LFP mobility packs, Gemini dual-chemistry range-extension concepts, Aries Grid
    and related stationary-storage products, and domestic LFP cell manufacturing plus partner-supplied large-format
    cells.
  customerFocus: >-
    Commercial-mobility OEMs and integrators, utility-scale storage channels, industrial and infrastructure buyers,
    and selected defense or rail applications rather than broad consumer vehicle demand.
  businessModel: >-
    Hardware and project-oriented battery sales: packs, cells, modules, and systems sold through direct customer
    programs and partner channels, with economics still undisclosed publicly.
  stage: late-stage private
  fundingStatus: >-
    At least $390 million of disclosed equity through the February 2023 Series B, plus a March 2025 strategic round
    led by Crescent Ventures, Trousdale Ventures, and Ivanhoe Capital that did not disclose size or valuation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO006, CO022, CO025, CO043, CO045, CV002, CV003]
summary:
  headline: >-
    ONE has enough product, customer, and policy evidence to stay investable in principle, but the public record still
    does not justify paying the historical unicorn benchmark as though the post-pivot business were already proven.
