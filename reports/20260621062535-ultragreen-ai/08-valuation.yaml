- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Share-price reset below IPO zone after results
    - Sustained trading below roughly US$1.45 after earnings or guidance
    - Would signal that the IPO rerating was not durable
    - Wait for a lower, re-underwritten entry point rather than averaging down on sentiment
  - - Guidance miss
    - FY2026 revenue outlook cut below the US$170M-US$190M range
    - Breaks the base and bull cases built on current public guidance
    - Reduce fair-value range and revisit all multiples
  - - Disclosure disappointment
    - No meaningful backlog, ARR, or concentration detail in later results
    - Keeps the stock dependent on narrative rather than quality of revenue
    - Maintain track stance and refuse premium multiple expansion
  - - Safety or regulatory setback
    - Material adverse event, warning escalation, or slower hospital adoption due to protocols
    - Raises discount rate and weakens expansion assumptions
    - Increase caution; move toward stretched/avoid stance
  - - Dilutive issuance beyond ordinary plan expectations
    - Large capital raise or equity issuance without commensurate growth proof
    - Erodes per-share upside even if enterprise value grows
    - Rebuild valuation on a new share base before adding exposure
  notes: The triggers are intentionally monitorable and tied to publicly observable disclosures or market prints.
