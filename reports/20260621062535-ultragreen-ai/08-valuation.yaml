- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation logic
  - Probability signal
  - Key risk
  rows:
  - - Bear
    - FY2026 revenue at low end (US$170M), 7x-8x EV/revenue, no disclosure uplift
    - US$1.37B-US$1.54B equity value; about US$1.24-US$1.39 per share
    - Would emerge if growth de-rates and disclosure stays thin
    - Share price falls back toward or below IPO as enthusiasm normalizes
  - - Base
    - FY2026 revenue ~US$180M, 9x-10x EV/revenue, public-company execution remains steady
    - US$1.80B-US$1.98B equity value; about US$1.63-US$1.79 per share
    - Supported by profitability, cash, and existing market demand
    - Needs guidance conversion without major safety or concentration surprises
  - - Bull
    - FY2026 revenue at high end (US$190M), 11x-13x EV/revenue, stronger quality-of-revenue disclosure
    - US$2.27B-US$2.65B equity value; about US$2.05-US$2.40 per share
    - Closest to the upside implied by DBS target and strong demand
    - Requires both operational execution and better disclosure quality
  - - Reference point
    - IPO pricing at US$1.45 on ~1.103B shares
    - ~US$1.60B equity value and ~US$1.42B enterprise value
    - Actual cleared price in December 2025
    - Already embeds a meaningful uplift over the last private mark
  notes: Scenario values are internal reference-point ranges built from public guidance and net cash, not claims about management’s fair value target.
