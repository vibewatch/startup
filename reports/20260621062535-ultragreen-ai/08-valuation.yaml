- id: internal-reference-point-valuation
  title: Internal reference-point valuation with bull / base / bear ranges
  body: 'Because peer data in the retained cache are thin and not cleanly comparable, the best valuation discipline is to anchor on UltraGreen.ai’s own public economics, cash balance, and forward guidance, then stress the range with conservative and aggressive EV/revenue assumptions. At the IPO price, the company traded around 11.2x FY2025 revenue and about 10.0x EV/revenue after cash. At the first-day high, those metrics moved to roughly 12.5x and 11.3x, while the DBS-marked price implied about 11.9x and 10.6x. Those are not obviously absurd given 85% gross margin and strong profitability, but they do mean a lot of the easy repricing from the US$1.3 billion private mark to public trading happened immediately. The bear, base, and bull cases therefore matter more than imperfect external comps: downside is partly cushioned by profitability and cash, upside depends on actually converting FY2026 growth into repeatable revenue quality rather than just sustaining market enthusiasm.'
