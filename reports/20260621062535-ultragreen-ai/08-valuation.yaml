company:
  name: Ultragreen.ai
chapter:
  number: 8
  title: Valuation
  summary: UltraGreen.ai’s last private mark of about US$1.3 billion and its December 2025 IPO price of US$1.45 per share can be reconciled into a public-equity reset of roughly US$1.60 billion, or about 23% above the pre-IPO valuation. FY2025 profitability and net cash make that pricing broadly supportable, but thin peer data, missing recurrence and concentration disclosure, and real safety/protocol risks argue for a track recommendation rather than an automatic buy above the IPO range.
sections:
- id: private-mark-to-public-ipo-bridge
  title: Reconciling the private mark with IPO pricing
  body: 'UltraGreen.ai is unusual in that both the last private step-up and the IPO price are visible enough to build a clean bridge. The strongest pre-IPO source is Allen & Gledhill, which says roughly 14.42% of UltraGreen.ai Private Limited was sold in September 2025 at a US$1.3 billion equity valuation to a syndicate including 65 Equity Partners, Vitruvian, and August Global. The prospectus then provides the public reset point: 112,068,200 shares offered at US$1.45, including 103,448,300 new shares and 8,619,900 vendor shares. Using the prospectus share split history, the best public reconstruction is about 1.103 billion post-IPO shares before any over-allotment exercise, implying around US$1.60 billion of equity value at the offer price. That means the public market cleared roughly 23% above the pre-IPO mark, which is material but not absurd for a profitable issuer coming to market with fresh capital, heavy cornerstone support, and a stronger disclosure package than private investors
    had.'
