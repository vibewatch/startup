- id: fundamental-earnings-power
  title: FY2025 economics and why they matter for valuation
  body: 'The key reason UltraGreen.ai can be valued more like a profitable platform than a speculative medtech listing is the FY2025 financial profile. The annual report shows US$142.4 million of revenue, 85% gross margin, about US$89.4 million of adjusted EBITDA, US$63.8 million of NPAT before exceptional items, and US$176.1 million of net cash. Those are unusually strong public-market fundamentals for a company that only listed in December 2025. They also explain why a revenue-plus-cash framework is the most defensible internal reference method here: the company has enough profitability that EV/revenue, P/E sensitivity, and cash-adjusted ranges all carry more signal than venture-style TAM narratives alone. The FY2026 guidance of US$170 million to US$190 million is important because it shows management expects another step up, but the retained Q1 materials do not publish an actual quarterly revenue or ARR number, which keeps the bridge from guidance to realized results partly opaque.'
  claimRefs:
