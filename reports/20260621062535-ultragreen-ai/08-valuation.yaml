- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Absolute post-IPO share count in AGM-era materials
    - A clean management restatement of outstanding shares after listing and any greenshoe impact
    - Removes residual ambiguity in per-share valuation work
    - Request IR confirmation and reconcile to prospectus capitalization tables
  - - Cap table and overhang
    - Post-IPO lock-up, side letters, option pool usage, and any remaining preference-like rights
    - Determines true per-share economics and dilution risk
    - Review IPO allocations, lock-up schedules, and later substantial-shareholder filings
  - - Revenue quality
    - Backlog conversion, recurring-revenue mix, customer concentration, and reorder cadence
    - Makes the fair-versus-stretched call much sharper
    - Request segment bridge from FY2025 through 1H2026 results
  - - Customer durability
    - Top-account concentration and any hospital renewal / reorder metrics
    - Tests whether procedure scale translates into sticky economics
    - Ask for reorder cohorts or distributor sell-through data
  - - Safety governance
    - Adverse-event monitoring, protocol support, and hospital training burden
    - Clarifies whether safety-related friction is manageable or margin-dilutive
    - Request pharmacovigilance summary and hospital-support metrics
  - - Competitive win-rate
    - Attach-rate data versus incumbent imaging systems and evidence of replacement or coexistence dynamics
    - Would clarify whether imaging expansion deserves a premium multiple
    - Ask management for installed-base mapping and win/loss analyses by hospital segment
  notes: These diligence asks are the shortest path from a public-market track rating to either a conviction buy or a stricter avoid decision.
