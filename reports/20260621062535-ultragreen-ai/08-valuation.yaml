  title: Recommendation summary table
  columns:
  - Dimension
  - Value
  - Support
  - Decision implication
  rows:
  - - Recommendation
    - track
    - Profitable FY2025 base, strong IPO demand, but limited recurring-revenue disclosure
    - Worth following after listing, but not enough price edge for an outright buy call from public evidence alone
  - - Confidence
    - medium
    - Primary documents are strong on pricing, shares offered, revenue, EBITDA, NPAT, and cash
    - Confidence is capped by missing ARR, concentration, and post-IPO cap-table detail
  - - Risk rating
    - high
    - Healthcare adoption, safety protocols, concentration opacity, and post-IPO sentiment risk remain material
    - Position sizing should stay conservative even if the business quality is real
  - - Valuation stance
    - fair at IPO; stretched above first-day highs
    - IPO implied about 11.2x FY2025 revenue; first-day high moved above 12.5x revenue
    - Price discipline matters more after the initial rerating
