- id: anti-thesis-risks-and-diligence
  title: Anti-thesis, adverse evidence, and what still needs proving
  body: 'The anti-thesis is not that UltraGreen.ai lacks a business; it is that the market may be willing to capitalize a very good business at a price that already discounts a lot of the near-term upside. Public documents still do not reveal a post-IPO preference map beyond ordinary listed shareholders, a detailed customer concentration schedule, ARR-style recurrence, or a backlog-to-revenue bridge. AGM-era materials also do not restate a clean absolute share count, so the prospectus remains the core reference point. On top of these disclosure gaps, the FDA and DailyMed labels are a genuine adverse input: hypersensitivity reactions, including reported deaths due to anaphylaxis, are manageable but real risks that can slow hospital approvals and add support burden. The right call from public evidence alone is therefore track rather than buy: investors can monitor execution and demand without assuming that early aftermarket enthusiasm guarantees durable upside from current levels.'
