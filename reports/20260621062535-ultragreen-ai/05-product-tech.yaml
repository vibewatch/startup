  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: ehr-and-api-integrations
    missingEvidence: No retained source names any EHR vendor, API endpoint, implementation architecture, or public integration documentation for UltraGreen Data Systems.
    whyItMatters: Hospital-system integration is central to the company’s quantified-workflow pitch, so missing implementation detail weakens underwriting of software value.
    diligencePath: Request product architecture diagrams, named integration partners, interface specifications, and customer deployment references for Data Systems.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: device-reliability-benchmarks
    missingEvidence: No retained public document provides MTBF, uptime, image-quality, throughput, or training-time benchmarks for IC-Flow.
    whyItMatters: Without reliability and performance metrics, it is hard to judge whether the hardware can support scaled quantified workflows across distributed sites.
    diligencePath: Request validation reports, service-level metrics, and benchmark comparisons against incumbent fluorescence platforms.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
    - TE003
  - type: conflicting-data
    severity: material
    topic: product-footprint-definitions
    missingEvidence: Public materials use 35+ markets, 41 approved countries, 45 IC-Flow markets, 54 ICG sales countries, and 55+ portfolio markets without a single reconciliation table.
    whyItMatters: The company can look more globally mature than it is if different product, approval, and sales scopes are treated as interchangeable.
    diligencePath: Ask management for a product-by-product geography matrix showing approval, active sales, distributor coverage, and revenue contribution.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: quantification-commercial-status
    missingEvidence: The retained source set does not say whether PerfusionWorks and Data Systems are widely commercial, limited pilot deployments, or bundled services without stand-alone pricing.
    whyItMatters: The product-tech thesis depends on quantified workflow becoming monetizable rather than remaining a roadmap narrative.
    diligencePath: Request module-level pricing, booked customers, installed base, and post-clearance deployment metrics for the software layers.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: developer-surface-absence
    missingEvidence: There is no retained GitHub, API-docs, package-registry, or public developer-community surface for UltraGreen; only practitioner-proxy signals were retained.
    whyItMatters: The required developer-signal box can be satisfied with practitioner proxies, but the absence of a genuine developer surface limits how easily third parties can extend the workflow.
    diligencePath: Confirm whether any private SDK, partner API, or documented integration program exists even if it is not publicly indexed.
