- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - UltraGreen solution
  - Measurable benefit
  - Limitation
  rows:
  - - Visualize extrahepatic biliary anatomy in cholecystectomy
    - Inject ICG and use NIR visualization before or during surgery
    - IC-Green / Verdye plus IC-Flow or compatible camera
    - Better visualization of biliary ducts and lower injury / conversion risk in company materials
    - Public proof is procedure-specific rather than platform-wide
  - - Check colorectal perfusion before anastomosis
    - Inject ICG and evaluate tissue perfusion at the anastomotic site
    - ICG imaging with potential future quantification
    - SAGES leak reduction evidence and company economics claims
    - Quantification benefit versus visual judgment is not yet quantified publicly
  - - Map sentinel lymph nodes
    - Use fluorescence-guided lymphatic mapping in breast or gynecologic workflows
    - Labeled IC-GREEN indications plus compatible imaging
    - High detection rates and radiation-free workflow option
    - Tracer-comparison evidence still favors combined tracer in some settings
  - - Document or standardize interpretation
    - Today often qualitative surgeon judgment with screenshots or notes
    - PerfusionWorks plus Data Systems structured reports
    - Potential move toward objective, reportable workflow
    - No public named EHR integration or software KPI disclosed
  - - Expand into decentralized or emerging settings
    - Bundle dye, handheld imaging, distributor support, and training
    - IC-Flow plus dye bundling for open procedures
    - May lower complexity relative to large tower systems
    - Scope appears stronger for open procedures than for every minimally invasive site
  notes: Workflow claims are strongest where official use-case pages and retained label or SAGES evidence overlap.
