- id: trust-safety-and-quality-controls
  title: Trust, safety, and quality controls
  body: Trust evidence in the retained corpus is strongest at the dye and filing level and thinner at the software-operating level. DailyMed and the FDA label clearly define approved IC-GREEN uses and safety warnings, while the annual-report timeline cites ISO27001 certification and a 2025 FDA 510(k) event for Data Systems. The challenge is that those trust signals stop short of a detailed software-control story. There is no retained public API documentation, no named EHR integration, no public data-retention policy, and no reliability benchmark for IC-Flow. The diligence implication is not that the platform is unsafe, but that investors should separate disclosed chemical and regulatory maturity from the still-sparse disclosure around software workflow governance and device-performance specifics. That disclosure gap is exactly where management diligence should concentrate.
