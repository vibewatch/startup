- id: workflow-and-use-cases
  title: How the product is used in the operating workflow
  body: 'The retained use-case and clinical pages make the workflow tangible. UltraGreen positions ICG as an intraoperative visibility tool for specific jobs such as extrahepatic-biliary visualization, colorectal-anastomosis perfusion checks, and lymphatic mapping. IC-Flow or another compatible camera captures the fluorescence signal, while the future-state pitch is that PerfusionWorks and Data Systems convert that signal into more objective, reportable insight. This is the right place to preserve an important distinction: the official pages prove strong procedure logic for the dye and for image capture, but they do not yet provide the same depth of public proof for automated interpretation. The current product is therefore best described as a clinically validated fluorescence workflow with a quantification roadmap layered on top.'
