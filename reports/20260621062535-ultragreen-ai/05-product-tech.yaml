- id: roadmap-and-regulatory-maturity
  title: Roadmap, regulatory milestones, and the quantified-workflow transition
  body: The roadmap evidence is good enough to establish sequence, but not good enough to eliminate ambiguity. Annual-report materials place ISO27001 in 2022, PerfusionWorks development in 2023, clinical test-site introduction in 2024, and claimed FDA 510(k) plus EU MDR filing activity in 2025. By 2026, Q1 and AGM materials shift the language toward quantification, data-enabled workflows, wound-care expansion, and broader geographic approvals. That chronology supports a real transition, not vaporware, but it also shows why diligence should not overstate readiness. The sources do not clearly say whether the software modules are broadly commercial, narrowly piloted, or sold mainly as part of bundled workflow engagements. Timing is therefore directionally encouraging and definitionally incomplete at the same time.
