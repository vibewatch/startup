callouts:
- calloutType: insight
  title: The real product story is a workflow transition
  body: The retained evidence does not show a simple device launch. It shows a company trying to convert a mature dye-and-camera workflow into a quantified, reportable operating system for perfusion decisions. That shift is the key upside if it becomes real.
  claimRefs:
  - CE008
  - CE015
  - CE034
  - CE041
  - CE048
- calloutType: risk
  title: The most important product gap is definitional, not visionary
  body: PerfusionWorks, UltraGreen Data Systems, and the cited FDA 510(k) event all appear in public materials, but the retained sources never cleanly define what each module is, how broadly it is deployed, or where the regulatory and commercial boundaries sit.
  claimRefs:
  - CE013
  - CE014
  - CE038
  - CE039
  - CE040
