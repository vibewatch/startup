chapter:
  number: 7
  title: Risks
  summary: 'UltraGreen’s highest public-evidence risks are not insolvency or basic product legitimacy; they are sequencing, concentration, and execution risks around a newly listed medtech platform trying to attach camera and data products onto a mature dye franchise. The retained corpus points to six recurring issues: public-company disclosure discipline under MAS/SGX frameworks, regulatory approval sequencing between IC-Flow and Verdye, inconsistent country-footprint definitions, leadership concentration around Ravinder Sajwan, incumbent camera competition, and product-attach risk where software or hardware uptake may lag dye sales.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'UltraGreen now carries listed-company obligations as well as medtech and drug-regulatory obligations. MAS OPERA shows a lodged Product Highlights Sheet and registered prospectus, while the prospectus itself preserves a standard listed-issuer liability frame and a recent legal transition from a 2024 private Singapore holdco into a 2025 public company. The Product Highlights Sheet explicitly warns investors about principal-loss risk, and the annual-report materials preserve forward-looking statement caution around regulatory, operational, and competitive uncertainty. On the product side, the retained corpus shows two separate approval tracks: IC-Flow device clearances and Verdye dye approvals. That sequencing matters because a hardware clearance does not automatically create a monetizable market if the dye is not yet approved or if local use conditions differ. Country-footprint disclosure also needs caution because 40 approved countries, 45 IC-Flow approval territories, and 55+ sold
    markets are not one interchangeable metric.'
