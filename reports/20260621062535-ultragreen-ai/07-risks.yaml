- id: operational-and-commercial-risk
  title: Operational, commercial, and product-attach risk
  body: 'Operationally, the core franchise looks stronger than many early public medtech stories: the annual report points to a second API supplier, three supplying facilities, high capacity coverage, strong margins, and meaningful net cash. But those mitigants do not eliminate commercial execution risk. Public revenue disclosure still points overwhelmingly to ICG vial economics, while disclosed software revenue remains small and partly tied to a discontinued UltraLinQ contribution. That makes product attach the key commercial question. IPO, AGM, and DBS materials all imply the investment case depends on attaching IC-Flow and later data products to dye adoption; DBS goes further by saying earnings uplift should build progressively as dye approvals come through. If the company wins dye demand but fails to attach camera or data layers, the moat narrows toward a high-quality but more commoditized pharmaceutical-plus-distribution story.'
