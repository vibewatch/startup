  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-company
    missingEvidence: A retained SGX rule excerpt or company-authored disclosure-controls memo mapping exact continuing obligations by event type and timeline.
    whyItMatters: The current chapter can evidence listed-company cadence but not a full obligation matrix, which limits precision on compliance risk scoring.
    diligencePath: Request the company’s disclosure-controls policy, SGX compliance calendar, and board-approved market-disclosure workflow.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, channel concentration, and geography-by-revenue dependence.
    whyItMatters: A business can look diversified by approvals while remaining exposed to a small set of distributors or hospital accounts.
    diligencePath: Request top-10 customer and distributor concentration tables with renewal and churn data.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: blocking
    topic: attach-risk
    missingEvidence: Actual attach rates between dye, IC-Flow, PerfusionWorks, and UltraGreen Data Systems by country and procedure family.
    whyItMatters: The integrated-platform thesis cannot be fully underwritten without knowing whether higher-value modules convert beyond the dye franchise.
    diligencePath: Request cohort-level attach and usage data tied to revenue contribution and gross margin.
    relatedQuestionRefs:
    - QR025
  - type: private-evidence-only
    severity: material
    topic: software-maturity
    missingEvidence: Named production accounts, usage frequency, and retention data for PerfusionWorks and UltraGreen Data Systems.
    whyItMatters: Public roadmap language can overstate commercial maturity if actual software usage is still experimental or narrow.
    diligencePath: Request live reference customers, module usage dashboards, and software-specific retention or ARR metrics.
    relatedQuestionRefs:
    - QR026
  - type: missing-source
    severity: minor
    topic: supply-chain
    missingEvidence: Independent verification of supply redundancy, facility quality metrics, and business-continuity test results.
    whyItMatters: Company and analyst claims on resilience are directionally helpful but do not fully prove operational robustness.
    diligencePath: Request third-party quality audits, inventory policies, and supplier recovery-time commitments.
    relatedQuestionRefs:
    - QR022
