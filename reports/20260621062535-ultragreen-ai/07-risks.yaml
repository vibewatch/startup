- id: partner-people-and-competition-risk
  title: Partner, people, and competition risk
  body: 'Leadership and ecosystem dependence remain material. Public materials consistently place strategic oversight, business relations, and a large portion of the external narrative around Ravinder Sajwan. Channel News Asia also attributes software-gap identification and application expansion to surgeon relationships, reinforcing that KOL access and founder-led relationship execution sit close to the product roadmap. At the same time, Diagnostic Green’s own compatibility pages show that many approved camera systems can already support ICG. That means UltraGreen competes against the installed-base logic of Stryker, Medtronic, Olympus or Quest-related systems, KARL STORZ, Richard Wolf, and other approved camera routes, not only against direct dye substitutes. Category adoption can therefore cut both ways: society endorsements and a larger evidence base help UltraGreen, but they also enlarge the market for bigger visualization vendors that already sit inside hospital budgets. The main people-and-partner
    risk is not lack of interest in fluorescence; it is whether UltraGreen can convert interest into attached revenue faster than incumbents can answer.'
