- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Approval sequencing stalls
    - IC-Flow approvals rise but dye approvals or commercial launches do not follow
    - Two consecutive new-country announcements without corresponding dye or revenue evidence
    - Treat expansion claims more cautiously and haircut APAC attach assumptions
  - - Country-definition inconsistency persists
    - Management continues mixing approval, sales-footprint, and distributor metrics
    - Another public deck repeats unreconciled 40 / 45 / 55+ style counts
    - Demand a unified KPI dictionary before giving credit for footprint growth
  - - Leadership concentration worsens
    - More roadmap, partnership, or sales-critical functions remain CEO-centric
    - No visible succession or delegated commercial ownership by next refresh
    - Raise governance discount and reduce confidence in execution durability
  - - Attach economics disappoint
    - Dye growth continues but camera or software contribution remains immaterial
    - Software revenue and bundle evidence remain negligible despite expansion spend
    - Shift thesis toward lower-multiple product company rather than integrated platform
  - - Incumbent substitution rises
    - Hospitals adopt ICG using installed incumbent towers instead of UltraGreen hardware
    - Reference accounts show dye usage without meaningful UltraGreen hardware or data attach
    - Reassess moat and lower expected margin leverage from ecosystem claims
  notes: Kill criteria focus on measurable or at least monitorable signals rather than vague concern statements.
