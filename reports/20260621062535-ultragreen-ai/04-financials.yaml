- id: capital-adequacy-ipo-and-outlook
  title: Capital adequacy, IPO mechanics, and FY2026 outlook
  body: 'Capital adequacy looks solid on reported numbers. Year-end cash and cash equivalents reached about US$176.1 million, borrowings had fallen to roughly US$3.1 million, and equity had reset to about US$310.6 million. Filings explain that this was not purely organic: FY2025 included US$150.0 million of gross IPO proceeds and a US$142.8 million debt-to-equity conversion of a promissory note owed to the immediate holding company. That matters positively because it means the post-listing balance sheet is clean enough to fund expansion, but it also means investors should distinguish underlying cash generation from one-off capitalization events. Dividends of US$39.75 million and an US$8.5 million tax provision on dividend income also show that shareholder returns were already present in the financial architecture during the IPO year.


    IPO mechanics are well evidenced across the prospectus, MAS page, and market-data sources. UltraGreen offered 112,068,200 shares at US$1.45, while separate cornerstone agreements covered 163,793,900 vendor shares at the same price. Media coverage consequently described roughly US$400 million of capital associated with the listing process once cornerstone commitments were included. Looking forward, the cleanest management guide is the US$170 million to US$190 million FY2026 revenue range repeated in both the FY2025 deck and AGM presentation. The company clearly expects continued growth, but even here precision is imperfect: one deck frames that range as about 19 to 33 percent growth while the AGM presentation frames it as about 15 to 33 percent. The number itself is therefore more reliable than the promotional percentage framing around it.'
