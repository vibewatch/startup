- id: margin-working-capital-and-unit-economics
  title: Margin drivers, working capital, and unit-economics proxies
  body: 'The margin story is attractive but not frictionless. Public filings show real physical-product economics underneath the headline 85 percent gross margin: FY2025 cost of sales was about US$20.9 million, inventories were about US$17.2 million at year-end, and inventory expense was about US$16.7 million. Trade receivables of about US$49.6 million and total trade and other receivables of about US$55.2 million also show that cash conversion depends on channel collections and operating discipline, not just on software-like billing. The cash-flow statement is still favorable — operating cash flow was about US$53.3 million — but the working-capital footprint means the company should be analyzed as a profitable medtech distribution-and-supply platform rather than a zero-inventory software vendor.


    The most important underwriting tension is that the strongest profitability disclosures are aggregate, while the weakest are stream-level. Results materials give volume, ASP, revenue, gross margin, and EBITDA, yet they still do not disclose realized pricing by geography or channel, customer concentration, CAC, payback, recurring-revenue share, or gross margin by dye versus imaging versus software. Prospectus-era risk disclosure also matters here: as of the latest practicable date, WeylChem ORGANICA was still the sole commercial API supplier, while later FY2025 and FY2026 materials presented the diversification story as already improving through a second supplier and added capacity. That is a positive trajectory, but it is still an execution bridge rather than a fully closed risk item.'
