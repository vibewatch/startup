- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - IC-GREEN / Verdye consumables
    - Sell indocyanine-green vials into procedures through direct and distributor channels
    - Vial
    - Core revenue engine; 987.7k FY2025 vials reported
    - High relative quality, but geography and channel mix remain undisclosed
    - Provide gross margin and realized ASP by geography and direct versus distributor sales
  - - IC-Flow imaging systems
    - Hardware enables fluorescence-guided procedures and can pull through dye usage
    - System sale / installed site
    - Commercially launched and approved in 45 territories by March 2026
    - 'Medium: supports adoption but direct revenue contribution is undisclosed'
    - Disclose installed base, hardware revenue, and pull-through to consumables
  - - PerfusionWorks quantification software
    - Quantification layer intended to improve perfusion assessment
    - License / module / workflow
    - Under development and advancing through EU MDR process
    - 'Low-to-medium: future software leverage exists but current revenue is not separately disclosed'
    - Show commercialization timing, pricing basis, and attached revenue
  - - UltraGreen Data Systems
    - Cloud data and analytics layer supporting surgical data capture
    - Platform / cloud workflow
    - Company materials position it as strategic, but no standalone FY2025 line item is published
    - 'Low-to-medium: strategic value clear, current monetization opaque'
    - Disclose booked revenue, customer count, and recurring versus service mix
  - - UltraLinQ discontinued operations
    - Cardiology PACS and related software previously contributed data-platform revenue
    - Upload / software service
    - US$4.4m FY2025 contribution before disposal
    - Low for future underwriting because it is discontinued
    - Bridge continuing-operations comparability without UltraLinQ
  notes: Table separates the consumables-led engine from imaging, software, and discontinued operations; public filings do not provide a clean dye-versus-imaging-versus-software P&L split.
