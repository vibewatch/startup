- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Implication
  - Diligence ask
  rows:
  - - Year-end cash and net cash
    - US$176.1m cash and cash equivalents; management describes a net-cash position around the same level
    - Immediate solvency cushion
    - Supports reinvestment and reduces near-term refinancing pressure
    - Provide quarter-end cash through Q2 2026 and treasury deployment plan
  - - Borrowings
    - About US$3.1m total borrowings at FY2025 year-end
    - Shows leverage was largely removed
    - Balance sheet is no longer debt-heavy after listing
    - Provide any remaining debt terms and covenant package
  - - IPO proceeds
    - US$150.0m gross proceeds from IPO
    - Primary listing capital added fresh cash
    - Year-end liquidity is not purely operating cash
    - Provide net proceeds schedule and uses of funds by bucket
  - - Debt conversion
    - US$142.8m promissory note converted to equity
    - Removes related-party leverage and repairs equity base
    - A large part of de-risking came from capitalization, not only earnings
    - Provide pre- and post-conversion related-party balances and governance controls
  - - Dividends and shareholder returns
    - US$39.75m dividend in FY2025; AGM materials discuss continued shareholder returns
    - Shows capital allocation already includes payout logic
    - Positive if disciplined, but also reduces retained cash
    - Clarify payout framework versus growth-investment priorities
  - - FY2026 guide
    - US$170m-US$190m revenue target repeated in management materials
    - Sets forward underwriting range
    - Growth outlook is constructive, though supporting disclosures remain incomplete
    - Provide quarterly phasing and bridge from FY2025 continuing operations
  notes: Capital adequacy is strong on disclosed cash and leverage, but public materials do not yet show a full 18-month cash-use plan.
