- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Customer concentration
    - Needed to judge durability of dye demand and distributor dependence
    - Not publicly disclosed
    - Could make strong aggregate margins less repeatable than they look
    - Request top-20 customer and distributor concentration with churn and contract tenure
  - - Realized pricing by stream and geography
    - Needed to understand what drove ASP expansion
    - Only high-level FY2025 ASP commentary is public
    - Without it, pricing power versus mix shift cannot be separated
    - Request realized ASP bridge by product, channel, and geography
  - - Segment gross margin
    - Needed to judge repeatability of 85% consolidated gross margin
    - Not publicly disclosed
    - Investors cannot tell whether future mix skews toward lower-margin hardware or services
    - Request gross margin by dye, imaging, software, and continuing versus discontinued operations
  - - CAC, payback, and sales cycle
    - Needed for GTM efficiency underwriting
    - Not publicly disclosed
    - Strong profitability could still hide expensive selling or distributor incentives
    - Request CAC, payback, pipeline conversion, and direct-versus-distributor sales-cycle metrics
  - - Definition appendix for country counts and guidance math
    - Needed to avoid false precision around footprint and growth framing
    - Conflicting secondary figures remain in public decks
    - Presentation inconsistency weakens confidence in secondary metrics
    - Request a definitions appendix reconciling 35+, 40, 41, and 55+ country claims plus guidance percentage math
  notes: These gaps do not overturn the positive FY2025 scale story, but they are the main blockers to underwriting revenue quality with filing-grade precision.
