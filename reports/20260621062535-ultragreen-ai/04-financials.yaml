chapter:
  number: 4
  title: Financials
  summary: 'UltraGreen''s FY2025 public record is unusually strong for a newly listed medtech platform: the company disclosed US$142.4 million of revenue, US$121.1 million of gross profit, US$89.4 million of adjusted EBITDA, and roughly US$176.1 million of net cash after the IPO and debt conversion. The open-source blockers are not scale or solvency but revenue-quality precision — realized pricing, customer concentration, segment gross margins, and the extent to which prospectus-era supply-chain risk had truly cleared by the start of FY2026.'
sections:
- id: revenue-model-and-disclosed-performance
  title: Revenue model and disclosed FY2025 performance
  body: 'UltraGreen''s financial profile is best understood as a consumables-led medtech platform with optionality around imaging and software, not as a pure software issuer. The financial statements define the principal activities as sales of ICG pharmaceutical products plus diagnostic imaging analytics and software solutions, while the product stack spans IC-GREEN or Verdye, IC-Flow imaging, PerfusionWorks, and UltraGreen Data Systems. That matters because the FY2025 record does not show one monolithic SaaS line; instead it shows a business where dye volumes, procedural adoption, and a smaller software layer all contribute to revenue.


    The headline FY2025 numbers are strong and consistently corroborated across the annual report, financial statements, press release, and results deck. Revenue reached roughly US$142.4 million, continuing-operations revenue was US$137.9 million after isolating UltraLinQ, gross profit reached US$121.1 million at an 85.0 percent gross margin, adjusted EBITDA reached US$89.4 million, and NPAT before exceptional items reached US$63.8 million. Volume and ASP data also point to genuine operating momentum rather than accounting optics: FY2025 vial volume rose to about 987.7 thousand units and management attributed part of the uplift to US pricing actions in 3Q2025. What remains missing is product-stream precision: public disclosure does not split realized revenue cleanly between dye, imaging, software, and distributor economics.'
