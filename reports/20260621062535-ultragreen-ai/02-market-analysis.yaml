callouts:
- calloutType: strength
  title: Why the market is investable now
  body: 'The retained source set supports a real market rather than a speculative science project: Frost & Sullivan market sizing, SAGES outcome evidence, ISFGS protocols, and a broad camera ecosystem all point to a workflow that already exists and is still underpenetrated.'
  claimRefs:
  - CM004
  - CM012
  - CM019
  - CM026
  - CM033
- calloutType: risk
  title: Why TAM still overstates near-term capture
  body: The biggest risk is not whether ICG works; it is whether hospitals convert heterogeneous evidence, procedure-specific labels, and fragmented capital budgets into standardized recurring workflows quickly enough to justify software and ecosystem upside.
