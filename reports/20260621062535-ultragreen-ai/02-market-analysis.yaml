- id: TM003
  title: Clinical evidence and label-scope table
  columns:
  - Use case
  - Evidence / scope
  - Measurable support
  - Operational implication
  - Limitation
  rows:
  - - Colorectal anastomosis
    - SAGES meta-analysis with 7 RCTs
    - Leak OR 0.58; +6.32 nodes retrieved
    - Supports GI-service-line adoption and recurrent vial usage
    - Evidence stronger for core colorectal use than for every GI adjacency
  - - Breast sentinel-node biopsy
    - PubMed French study and Indian PMC cohort
    - 95.9% detection in French cohort; 100% identification in upfront Indian cases
    - Supports breast and LMIC lymphatic-mapping workflows
    - Different comparators and settings limit exact transferability
  - - Breast tracer comparison
    - Frontiers institutional study
    - ICG alone 90.6% vs combined 98.1% detection
    - ICG can reduce radiation/logistics burden
    - Combined tracer still performed best in that dataset
  - - Cross-specialty protocolization
    - ISFGS dosing and timing chart
    - Procedure-specific dose, route, and timing guidance across multiple specialties
    - Helps standardize training and reproducibility
    - Guidance does not itself settle reimbursement or procurement
  - - U.S. label scope
    - DailyMed and FDA label
    - Perfusion, biliary ducts, cervical/uterine lymphatic mapping, ophthalmic angiography
    - Hospitals can standardize around specific labeled workflows
    - Label is narrower than generic “all oncology” marketing claims
  notes: This table pairs clinical outcome evidence with regulatory scope because adoption depends on both efficacy and what hospitals can standardize under current labeling.
