  name: Ultragreen.ai
chapter:
  number: 2
  title: Market Analysis
  summary: 'UltraGreen.ai operates in a real but still underpenetrated fluorescence-guided-surgery market: retained filing materials support a USD 173.2 million 2024 global ICG market, a USD 335.4 million 2030 outlook, and a much larger full-penetration ceiling. The investability case rests on procedure-level clinical evidence, a broad compatible-camera ecosystem, and expanding regulatory plus quantification narratives, while the main constraints remain protocol heterogeneity, procedure-specific label scope, supply concentration, and missing buyer-budget evidence.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, substitutes, and what is actually being sold
  body: 'UltraGreen is not just selling a dye, but the practical market boundary still starts with indocyanine-green consumables and the procedures where clinicians already know how to use them. The retained materials support a workflow stack that extends from IC-GREEN or Verdye into compatible cameras, then into quantification and structured reporting. That broader framing matters because it avoids two common mistakes: treating the opportunity as only a reagent niche, or treating it as all surgical-imaging spend. The sources point instead to a middle ground in which dye demand is pulled by procedure-specific clinical evidence, compatible camera availability, and growing interest in quantified decision support. The main substitutes remain white-light visualization, blue-dye or radioisotope mapping, and surgeon judgment without quantified fluorescence, so adoption depends on specific clinical jobs rather than on a generic “better imaging” narrative. That keeps the market definition disciplined
    for underwriting. for investors. Today.'
