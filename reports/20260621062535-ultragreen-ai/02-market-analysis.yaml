- id: buyer-workflows-and-clinical-proof
  title: Buyer map and the clinical proof that unlocks recurring demand
  body: The buyer path is procedure-led. Surgeons and service-line champions generate demand, hospital capital and formulary processes determine what camera and dye can be standardized, and recurring vial demand follows only after a protocol survives real operating-room use. That path is why the retained clinical evidence matters so much. SAGES provides the strongest colorectal support in the retained set, while breast and lymphatic-mapping evidence comes from Frontiers, PubMed, and the Indian PMC cohort. ISFGS then turns that literature into dosing and timing workflows across multiple specialties. UltraGreen’s use-case pages extend the story into procedure economics, especially for cholecystectomy and colorectal surgery. The evidence base is therefore broad enough to explain why buyers engage, but it is still uneven by indication and frequently more convincing for the dye than for any one imaging hardware vendor.
