- id: sizing-and-penetration
  title: Sizing the market with constrained lenses instead of one generic TAM
  body: The strongest retained sizing lens comes from the prospectus and product-sheet materials that cite Frost & Sullivan. Those sources support a 2024 global ICG market of USD 173.2 million, a 2030 projection of USD 335.4 million, and a USD 925.1 million full-penetration available market. That framing is useful because it separates today’s observed market from a fuller procedural opportunity. It also shows why adoption timing matters more than simply saying the market is large. Mature U.S. procedures still appear to be below 25% penetration, while Asia-Pacific is the fastest-growing region at 16.6% CAGR. AGM materials also describe the market as only 15% to 20% penetrated. Together, those sources support a long runway thesis, but they do not by themselves prove how quickly hospitals convert evidence into standardized purchasing.
