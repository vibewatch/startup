  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: cancer-burden-slices
    missingEvidence: Procedure-level WHO/IARC extracts for colorectal, breast, hepatobiliary, and gynecologic disease burden were not preserved in the cached fetch output.
    whyItMatters: Disease-burden detail would strengthen bottom-up SAM framing by matching procedures to incidence without relying on company prose.
    diligencePath: Re-fetch the WHO/IARC Cancer Today query pages for the specific cancer types and geographies used in UltraGreen use cases.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: reimbursement-and-budget-owner
    missingEvidence: No retained procurement, reimbursement, or payer-policy source quantifies who funds each use case or how quickly hospitals recover camera and dye spend.
    whyItMatters: Without buyer-budget evidence, SAM and adoption velocity remain less certain than the headline TAM implies.
    diligencePath: Pull procedure-specific reimbursement policies, tender records, or hospital procurement documents for cholecystectomy, colorectal, and lymphatic-mapping workflows.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
    - TM005
  - type: private-evidence-only
    severity: minor
    topic: camera-market-share
    missingEvidence: The retained official camera pages prove ecosystem breadth but do not quantify installed-base or revenue share by vendor.
    whyItMatters: That missing denominator limits how precisely one can model bargaining power between dye vendor and hardware incumbents.
    diligencePath: Request third-party installed-base studies or hospital device-share data from management and independent medtech market reports.
    relatedQuestionRefs:
    - QM018
  - type: conflicting-data
    severity: material
    topic: footprint-definitions
    missingEvidence: Public materials use 41-country approval, 54-country ICG sales, and 55-country portfolio reach definitions without reconciling the scopes.
    whyItMatters: Investors could overstate commercial breadth if these labels are treated as interchangeable.
    diligencePath: Ask management to provide a single market-footprint bridge by product, approval status, and revenue contribution.
    relatedQuestionRefs:
    - QM022
