company:
  name: Ultragreen.ai
chapter:
  number: 1
  title: Company Overview
  summary: 'UltraGreen.ai should be treated as a newly listed Singapore medtech platform rather than a minimally disclosed one-year-old startup: public materials show a 2024 Singapore holdco, a December 2025 SGX IPO, and FY2025 revenue of US$142.4 million with unusually high profitability. The reusable ground truths for later chapters are the fluorescence-guided surgery ecosystem model, Ravinder Sajwan-led public-company governance, the 65 Equity/Vitruvian pre-IPO capital story, and the unresolved need to reconcile marketed-country and predecessor-history disclosures.'
sections:
- id: identity-stage-and-disclosure
  title: Identity, legal anchor, and current stage
  body: UltraGreen.ai is no longer analyzable as a stealth or lightly disclosed startup. Public materials show a Singapore-incorporated holdco, UltraGreen.ai Limited, with registration number 202437045W, a MAS-registered prospectus dated 26 November 2025, and a full SGX Mainboard listing and AGM trail by April 2026. That legal chronology matters because it reconciles the apparently young 2024 Singapore entity with a business that publicly describes deeper operating history, six million enabled procedures since 2015, and a mature global commercial footprint for indocyanine-green fluorescence products. The practical diligence conclusion is that the company should be treated as a public growth medtech platform whose predecessor operating assets existed before the listed holdco was formed. Reusable identity for later chapters should therefore anchor on the public issuer, its fluorescence-guided surgery positioning, and its product ecosystem rather than on the misleading idea that the business
    is merely a one-year-old pre-commercial startup.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
