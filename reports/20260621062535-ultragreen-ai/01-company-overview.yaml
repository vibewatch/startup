- id: leadership-and-governance
  title: Leadership, board depth, and key-person concentration
  body: Leadership disclosure is one of the cleaner parts of the public record. Ravinder Sajwan is consistently identified as chief executive officer and executive director, while chairman Kwa Chong Seng and independent directors Hsieh Fu Hua, Sir David Lane, Nicky Tan, and Professor Toh Han Chong give the board a mix of Singapore establishment credibility, cancer-research depth, healthcare-system exposure, and capital-markets experience. The governance package also already includes investor-relations, board-committee, and whistleblowing policies. Even so, company-overview diligence should not treat governance as de-risked. The public record concentrates strategy and business relations heavily around Sajwan, while the original-founder story of the predecessor business remains underexplained relative to the very visible board roster. That makes the company look institutionally stronger than a typical freshly listed medtech issuer, but still somewhat personality-dependent at the executive
    layer.
  claimRefs:
