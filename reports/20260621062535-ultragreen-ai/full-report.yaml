      - number: '8.2'
        title: Demand, cornerstone backing, and aftermarket support
        blocks:
          - type: paragraph
            body: >-
              The demand data explain why the public valuation cleared above the last private mark. Minichart’s IPO
              write-up says total subscriptions and indications of interest reached 13.6 times available shares and the
              Singapore public offer alone was 4.5 times subscribed, while cornerstone commitments totaled US$237.5
              million from 16 investors. Channel News Asia and The Straits Times then show immediate aftermarket
              support: the stock traded above the US$1.45 offer, with reported prints around US$1.60 and an intraday
              high of US$1.62. DBS later marked the stock at US$1.53 and kept a US$2.00 target. Taken together, those
              sources say the IPO was not merely technically completed; it was actively absorbed and, at least
              initially, supported by both public investors and sell-side coverage. The caution is that demand-based
              validation is reflexive. Oversubscription and first-day trading can justify liquidity and sentiment, but
              they do not substitute for detailed revenue-recognition, ARR, or concentration disclosure.
            claimRefs:
              - CV012
