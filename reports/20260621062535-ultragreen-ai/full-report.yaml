            body: >-
              The strongest retained sizing lens comes from the prospectus and product-sheet materials that cite Frost &
              Sullivan. Those sources support a 2024 global ICG market of USD 173.2 million, a 2030 projection of USD
              335.4 million, and a USD 925.1 million full-penetration available market. That framing is useful because
