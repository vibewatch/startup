      - number: '7.4'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The right underwriting frame is conditional rather than binary. UltraGreen has credible mitigants in the
              retained corpus: public governance policies, visible SGX-era disclosure activity, multiple supply-chain
              reinforcement claims, strong FY2025 cash generation, and a still-expanding clinical evidence base for ICG.
              None of those eliminate the need for monitoring. Investors should treat approval sequencing, attach rates,
              and country-definition discipline as live control points. A thesis break would not require a regulatory
              ban; it could be a softer but still serious pattern in which device approvals do not translate into dye
              approvals, dye approvals do not translate into bundled revenue, or public-company disclosure around those
              transitions becomes confusing. Similarly, if leadership concentration proves heavier than the board and
              governance scaffolding can absorb, or if installed incumbent camera ecosystems limit attach economics, the
              valuation case should compress even with healthy near-term revenue and cash. Protocol discipline matters
              too: indication-specific dosing, timing, and interpretation requirements in clinical guidance mean
              commercialization quality can still vary even when the core dye is well known.
