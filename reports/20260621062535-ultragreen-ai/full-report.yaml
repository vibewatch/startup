companyProfile:
  summary: >-
    UltraGreen.ai is a Singapore-incorporated and SGX-listed fluorescence-guided surgery company whose platform combines
    the IC-Green/Verdye dye franchise with IC-Flow imaging systems, PerfusionWorks quantification software, and
    UltraGreen Data Systems. Public materials show a highly profitable FY2025 profile and a broad regulatory/commercial
    footprint, but also leave open questions about predecessor-company history, customer concentration, and how
    management defines marketed-country versus approved-country coverage.
