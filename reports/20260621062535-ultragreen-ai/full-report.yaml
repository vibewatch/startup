        title: Durability gaps, concentration risk, and adverse adoption signals
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence remains the biggest hole. UltraGreen discloses no NRR, GRR, churn, renewal
              rate, active-hospital count, satisfaction score, or top-customer concentration metric in the fetched
              materials. That means investors can see meaningful adoption surfaces but cannot yet verify how sticky or
              diversified the customer base really is. The public story is also somewhat concentrated: the
              five-UK-hospital cohort is the most concrete hospital proof, while the broader hospital and surgeon claims
              are still mostly company-controlled. Adverse evidence exists as well, though it is product- and
              protocol-related rather than customer-complaint-driven. DailyMed and the FDA label both warn about
              hypersensitivity reactions, including anaphylaxis, and the FDA label notes reported deaths due to
              anaphylaxis plus temporary thyroid-iodine interference. These warnings do not negate product-market fit,
              but they reinforce that hospital adoption requires clinical training, protocols, and safety governance.
