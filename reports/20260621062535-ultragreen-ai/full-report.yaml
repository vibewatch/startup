  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Reconciling the private mark with IPO pricing
        blocks:
          - type: paragraph
            body: >-
              UltraGreen.ai is unusual in that both the last private step-up and the IPO price are visible enough to
              build a clean bridge. The strongest pre-IPO source is Allen & Gledhill, which says roughly 14.42% of
              UltraGreen.ai Private Limited was sold in September 2025 at a US$1.3 billion equity valuation to a
              syndicate including 65 Equity Partners, Vitruvian, and August Global. The prospectus then provides the
              public reset point: 112,068,200 shares offered at US$1.45, including 103,448,300 new shares and 8,619,900
              vendor shares. Using the prospectus share split history, the best public reconstruction is about 1.103
              billion post-IPO shares before any over-allotment exercise, implying around US$1.60 billion of equity
              value at the offer price. That means the public market cleared roughly 23% above the pre-IPO mark, which
              is material but not absurd for a profitable issuer coming to market with fresh capital, heavy cornerstone
              support, and a stronger disclosure package than private investors had.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
