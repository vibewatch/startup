        title: Architecture, dependencies, and what actually has to work together
        blocks:
          - type: paragraph
            body: >-
              The product architecture is operationally multi-layered. UltraGreen needs a pharmaceutical supply chain
              for ICG, approved imaging hardware, procedure protocols, and then a data layer that claims to create
              structured reports and decision support. That creates both differentiation and dependency. A bundled
              dye-to-data workflow could be harder to replace than a vial alone, but any weak link—API supply, camera
              approvals, integration work, or proof that quantification changes decisions—can delay the full stack. The
              broad compatibility ecosystem around ICG is especially double-edged: it proves interoperability and
              category maturity, but it also means incumbent hardware vendors still control important parts of the
              surgeon experience and can compress the uniqueness of the imaging layer. That creates real execution risk.
