      - number: '1.4'
        title: Financial scale, public milestones, and visible caution flags
        blocks:
          - type: paragraph
            body: >-
              Public disclosure is already rich enough to establish operating scale. UltraGreen reported FY2025 revenue
              of US$142.4 million, gross profit of US$121.1 million, adjusted EBITDA of US$89.4 million, and NPAT before
              exceptional items of US$63.8 million, while the annual report also highlighted a net cash position of
              about US$176.1 million. Those are unusually strong profitability markers for a recently listed growth
              medtech company and they explain why later chapters should treat the business as a scaled commercial
              platform rather than a speculative pre-revenue imaging story. The main caution flags are definitional
              rather than existential: marketed-country counts vary across materials, the predecessor founder and
              control history are not fully transparent, and customer concentration is still not explicitly disclosed.
              None of these gaps invalidate the public-company thesis, but they are material enough to keep on the
              diligence checklist. A second caution is operational rather than cosmetic: the prospectus still described
              WeylChem ORGANICA as the sole API supplier at the latest practicable date, even though later FY2025 and
              FY2026 materials highlighted second-supplier qualification and added capacity. That sequence supports a
              positive scaling narrative, but it also means investors should treat supply diversification as a live
              execution item rather than a fully closed historical risk.
