      - number: '2.4'
        title: Growth drivers, constraints, and why valuation hinges on workflow conversion
        blocks:
          - type: paragraph
            body: >-
              The growth case is not just more surgeries. It is publication momentum, KOL education, expanding
              regulatory coverage, a large installed base of compatible camera systems, and the possibility that
              quantification upgrades the value of the workflow over time. But the constraints are equally visible.
              Label scope is still procedure-specific, adverse reactions remain clinically relevant, protocol
              standardization is incomplete, and market-footprint definitions vary across documents. Supply
              concentration also matters because the prospectus still names a sole API supplier at the latest
              practicable date. For valuation, the most important signal is that current economics look strong even
              before quantification becomes material: UltraGreen’s retained FY2024 metrics imply a high-margin
              consumables business with pricing power. The unresolved question is how much of that value ultimately
              accrues to the dye, to hardware partners, or to a future quantified workflow layer. Another practical
              constraint is that the retained corpus has much better evidence on clinical efficacy and molecule
              economics than on buyer-side conversion mechanics. That imbalance is important for valuation: it supports
              the existence of demand, but it leaves open whether hospital committees approve cameras, protocols, and
              recurring procurement fast enough for software-style upside to matter on an underwriting horizon.
