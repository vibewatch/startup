      - number: '1.3'
        title: Capital history, ownership, and public-market transition
        blocks:
          - type: paragraph
            body: >-
              The capital story has two distinct phases that need to be separated. First, multiple September 2025
              reports and a law-firm transaction note point to a roughly US$187.5-188 million pre-IPO strategic share
              sale or investment associated with 65 Equity Partners, Vitruvian-linked entities, and August Global at an
              implied valuation of about US$1.3 billion. Second, the MAS-registered November 2025 prospectus and
              December 2025 listing shifted the company into a public-market frame with an offer price of US$1.45 per
              share, reported demand of about 13.6 times the offered book, and a large post-IPO shareholder base. Public
              ownership disclosures then show meaningful continuing influence from 65 Equity Partners-linked and
              Vitruvian-linked entities. The correct reusable conclusion is not that one valuation supersedes the other,
              but that the pre-IPO private mark and the public listing together show a rapid re-rating path into
              listed-medtech territory.
