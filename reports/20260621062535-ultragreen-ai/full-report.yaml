  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, substitutes, and what is actually being sold
        blocks:
          - type: paragraph
            body: >-
              UltraGreen is not just selling a dye, but the practical market boundary still starts with
              indocyanine-green consumables and the procedures where clinicians already know how to use them. The
              retained materials support a workflow stack that extends from IC-GREEN or Verdye into compatible cameras,
              then into quantification and structured reporting. That broader framing matters because it avoids two
              common mistakes: treating the opportunity as only a reagent niche, or treating it as all surgical-imaging
              spend. The sources point instead to a middle ground in which dye demand is pulled by procedure-specific
              clinical evidence, compatible camera availability, and growing interest in quantified decision support.
              The main substitutes remain white-light visualization, blue-dye or radioisotope mapping, and surgeon
              judgment without quantified fluorescence, so adoption depends on specific clinical jobs rather than on a
              generic “better imaging” narrative. That keeps the market definition disciplined for underwriting. for
              investors. Today.
