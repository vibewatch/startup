    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              UltraGreen should be read as a workflow company built on a mature fluorescence agent rather than as a
              single-SKU dye vendor. The retained official pages repeatedly describe a stack that begins with IC-GREEN
              or Verdye, moves into IC-Flow imaging, and then tries to add PerfusionWorks quantification plus UltraGreen
              Data Systems reporting. That distinction matters because it explains both the upside and the ambiguity in
              the story. The mature part is the molecule and its procedure-level clinical workflow. The newer part is
              the effort to turn visual interpretation into quantified, structured decision support. The cleanest
              current framing is that the dye and core imaging workflow are commercial, while the data and
              quantification layers are strategic growth modules whose exact packaging and revenue contribution remain
