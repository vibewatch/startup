      - number: '4.4'
        title: Financial verdict and remaining diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence-led verdict is more favorable than the market shorthand of "recent IPO medtech" would
              suggest. UltraGreen is not merely pre-profit or concept-stage: it entered FY2026 with audited FY2025
              revenue above US$140 million, strong gross margins, strong EBITDA, positive operating cash flow, low
              residual borrowings, and a substantial net-cash position. Independent analyst coverage from DBS reinforced
              that the company had genuine earnings power even while cautioning that APAC approvals were not yet likely
              to move 2026 group earnings materially because the region still starts from a small base.


              The remaining blockers are about quality of earnings and precision of presentation rather than about
              whether a business exists. Public sources still do not disclose customer concentration, realized pricing
              by stream, recurring-revenue share, CAC or payback, or segment-level margins. Secondary definitions also
              drift across decks: country counts span over 35 marketed countries, 40 approved countries as at January
              2026, 41 after Singapore approval, and 55-plus countries sold. Those conflicts should be preserved as
              evidence gaps rather than forced into a falsely exact number. The resulting underwriting stance is
              constructive on solvency and scale, but still conditional on management providing a tighter bridge from
              aggregate profitability to stream-level revenue quality.
