  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and solution classes
        blocks:
          - type: paragraph
            body: >-
              UltraGreen should be compared against at least four solution classes. First are the large incumbent
              visualization platforms: Stryker 1688 AIM with the SPY family around it, Medtronic EleVision IR, Olympus
              VISERA ELITE III, KARL STORZ Rubina, and Richard Wolf System green. Second are more specialized
              fluorescence systems such as Hamamatsu PDE-Neo II and Getinge/Fluoptics products such as Fluobeam LS and
              Fluobeam LX. Third is the status quo of buying indocyanine green and using an already approved compatible
              camera system; Diagnostic Green’s own compatibility pages make clear that many such platforms are already
              on the market. Fourth is UltraGreen’s self-described integrated platform, which tries to add software
              quantification and cloud reporting on top of dye and camera hardware. That framing matters because the
              buyer is not choosing only among startups; it is often choosing whether to keep an installed incumbent
              tower and add ICG incrementally.
