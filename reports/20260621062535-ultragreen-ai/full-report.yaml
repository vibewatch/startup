  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          UltraGreen is already profitable, cash generative, and category leading in fluorescence-guided surgery rather
          than being a speculative pre-revenue medtech listing.
        - Evidence of continued 2026 growth conversion would strengthen the case.
      - - Thesis
        - >-
          IPO demand, cornerstone capital, and early aftermarket support show public investors accepted a valuation
          above the last private mark.
        - A sustained secondary-market premium after results would confirm demand durability.
      - - Thesis
        - High gross margin and net cash create downside protection compared with less mature medtech IPOs.
        - A clear backlog or recurring-revenue bridge would make fair value less sentiment-dependent.
      - - Anti-thesis
        - >-
          Most of the rerating from US$1.3 billion private value to roughly US$1.6 billion public value happened
          immediately at listing.
        - A post-IPO pullback or flat trading range would create a better entry point.
      - - Anti-thesis
        - Public sources still do not disclose ARR, customer concentration, or a detailed cap-table overhang.
        - Cap table and backlog disclosure would materially raise conviction.
      - - Anti-thesis
        - >-
          Product-safety and protocol requirements can slow customer adoption and compress valuation if they increase
          support cost or reduce expansion speed.
        - Evidence of clean adoption despite these hurdles would reduce the discount rate.
      - - Anti-thesis
        - >-
          Large incumbents already market competing fluorescence-imaging platforms, so public multiples should not
          assume frictionless imaging share gains.
        - Evidence of attach-rate wins versus incumbent platforms would improve the view.
    notes: >-
      The anti-thesis is centered on valuation discipline and disclosure quality rather than on denying that a strong
      underlying business exists.
