      - number: '3.2'
        title: Capability and workflow comparison
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is where UltraGreen has a plausible strategic wedge but not a clean product superiority
              claim. The retained UltraGreen pages describe a bundle of dye, open-procedure imaging, AI-oriented
              quantification, and a cloud data layer. Competitor pages, by contrast, emphasize imaging quality,
              workflow, and installed-base flexibility: Medtronic highlights fluorescence signal intensity measurement
              in open and laparoscopic procedures, Olympus emphasizes software-driven 4K multispecialty imaging, KARL
              STORZ highlights 4K, 3D, and overlay modes, and Richard Wolf emphasizes simultaneous fluorescence plus
              white-light viewing. That means UltraGreen is differentiated less by owning fluorescence itself and more
              by trying to move the workflow from qualitative imaging toward standardized quantification and reporting.
              The risk is that this edge remains partly future tense in public materials and therefore cannot yet be
              treated as fully proven commercial separation. A second important buyer tradeoff is deployment ambition.
              If an account only wants better fluorescence visualization inside an existing tower budget, incumbent
              options remain credible. If it wants structured perfusion reporting, surgeon-facing quantification, and a
              hospital-system data trail, UltraGreen at least argues for a wider operational scope than most fetched
              device pages describe.
