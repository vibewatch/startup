evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: founder-history
    missingEvidence: >-
      A definitive founder/predecessor ownership history linking the 2024 Singapore holdco to the older operating
      business.
    whyItMatters: Without it, investor assessment of founder-market fit and legacy control rights remains incomplete.
    diligencePath: Request a pre-IPO group-structure memo, predecessor incorporation documents, and cap-table bridge from management.
    relatedQuestionRefs:
      - QO010
  - type: conflicting-data
    severity: material
    topic: country-footprint
    missingEvidence: A management-reconciled definition of marketed countries versus approved countries versus broader availability.
    whyItMatters: Country-count inflation can distort later market-penetration and moat arguments.
    diligencePath: Ask investor relations to reconcile 35+, 41, and 55-country claims by product and date.
    relatedQuestionRefs:
      - QO015
      - QO016
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named top accounts, distributor concentration, and attach rates between dyes, hardware, and software.
    whyItMatters: Commercial durability and switching-cost claims are hard to size without concentration data.
    diligencePath: Request top-20 customer and distributor revenue concentration with churn and cross-sell metrics.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: net-cash-detail
    missingEvidence: A more explicit public balance-sheet bridge for cash, debt, and IPO proceeds uses.
    whyItMatters: Headline cash is clear, but treasury deployment and working-capital needs remain less explicit.
    diligencePath: Review the full annual report, FY2026 interim statement, and IPO-proceeds updates together.
    relatedQuestionRefs:
      - QO014
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership-coverage boundary
    missingEvidence: A definitive founder roster and predecessor-control bridge to complement the current public leadership table.
    whyItMatters: >-
      The table is comprehensive on present directors but still incomplete on original founders and legacy control
      rights.
    diligencePath: Request a founder timeline, predecessor board history, and pre-IPO cap-table bridge from management.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 stakeholder-rights detail
    missingEvidence: Side-letter economics, lock-ups, board rights, and distributor/customer concentration by stakeholder class.
    whyItMatters: >-
      The visible investor map is directionally useful but does not show the actual control levers or commercial
      concentration.
    diligencePath: Request substantial-shareholder filings, investor agreements, and commercial concentration schedules.
    relatedQuestionRefs:
      - QO021
      - QO022
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 predecessor chronology gap
    missingEvidence: A dated milestone chain before the 2024 Singapore holdco formation and before the public-listing phase.
    whyItMatters: >-
      The current milestone table is reliable for 2024-2026 public events but does not fully explain the older
      operating-history story.
    diligencePath: Ask for a pre-2024 company history deck covering acquisitions, entity formation, and early commercialization.
    relatedQuestionRefs:
      - QO002
      - QO017
    relatedTableRefs:
      - TO004
  - type: access-blocked
    severity: material
    topic: cancer-burden-slices
    missingEvidence: >-
      Procedure-level WHO/IARC extracts for colorectal, breast, hepatobiliary, and gynecologic disease burden were not
      preserved in the cached fetch output.
    whyItMatters: >-
      Disease-burden detail would strengthen bottom-up SAM framing by matching procedures to incidence without relying
      on company prose.
    diligencePath: >-
      Re-fetch the WHO/IARC Cancer Today query pages for the specific cancer types and geographies used in UltraGreen
      use cases.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: reimbursement-and-budget-owner
    missingEvidence: >-
      No retained procurement, reimbursement, or payer-policy source quantifies who funds each use case or how quickly
      hospitals recover camera and dye spend.
    whyItMatters: Without buyer-budget evidence, SAM and adoption velocity remain less certain than the headline TAM implies.
    diligencePath: >-
      Pull procedure-specific reimbursement policies, tender records, or hospital procurement documents for
      cholecystectomy, colorectal, and lymphatic-mapping workflows.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
      - TM005
  - type: private-evidence-only
    severity: minor
    topic: camera-market-share
    missingEvidence: >-
      The retained official camera pages prove ecosystem breadth but do not quantify installed-base or revenue share by
      vendor.
    whyItMatters: >-
      That missing denominator limits how precisely one can model bargaining power between dye vendor and hardware
      incumbents.
    diligencePath: >-
      Request third-party installed-base studies or hospital device-share data from management and independent medtech
      market reports.
    relatedQuestionRefs:
      - QM018
  - type: conflicting-data
    severity: material
    topic: footprint-definitions
    missingEvidence: >-
      Public materials use 41-country approval, 54-country ICG sales, and 55-country portfolio reach definitions without
      reconciling the scopes.
    whyItMatters: Investors could overstate commercial breadth if these labels are treated as interchangeable.
    diligencePath: Ask management to provide a single market-footprint bridge by product, approval status, and revenue contribution.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: attach-risk
    missingEvidence: >-
      Actual attach rates showing how many dye customers also buy IC-Flow and how many IC-Flow accounts adopt software
      or Data Systems.
    whyItMatters: The moat case depends on conversion from generic ICG usage into higher-value attached modules.
    diligencePath: Request cohort-level attach and renewal data by geography and procedure family from management.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized pricing, distributor discounts, service terms, and multi-product package economics for UltraGreen and
      comparable incumbents.
    whyItMatters: Without contract economics, a public quote-only comparison can overstate or understate procurement friction.
    diligencePath: Request de-identified contracts, distributor agreements, and sample quotes from winning and lost deals.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: distribution
    missingEvidence: >-
      Installed-base counts, distributor performance by region, and replacement-cycle evidence for UltraGreen versus
      incumbents.
    whyItMatters: Distribution strength determines whether better workflow messaging can overcome incumbent tower ownership.
    diligencePath: Request installed base by product family and compare with distributor concentration and top-country revenue mix.
  - type: stale
    severity: minor
    topic: software-moat
    missingEvidence: >-
      Fresh production references showing hospitals actively using PerfusionWorks or UltraGreen Data Systems rather than
      roadmap messaging alone.
    whyItMatters: Future-tense platform claims are weaker than production adoption proof when assessing moat durability.
    diligencePath: Request named hospital deployments, live screenshots, and post-install usage metrics tied to software modules.
    relatedQuestionRefs:
      - QP018
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: Realized pricing by geography, distributor channel, and product stream plus discounting and rebate mechanics.
    whyItMatters: >-
      Strong aggregate margins are visible, but investors still cannot see whether price realization is driven by dye
      mix, distributor economics, or one-off price actions.
    diligencePath: >-
      Request ASP bridges by product, geography, and direct-versus-distributor channel for FY2024, FY2025, and Q1
      FY2026.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-and-distributor-concentration
    missingEvidence: Top-customer, top-distributor, and top-country concentration with renewal or churn behavior.
    whyItMatters: >-
      Public profitability looks strong, but concentration could make revenue quality much weaker than topline totals
      imply.
    diligencePath: Request top-20 customer and distributor revenue concentration, contract tenure, and country mix by gross margin.
    relatedQuestionRefs:
      - QI014
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: segment-margin-mix
