- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Procedure penetration in colorectal, breast, and cholecystectomy
    - Public proof is concentrated in a small named cohort and broad unnamed claims
    - Could make growth look broader than disclosed account base
    - Request top-10 account and procedure revenue mix
  - - APAC approvals plus distributor rollout
    - Approvals may outpace actual hospital conversion
    - Could delay realization of geographic growth assumptions
    - Request first-site launches and distributor sell-through data
  - - Training programmes and KOL network
    - Training intensity may be compensating for a still-nascent installed base in newer markets
    - Could elevate customer-acquisition cost and elongate payback
    - Request training-to-order conversion metrics
  - - Dye-to-imaging-to-data upsell path
    - Cross-sell may be slower if hospitals standardize on competitor camera ecosystems
    - Could cap wallet-share expansion despite strong dye position
    - Request attach-rate data for IC-Flow and software
  - - Clinical safety warnings and protocol needs
    - Hospital committees may require more governance, slowing adoption in some sites
    - Could reduce adoption speed or increase support burden
    - Request adverse-event monitoring and hospital protocol evidence
  - - Installed-base imaging alternatives
    - Hospitals may already use Medtronic, Getinge, or other NIR platforms
    - Can slow IC-Flow attach rates even when dye demand grows
    - Request attach-rate data versus installed camera base by geography
  notes: Risks are framed around what the retained source set can and cannot prove; no public concentration schedule is available.
