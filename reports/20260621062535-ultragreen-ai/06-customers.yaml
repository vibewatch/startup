  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A full named-customer roster with hospital names, contract start dates, and product mix beyond the five-hospital cohort.
    whyItMatters: Without broader named-account disclosure, concentration and production-versus-pilot status remain only partially visible.
    diligencePath: Request a top-20 hospital account list and reconcile it to dye, imaging, and software revenue.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, reorder cadence, and customer satisfaction metrics by geography or product.
    whyItMatters: These metrics are required to convert adoption proof into a durability view.
    diligencePath: Ask management for cohort reorder data, distributor sell-through, and top-account renewal schedules.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer concentration, active hospital counts, and the revenue contribution of the five-UK-hospital cohort and APAC rollout.
    whyItMatters: Concentration risk and upside from named proof cannot be underwritten without account-level economics.
    diligencePath: Request a customer concentration schedule and bridge it to FY2025 and FY2026 guidance.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU005
