- id: training-rollout-and-expansion-motion
  title: Training, rollout infrastructure, and expansion motion
  body: 'The customer chapter is strongest when hospital proof is read together with training and rollout infrastructure. UltraGreen is not relying only on product claims; the 1Q2026 update shows webinars, distributor training, peer-to-peer surgeon programs, and fellow sponsorships, while the products page and ISFGS resources show a deliberate clinician-education layer. That matters because fluorescence-guided surgery adoption depends on workflow confidence, dosing know-how, and procedure-specific evidence rather than on a one-time hardware sale. The March 2026 APAC approvals for India, Thailand, the Philippines, and Bangladesh also matter for customers because they open additional geographies where the same dye-imaging workflow can be sold, and DBS explicitly reads them as groundwork for future ICG adoption. Integration evidence is another positive: third-party camera-system documentation suggests hospitals can often add UltraGreen’s dye and open-procedure imaging workflow without replacing
    their entire installed tower ecosystem. Together, these signals support a land-expand-educate model rather than a one-off device transaction.'
