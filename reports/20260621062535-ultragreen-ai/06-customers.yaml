- id: named-proof-and-adoption-quality
  title: Named customer proof, use-case evidence, and adoption quality
  body: 'The strongest customer-proof artifact in the fetched cache is the May 2026 AGM presentation, which explicitly says company revenue and data are based on a cohort of five UK hospitals: Colchester, James Paget, Ipswich, Manchester University Hospitals, and Southampton & Portsmouth. That matters because most public medtech customer pages stop at logos or generalized case studies; UltraGreen at least names a hospital cohort and ties it to real-world data. The official use-cases page then layers quantified procedure benefits on top of that proof, especially in colorectal surgery and breast workflows. Still, the evidence should be scored carefully. The five-hospital statement is cohort-level rather than account-level, so investors do not get contract size, renewal timing, whether all five hospitals are still active, or how much revenue the cohort contributes. Likewise, the company points to widespread hospital adoption and a large installed clinical evidence base, but independent customer
    testimonials remain sparse. The result is a customer-proof stack that is better than mere marketing but weaker than a fully disclosed named-account roster.'
  claimRefs:
