  - - Distributor-led expansion markets
    - Distributors / surgeons / hospitals / local payers
    - IC-Flow rollout and future ICG adoption in APAC markets
    - India, Thailand, Philippines, Bangladesh approvals plus DBS note
    - Expands geographic footprint from a small base
    - No local hospital names or launch cadence disclosed
  - - Future data-workflow adopters
    - Surgeons / hospital innovation leads / procurement
    - PerfusionWorks and data capture layered on top of dye plus imaging
    - Products page and FY2026 guidance frame data as upsell path
    - Potential margin and lock-in expansion driver
    - No software revenue split or customer references yet
