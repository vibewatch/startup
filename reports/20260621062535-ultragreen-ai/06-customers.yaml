chapter:
  number: 6
  title: Customers
  summary: UltraGreen.ai has credible hospital-centered adoption proof anchored in workflow-specific use cases, a named five-UK-hospital cohort, extensive surgeon-training activity, and an expanding APAC regulatory footprint, but public evidence still stops short of customer counts, renewal metrics, or concentration schedules. The practical view is that adoption is real and multi-layered, yet durability and account-level economics remain materially under-disclosed.
sections:
- id: customer-segmentation-and-jobs-to-be-done
  title: Customer segments, buyers, and jobs to be done
  body: 'UltraGreen.ai’s customer evidence points to a hospital-centered go-to-market motion with several layers of users and buyers. The end user is the surgeon and operating-room team; the institutional buyer is the hospital or distribution channel deciding whether to standardize IC-Green or Verdye, adopt IC-Flow, and eventually layer in quantification software and data workflows. The public use-cases page is useful because it defines demand in workflow terms rather than abstract AI language: laparoscopic cholecystectomy, colorectal perfusion, breast sentinel mapping, and breast reconstruction are all procedure-led jobs where better visibility can change intra-operative decisions. Public materials also imply a second layer of payer logic: hospitals care about fewer leaks, shorter stays, fewer reoperations, and surgeon confidence, while distributors and hospital systems care about regulatory approvals, training support, and fit with existing OR imaging infrastructure. That segmentation
    is commercially attractive because the dye business can land first, imaging can expand wallet share, and data products can become a later upsell, but the company still does not disclose revenue by segment or by buyer type.'
