    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QU001
    - QU002
  - id: CU002
    statement: The laparoscopic cholecystectomy use case says the procedure exceeds 750,000 cases per year in the United States, framing it as a high-volume adoption wedge.
    type: company-claimed
    topic: procedure-volume
    sourceRefs:
    - SU001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QU002
  - id: CU003
    statement: The colorectal use case states typical post-colectomy anastomotic leak rates are about 16% and says ICG use has been associated with a 50% reduction in leaks.
