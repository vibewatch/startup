  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买方与待完成任务
        blocks:
          - type: paragraph
            body: >-
              UltraGreen.ai 的客户证据指向一个以医院为中心、分多层用户和买方的 go-to-market 动作。最终用户是外科医生和手术室团队；机构买方是医院或分销渠道，决定是否标准化 IC-Green 或
              Verdye、采用 IC-Flow，并最终叠加定量软件和数据工作流。公开用例页面有价值，因为它用工作流而不是抽象 AI
              语言定义需求：腹腔镜胆囊切除、结直肠灌注、乳腺前哨淋巴定位和乳房重建，都是由手术场景牵引、可通过更好可视化改变术中决策的任务。公开材料还暗示第二层支付方逻辑：医院关心渗漏减少、住院期缩短、再手术减少和外科医生信心；分销商和医院系统则关心监管批准、培训支持，以及能否贴合既有
              OR 影像基础设施。这个分层具有商业吸引力，因为染料业务可以先落地，影像可以扩大钱包份额，数据产品可以成为后续 upsell；但公司仍未按分部或买方类型披露收入。
