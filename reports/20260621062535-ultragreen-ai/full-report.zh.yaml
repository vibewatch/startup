      - number: '3.2'
        title: 能力与工作流比较
        blocks:
          - type: paragraph
            body: >-
              能力宽度是 UltraGreen 可能拥有战略楔子的地方，但还不是一个干净的产品优越性声明。留存的 UltraGreen 页面描述了一组打包能力：染料、开放手术影像、偏 AI
              的定量和云数据层。相比之下，竞争对手页面强调影像质量、工作流和装机基础灵活性：Medtronic 强调开放和腹腔镜手术中的荧光信号强度测量，Olympus 强调软件驱动的 4K 多专科影像，KARL STORZ
              强调 4K、3D 和叠加模式，Richard Wolf 强调荧光与白光同步观看。这意味着 UltraGreen
              的差异化不在于拥有荧光本身，而在于试图把工作流从定性影像推向标准化定量和报告。风险在于，公开材料里的这条边仍部分停留在将来时，因此还不能当作已完全验证的商业分离。第二个重要买方取舍是部署野心。如果一个账户只想在现有塔式预算内获得更好的荧光可视化，既有厂商选项仍可信。如果它想要结构化灌注报告、面向外科医生的定量，以及医院系统数据轨迹，UltraGreen
              至少提出了比多数抓取设备页更宽的运营范围。
