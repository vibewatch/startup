      - number: '1.4'
        title: 财务规模、公开里程碑与可见警示
        blocks:
          - type: paragraph
            body: >-
              公开披露已经足以确认运营规模。UltraGreen 报告 FY2025 收入 US$142.4 million、毛利 US$121.1 million、调整后 EBITDA US$89.4
              million、扣除特殊项目前 NPAT US$63.8 million；年报还强调约 US$176.1 million
              的净现金。这些盈利指标对一家最近上市的成长型医疗科技公司来说异常强，也解释了后续章节为什么应把业务视为已规模化商业平台，而不是投机性的收入前影像故事。主要警示不是生死问题，而是定义问题：不同材料中的已营销国家数量不一致，前身创始人和控制历史不够透明，客户集中度仍未明确披露。这些缺口都不推翻公开公司论点，但足够重要，应该留在尽调清单上。第二个警示偏运营而非表面：招股书在最后实际可行日期仍把
              WeylChem ORGANICA 描述为唯一 API 供应商，尽管后续 FY2025 和 FY2026
              材料强调第二供应商资格认证和新增产能。这个顺序支持正面的扩张叙事，但也意味着投资者应把供应多元化视为仍在执行的事项，而不是已经完全关闭的历史风险。
