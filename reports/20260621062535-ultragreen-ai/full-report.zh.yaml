      - number: '2.4'
        title: 增长驱动、约束，以及估值为何取决于工作流转化
        blocks:
          - type: paragraph
            body: >-
              增长故事不只是更多手术。它还包括论文发表动能、KOL
              教育、监管覆盖扩大、大量兼容相机系统装机基础，以及定量化随时间抬高工作流价值的可能性。但约束同样清晰。标签范围仍按手术场景限定，不良反应仍有临床相关性，协议标准化不完整，不同文件里的市场足迹定义也不一致。供应集中同样重要，因为招股书在最后实际可行日期仍点名唯一
              API 供应商。估值上，最重要的信号是：即使在定量化变得重要之前，当前经济性已经很强。UltraGreen 留存的 FY2024
              指标意味着一个有定价权的高毛利耗材业务。未解的问题是，这部分价值最终有多少归属于染料、硬件伙伴，或未来的定量工作流层。另一个实际约束是，留存语料在临床有效性和分子经济性上的证据，明显强于买方侧转化机制。这个失衡对估值很重要：它支持需求存在，但仍留下一个问题——医院委员会是否足够快批准相机、协议和经常性采购，让软件式上行在承销周期内变得重要。
