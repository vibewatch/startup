              UltraGreen，也会扩大那些已经进入医院预算的大型可视化厂商的市场。主要人员和伙伴风险不是市场缺乏对荧光的兴趣，而是 UltraGreen 能否比既有厂商回应得更快，把兴趣转成附着收入。
