      - number: '8.5'
        title: 反命题、反向证据和尚待证明的事项
        blocks:
          - type: paragraph
            body: >-
              反命题不是 UltraGreen.ai 没有业务，而是市场可能愿意用一个价格去资本化一家很好的公司，而这个价格已经消化了大量近期上行。公开文件仍未披露 IPO
              后普通上市股东之外的优先权结构图、详细客户集中度表、ARR 式复购、或积压订单到收入的桥。AGM 期间材料也没有重述清晰的绝对股数，因此招股书仍是核心参照。除这些披露缺口外，FDA 和 DailyMed
              标签构成真实的反向输入：超敏反应，包括已报告的过敏性休克死亡，虽可管理但风险真实，可能拖慢医院审批并增加支持负担。因此，只看公开证据，正确动作是跟踪而不是买入：投资者可以观察执行和需求，而不必假设早期二级市场热情会保证当前价位仍有持久上行。
