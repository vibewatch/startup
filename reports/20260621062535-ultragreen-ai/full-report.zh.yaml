            body: >-
              从运营看，核心业务比许多早期公开市场医疗科技故事更强：年报指向第二 API 供应商、三处供应设施、高产能覆盖、强利润率和可观净现金。但这些缓释因素不能消除商业执行风险。公开收入披露仍压倒性指向 ICG
              药瓶经济性，而已披露软件收入仍小，并且部分关联已终止的 UltraLinQ 贡献。这让产品附着成为关键商业问题。IPO、AGM 和 DBS 材料都暗示，投资论点取决于把 IC-Flow
