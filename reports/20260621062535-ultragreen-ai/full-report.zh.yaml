      - number: '7.4'
        title: 缓释、监控指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              正确的承销框架是条件式，而不是二元式。留存语料中，UltraGreen 有可信缓释因素：公开治理政策、SGX 时代可见披露活动、多项供应链强化主张、FY2025 强现金生成，以及仍在扩大的 ICG
              临床证据基础。这些都不能取消监控需要。投资者应把审批顺序、附着率和国家定义纪律视为实时控制点。论点破裂不一定需要监管禁令；也可能是更软但仍严重的模式：设备批准没有转化为染料批准，染料批准没有转化为打包收入，或公开公司围绕这些过渡的披露变得混乱。同样，如果领导层集中度比董事会和治理脚手架更难吸收，或既有相机生态限制附着经济性，即便近期收入和现金健康，估值论点也应压缩。协议纪律也重要：临床指南中的适应症特定给药、时点和解读要求意味着，即使核心染料广为人知，商业化质量仍可能有差异。
