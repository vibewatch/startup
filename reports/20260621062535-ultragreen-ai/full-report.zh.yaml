  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与已披露 FY2025 表现
        blocks:
          - type: paragraph
            body: >-
              UltraGreen 的财务画像最好理解为一个以耗材为牵引、围绕影像和软件带有可选性的医疗科技平台，而不是纯软件发行人。财务报表把主要活动定义为销售 ICG 药品，加上诊断影像分析和软件解决方案；产品栈则横跨
              IC-GREEN 或 Verdye、IC-Flow 影像、PerfusionWorks 和 UltraGreen Data Systems。这一点很重要，因为 FY2025 记录并没有呈现一条单一 SaaS
              业务线；它显示的是染料用量、手术采用和一个较小的软件层共同贡献收入的业务。


              FY2025 头部数字很强，并在年报、财务报表、新闻稿和业绩材料中得到一致印证。收入约 US$142.4 million，剥离 UltraLinQ 后持续经营收入为 US$137.9 million，毛利
              US$121.1 million，毛利率 85.0%，调整后 EBITDA US$89.4 million，扣除特殊项目前 NPAT US$63.8 million。用量和 ASP
              数据也指向真实运营动能，而不是会计表象：FY2025 药瓶销量升至约 987.7 thousand units，管理层把部分增量归因于 3Q2025
              的美国提价动作。仍缺的是产品流精度：公开披露没有把染料、影像、软件和分销经济性之间的实际收入清晰拆开。
