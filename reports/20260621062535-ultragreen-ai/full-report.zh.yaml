      - number: '1.3'
        title: 资本历史、所有权与公开市场切换
        blocks:
          - type: paragraph
            body: >-
              资本故事有两个阶段，必须拆开看。第一，多篇 2025 年 9 月报道和一家律所交易说明指向一笔约 US$187.5-188 million 的 IPO 前战略股份出售或投资，关联 65 Equity
              Partners、Vitruvian 相关实体和 August Global，隐含估值约 US$1.3 billion。第二，2025 年 11 月 MAS 注册招股书和 2025 年 12
              月上市，把公司切入公开市场框架：发行价每股 US$1.45，据报认购需求约为发行账簿的 13.6 倍，IPO 后股东基数很大。此后公开持股披露显示，65 Equity Partners 相关和 Vitruvian
              相关实体仍有实质影响力。可复用的正确结论不是一个估值取代另一个，而是 IPO 前私募标记和公开上市共同呈现了一条快速重估到上市医疗科技区间的路径。
