      - number: '6.2'
        title: 具名客户证明、用例证据与采用质量
        blocks:
          - type: paragraph
            body: >-
              抓取缓存中最强的客户证明材料，是 2026 年 5 月 AGM 演示，其中明确说公司收入和数据基于五家英国医院组成的队列：Colchester、James Paget、Ipswich、Manchester
              University Hospitals，以及 Southampton & Portsmouth。这一点重要，因为多数公开医疗科技客户页只停留在 logo 或泛化案例研究；UltraGreen
              至少点名了一个医院队列，并把它与真实世界数据挂钩。官方用例页面随后把定量化手术收益叠加到这项证明之上，尤其是在结直肠手术和乳腺工作流中。尽管如此，证据仍需谨慎打分。五家医院表述是队列层而非账户层，因此投资者看不到合同规模、续约时点、五家医院是否仍全部活跃，或该队列贡献了多少收入。同样，公司指向广泛医院采用和庞大已安装临床证据基础，但独立客户证言仍稀少。结果是，一个比纯营销更强、但弱于完整披露具名账户名单的客户证明栈。
