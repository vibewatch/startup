      - number: '4.3'
        title: 资本充足性、IPO 机制与 FY2026 展望
        blocks:
          - type: paragraph
            body: >-
              按已报告数字看，资本充足性稳固。年末现金及现金等价物约 US$176.1 million，借款降至约 US$3.1 million，权益重置到约 US$310.6
              million。申报文件解释，这并非纯粹内生：FY2025 包括 US$150.0 million 的 IPO 总募集资金，以及一张欠直接控股公司的本票完成 US$142.8 million
              债转股。这一点是正面的，因为它意味着上市后资产负债表足够干净，可以支持扩张；但它也意味着投资者应区分底层现金生成和一次性资本化事件。US$39.75 million 股息和 US$8.5 million
              股息收入税项拨备还显示，IPO 年的财务架构里已经存在股东回报。


              IPO 机制在招股书、MAS 页面和市场数据来源中证据充分。UltraGreen 以 US$1.45 发行 112,068,200 股；另有基石协议覆盖 163,793,900
              股卖方股份，价格相同。因此，媒体把纳入基石承诺后的上市过程相关资本描述为约 US$400 million。往前看，最干净的管理层指引是 FY2025 业绩材料和 AGM 演示中反复出现的 FY2026 收入
              US$170 million 到 US$190 million 区间。公司显然预期继续增长，但即便这里精度也不完美：一份材料把该区间表述为约 19% 到 33% 增长，AGM 演示则表述为约 15% 到
              33%。因此，数字本身比围绕它的宣传性百分比框架更可靠。
