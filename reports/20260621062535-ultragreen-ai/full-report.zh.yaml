            body: >-
              最强的留存测算视角来自引用 Frost & Sullivan 的招股书和产品页材料。这些来源支持 2024 年全球 ICG 市场 USD 173.2 million、2030 年预测 USD 335.4
              million，以及 USD 925.1 million
              的完全渗透可得市场。这个框架有用，因为它把今天可观察市场和更完整的手术机会分开。它也说明，采用节奏比单纯说市场很大更重要。成熟的美国手术场景渗透率仍看起来低于 25%，而亚太是增长最快地区，CAGR 为
              16.6%。AGM 材料还把市场描述为仅渗透 15% 到 20%。合在一起，这些来源支持长期空间论点，但它们本身不能证明医院会多快把证据转化为标准化采购。
