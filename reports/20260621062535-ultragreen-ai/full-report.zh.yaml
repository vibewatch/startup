            body: >-
              公开耐久性证据仍是最大漏洞。抓取材料中，UltraGreen 未披露
              NRR、GRR、流失率、续约率、活跃医院数量、满意度评分或大客户集中度指标。这意味着投资者可以看到有意义的采用表面，却还不能验证客户基础到底有多粘、多分散。公开故事也有一定集中度：五家英国医院队列是最具体的医院证明，而更广泛的医院和外科医生说法仍主要由公司控制。反向证据也存在，不过是产品和协议相关，而不是客户投诉驱动。DailyMed
              和 FDA 标签都警示超敏反应，包括过敏性休克；FDA
              标签还提示曾报告因过敏性休克死亡，以及短暂甲状腺碘干扰。这些警示不否定产品市场匹配，但强化了一个事实：医院采用需要临床培训、协议和安全治理。尽调结论是，公司有可信的采用证明，但公开留存和集中度可见度仍显著不完整。
