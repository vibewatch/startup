              需求数据解释了为什么公开估值能高于最后私募标记。Minichart 的 IPO 文章称，总认购和意向达到可售股份的 13.6 倍，新加坡公开发售单独获得 4.5 倍认购；16 名投资者的基石承诺合计
              US$237.5 million。Channel News Asia 和 The Straits Times 随后显示即时二级市场支撑：股价高于 US$1.45 发行价，报道成交价约 US$1.60，盘中高点
