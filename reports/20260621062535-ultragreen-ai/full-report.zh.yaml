companyProfile:
  summary: >-
    UltraGreen.ai 是一家在新加坡注册并于 SGX 上市的荧光引导手术公司，平台把 IC-Green / Verdye 染料产品线、IC-Flow 影像系统、PerfusionWorks 定量软件和 UltraGreen
    Data Systems 组合在一起。公开材料显示，公司 FY2025 盈利能力很强，监管和商业足迹也很广；但前身公司历史、客户集中度，以及管理层如何界定已营销国家与已批准国家覆盖，仍有待厘清。
