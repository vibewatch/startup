            body: >-
              反向论点需要认真看待。ICG 本身已经被大量验证、获得学会背书，并由多家兼容相机厂商支持，因此 UltraGreen
              在化学层没有明显排他性。既有厂商还拥有更广的装机基础和多专科预算关系。因此，UltraGreen
              的护城河主张是有条件的：取决于外科医生和医院是否足够重视染料-相机-软件-数据一体化工作流，愿意在已经熟悉的现状之外继续附着。公开材料显示管理层理解这一点，因为它们强调外科医生伙伴关系、软件定量、联网报告，以及染料加相机打包。但精确附着率、实际定价，以及数据产品改变购买行为的程度，在留存证据中仍未解决。在这些证明公开之前，近期最耐久的优势看起来是临床生态策划和工作流包装，而不是不可攻破的专有硬件。
