            body: >-
              领导层和生态依赖仍然重要。公开材料持续把战略监督、商业关系和很大一部分外部叙事放在 Ravinder Sajwan 身上。Channel News Asia
              还把软件缺口识别和应用扩展归因于外科医生关系，进一步说明 KOL 触达和创始人主导的关系执行，离产品路线图很近。同时，Diagnostic Green 自己的兼容性页面显示，许多获批相机系统已经能支持
              ICG。这意味着 UltraGreen 不只是在与直接染料替代品竞争，也在与 Stryker、Medtronic、Olympus 或 Quest 相关系统、KARL STORZ、Richard
