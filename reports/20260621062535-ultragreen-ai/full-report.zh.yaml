      - number: '1.2'
        title: 领导层、董事会厚度与关键人集中度
        blocks:
          - type: paragraph
            body: >-
              领导层披露是公开记录里相对干净的一块。Ravinder Sajwan 一直被标注为首席执行官兼执行董事；主席 Kwa Chong Seng 和独立董事 Hsieh Fu Hua、Sir David
              Lane、Nicky Tan、Professor Toh Han Chong
              让董事会同时具备新加坡建制派信誉、癌症研究深度、医疗体系经验和资本市场经验。治理包也已经包括投资者关系、董事会委员会和举报政策。即便如此，公司概览尽调也不能把治理视为已去风险。公开记录显示，战略和商业关系高度围绕
              Sajwan 展开，而前身业务的原始创始人故事，相比非常醒目的董事会名单，仍解释不足。这让公司看起来比典型新上市医疗科技发行人更机构化，但执行层仍多少依赖个人。
