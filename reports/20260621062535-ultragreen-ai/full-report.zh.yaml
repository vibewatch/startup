      - number: '2.3'
        title: 买方地图与撬动经常性需求的临床证据
        blocks:
          - type: paragraph
            body: >-
              买方路径由手术场景牵引。外科医生和科室 champion
              产生需求，医院资本支出和处方集流程决定哪种相机和染料可以标准化；只有协议经受住真实手术室使用后，药瓶的经常性需求才会跟上。这也是留存临床证据如此关键的原因。在留存资料中，SAGES
              提供最强的结直肠支持；乳腺和淋巴定位证据来自 Frontiers、PubMed 和 Indian PMC 队列。ISFGS 随后把这些文献转成跨多个专科的给药和时点工作流。UltraGreen
              的用例页面把故事延伸到手术经济性，尤其是胆囊切除和结直肠手术。因此，证据基础足够宽，可以解释买方为什么参与；但按适应症看仍不均衡，而且往往对染料的说服力强于对任何单一影像硬件厂商的说服力。
