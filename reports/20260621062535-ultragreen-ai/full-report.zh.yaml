      basis: >-
        The table includes every defensible valuation reference visible in retained sources: the pre-IPO sale, IPO
        terms, aftermarket prints, DBS, and internally derived scenario ranges built from public guidance.
    notes: 这张表有意做成参考点表，而不是传统同业可比表，因为保留的同业估值数据稀薄，且贴合度不高。
