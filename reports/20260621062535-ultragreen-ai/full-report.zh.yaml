    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律锚点与当前阶段
        blocks:
          - type: paragraph
            body: >-
              UltraGreen.ai 已不能再按隐身或披露很少的创业公司来分析。公开材料显示，UltraGreen.ai Limited 是一家新加坡注册控股公司，注册号 202437045W；公司有一份日期为 2025
              年 11 月 26 日、在 MAS 注册的招股书，并到 2026 年 4 月已经形成完整的 SGX 主板上市和 AGM 轨迹。法律时间线很关键：它解释了一个看似年轻的 2024
              年新加坡实体，如何同时拥有公司公开描述的更深运营历史、2015 年以来赋能的 600
              万台手术，以及成熟的吲哚菁绿荧光产品全球商业足迹。尽调上的实际结论是，应把公司视作一家公开上市的成长型医疗科技平台，其前身运营资产早于上市控股公司成立。后续章节复用公司身份时，应锚定公开发行人、荧光引导手术定位和产品生态，而不是误以为这只是一个成立一年的商业化前创业公司。
