        - 隐含市值区间约 US$1.67B-US$1.79B
        - 显示配售日之后需求仍在
        - 首秀热度可能夸大公允价值
      - - 2026 年 3 月 DBS 观点
        - US$1.53 股价和 US$2.00 目标价
        - 现货市值约 US$1.69B；目标对应 US$2.2B 以上
        - 提供外部公开市场锚点
        - 单一卖方观点，不是共识样本
      - - 内部 FY2026 熊 / 基准 / 牛区间
        - US$170M-US$190M 收入，7x-13x EV/收入
        - US$1.37B-US$2.65B 股权区间
        - 同业数据稀薄时，方法更透明
        - 取决于假设倍数和指引可信度
      - - 存量成像厂商组
        - Stryker / Karl Storz / Richard Wolf / Medtronic / Getinge / Inomed 产品页面
        - 仅作竞争语境；未保留估值倍数
        - 有助于说明为何不应按无竞争的成像扩张来给 UltraGreen 估值
        - 不是干净的估值可比组，因为缓存缺少匹配的公开倍数数据
    enumerationScope:
