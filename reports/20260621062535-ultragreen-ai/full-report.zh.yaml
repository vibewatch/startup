    type: kpi
    layout: standard
    summary: 仅用保留的公开证据，对 UltraGreen.ai 投资案例做 IC 式评分。
    data:
      items:
        - label: 基本面质量
          score: 8.5
          detail: 高利润率、NPAT 和净现金，对新近上市公司而言异常强
        - label: 估值透明度
          score: 5
          detail: IPO 条款披露强，IPO 后股权结构和经常性收入细节较弱
        - label: 市场支持
          score: 7.5
          detail: 超额认购、首日溢价和 DBS 目标价都支撑需求
        - label: 下行保护
          score: 7
          detail: 现金和盈利能力提供的底部，比早期医疗科技 IPO 更稳
        - label: 披露风险
          score: 4.5
          detail: ARR、集中度和积压订单转化仍未披露
        - label: 不利风险控制
          score: 5
          detail: 安全警示看起来可控，但确实会影响医院采用速度
        - label: 当前价格吸引力
          score: 6
          detail: 接近 IPO 价格时看起来合理，上市后立即重估则吸引力下降
