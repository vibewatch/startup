  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代方案与实际销售对象
        blocks:
          - type: paragraph
            body: >-
              UltraGreen 不只是卖一种染料，但实际市场边界仍从吲哚菁绿耗材以及临床医生已经知道如何使用它的手术场景开始。留存材料支持一套工作流栈：从 IC-GREEN 或 Verdye
              延伸到兼容相机，再进入定量和结构化报告。这个更宽的框架很重要，因为它避免了两个常见误判：把机会只看成试剂小市场，或把它看成全部外科影像支出。资料反而指向一个中间地带：染料需求由特定手术的临床证据、兼容相机可得性，以及对定量决策支持的兴趣共同拉动。主要替代方案仍是白光可视化、蓝染或放射性同位素定位，以及不带定量荧光的外科医生判断；因此采用取决于具体临床任务，而不是泛泛的「更好影像」叙事。这让承销口径保持克制。面向投资人。放在今天看。
