      - number: '4.4'
        title: 财务结论与剩余尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              证据导向的结论，比「近期 IPO 医疗科技」这种市场 shorthand 更有利。UltraGreen 并非只是盈利前或概念阶段：进入 FY2026 时，它已有经审计 FY2025 收入超过 US$140
              million、强毛利率、强 EBITDA、正经营现金流、低剩余借款，以及可观净现金。DBS 的独立分析师覆盖进一步强化了公司确有盈利能力这一点，同时也提醒，APAC 审批尚不太可能显著推动 2026
              年集团盈利，因为该地区仍从小基数起步。


              剩余阻塞点关乎盈利质量和呈现精度，而不是业务是否存在。公开来源仍未披露客户集中度、按业务流的实际定价、经常性收入占比、CAC 或回本期，或分部层面利润率。次级定义在不同材料间也漂移：国家数量横跨 35
              个以上已营销国家、截至 2026 年 1 月的 40 个已批准国家、新加坡批准后的 41 个，以及 55
              个以上已销售国家。这些冲突应保留为证据缺口，而不是强行合并成一个虚假的精确数字。由此形成的承销姿态是：对偿付能力和规模建设性看待，但仍取决于管理层能否把汇总盈利更紧密地桥接到业务流层面的收入质量。
