      - number: '3.3'
        title: 定价、分销与切换
        blocks:
          - type: paragraph
            body: >-
              抓取资料中的定价透明度很弱，因此采购问题不太是标价，而是打包逻辑、分销触达和既有硬件。审阅过的 Stryker、Medtronic、Olympus、KARL STORZ、Richard Wolf 和
              UltraGreen 官方页面都没有公布实际合同金额；UltraGreen 自身公开材料转而强调审批、用例和平台方向。同时，兼容相机页面显示，医院已经可以在多个获批系统上运行 ICG
              工作流。这降低了买方的切换成本，尤其是那些已经信任既有塔式系统，或想在不替换更广泛可视化标准的情况下加上荧光的买方。UltraGreen 的答案是打包：AGM 材料明确把 IC-Flow
              加染料与分散场景采用挂钩，DBS 则把影像审批解读为后续染料驱动变现的基础。因此，商业争论在于附着率和渠道杠杆，而不只是原始技术表现。
