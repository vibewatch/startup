  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 业绩后股价重置到 IPO 区间以下
        - 财报或指引后，股价持续低于约 US$1.45
        - 表明 IPO 重估不具备韧性
        - 等待更低、重新核保后的入场点，而不是因情绪下跌而摊低成本
      - - 指引不及预期
        - FY2026 收入展望下调至 US$170M-US$190M 区间以下
        - 打破基于当前公开指引搭建的基准和牛情景
        - 下调公允价值区间，并重审所有倍数
      - - 披露令人失望
        - 后续业绩仍没有有意义的积压订单、ARR 或集中度细节
        - 股票继续依赖叙事，而不是收入质量
        - 维持跟踪立场，并拒绝给出溢价倍数扩张
      - - 安全或监管受挫
        - 重大不良事件、警告升级，或规程导致医院采用放慢
        - 提高折现率，并削弱扩张假设
        - 提高谨慎度；转向偏贵 / 回避立场
      - - 超出常规计划预期的稀释性发行
        - 大额融资或股权发行，但没有相称的增长证据
        - 即使企业价值增长，也会侵蚀每股上行
        - 增加敞口前，基于新的股本重建估值
    notes: 触发器有意设计为可监测，并绑定公开可观察披露或市场成交。
    claimRefs:
      - CV023
      - CV038
      - CV039
      - CV042
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方 / 尽调路径
    rows:
      - - AGM 阶段材料中的 IPO 后绝对股数
        - 管理层清晰重述上市后流通股数，以及任何绿鞋影响
        - 消除每股估值工作中的残余模糊
        - 请求 IR 确认，并与招股书资本结构表核对
      - - 股权结构和悬而未决压力
        - IPO 后锁定期、附带协议、期权池使用，以及任何剩余的类优先权利
        - 决定真实每股经济性和稀释风险
        - 复核 IPO 分配、锁定安排和后续主要股东申报
      - - 收入质量
        - 积压订单转化、经常性收入组合、客户集中度和复购节奏
        - 让公允还是偏紧的判断更清晰
        - 要求从 FY2025 到 1H2026 业绩的分部桥接
      - - 客户韧性
        - 大客户集中度，以及任何医院续约 / 复购指标
        - 检验手术规模能否转化为粘性经济性
        - 要求提供复购 cohort 或经销商 sell-through 数据
      - - 安全治理
        - 不良事件监测、规程支持和医院培训负担
        - 说明安全相关摩擦是否可控，还是会稀释利润率
        - 要求提供药物警戒摘要和医院支持指标
      - - 竞争胜率
        - 相比存量成像系统的附着率数据，以及替换或共存动态证据
        - 将说明成像扩张是否配得上溢价倍数
        - 要求管理层提供按医院细分的装机基础映射和赢 / 输分析
    notes: 这些尽调问题，是把公开市场的跟踪评级推进到高确信买入或更严格回避决定的最短路径。
    claimRefs:
      - CV031
      - CV042
      - CV045
      - CV047
      - CV048
