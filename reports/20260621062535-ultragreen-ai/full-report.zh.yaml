            body: >-
              UltraGreen.ai 的特殊之处在于，最后一次私募 step-up 和 IPO 价格都足够可见，可以搭一座干净的桥。最强的 IPO 前来源是 Allen & Gledhill，其称
              UltraGreen.ai Private Limited 约 14.42% 股权在 2025 年 9 月以 US$1.3 billion 股权估值出售给一个包括 65 Equity
              Partners、Vitruvian 和 August Global 的财团。招股书随后给出公开市场重置点：以 US$1.45 发行 112,068,200 股，其中包括 103,448,300 股新股和
              8,619,900 股卖方股份。利用招股书披露的股份拆分历史，最佳公开重构是 IPO 后、任何超额配售行使前约 1.103 billion 股，对应发行价下约 US$1.60 billion
              股权价值。这意味着公开市场较 IPO 前标记高出约 23%，幅度有意义，但对一家带着新资本、重基石支持和比私募投资者更强披露包上市的盈利发行人来说，并不荒谬。
