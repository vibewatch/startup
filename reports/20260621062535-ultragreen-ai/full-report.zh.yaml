      - number: '4.2'
        title: 利润率驱动、营运资本与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              利润率故事很有吸引力，但并非没有摩擦。公开申报显示，85% 毛利率背后有真实的实物产品经济性：FY2025 销售成本约 US$20.9 million，年末存货约 US$17.2 million，存货费用约
              US$16.7 million。约 US$49.6 million 的贸易应收款和约 US$55.2 million
              的贸易及其他应收款也说明，现金转化取决于渠道回款和运营纪律，而不只是软件式开票。现金流量表仍有利——经营现金流约 US$53.3
              million——但营运资本足迹意味着，应把公司分析为一家盈利的医疗科技分销与供应平台，而不是零库存软件厂商。


              最重要的承销张力在于，最强的盈利披露是汇总层面的，最弱的是业务流层面的。业绩材料给出了销量、ASP、收入、毛利率和
              EBITDA，却仍未披露按地域或渠道的实际定价、客户集中度、CAC、回本期、经常性收入占比，或染料、影像、软件各自的毛利率。招股书时期的风险披露在这里也重要：截至最后实际可行日期，WeylChem
              ORGANICA 仍是唯一商业 API 供应商；后续 FY2025 和 FY2026 材料则把多元化故事描述为已通过第二供应商和新增产能改善。这是正向轨迹，但仍是一座执行桥，而不是已经完全关闭的风险事项。
