      - 相关性
      - 局限
    rows:
      - - 2025 年 9 月 IPO 前出售
        - 以 US$1.3B 估值出售约 14.42% 股权
        - 私募市场参考
        - 上市前最佳直接私募标记
        - 类二级交易，不是公开市场价格
      - - 2025 年 12 月 IPO 发行
        - US$1.45 每股；发售 112,068,200 股
        - 隐含股权价值约 US$1.60B
        - 主要文件给出的最佳公开出清价格
        - 单一时点；市场情绪和基石投资者很重要
      - - 2025 年 12 月上市后二级市场
