        - 盈利能力、现金和既有市场需求提供支撑
        - 需要指引兑现，且没有重大安全或集中度意外
      - - 牛
        - FY2026 收入位于高端（US$190M），11x-13x EV/收入，收入质量披露更强
        - US$2.27B-US$2.65B 股权价值；约 US$2.05-US$2.40 每股
        - 最接近 DBS 目标价和强需求所隐含的上行
        - 既需要运营执行，也需要更好的披露质量
      - - 参考点
        - IPO 定价 US$1.45，约 1.103B 股
        - 约 US$1.60B 股权价值和约 US$1.42B 企业价值
        - 2025 年 12 月实际出清价格
        - 已较上一轮私募标记嵌入显著上调
    notes: 情景估值是基于公开指引和净现金搭建的内部参考区间，并非声称管理层的公允价值目标。
    claimRefs:
      - CV008
      - CV021
      - CV023
      - CV034
      - CV035
      - CV036
  - id: TV004
    title: 可比估值表
    columns:
