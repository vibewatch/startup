              UltraGreen 现在同时承担上市公司义务，以及医疗科技和药品监管义务。MAS OPERA 显示已提交 Product Highlights Sheet
              并注册招股书；招股书本身保留标准上市发行人责任框架，以及从 2024 年新加坡私人控股公司转为 2025 年公开公司的近期法律过渡。Product Highlights Sheet
              明确提醒投资者本金损失风险，年报材料也保留围绕监管、运营和竞争不确定性的前瞻性陈述警示。在产品侧，留存语料显示两条独立审批轨道：IC-Flow 设备许可和 Verdye
              染料批准。这个顺序很重要，因为硬件许可不会在染料尚未获批或本地使用条件不同的情况下，自动创造可变现市场。国家足迹披露也需要谨慎，因为 40 个获批国家、45 个 IC-Flow 批准地区和 55+
