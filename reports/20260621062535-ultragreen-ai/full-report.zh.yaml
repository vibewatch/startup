  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              UltraGreen 至少应与四类解决方案比较。第一类是大型既有可视化平台：Stryker 1688 AIM 及其周边 SPY 系列、Medtronic EleVision IR、Olympus VISERA
              ELITE III、KARL STORZ Rubina 和 Richard Wolf System green。第二类是更专门的荧光系统，例如 Hamamatsu PDE-Neo II，以及 Getinge /
              Fluoptics 的 Fluobeam LS、Fluobeam LX 等产品。第三类是现状方案：购买吲哚菁绿，并使用已经获批的兼容相机系统；Diagnostic Green
              自己的兼容性页面清楚说明，市场上已经有许多这样的平台。第四类是 UltraGreen
              自称的集成平台，它试图在染料和相机硬件之上叠加软件定量和云报告。这个框架很重要，因为买方并不只是在创业公司之间选择；他们常常是在决定是否保留已安装的既有塔式系统，并逐步加上 ICG。
