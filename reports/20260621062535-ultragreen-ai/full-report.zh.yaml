      - number: '8.4'
        title: 内部参考点估值：牛市 / 基准 / 熊市区间
        blocks:
          - type: paragraph
            body: >-
              留存缓存里的可比公司数据很薄，口径也不干净，估值纪律最好还是锚定 UltraGreen.ai 自身公开的经营指标、现金余额和前瞻指引，再用保守和激进的 EV / 收入假设去压测区间。按 IPO 价格，公司交易约为
              FY2025 收入的 11.2x；扣除现金后，EV / 收入约为 10.0x。首日高点时，两项指标分别升至约 12.5x 和 11.3x；DBS 标记价格隐含约 11.9x 和 10.6x。考虑到 85%
              毛利率和很强的盈利能力，这些倍数并不明显荒唐，但也意味着，从 US$1.3B
              私募估值到公开交易，容易兑现的重估几乎马上完成。空头、基准和多头情景因此比不完美的外部可比更关键：盈利和现金能部分托住下行；上行则取决于公司是否真的把 FY2026
              增长转成可重复的收入质量，而不只是维持市场热度。
