- id: pricing-distribution-and-switching
  title: Pricing, distribution, and switching
  body: 'Pricing transparency is weak across the fetched set, so the procurement question is less about sticker price and more about bundle logic, distributor reach, and existing hardware. The official pages reviewed for Stryker, Medtronic, Olympus, KARL STORZ, Richard Wolf, and UltraGreen do not post realized contract values, and UltraGreen’s own public materials instead emphasize approvals, use cases, and platform direction. At the same time, the compatible-camera pages show that hospitals can already run ICG workflows across multiple approved systems. That lowers switching costs for buyers who already trust an incumbent tower or who want to add fluorescence without replacing their broader visualization standard. UltraGreen’s answer is bundling: AGM materials explicitly tie IC-Flow plus dye to adoption in decentralized settings, and DBS reads imaging approvals as groundwork for later dye-driven monetization. The commercial debate is therefore about attach and channel leverage, not just
    raw technical performance.'
