- id: moat-durability-and-adverse-signals
  title: Moat durability and adverse signals
  body: 'The adverse case should be taken seriously. ICG itself is heavily validated, society-endorsed, and already supported by multiple compatible camera vendors, so UltraGreen does not enjoy obvious exclusivity at the chemistry layer. Incumbents also come with broader installed bases and multispecialty budget relationships. UltraGreen’s moat claim is therefore conditional: it depends on whether surgeons and hospitals value a combined dye-camera-software-data workflow enough to attach beyond the already familiar status quo. Public materials suggest management understands this, because they emphasize surgeon partnerships, software quantification, connected reporting, and dye-plus-camera bundling. But exact attach rates, realized pricing, and the degree to which data products change buying behavior remain unresolved in the retained evidence. Until those proofs are public, the most durable near-term advantage looks like clinical ecosystem curation and workflow packaging rather than unassailable
    proprietary hardware.'
