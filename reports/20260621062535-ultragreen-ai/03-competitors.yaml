chapter:
  number: 3
  title: Competitors
  summary: 'UltraGreen faces a layered competitor set rather than one clean peer group: incumbent imaging vendors such as Stryker, Medtronic, Olympus, Karl Storz, and Richard Wolf; specialized fluorescence systems from Hamamatsu and Getinge/Fluoptics; and the status quo of using ICG with already approved compatible cameras. Its clearest wedge in the retained corpus is the attempt to bundle dye, handheld imaging, quantification software, and data systems, but the adverse case is strong because most pricing is opaque and many buyers can stay with installed platforms while adding fluorescence incrementally.'
sections:
- id: landscape-and-solution-classes
  title: Landscape and solution classes
  body: 'UltraGreen should be compared against at least four solution classes. First are the large incumbent visualization platforms: Stryker 1688 AIM with the SPY family around it, Medtronic EleVision IR, Olympus VISERA ELITE III, KARL STORZ Rubina, and Richard Wolf System green. Second are more specialized fluorescence systems such as Hamamatsu PDE-Neo II and Getinge/Fluoptics products such as Fluobeam LS and Fluobeam LX. Third is the status quo of buying indocyanine green and using an already approved compatible camera system; Diagnostic Green’s own compatibility pages make clear that many such platforms are already on the market. Fourth is UltraGreen’s self-described integrated platform, which tries to add software quantification and cloud reporting on top of dye and camera hardware. That framing matters because the buyer is not choosing only among startups; it is often choosing whether to keep an installed incumbent tower and add ICG incrementally.'
