    "number": 1,
    "title": "Company Overview",
    "summary": "Iterative Health is a Cambridge- and New York-based clinical research infrastructure company founded in 2017 that evolved from Iterative Scopes' GI-focused AI tooling into a multispecialty site-network model spanning GI, hepatology, obesity, and cardiology. Official materials support strong network and operating momentum \u2014 more than 100 research sites, 40+ sponsor/CRO partners, a $77 million Series C in 2026, and continued commercialization of SKOUT \u2014 but public disclosure remains thin on revenue, cap table detail, debt terms, and exact current valuation."
  },
  "sections": [
    {
      "id": "identity-and-operating-model",
      "title": "Identity, positioning, and operating model",
      "body": "Iterative Health was founded in 2017 and is now presented as a healthcare technology and services company headquartered in Cambridge, Massachusetts, and New York, New York. The company\u2019s current homepage and about page frame the business less as a single-product AI startup and more as a multispecialty clinical research infrastructure platform. Its operating focus now spans GI, hepatology, obesity, and cardiology, with research embedded directly into community care settings rather than concentrated only in academic centers.\n\nThat positioning marks a clear expansion from the earlier Iterative Scopes identity, which emphasized precision gastroenterology, computer vision, and products such as SKOUT. The current model connects provider organizations and research sites to centralized operations, sponsor access, and AI-enabled workflow tools. In practice, Iterative sells speed, activation reliability, and enrollment performance to sponsors and CROs while giving provider groups research infrastructure, staffing support, and patient-identification tooling.\n\nSKOUT still matters because it shows the company retains a real commercial device footprint rather than operating only as a services intermediary. But the core 2026 investment narrative is broader: a scaled research network, proprietary workflow technology, and tighter integration between provider sites and sponsor demand. That combination is what later chapters should treat as the company\u2019s ground-truth business model.",
