    {
      "id": "milestones-regulatory-status-and-risks",
      "title": "Milestones, regulatory proof points, and key risks",
      "body": "The milestone record shows two distinct company phases. The first phase runs from the 2017 founding through the 2022 Series B and emphasizes AI for gastroenterology, including the acquisition of CRSG/Precision and the 2022 FDA clearance for SKOUT. The second phase, most visible in 2025-2026, emphasizes the buildout of a multispecialty clinical research network through GI Alliance, One GI, US Heart & Vascular, and the acquisition of three cardiology sites from NextStage.\n\nSKOUT remains the clearest regulatory and product proof point. Official materials and FDA documentation support that the device is an FDA-cleared, real-time computer-aided detection aid for colonoscopy, and company reporting cites a 27% increase in adenomas per colonoscopy and a 44% increase in proximal 5-9 mm polyp detection. Those facts matter because they show Iterative can translate its AI work into regulated clinical products, not just workflow software.\n\nThe main adverse context is not a company-specific enforcement event but category risk. Independent literature reviewing CADe systems still highlights false positives, automation bias, workflow integration burden, generalizability limits, and uncertain long-term outcome data. Combined with the lack of public revenue, debt, and cap-table disclosure, that means the company\u2019s execution narrative is stronger than its public financial transparency. Later chapters should therefore treat Iterative as operationally credible but still diligence-heavy on economics and adoption durability.",
