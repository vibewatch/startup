    {
      "id": "trust-evidence-and-competitive-context",
      "title": "Trust, evidence, and competitive context",
      "body": "Iterative’s trust story starts with regulatory and workflow guardrails rather than pure AI novelty. SKOUT now has 510(k) clearance as a Class II gastrointestinal lesion software detection system and is listed as commercially distributed in AccessGUDID. The device labeling is explicit that it assists rather than replaces trained gastroenterologists, and the user interface includes status signaling plus a paused-detection state when tools enter the field. Those controls matter because they position SKOUT as an augmentation layer inside a regulated procedure, not an autonomous diagnostic decision-maker. Public guidance is directionally supportive: Yale’s summary of draft AGA guidance says CADe receives a conditional recommendation in adult colonoscopy and does not materially increase procedure time, which broadly supports the adoption case for the category that SKOUT serves.\n\nThat said, the evidence base still has nuance. Iterative’s official materials and its partner brief highlight strong efficacy signals such as no procedure-time increase, one extra adenoma resected per 4.5 patients, and better performance on sessile or mid-sized lesions, while the earlier SKOUT study and broader CADe literature support higher ADR/APC. But the literature also warns about false positives, automation bias, operator deskilling, generalizability, and long-term outcomes. Competitive materials from Medtronic, Olympus, and Fujifilm show that real-time AI detection, sessile-lesion emphasis, and workflow-preservation claims are no longer unique to Iterative. That means trust in Iterative’s stack depends not only on category-level AI efficacy, but on how well its combination of distribution, integration, site operations, and human-in-the-loop trial workflows stands up against other CADe vendors and operational alternatives.",
