    "number": 5,
    "title": "Product & Technology",
    "summary": "Iterative Health’s product stack is best understood as a combined operating model: an FDA-cleared colonoscopy CADe device in SKOUT, a site-centric clinical-trial network with AI-enabled workflow, and adjacent disease-assessment and central-reading tools for IBD studies. Public evidence supports real workflow integration, credible clinical and regulatory anchors, and differentiated breadth versus pure-play CADe peers, but it also leaves installed base, pricing, interoperability breadth, and forward roadmap depth only partially disclosed."
  },
  "sections": [
    {
      "id": "product-stack-and-customer-jobs",
      "title": "Product stack and customer workflow",
      "body": "Iterative Health does not present itself as a single-product medtech vendor. Across its homepage, about page, and current hiring description, the company describes a blended healthcare technology and services platform that combines community-embedded research infrastructure, AI-enabled disease-assessment tooling, and at least one regulated point-of-care device. In customer workflow terms, the stack serves two connected user groups. Sponsors and CROs use Iterative to activate sites faster, reduce operational burden, and improve enrollment in GI-adjacent trials. Providers and endoscopists use SKOUT during screening and surveillance colonoscopy as an assistive device inside the procedure room. The result is a company whose commercial promise is not just algorithm performance, but a wider operating model that links patient identification, site operations, endoscopic assessment, and sponsor reporting.\n\nThe publicly visible modules reinforce that view. SKOUT is the most concrete product surface because it has an FDA-cleared indication, a GUDID record, and a published workflow description. But the broader platform is also visible in the company’s repeated emphasis on a global site network embedded into community care, operationally supported activation and prescreening workflows, AI-enabled endoscopy and histology analysis for ulcerative colitis, and a hybrid AI-human central-reading paradigm for trial endpoints. That breadth matters strategically. It means Iterative is trying to own more of the GI research workflow than a single detection algorithm can capture, which is an important differentiator against category peers that mainly sell one CADe module.",
