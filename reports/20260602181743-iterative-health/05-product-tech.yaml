    {
      "id": "roadmap-and-critical-dependencies",
      "title": "Roadmap, maturity, and critical dependencies",
      "body": "The public roadmap is visible mainly through milestone evidence rather than a forward product plan. On the device side, Iterative progressed from early SKOUT efficacy data to a larger randomized study cited in its value-analysis materials, then to 2025 FDA clearance and commercial distribution status. On the trial-tech side, the 2025-2026 publication cadence matters: the site-network paper and DDW 2026 update emphasize scaled operational performance, the ulcerative-colitis endoscopy-plus-histology work shows Iterative expanding from procedural assist into endpoint analytics, and the BMJ central-reading paper shows a more regulatory-minded human-plus-model framework for high-stakes trial scoring. Those are meaningful maturity signals because they suggest a roadmap centered on expanding along the GI research workflow rather than merely adding features to SKOUT.\n\nThe main dependencies are equally clear. SKOUT adoption depends on compatible processor footprints and on Provation-assisted commercial reach. The site-network thesis depends on continued uptake by community sites, sponsor willingness to route studies through a site-centric model, and enough trained operational staff to manage startup, prescreening, and activation. The central-reading and disease-assessment tools depend on curated video and histology data, maintainable model performance, and access to expert human adjudicators. Finally, the public record still leaves some business-critical blanks: there is no disclosed installed base, no public pricing, no exhaustive interoperability matrix, and no detailed forward release schedule for either the device or the IBD toolchain. So while Iterative’s product maturity is stronger than a one-feature startup, it still has material disclosure gaps investors would want to close before underwriting technical scale-up at full confidence.",
