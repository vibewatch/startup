    {
      "id": "trial-network-and-cro-rivals",
      "title": "GI and IBD trial-network rivals",
      "body": "On the sponsor-facing side, Iterative runs into much larger competitors than it does in procedure-room AI. IQVIA and ICON both market GI or IBD-specific development expertise on top of global site-network and patient access infrastructure. Alimentiv attacks from the opposite direction: it is narrower than the global CROs but markets itself as a deeply specialized GI operator with endoscopy, histology, and IBD workflow depth. All three rival classes can sell against Iterative when the buyer cares more about sponsor breadth, geographic reach, or established outsourcing relationships than about Iterative's GI-first operating narrative.\n\nThe scale gap is public. IQVIA markets more than 1,100 high-performing sites across 100 countries and claims outsized share in outsourced phase II and III IBD work. ICON markets 114-plus GI studies in the last five years plus the Accellacare network's 8.1 million patient reach, 50-plus sites, and faster site-initiation metrics. Alimentiv markets 5,000-plus site relationships across 60-plus countries and says it supports more than 70% of IBD compounds in development. Iterative's own materials show meaningful momentum, but public sponsor-access scale is still smaller than those incumbent networks.\n\nProvider-controlled site supply is the other competitive pressure. GI Alliance and One GI are partners today, not adversaries in the narrow sense, but their disclosed networks show why large GI groups matter strategically: they control investigators, coordinators, patient flow, and local trial access. If those relationships are not durably exclusive, the same asset that differentiates Iterative can be contested, internalized by provider groups, or redirected toward another CRO or operator.",
