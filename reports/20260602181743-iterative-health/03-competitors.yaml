    {
      "id": "moat-durability-and-risk",
      "title": "Moat durability and adverse competitive risk",
      "body": "Iterative's best public competitive story is not that it has the single best CADe product or the single largest trial network. It is that it appears to combine two usually separate capabilities: AI tooling that can help in GI workflows, and embedded community-site operations that can help sponsors recruit and activate studies faster. That hybrid positioning is real enough to matter, and it is unusual in the public set reviewed for this chapter.\n\nBut the durability of that moat is still conditional. On the AI side, Olympus and Fujifilm can deepen channel lock-in by shipping more intelligence inside installed endoscopy ecosystems, while Medtronic can use modular distribution to compete wherever buyers want a lighter add-on. On the trial side, IQVIA and ICON can out-scale Iterative in sponsor coverage and geographic reach, while Alimentiv can challenge the idea that Iterative alone offers GI-specific depth. Provider networks such as GI Alliance and One GI further remind investors that site supply is negotiated, not owned.\n\nThe adverse evidence base sharpens that risk rather than eliminating it. AGA still withholds a recommendation for or against CADe-assisted colonoscopy, the pilot literature still shows extra non-neoplastic polyp detection, and public materials still do not disclose installed SKOUT share, sponsor win rates versus named rivals, or actual pricing across either arena. The investment conclusion is therefore nuanced: the integrated model is different, but it is not yet protected by public proof strong enough to dismiss incumbent retaliation or commoditization.",
