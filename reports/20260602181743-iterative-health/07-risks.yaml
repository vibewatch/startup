  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Iterative Health’s risk profile is defined by the interaction of three exposed surfaces: an AI-assisted colonoscopy category that still carries evidence, guideline, and reimbursement uncertainty; a high-touch clinical-research network that must preserve outperformance while scaling across 100+ sites and a few large provider ecosystems; and a financial model that remains under-disclosed despite a fresh $77M Series C and reported unicorn valuation. The strongest mitigations are real partner traction, performance data that held at larger scale, and a visibly broader leadership team. The highest residual risks are operational quality drift, partner concentration, AI commercialization/reimbursement uncertainty, and weak public visibility into SKOUT economics, security posture, and overall unit economics. The clearest thesis-break events would be benchmark slippage in activation or randomization, concentration shocks in GI Alliance / One GI / USHV, or failure to turn AI value into durable pricing under GI reimbursement pressure."
  },
  "sections": [
    {
      "id": "regulatory-legal-risk",
      "title": "Regulatory, legal, and reimbursement risk",
      "tableRefs": [
        "TR001"
      ],
      "figureRefs": [
        "FR001"
