        "CR039",
        "CR041",
        "CR042"
      ],
      "body": "Financial-model risk is high mainly because the operating story is much more visible than the economics. Public materials support network scale, partner count, and performance metrics, and third-party coverage suggests strong capitalization after the Series C. But there is still no public revenue mix, margin profile, burn, renewal rate, top-account concentration, or SKOUT installed-base disclosure. That leaves investors underwriting a complex services-plus-AI model with limited direct visibility into whether value accrues mostly to sponsor services, provider-network operations, SKOUT sales, or some combination. The reported valuation backdrop only sharpens this problem: a company can be well capitalized and still be economically hard to underwrite if the key monetization levers remain opaque.\n\nThe practical investment question is therefore not whether Iterative has risks—every clinical-infrastructure business does—but whether those risks are monitorable and whether the existing mitigations are strong enough to justify residual exposure. The best mitigations are tangible: real partner networks, evidence that performance held at larger scale, a broader executive bench, and at least baseline privacy/compliance infrastructure. The main thesis-break triggers are equally tangible: operating metrics revert toward industry norms, a major provider ecosystem stalls or churns, or AI reimbursement and customer economics never support durable pricing. If any of those happen, the same features that make Iterative attractive today—its integrated model and dependence on partner networks—can transmit risk quickly into growth, gross margin, and valuation."
    }
  ],
