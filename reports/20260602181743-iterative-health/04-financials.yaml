    {
      "id": "capital-adequacy-and-scale-context",
      "title": "Capital adequacy, funding dependency, and public-comparable context",
      "body": "Iterative is not obviously capital-starved, but it is still publicly opaque. The one hard primary capital fact is the $77 million Series C, which management explicitly linked to expansion into cardiology, obesity, geography, and deeper provider-network partnerships. Secondary sources converge around a post-money valuation of roughly $1.3-1.4 billion and total funding of roughly $270-273 million, but those figures remain triangulations rather than company disclosures. Official sources still do not publish current cash, burn, debt, or runway.\n\nThat omission matters more because the company is expanding operationally, not just digitally. Site acquisitions, multispecialty buildout, and a service-heavy delivery model usually consume cash before investors can observe attractive margin profiles. Public CRO comparables show what good looks like once the model reaches scale. IQVIA, ICON, and Medpace each report billions of revenue, explicit liquidity, and margin/backlog data; their reported operating or EBITDA margins cluster around the low teens to low twenties. But those same public comps also demonstrate that research-services accounting is complex, with working-capital swings and, in ICON’s case, a revenue-recognition restatement and material weaknesses.\n\nSo the capital question is less “Can Iterative still raise money?” and more “Has Iterative already built a self-funding machine?” Publicly, that answer is still unknown.",
