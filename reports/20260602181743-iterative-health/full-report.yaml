  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Economics shortfall
        - Current revenue / gross margin materially below what $1.3B-$1.4B requires
        - Current mark stops looking like premium execution and starts looking like overpricing
        - Kill or require materially lower entry
      - - Performance regression
        - Network KPIs fall back toward benchmark on activation, enrollment, or randomization
        - Core operating differentiation weakens
        - Downgrade bull/base assumptions immediately
      - - Reimbursement non-monetization
        - AI/endoscopy economics remain bundled or non-reimbursable with no clear pricing power
        - SKOUT-style upside remains optionality instead of cash flow
        - Remove software-premium assumptions from model
      - - Expansion miss
        - Cardiology / obesity do not convert into booked revenue or repeat sponsors
        - Multispecialty optionality disappears
        - Base case reverts toward GI-only, lower-multiple outcome
      - - Cap-table overhang
        - Preference stack or side-letter terms meaningfully subordinate new money
        - Return profile deteriorates even if enterprise value holds
        - Pause until terms are renegotiated or price resets
    notes: >-
      Triggers focus on specific events that would force immediate scenario re-underwriting rather than generic business
      risk.
    claimRefs:
      - CV015
      - CV035
      - CV039
      - CV041
      - CV045
  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue bridge
        - 2025 audited revenue and 2026 YTD by sponsor services, site-network fees, and SKOUT/device revenue
        - Determines whether current mark is 6x, 10x, or 14x+ revenue
        - CFO room / monthly KPI pack
      - - Margin quality
        - Gross margin, contribution margin by service line, and cash burn / runway
        - Separates scalable platform economics from labor-heavy execution
        - Finance diligence + board deck
      - - Retention / concentration
        - Top-10 sponsor revenue share, partner concentration, cohort renewal, and churn
        - Tests durability of the network thesis and downside risk
        - Customer analytics + contract review
      - - Cap table / preferences
        - Current charter, liquidation stack, dividends, pro rata, and side letters
        - Needed to translate enterprise value scenarios into investor return scenarios
        - Legal diligence + data room
      - - Multispecialty monetization
        - Cardiology and obesity pipeline, bookings, activation speed, and contribution margins
        - Bull case requires real revenue beyond GI
        - Commercial diligence + specialty operating review
      - - SKOUT monetization
        - Installed base, pricing, reimbursement assumptions, and attach-rate to research relationships
        - Without this, AI upside remains narrative-heavy
        - Commercial / reimbursement workstream
    notes: Requests are ordered by what most directly changes valuation confidence and price discipline.
    claimRefs:
      - CV044
