  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand base
        blocks:
          - type: paragraph
            body: >-
              Iterative Health is exposed to two markets that overlap clinically but clear through different buyers. One
              is AI-assisted colonoscopy quality tooling: software such as SKOUT that sits inside the endoscopy room and
              tries to improve lesion detection against a rising quality bar. The other is GI/community clinical-trial
              site-network services: operating infrastructure sold mainly to sponsors and CROs that need faster
              activation, better enrollment, and access to community patient populations. Treating those as one TAM
              would hide the fact that one market is budgeted like provider operating or technology spend, while the
              other is outsourced trial-execution spend.


              The included spend for the quality-tool market is narrow. It covers lesion-detection software,
              deployment/support, and quality-workflow fit inside screening or surveillance colonoscopy. It excludes the
              broader CRC screening universe, which now also includes blood-based and at-home stool tests, and it
              excludes generic endoscopy software that does not change detection performance. The included spend for the
              site-network market is equally specific: site startup, contracting, training, patient-identification
              support, and sponsor access to high-performing community GI sites. It does not include the full CRO stack
              or every piece of GI research spend.


              Demand is real but uneven. ACS says more than 20 million eligible Americans are still not up to date on
              CRC screening, and Medicare policy still routes positive stool or blood tests into follow-up colonoscopy.
              But the newly age-expanded 45-49 cohort remains far from saturated: only 33.7% were up to date in 2023,
              with adoption concentrated among better-insured and better-educated adults. Iterative's colonoscopy-facing
              market is therefore anchored to a large prevention gap, but adoption still depends on access, outreach,
              and whether direct-visual screening remains attractive versus non-invasive alternatives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM031
