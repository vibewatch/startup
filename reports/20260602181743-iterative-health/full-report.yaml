      - number: '3.3'
        title: Packaging, pricing opacity, and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Public commercial packaging is much clearer than public pricing. Iterative, Medtronic, Olympus, Fujifilm,
              IQVIA, ICON, and Alimentiv all present contact-led enterprise selling rather than transparent list
              pricing. In practice that means buyers evaluate these offerings through bundled equipment, services
              statements of work, site-network access, or custom enterprise contracts rather than through a published
              per-procedure or per-site-rate card. The opacity itself is strategically relevant because it favors scaled
              sellers with heavier field organizations and more room for negotiated bundling.


              The substitute set is also broader than a normal one-category comparison table suggests. A GI provider can
              buy a CADe module from Medtronic, Olympus, or Fujifilm without buying Iterative's site-network services. A
              sponsor can buy GI or IBD trial execution from IQVIA, ICON, or Alimentiv without buying Iterative's
              procedure-room AI. And a buyer can still remain on the status quo: no AI in the endoscopy room, or
              fragmented direct-to-site trial operations supported by internal teams and generic CRO processes.


              Those alternatives make multi-homing uneven across the two arenas. Trial services are more multi-homeable
              because sponsors already split work by protocol, geography, or function. Endoscopy AI is harder to
              multi-home once a site standardizes on a hardware ecosystem, workflow, and service partner. That asymmetry
              is why hardware bundling and provider-network access matter more to moat durability than any single public
              efficacy chart.
