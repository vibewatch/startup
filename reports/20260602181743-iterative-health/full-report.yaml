      - number: '7.3'
        title: Partner, dependency, and people risk
        blocks:
          - type: paragraph
            body: >-
              Iterative’s public traction is real, but it is concentrated. GI Alliance, One GI, and US Heart & Vascular
              dominate the named-provider record, and each relationship is strategically meaningful enough that any one
              of them could matter disproportionately to growth perception, sponsor access, and pipeline density. GI
              Alliance brings 21 active sites and 80+ trials; One GI brings 34 clinics and 13 active sites; USHV opens
              cardiology and reinforces multispecialty ambitions. Those are strengths, but they are also dependencies.
              If a major partner underperforms, reprices, delays expansion, or simply proves less economically important
              than headline site counts suggest, the external story can deteriorate quickly because so much of the proof
              set lives inside a few ecosystems.


              There is a second dependency layer at the product and workflow level. Medtronic and Olympus are not only
              alternative AI vendors; they are large incumbents that can bundle training, hardware compatibility, and
              installed-base leverage. Olympus explicitly ties CADDIE to its hub and white-light workflow, while
              Medtronic markets GI Genius on sensitivity and low false positives. Iterative therefore has to win not
              just on model quality but on channel access and workflow fit. People risk sits on top of all of this. The
              management bench is clearly improving—there is now a President/CFO, COO, medical leadership, and legal
              leadership—but the bench still looks recently assembled rather than battle-tested over a long period at
              current scale. Founder dependence on Jonathan Ng remains meaningful because the strategy still requires
              synchronized execution across AI, provider partnerships, sponsor GTM, and multispecialty expansion.
