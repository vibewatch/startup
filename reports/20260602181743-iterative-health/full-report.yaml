    title: Thesis / anti-thesis
    columns:
      - Topic
      - Positive thesis
      - Anti-thesis
      - What changes the view
    rows:
      - - Operating proof
        - 100+ sites, 40+ partners, 2x faster activation, and >3x enrollment indicate real sponsor/site value
        - Most proof is throughput-oriented rather than economic; monetization quality is still hidden
        - Show revenue by sponsor/site cohort and margins on scaled programs
      - - Platform scope
        - Expansion into cardiology and obesity could widen the value of the network beyond GI
        - Expansion is still earlier-stage than GI and could add execution drag before it adds revenue
        - Prove multispecialty bookings, retention, and contribution margins
      - - Financing quality
        - Strong investors and a step-up from prior rounds imply sustained investor demand
        - Public cap-table detail is thin; preference stack and dilution can materially change returns
        - Provide full charter, investor rights, and cap-table stack
      - - Valuation context
        - $1.3B-$1.4B can be fair if Iterative already resembles a premium AI/data platform
        - The same mark looks stretched if economics are still closer to CRO services
        - Disclose current revenue, gross margin, and renewal/retention
      - - Reimbursement / AI economics
        - AI-assisted workflows may add differentiation and future monetization leverage
        - Medicare pathway remains unsettled and GI payment pressure can slow adoption or pricing power
        - Show installed base, pricing, reimbursement assumptions, and attach-rate
    notes: >-
      Rows isolate the few variables most likely to change the investment decision rather than restating the full
      report.
