      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The public record supports market importance but not a clean dollar TAM for either of Iterative's two
              exposures. For colonoscopy AI, the most useful outer-shell lens is not revenue but quality pressure
              applied to a still-under-screened population. The 2024 ACG/ASGE update broadened ADR measurement to
              essentially all screening, surveillance, and diagnostic colonoscopies in adults 45 and older and raised
              the benchmark to 35% overall, with a 6% SSLDR target. That materially increases the relevance of tools
              that promise more consistent detection. Yale's summary of the evidence and Olympus' EAGLE trial both
              support the core proposition that CADe can improve adenoma detection without a meaningful time penalty.


              But buyers still have to underwrite around uncertainty. The same literature says improvements in advanced
              neoplasia are smaller, long-term interval-cancer and real-world cost-effectiveness evidence remain
              limited, and CADe commercialization has arguably moved faster than post-market consensus. The right sizing
              lens for the procedure-room business is therefore a constrained wedge: a subset of colonoscopy programs
              that feel quality pressure strongly enough to buy despite ambiguous reimbursement.


              For the site-network business, the strongest public lens is sponsor pain rather than market-research TAM.
              Iterative's IBD data point to 74-day activation versus 122-171-day benchmarks, 0.34 patients per site per
              month versus roughly 0.10 benchmark productivity, and similar 0.33-0.32 performance at larger DDW 2026
              scale. Those are meaningful service-market indicators, but they are not a publishable SAM/SOM because the
              public record omits pricing, contracted volume, backlog, and site-level revenue.
