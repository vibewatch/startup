        title: Revenue model, monetization surfaces, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Iterative Health’s public materials support a multi-surface monetization model, but not a publicly
              auditable revenue mix. The company now sells a sponsor- and site-facing research infrastructure
              proposition: centralized access to a growing network of community research sites, operational support,
              trial management, and AI-enabled workflow tools. GI Alliance, One GI, and US Heart & Vascular all describe
              Iterative as more than a software vendor. In each case the company contributes trial-management know-how,
              operational backbone, site enablement, and sponsor access rather than just a dashboard or algorithm. That
              makes sponsor/CRO services and provider-network operating partnerships the clearest observable revenue
              streams.


              SKOUT adds a second commercial surface. It proves Iterative still has a real regulated product that can be
              sold into GI practices and endoscopy settings, but the public record does not show list pricing,
              reimbursement schedules, or installed-base economics. The same opacity applies to the services side: no
              rate cards, no disclosed contract terms, no revenue split between sponsor budgets, provider partnerships,
              or device sales. The strongest conclusion is therefore directional rather than numeric. Iterative almost
              certainly monetizes across sponsor services, provider-network economics, AI-enabled workflow, and SKOUT,
              but the company has not disclosed the pricing architecture needed to distinguish recurring software-like
              revenue from project-based or service-led revenue.
