      - number: '4.4'
        title: Financial diligence blockers and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The public record is good enough to map the business model, but not good enough to underwrite it.
              Investors can reasonably conclude that Iterative has real commercial demand, real sponsor and provider
              relationships, and at least one regulated product surface in SKOUT. They can also conclude that the
              company has enough financing access to keep expanding. What they cannot conclude is how much of the model
              is recurring, what direct margins look like, how quickly site economics pay back, or how much cash remains
              after recent expansion.


              The most material blockers are straightforward: no revenue or ARR disclosure; no revenue split by stream;
              no gross-margin or direct-cost split; no cash, burn, runway, or debt schedule; no public price cards; and
              no sponsor retention, backlog, or customer concentration disclosure. Conflicting headcount and valuation
              proxies reinforce the point that secondary sources are only approximations.


              The financial verdict is therefore cautious but not negative. Iterative looks commercially credible and
              strategically well financed, yet still behaves like a private company that expects investors to trust
              operating momentum more than disclosed economics. For diligence, that means Chapter 4 should treat upside
              as plausible, but capital adequacy and unit-economics confidence as unproven until management shares
              actual financial statements and contract metrics.
