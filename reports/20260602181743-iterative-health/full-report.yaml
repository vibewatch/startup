  - id: TV003
    title: Bull / base / bear scenario range
    columns:
      - Scenario
      - Core assumptions
      - Exit multiple logic
      - Exit valuation range
      - Return implication from $1.35B entry
      - Probability signal
    rows:
      - - Bull
        - Revenue reaches roughly $250M-$320M; multispecialty expansion monetizes; >2x benchmark execution persists
        - 7x-8x premium AI/data band
        - $1.8B-$2.6B
        - ~1.2x-1.9x MOIC before preference effects
        - Requires proof that economics are already near premium AI/data quality
      - - Base
        - Revenue reaches roughly $160M-$220M; company behaves like a strong CRO/data hybrid
        - 5x-7x hybrid band
        - $0.9B-$1.5B
        - ~0.7x-1.1x MOIC
        - Most consistent with public evidence today
      - - Bear
        - Revenue stays roughly $110M-$170M; valuation compresses on reimbursement drag or execution slippage
        - 3x-4.5x CRO/reset band
        - $0.4B-$0.9B
        - ~0.3x-0.7x MOIC
        - Triggered if growth now looks better than monetization later
