  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable / reference
      - 2026 metric snapshot
      - Implied multiple / valuation
      - Relevance to Iterative
      - Limitation
    rows:
      - - IQVIA
        - $30.14B market cap / $16.63B TTM revenue
        - ~1.8x revenue
        - Diversified CRO/data floor for scaled healthcare research infrastructure
        - Much larger, public, and more diversified than Iterative
      - - ICON
