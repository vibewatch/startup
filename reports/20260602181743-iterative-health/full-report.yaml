chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and operating model
        blocks:
          - type: paragraph
            body: >-
              Iterative Health was founded in 2017 and is now presented as a healthcare technology and services company
              headquartered in Cambridge, Massachusetts, and New York, New York. The company’s current homepage and
              about page frame the business less as a single-product AI startup and more as a multispecialty clinical
              research infrastructure platform. Its operating focus now spans GI, hepatology, obesity, and cardiology,
              with research embedded directly into community care settings rather than concentrated only in academic
              centers.


              That positioning marks a clear expansion from the earlier Iterative Scopes identity, which emphasized
              precision gastroenterology, computer vision, and products such as SKOUT. The current model connects
              provider organizations and research sites to centralized operations, sponsor access, and AI-enabled
              workflow tools. In practice, Iterative sells speed, activation reliability, and enrollment performance to
              sponsors and CROs while giving provider groups research infrastructure, staffing support, and
              patient-identification tooling.


              SKOUT still matters because it shows the company retains a real commercial device footprint rather than
              operating only as a services intermediary. But the core 2026 investment narrative is broader: a scaled
              research network, proprietary workflow technology, and tighter integration between provider sites and
              sponsor demand. That combination is what later chapters should treat as the company’s ground-truth
              business model.
