  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and recommendation call
        blocks:
          - type: paragraph
            body: >-
              Iterative Health has earned a serious valuation conversation because the operating proof is better than
              the average AI-health startup. Official materials show a research network of more than 100 sites, over 40
              sponsor and CRO relationships, and repeated claims of 2x faster activation plus 3x enrollment
              outperformance versus industry benchmarks. The DDW 2026 update is especially important because it suggests
              the thesis held at larger scale rather than only inside a pilot cohort. That combination supports the
              positive side of the case: Iterative appears to have built a differentiated, site-centric clinical
              research network with real workflow and sponsor relevance, not just a narrow endoscopy algorithm story.


              The anti-thesis is that the public record prices the upside much more aggressively than it explains the
              economics. Third-party sources cluster around a $1.3 billion to $1.4 billion mark, but the company did not
              disclose revenue, ARR, gross margin, or retention in the latest financing or performance updates. Public
              evidence therefore supports company quality more than it supports underwriting precision. In today’s
              market, that distinction matters: premium multiples still exist for AI and data assets, but only when
              revenue quality, durability, and monetization clarity are visible. Because Iterative’s price looks fair
              only in a strong execution case and stretched in a more CRO-like case, the most defensible public-evidence
              recommendation is research-more, with medium confidence, high risk, and a stretched valuation stance.
            claimRefs:
