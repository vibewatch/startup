        - $12.72B market cap / $2.67B TTM revenue; Q1 revenue +26.5%, EBITDA margin 21.1%
        - ~4.8x revenue
        - Best public analog for high-quality research execution and growth
        - Still public, profitable, and far more mature than Iterative
      - - 2026 quality HealthTech M&A band
        - General HealthTech ~4x-6x; premium AI/data ~6x-8x+
        - Market band, not company-specific
        - Frames the multiple range that a premium hybrid model might earn
