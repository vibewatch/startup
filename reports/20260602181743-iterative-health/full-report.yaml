  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Endoscopy AI rivals and OEM channel power
        blocks:
          - type: paragraph
            body: >-
              In the procedure room, Iterative is not competing against another small GI software startup so much as a
              mix of large medtech incumbents and one focused pure-play. Medtronic markets GI Genius as an AI-assisted
              colonoscopy module, while Olympus now spans CADDIE, OLYSENSE, and ENDO-AID inside its broader EVIS X1
              ecosystem. Fujifilm positions CAD EYE inside its own processors and scope stack, and Odin Vision remains
              the closest pure-play cloud competitor with CADDIE. Those products address the same clinical job as SKOUT:
              real-time polyp detection support during colonoscopy.


              The strategic difference is distribution power. Olympus and Fujifilm can bundle AI into branded endoscopy
              equipment pathways, service relationships, and upgrade cycles that already exist inside hospitals and
              ASCs. Medtronic looks more modular because GI Genius is sold as a stand-alone intelligent endoscopy
              module, but it still brings a scaled commercial organization and a familiar device-buying motion.
              Iterative therefore enters the room with less OEM leverage than the installed-base incumbents even when
              its clinical positioning is credible.


              Independent evidence keeps the category attractive but not settled. Yale's review and the AGA guideline
              both support higher adenoma detection with CADe, yet they also preserve uncertainty on advanced lesions,
              long-term cancer outcomes, cost-effectiveness, and universal adoption. That matters competitively because
              it leaves a durable status-quo substitute: standard colonoscopy plus conventional quality improvement.
              Buyers who are not yet convinced on long-horizon outcome lift can still defer AI entirely, or trial it
              only where quality pressure is most acute.
