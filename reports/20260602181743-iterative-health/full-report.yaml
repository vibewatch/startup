      - number: '1.2'
        title: Founders, leadership, and governance signals
        blocks:
          - type: paragraph
            body: >-
              Founder and CEO Jonathan Ng remains the central strategic figure. Public materials consistently identify
              him as founder/CEO, and the earlier Iterative Scopes financing history ties the company’s origin to an MIT
              spinout built around Ng’s physician-entrepreneur profile and MIT/Harvard training context. That gives the
              company credible founder-market fit at the intersection of medicine, AI, and clinical trial operations.


              Leadership depth improved materially in late 2025. Bill Kayser joined as President and Chief Financial
              Officer after senior finance roles at GI Alliance, Prospero Health, and McKesson, which is notable because
              it adds operator experience from physician-practice infrastructure and healthcare M&A rather than pure
              software finance. Public team materials also show Dana Feuchtbaum as COO and Nadege Gunn as Chief Medical
              Officer for Hepatology and Obesity, reinforcing the company’s operating emphasis on scaling sites and
              entering adjacent therapeutic areas.


              Governance visibility is still partial rather than complete. Public financing announcements disclose a
              progression of investor-linked board seats or observer roles — including Nan Li and Lotus Mallbris around
              Series A, Lonne Jaffe around Series B, and Ajay Agrawal plus Anthony Philippakis around Series C — but
              they do not provide a fully reconciled current board roster or ownership map. The governance takeaway is
              therefore directional: founder-led, increasingly institutionally supervised, but still opaque on full
              control rights.
