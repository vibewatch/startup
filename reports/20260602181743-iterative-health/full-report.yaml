    title: Investment KPIs
    type: kpi
    summary: The company scores well on proof and optionality but weakly on economics visibility and valuation support.
    data:
      items:
        - label: Operating proof
          value: Strong
          note: Throughput and randomization signals are better than average for a private healthtech company
        - label: Expansion optionality
          value: Moderate-Strong
          note: Cardiology and obesity widen the story, but monetization proof remains early
        - label: Economics visibility
          value: Weak
          note: No public revenue, ARR, gross margin, NRR, or concentration disclosure
        - label: Comparable support
          value: Mixed
          note: Public CRO comps are much lower; premium AI/data band can work only with better economics
        - label: Reimbursement readiness
          value: Weak-Moderate
          note: Policy pathway exists conceptually, not yet as a stable commercial reality
        - label: Risk profile
          value: High
          note: Execution, reimbursement, and price risk stack rather than offset each other
        - label: Valuation stance
          value: Stretched
          note: Current mark assumes more than the public record proves
        - label: Evidence quality
          value: Medium
          note: Funding and performance triangulate; economics and cap-table detail do not
