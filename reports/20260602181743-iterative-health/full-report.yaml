  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and reimbursement risk
        blocks:
          - type: paragraph
            body: >-
              Iterative’s regulatory and legal risk profile is shaped less by a visible enforcement event today than by
              an unsettled operating perimeter. SKOUT participates in a category where clinical evidence is
              directionally positive but still debated on generalizability, false positives, false negatives,
              deskilling, and long-term outcomes. BMJ’s 2025 review goes further, framing AI endoscopy as a
              responsibility problem that now spans clinicians, institutions, developers, and regulators. That matters
              because major bodies still diverge on routine CADe use, which means the category has not yet settled into
              an uncontroversial standard of care. If adverse events or disappointing real-world evidence emerge,
              accountability will not sit neatly with a single actor.


              The reimbursement side is equally important. Medicare clearly covers screening colonoscopy, but reviewed
              policy and legal sources do not show a stable, device-specific payment pathway for endoscopy AI. Instead,
              the policy discussion is still at the level of proposed legislation and generic payment frameworks for
              AI-enabled medical devices. At the same time, GI provider economics are under pressure: AGA and Becker’s
              describe cuts and longer-term erosion in endoscopy reimbursement that can reduce buyer appetite for
              adjunct technology and operating overhead. Iterative does have basic compliance infrastructure—privacy
              policy, DPO, service-provider disclosures, and general security language—but its public security posture
              remains high-level. In practical diligence terms, the regulatory question is not whether Iterative has
              zero compliance process; it is whether that process is robust enough to defend a data-heavy AI and
              site-operations model if scrutiny increases.
