      - number: '5.2'
        title: Architecture, integration, and operating model
        blocks:
          - type: paragraph
            body: >-
              SKOUT’s technical architecture is more concretely documented than the rest of the stack. The FDA clearance
              and GUDID record describe a real-time software layer that receives endoscopy video over SDI, analyzes the
              feed during colonoscopy, and overlays a blue rectangular outline when a potential colorectal polyp is
              detected. The same sources show that the product is designed to fit directly into procedure workflow
              rather than forcing a separate review environment: users can switch between a bypass endoscopic feed and
              the SKOUT feed, and the system pauses detection when tools enter the field or lighting is inadequate.
              Compatibility is currently bounded by specific processor ecosystems, notably Olympus EVIS EXERA II/III and
              Fujifilm Eluxeo VP-7000 outputs, which makes integration quality and installed equipment mix an immediate
              adoption dependency.


              The broader operating architecture is more services-heavy. Iterative’s site-network publication describes
              activation, budgeting, prescreening, training, and regulatory documentation as the operational bottlenecks
              it tries to centralize or support. The IBD endpoint tooling then sits on top of that workflow: AI-enabled
              endoscopy and histology analysis adds structured disease-assessment output, while the BMJ-described 2M+1H
              framework inserts two independent ML models and a gastroenterologist adjudicator into central reading
              rather than replacing human review outright. The same architecture makes distribution and documentation
              partnerships material. Iterative’s FDA-clearance announcement ties SKOUT commercialization to Provation,
              whose GI workflow footprint can reduce go-to-market friction. Put simply, Iterative’s technical moat is
              not a single model alone; it is the combination of device integration, operational enablement, human
              oversight, and workflow adjacency across research sites and endoscopy rooms.
