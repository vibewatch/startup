      - number: '6.4'
        title: Retention, repeat usage, and durability proxies
        blocks:
          - type: paragraph
            body: >-
              Iterative does not disclose NRR, GRR, logo churn, renewal rate, contract duration, or public
              review-platform scores, so the retention lens has to rely on indirect signals. The best repeat-usage
              proxies are longitudinal. Ziad Younes says Iterative has been a trusted partner to his site for several
              years, which is stronger than a one-off implementation quote. GI Alliance’s chief medical officer
              described the DDW 2026 results as evidence of what became possible one year into the strategic
              partnership. The DDW release also calls the 2026 presentation the second major public reporting of
              aggregated network performance and highlights that four studies completed full enrollment with consistent
              randomization rates. These are useful signals because they indicate Iterative is not merely announcing
              logos, but continuing to execute after onboarding.


              Still, investors should not confuse operating consistency with customer retention proof. Clinical trials
              are episodic, sponsors often multi-home across site networks, and provider groups may keep several
              research or technology relationships alive at once. Public evidence emphasizes activation, prescreening,
              chart-review relief, and within-trial patient retention; it does not show how many sponsors return with
              new protocols, how many provider groups expand contract scope after year one, or what percentage of
              revenue renews automatically. The blocked OUP abstract page also means the direct conference record is
              less accessible than the surrounding company summaries and syndicated press coverage. In short, durability
              looks directionally positive, but the hard retention dataset remains undisclosed.
