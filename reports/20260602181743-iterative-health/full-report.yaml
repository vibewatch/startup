        title: Cost structure, reimbursement friction, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The model looks operationally powerful but financially heavier than pure software. Iterative’s own
              language emphasizes centralized operations, expert staffing, business development, site support,
              regulatory functions, and active research-site management. The NextStage acquisition release is especially
              revealing because it describes a 250-person organization spanning site staff and centralized functions
              across multiple therapeutic areas. That implies meaningful labor cost, onboarding cost, and corporate
              overhead even before considering product R&D or future acquisitions.


              Public reimbursement context adds another layer of friction. Medicare does cover screening colonoscopy,
              but the reviewed sources do not show a durable standalone payment pathway for SKOUT-like colonoscopy AI.
              Meanwhile, AGA and Becker’s describe worsening GI reimbursement pressure, especially for ASC and
              hospital-based endoscopy, and Boston Scientific’s guide underscores how strongly economics differ by site
              of service and by negotiated private-payer contract. Those facts matter because they can limit what
              provider customers are willing to pay for add-on technology or ancillary services.


              Unit-economics disclosure remains partial. Iterative’s best public proxies are site count, partner count,
              activation speed, and enrollment performance. Those suggest the product-service bundle is operationally
              valuable. But without CAC, LTV, payback, sponsor repeat-rate, or revenue per site, investors cannot
              convert those operating wins into a reliable underwriting model.
