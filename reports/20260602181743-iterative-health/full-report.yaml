      - number: '1.3'
        title: Funding history, scale signals, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed financing history establishes a credible late-stage company, even though exact
              valuation and cap-table detail remain partly opaque. Iterative raised a $30 million Series A in 2021 after
              an earlier $13.5 million seed, then a $150 million Series B in January 2022 co-led by Insight Partners and
              Clearlake. The 2026 Series C added another $77 million led by Intrepid Growth Partners and GV, with EDBI
              as a new investor and Insight and Obvious Ventures participating again. That sequence supports a durable
              institutional syndicate and suggests the company successfully repositioned itself from an AI-enabled GI
              startup into a broader clinical research platform.


              Scale claims also strengthened over 2025-2026. Official releases now describe more than 100 research sites
              across multiple continents, more than 40 pharmaceutical, biotech, medical-device, and CRO partners, and a
              roughly 250-person organization. Those are meaningful signals because the business model depends on
              operational density and repeatability, not just algorithmic novelty. GI Alliance, One GI, US Heart &
              Vascular, and the NextStage cardiology site acquisition show that provider-network partnerships are now as
              strategically important as financial investors.


              The important caveat is disclosure quality. TechCrunch, Forge, AI2.work, and Tracxn all imply total
              funding around $270 million and a latest valuation in the roughly $1.3-1.4 billion range, but those
              figures remain secondary estimates because the company did not publicly disclose a Series C valuation.
              Headcount is also inconsistent across third-party trackers. Investors can therefore underwrite momentum
              and syndicate quality, but not yet precise economics or ownership structure.
