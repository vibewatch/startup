        "CU040"
      ],
      "body": "Iterative’s expansion logic is clear. It can add sites within existing provider networks, take the same network model from GI into obesity and cardiology, deepen sponsor relationships as trial performance data accumulates, and potentially cross-sell AI tooling such as AIR and disease-assessment workflows alongside site operations. The 2026 move into cardiology with US Heart & Vascular and the Series C message around obesity and broader multispecialty growth both support this view. If the company can keep its activation and enrollment advantage while moving into adjacent therapeutic areas, existing sponsors may have reason to consolidate more trial work inside the network.\n\nThe risk is that public proof is concentrated in a few large partner ecosystems and still rests heavily on partner-authored announcements. GI Alliance, One GI, US Heart & Vascular, Gastro Health, and Gastro One dominate the named-provider record; sponsor-side naming is sparse; and SKOUT installations are opaque. That leaves unanswered questions around top-account revenue concentration, sponsor renewal frequency, and whether provider groups are exclusive or simply one of several parallel research channels. Procurement friction is another real risk because Iterative’s value proposition depends on staffing, regulatory work, budgeting, and chart-review support; sites or sponsors that internalize those functions may bargain harder on price or split work across multiple vendors. Device-side competition compounds that issue: Medtronic’s GI Genius publicly markets strong detection claims, so SKOUT adoption likely depends on workflow fit and network relationships rather than an uncontested product category."
    }
