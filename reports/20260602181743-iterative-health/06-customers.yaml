      ],
      "body": "Iterative Health sells into a linked but non-identical customer stack. On the provider side, the company courts physician groups, management services organizations, principal investigators, and research-site operators that want to build or scale clinical research as a profitable ancillary service. On the sponsor side, Iterative markets directly to sponsors, CROs, and biotech companies that need faster activation, enrollment forecasting, and a performance-managed site network. A third, less transparent buyer group sits around SKOUT: GI endoscopists and provider organizations evaluating AI-assisted colonoscopy equipment. Public proof is strongest for the first two layers and much weaker for the third.\n\nThat segmentation matters because Iterative is not just selling software seats. It is selling operational leverage, patient identification, and access to sites that can execute consistently. The provider pitch emphasizes centralized business operations, staffing, regulatory help, training, and sponsor access; the sponsor pitch emphasizes high-performing sites and accelerated trial execution. The company now presents the network as multispecialty rather than GI-only, spanning GI, hepatology, obesity, and cardiology, with 100+ sites and 40+ sponsor/CRO/device partners. But named customer evidence remains concentrated in large U.S. provider networks such as GI Alliance, One GI, US Heart & Vascular, Gastro Health, and the site-level case study with Gastro One, while sponsor-side named proof is mostly limited to Takeda and aggregate counts."
    },
    {
      "id": "adoption-trajectory",
      "title": "Adoption trajectory and deployment scale",
      "tableRefs": [
