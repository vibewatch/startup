  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Iterative Health has real customer adoption, but it is easier to prove at the provider-network and site-operations level than at the sponsor-account or SKOUT device level. Public materials support a provider-heavy customer base anchored by GI Alliance, One GI, US Heart & Vascular, Gastro Health, and Gastro One, plus a broader sponsor/CRO/device cohort of 40+ partners and one named sponsor relationship with Takeda. Adoption metrics are strongest around network performance and site activation rather than classic SaaS retention: the company cites 100+ sites globally, 2x faster activation, 3x+ randomization, and 40% uplift from AI prescreening, while independent corroboration remains thinner. The main customer risks are concentration in a handful of large provider platforms, sponsor multi-homing and procurement friction, and a notable lack of disclosed NRR, churn, contract duration, or named SKOUT deployments."
  },
