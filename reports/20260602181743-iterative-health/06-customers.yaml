      ],
      "body": "Named customer proof is credible but uneven. On the provider side, GI Alliance, One GI, US Heart & Vascular, Gastro Health, and Gastro One all appear in public materials with either executive quotes, site counts, trial counts, or quantified workflow outcomes. GI Alliance and One GI provide the cleanest platform-level evidence because both the company and the customer-side organizations describe the relationship, and both quantify the attached site footprint. Gastro One provides the richest single-site operating case study, including faster activation, randomizations, and the share of enrollments sourced through Iterative. US Heart & Vascular broadens the thesis from GI into cardiology, while Gastro Health demonstrates that Iterative can land through AI-recruitment tooling before broader network rollout.\n\nSponsor-side proof is materially thinner. Takeda is the only named sponsor relationship found in public materials, and even there the evidence is framed around AI-enabled trial design and disease assessment rather than explicit contract scope or repeat-study volume. The company’s 40+ sponsor/CRO/device-partner count is useful for breadth, but it does not substitute for named deployments, study counts per sponsor, or sponsor-level retention data. Public proof is also weak for SKOUT as a customer business. The product page contains anonymous testimonials and efficacy claims but no named health-system or ambulatory-surgery-center deployment references. So the chapter’s evidence quality is best described as strong for provider-network logos, good for trial-performance outcomes, limited for sponsor naming, and weak for named product installations."
    },
    {
      "id": "retention-and-repeat-usage",
      "title": "Retention, repeat usage, and durability proxies",
      "tableRefs": [
