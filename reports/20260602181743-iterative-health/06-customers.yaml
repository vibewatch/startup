      ],
      "body": "The public adoption arc is visible through network milestones rather than customer-count disclosures by cohort. In April 2025, GI Alliance said adding its 21 active research sites and 80+ active Phase II-IV trials pushed the Iterative network to more than 70 locations in the U.S. and Europe. By the September 2025 One GI partnership, Iterative had become an embedded operating partner for a 34-clinic network with 13 active research sites. By April 2026, the US Heart & Vascular partnership repositioned the company as a multispecialty network entering cardiology, and by the April 2026 Series C announcement Iterative was citing 100+ research sites across North America, Europe, India, and Australia plus 40+ pharmaceutical, biotech, medical-device, and CRO partners.\n\nThe strongest deployment proof comes from trial-performance metrics rather than account counts. Iterative’s provider page cites 2x faster activation, 3.4x higher patient enrollments, and AI-powered prescreening that lifts randomizations by 40%. The JCC summary and later DDW 2026 release add more specific operating numbers: 74 days from site selection to activation, 45 days to first patient screened, 83 days to first randomized, roughly 0.33-0.34 patients randomized per site per month, and four completed trials that still delivered about 0.32 patients per site per month at full enrollment. Those are high-quality adoption proxies because they show the network continuing to function as denominator and study count rose, even though Iterative still does not publish standard customer cohort data by sponsor, site, or product line."
    },
