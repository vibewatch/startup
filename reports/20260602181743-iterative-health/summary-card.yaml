  topStrengths:
    - >-
      Documented site-network outperformance: public studies and company releases repeatedly show faster activation and
      materially better enrollment than published IBD benchmarks.
    - >-
      Dual-asset positioning combines an FDA-cleared GI AI device with embedded research-network operations, creating
      more workflow control than a pure point-solution vendor.
    - >-
      High-quality investor and partner set — GV, Intrepid, Insight, GI Alliance, One GI, and U.S. Heart & Vascular —
      supports distribution, credibility, and category access.
  topRisks:
    - >-
      Revenue, gross margin, burn, and retention remain undisclosed, so the current private mark is being underwritten
      without the core operating metrics public investors would require.
    - >-
      AI endoscopy reimbursement, cost-effectiveness, and real-world generalizability remain unresolved, limiting how
      much SKOUT upside should be capitalized today.
    - >-
      Execution risk rises as Iterative scales beyond GI into cardiology and obesity while preserving performance across
      a 100+ site network and several anchor partner systems.
  unresolvedGaps:
