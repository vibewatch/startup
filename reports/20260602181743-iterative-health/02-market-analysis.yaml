  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cade-roi-outcomes
    missingEvidence: Longitudinal post-market data on interval cancer, advanced neoplasia, and realized cost offsets for CADe by buyer setting.
    whyItMatters: Public evidence is strong enough to show better adenoma detection, but budget owners underwrite on outcomes and economic payoff rather than ADR alone.
    diligencePath: Request post-market customer studies, buyer references, and outcome tracking from community GI, VA, and hospital deployments.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: cade-market-sizing
    missingEvidence: Installed base, contracted pricing, per-procedure economics, and win-loss data for SKOUT and comparable CADe tools.
    whyItMatters: Without pricing and penetration data, any public SAM or SOM estimate for the AI-colonoscopy market would be false precision.
    diligencePath: Ask management for deployed-room counts, contracted pricing by site archetype, renewal rates, and competitive displacement data.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: trial-network-unit-economics
    missingEvidence: Sponsor contract values, active backlog, utilization by site, and revenue per study or per activated site for the GI network.
    whyItMatters: Speed and enrollment benchmarks prove relevance, but they do not translate by themselves into market share, gross margin, or revenue visibility.
    diligencePath: Request cohort-level bookings, active-study counts, revenue per activated site, and sponsor renewal or expansion cohorts.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: cpt-level-2026-economics
    missingEvidence: Named CPT-level 2026 physician, ASC, and HOPD payment extracts for the colonoscopy procedures most relevant to GI buyers plus any AI-specific billing conventions.
    whyItMatters: Generic reimbursement commentary shows margin pressure, but buyer-level ROI still needs exact procedure economics rather than high-level policy summaries.
    diligencePath: Pull specific CPTs from CMS fee-schedule and ASC addenda and compare them against local commercial contract rates.
    relatedQuestionRefs:
    - QM018
    - QM019
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: minor
    topic: non-gi-expansion-proof
    missingEvidence: Therapeutic-area performance data outside GI and IBD that are comparable to the published activation and enrollment benchmarks.
    whyItMatters: Upside from cardiology, obesity, and hepatology expansion matters to valuation, but the public proof set is still concentrated in IBD.
    diligencePath: Request activation, enrollment, and site-productivity metrics by therapeutic area and by partner cohort.
    relatedQuestionRefs:
    - QM022
