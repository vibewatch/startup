figures:
- id: FM001
  title: Dual-market sizing pyramid
  type: pyramid
  layout: wide
  summary: The defensible market lens narrows from broad CRC screening demand into a smaller quality-tool wedge and a separate sponsor-funded site-network services wedge.
  data:
    items:
    - label: 'Outer shell: CRC screening demand'
      value: '>20M adults not up to date; screening begins at age 45'
      note: Large prevention gap that keeps colonoscopy demand strategically relevant even as non-invasive tests expand.
    - label: 'Quality-pressure shell: colonoscopy programs under new benchmarks'
      value: ADR-A 35% overall / 40% men / 30% women; SSLDR 6%
      note: Rising quality expectations make detection and measurement tools more commercially relevant.
    - label: Deployable CADe wedge
      value: FDA-cleared tools with 7.3-point ADR lift but unsettled reimbursement and ROI
      note: Addressable slice is narrower than the full screening market because buyers still need budget and workflow justification.
    - label: Iterative current wedge
      value: SKOUT plus >100-site / 40+ partner GI-led site network
      note: Company overlaps both procedure-room quality tooling and sponsor-facing research services rather than selling into one simple category.
  approximationNotes: Layers use mixed operational units rather than additive dollars because the public record does not support a common currency across both market exposures.
  claimRefs:
  - CM001
  - CM003
  - CM008
  - CM013
  - CM026
