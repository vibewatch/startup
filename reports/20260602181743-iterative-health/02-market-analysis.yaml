- id: growth-drivers-and-adoption-constraints
  title: Growth drivers and adoption constraints
  body: |-
    The biggest shared tailwinds are straightforward: CRC screening now begins at age 45, the U.S. still has a large unscreened pool, colonoscopy quality benchmarks are tighter, and sponsors remain desperate for faster, more reliable recruitment. On paper that is a strong setup for both SKOUT and the site-network platform. Community GI care is especially important because it concentrates ongoing relationships with chronic-disease patients who matter to both screening volume and GI trial enrollment.

    The constraints are equally important. On the CADe side, the literature still flags false positives, automation bias, generalizability, and limited long-term outcomes; the evidence is good enough to support interest, but not strong enough to eliminate buyer skepticism. Just as importantly, the reimbursement backdrop is hostile. GI societies say the 2026 CMS proposal would cut ASC and hospital-based endoscopy payments, while Becker's and ACG describe a longer-running gap between Medicare payments and practice costs. MACRA-style cost measurement further sensitizes providers to site of service, anesthesia, pathology, and follow-on utilization. In that context, an AI tool must win on quality or workflow, not on obvious reimbursement arbitrage.

    The site-network business faces a different but related constraint set. It benefits from community-site scale and sponsor urgency, but public proof is still concentrated in IBD. Expansion into hepatology, obesity, and cardiology is strategically promising yet less evidenced. The diligence takeaway is therefore asymmetric: the markets are real, and Iterative appears to be selling into genuine pain points, but precise TAM/SAM/SOM math should stay deliberately constrained until management discloses pricing, installed base, sponsor contract economics, and non-GI replication data.
