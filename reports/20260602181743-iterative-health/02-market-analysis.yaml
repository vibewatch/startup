  rows:
  - - CRC screening demand shell
    - Eligible adults who may ultimately need colonoscopy, including follow-up colonoscopy after positive stool or blood screening
    - Non-endoscopic CRC screening vendors, oncology treatment spend, and unrelated GI care
    - Patients, payers, health systems
    - No screening or non-invasive tests only
    - Outer demand shell for any colonoscopy-quality product
  - - AI-assisted colonoscopy quality tools
    - Real-time lesion detection software, deployment, support, and room-level workflow fit for screening or surveillance colonoscopy
    - Generic EHR/reporting software, non-visual screening tests, or broad GI IT budgets
    - GI practice, ASC, hospital, or VA pays; endoscopist uses
    - Manual quality improvement, second observer, or no AI
    - Direct product market for SKOUT-like tools
  - - Endoscopy quality measurement and reporting
    - ADR/SSLDR tracking, GIQuIC or MIPS-aligned quality workflows, and feedback systems tied to colonoscopy performance
    - General analytics tools that do not change colonoscopy quality or reporting behavior
    - GI quality owner or administrator
    - Manual chart audit and delayed feedback
    - Important adjacency because rising quality standards create tool demand
  - - Sponsor-facing GI/community trial site-network services
    - Site startup, contracting, coordinator support, patient identification, and sponsor access to community GI sites
    - Full CRO outsourcing, lab/imaging services, and non-site-network trial functions
    - Sponsor or CRO pays; PI and site staff use
    - Academic-center-only site strategy or fragmented direct-to-site contracting
    - Direct services market for Iterative's network business
  - - Provider-network research enablement
    - Practice partnerships, PI/coordinator support, and infrastructure that embeds trials into community GI care
    - Generic practice management services without research enablement
    - Provider group partners operationally; sponsor budgets often pay economically
    - Standalone local research team or no research offering
    - Critical supply-side layer and potential moat for network scale
  - - Adjacencies and substitutes intentionally excluded
    - Only the procedure-room or site-network wedge relevant to Iterative's current model
    - Broad non-invasive screening, full CRO spend, and unrelated GI software categories
    - Varies by category
    - Blood/stool testing, academic-only trials, DIY site operations, or no AI
    - Keeps market sizing grounded instead of using category-wide spend as a false TAM
  notes: Included spend is defined by workflow and budget ownership, not by every dollar touching CRC screening or GI research.
