  claims:
  - id: CM001
    statement: 'Iterative Health participates in two related but distinct markets: AI-assisted colonoscopy quality tooling and GI or community clinical-trial site-network services.'
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM018
    - SM019
    - SM020
    - SM025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
  - id: CM002
    statement: For this chapter, included spend is procedure-room detection and quality tooling plus sponsor- or provider-funded research-site infrastructure, while broad non-invasive screening, generic GI software, and full-service CRO spend sit outside the core market boundary.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM001
    - SM015
    - SM018
    - SM019
    - SM020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM002
  - id: CM003
    statement: The American Cancer Society said in 2026 that more than 20 million Americans eligible for colorectal cancer screening are not tested as recommended, or about one in three adults.
    type: third-party-reported
    topic: screening-gap
    sourceRefs:
    - SM001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM003
  - id: CM004
    statement: Among U.S. adults aged 45 to 49, up-to-date colorectal cancer screening prevalence reached 33.7% in 2023 after sitting near 20% in 2019 and 2021.
    type: third-party-reported
    topic: screening-uptake
    sourceRefs:
    - SM021
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM004
  - id: CM005
    statement: Within that 45 to 49 cohort, 2023 colonoscopy prevalence was 27.7% while stool-based testing prevalence was 7.1%.
    type: third-party-reported
    topic: screening-uptake
    sourceRefs:
    - SM021
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM004
  - id: CM006
    statement: Screening gains for adults aged 45 to 49 were concentrated among higher-educated and privately insured people, while less-educated and uninsured groups showed little change.
    type: third-party-reported
    topic: screening-disparities
    sourceRefs:
    - SM021
    confidence: medium
    freshness: recent
  - id: CM007
    statement: The 2024 ACG/ASGE quality update expanded ADR measurement to screening, surveillance, and diagnostic colonoscopy in patients aged 45 and older while excluding positive non-colonoscopy tests, IBD surveillance, and known-neoplasia therapy.
    type: third-party-reported
    topic: quality-indicators
    sourceRefs:
    - SM002
    - SM004
    - SM006
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM005
  - id: CM008
    statement: The same update set ADR-A benchmarks at 35% overall, 40% in men, and 30% in women and added a 6% sessile serrated lesion detection target.
    type: third-party-reported
    topic: quality-indicators
    sourceRefs:
    - SM004
    - SM006
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM006
    - QM022
  - id: CM009
    statement: GI commentary says broader ADR-A measurement reduces indication misclassification and increases denominator size, but practices with more surveillance exams may also report higher overall ADRs.
    type: third-party-reported
    topic: quality-indicators
    sourceRefs:
    - SM005
    - SM006
    confidence: medium
    freshness: current
  - id: CM010
    statement: Updated quality programs also expect about 90% adequate bowel preparation and 90% interval adherence, extending buyer pressure beyond lesion detection alone.
    type: third-party-reported
    topic: quality-indicators
    sourceRefs:
    - SM004
    - SM006
    confidence: medium
    freshness: current
  - id: CM011
    statement: Yale's summary of a 44-study meta-analysis said CADe increases adenoma detection but only slightly increases advanced colorectal neoplasia detection.
    type: third-party-reported
    topic: cade-efficacy
    sourceRefs:
    - SM007
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM007
  - id: CM012
    statement: Yale also said draft AGA guidance made only a conditional recommendation for CADe use while reporting little to no adverse events and no clinically meaningful increase in procedure time.
    type: third-party-reported
    topic: cade-guidance
    sourceRefs:
    - SM007
    confidence: medium
    freshness: recent
  - id: CM013
    statement: Olympus' EAGLE trial reported a 7.3 percentage-point ADR increase in screening and surveillance colonoscopies plus substantial relative increases in large adenoma, non-polyploid adenoma, and SSL detection without workflow disruption.
    type: third-party-reported
    topic: cade-efficacy
    sourceRefs:
    - SM008
    confidence: medium
    freshness: current
    answersQuestionRefs:
