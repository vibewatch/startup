- id: buyer-user-payer-map
  title: Buyer, user, and payer map
  body: |-
    The buyer map splits cleanly across the two businesses. For CADe, the everyday user is the endoscopist, but the economic conversation usually runs through practice administrators, endoscopy medical directors, hospital service-line leaders, or VA and health-system quality owners. The payer is generally the provider organization itself. The reviewed payment sources did not surface dedicated Medicare reimbursement for AI-assisted colonoscopy, so budget owners have to justify spend through quality improvement, competitive differentiation, training support, or workflow efficiency. Olympus' cloud-procurement framing and Yale's button-press implementation both suggest that vendors know this market must fit existing room economics rather than wait for a new payment code.

    For the site-network business, the economic buyer is much more sponsor-side. Iterative's own materials and Clinical Trials Arena both describe centralized access for sponsors and CROs to higher-performing, more diverse community sites. Provider organizations such as GI Alliance matter because they supply investigators, coordinators, and patient relationships, but the core spend is closer to outsourced trial execution than to endoscopy reimbursement. Community practices also receive a co-benefit: research can be embedded into ordinary GI care, which gives physicians and patients access without forcing everyone back into academic-center workflows.

    This split matters for valuation. The colonoscopy-tool business is constrained by provider budgeting and room-level ROI. The site-network business is constrained by sponsor demand, site performance, and the ability to keep community practices activated across multiple studies. Calling them one market would miss the fact that they clear through different procurement motions and different payers.
