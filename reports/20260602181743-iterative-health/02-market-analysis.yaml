- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Age-45 screening expansion plus >20M adults not up to date
    - tailwind
    - current
    - Sustains a large screening pool that can feed both colonoscopy volume and downstream quality-tool demand
    - Quantify which share of new-screening growth still routes into colonoscopy by payer and site type
  - - Higher ADR and SSLDR expectations
    - tailwind
    - current
    - Raises the commercial value of tools and workflows that can improve or document detection performance
    - Request customer data showing whether SKOUT changes reported quality metrics enough to alter practice behavior
  - - CADe efficacy with little or no meaningful time penalty
    - tailwind
    - current
    - Makes AI plausible for buyers who care about quality but cannot absorb throughput loss
    - Collect room-level references on withdrawal time, false positives, and staff acceptance
  - - Sponsor urgency around activation and enrollment
    - tailwind
    - current
    - Creates a clear services buyer because months saved can compress trial timelines and cost
    - Ask for sponsor renewal rates, backlog, and revenue per activated site
  - - Community GI as the center of chronic disease care
    - tailwind
    - current
    - Supports the thesis that community practices are strategically valuable research channels rather than edge cases
    - Map active community-site density by indication and geography
  - - No dedicated AI-colonoscopy reimbursement
    - headwind
    - current
    - Forces CADe purchases to clear against provider budgets rather than an obvious payer-funded ROI path
    - Pull exact CPT-level economics and customer payback cases by setting
  - - CMS site-of-service and physician payment pressure
    - headwind
    - 2025-2026
    - Cuts to ASC and HOPD economics make incremental technology spend harder to justify
    - Model room economics under current and proposed Medicare rates
  - - Workflow, reporting, and evidence frictions in CADe
    - headwind
    - current
    - False positives, automation bias, measurement burden, and limited long-term outcomes can slow adoption even when interest is high
    - Review post-market outcomes, GIQuIC integration, and quality-reporting automation
  - - Public opacity on pricing and contract economics
    - constraint
    - current
    - Prevents a defensible public SAM or SOM for either business line and limits valuation precision
    - Request installed base, pricing, sponsor contract value, and site utilization cohorts
  - - Non-invasive screening growth and unequal access
    - constraint
    - current
    - Blood and stool options widen capture upstream while disparities can limit realized colonoscopy demand in underserved groups
    - Test funnel conversion from positive non-invasive screen to colonoscopy by payer and population
  notes: The driver rows explain why the category exists; the headwinds explain why buyer conversion may lag the apparent demand opportunity.
