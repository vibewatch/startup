runDate: '2026-06-02'
company:
  name: Iterative Health
chapter:
  number: 2
  title: Market Analysis
  summary: 'Iterative Health sells into two adjacent but economically distinct markets: AI-assisted colonoscopy quality tooling for GI providers and GI/community clinical-trial site-network services for sponsors and CROs. Public evidence supports meaningful demand in both, but not a clean one-number TAM: the strongest lenses are a still-large CRC screening gap, tighter colonoscopy quality thresholds, and sponsor pain around slow activation and weak enrollment. Adoption depends less on category hype than on who owns the budget, whether quality or enrollment gains are measurable, and how reimbursement and workflow friction constrain buyers.'
sections:
- id: market-boundary-and-demand-base
  title: Market boundary and demand base
  body: |-
    Iterative Health is exposed to two markets that overlap clinically but clear through different buyers. One is AI-assisted colonoscopy quality tooling: software such as SKOUT that sits inside the endoscopy room and tries to improve lesion detection against a rising quality bar. The other is GI/community clinical-trial site-network services: operating infrastructure sold mainly to sponsors and CROs that need faster activation, better enrollment, and access to community patient populations. Treating those as one TAM would hide the fact that one market is budgeted like provider operating or technology spend, while the other is outsourced trial-execution spend.

    The included spend for the quality-tool market is narrow. It covers lesion-detection software, deployment/support, and quality-workflow fit inside screening or surveillance colonoscopy. It excludes the broader CRC screening universe, which now also includes blood-based and at-home stool tests, and it excludes generic endoscopy software that does not change detection performance. The included spend for the site-network market is equally specific: site startup, contracting, training, patient-identification support, and sponsor access to high-performing community GI sites. It does not include the full CRO stack or every piece of GI research spend.

    Demand is real but uneven. ACS says more than 20 million eligible Americans are still not up to date on CRC screening, and Medicare policy still routes positive stool or blood tests into follow-up colonoscopy. But the newly age-expanded 45-49 cohort remains far from saturated: only 33.7% were up to date in 2023, with adoption concentrated among better-insured and better-educated adults. Iterative's colonoscopy-facing market is therefore anchored to a large prevention gap, but adoption still depends on access, outreach, and whether direct-visual screening remains attractive versus non-invasive alternatives.
