  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 45 岁起筛查扩容，加上 >20M 成年人未按时筛查
        - 利好
        - 当前
        - 维持庞大筛查人群，既能支撑结肠镜量，也能带动下游质量工具需求
        - 按付款方和站点类型量化新增筛查增长中仍流向结肠镜的比例
      - - ADR 和 SSLDR 预期提高
        - 利好
        - 当前
        - 能提升或记录检出表现的工具和工作流，商业价值随之提高
        - 要求客户数据，验证 SKOUT 是否足以改变上报质量指标并影响诊所行为
      - - CADe 有效，且几乎没有或没有明显时间惩罚
        - 利好
        - 当前
        - 买方重视质量但承受不了吞吐损失，AI 因此更容易成立
        - 收集检查室层面对退镜时间、假阳性和员工接受度的参考反馈
      - - 赞助方急于加快启动和入组
        - 利好
        - 当前
        - 节省数月可压缩试验周期和成本，因此服务买方很清晰
        - 询问赞助方续约率、积压订单和每个已启动站点收入
      - - 社区 GI 成为慢病诊疗中心
        - 利好
        - 当前
        - 支撑一个判断：社区诊所是有战略价值的研究渠道，不是边缘场景
        - 按适应症和地理位置绘制活跃社区站点密度
      - - AI 结肠镜没有专门报销
        - 逆风
        - 当前
        - CADe 采购只能从医疗服务方预算中证明合理性，而不是走清晰的付款方资助 ROI 路径
        - 按场景调取准确的 CPT 层面经济性和客户回本案例
      - - CMS 服务地点和医生支付压力
        - 逆风
        - 2025-2026
        - ASC 和 HOPD 经济性被削弱，增量技术支出更难解释
        - 按当前和拟议 Medicare 费率建模检查室经济性
      - - CADe 的工作流、报告和证据摩擦
        - 逆风
        - 当前
        - 即使兴趣很高，假阳性、自动化偏差、测量负担和长期结果有限也会拖慢采用
        - 审查上市后结果、GIQuIC 集成和质量报告自动化
      - - 定价和合同经济性公开透明度不足
        - 约束
        - 当前
        - 公开信息无法支撑任一业务线的可信 SAM 或 SOM，也限制估值精度
        - 要求提供装机基础、定价、赞助方合同价值和站点利用率队列
      - - 非侵入式筛查增长和可及性不均
        - 约束
        - 当前
        - 血液和粪便选项扩大上游捕获，但可及性差异会限制服务不足群体中真正转化成的结肠镜需求
        - 按付款方和人群测试非侵入式筛查阳性到结肠镜的漏斗转化
    notes: 驱动因素解释这个品类为什么存在；逆风解释买方转化为什么可能落后于表面需求机会。
