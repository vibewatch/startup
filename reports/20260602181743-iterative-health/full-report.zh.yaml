      - - 内镜质量衡量与报告
        - ADR/SSLDR 跟踪、GIQuIC 或与 MIPS 对齐的质量工作流，以及绑定结肠镜表现的反馈系统
        - 不改变结肠镜质量或报告行为的通用分析工具
        - GI 质量负责人或管理员
        - 手工病历审计和延迟反馈
        - 重要邻近领域，因为质量标准上升会创造工具需求
      - - 面向赞助方的 GI / 社区试验站点网络服务
        - 站点启动、签约、协调员支持、患者识别，以及赞助方进入社区 GI 站点的能力
        - 完整 CRO 外包、实验室 / 影像服务和非站点网络试验功能
        - 赞助方或 CRO 付费；PI 和站点人员使用
        - 仅使用学术中心的站点策略，或碎片化直接签约站点
        - Iterative 网络业务的直接服务市场
      - - 医疗服务方网络研究赋能
        - 诊所合作、PI / 协调员支持，以及把试验嵌入社区 GI 诊疗的基础设施
        - 不包含研究赋能的通用诊所管理服务
        - 医疗服务集团在运营上合作；经济上常由赞助方预算支付
        - 独立本地研究团队，或没有研究服务
        - 对网络规模至关重要的供给侧层，并可能形成护城河
      - - 有意排除的邻近领域与替代品
        - 只纳入与 Iterative 当前模型有关的检查室 / 站点网络切入点
        - 宽泛非侵入式筛查、完整 CRO 支出和无关 GI 软件类别
        - 因品类而异
