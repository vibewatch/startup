  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 参照
      - 2026 指标快照
      - 隐含倍数 / 估值
      - 如何映射 Iterative
      - 局限
    rows:
      - - IQVIA
        - $30.14B 市值 / $16.63B TTM 收入
        - ~1.8x 收入
        - 为规模化医疗研究基础设施提供多元化 CRO / 数据估值底线
        - 规模更大、已上市，也比 Iterative 更多元
      - - ICON
        - $10.53B 市值 / $8.10B TTM 收入
        - ~1.3x 收入
        - 服务执行占比较高时，全球 CRO 是基准
        - AI / 数据可选性弱于 Iterative 所声称的空间
      - - Medpace
        - $12.72B 市值 / $2.67B TTM 收入；Q1 收入 +26.5%，EBITDA 利润率 21.1%
        - ~4.8x 收入
        - 最适合映射高质量研究执行和增长的上市样本
        - 仍是上市盈利公司，成熟度远高于 Iterative
      - - 2026 年优质医疗科技并购区间
        - 普通医疗科技 ~4x-6x；优质 AI / 数据 ~6x-8x+
        - 市场区间，非公司特定倍数
        - 给优质混合模式可能拿到的倍数划定范围
        - 交易区间高度取决于质量、监管和持续性
      - - Iterative 当前私募估值
        - 第三方估值语境约 $1.3B-$1.4B；累计融资约 $271M-$273M+
        - 后期私募独角兽估值
        - 当前讨论的实际入场价
        - 未披露收入、毛利率或留存，倍数缺少锚
      - - 2026 年独角兽重估语境
        - PitchBook 称许多独角兽估值已过期；AI 公司生成速度仍异常高
        - 不是直接倍数，而是折价框架
        - 支持谨慎看待未被公开基本面刷新过的私募估值
        - 属于市场语境，不是直接经营可比
    notes: 样本是部分而非穷尽，混合了上市可比、市场区间和私募估值语境，因为 Iterative 同时带有 CRO、AI 和私募独角兽属性。
