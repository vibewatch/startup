      - number: '6.4'
        title: 留存、重复使用和耐久性代理指标
        blocks:
          - type: paragraph
            body: >-
              Iterative 不披露 NRR、GRR、客户标识流失、续约率、合同期限或公开评测平台评分，所以留存判断只能依赖间接信号。最好的重复使用代理指标是纵向的。Ziad Younes 说 Iterative
              已经作为可信伙伴服务其站点多年，这比一次性实施引述更有力。GI Alliance 首席医疗官将 DDW 2026 结果描述为战略合作一年后已经成为可能的证据。DDW 发布还称，2026
              年展示是第二次大规模公开报告聚合网络表现，并强调 4 项研究以稳定随机化率完成满额入组。这些都是有用信号，因为它们说明 Iterative 不只是宣布客户标识，而是在入驻后继续执行。


              但投资人不应把运营一致性误读为客户留存证明。临床试验具有阶段性，赞助方常常同时使用多个站点网络，医疗服务集团也可能同时保留多条研究或技术关系。公开证据强调启动、预筛查、病历审阅减负和试验内患者留存；它没有说明多少赞助方带着新方案回来、多少医疗服务集团在第一年后扩大合同范围，或多少收入会自动续约。被拦截的
              OUP 摘要页面也意味着，直接会议记录不如周边公司摘要和联合新闻稿覆盖容易取得。简言之，耐久性方向上偏正面，但硬留存数据仍未披露。
