    rows:
      - - GI 内大型网络扩张
        - GI Alliance、One GI、Gastro Health 和 Gastro One 显示，Iterative 能通过医疗机构组织落地并扩张
        - 若一份合同能打开多个站点是利好；若少数网络主导具名证据和收入，则风险上升
        - 索取前十大医疗机构网络收入占比和已签活跃合同下的站点数
      - - 申办方组合扩张
        - 40+ 家申办方 / CRO / 器械合作伙伴和 Takeda 关系，暗示其广度不止一个申办方
        - 若申办方带来重复方案，利好交叉销售；没有申办方队列数据则仍不透明
        - 索取按活跃研究拆分的申办方数量、重复研究率和头部申办方收入贡献
      - - 多专科扩张
        - USHV 加上 Series C 信息，把模型延伸到心脏病学和肥胖领域
        - 可能扩大 TAM，并降低 GI 集中度
        - 索取首批心脏病学申办方、已接入心脏病学站点数和早期启动指标
      - - 医疗机构集中度
        - 大多数公开具名证据集中在 GI Alliance、One GI、USHV、Gastro Health 和 Gastro One
        - 若少数网络贡献大部分收入或患者触达，集中度风险高
        - 索取按医疗机构伙伴拆分的收入和研究量敞口
      - - 申办方多栖合作
        - 申办方通常同时使用多个站点网络和 CRO；公开证据显示绩效，但不显示排他性
        - 风险中高：强劲的单项研究结果未必自动转化为重复授标
        - 索取申办方留存，以及对 CRO / 竞争站点网络的赢输分析
      - - 采购 / 运营替代风险
        - Iterative 把人员配置、监管、预算、病历审查和启动支持作为核心价值出售
        - 如果客户自建这些能力，或选择其他供应商，定价权可能被压缩
        - 索取服务相对纯技术产品的附加率，以及流失原因
      - - SKOUT 产品可见度缺口
        - SKOUT 页面缺少具名客户，而竞争对手 GI Genius 对外打出强公开主张
        - 器械侧集中度和采用风险难以量化；品类竞争已很清楚
        - 索取装机基数、具名客户、复购 / 续约数据，以及按器械拆分的竞争赢输
      - - 国际多元化缺口
        - Series C 提到印度和澳大利亚，但具名伙伴证据几乎都集中在美国
        - 全球机会存在，但美国以外的执行质量和留存仍未被充分证明
        - 索取美国以外活跃站点数、申办方组合和按地域拆分的绩效
