  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和报销风险
        blocks:
          - type: paragraph
            body: >-
              Iterative 的监管和法律风险，并非主要来自当下可见的执法事件，而是来自尚未稳定的运营边界。SKOUT 所在品类中，临床证据方向上为正，但在可推广性、假阳性、假阴性、技能退化和长期结果上仍有争议。BMJ
              2025 年综述更进一步，把 AI 内镜界定为责任问题，责任如今横跨临床医生、机构、开发者和监管者。这一点很重要，因为主要机构对常规使用 CADe
              仍有分歧，说明该品类尚未沉淀成无争议的护理标准。如果出现不良事件或令人失望的真实世界证据，问责不会整齐落在单一主体上。


              报销侧同样重要。Medicare 明确覆盖筛查性结肠镜，但审阅过的政策和法律来源没有显示内镜 AI 已经有稳定、器械特定的支付路径。相反，政策讨论仍停留在拟议立法和 AI
              赋能医疗器械的通用支付框架层面。与此同时，GI 医疗服务经济性承压：AGA 和 Becker’s 描述了内镜报销的削减和较长期侵蚀，这会削弱买方对附加技术和运营开销的胃口。Iterative
              确实有基础合规设施——隐私政策、DPO、服务提供商披露和一般安全表述——但其公开安全姿态仍停留在高层次。按实际尽调口径，监管问题不是 Iterative
              是否完全没有合规流程；而是如果审查加强，这套流程能否足够强地支撑一个数据密集的 AI 和站点运营模型。
