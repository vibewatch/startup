      - number: '7.2'
        title: 运营、质量和安全风险
        blocks:
          - type: paragraph
            body: >-
              核心运营押注在于，Iterative 能否在把高接触网络扩到 100 多个站点并进入新专科时，仍保持试验表现优势。公开数据支撑上行情景：公司称启动快 2x、入组高 3.4x，DDW 2026
              结果显示，在更大规模下仍大约维持 3x 基准随机化表现。这是有意义的缓释，反驳了该模型只是一组试点胜利的说法。但同一批来源也说明了模型为何脆弱。Iterative 不只是交付一台器械或 SaaS
              仪表盘；它还提供预算、法律和监管支持、培训、赞助方互动、研究启动和人员管理。这意味着，即便底层软件保持稳定，质量漂移仍可能来自劳动力、流程或站点治理失灵。


              AI 侧的运营风险，并不只是 SKOUT 或相近 CADe
              工具能否在研究中奏效；关键是它们在日常使用中、跨不同用户、设备、病例组合和临床文化时，表现能否保持可靠。综述引用了假阳性、假阴性、数据集偏差、操作者过度依赖，以及部分分析中较弱的真实世界可复现性。公司自有医疗服务方材料强调持续的
              PI 和 CRC
              培训，外部访谈报道则称网络花了多年才建成，而且仍需要不断改进。两者合在一起，支持一种平衡看法：运营证据优于许多初创公司，但该模型仍重执行，因此对人员质量、培训纪律和流程控制高度敏感。数据安全属于同一类风险，因为研究运营、赞助方协调和
              AI 工作流都会增加数据处理复杂度，而公开安全披露仍偏薄。
