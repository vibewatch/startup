      - number: '8.2'
        title: 当前估值语境和可比公司组
        blocks:
          - type: paragraph
            body: >-
              当前估值语境足以建立纪律框架，但不足以支撑激进确信。Forge 显示 2026 年 4 月 Series C 估值为 $1.3 billion，TechCrunch 在 2026 独角兽追踪器中将
              Iterative 列为 $1.4 billion；ai2.work 也报告约 $1.3 billion 标记。公司官方材料确认 $77 million 融资，但不确认投后 估值。Forge
              只补充了部分融资条款线索，包括 1.0x 非参与清算优先权和 8% 股息率，因此公开记录中的下行保护和稀释仍不完整。


              公开可比公司提示谨慎。IQVIA 和 ICON 交易在大约 1x-2x 收入附近，Medpace 则接近大约 5x 收入，并且在这组公司中呈现最佳的公开可见增长和利润率组合。与此同时，当前 2026 年 M&A
              评论显示，优质医疗科技 标的成交约 4x-6x 收入，只有高端 AI / 数据资产能推到 6x-8x 以上区间。这意味着，只有当 Iterative 的业务已经明显更接近高端 AI /
              数据经济性，而不是服务密集型 CRO 画像时，当前标记才站得住。由于收入未披露，单凭公开证据无法确认。
