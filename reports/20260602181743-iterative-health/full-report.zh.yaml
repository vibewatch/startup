      - number: '7.3'
        title: 伙伴、依赖和人员风险
        blocks:
          - type: paragraph
            body: >-
              Iterative 的公开进展真实存在，但集中度高。GI Alliance、One GI 和 US Heart & Vascular
              主导具名医疗服务方记录，而且每段关系在战略上都足够重要，任何一方都可能对增长观感、赞助方进入和管线 密度产生超比例影响。GI Alliance 带来 21 个活跃站点和 80 多项试验；One GI 带来 34
              家诊所和 13 个活跃站点；USHV
              打开心脏病学，并强化多专科野心。这些是优势，也是依赖。如果主要伙伴表现不佳、重新定价、延迟扩张，或其经济重要性低于标题里的站点数暗示，外部叙事可能迅速恶化，因为太多证据都落在少数生态里。


              产品和工作流层面还有第二层依赖。Medtronic 和 Olympus 不只是替代 AI 供应商；它们还是大型在位厂商，可以捆绑培训、硬件兼容性和装机基础杠杆。Olympus 明确把 CADDIE
              绑定到其设备中枢和白光工作流，Medtronic 则围绕敏感性和低假阳性营销 GI Genius。因此，Iterative
              不能只靠模型质量取胜，还要赢在渠道进入和工作流契合。人员风险叠加在上述因素之上。管理层梯队显然在改善——现在有总裁 /
              CFO、COO、医疗领导和法律领导——但这支梯队看起来仍是近期组建，而不是已经在当前规模下长期经历战斗检验。对创始人 Jonathan Ng 的依赖仍然明显，因为战略仍要求
              AI、医疗服务方合作、赞助方商业化和多专科扩张同步执行。
