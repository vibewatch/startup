            - label: 中等
              tone: positive
              detail: 客户侧新闻稿比纯 Iterative 引语更具独立性。
        - label: SKOUT
          values:
            - label: 弱
              tone: risk
              detail: 公开信息只有匿名临床医生引语和有效性主张。
            - label: 弱
              tone: risk
              detail: 未披露已点名安装、医疗提供方账户或站点数量。
            - label: 弱
              tone: risk
              detail: 没有公开的续约或复购数据。
            - label: 弱
              tone: risk
              detail: 证据全部来自产品营销，而不是客户侧证据。
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    description: Iterative 未披露正式留存指标，因此用公开证据里可见客户队列的演变，作为留存代理视角。
    layout: wide
    claimRefs:
      - CU023
      - CU024
      - CU027
      - CU028
      - CU029
      - CU031
    data:
      columns:
        - 初始证据
        - 后续证据
        - 当前可见度
      rows:
        - label: 大型医疗服务方网络队列
          values:
            - label: 活跃
              tone: positive
              detail: GI Alliance 和 One GI 出现在公开记录中，并带有量化站点覆盖。
            - label: 扩展
              tone: positive
              detail: GI Alliance 后续 DDW 引述、One GI 关于多年合作伙伴的表述，都暗示仍在使用。
            - label: 可见
              tone: positive
              detail: 到 2026 年，仍是 Iterative 具名客户叙事的核心。
        - label: IBD 赞助方项目队列
          values:
            - label: 已对标
              tone: positive
              detail: JCC 和公司材料显示，激活和随机入组速度快于基准。
            - label: 重复出现
              tone: positive
              detail: DDW 2026 的口径是第二次重大公开披露，规模已翻倍。
            - label: 不透明
              tone: neutral
              detail: 尽管运营指标强劲，赞助方层面的续约率仍未披露。
        - label: 站点级案例研究队列
          values:
            - label: 可见
              tone: positive
              detail: Gastro One 和 Gastro Health 展示了具体的站点或平台级部署。
            - label: 部分重复出现
              tone: neutral
              detail: 部分关系有多年合作表述，但多数案例研究没有后续量化更新。
            - label: 混合
              tone: neutral
              detail: 公开证据仍是选择性披露，并未覆盖所有站点客户。
        - label: SKOUT 设备队列
          values:
            - label: 不可见
              tone: risk
              detail: 公开产品材料未点名正在使用的医疗服务方账户。
            - label: 不可见
              tone: risk
              detail: 没有公开的后续安装或复购证据。
            - label: 不可见
              tone: risk
              detail: 现有材料无法评估设备留存。
  - id: FR001
    title: 风险热力图
    type: matrix
    description: 纳入当前可见缓释因素后，Iterative Health 主要风险的残余严重性图谱。
    claimRefs:
      - CR016
      - CR019
      - CR021
      - CR025
      - CR030
      - CR041
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 致命影响
          values:
            - label: 安全 / 控制失效
              tone: risk
              detail: 公开证据没有显示，但一旦发生，后果会很严重。
            - label: 合作伙伴集中度冲击
              tone: risk
              detail: 任一大型网络中断都会迅速传导到证据和收入。
            - label: 运营优势失守
              tone: risk
              detail: 整个高溢价费率表逻辑都靠持续高于基准支撑。
        - label: 高影响
          values:
            - label: AI 正式追责事件
              tone: risk
              detail: 共同问责可能带来高昂成本，并损害声誉。
            - label: 报销路径停滞
              tone: risk
              detail: GI 预算仍然吃紧时，Medicare AI 报销路径没有可预测性。
            - label: 既有厂商工作流挤压
              tone: risk
              detail: Medtronic/Olympus 可以靠集成和渠道力竞争。
        - label: 中等影响
          values:
            - label: 管理层厚度滞后
              tone: neutral
              detail: 管理梯队在改善，但扩编时间仍短。
            - label: 技能退化 / 过度依赖
              tone: risk
              detail: 需要培训和治理，避免技能退化。
            - label: 跨专科扩张拖累
              tone: neutral
              detail: 心脏病学 / 肥胖业务在经济性验证前扩张，会增加复杂度。
  - id: FR002
    title: 风险传导图
    type: dag
    description: 证据、报销和集中度风险如何传导到增长、定价和估值。
    claimRefs:
      - CR016
      - CR019
      - CR021
      - CR030
      - CR039
      - CR041
    data:
      nodes:
        - id: evidence
          label: AI / 网络证据风险
        - id: performance
          label: 激活 / 随机入组表现
        - id: pricing
          label: 溢价定价 / 费率表
        - id: partners
          label: 合作伙伴网络集中度
        - id: reimbursement
          label: GI 报销压力
        - id: budget
          label: 客户支付意愿
        - id: renewal
          label: 赞助方 / 医疗服务方续约
        - id: margin
          label: 毛利率 / 经营杠杆
        - id: valuation
          label: 估值支撑
      edges:
        - from: evidence
          to: performance
          label: 验证或削弱
        - from: performance
          to: pricing
          label: 支撑
        - from: partners
          to: renewal
          label: 集中
        - from: reimbursement
          to: budget
          label: 挤压
        - from: budget
          to: renewal
          label: 放慢或收缩
        - from: pricing
          to: margin
          label: 传导至
        - from: renewal
          to: margin
          label: 稳住或削弱
        - from: margin
          to: valuation
          label: 支撑
        - from: partners
          to: valuation
          label: 若集中则放大下行
  - id: FR003
    title: 依赖关系图
    type: dag
    description: 覆盖医疗服务方网络、赞助方准入、设备工作流和合规栈的关键外部依赖。
    claimRefs:
      - CR021
      - CR025
      - CR027
      - CR035
      - CR040
    data:
      nodes:
        - id: iterative
          label: Iterative Health 核心模式
        - id: gia
          label: GI Alliance
        - id: onegi
          label: One GI
        - id: ushv
          label: US Heart & Vascular
        - id: sponsors
          label: 赞助方 / CRO
        - id: skout
          label: SKOUT 采用
        - id: medtronic
          label: Medtronic GI Genius
        - id: olympus
          label: Olympus CADDIE
        - id: vendors
          label: 服务商 / 数据栈
      edges:
        - from: gia
          to: iterative
          label: 站点 / 患者触达
        - from: onegi
          to: iterative
          label: 站点 / 合作伙伴深度
        - from: ushv
          to: iterative
          label: 专科扩张
        - from: sponsors
          to: iterative
          label: 试验需求 / 收入
        - from: iterative
          to: skout
          label: 交叉销售 / 证据联动
        - from: medtronic
          to: skout
          label: 竞争压力
        - from: olympus
          to: skout
          label: 工作流 / 平台压力
        - from: vendors
          to: iterative
          label: 托管 / 安全 / 分析
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持「继续研究」：运营证据确实存在，但按当前价格看，经济性和变现披露仍不足。
    data:
      nodes:
        - id: N1
          label: 运营证据
          description: '>100 个站点、40+ 家合作伙伴、2x 激活、>3x 入组 / 随机入组信号'
        - id: N2
          label: 扩张可选性
          description: 若能变现，心脏病学和肥胖业务会把故事拓到 GI 之外
        - id: N3
          label: 当前估值标记
          description: 第三方估值语境集中在 $1.3B-$1.4B 附近
        - id: N4
          label: 公开可比公司下限
          description: IQVIA ~1.8x、ICON ~1.3x、Medpace ~4.8x 收入
        - id: N5
          label: 经济性缺口
          description: 未公开披露收入、利润率、净留存率（NRR）或集中度
        - id: N6
          label: 变现摩擦
          description: AI 报销路径未定；GI 支付压力仍然真实
        - id: N7
          label: 继续研究
          description: 中等置信度、高风险、估值偏高
      edges:
        - from: N1
          to: N7
          label: 支撑关注
        - from: N2
          to: N7
          label: 支撑上行
        - from: N3
          to: N7
          label: 要求估值纪律
        - from: N4
          to: N7
          label: 框定倍数下限
        - from: N5
          to: N7
          label: 挡住买入判断
        - from: N6
          to: N7
          label: 抬高风险
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV014
      - CV017
      - CV019
      - CV020
      - CV021
      - CV035
      - CV043
      - CV050
      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 只有收入进入高溢价 AI / 数据区间上沿后，当前估值标记才更容易站住脚。
    data:
      items:
        - label: $100M 收入 × 4x
          value: 400
        - label: $150M 收入 × 4x
          value: 600
        - label: $180M 收入 × 5x
          value: 900
        - label: $200M 收入 × 6x
          value: 1200
        - label: $220M 收入 × 6.5x
          value: 1430
        - label: $250M 收入 × 7x
          value: 1750
        - label: $300M 收入 × 8x
          value: 2400
    approximationNotes: 条形图用来自公开可比公司和 2026 年医疗科技并购评论的多档倍数，展示企业价值结果；并非公司指引。
    claimRefs:
      - CV023
      - CV024
      - CV036
      - CV037
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 按当前披露估值标记，基准情景回报有限，下行空间仍然显著。
    data:
      items:
        - label: 当前披露估值标记
          low: 1300
          mid: 1350
          high: 1400
          unit: USD million
          year: '2026'
          source: Third-party valuation context from Forge, TechCrunch, and ai2.work
        - label: 悲观退出企业价值
          low: 400
          mid: 650
          high: 900
          unit: USD million
          year: 2028-2029
          source: Execution slip or compression toward CRO/reset multiples
        - label: 基准情景退出企业价值
          low: 900
          mid: 1200
          high: 1500
          unit: USD million
          year: 2028-2029
          source: High-quality CRO/data hybrid outcome
        - label: 乐观退出企业价值
          low: 1800
          mid: 2200
          high: 2600
          unit: USD million
          year: 2028-2030
          source: Premium AI/data outcome with multispecialty monetization
        - label: $1.35B 入场估值下的悲观 MOIC
          low: 0.3
          mid: 0.5
          high: 0.7
          unit: x
          year: 2028-2029
          source: Illustrative enterprise-value to entry-value ratio before exact preference effects
        - label: $1.35B 入场估值下的基准情景 MOIC
          low: 0.7
          mid: 0.9
          high: 1.1
          unit: x
          year: 2028-2029
          source: Illustrative range; limited upside at current mark
        - label: $1.35B 入场估值下的乐观 MOIC
          low: 1.2
          mid: 1.6
          high: 1.9
          unit: x
          year: 2028-2030
          source: Bull still does not resemble a classic 3x late-stage venture outcome
    approximationNotes: 区间基于情景推演，未纳入精确稀释或优先证券清偿瀑布，因为股权结构条款并未完全公开。
    claimRefs:
      - CV014
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 公司在证据和可选性上得分较高，但经济性可见度和估值支撑偏弱。
    data:
      items:
        - label: 运营证据
          value: Strong
          note: 吞吐量和随机入组信号优于非上市医疗科技公司平均水平
        - label: 扩张可选性
          value: Moderate-Strong
          note: 心脏病学和肥胖业务拓宽了故事，但变现证据仍处早期
        - label: 经济性可见度
          value: Weak
          note: 未公开披露收入、年经常性收入（ARR）、毛利率、净留存率（NRR）或集中度
        - label: 可比公司支撑
          value: Mixed
          note: 公开 CRO 可比公司倍数低得多；只有经济性更好，高溢价 AI / 数据区间才站得住
        - label: 报销准备度
          value: Weak-Moderate
          note: 政策路径在概念上存在，但尚未成为稳定商业现实
        - label: 风险画像
          value: High
          note: 执行、报销和价格风险相互叠加，而不是相互抵消
        - label: 估值立场
          value: Stretched
          note: 当前估值标记隐含的内容，超过公开记录能证明的范围
        - label: 证据质量
          value: Medium
          note: 融资和业绩可以交叉验证；经济性和股权结构细节不行
    claimRefs:
      - CV017
      - CV023
      - CV035
      - CV043
      - CV050
      - CV051
      - CV052
