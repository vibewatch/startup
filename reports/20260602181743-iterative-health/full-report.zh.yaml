        - AI + GI / 站点网络混合运营商
        - 2026 年 $77M Series C 轮；公开报道 >100 个研究站点、>40 个合作伙伴
        - 需要社区站点执行的 GI 医疗服务方、赞助方和 CRO
        - 已审阅对象中，唯一公开把 CADe 周边 AI 工具与嵌入式站点网络运营配在一起的公司
        - 公开装机基础、价目表和赞助方赢单 / 输单数据仍未披露
      - - Medtronic GI Genius
        - 老牌医疗技术厂商的 CADe 模块
        - 全球医疗技术龙头；将 GI Genius 作为 AI 辅助结肠镜模块销售
        - 医院、ASC 和 GI 内镜项目
        - 商业触达已有规模，定位为模块化 AI 加装件
        - 已审阅公开材料未显示 GI 专属站点网络服务或透明定价
      - - Olympus OLYSENSE / CADDIE / ENDO-AID
        - 老牌 OEM 内镜生态
        - 全球内镜龙头；2025 年推出更广的 OLYSENSE CAD/AI 产品组合
        - 已安装 Olympus 的内镜套间
        - EVIS X1 生态内整合硬件、云应用和工作流
        - 锁定强度取决于 Olympus 硬件覆盖，可能限制多厂商灵活性
      - - Fujifilm CAD EYE
        - 老牌 OEM AI 内镜工具
        - 大型影像 OEM；CAD EYE 绑定 EX-1 及兼容 Fujifilm 系统
        - 基于 Fujifilm 的内镜项目
        - 自有硬件集成，加上 AI 辅助检出 / 表征叙事
        - 已审阅公开证据未显示广泛服务网络或赞助方执行能力
      - - Odin Vision CADDIE
        - 纯 AI 内镜专科厂商
        - 规模较小的云 AI 专科厂商，主打临床医生案例和低培训门槛
        - 寻求软件驱动 CADe 支持的站点
        - 基于云的工作流，专科叙事更简单
        - 公开可见的分销能力不如大型 OEM 明显
      - - IQVIA
        - 全球 CRO / 站点网络龙头
        - 声称 II 期 IBD 成功率高 88%、III 期高 25%；100 个国家 >1,100 个站点
        - 需要规模、数据和全球运营覆盖的赞助方
        - 赞助方触达、站点覆盖和数据基础设施规模巨大
        - 定位不围绕检查室 GI AI，也不强调嵌入社区诊所
      - - ICON + Accellacare
        - 全球 CRO + 站点网络龙头
        - 五年内 114+ 项 GI 研究；Accellacare 拥有 8.1M+ 患者和 50+ 个站点
        - 寻求可预测入组和启动支持的赞助方
        - GI 研究历史广，加上自有站点网络基础设施
        - GI 专注度不如 Alimentiv，AI 产品导向不如 Iterative
      - - Alimentiv
        - 专科 GI CRO / 站点网络对手
        - 深耕 GI 研究 30+ 年；60+ 个国家 5,000+ 个站点；支持 >70% 的 IBD 化合物
        - 需要专科深度的 GI 和 IBD 赞助方
        - 只聚焦 GI，具备集中化内镜传统和站点中心模式
        - 已审阅证据未显示可与 SKOUT 相比的检查室 AI 产品
      - - 现状 / 碎片化直连站点运营
        - 替代方案 / 内部自建
        - 装机基础巨大但没有统一供应商；许多站点仍入组不足
        - 避免新增供应商支出的医疗服务方和赞助方
        - 前期无需增量软件或外包支出
        - 启动更慢、入组可预测性更弱，也没有 CADe 提升
      - - 医疗服务方控制的研究附属业务
        - 潜在对手 / 供给侧替代
        - GI Alliance 和 One GI 披露了活跃研究站点和广泛诊所覆盖
        - 能够内化或重定向研究流量的大型 GI 集团
        - 在诊所层面掌握研究者关系和患者触达
        - 今天可以与 Iterative 合作，之后仍可能变成议价对手
    notes: 公开规模和差异化来自已审阅的官方及独立来源。定价单独处理，因为几乎所有竞争对手都靠联系销售型企业包装成交，而不是标价。
