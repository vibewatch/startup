  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈与客户流程
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 并不把自己呈现为单一产品医疗技术供应商。横跨官网、关于页面和当前招聘描述，公司都在描述一个混合医疗技术与服务平台：它把嵌入社区的研究基础设施、AI
              驱动的疾病评估工具，以及至少一个受监管的现场护理器械结合起来。按客户流程看，这套栈服务两个相连但不同的用户群。申办方和 CRO 用 Iterative 更快启动研究中心、降低运营负担，并改善 GI
              周边试验的招募。医疗服务机构和内镜医生在筛查与监测性结肠镜中使用
              SKOUT，把它作为检查室内的辅助器械。因此，公司的商业承诺不只是算法表现，而是把患者识别、研究中心运营、内镜评估和申办方报告连接起来的更宽运营模式。


              公开可见模块强化了这一判断。SKOUT 是最具体的产品触点，因为它有 FDA 许可适应证、GUDID
              记录和已发布的流程描述。但更宽平台也能从公司反复强调的内容中看见：嵌入社区护理的全球研究中心网络，带运营支持的启动和预筛流程，用于溃疡性结肠炎的 AI 驱动内镜与组织学分析，以及面向试验终点的
              AI-人工混合中央阅片范式。这种广度具有战略意义。它说明 Iterative 试图拥有更多 GI 研究流程，而不是只吃到单个检测算法能捕获的价值；相对主要销售一个 CADe 模块的品类同行，这是重要差异点。
