      - number: '4.4'
        title: 财务尽调阻塞点与承销结论
        blocks:
          - type: paragraph
            body: >-
              公开记录足以勾勒业务模型，但不足以承销它。投资人可以合理得出结论：Iterative 有真实商业需求、真实申办方和医疗服务关系，以及至少一个 SKOUT
              这样的受监管产品触点。投资人也可以判断，公司有足够融资通道继续扩张。无法得出的结论是：模式中有多少是经常性的，直接利润率长什么样，研究中心经济性多久回本，或近期扩张后还剩多少现金。


              最重要的阻塞点很直接：没有收入或 ARR
              披露；没有按收入流拆分；没有毛利率或直接成本拆分；没有现金、烧钱速度、现金跑道或债务表；没有公开价格卡；也没有申办方留存、积压订单或客户集中度披露。员工数和估值代理指标互相冲突，也强化了二手来源只能近似的事实。


              因此，财务结论是谨慎但不负面。Iterative 看起来商业上可信、战略融资也到位，但行为仍像一家希望投资人相信运营动能、而不是披露经济性的私人公司。对尽调来说，这意味着第 4
              章应把上行空间视为可能存在，但在管理层分享实际财务报表和合同指标之前，资本充足性和单位经济性信心都仍未证实。
