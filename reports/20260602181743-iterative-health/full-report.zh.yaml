  - id: TI003
    title: 单位经济表
    columns:
      - 指标
      - 数值 / 状态
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - 研究站点覆盖
        - 全球 >100 个研究站点
        - 高
        - 网络密度越高，申办方销售和患者触达越好，规模因此重要
        - 拆分全资管理 vs. 伙伴运营站点、活跃 vs. 非活跃站点，以及每个站点的平均研究负载
      - - 申办方 / 伙伴密度
        - '>40 家制药 / 生物技术 / 器械 / CRO 伙伴'
        - 高
        - 交易对手基础广，是商业需求和潜在复购的正向代理指标
        - 披露申办方集中度、复购率和前 10 大收入敞口
      - - 入组效率
        - IBD 中 0.33 名患者 / 站点 / 月 vs. 0.10 基准
        - 高
        - 入组速度是公司公开证明运营价值和潜在定价权的最清晰证据
        - 说明该指标在 IBD 之外是否成立，以及如何转化为每项试验的实际申办方收入
      - - 激活速度
        - 激活速度快 2 倍，启动时间最多缩短 3 个月
        - 高
        - 若可重复，更快激活可支撑溢价或更高申办方胜率
        - 披露按治疗领域划分的激活时间中位数，并说明经济口径是否包含转付站点成本
      - - 员工数 / 站点代理指标
        - 公司总部开销前约 1.7-2.5 名员工 / 站点（166-250 名员工 / 100+ 个站点）
        - 低
        - 这一粗略比率表明，模型依赖集中化杠杆和伙伴劳动力，而不是完全由公司自有站点配满人员
        - 按站点队列提供站点层人员配置、总部开销分摊和全负荷人员成本
      - - 获客成本（CAC）
        - null
        - 低
        - 没有 CAC，无法承保销售效率和 GTM 资本强度
        - 分别披露申办方 CAC 和医疗机构伙伴 CAC
      - - 客户终身价值（LTV）
        - null
        - 低
        - 没有 LTV 或留存数据，投资人无法判断粘性关系能否抵消高实施成本
        - 按申办方和医疗机构伙伴队列提供毛利润 LTV
      - - 回本周期
