chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 成立于 2017 年，如今对外呈现为一家医疗技术与服务公司，总部位于马萨诸塞州 Cambridge 和纽约州 New
              York。公司当前首页和关于页面给出的框架，已经不再像单一产品 AI 初创公司，而更像多专科临床研究基础设施平台。其运营重点现在覆盖
              GI、肝病学、肥胖和心脏病学，并把研究直接嵌入社区护理场景，而不是只集中在学术中心。


              这种定位清楚显示出公司从早期 Iterative Scopes 身份向外扩张；早期叙事强调精准胃肠病学、计算机视觉和 SKOUT 等产品。当前模式把医疗服务机构和研究中心接入集中化运营、申办方资源和 AI
              驱动的流程工具。落到实践里，Iterative 向申办方和 CRO 出售的是速度、启动可靠性和招募表现；给医疗服务集团的则是研究基础设施、人员支持和患者识别工具。


              SKOUT 仍然重要，因为它证明公司保留了真实的商业化器械足迹，而不是只做服务中介。但 2026
              年的核心投资叙事更宽：已成规模的研究网络、自有流程技术，以及医疗服务中心和申办方需求之间更紧的连接。后续章节应把这一组合视为公司的真实业务模型。
