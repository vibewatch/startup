    rows:
      - - 收入 / ARR 及按收入流拆分
        - 无法区分软件式复现经济与项目或服务收入
        - 仅有运营规模指标：站点、伙伴、激活和入组
        - 低
        - 要求提供按收入流拆分的月度或季度收入桥，并说明 Series B 以来的历史结构演变。
      - - 毛利率和直接成本结构
