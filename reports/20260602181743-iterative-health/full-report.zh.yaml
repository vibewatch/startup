      - number: '3.4'
        title: 护城河耐久性与反向竞争风险
        blocks:
          - type: paragraph
            body: >-
              Iterative 最好的公开竞争故事，不是它拥有单个最好的 CADe 产品，也不是它拥有单个最大的试验网络；而是它似乎把两种通常分开的能力拼在一起：能帮助 GI 流程的 AI
              工具，以及能帮助申办方更快招募和启动研究的嵌入式社区研究中心运营。这个混合定位真实存在，也足够重要，而且在本章审阅的公开集合中并不常见。


              但这条护城河的耐久性仍有条件。AI 一侧，Olympus 和 Fujifilm 可以把更多智能装进已安装的内镜生态，从而加深渠道锁定；Medtronic
              可以用模块化分销，在买方想要更轻插件的任何地方竞争。试验一侧，IQVIA 和 ICON 可以在申办方覆盖和地域触达上用规模压过 Iterative；Alimentiv 则能挑战「只有 Iterative 提供
              GI 专项深度」这一说法。GI Alliance 和 One GI 等医疗服务网络还提醒投资人，研究中心供给是谈判来的，不是拥有的。


              反向证据基础让这种风险更尖锐，而不是消除它。AGA 仍没有对 CADe 辅助结肠镜给出支持或反对推荐，试点文献仍显示额外的非肿瘤性息肉检出，公开材料仍未披露 SKOUT
              装机份额、相对具名对手的申办方胜率，或任一业务的实际定价。投资结论因此更有层次：整合模式不同，但公开证明尚不足以强到可以无视现任者反击或商品化。
