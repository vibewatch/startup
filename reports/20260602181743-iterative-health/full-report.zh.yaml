  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与需求基础
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 暴露在两个临床上重叠、但买方完全不同的市场里。一个是 AI 辅助结肠镜质量工具：SKOUT 这类软件进入内镜室，在质量门槛不断抬高的背景下尝试提升病变检出。另一个是
              GI/社区临床试验研究中心网络服务：主要卖给需要更快启动、更好招募和触达社区患者人群的申办方与 CRO 的运营基础设施。若把两者并成一个
              TAM，会掩盖一个事实：前者像医疗服务机构运营或技术预算，后者则是外包试验执行支出。


              质量工具市场的纳入支出范围很窄。它覆盖病变检测软件、部署/支持，以及在筛查或监测性结肠镜中的质量流程适配；不包括更宽的 CRC
              筛查宇宙，后者现在还包括血液检测和居家粪便检测；也不包括不改变检测表现的通用内镜软件。研究中心网络市场的纳入支出同样具体：研究中心启动、合同、培训、患者识别支持，以及申办方接入高表现社区 GI
              研究中心。不包括完整 CRO 技术栈，也不包括每一项 GI 研究支出。


              需求真实但不均匀。ACS 称，美国仍有 20M+ 符合条件的人没有按时完成 CRC 筛查；Medicare 政策也仍会把粪便或血液检测阳性者导向后续结肠镜。但新近扩龄的 45-49 岁人群远未饱和：2023
              年只有 33.7% 按时完成筛查，采用集中在保险和教育水平更高的成年人。因而，Iterative
              面向结肠镜的市场锚定在巨大的预防缺口上，但采用仍取决于可及性、外展触达，以及直接可视化筛查相对非侵入式替代方案是否仍具吸引力。
