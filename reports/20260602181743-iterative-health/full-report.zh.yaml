        - 低
        - 要求按收入流拆分毛利率、直接人工和站点支持成本
      - - 现金、烧钱速度、现金跑道和债务
        - 无法判断资本充足性或下一轮时间点
        - Series C 金额及二手融资区间
        - 低
        - 要求提供当前现金、季度经营现金流、债务 / 租赁到期表和基准情景现金跑道
      - - 合同定价和收入确认条款
        - 无法判断收入是类似待交付订单、基于里程碑、或有，还是大量转付
        - 医疗机构伙伴关系和申办方服务仅作定性描述
        - 低
        - 要求提供样本合同经济、付款节奏、取消条款，以及待交付订单 / 递延收入披露
      - - 申办方留存、集中度和待交付订单
        - 无法衡量需求质量或未来收入可见性
        - 仅 >40 个伙伴
        - 低
