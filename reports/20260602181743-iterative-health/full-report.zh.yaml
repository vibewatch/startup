        - 最终可能需要结肠镜的适龄成年人，包括粪便或血液筛查阳性后的随访结肠镜
        - 非内镜 CRC 筛查供应商、肿瘤治疗支出及无关 GI 诊疗
        - 患者、支付方、医疗系统
        - 不筛查，或只做非侵入式检测
        - 任何结肠镜质量产品的外层需求
      - - AI 辅助结肠镜质量工具
        - 实时病灶检测软件、部署、支持，以及筛查或监测结肠镜的检查室工作流适配
        - 通用 EHR / 报告软件、非视觉筛查检测，或宽泛 GI IT 预算
        - GI 诊所、ASC、医院或 VA 付费；内镜医生使用
        - 手工质量改进、第二观察者，或不用 AI
