      - number: '5.2'
        title: 架构、集成与运营模式
        blocks:
          - type: paragraph
            body: >-
              SKOUT 的技术架构比其余技术栈有更具体的文档。FDA 许可和 GUDID 记录描述了一个实时软件层：它通过 SDI
              接收内镜视频，在结肠镜过程中分析视频流，并在检测到潜在结直肠息肉时叠加蓝色矩形框。同一批来源还显示，产品设计直接适配检查流程，而不是迫使用户进入单独审阅环境：用户可以在旁路内镜视频流和 SKOUT
              视频流之间切换；当工具进入视野或照明不足时，系统会暂停检测。兼容性目前受特定处理器生态限制，尤其是 Olympus EVIS EXERA II/III 和 Fujifilm Eluxeo VP-7000
              输出，这让集成质量和已安装设备组合成为直接采用依赖。


              更宽的运营架构更偏服务。Iterative 的研究中心网络论文把启动、预算、预筛、培训和监管文件描述为它试图集中化或支持的运营瓶颈。IBD 终点工具则叠在这套流程之上：AI
              驱动的内镜和组织学分析增加了结构化疾病评估输出；BMJ 描述的 2M+1H 框架则把两个独立 ML
              模型和一名胃肠病学专家裁决者放进中央阅片，而不是直接替代人工审阅。同一套架构也让分销和文档合作变得重要。Iterative 的 FDA 许可公告把 SKOUT 商业化与 Provation 绑定，后者的 GI
              流程足迹可以降低进入市场摩擦。简单说，Iterative 的技术护城河不是单个模型，而是器械集成、运营赋能、人工监督，以及横跨研究中心和内镜室的流程邻接组合。
