  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、变现触点与定价不透明
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 的公开材料支持一个多触点变现模式，但无法审计其公开收入结构。公司现在销售的是面向申办方和研究中心的研究基础设施主张：集中接入不断扩大的社区研究中心网络，提供运营支持、试验管理和
              AI 驱动的流程工具。GI Alliance、One GI 和 US Heart & Vascular 都把 Iterative
              描述成不止是软件供应商。每个案例里，公司贡献的是试验管理能力、运营骨干、研究中心赋能和申办方接入，而不仅是仪表盘或算法。这使得申办方/CRO 服务和医疗服务网络运营合作，成为最清楚可观察的收入流。


              SKOUT 增加了第二个商业化触点。它证明 Iterative 仍有一个可销售给 GI
              诊所和内镜场景的真实受监管产品，但公开记录没有显示标价、报销表或装机基础经济性。服务侧也同样不透明：没有费率表，没有披露合同条款，也没有说明收入在申办方预算、医疗服务合作和器械销售之间如何拆分。因此，最强结论是方向性的，而不是数字性的。Iterative
              几乎肯定横跨申办方服务、医疗服务网络经济性、AI 驱动流程和 SKOUT 变现，但公司没有披露区分软件式经常性收入与项目制或服务驱动收入所需的定价架构。
