        - ~1.2x-1.9x MOIC，未计优先权影响
        - 需要证明经济性已接近优质 AI / 数据资产
      - - 基准
        - 收入大约达到 $160M-$220M；公司表现为强 CRO / 数据混合体
        - 5x-7x 混合区间
        - $0.9B-$1.5B
        - ~0.7x-1.1x MOIC（回报倍数）
        - 与当前公开证据最一致
      - - 悲观
        - 收入大约停在 $110M-$170M；报销拖累或执行失手导致估值压缩
        - 3x-4.5x CRO / 重估区间
        - $0.4B-$0.9B
        - ~0.3x-0.7x MOIC（回报倍数）
        - 如果眼下增长好看、后续变现跟不上，就会触发
    notes: 情景测算基于假设，因为当前收入和利润率未披露；MOIC 仅作示意，不包括精确稀释 / 优先权影响。
