      - number: '5.3'
        title: 信任、证据与竞争背景
        blocks:
          - type: paragraph
            body: >-
              Iterative 的信任故事起点不是纯 AI 新颖性，而是监管和流程护栏。SKOUT 现在拥有作为 II 类胃肠道病变软件检测系统的 510(k) 许可，并在 AccessGUDID
              中列为已商业分销。器械标签明确写明它辅助而非替代受训胃肠病学专家，用户界面也包含状态信号；当工具进入视野时，系统进入暂停检测状态。这些控制很重要，因为它们把 SKOUT
              定位为受监管检查中的增强层，而不是自主诊断决策者。公开指引方向上支持：Yale 对 AGA 指南草案的总结称，CADe 在成人结肠镜中获得有条件推荐，且不会实质增加检查时间，这大体支撑了 SKOUT
              所在品类的采用逻辑。


              尽管如此，证据基础仍有细节。Iterative 官方材料和合作伙伴简报强调了强疗效信号，例如检查时间不增加、每 4.5 名患者多切除一个腺瘤，以及在无蒂或中等大小病变上表现更好；更早的 SKOUT 研究和更宽的
              CADe 文献也支持更高 ADR/APC。但文献同样警告假阳性、自动化偏见、操作者技能退化、泛化能力和长期结果。Medtronic、Olympus 和 Fujifilm 的竞争材料显示，实时 AI
              检测、无蒂病变强调和流程保持主张已经不再是 Iterative 独有。因此，对 Iterative 技术栈的信任，不只取决于品类层面的 AI 疗效，还取决于其分销、集成、研究中心运营和
              human-in-the-loop 试验流程组合，能否扛住其他 CADe 供应商和运营替代方案的竞争。
