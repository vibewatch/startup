          - type: paragraph
            body: >-
              两块业务的买方地图分得很清楚。对 CADe 来说，日常用户是内镜医生，但经济讨论通常经过执业机构管理者、内镜医学主任、医院服务线负责人，或 VA
              与卫生系统质量负责人。付款方通常是医疗服务机构本身。已审阅的支付来源没有显示 AI 辅助结肠镜有专门 Medicare
              报销，因此预算负责人必须靠质量提升、竞争差异化、培训支持或流程效率来证明支出合理。Olympus 的云采购叙事和 Yale
              的一键式实施描述都说明，供应商知道这个市场必须适配现有检查室经济性，而不能等新的支付代码。


              对研究中心网络业务来说，经济买方更明显在申办方一侧。Iterative 自有材料和 Clinical Trials Arena 都描述，申办方和 CRO 可以集中接入表现更高、更具多样性的社区研究中心。GI
              Alliance 等医疗服务机构很重要，因为它们提供研究者、协调员和患者关系，但核心支出更接近外包试验执行，而不是内镜报销。社区诊所也得到共同收益：研究可以嵌入普通 GI
              护理，让医生和患者获得接入机会，而不必把所有人都拉回学术中心流程。


              这种分裂对估值很重要。结肠镜工具业务受医疗服务机构预算和房间级 ROI
              约束。研究中心网络业务受申办方需求、研究中心表现，以及让社区诊所在多项研究中持续保持启动状态的能力约束。把它们称作一个市场，会错过它们经由不同采购动作、由不同付款方买单的事实。
