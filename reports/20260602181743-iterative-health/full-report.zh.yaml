      - number: '7.4'
        title: 财务 / 模型风险、缓释因素和投资逻辑破裂触发项
        blocks:
          - type: paragraph
            body: >-
              财务模型风险高，主要因为运营故事远比经济性更可见。公开材料支持网络规模、伙伴数量和表现指标，第三方报道也暗示 Series C 后资本充足。但仍没有公开收入结构、毛利率、烧钱速度、续约率、头部账户集中度或
              SKOUT 装机基础披露。这让投资人只能在直接可见度有限的情况下，承保一个复杂的服务加 AI 模型，并判断价值主要流向赞助方服务、医疗服务方网络运营、SKOUT
              销售，还是若干部分的组合。据报道的估值背景只会让这个问题更尖锐：一家公司可以资金充足，但如果关键变现杠杆不透明，经济性仍难承保。


              因此，实际投资问题不是 Iterative
              有没有风险——每家临床基础设施公司都有——而是这些风险能否监控，以及现有缓释是否足够强，足以支撑剩余风险暴露。最好的缓释因素很具体：真实伙伴网络、表现能在更大规模下保持的证据、更宽的高管梯队，以及至少基线的隐私
              / 合规基础设施。主要投资逻辑破裂触发项同样具体：运营指标回落到行业常态、主要医疗服务方生态停滞或流失，或 AI 报销和客户经济性始终无法支撑持久定价。如果其中任何一项发生，今天让 Iterative
              有吸引力的同一批特征——一体化模型和对伙伴网络的依赖——会把风险迅速传导到增长、毛利率和估值上。
