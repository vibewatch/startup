      - number: '5.4'
        title: 路线图、成熟度与关键依赖
        blocks:
          - type: paragraph
            body: >-
              公开路线图主要通过里程碑证据显现，而不是通过前瞻产品计划显现。器械一侧，Iterative 从早期 SKOUT 疗效数据，推进到其价值分析材料引用的更大随机研究，再到 2025 年 FDA
              许可和商业分销状态。试验技术一侧，2025-2026 年的发布节奏很重要：研究中心网络论文和 DDW 2026 更新强调了规模化运营表现；溃疡性结肠炎内镜加组织学工作显示 Iterative
              正从程序辅助扩展到终点分析；BMJ 中央阅片论文则展示了一个更具监管意识、用于高风险试验评分的人工加模型框架。这些都是有意义的成熟度信号，因为它们指向的路线图，是沿 GI 研究流程扩张，而不仅是给 SKOUT
              添加功能。


              主要依赖同样清楚。SKOUT 采用取决于兼容处理器足迹和 Provation
              帮助下的商业触达。研究中心网络论点取决于社区研究中心持续采用、申办方愿意把研究导向以研究中心为核心的模式，以及有足够训练有素的运营人员来管理启动、预筛和激活。中央阅片和疾病评估工具依赖经过整理的视频与组织学数据、可维护的模型表现，以及专家人工裁决者的接入。最后，公开记录仍留下若干业务关键空白：没有披露装机基础，没有公开定价，没有详尽互操作矩阵，也没有针对器械或
              IBD 工具链的详细前瞻发布计划。因此，虽然 Iterative 的产品成熟度强于单功能初创公司，但在投资人以充分信心承销技术规模化之前，仍有重要披露缺口需要补齐。
