  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户与付款方划分的客户分层
        blocks:
          - type: paragraph
            body: >-
              Iterative Health
              销售进入的是一个相互连接但并不相同的客户栈。医疗服务一侧，公司争取医生集团、管理服务组织、主要研究者和研究中心运营商，这些客户希望把临床研究搭建或扩展为有利润的辅助服务。申办方一侧，Iterative
              直接面向申办方、CRO 和生物技术公司销售，解决更快启动、招募预测和表现可管理的研究中心网络需求。围绕 SKOUT 还有第三类更不透明的买方：正在评估 AI 辅助结肠镜设备的 GI
              内镜医生和医疗服务机构。公开证明在前两层最强，在第三层弱得多。


              这种分层很重要，因为 Iterative
              卖的不只是软件席位。它卖的是运营杠杆、患者识别，以及能够稳定执行的研究中心接入。医疗服务机构侧的主张强调集中化业务运营、人员配置、监管帮助、培训和申办方接入；申办方侧的主张强调高表现研究中心和加速试验执行。公司现在把网络呈现为多专科，而不是仅限
              GI，覆盖 GI、肝病学、肥胖和心脏病学，并拥有 100+ 个研究中心和 40+ 个申办方/CRO/器械合作伙伴。但具名客户证据仍集中在 GI Alliance、One GI、US Heart &
              Vascular、Gastro Health 等大型美国医疗服务网络，以及与 Gastro One 的研究中心级案例；申办方侧具名证明大多限于 Takeda 和汇总数量。
