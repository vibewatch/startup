  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 公开证据依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 公司质量看起来真实，但价格已是后期阶段，经济性仍不透明
        - 不要仅凭公开资料为入场定价
      - - 信心
        - 中
        - 融资和运营证据能较好互相印证；收入和利润率不能
        - 用尽调验证或推翻投资假设，不是微调它
      - - 风险评级
        - 高
        - 执行、报销、伙伴集中度和财务不透明风险同时存在
        - 如果尽调不达预期，先假设下行空间不小
      - - 估值立场
        - 偏高
        - 当前估值只有在高溢价执行情形下才显得合理
        - 宁可平价或更低入场，不为新一轮加价买单
      - - 入场纪律
        - 没有数据室，就不支付新溢价
        - 公开证据不足以支撑高于据称 $1.3B-$1.4B 区间的价格
        - 任何 IC 建议上调前，要求完整 KPI 包和条款
      - - 上调条件
        - 收入、利润率和条款必须越过溢价区间门槛
        - 需要证明经济性更接近 AI/data 溢价，而不是 CRO 底线
        - 只有披露指标支撑价格，才转为跟踪 / 买入
    notes: 判断仅反映公开证据，且有意对价格敏感，而不是泛化的公司质量评分。
