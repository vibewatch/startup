      - number: '1.3'
        title: 融资历史、规模信号与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              公开披露的融资历史足以证明这是一家可信的后期公司，尽管精确估值和股权结构表细节仍有部分不透明。Iterative 在更早的 $13.5M 种子轮之后，于 2021 年完成 $30M Series A；2022 年
              1 月又完成由 Insight Partners 和 Clearlake 共同领投的 $150M Series B。2026 年 Series C 再增 $77M，由 Intrepid Growth
              Partners 和 GV 领投，EDBI 作为新投资人进入，Insight 和 Obvious Ventures 再次参与。这条融资序列支撑了一个持久的机构投资人联盟，也说明公司成功把自己从 AI 驱动的 GI
              初创公司，重新定位为更宽的临床研究平台。


              2025-2026 年，规模主张也更强。官方新闻稿现在描述的是横跨多个大陆的 100+ 个研究中心、40+ 个药企/生物技术/医疗器械/CRO 合作伙伴，以及约 250
              人组织。这些都是有意义的信号，因为业务模型依赖的是运营密度和可重复性，而不只是算法新颖性。GI Alliance、One GI、US Heart & Vascular，以及 NextStage
              心脏病学研究中心收购，说明医疗服务网络合作伙伴如今与财务投资人同样具有战略意义。


              关键但书在于披露质量。TechCrunch、Forge、AI2.work 和 Tracxn 都暗示累计融资约 $270M，最新估值约在 $1.3B-$1.4B 区间，但这些数字仍是二手估计，因为公司没有公开披露
              Series C 估值。第三方追踪平台给出的员工数也不一致。因此，投资人可以承认其动能和投资人联盟质量，但还无法精确判断经济性或所有权结构。
