  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Iterative 方案
      - 可衡量收益
      - 局限
    rows:
      - - 在筛查或监测结肠镜检查中检测息肉
        - 人工实时查看标准内镜视频
        - SKOUT 在实时检查中叠加疑似息肉标记，并支持旁路 / SKOUT 画面切换
        - 官方材料称，检查时间不会增加，病灶检出更强
        - 公开资料只列明受支持的处理器环境
      - - 启动新的 IBD 试验中心
        - 手工推进合同、培训、预算和文档流程
        - Iterative 的研究中心网络运营把启动工作流集中起来并提供支持
        - 已发表的网络分析显示，从中心筛选到启动的中位时间为 74 天
        - 该运营层背后的具体软件工具没有单独说明
      - - 更快筛选并随机化试验患者
        - 研究中心手工预筛，还要争夺有限的合格患者
        - 网络模式叠加运营支持，缩短首例筛选和首例随机化时间
        - 引用分析显示，首例患者筛选用时 45 天，首例患者随机化用时 83 天
        - 已发表材料证明其跑赢基准，但客户层面的可重复性未披露
      - - 为溃疡性结肠炎内镜终点评分
        - 人工中央阅片采用 2+1 范式，材料差异较大
        - Iterative 在 2M+1H 混合框架中贡献一个模型
        - BMJ 摘要显示，每段视频所需人工阅片减少 81%，一致性仍不劣
        - 仍依赖独立模型和医生裁定
      - - 连接内镜与组织学，用于疾病评估
        - 肉眼炎症和显微炎症通常分开审阅
        - AI 驱动的内镜和组织学分析能暴露细微炎症模式
        - 常规相关性较弱时，可帮助解读轻中度 UC
        - 商业部署细节和客户背书未公开
      - - 为申办方做网络表现基准
        - 申办方团队需要在碎片化 CRO / 研究中心数据中比较中心表现
        - Iterative 发布其研究中心网络的启动和随机化基准
        - DDW 2026 更新称，在规模大约翻倍后，>3x 随机化优势仍在
        - 没有公开客户仪表盘截图，也没有 API / 导出细节
    notes: 收益和限制结合了官方出版物，以及可获得的独立佐证；流程细节留空通常反映实现方式未披露，而不是能力缺失。
