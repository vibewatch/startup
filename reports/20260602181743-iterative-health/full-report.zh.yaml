      - number: '3.2'
        title: GI 与 IBD 试验网络对手
        blocks:
          - type: paragraph
            body: >-
              在面向申办方的一侧，Iterative 遇到的竞争者比检查室 AI 里大得多。IQVIA 和 ICON 都在全球研究中心网络和患者触达基础设施之上，销售 GI 或 IBD 专项开发能力。Alimentiv
              从相反方向切入：它比全球 CRO 窄，但把自己定位为深度专精 GI 的运营商，拥有内镜、组织学和 IBD 流程厚度。当买方更看重申办方覆盖、地域触达或成熟外包关系，而不是 Iterative 的 GI
              优先运营叙事时，这三类对手都能与 Iterative 对卖。


              规模差距是公开的。IQVIA 宣称在 100 个国家拥有 1,100+ 个高表现研究中心，并声称在外包 II 期和 III 期 IBD 工作中占有超额份额。ICON 宣传过去五年有 114+ 项 GI 研究，加上
              Accellacare 网络覆盖 8.1M 患者、50+ 个研究中心和更快研究中心启动指标。Alimentiv 宣称在 60+ 个国家拥有 5,000+ 个研究中心关系，并称其支持了 70%+ 在研 IBD
              化合物。Iterative 自有材料显示出有意义的动能，但公开的申办方触达规模仍小于这些现任者网络。


              医疗服务机构控制的研究中心供给是另一股竞争压力。GI Alliance 和 One GI 今天是合作伙伴，在狭义上不是对手；但它们披露的网络说明大型 GI
              集团为何具有战略意义：它们控制研究者、协调员、患者流和本地试验接入。如果这些关系不能长期排他，同一个让 Iterative 差异化的资产，也可能遭到争夺、让医疗服务集团内部化，或流向另一个 CRO 或运营商。
