      - number: '8.3'
        title: 乐观、基准和悲观情景区间
        blocks:
          - type: paragraph
            body: >-
              这里的所有情景工作都明确基于假设，因为当前收入和利润率未披露。乐观情景假设 Iterative 把网络证据转化为多专科收入，表现继续显著高于基准，并获得上沿 AI / 数据倍数。在这条路径下，约 $1.8
              billion 到 $2.6 billion 的退出有可能实现；但即便如此，从 $1.3 billion 到 $1.4 billion
              起始标记出发，也不会形成经典后期风险投资回报。基准情景更保守：Iterative 作为强 CRO / 数据混合体扩张，收入落在约 $160 million 到 $220 million，并以 5x-7x
              倍数退出，价值约 $0.9 billion 到 $1.5 billion。


              悲观情景重要，因为今天的私有市场环境比 2021 年更不宽容。如果报销摩擦、伙伴集中或执行滑坡把 Iterative 推向类 CRO 经济性，标记可能压缩到约 $0.4 billion 到 $0.9
              billion。这一下行不是遥远幻想；PitchBook 和 Finro
              都描述了一个市场：当变现单薄或陈旧标记终于被检验时，公司会被重新定价。因此，概率加权图景更接近“基本已经定价”，而不是“明显便宜”，这也是本章落在继续研究和偏高，而不是合理和买入的原因。
