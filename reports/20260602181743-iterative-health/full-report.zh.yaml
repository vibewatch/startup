      - number: '7.5'
        title: 图表与表格
        blocks:
          - type: callout
            title: 主要风险不是 Iterative 缺少证据，而是这些证据必须经受住规模化和集中度考验
            body: Iterative 的公开运营证据优于许多医疗科技初创公司，尤其体现在启动和随机化上。问题在于，证据集中于少数伙伴生态，而且模型天然依赖劳动力和流程。如果网络拓宽时表现下滑，下行会迅速传导到定价、续约和估值。
            calloutType: risk
            claimRefs:
              - CR002
              - CR021
              - CR030
              - CR039
              - CR041
          - type: callout
            title: SKOUT 面对的是真实品类，不是空旷市场
            body: >-
              器械故事有战略价值，但商业披露不足。与此同时，Medtronic 和 Olympus 对工作流契合、培训和集成都讲得很明确。这意味着 Iterative 不仅要证明 SKOUT
              有效，还要证明它能对抗更大的器械生态并持续嵌入。
            calloutType: risk
            claimRefs:
              - CR009
              - CR012
              - CR025
              - CR026
              - CR038
          - type: callout
            title: 财务风险更多来自不透明，而非显而易见的资金不足
            body: 公开来源显示 Iterative 资金充足，但没有解释支撑这套资本基础的收入结构、毛利结构或集中度画像。因此，投资人是在可见运营动能之上承保一个溢价估值，却没有同等披露来支撑经济耐久性。
            calloutType: insight
            claimRefs:
              - CR032
              - CR034
              - CR042
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑和建议判断
        blocks:
          - type: paragraph
            body: >-
              Iterative Health 已经值得认真讨论估值，因为其运营证据优于平均 AI 医疗初创公司。官方材料显示，研究网络超过 100 个站点，赞助方和 CRO 关系超过 40 家，并反复声称启动速度比行业基准快
              2x、入组表现高 3x。DDW 2026 更新尤其重要，因为它暗示这一逻辑在更大规模下仍成立，而不只是存在于试点队列内。上述组合支撑正面情景：Iterative
              似乎已经建成一个有差异化、以站点为中心的临床研究网络，具备真实工作流和赞助方相关性，而不只是一个狭窄的内镜算法故事。


              反向逻辑在于，公开记录给上行定价很激进，却没有同样解释经济性。第三方来源集中在 $1.3 billion 到 $1.4 billion
              标记附近，但公司在最新融资或表现更新中没有披露收入、ARR、毛利率或留存。因此，公开证据更能支持公司质量，而不是支持精确承保。在当下市场，这一区别很重要：AI
              和数据资产仍有溢价倍数，但前提是收入质量、耐久性和变现清晰度可见。因为 Iterative 的价格只有在强执行情景下才显得合理，而在更接近 CRO
              的情景下显得偏高，最能被公开证据支撑的建议是继续研究，置信度中等，风险高，估值立场偏高。
