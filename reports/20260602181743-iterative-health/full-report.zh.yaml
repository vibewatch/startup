      - number: '2.2'
        title: 受证据约束的测算口径
        blocks:
          - type: paragraph
            body: >-
              公开记录能支撑市场重要性，但无法给 Iterative 两块暴露市场中的任一块算出清晰的美元 TAM。对结肠镜 AI 来说，最有用的外层口径不是收入，而是质量压力如何作用于一个筛查仍不足的人群。2024 年
              ACG/ASGE 更新把 ADR 衡量范围扩大到几乎所有 45 岁及以上成人的筛查、监测和诊断性结肠镜，并把整体基准抬到 35%，另设 6% 的 SSLDR
              目标。这显著提高了承诺让检测更稳定的工具的适用性。Yale 的证据摘要和 Olympus 的 EAGLE 试验，都支持 CADe 能在不明显增加时间成本的情况下提升腺瘤检出的核心主张。


              但买方仍必须围绕不确定性下判断。同一组文献认为，晚期肿瘤改善更小，长期间期癌和真实世界成本效益证据仍有限，CADe
              商业化推进速度可以说快于上市后共识。因此，检查室业务更合适的测算口径是一个受约束的楔子：只有一部分结肠镜项目会因质量压力足够强，即便报销模糊也愿意购买。


              对研究中心网络业务来说，最强的公开口径是申办方痛点，而不是市场研究 TAM。Iterative 的 IBD 数据显示，启动时间为 74 天，而基准为 122-171 天；每个研究中心每月 0.34
              名患者，而基准生产率约 0.10；在更大 DDW 2026 规模下也有相近的 0.33-0.32 表现。这些都是有意义的服务市场指标，但它们不是可发布的
              SAM/SOM，因为公开记录缺少定价、签约量、积压订单和研究中心层面的收入。
