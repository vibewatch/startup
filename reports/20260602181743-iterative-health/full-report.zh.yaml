  - id: TV005
    title: 投资逻辑破裂与叫停触发器
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经济性不达标
        - 当前收入 / 毛利率显著低于 $1.3B-$1.4B 所需水平
        - 当前估值不再像优质执行，开始像定价过高
        - 叫停，或要求入场价大幅下调
      - - 业绩回落
        - 网络 KPI 在激活、入组或随机化上回落到基准附近
        - 核心运营差异化削弱
        - 立即下调乐观 / 基准假设
      - - 报销无法变现
        - AI / 内镜经济性仍被打包收费，或不能报销，且缺少清晰定价权
        - SKOUT 式上行仍只是可选性，不是现金流
        - 从模型中剔除软件溢价假设
      - - 扩张失手
        - 心脏病学 / 肥胖症无法转化为已预订收入或复购申办方
        - 多专科可选性消失
        - 基准情景回到仅 GI、低倍数结果
      - - 股权结构拖累
        - 优先股堆叠或附函条款让新资金显著处于劣后位置
        - 即使企业价值不变，回报曲线也恶化
        - 暂停，直到条款重谈或价格重置
    notes: 触发器聚焦会迫使立即重写情景的具体事件，而不是泛泛的业务风险。
    claimRefs:
      - CV015
      - CV035
      - CV039
      - CV041
      - CV045
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入桥
        - 按申办方服务、站点网络费用和 SKOUT / 设备收入拆分的 2025 年审计收入与 2026 YTD
        - 决定当前估值是收入的 6x、10x，还是 14x+
        - CFO 资料室 / 月度 KPI 包
      - - 利润率质量
        - 毛利率、按服务线拆分的贡献利润率，以及现金消耗 / 现金跑道
        - 区分可扩展平台经济性和人力密集执行
        - 财务尽调 + 董事会材料
      - - 留存 / 集中度
        - 前 10 大申办方收入占比、合作伙伴集中度、队列续约和流失
        - 检验网络投资逻辑的持续性和下行风险
        - 客户分析 + 合同审阅
      - - 股权结构表 / 优先权
        - 当前公司章程、清算优先序列、股息、按比例认购权和附函
        - 把企业价值情景转成投资人回报情景时必需
        - 法律尽调 + 资料室
      - - 多专科变现
        - 心脏病学和肥胖症管线、预订、激活速度和贡献利润率
        - 乐观情景需要 GI 之外的真实收入
        - 商业尽调 + 专科运营审查
      - - SKOUT 变现
        - 装机基础、定价、报销假设，以及与研究关系的附着率
        - 缺少这组证据，AI 上行仍主要是叙事
        - 商业 / 报销工作流
    notes: 要求按其改变估值信心和价格纪律的直接程度排序。
    claimRefs:
      - CV044
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 公开里程碑显示，公司正从 GI AI 产品公司转向多专科临床研究基础设施。
    data:
      items:
        - date: '2017'
          label: 以 Iterative Scopes 创立
          details: Jonathan Ng 从 MIT 孵化出公司，早期围绕 GI AI 和精准医疗。
          tone: positive
          claimRefs:
            - CO001
            - CO007
        - date: 2021-08
          label: A 轮 $30M
          details: 种子轮之后拿到大额首轮机构融资，并引入战略医疗投资人。
          tone: positive
          claimRefs:
            - CO021
            - CO023
        - date: 2022-01
          label: B 轮 $150M
          details: Insight 和 Clearlake 共同领投增长轮；Lonne Jaffe 加入董事会。
          tone: positive
          claimRefs:
            - CO019
            - CO022
        - date: 2022-04
          label: 收购 CRSG / Precision
          details: 补上临床试验运营深度，并让 Chris Fourment 加入管理层。
          tone: positive
          claimRefs:
            - CO024
        - date: 2022-09
          label: SKOUT 获 FDA 许可
          details: 公司为其 AI 息肉检测设备拿到监管验证点。
          tone: positive
          claimRefs:
            - CO025
            - CO027
        - date: '2025'
          label: CADe 类别风险仍在
          details: 独立综述指出，CADe 工具存在误报、自动化偏差和泛化限制，SKOUT 类系统也在其中。
          tone: negative
          claimRefs:
            - CO040
            - CO041
