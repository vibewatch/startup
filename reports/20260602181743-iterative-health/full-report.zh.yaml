      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Iterative 的扩张逻辑清晰：在现有医疗服务网络内增加站点，把同一网络模型从 GI 推向肥胖和心脏病学，随着试验表现数据累积深化赞助方关系，并可能把 AIR、疾病评估工作流等 AI
              工具与站点运营一起交叉销售。2026 年与 US Heart & Vascular 一起进入心脏病学，以及 Series C
              信息中围绕肥胖和更广多专科增长的表述，都支持这一判断。如果公司在进入相邻治疗领域时仍能守住启动和入组优势，现有赞助方就可能有理由把更多试验工作集中到该网络内。


              风险在于，公开证据集中在少数大型伙伴生态中，而且仍高度依赖伙伴撰写的公告。GI Alliance、One GI、US Heart & Vascular、Gastro Health 和 Gastro One
              主导具名医疗服务方记录；赞助方侧具名稀少；SKOUT
              安装情况不透明。这留下了几个未回答的问题：头部账户收入集中度、赞助方续约频率，以及医疗服务集团是独家合作，还是只是几条并行研究渠道之一。采购摩擦也是实际风险，因为 Iterative
              的价值主张依赖人员配置、监管工作、预算和病历审阅支持；如果站点或赞助方把这些能力内化，可能会更强硬压价，或把工作拆给多个供应商。器械侧竞争会放大这个问题：Medtronic 的 GI Genius
              公开营销强检测主张，所以 SKOUT 采用很可能取决于工作流契合和网络关系，而不是一个无人竞争的产品品类。
