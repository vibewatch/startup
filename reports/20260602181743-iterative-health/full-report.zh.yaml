  - id: FM001
    title: 双市场规模金字塔
    type: pyramid
    layout: wide
    summary: 可防守的市场视角从宽泛的 CRC 筛查需求，收窄到更小的质量工具切口，以及另一个由申办方付费的站点网络服务切口。
    data:
      items:
        - label: 外层：CRC 筛查需求
          value: '>20M adults not up to date; screening begins at age 45'
          note: 预防缺口很大，即使无创检测扩张，结肠镜需求仍有战略价值。
        - label: 质量压力层：新基准下的结肠镜项目
          value: ADR-A 35% overall / 40% men / 30% women; SSLDR 6%
          note: 质量要求提升，让检测和测量工具更容易进入商业预算。
        - label: 可部署 CADe 切口
          value: FDA-cleared tools with 7.3-point ADR lift but unsettled reimbursement and ROI
          note: 可触达部分小于完整筛查市场，因为买方仍需要预算和工作流理由。
        - label: Iterative 当前切口
          value: SKOUT plus >100-site / 40+ partner GI-led site network
          note: 公司同时覆盖手术室质量工具和面向申办方的研究服务，而不是只卖进一个简单类别。
    approximationNotes: 各层使用混合运营单位，而不是可相加的美元口径，因为公开记录不足以把两类市场暴露统一到同一计量口径。
    claimRefs:
      - CM001
      - CM003
      - CM008
      - CM013
      - CM026
