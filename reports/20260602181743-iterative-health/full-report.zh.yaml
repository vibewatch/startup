      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Jonathan Ng 仍是核心战略人物。公开材料一直把他标为创始人/CEO；更早的 Iterative Scopes 融资史也把公司起点连到一个 MIT 孵化项目，该项目围绕 Ng
              的医生创业者履历，以及 MIT/Harvard 训练背景搭建。这让公司在医学、AI 和临床试验运营交叉处具备可信的创始人-市场匹配。


              2025 年底，领导层厚度明显提升。Bill Kayser 在 GI Alliance、Prospero Health 和 McKesson
              担任高级财务职位后加入，出任总裁兼首席财务官。这一点值得注意，因为他带来的不是纯软件财务经验，而是医生执业基础设施和医疗 M&A 运营经验。公开团队材料还显示 Dana Feuchtbaum 担任
              COO，Nadege Gunn 担任肝病学和肥胖首席医疗官，进一步强化公司在研究中心扩张和相邻治疗领域进入上的运营重心。


              治理可见度仍是局部而非完整。公开融资公告披露了与投资人有关的董事席位或观察员角色演进——包括 Series A 时的 Nan Li 和 Lotus Mallbris、Series B 时的 Lonne
              Jaffe，以及 Series C 时的 Ajay Agrawal 和 Anthony
              Philippakis——但没有给出完全对齐的当前董事会名单或所有权地图。因此，治理结论只能是方向性的：创始人主导，机构监督在增强，但完整控制权仍不透明。
