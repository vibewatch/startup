      - number: '6.3'
        title: 具名客户证据与证据质量
        blocks:
          - type: paragraph
            body: >-
              具名客户证据可信，但不均衡。医疗服务方一侧，GI Alliance、One GI、US Heart & Vascular、Gastro Health 和 Gastro One
              都出现在公开材料中，并附有高管引述、站点数、试验数或量化工作流结果。GI Alliance 和 One GI 给出最干净的平台级证据，因为公司和客户侧组织都描述了这段关系，也都量化了挂靠的站点规模。Gastro
              One 给出最丰富的单站点运营案例，包括更快启动、随机化，以及通过 Iterative 获得的入组占比。US Heart & Vascular 将逻辑从 GI 拓宽到心脏病学；Gastro Health
              则证明，Iterative 能先靠 AI 招募工具落地，再推进更广的网络铺开。


              赞助方侧证据明显更薄。Takeda 是公开材料中发现的唯一具名赞助方关系，即便如此，证据也围绕 AI 赋能的试验设计和疾病评估展开，而不是明确合同范围或重复研究量。公司披露的 40 多家赞助方 / CRO /
              器械伙伴数量有助于说明覆盖面，但不能替代具名部署、每个赞助方的研究数量或赞助方级留存数据。SKOUT
              作为客户业务的公开证据也弱。产品页面有匿名推荐和功效主张，但没有具名医疗系统或门诊手术中心部署参考。因此，本章的证据质量最好概括为：医疗服务方网络客户标识 强，试验表现结果好，赞助方具名有限，具名产品安装弱。
