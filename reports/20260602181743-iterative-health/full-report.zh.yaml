      - number: '4.3'
        title: 资本充足性、融资依赖与公开可比公司背景
        blocks:
          - type: paragraph
            body: >-
              Iterative 并不明显缺钱，但公开信息仍不透明。唯一硬的一手资本事实是 $77M Series C，管理层明确把这笔钱与进入心脏病学、肥胖、地域扩张和深化医疗服务网络合作绑定。二手来源对投后估值约
              $1.3B-$1.4B、累计融资约 $270M-$273M 的判断趋同，但这些数字仍是交叉推断，而非公司披露。官方来源仍未公布当前现金、烧钱速度、债务或现金跑道。


              这个缺口更重要，因为公司是在运营层面扩张，而不只是数字化扩张。研究中心收购、多专科搭建和服务较重的交付模式，通常会先消耗现金，然后投资人才能观察到有吸引力的利润率结构。公开 CRO
              可比公司展示了模式做大后的好状态。IQVIA、ICON 和 Medpace 都报告数十亿美元收入、明确流动性，以及利润率/积压订单数据；它们披露的经营利润率或 EBITDA
              利润率集中在低双位数到二十出头。但这些公开可比公司也说明，研究服务会计很复杂，存在营运资本波动；ICON 还出现过收入确认重述和重大缺陷。


              所以资本问题与其说是「Iterative 还能不能融资？」，不如说是「Iterative 是否已经搭出一台自我供血机器？」公开信息下，答案仍未知。
