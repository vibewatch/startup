      - CV050
      - CV051
      - CV052
  - id: TV002
    title: 正向假设 / 反向假设
    columns:
      - 主题
      - 正向假设
      - 反向假设
      - 什么会改变判断
    rows:
      - - 运营验证
        - 100+ 个站点、40+ 个合作伙伴、激活速度快 2x、入组 >3x，说明对申办方和站点有真实价值
        - 现有验证更多指向吞吐量，而非经济性；变现质量仍被遮住
        - 按申办方 / 站点队列披露收入，并给出规模化项目利润率
      - - 平台范围
        - 拓展到心脏病学和肥胖症，可能把网络价值拉出 GI 之外
        - 相较 GI，扩科仍处早期；收入兑现前，可能先拖慢执行
        - 证明多专科预订、留存和贡献利润率
      - - 融资质量
        - 投资人阵容强，估值较前轮上调，说明投资需求仍在
        - 公开股权结构细节不足；优先股堆叠和稀释会显著改写回报
        - 提供完整公司章程、投资人权利和股权结构堆叠
      - - 估值语境
        - 如果 Iterative 已接近优质 AI / 数据平台，$1.3B-$1.4B 可能合理
        - 如果经济性仍更像 CRO 服务，同一估值就显得偏高
        - 披露当前收入、毛利率、续约 / 留存
      - - 报销 / AI 经济性
        - AI 辅助工作流可能带来差异化，也给未来变现加杠杆
        - Medicare 路径仍未定，GI 支付压力会拖慢采用或削弱定价权
        - 披露装机基础、定价、报销假设和附着率
    notes: 各行只拆出最可能改变投资决策的少数变量，而不是复述完整报告。
