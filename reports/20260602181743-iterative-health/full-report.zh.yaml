  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 内镜 AI 对手与 OEM 渠道权力
        blocks:
          - type: paragraph
            body: >-
              在检查室里，Iterative 竞争的对象与其说是另一家小型 GI 软件初创公司，不如说是大型医疗技术现任者加上一家专注型纯玩家。Medtronic 将 GI Genius 定位为 AI
              辅助结肠镜模块；Olympus 则在更宽的 EVIS X1 生态内覆盖 CADDIE、OLYSENSE 和 ENDO-AID。Fujifilm 把 CAD EYE 放进自有处理器和内镜组合；Odin Vision
              仍是最接近的纯玩家云竞争者，产品为 CADDIE。这些产品解决的临床任务与 SKOUT 相同：在结肠镜过程中提供实时息肉检测支持。


              战略差异在于分销权力。Olympus 和 Fujifilm 可以把 AI 捆进已经存在于医院和 ASC 内部的品牌内镜设备路径、服务关系和升级周期。Medtronic 看起来更模块化，因为 GI Genius
              作为独立智能内镜模块销售，但它仍带着规模化商业组织和买方熟悉的器械采购动作。因此，即便临床定位可信，Iterative 进入检查室时的 OEM 杠杆也低于拥有装机基础的现任者。


              独立证据让这个品类保持吸引力，但并未尘埃落定。Yale 综述和 AGA 指南都支持 CADe
              提高腺瘤检出，但也保留了对晚期病变、长期癌症结局、成本效益和普遍采用的不确定性。这在竞争上很重要，因为它留下了一个持久的现状替代方案：标准结肠镜加传统质量改进。还没有相信长期结果提升的买方，仍可以完全推迟
              AI，或只在质量压力最急的地方试用。
