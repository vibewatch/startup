      - number: '3.3'
        title: 打包、定价不透明与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              公开商业打包比公开定价清楚得多。Iterative、Medtronic、Olympus、Fujifilm、IQVIA、ICON 和 Alimentiv
              展示的都是联系销售驱动的企业销售，而不是透明标价。落到实践里，买方评估这些方案靠的是设备捆绑、服务工作说明书、研究中心网络接入或定制企业合同，而不是公开的单次检查或单研究中心费率表。不透明本身就具有战略意义，因为它有利于拥有更重一线团队、也更有谈判打包空间的规模化卖方。


              替代集合也比常规单品类对比表更宽。GI 医疗服务机构可以从 Medtronic、Olympus 或 Fujifilm 购买 CADe 模块，而不买 Iterative 的研究中心网络服务。申办方可以从
              IQVIA、ICON 或 Alimentiv 购买 GI 或 IBD 试验执行，而不买 Iterative 的检查室 AI。买方也仍可以留在现状：内镜室不使用 AI，或由内部团队和通用 CRO
              流程支持碎片化的直接对接研究中心运营。


              这些替代方案让两块业务的多归属程度不均。试验服务更容易多归属，因为申办方本来就按方案、地域或职能拆分工作。内镜 AI
              一旦某个研究中心在硬件生态、流程和服务伙伴上标准化，多归属就更难。这种不对称解释了为什么硬件捆绑和医疗服务网络接入，比任何一张公开疗效图表都更关系护城河耐久性。
