      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最大的共同顺风因素很直接：CRC 筛查现在从 45 岁开始，美国仍有庞大未筛查人群，结肠镜质量基准更紧，申办方也仍极度需要更快、更可靠的招募。纸面上，这对 SKOUT 和研究中心网络平台都是强配置。社区 GI
              护理尤其重要，因为它集中了一批与慢性病患者的持续关系；这些患者同时影响筛查量和 GI 试验招募。


              约束同样重要。CADe 一侧，文献仍提示假阳性、自动化偏见、泛化能力和有限长期结果；证据足以支撑兴趣，但不足以消除买方怀疑。同样关键的是，报销背景不友好。GI 学会称 2026 年 CMS 提案会削减 ASC
              和医院内镜支付，Becker's 和 ACG 则描述了 Medicare 支付与诊所成本之间长期存在的缺口。MACRA 式成本衡量进一步让医疗服务机构对服务地点、麻醉、病理和后续利用更敏感。在这种语境下，AI
              工具必须靠质量或流程胜出，而不是靠明显的报销套利。


              研究中心网络业务面对的是不同但相连的约束。它受益于社区研究中心规模和申办方紧迫性，但公开证明仍集中在
              IBD。进入肝病学、肥胖和心脏病学在战略上有吸引力，却证据更少。尽调结论因此是不对称的：市场真实，Iterative 也似乎在销售真实痛点；但在管理层披露定价、装机基础、申办方合同经济性和非 GI
              复制数据之前，精确 TAM/SAM/SOM 数学应刻意保持收窄。
