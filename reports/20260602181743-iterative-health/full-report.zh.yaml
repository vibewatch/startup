      - number: '4.2'
        title: 成本结构、报销摩擦与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              这个模式运营上看起来有力量，但财务上比纯软件更重。Iterative 自身语言强调集中化运营、专家人员、业务开发、研究中心支持、监管职能和主动研究中心管理。NextStage
              收购新闻稿尤其有信息量，因为它描述了一个横跨多个治疗领域、覆盖研究中心人员和集中职能的 250 人组织。这意味着，即便不考虑产品研发或未来收购，公司也会承担显著人工成本、入驻成本和企业管理开销。


              公开报销背景又增加了一层摩擦。Medicare 确实覆盖筛查性结肠镜，但已审阅来源没有显示类似 SKOUT 的结肠镜 AI 有稳定的独立支付路径。与此同时，AGA 和 Becker's 描述了恶化的 GI
              报销压力，尤其是 ASC 和医院内镜；Boston Scientific
              指南也强调，不同服务地点和谈判后的商业保险合同会让经济性差异极大。这些事实很重要，因为它们会限制医疗服务客户愿意为附加技术或辅助服务支付的价格。


              单位经济性披露仍不完整。Iterative 最好的公开代理指标是研究中心数量、合作伙伴数量、启动速度和招募表现。这些指标说明产品-服务组合有运营价值。但没有
              CAC、LTV、回本周期、申办方复购率或单研究中心收入，投资人无法把这些运营成果转化为可靠承销模型。
