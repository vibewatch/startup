        blocks:
          - type: paragraph
            body: >-
              公开采用曲线不是靠按队列披露的客户数，而是通过网络里程碑显出来。2025 年 4 月，GI Alliance 称，纳入其 21 个活跃研究站点和 80 多项活跃 Phase II-IV 试验后，Iterative
              网络扩展到美国和欧洲 70 多个地点。到 2025 年 9 月 One GI 合作时，Iterative 已成为一个 34 家诊所、13 个活跃研究站点网络的嵌入式运营伙伴。到 2026 年 4 月，US
              Heart & Vascular 合作把公司重新定位为进入心脏病学的多专科网络；同月 Series C 公告中，Iterative 引述的规模已是北美、欧洲、印度和澳大利亚 100 多个研究站点，以及 40
              多家制药、生物技术、医疗器械和 CRO 伙伴。


              最有力的落地证据不是账户数，而是试验表现指标。Iterative 的医疗服务方页面称，启动速度快 2x、患者入组高 3.4x，AI 预筛查将随机化提高 40%。JCC 摘要和后续 DDW 2026
              发布给出更具体的运营数字：从站点选择到启动 74 天、到首位患者筛查 45 天、到首位随机化 83 天，每站点每月大约随机化 0.33-0.34 名患者；4 项完成试验在满额入组时仍交付约每站点每月 0.32
              名患者。这些是高质量采用代理指标，因为它们显示，即使分母和研究数量上升，网络仍在运转；但 Iterative 仍未按赞助方、站点或产品线公布标准客户队列数据。
