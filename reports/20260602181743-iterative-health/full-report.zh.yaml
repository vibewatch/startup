      - number: '8.4'
        title: 最终尽调问题和投资逻辑破裂触发项
        blocks:
          - type: paragraph
            body: >-
              剩余阻碍不是表面问题。若要从继续研究转向观察或买入，投资人需要当前收入、毛利率、留存、集中度和优先股堆叠数据，而不是另一个伙伴 标识或吞吐量轶事。报销也比公司叙事暗示的更重要。本报告审阅的法律和政策来源仍把 AI
              赋能器械的 Medicare 报销描述为一项演进中的政策工程，而 GI 支付来源则描述了内镜经济性的真实压力。这不会扼杀 SKOUT
              或更广平台逻辑，但确实意味着，在管理层证明相反情况之前，估值情景应假设存在变现摩擦。


              监控框架很直接。如果实际经济性远弱于当前标记要求、网络表现回落到基准附近，或多专科扩张未能转化为真实收入，投资逻辑就会破裂。反过来，如果尽调显示当前收入已经支撑高端 AI /
              数据倍数区间，赞助方和医疗服务方集中度可接受，且股权结构表没有异常苛刻条款，判断可能改善。在那之前，IC 的正确姿态是有纪律的好奇，而不是确信。
