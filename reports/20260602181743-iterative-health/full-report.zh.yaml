      - number: '1.4'
        title: 里程碑、监管证明点与关键风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示公司有两个清晰阶段。第一阶段从 2017 年成立延续到 2022 年 Series B，重点是面向胃肠病学的 AI，包括收购 CRSG/Precision，以及 2022 年 SKOUT 获得
              FDA 许可。第二阶段在 2025-2026 年最明显，重点是借助 GI Alliance、One GI、US Heart & Vascular，以及从 NextStage
              收购三个心脏病学研究中心，搭建多专科临床研究网络。


              SKOUT 仍是最清楚的监管和产品证明点。官方材料和 FDA 文件支持这样的事实：该器械是一款 FDA 许可、用于结肠镜的实时计算机辅助检测工具；公司报告还称每次结肠镜腺瘤检出增加 27%，近端 5-9 mm
              息肉检出增加 44%。这些事实很重要，因为它们说明 Iterative 能把 AI 工作转化为受监管的临床产品，而不只是流程软件。


              主要反向背景不是公司特定执法事件，而是品类风险。独立文献在评估 CADe
              系统时仍强调假阳性、自动化偏见、流程整合负担、泛化限制，以及长期结果数据不确定。再加上公开收入、债务和股权结构表披露缺失，公司的执行叙事强于其公开财务透明度。因此，后续章节应把 Iterative
              视为运营上可信，但在经济性和采用耐久性上仍需要重尽调的公司。
