- id: scenario-analysis-and-return-range
  title: Bull, base, and bear scenario range
  body: 'All scenario work here is explicitly assumption-based because current revenue and margin are undisclosed. The bull case assumes Iterative converts network proof into multi-specialty revenue, keeps performance materially above benchmark, and earns an upper-band AI/data multiple. Under that path, an exit around $1.8 billion to $2.6 billion is possible, but even that outcome does not create a classic late-stage venture return from a $1.3 billion to $1.4 billion starting mark. The base case is more conservative: Iterative scales as a strong CRO/data hybrid, lands around $160 million to $220 million of revenue, and exits around $0.9 billion to $1.5 billion on a 5x-7x multiple.


    The bear case matters because today’s private-mark environment is less forgiving than in 2021. If reimbursement frictions, partner concentration, or execution slippage push Iterative toward CRO-like economics, the mark could compress into roughly $0.4 billion to $0.9 billion. That downside is not a remote fantasy; PitchBook and Finro both describe a market that now reprices companies when monetization is thin or stale marks finally get tested. The probability-weighted picture is therefore closer to “already mostly priced” than to “obvious bargain,” which is why the chapter lands on research-more and stretched rather than fair and buy.'
