tables:
- id: TV001
  title: Recommendation summary
  columns:
  - Dimension
  - Assessment
  - Public-evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Company quality looks real, but price is already late-stage and economics remain opaque
    - Do not underwrite entry from public sources alone
  - - Confidence
    - medium
    - Funding and operating proof triangulate reasonably well; revenue and margin do not
    - Use diligence to validate or overturn the thesis, not to fine-tune it
  - - Risk rating
    - high
    - Execution, reimbursement, partner concentration, and financial-opacity risk all matter at once
    - Assume downside is meaningful if diligence disappoints
  - - Valuation stance
    - stretched
    - Current mark only looks fair in a premium-execution case
    - Prefer flat-to-lower entry rather than paying a fresh step-up
  - - Entry discipline
    - No new premium without data room
    - Public evidence does not support paying above the reported $1.3B-$1.4B range
    - Require full KPI pack and terms before any IC recommendation upgrade
  - - Upgrade condition
    - Revenue + margins + terms must clear premium-band thresholds
    - Need evidence that economics are closer to AI/data premium than CRO floor
    - Move to track/buy only if disclosed metrics support the price
  notes: Judgments reflect public evidence only and are intentionally price-sensitive rather than generic company-quality scores.
