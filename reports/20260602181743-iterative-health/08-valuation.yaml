  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-underwriting
    missingEvidence: Current revenue, gross margin, burn, runway, renewal / retention, and sponsor-vs-device revenue mix.
    whyItMatters: These metrics determine whether the current $1.3B-$1.4B mark reflects a premium AI/data company or an overvalued services-heavy business.
    diligencePath: Request audited 2025 revenue, 2026 YTD management accounts, board KPI deck, and cohort retention by sponsor and provider account.
    relatedQuestionRefs:
    - QV022
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Full cap table, charter, liquidation stack, dividends, pro rata rights, and any side letters or unusual investor protections.
    whyItMatters: Forge offers only partial preference clues, so investor return outcomes could differ materially from enterprise-value scenarios.
    diligencePath: Obtain charter, investor rights agreement, term sheets for the A/B/C rounds, and a current fully diluted capitalization table.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: material
    topic: multispecialty-monetization
    missingEvidence: Pipeline, bookings, activation speed, and contribution margins for cardiology and obesity programs versus GI.
    whyItMatters: The bull case depends on multispecialty scaling, but public proof today is still heavily GI-centric.
    diligencePath: Review specialty-level commercial pipeline, sponsor renewals, and revenue contribution by therapeutic area.
    relatedQuestionRefs:
    - QV008
    - QV022
  - type: missing-source
    severity: material
    topic: skout-monetization
    missingEvidence: Installed base, pricing, reimbursement assumptions, and attach-rate between SKOUT and research-network relationships.
    whyItMatters: Without device monetization evidence, the AI upside remains narrative-heavy and the comp set must stay conservative.
    diligencePath: Request commercial deck, reimbursement memo, pricing sheets, and performance by installed account cohort.
    relatedQuestionRefs:
    - QV023
    - QV025
    - QV030
