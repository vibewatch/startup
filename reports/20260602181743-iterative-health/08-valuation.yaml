- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / reference
  - 2026 metric snapshot
  - Implied multiple / valuation
  - Relevance to Iterative
  - Limitation
  rows:
  - - IQVIA
    - $30.14B market cap / $16.63B TTM revenue
    - ~1.8x revenue
    - Diversified CRO/data floor for scaled healthcare research infrastructure
    - Much larger, public, and more diversified than Iterative
  - - ICON
    - $10.53B market cap / $8.10B TTM revenue
    - ~1.3x revenue
    - Global CRO benchmark for services-heavy execution
    - Less AI/data optionality than Iterative claims
  - - Medpace
    - $12.72B market cap / $2.67B TTM revenue; Q1 revenue +26.5%, EBITDA margin 21.1%
    - ~4.8x revenue
    - Best public analog for high-quality research execution and growth
    - Still public, profitable, and far more mature than Iterative
  - - 2026 quality HealthTech M&A band
    - General HealthTech ~4x-6x; premium AI/data ~6x-8x+
    - Market band, not company-specific
    - Frames the multiple range that a premium hybrid model might earn
    - Transaction band depends heavily on quality, regulation, and durability
  - - Iterative current private mark
    - Third-party valuation context around $1.3B-$1.4B; total funding around $271M-$273M+
    - Late-stage private unicorn mark
    - Actual entry price under discussion
    - No disclosed revenue, gross margin, or retention to anchor the multiple
  - - 2026 unicorn reset context
    - PitchBook says many unicorn marks are stale; AI formation speed remains unusually high
    - Not a direct multiple, but a discounting framework
    - Supports caution on private marks that are not refreshed by public fundamentals
    - Market context rather than a direct operating comparable
  notes: Selected set is partial rather than exhaustive and combines public comps, market bands, and private-mark context because Iterative spans CRO, AI, and private-unicorn attributes.
