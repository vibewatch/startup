- id: valuation-context-and-comparables
  title: Current valuation context and comparable set
  body: 'Current valuation context is visible enough to frame discipline but not enough to justify aggressive conviction. Forge shows a $1.3 billion Series C valuation in April 2026, while TechCrunch listed Iterative at $1.4 billion on its 2026 unicorn tracker; ai2.work also reported an approximately $1.3 billion mark. Official company materials confirm the $77 million round, but they do not confirm the post-money value. Forge adds only partial financing-term clues, including a 1.0x non-participating preference and 8% dividend rate, so downside protection and dilution remain incomplete in the public record.


    Public comparables argue for caution. IQVIA and ICON trade near roughly 1x-2x revenue, while Medpace trades near roughly 5x revenue and also shows the best publicly visible growth-and-margin combination of the set. Meanwhile, current 2026 M&A commentary suggests that quality healthtech names clear around 4x-6x revenue and only premium AI/data assets push into 6x-8x-plus territory. That means Iterative’s current mark can be defended only if the business is already much closer to premium AI/data economics than to a services-heavy CRO profile. Because revenue is undisclosed, that cannot be established from public evidence alone.'
