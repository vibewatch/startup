- id: diligence-asks-and-thesis-breaks
  title: Final diligence asks and thesis-break triggers
  body: 'The remaining blockers are not cosmetic. To move from research-more toward track or buy, investors need current revenue, gross margin, retention, concentration, and preference-stack data—not another partner logo or throughput anecdote. Reimbursement also matters more than the company narrative implies. The legal and policy sources reviewed here still describe Medicare reimbursement for AI-enabled devices as an evolving policy project, while GI payment sources describe real pressure on endoscopy economics. That does not kill SKOUT or the broader platform thesis, but it does mean the valuation case should assume monetization friction until management proves otherwise.


    The monitoring framework is straightforward. The thesis breaks if actual economics prove far weaker than the current mark requires, if network performance falls back toward benchmark, or if multispecialty expansion fails to convert into real revenue. Conversely, the call could improve if diligence shows current revenue already supports premium AI/data multiple territory, sponsor and provider concentration are acceptable, and the cap table does not contain unusually punitive terms. Until then, the right IC posture is disciplined curiosity rather than conviction.'
