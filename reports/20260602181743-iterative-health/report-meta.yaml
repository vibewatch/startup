companyProfile:
  summary: |
    Iterative Health is a Cambridge-based healthcare technology and services company that evolved
    from Iterative Scopes' GI-focused AI tooling into a broader clinical-research infrastructure
    platform. The company now combines an FDA-cleared real-time polyp-detection product (SKOUT)
    with a multispecialty site-network model serving gastroenterology, hepatology, obesity, and
    cardiology studies. Public evidence supports meaningful operating momentum — 100+ research sites,
    40+ sponsor/CRO/device partners, and documented speed advantages in IBD trial execution — but it
    does not yet disclose the revenue quality or margin profile needed to cleanly justify a unicorn
    valuation on fundamentals alone.
  foundedDate: "2017-01-01"
  founders:
    - name: Jonathan Ng
      role: Founder and CEO
      background: "Physician-operator who built the company from its 2017 MIT-linked origins and remains the key executive face of the platform."
      claimRefs: [CO006, CO007]
  foundingLocation: "Cambridge, MA, USA"
  headquarters: "Cambridge, MA, USA"
  productSummary: |
    The product stack pairs SKOUT — an FDA-cleared real-time AI CADe tool for colonoscopy — with a
    site-centric clinical-research operating platform that helps provider groups and sponsors select,
    activate, staff, and enroll high-performing trial sites. Adjacent AI assets support IBD trial
    recruitment, endoscopic scoring, and hybrid AI-human review workflows.
  customerFocus: |
    Provider networks, GI/hepatology/cardiology research sites, pharmaceutical sponsors, biotech
    companies, medical-device firms, and CROs seeking faster community-based trial execution.
  businessModel: |
    Mixed services-and-software model: site-network and trial-operations revenue from sponsors/CROs
    and provider partners, plus product monetization from SKOUT and related AI workflow tools. Public
    pricing and contract terms are largely undisclosed.
  stage: Series C
  fundingStatus: "Officially raised a $77M Series C in April 2026; public valuation context is roughly $1.3B-$1.4B with disclosed cumulative capital around $270M+, but revenue, margin, and full preference-stack visibility remain limited."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO006, CO015, CO017, CO025, CV014, CV043, CV050, CV051]

