evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-table-completeness
    missingEvidence: >-
      A single authoritative public roster showing the full current executive team, complete board membership, and
      reporting lines.
    whyItMatters: Leadership and governance depth affect key-person risk, oversight quality, and change-of-control dynamics.
    diligencePath: Request the current org chart, board roster, and committee structure from management or the data room.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-map-cap-table
    missingEvidence: >-
      Current cap table, ownership percentages, liquidation preferences, and detailed commercial economics for major
      provider-network partnerships.
    whyItMatters: >-
      Without cap-table and contract detail, investors cannot fully assess dilution, governance rights, or the economics
      behind reported network scale.
    diligencePath: >-
      Request the latest cap table, charter docs, investor rights agreement, and summary terms for GI Alliance, One GI,
      and US Heart partnerships.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount-reconciliation
    missingEvidence: A current employee count reconciled across legal entities and geographies.
    whyItMatters: Headcount is a proxy for operating leverage and burn; conflicting counts make scale comparisons noisier.
    diligencePath: >-
      Ask management for current employee counts by entity and location and reconcile those against third-party
      trackers.
    relatedQuestionRefs:
      - QO010
      - QO018
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current revenue, ARR, margin profile, debt terms, and any secondary-liquidity components tied to recent
      financings.
    whyItMatters: >-
      The company’s valuation and execution quality cannot be fully underwritten without direct evidence on economics
      and financing structure.
    diligencePath: Request board materials or management accounts showing revenue/ARR, gross margin, burn, and financing-term detail.
    relatedQuestionRefs:
      - QO021
      - QO022
  - type: private-evidence-only
    severity: material
    topic: cade-roi-outcomes
    missingEvidence: >-
      Longitudinal post-market data on interval cancer, advanced neoplasia, and realized cost offsets for CADe by buyer
      setting.
    whyItMatters: >-
      Public evidence is strong enough to show better adenoma detection, but budget owners underwrite on outcomes and
      economic payoff rather than ADR alone.
    diligencePath: >-
      Request post-market customer studies, buyer references, and outcome tracking from community GI, VA, and hospital
      deployments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: cade-market-sizing
    missingEvidence: >-
      Installed base, contracted pricing, per-procedure economics, and win-loss data for SKOUT and comparable CADe
      tools.
    whyItMatters: >-
      Without pricing and penetration data, any public SAM or SOM estimate for the AI-colonoscopy market would be false
      precision.
    diligencePath: >-
      Ask management for deployed-room counts, contracted pricing by site archetype, renewal rates, and competitive
      displacement data.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: trial-network-unit-economics
    missingEvidence: >-
