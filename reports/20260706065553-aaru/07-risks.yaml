  title: Aaru’s central risk is decision trust, not feature absence
  body: The public record already shows real customer interest and impressive speed. The harder question is whether synthetic outputs remain decision-grade across sensitive domains, minority groups, and novel scenarios where public benchmark evidence is still thin.
  claimRefs:
  - CR013
  - CR020
  - CR023
  - CR035
