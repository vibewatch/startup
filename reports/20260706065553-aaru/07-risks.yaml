- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Methodology failure
    - High-profile customer miss
    - One public failure in a sensitive deployment without transparent post-mortem
    - Pause conviction; demand deeper technical review
  - - Claims / regulatory risk
    - Regulator inquiry or forced claims rollback
    - Any formal inquiry tied to AI accuracy, deception, or data use
    - Reassess compliance readiness and board oversight
  - - Partner concentration
    - Channel dependence worsens
    - One partner responsible for outsized pipeline or proof without diversification plan
    - Discount growth durability and push for direct-customer evidence
  - - Operational opacity
    - Trust surface does not mature
    - No benchmark pack, security disclosure, or reliability metrics by next diligence cycle
    - Maintain high residual-risk rating
  - - Financial/model risk
    - Revenue scale lags narrative
    - Revenue and retention evidence remain thin while valuation expectations stay elevated
    - Treat valuation as stretched and require stricter entry discipline
  - - Bias / fairness risk
    - Subgroup issue becomes visible
    - Evidence that outputs systematically degrade for underrepresented groups
    - Require fairness audit and restricted-use controls before expanding exposure
  notes: Kill criteria are intentionally concrete and monitorable so they can guide post-investment governance rather than remain abstract worries.
