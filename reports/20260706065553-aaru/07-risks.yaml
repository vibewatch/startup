  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: benchmark-and-failure-modes
    missingEvidence: No reviewed public source provided a comprehensive benchmark pack showing where Aaru’s simulations fail by segment, geography, novelty, or high-stakes use case.
    whyItMatters: Without explicit failure-mode evidence, methodology risk cannot be bounded confidently for enterprise, political, or public-sector decisions.
    diligencePath: Request benchmark suite, adverse-case results, subgroup breakdowns, and model-governance escalation rules.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR007
    - QR024
  - type: private-evidence-only
    severity: material
    topic: operational-and-security-visibility
    missingEvidence: Public materials did not disclose Aaru’s certifications, incident history, uptime targets, cloud dependencies, or security-review cadence.
    whyItMatters: Operational opacity prevents investors and enterprise buyers from judging whether reliability and security maturity match the sensitivity of the use cases.
    diligencePath: Request security whitepaper, architecture overview, incident response plan, uptime history, and vendor-dependency map.
    relatedQuestionRefs:
    - QR012
    - QR013
    - QR021
    - QR024
  - type: missing-source
    severity: minor
    topic: sensitive-use-governance
    missingEvidence: No reviewed public source described Aaru-specific governance rules for political, policy, or other sensitive deployments.
    whyItMatters: This leaves open how the company decides when synthetic outputs require extra disclosure, human review, or usage restrictions.
    diligencePath: Request sensitive-use policy, restricted-customer criteria, and approval / escalation workflow.
    relatedQuestionRefs:
    - QR023
  - type: missing-source
    severity: minor
    topic: org-depth-and-cloud-dependencies
    missingEvidence: Open sources did not provide a reliable map of Aaru’s organizational depth, cloud footprint, or critical third-party infrastructure.
    whyItMatters: People and infrastructure concentration can materially change execution and resilience risk at an early-stage company.
    diligencePath: Request org chart, key-role coverage, vendor list, and business continuity planning.
    relatedQuestionRefs:
    - QR021
    - QR022
  - type: missing-source
    severity: minor
    topic: TR001 regulatory coverage
    missingEvidence: The public record does not expose a full jurisdiction-by-jurisdiction compliance inventory for Aaru’s current or planned deployments.
    whyItMatters: A partial public risk register may miss country-specific election, AI, or data-transfer issues relevant to future expansion.
    diligencePath: Request compliance matrix by geography and use case.
    relatedQuestionRefs:
