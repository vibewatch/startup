callouts:
- calloutType: insight
  title: The market is fragmented across simulation-first, workflow-first, and human-insight incumbents
  body: Aaru does not face one clean peer group. Some rivals are trying to model behavior more deeply, while others simply promise to automate existing interview or survey workflows faster. Incumbents can still win by leaning on trust, real humans, and distribution rather than synthetic novelty.
  claimRefs:
  - CP001
  - CP014
  - CP016
  - CP024
  - CP035
- calloutType: risk
  title: Incumbent distribution and pricing clarity can neutralize model differentiation
  body: Buyer friction matters. Even if Aaru’s models are stronger, self-serve or trusted enterprise platforms can capture many decisions when pricing is clearer, procurement is simpler, or buyers want to stay inside existing systems.
  claimRefs:
  - CP017
  - CP020
  - CP023
  - CP036
  - CP037
  - CP044
- calloutType: assumption
  title: Aaru’s moat improves only if its simulations prove better than fast AI-research tools and trusted incumbents
  body: The key competitive assumption is that Aaru can move beyond speed and convince buyers that its predictions are more decision-useful than both interview automation and incumbent human-panel platforms. Without that proof, the category can commoditize around workflow speed or channel control.
