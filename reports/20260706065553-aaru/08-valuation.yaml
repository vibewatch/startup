- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Aaru reaches $100M+ ARR, keeps strong growth, earns premium AI-software multiple, and becomes platform infrastructure
    - $100M ARR at ~20x can imply ~$2B EV before considering dilution or strategic premium
    - Execution breadth, regulatory scrutiny, and proof durability
    - Possible, but depends on exceptional execution
  - - Base
    - Aaru reaches ~$50M ARR with credible retention and real partner-to-direct conversion
    - ~$50M ARR at ~20x can support roughly ~$1B EV, which implies today’s price is only fair if major de-risking occurs
    - Retention, direct sales proof, and margin quality
    - Most neutral framing from public evidence
  - - Bear
    - Aaru remains sub-scale or partner-mediated, with limited direct monetization and slower validation
    - <$25M ARR or a compressed multiple would imply meaningfully below headline valuation
    - Narrative outruns economics, down-round or muted exit
    - Material risk if current proof does not compound
  - - Strategic-upside case
    - Aaru becomes strategically valuable to a larger insights, data, or agency platform before full stand-alone maturity
    - Could clear public-comps math via strategic premium
    - Exit timing and buyer appetite uncertain
    - Real but hard to underwrite from public sources
  - - Funding-overhang case
    - Future rounds reprice the company closer to lower blended rather than headline value
    - Return math gets diluted even if operating progress continues
    - Preference stack, dilution, and signaling risk
    - Meaningful if milestones slip
  notes: Scenario math is illustrative because public sources do not provide enough information for a complete model or cap-table-aware return analysis.
