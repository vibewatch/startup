- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue and retention
    - ARR, growth, NRR, GRR, churn, ACV mix
    - Core support for whether the valuation is stretched or fair
    - Request management data room and cohort exports
  - - Round economics
    - Blended entry price, preference stack, rights, dilution
    - Determines real return potential from here
    - Request financing documents and cap table
  - - Gross margin and burn
    - Unit economics, runway, cash use
    - Needed to assess how much optionality current capital buys
    - Request board deck or finance package
  - - Customer quality
    - Direct vs partner-sourced revenue and references
    - Determines whether proof is borrowed or durable
    - Request top-customer analysis and reference calls
  - - Validation protocol
    - Benchmark pack, failure modes, red-team results
    - Determines whether Aaru deserves a premium decision-tech multiple
    - Request technical diligence session and artifacts
  - - Go-to-market ownership
    - Channel mix, partner terms, and renewal responsibility
    - Clarifies concentration and expansion risk
    - Request partner agreements summary
  - - Exit logic
    - Potential strategic buyers and likely milestones
    - Needed to frame venture return logic from a premium entry point
    - Build strategic landscape memo after data room review
  notes: These asks are prioritized by how much they could move recommendation confidence and valuation stance.
  claimRefs:
