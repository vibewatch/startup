- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Bull thesis: Aaru becomes a decision infrastructure layer for businesses, governments, campaigns, and markets'
    - Repeated proof that cross-domain prediction becomes a system of record with strong retention and pricing power
  - - 'Anti-thesis: Aaru is a promising but still narrow synthetic-research tool priced like a platform too early'
    - Direct evidence of platform-like economics, differentiated margins, and broadening customer ownership
  - - 'Bull thesis: premium price captures option value on a category-defining AI company'
    - Evidence that Aaru can own a new budget line rather than compete inside existing research spend
  - - 'Anti-thesis: the valuation is headline-rich but fundamentals-thin'
    - Disclosure of ARR, retention, and blended entry price that materially improve underwriting clarity
  - - 'Bull thesis: partner channels accelerate distribution efficiently'
    - Proof that partner-led access converts into direct durable economics rather than borrowed credibility
  - - 'Anti-thesis: partner concentration and missing economics make the equity fragile'
    - Diversified revenue, direct references, and stronger disclosure would reduce fragility
  notes: Both sides of the case are credible; what changes the answer is not more rhetoric but more disclosed economics and repeatability evidence.
