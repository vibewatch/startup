- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue scale stalls
    - No evidence of meaningful ARR step-up from sub-$10M clue over the next diligence cycle
    - Breaks the “platform compounding” thesis
    - Treat valuation as stretched and downgrade conviction
  - - Retention remains opaque
    - Management still cannot show NRR / GRR / cohort quality
    - Undercuts software-quality underwriting
    - Refuse to underwrite premium multiple
  - - Partner proof fails to compound
    - Interpublic / Accenture / EY remain isolated references without broader direct adoption
    - Breaks channel-leverage thesis
    - Assume borrowed credibility rather than durable distribution
  - - Methodology challenge emerges
    - Public miss or validation controversy in a high-stakes deployment
    - Breaks trust and compresses multiples
    - Reassess as a risk event, not just a normal execution miss
  - - Round economics worsen
    - Future financing occurs closer to lower blended valuation or with punitive preferences
    - Damages return potential even if company survives
    - Tighten entry discipline or avoid follow-on
  - - Pricing opacity persists
    - No clear monetization logic emerges despite product attention
    - Weakens case that product is becoming infrastructure
    - Shift toward watchlist rather than active diligence
  notes: Triggers are chosen to be monitorable from diligence updates rather than broad macro conditions.
