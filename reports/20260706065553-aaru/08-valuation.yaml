- id: comparables-and-scenario-framing
  title: Comparables and Scenario Framing
  body: 'No comparable is clean, but several are still informative. Mature insights platforms such as Qualtrics, Momentive, and UserTesting changed hands between roughly $1.3 billion and $12.5 billion with far broader disclosed customer footprints and more mature commercial packaging than Aaru has publicly shown. Qualtrics had over 19,000 organizations on platform at take-private. Momentive served more than 330,000 organizations. UserTesting had become a public company before its $1.3 billion take-private. These are not apples-to-apples comps, because Aaru is earlier, more AI-native, and potentially broader in ambition. But they are useful reminders that a billion-dollar valuation in the insights stack has historically corresponded to more visible revenue scale and customer breadth than Aaru has publicly disclosed.


    That is why scenario framing matters. A $1 billion value becomes much easier to defend if Aaru can prove $50 million-plus of ARR with strong retention and differentiated margins, and easier still if it grows into a platform category where investors reward it with high-growth software multiples. By contrast, if the company remains a partner-mediated research tool with sub-scale direct economics, the mature-platform comparables stop helping and the price begins to look like pure narrative carry. The scenario exercise therefore supports a middle position: there is real upside optionality, but the current price already embeds a large part of the dream.'
