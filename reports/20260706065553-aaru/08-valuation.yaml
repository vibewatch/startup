- id: diligence-asks-and-exit-logic
  title: Diligence Asks and Exit Logic
  body: 'Aaru’s valuation cannot be resolved cleanly from public evidence alone, so the right final step is to define what would move confidence. First, investors need a real economics pack: current ARR, growth, gross margin, burn, runway, net retention, logo churn, ACV mix, and partner-sourced versus direct revenue. Second, they need cap-table and round-structure clarity: preference stack, rights, dilution, and the effective blended entry price across investors. Third, they need proof that the core product has repeatable expansion logic instead of one-off flagship references.


    Exit logic is plausible but still conditional. Strategic buyers could include large agencies, experience-management platforms, enterprise-data firms, or broader AI application vendors if Aaru becomes a durable decision layer. Financial buyers are harder to underwrite this early unless the revenue model matures quickly. In practical terms, the most important valuation discipline is to avoid confusing optionality with inevitability. The company deserves serious attention, but the public record still points to high uncertainty, stretched pricing, and a need for unusually deep follow-up diligence before treating the current valuation as fundamentally supported.'
