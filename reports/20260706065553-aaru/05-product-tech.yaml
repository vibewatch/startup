  evidenceGaps:
  - type: missing-source
    severity: material
    topic: architecture-disclosure
    missingEvidence: No official Aaru source reviewed publishes the model stack, evaluation pipeline, or component-level architecture for its synthetic-agent system.
    whyItMatters: Without architecture detail, it is difficult to distinguish proprietary technical depth from well-packaged workflow orchestration.
    diligencePath: Request system architecture diagrams, eval methodology, and internal benchmark docs.
    relatedQuestionRefs:
    - QE003
    - QE013
    - QE025
  - type: missing-source
    severity: material
    topic: benchmark-pack
    missingEvidence: No public benchmark pack shows where Aaru’s simulations succeed, fail, or degrade by domain, demographic edge case, or scenario novelty.
