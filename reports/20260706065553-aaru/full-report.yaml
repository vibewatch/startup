      - number: '7.4'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The company is not without plausible mitigations. It can lean on licensed-data discipline, formal DPAs,
              negotiated enterprise contracts, validation-style case studies, and partner due diligence. NIST’s AI RMF
              and Playbook provide a practical template for what mature mitigation should look like: explicit governance
              ownership, mapping of where the model is used, measurement against known failure modes, and a management
              loop that changes deployment behavior when risk spikes. Aaru’s next mitigation step, however, should be
              public or semi-public evidence rather than more narrative. Buyers and investors need clearer proof of
              calibration routines, red-team or adverse-case evaluation, incident-response practices, and escalation
              rules for sensitive uses.


              The key monitoring triggers are therefore straightforward. Negative signals would include a public miss in
              a high-stakes deployment, regulatory scrutiny of AI claims or data use, a failed major partner rollout, or
              evidence that model performance breaks down for minority or outlier groups without compensating
              safeguards. Positive signals would include publication of benchmark packs, security certifications,
              documented human-in-the-loop governance, and diversified direct-customer adoption. Until those appear,
              residual risk remains high. The right investment posture is not to dismiss the product, but to demand
              unusually strong diligence on validation, governance, and concentration before underwriting durability.
            claimRefs:
