  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modules
        blocks:
          - type: paragraph
            body: >-
              Aaru’s product is best understood as a decision-simulation platform rather than as a narrow survey tool.
              The public site describes a multi-agent simulation system that recreates the world, while the about page
              expands that mission into a broader whole-world-simulation aspiration. In practice, the company packages
              this into three visible product lines: Lumen for commercial research and go-to-market questions, Seraph
              for public-sector communication and policy design, and Dynamo for political forecasting and messaging.
              That modular framing is important because it shows Aaru is not merely selling one polling workflow. It is
              attempting to apply a shared synthetic-population engine across multiple customer workflows where
              decisions are high stakes and direct fieldwork may be slow or expensive.


              The product surface is still more ambitious than explicit. There is no public pricing page, public API
              documentation, reliability dashboard, or detailed module hierarchy published by Aaru itself. Yet the
              official product pages do show a coherent job-to-be-done map across marketing, government, and politics.
              The result is a product story with strong customer-workflow framing but limited technical disclosure. For
              diligence, the reusable fact is that Aaru already presents itself as a multi-module software platform with
              distinct domain-specific faces, not as a one-off services consultancy. The open question is whether those
              modules are true productized layers on top of one engine or simply different packaging labels around the
              same bespoke simulation workflow.
