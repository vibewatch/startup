  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Aaru’s valuation case begins with an unusually strong ambition-to-age ratio. The company appears to have
              achieved notable early proof: Redpoint led the Series A, Accenture and Interpublic are public partners, EY
              supplied a quantitative validation reference, and Semafor documented at least one unusually accurate
              political forecast. If those signals compound into a broader prediction infrastructure business, then a
              premium price today could be rationalized as venture-style option value on a category-defining platform.
              That is the bull thesis.


              The anti-thesis is equally clear. Public evidence still looks like a very early company: revenue was
              reported below $10 million, pricing is undisclosed, retention is undisclosed, margins are undisclosed, and
              much of the strongest proof is partner-mediated. At a $1 billion headline valuation, investors are
              underwriting a future operating system for behavioral prediction rather than a presently legible software
              business. That does not make the investment irrational, but it does make it fragile. On the public record
              alone, the most defensible recommendation is research-more. The company has enough traction to stay on a
              serious diligence path, but not enough disclosed economics to support a clean conviction that the current
              entry price is attractive on a risk-adjusted basis.
