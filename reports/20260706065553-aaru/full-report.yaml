  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Packaging
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence on Aaru’s commercial model comes from its own platform terms rather than
              from a pricing page. The user terms make clear that the Aaru Platform is not a public self-serve app: it
              is for clients or invited parties using the system under an Aaru services agreement, and access begins
              only when Aaru creates a portal account. The platform is described as a secure environment for
              transmitting documents and information relating to simulations, which strongly suggests an account-based
              enterprise deployment model. Combined with the public site’s demo- and contact-led motion, that points to
              a hybrid commercial structure: enterprise services agreements with platform access, rather than open
              subscription checkout.


              That packaging matters because it shapes both revenue quality and cost structure. Aaru does not publish
              list pricing, public seat tiers, usage bands, or standard contract minimums on its current site. In
              contrast, several adjacent research tools do. Qualtrics and UserTesting still use quote-led enterprise
              packaging, but they at least expose how pricing is framed. Lyssna and SurveyMonkey go further with visible
              self-serve anchors. Aaru’s opacity is therefore not unusual for a high-end enterprise AI company, but it
              does reduce underwriting confidence because the market cannot tell whether the company monetizes via
              annual SaaS contracts, usage-based simulation calls, custom services, or some combination of all three.
              The Aaru terms and portal architecture point to enterprise software plus services, yet the exact
              commercial split remains undisclosed.
