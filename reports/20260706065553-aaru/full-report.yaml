      - number: '7.2'
        title: Privacy, Security, and Operational Opacity
        blocks:
          - type: paragraph
            body: >-
              Aaru is not devoid of governance materials. Its privacy policy, data-processing agreement, and user terms
              show that the company is trying to meet enterprise expectations on baseline legal structure. The DPA
              references GDPR-era obligations, and the Interpublic partnership stresses licensed-data use and an
              ethics-first posture. Those are meaningful signals. But they are baseline signals, not full proof that the
              operational stack is ready for large-scale enterprise trust. Public materials reviewed for this report
              still do not disclose Aaru’s uptime commitments, incident history, security certifications, or public
              post-mortem practices. There is also no public benchmark pack showing how model quality is monitored
              across segments or how often outputs are validated against human data in live production.


              This gap matters because regulators and enterprise buyers are converging toward a stronger burden of
              proof. The ICO’s AI guidance emphasizes GDPR principles and explainability, and NIST’s framework pushes
              organizations toward explicit governance, mapping, measurement, and management of AI risk. Aaru may well
              be doing much of this internally, but public evidence does not yet prove it. In other words, the privacy
              and operational risk picture is not a story of negligence; it is a story of opacity. The company has
              enough policy surface to clear first-pass diligence, but not enough disclosed operational evidence to
              fully clear procurement, compliance, or reputational concerns for the most sensitive deployments.
