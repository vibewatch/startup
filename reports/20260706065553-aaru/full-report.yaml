              Aaru’s valuation cannot be resolved cleanly from public evidence alone, so the right final step is to
              define what would move confidence. First, investors need a real economics pack: current ARR, growth, gross
              margin, burn, runway, net retention, logo churn, ACV mix, and partner-sourced versus direct revenue.
              Second, they need cap-table and round-structure clarity: preference stack, rights, dilution, and the
              effective blended entry price across investors. Third, they need proof that the core product has
              repeatable expansion logic instead of one-off flagship references.


              Exit logic is plausible but still conditional. Strategic buyers could include large agencies,
              experience-management platforms, enterprise-data firms, or broader AI application vendors if Aaru becomes
              a durable decision layer. Financial buyers are harder to underwrite this early unless the revenue model
              matures quickly. In practical terms, the most important valuation discipline is to avoid confusing
              optionality with inevitability. The company deserves serious attention, but the public record still points
              to high uncertainty, stretched pricing, and a need for unusually deep follow-up diligence before treating
              the current valuation as fundamentally supported.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV039
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV031
              - CV032
              - CV039
              - CV042
              - CV045
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Aaru is being priced on future category ownership, not present-day software transparency
            body: >-
              That can be a winning venture pattern, but only if the company later proves it owns a durable new budget
              line with strong retention and benchmarked performance.
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV034
              - CV045
          - type: callout
            title: The round structure itself is a warning label
            body: >-
              A headline valuation paired with lower-price access for some investors suggests genuine excitement but
              also real negotiation about what the company was worth on the day capital cleared.
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV040
          - type: callout
            title: The cleanest path to justifying $1B is proving ~$50M ARR with elite retention
            body: >-
              That threshold is not a formal law, but it is a useful discipline anchor because it moves the implied
              multiple closer to the upper end of strong public software cohorts instead of well beyond them.
            calloutType: assumption
            claimRefs:
              - CV017
              - CV037
              - CV041
