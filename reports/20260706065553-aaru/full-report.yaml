  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitute Stack
        blocks:
          - type: paragraph
            body: >-
              Aaru should not be analyzed as a generic AI company or even as a generic survey software vendor. Its
              current product surfaces span commercial strategy, government decision support, and political forecasting,
              which makes the relevant market a hybrid of market research, simulation software, and decision-support
              tooling. The commercial side overlaps with classic insights budgets — segmentation, brand perception,
              launch testing, pricing, and campaign strategy — while the public-sector and political surfaces extend
              into policy communication and polling workflows. That breadth is important because it enlarges the
              plausible spend pool, but it also means that any direct TAM claim must be bounded carefully. Aaru is not
              selling all AI, all analytics, or all martech; it is selling modeled-audience prediction in places where
              decisions are high stakes and human-panel research is slow, expensive, or hard to field.


              The substitute stack clarifies the market boundary further. TechCrunch frames Aaru as a replacement for
              surveys and focus groups when the goal is to predict future behavior, and Semafor treats traditional
              polling of real humans as the incumbent substitute in politics. In practical terms, the current market
              includes at least five solve-the-job paths: human survey panels, focus groups and qual fieldwork, internal
              analytics and experimentation, agency-led strategy work, and synthetic-audience platforms. That is why the
              category should be thought of as an insertion into decision workflows rather than a standalone software
              seat count. The buyer is paying to reduce uncertainty before committing budget, messaging, policy
              sequencing, or product-launch capital. This framing also explains why adjacent service firms such as
              Accenture Song and IPG matter so much: they sit at the intersection of research, strategy, and execution,
              and therefore shape whether synthetic tools become a supplement, a channel, or a substitute.
            claimRefs:
