  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Methodology and Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              Aaru’s core risk starts with the same thing that makes it interesting: it is asking buyers to trust
              synthetic populations in place of, or at least ahead of, direct human research. That creates a risk
              surface much larger than ordinary analytics tooling. Public critics across media, research, and UX
              methodology argue that synthetic respondents can be directionally useful while still missing crucial
              details about variability, subgroup behavior, and edge cases. Mother Jones frames the issue as
              polarization and misrepresentation risk, Pew worries that replacing real respondents can erase the
              public’s voice, and Nielsen Norman Group summarizes evidence that synthetic users often track trends
              better than effect sizes or outlier behavior. STRAT7, NIQ, Kantar, Bain, and Qualtrics all reinforce the
              same core warning from different angles: fast synthetic output is not automatically decision-grade
              evidence.


              For Aaru, that matters because its public footprint includes political, policy, and marketing use cases.
              Errors in campaign testing or product ideation are one thing; errors in election-related, policy-related,
              or socially sensitive contexts create reputational and possibly regulatory exposure. The European
              Parliament’s explanation of the AI Act highlights democratic-process systems as a higher-risk area
              requiring transparency, logs, accuracy, and human oversight, while the FTC’s AI enforcement sweep makes
              clear that unsupported AI claims are not protected just because they are wrapped in frontier-tech
              language. The biggest risk, therefore, is not that Aaru lacks a product. It is that the public evidence
              still does not clearly define the boundary conditions under which that product should or should not be
              trusted.
