      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV033
  - id: TV005
    title: 论点破裂和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入规模停滞
        - 下一轮尽调周期内，没有证据显示 ARR 从低于 $10M 的线索显著台阶式提升
        - 打破「平台复利」论点
        - 将估值视为偏高，并下调确信度
      - - 留存仍不透明
        - 管理层仍无法展示 NRR / GRR / cohort 质量
        - 削弱软件质量层面的投资判断
        - 拒绝给高溢价倍数背书
      - - 合作伙伴证明无法复利
        - Interpublic / Accenture / EY 仍是孤立背书，没有更广泛直客采用
        - 打破渠道杠杆论点
        - 假设它只是借来的可信度，而非持久分发
      - - 方法论挑战出现
        - 高风险部署中出现公开失误或验证争议
        - 打破信任并压缩倍数
        - 将其作为风险事件重估，而不只是普通执行失误
      - - 融资条款恶化
        - 后续融资更接近较低混合估值，或附带惩罚性优先权
        - 即便公司存活，也会损害回报潜力
        - 收紧进入纪律，或避免跟投
      - - 定价不透明持续
        - 即便产品获得关注，仍没有清晰变现逻辑
        - 削弱「产品正在变成基础设施」的判断
        - 转向观察名单，而非主动尽调
    notes: 触发因素选择的是能从尽调更新中监测的事项，而不是宽泛宏观条件。
