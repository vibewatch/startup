    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              Aaru 当前的公开身份，在产品和使命上比在公司披露上清楚得多。截至本报告日期，实时官网指向 aaru.com，而不是
              aaru.ai；公司把自己定位为模拟软件建设者，靠多智能体方法重建世界。官网关于页面又往前迈一步，把 Aaru 的产品描述为通向全世界模拟的一块块拼图。对于一家 2024
              年才进入公众视野的公司，这种定位相当激进。相同官方界面持续指向三条外部产品线——Lumen、Seraph、Dynamo——合起来覆盖商业、政府和政治预测场景。账户门户、隐私政策、Cookie
              政策和数据处理协议也都说明，公司运营的是真实软件产品，不只是咨询式落地页。


              创立证据仍主要来自顶级媒体报道，而不是密集的公司自我披露。TechCrunch 将创立时间定在 2024 年 3 月，Wall Street Journal 把 Aaru
              描述为由青少年创立的初创公司，Semafor 则在报道其民调工作时把创始人放在曼哈顿语境下。公开法律页面将运营实体列为 Aaru Inc.，但没有披露司法辖区、资本结构或董事会组成。公司 X
              账号显示，其公开发布痕迹从 2024 年 6 月开始，这与一家快速推进的初创公司从青少年项目到两年内获得独角兽级融资的整体叙事相吻合。后续章节最可复用的事实很直接：Aaru
              是一家总部位于纽约的合成研究软件公司，由 Cameron Fink、Ned Koh 和 John Kessler 于 2024 年 3 月创立，已有在线商业产品界面，公开叙事围绕 AI
              模拟，而非传统真人样本研究。
