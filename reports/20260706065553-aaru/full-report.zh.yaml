  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 哪些证据会改变判断
    rows:
      - - 多头论点：Aaru 成为企业、政府、竞选活动和市场的决策基础设施层
        - 反复证明跨领域预测能变成记录系统，并具备强留存和定价权
      - - 反方论点：Aaru 有潜力，但仍是狭窄的合成研究工具，却过早按平台定价
        - 平台式经济性、差异化毛利和客户所有权扩大的直接证据
      - - 多头论点：溢价价格捕捉品类定义型 AI 公司的期权价值
        - 证明 Aaru 能占据新的预算科目，而不是在既有研究支出里竞争
      - - 反方论点：估值叙事很足，基本面很薄
        - 披露 ARR、留存和混合入场价格，显著提高投资判断清晰度
      - - 多头论点：合作伙伴渠道高效加速分发
        - 证明合作伙伴带来的触达能转化为直接、持久的经济性，而不是借来的可信度
      - - 反方论点：合作伙伴集中、经济性缺失，让股权很脆弱
        - 收入多元化、直客背书和更强披露会降低脆弱性
    notes: 正反两边都站得住；真正改变结论的不是更多叙事，而是更多披露出来的经济性和可重复证据。
