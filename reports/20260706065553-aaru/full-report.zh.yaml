      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Aaru 的资本叙事远强于公开财务披露。TechCrunch 和 Crunchbase 将最新融资锚定在 Redpoint 领投、超过 $50 million 的 Series A，TechCrunch 同时称
              ARR 仍低于 $10 million。这种组合符合早期 AI 公司在收入成熟之前先融资的模式。不过，它没有回答该轮之后最关键的承保问题：招聘和算力承诺后还剩多少现金，月度 burn
              是什么样，平台有多少部分需要持续模型训练支出，或什么业绩里程碑会触发下一轮融资。已审阅的公开来源没有一个披露现金余额、月度 burn、runway、债务或营运资本需求。


              这形成了一种熟悉的 AI 融资格局：标题资本看似充足，但面对基础设施野心，真实充足性不确定。AIbase 的路线图备注——GeoPulse API、重度 H100
              算力投入和自助式野心——强化了有意义资本强度的可能性，即便毛利率轮廓像软件。Aaru 自己网站也没有公开 SEC
              文件或商标披露链接，意味着官方文件尽调必须通过外部门户，而不是公司撰写的投资者材料。对私营初创公司来说这很正常，但也进一步提高了对二手报道的依赖。实际结论是，Series A
              可能买来了时间和可信度，但公开证据还不足以判断这笔融资是充裕、仅够用，还是已经部分承诺给重算力路线图执行。
