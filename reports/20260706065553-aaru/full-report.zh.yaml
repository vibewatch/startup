      - number: '5.4'
        title: 技术护城河与开放风险
        blocks:
          - type: paragraph
            body: >-
              Aaru 最能站得住脚的技术叙事，是覆盖面广且贴近企业场景。它横跨商业、政府和政治；把自己包装为多智能体仿真；并且通过 EY、Accenture
              和公开民调报道拿到具名验证场景。但这套叙事仍有两处脆弱点。第一，同行产品显示，许多客户任务用更窄的 AI 工作流就能解决。Listen Labs 和 Outset
              不必证明完整的合成社会仿真，也能快速交付有主持的研究。GWI Spark 可以主张自己扎根于海量真人调查数据。CulturePulse
              则可以说，推理和行为建模比简单语言模仿更重要。第二，批评者会攻击代表性和边缘案例表现。Mother Jones 和 Qualtrics 都强调必须审视合成方法，尤其是涉及离群群体或高风险决策时。


              因此，Aaru
              的护城河只有在仿真既更快、又对决策更有用时才成立。今天的公开证据更能支持前半句，后半句还弱得多。公司显然有产品市场吸引力，但仍没有公开开发者接口、明确模型栈披露、基准套件，或可与成熟技术平台通常展示内容相比的失效模式地图。因此技术结论是平衡的：Aaru
              比纯咨询公司更产品化，也比访谈自动化厂商更有野心，但公开证据仍不足以验证底层系统的深度、可复现性和安全边界。
