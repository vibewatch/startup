      - number: '5.2'
        title: 架构与运营流程
        blocks:
          - type: paragraph
            body: >-
              关于 Aaru 运营模型，最好的公开描述来自 TechCrunch、Semafor 和公司同行，而不是正式架构页。TechCrunch 称，平台会从公开和专有数据生成数千个 AI 智能体。Semafor
              补充了最多运营细节：在政治工作流中，Aaru
              用人口普查数据复制选区，给智能体数百个人格特征，并用旨在模拟人类媒体摄入的信息流更新它们。这足以识别大致架构类别——合成人群、动态智能体状态和基于场景的输出生成——即便精确模型栈、编排层和评估管线仍未披露。用户条款在这里也重要，因为它暗示一种基于账户的交付模式：客户在安全门户内交换文件和模拟信息，而不是通过完全开放的自助界面。


              同行和代理来源帮助厘清 Aaru 仍需证明的内容。generative-agents 论文展示了围绕观察、规划和反思构建的可信参照架构；CulturePulse 和 Simile
              都强调基于智能体的行为建模，而不是问卷自动化；Listen Labs 和 Outset 则揭示相邻供应商如何组织共创设计、招募、主持和综合分析工作流。合在一起，这些来源意味着 Aaru
              的产品挑战不只是生成合成答案，而是把从输入定义到可用于决策的输出这一整套流程运营成可重复工作流。该工作流可能同样依赖数据质量、场景设计和模型行为控制，而不只是底层 LLM 或智能体框架。
