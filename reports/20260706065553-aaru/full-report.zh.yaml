  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块
        blocks:
          - type: paragraph
            body: >-
              Aaru 的产品最好被理解为决策模拟平台，而不是狭窄问卷工具。公开网站描述了一个重建世界的多智能体模拟系统，关于页面又把这项使命扩展为更宽的全世界模拟愿景。实践中，公司将它包装为三条可见产品线：Lumen
              服务商业研究和上市问题，Seraph 服务公共部门沟通和政策设计，Dynamo 服务政治预测和信息传递。这种模块化框架很重要，因为它说明 Aaru
              卖的不是单一民调工作流。公司试图把一套共享的合成人群引擎，应用到多个客户工作流中；这些场景决策风险高，直接田野工作可能慢或贵。


              产品界面仍比明确披露更有野心。Aaru 自己没有发布公开价格页、公开 API
              文档、可靠性仪表盘或详细模块层级。不过，官方产品页确实展示了覆盖营销、政府和政治的连贯客户任务地图。结果是，产品故事有很强的客户工作流框架，但技术披露有限。尽调中可复用的事实是，Aaru
              已经把自己呈现为一个拥有不同领域特定界面的多模块软件平台，而不是一次性服务咨询公司。开放问题是，这些模块究竟是同一引擎之上的真实产品化层，还是围绕同一套定制模拟工作流贴上的不同包装标签。
