      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: Aaru 的定价基于未来品类归属权，而不是当下软件透明度
            body: 这可能是成功的风险投资模式，但前提是公司之后证明自己拥有一条持久的新预算线，留存强劲且表现经基准验证。
