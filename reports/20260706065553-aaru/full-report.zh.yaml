      - number: '1.2'
        title: 平台与方法论轮廓
        blocks:
          - type: paragraph
            body: >-
              Aaru 的公开产品故事很宽，但逻辑连贯。Lumen 是面向企业的产品线，服务营销、分群、价格测试和上市策略；Seraph 把同一套预测引擎映射到公共部门沟通、危机响应和政策排序；Dynamo
              则把方法用于政治，包括选举预测和信息测试。在这些界面上，公司反复承诺：组织可以在投入资本或推向市场之前，先压测决策。这一点关键，因为它把 Aaru
              放在更像决策模拟器的位置，而不是问卷工具。如果这个更高阶主张站得住，就能支撑更高的企业预算，并让采用从战术工具变成战略配置。


              关于系统如何运作，最强的外部描述来自 Semafor 和 TechCrunch。这些报道称，Aaru 会生成数千个 AI 智能体；在部分政治民调工作流中，受访者规模约为 5,000
              个，并用人口普查数据、人格特征和不断更新的信息流来调校它们，以模拟真实媒体摄入结构。Semafor
              还称，这些民调可在不到两分钟内完成，成本低于真人调查的十分之一。速度、规模和合成个性化的组合，是这家初创公司的商业卖点核心，也解释了公司为何引来质疑。用模拟智能体替代真人受访者，不是小的工作流优化；它是在主张：建模行为比直接测量更能服务决策。因此，从尽调角度看，方法论故事是双面的：Aaru
              有差异化产品叙事，使用场景切分清楚；但它的核心优势取决于预测引擎的可信度，而这种可信度必须靠验证赢得，不能按表面叙事照单全收。
