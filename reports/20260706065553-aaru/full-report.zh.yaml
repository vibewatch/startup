      - number: '7.4'
        title: 缓释、监控与否决条件
        blocks:
          - type: paragraph
            body: >-
              公司并非没有可行缓释手段。它可以依靠许可数据纪律、正式 DPA、谈判后的企业合同、验证式案例研究和伙伴尽调。NIST 的 AI RMF 和 Playbook
              提供了一套成熟缓释应有样子的实用模板：明确治理归属，映射模型使用位置，针对已知失效模式测量，并在风险升高时用管理闭环改变部署行为。不过，Aaru
              下一步需要的是公开或半公开证据，而不是更多叙事。买方和投资人需要更清晰地看到校准流程、红队或反向案例评估、事故响应实践，以及敏感用途的升级规则。


              因此，关键监控触发器很直接。负面信号包括：高风险部署中出现公开失误，AI 主张或数据使用受到监管审视，重大伙伴 rollout
              失败，或证据显示模型在少数族裔或离群群体上失效且没有补偿性保护。正面信号包括：发布基准包、安全认证、有记录的人类参与治理，以及多元化直接客户采用。在这些出现之前，剩余风险仍然高。正确的投资姿态不是否定产品，而是在承销耐久性之前，对验证、治理和集中度提出异常严格的尽调要求。
