  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方地图与细分组合
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Aaru 面向几个相邻买方群体销售，而不是只盯一个狭窄研究角色。公司自己的产品页把产品拆成商业、公共部门和政治工作流，意味着至少有三个可见终端使用环境。第三方报道把地图进一步扩宽：Research
              Live 称 Aaru 与政治竞选和企业合作，Semafor 称 Fortune 500 公司、智库、super PAC 和竞选团队都曾聘用它，TechCrunch 则明确点名
              Accenture、EY、Interpublic Group 和政治竞选为客户伙伴。合在一起，今天最能支撑的客户细分是企业营销人员和战略人员、代理商与渠道伙伴、政治运营者，以及公共部门或政策用户。


              更不清楚的是，谁真正付费，谁只是通过伙伴主导的渠道使用 Aaru。Aaru 的公开网站仍是销售主导：没有公开定价、没有自助套餐表，也没有公开 onboarding
              文档。联系页面把意向导向一次对话，而不是交易式购买。不过，登录入口意味着售后存在真实的账号化使用。这个模式符合年轻企业产品：仍主要靠直接或战略关系销售，而不是大规模自助采用。因此客户章节从一个简单结论出发：需求信号真实存在，但当前大部分公开证据仍来自具名伙伴和用例故事，而不是可见的直接软件客户指标。
