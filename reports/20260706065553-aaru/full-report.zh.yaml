      - number: '8.3'
        title: 可比公司与情景框架
        blocks:
          - type: paragraph
            body: >-
              没有一个可比对象完全干净，但几个案例仍有信息量。Qualtrics、Momentive、UserTesting 等成熟洞察平台，交易价格大约在 $1.3 billion 到 $12.5 billion
              之间；它们披露的客户足迹远更广，商业包装也比 Aaru 公开展示的更成熟。Qualtrics 私有化时平台上有超过 19,000 家组织。Momentive 服务超过 330,000
              家组织。UserTesting 在 $1.3 billion 私有化前已经上市。这些不是完全可比对象，因为 Aaru 更早期、更 AI
              原生，野心也可能更大。但它们有助于提醒：洞察技术栈里的十亿美元估值，历史上通常对应比 Aaru 已公开披露更可见的收入规模和客户广度。


              因此，情景框架很重要。如果 Aaru 能证明 ARR 超过 $50 million，留存强劲且利润率有差异化，$1 billion
              估值就容易辩护得多；如果它进一步长成平台品类，让投资人给出高增长软件倍数，就更容易。相反，如果公司仍是由伙伴中介、直接经济性未成规模的研究工具，成熟平台可比对象就不再帮忙，价格开始像纯叙事溢价。因此，情景演练支持一个中间立场：上行期权真实存在，但当前价格已经嵌入了很大一部分梦想。
