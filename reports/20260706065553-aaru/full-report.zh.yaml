      - number: '6.4'
        title: 耐久性缺口与客户风险
        blocks:
          - type: paragraph
            body: >-
              客户尽调最大的难题不是缺少
              logo，而是缺少分母。公开来源没有披露客户数量、续约率、合同期限、ACV、NRR、GRR、部署数量或流失率。即使最好的公开证据，也被包装成案例研究或伙伴声明；它们证明有用，却不证明可重复。因此很难回答基本耐久性问题：有多少账户在生产环境使用、多少已经扩张、多少在初次测试后留下来，以及收入在少数代理商、竞选团队或企业赞助方之间有多集中。


              还有一类由方法论驱动的客户风险。Bain 和 Qualtrics 都警告，合成方法仍需按传统研究的同一标准测试，不能在所有场景取代真人反馈。GWI
              围绕真人调查数据的定位，从竞争对手角度强化了同一点：看重可辩护、高风险洞察的买方，可能仍会偏好扎根真实受访者或混合验证的产品。这不会抹掉 Aaru
              的采用故事，但会重塑它。公司似乎有能力赢得高关注试点和战略合作；未决问题是，这些胜利能否转化为多元客户群中的持久、可重复支出。这是进入估值和建议工作前，最核心的客户风险。
