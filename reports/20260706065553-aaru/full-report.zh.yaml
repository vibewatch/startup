      - number: '7.2'
        title: 隐私、安全与运营不透明
        blocks:
          - type: paragraph
            body: >-
              Aaru 并非没有治理材料。隐私政策、数据处理协议和用户条款显示，公司正努力满足企业对基础法律结构的预期。DPA 引用了 GDPR 时代的义务，Interpublic
              合作也强调许可数据使用和伦理优先姿态。这些信号有意义。但它们只是基线信号，还不能完整证明运营栈已经达到大型企业信任要求。本报告审阅的公开材料仍未披露 Aaru
              的正常运行时间承诺、事故历史、安全认证或公开事后复盘做法。也没有公开基准包，说明模型质量如何跨细分人群监控，或在真实生产中多频繁地用人类数据验证输出。


              监管机构和企业买方正在要求更强的证明负担，缺口因此会放大。ICO 的 AI 指南强调 GDPR 原则和可解释性，NIST 框架推动组织明确治理、映射、测量和管理 AI 风险。Aaru
              很可能在内部做了不少工作，但公开证据尚未证明。换句话说，隐私和运营风险不是一个疏忽故事，而是一个不透明故事。公司有足够政策资料通过第一轮尽调，但披露的运营证据还不足以让最敏感部署完全通过采购、合规或声誉审查。
