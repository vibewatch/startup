    summary: Aaru 最严重的风险集中在方法论有效性、高风险用途的监管审查和合作伙伴集中，而不是已清楚观察到的产品宕机。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 方法论 / 有效性风险
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 低至中
              tone: neutral
            - label: 高
              tone: negative
        - label: 监管 / 宣称风险
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
        - label: 隐私 / 可解释性风险
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
            - label: 中
              tone: neutral
            - label: 中至高
              tone: negative
        - label: 合作伙伴集中风险
          values:
            - label: 中至高
              tone: negative
            - label: 高
              tone: negative
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
        - label: 运营不透明风险
          values:
            - label: 中
              tone: neutral
            - label: 中
              tone: neutral
            - label: 低
              tone: negative
            - label: 中
              tone: neutral
        - label: 财务 / 模型风险
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 低至中
              tone: neutral
            - label: 高
              tone: negative
    claimRefs:
      - CR006
      - CR020
      - CR027
      - CR029
      - CR031
      - CR032
      - CR034
      - CR037
      - CR039
  - id: FR002
    title: 风险传导图
    type: flow
    summary: 核心技术和法律风险会迅速传导到客户信任、合作伙伴话语权、增长韧性，并最终影响估值支撑。
    data:
      nodes:
        - id: model
          label: 模型有效性风险
          description: 合成输出或许很快，但在边缘场景里未必足够可靠。
        - id: privacy
          label: 隐私 / 数据权利风险
          description: 合法使用和可解释性必须经得起审查。
        - id: claims
          label: 宣称 / 执法风险
          description: 缺乏支撑的准确率或自动化宣称可能引发反噬。
        - id: trust
          label: 客户信任
          description: 买方和合作伙伴需要相信治理能力和输出质量。
        - id: partners
          label: 合作伙伴话语权
          description: 大型渠道和标杆客户背书会左右采用。
        - id: growth
          label: 增长韧性
          description: 续约、扩张和更广部署都要靠信任支撑。
        - id: valuation
          label: 估值支撑
          description: 信任不足或增长放慢，会削弱溢价倍数。
      edges:
        - from: model
          to: trust
        - from: privacy
          to: trust
        - from: claims
          to: trust
        - from: trust
          to: partners
        - from: trust
          to: growth
        - from: partners
          to: growth
        - from: growth
          to: valuation
    claimRefs:
      - CR027
      - CR032
      - CR034
      - CR035
      - CR036
      - CR037
  - id: FR003
    title: 依赖关系图
    type: flow
    summary: Aaru 当前风险画像很大程度上受数据来源、旗舰合作伙伴、验证背书和治理成熟度牵动。
    data:
      nodes:
        - id: data
          label: 授权 / 专有数据
          description: 输入质量和权利可抗辩性关系到法律与产品信任。
        - id: ipg
          label: Interpublic / Acxiom
          description: 主要可见的规模化与渠道合作伙伴。
        - id: accenture
          label: Accenture Song
          description: 战略集成商，也是企业信任放大器。
        - id: ey
          label: EY 背书案例
          description: 速度和相关性的旗舰证明。
        - id: gov
          label: 治理栈
          description: 政策、DPA，以及任何内部验证或监督闭环。
        - id: sensitive
          label: 敏感使用场景
          description: 政治、政策和声誉压力高的部署。
      edges:
        - from: data
          to: gov
        - from: gov
          to: sensitive
        - from: ipg
          to: sensitive
        - from: accenture
          to: sensitive
        - from: ey
          to: gov
        - from: data
          to: ipg
        - from: data
          to: accenture
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR013
      - CR033
      - CR034
      - CR039
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 投资结论一边有真实证明和巨大的上行可选性，另一边又被披露经济性薄、残余风险高所牵制。
    data:
      nodes:
        - id: proof
          label: 真实早期证明
          description: Redpoint、Accenture、EY、Interpublic 和 Semafor 都给出了真实牵引力信号。
        - id: optionality
          label: 大上行可选性
          description: 如果产品市场匹配扩大，Aaru 可能成为更广义的决策基础设施。
        - id: economics
          label: 披露经济性稀薄
          description: ARR、留存、定价和利润率大多仍未公开。
        - id: risk
          label: 高残余风险
          description: 方法论、合作伙伴集中和治理风险仍然不小。
        - id: stance
          label: 继续研究 / 估值偏高
          description: 值得认真尽调，但必须守住价格纪律。
      edges:
        - from: proof
          to: optionality
        - from: proof
          to: stance
        - from: optionality
          to: stance
        - from: economics
          to: stance
        - from: risk
          to: stance
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV015
      - CV031
      - CV041
      - CV042
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: Aaru 只有把 ARR 从公开线索显示的低于 $10M 明显做大后，估值才更容易辩护。
    data:
      items:
        - label: ARR <$10M，名义估值 $1B
          value: 100
          note: 公开线索隐含 100x+ ARR 倍数
        - label: ARR $25M，估值 $1B
          value: 40
          note: 除非留存和利润率极强，否则仍然很贵
        - label: ARR $50M，估值 $1B
          value: 20
          note: 更接近顶级高增长软件公司的区间
        - label: ARR $100M，估值 $1B
          value: 10
          note: 如果平台论点成立，开始显得保守
    claimRefs:
      - CV007
      - CV008
      - CV036
      - CV037
      - CV038
  - id: FV003
    title: 投资 KPI
    type: kpi
    summary: Aaru 在野心和想象力上得分高，但披露经济性、证据完整性和风险调整后估值支撑较弱。
    data:
      items:
        - label: 市场想象力
          value: High
          description: AI 驱动洞察和模拟仍是很有吸引力的主题。
        - label: 客户证明
          value: Medium
          description: 有具名背书，但证据仍集中，且由合作伙伴居中。
        - label: 护城河可见度
          value: Medium
          description: 可能存在，但公开层面尚未经过深度基准测试。
        - label: 经济性可见度
          value: Low
          description: 收入、留存和利润率披露太薄。
        - label: 风险调整后估值
          value: Low
          description: 名义价格跑在已披露基本面前面。
        - label: 尽调优先级
          value: High
          description: 缺失的数据室材料是决策核心。
    claimRefs:
      - CV031
      - CV032
      - CV041
      - CV042
      - CV045
