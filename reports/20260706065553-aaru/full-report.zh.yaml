      - number: '6.2'
        title: 具名客户证据与结果
        blocks:
          - type: paragraph
            body: >-
              今天最清晰的具名证据来自 EY、Accenture 和 Interpublic。EY
              的案例研究是最强的结果型证据，因为它同时给出速度和准确度标记：一项耗时六个月的全球财富研究用一天重建，且仿真输出据称与最终调查的相关性超过 90%。Accenture 的新闻稿有另一种价值：它把 Aaru
              直接放进 Accenture Song 的产品开发、营销、客户战略和客户服务工作流，使这段关系看起来是运营性合作，而不只是财务投资。Interpublic 的公告又添加第三种证据——可规模化的代理商分发。公告称
              Aaru 已用于金融服务、医疗健康和消费品的多个项目，并且预测仿真将嵌入 Interact 的活动设计模块。


              这些例子共同说明，Aaru 赢下的不只是好奇心，而是进入大型组织和面向客户工作流的入口。但证据仍不均衡。EY 给出清晰基准，却只有一个展示案例。Accenture 描述广泛使用潜力，但没有披露客户数量或
              rollout 深度。Interpublic 提供最丰富的垂直行业覆盖和工作流细节，但多数终端客户 logo 仍未公开。因此，具名证据方向上很强，但若要承销采用耐久性，仍然不完整。它支持 Aaru
              正进入有意义的企业环境，却还不能证明用量已经广泛、粘性强，或可在大规模存量客户中独立续约。
