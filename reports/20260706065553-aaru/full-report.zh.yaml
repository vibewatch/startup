  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 方法论与监管敞口
        blocks:
          - type: paragraph
            body: >-
              Aaru 的核心风险，正来自它最有意思的地方：它要求买方信任合成人群，用它替代直接真人研究，或至少先于真人研究。这让风险面远大于普通分析工具。媒体、研究和 UX
              方法论领域的公开批评者认为，合成受访者可能在方向上有用，但仍会漏掉关于波动性、子群体行为和边缘案例的关键细节。Mother Jones 把问题定义为极化和误表述风险，Pew
              担心替代真实受访者会抹去公众声音，Nielsen Norman Group 则总结证据称，合成用户往往更擅长跟踪趋势，而不是效应大小或离群行为。STRAT7、NIQ、Kantar、Bain 和 Qualtrics
              从不同角度强化同一个核心警告：快速的合成输出不自动等于决策级证据。


              Aaru 会直接承受这点影响，因为它的公开足迹包括政治、政策和营销用例。竞选测试或产品构思中的错误是一回事；选举、政策或社会敏感场景中的错误，会带来声誉风险，甚至监管敞口。欧洲议会对 AI Act
              的解释把民主进程系统列为更高风险领域，要求透明度、日志、准确性和人工监督；FTC 的 AI 执法行动也清楚表明，缺乏支撑的 AI 主张不会因为包着前沿科技语言就受到保护。因此，最大风险不是 Aaru
              没有产品，而是公开证据仍没有清楚界定：产品该在哪些边界条件下获得信任，哪些情况下不该获得信任。
