      - number: '2.2'
        title: 规模口径与需求信号
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持一个很大的市场背景，但还不能给合成研究一个干净的独立 TAM。Statista 最宽口径显示，2023 年全球市场研究行业收入接近 $54 billion，较 2008 年增加超过 $20
              billion，其中北美贡献超过一半收入。这为 Aaru 和同类公司想要重新分配的传统支出池提供了合理的上限锚。另一端，MarketsandMarkets 给出更宽泛的宏观 AI 框架，称当前 AI 机会超过
              $50 billion，到 2026 年会扩大到超过 $300 billion。这些数字作为资本市场信号有方向价值，但太宽，不能直接当作 Aaru 的
              TAM。两端之间才是真正的尽调问题：研究、策略和相邻决策支持支出中，到底有多少能被合成受访者和模拟工作流触达？


              即使缺少直接美元规模，需求信号也在明显上升。Statista 的 AI 消费者白皮书基于三大主要市场逾 12,000 名消费者，称 AI
              人格画像正在影响信任和忠诚度，这支撑了模拟驱动消费者研究的相关性。Forrester 的买方研究显示，生成式 AI 正在重塑企业采购方式；Greenbook 和 GRIT 则显示，市场研究行业正围绕 AI
              和合成数据积极改造。Rival 的 2026 年趋势数据进一步强化了采用理由：多数研究人员对 AI 辅助报告感到兴奋，近半数预计 AI 预算会上升。结果是一个可辩护但受证据约束的市场图景：传统研究市场很大，AI
              支出顺风很强，对合成方法的兴趣可见，但合成预测平台真正可服务的切片仍未标准化，且由供应商自行定义。
