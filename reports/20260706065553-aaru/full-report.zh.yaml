      - number: '1.4'
        title: 融资、公开叙事与里程碑
        blocks:
          - type: paragraph
            body: >-
              相比公开经营披露，Aaru 的融资叙事异常突出。TechCrunch 报道称，公司完成了 Redpoint Ventures 领投的 Series A，其中一部分按 $1 billion
              标题估值定价；但由于投资人进入层级不同，混合估值低于这一水平。Crunchbase 的 2025 年 12 月独角兽汇总印证了 Redpoint 领投、$50 million-plus
              的说法，也印证该轮融资中存在较低价格部分。TechCrunch 还报道称，Aaru 此前已从 A*、Abstract Ventures、Felicis、General Catalyst、Accenture
              Ventures 和 Z Fellows 获得未披露金额的种子轮和种子前融资。对于一家很年轻的 AI 公司，这是一组可信投资人；但缺失数据同样显眼：Series A
              的准确规模除了下限外未知，累计融资额未公开，该轮融资时 ARR 据称仍低于 $10 million。


              对如此早期的公司来说，Aaru 的公开叙事也格外媒体化。CNBC 在 2026 年 3 月和 4 月做了创始人访谈，Apple Podcasts 在同一周邀请创始人亮相，Wall Street Journal
              则把这家初创公司写成由青少年创立、第一间总部临时拼出的公司。与此同时，负面记录已经具有实质性。Semafor 对 2024 年选举周期的跟进称，Aaru 大多数预测都错了；创始人则为 AI
              民调辩护，称其更快、更便宜，而且方向上仍优于既有方案。Mother Jones、Pew、Qualtrics、Kantar 和 Bain
              从不同角度强化了同一个尽调结论：合成受访者可能有用，但举证责任很高，因为它们可能误呈边缘人群、过度拟合互联网数据，或跑在训练数据质量前面。换句话说，Aaru
              已经完成了异常出色的资本形成和曝光，但强故事与透明经营证明之间的缺口还没有闭合。
