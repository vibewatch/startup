          - type: paragraph
            body: >-
              公开牵引力证据很薄，但方向上有信息量。TechCrunch 和 Medical Device Navigator 都将 Aaru 在 Series A 前后的 ARR 放在 $10 million
              以下，这与一家年轻公司基于品类野心和增长预期融资、而非成熟规模融资相吻合。AIbase 发布了最丰富的经营数据点——每月超过三百万次模拟、单次模拟平均成本约八美分、毛利率约 75%、专家网络超过 500,000
              个 AI 群体。这些线索有用，但应谨慎对待，因为它们来自声誉较低的媒体，且没有得到 Aaru 自身印证。即便如此，如果方向大体正确，隐含模型看起来更像软件，而不是重人工服务，尤其是在用量能比支持成本更快扩张时。


              第三方证明点也关系收入质量，即便它们本身不是财务披露。EY 一天重建六个月研究流程、Accenture 的分发叙事，都说明买方为什么可能在公开价格有限时仍为 Aaru
              付费。这些参照暗示，公司销售的是速度、预测框架和企业工作流适配，而不只是廉价自动化。反向解读同样重要：Mother Jones
              显示，如果决策质量或代表性受到质疑，更低成本和更快周转可能会招来审查。从财务角度看，Aaru
              似乎处在一个尴尬但可投资的区间：价值清楚到足以赢得关注，但公开验证数据太少，尚无法有信心判断毛利率韧性、实际定价或客户集中度。
