  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构
        blocks:
          - type: paragraph
            body: >-
              Aaru 的竞争集合比普通问卷软件同行更宽，因为它至少横跨三种完成同一任务的模式。第一类是 CulturePulse 和 Simile 这类模拟优先供应商，它们围绕人类行为或社会反应建模定位自己。第二类是
              Listen Labs、Outset 和 Evidenza 这类 AI
              主持的研究工具，它们同样承诺速度和自动化，但相比全人口模拟，仍更接近访谈、样本和工作流加速。第三类是既有玩家和替代方案——Qualtrics、UserTesting、SurveyMonkey、GWI、NIQ，以及代理商主导的研究工作流——它们依靠真人受访者、可信数据样本或既有企业关系，而不是合成人群。TechCrunch
              自己把 Aaru 同时放进社会模拟初创公司和仍向真人提问的 AI 工具之中，也凸显了这种碎片化。


              这很重要，因为竞争问题不只是“谁能生成合成受访者”。真正的问题是，谁能最快降低买方不确定性，并用足够信任拿到预算。Aaru
              覆盖商业、政府和政治的官方分类显示，公司瞄准的是宽泛的决策模拟品类，而不是狭窄的市场研究切口。宽野心给它攻击多个垂直的空间，也让它暴露在多类竞争者面前：模拟实验室、AI
              研究软件、真人洞察平台、传统问卷系统，以及能把类似能力包进既有服务合同的咨询公司。后续尽调的正确框架因此不是“谁最像 Aaru？”，而是“哪一种替代方案能给买方足够速度、信任和工作流适配，从而不选 Aaru？”
