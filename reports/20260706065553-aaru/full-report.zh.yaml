      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Aaru 这个品类的买方地图异常跨职能。在企业场景中，经济买方可能是
              CMO、首席洞察官、产品负责人或战略高管，日常用户则是研究团队、战略人员、媒体规划师、数据科学家和产品营销人员。在代理商和咨询公司里，用户可能转为服务交付团队，他们把合成研究打包进更广的客户项目。在政治和政策场景中，买方包括竞选团队、智库、倡议组织和公共部门沟通团队。Aaru
              自己的产品分类和 EY 的案例参照直接支持这种切分；Accenture 的合作则提示，分发可能越来越多地通过已经控制客户关系和工作流设计的服务公司完成。


              更广泛的 B2B 采购数据也能看出采用机制。Forrester
              称，采购小组变大，采购部门影响力上升，试用对降低风险至关重要；这意味着合成研究供应商需要强试点、验证和低摩擦证明点，而不是抽象的宣传稿。这与品类证据相吻合：EY 一天重建六个月研究、Evidenza
              关于周期时间和完成率的主张、Accenture
              关于几分钟内模拟受众的承诺，都是用来支撑试用采用的价值证明。同一逻辑也解释了为什么付费方可能在完全信任之前就容忍这个品类：当研究周期很慢、响应率偏弱或受众难以触达时，即便只是部分预测提升，也足以支撑试点预算。但通向规模化支出的路径，很可能靠可重复的运营证明，而不是一次性创始人叙事。
