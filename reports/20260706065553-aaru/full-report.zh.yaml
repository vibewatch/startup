  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代栈
        blocks:
          - type: paragraph
            body: >-
              不应把 Aaru 当作泛 AI
              公司分析，甚至也不应把它当作泛问卷软件供应商分析。它当前的产品界面横跨商业策略、政府决策支持和政治预测，相关市场更像市场研究、模拟软件和决策支持工具的混合体。商业端与传统洞察预算重叠，包括分群、品牌认知、上市测试、定价和营销策略；公共部门和政治界面则延伸到政策沟通和民调工作流。这种宽度很重要，因为它扩大了可想象支出池，但也意味着任何直接
              TAM 主张都必须谨慎设边界。Aaru 卖的不是全部 AI、全部分析或全部营销科技；它卖的是建模受众预测，应用在决策高风险、真人样本研究慢、贵或难以开展的场景里。


              替代栈进一步厘清了市场边界。TechCrunch 将 Aaru 描述为一种在目标是预测未来行为时替代问卷和焦点小组的方案，Semafor
              则把针对真人的传统民调视为政治场景中的既有替代方案。落到实践，当前市场至少包括五条完成同一任务的路径：真人问卷样本、焦点小组和定性田野、内部分析与实验、代理商主导的策略工作，以及合成受众平台。因此，这个品类更应被理解为插入决策工作流，而不是一个独立软件席位数市场。买方付费，是为了在投入预算、信息、政策排序或产品上市资本之前降低不确定性。这种框架也解释了为什么
              Accenture Song 和 IPG 这样的相邻服务公司如此关键：它们站在研究、策略和执行的交叉口，因此会塑造合成工具最终成为补充、渠道还是替代品。
