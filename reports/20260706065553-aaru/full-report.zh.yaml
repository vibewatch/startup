  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              Aaru 的估值故事，起点是异常强的「野心 / 年龄」比。公司似乎已经拿到显著早期证据：Redpoint 领投 Series A，Accenture 和 Interpublic 是公开伙伴，EY
              提供了定量验证参照，Semafor 记录了至少一次异常准确的政治预测。如果这些信号复合成更广泛的预测基础设施业务，今天的溢价就可以被解释为风险投资式期权价值：押注一个品类定义平台。这是多头论点。


              反论点同样清晰。公开证据看起来仍是一家非常早期的公司：收入据报低于 $10 million，定价未披露，留存未披露，利润率未披露，最强证据很大一部分由伙伴中介。在 $1 billion
              头部估值下，投资人承销的是一个未来的行为预测操作系统，而不是当下可读的软件业务。这不意味着投资不理性，但意味着它脆弱。仅看公开记录，最可辩护的建议是继续研究。公司有足够牵引力留在严肃尽调路径上，但披露的经济指标不足以让人清晰确信：按风险调整后，当前入场价格有吸引力。
