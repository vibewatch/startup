      - number: '8.4'
        title: 尽调问题与退出逻辑
        blocks:
          - type: paragraph
            body: >-
              仅靠公开证据，无法把 Aaru 的估值讲清楚；最后一步应定义什么会提升信心。第一，投资人需要真正的经济包：当前 ARR、增长、毛利率、burn、runway、净留存、logo 流失、ACV
              组合，以及伙伴来源收入与直接收入。第二，需要 cap table 和轮次结构清晰度：清算优先权栈、权利、稀释，以及不同投资人的有效混合入场价格。第三，需要证明核心产品拥有可重复扩张逻辑，而不是一次性旗舰引用。


              退出逻辑可行，但仍有条件。若 Aaru 成为持久决策层，战略买方可能包括大型代理商、体验管理平台、企业数据公司或更广泛的 AI
              应用厂商。财务买方在这么早阶段更难承销，除非收入模型快速成熟。实际而言，最重要的估值纪律是避免把期权性误认为必然性。公司值得认真关注，但公开记录仍指向高度不确定性、偏高的定价，以及在把当前估值视为基本面支撑之前，需要异常深入的后续尽调。
