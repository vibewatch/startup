  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与产品包装
        blocks:
          - type: paragraph
            body: >-
              关于 Aaru 商业模式，最强的公开证据来自其平台条款，而不是价格页。用户条款说得很清楚：Aaru Platform 不是公开自助应用；它面向在 Aaru 服务协议下使用系统的客户或受邀方，只有在 Aaru
              创建门户账户后才能访问。平台被描述为一个安全环境，用于传输与模拟相关的文件和信息，这强烈指向基于账户的企业部署模式。再结合公开网站以演示和联系为主的动作，可以看出一种混合商业结构：带平台访问的企业服务协议，而不是开放式订阅结账。


              这种包装很重要，因为它同时塑造收入质量和成本结构。Aaru 当前网站没有发布标价、公开席位层级、用量区间或标准合同下限。相比之下，几个相邻研究工具有这些信息。Qualtrics 和 UserTesting
              仍采用报价驱动的企业包装，但至少露出了价格如何被框定。Lyssna 和 SurveyMonkey 走得更远，给出可见的自助锚点。因此，Aaru 的不透明对高端企业 AI
              公司来说并不反常，但会降低承保信心，因为市场无法判断公司是通过年度 SaaS 合同、按用量计费的模拟调用、定制服务，还是三者组合来变现。Aaru 的条款和门户架构指向企业软件加服务，但准确商业拆分仍未披露。
