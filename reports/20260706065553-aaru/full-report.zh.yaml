      - number: '4.4'
        title: 财务尽调阻断点与结论
        blocks:
          - type: paragraph
            body: >-
              主要财务阻断点不是公开证据为负，而是几乎每个承保层都不完整。Aaru 的条款、门户流程和客户参照支撑了一个可信的企业软件加服务故事。二手报道显示 ARR 低于 $10
              million、需求健康，且单位经济可能有吸引力、像软件。竞争对手价格页则显示，这个市场既有报价制企业工具，也有低摩擦自助产品；如果 Aaru
              的模拟证明明显更好，它有可能以溢价变现。但已审阅的公开来源没有一个披露实际定价、客户集中度、留存、按产品线拆分的毛利率，或服务与经常性软件之间的拆分。


              这种不完整很关键，因为一家成立约一年的公司按 $1 billion 标题估值融资，不能只靠叙事承保。文件问题也真实存在：官方 SEC 和 USPTO 门户存在，但 Aaru
              公开网站没有给出直接文件标识符，也没有可供退回使用的上市公司式披露包。从财务尽调角度，报告结论因此偏保守。Aaru
              看起来可融资，也具备商业合理性；但证据仍与多种经济现实相容：高毛利软件平台、服务很重的定制模拟店，或尚未证明可重复收入质量的混合体。任何严肃投资或交易对手尽调，都需要数据室提供当前
              ARR、客户分群、算力支出、burn、runway 和合同结构，之后才可能负责任地判断估值。
