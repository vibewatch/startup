  - id: TV003
    title: 多头 / 基准 / 空头情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 多头
        - Aaru 达到 $100M+ ARR，保持强增长，拿到高溢价 AI 软件倍数，并成为平台基础设施
        - $100M ARR 乘以约 20x，未计稀释或战略溢价前可对应约 $2B EV
        - 执行跨度、监管审查、证据耐久性
        - 有可能，但取决于超强执行
      - - 基准
        - Aaru 达到 ~$50M ARR，留存可信，且合作伙伴线索能真实转成直客
        - 按 ~$50M ARR、约 20x 计算，可支撑约 ~$1B EV；这意味着只有重大风险出清后，今天的价格才算公允
        - 留存、直销证据、毛利质量
        - 公开证据下最中性的表述
      - - 空头
        - Aaru 仍未成规模，或主要靠合作伙伴中介，直接变现有限、验证放慢
        - <$25M ARR 或倍数压缩，都意味着显著低于名义估值
        - 叙事跑在经济性前面，出现 down round 或退出平淡
        - 如果当前证明无法复利，这是实质风险
      - - 战略上行情景
        - Aaru 在完全独立成熟前，对更大的洞察、数据或代理机构平台具备战略价值
        - 可凭战略溢价跑赢上市可比公司的估值账
        - 退出时间和买方胃口不确定
        - 真实存在，但很难靠公开来源核验
      - - 融资压力情景
        - 后续轮次把公司重新定价到更接近较低混合估值，而不是名义估值
        - 即便运营继续推进，回报数学也会被稀释
        - 清算优先权堆栈、稀释、信号风险
        - 如果里程碑滑坡，影响显著
    notes: 情景测算仅供示意，因为公开来源不足以支持完整模型，也无法做纳入 cap table 的回报分析。
    claimRefs:
      - CV008
      - CV036
      - CV037
      - CV038
      - CV040
      - CV041
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Qualtrics
        - 私有化估值和客户规模
        - ~$12.5B；>19,000 个组织
        - 展示成熟规模的体验管理平台能值多少钱
        - 比今天的 Aaru 成熟、宽得多
      - - Momentive / SurveyMonkey
        - 私有化估值和客户规模
        - ~$1.5B；>330,000 个组织
        - 为已规模化且成熟的洞察平台提供较低价格锚
        - 消费者 / 自助式组合和商业模式不同于 Aaru
      - - UserTesting
        - 私有化估值
        - ~$1.3B
        - 为商业成熟度高于 Aaru 的洞察工具提供参考锚
        - 不是合成人群平台
      - - 高增长上市 SaaS 组
        - 收入倍数基准
        - ~19.7x EV/NTM 收入中位数
        - 帮助判断乐观软件市场愿意为增长付多少钱
        - 上市可比公司更成熟，并披露经审计指标
      - - 顶级上市 SaaS 组
        - 收入倍数基准
        - ~28.6x EV/NTM 收入中位数
        - 显示精英级上市软件估值上限
        - 仍远低于 Aaru 基于低于 $10M ARR 线索隐含的 >100x
      - - 上市 SaaS 整体中位数
        - 收入倍数基准
        - ~3.5x EV/NTM 收入中位数
        - 可对更广软件市场做常识校验
        - 可能低估前沿 AI 期权价值
      - - 洞察堆栈定价同业
        - 商业包装信号
        - 企业定价常不透明，或由销售主导
        - 帮助评估变现成熟度预期
        - 不是直接估值可比对象
    notes: 可比组合刻意不完整：它混合了 M&A 锚、上市倍数基准和变现同业，因为没有干净的公开可比公司能匹配 Aaru 当前阶段和野心。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful public valuation anchors available on 2026-07-06: mature
        insights-platform transactions, public software multiple benchmarks, and monetization peers. It is not
        exhaustive because Aaru has not disclosed enough operating detail to map a tighter comp set cleanly.
    claimRefs:
