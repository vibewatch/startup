            body: >-
              融资细节比头部数字更重要。TechCrunch 报道了一轮多层结构融资，其中部分投资人实际按较低估值进入；NewsBytes 后来把结构描述为约 $450 million 与 $1 billion
              两个价格点的拆分。即便公开报道中的中间计算不完美，方向信号也很清楚：市场出清价格不是单一统一数字。这通常说明热情真实存在，价格敏感也真实存在。Redpoint 2026 年 4 月的文章似乎通过披露 $80
              million Series A 解决了一个不确定性，意味着公司现在有可观资本可以建设。但融资金额不等于估值已经被证明合理。


              如果 Aaru 在融资前后确实 ARR 低于 $10 million，头部倍数就超过 100x ARR。Clouded Judgement
              的公开软件基准显示，即使高增长上市软件队列，远期收入倍数也远低于这一水平；OpenView 的 SaaS 基准工作则提示，AI 想象力只有在变现真正落地时才支撑更好倍数。因此，入场纪律不应围绕 Aaru
              绝对意义上「便宜」还是「贵」争辩，而应围绕价格变得合理之前必须达成哪些里程碑。没有更清晰的收入、留存、利润率和稀释数据，任何接近头部估值付款的投资人，实质上都是提前为未来去风险化买单。
            claimRefs:
