            body: 头部估值叠加部分投资人的较低价格入口，说明真实兴奋存在，但资本出清当天公司究竟值多少，也经过了真实谈判。
            calloutType: risk
            claimRefs:
              - CV001
              - CV006
              - CV040
          - type: callout
            title: 证明约 $50M ARR 且留存一流，是支撑 $1B 的最清晰路径
            body: 这个门槛不是正式定律，但它是有用的纪律锚点，因为它能把隐含倍数拉近强劲上市软件队列的上沿，而不是远远超出。
            calloutType: assumption
