      - number: '3.2'
        title: 直接的合成研究与 AI 研究同行
        blocks:
          - type: paragraph
            body: >-
              在直接进入者中，Aaru 最接近的竞争对手分成两组。CulturePulse 和 Simile 强调模拟人类行为本身。CulturePulse
              的技术表述尤其强势：它称基于智能体的模拟反映真实人类行为，并明确批评通用 LLM 无法像人类一样推理、权衡取舍或作出决定。Simile 也采取类似打法，称自己是人类行为模拟平台，并指向 CVS Health
              案例，这暗示了医疗企业切口。这些公司与 Aaru 竞争的核心，不只是更快访谈或自动化，而是“模拟人群能支撑重要决策”这个主张。如果这些供应商能证明更好的决策准确度或更可辩护的行为模型，它们挑战的是 Aaru
              的护城河层，而不只是功能层。


              Listen Labs、Outset 和 Evidenza 略有不同。它们销售的更多是速度、自动化和工作流压缩，而不是全社会模拟。Listen Labs 称累计融资 $100 million，并围绕 AI
              研究员定位：寻找参与者、执行访谈，并在数小时内交付洞察。Outset 专注于一个平台内的 AI 主持访谈和综合分析；Evidenza 则面向难触达 B2B
              受众销售客户合成副本，并发布自己的准确度主张。这些供应商重要，是因为它们可能拿走 Aaru 想要的许多同一批预算，却不必说服买方相信完整合成人群可以替代一手研究。换句话说，它们可以用更窄但更容易理解的承诺切入
              Aaru：先让现有洞察工作流更快，再逐步扩展到更自主或更预测性的领域。
