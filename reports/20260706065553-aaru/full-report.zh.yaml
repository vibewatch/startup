      - number: '6.3'
        title: 渠道杠杆与扩张路径
        blocks:
          - type: paragraph
            body: >-
              Interpublic 是 Aaru 最重要的公开分发信号，因为它把代理商触达、工作流嵌入和终端客户曝光结合在一起。这项合作不只是宣布试验。它让 Interpublic 旗下代理商和客户提前使用工具和更新，把
              Aaru 放进 Interact 活动模块，并为关键客户描述 Simulation Studio 会话。换句话说，这项合作创造了一套结构化机制，让 Aaru
              可以从专业能力变成代理商主导营销流程中的可重复组件。Acxiom 让这条渠道更值得关注。它自己的公开资料强调庞大的身份和受众管理规模，也解释了 Aaru 为什么想接入这个生态，而不是独自搭建所有客户入口。


              Accenture 是第二个扩张杠杆，但形态不同。它不是拥有特定营销工作流的广泛代理商网络；Accenture Song 更像战略集成商，能把 Aaru 打包进多种企业转型场景。这一点重要，因为 Aaru
              当前公开的采用故事看起来由伙伴中介：分发、证据和企业信任都由规模大得多的组织加速。这有利于近期扩张，也带来集中风险。如果 Aaru
              的企业证据有很大一部分来自少数主要伙伴，那么伙伴优先级、采购周期或内部政治对增长的影响，可能超过自下而上的直接产品拉力。
