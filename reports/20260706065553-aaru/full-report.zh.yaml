figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开可见的里程碑显示，Aaru 在不到两年内从创立走到合作伙伴验证和独角兽融资。
    data:
      items:
        - year: 2024
          label: 创立
          description: TechCrunch 将创立时间定为 2024 年 3 月，创始人为 Fink、Koh 和 Kessler。
        - year: 2024
          label: 法律页面出现
