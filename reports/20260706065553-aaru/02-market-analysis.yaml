  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: synthetic-research-sam
    missingEvidence: No public source reviewed provides a defensible serviceable-available-market estimate specifically for synthetic market research or audience simulation.
    whyItMatters: Without a category-specific SAM, it is difficult to distinguish a real software wedge from a broad AI or research-spend narrative.
    diligencePath: Build a bottom-up model from named use cases, average contract value, and reachable buyer counts using customer and competitor disclosures.
    relatedQuestionRefs:
    - QM022
    - QM026
  - type: missing-source
    severity: material
    topic: contract-size-benchmarks
    missingEvidence: No public contract-size, ACV, or deployment-volume benchmark was found for Aaru or for the synthetic-research category more broadly.
    whyItMatters: Category attractiveness depends not only on TAM but on whether buyers fund pilots, annual contracts, or sporadic project work.
    diligencePath: Request sample order forms, pilot-to-production conversion data, and sales-pipeline segmentation from management or channel partners.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: validation-standards
    missingEvidence: Public validation claims exist, but sources use different benchmarks, datasets, and definitions of accuracy across vendors.
    whyItMatters: Category-level adoption could slow if buyers cannot compare tools on a standardized evaluation framework.
    diligencePath: Request benchmark protocols, holdout-set methodology, and edge-case failure studies across at least three vendors.
    relatedQuestionRefs:
    - QM013
    - QM017
    - QM018
  - type: stale
    severity: minor
    topic: buyer-budget-allocation
    missingEvidence: The public sources show directional AI budget growth but not how much spend is reallocated from surveys, agencies, or analytics into synthetic research.
    whyItMatters: Aaru’s real growth path depends on which budget line wins or loses when buyers adopt synthetic methods.
    diligencePath: Interview five enterprise buyers and two agencies about which budget line funds synthetic-research pilots.
    relatedQuestionRefs:
    - QM015
    - QM026
