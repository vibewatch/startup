- id: TM005
  title: Status-Quo Substitute Table
  columns:
  - Solve-the-job option
  - How buyers use it now
  - Strength
  - Weakness versus synthetic research
  - Why Aaru cares
  rows:
  - - Human survey panels
    - Measure stated preferences and attitudes
    - Accepted methodology with known procurement paths
    - Slow, expensive, and often low-response
    - Main incumbent spend Aaru wants to compress
  - - Focus groups / qual fieldwork
    - Explore motivations and reactions in depth
    - Richer qualitative nuance
    - Hard to scale quickly or repeatedly
    - Aaru competes on speed and repeatability
  - - Traditional polling
    - Track political preferences with real respondents
    - Legitimized methodology in campaigns and media
    - Fielding friction and truthfulness concerns
    - Dynamo enters here directly
  - - Internal analytics / experimentation
    - Use first-party behavioral data to infer decisions
    - Grounded in actual behavior
    - Backward-looking and limited on hypothetical scenarios
    - Aaru can augment with forward-looking simulation
  - - Agency strategy work
    - Translate research into messaging and campaign decisions
    - Embedded in execution and client trust
    - Labor-intensive and less productized
    - Partners can distribute or compete with Aaru
  - - Generic LLM tooling
    - Ad hoc persona brainstorming or copy testing
    - Cheap and accessible
    - Weak validation and poor workflow governance
    - Raises commoditization pressure on weaker vendors
  notes: Substitutes matter because buyers can solve the same decision problem in multiple ways without ever purchasing a synthetic-research platform.
