- id: sizing-lenses-and-demand-signals
  title: Sizing Lenses and Demand Signals
  body: 'Public sizing evidence supports a large market backdrop but not a clean standalone TAM for synthetic research. Statista’s broadest lens puts global market research industry revenue at almost $54 billion in 2023, up more than $20 billion since 2008, with North America contributing over half of revenue. That gives a reasonable upper-bound anchor for the legacy spend pool that Aaru and peers are trying to reallocate. At the other extreme, MarketsandMarkets offers a much broader macro-AI frame, describing more than $50 billion of current AI opportunity expanding to more than $300 billion by 2026. Those figures are directionally useful as a capital-markets signal, but they are far too broad to serve as Aaru’s TAM. Between those poles lies the real diligence task: how much of research, strategy, and adjacent decision-support spending is actually addressable by synthetic respondents and simulation workflows?


    Demand signals are clearly rising even where direct dollar sizing is absent. Statista’s AI-consumer whitepaper is based on more than 12,000 consumers across three major markets and says AI personas are affecting trust and loyalty, which supports the relevance of simulation-led consumer work. Forrester’s buyer research shows that generative AI is reshaping how businesses buy, while Greenbook and GRIT show a market-research industry actively retooling around AI and synthetic data. Rival’s 2026 trends data strengthens the adoption case further: most researchers are excited about AI-assisted reporting and nearly half expect their AI budgets to increase. The result is a defensible but evidence-constrained market picture: the legacy research market is large, AI spending tailwinds are strong, and interest in synthetic methods is visible, but the precise serviceable slice for synthetic prediction platforms remains unstandardized and vendor-defined.'
