callouts:
- calloutType: insight
  title: The legacy spend pool is big, but the synthetic slice is still vendor-defined
  body: Statista’s nearly $54B global market-research revenue figure shows why investors care about this category, but none of the public sources reviewed provides a standardized SAM or SOM for synthetic market research specifically. Aaru’s real addressable market is therefore better thought of as a reallocation opportunity inside existing research, strategy, and decision-support budgets.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM012
  - CM013
- calloutType: insight
  title: Adoption may be faster through service channels than through standalone tooling
  body: Accenture Song, Interpublic, and campaign operators matter because they already sit inside the workflows Aaru is trying to improve. If channel partners validate the method, they can accelerate category adoption; if they internalize similar capabilities, they can also squeeze vendor differentiation.
  claimRefs:
  - CM021
  - CM022
  - CM024
  - CM049
- calloutType: risk
  title: Category skepticism is not theoretical
  body: Rival’s own data shows meaningful discomfort with synthetic respondents, and independent critics from Pew to Mother Jones argue that AI respondents can distort edge populations or undercut trust. For Aaru, this means sales motion and validation discipline are part of the market itself, not just execution details.
  claimRefs:
  - CM038
  - CM043
  - CM044
  - CM045
  - CM046
  - CM047
