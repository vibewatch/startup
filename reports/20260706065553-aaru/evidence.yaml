evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Aaru does not publicly disclose board composition, voting control, or a full advisor roster beyond the Accenture
      strategic-advisor reference.
    whyItMatters: Governance concentration matters in a founder-led company that raised a unicorn-level round very early.
    diligencePath: Request the post-Series A board deck, cap table, and investor-rights summary from management or Redpoint.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: leadership-churn
    missingEvidence: >-
      No public source reviewed disclosed whether there have been any executive departures or leadership changes since
      founding.
    whyItMatters: Leadership churn would change key-person risk and execution continuity at an early-stage company.
    diligencePath: Ask management for a leadership chronology and compare it with employee and investor references.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO005
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Public revenue disclosure stops at a single TechCrunch datapoint that ARR was below $10M around the Series A;
      exact ARR, growth, gross margin, and customer concentration remain undisclosed.
    whyItMatters: A $1B headline valuation cannot be underwritten responsibly without current revenue quality and growth evidence.
    diligencePath: Request current ARR, quarterly cohort retention, gross margin, and booked-pipeline data under NDA.
    relatedQuestionRefs:
      - QO025
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: >-
      The only public headcount datapoint found was Semafor’s seven-person description from September 2024, which is
      stale by the 2026 run date.
    whyItMatters: Current staffing informs execution capacity, burn, and how much of the company remains founder-dependent.
    diligencePath: Request a current org chart and payroll headcount, or validate with a fresh LinkedIn employee audit.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: material
    topic: synthetic-research-sam
    missingEvidence: >-
      No public source reviewed provides a defensible serviceable-available-market estimate specifically for synthetic
      market research or audience simulation.
    whyItMatters: >-
      Without a category-specific SAM, it is difficult to distinguish a real software wedge from a broad AI or
      research-spend narrative.
    diligencePath: >-
      Build a bottom-up model from named use cases, average contract value, and reachable buyer counts using customer
      and competitor disclosures.
    relatedQuestionRefs:
      - QM022
      - QM026
  - type: missing-source
    severity: material
    topic: contract-size-benchmarks
    missingEvidence: >-
      No public contract-size, ACV, or deployment-volume benchmark was found for Aaru or for the synthetic-research
      category more broadly.
    whyItMatters: >-
      Category attractiveness depends not only on TAM but on whether buyers fund pilots, annual contracts, or sporadic
      project work.
    diligencePath: >-
      Request sample order forms, pilot-to-production conversion data, and sales-pipeline segmentation from management
      or channel partners.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: material
    topic: validation-standards
    missingEvidence: >-
      Public validation claims exist, but sources use different benchmarks, datasets, and definitions of accuracy across
      vendors.
    whyItMatters: Category-level adoption could slow if buyers cannot compare tools on a standardized evaluation framework.
    diligencePath: Request benchmark protocols, holdout-set methodology, and edge-case failure studies across at least three vendors.
    relatedQuestionRefs:
      - QM013
      - QM017
      - QM018
  - type: stale
    severity: minor
    topic: buyer-budget-allocation
    missingEvidence: >-
      The public sources show directional AI budget growth but not how much spend is reallocated from surveys, agencies,
      or analytics into synthetic research.
    whyItMatters: Aaru’s real growth path depends on which budget line wins or loses when buyers adopt synthetic methods.
    diligencePath: Interview five enterprise buyers and two agencies about which budget line funds synthetic-research pilots.
    relatedQuestionRefs:
      - QM015
      - QM026
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: >-
      Public sources do not show whether customers run Aaru alongside interview tools, survey tools, and agencies, or
      whether Aaru displaces them outright.
    whyItMatters: Multi-homing weakens lock-in and can cap expansion revenue even if initial adoption looks strong.
    diligencePath: Ask for win/loss analysis, displaced incumbent lists, and expansion history by customer cohort.
    relatedQuestionRefs:
      - QP018
  - type: missing-source
    severity: material
    topic: apples-to-apples-benchmarks
    missingEvidence: >-
      No public benchmark compares Aaru, simulation peers, AI-moderated tools, and human-insight incumbents on the same
      decision task.
    whyItMatters: Without standardized comparison, moat claims remain marketing-heavy and difficult to underwrite.
    diligencePath: Request head-to-head holdout tests or customer pilot results across at least three tool classes.
    relatedQuestionRefs:
      - QP019
      - QP023
