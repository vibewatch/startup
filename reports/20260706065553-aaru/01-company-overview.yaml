company:
  name: Aaru
chapter:
  number: 1
  title: Company Overview
  summary: 'Aaru is a New York-based synthetic-research startup founded in March 2024 whose public narrative combines an unusually bold simulation product story, credible partner validation from EY and Accenture, and a Redpoint-led $50M-plus Series A reported at a $1B headline valuation. The same evidence base also shows why diligence remains incomplete: public governance, headcount, and revenue disclosure are thin, while early political-polling performance already attracted skepticism.'
sections:
- id: identity-and-founding
  title: Identity and Founding
  body: 'Aaru’s current public identity is much clearer on product and mission than on corporate disclosure. As of the run date, the live public site resolves to aaru.com, not aaru.ai, and the company frames itself as a builder of simulation software that recreates the world through a multi-agent approach. The site’s about page takes that one step further by describing Aaru’s products as puzzle pieces toward whole-world simulation, which is unusually ambitious positioning for a company that only entered public view in 2024. The same official surfaces consistently point to three external-facing product families — Lumen, Seraph, and Dynamo — which collectively cover commercial, government, and political prediction use cases. The account portal, privacy policy, cookie policy, and data-processing agreement all reinforce that the company is operating a real software product and not merely a consultancy landing page.


    Founding evidence is still driven more by top-tier reporting than by a dense company self-disclosure record. TechCrunch dates the founding to March 2024, while the Wall Street Journal characterizes Aaru as a teenager-founded startup and Semafor places the founders in Manhattan while profiling their polling work. Public legal pages identify the operating entity as Aaru Inc., but they do not disclose jurisdiction, capitalization, or board composition. The company’s X profile suggests a public launch footprint starting in June 2024, which lines up with the broader narrative of a fast-moving startup that went from youth-founded project to unicorn-level financing in under two years. For later chapters, the most reusable ground truth is straightforward: Aaru is a New York-based synthetic-research software company founded in March 2024 by Cameron Fink, Ned Koh, and John Kessler, with a live commercial product surface and a public narrative built around AI simulation rather than traditional
    human-panel research.'
