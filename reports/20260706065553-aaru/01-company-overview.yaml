  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Aaru does not publicly disclose board composition, voting control, or a full advisor roster beyond the Accenture strategic-advisor reference.
    whyItMatters: Governance concentration matters in a founder-led company that raised a unicorn-level round very early.
    diligencePath: Request the post-Series A board deck, cap table, and investor-rights summary from management or Redpoint.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: minor
    topic: leadership-churn
    missingEvidence: No public source reviewed disclosed whether there have been any executive departures or leadership changes since founding.
    whyItMatters: Leadership churn would change key-person risk and execution continuity at an early-stage company.
    diligencePath: Ask management for a leadership chronology and compare it with employee and investor references.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO005
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Public revenue disclosure stops at a single TechCrunch datapoint that ARR was below $10M around the Series A; exact ARR, growth, gross margin, and customer concentration remain undisclosed.
    whyItMatters: A $1B headline valuation cannot be underwritten responsibly without current revenue quality and growth evidence.
    diligencePath: Request current ARR, quarterly cohort retention, gross margin, and booked-pipeline data under NDA.
    relatedQuestionRefs:
    - QO025
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: The only public headcount datapoint found was Semafor’s seven-person description from September 2024, which is stale by the 2026 run date.
    whyItMatters: Current staffing informs execution capacity, burn, and how much of the company remains founder-dependent.
    diligencePath: Request a current org chart and payroll headcount, or validate with a fresh LinkedIn employee audit.
    relatedQuestionRefs:
    - QO026
