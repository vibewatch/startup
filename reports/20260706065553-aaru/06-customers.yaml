  title: Customers
  summary: Aaru has credible public proof with EY, Accenture, Interpublic, and political users, showing the product is reaching real enterprise and campaign workflows rather than existing only as a concept. But the available evidence is still heavily partner-mediated and lacks denominator metrics such as customer count, retention, ACV, and concentration, so adoption quality remains only partially verified.
sections:
- id: buyer-map-and-segment-mix
  title: Buyer Map and Segment Mix
  body: |-
    Public evidence shows Aaru selling into several adjacent buyer groups rather than one narrow research persona. The company’s own product pages segment the offer into commercial, public-sector, and political workflows, which implies at least three visible end-user environments. Third-party coverage broadens that map: Research Live says Aaru works with political campaigns and businesses, Semafor says it has been hired by Fortune 500 companies, think tanks, super PACs, and campaigns, and TechCrunch explicitly names Accenture, EY, Interpublic Group, and political campaigns as customer partners. Taken together, the most supportable segmentation today is enterprise marketers and strategists, agencies and channel partners, political operators, and public-sector or policy users.

    What is less clear is who is actually paying and who is simply using Aaru through a partner-led channel. Aaru’s public web surface is still sales-led: there is no public pricing, no self-serve plan grid, and no public onboarding documentation. The contact page routes interest into a conversation rather than a transactional purchase. The login surface, however, implies real account-based usage after the sale. That pattern is consistent with a young enterprise product that is still largely sold through direct or strategic relationships instead of broad self-serve adoption. The customer chapter therefore starts from a simple conclusion: demand signals are real, but much of the current public proof still flows through named partners and use-case stories rather than through visible direct-software customer metrics.
  claimRefs:
  - CU001
