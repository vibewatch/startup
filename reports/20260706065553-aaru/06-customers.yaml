- id: durability-gaps-and-customer-risk
  title: Durability Gaps and Customer Risk
  body: |-
    The biggest customer diligence problem is not absence of logos; it is absence of denominators. Public sources do not disclose customer count, renewal rates, contract length, ACV, NRR, GRR, deployment count, or churn. Even the best public proof points are shaped as case studies or partner statements, which show usefulness without showing repeatability. That makes it difficult to answer basic durability questions: how many accounts are in production, how many have expanded, how many stayed after initial testing, and how concentrated revenue is across a small set of agencies, campaigns, or enterprise sponsors.

    There is also a methodology-driven customer risk. Bain and Qualtrics both warn that synthetic methods still need to be tested against the same standards as conventional research and cannot replace human feedback in every situation. GWI’s positioning around human-grounded survey data reinforces the same point from a competitor angle: buyers who care about defensible, high-stakes insights may still prefer products grounded in real respondents or hybrid validation. This does not erase Aaru’s adoption story, but it reframes it. The company appears capable of winning high-attention pilots and strategic partnerships; the unresolved question is whether those wins convert into durable, repeatable spend across a diversified customer base. That is the central customer-risk issue heading into valuation and recommendation work.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
