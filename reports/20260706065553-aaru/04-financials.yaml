- id: public-traction-and-unit-economics-proxies
  title: Public Traction and Unit-Economics Proxies
  body: 'Public traction evidence is thin but directionally informative. TechCrunch and Medical Device Navigator both place Aaru’s ARR below $10 million around the Series A, which is consistent with a young company that raised on category ambition and growth expectations rather than mature scale. AIbase publishes the richest operating datapoints — more than three million simulations per month, an average cost per simulation near eight cents, gross margin around 75%, and an expert network above 500,000 AI populations. These are useful clues, but they should be treated cautiously because they come from a lower-reputation outlet and are not corroborated by Aaru itself. Even so, if the direction is broadly right, the implied model looks more software-like than labor-heavy services, especially if usage can scale faster than support costs.


    Third-party proof points also matter for revenue quality, even if they are not themselves financial disclosures. EY’s one-day recreation of a six-month research process and Accenture’s distribution narrative show why buyers might pay for Aaru despite limited public pricing. These references imply the company can sell speed, predictive framing, and enterprise workflow fit rather than only cheap automation. The adverse interpretation is equally important: Mother Jones shows why lower cost and faster turnaround may invite scrutiny if decision quality or representation is questioned. Financially, Aaru appears to occupy the awkward but investable zone where value is clear enough to win attention, yet too little verified data is public to judge gross-margin durability, realized pricing, or customer concentration with confidence.'
