- id: financial-diligence-blockers-and-verdict
  title: Financial Diligence Blockers and Verdict
  body: 'The main financial blocker is not that public evidence is negative; it is that it is incomplete at almost every underwriting layer. Aaru’s terms, portal flow, and customer references support a plausible enterprise software-plus-services story. Secondary reports suggest sub-$10 million ARR, healthy demand, and potentially attractive software-like unit economics. Competitor pricing pages show the market spans both quote-based enterprise tools and low-friction self-serve products, so Aaru could plausibly monetize at a premium if its simulations prove meaningfully better. But none of the reviewed public sources disclose realized pricing, customer concentration, retention, gross margin by product line, or the split between services and recurring software.


    That incompleteness matters because a one-year-old company at a $1 billion headline valuation cannot be underwritten on narrative alone. The filings problem is also real: official SEC and USPTO portals exist, yet Aaru’s public site does not surface direct filing identifiers, and there is no public-company style disclosure set to fall back on. From a financial diligence standpoint, the reportable conclusion is therefore conservative. Aaru looks financeable and commercially plausible, but the evidence is still consistent with multiple economic realities: a high-margin software platform, a services-heavy custom simulation shop, or a hybrid that has not yet proven repeatable revenue quality. Any serious investment or counterparty diligence would need a data room with current ARR, customer cohorts, compute spend, burn, runway, and contract structure before the valuation can be judged responsibly.'
