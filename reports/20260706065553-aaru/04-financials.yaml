  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gtm-economics
    missingEvidence: No public data shows sales cycle length, CAC, payback, channel economics, or win-rate by segment.
    whyItMatters: Without GTM efficiency data, it is impossible to judge whether the contract-led model scales economically.
    diligencePath: Request funnel conversion, cycle length, CAC, channel mix, and payback by segment.
    relatedQuestionRefs:
    - QI017
  - type: missing-source
    severity: material
    topic: debt-and-obligations
    missingEvidence: No reviewed public source disclosed debt, compute commitments, or project-finance style obligations.
    whyItMatters: Large unseen obligations could materially change runway and margin quality.
    diligencePath: Request debt schedule, cloud/compute contracts, and committed spend obligations.
    relatedQuestionRefs:
    - QI019
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Public sources omit retention, concentration, discounting, gross margin by product, and services-vs-software mix.
    whyItMatters: These are the minimum metrics needed to underwrite whether Aaru deserves software-style valuation multiples.
    diligencePath: Request cohort retention, top-customer concentration, realized pricing, and contribution margin by product line.
    relatedQuestionRefs:
    - QI003
    - QI024
    - QI025
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash on hand, monthly burn, and runway are undisclosed despite large financing coverage.
    whyItMatters: A headline Series A does not indicate adequacy when compute intensity and hiring needs may be substantial.
    diligencePath: Request current cash balance, monthly burn, runway model, and next-round trigger assumptions.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI018
    - QI025
