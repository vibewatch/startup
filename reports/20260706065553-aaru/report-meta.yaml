  topStrengths:
    - Credible early validation exists through EY, Accenture, Interpublic, and public political-polling proof.
    - The product vision is broader than a narrow survey tool and could expand into a larger decision-infrastructure category.
    - Redpoint-led financing and partner visibility give Aaru a real chance to compound distribution quickly.
  topRisks:
    - Public economics remain too thin on ARR quality, retention, margins, and direct-customer durability.
    - Methodology, governance, and regulatory risks remain meaningful for high-stakes simulation use cases.
    - Partner-mediated proof may overstate the strength of Aaru’s standalone monetization and distribution engine.
  unresolvedGaps:
    - Current ARR, growth, net retention, gross margin, burn, runway, and ACV mix are not publicly disclosed.
    - The blended entry price, preference stack, dilution terms, and investor rights for the Series A are not public.
    - Direct versus partner-sourced revenue and reference quality remain under-disclosed.
    - Public benchmark packs, failure-mode data, and governance artifacts are still insufficient for a clean premium-multiple underwriting.
