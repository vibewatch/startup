      - ["AIST / G-QuAT", "Government research center", "On-premises neutral-atom system alongside ABCI-Q", "Installed deployment", "Independent reporting calls it QuEra's first system outside its laboratories", "Acceptance, utilization, revenue, and renewal are unknown"]
      - ["National Quantum Computing Centre", "UK research infrastructure", "System shipped to Tech Foundry 2", "Shipped deployment", "Independent reporting confirms shipment", "Go-live, workload, economics, and repeat purchase are unknown"]
      - ["University of Maryland QLab", "University/national laboratory", "Cloud access to Aquila for research and education", "Access agreement", "QLab director describes access to as many as 256 qubits", "User count, utilization, and paid terms are unknown"]
      - ["Merck", "Life sciences enterprise", "Quantum-reservoir molecular-property prediction", "Application study", "Named by HPCwire as a pharmaceutical end user", "No production workflow, contract value, or renewal evidence"]
      - ["Amgen", "Life sciences enterprise", "Quantum-reservoir molecular-property prediction", "Application study", "Named by HPCwire as a pharmaceutical end user", "No production workflow, contract value, or renewal evidence"]
    enumerationScope:
      coverage: sample
      basis: Six publicly named counterparties with access, deployment, or end-user evidence in the assigned source pool through 2026-10-24.
    notes: This is a representative evidence sample, not an exhaustive customer list. Named participation, shipment, or access does not by itself establish production use, recurring revenue, or retention.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009]
