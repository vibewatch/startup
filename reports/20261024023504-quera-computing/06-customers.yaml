      - ["Enterprise and life sciences", "Pharmaceutical R&D teams and enterprise innovators", "Application co-design and quantum-reservoir experiments", "Merck and Amgen named as end users in one study", "Domain proof in small-data molecular prediction", "Production workflow, paid conversion, and repeat use are not established"]
      - ["Alliance and implementation partners", "Software vendors, consultants, integrators, research organizations", "Joint go-to-market, algorithms, middleware, customer delivery", "Nineteen initial members listed in the 2024 launch", "Distribution, implementation capacity, and early access", "Partner-sourced pipeline, revenue share, and dependency are unreported"]
    notes: Public sources describe access, collaborations, deployments, and partner roles; they do not provide a common customer-count, revenue, or active-use denominator.
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU007]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Milestone, Value or status, Date, Source basis, Implication, Missing denominator]
    rows:
      - ["Public-cloud availability", "Aquila described as the first neutral-atom system accessible through public cloud", "Since 2022-11", "fobi independent directory; medium confidence", "External users can access hardware without an on-premises purchase", "Users, utilization, paid hours, and repeat rate"]
