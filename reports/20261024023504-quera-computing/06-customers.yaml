company:
  name: QuEra Computing
chapter:
  number: 6
  title: Customers
  summary: QuEra has credible evidence of public-cloud access, research partnerships, application studies, and institutional hardware deployments, but public evidence is much stronger on adoption surfaces than on repeatable commercial economics. No assigned source discloses active customer count, retention, renewal, contract value, or customer concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and channel segments
    body: "QuEra reaches several distinct populations rather than a single comparable customer base. Aquila's public-cloud availability serves researchers and developers; Pawsey and the University of Maryland QLab illustrate research, education, and HPC access; AIST and the UK's NQCC represent public research infrastructure and sovereign-compute buyers; and Merck and Amgen appear as pharmaceutical end users in an application study. The Quantum Alliance adds software companies, consultants, systems integrators, and research organizations as channels or co-development partners. This breadth expands routes to adoption, but it also mixes users, partners, research collaborators, and possible payers. Public evidence therefore does not support a single customer count or a uniform revenue interpretation across these segments."
    claimRefs: [CU001, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and proof quality
    body: "The adoption record advances from low-friction access toward physical deployment, but each milestone has a different evidentiary meaning. An independent directory describes Aquila as the first neutral-atom system available through public cloud. Pawsey documents private-cloud machine time, consulting, training, and joint software work. Independent reporting then identifies QuEra's first system outside its own laboratories at AIST and a shipment to NQCC. The Merck-Amgen-Deloitte study adds end-user application evidence: its quantum-reservoir approach beat tested classical baselines on 100- and 200-sample subsets, but the advantage was no longer statistically significant at 800 records or more. These are substantive proofs of access and experimentation, not disclosed measures of recurring production use or customer retention."
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: durability-and-expansion
    title: Expansion potential, durability, and concentration
    body: "QuEra's channel strategy can widen distribution through joint go-to-market activity, early technology access, and regional research ecosystems. Buyer-side conditions are less forgiving: QuEra's 291-respondent survey reports that only 13% had introduced or scaled applications productively, while 56% were evaluating or piloting; 46% expected flat 2026 budgets, and procurement increasingly reflects sovereignty and evidence-of-value requirements. Government and defense were the leading expected commercialization segment, ahead of large enterprise and life sciences, which supports QuEra's public-sector positioning but may also lengthen procurement cycles and increase program dependence. The central diligence limitation is economic durability. Assigned sources disclose neither QuEra-specific renewal and retention metrics nor customer revenue concentration, so named deployments cannot yet establish repeatable expansion."
    claimRefs: [CU002, CU003, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
