          touchpoints: ["Renewal and retention not disclosed", "Customer concentration not disclosed"]
          value: "Unverified"
    approximationNotes: Stages organize heterogeneous evidence and do not imply conversion rates, a shared cohort, or elapsed time between stages.
    claimRefs: [CU008, CU009, CU011, CU012, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: insight
    title: Access and deployments are credible; customer economics are not yet observable
    body: QuEra has multiple externally visible adoption surfaces, but the assigned evidence does not quantify active paying customers, repeat usage, retention, or customer-level revenue.
    claimRefs: [CU001, CU005, CU006, CU007, CU015, CU016]
  - calloutType: risk
    title: Pilot-to-production conversion remains the key customer diligence risk
    body: The company-sponsored market survey reports much broader evaluation than productive scaling, and QuEra-specific production conversion is not publicly quantified.
    claimRefs: [CU011, CU015, CU016]
