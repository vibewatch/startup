      - ["AIST deployment", "First QuEra system installed outside its own laboratories", "2025-05-30", "Data Center Dynamics reporting; medium confidence", "Physical delivery into a national HPC environment", "Acceptance criteria, utilization, revenue, and support burden"]
      - ["NQCC deployment", "System shipped to the UK's National Quantum Computing Centre", "2025-05-30", "Data Center Dynamics reporting; medium confidence", "Second named national-research deployment surface", "Go-live status, workloads, contract value, and utilization"]
      - ["QLab access", "Cloud access to Aquila with up to 256 qubits for research and education", "2026-09-22", "QuEra-issued release quoting QLab; medium confidence", "Extends the research and workforce-development channel", "User count, workloads, commercial terms, and repeat activity"]
    notes: Milestones use the source's stated status and date. Shipment, installation, access, collaboration, and production are distinct states and are not treated as equivalent revenue evidence.
    claimRefs: [CU001, CU004, CU005, CU006, CU010]
  - id: TU003
