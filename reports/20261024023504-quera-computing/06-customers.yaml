          touchpoints: ["AIST installation", "NQCC shipment", "QLab access agreement"]
          value: "Named deployments"
        - stage: Expand
          label: Expand
          title: Channel and regional reach
          touchpoints: ["Quantum Alliance joint go-to-market", "Sovereignty shapes procurement"]
          value: "Expansion mechanism"
        - stage: Retain
          label: Retain
