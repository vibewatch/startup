    title: Price is the unresolved variable
    body: >-
      Track QuEra's technical and commercial milestones, but do not underwrite the reported
      $1 billion valuation until financing terms, fully diluted ownership, cash and burn, revenue
      quality, gross margin, retention, and deployment contracts are verified.
