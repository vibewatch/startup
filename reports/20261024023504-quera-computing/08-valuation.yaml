  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: "Executed financing documents covering conversion mechanics, liquidation preferences, participation, anti-dilution, seniority, side letters, and cash actually received."
      whyItMatters: "These terms determine fully diluted ownership and whether common-equity returns can survive another capital-intensive financing."
      diligencePath: "Obtain the cap table, note or preferred-stock documents, side letters, bank statements, and a CFO reconciliation of announced versus received proceeds."
      relatedQuestionRefs: [QV005]
    - type: missing-source
      severity: material
      topic: financial-model
      missingEvidence: "Audited revenue by product, backlog conversion, gross margin, operating burn, current cash, runway, retention, customer concentration, and support burden."
      whyItMatters: "Without these inputs, revenue quality, repeatability, capital needs, and a defensible valuation range cannot be modeled."
      diligencePath: "Review audited financials, monthly management accounts, bookings and backlog cohorts, customer invoices, cash statements, and deployment-level contribution margins."
      relatedQuestionRefs: [QV003, QV009]
    - type: missing-source
      severity: material
      topic: comparable-transactions
      missingEvidence: "Directly comparable private rounds or M&A transactions with disclosed revenue, terms, technology stage, and fully diluted valuation."
      whyItMatters: "Public quantum-company metrics show sector risk but do not provide a like-for-like entry multiple for QuEra."
      diligencePath: "Build a banker-verified transaction set and normalize each observation for modality, technical maturity, revenue quality, cash, preferences, and dilution."
      relatedQuestionRefs: [QV010]
