      - [Base, "Technical progress continues and 2025 financing funds execution, but economics remain opaque.", "Defer a precise range; negotiate from fully diluted ownership and milestone evidence rather than the reported $1B mark.", "Current evidence: funding and channels, but limited financial disclosure.", "Cap-table, cash, burn, margin, backlog, and concentration remain gating."]
      - [Bear, "Fault-tolerant delivery slips; procurement remains proof-driven; losses and capital needs persist.", "Expect repricing, dilution, or preference-heavy financing; common-equity return may be impaired.", "Public peers remain loss-making and survey evidence flags commercialization delay.", "Material roadmap slip, failed conversions, down round, or punitive senior terms."]
    notes: "Scenarios are qualitative because public evidence does not disclose ownership, financing preferences, cash, burn, margins, retention, or a reliable revenue base."
    claimRefs: [CV001, CV003, CV006, CV007, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
