company:
  name: QuEra Computing
chapter:
  number: 8
  title: Valuation
  summary: >-
    QuEra has substantial financing, credible technical milestones, and expanding cloud and
    on-premises routes, but public evidence does not support a defensible entry price. The
    recommendation is Track / research more because the only observed $1 billion valuation mark
    comes from a low-reputation data profile while financing terms, cash, burn, margins, retention,
    and repeatable customer economics remain unavailable.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The evidence supports Track / research more rather than Buy. QuEra announced more than
      $230 million of financing in February 2025, although $60 million was still subject to a
      prerequisite funding condition; a later company release described the round as Series B and
      said NVentures expanded it. That is meaningful financing validation, but funding raised is
      not cash available and neither release supplies current cash, burn, preferences, conversion
      mechanics, or dilution. GetLatka reports a $1 billion valuation and labels the February
      financing a convertible note, but its revenue figure has no recorded source and its company
      profile contains an unexplained ownership assertion. The mark is therefore a diligence lead,
      not an investable price anchor. Entry discipline should require the cap table, note and side
      letters, current cash and runway, audited revenue recognition, gross margin, backlog, and
      customer concentration before underwriting a return.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that neutral-atom hardware can move from cloud research access into sovereign
      and tightly coupled HPC deployments. QuEra has announced an HPE integration path and says
      2025 produced record revenue and cash collections. The anti-thesis is timing and
      commercialization risk. Libra is targeted for cloud availability in 2028 rather than
      evidenced as a current fault-tolerant product, and a current recruiting description still
      frames calibration, benchmarking, and modeling as work needed to turn a new machine into a
      dependable product. QuEra's own survey says only 9% of respondents cited successful pilots
      as the primary spending driver, while independent coverage reports that 43% see
      commercialization behind expectations. These signals make milestone verification more
      important than technology narrative.
    claimRefs: [CV005, CV007, CV010, CV011, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable economics
    body: >-
      Public-company comparables are useful chiefly as downside evidence, not as direct multiple
      anchors: their modalities, maturity, financing access, and revenue recognition differ from
      QuEra. D-Wave, IonQ, and Rigetti all reported meaningful 2025 operating or net losses despite
      very different revenue scales. That pattern argues against capitalizing a private revenue
      estimate at a public-company headline multiple without adjusting for burn, dilution, and
      technical delivery risk. The bull case requires contracted, repeatable cloud and on-premises
      deployments, verified margins, and delivery against the 2028 Libra target. The base case is
      continued milestone progress funded by the 2025 round but without enough disclosure to
      validate the reported $1 billion mark. The bear case is schedule slippage, procurement
      friction, or sustained pre-commercial economics that forces repricing or additional
      preference-heavy capital.
    claimRefs: [CV006, CV007, CV009, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: decision-path-and-diligence
    title: Decision path, exit readiness, and thesis breaks
    body: >-
      A price can become supportable only after technical proof converts into customer-level
      economics. Near-term diligence should reconcile the company-described Series B with the
      third-party convertible-note label, confirm cash actually received, model fully diluted
      ownership through the next fault-tolerant milestone, and obtain cohort-level bookings,
      backlog conversion, deployment acceptance, support burden, and gross margin. Exit readiness
      is not established by sector enthusiasm: independent survey analysis identifies technology
      immaturity and implementation cost as the leading barriers, while the public quantum cohort
      remains loss-making. Thesis-break triggers are a material Libra delay, failure to convert
      HPE or cloud access into paid repeatable deployments, gross margin or retention below an
      agreed investment threshold, an inside-led down round, or financing terms that impair common
      equity returns. Until those checks clear, the reported valuation should not determine entry.
    claimRefs: [CV001, CV003, CV006, CV007, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
