callouts:
- calloutType: insight
  title: What the market evidence supports
  body: QuEra is exposed to a growing but still experimental market where government and HPC demand can fund early deployments
    before enterprise ROI is proven. The strongest valuation-relevant question is not whether a large global TAM exists, but
    whether QuEra can repeatedly convert heterogeneous pilots and public programs into paid, scalable cloud, hardware, and
    co-design revenue.
  claimRefs:
  - CM003
  - CM006
  - CM010
  - CM016
- calloutType: risk
  title: Sizing and conversion gap
  body: Independent forecasts disagree materially on scope and timing, and the assigned evidence does not disclose the customer,
    pricing, retention, or revenue-mix denominators needed to derive QuEra’s SAM, SOM, or unit economics.
  claimRefs:
  - CM009
  - CM012
  - CM016
