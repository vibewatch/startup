chapter:
  number: 5
  title: Product & Technology
  summary: QuEra presents a full-stack neutral-atom platform spanning cloud-accessible Aquila hardware, the Bloqade software layer, and an emerging Gemini/on-premises path for hybrid HPC. Public evidence supports a technically differentiated architecture and meaningful research adoption, but production reliability, security controls, service levels, and the timing of fault-tolerant systems remain diligence gaps.
sections:
  - id: delivered-platform
    title: Delivered platform and user workflow
    body: >-
      QuEra's current product is not only a laboratory device. The public
      surface describes Aquila as a 256-qubit neutral-atom system available
      through Amazon Braket, while Bloqade provides a Python-oriented
      hardware-first SDK for constructing analog programs, running them on an
      emulator or hardware, and analyzing results. The workflow is therefore
      a sequence of program design, parameter assignment or sweeps, emulator
      validation, Braket execution, and post-processing. A separate public
      hiring description shows that QuEra is building system-level modeling for
      fidelity, runtime, throughput, and time-to-solution, which is relevant to
      converting hardware access into customer-relevant performance evidence.
      The QLab agreement and NERSC call show an access model that combines
      cloud or remote access, training, finite QPU allocations, and open
      research projects rather than promising unrestricted production capacity.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-differentiation
    title: Architecture, scaling, and differentiation
    body: >-
      The technical thesis is a reconfigurable neutral-atom architecture:
      rubidium atoms encode qubits, lasers manipulate them, and optical
      tweezers move atoms so that entangling operations can be performed in
      parallel. The resulting mobility and dynamic connectivity are presented
      as a way to reduce routing and error-correction overhead without the
      dilution refrigerators used by some competing modalities. The strongest
      independent technical evidence is the peer-reviewed magic-state
      distillation result, which reports improved logical fidelity for
      distilled states and identifies the experiment as a building block for
      universal fault-tolerant computation. This is credible technical
      differentiation, but it is not equivalent to a commercially available
      fault-tolerant product: the public materials still frame large-scale
      systems as a forward roadmap and do not disclose sustained production
      benchmarks, service-level reliability, or customer economics.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-trust-and-gaps
    title: Deployment, integration, and diligence blockers
    body: >-
      Deployment is expanding from cloud research toward sovereign and
      on-premises HPC. QuEra says its HPE collaboration targets integrated
      testbeds, algorithm co-design, software interoperability, and
      system-level benchmarking, while the QLab and NERSC materials establish
      concrete institutional access and bounded research programs. The
      developer surface is also active: the public organization shows current
      repositories for Kirin, Bloqade core, and atom-shuttling tools. These
      signals support an ecosystem and integration thesis, but they do not
      establish a mature enterprise control plane. Public evidence does not
      specify uptime, incident history, penetration testing, data retention,
      export-control operating procedures for commercial customers, calibration
      drift, hardware replacement policy, or the production-versus-research
      boundary for Gemini. Those omissions are material because the product
      promise depends on repeatable end-to-end quantum-classical workflows,
      not only laboratory demonstrations.
    claimRefs: [CE010, CE011, CE012, CE013]
    evidenceGaps:
      - type: missing-source
        severity: material
        topic: reliability
        missingEvidence: Public uptime, incident, calibration-drift, and hardware replacement metrics for Aquila and Gemini deployments.
        whyItMatters: Enterprise and HPC buyers need evidence that algorithm results and capacity are repeatable beyond a research demonstration.
        diligencePath: Request the last twelve months of system availability, failed-job, calibration, and replacement records by platform and deployment mode.
      - type: missing-source
        severity: material
        topic: security
        missingEvidence: Independent security assessment covering cloud access, software supply chain, credentials, data handling, and tenant isolation.
        whyItMatters: Cloud and on-premises quantum workflows may expose proprietary algorithms, scientific data, or regulated workloads.
        diligencePath: Obtain current SOC 2 or equivalent controls documentation, penetration-test summary, incident-response policy, and data-retention terms.
      - type: missing-source
        severity: material
        topic: performance
        missingEvidence: Customer-level time-to-solution, throughput, logical error-rate, and cost benchmarks on representative workloads.
        whyItMatters: Public qubit counts and research milestones do not establish economic advantage or production readiness.
        diligencePath: Request benchmark definitions, workload traces, denominators, confidence intervals, and comparison against the customer's classical baseline.
      - type: stale
        severity: minor
        topic: roadmap
        missingEvidence: Current delivery schedule and acceptance criteria for third-generation and fault-tolerant systems.
        whyItMatters: Roadmap timing determines when today's research access can become a repeatable enterprise product.
        diligencePath: Obtain the current roadmap, milestone evidence, customer commitments, and slippage history under NDA.
    tableRefs: []
    figureRefs: []
