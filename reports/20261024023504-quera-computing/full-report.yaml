  - id: FP001
    title: Competitive positioning by deployment breadth and fault-tolerance evidence
    type: quadrant
    summary: Ordinal placement separates broad access from disclosed progress toward fault-tolerant operation.
    data:
      xAxis:
        label: Deployment and ecosystem breadth
        min: 1
        max: 5
      yAxis:
        label: Fault-tolerance evidence maturity
        min: 1
        max: 5
      points:
        - label: QuEra
          x: 5
          'y': 4
          detail: >-
            Cloud, direct, and on-premises routes; company and third-party sources report logical-qubit and
            error-correction progress.
        - label: Google Quantum AI
          x: 2
          'y': 4
          detail: Strong below-threshold disclosure, but retained evidence does not establish broad external hardware access.
        - label: PsiQuantum
          x: 1
          'y': 4
          detail: >-
            Peer-reviewed manufacturable component stack; retained evidence describes a future fault-tolerant platform
            rather than current broad access.
        - label: D-Wave
          x: 5
          'y': 2
          detail: >-
            Cloud and disclosed on-premises procurement, but retained evidence centers on annealing rather than
            fault-tolerant gate-model operation.
        - label: Amazon Braket
          x: 5
          'y': 1
          detail: Broad multi-vendor access layer; it is not itself a fault-tolerant hardware program.
        - label: NVIDIA Quantum
          x: 5
          'y': 2
          detail: >-
            Broad hybrid-computing ecosystem and error-correction tooling; it integrates rather than supplies the
            compared QPU modality.
    approximationNotes: >-
      Analyst-assigned ordinal scores from 1 (narrow/early) to 5 (broad/mature); unlike technical metrics are not
      normalized, and coordinates are not measured performance.
