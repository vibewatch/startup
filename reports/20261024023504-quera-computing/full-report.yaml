      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              QuEra announced more than $230M of 2025 financing, with $60M described as payable in the near future upon
              satisfaction of a prerequisite funding condition. The announcement also says the structure, together with
              organic revenue, provides a long financial runway, but this is management's characterization rather than a
              cash balance or runway calculation. Public-sector programs provide additional demand and validation
              signals: the UK's NQCC awarded QuEra one of seven testbed contracts in a £30M program, while an
              independent company database reports a broad 51–200 employee range rather than a cost base. These signals
              may indicate channel diversification and operating scale, yet they do not prove unrestricted cash,
              recurring revenue, or profitability. The financial verdict is track/research-more: capital access appears
              stronger than the disclosure base, but investors still need the cap table, financing terms, cash
              reconciliation, burn, backlog, customer concentration, and unit economics before underwriting a valuation.
