            - label: Institutional programs
              detail: QLab and NERSC provide structured research access.
            - label: On-premises HPC
              detail: HPE collaboration targets hybrid quantum-classical environments.
        - label: Software and workflow
          detail: Tools for expressing, running, and analyzing workloads.
          items:
            - label: Bloqade
              detail: Analog program construction, parameter sweeps, emulation, execution, and analysis.
            - label: Kirin
              detail: Public digital-circuit intermediate-representation infrastructure.
            - label: Shuttling tools
              detail: Public tooling for atom movement and compiler workflows.
        - label: Physical control
          detail: Laser and optical-tweezer control of neutral atoms.
          items:
