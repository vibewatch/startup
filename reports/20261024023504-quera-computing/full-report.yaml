          - type: callout
            title: Pilot-to-production conversion remains the key customer diligence risk
            body: >-
              The company-sponsored market survey reports much broader evaluation than productive scaling, and
              QuEra-specific production conversion is not publicly quantified.
            calloutType: risk
            claimRefs:
              - CU011
              - CU015
