  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer motion
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded to quantum-computing hardware, software, cloud access, application
              co-design, and on-premises systems. Quantum communication and sensing are adjacent categories in broader
              quantum-technology forecasts, but including them would overstate the opportunity relevant to QuEra.
              QuEra’s own offer description spans cloud, on-premises, and application co-design engagements for research
              organizations, Fortune 500 companies, and government programs. The buyer set is therefore heterogeneous:
              public-sector programs and HPC centers can fund infrastructure, while enterprise teams often fund
              proof-of-concept work and application development. A market definition that treats all quantum activity as
              one homogeneous software subscription misses the different budget owners, procurement cycles, and
              technical requirements. The assigned evidence also shows that hybrid deployment matters: colocating
              quantum systems with classical and AI infrastructure is intended to reduce round-trip latency and make
              workloads fit enterprise operating environments.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
              - CM011
      - number: '2.2'
        title: Sizing lenses and uncertainty
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence supports a range, not a single TAM. McKinsey’s broader quantum-technology
              view reaches up to $97 billion by 2035, while its quantum-computing subset reaches up to $72 billion;
              these are long-horizon opportunity estimates, not QuEra revenue pools. BCG is more conservative about
              timing: it describes no tangible quantum advantage over classical computing today, retains a $90 billion
              to $170 billion provider market by 2040, and estimates a $1 billion to $2 billion provider market by 2030.
              A 2026 industry forecast summary places the segment at $1.4 billion in 2025 and above $3 billion by 2028,
              but the fetched summary does not expose a full methodology. The divergence is decision-relevant: the
              near-term serviceable market is likely the subset of government, HPC, research, and advanced enterprise
              budgets that can justify pilots or infrastructure before fault-tolerant advantage is proven. QuEra’s
              company-specific SAM and SOM cannot be isolated from the assigned evidence because customer counts,
              pricing, retention, and revenue mix are not disclosed.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM016
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is becoming more proof-driven. In QuEra’s 2026 survey release, 46% of organizations expected flat
              budgets, 44% expected increases, and 10% expected decreases; only 9% cited successful pilots as the
              primary driver of increased spending. Government mandates and grants were the leading budget-increase
              driver at 28%, and government and defense were the most likely near-term commercialization segment at 24%,
              followed by large enterprises at 20%. This favors QuEra’s public-sector, HPC, and enterprise co-design
              routes, but it also exposes dependence on public funding and milestone-based procurement. Constraints are
              substantial: BCG describes the absence of tangible advantage today, while the survey identifies
              specialized talent shortage as an adoption barrier for 37% of respondents. The company reports commercial
              progress, including an on-premises HPC deployment and record revenue and collections, but the evidence
              does not provide a denominator for customers or split revenue between cloud, hardware, and services. The
              financing announcement likewise says $60 million of the $230 million was contingent on a prerequisite,
              which matters when interpreting funded capacity and runway.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: What the market evidence supports
            body: >-
              QuEra is exposed to a growing but still experimental market where government and HPC demand can fund early
              deployments before enterprise ROI is proven. The strongest valuation-relevant question is not whether a
              large global TAM exists, but whether QuEra can repeatedly convert heterogeneous pilots and public programs
              into paid, scalable cloud, hardware, and co-design revenue.
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM016
          - type: callout
            title: Sizing and conversion gap
            body: >-
              Independent forecasts disagree materially on scope and timing, and the assigned evidence does not disclose
              the customer, pricing, retention, or revenue-mix denominators needed to derive QuEra’s SAM, SOM, or unit
              economics.
            calloutType: risk
            claimRefs:
              - CM009
              - CM012
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and positioning
        blocks:
          - type: paragraph
            body: >-
              The buyer's alternative set is broader than neutral-atom peers. QuEra competes directly with gate-model
              hardware companies, indirectly with annealing systems optimized for narrower workloads, and with internal
              classical or hybrid development that postpones a hardware commitment. It also depends on distribution and
              orchestration layers such as Amazon Braket and NVIDIA's quantum stack, which can expand QuEra's reach
              while exposing buyers to several modalities through a common access layer. QuEra's current differentiation
              is the combination of reconfigurable neutral atoms, an analog system available through cloud access, and a
              claimed path toward fault-tolerant digital operation. The positioning map is deliberately ordinal:
              publications disclose unlike metrics, workloads, and maturity stages, so the scores indicate
              evidence-backed relative breadth rather than a performance benchmark.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
