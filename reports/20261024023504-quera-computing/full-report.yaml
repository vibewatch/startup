chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              QuEra Computing is a Boston-headquartered company founded in 2018 to commercialize neutral-atom
              quantum-computing research from Harvard and MIT. Its public description combines quantum systems available
              through the cloud and on premises with application co-design and collaborative research, rather than
              presenting a single hardware-only product. The company's homepage positions neutral-atom systems as the
              core platform and describes fault tolerance as arriving in 2028, while independent coverage describes
              Aquila as the currently usable 256-qubit system and treats later fault-tolerant products as roadmap items.
              This distinction matters: the current business is a mix of research access, system deployments, and
              co-development, whereas the largest strategic claims depend on future error-corrected machines. The latest
              retained financing was a convertible note, so a current priced-equity stage is not supportable. QuEra also
              announced a Maryland office in September 2026, but did not disclose site-level staffing.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The leadership model pairs academic founders and laboratory collaborators with an operating CEO.
              Independent reporting identifies Andy Ory as CEO since 2024 and Alex Keesling, a co-inventor of the core
              technology, as continuing on the technology and production side. Independent reporting names Mikhail
              Lukin, Markus Greiner, Vladan Vuletic, and Dirk Englund among the scientific founders. This provides
              visible scientific and operating coverage, but the public record does not establish a complete board
              roster, committee structure, or succession plan. Key-person dependence therefore remains material:
              scientific execution relies on the Harvard/MIT ecosystem and productization relies on a small number of
              named technical and operating leaders.
            claimRefs:
              - CO003
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
              - CO006
      - number: '1.3'
        title: Capital, financing structure, and scale
        blocks:
          - type: paragraph
            body: >-
              QuEra completed more than $230 million of financing in February 2025, with Google Quantum AI, SoftBank
              Vision Fund 2, Valor Equity Partners, QVT Family Office, Safar Partners, and other existing investors
              named across the available record. TechCrunch reports that the financing was a convertible note rather
              than priced equity and that the company declined to disclose valuation; it also reports that $60 million
              was contingent on an undisclosed prerequisite. The company later described 2025 as a year of record
              revenue and cash collections, but supplied no amount or accounting definition in the retained release. A
              Reuters-syndicated account likewise says valuation was not disclosed. Capital raised is therefore not
              equivalent to cash available, and the evidence does not support a precise valuation, ARR, revenue, burn,
              runway, or headcount figure for this report.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO009
              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: Milestones, deployments, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a progression from Harvard/MIT-originated research to public cloud access,
              on-premises deployments, and a stated fault-tolerance roadmap. QuEra's 2024 headquarters expansion was
              tied to signed NQCC and AIST deals, while later company material describes an AIST installation,
              national-program participation, and planned Libra and gigaquop systems. These milestones are meaningful
              evidence of technical and ecosystem traction, but several are company-issued and future-facing.
              Industry-level analysis warns that commercially relevant quantum computers may remain at least a decade
              away and that practical applicability is still constrained by error correction. The central diligence risk
              is therefore execution: converting laboratory and partnership evidence into repeatable paid deployments,
              while financing terms, current staffing, customer concentration, and product economics remain private. The
              September 2026 Maryland expansion adds a current ecosystem milestone, but it is not evidence of disclosed
              revenue or repeatable deployment economics.
