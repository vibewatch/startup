  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision remains Track until technical and channel proof becomes verified customer economics and a supportable
      entry price.
    data:
      nodes:
        - id: funding
          label: Financing capacity
          detail: More than $230M announced, with receipt and terms requiring confirmation.
        - id: technical
          label: Technical and deployment milestones
          detail: Cloud access and the HPE plan broaden the route to market.
        - id: productization
          label: Productization proof
          detail: Calibration, benchmarking, and the 2028 Libra target remain execution gates.
        - id: economics
          label: Repeatable economics
          detail: Revenue quality, margin, retention, backlog, and concentration are undisclosed.
        - id: price
          label: Entry price
          detail: The reported $1B mark lacks strong public corroboration.
        - id: decision
          label: Track / research more
          detail: Move only after terms, economics, and milestone evidence support returns.
      edges:
        - source: funding
          target: technical
          label: funds
        - source: technical
          target: productization
          label: must convert into
        - source: productization
          target: economics
          label: must demonstrate
        - source: economics
          target: price
          label: supports
        - source: price
          target: decision
          label: determines
    approximationNotes: This is a decision sequence, not a forecast or probability model.
    claimRefs:
      - CV003
      - CV007
      - CV012
      - CV016
