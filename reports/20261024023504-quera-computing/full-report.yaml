  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              QuEra’s principal risk is execution against a technically ambitious, partner-dependent commercialization
              path rather than a documented public incident. The company describes operational systems, on-premises
              integration, and a fault-tolerant roadmap, while its own 2026 survey says the market remains largely
              pre-commercial and buyers increasingly demand proof. The investment case therefore breaks if milestones
              fail to translate into independently verified performance, repeatable installations, or paid workloads.
              Monitoring should focus on acceptance-tested deployments, logical error and time-to-solution benchmarks,
              customer conversion, hiring for performance modeling, and disclosure of runway and unit economics. These
              indicators distinguish a temporary timing slip from a structural loss of credibility.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              The legal exposure is both external and contractual. 2026 federal actions described by the White House,
              K&L Gates, and Skadden accelerate post-quantum cryptography planning, procurement scrutiny, and
              cryptographic asset documentation, which can raise compliance requirements for government-facing suppliers
              and critical-infrastructure customers. Separate legal commentary identifies export controls, deemed-export
              issues, and changing national-security policy as risks to quantum R&D and international talent. Quantum
              service contracts also concentrate customer code, data, algorithms, and results on a provider platform,
              making IP ownership, confidentiality, permitted use, portability, deletion, and exit rights central
              diligence items. No assigned source verifies QuEra-specific control maturity, incident history, or
              contract protections.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR007
      - number: '7.3'
        title: Operational and technical execution
        blocks:
          - type: paragraph
            body: >-
              The deployment model creates a compound operational risk: QuEra must deliver specialized hardware,
              integrate it with HPC schedulers and authentication, calibrate systems, support researchers, and produce
              credible performance measurements. The company’s on-premises page describes a four-step process from site
              planning through ongoing support, while the HPE announcement says the parties are still pursuing testbeds,
              co-design, interoperability, and benchmarking. A requirement for system-level performance benchmarking
              shows that translating device constraints into application-level fidelity, throughput, and
              time-to-solution remains an active capability area. The AIST installation is a positive signal, but public
              evidence in this pool does not establish repeatability, uptime, acceptance criteria, or customer economics
              across a broad installed base.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
      - number: '7.4'
        title: Partner, market, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              QuEra’s routes to market rely on ecosystem partners and public-sector demand. HPE supports the on-premises
              path, cloud access is presented as complementary, and the University of Maryland agreement expands
              research access. Those relationships can accelerate adoption but also create leverage, roadmap, pricing,
              and continuity risk. The company reports securing more than $230 million of capital in 2025, but funding
              raised is not current cash available and the assigned evidence does not disclose cash runway, gross
              margin, revenue mix, customer concentration, or conversion of planned systems into recurring demand.
              QuEra’s survey reports that 46% of organizations expected flat 2026 budgets, 44% increases, and only 9%
              cited successful pilots as the primary spending driver, reinforcing the need for proof before scaling
              capital.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR010
              - CR011
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A missed fault-tolerance or deployment milestone combined with absent independent benchmark evidence would
              materially weaken the commercialization thesis.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
          - type: callout
            title: Evidence boundary
            body: >-
              No assigned source verifies QuEra-specific runway, margins, customer concentration, incident history, or
              contract protections; these remain diligence gaps rather than negative findings.
            calloutType: assumption
            claimRefs:
              - CR016
              - CR014
          - type: callout
            title: Policy can be both tailwind and burden
            body: >-
              Federal quantum investment and procurement policy may expand demand while simultaneously increasing PQC,
              export-control, and supply-chain obligations.
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports Track / research more rather than Buy. QuEra announced more than $230 million of
              financing in February 2025, although $60 million was still subject to a prerequisite funding condition; a
              later company release described the round as Series B and said NVentures expanded it. That is meaningful
              financing validation, but funding raised is not cash available and neither release supplies current cash,
              burn, preferences, conversion mechanics, or dilution. GetLatka reports a $1 billion valuation and labels
              the February financing a convertible note, but its revenue figure has no recorded source and its company
              profile contains an unexplained ownership assertion. The mark is therefore a diligence lead, not an
              investable price anchor. Entry discipline should require the cap table, note and side letters, current
              cash and runway, audited revenue recognition, gross margin, backlog, and customer concentration before
              underwriting a return.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that neutral-atom hardware can move from cloud research access into sovereign and tightly
              coupled HPC deployments. QuEra has announced an HPE integration path and says 2025 produced record revenue
              and cash collections. The anti-thesis is timing and commercialization risk. Libra is targeted for cloud
              availability in 2028 rather than evidenced as a current fault-tolerant product, and a current recruiting
              description still frames calibration, benchmarking, and modeling as work needed to turn a new machine into
              a dependable product. QuEra's own survey says only 9% of respondents cited successful pilots as the
              primary spending driver, while independent coverage reports that 43% see commercialization behind
              expectations. These signals make milestone verification more important than technology narrative.
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: Scenarios and comparable economics
        blocks:
          - type: paragraph
            body: >-
              Public-company comparables are useful chiefly as downside evidence, not as direct multiple anchors: their
              modalities, maturity, financing access, and revenue recognition differ from QuEra. D-Wave, IonQ, and
              Rigetti all reported meaningful 2025 operating or net losses despite very different revenue scales. That
              pattern argues against capitalizing a private revenue estimate at a public-company headline multiple
              without adjusting for burn, dilution, and technical delivery risk. The bull case requires contracted,
              repeatable cloud and on-premises deployments, verified margins, and delivery against the 2028 Libra
              target. The base case is continued milestone progress funded by the 2025 round but without enough
              disclosure to validate the reported $1 billion mark. The bear case is schedule slippage, procurement
              friction, or sustained pre-commercial economics that forces repricing or additional preference-heavy
              capital.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Decision path, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              A price can become supportable only after technical proof converts into customer-level economics.
              Near-term diligence should reconcile the company-described Series B with the third-party convertible-note
              label, confirm cash actually received, model fully diluted ownership through the next fault-tolerant
              milestone, and obtain cohort-level bookings, backlog conversion, deployment acceptance, support burden,
              and gross margin. Exit readiness is not established by sector enthusiasm: independent survey analysis
              identifies technology immaturity and implementation cost as the leading barriers, while the public quantum
              cohort remains loss-making. Thesis-break triggers are a material Libra delay, failure to convert HPE or
              cloud access into paid repeatable deployments, gross margin or retention below an agreed investment
              threshold, an inside-led down round, or financing terms that impair common equity returns. Until those
              checks clear, the reported valuation should not determine entry.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV007
              - CV012
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the unresolved variable
            body: >-
              Track QuEra's technical and commercial milestones, but do not underwrite the reported $1 billion valuation
              until financing terms, fully diluted ownership, cash and burn, revenue quality, gross margin, retention,
              and deployment contracts are verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
