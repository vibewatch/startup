  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key dated steps from the Harvard/MIT spinout through public access, financing, deployments, and the stated
      fault-tolerance roadmap.
    data:
      items:
        - date: '2018'
          label: Founded
          details: QuEra was founded to commercialize Harvard and MIT neutral-atom research.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2022'
          label: Aquila public access
          details: The 256-qubit Aquila system became available through Amazon Braket.
          tone: positive
          claimRefs:
            - CO004
        - date: 2024-03
          label: Boston expansion and deals
          details: QuEra announced doubled Boston space and signed NQCC and AIST deals in the first three months of 2024.
          tone: positive
          claimRefs:
            - CO014
        - date: '2025-02-11'
          label: More than $230 million financing
          details: >-
            The financing included Google, SoftBank Vision Fund 2, Valor, and existing investors; $60 million was
            contingent.
          tone: positive
          claimRefs:
            - CO009
            - CO010
        - date: '2025'
          label: Commercial and research milestone year
