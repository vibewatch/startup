              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Access and deployments are credible; customer economics are not yet observable
            body: >-
              QuEra has multiple externally visible adoption surfaces, but the assigned evidence does not quantify
              active paying customers, repeat usage, retention, or customer-level revenue.
            calloutType: insight
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU015
