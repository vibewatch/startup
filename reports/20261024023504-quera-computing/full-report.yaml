  - id: FE001
    title: QuEra product architecture map
    type: stack
    summary: >-
      QuEra's public product path layers neutral-atom hardware, control and error-correction research, software, and
      delivery channels.
    data:
      layers:
        - label: Delivery channels
          detail: Ways users reach QuEra systems.
          items:
            - label: Amazon Braket cloud
