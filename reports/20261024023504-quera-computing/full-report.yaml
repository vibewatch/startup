  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered platform and user workflow
        blocks:
          - type: paragraph
            body: >-
              QuEra's current product is not only a laboratory device. The public surface describes Aquila as a
              256-qubit neutral-atom system available through Amazon Braket, while Bloqade provides a Python-oriented
              hardware-first SDK for constructing analog programs, running them on an emulator or hardware, and
              analyzing results. The workflow is therefore a sequence of program design, parameter assignment or sweeps,
              emulator validation, Braket execution, and post-processing. A separate public hiring description shows
              that QuEra is building system-level modeling for fidelity, runtime, throughput, and time-to-solution,
              which is relevant to converting hardware access into customer-relevant performance evidence. The QLab
              agreement and NERSC call show an access model that combines cloud or remote access, training, finite QPU
              allocations, and open research projects rather than promising unrestricted production capacity.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE010
              - CE011
      - number: '5.2'
        title: Architecture, scaling, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The technical thesis is a reconfigurable neutral-atom architecture: rubidium atoms encode qubits, lasers
              manipulate them, and optical tweezers move atoms so that entangling operations can be performed in
              parallel. The resulting mobility and dynamic connectivity are presented as a way to reduce routing and
              error-correction overhead without the dilution refrigerators used by some competing modalities. The
              strongest independent technical evidence is the peer-reviewed magic-state distillation result, which
              reports improved logical fidelity for distilled states and identifies the experiment as a building block
              for universal fault-tolerant computation. This is credible technical differentiation, but it is not
              equivalent to a commercially available fault-tolerant product: the public materials still frame
              large-scale systems as a forward roadmap and do not disclose sustained production benchmarks,
              service-level reliability, or customer economics.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE010
              - CE012
      - number: '5.3'
        title: Deployment, integration, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Deployment is expanding from cloud research toward sovereign and on-premises HPC. QuEra says its HPE
              collaboration targets integrated testbeds, algorithm co-design, software interoperability, and
              system-level benchmarking, while the QLab and NERSC materials establish concrete institutional access and
              bounded research programs. The developer surface is also active: the public organization shows current
              repositories for Kirin, Bloqade core, and atom-shuttling tools. These signals support an ecosystem and
              integration thesis, but they do not establish a mature enterprise control plane. Public evidence does not
              specify uptime, incident history, penetration testing, data retention, export-control operating procedures
              for commercial customers, calibration drift, hardware replacement policy, or the
              production-versus-research boundary for Gemini. Those omissions are material because the product promise
              depends on repeatable end-to-end quantum-classical workflows, not only laboratory demonstrations.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack neutral-atom thesis
            body: >-
              QuEra combines hardware access, software tooling, academic validation, and institutional integration
              rather than presenting a hardware-only proposition.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE010
              - CE012
          - type: callout
            title: Research maturity is ahead of operating disclosure
            body: >-
              The public record is stronger on architecture and scientific milestones than on uptime, security controls,
              workload economics, and repeatable enterprise delivery.
            calloutType: risk
            claimRefs:
              - CE008
              - CE010
              - CE011
              - CE013
          - type: callout
            title: Require deployment evidence before underwriting scale
            body: >-
              A technical diligence process should condition confidence on platform-level reliability, security, cost,
              and benchmark evidence for representative customer workloads.
            calloutType: recommendation
            claimRefs:
              - CE010
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and channel segments
        blocks:
          - type: paragraph
            body: >-
              QuEra reaches several distinct populations rather than a single comparable customer base. Aquila's
              public-cloud availability serves researchers and developers; Pawsey and the University of Maryland QLab
              illustrate research, education, and HPC access; AIST and the UK's NQCC represent public research
              infrastructure and sovereign-compute buyers; and Merck and Amgen appear as pharmaceutical end users in an
              application study. The Quantum Alliance adds software companies, consultants, systems integrators, and
              research organizations as channels or co-development partners. This breadth expands routes to adoption,
              but it also mixes users, partners, research collaborators, and possible payers. Public evidence therefore
              does not support a single customer count or a uniform revenue interpretation across these segments.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The adoption record advances from low-friction access toward physical deployment, but each milestone has a
              different evidentiary meaning. An independent directory describes Aquila as the first neutral-atom system
              available through public cloud. Pawsey documents private-cloud machine time, consulting, training, and
              joint software work. Independent reporting then identifies QuEra's first system outside its own
              laboratories at AIST and a shipment to NQCC. The Merck-Amgen-Deloitte study adds end-user application
              evidence: its quantum-reservoir approach beat tested classical baselines on 100- and 200-sample subsets,
              but the advantage was no longer statistically significant at 800 records or more. These are substantive
              proofs of access and experimentation, not disclosed measures of recurring production use or customer
              retention.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU010
      - number: '6.3'
        title: Expansion potential, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              QuEra's channel strategy can widen distribution through joint go-to-market activity, early technology
              access, and regional research ecosystems. Buyer-side conditions are less forgiving: QuEra's 291-respondent
              survey reports that only 13% had introduced or scaled applications productively, while 56% were evaluating
              or piloting; 46% expected flat 2026 budgets, and procurement increasingly reflects sovereignty and
              evidence-of-value requirements. Government and defense were the leading expected commercialization
              segment, ahead of large enterprise and life sciences, which supports QuEra's public-sector positioning but
              may also lengthen procurement cycles and increase program dependence. The central diligence limitation is
              economic durability. Assigned sources disclose neither QuEra-specific renewal and retention metrics nor
              customer revenue concentration, so named deployments cannot yet establish repeatable expansion.
            claimRefs:
              - CU002
              - CU003
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
