              - CP012
              - CP013
              - CP016
      - number: '3.2'
        title: Capability, trust, and buyer criteria
        blocks:
          - type: paragraph
            body: >-
              QuEra's strongest architectural claims are dynamic atom rearrangement, room-temperature operation, and
              reduced wiring constraints. Those features can matter for routing overhead, data-center fit, and scaling,
              but they are not evidence that QuEra has already won on useful applications. Google reports
              below-threshold error correction on a 105-qubit superconducting chip while acknowledging that its
              random-circuit benchmark has no known commercial application. PsiQuantum has published a
              foundry-manufactured photonic component stack, and D-Wave has a disclosed $20 million on-premises system
              agreement. Buyers must therefore compare error-correction evidence, usable workload scope, deployment
              readiness, and independent validation rather than treating physical-qubit counts as interchangeable.
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP010
              - CP011
              - CP013
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: Packaging, distribution, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              QuEra has moved beyond a single cloud channel: the company offers premium direct access and leasing for
              on-premises use, and it reports an installed system at AIST. Its University of Maryland agreement adds
              another research-access route. This breadth reduces dependence on one channel, but public evidence does
              not disclose comparable list prices, service units, renewal terms, or realized discounts. Amazon Braket's
              catalog places QuEra beside trapped-ion and superconducting systems, while NVIDIA's modality-neutral
              integration stack can make the surrounding workflow portable. Multi-homing is therefore easier at
              discovery and software layers than at the hardware layer, where algorithms, control assumptions, and
              workload fit remain modality-specific and preserve switching costs.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP010
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              QuEra's defensibility rests on execution across hardware, error correction, manufacturing, and
              distribution rather than on neutral atoms alone. The company's own market survey says buyers are becoming
              proof-driven, budgets are mostly flat or increasing only selectively, and procurement increasingly
              considers sovereignty. Its public-sector material also concedes that quantum systems still do not
              outperform classical solutions for most problems. These admissions make status quo and internal classical
              development material substitutes, while Google, PsiQuantum, and D-Wave show that competing modalities can
              produce differentiated technical proof or commercial commitments. The key adverse scenario is not one
              competitor matching every QuEra feature; it is a platform ecosystem that abstracts hardware choice while
              another modality reaches useful workloads or repeatable procurement first.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution can expand reach and compress differentiation
            body: >-
              Amazon and NVIDIA can make QuEra easier to adopt, but their multi-vendor and modality-neutral layers also
              let buyers compare or substitute hardware without granting QuEra exclusive control of the workflow.
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a hybrid monetization model rather than a pure SaaS model. QuEra describes
              cloud-accessible quantum systems, on-premises installations, application co-design, and collaborative
              research; the University of Maryland announcement specifically describes cloud access to Aquila for
              research and education, while the 2025 company release refers to product and service deliveries and an
              on-premises HPC deployment. That mix can create hardware-delivery revenue, services revenue, cloud usage,
              and potentially multi-year program economics, but the sources do not disclose the split, contract
              duration, renewal behavior, realized price per workload, or accounting treatment. An external database
              reports $39.9M of annual revenue for June 2025, but labels the figure's source as unrecorded; it is
              therefore a directional estimate rather than corroborated ARR. Official pricing is not publicly visible in
              the assigned evidence, so list price, realized revenue, and gross profit must not be conflated.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
