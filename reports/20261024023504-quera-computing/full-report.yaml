      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The operating model is likely cost-intensive because QuEra is scaling specialized hardware, scientific
              engineering, manufacturing capacity, and deployment support at the same time. The financing announcement
              says proceeds are intended to accelerate development and production, expand technical talent, increase
              build and test capacity, and broaden cloud and on-premises engagements. A job posting also shows dedicated
              performance-modeling and benchmarking work, which is a useful operating signal but not a cost disclosure.
              The assigned public evidence does not provide gross margin, R&D expense, sales expense, CAC, payback,
              utilization, backlog conversion, service-delivery cost, or working-capital terms. A public competitor
              filing shows that quantum revenue can coexist with large net losses, but those figures are not QuEra's
              financials and should be used only as sector risk context. The underwriting implication is that revenue
              quality and contribution margin remain unproven even though commercial activity is visible.
            claimRefs:
