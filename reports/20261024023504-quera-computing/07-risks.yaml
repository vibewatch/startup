company:
  name: QuEra Computing
chapter:
  number: 7
  title: Risks
  summary: QuEra has credible technical and ecosystem signals, but the highest residual exposures are execution against future
    fault-tolerance milestones, partner-dependent deployment, evolving quantum regulation, and opaque economics. Public evidence
    supports disciplined monitoring and targeted diligence rather than assuming that announced capability equals repeatable
    commercial performance.
sections:
- id: risk-posture
  title: Risk posture and thesis-break conditions
  body: "QuEra\u2019s principal risk is execution against a technically ambitious, partner-dependent commercialization path\
    \ rather than a documented public incident. The company describes operational systems, on-premises integration, and a\
    \ fault-tolerant roadmap, while its own 2026 survey says the market remains largely pre-commercial and buyers increasingly\
    \ demand proof. The investment case therefore breaks if milestones fail to translate into independently verified performance,\
    \ repeatable installations, or paid workloads. Monitoring should focus on acceptance-tested deployments, logical error\
    \ and time-to-solution benchmarks, customer conversion, hiring for performance modeling, and disclosure of runway and\
    \ unit economics. These indicators distinguish a temporary timing slip from a structural loss of credibility."
  claimRefs:
  - CR001
  - CR003
  - CR005
  - CR006
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: legal-regulatory
  title: Regulatory, legal, and data exposure
  body: The legal exposure is both external and contractual. 2026 federal actions described by the White House, K&L Gates,
    and Skadden accelerate post-quantum cryptography planning, procurement scrutiny, and cryptographic asset documentation,
    which can raise compliance requirements for government-facing suppliers and critical-infrastructure customers. Separate
    legal commentary identifies export controls, deemed-export issues, and changing national-security policy as risks to quantum
    R&D and international talent. Quantum service contracts also concentrate customer code, data, algorithms, and results
    on a provider platform, making IP ownership, confidentiality, permitted use, portability, deletion, and exit rights central
    diligence items. No assigned source verifies QuEra-specific control maturity, incident history, or contract protections.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR007
  tableRefs:
  - TR001
- id: operations-technology
  title: Operational and technical execution
  body: "The deployment model creates a compound operational risk: QuEra must deliver specialized hardware, integrate it with\
    \ HPC schedulers and authentication, calibrate systems, support researchers, and produce credible performance measurements.\
    \ The company\u2019s on-premises page describes a four-step process from site planning through ongoing support, while\
    \ the HPE announcement says the parties are still pursuing testbeds, co-design, interoperability, and benchmarking. A\
    \ requirement for system-level performance benchmarking shows that translating device constraints into application-level fidelity, throughput,\
    \ and time-to-solution remains an active capability area. The AIST installation is a positive signal, but public evidence\
    \ in this pool does not establish repeatability, uptime, acceptance criteria, or customer economics across a broad installed\
    \ base."
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR008
- id: partners-financial
  title: Partner, market, and financial dependencies
  body: "QuEra\u2019s routes to market rely on ecosystem partners and public-sector demand. HPE supports the on-premises path,\
    \ cloud access is presented as complementary, and the University of Maryland agreement expands research access. Those\
    \ relationships can accelerate adoption but also create leverage, roadmap, pricing, and continuity risk. The company reports\
    \ securing more than $230 million of capital in 2025, but funding raised is not current cash available and the assigned evidence\
    \ does not disclose cash runway, gross margin, revenue mix, customer concentration, or conversion of planned systems into\
    \ recurring demand. QuEra\u2019s survey reports that 46% of organizations expected flat 2026 budgets, 44% increases, and\
    \ only 9% cited successful pilots as the primary spending driver, reinforcing the need for proof before scaling capital."
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR009
  - CR010
  - CR015
  - CR016
  tableRefs:
  - TR003
