company:
  name: QuEra Computing
chapter:
  number: 3
  title: Competitors
  summary: >-
    QuEra is differentiated by a reconfigurable neutral-atom architecture and by offering cloud,
    direct-access, and on-premises deployment paths, but it competes with credible superconducting,
    photonic, annealing, and trapped-ion alternatives. Its moat therefore depends less on raw qubit
    count than on converting technical progress into repeatable deployments while cloud and
    accelerated-computing platforms make multi-vendor access easier.
sections:
  - id: competitive-landscape
    title: Competitive landscape and positioning
    body: >-
      The buyer's alternative set is broader than neutral-atom peers. QuEra competes directly with
      gate-model hardware companies, indirectly with annealing systems optimized for narrower
      workloads, and with internal classical or hybrid development that postpones a hardware
      commitment. It also depends on distribution and orchestration layers such as Amazon Braket
      and NVIDIA's quantum stack, which can expand QuEra's reach while exposing buyers to several
      modalities through a common access layer. QuEra's current differentiation is the combination
      of reconfigurable neutral atoms, an analog system available through cloud access, and a
      claimed path toward fault-tolerant digital operation. The positioning map is deliberately
      ordinal: publications disclose unlike metrics, workloads, and maturity stages, so the scores
      indicate evidence-backed relative breadth rather than a performance benchmark.
    claimRefs: [CP001, CP002, CP008, CP009, CP010, CP011, CP012, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-buyer-criteria
    title: Capability, trust, and buyer criteria
    body: >-
      QuEra's strongest architectural claims are dynamic atom rearrangement, room-temperature
      operation, and reduced wiring constraints. Those features can matter for routing overhead,
      data-center fit, and scaling, but they are not evidence that QuEra has already won on useful
      applications. Google reports below-threshold error correction on a 105-qubit superconducting
      chip while acknowledging that its random-circuit benchmark has no known commercial
      application. PsiQuantum has published a foundry-manufactured photonic component stack, and
      D-Wave has a disclosed $20 million on-premises system agreement. Buyers must therefore
      compare error-correction evidence, usable workload scope, deployment readiness, and
      independent validation rather than treating physical-qubit counts as interchangeable.
    claimRefs: [CP001, CP005, CP008, CP010, CP011, CP013, CP016]
    tableRefs: [TP002]
  - id: packaging-distribution-and-switching
    title: Packaging, distribution, and switching dynamics
    body: >-
      QuEra has moved beyond a single cloud channel: the company offers premium direct access and
      leasing for on-premises use, and it reports an installed system at AIST. Its University of
      Maryland agreement adds another research-access route. This breadth reduces dependence on one
      channel, but public evidence does not disclose comparable list prices, service units, renewal
      terms, or realized discounts. Amazon Braket's catalog places QuEra beside trapped-ion and
      superconducting systems, while NVIDIA's modality-neutral integration stack can make the
      surrounding workflow portable. Multi-homing is therefore easier at discovery and software
      layers than at the hardware layer, where algorithms, control assumptions, and workload fit
      remain modality-specific and preserve switching costs.
    claimRefs: [CP002, CP003, CP004, CP007, CP009, CP012, CP014, CP015]
    tableRefs: [TP003]
  - id: moat-durability-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      QuEra's defensibility rests on execution across hardware, error correction, manufacturing,
      and distribution rather than on neutral atoms alone. The company's own market survey says
      buyers are becoming proof-driven, budgets are mostly flat or increasing only selectively,
      and procurement increasingly considers sovereignty. Its public-sector material also concedes
      that quantum systems still do not outperform classical solutions for most problems. These
      admissions make status quo and internal classical development material substitutes, while
      Google, PsiQuantum, and D-Wave show that competing modalities can produce differentiated
      technical proof or commercial commitments. The key adverse scenario is not one competitor
      matching every QuEra feature; it is a platform ecosystem that abstracts hardware choice while
      another modality reaches useful workloads or repeatable procurement first.
    claimRefs: [CP006, CP007, CP010, CP011, CP014, CP015, CP016]
