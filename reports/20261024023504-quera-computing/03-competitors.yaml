      - [QuEra on-premises, "Lease or institutional deployment", "Not disclosed", "Local or air-gapped system control", "Lease duration, maintenance, and total cost unknown", "Addresses sovereignty and security-sensitive buyers"]
      - [D-Wave Advantage2 at FAU, "Purchase and installation agreement", "$20 million commitment", "On-premises annealing system and proposed training collaboration", "Allocation between hardware and associated commitments not disclosed", "Creates a visible procurement anchor that QuEra does not publicly match on price"]
    notes: "Only D-Wave discloses a contract value in the retained evidence; that commitment is not a normalized hardware list price and is not directly comparable with cloud usage."
    claimRefs: [CP002, CP003, CP006, CP010, CP012]
figures:
