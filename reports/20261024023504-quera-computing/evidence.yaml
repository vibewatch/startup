  - type: missing-source
    severity: material
    topic: competitive-benchmarking
    missingEvidence: >-
      Independent, workload-matched benchmarks comparing useful output quality, runtime, reliability, and total cost
      across neutral-atom and competing modalities.
    whyItMatters: >-
      Provider-specific qubit and error-correction metrics cannot establish a durable performance moat or a winner for
      customer workloads.
    diligencePath: >-
      Commission a reproducible buyer-relevant benchmark with disclosed classical baselines, error budgets, queue time,
      support effort, and full cost.
