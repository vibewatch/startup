evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-structure
    missingEvidence: >-
      The note conversion price, liquidation preference, anti-dilution, seniority, exact cumulative capital raised, and
      amount actually funded are not disclosed.
    whyItMatters: >-
      Financing mechanics determine dilution, downside protection, and how much of the announced capital is available to
      fund execution.
    diligencePath: >-
      Obtain the executed note purchase agreement, cap table, side letters, cumulative financing schedule, and a bank
      statement or closing schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: private-metrics
    missingEvidence: >-
      Current revenue mix, gross margin, burn, cash runway, customer count, retention, concentration, and headcount are
      not publicly supported.
    whyItMatters: >-
      Without operating denominators, strategic backing and milestones cannot be translated into unit economics or
      valuation support.
    diligencePath: >-
      Request the latest management accounts, customer cohort schedule, bookings/backlog bridge, hiring plan, and cash
      forecast.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A complete board, committee, executive, and succession inventory is unavailable.
    whyItMatters: >-
      Governance depth and key-person concentration affect execution resilience in a capital-intensive technical
      company.
    diligencePath: Request the current board roster, committee charters, executive org chart, and succession/retention plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: milestones
    missingEvidence: Company-issued roadmap and milestone claims lack independent product-level benchmark detail.
    whyItMatters: Future targets and laboratory results may not translate into commercially repeatable system performance.
    diligencePath: >-
      Obtain third-party benchmark reports, acceptance certificates, deployment uptime, and paid customer references for
      each system generation.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: No retained source provides a QuEra-specific regulatory, litigation, outage, or security review.
    whyItMatters: >-
      Absence of a recorded incident is not proof of absence, particularly for cloud and on-premises critical
      infrastructure.
    diligencePath: >-
      Run legal, sanctions, cybersecurity, uptime, and government-contract diligence using company representations and
      independent databases.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: No priced equity valuation or reliable secondary-market transaction was retained.
    whyItMatters: The financing amount alone cannot establish entry valuation, dilution, or return potential.
    diligencePath: >-
      Request the latest preferred-share price, fully diluted cap table, option pool, and any secondary transaction
      data.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: company-specific SAM/SOM
    missingEvidence: >-
      Customer-level pricing, contract values, retention, pipeline conversion, and revenue split across cloud, hardware,
      and services.
    whyItMatters: >-
      Without these denominators, global market estimates cannot be translated into QuEra’s serviceable or obtainable
      market.
    diligencePath: >-
      Request a cohort and revenue bridge by deployment type, customer segment, geography, contract value, renewal, and
      backlog.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM010
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: quantum market sizing
    missingEvidence: Comparable forecast definitions and full methodologies for the McKinsey, BCG, and QED-C estimates.
    whyItMatters: The estimates span different scopes and horizons; treating them as a single TAM would overstate precision.
    diligencePath: >-
      Reconcile provider revenue, hardware, software, services, and adjacent quantum-technology categories on a common
      year and geography.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial traction
    missingEvidence: Independent customer references and paid-deployment evidence beyond company announcements.
    whyItMatters: >-
      Company-reported revenue and collections demonstrate activity but not repeatability, concentration, or customer
      ROI.
    diligencePath: >-
      Obtain referenceable customer contracts, deployment acceptance evidence, renewal data, and outcome metrics under
      NDA.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: pricing and budget ownership
    missingEvidence: Published or referenceable QuEra pricing and procurement terms for cloud, on-premises, and co-design offerings.
    whyItMatters: >-
      Pricing determines whether forecast market growth can translate into scalable revenue rather than bespoke
      projects.
    diligencePath: Request current price books, representative statements of work, support terms, and implementation timelines.
    relatedQuestionRefs:
      - QM003
      - QM010
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: packaging
    missingEvidence: >-
      Normalized list and realized pricing, usage units, service scope, discounts, renewal terms, and total deployment
      cost across QuEra and competitors.
    whyItMatters: >-
      Without comparable commercial terms, buyer value and pricing power cannot be separated from differences in
      workload, support, and deployment model.
    diligencePath: >-
      Request representative QuEra proposals and invoices, then compare them with matched workload quotes from D-Wave,
      gate-model providers, and cloud channels.
    relatedQuestionRefs:
