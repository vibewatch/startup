        - [onprem, revenue]
        - [services, revenue]
    approximationNotes: "The diagram is a qualitative operating-model bridge; it does not estimate conversion rates, revenue mix, margin, or cash generation."
    claimRefs: [CI001, CI002, CI004, CI010, CI011]
callouts:
  - calloutType: risk
    title: Revenue quality is not yet underwritable
    body: "The strongest public revenue figure is an external $39.9M June 2025 estimate whose source is not recorded; QuEra's own release reports record revenue and cash collections without amount, mix, or audited reconciliation."
    claimRefs: [CI003, CI004]
  - calloutType: strength
    title: Financing supports capacity expansion, not proven profitability
    body: "The announced financing and described production, talent, and deployment uses support capital adequacy as a near-term strength, but the public record does not establish cash on hand, burn, runway, or instrument terms."
    claimRefs: [CI009, CI012, CI013]
