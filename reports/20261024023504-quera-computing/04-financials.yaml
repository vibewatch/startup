company:
  name: QuEra Computing
chapter:
  number: 4
  title: Financials
  summary: QuEra has disclosed substantial financing and evidence of commercial delivery, but public information does not establish recurring revenue quality, gross margin, cash burn, runway, or realized unit economics. The underwriting case therefore rests on technical and strategic traction while treating operating leverage and financing terms as material diligence gaps.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Public evidence supports a hybrid monetization model rather than a pure SaaS model. QuEra describes
      cloud-accessible quantum systems, on-premises installations, application co-design, and collaborative
      research; the University of Maryland announcement specifically describes cloud access to Aquila for research
      and education, while the 2025 company release refers to product and service deliveries and an on-premises
      HPC deployment. That mix can create hardware-delivery revenue, services revenue, cloud usage, and
      potentially multi-year program economics, but the sources do not disclose the split, contract duration,
      renewal behavior, realized price per workload, or accounting treatment. An external database reports
      $39.9M of annual revenue for June 2025, but labels the figure's source as unrecorded; it is therefore a
      directional estimate rather than corroborated ARR. Official pricing is not publicly visible in the assigned
      evidence, so list price, realized revenue, and gross profit must not be conflated.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The operating model is likely cost-intensive because QuEra is scaling specialized hardware, scientific
      engineering, manufacturing capacity, and deployment support at the same time. The financing announcement
      says proceeds are intended to accelerate development and production, expand technical talent, increase build
      and test capacity, and broaden cloud and on-premises engagements. A job posting also shows dedicated
      performance-modeling and benchmarking work, which is a useful operating signal but not a cost disclosure.
      The assigned public evidence does not provide gross margin, R&D expense, sales expense, CAC, payback,
      utilization, backlog conversion, service-delivery cost, or working-capital terms. A public competitor filing
      shows that quantum revenue can coexist with large net losses, but those figures are not QuEra's financials
      and should be used only as sector risk context. The underwriting implication is that revenue quality and
      contribution margin remain unproven even though commercial activity is visible.
    claimRefs: [CI005, CI006, CI007, CI008, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      QuEra announced more than $230M of 2025 financing, with $60M described as payable in the near future upon
      satisfaction of a prerequisite funding condition. The announcement also says the structure, together with
      organic revenue, provides a long financial runway, but this is management's characterization rather than a
      cash balance or runway calculation. Public-sector programs provide additional demand and validation signals:
      the UK's NQCC awarded QuEra one of seven testbed contracts in a £30M program, while an independent company
      database reports a broad 51–200 employee range rather than a cost base. These signals may indicate channel
      diversification and operating scale, yet they do not prove unrestricted cash, recurring revenue, or
      profitability. The financial verdict is track/research-more: capital access appears stronger than the
      disclosure base, but investors still need the cap table, financing terms, cash reconciliation, burn, backlog,
      customer concentration, and unit economics before underwriting a valuation.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism evidenced, Current value/status, Quality and underwriting implication]
    rows:
      - [Cloud access, "Aquila access through the University of Maryland QLab and Amazon Braket references", "Commercial access is evidenced; price and usage are not disclosed", "Observed channel; not enough to infer ARR or utilization"]
      - [On-premises systems, "Company reports its first on-premises HPC installation at AIST", "Deployment reported; contract value and recognition period unavailable", "Company-claimed delivery; verify invoice, backlog, and acceptance terms"]
      - [Application co-design and research, "Company describes application co-design and collaborative research", "Offering described, realized mix unavailable", "Potential services revenue; margin and repeatability unknown"]
      - [Hardware and product deliveries, "Company reports product and service deliveries and record cash collections in 2025", "No audited revenue or mix disclosed", "Company-claimed traction; separate cash collections from recognized revenue"]
    notes: "Sources are a mix of company disclosures and third-party descriptions; null or unavailable values mean the assigned public evidence did not disclose them, not that the activity is absent."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Offer, Public price or contract basis, Realized pricing, Diligence ask]
    rows:
      - [Aquila cloud access, "Access channel is described; no public price in assigned sources", null, "Obtain price per shot/usage unit, minimum commitment, and cloud-provider revenue share"]
      - [On-premises HPC deployment, "Deployment is described; contract basis is not disclosed", null, "Obtain system price, installation revenue, acceptance milestones, and support obligations"]
      - [Application co-design, "Service category is described; statement of work is not disclosed", null, "Obtain rate card, scope, staffing model, and gross margin by engagement"]
      - [Government and research programs, "NQCC testbed participation is confirmed; award amount for QuEra is not stated in fetched text", null, "Obtain award instrument, reimbursement rules, and customer-funded versus grant-funded split"]
    notes: "This is a disclosure map, not a price comparison. Official positioning does not establish list pricing, realized revenue, or margin."
    claimRefs: [CI001, CI002, CI010, CI011]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Public value, Confidence, Why it matters and diligence ask]
    rows:
      - [Annual revenue, "$39.9M for June 2025", "Low; external database says source not recorded", "Reconcile to management accounts and split hardware, cloud, and services"]
      - [Gross margin, null, "Unavailable", "Needed to distinguish scalable software/cloud economics from hardware and service burden"]
      - [Cash burn and runway, null, "Unavailable", "Obtain monthly cash flow, cash balance, restricted cash, and runway under base and downside cases"]
      - [Customer concentration and retention, null, "Unavailable", "Obtain cohort revenue, renewal, backlog, and top-customer exposure"]
      - [Financing amount, "More than $230M announced; $60M conditional at announcement", "Medium; official company release", "Obtain closing evidence, instrument terms, preferences, dilution, and remaining funding conditions"]
      - [Public-company comparator, "Quantinuum reported $30.9M net revenue and a $192.6M net loss for 2025", "High for the competitor filing; not evidence about QuEra", "Use only as sector context; do not substitute competitor economics for QuEra underwriting"]
      - [Public-company margin comparator, "Rigetti FY2024 gross margin 52.80%; fetched table shows free cash flow of -61.73 without an explicit currency unit", "Medium for the market-data page; not evidence about QuEra", "Use only as sector context and verify units against the underlying filing before comparison"]
    notes: "Null values are explicit evidence gaps. Comparator financials are not QuEra financials and do not establish QuEra's margins, burn, or valuation."
    claimRefs: [CI003, CI005, CI006, CI007, CI009, CI014, CI015]
