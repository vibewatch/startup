company:
  name: "ICEYE"
chapter:
  number: 1
  title: "Company Overview"
  summary: "ICEYE is a Finnish, vertically integrated synthetic-aperture-radar company that has moved from commercial imagery into sovereign satellite systems. A June 2026 Series F set a valuation above EUR 10 billion, but the EUR 1 billion-plus transaction included secondary liquidity, while the company's 2025 revenue, EBITDA, and backlog disclosures remain unaudited."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      Founded in Espoo in 2014 by Rafał Modrzewski and Pekka Laurila, ICEYE combines
      satellite design and operations with imagery, monitoring, analytics, and
      sovereign-system delivery. That vertical scope is strategically important:
      customers can buy data products or procure a dedicated capability rather than
      assemble manufacturing, launch, ground, and analytics vendors themselves. The
      core technical proposition is X-band synthetic-aperture radar, which can observe
      through darkness, clouds, and rain. Public sources support a global workforce
      above 1,000, but they do not provide an audited current headcount, a total active
      customer count, or a complete geographic revenue split. The snapshot therefore
      separates dated company disclosures from unavailable private operating metrics
      instead of treating marketing scale statements as independently verified KPIs.
    claimRefs: ["CO001", "CO003", "CO004", "CO005"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Rafał Modrzewski remained identified as co-founder and chief executive in June
      and August 2026 financing materials. Pekka Laurila is consistently identified as
      the other co-founder, but the assigned evidence does not establish his current
      operating title. Modrzewski's continuing role across fundraising, strategy, and
      public positioning creates visible founder dependence, while no complete board
      roster, committee structure, succession plan, or voting-control schedule appears
      in the reviewed sources. The leadership table is therefore a partial founder map,
      not an exhaustive management or governance roster. Investment diligence should
      obtain current board minutes, delegated authorities, key-person protections, and
      a management succession plan before assigning comfort to governance quality.
    claimRefs: ["CO001", "CO002"]
    tableRefs: ["TO002"]
  - id: "capital-scale-and-stakeholders"
    title: "Capital, scale, and stakeholders"
    body: >-
      ICEYE announced a EUR 450 million primary Series F on June 9, 2026, led by General
      Atlantic at a valuation above EUR 10 billion. Together with a secondary placement,
      the transaction exceeded EUR 1 billion; the larger number is not equivalent to
      cash entering the company. The deal was also subject to customary closing
      conditions and regulatory approvals. ICEYE separately reported unaudited 2025
      results above EUR 250 million of revenue, EUR 100 million of EBITDA, and EUR 1.5
      billion of contracted backlog. These are company disclosures rather than audited
      accounts, and backlog is not recognized revenue or cash. The investor group spans
      growth equity, Finnish institutions, a strategic telecom investor, and sovereign
      capital, widening both financing support and stakeholder complexity.
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO010", "CO011", "CO012", "CO013"]
    tableRefs: ["TO003"]
  - id: "milestones-and-diligence-implications"
    title: "Milestones and diligence implications"
    body: >-
      The milestone record shows a company that progressed from a 2014 university-linked
      founding to its first constellation satellite in December 2018, then accelerated
      deployment through repeated multi-satellite launches in late 2025 and 2026. By
      late 2025, eoPortal reported more than 60 satellites launched, while 2026 financing
      materials said seven European governments had procured sovereign satellite
      systems. That combination supports a credible transition from technology
      demonstration to strategic infrastructure supplier, but it does not establish
      fleet reliability, customer concentration, contract margins, or unrestricted
      international scalability. Independent analysis specifically flags export-control
      and data-security constraints. No recorded incident in this assigned evidence
      should be read as proof that no launch, on-orbit, cyber, or deorbit incident
      occurred.
    claimRefs: ["CO013", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
