      - number: '5.2'
        title: Radar Payload and Spacecraft Subsystem Architecture
        blocks:
          - type: paragraph
            body: >-
              The core technical foundation of each ICEYE satellite is an 85 kg microsatellite bus integrated with an
              active phased-array X-band radar instrument operating at a center frequency of 9.75 GHz. The satellite
              operates in a sun-synchronous low Earth orbit at an orbital inclination of approximately 97.7 degrees, an
              altitude corresponding to a 96-minute orbital period, and approximately 15 imaging revolutions per day.
              The instrument's active phased-array antenna utilizes electronic beam steering across range bandwidths
              between 40 and 300 MHz, granting the spacecraft the agility to look both left and right across incidence
              angles ranging from 15 to 35 degrees without requiring mechanical spacecraft slewing. Telemetry, radar
              command instructions, and collected raw data are transmitted to Earth ground stations through a dedicated
              X-band downlink operating at 140 Mbit/s. Technological evolution of the spacecraft architecture has
              progressed into fourth-generation (Gen4) platforms, which introduce hardware and waveform upgrades that
              achieve ultra-high spatial resolutions approaching 16 cm alongside expanded swath coverage. Constellation
              agility is further enhanced by deploying spacecraft across both sun-synchronous polar orbits and
              mid-inclination orbital planes to optimize revisit frequencies over high-value mid-latitude infrastructure
              and conflict zones.
            claimRefs:
              - CE001
