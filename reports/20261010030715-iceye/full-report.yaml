  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Operational Workflow
        blocks:
          - type: paragraph
            body: >-
              ICEYE delivers persistent Earth observation data through a commercial constellation of Synthetic Aperture
              Radar (SAR) microsatellites operating in the X-band spectrum. Unlike optical imaging systems that depend
              on clear daylight, ICEYE's radar sensors transmit microwave pulses that penetrate atmospheric cloud cover,
              smoke plumes, and darkness to capture Earth surface imagery under all weather conditions. The primary
              commercial data offering is structured into four standardized imaging modes designed to balance spatial
              resolution against ground swath coverage: Spot, Spot Large Extended Area (SLEA), Strip, and Scan modes.
              These imaging modes deliver ground sampling resolutions between 1 meter in localized high-fidelity
              collections and 15 meters across broad-area maritime scans. Products are disseminated as Level 1 complex
              images that preserve full radar phase and amplitude returns for interferometric analysis, or as
              amplitude-detected images configured for standard geographic information systems. Beyond raw and processed
              imagery files, ICEYE has developed specialized vertical solutions including Flood Insights and Wildfire
              Insights that translate raw radar backscatter returns into actionable catastrophe metrics such as
              inundation depth and building damage assessments. For defense and government clients requiring operational
              autonomy, ICEYE provides sovereign constellation packages that combine dedicated in-orbit satellites,
              ground communication stations, and software for national mission control.
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE014
              - CE015
