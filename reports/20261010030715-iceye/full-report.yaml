      - number: '4.2'
        title: Operating Economics and Constellation Conversion
        blocks:
          - type: paragraph
            body: >-
              The economic engine of ICEYE relies on standardized smallsat manufacturing at its Espoo facility, which
              has compressed satellite assembly cycles to 10 to 11 weeks per spacecraft. Unlike legacy aerospace
              contractors that endure multi-year fabrication timelines and cost-plus contracts, ICEYE builds 85-kilogram
              X-band microsatellites at fixed production cadences, targeting an expansion from 50 satellites annually
              toward 100 units by 2028. This vertical integration allows ICEYE to absorb manufacturing fixed costs
              across both owned constellation replenishment and customer-owned sovereign spacecraft. Because turnkey
              government contracts include substantial upfront milestone payments against contracted orders, ICEYE
              generated more than €130 million in operating cash flow in 2025, effectively converting contracted
              commitments into internal working capital before launch. As satellites are deployed and commissioned,
              milestone deliverables convert into recognized revenue at strong operating margins, yielding over €100
              million in reported EBITDA and establishing an operating margin floor above 40 percent.
