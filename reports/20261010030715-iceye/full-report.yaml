      - number: '5.4'
        title: Manufacturing Cadence, Quality Controls, and Production Risks
        blocks:
          - type: paragraph
            body: >-
              Sustaining a dense satellite constellation requires an industrial manufacturing and verification cadence
              capable of high-throughput spacecraft delivery. ICEYE conducts satellite integration and flight
              verification at its primary manufacturing facility in Espoo, Finland, maintaining a build cycle of 10 to
              11 weeks per spacecraft in early 2026. Production is scaling toward an annual run rate of 50 units with a
              medium-term target of 100 satellites per year to satisfy expanding sovereign defense backlogs and
              commercial constellation replenishment needs. Before shipping to launch sites for rideshare missions on
              SpaceX Falcon 9 Transporter vehicles, each flight unit undergoes rigorous end-to-end systems and software
              checkout. This campaign encompasses onboard flight software flashing, automated avionics validation, and
              full satellite-level RF verification in an on-site anechoic chamber to guarantee payload performance. To
              eliminate critical external supply chain dependencies and qualification bottlenecks, ICEYE planned to
              bring mechanical vibration qualification testing in-house by mid-2026. Key ongoing technical risks center
              on maintaining stringent aerospace quality control and configuration traceability while accelerating
              manufacturing throughput across multidisciplinary avionics, software, and radar integration teams.
            claimRefs:
