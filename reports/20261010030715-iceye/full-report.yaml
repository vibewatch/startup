            body: >-
              ICEYE categorizes its customer base into two distinct institutional profiles: sovereign defense and
              intelligence operators procuring dedicated satellite constellations or high-priority access, and
              commercial/civil organizations subscribing to operational monitoring analytics. The sovereign segment is
              represented by national defense entities—such as the Polish Armed Forces, Portuguese Air Force, Finnish
