      - number: '4.3'
        title: Financial Traction, Backlog, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              ICEYE reported an inflection in financial performance for fiscal year 2025, generating more than €250
              million in revenue—more than doubling its 2024 topline—alongside more than €100 million in core EBITDA.
              This growth was underpinned by a contracted order backlog of €1.5 billion, representing roughly six times
              annual trailing revenue and providing multi-year visibility across European defense programs. In June
              2026, ICEYE fundamentally restructured its balance sheet through a dual equity and debt recapitalization.
              The company secured €450 million in primary Series F growth equity led by General Atlantic at a post-money
              valuation exceeding €10 billion ($12 billion), accompanied by more than €550 million in secondary share
              sales for early investors. Concurrently, ICEYE established a €300 million revolving credit facility
              secured by a syndicate of seven commercial banks against its €1.5 billion contracted backlog. With
              substantial primary cash proceeds and non-dilutive credit capacity, ICEYE holds adequate liquidity to
              finance factory expansion, payload development, and launch campaigns without near-term capital dependency.
            claimRefs:
