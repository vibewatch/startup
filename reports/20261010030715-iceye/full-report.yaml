        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Founded in Espoo in 2014 by Rafał Modrzewski and Pekka Laurila, ICEYE combines satellite design and
              operations with imagery, monitoring, analytics, and sovereign-system delivery. That vertical scope is
              strategically important: customers can buy data products or procure a dedicated capability rather than
              assemble manufacturing, launch, ground, and analytics vendors themselves. The core technical proposition
              is X-band synthetic-aperture radar, which can observe through darkness, clouds, and rain. Public sources
              support a global workforce above 1,000, but they do not provide an audited current headcount, a total
              active customer count, or a complete geographic revenue split. The snapshot therefore separates dated
              company disclosures from unavailable private operating metrics instead of treating marketing scale
              statements as independently verified KPIs.
