      - number: '3.2'
        title: Technical Capabilities, Resolution Inflections, and Revisit Dynamics
        blocks:
          - type: paragraph
            body: >-
              Competitive differentiation across commercial SAR operators is governed by two technical vectors: spatial
              resolution and constellation revisit frequency. With its Generation 4 satellite inflection launched in
              late 2025, ICEYE achieved 16-centimeter ground resolution combined with a 400-kilometer swath width on an
              85-kilogram small satellite bus. This resolution parity matches Umbra Space's Spotlight Ultra
              16-centimeter mode, removing the historical resolution advantage previously held by US operators under
              relaxed export licensing rules. Meanwhile, Capella Space differentiates primarily on tasking latency,
              marketing a 30-minute rapid-delivery commitment for priority national security tasking. Nonetheless,
              ICEYE's operational constellation scale provides a substantial structural barrier in persistent
              monitoring: operating more than 60 spacecraft in phased sun-synchronous and mid-inclination orbits allows
              ICEYE to revisit high-interest targets multiple times per day. Smaller fleets operated by Umbra and
              Capella can provide exceptional point-target tasking fidelity, but lack the orbital density required for
              continuous wide-area maritime domain surveillance or rapid-cadence flood progression tracking without
              severe tasking conflict.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP011
      - number: '3.3'
        title: Sovereign Delivery Models and Defense Anchor Economics
        blocks:
          - type: paragraph
            body: >-
              Beyond raw data licensing, ICEYE's primary structural moat is its turnkey sovereign constellation and
              federated defense delivery model. Rather than forcing sovereign defense customers into common-pool
              commercial data subscription feeds, ICEYE manufactures, delivers, and co-operates dedicated satellite
              infrastructure for national operators. This sovereign architecture is anchored by the landmark €1.76
              billion contract awarded by Germany's Bundeswehr in December 2025 to the Rheinmetall ICEYE Space Solutions
              joint venture, with options extending potential program value to €2.7 billion by 2030. Similar dedicated
              satellite procurement contracts have been established with the Swedish Armed Forces (SEK 1.3 billion for
              10 satellites), the Finnish Defence Forces, the Polish Armed Forces MikroSAR program, and Japan's IHI
              Corporation (initial four satellites with options for 24). To service this €1.5 billion contracted order
              backlog and support projected revenue exceeding €1 billion in 2026-2027, ICEYE maintains a manufacturing
              cadence of 10 to 11 weeks per satellite at its Espoo facility, scaling toward an annual production rate of
              50 units by April 2026 and bringing mechanical vibration testing in-house by June 2026 to de-bottleneck
              launch integration.
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
