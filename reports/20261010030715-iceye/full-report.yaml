      - number: '5.3'
        title: Tactical Deployment, Ground Infrastructure, and Integration
        blocks:
          - type: paragraph
            body: >-
              Tactical operational integration represents a central focus of ICEYE's defense and disaster management
              product engineering. To compress the latency between orbital radar collection and actionable intelligence
              in operational theaters, ICEYE developed the deployable ISR Cell. Built as a self-contained containerized
              mobile ground station, the ISR Cell integrates direct downlink capture, onboard image processing, and
              analytical dissemination into a single tactical footprint proven during NATO military exercises to reduce
              the sensor-to-shooter timeline to minutes. For civil emergency management and disaster response,
              cloud-based data feeds stream geospatial intelligence directly to institutional responders. Recent
              operational adoptions, such as the deployment by the California Governor's Office of Emergency Services
              (Cal OES), demonstrate the integration of Flood Insights and Wildfire Insights across state disaster
              agencies for flood depth tracking and wildfire structural damage analysis. Technical documentation and
              developer access are supported via searchable web portals and public GitHub repositories, where ICEYE
              publishes an open-source documentation toolchain based on Python, MkDocs, and Material themes. However,
              public disclosures regarding automated flood and wildfire algorithms omit third-party audited benchmarks
              regarding false-positive rates, minimum resolvable building dimensions, and actual end-to-end tasking
              turnaround during fast-moving disaster events.
