    body: "Unlike typical pre-revenue space technology startups, ICEYE demonstrated positive operating leverage in 2025, generating over €100 million in EBITDA on €250 million of revenue (a 40 percent EBITDA margin floor) and over €130 million in operating cash flow. The ability to collect upfront milestone payments on its €1.5 billion sovereign order backlog allows the company to fund working capital needs internally, supported by a €300 million revolving credit line."
