callouts:
  - calloutType: insight
    title: Defense Subsidization Shapes Commercial Price Discovery
    body: Commercial SAR imagery pricing does not reflect standalone constellation capital expenditure. High-margin sovereign and defense anchor contracts fund constellation manufacturing and deployment, enabling operators like ICEYE to monetize residual orbital capacity across insurance and maritime verticals at aggressive price points that pure commercial operators cannot match on standalone economics.
    claimRefs:
      - CP008
      - CP009
  - calloutType: risk
    title: Concentration in Sovereign Procurement Cycles
    body: While dedicated sovereign satellite sales provide upfront milestone cash flow and multi-year backlog, they tie operator revenue to long bilateral defense procurement cycles and geopolitical alliances. Changes in national defense budgets, foreign access review policies, or regional protectionism—such as Japan's preferential spending on Synspective—could constrain international market expansion.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP012
