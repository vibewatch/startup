callouts:
  - calloutType: "insight"
    title: "The Sovereign Inflection in SAR Economics"
    body: "ICEYE's commercial breakthrough is fundamentally driven by sovereign defense autonomy rather than purely commercial imagery sales. By offering rapid turnaround turnkey constellations—delivering operational orbit within 10 months as demonstrated in Poland—ICEYE bypasses decade-long legacy aerospace procurement cycles while securing billion-euro order backlogs."
    claimRefs:
      - "CU005"
      - "CU009"
      - "CU014"
  - calloutType: "risk"
    title: "Concentration and Multi-Year Delivery Execution Risks"
    body: "With backlog heavily concentrated in a small group of European defense programs (including the 1.7B euro German Bundeswehr SPOCK 1 contract), ICEYE is sensitive to government procurement delays, international export compliance hurdles, and local manufacturing obligations across expanding international subsidiaries."
    claimRefs:
