callouts:
  - calloutType: "risk"
    title: "The Sovereign Localization Overhead Dilemma"
    body: "ICEYE's strategy of launching dedicated national subsidiaries across Germany, Portugal, the UAE, India, the Netherlands, and South Korea inside a 49-day window demonstrates unparalleled commercial ambition, but it creates structural operational overhead. Unlike pure-play satellite data operators that scale software margins centrally, delivering sovereign constellations requires funding localized cleanrooms, hiring country chief executives, and committing to domestic manufacturing facilities. If sovereign defense procurement budgets slow down or experience administrative delays, fixed regional facility costs will rapidly compress corporate operating margins."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR010"
