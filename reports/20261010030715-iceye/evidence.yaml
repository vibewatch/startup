evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee mandates, voting rights, delegated authorities, and founder-succession plan.
    whyItMatters: Founder concentration and investor protections cannot be assessed from financing announcements.
    diligencePath: >-
      Request the current cap table, shareholder agreement, board materials, reserved-matters schedule, and succession
      documentation.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Total active customer count, top-customer concentration, renewals, termination rights, and sovereign-contract
      margin profile.
    whyItMatters: Seven government procurements do not reveal diversification, retention, or the quality of contracted backlog.
    diligencePath: >-
      Obtain a customer-level revenue and backlog cohort with contract dates, margins, renewals, cancellations, and
      concentration.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited 2025 financial statements, cash balance, net debt, backlog conversion schedule, and primary proceeds
      remaining after uses.
    whyItMatters: Unaudited revenue, EBITDA, and backlog cannot establish cash generation, margin durability, or runway.
    diligencePath: >-
      Request audited statements, quality-of-earnings work, debt schedules, cash statements, and contract-level backlog
      reconciliation.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: incident-history
    missingEvidence: >-
      Complete launch, on-orbit failure, collision-avoidance, cyber, outage, and deorbit history for ICEYE-operated and
      sovereign fleets.
    whyItMatters: The absence of an incident in the assigned sources is not evidence that no incident occurred.
    diligencePath: Reconcile ICEYE fleet records with regulator, launch-provider, space-track, insurer, and customer incident logs.
  - type: conflicting-data
    severity: material
    topic: market-sizing-divergence
    missingEvidence: >-
      Third-party verified market sizing specifically isolating commercial SAR data and software services from prime
      aerospace satellite manufacturing and launch spend.
    whyItMatters: >-
      Broad top-down estimates of $32.1B to $83.3B for the SAR market conflate government hardware manufacturing primes
      with addressable B2B and sovereign data-as-a-service spending.
    diligencePath: >-
      Obtain granular segment-level market studies and procurement line-item audits from European and U.S. defense
      agencies isolating annual data subscription line items.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-pricing-transparency
    missingEvidence: >-
      Granular list pricing schedules, per-scene spot tasking rates, and volume discount tiers for commercial SAR
      operators (Umbra, Capella, ICEYE, Synspective).
    whyItMatters: >-
      Without published commercial price schedules, buyers and underwriters cannot independently audit price realization
      or verify whether commercial contracts reflect standalone unit economics or defense-subsidized margin dumping.
    diligencePath: >-
      Request anonymized rate cards, enterprise tasking quotes, and distributor agreements during management access or
      customer calls.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-retention
    missingEvidence: >-
      Detailed breakdown of commercial Net Revenue Retention (NRR), customer churn, and cohort gross margins across
      insurance and defense subscriptions.
    whyItMatters: >-
      Without cohort retention and gross margins, underwriting relies on headline backlog and unaudited company EBITDA
      assertions.
    diligencePath: >-
      Request audited segmented revenue disclosures, customer cohort renewal logs, and billing schedules under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: sovereign-backlog-conversion
    missingEvidence: >-
      Milestone-by-milestone revenue recognition schedule and gross margin realization for the €1.5 billion contracted
      sovereign backlog.
    whyItMatters: >-
      Turnkey satellite delivery contracts involve substantial execution and launch risks that can defer revenue
      recognition and compress project-level margins.
    diligencePath: >-
      Review master service agreements and milestone acceptance certificates for major sovereign programs (e.g., Poland
      POLSARIS and Germany SPOCK).
    relatedQuestionRefs:
      - QI008
      - QI009
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: turnaround-latency-benchmarks
    missingEvidence: >-
      Empirical third-party benchmarks specifying actual elapsed hours from dynamic tasking request to Level 1 processed
      image delivery across varying orbital planes.
    whyItMatters: >-
      Operational utility for rapid tactical disaster and defense response depends directly on actual
      tasking-to-delivery latency rather than theoretical orbital revisit rates.
    diligencePath: >-
      Request customer SLA reports and anonymized mission delivery timestamp logs from state emergency and defense
      operators.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: commercial-retention-nrr
    missingEvidence: >-
      Audited customer retention, net revenue retention (NRR), churn figures, and customer count by vertical across
      commercial insurance and civil analytics.
    whyItMatters: >-
      Without retention and recurring ARR disclosures, investors cannot determine whether commercial analytics revenue
      represents durable software-like recurring margins or unrenewed pilot grants.
    diligencePath: >-
      Request customer cohort renewal matrices, NRR disclosures, and active account rosters under NDA during
      confirmatory financial due diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
