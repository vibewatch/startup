          modules:
            - Level 1 复数影像合成器
            - Level 1 检测振幅处理器
            - 辐射与几何校准
        - label: 垂直分析与灾害洞察
          detail: 通过专用算法生成建筑级损害、洪水深度和态势情报。
          modules:
            - Flood Insights 与深度建模
            - Wildfire Insights 结构评估
            - 砍伐森林与海事追踪器
        - label: 交付接口与开发者工具链
          detail: 安全企业 API、可搜索的网页规格说明和开源 MkDocs 集成工具。
          modules:
