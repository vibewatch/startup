      - number: '5.3'
        title: 战术部署、地面基础设施与集成
        blocks:
          - type: paragraph
            body: >-
              战术运营集成是 ICEYE 国防和灾害管理产品工程的重点。为压缩轨道雷达采集到战场可行动情报的延迟， ICEYE 开发了可部署的 ISR Cell。这一自成一体的集装箱式移动地面站，把直接下行接收、机上图像处理
              和分析分发整合到一个战术单元；NATO 军演证明它能把传感器到射手的时间压缩至数分钟。民用应急和 灾害响应则由云端数据流直接向机构响应者发送地理空间情报。California Governor's Office
              of Emergency Services（Cal OES）部署 Flood Insights 和 Wildfire Insights，说明它们已接入州级灾害机构，用于
              洪水深度追踪和野火结构损毁分析。技术文档和开发者访问通过可搜索网站及公开 GitHub 仓库提供，ICEYE 在其中发布基于 Python、MkDocs 和 Material
              主题的开源文档工具链。但自动洪水和野火算法的公开披露 没有第三方审计基准，无法确认误报率、可分辨的最小建筑尺寸或快速灾害中的真实端到端任务交付时间。
