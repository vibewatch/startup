          stage: Allied Defense Consortium
          touchpoints:
            - Industrial participation consortia (Finnish F-35 program with Lockheed Martin)
            - Deployable containerized tactical ISR Cell units compressing loops to minutes
            - Joint development of automated target recognition with national defense primes
        - label: 主权星座所有权
          stage: Sovereign Constellation Ownership
          touchpoints:
            - Turnkey delivery of sovereign satellite constellations (POLSARIS in Poland)
            - Domestic ground station setup, sovereign encryption, and independent operator training
            - Long-term infrastructure expansion and repeat procurement options (e.g. Portugal, Germany)
        - label: 工业合资运营
          stage: Industrial Joint Venture Operations
          touchpoints:
            - Joint venture structures with domestic primes (Rheinmetall ICEYE Space Solutions)
            - Long-term exclusive constellation operations and BAAINBw multi-year service contracts
            - Open-architecture multi-partner tactical space integration through 2030
        - label: 联邦式联盟星座
          stage: Federated Coalition Constellations
          touchpoints:
            - Connecting sovereign national constellations into federated allied fleets
            - Expansion toward the 1,000-satellite Constellation Europe framework
            - Coordinated tactical revisit times compressed to sub-15-minute windows
    approximationNotes: 展示机构客户的推进路径，依据是已披露的国防与应急管理采用顺序。
