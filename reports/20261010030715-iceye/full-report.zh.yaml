      - number: '6.4'
        title: 持续性、主权集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              尽管表面增长强劲，ICEYE 仍面临显著收入集中度和机构采购摩擦。主权国防合同占签约积压和收入的绝大 部分，使公司暴露于政府预算周期、国防采购延迟和地缘政治变化。欧洲采购周期在结构上仍很长，促使 ICEYE
              管理层倡议采用拟议中的 1,000 颗卫星 Constellation Europe 等多国联邦模式。政府灾害救援之外，
              商业分析采用仍处早期：保险和公用事业领域的大型商业合同未披露净收入留存率（NRR）或流失指标，州级 应急部署也常从补助支持或无定价的机构间数据共享开始。此外，国际主权扩张需要昂贵的本地化，例如
              在德国、葡萄牙、UAE 和荷兰设立专用公司实体与工程中心；这会在分散的监管辖区产生持续固定开支和 运营摩擦。
            claimRefs:
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
