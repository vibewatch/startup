      - number: '3.2'
        title: 技术能力、分辨率拐点与重访动态
        blocks:
          - type: paragraph
            body: >-
              商业 SAR 运营商的竞争差异主要由两个技术向量决定：空间分辨率和星座重访频率。ICEYE 在 2025 年底 发射第四代卫星后，在 85 千克小卫星平台上实现 16 厘米地面分辨率和 400
              千米幅宽。这一分辨率与 Umbra Space 的 Spotlight Ultra 16 厘米模式持平，消除了美国运营商在出口许可较宽松时期拥有的历史 优势。Capella Space
              则主要以任务响应延迟区分自己，宣传优先国家安全任务可在 30 分钟内快速交付。 尽管如此，ICEYE 的运营星座规模仍为持续监测构成显著结构壁垒：超过 60 艘航天器部署在编队太阳同步
              轨道和中倾角轨道上，可每天多次重访高价值目标。Umbra 和 Capella 的小型舰队能提供出色的点目标任务 精度，却缺乏连续广域海事监测或高频洪水演进跟踪所需的轨道密度，除非承受严重任务冲突。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
