            body: >-
              ICEYE 报告称，2025 财年财务表现出现拐点，收入超过 €250 million，较 2024 年翻倍以上，核心 EBITDA 超过 €100 million。增长由 €1.5 billion
              的签约订单积压支撑，约为过去一年收入的六倍，为欧洲国防项目 提供多年可见性。2026 年 6 月，ICEYE 通过股债双重资本重组根本性调整资产负债表。公司在 General Atlantic 领投下获得
              €450 million 的 Series F 新增成长股权，投后估值超过 €10 billion（$12 billion）， 同时早期投资者出售老股超过 €550 million。与此同时，ICEYE 以
