      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: SAR 经济性的主权拐点
            body: >-
              ICEYE 的商业突破根本上由主权国防自主驱动，而非单纯的商业影像销售。公司提供快速交付的交钥匙星座， 如波兰案例在 10 个月内实现运营入轨，因而绕开长达十年的传统航空航天采购周期，同时锁定十亿欧元级
              订单积压。
            calloutType: insight
            claimRefs:
