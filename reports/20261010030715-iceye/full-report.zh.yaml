  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与机构购买画像
        blocks:
          - type: paragraph
            body: >-
              ICEYE 将客户分为两类机构画像：采购专用卫星星座或高优先级访问权的主权国防与情报运营商，以及订阅 运营监测分析的商业和民用组织。主权客户包括波兰武装部队、葡萄牙空军、芬兰国防军，以及通过与
              Rheinmetall 合作的工业合资企业服务的德国 Bundeswehr。主权买家需要专用地面段控制、国家密码集成 和国内运营自主性。商业及民用客户则包括 California Cal OES
              等州级应急机构，以及保险和公用事业 承保人；它们不运营太空资产，而是采购 Flood Insights、Wildfire Insights 等专门情报数据流。这种 双轨架构让 ICEYE
              能把高重访轨道扫描复用于商业灾害响应，并用大额多年期主权国防拨款覆盖卫星资本支出。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: 采用轨迹、制造节奏与运营规模化
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的商业规模在 2024 至 2026 年间明显出现拐点，动力来自欧洲东翼和 NATO 盟友的地缘政治需求。 收入从 2024 年的 131 million dollars 同比翻倍至 2025 年的
              283 million dollars（约 250 million euros）， 同时 EBITDA 超过 100 million euros，经营现金流超过 130 million euros。公司进入
              2026 年时，签约订单 积压超过 1.5 billion euros，德国授予 Rheinmetall ICEYE 合资企业的 1.7 billion euro SPOCK 1 星座
              合同等主权项目提供支撑。为服务这条管线，ICEYE 改造埃斯波工厂，将每艘航天器制造周期维持在 10 至 11 周，目标是 2026 年中年产 50 颗、2028 年年产 100
              颗。但主权国防合同包含卫星交付、地面段调试 和操作员培训等分阶段里程碑，因此积压转化仍取决于多年部署周期，而非即时的经常性软件收入。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: 已知客户部署与运营证明
        blocks:
          - type: paragraph
            body: >-
              经公开验证的客户部署，证明 ICEYE 已在多种运营场景采用。在波兰，武装部队在签约后 10 个月内通过 POLSARIS 系统用四颗 ICEYE SAR 卫星达到运营就绪，验证了快速主权移交。在葡萄牙，空军于
              2026 年初 部署 CA-01 和 CA-02，并于 2026 年 6 月通过 CTI Aeroespacial 行使另外两颗卫星的续购选项，显示 客户版图扩大且配有本地工程中心。在芬兰，ICEYE 与
              Lockheed Martin 和 Insta 一起，在国防部 F-35 采购下牵头工业参与联盟，开发适应北极的 ISR Cell 和战术边缘分析。在民用领域，California Cal OES 于 2026
              年 2 月整合 ICEYE 的 Flood Insights 和 Wildfire Insights，用于建筑级影响评估；此前双方 曾在 2025 年洛杉矶野火期间与 FEMA 联合部署，但州合同未披露长期价值。
