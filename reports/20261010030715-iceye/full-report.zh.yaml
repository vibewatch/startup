        - 商业光学供应商和新兴小卫星 SAR 运营商（Capella、Umbra）压低重访定价
        - 独立证据证明其在非防务垂直领域持续拥有定价权并扩大商业合同
      - - 主权需求
        - 欧洲防务现代化推动多年期主权星座和数据订阅承诺
        - 主权防务采购周期容易受政治影响，并可能因行政授标延迟
