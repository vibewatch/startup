  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行层风险图景与严重性层级
        blocks:
          - type: paragraph
            body: >-
              ICEYE 从销售卫星影像订阅转向移交主权 SAR 星座，根本改变了组织风险画像。在严格国防时间表下交付 运营星座，会让公司承担标准 space-as-a-service
              商业合同从未遇到的严重合同责任和地缘政治摩擦。首要 脆弱点是主权执行：各国国防客户要求严格的国内制造、本地化软件安全和完整运营自主性，德国、葡萄牙、
              UAE、印度、荷兰和韩国近期设立实体已体现这一点。卫星交付延期或分散制造地点的部件集成停滞时，主权 买家仍可利用政治和合同杠杆处罚主承包商或推迟计划中的选项付款。即使能够产生经营现金流，资本需求
              仍然较高，因为维持高重访轨道星座和全球装配设施需要持续基础设施投入。按主权估值投资 ICEYE 时， 投资者必须判断本地化制造网络能否扩张，同时不放大管理费用、运营瓶颈和监管审批延迟。
            claimRefs:
