  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、感知方式与品类范围
        blocks:
          - type: paragraph
            body: >-
              合成孔径雷达（SAR）市场在更广泛的商业地球观测（EO）和地理空间情报领域中，拥有清晰且可守住的 边界。传统商业卫星依赖需要阳光和晴空的被动光学或高光谱载荷，而 SAR 系统主动发射 X 波段微波
              信号，记录反射回来的相干回波。这种主动感知能力划出了明确的运营边界：可持续昼夜成像，穿透厚云、 降水和野火烟柱。行业登记机构追踪的商业地球观测和卫星雷达生态共有 413 家活跃市场实体，其中 74 家
              获得融资的商业企业在航天器平台制造、雷达载荷工程和下游分析平台之间竞争。商业支出主要分为三种 交付方式：通过任务 API 直接销售影像；提供洪水深度、野火影响评估等自动化垂直分析数据流；以及为
              各国国防部部署专用的星座即服务。关键在于，可服务的商业边界不包括免费公共层级的科学雷达任务， 尤其是 European Space Agency 的 Copernicus Sentinel-1
              星座；该星座向全球提供开放的中等分辨率 C 波段雷达数据。因此，商业供应商无法把基础广域雷达观测变现，市场争夺必须集中在亚米级分辨率、 高敏捷战术重访和交钥匙主权任务所有权上。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM010
              - CM013
      - number: '2.2'
        title: 市场规模视角、增长轨迹与主权国防 S 曲线
        blocks:
          - type: paragraph
            body: >-
              合成孔径雷达的市场规模会因分析者衡量的是广义航空航天硬件产值，还是可触达的经常性地理空间数据 和星座服务，而出现巨大差异。Future Market Insights 的自上而下行业评估预计，全球合成孔径雷达
              市场将从 2025 年的 $32.1 billion 增长至 2035 年的 $83.3 billion，复合年增长率约为 10.0%。但
              这个顶层总量把多吨级军用主卫星硬件、主权发射载具采购和机密国防载荷，与可触达的商业及主权 New Space 数据服务混在一起。若仅看商业和主权卫星雷达服务，市场增长呈现由地缘政治对主权太空 侦察的需求推动的陡峭
              S 曲线。欧洲及其盟友的国防部加快采购专用卫星，以获得对非主权情报平台的 战略自主。采购转向的标志性里程碑，是德国联邦国防军（Bundeswehr）于 2025 年 12 月向 Rheinmetall-ICEYE
              合资企业授予 €1.7 billion 的 SPOCK 1 主权雷达系统合同。ICEYE 未经审计的 2025 年财务披露进一步印证了这一主权国防轨迹：签约且尚未确认的收入订单积压为 €1.5 billion，
              同比收入翻倍并超过 €250 million。这种结构性积压表明，近期 SAR 市场扩张主要由多年期政府国防 预算科目提供资本，而不是周期性商业软件预算。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
