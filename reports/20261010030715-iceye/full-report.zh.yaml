      - number: '7.4'
        title: 合作伙伴依赖、交易对手摩擦与财务韧性
        blocks:
          - type: paragraph
            body: >-
              ICEYE 的防务业务依赖战略合资企业、主承包商中介和单一来源的主权合同，因此暴露于结构性交易对手风险。 在德国，公司 €1.7 billion 的 Bundeswehr SPOCK 1 承诺通过
              Rheinmetall ICEYE Space Solutions 合资企业执行；Rheinmetall 持有 60% 控股权，ICEYE 持有 40%。 这套公司架构让 ICEYE 依赖 Rheinmetall
              的主承包商治理、其在德国防务体系内的政治定位，以及 Neuss 的设施里程碑。 在阿联酋与 Space42、加拿大与 MDA Space 的类似合资和合作架构，也带来共同治理摩擦及多方交付风险。
              与此同时，面向保险辛迪加和应急办公室的灾害风险情报等商业举措虽扩大了商业基础，收入仍高度集中于一小批主权防务部委。 若预算重点改变、盟国采购周期拉长，或全国选举后地缘政治阵营发生变化，ICEYE
              的已签订单积压可能大幅延期，利润率也可能被压缩。
            claimRefs:
              - CR002
