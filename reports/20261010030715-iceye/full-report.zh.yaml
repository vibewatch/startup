            body: >-
              ICEYE 的经济引擎依托埃斯波工厂的标准化小卫星制造，将每艘航天器的组装周期压缩至 10 至 11 周。 不同于制造周期多年、采用成本加成合同的传统航空航天承包商，ICEYE 按固定节奏建造 85 千克 X
              波段 微型卫星，目标是从年产 50 颗扩至 2028 年的 100 颗。纵向整合让 ICEYE 能在自有星座补充和客户拥有的
