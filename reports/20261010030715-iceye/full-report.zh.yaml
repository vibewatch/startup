  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心运营假设
      - 估值 / 回报逻辑
      - 主要风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 2027 年收入达到 €1B+；SPOCK 1 扩张；EBITDA 利润率超过 40%；卫星产量达到每年 100 颗
        - $18B–$22B 估值（2027E 收入的 18 倍–22 倍）；通过欧洲 / 美国 IPO 为成长型投资者带来可观上行空间
        - 地缘政治降温压低防务预算；运载火箭故障或出口许可延迟
        - 25%（需要主权预算持续加速，且卫星制造扩张不损失良率）
      - - 基准情景
        - 2027 年收入增至 $550M–$650M；积压订单稳定转化；EBITDA 稳定在 $180M–$220M 左右
        - $10B–$13B 估值（远期收入的 15 倍–20 倍）；倍数正常化，对应 1.0 倍–1.2 倍 MOIC
        - 主权采购延迟、积压订单消化放缓、商业客户流失和星座资本开支
        - 50%（在欧洲采购摩擦中主权合同稳步扩张，这是最可能的路径）
      - - 悲观情景
        - 收入增长放缓至低于 20%（$350M–$400M）；SPOCK 1 合资企业利润率下滑；竞争对手压价
        - $4B–$6B 估值（10 倍–12 倍倍数压缩）；Series F 股权在下轮融资中损失 50%–65%
        - 倍数向传统航空航天倍数（3 倍–10 倍）压缩；客户集中度损失；发射失败
        - 25%（若资本市场将防务科技倍数重新定价至接近上市同业，将出现实质性下行）
    notes: 前瞻情景建模截至 2028 年的潜在回报分布；概率为定性分析估计。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV011
