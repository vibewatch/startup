      - - 财务模型
        - 2025 年实现经营盈利，€1.5B 积压订单带来超过 €100M EBITDA 和超过 €130M 现金流
        - 星座补充资本密集度高，且依赖第三方发射，消耗经营现金
        - 证明星座可在多年内自我融资，无需依赖外部成长股权轮
      - - 估值与退出
        - 独角兽十倍体量地位（€10B+ / $12B 估值）使 ICEYE 成为欧洲防务科技 IPO 的首选锚定资产
        - 40.3 倍收入倍数已计入到 2027 年实现 €1B+ 收入门槛的完美运营执行
        - 有审计支持的 EBITDA 利润率升至 40% 以上，同时有机收入持续同比增长超过 50%
