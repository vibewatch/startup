      - number: '3.3'
        title: 主权交付模式与国防锚定经济性
        blocks:
          - type: paragraph
            body: >-
              除了原始数据授权，ICEYE 的主要结构性护城河是交钥匙主权星座和联邦国防交付模式。ICEYE 不把主权国防 客户塞进共享商业数据订阅流，而是为各国运营商制造、交付并共同运营专用卫星基础设施。这一主权架构 由德国
              Bundeswehr 于 2025 年 12 月授予 Rheinmetall ICEYE Space Solutions 合资企业的标志性 €1.76 billion 合同支撑；合同选项可能把项目价值推高至
              2030 年的 €2.7 billion。ICEYE 还与瑞典 武装部队（10 颗卫星、SEK 1.3 billion）、芬兰国防军、波兰武装部队 MikroSAR 项目及日本 IHI
              Corporation（首批 4 颗卫星，另有 24 颗选项）签订类似专用卫星采购合同。为服务 €1.5 billion 的签约订单积压并支撑 2026-2027 年超过 €1 billion
              的预计收入，ICEYE 在埃斯波工厂保持每颗卫星 10 至 11 周的制造节奏，目标是在 2026 年 4 月达到年产 50 颗，并在 2026 年 6 月将机械振动测试 内置化，以消除发射集成瓶颈。
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP013
              - CP014
