            body: >-
              每颗 ICEYE 卫星以 85 kg 微型卫星平台为基础，集成中心频率 9.75 GHz 的有源相控阵 X 波段雷达。卫星 运行在太阳同步低地球轨道，轨道倾角约 97.7 度，高度对应 96 分钟周期，每天成像约
              15 圈。天线通过 电子波束转向覆盖 40 至 300 MHz 带宽，使航天器可在 15 至 35 度入射角范围内左右观测，无需机械转向。 遥测、雷达指令和原始数据经 140 Mbit/s 专用 X
