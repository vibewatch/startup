  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户运营工作流
        blocks:
          - type: paragraph
            body: >-
              ICEYE 通过运行在 X 波段的商业 SAR 微型卫星星座，交付持续地球观测数据。不同于依赖晴朗白昼的光学 成像系统，ICEYE 雷达传感器发射微波脉冲，穿透云层、烟柱和黑暗，在各种天气下捕捉地表影像。核心
              商业数据产品分为四种标准成像模式，在空间分辨率和地面幅宽之间取平衡：Spot、Spot Large Extended Area（SLEA）、Strip 和 Scan。它们在局部高保真采集时提供 1
              米至广域海事扫描时 15 米的地面采样 分辨率。产品以 Level 1 复数影像分发，保留完整雷达相位和幅度回波供干涉分析；也提供适配标准地理 信息系统的幅度检测影像。除原始和处理后影像文件外，ICEYE 还开发
              Flood Insights、Wildfire Insights 等垂直方案，把原始雷达后向散射回波转成积水深度、建筑损毁评估等可行动灾害指标。对需要 运营自主性的国防和政府客户，ICEYE
              提供主权星座套装，包括专用在轨卫星、地面通信站和国家任务 控制软件。
