      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 主权本地化的管理开销困境
            body: >-
              ICEYE 在 49 天内于德国、葡萄牙、阿联酋、印度、荷兰和韩国设立专门的国家子公司，展现出罕见的商业野心，但也制造了结构性运营开销。
              与集中扩大软件利润率的纯卫星数据运营商不同，交付主权星座需要投入本地洁净室、聘用各国 CEO，并承诺建设国内制造设施。 如果主权防务采购预算放缓或遭遇行政延误，区域设施的固定成本会迅速挤压公司运营利润率。
