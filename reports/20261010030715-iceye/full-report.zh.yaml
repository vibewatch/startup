      - number: '5.4'
        title: 制造节奏、质量控制与生产风险
        blocks:
          - type: paragraph
            body: >-
              维持密集卫星星座，需要具备高吞吐交付能力的工业制造和验证节奏。ICEYE 在芬兰埃斯波主工厂进行卫星 集成和飞行验证，2026 年初每艘航天器制造周期为 10 至 11 周。产能正扩至年产 50 颗，中期目标是
              年产 100 颗，以满足扩大的主权国防积压和商业星座补充需求。每个飞行单元在运往发射场、搭乘 SpaceX Falcon 9 Transporter
              拼车任务前，都要完成严格的端到端系统和软件检查，包括刷写机载飞行软件、 自动航电验证，以及在现场消声室完成整星 RF 验证，以保证载荷性能。为消除关键外部供应链依赖和 资格认证瓶颈，ICEYE 计划在 2026
              年中前将机械振动资格测试内置化。持续的技术风险在于，制造吞吐 加速的同时，仍要维持严格的航空航天质量控制和配置可追溯性，协调航电、软件和雷达集成团队。
