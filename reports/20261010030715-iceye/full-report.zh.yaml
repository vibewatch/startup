      - CE003
      - CE005
      - CE006
      - CE008
      - CE009
      - CE013
    data:
      layers:
        - label: 轨道航天器与雷达载荷
          detail: 由 85 kg 微型卫星组成的星座，运行于太阳同步轨道，搭载 9.75 GHz 有源相控阵 SAR 天线。
          modules:
            - X 波段有源相控阵
            - 双视角电子指向
            - Gen4 超高分辨率传感器
        - label: 星座管理与任务调度
          detail: 面向不同客户层级，自动安排星座计划、轨道相位和动态成像任务。
          modules:
            - 动态轨道调度
            - 多轨道面重访优化器
            - 应急任务接收
        - label: 地面下行与战术直接接收
          detail: 高速 140 Mbit/s X 波段地面遥测下行链路和战术移动接收机部署。
          modules:
            - 140 Mbit/s X 波段地面网络
            - 容器化战术 ISR 单元
            - 战区直接下行
        - label: 雷达处理与校准引擎
