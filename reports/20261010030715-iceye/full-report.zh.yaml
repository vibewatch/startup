      - number: '7.2'
        title: 监管监督、出口管制与主权安全
        blocks:
          - type: paragraph
            body: >-
              在盟国防务领域开展业务，必须应对监管高复杂度和多法域要求；这些规则约束高分辨率雷达技术及轨道硬件转移。ICEYE 虽以不受 ITAR
              约束的架构面向欧洲及国际客户，以最大化主权客户采用，但这种设计并不能消除主权出口管制或国家安全审查。
              公司必须持续取得芬兰主管部门、欧盟两用物项监管机构以及每个运营战区当地防务机构的国家级出口许可。同时，ICEYE 专门设立的美国子公司 ICEYE US 与包括 National Reconnaissance
              Office 在内的机构签有独立的机密侦察合同，因此美国防务活动与海外业务之间必须设置严格的运营和公司防火墙。
              这条双轨架构会制造运营摩擦，限制跨境技术转移，并要求严密的合规治理，以防无意中的监管违规或知识产权外溢。 若主要市场启动正式调查、拒绝出口许可或撤销安全许可，国际扩张将受到严重冲击，主权客户交付计划也会停摆。
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR011
      - number: '7.3'
        title: 运营扩张、供应链韧性与发射依赖
        blocks:
          - type: paragraph
            body: >-
              到 2028 年，卫星年化产量要从 50 艘提升至目标 100 颗，会显著放大制造、零部件采购和发射节奏的脆弱性。 ICEYE 虽在芬兰自建产线，每颗卫星的整合生产周期为 10 至 11
              周，但仍高度依赖外部商业发射商、专用微波载荷组件和地面站下行链路。 商业拼车发射供给出现系统性中断、轨道交付失败或运载火箭停飞，都会直接拖慢轨道星座补充，削弱战术重访能力。 到了轨道载荷环节，以 140
              Mbit/s 下行高带宽 X 波段雷达遥测，需要可靠且地理分散的地面站网络；但当地监管许可障碍、地缘政治隔离或区域通信中断都可能使其失效。 包括 Neuss 和 Abu Dhabi
              新规划的洁净室、测试中心在内，本地化装配设施若人员培训落后于公司标准，也会引入额外运营故障模式。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR012
          - type: table
            tableRef: TR002
