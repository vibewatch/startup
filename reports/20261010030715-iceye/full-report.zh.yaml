      - number: '3.4'
        title: 商业价格发现、交叉补贴与商品化风险
        blocks:
          - type: paragraph
            body: >-
              地球观测雷达商业化存在源于军民两用星座经济性的结构性价格发现异常。高利润主权基础设施合同和国防 锚定项目承担星座资本支出及发射成本，因此运营商可以按边际成本为增量商业容量定价。在商业保险和
              应急响应领域，ICEYE 向全球大型再保险商（Swiss Re）及 California Governor's Office of Emergency Services（Cal OES）等公共机构提供 Flood
              Insights、Flood Rapid Impact 和 Wildfire Insights 等 垂直方案，利用了这一机制。灾害发生数小时内交付建筑级损害多边形，为保险公司带来纯数据流无法复制 的 claims
              理赔分流 ROI。但依赖国防交叉补贴也带来长期行业风险：商业单景定价下降速度快于独立商业单位经济性 所能支持的水平，使 Synspective 等单一市场运营商因每颗卫星 $15.6 million
              的更高建造成本而承受 严重利润压力。此外，随着美国 National Reconnaissance Office（NRO）从 Stage III 商业研究合同
              转向正式项目，注册在美国的供应商与外国军民两用供应商之间的竞争张力会加剧。
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 国防补贴塑造商业价格发现
            body: >-
              商业 SAR 影像定价并不反映独立星座的资本支出。高利润主权和国防锚定合同为星座制造及部署提供资金， 让 ICEYE 等运营商得以在保险和海事垂直领域以激进价格变现剩余轨道容量，纯商业运营商无法凭独立经济
              性匹敌。
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
          - type: callout
            title: 主权采购周期集中
            body: >-
              专用主权卫星销售带来前期里程碑现金流和多年期积压，但也把运营商收入绑在漫长的双边国防采购周期 和地缘政治联盟上。各国国防预算、外国准入审查政策或区域保护主义的变化——例如日本优先向 Synspective
              支出——都可能限制国际市场扩张。
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP012
  - number: 4
    title: 财务
    sections:
