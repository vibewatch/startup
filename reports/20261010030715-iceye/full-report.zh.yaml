      - number: '2.3'
        title: 买家分层、预算归属与机构采用路径
        blocks:
          - type: paragraph
            body: >-
              商业 SAR 市场的采用沿着三类机构买家展开，各自的预算周期和技术工作流差异明显。最大需求来自主权 国防部和情报机构，包括德国 Bundeswehr、波兰国防部、葡萄牙空军和美国国防机构。在美国，National
              Reconnaissance Office（NRO）通过 Strategic Commercial Enhancements（SCE）计划选用 ICEYE US， 借助灵活的 Commercial
              Solutions Opening，将商业雷达与光学、高光谱和 RF 数据一起接入国家多现象 情报架构。主权国防买家通过多年期国防基础设施拨款采购专用星座容量、地面站硬件和优先任务权。第二
              类是全球财产巨灾再保险商和直接保险辛迪加，包括 Swiss Re 及 Munich Re 的 Risk Management
              Partners；它们购买自动洪水和野火影响服务的年度企业订阅，以建立客观的参数化损失触发条件并加快 claims 理赔处理。第三类新兴买家是次主权公共安全机构。2026 年，加州 Governor's
              Office of Emergency Services（Cal OES）在全州民用机构正式整合 ICEYE 的 Flood Insights 和 Wildfire Insights，从 联邦 FEMA
              数据共享渠道转向常设的州级运营合同。为服务这些盟友主权客户，同时避免割裂在轨资产， 运营商正更多采用联邦舰队架构，让各国互联本国星座以提高集体重访能力，同时保留主权任务权限。
            claimRefs:
