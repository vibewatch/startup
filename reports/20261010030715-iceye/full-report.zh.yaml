            title: 集中度与多年交付执行风险
            body: >-
              订单积压高度集中于少数欧洲国防项目（包括德国 Bundeswehr 的 1.7B euro SPOCK 1 合同），ICEYE 因此
              对政府采购延迟、国际出口合规障碍，以及不断扩大的海外子公司的本地制造义务十分敏感。
