      - number: '4.4'
        title: 财务结论、估值倍数与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              ICEYE 股权估值超过 €10 billion，相当于过去 2025 年 €250 million 收入的约 40 的收入倍数。管理层预计 2026 年收入超过 €500 million，这会把估值倍数压至约
              20 的远期收入倍数；但当前定价已计入近乎无瑕的执行力和 持续的欧洲国防顺风。ICEYE 的收入激增与地区地缘冲突后的欧洲安全支出紧密相关，因此任何政治降温、
              采购预算停滞或主权合同授予遭抗议，都会实质性威胁管线转化。此外，缺少公开经审计财务报表，也阻碍 外部投资判断。商业净收入留存率、保险分析业务客户流失率、主权合同里程碑验收标准等重要私营运营
              变量仍未披露。外部投资者必须在保密审阅下核实里程碑付款时间表、清算优先权和利润率持续性，才能判断 十角兽估值倍数是否具备根本可持续性。
