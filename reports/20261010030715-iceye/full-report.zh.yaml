            body: >-
              ICEYE 已将收入来源从早期研究和气候监测数据销售，转向两类高价值机构产品：交钥匙主权卫星星座交付， 以及经常性企业地球观测订阅。最核心的商业产品是交钥匙主权任务模式：各国国防部委托 ICEYE 在 12 个
              月内建造、发射独立 SAR 星座并移交运营控制权。波兰 POLSARIS 项目以约 €200 million 交付四艘航天器 的侦察系统，证明了这一模式。ICEYE 还通过多方国防联盟变现，例如与
              Rheinmetall 合作、总值 €1.7 billion 的德国 Bundeswehr SPOCK 项目。除主权交付外，ICEYE 还按年度订阅协议向商业保险商和 California Cal OES
              等公共应急管理机构提供 Flood Insights、Wildfire Insights 等经常性数据流和 自然灾害分析，同时提供按需 SAR 任务执行和档案影像访问。
