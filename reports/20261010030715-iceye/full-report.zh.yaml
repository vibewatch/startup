      - number: '2.4'
        title: 战略增长驱动、运营瓶颈与规模尽调缺口
        blocks:
          - type: paragraph
            body: >-
              商业 SAR 加速采用，受强劲的宏观和运营催化剂推动，但仍受严重的分析和技术约束。首要增长动力是： 在地区安全紧张加剧、自然灾害频率上升的背景下，市场迫切需要持续、全天候的地面情报。主权和企业
              买家在追踪军事资产或评估灾区边界时，已无法再容忍阴天或夜间造成数日情报中断。反过来，数据可解释 性又限制了采用速度。光学卫星影像直观易懂，而合成孔径雷达信号需要复杂的数学重建、斑点滤波和机器
              学习处理链，才能把相位回波变成可行动的空间洞察。缺少专职雷达地理空间分析师的商业企业，在工作流 接入上会遇到很大摩擦。此外，免费公共数据平台压制商业定价权：如果商业雷达服务的分辨率和重访能力 没有显著优于 ESA
              免费的 Sentinel-1 数据，就无法维持企业级定价。从投资尽调看，市场规模仍有重大 缺口。公开市场研究未能清楚区分商业星座订阅支出和传统航空航天主承包合同，因此在首轮主权国防星座
              建设完成并进入轨道后，商业数据服务最终 TAM 上限仍不确定。
            claimRefs:
              - CM004
              - CM007
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 主权自主是主要增长引擎
            body: >-
              传统商业软件市场的采用速度由企业 SaaS 预算决定，而商业 SAR 市场主要由国家安全和主权自主需求拉动。 欧洲国防部和盟国政府正迅速从临时采购数据转向拥有主权星座、部署联邦舰队架构，形成多年期签约积压，
              让基础设施供应商免受短期商业预算波动影响。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
          - type: callout
            title: 公共开放数据带来的商品化压力
            body: >-
              高分辨率 SAR 能支撑关键情报任务，但商业横向地球观测应用持续面临 ESA Sentinel-1 等公共资助星座的 价格竞争。免费的中等分辨率雷达数据为非主权应用设置价格上限，商业运营商必须靠低延迟任务执行、
              亚米级分辨率和自动化分析守住定价权，而不能只卖原始影像。
            calloutType: risk
            claimRefs:
              - CM007
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 商业 SAR 格局与直接竞争者
        blocks:
          - type: paragraph
            body: >-
              商业合成孔径雷达（SAR）地球观测市场由一批专业运营商主导，它们正从技术演示转向高频运营部署。ICEYE 开创了小卫星 SAR 运营，并拥有行业最大星座，在轨微型卫星超过 60 颗。西方直接竞争者包括美国的
              Umbra Space 和 Capella Space（2025 年 5 月被 IonQ 收购），以及日本商业公司 Synspective 和 iQPS。 Planet Labs、Maxar 和 Airbus
              运营的传统光学星座拥有深厚的多光谱档案，但受云层、烟柱和夜侧轨道 过境的根本限制。商业 SAR 运营商用主动 X 波段微波脉冲穿透云层、天气和黑暗，解决这些观测盲区，提供
              稳定的昼夜持续监测。不过，商业采用会因地域和采购框架而异：美国竞争者高度依赖机密及民用国防架构， 日本运营商依赖本国国防部拨款，ICEYE 则在主权基础设施共建与国际商业灾害分析之间取得平衡。
