callouts:
  - calloutType: "insight"
    title: "Sovereign Autonomy as the Primary Growth Engine"
    body: "Unlike traditional commercial software markets where enterprise software-as-a-service budgets govern adoption velocity, the commercial SAR market is overwhelmingly pulled by national security and sovereign autonomy imperatives. European defense ministries and allied governments are moving rapidly from ad hoc data purchasing toward sovereign constellation ownership and federated fleet architectures, creating multi-year contracted backlogs that insulate infrastructure providers from short-term commercial budget volatility."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM011"
  - calloutType: "risk"
    title: "Commoditization Pressure from Public Open Data"
    body: "While high-resolution SAR serves critical intelligence missions, commercial horizontal Earth observation applications face persistent price competition from publicly funded constellations such as ESA's Sentinel-1. Free medium-resolution radar data creates a pricing ceiling for non-sovereign applications, requiring commercial operators to defend pricing power through low-latency tasking, sub-meter resolution, and automated analytics rather than raw imagery sales."
    claimRefs:
      - "CM007"
      - "CM013"
      - "CM014"
