- id: drivers-constraints
  title: Growth drivers, constraints, and the key open debate
  body: 'The strongest driver behind Ionic’s opportunity is the mismatch between AI compute demand and power-ready supply. But that does not eliminate constraints. Grid access, switchgear, cooling, and network design still delay monetization, and the market is split between very large campuses and smaller distributed inference nodes. Powered-shell economics help Ionic because they lower capex burden and accelerate tenant fit-out, yet the strategy still depends on finding creditworthy tenants that can absorb multi-year capacity. The result is a market that is clearly attractive but structurally selective: demand is real, regional clusters are strengthening, and substitutes are imperfect, but not every converted mining site becomes a premium AI campus. The unresolved debate over giant-campus concentration versus distributed enterprise inference should shape how aggressively investors underwrite Midland and future site acquisitions. This matters for diligence because investors need to connect
    the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
