chapter:
  number: 2
  title: Market Analysis
  summary: Ionic sits in a fast-growing but highly selective market for power-ready AI infrastructure. Independent demand signals from JLL, Deloitte, Microsoft, and Nscale all support a real multi-year capacity build cycle, yet the most relevant bottleneck is grid-ready power and execution certainty rather than generic AI spending.
sections:
- id: market-boundary
  title: What market Ionic actually serves
  body: 'The temptation with Ionic is to quote the broad AI market and stop there, but that produces a distorted diligence frame. Ionic is not competing to sell chips, foundation models, or even a generic public cloud. Its real market sits lower in the stack: energized land, powered shells, conversion-ready campuses, and the contract structures that let AI clouds or hyperscalers secure scarce capacity quickly. That nuance matters because the most relevant substitutes are not software vendors but other owners of large, power-constrained sites that can be converted into AI infrastructure. The current market boundary therefore includes powered campuses, lease-ready data-center shells, and high-density HPC facilities; it excludes the majority of spending on semiconductors, AI applications, or labor-heavy systems integration. Ionic’s appeal rises when power is scarce and build timelines lengthen. This matters for diligence because investors need to connect the disclosed fact pattern to customer
    behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
