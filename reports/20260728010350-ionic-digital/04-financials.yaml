- id: liquidity-capex
  title: Liquidity, treasury management, and capital intensity
  body: Liquidity is currently adequate, but capital allocation still sits at the center of the thesis. The company reported a debt-free balance sheet, meaningful bitcoin treasury, and then layered in a $400 million private placement ahead of the direct listing. Investor-day materials convert that into roughly $613 million of liquidity and frame the platform as financially flexible. At the same time, management is explicit that bitcoin treasury is not a sacred balance-sheet asset; it is a funding tool for Ward County expansion, Midland conversion, and selective future site acquisitions. That is rational, but it means investors remain partially exposed to the timing of bitcoin sales and the underlying volatility of a treasury asset that still sits beside the infrastructure business. The capital-intensity profile is much lower than a full turnkey build, yet it is not trivial. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility
    timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
  claimRefs:
  - CI022
