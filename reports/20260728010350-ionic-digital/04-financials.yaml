- id: gaps-verdict
  title: Financial verdict and the most material unresolved gaps
  body: 'The financial direction is better than the historical miner label suggests. Contracted lease revenue, higher implied margins, and fresh institutional capital all support the view that Ionic is graduating into a higher-quality infrastructure business. Still, the public record leaves several gaps that matter for underwriting. There is no full public view into tenant-level collections beyond the flagship lease, no conventional SaaS-style customer metrics, and no long public history of digital-infrastructure cash receipts. The accounting bridge between straight-line lease revenue and cash rent commencement also needs to be watched closely. Investors should therefore treat the financial story as improved but still transitional: the quality of revenue is moving in the right direction, yet full conviction depends on cash conversion, Midland execution, and the company’s ability to reduce residual crypto-linked volatility over time. This matters for diligence because investors need to connect
    the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
