- id: margin-structure
  title: Margin structure, cost drivers, and unit-economics signal
  body: 'The emerging economics are attractive on paper. The investor-day deck claims nearly pure contracted site-level margin on the Ward County lease, sharply improved adjusted gross margin, and sub-one-year payback on required capex to reach 323 MW. Those are unusually strong numbers, and they explain why the market has re-rated similar power-first stories. But they rest on the triple-net structure working exactly as intended: the tenant absorbs most ongoing operating expense while Ionic funds a relatively contained set of power and campus upgrades. That means the margin path is less about selling efficiency than about construction sequencing, delivery discipline, and whether the Midland pipeline can be converted under similarly attractive terms. This is not a normal software margin story; it is an infrastructure margin story that becomes excellent only when the power and lease model behave as planned. This matters for diligence because investors need to connect the disclosed fact pattern
    to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
  claimRefs:
  - CI013
  - CI014
