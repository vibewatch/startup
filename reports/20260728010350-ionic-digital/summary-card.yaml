  topStrengths:
    - Secured West Texas power assets with a real flagship AI-campus lease already signed.
    - Debt-free balance sheet and substantial 2026 equity financing reduce immediate capital stress.
    - The powered-shell model offers strong implied margins with lower landlord capex than turnkey builds.
    - Market demand for power-ready AI infrastructure remains strong and regionally validated.
  topRisks:
    - Customer concentration is extreme because one tenant relationship still anchors most of the AI growth story.
    - Governance history and post-bankruptcy shareholder politics still justify a public-market discount.
    - The 89 MW expansion and Midland conversion are important but not yet fully de-risked.
    - Residual treasury and mining volatility can still distort earnings quality during the transition.
  unresolvedGaps:
    - A second named AI tenant or Midland customer is still missing from the public record.
    - Public evidence on cash collections after August 2026 rent commencement is not yet available.
    - Standardized uptime, reliability, and operating-metric disclosure for the AI campus product remains limited.
    - Post-listing holder overhang, warrant behavior, and long-term governance stability still need monitoring.
