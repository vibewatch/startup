company:
  name: Ionic Digital
chapter:
  number: 5
  title: Product & Technology
  summary: Ionic’s product is a power-first infrastructure platform rather than a software stack. The company’s technical edge comes from energized sites, a capital-light powered-shell model, and a roadmap from Ward County to Midland, while the higher-value cloud and hardware layers remain controlled by tenants and partners.
sections:
- id: product-definition
  title: What the product actually is
  body: 'Ionic does not sell a developer platform, a GPU cloud, or an enterprise application. Its current product is power-ready physical infrastructure: owned or controlled land, substations, energized capacity, and the lease structures that let AI tenants move into constrained markets faster. That distinction is essential because it means the product must be judged in customer workflow terms that begin with site selection and utility readiness rather than with software seats or API calls. Ward County is the proof point. Midland is the next product candidate. Everything else in the current story is about how effectively the company can package those assets into repeatable, contracted AI-campus capacity. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters for diligence because investors need to connect the disclosed
    fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
  claimRefs:
