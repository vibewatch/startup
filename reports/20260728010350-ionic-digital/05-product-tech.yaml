  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-metrics
    missingEvidence: Published uptime, redundancy, cooling, and commissioning metrics for Ward County or Midland AI configurations.
    whyItMatters: These metrics would show whether Ionic’s campuses meet hyperscaler-grade operating standards.
    diligencePath: Request technical design books, commissioning results, and SLA-style reliability metrics for the AI configuration.
  - type: missing-source
    severity: material
    topic: midland-design
    missingEvidence: Detailed Midland conversion design and phased deployment plan.
    whyItMatters: Midland is the clearest evidence test for whether Ionic can replicate Ward County beyond one anchor site.
    diligencePath: Review Midland engineering plans, utility scope, and signed customer requirements.
