- id: deployment-roadmap
  title: Deployment, roadmap, and execution logic
  body: 'The roadmap is clear even if it is not fully de-risked. Ward County must deliver tenant operations and cash rent on time. The 89 MW expansion must energize in the second half of 2027. Midland must move from optionality toward signed conversion. And over time the company wants to add smaller metro-area inference-focused sites. The logic behind that roadmap is consistent with broader AI demand: big campuses for flagship deployments, then smaller distributed sites for lower-latency enterprise inference. The challenge is that each step requires different technical and commercial capabilities, from utility work to tenant fit-out and contract sequencing. The product is therefore inseparable from delivery discipline. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters for diligence because investors need to connect
    the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  tableRefs:
  - TE004
  - TE005
- id: differentiation-trust
  title: Differentiation, trust, and what is still missing
  body: 'Ionic’s differentiation is real but narrow. It has secured power, real assets, and one flagship lease that validates the basic model. It does not yet have a clearly disclosed proprietary software stack, published cloud certifications, or a broad portfolio of integrated product modules the way some adjacent AI-platform companies do. That means the company’s trust proposition leans heavily on public-company controls, governance, and the credibility of its infrastructure team rather than on product-led defensibility. The product-tech verdict is therefore positive on physical asset utility and negative on disclosed technical depth: investors can see how the campuses work, but they still cannot fully assess the internal operating systems, reliability tooling, or conversion playbooks that would make the model widely repeatable. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next
    milestone that would strengthen or weaken the thesis. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
