company:
  name: Ionic Digital
chapter:
  number: 7
  title: Risks
  summary: Ionic’s risk profile is still high because governance, customer concentration, capacity timing, and residual crypto exposure are tightly correlated. The company has real mitigants—capital, contract structure, and power assets—but not enough diversification yet to make a single failure mode immaterial.
sections:
- id: governance-legal
  title: Governance and legal risk
  body: The highest-confidence risk cluster sits in governance and legal process. Ionic is not merely a newly public infrastructure company; it is the public successor to a bankruptcy estate, with a legacy-holder base and a live history of proxy conflict. The Delaware Chancery fight demonstrated that election mechanics, disclosure discipline, and board process can become investment-relevant very quickly. Even though the company later added directors and reduced some tension, the public record still contains accusations, litigation, and independent commentary that found real governance errors. For an asset-heavy business trying to win long-duration counterparties, governance stability is not just a boardroom issue; it influences trust, price discovery, and management focus. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This
    matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
