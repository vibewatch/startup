  - type: missing-source
    severity: material
    topic: sam-definition
    missingEvidence: >-
      Independent estimates for the sized submarket of lease-ready AI powered-shell campuses rather than broad
      data-center or AI demand.
    whyItMatters: A narrower market definition would improve comparisons between Ionic and other power-first operators.
    diligencePath: Collect broker, utility, and private-market transaction comps for powered-shell AI campuses in North America.
  - type: conflicting-data
    severity: minor
    topic: distributed-vs-hyperscale
    missingEvidence: >-
      A reconciled view on how much 2026-2030 demand will concentrate in gigawatt campuses versus smaller urban
      inference sites.
    whyItMatters: The answer affects how Midland and future acquisitions should be valued.
    diligencePath: Review tenant pipeline by workload type, latency requirement, and site size preference.
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: Standardized peer pricing by MW, rack, or tenancy model across the retained competitor set.
    whyItMatters: Without it, lease economics comparisons remain directional rather than precise.
    diligencePath: >-
      Collect term sheets, broker channel checks, and customer references across powered-shell, turnkey, and
      cloud-hosting contracts.
  - type: missing-source
    severity: minor
    topic: midland-positioning
    missingEvidence: Updated competitor-adjusted positioning once Ionic discloses a signed Midland AI customer or conversion timeline.
    whyItMatters: That would change whether the company is valued as a single-site or portfolio competitor.
    diligencePath: Track Midland announcements, signed LOIs, and utility-upgrade milestones.
  - type: missing-source
    severity: blocking
    topic: tenant-concentration
    missingEvidence: Customer-level revenue concentration and payment performance once Nscale cash rent begins.
    whyItMatters: Without this, investors cannot fully judge revenue quality or counterparty dependence.
    diligencePath: >-
      Request a monthly rent schedule, concentration table, and counterparty credit package for Nscale and any follow-on
      tenants.
  - type: missing-source
    severity: material
    topic: midland-economics
    missingEvidence: Detailed expected capex, timing, and yield profile for Midland AI conversion.
    whyItMatters: A second monetized campus is critical to underwrite repeatability beyond Ward County.
    diligencePath: Review Midland conversion model, utility scope, and pipeline of signed or near-signed counterparties.
  - type: missing-source
    severity: material
    topic: steady-state-ganda
    missingEvidence: Normalized public-company overhead after listing, advisory, and litigation noise.
    whyItMatters: >-
      Reported EBITDA margins may overstate or understate sustainable cash generation if transient costs are not
      isolated.
    diligencePath: >-
      Obtain a bridge from reported G&A to steady-state run-rate excluding one-time listing, litigation, and governance
      costs.
  - type: missing-source
    severity: material
    topic: reliability-metrics
    missingEvidence: Published uptime, redundancy, cooling, and commissioning metrics for Ward County or Midland AI configurations.
    whyItMatters: These metrics would show whether Ionic’s campuses meet hyperscaler-grade operating standards.
    diligencePath: Request technical design books, commissioning results, and SLA-style reliability metrics for the AI configuration.
  - type: missing-source
    severity: material
    topic: midland-design
    missingEvidence: Detailed Midland conversion design and phased deployment plan.
    whyItMatters: Midland is the clearest evidence test for whether Ionic can replicate Ward County beyond one anchor site.
    diligencePath: Review Midland engineering plans, utility scope, and signed customer requirements.
  - type: missing-source
    severity: blocking
    topic: second-tenant-proof
    missingEvidence: A second named AI tenant or signed Midland customer.
    whyItMatters: Without additional tenant proof the portfolio remains concentrated around one flagship account cluster.
    diligencePath: Obtain signed LOIs or contracts for Midland or other future campuses and compare economics to Ward County.
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Public or private reporting on collections, renewals, default provisions, or customer SLA performance after
      go-live.
    whyItMatters: Contract length alone is not enough to assess revenue durability.
    diligencePath: >-
      Review lease default history, payment schedule performance, and first-year operational SLA reporting once
      available.
