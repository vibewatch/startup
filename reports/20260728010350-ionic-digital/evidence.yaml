evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current disclosed employee count and site-level staffing split across AI infrastructure and mining.
    whyItMatters: Headcount would help underwrite operating leverage and transition complexity.
    diligencePath: Request the latest org chart, headcount by function, and 2026 hiring plan from management.
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: >-
      Detailed cap-table ownership, lock-up exposure, and expected legacy-creditor sell-through after the direct
      listing.
    whyItMatters: Public-float dynamics can materially shape trading pressure and governance influence.
    diligencePath: Obtain the post-round capitalization table, holder concentration schedule, and transfer restrictions.
  - type: private-evidence-only
    severity: minor
    topic: board-dynamics
    missingEvidence: Board-evaluation materials and settlement correspondence related to the 2025 proxy dispute.
    whyItMatters: Those materials would clarify whether governance issues are episodic or structural.
    diligencePath: Review board minutes, committee charters, and outside-counsel memos covering the dissident process.
