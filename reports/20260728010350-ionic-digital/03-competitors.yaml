chapter:
  number: 3
  title: Competitors
  summary: Ionic competes in a crowded and rapidly converging field of power-first AI infrastructure operators. Its best near-term edge is contracted West Texas capacity and a capital-light lease model, but integrated AI-cloud peers and other miner-to-AI converts reduce the durability of a one-campus narrative.
sections:
- id: landscape
  title: Landscape and the real peer set
  body: Ionic should not be benchmarked against generic software companies or broad AI narratives. The practical peer set starts with operators that own power-heavy campuses and are competing to convert or lease them into AI infrastructure. That includes Core Scientific, Applied Digital, Hut 8, TeraWulf, Riot, IREN, and Cipher at varying stages, plus adjacent AI-cloud operators such as CoreWeave and Nscale that sit one layer closer to the end customer. This matters because the scarce input is not an algorithm but energizable capacity with credible delivery timelines. In that market, the key questions are power access, tenant quality, contract structure, and ability to move from mining economics to durable recurring infrastructure cash flow before the market becomes crowded. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This
    matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
