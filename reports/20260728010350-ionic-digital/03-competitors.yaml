- id: pricing-lockin
  title: Pricing opacity, lock-in, and customer switching costs
  body: Pricing is one of the least transparent parts of the peer landscape. Most operators talk about campus scale, total contract value, or infrastructure readiness rather than publishing standardized MW or rack pricing. Ionic’s disclosed $65/kW/month Ward County benchmark is unusually concrete in that context. Still, price alone is not the real lock-in mechanism. Once a tenant has qualified a campus, planned cooling and network design, and sequenced GPU deployment, the cost of switching landlords rises sharply. The competitive bottleneck becomes delivery confidence rather than spreadsheet pricing. That favors operators with proven sites and signed counterparties, but it also means any delay, governance surprise, or utility miss can destroy advantage quickly because sophisticated tenants have other campuses competing for the same budget. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and
    the next milestone that would strengthen or weaken the thesis. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
  claimRefs:
