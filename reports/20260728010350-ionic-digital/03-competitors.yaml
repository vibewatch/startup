- id: moat
  title: Moat durability and the risk of commoditization
  body: 'Ionic’s moat today is mostly physical: West Texas power, an already-contracted flagship campus, and a capital-light leasing structure. That is meaningful, but it is not a permanent moat. If power scarcity eases or if more miner conversions become customer-ready, the category could compress into a more commoditized landlord market. Integrated peers may also capture more of the economics by pairing campuses with cloud services, orchestration, or installed customer demand. For Ionic, the strategic imperative is therefore clear: deepen portfolio breadth beyond Ward County, prove Midland conversion, and keep governance cleaner than it was in 2025. Without those steps, the company risks being treated as a one-campus narrative in a market that increasingly rewards repeatable multi-site platforms. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or
    weaken the thesis. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
