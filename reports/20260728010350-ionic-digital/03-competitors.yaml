- id: capabilities
  title: Capability breadth, stack ownership, and distribution power
  body: The clearest competitive split is between campus owners and integrated AI-cloud platforms. CoreWeave and Nscale market fuller stacks that include GPUs, orchestration, and AI services. Core Scientific, Applied Digital, Hut 8, TeraWulf, and Ionic are closer to infrastructure landlords or hosting partners, though each is trying to move up the value chain differently. Ionic’s advantage is that its Ward County contract already validates one real tenant use case, while its preferred powered-shell structure reduces equipment intensity. Its disadvantage is that it currently owns less of the cloud, software, and customer-distribution layer than the vertically integrated AI-cloud operators do. That makes partner and tenant relationships more important for Ionic than for peers that already control both the site and the delivered compute service. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and
    the next milestone that would strengthen or weaken the thesis. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
