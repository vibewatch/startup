    severity: minor
    topic: midland-positioning
    missingEvidence: Updated competitor-adjusted positioning once Ionic discloses a signed Midland AI customer or conversion timeline.
    whyItMatters: That would change whether the company is valued as a single-site or portfolio competitor.
    diligencePath: Track Midland announcements, signed LOIs, and utility-upgrade milestones.
