- id: scenarios
  title: Bull, base, and bear scenario framing
  body: Scenario analysis is more useful here than a single target price. The bull case assumes Ionic converts current power rights into a broader portfolio, signs more tenants, and keeps the Ward County economics intact. The base case assumes the flagship lease executes but diversification remains gradual, supporting a public-market infrastructure multiple with a concentration discount. The bear case assumes timing slips, governance discount persists, and the market refuses to pay a premium multiple for a company still half-defined by its mining past. The public evidence supports all three possibilities, which is why precision is less useful than disciplined scenario bands. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior,
    utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
