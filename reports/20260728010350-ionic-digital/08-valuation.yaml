- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Second tenant proof
    - Signed Midland or additional site customer
    - Needed to prove portfolio repeatability
    - Request contract pipeline and signed LOIs
  - - Cash conversion
    - Monthly collections after August 2026
    - Needed to validate revenue quality
    - Review first two quarters of rent receipts
  - - Cap-table overhang
    - Lock-up, selling pressure, and warrant exercise behavior
    - Needed to judge trading and dilution risk
    - Request post-listing holder analysis
  - - Governance remediation
    - Post-Chancery policy changes and board process evidence
    - Needed to narrow discount vs peers
    - Review governance package and board minutes
  - - Expansion economics
    - Detailed ROI for 89 MW and Midland buildout
    - Needed to test bull-case assumptions
    - Review utility, EPC, and project models
  notes: These are the minimum diligence items required to move from research-more toward a stronger recommendation.
