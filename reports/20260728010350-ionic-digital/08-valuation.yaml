- id: comparables-verdict
  title: Comparable set, verdict, and final diligence asks
  body: 'The comparable set should be hybrid. Core Scientific, Applied Digital, Hut 8, Riot, TeraWulf, IREN, and Cipher are relevant public comps because they operate in overlapping infrastructure narratives. CoreWeave and Nscale matter because they illustrate how much more value can be captured by integrated cloud and services layers. Ionic currently sits between those groups: better funded and more contracted than a speculative miner pivot, but less diversified and less vertically integrated than the highest-quality AI infrastructure names. That supports a research-more recommendation with medium confidence. The company is credible enough to matter, but not yet de-risked enough to chase aggressively at the current valuation without further customer and cash-flow proof. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters
    for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
