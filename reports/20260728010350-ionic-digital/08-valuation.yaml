  claims:
  - id: CV001
    statement: Ionic raised $400 million of equity in June 2026 and framed the round at a $2.4 billion post-money valuation.
    type: third-party-reported
    topic: current-valuation
    sourceRefs:
    - SV001
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: The company’s own placement release framed the same transaction as a $2.0 billion pre-money valuation.
    type: third-party-reported
    topic: current-valuation
    sourceRefs:
    - SV001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: The direct listing itself is not a primary capital raise, so public buyers are evaluating a pre-funded balance sheet rather than underwriting new IPO proceeds.
    type: third-party-reported
    topic: listing-context
    sourceRefs:
    - SV003
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
  - id: CV004
    statement: The current public market setup therefore offers legacy-holder liquidity but also invites immediate secondary-price discovery and selling pressure.
    type: third-party-reported
    topic: listing-context
    sourceRefs:
    - SV003
    - SV012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
  - id: CV005
    statement: At 323 MW the company expects roughly $251 million of annual contracted revenue from the Nscale lease structure.
    type: third-party-reported
    topic: run-rate
    sourceRefs:
    - SV004
    - SV007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV006
    statement: That implies a valuation of roughly 9.6x annual contracted revenue at the $2.4 billion post-money mark.
    type: estimated
    topic: run-rate
    sourceRefs:
    - SV004
    - SV001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV007
    statement: Using the midpoint of 2026 revenue guidance at $192.5 million, the same valuation implies roughly 12.5x current-year revenue.
    type: estimated
    topic: run-rate
    sourceRefs:
    - SV005
    - SV001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV007
  - id: CV008
    statement: Using the initial $183 million annualized Ward County run-rate before the 89 MW expansion, the valuation implies roughly 13.1x that nearer-term lease revenue base.
    type: estimated
    topic: run-rate
    sourceRefs:
    - SV004
    - SV001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV008
  - id: CV009
    statement: The valuation looks more defensible if investors underwrite the 323 MW contracted ramp and the high-margin nature of the triple-net structure rather than only legacy mining history.
    type: third-party-reported
    topic: valuation-support
    sourceRefs:
    - SV004
    - SV005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV009
  - id: CV010
    statement: It looks less defensible if investors treat Ionic as a one-tenant, one-campus story with unresolved governance and expansion risk.
    type: third-party-reported
    topic: valuation-support
    sourceRefs:
    - SV012
    - SV007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV010
  - id: CV011
    statement: The company’s debt-free balance sheet and roughly $613 million of liquidity strengthen valuation support by reducing immediate financing risk.
    type: third-party-reported
    topic: valuation-support
    sourceRefs:
    - SV004
    - SV006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV011
  - id: CV012
    statement: Investor-day materials also disclose approximately 3.0 million five-year warrants that could bring in another roughly $227 million if fully exercised.
    type: third-party-reported
    topic: dilution
    sourceRefs:
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV012
  - id: CV013
    statement: Those warrants and the post-listing lock-up create additional capitalization complexity that public investors should not ignore.
    type: third-party-reported
    topic: dilution
    sourceRefs:
    - SV004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV013
  - id: CV014
    statement: The direct listing reduces fresh dilution relative to an IPO because the company already raised capital privately before trading.
    type: third-party-reported
    topic: dilution
    sourceRefs:
    - SV001
    - SV003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV014
  - id: CV015
    statement: The core bull case is that Ward County becomes a repeatable template, the 89 MW phase arrives on schedule, and Midland signs a second meaningful AI tenant.
    type: third-party-reported
    topic: bull-case
    sourceRefs:
    - SV004
    - SV005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV015
  - id: CV016
    statement: A stronger bull case also assumes that 700 MW at Ward County and future metro sites can be monetized without materially raising the company’s risk profile.
    type: third-party-reported
    topic: bull-case
    sourceRefs:
    - SV004
    - SV042
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV016
  - id: CV017
    statement: 'The base case is narrower: Ward County performs as contracted, Midland remains partial optionality, and the company earns a public-market infrastructure multiple with a concentration discount.'
    type: third-party-reported
    topic: base-case
    sourceRefs:
    - SV004
    - SV007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV017
  - id: CV018
    statement: The bear case is that cash-rent timing slips, expansion optionality stalls, and the market re-rates the company closer to a miner-transition story than to a durable AI-infrastructure platform.
    type: third-party-reported
    topic: bear-case
    sourceRefs:
    - SV005
    - SV012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV018
  - id: CV019
    statement: Another bear-case input is governance overhang, because the 2025 board conflict supports a discount relative to cleaner public infrastructure peers.
    type: third-party-reported
    topic: bear-case
    sourceRefs:
    - SV012
    - SV013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV019
  - id: CV020
    statement: The current valuation also assumes that high-margin lease economics will outweigh residual treasury volatility and mining-related accounting noise.
    type: third-party-reported
    topic: bear-case
    sourceRefs:
    - SV005
    - SV006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV020
  - id: CV021
    statement: Core Scientific is a relevant public comparable because it also bridges mining heritage and high-density AI infrastructure.
    type: third-party-reported
    topic: comparables
    sourceRefs:
    - SV016
    - SV017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV021
  - id: CV022
    statement: Applied Digital is relevant because it markets AI factories and campus development infrastructure, making it a business-model comp on the infrastructure side.
