    topic: comparables
    sourceRefs:
    - SV018
    - SV019
    - SV020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV022
  - id: CV023
    statement: Hut 8, Riot, TeraWulf, IREN, and Cipher are relevant second-order comps because each is a public digital-infrastructure or miner-conversion story competing for AI-market credibility.
    type: third-party-reported
    topic: comparables
