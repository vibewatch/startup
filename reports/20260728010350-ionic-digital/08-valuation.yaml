- id: current-context
  title: Current pricing context and capital structure
  body: The June 2026 financing and July 2026 direct listing define the current entry point. The company sold $400 million of new equity privately, then came to market through a direct listing that does not itself raise fresh cash. That structure improves balance-sheet quality and reduces dilution relative to a traditional IPO, but it also means public buyers are inheriting price discovery risk and legacy-holder selling pressure almost immediately. The company’s warrants, lock-ups, and post-round capitalization matter because the headline valuation is not the whole story. For valuation purposes, investors need to pair the contracted lease run-rate and liquidity with the real complexity of post-listing float, option value, and still-unproven portfolio breadth. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters for diligence
    because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
