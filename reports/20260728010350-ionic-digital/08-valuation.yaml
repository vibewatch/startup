company:
  name: Ionic Digital
chapter:
  number: 8
  title: Valuation
  summary: Ionic’s $2.4 billion post-money mark is understandable but not obviously cheap. The valuation can work if Ward County cash conversion, the 323 MW ramp, and portfolio repeatability are delivered, but it still deserves a concentration and governance discount versus richer integrated AI-cloud comps.
sections:
- id: thesis-antithesis
  title: Thesis and anti-thesis
  body: 'The investment thesis is straightforward: Ionic controls scarce power-ready assets in a market starving for AI infrastructure, it already signed one flagship long-duration lease, it just raised substantial equity at a premium valuation, and it remains debt free. The anti-thesis is just as clear: one tenant, one campus, recent governance conflict, and a still-transitioning financial model do not deserve the same valuation treatment as a mature portfolio platform or integrated AI cloud. Both sides are supported by public evidence, which is why the recommendation cannot be a simplistic buy-or-avoid call. The core question is whether investors are paying today for proven contracted value or for a wider platform that still needs to be built. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters for diligence because
    investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.'
