- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Cash-rent commencement slips
    - Beyond August 2026
    - Undercuts quality of contracted revenue
    - Reassess valuation premium immediately
  - - 89 MW expansion slips materially
    - Beyond H2 2027 without replacement economics
    - Shrinks bull-case optionality
    - Cut upside case and treat 323 MW as ceiling
  - - Midland stays unsigned
    - No credible second tenant in next cycle
    - Leaves story highly concentrated
    - Apply persistent concentration discount
  - - Governance instability returns
    - New litigation or proxy shock
    - Raises trust discount and execution risk
    - Move stance from stretched to expensive
  notes: Triggers focus on events most likely to change valuation support quickly.
