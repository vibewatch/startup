      - number: '7.2'
        title: 客户、站点与依赖风险
        blocks:
          - type: paragraph
            body: >-
              第二个主要风险簇是集中度。一个租户关系、一个旗舰园区和一个区域电力故事，目前支撑着大部分 AI 逻辑。执行顺利时， 这会形成正向飞轮；但它也意味着问题会迅速传导到收入、估值和叙事。Ward County
              额外容量仍取决于审批和通电，Midland 作为第二客户平台仍未被证明。
              实际上，公司正试图把站点就绪度转化为多元租户深度，但尚未完成这一转化。合作伙伴依赖也比租约本身更深，因为电力公司、硬件生态和交易对手信用必须同时对齐。
              尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。尽调需要把披露的事实链条同客户行为、
