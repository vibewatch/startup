      - number: '2.2'
        title: 规模测算视角与区域需求强度
        blocks:
          - type: paragraph
            body: >-
              最有用的市场测算视角不是单一收入 TAM，而是容量和电力需求。JLL 的 2026 年展望、Deloitte 的能源研究，以及 Ionic 投资者日引用的材料都指向同一方向： AI
              正在推动真实的基础设施建设周期，瓶颈是电力。JLL 对 2030 年全球容量近乎翻倍的框架、Deloitte 的用电预测，以及 Microsoft 在 Pecos 的 2 GW 承诺，
              都描述了一个市场：大型租户会在传统数据中心开发真正必要之前很久，就提前锁定站点。West Texas 尤其重要，因为多个超大规模和 AI 项目正围绕可用土地与能源在当地集聚。
              这并不意味着每个站点都同样有价值，但它确实说明，支撑 Ward County 的区域需求信号真实、当下存在，而且大于单一租户对话。尽调需要把披露的事实链条同客户行为、
              电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置， 以及下一项会强化或削弱投资判断的里程碑连起来。
