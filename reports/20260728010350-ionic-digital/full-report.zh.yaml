  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很直接：Ionic 掌握具备供电条件的稀缺资产，而市场正缺 AI
              基础设施；公司已经签下一份标志性长期租约，刚以溢价估值融到大额股权资金，并且仍然无债。反方逻辑同样清楚：单一租户、单一园区、近期治理冲突，再加上仍在转换的财务模型，不应享受成熟资产组合平台或垂直整合 AI
              云同样的估值定价。公开证据同时支撑两边，所以建议不能简单落在买入或回避。核心问题是，投资者今天买的是已验证的合同价值，还是一个仍待搭建的更大平台。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。
