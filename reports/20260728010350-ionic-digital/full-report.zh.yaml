      - number: '8.4'
        title: 可比公司组合、结论与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              可比公司应采用混合组合。Core Scientific、Applied Digital、Hut 8、Riot、TeraWulf、IREN 和 Cipher
              都是有意义的上市可比，因为它们处在重叠的基础设施叙事里。CoreWeave 和 Nscale 也重要，因为它们说明整合云和服务层能吃到更多价值。Ionic
              目前夹在两组之间：比投机性矿企转型融资更充分、合约更多，但不如最高质量的 AI
              基础设施标的多元，也没有同等垂直整合度。这个位置支撑「继续研究」建议，置信度为中等。公司足够可信，值得纳入视野；但在缺少更多客户和现金流证明前，以当前估值激进追买，去风险还不够。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。
