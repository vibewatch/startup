            body: >-
              当前流动性充足，但资本配置仍处在投资逻辑中心。公司披露无债务资产负债表和有意义的库存比特币，随后又在直接上市前加入 $400M 私募配售。 投资者日材料把这转化为约 $613M
              流动性，并把平台描述为财务上有灵活性。与此同时，管理层明确表示，库存比特币不是不能动的资产负债表项目； 它是 Ward County 扩容、Midland
              转换和选择性未来站点收购的资金工具。这个做法理性，但也意味着投资者仍部分暴露于比特币出售时点，
              以及仍与基础设施业务并列存在的库存资产波动。资本强度远低于完整交钥匙建设，但并不轻。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置， 以及下一项会强化或削弱投资判断的里程碑连起来。
