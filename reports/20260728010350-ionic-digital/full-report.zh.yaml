      - number: '7.4'
        title: 缓释因素、监控项与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              几项缓释因素确实存在：公司无债务，刚融入大额资本，供电壳体模型的资本开支强度低于完整交钥匙建设。但这些缓释因素并不会把残余风险降到低位。 投资者应持续盯住三件事：第一，2026 年 8
              月现金租金里程碑是否按计划到来；第二，89 MW 和 Midland 里程碑是否按进度推进；
              第三，上市后治理是否保持无波澜。只要其中任何一项失败，风险很可能传导到整个投资逻辑，因为它们彼此紧密相连。只有在公司能保持治理稳定， 同时证明一份成功旗舰租约可以变成可重复平台、而不是一次性救援故事时，Ionic
              才具备可投资性。尽调需要把披露的事实链条同客户行为、 电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，
