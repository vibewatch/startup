  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Ionic 实际服务的市场
        blocks:
          - type: paragraph
            body: >-
              分析 Ionic 时，很容易引用宽泛的 AI 市场然后止步，但这会扭曲尽调框架。Ionic 不是在竞争芯片、基础模型，甚至也不是通用公有云。
              它真正所在的市场更靠近技术栈底层：已通电土地、供电壳体、可转换园区，以及让 AI 云或超大规模租户快速锁定稀缺容量的合同结构。
              这个细分很关键，因为最相关的替代者不是软件厂商，而是其他拥有大型、受电力约束且可转换为 AI 基础设施站点的业主。因此，当前市场边界包括供电园区、 可租赁数据中心壳体和高密度 HPC 设施；它不包括半导体、AI
              应用或人力密集型系统集成上的大部分支出。电力稀缺、建设周期拉长时， Ionic 的吸引力会上升。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
