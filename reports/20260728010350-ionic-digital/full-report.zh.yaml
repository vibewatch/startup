      - number: '1.3'
        title: 融资历史、估值重置与上市机制
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月和 7 月，Ionic 从一个私有重组故事变成真正的公开市场测试。公司从重量级机构财团融资 $400M， 随后选择直接上市，而不是增发型
              IPO，让存量持有人获得流动性，同时不在公开市场继续融资。这个顺序很关键。它暗示管理层认为， 私募资本足以支持扩张，公开上市的主要功能是价格发现和股东流动性。估值信号很强，但略有层次：公司自己的配售公告强调
              $2.0B 投前估值， 投资者日材料和二级市场摘要则强调融资后的 $2.4B 投后估值。无论用哪一口径，这轮融资都把 Ionic 重新定义为一个 AI 基础设施平台，
              而且有足够机构支持，可以在融资后立即测试公开市场需求。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置， 以及下一项会强化或削弱投资判断的里程碑连起来。
