  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 治理与法律风险
        blocks:
          - type: paragraph
            body: >-
              最高可信度的风险簇在治理和法律流程。Ionic 不只是新上市基础设施公司；它还是破产财产的公开继承者，背后有存量持有人基础， 也有真实发生过的代理权冲突历史。Delaware
              衡平法院之争显示，选举机制、披露纪律和董事会流程可以很快变成投资相关问题。
              尽管公司后来增补董事并缓和了一些紧张关系，公开记录中仍有指控、诉讼，以及认定确有治理错误的独立评论。对一家试图赢得长期交易对手的重资产企业来说，
              治理稳定不只是董事会会议室问题；它会影响信任、价格发现和管理层注意力。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，
              以及下一项会强化或削弱投资判断的里程碑连起来。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置， 以及下一项会强化或削弱投资判断的里程碑连起来。
