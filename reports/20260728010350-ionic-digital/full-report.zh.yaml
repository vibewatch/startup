        title: 利润率结构、成本驱动与单位经济信号
        blocks:
          - type: paragraph
            body: >-
              新出现的经济性在纸面上很有吸引力。投资者日材料称，Ward County 租约几乎拥有纯粹的签约场址层面利润率，调整后毛利率大幅改善， 达到 323 MW
              所需资本开支回收期不到一年。这些数字异常强，也解释了市场为何给类似电力优先故事重新定价。但这些数字建立在三重净租赁结构完全按预期运行之上： 租户承担大部分持续运营费用，Ionic
              只为相对可控的一组电力和园区升级出资。这意味着利润率路径不取决于销售效率，而取决于建设排期、交付纪律， 以及 Midland
              管线能否按同样有吸引力的条款转换。这不是正常的软件利润率故事，而是基础设施利润率故事；只有电力和租赁模型按计划运转时，
              这个故事才会变得非常好。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
