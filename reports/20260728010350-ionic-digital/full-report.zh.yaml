      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Ionic 所在市场的买方行为不同于普通企业 IT。付款方通常是基础设施平台所有者、AI 云厂商或超大规模租户，能够锁定土地、电力和长期租赁义务。
              终端用户可能是下游模型团队、企业或公有云客户，但他们往往离站点业主隔着一层。这意味着采用路径先经过电力采购、互联接入和站点转换， 然后才进入软件使用。Nscale 将自己描述为垂直整合的 AI
              云服务商，这一点很有提示性：客户越来越需要能把 GPU、运营、主权或专用基础设施打包进一个产品里的交易对手。 Ionic
              在这条路径中的角色是供电园区业主，而不是直接算力服务卖方。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，
              以及下一项会强化或削弱投资判断的里程碑连起来。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
