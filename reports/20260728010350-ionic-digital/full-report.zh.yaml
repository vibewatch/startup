      - number: '5.3'
        title: 部署、路线图与执行逻辑
        blocks:
          - type: paragraph
            body: >-
              路线图很清楚，尽管风险尚未完全出清。Ward County 必须按时交付租户运营和现金租金。89 MW 扩容必须在 2027 年下半年通电。 Midland
              必须从期权性走向已签约转换。随着时间推移，公司还想增加更小的都会区推理型站点。这一路线图背后的逻辑与更广泛的 AI 需求一致：
              大园区服务旗舰部署，随后用更小的分布式站点服务更低时延的企业推理。挑战在于，每一步都需要不同的技术和商业能力，从电力公司工作到租户适配建设，
              再到合同排期。产品因此离不开交付纪律。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
