      - number: '7.3'
        title: 运营与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Ionic 仍横跨两门生意。挖矿尚未完全退出，财务模型里仍残留比特币价格、哈希率和减值敞口。2025 年资产和商誉减记提醒投资者，
              传统挖矿经济性可能迅速恶化。与此同时，新的重租赁模型引入另一类风险：在现金回款完全爬坡前，直线法会计口径下的收入质量可能看起来更好。
              库存比特币也被用作增长的战略资金来源，这让一张本可看似直接的基础设施资产负债表多了市场敏感性。公司有资本，但模型仍在转型，
              还没有定型。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
              尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
