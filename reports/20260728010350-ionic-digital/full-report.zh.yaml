              合同已经验证了一个真实租户用例，而它偏好的供电壳体结构降低了设备投入强度。劣势在于， 相比垂直整合的 AI 云运营商，Ionic 目前拥有的云、软件和客户分发层更少。因此，对 Ionic
              来说，合作伙伴和租户关系比那些已经同时控制站点与交付算力服务的同行更重要。
