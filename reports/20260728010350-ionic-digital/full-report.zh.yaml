      - number: '1.2'
        title: 领导层、治理与控制权连续性
        blocks:
          - type: paragraph
            body: >-
              领导层质量对 Ionic 不是装饰项，而是投资逻辑的一部分，因为公司一边推进复杂的商业模式转换，一边成为新上市公司。Andy Stewart 的任命、
              更完整的高管团队，以及董事会关于公开市场准备度的表述，都支持一个论点：Ionic 现在拥有以数据中心为先的运营班底， 不只是看守破产矿业资产的团队。与此同时，Delaware
              代理权之争让人很难照单全收治理表述。独立法律评论认为，董事会在选举机制上的处理越过了受托责任边界， 尽管异议股东自身也存在披露问题。这个组合很重要：Ionic
              明显补强了正式治理基础设施，但现有记录中仍有控制权争夺、存量债权人博弈，
              以及对董事会流程和披露纪律异常敏感的问题。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
