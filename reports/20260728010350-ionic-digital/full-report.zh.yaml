      - number: '2.4'
        title: 增长驱动、约束与关键未决争论
        blocks:
          - type: paragraph
            body: >-
              Ionic 机会背后最强的驱动，是 AI 算力需求与供电就绪供给之间的错配。但约束并不会因此消失。电网接入、开关设备、冷却和网络设计仍会拖慢变现，
              市场也在超大型园区和更小的分布式推理节点之间分化。供电壳体经济性对 Ionic 有利，因为它降低资本开支负担，也加快租户适配建设；
              但这一路径仍取决于能否找到信用可靠、可吸收多年容量的租户。结果是一个明显有吸引力、但结构上很挑剔的市场：需求真实，区域集群在加强， 替代方案并不完美，但不是每个改造后的矿场都会变成优质 AI
              园区。超大型园区集中与分布式企业推理之间的未决争论，应决定投资者对 Midland 和未来站点收购给出多激进的假设。
              尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。尽调需要把披露的事实链条同客户行为、
