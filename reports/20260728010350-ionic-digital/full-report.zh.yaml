        title: 竞争版图与真正的可比对象
        blocks:
          - type: paragraph
            body: >-
              Ionic 不应拿来和通用软件公司或宽泛 AI 叙事对标。实际可比对象首先是拥有重电力园区、并竞争将其改造或出租为 AI 基础设施的运营商。 这包括 Core Scientific、Applied
              Digital、Hut 8、TeraWulf、Riot、IREN 和 Cipher，阶段各不相同；还包括 CoreWeave、Nscale 等相邻 AI 云运营商，
              它们离终端客户更近一层。关键不在算法，而在可通电容量和可信交付时点。在这个市场里，核心问题是电力接入、租户质量、合同结构，
              以及能否在市场变拥挤之前，从挖矿经济性切换到耐久的经常性基础设施现金流。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，
