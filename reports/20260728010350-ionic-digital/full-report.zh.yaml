  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 当前客户基础的真实样子
        blocks:
          - type: paragraph
            body: >-
              Ionic 的客户图景比 AI 叙事暗示的窄得多。公开层面，公司只有一个清晰的旗舰 AI 租户关系：Ward County 的 Nscale。 Microsoft 通过 Nscale
              合同成为可见的终端需求交易对手，NVIDIA 通过担保结构成为支撑性的信用信号，但两者都不改变一个事实： Ionic 直接具名的 AI 客户基础仍然集中。公司未来也许会服务更广泛的超大规模云厂商、AI
              云厂商或企业推理运营商， 但今天公开名单还没有出现。因此，尽调应把当前客户基础分成三类：一个锚定 AI 租户、若干未来站点机会，以及在运营上有用但不等同于多元化 AI 客户组合的传统挖矿交易对手。
              尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
