  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品究竟是什么
        blocks:
          - type: paragraph
            body: >-
              Ionic 不卖开发者平台、GPU 云或企业应用。它当前的产品是供电就绪的实体基础设施：自有或受控土地、变电站、已通电容量， 以及让 AI
              租户更快进入受约束市场的租赁结构。这个区别很关键，因为判断产品时，应从客户工作流出发，而这个工作流始于选址和电力就绪， 不是软件席位或 API 调用。Ward County 是证明点。Midland
              是下一个产品候选。当前故事的其余部分，都在于公司能多有效地把这些资产打包成可重复、 已签约的 AI
              园区容量。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
              尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
