  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与转型质量
        blocks:
          - type: paragraph
            body: >-
              Ionic 的财务故事，最好理解为从大宗商品敞口的挖矿收入，转向签约数字基础设施租赁。2024 年业绩读起来仍像一家矿企的报表： 挖矿收入、库存比特币，以及利润对加密货币价格的敏感性。但到 2026
              年中，Ward County 租约已经显著改变收入组合。公司在现金租金开始前， 已按直线法确认租赁收入；投资者日材料显示，数字基础设施主导了 2026 年 Q1
              年化收入组合。这一变化很重要，因为它同时改变可预测性和可比性。 房东式经常性收入流应当获得比挖矿收入更高质量的倍数，但前提是租赁经济性成立，租户也履约。因此，投资者需要判断的不只是收入增长，
              还有组合切换的质量和耐久度。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
              尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
