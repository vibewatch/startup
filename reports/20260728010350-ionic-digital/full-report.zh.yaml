      - number: '8.3'
        title: 乐观、基准与悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              这里用情景分析比给单一目标价更有用。乐观情景假设 Ionic 把当前电力权利转化为更广资产组合，签下更多租户，并守住 Ward County
              的经济性。基准情景假设旗舰租约落地，但多元化推进缓慢，公司可获得公开市场基础设施倍数，同时被集中度折价压住。悲观情景假设时间表滑坡、治理折价持续，市场拒绝给一家仍被挖矿历史半定义的公司溢价倍数。公开证据支撑三种可能，因此精确点估不如纪律化情景区间有用。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。
