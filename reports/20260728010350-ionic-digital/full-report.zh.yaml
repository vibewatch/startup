            body: >-
              产品架构是分层的，而不是以代码为中心。底层是土地、电力权益、变电站和园区改造。再上一层是交付模型：今天是供电壳体， 如果经济性支持，也可以向交钥匙或托管演进。再往上才是租户自己的硬件和软件栈。这也是为什么把
              Ionic 与 CoreWeave 或 Nscale 比较只能走到一定程度。 那些公司拥有更多云和服务层；Ionic 目前拥有更多站点和电力层。运营挑战在于，让这些层足够顺畅地咬合起来，使 AI
              租户不用熬过绿地开发的漫长周期， 也能部署高密度 GPU 基础设施。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
