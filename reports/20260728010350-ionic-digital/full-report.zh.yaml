      - number: '8.2'
        title: 当前定价背景与资本结构
        blocks:
          - type: paragraph
            body: >-
              June 2026 融资和 July 2026 直接上市共同定义了当前入场点。公司先私募出售 $400 million 新股权，随后用不募新钱的直接上市进入公开市场。这个结构提升了资产负债表质量，相比传统 IPO
              也减少稀释；但也意味着公开市场买家几乎立刻要承接价格发现风险和老股东卖压。公司权证、锁定安排和融资后资本结构都很关键，因为表面估值并不是全部。估值时，投资者需要把已签租约的年化收入和流动性，同上市后流通盘、期权价值、以及尚未验证的资产组合广度放在一起看。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。尽调必须把已披露事实同客户行为、公用事业接入节奏、资本配置，以及下一个会增强或削弱投资逻辑的里程碑连起来。
