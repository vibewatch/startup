            body: >-
              Ionic 的差异化真实存在，但范围很窄。它有已锁定电力、真实资产，以及一份验证基本模型的旗舰租约。它尚未清楚披露自有软件栈、 已发布的云认证，或像某些相邻 AI
              平台公司那样拥有广泛的一体化产品模块。这意味着公司的信任主张高度依赖上市公司控制、治理，
              以及基础设施团队可信度，而不是产品驱动的防御性。产品技术结论因此是：实体资产用途为正，已披露技术深度为负。投资者能看见园区如何运转，
              但仍无法充分评估内部运营系统、可靠性工具，或能让模型大范围复用的转换手册。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，
              以及下一项会强化或削弱投资判断的里程碑连起来。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置， 以及下一项会强化或削弱投资判断的里程碑连起来。
