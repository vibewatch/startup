companyProfile:
  summary: >-
    Ionic Digital 应被看作一次破产后资产改造，而不是传统创业公司。公司从 Celsius Mining 破产财产中组建出来， 2024 年以比特币矿企身份重新启动，随后快速转向 AI 和高性能计算园区租赁。到 2026 年
    7 月，官方叙事已不再只是挖矿机群规模， 而是 West Texas 既有电力、土地和变电站权益能否更快变成 AI 数据中心容量。这个区别很关键：同一组资产可以支撑两套完全不同的研判框架——
    一套是随加密货币波动的经营收入，另一套是久期更长的签约数字基础设施现金流。可复用的底层事实包括 Ward County 和 Midland 站点组合、 822 MW 电力叙事、来自债权人分配的起源，以及 Ionic
    现在出售的是电力可得性的确定性，而不只是哈希率。尽调需要把披露的事实链条同客户行为、 电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
