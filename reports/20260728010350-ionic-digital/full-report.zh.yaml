      - number: '1.4'
        title: 规模信号、里程碑与后续章节可复用事实
        blocks:
          - type: paragraph
            body: >-
              最可复用的规模标记是运营事实，而不是宣传口径。Ward County 已通电 234 MW、与 Nscale 签约通往 323 MW 的路径、 377 MW 期权池、Midland
              转换管线，以及公司的无债务流动性状况，都支撑后续对客户、估值和风险的判断。里程碑日期同样重要： 2024 年从 Celsius 中形成、2025 年 10 月 Nscale 租约、2025 年 11 月 CEO
              更换、2026 年 2 月租约扩容、 2026 年 6 月融资，以及 2026 年 7 月上市生效。这些事实让 Ionic 比投机性的绿地 AI 站点整合更成熟，但也凸显集中度。
              当前多头逻辑很大一部分仍压在一个租户、一个 West Texas 旗舰园区，以及管理层能否在市场继续愿意为 AI 容量买单之前，
              把供电挖矿资产变成可重复的数字基础设施现金流。尽调需要把披露的事实链条同客户行为、电力接入进度、资本配置，以及下一项会强化或削弱投资判断的里程碑连起来。
