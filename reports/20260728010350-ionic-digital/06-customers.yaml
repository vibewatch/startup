      tone: positive
    - label: Channel pull-through to Microsoft
      detail: Microsoft becomes visible as the end-demand anchor through Nscale’s deployment plans.
      tone: positive
    - label: Go-live and cash-rent milestone
      detail: The relationship must move from recognized lease revenue to live operations and cash collections.
      tone: neutral
    - label: Expansion or concentration fork
      detail: Success leads to 89 MW and 377 MW expansion; failure leaves the company over-concentrated.
