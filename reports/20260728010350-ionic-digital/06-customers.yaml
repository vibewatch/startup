- id: proof-trajectory
  title: Adoption trajectory and the strength of named proof
  body: The Nscale relationship is real and stronger than a pilot. It has public contract terms, specific MW commitments, a defined cash-rent commencement date, visible Microsoft linkage, and a phased growth path through the 89 MW expansion and 377 MW option pool. That is much better proof than a memorandum of understanding or an unpriced reservation. It is also the clearest evidence that Ionic’s powered-campus product meets a real customer workflow. On the other hand, nearly all of the growth trajectory evidence still sits inside that single relationship. The company has not publicly shown a second named AI tenant for Midland or a broader base of recurring AI customers. As a result, the current adoption trajectory is promising but still fundamentally concentrated. This matters for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis. This matters
    for diligence because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or weaken the thesis.
