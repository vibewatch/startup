  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and the quality of the transition
        blocks:
          - type: paragraph
            body: >-
              Ionic’s financial story is best understood as a transition from commodity-exposed mining revenue toward
              contracted digital-infrastructure leasing. The 2024 results still read like a miner’s statements: mining
              revenue, treasury bitcoin, and earnings sensitivity to crypto prices. By mid-2026, however, the Ward
              County lease was already changing the mix materially. The company began recognizing lease revenue on a
              straight-line basis before cash rent commenced, and investor-day materials showed digital infrastructure
              dominating the annualized Q1 2026 revenue mix. That shift matters because it changes both predictability
              and comparability. A landlord-style recurring revenue stream should deserve a higher-quality multiple than
              mining revenue, but only if the lease economics hold and the tenant performs. Investors therefore need to
              judge not just top-line growth but the quality and durability of the mix shift. This matters for diligence
              because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital
              allocation, and the next milestone that would strengthen or weaken the thesis. This matters for diligence
              because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital
              allocation, and the next milestone that would strengthen or weaken the thesis.
