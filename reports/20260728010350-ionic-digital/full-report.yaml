      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Several mitigants are real: the company is debt-free, it just raised substantial capital, and the
              powered-shell model is less capex-intensive than a full turnkey build. But those mitigants do not make the
              residual risk low. Investors should monitor three things constantly: first, whether the August 2026
              cash-rent milestone arrives as planned; second, whether the 89 MW and Midland milestones advance on
              schedule; and third, whether governance remains boring after listing. If any of those fail, the risks are
              likely to transmit across the whole thesis because they are tightly linked. Ionic is investable only if
              the company can keep governance stable while proving that one successful flagship lease can become a
              repeatable platform rather than a one-off rescue story. This matters for diligence because investors need
