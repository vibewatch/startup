  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market Ionic actually serves
        blocks:
          - type: paragraph
            body: >-
              The temptation with Ionic is to quote the broad AI market and stop there, but that produces a distorted
              diligence frame. Ionic is not competing to sell chips, foundation models, or even a generic public cloud.
              Its real market sits lower in the stack: energized land, powered shells, conversion-ready campuses, and
              the contract structures that let AI clouds or hyperscalers secure scarce capacity quickly. That nuance
              matters because the most relevant substitutes are not software vendors but other owners of large,
              power-constrained sites that can be converted into AI infrastructure. The current market boundary
              therefore includes powered campuses, lease-ready data-center shells, and high-density HPC facilities; it
              excludes the majority of spending on semiconductors, AI applications, or labor-heavy systems integration.
              Ionic’s appeal rises when power is scarce and build timelines lengthen. This matters for diligence because
              investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital
              allocation, and the next milestone that would strengthen or weaken the thesis.
            claimRefs:
