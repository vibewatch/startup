companyProfile:
  summary: >-
    Ionic Digital is a newly public digital infrastructure company that emerged from Celsius Mining’s bankruptcy estate
    and is rapidly pivoting from bitcoin mining into AI and high-performance computing campus leasing. Its current
    thesis centers on monetizing West Texas power assets—especially the Ward County flagship site—through long-duration
    contracts with AI infrastructure counterparties such as Nscale, while retaining optionality to expand Ward County
    and convert Midland mining sites into future AI campuses. The company now combines a meaningful secured-power
    narrative, a debt-free balance sheet, and a landmark 2026 equity raise with still-material concentration,
    governance, and execution questions.
  foundedDate: '2024-01-31'
  foundingLocation: Coral Gables, Florida, USA
  headquarters: Washington, D.C., USA
  productSummary: >-
    Ionic sells power-ready AI and HPC infrastructure through powered-campus and powered-shell leasing rather than
    through an integrated GPU cloud or application software product.
  customerFocus: >-
    AI clouds, hyperscalers, and other infrastructure-scale tenants that need rapid access to large blocks of powered
    capacity.
  businessModel: >-
    Own and control power-heavy digital infrastructure assets, lease them on long-duration structures to AI
    infrastructure tenants, and continue residual bitcoin mining where still profitable.
  stage: Newly public via Nasdaq direct listing
  fundingStatus: Raised $400M in June 2026 at a $2.4B post-money valuation before beginning Nasdaq trading under IOND.
