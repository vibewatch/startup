      - number: '2.2'
        title: Sizing lenses and regional demand intensity
        blocks:
          - type: paragraph
            body: >-
              The most useful market-sizing lenses are capacity and power demand rather than a single revenue TAM. JLL’s
              2026 outlook, Deloitte’s energy work, and Ionic’s investor-day references all point in the same direction:
              AI is driving a real infrastructure build cycle, and power is the bottleneck. JLL’s nearly doubled 2030
              global-capacity frame, Deloitte’s electricity projections, and Microsoft’s own 2 GW Pecos commitment each
              describe a market where large tenants secure sites well before traditional data-center development would
              have been necessary. West Texas is especially important because multiple hyperscale and AI projects are
              clustering there around available land and energy. That does not make every site equally valuable, but it
              does mean the underlying regional demand signal supporting Ward County is real, current, and bigger than a
              single tenant conversation. This matters for diligence because investors need to connect the disclosed
              fact pattern to customer behavior, utility timing, capital allocation, and the next milestone that would
