      - number: '1.3'
        title: Funding history, valuation reset, and listing mechanics
        blocks:
          - type: paragraph
            body: >-
              June and July 2026 converted Ionic from a private restructuring story into a real public-market test. The
              company raised $400 million from a heavyweight institutional syndicate, then used a direct listing rather
              than a primary IPO to provide liquidity to legacy holders without raising more capital in the public
              market. That sequencing matters. It implies that management believed private capital was sufficient to
              fund expansion while the public listing’s main function was price discovery and shareholder liquidity. The
              valuation signals are strong but slightly nuanced: the company’s own placement release emphasized a $2.0
              billion pre-money mark, while investor-day materials and secondary summaries emphasized the resulting $2.4
              billion post-money valuation. Either way, the financing reframed Ionic as an AI infrastructure platform
              with enough sponsor support to test public demand immediately after the round. This matters for diligence
              because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital
              allocation, and the next milestone that would strengthen or weaken the thesis.
