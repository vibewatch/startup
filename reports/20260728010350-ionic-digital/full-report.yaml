chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and current company story
        blocks:
          - type: paragraph
            body: >-
              Ionic Digital should be analyzed as a post-bankruptcy asset transformation rather than as a traditional
              startup. The company was assembled out of Celsius Mining’s assets after the Celsius estate entered Chapter
              11, then relaunched in 2024 as a bitcoin miner before rapidly repositioning around AI and high-performance
              computing infrastructure. By July 2026 the official story was no longer about mining fleet scale alone; it
              was about whether pre-existing power, land, and substation rights in West Texas could be monetized faster
              as AI data-center capacity. That distinction matters because the same asset base can support two very
              different underwriting frames: volatile crypto-linked operating revenue, or longer-duration contracted
              digital-infrastructure cash flow. The reusable ground truths are the Ward County and Midland site
              portfolio, the 822 MW power narrative, the origin in creditor distributions, and the fact that Ionic is
              now selling certainty around power availability rather than just hash rate. This matters for diligence
              because investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital
              allocation, and the next milestone that would strengthen or weaken the thesis.
