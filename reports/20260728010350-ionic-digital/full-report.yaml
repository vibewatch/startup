  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Governance and legal risk
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence risk cluster sits in governance and legal process. Ionic is not merely a newly
              public infrastructure company; it is the public successor to a bankruptcy estate, with a legacy-holder
              base and a live history of proxy conflict. The Delaware Chancery fight demonstrated that election
              mechanics, disclosure discipline, and board process can become investment-relevant very quickly. Even
              though the company later added directors and reduced some tension, the public record still contains
              accusations, litigation, and independent commentary that found real governance errors. For an asset-heavy
              business trying to win long-duration counterparties, governance stability is not just a boardroom issue;
              it influences trust, price discovery, and management focus. This matters for diligence because investors
              need to connect the disclosed fact pattern to customer behavior, utility timing, capital allocation, and
              the next milestone that would strengthen or weaken the thesis. This matters for diligence because
              investors need to connect the disclosed fact pattern to customer behavior, utility timing, capital
