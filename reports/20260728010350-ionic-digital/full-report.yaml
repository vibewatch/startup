        title: What the current customer base actually looks like
        blocks:
          - type: paragraph
            body: >-
              Ionic’s customer picture is much narrower than the AI narrative might imply. Publicly, the company has one
              clear flagship AI tenant relationship: Nscale at Ward County. Microsoft appears as the visible end-demand
              counterparty through the Nscale contract, and NVIDIA appears as a supporting credit signal through the
              guarantee structure, but neither changes the fact that Ionic’s directly named AI customer base is still
              concentrated. The company may eventually serve a wider set of hyperscalers, AI clouds, or enterprise
              inference operators, yet that future roster is not public today. For diligence purposes, the current
              customer base should therefore be segmented into one anchor AI tenancy, a set of future site prospects,
              and legacy mining counterparties that are operationally useful but not equivalent to a diversified
              AI-customer book. This matters for diligence because investors need to connect the disclosed fact pattern
