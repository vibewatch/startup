            body: >-
              The financial direction is better than the historical miner label suggests. Contracted lease revenue,
              higher implied margins, and fresh institutional capital all support the view that Ionic is graduating into
              a higher-quality infrastructure business. Still, the public record leaves several gaps that matter for
              underwriting. There is no full public view into tenant-level collections beyond the flagship lease, no
              conventional SaaS-style customer metrics, and no long public history of digital-infrastructure cash
              receipts. The accounting bridge between straight-line lease revenue and cash rent commencement also needs
