      - number: '2.3'
        title: Buyer segmentation and the adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyers in Ionic’s market behave differently from buyers in ordinary enterprise IT. The payer is usually an
              infrastructure platform owner, AI cloud, or hyperscale tenant that can lock in land, power, and long-dated
              lease obligations. The end users may be downstream model teams, enterprises, or public-cloud customers,
              but they often sit one layer removed from the site landlord. That means the adoption path runs through
              power procurement, interconnection, and site conversion before it runs through software usage. Nscale’s
              own description as a vertically integrated AI cloud provider is instructive here: customers increasingly
              want counterparties that can package GPUs, operations, and sovereign or dedicated infrastructure in one
              offering. Ionic fits into that path as the powered-campus owner rather than the direct compute-service
              seller. This matters for diligence because investors need to connect the disclosed fact pattern to
              customer behavior, utility timing, capital allocation, and the next milestone that would strengthen or
              weaken the thesis. This matters for diligence because investors need to connect the disclosed fact pattern
