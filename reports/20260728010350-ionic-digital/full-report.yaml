      - number: '5.2'
        title: Asset map and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The product architecture is layered rather than code-centric. At the base are land, power rights,
              substations, and campus improvements. Above that sits the delivery model: powered shell today, with the
              option to move toward turnkey or colocation if economics justify it. Above that sits the tenant’s own
              hardware and software stack. This is why comparing Ionic to CoreWeave or Nscale only goes so far. Those
              companies own more of the cloud and service layer; Ionic presently owns more of the site and power layer.
              The operational challenge is to make those layers interlock cleanly enough that AI tenants can deploy
              dense GPU infrastructure without waiting through the long timelines of greenfield development. This
              matters for diligence because investors need to connect the disclosed fact pattern to customer behavior,
