            body: >-
              The roadmap is clear even if it is not fully de-risked. Ward County must deliver tenant operations and
              cash rent on time. The 89 MW expansion must energize in the second half of 2027. Midland must move from
              optionality toward signed conversion. And over time the company wants to add smaller metro-area
              inference-focused sites. The logic behind that roadmap is consistent with broader AI demand: big campuses
              for flagship deployments, then smaller distributed sites for lower-latency enterprise inference. The
              challenge is that each step requires different technical and commercial capabilities, from utility work to
              tenant fit-out and contract sequencing. The product is therefore inseparable from delivery discipline.
