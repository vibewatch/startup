      - number: '1.2'
        title: Leadership, governance, and control continuity
        blocks:
          - type: paragraph
            body: >-
              Leadership quality is not a cosmetic issue for Ionic; it is part of the investment case because the
              company is attempting a complex business-model conversion while becoming newly public. Andy Stewart’s
              appointment, the broader C-suite buildout, and the board’s public-market readiness claims all support the
              argument that Ionic now has a data-center-first operating bench rather than a caretaker team for a
              bankrupt mining estate. At the same time, the Delaware proxy fight makes it hard to accept governance
              claims at face value. Independent legal commentary concluded that the board’s handling of election
              mechanics crossed fiduciary lines even though dissident stockholders also had disclosure problems. That
              combination is important: Ionic has clearly strengthened formal governance infrastructure, but its live
              history still includes contested control, legacy creditor politics, and unusually high sensitivity to
              board process and disclosure discipline. This matters for diligence because investors need to connect the
              disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone
              that would strengthen or weaken the thesis.
