            body: >-
              The mining-era counterparty set shows that Ionic can manage third-party operating relationships, but it
              does not solve the modern customer-base question. GXD, EZ Blockchain, and Foundry matter as historical
              hosting or pool relationships. Odyssey matters as a transfer-agent service layer for legacy holders. Those
              relationships may reduce operational learning risk, and they illustrate the company’s broader ecosystem
              exposure, yet they are not substitutes for a diversified AI-tenant roster. Investors should therefore keep
              them in context: useful as evidence of counterparty management, but not enough to rebut the conclusion
