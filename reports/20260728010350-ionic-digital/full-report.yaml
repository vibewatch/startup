      - number: '6.3'
        title: Retention proxies, channel dependence, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              There is no public NRR, churn, or GRR disclosure, so retention must be inferred from contract structure
              and counterparty quality. The 126-month term, the tenant-backed expansion path, and the August 2026
              cash-rent start all support durability. But those same facts also make concentration more dangerous. If
              the Nscale relationship works, it validates the whole model. If it slips, the company loses not just
              revenue but much of the public proof behind its financial and valuation story. The chapter’s key finding
              is therefore not that the company lacks customer evidence; it is that almost all current AI-customer
              evidence is concentrated in one channel-partnered relationship that remains central to every other part of
              the diligence case. This matters for diligence because investors need to connect the disclosed fact
              pattern to customer behavior, utility timing, capital allocation, and the next milestone that would
