      - number: '7.2'
        title: Customer, site, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The second major risk cluster is concentration. One tenant relationship, one flagship campus, and one
              regional power story currently support most of the AI thesis. That creates a positive flywheel when
              execution is on track, but it also means problems propagate quickly across revenue, valuation, and
              narrative. Additional Ward County capacity still depends on approvals and energization, while Midland
              remains unproven as a second customer platform. In practical terms, the company is trying to convert site
              readiness into diversified tenant depth, and it has not achieved that diversification yet. Partner
              dependency also runs deeper than the lease itself because utilities, hardware ecosystems, and counterparty
              credit all have to line up together. This matters for diligence because investors need to connect the
              disclosed fact pattern to customer behavior, utility timing, capital allocation, and the next milestone
