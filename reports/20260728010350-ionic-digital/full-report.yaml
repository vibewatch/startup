            body: >-
              The most reusable scale markers are operational rather than promotional. Ward County’s 234 MW energized
              footprint, the 323 MW contracted path with Nscale, the 377 MW option pool, the Midland conversion
              pipeline, and the company’s debt-free liquidity profile all anchor later judgment calls about customers,
              valuation, and risk. So do the milestone dates: formation out of Celsius in 2024, the October 2025 Nscale
              lease, November 2025 CEO change, February 2026 lease expansion, June 2026 financing, and July 2026 listing
              effectiveness. These facts make Ionic more mature than a speculative greenfield AI site roll-up, but they
              also highlight concentration. Much of the current bull case still runs through one tenant, one flagship
              West Texas campus, and management’s ability to turn powered mining assets into repeatable
              digital-infrastructure cash flows before the market’s willingness to fund AI capacity changes. This
              matters for diligence because investors need to connect the disclosed fact pattern to customer behavior,
