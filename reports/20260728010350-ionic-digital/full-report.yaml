      - number: '7.3'
        title: Operational and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Ionic still straddles two businesses. Mining is not yet fully gone, and that leaves
              residual bitcoin-price, hashrate, and impairment exposure inside the financial model. The 2025 asset and
              goodwill write-downs are a reminder that legacy mining economics can deteriorate rapidly. At the same
              time, the new lease-heavy model introduces a different kind of risk: revenue quality may look better on a
              straight-line accounting basis before cash receipts fully ramp. Treasury bitcoin is also being used as a
              strategic funding source for growth, which adds market sensitivity to what might otherwise look like a
              straightforward infrastructure balance sheet. The company has capital, but its model is still transitional
              rather than settled. This matters for diligence because investors need to connect the disclosed fact
              pattern to customer behavior, utility timing, capital allocation, and the next milestone that would
