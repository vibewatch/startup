    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Molbio Diagnostics Limited was incorporated in 2000 and is headquartered in Goa. The business develops and
              commercializes point-of-care molecular diagnostics, with Truenat as its portable PCR platform and
              disease-specific assays or test kits as the associated consumable. Company and broker descriptions place
              the system in resource-limited and near-patient settings and cover infectious and non-communicable disease
              testing. This device-plus- consumables description is a product model, not a disclosed recurring-revenue
              percentage. Geojit's IPO note reports FY26 consolidated Sales separately from The Economic Times' FY25
              revenue-from-operations figure; the different metric labels and fiscal periods are retained rather than
              normalized.
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO011
