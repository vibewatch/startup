  - id: FP001
    title: Access and entrant pathways shaping buyer choice
    type: matrix
    summary: Public evidence shows that adoption depends on access and development actors as well as test vendors.
    data:
      columns:
        - Documented role
        - Source-backed activity
        - Competitive implication
      rows:
        - label: Country access and diagnostics delivery
          values:
            - CHAI reports work with country partners and agencies
            - Support includes supply chains, training, and integration with care
            - Procurement and service delivery shape adoption beyond assay performance
        - label: New technology development
          values:
            - Unitaid describes acceleration of three new TB diagnostic technology classes
            - The project supports new point-of-care molecular systems and partner manufacturers
            - Entrant risk exists at pipeline level; no specific new product is named
        - label: Deployment infrastructure
          values:
            - WHO describes low-complexity automated NAATs as decentralized options
            - The testing systems require laboratory networks and trained personnel
            - Portability alone does not establish dependable last-mile deployment
        - label: Multiplex clinical evidence
          values:
            - A four-country study protocol describes the Truenat MTB Ultima/COVID-19 assay
            - The protocol aimed to reach 270 confirmed TB cases
            - A protocol is not an outcome benchmark against Xpert Ultra
        - label: Current price evidence
          values:
            - No verified current instrument or assay price appears in assigned evidence
            - Contract, discount, and placement terms are also absent
            - Relative affordability remains unresolved
        - label: Switching and service evidence
          values:
            - No source quantifies uptime, service response, or multi-homing
            - Switching costs and internal-build rates are also unreported
            - Moat durability cannot be ranked from the current evidence
    approximationNotes: >-
      Matrix substitution for the planned quadrant: the assigned evidence does not support defensible numeric or ordinal
      positioning axes, so no scores or ranking zones are implied.
    claimRefs:
      - CP001
      - CP005
      - CP008
      - CP009
      - CP012
      - CP013
