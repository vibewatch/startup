  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing discipline
        blocks:
          - type: paragraph
            body: >-
              The closest market proxy in the assigned source set is global point-of-care molecular diagnostics: rapid
              molecular tests performed near the patient, rather than the full diagnostics industry. Grand View Research
              estimates this category at USD 8.7 billion in 2025 and forecasts USD 14.5 billion by 2033, but the
              estimate spans multiple diseases, technologies, care settings, and regions (CM001). Its infectious-disease
              application share of 47% is a broad subset, not a TB-specific opportunity (CM002). India broker estimates
              cover the much wider diagnostics market, including radiology, and cannot be substituted for an India
              molecular-testing SAM (CM003). Radiology, digital pathology, and breast-health products are relevant
              Molbio adjacencies but sit outside this molecular-market proxy (CM007, CM010).
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM010
              - CM011
      - number: '2.2'
        title: Multiple sizing lenses, not a company TAM
        blocks:
          - type: paragraph
            body: >-
              The global category estimate provides a directional top-down lens, not a valuation-ready Molbio TAM. Grand
              View reports a 2025 base, a 2026 estimate, and a 2033 forecast; its published methodology describes a
              supply- and demand-side triangulation, but the result remains a third-party market estimate rather than
              company revenue guidance (CM001). Its 47% infectious-disease share implies approximately USD 4.1 billion
              of 2025 global category revenue when applied to the USD 8.7 billion base; this is a rounded calculation
              across all infectious diseases, not TB market spend (CM002). Two Indian broker notes put the broader FY26
              diagnostics market near ₹1.35 trillion and describe IVD as 56.1% of it, while explicitly including in-vivo
              radiology in the broad category (CM003). The WHO page for its 2024 TB report warns that those burden
              estimates are outdated and superseded annually, so it cannot close the current India demand gap (CM004).
              The sizing layers below therefore leave TB-, India-, and company-specific amounts unvalued rather than
              fabricating a SAM or SOM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM015
      - number: '2.3'
        title: Buyers, users, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              GEPL Capital describes the customer universe as government health programs, hospitals, diagnostic
              laboratories, and international healthcare organizations (CM011). In public and aid-funded settings, the
              budget owner is likely to be a procurement agency or program sponsor, while clinicians and laboratory
              staff use the test; the assigned sources do not disclose buyer-level budget authority or contract
              conversion. Molbio's device-plus-proprietary-kit model makes installation only the first adoption step:
              recurring test consumption and reliable service are needed for an installed instrument to produce
              sustained revenue. India Health Fund's partner page describes the Truelab platform for resource-limited
              settings and asserts lower per-test cost than other RT-PCR tests, but supplies no current price or
              comparable cost study (CM012). The company's 12,500-plus device base and 43-assay menu are evidence of
              reach, not proof of active utilization or demand by assay (CM006, CM007).
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and unresolved demand
        blocks:
          - type: paragraph
            body: >-
              The category tailwinds are faster near-patient decisions and decentralized testing, while the
              company-specific route to growth depends on kit consumption, broader assays, and utilization of existing
              capacity. Molbio and its broker both report FY26 kit and device capacity utilization of 58% and 42%,
              respectively, leaving headroom but not demonstrating realized sell-through (CM009). The company also
              describes an additional assay pipeline, which remains planned rather than commercialized demand (CM010).
              Grand View identifies instrument, implementation, recurring consumable, quality-control, and training
              costs as adoption constraints, especially for lower-budget providers (CM013). Q1 FY27 results included
              export orders deferred from the prior quarter, and management cautions that quarterly revenue is
              non-linear; one strong quarter is therefore not a stable market run rate (CM014). Updated India TB test
              volumes, test-level pricing, procurement awards, and active-instrument utilization are needed before an
              investor can size an India/TB SAM or company SOM (CM015).
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert global TAM into a Molbio SAM
            body: >-
              Neither the global POC molecular estimate nor India's broad diagnostics market reveals the spend Molbio
              can serve. A company-specific market requires current assay-level demand, procurement pricing, buyer
              eligibility, and active utilization evidence.
            calloutType: assumption
            claimRefs:
