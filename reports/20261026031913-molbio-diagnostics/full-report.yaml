  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The August 3, 2026 red herring prospectus is the strongest current source for legal and regulatory
              exposure. It reports pending proceedings across the company, subsidiaries, promoters, and directors,
              including 11 tax proceedings against the company with an aggregate amount of ₹507.81 million; the amount
              is a claim disclosed in the filing, not an adjudicated loss. Separately, the filing describes a July 2026
              information notice to Prognosys concerning an investigation involving a former customer, and says
              Prognosys supplied the requested documents. It also identifies permit, inspection, and changing-rule
              risks, plus earlier statutory-compliance failures for which stated penalties were paid. The probability,
              resolution timetable, and any continuing control remediation are not quantified, so diligence should
              obtain counsel's matter-by-matter status and the current approval register. (CR004, CR005, CR006)
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Product, quality, and operating continuity
        blocks:
          - type: paragraph
            body: >-
              The prospectus identifies product accuracy, defects, warranty obligations, facility disruption, demand
              forecasting, and privacy or cyber threats as potential business risks. It reports ₹232.17 million of
              warranty provision at March 31, 2026 and says it has not had a product-liability claim with an adverse
              business impact in the prior three fiscal years; that statement is not evidence that no complaints or
              quality incidents occurred. It also describes prior inventory-obsolescence provisions and a two-year shelf
              life for Truenat kits. NatCap independently highlights assay breadth, quality, and distribution as
              execution challenges, but supplies no incident rate or control assessment. The investment case therefore
              depends on audited quality metrics, field failure and complaint data, CAPA closure, and service
              performance that are not public in this source set. (CR003, CR007, CR010, CR012, CR016)
            claimRefs:
              - CR003
              - CR007
              - CR010
              - CR012
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR010
              - CR012
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR008
              - CR013
              - CR014
      - number: '7.3'
        title: Customer, supplier, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              FY26 finished-goods revenue concentration is unusually consequential: Indian central and state governments
              plus international aid agencies represented 84.56%, the top ten customers 83.26%, and TB test kits 70.20%
              of the same stated denominator. ICICI Direct separately notes that none of the top ten customers was under
              a firm-commitment contract. Supplier exposure is also concentrated: the prospectus says the top ten
              suppliers represented 58.52% of raw-material purchases and identifies a substrate sole-source; ICICI
              Direct reports 42.01% of FY26 raw materials were imported. A Global Fund/USAID/Stop TB collaboration
              documents reduced test prices and defined service-level KPIs, but not the economics or service outcomes.
              These disclosures support concentration and dependency concerns, not a forecast that any contract or
              supplier will fail. (CR001, CR002, CR008, CR009, CR011, CR015)
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR011
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR011
              - CR013
              - CR015
      - number: '7.4'
        title: Financial resilience and monitoring priorities
        blocks:
          - type: paragraph
            body: >-
              The prospectus reports FY26 working capital of ₹8,274.83 million and working-capital days of 166, while
              consolidated borrowings were ₹4,225.01 million as of May 31, 2026; ₹392.43 million of unsecured loans were
              repayable on demand. These are balance-sheet and financing exposures, not a cash-burn measure. The filing
              also warns that the proposed R&D and Center of Excellence facility would not add manufacturing capacity or
              immediate attributable cash flows, making completion, regulatory clearance, assay launch, and commercial
              uptake relevant milestones. Track tender renewals and top-customer shares, assay approval and launch
              timing, warranty and CAPA trends, supplier alternatives, receivable aging, debt covenants, and capex
              delivery. Public disclosures do not establish customer-level concentration, uptime, incident frequency, or
              mitigation effectiveness; those remain diligence asks. (CR003, CR013, CR014)
            claimRefs:
              - CR003
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration dominates near-term downside
            body: >-
              Government and aid procurement, the top ten customers, and TB test kits each account for large shares of
              FY26 finished-goods revenue. A diligence case should not assume diversified demand or firm repeat orders
              without customer-level and tender evidence.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Investment view: quality is not a price'
        blocks:
          - type: paragraph
            body: >-
              The investment case rests on Molbio's Truenat platform and repeat disease-specific test-kit sales. DSIJ's
              summary of Motilal Oswal attributes 72% of consolidated FY26 revenue to test kits and 14% to devices,
              while saying Truenat contributed about 90%; that supports a consumables thesis, not proof of device
              utilization, reorder behavior or assay-level margins. Geojit reports FY26 revenue of INR 1,445.7 crore, up
              41.7% year over year, but the same source set also reports material tuberculosis and government-program
              concentration. Molbio's September 2022 $1.6 billion financing valuation and Moneycontrol's 2024 reported
              IPO target are historical reference points, not current fair value. The IPO and public-market snapshots
              now provide observed prices and multiples, but they do not reconcile to audited current earnings, diluted
              shares, net debt or a defensible return range. Track is therefore more supportable than Buy until those
              inputs are checked.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: Public-market entry and valuation evidence
        blocks:
          - type: paragraph
            body: >-
              Geojit and GEPL Capital's August 2026 IPO notes report a price band of INR 768–807 and roughly INR 9,300
              crore market capitalization at the upper band.       Geojit's upper-price issue table lists about INR 940
              crore of total offer, including INR 200.2 crore of fresh issue and INR 739.7 crore of OFS; its allocation
              table reports INR 939.7 crore total against the issue-size table's INR 939.9 crore, a small internal
              discrepancy. The total offer size is not cash available to Molbio because OFS proceeds go to selling
              shareholders. The Economic Times' 2025 DRHP coverage described an earlier proposed INR 200 crore fresh
              issue and OFS of up to 1.25 crore shares, so that proposal should not be confused with the final 2026
              issue. Business Today reports a debut at INR 980, over 21% above the INR 807 issue price. Multiples.vc's
              October 25, 2026 snapshot lists USD 1.5 billion market capitalization and enterprise value, 10.2x
              EV/Revenue and 45.4x EV/EBITDA; its revenue period and valuation bridge are not clear enough for
              independent recalculation. DSIJ's summary of Motilal Oswal's INR 1,800 target is an analyst view, not a
              verified fair-value conclusion.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
      - number: '8.3'
        title: Scenario discipline and downside
        blocks:
          - type: paragraph
            body: >-
              The bull case is that kit consumption, new assays and international penetration deliver the FY26–FY29E
              revenue CAGR and margin expansion in Motilal Oswal's forecast as summarized by DSIJ. Those are analyst
              estimates, not company guidance or probability-weighted outcomes. The base case is continued growth but no
              fresh entry until the October market-data snapshot is reconciled to the live quote, diluted share count,
              net debt and FY26/interim earnings. The bear case is multiple compression or slower growth if tuberculosis
              testing and public procurement remain concentrated, while margin pressure offsets revenue growth. DSIJ
              reports TB at 96% of FY26 test-kit volume and 74% of consumables revenue; Geojit reports government and
              aid agencies at about 85% of FY26 revenue. Neoma's August pre-IPO note separately warns that procurement
              dependence can expose revenue to funding and policy decisions. The broker's comparison set is a valuation
              reference only, not an independent fair-value benchmark. The available evidence does not support numerical
              scenario ranges or probabilities.
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV004
              - CV015
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Molbio's 2026 listing provides public-market access, but investor exit readiness still depends on the live
              trading price, liquidity, lock-ups, fully diluted ownership and post-IPO selling by shareholders. The
              available offer notes distinguish fresh issue from OFS but do not establish current free float, preference
              overhang, lock-up schedules or a same-date equity-to-enterprise-value bridge. Before entry, obtain the
              latest exchange filings and shareholding pattern, rebuild enterprise value from the current quote and net
              debt, and reconcile audited and interim financials with broker forecasts. Disease-level sales, customer
              and tender concentration, device utilization, receivable days, inventory and operating cash flow are
              needed to distinguish accounting profit from cash conversion. Reassess the thesis if revenue fails to
              track the published FY26–FY29E broker forecast, TB or public-procurement concentration persists without
              diversification, or margins and cash conversion weaken. These are diligence and monitoring triggers, not
              claims that deterioration has occurred.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
