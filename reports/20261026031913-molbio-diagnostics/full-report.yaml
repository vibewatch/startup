  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              WHO's current TB testing framework places Molbio's Truenat MTB Plus with MTB-RIF Dx and Cepheid's Xpert
              MTB/RIF Ultra in the low-complexity automated nucleic-acid amplification test class for initial TB
              detection and rifampicin resistance. That makes Xpert the clearest documented direct alternative in the
              assigned evidence, rather than a broad molecular-diagnostics company comparison. Smear microscopy and
              culture remain relevant status-quo comparators in the clinical studies, while centralized laboratory
              workflows are substitutes for decentralized deployment. Unitaid describes work to accelerate new
              point-of-care molecular systems and assays, but the retained source does not name specific competing
              entrants. No assigned source establishes internal-build prevalence, market shares, or competitor scale.
            claimRefs:
              - CP001
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: Capability and clinical-evidence comparison
        blocks:
          - type: paragraph
            body: >-
              Independent evaluations provide useful but bounded head-to-head evidence. In Cameroon, Truenat MTB Plus
              sensitivity against culture was 91% (95% CI, 86–94%) versus 90% for Xpert, while specificity was 96%
              versus 99%; the study included 945 outpatients and 251 culture-positive participants. A separate
              250-participant Uganda study reported 80.5% sensitivity and 98.1% specificity against Xpert Ultra, using
              its stated denominators and confidence intervals. These are not pooled estimates and should not be
              generalized across settings. The Uganda study also reported error/invalid tests and uninterpretable
              rifampicin-resistance results. A separate four-country Truenat MTB Ultima/COVID-19 paper is a study
              protocol with planned enrollment, not published comparative performance results.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP007
      - number: '3.3'
        title: Pricing, distribution, and access dynamics
        blocks:
          - type: paragraph
            body: >-
              The reviewed sources describe a product workflow and access ecosystem, but do not establish an
              apples-to-apples commercial comparison. Molbio's own product page describes chip-based real-time PCR and a
              one-hour sample-to- result claim; a PharmaBiz interview relays similar statements from the company's
              president, so those statements remain company-claimed rather than independent benchmarks. CHAI describes
              country-level work on diagnostics access, procurement, supply chains, training, and integration with care,
              while Unitaid describes support for new technology classes and partner manufacturers. These organizations
              shape adoption conditions; the sources do not show that either is a Molbio reseller or quantify Molbio-
              specific placement terms. Public evidence here does not resolve instrument price, assay price, discounts,
              or contract structure.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP009
              - CP012
              - CP013
      - number: '3.4'
        title: Durability, switching, and unresolved risks
        blocks:
          - type: paragraph
            body: >-
              Truenat's differentiation is plausibly tied to decentralized molecular testing, but the evidence does not
              establish a durable cost or distribution moat. WHO's framework notes that low-complexity automated NAATs
              still require laboratory networks and trained personnel, so instrument portability alone does not
              demonstrate reliable service at the point of care. The Uganda evaluation's reported errors and
              uninterpretable rifampicin-resistance results are a concrete execution caveat, not proof of a persistent
              product defect. The assigned evidence does not quantify uptime, service response, multi-homing, switching
              costs, internal-build rates, or realized pricing. These gaps prevent a defensible ranking of lifetime
              economics or moat durability against Xpert and newer entrants.
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, mix, and quality
        blocks:
          - type: paragraph
            body: >-
              Molbio's Truenat model pairs device sales with disease-specific test kits that generate repeat purchases;
              this supports recurring consumables revenue, not a disclosed subscription or ARR measure (CI001). For
              FY26, Motilal Oswal's summary puts Truenat at about 90% of revenue, with test kits at 72% and devices at
              14% of consolidated revenue; it reports kit revenue of Rs 10.3 billion and device revenue of Rs 2.0
              billion (CI003, CI004). Anand Rathi reports consolidated revenue from operations of Rs 8,366 million in
              FY24, Rs 10,204 million in FY25, and Rs 14,457 million in FY26 (CI002). These measures evidence scale and
              a consumables-led mix, but not ARR, paid-test utilization, customer retention, or product gross profit.
              FY26 concentration is material: government and aid agencies contributed 84.6% of revenue, the top ten
              customers 83.3%, and TB test kits 70.2% (CI007-CI009). These overlapping payer, customer, and disease
              denominators must not be added together.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
              - CI009
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
              - CI009
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
      - number: '4.2'
        title: Margins, pricing, and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              Consolidated EBITDA margin fell from 28.0% in FY24 to 25.7% in FY25 and 22.2% in FY26, even as revenue
              grew; Motilal Oswal attributes FY26 pressure to higher employee and other expenses, R&D, overseas-market
              development, and sales costs (CI005). The same broker describes FY24-FY26 operating cash flow as volatile
              because of working-capital intensity, receivables, and inventory; Anand Rathi also flags past negative
              operating cash flows at the company and certain subsidiaries without giving their period or amount
              (CI006). Neither statement establishes FY26 cash burn. The only explicit per-test price in this source set
              is a Stop TB Partnership quote in a 2023 Global Fund release: below US$8 per test under a specific
              collaboration, alongside a service-level agreement (CI013). It is not a current list price, realized ASP,
              or gross-margin measure. WHO's technical review likewise does not establish commercial uptake (CI016).
            claimRefs:
              - CI005
              - CI006
              - CI013
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI013
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Anand Rathi's August 2026 IPO note reports an Rs 9,400 million offer, split between Rs 2,000 million of
              fresh issue and Rs 7,400 million of offer for sale; Business Today later reported an approximately Rs 940
              crore IPO raise and the Rs 807 issue price (CI010, CI011). The gross issue amount therefore is not the
              amount of new company capital: the OFS portion represents selling shareholders. The fresh-issue objects
              included an R&D facility and Center of Excellence, plant and equipment, and general corporate purposes; a
              CEO interview also described R&D-facility and manufacturing-automation plans (CI012). Neither the offer
              documents in this pool nor the post-listing interview establishes current cash on hand, debt maturities,
              monthly burn, net proceeds after costs, or runway. The underwriting case has demonstrated revenue scale,
              but margin compression, concentrated demand, working-capital volatility, and missing liquidity data make
              returns and capital sufficiency hard to underwrite. Request current interim cash-flow and balance-sheet
              data plus assay-level margins, utilization, pricing, and receivables detail.
            claimRefs:
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Molbio positions Truenat as portable, battery-operated molecular testing for point-of-care and field use.
              Its product material describes Trueprep AUTO V2 for nucleic-acid extraction followed by Truelab micro-PCR
              amplification with disease-specific chips; Geojit's 2026 research note describes the same
              instrument-and-consumable configuration (CE001, CE002). The company gives separate 20-minute extraction
              and 35-minute process statements, but the latter is not clearly labelled as an end-to-end time. Geojit
              reports 43 assays across 30 diseases, an analyst-reported menu count rather than independent evidence for
              each assay (CE004). TB is the most concretely documented workflow in this source set; adjacent radiology
              and digital-pathology lines have less product-level detail (CE012, CE015).
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE012
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE012
      - number: '5.2'
        title: TB use case and comparative evidence
        blocks:
          - type: paragraph
            body: >-
              WHO's 2020 rapid communication noted new evidence on Truenat MTB and MTB Plus within its TB diagnostic
              review; the Global Fund later reported WHO endorsement of named Truenat TB assays and announced a partner
              program covering reduced prices and service commitments (CE005, CE012). A peer-reviewed economic analysis
              used data from a multicentre randomized trial comparing decentralized Truenat MTB Plus and MTB-RIF Dx with
              hub-and-spoke Xpert MTB/RIF Ultra in Mozambique and Tanzania (CE006). Its facility-based cost per
              participant initiating treatment differed by country and by whether initiation was measured within seven
              or sixty days; the published intervals overlap in some comparisons, and decentralized testing was not
              uniformly less costly at the later horizon (CE007, CE008). Testing volume was the strongest reported
              driver of cost-effectiveness, so these findings are setting-specific rather than a universal product or
              competitor benchmark (CE009).
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Deployment model and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The platform couples instruments to repeat-use assay consumables, while partner and analyst sources
              describe deployment through public-health programs, laboratories, and hospitals. The Global Fund's 2023
              release set out reduced-price TB tests and a service-level agreement with defined indicators; that
              documents a commercial support commitment, not achieved response times or uptime (CE003, CE005). Public
              reports also provide capacity and deployment snapshots: the DRHP coverage cited by The Economic Times
              gives FY25 installed capacity, while Geojit's August 2026 note reports FY26 capacity and devices sold
              across more than 90 countries (CE010, CE011). These are installed-capacity and reported installed-base
              measures, not factory output, utilization, or active customers. Geojit separately flags
              government/aid-agency and TB-kit concentration in FY26 revenue, which makes procurement and disease mix
              material operating dependencies (CE013, CE014).
            claimRefs:
              - CE003
              - CE005
              - CE010
              - CE011
              - CE013
              - CE014
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation, roadmap, and trust gaps
        blocks:
          - type: paragraph
            body: >-
              Truenat's differentiating proposition is an instrument-plus-assay workflow designed for decentralized PCR,
              not demonstrated superiority across every disease or care setting (CE001, CE003). Business Today TV's
              August 2026 interview summary identifies expansion into new disease areas, international markets, digital
              pathology, and veterinary diagnostics as topics discussed with Molbio's CEO; this is evidence of stated
              direction, not proof of launch, integration, or commercial maturity (CE015). Geojit flags slower adoption,
              tender cycles, regulatory delays, patent challenges, and reduced global TB funding among risks (CE016).
              The assigned evidence does not quantify assay-specific sensitivity or failure rates, device-level service
              outcomes, or cybersecurity and privacy controls. Those omissions do not establish that controls or
              incidents are absent; they leave field readiness and connected-result handling unverified and require
              direct quality, service, and security diligence.
            claimRefs:
              - CE001
              - CE003
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer mix is disclosed by category, not by account
        blocks:
          - type: paragraph
            body: >-
              GEPL Capital's August 2026 IPO note groups FY26 revenue into Indian central government, Indian state
              governments, international aid agencies, and non-government agencies. It reports ₹791 crore (56.54%) from
              the central government category, ₹326 crore (23.30%) from state governments, ₹66 crore (4.72%) from
              international aid agencies, and ₹216 crore (15.44%) from non-government agencies. These categories
              indicate that public budgets and aid-funded programs are major payer channels, but they do not identify
              ministries, tenders, countries, or individual customers. NDTV Profit estimates that only about 1,400 of
              17,000 private healthcare facilities have molecular diagnostic capability; that is a market estimate, not
              a count of Molbio customers. The source's FY26 category table totals ₹1,399 crore, while its financial
              table reports ₹1,446 crore of revenue, so the percentage mix should not be reconciled to another
              denominator.
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Deployment and kit volume show activity, not site-level utilization
        blocks:
          - type: paragraph
            body: >-
              NDTV Profit reports more than 12,500 Truenat devices across over 90 countries and describes an Indian
              public-sector footprint of about 8,000–9,000 public health centres. DSIJ's October 2026 summary of Motilal
              Oswal research also gives 12,500-plus devices and 8,000–9,000 diagnostic centres, without defining the
              centre population in the same way. An undated OpenDx profile separately lists 8,293-plus NAAT systems in
              India and 85-plus countries; these differently worded counts are not interchangeable. NDTV reports
              test-kit volumes rising from 8.8 million units in FY24 to 17.6 million in FY26 (41% CAGR), while GEPL
              rounds those fiscal-year totals to 9 million and 18 million. It also reports more than 40 million tests
              worldwide without specifying the period. Sales, devices, centres, and cumulative tests evidence activity,
              not active use or reorder frequency at a particular customer.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.3'
        title: Program announcements prove routes to market, not customer outcomes
        blocks:
          - type: paragraph
            body: >-
              The strongest named customer-side evidence in the assigned sources is institutional and programmatic. The
              Global Fund's March 2023 announcement describes lower prices for Truenat TB tests and a global service and
              maintenance agreement with defined performance indicators; it says new deals would be signed, not that all
              orders had shipped. A company announcement reproduced by IndiaMedToday reports a completed domestic
              rollout under India's National Tuberculosis Elimination Program and an iNTP rollout across nine countries,
              with installations described as complete in seven and underway in Bangladesh and Vietnam. These records
              identify buyers, funders, and implementation pathways, but disclose no country-level order values,
              active-site counts, or patient outcomes. WHO's rapid communication provides clinical-evidence context, not
              proof of customer utilization.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU005
              - CU010
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Recurring kit sales coexist with buyer and disease concentration
        blocks:
          - type: paragraph
            body: >-
              Truenat combines device placements with proprietary single-use kits, so ongoing testing can generate
              repeat consumable purchases. Aggregate kit growth does not establish customer retention: the assigned
              sources do not report net or gross revenue retention, churn, renewal cohorts, contract duration, or
              reorder frequency by site. Concentration is clearer at the payer-category and disease levels. GEPL's
              customer table shows sizable central- and state-government shares, while NDTV Profit and analyst notes
              flag public procurement and tuberculosis dependence. Their TB metrics use different bases—total revenue,
              consumables revenue, and test-kit volume— and should not be blended. A May 2024 Moneycontrol article
              reported plans to strengthen global presence and launch products; this is historical intent, not evidence
              of achieved expansion. Account-level concentration, active utilization, and renewal behavior remain
              material diligence gaps.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
