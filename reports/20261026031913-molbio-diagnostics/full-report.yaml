  - id: FU001
    title: Institutional customer path from procurement to repeat use
    type: journey-map
    summary: >-
      Program procurement and device placement can create kit demand, but the available sources do not measure
      site-level repeat use or retention.
    data:
      items:
        - label: Program procurement
          detail: >-
            Public budgets and aid-supported channels are reported; the Global Fund described lower-price test and
            service terms.
          touchpoints:
            - Indian government buyer categories
            - Global Fund, USAID, and Stop TB Partnership
        - label: Instrument placement
          detail: More than 12,500 devices across over 90 countries are reported, but active-site counts are unavailable.
          touchpoints:
            - Public-health centres
            - International program rollouts
        - label: Point-of-care testing
          detail: >-
            WHO evidence communications and program announcements concern Truenat TB testing; neither gives
            customer-level utilization.
          touchpoints:
            - TB and rifampicin-resistance testing
            - Remote and resource-limited settings
        - label: Single-use kit consumption
          detail: >-
            Truenat devices use Molbio's proprietary single-use test kits; aggregate FY26 kit volume is reported
            separately from site activity.
          touchpoints:
            - Disease-specific consumables
            - Kits are not equivalent to unique customers
        - label: Repeat procurement
          detail: Kit sales rose across FY24–FY26, but no source ties reorders to particular devices, customers, or cohorts.
          touchpoints:
            - Aggregate volume trend
            - No site-level reorder data
        - label: Retention and outcomes
          detail: Renewal, churn, active use, and patient outcomes are not established by the assigned public evidence.
          touchpoints:
            - Customer cohort data requested
            - Independent outcome evidence requested
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU014
      - CU016
