  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: field-reliability
      missingEvidence: Device-level uptime, failure and repeat-test rates, maintenance records, complaint and CAPA trends, and service-level attainment by installed base and geography.
      whyItMatters: A partner-reported service commitment does not show operational performance; downtime can reduce point-of-care availability and realized testing volume.
      diligencePath: Request a 24-month device-level uptime and service-ticket extract, SLA attainment by market, and complaint/CAPA trends with device and test denominators.
    - type: missing-source
      severity: material
      topic: security-privacy
      missingEvidence: Current security architecture, result-data flows and retention, access controls, encryption, privacy assessments, applicable certifications, and incident disclosures for connected result transfer.
      whyItMatters: Wireless result transfer creates a patient-data and system-control surface, while the assigned evidence does not establish safeguards or compliance status.
      diligencePath: Obtain current security and privacy documentation, independent assessment summaries, data-processing terms, and a market-by-market certification inventory.
    - type: missing-source
      severity: material
      topic: assay-quality
      missingEvidence: Independent assay-level sensitivity, specificity, invalid rates, lot consistency, and performance by specimen type and operating environment.
      whyItMatters: A broad assay count and WHO-related TB evidence do not validate every assay, specimen, or deployment condition.
      diligencePath: Request assay validation dossiers, external evaluations, post-market quality metrics, and lot-release controls for priority assays.
    - type: missing-source
      severity: material
      topic: practitioner-community-signals
      missingEvidence: A public developer-signal or the closest practitioner-community proxy, such as lab-user feedback, professional-society discussion, public engineer talks, or implementation-partner evaluations.
      whyItMatters: The allocated sources include product material, market research, program communications, and one published economic study but no sustained practitioner feedback or public technical-community signal.
      diligencePath: Interview laboratory operators and implementation partners, then verify any public practitioner or professional-community evidence independently.
      relatedQuestionRefs: [QE009]
    - type: missing-source
      severity: minor
      topic: adjacent-product-maturity
      missingEvidence: Product-specific launch status, integration details, installed base, customer outcomes, and service model for radiology and digital-pathology offerings.
      whyItMatters: Portfolio expansion is described in analyst and interview material, but commercial maturity and operational integration are not established.
      diligencePath: Request product-level deployment, regulatory, revenue, and service documentation for each adjacent product line.
