schemaVersion: "report-v2"
artifact: product-tech
slug: molbio-diagnostics
runDate: 2026-10-26
company:
  name: Molbio Diagnostics
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Molbio's Truenat combines a portable point-of-care PCR workflow with
    disease-specific consumables, and external TB research tests that model in
    defined settings. The evidence also shows that measured economics vary by
    place and treatment horizon; device reliability, assay-level quality,
    security controls, and product-line maturity remain diligence gaps.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: >-
      Molbio positions Truenat as portable, battery-operated molecular testing
      for point-of-care and field use. Its product material describes Trueprep
      AUTO V2 for nucleic-acid extraction followed by Truelab micro-PCR
      amplification with disease-specific chips; Geojit's 2026 research note
      describes the same instrument-and-consumable configuration (CE001,
      CE002). The company gives separate 20-minute extraction and 35-minute
      process statements, but the latter is not clearly labelled as an
      end-to-end time. Geojit reports 43 assays across 30 diseases, an
      analyst-reported menu count rather than independent evidence for each
      assay (CE004). TB is the most concretely documented workflow in this
      source set; adjacent radiology and digital-pathology lines have less
      product-level detail (CE012, CE015).
    claimRefs: [CE001, CE002, CE004, CE015]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: tb-evidence
    title: TB use case and comparative evidence
    body: >-
      WHO's 2020 rapid communication noted new evidence on Truenat MTB and MTB
      Plus within its TB diagnostic review; the Global Fund later reported WHO
      endorsement of named Truenat TB assays and announced a partner program
      covering reduced prices and service commitments (CE005, CE012). A
      peer-reviewed economic analysis used data from a multicentre randomized
      trial comparing decentralized Truenat MTB Plus and MTB-RIF Dx with
      hub-and-spoke Xpert MTB/RIF Ultra in Mozambique and Tanzania (CE006).
      Its facility-based cost per participant initiating treatment differed
      by country and by whether initiation was measured within seven or sixty
      days; the published intervals overlap in some comparisons, and
      decentralized testing was not uniformly less costly at the later
      horizon (CE007, CE008). Testing volume was the strongest reported driver
      of cost-effectiveness, so these findings are setting-specific rather
      than a universal product or competitor benchmark (CE009).
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE012]
    tableRefs: [TE002]
  - id: deployment-capacity
    title: Deployment model and operating dependencies
    body: >-
      The platform couples instruments to repeat-use assay consumables, while
      partner and analyst sources describe deployment through public-health
      programs, laboratories, and hospitals. The Global Fund's 2023 release
      set out reduced-price TB tests and a service-level agreement with defined
      indicators; that documents a commercial support commitment, not achieved
      response times or uptime (CE003, CE005). Public reports also provide
      capacity and deployment snapshots: the DRHP coverage cited by The
      Economic Times gives FY25 installed capacity, while Geojit's August 2026
      note reports FY26 capacity and devices sold across more than 90
      countries (CE010, CE011). These are installed-capacity and reported
      installed-base measures, not factory output, utilization, or active
      customers. Geojit separately flags government/aid-agency and TB-kit
      concentration in FY26 revenue, which makes procurement and disease mix
      material operating dependencies (CE013, CE014).
    claimRefs: [CE003, CE005, CE010, CE011, CE013, CE014, CE016]
    tableRefs: [TE003]
  - id: trust-roadmap
    title: Differentiation, roadmap, and trust gaps
    body: >-
      Truenat's differentiating proposition is an instrument-plus-assay
      workflow designed for decentralized PCR, not demonstrated superiority
      across every disease or care setting (CE001, CE003). Business Today TV's
      August 2026 interview summary identifies expansion into new disease
      areas, international markets, digital pathology, and veterinary
      diagnostics as topics discussed with Molbio's CEO; this is evidence of
      stated direction, not proof of launch, integration, or commercial
      maturity (CE015). Geojit flags slower adoption, tender cycles, regulatory
      delays, patent challenges, and reduced global TB funding among risks
      (CE016). The assigned evidence does not quantify assay-specific
      sensitivity or failure rates, device-level service outcomes, or
      cybersecurity and privacy controls. Those omissions do not establish
      that controls or incidents are absent; they leave field readiness and
      connected-result handling unverified and require direct quality,
      service, and security diligence.
    claimRefs: [CE001, CE003, CE015, CE016]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module / asset, User job, Status / maturity evidenced, Differentiation, Diligence gap]
    rows:
      - ["Trueprep AUTO V2", "Prepare specimens for molecular testing", "Company product material describes an automatic extraction device", "Nucleic-acid extraction and purification before PCR", "Validate specimen-specific performance and invalid or repeat-test rates"]
      - ["Truelab micro-PCR analyzer", "Amplify extracted RNA or DNA", "Company product material describes the analyzer workflow", "Real-time PCR with disease-specific micro-PCR chips", "Obtain independent throughput, calibration, and uptime data"]
      - ["Truenat MTB / MTB Plus / MTB-RIF Dx", "Diagnose TB and subsequently detect rifampicin resistance", "Global Fund and analyst sources report WHO endorsement for specified TB uses", "Named assay family for a defined public-health workflow", "Confirm current country-by-country authorization and assay-level validation"]
      - ["Prognosys radiology / OptraScan digital pathology", "Provide imaging or slide-scanning workflows", "Portfolio expansion is reported but product-level maturity is unclear", "Extends beyond molecular infectious-disease testing", "Verify integration, installed base, service model, and commercial maturity by product"]
    notes: >-
      Component and portfolio status reflects the cited company, partner,
      news, and analyst descriptions; it does not establish independently
      verified field reliability or equivalent maturity across product lines.
    claimRefs: [CE001, CE002, CE004, CE012, CE015]
  - id: TE002
    title: Workflow and use-case comparison
    columns: [Study setting and endpoint, Hub-and-spoke Xpert MTB/RIF Ultra, Decentralized Truenat MTB Plus / MTB-RIF Dx, Limitation]
    rows:
      - ["Mozambique — facility-based diagnostic cost per participant initiating treatment within 7 days from enrolment", "$853; reported interval $707–$1,072", "$690; reported interval $588–$823", Study-specific cost result; not a kit price or universal saving]
      - ["Tanzania — facility-based diagnostic cost per participant initiating treatment within 7 days from enrolment", "$596; reported interval $485–$746", "$592; reported interval $495–$715", Estimates are close and the reported intervals overlap]
      - ["Mozambique — facility-based diagnostic cost per participant initiating treatment within 60 days from enrolment", "$581; reported interval $493–$706", "$678; reported interval $576–$811", Decentralized testing was not lower on this endpoint]
      - ["Tanzania — facility-based diagnostic cost per participant initiating treatment within 60 days from enrolment", "$391; reported interval $324–$476", "$591; reported interval $494–$716", Decentralized testing was not lower on this endpoint]
    notes: >-
      Values are USD facility-based diagnostic cost per participant initiating
      treatment in the PLOS study; the abstract explicitly labels the first
      parenthetical interval as a 95% uncertainty range and reports intervals
      alongside the other estimates. The comparator, country, and 7- versus
      60-day endpoint must remain distinct; this is not per-test pricing.
    claimRefs: [CE006, CE007, CE008, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer / dependency, What the assigned sources report, Operating implication, Unresolved evidence]
    rows:
      - ["Specimen preparation", "Trueprep AUTO V2 extracts and purifies nucleic acids; extraction is stated as 20 minutes", "Requires appropriate specimen handling and preparation consumables", "No independent specimen-level invalid-rate or failure data"]
      - ["PCR analysis", "Truelab analyzer amplifies extracted RNA or DNA using disease-specific micro-PCR chips", "Instrument and compatible assay availability are linked", "The stated 35-minute process interval is not clearly defined as end-to-end"]
      - ["TB assay menu", "MTB, MTB Plus, and MTB-RIF Dx are named in external TB-program material", "Assay sequence supports initial TB testing and subsequent rifampicin-resistance detection", "Current country-specific approvals and assay-level performance data are not established here"]
      - ["Result transfer and service", "Global Fund describes wireless data transfer and a service commitment with defined indicators", "Connectivity and maintenance are dependencies for field deployment", "No measured SLA attainment, security architecture, or privacy assessment in the assigned sources"]
      - ["Manufacturing and installed base", "Reports give FY25 and FY26 annual capacity snapshots and more than 12,500 devices sold by March 31, 2026", "Installed capacity and devices sold are not actual output or active utilization", "Facility-count and capacity definitions vary across reports; request reconciled audited schedules"]
    notes: >-
      The table distinguishes company or partner descriptions from study
      evidence and analyst-reported scale. Capacity is not production, and
      devices sold are not active devices or customer counts.
    claimRefs: [CE001, CE002, CE005, CE010, CE011, CE012]
