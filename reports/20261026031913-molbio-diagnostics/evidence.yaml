    whyItMatters: Revenue growth and consumables mix do not establish gross profit, customer-level economics, or conversion to cash.
    diligencePath: >-
      Request product-level contribution schedules, utilization cohorts, cost allocations, warranty/service data, and
      the accounting policy for each revenue stream.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: post-IPO-liquidity
    missingEvidence: >-
