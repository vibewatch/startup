    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-and-sales-efficiency
    missingEvidence: >-
      Current instrument and assay list prices, realized prices and discounts by channel, customer contract terms,
      sales-cycle data, CAC, and payback.
    whyItMatters: >-
      Repeat kit sales are central to the model, but without net pricing and acquisition economics the durability and
