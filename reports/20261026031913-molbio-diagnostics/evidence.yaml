evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-market-value-and-customers
    missingEvidence: >-
      A post-listing market capitalization as of 2026-10-26 and a dated customer count with a defined customer unit are
      not present in the assigned source set.
    whyItMatters: >-
      The IPO issue size and reported debut price do not establish current market value, and country coverage or devices
      sold cannot substitute for customer count.
    diligencePath: >-
      Reconcile the latest BSE/NSE closing price with post-offer shares outstanding and obtain a dated company
      disclosure defining customers and reporting the count.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      The selected leadership table does not establish the complete current board, committee assignments, executive
      succession coverage, retention arrangements or depth beneath the named CEO and CTO.
    whyItMatters: >-
      The disclosed allocation of CEO and CTO responsibilities identifies key roles but does not establish how dependent
      execution is on either individual or whether the selected roster is exhaustive.
    diligencePath: >-
      Request the board-approved succession plan, executive retention terms, management-bench data and R&D/commercial
      handover responsibilities.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: india-tb-market-sizing
    missingEvidence: >-
      Current India TB and non-TB molecular-test volumes, public and private tender prices, eligible provider counts,
      and assay-level procurement budgets.
    whyItMatters: >-
      Without a country- and assay-specific demand denominator, the global category estimate and broad diagnostics
      market cannot support a defensible Molbio SAM, SOM, or adoption forecast.
    diligencePath: >-
      Obtain current national and state procurement records, test-volume and price schedules, buyer-level awards, and
      active installed-base utilization by assay from public agencies and company disclosures.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion
    missingEvidence: >-
      Buyer-level deployments, repeat kit orders, realized prices, service levels, and public-versus-private conversion
      data.
    whyItMatters: >-
      Device placements and capacity headroom do not establish recurring utilization, contract renewal, or cash
      conversion.
    diligencePath: >-
      Request active-site cohorts, kit orders per installed device, tender win and renewal rates, realized price ranges,
      and service performance by customer segment.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current instrument and assay price lists, placement or minimum-volume contracts, realized discounting, and
      comparable alternatives' terms.
    whyItMatters: >-
      Without comparable commercial terms, buyers' total costs and the durability of any affordability advantage cannot
      be assessed.
    diligencePath: >-
      Request current price books, anonymized contract examples, installed-base placement terms, and volume-linked
      discount schedules from Molbio and competing vendors.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Customer-level multi-homing, assay switching, instrument uptime, service-response, and internal-build evidence.
    whyItMatters: >-
      These factors determine whether a technically substitutable platform can retain sites and sustain service quality
      after deployment.
    diligencePath: >-
      Interview laboratory buyers and distributors; review site-level utilization, uptime logs, service tickets, and
      replacement or multi-vendor procurement histories.
    relatedQuestionRefs:
      - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: competitors
    missingEvidence: >-
      Named commercial entrants, country-specific deployment footprint, and customer-built or centralized alternatives
