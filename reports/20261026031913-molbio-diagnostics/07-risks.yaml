schemaVersion: "report-v2"
artifact: risks
slug: molbio-diagnostics
runDate: 2026-10-26
company:
  name: Molbio Diagnostics
chapter:
  number: 7
  title: Risks
  summary: >-
    The clearest downside is concentration: government and aid procurement, the
    top ten customers, and TB test kits each represent large shares of FY26
    finished-goods revenue. The August 2026 prospectus also discloses pending
    proceedings, approval and product-liability exposure, single-source inputs,
    working-capital needs, and execution risks; public evidence does not quantify
    event probabilities or demonstrate the effectiveness of most mitigations.
sections:
  - id: legal-regulatory
    title: Legal and regulatory exposure
    body: >-
      The August 3, 2026 red herring prospectus is the strongest current source
      for legal and regulatory exposure. It reports pending proceedings across
      the company, subsidiaries, promoters, and directors, including 11 tax
      proceedings against the company with an aggregate amount of ₹507.81 million;
      the amount is a claim disclosed in the filing, not an adjudicated loss.
      Separately, the filing describes a July 2026 information notice to
      Prognosys concerning an investigation involving a former customer, and says
      Prognosys supplied the requested documents. It also identifies permit,
      inspection, and changing-rule risks, plus earlier statutory-compliance
      failures for which stated penalties were paid. The probability, resolution
      timetable, and any continuing control remediation are not quantified, so
      diligence should obtain counsel's matter-by-matter status and the current
      approval register. (CR004, CR005, CR006)
    claimRefs: [CR004, CR005, CR006]
    tableRefs: [TR001]
  - id: product-and-operational
    title: Product, quality, and operating continuity
    body: >-
      The prospectus identifies product accuracy, defects, warranty obligations,
      facility disruption, demand forecasting, and privacy or cyber threats as
      potential business risks. It reports ₹232.17 million of warranty provision
      at March 31, 2026 and says it has not had a product-liability claim with an
      adverse business impact in the prior three fiscal years; that statement is
      not evidence that no complaints or quality incidents occurred. It also
      describes prior inventory-obsolescence provisions and a two-year shelf life
      for Truenat kits. NatCap independently highlights assay breadth, quality,
      and distribution as execution challenges, but supplies no incident rate or
      control assessment. The investment case therefore depends on audited
      quality metrics, field failure and complaint data, CAPA closure, and
      service performance that are not public in this source set. (CR003, CR007,
      CR010, CR012, CR016)
    claimRefs: [CR003, CR007, CR010, CR012, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-and-concentration
    title: Customer, supplier, and partner dependencies
    body: >-
      FY26 finished-goods revenue concentration is unusually consequential:
      Indian central and state governments plus international aid agencies
      represented 84.56%, the top ten customers 83.26%, and TB test kits 70.20%
      of the same stated denominator. ICICI Direct separately notes that none
      of the top ten customers was under a firm-commitment contract. Supplier
      exposure is also concentrated: the prospectus says the top ten suppliers
      represented 58.52% of raw-material purchases and identifies a substrate
      sole-source; ICICI Direct reports 42.01% of FY26 raw materials were
      imported. A Global Fund/USAID/Stop TB collaboration documents reduced test
      prices and defined service-level KPIs, but not the economics or service
      outcomes. These disclosures support concentration and dependency concerns,
      not a forecast that any contract or supplier will fail. (CR001, CR002,
      CR008, CR009, CR011, CR015)
    claimRefs: [CR001, CR002, CR008, CR009, CR011, CR015]
    tableRefs: [TR003]
  - id: financial-and-execution-controls
    title: Financial resilience and monitoring priorities
    body: >-
      The prospectus reports FY26 working capital of ₹8,274.83 million and
      working-capital days of 166, while consolidated borrowings were
      ₹4,225.01 million as of May 31, 2026; ₹392.43 million of unsecured loans
      were repayable on demand. These are balance-sheet and financing exposures,
      not a cash-burn measure. The filing also warns that the proposed R&D and
      Center of Excellence facility would not add manufacturing capacity or
      immediate attributable cash flows, making completion, regulatory
      clearance, assay launch, and commercial uptake relevant milestones. Track
      tender renewals and top-customer shares, assay approval and launch timing,
      warranty and CAPA trends, supplier alternatives, receivable aging, debt
      covenants, and capex delivery. Public disclosures do not establish
      customer-level concentration, uptime, incident frequency, or mitigation
      effectiveness; those remain diligence asks. (CR003, CR013, CR014)
    claimRefs: [CR003, CR013, CR014]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk / disclosed exposure
      - Likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - Pending tax proceedings and investigation-related requests
        - Proceedings disclosed; outcome probability and timetable not stated
        - High; the filing warns of possible financial, operating, and reputational effects
        - Requested information was supplied in the identified subsidiary notice; broader matter-level controls are not assessed
        - Obtain counsel's current docket, claimed amounts, status, and expected resolution; do not treat claims as adjudicated liabilities
      - - Required licenses, permits, and facility approvals
        - Exposure is ongoing; future adverse findings are not quantified
        - High; adverse action could restrict marketing, sales, or facility operations
        - Prospectus describes required approvals and periodic inspections; it reports no inspection sanctions in the last three fiscals
        - Verify every current product and site approval, renewal date, inspection finding, and corrective action
      - - Past statutory-compliance lapses
        - Prior instances disclosed; recurrence probability is unknown
        - Moderate; stated penalties were paid, but future non-compliance could prompt further action
        - Filing describes compounding/adjudication and payment of specified penalties
        - Review compliance-control remediation and evidence of on-time filings and payments after the disclosed matters
    notes: >-
      Partial selection of risks disclosed in Molbio's August 3, 2026 red
      herring prospectus, not a complete litigation or approvals inventory.
      Likelihood is not quantified; severity is an evidence-based analyst
      ranking, not a probability estimate. Amounts claimed are not adjudicated
      liabilities.
    enumerationScope:
      coverage: partial
      basis: Selected prospectus disclosures on legal matters, approvals, and statutory compliance as of August 3, 2026.
    claimRefs: [CR004, CR005, CR006]
  - id: TR002
    title: Operational, quality, and technology risk register
    columns:
      - Failure mode
      - Likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure / unresolved gap
    rows:
      - - Inaccurate, incomplete, or defective diagnostic output
        - No probability disclosed; prospectus describes the failure mode
        - High; could trigger liability, loss of trust, and regulatory response
        - Product warranties, ₹232.17 million warranty provision at March 31, 2026, and disclosed product-liability insurance
        - Obtain field failure, complaint, recall, RMA, CAPA, and coverage-limit data; provision adequacy is not assured
      - - Facility disruption or quality-control failure
        - No adverse-impact disruption reported for the last three fiscals; future probability unknown
        - High; production interruptions could constrain product availability
        - Six facilities are described in the prospectus; site-level redundancy and recovery tests are not disclosed
        - Test business-continuity plans, site-level quality metrics, and recovery times
      - - Demand forecast error and kit obsolescence
        - Prior inventory-obsolescence provisions disclosed for FY24 and FY25; future incidence unknown
        - Material; expired or unsold kits can impair margins and availability
        - Filing says inventory is reviewed annually and provisions are recorded
        - Review SKU-level shelf-life, aging, write-offs, and demand forecast accuracy
      - - Cyber threats, privacy-law changes, and technology failure
        - Prospectus identifies the exposures but provides no incident probability
        - Potentially high because service, data handling, or product operations could be affected
        - Current security controls, certifications, and tested response maturity are not established by this source set
        - Request incident history, penetration-test scope, privacy assessments, and recovery evidence; absence of a recorded incident is not proof of absence
    notes: >-
      Selected company-disclosed operational exposures, with analyst assessment
      separated from reported events. A statement that no adverse-impact event
      was experienced in a stated period does not establish that no incident
      occurred.
    claimRefs: [CR007, CR010, CR012, CR016]
  - id: TR003
    title: Partner, customer, and financial dependency register
    columns:
      - Dependency
      - Concentration / evidence
      - Failure scenario
      - Mitigation maturity
      - Residual exposure / monitor
    rows:
      - - Government and aid procurement; top customers
        - 84.56% of FY26 finished-goods revenue from Indian central/state governments and international aid agencies; top ten customers 83.26%
        - Policy, funding, tender, or buyer changes could reduce demand; top ten are not under firm-commitment contracts per ICICI Direct
        - No public customer-level diversification or renewal coverage disclosed
        - Monitor tender win/renewal rates, customer shares, award duration, and committed backlog
      - - TB test-kit franchise
        - TB test kits represented 70.20% of FY26 finished-goods revenue
        - Disease-program, testing-method, or procurement shifts could affect the dominant product line
        - WHO-related evidence and public-health programs support adoption, but do not guarantee future demand
        - Track non-TB kit mix, program budgets, test volumes, and assay approvals
      - - Raw-material suppliers and imports
        - Top ten suppliers represented 58.52% of FY26 raw-material purchases; some inputs are sole-sourced; ICICI Direct reports 42.01% of FY26 raw materials were imported
        - Supplier interruption, price movement, duties, or foreign-exchange changes could delay or raise costs
        - Supplier quality agreements are disclosed; alternative-source qualification is not
        - Request sole-source map, alternate qualification status, inventory buffers, and import exposure by input
      - - Distribution, service, and working-capital counterparties
        - Company relies on third-party transport; FY26 working-capital days were 166 and receivables were ₹4,087.36 million at March 31, 2026
        - Delivery failures, delayed collections, or service shortfalls may pressure availability and cash conversion
        - A Global Fund collaboration specifies reduced prices and service-level KPIs; public performance data are absent
        - Review distributor concentration, SLA attainment, receivable aging, and credit-loss trends
    notes: >-
      Concentration denominators and periods are retained as stated by each
      source. WHO and partner-program references are context, not independent
      commercial benchmarks or evidence of guaranteed procurement.
    claimRefs: [CR001, CR002, CR008, CR009, CR011, CR013, CR015]
