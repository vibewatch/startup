callouts:
  - calloutType: assumption
    title: Do not convert global TAM into a Molbio SAM
    body: >-
      Neither the global POC molecular estimate nor India's broad diagnostics
      market reveals the spend Molbio can serve. A company-specific market
      requires current assay-level demand, procurement pricing, buyer eligibility,
      and active utilization evidence.
    claimRefs: [CM001, CM003, CM015]
