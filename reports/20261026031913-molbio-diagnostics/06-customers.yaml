schemaVersion: "report-v2"
artifact: customers
slug: molbio-diagnostics
runDate: "2026-10-26"
company:
  name: Molbio Diagnostics
chapter:
  number: 6
  title: Customers
  summary: >-
    FY26 disclosures describe a public-program-led customer mix and substantial
    Truenat device and test-kit activity, but report different denominators and
    no account-level retention. Named TB-program announcements establish
    procurement and rollout pathways, not independently measured outcomes or
    repeat use at individual sites.
sections:
  - id: buyer-segments
    title: Buyer mix is disclosed by category, not by account
    body: >-
      GEPL Capital's August 2026 IPO note groups FY26 revenue into Indian central
      government, Indian state governments, international aid agencies, and
      non-government agencies. It reports ₹791 crore (56.54%) from the central
      government category, ₹326 crore (23.30%) from state governments, ₹66 crore
      (4.72%) from international aid agencies, and ₹216 crore (15.44%) from
      non-government agencies. These categories indicate that public budgets and
      aid-funded programs are major payer channels, but they do not identify
      ministries, tenders, countries, or individual customers. NDTV Profit
      estimates that only about 1,400 of 17,000 private healthcare facilities
      have molecular diagnostic capability; that is a market estimate, not a
      count of Molbio customers. The source's FY26 category table totals ₹1,399
      crore, while its financial table reports ₹1,446 crore of revenue, so the
      percentage mix should not be reconciled to another denominator.
    claimRefs:
      - CU005
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU001
  - id: deployment-and-use
    title: Deployment and kit volume show activity, not site-level utilization
    body: >-
      NDTV Profit reports more than 12,500 Truenat devices across over 90
      countries and describes an Indian public-sector footprint of about
      8,000–9,000 public health centres. DSIJ's October 2026 summary of Motilal
      Oswal research also gives 12,500-plus devices and 8,000–9,000 diagnostic
      centres, without defining the centre population in the same way. An
      undated OpenDx profile separately lists 8,293-plus NAAT systems in India
      and 85-plus countries; these differently worded counts are not
      interchangeable. NDTV reports test-kit volumes rising from 8.8 million
      units in FY24 to 17.6 million in FY26 (41% CAGR), while GEPL rounds those
      fiscal-year totals to 9 million and 18 million. It also reports more than
      40 million tests worldwide without specifying the period. Sales, devices,
      centres, and cumulative tests evidence activity, not active use or
      reorder frequency at a particular customer.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU002
  - id: named-programs
    title: Program announcements prove routes to market, not customer outcomes
    body: >-
      The strongest named customer-side evidence in the assigned sources is
      institutional and programmatic. The Global Fund's March 2023 announcement
      describes lower prices for Truenat TB tests and a global service and
      maintenance agreement with defined performance indicators; it says new
      deals would be signed, not that all orders had shipped. A company
      announcement reproduced by IndiaMedToday reports a completed domestic
      rollout under India's National Tuberculosis Elimination Program and an
      iNTP rollout across nine countries, with installations described as
      complete in seven and underway in Bangladesh and Vietnam. These records
      identify buyers, funders, and implementation pathways, but disclose no
      country-level order values, active-site counts, or patient outcomes. WHO's
      rapid communication provides clinical-evidence context, not proof of
      customer utilization.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU016
    tableRefs:
      - TU003
  - id: durability-and-concentration
    title: Recurring kit sales coexist with buyer and disease concentration
    body: >-
      Truenat combines device placements with proprietary single-use kits, so
      ongoing testing can generate repeat consumable purchases. Aggregate kit
      growth does not establish customer retention: the assigned sources do not
      report net or gross revenue retention, churn, renewal cohorts, contract
      duration, or reorder frequency by site. Concentration is clearer at the
      payer-category and disease levels. GEPL's customer table shows sizable
      central- and state-government shares, while NDTV Profit and analyst notes
      flag public procurement and tuberculosis dependence. Their TB metrics use
      different bases—total revenue, consumables revenue, and test-kit volume—
      and should not be blended. A May 2024 Moneycontrol article reported plans
      to strengthen global presence and launch products; this is historical
      intent, not evidence of achieved expansion. Account-level concentration,
      active utilization, and renewal behavior remain material diligence gaps.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU014
      - CU015
      - CU016
    figureRefs:
      - FU001
tables:
  - id: TU001
    title: Reported FY26 buyer segments
    columns:
      - Buyer or payer category
      - FY26 revenue and share in GEPL table
      - User or channel evidence
      - What remains unknown
    rows:
      - - Indian central government
        - ₹791 crore / 56.54%
        - Public-health procurement; no named ministry or program allocation
        - Customer, tender, and renewal concentration within the category
      - - Indian state governments
        - ₹326 crore / 23.30%
        - State-government buyer category; no state split disclosed
        - State-level awards, site counts, and revenue concentration
      - - International aid agencies
        - ₹66 crore / 4.72%
        - Global Fund, USAID, and Stop TB Partnership describe a supported procurement channel
        - Agency, country, shipment, and revenue attribution
      - - Non-government agencies
        - ₹216 crore / 15.44%
        - GEPL's category does not identify the agencies or end users
        - Named accounts, use cases, and contract duration
      - - Private hospitals and diagnostic laboratories
        - Not disclosed
        - NDTV cites an estimated 1,400 molecular-capable facilities out of 17,000 private facilities
        - Molbio customer count, revenue, adoption, and utilization in this segment
    notes: >-
      GEPL Capital's customer-wise FY26 rows total ₹1,399 crore (100% of that
      table), while the same note's financial table reports ₹1,446 crore of
      revenue. Values are reproduced as reported and the difference is not
      reconciled. NDTV's private-facility figures are an estimated market
      opportunity, not Molbio customer counts.
    claimRefs:
      - CU005
      - CU008
      - CU009
      - CU010
  - id: TU002
    title: Reported deployment and usage indicators
    columns:
      - Metric
      - Value and period as reported
      - Source basis
      - Customer implication
      - Missing denominator or qualification
    rows:
      - - Truenat devices and countries
        - More than 12,500 devices across over 90 countries; period not stated in NDTV text
        - NDTV Profit and DSIJ/Motilal Oswal summary
        - Indicates a broad reported deployment footprint
        - Active devices, site count, and unique customers are not stated
      - - Indian public-sector footprint
        - About 8,000–9,000 public health centres and over 90% of the public-sector molecular diagnostic installed base
        - NDTV Profit
        - Indicates material exposure to public-health facilities
        - Active-use rate, site-level tests, and account revenue are not stated
      - - India NAAT systems
        - 8,293+ systems; OpenDx profile gives no publication date
        - OpenDx TBHub
        - A separate third-party footprint listing
        - Definition, date, and relationship to centre counts are not stated
      - - Test-kit sales volume
        - 8.8 million units in FY24 to 17.6 million in FY26; 41% CAGR in NDTV; GEPL rounds to 9 million and 18 million
        - NDTV Profit and GEPL Capital
        - Supports growth in aggregate consumable volume
        - Units sold are not customer accounts, tests performed, or repeat orders by site
      - - Tests conducted worldwide
        - More than 40 million; period not specified
        - NDTV Profit
        - Indicates cumulative reported use
        - No annual trend, unique-patient count, or tests per device
    notes: >-
      Counts retain each source's terms and time basis. Device sales, installed
      devices, health centres, NAAT systems, test kits sold, and tests conducted
      are different measures and are not combined into a single adoption rate.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer, program, or channel
      - Segment and use case
      - Deployment or commercial status reported
      - Outcome evidence
      - Limitation
    rows:
      - - India's National Tuberculosis Elimination Program
        - Indian public health; Truenat MTB for TB diagnosis
        - Company announcement reproduced by IndiaMedToday describes a completed domestic rollout
        - No patient outcome or site-level utilization metric
        - No named facilities, deployment date, contract value, or repeat-order rate
      - - Introducing New Tools Project (iNTP)
        - Public-health program in nine high-TB-burden countries
        - Company announcement says installations were complete in seven countries and underway in Bangladesh and Vietnam
        - Country-level rollout status only
        - No order values, installed-unit counts, usage, or outcome data by country
      - - Global Fund, USAID, and Stop TB Partnership channel
        - Supported-country procurement of Truenat TB tests and service
        - Global Fund announced reduced-price terms and a service/maintenance package; new deals were to be signed
        - Terms and intended access are described, not realized shipments
        - No completed-order volume, revenue, renewal, or customer outcome is given
    notes: >-
      Sample of three named public-program or partner channels found in the
      assigned sources, not a complete customer enumeration. Company-originated
      rollout statements and partner announcements are not treated as
      independent site-level validation.
    enumerationScope:
      coverage: sample
      basis: >-
        Three named public-program or partner channels in the assigned sources;
        this is not a complete customer or deployment roster.
    claimRefs:
      - CU002
      - CU005
      - CU010
      - CU011
      - CU012
      - CU013
      - CU016
figures:
  - id: FU001
    title: Institutional customer path from procurement to repeat use
    type: journey-map
    summary: >-
      Program procurement and device placement can create kit demand, but the
      available sources do not measure site-level repeat use or retention.
    data:
      items:
        - label: Program procurement
          detail: >-
            Public budgets and aid-supported channels are reported; the Global
            Fund described lower-price test and service terms.
          touchpoints:
            - Indian government buyer categories
            - Global Fund, USAID, and Stop TB Partnership
        - label: Instrument placement
          detail: >-
            More than 12,500 devices across over 90 countries are reported, but
            active-site counts are unavailable.
          touchpoints:
            - Public-health centres
            - International program rollouts
        - label: Point-of-care testing
          detail: >-
            WHO evidence communications and program announcements concern
            Truenat TB testing; neither gives customer-level utilization.
          touchpoints:
            - TB and rifampicin-resistance testing
            - Remote and resource-limited settings
        - label: Single-use kit consumption
          detail: >-
            Truenat devices use Molbio's proprietary single-use test kits;
            aggregate FY26 kit volume is reported separately from site activity.
          touchpoints:
            - Disease-specific consumables
            - Kits are not equivalent to unique customers
        - label: Repeat procurement
          detail: >-
            Kit sales rose across FY24–FY26, but no source ties reorders to
            particular devices, customers, or cohorts.
          touchpoints:
            - Aggregate volume trend
            - No site-level reorder data
        - label: Retention and outcomes
          detail: >-
            Renewal, churn, active use, and patient outcomes are not established
            by the assigned public evidence.
          touchpoints:
            - Customer cohort data requested
            - Independent outcome evidence requested
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU014
      - CU016
