  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-market-valuation
      missingEvidence: >-
        A reconciled current exchange price, diluted share count, net debt,
        current EV, interim earnings, free float, lock-up schedules and
        preference or other dilution overhang needed to calculate a dated
        forward valuation and return range.
      whyItMatters: >-
        Without a common date and consistent equity and enterprise-value
        bases, IPO marks, a vendor market-data estimate and broker targets
        cannot establish an investable entry price.
      diligencePath: >-
        Retrieve the latest exchange filings, shareholding pattern and
        financial statements; rebuild market capitalization and enterprise
        value from the same-date quote, reconcile FY26 and interim periods,
        and review lock-ups and fully diluted capitalization.
      relatedQuestionRefs:
        - QV005
        - QV008
      relatedTableRefs:
        - TV003
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: >-
        A dated, independently checked comparable set with consistent
        revenue, earnings, growth, margin and enterprise-value definitions,
        plus Molbio's current working-capital and operating-cash-flow data.
      whyItMatters: >-
        The broker's sector P/E comparison and the vendor's EV/Revenue
        figure use different measures and do not establish a like-for-like
        market benchmark or cash-backed valuation.
      diligencePath: >-
        Rebuild a peer and transaction set from public filings using
        comparable periods and business models, then reconcile forward
        earnings, margin and cash conversion with Molbio's exchange
        disclosures.
      relatedQuestionRefs:
        - QV008
      relatedTableRefs:
        - TV002
        - TV003
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: >-
        Current customer-, country-, tender- and disease-level revenue,
        renewal, receivable and device-utilization data.
      whyItMatters: >-
        Broker-reported FY26 concentration in TB testing and government or
        aid customers leaves growth, margins and cash conversion sensitive
        to a small number of demand drivers.
      diligencePath: >-
        Reconcile the latest audited and interim filings by customer,
        geography, product and disease, then test procurement renewal,
        receivable ageing and installed-device utilization with management.
      relatedQuestionRefs:
        - QV002
        - QV006
      relatedTableRefs:
        - TV002
