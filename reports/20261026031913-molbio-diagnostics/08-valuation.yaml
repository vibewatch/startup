company:
  name: Molbio Diagnostics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Broker-reported FY26 revenue growth and a recurring Truenat consumables
    mix support the operating thesis, but tuberculosis and public-program
    concentration temper it. IPO pricing and an October market-data snapshot
    indicate meaningful valuation risk; Track until current capitalization,
    cash conversion and scenario inputs are reconciled.
sections:
  - id: investment-view
    title: "Investment view: quality is not a price"
    body: >-
      The investment case rests on Molbio's Truenat platform and repeat
      disease-specific test-kit sales. DSIJ's summary of Motilal Oswal
      attributes 72% of consolidated FY26 revenue to test kits and 14% to
      devices, while saying Truenat contributed about 90%; that supports a
      consumables thesis, not proof of device utilization, reorder behavior
      or assay-level margins. Geojit reports FY26 revenue of INR 1,445.7
      crore, up 41.7% year over year, but the same source set also reports
      material tuberculosis and government-program concentration. Molbio's
      September 2022 $1.6 billion financing valuation and Moneycontrol's
      2024 reported IPO target are historical reference points, not current
      fair value. The IPO and public-market snapshots now provide observed
      prices and multiples, but they do not reconcile to audited current
      earnings, diluted shares, net debt or a defensible return range. Track
      is therefore more supportable than Buy until those inputs are checked.
    claimRefs:
      - CV001
      - CV002
      - CV009
      - CV010
      - CV016
    tableRefs:
      - TV001
  - id: public-valuation
    title: Public-market entry and valuation evidence
    body: >-
      Geojit and GEPL Capital's August 2026 IPO notes report a price band of
      INR 768–807 and roughly INR 9,300 crore market capitalization at the
      upper band.       Geojit's upper-price issue table lists about INR 940 crore of total
      offer, including INR 200.2 crore of fresh issue and INR 739.7 crore of
      OFS; its allocation table reports INR 939.7 crore total against the
      issue-size table's INR 939.9 crore, a small internal discrepancy. The
      total offer size is not cash available to Molbio because OFS proceeds
      go to selling shareholders. The Economic Times' 2025
      DRHP coverage described an earlier proposed INR 200 crore fresh issue
      and OFS of up to 1.25 crore shares, so that proposal should not be
      confused with the final 2026 issue. Business Today reports a debut at
      INR 980, over 21% above the INR 807 issue price. Multiples.vc's
      October 25, 2026 snapshot lists USD 1.5 billion market capitalization
      and enterprise value, 10.2x EV/Revenue and 45.4x EV/EBITDA; its
      revenue period and valuation bridge are not clear enough for
      independent recalculation. DSIJ's summary of Motilal Oswal's INR 1,800
      target is an analyst view, not a verified fair-value conclusion.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV013
  - id: scenario-discipline
    title: Scenario discipline and downside
    body: >-
      The bull case is that kit consumption, new assays and international
      penetration deliver the FY26–FY29E revenue CAGR and margin expansion
      in Motilal Oswal's forecast as summarized by DSIJ. Those are analyst
      estimates, not company guidance or probability-weighted outcomes. The
      base case is continued growth but no fresh entry until the October
      market-data snapshot is reconciled to the live quote, diluted share
      count, net debt and FY26/interim earnings. The bear case is multiple
      compression or slower growth if tuberculosis testing and public
      procurement remain concentrated, while margin pressure offsets
      revenue growth. DSIJ reports TB at 96% of FY26 test-kit volume and
      74% of consumables revenue; Geojit reports government and aid agencies
      at about 85% of FY26 revenue. Neoma's August pre-IPO note separately
      warns that procurement dependence can expose revenue to funding and
      policy decisions. The broker's comparison set is a valuation reference
      only, not an independent fair-value benchmark. The available evidence
      does not support numerical scenario ranges or probabilities.
    claimRefs:
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV002
      - TV003
    figureRefs:
      - FV001
  - id: diligence-and-triggers
    title: Exit readiness, diligence and thesis breaks
    body: >-
      Molbio's 2026 listing provides public-market access, but investor exit
      readiness still depends on the live trading price, liquidity, lock-ups,
      fully diluted ownership and post-IPO selling by shareholders. The
      available offer notes distinguish fresh issue from OFS but do not
      establish current free float, preference overhang, lock-up schedules
      or a same-date equity-to-enterprise-value bridge. Before entry, obtain
      the latest exchange filings and shareholding pattern, rebuild
      enterprise value from the current quote and net debt, and reconcile
      audited and interim financials with broker forecasts. Disease-level
      sales, customer and tender concentration, device utilization,
      receivable days, inventory and operating cash flow are needed to
      distinguish accounting profit from cash conversion. Reassess the
      thesis if revenue fails to track the published FY26–FY29E broker
      forecast, TB or public-procurement concentration persists without
      diversification, or margins and cash conversion weaken. These are
      diligence and monitoring triggers, not claims that deterioration has
      occurred.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
