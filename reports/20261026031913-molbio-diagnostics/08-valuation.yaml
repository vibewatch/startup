  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - >-
          Truenat's repeat consumables can create an attractive growth
          engine.
        - >-
          Motilal Oswal's summary attributes 72% of FY26 consolidated revenue
          to test kits and 14% to devices.
        - >-
          Verify device utilization, kit reorder behavior and gross margin
          by assay.
      - - >-
          FY26 growth and consumables mix support the operating thesis.
        - >-
          Geojit reports INR 1,445.7 crore FY26 revenue, up 41.7%; DSIJ's
          summary attributes 72% of FY26 consolidated revenue to kits and
          14% to devices.
        - >-
          Reconcile audited periods and cash flow; test whether growth is
          durable across non-TB and non-pandemic demand.
      - - >-
          Public-market valuation leaves limited room for execution
          disappointment.
        - >-
          Multiples.vc reports 10.2x EV/Revenue and 45.4x EV/EBITDA as of
          October 25, 2026; broker IPO notes show about 56–57x FY26 P/E
          at issue.
        - >-
          Reconcile live price, share count, net debt and forward earnings
          against filings.
      - - >-
          Concentration and procurement exposure can weaken the upside case.
        - >-
          DSIJ reports TB at 96% of FY26 test-kit volume; Geojit reports
          government and aid agencies at about 85% of FY26 revenue, and
          Neoma flags procurement dependence.
        - >-
          Obtain disease- and customer-level revenue, tender renewal and
          receivable data.
      - - >-
          The broker peer set is a reference, not independent valuation proof.
        - >-
          Geojit's IPO note compares Molbio's 55.7x FY26 P/E with listed
          diagnostics and medical-device peers.
        - >-
          Rebuild a dated peer set with consistent growth, margins, cash
          conversion and business mix.
    notes: >-
      Figures are broker-reported and retain their stated periods and
      denominators. Geojit's note lists INR 939.9 crore in its issue-size
      table and INR 939.7 crore in its allocation table; peer comparisons
      are not independent fair-value benchmarks or company guidance.
