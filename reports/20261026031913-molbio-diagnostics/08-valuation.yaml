          material downside sensitivity.
      - - Valuation stance
        - Stretched, provisional
        - >-
          Multiples.vc reports 10.2x EV/Revenue and 45.4x EV/EBITDA; the
          broker's 45x forward P/E uses a different basis.
      - - Decision implication
        - Wait for verified price and filings
        - >-
          Rebuild current enterprise value and forward earnings before
          setting an entry price or expected return.
    notes: >-
      Analyst judgments are this chapter's synthesis; the 10.2x EV/Revenue
      and 45x forward P/E are separately attributed provider and broker
      figures, not independently recalculated comparable multiples.
