  - id: TV003
    title: Bull, base and bear scenarios
    columns:
      - Scenario
      - Explicit assumption
      - Valuation / return logic
      - Probability signal
      - Downside trigger and diligence
    rows:
      - - Bull
        - >-
          Motilal Oswal's summarized FY26–FY29E revenue CAGR forecast of
          23% is achieved through kit growth, new assays and international
          penetration.
        - >-
          Earnings growth could support a premium multiple; no numeric range
          or return is supportable without a reconciled current price and
          share count.
        - >-
          Not quantified; this is an analyst forecast, not a probability.
        - >-
          Track kit volumes, utilization and non-TB growth against the
          forecast.
      - - Base
        - >-
          Revenue continues to grow, but valuation inputs and operating
          conversion are verified before underwriting further appreciation.
        - >-
          Maintain Track at the observed IPO and public-market reference
          points; a fair-value range cannot be set from the available
          evidence.
        - >-
          Not quantified; central case is a diligence stance, not an
          estimated likelihood.
        - >-
          Reconcile current market capitalization and enterprise value,
          forward earnings, working capital and cash flow.
      - - Bear
        - >-
          TB concentration, tender timing or commercialization friction
          weakens growth or margins.
        - >-
          Multiple compression from a reported 10.2x EV/Revenue could impair
          returns; no downside price target is evidenced.
        - >-
          Not quantified; no probability distribution is available.
        - >-
          Monitor test-kit disease mix, tender dependence, margin trajectory
          and cash conversion.
    notes: >-
      Scenarios are conditional analysis, not forecasts. Numeric valuation
      ranges, target returns and probabilities are intentionally left
      unavailable because current trading inputs and a reconciled financial
      model are missing.
