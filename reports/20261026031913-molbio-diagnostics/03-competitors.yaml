  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Current instrument and assay price lists, placement or minimum-volume contracts, realized discounting, and comparable alternatives' terms.
      whyItMatters: Without comparable commercial terms, buyers' total costs and the durability of any affordability advantage cannot be assessed.
      diligencePath: Request current price books, anonymized contract examples, installed-base placement terms, and volume-linked discount schedules from Molbio and competing vendors.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Customer-level multi-homing, assay switching, instrument uptime, service-response, and internal-build evidence.
      whyItMatters: These factors determine whether a technically substitutable platform can retain sites and sustain service quality after deployment.
      diligencePath: Interview laboratory buyers and distributors; review site-level utilization, uptime logs, service tickets, and replacement or multi-vendor procurement histories.
      relatedQuestionRefs: [QP009]
    - type: enumeration-incomplete
      severity: minor
      topic: competitors
      missingEvidence: Named commercial entrants, country-specific deployment footprint, and customer-built or centralized alternatives beyond the cited examples.
      whyItMatters: The source pool supports a bounded comparison but not an exhaustive competitor census or relative market position.
      diligencePath: Obtain country procurement lists and tender awards, then map named products, local implementation partners, and laboratory build-versus-buy decisions.
      relatedTableRefs: [TP001]
