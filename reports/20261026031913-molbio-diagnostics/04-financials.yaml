company:
  name: Molbio Diagnostics
chapter:
  number: 4
  title: Financials
  summary: FY26 revenue growth and a test-kit-heavy Truenat mix support a recurring-consumables model, but payer and disease concentration, lower EBITDA margins, and volatile cash conversion weaken revenue quality. The IPO added only a defined fresh-issue component for company use; current post-listing liquidity, realized pricing, and product-level margins remain unverified in the assigned evidence.
sections:
  - id: revenue-model
    title: Revenue model, mix, and quality
    body: >-
      Molbio's Truenat model pairs device sales with disease-specific test kits that
      generate repeat purchases; this supports recurring consumables revenue, not a
      disclosed subscription or ARR measure (CI001). For FY26, Motilal Oswal's
      summary puts Truenat at about 90% of revenue, with test kits at 72% and devices
      at 14% of consolidated revenue; it reports kit revenue of Rs 10.3 billion and
      device revenue of Rs 2.0 billion (CI003, CI004). Anand Rathi reports consolidated
      revenue from operations of Rs 8,366 million in FY24, Rs 10,204 million in FY25,
      and Rs 14,457 million in FY26 (CI002). These measures evidence scale and a
      consumables-led mix, but not ARR, paid-test utilization, customer retention, or
      product gross profit. FY26 concentration is material: government and aid
      agencies contributed 84.6% of revenue, the top ten customers 83.3%, and TB test
      kits 70.2% (CI007-CI009). These overlapping payer, customer, and disease
      denominators must not be added together.
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI009, CI014]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: unit-economics
    title: Margins, pricing, and unit-economics gaps
    body: >-
      Consolidated EBITDA margin fell from 28.0% in FY24 to 25.7% in FY25 and 22.2%
      in FY26, even as revenue grew; Motilal Oswal attributes FY26 pressure to higher
      employee and other expenses, R&D, overseas-market development, and sales costs
      (CI005). The same broker describes FY24-FY26 operating cash flow as volatile
      because of working-capital intensity, receivables, and inventory; Anand Rathi
      also flags past negative operating cash flows at the company and certain
      subsidiaries without giving their period or amount (CI006). Neither statement
      establishes FY26 cash burn. The only explicit per-test price in this source set
      is a Stop TB Partnership quote in a 2023 Global Fund release: below US$8 per
      test under a specific collaboration, alongside a service-level agreement
      (CI013). It is not a current list price, realized ASP, or gross-margin measure.
      WHO's technical review likewise does not establish commercial uptake (CI016).
    claimRefs: [CI005, CI006, CI013, CI015, CI016]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      Anand Rathi's August 2026 IPO note reports an Rs 9,400 million offer, split
      between Rs 2,000 million of fresh issue and Rs 7,400 million of offer for sale;
      Business Today later reported an approximately Rs 940 crore IPO raise and the
      Rs 807 issue price (CI010, CI011). The gross issue amount therefore is not the
      amount of new company capital: the OFS portion represents selling shareholders.
      The fresh-issue objects included an R&D facility and Center of Excellence,
      plant and equipment, and general corporate purposes; a CEO interview also
      described R&D-facility and manufacturing-automation plans (CI012). Neither the
      offer documents in this pool nor the post-listing interview establishes current
      cash on hand, debt maturities, monthly burn, net proceeds after costs, or
      runway. The underwriting case has demonstrated revenue scale, but margin
      compression, concentrated demand, working-capital volatility, and missing
      liquidity data make returns and capital sufficiency hard to underwrite. Request
      current interim cash-flow and balance-sheet data plus assay-level margins,
      utilization, pricing, and receivables detail.
    claimRefs: [CI010, CI011, CI012]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams and FY26 concentration
    columns: [Metric, Reported result, Period and denominator, Underwriting implication]
    rows:
      - ["Consolidated revenue from operations", "FY24 Rs 8,366m; FY25 Rs 10,204m; FY26 Rs 14,457m", "Fiscal years ended March 31; consolidated", "Anand Rathi figures; Tracxn separately lists FY25 annual revenue above Rs 1,000 crore as a coarser profile measure."]
      - ["Truenat share", "About 90% of revenue", "FY26; Motilal Oswal summary", "Approximate platform share; not an ARR figure."]
      - ["Test-kit revenue", "Rs 10.3bn; 72% of consolidated revenue; up 41.6% YoY", "FY26", "Analyst-reported consumables revenue; gross margin is not disclosed."]
      - ["Device revenue", "Rs 2.0bn; 14% of consolidated revenue; broadly flat YoY", "FY26", "Analyst-reported equipment sales; no current device ASP is disclosed."]
      - ["Government and international aid agencies", "84.6% of revenue", "FY26; Anand Rathi risk disclosure", "Payer and funding concentration."]
      - ["Top ten customers", "83.3% of revenue", "FY26; Anand Rathi risk disclosure", "Customer concentration may overlap with payer concentration."]
      - ["TB test kits", "70.2% of revenue", "FY26; Anand Rathi risk disclosure", "Disease and product concentration."]
      - ["Historical group revenue and forecast", "Rs 850 crore reported for FY23-24; Rs 1,200 crore forecast for FY24-25", "Moneycontrol report dated May 30, 2024", "The second figure was a forecast at the time, not actual revenue from operations."]
    notes: FY26 mix and concentration figures retain each source's stated denominator; approximate platform share, kit/device shares, and concentration ratios overlap and should not be summed. The 2024 group-revenue figure and FY24-25 forecast are distinct from later consolidated revenue-from-operations figures.
    claimRefs: [CI002, CI003, CI004, CI007, CI008, CI009, CI014]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Input, Public evidence, Period and basis, What remains unknown]
    rows:
      - ["Revenue mechanism", "Device sales plus recurring disease-specific test kits", "Broker research descriptions", "Contract duration, repeat-purchase rate, and revenue-recognition policy by stream."]
      - ["TB test price", "Stop TB Partnership quoted a price below US$8 per test", "2023 collaboration for Truenat MTB / MTB Plus and MTB-RIF Dx", "Not a current list price, company-wide realized ASP, or kit-level price."]
      - ["Service and maintenance", "Collaboration included a global service-level agreement with defined KPIs", "2023 Global Fund / Stop TB / USAID arrangement", "Service cost, service performance, warranty burden, and terms outside that arrangement."]
      - ["Device and assay pricing", "Current prices and realized discounts not stated in retained sources", "No current public price schedule in this assigned pool", "Request realized price and discount by instrument, assay, geography, and channel."]
      - ["Sales efficiency", "CAC, sales cycle, payback, and channel economics not stated in retained sources", "Not available in reviewed pool", "Request funnel, acquisition cost, distributor margin, and cohort payback data."]
    notes: The sub-US$8 quote is a 2023 partner statement for a specific public-health collaboration and is expressed per test; it is not interchangeable with device price, kit price, or realized company revenue.
    claimRefs: [CI001, CI013]
  - id: TI003
    title: Profitability and capital adequacy
    columns: [Measure, Reported result or status, Period and basis, Underwriting interpretation]
    rows:
      - ["EBITDA and margin", "Rs 2,342m / 28.0%; Rs 2,622m / 25.7%; Rs 3,214m / 22.2%", "FY24 / FY25 / FY26, respectively", "EBITDA margin contracted; it is not gross margin."]
      - ["Operating cash flow", "Volatile across FY24-FY26; negative operating cash flows also flagged historically without amounts", "Motilal Oswal summary and Anand Rathi IPO risk disclosure", "No annual cash-flow amounts or current cash-burn rate are provided here."]
      - ["IPO offer", "Rs 9,400m total; Rs 2,000m fresh issue; Rs 7,400m OFS", "August 2026 offer", "Only fresh-issue proceeds are company funding; OFS is seller proceeds."]
      - ["IPO listing", "Business Today reported about Rs 940 crore raised; issue price Rs 807 and debut at Rs 980", "August 2026", "Total raise does not establish post-IPO cash available."]
      - ["Fresh-issue uses", "R&D facility / Center of Excellence, plant and equipment, and general corporate purposes", "Offer objects; later CEO interview also cited manufacturing automation", "Planned uses are not evidence of completed capex or net cash retained."]
      - ["Gross margin by product or assay", "Not disclosed in retained sources", "No product-level cost or margin schedule", "Cannot quantify gross-profit path from revenue mix alone."]
      - ["Post-listing liquidity and runway", "Current cash, debt maturities, monthly burn, and runway not established", "No current balance-sheet / cash-flow bridge in assigned sources", "Request an interim balance sheet, debt schedule, and cash-flow forecast."]
    notes: EBITDA, accounting profit, operating cash flow, and cash available are different measures. The IPO total includes OFS; the fresh issue is not a current cash balance and planned capex is not completed spend.
    claimRefs: [CI005, CI006, CI010, CI011, CI012]
