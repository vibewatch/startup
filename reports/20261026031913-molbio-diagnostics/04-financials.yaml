    title: Device-to-consumables revenue model
    type: flow
    summary: Device placements create a channel for repeat test-kit sales, but the retained sources do not quantify product-level gross profit or cash conversion.
    data:
      nodes:
        - id: buyer-channel
          label: Public-health programs, hospitals, and laboratories
          detail: Buyer groups described in analyst research; payer concentration remains high.
        - id: device-sale
          label: Truenat device sale
          detail: Equipment revenue is reported separately from test-kit revenue.
        - id: installed-base
          label: Installed device base
          detail: Enables point-of-care testing; utilization per device is not disclosed here.
        - id: test-kit
          label: Disease-specific test kits
          detail: Proprietary consumables support repeat purchases.
        - id: revenue
          label: Reported device and kit revenue
          detail: FY26 line-item values are shown in the revenue table.
        - id: economics-gap
          label: Product gross profit and cash conversion
          detail: Not inferred because product costs, realized prices, and working-capital values are incomplete.
    claimRefs: [CI001]
