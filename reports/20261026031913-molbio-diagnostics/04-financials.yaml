      missingEvidence: Gross margin by device and assay, kit manufacturing cost, device utilization and lifetime, service and warranty cost, and revenue-recognition policy by stream.
      whyItMatters: Revenue growth and consumables mix do not establish gross profit, customer-level economics, or conversion to cash.
      diligencePath: Request product-level contribution schedules, utilization cohorts, cost allocations, warranty/service data, and the accounting policy for each revenue stream.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: material
      topic: post-IPO-liquidity
      missingEvidence: Current post-listing cash, gross debt and maturities, operating cash-flow bridge, monthly burn, working-capital needs, net IPO proceeds, and remaining planned capex.
      whyItMatters: The gross IPO amount includes an OFS component and stated capex plans; neither determines cash available, financing dependency, or runway.
      diligencePath: Request the latest interim balance sheet and cash-flow statement, debt schedule, net-proceeds reconciliation, receivables and inventory aging, and a board-approved liquidity forecast.
      relatedQuestionRefs: [QI006, QI007]
      relatedTableRefs: [TI003]
