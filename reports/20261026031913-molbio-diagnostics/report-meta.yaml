summary:
  headline: >-
    Truenat's installed base and FY26 growth support a credible diagnostics platform, but demand concentration,
    cash-conversion uncertainty, and public-market pricing risk keep the recommendation at Track.
  overallScore: 6.8
  recommendation: track
  confidence: medium
