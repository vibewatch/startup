  topStrengths:
    - >-
      Molbio reports more than 12,500 Truenat devices installed across 90+ countries, with 43 assays covering 30
      diseases.
    - >-
      FY26 consolidated revenue from operations grew 41.7% year over year, and broker analysis attributes a substantial
      share to recurring test kits.
    - >-
      FY26 device and test-kit utilization leaves reported capacity headroom for growth, although active utilization and
      reorder behavior remain unverified.
  topRisks:
    - Government and aid-agency buyers, top customers, and TB kits each represent concentrated FY26 revenue exposure.
    - >-
      EBITDA margins declined through FY24-FY26 and operating cash flow is described as volatile due to working capital,
      receivables, and inventory.
    - >-
      IPO and public-market multiples imply meaningful valuation risk, while current share count, net debt, and the
      valuation bridge are not reconciled.
    - >-
      Customer-level utilization, renewal rates, assay-level pricing, gross margins, and service outcomes are not
      publicly established in the retained evidence.
  unresolvedGaps:
    - >-
      Current market capitalization, diluted share count, net debt, and forward-earnings inputs need reconciliation to a
      live public-market valuation.
    - >-
      Country-, program-, customer-, and assay-level concentration, active device utilization, and repeat kit orders
      remain undisclosed.
    - Current cash, working-capital conversion, debt maturities, and liquidity after IPO costs are not established.
    - Gross margin and realized pricing by assay and product category are not public in the assigned evidence.
    - >-
      Current India TB molecular test volumes, procurement budgets, and a contractable India/TB SAM or Molbio SOM are
      not established.
    - Headcount and management-bench depth remain insufficiently disclosed for operating-leverage analysis.
