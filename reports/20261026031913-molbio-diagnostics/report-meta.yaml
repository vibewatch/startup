companyProfile:
  summary: >-
    Molbio Diagnostics is a Goa-based public diagnostics company whose core business combines portable Truenat molecular
    PCR instruments with disease-specific test kits. Its disclosed operating footprint spans government health programs,
    hospitals, diagnostic laboratories, and international healthcare organizations; the public record supports product
    and revenue scale but does not disclose customer-level utilization or contract economics.
  headquarters: Goa, India
  productSummary: >-
    Truenat is a portable, battery-operated molecular PCR platform with disease-specific test kits; the company reports
    43 assays covering 30 diseases. Molbio also has radiology, digital pathology, and breast-health activities through
    subsidiaries and partnerships.
  customerFocus: >-
    Government health programs, hospitals, diagnostic laboratories, and international healthcare organizations,
    including providers serving resource-limited settings.
  businessModel: >-
    Device placements support recurring sales of proprietary disease-specific test kits; the public evidence does not
    quantify recurring-revenue share, utilization per device, or customer retention.
  stage: Publicly listed following its August 2026 IPO.
  fundingStatus: >-
    The August 2026 IPO included approximately ₹200 crore of fresh issue proceeds for the company and approximately ₹740
    crore of offer-for-sale shares sold by existing holders; cumulative lifetime capital raised is not established.
