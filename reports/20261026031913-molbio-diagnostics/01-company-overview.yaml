company:
  name: Molbio Diagnostics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Molbio is a Goa-based point-of-care molecular diagnostics business built around
    its Truenat device-and-assay platform, with a reported 2026 listing and an
    operating history spanning technology development, public-health collaborations
    and acquisitions. Public disclosures establish core leadership, IPO structure
    and selected FY26 scale metrics, while current customer count, market value and
    cumulative capital raised remain unverified in the assigned evidence.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      Molbio Diagnostics Limited was incorporated in 2000 and is headquartered in
      Goa. The business develops and commercializes point-of-care molecular
      diagnostics, with Truenat as its portable PCR platform and disease-specific
      assays or test kits as the associated consumable. Company and broker
      descriptions place the system in resource-limited and near-patient settings
      and cover infectious and non-communicable disease testing. This device-plus-
      consumables description is a product model, not a disclosed recurring-revenue
      percentage. Geojit's IPO note reports FY26 consolidated Sales separately
      from The Economic Times' FY25 revenue-from-operations figure; the different
      metric labels and fiscal periods are retained rather than normalized.
    claimRefs: [CO001, CO009, CO010, CO011]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The latest assigned leadership disclosures identify Sriram Natarajan as
      executive director and CEO, Dr. Chandrasekhar Bhaskaran Nair as executive
      director and CTO, and Sangeetha Sriram as executive director and director of
      operations. The RHP and Geojit research note also describe three independent
      directors. This documents named functional coverage and formal board
      independence; it does not establish succession depth, retention arrangements,
      or the degree to which product development and commercial execution depend
      on particular individuals. Those matters remain unquantified in the retained
      evidence.
    claimRefs: [CO013, CO014]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital and stakeholders
    body: >-
      The August 2026 IPO comprised a ₹200 crore fresh issue and a ₹739.70 crore
      offer for sale, for a reported total issue of about ₹939.70 crore. The fresh
      issue was designated for an R&D facility and Centre of Excellence and for
      manufacturing equipment; the OFS component represented sales by existing
      holders, not proceeds available to Molbio. A May 2024 Moneycontrol report
      separately described an approximately ₹680 crore 2022 financing and an
      anonymously sourced proposed valuation target for a then-planned IPO. That
      historical target is not the IPO's realized valuation or a current public
      market value, and the reported financing does not establish cumulative funds
      raised or cash on hand.
    claimRefs: [CO012, CO015]
    tableRefs: [TO003]
  - id: milestones-and-risk
    title: Milestones, concentration and evidence limits
    body: >-
      The dated record traces a company-reported Molbio–Bigtec technology
      combination, WHO-recognized Truenat assays, international public-health
      collaboration, portfolio acquisitions and the 2026 listing. Company heritage
      material is the source for several historical milestones; the Global Fund
      announcement and Business Today coverage provide external corroboration for
      selected events. Geojit's August 2026 IPO note flags that government and aid
      agency contracts contributed about 85% of FY26 revenue and TB diagnostic
      kits about 70% of FY26 revenue. These are source-reported concentration
      measures, not independently reconciled customer-level data. The assigned
      sources do not provide a dated current customer count or post-listing market
      capitalization.
    claimRefs: [CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO016]
    figureRefs: [FO001]
