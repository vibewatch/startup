  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              CuspAI's product is described as an industrial materials-discovery service rather than a standalone model.
              The July 2026 launch announcement says MIRA enables partners to run a full cycle from generative materials
              design through simulation, synthesis-route planning, and coordinated experimental validation (CE003). The
              company-issued description connects the workflow to a network of compute, data, laboratories, and
              scientific expertise, while the independent New Market Pitch assessment characterizes the customer job as
              specifying desired material properties and using AI to narrow which chemical structures merit laboratory
              development (CE005). This is a credible workflow-level definition, but public sources do not establish
              whether customers primarily buy subscriptions, bespoke research, royalties, or a bundled service, and
              participation in the Foundry does not prove a paying production deployment.
            claimRefs:
