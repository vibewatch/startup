              - CP016
      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              No assigned source publishes comparable CuspAI, Orbital, Materials Zone, Aionics, or DeepVerse price
              cards, contract values, gross margins, or implementation fees. The pricing comparison therefore separates
              public list-price evidence from unknown enterprise packaging rather than treating funding or valuation as
              product pricing. CuspAI may create switching friction through private data, accumulated experiment
              outcomes, partner-specific workflows, and access to a coordinated laboratory network; its own account says
              validated experimental results feed back into the system and that partner data is protected in private
              instances. That is a plausible mechanism, not proof of lock-in: the same source does not disclose
              exclusivity duration, portability, renewal terms, or whether customers can reproduce the workflow with
              internal tools. The principal displacement risk is that open models, incumbents, or better-funded
              laboratories narrow the integration advantage; Chemical & Engineering News notes that Google and
              Microsoft, startups such as Materials Nexus, and large chemical firms are also pursuing AI-enabled
              materials discovery.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Competitive verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              CuspAI appears differentiated on breadth of orchestration and partner access, not on a publicly proven
              price or outcome benchmark. The strongest evidence is the multi-party Foundry architecture and the
              reported six-month cycle that screened 300 trillion molecular structures and delivered twenty validated
              novel candidates for one customer; this remains a company-issued performance claim, so it should not be
              generalized to all programmes. The main adverse evidence is category-wide: Chemical & Engineering News
              reports that models struggle with stability and manufacturability, standardized data is difficult, robotic
              experimentation is still developing, and commercialization can take years even after a promising
              prediction. Underwriting should therefore test whether Foundry participation produces repeatable
              production deployments, measurable customer value, exclusive data rights, and renewal or expansion
              economics that peers cannot match.
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is the disclosed wedge
            body: >-
              CuspAI’s strongest differentiator is the combination of private data, agentic design, simulation,
              synthesis planning, and a distributed lab network rather than a single model feature.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Integration is not yet proven as lock-in
            body: >-
              Public sources do not disclose pricing, renewal, portability, data-rights exclusivity, or repeatable
              production outcomes, while independent reporting highlights manufacturability and commercialization
              hurdles.
            calloutType: risk
            claimRefs:
