              - CO007
              - CO008
              - CO009
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is founder-led. Chad Edwards is identified as chief executive and Max
              Welling as chief technology officer, combining commercial leadership with Welling's academic and
              machine-learning background. The company has also recruited experienced external operators: former Apple
              and Google executive John Giannandrea is coordinating the build-out of United States foundry operations,
              while AMD director and Lam Research chair Abhi Talwalkar has joined the advisory board. These names
              strengthen functional coverage and industrial access, but an advisory role is not equivalent to board
              oversight. Public sources in the assigned pool do not establish the legal board, voting control, founder
              vesting, or succession arrangements, leaving key-person and governance exposure open.
