      - number: '4.2'
        title: Pricing, delivery costs, and unit economics
        blocks:
          - type: paragraph
            body: >
              No public source in the assigned pool provides a CuspAI price list, contract value, realized revenue per
              customer, gross margin, customer-acquisition cost, sales cycle, payback period, or retention. Official and
              independent descriptions instead expose the cost drivers: proprietary model and data development,
              high-performance compute, scientific staff, synthesis infrastructure, and laboratory validation. The
              workflow may become more scalable when software narrows experimental search spaces, but physical
              validation and customer-specific scientific work can keep delivery costs material. A buyer could pay for
              access to MIRA, a defined research engagement, or downstream rights; these structures have different
              margin and revenue-recognition implications. Accordingly, a SaaS-style ARR assumption would be
              unsupported. Underwriting should separate recurring software fees from project revenue and any contingent
              licensing, and should require cohort-level economics before treating technical throughput as financial
              traction.
            claimRefs:
