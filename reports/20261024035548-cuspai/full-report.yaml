  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and traction
        blocks:
          - type: paragraph
            body: >
              CuspAI's disclosed offering combines the MIRA platform with an AI Materials Foundry that coordinates data,
              compute, laboratories, synthesis planning, and experimental validation. Public descriptions support a
              customer-led research workflow: an industrial partner specifies desired material properties, CuspAI
              generates and screens candidates, and physical facilities test the shortlist. That mechanism can support
              platform subscriptions, bespoke research programs, usage-based compute or laboratory fees, and eventual
              licensing or royalties, but no retained source discloses the actual mix. The more than 45 founding members
              are strategically meaningful, yet membership is not the same as paid revenue. The strongest public
              traction is a Kemira project that screened about 300 trillion structures and narrowed more than 5,000
              designs to roughly 20 candidates; the candidates were still moving into further development and testing.
              Revenue quality, contracted backlog, renewal behavior, and conversion from pilot to production remain
              unverified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
