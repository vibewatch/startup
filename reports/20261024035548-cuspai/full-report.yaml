  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >
              CuspAI's relevant market is narrower than "AI for science" or the entire materials economy. The evidence
              supports a workflow market spanning materials data, molecular or atomistic simulation, candidate
              screening, synthesis planning, laboratory validation, and the surrounding workflow software. CuspAI
              describes the Foundry as a network of data, labs, compute, and scientific expertise, while MIRA
              coordinates the cycle from generative design through simulation, synthesis-route planning, and
              experimental validation. The included spend is therefore enterprise R&D software, compute, data access,
              scientific services, and laboratory execution used to discover or optimize materials. Excluded are
              downstream material sales, general-purpose cloud infrastructure sold without a materials workflow, and the
              full cost of manufacturing products that use a discovered material. The status quo is fragmented internal
              R&D: scientists combine databases, computational chemistry, specialist software, contract laboratories,
              and physical experiments, often with long iteration cycles. FutureMarkets reports that traditional
              materials development can take 10–20 years from concept to commercialization, while materials-informatics
              methods may compress that to 2–5 years, but that claim is an analyst-market-data estimate rather than a
              CuspAI result.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >
              The public evidence provides multiple lenses but not a defensible single TAM/SAM/SOM number for CuspAI. A
              paid FutureMarkets report describes materials informatics as a market covering software platforms,
              computational materials science, high-throughput experimentation, autonomous laboratories, data
              infrastructure, and services, and forecasts the sector from 2025 to 2035; the accessible text does not
              expose the underlying market-value series. Its segmentation indicates that battery materials are
              approximately 30% of market value, advanced polymers 20%, catalysts 15%, and alloys 12%, but those
              percentages are not independently corroborated here. A second lens is buyer pain and budget: the U.S.
              Department of Commerce awarded SandboxAQ $500 million for an AI-enabled materials-discovery platform
              focused on semiconductor bottlenecks and supply-chain risks. A third lens is workflow throughput:
              Microsoft reports screening roughly 30 million candidate materials to approximately 20 candidates in about
              one week in a specific battery-materials case. These lenses establish an addressable workflow and buyer
              urgency, not CuspAI revenue opportunity. The missing bridge is the portion of enterprise R&D budgets
              CuspAI can serve, its pricing and take rate, and the share of projects that progress from pilot to
              production.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM018
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >
              The likely economic buyer is an industrial R&D, materials, process-development, or strategic-technology
              function that owns a high-value bottleneck; users include materials scientists, computational chemists,
              process engineers, and laboratory teams; the payer may be a central innovation budget, a business-unit R&D
              budget, or a public-sector program. CuspAI's Foundry partner list spans semiconductors, energy, chemicals,
              automotive, electronics, and advanced manufacturing, and the company says partners can specify target
              properties and use private Foundry instances. The adoption path is consequently project-led: define a
              constrained materials problem, screen a large candidate space, validate a small candidate set, and
              integrate a successful material into an existing product or process. Microsoft's case shows the
              operational shape of this path, moving from approximately 30 million candidates to about 20 lab-worthy
              candidates after AI, physics-based, and practical filters. The evidence does not establish contract sizes,
              buyer payback periods, renewal rates, or whether Foundry members are paying customers versus ecosystem
              participants.
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >
              Demand is driven by materials bottlenecks in semiconductor manufacturing, clean energy, advanced
              manufacturing, batteries, catalysts, and other sectors where a better material can alter performance,
              resilience, or sustainability. The NIST announcement illustrates public funding for alternatives to PFAS,
              rare-earth-free magnets, catalysts, and battery chemistries, showing that materials discovery can be tied
              to national-security and supply-chain budgets. CuspAI and independent coverage also point to a
              demonstrated Kemira program that screened 300 trillion molecular structures and delivered 20 validated
              candidates in six months; that is a company-associated proof point, not an independent benchmark.
              Constraints are equally material: data quality and standardization, scarce multidisciplinary expertise,
              high implementation costs, experimental validation, manufacturing scale-up, confidentiality, and uncertain
              return on investment. FutureMarkets explicitly identifies data quality, standardization, expertise
              barriers, and upfront implementation costs as challenges. For valuation, the market can support a large
              strategic narrative, but public evidence does not yet convert the narrative into recurring revenue, gross
              margin, customer concentration, or pilot-to-production economics.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic demand is clearer than monetization
            body: >-
              Public programs, industrial partners, and workflow case studies support a real materials-discovery demand
              signal. They do not establish CuspAI's pricing, recurring revenue, or conversion economics, so the market
              supports strategic relevance more strongly than a precise valuation conclusion.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM018
          - type: callout
            title: Market-size precision is unavailable
            body: >-
              The accessible category forecast is paywalled and does not expose its numeric value series, while
              CuspAI-specific SAM, SOM, and payer data are private. Any precise market share or revenue-derived
              valuation should therefore remain an explicit diligence gap.
            calloutType: risk
            claimRefs:
              - CM007
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and category boundaries
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than AI model vendors. Buyers can choose an integrated discovery
              partner such as CuspAI, an AI-native materials company such as Orbital Materials, a workflow and
              data-management platform such as Materials Zone, a formulation or electrolyte specialist such as Aionics,
              a theory-guided platform with lab automation such as DeepVerse, or an internal build combining scientists,
              simulation software, data engineering, and laboratory automation. Startus Insights identifies 449
              materials-informatics startups and highlights Polaron, AI Materia, DeepVerse, Aionics, and other
              specialized providers, which supports a fragmented category rather than a single peer set. Current
              company, partner, and independent materials describe more than 45 Foundry members and a combination of
              data, labs, compute, and scientific expertise, positioning CuspAI as orchestration infrastructure rather
              than only a model.
