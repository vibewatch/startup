  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Paid Foundry deployments scale; repeatable revenue, margin, and validated product outcomes become
          independently measurable.
        - Current $2.6B mark becomes supportable only if growth and economics justify a premium platform multiple.
        - Upside exists but is unproven from public evidence.
        - No independent proof of paid conversion or manufacturable outcomes.
      - - Base
        - Technical and partner progress continues while revenue quality, burn, and terms remain undisclosed.
        - Track; seek a lower-risk entry, stronger information rights, or a price reset.
        - Most consistent with the current evidence set.
        - Continued financing-led narrative without operating disclosure.
      - - Bear
        - Commercial conversion lags and physical scale-up, cost, regulation, or coordination constrain deployment.
        - Down-round or preference-adjusted investor returns become plausible; no precise target is supportable.
        - Material risk, not a forecast.
        - Failed pilots, delayed production, customer concentration, or cash runway compression.
      - - Diligence gate
        - Cap table, contracts, revenue, margin, burn, and pilot conversion are supplied and verified.
        - Re-score valuation only after denominator and downside terms are known.
        - Required before upgrading recommendation.
        - Missing evidence persists at next review.
    notes: >-
      Scenarios are qualitative because public evidence does not provide a reliable revenue, margin, burn, or preference
      denominator; ranges and return percentages would be false precision.
