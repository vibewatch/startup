        title: Financing, valuation, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              CuspAI's financing trajectory has been unusually rapid. Reporting describes a $30 million seed round in
              June 2024, a Series A of more than $100 million in September 2025, and a $450 million Series B on 20 July
              2026 co-led by Kleiner Perkins and NEA. The latest round carried a reported $2.6 billion valuation,
