      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              CuspAI’s disclosed product scope covers generative design, property simulation, synthesis-route planning,
              and coordinated experimental validation through MIRA, with partner data held in private Foundry instances.
              The announced network includes NVIDIA compute, Meta’s UMA, public research laboratories, data partners,
              and industrial members; that combination can reduce the coordination burden for a buyer that needs a full
              design-build-test loop, but the evidence is largely company- or partner-issued and does not quantify
              conversion, retention, or realized customer economics. Orbital provides a useful counterpoint: Chemical &
              Engineering News describes an AI model, an in-house laboratory, and a goal of working with large firms for
              scale-up, while also reporting that stability and manufacturability remain difficult prediction problems
              and that AI is best used with human chemistry expertise. Materials Zone addresses structured R&D and
              manufacturing data, but its release is competitor-issued and predates CuspAI’s current Foundry; it is not
              an independent benchmark of current capability.
            claimRefs:
