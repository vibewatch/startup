      - number: '5.2'
        title: Maturity and technical proof
        blocks:
          - type: paragraph
            body: >-
              The most concrete maturity signal is the Kemira collaboration, which is partner-issued rather than an
              independent benchmark. Kemira reports that the project searched approximately 300 trillion structures,
              generated more than 5,000 designs with property data for GenX, PFBS, and PFOS, narrowed them to
              approximately 20 priority candidates, and reached that stage in six months (CE006). The same source says
              the candidates were moving into further development and testing, so the evidence supports accelerated
              discovery-stage throughput, not validated field performance or commercial production. The independent
              assessment reaches the same boundary: the research result is substantial, but commercial performance,
              manufacturing economics, and long-term reliability were not established publicly (CE007). Meta's UMA
              research illustrates the kind of external atomistic-model capability available in the ecosystem, but it is
              not evidence that CuspAI's MIRA achieves the same measured performance (CE008).
            claimRefs:
              - CE006
              - CE007
              - CE008
