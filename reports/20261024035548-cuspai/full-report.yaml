chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              CuspAI was founded in 2024 by Chad Edwards and Max Welling and is headquartered in Cambridge, United
              Kingdom. Its product proposition is inverse materials design: users define desired physical or chemical
              properties, while the company applies generative AI and molecular simulation to identify candidates worth
              testing. MIRA is described as the orchestration layer connecting generative design, simulation, synthesis
              route planning, and coordinated experimental validation. That makes CuspAI more than a model vendor in its
              own account, but the breadth of the claimed workflow should not be confused with evidence that each stage
              is already repeatable at commercial scale. The snapshot below separates disclosed facts from private
              metrics that remain unavailable.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
