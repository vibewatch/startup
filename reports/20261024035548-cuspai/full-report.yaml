      - number: '1.4'
        title: Scale signals and unresolved commercial proof
        blocks:
          - type: paragraph
            body: >-
              The AI Materials Foundry launched with more than 45 founding organizations, and CuspAI has expanded beyond
              Cambridge into Amsterdam, Berlin, Tokyo, Singapore, and the United States. Those facts indicate reach,
              infrastructure access, and partner interest, but not a disclosed customer base. The strongest skeptical
