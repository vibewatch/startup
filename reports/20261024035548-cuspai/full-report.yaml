      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >
              The July 2026 Series B is reported at $450 million and a $2.6 billion valuation, following a Series A of
              more than $100 million; one retained source reports total capital raised above $650 million. That
              financing gives CuspAI meaningful capacity to fund international expansion, compute, scientific hiring,
              and laboratory partnerships, but financing raised is not cash available and does not reveal burn or
              runway. The Companies House record shows the last accounts were made up to 31 March 2025 and the next
              accounts were due by 31 December 2026, so current cash, liabilities, and operating results are not visible
              in the assigned public record. An adverse valuation review says revenue and profitability remain
              undisclosed and that the $2.6 billion price is an aggressive bet on future commercial success. The
              financial verdict is therefore track rather than underwrite: capital adequacy appears stronger than the
              evidence on revenue quality, margin path, and deployment economics.
