      - number: '5.3'
        title: Differentiation, dependencies, and controls
        blocks:
          - type: paragraph
            body: >-
              CuspAI's claimed differentiation is the integration of generative design with industrial data access,
              compute, simulation, synthesis planning, and physical validation. The Foundry announcement names NVIDIA as
              a compute provider and Meta's Fundamental AI Research team as the developer of UMA, making external
              compute and model relationships material dependencies (CE003). Public practitioner material also shows
              that adjacent open tooling can generate constrained inorganic structures and evaluate them with
              machine-learning force fields, while explicitly warning that density-functional-theory confirmation is
              more reliable in less common chemical systems (CE009). This creates a diligence question around validation
              cost, model error, transfer to customer-specific chemistries, and dependence on partner infrastructure.
              The reviewed pool does not provide a CuspAI security page, incident history, privacy controls,
              certification, or service-level reliability record; these are evidence gaps, not evidence of an incident
              or control failure.
            claimRefs:
              - CE003
              - CE009
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Discovery workflow has an industrial proof point
            body: >-
              The Kemira project gives CuspAI a specific partner-defined brief, a quantified search space, a six-month
              discovery interval, and a narrowed candidate set; it is stronger than a generic claim that AI can design
              materials, while still stopping before production validation.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: The public evidence stops before production
            body: >-
              The key materials case remains in development and testing, and public sources do not disclose
              customer-specific reliability, manufacturing economics, security controls, or repeatable production
              outcomes.
            calloutType: risk
            claimRefs:
              - CE007
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              CuspAI's customer surface is enterprise and institution-led rather than self-serve. The AI Materials
              Foundry is described as a network of more than 45 organizations spanning semiconductors, clean energy,
              advanced manufacturing, automotive, chemicals, laboratories, compute and public-sector research. The buyer
              is therefore likely an industrial R&D or innovation function, while the users include materials
              scientists, process engineers, laboratory operators and computational researchers; the payer, contract
              owner and economic beneficiary may differ. Hyundai's November 2025 announcement gives the clearest
              customer-shaped proof: it says the parties signed a strategic partnership agreement to accelerate
              innovative materials and improve the efficiency, durability and stability of future mobility materials.
              The announcement does not disclose contract value, paid status, deployment scope or production milestone.
              Independent coverage names solar-materials companies Caelux and Oxford PV, chemicals company Kemira and
              semiconductor suppliers among the network, but a founding-member logo is not equivalent to an active paid
              account.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU008
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signal is a Kemira project reported by CuspAI's Foundry announcement and
              repeated by independent pv magazine coverage: the system screened up to 300 trillion molecular structures,
              produced 20 candidates for further testing and validation, and completed the process in six months rather
              than the customer's prior multi-year process. This is a meaningful workflow outcome, but it remains a
              discovery and validation milestone rather than evidence that a material reached commercial production.
              A*STAR is described as a new multi-year partnership covering semiconductors, carbon capture and advanced
              electronics, while Hyundai's partnership is framed as a collaboration framework across multiple domains.
              These relationships show access to serious industrial and public-sector users, but the sources do not
              provide active-user counts, repeat-purchase data, renewal rates, utilization, revenue per account or
              pilot-to-production conversion. The customer funnel should therefore be read as partner access -> defined
              technical problem -> computational screening -> physical testing -> production adoption, with the last
              stages still unverified in public evidence.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU016
      - number: '6.3'
        title: Durability, expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              CuspAI's expansion logic is potentially attractive because one platform can serve distinct materials
              problems while partner data is kept in private Foundry instances. The public materials describe
              customer-defined properties, model-generated candidates, synthesis routing and feedback from experimental
              results, which could create a recurring workflow if customers continue through validation and
              manufacturing. However, no source in the assigned pool discloses net revenue retention, gross retention,
              churn, renewal, contract length, customer concentration by revenue, or the share of Foundry members that
              pay. The adverse source explicitly warns that the membership list says little about current revenue and
              that commercial performance and long-term reliability remain unestablished. Concentration risk is
              consequently two-sided: a small number of flagship industrial programs could drive proof and distribution,
              but could also make revenue, roadmap and referenceability dependent on a few slow procurement processes.
              Simplify's independent company profile reinforces that concern by warning that paid contracts, rather than
              partner logos, determine MIRA's value and that semiconductor procurement and validation can be slow.
              Diligence should require a cohort-level customer schedule separating paid software, research services,
              partner contributions and unpaid ecosystem participation.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Industrial workflow proof is stronger than logo proof
            body: >-
              The Kemira screening result and Hyundai strategic partnership provide more decision-useful evidence than
              the Foundry's membership count alone, because they connect CuspAI to a defined technical workflow and an
              identified industrial user.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Retention and monetization remain unverified
            body: >-
              Public sources do not establish paid-customer count, recurring revenue, renewal, churn, production
              deployment or concentration, so customer durability cannot yet support a financial underwriting case.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              CuspAI's public proposition spans industrial materials design, scientific data, computing and physical
              validation. The evidence does not identify a CuspAI-specific enforcement action or license failure, but it
              does establish obligations that become material if the platform processes personal data, supports
              regulated chemical work, or relies on controlled computing infrastructure. The UK Information
              Commissioner's Office states that the UK GDPR security principle requires appropriate technical and
              organisational measures, including confidentiality, integrity and availability, timely restoration after
              incidents, and regular testing. That is a concrete control baseline for any Foundry data flows involving
              personal data, yet CuspAI's public materials do not disclose its data-processing roles, certifications,
              incident history or processor controls. Separately, UK REACH requires account-based processes for
              substance registration, notifications, transfers, joint registrations and research-and-development
              notifications; the public record does not establish which CuspAI or partner activities fall within those
              pathways. The Federal Register records a January 15, 2026 Bureau of Industry and Security rule revising
              controls for advanced computing commodities and semiconductor-related end uses. CuspAI's reported
              dependence on NVIDIA compute and semiconductor-focused partners makes export-control screening a diligence
              item, not proof of non-compliance. The legal risk is therefore conditional but potentially high-impact: a
              missed obligation could delay experiments, restrict compute access, or expose partner data and
              intellectual property.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, quality and security dependencies
        blocks:
          - type: paragraph
            body: >-
              The AI Materials Foundry is designed as a network rather than a vertically integrated laboratory. Public
              descriptions place CuspAI's MIRA platform between generative design, simulation, synthesis planning and
              experimental validation, with more than 45 founding organisations and external compute and laboratory
              capabilities. That architecture can accelerate throughput, but it also creates failure points at handoffs:
              a model candidate may be stable in simulation yet fail synthesis, a partner laboratory may lack capacity
              or reproducibility, or confidential datasets may be exposed across private instances and processors.
              Independent coverage says the Kemira work screened approximately 300 trillion structures and narrowed more
              than 5,000 designs to around 20 candidates in six months, but also says the candidates were still in
              development and testing and that production economics and long-term reliability were not publicly
              established. The strongest operational control is therefore a staged validation process, not the volume of
              generated candidates. A risk committee should monitor candidate-to-synthesis conversion, reproducibility,
              cycle time, partner capacity, data-access exceptions and production qualification. Until those
              denominators and controls are disclosed, residual exposure remains material even without a recorded outage
              or breach.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
              - CR012
      - number: '7.3'
        title: Partner, financial and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              CuspAI's financing provides substantial reported capital, but funding raised is not the same as cash
              available for operations, and no public source in the assigned pool discloses burn, runway, revenue,
              margin or contract value. The July 2026 round was reported as $450 million at a $2.6 billion valuation,
              while the Foundry's 45-plus members include compute providers, model developers, manufacturers and
              research organisations. Those facts support strategic reach but do not prove that members are paying
              customers or that contracts are recurring, profitable or diversified. A partner failure, change in compute
              access, loss of a key dataset licence, customer concentration or inability to move a candidate into
              production could therefore impair both growth and valuation. The thesis should break if CuspAI cannot show
              repeatable paid deployments, disclosed conversion from candidate to validated production material, or
              sufficient independent compute and laboratory capacity. Financial diligence should obtain the cash
              balance, monthly burn, runway, contract backlog, gross margin by work type, customer concentration,
              renewal terms, dataset rights and financing preferences before treating the headline valuation as
              investable evidence.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              The highest-priority trigger is a failure to convert the Foundry's candidate-generation scale into
              repeatable, paid production deployments with independently reproducible outcomes. Partner count, funding
              and model throughput should not be treated as substitutes for that evidence.
            calloutType: risk
            claimRefs:
              - CR006
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              CuspAI merits continued attention rather than a buy call. Multiple independent reports place the July 2026
              Series B at $450 million and $2.6 billion, while Dealroom records the prior $100 million Series A at a
              $520 million valuation. That implies a roughly fivefold valuation increase in about nine months, a
              material underwriting hurdle even before dilution, liquidation preferences, or secondary terms are known.
              The public record supports strategic momentum: CuspAI launched the AI Materials Foundry with more than 45
              founding organizations, and reported a Kemira project that screened 300 trillion molecular structures and
              produced 20 validated candidates in six months. Those are promising proof points, but they are not
              revenue, gross profit, renewal, or cash-conversion evidence. A price-sensitive investor should therefore
              track until management provides booked contract value, recurring versus project revenue, gross margin,
              burn, runway, cap-table terms, and customer conversion data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              The bull case is that CuspAI is building a scarce intelligence layer for physical R&D: its MIRA platform
              is described as spanning generation, simulation, synthesis planning, and experimental validation, while
              partners contribute data, compute, laboratories, and domain expertise. NEA's follow-on rationale
              emphasizes customer progress and a partnership-driven, capex-light model. The anti-thesis is that public
              disclosures remain dominated by company, investor, partner, and syndicated financing narratives; they do
              not establish customer-level economics or manufacturing scale. A critical commentary explicitly warns that
              discovery is only one step and that production scaling, cost-effectiveness, regulatory hurdles, and
              coordination across dozens of participants could undermine the thesis. Schrödinger provides a public
              reference point at a $1.78 billion October 2026 market capitalization, but it is not a direct valuation
              multiple comparable because CuspAI's revenue and business mix are undisclosed. The comparable set is
              therefore directional, not a basis for a precise target price.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
      - number: '8.3'
        title: Scenarios, downside triggers, and diligence
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should be milestone-based rather than a false-precision discounted cash flow. In
              the bull case, independently verified paid deployments convert Foundry participation into repeatable
              high-margin revenue and the current valuation becomes supportable through growth. In the base case,
              technical progress continues but commercial conversion and unit economics remain opaque, supporting a
              track decision and a requirement for a lower-risk entry or stronger information rights. In the bear case,
              the valuation discounts years of commercialization before manufacturing, validation, and partner
              coordination are proven; a down round, preference overhang, or delayed customer conversion becomes
              plausible. The next diligence round should obtain the cap table and preference stack, signed contracts and
              backlog, revenue by customer and recurring status, gross margin by offering, burn and runway,
              pilot-to-production conversion, concentration, IP and data rights, and evidence that validated candidates
              reach manufacturable products.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The financing mark is credible as a reported transaction price, but public evidence is insufficient to
              establish that it is supported by recurring economics or downside-protective terms.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV011
          - type: callout
            title: The missing denominator is the core risk
            body: >-
              Without revenue quality, margin, burn, runway, customer concentration, and preference data, a precise
              valuation target would overstate what the public record can support.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
