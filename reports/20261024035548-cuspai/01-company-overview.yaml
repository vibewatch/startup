callouts:
  - calloutType: risk
    title: Ecosystem scale is not revenue proof
    body: >-
      More than 45 founding members demonstrate strategic reach, but public
      sources do not establish how many pay CuspAI, what they spend, or whether
      participation produces recurring revenue.
    claimRefs: [CO015, CO016]
