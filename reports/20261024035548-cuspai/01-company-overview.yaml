company:
  name: CuspAI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    CuspAI is a Cambridge-headquartered materials-discovery company founded in
    2024 whose MIRA platform connects generative design, simulation, synthesis
    planning, and experimental validation. A July 2026 Series B supplied $450
    million at a reported $2.6 billion valuation, but public evidence still does
    not disclose revenue, profitability, paying-customer count, or customer spend.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      CuspAI was founded in 2024 by Chad Edwards and Max Welling and is
      headquartered in Cambridge, United Kingdom. Its product proposition is
      inverse materials design: users define desired physical or chemical
      properties, while the company applies generative AI and molecular
      simulation to identify candidates worth testing. MIRA is described as the
      orchestration layer connecting generative design, simulation, synthesis
      route planning, and coordinated experimental validation. That makes CuspAI
      more than a model vendor in its own account, but the breadth of the claimed
      workflow should not be confused with evidence that each stage is already
      repeatable at commercial scale. The snapshot below separates disclosed
      facts from private metrics that remain unavailable.
    claimRefs: [CO001, CO002, CO003, CO004, CO015, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The public leadership picture is founder-led. Chad Edwards is identified
      as chief executive and Max Welling as chief technology officer, combining
      commercial leadership with Welling's academic and machine-learning
      background. The company has also recruited experienced external operators:
      former Apple and Google executive John Giannandrea is coordinating the
      build-out of United States foundry operations, while AMD director and Lam
      Research chair Abhi Talwalkar has joined the advisory board. These names
      strengthen functional coverage and industrial access, but an advisory role
      is not equivalent to board oversight. Public sources in the assigned pool
      do not establish the legal board, voting control, founder vesting, or
      succession arrangements, leaving key-person and governance exposure open.
    claimRefs: [CO001, CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing, valuation, and stakeholder structure
    body: >-
      CuspAI's financing trajectory has been unusually rapid. Reporting describes
      a $30 million seed round in June 2024, a Series A of more than $100 million
      in September 2025, and a $450 million Series B on 20 July 2026 co-led by
      Kleiner Perkins and NEA. The latest round carried a reported $2.6 billion
      valuation, compared with $520 million in September 2025, while two sources
      report total funding above $650 million. Funding raised is not the same as
      cash currently available: no retained source provides the cash balance,
      burn, debt position, runway, or financing terms. The investor and partner
      map therefore shows strategic relevance and diligence asks rather than
      inferring control or economics from logo prominence.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: scale-signals-and-open-proof
    title: Scale signals and unresolved commercial proof
    body: >-
      The AI Materials Foundry launched with more than 45 founding organizations,
      and CuspAI has expanded beyond Cambridge into Amsterdam, Berlin, Tokyo,
      Singapore, and the United States. Those facts indicate reach, infrastructure
      access, and partner interest, but not a disclosed customer base. The
      strongest skeptical source in the pool states that revenue, profitability,
      and annual customer spending remain unpublished and cautions that Foundry
      membership may represent compute, research, data, or services rather than a
      paying contract. Consequently, valuation and partner counts should be read
      as financing and ecosystem signals, not as proxies for ARR, revenue, or
      retained customers. Headcount, booked contracts, gross margin, customer
      concentration, and runway remain material data-room requests.
    claimRefs: [CO010, CO014, CO015, CO016]
