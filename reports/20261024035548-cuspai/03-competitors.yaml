        - {label: Orbital Materials, x: 3, y: 3, detail: "AI model plus own laboratory and scale-up objective", note: "Independent profile, with prediction and commercialization limitations"}
        - {label: Materials Zone, x: 3, y: 2, detail: "Structured R&D and manufacturing data with workflow tools", note: "Competitor-issued 2021 description"}
