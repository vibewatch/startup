    columns: [Buying criterion, CuspAI, Orbital Materials, Materials Zone, Incumbent or internal-build implication]
    rows:
      - [Generative candidate design, "MIRA generates candidate structures for partner-defined constraints", "AI model predicts and searches new materials", "AI/ML insights from structured R&D data; generative scope not established", "Internal teams can combine models and scientists; integration burden is unknown"]
      - [Simulation at scale, "kUPS and Meta UMA are described as enabling atomic-interaction simulation at GPU scale", "AI simulation is described, but prediction limits remain", "Analytical and AI/ML tools are described without scale metrics", "Simulation incumbents may have trust and installed-base advantages"]
      - [Synthesis planning and lab routing, "Routes work to facilities based on capability, geography, and throughput", "Own lab is used; external scale-up path is a stated goal", "Workflow management is described; lab-network routing is not established", "Internal build requires laboratory access, automation, and orchestration"]
      - [Private data and confidentiality, "Private Foundry instances and industrial confidentiality are claimed", "Own experimental data and public data are described", "Structured customer R&D data is the core product claim", "Data portability, rights, and exclusivity require contract diligence"]
      - [Commercial proof, "One reported programme screened 300T structures and delivered 20 validated candidates in six months", "C&EN describes a lead carbon-capture sorbent and commercialization objective", "Company release says it served paying customers including a Fortune 100 company in 2021", "No assigned independent source normalizes outcomes, price, retention, or ROI"]
    notes: "Cells are evidence-backed summaries; unknowns are intentionally retained where the assigned pool does not support a current comparison. Vendor-authored comparisons are not treated as independent benchmarks."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider or alternative, Public price or contract model, Included capabilities, Discount or packaging evidence, Competitive implication]
    rows:
      - [CuspAI, null, "Foundry membership or partner deployment is described; list price is not published", "Unknown; no assigned source discloses contract value, seat count, usage unit, or discounting", "Enterprise sales and integration economics cannot be benchmarked"]
      - [Orbital Materials, null, "AI discovery plus company laboratory and application work", "Unknown in assigned independent source", "Potentially project- or partnership-led; price and recurring model require diligence"]
      - [Materials Zone, null, "Cloud materials-discovery platform, data standardization, workflow, and AI/ML tools", "Company release says it served paying customers; price and contract terms are not disclosed", "Workflow software may be easier to adopt but may cover a narrower loop"]
      - [Simulation incumbents and internal build, null, "Simulation licenses, cloud compute, staff, labs, and integration purchased separately", "Comparable total cost is not disclosed in the assigned pool", "Buyer may trade CuspAI integration premium against build-versus-buy control"]
    notes: "Null means no comparable public price or contract value was found in the assigned successful prefetched sources; funding, valuation, and customer counts are not used as price proxies."
    claimRefs: [CP010, CP011, CP012]

