    approximationNotes: "Coordinates are ordinal synthesis of the cited evidence, not a verified benchmark, ranking, or market-share estimate; no threshold or quadrant label should be interpreted as a factual category."
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP009, CP013, CP016]

callouts:
  - calloutType: strength
    title: Integration is the disclosed wedge
    body: CuspAI’s strongest differentiator is the combination of private data, agentic design, simulation, synthesis planning, and a distributed lab network rather than a single model feature.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Integration is not yet proven as lock-in
    body: Public sources do not disclose pricing, renewal, portability, data-rights exclusivity, or repeatable production outcomes, while independent reporting highlights manufacturability and commercialization hurdles.
    claimRefs: [CP011, CP012, CP015, CP016]

