chapter:
  number: 5
  title: Product & Technology
  summary: CuspAI presents the AI Materials Foundry as an industrial discovery workflow centered on its MIRA platform, combining generative design, simulation, synthesis-route planning, and coordinated experimental validation. The strongest public product evidence is a Kemira PFAS project that reached approximately 20 shortlisted candidates from a much larger design space in six months, but commercial production, long-term reliability, security controls, and repeatability across programs remain unverified.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: >-
      CuspAI's product is described as an industrial materials-discovery service rather than a standalone model. The July 2026 launch announcement says MIRA enables partners to run a full cycle from generative materials design through simulation, synthesis-route planning, and coordinated experimental validation (CE003). The company-issued description connects the workflow to a network of compute, data, laboratories, and scientific expertise, while the independent New Market Pitch assessment characterizes the customer job as specifying desired material properties and using AI to narrow which chemical structures merit laboratory development (CE005). This is a credible workflow-level definition, but public sources do not establish whether customers primarily buy subscriptions, bespoke research, royalties, or a bundled service, and participation in the Foundry does not prove a paying production deployment.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: maturity-and-proof
    title: Maturity and technical proof
    body: >-
      The most concrete maturity signal is the Kemira collaboration, which is partner-issued rather than an independent benchmark. Kemira reports that the project searched approximately 300 trillion structures, generated more than 5,000 designs with property data for GenX, PFBS, and PFOS, narrowed them to approximately 20 priority candidates, and reached that stage in six months (CE006). The same source says the candidates were moving into further development and testing, so the evidence supports accelerated discovery-stage throughput, not validated field performance or commercial production. The independent assessment reaches the same boundary: the research result is substantial, but commercial performance, manufacturing economics, and long-term reliability were not established publicly (CE007). Meta's UMA research illustrates the kind of external atomistic-model capability available in the ecosystem, but it is not evidence that CuspAI's MIRA achieves the same measured performance (CE008).
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
  - id: differentiation-and-risks
    title: Differentiation, dependencies, and controls
    body: >-
      CuspAI's claimed differentiation is the integration of generative design with industrial data access, compute, simulation, synthesis planning, and physical validation. The Foundry announcement names NVIDIA as a compute provider and Meta's Fundamental AI Research team as the developer of UMA, making external compute and model relationships material dependencies (CE003). Public practitioner material also shows that adjacent open tooling can generate constrained inorganic structures and evaluate them with machine-learning force fields, while explicitly warning that density-functional-theory confirmation is more reliable in less common chemical systems (CE009). This creates a diligence question around validation cost, model error, transfer to customer-specific chemistries, and dependence on partner infrastructure. The reviewed pool does not provide a CuspAI security page, incident history, privacy controls, certification, or service-level reliability record; these are evidence gaps, not evidence of an incident or control failure.
    claimRefs: [CE003, CE009, CE011, CE012]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Discovery workflow has an industrial proof point
    body: The Kemira project gives CuspAI a specific partner-defined brief, a quantified search space, a six-month discovery interval, and a narrowed candidate set; it is stronger than a generic claim that AI can design materials, while still stopping before production validation.
    claimRefs: [CE006, CE007]
  - calloutType: risk
    title: The public evidence stops before production
    body: The key materials case remains in development and testing, and public sources do not disclose customer-specific reliability, manufacturing economics, security controls, or repeatable production outcomes.
    claimRefs: [CE007, CE011, CE012]
