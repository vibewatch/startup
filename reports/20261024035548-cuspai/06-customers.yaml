chapter:
  number: 6
  title: Customers
  summary: CuspAI has credible industrial and research-partner access, including a documented Hyundai partnership and a Kemira materials-screening project, but public evidence still describes pilots, founding membership, and strategic relationships more clearly than paying-customer scale, retention, or production deployment.
sections:
  - id: buyer-and-user-segments
    title: Buyer and user segments
    body: >-
      CuspAI's customer surface is enterprise and institution-led rather than self-serve. The AI Materials Foundry is described as a network of more than 45 organizations spanning semiconductors, clean energy, advanced manufacturing, automotive, chemicals, laboratories, compute and public-sector research. The buyer is therefore likely an industrial R&D or innovation function, while the users include materials scientists, process engineers, laboratory operators and computational researchers; the payer, contract owner and economic beneficiary may differ. Hyundai's November 2025 announcement gives the clearest customer-shaped proof: it says the parties signed a strategic partnership agreement to accelerate innovative materials and improve the efficiency, durability and stability of future mobility materials. The announcement does not disclose contract value, paid status, deployment scope or production milestone. Independent coverage names solar-materials companies Caelux and Oxford PV, chemicals company Kemira and semiconductor suppliers among the network, but a founding-member logo is not equivalent to an active paid account.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest public adoption signal is a Kemira project reported by CuspAI's Foundry announcement and repeated by independent pv magazine coverage: the system screened up to 300 trillion molecular structures, produced 20 candidates for further testing and validation, and completed the process in six months rather than the customer's prior multi-year process. This is a meaningful workflow outcome, but it remains a discovery and validation milestone rather than evidence that a material reached commercial production. A*STAR is described as a new multi-year partnership covering semiconductors, carbon capture and advanced electronics, while Hyundai's partnership is framed as a collaboration framework across multiple domains. These relationships show access to serious industrial and public-sector users, but the sources do not provide active-user counts, repeat-purchase data, renewal rates, utilization, revenue per account or pilot-to-production conversion. The customer funnel should therefore be read as partner access -> defined technical problem -> computational screening -> physical testing -> production adoption, with the last stages still unverified in public evidence.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion and concentration risk
    body: >-
      CuspAI's expansion logic is potentially attractive because one platform can serve distinct materials problems while partner data is kept in private Foundry instances. The public materials describe customer-defined properties, model-generated candidates, synthesis routing and feedback from experimental results, which could create a recurring workflow if customers continue through validation and manufacturing. However, no source in the assigned pool discloses net revenue retention, gross retention, churn, renewal, contract length, customer concentration by revenue, or the share of Foundry members that pay. The adverse source explicitly warns that the membership list says little about current revenue and that commercial performance and long-term reliability remain unestablished. Concentration risk is consequently two-sided: a small number of flagship industrial programs could drive proof and distribution, but could also make revenue, roadmap and referenceability dependent on a few slow procurement processes. Simplify's independent company profile reinforces that concern by warning that paid contracts, rather than partner logos, determine MIRA's value and that semiconductor procurement and validation can be slow. Diligence should require a cohort-level customer schedule separating paid software, research services, partner contributions and unpaid ecosystem participation.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Industrial workflow proof is stronger than logo proof
    body: The Kemira screening result and Hyundai strategic partnership provide more decision-useful evidence than the Foundry's membership count alone, because they connect CuspAI to a defined technical workflow and an identified industrial user.
    claimRefs: [CU006, CU007, CU008]
  - calloutType: risk
    title: Retention and monetization remain unverified
    body: Public sources do not establish paid-customer count, recurring revenue, renewal, churn, production deployment or concentration, so customer durability cannot yet support a financial underwriting case.
    claimRefs: [CU012, CU013, CU014, CU015]
