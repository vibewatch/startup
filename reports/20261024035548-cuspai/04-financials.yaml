      - [Foundry participation, "Networked access to compute, data, labs, and expertise", "More than 45 founding organizations reported", "Membership count is not proof of paying customers", "Reconcile members, paying accounts, fees, and in-kind contributions"]
      - [Licensing or royalties, "Potential rights to successful materials", "No public terms or realized revenue", "Open business-model question", "Review IP ownership, license triggers, royalty rates, and revenue-recognition policy"]
    notes: "Sources describe mechanisms and selected projects, not a complete revenue ledger; null or undisclosed values mean no public figure was retained."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and unit-economics data
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [List price, null, low, "No public price list establishes monetization or price realization", "Obtain current price cards and realized discount schedules"]
      - [Revenue per customer, null, low, "Foundry membership does not identify paid contract value", "Provide account-level bookings and recognized revenue by customer"]
      - [Gross margin, null, low, "Compute, scientific labor, synthesis, and validation may create materially different margins", "Provide cost-of-revenue bridge by product and project type"]
      - [CAC and payback, null, low, "Industrial sales and scientific validation cycles may be long", "Provide funnel, sales-cycle, acquisition spend, and payback cohorts"]
      - [Net retention, null, low, "Repeat research and production conversion are not disclosed", "Provide renewal, expansion, churn, and pilot-to-production cohorts"]
    notes: "All nulls are deliberate public-evidence gaps rather than zeroes or estimates; the requested diligence would distinguish software, project, and licensing economics."
    claimRefs: [CI006, CI007, CI008, CI009]
  - id: TI003
    title: Capital adequacy and disclosed financial visibility
    columns: [Input, Public evidence, Interpretation, Underwriting implication]
    rows:
      - [Series B financing, "$450M; $2.6B valuation", "Reported financing event, not cash currently available", "Supports capacity but does not establish runway"]
      - [Cumulative funding, "Above $650M reported", "Company financing chronology is publicly summarized", "Need cap table, cash balance, and use-of-funds reconciliation"]
      - [Accounts visibility, "Last accounts made up to 31 March 2025; next accounts due 31 December 2026", "Current operating results are not in the retained official record", "Obtain management accounts, debt, liabilities, and working-capital detail"]
      - [Revenue and profitability, "Not disclosed in independent valuation review", "Commercial scale and margin path remain unanchored", "Require revenue bridge, gross margin, burn, and forecast scenarios"]
    notes: "Financing and filing dates are sourced facts; the table does not equate capital raised with cash on hand or infer burn and runway."
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
figures:
