    title: From industrial need to monetizable material
    type: flow
    summary: CuspAI's public workflow connects customer requirements to AI screening and laboratory validation, while commercial deployment and revenue remain unreported.
    data:
      nodes:
        - id: need
          label: Customer material specification
          note: "Industrial partners specify properties or use cases."
        - id: design
          label: MIRA generative design
          note: "CuspAI describes an AI platform for candidate generation."
        - id: screen
          label: Simulation and virtual screening
          note: "Public examples describe very large candidate searches."
        - id: synthesis
          label: Synthesis route planning
          note: "The Foundry description includes planning before physical testing."
        - id: validate
          label: Experimental validation
          note: "Public projects report candidates entering further development and testing."
        - id: deploy
          label: Production deployment and paid repeatability
          note: "Commercial deployment, realized pricing, and recurring revenue are not publicly disclosed."
      edges:
        - [need, design]
        - [design, screen]
        - [screen, synthesis]
        - [synthesis, validate]
        - [validate, deploy]
    claimRefs: [CI003, CI005, CI007, CI014]
callouts:
  - calloutType: strength
    title: Capital buys validation capacity, not proven revenue
    body: The Series B and industrial network provide resources to test whether CuspAI can move from computational discovery to repeatable commercial programs, but the public record still lacks the revenue and margin evidence needed for a financial underwriting case.
    claimRefs: [CI010, CI011, CI013]
  - calloutType: risk
    title: The valuation is ahead of disclosed economics
    body: The $2.6 billion financing valuation is market-backed, yet independent commentary says revenue and profitability remain undisclosed and that commercial performance, manufacturing economics, and long-term reliability are not established.
    claimRefs: [CI012, CI014]
