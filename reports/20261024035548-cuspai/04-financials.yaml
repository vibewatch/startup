schemaVersion: "report-v2"
artifact: financials
slug: cuspai
runDate: 2026-10-24
company:
  name: CuspAI
chapter:
  number: 4
  title: Financials
  summary: CuspAI has raised substantial capital and assembled a credible industrial discovery network, but public evidence does not disclose revenue, realized pricing, gross margin, burn, or runway. The underwriting case therefore depends on converting technical validation and partner access into repeatable paid work and economically manufacturable materials.
sections:
  - id: revenue-model
    title: Revenue model and traction
    body: |
      CuspAI's disclosed offering combines the MIRA platform with an AI Materials Foundry that coordinates data, compute, laboratories, synthesis planning, and experimental validation. Public descriptions support a customer-led research workflow: an industrial partner specifies desired material properties, CuspAI generates and screens candidates, and physical facilities test the shortlist. That mechanism can support platform subscriptions, bespoke research programs, usage-based compute or laboratory fees, and eventual licensing or royalties, but no retained source discloses the actual mix. The more than 45 founding members are strategically meaningful, yet membership is not the same as paid revenue. The strongest public traction is a Kemira project that screened about 300 trillion structures and narrowed more than 5,000 designs to roughly 20 candidates; the candidates were still moving into further development and testing. Revenue quality, contracted backlog, renewal behavior, and conversion from pilot to production remain unverified.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing, delivery costs, and unit economics
    body: |
      No public source in the assigned pool provides a CuspAI price list, contract value, realized revenue per customer, gross margin, customer-acquisition cost, sales cycle, payback period, or retention. Official and independent descriptions instead expose the cost drivers: proprietary model and data development, high-performance compute, scientific staff, synthesis infrastructure, and laboratory validation. The workflow may become more scalable when software narrows experimental search spaces, but physical validation and customer-specific scientific work can keep delivery costs material. A buyer could pay for access to MIRA, a defined research engagement, or downstream rights; these structures have different margin and revenue-recognition implications. Accordingly, a SaaS-style ARR assumption would be unsupported. Underwriting should separate recurring software fees from project revenue and any contingent licensing, and should require cohort-level economics before treating technical throughput as financial traction.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI002]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: |
      The July 2026 Series B is reported at $450 million and a $2.6 billion valuation, following a Series A of more than $100 million; one retained source reports total capital raised above $650 million. That financing gives CuspAI meaningful capacity to fund international expansion, compute, scientific hiring, and laboratory partnerships, but financing raised is not cash available and does not reveal burn or runway. The Companies House record shows the last accounts were made up to 31 March 2025 and the next accounts were due by 31 December 2026, so current cash, liabilities, and operating results are not visible in the assigned public record. An adverse valuation review says revenue and profitability remain undisclosed and that the $2.6 billion price is an aggressive bet on future commercial success. The financial verdict is therefore track rather than underwrite: capital adequacy appears stronger than the evidence on revenue quality, margin path, and deployment economics.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
