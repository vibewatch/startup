      severity: material
      topic: compliance-disclosure
      missingEvidence: "CuspAI-specific legal, export-control, privacy, IP and incident records."
      whyItMatters: "External rules identify exposure, but public guidance cannot establish whether CuspAI has complied or whether partners bear the obligations."
      diligencePath: "Obtain counsel memo, compliance register, DPA/template contracts, dataset licences, export-screening policy, certifications and incident log."
