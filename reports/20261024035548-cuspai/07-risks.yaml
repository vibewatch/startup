company:
  name: CuspAI
chapter:
  number: 7
  title: Risks
  summary: >-
    CuspAI's principal risks are execution and evidence risks rather than a documented incident: the Foundry depends on external compute, laboratories, data rights and industrial partners, while public materials do not establish recurring revenue, production deployment or long-term material performance. Regulatory and information-security obligations are identifiable, but the company's actual controls, contracts and licensing posture remain largely undisclosed.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      CuspAI's public proposition spans industrial materials design, scientific data, computing and physical validation. The evidence does not identify a CuspAI-specific enforcement action or license failure, but it does establish obligations that become material if the platform processes personal data, supports regulated chemical work, or relies on controlled computing infrastructure. The UK Information Commissioner's Office states that the UK GDPR security principle requires appropriate technical and organisational measures, including confidentiality, integrity and availability, timely restoration after incidents, and regular testing. That is a concrete control baseline for any Foundry data flows involving personal data, yet CuspAI's public materials do not disclose its data-processing roles, certifications, incident history or processor controls. Separately, UK REACH requires account-based processes for substance registration, notifications, transfers, joint registrations and research-and-development notifications; the public record does not establish which CuspAI or partner activities fall within those pathways. The Federal Register records a January 15, 2026 Bureau of Industry and Security rule revising controls for advanced computing commodities and semiconductor-related end uses. CuspAI's reported dependence on NVIDIA compute and semiconductor-focused partners makes export-control screening a diligence item, not proof of non-compliance. The legal risk is therefore conditional but potentially high-impact: a missed obligation could delay experiments, restrict compute access, or expose partner data and intellectual property.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-model
    title: Operational, quality and security dependencies
    body: >-
      The AI Materials Foundry is designed as a network rather than a vertically integrated laboratory. Public descriptions place CuspAI's MIRA platform between generative design, simulation, synthesis planning and experimental validation, with more than 45 founding organisations and external compute and laboratory capabilities. That architecture can accelerate throughput, but it also creates failure points at handoffs: a model candidate may be stable in simulation yet fail synthesis, a partner laboratory may lack capacity or reproducibility, or confidential datasets may be exposed across private instances and processors. Independent coverage says the Kemira work screened approximately 300 trillion structures and narrowed more than 5,000 designs to around 20 candidates in six months, but also says the candidates were still in development and testing and that production economics and long-term reliability were not publicly established. The strongest operational control is therefore a staged validation process, not the volume of generated candidates. A risk committee should monitor candidate-to-synthesis conversion, reproducibility, cycle time, partner capacity, data-access exceptions and production qualification. Until those denominators and controls are disclosed, residual exposure remains material even without a recorded outage or breach.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependency-financial
    title: Partner, financial and thesis-break risks
    body:     CuspAI's financing provides substantial reported capital, but funding raised is not the same as cash available for operations, and no public source in the assigned pool discloses burn, runway, revenue, margin or contract value. The July 2026 round was reported as $450 million at a $2.6 billion valuation, while the Foundry's 45-plus members include compute providers, model developers, manufacturers and research organisations. Those facts support strategic reach but do not prove that members are paying customers or that contracts are recurring, profitable or diversified. A partner failure, change in compute access, loss of a key dataset licence, customer concentration or inability to move a candidate into production could therefore impair both growth and valuation. The thesis should break if CuspAI cannot show repeatable paid deployments, disclosed conversion from candidate to validated production material, or sufficient independent compute and laboratory capacity. Financial diligence should obtain the cash balance, monthly burn, runway, contract backlog, gross margin by work type, customer concentration, renewal terms, dataset rights and financing preferences before treating the headline valuation as investable evidence.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: The highest-priority trigger is a failure to convert the Foundry's candidate-generation scale into repeatable, paid production deployments with independently reproducible outcomes. Partner count, funding and model throughput should not be treated as substitutes for that evidence.
    claimRefs: [CR006, CR010, CR012]
