      topic: financial-model
      missingEvidence: "Cash balance, monthly burn, runway, revenue, gross margin, backlog, renewals and customer concentration by revenue."
      whyItMatters: "The reported financing and valuation do not show how long the company can fund network expansion or whether the model is commercially repeatable."
      diligencePath: "Request monthly management accounts, bank statements, twelve-month forecast, contract schedule and revenue-recognition policy under NDA."
      relatedQuestionRefs: [QR007]
