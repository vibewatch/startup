  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [UK GDPR security principle, UK / data-processing contexts, "Medium", "High", "External baseline is defined; CuspAI controls undisclosed", "High", "Obtain controller/processor map, DPA, security testing, incident log and restoration evidence"]
      - [UK REACH registration and research notifications, Great Britain / chemical activities, "Medium", "High", "Regulatory workflow is public; company and partner allocation undisclosed", "High", "Map each substance, importer, producer and PPORD activity to registration responsibility"]
      - [Advanced-computing and semiconductor end-use controls, United States / cross-border compute, "Medium", "High", "Rule exists; CuspAI screening and export-control governance undisclosed", "Medium-high", "Review compute procurement, end users, geographies, screening controls and legal opinions"]
      - ["Data, model and experimental-IP rights", Cross-border partner network, "Medium", "High", "Private instances are described, but licences and ownership terms are undisclosed", "High", "Inspect dataset licences, training rights, foreground IP, confidentiality and partner termination clauses"]
    notes: "Rows are a risk assessment based on applicable external rules and the assigned pool's company/industry descriptions; CuspAI-specific compliance status is not publicly established."
    enumerationScope:
      coverage: partial
      basis: "Publicly identifiable UK, US and cross-border obligations relevant to the Foundry as of 2026-10-24; not a complete legal inventory."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Model candidate is not synthesizable or reproducible, "Medium-high", "High", "Staged simulation and lab validation described", "High", "Candidate-to-success and repeatability denominators are not disclosed"]
      - [External laboratory capacity or quality bottleneck, "Medium", "High", "Network allocation model described; capacity controls undisclosed", "High", "Obtain partner SLAs, queue times, quality controls and fallback labs"]
      - [Confidential data or IP leakage across partners, "Medium", "High", "Private instances and security guidance exist as expected controls", "High", "Verify access segregation, encryption, processor oversight and audit results"]
      - [Compute or platform dependency interruption, "Medium", "High", "NVIDIA and Meta participation reported", "Medium-high", "Review multi-cloud/compute alternatives, service commitments and portability"]
    notes: "Likelihood and residual exposure are qualitative because public incident rates, control testing and operating denominators are unavailable."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Accelerated compute, NVIDIA and external HPC providers, "Not disclosed", "Compute access, pricing or export permissions change", "High", "Use multiple providers and document portability", "High"]
      - [Atomistic models and scientific data, Meta and licensed dataset providers, "Not disclosed", "Model or dataset rights lapse or terms restrict commercialization", "High", "Contractual rights, provenance controls and substitute datasets", "High"]
      - [Physical testing and manufacturing, Foundry labs and industrial members, "Not disclosed", "Capacity, quality or partner priorities delay validation", "High", "SLAs, qualification gates and backup facilities", "High"]
      - [Commercial demand, 45-plus Foundry members and named industrial users, "Paid share not disclosed", "Membership does not convert to recurring revenue or production work", "High", "Track paid deployments, renewals, backlog and concentration by revenue", "High"]
    notes: "Foundry membership is not treated as customer revenue; counterparty concentration and mitigation maturity require contract-level evidence."
    claimRefs: [CR009, CR010, CR011, CR012]
