callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: The financing mark is credible as a reported transaction price, but public evidence is insufficient to establish that it is supported by recurring economics or downside-protective terms.
    claimRefs: [CV001, CV002, CV011]
  - calloutType: risk
    title: The missing denominator is the core risk
    body: Without revenue quality, margin, burn, runway, customer concentration, and preference data, a precise valuation target would overstate what the public record can support.
    claimRefs: [CV011, CV012, CV013, CV015]
