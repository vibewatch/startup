callouts:
  - calloutType: "recommendation"
    title: "Structural Elimination of Venture Investment Opportunity"
    body: |
      Our rating of avoid on EvolutionaryScale is purely structural: the company was absorbed into Chan Zuckerberg Biohub in November 2025, halting all secondary market share transactions and eliminating the possibility of an independent commercial IPO or trade sale. Investors should not pursue equity secondary purchases or assign speculative venture valuation multiples to EvolutionaryScale.
    claimRefs:
      - "CV011"
      - "CV012"
  - calloutType: "insight"
    title: "The Biological Foundation Model Paradox"
    body: |
      EvolutionaryScale's trajectory highlights a fundamental tension in generative biology: while model capabilities scale predictably with compute, drug development remains tethered to wet-lab validation and multi-year clinical timelines. The company projected $316 million in cumulative compute spend over three years, creating a financing burden that made non-profit foundation stewardship more sustainable than commercial venture ownership.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV011"
      - "CV014"
