chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Structural Evolution, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale was incorporated in February 2024 as a Delaware Public Benefit Corporation headquartered
              in New York, NY, with an additional research engineering office in San Francisco, CA. The company was
              conceived as a dedicated vehicle to translate biological scale modeling into programmable therapeutics and
              enzymes. Prior to its acquisition, the enterprise operated with an estimated team of 10 to 49 personnel,
              primarily deep learning researchers and computational biologists. The corporate business model combined
              non-commercial open research releases with proprietary monetization through its EvolutionaryScale Forge
              cloud platform and enterprise API distributions on AWS and Nvidia infrastructure. However, the lack of
              mandatory public SEC registrations means that historical commercial revenue, ARR multiples, and active
              client rosters were never independently disclosed. In November 2025, the company underwent an
              institutional absorption by the Chan Zuckerberg Initiative into CZ Biohub, fundamentally transforming its
              operating governance from an independent venture-backed commercial entity into a philanthropic scientific
              research organization.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
              - CO007
              - CO011
              - CO012
