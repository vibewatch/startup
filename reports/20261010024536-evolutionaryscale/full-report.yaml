      - number: '4.2'
        title: Unit economics remain a diligence data room exercise
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not permit calculation of gross margin, customer acquisition cost, payback,
              retention, utilization, or contribution margin. The product strategy is compute-intensive by design:
              TechCrunch described continued model scaling through larger datasets and greater computational power,
              while also reporting that a company pitch deck contemplated a decade before generative AI could help
              design therapies. That does not prove a specific burn rate, but it does make timing and service-delivery
              costs central to underwriting. A dedicated CFO and COO indicate that finance and operating functions
              existed, but management roles are not substitutes for audited financials. The investment case therefore
              requires customer-level billings, cloud and compute costs, support labor, revenue-share liabilities, and
              cohort economics.
            claimRefs:
              - CI008
