      - number: '7.2'
        title: Regulatory, Biosecurity, and Legal Liabilities
        blocks:
          - type: paragraph
            body: >-
              Generative biology and autonomous protein design operate under intensifying regulatory scrutiny across
              global jurisdictions. Because frontier protein language models such as ESM3 possess the theoretical
              capability to engineer synthetic pathogens, toxins, or immune-evasive macromolecules, regulatory bodies
              and national biosecurity councils are establishing stringent compliance barriers. EvolutionaryScale
              operates as a Public Benefit Corporation (PBC) and mandates binding arbitration and liability caps in its
              dispute resolution policies. However, contractual liability shields cannot immunize the organization
              against statutory biosecurity enforcement, export control restrictions on model weights, or IP disputes
              regarding proprietary training sets. Furthermore, the lineage of ESM models traces directly to Meta FAIR,
              leaving potential residual risks concerning training provenance and open-weights licensing boundaries that
              require rigorous continuous legal monitoring.
            claimRefs:
