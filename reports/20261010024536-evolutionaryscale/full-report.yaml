      - number: '6.4'
        title: Retention Durability, Platform Concentration, and Acquisition Transition
        blocks:
          - type: paragraph
            body: >-
              Customer retention durability and standalone commercial risk profiles underwent an acute structural pivot
              in November 2025 when EvolutionaryScale's founding executive and technical leadership joined the Chan
              Zuckerberg Biohub. This strategic integration effectively concluded EvolutionaryScale's operation as an
              independent venture-backed commercial enterprise, redirecting its operational trajectory from commercial
              software licensing toward open-science scientific infrastructure. Prior to this integration, commercial
              customer commitments were subject to restrictive dispute resolution policies that mandated binding JAMS
              arbitration seated in New York County, required individual claim resolution with class action waivers, and
              capped aggregate contractual liability at the greater of one hundred dollars or trailing twelve-month fees
              paid. Furthermore, the company's enterprise go-to-market model exhibited intense channel concentration on
              AWS and NVIDIA compute environments. With the core research group now leading Biohub's AI division and
              operating toward a 10,000-GPU compute roadmap by 2028, ongoing commercial SLA continuity for the Forge API
              has been superseded by non-profit institutional science.
            claimRefs:
              - CU008
              - CU009
