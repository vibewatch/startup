      - number: '6.3'
        title: Named Customer Proof, Reference Quality, and Production Milestones
        blocks:
          - type: paragraph
            body: >-
              Direct public proof of paying enterprise customer deployments at production scale remains severely
              restricted in EvolutionaryScale's public audit trail. While the company secured tier-one infrastructure
              and co-selling relationships with Amazon and NVIDIA, neither cloud partner published named biopharma case
              studies detailing recurring production workload commitments, contract durations, or quantified discovery
              yields. Public technical validation instead focused on internally engineered synthetic demonstrations,
              most notably the de novo generation of fluorescent protein variant esmGFP, which exhibited 58% sequence
              identity to known coral proteins while preserving green luminescence. Following the team's absorption into
              CZ Biohub in late 2025, experimental validation shifted to non-profit institutional collaborative
              programs, including the May 2026 demonstration of ESMFold2 binder designs across five oncology and
              immunology targets. However, independent diligence reveals an absence of audited customer counts,
              enterprise ARR figures, or enterprise retention cohorts across public regulatory filings, leaving
              commercial reference durability uncorroborated.
