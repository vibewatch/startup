              - CO006
              - CO011
              - CO012
      - number: '1.4'
        title: Milestone Trajectory from FAIR Lineage to Biohub Integration
        blocks:
          - type: paragraph
            body: >-
              The operational arc of EvolutionaryScale progressed with unprecedented velocity from stealth spin-out to
              non-profit absorption. Spanning 2019 to 2023 at Meta FAIR, the founding team laid the academic foundation
              for sequence-scale biological modeling. Following incorporation in February 2024, the company formally
              launched in June 2024 with the unveiling of ESM3—a frontier language model trained across 2.78 billion
              natural proteins capable of jointly reasoning over biological sequence, 3D structure, and enzymatic
              function. In a landmark wet-lab validation, the firm engineered esmGFP, a synthetic fluorescent protein
              with 58% sequence identity to natural jellyfish GFP that would theoretically require 500 million years of
              natural evolutionary drift. Subsequent milestones included the rollout of the ESM Cambrian sequence
              representation family and standard customer agreements enforcing binding JAMS arbitration in New York
              County. The trajectory concluded in November 2025 when Mark Zuckerberg announced CZI’s acquisition of
              EvolutionaryScale and integration of its team into Biohub, concluding the firm’s standalone corporate
              existence.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO011
              - CO013
              - CO014
              - CO015
