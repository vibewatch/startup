      - number: '5.2'
        title: Architecture and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              ESM3's observable technical distinction is multimodal protein modeling. The reviewed architecture
              description identifies six input categories embedded into a shared representation, a transformer core,
              task-specific output heads, and a VQ-VAE-based structure path that converts coordinates to discrete tokens
              and reconstructs coordinates with confidence outputs. The same source describes a default ESM3
              configuration with a 1,536-dimensional model, 24 attention heads, 256 voting heads, and 48 layers. These
              details make the architecture more concrete than generic protein-AI marketing, but they are code-derived
              documentation rather than an independent benchmark of accuracy, throughput, biological validity, or
              commercial advantage. ESMC provides a simpler representation path, so its value proposition should be
              evaluated separately from ESM3's generative claims.
            claimRefs:
              - CE002
              - CE003
