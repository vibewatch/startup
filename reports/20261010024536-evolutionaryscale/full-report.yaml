  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Value Propositions
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale segmented its commercial and scientific user base across three distinct tiers:
              commercial biopharma enterprises, venture-backed discovery biotechnology startups, and academic or
              institutional research laboratories. At the enterprise tier, the primary economic buyers comprise heads of
              computational biology, vice presidents of biotherapeutics discovery, and enterprise procurement directors
              seeking to compress lead generation cycle times for novel therapeutic candidates. For these organizations,
              ESM3 was positioned as a general-purpose multimodal generative foundation model capable of generating de
              novo amino acid sequences conditioned on three-dimensional functional motifs. At the biotechnology startup
              and discovery laboratory level, user personas center on structural biologists, protein engineers, and
              biophysicists utilizing the hosted Forge developer platform for targeted variant engineering. To bridge
              computational design with wet-lab experimental workflows, the company developed full-stack interfaces
              enabling laboratory scientists to interact with generative biology models without custom code. In
              contrast, academic and non-profit researchers represent an open-science adoption layer accessing
              open-weight model checkpoints under non-commercial licenses, serving as an organic discovery and talent
              pipeline rather than a direct software revenue generator.
            claimRefs:
              - CU001
              - CU002
              - CU003
