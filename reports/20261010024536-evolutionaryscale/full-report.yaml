  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Stance
      - Core Argument
      - Evidence Basis
      - What Would Change the View
    rows:
      - - Investment Thesis
        - Frontier protein language modeling can program biology from first principles, creating immense platform value.
        - >-
          ESM3 multimodal architecture trained on 2.78B proteins; successfully synthesized esmGFP simulating 500M years
          of evolution.
        - Validation of commercial drug pipeline generation with independent clinical progression.
      - - Investment Anti-Thesis
        - >-
          Astronomical compute expenditures and a 7-10 year drug development cycle create an unsustainable burn rate for
          venture capital.
        - >-
          Pitch memo projected $38M Y1, $161M Y2, and $278M Y3 operating costs ($316M cumulative compute budget) against
          negligible near-term revenues.
        - Discovery of rapid low-cost commercialization contracts or immediate high-margin software revenues.
      - - Structural Reality
        - Non-profit institutional absorption permanently closes the commercial venture capital liquidity path.
        - Acquisition by Chan Zuckerberg Biohub in November 2025; cessation of independent private share trading.
        - Spin-out or commercial re-incorporation of EvolutionaryScale assets as an independent for-profit company.
    notes: >-
      Core thesis and anti-thesis drivers synthesized from June 2024 launch disclosures and August 2023 pitch document
      analysis.
