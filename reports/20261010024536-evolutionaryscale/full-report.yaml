      - number: '1.2'
        title: Founding Team, Scientific Lineage, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              The human capital and intellectual core of EvolutionaryScale directly descend from Meta Platforms’
              Fundamental AI Research (FAIR) group. Co-founder and Chief Scientist Alex Rives led the original ESM
              research team that developed the foundational ESM-1, ESM-2, and ESMFold architectures between 2019 and
              2023. Following Meta’s internal restructuring and disbandment of the protein unit, Rives departed
              alongside co-founders Salvatore Candido, who assumed the Chief Technology Officer role, and deep learning
              researcher Tom Sercu. Additional technical co-founders recognized across research filings include Thomas
              Hayes, Roshan Rao, and Halil Akin. The leadership cadre was augmented by operational executives including
              Chief Operating Officer Katrin Malin and veteran Chief Financial Officer Tim Hanley. Key-person dependency
              on Dr. Rives and Dr. Candido remained exceptionally acute throughout the company’s operating lifespan, as
              the proprietary architecture, multi-track training methodologies, and scientific standing of the ESM suite
              were inextricably linked to their direct leadership.
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO010
