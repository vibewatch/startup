        title: Exhibits
        blocks:
          - type: callout
            title: The strongest diligence risk is continuity, not model-definition ambiguity
            body: >-
              The retained sources describe a concrete model and SDK architecture, but they do not establish who
              currently operates Forge, which commercial rights remain available, or what service, security, privacy,
              and support commitments survive the 2025 Biohub integration.
            calloutType: risk
