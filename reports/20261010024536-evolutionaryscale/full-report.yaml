            title: Commercial Standalone Viability Terminated by Nonprofit Absorption
            body: >-
              The acquisition of EvolutionaryScale by the Chan Zuckerberg Initiative in November 2025 effectively closed
              the standalone venture chapter for the company. While providing stable philanthropic capital and expanded
              computing power, it eliminates an independent commercial software or biotechnology equity thesis.
