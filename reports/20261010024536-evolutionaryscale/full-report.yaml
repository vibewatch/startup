      - number: '1.3'
        title: Capitalization History, Strategic Backers, and Governance Dynamics
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale concluded one of the largest inaugural financings in computational biology on June 25,
              2024, announcing a $142 million seed funding tranche. The financing round was co-led by venture capital
              firm Lux Capital and angel investor partnership Nat Friedman and Daniel Gross (NFDG), accompanied by
              strategic corporate investments from Amazon and Nvidia’s NVentures. The capitalization positioned
              EvolutionaryScale at an estimated post-money valuation between $1.0 billion and $1.35 billion, reflecting
              substantial market enthusiasm for generative biology. Strategic alignment with Amazon and Nvidia was
              cemented via multi-platform commercialization: EvolutionaryScale pledged deployment of its 98-billion
              parameter ESM3 model across Amazon Web Services environments including Bedrock and SageMaker, while
              concurrently integrating into Nvidia NIM microservices for accelerated enterprise inference. Despite the
              blue-chip backing, the complete absence of secondary share disclosures and subsequent unannounced
              financial terms in the CZ Biohub absorption obscure the realized financial returns for preferred equity
              holders.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO012
