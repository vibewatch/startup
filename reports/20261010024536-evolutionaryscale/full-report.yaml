  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and User Workflow
        blocks:
          - type: paragraph
            body: >-
              The evidence supports two distinct model jobs rather than one undifferentiated platform. ESM3 processes
              and generates protein sequence, structure, and function information, while ESMC is focused on protein
              representations and embeddings. The customer workflow therefore spans generative design and representation
              tasks: a practitioner can prepare biological inputs, run a model locally or through a described hosted
              interface, and then carry outputs into downstream computational or laboratory work. Public materials
              identify Forge, an ESM Python SDK, open weights, Hugging Face, and cloud-marketplace channels, but they do
              not establish present availability, production usage, service levels, or measured customer outcomes as of
              the run date. The module and workflow tables separate documented capabilities from those open operating
              questions.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE009
