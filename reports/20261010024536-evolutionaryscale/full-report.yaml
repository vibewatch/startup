      - number: '4.3'
        title: Historical financing does not establish current capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Multiple sources report a $142 million seed financing in June 2024, with backing associated with Nat
              Friedman, Daniel Gross, Lux Capital, Amazon, and NVentures. That figure is funding raised, not cash still
              available after model training, payroll, cloud commitments, or transaction costs. No reviewed source gives
              cash on hand, monthly burn, debt, runway, working-capital needs, or a next-round trigger. Clarity's
              displayed $5 per-security figure is explicitly model-derived and its underlying match, bid, ask, and
              volume fields are gated, so it is not a defensible company valuation. More importantly, a November 2025
              report says CZI acquired EvolutionaryScale and established Biohub. Without consideration, investor
              treatment, assumed obligations, and product-continuity terms, the standalone margin and capital path
              cannot be underwritten.
            claimRefs:
