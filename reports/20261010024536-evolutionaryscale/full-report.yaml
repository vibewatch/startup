      - number: '5.3'
        title: Deployment, Governance, and Continuity Risk
        blocks:
          - type: paragraph
            body: >-
              Deployment evidence is strongest for the historical launch period. TechCrunch reported in June 2024 that
              the full 98-billion-parameter model would be available for non-commercial use through Forge, with a
              smaller model for offline use, and that selected AWS and NVIDIA channels were planned. A later independent
              API profile describes Forge, the SDK, open weights, and AWS Marketplace access, but also says
              EvolutionaryScale was integrated into Biohub in 2025 and that the SDK moved to the Biohub namespace. The
              public EvolutionaryScale GitHub organization still provides a developer signal, although the fetched page
              mainly exposes infrastructure forks and a partner-collaboration repository rather than a complete current
              roadmap. Governance is restrictive: the community license limits the open model to non-commercial purposes
              and prohibits drug-development uses, while the dispute policy sharply limits liability. No retained source
              establishes current uptime, support ownership, security certifications, privacy controls, incident
              history, or a post-integration commercial roadmap.
            claimRefs:
              - CE007
              - CE008
