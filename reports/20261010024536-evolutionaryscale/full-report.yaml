        title: Operational Dependencies, Compute Intensity, and Commercial Deprecation
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale’s operational architecture relies heavily on third-party hyperscalers and specialized
              compute hardware providers. Training 98-billion-parameter foundation models like ESM3 requires massive GPU
              clusters, creating critical operational dependencies on Amazon Web Services and NVIDIA. Although
              partnerships with AWS HealthOmics and NVIDIA NIM provided initial enterprise distribution channels, the
              commercial viability of the Forge API remains deeply uncertain following the CZ Biohub acquisition.
              Enterprise biopharma clients require multi-year uptime commitments, SOC2/HIPAA assurances, and dedicated
              SLA contracts that a non-profit academic research umbrella may be unequipped or unwilling to sustain.
              Concurrently, competitive pressure from agile commercial platforms such as Chai Discovery, Isomorphic
              Labs, and open-source models threatens to erode EvolutionaryScale's enterprise mindshare.
