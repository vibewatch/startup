  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              EvolutionaryScale entered the generative biology sector with unprecedented technical momentum, founded by
              Alexander Rives and former members of Meta AI's protein folding team following the shuttering of their
              research unit. The core investment thesis rested on the biological scaling hypothesis: that applying
              transformer language models trained on massive biological datasets (including 2.78 billion natural protein
              sequences, structures, and functional annotations) would unlock programmable biological engineering from
              first principles. By generating esmGFP, a fluorescent protein simulating roughly 500 million years of
              natural evolution, EvolutionaryScale validated that its 98-billion-parameter multimodal model (ESM3) could
              engineer functional macromolecules. This established a deep technical moat supported by heavyweight
              ecosystem partners including AWS (via SageMaker, Bedrock, and HealthOmics) and NVIDIA (via BioNeMo and NIM
              microservices).


              However, the anti-thesis proved decisive when Chan Zuckerberg Biohub absorbed EvolutionaryScale in
              November 2025, merely 14 months after its landmark $142 million seed round. Early venture pitch documents
              obtained by Forbes laid bare an unsustainable cost trajectory: EvolutionaryScale projected first-year
              operational expenditures of $38 million ($16 million for compute), accelerating to $161 million in year
              two ($100 million for compute) and $278 million in year three ($200 million for compute). With biological
              drug discovery timelines typically requiring 7 to 10 years for clinical candidate development, the company
              faced enormous cash burn against negligible commercial revenues, ultimately compelling its transition into
              a non-profit biomedical research umbrella.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
      - number: '8.2'
        title: Financing Context, Valuation Marks, and Recommendation
        blocks:
          - type: paragraph
            body: >
              EvolutionaryScale closed an extraordinary $142 million seed financing in June 2024, led by Nat Friedman,
              Daniel Gross, and Lux Capital, with participation from corporate venture arms Amazon and NVentures
              (NVIDIA). Private secondary market data from UpMarket estimated EvolutionaryScale's post-money seed
              valuation benchmark at $1.21 billion, alongside secondary market tracker marks around $1.0 billion,
              following early Forbes reporting of an initial $200 million pre-seed valuation mark on a $40 million
              raise. The company's corporate governance was structured as a Delaware Public Benefit Corporation (PBC),
              formalizing an open-science mission that placed public benefit alongside commercial return.


              Despite peak unicorn-tier valuation marks exceeding $1.2 billion, the standalone commercial equity
              opportunity is closed. Following the November 2025 acquisition by CZ Biohub, EvolutionaryScale shares are
              no longer offered on private secondary platforms. Because the financial consideration, equity treatment,
              and preferred liquidation preferences of Series A/seed investors remain completely undisclosed,
              EvolutionaryScale receives a definitive rating of avoid on an equity investment basis with an unknown
              valuation stance. Our recommendation reflects structural transaction finality rather than technical
              deficiency: as an absorbed research division, there is no viable path for private venture capital entry or
              public equity upside.
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario Analysis, Comparables, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Evaluating EvolutionaryScale across traditional venture valuation scenarios illustrates the severe
              economic divergence between open biological foundation models and commercial drug pipelines. In a
              standalone bull case, EvolutionaryScale would have commercialized its Forge cloud platform, securing
              recurring enterprise API subscriptions and lucrative pharma milestone sharing akin to DeepMind's
              Isomorphic Labs. In the base case, enterprise software revenue would have developed slowly against massive
              training cluster overhead, necessitating continuous dilutive capital raises. In the realized bear case,
              escalating compute costs of $100M+ annually and prolonged 10-year therapeutic timelines outpaced
              commercial ARR generation, leading directly to acquisition by a non-profit institute.


              Peer comparables underscore this commercialization friction. While AlphaFold (DeepMind) leveraged
              Alphabet's balance sheet to spin out Isomorphic Labs and pursue pharma discovery deals, independent
              biological AI platforms like Recursion Pharmaceuticals and Insitro have raised over $1 billion while
              weathering intense public and private market scrutiny. For investors tracking secondary markets or prior
              stakeholders, primary diligence asks must focus on post-acquisition IP licensing rights, Forge API
              continuity for commercial biotechs, and the net payout realized by seed preferred shareholders under the
              CZI transaction.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Elimination of Venture Investment Opportunity
            body: >
              Our rating of avoid on EvolutionaryScale is purely structural: the company was absorbed into Chan
              Zuckerberg Biohub in November 2025, halting all secondary market share transactions and eliminating the
              possibility of an independent commercial IPO or trade sale. Investors should not pursue equity secondary
              purchases or assign speculative venture valuation multiples to EvolutionaryScale.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
          - type: callout
            title: The Biological Foundation Model Paradox
            body: >
              EvolutionaryScale's trajectory highlights a fundamental tension in generative biology: while model
              capabilities scale predictably with compute, drug development remains tethered to wet-lab validation and
              multi-year clinical timelines. The company projected $316 million in cumulative compute spend over three
              years, creating a financing burden that made non-profit foundation stewardship more sustainable than
              commercial venture ownership.
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV014
