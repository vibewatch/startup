      - number: '2.3'
        title: Customer Segmentation, Adoption Constraints, and Biohub Absorption
        blocks:
          - type: paragraph
            body: >-
              The target customer ecosystem for generative biology spans four primary segments: global pharmaceutical
              corporations, venture-backed biotechnology startups, academic research laboratories, and industrial
              bioprocess manufacturers (CM010). For top-tier biopharma enterprises, procurement decisions are governed
              by central R&D IT budgets and discovery biology leadership seeking to compress multi-year candidate
              discovery timelines (CM014). Distribution partnerships with Amazon Web Services via SageMaker and
              HealthOmics, alongside Nvidia NIM microservices, provided enterprise deployment rails allowing customers
              to fine-tune proprietary models behind corporate firewalls (CM005). Despite these commercial integrations,
              EvolutionaryScale's standalone trajectory was fundamentally disrupted in November 2025 when the Chan
              Zuckerberg Biohub acquired the company and integrated its core founding researchers into Biohub's
              scientific leadership (CM006). Industry observers interpreted this transaction as an effective end to
              EvolutionaryScale's existence as an independent venture-backed commercial entity (CM007). Under Biohub,
              strategic priorities shifted from commercial enterprise monetization toward open-science initiatives
              supported by massive GPU compute clusters, releasing models like ESM3 for non-commercial research and
              cloud collaboration (CM008, CM013).
            claimRefs:
