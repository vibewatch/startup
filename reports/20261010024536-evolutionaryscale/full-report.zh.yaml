              Chan Zuckerberg Biohub 收购 EvolutionaryScale，使研究团队免受风险融资压力，却给企业生物制药客户带来严重商业不确定性。Biohub 作为非营利研究机构运营，对企业级 SOC
              2 认证、正式 SLA 和专门客户成功基础设施的持续投入，优先级低于开放科学目标。
