            body: >-
              ESM3 可观察到的技术差异是多模态蛋白质建模。审阅过的架构说明确认，模型把六类输入嵌入共享表征，配备 Transformer 核心、任务专用输出头，以及基于 VQ-VAE 的结构路径；该路径把坐标转换为离散
              token，再以置信度输出重建坐标。同一来源描述的默认 ESM3 配置包括 1,536 维模型、24 个注意力头、256 个投票头和 48 层。这些细节让架构比泛泛的蛋白质 AI
