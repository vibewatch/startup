chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、结构演变与运营模式
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale 于 2024 年 2
              月注册为特拉华州公益公司，总部位于纽约州纽约市，并在加州旧金山设有研究工程办公室。公司成立的目标，是把生物尺度建模转化为可编程疗法与酶。被收购前，公司估计有 10 至 49
              名员工，主要是深度学习研究人员和计算生物学家。其商业模式将非商业开放研究发布，与通过 EvolutionaryScale Forge 云平台及 AWS、Nvidia 基础设施上的企业 API
              分发实现的专有变现结合起来。然而，由于没有强制公开 SEC 注册要求，历史商业收入、ARR 倍数和活跃客户名单从未得到独立披露。2025 年 11 月，Chan Zuckerberg Initiative
              将公司机构性吸收到 CZ Biohub，运营治理由独立、风险投资支持的商业实体，根本转为慈善科学研究组织。
