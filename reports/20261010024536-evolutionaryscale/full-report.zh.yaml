      - number: '3.2'
        title: 技术架构与功能矩阵差异化
        blocks:
          - type: paragraph
            body: >-
              生物基础模型的技术差异，取决于架构是把蛋白质当作孤立的序列字符串，还是同时推理序列、三维结构和生物功能这三个相互耦合的维度。EvolutionaryScale 的 ESM3
              可同时以坐标、功能关键词和序列基序为条件进行生成式提示，并通过从头生成 esmGFP 等荧光蛋白证明这一点，构成重要技术里程碑。但直接同业已在特定领域迅速达到或超过这一架构范围。Chai Discovery 的
              Chai-1 统一架构可预测含小分子配体和修饰碱基的复合物，覆盖纯蛋白模型难以处理的药物发现工作流。此外，EvolutionaryScale 虽支持开放权重、托管 API，以及 AWS Bedrock 和
              Nvidia NIM 云市场等灵活分发方式，但实际临床证据仍局限于计算预测和实验室概念验证，而非已验证的治疗候选物。AI Health Index 的第三方审查指出，EvolutionaryScale
              没有发布错误率校准或治疗管线候选物。企业合规评估还显示，公司完全没有独立 SOC 2 Type II 报告、ISO 27001
              认证或专门信任中心；企业生物制药采购委员会将其与成熟生命科学软件供应商比较时，这构成重大治理障碍。
