  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              EvolutionaryScale 由 Alexander Rives 和 Meta AI 蛋白质折叠团队前成员创立，在研究部门关闭后以空前技术势头进入生成式生物学领域。核心投资论点建立在生物尺度假设上：将
              Transformer 语言模型应用于海量生物数据集（包括 2.78 billion 条天然蛋白质序列、结构和功能注释），可从第一性原理解锁可编程生物工程。EvolutionaryScale 生成了模拟约 500
              million 年自然演化的荧光蛋白 esmGFP，验证其 98-billion-parameter 多模态模型 ESM3 能够工程化功能大分子。这建立了深厚技术壁垒，并得到 AWS（通过
              SageMaker、Bedrock、HealthOmics）和 NVIDIA（通过 BioNeMo 与 NIM 微服务）等重量级生态伙伴支持。


              然而，Chan Zuckerberg Biohub 于 2025 年 11 月吸收 EvolutionaryScale 后，反论点占了上风，距离其标志性 $142 million 种子轮仅 14
              个月。Forbes 获得的早期风险投资路演文件揭示了不可持续的成本轨迹：EvolutionaryScale 预计第一年运营支出为 $38 million（其中 $16 million 为算力），第二年升至
              $161 million（算力 $100 million），第三年升至 $278 million（算力 $200 million）。生物药物发现通常需要 7 至 10
              年才能开发出临床候选物，公司在几乎没有商业收入的情况下却面临巨大现金消耗，最终被迫转入非营利生物医学研究体系。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
      - number: '8.2'
        title: 融资背景、估值标记与建议
        blocks:
          - type: paragraph
            body: >
              EvolutionaryScale 于 2024 年 6 月完成规模非凡的 $142 million 种子融资，由 Nat Friedman、Daniel Gross 和 Lux Capital
              领投，Amazon 与 NVentures（NVIDIA）旗下企业风投部门参与。UpMarket 的私募二级市场数据估计，EvolutionaryScale 种子轮投后估值基准为 $1.21
              billion，二级市场追踪器的估值标记约为 $1.0 billion；此前 Forbes 报道其早期 pre-seed 估值标记为 $200 million，对应 $40 million
              融资。公司治理采用特拉华州公益公司（PBC）结构，将公共利益与商业回报并列为正式开放科学使命。


              尽管巅峰独角兽级估值标记超过 $1.2 billion，独立商业股权机会已经关闭。CZ Biohub 于 2025 年 11 月收购后，EvolutionaryScale
              股份不再通过私募二级平台提供。由于财务对价、股权处理和 Series A / 种子投资者的优先清算权完全未披露，从股权投资角度，EvolutionaryScale
              获得明确的回避评级，估值立场未知。该建议反映的是交易结构已经终结，而非技术不足：作为被吸收的研究部门，公司没有可行的私人风险资本进入路径或公开股权上行空间。
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
