              SLA 支持、商业许可可用性，以及是否会为开放科学非营利研究让路而弃用等方面，都面临严重运营不确定性。
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 战略吸收与公司治理风险
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale 面临的首要生存风险，是 2025 年 11 月被 Chan Zuckerberg Initiative（CZI）和 CZ Biohub 吸收后商业轨迹彻底中断。公司虽在
              2024 年 6 月筹得 $142 million 种子轮以商业化生成式生物学模型，但 2025 年 11 月的报道显示，CZ Biohub 聘用了 EvolutionaryScale 团队，独立 AI
              初创公司的终结已显现。这笔交易把公司使命从独立的高增长企业 SaaS 供应商，根本改成慈善研究部门。关键是，交易条款——包括现金对价、股票分配、知识产权转让契约，以及 Lux Capital、Amazon 和
              NVentures 等 Series A 优先投资者的清算优先权——仍未披露。如果研究重点偏离商业承诺，少数股东被搁置、商业激励错位和关键人员流失将构成严重治理挑战。
            claimRefs:
