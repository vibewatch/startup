  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              生物基础模型和生成式蛋白质设计的竞争场由四类运营者构成：风险投资支持的直接基础模型开发商、成熟科技生物企业、专业蛋白质工程 SaaS 平台，以及开源研究生态。EvolutionaryScale 于 2023 年从
              Meta 的 Fundamental AI Research（FAIR）蛋白质团队中诞生，希望用 98-billion-parameter 的 ESM3 架构建立通用生物基础模型。但 2025 年 11 月被
              Chan Zuckerberg Biohub 收购后，其竞争定位彻底改变，从激进的风险投资支持初创公司转为基金会支持的研究实体。直接同业中，Chai Discovery 等新进入者推出 Chai-1
              等多模态模型，无需多序列比对即可预测蛋白质、核酸和小分子之间的相互作用。与此同时，Cradle Bio 等专业工程供应商把 AI 嵌入迭代湿实验设计周期，处理下游实验室工作流。在市场高端，Alphabet 旗下
              Isomorphic Labs 利用庞大算力和专有 AlphaFold3 架构，争取数十亿美元规模的制药共同开发协议；Hugging Face
              上的开源社区则继续普及基础模型权重，给标准预测生物学任务带来显著降价压力。
            claimRefs:
