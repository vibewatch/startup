  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界定义与生成式生物学范围
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale 位于生物基础模型与计算生物制药工程的交叉地带。其主要产品 ESM3 是 98-billion-parameter 多模态生成模型，能够同时推理蛋白质序列、3D
              结构和生物功能（CM001）。核心可寻址边界包括企业基础模型 API
              访问、定制权重许可，以及用于药物发现和学术研究的计算机模拟蛋白质设计软件；实体湿实验机器人、高通量试剂筛选，以及缺乏生物领域基础的通用文本语言模型不在其中。平台已展示生成具有合成演化跃迁的新型荧光蛋白，但企业采用仍需把计算预测与严格的湿实验连接起来。EvolutionaryScale
              争议解决框架下的商业条款提供标准 SaaS 保护，包括纽约县强制约束性仲裁，以及将责任上限限制在历史已付费用内（CM009）。最初商业模式依靠企业 API 分层、云基础设施集成和下游许可费（CM004）。
            claimRefs:
              - CM001
              - CM004
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
