      - number: '3.3'
        title: 商业 GTM、定价模式与买方切换成本
        blocks:
          - type: paragraph
            body: >-
              生物基础模型商业化的特点是合同透明度低、制药项目范围定制化，以及买方严重锁定风险。EvolutionaryScale 采用双轨策略分发访问：以宽松许可免费提供开源权重，同时在 Biohub Platform
              上提供托管 API。SoftFinders 的软件行业分析和 AI Health Index 的平台评测显示，EvolutionaryScale
              没有透明的自助订阅定价，而是采用销售主导的定制生物制药合作协议和按积分计量的开发者控制台计费。开发者虽可获得名义上的初始免费 API
              积分，企业定价层级和批量费率表却完全未报价。限制性合同风险分配进一步放大了这种定价不透明。EvolutionaryScale 的官方争议条款将总责任严格限制在一百美元
              或客户过去十二个月付款额两者中的较高者，同时排除所有间接和后果性损害。对其专有靶序列代表数亿美元临床知识产权的生物制药买方而言，供应商责任上限、未经验证的安全控制和未对冲的云计算成本叠加，造成很高的切换摩擦和严重的多云使用顾虑。
            claimRefs:
              - CP007
