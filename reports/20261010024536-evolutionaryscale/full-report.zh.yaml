      - number: '1.2'
        title: 创始团队、科学谱系与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale 的人才与知识核心直接来自 Meta Platforms 的 Fundamental AI Research（FAIR）团队。联合创始人兼首席科学家 Alex Rives
              领导最初的 ESM 研究团队，于 2019 至 2023 年间开发 ESM-1、ESM-2 和 ESMFold 基础架构。Meta 内部重组并解散蛋白质部门后，Rives 与联合创始人 Salvatore
              Candido 一同离开；Candido 后任 CTO，深度学习研究员 Tom Sercu 也随之离开。研究文件中确认的其他技术联合创始人包括 Thomas Hayes、Roshan Rao 和 Halil
              Akin。运营高管也加入领导层，包括 COO Katrin Malin 和资深 CFO Tim Hanley。公司存续期间对 Rives 博士和 Candido
              博士的关键人物依赖始终极其严重，因为专有架构、多轨训练方法和 ESM 系列的科学地位，都与他们的直接领导不可分割。
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: 资本化历程、战略支持者与治理动态
        blocks:
          - type: paragraph
            body: >-
              2024 年 6 月 25 日，EvolutionaryScale 宣布完成计算生物学领域规模最大的首轮融资之一，获得 $142 million 种子轮融资。该轮由风险投资公司 Lux Capital
              与天使投资人 Nat Friedman、Daniel Gross 的合作伙伴关系 NFDG 共同领投，Amazon 和 Nvidia 的 NVentures 进行了战略性企业投资。此次资本化使
              EvolutionaryScale 的投后估值估计达到 $1.0 billion 至 $1.35 billion，反映市场对生成式生物学的强烈热情。公司通过多平台商业化巩固了与 Amazon、Nvidia
              的战略协同：承诺在包括 Bedrock 和 SageMaker 在内的 Amazon Web Services 环境部署 98-billion parameter 的 ESM3，同时接入 Nvidia NIM
              微服务以加速企业推理。尽管背后有一线投资者支持，但二级股权披露完全缺失，CZ Biohub 吸收后的后续财务条款也未公布，优先股持有人的实际财务回报因此无法判断。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO012
