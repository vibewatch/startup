      - number: '2.3'
        title: 客户细分、采用约束与 Biohub 吸收
        blocks:
          - type: paragraph
            body: >-
              生成式生物学的目标客户生态包括四类：全球制药公司、风险投资支持的生物技术初创公司、学术研究实验室和工业生物工艺制造商（CM010）。对顶级生物制药企业而言，采购决策由中央研发 IT
              预算和发现生物学负责人主导，他们希望压缩持续数年的候选物发现周期（CM014）。通过 SageMaker、HealthOmics 与 Amazon Web Services 的分发合作，加上 Nvidia NIM
              微服务，公司搭建了企业部署通道，让客户能在企业防火墙后微调专有模型（CM005）。尽管完成了这些商业集成，EvolutionaryScale 的独立轨迹在 2025 年 11 月发生根本变化：Chan
              Zuckerberg Biohub 收购公司，并将核心创始研究人员纳入 Biohub 科学领导层（CM006）。行业观察人士将这笔交易视为 EvolutionaryScale
              作为独立风险投资支持商业实体实际终结的标志（CM007）。进入 Biohub 后，战略重点从企业商业变现转向开放科学计划，由大规模 GPU 集群支持，并发布 ESM3
              等模型供非商业研究和云协作使用（CM008、CM013）。
