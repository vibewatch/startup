      - number: '7.2'
        title: 监管、生物安全与法律责任
        blocks:
          - type: paragraph
            body: >-
              生成式生物学和自主蛋白质设计在全球各司法辖区面临日益严格的监管审查。ESM3
              等前沿蛋白质语言模型理论上能够设计合成病原体、毒素或免疫逃逸大分子，监管机构和国家生物安全委员会因此正在建立严格合规壁垒。EvolutionaryScale
              以公益公司（PBC）运营，其争议政策规定约束性仲裁和责任上限。但合同责任保护不能让组织免受法定生物安全执法、模型权重出口管制或专有训练集知识产权争议的影响。此外，ESM 模型谱系直接源自 Meta
              FAIR，训练来源和开放权重许可边界可能存在残余风险，需要持续严格的法律监测。
            claimRefs:
              - CR004
              - CR005
              - CR010
