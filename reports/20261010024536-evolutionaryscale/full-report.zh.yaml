      - number: '1.4'
        title: 从 FAIR 谱系到 Biohub 整合的里程碑轨迹
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale 的运营轨迹从隐身分拆到被非营利机构吸收，推进速度前所未有。创始团队在 Meta FAIR 的 2019 至 2023 年间打下了序列尺度生物建模的学术基础。公司于 2024 年
              2 月注册后，在 2024 年 6 月正式发布 ESM3——一个用 2.78 billion 种天然蛋白训练、能够同时推理生物序列、3D 结构和酶功能的前沿语言模型。在一次标志性湿实验验证中，公司设计出
              esmGFP，这种合成荧光蛋白与天然水母 GFP 的序列同一性为 58%，理论上需要 500 million 年的自然演化漂移才能产生。之后，公司推出 ESM Cambrian
              序列表征系列，并采用要求在纽约县进行 JAMS 约束性仲裁的标准客户协议。2025 年 11 月，Mark Zuckerberg 宣布 CZI 收购 EvolutionaryScale 并将团队整合进
              Biohub，公司独立的法人存在随之结束。
