      - number: '3.4'
        title: 壁垒持久性与非营利治理风险
        blocks:
          - type: paragraph
            body: >-
              Chan Zuckerberg Biohub 于 2025 年 11 月收购
              EvolutionaryScale，对其竞争壁垒的长期持久性带来结构性影响。过去，前沿基础模型开发商通过持续且资本密集的预训练、庞大的专有湿实验验证循环，以及深度制药合作带来的商业收入维持防御性。Biohub
              体系永久解决了 EvolutionaryScale
              的近期资金续航问题，也减轻了反复融资的压力，但同时削弱了公司的商业一致性。非营利科学机构通常更重视公开科学发现、开放数据访问和学术合作，而不是商业生物制药赞助方要求的企业
              SLA、专门客户支持团队和专有知识产权保护。Chai Discovery 等风险投资支持的竞争者和 Isomorphic Labs
              等资金充足的老牌企业，正以定制商业条款积极争夺顶级制药管线；EvolutionaryScale
              可能滑向学术参考标准，而非不可或缺的商业工具。没有可验证的临床资产或企业级商业运营模式，其技术成熟度可能无法转化为持久商业特许经营。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP012
              - CP014
