  - id: FE001
    title: ESM 产品到交付栈
    type: stack
    summary: 有记录的产品路径从生物输入出发，经由 ESM3 多模态栈或 ESMC 表征栈，输出任务结果并通过本地或托管界面交付。
    data:
      layers:
        - label: 生物输入
          detail: 序列，加上 ESM3 专属的结构、功能与残基级模态
          modules:
            - 序列 token
            - 结构与功能轨道
        - label: 共享输入表征
          detail: ESM3 在 Transformer 处理前，将输入轨道嵌入共同表征
          modules:
            - 特定模态嵌入
            - 组合输入嵌入
        - label: ESM3 Transformer 核心
          detail: 有记录的默认配置处理组合后的多模态表征
          modules:
            - ESM3 TransformerStack
            - 注意力与投票头
        - label: 结构编码与解码
          detail: VQ-VAE 路径将坐标转换为离散 token，再重建坐标
          modules:
            - VQ-VAE 结构路径
            - 结构置信度输出
        - label: ESMC 表征路径
          detail: 更简单、聚焦序列的 Transformer 生成嵌入与 logits
          modules:
            - ESMC 表征路径
        - label: 输出与交付
          detail: 特定任务输出通过本地工具，或历史上描述的托管与合作伙伴渠道提供
          modules:
            - 特定任务头
            - SDK 与所述托管渠道
