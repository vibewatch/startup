      - number: '7.3'
        title: 运营依赖、计算密集度与商业弃用
        blocks:
          - type: paragraph
            body: >-
              EvolutionaryScale 的运营架构高度依赖第三方超大规模云厂商和专业算力硬件供应商。训练 ESM3 这类 98-billion-parameter 基础模型需要庞大 GPU 集群，因而严重依赖
              Amazon Web Services 和 NVIDIA。AWS HealthOmics 与 NVIDIA NIM 的合作虽提供了最初的企业分发渠道，但 CZ Biohub 收购后 Forge API
              的商业可行性仍深度不确定。企业生物制药客户要求多年正常运行时间承诺、SOC2/HIPAA 保证和专用 SLA 合同，而非营利学术体系可能没有能力或意愿持续提供。与此同时，Chai
              Discovery、Isomorphic Labs 等敏捷商业平台及开源模型的竞争压力，可能削弱 EvolutionaryScale 在企业中的心智份额。
