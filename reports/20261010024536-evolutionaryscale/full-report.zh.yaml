      - number: '8.3'
        title: 情景分析、可比公司与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              将 EvolutionaryScale 放进传统风险投资估值情景中评估，可以看出开放生物基础模型与商业药物研发管线之间存在严重的经济分化。在独立发展的乐观情景下，EvolutionaryScale 会将
              Forge 云平台商业化，获得持续性的企业 API 订阅收入，并像 DeepMind 的 Isomorphic Labs
              一样分享可观的药企里程碑收入。在基准情景下，企业软件收入相对于庞大的训练集群开销增长缓慢，公司不得不持续进行稀释性融资。在已经实现的悲观情景下，计算成本每年升至 $100M+ ，而长达 10
              年的治疗开发周期超过了商业 ARR 的生成速度，最终直接被一家非营利机构收购。


              可比公司进一步凸显了商业化阻力。AlphaFold（DeepMind）借助 Alphabet 的资产负债表分拆出 Isomorphic Labs，并推进药企发现合作；而 Recursion
              Pharmaceuticals 和 Insitro 等独立生物 AI 平台，在承受公开市场和私募市场的密集审视期间，已融资超过 $1
              billion。对跟踪二级市场或曾经持有股份的投资者而言，首要尽调应聚焦收购后的 IP 许可权、Forge API 对商业生物科技公司的持续支持，以及 CZI 交易下种子轮优先股股东最终获得的净回款。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV015
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 风险投资机会的结构性消失
            body: >
              我们对 EvolutionaryScale 给出规避评级，原因纯粹是结构性的：公司于 November 2025 被 Chan Zuckerberg Biohub 吸收，所有二级市场股份交易随之停止，独立进行商业
              IPO 或出售的可能性也不复存在。投资者不应寻求购买其股权二级份额，也不应给 EvolutionaryScale 套用投机性的风险投资估值倍数。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
          - type: callout
            title: 生物基础模型悖论
            body: >
              EvolutionaryScale 的发展轨迹凸显了生成式生物学中的根本矛盾：模型能力会随算力可预测地扩展，但药物开发仍受湿实验验证和多年临床周期约束。公司预计三年累计计算支出为 $316
              million，由此形成的融资负担，使非营利基金会托管比商业风险投资持有更可持续。
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV014
