            body: >-
              生物基础模型的竞争前沿已迅速超越孤立序列预测（如旧版 ESM2 或基础 AlphaFold），转向 ESM3、Chai-1
              等统一多模态系统，同时推理蛋白质序列、结构和功能结合。不过，商业差异化取决于实验命中率，而不是参数数量；因此，Cradle Bio 和 Isomorphic Labs
