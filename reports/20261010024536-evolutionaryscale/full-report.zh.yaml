      - number: '2.2'
        title: 可寻址市场规模、测算视角与估值足迹
        blocks:
          - type: paragraph
            body: >-
              生成式生物学软件的市场规模不能只依赖一个宽泛预测，而要从多个分析视角评估。独立行业分析师预计，AI 驱动的生物设计与生成式发现平台总市场到 2030 年约达 $15.0 billion，复合年增长率为
              28.5%（CM002）。在 2024 年约值 $8.2 billion 的更广泛临床前软件和信息学领域内，专注于计算机模拟生物基础模型的可服务可寻址市场，估计在北美和欧洲合计为 $1.8
              billion。EvolutionaryScale 的资本化反映早期投资者的强烈信念：2024 年 6 月由 Nat Friedman、Daniel Gross 和 Lux Capital 领投 $142
              million 种子轮，报告投后估值约 $1.0 billion（CM003、CM011）。但公司约 20 名员工的早期组织规模，以及未披露企业软件
              ARR，使其可服务可获取市场受到明显限制（CM004）。Chai Discovery、Generate Biomedicines、Cradle 和 Profluent Bio
              等直接同业也筹得大额风险资本，争夺分子结构预测和生物制剂工程的细分市场（CM012）。
