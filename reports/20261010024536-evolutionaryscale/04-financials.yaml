schemaVersion: "report-v2"
artifact: "financials"
slug: "evolutionaryscale"
runDate: "2026-10-10"
company:
  name: "EvolutionaryScale"
chapter:
  number: 4
  title: "Financials"
  summary: "EvolutionaryScale publicly described a hybrid monetization model spanning partnerships, usage fees, and revenue sharing, but the available evidence does not disclose revenue, ARR, realized pricing, gross margin, burn, cash, or runway. The $142 million seed financing established substantial historical funding, not current liquidity, and the reported CZI acquisition makes standalone financial underwriting dependent on transaction and continuity information that remains unavailable."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model is visible; pricing and revenue quality are not"
    body: >-
      The clearest public description is a hybrid model rather than a conventional
      subscription schedule. EvolutionaryScale told TechCrunch that it intended to
      earn through partnerships, usage fees, and revenue sharing, including possible
      pharmaceutical workflow integrations and a share of discoveries commercialized
      with researchers. Distribution was also expected through selected AWS and NVIDIA
      customers. That architecture creates several possible revenue units—model usage,
      negotiated enterprise contracts, and contingent downstream economics—but none of
      the reviewed sources supplies a list price, realized contract value, minimum
      commitment, discount schedule, or revenue-recognition policy. Free non-commercial
      access to the full model through Forge and a free academic route could support
      adoption, yet no conversion evidence connects that usage to paid demand.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI006", "CI011", "CI014"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "unit-economics-and-cost-structure"
    title: "Unit economics remain a diligence data room exercise"
    body: >-
      Public evidence does not permit calculation of gross margin, customer acquisition
      cost, payback, retention, utilization, or contribution margin. The product strategy
      is compute-intensive by design: TechCrunch described continued model scaling through
      larger datasets and greater computational power, while also reporting that a company
      pitch deck contemplated a decade before generative AI could help design therapies.
      That does not prove a specific burn rate, but it does make timing and service-delivery
      costs central to underwriting. A dedicated CFO and COO indicate that finance and
      operating functions existed, but management roles are not substitutes for audited
      financials. The investment case therefore requires customer-level billings, cloud
      and compute costs, support labor, revenue-share liabilities, and cohort economics.
    claimRefs: ["CI008", "CI009", "CI013", "CI014"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy-and-verdict"
    title: "Historical financing does not establish current capital adequacy"
    body: >-
      Multiple sources report a $142 million seed financing in June 2024, with backing
      associated with Nat Friedman, Daniel Gross, Lux Capital, Amazon, and NVentures.
      That figure is funding raised, not cash still available after model training,
      payroll, cloud commitments, or transaction costs. No reviewed source gives cash on
      hand, monthly burn, debt, runway, working-capital needs, or a next-round trigger.
      Clarity's displayed $5 per-security figure is explicitly model-derived and its
      underlying match, bid, ask, and volume fields are gated, so it is not a defensible
      company valuation. More importantly, a November 2025 report says CZI acquired
      EvolutionaryScale and established Biohub. Without consideration, investor treatment,
      assumed obligations, and product-continuity terms, the standalone margin and capital
      path cannot be underwritten.
    claimRefs: ["CI007", "CI010", "CI012", "CI014", "CI015"]
callouts:
  - calloutType: "risk"
    title: "No underwritable operating model"
    body: "Public evidence identifies possible monetization mechanisms but not realized revenue, unit economics, cash consumption, or remaining liquidity."
    claimRefs: ["CI001", "CI014", "CI015"]
  - calloutType: "recommendation"
    title: "Treat financing as historical, not available cash"
    body: "Use the reported $142 million only as a financing-history fact until bank statements, a cash bridge, burn history, and acquisition consideration are produced."
    claimRefs: ["CI007", "CI012", "CI015"]
tables:
  - id: "TI001"
    title: "Revenue streams and quality"
    columns: ["Stream", "Mechanism", "Unit", "Public status", "Revenue quality", "Diligence ask"]
    rows:
      - ["Usage fees", "Charge for model or platform consumption", "Not disclosed", "Planned model reported by TechCrunch", "Potentially recurring, but no volume or retention data", "Usage schedule, minimum commits, billings, and paid utilization"]
      - ["Enterprise partnerships", "Integrate ESM3 into pharmaceutical workflows", "Negotiated contract; terms undisclosed", "Example monetization route reported by TechCrunch", "Likely bespoke and potentially concentrated", "Executed contracts, ACV, term, renewal, and services content"]
      - ["Revenue sharing", "Share economics from discoveries commercialized using ESM3", "Share percentage and waterfall undisclosed", "Contemplated model reported by TechCrunch", "Back-ended, contingent, and long-duration", "IP ownership, milestone definitions, waterfall, and realized receipts"]
      - ["Free research access", "Non-commercial Forge access and free academic availability", "Free/non-commercial", "Publicly described", "Adoption funnel rather than direct revenue", "Active users, paid conversion, compute subsidy, and support cost"]
    notes: "Mechanisms are public descriptions, not evidence of executed contracts or recognized revenue; every price, mix, and realized-economics field remains undisclosed."
    claimRefs: ["CI001", "CI002", "CI003", "CI006", "CI014"]
  - id: "TI002"
    title: "Pricing and monetization evidence"
    columns: ["Offer or channel", "Contract model", "Public list price", "Realized price", "Qualification"]
    rows:
      - ["Forge full 98-billion-parameter model", "Non-commercial access", "Not disclosed", "Not disclosed", "TechCrunch reported non-commercial availability, not a paid tier"]
      - ["Smaller offline model", "Offline distribution", "Not disclosed", "Not disclosed", "Availability does not establish a monetization event"]
      - ["AWS channels", "Selected-customer cloud distribution", "Not disclosed", "Not disclosed", "SageMaker, Bedrock, and HealthOmics routes were prospective"]
      - ["NVIDIA NIM", "Selected customers with NVIDIA enterprise software license", "Not disclosed", "Not disclosed", "NVIDIA license economics attributable to EvolutionaryScale are unknown"]
      - ["Direct paid access", "Applicable agreement may reference amounts paid for model access", "Not disclosed", "Not disclosed", "The dispute policy contemplates paid access but provides no rate card"]
    notes: "No reviewed source provides a rate card, discount, minimum commitment, contract value, or recognized revenue; channel availability must not be read as sales."
    claimRefs: ["CI003", "CI004", "CI005", "CI011", "CI014"]
  - id: "TI003"
    title: "Unit economics and capital-adequacy ledger"
    columns: ["Metric", "Public value or status", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Revenue and ARR", "Not disclosed", "Low", "Prevents assessment of scale and revenue quality", "Audited monthly revenue, ARR bridge, and revenue-recognition policy"]
      - ["Gross margin", "Not disclosed", "Low", "Model inference, fine-tuning, and support costs may be material", "Revenue and cost of revenue by product and customer"]
      - ["CAC and payback", "Not disclosed", "Low", "Enterprise pharma integrations may require long technical sales cycles", "Sales spend, fully loaded CAC, pipeline conversion, and payback cohorts"]
      - ["Cash, burn, and runway", "Not disclosed", "Low", "Funding raised cannot establish current liquidity", "Bank statements, monthly cash bridge, burn history, and committed spend"]
      - ["Therapeutic time-to-value", "Pitch deck reportedly contemplated up to a decade", "Medium", "Long commercialization cycles delay contingent revenue sharing", "Program timelines, milestones, probability-adjusted economics, and cash needs"]
      - ["Historical financing", "$142 million seed financing reported in June 2024", "Medium", "Shows capital access but not remaining cash", "Cap table, proceeds schedule, use-of-funds bridge, debt, and preferences"]
      - ["Standalone continuity", "CZI acquisition reported in November 2025", "Medium", "Standalone forecasts may no longer describe the operating entity", "Purchase agreement, consideration, assumed liabilities, and post-close budget"]
    notes: "Values labeled not disclosed are evidence gaps rather than zeroes; the financing amount is cumulative capital raised and must not be treated as cash available."
    claimRefs: ["CI007", "CI008", "CI009", "CI012", "CI014", "CI015"]
figures:
  - id: "FI001"
    title: "Revenue model bridge"
    type: "flow"
    summary: "The public model branches from research adoption and selected cloud distribution into usage or partnership economics and contingent revenue sharing; gross-profit conversion is unquantified."
    data:
      nodes:
        - id: "research-access"
          label: "Free and non-commercial access"
          detail: "Forge and academic availability can seed scientific usage without directly proving revenue."
        - id: "adoption-proof"
          label: "Scientific adoption and proof"
          detail: "Usage may create technical validation, but no public paid-conversion rate is available."
        - id: "cloud-channels"
          label: "Selected AWS and NVIDIA channels"
          detail: "Prospective distribution expands reach; channel economics and availability continuity are undisclosed."
        - id: "pharma-integration"
          label: "Pharma workflow integration"
          detail: "Enterprise partnerships were presented as a route to embed ESM3 in discovery workflows."
        - id: "usage-partnership-revenue"
          label: "Usage fees or partnership revenue"
          detail: "Pricing, contract value, volume, and recognized revenue remain unavailable."
        - id: "commercialization-share"
          label: "Commercialization revenue share"
          detail: "Economics depend on a successful downstream discovery and an undisclosed sharing waterfall."
        - id: "gross-profit"
          label: "Gross profit after delivery costs"
          detail: "Compute, fine-tuning, support, channel fees, and revenue-share costs are not publicly quantified."
      edges:
        - from: "research-access"
          to: "adoption-proof"
          label: "builds usage"
        - from: "adoption-proof"
          to: "cloud-channels"
          label: "supports distribution"
        - from: "cloud-channels"
          to: "pharma-integration"
          label: "reaches selected customers"
        - from: "pharma-integration"
          to: "usage-partnership-revenue"
          label: "direct monetization path"
        - from: "pharma-integration"
          to: "commercialization-share"
          label: "contingent monetization path"
        - from: "usage-partnership-revenue"
          to: "gross-profit"
          label: "less delivery costs"
        - from: "commercialization-share"
          to: "gross-profit"
          label: "less sharing and delivery costs"
    approximationNotes: "Conceptual mechanism map only; it contains no estimated prices, conversion rates, revenue, or margins."
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI009", "CI014"]
