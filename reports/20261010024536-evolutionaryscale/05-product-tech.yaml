chapter:
  number: 5
  title: "Product & Technology"
  summary: "EvolutionaryScale's public product surface combines the multimodal ESM3 model, the representation-focused ESMC family, a Python SDK, and a historically described Forge hosted service. The architecture is technically specific, but current service continuity, independent performance validation, operational controls, and post-Biohub product ownership remain material diligence gaps."
sections:
  - id: "product-and-workflow"
    title: "Product Surface and User Workflow"
    body: "The evidence supports two distinct model jobs rather than one undifferentiated platform. ESM3 processes and generates protein sequence, structure, and function information, while ESMC is focused on protein representations and embeddings. The customer workflow therefore spans generative design and representation tasks: a practitioner can prepare biological inputs, run a model locally or through a described hosted interface, and then carry outputs into downstream computational or laboratory work. Public materials identify Forge, an ESM Python SDK, open weights, Hugging Face, and cloud-marketplace channels, but they do not establish present availability, production usage, service levels, or measured customer outcomes as of the run date. The module and workflow tables separate documented capabilities from those open operating questions."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-differentiation"
    title: "Architecture and Technical Differentiation"
    body: "ESM3's observable technical distinction is multimodal protein modeling. The reviewed architecture description identifies six input categories embedded into a shared representation, a transformer core, task-specific output heads, and a VQ-VAE-based structure path that converts coordinates to discrete tokens and reconstructs coordinates with confidence outputs. The same source describes a default ESM3 configuration with a 1,536-dimensional model, 24 attention heads, 256 voting heads, and 48 layers. These details make the architecture more concrete than generic protein-AI marketing, but they are code-derived documentation rather than an independent benchmark of accuracy, throughput, biological validity, or commercial advantage. ESMC provides a simpler representation path, so its value proposition should be evaluated separately from ESM3's generative claims."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-governance-and-continuity"
    title: "Deployment, Governance, and Continuity Risk"
    body: "Deployment evidence is strongest for the historical launch period. TechCrunch reported in June 2024 that the full 98-billion-parameter model would be available for non-commercial use through Forge, with a smaller model for offline use, and that selected AWS and NVIDIA channels were planned. A later independent API profile describes Forge, the SDK, open weights, and AWS Marketplace access, but also says EvolutionaryScale was integrated into Biohub in 2025 and that the SDK moved to the Biohub namespace. The public EvolutionaryScale GitHub organization still provides a developer signal, although the fetched page mainly exposes infrastructure forks and a partner-collaboration repository rather than a complete current roadmap. Governance is restrictive: the community license limits the open model to non-commercial purposes and prohibits drug-development uses, while the dispute policy sharply limits liability. No retained source establishes current uptime, support ownership, security certifications, privacy controls, incident history, or a post-integration commercial roadmap."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
