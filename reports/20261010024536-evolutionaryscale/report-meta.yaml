  productSummary: >-
    EvolutionaryScale’s product surface centered on the ESM family of protein language models — ESM3 for multimodal
    generative design, ESM Cambrian / ESM-C for representations, and a Forge hosted API with cloud distribution through
    AWS and NVIDIA. The open-weight and non-commercial release path supported scientific adoption, but the commercial
    continuity of the hosted surface after the CZ Biohub absorption is not publicly settled.
  customerFocus: Biopharma R&D teams, protein engineers, computational biologists, and academic/non-commercial researchers.
  businessModel: >-
    Usage-based API access, enterprise partnerships, cloud distribution, and downstream revenue-sharing concepts;
    open-weight releases functioned as adoption and lead-generation, not direct monetization.
  stage: acquired
  fundingStatus: >-
