companyProfile:
  summary: >-
    EvolutionaryScale was a New York-headquartered AI biology company founded by former Meta FAIR researchers around the
    ESM protein-language-model lineage. It commercialized ESM3 and ESM Cambrian through Forge, AWS, and NVIDIA channels,
    but public revenue was never disclosed and the team was absorbed into CZ Biohub in November 2025, ending the
    company’s standalone commercial path.
