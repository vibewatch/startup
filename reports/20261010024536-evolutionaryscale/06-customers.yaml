figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Six-stage adoption and governance lifecycle for EvolutionaryScale protein language models from open-weight testing to non-profit absorption."
    data:
      nodes:
        - label: "1. Open-Weight Discovery & Evaluation"
          stage: "Discovery"
          touchpoints:
            - "Hugging Face model hub downloads"
            - "GitHub repository cloning (github.com/evolutionaryscale)"
            - "Non-commercial ESM3 1.4B open-weight testing"
          friction: "Restrictive Community License prohibits commercial drug discovery"
        - label: "2. Computational Workflow Prototyping"
          stage: "Evaluation"
          touchpoints:
            - "Local Python SDK installation (pip install esm)"
            - "PyTorch multimodal sequence-structure-function inference"
            - "Benchmarking against AlphaFold and legacy ESM-2 models"
          friction: "Heavy multi-GPU hardware requirements and GPU memory constraints"
        - label: "3. Hosted Cloud Forge API Onboarding"
          stage: "Piloting"
          touchpoints:
            - "Forge developer platform portal (forge.evolutionaryscale.ai)"
            - "Bearer token authentication and API key provisioning"
            - "Managed batch generation and coordinate folding endpoints"
          friction: "Closed beta access queue and uncertain enterprise SLA terms"
        - label: "4. Cloud Enterprise Channel Deployment"
          stage: "Commercial Deployment"
          touchpoints:
            - "AWS SageMaker and AWS Bedrock model enablement"
            - "AWS HealthOmics genomic workflow integration"
            - "NVIDIA BioNeMo containerized NIM microservice execution"
          friction: "Complex enterprise cloud procurement and partner revenue splits"
        - label: "5. Wet-Lab Target Binding Validation"
          stage: "Experimental Validation"
          touchpoints:
            - "De novo protein candidate synthesis in wet laboratory"
            - "Assay testing for binding affinity, specificity, and stability"
            - "Iterative generative refinement using experimental feedback"
          friction: "High wet-lab failure rates and extensive computational costs"
        - label: "6. CZ Biohub Open-Science Governance"
          stage: "Post-Acquisition Transition"
          touchpoints:
            - "Migration of core repositories to Biohub namespace"
            - "Integration into CZ Biohub 10,000 GPU research infrastructure"
            - "Deprecation of standalone commercial GTM in favor of open science"
          friction: "Total cessation of independent commercial software support and roadmap"
    approximationNotes: "Stages synthesize documented developer onboarding surfaces, cloud marketplace channels, and post-acquisition Biohub transition milestones."
    claimRefs:
