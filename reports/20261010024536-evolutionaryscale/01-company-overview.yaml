callouts:
  - calloutType: risk
    title: Commercial Standalone Viability Terminated by Nonprofit Absorption
    body: The acquisition of EvolutionaryScale by the Chan Zuckerberg Initiative in November 2025 effectively closed the standalone venture chapter for the company. While providing stable philanthropic capital and expanded computing power, it eliminates an independent commercial software or biotechnology equity thesis.
    claimRefs:
      - CO011
  - calloutType: insight
    title: Scientific Continuity Mitigates Spin-Out Execution Friction
    body: By maintaining the intact core research group from Meta AI FAIR, EvolutionaryScale bypassed typical early-stage technical exploration friction, delivering frontier biological models and wet-lab validations within four months of incorporation.
    claimRefs:
      - CO002
      - CO008
