  - type: missing-source
    severity: material
    topic: acquisition
    missingEvidence: >-
      Public disclosure of the acquisition transaction terms between CZI, CZ Biohub, and EvolutionaryScale, including
      treatment of Series A preferred stock held by Lux, Nat Friedman, Daniel Gross, Amazon, and Nvidia.
    whyItMatters: >-
      Without financial terms or equity treatment, the economic return to venture investors and standalone capital
      efficiency cannot be evaluated.
    diligencePath: >-
      Review future tax filings or non-profit Form 990 disclosures from Chan Zuckerberg Biohub Network, or solicit
      direct investor commentary.
    relatedQuestionRefs:
      - QO009
