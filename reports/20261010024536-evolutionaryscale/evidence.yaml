    severity: material
    topic: financials
    missingEvidence: Audited income statements, ARR run-rates, customer contract values, or Forge API transaction volumes.
    whyItMatters: >-
      Precludes quantitative valuation multiples and unit-economic assessment of commercial protein language models
      prior to absorption.
    diligencePath: >-
      Confidential customer diligence with pharmaceutical partners utilizing Forge or cloud provider telemetry from AWS
      and Nvidia.
    relatedQuestionRefs:
      - QO005
