callouts:
  - calloutType: "risk"
    title: "Commercial Alignment Risk Under Non-Profit Governance"
    body: "EvolutionaryScale's acquisition by the Chan Zuckerberg Biohub insulates its research team from venture financing pressures but introduces severe commercial uncertainty for enterprise biopharma customers. Because Biohub operates as a non-profit research institution, ongoing investments in enterprise-grade SOC 2 certifications, formal SLAs, and dedicated customer success infrastructure are secondary to scientific open-science objectives."
    claimRefs:
      - "CP001"
      - "CP010"
      - "CP011"
      - "CP014"
  - calloutType: "insight"
    title: "The Shift from Sequence-Only Modeling to Multi-Modal Molecular Generation"
    body: "The competitive frontier in biological foundation models has moved rapidly beyond isolated sequence prediction (such as legacy ESM2 or basic AlphaFold) toward unified multi-modal systems like ESM3 and Chai-1 that reason simultaneously over protein sequence, structure, and functional binding. However, because commercial differentiation depends on experimental hit rates rather than parameter counts, competitors with tight wet-lab integration like Cradle Bio and Isomorphic Labs maintain significant real-world advantage."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP012"
      - "CP013"
