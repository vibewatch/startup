  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: >
        Current ARR, quarterly revenue, revenue by stream (early-access, API, enterprise license),
        and trailing growth rate; none are publicly disclosed.
      whyItMatters: >
        Without any revenue anchor, no revenue-based valuation, DCF, or comparable-company multiple
        can be constructed; the $2B valuation cannot be assessed against financial fundamentals.
      diligencePath: >
        Request audited or management-prepared P&L from data room; obtain ARR by cohort and contract
        type under NDA; confirm whether any stream has reached meaningful scale.
      relatedQuestionRefs: [QI001, QI007, QI017, QI021, QI024]
      relatedTableRefs: [TI001, TI005]

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >
        Gross margin or contribution margin by revenue stream; COGS breakdown by component (cloud
        compute, inference serving, data egress, customer support); gross margin trend over time.
      whyItMatters: >
        Gross margin determines the scalability ceiling and whether unit economics improve with scale
        or are structurally impaired by inference compute costs exceeding software norms.
      diligencePath: >
        Request COGS breakdown and reconciliation to gross profit from management; benchmark inference
        compute cost per robot-hour against H100/A100 market pricing; compare to Physical Intelligence SaaS model.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003, TI005]

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >
        Customer acquisition cost (CAC), lifetime value (LTV), payback period, average contract value,
        churn rate, and net revenue retention for early-access partners.
      whyItMatters: >
        CAC/LTV ratio and payback period determine whether the GTM model is economically sustainable
        at scale; with long industrial sales cycles, high CAC relative to initial contract value is
        structurally plausible and must be confirmed or refuted.
      diligencePath: >
        Request sales team cost allocation, average deal cycle duration, average contract value,
        and renewal rate from management; obtain at least one representative contract as data room exhibit.
      relatedQuestionRefs: [QI009]
      relatedTableRefs: [TI003, TI005]

    - type: missing-source
      severity: material
      topic: pricing-model
      missingEvidence: >
        Generalist AI's actual pricing model—whether per-robot subscription, enterprise site license,
        API consumption, or hybrid—has not been publicly disclosed; no pricing page, press release,
        or customer interview is available.
      whyItMatters: >
        The pricing model determines revenue scalability, unit economics, and competitive positioning
        relative to Physical Intelligence and other entrants; a fundamentally different model (e.g.,
        revenue share or outcome-based) would change the financial analysis materially.
      diligencePath: >
        Request standard master services agreement and pricing schedule from management; ask for
        description of all commercial contract structures in use and any list vs. realized pricing discount.
      relatedQuestionRefs: [QI002, QI021]
      relatedTableRefs: [TI002, TI005]

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: >
        Monthly burn rate by category (compute, headcount, data operations, capex, G&A);
        actual cash balance at most recent fiscal quarter-end; bridge from round close to runway.
      whyItMatters: >
        Runway calculation and next-round timing are unknowable without confirmed burn; the $400M
        raise could last anywhere from 27 to 80 months depending on burn scenario, a range too
        wide to be useful for capital planning or investment modeling.
      diligencePath: >
        Request monthly P&L for trailing twelve months and current forecast; obtain CFO or CEO
        narrative on burn by category; cross-reference against headcount and compute procurement data.
      relatedQuestionRefs: [QI005, QI006]
      relatedTableRefs: [TI004, TI005]
