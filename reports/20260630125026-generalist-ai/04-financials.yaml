  - id: public-traction-and-gaps
    title: Public Financial Metrics and Evidence Gaps
    body: >
      Generalist AI is a private company and has not disclosed any revenue, ARR, customer count, gross
      margin, or unit-level financial metrics. The company's public disclosure profile is limited to
      (a) funding round announcements with post-money valuation, (b) model release blog posts, and
      (c) hiring activity on Ashby and the company careers page. No investor relations materials,
      audited financials, or secondary-transaction data are publicly available.

      The only indirect traction signals available are qualitative: 8VC's phrase "early commercial
      traction," the company's own reference to a data flywheel "beginning to take shape" with
      real businesses, and the Robot Report's citation that "early-access partners can now gain access
      to the model" as of April 2026. None of these constitute confirmed revenue.

      The gap between available public information and the data needed for financial underwriting is
      substantial. Revenue, ARR, gross margin, churn, customer concentration, and burn rate are all
      private-evidence-only metrics that would require direct management disclosure or audited financial
      records to resolve. Until these gaps are closed, any financial model of Generalist AI rests on
      assumptions about business model analogs (Physical Intelligence, other embodied AI SaaS companies)
      rather than actual disclosed data.
    claimRefs:
      - CI027
      - CI028
      - CI029
      - CI033
      - CI034
    tableRefs:
      - TI005

  - id: capital-adequacy
    title: Capital Adequacy and Financing Dependency
    body: >
      As documented in the Company Overview chapter, Generalist AI closed a first round of approximately
      $140 million in March 2025 and a second round of $400 million in June 2026, bringing total
      disclosed capital raised to more than $500 million. The June 2026 round was announced on June 4,
      2026; assuming a typical 30–60 day period between signing and disbursement, the cash deployment
      began approximately mid-June 2026. No debt facilities, convertible notes, credit lines, or
      project-finance obligations have been publicly disclosed; the company's balance sheet appears to
      be entirely equity-funded.

      The stated planned use of the $400M fresh capital is explicitly: building next-generation models,
      scaling the physical data engine, expanding compute and training infrastructure, and advancing
      industry partnerships. This is entirely pre-revenue infrastructure investment; no indication of
      acquisition capital or share repurchase. The implicit next-round trigger is the successor model
      generation (GEN-2) achieving performance thresholds that justify another valuation step-up—the
      GEN-0 to GEN-1 interval was approximately five months, and the GEN-1 to Series B interval was
      two months, suggesting the cadence is brisk.

      At a $10M/month midpoint burn estimate, Generalist AI would exhaust the $400M (assuming zero
      revenue offset) in approximately 40 months from close (late 2029). At $15M/month, runway shrinks
      to ~27 months (~September 2028). At $5M/month (optimistic lower bound for a 70-person frontier
      AI lab), runway extends to ~80 months. Physical Intelligence, at roughly 5× the valuation and
      a larger team, operates a model that investors describe as requiring successive large capital
      infusions to maintain data and compute scale—implying Generalist AI faces a structural funding
      dependency that does not resolve until revenue reaches a meaningful offset of the cost base.
      At Physical Intelligence's $300/robot/month pricing model, breaking even at a $10M/month burn
      would require approximately 33,333 concurrently billed robots—a fleet deployment that is years
      away at any plausible current adoption rate.

      The $2B valuation (five times the March 2025 level of $440M) was set in a private negotiation;
      no independent third-party valuation has been published. Comparable company Physical Intelligence
      is reportedly raising at $11B—placing Generalist at roughly one-fifth the competitor valuation
      while claiming architectural differentiation and earlier-to-market cross-embodiment generality.
