callouts:
  - calloutType: risk
    title: No Public Revenue — Underwriting Requires Data Room Access
    body: >
      Generalist AI has disclosed no revenue, ARR, customer names, or pricing as of June 2026. The business
      is in an early-access partner phase. Any financial underwriting at the $2B valuation requires NDA-protected
      data room disclosure of ARR, contract terms, burn rate, and pricing model. The absence of public metrics
      is not unusual for an early-stage deep-tech company, but it means the $2B valuation is priced entirely
      on future optionality, team quality, and technical differentiation—not current financial performance.
    claimRefs:
      - CI002
      - CI027
      - CI028
      - CI037

  - calloutType: risk
    title: Capital-Intensive Scaling Treadmill — Each Model Generation Resets the Clock
    body: >
      The data-scaling approach that underpins Generalist AI's thesis requires successive large capital
      deployments to train each model generation. Brad Porter (Cobot, former Amazon VP of Robotics)
      has explicitly flagged that "brute-forcing data against imperfect architectures is really expensive
      and not necessarily going to get you the result you want." This is a structural financial risk: if
      the cost to train GEN-2, GEN-3, etc. compounds faster than the revenue flywheel generates offsetting
      cash, each successive round must be larger or the competitive position degrades. The company's own
      30-month cadence (two models, two rounds) is consistent with this pattern.
    claimRefs:
      - CI018
      - CI020
      - CI030
      - CI031

  - calloutType: insight
    title: Software-First Model Implies Strong Long-Term Margin Potential
    body: >
      Generalist AI's hardware-agnostic software strategy, if successful, creates a structurally
      attractive margin profile at scale. Physical Intelligence's analyst-described model (60–80% gross
      margin, similar to software SaaS) suggests that a hardware-agnostic per-robot API or subscription
      business can generate high gross margins once the revenue base grows to cover inference costs.
      The critical inflection is when fleet deployment at scale creates the revenue-per-training-run
      ratio that makes the compute investment economically rational.
    claimRefs:
      - CI005
      - CI034
      - CI036

