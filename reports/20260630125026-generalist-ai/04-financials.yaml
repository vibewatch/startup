company:
  name: Generalist AI

chapter:
  number: 4
  title: Financials
  summary: >
    Generalist AI has raised more than $500 million across two rounds (March 2025 and June 2026) and
    carries a $2 billion post-money valuation, but has disclosed no revenue, ARR, customer names, pricing,
    or burn metrics. The business is pre-commercial by public evidence—operating a controlled early-access
    partner program for GEN-1 as of the June 2026 runDate. Capital intensity is structurally very high
    due to frontier model training compute, physical data engine operations, and the hiring profile of a
    70-person research-dense team; analogous firms (Physical Intelligence) spend at a pace that implies
    a capital treadmill materially longer than a single round, and independent critics including Brad Porter
    of Cobot and Yann LeCun challenge the scalability economics of the data-scaling approach.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: >
      Generalist AI is explicitly a pure software company—it does not manufacture robots—and has
      positioned itself as the cross-form-factor "intelligence layer" that works across humanoid arms,
      industrial 6-DoF arms, and mobile platforms. The commercial proposition is that robot operators
      (manufacturers, system integrators, enterprise logistics operators) purchase access to the GEN-1
      foundation model and fine-tune it to their specific hardware and task using approximately one hour
      of robot-specific data. This is structurally analogous to a cloud AI API or per-deployment software
      license rather than a hardware sale, placing the gross margin profile closer to software SaaS than
      to robotics hardware vendors.

      No pricing has been publicly disclosed. The only confirmed monetization signal is the early-access
      partner program for GEN-1 launched in April 2026—access is granted to selected industry partners,
      and the company has not named any customer or disclosed any contract terms. The June 2026 funding
      announcement describes a "data flywheel beginning to take shape: real businesses are generating
      task data that feeds successive model generations," implying early paid or contractual deployments
      exist, but the revenue scale is unknown.

      The closest publicly disclosed pricing analog is Physical Intelligence, which operates a
      per-robot SaaS model priced at $300 per connected robot per month according to Sacra analyst
      research. If Generalist AI adopts a similar per-robot subscription model, $3,600 per robot per
      year would imply that achieving $10M ARR requires approximately 2,800 deployed robots—a fleet
      scale that requires both significant enterprise adoption and hardware partner distribution.
      Generalist AI has not confirmed any such pricing; this is an estimated analog only. A higher-value
      enterprise licensing model (flat annual license per facility or per robot type) is equally plausible
      and would alter unit economics materially. Revenue recognition under a per-robot SaaS model is
      straightforward; under a custom enterprise model it may involve milestone-based recognition,
      creating complexity as the company scales.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
