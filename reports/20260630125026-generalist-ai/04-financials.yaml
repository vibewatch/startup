  - id: gtm-and-commercial-traction
    title: GTM Motion and Commercial Traction Signals
    body: >
      Generalist AI's go-to-market motion, as inferrable from job listings and investor commentary, is
      a high-touch enterprise motion in the early phases: a single "Applied AI & Partnerships" role is the
      only outward-facing commercial position open as of June 2026, suggesting a lean commercial team
      relative to the research headcount. This is consistent with a seed-stage GTM pattern common to
      deep-tech AI labs: the founding team leads key relationships, early customers are strategic
      partners rather than volume accounts, and deal cycles are long and often tied to joint data
      collection or integration projects.

      The 8VC investment memo describes "remarkable early commercial traction" as a signal that drove
      their investment conviction, and Spark Capital's Fraser Kelton cited early commercial validation
      in robotics scaling. Neither investor confirmed customer names or revenue metrics. The company's
      June 2026 blog explicitly describes a data flywheel as having begun—real businesses generate task
      data for the next model generation—which implies revenue-generating or data-sharing contractual
      relationships exist at some scale. The absence of named customers is consistent with confidentiality
      requirements in enterprise robotics deployments (factory-floor automation projects are typically
      disclosed later, if at all), but also consistent with pre-commercial status.

      Sales cycle proxies for embodied foundation model platforms are long: a typical industrial
      automation qualification cycle runs six to eighteen months, including hardware compatibility
      validation, safety qualification, and production trial. Customer acquisition cost for such cycles
      is structurally high relative to initial contract value, making the payback period a critical
      but unverifiable metric. No CAC, LTV, or payback estimates are publicly disclosed.
    claimRefs:
      - CI006
      - CI024
      - CI025
      - CI026
      - CI028
      - CI029

  - id: cost-structure-and-capital-intensity
    title: Cost Structure and Capital Intensity
    body: >
      Generalist AI's cost structure has three dominant dimensions: (1) frontier model training compute,
      (2) physical data engine operations, and (3) research and engineering talent. The company rebuilt
      its distributed training infrastructure for GEN-1 to "support petabytes of physical interaction
      data as a first-class citizen"—language that implies significant ML infrastructure capex and
      ongoing cloud or owned-cluster spend. Industry benchmarks suggest a single frontier robotics
      foundation model training run at 10B+ parameters on 500,000 hours of video-and-action data could
      cost $10M–$100M in compute alone; with successive model generations planned, training amortization
      is a material recurring cost category.

      Data engine operations—running the wearable "data hands" devices globally at a rate of 10,000+
      hours per week—require an ongoing labor and device logistics cost that is structural rather than
      one-time. Unlike text scraping, physical interaction data requires human operators, on-site lab
      managers, device maintenance, and data labeling infrastructure. NVIDIA NVentures' presence as a
      strategic reinvesting investor signals both GPU dependence and possibly preferential hardware
      supply considerations, but no compute pricing advantage has been publicly confirmed.

      With approximately 70 employees drawn predominantly from Google DeepMind, OpenAI, and Boston
      Dynamics, average total compensation is likely well above the industry median, consistent with
      frontier AI research talent economics. Industry estimates place the monthly burn rate for
      comparable embodied AI startups (50–100 employees with intensive compute) at $5M–$15M per month.
      This is an estimate only—the actual figure has not been disclosed. At $10M per month burn (midpoint),
      the $400M fresh raise implies approximately 40 months of runway from June 2026, or roughly through
      late 2029, before adjusting for any revenue offset.
    claimRefs:
      - CI018
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
