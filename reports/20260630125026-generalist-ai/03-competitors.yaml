callouts:
  - title: "Skild AI's Zebra Acquisition Creates Distribution Gap That Cannot Be Closed by Model Quality Alone"
    body: >
      Skild AI's April 2026 acquisition of Zebra Technologies' Robotics Automation business transforms
      a direct model-layer competitor into an enterprise automation platform with battle-tested AMR
      orchestration infrastructure and pre-existing logistics customer relationships. For Generalist AI,
      which has no disclosed commercial customers or distribution partners as of June 2026, this
      acquisition widens a structural gap: model capability alone cannot win enterprise contracts that
      require WMS integration, fleet orchestration, and customer success infrastructure. The window for
      Generalist to establish independent enterprise distribution before Skild's platform becomes the
      default choice for warehouse deployments is estimated at 12–18 months.
    claimRefs:
      - CP011
      - CP013
      - CP025
      - CP031

  - title: "NVIDIA GR00T as Existential Pricing Floor"
    body: >
      NVIDIA's strategic decision to release GR00T N1.6 as free open-source software establishes a
      permanent willingness-to-pay ceiling for robot foundation model software. Any commercial pricing
      for Generalist AI's GEN-1 or GEN-2 must be justified relative to a free alternative from the
      world's leading AI infrastructure provider. This pricing floor does not eliminate the market for
      paid models — real-world adaptation data, customer success support, and performance guarantees
      remain differentiated — but it compresses the addressable pricing range and creates continuous
      downward pressure on enterprise AI robotics contracts.
    claimRefs:
      - CP021
      - CP027
      - CP030

