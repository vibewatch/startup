        - Enterprise SaaS + orchestration platform
        - Not publicly disclosed; estimated $200K–$5M+ annual enterprise contracts
        - Skild Brain model; Symmetry orchestration; AMR fleet coordination
        - Low (enterprise negotiated)
        - Zebra acquisition may enable bundled hardware+software pricing that pure-model players cannot match
      - - Figure AI (Helix)
        - Robot-as-a-Service (RaaS) hardware + AI
        - Not disclosed; hardware ~$150K–$300K/unit estimated (third-party)
        - Figure 03 robot; Helix on-device AI; OTA updates; teleoperation support
        - Low (no published price sheet)
        - Full-stack hardware moat; pure-model players cannot compete directly on RaaS
      - - Google DeepMind (Gemini Robotics ER 1.6)
        - Cloud API + enterprise pilot contracts
        - No public pricing; base Gemini API from $0.075/1M tokens (non-robotics tier)
        - VLA API; on-device model (mid-2026); MuJoCo simulator; SDK; early-access program
        - Very low (robotics pricing not published; enterprise negotiated)
        - Google's ability to subsidize robotics models with Gemini API revenue enables below-cost pricing
      - - NVIDIA (GR00T N1.6)
        - Free / open-source model
        - $0 for model weights (Apache/CC license)
        - GR00T N1.6 VLA weights via Hugging Face; Cosmos simulation (separate subscription); Jetson Thor hardware
