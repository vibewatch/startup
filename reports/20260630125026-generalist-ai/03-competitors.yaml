  - id: s2
    title: Key Competitor Profiles
    body: >
      Physical Intelligence (π.ai), founded in March 2024 by former Google Brain and Berkeley robotics
      researchers including Sergey Levine, Chelsea Finn, and Karol Hausman, is Generalist AI's closest
      ideological peer. Its π0/π0.5 models are Vision-Language-Action (VLA) systems trained on 10,000+
      demonstration hours across 7-8 robot platforms. As of March 2026, Physical Intelligence was in talks
      to raise approximately $1 billion at an $11 billion valuation, with Founders Fund and Lightspeed
      in discussions — a doubling of its $5.6B valuation from November 2025. Unlike Generalist AI, Physical
      Intelligence has open-sourced its model weights via the openpi repository, creating an academic
      developer community but also raising commoditization risk. Both companies are pre-revenue; Physical
      Intelligence has not publicly announced commercial deployments or pricing.

      Skild AI, founded in 2023 and based in Pittsburgh, raised $1.4 billion in a Series C round at a
      $14 billion valuation led by SoftBank and NVIDIA in early 2026. Skild reported approximately $30
      million in revenue within months of its commercial launch in 2025 — the only software-pure competitor
      to have achieved disclosed commercial traction at this scale. In April 2026, Skild acquired Zebra
      Technologies' Robotics Automation business including the Symmetry Fulfillment orchestration platform,
      transforming from a pure AI model company into a full warehouse automation solution integrating
      humanoids, mobile robots, arms, and robotic dogs. This acquisition gives Skild enterprise distribution
      infrastructure that Generalist AI lacks. Skild's "omni-bodied" Skild Brain model claims cross-embodiment
      generalization with a dataset it describes as "1,000 times larger than most competitors" — a claim
      that has not been independently verified by published benchmark.

      Figure AI, founded in 2022 by Brett Adcock and headquartered in Sunnyvale, has raised approximately
      $1.9 billion total at a $39 billion post-money valuation following its September 2025 Series C led by
      Parkway Venture Capital with participation from Brookfield, NVIDIA, Microsoft, OpenAI Startup Fund,
      and Jeff Bezos. Its Figure 03 humanoid robot runs Helix, a three-layer VLA system (S0 whole-body
      control, S1 visuomotor, S2 semantic reasoning) that operates entirely on embedded GPUs without cloud
      connectivity. Figure's BMW Spartanburg deployment — 90,000+ parts loaded over 1,250+ runtime hours
      contributing to 30,000+ vehicles — is the most documented commercial humanoid deployment by any
      competitor. Figure represents a full-stack competitor for enterprise contracts, not just a model peer.

      Google DeepMind brings asymmetric competitive resources via the Gemini Robotics 1.5 and ER 1.6 models
      released in 2026. Gemini Robotics ER 1.6 is a cloud-accessible VLA API for developers accessible via
      an early-access/waitlist program, and a new "on-device" variant announced mid-2026 allows local
      inference for latency-sensitive industrial applications. Google's competitive advantages include
      web-scale multimodal pretraining data orders of magnitude larger than any startup, Alphabet's compute
      infrastructure, and existing OEM partnerships with Boston Dynamics, Apptronik, and Agility Robotics.
      No public pricing has been released for Gemini Robotics. Boston Dynamics commercially launched its
      electric Atlas humanoid at CES 2026, with all 2026 production units committed to Hyundai's RMAC and
      Google DeepMind. Atlas is integrated with Google DeepMind AI foundation models and Boston Dynamics'
      Orbit software (MES/WMS integration). Estimated pricing is $150,000–$420,000 per unit.

      NVIDIA positions itself as picks-and-shovels infrastructure for the entire robotics ecosystem. Its
      GR00T N-series (N1 through N1.7, with N1.6 released at CES 2026) is open-source and free to any
      developer, distributed via Hugging Face. NVIDIA's business model is to give away the model layer and
      monetize via GPU hardware sales (Jetson Thor, DGX) and Cosmos simulation subscriptions. GR00T N1.6
      is adopted by NEURA Robotics, Humanoid, Franka Robotics, and integrated with HuggingFace LeRobot.
      Amazon, through its 2024 talent acquisition of Covariant's founders (Pieter Abbeel, Peter Chen,
      Rocky Duan) plus a non-exclusive IP license, is building its own in-house robot AI capability
      across its 750,000+ robot fleet. Covariant raised $100 million in February 2025 and continues
      independently, but its talent exodus weakened its competitive position. OpenAI launched a dedicated
      robotics division in 2026, having previously been an investor in both Figure AI and Physical
      Intelligence — representing a late but well-resourced entrant to the foundation model category.
