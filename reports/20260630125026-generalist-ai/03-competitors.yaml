  - id: TP004
    title: Moat Durability and Competitive Risk Register
    description: Assessment of Generalist AI's claimed competitive moats, identified threats, severity, and diligence asks.
    columns:
      - Moat Claim
      - Threat
      - Threat Severity
      - Mitigation or Diligence Ask
    rows:
      - - "Proprietary physical-interaction dataset (500K hrs wearable-sensor data; claimed world's largest)"
        - >-
          NVIDIA EgoScale and Cosmos synthetic data generation provide alternative scaling paths;
          Physical Intelligence RT-X open dataset aggregates 100+ robot embodiments; scale claims
          are not independently verified
        - High
        - >-
          Validate dataset uniqueness vs RT-X and NVIDIA synthetic data via independent technical
          audit; confirm dataset cannot be replicated by wearable sensor competitors (micro1, Scale AI)
      - - "Architectural novelty (training from scratch; not a VLA fine-tune; not a world model)"
        - >-
          Architecture innovations in ML have historically short competitive lifespans; NVIDIA GR00T
          N1.6 uses similar from-scratch training logic; PI's openpi allows reverse-engineering of
          architectural choices
        - Medium
        - >-
          Confirm GEN-2 architectural roadmap; assess whether "trained from scratch" claim protects
          against capability leapfrog by resource-rich incumbents
      - - "Hardware-agnosticism (cross-embodiment; one model for all robot bodies)"
        - >-
          Vertically integrated competitors (Figure AI, Boston Dynamics) achieve higher
          hardware-software synergy through hardware-specific tuning; if hardware lock-in dominates,
          model-agnostic players lose the deployment channel
        - Medium
        - >-
          Assess which robot OEMs are signed up for early-access program; confirm Generalist AI is
          not locked out of key humanoid hardware platforms by competitor exclusivity agreements
      - - "Data flywheel (real-world deployments generate training data compounding advantage)"
        - >-
          Flywheel requires commercial deployments at scale; with no disclosed customers, the flywheel
          has not yet activated; Skild AI's Zebra acquisition gives a competitor an active enterprise
          deployment flywheel while Generalist AI's remains theoretical
        - High
        - >-
          Verify early-access partner volume and data contribution terms; confirm data flywheel
          agreement mechanics; assess how many robot-hours of new data are generated per early-access
          partner
      - - "Researcher / founder pedigree (Pete Florence co-invented VLAs; ex-DeepMind / Boston Dynamics team)"
        - >-
          Key-person concentration — company narrative, fundraising, and technical credibility are
          tightly coupled to Florence and Zeng; acqui-hire risk from Google, Microsoft, or Amazon at
          current $2B valuation is asymmetrically low vs target for a $10B+ offer
        - Medium
        - >-
          Confirm founder retention mechanisms (equity vesting, non-competes); evaluate depth of
          second-tier research bench; assess governance structure and independent board oversight
    notes: >
      Threat severity is an analyst assessment based on public evidence as of June 2026. Generalist AI has
      not disclosed information on robot-hours generated by early-access partners, customer list, or
      contractual exclusivity terms.
    claimRefs:
      - CP027
      - CP028
      - CP029
      - CP030
      - CP031
    enumerationScope:
      coverage: exhaustive
      basis: >
        Five moat claims and their corresponding threats are assessed. This is considered an exhaustive
        list of the primary moats and risks based on available public evidence; undisclosed commercial
        terms, technical architecture, or customer data may reveal additional moats or risks.

figures:
  - id: FP001
    title: Competitive Positioning Map — Capital Raised vs Commercial Traction
    type: quadrant
    layout: standard
    summary: >
      Positions key robot foundation model competitors on a two-axis map using ordinal 0–10 scoring:
      x-axis is total capital raised / resource scale (0=minimal, 10=unlimited); y-axis is documented
      commercial traction (0=pre-commercial, 10=proven enterprise revenue at scale).
