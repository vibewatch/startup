  - id: s3
    title: Capability, Pricing, and Distribution Comparison
    body: >
      Cross-embodiment generalization — the ability to run on any robot form factor without per-robot
      retraining — is the primary claimed differentiator for all three software-pure competitors (Generalist,
      Physical Intelligence, Skild). Generalist's GEN-1 differentiates architecturally: it is trained from
      scratch on proprietary physical-interaction data rather than fine-tuning a VLM backbone, and explicitly
      rejects the VLA and world-model paradigms as limiting. GEN-1's 99% success rate milestone was
      documented across six specific industrial tasks with only one hour of robot-specific adaptation data.
      Physical Intelligence's π0 is a VLA trained on 10K+ demonstration hours from a robot teleoperation
      dataset; GEN-1's pretraining dataset derives from wearable sensors on humans doing physical tasks,
      not robot teleoperation. Generalist claims GEN-1 completes box assembly in 12.1 seconds versus π0's
      34 seconds on identical boxes — a 2.8x speed advantage — though no independent third-party benchmark
      has validated this comparison. Skild AI's dataset advantage claim ("1,000x larger") is unverified by
      independent benchmark.

      Pricing across the competitive landscape is largely undisclosed. Generalist AI has announced no public
      pricing for GEN-1 and operates only an early-access partner program. Physical Intelligence also has
      no public pricing. Skild AI's enterprise deals are not publicly disclosed. Google DeepMind has not
      published pricing for Gemini Robotics API access. NVIDIA GR00T is free (open-source). Boston Dynamics'
      Atlas is estimated at $150,000–$420,000 per unit depending on fleet configuration. Figure AI operates
      a Robot-as-a-Service model without disclosed pricing per unit. Industrial automation incumbents (ABB,
      FANUC, KUKA) sell hardware-bundled solutions at blended margins of 30–50%, but their software is
      not general-purpose AI.

      Distribution power is the most critical structural battleground. Skild AI's April 2026 acquisition of
      Zebra's Robotics Automation business gives it a battle-tested warehouse robotics platform, enterprise
      WMS integrations, and access to logistics customers where Generalist AI has no foothold. Figure AI's
      BMW Spartanburg deployment and Hyundai distribution agreements through Boston Dynamics represent
      deep automotive manufacturing partnerships. NVIDIA's 2-million-developer robotics ecosystem and
      HuggingFace integration with 13 million AI builders provide distribution reach that no startup can
      match through direct sales alone. Generalist AI's distribution relies entirely on its early-access
      partner program; no named customers or deployment partners have been publicly announced, representing
      the most significant go-to-market gap relative to all commercial-traction competitors.
