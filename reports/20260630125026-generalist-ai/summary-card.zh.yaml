  topStrengths:
    - 创始团队质量极高：Florence、Zeng、Barry 叠加 DeepMind 机器人、PaLM-E/RT-2、Code as Policies 和 Boston Dynamics 的实战经验。
    - GEN-1 不绑定硬件，再加上 500,000 小时自有数据引擎；如果物理 AI 的扩展定律继续成立，公司有机会筑起护城河。
    - June 2026 轮融资引入 Radical Ventures、NVIDIA NVentures、Bezos Expeditions、8VC、USV 等高信号投资方，给公司换来时间和战略背书。
  topRisks:
    - 截至 June 2026，公司没有公开收入、定价或具名生产客户，$2B 估值还无法落到商业基本面上。
    - 安全、责任和欧盟高风险 AI 合规义务推进得更快，Generalist 公开的信任与安全披露追不上。
    - Skild AI、Physical Intelligence 等资金更足的对手，加上 NVIDIA 开源 GR00T stack，可能在 Generalist 证明部署经济性可持续之前挤压模型层差异化。
    - 业务依赖昂贵算力、数据采集运营和创始人亲自推动的企业销售，资本强度仍高。
  unresolvedGaps:
    - 具名付费客户、合同结构，以及至少一个带可量化 ROI 的生产部署仍未披露。
    - 公开记录仍缺少定价、烧钱速度、现金跑道、毛利率，以及任何收入或 ARR 披露。
    - GEN-1 的公开安全、红队和监管合规文件仍缺失，尽管欧盟高风险 AI 执法已逼近。
    - 董事会构成、June 2026 轮融资带来的治理权利，以及股权结构表稀释细节，仍只能通过 Form D 记录看到一部分。
