  - id: founders-and-leadership
    title: Founders, Leadership, and Key-Person Risk
    body: >
      Generalist AI was co-founded by three researchers with deep roots in embodied AI and robotics.
      Pete Florence (CEO) was a senior research scientist at Google DeepMind and a senior author on
      PaLM-E and RT-2, two of the most-cited foundational papers in robot learning. Andy Zeng (Chief
      Scientist) was a research scientist and technical lead at Google DeepMind and lead author of
      "Code as Policies," another highly influential robotics paper. Andrew Barry (CTO) was a senior
      roboticist at Boston Dynamics, where he worked on platforms including Atlas, Spot, and Stretch,
      and is also affiliated with Harvard's machine learning group.

      The broader team draws from OpenAI, Boston Dynamics, and Google DeepMind, giving Generalist AI
      an unusually concentrated research pedigree for a company of its age. The investor commentary from
      8VC describes Pete Florence as "as much a builder as a researcher—magnetic and unusually commercial
      for someone of his research caliber," highlighting the deliberate balance between frontier research
      and commercial execution.

      Key-person concentration is a material risk. The company's scientific identity, fundraising
      narrative, and media visibility are closely tied to Florence and Zeng, both of whom are named in
      virtually every major press article. No formal board composition has been publicly disclosed;
      governance structure, independent board seats, and any board observers are not confirmed in available
      public sources. Investor Radical Ventures (lead of the June 2026 round) likely holds a board seat
      by convention, but this has not been confirmed officially.
