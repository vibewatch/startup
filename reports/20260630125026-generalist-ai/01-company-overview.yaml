  - id: technology-and-products
    title: Technology Platform and Product Milestones
    body: >
      Generalist AI's core technical approach rests on three pillars: a proprietary large-scale physical
      interaction dataset, a purpose-built multimodal foundation model architecture, and a hardware data
      collection system called "data hands."

      The data hands are strap-on wrist-mounted devices that record human manipulation tasks—grasping,
      placing, folding, kitting—at scale, in homes, warehouses, and workplaces worldwide. This approach
      avoids the teleoperation rigs used by competitors like Physical Intelligence and instead captures
      naturalistic human dexterity at low cost and high diversity. The resulting dataset grew from
      270,000 hours at GEN-0's release to over 500,000 hours at GEN-1's release, and continues to
      expand at more than 10,000 hours per week.

      GEN-0 (released November 4, 2025) introduced the first demonstrated scaling laws in robotics:
      larger models trained on more physical data improve performance predictably across all downstream
      tasks. GEN-0 also introduced Harmonic Reasoning—a novel training architecture that allows models
      to think and act simultaneously in continuous time, critical for real-world physical systems where
      physics does not pause. At the model sizes tested (up to 10B+ parameters), GEN-0 demonstrated
      cross-embodiment generalization across 6DoF, 7DoF, and 16+DoF robots.

      GEN-1 (released April 2, 2026) extended GEN-0's foundation with further data and compute scaling
      plus algorithmic advances including post-training techniques and reinforcement learning. GEN-1
      achieves 99% success rates on tasks where prior models achieved 64%, completes tasks roughly 3x
      faster than the prior state of the art, and adapts to new tasks with approximately 1 hour of
      robot-specific data. Notably, GEN-1 is trained entirely from scratch—approximately 99% of
      parameters are newly trained—rather than fine-tuning an existing vision-language model. The
      company believes this "from-scratch" approach gives it full architectural control needed to lead
      the frontier.

      Early access to GEN-1 is being offered to selected industry partners. The company has demonstrated
      tasks including kitting auto parts, T-shirt folding (86 consecutive repetitions without human
      intervention), servicing robot vacuums (200+ consecutive repetitions), and packing operations
      sustained for thousands of consecutive cycles.
