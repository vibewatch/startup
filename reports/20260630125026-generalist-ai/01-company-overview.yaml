callouts:
  - calloutType: strength
    title: Exceptional Founding-Team Pedigree
    body: >
      The co-founders collectively authored PaLM-E, RT-2, and Code as Policies—the three most-cited
      papers in embodied AI from 2022–2024—and built production robots (Atlas, Spot, Stretch) at
      Boston Dynamics. This combination of frontier-AI research and real-world robotics engineering
      at the same founding table is rare and gives Generalist AI disproportionate credibility with
      investors, potential partners, and AI talent.
    claimRefs:
      - CO009
      - CO011
      - CO013
      - CO014

  - calloutType: risk
    title: Architectural Skepticism from Incumbent Robotics Practitioners
    body: >
      Brad Porter, CEO of Cobot and a former Amazon robotics executive, publicly questioned whether
      scaling data alone—without simultaneous architectural innovation—is sufficient. His analogy:
      "ImageNet didn't work without CNNs, and OpenAI didn't work without transformers." Generalist AI
      counters that GEN-1 itself is an architectural redesign trained from scratch, not brute-force
      scaling, but this debate is live and unresolved. If a missing architectural breakthrough limits
      generalization, the company's capital-intensive data engine could prove an expensive dead end.
    claimRefs:
      - CO038
      - CO025

  - calloutType: risk
    title: Revenue and Customer Concentration Opacity
    body: >
      As of the June 2026 runDate, no revenue, named customers, gross margin, or unit economics have
      been disclosed. The company is in early-access mode with selected partners. At a $2 billion
      valuation, investors are paying predominantly for technical optionality and team quality. Any
      indication that commercial deployment is slower or more expensive than projected could compress
      the valuation materially.
    claimRefs:
      - CO029
      - CO036

  - calloutType: insight
    title: NVIDIA's Strategic Investment Creates Compute Alignment
    body: >
      NVIDIA NVentures has backed Generalist AI in both funding rounds. This persistent strategic
      investment reflects NVIDIA's declared thesis that physical AI is the next trillion-dollar compute
      market. From Generalist AI's perspective, this relationship provides preferential access to
      frontier GPU infrastructure; from a risk perspective, it creates potential dependency on a single
      compute supplier and raises questions about exclusivity terms that have not been publicly disclosed.
    claimRefs:
      - CO033
      - CO039

