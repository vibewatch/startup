  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        Generalist AI's annual recurring revenue, pricing model, and gross margin are not publicly
        disclosed. No financial filings, press releases, or leaks confirm any revenue figure.
      whyItMatters: >
        At a $2 billion valuation, the absence of revenue data makes it impossible to assess the
        revenue multiple or commercial validation behind the price. Investors may be paying purely for
        technical optionality.
      diligencePath: >
        Request audited financials or unaudited management accounts; check for any SEC filings if
        the company has issued securities to US-based retail-adjacent investors; interview reference
        customers under NDA.
      relatedQuestionRefs: [QO025]

    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: >
        No named commercial customer or partner has been publicly confirmed in association with GEN-1
        early-access deployments. The GEN-1 blog says "early access now available to selected partners"
        but does not name them.
      whyItMatters: >
        The absence of named customers makes it impossible to assess product-market fit, deployment
        friction, or the speed at which the data flywheel is actually spinning.
      diligencePath: >
        Request a reference list of three customers with permission to call; verify claimed task
        success metrics in real deployment (not controlled demo) conditions.
      relatedQuestionRefs: [QO010, QO018]

    - type: missing-source
      severity: minor
      topic: regulatory
      missingEvidence: >
        No public information is available about regulatory scrutiny of Generalist AI's data collection
        practices (thousands of homes and workplaces), export control exposure, or AI safety compliance
        obligations in any jurisdiction.
      whyItMatters: >
        Collection of manipulation video and sensor data from private homes in multiple geographies
        may trigger GDPR, CCPA, or equivalent privacy obligations. Export controls on foundation models
        or dual-use robotics technology could also apply.
      diligencePath: >
        Conduct legal diligence on data collection consent frameworks; request counsel opinion on
        GDPR and CCPA applicability; check for any government entity customer restrictions.
      relatedQuestionRefs: [QO013]

    - type: missing-source
      severity: minor
      topic: governance
      missingEvidence: >
        Board composition, governance documents, investor consent rights, and protective provisions have
        not been publicly disclosed. No information on whether Radical Ventures or other investors hold
        board seats or board observer rights.
      whyItMatters: >
        Governance structure affects founder control, exit optionality, and the risk of investor-driven
        strategic pivots. Key-person concentration risk (Florence and Zeng) is elevated in the absence
        of documented succession or retention plans.
      diligencePath: >
        Review the capitalization table, board resolutions, and investor rights agreements; confirm
        board composition and any outstanding protective provisions.
      relatedQuestionRefs: [QO016]

    - type: private-evidence-only
      severity: minor
      topic: headcount
      missingEvidence: >
        Precise employee count at Generalist AI has not been officially disclosed; the ~70+ figure is
        an approximation from press coverage published around June 2026.
      whyItMatters: >
        Headcount is a proxy for burn rate and pace of scaling. For a company with $500M+ raised and
        no disclosed revenue, precise headcount informs cash efficiency assessment.
      diligencePath: >
        Request a confirmed headcount figure from management; cross-reference with LinkedIn employee
        counts and Glassdoor listings.
      relatedQuestionRefs: [QO006]

