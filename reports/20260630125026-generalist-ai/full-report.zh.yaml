      - number: '2.5'
        title: 规模缺口、矛盾证据与尽调问题
        blocks:
          - type: paragraph
            body: >
              具身 AI 软件的市场分析存在三类重要证据缺口，投资人和尽调团队应将其视为未解决问题。

              第一，市场边界不一致是结构性问题。三种主要规模视角——$20.4B 的「机器人中的 AI」（GVR）、$14.18B 的「AI 机器人软件」（IMR）和 $6.5B 的「具身
              AI」（GVR）——不仅规模不同，范围定义、地理覆盖和方法论也不同。这不是同一个市场从窄到宽的切片，而是不同分析师用不同边界规则衡量重叠现象。没有任何单一已发布数字，代表只做软件的具身基础模型供应商可直接获取的收入池。

              第二，跨机体基础模型细分市场没有 SAM / SOM。「授权一个基础模型，使其在多样第三方机器人硬件上执行灵巧操作」这个子市场，并未被 IFR、Mordor、GVR
              或其他公开可得来源作为独立类别跟踪。最接近的代理口径（2026 年 $6.5B 的具身 AI 软件）仍包含硬件相邻组件。若从这些数字推导 SAM，必须对软件收入占比和可服务机器人类别做出多项未经验证的假设。

              第三，竞争融资强度能为估值提供市场信号，却不能提供收入清晰度。Physical Intelligence（pi.ai）2024 年以 $2.4B 估值融资 $400M，并据称在 2026 年洽谈 $1B
              后续融资。QubitTool 分析预计，全球具身 AI 融资管线在 2026 年将超过 $20B。这些资本投入验证了市场命题，但没有解决规模或时点的不确定性。
            claimRefs:
              - CM044
              - CM045
              - CM046
              - CM019
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 软件收入捕获是核心估值赌注
            body: >
              工业机器人硬件市场（2026 年 $54.28B）比 AI 机器人软件市场（$14.18B）大 8x，但增速不到后者一半（11.7% 对 15.3%
              CAGR）。企业软件历史显示，智能层最终相对硬件捕获更高比例利润率。Generalist AI 的押注是，基础模型会成为物理智能中高利润率的 OS——类似 iOS / Android
              如何压低手机硬件利润率。这个类比能否成立，取决于硬件 OEM 能抵抗商品化多久，以及基础模型切换成本能否达到软件护城河水平。
            calloutType: insight
            claimRefs:
              - CM007
              - CM010
              - CM017
          - type: callout
            title: 边界分歧让 TAM 主张无法验证
            body: >
              三种主要规模视角之间的差距——$6.5B（GVR 具身 AI）、$14.18B（IMR AI 机器人软件）和 $20.4B（GVR 机器人中的 AI）——不是四舍五入差异，而是底层范围假设完全不同。在 $2B
              估值下，Generalist AI 的定价约为最窄直接可比市场（$6.5B）的 15x；如果接受最宽边界，则约为 1.5x。投资命题要求接受一个包含所有机器人形态完整 AI
              软件栈的边界定义，而当前没有任何商业部署验证了这个定义。
            calloutType: risk
            claimRefs:
