      - - 数据飞轮（真实部署产生训练数据，优势复利）
        - 飞轮需要大规模商业部署才能转起来；公司未披露客户，飞轮尚未启动；Skild AI 收购 Zebra 让竞争者拥有活跃的企业部署飞轮，而 Generalist AI 的飞轮仍停留在理论层面
