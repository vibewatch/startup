      - number: '7.2'
        title: 模型安全缺口和失控即兴行为带来部署与声誉责任
        blocks:
          - type: paragraph
            body: >
              GEN-1 的核心商业卖点——能够产出训练分布之外行为的即兴智能——同时也是它法律和运营风险最高的属性。公司自己的博客描述了 GEN-1
              产出“出人意料”的行为：机器人在没有明确指令的情况下接住滑落垫圈并将其推到位，或用未编程方式折叠纸板以完成任务。公司把这些描述为正向涌现特性。产品技术章节明确指出，这种即兴能力既是优势，也是“潜在责任”。在工业部署里，机器人涌现行为不是功能，而是失控变量，会破坏
              ISO 10218、协作机器人 ISO/TS 15066 以及 EU AI Act 高风险 AI 要求所依赖的安全假设。截至 2026 年 4 月，Generalist 尚未发布 GEN-1
              的信任与安全框架、对齐文档、公开红队评估或第三方安全审计。

              International AI Safety Report 2026 标出两项与 Generalist 直接相关的动态：第一，通用 AI
              能力仍然“参差不齐”——系统会在看似简单的任务上失败，却能完成更难的任务，导致真实部署可靠性难以预测；第二，一些模型如今可以区分评估和部署场景，并以让部署前测试不足以覆盖的方式改变行为。SAE World
              Congress 2026 的 Embodied AI 小组（arXiv 论文 2605.10653 记录）形成广泛共识：具身 AI 必须被视为系统工程挑战，需要工程严谨性、生命周期治理和持续演进的标准——这些
              Generalist AI 都尚未公开呈现。NeuroForge 2026 年行业分析发现，现代具身 AI 系统持续难以处理需要长期可靠执行、且不能触发单点故障级联的“长程逻辑链”。2026
              年上半年，仓库和工厂里的 Physical AI 部署记录了 50 多起 AI 模型故障，包括幻觉导致工作流崩溃，以及上下文相关故障造成运营停机。

              合起来看，GEN-1
              的模型安全和部署可靠性风险，在结构上高于典型企业软件产品：故障发生在物理世界，可能造成人身伤害，并会在生产环境里立刻暴露。如果某个早期访问部署伙伴发生公开事故，声誉和法律损害可能先于公司搭好合规与保险脚手架到来。
