      - number: '5.3'
        title: 模型架构：GEN-0、GEN-1 与 Harmonic Reasoning
        blocks:
          - type: paragraph
            body: >
              GEN-1 的架构完全从零搭建——约 99% 参数重新训练，而不是在现有视觉语言模型（VLM）上微调。这是公司基于目标驱动研究哲学作出的有意选择：在积累足够真实世界物理数据后，Generalist AI
              认为，完整掌控架构比改造现成 VLA 或世界模型，更能推动前沿进展。公司曾共同发明 VLA（PaLM-E、RT-2），也曾研究世界模型，但拒绝给自己贴标签，因为模型设计横跨多个技术类别。

              基础架构创新是 Harmonic Reasoning，最早在 GEN-0 中引入，并在 GEN-1 中演进。Harmonic Reasoning 在感知 token 流和动作 token
              流之间建立异步、连续时间的「harmonic」互动——让模型无需为物理过程暂停，就能边想边动。公司将其与 System 1/System 2 架构（Figure AI 的 Helix
              使用）和推理时引导方法对比；后两者需要先停顿再行动的顺序循环，无法适配实时物理。在 GEN-0 阶段，扩展实验揭示了模型「固化」相变：低于 7B 参数的模型无法吸收大规模预训练数据，权重会冻结；7B+
              模型则继续提升。GEN-0 扩展至 10B+ 参数。GEN-1 在 GEN-0 基础上加入预训练改进、后训练技术（监督微调、强化学习、多模态人类引导）和新的推理时技术。GEN-1 相比 GEN-0 展示出 10x
              数据效率，用少 10x 的任务专属数据取得相当的下游表现。定制 paged attention
              内核支撑实时推理。物理常识——面向力、摩擦和不确定性的反应式闭环感觉运动智能——是大规模预训练产生的关键涌现属性，体现为公司并未显式训练却自然出现的恢复行为。
