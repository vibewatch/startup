  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分类
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的定位是只做软件的具身基础模型供应商，也就是运行在第三方机器人硬件之上的「认知智能层」。这个定位把市场边界划得很清楚：可服务支出是 AI
              模型授权、云端和边缘推理、微调服务，以及与物理机器人部署绑定的软件订阅；不是机器人硬件本体、传感器、执行器、夹爪，也不是围绕它们的传统自动化资本设备。

              纳入范围的支出包括 API / 云端推理费、基础模型授权、平台订阅收入，以及面向特定机器人形态或任务的下游微调服务。相邻但不完全属于范围内的市场包括机器人仿真平台（NVIDIA Isaac
              Sim、Mujoco）、在集成 AI 驱动机器人编排时的仓库管理软件（WMS）、Robot-as-a-Service（RaaS）交付平台，以及机器人中间件（ROS/ROS2 工业发行版 2026 年估值约
              $0.8B）。排除在外的是硬件子系统本身——机械臂（6-DOF、7-DOF、人形）、传感器、摄像头、末端执行器和气动系统——以及工业 PLC、NC 控制软件和传统任务专用机器人编程（例如 ABB
              RAPID、KUKA KRL 脚本）。

              Generalist AI 必须替代的现状方案包括：（1）任务专用 ROS/ROS2 编程和运动规划库，每个任务都需要数月定制工程；（2）机器人 OEM 的厂商专属嵌入式 AI 栈，例如 NVIDIA
              Isaac、ABB Omnicore、Yaskawa DX200 AI 和 Fanuc AI
              软件套件；（3）面向结构化抓取和放置的传统示教器编程；（4）长尾非结构化任务中的人力。基础模型路线要替代这些方案，价值主张在于它能快速适配新任务（GEN-1 约需 1
              小时任务专属数据，而定制编程通常需要数周或数月），并具备跨机体可移植性，免去按机器人平台重新工程化的需求。

              IFR 将机器人中的 AI 与自主性列为 2026 年最重要的行业趋势，指出从基于规则的自动化转向智能、自我演进系统，正在制造业和服务业中「让具身 AI 成为主流」。这使 Generalist AI
              所在技术类别更像结构性行业拐点，而不是小众子赛道。
