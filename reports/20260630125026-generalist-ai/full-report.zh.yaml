      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              五股结构性力量正在拉动机器人自动化市场向前，尤其可能支撑 AI 机器人软件跑出高于 GDP 的增长。

              劳动力稀缺是最主要的需求信号。IFR 记录，2025 年德国工厂有 420,000 个技术工种空缺，美国到 2030 年预计缺少 2.1M 名制造业工人。美国指定区域内合格自动化支出可享 30%
              联邦税收抵免，韩国在 2025 年把小制造商补贴翻倍，二者都直接缩短自动化回本周期。中国「中国制造 2025」计划到 2026 年为机器人投入 CNY 180B（约
              $25.2B）。回流投资又叠加了一层需求：2024–2026 年，美国宣布 $47B 工厂投资，其中大多数都把机器人列为成本具备竞争力的本土生产前提。

              机器人回本周期已经压缩。工业机器人的中位回本周期现在约为 1.3 年（16 个月），协作机器人可短至 6–18 个月。这种 ROI 压缩，一部分来自硬件成本下降（协作机器人入门价格约 $10,000），一部分来自
              AI 带来的灵活性——GEN-1 适配新任务只需 1 小时，而传统编程需要数周，边际任务自动化第一次在经济上可行。

              采用约束很大，也尚未完全解决。前沿资本强度极高：打造有竞争力的人形机器人平台，估计需要 Tesla Optimus 在 2022–2024 年投入 $3–4B R&D；Figure AI 据称每年烧掉
              $200–300M。「筷子问题」——需要触觉与力反馈一体化的精细运动操作——对多数商业系统仍未解决。物理数据稀缺限制基础模型扩展：不同于文本
              AI，物理操作数据必须通过机器人或可穿戴交互采集，不能从互联网上抓取。集成挑战也很实质：遗留工厂 PLC、MES 系统和 ERP 平台，让每个单元的典型安装开销达到
              $40,000–80,000。安全和责任框架正在演进（ISO 9283、ISO/TS 15066），但截至 2026 年 6 月，任何主要司法辖区都尚未制定 AI 专属的具身 AI
              责任监管。边缘算力是硬件瓶颈：VLA 模型需要专用端侧推理硬件，因为数据中心级算力会给实时机器人控制带来不可接受的延迟。
