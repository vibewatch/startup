  - id: FI001
    title: 收入模型桥 — 从客户活动到毛利
    type: flow
    layout: standard
    summary: |
      在推断的按机器人 SaaS / 企业授权模式下，Generalist AI 如何把机器人操作方活动转化为收入和毛利。
    data:
      nodes:
        - id: robot-operator
          label: 机器人操作方（制造商 / 集成商 / 企业）
          detail: 购买或授权 GEN-1 模型访问；提供机器人硬件和部署环境
        - id: fine-tune
          label: 任务微调（约 1 小时机器人数据）
          detail: 操作方采集约 1 小时任务特定机器人数据；模型适配本体和任务
        - id: deployment
          label: 生产部署
          detail: 机器人在生产中运行 GEN-1 模型；传感器数据流向云 API，或在机器人本体上运行推理
        - id: revenue-trigger
          label: 收入事件（按机器人订阅或企业授权）
          detail: 每月按机器人收费（按 PI SaaS 类比估算约 $300/机器人/月）或年度场站授权；Generalist AI 尚未确认定价
        - id: cogs
          label: 销货成本（COGS）
          detail: 云推理算力、数据出站、模型服务基础设施、客户支持；成熟期估计为收入的 20–40%
        - id: gross-profit
          label: 毛利
          detail: 收入减 COGS；软件交付在规模化后估计为 60–80%；短期受算力成本拖累
        - id: data-flywheel
          label: 数据飞轮（非现金）
          detail: 生产部署生成新的任务数据；反哺下一代模型训练数据集
      edges:
        - from: robot-operator
          to: fine-tune
          label: 提供任务数据 + 硬件
        - from: fine-tune
          to: deployment
          label: 模型约 1 小时适配；部署到生产环境
        - from: deployment
          to: revenue-trigger
          label: 触发订阅或授权计费
        - from: revenue-trigger
          to: cogs
          label: 收入扣除推理和支持成本
        - from: cogs
          to: gross-profit
          label: 收入减 COGS
        - from: deployment
          to: data-flywheel
          label: 捕获真实世界任务数据
    approximationNotes: >
      收入触发节点使用 Physical Intelligence $300/机器人/月 SaaS 定价作为类比；Generalist AI 尚未确认任何定价。COGS 百分比参考软件 SaaS
      基准，并按推理算力作调整。本模型仅作示意；实际收入机制尚未确认。
