  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论据
      - 方向
      - 什么会改变判断
    rows:
      - - 顶级研究型建设团队（Pete Florence、Andy Zeng、Andrew Barry），直接拥有 DeepMind 和 Boston Dynamics 履历。
        - 正向
        - 2 名以上创始人离职，或核心团队大规模出走，会削弱人才护城河。
      - - 通过 data-hands 设备采集的专有 50 万小时物理交互数据集，结构上很难复制。
        - 正向
        - 开源数据采集方法，或竞争者拿到同等规模数据集，会侵蚀护城河。
      - - 硬件无关定位让 Generalist 能成为跨所有机器人形态的智能层，而不是绑定单一 OEM。
        - 正向
        - 失去关键硬件合作方，或 NVIDIA 扩张竞争性的跨具身模型，都会压缩平台广度。
      - - $2B 估值在直接软件同业中最低——若技术论点成立，相对上行空间可观。
        - 正向
        - Physical Intelligence 或 Skild AI 出现估值下调融资，会重定行业估值，降低相对溢价。
      - - 未披露收入、未确认客户、没有财务指标——所有上行都指向未来。
        - 反向
        - 若确认一个锚定客户，或披露 ARR 里程碑，判断会转向有条件买入。
      - - NVIDIA GR00T N-series 向开发者免费提供开源模型权重，威胁模型层商品化。
        - 反向
        - 如果 NVIDIA 将 GR00T 限制为自有用途，或 GR00T 性能显著低于 GEN-1，威胁会减弱。
      - - 竞争者 Skild AI（$14B、$30M ARR）和 Physical Intelligence（$11B）融资更多；Skild 还已证明收入。
        - 反向
        - Skild 和 PI 若进入持续商业部署低迷期，会降低 Generalist 需要跨过的门槛。
      - - 工业资质周期为 6–18 个月，意味着收入会结构性延后；收入到来前现金消耗会先加速。
        - 反向
        - 更短周期的产品（例如用于快速原型的托管 API）可能加快第一笔收入到来。
    notes: |
      正向论点和反向论点均来自公开证据。核心张力在于：输入要素（团队、数据、架构）质量很高，但输出证明（收入、部署、客户名称）完全缺席。
