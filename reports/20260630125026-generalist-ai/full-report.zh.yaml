  - id: FE002
    title: Generalist AI — 客户工作流 / 部署流程
    type: flow
    layout: standard
    summary: |
      从客户任务识别到机器人自主运行的端到端工作流，展示每次部署如何把数据回流到 Generalist AI 的物理数据引擎飞轮。
    data:
      nodes:
        - id: task-req
          label: 客户识别物理任务
          detail: 制造、物流或自动化工作流需要灵巧操作（套件分拣、折叠、包装、装配）
        - id: data-collection
          label: 1 小时机器人特定数据采集
          detail: 使用客户目标机器人硬件采集任务特定数据；基础模型不需要机器人数据——只需 1 小时适配
        - id: fine-tuning
          label: GEN-1 后训练微调
          detail: 在 1 小时任务数据上做 SFT + RL；数据效率比 GEN-0 高 10x；首次同时适配本体和任务
        - id: deployment
          label: 在合作伙伴机器人上部署 GEN-1
          detail: 硬件无关部署；任何 6/7/16DoF 机器人；通过 paged attention 实时运行 Harmonic Reasoning 推理
        - id: operation
          label: 机器人自主运行
          detail: 简单任务可靠性 99%；比此前 SOTA 快约 3x；能从意外场景中即兴恢复
        - id: data-return
          label: 运营数据回流引擎
          detail: 真实业务运营中的任务和错误恢复数据回到 Generalist AI 物理数据引擎
        - id: next-gen
          label: 下一代模型改进
          detail: 规模化真实世界部署数据训练 GEN-2 及后续模型；形成正向数据飞轮
      edges:
        - from: task-req
          to: data-collection
          label: 任务规格 + 机器人访问
        - from: data-collection
          to: fine-tuning
          label: 1 小时机器人特定数据
        - from: fine-tuning
          to: deployment
          label: 任务适配后的 GEN-1 权重
        - from: deployment
          to: operation
          label: 实时推理
        - from: operation
          to: data-return
          label: 生产交互数据
        - from: data-return
          to: next-gen
          label: 反哺物理数据飞轮
    approximationNotes: |
      数据飞轮回流路径是公司截至 2026 年 6 月所述意图。截至报告日期，尚无运营数据被独立确认已从具名客户部署流入 Generalist AI 训练管线。
