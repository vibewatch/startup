      - number: '8.4'
        title: 退出准备度和最终尽调：3–5 年内 M&A 可选性真实存在；独立 IPO 至少 5 年后
        blocks:
          - type: paragraph
            body: >
              按任何传统标准，Generalist AI 都还不具备 IPO 条件。作为收入前私营公司，公司没有披露财务指标、没有审计报表，也没有公开部署记录，缺少上市所需披露基础。Figure AI（$39B）和
              Boston Dynamics（目标 $85–103B IPO）是最接近的行业参照，但两者运营历史更长、部署记录更完整、收入可见度更高。从 2026 年 6 月 runDate 算起，Generalist AI
              可信的独立 IPO 至少还要五年。

              战略 M&A 是 3–5 年窗口内更可信的退出路径。NVIDIA 通过 NVentures 在本轮继续战略投资，收购理由最直接：买下 Generalist AI 的模型和数据集，可补上一层硬件无关的 AI
              智能，与 NVIDIA 的 GR00T 算力栈和 Isaac Sim 平台互补。Amazon Robotics 也是另一个可能买家，其领导层包括 Covariant 前创始人，与 Generalist AI
              的跨形态命题相通。Google DeepMind 通过共同研究传承拥有最深技术重叠，但内部竞争风险让收购在结构上更难。

              近期关键尽调问题是：(1) 验证至少一个产生收入的商业部署，并确认 ARR；(2) 确认股权结构表 和清算优先权结构，以理解标题 $2B 标记之外的有效入场经济性；(3) 由第三方独立验证模型表现，而不是只依赖
              GEN-1 公司报告的 99% 成功率；(4) 确认董事会构成，尤其是 Radical Ventures 是否持有正式董事席位；(5) 在成本结构未确认的情况下，核实 $400M 融资后的烧钱速度和
              资金续航轨迹。
