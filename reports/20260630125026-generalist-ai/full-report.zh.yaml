      - number: '3.3'
        title: 能力、定价与分发对比
        blocks:
          - type: paragraph
            body: >
              跨机体泛化——无需针对每台机器人重新训练，就能在任意机器人形态上运行——是三家纯软件竞争对手（Generalist、Physical
              Intelligence、Skild）共同声称的核心差异点。Generalist 的 GEN-1 在架构上做差异化：它不是微调 VLM 骨干网络，而是基于自有物理交互数据从零训练，并明确否定 VLA
              和世界模型范式，认为二者有限制。GEN-1 的 99% 成功率里程碑，记录在六项具体工业任务上，只使用 1 小时机器人专属适配数据。Physical Intelligence 的 π0
              是基于机器人远程操作数据集中 10K+ 小时示范训练的 VLA；GEN-1 的预训练数据集来自人类执行物理任务时佩戴的传感器，而不是机器人远程操作。Generalist 称，在相同箱体上，GEN-1
              完成箱体组装需 12.1 秒，π0 需 34 秒，速度优势为 2.8x；但没有独立第三方基准验证这一比较。Skild AI 的数据集优势说法（「大 1,000x」）也未被独立基准验证。

              竞争格局中的定价大多未披露。Generalist AI 尚未公布 GEN-1 公开定价，只运营早期试用伙伴计划。Physical Intelligence 也没有公开定价。Skild AI
              的企业交易未公开披露。Google DeepMind 未公布 Gemini Robotics API 访问定价。NVIDIA GR00T 免费（开源）。Boston Dynamics 的 Atlas 估计每台
              $150,000–$420,000，取决于队伍配置。Figure AI 采用 Robot-as-a-Service
              模式，但未披露单机定价。工业自动化既有厂商（ABB、FANUC、KUKA）销售软硬件打包方案，混合利润率为 30–50%，但其软件不是通用 AI。

              分发能力是最关键的结构性战场。Skild AI 2026 年 4 月收购 Zebra 的 Robotics Automation 业务，拿到了经实战验证的仓储机器人平台、企业 WMS 集成，以及
              Generalist AI 尚无立足点的物流客户入口。Figure AI 的 BMW Spartanburg 部署和经 Boston Dynamics 形成的 Hyundai
              分发协议，代表深度汽车制造伙伴关系。NVIDIA 的 2M 机器人开发者生态，以及与 13M AI 开发者所在 HuggingFace 的集成，提供了任何初创公司都无法仅靠直销匹敌的分发触达。Generalist
              AI 的分发完全依赖早期试用伙伴计划；它没有公开宣布已署名客户或部署伙伴，这是相较所有已有商业牵引力竞争对手最重大的商业化落地缺口。
