        - 暂停面向欧盟的部署承诺；上报董事会；立即聘请 EU AI Act 法律顾问。
      - - 生产部署中出现可归因于 GEN-1 的人身伤害
        - 公开事故报告；诉讼文件；合作方披露；媒体报道
        - 任何已确认、涉及 GEN-1 控制机器人的人身伤害或财产损失事故
        - 触发全面部署复盘；通知投资者；聘请产品责任律师；与第三方审计方重新评估安全框架。
      - - NVIDIA 算力获取中断或价格大幅上涨
        - GPU 采购交付周期延长至 52 周以上；Blackwell 配额被拒；云价格重谈涨幅超过 25%
        - GEN-2 训练算力较内部路线图延迟 6 个月或更久
        - 加快替代供应（AMD MI300X、超大云厂商 TPU 访问、新型云）；修订资本计划，反映更高训练成本。
      - - 联合创始人离职（三人中任一）
        - 公开公告；团队重组信号；董事会构成变化
        - 任一联合创始人在商业里程碑前离职
        - 重新评估论点；召开董事会审查继任安排；评估对投资者信心和融资路径的影响。
      - - 没有已承诺条款清单，资本续航低于 12 个月
        - 月度现金消耗与现金余额对比；剩余 18 个月时仍无 C 轮动作
        - 按当前现金消耗，现金余额不足 12 个月，且手中没有条款清单
        - 启动紧急资本效率措施；启动桥接融资或 C 轮流程；评估包括人才收购在内的战略选项。
      - - 数据采集运营遭遇 GDPR 或数据隐私执法行动
        - 监管问询函；DPA 投诉；媒体报道数据主体投诉
        - 欧盟监管机构针对数据采集项目发起任何正式 GDPR 执法问询
        - 暂停欧盟数据采集，等待法律审查；任命 DPO；委托紧急 DPIA；向投资者披露。
  - id: TV001
    title: 建议摘要表
    columns:
