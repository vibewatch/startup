  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: |
      “跟踪”建议来自两股力量的交汇：团队和数据信号很强，但估值被拉高、商业验证为零；NVIDIA 商品化风险是关键摆动因素。
    data:
      nodes:
        - id: team
          label: 团队履历
          detail: >
            Pete Florence（DeepMind，PaLM-E/RT-2）、Andy Zeng（Code as Policies）、Andrew Barry（Boston Dynamics）。8VC
            评价其“既是建设者，也是研究者”。
          tone: positive
        - id: data
          label: 数据引擎护城河
          detail: |
            500,000+ 小时专有物理交互数据；每周 10,000+ 小时；预训练不含机器人数据——结构上很难复制。
          tone: positive
        - id: market
          label: 市场信号
          detail: |
            具身 AI TAM 2026 年为 $6.5B，CAGR 39.7%；2025 年机器人领域融资 $40.7B。
          tone: positive
        - id: revenue
          label: 商业验证缺口
          detail: |
            已披露收入为零。早期访问合作伙伴未具名。截至 2026 年 6 月 30 日，未披露 ARR、客户数量或定价。
          tone: warning
        - id: comps
          label: 同业相对价值
          detail: |
            $2B 对比 Physical Intelligence $5.6–11B、Skild AI $14B；在纯软件同业中最低，但 PI 和 Skild 资本更多，Skild 还有部分收入。
          tone: warning
        - id: nvidia
          label: NVIDIA 商品化风险
          detail: |
            NVIDIA GR00T N-series 提供免费的开源模型权重。如果扩展到企业场景，专有模型溢价会明显压缩。
          tone: warning
        - id: decision
          label: 跟踪 — 有条件进入
          detail: |
            保持接触。在 $2B 标记买入前，要求私下确认至少一个产生收入的部署。
          tone: neutral
      edges:
        - from: team
          to: decision
        - from: data
          to: decision
        - from: market
          to: decision
        - from: revenue
          to: decision
        - from: comps
          to: decision
        - from: nvidia
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV034
      - CV042
      - CV043
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: |
      在 $2B 估值且无收入的情况下，远期收入倍数对应很宽的 ARR 目标区间——全部未经验证。敏感性分析展示，在 $2B 进入看起来合理之前，需要多少事情跑通。
    data:
      items:
        - label: 40x 倍数所需 ARR
          value: 50
          detail: 若享有前沿 AI 稀缺性溢价（40x），$50M ARR 可支撑 $2B 进入价。
          tone: positive
        - label: 20x 倍数所需 ARR
          value: 100
          detail: 若享有高增长 SaaS 溢价（20x），$100M ARR 可支撑 $2B 进入价。
          tone: warning
        - label: 10x 倍数所需 ARR
          value: 200
          detail: $200M ARR 对应成熟平台倍数（10x）——可对照 Covariant $30M 收入 / $400M 估值基准。
          tone: negative
        - label: 当前已确认 ARR
          value: 0
          detail: Generalist AI 已披露 ARR 为零。门槛从零开始。
          tone: negative
    approximationNotes: |
      收入门槛只是以 $2B 进入价搭出的简单 EV/收入桥，不是 DCF 结果。倍数选择反映私有 AI 软件可比公司区间（Finro 2026 Q1；Finerva 2025 Q4）。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: |
      从 $2B 进入 Generalist AI 后的牛、基准、熊三种退出区间，反映从未有收入到潜在并购或 IPO 的巨大不确定性。
    data:
      items:
        - label: 熊市情景
          low: 300
          mid: 500
          high: 700
          displayValue: $0.3B–$0.7B exit
          detail: |
            到 2028 年仍无商业收入；下轮降估值或人才收购。优先清算瀑布前，$2B 进入价几乎全损。
          tone: negative
        - label: 基准情景
          low: 300
          mid: 500
          high: 750
          displayValue: $300M–$750M acquisition
          detail: |
            到 2028 年 ARR 达 $20–50M；以 10–15x ARR 被战略收购。后续融资稀释后，$2B 进入价带来小幅正回报到持平。
          tone: warning
        - label: 牛市情景
          low: 7500
          mid: 12000
          high: 20000
          displayValue: $7.5B–$20B acquisition
          detail: |
            到 2030 年 ARR 达 $500M–$1B；被 NVIDIA/Amazon/Google 以 10–20x ARR 收购。稀释前，$2B 进入价对应 3.75–10x 回报。
          tone: positive
    approximationNotes: |
      退出区间是基于情景的估算，锚定同业可比和类似深科技 AI 并购交易；不是管理层指引或 DCF 输出。后续融资轮（可能 1–2 轮）带来的稀释会降低投资人有效回报。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: |
      Generalist AI 在团队和数据护城河上得分高，但商业验证和估值支撑薄弱——典型的收入前深科技 AI 画像。
    data:
      items:
        - label: 市场机会
          score: 8
          detail: |
            具身 AI TAM 2026 年为 $6.5B，CAGR 39.7%；2025 年机器人领域融资 $40.7B。市场时点和结构明显有利。
          tone: positive
        - label: 团队履历
          score: 9
          detail: |
            Pete Florence、Andy Zeng、Andrew Barry 在具身 AI 中引用量居前。8VC、Radical Ventures、Fei-Fei Li、NVIDIA 都释放出前沿押注信号。
          tone: positive
        - label: 数据 / IP 护城河
          score: 7
          detail: |
            500,000+ 小时专有数据集；硬件无关架构；数据引擎每周产出 10,000+ 小时。如果扩展论点成立，结构性护城河很强。
          tone: positive
        - label: 商业验证
          score: 1
          detail: |
            截至 2026 年 6 月 30 日，没有收入、没有具名客户、没有确认定价。早期访问计划是唯一公开信号；合作伙伴未具名。
          tone: negative
        - label: 竞争定位
          score: 5
          detail: |
            硬件无关是正确的战略押注，但 NVIDIA GR00T 和 Skild AI 收购 Zebra 让竞争对手在 2026 年握有真实优势。
          tone: neutral
        - label: 估值支撑
          score: 3
          detail: |
            $2B 相对同业偏低，但没有收入锚。远期倍数分析显示，进入价相对任何传统收入锚都有显著溢价。
          tone: warning
        - label: 证据质量
          score: 3
          detail: |
            公开证据在团队和技术上方向性很强，但商业执行完全缺席。财务披露近乎为零。
          tone: warning
    approximationNotes: 分数是供 IC 讨论的 0-10 有序判断；不是数学汇总。
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV015
      - CV034
      - CV043
      - CV045
      - CV046
