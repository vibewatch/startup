  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与商业产品
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的核心商业产品是 GEN-1，一个可输出实时机器人动作的大型多模态基础模型。GEN-1 被定位为任意机器人的「智能层」或「认知大脑」，并不绑定专有硬件：它可跨多种机器人形态运行，包括
              6 自由度（6DoF）工业机械臂、7DoF 协作机器人和 16+DoF 半人形系统。公司的商业主张是提供一个通用软件模型，让任何机器人硬件 OEM 或最终部署方都能集成，而不是出售完整机器人系统。

              GEN-1 用公司所称的「掌握」界定商业可行性——三种能力的组合：可靠性（稳定完成任务）、速度（快到具备经济价值）和即兴智能（无需预定义响应即可从意外场景中恢复）。公司声称，GEN-1
              已在简单物理任务上跨过这一门槛，成功率达到 99%，完成速度约为此前最先进水平的 3x，并展示了训练分布之外的恢复行为。

              截至 2026 年 4 月 2 日，GEN-1 通过早期访问计划提供给被选中的行业伙伴。公司尚未公开披露定价、客户名称、SLA 承诺或正式支持模式。部署联系路径为
              partnerships@generalistai.com。官方博客和投资人评论中提到的目标行业包括服装、制造、物流、汽车和电子。
