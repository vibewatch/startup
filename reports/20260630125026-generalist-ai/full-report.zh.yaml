      - number: '4.2'
        title: GTM 动作与商业牵引信号
        blocks:
          - type: paragraph
            body: >
              从招聘信息和投资人评论看，Generalist AI 的商业化打法仍处早期，偏高接触企业销售：截至 2026 年 6 月，唯一对外商业岗位是一个「Applied AI &
              Partnerships」职位，相比研究团队，商业团队很轻。这符合深科技 AI 实验室种子阶段常见的 GTM
              模式：创始团队亲自维护关键关系，早期客户更像战略伙伴而非批量账户，交易周期长，且常与联合数据采集或集成项目绑定。

              8VC 投资备忘录把「显著的早期商业牵引」列为形成投资判断的信号；Spark Capital 的 Fraser Kelton 也提到机器人规模化中的早期商业验证。两家投资人都未确认客户名称或收入指标。公司
              2026 年 6
              月博客明确称数据飞轮已经启动——真实企业为下一代模型生成任务数据——这意味着一定规模的创收或数据共享合同关系已经存在。未披露客户名称，符合企业机器人部署的保密要求（工厂自动化项目通常很晚才披露，甚至不披露），但也同样可能意味着仍处商业化前阶段。

              具身基础模型平台的销售周期参照很长：典型工业自动化资格认证周期为 6 到 18
              个月，包括硬件兼容性验证、安全认证和生产试运行。相对初始合同金额，这类周期的获客成本结构性偏高，因此回本期是关键指标，但无法验证。公司未公开 CAC、LTV 或回本期估算。
