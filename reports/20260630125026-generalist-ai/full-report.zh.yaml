      - number: '7.5'
        title: 关键人物集中和治理不透明放大所有其他风险维度
        blocks:
          - type: paragraph
            body: >
              三位联合创始人——Pete Florence（CEO）、Andy Zeng（Chief Scientist）和 Andrew Barry（CTO）——都在公开场合活跃，但公司的科学身份和商业叙事异常集中在
              Florence 与 Zeng 身上。每一篇主要媒体报道、投资人备忘录和产品公告，都会引用 Florence、提到 Zeng 的研究传承，或两者兼具。8VC 的投资笔记明确形容 Florence
              “既是建设者，也是研究者——以他的研究资历而言，他有磁性且异常商业化”，证实投资人信心很大程度上押注创始团队，而非独立机构能力。对一家成立两年的公司来说，这可以理解——但也意味着联合创始人离职、健康事件或高层人际冲突，不只会影响运营，还会直接打击融资前景、客户信心和团队稳定性。

              治理结构进一步增加不透明度：董事会构成、独立董事名单、审计委员会和治理章程均未公开披露。2026 年 6 月 Series B 公告没有点名领投方代表入董事会，尽管 8VC
              有投资备忘录，且本轮投入资本规模很大。天使投资人名单——Eric Yuan、Bin Lin、Fei-Fei Li、Naval
              Ravikant——声望很高，但不能在运营上提供保护。股权计划、归属等待期或留任条款都不公开，公众资料无法验证联合创始人锁定概率。

              人才留存风险延伸到创始层之下：更广泛团队来自 Google DeepMind、OpenAI 和 Boston Dynamics，而这些机构也最积极争夺具身 AI 研究人员。2026 年，DeepMind 的
              Gemini Robotics 1.5、Physical Intelligence 扩张后的团队和 Figure AI 都能提供有竞争力的薪酬和有声望的研究环境。Generalist AI 只有 70
              名员工，创始人以下没有深厚板凳。模型架构团队或数据引擎团队任何一个关键成员离开，都可能让 GEN-2 延后数个季度，且不易替补。公司的招聘岗位显示其意识到这一点：开放岗位覆盖研究、ML
              基础设施、算力优化、机器人控制和应用伙伴关系，说明团队仍在搭建关键冗余。本章所有风险——监管、模型安全、算力、资本——都离不开稳定的高级领导层，因此关键人物集中是风险放大器，而不是孤立维度。
