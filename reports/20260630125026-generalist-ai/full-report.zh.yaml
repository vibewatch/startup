      - number: '5.6'
        title: 信任、安全、对齐与质量控制
        blocks:
          - type: paragraph
            body: >
              Generalist AI 已承认，具身基础模型存在特定的安全与对齐缺口。在 GEN-1 博客中，公司指出，GEN-1
              的即兴智能既是优势（能从意外场景中自发恢复），也可能成为责任：涌现行为是具有真实后果的物理动作，训练分布之外的即兴发挥可能导致非预期机器人行为。公司称目标是改进对齐方法，以「精准引导」模型进入期望行为，但尚未发布正式对齐框架、安全协议或时间表。

              GEN-1 的任务表现通过真实机器人上的内部 A/B 评估衡量，采用盲评分和闭环策略执行，GEN-0 博客对此有描述。这种验证仅限内部：公司未公开披露任何独立第三方对 99%
              成功率主张的审计。具体基准任务集、评估环境和统计方法也未发布。GEN-1 也承认自身局限：并非所有任务都达到 99%+ 成功率，有些任务若要在现实部署中有用，还需要更高成功率。

              物理数据采集运营的隐私和数据安全治理未公开披露。公司从多个地区的数千个家庭、仓库和工作场所收集视频与感觉运动数据，这一范围很可能触发 GDPR、CCPA
              及同等隐私义务。公司未公开说明同意框架、数据主体权利、留存政策或监管指引。也未提及 SOC 2、ISO 27001 或同等信息安全认证。作为双用途物理 AI 基础模型，GEN-1
              是否适用出口管制，公司也未公开回应。
