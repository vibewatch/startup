            title: 数据飞轮带来伙伴锁定，也带来 IP 风险
            body: >
              向 Generalist AI 分享专有任务数据、用于定制 GEN-1 的早期访问伙伴，一边在加固公司的竞争护城河，一边也可能为未来竞争者铺出类似能力。数据贡献协议中的 IP
              条款、排他性条款和保密范围均未公开。拥有专有制造流程的成熟企业客户，可能会拒绝缺少强排他保护的数据分享条款。数据飞轮的商业逻辑与单个客户 IP 顾虑之间的张力，是一项实质性采购摩擦。
            calloutType: insight
            claimRefs:
              - CU035
              - CU036
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是最紧迫的风险栈，EU AI Act 执法即将启动
        blocks:
          - type: paragraph
            body: >
              EU AI Act 对高风险 AI 系统的义务将于 2026 年 8 月 2 日全面可执行；如果 GEN-1 在欧盟部署，或由欧盟境内机器人运营方使用，Generalist AI 立刻面临合规期限。根据该法第 6
              条，AI 系统作为受欧盟协调立法覆盖产品的安全组件运行，并且该产品需要第三方合格评定时，就被认定为高风险。GEN-1
              若部署在工厂车间的工业机器人——机械臂、协作机器人或半人形系统——内部，几乎必然触发这一门槛，尤其是在汽车或电子装配等机器人安全认证为强制要求的行业。高风险分类会触发一整套义务：持续风险管理系统、数据治理文档、足以支持合格评定的技术文档、人类监督措施、准确性与稳健性要求、上市后监测，以及基本权利影响评估（FRIA）。违规处罚最高可达
              €35 million 或全球年营业额 7%，以较高者为准。截至 2026 年 6 月 30 日，Generalist AI 未发布 DPA、合格评定文档、高风险声明，也没有面向欧盟 GEN-1
              部署的合规或隐私通知。公司唯一公开披露的是早期访问伙伴计划的联系邮箱。这符合早期商业化阶段特征，但也意味着投资者完全看不见其合规状态。

              另一条法律敞口来自产品责任法。在美国，严格产品责任原则规定，只要缺陷产品造成伤害，制造商即使不存在过失也要承担责任。AI 软件提供方与硬件制造商分离时，责任如何归属，法院仍在处理；欧盟 AI Liability
              Directive 已开始填补这一缺口，但美国联邦法律尚未跟进。对 Generalist AI 来说，风险是分层的：如果运行 GEN-1 的机器人伤害工人，诉讼可能同时点名硬件
              OEM、系统集成商和作为模型提供方的 Generalist AI。Generalist 尚未公开披露任何保险覆盖、赔偿条款或责任分配框架。RAND 2024 年关于美国侵权法适用于 AI 系统的分析发现，AI
              开发链条碎片化会让因果归属变得复杂，并让模型提供方面临难以预测的敞口。由 Yoshua Bengio 主持的 International AI Safety Report 2026 将具身 AI
              的问责缺口列为该领域最紧迫的治理挑战之一。GDPR 带来第三条法律线：Generalist AI 在全球数千个家庭、仓库和工厂收集物理交互数据，范围包括欧盟。这些数据包含细粒度手腕运动学、工作空间视频，以及
              data-hands 操作员可能产生的生物识别元素。GDPR 第 9 条将通过生物识别处理唯一识别个人的数据视为特殊类别数据，需要明确同意和严格控制。公司尚未发布该数据收集计划的公开隐私通知、DPIA
              文档或同意管理框架。
