              AIRoboticDaily 记录，约 95% 的人形机器人收入来自研究 / 展厅用途。Brad Porter 支持经过生产验证的 Physical AI。NVIDIA GR00T
              免费。这些风险都不需要灾难性失败——只需要商业化慢于牛市叙事。
            calloutType: risk
