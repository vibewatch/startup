  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：保持跟踪并严守入场条件——存在相对价值，但没有商业证明
        blocks:
          - type: paragraph
            body: >
              Generalist AI $2 billion 投后估值低于 Physical AI 领域的直接软件可比公司。Physical Intelligence 2026 年 3 月正在洽谈以 $11 billion
              估值融资，Skild AI 则已在 2026 年 1 月以 $14 billion 估值完成融资，并报告约 $30M 年经常性收入——如果只按纯可选性看，Generalist AI
              相对私募市场显得便宜。投资人阵容增强了这一判断：Radical Ventures（领投）、NVIDIA NVentures、Bezos Expeditions、8VC、Union Square
              Ventures，以及包括 Fei-Fei Li 和 Eric Yuan 在内的天使投资人，对这个年龄的公司来说，是前沿 AI 社群信心异常强的信号。

              但定价逻辑完全处于商业化前。Generalist AI 未披露任何收入、ARR、客户数量、定价、毛利率或单位经济。GEN-1 早期访问计划于 2026 年 4 月启动，但没有具名伙伴获得确认。8VC
              备忘录提到“显著的早期商业进展”，这是最强公开信号，但没有量化，而且来自已投资方。没有私下尽调，仅凭这些不足以支撑 $2B 估值锚。

              建议是跟踪。若投资者可以取得私下尽调，并确认至少一个可验证、产生收入的部署，应在入场价格和股权结构表 条款确认后，把结论重新评估为有条件买入。没有该确认时，$2B
              标记最好被视为押注技术命题的真实期权：值得密切跟踪，但还不足以按完整仓位承销。
