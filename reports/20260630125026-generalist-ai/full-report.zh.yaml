      - number: '6.2'
        title: 伙伴证据与数据飞轮信号
        blocks:
          - type: paragraph
            body: >
              最具体、可公开验证的伙伴证据，是 Universal Robots 邀请 Generalist AI 于 2026 年 3 月在 NVIDIA GTC 2026 演示 GEN-0。Universal Robots
              是全球按出货量计最大的协作机器人制造商，为演示提供了其全新移动操作平台——MiR 移动底盘上的 UR7e 机械臂和 Vention 框架。Generalist AI
              描述该活动的博客称，这套机器人硬件是新的，团队此前从未实际接触过；公司明知只有几天准备时间，仍答应演示。GEN-0 模型在数天内适配新硬件，并在会议全部开放时段连续运行。这是一家重要硬件 OEM 选择
              Generalist AI 技术参加公开现场活动的具名、公开记录案例——是重要背书，但不是商业授权或部署协议。

              NVIDIA GTC 2026 年 3 月新闻稿提到 Generalist AI「使用 Cosmos 探索生成合成数据」——这是 NVIDIA 生态内的技术合作，但相比 Skild AI（ABB
              Robotics、Universal Robots、Foxconn）或其他已被赋予伙伴角色且拥有正式部署关系的参与者，只是边缘性引用。Generalist AI 未被列入 NVIDIA「把物理 AI
              带入真实世界」叙事中的主要伙伴，说明它仍处生态进入阶段。

              2026 年 6
              月融资公告明确写道：「一个飞轮已经开始成形：扩展机器人学习会创造更好的模型，更好的模型能完成更有用的物理工作，而真实企业的数据会驱动下一代更强模型。」其中「真实企业」意味着公司与实际工业运营方存在数据共享或合同关系——这与
              GEN-1 技术材料描述的数据工厂伙伴计划一致。8VC 投资备忘录也用「显著的早期商业牵引」强化了这一点，称其为投资驱动因素之一。8VC 和 Generalist AI 都未确认这些关系的数量、身份或收入规模。

              Spark Capital 的 Fraser Kelton 曾负责 OpenAI
              产品商业化，他在投资相关表述中提到「机器人规模化中的早期商业验证」，说明投资人看到了公开不可见的真实客户互动证据。多个投资人围绕商业牵引给出证明，但没有任何公开参考客户；这种组合符合受 NDA
              保护、面向战略工业伙伴的早期访问计划，也符合当前阶段企业机器人的标准做法。
