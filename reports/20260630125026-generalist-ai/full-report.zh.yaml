      - number: '5.7'
        title: 证据材料
        blocks:
          - type: callout
            title: 硬件无关基础模型，跨形态速度已获验证
            body: >
              2026 年 3 月 GTC 现场演示验证了公司最重要的运营主张：GEN-0（以及延伸到
              GEN-1）能在短短几天内泛化到一种全新机器人类型——此前从未进入公司实验室的机器人——且只使用现有办公室数据，完全不使用演示场馆数据。这是硬件无关部署中很难伪造的证明点。结合 GEN-1 的 1
              小时适配要求，它显著降低了部署摩擦；过去机器人智能长期被锁定在特定硬件厂商上，而 Generalist AI 的智能层因此可在不同 OEM 间商业替代。
            calloutType: strength
            claimRefs:
