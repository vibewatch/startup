  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争框架与市场结构
        blocks:
          - type: paragraph
            body: >
              物理 AI 基础模型市场可以分成四类竞争原型，每一类都代表一种捕获机器人技术栈智能层的不同策略。第一类是纯软件 / 智能层公司，不制造硬件，只打造通用机器人大脑：Generalist AI、Physical
              Intelligence 和 Skild AI 是主要例子。这些公司围绕模型泛化、数据规模、硬件无关性，以及把单一训练模型分发到多样机器人形态的能力竞争。第二类是全栈人形集成商，同时打造硬件本体和专有 AI
              大脑：Figure AI、Boston Dynamics（Atlas）、1X Technologies 和 Agility Robotics
              是例子。这些玩家掌控硬件-软件接口，可以让模型和机体一起迭代，但分发天然受限于自有硬件队伍。第三类是既有平台玩家——拥有相邻算力、数据或分发资产，并向机器人延伸的科技公司：Google DeepMind 和
              NVIDIA。Google 提供网页级多模态预训练和商业 API；NVIDIA 提供主导性的 GPU 栈，并把开源 GR00T
              模型作为亏本引流产品来推动硬件采用。第四类是现状方案和内部自建：大规模人工劳动、经典工业自动化（ABB、FANUC、KUKA），以及 Amazon（前 Covariant 创始人）和
              Tesla（Optimus）的垂直整合内部 AI 团队。Generalist AI 在第一类中最直接对标 Physical Intelligence 和 Skild AI；长期看，它还面临 NVIDIA
              通过向所有开发者免费分发开源 VLA 而商品化模型层的颠覆风险。Figure AI 和 Boston Dynamics 等全栈集成商，既可能成为 Generalist 模型的潜在客户，也会争夺企业部署预算。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
