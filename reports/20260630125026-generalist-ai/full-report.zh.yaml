  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 收入和商业牵引
        - 已确认 ARR、至少一个具名付费客户的合同条款、管线规模
        - 整个 $2B 论点都押在未来商业执行上；公开来源没有收入锚
        - 在资料室要求提供商业管线报告、早期访问合作方名单，以及 MOU/LOI 条款
      - - 股权结构表和优先权结构
        - 完整股权结构表，展示稀释后股数、期权池、清算优先权和棘轮条款
        - 经过清算优先权分配后，名义 $2B 投后估值可能大幅高估有效经济入场价
        - 向公司或领投方（Radical Ventures）索取股权结构模型和 B 轮条款清单
      - - 独立模型性能验证
        - 第三方或独立基准，确认 GEN-1 的 99% 成功率和 1 小时适应能力主张
        - 所有性能主张都来自公司；买入前必须拿到独立验证
        - 将分阶段部署试点或独立技术审计作为投资条件
      - - 董事会构成和治理
        - 确认董事席位（Radical Ventures、NVIDIA NVentures）、独立董事、观察员权利
        - 治理结构决定决策推进速度，也决定投资人保护条款是否存在
        - 向公司索取董事会构成确认材料和治理文件
      - - 烧钱速度与现金续航轨迹
        - 实际月度烧钱额（非估算）、招聘计划、到 2027 年的算力资本开支排期
        - 估算 $10M/月只是代理值；实际烧钱额和成本拆分未知
        - 索取最近 4 个季度的季度管理账和董事会财务材料
    notes: |
      五项尽调事项都会阻断买入建议。任一项缺失，都应维持跟踪评级。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV029
      - CV039
      - CV040
