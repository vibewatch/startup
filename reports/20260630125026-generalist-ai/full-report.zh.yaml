  - id: FR001
    title: 风险热力图
    type: matrix
    approximationNotes: |
      有序评分基于有来源支撑的证据，而非合成概率；剩余严重性反映的是证据支持的缓释缺口评估，不是统计估计。
    claimRefs:
      - CR001
      - CR003
      - CR007
      - CR011
      - CR019
      - CR034
      - CR026
      - CR029
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: EU AI Act 合规缺口
          values:
            - label: 高
              detail: 高风险执法期限为 2026 年 8 月 2 日；没有公开合规文件。
              tone: negative
            - label: 严重
              detail: 罚款最高可达 €35M 或全球营业额 7%；会阻断欧盟部署。
              tone: negative
            - label: 未确认
              detail: 公开资料看不到符合性评估、DPA 或欧盟法律顾问。
              tone: negative
            - label: 很高
              detail: 公开记录中该缺口未被缓释；Series C 前必须解决。
              tone: negative
        - label: 物理机器人事故的产品责任
          values:
            - label: 中
              detail: 未确认既往事故；早期访问阶段限制当前暴露。
              tone: warning
            - label: 严重
              detail: 人身伤害风险会引发诉讼和声誉暴露。
              tone: negative
            - label: 未确认
              detail: 未披露保险、赔偿或责任分配框架。
              tone: negative
            - label: 高
              detail: 早期访问合作伙伴处发生一起事故，就可能决定公司命运。
              tone: negative
        - label: 采集运营中的 GDPR / 数据隐私
          values:
            - label: 高
              detail: 全球采集覆盖家庭和工作场所，包含欧盟数据主体。
              tone: negative
            - label: 高
              detail: GDPR 第 9 条下的特殊类别生物识别数据；罚款最高 €20M。
              tone: negative
            - label: 未确认
              detail: 公开资料看不到 DPIA、DPO 或同意框架。
              tone: negative
            - label: 高
              detail: 欧盟部署规模扩大后，执法风险上升。
              tone: negative
        - label: NVIDIA 算力依赖
          values:
            - label: 高
              detail: H100/Blackwell 交付周期 36–52 周；供应存在结构性约束。
              tone: negative
            - label: 高
              detail: GEN-2 训练延迟会拉大与 Physical Intelligence 的竞争差距。
              tone: negative
            - label: 低
              detail: NVIDIA 共同投资意味着可能有一定优先供给；多云未确认。
              tone: warning
            - label: 高
              detail: 据行业分析，供应约束风险会持续到 2027 年。
              tone: negative
        - label: GEN-1 模型安全与即兴能力缺口
          values:
            - label: 中
              detail: 未确认事故；但迄今生产部署有限。
              tone: warning
            - label: 高
              detail: 物理部署失败会立刻显现；未发布安全审计。
              tone: negative
            - label: 低
              detail: 未发布信任与安全框架或对齐文档。
              tone: negative
            - label: 高
              detail: 缺少第三方验证，剩余风险因此抬高。
              tone: negative
        - label: 关键人物集中度
          values:
            - label: 低
              detail: 三位联合创始人均活跃；没有离职信号。
              tone: positive
            - label: 严重
              detail: Florence 和 Zeng 在叙事与技术方向上高度集中。
              tone: negative
            - label: 低
              detail: 未公开股权安排、继任计划或董事会结构。
              tone: negative
            - label: 高
              detail: 投资人信心很大程度押注联合创始人团队延续性。
              tone: negative
  - id: FR002
    title: 风险传导图
    type: dag
