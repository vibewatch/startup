      - number: '5.2'
        title: 训练数据引擎与物理交互数据集
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的核心技术差异化，是其专有物理交互数据集，以及生成该数据集的数据引擎。数据集用公司称为「data
              hands」的腕戴或手持人体工学可穿戴设备采集——这类轻量设备能以接近自然的力反馈捕捉人类操作数据。不同于 Physical Intelligence 等竞争对手使用的遥操作装置，data hands
              保留了自然的感觉运动闭环：短暂适应后，人类操作者不再「思考」，而是开始反应，因此轨迹捕捉到的是反射、微调和实时错误恢复，而非僵硬刻意的动作。

              GEN-1 的预训练数据集中没有机器人数据：全部由 data hands 设备捕捉的人类操作构成。这是有意为之——公司认为，把机器人数据排除在预训练之外，可以形成更可泛化的感觉运动先验；随后用 1
              小时机器人专属数据微调，才首次同时把模型适配到机器人的具体形态和目标任务。

              到 GEN-0 发布时（2025 年 11 月），数据集已达到 270,000 小时真实世界物理交互；到 GEN-1 发布时（2026 年 4 月），增长至 500,000 小时以上。数据仍以每周超过
              10,000 小时的速度增加。采集地点覆盖全球数千个家庭、仓库、工作场所和专门环境，包括面包店、自助洗衣店和工厂。全球硬件网络和数千台数据采集设备支撑运营。数据工厂伙伴贡献的数据被分为第 1 类（特定任务）、第
              2 类（混合）和第 3 类（任意任务）模式，使公司能够 A/B 测试哪种数据混合最能提升预训练。处理基础设施包括 O(10K)
              个核心用于持续多模态数据处理、多云合同、配备专线互联网的定制上传机器，以及每天训练可吸收 6.85 年操作经验的技术。
