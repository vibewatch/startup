    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 对 Generalist AI 的影响
      - 尽调追问
    rows:
      - - 制造和物流劳动力短缺
        - 驱动（+）
        - 结构性 / 多年
        - 扩大可触达市场；降低买方自动化投入的 ROI 门槛
        - 核验前三大目标垂直行业的具体劳动力成本指标
      - - 政府自动化补贴（美国、中国、德国、韩国）
        - 驱动（+）
        - 2025–2028
        - 缩短客户回本周期；降低前期资本开支阻力
        - 把补贴项目映射到具体客户所在地和资格条件
      - - 电商履约需求增长
        - 驱动（+）
        - 结构性
        - 仓储 / 3PL 是 AI 机器人增长最快的买方群体
        - 找出正在履约场景试点基础模型的具体 3PL 客户
      - - 回流 / 近岸化投资周期
        - 驱动（+）
        - 2024–2028
        - 新建工厂默认采用自动化，减少传统系统集成摩擦
        - 评估愿意采用 AI 原生机器人的新建工业客户管线
      - - 机器人硬件成本下降（协作机器人入门价约 $10K）
        - 驱动（+）
        - 当前 / 加速
        - 压低硬件门槛；差异化转向软件层
        - 跟踪协作机器人 ASP 走势；评估硬件商品化是否会增强 Generalist AI 定价权
      - - 基础模型快速适配任务（约 1 小时）
        - 驱动（+）
        - 当前（GEN-1）
        - 让边际任务自动化具备经济性；压缩编程成本
        - 在公司可控演示之外的客户部署中核验 1 小时说法
      - - 研发资本强度（前沿人形机器人需 $3–4B）
        - 约束（−）
        - 当前 / 持续
        - 抬高竞争门槛；利好资金充足的在位者；模型质量若进入平台期则有风险
        - 确认烧钱速度，以及达到下一个前沿里程碑所需资本
      - - '''Chopstick problem''：精细运动操作'
        - 约束（−）
        - 当前 / 部分未解
        - 限制可触达任务；压低高灵巧度垂直行业 SAM
        - 用行业阈值对 GEN-1 的灵巧操作任务做基准测试
      - - 物理数据瓶颈
        - 约束（−）
        - 当前 / 多年
        - 基础模型质量受数据限制；数据采集需要重资本投入
        - 评估数据采集速度、质量标准和环境多样性
      - - 传统系统集成摩擦（PLC、MES、ERP）
        - 约束（−）
        - 当前 / 持续
        - 每个工位增加 $40K–$80K 集成成本；拉长销售周期
        - 确认认证集成商供给，以及集成工具路线图
      - - 安全与责任框架不成熟
        - 约束（−）
        - 当前 / 改善中
        - 拉长企业风险审批；可能把部署限制在非安全关键工位
        - 跟踪 ISO 9283 / ISO TS 15066 合规态势；识别首个认证部署
      - - 边缘计算硬件瓶颈
        - 约束（−）
        - 当前 / 2026–2027
        - VLA 模型需要专用端侧推理；芯片供应预计偏紧
        - 评估硬件合作伙伴，以及端侧推理性能路线图
    notes: |
      驱动 / 约束的时点基于 IFR 行业报告和分析师共识估计。Generalist AI 未披露单位经济、单次部署成本或获客成本数据。影响判断为方向性评估；尽调追问并非穷尽清单。
