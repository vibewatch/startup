  - id: FO002
    title: Generalist AI — 公司快照逻辑（系统流）
    type: flow
    layout: standard
    summary: |
      Generalist AI 的身份、数据引擎、产品模型和资本如何连成一个系统。
    data:
      nodes:
        - id: founders
          label: 创始团队（Florence / Zeng / Barry）
          detail: Google DeepMind + Boston Dynamics 背景；具身 AI 研究履历
        - id: data-engine
          label: 物理数据引擎
          detail: 500K+ 小时数据，来自全球家庭、仓库和工作场所中的 Data Hands 设备
        - id: foundation-models
          label: 基础模型（GEN-0、GEN-1）
          detail: 多模态、从零训练、跨本体；Harmonic Reasoning 架构
        - id: customers
          label: 选定行业合作伙伴
          detail: 早期访问计划；未具名；瞄准服装、物流、制造业
        - id: capital
          label: '> $500M 资本（NVIDIA、Radical、Spark、Bezos）'
          detail: 为数据规模化、算力、招聘和下一代模型开发提供资金
        - id: flywheel
          label: 数据飞轮
          detail: 真实部署 → 新训练数据 → 更好模型 → 更多部署
      edges:
        - from: founders
          to: data-engine
          label: 设计数据采集策略
        - from: data-engine
          to: foundation-models
          label: 用 500K+ 小时物理交互训练
        - from: foundation-models
          to: customers
