      - number: '8.2'
        title: 价格背景：$2B 是直接软件可比公司中最低水平——收入前状态限制所有传统锚点
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的 $2B 估值显著低于最近对手立下的私募市场基准。Physical Intelligence 2025 年 11 月 Series B 估值为 $5.6 billion，到 2026
              年 3 月，据报道公司正洽谈以 $11 billion 估值新一轮融资。Skild AI 在 2026 年 1 月完成 $1.4 billion Series C，估值超过 $14 billion，由
              SoftBank 和 NVIDIA 领投——而 Skild 披露了约 $30M 收入，至少为其高得多的倍数提供一个收入锚。Figure AI 作为软硬件一体的全栈竞争者，2025 年 9 月达到 $39
              billion 估值。

              没有收入数据，无法对 Generalist AI 套用传统收入倍数。用前瞻预测倒推：按 20x 倍数（适用于具备早期商业进展的高增长私有 AI 软件公司），$2B 意味着目标 ARR 为 $100M；按
              40x（适用于收入前前沿 AI 的稀缺溢价），$2B 只需要 $50M ARR。两个场景都说得通，但都没有已确认指标支撑。相比之下，Finerva 对上市 Robotics & AI 公司分析显示，2025 年
              Q4 行业 EV/Revenue 中位数为 3.4x，EBITDA 中位数为 16.8x——但这些上市公司中位数反映的是成熟、有收入企业，不适用于收入前阶段公司。Finro 2026 年 Q1 数据集显示，LLM
              厂商 EV/Revenue 中位数为 39.5x，AI 机器人私有公司按预计前瞻收入估算为 20–60x。

              对 Generalist AI 来说，最诚实的 $2B
              表述根本不是收入倍数，而是技术与团队的期权价格。相对同行，入场便宜；但在商业证明为零时，绝对价格并不便宜。任何以该价格进入的投资者，实际上是在为几件事付费：(1) 创始人在 DeepMind 和 Boston
              Dynamics 的履历与历史战绩，(2) 500,000+ 小时专有数据集护城河，(3) GEN-1 架构差异化，(4) 物理基础模型能否像语言模型一样扩展的真实期权。$2B
              对这些期权是否公允，取决于投资者只能通过私下尽调建立的确信。
