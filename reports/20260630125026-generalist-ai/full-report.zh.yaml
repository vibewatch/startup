              GDPR（欧盟）、CCPA（加州）以及多个司法辖区的同等隐私义务。公司未披露公开声明、隐私政策、同意框架、数据处理协议或监管指引。缺少任何已披露合规基础设施，是一个重大尽调缺口，可能使公司面临执法行动，限制其在关键地区采集数据，或迫使其付出高成本追溯整改。
