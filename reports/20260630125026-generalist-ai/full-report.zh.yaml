    summary: |
      制造业或物流买方旅程中，AI 机器人软件平台从初步认知到生产规模化的采购和部署步骤。
    data:
      nodes:
        - id: awareness
          label: 认知与初步评估
          detail: 买方识别劳动力 / 生产率问题；调研可用的 AI 机器人软件供应商；来源包括 IFR、行业媒体或集成商转介。
          tone: neutral
        - id: pilot
          label: 概念验证 / 小范围试点
          detail: 受控任务试点（通常 1–3 个机器人工作单元）；评估任务成功率、设置时间和集成工作量。GEN-1 目标：约 1 小时适配新任务。
          tone: positive
        - id: integration
          label: 系统集成与认证
          detail: PLC/MES/ERP 连接；安全认证（ISO 9283、ISO/TS 15066）；每个工作单元 $40K–$80K 集成商成本；周期 3–12 个月。
          tone: warning
        - id: business-case
          label: ROI 验证与预算批准
          detail: 形成有记录的回本测算；工业机器人通常为 1.3 年中位数；由工厂 / 运营资本委员会批准。
          tone: neutral
        - id: production
          label: 生产部署
          detail: 机队部署；OTA 模型更新；持续监控成功率、吞吐量和异常率。
          tone: positive
        - id: expansion
          label: 机队扩张与数据飞轮
          detail: 增加工作单元、任务和地点；部署数据回流给供应商用于模型改进；经常性订阅收入启动。
          tone: positive
      edges:
        - from: awareness
          to: pilot
          label: 供应商评估 → POC 协议
        - from: pilot
          to: integration
          label: 试点成功 → 集成项目
        - from: integration
          to: business-case
          label: 集成完成 → ROI 汇报
        - from: business-case
          to: production
          label: 预算批准 → 生产上线
        - from: production
          to: expansion
          label: ROI 证明 → 机队扩张
