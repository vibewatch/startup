          - type: callout
            title: 采用漏斗背着多步集成税
            body: >
              买方从试点走到量产，必须经过一个集成检查点：每个单元成本 $40,000–80,000，通常耗时 3–12 个月。这笔集成税是结构性的，因为每家量产工厂都运行认证 PLC、MES
              系统和安全协议，并需要第三方验证。除非 Generalist AI 为前五大制造自动化平台（Siemens TIA Portal、Rockwell FactoryTalk、Beckhoff TwinCAT、ABB
              Ability、Fanuc FOCAS）跑通经验证的集成路径，否则从演示成功走向量产部署的商业路径仍只是未经确认的假设。
