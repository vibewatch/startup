      - - 硬件无关性（跨形态；一个模型适配所有机器人本体）
        - 垂直整合的竞争者（Figure AI、Boston Dynamics）通过面向硬件的调优获得更强的软硬件协同； 如果硬件锁定主导市场，模型无关玩家会丢掉部署渠道
        - 中
