      - - 架构新颖性（从零训练；不是 VLA 微调；不是世界模型）
        - 机器学习架构创新的竞争寿命历来较短；NVIDIA GR00T N1.6 使用类似的从零训练逻辑；PI 的 openpi 让外界可以反向推断其架构选择
        - 中
