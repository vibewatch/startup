      - number: '5.5'
        title: 技术差异化、IP 与竞争位置
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的主要差异化建立在五个支柱上。第一，数据集规模和质量：公司自称，截至 2026 年 4 月，其 500,000+
              小时物理交互数据集是全球最大的真实世界操作数据集合，并通过专有低成本可穿戴系统采集，捕捉自然人类灵巧性，而不是缓慢僵硬的遥操作轨迹。第二，从零训练的架构：GEN-1 完全从零训练，而非在 VLM
              上微调，让公司掌握完整架构控制权。第三，Harmonic Reasoning：公司的新型连续时间架构，允许同时感知和行动，不受顺序式「暂停再行动」循环的性能天花板限制。第四，扩展规律验证：GEN-0
              是首个展示可预测机器人扩展规律的模型（预训练数据规模与下游表现之间呈幂律关系），为可预测改进提供路线图；没有同等数据规模的竞争对手很难复制。

              与最接近且公开度最高的竞争对手 Physical Intelligence 的 pi-0 相比，GEN-1 折盒子用时 12 秒，pi-0 约 34 秒（快 2.8x）；GEN-1 报告 99% 成功率，而
              GEN-0 和 pi-0 的可比任务时长约为 34 秒。Generalist AI 的方法在预训练上与 pi-0 根本不同：GEN-1 预训练不使用机器人数据，pi-0
              则使用大规模遥操作数据集。公司认为，这会在部署时带来更高数据效率，并更好泛化到新环境。GTC 演示验证了第二个差异化主张：GEN-0
              能在几天内泛化到全新机器人类型，公司将这种能力描述为「机器人到场就能工作的未来」。

              IP 细节、专利申请和专有数据权利框架都未公开披露。公司依赖商业秘密来保护训练流程和数据集，而不是通过专利披露。
