      - number: '1.2'
        title: 创始人、领导层与关键人物风险
        blocks:
          - type: paragraph
            body: >
              Generalist AI 由三位在具身 AI 和机器人领域根基很深的研究者共同创立。Pete Florence（CEO）曾任 Google DeepMind 高级研究科学家，也是 PaLM-E 和 RT-2
              的资深作者；这两篇论文是机器人学习中引用率最高的基础论文之一。Andy Zeng（首席科学家）曾任 Google DeepMind 研究科学家和技术负责人，也是「Code as
              Policies」主要作者；这同样是一篇影响力很高的机器人论文。Andrew Barry（CTO）曾任 Boston Dynamics 高级机器人专家，参与 Atlas、Spot、Stretch 等平台，并与
              Harvard 机器学习团队有关联。

              更广泛的团队来自 OpenAI、Boston Dynamics 和 Google DeepMind。以公司年龄看，Generalist AI 拥有异常集中的研究履历。8VC 的投资人评论把 Pete
              Florence 描述为「既是研究者，也是实干的建设者——很有号召力，并且在同等研究履历的人里少见地商业化」，凸显公司刻意在前沿研究和商业执行之间做平衡。

              关键人物集中度是实质风险。公司的科学身份、融资叙事和媒体能见度都紧紧绑定 Florence 和
              Zeng；几乎所有主要媒体报道都会点名两人。公司尚未公开披露正式董事会构成；治理结构、独立董事席位和任何董事会观察员，在可得公开来源中都未得到确认。按惯例，2026 年 6 月融资的领投方 Radical
              Ventures 可能拥有董事席位，但官方并未确认。
