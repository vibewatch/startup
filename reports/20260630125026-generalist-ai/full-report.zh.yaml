  - id: FU001
    title: 客户旅程图 — 企业机器人运营方
    type: journey-map
    layout: wide
    summary: 一家企业制造或物流运营方评估 GEN-1 时的示意性采用路径。
    data:
      nodes:
        - id: stage-discovery
          label: 发现
          actor: Operations / automation lead
          description: >
            通过投资人新闻报道、NVIDIA GTC 演示报道、行业媒体（Robot Report、SiliconAngle）或具身 AI 生态内部同行推荐，企业知道 Generalist
            AI。没有自助试用或演示环境；初始联系渠道为 partnerships@generalistai.com。
          channels:
            - Industry trade press
            - NVIDIA ecosystem events
            - Investor announcements
            - Peer referral
        - id: stage-evaluation
          label: 技术评估
          actor: Robotics engineer / automation architect
          description: >
            技术可行性评估会看几件事：GEN-1 能否适配现有机器人硬件（6DoF、7DoF 或移动平台）、数据采集要求（1 小时机器人专属数据集）、安全资质要求，以及与现有 ERP / WMS 系统的集成。公开资料没有 API
            文档、SDK 或技术参考架构，企业无法自助评估。
          channels:
            - Direct engagement with Generalist team
            - NVIDIA GTC demo evidence
            - Published GEN-1 benchmark blog
        - id: stage-pilot
          label: 早期访问试点
          actor: Operations team + Generalist AI applied team
          description: >
            入选的行业合作伙伴可通过早期访问计划使用 GEN-1（2026 年 4 月 2 日启动）。试点需要在合作伙伴自有硬件上部署 GEN-1，并采集 1
            小时机器人专属微调数据。结果指标、SLA、定价和支持条款均未公开披露。
          channels:
            - Early-access partner program (April 2026)
            - Co-located data collection
        - id: stage-production
          label: 生产部署
          actor: Enterprise operations (robot fleet)
          description: >
            截至 2026 年 6 月 30 日，没有已确认的生产部署。进入生产的商业门槛包括经过独立验证的可靠性（经济性任务 >99%）、安全认证（ISO 10218 / TS
            15066），以及与运营系统集成。公开资料尚未确认这些要求已经满足。
          channels:
            - Direct commercial agreement
            - OEM embedded deployment
        - id: stage-expansion
          label: 扩张 / 增购
          actor: Enterprise fleet operations
          description: |
            数据飞轮模型会推动扩张：部署的机器人越多 → 任务数据越多 → 面向所有客户的模型越好，也包括贡献部署数据的合作伙伴。后续可能扩展到新的机器人形态、任务类型或设施站点。没有扩张指标或增购证据。
          channels:
            - Cross-form-factor expansion
            - New facility rollout
            - Task library expansion
