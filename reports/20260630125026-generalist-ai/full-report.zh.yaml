      - number: '1.5'
        title: 里程碑与公司轨迹
        blocks:
          - type: paragraph
            body: >
              Generalist AI 运营不到 30 个月，就跑出了一条异常压缩的里程碑序列：成立、首轮融资完成、两代模型发布，以及以初始估值 5 倍完成第二轮融资。2026 年 6
              月的融资公告明确称数据飞轮已经出现——真实企业正在生成任务数据，喂给后续模型迭代——这标志着公司从纯研发转向早期商业运营。

              截至本文撰写时，公司最主要的有记录负面信号来自外部：投资人和独立分析师质疑「只靠扩大数据规模就足够」这一命题。Cobot CEO、前 Amazon 机器人高管 Brad Porter 在 Forbes
              采访中称，「在一个并不完美的架构上硬砸海量数据，成本非常高，也未必能得到你想要的结果」；他引用 ImageNet 和 transformer
              突破的历史类比，作为规模必须与架构创新共同演化的证据。Generalist AI 在 GEN-1 博文中给出的隐含反驳是，GEN-1 本身就是从零训练的完整架构重设计，而不是蛮力复制。

              截至 2026 年 6 月本次运行日，公开可得来源未报道监管行动、专利纠纷、诉讼、领导层离职、裁员或安全事件。

              竞争对手语境很重要：截至 2026 年 4 月，Physical Intelligence（pi.ai）据称正在洽谈以 $11B 估值融资 $1B——这意味着 Generalist
              的估值大约只有该竞争对手隐含估值的五分之一，同时声称自己具备架构差异化。
