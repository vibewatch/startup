      - number: '4.4'
        title: 公开财务指标与证据缺口
        blocks:
          - type: paragraph
            body: >
              Generalist AI 是私营公司，未披露收入、ARR、客户数、毛利率或单位级财务指标。公司公开披露只限于：（a）带投后估值的融资公告，（b）模型发布博客，（c）Ashby
              和公司招聘页上的招聘活动。外界无法取得投资者关系材料、审计财务报表或二级交易数据。

              现有间接牵引信号都只是定性：8VC 所称「早期商业牵引」、公司自己称真实企业参与的数据飞轮「开始成形」，以及 Robot Report 引用的 2026 年 4
              月「早期访问伙伴现在可以获得模型访问权」。这些都不能构成已确认收入。

              可获得的公开信息，与财务承销所需数据之间差距很大。收入、ARR、毛利率、流失率、客户集中度和烧钱率，全部只能靠非公开证据确认，需要管理层直接披露或审计财务记录来解决。在这些缺口关闭之前，任何 Generalist
              AI 财务模型都只能建立在商业模式类比（Physical Intelligence、其他具身 AI SaaS 公司）之上，而不是已披露的实际数据。
