      - number: '1.3'
        title: 技术平台与产品里程碑
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的核心技术路线立在三根支柱上：自有大规模物理交互数据集、专门设计的多模态基础模型架构，以及名为「data hands」的硬件数据采集系统。

              data hands 是绑在手腕上的设备，用来在全球各地的家庭、仓库和工作场所大规模记录人类操作任务，包括抓取、放置、折叠和配套分拣。这条路线绕开了 Physical Intelligence
              等竞争对手使用的远程操作装置，而是用较低成本、更高多样性捕捉自然的人类灵巧操作。由此形成的数据集，从 GEN-0 发布时的 270,000 小时，增长到 GEN-1 发布时的 500,000
              小时以上，并且仍以每周超过 10,000 小时的速度扩张。

              GEN-0（2025 年 11 月 4 日发布）首次展示了机器人领域的扩展律：模型越大、物理数据越多，下游任务表现就会以可预测方式提升。GEN-0 还引入 Harmonic
              Reasoning，这是一种新的训练架构，让模型可以在连续时间里同时思考和行动；真实物理系统不会暂停，这一点至关重要。在已测试的模型规模（最高 10B+ 参数）下，GEN-0 展示了跨 6DoF、7DoF 和
              16+DoF 机器人的跨机体泛化能力。

              GEN-1（2026 年 4 月 2 日发布）在 GEN-0 的基础上继续扩大数据和算力，并加入后训练技术、强化学习等算法进展。GEN-1 在此前模型成功率为 64% 的任务上达到 99%
              成功率，完成任务速度约为前沿水平的 3x，并可用约 1 小时机器人专属数据适配新任务。值得注意的是，GEN-1 完全从零训练——约 99%
              参数为新训练参数——而不是微调已有视觉-语言模型。公司认为，这条「从零训练」路线给了它掌控前沿所需的完整架构控制权。

              GEN-1 正在向精选行业伙伴开放早期试用。公司已经展示的任务包括汽车零件配套分拣、T 恤折叠（无人干预连续 86 次）、机器人吸尘器维护（连续 200+ 次），以及可持续数千个连续周期的包装作业。
