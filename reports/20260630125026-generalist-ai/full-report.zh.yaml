      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              收入质量无法判断，因为没有已确认收入。截至 2026 年 6 月，公司处于早期访问伙伴阶段——按运营实质，相当于商业化前或测试阶段，而不是一个有公开证据支持的创收业务。任何风险投资定价，买的都是一个 $2B
              未来态业务的期权，而不是当前期间的盈利索取权。

              利润率路径：如果收入真正规模化，软件交付模式（云托管基础模型 API）结构上应能带来有吸引力的毛利率——成熟期可能达到 60–80% 或更高；但短期成本结构由训练算力、数据运营和顶尖研究薪酬主导，未来至少
              24–36 个月贡献利润率仍会深度为负。每一代后续模型都会重置资本开支时钟；在数据飞轮产生足以抵消训练跑步机的自我维持商业收入之前，公司没有轻资产滑行阶段。

              资本强度是这家公司的核心财务特征。Brad Porter（Cobot）指出的关键风险是运营层面的：「用巨量数据硬推一个并不完美的架构，非常昂贵，也未必能得到你想要的结果。」这是来自前 Amazon
              机器人副总裁、且具备生产部署可信度的反方观点；它引入了一个可信情景：训练后续模型代际的成本，可能比收入飞轮产生抵消现金流的速度增长更快。Yann LeCun 的补充批评——动作 token
              预测模型如果没有架构创新，无法仅靠规模实现泛化——则从结构上挑战了整个投资逻辑所依赖的数据扩展论点。

              财务承销的四个尽调阻断点是：（1）当前
              ARR，以及按客户分部和收入类型拆分的合同管线；（2）按类别拆分的真实月度烧钱额（算力、人员、数据运营、资本开支）；（3）当前与预测规模下的毛利率画像，包括每机器人小时推理成本；（4）定价模型细节——按机器人订阅、企业场地许可证、按用量计费
              API，或混合模式。没有这四项输入，就无法锚定可信的 DCF、可比公司或情景分析。
