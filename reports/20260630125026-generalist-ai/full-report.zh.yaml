      - number: '7.4'
        title: 收入前资本密集度和未披露伙伴栈带来财务模型风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月 30 日，Generalist AI 两轮融资已超过 $500 million，但未披露收入、ARR、客户名称、烧钱速度或合同条款。按 70
              人、研究密集团队运营全球物理基础设施推算，人员规模隐含月烧钱 $5–15 million；2026 年 6 月融资可支撑约 2–6 年资金续航，
              取决于该区间低端或高端——但公司在产生收入之前就已经资本饥渴。公司对 $400 million 的计划用途写得很明确：建设下一代模型、扩展物理数据引擎、扩大团队。这些用途都不会产生近期正现金流。最接近的可比公司
              Physical Intelligence 于 2026 年 4 月以 $11 billion 估值融资 $1
              billion，并运营早期商业计划；分析师描述的成本结构表明，在早期部署规模下，训练成本强度会比收入补充资本更快地消耗资金。

              伙伴依赖栈在结构上没有披露。Generalist AI 的商业模式需要机器人硬件 OEM（或系统集成商）把 GEN-1 集成进产品，并把部署带给终端客户。截至 2026 年 6
              月，没有任何硬件伙伴名称、集成协议或渠道安排公开。唯一的伙伴参与证据，是 partnerships@generalistai.com
              的早期访问计划，以及投资方提到“产生任务数据的真实企业”。如果一两个早期访问伙伴贡献了运营数据飞轮的大部分，并支撑公司围绕商业进展 的融资叙事，一旦退出，会同时损害技术路线图和投资者故事。NVIDIA
              的战略共同投资带来软承诺，但不是排他合同。投资者集中在 Spark Capital、Radical Ventures、8VC、USV 和 NVIDIA NVentures；若该群体情绪转向，按有利条款完成
              Series C 的可能性会大幅下降。公司未披露任何可转债、债务额度或收入型融资，因此除股权资本外没有下行缓冲。
