      - number: '1.4'
        title: 融资历史与投资人格局
        blocks:
          - type: paragraph
            body: >
              Generalist AI 自 2024 年成立以来披露了两轮融资。第一轮于 2025 年 3 月完成，总额约 $140M，投后估值 $440M。该轮投资人包括 Spark Capital、NVIDIA 旗下
              NVentures、Bezos Expeditions（Jeff Bezos）和 Boldstart Ventures。第二轮 $400M 于 2026 年 6 月 4 日宣布完成，投后估值
              $2B，使已披露累计融资超过 $500M。

              2026 年 6 月这一轮由 Radical Ventures 领投，新进机构包括 8VC、Union Square Ventures、Hanabi Capital 和
              Norwest。所有主要老股东——NVIDIA NVentures、Boldstart Ventures、Spark Capital、Bezos Expeditions 和 NFDG——均大额跟投。2026
              年融资中的知名天使投资人包括 Fei-Fei Li（Stanford AI Lab 联合主任、World Labs 创始人）、Bin Lin（Xiaomi 联合创始人）、Eric Yuan（Zoom CEO）和
              Naval Ravikant。

              NVIDIA 持续参与，反映出战略兴趣：Generalist AI 的模型依赖 GPU 算力基础设施，任何大规模部署具身基础模型，都会意味着可观的 NVIDIA 硬件需求。Fei-Fei Li 和 Naval
              Ravikant 等技术型天使的出现，也在更广泛 AI 研究圈内释放了可信度信号。

              收入、ARR、客户数量和二级交易条款均未公开披露。公司尚未宣布 IPO 计划。公开资料也未显示任何债务或信贷额度。
