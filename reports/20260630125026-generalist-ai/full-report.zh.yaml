      - number: '7.3'
        title: 对 NVIDIA 的算力和基础设施依赖带来训练排期与成本风险
        blocks:
          - type: paragraph
            body: >
              NVIDIA NVentures 同时参与了 Generalist AI 两轮融资——2025 年 3 月种子轮和 2026 年 6 月 $400 million Series
              B。这种关系带来战略一致性，也带来对 NVIDIA 机器人软件栈的优先接入，但并不能消除前沿模型训练对 NVIDIA 硬件的结构性依赖。GEN-1 在分布式基础设施上训练，可处理 PB
              级物理交互数据，并在每天训练中吸收 6.85 年操控经验——这种工作负载需要 H100 或 Blackwell 级 GPU 集群。截至 2026 年中，非超大规模云厂商买家采购 H100 和 H200 GPU
              的交付周期仍为 36–52 周，原因包括 SK Hynix 的 High Bandwidth Memory（HBM3）供应受限、TSMC CoWoS 先进封装超额订阅，以及 NVIDIA
              自身将产能转向利润率更高的 Blackwell 生产。具身 AI 初创公司不在超大规模云厂商通过远期合约拿到的分配优先窗口内；Generalist 的 GEN-2
              训练路径，取决于能否在未披露时间线上拿到所需规模的算力。

              Generalist AI 据称运营的多云合同没有公开点名。云提供商集中度尚未确认：如果训练集中在一家提供商，价格重谈、容量约束或服务中断都会直接卡住模型开发。物理数据收集基础设施——数千台可穿戴
              data-hands 设备、定制上传机器、专线互联网以及 O(10K) 处理核心——形成第二层基础设施依赖，运营上不同于云算力。数据管线一旦中断，就会打断数据飞轮；后者正是 Generalist 相比纯软件 AI
              公司获得估值溢价的理由。

              下一代模型训练所需资本没有公开披露，但结构上很高。Physical Intelligence 的数据画像意味着，每一代主要模型的训练成本以数千万美元计；Figure AI 年烧钱 $200–300 million
              的基准，反映了更大规模下由硬件支撑的训练运营。Generalist AI 目标是以纯软件利润率画像承载同样的算力和数据强度，但底层基础设施仍要靠股权资本买单。如果 GPU 采购让 GEN-2 训练时间线推迟 6
              到 12 个月，Generalist 相对 Physical Intelligence（π0.5、$11 billion 估值、2026 年 4 月融资 $1 billion）、Google DeepMind 和
              NVIDIA 自有开源模型 GR00T N1.6 的竞争窗口会明显收窄。
