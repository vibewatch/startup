  - id: TV005
    title: 论点失效与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 传导到论点
      - 行动含义
    rows:
      - - 到 2027 年 Q4 仍无可验证商业收入
        - GEN-1 早期访问发布 18 个月后，仍无具名客户或披露的 ARR 里程碑
        - 数据飞轮论点无法确认；下一轮融资风险上升
        - 重新评估卖出或减仓；增加敞口前要求确认收入
      - - NVIDIA GR00T 企业端扩张
        - NVIDIA 以宽松企业许可证提供 GR00T N-series，且性能可比或更好
        - 基础模型层被商品化；Generalist AI 专有模型溢价被压缩
        - 立即评估护城河恶化；将估值目标区间下调 40–60%
      - - 竞争者 ARR 里程碑：PI 或 Skild 达到 $100M+ ARR
        - Physical Intelligence 或 Skild AI 披露 $100M+ ARR，且模型性能大体可比
        - Generalist AI 来自数据规模的相对护城河，已不足以单独构成差异化
        - 触发对 Generalist AI 商业管线的紧急私下尽调；重新评估论点
      - - 关键人离职
        - Pete Florence（CEO）或 Andy Zeng（首席科学家）离开领导岗位
        - 公司身份、融资叙事和技术方向都绑定这两位创始人
        - 暂停新增投资；评估领导层过渡计划和存续团队厚度
      - - 估值下调融资或桥接融资
        - Generalist AI 在没有实质商业进展时，以 $2B 或更低估值进行后续融资
        - 表明市场已对近期商业验证失去信心；稀释风险上升
        - 只有估值下调轮价格显著低于 $1B 且确认已有牵引时，才视为买入信号；否则减仓
    notes: |
      触发项都是可测量或可观察事件，不是定性判断。每一项都能直接传导到商业论点，并对应可执行的投资动作。
