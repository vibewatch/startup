      - number: '2.3'
        title: 买方分层与采购动态
        blocks:
          - type: paragraph
            body: >
              具身 AI 软件买方横跨五个不同群体，它们的采购结构、工作流场景和采用触发点各不相同。理解这些分层很重要，因为预算所有者、回本周期和集成成本差异很大，会直接影响任何 AI 机器人软件供应商必须采用的商业模式。

              Tier-1 制造和汽车 OEM 终端用户（装配工厂、合同制造商、电子晶圆厂）历来是工业机器人的主力买方，2025 年占工业机器人需求的
              35.86%（仅汽车行业）。这些买方通过多年采购周期用资本预算购买，需要认证集成商支持，并按节拍时间、正常运行时间和总拥有成本评估。制药和医疗制造到 2031 年 CAGR 最高，为 13.52%。

              物流、仓储和 3PL 运营商是短期增长最快的买方群体。预计 2026 年电商板块将占仓储机器人市场的 47.21%。这些买方越来越多采用
              Robot-as-a-Service（RaaS）模式，把资本支出转成运营支出，降低采用摩擦。Amazon 宣布 $1B 仓库自动化投资，以及 Figure AI 在 BMW Spartanburg
              的部署——Figure 02 在 1,250+ 运行小时内搬运超过 90,000 个零件——代表了该群体扩大 AI 驱动机器人应用意愿的前沿。

              机器人硬件 OEM 制造商（ABB、Fanuc、KUKA、Boston Dynamics、1X Technologies、Figure
              AI）构成一类独立的软件买方：它们把智能嵌入机器人平台，以差异化硬件产品，并回应客户对跨任务泛化的需求。这些买方会把基础模型视为自有嵌入式 AI 栈的潜在平台替代品，并通过 R&D 预算采购。

              制药、生物技术和诊断领域的实验室自动化买方支撑了 2026 年 $2.64B 的实验室机器人市场。这些买方对 GMP 合规、可重复性和监管可追溯性尤其敏感，因此采用第三方 AI
              层会更谨慎；但任务复杂度和人力成本较高，一旦采用，也可能更持久。

              承接高混合、低批量生产的合同制造商和 3PL，是正在出现的可服务群体。在这类场景中，快速任务适配相对昂贵定制编程的价值最高，但集成支持仍是瓶颈。
