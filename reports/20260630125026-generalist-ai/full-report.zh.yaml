  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 数据收集硬件（data hands 可穿戴设备）
        - 捕捉用于基础模型预训练的人类操作数据
        - 定制专有硬件；全球操作员劳动力；供应链物流
        - 设备召回、供应中断或操作员不可用可能拖慢数据集增长
      - - 物理预训练数据集（500K+ hrs）
        - GEN-1 基础模型的传感-运动基础
        - 全球数千个采集点；多云存储；NVIDIA GPU 处理
        - 数据质量下降；新地域监管挑战；隐私诉讼
      - - GEN-1 基础模型（~99% 从零训练）
        - 通用传感-运动先验；跨形态泛化
        - 专有架构；7B–10B+ 参数规模；大规模 GPU 计算
        - 单体从零设计在需要根本架构修订时会放大风险
      - - Harmonic Reasoning 训练流程
        - 连续时间同步感知和行动，不需要暂停思考周期
        - 定制训练机制；异步流式 token 架构
        - 专有；机制主张未经过外部同行评审；架构细节未发布
      - - 后训练系统（SFT + RL + 多模态指导）
        - 针对任务的精通式微调（~1 hr 机器人数据）
        - 来自伙伴的机器人专用数据；多云计算；RL 稳定性技术
        - RL 不稳定；伙伴提供的任务数据质量和数量会影响结果
      - - 推理运行时（paged attention、定制内核）
        - 在已部署机器人上实时预测动作
        - NVIDIA GPU 硬件；定制编译内核代码
        - 推理延迟未披露；专有内核带来硬件集中风险
      - - 计算集群（多云）
        - 训练并服务所有模型
        - 多云合同；NVIDIA GPU 优先访问权
        - NVIDIA 供应链风险；PB 级、数万核心规模下成本高；没有摆脱 NVIDIA 的路径
      - - 机器人伙伴硬件（第三方 OEM）
        - GEN-1 推理的物理执行
        - 已演示 Universal Robots UR7e；原则上可适配任意 6/7/16DoF OEM 机器人
        - Generalist AI 不制造硬件；集成质量取决于 OEM API
    notes: |
      架构细节来自官方博客（GEN-0 和 GEN-1 技术文章）。逐层实现、延迟规格和安全架构没有公开披露。NVIDIA 依赖来自两轮战略投资和多云 GPU 需求推断。
