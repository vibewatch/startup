      - number: '6.4'
        title: 具名客户证据质量与局限
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月 30
              日，任何公开来源中都没有具名付费客户。公司有意不披露客户身份，这符合企业机器人保密惯例——工厂自动化部署通常由客户披露，而不是供应商披露，且只有在客户认为商业优势已经建立时才会披露。这是物理 AI
              类别的标准做法，但也让外界无法独立验证「牵引」。

              最可信的具名伙伴证据是 Universal Robots 的 GTC 2026 演示合作。Universal Robots 是全球按出货量计第一的协作机器人制造商，已在 10,000 多家公司部署超过
              75,000 台协作机器人。UR 决定在其 GTC 展台上、用一套全新机器人平台展示 Generalist AI，说明这个具有商业影响力的硬件伙伴给出了有意义的技术验证。但 UR 在 GTC
              的角色是技术展示伙伴，不是已披露的付费客户或授权分销商。GTC 活动后是否形成任何商业协议，仍未知。

              「数据工厂伙伴」——提供真实世界环境用于数据采集的企业——构成第二类具名关系，但任何公开来源都没有披露这些伙伴名称。按 GEN-1 博客，data hands
              计划涉及「全球数千个家庭、仓库、工作场所和专门环境」，但这些是数据采集场景，不是模型部署客户。

              第三类客户证据是投资人证明。8VC（2026 年 6 月投资方）、Spark Capital（2025 年种子轮投资方）和 Radical Ventures（2026 年 6
              月领投方）都提到商业牵引，但没有点名客户或披露收入。没有独立验证的投资人证明，作为客户证据权重较低；但多个独立投资人都提及牵引，说明确实存在某种真实商业活动。

              分析师社区明确持怀疑态度。Robotics.press 在 2026 年 4 月自动化研究评估中称：「已验证客户部署、付费试点、案例研究或具名伙伴披露为零——商业就绪度完全未被证明。」该评估早于 GEN-1
              发布和 UR GTC 演示，但核心结论——没有公开客户证明——截至 2026 年 6 月 runDate 仍然准确。CB Insights 的物理 AI 市场地图（2026 年 1
              月）在基础模型部署示例中也未提及 Generalist AI，而列出 Skild AI 和 FieldAI 拥有正式伙伴关系。
