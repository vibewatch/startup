      - number: '6.3'
        title: 采用轨迹与部署状态
        blocks:
          - type: paragraph
            body: >
              GEN-1 自 2026 年 4 月 2 日起通过早期访问计划开放。截至 2026 年 6 月 30 日 runDate——上线约 89
              天后——公司尚未公开发布具名客户部署、生产结果或独立性能验证。公司用于伙伴合作的联系路径只有一个邮箱地址（partnerships@generalistai.com），没有自助伙伴门户，没有公开 API
              文档，也看不到开发者社区。

              GEN-1 商业任务表现的证据来自官方发布博客：机器人完成了六类任务——连续 1 小时以上配套汽车零件、连续折叠 T 恤 86 次、连续维护扫地机器人 200 多次、包装积木 1,800 多次、折叠箱子 200
              多次、包装手机 100 多次——平均成功率 99%。这些演示使用公司挑选的任务、在受控环境中完成，且使用公司自己的机械臂；尚无独立复现或第三方审计发布。

              数据采集网络同时供给预训练和数据飞轮，代表一种与真实世界环境的运营关系：Generalist AI 称数据采集发生在面包店、自助洗衣店、工厂和家庭。这些数据采集点涉及真实人类操作者使用「data
              hands」设备。是否存在付费访问协议或其他补偿安排，公司没有披露；它们在运营上不同于 GEN-1 部署客户。

              更广泛市场的采用信号是间接的。MarkTechPost 的 2026 年十大物理 AI 模型榜单（2026 年 4 月 28 日发布）未纳入 GEN-1，而列出了 NVIDIA GR00T、Google
              Gemini Robotics、Physical Intelligence、Figure Helix 等。缺席该榜单不代表产品质量差，但说明截至 2026 年 4 月下旬，GEN-1
              尚未建立足够的第三方覆盖或独立验证部署证据，进入分析师跟踪名单。

              商业团队很轻（截至 2026 年 6 月仅一个「Applied AI & Partnerships」开放岗位），意味着早期销售动作高接触、由创始人主导，更符合 3 到 10
              个早期战略账户，而不是规模化获客漏斗。作为背景，竞争对手 Skild AI 在 2026 年完成 $1.4B 融资，并有具名工业伙伴（Zebra Technologies）；Physical
              Intelligence 则运营 $300/机器人/月 SaaS 模式，并披露了部署——两者提供了更可见的商业对比基线。
