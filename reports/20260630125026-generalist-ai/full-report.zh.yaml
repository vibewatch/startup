chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >
              Generalist AI, Inc. 以「Generalist」品牌运营，是一家美国人工智能公司，2024 年注册成立，总部位于 California 州 San Mateo，并在 Massachusetts
              州 Somerville（Boston）设有第二办公室。公司自称是「一家由前沿 AI 研究和产品驱动、为物理世界构建通用智能的公司」。它公开的使命是开发具身基础模型，让通用机器人真正落地。这类 AI
              系统能在不同物理环境和机器人形态中感知、推理和行动，而不是被锁定在单一任务或硬件平台上。

              不同于传统机器人公司，Generalist AI 明确不做硬件制造商。它的商业主张是充当智能层，也就是可跨任意机器人本体工作的「认知大脑」，覆盖从 6 自由度工业机械臂到半人形系统。公司当前商业策略围绕
              GEN-1 的早期试用计划展开，面向精选行业伙伴，并给出一个数据飞轮目标：真实部署产生新的训练数据，再喂给下一代模型。公司尚未公开披露定价、已署名客户或年度经常性收入。

              Generalist AI 在多次官方沟通中把长期野心表述为「physical AGI」——能够掌握任何物理任务的通用机器人智能。公司明确把技术路线图类比为大语言模型的扩展轨迹，认为催生 GPT-3 和
              ChatGPT 的数据与算力扩展动力，一旦作用到物理交互数据上，也会产生可泛化到人类全部体力工作的机器人。
