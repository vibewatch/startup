          - type: callout
            title: 缺乏独立验证，即兴行为带来的对齐风险未被刻画
            body: >
              GEN-1 的核心指标（99% 成功率、3x 速度、1
              小时适配）完全由公司自报，并在公司控制的条件下测量。没有独立第三方基准、同行评审论文或客户证言，在真实生产条件下佐证这些数字。同时，公司自己的博客承认，即兴智能——一个核心卖点——也可能成为责任：训练分布之外的涌现行为，是会在现实世界产生真实后果的物理动作。公司未发布任何安全框架、事故协议或对齐审计来覆盖这一风险。
