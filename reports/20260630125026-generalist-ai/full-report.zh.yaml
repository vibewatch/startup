      - number: '2.2'
        title: 市场规模——TAM、SAM 与相互矛盾的视角
        blocks:
          - type: paragraph
            body: >
              多套分析机构规模框架并存，但边界定义彼此不兼容，因此无法从公开来源验证单一权威 TAM 数字。截至 2026 年中，市场主要有三种视角。

              最宽的相关视角是「机器人中的 AI」。Grand View Research 测算该市场 2025 年为 $20.4B，预计到 2033 年达到 $182.7B，CAGR 为
              32.0%。该口径覆盖所有机器人类别中的硬件组件（AI 加速器、边缘处理器）、软件平台和服务。其中，软件板块预计增长最快，CAGR 超过 33%。

              中间视角是「AI 机器人软件」。Intel Market Research 测算该市场 2026 年为 $14.18B，到 2034 年达到 $38.76B，CAGR 为 15.3%。这个范围最接近
              Generalist AI 的收入模式：算法、API、推理框架，以及云端机器人操作平台。关键可比对象包括 NVIDIA Isaac、ABB AI Software 和新兴基础模型 API。

              最窄、也最直接可比的视角是「具身 AI」。Grand View Research（经 Research and Markets）测算 2026 年为 $6.5B，预计到 2033 年达到 $67.6B，CAGR
              为 39.7%。这个口径涵盖能够感知、推理和行动的物理 AI 系统，最贴近 Generalist AI 的产品类别。物流和供应链是增长最快的终端使用板块，CAGR 为 42.2%；北美占 2025 年市场的
              35.6%。

              底层硬件市场提供了规模锚点。Mordor Intelligence 估算，工业机器人总市场（硬件加集成）2026 年为 $54.28B，到 2031 年为 $94.38B，CAGR 为 11.7%；IFR
              则报告，单看机器人安装资本价值，2026 年为 $16.7B。仓储机器人子赛道 2026 年为 $7.35B，到 2034 年为 $25.41B，CAGR 为 16.8%；人形机器人市场 2026 年为
              $8.3B，预计到 2030 年 CAGR 为 47.1%。实验室机器人市场为 $2.64B。

              对于 SAM 和 SOM，公开来源没有给出「基础模型授权用于跨机体灵巧操作」的细分估算。Generalist AI 的初始 SOM 受其早期试用计划约束；收入和伙伴数量均未披露。
