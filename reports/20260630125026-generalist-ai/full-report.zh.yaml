          - type: callout
            title: 全球最大真实世界物理交互数据集，形成持久护城河
            body: >
              这个 500,000+
              小时数据集通过保留自然感觉运动闭环的专有可穿戴系统采集，构成重要数据护城河，竞争对手无法快速复制。基于遥操作的竞争对手天然会产生更慢、更僵硬的轨迹，遗漏自然人类灵巧性中的反射性微调。GEN-0
              展示的幂律扩展关系意味着，数据集翻倍会在所有任务上带来可预测的下游表现提升——这是会随时间和资本复利的战略优势。
