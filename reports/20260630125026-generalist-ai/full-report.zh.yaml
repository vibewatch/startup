      - CV044
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值路径 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市（上行）
        - 到 2028 年，数据飞轮达到 500 万+ 小时；GEN-1/GEN-2 锁定 3 个以上锚定企业部署；硬件无关模型相对垂直一体化对手赢得更广泛 OEM 采用。
        - 2029–2031 年由 NVIDIA 或大型科技巨头以 $7.5–20B 收购（基于 $500M–$1B ARR 的 10–15x）。按 $2B 入场，稀释前回报 3.75–10x。
        - 商业化时间表滑坡；NVIDIA GR00T 达到可比性能；数据扩展无法转化为商业可行性。
        - 低到中。技术上可行，但需要多个执行环节同时成功，而目前没有收入先例。
      - - 基准
        - 到 2028 年实现 $20–50M ARR，拥有 2–3 个具名商业部署；2029–2031 年以 10–15x ARR 融资或战略退出；退出前再融资 1–2 轮。
        - 以 $300M–$750M 战略收购；按 $2B 入场，完全稀释后回报小幅为正到持平。早期轮机构投资者条款可能更好。
        - 采用周期慢；NVIDIA 和开源替代方案带来价格压力；收入放量前，下一代模型还需要资本投入。
        - 中。与可比行业观察到的深科技 AI 商业化时间线一致。
      - - 熊市
        - 到 2028 年商业收入仍未落地；$400M 资金续航耗尽；没有可接受价格的战略收购方。NVIDIA GR00T 削弱差异化。
        - 以 $500M–$800M 估值下调融资，或按团队价值被人才收购。按 $2B 账面估值入场的投资者接近全损。
        - 熊市只需要商业化比牛市叙事假设晚 2–3 年。
        - 有资金续航支撑，概率低到中，但并非可以忽略；行业估值过高的负面分析师评论也支持这一点。
    notes: |
      情景边界来自类似深科技 AI 商业化时间线和竞争者估值锚，而不是 Generalist AI 已披露财务预测。
    claimRefs:
