      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence（π.ai）由 Sergey Levine、Chelsea Finn、Karol Hausman 等前 Google Brain 和 Berkeley 机器人研究者于
              2024 年 3 月创立，是 Generalist AI 意识形态上最接近的同类公司。其 π0 / π0.5 模型是 Vision-Language-Action（VLA）系统，基于 7–8 个机器人平台上的
              10,000+ 小时示范训练。截至 2026 年 3 月，Physical Intelligence 正在洽谈以约 $11B 估值融资约 $1B，Founders Fund 和 Lightspeed
              参与讨论；这较 2025 年 11 月的 $5.6B 估值翻倍。不同于 Generalist AI，Physical Intelligence 已通过 openpi
              仓库开源模型权重，建立了学术开发者社区，但也提高了商品化风险。两家公司都处于收入前阶段；Physical Intelligence 未公开宣布商业部署或定价。

              Skild AI 于 2023 年创立，总部位于 Pittsburgh，2026 年初完成由 SoftBank 和 NVIDIA 领投的 $1.4B Series C，估值 $14B。Skild 报告称，2025
              年商业发布后数月内收入约 $30M，是唯一披露达到这一规模商业牵引力的纯软件竞争对手。2026 年 4 月，Skild 收购 Zebra Technologies 的 Robotics Automation
              业务，包括 Symmetry Fulfillment 编排平台，从纯 AI 模型公司转向整合人形机器人、移动机器人、机械臂和机器狗的完整仓库自动化方案。这笔收购给了 Skild 企业分发基础设施，而
              Generalist AI 尚不具备。Skild 的「全机体」Skild Brain 模型声称具备跨机体泛化，数据集号称「比大多数竞争对手大 1,000 倍」；但这一说法尚未被公开基准独立验证。

              Figure AI 由 Brett Adcock 于 2022 年创立，总部位于 Sunnyvale；2025 年 9 月由 Parkway Venture Capital
              领投、Brookfield、NVIDIA、Microsoft、OpenAI Startup Fund 和 Jeff Bezos 参投的 Series C 后，累计融资约 $1.9B，投后估值 $39B。其
              Figure 03 人形机器人运行 Helix，一个三层 VLA 系统（S0 全身控制、S1 视觉运动、S2 语义推理），完全在嵌入式 GPU 上运行，无需云连接。Figure 在 BMW Spartanburg
              的部署——1,250+ 运行小时内搬运 90,000+ 个零件，并贡献到 30,000+ 辆车生产中——是所有竞争对手中记录最充分的商业人形机器人部署。Figure 是争夺企业合同的全栈竞争者，不只是模型同类。

              Google DeepMind 通过 2026 年发布的 Gemini Robotics 1.5 和 ER 1.6 模型带来不对称竞争资源。Gemini Robotics ER 1.6 是面向开发者的云端可访问
              VLA API，通过早期试用 / 等候名单开放；2026 年中宣布的新端侧变体，允许对延迟敏感的工业应用做本地推理。Google 的竞争优势包括比任何初创公司大几个数量级的网页级多模态预训练数据、Alphabet
              算力基础设施，以及与 Boston Dynamics、Apptronik、Agility Robotics 的既有 OEM 伙伴关系。Gemini Robotics 尚未公开定价。Boston Dynamics
              在 CES 2026 商业发布电动 Atlas 人形机器人，2026 年全部产能已承诺给 Hyundai 的 RMAC 和 Google DeepMind。Atlas 集成了 Google DeepMind AI
              基础模型和 Boston Dynamics 的 Orbit 软件（MES / WMS 集成）。估计单价为 $150,000–$420,000。

              NVIDIA 把自己定位为整个机器人生态的卖铲人基础设施。其 GR00T N 系列（N1 至 N1.7，其中 N1.6 在 CES 2026 发布）开源且对所有开发者免费，通过 Hugging Face
              分发。NVIDIA 的商业模式是免费提供模型层，通过 GPU 硬件销售（Jetson Thor、DGX）和 Cosmos 仿真订阅变现。GR00T N1.6 已被 NEURA
              Robotics、Humanoid、Franka Robotics 采用，并集成 HuggingFace LeRobot。Amazon 通过 2024 年收购 Covariant 创始人（Pieter
              Abbeel、Peter Chen、Rocky Duan）团队人才并取得非独占 IP 许可，正在为其 750,000+ 机器人队伍建设内部机器人 AI 能力。Covariant 在 2025 年 2 月融资
              $100M，并继续独立运营，但人才流失削弱了竞争位置。OpenAI 在 2026 年成立专门机器人部门；此前它曾投资 Figure AI 和 Physical
              Intelligence，是一个入场较晚但资源充足的基础模型类别新玩家。
