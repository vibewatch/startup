      - number: '8.3'
        title: 情景分析：牛市情景技术上可信；熊市情景更接近今天的公开证据
        blocks:
          - type: paragraph
            body: >
              牛市情景建立在三个相互强化的假设上：(a) 数据引擎飞轮按设计运转——今天的 500,000 小时在两年内增长到 5 million+ 小时，让复制数据集的成本高到难以承受；(b) GEN-1 及后续模型在
              2026–2027 年证明具备足够商业可行性，并在至少一个锚定行业锁定多年期企业部署；(c) 面向企业采购，Generalist AI 的硬件无关定位优于垂直整合对手。在这种情景下，2029–2030
              年由技术巨头（NVIDIA、Amazon、Google 或大型 OEM）以 $500M–$1B ARR、15–20x ARR 收购，意味着 $7.5–20B 退出；相对 $2B 取得 3.75–10x
              回报，但摊薄风险很大。

              基准情景更谨慎。商业收入在 2027 年出现，但受企业机器人资质验证周期（6 到 18 个月）拖累，采用速度较慢，ARR 到 2028 年达到 $20–50M。2029–2031 年按 $30–50M ARR 的
              10–15x 被战略收购，意味着 $300M–$750M 退出——在考虑摊薄前，相对 $2B 入场价为持平到小幅负回报。基准情景符合可比阶段深科技 AI 商业化常见时间线。

              熊市情景有现有不利证据支持。AIRoboticDaily 记录，目前约 95% 的人形机器人收入来自研究和展厅用途，而非生产性工业部署。Cobot 的 Brad Porter 认为，经过生产验证的
              Physical AI 系统比基于研究论文的方法更有商业可信度。NVIDIA 开源 GR00T N 系列向开发者免费提供模型权重，威胁基础模型层商品化。在熊市情景下，GEN-1 到 2028
              年仍未转化为收入，$400M 资金续航耗尽，结果是人才收购，或以大幅低于 $2B 入场价的降价轮收场。熊市情景不是基准情景，但并不遥远——它只需要商业化比牛市叙事预计晚 2 到 3 年。
