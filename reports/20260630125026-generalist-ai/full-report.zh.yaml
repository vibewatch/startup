      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              如公司概览章节所述，Generalist AI 于 2025 年 3 月完成约 $140M 首轮融资，又于 2026 年 6 月完成 $400M 第二轮融资，公开披露累计融资超过 $500M。2026 年 6
              月这轮融资于 2026 年 6 月 4 日宣布；若假设签约到拨款通常间隔 30–60 天，现金投入大约从 2026 年 6
              月中旬开始。公司未公开披露任何债务融资、可转债、信贷额度或项目融资义务；资产负债表看起来完全由股权融资支撑。

              公司明确说明，$400M
              新资金用途是：打造下一代模型、扩张物理数据引擎、扩充算力和训练基础设施，并推进产业伙伴关系。这完全是收入前的基础设施投入；没有迹象显示资金用于收购或股份回购。隐含的下一轮触发点，是后续模型代际（GEN-2）达到足以支撑估值再上台阶的性能阈值——GEN-0
              到 GEN-1 间隔约 5 个月，GEN-1 到 Series B 间隔 2 个月，节奏很快。

              按每月 $10M 的烧钱中值估算，在零收入抵消的情况下，Generalist AI 会在交割后约 40 个月耗尽 $400M（2029 年末）。若每月 $15M，可支撑时间缩短至约 27 个月（约 2028 年
              9 月）。若每月 $5M（70 人前沿 AI 实验室的乐观下限），可支撑时间延长至约 80 个月。Physical Intelligence 估值约为 Generalist AI 的
              5×、团队更大，投资人称其模式需要连续大额注资来维持数据和算力规模——这意味着 Generalist AI 面临结构性融资依赖，只有当收入足以实质性抵消成本基数时才会缓解。按 Physical
              Intelligence 的 $300/机器人/月定价，若要在每月 $10M 烧钱水平上打平，需要约 33,333 台机器人同时付费——以任何合理的当前采用速度看，这种机队部署规模都还要多年。

              $2B 估值（为 2025 年 3 月 $440M 的 5 倍）来自私下谈判；尚无独立第三方估值发布。可比公司 Physical Intelligence 据称正以 $11B 估值融资——Generalist
