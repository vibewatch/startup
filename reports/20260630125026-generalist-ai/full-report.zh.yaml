          - type: callout
            title: $2B 对团队和数据的期权是真实的
            body: >
              Florence、Zeng 和 Barry 产出了两篇被引用最多的基础机器人论文（RT-2、Code as Policies）。500,000 小时专有数据集在结构上很难复制。若命题成立，相比 $11–14B
              同行，$2B 确实存在相对价值。
            calloutType: strength
            claimRefs:
              - CV042
              - CV043
              - CV011
              - CV012
          - type: callout
            title: $2B 论点假设 Physical AI 像语言 AI 一样扩展
            body: |
              整个牛市情景都建立在一个假设上：更多数据和算力会可预测地带来更强的具身模型——这与推动 ChatGPT 的扩展动态相同。该假设在物理任务上尚未被证明。Yann LeCun 等人质疑所需数据是否真正可扩展。
            calloutType: assumption
