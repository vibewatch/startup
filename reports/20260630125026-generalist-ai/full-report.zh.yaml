      - CI004
      - CI005
      - CI008
      - CI034
  - id: FI002
    title: 单位经济模型桥 — 成本与收入驱动因素
    type: flow
    layout: standard
    summary: |
      关键成本和收入输入节点推动 Generalist AI 的单位经济模型和贡献利润率；在缺少精确数字时使用定性证据节点。
    data:
      nodes:
        - id: training-compute
          label: 训练算力（模型代际）
          detail: GEN-1 规模下，每次前沿模型训练运行估计 $10M–$100M；每一代都会重复
        - id: data-ops
          label: 物理数据引擎运营
          detail: 每周采集 10,000+ 小时；Data Hands 可穿戴设备；实验室人员、设备物流、标注；持续性经常成本
        - id: headcount
          label: 研究 + 工程 + 运营团队（约 70 人）
          detail: 前沿 AI 人才（DeepMind、OpenAI、Boston Dynamics）；平均总薪酬远高于市场中位数
        - id: total-opex
          label: 总估算 Opex（$5M–$15M/月）
          detail: 70 人前沿具身 AI 实验室的行业基准；公司未确认
        - id: revenue-per-robot
          label: 单机器人年收入（约 $3,600）
          detail: 仅为 Physical Intelligence 类比；Generalist AI 定价未确认；敏感性：机队规模 10× → 10 台机器人客户每年 $36K
        - id: breakeven-fleet
          label: 盈亏平衡机队规模（估算）
          detail: 在 $3,600/机器人/年和 $10M/月烧钱额下，需约 33,000 台活跃机器人才能打平——以当前任何采用速度看都还要多年
      edges:
        - from: training-compute
          to: total-opex
          label: 高峰训练期贡献约 30–60% opex
        - from: data-ops
          to: total-opex
          label: 持续固定 + 可变成本；随数据规模增长
        - from: headcount
          to: total-opex
          label: 最大经常性成本类别；随招聘计划扩张
        - from: revenue-per-robot
          to: breakeven-fleet
          label: 决定抵消月度烧钱所需规模
    approximationNotes: |
      所有成本数字都是行业基准估算，不是公司披露。收入数字使用竞争对手类比定价。盈亏平衡机队测算假设无收入抵消，并使用中位烧钱额（$10M/月）和 PI 类比定价（$300/机器人/月）。
