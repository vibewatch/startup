      - number: '6.5'
        title: 集中度风险、采购摩擦与反向证据
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的客户画像带有结构性集中度风险：公司处于早期访问模式，只有少数未披露伙伴；若存在任何收入，这些伙伴很可能贡献当前收入的绝大部分。一个大型早期访问伙伴，或一个硬件 OEM
              关系，都可能占近期收入的显著比例，使该关系是否延续成为二元风险。

              目标用例的采购摩擦结构性偏高。企业制造和物流客户通常需要安全认证（工业机器人 ISO 10218 / TS 15066）、与现有 ERP 和 WMS 系统集成测试，以及持续 6 到 18
              个月的内部试点评估，之后才会批准生产上线。Generalist AI 未公开确认任何安全认证、集成框架、SLA 承诺或正式支持结构。大型企业客户若要合理批准生产部署，必须先解决这一缺口。

              最可信的反向技术论点来自 Brad Porter，Cobot 创始人兼 CEO、前 Amazon 机器人高管。他在 Forbes（2026 年 4
              月）中说：「只是用巨量数据硬推一个并不完美的架构，非常昂贵，也未必能得到你想要的结果。没有 CNN，ImageNet 不会奏效；没有 transformers，OpenAI
              也不会奏效。规模扩展一直都与架构突破相伴。」Porter 的批评直指公司数据扩展策略的核心论点，并暗示商业可行性可能需要超出当前披露范围的架构进展。

              更广泛的市场批评来自具身 AI 市场分析：截至 2026 年初，在人形和物理机器人类别中，公开宣称收入中只有 3% 到 5%
              真正来自生产性工业使用，其余来自研究、教育和展示部署。虽然这项批评更多针对人形机器人，而非 Generalist AI
              的模型软件路径，但它提出了一个相关问题：公司的「商业牵引」中，有多少是具备经济生产性的，多少只是展示性的。

              Generalist AI 的数据飞轮模型可能形成长期客户锁定机制：伙伴共享专有任务数据来训练模型，一方面为 Generalist 的护城河贡献数据，另一方面也可能让 Generalist
              具备服务具有类似能力需求的竞争客户。数据贡献协议是否包含排他条款，或是否为伙伴数据提供 IP 保护，公司未披露；对担心自身制造流程 IP 被用于训练共享模型的成熟工业客户而言，这可能构成有意义的采购摩擦。
