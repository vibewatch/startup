  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与目标市场
        blocks:
          - type: paragraph
            body: >
              Generalist AI 对外宣称的商业目标，是任何使用物理机器人执行重复、灵巧任务的企业。公司不制造硬件；价值主张是一个可跨机器人形态运行的智能层。在这一模式中，买方要么是机器人硬件
              OEM（授权模型并嵌入其平台），要么是企业运营方（把 GEN-1 集成到现有硬件）。付款方是企业或 OEM 被授权方；用户则是在工厂、仓库或物流现场部署机器人的运营者。

              Generalist AI
              官方沟通中明确点名的目标垂直行业包括服装、制造、物流、汽车和电子。这些正是简单、重复、灵巧任务常见的行业——折叠衣物、配套汽车零件、包装箱子、组装电子产品——劳动密集且自动化程度正在提高。GEN-1 博客和
              2026 年 6 月 $400M 融资公告都称「真实企业」正在这些环境中生成训练数据，暗示这些细分市场存在一些早期合同关系。

              第二类不同客户是数据工厂伙伴：部署「data hands」可穿戴采集设备，并向 Generalist AI 预训练数据集贡献操作数据的企业或运营者。这些伙伴可能通过数据共享安排获得补偿，而不是支付传统 SaaS
              费用；其参与也不一定意味着他们正在生产环境中部署 GEN-1。数据贡献伙伴与付费 GEN-1 部署客户之间的区别很重要，但公司尚未公开澄清。

              第三类是硬件 OEM 或平台伙伴关系，Universal Robots 在 NVIDIA GTC 2026 的合作提供了证据。UR 邀请 Generalist AI 在其全新移动操作平台上演示
              GEN-0；这一关系显示，全球按出货量计最大的协作机器人制造商对其有商业兴趣，但并不能确认商业授权或部署协议。

              从地域看，现有证据显示数据采集网络覆盖「全球数千个家庭、仓库、工作场所和专门环境」，但 GEN-1 销售目标似乎聚焦北美和欧洲工业运营商，这与公司在 San Mateo 和 Somerville
              的存在一致。公司未在任何司法辖区披露具体客户名称、合同结构或客户数量。
