      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的主要护城河主张有三点：（1）数据引擎规模——来自可穿戴传感器的 500K+
              小时自有物理交互数据，公司称这是全球同类最大数据集，形成了纯模型竞争对手难以轻易复制的训练数据优势；（2）架构新颖性——不微调 VLM、而是从零训练，使其区别于 π0 的 PaliGemma
              骨干路线，尽管相对竞争对手的真实泛化性能差距尚未被独立验证；（3）硬件无关性——跨机体设计让 Generalist 有机会成为机器人行业潜在的「AI
              OS」，以最小适配部署到机械臂、人形机器人和移动平台。数据飞轮逻辑是，早期试用伙伴部署会生成真实世界交互数据，喂给后续模型迭代，使数据集优势随时间复利。

              不过，Generalist AI 的竞争位置面临四类结构性风险，分别威胁其每一项护城河主张。第一，NVIDIA 的开源 GR00T N 系列给了每个开发者一个免费、生产级 VLA；如果 GR00T 在
              N1.5、N1.6、N1.7 迭代过程中追平 GEN-2 或 GEN-3 的能力，模型层会商品化，定价权也会崩塌。第二，Physical Intelligence 的开源 openpi 权重，让任何公司都能对照
              Generalist 最接近的同类做基准测试并在其上构建，降低新竞争者进入成本，压缩差异化窗口。第三，Skild AI 收购 Zebra 后，一个资金充足的直接竞争对手拥有了企业分发，而 Generalist
              AI 现在必须用尚未建成的企业销售基础设施与之竞争。第四，Google DeepMind 的不对称研究资源——近乎无限的算力、网页级数据，以及与每个主要机器人 OEM 的伙伴关系——意味着 Generalist
              AI 取得的任何能力差距都可能只是暂时的。Boston Dynamics 2026 年量产机器人的 Hyundai + Google DeepMind 独占管线，至少一年内关闭了 Generalist
              可用的最具商业可信度硬件分发路径。最不利的信号，是没有任何公开宣布的商业客户：三家顶级纯软件竞争对手（PI、Skild、Generalist）最终都在争夺企业机器人 AI 预算，而 Skild 的 $30M
              ARR 和 Zebra 分发基础设施给了它结构性部署优势；随着物流客户锁定自动化栈，这一优势会越来越难被撬动。
