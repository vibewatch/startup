      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >
              Generalist AI 的成本结构有三个主轴：（1）前沿模型训练算力，（2）物理数据引擎运营，（3）研究和工程人才。公司为 GEN-1 重建了分布式训练基础设施，以「把 PB
              级物理交互数据作为一等公民来支持」——这种表述意味着可观的 ML 基础设施资本开支，以及持续的云端或自建集群支出。行业基准显示，一个 10B+ 参数、基于 500,000
              小时视频与动作数据训练的前沿机器人基础模型，单次训练仅算力成本就可能达到 $10M–$100M；公司计划连续迭代模型，训练摊销因此会成为重要的经常性成本项。

              数据引擎运营——在全球以每周 10,000+ 小时的速度运行可穿戴「data
              hands」设备——需要持续的人力和设备物流成本，这不是一次性支出。不同于文本抓取，物理交互数据需要人类操作者、现场实验室管理者、设备维护和数据标注基础设施。NVIDIA NVentures
              作为继续加码的战略投资方，既说明公司依赖 GPU，也可能带来优先硬件供应因素，但外界尚未确认任何算力价格优惠。

              公司约 70 名员工主要来自 Google DeepMind、OpenAI 和 Boston Dynamics，平均总薪酬很可能显著高于行业中位数，符合前沿 AI 研究人才的经济规律。行业估算显示，类似具身 AI
              初创公司（50–100 人、算力密集）月度烧钱额为 $5M–$15M。这只是估算——实际数字未披露。按每月 $10M 的烧钱中值计算，新融资 $400M 意味着自 2026 年 6 月起可支撑约 40
              个月，也就是约到 2029 年末，尚未扣除任何收入抵消。
