      - number: '5.4'
        title: 部署、集成、硬件兼容性与路线图
        blocks:
          - type: paragraph
            body: >
              GEN-1 的部署模式与硬件无关：一个基础模型通过约 1 小时机器人专属数据采集和微调，就能适配任意机器人形态。2026 年 3 月 GTC 现场演示在现实条件下验证了这一主张：Generalist AI 接受
              Universal Robots 邀请，在其全新移动操作平台上演示 GEN-0（MiR 底盘上的 UR7e 机械臂，通过 Vention
              框架安装）——这是一个此前并不存在的硬件平台——并在短短几天内稳定跑通，只使用波士顿和旧金山办公室的数据，没有使用 GTC 展馆本身的数据。GTC 首次运行表现与实验室表现一致。

              目标机器人兼容范围覆盖 6DoF、7DoF 和 16+DoF 半人形平台。截至 2026 年 6 月，公司未公开 SDK、公开 API 文档或开发者门户。部署通过早期访问伙伴计划推进，入口是
              partnerships@generalistai.com。GEN-1 还在微调过程中集成多模态人类引导，让人类操作者把模型行为导向期望结果——公司称之为具身智能对齐。

              路线图主要从 2026 年 6 月融资公告推断：$400M 融资明确用于下一代模型开发、数据引擎扩张、算力和训练基础设施扩充，以及商业部署扩张。公司未披露具体 GEN-2
              时间表、功能集或模型规模。公司更广义的路线图哲学是目标驱动：持续降低所需任务专属数据量，同时把成功率推高。近期里程碑——用约 1 小时数据达到 99%+ 成功率——已由 GEN-1
              达成；下一阶段是更广的任务和环境泛化。
