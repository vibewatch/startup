  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >
              Generalist AI 明确是一家纯软件公司——不制造机器人——并把自己定位为跨形态的「智能层」，可服务于人形机械臂、工业 6-DoF
              机械臂和移动平台。商业主张是：机器人运营方（制造商、系统集成商、企业物流运营商）购买 GEN-1 基础模型的使用权，再用约 1 小时的机器人专属数据，把模型微调到自己的硬件和任务上。从结构上看，这更像云端 AI
              API 或单次部署的软件许可证，而不是硬件销售，因此毛利率画像更接近软件 SaaS，而非机器人硬件厂商。

              公司尚未公开任何定价。唯一确认的变现信号，是 2026 年 4 月启动的 GEN-1 早期访问伙伴计划——访问权只授予被选中的行业伙伴，公司没有披露客户名称或合同条款。2026 年 6
              月融资公告称，「数据飞轮开始成形：真实企业正在生成任务数据，反哺后续模型迭代」，这暗示早期付费或合同式部署已经存在，但收入规模未知。

              公开披露中最接近的定价参照是 Physical Intelligence。按 Sacra 分析师研究，该公司采用按机器人计费的 SaaS 模式，每台联网机器人每月 $300。如果 Generalist AI
              采用类似订阅模式，每台机器人每年 $3,600 意味着要做到 $10M ARR，约需部署 2,800 台机器人——这既需要显著的企业采用，也需要硬件伙伴分销。Generalist AI
              未确认这种定价；这里只是类比估算。更高价值的企业授权模式（按工厂或机器人类型收取固定年费）同样合理，并会显著改写单位经济。按机器人 SaaS
              模式确认收入较直接；若采用定制企业模式，收入确认可能按里程碑推进，规模化后会增加复杂度。
