  - id: market-sizing
    title: Market Sizing — TAM, SAM, and Contradictory Lenses
    body: >
      Multiple analyst sizing frameworks coexist with incompatible boundary definitions, making
      a single authoritative TAM number unverifiable from public sources. The landscape as of
      mid-2026 presents three primary lenses.

      The broadest relevant lens—"AI in Robotics"—is measured by Grand View Research at $20.4
      billion in 2025, projected to reach $182.7 billion by 2033 at a 32.0% CAGR. This includes
      hardware components (AI accelerators, edge processors), software platforms, and services
      across all robot categories. Within this, the software segment is forecast to grow fastest
      at over 33% CAGR.

      The intermediate lens—"AI Robotics Software"—is measured by Intel Market Research at
      $14.18 billion in 2026, reaching $38.76 billion by 2034 at a 15.3% CAGR. This scope is
      closest to Generalist AI's revenue model: algorithms, APIs, inference frameworks, and
      cloud-based robotic operating platforms. Key comparables include NVIDIA Isaac, ABB AI
      Software, and emerging foundation model APIs.

      The narrowest directly comparable lens—"Embodied AI"—is measured by Grand View Research
      (via Research and Markets) at $6.5 billion in 2026, projected to reach $67.6 billion by
      2033 at a 39.7% CAGR. This lens captures physical AI systems that perceive, reason, and
      act, most closely matching Generalist AI's product category. Logistics and supply chain
      is the fastest-growing end-use segment at 42.2% CAGR; North America represented 35.6%
      of the 2025 market.

      The underlying hardware markets provide contextual scale anchors. The total industrial
      robotics market (hardware plus integration) is valued by Mordor Intelligence at $54.28
      billion in 2026 ($94.38 billion by 2031, 11.7% CAGR), while IFR reports the capital
      value of robot installations alone at $16.7 billion in 2026. The warehouse robotics
      subsegment is $7.35 billion in 2026 ($25.41 billion by 2034, 16.8% CAGR), and the humanoid
      robot market specifically is $8.3 billion in 2026 with a 47.1% CAGR forecast to 2030.
      Laboratory robotics stands at $2.64 billion in 2026.

      For SAM and SOM, no public source provides a segment-specific estimate for foundation
      model licensing applied to cross-embodiment dexterous manipulation. Generalist AI's initial
      SOM is bounded by its early-access program; no revenue or partner count is disclosed.
