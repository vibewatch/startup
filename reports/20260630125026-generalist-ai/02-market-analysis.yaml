  evidenceGaps:
    - type: missing-source
      severity: material
      topic: foundation-model-SAM
      missingEvidence: >
        No public market research firm tracks the addressable revenue pool for "cross-embodiment
        dexterous manipulation foundation model licensing" as a discrete market segment. The
        closest proxy (Grand View Research "Embodied AI" at $6.5B in 2026) is a blocked source
        and includes hardware-adjacent components that are not part of Generalist AI's revenue model.
      whyItMatters: >
        Without an independently verified SAM, the investment thesis rests on a boundary assumption
        (that the full AI robotics software market is addressable) that has not been validated by
        commercial deployment at scale.
      diligencePath: >
        Commission a primary research project to bound the SAM by surveying AI/software budget
        lines from 20+ tier-1 manufacturing and logistics buyers; cross-reference with disclosed
        pilot contract values from Physical Intelligence, Figure AI, and comparable entities.
      relatedQuestionRefs: [QM028, QM019]

    - type: access-blocked
      severity: minor
      topic: GVR-embodied-AI-report
      missingEvidence: >
        Grand View Research's primary "Embodied AI Market Size & Share" report
        (https://www.grandviewresearch.com/industry-analysis/embodied-ai-market-report) returned
        a 403 error on direct access as of June 30, 2026. The $6.5B (2026) and $67.6B (2033)
        figures are cited from this source via search-result corroboration and the
        Research and Markets re-publication (SM025).
      whyItMatters: >
        The narrowest directly comparable TAM estimate ($6.5B) relies on an inaccessible primary
        source. The secondary re-publication (SM025) corroborates the headline figures, but
        detailed methodology and scope definition cannot be independently verified.
      diligencePath: >
        Purchase the Grand View Research report directly, or use the Research and Markets
        re-publication (SM025) as the citable proxy with disclosed limitations.
      relatedQuestionRefs: [QM004]

    - type: missing-source
      severity: minor
      topic: regulatory-embodied-AI
      missingEvidence: >
        No AI-specific regulatory framework for embodied foundation models has been enacted in any
        major jurisdiction as of June 2026. The EU AI Act classifies some robotics applications as
        high-risk, but specific applicability to cross-embodiment dexterous manipulation models is
        not yet adjudicated. ISO 9283 and ISO/TS 15066 govern physical safety but not AI model
        liability.
      whyItMatters: >
        Regulatory clarity around AI embodied model liability could accelerate enterprise adoption
        (by providing safe harbor) or slow it (by requiring certification). The ambiguity extends
        sales cycles in regulated industries (pharma, food/beverage, automotive with functional safety).
      diligencePath: >
        Engage a robotics regulatory specialist to assess the EU AI Act applicability to Generalist
