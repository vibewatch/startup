      - CM040

callouts:
  - calloutType: insight
    title: Software Revenue Capture Is the Central Valuation Bet
    body: >
      The industrial robotics hardware market ($54.28B in 2026) is 8x larger than the AI robotics
      software market ($14.18B) but growing at less than half the rate (11.7% vs 15.3% CAGR).
      History from enterprise software suggests that the intelligence layer eventually captures
      disproportionate margin relative to hardware. Generalist AI's bet is that the foundation
      model becomes the margin-rich OS of physical intelligence—similar to how iOS/Android
      marginalized handset hardware margins. Whether this analogy holds depends on how long
      hardware OEMs can resist commoditization and whether switching costs in foundation models
      reach software-moat levels.
    claimRefs:
      - CM007
      - CM010
      - CM017

  - calloutType: risk
    title: Boundary Disagreement Makes TAM Claims Unverifiable
    body: >
      The gap between the three primary sizing lenses—$6.5B (GVR embodied AI), $14.18B (IMR AI
      robotics software), and $20.4B (GVR AI in robotics)—is not a rounding difference; it
      reflects fundamentally different scope assumptions. At a $2 billion valuation, Generalist
      AI is priced at approximately 15x the narrowest directly comparable market ($6.5B) or
      roughly 1.5x if you accept the broadest boundary. The investment thesis requires accepting
      a boundary definition that includes the full AI software stack for all robot form factors—
      a definition that no current commercial deployment has validated.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM044

  - calloutType: risk
    title: Adoption Funnel Has a Multi-Step Integration Tax
    body: >
      The buyer journey from pilot to production runs through a mandatory integration checkpoint
      that costs $40,000-80,000 per cell and typically takes 3-12 months. This integration tax
      is structural—it exists because every production factory runs certified PLCs, MES systems,
      and safety protocols that require third-party validation. Until Generalist AI has a verified
      integration pathway for the top 5 manufacturing automation platforms (Siemens TIA Portal,
      Rockwell FactoryTalk, Beckhoff TwinCAT, ABB Ability, Fanuc FOCAS), the commercial path from
      demo success to production deployment remains an unconfirmed assumption.
    claimRefs:
      - CM031
      - CM039
      - CM040

