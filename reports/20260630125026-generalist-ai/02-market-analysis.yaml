  - id: buyer-segmentation
    title: Buyer Segmentation and Procurement Dynamics
    body: >
      Buyers of embodied AI software span five distinct segments with different procurement
      structures, workflow contexts, and adoption triggers. Understanding these segments is
      material because the budget owner, payback horizon, and integration cost differ
      substantially, affecting the commercial model that any AI robotics software vendor must
      deploy.

      Tier-1 manufacturing and automotive OEM end-users (assembly plants, contract manufacturers,
      electronics fabs) are the historically dominant buyers of industrial robotics, accounting
      for 35.86% of industrial robot demand in 2025 (automotive alone). These buyers purchase
      via capital budgets through multi-year procurement cycles, require certified integrator
      support, and evaluate on cycle time, uptime, and total cost of ownership. Pharmaceutical
      and healthcare manufacturing shows the fastest CAGR at 13.52% through 2031.

      Logistics, warehouse, and 3PL operators are the fastest-growing near-term buyer cohort.
      The e-commerce segment is projected to hold 47.21% of the warehouse robotics market in
      2026. These buyers increasingly adopt Robot-as-a-Service (RaaS) models to convert capital
      expenditure to operating expenditure, lowering adoption friction. Amazon's announced $1
      billion warehouse automation investment and Figure AI's BMW Spartanburg deployment—where
      Figure 02 loaded over 90,000 parts across 1,250+ runtime hours—represent the leading
      edge of this segment's willingness to scale AI-driven robotics.

      Robot hardware OEM manufacturers (ABB, Fanuc, KUKA, Boston Dynamics, 1X Technologies,
      Figure AI) represent a distinct software buyer: they embed intelligence into their robot
      platforms to differentiate their hardware products and respond to customer demand for
      cross-task generalization. These buyers evaluate foundation models as potential platform
      replacements for their proprietary embedded AI stacks, purchasing via R&D budgets.

      Laboratory automation buyers in pharma, biotech, and diagnostics drive the $2.64 billion
      lab robotics market (2026). These buyers are particularly sensitive to GMP compliance,
      reproducibility, and regulatory traceability, making adoption of third-party AI layers
      cautious but potentially durable given high task complexity and labor cost.

      Contract manufacturers and 3PLs with high-mix, low-volume production runs represent
      an emerging addressable segment where the value of rapid task adaptation (vs. expensive
      bespoke programming) is highest, but integration support remains a bottleneck.
