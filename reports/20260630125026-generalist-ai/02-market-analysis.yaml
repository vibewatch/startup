            - label: Medium
              tone: neutral
              detail: Modern warehouse WMS supports API integrations; lower legacy friction than factory floor.
            - label: Low
              tone: positive
              detail: Warehouse operations data is less proprietary than manufacturing IP.
        - label: Robot Hardware OEM
          values:
            - label: Medium
              tone: neutral
              detail: Licensing foundation model may accelerate product roadmap; build-vs-buy tradeoff is active.
            - label: Low
              tone: neutral
              detail: Labor pressure does not directly drive OEM purchasing; customer pull does.
            - label: Low
              tone: positive
              detail: OEMs have internal robotics engineering expertise; integration friction is lower.
            - label: Medium
              tone: neutral
              detail: OEM IP concerns around training data ownership and model performance attribution.
        - label: Lab Automation / Life Sciences
          values:
            - label: Medium
              tone: neutral
