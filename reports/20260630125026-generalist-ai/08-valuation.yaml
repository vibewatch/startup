            500,000+ hours proprietary dataset; hardware-agnostic architecture; data engine at
            10,000+ hours/week. Strong structural moat if the scaling thesis holds.
          tone: positive
        - label: Commercial proof
          score: 1
          detail: >
            No revenue, no named customers, no pricing confirmed as of June 30 2026.
            Early-access program is the only public signal; partners unnamed.
          tone: negative
        - label: Competitive positioning
