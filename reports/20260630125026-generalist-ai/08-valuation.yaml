    title: Recommendation logic
    type: flow
    layout: wide
    summary: >
      The track recommendation flows from strong team and data signals converging on stretched
      valuation and zero commercial proof — with NVIDIA commoditization risk as the key swing factor.
    data:
      nodes:
        - id: team
          label: Team pedigree
          detail: >
            Pete Florence (DeepMind, PaLM-E/RT-2), Andy Zeng (Code as Policies), Andrew Barry
            (Boston Dynamics). 8VC: "as much a builder as a researcher."
          tone: positive
        - id: data
          label: Data-engine moat
          detail: >
            500,000+ hours of proprietary physical interaction data; 10,000+ hours per week;
            no robot data in pretraining — structurally hard to replicate.
          tone: positive
        - id: market
          label: Market signal
          detail: >
            Embodied AI TAM $6.5B in 2026 growing at 39.7% CAGR; $40.7B raised in robotics in 2025.
          tone: positive
        - id: revenue
          label: Commercial proof gap
          detail: >
            Zero disclosed revenue. Early-access partners unnamed. No ARR, no customer count,
            no pricing disclosed as of June 30, 2026.
          tone: warning
        - id: comps
          label: Peer relative value
          detail: >
            $2B vs. Physical Intelligence $5.6–11B and Skild AI $14B; lowest in software-pure peer set,
