          tone: warning
        - id: nvidia
          label: NVIDIA commoditization risk
          detail: >
            NVIDIA GR00T N-series provides free open-source model weights. If expanded to enterprise,
            the proprietary model premium compresses materially.
          tone: warning
        - id: decision
          label: Track — conditional entry
          detail: >
            Stay engaged. Require private confirmation of at least one revenue-generating deployment
            before buying at the $2B mark.
          tone: neutral
