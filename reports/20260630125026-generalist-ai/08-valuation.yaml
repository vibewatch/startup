  - id: section-scenarios
    title: "Scenario analysis: the bull case is technically credible; the bear case is closer to today's public evidence"
    body: >
      The bull case rests on three compounding assumptions: (a) the data-engine flywheel works as
      designed — 500,000 hours today grows to 5 million+ within two years, making the cost to
      replicate the dataset prohibitive; (b) GEN-1 and its successors demonstrate sufficient commercial
      viability in 2026–2027 to lock in multi-year enterprise deployments with at least one anchor
      industry; and (c) Generalist AI's hardware-agnostic positioning proves superior to vertically
      integrated rivals for enterprise procurement purposes. In this case, a 2029–2030 acquisition
      at $500M–$1B ARR by a technology incumbent (NVIDIA, Amazon, Google, or a major OEM) at 15–20x
      ARR implies a $7.5–20B exit, a 3.75–10x return on $2B with significant dilution risk.

      The base case is more cautious. Commercial revenue emerges in 2027, but adoption is slow due to
      enterprise robotics qualification cycles (six to eighteen months), and ARR reaches $20–50M by
      2028. A strategic acquisition in 2029–2031 at 10–15x on $30–50M ARR implies a $300M–$750M exit
      — flat to modestly negative return on $2B entry before accounting for dilution. The base case is
      consistent with the typical timelines seen for deep-tech AI commercialization at comparable stages.

      The bear case is supported by existing adverse evidence. AIRoboticDaily documented that
      approximately 95% of humanoid robot revenue currently comes from research and showroom use, not
      productive industrial deployment. Brad Porter of Cobot argues that production-tested physical AI
      systems have superior commercial credibility to research-paper-based approaches. NVIDIA's
      open-source GR00T N-series provides free model weights to developers, threatening commoditization
      of the foundation model layer. In the bear case, GEN-1 fails to convert to revenue by 2028,
      the $400M runway is depleted, and the outcome is an acqui-hire or down-round at a material discount
      to the $2B entry mark. The bear case is not the base case, but it is not remote — it requires only
      that commercialization take two to three years longer than the bull narrative projects.
