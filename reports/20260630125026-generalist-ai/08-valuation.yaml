  - id: section-valuation-context
    title: "Price context: $2B is the lowest in the direct software-peer set — pre-revenue limits every conventional anchor"
    body: >
      Generalist AI's $2B valuation sits materially below the private market benchmarks set by its nearest
      rivals. Physical Intelligence's November 2025 Series B put it at $5.6 billion, and by March 2026
      the company was in reported talks for a new round at $11 billion. Skild AI completed a $1.4 billion
      Series C at over $14 billion in January 2026, led by SoftBank and NVIDIA — and Skild had disclosed
      approximately $30M in revenue, providing at least one revenue anchor for its much higher multiple.
      Figure AI, as a full-stack competitor combining hardware and software, reached $39 billion in
      September 2025.

      Applying conventional revenue multiples to Generalist AI is impossible without revenue data. Using
      forward projections: at a 20x multiple (appropriate for a high-growth private AI software company
      with early traction), $2B implies a target ARR of $100M. At 40x (appropriate for a pre-revenue
      frontier AI scarcity premium), $2B implies only $50M ARR needed. Both scenarios are plausible but
      neither is grounded in confirmed metrics. By contrast, Finerva's analysis of public Robotics & AI
      companies places the sector median EV/Revenue at 3.4x and the EBITDA median at 16.8x in Q4 2025 —
      but these public-company medians reflect mature, revenue-generating businesses and are not
      applicable to a pre-revenue stage company. Finro's Q1 2026 dataset shows LLM vendors at a median
      39.5x EV/Revenue, and AI robotics private companies at an estimated 20–60x on projected forward
      revenue.

      The most honest framing of $2B for Generalist AI is not a revenue multiple at all — it is an
      option price on a technology and team. The entry is cheap versus peers, but it is not cheap in
      absolute terms when zero commercial proof exists. Any investor entering at this mark is effectively
      paying for: (1) the founders' pedigree and track record at DeepMind and Boston Dynamics,
      (2) the proprietary dataset moat of 500,000+ hours, (3) the GEN-1 architecture differentiation,
      and (4) the real option that physical foundation models scale the way language models did. Whether
      $2B is fair value for those options depends on convictions investors can only assess through
      private diligence.
