  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - No verifiable commercial revenue by Q4 2027
        - No named customers or disclosed ARR milestone 18 months after GEN-1 early-access launch
        - Data-flywheel thesis cannot be confirmed; financing risk rises at next fundraise
        - Re-evaluate to sell or reduce position; require confirmed revenue before adding exposure
      - - NVIDIA GR00T enterprise expansion
        - NVIDIA makes GR00T N-series available under permissive enterprise license with comparable or better performance
        - Foundation model layer commoditized; Generalist AI's proprietary model premium compresses
        - Immediately assess moat deterioration; lower valuation target range by 40–60%
      - - "Competitor ARR milestone: PI or Skild achieves $100M+ ARR"
        - Physical Intelligence or Skild AI discloses $100M+ ARR with broadly comparable model performance
        - Generalist AI's relative moat from data scale is no longer sufficient as sole differentiator
        - Trigger urgent private diligence on Generalist AI's commercial pipeline; re-evaluate thesis
      - - Key-person departure
        - Departure of Pete Florence (CEO) or Andy Zeng (Chief Scientist) from leadership roles
        - Company identity, fundraising narrative, and technical direction are tied to both founders
        - Pause new investment; evaluate leadership transition plan and surviving team depth
      - - Down-round or bridge financing
        - Generalist AI raises a follow-on round at or below $2B valuation without material commercial progress
        - Signals market has lost confidence in near-term commercial proof; increases dilution risk
        - Treat as buy signal only if down-round price is materially below $1B with confirmed traction; otherwise reduce
    notes: >
      Triggers are measurable or observable events, not qualitative judgments. Each has a direct transmission
      path to the commercial thesis and actionable investment implications.
    claimRefs:
      - CV029
      - CV034
      - CV036
      - CV037
      - CV038

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue and commercial traction
        - Confirmed ARR, contract terms with at least one named paying customer, pipeline size
        - The entire $2B thesis rests on forward commercial execution; no revenue anchor is publicly available
        - Request commercial pipeline report, early-access partner list, and MOU/LOI terms in data room
      - - Cap-table and preference stack
        - Full cap-table showing diluted share count, option pool, liquidation preferences, and ratchets
        - Headline $2B post-money may materially overstate effective economic entry after preference waterfall
        - Request cap-table model and Series B term sheet from company or lead investor (Radical Ventures)
      - - Independent model performance validation
        - Third-party or independent benchmark confirming GEN-1's 99% success rate and 1-hour adaptation claim
        - All performance claims are company-sourced; independent validation is essential before buy
        - Require staged deployment pilot or independent technical audit as condition of investment
      - - Board composition and governance
        - Confirmation of board seats (Radical Ventures, NVIDIA NVentures), independent directors, observer rights
        - Governance structure determines how quickly decisions can be made and what investor protections exist
        - Request board composition confirmation and governance documents from company
      - - Burn rate and runway trajectory
        - Actual monthly burn (not estimated), headcount plan, compute capex schedule through 2027
        - Estimated $10M/month is a proxy; actual burn and cost breakdown are unknown
        - Request quarterly management accounts and board financial package for most recent 4 quarters
    notes: >
      All five diligence items are blocking for a buy recommendation. Absence of any one of them
      maintains the track call.
