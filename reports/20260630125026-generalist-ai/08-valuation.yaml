  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Direction
      - What would change the view
    rows:
      - - Elite research-builder team (Pete Florence, Andy Zeng, Andrew Barry) with direct DeepMind and Boston Dynamics pedigree.
        - thesis
        - Departure of 2+ founders or a major team exodus would weaken the talent moat.
      - - Proprietary 500,000-hour physical interaction dataset collected through data-hands devices — structurally hard to replicate.
        - thesis
        - Open-source data collection methodologies or competitor datasets at comparable scale would erode moat.
      - - Hardware-agnostic positioning allows Generalist to be the intelligence layer across all robot form factors rather than tied to one OEM.
        - thesis
        - Loss of a key hardware partner or NVIDIA's expansion of a competing cross-embodiment model would reduce platform breadth.
      - - $2B valuation is lowest in direct software-peer group — meaningful relative upside if tech thesis holds.
        - thesis
        - A down-round by Physical Intelligence or Skild AI would recalibrate sector valuations and reduce relative premium.
      - - No disclosed revenue, no confirmed customers, no financial metrics — all upside is forward-looking.
        - anti-thesis
        - A confirmed anchor customer or disclosed ARR milestone would shift the call toward conditional buy.
      - - NVIDIA GR00T N-series provides free open-source model weights to developers, threatening model-layer commoditization.
        - anti-thesis
        - If NVIDIA restricts GR00T to proprietary use or GR00T performance falls materially below GEN-1, the threat recedes.
      - - Competitors Skild AI ($14B, $30M ARR) and Physical Intelligence ($11B) have raised more capital and — in Skild's case — have demonstrated revenue.
        - anti-thesis
        - Skild and PI entering a sustained commercial deployment slump would reduce the bar Generalist must meet.
      - - Industrial qualification cycles of 6–18 months mean revenue is structurally delayed; burn accelerates before revenue arrives.
        - anti-thesis
        - A shorter-cycle product (e.g., a hosted API for rapid prototyping) could accelerate first dollar of revenue.
    notes: >
      Thesis and anti-thesis points are derived from public evidence. The core tension is between
      the quality of the input ingredients (team, data, architecture) and the complete absence of
