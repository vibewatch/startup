    severity: material
    topic: foundation-model-SAM
    missingEvidence: >
      No public market research firm tracks the addressable revenue pool for "cross-embodiment dexterous manipulation
      foundation model licensing" as a discrete market segment. The closest proxy (Grand View Research "Embodied AI" at
      $6.5B in 2026) is a blocked source and includes hardware-adjacent components that are not part of Generalist AI's
