  - type: missing-source
    severity: minor
    topic: regulatory-embodied-AI
    missingEvidence: >
      No AI-specific regulatory framework for embodied foundation models has been enacted in any major jurisdiction as
      of June 2026. The EU AI Act classifies some robotics applications as high-risk, but specific applicability to
      cross-embodiment dexterous manipulation models is not yet adjudicated. ISO 9283 and ISO/TS 15066 govern physical
      safety but not AI model liability.
    whyItMatters: >
      Regulatory clarity around AI embodied model liability could accelerate enterprise adoption (by providing safe
      harbor) or slow it (by requiring certification). The ambiguity extends sales cycles in regulated industries
      (pharma, food/beverage, automotive with functional safety).
    diligencePath: >
      Engage a robotics regulatory specialist to assess the EU AI Act applicability to Generalist AI's model; confirm
      ISO compliance posture of GEN-1; identify any pilot certification engagements or pre-submission discussions with
      safety bodies.
    relatedQuestionRefs:
      - QM017
