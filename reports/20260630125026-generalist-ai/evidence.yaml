evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >
      Generalist AI's annual recurring revenue, pricing model, and gross margin are not publicly disclosed. No financial
      filings, press releases, or leaks confirm any revenue figure.
    whyItMatters: >
      At a $2 billion valuation, the absence of revenue data makes it impossible to assess the revenue multiple or
      commercial validation behind the price. Investors may be paying purely for technical optionality.
    diligencePath: >
      Request audited financials or unaudited management accounts; check for any SEC filings if the company has issued
      securities to US-based retail-adjacent investors; interview reference customers under NDA.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >
      No named commercial customer or partner has been publicly confirmed in association with GEN-1 early-access
      deployments. The GEN-1 blog says "early access now available to selected partners" but does not name them.
    whyItMatters: >
      The absence of named customers makes it impossible to assess product-market fit, deployment friction, or the speed
      at which the data flywheel is actually spinning.
    diligencePath: >
      Request a reference list of three customers with permission to call; verify claimed task success metrics in real
      deployment (not controlled demo) conditions.
    relatedQuestionRefs:
      - QO010
      - QO018
