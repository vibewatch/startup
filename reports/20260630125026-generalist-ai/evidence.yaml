      CCPA, or equivalent privacy obligations. Export controls on foundation models or dual-use robotics technology
      could also apply.
    diligencePath: >
      Conduct legal diligence on data collection consent frameworks; request counsel opinion on GDPR and CCPA
      applicability; check for any government entity customer restrictions.
