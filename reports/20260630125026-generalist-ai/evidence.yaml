    severity: minor
    topic: GVR-embodied-AI-report
    missingEvidence: >
      Grand View Research's primary "Embodied AI Market Size & Share" report
      (https://www.grandviewresearch.com/industry-analysis/embodied-ai-market-report) returned a 403 error on direct
      access as of June 30, 2026. The $6.5B (2026) and $67.6B (2033) figures are cited from this source via
