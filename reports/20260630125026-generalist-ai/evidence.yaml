      enterprise buyers. Asia-Pacific represents 44%+ of industrial robot installations (Mordor), making geographic
      addressability a material question for a US-headquartered early-stage company.
    whyItMatters: >
      Generalist AI's current team and early-access deployment focus suggests a near-term SAM concentrated in North
      America and Western Europe. If the company cannot address the Asia-Pacific market (where 52% of China's
      installations are subsidized domestically), its effective SAM may be substantially below the global headline
