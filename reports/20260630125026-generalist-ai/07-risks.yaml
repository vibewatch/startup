company:
  name: Generalist AI

chapter:
  number: 7
  title: Risks
  summary: >
    Generalist AI's highest-residual risks fall into five stacks: (1) regulatory and legal exposure
    as the EU AI Act's high-risk enforcement deadline of August 2, 2026 arrives with no publicly
    visible compliance framework for GEN-1; (2) model-safety gaps, where documented improvisational
    behaviors in physical environments create uncontrolled failure modes and no third-party audit or
    alignment framework has been published; (3) compute and infrastructure dependency on NVIDIA, with
    H100/Blackwell GPU lead times of 36–52 weeks threatening model training schedules; (4) capital
    intensity and partner concentration in a pre-revenue business burning an estimated $5–15 million
    per month with no disclosed hardware or cloud partner names; and (5) key-person concentration in
    three co-founders who collectively hold the scientific identity, investor narrative, and
    commercial relationships of the company. None of these risks is immediately disqualifying, but
    the absence of publicly verifiable mitigations across all five dimensions means investors must
    rely on diligence asks rather than public evidence to underwrite residual exposure.

sections:
  - id: section-regulatory-legal
    title: Regulatory and legal risk is the most urgent stack as EU AI Act enforcement begins
    body: >
      The EU AI Act's obligations for high-risk AI systems become fully enforceable on August 2, 2026,
      creating an immediate compliance deadline for Generalist AI if GEN-1 is deployed in the EU or
      used by EU-based robot operators. Under Article 6 of the Act, an AI system qualifies as
      high-risk when it functions as a safety component of a product covered by EU harmonisation
      legislation and that product requires third-party conformity assessment. GEN-1 deployed inside
      industrial robots—arms, cobots, or semi-humanoid systems on factory floors—almost certainly
      meets this threshold, particularly in sectors such as automotive or electronics assembly where
      robot safety certification is mandatory. High-risk classification triggers a comprehensive
      obligations stack: an ongoing risk management system, data governance documentation, technical
      documentation sufficient for conformity assessment, human-oversight measures, accuracy and
      robustness requirements, post-market monitoring, and a Fundamental Rights Impact Assessment
      (FRIA). Penalties for non-compliance reach €35 million or 7% of global annual turnover,
      whichever is higher. As of June 30, 2026, Generalist AI has published no DPA, no conformity
      assessment documentation, no high-risk declaration, and no EU-facing compliance or privacy
      notice for GEN-1 deployments. The company's sole public disclosure is an early-access partner
      program contact address. This is consistent with an early-commercial stage, but it means the
      compliance posture is entirely invisible to investors.

      Parallel legal exposure comes from product liability law. In the United States, strict product
      liability doctrine holds manufacturers liable when a defective product causes harm regardless of
      negligence. Courts are still working through how liability attaches when the AI software provider
      is separate from the hardware manufacturer—a gap the EU AI Liability Directive is beginning to
      address but US federal law has not. For Generalist AI, the risk is layered: if a robot running
      GEN-1 injures a worker, litigation could name the hardware OEM, the system integrator, and
      Generalist AI as the model provider. No insurance coverage, indemnification clause, or liability
      allocation framework has been publicly disclosed by Generalist. RAND's 2024 analysis of US tort
      law applied to AI systems found that the fragmentation of AI development chains makes causation
      attribution complex and leaves model providers with unpredictable exposure. The International AI
      Safety Report 2026, chaired by Yoshua Bengio, identifies accountability gaps in embodied AI as
      one of the field's most urgent governance challenges. GDPR creates a third legal vector: Generalist
      AI collects physical interaction data across thousands of homes, warehouses, and factories
      globally, including in the EU. That data includes fine-grained wrist kinematics, workspace video,
      and possibly biometric elements from data-hands operators. Article 9 GDPR treats data that
      uniquely identifies a person through biometric processing as special-category data, requiring
      explicit consent and strict controls. No public privacy notice, DPIA documentation, or
      consent management framework for the data collection program has been published.
