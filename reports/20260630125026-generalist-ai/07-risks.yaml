  - id: TR005
    title: Mitigation and kill criteria table
    notes: >
      Triggers are observable from public sources (regulatory announcements, litigation databases,
      media, job postings); thresholds are analyst judgements, not contractually defined criteria.
    columns:
      - risk
      - monitorable trigger
      - threshold/event
      - action implication
    rows:
      - - EU AI Act high-risk non-compliance
        - EU market access; enterprise buyer procurement requirements; EU regulatory inquiry
        - August 2 2026 enforcement date passes without Generalist publishing conformity documentation or receiving industry partner block from EU procurement
        - Pause EU-facing deployment commitments; escalate to board; engage EU AI Act legal counsel immediately.
      - - Physical injury attributable to GEN-1 in production deployment
        - Public incident report; litigation filing; partner disclosure; media report
        - Any confirmed physical injury or property damage incident involving a GEN-1-controlled robot
        - Trigger full deployment review; notify investors; engage product liability counsel; reassess safety framework with third-party auditor.
      - - NVIDIA compute access disruption or material pricing increase
        - GPU procurement lead time extension beyond 52 weeks; Blackwell allocation denial; cloud pricing renegotiation exceeding 25%
        - Training compute for GEN-2 delayed by six or more months from internal roadmap
        - Accelerate alternative sourcing (AMD MI300X, hyperscaler TPU access, neo-cloud); revise capital plan to reflect higher training cost.
      - - Co-founder departure (any of three)
        - Public announcement; team restructuring signals; board composition change
        - Any co-founder departure before commercial milestone
        - Reassess thesis; convene board review of succession; evaluate impact on investor confidence and fundraising trajectory.
      - - Capital runway below 12 months without committed term sheet
        - Monthly burn versus cash balance; absence of Series C activity with 18 months remaining
        - Cash balance implies less than 12 months at current burn with no term sheet in hand
        - Trigger emergency capital-efficiency measures; initiate bridge or Series C process; assess strategic options including acqui-hire.
      - - GDPR or data privacy enforcement action against data collection operation
        - Regulatory inquiry letter; DPA complaint; media report of data subject complaint
        - Any formal GDPR enforcement inquiry from EU supervisory authority targeting data collection program
        - Suspend EU data collection pending legal review; appoint DPO; commission emergency DPIA; disclose to investors.

