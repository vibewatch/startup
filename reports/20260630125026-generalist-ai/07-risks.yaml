  evidenceGaps:
    - topic: cloud-provider-identity
      type: private-evidence-only
      severity: moderate
      missingEvidence: >
        Identity of cloud infrastructure providers powering Generalist AI's training pipeline,
        data storage, and model serving; contract terms including pricing, minimum commitments,
        and SLA obligations. Only "multi-cloud" is mentioned without naming providers.
      whyItMatters: >
        Unknown cloud concentration means investors cannot assess single-provider outage risk,
        pricing renegotiation exposure, or whether the multi-cloud claim provides genuine resilience.
        A training compute outage at a concentrated cloud provider could disrupt GEN-2 development
        by weeks or months.
      relatedQuestionRefs:
        - QR015
      diligencePath: >
        Request cloud provider list, service agreements, and any minimum-spend commitments under NDA;
        confirm whether NVIDIA NVentures' investment comes with preferential cloud access through
        NVIDIA's cloud partnerships.
    - topic: early-access-partner-traction
      type: private-evidence-only
      severity: material
      missingEvidence: >
        Number of active early-access partners, partner names, whether relationships are revenue-
        generating or data-for-access arrangements, production versus pilot classification, and
        data contribution volumes per partner. The investor reference to "real businesses generating
        task data" implies contractual relationships but provides no partner-count or concentration
        data.
      whyItMatters: >
        Partner concentration determines whether the data flywheel is durable commercial traction
        or a fragile arrangement where one or two partners supply the majority of operating data.
        A concentrated flywheel is both a commercial risk (partner withdrawal) and a technical risk
        (training data diversity collapses if the largest partner exits).
      relatedQuestionRefs:
        - QR019
      diligencePath: >
        Request partner list with data contribution breakdown, contract terms, and renewal provisions
        under NDA; ask management to distinguish revenue-generating deployments from data-for-access
        or pilot arrangements.
    - topic: partner-commercial-evidence
      type: private-evidence-only
      severity: material
      missingEvidence: >
        Named hardware and deployment partner list, signed integration agreements, contract terms,
        revenue amounts, and any production versus pilot classification for early-access GEN-1 deployments.
        The investor reference to "real businesses generating task data" implies contractual relationships
        exist, but no names, volumes, or contract terms are public.
      whyItMatters: >
        Without named partners and contract visibility, it is impossible to distinguish durable commercial
        traction (revenue-generating deployments with retention) from a structured data-sharing arrangement
        that could terminate without financial consequence. This distinction is material for Series C
        valuation and for understanding partner-concentration risk.
      relatedQuestionRefs:
        - QR029
      relatedTableRefs:
        - TR001
      diligencePath: >
        Request the full partner list, executed agreements (or term sheets), revenue or data-credit terms,
        renewal provisions, and any exclusivity or non-compete restrictions under NDA from management.
    - topic: product-liability-insurance
      type: missing-source
      severity: material
      missingEvidence: >
        Product liability insurance policy, coverage amount, insurer, and policy conditions for GEN-1
        deployments; contractual indemnification and liability allocation provisions in early-access
        partner agreements; any evidence of D&O or E&O coverage.
      whyItMatters: >
        A single physical injury incident involving a GEN-1-controlled robot could generate litigation
        naming Generalist AI as the AI model provider. Without insurance and contractual protection,
        a material incident could threaten the company's financial position and fundraising trajectory
        before safety mitigations can be implemented.
      relatedQuestionRefs:
        - QR030
      diligencePath: >
        Request certificates of insurance for product liability, E&O, and D&O coverage; request the
        liability and indemnification section of all early-access partner agreements; confirm whether
        Generalist AI's board has addressed product liability risk management.
