  - id: section-compute-infrastructure
    title: Compute and infrastructure dependency on NVIDIA creates training schedule and cost risk
    body: >
      NVIDIA NVentures is a co-investor in both of Generalist AI's fundraising rounds—the March 2025
      seed and the June 2026 $400 million Series B. This relationship creates strategic alignment and
      preferential access to NVIDIA's robotics software stack, but it does not eliminate structural
      dependency on NVIDIA hardware for frontier model training. GEN-1 was trained on a distributed
      infrastructure capable of processing petabytes of physical interaction data and absorbing 6.85
      years of manipulation experience per day of training—a workload profile that requires H100- or
      Blackwell-class GPU clusters. As of mid-2026, procurement lead times for H100 and H200 GPUs
      from non-hyperscaler buyers remain 36–52 weeks, driven by High Bandwidth Memory (HBM3) supply
      constraints at SK Hynix, TSMC CoWoS advanced packaging oversubscription, and NVIDIA's own
      capacity shift toward higher-margin Blackwell production. Embodied AI startups operate outside
      the allocation priority window that hyperscalers command through forward contracts; Generalist's
      path to GEN-2 training depends on securing compute at the required scale on an undisclosed
      timeline.

      The multi-cloud contracts Generalist AI reportedly operates are not publicly named. Cloud
      provider concentration is unconfirmed: if training is concentrated with one provider, a pricing
      renegotiation, capacity constraint, or service disruption creates a direct model-development
      bottleneck. The physical data collection infrastructure—thousands of wearable data-hands
      devices, custom upload machines, dedicated internet lines, and O(10K) processing cores—adds
      a second layer of infrastructure dependency that is operationally distinct from cloud compute.
      An outage in the data pipeline interrupts the data flywheel that justifies Generalist's
      valuation premium over pure-software AI companies.

      The capital requirement for next-generation model training is not publicly disclosed but is
      structurally high. Physical Intelligence's data profile implies training costs of tens of millions
      of dollars per major model generation; Figure AI's $200–300 million annual burn benchmark
      reflects hardware-supported training operations at greater scale. Generalist AI targets the
      same compute and data intensity with a pure-software margin profile but must still fund the
      underlying infrastructure from equity capital. If GPU procurement delays the GEN-2 training
      timeline by six to twelve months, the competitive window against Physical Intelligence (π0.5,
      $11 billion valuation, $1 billion raise in April 2026), Google DeepMind, and NVIDIA's own GR00T
      N1.6 open-source model narrows materially.
