          performance
        - Foundation model layer commoditized; Generalist AI's proprietary model premium compresses
        - Immediately assess moat deterioration; lower valuation target range by 40–60%
      - - 'Competitor ARR milestone: PI or Skild achieves $100M+ ARR'
        - Physical Intelligence or Skild AI discloses $100M+ ARR with broadly comparable model performance
        - Generalist AI's relative moat from data scale is no longer sufficient as sole differentiator
        - Trigger urgent private diligence on Generalist AI's commercial pipeline; re-evaluate thesis
