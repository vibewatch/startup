  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Framework and Market Structure
        blocks:
          - type: paragraph
            body: >
              The physical AI foundation model market can be divided into four distinct competitive archetypes, each
              representing a different strategy for capturing the intelligence layer of the robotics stack. The first
              archetype is pure software / intelligence-layer companies, who build general-purpose robot brains without
              manufacturing hardware: Generalist AI, Physical Intelligence, and Skild AI are the primary examples. These
              companies compete on model generalization, data scale, hardware-agnosticism, and the ability to distribute
              a single trained model across diverse robot form factors. The second archetype is full-stack humanoid
              integrators who build both the hardware body and the proprietary AI brain: Figure AI, Boston Dynamics
              (Atlas), 1X Technologies, and Agility Robotics are examples. These players control the hardware-software
              interface and can iterate on model and embodiment together, but their distribution is naturally
              constrained to their own hardware fleet. The third archetype is incumbent platform players — technology
              companies with adjacent compute, data, or distribution assets extending into robotics: Google DeepMind and
              NVIDIA. Google contributes web-scale multimodal pretraining and a commercial API; NVIDIA contributes the
              dominant GPU stack plus open-source GR00T models as loss leaders to drive hardware adoption. The fourth
              archetype is status quo and internal build: manual labor at scale, classical industrial automation (ABB,
              FANUC, KUKA), and vertically integrated in-house AI teams at Amazon (ex-Covariant founders) and Tesla
              (Optimus). Generalist AI most directly competes with Physical Intelligence and Skild AI in archetype one,
              and faces long-term disruption risk from NVIDIA commoditizing the model layer by distributing free
              open-source VLAs to every developer. Full-stack integrators like Figure AI and Boston Dynamics are
              simultaneously potential customers for Generalist's model and competitors for enterprise deployment wallet
              share.
