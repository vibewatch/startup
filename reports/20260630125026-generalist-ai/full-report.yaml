  - id: FI001
    title: Revenue Model Bridge — Customer Activity to Gross Profit
    type: flow
    layout: standard
    summary: >
      How Generalist AI converts robot operator activity into revenue and gross profit under the inferred per-robot SaaS
      / enterprise license model.
    data:
      nodes:
        - id: robot-operator
          label: Robot Operator (Manufacturer / Integrator / Enterprise)
          detail: Purchases or licenses GEN-1 model access; provides robot hardware and deployment environment
        - id: fine-tune
          label: Task Fine-Tuning (~1 hr robot data)
          detail: Operator collects ~1 hour of task-specific robot data; model adapts to embodiment and task
        - id: deployment
          label: Production Deployment
          detail: Robot runs GEN-1 model in production; streams sensor data to cloud API or runs inference on-robot
        - id: revenue-trigger
          label: Revenue Event (per-robot subscription or enterprise license)
          detail: >-
            Monthly per-robot fee (estimated ~$300/robot/month by PI SaaS analog) OR annual site license; Generalist AI
            has not confirmed pricing
        - id: cogs
          label: Cost of Goods Sold (COGS)
          detail: >-
            Cloud inference compute, data egress, model serving infrastructure, customer support; estimated 20–40% of
            revenue at maturity
        - id: gross-profit
          label: Gross Profit
          detail: Revenue minus COGS; estimated 60–80% at scale for software delivery; depressed near-term by compute costs
        - id: data-flywheel
          label: Data Flywheel (Non-cash)
          detail: Production deployments generate new task data; feeds next model generation training dataset
      edges:
        - from: robot-operator
          to: fine-tune
          label: Provides task data + hardware
        - from: fine-tune
          to: deployment
          label: Model adapted in ~1 hr; deployed to production
        - from: deployment
          to: revenue-trigger
          label: Triggers subscription or license billing
        - from: revenue-trigger
          to: cogs
          label: Revenue less inference and support costs
        - from: cogs
          to: gross-profit
          label: Revenue minus COGS
        - from: deployment
          to: data-flywheel
          label: Real-world task data captured
    approximationNotes: >
      Revenue trigger node uses Physical Intelligence $300/robot/month SaaS pricing as an analog; Generalist AI has not
      confirmed any pricing. COGS percentages are estimated from software-SaaS benchmarks adjusted for inference
      compute. This is an illustrative model; actual revenue mechanism is unconfirmed.
