              sensorimotor loop—represents a significant data moat that competitors cannot quickly replicate.
              Teleoperation-based competitors produce inherently slower, more stilted trajectories that miss the
              reflexive micro-corrections embedded in natural human dexterity. The power-law scaling relationship
