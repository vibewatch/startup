  - id: FU001
    title: Customer Journey Map — Enterprise Robot Operator
    type: journey-map
    layout: wide
    summary: Illustrative adoption path for an enterprise manufacturing or logistics operator evaluating GEN-1.
    data:
      nodes:
        - id: stage-discovery
          label: Discovery
          actor: Operations / automation lead
          description: >
            Discovers Generalist AI via investor press coverage, NVIDIA GTC demo reports, industry trade press (Robot
            Report, SiliconAngle), or peer referral from within the embodied AI ecosystem. No self-serve trial or demo
            environment available; initial contact via partnerships@generalistai.com.
          channels:
            - Industry trade press
            - NVIDIA ecosystem events
            - Investor announcements
            - Peer referral
        - id: stage-evaluation
          label: Technical Evaluation
          actor: Robotics engineer / automation architect
          description: >
            Technical feasibility evaluation: assessing GEN-1 compatibility with existing robot hardware (6DoF, 7DoF, or
            mobile platform), data collection requirements (1-hour robot-specific dataset), safety qualification needs,
            and integration with existing ERP / WMS systems. No public API documentation, SDK, or technical reference
            architecture available to self-evaluate.
          channels:
            - Direct engagement with Generalist team
            - NVIDIA GTC demo evidence
            - Published GEN-1 benchmark blog
        - id: stage-pilot
          label: Early-Access Pilot
          actor: Operations team + Generalist AI applied team
          description: >
            Selected industry partners gain access to GEN-1 under early-access program (launched April 2, 2026). Pilot
            involves deploying GEN-1 on partner-owned hardware with 1-hour robot-specific fine-tuning data collection.
            Outcome metrics, SLAs, pricing, and support terms are not publicly disclosed.
          channels:
            - Early-access partner program (April 2026)
            - Co-located data collection
        - id: stage-production
          label: Production Deployment
          actor: Enterprise operations (robot fleet)
          description: >
            No confirmed production deployments as of June 30, 2026. Commercial threshold for production requires
            independently validated reliability (>99% for economic tasks), safety certification (ISO 10218 / TS 15066),
            and integration with operational systems. These requirements have not been publicly confirmed as met.
          channels:
            - Direct commercial agreement
            - OEM embedded deployment
        - id: stage-expansion
          label: Expansion / Upsell
          actor: Enterprise fleet operations
          description: >
            Data flywheel model creates expansion incentive: more deployed robots → more task data → better model for
            all customers including the deploying partner. Potential expansion to new robot form factors, task types, or
            facility sites. No expansion metrics or upsell evidence available.
          channels:
            - Cross-form-factor expansion
            - New facility rollout
            - Task library expansion
    claimRefs:
      - CU001
      - CU012
      - CU013
