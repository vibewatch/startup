      - number: '5.2'
        title: Training Data Engine and Physical Interaction Dataset
        blocks:
          - type: paragraph
            body: >
              Generalist AI's central technical differentiator is its proprietary physical interaction dataset and the
              data engine that produces it. The dataset is built using wrist-mounted or handheld ergonomic wearable
              devices the company calls "data hands"—lightweight devices that capture human manipulation data with
              near-natural force feedback. Unlike teleoperation rigs used by competitors such as Physical Intelligence,
              data hands preserve the natural sensorimotor loop: after a brief acclimation period, human operators stop
              "thinking" and start reacting, producing trajectories that capture reflexes, micro-corrections, and
              real-time error recovery rather than stilted, deliberate motions.

              The pretraining dataset for GEN-1 contains no robot data: it is entirely composed of human manipulation
              captured through data hands devices. This design decision is deliberate—the company argues that removing
              robot data from pretraining creates a more generalizable sensorimotor prior, and that the 1-hour
              fine-tuning step on robot-specific data simultaneously adapts the model to the robot's embodiment and to
              the target task for the first time.

              The dataset reached 270,000 hours of real-world physical interaction at the GEN-0 release (November 2025)
              and grew to over 500,000 hours at the GEN-1 release (April 2026). Growth continues at more than 10,000
              hours per week. Collection takes place across thousands of homes, warehouses, workplaces, and specialized
              environments worldwide, including bakeries, laundromats, and factories. A global network of hardware and
              thousands of data collection devices powers operations. Data foundry partners contribute data classified
              into Class 1 (specific tasks), Class 2 (mixed), and Class 3 (do-anything) modes, enabling the company to
              A/B test which data mixtures improve pretraining the most. Processing infrastructure includes O(10K) cores
              for continual multimodal data processing, multi-cloud contracts, custom upload machines with dedicated
              internet lines, and techniques capable of absorbing 6.85 years of manipulation experience per day of
              training.
