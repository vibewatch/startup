  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: Track with conditional entry discipline — relative value exists, commercial proof does not'
        blocks:
          - type: paragraph
            body: >
              Generalist AI's $2 billion post-money valuation is low relative to direct software peers in the physical
              AI category. Physical Intelligence was in talks for an $11 billion raise in March 2026, and Skild AI had
              already closed at $14 billion in January 2026 while reporting approximately $30M in annual recurring
              revenue — making Generalist AI look underpriced relative to the private market on a pure optionality
              basis. The investor lineup strengthens the case: Radical Ventures (lead), NVIDIA NVentures, Bezos
              Expeditions, 8VC, Union Square Ventures, and angel investors including Fei-Fei Li and Eric Yuan represent
              an unusually strong signal of frontier AI community conviction for a company of this age.

              However, the pricing case is fully pre-commercial. Generalist AI has not disclosed any revenue, ARR,
              customer count, pricing, gross margin, or unit economics. The early-access program for GEN-1 launched
              April 2026, but no named partner has been confirmed. The 8VC memo's reference to "remarkable early
              commercial traction" is the strongest public signal, but it is unquantified and comes from an invested
              party. This is not enough to anchor a valuation at $2B without private diligence.

              The recommendation is track. An investor who can access private diligence — confirming at least one
              verifiable, revenue-generating deployment — should re-evaluate the call toward conditional buy, provided
              entry price and cap-table terms are confirmed. Without that confirmation, the $2B mark is best treated as
              a real option on a technology thesis: valuable enough to monitor closely, not yet supported enough to
              underwrite at full size.
