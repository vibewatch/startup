      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: Track — not buy'
            body: >
              $2B is competitively cheap relative to peers, but pre-revenue status means there is no revenue anchor.
              Upgrade to conditional buy only after private diligence confirms at least one verifiable,
              revenue-generating deployment.
            calloutType: recommendation
            claimRefs:
              - CV001
