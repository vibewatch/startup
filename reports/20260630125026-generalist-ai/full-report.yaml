chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Business Model
        blocks:
          - type: paragraph
            body: >
              Generalist AI, Inc., operating under the brand name "Generalist," is an American artificial intelligence
              company incorporated in 2024 and headquartered in San Mateo, California, with a second office in
              Somerville (Boston), Massachusetts. The company describes itself as "a frontier AI research and product
              driven company building general intelligence for the physical world." Its stated mission is to make
              general-purpose robots a reality by developing embodied foundation models—AI systems that perceive,
              reason, and act across diverse physical environments and robot form factors, rather than being constrained
              to a single task or hardware platform.

              Unlike traditional robotics companies, Generalist AI is explicitly not a hardware manufacturer. Its
              commercial proposition is to serve as the intelligence layer—the "cognitive brain"—that works across any
              robotic body, from 6-degree-of-freedom industrial arms to semi-humanoid systems. The company's current
              commercial strategy centers on an early-access program for GEN-1 with selected industry partners, with a
              stated data-flywheel objective: real-world deployments generate new training data that feeds successive
              model generations. The company has not publicly disclosed pricing, named customers, or annual recurring
              revenue.

              Generalist AI's long-term ambition, stated in multiple official communications, is "physical AGI"—
              general-purpose robotic intelligence capable of mastering any physical task. The company frames its
              technical roadmap explicitly in analogy to the scaling trajectory of large language models, arguing that
              the same data-and-compute scaling dynamics that produced GPT-3 and ChatGPT will, when applied to physical
              interaction data, produce robots that can generalize across the full range of human physical work.
