      - number: '2.5'
        title: Sizing Gaps, Contradictory Evidence, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The market analysis for embodied AI software carries three categories of material evidence gaps that
              investors and diligence teams should treat as unresolved.

              First, market boundary inconsistency is structural. The three primary sizing lenses— "AI in robotics" at
              $20.4 billion (GVR), "AI robotics software" at $14.18 billion (IMR), and "embodied AI" at $6.5 billion
              (GVR)—differ not just in scale but in scope definition, geographic coverage, and methodology. These are
              not narrower-to-broader cuts of the same market; they are different analysts applying different boundary
              rules to overlapping phenomena. No single published figure represents the revenue pool that directly
              accrues to a software-only embodied foundation model provider.

              Second, no SAM/SOM exists for the cross-embodiment foundation model segment specifically. The sub-market
              of "licensing a foundation model to run across diverse third-party robot hardware for dexterous
              manipulation" is not tracked as a discrete category by IFR, Mordor, GVR, or any other publicly available
              source. The closest proxy (embodied AI software at $6.5B in 2026) includes hardware-adjacent components.
              Any SAM derivation from these figures requires multiple untested assumptions about software revenue share
              and addressable robot categories.

              Third, competitive funding intensity provides a market signal for valuation without providing revenue
              clarity. Physical Intelligence (pi.ai) raised $400 million in 2024 at a $2.4 billion valuation and was
              reportedly in discussions for a $1 billion follow-on round in 2026. The global Embodied AI funding
              pipeline is projected to exceed $20 billion in 2026 according to QubitTool analysis. This capital
              deployment validates the market thesis but does not resolve sizing or timing uncertainty.
            claimRefs:
              - CM044
              - CM045
              - CM046
              - CM019
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Software Revenue Capture Is the Central Valuation Bet
            body: >
              The industrial robotics hardware market ($54.28B in 2026) is 8x larger than the AI robotics software
              market ($14.18B) but growing at less than half the rate (11.7% vs 15.3% CAGR). History from enterprise
              software suggests that the intelligence layer eventually captures disproportionate margin relative to
              hardware. Generalist AI's bet is that the foundation model becomes the margin-rich OS of physical
              intelligence—similar to how iOS/Android marginalized handset hardware margins. Whether this analogy holds
              depends on how long hardware OEMs can resist commoditization and whether switching costs in foundation
              models reach software-moat levels.
            calloutType: insight
            claimRefs:
              - CM007
              - CM010
              - CM017
          - type: callout
            title: Boundary Disagreement Makes TAM Claims Unverifiable
            body: >
              The gap between the three primary sizing lenses—$6.5B (GVR embodied AI), $14.18B (IMR AI robotics
              software), and $20.4B (GVR AI in robotics)—is not a rounding difference; it reflects fundamentally
              different scope assumptions. At a $2 billion valuation, Generalist AI is priced at approximately 15x the
              narrowest directly comparable market ($6.5B) or roughly 1.5x if you accept the broadest boundary. The
              investment thesis requires accepting a boundary definition that includes the full AI software stack for
              all robot form factors— a definition that no current commercial deployment has validated.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
