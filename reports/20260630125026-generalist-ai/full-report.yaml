              The March 2026 GTC live demo validated the company's most operationally important claim: GEN-0 (and by
              extension GEN-1) can generalize to a brand-new robot type—one that had never been in the company's
              lab—within a handful of days, using only data from existing offices and zero data from the demo venue.
              This is a difficult-to-fake proof point for hardware-agnostic deployment. Combined with GEN-1's 1-hour
