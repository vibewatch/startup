          - type: callout
            title: The adverse case is closer to public evidence than the bull case
            body: >
              AIRoboticDaily documents ~95% of humanoid robot revenue in research/showroom use. Brad Porter argues for
              production-tested physical AI. NVIDIA GR00T is free. None of these risks require catastrophic failure —
              only that commercialization is slower than the bull narrative.
            calloutType: risk
            claimRefs:
              - CV024
              - CV026
              - CV027
              - CV034
          - type: callout
            title: The $2B option on team and data is real
            body: >
              Florence, Zeng, and Barry have produced two of the most-cited foundational robotics papers (RT-2, Code as
              Policies). The 500,000-hour proprietary dataset is structurally hard to replicate. At $2B vs. $11–14B
              peers, there is genuine relative value if the thesis holds.
            calloutType: strength
            claimRefs:
              - CV042
              - CV043
              - CV011
              - CV012
          - type: callout
            title: The $2B thesis assumes physical AI scales like language AI
            body: >
              The entire bull scenario rests on the hypothesis that more data and compute produce predictably more
              capable embodied models — the same scaling dynamics that powered ChatGPT. This is unproven for physical
              tasks. Yann LeCun and others challenge whether the data needed is genuinely scalable.
            calloutType: assumption
            claimRefs:
