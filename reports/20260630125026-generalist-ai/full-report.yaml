      - number: '4.3'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >
              Generalist AI's cost structure has three dominant dimensions: (1) frontier model training compute, (2)
              physical data engine operations, and (3) research and engineering talent. The company rebuilt its
              distributed training infrastructure for GEN-1 to "support petabytes of physical interaction data as a
              first-class citizen"—language that implies significant ML infrastructure capex and ongoing cloud or
              owned-cluster spend. Industry benchmarks suggest a single frontier robotics foundation model training run
              at 10B+ parameters on 500,000 hours of video-and-action data could cost $10M–$100M in compute alone; with
              successive model generations planned, training amortization is a material recurring cost category.

              Data engine operations—running the wearable "data hands" devices globally at a rate of 10,000+ hours per
              week—require an ongoing labor and device logistics cost that is structural rather than one-time. Unlike
              text scraping, physical interaction data requires human operators, on-site lab managers, device
              maintenance, and data labeling infrastructure. NVIDIA NVentures' presence as a strategic reinvesting
              investor signals both GPU dependence and possibly preferential hardware supply considerations, but no
              compute pricing advantage has been publicly confirmed.

              With approximately 70 employees drawn predominantly from Google DeepMind, OpenAI, and Boston Dynamics,
              average total compensation is likely well above the industry median, consistent with frontier AI research
              talent economics. Industry estimates place the monthly burn rate for comparable embodied AI startups
              (50–100 employees with intensive compute) at $5M–$15M per month. This is an estimate only—the actual
              figure has not been disclosed. At $10M per month burn (midpoint), the $400M fresh raise implies
              approximately 40 months of runway from June 2026, or roughly through late 2029, before adjusting for any
              revenue offset.
