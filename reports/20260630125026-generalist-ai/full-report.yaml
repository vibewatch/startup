      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The robotic automation market is being pulled forward by five structural forces that are likely to sustain
              above-GDP growth for AI robotics software specifically.

              Labor scarcity is the primary demand signal. The IFR documented 420,000 open skilled-trade positions in
              German factories in 2025 and a projected 2.1 million manufacturing worker deficit in the United States by
              2030. Federal tax credits worth 30% of qualified automation spend in US designated zones and South Korea's
              doubling of small-manufacturer subsidies in 2025 directly shorten automation payback periods. China's Made
              in China 2025 program allocated CNY 180 billion (approximately $25.2 billion) to robotics through 2026.
              Reshoring investment adds a demand layer: $47 billion in US factory investments was announced in
              2024-2026, most of which cites robotics as a prerequisite for cost-competitive domestic production.

              The robotics payback period has compressed. Median payback for industrial robots is now approximately 1.3
              years (16 months), with cobots as short as 6-18 months. This ROI compression is driven partly by hardware
              cost deflation (cobot entry price ~$10,000) and partly by AI-powered flexibility—GEN-1's 1-hour new-task
              adaptation vs. weeks for traditional programming makes marginal task automation economically viable for
              the first time.

              Adoption constraints are substantial and not fully resolved. Capital intensity at the frontier is extreme:
              developing a competitive humanoid robot platform required an estimated $3-4 billion in Tesla Optimus R&D
              (2022-2024), and Figure AI reportedly burns $200-300 million annually. The "chopstick problem"—fine motor
              manipulation tasks requiring integrated tactile and force feedback—remains unsolved for most commercial
              systems. Physical data scarcity constrains foundation model scale-up: unlike text-based AI, physical
              manipulation data must be collected through robot or wearable interaction and cannot be scraped from the
              internet. The integration challenge is material: legacy factory PLCs, MES systems, and ERP platforms
              create $40,000-80,000 in typical installation overhead per cell. Safety and liability frameworks are
              actively evolving (ISO 9283, ISO/TS 15066) but no AI-specific embodied AI liability regulation has been
              enacted in any major jurisdiction as of June 2026. Edge compute is a hardware bottleneck: VLA models
              require specialized on-device inference hardware because datacenter-scale compute introduces unacceptable
              latency for real-time robotic control.
