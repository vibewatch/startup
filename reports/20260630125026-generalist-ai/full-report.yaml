  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >
      The track recommendation flows from strong team and data signals converging on stretched valuation and zero
      commercial proof — with NVIDIA commoditization risk as the key swing factor.
    data:
      nodes:
        - id: team
          label: Team pedigree
          detail: >
            Pete Florence (DeepMind, PaLM-E/RT-2), Andy Zeng (Code as Policies), Andrew Barry (Boston Dynamics). 8VC:
            "as much a builder as a researcher."
          tone: positive
        - id: data
          label: Data-engine moat
          detail: >
            500,000+ hours of proprietary physical interaction data; 10,000+ hours per week; no robot data in
            pretraining — structurally hard to replicate.
          tone: positive
        - id: market
          label: Market signal
          detail: |
            Embodied AI TAM $6.5B in 2026 growing at 39.7% CAGR; $40.7B raised in robotics in 2025.
          tone: positive
        - id: revenue
          label: Commercial proof gap
          detail: >
            Zero disclosed revenue. Early-access partners unnamed. No ARR, no customer count, no pricing disclosed as of
            June 30, 2026.
          tone: warning
        - id: comps
          label: Peer relative value
          detail: >
            $2B vs. Physical Intelligence $5.6–11B and Skild AI $14B; lowest in software-pure peer set, but PI and Skild
            have more capital and (Skild) some revenue.
          tone: warning
        - id: nvidia
          label: NVIDIA commoditization risk
          detail: >
            NVIDIA GR00T N-series provides free open-source model weights. If expanded to enterprise, the proprietary
            model premium compresses materially.
          tone: warning
        - id: decision
          label: Track — conditional entry
          detail: >
            Stay engaged. Require private confirmation of at least one revenue-generating deployment before buying at
            the $2B mark.
          tone: neutral
      edges:
        - from: team
          to: decision
        - from: data
          to: decision
        - from: market
          to: decision
        - from: revenue
          to: decision
        - from: comps
          to: decision
        - from: nvidia
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV034
      - CV042
      - CV043
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >
      At $2B with no revenue, forward revenue multiples imply a wide range of ARR targets — all unverified. The
      sensitivity shows how much must go right before a $2B entry looks justified.
    data:
      items:
        - label: ARR needed at 40x multiple
          value: 50
          detail: $50M ARR at a frontier-AI scarcity premium (40x) would justify $2B entry.
          tone: positive
        - label: ARR needed at 20x multiple
          value: 100
          detail: $100M ARR at a high-growth SaaS premium (20x) would justify $2B entry.
          tone: warning
        - label: ARR needed at 10x multiple
          value: 200
          detail: >-
            $200M ARR at a mature platform multiple (10x) — comparable to Covariant at $30M revenue / $400M valuation
            benchmarks.
          tone: negative
        - label: Current confirmed ARR
          value: 0
          detail: Generalist AI has disclosed zero ARR. The bar starts at nil.
          tone: negative
    approximationNotes: >
      Revenue thresholds are simple EV/revenue bridges at the $2B entry mark. They are not DCF outputs. Multiple
      selection reflects the range seen in private AI software comps (Finro Q1 2026; Finerva Q4 2025).
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >
      Bull, base, and bear exit ranges for Generalist AI from a $2B entry, reflecting the wide uncertainty from
      pre-revenue stage to potential acquisition or IPO.
    data:
      items:
        - label: Bear case
          low: 300
          mid: 500
          high: 700
          displayValue: $0.3B–$0.7B exit
          detail: >
            No commercial revenue by 2028; down-round or acqui-hire. Near-total loss on $2B entry before preference
            waterfall.
          tone: negative
        - label: Base case
          low: 300
          mid: 500
          high: 750
          displayValue: $300M–$750M acquisition
          detail: >
            $20–50M ARR by 2028; strategic acquisition at 10–15x ARR. Modest positive-to-flat return on $2B entry after
            dilution from further fundraising rounds.
          tone: warning
        - label: Bull case
          low: 7500
          mid: 12000
          high: 20000
          displayValue: $7.5B–$20B acquisition
          detail: >
            $500M–$1B ARR by 2030; acquisition by NVIDIA/Amazon/Google at 10–20x ARR. 3.75–10x return on $2B entry
            before dilution.
          tone: positive
    approximationNotes: >
      Exit ranges are scenario-based estimates grounded in peer comps and analogous deep-tech AI M&A transactions. They
      are not management guidance or DCF outputs. Dilution from additional funding rounds (likely 1–2) will reduce
      effective investor returns.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV035
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >
      Generalist AI scores high on team and data moat but low on commercial proof and valuation support — a classic
      pre-revenue deep-tech AI profile.
    data:
      items:
        - label: Market opportunity
          score: 8
          detail: >
            Embodied AI TAM $6.5B (2026) at 39.7% CAGR; $40.7B raised in robotics in 2025. Market timing and structure
            are clearly favorable.
          tone: positive
        - label: Team pedigree
          score: 9
          detail: >
            Pete Florence, Andy Zeng, Andrew Barry have among the highest citation counts in embodied AI. 8VC, Radical
            Ventures, Fei-Fei Li, NVIDIA all signal frontier conviction.
          tone: positive
        - label: Data / IP moat
          score: 7
          detail: >
            500,000+ hours proprietary dataset; hardware-agnostic architecture; data engine at 10,000+ hours/week.
            Strong structural moat if the scaling thesis holds.
          tone: positive
        - label: Commercial proof
          score: 1
          detail: >
            No revenue, no named customers, no pricing confirmed as of June 30 2026. Early-access program is the only
            public signal; partners unnamed.
          tone: negative
        - label: Competitive positioning
          score: 5
          detail: >
            Hardware-agnostic is the right strategic bet, but NVIDIA GR00T and Skild AI's Zebra acquisition give
            competitors real advantages in 2026.
          tone: neutral
        - label: Valuation support
          score: 3
          detail: >
            $2B is low vs peers but unanchored to revenue. Forward multiple analysis places the entry price at a
            significant premium to any conventional revenue anchor.
          tone: warning
        - label: Evidence quality
          score: 3
          detail: >
            Public evidence set is directionally strong on team and technology but completely absent on commercial
            execution. Near-zero financial disclosure.
          tone: warning
    approximationNotes: Scores are 0-10 ordinal judgments for IC discussion; not mathematical aggregates.
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV015
      - CV034
      - CV043
      - CV045
      - CV046
