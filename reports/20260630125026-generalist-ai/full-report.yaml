      - number: '8.4'
        title: 'Exit readiness and final diligence: M&A optionality is real in 3–5 years; standalone IPO is 5+ years away'
        blocks:
          - type: paragraph
            body: >
              Generalist AI is not IPO-ready in any conventional sense. As a pre-revenue private company with no
              disclosed financial metrics, no audited statements, and no track record of disclosed deployments, the
              company lacks the disclosure foundation needed for a public offering. Figure AI ($39B) and Boston Dynamics
              (targeting an $85–103B IPO) are the closest sector analogues to watch, but both have far greater
              operational history, documented deployments, and higher revenue visibility. A credible standalone
              Generalist AI IPO is at minimum five years away from the June 2026 runDate.

              Strategic M&A is a more credible exit path in the 3–5 year window. NVIDIA — a strategic reinvestor in the
              current round through NVentures — has the most direct rationale: acquiring Generalist AI's model and
              dataset would add a hardware-agnostic AI intelligence layer that complements NVIDIA's GR00T compute stack
              and Isaac Sim platform. Amazon Robotics (whose leadership includes former Covariant founders who share
              Generalist AI's cross-embodiment thesis) represents another plausible buyer. Google DeepMind has the
              deepest technical overlap through shared research lineage, but internal competition risk makes an
              acquisition structurally harder.

              The key near-term diligence asks are: (1) verification of at least one revenue-generating commercial
              deployment with confirmed ARR; (2) cap-table and liquidation preference structure to understand effective
              entry economics beyond the headline $2B mark; (3) model performance independent validation by a third
              party beyond GEN-1's company-reported 99% success rate; (4) board composition confirmation, especially
              whether Radical Ventures holds a formal board seat; and (5) burn rate and runway trajectory given the
              $400M raise at an unconfirmed cost structure.
