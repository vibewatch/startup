            body: >
              Generalist AI is a private company and has not disclosed any revenue, ARR, customer count, gross margin,
              or unit-level financial metrics. The company's public disclosure profile is limited to (a) funding round
              announcements with post-money valuation, (b) model release blog posts, and (c) hiring activity on Ashby
              and the company careers page. No investor relations materials, audited financials, or
              secondary-transaction data are publicly available.

              The only indirect traction signals available are qualitative: 8VC's phrase "early commercial traction,"
              the company's own reference to a data flywheel "beginning to take shape" with real businesses, and the
              Robot Report's citation that "early-access partners can now gain access to the model" as of April 2026.
              None of these constitute confirmed revenue.

              The gap between available public information and the data needed for financial underwriting is
              substantial. Revenue, ARR, gross margin, churn, customer concentration, and burn rate are all
              private-evidence-only metrics that would require direct management disclosure or audited financial records
              to resolve. Until these gaps are closed, any financial model of Generalist AI rests on assumptions about
              business model analogs (Physical Intelligence, other embodied AI SaaS companies) rather than actual
              disclosed data.
