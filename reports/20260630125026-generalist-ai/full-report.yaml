  - id: FM004
    title: Adoption Funnel or Value-Chain Map
    type: flow
    layout: wide
    summary: >
      Purchase and deployment steps for an AI robotics software platform in the manufacturing or logistics buyer
      journey, from initial awareness to production scale-up.
    data:
      nodes:
        - id: awareness
          label: Awareness & Initial Evaluation
          detail: >-
            Buyer identifies labor/productivity problem; surveys available AI robotics software vendors; IFR, trade
            press, or integrator referral.
          tone: neutral
        - id: pilot
          label: Proof-of-Concept / Limited Pilot
          detail: >-
            Controlled task pilot (typically 1–3 robot cells); evaluation of task success rate, setup time, and
            integration effort. GEN-1 target: ~1hr new-task adaptation.
          tone: positive
        - id: integration
          label: System Integration & Certification
          detail: >-
            PLC/MES/ERP connectivity; safety certification (ISO 9283, ISO/TS 15066); $40K–$80K integrator cost per cell;
            3–12 month timeline.
          tone: warning
        - id: business-case
          label: ROI Validation & Budget Approval
          detail: >-
            Documented payback calculation; typically 1.3-year median for industrial robots; approval from
            plant/operations capital committee.
          tone: neutral
        - id: production
          label: Production Deployment
          detail: >-
            Fleet deployment; over-the-air model updates; ongoing monitoring of success rate, throughput, and anomaly
            rates.
          tone: positive
        - id: expansion
          label: Fleet Expansion & Data Flywheel
          detail: >-
            Additional cells, tasks, and locations; deployment data feeds back to provider for model improvement;
            recurring subscription revenue activated.
          tone: positive
      edges:
        - from: awareness
