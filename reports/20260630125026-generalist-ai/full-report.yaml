          - type: callout
            title: Adoption Funnel Has a Multi-Step Integration Tax
            body: >
              The buyer journey from pilot to production runs through a mandatory integration checkpoint that costs
              $40,000-80,000 per cell and typically takes 3-12 months. This integration tax is structural—it exists
              because every production factory runs certified PLCs, MES systems, and safety protocols that require
              third-party validation. Until Generalist AI has a verified integration pathway for the top 5 manufacturing
              automation platforms (Siemens TIA Portal, Rockwell FactoryTalk, Beckhoff TwinCAT, ABB Ability, Fanuc
              FOCAS), the commercial path from demo success to production deployment remains an unconfirmed assumption.
