  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Taxonomy
        blocks:
          - type: paragraph
            body: >
              Generalist AI is positioned as a software-only provider of embodied foundation models—the "cognitive
              intelligence layer" that runs on top of robotic hardware supplied by third parties. This positioning
              defines the market boundary precisely: the addressable spend is AI model licensing, cloud and edge
              inference, fine-tuning services, and software subscriptions tied to physical robotic deployment—not the
              robot hardware bodies, sensors, actuators, grippers, or the traditional automation capital equipment that
              surrounds them.

              Included spend encompasses API/cloud inference fees, foundation model licensing, platform subscription
              revenue, and downstream fine-tuning services for specific robot form factors or tasks. Adjacent markets
              that overlap but are not entirely in scope include robot simulation platforms (NVIDIA Isaac Sim, Mujoco),
              warehouse management software (WMS) when it integrates AI-driven robotic orchestration, robot-as-a-service
              (RaaS) delivery platforms, and robot middleware (ROS/ROS2 industrial distributions valued at approximately
              $0.8 billion in 2026). Excluded are the hardware subsystems themselves—robot arms (6-DOF, 7-DOF,
              humanoid), sensors, cameras, end-effectors, and pneumatic systems—along with industrial PLCs, NC control
              software, and traditional task-specific robot programming (e.g., ABB RAPID, KUKA KRL scripts).

              Status-quo substitutes that Generalist AI must displace include: (1) task-specific ROS/ROS2 programming
              and motion-planning libraries, which require months of custom engineering per task; (2) vendor-specific
              embedded AI stacks from robot OEMs such as NVIDIA Isaac, ABB Omnicore, Yaskawa DX200 AI, and Fanuc AI
              software suites; (3) traditional teach-pendant programming for structured pick-and-place; and (4) human
              labor at the long tail of unstructured tasks. The value proposition for displacing these substitutes is
              that a foundation model approach enables rapid new-task adaptation (approximately one hour of
              task-specific data for GEN-1 versus weeks or months for bespoke programming) and cross-embodiment
              portability that eliminates the need to re-engineer per robot platform.

              The IFR identified AI and autonomy in robotics as the single most significant 2026 industry trend, noting
              that the shift from rule-based automation toward intelligent, self-evolving systems is "making embodied AI
              mainstream" in both manufacturing and services. This positions Generalist AI's technology category as a
              structural industry inflection rather than a niche subsegment.
