  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Market
        blocks:
          - type: paragraph
            body: >
              Generalist AI's stated commercial target is any enterprise that operates physical robots for repetitive,
              dexterous tasks. The company does not manufacture hardware; its value proposition is the intelligence
              layer that works across robot form factors. The buyer in this model is either a robot hardware OEM (who
              licenses the model to embed in their platform) or an enterprise operator (who integrates GEN-1 with
              existing hardware). The payer is the enterprise or OEM licensee; the user is the factory, warehouse, or
              logistics operator deploying the robot.

              Industries explicitly named in official Generalist AI communications as target verticals include apparel,
              manufacturing, logistics, automotive, and electronics. These are precisely the sectors where simple,
              repetitive dexterous tasks—folding garments, kitting auto parts, packing boxes, assembling electronics—are
              common, labor-intensive, and increasingly automated. The GEN-1 blog and the June 2026 $400M funding
              announcement both describe "real businesses" generating training data in these environments, implying some
              early contractual relationships in these segments.

              A second distinct customer category is the data foundry partner: businesses or operators who deploy the
              "data hands" wearable collection devices and contribute manipulation data to Generalist AI's pretraining
              dataset. These partners may be compensated through a data-sharing arrangement rather than a traditional
              SaaS fee, and their participation does not necessarily imply they are deploying GEN-1 in production. The
              distinction between data-contributing partners and paying GEN-1 deployment customers is material and has
              not been clarified publicly.

              A third category—hardware OEM or platform partnership—is evidenced by Universal Robots' collaboration at
              NVIDIA GTC 2026. UR invited Generalist AI to demo GEN-0 on their new mobile manipulation platform, a
              relationship that signals commercial interest from the world's largest cobot manufacturer by volume, but
              does not confirm a commercial licensing or deployment agreement.

              Geographically, available evidence suggests the data collection network spans "thousands of homes,
              warehouses, workplaces, and specialized environments worldwide," but GEN-1 sales targeting appears focused
              on North American and European industrial operators, consistent with the company's San Mateo and
              Somerville presence. No specific named accounts, contract structures, or customer counts have been
              disclosed in any jurisdiction.
