      - number: '4.2'
        title: GTM Motion and Commercial Traction Signals
        blocks:
          - type: paragraph
            body: >
              Generalist AI's go-to-market motion, as inferrable from job listings and investor commentary, is a
              high-touch enterprise motion in the early phases: a single "Applied AI & Partnerships" role is the only
              outward-facing commercial position open as of June 2026, suggesting a lean commercial team relative to the
              research headcount. This is consistent with a seed-stage GTM pattern common to deep-tech AI labs: the
              founding team leads key relationships, early customers are strategic partners rather than volume accounts,
              and deal cycles are long and often tied to joint data collection or integration projects.

              The 8VC investment memo describes "remarkable early commercial traction" as a signal that drove their
              investment conviction, and Spark Capital's Fraser Kelton cited early commercial validation in robotics
              scaling. Neither investor confirmed customer names or revenue metrics. The company's June 2026 blog
              explicitly describes a data flywheel as having begun—real businesses generate task data for the next model
              generation—which implies revenue-generating or data-sharing contractual relationships exist at some scale.
              The absence of named customers is consistent with confidentiality requirements in enterprise robotics
              deployments (factory-floor automation projects are typically disclosed later, if at all), but also
              consistent with pre-commercial status.

              Sales cycle proxies for embodied foundation model platforms are long: a typical industrial automation
              qualification cycle runs six to eighteen months, including hardware compatibility validation, safety
              qualification, and production trial. Customer acquisition cost for such cycles is structurally high
              relative to initial contract value, making the payback period a critical but unverifiable metric. No CAC,
              LTV, or payback estimates are publicly disclosed.
            claimRefs:
              - CI006
              - CI024
              - CI025
              - CI026
              - CI028
