      - number: '7.5'
        title: Key-person concentration and governance opacity amplify all other risk dimensions
        blocks:
          - type: paragraph
            body: >
              All three co-founders—Pete Florence (CEO), Andy Zeng (Chief Scientist), and Andrew Barry (CTO)—are
              publicly active, but the company's scientific identity and commercial narrative are concentrated in
              Florence and Zeng to an unusual degree. Every major press article, investor memo, and product announcement
              either quotes Florence, cites Zeng's research lineage, or both. 8VC's investment note explicitly describes
              Florence as "as much a builder as a researcher— magnetic and unusually commercial for someone of his
              research caliber," confirming that investor conviction is substantially a bet on the founding team rather
              than an independent institutional capability. This is appropriate for a two-year-old company—but it means
              that a co-founder departure, health event, or interpersonal conflict at the top would not only affect
              operations but would directly damage fundraising prospects, customer confidence, and team stability.

              The governance structure adds opacity: no board composition, no independent director names, no audit
              committee, and no governance charter have been publicly disclosed. The June 2026 Series B announcement
              does not name a lead investor representative taking a board seat, despite 8VC's investment memo and the
              scale of capital deployed. The angel investor roster—Eric Yuan, Bin Lin, Fei-Fei Li, Naval Ravikant—is
              prestigious but not operationally protective. No equity schedule, cliff, or retention terms are publicly
              visible, leaving the probability of co-founder lock-in unverifiable from public sources.

              Talent retention risk extends below the founding level: the broader team draws from Google DeepMind,
              OpenAI, and Boston Dynamics—the same organizations that compete most actively for embodied AI researchers.
              In 2026, DeepMind's Gemini Robotics 1.5, Physical Intelligence's expanded team, and Figure AI all offer
              competitive compensation and prestigious research environments. At 70 employees, Generalist AI has no deep
              bench below the founders. A single departure in the model-architecture team or the data engine team could
              delay GEN-2 by quarters without easy replacement. The company's job listings reflect awareness of this:
              open roles span research, ML infrastructure, compute optimization, robotics control, and applied
              partnerships, suggesting the team is still building critical redundancy. None of the risk areas in this
              chapter—regulatory, model safety, compute, capital—can be managed without stable senior leadership, making
              key-person concentration a risk multiplier rather than an isolated dimension.
