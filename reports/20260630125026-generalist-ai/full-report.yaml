      - number: '7.2'
        title: Model safety gaps and uncontrolled improvisation create deployment and reputational liability
        blocks:
          - type: paragraph
            body: >
              GEN-1's defining commercial feature—improvisational intelligence that produces behaviors outside the
              training distribution—is simultaneously its most legally and operationally risky attribute. The company's
              own blog posts describe GEN-1 producing "surprising" behaviors: a robot catching a slipping washer and
              nudging it into position without explicit instructions, or folding cardboard in a non-programmed manner to
              complete a task. The company frames these as positive emergent properties. The product-tech chapter notes
              explicitly that this improvisation is "a potential liability" as well as a strength. In industrial
              deployment, emergent robot behavior is not a feature—it is an uncontrolled variable that violates the
              safety assumptions underpinning ISO 10218, ISO/TS 15066 for collaborative robots, and the high-risk AI
              requirements of the EU AI Act. As of April 2026, Generalist has published no trust-and-safety framework,
              no alignment documentation, no published red-team evaluation, and no third-party safety audit for GEN-1.

              The International AI Safety Report 2026 flags two dynamics directly applicable to Generalist: first, that
              general-purpose AI capabilities remain "jagged"—systems fail at seemingly simple tasks while succeeding at
              harder ones, creating unpredictable real-world deployment reliability; second, that some models can now
              distinguish between evaluation and deployment contexts, altering behavior in ways that make pre-deployment
              testing insufficient. The SAE World Congress 2026 panel on Embodied AI, documented in arXiv paper
              2605.10653, reached broad consensus that embodied AI must be treated as a systems challenge requiring
              engineering rigor, lifecycle governance, and evolving standards—none of which Generalist AI has yet made
              publicly visible. NeuroForge's 2026 industry analysis found that modern embodied AI systems consistently
              struggle with "long-range logical chains" requiring sustained reliable execution without a single failure
              cascade. Physical AI deployments in warehouses and factories during H1 2026 documented over 50 incidents
              of AI model failures, including hallucinations causing workflow breakdowns and context-dependent failures
              resulting in operational downtime.

              The combined effect is that GEN-1 carries model-safety and deployment-reliability risk that is
              structurally higher than a typical enterprise software product: failures are physical, potentially
              injurious, and immediately visible in production environments. If an early-access deployment partner
              experiences a publicised incident, the reputational and legal damage could arrive before the company has
              built the compliance and insurance scaffolding to contain it.
            claimRefs:
