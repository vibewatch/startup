      - number: '1.4'
        title: Funding History and Investor Landscape
        blocks:
          - type: paragraph
            body: >
              Generalist AI has raised capital in two disclosed rounds since its 2024 founding. The first round, closed
              in March 2025, totaled approximately $140 million at a post-money valuation of $440 million. Investors in
              that round included Spark Capital, NVIDIA's NVentures, Bezos Expeditions (Jeff Bezos), and Boldstart
              Ventures. A second round of $400 million was announced June 4, 2026, at a $2 billion post-money valuation,
              bringing total disclosed capital raised to more than $500 million.

              The June 2026 round was led by Radical Ventures, with new institutional participants 8VC, Union Square
              Ventures, Hanabi Capital, and Norwest. All major existing investors—NVIDIA NVentures, Boldstart Ventures,
              Spark Capital, Bezos Expeditions, and NFDG—participated significantly. Notable angel investors in the 2026
              round include Fei-Fei Li (Stanford AI Lab co-director and World Labs founder), Bin Lin (Xiaomi
              co-founder), Eric Yuan (Zoom CEO), and Naval Ravikant.

              NVIDIA's continued participation reflects a strategic interest: Generalist AI's models depend on GPU
              compute infrastructure, and any large-scale deployment of embodied foundation models would represent
              significant NVIDIA hardware demand. The presence of technologist angels like Fei-Fei Li and Naval Ravikant
              signals credibility within the broader AI research community.

              Revenue, ARR, customer count, and secondary transaction terms are not publicly disclosed. The company has
              not announced plans for an IPO. No debt or credit facilities have been publicly disclosed.
