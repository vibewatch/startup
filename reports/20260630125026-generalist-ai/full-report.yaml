      - number: '1.5'
        title: Milestones and Company Trajectory
        blocks:
          - type: paragraph
            body: >
              In under 30 months of operation, Generalist AI has executed an unusually compressed milestone sequence:
              founding, first-round close, two model releases, and a second round at five-times its initial valuation.
              The June 2026 funding announcement explicitly describes the emergence of a data flywheel—real businesses
              are generating task data that feeds successive model generations— marking a shift from pure R&D to early
              commercial operations.

              The company's principal documented adverse signal as of this writing is external: investor and independent
              analyst skepticism about the "scale data alone is sufficient" thesis. Brad Porter, CEO of Cobot and a
              former Amazon robotics executive, argued in a Forbes interview that "just brute forcing a huge amount of
              data against a not-perfect architecture is really expensive and not necessarily going to get you the
              result you want," citing historical analogies to ImageNet and transformer breakthroughs as evidence that
              scale requires co-evolution with architectural innovation. Generalist AI's rebuttal, implicit in its GEN-1
              blog post, is that GEN-1 itself represents a full architectural redesign trained from scratch, not brute
              force replication.

              No regulatory actions, patent disputes, litigation, leadership departures, layoffs, or security incidents
              have been reported in publicly available sources as of the June 2026 runDate.

              Competitor context is material: Physical Intelligence (pi.ai) was reportedly in talks for a $1 billion
              raise at an $11 billion valuation as of April 2026—placing Generalist at roughly one-fifth the
              competitor's implied valuation while claiming architectural differentiation.
