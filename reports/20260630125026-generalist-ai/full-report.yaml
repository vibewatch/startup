  - id: FR001
    title: Risk heatmap
    type: matrix
    approximationNotes: >
      Ordinal scoring based on sourced evidence rather than synthetic probabilities; residual severity reflects
      evidence-backed assessment of mitigation gaps, not statistical estimates.
    claimRefs:
      - CR001
      - CR003
      - CR007
      - CR011
      - CR019
      - CR034
      - CR026
      - CR029
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: EU AI Act compliance gap
          values:
            - label: high
              detail: High-risk enforcement deadline August 2 2026; no compliance documentation public.
              tone: negative
            - label: critical
              detail: Penalties up to €35M or 7% of global turnover; blocks EU deployment.
              tone: negative
            - label: none confirmed
              detail: No conformity assessment, DPA, or EU legal counsel visible publicly.
              tone: negative
            - label: very high
              detail: Gap is unmitigated in public record; must be resolved pre-Series C.
              tone: negative
        - label: Product liability for physical robot incidents
          values:
            - label: medium
              detail: No prior incident confirmed; early-access stage limits current exposure.
              tone: warning
            - label: critical
              detail: Physical injury risk creates litigation and reputational exposure.
              tone: negative
            - label: none confirmed
              detail: No insurance, indemnification, or liability allocation framework disclosed.
              tone: negative
            - label: high
              detail: Single incident at early-access partner could be company-defining.
              tone: negative
        - label: GDPR / data privacy for collection operation
          values:
            - label: high
              detail: Global collection across homes and workplaces includes EU subjects.
              tone: negative
            - label: high
              detail: Special-category biometric data under GDPR Art. 9; fines up to €20M.
              tone: negative
            - label: none confirmed
              detail: No DPIA, no DPO, no consent framework publicly visible.
              tone: negative
            - label: high
              detail: Enforcement risk rises with EU deployment scale.
              tone: negative
        - label: NVIDIA compute dependency
          values:
            - label: high
              detail: H100/Blackwell lead times 36–52 weeks; structural supply constraint.
              tone: negative
            - label: high
              detail: GEN-2 training delay would widen competitive gap with Physical Intelligence.
              tone: negative
            - label: low
              detail: NVIDIA co-investment implies some preferential access; multi-cloud unconfirmed.
              tone: warning
            - label: high
              detail: Supply constraint risk persists to 2027 per industry analysis.
              tone: negative
        - label: GEN-1 model safety and improvisation gaps
          values:
            - label: medium
              detail: No confirmed incident; but limited production deployment to date.
              tone: warning
            - label: high
              detail: Physical deployment failures are immediate and visible; no safety audit published.
              tone: negative
            - label: low
              detail: No published trust-and-safety framework or alignment documentation.
              tone: negative
            - label: high
              detail: Residual risk elevated by absence of third-party validation.
              tone: negative
        - label: Key-person concentration
          values:
            - label: low
              detail: All three co-founders active; no departure signals.
              tone: positive
            - label: critical
              detail: Florence and Zeng concentration in narrative and technical direction.
              tone: negative
            - label: low
              detail: No equity schedule, succession plan, or board structure publicly disclosed.
              tone: negative
            - label: high
              detail: Investor confidence is substantially a bet on co-founder team continuity.
              tone: negative
