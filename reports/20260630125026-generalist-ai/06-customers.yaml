  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: no-named-customers
      missingEvidence: >
        Named paying customers, customer count, ARR or revenue, and any disclosed contract
        terms from the GEN-1 early-access program.
      whyItMatters: >
        Without named customers or revenue data, it is impossible to distinguish between
        "early-access partners under NDA" and "pre-commercial with no revenue yet." Both
        scenarios are consistent with the available evidence. This is blocking for any
        commercial underwriting or valuation model.
      diligencePath: >
        Request management confirmation of: (a) number of GEN-1 early-access partners;
        (b) ARR or revenue to date; (c) permission to name at least one reference customer;
        (d) average contract value and term structure.
      relatedQuestionRefs:
        - QU001
        - QU002
        - QU003
        - QU014
        - QU019
      relatedTableRefs:
        - TU002
        - TU003

    - type: private-evidence-only
      severity: material
      topic: Universal-Robots-partnership
      missingEvidence: >
        Whether the Universal Robots GTC 2026 demo partnership has led to a formal commercial
        licensing, distribution, or deployment agreement and, if so, on what terms.
      whyItMatters: >
        If UR has signed a commercial agreement with Generalist AI, this represents a
        distribution channel to 75,000+ cobots across 10,000+ customer facilities and would
        be a transformative commercial development. Its absence from public disclosure leaves
        the most important customer-side fact unresolved.
      diligencePath: >
        Request disclosure of any commercial agreement with Universal Robots or any other
        robot hardware OEM; review partnership agreement terms, exclusivity provisions, and
        revenue model.
      relatedQuestionRefs:
        - QU023
        - QU004

    - type: private-evidence-only
      severity: material
      topic: retention-gaps
      missingEvidence: >
        Any retention, churn, NRR, GRR, or pilot-to-production conversion data from the
        GEN-1 early-access program or the data foundry partner network.
      whyItMatters: >
        Retention is the central financial underwriting metric for any SaaS or recurring-license
        model. Without it, there is no basis for projecting recurring revenue growth.
        Enterprise physical AI platforms with good retention (NRR > 100%) trade at high
        revenue multiples; churn-heavy platforms do not.
      diligencePath: >
        Request cohort retention curves from data foundry partners (as a proxy for model
        quality stickiness); request pilot-to-production conversion rate from early-access
        program; benchmark against Physical Intelligence $300/robot/month model.
      relatedQuestionRefs:
        - QU003
        - QU008
      relatedTableRefs:
        - TU004

    - type: private-evidence-only
      severity: material
      topic: data-foundry-partner-model
      missingEvidence: >
        Revenue model for data foundry partners: whether they are paying customers, unpaid
        data contributors, or reciprocal data-share partners, and whether Generalist AI's
        data contribution agreements include IP protection, exclusivity, or non-compete provisions.
      whyItMatters: >
        If data foundry participants are not paying customers, Generalist AI's "commercial
        traction" may be entirely or mostly unpaid. The IP structure of data contribution
        agreements also determines whether early customers are actually contributing to a
        shared model that could serve their competitors.
      diligencePath: >
        Request template data contribution agreement; confirm whether data foundry relationships
        include revenue, data compensation, or exclusivity; audit IP ownership clauses.
      relatedQuestionRefs:
        - QU011
        - QU022

    - type: missing-source
      severity: material
      topic: procurement-friction
      missingEvidence: >
        Public evidence that Generalist AI's GEN-1 or the customer's deployment environment
        meets safety certification requirements (ISO 10218 / TS 15066) needed for enterprise
        production approval.
      whyItMatters: >
        Without safety certification confirmation, even technically capable customers face
        institutional barriers that prevent production sign-off. This is a procurement
        gating factor that is entirely absent from public Generalist AI communications.
      diligencePath: >
        Request Generalist AI's safety governance framework and any in-progress certifications;
        confirm whether the early-access partner program includes safety qualification support;
        check whether any cobot OEM partner (e.g., UR) has safety-certified the integration.
      relatedQuestionRefs:
        - QU006
        - QU013
