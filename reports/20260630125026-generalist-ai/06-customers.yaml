  - id: partner-and-flywheel-evidence
    title: Partner Evidence and Data-Flywheel Signal
    body: >
      The most concrete, publicly verifiable partner evidence is Universal Robots' invitation to Generalist AI
      to demo GEN-0 at NVIDIA GTC 2026 in March 2026. Universal Robots, the world's largest collaborative
      robot manufacturer by volume, provided its new mobile manipulation platform—UR7e arms on a MiR mobile
      base and a Vention frame—for the demo. Generalist AI's blog describing the event states the robot
      hardware was new, that the team had never physically handled it before, and that the company said "yes"
      to the demo knowing they had only a few days to prepare. The GEN-0 model adapted to the new hardware
      within days, and the demo ran continuously during all open hours at the conference. This is a named,
      publicly documented instance of a major hardware OEM choosing Generalist AI technology for a live
      public event—a material endorsement, though not a commercial licensing or deployment agreement.

      The NVIDIA GTC March 2026 press release mentions Generalist AI as "using Cosmos to explore generating
      synthetic data"—a technical collaboration within the NVIDIA ecosystem, but a peripheral citation
      compared to the partnership roles assigned to Skild AI (ABB Robotics, Universal Robots, Foxconn) or
      other named participants who have formal deployment relationships. Generalist AI is not listed among
      the primary partners in NVIDIA's "physical AI to the real world" narrative, suggesting it is still
      in the ecosystem entry phase.

      The June 2026 funding announcement explicitly states: "a flywheel has begun to take shape: scaling
      robot learning creates better models, better models can do more useful physical work, and data from
      real businesses drives the next generation of more capable models." The use of "real businesses" implies
      data-sharing or contractual relationships with actual industrial operators—consistent with the data
      foundry partner program described in GEN-1 technical materials. The 8VC investment memo reinforces
      this with "remarkable early commercial traction" as one of the stated investment drivers. Neither
      8VC nor Generalist AI has confirmed the number, identity, or revenue magnitude of these relationships.

      Spark Capital's Fraser Kelton, a former OpenAI product commercialization lead, cited "early commercial
      validation in robotics scaling" in connection with the investment, suggesting investors have seen
      evidence of real customer interaction that is not publicly visible. The convergence of multiple investor
      attestations around commercial traction—without any public reference customers—is consistent with
      an NDA-protected early-access program with strategic industrial partners, which is standard practice
      in enterprise robotics at this stage.
    claimRefs:
      - CU009
