  - id: concentration-adverse-risk
    title: Concentration Risk, Procurement Friction, and Adverse Evidence
    body: >
      Generalist AI's customer profile carries structural concentration risk: the company is in early-access
      mode with a small number of undisclosed partners, all of which are likely to represent the vast majority
      of current revenue (if any revenue exists). A single large early-access partner or a single hardware OEM
      relationship could represent a meaningful fraction of any near-term revenue, creating binary risk around
      that relationship's continuity.

      Procurement friction is structurally high for the target use case. Enterprise manufacturing and logistics
      customers typically require safety qualification (ISO 10218 / TS 15066 for industrial robots), integration
      testing with existing ERP and WMS systems, and internal pilot evaluations lasting six to eighteen months
      before production sign-off. Generalist AI has not publicly confirmed any safety certifications,
      integration frameworks, SLA commitments, or formal support structures. This gap must be resolved before
      large enterprise customers can reasonably approve production deployments.

      The most credible adverse technical argument comes from Brad Porter, founder and CEO of Cobot and former
      Amazon robotics executive, quoted in Forbes (April 2026): "Just brute forcing a huge amount of data
      against a not-perfect architecture is really expensive and not necessarily going to get you the result
      you want. ImageNet didn't work without CNNs, and OpenAI didn't work without transformers. Scaling has
      always gone hand-in-hand with architectural breakthroughs." Porter's critique targets the core thesis
      of the company's data-scaling strategy and implies that commercial viability may require architectural
      advances beyond what is currently disclosed.

      A broader market critique comes from the embodied AI market analysis suggesting that in the humanoid
      and physical robot category as of early 2026, only three to five percent of declared revenue represents
      truly productive industrial use—the rest flowing from research, educational, and showcase deployments.
      While this critique targets humanoid robots more than Generalist AI's model-software approach, it
      raises a relevant question about what fraction of the company's "commercial traction" is economically
      productive versus demonstrative.

      The Generalist AI data flywheel model creates a potential long-term customer lock-in mechanism: partners
      who share proprietary task data to train the model have contributed to Generalist's moat while potentially
      enabling Generalist to serve competing customers with similar capabilities. Whether data contribution
      agreements include exclusivity clauses or IP protections for partner data is not disclosed, and this
      could represent a meaningful procurement friction for sophisticated industrial customers who are concerned
      about their manufacturing process IP being used to train a shared model.
    claimRefs:
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
    figureRefs:
      - FU004

