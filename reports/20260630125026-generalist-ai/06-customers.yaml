callouts:
  - calloutType: risk
    title: No Named Customers 89 Days After GEN-1 Launch
    body: >
      As of June 30, 2026, Generalist AI has not disclosed any named paying customer, production deployment,
      or measurable commercial outcome from the GEN-1 early-access program launched April 2, 2026. The absence
      of public references is consistent with enterprise NDA practice, but it creates a complete absence of
      independently verifiable customer evidence. Investors and analysts cannot distinguish "early-access
      partners under NDA" from "no revenue yet" without management disclosure.
    claimRefs:
      - CU002
      - CU027
      - CU030

  - calloutType: strength
    title: Universal Robots Partnership Signals High-Quality Hardware OEM Interest
    body: >
      Universal Robots' decision to feature Generalist AI at NVIDIA GTC 2026—deploying GEN-0 on brand-new
      hardware the team had never physically handled—represents the strongest third-party validation of
      GEN-1's generalization capability in a public setting. UR is the world's #1 cobot manufacturer by
      volume, operating in over 10,000 customer facilities. A formal licensing relationship with UR could
      provide immediate distribution leverage. Whether this demo has led to a commercial agreement is the
      single most important undisclosed customer fact.
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017

  - calloutType: risk
    title: Procurement Friction and Safety Certification Gap
    body: >
      Enterprise manufacturing customers require 6–18 months of qualification, safety certification (ISO 10218
      / TS 15066), and ERP/WMS integration before production approval. Generalist AI has disclosed no safety
      certifications, integration frameworks, or SLA structures. Without these, even highly impressed pilot
      customers face institutional barriers to production sign-off regardless of model performance. This
      structural friction is common in deep-tech robotics but is a material bottleneck for near-term revenue.
    claimRefs:
      - CU023
      - CU034
      - CU037

  - calloutType: insight
    title: Data Flywheel Creates Partner Lock-In But Also IP Risk
    body: >
      Early-access partners who share proprietary task data with Generalist AI to customize GEN-1 are
      building the company's competitive moat while potentially enabling similar capabilities for future
      competitors. Data contribution agreements' IP terms, exclusivity clauses, and confidentiality scope
      are not publicly disclosed. Sophisticated enterprise customers with proprietary manufacturing processes
      may resist data-sharing terms that do not include strong exclusivity protections. This tension between
      the data flywheel's commercial logic and individual customer IP concerns is a material procurement friction.
    claimRefs:
      - CU035
      - CU036

