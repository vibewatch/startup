  - id: adoption-trajectory
    title: Adoption Trajectory and Deployment Status
    body: >
      GEN-1 was made available under an early-access program from April 2, 2026. As of the June 30, 2026
      runDate—approximately 89 days after launch—no named customer deployments, production outcomes, or
      independent performance validations have been publicly released. The company's contact pathway for
      partnerships is a single email address (partnerships@generalistai.com) with no self-serve partner
      portal, no published API documentation, and no visible developer community.

      Evidence of GEN-1 commercial task performance is available from the official launch blog, which shows
      robots completing six tasks—kitting auto parts for over an hour, folding T-shirts 86 times in a row,
      servicing robot vacuums over 200 times in a row, packing blocks over 1,800 times, folding boxes over
      200 times, and packing phones over 100 times—at 99% average success rates. These demonstrations used
      company-selected tasks in controlled settings with the company's own robot arms; no independent
      replication or third-party audits have been published.

      The data collection network—which feeds both pretraining and the data flywheel—represents an operational
      relationship with real-world environments: Generalist AI states data is collected in bakeries, laundromats,
      factories, and homes. These data collection sites involve real human operators using "data hands" devices.
      Whether these sites involve paid access agreements or other compensation arrangements is not disclosed;
      they are operationally distinct from GEN-1 deployment customers.

      The adoption signal from the broader market is indirect. The MarkTechPost Top 10 Physical AI Models for
      2026 (published April 28, 2026) does not include GEN-1, listing instead NVIDIA GR00T, Google Gemini
      Robotics, Physical Intelligence, Figure Helix, and others. Absence from this list does not indicate
      poor product quality, but suggests that as of late April 2026, GEN-1 had not yet established sufficient
      third-party coverage or independently verified deployment evidence to enter analyst-tracking lists.

      The lean commercial team (one "Applied AI & Partnerships" open role as of June 2026) implies a
      high-touch, founder-led early sales motion consistent with three to ten early strategic accounts rather
      than a scaled customer acquisition funnel. For context, competitor Skild AI closed a $1.4B raise in
      2026 with named industrial partners (Zebra Technologies), and Physical Intelligence operates a
      $300/robot/month SaaS model with disclosed deployments—both providing a more visible commercial
      comparison baseline.
