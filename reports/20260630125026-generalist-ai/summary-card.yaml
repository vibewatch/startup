  topStrengths:
    - >-
      Founding team quality is exceptional: Florence, Zeng, and Barry combine DeepMind robotics, PaLM-E/RT-2, Code as
      Policies, and Boston Dynamics operating experience.
    - >-
      GEN-1's hardware-agnostic positioning and 500,000-hour proprietary data engine create a plausible moat if scaling
      laws in physical AI continue to hold.
    - >-
      The June 2026 round brought in Radical Ventures, NVIDIA NVentures, Bezos Expeditions, 8VC, USV, and other
      high-signal backers, giving the company time and strategic credibility.
  topRisks:
    - >-
      No public revenue, pricing, or named production customers exist as of June 2026, so the $2B valuation cannot yet
      be anchored to commercial fundamentals.
    - >-
      Safety, liability, and EU high-risk AI compliance obligations are approaching faster than Generalist's public
      trust-and-safety disclosures.
    - >-
      Competition from better-funded peers such as Skild AI and Physical Intelligence, plus NVIDIA's open GR00T stack,
      could compress model-layer differentiation before Generalist proves durable deployment economics.
    - >-
      Capital intensity remains high because the business depends on expensive compute, data collection operations, and
      founder-led enterprise selling.
  unresolvedGaps:
    - >-
      Named paying customers, contract structure, and at least one production deployment with measurable ROI remain
      undisclosed.
    - Pricing, burn, runway, gross margin, and any revenue or ARR disclosures are still absent from public records.
    - >-
      Public safety, red-team, and regulatory-compliance documentation for GEN-1 is missing despite imminent EU
      high-risk AI enforcement.
    - >-
      Board composition, governance rights from the June 2026 round, and detailed cap-table dilution remain only
      partially visible through Form D records.
