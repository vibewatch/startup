  - id: deployment-integration
    title: Deployment, Integration, Hardware Compatibility, and Roadmap
    body: >
      GEN-1's deployment model is hardware-agnostic: a single foundation model adapts to any robot
      embodiment through approximately one hour of robot-specific data collection and fine-tuning.
      The March 2026 GTC live demo validated this claim under realistic conditions: Generalist AI
      accepted an invitation from Universal Robots to demo GEN-0 on their new mobile manipulation
      platform (UR7e arms on a MiR base mounted via a Vention frame)—a hardware platform that did
      not previously exist—and had it running reliably within a handful of days, using only data
      from their Boston and San Francisco offices and none from the GTC exhibition hall itself.
      Performance at GTC was identical to lab performance on first run.

      Target robot compatibility spans 6DoF, 7DoF, and 16+DoF semi-humanoid platforms. No public
      SDK, public API documentation, or developer portal has been disclosed as of June 2026. Deployment
      is facilitated through the early-access partner program, accessible via partnerships@generalistai.com.
      GEN-1 also integrates multi-modal human guidance during fine-tuning, enabling human operators
      to steer model behavior toward desired outcomes—a capability the company terms alignment for
      embodied intelligence.

      The roadmap is inferred primarily from the June 2026 funding announcement: the $400 million
      raise explicitly funds next-generation model development, data engine scaling, expanded compute
      and training infrastructure, and commercial deployment expansion. No specific GEN-2 timeline,
      feature set, or model size has been disclosed. The company's broader roadmap philosophy is
      goal-driven: keep decreasing the amount of task-specific data required while pushing success
      rates higher. The near-term milestone—achieving 99%+ rates with ~1 hour of data—has been
      reached with GEN-1; the next horizon is broader task and environment generalization.
