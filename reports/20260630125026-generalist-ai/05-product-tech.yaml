callouts:
  - calloutType: strength
    title: Hardware-Agnostic Foundation Model with Validated Cross-Embodiment Speed
    body: >
      The March 2026 GTC live demo validated the company's most operationally important claim:
      GEN-0 (and by extension GEN-1) can generalize to a brand-new robot type—one that had never
      been in the company's lab—within a handful of days, using only data from existing offices and
      zero data from the demo venue. This is a difficult-to-fake proof point for hardware-agnostic
      deployment. Combined with GEN-1's 1-hour adaptation requirement, this substantially reduces
      the deployment friction that has historically locked robotics intelligence to specific hardware
      vendors, making Generalist AI's intelligence layer commercially substitutable across OEMs.
    claimRefs:
      - CE002
      - CE018
      - CE022

  - calloutType: strength
    title: World's Largest Real-World Physical Interaction Dataset as Durable Moat
    body: >
      The 500,000+ hour dataset—collected through a proprietary wearable system that preserves the
      naturalistic sensorimotor loop—represents a significant data moat that competitors cannot
      quickly replicate. Teleoperation-based competitors produce inherently slower, more stilted
      trajectories that miss the reflexive micro-corrections embedded in natural human dexterity.
      The power-law scaling relationship demonstrated in GEN-0 means that doubling this dataset
      will produce predictable downstream performance gains across all tasks—a strategic advantage
      that compounds with time and capital.
    claimRefs:
      - CE005
      - CE007
      - CE013
      - CE030

  - calloutType: risk
    title: No Independent Validation and Uncharacterized Alignment Risk from Improvisation
    body: >
      GEN-1's headline metrics (99% success rate, 3x speed, 1-hr adaptation) are entirely
      self-reported and measured under conditions controlled by the company. No independent
      third-party benchmark, peer-reviewed paper, or customer testimony corroborates these
      figures in real-world production conditions. Simultaneously, the company's own blog
      acknowledges that improvisational intelligence—a core selling point—can be a liability:
      emergent behaviors outside the training distribution represent physical actions with real
      consequences in the real world. No published safety framework, incident protocol, or
      alignment audit addresses this risk.
    claimRefs:
      - CE031
      - CE032
      - CE036

  - calloutType: risk
    title: Data Privacy Exposure from Petabyte-Scale Global Home and Workplace Collection
    body: >
      The physical data engine collects manipulation video and sensor data from thousands of private
      homes, warehouses, and workplaces worldwide. This scope very likely triggers GDPR (EU),
      CCPA (California), and equivalent privacy obligations in multiple jurisdictions. No public
      statement, privacy policy, consent framework, data processing agreement, or regulatory
      guidance has been disclosed. The absence of any disclosed compliance infrastructure is a
      material diligence gap that could expose the company to enforcement action, constrain data
      collection in key geographies, or require costly retroactive remediation.
    claimRefs:
      - CE009
      - CE034

