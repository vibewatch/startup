  - id: trust-safety
    title: Trust, Safety, Alignment, and Quality Controls
    body: >
      Generalist AI has acknowledged a safety and alignment gap specific to embodied foundation
      models. In the GEN-1 blog post, the company notes that GEN-1's improvisational intelligence
      is simultaneously a strength (enabling spontaneous recovery from unexpected scenarios) and a
      potential liability: emergent behaviors are physical actions with real consequences, and
      improvisation outside the training distribution may result in unintended robot behavior. The
      company states it aims to improve alignment methods to "precisely steer" models into desired
      behaviors, but has not published a formal alignment framework, safety protocol, or timeline.

      GEN-1 task performance is measured via internal A/B evaluations on real robots using blind
      scoring and closed-loop policy rollouts, as described in the GEN-0 blog post. This validation
      is internal only: no independent third-party audit of the 99% success rate claim has been
      publicly disclosed. The specific benchmark task set, evaluation environment, and statistical
      methodology are not published. GEN-1 also acknowledges its own limitations: not all tasks
      achieve 99%+ success rates, and some tasks would require even higher rates for real-world
      deployment utility.

      Privacy and data security governance for the physical data collection operation is not publicly
      disclosed. The company collects video and sensorimotor data from thousands of homes, warehouses,
      and workplaces in multiple geographies, a scope that likely triggers GDPR, CCPA, and equivalent
      privacy obligations. No public statement on consent frameworks, data-subject rights, retention
      policies, or regulatory guidance has been made. No SOC 2, ISO 27001, or equivalent information
      security certification has been mentioned. Export control applicability to GEN-1 as a dual-use
      physical AI foundation model has not been addressed publicly.
    claimRefs:
      - CE031
      - CE032
      - CE036
      - CE040
