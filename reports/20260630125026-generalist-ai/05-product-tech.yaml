chapter:
  number: 5
  title: Product & Technology
  summary: >
    GEN-1 is Generalist AI's flagship embodied foundation model, trained from scratch on 500,000+ hours
    of real-world physical interaction data collected through proprietary wearable data-hands devices
    deployed globally. It achieves 99% success rates on simple dexterous tasks versus 64% for GEN-0,
    completes tasks ~3x faster than prior state of the art, and adapts to a new robot in approximately
    one hour of task-specific data. Its Harmonic Reasoning architecture enables simultaneous continuous-
    time sensing and acting across 6DoF, 7DoF, and 16+DoF robot hardware without robot data in
    pretraining. GEN-1 was made available under an early-access program from April 2, 2026.
    Critical product gaps include no public API or developer documentation, no independent validation
    of performance claims, no published privacy or data-consent framework, and an undisclosed pricing
    and support model. Trust and safety alignment for emergent improvisation behaviors remains work
    in progress with no published framework or third-party audit.

sections:
  - id: product-definition
    title: Product Definition and Commercial Offering
    body: >
      Generalist AI's core commercial product is GEN-1, a large multimodal foundation model that
      emits real-time robotic actions. Positioned as the "intelligence layer" or "cognitive brain" of
      any robot, GEN-1 is not tied to proprietary hardware: it works across multiple robot form factors
      including 6-degree-of-freedom (6DoF) industrial arms, 7DoF collaborative robots, and 16+DoF
      semi-humanoid systems. The company's commercial proposition is to serve as a universal software
      model that any robotic hardware OEM or end-deployer can integrate, rather than selling complete
      robotic systems.

      GEN-1 defines commercial viability through what the company calls "mastery"—the combination
      of three capabilities: reliability (consistently accomplishing tasks), speed (completing tasks
      fast enough for economic value), and improvisational intelligence (recovering from unexpected
      scenarios without predefined responses). The company claims GEN-1 crosses this threshold on
      simple physical tasks, with 99% success rates, completion speeds ~3x faster than prior state
      of the art, and demonstrated recovery behaviors that fall outside the training distribution.

      GEN-1 is offered under an early-access program to selected industry partners as of April 2, 2026.
      The company has not publicly disclosed pricing, named customers, SLA commitments, or a formal
      support model. The contact pathway for deployment is partnerships@generalistai.com. Target
      industry segments mentioned in official blog posts and investor commentary include apparel,
      manufacturing, logistics, automotive, and electronics.
