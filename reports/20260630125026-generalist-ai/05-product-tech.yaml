  - id: architecture
    title: "Model Architecture: GEN-0, GEN-1, and Harmonic Reasoning"
    body: >
      GEN-1's architecture is built entirely from scratch—approximately 99% of parameters are trained
      fresh rather than fine-tuned from an existing vision-language model (VLM). This is a deliberate
      choice rooted in the company's goal-driven research philosophy: having accumulated sufficient
      real-world physical data, Generalist AI believes full architectural control yields faster
      frontier progress than adapting off-the-shelf VLAs or world models. The company co-invented
      VLAs (PaLM-E, RT-2) and worked on world models before GEN-1, but refuses to self-label because
      the model's design crosses multiple technical categories.

      The foundational architectural innovation is Harmonic Reasoning, first introduced in GEN-0 and
      evolved in GEN-1. Harmonic Reasoning creates an asynchronous, continuous-time "harmonic"
      interplay between streams of sensing tokens and acting tokens—enabling the model to think and
      act simultaneously without pausing for physics. This is contrasted with System 1/System 2
      architectures (used in Figure AI's Helix) and inference-time guidance approaches, which require
      sequential pause-then-act cycles incompatible with real-time physics. At GEN-0, scaling
      experiments revealed a model "ossification" phase transition: models below 7B parameters cannot
      absorb large-scale pretraining data and their weights freeze, while 7B+ models continue to
      improve. GEN-0 was scaled to 10B+ parameters. GEN-1 extends GEN-0's foundation with pretraining
      advances, post-training techniques (supervised fine-tuning, reinforcement learning, multimodal
      human guidance), and new inference-time techniques. GEN-1 demonstrates 10x data efficiency
      versus GEN-0, achieving comparable downstream performance with 10x less task-specific data.
      A custom paged attention kernel powers real-time inference. Physical commonsense—reactive,
      closed-loop sensorimotor intelligence for forces, friction, and uncertainty—is a key emergent
      property from large-scale pretraining, observed as spontaneous recovery behaviors the
      company did not train for explicitly.
