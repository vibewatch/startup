  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: deployment-api
      missingEvidence: >
        No public API documentation, developer SDK, public integration portal, or technical
        specification for GEN-1 deployment has been publicly disclosed by Generalist AI as of
        June 30, 2026. The only public contact pathway is partnerships@generalistai.com.
      whyItMatters: >
        Without public API or integration documentation, independent developers and potential
        customers cannot evaluate deployment complexity, integration costs, hardware certification
        requirements, or latency specifications. This limits the ability to assess deployment
        friction and commercial scalability of the early-access model.
      diligencePath: >
        Request technical integration specifications, hardware compatibility matrix, inference
        latency benchmarks, and API schema under NDA from Generalist AI partnerships team.
      relatedQuestionRefs: [QE011]

    - type: missing-source
      severity: material
      topic: privacy-compliance
      missingEvidence: >
        No public privacy policy, data consent framework, data processing agreement, or regulatory
        guidance addressing Generalist AI's collection of physical interaction data from thousands
        of private homes, warehouses, and workplaces in multiple geographies has been publicly
        disclosed as of June 30, 2026.
      whyItMatters: >
        Collection of video and sensorimotor data from private spaces in EU, US, and global
        geographies likely triggers GDPR, CCPA, and equivalent privacy obligations. The absence
        of any public compliance infrastructure is a material diligence gap that could expose the
        company to enforcement action, require retroactive remediation, or constrain collection in
        key geographies.
      diligencePath: >
        Request privacy counsel opinion, data processing agreements, operator consent documentation,
        and any regulatory correspondence or guidance received. Review data collection partner
        contracts for consent and privacy provisions.
      relatedQuestionRefs: [QE020]

    - type: private-evidence-only
      severity: material
      topic: pricing-commercial-terms
      missingEvidence: >
        No pricing, licensing model, SLA, support tier structure, or commercial access terms for
        GEN-1 have been publicly disclosed by Generalist AI. Early access is offered to selected
        partners only, with no public pricing page or published commercial terms.
      whyItMatters: >
        Without pricing and commercial terms, it is impossible to model unit economics, customer
        acquisition cost, or gross margin expectations. Investors and potential customers cannot
        independently evaluate commercial viability or compare to alternatives.
      diligencePath: >
        Request pricing documentation, sample customer agreements, and any disclosed SLA terms
        from the Generalist AI partnerships team. Cross-reference with any customer or partner
        references willing to discuss commercial terms.
      relatedQuestionRefs: [QE025]

    - type: missing-source
      severity: minor
      topic: developer-community
      missingEvidence: >
        No public GitHub repository, open-source component, developer documentation, HackerNews
        community thread, or independent technical evaluation of GEN-1 has been identified as of
        June 30, 2026. Developer-community engagement is limited to the company's job board (Ashby)
        and general press coverage. The early-access program is closed to public participants.
      whyItMatters: >
        For a company positioning a foundation model as an intelligence platform, the absence of
        any public developer ecosystem—no SDK, no open weights, no community forum—limits the
        speed of adoption and makes it difficult to verify independent technical validation of
        performance claims.
      diligencePath: >
        Monitor generalistai.com, GitHub, HackerNews, and arXiv for any publications, code releases,
        or developer announcements. Contact partnerships team to understand planned developer
        ecosystem timeline.
      relatedQuestionRefs: [QE023]

acknowledgedWarnings:
