companyProfile:
  summary: "Generalist AI is a San Mateo-based embodied AI startup founded in 2024 by Pete Florence, Andy Zeng, and Andrew Barry to build general-purpose robot intelligence that can run across many hardware form factors. The company's core product line progressed from GEN-0 in November 2025 to GEN-1 in April 2026, with the latter claiming 99% task reliability, 3x speed improvements, and one-hour adaptation to new tasks using a proprietary 500,000-hour physical-interaction dataset. Generalist has raised roughly $540 million across two disclosed rounds, including a $400 million Series B at a $2 billion valuation in June 2026, but it still discloses no revenue, pricing, or named production customers."
