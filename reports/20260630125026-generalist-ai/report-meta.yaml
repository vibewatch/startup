  topStrengths:
    - "Founding team quality is exceptional: Florence, Zeng, and Barry combine DeepMind robotics, PaLM-E/RT-2, Code as Policies, and Boston Dynamics operating experience."
    - "GEN-1's hardware-agnostic positioning and 500,000-hour proprietary data engine create a plausible moat if scaling laws in physical AI continue to hold."
