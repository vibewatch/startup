  - id: scenario-analysis-bull-base-bear
    title: "Scenario Analysis: Bull, Base, and Bear"
    body: >-
      All three scenarios assume that eMed's revenue model is a per-employee-per-month (PEPM)
      capitated fee to employer plan sponsors, with a possible clinical-outcomes incentive layer.
      Because eMed has disclosed no ARR or member enrollment, all revenue assumptions below are
      estimates derived from employer-channel digital health benchmarks (Omada, Hinge Health) and
      eMed's market positioning. These scenarios are clearly labeled as estimated and
      evidence-constrained; they are not forecasts or endorsements.

      The bull scenario (25% probability signal) assumes rapid employer channel penetration: eMed
      signs 50+ employer clients with 100,000+ covered lives each, achieves $150-200M ARR by
      2027-2028, demonstrates strong clinical outcomes, and Aon contributes additional distribution.
      Under an optimistic 14x forward revenue multiple (consistent with high-growth employer health
      peers), eMed's valuation would reach $2.1-2.8B, supporting or slightly exceeding the current
      $2B+ mark. This scenario requires eMed to demonstrate clinical outcomes data, resolve Aon
      concentration risk, and maintain strong retention rates above the ~60% annual retention rate
      typical for employer GLP-1 programs.

      The base scenario (50% probability signal) assumes moderate employer adoption, with eMed
      building a $60-80M ARR base by 2027 as employer cost sensitivity moderates adoption and Aon
      provides a predictable but bounded commercial floor. At a 10x forward revenue multiple—the
      midpoint of current employer digital health comps—the base-scenario valuation is $600-800M,
      representing meaningful downside from the $2B+ Series A entry. For an investor entering at
      $2B+, achieving a 3x return under this scenario would require an additional 4-5 years of
      growth and a valuation re-rating event (strategic exit or IPO).

      The bear scenario (25% probability signal) envisions employer GLP-1 cost sensitivity driving
      benefit cuts or benefit restructuring, high member dropout rates (the population median is
      50%+ within 12 months off GLP-1 therapy), and potential Aon strategic reconsideration of its
      investment thesis. Under this scenario, ARR stalls at $30-40M, the effective revenue multiple
      compresses to 5-6x, and the implied valuation is $150-240M—a 90%+ markdown from the Series A
      entry price. Morgan Stanley's GLP-1 market analysis projects the market reaching $190B by
      2035 but Goldman Sachs cautioned that the anti-obesity drug market may prove smaller than
      expected, with payer coverage resistance and dropout rates as the primary downside risks.
