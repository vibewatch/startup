  - calloutType: risk
    title: Aon Concentration Is a Structural Deficiency
    body: >-
      Aon serves simultaneously as eMed's lead investor, most visible distribution partner, and
      flagship employer customer. This triple concentration is not merely a risk factor—it is a
      structural feature that makes the $2B+ valuation partially self-referential. Any investor
      evaluation must diligence the share of ARR attributable to Aon-sourced deals versus
      independently won enterprise clients. Analogously, Omada's Cigna concentration at 36% of
      revenue was disclosed in its S-1 as a material risk; eMed's comparable disclosure is absent.
