    body: >-
      eMed has not disclosed any ARR, revenue run-rate, customer count, or financial KPIs. All
      revenue-based valuation calculations in this chapter use employer-channel digital health
      benchmarks (primarily Omada Health S-1 and Hinge Health IPO data) as proxies. These estimates
