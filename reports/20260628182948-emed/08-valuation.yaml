  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >-
        eMed's ARR, revenue run-rate, customer count, member enrollment, and unit economics have
        not been publicly disclosed and are not available from any secondary source. No S-1, audit,
        or investor data room has been made public.
      whyItMatters: >-
        Without revenue disclosure, all valuation multiples for eMed's $2B+ mark are unverifiable.
        The entire scenario analysis depends on benchmark estimates from peers, not eMed-specific
        data. A single ARR disclosure would immediately re-anchor all multiples.
      diligencePath: >-
        Formal investor diligence request; review of management data room; monitoring for any
        future S-1 filing or secondary market transaction that would require financial disclosure.
      relatedQuestionRefs: [QV002, QV011, QV017]

    - type: missing-source
      severity: material
      topic: clinical-outcomes
      missingEvidence: >-
        No independent clinical outcomes study showing eMed's 12-month GLP-1 adherence rate,
        clinical outcomes versus population averages, or employer health ROI has been published.
        The core value proposition of the adherence platform is unverified in peer-reviewed literature.
      whyItMatters: >-
        eMed's business model depends on demonstrating superior clinical outcomes versus population
        dropout rates of 50%+ at 12 months. Without outcomes evidence, employer renewal rates
        cannot be validated and the bull-case scenario assumptions remain ungrounded.
      diligencePath: >-
        Review Aon's published GLP-1 study data for any eMed-specific outcomes; monitor PubMed and
        clinical registries for Omada-style peer-reviewed publications from eMed programs.
      relatedQuestionRefs: [QV020, QV027]

    - type: missing-source
      severity: material
      topic: cap-table
      missingEvidence: >-
        eMed's capitalization table, liquidation preference structure, anti-dilution provisions, and
        Series A terms have not been publicly disclosed. The share of equity retained by founders
        versus investors, and any preference overhang, is unknown.
      whyItMatters: >-
        Cap table structure determines effective returns for Series A investors and the liquidation
        waterfall in any exit or down-round scenario. An investor entering at $2B+ with senior
        preference from an earlier structure would face different economics than face-value pricing
        suggests.
      diligencePath: >-
        Request capitalization table in diligence process; review Series A term sheet for
        preference terms, anti-dilution, and pay-to-play provisions.
      relatedQuestionRefs: [QV017]

    - type: missing-source
      severity: minor
      topic: private-down-round-comps
      missingEvidence: >-
        Comparable private GLP-1 employer platforms that have received follow-on financing
        at flat or down marks in 2025-2026 are not publicly known (secondary market data is
        limited). Private market valuation marks for Calibrate, Virta Health, and other
        employer-channel GLP-1 platforms are unavailable.
      whyItMatters: >-
        Private-market comparables would provide a more direct benchmark than public company
        multiples. The absence of this data forces reliance on public comps (Hims, Omada, Teladoc)
        that have different business models, revenue scales, and liquidity profiles.
      diligencePath: >-
        Review secondary market transaction data from PitchBook, CB Insights, or Setter Capital;
        monitor press releases from Virta Health, Found, and other employer-channel GLP-1 platforms
        for any financing announcements or M&A activity.
      relatedQuestionRefs: [QV030]
      relatedTableRefs: [TV004]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TV001 (Recommendation Summary) is a factual snapshot of the analytical stance with
      all cells derived from primary evidence review and clearly labeled sources; notes
      are provided despite the pure-factual nature as a belt-and-suspenders measure.
