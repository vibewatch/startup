  - id: recommendation-diligence-and-monitoring
    title: Recommendation, Diligence, and Monitoring
    body: >-
      Given the evidence available as of June 28, 2026, the appropriate stance on eMed is
      "research-more" with a "stretched" valuation designation and low confidence. The market
      opportunity is real and the employer-channel model has public precedents (Omada Health) with
      strong retention metrics. However, eMed's complete financial opacity, structural Aon
      concentration, and the adverse digital health valuation backdrop mean that an investor
      entering at $2B+ is essentially pricing a thesis, not a track record. A minimum viable
      evidence package for upgrading to "track" or "buy" would require: (a) disclosed ARR of at
      least $60M, (b) disclosure of a customer count with at least 10 named enterprise employers
      beyond Aon, (c) independent clinical outcomes data showing 12-month GLP-1 adherence above
      50%, and (d) evidence that employer renewal rates exceed 80%.

      For investors already committed at Series A pricing, the key monitoring signals are: Aon's
      own employer health strategy and retention of eMed as its primary GLP-1 benefit vendor,
      eMed's FDA regulatory posture (no warning letters or enforcement queries), and the broader
      employer benefits market response to GLP-1 cost management (if coverage cuts accelerate,
      eMed's pipeline contracts are at risk). TechCrunch data showing that AI-native health
      companies like Abridge doubled valuations to $5.3B in 2025 suggests a realistic upside path
      if eMed can credibly position as an AI-enabled clinical platform rather than a digital
      prescribing intermediary. PitchBook's 2026 VC outlook also notes that AI-enabled companies
      commanded a 19% deal-size premium in 2025, suggesting that eMed's AI positioning is a
      genuine valuation driver if substantiated with outcomes data.

      The kill criteria for the eMed thesis are: (1) any FDA action naming eMed for unlawful
      prescribing or compounding, (2) Aon publicly reducing or terminating its partnership, (3)
      a rights-down or flat Series B round triggered by ARR shortfall, or (4) employer GLP-1
      benefit cuts affecting more than 40% of eMed's contracted employer base. These are
      monitorable signals with 6-12 month leading indicators. Rock Health's 2025 data confirms
      that 195 M&A deals occurred in 2025—up 61% from 2024—suggesting that if eMed executes a
      strategic sale rather than an IPO, the buyer universe includes health plans, pharmacy benefit
      managers, and employer benefits platforms.
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
