      - CV036

  - calloutType: insight
    title: "Goldman Sachs Caution: Anti-Obesity Market May Disappoint"
    body: >-
      Goldman Sachs published analysis cautioning that the anti-obesity drug market may prove
      smaller than consensus forecasts, citing patient dropout rates and payer coverage resistance
      as structural constraints. This adverse view aligns with clinical evidence that more than 50%
      of GLP-1 patients discontinue treatment within 12 months, limiting the addressable market for
      adherence platforms like eMed. The Goldman note represents a minority but credible adverse
      view on the GLP-1 market size assumptions that underpin eMed's bull-case scenario.
    claimRefs:
      - CV025
      - CV026
      - CV027

  - calloutType: recommendation
    title: Key Milestones That Would Change the Valuation Call
    body: >-
      Upgrade to "track" if eMed discloses ARR above $60M with 10+ named enterprise employer
      clients, demonstrates 12-month GLP-1 adherence above 50%, and shows Aon constitutes less than
      40% of contracted ARR. Upgrade to "buy" if ARR exceeds $100M with a demonstrated 2-year
      employer retention rate above 80%, independent clinical outcomes peer-reviewed publication,
      and preparation for an S-1 filing with audited financials. Maintain "research-more" until any
      of those milestones are verifiable through public disclosure.
    claimRefs:
      - CV038
      - CV041
      - CV042

