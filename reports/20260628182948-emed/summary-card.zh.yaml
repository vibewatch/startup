  topStrengths:
    - Aon 同时是客户、战略伙伴和领投方，给 eMed 带来罕见强度的商业验证
    - eMed 起家于 COVID 期间的远程医疗诊断，这让它今天的照护路径主张比从零搭建的 GLP-1 营销漏斗更可信
    - 公司聚焦雇主，正好切中 GLP-1 成本挤压自保雇主计划的真实预算痛点
    - Linda Yaccarino 和 Tom Brady 为公司带来高曝光分发与品牌资产
  topRisks:
    - 收入、ARR、毛利率和客户数均不透明，$2B+ 估值很难承保
    - Aon 集中度带来验证闭环：领投方同时也是旗舰客户和验证来源
    - 即便 eMed 强调品牌药和临床监督流程，GLP-1 远程医疗仍面临 FDA、FTC、DEA 和州级执业监管收紧
    - 药物成本一旦跑赢疗效，或依从性离开精选试点后走弱，雇主覆盖可能迅速回撤
    - 数字健康赛道竞争加剧、估值压缩；若增长或利润率不及预期，公司未来可能被迫下调估值融资
  unresolvedGaps:
    - 当前收入、ARR、烧钱速度、毛利率和现金跑道未公开披露
    - Aon 之外的客户集中度，以及付费雇主账户真实规模仍不清楚
    - 公开证据尚不足以在广泛装机基础上验证 eMed 宣称的依从性、ROI 或生物标志物结果
    - 董事会构成、投资人权利和完整股权结构未见于公开材料
    - eMed 虽大力宣传 AI 层，但其技术与监管状态仍不透明
