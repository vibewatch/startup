              structured employer GLP-1 program. GLP-1 prices available through the eMed-CVS arrangement are described
              by CEO Linda Yaccarino as "the most cost-effective price point available in the market." A growing trend
              of employer-sponsored lifestyle requirements — required by roughly 1 in 3 employers before dispensing
              GLP-1s in 2025 — aligns with eMed's integrated diagnostic-plus- coaching approach and may improve
              competitive positioning versus pure-prescription telehealth vendors.
