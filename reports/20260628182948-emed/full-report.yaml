  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: standard
    summary: >-
      Seven-touchpoint employer customer journey from initial awareness through active deployment and expansion, with
      key decision moments, channels, and stakeholders at each stage.
    data:
      items:
        - label: >-
            Awareness: Employer learns of eMed via Aon benefits advisory, CVS Caremark PBM recommendation, or media
            coverage of GLP-1 cost management
        - label: >-
            Problem scoping: HR/benefits director quantifies GLP-1 spend trajectory; 77% of large employers now cite
            GLP-1 drug cost as top concern (Mercer 2026)
        - label: >-
            Vendor evaluation: Benefits team compares eMed's outcome guarantee and no-PBM-markup pricing against
            traditional coverage and peer telehealth platforms
        - label: >-
            Financial modeling: CFO/finance models 7pp medical spend reduction and MACE hospitalization savings from
            adherent GLP-1 use (Aon Phase 2 findings)
        - label: >-
            Contract and compliance: Employer sets employee cost-share level, legal reviews ERISA/ACA consistency,
            compliance documentation finalized
        - label: >-
            Deployment: Employee enrollment opens; at-home diagnostic screening kit dispatched; live proctor guides
            blood collection; clinician reviews biomarkers and approves GLP-1 prescription
        - label: >-
            Outcomes and expansion: After 6–12 months, employer reviews aggregate weight-loss and medical-cost data;
            decides on coverage tier expansion, multi-year renewal, or referral
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU022
      - CU023
      - CU024
    approximationNotes: >-
      Journey stages are inferred from publicly available program descriptions, press releases, and employer benefit
      guide language; no independently confirmed procurement timeline data is available.
