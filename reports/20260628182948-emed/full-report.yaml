  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included and Excluded Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              eMed's addressable market is the employer-paid service overlay on top of GLP-1 prescriptions, not the
              branded drug revenue earned by Novo Nordisk and Eli Lilly. The distinction matters enormously for sizing:
              the global GLP-1 drug market—dominated by semaglutide and tirzepatide pharmaceutical revenue—is frequently
              cited as a $157–$190 billion market by 2035, but that figure is pharmacy spend, not vendor platform fee.
              eMed monetizes telehealth clinical visits, at-home diagnostics, AI-driven adherence coaching, care
              coordination, and population-health reporting sold as an employer benefit—none of which accrues to the
              drug manufacturers. The market that is directly addressable is the US digital obesity care and GLP-1
              support segment, estimated at approximately $2.2 billion in 2026 and growing toward $6 billion by 2030 at
              a 22%+ CAGR.

              The primary status-quo substitutes that eMed displaces are in-network primary care prescription of GLP-1s
              without structured oversight (the dominant pathway today), standard pharmacy benefit manager coverage, and
              traditional wellness programs such as WW (Weight Watchers), Noom, and Virta Health that offer lifestyle
              support but no prescription access. Bariatric surgery remains a more invasive and costly substitute for
              severe obesity, while direct-to-consumer telehealth platforms—Ro, Hims & Hers, and Calibrate—address
              individual consumers rather than employer benefit budgets. The adjacencies that could expand eMed's
              addressable surface include broader metabolic health management, behavioral health programs, and
              chronic-disease population health services for self-insured employers managing comorbidities linked to
              obesity such as type 2 diabetes, sleep apnea, and cardiovascular risk.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Across Multiple Lenses'
        blocks:
          - type: paragraph
            body: >-
              Any single GLP-1 market figure misrepresents the investor-relevant sizing question for eMed. The global
              GLP-1 drug market (all indications including diabetes, cardiovascular, and weight loss) is projected by
              Research and Markets at $157.5 billion by 2035 at an 11.1% CAGR, and Morgan Stanley's base case reaches
              $190 billion by 2035 with a bull case of $240 billion driven by oral formulations and geographic
              expansion. Goldman Sachs published a contrarian view warning that the anti-obesity drug market may prove
              smaller than these projections, citing price erosion, formulary resistance, and real-world adherence
              dropout that could cap global anti-obesity drug revenue at approximately $120 billion by 2035. The wide
              range—$120 billion to $240 billion—signals genuine uncertainty, not analyst precision.

              The relevant SAM for eMed sits several layers below. JP Morgan and other analysts peg the US GLP-1 obesity
              drug subsegment at $42–$48 billion by 2030 at a 18–23% CAGR. Below that, the US employer-managed digital
              GLP-1 platform market—where eMed actually competes—is estimated at $2.2 billion in 2026 growing to $6
              billion by 2030. eMed's serviceable obtainable market is a subset of this: employers that are
              self-insured, willing to pay a per-member management fee, and seeking outcomes-accountable clinical
              oversight rather than pure pharmacy access. Aon's workforce analysis across more than 192,000 GLP-1 users
              suggests the ROI case for managed programs is real, but only when adherence exceeds 80%—a threshold most
              unmanaged programs do not reach. The self-insured employer universe spans approximately 50,700 plans
              covering 39 million participants, with the highest-value concentration in firms with 5,000 or more
              employees, where roughly 90% are self-insured.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM021
              - CM022
              - CM038
