  - id: FE004
    title: Product Capability Maturity Map
    type: matrix
    layout: standard
    summary: >-
      Assessment of eMed's product capability maturity across six dimensions, rated on evidence quality and competitive
      differentiation.
    data:
      columns:
        - Maturity (1=early, 5=proven)
        - Evidence quality
        - Competitive differentiation
