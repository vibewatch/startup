  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Priced Round and Financing Context
        blocks:
          - type: paragraph
            body: >-
              In March 2026, eMed closed a $200 million Series A financing round at a post-money valuation exceeding $2
              billion. AON Consulting, Inc. served as the lead institutional investor, extending its prior strategic
              equity stake (announced August 2025) into a full lead position in the inaugural institutional round.
              Additional investors included NFL Hall of Famer and Chief Wellness Officer Tom Brady, venture capitalist
              Joe Lonsdale (8VC and Palantir co-founder), Antonio Gracias (Valor Equity Partners), Jeff Aronin (Paragon
              Biosciences), Ara Cohen (Knighthead Capital Management), R.J. Melman (Lettuce Entertain You), Tom Ricketts
              (Chairman, Chicago Cubs), and Linda Yaccarino herself as co-investor. The investor composition signals
              high-profile brand and network value but limited institutional venture depth outside Aon.

              Aon's dual role as both lead financial investor and eMed's most visible distribution anchor— having signed
              eMed as the digital GLP-1 benefit provider for its own employees before investing—creates a valuation
              circularity that any independent analyst must flag. The $200M raise occurred at a time of peak enthusiasm
              for employer-channel GLP-1 platforms, following a run of favorable coverage and high employer interest in
              managing GLP-1 drug costs, which were forecasted to add thousands of dollars per covered employee annually
              across self-insured plans.

              eMed has not publicly disclosed its ARR, revenue run-rate, customer count, member enrollment, or unit
              economics in any SEC filing, press release, or investor materials. This opacity is standard for
              private-stage companies but makes independent valuation verification impossible. The $200M capital
              injection, if invested at a gross margin structure consistent with employer-channel digital health peers
              (~60-70%), would take 18-36 months to generate operating cash flow under optimistic revenue ramp
              assumptions. Without disclosed metrics, the $2B+ mark is essentially venture-stage thesis pricing rather
              than evidence-grounded multiple analysis—an important distinction for any institutional investor
              evaluating entry.
