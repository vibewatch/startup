      - number: '8.2'
        title: Comparable Set and Multiple Analysis
        blocks:
          - type: paragraph
            body: >-
              eMed's most relevant public comparable is Hims & Hers Health (NYSE: HIMS), the leading publicly traded
              digital health telehealth company with a GLP-1 prescription product suite. Hims reported FY2025 total net
              revenues of $2,347.6 million—up 59% from $1,476.5 million in FY2024—driven primarily by GLP-1 weight
              management revenue. The Hims FY2025 10-K, filed February 23, 2026 with the SEC, disclosed that the
              aggregate non-affiliate market cap was approximately $10.1 billion as of June 30, 2025 (at $49.85/share),
              implying a trailing revenue multiple of approximately 4.3x at that moment. However, Hims stock declined
              substantially following the FDA warning letter issued in February 2026 regarding compounded semaglutide
              marketing, meaning the effective comp multiple at the time of eMed's March 2026 raise was likely
              lower—illustrating the regulatory sensitivity of GLP-1 telehealth valuations.

              Omada Health provides a closer business-model comp due to its employer-channel focus and value-based care
              positioning. Omada's S-1/A, filed with the SEC on May 29, 2025, disclosed FY2024 revenue of $169.8 million
              (38% growth), a net revenue retention rate of 128% in 2024, and a net loss of $47.1 million. Omada's 2025
              IPO at a $19 midpoint offering price—based on an expected 7.9M new shares at $19—implies a gross proceeds
              of approximately $150M and a total market cap in the $1.5-2.0B range depending on total shares
              outstanding. That yields a forward revenue multiple of approximately 7-10x based on Omada's ~$220M
              run-rate at Q1 2025.

              Teladoc Health (NYSE: TDOC) represents the cautionary tale of multiple compression. Teladoc reported Q1
              2026 revenue of $613.8 million (down 2% YoY) with a run-rate of ~$2.45 billion annually and an adjusted
              EBITDA of $58.2 million, yet its public market capitalization has compressed dramatically from a $40+
              billion peak in 2021 to approximately $2-3 billion by early 2026—implying a sub-1x revenue multiple. While
              eMed is a pre-revenue or early-revenue company with higher growth optionality, Teladoc demonstrates the
              severity of multiple compression when digital health growth stories disappoint.

              Private-market comparables show a sobering pattern. Hinge Health debuted on Nasdaq in 2025 at
              approximately $3 billion—less than half its $6.2 billion 2021 private valuation—according to Rock Health's
              2025 year-end digital health funding overview. Thirty Madison, a GLP-1 telehealth unicorn valued at $1
              billion in June 2021, was acquired by Remedy Meds in 2025 for approximately $500 million in an all-stock
              deal, representing a 50% markdown. These precedents establish that the 2021-vintage private digital health
              mark-ups have faced substantial revision in the 2023-2026 period, consistent with PitchBook's 2026 Venture
              Capital Outlook finding that exit values remain below 2021 levels despite market improvement.
