  - id: TV005
    title: Thesis-Break and Kill Trigger Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - FDA enforcement naming eMed
        - Warning letter or consent decree for prescribing practices
        - Requires product change, corrective advertising, reputational damage; erodes employer trust
        - Immediate reconsideration; likely kill criterion
      - - Aon reduces/terminates partnership
        - Aon publicly announces divestment or partnership wind-down
        - Eliminates primary revenue anchor and investor alignment; devalues distribution advantage
        - Likely kill criterion; triggers mark-down review
      - - Employer GLP-1 benefit cuts >40% of client base
        - Multiple employer clients suspend or reduce GLP-1 coverage citing cost
        - Direct revenue reduction; destroys ARR ramp thesis
        - Downgrade to bear scenario; review within 90 days
      - - Series B at flat or down valuation
        - Next equity raise below $2B post-money
        - Confirms over-pricing at Series A; new entry at lower mark
        - Thesis-break signal; evaluate exit vs. average-down decision
    notes: >-
      Kill triggers are based on structural vulnerabilities identified in evidence review. Thresholds are
      management-actionable indicators with 6-12 month leading signals. Regulatory triggers require immediate response
      regardless of financial impact.
    claimRefs:
      - CV039
      - CV040
      - CV041
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - ARR and revenue run-rate
        - No disclosed ARR, revenue, or bookings as of 2026-06-28
        - Without revenue, the $2B+ multiple is unverifiable; all scenario assumptions are blind
        - Management disclosure request; target for next financing documentation
      - - Customer count and identity
        - Number and identity of employer clients not publicly disclosed
        - Concentration risk (Aon may be >50% of ARR); diversification cannot be assessed
        - Press release review; benefits consultant channel checks; LinkedIn employer announcements
      - - Member enrollment and clinical outcomes
        - GLP-1 adherence at 12 months, member engagement rates, clinical outcomes vs. baseline
        - Core value proposition requires superior retention vs. 50% population dropout rate
        - Request independent outcomes study; review Aon pilot publication if released
      - - Cap table and preference structure
        - No disclosed capitalization table, liquidation preferences, or dilution stack
        - Series A investors may face preference overhang from founder or convertible instruments
        - Request capitalization table; review Series A term sheet for preference terms
    notes: >-
      Diligence asks are derived from gaps in publicly available evidence as of 2026-06-28. All items are addressable
      through standard investor due diligence if eMed enters a structured process; items marked high severity require
      resolution before any investment decision.
    claimRefs:
      - CV006
      - CV038
