      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The budget for GLP-1 benefit management in a large self-insured employer sits primarily with the CFO and
              Chief Human Resources Officer, who set annual benefit design budgets, while HR benefits directors
              implement program selection through brokers and benefits consultants. Aon's dual role as both eMed's lead
              investor and the world's largest HR/benefits consultancy creates a direct employer distribution channel
              that bypasses the typical multi-vendor RFP cycle. This structural advantage is significant because the
              standard selling path for a new benefits vendor involves a 12-to-24-month procurement cycle with annual
              benefit-year lock-in.

              Large self-insured employers with 5,000 or more employees represent the highest-value buyer segment
              because they bear the full actuarial risk of GLP-1 utilization, employ plan populations with sufficient
              scale to produce measurable cohort outcomes, and have the administrative capacity to implement a managed
              program with clinical oversight. The KFF 2025 survey found that 43% of firms with 5,000 or more employees
              now cover GLP-1s for obesity treatment, compared with 30% in the 1,000–4,999 employee tier. Mid-market
              employers (200–4,999 employees) are a growing segment, often fully or partially insured through carriers,
              which changes the budget owner from an employer HR director to a health plan medical director. Government
              payers including Medicaid, Medicare Advantage, and the VA represent a separate and expanding channel that
              eMed cited in its founding narrative, though current public evidence on government payer contracts is
              limited. The PHTI's employer-approaches analysis confirmed that large employers increasingly require
              structured lifestyle programs and prior authorization as conditions for GLP-1 coverage, which creates
              demand for vendors who can satisfy those conditions systematically.
            claimRefs:
              - CM010
              - CM011
              - CM014
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
