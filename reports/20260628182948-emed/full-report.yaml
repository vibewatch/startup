      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver is the direct and quantifiable cost burden of obesity on employer health plans.
              Forbes and Nature-published research estimate that obesity costs US employers approximately $347–$400
              billion annually through medical expenses, presenteeism, absenteeism, and disability. The obesity cost at
              $6,472 per affected employee per year creates a compelling ROI frame for management programs priced at
              roughly $100–$200 PMPM. Aon's April 2025 workforce analysis found that medical cost growth for weight-loss
              GLP-1 users fell approximately three percentage points after 12–18 months of managed access, rising to
              seven points for users at or above 80% adherence, relative to matched non-user controls. The FDA's
              enforcement campaign against compounding GLP-1 telehealth in 2026—issuing 30 warning letters to DTC
              providers for illegal marketing— paradoxically benefits eMed by clearing undifferentiated competitors and
              validating the clinically supervised, employer-facing model.

              The most severe constraint is cost escalation at both the drug and program level. WTW reported that
              employer GLP-1 PMPM costs rose from $4.34 in 2022 to $27.23 by Q1 2025, and GLP-1s now account for
              approximately 21% of total employer prescription spending. EBRI's simulation projects that broad GLP-1
              coverage could raise employer health insurance premiums by 5.3%–13.8%, creating financial pressure that
              leads some employers to tighten eligibility or drop coverage entirely—the WTW June 2026 Pulse Survey found
              12% of employers were likely to discontinue GLP-1 coverage. Low real-world adherence is the deepest
              structural risk: a published PMC cohort study found 65% of non-diabetic GLP-1 initiators discontinued
              within one year. For eMed, this adherence gap is both the business problem it claims to solve and the
              existential threat if its own outcomes data cannot withstand independent auditing. Employer procurement
              cycle length, benefit-design lock-in, and switching cost further constrain organic growth, while market
              concentration among Novo Nordisk and Eli Lilly gives drug manufacturers significant leverage over eMed's
              drug-cost pass-through economics.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM020
