  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buyer Profile
        blocks:
          - type: paragraph
            body: >-
              eMed's primary customer segment is the self-insured employer, typically large enterprise companies with
              1,000 or more U.S. employees. The buying decision sits with HR leaders, benefits directors, and finance or
              CFO stakeholders who collectively manage population health spend. Employees and covered dependents are the
              end users of the GLP-1 program. eMed is not a direct-to-consumer pharmacy; its employer-facing value
              proposition centers on clinically managed weight-loss programs with outcome accountability rather than
              individual prescription convenience. eMed's company materials reference "more than 6 million global
              customers since its fall 2020 launch," though this figure includes early COVID-19 testing users and likely
              conflates individual testing customers with the smaller pool of employer-contracted GLP-1 program
              participants. eMed's for-businesses platform targets the self-insured segment explicitly, emphasizing
              transparent drug pricing without PBM markups, an at-home diagnostics onboarding kit, 24/7 clinical
              support, and an outcome guarantee (employers pay less if weight-loss targets are missed). The buying
              center also extends to PBM partners, most notably CVS Caremark, who serve as a distribution and formulary
              management layer.
            claimRefs:
