      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: All Revenue Assumptions Are Estimates
            body: >-
              eMed has not disclosed any ARR, revenue run-rate, customer count, or financial KPIs. All revenue-based
              valuation calculations in this chapter use employer-channel digital health benchmarks (primarily Omada
              Health S-1 and Hinge Health IPO data) as proxies. These estimates carry high uncertainty and should be
              updated immediately upon any management disclosure.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV031
              - CV032
              - CV033
          - type: callout
            title: Aon Concentration Is a Structural Deficiency
            body: >-
              Aon serves simultaneously as eMed's lead investor, most visible distribution partner, and flagship
              employer customer. This triple concentration is not merely a risk factor—it is a structural feature that
              makes the $2B+ valuation partially self-referential. Any investor evaluation must diligence the share of
              ARR attributable to Aon-sourced deals versus independently won enterprise clients. Analogously, Omada's
              Cigna concentration at 36% of revenue was disclosed in its S-1 as a material risk; eMed's comparable
              disclosure is absent.
            calloutType: risk
            claimRefs:
              - CV016
              - CV035
              - CV036
          - type: callout
            title: 'Goldman Sachs Caution: Anti-Obesity Market May Disappoint'
            body: >-
              Goldman Sachs published analysis cautioning that the anti-obesity drug market may prove smaller than
              consensus forecasts, citing patient dropout rates and payer coverage resistance as structural constraints.
              This adverse view aligns with clinical evidence that more than 50% of GLP-1 patients discontinue treatment
              within 12 months, limiting the addressable market for adherence platforms like eMed. The Goldman note
              represents a minority but credible adverse view on the GLP-1 market size assumptions that underpin eMed's
              bull-case scenario.
            calloutType: insight
            claimRefs:
              - CV025
              - CV026
              - CV027
          - type: callout
            title: Key Milestones That Would Change the Valuation Call
            body: >-
              Upgrade to "track" if eMed discloses ARR above $60M with 10+ named enterprise employer clients,
              demonstrates 12-month GLP-1 adherence above 50%, and shows Aon constitutes less than 40% of contracted
              ARR. Upgrade to "buy" if ARR exceeds $100M with a demonstrated 2-year employer retention rate above 80%,
              independent clinical outcomes peer-reviewed publication, and preparation for an S-1 filing with audited
              financials. Maintain "research-more" until any of those milestones are verifiable through public
              disclosure.
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV041
              - CV042
