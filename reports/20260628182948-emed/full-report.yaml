  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              eMed's primary revenue driver is a per-member-per-month (PMPM) platform fee charged to self-insured
              employers for clinically managed GLP-1 programs. The platform bundles at-home diagnostics,
              clinician-guided prescribing, AI-driven adherence support, and proctor-led screenings into a single
              employer benefit offering. GLP-1 drug costs are employer-borne and run through pharmacy benefit manager
              (PBM) channels, most prominently via the CVS Caremark partnership; these costs are passed through and do
              not appear on eMed's revenue line. The company has not publicly disclosed list pricing, contract minimums,
              or any realized revenue figures.

              With its March 2026 Series A, eMed announced a strategic pivot toward a capitated care model — a flat
              per-member per-year fee designed to shift clinical and cost risk to eMed rather than the employer. Under
              this structure, eMed would receive a fixed fee per enrolled member and bear responsibility for delivering
              clinical outcomes within that budget. If achieved at scale, this model converts the platform from a
              margin-over-costs subscription to an outcomes-guarantee product with actuarial risk. Revenue would be
              recognized on a straight-line PMPM basis under ASC 606, reducing the episodic volatility of
              fee-for-service telehealth billing.

              Secondary revenue streams — a consumer direct channel and Thrive Global integration for corporate wellness
              — appear modest relative to the B2B core. eMed's Thrive Global partnership, announced in late 2025,
              provides an additional distribution pathway for consumer subscriptions, but no pricing or revenue share
              terms have been disclosed. Altogether the revenue picture is highly opaque for an entity seeking a $2B+
              implied valuation: the capitated model is announced but not yet operational at commercial scale, and the
              underlying PMPM rate remains undisclosed.
