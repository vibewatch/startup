      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              eMed closed its $200M Series A in March 2026 at a valuation exceeding $2 billion, led by Aon Consulting
              with a syndicate of high-profile strategic investors including Joe Lonsdale (8VC), Antonio Gracias (Valor
              Equity Partners), Ara Cohen (Knighthead Capital), Jeff Aronin (Paragon Biosciences), Tom Ricketts, R.J.
              Melman, Tom Brady, and Linda Yaccarino. The company is incorporated in Delaware as EMED POPULATION HEALTH,
              INC. and registered as a foreign profit corporation in Florida with three disclosed directors: Linda
              Yaccarino (CEO), Jeffrey M. Schumm (CS), and Doug T. Mee. Prior funding rounds — the Aon August 2025
              strategic investment and any seed-stage capital — were either undisclosed or too small to trigger public
              announcement requirements.

              Planned use of the $200M proceeds, as stated by the company, focuses on three priorities: accelerating the
              agentic AI platform, launching the capitated care model, and strengthening the balance sheet. At a
              plausible monthly burn rate of $5–15M for a company of eMed's stage and headcount, the raise implies
              approximately 13–40 months of runway, with the midpoint scenario suggesting a next-round trigger in late
              2027 or early 2028. This estimate is highly uncertain because eMed has disclosed neither burn rate nor
              revenues. The company carries no publicly disclosed long-term debt, project-finance obligations, or
              regulatory capital requirements.

              The key capital-adequacy risk is that the capitated model requires additional actuarial reserves if it
              scales, creating potential capital consumption beyond the current $200M raise. Employer benefits decisions
              typically run on January 1 enrollment cycles, meaning any capitated contracts signed in 2026 will draw
              down operating capital through 2027. The heavy reliance on Aon as both investor and channel partner also
              means any deterioration in the Aon relationship could trigger simultaneous revenue and capital shocks.
