      - number: '3.4'
        title: Switching Costs, Lock-in, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Employer GLP-1 management benefits are inherently sticky due to the annual benefit-year procurement cycle.
              Once an employer embeds a clinical management platform into its benefit stack through a PBM integration,
              clinical workflow setup, member enrollment, and outcomes reporting, switching mid-year is operationally
              and contractually difficult. This structural lock-in applies equally to all employer-channel competitors
              including eMed. The company that wins the first benefit-year contract has an incumbency advantage going
              into renewal.

              Multi-homing is possible but economically inefficient. An employer could theoretically offer both eMed and
              a behavioral lifestyle supplement like Noom, but this adds cost and administrative complexity. In
              practice, large self-insured employers seek a single clinical management vendor per program type, reducing
              the probability of sustained multi-homing.

              Distribution power is the dimension where eMed's advantage is most visible and most concentrated. Aon
              serves more than 1,200 of the Fortune 1,500 companies as their benefits consultant. An Aon recommendation
              to install eMed effectively removes the cold-outreach phase of the enterprise sales cycle. Competitors
              like Found and Calibrate must build broker and consultant relationships incrementally. Omada has
              institutional health plan relationships but lacks a single investor-channel champion of Aon's scale.
              Teladoc has deep employer relationships from legacy Livongo, but its overall commercial trajectory has
              been declining.

              Supply and partner access to branded GLP-1 drugs is a critical dependency for all platforms. Neither
              Wegovy (Novo Nordisk) nor Zepbound (Eli Lilly) shortage resolution is complete, and access to the branded
              drugs requires pharmacy integration. Omada's Lilly Employer Connect participation and its presence in
              Lilly's preferred-access ecosystem give it a supply-side advantage that eMed has not publicly disclosed
              matching. NovoCare and LillyDirect represent the manufacturers' own effort to control the patient-facing
              layer, which reduces the criticality of management platforms if manufacturers can attach adherence tools
              directly to prescriptions. PBM giants OptumRx and CVS Caremark already control drug formularies for most
              self-insured employers; a PBM-native GLP-1 management overlay would bypass all independent platforms
              including eMed.
