      - number: '2.5'
        title: Sizing Gaps, Contradictory Estimates, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Three structural gaps limit confidence in any eMed-specific market sizing. First, the spread between
              Goldman Sachs's cautious $120 billion global anti-obesity forecast for 2035 and Morgan Stanley's $190
              billion base case ($240B bull) is not primarily a data-quality gap but a genuine disagreement on drug
              pricing trajectories, adherence sustainability, and international formulary adoption. Goldman's skepticism
              around price erosion and payer resistance is better supported by current employer behavior—Brown & Brown's
              mid-2025 survey found 31% of covering employers were considering dropping GLP-1 coverage—than the
              bull-case projections that assume sustained penetration at near-list prices.

              Second, the employer platform market estimate of $2.2 billion (2026) comes from a single market research
              publication rather than from aggregated employer spend data; no corroborating independent source for this
              specific figure was identified in the research reviewed for this chapter, which is a meaningful gap given
              how directly it anchors SAM-to-SOM math for eMed's valuation thesis.

              Third, eMed's own outcome claims—90%+ adherence, 21–22.4 lb average weight loss—come from
              company-controlled or partner-reported sources and have not been independently replicated in peer-reviewed
              research or by a neutral third-party auditor. The PMC study finding 65% real-world dropout among GLP-1
              initiators is directly at odds with eMed's adherence claim, and the discrepancy is not resolved in any
              reviewed public source. Resolving this gap—either by independent audit of eMed's cohort selection
              methodology or by third-party validation of its outcomes—is the single most important diligence step for
              assessing whether eMed's business model is structurally differentiated or narratively overstated.
            claimRefs:
              - CM006
              - CM009
              - CM013
              - CM018
              - CM019
              - CM021
              - CM026
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: FDA enforcement paradox creates competitive moat for clinically supervised platforms
            body: >-
              The FDA's 2026 wave of 30 warning letters to compounding GLP-1 telehealth providers is a structural
              tailwind for eMed. By clearing DTC competitors that market compounded GLP-1s without clinical oversight,
              FDA enforcement validates the employer-supervised model and raises the barrier for new low-cost entrants
              that eMed most directly competes against.
            calloutType: strength
            claimRefs:
              - CM025
              - CM026
              - CM027
          - type: callout
            title: Adherence claims are at direct odds with published real-world dropout data
            body: >-
              eMed claims 90%+ member adherence for its managed GLP-1 program, but a published PMC cohort study found
              approximately 65% of non-diabetic GLP-1 users quit within one year under real-world conditions. Until an
              independent audit explains how eMed's cohort selection, program design, or outcome measurement methodology
              produces results that diverge so sharply from the population average, the adherence claim is a material
              open question.
            calloutType: risk
            claimRefs:
              - CM013
              - CM018
              - CM019
          - type: callout
            title: Employer GLP-1 cost pressure creates coverage withdrawal risk that shrinks the SAM
            body: >-
              A sizable minority of employers are actively reconsidering GLP-1 coverage. Brown & Brown found 31% of
              covering employers may drop coverage within 12-24 months. If large employers scale back coverage, eMed's
              addressable employer pool contracts regardless of drug efficacy. The SAM depends on employers continuing
              to both cover GLP-1s and pay for structured management programs, making this dual-dependency a key risk
              for eMed's growth thesis.
            calloutType: risk
            claimRefs:
              - CM013
              - CM017
              - CM036
              - CM037
          - type: callout
            title: Aon's dual investor and channel role compresses the employer sales cycle
            body: >-
              Standard employer benefits vendor selling takes 12-24 months; Aon as both lead investor and world's
              largest HR consultancy gives eMed a structural shortcut. The same dynamic that validates the distribution
              thesis also creates customer concentration risk that diligence should quantify.
            calloutType: insight
            claimRefs:
              - CM023
              - CM031
              - CM033
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              eMed's competitive universe is best understood through five distinct categories of alternatives that an
              employer benefits buyer could choose instead of eMed's managed GLP-1 program.

              The first and most relevant category is direct employer GLP-1 management platforms — companies that, like
              eMed, sell outcomes-accountable, clinically supervised GLP-1 programs to self-insured employers as benefit
              line items. These include Calibrate (which reports 19 percent average body weight loss over three years
              and has pivoted explicitly to employer B2B after earlier DTC struggles), Found Health (which operates
              "Found for Business," claims 5.1x employer ROI, and has conducted more than one million clinical consults
              since 2019), Noom Med (the GLP-1 prescribing arm of the 15-year-old behavioral-science platform, which
              operates a GLP-1 Companion specifically for employer populations already on medication), Omada Health (a
              public-company-bound cardiometabolic platform with 1M-plus lifetime members and a new Lilly Employer
              Connect partnership that improves branded-drug access), and Vida Health (a 12-year cardiometabolic-care
              specialist that won the 2026 MedTech Breakthrough Award for Best Virtual Care Platform).

              The second category is DTC-focused telehealth platforms that primarily serve individual consumers but have
              some employer-adjacent reach. Hims & Hers sells GLP-1 medications starting from $149 per month and focuses
              on branded-drug access following FDA enforcement against compounded semaglutide. Ro Body operates through
              its Ro Body membership for individual GLP-1 access. Both lack the employer channel depth, outcomes
              accountability infrastructure, and risk-transfer models that eMed emphasizes.

              The third category is incumbent large-scale telehealth platforms. Teladoc Health offers an employer weight
              management program with connected smart-scale hardware, personalized coaching, and its legacy Livongo
              diabetes-management infrastructure — but has struggled financially and does not position the product as a
              dedicated GLP-1 management solution. Included Health provides care navigation and GLP-1 support as part of
              a broader all-in-one employee health benefit, with customer proof points including Salesforce, AT&T, and
              lululemon.

              The fourth and most important status-quo substitute is unmanaged GLP-1 prescribing through a primary care
              physician combined with PBM formulary coverage. OptumRx, CVS Caremark, and Express Scripts control the
              GLP-1 formulary for most self-insured employers and could add clinical management overlays directly. This
              "internal build" option (employers adding GLP-1 management to existing vendor contracts) and the
              PBM-managed substitute represent eMed's largest non-vendor competitive threat.

              The fifth category is drug maker direct programs. LillyDirect provides access to Zepbound and other Eli
              Lilly medicines through independent telehealth providers with free delivery and transparent pricing.
              NovoCare's patient support program offers Wegovy access, cost-support tools, and prescription coordination
              directly through the Novo Nordisk network. If drug makers succeed in disintermediating platform layers,
              the addressable fee-for-service pool shrinks materially for all management platforms.
