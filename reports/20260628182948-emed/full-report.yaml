      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >-
              eMed's moat durability case rests on four claims: the Aon distribution channel, proprietary at-home
              diagnostics infrastructure, an AI engagement platform with compounding behavioral data, and a capitated
              pricing model that aligns incentives with employer outcomes. Each merits scrutiny.

              The Aon channel is real but carries concentration risk. If Aon were to diversify its GLP-1 management
              recommendation to multiple vendors, offer competing platforms, or negotiate exclusivity provisions that
              favor other partners, eMed's distribution advantage would erode quickly. The fact that Aon is both lead
              investor and channel partner makes the governance of this relationship an unresolved diligence question:
              at what point does Aon's fiduciary duty to employer clients diverge from its financial stake in eMed?

              The at-home diagnostics moat is real in the sense that no peer has the same COVID-era regulatory and
              operational history — but it is replicable. A competitor with sufficient capital could build or acquire
              home-testing capability within 12 to 24 months. The moat is more a time-to-market advantage than a
              structural barrier.

              The AI engagement platform is difficult to evaluate without independent review. eMed's 90%-plus adherence
              claim is more than twice the ~40% real-world adherence rate documented in published literature for
              unmanaged GLP-1 users. The discrepancy may reflect genuine eMed-specific effectiveness (the managed
              program, higher engagement, at-home diagnostics), or it may reflect cohort selection (motivated employer
              enrollees differ from general population). Until an independent audit resolves this gap, the AI moat is
              partially supported but not confirmed.

              Adverse competitor signals that diligence should track include: WeightWatchers' financial restructuring
              following GLP-1 market disruption (illustrating how rapidly the market can disable an incumbent with poor
              strategic positioning); Calibrate's earlier DTC-to-employer pivot following market challenges (showing
              that B2C to B2B pivots in this space are common and can indicate prior business model stress); and the FDA
              March 2026 enforcement action against 30 telehealth companies (adverse to the sector and to any eMed
              competitor using compounded agents, but also signaling ongoing regulatory vigilance that could evolve to
              cover eMed's own practices). The SEC S-1 filing by Omada in May 2025 provides the most extensive
              public-facing risk factor disclosure for a direct peer, and investors should read its competitive risk
              factor section as a proxy for the structural risks facing eMed as well. Commoditization of AI coaching
              tools and PBM disintermediation are the two highest-severity long-term displacement risks.
