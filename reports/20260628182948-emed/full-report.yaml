      - number: '7.2'
        title: Clinical Safety, Adherence, and Reimbursement Risk
        blocks:
          - type: paragraph
            body: >-
              The most underappreciated risk for eMed is the clinical evidence gap on GLP-1 adherence and long-term
              outcomes. Published real-world studies consistently find that 30–50% of GLP-1 patients discontinue therapy
              within the first 12 months, driven by gastrointestinal side effects, out-of-pocket cost, and inadequate
              behavioral support. A June 2026 MedicalXpress study confirmed that most patients who stop GLP-1
              medications regain substantial weight within a year. Healthline's review of real-world data reached the
              same conclusion for Ozempic users. These population-level persistence rates define the benchmark against
              which eMed's adherence program must demonstrate superiority—and eMed has not publicly disclosed its own
              adherence or 12-month persistence benchmarks, making the value proposition unverifiable from the outside.
              FDA drug safety communications warn of serious adverse events including pancreatitis and thyroid C-cell
              tumors, creating ongoing pharmacovigilance obligations for platforms managing large GLP-1 patient
              populations at scale.

              Employer benefit design risk has escalated sharply. The Business Group on Health's 2026 GLP-1 survey
              documented increasing adoption of prior authorization, step therapy, quantity limits, and outcome-based
              coverage criteria. KFF and Health System Tracker data confirm that fewer than 25% of large employers had
              comprehensive GLP-1 obesity benefits as of mid-2025, with cost as the primary barrier. Employers covering
              branded GLP-1s face annual per-covered-employee drug costs of $5,000–$15,000. Forbes (June 2026) reported
              that health plans are beginning to stop paying for GLP-1 drugs. BenefitNews documented employers cutting
              coverage mid-cycle. Self- insured employer plans retain the legal right to modify benefit design
              annually—often on 30-day notice—meaning an enrolled program in January can face benefit retreat by
              December.

              CVS Caremark, eMed's PBM distribution partner, implements utilization-management controls on GLP-1s
              including prior authorization and step therapy, directly constricting eMed patient starts. WTW's June 2026
              survey found most employers are not yet changing GLP-1 coverage, suggesting stability—but growing
              cost-management intent will intensify unless adherence evidence validates clinical ROI. eMed's absence of
              published clinical outcomes data is the critical vulnerability: without peer-reviewed adherence
              benchmarks, employers cannot independently validate program efficacy versus cheaper alternatives.
