      - number: '4.3'
        title: Cost Structure and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              eMed's cost structure comprises four primary buckets: clinical staff (physicians, nurse practitioners,
              care coordinators), the agentic AI platform (engineering, infrastructure, model training), at-home
              diagnostics and care kits (physical inventory and fulfillment), and general and administrative overhead.
              Unlike pure telehealth platforms, eMed's at-home blood-testing component adds real cost-of-goods-sold
              exposure that most software-first competitors avoid. This creates a unit-economics trade-off: higher
              per-member cost but a stronger clinical differentiation argument.

              Public comparables bracket the plausible margin range. Hims & Hers Health (NYSE: HIMS), the most
              comparable public company, filed its FY2025 10-K with the SEC on February 23, 2026, reporting gross
              margins of approximately 81 percent on weight-management revenue that scaled sharply on GLP-1 demand.
              Omada Health's S-1, filed with the SEC on May 9, 2025 and amended May 29, 2025, disclosed a digital
              chronic-care gross margin profile in the 60–70 percent range for its employer programs before GLP-1
              volumes matured. For eMed, excluding pass-through drug costs, a gross margin of 60–78 percent on the
              management-platform component is plausible given the at-home diagnostics component. Including drug cost
              passthrough would suppress the stated margin further, but that depends on whether eMed's PMPM is a net or
              gross revenue line.

              Under a capitated model, cost structure risk shifts materially: eMed would bear the full clinical cost if
              adherence slips or adverse-event rates rise, creating actuarial risk that pure-software margins do not
              carry. No capex intensive assets (manufacturing, clinical facilities) are publicly disclosed. Working
              capital requirements are uncertain given the physical kit component.
