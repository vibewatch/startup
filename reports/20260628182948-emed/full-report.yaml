      - number: '3.2'
        title: Direct and Adjacent Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Calibrate is eMed's closest direct analog in the employer market. The company combines
              clinician-prescribed GLP-1 medication with one-on-one video coaching and science-backed reading
              curriculum. Its stated outcome is 19 percent average body weight loss achieved over three years. Calibrate
              explicitly markets employer coverage as part of its patient-acquisition model, listing participating
              employers and directing prospective members to check whether their company covers the program. Calibrate's
              emphasis on lifestyle change alongside medication, and its multi-year time horizon, differentiates it from
              shorter-engagement competitors, though the company has faced earlier DTC market challenges before pivoting
              toward employer partnerships.

              Found Health (operating as "Found for Business" for employer clients) is arguably the most credentialed
              peer in terms of clinical volume. The company has conducted over one million clinical consults since its
              2019 founding, giving it the largest real-world dataset among employer GLP-1 management platforms. Found's
              MetabolicPrint personalization engine assigns each member one of four metabolic profiles to tailor
              treatment. Its medication toolkit extends to ten or more options including non-GLP-1 alternatives,
              enabling Found to manage formulary constraints that limit drug access for some employees. Found's
              in-network status with major insurers allows employers to run clinical consults as claims, reducing
              program cost.

              Noom operates across two relevant employer products. Its Noom Health employer platform delivers the
              company's well-established psychology-based behavioral program (a CDC- recognized Diabetes Prevention
              Program) as well as diabetes management. Noom Med adds GLP-1 prescribing capability, and the GLP-1
              Companion program provides tailored lifestyle support for employees already on GLP-1 medications. Noom's
              15-plus-year behavioral-science heritage and its scale (programs across many organizations globally)
              differentiate it from newer pure-GLP-1 entrants, though Noom's GLP-1 prescribing arm is newer and less
              battle-tested than its behavior-change core.

              Omada Health is the most institutionally established direct peer. Founded to address digital diabetes
              prevention, Omada has since expanded into full cardiometabolic and musculoskeletal care for employers. Its
              GLP-1 Care Track provides food and activity coaching, medication assistance for GLP-1 side effects,
              dedicated health coaches, and behavioral health support. Omada's 2026 Lilly Employer Connect partnership
              expands branded-drug access for its employer clients. Most significantly, Omada filed an S-1 registration
              statement with the SEC in May 2025 signaling a public-market ambition that, if successful, would give
              Omada a balance-sheet and recruiting advantage over private peers including eMed. Omada's resource center
              shows Q1 2026 results, Goldman Sachs conference participation, and peer-reviewed studies as evidence of
              institutional credibility.

              Vida Health is a 12-year-old cardiometabolic specialist focused on metabolic conditions including obesity
              and related comorbidities. It won the 2026 MedTech Breakthrough Award for Best Virtual Care Platform and
              explicitly integrates with existing health plans and PBMs, positioning itself as an enhancement rather
              than replacement for existing benefits. Vida's decade-plus track record and multi-condition depth give it
              cross-sell optionality that single-condition GLP-1 platforms lack.

              Teladoc Health is the largest incumbent. Its Weight Management program is part of a broader virtual-care
              platform that also covers mental health, diabetes prevention, hypertension, and dermatology. Teladoc's
              Livongo chronic-care brand, now integrated into the platform, gives it deep employer relationships for
              diabetes management that could extend naturally into obesity management. However, Teladoc's weight
              management program emphasizes connected scale hardware and behavioral coaching rather than dedicated GLP-1
              prescribing management, and the company has faced financial and operational challenges that have weakened
              its growth profile.

              Hims & Hers focuses on direct-to-consumer GLP-1 access for individuals and has not built a material
              employer-benefits sales motion. Its weight loss product includes brand-name Wegovy starting from $149 per
              month and the new Wegovy pill. Hims appointed Dr. Anant Vinjamoori as Chief Medical Officer in June 2026.
              Ro Body offers similar DTC access, with Serena Williams and Charles Barkley as brand ambassadors and a
              broad set of named GLP-1 options. FDA enforcement against compounded semaglutide has shifted both Hims and
              Ro toward branded drugs, reducing their low-cost DTC competitive advantage but also validating the
              supervised clinical model that eMed positions.

              Included Health provides care navigation and GLP-1 support as part of its integrated employer health
              benefit platform. It differentiates through whole-person care coordination with verified employer case
              studies at Salesforce, lululemon, and AT&T, and reports greater than 4 percent reduction in healthcare
              trend for clients in year one.
