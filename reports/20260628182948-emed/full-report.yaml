        title: Funding, Capital Formation & Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              The clearest current anchor for eMed's capitalization is its March 2026 Series A: $200M at a valuation
              above $2B, led by Aon Consulting, with a syndicate of wealthy individuals and strategic operators
              including Tom Brady, Linda Yaccarino, Joe Lonsdale, Antonio Gracias, Jeff Aronin, Ara Cohen, R.J. Melman,
