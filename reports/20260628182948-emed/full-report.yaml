    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity & Business Model
        blocks:
          - type: paragraph
            body: >-
              eMed is a Miami, Florida-based telehealth company that Reuters described as founded in 2020 and focused on
              employer and government-payer management of GLP-1 utilization. The company now positions itself as an
              employer platform for clinically supervised GLP-1 and broader population-health programs rather than a
              pure direct-to-consumer prescription service. Public descriptions across the March 2026 financing
              announcement, the August 2025 Aon investment release, and Reuters coverage consistently describe the
              operating stack as a digital-first workflow combining at-home diagnostics, clinician-guided prescribing,
              continuous adherence support, and AI-enabled engagement. That positioning matters because it frames eMed
              less as a convenience telehealth storefront and more as a benefits-management vendor selling cost control,
              adherence, and medical oversight to self-insured employers. The same sources also show that eMed still
              references a direct-to-consumer offering, but the center of gravity in public messaging has shifted toward
              employer-sponsored obesity and chronic-care programs.
