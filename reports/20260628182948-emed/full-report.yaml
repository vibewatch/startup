      - number: '3.3'
        title: Capability, Pricing, and GTM Comparison
        blocks:
          - type: paragraph
            body: >-
              On the capability dimension, eMed's strongest differentiators are its at-home diagnostics workflow
              inherited from the Abbott BinaxNOW partnership, the AI-enabled engagement layer described as an "empathic
              agentic AI platform" in company materials, and the Aon-anchored direct employer channel. Calibrate, Found,
              and Noom each offer their own proprietary engagement tools, but none have documented the same at-home
              diagnostic capability or a strategic investor that is simultaneously their primary distribution partner.
              Omada's Lilly partnership and IPO track are legitimate capability accelerators that eMed lacks — Omada
              would gain access to branded-drug preferred networks and patient acquisition through Lilly's
              infrastructure.

              On pricing, the market shows a bifurcation between per-member management fees for employer programs and
              direct subscription prices for DTC channels. Hims & Hers starts at $149 per month for Wegovy pill with
              prescription included. Calibrate structures its program as an employer-covered benefit with cost varying
              by employer arrangement. Found for Business projects a $4,204-per-year cost saving per covered life
              without GLP-1 formulary coverage and higher with coverage, monetizing the ROI argument as a sales anchor.
              eMed's public materials emphasize a capitated model (flat-fee risk sharing) rather than a per-prescription
              pass-through fee, which is meaningfully different from peer pricing and could be the most defensible
              pricing structure if adherence and outcomes hold up under audit.

              On GTM and distribution, the structural gap between eMed and most direct peers is the Aon channel. Aon's
              position as the world's largest HR and benefits consultancy means eMed enters employer conversations as a
              recommended vendor rather than an unsolicited outside vendor seeking a 12-to-24-month RFP cycle. Most
              direct peers sell through health plan integrations, broker networks, or direct employer outreach — none
              with a single investor who is simultaneously a channel partner of Aon's scale. This is eMed's most durable
              near-term moat.

              On regulatory and trust posture, the FDA March 2026 warning letters to 30 telehealth companies for false
              claims about compounded GLP-1 products damaged the competitive position of DTC platforms that relied on
              compound semaglutide as a low-cost entry point. eMed's supervised clinical model positions it as the
              compliant alternative, even if its own regulatory scrutiny posture remains undisclosed in public sources.
              Hims & Hers has faced compounding enforcement pressure directly. Omada's S-1 filing provides the most
              complete public disclosure of regulatory risk factors among listed peers.
