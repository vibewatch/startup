      - number: '6.2'
        title: Named Customer Evidence and Proof Points
        blocks:
          - type: paragraph
            body: >-
              Aon, the global professional services and benefits consulting firm, is eMed's most publicly documented
              employer customer. Aon is also a strategic investor, having announced an investment in August 2025 and
              subsequently deploying the eMed GLP-1 Weight Management Program for its U.S. workforce for the 2026 plan
              year. The Aon 2026 new-hire benefits guide explicitly names the program and indicates employees enrolled
              in an Aon medical plan receive a lower prescription drug copayment for GLP-1 medications through the eMed
              platform. Lisa Stevens, Aon's Chief People and Administrative Officer, stated publicly that "colleagues
              are staying on the medication longer and seeing meaningful improvements in weight and BMI compared to
              before the program." Axios reported approximately 9% of eligible Aon employees enrolled in the pilot
              program. Separately, eMed's employer-facing platform page, citing Aon Workforce-Focused Phase Two Analysis
              findings from January 2026 and internal matched lab data from December 2025, claims a +90% program
              adherence rate, an average weight loss of 25 lbs per member, and a 14.2-month average program duration.
              eMed's Aon collaboration press release cites the partnership's context of Aon's analysis showing a
              7-percentage-point reduction in medical spend growth in year two of GLP-1 therapy and a 44% reduction in
              hospitalization risk for major adverse cardiovascular events among adherent GLP-1 users. CVS Caremark is a
              second named partner; through an arrangement announced in early 2026, employers using CVS as their PBM can
              offer eMed's weight management services with the employers choosing their own subsidy level. CVS Caremark
              manages prescription benefits for up to 30 million Americans, giving eMed significant potential reach via
              that channel. Thrive Global provides the lifestyle coaching companion program integrated into the eMed app
