      - number: '1.5'
        title: Adverse Flags & Unresolved Questions
        blocks:
          - type: paragraph
            body: >-
              The biggest diligence issue is not whether eMed has market momentum; public sources clearly show it does.
              The harder question is whether the company has durable, defensible economics and governance underneath the
              momentum. Much of the quantitative case is company-reported through press releases rather than
              independently audited, including adherence, ROI, and biomarker improvement claims. Independent reporting
              also notes that the broader GLP-1 telehealth sector faces growing scrutiny around safety, marketing, and
              regulatory gaps, which matters even if eMed is positioning itself as the more clinically disciplined
              alternative. Axios added a more specific reputational wrinkle by noting questions around Tom Brady's
              connection to Alex Guerrero, who had previously settled FTC matters over health-product claims. Meanwhile,
              current revenue, customer count, board composition, payer mix, and detailed headcount remain undisclosed.
              The result is a company with strong narrative traction but still limited public evidence on governance
              quality and underlying unit economics.
