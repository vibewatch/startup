      - number: '5.3'
        title: Integrations & Ecosystem Dependencies
        blocks:
          - type: paragraph
            body: >-
              eMed's operating model depends on four external partners whose strength and terms directly determine the
              platform's clinical, commercial, and technical viability. CVS Caremark, the largest US pharmacy benefit
              manager serving up to 30 million commercial lives, provides the drug access and preferred pricing layer.
              Yaccarino described the pricing as "the most cost-effective price point that's available in the market,"
              and CVS confirmed the partnership adds another GLP-1 access pathway through its business. The integration
              architecture between eMed's prescribing portal and CVS Caremark's formulary management system is not
              described publicly, creating operational opacity around substitution risk if either party changes terms.

              Thrive Global provides the behavior-change and lifestyle coaching layer. The GLP-1 Companion program
              delivers Microstep-based interventions for food, movement, sleep, stress, and connection. The partnership
              announcement references a URL (thriveglobal.com/integrations/emed), suggesting a formal integration
              endpoint, but the data flow and handoff protocols between the two platforms are not detailed.

              Aon serves as both lead investor and primary distribution channel. Its role as lead investor in the Series
              A creates a structural conflict: the pilot data supporting eMed's commercial case was generated by an
              Aon-run program on Aon's own workforce, reported by Aon. This makes the proof-point data non-independent.
              However, it also means eMed has a deeply aligned channel partner with 50,000-plus employer clients and an
              institutional interest in eMed's commercial success. If the Aon relationship were to sour, eMed would
              simultaneously lose capital, primary case-study data, and enterprise distribution.

              The home-testing hardware and laboratory processing represent a fourth dependency that is entirely opaque.
              The specific at-home blood collection device vendor, the CLIA-certified lab receiving samples, turnaround
              time, and logistics partner are all undisclosed. Any supply chain disruption, lab quality event, or device
              recall in this layer would directly interrupt the biomarker-testing component that differentiates eMed
              from simpler prescription-only telehealth models.
