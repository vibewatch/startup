      - number: '7.4'
        title: Concentration, Brand, and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              eMed's dependency on Aon spans three simultaneous roles: strategic lead investor (August 2025), anchor
              employer customer (via the Aon colleague GLP-1 benefit program launched early 2026), and primary
              distribution channel. This tri-role concentration is structurally unusual. If Aon's senior HR leadership
              shifts strategy—diversifying GLP-1 vendors, pivoting to a competing platform, or deprioritizing GLP-1
              benefits amid cost pressure—eMed loses revenue, distribution, and market-credibility signal
              simultaneously. Aon's Phase Two GLP-1 workforce analysis (January 2026) explicitly acknowledged cost
              containment as a growing employer priority—precisely the pressure that might trigger diversification away
              from eMed's high-touch model. No public disclosure quantifies eMed's revenue concentration by customer.

              Tom Brady's Chief Wellness Officer designation, announced alongside the March 2026 Series A, creates brand
              dependency on a non-clinical public figure. Brady's longtime wellness collaborator Alex Guerrero has faced
              FTC scrutiny for marketing unsubstantiated health supplements, creating indirect reputational exposure for
              eMed's FDA-regulated prescribing operations. Any media coverage linking Brady's eMed affiliation to
              Guerrero's prior regulatory exposure could generate disproportionate attention. Linda Yaccarino's August
              2025 CEO appointment brings media-company experience but carries residual narrative from her contentious
              departure from X, attracting media scrutiny that could resurface.

              Governance and disclosure risk is material at eMed's scale. With a $2B+ valuation and $200M raised, eMed
              has no publicly disclosed audited financials. Its company-claimed 50,000+ active patient count is not
              independently verified. The FTC and SEC increasingly monitor fundraising claims in high-profile
              digital-health rounds for material misstatements. No public enforcement records name eMed as of June 2026,
              but the absence of public records does not preclude active investigation, and private company opacity
              creates due-diligence risk at every financing stage.
