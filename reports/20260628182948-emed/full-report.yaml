      - number: '5.2'
        title: Technology Architecture & AI Claims
        blocks:
          - type: paragraph
            body: >-
              eMed's technology positioning centers on what it calls an "empathic agentic AI platform." Tom Brady's
              investment statement in the March 2026 Series A announcement used the phrase verbatim: "eMed's empathic
              agentic AI platform, combined with the strength of its people and partners." The Series A press release
              also stated that proceeds would be used to "further advance eMed's agentic AI platform." Beyond
              brand-level description, no technical architecture details have been made public: there is no disclosed
              cloud provider, no named LLM or AI model vendor, no public API documentation, no product engineering blog,
              and no public GitHub repository.

              The term "empathic agentic AI" signals a marketing positioning around conversational, proactive AI that
              initiates patient engagement rather than waiting for a patient query. Agentic AI architectures in
              healthcare typically involve LLM-backed orchestration loops that can trigger actions (schedule a check-in,
              flag a missed dose, adjust coaching message) based on member state. Whether eMed has built such an
              orchestration layer or is applying the term to a rules-based automated engagement system cannot be
              verified from public evidence. This opacity is the most significant technical diligence gap: if the AI is
              genuinely agentic, it may qualify as a software-as-a-medical-device (SaMD) under FDA Digital Health Center
              of Excellence guidance, triggering 510(k) or De Novo review obligations.

              For healthcare data interoperability, any platform connecting employer HR systems, pharmacy benefit
              managers, and telehealth prescribers is expected to comply with HL7 FHIR US Core standards under ONC
              information-blocking rules; eMed has not publicly confirmed FHIR implementation. No Stack Overflow tag,
              Hacker News thread, public Discord, or GitHub repository with eMed authorship was found, which is
              consistent with a closed-source proprietary stack but makes independent technical assessment impossible.
