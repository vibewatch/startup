      - number: '5.4'
        title: Compliance, Trust & Regulatory Dependencies
        blocks:
          - type: paragraph
            body: >-
              eMed operates in an environment of intensifying regulatory scrutiny for telehealth GLP-1 companies. The
              FDA issued warning letters to 30 telehealth companies and outsourcing facilities in late 2025 for
              illegally marketing compounded GLP-1 medications. eMed is not listed among the enforcement targets, and
              its CVS Caremark partnership routes patients to branded (non-compounded) semaglutide and tirzepatide
              through the PBM channel, positioning the company on the compliant side of the compounding line. This
              regulatory differentiation is not incidental: it is a core element of eMed's value proposition to
              risk-aware self-insured employers who cannot afford the liability of covering compounded drugs whose
              safety the FDA has questioned.

              HIPAA compliance is mandatory for any entity handling protected health information in telehealth. eMed has
              not published a HIPAA compliance attestation, SOC 2 Type II audit report, or named a HIPAA privacy officer
              in any reviewed public source. The NPI registry confirms eMed Population Health, Inc. (NPI 1639018609)
              operates as a primary care / waived-testing provider entity in Miami, FL, establishing medical entity
              credibility, but the NPI record does not speak to data-security certifications. For at-home blood testing
              to qualify under CLIA waiver, either the collection device must be FDA-cleared for waived testing at the
              point of collection, or eMed must use a CLIA-certified laboratory receiving mailed samples. The specific
              pathway is not disclosed, leaving ambiguity about the regulatory basis for the diagnostics module.

              DEA telehealth prescribing rules underwent substantial change in 2023-2026, with temporary COVID-era
              flexibilities expiring and new telemedicine frameworks being proposed. GLP-1 drugs (semaglutide,
              tirzepatide) are not Schedule I or II controlled substances, so the most restrictive DEA prescribing rules
              do not directly apply to eMed's GLP-1 workflow. However, multi-state prescriber licensing remains a
              constraint: each telehealth provider in eMed's network must hold licenses in the member's state of
              residence, and the composition and geographic coverage of that prescriber network is not disclosed. For
              employers with nationally distributed workforces, any coverage gaps would undermine the benefit's reach.

              On the consumer trust dimension, eMed's BBB profile was accessible with no unresolved government action or
              significant consumer complaint pattern, and no FTC action against eMed was identified in reviewed public
              materials. Tom Brady's reported ties to Alex Guerrero — who twice settled FTC matters over health-product
              claims — were noted by Axios as a reputational concern for eMed's leadership team, though no FTC action
              extends to eMed itself.
