      - number: '4.2'
        title: GTM Motion and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              eMed's go-to-market strategy is anchored by a direct enterprise sales motion targeting self-insured
              employers, using Aon as both a strategic distribution partner and a commercial proof point. Aon's August
              2025 investment followed its own internal deployment of an eMed-built GLP-1 program for US employees:
              within six months, more than 1,200 employees enrolled, achieving an average weight loss of 22.4 pounds and
              a 95 percent retention rate. These metrics, reported by Aon, serve as the primary reference case eMed
              brings to prospective employer clients.

              The dual Aon role — lead investor in the March 2026 Series A and channel partner for employer distribution
              — is the most unusual structural feature of eMed's GTM model. Aon's 50,000-plus employer benefits
              consulting clients represent a captive distribution surface unavailable to peers. However, it also means
              eMed's early commercial validation data flows through a party with direct financial interest in the
              company's success, creating a conflict of interest when those metrics are used in third-party employer
              sales pitches. This dependency also elevates channel concentration risk: if the Aon relationship
              deteriorates or Aon exits its eMed position, eMed loses both capital and distribution simultaneously.

              The typical enterprise benefits sales cycle — request-for-proposal, clinical review, legal and compliance
              vetting, benefit-design integration — runs six to eighteen months at self-insured employers, meaning the
              March 2026 capital raise is likely funding pipeline development that will not yield substantial recurring
              revenue until late 2026 or 2027 at the earliest. CAC, sales cycle duration, quota attainment, and pipeline
              metrics are all undisclosed.
