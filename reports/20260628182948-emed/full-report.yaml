        title: COVID Testing Roots, GLP-1 Pivot & Scale Signals
        blocks:
          - type: paragraph
            body: >-
              eMed's historical edge is that it did not emerge directly from the 2025-2026 GLP-1 boom. The company
              gained early scale through its partnership with Abbott on virtually guided at-home BinaxNOW COVID-19
              testing under FDA emergency authorization in December 2020, with Abbott and eMed targeting 30M at-home
              tests in Q1 2021 and another 90M in Q2 2021. That pandemic-era operating model established several
              capabilities that are relevant to the current employer GLP-1 thesis: remote identity and screening
              workflows, telehealth-assisted diagnostics, regulated reporting, and home-based patient support. By
              2025-2026, the narrative had shifted from testing to obesity management. Aon's pilot and eMed's own
              financing materials emphasize 90%+ adherence, average weight loss around 21-22.4 pounds, and biomarker
              improvement rather than testing throughput. The company also broadened distribution with CVS Caremark and
              Thrive Global partnerships, suggesting a move from point-solution telehealth into employer benefit
              infrastructure.
