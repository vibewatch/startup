  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition & Care Pathway
        blocks:
          - type: paragraph
            body: >-
              eMed describes itself as "the world's first end-to-end GLP-1 care platform built on Empathetic AI™." The
              patient-facing care pathway moves through five sequential steps: at-home eligibility diagnostics using a
              blood collection kit; a proctor-led virtual screening to confirm medical eligibility; clinician evaluation
              and GLP-1 prescription through a licensed telehealth provider network; drug dispensing via the CVS
              Caremark pharmacy benefit manager at negotiated pricing; and ongoing AI-driven adherence support including
              weekly check-ins, biannual blood testing, and real-time coaching. The employer purchases access as a
              per-member-per-month benefit, and can choose how much of the drug cost to subsidize, creating a flexible
              cost-sharing arrangement.

              The diagnostic layer originated from eMed's COVID-era proctor model, in which the company provided a live
              virtual guide during Abbott BinaxNOW at-home rapid tests under FDA emergency use authorization. That
              infrastructure — home test kit fulfillment, identity verification, live virtual proctor, regulated result
              reporting — transferred into the GLP-1 workflow as the at-home blood collection module. Unlike the COVID
              model, the current GLP-1 diagnostics measure cardiometabolic biomarkers rather than a single pathogen, and
              the blood sample is sent to a laboratory rather than read at the test site. The specific blood-collection
              device, CLIA laboratory partner, and panel of tested biomarkers are not named in publicly available
              materials.

              The Thrive Global partnership, announced in late 2025, adds a behavior-change layer. Thrive contributes
              its GLP-1 Companion program — digital and coaching support covering food, movement, sleep, stress
              management, and social connection — layered on top of eMed's clinical workflow. The partnership is
              described as integrated, but the technical handoff between eMed's clinical platform and Thrive's behavior
              app is not detailed in public disclosures.
