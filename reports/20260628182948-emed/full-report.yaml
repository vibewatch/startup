  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: standard
    summary: >-
      Logical chain from eMed's key evidence pillars and gaps to the research-more recommendation and stretched
      valuation stance.
    data:
      nodes:
        - id: mkt
          label: 'Large market opportunity: $157B GLP-1 by 2035 (ResearchAndMarkets)'
        - id: anchor
          label: 'Aon anchor: investor + distribution + customer (circular, concentrated)'
        - id: comp
          label: 'Comp set: Hims 4.3x, Omada 7-10x, Hinge 7-8x, Teladoc <1x'
        - id: gap
          label: 'Critical gap: no disclosed ARR, no customer count, no clinical outcomes'
        - id: risk
          label: 'Structural risk: Aon concentration, FDA enforcement, employer cost sensitivity'
        - id: rec
          label: 'Recommendation: research-more | Valuation stance: stretched | Confidence: low'
      edges:
        - from: mkt
          to: rec
          label: Supports upside
        - from: anchor
          to: risk
          label: Drives concentration
        - from: comp
          to: rec
