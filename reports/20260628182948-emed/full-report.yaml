      - number: '7.5'
        title: Financing, Valuation, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              eMed's $2B+ valuation established in March 2026 prices in substantial growth expectations— multi-fold
              patient expansion from the disclosed ~50,000 active base and sustained enterprise contract growth. Five
              thesis-break events would materially compress valuation and challenge the Series B path: (1) an FDA
              warning letter or FTC enforcement action naming eMed directly; (2) peer-reviewed clinical evidence showing
              adherence rates at or below unmanaged GLP-1 therapy; (3) Aon reducing its eMed program commitment or
              diversifying to competing vendors; (4) sustained GLP-1 coverage retreat among self-insured employers
              shrinking the addressable pool below breakeven trajectory; or (5) biosimilar semaglutide entry (projected
              2026–2027) compressing branded-drug pricing and removing the cost-management narrative.

              Financing risk is temporal. The $200M Series A provides multi-year runway but sets a high growth bar.
              Employer enterprise sales cycles span 6–18 months; headcount scaling for clinical, engineering, and
              enterprise sales functions creates substantial cash burn. Digital health sector comparables are
              cautionary: WeightWatchers filed for Chapter 11 bankruptcy in 2024 following GLP-1 disruption; Calibrate
              underwent workforce reductions; Omada Health IPO'd at a compressed revenue multiple in 2025. These
              precedents demonstrate that employer digital-health valuations are highly sensitive to growth trajectory
              and outcomes evidence. eMed has no disclosed path to profitability, making a down-round scenario plausible
              if 2026 expansion targets are missed.

              Investors should monitor: new employer contracts signed per quarter (vs. Aon channel dependency), any
              regulatory correspondence between eMed and FDA or FTC, Brady's continued public endorsement of
              branded-drug clinical claims, and annual employer benefit survey data on GLP-1 coverage trajectory. Kill
              criteria are anchored around three measurable events: named FDA or FTC enforcement against eMed; published
              data showing adherence at or below unmanaged-care baseline; and any Aon statement indicating
              diversification of its GLP-1 vendor slate. Quarterly adherence and retention data disclosure should be a
              condition of continued institutional confidence.
