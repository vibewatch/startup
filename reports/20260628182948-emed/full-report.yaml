      - number: '8.4'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for eMed centers on the convergence of three secular trends: the explosive growth of
              GLP-1 prescriptions in employer-sponsored health plans, the proven model of employer-channel digital
              health (Omada's 128% NRR validates retention in that channel), and eMed's first-mover advantage in
              AI-enabled adherence management. The Aon anchor provides both near-term commercial validation and a
              distribution flywheel across Aon's 50,000-client employer network. Linda Yaccarino's brand partnerships
              (CVS, Thrive Global, Tom Brady) and media credibility enhance the enterprise sales narrative. If eMed can
              demonstrate clinical outcomes superior to population averages and build a multi-employer-client base
              independent of Aon, the $2B+ mark could be justified as an early option on a $100B+ market.

              The anti-thesis is rooted in three structural concerns. First, Aon's triple role as investor, primary
              distribution partner, and flagship commercial customer creates a conflict of interest that makes the $2B+
              valuation partially self-referential: the entity that validated the valuation is simultaneously the
              primary revenue source and the primary investor. This concentration of commercial and financial interest
              in a single counterparty is a material structural risk not fully priced into the headline valuation.
              Second, eMed has disclosed no financial metrics, making it impossible to independently verify whether $2B+
              reflects a reasonable multiple on actual revenue or a speculative premium on market positioning. Third,
              the broader digital health sector has demonstrated that B2B2C employer health models face significant
              execution risk: WeightWatchers restructured, Calibrate ceased operations, Thirty Madison sold at 50% below
              its unicorn mark, and 35% of digital health rounds in 2025 were flat or down according to Rock Health.

              What would change the view positively: disclosure of ARR exceeding $80M, clinical outcomes data
              demonstrating 12-month adherence materially above 50%, addition of 10+ enterprise employer clients
              independent of Aon, and/or independent pharmacy benefit manager distribution. What would change the view
              negatively: FDA enforcement action naming eMed, Aon reducing its partnership commitment, employer GLP-1
              coverage cuts exceeding 30% of eMed's client base, or a high-profile member-harm incident.
