            body: >-
              Employer reluctance to cover GLP-1s is substantially driven by fear of high dropout rates and wasted drug
              spend. eMed's outcome guarantee (employers pay less if weight- loss targets are not met) directly targets
              this objection. If the company can publicly validate its 90%+ adherence claim with independently audited
              data, the guarantee structure could convert the dropout concern from a deal-breaker into a buying trigger
              across the large segment of cost-anxious but receptive employers who would cover if costs were
              demonstrably manageable.
            calloutType: insight
            claimRefs:
              - CU024
              - CU034
              - CU037
              - CU040
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              eMed operates at the convergence of telehealth prescribing, employer benefit administration, and GLP-1
              drug access—three sectors under simultaneous federal regulatory pressure through 2025–2026. The FDA's
              compounding enforcement escalation is the most direct structural threat. By early 2026, the FDA had issued
              warning letters to more than 30 telehealth companies for unlawfully marketing compounded semaglutide after
              Wegovy was removed from the shortage list. The February 2026 public warning letter to Hims & Hers Health
              demonstrates that high-profile digital-health companies are not insulated from named enforcement. Although
              eMed's public materials focus on branded FDA-approved drugs, its sector positioning during the 2022–2024
              shortage period and the breadth of FDA enforcement create residual exposure that is not publicly resolved.
              Any finding that eMed facilitated compounded GLP-1 prescriptions outside approved parameters risks
              mandatory product withdrawal, corrective advertising, and reputational damage.

              The FTC has pursued telehealth weight-loss platforms aggressively through 2024–2026. The FTC's April 2025
              action against NextMed established an enforcement template for deceptive billing— charging patients for
              GLP-1 prescriptions without disclosing qualifying prerequisites. The FTC Cerebral settlement (2024) set
              precedent for sharing sensitive health data with advertising platforms via pixel tracking, constituting a
              health breach notification violation. The FTC published explicit guidance in August 2024 that it was
              monitoring GLP-1 telehealth platforms for deceptive practices, signaling sustained enforcement intent.
              Both patterns—opaque subscription billing and health-data monetization—are live risk for any GLP-1
              telehealth platform using digital-marketing infrastructure and recurring-payment models.

              DEA rules governing co-prescribed controlled substances in telehealth remain in flux pending permanent
              rulemaking from temporary COVID-era flexibility extensions. HHS HIPAA guidance imposes minimum-necessary
              standards on all health-data sharing. State corporate practice of medicine (CPOM) doctrines—varying across
              50 states—impose structural constraints on employment-model telehealth platforms. Compliance across these
              overlapping federal and state frameworks imposes material recurring legal-operational cost that positions
              eMed's legal budget as a non-negotiable competitive overhead.
