company:
  name: eMed
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The global GLP-1 drug market is forecast to reach $157–$190 billion by 2035,
    but eMed's actual addressable market is the far narrower employer-paid service
    layer—US employer-managed digital GLP-1 programs—estimated at $2.2 billion in
    2026 and growing at a 22%+ CAGR toward $6 billion by 2030. Employer adoption
    is accelerating (67% of large firms cover GLP-1 for weight management per
    Business Group on Health 2026) but faces structural headwinds including $27
    PMPM drug costs, 65% one-year dropout rates, and FDA enforcement pressure
    on telehealth GLP-1 providers that simultaneously clear competing DTC players
    and validate eMed's clinically supervised model.
sections:
  - id: market-boundary-and-scope
    title: Market Boundary, Included and Excluded Spend, and Status-Quo Substitutes
    body: >-
      eMed's addressable market is the employer-paid service overlay on top of
      GLP-1 prescriptions, not the branded drug revenue earned by Novo Nordisk
      and Eli Lilly. The distinction matters enormously for sizing: the global
      GLP-1 drug market—dominated by semaglutide and tirzepatide pharmaceutical
      revenue—is frequently cited as a $157–$190 billion market by 2035, but
      that figure is pharmacy spend, not vendor platform fee. eMed monetizes
      telehealth clinical visits, at-home diagnostics, AI-driven adherence
      coaching, care coordination, and population-health reporting sold as an
      employer benefit—none of which accrues to the drug manufacturers. The
      market that is directly addressable is the US digital obesity care and
      GLP-1 support segment, estimated at approximately $2.2 billion in 2026
      and growing toward $6 billion by 2030 at a 22%+ CAGR.

      The primary status-quo substitutes that eMed displaces are in-network
      primary care prescription of GLP-1s without structured oversight
      (the dominant pathway today), standard pharmacy benefit manager coverage,
      and traditional wellness programs such as WW (Weight Watchers), Noom,
      and Virta Health that offer lifestyle support but no prescription access.
      Bariatric surgery remains a more invasive and costly substitute for
      severe obesity, while direct-to-consumer telehealth platforms—Ro, Hims
      & Hers, and Calibrate—address individual consumers rather than employer
      benefit budgets. The adjacencies that could expand eMed's addressable
      surface include broader metabolic health management, behavioral health
      programs, and chronic-disease population health services for self-insured
      employers managing comorbidities linked to obesity such as type 2
      diabetes, sleep apnea, and cardiovascular risk.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: market-sizing-multiple-lenses
    title: "Market Sizing: TAM, SAM, and SOM Across Multiple Lenses"
    body: >-
      Any single GLP-1 market figure misrepresents the investor-relevant sizing
      question for eMed. The global GLP-1 drug market (all indications including
      diabetes, cardiovascular, and weight loss) is projected by Research and
      Markets at $157.5 billion by 2035 at an 11.1% CAGR, and Morgan Stanley's
      base case reaches $190 billion by 2035 with a bull case of $240 billion
      driven by oral formulations and geographic expansion. Goldman Sachs
      published a contrarian view warning that the anti-obesity drug market may
      prove smaller than these projections, citing price erosion, formulary
      resistance, and real-world adherence dropout that could cap global
      anti-obesity drug revenue at approximately $120 billion by 2035. The wide
      range—$120 billion to $240 billion—signals genuine uncertainty, not
      analyst precision.

      The relevant SAM for eMed sits several layers below. JP Morgan and other
      analysts peg the US GLP-1 obesity drug subsegment at $42–$48 billion by
      2030 at a 18–23% CAGR. Below that, the US employer-managed digital GLP-1
      platform market—where eMed actually competes—is estimated at $2.2 billion
      in 2026 growing to $6 billion by 2030. eMed's serviceable obtainable market
      is a subset of this: employers that are self-insured, willing to pay a
      per-member management fee, and seeking outcomes-accountable clinical
      oversight rather than pure pharmacy access. Aon's workforce analysis
      across more than 192,000 GLP-1 users suggests the ROI case for managed
      programs is real, but only when adherence exceeds 80%—a threshold most
      unmanaged programs do not reach. The self-insured employer universe spans
      approximately 50,700 plans covering 39 million participants, with the
      highest-value concentration in firms with 5,000 or more employees, where
      roughly 90% are self-insured.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM021, CM022, CM038]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: buyer-user-payer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      The budget for GLP-1 benefit management in a large self-insured employer
      sits primarily with the CFO and Chief Human Resources Officer, who set
      annual benefit design budgets, while HR benefits directors implement
      program selection through brokers and benefits consultants. Aon's dual
      role as both eMed's lead investor and the world's largest HR/benefits
      consultancy creates a direct employer distribution channel that bypasses
      the typical multi-vendor RFP cycle. This structural advantage is significant
      because the standard selling path for a new benefits vendor involves a
      12-to-24-month procurement cycle with annual benefit-year lock-in.

      Large self-insured employers with 5,000 or more employees represent the
      highest-value buyer segment because they bear the full actuarial risk of
      GLP-1 utilization, employ plan populations with sufficient scale to produce
      measurable cohort outcomes, and have the administrative capacity to
      implement a managed program with clinical oversight. The KFF 2025 survey
      found that 43% of firms with 5,000 or more employees now cover GLP-1s for
      obesity treatment, compared with 30% in the 1,000–4,999 employee tier.
      Mid-market employers (200–4,999 employees) are a growing segment, often
      fully or partially insured through carriers, which changes the budget owner
      from an employer HR director to a health plan medical director. Government
      payers including Medicaid, Medicare Advantage, and the VA represent a
      separate and expanding channel that eMed cited in its founding narrative,
      though current public evidence on government payer contracts is limited.
      The PHTI's employer-approaches analysis confirmed that large employers
      increasingly require structured lifestyle programs and prior authorization
      as conditions for GLP-1 coverage, which creates demand for vendors who can
      satisfy those conditions systematically.
    claimRefs: [CM010, CM011, CM014, CM028, CM029, CM030, CM031, CM032]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: growth-drivers-and-adoption-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      The primary growth driver is the direct and quantifiable cost burden of
      obesity on employer health plans. Forbes and Nature-published research
      estimate that obesity costs US employers approximately $347–$400 billion
      annually through medical expenses, presenteeism, absenteeism, and
      disability. The obesity cost at $6,472 per affected employee per year
      creates a compelling ROI frame for management programs priced at roughly
      $100–$200 PMPM. Aon's April 2025 workforce analysis found that medical
      cost growth for weight-loss GLP-1 users fell approximately three percentage
      points after 12–18 months of managed access, rising to seven points for
      users at or above 80% adherence, relative to matched non-user controls.
      The FDA's enforcement campaign against compounding GLP-1 telehealth in
      2026—issuing 30 warning letters to DTC providers for illegal marketing—
      paradoxically benefits eMed by clearing undifferentiated competitors and
      validating the clinically supervised, employer-facing model.

      The most severe constraint is cost escalation at both the drug and
      program level. WTW reported that employer GLP-1 PMPM costs rose from
      $4.34 in 2022 to $27.23 by Q1 2025, and GLP-1s now account for
      approximately 21% of total employer prescription spending. EBRI's
      simulation projects that broad GLP-1 coverage could raise employer health
      insurance premiums by 5.3%–13.8%, creating financial pressure that leads
      some employers to tighten eligibility or drop coverage entirely—the WTW
      June 2026 Pulse Survey found 12% of employers were likely to discontinue
      GLP-1 coverage. Low real-world adherence is the deepest structural risk:
      a published PMC cohort study found 65% of non-diabetic GLP-1 initiators
      discontinued within one year. For eMed, this adherence gap is both the
      business problem it claims to solve and the existential threat if its
      own outcomes data cannot withstand independent auditing. Employer
      procurement cycle length, benefit-design lock-in, and switching cost
      further constrain organic growth, while market concentration among
      Novo Nordisk and Eli Lilly gives drug manufacturers significant leverage
      over eMed's drug-cost pass-through economics.
    claimRefs: [CM015, CM016, CM017, CM018, CM020, CM022, CM025, CM033, CM034, CM035, CM036, CM037]
    tableRefs: [TM004]
    figureRefs: [FM004]
  - id: sizing-gaps-and-contradictory-estimates
    title: Sizing Gaps, Contradictory Estimates, and Diligence Asks
    body: >-
      Three structural gaps limit confidence in any eMed-specific market sizing.
      First, the spread between Goldman Sachs's cautious $120 billion global
      anti-obesity forecast for 2035 and Morgan Stanley's $190 billion base case
      ($240B bull) is not primarily a data-quality gap but a genuine disagreement
      on drug pricing trajectories, adherence sustainability, and international
      formulary adoption. Goldman's skepticism around price erosion and payer
      resistance is better supported by current employer behavior—Brown & Brown's
      mid-2025 survey found 31% of covering employers were considering dropping
      GLP-1 coverage—than the bull-case projections that assume sustained
      penetration at near-list prices.

      Second, the employer platform market estimate of $2.2 billion (2026) comes
      from a single market research publication rather than from aggregated
      employer spend data; no corroborating independent source for this specific
      figure was identified in the research reviewed for this chapter, which is a
      meaningful gap given how directly it anchors SAM-to-SOM math for eMed's
      valuation thesis.

      Third, eMed's own outcome claims—90%+ adherence, 21–22.4 lb average
      weight loss—come from company-controlled or partner-reported sources and
      have not been independently replicated in peer-reviewed research or by a
      neutral third-party auditor. The PMC study finding 65% real-world dropout
      among GLP-1 initiators is directly at odds with eMed's adherence claim,
      and the discrepancy is not resolved in any reviewed public source. Resolving
      this gap—either by independent audit of eMed's cohort selection methodology
      or by third-party validation of its outcomes—is the single most important
      diligence step for assessing whether eMed's business model is structurally
      differentiated or narratively overstated.
    claimRefs: [CM006, CM009, CM013, CM018, CM019, CM021, CM026]
callouts:
  - calloutType: strength
    title: FDA enforcement paradox creates competitive moat for clinically supervised platforms
    body: >-
      The FDA's 2026 wave of 30 warning letters to compounding GLP-1 telehealth
      providers is a structural tailwind for eMed. By clearing DTC competitors that
      market compounded GLP-1s without clinical oversight, FDA enforcement validates
      the employer-supervised model and raises the barrier for new low-cost entrants
      that eMed most directly competes against.
    claimRefs: [CM025, CM026, CM027]
  - calloutType: risk
    title: Adherence claims are at direct odds with published real-world dropout data
    body: >-
      eMed claims 90%+ member adherence for its managed GLP-1 program, but a
      published PMC cohort study found approximately 65% of non-diabetic GLP-1
      users quit within one year under real-world conditions. Until an independent
      audit explains how eMed's cohort selection, program design, or outcome
      measurement methodology produces results that diverge so sharply from the
      population average, the adherence claim is a material open question.
    claimRefs: [CM013, CM018, CM019]
  - calloutType: risk
    title: Employer GLP-1 cost pressure creates coverage withdrawal risk that shrinks the SAM
    body: >-
      A sizable minority of employers are actively reconsidering GLP-1 coverage.
      Brown & Brown found 31% of covering employers may drop coverage within 12-24
      months. If large employers scale back coverage, eMed's addressable employer
      pool contracts regardless of drug efficacy. The SAM depends on employers
      continuing to both cover GLP-1s and pay for structured management programs,
      making this dual-dependency a key risk for eMed's growth thesis.
    claimRefs: [CM013, CM017, CM036, CM037]
  - calloutType: insight
    title: Aon's dual investor and channel role compresses the employer sales cycle
    body: >-
      Standard employer benefits vendor selling takes 12-24 months; Aon as both
      lead investor and world's largest HR consultancy gives eMed a structural
      shortcut. The same dynamic that validates the distribution thesis also
      creates customer concentration risk that diligence should quantify.
    claimRefs: [CM023, CM031, CM033]
