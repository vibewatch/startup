      whyItMatters: "The $2.2B figure anchors the SAM case for eMed's valuation thesis, but the reviewed sources trace it to a single market research publication without independent validation."
      diligencePath: "Search for corroborating estimates from EBRI, KFF, Business Group on Health, or benefits consulting firms; alternatively derive a bottom-up estimate from employer count, self-insured share, average management fee, and coverage rates."
