  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: adherence-gap
      missingEvidence: "Independent third-party audit or peer-reviewed validation of eMed's 90%+ adherence rate using comparable cohort selection and methodology."
      whyItMatters: "The 65% real-world GLP-1 dropout rate from the PMC cohort study is directly at odds with eMed's adherence claim. Without an independent methodology audit, it is impossible to know if the gap reflects eMed's clinical model working, favorable cohort selection bias, or a measurement difference."
      diligencePath: "Request eMed's clinical outcomes methodology documentation; commission an independent third-party analysis of program cohort demographics and dropout definitions relative to PMC study population."
      relatedQuestionRefs: [QM013]
    - type: conflicting-data
      severity: material
      topic: glp1-market-size-estimates
      missingEvidence: "A reconciliation of Goldman Sachs's cautious $120B 2035 forecast versus Morgan Stanley's $190B base case, specifically addressing pricing trajectory and adherence assumptions underlying each."
      whyItMatters: "eMed's SAM grows substantially when the bull-case drug penetration scenario holds but contracts if Goldman's price-erosion and payer-resistance scenario materializes. The $70B+ gap matters for eMed's long-term TAM-to-SOM calculation."
      diligencePath: "Review each analyst's underlying pricing and penetration model; cross-reference with Novo Nordisk and Eli Lilly forward-guidance commentary on net pricing trends."
      relatedQuestionRefs: [QM019, QM021, QM027]
    - type: missing-source
      severity: material
      topic: employer-platform-market-validation
