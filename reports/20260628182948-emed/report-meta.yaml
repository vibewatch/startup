companyProfile:
  summary: >-
    eMed is a Miami-based digital-health company founded in 2020 that first gained traction through
    telehealth-supervised Abbott BinaxNOW COVID-19 testing before repositioning around employer-
    focused GLP-1 population health. The company now combines at-home diagnostics, clinician-guided
    prescribing, adherence support, PBM/distribution partnerships, and branded wellness marketing
    into a benefits-oriented obesity-care platform. Aon's 2025 strategic investment and 2026 lead
    role in the $200M Series A created both strong commercial validation and a concentration signal,
    while Tom Brady and Linda Yaccarino amplified brand visibility. Public disclosure remains limited,
    leaving revenue quality and underwriting questions unresolved despite evident market momentum.
  foundedDate: "2020-01-01"
  founders:
    - name: Dr. Patrice Harris
      role: Co-founder and founding CEO
      background: Former American Medical Association president and psychiatrist who brought public-health and clinical credibility to eMed's formation.
      claimRefs: [CO006]
  foundingLocation: Miami, Florida, United States
  headquarters: Miami, Florida, United States
  productSummary: >-
    Telehealth platform for GLP-1 weight-management medications sold through employers and health
    plans, combining remote diagnostics, virtual clinical evaluation, prescribing support,
    adherence monitoring, and behavior-change services through partners such as CVS Caremark and
    Thrive Global.
  customerFocus: >-
    Large employers, self-insured companies, government payers, and health-plan buyers seeking to
    manage employee GLP-1 demand, clinical adherence, and obesity-related health costs.
  businessModel: >-
    B2B employer and payer contracts supported by PMPM-style benefit economics, clinical-service
    fees, and medication-management workflows, with some direct-to-consumer access still referenced
    in public materials.
  stage: Growth-stage private company
  fundingStatus: >-
    Last priced round was the March 2026 $200M Series A at a $2B+ post-money valuation led by Aon
    Consulting, following Aon's August 2025 strategic investment and employer pilot.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO014, CO017, CO018, CO024, CO036, CV001, CV004]
summary:
  headline: >-
    eMed has a credible employer GLP-1 distribution story and marquee strategic backing, but the
    $2B+ valuation appears stretched relative to public digital-health comps because revenue,
    customer concentration, and unit economics remain materially undisclosed.
