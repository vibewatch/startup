runDate: "2026-06-28"
company:
  name: eMed
chapter:
  number: 3
  title: Competitors
  summary: >-
    eMed operates in a crowded employer GLP-1 management market that includes direct peers
    Calibrate, Found, Noom Med, Omada Health, and Vida Health; DTC players Hims & Hers and Ro
    Body; incumbent telehealth platform Teladoc; status-quo PBM and unmanaged-PCP substitutes;
    and emerging drug-maker direct pathways via LillyDirect and NovoCare. eMed's primary moats
    are its Aon-anchored employer distribution channel, a 90%-plus adherence claim, capitated
    pricing that shifts risk to the platform, and COVID-era at-home diagnostics infrastructure
    no DTC-first peer replicates. The most material competitive risks are drug maker
    disintermediation, commoditization of AI coaching tools, the large membership scale held
    by Omada and Found, and the FDA-driven compounding crackdown that cleared DTC semaglutide
    sellers from one risk vector while leaving branded-drug pricing pressure intact.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      eMed's competitive universe is best understood through five distinct categories of
      alternatives that an employer benefits buyer could choose instead of eMed's managed
      GLP-1 program.

      The first and most relevant category is direct employer GLP-1 management platforms
      — companies that, like eMed, sell outcomes-accountable, clinically supervised GLP-1
      programs to self-insured employers as benefit line items. These include Calibrate
      (which reports 19 percent average body weight loss over three years and has pivoted
      explicitly to employer B2B after earlier DTC struggles), Found Health (which operates
      "Found for Business," claims 5.1x employer ROI, and has conducted more than one million
      clinical consults since 2019), Noom Med (the GLP-1 prescribing arm of the 15-year-old
      behavioral-science platform, which operates a GLP-1 Companion specifically for employer
      populations already on medication), Omada Health (a public-company-bound cardiometabolic
      platform with 1M-plus lifetime members and a new Lilly Employer Connect partnership that
      improves branded-drug access), and Vida Health (a 12-year cardiometabolic-care specialist
      that won the 2026 MedTech Breakthrough Award for Best Virtual Care Platform).

      The second category is DTC-focused telehealth platforms that primarily serve individual
      consumers but have some employer-adjacent reach. Hims & Hers sells GLP-1 medications
      starting from $149 per month and focuses on branded-drug access following FDA enforcement
      against compounded semaglutide. Ro Body operates through its Ro Body membership for
      individual GLP-1 access. Both lack the employer channel depth, outcomes accountability
      infrastructure, and risk-transfer models that eMed emphasizes.

      The third category is incumbent large-scale telehealth platforms. Teladoc Health offers
      an employer weight management program with connected smart-scale hardware, personalized
      coaching, and its legacy Livongo diabetes-management infrastructure — but has struggled
      financially and does not position the product as a dedicated GLP-1 management solution.
      Included Health provides care navigation and GLP-1 support as part of a broader
      all-in-one employee health benefit, with customer proof points including Salesforce,
      AT&T, and lululemon.

      The fourth and most important status-quo substitute is unmanaged GLP-1 prescribing
      through a primary care physician combined with PBM formulary coverage. OptumRx, CVS
      Caremark, and Express Scripts control the GLP-1 formulary for most self-insured employers
      and could add clinical management overlays directly. This "internal build" option
      (employers adding GLP-1 management to existing vendor contracts) and the PBM-managed
      substitute represent eMed's largest non-vendor competitive threat.

      The fifth category is drug maker direct programs. LillyDirect provides access to Zepbound
      and other Eli Lilly medicines through independent telehealth providers with free delivery
      and transparent pricing. NovoCare's patient support program offers Wegovy access,
      cost-support tools, and prescription coordination directly through the Novo Nordisk
      network. If drug makers succeed in disintermediating platform layers, the addressable
      fee-for-service pool shrinks materially for all management platforms.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: competitor-profiles
    title: Direct and Adjacent Competitor Profiles
    body: >-
      Calibrate is eMed's closest direct analog in the employer market. The company
      combines clinician-prescribed GLP-1 medication with one-on-one video coaching and
      science-backed reading curriculum. Its stated outcome is 19 percent average body weight
      loss achieved over three years. Calibrate explicitly markets employer coverage as part of
      its patient-acquisition model, listing participating employers and directing prospective
      members to check whether their company covers the program. Calibrate's emphasis on
      lifestyle change alongside medication, and its multi-year time horizon, differentiates it
      from shorter-engagement competitors, though the company has faced earlier DTC market
      challenges before pivoting toward employer partnerships.

      Found Health (operating as "Found for Business" for employer clients) is arguably the
      most credentialed peer in terms of clinical volume. The company has conducted over
      one million clinical consults since its 2019 founding, giving it the largest real-world
      dataset among employer GLP-1 management platforms. Found's MetabolicPrint personalization
      engine assigns each member one of four metabolic profiles to tailor treatment. Its
      medication toolkit extends to ten or more options including non-GLP-1 alternatives,
      enabling Found to manage formulary constraints that limit drug access for some employees.
      Found's in-network status with major insurers allows employers to run clinical consults
      as claims, reducing program cost.

      Noom operates across two relevant employer products. Its Noom Health employer platform
      delivers the company's well-established psychology-based behavioral program (a CDC-
      recognized Diabetes Prevention Program) as well as diabetes management. Noom Med adds
      GLP-1 prescribing capability, and the GLP-1 Companion program provides tailored
      lifestyle support for employees already on GLP-1 medications. Noom's 15-plus-year
      behavioral-science heritage and its scale (programs across many organizations globally)
      differentiate it from newer pure-GLP-1 entrants, though Noom's GLP-1 prescribing
      arm is newer and less battle-tested than its behavior-change core.

      Omada Health is the most institutionally established direct peer. Founded to address
      digital diabetes prevention, Omada has since expanded into full cardiometabolic and
      musculoskeletal care for employers. Its GLP-1 Care Track provides food and activity
      coaching, medication assistance for GLP-1 side effects, dedicated health coaches, and
      behavioral health support. Omada's 2026 Lilly Employer Connect partnership expands
      branded-drug access for its employer clients. Most significantly, Omada filed an S-1
      registration statement with the SEC in May 2025 signaling a public-market ambition that,
      if successful, would give Omada a balance-sheet and recruiting advantage over private peers
      including eMed. Omada's resource center shows Q1 2026 results, Goldman Sachs conference
      participation, and peer-reviewed studies as evidence of institutional credibility.

      Vida Health is a 12-year-old cardiometabolic specialist focused on metabolic conditions
      including obesity and related comorbidities. It won the 2026 MedTech Breakthrough Award
      for Best Virtual Care Platform and explicitly integrates with existing health plans and
      PBMs, positioning itself as an enhancement rather than replacement for existing benefits.
      Vida's decade-plus track record and multi-condition depth give it cross-sell optionality
      that single-condition GLP-1 platforms lack.

      Teladoc Health is the largest incumbent. Its Weight Management program is part of a
      broader virtual-care platform that also covers mental health, diabetes prevention,
      hypertension, and dermatology. Teladoc's Livongo chronic-care brand, now integrated
      into the platform, gives it deep employer relationships for diabetes management that could
      extend naturally into obesity management. However, Teladoc's weight management program
      emphasizes connected scale hardware and behavioral coaching rather than dedicated GLP-1
      prescribing management, and the company has faced financial and operational challenges
      that have weakened its growth profile.

      Hims & Hers focuses on direct-to-consumer GLP-1 access for individuals and has not
      built a material employer-benefits sales motion. Its weight loss product includes
      brand-name Wegovy starting from $149 per month and the new Wegovy pill. Hims appointed
      Dr. Anant Vinjamoori as Chief Medical Officer in June 2026. Ro Body offers similar DTC
      access, with Serena Williams and Charles Barkley as brand ambassadors and a broad set
      of named GLP-1 options. FDA enforcement against compounded semaglutide has shifted
      both Hims and Ro toward branded drugs, reducing their low-cost DTC competitive advantage
      but also validating the supervised clinical model that eMed positions.

      Included Health provides care navigation and GLP-1 support as part of its integrated
      employer health benefit platform. It differentiates through whole-person care coordination
      with verified employer case studies at Salesforce, lululemon, and AT&T, and reports
      greater than 4 percent reduction in healthcare trend for clients in year one.
    claimRefs: [CP014, CP015, CP016, CP017, CP018, CP019, CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP027, CP028, CP029]
    tableRefs: [TP002]
    figureRefs: [FP002]

  - id: capability-pricing-comparison
    title: Capability, Pricing, and GTM Comparison
    body: >-
      On the capability dimension, eMed's strongest differentiators are its at-home diagnostics
      workflow inherited from the Abbott BinaxNOW partnership, the AI-enabled engagement layer
      described as an "empathic agentic AI platform" in company materials, and the Aon-anchored
      direct employer channel. Calibrate, Found, and Noom each offer their own proprietary
      engagement tools, but none have documented the same at-home diagnostic capability or a
      strategic investor that is simultaneously their primary distribution partner. Omada's
      Lilly partnership and IPO track are legitimate capability accelerators that eMed lacks —
      Omada would gain access to branded-drug preferred networks and patient acquisition through
      Lilly's infrastructure.

      On pricing, the market shows a bifurcation between per-member management fees for employer
      programs and direct subscription prices for DTC channels. Hims & Hers starts at $149 per
      month for Wegovy pill with prescription included. Calibrate structures its program as an
      employer-covered benefit with cost varying by employer arrangement. Found for Business
      projects a $4,204-per-year cost saving per covered life without GLP-1 formulary coverage
      and higher with coverage, monetizing the ROI argument as a sales anchor. eMed's public
      materials emphasize a capitated model (flat-fee risk sharing) rather than a per-prescription
      pass-through fee, which is meaningfully different from peer pricing and could be the most
      defensible pricing structure if adherence and outcomes hold up under audit.

      On GTM and distribution, the structural gap between eMed and most direct peers is the
      Aon channel. Aon's position as the world's largest HR and benefits consultancy means eMed
      enters employer conversations as a recommended vendor rather than an unsolicited outside
      vendor seeking a 12-to-24-month RFP cycle. Most direct peers sell through health plan
      integrations, broker networks, or direct employer outreach — none with a single investor
      who is simultaneously a channel partner of Aon's scale. This is eMed's most durable
      near-term moat.

      On regulatory and trust posture, the FDA March 2026 warning letters to 30 telehealth
      companies for false claims about compounded GLP-1 products damaged the competitive
      position of DTC platforms that relied on compound semaglutide as a low-cost entry point.
      eMed's supervised clinical model positions it as the compliant alternative, even if its
      own regulatory scrutiny posture remains undisclosed in public sources. Hims & Hers has
      faced compounding enforcement pressure directly. Omada's S-1 filing provides the most
      complete public disclosure of regulatory risk factors among listed peers.
    claimRefs: [CP030, CP031, CP032, CP033, CP034, CP035, CP036]
    tableRefs: [TP003]

  - id: switching-costs-lock-in-distribution
    title: Switching Costs, Lock-in, and Distribution Power
    body: >-
      Employer GLP-1 management benefits are inherently sticky due to the annual benefit-year
      procurement cycle. Once an employer embeds a clinical management platform into its benefit
      stack through a PBM integration, clinical workflow setup, member enrollment, and outcomes
      reporting, switching mid-year is operationally and contractually difficult. This structural
      lock-in applies equally to all employer-channel competitors including eMed. The company
      that wins the first benefit-year contract has an incumbency advantage going into renewal.

      Multi-homing is possible but economically inefficient. An employer could theoretically
      offer both eMed and a behavioral lifestyle supplement like Noom, but this adds cost and
      administrative complexity. In practice, large self-insured employers seek a single clinical
      management vendor per program type, reducing the probability of sustained multi-homing.

      Distribution power is the dimension where eMed's advantage is most visible and most
      concentrated. Aon serves more than 1,200 of the Fortune 1,500 companies as their benefits
      consultant. An Aon recommendation to install eMed effectively removes the cold-outreach
      phase of the enterprise sales cycle. Competitors like Found and Calibrate must build broker
      and consultant relationships incrementally. Omada has institutional health plan relationships
      but lacks a single investor-channel champion of Aon's scale. Teladoc has deep employer
      relationships from legacy Livongo, but its overall commercial trajectory has been declining.

      Supply and partner access to branded GLP-1 drugs is a critical dependency for all platforms.
      Neither Wegovy (Novo Nordisk) nor Zepbound (Eli Lilly) shortage resolution is complete, and
      access to the branded drugs requires pharmacy integration. Omada's Lilly Employer Connect
      participation and its presence in Lilly's preferred-access ecosystem give it a supply-side
      advantage that eMed has not publicly disclosed matching. NovoCare and LillyDirect represent
      the manufacturers' own effort to control the patient-facing layer, which reduces the
      criticality of management platforms if manufacturers can attach adherence tools directly to
      prescriptions. PBM giants OptumRx and CVS Caremark already control drug formularies for
      most self-insured employers; a PBM-native GLP-1 management overlay would bypass all
      independent platforms including eMed.
    claimRefs: [CP037, CP038, CP039, CP040, CP041, CP042]
    tableRefs: [TP004]

  - id: moat-durability-competitive-risks
    title: Moat Durability, Commoditization Risk, and Adverse Competitor Evidence
    body: >-
      eMed's moat durability case rests on four claims: the Aon distribution channel, proprietary
      at-home diagnostics infrastructure, an AI engagement platform with compounding behavioral
      data, and a capitated pricing model that aligns incentives with employer outcomes. Each
      merits scrutiny.

      The Aon channel is real but carries concentration risk. If Aon were to diversify its GLP-1
      management recommendation to multiple vendors, offer competing platforms, or negotiate
      exclusivity provisions that favor other partners, eMed's distribution advantage would erode
      quickly. The fact that Aon is both lead investor and channel partner makes the governance of
      this relationship an unresolved diligence question: at what point does Aon's fiduciary duty
      to employer clients diverge from its financial stake in eMed?

      The at-home diagnostics moat is real in the sense that no peer has the same COVID-era
      regulatory and operational history — but it is replicable. A competitor with sufficient
      capital could build or acquire home-testing capability within 12 to 24 months. The moat
      is more a time-to-market advantage than a structural barrier.

      The AI engagement platform is difficult to evaluate without independent review. eMed's
      90%-plus adherence claim is more than twice the ~40% real-world adherence rate documented
      in published literature for unmanaged GLP-1 users. The discrepancy may reflect genuine
      eMed-specific effectiveness (the managed program, higher engagement, at-home diagnostics),
      or it may reflect cohort selection (motivated employer enrollees differ from general
      population). Until an independent audit resolves this gap, the AI moat is partially
      supported but not confirmed.

      Adverse competitor signals that diligence should track include: WeightWatchers' financial
      restructuring following GLP-1 market disruption (illustrating how rapidly the market can
      disable an incumbent with poor strategic positioning); Calibrate's earlier DTC-to-employer
      pivot following market challenges (showing that B2C to B2B pivots in this space are common
      and can indicate prior business model stress); and the FDA March 2026 enforcement action
      against 30 telehealth companies (adverse to the sector and to any eMed competitor using
      compounded agents, but also signaling ongoing regulatory vigilance that could evolve to
      cover eMed's own practices). The SEC S-1 filing by Omada in May 2025 provides the most
      extensive public-facing risk factor disclosure for a direct peer, and investors should
      read its competitive risk factor section as a proxy for the structural risks facing eMed
      as well. Commoditization of AI coaching tools and PBM disintermediation are the two
      highest-severity long-term displacement risks.
    claimRefs: [CP043, CP044, CP045, CP046, CP047, CP048, CP049, CP050]
    figureRefs: [FP003]

callouts:
  - calloutType: strength
    title: Aon channel gives eMed a structural GTM shortcut that peers cannot replicate quickly
    body: >-
      No direct competitor in the employer GLP-1 management market has an investor who is
      simultaneously the world's largest benefits consultancy. This channel advantage is worth
      more than raw clinical differentiation in a market where the typical employer sales cycle
      runs 12–24 months and annual benefit-lock-in extends incumbency.
    claimRefs: [CP034, CP035, CP036]
  - calloutType: risk
    title: Drug maker direct programs and PBM overlays threaten to disintermediate platform layer
    body: >-
      LillyDirect and NovoCare represent drug maker efforts to control the patient-facing layer
      directly. If Novo Nordisk and Eli Lilly succeed in attaching adherence and management tools
      to branded-drug prescriptions, the case for a separate management platform fee weakens for
      all competitors, including eMed.
    claimRefs: [CP005, CP032, CP033, CP041]
  - calloutType: risk
    title: Aon channel concentration is eMed's most critical governance and commercial risk
    body: >-
      Aon is eMed's lead investor and primary distribution channel simultaneously. If eMed's
      outcomes data does not withstand audited scrutiny, or if Aon diversifies its GLP-1
      platform recommendations, eMed's win-rate advantage in the employer market could compress
      faster than any product gap would imply.
    claimRefs: [CP043, CP044, CP047]
  - calloutType: insight
    title: FDA enforcement against compounded semaglutide removed a major DTC competitor threat
    body: >-
      The FDA's March 2026 warning letters to 30 telehealth companies targeting compounded GLP-1s
      disrupted the low-cost DTC competitive pressure that Hims, Ro, and others represented.
      By forcing a shift to branded drugs at higher prices, FDA enforcement narrows the pricing
      gap between eMed's managed employer model and DTC alternatives.
    claimRefs: [CP028, CP029, CP031, CP046]

