  evidenceGaps:
    - type: missing-source
      severity: material
      topic: emed-adherence-independent-audit
      missingEvidence: >-
        An independent, third-party audit of eMed's 90%-plus adherence claim with full
        denominator, cohort selection methodology, and dropout accounting.
      whyItMatters: >-
        eMed's adherence claim is the primary quantitative moat supporting its capitated pricing
        model and its valuation premium over peers. Without independent corroboration, the claim
        cannot be accepted as a durable competitive advantage.
      diligencePath: >-
        Request from eMed an IRB-approved retrospective study or third-party actuarial review of
        adherence by employer cohort, including methodology for counting dropouts.
      relatedQuestionRefs: [QP014]
      relatedTableRefs: [TP004]

    - type: missing-source
      severity: material
      topic: employer-win-loss-data
      missingEvidence: >-
        Independent employer win/loss data across Calibrate, Found, Noom Med, Omada, and eMed
        showing which platform is selected in contested benefit-design RFPs.
      whyItMatters: >-
        Without win/loss data it is impossible to verify whether eMed's Aon channel advantage
        actually translates to higher close rates vs. competitors in head-to-head RFPs.
      diligencePath: >-
        Request from eMed a sell-through report showing employer pipeline and closed deals
        with win/loss attribution; cross-reference with Aon's public benefit design disclosures.
      relatedQuestionRefs: [QP013, QP025]

    - type: private-evidence-only
      severity: material
      topic: capitated-model-contract-terms
      missingEvidence: >-
        Specific capitated contract terms, outcomes warranty thresholds, actuarial reserve
        model, and financial exposure cap for eMed's risk-transfer pricing model.
      whyItMatters: >-
        A capitated model that shifts risk to eMed without adequate reserves could be financially
        destabilizing if outcomes underperform. The model is announced but not publicly specified.
      diligencePath: >-
        Review capitated contract templates and actuarial reserve model with eMed's legal and
        finance teams during due diligence.
      relatedQuestionRefs: [QP022]
      relatedTableRefs: [TP004]

    - type: missing-source
      severity: material
      topic: drug-maker-disintermediation-roadmap
      missingEvidence: >-
        LillyDirect and NovoCare product roadmap for employer-facing management tools or
        adherence programs that would directly compete with the management platform layer.
      whyItMatters: >-
        If drug makers attach management and adherence tools directly to branded-drug prescriptions
        at scale, the incremental value of an eMed management platform fee decreases. Monitoring
        the drug maker roadmap is critical for long-term competitive scenario planning.
      diligencePath: >-
        Monitor Eli Lilly and Novo Nordisk investor presentations, SEC filings, and product
        launch announcements for employer-facing adherence tool development.
      relatedQuestionRefs: [QP026]

    - type: enumeration-incomplete
      severity: minor
      topic: likely-entrants
      missingEvidence: >-
        Confirmed or credible evidence of big-tech (Amazon, Apple, Google), insurance carrier,
        or health system entry into the employer GLP-1 management platform market.
      whyItMatters: >-
        A well-resourced entrant from outside the current vendor set could change the competitive
        dynamics faster than an incumbent pivot, especially given Amazon Pharmacy's GLP-1 strategy.
      diligencePath: >-
        Monitor Amazon Pharmacy, CVS Health, and major health system press releases for GLP-1
        management product announcements.
      relatedQuestionRefs: [QP027]
      relatedTableRefs: [TP001]

