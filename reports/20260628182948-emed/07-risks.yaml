company:
  name: eMed
chapter:
  number: 7
  title: Risks
  summary: >-
    eMed faces a convergent set of material risks concentrated in three vectors: FDA compounding
    enforcement and FTC deceptive-billing scrutiny define the regulatory threat; GLP-1 adherence
    failure and employer benefit-design retreat define the revenue-model threat; and Aon's tri-role
    concentration (investor, customer, and distribution channel simultaneously) defines the
    single-counterparty dependency risk. Brand exposure via Tom Brady's Chief Wellness Officer role,
    governance opacity on financials, and $2B+ valuation expectations compound the downside. Risks are
    tractable—eMed's employer-channel model and branded-drug focus offer partial shelter—but require
    independent clinical outcomes evidence and proactive regulatory compliance to sustain.

sections:
  - id: regulatory-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      eMed operates at the convergence of telehealth prescribing, employer benefit administration,
      and GLP-1 drug access—three sectors under simultaneous federal regulatory pressure through
      2025–2026. The FDA's compounding enforcement escalation is the most direct structural threat.
      By early 2026, the FDA had issued warning letters to more than 30 telehealth companies for
      unlawfully marketing compounded semaglutide after Wegovy was removed from the shortage list.
      The February 2026 public warning letter to Hims & Hers Health demonstrates that high-profile
      digital-health companies are not insulated from named enforcement. Although eMed's public
      materials focus on branded FDA-approved drugs, its sector positioning during the 2022–2024
      shortage period and the breadth of FDA enforcement create residual exposure that is not
      publicly resolved. Any finding that eMed facilitated compounded GLP-1 prescriptions outside
      approved parameters risks mandatory product withdrawal, corrective advertising, and
      reputational damage.

      The FTC has pursued telehealth weight-loss platforms aggressively through 2024–2026. The FTC's
      April 2025 action against NextMed established an enforcement template for deceptive billing—
      charging patients for GLP-1 prescriptions without disclosing qualifying prerequisites. The FTC
      Cerebral settlement (2024) set precedent for sharing sensitive health data with advertising
      platforms via pixel tracking, constituting a health breach notification violation. The FTC
      published explicit guidance in August 2024 that it was monitoring GLP-1 telehealth platforms
      for deceptive practices, signaling sustained enforcement intent. Both patterns—opaque
      subscription billing and health-data monetization—are live risk for any GLP-1 telehealth
      platform using digital-marketing infrastructure and recurring-payment models.

      DEA rules governing co-prescribed controlled substances in telehealth remain in flux pending
      permanent rulemaking from temporary COVID-era flexibility extensions. HHS HIPAA guidance
      imposes minimum-necessary standards on all health-data sharing. State corporate practice of
      medicine (CPOM) doctrines—varying across 50 states—impose structural constraints on
      employment-model telehealth platforms. Compliance across these overlapping federal and state
      frameworks imposes material recurring legal-operational cost that positions eMed's legal
      budget as a non-negotiable competitive overhead.
    claimRefs:
      - CR001
      - CR002
