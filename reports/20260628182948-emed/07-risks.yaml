      - TR002
    figureRefs:
      - FR002

  - id: operational-supply-chain-competition
    title: Operational, Supply Chain, and Competitive Risk
    body: >-
      Supply chain risk has changed character since 2024. Branded semaglutide (Wegovy) is no longer
      on the FDA shortage list, which normalizes patient access and eliminates the compounding
      exemption that fueled early GLP-1 telehealth volume. However, supply normalization also
      removed the structural moat insulating eMed from direct manufacturer competition. Novo
      Nordisk and Eli Lilly direct-care distribution channels (LillyDirect, NovoNordisk direct
      care) represent nascent but credible routes for manufacturers to disintermediate telehealth
      platforms in the employer market. eMed's prescription routing role is not contractually
      protected against manufacturer disintermediation.

      Competitive pressure from well-capitalized players has intensified. Hims & Hers pivoted to
      branded GLP-1s post-FDA crackdown and reported $79 million in GLP-1-related revenue in Q1
      2026—demonstrating the branded-drug transition is feasible at scale and that eMed holds no
      unique channel position. Ro launched Ro Business targeting self-insured employers in Q2 2025.
      Optum Rx (UnitedHealth), CVS Caremark, and Omada Health (now publicly traded after a 2025
      IPO) all compete in the employer GLP-1 benefit market with distribution scale advantages.
      eMed's competitive moat rests on brand (Brady/Yaccarino association), the Aon channel, and
      clinical-AI workflow claims—all replicable by incumbents with capital and distribution scale.
      WTW, Mercer, and Alight serve as channels for competing vendors, reducing channel exclusivity.

      Operational scaling risks are material at eMed's growth rate. Maintaining licensure for
      physicians and NPs across all 50 states is a recurring compliance burden. The Babylon Health
      UK clinical asset acquisition introduces integration technical debt and an unproven AI
      clinical workflow. Data infrastructure at millions-of-patients scale creates cybersecurity
      exposure, and any PHI breach triggers HIPAA notification, FTC health-breach enforcement, and
      reputational damage. The FDA has signaled scrutiny of AI-driven clinical decision support
      tools as potential Software as a Medical Device, creating an unresolved regulatory
      classification risk for eMed's empathetic-AI workflow.
    claimRefs:
      - CR017
