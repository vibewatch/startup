callouts:
  - calloutType: risk
    title: Regulatory Enforcement Cluster Is the Primary Existential Risk
    body: >-
      Active FDA compounding enforcement (30+ sector warning letters 2025–2026) combined with
      FTC GLP-1 telehealth platform enforcement (NextMed 2025, Cerebral 2024, ongoing 2026) creates
      a regulatory environment where any platform operational misstep can result in a public
      enforcement action. eMed's absence from the current public enforcement list is a current fact,
      not a guarantee. Historic compounded-semaglutide exposure, undisclosed pixel tracking of
      health data, or unsubstantiated outcome claims could attract regulatory attention. This risk
      requires continuous legal monitoring and proactive compliance investment, not reactive response.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR007
      - CR008

  - calloutType: risk
    title: Aon Concentration Is a Single-Event Thesis-Breaker
    body: >-
      Aon's simultaneous roles as lead investor, anchor employer customer, and primary distribution
      channel create a concentrated dependency with no public contractual floor. A single Aon benefits
      leadership decision—to diversify GLP-1 vendors, reduce program funding, or exit the
      investment—would simultaneously remove eMed's largest revenue source, primary distribution
      pipeline, and most credible enterprise-market endorsement. No equivalent concentration structure
      exists among eMed's public comparables. Monitoring requires direct visibility into Aon's GLP-1
      benefit program performance and ongoing investment committee disposition.
    claimRefs:
      - CR025
      - CR026
      - CR031
      - CR033

  - calloutType: recommendation
    title: Require Independent Clinical Outcomes Disclosure Before Series B
    body: >-
      The most effective risk mitigant across regulatory, reimbursement, and competitive vectors is
      independently verified clinical outcomes data. eMed's adherence-improvement claims underpin
      the employer value proposition and are the primary defense against FTC unsubstantiated-claim
      enforcement. Investors should require peer-reviewed adherence benchmarks or independently
      audited employer outcomes data as a condition of Series B due diligence. Without this evidence,
      the $2B+ valuation rests on brand narrative and channel positioning—factors that erode rapidly
      under regulatory or competitive pressure.
    claimRefs:
      - CR009
      - CR010
      - CR015
      - CR034

  - calloutType: assumption
    title: Analysis Assumes No Current eMed-Specific Enforcement Action
    body: >-
      This chapter's risk assessments assume that as of June 2026, eMed has not received any named
      FDA warning letter, FTC investigation letter, or state regulatory action. This assumption is
      based on the absence of public enforcement records naming eMed Population Health Inc. in any
      federal or state enforcement database reviewed during research. Investors should independently
      verify through direct legal due diligence, including a FOIA request to FDA and FTC for any
      correspondence involving eMed. The absence of a public record does not preclude active
      investigation.
    claimRefs:
      - CR001
      - CR007
      - CR043

