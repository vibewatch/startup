  title: Customers
  summary: eMed's primary buyer is the self-insured employer; Aon is both the anchor proof-point and strategic investor, having
    deployed eMed's GLP-1 program for its own U.S. workforce with approximately 9% of eligible employees enrolling and company-reported
    +90% adherence and 25 lbs average weight loss. CVS Caremark serves as the dominant PBM distribution channel. High employer-market
    cost anxiety — 67% of employers cover GLP-1s for weight management but only 72% intend to continue coverage in 2027, while
    PSG surveys show ~49% of non-covering firms would refuse coverage at any price — represents both the demand ceiling and
    the competitive rationale for eMed's adherence-guarantee model.
sections:
- id: customer-segments-and-buyer-profile
  title: Customer Segments and Buyer Profile
  body: eMed's primary customer segment is the self-insured employer, typically large enterprise companies with 1,000 or more
    U.S. employees. The buying decision sits with HR leaders, benefits directors, and finance or CFO stakeholders who collectively
    manage population health spend. Employees and covered dependents are the end users of the GLP-1 program. eMed is not a
    direct-to-consumer pharmacy; its employer-facing value proposition centers on clinically managed weight-loss programs
    with outcome accountability rather than individual prescription convenience. eMed's company materials reference "more
    than 6 million global customers since its fall 2020 launch," though this figure includes early COVID-19 testing users
    and likely conflates individual testing customers with the smaller pool of employer-contracted GLP-1 program participants.
    eMed's for-businesses platform targets the self-insured segment explicitly, emphasizing transparent drug pricing without
    PBM markups, an at-home diagnostics onboarding kit, 24/7 clinical support, and an outcome guarantee (employers pay less
    if weight-loss targets are missed). The buying center also extends to PBM partners, most notably CVS Caremark, who serve
    as a distribution and formulary management layer.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  tableRefs:
  - TU001
- id: named-customer-evidence
  title: Named Customer Evidence and Proof Points
  body: Aon, the global professional services and benefits consulting firm, is eMed's most publicly documented employer customer.
    Aon is also a strategic investor, having announced an investment in August 2025 and subsequently deploying the eMed GLP-1
    Weight Management Program for its U.S. workforce for the 2026 plan year. The Aon 2026 new-hire benefits guide explicitly
    names the program and indicates employees enrolled in an Aon medical plan receive a lower prescription drug copayment
    for GLP-1 medications through the eMed platform. Lisa Stevens, Aon's Chief People and Administrative Officer, stated publicly
    that "colleagues are staying on the medication longer and seeing meaningful improvements in weight and BMI compared to
    before the program." Axios reported approximately 9% of eligible Aon employees enrolled in the pilot program. Separately,
    eMed's employer-facing platform page, citing Aon Workforce-Focused Phase Two Analysis findings from January 2026 and internal
    matched lab data from December 2025, claims a +90% program adherence rate, an average weight loss of 25 lbs per member,
    and a 14.2-month average program duration. eMed's Aon collaboration press release cites the partnership's context of Aon's
    analysis showing a 7-percentage-point reduction in medical spend growth in year two of GLP-1 therapy and a 44% reduction
    in hospitalization risk for major adverse cardiovascular events among adherent GLP-1 users. CVS Caremark is a second named
    partner; through an arrangement announced in early 2026, employers using CVS as their PBM can offer eMed's weight management
    services with the employers choosing their own subsidy level. CVS Caremark manages prescription benefits for up to 30
    million Americans, giving eMed significant potential reach via that channel. Thrive Global provides the lifestyle coaching
    companion program integrated into the eMed app for enrolled employees.
