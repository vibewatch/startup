- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Driver / Risk
  - Type
  - Impact
  - Diligence Path
  rows:
  - - Aon dual-role concentration (investor + customer)
    - Concentration risk
    - Single named employer customer dominates proof corpus; conflict of interest impairs outcome independence
    - Identify and onboard additional named enterprise employers; pursue independent outcome audit
  - - CVS Caremark channel dependence
    - Concentration risk
    - CVS manages ~30M beneficiaries but also competes (with own PBM GLP-1 programs); channel partner can redirect or terminate
    - Diversify to additional PBM or direct-employer channels; document contractual protections
  - - Employer GLP-1 market cost anxiety
    - Demand headwind
    - 67% cover GLP-1s; only 72% of covering employers plan to continue in 2027; 49% of non-covering firms won't add coverage
      at any price
    - eMed's outcome guarantee must convert skeptics; require employer ROI data from 2025-26 cohorts
  - - GLP-1 discontinuation risk reducing ROI
    - Adverse customer behavior
    - ~2/3 non-diabetic users discontinue within 1 year industry-wide; employers see high dropout as destroying cost-savings
      thesis
    - Disclose eMed-specific 1-year persistence vs. unmanaged benchmark; publish independently audited retention data
  - - Land-and-expand (upsell) potential
    - Expansion driver
    - Employers who see weight loss and adherence outcomes may expand coverage to more employee tiers, add chronic disease
      management modules
    - Track employer renewal rates, coverage-tier expansion, and multi-year contract lengths; publicly report cohort outcomes
  notes: Concentration and expansion assessments are based on publicly disclosed partnerships and employer market surveys
    as of Q2 2026. Risk magnitudes are qualitative judgments based on industry evidence; no quantitative revenue concentration
    data has been disclosed by eMed.
