  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: employer-contract-count
    missingEvidence: Total number of distinct employer client contracts for the eMed GLP-1 platform as of mid-2026.
    whyItMatters: Without an employer count, the company's actual customer penetration and revenue diversity cannot be assessed;
      the platform may be heavily reliant on one or two clients.
    diligencePath: Request commercial pipeline disclosure, CRM data, or independent customer survey; ask management team during
      investor due diligence for anonymized client count by cohort.
    relatedQuestionRefs:
    - QU005
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: average-contract-size
    missingEvidence: Average employer contract size in terms of covered employee lives or annualized revenue per employer.
    whyItMatters: Without average contract economics, the degree of Aon revenue concentration cannot be quantified and comparisons
      with competitors are impossible.
    diligencePath: Review financial statements (private; not yet disclosed) or request investor deck with ARR breakdown by
      customer segment during due diligence.
    relatedQuestionRefs:
    - QU007
  - type: missing-source
    severity: material
    topic: program-specific-dropout-rate
    missingEvidence: eMed's own GLP-1 program-specific 1-year dropout rate benchmarked against the Prime Therapeutics market
      baseline.
    whyItMatters: eMed claims 90%+ adherence; the market baseline is 60.9%. Without an apples-to-apples comparison using the
      same definition, the claimed advantage cannot be evaluated by buyers.
    diligencePath: Request eMed to publish an independent actuarial audit of its adherence cohort using the same 'no more
      than 60-day supply gap in 365 days' definition as Prime Therapeutics 2026.
    relatedQuestionRefs:
    - QU014
  - type: missing-source
    severity: material
    topic: discontinued-pilots
    missingEvidence: Evidence of any employer clients that piloted the eMed GLP-1 program and subsequently discontinued it.
    whyItMatters: Absence of churn evidence does not prove there is no churn; identifying any pilot failures would help calibrate
      the customer acquisition and retention model.
    diligencePath: Conduct reference calls with benefits consultants who have recommended eMed; review social media, benefits
      community forums, and HR professional networks for employer feedback.
    relatedQuestionRefs:
    - QU016
  - type: missing-source
    severity: material
    topic: competitor-adherence-comparison
    missingEvidence: Independent head-to-head comparison of eMed's adherence rate versus Calibrate, Omada, Found, or other
      employer GLP-1 platform operators using common measurement standards.
    whyItMatters: eMed's differentiation claim rests on superior adherence, but without a controlled comparison, buyers cannot
      verify the advantage; competing platforms make similar retention claims.
    diligencePath: Review published peer-reviewed studies, consultant whitepapers, or employer outcome reports from competing
      platforms; commission a benefit-consultant market comparison study.
    relatedQuestionRefs:
    - QU020
