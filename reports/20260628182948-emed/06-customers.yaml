callouts:
- calloutType: strength
  title: Aon Anchor Customer Provides Credible Proof Point
  body: Aon's decision to deploy eMed as a 2026 employee benefit — and its executive-level public endorsement — represents
    the strongest available proof of enterprise adoption. The 9% eligible-employee enrollment rate and Lisa Stevens' statement
    that colleagues are achieving meaningful weight and BMI improvements provide a credible, named reference backed by an
    organization with institutional credibility and incentive to report honest outcomes.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
- calloutType: risk
  title: Customer Concentration and Evidence Dependence on a Single Conflicted Investor
  body: Aon is simultaneously eMed's principal named customer, its strategic investor, and the source of the outcome data
    used to market the platform. This triple role creates a structural conflict of interest. No second named employer client
    has been disclosed. If Aon's reported outcomes are overstated or if the relationship evolves adversely, eMed lacks independent
    corroborating customer evidence to sustain its commercial proof narrative.
  claimRefs:
  - CU041
  - CU042
  - CU043
- calloutType: risk
  title: Broad Employer-Market GLP-1 Fatigue Limits Addressable Buyer Pool
  body: Adverse employer sentiment toward GLP-1 cost and discontinuation risk is intensifying heading into 2027. PSG data
    shows 49% of non-covering employers refuse coverage at any price. BGH data shows 28% of covering employers plan to exit
    or are uncertain about continuing coverage. Cigna's July 2026 employee coverage removal signals that major enterprises
    are reducing rather than expanding GLP-1 budgets. eMed must demonstrate compelling employer-level ROI to expand its market
    rather than being swept back by broader coverage retrenchment.
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU035
  - CU039
- calloutType: insight
  title: Adherence-Guarantee Model as a Demand Unlock
  body: Employer reluctance to cover GLP-1s is substantially driven by fear of high dropout rates and wasted drug spend. eMed's
    outcome guarantee (employers pay less if weight- loss targets are not met) directly targets this objection. If the company
    can publicly validate its 90%+ adherence claim with independently audited data, the guarantee structure could convert
    the dropout concern from a deal-breaker into a buying trigger across the large segment of cost-anxious but receptive employers
    who would cover if costs were demonstrably manageable.
