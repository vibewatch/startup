- id: procurement-and-adoption-path
  title: Procurement Path and Adoption Dynamics
  body: 'Employer procurement typically flows through a benefits-consulting or PBM channel. Aon''s dual role as investor and
    distribution partner is the clearest current example: Aon advises employer clients on benefit design while simultaneously
    directing them toward eMed''s platform. The CVS Caremark arrangement adds a PBM route that allows employers without a
    direct eMed relationship to access the platform via their existing pharmacy benefit management infrastructure. eMed''s
    adoption path requires employer enrollment, employee registration, at-home diagnostic kit completion, clinical eligibility
    review, and then prescription and ongoing 24/7 coaching. The employer sets the employee contribution level, meaning the
    platform accommodates varied subsidy strategies. eMed''s outcome guarantee (reduced employer payment if weight-loss milestones
    are missed) is designed to reduce procurement friction by shifting financial risk from buyer to vendor. For employers,
    fewer than 20% covered GLP-1 medications for weight loss in 2024, according to KFF data, indicating that eMed competes
    not only with peer platforms but also with the status quo of no structured employer GLP-1 program. GLP-1 prices available
    through the eMed-CVS arrangement are described by CEO Linda Yaccarino as "the most cost-effective price point available
    in the market." A growing trend of employer-sponsored lifestyle requirements — required by roughly 1 in 3 employers before
    dispensing GLP-1s in 2025 — aligns with eMed''s integrated diagnostic-plus- coaching approach and may improve competitive
    positioning versus pure-prescription telehealth vendors.'
  claimRefs:
  - CU016
  - CU017
  - CU018
