- id: retention-adherence-durability
  title: Retention, Adherence, and Durability
  body: eMed's central commercial claim is that its clinically managed, adherence-first model outperforms peer platforms and
    unmanaged GLP-1 access on retention. The platform's employer-facing page reports +90% adherence, 14.2 months average program
    duration, and a 95% retention rate for the Aon pilot, all attributed to December 2025 internal matched lab data. These
    figures are company-reported and not independently audited. The real-world GLP-1 adherence landscape provides relevant
    benchmarks. A 2026 analysis of commercially insured non-diabetic GLP-1 users (Prime Therapeutics, 62,650 members) found
    1-year persistence rose from 33.2% in 2021 to 60.9% in the first half of 2024, suggesting broad market improvement but
    still a meaningful gap relative to eMed's claimed 90%+. Tirzepatide users showed 64% 1-year persistence, which implies
    eMed's claims represent incremental but not transformative differentiation at the adherence ceiling unless the company's
    lifestyle-intervention and 24/7 support components substantially alter the baseline. A 2026 narrative review of GLP-1
    discontinuation found that while discontinuation is often nonpermanent (patients frequently reinitiate), multi-dimensional
    patient, behavioral, and healthcare system factors drive dropout, and current programs rarely address all five dimensions
    of the established medication adherence conceptual framework. Trustpilot reviews of eMed Labs show a 4.2/5 rating, with
    most reviewers praising the program's clinical support and results, while at least one reviewer noted dissatisfaction
    when the platform did not provide treatment beyond diagnostic findings. These signals suggest moderate but not universal
    satisfaction.
