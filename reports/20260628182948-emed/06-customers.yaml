- id: concentration-risk-and-adverse-evidence
  title: Concentration Risk, Objections, and Adverse Evidence
  body: 'Concentration risk is acute. Aon is simultaneously eMed''s most prominent named employer customer and a strategic
    investor, meaning any independent evaluation of Aon-reported outcomes faces a direct conflict of interest. No second named
    employer client has been publicly disclosed by eMed as of June 2026 outside of aggregate references to the broader 6-million-customer
    figure that predates the current GLP-1 platform. Employer-market headwinds provide the most material adverse context.
    A Business Group on Health survey (105 employers, February-March 2026) found that 67% cover GLP-1s for weight management
    but only 72% of those covering intend to continue in 2027, and companies not currently covering are unlikely to add coverage.
    A Pharmaceutical Strategies Group 2026 Trends in Drug Benefits report found 49% of employers not currently covering GLP-1s
    for obesity "would not do so at any price," and 9 in 10 respondents with existing coverage are moderately or very concerned
    about affordability. Cigna dropped GLP-1 coverage for its own employees effective July 2026. A Mercer survey found 51%
    of employers with 500+ workers plan to increase cost-sharing in 2026, with 77% identifying GLP-1 as a top cost concern.
    Discontinuation is a primary factor in employer ROI skepticism: the PSG report notes nearly two-thirds of non-diabetic
    users discontinue within one year, and 72% of surveyed benefits executives said discontinuation and weight regain are
    at least moderately influential in coverage decisions. GoodRx estimated 16 million people with commercial insurance lacked
    GLP-1 coverage for weight loss in 2026. Legal counsel note that employers narrowing or eliminating GLP-1 benefits face
    potential liability risk if eligibility criteria are inconsistently applied. These dynamics constrain eMed''s serviceable
    market and increase the sales burden of demonstrating sustained ROI.'
