summary:
  headline: >-
    eMed has a credible employer GLP-1 distribution story and marquee strategic backing, but the $2B+ valuation appears
    stretched relative to public digital-health comps because revenue, customer concentration, and unit economics remain
    materially undisclosed.
  overallScore: 5.3
