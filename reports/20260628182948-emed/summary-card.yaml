  topStrengths:
    - >-
      Aon provides unusually strong commercial proof because it is simultaneously a customer, strategic partner, and
      lead investor
    - >-
      eMed's COVID-era telehealth diagnostics roots make its current care-pathway claims more credible than a greenfield
      GLP-1 marketing funnel
    - Employer-focused positioning addresses a real budget pain point as GLP-1 costs pressure self-insured plans
    - The company has attracted high-profile distribution and brand assets through Linda Yaccarino and Tom Brady
  topRisks:
    - Revenue, ARR, gross margin, and customer-count opacity make the $2B+ valuation difficult to underwrite
    - >-
      Aon concentration creates circularity because the lead investor is also the flagship customer and validation
      source
    - >-
      GLP-1 telehealth faces tightening FDA, FTC, DEA, and state-practice scrutiny even if eMed emphasizes branded-drug
      and clinically supervised workflows
    - >-
      Employer coverage can retrench quickly if drug costs outpace outcomes or if adherence deteriorates outside curated
      pilots
    - >-
      Competitive and valuation compression across digital health could force a future down-round if growth or margins
      disappoint
  unresolvedGaps:
    - Current revenue, ARR, burn, gross margin, and runway are not publicly disclosed
    - Customer concentration outside Aon and the true scale of paying employer accounts remain unclear
    - >-
      Public evidence does not adequately validate eMed's claimed adherence, ROI, or biomarker outcomes across a broad
      installed base
    - Board composition, investor rights, and full cap-table structure are not visible in public materials
    - The technical and regulatory status of eMed's AI layer remains opaque despite heavy branding emphasis
