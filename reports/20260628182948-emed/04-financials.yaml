callouts:
  - calloutType: strength
    title: Capitated Model Unlocks Differentiated Revenue Quality
    body: >-
      If eMed successfully transitions from PMPM subscriptions to capitated
      contracts, it would be the first GLP-1 management platform to bear clinical
      risk alongside employers. Successful capitation at scale converts the product
      from a line-item benefits expense to an actuarial partner, making
      switching costs much higher and enabling richer outcomes data for subsequent
      employer renewals. The Aon pilot's 95% retention and 22.4 lb loss metrics,
      even sourced from a conflicted party, suggest the underlying clinical program
      may support this ambition.
    claimRefs:
      - CI007
      - CI002
      - CI035

  - calloutType: risk
    title: Revenue Transparency Gap Creates Underwriting Blocker
    body: >-
      eMed's complete absence of public financial disclosure — no ARR, no
      customer count, no margin, no audited statements — makes valuation underwriting
      impossible without NDA-gated diligence. The $2B+ Series A valuation was set by
      strategic investors (Aon, Brady, Yaccarino) who have operational incentives
      distinct from pure return-on-capital. Any financial investor entering at or
      near this level without full disclosure is effectively underwriting a narrative,
      not a financial model.
    claimRefs:
      - CI025
      - CI029
      - CI036
      - CI037

  - calloutType: recommendation
    title: Four Non-Negotiable Diligence Gates Before Capital Commitment
    body: >-
      Diligence must gate on four items before any capital commitment: (1) audited
      revenue and gross margin data with at least 12 months of actuals; (2)
      independent clinical outcomes audit with a matched control population;
      (3) Aon contract economics including any exclusivity provisions, minimum
      commitments, and ROFR language; and (4) the capitated model actuarial
      underwriting including reserve requirements and per-member risk exposure.
      Until these four gates clear, the appropriate stance is track, not invest.
    claimRefs:
      - CI029
      - CI025
      - CI010
      - CI035

