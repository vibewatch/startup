  - id: financial-verdict-diligence-blockers
    title: Financial Verdict and Diligence Blockers
    body: >-
      Revenue quality cannot be assessed. eMed has disclosed zero financial metrics —
      no ARR, GMV, customer count, revenue per employer, or gross margin. The
      company-claimed clinical outcomes (90%+ adherence, 21 lb average loss, 99%
      biomarker improvement) are single-source, company-reported figures that have
      not been independently replicated or published in peer-reviewed literature.
      The Aon pilot (22.4 lb average loss, 95% retention, 1,200 enrollees) was
      reported by Aon, an investor and commercial partner — structurally the least
      independent validation possible.

      The $2B+ implied valuation requires an implausibly high revenue multiple if
      eMed is pre-revenue or early revenue. Comparable digital health companies
      at Series A typically trade at 15–40x ARR; at $2B valuation, eMed would need
      $50–130M in ARR to justify a mid-range multiple. If current ARR is well below
      that — a likely scenario for a company that launched its GLP-1 employer
      program in 2024 — the valuation is a bet on future capitated model revenue,
      not current cash flows.

      The FTC's active enforcement against telehealth companies in 2025, including
      actions related to deceptive health claims and unauthorized billing, creates
      material regulatory risk. Hims & Hers, the public comp, received an FDA
      warning letter in February 2026 regarding compounded semaglutide marketing.
      eMed's branded-drug model avoids the compounding enforcement risk, but FTC
      scrutiny of adherence metrics and clinical outcome advertising remains a
      genuine near-term exposure. Four diligence blockers must be resolved before
      any capital commitment is defensible: (1) audited revenue and margin data
      under NDA, (2) independent clinical outcomes audit, (3) Aon contract
      economics and exclusivity/dependency scope, and (4) capitated model
      actuarial underwriting methodology.
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
      - CI036
      - CI037

