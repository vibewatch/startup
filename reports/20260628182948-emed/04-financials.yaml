  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: eMed-revenue-ARR
      missingEvidence: >-
        Audited revenue, ARR, gross margin, and customer count data for eMed.
        No financial statements have been published by the company.
      whyItMatters: >-
        Without actual revenue data, the $2B+ valuation cannot be assessed against
        any financial multiple; underwriting is impossible without this information.
      diligencePath: >-
        Request management accounts, audited financials, and revenue bridge under
        NDA from eMed management and legal counsel.
      relatedQuestionRefs: [QI002, QI006, QI010, QI011, QI015]
    - type: private-evidence-only
      severity: blocking
      topic: capitated-model-actuarial
      missingEvidence: >-
        Actuarial methodology, risk pool sizing, per-member risk exposure, and
        capital reserve requirements for the announced capitated care model.
      whyItMatters: >-
        Capitation requires risk-bearing capacity and reserves; without actuarial
        documentation, capital adequacy for the model cannot be verified.
      diligencePath: >-
        Request actuary report, risk-transfer contract templates, and reserve
        methodology from eMed; engage independent actuarial firm for review.
      relatedQuestionRefs: [QI008, QI019, QI026]

    - type: private-evidence-only
      severity: material
      topic: clinical-outcomes-independent
      missingEvidence: >-
        Independent peer-reviewed clinical outcomes study for the eMed GLP-1 program
        with a matched control population.
      whyItMatters: >-
        All clinical outcome claims are single-source company communications; without
        independent validation, the 90%+ adherence and 21 lb loss claims cannot be used
        to underwrite outcomes-guarantee contracts.
      diligencePath: >-
        Commission independent retrospective cohort study; review Aon de-identified
