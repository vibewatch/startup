company:
  name: eMed
chapter:
  number: 4
  title: Financials
  summary: >-
    eMed's revenue model is a B2B employer platform subscription (PMPM), augmented
    by a newly announced capitated care model launched with March 2026 Series A
    proceeds. Financial disclosure is minimal for a private company: no ARR, gross
    margin, CAC, or customer-count figures have been publicly released, making
    quantitative underwriting impossible without NDA-gated diligence. Public comps
    (Hims & Hers FY2025, Omada S-1) provide benchmark guardrails, and the $200M
    raise at $2B+ implies a steep revenue multiple that depends entirely on the
    capitated model achieving scale.

sections:
  - id: revenue-model-pricing-architecture
    title: Revenue Model and Pricing Architecture
    body: >-
      eMed's primary revenue driver is a per-member-per-month (PMPM) platform fee
      charged to self-insured employers for clinically managed GLP-1 programs. The
      platform bundles at-home diagnostics, clinician-guided prescribing, AI-driven
      adherence support, and proctor-led screenings into a single employer benefit
      offering. GLP-1 drug costs are employer-borne and run through pharmacy
      benefit manager (PBM) channels, most prominently via the CVS Caremark
      partnership; these costs are passed through and do not appear on eMed's
      revenue line. The company has not publicly disclosed list pricing, contract
      minimums, or any realized revenue figures.

      With its March 2026 Series A, eMed announced a strategic pivot toward a
      capitated care model — a flat per-member per-year fee designed to shift
      clinical and cost risk to eMed rather than the employer. Under this
      structure, eMed would receive a fixed fee per enrolled member and bear
      responsibility for delivering clinical outcomes within that budget. If
      achieved at scale, this model converts the platform from a margin-over-costs
      subscription to an outcomes-guarantee product with actuarial risk. Revenue
      would be recognized on a straight-line PMPM basis under ASC 606, reducing
      the episodic volatility of fee-for-service telehealth billing.

      Secondary revenue streams — a consumer direct channel and Thrive Global
      integration for corporate wellness — appear modest relative to the B2B core.
      eMed's Thrive Global partnership, announced in late 2025, provides an
      additional distribution pathway for consumer subscriptions, but no pricing
      or revenue share terms have been disclosed. Altogether the revenue picture
      is highly opaque for an entity seeking a $2B+ implied valuation: the
      capitated model is announced but not yet operational at commercial scale, and
      the underlying PMPM rate remains undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI038
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001

  - id: gtm-motion-and-sales-efficiency
    title: GTM Motion and Sales Efficiency
    body: >-
      eMed's go-to-market strategy is anchored by a direct enterprise sales motion
      targeting self-insured employers, using Aon as both a strategic distribution
      partner and a commercial proof point. Aon's August 2025 investment followed
      its own internal deployment of an eMed-built GLP-1 program for US employees:
      within six months, more than 1,200 employees enrolled, achieving an average
      weight loss of 22.4 pounds and a 95 percent retention rate. These metrics,
      reported by Aon, serve as the primary reference case eMed brings to
      prospective employer clients.

      The dual Aon role — lead investor in the March 2026 Series A and channel
      partner for employer distribution — is the most unusual structural feature
      of eMed's GTM model. Aon's 50,000-plus employer benefits consulting clients
      represent a captive distribution surface unavailable to peers. However, it
      also means eMed's early commercial validation data flows through a party with
      direct financial interest in the company's success, creating a conflict of
      interest when those metrics are used in third-party employer sales pitches.
      This dependency also elevates channel concentration risk: if the Aon
      relationship deteriorates or Aon exits its eMed position, eMed loses both
      capital and distribution simultaneously.

      The typical enterprise benefits sales cycle — request-for-proposal, clinical
      review, legal and compliance vetting, benefit-design integration — runs six
      to eighteen months at self-insured employers, meaning the March 2026 capital
      raise is likely funding pipeline development that will not yield substantial
      recurring revenue until late 2026 or 2027 at the earliest. CAC, sales cycle
      duration, quota attainment, and pipeline metrics are all undisclosed.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
    tableRefs:
      - TI003
    figureRefs:
      - FI002

  - id: cost-structure-gross-margin-drivers
    title: Cost Structure and Gross Margin Drivers
    body: >-
      eMed's cost structure comprises four primary buckets: clinical staff (physicians,
      nurse practitioners, care coordinators), the agentic AI platform (engineering,
      infrastructure, model training), at-home diagnostics and care kits (physical
      inventory and fulfillment), and general and administrative overhead. Unlike
      pure telehealth platforms, eMed's at-home blood-testing component adds real
      cost-of-goods-sold exposure that most software-first competitors avoid. This
      creates a unit-economics trade-off: higher per-member cost but a stronger
      clinical differentiation argument.

      Public comparables bracket the plausible margin range. Hims & Hers Health
      (NYSE: HIMS), the most comparable public company, filed its FY2025 10-K with
      the SEC on February 23, 2026, reporting gross margins of approximately 81
      percent on weight-management revenue that scaled sharply on GLP-1 demand.
      Omada Health's S-1, filed with the SEC on May 9, 2025 and amended May 29,
      2025, disclosed a digital chronic-care gross margin profile in the 60–70
      percent range for its employer programs before GLP-1 volumes matured. For
      eMed, excluding pass-through drug costs, a gross margin of 60–78 percent
      on the management-platform component is plausible given the at-home
      diagnostics component. Including drug cost passthrough would suppress the
      stated margin further, but that depends on whether eMed's PMPM is a net or
      gross revenue line.

      Under a capitated model, cost structure risk shifts materially: eMed would
      bear the full clinical cost if adherence slips or adverse-event rates rise,
      creating actuarial risk that pure-software margins do not carry. No capex
      intensive assets (manufacturing, clinical facilities) are publicly disclosed.
      Working capital requirements are uncertain given the physical kit component.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI033
