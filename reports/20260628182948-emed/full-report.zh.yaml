      - number: '7.4'
        title: 集中、品牌与治理风险
        blocks:
          - type: paragraph
            body: >-
              eMed 对 Aon 的依赖横跨三个同步角色：战略领投方（2025 年 8 月）、锚定雇主客户（通过 2026 年初推出的 Aon 员工 GLP-1 福利项目）和主要分销渠道。这种三重角色集中在结构上很少见。如果
              Aon 高级 HR 领导层调整策略——分散 GLP-1 供应商、转向竞争平台，或在成本压力下下调 GLP-1 福利优先级——eMed 会同时失去收入、分销和市场可信度信号。Aon Phase Two GLP-1
              workforce analysis（2026 年 1 月）明确承认，成本控制正成为雇主越来越重视的事项——这正是可能触发雇主从 eMed 高接触模式分散出去的压力。没有公开披露量化 eMed
              按客户的收入集中度。

              Tom Brady 在 2026 年 3 月 Series A 同步宣布担任 Chief Wellness Officer，使品牌依赖落在一位非临床公众人物身上。Brady 长期健康合作伙伴 Alex
              Guerrero 曾因营销未经证实的健康补充剂而受到 FTC 审查，这给 eMed 受 FDA 监管的开方业务带来间接声誉暴露。任何把 Brady 的 eMed 身份与 Guerrero
              既有监管暴露联系起来的媒体报道，都可能带来不成比例的关注。Linda Yaccarino 于 2025 年 8 月出任 CEO，带来媒体公司经验，但其从 X 争议性离任的残余叙事仍在，可能重新引发媒体审视。

              以 eMed 的规模看，治理和披露风险实质存在。公司估值 $2B+、融资 $200M，却没有公开披露经审计财务。公司声称 50,000+ 活跃患者数，未获独立验证。FTC 和 SEC
              越来越关注高知名度数字健康融资中的融资宣称是否存在重大误陈述。截至 2026 年 6 月，没有公开执法记录点名 eMed，但没有公开记录并不排除正在进行的调查；私人公司不透明性使每一轮融资都存在尽调风险。
