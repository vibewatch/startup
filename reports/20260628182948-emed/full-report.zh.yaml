      - number: '4.2'
        title: GTM 动作与销售效率
        blocks:
          - type: paragraph
            body: >-
              eMed 的上市路径以直销企业客户为核心，瞄准自保险雇主，并把 Aon 同时作为战略分销伙伴和商业验证样本。Aon 在 2025 年 8 月投资之前，已在美国员工中内部部署 eMed 搭建的 GLP-1
              项目：六个月内，超过 1,200 名员工加入，平均减重 22.4 磅，留存率 95%。这些由 Aon 披露的指标，是 eMed 向潜在雇主客户展示的首要案例。

              Aon 的双重角色——既是 2026 年 3 月 Series A 的领投方，也是雇主分销渠道伙伴——是 eMed GTM 模式里最特殊的结构特征。Aon 拥有 50,000 多家雇主福利咨询客户，给 eMed
              带来同行拿不到的封闭分销面。但这也意味着，eMed 早期商业验证数据来自一家直接持有其财务利益的机构；当这些指标被用于第三方雇主销售时，利益冲突随之出现。该依赖还放大了渠道集中风险：一旦 Aon 关系恶化，或
              Aon 退出 eMed 持仓，eMed 会同时失去资本和分销。

              典型企业福利销售周期包括 RFP、临床审查、法务与合规尽调、福利设计接入，在自保险雇主侧通常需要 6 到 18 个月。因此，2026 年 3 月融资很可能是在资助管线建设，最早也要到 2026 年底或 2027
              年才会产生可观经常性收入。CAC、销售周期时长、销售配额达成率和管线指标均未披露。
