      - number: '5.2'
        title: 技术架构与 AI 宣称
        blocks:
          - type: paragraph
            body: >-
              eMed 的技术定位围绕其所谓「empathic agentic AI platform」展开。Tom Brady 在 2026 年 3 月 Series A 公告中的投资声明原文使用了这一表述：「eMed
              富有同理心的 agentic AI 平台，结合其团队和伙伴的力量。」Series A 新闻稿还称，融资将用于「进一步推进 eMed 的 agentic AI
              平台」。除品牌层面的描述外，任何技术架构细节都未公开：没有披露云服务商，没有具名 LLM 或 AI 模型供应商，没有公开 API 文档，没有产品工程博客，也没有公开 GitHub 仓库。

              「empathic agentic AI」这个词，传递的是一种围绕对话式、主动式 AI 的营销定位：AI 不等患者提问，而是主动发起患者互动。医疗场景中的 agentic AI 架构通常包含由 LLM
              支撑的编排循环，可根据会员状态触发动作（安排 check-in、标记漏服、调整指导信息）。eMed
              是否真的搭建了这类编排层，还是把该术语用于基于规则的自动互动系统，公开证据无法验证。该不透明性是最重大的技术尽调缺口：如果 AI 确实具备 agentic 特征，它可能根据 FDA Digital Health
              Center of Excellence 指引被归类为软件即医疗器械（SaMD），触发 510(k) 或 De Novo 审查义务。

              在医疗数据互操作性方面，任何连接雇主 HR 系统、药房福利管理方和远程医疗开方医生的平台，都预期应根据 ONC 信息阻断规则遵守 HL7 FHIR US Core 标准；eMed 未公开确认已实施
              FHIR。未发现带有 eMed 作者身份的 Stack Overflow 标签、Hacker News 讨论、公开 Discord 或 GitHub 仓库；这与闭源专有技术栈一致，但也使独立技术评估无法进行。
