      - number: '8.2'
        title: 可比公司组与倍数分析
        blocks:
          - type: paragraph
            body: >-
              eMed 最相关的公开可比公司是 Hims & Hers Health（NYSE: HIMS），它是上市远程医疗数字健康公司中拥有 GLP-1 处方产品组合的领先者。Hims 报告 FY2025 总净收入为
              $2,347.6 million，较 FY2024 的 $1,476.5 million 增长 59%，主要由 GLP-1 体重管理收入驱动。Hims 于 2026 年 2 月 23 日向 SEC 提交的
              FY2025 10-K 披露，截至 2025 年 6 月 30 日，非关联方合计市值约 $10.1 billion（按 $49.85/share），意味着当时的 trailing revenue multiple
              约 4.3x。不过，Hims 股价在 2026 年 2 月 FDA 就复方 semaglutide 营销发出警告信后大幅下跌，也就是说 eMed 2026 年 3 月融资时的有效可比倍数很可能更低——这凸显了
              GLP-1 远程医疗估值对监管的敏感度。

              Omada Health 因聚焦雇主渠道并定位价值医疗，是更接近的商业模式可比公司。Omada 于 2025 年 5 月 29 日向 SEC 提交的 S-1/A 披露，FY2024 收入 $169.8
              million（增长 38%）、2024 年净收入留存率 128%、净亏损 $47.1 million。Omada 2025 年 IPO 的发行价中点为 $19——按预计新增 7.9M 股、每股 $19
              计算——意味着募资总额约 $150M；根据总流通股不同，总市值约在 $1.5-2.0B 区间。以 Omada 2025 年 Q1 约 $220M run-rate 计算，对应 forward revenue
              multiple 约 7-10x。

              Teladoc Health（NYSE: TDOC）则是倍数压缩的反面教材。Teladoc 报告 2026 年 Q1 收入 $613.8 million（同比下降 2%），年化 run-rate 约 $2.45
              billion，adjusted EBITDA 为 $58.2 million，但其公开市值已从 2021 年 $40+ billion 峰值大幅压缩至 2026 年初约 $2-3 billion——对应不到
              1x 的收入倍数。eMed 虽然是未有收入或早期收入公司，增长期权更高，但 Teladoc 说明，一旦数字健康增长故事落空，倍数压缩可以非常剧烈。

              私人市场可比公司给出的图景同样冷静。根据 Rock Health 2025 年末数字健康融资概览，Hinge Health 2025 年在 Nasdaq 上市时估值约 $3 billion，不到其 2021
              年私人估值 $6.2 billion 的一半。GLP-1 远程医疗独角兽 Thirty Madison 2021 年 6 月估值 $1 billion，2025 年被 Remedy Meds 以约 $500
              million 全股票交易收购，相当于打五折。这些先例说明，2021 年代际的私人数字健康加价在 2023-2026 年经历了大幅修正，也符合 PitchBook 2026 Venture Capital
              Outlook 的判断：尽管市场有所改善，退出价值仍低于 2021 年水平。
