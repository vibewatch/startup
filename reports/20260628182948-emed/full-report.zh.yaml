      - number: '5.3'
        title: 集成与生态依赖
        blocks:
          - type: paragraph
            body: >-
              eMed 的运营模式依赖四个外部伙伴，它们的实力与条款直接决定平台的临床、商业和技术可行性。CVS Caremark 是美国最大药房福利管理方，服务最多 3,000
              万商业保险人群，提供药品准入和优惠定价层。Yaccarino 将该定价描述为「市场上可获得的最具成本效益的价格点」，CVS 也确认，合作为其业务增加了另一条 GLP-1 准入路径。eMed 开方门户与 CVS
              Caremark 处方集管理系统之间的集成架构未公开说明；若任一方改条款，替代风险背后的运营机制不透明。

              Thrive Global 提供行为改变和生活方式教练层。GLP-1 Companion 项目以 Microstep 为基础，围绕饮食、运动、睡眠、压力和连接提供干预。合作公告提到一个
              URL（thriveglobal.com/integrations/emed），暗示存在正式集成端点，但两个平台之间的数据流和交接协议未披露细节。

              Aon 同时担任领投方和主要分销渠道。其 Series A 领投方身份带来结构性冲突：支撑 eMed 商业叙事的试点数据，来自 Aon 在自家员工中运行的项目，并由 Aon
              披露。因此，该验证数据并不独立。但反过来，eMed 也拥有一个深度利益一致的渠道伙伴，Aon 有 50,000 多家雇主客户，并且在 eMed 商业成功中有机构利益。一旦 Aon 关系恶化，eMed
              会同时失去资本、主要案例数据和企业分销。

              居家测试硬件和实验室处理构成第四个依赖，且完全不透明。具体居家血液采集设备供应商、接收样本的 CLIA 认证实验室、周转时间和物流伙伴均未披露。该层任何供应链中断、实验室质量事件或设备召回，都会直接打断 eMed
              区别于简单处方型远程医疗模式的生物标志物检测环节。
