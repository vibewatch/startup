companyProfile:
  summary: >-
    eMed 是一家总部位于 Miami 的数字健康公司，成立于 2020 年，最早靠远程医疗监督下的 Abbott BinaxNOW COVID-19 检测跑出声量，之后转向面向雇主的 GLP-1
    人群健康管理。公司现在把居家诊断、医生指导处方、依从性支持、PBM / 分销合作以及品牌化健康营销组合成一个福利导向的肥胖护理平台。Aon 在 2025 年的战略投资以及 2026 年领投 $200M Series
    A，既给出强商业验证，也暴露出渠道集中信号；Tom Brady 与 Linda Yaccarino 则放大了品牌可见度。公开披露仍然有限，尽管市场动能明显，收入质量与承保判断问题仍未解决。
