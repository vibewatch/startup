      - number: '1.5'
        title: 负面信号与未解问题
        blocks:
          - type: paragraph
            body: >-
              最大的尽调问题不是 eMed 是否有市场动能；公开来源清楚显示它确实有。更难的问题是，在动能之下，公司是否具备持久、可防御的经济模型和治理。包括依从性、ROI
              和生物标志物改善在内，多数量化论据来自新闻稿中的公司披露，而不是独立审计。独立报道还指出，更广泛的 GLP-1 远程医疗行业正面临围绕安全、营销和监管缺口的更多审视；即便 eMed
              把自己定位成临床纪律更强的替代方案，这一点仍然重要。Axios 还加入了更具体的声誉褶皱：Tom Brady 与 Alex Guerrero 的关系引发问题，后者曾因健康产品宣称与 FTC
              达成和解。与此同时，当前收入、客户数量、董事会构成、支付方组合和详细员工规模均未披露。结果是一家公司叙事牵引力很强，但公开证据对治理质量和底层单位经济的支持仍有限。
