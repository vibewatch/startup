      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              大型自保雇主的 GLP-1 福利管理预算，主要掌握在 CFO 与 Chief Human Resources Officer 手中，他们设定年度福利设计预算；HR
              福利负责人则通过经纪人和福利顾问落地项目选择。Aon 同时担任 eMed 的领投方和全球最大 HR / 福利咨询公司，为 eMed 打开直接雇主分销通道，绕过典型的多供应商 RFP
              周期。这个结构优势很重要，因为新福利供应商的标准销售路径通常要经历 12 到 24 个月采购周期，并受年度福利年度锁定约束。

              员工数 5,000 人及以上的大型自保雇主，是价值最高的买方分层：他们承担 GLP-1 使用的全部精算风险，计划人群规模足以产出可测量的 cohort 结果，也有行政能力落地带临床监督的管理项目。KFF 2025
              调查发现，员工数 5,000 人及以上的公司中，43% 现在覆盖用于肥胖治疗的 GLP-1；1,000–4,999 人层级为 30%。中型市场雇主（200–4,999
              人）正在增长，通常通过保险公司全保或部分保险，这会把预算所有者从雇主 HR 负责人变成健康计划医疗总监。Medicaid、Medicare Advantage 和 VA
              等政府支付方是另一个独立且扩张中的渠道，eMed 在创始叙事中曾提及，但当前公开证据对政府支付方合同支持有限。PHTI 的雇主方案分析确认，大型雇主越来越多地把结构化生活方式项目和事先授权列为 GLP-1
              覆盖条件，从而催生对能够系统满足这些条件的供应商需求。
