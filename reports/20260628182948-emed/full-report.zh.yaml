      - number: '8.5'
        title: 建议、尽调与监控
        blocks:
          - type: paragraph
            body: >-
              基于截至 2026 年 6 月 28 日可获得的证据，对 eMed 的合适立场是 “research-more”，估值标记为 “stretched”，置信度低。市场机会真实存在，雇主渠道模式也有 Omada
              Health 这样的公开先例，并具备强留存指标。但是，eMed 财务完全不透明、Aon 集中度带来结构性风险，加上数字健康估值背景偏逆风，意味着以 $2B+
              入场的投资人本质上是在给命题定价，而不是给业绩记录定价。若要上调至 “track” 或 “buy”，最低可行证据包应包括：（a）披露 ARR 至少 $60M；（b）披露客户数量，且 Aon 之外至少有 10
              家具名企业雇主；（c）独立临床结果数据显示 12 个月 GLP-1 依从率高于 50%；（d）雇主续约率超过 80% 的证据。

              对已按 Series A 定价投入的投资人，关键监控信号包括：Aon 自身雇主健康策略，以及是否继续把 eMed 保留为其主要 GLP-1 福利供应商；eMed 的 FDA
              监管姿态（无警告信或执法问询）；更广泛雇主福利市场对 GLP-1 成本管理的反应（如果覆盖削减加速，eMed 的管线合同会承压）。TechCrunch 数据显示，Abridge 等 AI-native 健康公司
              2025 年估值翻倍至 $5.3B；这说明，如果 eMed 能可信地定位为 AI 驱动临床平台，而不是数字处方中介，仍有现实上行路径。PitchBook 2026 VC outlook
              也指出，AI-enabled 公司在 2025 年享有 19% 的交易规模溢价；如果 eMed 能用结果数据证明 AI 定位，这确实是估值驱动因素。

              eMed 投资逻辑的终止标准包括：（1）任何 FDA 行动因非法开方或复方点名 eMed；（2）Aon 公开减少或终止合作；（3）因 ARR 不达标触发有权利下调或持平的 Series B；（4）雇主 GLP-1
              福利削减影响 eMed 已签雇主基础超过 40%。这些信号可监控，并有 6-12 个月领先指标。Rock Health 2025 年数据显示，2025 年发生 195 起 M&A 交易，较 2024 年增长
              61%；如果 eMed 选择战略出售而非 IPO，潜在买方包括健康计划、药房福利管理方和雇主福利平台。
            claimRefs:
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV039
              - CV040
              - CV041
          - type: table
            tableRef: TV006
            claimRefs:
              - CV006
              - CV038
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 所有收入假设都是估算
            body: >-
              eMed 没有披露任何 ARR、收入 run-rate、客户数量或财务 KPI。本章所有基于收入的估值计算，都用雇主渠道数字健康基准（主要是 Omada Health S-1 和 Hinge Health IPO
              数据）作 proxy。这些估算不确定性很高，一旦管理层披露任何信息，应立即更新。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV031
              - CV032
              - CV033
          - type: callout
            title: Aon 集中度是结构性缺陷
            body: >-
              Aon 同时担任 eMed 的领投方、最显眼分销伙伴和旗舰雇主客户。这种三重集中不只是风险因素，而是让 $2B+ 估值部分自我指涉的结构特征。任何投资人评估都必须尽调：Aon 来源交易贡献的 ARR
              占比，与独立赢得的企业客户相比到底多大。类比来看，Omada 在 S-1 中披露 Cigna 占收入 36%，并将其列为重大风险；eMed 缺少可比披露。
            calloutType: risk
            claimRefs:
              - CV016
              - CV035
              - CV036
          - type: callout
            title: Goldman Sachs 警示：抗肥胖市场可能低于预期
            body: >-
              Goldman Sachs 发表分析警告，抗肥胖药物市场可能小于共识预测，理由是患者停药率和付款方覆盖阻力构成结构性约束。该负面观点与临床证据一致：超过 50% 的 GLP-1 患者会在 12
              个月内停止治疗，从而限制 eMed 这类依从性平台的可触达市场。Goldman 这份说明代表少数但可信的负面观点，直接挑战支撑 eMed 牛市情景的 GLP-1 市场规模假设。
            calloutType: insight
            claimRefs:
              - CV025
              - CV026
              - CV027
          - type: callout
            title: 会改变估值判断的关键里程碑
            body: >-
              如果 eMed 披露 ARR 超过 $60M、拥有 10+ 家具名企业雇主客户、证明 12 个月 GLP-1 依从率高于 50%，且显示 Aon 占已签 ARR 低于 40%，可上调至 “track”。如果
              ARR 超过 $100M、已证明 2 年雇主留存率高于 80%、独立临床结果发表在同行评议刊物，并开始准备含审计财务的 S-1 申报，可上调至 “buy”。在上述里程碑能通过公开披露验证前，维持
              “research-more”。
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV041
              - CV042
