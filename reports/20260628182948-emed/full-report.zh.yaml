    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              eMed 是一家总部位于 Florida 州 Miami 的远程医疗公司；Reuters 称其成立于 2020 年，聚焦雇主与政府支付方对 GLP-1
              使用的管理。公司如今把自己定位成面向雇主的平台，提供临床监督下的 GLP-1 以及更广泛的人群健康项目，而不是纯粹的 DTC 处方服务。2026 年 3 月融资公告、2025 年 8 月 Aon 投资新闻稿以及
              Reuters 报道，对其运营栈的描述高度一致：一个数字优先流程，把居家诊断、医生指导处方、持续依从性支持和 AI 驱动互动串起来。这个定位很关键，因为它把 eMed
              从便捷远程医疗门店，转成了向自保雇主销售成本控制、依从性和医疗监督的福利管理供应商。同一批来源也显示，eMed 仍提及 DTC 产品，但公开叙事的重心已经转向雇主赞助的肥胖与慢病护理项目。
