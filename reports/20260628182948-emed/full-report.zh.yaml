      - number: '3.5'
        title: 护城河耐久性、商品化风险与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              eMed 的护城河耐久性建立在四个主张上：Aon 分销渠道、专有居家诊断基础设施、拥有复合行为数据的 AI 互动平台，以及让激励与雇主结果对齐的按人头付费模型。每一项都需要审视。

              Aon 渠道真实存在，但带有集中风险。如果 Aon 把 GLP-1 管理推荐分散给多个供应商，提供竞争平台，或谈判有利于其他伙伴的排他条款，eMed 的分销优势会迅速侵蚀。Aon
              同时是领投方和渠道伙伴，让这段关系的治理成为未解尽调问题：在什么节点上，Aon 对雇主客户的受托责任会与其在 eMed 的财务权益发生分歧？

              居家诊断护城河是真实的，因为没有同业拥有同样的 COVID 时期监管与运营历史——但它可以复制。资本充足的竞争者可以在 12 到 24 个月内自建或收购居家检测能力。这道护城河更像上市时间优势，而不是结构性壁垒。

              没有独立审查，很难评估 AI 互动平台。eMed 的 90%+ 依从性宣称，是公开文献中非管理型 GLP-1 使用者约 40% 真实世界依从率的两倍以上。差异可能反映 eMed
              特有的真实效果（管理型项目、更高互动、居家诊断），也可能反映队列 选择（有动力的雇主注册人群不同于一般人群）。独立审计解决这个缺口之前，AI 护城河只能算部分支持，尚未确认。

              尽调应跟踪的负面竞争信号包括：WeightWatchers 在 GLP-1 市场冲击后的财务重组（说明市场能多快让战略定位差的既有玩家 失效）；Calibrate 早期遭遇市场挑战后从 DTC
              转向雇主（说明这个领域 B2C 到 B2B 转型常见，也可能指向此前商业模式压力）；以及 FDA 2026 年 3 月针对 30 家远程医疗公司的执法行动（对行业和任何使用复方药的 eMed
              竞争者不利，但也表明监管仍高度警觉，未来可能扩展到 eMed 自身实践）。Omada 2025 年 5 月提交给 SEC 的 S-1
              文件，为直接同业提供了最充分的公开风险因素披露；投资人应把其中竞争风险因素章节，作为 eMed 同样面临的结构性风险代理。AI 辅导工具商品化和 PBM 去中介化，是严重度最高的两项长期替代风险。
