  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              eMed 的主要收入驱动，是向自保雇主收取按会员每月（PMPM）计算的平台费，用于临床管理型 GLP-1 项目。平台把居家诊断、医生指导处方、AI
              驱动依从性支持和由监督员带领的筛查打包成单一雇主福利产品。GLP-1 药物成本由雇主承担，并通过药房福利管理（PBM）渠道运行，最突出的是 CVS Caremark 合作；这些成本属于转嫁成本，不应出现在
              eMed 收入线上。公司尚未公开披露标价、合同最低额或任何实际收入数字。

              随 2026 年 3 月 Series A，eMed 宣布战略转向按人头付费护理模型——按会员每年收取固定费用，设计目标是把临床与成本风险从雇主转移给 eMed。在该结构下，eMed
              将按每名注册会员获得固定费用，并负责在该预算内交付临床结果。如果能规模化落地，这一模型会把平台从成本加成订阅，转成带精算风险的结果保证产品。收入将在 ASC 606 下按直线 PMPM
              确认，降低按服务收费远程医疗账单的事件性波动。

              次要收入流——消费者直连渠道和用于企业健康的 Thrive Global 集成——相对 B2B 核心显得有限。eMed 与 Thrive Global 的合作于 2025
              年末宣布，为消费者订阅提供额外分销路径，但未披露定价或收入分成条款。总体看，对于一家寻求 $2B+ 隐含估值的公司，收入图景高度不透明：按人头付费模型已经宣布，但尚未在商业规模上运行，底层 PMPM
              费率也未披露。
