      - number: '6.3'
        title: 采购路径与采用动力
        blocks:
          - type: paragraph
            body: >-
              雇主采购通常经由福利咨询或 PBM 渠道流动。Aon 同时是投资人和分销伙伴，是当前最清晰的案例：Aon 一边为雇主客户提供福利设计建议，一边把客户导向 eMed 平台。CVS Caremark 安排增加了一条
              PBM 路径，让没有直接 eMed 关系的雇主，也能通过现有药房福利管理基础设施接入平台。eMed 的采用路径要求雇主参保、员工注册、完成居家诊断套件、临床资格审查，随后进入处方和持续 24/7
              教练支持。雇主设定员工出资水平，因此平台可适配不同补贴策略。eMed 的结果保证（若未达到减重里程碑，则降低雇主付款）旨在把财务风险从买方转给供应商，从而降低采购阻力。KFF 数据显示，2024 年覆盖
              GLP-1 减重药物的雇主少于 20%；这说明 eMed 不仅与同类平台竞争，也与「没有结构化雇主 GLP-1 项目」这一现状竞争。CEO Linda Yaccarino 将 eMed-CVS 安排下可获得的
              GLP-1 价格描述为「市场上可获得的最具成本效益的价格点」。雇主赞助生活方式要求正在增加——2025 年，约三分之一雇主要求先满足这类条件才配发 GLP-1——这与 eMed
              诊断加教练的整合路径一致，也可能改善其相对纯处方远程医疗供应商的竞争位置。
