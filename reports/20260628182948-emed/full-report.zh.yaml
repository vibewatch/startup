  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              eMed 位于远程医疗开方、雇主福利管理和 GLP-1 药品准入的交汇处——这三个领域在 2025–2026 年同时承受联邦监管压力。FDA 对复方药执法升级，是最直接的结构性威胁。到 2026
              年初，Wegovy 被移出短缺名单后，FDA 已向 30 多家远程医疗公司发出警告信，原因是其非法营销复方 semaglutide。2026 年 2 月针对 Hims & Hers Health
              的公开警告信显示，高知名度数字健康公司并不会免于点名执法。虽然 eMed 公开材料聚焦品牌 FDA 批准药物，但其在 2022–2024 年短缺期的行业定位，加上 FDA
              执法范围之广，留下了尚未公开澄清的残余暴露。若监管认定 eMed 曾在批准参数外促成复方 GLP-1 处方，公司可能面临强制产品撤回、纠正性广告和声誉损害。

              2024–2026 年，FTC 积极追击远程医疗减重平台。FTC 2025 年 4 月对 NextMed 的行动，为欺骗性计费建立了执法模板——在未披露资格前置条件的情况下，向患者收取 GLP-1
              处方费用。FTC 与 Cerebral 在 2024 年达成的和解，则为通过像素追踪向广告平台分享敏感健康数据树立先例，构成健康泄露通知违规。FTC 于 2024 年 8 月发布明确指引，表示正在监测 GLP-1
              远程医疗平台的欺骗行为，传递持续执法意图。两类模式——不透明订阅计费和健康数据变现——都是任何使用数字营销基础设施和经常性付款模式的 GLP-1 远程医疗平台的现实风险。

              DEA 关于远程医疗中共同开具受控物质的规则，仍处于临时 COVID 时期灵活性延长期后的永久规则制定过程中。HHS HIPAA 指引对所有健康数据分享施加最低必要标准。各州企业行医（CPOM）规则在 50
              个州各不相同，对雇佣模式远程医疗平台施加结构性约束。要在这些相互重叠的联邦和州框架中合规，需要实质且经常性的法律运营成本；因此，eMed 的法律预算是不可谈判的竞争性开销。
