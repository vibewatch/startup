      - number: '7.5'
        title: 融资、估值与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              eMed 2026 年 3 月拿到的 $2B+ 估值，已经把很高的增长预期打进价格：披露的约 50,000 名活跃用户要扩张数倍，企业合同也要持续增长。五类事件会实质性压缩估值，并冲击 Series B
              路径：（1）FDA 警告信或 FTC 执法行动直接点名 eMed；（2）同行评议临床证据显示依从率不高于未管理 GLP-1 治疗；（3）Aon 降低对 eMed
              项目的投入，或分散给竞争供应商；（4）自保雇主持续收缩 GLP-1 覆盖，导致可触达池子低于盈亏平衡轨迹；（5）生物类似药 semaglutide 入场（预计 2026–2027
              年），压低品牌药定价，抽掉成本管理叙事。

              融资风险主要卡在时间上。$200M Series A 能提供多年 runway，但也抬高了增长门槛。雇主企业销售周期通常为 6–18
              个月；临床、工程和企业销售团队扩张会带来可观现金消耗。数字健康可比公司给出警示：WeightWatchers 在 GLP-1 冲击后于 2024 年申请 Chapter 11 破产；Calibrate
              裁员；Omada Health 2025 年 IPO 时收入倍数已被压缩。这些先例说明，雇主数字健康估值对增长轨迹和结果证据高度敏感。eMed 没有披露盈利路径；如果 2026
              年扩张目标落空，下轮下调估值并不意外。

              投资人应跟踪：每季度新签雇主合同数量（对照 Aon 渠道依赖）、eMed 与 FDA 或 FTC 的任何监管往来、Brady 是否继续公开背书品牌药临床主张，以及雇主福利年度调查中的 GLP-1
              覆盖轨迹。终止标准应锚定三件可量化事件：FDA 或 FTC 对 eMed 点名执法；已发表数据表明依从率不高于未管理护理基线；Aon 任何声明显示其在分散 GLP-1
              供应商名单。持续机构信心应以季度依从率和留存数据披露为前提。
