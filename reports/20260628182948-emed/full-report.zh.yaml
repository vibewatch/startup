      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              从能力维度看，eMed 最强的差异化在于继承自 Abbott BinaxNOW 合作的居家诊断流程、公司材料中称为「有同理心的智能体式 AI 平台」的 AI 驱动互动层，以及由 Aon
              锚定的直接雇主渠道。Calibrate、Found 和 Noom 各自都有专有互动工具，但没有一家记录了同等居家诊断能力，也没有战略投资人同时充当主要分销伙伴。Omada 的 Lilly 合作和 IPO 路径是
              eMed 缺少的真实能力加速器——Omada 将通过 Lilly 基础设施获得品牌药优先网络和患者获取入口。

              定价上，市场呈现分叉：雇主项目收取按会员计的管理费，DTC 渠道则采用直接订阅价格。Hims & Hers 的 Wegovy pill 起价 $149 每月，包含处方。Calibrate
              将项目设计成雇主覆盖福利，成本随雇主安排变化。Found for Business 预计，未覆盖 GLP-1 处方集时，每名覆盖成员每年可节省 $4,204；覆盖后节省更高，并把 ROI
              论据作为销售锚点来变现。eMed 公开材料强调按人头付费模型（固定费用风险共担），而不是按处方转嫁费用；如果依从性和结果能经受审计，这会明显区别于同业定价，并可能成为最可防御的定价结构。

              在 GTM 与分销上，eMed 与多数直接同业之间的结构性差距就是 Aon 渠道。Aon 作为全球最大 HR 与福利咨询公司，意味着 eMed 进入雇主对话时是被推荐供应商，而不是一个主动陌生拜访、寻求 12 到
              24 个月 RFP 周期的外部供应商。多数直接同业通过健康计划集成、经纪人网络或直接雇主外展销售——没有任何一家拥有一个同时达到 Aon 规模的投资人和渠道伙伴。这是 eMed 近期最持久的护城河。

              监管与信任姿态上，FDA 2026 年 3 月向 30 家远程医疗公司发出警告信，指其对复方 GLP-1 产品做出虚假宣称，损害了依赖复方 semaglutide 作为低成本入口的 DTC 平台竞争位置。eMed
              的受监督临床模型让它成为合规替代方案，尽管其自身监管审视状态在公开来源中仍未披露。Hims & Hers 已直接面临复方药执法压力。上市同业中，Omada 的 S-1 文件提供了最完整的公开监管风险因素披露。
