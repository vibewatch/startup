      - number: '4.3'
        title: 成本结构与毛利驱动因素
        blocks:
          - type: paragraph
            body: >-
              eMed 的成本结构由四类组成：临床人员（医生、执业护士、护理协调员）、agentic AI
              平台（工程、基础设施、模型训练）、居家诊断与护理套件（实物库存和履约）、以及一般行政开支。不同于纯远程医疗平台，eMed 的居家血液检测环节带来真实 COGS
              暴露，多数软件优先竞品可避开这项成本。由此形成单位经济权衡：单会员成本更高，但临床差异化叙事更强。

              公开可比公司给出了可能的毛利区间。最接近的上市公司 Hims & Hers Health（NYSE: HIMS）于 2026 年 2 月 23 日向 SEC 提交 FY2025 10-K，披露减重业务收入在
              GLP-1 需求拉动下快速放大，毛利率约 81%。Omada Health 于 2025 年 5 月 9 日向 SEC 提交 S-1，并在 2025 年 5 月 29 日修订，披露其雇主项目在 GLP-1
              量级成熟前，数字慢病护理毛利率处于 60–70% 区间。对 eMed 而言，剔除转嫁药品成本后，考虑居家诊断环节，管理平台部分实现 60–78%
              毛利率是可能的。若把药品成本穿透计入，披露毛利率会进一步被压低，但这取决于 eMed 的 PMPM 是净收入还是总收入口径。

              若采用按人头包干模式，成本结构风险会实质转移：一旦依从性下滑或不良事件率上升，eMed
              将承担全部临床成本，背上纯软件毛利不承担的精算风险。公司未公开披露任何资本开支密集型资产（制造、临床设施）。由于存在实物套件环节，营运资本需求仍不确定。
