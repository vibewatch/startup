      - number: '8.3'
        title: 情景分析：牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >-
              三个情景都假设 eMed 的收入模型是面向雇主计划发起人的按员工每月（PEPM）包干费，并可能叠加临床结果激励层。由于 eMed 没有披露 ARR
              或会员注册量，下列所有收入假设都来自雇主渠道数字健康基准（Omada、Hinge Health）和 eMed 的市场定位。这些情景均明确标为估算且受证据约束；它们不是预测，也不是背书。

              牛市情景（25% 概率信号）假设雇主渠道快速渗透：eMed 签下 50+ 家雇主客户，每家覆盖 100,000+ 人，到 2027-2028 年实现 $150-200M ARR，证明强劲临床结果，并由 Aon
              贡献额外分销。按乐观的 14x forward revenue multiple（与高增长雇主健康同业一致），eMed 估值可达 $2.1-2.8B，支撑或略高于当前 $2B+ 标记。该情景要求 eMed
              拿出临床结果数据，化解 Aon 集中风险，并把留存率维持在高于雇主 GLP-1 项目约 60% 年留存率的水平。

              基准情景（50% 概率信号）假设雇主采用速度适中：随着雇主成本敏感度压制采用，Aon 提供可预测但有边界的商业底座，eMed 到 2027 年搭出 $60-80M ARR 基础。按 10x forward
              revenue multiple——当前雇主数字健康可比公司的中点——基准情景估值为 $600-800M，较 $2B+ Series A 入场价有明显下行。投资人若以 $2B+ 入场，要在该情景下实现 3x
              回报，还需要额外 4-5 年增长和一次估值重评事件（战略退出或 IPO）。

              熊市情景（25% 概率信号）假设雇主对 GLP-1 成本敏感，推动福利削减或重组；会员高流失（停用 GLP-1 治疗后 12 个月内，人群中位数为 50%+）；Aon 也可能重新评估其投资逻辑。在该情景下，ARR
              停在 $30-40M，有效收入倍数压缩至 5-6x，隐含估值为 $150-240M——较 Series A 入场价下调 90%+。Morgan Stanley 的 GLP-1 市场分析预计市场到 2035 年达到
              $190B，但 Goldman Sachs 警告抗肥胖药物市场可能小于预期，付款方覆盖阻力和停药率是主要下行风险。
