      - number: '2.5'
        title: 规模测算缺口、矛盾估计与尽调要求
        blocks:
          - type: paragraph
            body: >-
              三个结构性缺口限制了对 eMed 专属市场规模的信心。第一，Goldman Sachs 对 2035 年全球抗肥胖药物 $120 billion 的谨慎预测，与 Morgan Stanley $190
              billion 基准情景（$240B 牛市）之间的差距，主要不是数据质量问题，而是对药价轨迹、依从性可持续性和国际处方集采用的真实分歧。Goldman
              对价格侵蚀和支付方阻力的怀疑，比假设以接近标价持续渗透的牛市预测，更受当前雇主行为支持：Brown & Brown 2025 年中调查发现，31% 已覆盖雇主正在考虑取消 GLP-1 覆盖。

              第二，$2.2 billion（2026）的雇主平台市场估计，来自单一市场研究出版物，而不是聚合的雇主支出数据；本章研究审阅范围内没有找到能佐证这一具体数字的独立来源。鉴于它直接锚定 eMed 估值论点中的
              SAM-to-SOM 数学，这是一个有意义的缺口。

              第三，eMed 自身的结果宣称——90%+ 依从性、平均减重 21–22.4 lb——来自公司控制或合作伙伴报告来源，尚未在同行评审研究中独立复现，也未由中立第三方审计验证。PMC 研究发现 GLP-1
              启动者真实世界流失率为 65%，与 eMed 的依从性宣称直接冲突；任何已审阅公开来源都没有解决这个差异。弥合这一缺口——无论是独立审计 eMed 的队列选择方法，还是第三方验证其结果——是评估 eMed
              商业模式到底结构性差异化，还是叙事被放大时最重要的尽调步骤。
            claimRefs:
              - CM006
              - CM009
              - CM013
              - CM018
              - CM019
              - CM021
              - CM026
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: FDA 执法悖论为临床监督平台创造竞争护城河
            body: >-
              FDA 2026 年向复方 GLP-1 远程医疗提供方发出的 30 封警告信，对 eMed 是结构性顺风。通过清理那些在没有临床监督下营销复方 GLP-1 的 DTC 竞争者，FDA
              执法验证了雇主监督模型，也抬高了 eMed 最直接竞争对象——新低成本进入者——的门槛。
            calloutType: strength
            claimRefs:
              - CM025
              - CM026
              - CM027
          - type: callout
            title: 依从性宣称与已发表真实世界流失数据直接冲突
            body: >-
              eMed 声称其管理型 GLP-1 项目会员依从性为 90%+，但一项已发表 PMC cohort 研究发现，在真实世界条件下，约 65% 非糖尿病 GLP-1 使用者会在一年内退出。除非独立审计解释 eMed
              的 cohort 选择、项目设计或结果测量方法，如何产生与人群平均水平差异如此大的结果，否则依从性宣称就是一个重大未解问题。
            calloutType: risk
            claimRefs:
              - CM013
              - CM018
              - CM019
          - type: callout
            title: 雇主 GLP-1 成本压力带来覆盖退出风险，压缩 SAM
            body: >-
              相当一部分雇主正在积极重新评估 GLP-1 覆盖。Brown & Brown 发现，31% 的已覆盖雇主可能在 12-24 个月内取消覆盖。如果大型雇主缩减覆盖，即便药物有效，eMed
              的可触达雇主池也会收缩。SAM 取决于雇主继续同时覆盖 GLP-1 并为结构化管理项目付费，这种双重依赖是 eMed 增长论点的关键风险。
            calloutType: risk
            claimRefs:
              - CM013
              - CM017
              - CM036
              - CM037
          - type: callout
            title: Aon 同时是投资人和渠道，压缩雇主销售周期
            body: 标准雇主福利供应商销售需要 12-24 个月；Aon 既是领投方，又是全球最大 HR 咨询公司，为 eMed 提供了结构性捷径。验证分销论点的同一个动态，也带来客户集中风险，尽调应量化这一点。
            calloutType: insight
