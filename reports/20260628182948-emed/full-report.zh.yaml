  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群与买方画像
        blocks:
          - type: paragraph
            body: >-
              eMed 的主要客户群是自保险雇主，通常为拥有 1,000 名或更多美国员工的大型企业。采购决策落在 HR 负责人、福利总监以及财务或 CFO 相关决策者手中，这些人共同管理人群健康支出。员工及其受保家属是
              GLP-1 项目的终端用户。eMed 不是面向消费者的直销药房；其面向雇主的价值主张，集中在带有结果责任的临床管理减重项目，而不是个人处方便利性。eMed 公司材料提到「自 2020 年秋季推出以来，全球客户超过
              600 万」，但该数字包含早期 COVID-19 检测用户，并且可能把个人检测客户与规模更小的雇主签约 GLP-1 项目参与者混在一起。eMed for-businesses 平台明确瞄准自保险细分市场，强调没有
              PBM 加价的透明药价、居家诊断入组套件、24/7 临床支持和结果保证（若未达到减重目标，雇主少付费）。采购中心还延伸到 PBM 伙伴，尤其是 CVS Caremark；它们承担分销和处方集管理层。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs: []
      - number: '6.2'
        title: 具名客户证据与验证点
        blocks:
          - type: paragraph
            body: >-
              全球专业服务和福利咨询公司 Aon，是 eMed 公开记录最充分的雇主客户。Aon 也是战略投资人，曾在 2025 年 8 月宣布投资，并随后为其美国员工在 2026 计划年度部署 eMed GLP-1
              Weight Management Program。Aon 2026 新员工福利指南明确点名该项目，并表示加入 Aon 医疗计划的员工通过 eMed 平台获得 GLP-1 药物时，处方药共付额更低。Aon
              Chief People and Administrative Officer Lisa Stevens 公开称，「与项目前相比，同事们用药时间更长，体重和 BMI 也出现有意义改善。」Axios 报道，约 9%
              符合条件的 Aon 员工加入了试点项目。另据 eMed 面向雇主的平台页面，引用 2026 年 1 月 Aon Workforce-Focused Phase Two Analysis 发现，以及 2025 年
              12 月内部匹配实验室数据，宣称项目依从率 +90%、单会员平均减重 25 lbs、平均项目时长 14.2 个月。eMed 的 Aon 合作新闻稿还引用 Aon 分析作为背景：GLP-1
              治疗第二年医疗支出增速下降 7 个百分点，依从 GLP-1 用户发生重大不良心血管事件的住院风险下降 44%。CVS Caremark 是第二个具名伙伴；根据 2026 年初宣布的安排，使用 CVS 作为 PBM
              的雇主可以提供 eMed 减重管理服务，并自行选择补贴水平。CVS Caremark 管理最多 3,000 万美国人的处方福利，使 eMed 可通过该渠道获得显著潜在触达。Thrive Global
              则为已加入员工提供整合进 eMed app 的生活方式教练配套项目。
