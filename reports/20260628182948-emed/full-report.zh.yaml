      - number: '6.4'
        title: 留存、依从性与持久性
        blocks:
          - type: paragraph
            body: >-
              eMed 的核心商业宣称是，其临床管理、依从性优先模式在留存上优于同类平台和未管理的 GLP-1 获取。平台面向雇主的页面披露 +90% 依从性、平均项目时长 14.2 个月，以及 Aon 试点 95%
              留存率，均归因于 2025 年 12 月内部匹配实验室数据。这些数字由公司披露，未独立审计。真实世界 GLP-1 依从性格局提供了相关基准。Prime Therapeutics 对商业保险非糖尿病 GLP-1
              用户的 2026 年分析（62,650 名会员）发现，1 年持续使用率从 2021 年的 33.2% 升至 2024 年上半年的 60.9%；这说明大盘在改善，但相较 eMed 所称 90%+
              仍有显著差距。Tirzepatide 用户 1 年持续使用率为 64%，意味着除非 eMed 的生活方式干预和 24/7 支持显著改写基线，否则其宣称在依从性天花板上是增量差异，而不是颠覆性差异。2026 年一篇
              GLP-1 停药叙事综述发现，停药往往并非永久（患者常会重新开始），但患者、行为和医疗系统等多维因素共同驱动流失；现有项目很少覆盖已建立用药依从性概念框架的全部五个维度。eMed Labs 在
              Trustpilot 上评分 4.2/5，多数评论称赞项目临床支持和效果，但至少一名评论者对平台未在诊断发现之外提供治疗表示不满。这些信号显示满意度中等，但并非普遍满意。
