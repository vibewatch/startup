      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 监管执法集群是首要生存风险
            body: >-
              FDA 对复方药的活跃执法（2025–2026 年行业内 30+ 封警告信）叠加 FTC 对 GLP-1 远程医疗平台的执法（NextMed 2025、Cerebral 2024、2026
              年仍在推进），形成了一个监管环境：平台任何运营失误都可能演变为公开执法行动。eMed 目前不在公开执法名单中，这是当前事实，不是保证。历史上的复方 semaglutide
              暴露、未披露的健康数据像素追踪，或缺乏依据的结果主张，都可能吸引监管注意。该风险需要持续法律监控和主动合规投入，不能等事后被动应对。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Aon 集中度是单一事件就能击穿投资逻辑的风险
            body: >-
              Aon 同时是领投方、锚定雇主客户和主要分销渠道，形成高度集中的依赖，而且没有公开合同底线。Aon 福利管理层一次决定——分散 GLP-1 供应商、削减项目资金，或退出投资——就会同时拿走 eMed
              最大收入来源、主要分销管线，以及最可信的企业市场背书。eMed 公开可比公司中没有同等集中结构。监控该风险，需要直接看见 Aon 的 GLP-1 福利项目表现，以及其投资委员会的持续态度。
            calloutType: risk
            claimRefs:
              - CR025
              - CR026
              - CR031
              - CR033
          - type: callout
            title: Series B 前必须要求独立临床结果披露
            body: >-
              横跨监管、报销和竞争三条风险线，最有效的缓释手段是独立验证的临床结果数据。eMed 的依从率改善主张支撑雇主价值主张，也是抵御 FTC
              缺乏依据主张执法的主要防线。投资人应把同行评议的依从率基准，或独立审计的雇主结果数据，作为 Series B 尽调条件。没有这些证据，$2B+
              估值就建立在品牌叙事和渠道位置上；监管或竞争压力一来，这些因素会很快松动。
            calloutType: recommendation
            claimRefs:
