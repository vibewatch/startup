  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入与排除支出以及现状替代方案
        blocks:
          - type: paragraph
            body: >-
              eMed 的可服务市场，是叠加在 GLP-1 处方之上的雇主付费服务层，而不是 Novo Nordisk 和 Eli Lilly 获得的品牌药收入。这个区分对测算规模极其重要：全球 GLP-1 药物市场——由
              semaglutide 与 tirzepatide 药品收入主导——常被引用为到 2035 年 $157–$190 billion 的市场，但那是药房支出，不是供应商平台费。eMed
              变现的是远程医疗临床就诊、居家诊断、AI 驱动依从性辅导、护理协调和人群健康报告，并以雇主福利形式销售；这些收入都不会流向药企。真正直接可触达的市场，是美国数字肥胖护理和 GLP-1 支持细分，预计 2026
              年约 $2.2 billion，并以 22%+ CAGR 增长至 2030 年约 $6 billion。

              eMed 替代的主要现状方案，是没有结构化监督的网络内初级保健医生开具 GLP-1 处方（今天的主导路径）、标准 PBM 覆盖，以及 WW（Weight Watchers）、Noom、Virta Health
              等传统健康管理项目；后者提供生活方式支持，但不提供处方入口。对于重度肥胖，减重手术仍是更侵入、成本更高的替代方案；Ro、Hims & Hers、Calibrate 等 DTC
              远程医疗平台服务个人消费者，而不是雇主福利预算。可扩大 eMed 可触达面的相邻领域包括更广泛的代谢健康管理、行为健康项目，以及面向自保雇主的慢病人群健康服务，用来管理与肥胖相关的共病，如 2
              型糖尿病、睡眠呼吸暂停和心血管风险。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
