  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              理解 eMed 的竞争宇宙，最好从雇主福利买家可以选择、用来替代 eMed 管理型 GLP-1 项目的五类方案切入。

              第一类也是最相关的一类，是直接面向雇主的 GLP-1 管理平台——像 eMed 一样，把对结果负责、临床监督的 GLP-1 项目作为福利条目卖给自保雇主。包括 Calibrate（报告三年平均体重下降
              19%，并在早期 DTC 受挫后明确转向雇主 B2B）、Found Health（运营「Found for Business」，声称雇主 ROI 为 5.1x，自 2019
              年以来完成超过一百万次临床咨询）、Noom Med（15 年历史行为科学平台的 GLP-1 处方部门，专门为已用药雇主人群运营 GLP-1 Companion）、Omada
              Health（即将上市的心代谢平台，累计会员 1M+，并有新的 Lilly Employer Connect 合作以改善品牌药入口）以及 Vida Health（12 年历史心代谢护理专家，获得 2026
              MedTech Breakthrough Award Best Virtual Care Platform）。

              第二类是以 DTC 为核心的远程医疗平台，主要服务个人消费者，但有一定雇主相邻触达。Hims & Hers 销售起价 $149 每月的 GLP-1 药物，在 FDA 针对复方 semaglutide
              执法后聚焦品牌药入口。Ro Body 通过 Ro Body membership 为个人提供 GLP-1 入口。二者都缺少 eMed 强调的雇主渠道深度、结果问责基础设施和风险转移模型。

              第三类是现有大规模远程医疗平台。Teladoc Health 提供雇主体重管理项目，包含联网智能秤硬件、个性化辅导和其 legacy Livongo 糖尿病管理基础设施，但财务表现承压，也没有把产品定位成专门的
              GLP-1 管理方案。Included Health 把护理导航和 GLP-1 支持作为更广泛的一站式员工健康福利的一部分，客户验证点包括 Salesforce、AT&T 和 lululemon。

              第四类也是最重要的现状替代，是通过初级保健医生开具非管理型 GLP-1 处方，再叠加 PBM 处方集覆盖。OptumRx、CVS Caremark 和 Express Scripts 控制着多数自保雇主的
              GLP-1 处方集，并可能直接增加临床管理覆盖层。这种「内部搭建」选项（雇主把 GLP-1 管理加到现有供应商合同中）以及 PBM 管理型替代，是 eMed 最大的非供应商竞争威胁。

              第五类是药企直连项目。LillyDirect 通过独立远程医疗提供方，为 Zepbound 和其他 Eli Lilly 药品提供入口，配套免费配送和透明定价。NovoCare 的患者支持项目则直接通过 Novo
              Nordisk 网络提供 Wegovy 入口、费用支持工具和处方协调。如果药企成功去中介化平台层，所有管理平台的可触达服务费池都会显著收缩。
