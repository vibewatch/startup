    type: cohort
    layout: standard
    summary: 来自同行评议市场数据的 GLP-1 减重药物按启动队列年份和产品划分的 1 年持续率，并与 eMed 自报依从性主张对照。
    data:
      columns:
        - 1 年持续率（%）
      rows:
        - label: Semaglutide（Wegovy）– 2021 启动者（Prime Therapeutics，n=33,607）
          values:
            - 33
        - label: Semaglutide（Wegovy）– 2022 启动者（Prime Therapeutics）
          values:
            - 34
        - label: Semaglutide（Wegovy）– 2023 启动者（Prime Therapeutics）
          values:
            - 40
        - label: Semaglutide（Wegovy）– 1H 2024 启动者（Prime Therapeutics，最近）
          values:
            - 59
        - label: Tirzepatide（Zepbound）– 1H 2024 启动者（Prime Therapeutics，最高品牌）
          values:
            - 65
        - label: eMed 雇主项目依从性 – 2025（公司披露，未经审计）
          values:
            - 90
    claimRefs:
      - CU026
      - CU027
      - CU016
      - CU028
    approximationNotes: >-
      市场基线数字由 Prime Therapeutics 研究（PMID 41760566）四舍五入而来：semaglutide 按队列年份分别为 33.2%、34.1%、39.8%、58.6%；tirzepatide 1H
      2024 为 64.8%。eMed 数字来自 2025 年 12 月公司披露的内部数据；依从性定义可能不同于 Prime Therapeutics 研究定义（365 天内无 60 天供药缺口）。
  - id: FR001
    title: 风险热力图——影响 vs. 可能性
    type: matrix
    layout: wide
    summary: 按可能性（列）和影响（行）映射 eMed 主要风险。FDA/FTC 执法和 Aon 集中度聚集在中高可能性 / 高影响区；生物类似药去中介化可能性低，但影响中高。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 高影响
          values:
            - Brady/Guerrero FTC 品牌关联
            - FDA 复方制剂警告信（点名 eMed）
            - 雇主 GLP-1 福利设计收紧
        - label: 中高影响
          values:
            - DEA 共处方开具缺口
            - FTC 欺骗性计费调查
            - GLP-1 依从率低于临床主张基线
        - label: 中影响
          values:
            - Babylon AI 集成失败
            - PHI / 网络安全泄露
            - Aon 三重角色集中退出
        - label: 中低影响
          values:
            - Semaglutide 生物类似药去中介化
            - CVS Caremark 使用管理收紧
            - 估值压缩 / down-round
        - label: 低影响
          values:
            - 临床 AI SaMD FDA 分类
            - 州 CPOM 执照缺口执法
            - 雇主 GLP-1 覆盖撤退 > 20%
    approximationNotes: 行按影响从高到低排列。位置是定性判断，来自执法模式分析和 eMed 公开披露；可能性反映行业层面基准率。
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR013
      - CR025
      - CR033
  - id: FR002
    title: 风险传导图——风险如何流向收入和估值
    type: dag
    layout: standard
    summary: 从根因触发到收入下滑再到估值压缩的主要风险传导路径，展示 eMed 下行风险的聚集和相互强化。
    data:
      nodes:
        - id: fda_enforcement
          label: FDA 执法（点名 eMed）
        - id: ftc_action
          label: FTC 行动（计费 / 数据）
        - id: adherence_failure
          label: 依从性结果失败
        - id: aon_exit
          label: Aon 集中退出
        - id: employer_retreat
          label: 雇主福利撤退
        - id: revenue_decline
          label: 收入下滑
        - id: valuation_compression
          label: 估值压缩 / Down-Round
      edges:
        - from: fda_enforcement
          to: revenue_decline
        - from: ftc_action
          to: revenue_decline
        - from: adherence_failure
          to: employer_retreat
        - from: employer_retreat
          to: revenue_decline
        - from: aon_exit
          to: revenue_decline
        - from: revenue_decline
          to: valuation_compression
        - from: fda_enforcement
          to: valuation_compression
        - from: ftc_action
          to: valuation_compression
        - from: aon_exit
          to: valuation_compression
    approximationNotes: 边代表基于行业执法先例的合理因果路径；并非所有路径都会同时启动。
    claimRefs:
      - CR002
      - CR006
      - CR008
      - CR015
      - CR025
      - CR033
  - id: FR003
    title: 依赖图——关键外部依赖
    type: dag
    layout: standard
    summary: eMed 的关键外部依赖，以及它们对公司向自保雇主客户交付 GLP-1 福利项目能力的方向性影响。
    data:
      nodes:
        - id: emed
          label: eMed（平台）
        - id: aon
          label: Aon（投资方 + 客户 + 渠道）
        - id: cvs_caremark
          label: CVS Caremark（PBM）
        - id: novo_lilly
          label: Novo Nordisk / Eli Lilly（药品供应）
        - id: fda_framework
          label: FDA 监管框架
        - id: employer_clients
          label: 自保雇主市场
        - id: thrive_global
          label: Thrive Global（行为支持）
      edges:
        - from: aon
          to: emed
        - from: cvs_caremark
          to: emed
        - from: novo_lilly
          to: emed
        - from: fda_framework
          to: emed
        - from: thrive_global
          to: emed
        - from: emed
          to: employer_clients
        - from: aon
          to: employer_clients
    approximationNotes: 箭头方向表示供给或影响流。Aon 具有双向箭头，反映其作为 eMed 雇主市场投资方、客户和分发渠道的三重角色。
    claimRefs:
      - CR025
      - CR026
      - CR037
  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从 eMed 关键证据支柱和缺口，到继续研究建议和偏高估值立场的逻辑链。
    data:
      nodes:
        - id: mkt
          label: 大市场机会：2035 年 GLP-1 达 $157B（ResearchAndMarkets）
        - id: anchor
          label: Aon 锚点：投资方 + 分发 + 客户（循环、集中）
        - id: comp
          label: 可比组：Hims 4.3x、Omada 7-10x、Hinge 7-8x、Teladoc <1x
        - id: gap
          label: 关键缺口：未披露 ARR、客户数量、临床结果
        - id: risk
          label: 结构性风险：Aon 集中、FDA 执法、雇主成本敏感
        - id: rec
          label: 建议：继续研究 | 估值立场：偏高 | 信心：低
      edges:
        - from: mkt
          to: rec
          label: 支撑上行
        - from: anchor
          to: risk
          label: 推高集中度
        - from: comp
          to: rec
          label: 基准不足
        - from: gap
          to: rec
          label: 阻止确认
        - from: risk
          to: rec
          label: 抬高风险评级
    approximationNotes: 流程节点代表分析输入和输出；边代表逻辑影响，而非财务因果。市场数字来自第三方分析师预测。
    claimRefs:
      - CV001
      - CV024
      - CV037
      - CV038
  - id: FV002
    title: 估值敏感性——按情景和收入假设推导的隐含价值
    type: bar
    layout: wide
    summary: 将 eMed $2B+ Series A 标记与情景推导的隐含估值、关键上市可比公司隐含估值对比，以展示倍数敏感性。
    data:
      items:
        - label: eMed Series A 标记（2026 年 3 月）
          value: 2000
        - label: 牛市情景（$175M ARR × 14x）
          value: 2450
        - label: 基准情景（$70M ARR × 10x）
          value: 700
        - label: 熊市情景（$35M ARR × 5x）
          value: 175
        - label: Omada IPO 隐含（中点估计约 $1.7B）
          value: 1700
        - label: Hims & Hers 非关联市值（2025 年 6 月）
          value: 10100
    approximationNotes: >-
      所有数字单位为 USD millions。eMed 情景基于雇主渠道数字健康基准估计；eMed 未披露 ARR。Hims 市值来自 FY2025 10-K 封面页截至 2025 年 6 月 30 日的数据。Omada IPO
      隐含市值根据 S-1 发行价格和大致总流通股数估算。
    claimRefs:
      - CV009
      - CV029
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: 按情景划分的估值与回报区间
    type: range
    layout: standard
    summary: 按情景展示从低到高的估值区间，显示 eMed 以 $2B+ Series A 进入时，熊市与牛市结果之间的巨大分化。
    data:
      items:
        - label: 熊市情景（ARR 停滞，倍数压缩）
          low: 150
          high: 250
        - label: 基准情景（ARR 适度建立，10x）
          low: 600
          high: 900
        - label: 牛市情景（ARR 强劲，雇主飞轮）
          low: 2100
          high: 3000
        - label: Series A 进入标记（参考）
          low: 2000
          high: 2000
    approximationNotes: 所有数字单位为 USD millions；区间由情景假设和可比倍数估算。熊市区间假设 5-6x 倍数；基准假设 10x；牛市假设 12-15x。$2B+ 进入标记反映 2026 年 3 月 Series A 新闻稿。
    claimRefs:
      - CV031
      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的关键尽调维度评分，体现强劲市场顺风与 eMed 重大财务不透明、结构性集中风险之间的平衡。
    data:
      items:
        - label: 市场机会（规模和增长）
          value: 8
        - label: 商业牵引证明（ARR、客户）
          value: 2
        - label: 护城河 / 可防御性（Aon 渠道、品牌）
          value: 5
        - label: 财务透明度 / 治理
          value: 2
        - label: 监管合规姿态
          value: 5
        - label: 相比可比公司的估值吸引力
          value: 3
    approximationNotes: 分数按 0-10 标尺，基于证据加权的分析判断。因缺少披露运营指标，商业牵引和财务透明度得分较低。市场机会得分反映 GLP-1 雇主 TAM 规模和增长轨迹。
    claimRefs:
      - CV006
      - CV024
      - CV035
      - CV037
