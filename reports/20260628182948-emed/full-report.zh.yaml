      - number: '6.5'
        title: 集中风险、异议与反向证据
        blocks:
          - type: paragraph
            body: >-
              集中风险尖锐。Aon 同时是 eMed 最突出的具名雇主客户和战略投资人，意味着任何对 Aon 披露结果的独立评估，都面对直接利益冲突。截至 2026 年 6 月，除较早于当前 GLP-1 平台的 600
              万客户总体表述外，eMed 未公开披露第二个具名雇主客户。雇主市场逆风构成最实质的反向背景。Business Group on Health 一项调查（105 家雇主，2026 年 2–3 月）发现，67% 覆盖
              GLP-1 减重药物，但其中只有 72% 打算在 2027 年继续覆盖；当前未覆盖的公司不太可能新增覆盖。Pharmaceutical Strategies Group 2026 Trends in Drug
              Benefits 报告发现，当前未覆盖 GLP-1 肥胖治疗的雇主中，49%「无论价格如何都不会覆盖」，已有覆盖的受访者中 9/10 对可负担性中度或高度担忧。Cigna 自 2026 年 7 月起取消自家员工的
              GLP-1 覆盖。Mercer 调查发现，拥有 500+ 员工的雇主中，51% 计划在 2026 年提高费用分摊，77% 将 GLP-1 列为首要成本担忧。停药是雇主 ROI 怀疑的主要因素：PSG
              报告指出，近三分之二非糖尿病用户在一年内停药，72% 受访福利高管称，停药和体重反弹至少会中度影响覆盖决策。GoodRx 估计，2026 年有 1,600 万商业保险人群缺少 GLP-1
              减重覆盖。法律顾问指出，雇主缩窄或取消 GLP-1 福利时，如果资格标准执行不一致，可能面临责任风险。这些动态压缩了 eMed 的可服务市场，也提高了证明持续 ROI 的销售负担。
