      - number: '3.2'
        title: 直接与相邻竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Calibrate 是 eMed 在雇主市场最接近的直接类比。公司把医生处方 GLP-1 用药、一对一视频辅导和有科学背书的阅读课程组合起来。其陈述结果是三年实现平均体重下降 19%。Calibrate
              明确把雇主覆盖作为患者获取模型的一部分，列出参与雇主，并引导潜在会员检查自己的公司是否覆盖该项目。Calibrate
              强调药物之外的生活方式改变，并拉长到多年时间维度，这让它区别于参与周期更短的竞争者；不过，公司在转向雇主合作前，曾经历早期 DTC 市场挑战。

              Found Health（面向雇主客户运营「Found for Business」）按临床规模看，可能是资质最强的同业。公司自 2019 年创立以来完成超过一百万次临床咨询，在雇主 GLP-1
              管理平台中拥有最大的真实世界数据集。Found 的 MetabolicPrint 个性化引擎把每位会员分配到四种代谢画像之一，以定制治疗。其用药工具箱扩展到十种或更多选择，包括非 GLP-1 替代方案，使
              Found 能够管理限制部分员工药物入口的处方集约束。Found 与主要保险公司的网络内状态，让雇主可把临床咨询作为理赔运行，降低项目成本。

              Noom 有两个相关雇主产品。Noom Health 雇主平台提供公司成熟的心理学行为项目（CDC 认可的 Diabetes Prevention Program）以及糖尿病管理。Noom Med 增加
              GLP-1 处方能力，GLP-1 Companion 项目则为已经使用 GLP-1 药物的员工提供定制生活方式支持。Noom 15 年以上的行为科学积累和规模（项目覆盖全球许多组织）让它区别于更新的纯 GLP-1
              进入者；不过，Noom 的 GLP-1 处方部门更新，实战检验不如其行为改变核心。

              Omada Health 是机构化程度最高的直接同业。Omada 创立时聚焦数字糖尿病预防，之后扩展到面向雇主的完整心代谢和肌肉骨骼护理。其 GLP-1 Care Track 提供饮食与活动辅导、GLP-1
              副作用用药协助、专属健康教练和行为健康支持。Omada 2026 年与 Lilly Employer Connect 的合作，扩大了雇主客户的品牌药入口。最重要的是，Omada 于 2025 年 5 月向 SEC
              提交 S-1 注册声明，释放公开市场雄心；若成功，将让 Omada 在资产负债表和招聘上相对 eMed 等私营同业获得优势。Omada 资源中心展示了 2026 年 Q1 结果、Goldman Sachs
              会议参与和同行评审研究，作为机构可信度证据。

              Vida Health 是一家 12 年历史的心代谢专科公司，聚焦肥胖及相关共病等代谢疾病。它获得了 2026 MedTech Breakthrough Award Best Virtual Care
              Platform，并明确与现有健康计划和 PBM 集成，把自己定位为现有福利的增强，而不是替代。Vida 十年以上记录和多病种深度，给了它单病种 GLP-1 平台缺少的交叉销售可选性。

              Teladoc Health 是最大的既有巨头。其 Weight Management 项目属于更广泛的虚拟护理平台，平台还覆盖心理健康、糖尿病预防、高血压和皮肤科。Teladoc 的 Livongo
              慢病护理品牌如今已整合进平台，在糖尿病管理上拥有深厚雇主关系，可自然延伸到肥胖管理。不过，Teladoc 的体重管理项目强调联网体重秤硬件和行为辅导，而非专门 GLP-1
              处方管理；公司还面临财务和运营挑战，削弱了增长画像。

              Hims & Hers 聚焦个人 DTC GLP-1 入口，尚未建立实质性雇主福利销售动作。其减重产品包括起价 $149 每月的品牌 Wegovy 和新 Wegovy pill。Hims 于 2026 年 6
              月任命 Dr. Anant Vinjamoori 为 Chief Medical Officer。Ro Body 提供类似 DTC 入口，Serena Williams 与 Charles Barkley
              担任品牌大使，并覆盖一系列具名 GLP-1 选项。FDA 针对复方 semaglutide 的执法，推动 Hims 和 Ro 转向品牌药，削弱了它们的低成本 DTC 竞争优势，但也验证了 eMed
              所定位的受监督临床模型。

              Included Health 把护理导航和 GLP-1 支持纳入其整合雇主健康福利平台。它通过全人护理协调形成差异化，并有 Salesforce、lululemon 和 AT&T
              的已验证雇主案例研究；公司报告客户第一年医疗成本趋势下降超过 4%。
