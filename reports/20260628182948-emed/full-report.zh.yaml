      - number: '7.3'
        title: 运营、供应链与竞争风险
        blocks:
          - type: paragraph
            body: >-
              2024 年以来，供应链风险的性质已经改变。品牌 semaglutide（Wegovy）不再列入 FDA 短缺名单，患者准入由此正常化，也消除了早期 GLP-1
              远程医疗量级赖以增长的复方药豁免。但供应正常化也拿掉了保护 eMed 免受药企直接竞争的结构性护城河。Novo Nordisk 和 Eli Lilly
              的直达护理分销渠道（LillyDirect、NovoNordisk direct care）仍处早期，但已是可信路径，药企可借此在雇主市场绕开远程医疗平台。eMed
              的处方路由角色并没有合同保护，可抵御药企去中介化。

              来自资本充足玩家的竞争压力已经加剧。FDA 打击后，Hims & Hers 转向品牌 GLP-1，并在 2026 年 Q1 报告 $79M GLP-1 相关收入——这证明品牌药转型可在规模上跑通，也说明 eMed
              并不拥有独特渠道位置。Ro 于 2025 年 Q2 推出面向自保险雇主的 Ro Business。Optum Rx（UnitedHealth）、CVS Caremark 和 Omada Health（2025 年
              IPO 后已上市）都在雇主 GLP-1 福利市场竞争，并拥有分销规模优势。eMed 的竞争护城河建立在品牌（Brady/Yaccarino 关联）、Aon 渠道和临床 AI
              工作流宣称之上——这些都可被有资本和分销规模的 incumbents 复制。WTW、Mercer 和 Alight 也为竞争供应商提供渠道，削弱渠道排他性。

              以 eMed 的增长速度看，运营扩张风险实质存在。维持医生和 NP 在 50 个州的执照，是经常性合规负担。收购 Babylon Health UK 临床资产带来集成技术债和未经验证的 AI
              临床工作流。数百万患者规模的数据基础设施会产生网络安全暴露，任何 PHI 泄露都会触发 HIPAA 通知、FTC 健康泄露执法和声誉损害。FDA 已表示会审查 AI
              驱动的临床决策支持工具，将其作为潜在软件即医疗器械；这给 eMed 的 empathetic-AI 工作流留下未解决的监管分类风险。
