      - - Hinge Health (IPO 2025)
        - 估计 FY2025 约 $390M
        - IPO 首秀 $3B
        - 约 7-8x 历史倍数
        - 雇主数字健康；近期 IPO 可比公司
        - 聚焦 MSK，而非 GLP-1；IPO 估值较 2021 年私募标记折价 52%
      - - Thirty Madison（私有 → M&A）
        - 未披露
        - 2025 年收购价 $500M
        - N/A
        - GLP-1 远程医疗私有可比公司；降估值并购退出
        - 较 $1B 独角兽估值减记 50%；GLP-1 前模型；困境出售
    enumerationScope:
      coverage: partial
      basis: >-
        Includes publicly traded companies (Hims, Omada, Teladoc) and select private-to-M&A transactions with disclosed
