      - number: '5.4'
        title: 合规、信任与监管依赖
        blocks:
          - type: paragraph
            body: >-
              eMed 所处环境中，监管对远程医疗 GLP-1 公司的审查正在加剧。FDA 在 2025 年底向 30 家远程医疗公司和外包设施发出警告信，原因是其非法营销复方 GLP-1 药物。eMed
              不在执法对象名单中，其 CVS Caremark 合作通过 PBM 渠道把患者导向品牌（非复方）semaglutide 和 tirzepatide，使公司站在复方药红线的合规一侧。该监管差异并非偶然，而是
              eMed 面向风险敏感自保险雇主的核心价值主张；这些雇主承受不起覆盖 FDA 质疑安全性的复方药所带来的责任。

              任何在远程医疗中处理受保护健康信息的实体，都必须符合 HIPAA。eMed 未在任何已审阅公开来源中发布 HIPAA 合规证明、SOC 2 Type II 审计报告，也未任命具名 HIPAA 隐私官。NPI
              注册确认 eMed Population Health, Inc.（NPI 1639018609）在 Miami, FL 作为初级护理 / 豁免检测提供方实体运营，建立了医疗实体可信度，但 NPI
              记录不能说明数据安全认证。居家血液检测若要符合 CLIA 豁免，要么采集设备必须获得 FDA 对采集点豁免检测的许可，要么 eMed 必须使用接收邮寄样本的 CLIA
              认证实验室。具体路径未披露，诊断模块的监管依据仍有歧义。

              2023–2026 年，DEA 远程医疗开方规则发生较大变化，COVID 时期临时灵活性到期，新远程医疗框架仍在提出。GLP-1 药物（semaglutide、tirzepatide）不是 Schedule I
              或 II 管制物质，因此最严格的 DEA 开方规则不直接适用于 eMed 的 GLP-1 工作流。但多州开方医生执照仍是约束：eMed
              网络中的每名远程医疗提供者，都必须在会员居住州持有执照，而该开方医生网络的构成和地理覆盖未披露。对员工遍布全国的雇主而言，任何覆盖缺口都会削弱该福利的触达。

              在消费者信任维度，eMed 的 BBB 页面可访问，未显示未解决政府行动或重大消费者投诉模式；已审阅公开材料中也未发现 FTC 对 eMed 的行动。Axios 提到 Tom Brady 与 Alex
              Guerrero 的关系构成 eMed 领导团队声誉顾虑，Guerrero 曾两次就健康产品宣称与 FTC 达成和解，但 FTC 行动并未延伸到 eMed 本身。
