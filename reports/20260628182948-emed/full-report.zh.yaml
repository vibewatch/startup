      - number: '8.4'
        title: 投资逻辑与反逻辑
        blocks:
          - type: paragraph
            body: >-
              eMed 的投资逻辑押注三条长期趋势汇合：雇主赞助健康计划中 GLP-1 处方爆发增长；雇主渠道数字健康模式已被验证（Omada 128% NRR 证明该渠道留存能力）；eMed 在 AI
              驱动依从性管理上有先发优势。Aon 这个锚点既提供近期商业验证，也能通过 Aon 50,000 客户雇主网络形成分销飞轮。Linda Yaccarino 的品牌合作（CVS、Thrive Global、Tom
              Brady）和媒体信誉强化了企业销售叙事。如果 eMed 能证明临床结果优于人群平均水平，并搭建不依赖 Aon 的多雇主客户基础，$2B+ 标记可以被视为对 $100B+ 市场早期期权的定价。

              反逻辑来自三项结构性担忧。第一，Aon 同时是投资人、主要分销伙伴和旗舰商业客户，造成利益冲突，也让 $2B+
              估值部分自我指涉：验证估值的实体同时是主要收入来源和主要投资人。商业和财务利益集中在单一交易对手上，是一个重大结构风险，标题估值并未充分计入。第二，eMed 没有披露任何财务指标，外部无法独立验证 $2B+
              是基于实际收入的合理倍数，还是市场定位上的投机溢价。第三，更广泛的数字健康板块已经证明，B2B2C 雇主健康模型执行风险很高：WeightWatchers 重组，Calibrate 停止运营，Thirty
              Madison 以低于独角兽估值 50% 的价格出售；Rock Health 称，2025 年 35% 的数字健康轮次为持平轮或下调轮。

              正向改变判断的因素包括：披露 ARR 超过 $80M；临床结果数据显示 12 个月依从率显著高于 50%；新增 10+ 家独立于 Aon 的企业雇主客户；以及 /
              或获得独立药房福利管理方分销。负向改变判断的因素包括：FDA 执法行动点名 eMed；Aon 降低合作承诺；雇主 GLP-1 覆盖削减影响 eMed 客户基础超过 30%；或出现高关注度会员伤害事件。
