  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与护理路径
        blocks:
          - type: paragraph
            body: >-
              eMed 将自己描述为「全球首个建立在 Empathetic AI™ 之上的端到端 GLP-1
              护理平台」。面向患者的护理路径分五步推进：用血液采集套件在家完成资格诊断；由监考员带领虚拟筛查，确认医学资格；通过持牌远程医疗服务网络完成临床医生评估和 GLP-1 处方；经 CVS Caremark
              药房福利管理方按谈判价格配药；随后由 AI 驱动持续依从性支持，包括每周随访、每半年血液检测和实时指导。雇主按每会员每月购买访问权，并可选择补贴多少药品成本，从而形成灵活分摊安排。

              诊断层源自 eMed 在 COVID 时期的监考模式：公司在 FDA 紧急使用授权下，为 Abbott BinaxNOW
              居家快速检测提供实时虚拟引导。该基础设施——居家测试套件履约、身份验证、实时虚拟监考、受监管结果报告——被迁移进 GLP-1 工作流，成为居家血液采集模块。不同于 COVID 模式，当前 GLP-1
              诊断测量的是心代谢生物标志物，而不是单一病原体；血样送往实验室，而非在检测现场读数。公开材料未说明具体血液采集设备、CLIA 实验室伙伴和检测生物标志物组合。

              2025 年底宣布的 Thrive Global 合作，增加了行为改变层。Thrive 提供其 GLP-1 Companion 项目——覆盖饮食、运动、睡眠、压力管理和社交连接的数字与教练支持——叠加在 eMed
              临床工作流之上。合作被描述为集成式，但 eMed 临床平台与 Thrive 行为应用之间的技术交接，公开披露中没有细节。
