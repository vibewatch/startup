  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何传导到投资论点
      - 行动含义
    rows:
      - - FDA 执法点名 eMed
        - 因开方实践收到警告信或同意令
        - 需要改产品、纠正广告，且声誉受损；雇主信任被侵蚀
        - 立即重新评估；很可能构成终止标准
      - - Aon 缩减 / 终止合作
        - Aon 公开宣布撤资或逐步结束合作
        - 抹掉主要收入锚点和投资人协同；削弱分销优势价值
        - 很可能构成终止标准；触发减记复核
      - - 覆盖 >40% 客户基数的雇主削减 GLP-1 福利
        - 多个雇主客户因成本暂停或缩减 GLP-1 覆盖
        - 收入直接下降；ARR 爬坡论点失效
        - 下调至熊市情景；90 天内复核
      - - Series B 估值持平或下轮
        - 下一轮股权融资投后估值低于 $2B
        - 印证 Series A 定价过高；新资金可用更低标记进入
        - 论点破裂信号；评估退出还是摊低成本
    notes: 终止触发因素来自证据复核中识别的结构性脆弱点。阈值是管理层可行动的指标，通常提前 6-12 个月给出信号。 监管触发因素无论财务影响多大，都需要立即回应。
    claimRefs:
      - CV039
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - ARR 和收入年化口径
        - 截至 2026-06-28，未披露 ARR、收入或订单额
        - 没有收入，$2B+ 倍数无法验证；所有情景假设都在盲算
        - 要求管理层披露；纳入下一轮融资文件目标
      - - 客户数量和身份
        - 雇主客户数量和身份未公开披露
        - 集中度风险（Aon 可能贡献 >50% ARR）；无法评估多元化
        - 复核新闻稿；做福利顾问渠道核查；查 LinkedIn 雇主公告
      - - 会员入组和临床结果
        - GLP-1 12 个月依从性、会员参与率、相对基线的临床结果
        - 核心价值主张要靠更高留存支撑，必须优于 50% 的人群停用率
        - 要求独立结果研究；如 Aon 试点发布，复核该出版物
      - - 股权结构和优先权结构
        - 未披露股权结构表、清算优先权或稀释层级
        - Series A 投资人可能被创始人或可转工具的优先权压住
        - 要求股权结构表；复核 Series A 投资条款清单中的优先权条款
    notes: 尽调问题来自截至 2026-06-28 公开证据中的缺口。如果 eMed 进入结构化流程，所有事项都可通过标准投资人尽调解决； 标为高严重度的事项必须在任何投资决定前解决。
    claimRefs:
      - CV006
      - CV038
