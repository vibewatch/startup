      - number: '7.2'
        title: 临床安全、依从性与报销风险
        blocks:
          - type: paragraph
            body: >-
              eMed 最容易被低估的风险，是 GLP-1 依从性和长期结果上的临床证据缺口。已发表真实世界研究一致发现，30–50% GLP-1 患者会在最初 12
              个月内停药，原因包括胃肠道副作用、自付成本和行为支持不足。2026 年 6 月 MedicalXpress 一项研究确认，大多数停止 GLP-1 药物的患者会在一年内大幅反弹体重。Healthline
              对真实世界数据的综述，对 Ozempic 用户也得出相同结论。这些人群层面的持续使用率定义了 eMed 依从性项目必须超越的基准——而 eMed 未公开披露自有依从性或 12
              个月持续使用基准，外部无法验证其价值主张。FDA 药品安全通信提示严重不良事件，包括胰腺炎和甲状腺 C 细胞肿瘤；管理大规模 GLP-1 患者人群的平台，因此承担持续药物警戒义务。

              雇主福利设计风险已经急剧上升。Business Group on Health 2026 GLP-1 调查记录了事前授权、阶梯治疗、数量限制和基于结果的覆盖标准正在增加。KFF 与 Health System
              Tracker 数据确认，截至 2025 年中，大型雇主中拥有全面 GLP-1 肥胖福利的不到 25%，成本是首要障碍。覆盖品牌 GLP-1 的雇主，每名受保员工每年药品成本为
              $5,000–$15,000。Forbes（2026 年 6 月）报道称，健康计划开始停止支付 GLP-1 药物。BenefitNews
              记录了雇主在周期中途削减覆盖。自保险雇主计划保留每年修改福利设计的法律权利——通常只需提前 30 天通知——意味着 1 月加入的项目，到 12 月可能面临福利收缩。

              eMed 的 PBM 分销伙伴 CVS Caremark 对 GLP-1 实施利用管理控制，包括事前授权和阶梯治疗，直接限制 eMed 患者启动量。WTW 2026 年 6 月调查发现，多数雇主尚未改变
              GLP-1 覆盖，说明短期稳定；但除非依从性证据验证临床 ROI，成本管理意图会继续增强。eMed
              缺少已发表临床结果数据，是关键脆弱点：没有同行评审的依从性基准，雇主无法独立验证项目疗效是否优于更便宜的替代方案。
