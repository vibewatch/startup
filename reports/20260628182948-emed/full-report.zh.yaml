      - number: '3.4'
        title: 切换成本、锁定与分销权力
        blocks:
          - type: paragraph
            body: >-
              雇主 GLP-1 管理福利天然黏性强，因为采购受年度福利年周期约束。一旦雇主通过 PBM
              集成、临床流程搭建、会员注册和结果报告，把临床管理平台嵌入福利体系，年中切换在运营和合同上都很困难。这种结构性锁定同样适用于包括 eMed
              在内的所有雇主渠道竞争者。赢下第一个福利年度合同的公司，进入续约时拥有在位优势。

              多平台并用是可能的，但经济效率低。雇主理论上可以同时提供 eMed 和 Noom
              这类行为生活方式补充项目，但会增加成本和行政复杂度。实践中，大型自保雇主倾向于每类项目选择单一临床管理供应商，降低了持续多平台并用的概率。

              分销权力是 eMed 优势最可见、也最集中的维度。Fortune 1,500 公司中，超过 1,200 家由 Aon 担任福利顾问。Aon 推荐安装
              eMed，实际上移除了企业销售周期中的冷启动外展阶段。Found 和 Calibrate 等竞争者必须逐步建立经纪人和顾问关系。Omada 有机构化健康计划关系，但没有一个 Aon
              规模的单一投资人渠道拥护者。Teladoc 来自 legacy Livongo 的雇主关系很深，但整体商业轨迹已经下行。

              对所有平台而言，品牌 GLP-1 药物的供应与合作伙伴入口都是关键依赖。Wegovy（Novo Nordisk）和 Zepbound（Eli Lilly）的短缺尚未完全解决，品牌药入口需要药房集成。Omada
              参与 Lilly Employer Connect，并出现在 Lilly 优先入口生态中，给了它 eMed 尚未公开披露可匹配的供给侧优势。NovoCare 和 LillyDirect
              代表药企亲自控制患者面对层的努力；如果药企能把依从性工具直接附着到处方上，管理平台的重要性会下降。PBM 巨头 OptumRx 和 CVS Caremark 已经控制多数自保雇主的药品处方集；PBM 原生
              GLP-1 管理覆盖层，会绕过包括 eMed 在内的所有独立平台。
