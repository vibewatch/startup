      - number: '2.2'
        title: 市场规模：从多重视角看 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              任何单一 GLP-1 市场数字，都会误读 eMed 对投资人真正相关的规模问题。Research and Markets 预计，全球 GLP-1 药物市场（覆盖糖尿病、心血管、减重等所有适应症）到 2035
              年达到 $157.5 billion，CAGR 为 11.1%；Morgan Stanley 的基准情景到 2035 年达到 $190 billion，牛市情景为 $240
              billion，驱动来自口服剂型和地理扩张。Goldman Sachs 则发布相反观点，警告抗肥胖药物市场可能小于这些预测，理由包括价格侵蚀、处方集阻力和真实世界依从性流失，可能把全球抗肥胖药收入限制在 2035
              年约 $120 billion。$120 billion 到 $240 billion 的宽区间，说明是真实不确定性，而不是分析师精确度。

              eMed 相关的 SAM 位于更下方的几层。JP Morgan 等分析师把美国 GLP-1 肥胖药物细分市场定在 2030 年 $42–$48 billion，CAGR 为 18–23%。再往下，eMed
              实际竞争的美国雇主管理型数字 GLP-1 平台市场，预计从 2026 年 $2.2 billion 增至 2030 年 $6 billion。eMed
              的可获得服务市场只是其中一部分：自保、愿意支付按会员计的管理费，并寻求对结果负责的临床监督而非单纯药房入口的雇主。Aon 对超过 192,000 名 GLP-1 使用者的劳动力分析显示，管理型项目的 ROI
              逻辑成立，但只有在依从性超过 80% 时成立——多数非管理型项目达不到这个阈值。自保雇主宇宙约有 50,700 个计划，覆盖 39 million 名参与者；价值最高的集中在员工数 5,000
              人及以上的公司，其中约 90% 为自保。
