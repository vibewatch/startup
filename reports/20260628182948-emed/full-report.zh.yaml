      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              首要增长驱动，是肥胖给雇主健康计划带来的直接、可量化成本负担。Forbes 与 Nature 发表的研究估计，肥胖每年通过医疗费用、出勤但低效、缺勤和残障让美国雇主承担约 $347–$400 billion
              成本。每名受影响员工每年 $6,472 的肥胖成本，为定价约 $100–$200 PMPM 的管理项目提供了有吸引力的 ROI 框架。Aon 2025 年 4
              月劳动力分析发现，相比匹配的非使用者对照组，接受管理型入口 12–18 个月后，减重 GLP-1 使用者的医疗成本增速下降约三个百分点；依从性达到或超过 80% 的使用者，下降扩大到七个百分点。FDA 在
              2026 年针对复方 GLP-1 远程医疗的执法行动——向 DTC 提供方发出 30 封非法营销警告信——反而利好 eMed：它清理了未差异化竞争者，也验证了临床监督、面向雇主的模型。

              最严重的约束，是药物和项目两个层面的成本上升。WTW 报告称，雇主 GLP-1 PMPM 成本从 2022 年 $4.34 升至 2025 年 Q1 的 $27.23，GLP-1 现在约占雇主处方总支出的
              21%。EBRI 模拟预测，广泛覆盖 GLP-1 可能把雇主健康保险保费推高 5.3%–13.8%，形成财务压力，促使部分雇主收紧资格或完全取消覆盖；WTW 2026 年 6 月 Pulse Survey
              发现，12% 的雇主可能停止 GLP-1 覆盖。真实世界依从性低，是最深的结构性风险：一项已发表 PMC cohort 研究发现，非糖尿病 GLP-1 启动者中，65% 在一年内停用。对 eMed
              而言，这个依从性缺口既是它声称要解决的商业问题，也是如果自身结果数据经不起独立审计时的生存威胁。雇主采购周期长度、福利设计锁定和切换成本进一步约束有机增长；Novo Nordisk 与 Eli Lilly
              的市场集中度，则让药企对 eMed 的药费转嫁经济拥有显著议价力。
