              进入 2027 年前，雇主对 GLP-1 成本和停药风险的负面情绪正在增强。PSG 数据显示，未覆盖雇主中 49% 无论价格如何都拒绝覆盖。BGH 数据显示，已覆盖雇主中 28%
              计划退出或不确定是否继续覆盖。Cigna 2026 年 7 月取消员工覆盖，显示大型企业正在收缩而非扩大 GLP-1 预算。eMed 必须证明足够强的雇主级 ROI，才能扩大市场，而不是被更广泛的覆盖收缩拖回去。
