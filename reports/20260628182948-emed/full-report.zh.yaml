      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              收入质量无法评估。eMed 没有披露任何财务指标——没有 ARR、GMV、客户数、单雇主收入或毛利率。公司声称的临床结果（90%+ 依从性、平均减重 21 磅、99%
              生物标志物改善）均为单一来源、公司披露数据，尚未被独立复现，也未发表于同行评审文献。Aon 试点（平均减重 22.4 磅、95% 留存、1,200 名参保者）由 Aon 披露，而 Aon
              同时是投资人和商业伙伴——从结构上看，这是独立性最弱的验证。

              若 eMed 仍处于无收入或早期收入阶段，$2B+ 隐含估值需要高到不合理的收入倍数支撑。可比数字健康公司在 Series A 通常按 15–40x ARR 交易；以 $2B 估值计算，eMed 需要
              $50–130M ARR 才能支撑中档倍数。如果当前 ARR 远低于该水平——考虑到其 GLP-1 雇主项目 2024 年才启动，这很可能——该估值押注的是未来包干模式收入，而不是当前现金流。

              FTC 在 2025 年持续执法远程医疗公司，包括针对欺骗性健康宣称和未经授权计费的行动，构成实质监管风险。公开可比公司 Hims & Hers 于 2026 年 2 月收到 FDA 关于复方
              semaglutide 营销的警告信。eMed 的品牌药模式避开了复方药执法风险，但 FTC 对依从性指标和临床结果广告的审查，仍是近端真实暴露。任何资本承诺在可辩护之前，必须解决四个尽调阻断项：（1）NDA
              下的经审计收入和毛利数据；（2）独立临床结果审计；（3）Aon 合同经济性及排他性 / 依赖范围；（4）包干模式精算承保方法。
