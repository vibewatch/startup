      - number: '4.6'
        title: 图表与要点
        blocks:
          - type: callout
            title: 包干模式打开差异化收入质量
            body: >-
              如果 eMed 能从 PMPM 订阅成功转向按人头包干合同，它将成为首个与雇主共同承担临床风险的 GLP-1
              管理平台。规模化包干若跑通，产品会从一项福利费用科目，变成雇主的精算伙伴；切换成本随之大幅提高，也能为后续雇主续约沉淀更丰富的结果数据。Aon 试点 95% 留存和 22.4
              磅减重指标即便来自有利益冲突的一方，也显示底层临床项目可能支撑这一目标。
            calloutType: strength
            claimRefs:
              - CI007
              - CI002
              - CI035
          - type: callout
            title: 收入透明度缺口构成承保阻断
            body: >-
              eMed 完全没有公开财务披露——没有 ARR、客户数、毛利率、审计报表——在没有 NDA 尽调之前，估值承保无法进行。$2B+ Series A
              估值由战略投资人（Aon、Brady、Yaccarino）定价，他们的经营激励不同于单纯资本回报。任何财务投资人若在该水平或接近该水平进入，却拿不到完整披露，本质上是在承保一个叙事，而不是一个财务模型。
            calloutType: risk
            claimRefs:
              - CI025
              - CI029
              - CI036
              - CI037
          - type: callout
            title: 资本承诺前必须通过四道不可妥协的尽调门槛
            body: >-
              任何资本承诺之前，尽调必须卡住四项：（1）至少 12 个月实际数据对应的经审计收入与毛利率；（2）带匹配对照人群的独立临床结果审计；（3）Aon 合同经济性，包括任何排他条款、最低承诺和 ROFR
              语言；（4）包干模式精算承保，包括准备金要求和单会员风险暴露。在这四道门槛通过前，合适姿态是跟踪，而不是投资。
