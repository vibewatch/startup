      - number: '1.4'
        title: COVID 检测起点、GLP-1 转向与规模信号
        blocks:
          - type: paragraph
            body: >-
              eMed 的历史优势在于，它不是直接从 2025-2026 年 GLP-1 热潮里冒出来的公司。公司早期规模来自与 Abbott 合作，在 2020 年 12 月 FDA 紧急授权下提供虚拟指导的居家
              BinaxNOW COVID-19 检测；Abbott 与 eMed 当时目标是在 2021 年 Q1 推出 30M 份居家检测，Q2 再推出 90M 份。疫情时期的运营模型建立了几项与当前雇主 GLP-1
              论点相关的能力：远程身份和筛查流程、远程医疗辅助诊断、受监管报告以及居家患者支持。到 2025-2026 年，叙事已经从检测转向肥胖管理。Aon 试点和 eMed 自身融资材料强调的是 90%+
              依从性、平均减重约 21-22.4 磅以及生物标志物改善，而非检测吞吐量。公司还通过 CVS Caremark 和 Thrive Global 合作拓宽分销，显示其正从单点远程医疗方案，进入雇主福利基础设施。
