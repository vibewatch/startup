evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements confirming recognized annual recurring revenue (ARR), gross margins, and cloud vs
      self-hosted breakdown.
    whyItMatters: >-
      Without verified ARR or GAAP financials, valuation multiples on the reported $1.4B valuation cannot be rigorously
      substantiated.
    diligencePath: >-
      Request confidential management financial disclosures or secondary trade data books detailing ARR and revenue
      retention.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Comprehensive organizational chart and cap table detailing complete functional leadership roster and equity stakes
      beyond sample executive directors.
    whyItMatters: >-
      Sample coverage captures senior executive leadership but omits broader departmental heads across security,
      infrastructure, and international operations.
    diligencePath: >-
      Review internal PostHog public handbook team profiles and corporate registry records to audit complete management
      hierarchy.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: retention-and-conversion
    missingEvidence: >-
      Audited company cohort data revealing exact free-to-paid conversion rates, net revenue retention (NRR), and logo
      retention percentages across cloud tiers.
    whyItMatters: Validates whether the 97% free user base can predictably monetize into high-margin enterprise ARR as usage scales.
    diligencePath: Request confidential SaaS cohort retention and net expansion disclosures during investor management presentations.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: enterprise-churn-and-displacement
    missingEvidence: >-
      Direct win/loss conversion ratios and customer churn figures specifically tracking accounts migrating between
      PostHog and Amplitude or Mixpanel at enterprise scale.
    whyItMatters: >-
      Determines whether PostHog's multi-product consolidation thesis displaces established incumbents permanently or
      merely captures initial greenfield developer workloads.
    diligencePath: >-
      Request customer win/loss audit logs and cohort displacement statistics broken down by former incumbent vendor
      from PostHog management.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Management-certified ARR definitions, recognized revenue, deferred revenue, product mix, discounts, expansion,
      contraction, churn, and concentration.
    whyItMatters: >-
      Third-party ARR estimates and list prices cannot establish durable revenue quality, accounting revenue, or
      customer-level expansion.
    diligencePath: >-
      Obtain monthly management accounts and a customer cohort bridge reconciled to billing and recognized revenue for
      the prior 24 months.
    relatedQuestionRefs:
      - QI003
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Product-level gross margin, cloud and support costs, CAC, payback, sales cycle, free-to-paid conversion, and
      channel economics.
    whyItMatters: >-
      Usage growth may raise both revenue and infrastructure cost, so public pricing alone cannot establish operating
      leverage.
    diligencePath: >-
      Review product-level contribution margins and acquisition cohorts by customer segment, channel, and monthly usage
      tier.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI007
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, debt and lease obligations, planned use of funds, downside runway, and
      next-round trigger.
    whyItMatters: >-
      Historical funding raised and secondary-market activity do not establish cash available to finance the operating
      plan.
    diligencePath: >-
      Obtain bank statements, the debt and commitments schedule, board budget, monthly cash forecast, and downside
      liquidity scenario.
    relatedQuestionRefs:
      - QI006
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability-and-roadmap
    missingEvidence: >-
      First-party status history, incident postmortems, product SLOs, support metrics, current changelog, and dated
      roadmap commitments.
    whyItMatters: >-
      Without direct operating records, the competitor-reported outage allegation and the delivery maturity of newer
      products cannot be independently assessed.
    diligencePath: >-
      Review the complete status history and incident reports, sample support response data, and obtain the current
      roadmap with committed versus exploratory items.
    relatedQuestionRefs:
      - QE004
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: security-and-compliance
    missingEvidence: >-
      Direct SOC 2 report, current Trust Center materials, data-flow and subprocessor inventory, penetration-test
      summary, BAA terms, and regional control scope.
    whyItMatters: >-
      Secondary descriptions cannot establish the audit period, exceptions, product coverage, or whether buyer-specific
      privacy and regulated-data requirements are met.
    diligencePath: >-
      Request Trust Center access and have security and privacy counsel review attestations, exceptions, data residency,
      retention, deletion, encryption, and access-control evidence.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: scalability-and-unit-performance
    missingEvidence: >-
      Independent load benchmarks and customer evidence for event throughput, flag-evaluation latency, query
      concurrency, replay ingestion, connector delivery, and cloud-versus-self-hosted operating cost.
    whyItMatters: Named technologies do not establish performance, resilience, or economical scaling at a buyer's expected workload.
    diligencePath: >-
      Run a production-shaped proof of concept with agreed peak loads and failure tests, then compare observed
      performance and staffing cost with contractual SLOs.
    relatedQuestionRefs:
      - QE002
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Direct repository activity, release cadence, contributor concentration, issue resolution, package downloads, and
      practitioner-community activity for the current period.
    whyItMatters: Open-core positioning is not the same as current community health or maintainability evidence.
    diligencePath: >-
      Review official repositories, release feeds, package registries, issue history, contribution distribution, and
      recent practitioner discussions.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Audited NRR, GRR, logo churn, renewal rates, contract duration, product attach rates, channel mix, and
      top-customer revenue concentration.
    whyItMatters: >-
      Without cohort durability and concentration data, broad adoption and workflow activity cannot establish recurring
      revenue quality or downside exposure.
    diligencePath: >-
      Request board-level customer cohort schedules, renewal and contraction bridges, product-level attach cohorts,
      channel attribution, and top-10 customer concentration from management.
    relatedQuestionRefs:
      - QU004
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: customer-proof-quality
    missingEvidence: >-
      Customer names tied to deployment dates, production status, quantified outcomes, reference contacts, and current
      contract status for the rows summarized in TU003.
    whyItMatters: >-
      A product-listing directory cannot distinguish a production customer from a pilot, historical account, limited
      deployment, or marketing logo.
    diligencePath: >-
      Obtain three referenceable customer records spanning startup, growth, and enterprise cohorts, then verify scope
      and outcomes directly with named customer contacts.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: paid-customer-segmentation
    missingEvidence: >-
      Paying customer count, free-to-paid conversion, segment revenue, ACV distribution, and cohort-level expansion by
      initial product.
    whyItMatters: >-
      The company-reported team count and AI workflow volumes do not reveal how adoption converts into durable
      commercial value.
    diligencePath: >-
      Reconcile billing exports with workspace activity to build paid-customer, ACV, conversion, and multi-product
      expansion cohorts.
    relatedQuestionRefs:
      - QU001
      - QU002
  - type: missing-source
    severity: material
    topic: legal-and-regulatory-status
    missingEvidence: >-
      Current primary evidence on litigation, enforcement, regulator correspondence, licenses, DPAs, subprocessors, and
      cross-border data-transfer mechanisms.
    whyItMatters: >-
      SOC 2 control assurance does not establish the absence of legal claims or compliance with every applicable privacy
      regime.
    diligencePath: >-
      Obtain a counsel-prepared legal schedule, regulator correspondence, current DPA and subprocessor list, and
      jurisdiction-by-jurisdiction privacy analysis.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: independent-incident-history
    missingEvidence: Independent breach, outage, uptime, incident-severity, and recovery evidence through October 9, 2026.
    whyItMatters: >-
      A management statement about incidents identified during the audit period does not prove the absence of all
      incidents or establish current reliability.
    diligencePath: >-
      Review status history, incident postmortems, cyber-insurance claims, customer notices, penetration-test summaries,
      and measured SLO performance.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: free-user-economics
    missingEvidence: >-
      Free-to-paid conversion, cohort retention, service cost, gross margin by product, cash burn, runway, and
      paying-customer revenue concentration.
    whyItMatters: >-
      The share of users paying zero does not reveal whether the acquisition model is efficient or whether a small
      paying cohort supports the cost base.
    diligencePath: >-
      Request audited financials, cloud cost allocation, conversion cohorts, NRR and GRR, account-level revenue
      concentration, and board-approved operating plan.
    relatedQuestionRefs:
      - QR007
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: dependency-and-customer-concentration
    missingEvidence: >-
      Regional AWS architecture, tested failover results, material subprocessor concentration, active paying-customer
      count, deployment depth, and top-customer revenue shares.
    whyItMatters: >-
      Public domain detections and database entries cannot measure platform dependency resilience or revenue
      concentration.
    diligencePath: >-
      Review architecture diagrams, AWS assurance materials, recovery exercises, subprocessor spend, billing records,
      and top-20 customer contracts.
    relatedQuestionRefs:
      - QR004
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: minor
    topic: production-ai-performance
    missingEvidence: >-
      Production adoption, external model evaluation, latency and cost SLOs, human-review controls, and fallback
      behavior for PostHog AI features.
    whyItMatters: An experimental repository benchmark cannot establish commercial AI reliability, safety, or operating cost.
    diligencePath: >-
      Inspect production telemetry, red-team and evaluation suites, model-routing policies, incident logs, and customer
      adoption by AI feature.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: revenue-and-retention
    missingEvidence: >-
      Audited financial statements confirming GAAP recognized revenue, recurring cloud gross margins, and customer
      cohort net retention rates.
    whyItMatters: >-
      Without audited ARR and cohort retention data, assessing whether PostHog can grow into its $1.4B valuation relies
      on third-party estimates.
    diligencePath: >-
      Request confidential financial disclosure, management accounts, and cohort retention tables under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV001
