  - id: FU001
    title: Evidence-backed customer journey and expansion loop
    type: journey-map
    summary: >-
      The evidenced path runs from a technical team's need through shared instrumentation and multi-product workflows,
      while commercial durability remains unverified.
    data:
      items:
        - label: Need
          description: A small engineering team seeks one vendor and one event stream for several product workflows.
          touchpoints:
            - Engineering evaluation
            - Integrated-suite comparison
        - label: Instrument
          description: Events, persons, and properties create the shared analytical base.
          touchpoints:
            - Custom events
            - Autocapture
            - Identity
        - label: Analyze
          description: Teams examine adoption, conversion, funnels, paths, stickiness, and retention.
          touchpoints:
            - Insights
            - Dashboards
            - Alerts
        - label: Diagnose
          description: The same context links analytical changes to session replays and errors.
          touchpoints:
            - Session replay
            - Error context
        - label: Test
          description: Feature flags and experiments provide an adjacent workflow for controlled product changes.
          touchpoints:
            - Feature flags
            - Experiments
        - label: Expand or reassess
          description: >-
            Teams can connect business data and additional modules, but may reassess breadth, event growth, and vendor
            concentration.
          touchpoints:
            - Billing or CRM context
            - Additional modules
            - Suite concentration review
    approximationNotes: >-
      This is a qualitative mechanism map, not a measured funnel. No stage conversion, elapsed time, revenue
      attribution, or retention rate is available in the assigned evidence.
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU011
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative impact, evidence-backed likelihood signal, mitigation maturity, and residual exposure for six priority
      risks.
    data:
      columns:
        - label: Impact
          detail: Investment consequence if the risk materializes.
        - label: Likelihood evidence
          detail: Observed signal or explicit evidence gap; not a numerical probability.
        - label: Mitigation maturity
          detail: Strength of mitigation documented in the assigned sources.
        - label: Residual severity
          detail: Analyst view after documented mitigation and scope limitations.
      rows:
        - label: AWS / subservice dependency
          note: The auditor excluded the cloud host's actual controls.
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: medium
              detail: No independent incident series in the assigned pool.
            - label: Medium-high
              tone: medium
              detail: Recovery objectives, backups, and monitoring are documented.
            - label: High
              tone: high
        - label: Privacy and legal exposure
          note: SOC 2 does not establish every regulatory or litigation status.
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: medium
            - label: Medium
              tone: medium
              detail: Audited security controls mitigate only part of the legal surface.
            - label: High
              tone: high
        - label: Free-user economics
          note: The 97% metric is users, not revenue or cost.
          values:
            - label: High
              tone: high
            - label: Material signal
              tone: medium
              detail: Company reports 97% of users pay zero.
            - label: Low visibility
              tone: high
              detail: No conversion or unit-economics data in the pool.
            - label: High
              tone: high
        - label: Open-source scaling and support
          note: Company guidance applies to a hobby deployment.
          values:
            - label: Medium
              tone: medium
            - label: High above stated hobby scale
              tone: high
            - label: Medium
              tone: medium
              detail: Managed cloud migration is the documented path.
            - label: Medium
              tone: medium
        - label: Instrumentation quality
          note: Analytics quality depends on customer-supplied event and identity data.
          values:
            - label: Medium
              tone: medium
            - label: Shared-control risk
              tone: medium
            - label: Medium
              tone: medium
              detail: Documentation exists; measured QA outcomes do not.
            - label: Medium
              tone: medium
        - label: AI model performance
          note: The cited benchmark is an experimental repository, not a production product audit.
          values:
            - label: Low-medium
              tone: medium
            - label: Observed benchmark weakness
              tone: medium
            - label: Early
              tone: high
              detail: Public tests exist, but external production validation does not.
            - label: Medium if production-critical
              tone: medium
    approximationNotes: >-
      Qualitative categories are analyst assessments, not measured probabilities. Unknown values remain unknown rather
      than being inferred from search silence.
    claimRefs:
      - CR002
      - CR007
      - CR009
      - CR010
      - CR011
      - CR016
  - id: FV001
    title: PostHog Valuation and Recommendation Logic Chain
    type: flow
    summary: >-
      Visualizing the analytical progression from developer adoption and capital rounds to valuation tension and the
      research-more conclusion.
    data:
      nodes:
        - id: n1
          label: Developer Adoption
          detail: Over 500k teams and 190k customer accounts
        - id: n2
          label: Monetization Asymmetry
          detail: 97% to 98% of users pay zero under free tier
        - id: n3
          label: Enterprise Scale Ceiling
          detail: Competitors seen as more reliable for massive enterprise deployments
        - id: n4
          label: Valuation Escalation
          detail: Series D at $920M to Series E at $1.4B in 2025
        - id: n5
          label: Multiple Disconnect
          detail: Estimated $13.4M-$25M ARR creates steep valuation multiple
        - id: n6
          label: 'Recommendation: research-more'
          detail: High risk rating and expensive valuation stance
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: Logical decision flow depicting key quantitative and qualitative trade-offs driving our valuation stance.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV010
      - CV014
