      - number: '4.2'
        title: Pricing, distribution, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The free-to-paid design removes an initial procurement hurdle and lets developers instrument a product
              before incurring a bill. That can lower acquisition friction, but the same evidence also identifies a
              conversion burden: PostHog's homepage uses two different free-cohort statements, saying both that 97% of
              users pay nothing and that 98% of customers use PostHog for free. Those denominators are not
              interchangeable, and neither discloses conversion, expansion, or retention. A company-published customer
              story offers a useful value-realization proxy: Puzzle used PostHog data to diagnose activation friction
              and changed onboarding to reduce time to value. It does not establish PostHog's CAC or payback. The best
              independent caution in the pool is Built In's AI-generated synthesis, which frames the challenge as
              converting broad free adoption into monetization; its weak provenance makes it a diligence lead, not a
              verified performance metric.
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
      - number: '4.3'
        title: Public traction, operating efficiency, and capital
        blocks:
          - type: paragraph
            body: >-
              Public financial traction is dominated by third-party ARR reporting rather than filings or management
              accounts. FounderVentures reports $57.5 million of ARR in February 2026 and 99% year-over-year growth,
              while Built In repeats a $9.5 million 2024 ARR figure and 138% growth from an LLM-generated
              candidate-information page. The periods differ and neither source supplies an audited bridge to recognized
              revenue, so the figures should not be blended into a growth series. FounderVentures also reports roughly
              200 employees and $287,000 of ARR per employee; Tracxn reports 224 employees "as of Aug 26" without an
              explicit year in the fetched text. On financing, Tracxn reports $194 million raised, and Tracxn plus
              UpMarket report a $75 million Series E at a $1.4 billion post-money valuation in September 2025. Funding
              raised is not cash available, and no source supplies current cash, burn, debt, or runway.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is promising but not presently underwriteable from public data. Usage meters provide a
              plausible path from developer adoption to recurring consumption, and the multi-product suite can increase
              the number of billable workloads inside an account. However, the public sources do not reveal cloud gross
              margin, infrastructure cost per unit, support burden, net revenue retention, free-to-paid conversion,
              discounting, or customer concentration. They also do not disclose cash on hand, operating cash burn,
              committed debt, or the portion of historical funding still available. Secondary-market access is not a
              financing substitute: UpMarket and EquityZen describe transactions in which investors buy shares from
              existing holders rather than newly issued company shares. Investment diligence should therefore center on
              a monthly revenue-and-margin cohort pack, cash and obligations schedule, and a board-approved operating
              plan before assigning confidence to margin expansion or runway.
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Legible pricing is not legible revenue
            body: >-
              Published meters explain how a bill can form, but without realized rates, discounts, usage cohorts, and
              recognition policies they do not establish revenue scale or quality.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI016
          - type: callout
            title: Capital adequacy remains unproven
            body: >-
              Reported funding and valuation establish access to historical capital, not current cash availability,
              burn, debt capacity, or runway.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
