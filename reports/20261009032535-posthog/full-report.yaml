  - id: FP001
    title: 'Competitive Positioning: Architecture Breadth vs Analytical Depth'
    type: quadrant
    summary: >-
      Visualizing product architectural breadth against analytical/statistical depth across core software analytics and
      developer tooling platforms.
    data:
      xAxis: Specialized Point Tool -> Broad Multi-Product Suite
      yAxis: Standard Descriptive Analytics -> Advanced Predictive & Statistical Rigor
      points:
        - label: PostHog
          x: 8.5
          'y': 5.2
          note: High suite breadth across 9 modules; standard Bayesian testing and descriptive analytics
        - label: Amplitude
          x: 4.8
          'y': 9
          note: Moderate breadth (analytics-first); leading predictive ML cohorts and causal inference
        - label: Mixpanel
          x: 4.2
          'y': 7.5
          note: Focused event analytics with automated Signal correlation and metric hierarchy trees
        - label: Statsig
          x: 6.5
          'y': 8.8
          note: Specialized in experimentation and delivery; top statistical rigor (CUPED, sequential)
        - label: LogRocket
          x: 3.5
          'y': 6
          note: Focused frontend monitoring and replay; client-side system performance diagnostics
        - label: Userpilot
          x: 5.8
          'y': 4
          note: Combined analytics and in-app engagement without deep statistical or SQL modeling
    approximationNotes: >-
      Ordinal scoring mapped on a 1-10 relative scale based on comparative technical capabilities and feature breadth
      documented in 2026 reviews.
    claimRefs:
      - CP001
      - CP007
      - CP008
      - CP009
      - CP010
  - id: FI001
    title: Usage-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence explains the usage and billing steps, while realized revenue, delivery cost, and gross profit
      remain private diligence inputs.
    data:
      nodes:
        - id: usage
          label: Customer activity
          detail: Events, recordings, requests, and rows enter PostHog products.
        - id: free-tier
          label: Monthly free allowance
          detail: Each published usage example includes a no-charge allowance.
        - id: paid-usage
          label: Metered paid usage
          detail: Usage above free allowances is eligible for published per-unit rates.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Not disclosed; list billing does not establish accounting revenue.
        - id: delivery-cost
          label: Delivery cost
          detail: Hosting, storage, compute, and support cost per unit are not disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Not calculable without realized revenue and delivery-cost evidence.
      edges:
        - from: usage
          to: free-tier
          label: Enters allowance
        - from: free-tier
          to: paid-usage
          label: Excess usage
        - from: paid-usage
          to: recognized-revenue
          label: Billing and recognition
        - from: recognized-revenue
          to: delivery-cost
          label: Less service costs
        - from: delivery-cost
          to: gross-profit
          label: Produces gross profit
    approximationNotes: >-
      This is a mechanism map, not a forecast; the final three financial stages are explicitly unavailable in the
      assigned public evidence.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI016
