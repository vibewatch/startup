      - number: '1.2'
        title: Leadership Structure, Governance, and Key Personnel
        blocks:
          - type: paragraph
            body: >-
              The company's strategic and technological direction remains guided by its original co-founders: Co-CEO
              James Hawkins, who leads product vision and commercial strategy, and CTO Tim Glaser, who architects core
              ingestion and ClickHouse analytics infrastructure CO005. PostHog enforces a culture of high engineer
              autonomy, operating modular product development squads structured as internal mini-startups supported by
              specialized executive leadership CO006. Fraser Hopper manages legal, finance, and operational compliance,
              while functional leadership across data warehousing, engineering management, and product analytics
              coordinates platform execution CO007. Co-founders retain board majority control, deliberately mitigating
              hostile corporate governance dynamics while allowing management to prioritize product-market fit over
              aggressive premature enterprise sales expansion CO008.
