    columns:
      - Pillar
      - Core Thesis Argument
      - Anti-Thesis Counter-Risk
      - Falsification / Trigger Metric
    rows:
      - - Product Velocity & Breadth
        - Unified 10+ product suite reduces tool fragmentation and integrates analytics, replay, and AI context
        - Spreading R&D across 14 products risks feature depth deficits against specialized enterprise leaders
        - Enterprise win rates against dedicated analytics or session replay competitors
      - - Go-to-Market Model
        - Self-serve product-led growth achieves 5-day CAC payback and widespread developer adoption
        - 97% to 98% of users pay zero, making enterprise monetization highly dependent on a tiny customer fraction
        - Paid tier conversion rate falling below 2% of total active teams
      - - Enterprise Infrastructure
        - Open-source core combined with managed cloud warehouse gives developer control with cloud ease
        - Single-box deployments face event volume limits, creating enterprise friction for large deployments
        - Customer churn or architectural defection among accounts exceeding 100M monthly events
      - - Capital & Backing
        - Over $169M to $182M raised from Tier-1 investors including Stripe, GV, and Peak XV provides ample runway
        - Successive rapid rounds at $920M and $1.4B establish high liquidation hurdle and down-round sensitivity
        - Inability to raise subsequent equity capital at or above $1.4B without onerous preference structure
    notes: >-
      Comparative thesis evaluation balancing product-led platform velocity against enterprise scalability and
      monetization friction.
