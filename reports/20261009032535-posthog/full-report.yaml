      - number: '5.2'
        title: Documented Cloud Architecture and Data Flow
        blocks:
          - type: paragraph
            body: >-
              The official architecture page provides a concrete cloud-system map rather than a generic marketing
              diagram. Django serves the web application and API, while Rust services handle event capture, feature flag
              evaluation, and replay ingestion. Kafka is the central message bus; a Node.js CDP worker processes events
              and can deliver them to external destinations. The documented stores include ClickHouse, PostgreSQL,
              Redis, and blob storage, while Celery, Temporal, and Dagster divide short tasks, reliable workflows, and
              scheduled pipelines. PostHog further says its cloud application services run in AWS EKS, with ClickHouse
              on self-managed EC2 and PostgreSQL on Aurora. This disclosure makes the principal dependencies legible,
              but it does not establish capacity, latency, recovery objectives, regional failover, or unit
              infrastructure cost. Those quantities remain diligence inputs, not facts that can be inferred from
              component choice.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
