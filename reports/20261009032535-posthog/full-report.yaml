chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              PostHog, Inc. was incorporated following its January 23, 2020 founding by James Hawkins and Tim Glaser,
              pivoting through multiple prototypes before graduating from Y Combinator's W20 cohort CO001. Headquartered
              in San Francisco with a distributed remote-first organizational structure, PostHog operates as a
              developer-oriented product operating system combining event-based product analytics, session replay,
              feature flags, experimentation, customer data infrastructure, and AI observability CO002. Rather than
              relying on traditional top-down enterprise software sales forces, PostHog utilizes an inbound, product-led
              growth model pairing transparent usage-based utility pricing with a generous free tier CO003. This pricing
              structure offers standard monthly allowances across its paid products, resulting in roughly 97% to 98% of
              active accounts paying zero dollars while creating low-friction adoption funnels across technical teams
              CO004.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
