  - id: TV003
    title: Three-Year Valuation Scenarios and Sensitivity Matrix
    columns:
      - Scenario
      - Core Operating Assumptions
      - Exit / Multiple Basis
      - Implied Valuation
      - Downside / Upside Triggers
    rows:
      - - Bull Case
        - ARR scales to $100M+ by 2027; NRR exceeds 125%; multi-product adoption expands paid base past 5%
        - 25x NTM ARR multiple driven by high-growth SaaS and AI observability leadership
        - $2,500M
        - Successful monetization of Max AI and broad enterprise cloud migration
      - - Base Case
        - ARR reaches $45M-$55M; NRR stabilizes at 105%-110%; usage expansion remains developer-dominated
        - 18x NTM ARR multiple consistent with premium private developer tool comps
        - $900M
        - Steady expansion among mid-market teams, but sluggish Fortune 500 displacement
      - - Bear Case
        - ARR plateaus at $20M-$25M; enterprise churn accelerates due to high-throughput scale bottlenecks
        - 12x NTM ARR multiple amid tech multiple compression and growth deceleration
        - $300M
        - Down-round financing, key customer defection to Datadog/Amplitude, or cloud margin squeeze
    notes: >-
      Scenario valuations model 3-year outcomes using revenue multiples aligned with public and private developer
      software benchmarks.
    claimRefs:
      - CV006
      - CV007
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronology of corporate founding, financing events, product expansions, and valuation milestones from 2020 through
      2026.
    data:
      items:
        - label: 2020-01
          detail: PostHog founded by James Hawkins and Tim Glaser; joined Y Combinator W20 batch
          tone: positive
        - label: 2020-02
          detail: MVP launched on Hacker News; surpassed 300 deployments in first days
          tone: positive
        - label: 2020-04
          detail: Raised $3.025M seed round led by Y Combinator Continuity and 1984 Ventures
          tone: neutral
        - label: 2020-10
          detail: Integrated ClickHouse backend support to scale event processing capacity
          tone: positive
        - label: 2020-12
          detail: Closed $9M Series A funding round led by GV, expanding global remote team
          tone: neutral
        - label: 2021-06
          detail: Secured $15M Series B funding round led by Y Combinator
          tone: neutral
        - label: 2022-12
          detail: Achieved 6x annual revenue expansion and reached low single-digit millions in revenue
          tone: positive
        - label: 2023-02
          detail: Pivoted strategy to mass startup adoption, ending paid self-hosted tier and launching free cloud tier
          tone: neutral
        - label: 2023-03
          detail: Announced internal development of PostHog Data Warehouse to own customer source of truth
          tone: positive
        - label: 2024-12
          detail: Reached cashflow positive operating milestone with team of ~80 and 12 products
          tone: positive
        - label: 2025-06
          detail: Raised $70M Series D led by Stripe at $920M valuation
          tone: positive
        - label: 2025-10
          detail: Completed $75M Series E led by Peak XV at $1.4B valuation, attaining unicorn status
          tone: positive
        - label: 2026-02
          detail: Launched PostHog Desktop application as team scaled to approximately 200 people
          tone: positive
