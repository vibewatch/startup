      - number: '1.3'
        title: Capitalization History, Milestones, and Platform Scale
        blocks:
          - type: paragraph
            body: >-
              PostHog's institutional financing path began with a $3.025M seed round in April 2020, followed by a $9M
              Series A led by GV in December 2020 and a $15M Series B led by Y Combinator in June 2021 CO009.
              Acceleration in organic developer adoption enabled the business to execute back-to-back major financings
              in 2025: a $70M Series D led by Stripe at a $920M valuation in June 2025, and a $75M Series E led by Peak
              XV in October 2025 valuing the company at $1.4B CO010. While commercial tracking reports cite more than
              119,000 detecting enterprise and software domains and internal telemetry notes over 500,000 teams,
              external analyst assessments highlight ongoing structural challenges, including self-hosted open-source
              scalability bottlenecks and monetization conversion discipline across a largely non-paying developer
              footprint CO011 CO012.
