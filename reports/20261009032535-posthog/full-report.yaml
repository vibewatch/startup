  - id: FM001
    title: PostHog Addressable Market Opportunity Pyramid
    type: pyramid
    summary: >-
      Hierarchical market sizing layers illustrating PostHog's progression from broader software analytics spend down to
      active monetized ARR.
    data:
      items:
        - label: Total Product & Telemetry Software Spend (Macro TAM)
          value: $15B+ Industry Spend
          note: Global software expenditure spanning product analytics, digital experience, and feature management
        - label: Developer-First Stack Consolidation (Serviceable SAM)
          value: $3B - $5B Addressable Spend
          note: Organizations prioritizing engineer-led, all-in-one developer analytics and experimentation tooling
        - label: Core High-Growth Product Engineering Market
          value: 500,000+ Registered Teams
          note: Scale of tech-forward development teams leveraging PostHog's free and self-serve tiers
        - label: Monetized Commercial ARR (Serviceable SOM)
          value: $57.5M Run-Rate ARR
          note: Estimated February 2026 ARR from commercial cloud and enterprise usage tiers
        - label: Paid Account Conversion Cohort
          value: 3% Commercial Conversion
          note: Observed share of registered teams exceeding free tier limits and converting to paid usage
        - label: Near-Term Scale Target
          value: $100M ARR Target
          note: Management's stated public operational revenue target for end-of-year 2026
    approximationNotes: >-
