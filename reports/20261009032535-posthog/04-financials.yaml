schemaVersion: "report-v2"
artifact: financials
slug: posthog
runDate: 2026-10-09
company:
  name: PostHog
chapter:
  number: 4
  title: Financials
  summary: >-
    PostHog has a legible usage-based monetization model with multiple metered
    products and low-friction self-service adoption, but the public evidence set
    does not disclose recognized revenue, gross margin, retention, cash, burn, or
    runway. Third-party ARR estimates indicate growth but are not sufficient to
    underwrite revenue quality or capital adequacy.
sections:
  - id: revenue-model
    title: Revenue model and monetizable surface
    body: >-
      PostHog's commercial model is usage-based rather than a conventional
      seat-only SaaS contract. The official site says paid products are charged
      per use with monthly free allowances, and it publishes example meters for
      events, recordings, requests, and rows. Product analytics documentation
      shows why events are the economic foundation: captured events, persons,
      and properties drive analytics and are shared with adjacent products.
      The broader suite creates several potential consumption streams from one
      technical adoption, including analytics, replay, flags, experiments, and
      error tracking. That architecture should support expansion as a customer's
      data volume and product adoption grow, but public list meters do not reveal
      realized prices, negotiated discounts, product-level revenue mix, contract
      duration, or accounting recognition. The model is therefore understandable
      while its actual revenue quality remains unverified.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-gtm
    title: Pricing, distribution, and sales-efficiency proxies
    body: >-
      The free-to-paid design removes an initial procurement hurdle and lets
      developers instrument a product before incurring a bill. That can lower
      acquisition friction, but the same evidence also identifies a conversion
      burden: PostHog's homepage uses two different free-cohort statements,
      saying both that 97% of users pay nothing and that 98% of customers use
      PostHog for free. Those denominators are not interchangeable, and neither
      discloses conversion, expansion, or retention. A company-published customer
      story offers a useful value-realization proxy: Puzzle used PostHog data to
      diagnose activation friction and changed onboarding to reduce time to
      value. It does not establish PostHog's CAC or payback. The best independent
      caution in the pool is Built In's AI-generated synthesis, which frames the
      challenge as converting broad free adoption into monetization; its weak
      provenance makes it a diligence lead, not a verified performance metric.
    claimRefs: [CI001, CI005, CI006, CI010]
    tableRefs: [TI002]
  - id: traction-efficiency-and-capital
    title: Public traction, operating efficiency, and capital
    body: >-
      Public financial traction is dominated by third-party ARR reporting rather
      than filings or management accounts. FounderVentures reports $57.5 million
      of ARR in February 2026 and 99% year-over-year growth, while Built In repeats
      a $9.5 million 2024 ARR figure and 138% growth from an LLM-generated
      candidate-information page. The periods differ and neither source supplies
      an audited bridge to recognized revenue, so the figures should not be
      blended into a growth series. FounderVentures also reports roughly 200
      employees and $287,000 of ARR per employee; Tracxn reports 224 employees
      "as of Aug 26" without an explicit year in the fetched text. On financing,
      Tracxn reports $194 million raised, and Tracxn plus UpMarket report a $75
      million Series E at a $1.4 billion post-money valuation in September 2025.
      Funding raised is not cash available, and no source supplies current cash,
      burn, debt, or runway.
    claimRefs: [CI007, CI008, CI009, CI011, CI012, CI013, CI014, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The financial case is promising but not presently underwriteable from
      public data. Usage meters provide a plausible path from developer adoption
      to recurring consumption, and the multi-product suite can increase the
      number of billable workloads inside an account. However, the public sources
      do not reveal cloud gross margin, infrastructure cost per unit, support
      burden, net revenue retention, free-to-paid conversion, discounting, or
      customer concentration. They also do not disclose cash on hand, operating
      cash burn, committed debt, or the portion of historical funding still
      available. Secondary-market access is not a financing substitute: UpMarket
      and EquityZen describe transactions in which investors buy shares from
      existing holders rather than newly issued company shares. Investment
      diligence should therefore center on a monthly revenue-and-margin cohort
      pack, cash and obligations schedule, and a board-approved operating plan
      before assigning confidence to margin expansion or runway.
    claimRefs: [CI003, CI004, CI009, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and economic mechanism
    columns:
      - Stream
      - Mechanism
      - Billing unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - ["Product analytics", "Customers capture and analyze behavioral events", "Events", "Officially listed as usage-metered", "Recurring consumption is plausible; realized revenue is undisclosed", "Revenue, gross margin, and retention by event-volume cohort"]
      - ["Session replay", "Customers record and inspect user sessions", "Recordings", "Officially listed as usage-metered", "Volume-linked, with storage and compute cost exposure", "Net revenue and delivery cost per recording tier"]
      - ["Feature flags", "Customers evaluate flags during software delivery", "Requests", "Officially listed as usage-metered", "Potentially recurring with application traffic", "Paid request volume, attach rate, and infrastructure cost"]
      - ["Warehouse and data movement", "Customers ingest or query business-data rows", "Rows", "Officially listed as usage-metered", "Consumption can expand but unit margin is unknown", "Revenue and cloud cost by row-volume tier"]
      - ["Adjacent product suite", "Analytics data supports experiments, replay, errors, and related tools", "Product-specific usage", "Multiple products are publicly offered", "Cross-sell potential is visible; product revenue mix is not", "Attach, expansion, churn, and gross margin by product"]
    notes: >-
      Official surfaces establish product scope and list-meter mechanisms only;
      realized pricing, discounts, revenue mix, recognition, and margins are not public.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Published usage-pricing examples
    columns:
      - Meter
      - Monthly free allowance
      - Published list rate
      - List versus realized
      - Underwriting implication
    rows:
      - ["Events", "1 million", "$0.00005 per event", "Official list example; realized price unknown", "Event growth can expand billing, subject to tiering and discounts"]
      - ["Recordings", "5,000", "$0.005 per recording", "Official list example; realized price unknown", "Replay revenue carries unquantified storage and compute costs"]
      - ["Requests", "1 million", "$0.0001 per request", "Official list example; realized price unknown", "Flag traffic can create recurring usage but no attach rate is disclosed"]
      - ["Rows", "1 million", "$0.000015 per row", "Official list example; realized price unknown", "Data volume can monetize while cloud unit cost remains a gap"]
    notes: >-
      Rates are examples copied from the official homepage as of 2026-10-09;
      they are not contracts, realized average selling prices, revenue, or margin.
    claimRefs: [CI001, CI002]
  - id: TI003
    title: Public financial metrics and underwriting gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR", "$57.5M in February 2026, third-party reported", "Low", "Potential recurring-revenue scale, but not accounting revenue", "Monthly ARR bridge to recognized revenue and invoices"]
      - ["ARR growth", "99% year over year in February 2026, third-party reported", "Low", "Indicates momentum if definition and period are valid", "Cohort bridge separating new, expansion, contraction, and churn"]
      - ["Earlier ARR signal", "$9.5M in 2024 with 138% growth, repeated by an AI-generated page", "Low", "Shows source inconsistency and weak provenance", "Management-certified historical ARR schedule with definitions"]
      - ["ARR per employee", "Approximately $287K, third-party calculated", "Low", "Rough operating-efficiency proxy only", "Departmental headcount and fully loaded expense plan"]
      - ["Recognized revenue", null, "Unavailable", "ARR cannot substitute for GAAP or statutory revenue", "Monthly recognized revenue by product and geography"]
      - ["Gross margin", null, "Unavailable", "Core test of cloud and replay delivery economics", "Revenue, hosting, support, and third-party cost by product"]
      - ["CAC and payback", null, "Unavailable", "Required to test self-serve acquisition efficiency", "Blended and channel-specific CAC, payback, and sales-cycle data"]
      - ["Cash, burn, and runway", null, "Unavailable", "Funding raised does not establish current liquidity", "Bank cash, monthly burn, debt schedule, commitments, and downside runway"]
    notes: >-
      ARR, growth, headcount, and efficiency values are unverified third-party
      reports; null means the assigned public evidence did not disclose the metric.
    claimRefs: [CI007, CI008, CI009, CI011, CI012, CI016]
figures:
  - id: FI001
    title: Usage-to-gross-profit evidence bridge
    type: flow
    summary: >-
      Public evidence explains the usage and billing steps, while realized revenue,
      delivery cost, and gross profit remain private diligence inputs.
    data:
      nodes:
        - id: usage
          label: Customer activity
          detail: Events, recordings, requests, and rows enter PostHog products.
        - id: free-tier
          label: Monthly free allowance
          detail: Each published usage example includes a no-charge allowance.
        - id: paid-usage
          label: Metered paid usage
          detail: Usage above free allowances is eligible for published per-unit rates.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Not disclosed; list billing does not establish accounting revenue.
        - id: delivery-cost
          label: Delivery cost
          detail: Hosting, storage, compute, and support cost per unit are not disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Not calculable without realized revenue and delivery-cost evidence.
      edges:
        - from: usage
          to: free-tier
          label: Enters allowance
        - from: free-tier
          to: paid-usage
          label: Excess usage
        - from: paid-usage
          to: recognized-revenue
          label: Billing and recognition
        - from: recognized-revenue
          to: delivery-cost
          label: Less service costs
        - from: delivery-cost
          to: gross-profit
          label: Produces gross profit
    approximationNotes: >-
      This is a mechanism map, not a forecast; the final three financial stages
      are explicitly unavailable in the assigned public evidence.
    claimRefs: [CI001, CI002, CI003, CI016]
callouts:
  - calloutType: insight
    title: Legible pricing is not legible revenue
    body: >-
      Published meters explain how a bill can form, but without realized rates,
      discounts, usage cohorts, and recognition policies they do not establish
      revenue scale or quality.
    claimRefs: [CI001, CI002, CI016]
  - calloutType: risk
    title: Capital adequacy remains unproven
    body: >-
      Reported funding and valuation establish access to historical capital, not
      current cash availability, burn, debt capacity, or runway.
    claimRefs: [CI013, CI014, CI015, CI016]
