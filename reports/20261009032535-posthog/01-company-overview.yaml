chapter:
  number: 1
  title: "Company Overview"
  summary: "PostHog operates an open-source product engineering and developer analytics platform founded in 2020 by James Hawkins and Tim Glaser. The company has raised approximately $194M to date, most recently commanding a $1.4B valuation in its October 2025 Series E round while pivoting toward automated context layers and self-driving developer tools."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Business Model"
    body: "PostHog, Inc. was incorporated following its January 23, 2020 founding by James Hawkins and Tim Glaser, pivoting through multiple prototypes before graduating from Y Combinator's W20 cohort CO001. Headquartered in San Francisco with a distributed remote-first organizational structure, PostHog operates as a developer-oriented product operating system combining event-based product analytics, session replay, feature flags, experimentation, customer data infrastructure, and AI observability CO002. Rather than relying on traditional top-down enterprise software sales forces, PostHog utilizes an inbound, product-led growth model pairing transparent usage-based utility pricing with a generous free tier CO003. This pricing structure offers standard monthly allowances across its paid products, resulting in roughly 97% to 98% of active accounts paying zero dollars while creating low-friction adoption funnels across technical teams CO004."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-and-governance"
    title: "Leadership Structure, Governance, and Key Personnel"
    body: "The company's strategic and technological direction remains guided by its original co-founders: Co-CEO James Hawkins, who leads product vision and commercial strategy, and CTO Tim Glaser, who architects core ingestion and ClickHouse analytics infrastructure CO005. PostHog enforces a culture of high engineer autonomy, operating modular product development squads structured as internal mini-startups supported by specialized executive leadership CO006. Fraser Hopper manages legal, finance, and operational compliance, while functional leadership across data warehousing, engineering management, and product analytics coordinates platform execution CO007. Co-founders retain board majority control, deliberately mitigating hostile corporate governance dynamics while allowing management to prioritize product-market fit over aggressive premature enterprise sales expansion CO008."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-milestones"
    title: "Capitalization History, Milestones, and Platform Scale"
    body: "PostHog's institutional financing path began with a $3.025M seed round in April 2020, followed by a $9M Series A led by GV in December 2020 and a $15M Series B led by Y Combinator in June 2021 CO009. Acceleration in organic developer adoption enabled the business to execute back-to-back major financings in 2025: a $70M Series D led by Stripe at a $920M valuation in June 2025, and a $75M Series E led by Peak XV in October 2025 valuing the company at $1.4B CO010. While commercial tracking reports cite more than 119,000 detecting enterprise and software domains and internal telemetry notes over 500,000 teams, external analyst assessments highlight ongoing structural challenges, including self-hosted open-source scalability bottlenecks and monetization conversion discipline across a largely non-paying developer footprint CO011 CO012."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
