chapter:
  number: 6
  title: "Customers"
  summary: "PostHog reports broad team adoption and rising use of its AI-assisted workflows, while its product design supports expansion from event analytics into replay, flags, experiments, and connected business data. The assigned public evidence does not establish retention, paid conversion, customer concentration, contract durability, or verified outcomes for named deployments."
sections:
  - id: "customer-segments"
    title: "Customer segments and buying motion"
    body: "The evidence supports a bottom-up, technically led customer profile rather than a quantified revenue segmentation. GrowthBook describes PostHog's breadth as attractive when a small engineering team wants one vendor and one event stream, while PostHog positions the product as a shared context layer for analytics, errors, replays, and business data [CU008, CU002]. Product and growth users can analyze adoption, conversion, and retention, while B2B teams can model companies as groups [CU003, CU010]. These workflows identify plausible users and champions, but the assigned sources do not disclose payer roles, segment revenue, average contract value, or the share of customers in each segment."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU008"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "adoption-signals"
    title: "Adoption signals and their limits"
    body: "PostHog's homepage says more than 500,000 teams ship with the platform, but it does not define active, paying, or production use [CU001]. A July 2026 company disclosure relayed by Remio adds three workflow-volume signals: 3.5 million MCP tool calls in one week, nearly 100,000 AI chats, and AI involvement in 40 percent of experiments created during that period [CU005, CU006, CU007]. These figures indicate product interaction, not retention or revenue. They lack unique-user, customer-account, repeat-use, and paid-cohort denominators, so they should not be converted into customer counts or commercial growth rates."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "customer-proof"
    title: "Customer proof is broad but shallow"
    body: "The official customer directory shows multiple described organizations using combinations of Product Analytics, Session Replay, Feature Flags, Experiments, Surveys, and Error Tracking [CU004]. In the retained fetched text, however, the company-name cells are blank while descriptive labels remain, and no selected row supplies deployment dates, pilot-versus-production status, quantified outcomes, contract terms, or renewal evidence [CU012]. The table therefore preserves three representative rows without inventing customer identities. GrowthBook independently supports the broader fit with small engineering teams, but as a competitor comparison it does not validate any specific PostHog deployment [CU008]."
    claimRefs:
      - "CU004"
      - "CU008"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "durability-and-expansion"
    title: "Durability, expansion, and concentration"
    body: "PostHog has a credible product-level expansion mechanism because the same events, persons, and properties can connect analytics with session replays, feature flags, and experiments [CU011]. Independent commentary also frames billing and CRM joins as the route from product behavior to renewals and expansion analysis [CU015]. The counterweight is suite concentration: GrowthBook warns that product breadth, event growth, and a single-vendor data model can become constraints at scale [CU009]. No assigned source discloses NRR, GRR, logo churn, renewal terms, contract length, product attach rates, channel dependence, or customer concentration [CU013]. Those omissions prevent a defensible durability conclusion."
    claimRefs:
      - "CU009"
      - "CU011"
      - "CU013"
      - "CU015"
    figureRefs:
      - "FU001"
