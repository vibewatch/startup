company:
  name: "PostHog"
chapter:
  number: 7
  title: "Risks"
  summary: "PostHog's strongest documented control evidence is a current SOC 2 Type 2 examination, but that report also leaves AWS subservice controls and customer-side controls outside the audit scope and records one onboarding-training exception. The most consequential investment risks are therefore dependency concentration, unsupported self-hosting at scale, a free-heavy usage model with undisclosed economics, and insufficient independent evidence on incidents, legal exposure, customer concentration, and AI production performance."
sections:
  - id: "risk-priorities-and-thesis-breaks"
    title: "Risk priorities and thesis-break conditions"
    body: >-
      The evidence supports a high-impact but incompletely quantified risk profile rather than a record of
      demonstrated systemic failure. The independent service auditor concluded that PostHog's stated controls
      were suitably designed and operated effectively for June 1, 2025 through May 31, 2026, subject to the
      assumed operation of cloud-provider and customer controls. That qualification matters because PostHog
      processes behavioral, replay, error, log, and business data, while the assigned evidence does not establish
      current breach frequency, outage history, legal claims, gross margin, cash burn, or revenue concentration.
      The thesis should break if primary diligence shows material unreported incidents, failed recovery testing,
      structurally negative contribution margin for the free cohort, or dependence on a small paying-customer
      group without credible retention evidence.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR010"
      - "CR011"
    figureRefs:
      - "FR001"
  - id: "legal-privacy-and-control-scope"
    title: "Legal, privacy, and control-scope risk"
    body: >-
      The SOC 2 report is meaningful mitigation evidence, not a blanket certification of every regulatory,
      privacy, or operational claim. Its scope covers Security, Availability, and Confidentiality for the stated
      twelve-month period; it does not establish compliance with every privacy regime, resolve litigation or
      enforcement status, or test the actual controls at the cloud subservice organization and user entities.
      The report records one delayed security-awareness completion among 13 sampled new hires and onboarded
      contractors. Management describes automated reminders and escalation as remediation, but the auditor
      expressly says management responses to exceptions were outside its examination. Management also says it
      identified no qualifying system incident during the period; that bounded statement should not be read as
      proof that no security or availability event occurred.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR001"
  - id: "operational-product-and-ai-risk"
    title: "Operational, product, and AI execution risk"
    body: >-
      PostHog's operating surface spans analytics, replay, error tracking, logs, feature delivery, data
      infrastructure, support, workflows, and AI. Breadth can increase product attach, but it also expands the
      number of systems whose reliability and data semantics must remain coherent. The company repository says
      the open-source hobby deployment should scale to approximately 100,000 events per month, recommends
      PostHog Cloud above that level, and offers no support or guarantees for open-source deployments. Product
      analytics also depends on the events, persons, and properties supplied by customers, leaving instrumentation
      quality as a shared operational risk. Separately, the Jeeves research repository reports benchmark
      weaknesses versus Jev; without production adoption and validation evidence, it is a developer signal rather
      than proof about PostHog's commercial AI reliability.
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR011"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "dependencies-and-business-model-risk"
    title: "Dependency, customer-proof, and business-model risk"
    body: >-
      AWS is a material dependency because the SOC 2 description identifies it as the cloud host and relies on
      AWS for physical infrastructure controls, while the auditor did not examine AWS's actual controls. The same
      report assigns meaningful responsibilities to customers for access management, endpoint protection, and
      continuity. Commercially, PostHog says 97% of users pay nothing, but the assigned evidence supplies no
      free-to-paid conversion, contribution margin, retention, or paying-customer concentration. Public footprint
      metrics do not close that gap: TechnologyChecker counts detected domains and warns that one detection may
      represent only one storefront, while Apps Run The World presents 1,153 database entries. Those denominators
      are not equivalent to active paying customers or revenue concentration, so the residual financial exposure
      remains material and unquantified.
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR006"
      - "CR010"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
