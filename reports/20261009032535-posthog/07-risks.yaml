      missingEvidence: "Current primary evidence on litigation, enforcement, regulator correspondence, licenses, DPAs, subprocessors, and cross-border data-transfer mechanisms."
      whyItMatters: "SOC 2 control assurance does not establish the absence of legal claims or compliance with every applicable privacy regime."
      diligencePath: "Obtain a counsel-prepared legal schedule, regulator correspondence, current DPA and subprocessor list, and jurisdiction-by-jurisdiction privacy analysis."
