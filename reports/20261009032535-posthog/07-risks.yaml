      topic: "independent-incident-history"
      missingEvidence: "Independent breach, outage, uptime, incident-severity, and recovery evidence through October 9, 2026."
      whyItMatters: "A management statement about incidents identified during the audit period does not prove the absence of all incidents or establish current reliability."
      diligencePath: "Review status history, incident postmortems, cyber-insurance claims, customer notices, penetration-test summaries, and measured SLO performance."
      relatedQuestionRefs:
