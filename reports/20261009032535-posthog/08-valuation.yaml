    title: "Monetization Asymmetry and Enterprise Scalability Risk"
    body: "PostHog's deliberate strategy of maintaining 97% to 98% of users on free plans creates an ongoing vulnerability: the business must cross-subsidize massive event ingestion costs through a very narrow tier of paid accounts, while facing scalability skepticism from traditional enterprise buyers."
