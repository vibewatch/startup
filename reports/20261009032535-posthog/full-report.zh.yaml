      - number: '4.2'
        title: 定价、分发与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              免费转付费设计消除了初始采购障碍，让开发者可以先给产品埋点再产生账单，这可能降低获客摩擦。但同一证据也显示转化负担：PostHog 首页用了两种不同的免费用户口径，既称 97% 的用户不付费，也称 98%
              的客户免费使用。两者分母不可互换，且都没有披露转化、扩张或留存。一则公司发布的客户故事提供了价值实现代理：Puzzle 用 PostHog 数据诊断激活摩擦并调整入门流程，缩短价值实现时间，但不能证明
              PostHog 的 CAC 或回收期。资料中最好的独立警示来自 Built In 的 AI 生成汇总，它把挑战概括为把广泛免费采用转化为收入；由于来源薄弱，只能作为尽调线索，不能作为已验证的业绩指标。
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
      - number: '4.3'
        title: 公开牵引力、运营效率与资本
        blocks:
          - type: paragraph
            body: >-
              公开财务牵引力主要来自第三方 ARR 报告，而非申报文件或管理层账目。FounderVentures 报告 2026 年 2 月 ARR 为 $57.5 million、同比增长 99%；Built In
              则从一页 LLM 生成的候选信息中重复 $9.5 million 的 2024 年 ARR 和 138%
              增长。两者期间不同，且都没有提供与确认收入相衔接的审计桥接，因此不能混成增长序列。FounderVentures 还报告约 200 名员工、每名员工 ARR 为 $287,000；Tracxn 报告“截至 Aug
              26”有 224 名员工，但抓取文本未明确年份。融资方面，Tracxn 报告累计融资 $194 million；Tracxn 和 UpMarket 报告 2025 年 9 月完成 $75 million E
              轮，投后估值 $1.4 billion。已募集资金不等于可用现金，来源也没有提供当前现金、消耗、债务或现金跑道。
            claimRefs:
