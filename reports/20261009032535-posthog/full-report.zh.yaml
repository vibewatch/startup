        - 审查 AWS 鉴证报告、桥接函、渗透测试结果和客户责任矩阵
      - - 安全意识培训入职
        - 全公司人员控制 CC1.4.2
        - 抽样的 13 名新员工和承包商中有 1 人延迟完成培训
        - 审计样本中观察到的例外
        - 中等；流程疏漏可能削弱人员层控制
        - 管理层报告称会在第 5、8、10 和 14 天自动提醒并升级
        - 审计师的审查未覆盖补救响应
        - 获取期后完成记录，并测试 2026 年 5 月 31 日后升级机制是否运行
      - - 隐私、诉讼、许可与执法状态
