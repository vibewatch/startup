      - CV004
      - CV005
      - CV008
      - CV011
  - id: TV003
    title: 三年估值情景与敏感性矩阵
    columns:
      - 情景
      - 核心运营假设
      - 退出 / 倍数依据
      - 隐含估值
      - 下行 / 上行触发因素
    rows:
      - - 乐观情景
        - 到 2027 年 ARR 增长至 $100M+；NRR 超过 125%；多产品采用将付费基础扩大至 5% 以上
        - 高增长 SaaS 和 AI 可观测性领导地位推动 NTM ARR 倍数达到 25x
        - $2,500M
        - Max AI 变现成功，企业广泛迁移至云端
      - - 基准情景
        - ARR 达到 $45M-$55M；NRR 稳定在 105%-110%；使用量扩张仍由开发者主导
        - 18x NTM ARR 倍数，与高端私有开发者工具可比公司一致
        - $900M
        - 中型市场团队稳步扩张，但替代 Fortune 500 现有方案的速度缓慢
      - - 悲观情景
        - ARR 停留在 $20M-$25M；高吞吐量扩展瓶颈加速企业客户流失
        - 在科技行业估值倍数压缩、增长放缓的情况下，NTM ARR 倍数为 12x
        - $300M
        - 下轮融资降价、关键客户转向 Datadog/Amplitude，或云端利润率承压
    notes: 情景估值采用与公开及私有开发者软件基准一致的收入倍数，模拟 3 年结果。
