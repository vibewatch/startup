        - 在生产范围确定前为低
        - 早期：已披露公开基准和测试工具
        - 如果实验性工作进入关键工作流，存在模型质量和基础设施成本风险
        - 生产使用、外部评估、延迟 SLO 和回退行为
    notes: 可能性和严重性是与引用范围绑定的定性分析师判断，不是测量所得的概率。不能根据缺少不利搜索结果推断没有事故。
