  - id: TV002
    title: 投资正反论点对比
    columns:
      - 支柱
      - 核心正论点
      - 反论点风险
      - 证伪 / 触发指标
    rows:
      - - 产品迭代速度与广度
        - 统一的 10+ 产品套件减少工具割裂，并整合分析、回放和 AI 上下文
        - 将研发分散到 14 个产品上，可能导致功能深度不及专业的企业级领先产品
        - 相对专业分析或会话回放竞争对手的企业客户赢单率
      - - 市场进入模式
        - 自助式产品驱动增长实现 5 天 CAC 回收，并广泛吸引开发者采用
        - 97% 到 98% 的用户付费为零，使企业变现高度依赖极少数客户
        - 付费层转化率跌破活跃团队总数的 2%
      - - 企业基础设施
        - 开源核心结合托管云数据仓库，让开发者既能掌控系统，又能享受云端便利
        - 单机部署受事件量限制，大规模部署会给企业客户带来阻力
        - 月事件量超过 100M 的账户出现客户流失或架构迁移
      - - 资本与支持
        - 从 Stripe、GV 和 Peak XV 等 Tier-1 投资者处融资超过 $169M 至 $182M，提供充足资金续航
        - 接连以 $920M 和 $1.4B 完成快速融资，抬高清算门槛并加剧对下轮融资的敏感度
        - 若没有苛刻的优先权结构，无法以不低于 $1.4B 的估值继续募集股权资本
    notes: 对比评估产品驱动平台的迭代速度与企业扩展性、变现阻力之间的权衡。
    claimRefs:
