      - number: '4.4'
        title: 财务结论与投资评估阻碍
        blocks:
          - type: paragraph
            body: >-
              财务案例有吸引力，但目前无法仅凭公开数据完成投资评估。用量计量器提供了从开发者采用走向经常性消费的合理路径，多产品套件也能增加账户内可计费工作负载。然而，公开来源没有披露云业务毛利率、单位基础设施成本、支持负担、净收入留存、免费转付费转化、折扣或客户集中度；也没有披露现金余额、经营现金消耗、承诺债务或历史融资的剩余可用部分。二级市场交易不是融资替代品：UpMarket
              和 EquityZen 描述的是投资者向现有持有人买股，而非公司新发股份。因而，在对毛利率扩张或现金跑道赋予信心前，尽调应聚焦月度收入与利润率队列包、现金及义务明细，以及董事会批准的经营计划。
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI015
              - CI016
