  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 构建于共享上下文之上的广泛产品栈
        blocks:
          - type: paragraph
            body: >-
              PostHog 将自己描述为上下文层，为人和代理存储可查询、可操作的分析、错误、回放和业务数据。文档称事件、用户和属性与会话回放、功能开关和实验共享。实践者及评测来源还将调查、错误追踪、仓库与管道功能、AI
              可观测性纳入更宽的套件。实际价值在于工作流连续性：技术团队无需在不同工具中重建身份和受众定义，就能分析行为、检查用户上下文并控制发布。这一产品设计主张可信，但来源没有独立衡量节省时间、分析准确性或整合经济性。广度支持技术团队用例，也扩大了需要治理的实施面。
