      - number: '8.2'
        title: 建议框架与当前融资背景
        blocks:
          - type: paragraph
            body: >-
              PostHog 私募市场估值从 Stripe 领投的 2025 年 6 月 $920M D 轮，迅速升至 Peak XV Partners 领投的 2025 年 9 月 $1.4B E 轮；这一变化得到截至
              2026 年中的二级市场估值印证。管理层称增长达到三位数，ARR 达数千万美元，并曾接近现金流盈亏平衡；但第三方收入追踪模型估计年化收入约为 $13.4M 至 $25M。按 $1.4B 估值，PostHog
              对应很高的两位数或三位数收入倍数，要求执行近乎无误且超高速增长尚未验证。由于私募申报、净收入留存和资本优先权结构未披露，我们将 PostHog
              评为需继续研究，给予高风险评级；在获得经验证的财务指标前，估值立场为昂贵。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
