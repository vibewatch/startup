        title: 领导架构、治理与关键人员
        blocks:
          - type: paragraph
            body: >-
              公司战略和技术方向仍由两位创始人主导：联合 CEO James Hawkins 负责产品愿景和商业战略，CTO Tim Glaser 负责核心数据摄取及 ClickHouse 分析基础设施架构
              CO005。PostHog 强调工程师高度自主，以内部小型初创公司的方式组建模块化产品团队，并由专业管理层支持 CO006。Fraser Hopper
              负责法律、财务和运营合规；数据仓库、工程管理和产品分析等职能负责人协同推进平台执行
              CO007。联合创始人保有董事会多数控制权，有意降低敌意公司治理风险，同时让管理层优先追求产品市场契合，而不是过早激进扩张企业销售 CO008。
            claimRefs:
