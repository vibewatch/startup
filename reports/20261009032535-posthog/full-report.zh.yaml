      - number: '8.3'
        title: 情景分析、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们的情景框架在 3 至 5 年投资期限内模拟三条不同的运营路径。乐观情景下，多产品模块快速交叉销售，将 ARR 推向管理层的 $100M 目标，上市时可支撑 $2.5B+
              企业估值。基准情景下，稳定的自然扩张带来 $40M 至 $50M ARR，按当前市场倍数对应 $800M 至 $1.0B 的公允价值二级市场估值。悲观情景下，老牌平台竞争激烈、企业基础设施扩展受限，倍数压缩至
              $400M，引发下轮融资风险。完成尽调需要审计披露云托管毛利、队列留存画像和清算优先权条款。
