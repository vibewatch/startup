              AWS 是重要依赖，因为 SOC 2 描述将其列为云主机，并依赖 AWS 提供物理基础设施控制；审计师没有检查 AWS
              的实际控制。同一报告把访问管理、端点保护和业务连续性等重要责任交给客户。商业上，PostHog 称 97%
              的用户不付费，但资料没有提供免费转付费转化、贡献利润、留存或付费客户集中度。公开覆盖指标也无法填补缺口：TechnologyChecker 统计检测到的域名并警告一次检测可能只代表一家店铺，Apps Run
              The World 则列出 1,153 条数据库记录。这些分母不等于活跃付费客户或收入集中度，剩余财务风险仍重大且未量化。
