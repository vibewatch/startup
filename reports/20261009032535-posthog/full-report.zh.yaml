chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              PostHog, Inc. 在 James Hawkins 和 Tim Glaser 于 2020 年 1 月 23 日创办后完成注册，期间经历多次原型迭代，最终从 Y Combinator W20 批次
              CO001 毕业。公司总部位于旧金山，采用分布式远程优先组织结构；PostHog 是面向开发者的产品操作系统，整合事件型产品分析、会话回放、功能开关、实验、客户数据基础设施和 AI 可观测性
              CO002。PostHog 不依赖传统自上而下的企业软件销售队伍，而是用入站、产品驱动增长模式，将透明的按用量效用定价与宽松免费层结合 CO003。该定价结构为付费产品提供标准月度额度，使约 97% 至 98%
              的活跃账户无需付费，同时在技术团队中形成低摩擦的采用漏斗 CO004。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
