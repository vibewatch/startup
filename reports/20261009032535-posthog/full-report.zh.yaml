  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              PostHog
              已成为开发者优先的重要平台，在统一数据层下整合产品分析、会话回放、功能开关、实验和数据仓库。看多论点是，开发者采用将转化为持久的企业支出，低摩擦入门让公司占据企业工具采购上游的主导位置。但反论点指出结构性变现障碍：宽松免费层下
              97% 至 98% 的用户不付费，转化摩擦仍然严重。此外，竞争工具在大规模企业事件摄取上保持更高可靠性；除非 PostHog 证明企业级基础设施能处理高吞吐工作负载且不损害利润率，否则其定价能力受限。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
