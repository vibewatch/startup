        - Unknown；来源池没有独立事故序列
        - 高
        - 已记录：六小时 RTO 和 RPO、备份、故障切换、监控及年度恢复测试
        - AWS 控制未纳入审计师审查，因此暴露较大
        - 独立正常运行时间历史、恢复测试结果、区域架构和实际 MTTR
      - - 开源部署超出所述爱好者规模
        - 当自托管工作负载实质超过每月约 100,000 个事件时，可能性高
        - 中
        - 有限：公司建议迁移到 PostHog Cloud
        - 对必须自托管的客户而言存在迁移、支持和锁定风险
        - 企业级自托管容量测试及迁移 / 流失结果
      - - 客户埋点错误或不完整
