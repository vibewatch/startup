          label: 确认收入
          detail: 未披露；价目表计费不能证明会计收入。
        - id: delivery-cost
          label: 交付成本
          detail: 每单位的托管、存储、计算和支持成本未披露。
        - id: gross-profit
          label: 毛利
          detail: 没有实际收入和交付成本证据，无法计算。
      edges:
        - from: usage
          to: free-tier
          label: 进入额度
        - from: free-tier
          to: paid-usage
          label: 超额使用
        - from: paid-usage
          to: recognized-revenue
          label: 计费与确认
        - from: recognized-revenue
          to: delivery-cost
          label: 扣除服务成本
        - from: delivery-cost
          to: gross-profit
          label: 产生毛利
    approximationNotes: 这是机制图，不是预测；最后三个财务阶段在指定公开证据中明确不可得。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI016
  - id: FE001
    title: 有文档记录的 PostHog 云架构栈
    type: stack
    summary: 基于来源范围，展示已命名的采集、处理、存储和查询层。
    data:
      layers:
        - label: 客户端应用和 SDK
          detail: 事件、录制和功能标记请求的来源
          items:
            - Web、移动端和服务器 SDK
        - label: Rust 采集服务
          detail: 捕获、功能标记评估和回放采集
          items:
            - 捕获服务
            - 功能开关服务
            - 回放捕获
        - label: 流式与 CDP 处理
          detail: 以 Kafka 为中心的数据流转和 Node.js CDP 处理
          items:
            - Kafka 或 WarpStream
            - CDP 工作进程
            - 导出目标
        - label: 持久化数据存储
          detail: 分析、关系、缓存和 blob 数据
          items:
            - ClickHouse
            - Aurora PostgreSQL
            - Redis 或 Valkey
            - S3 blob 存储
        - label: 应用与工作流服务
          detail: 用户 / API 访问和异步工作
          items:
            - Django Web 应用和 API
            - Celery
            - Temporal
            - Dagster
        - label: 查询与操作界面
          detail: 通过 Web、API 和 MCP 接口进行产品分析
          items:
            - PostHog Web
            - API
            - MCP 客户端
    approximationNotes: 对已命名官方组件的逻辑重述；排序不代表实测延迟、容量、冗余或服务级别承诺。
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE015
  - id: FU001
    title: 有证据支持的客户旅程与扩张闭环
    type: journey-map
    summary: 有证据支持的路径从技术团队需求出发，经过共享埋点和多产品工作流，但商业持久性仍未经验证。
    data:
      items:
        - label: 需求
          description: 小型工程团队希望用一个供应商和一条事件流支撑多个产品工作流。
          touchpoints:
            - 工程评估
            - 一体化套件对比
        - label: 埋点
          description: 事件、用户和属性构成共享分析基础。
          touchpoints:
            - 自定义事件
            - 自动捕获
            - 身份
        - label: 分析
          description: 团队分析采用、转化、漏斗、路径、粘性和留存。
          touchpoints:
            - 洞察
            - 仪表盘
            - 告警
        - label: 诊断
          description: 同一上下文将分析变化与会话回放和错误关联起来。
          touchpoints:
            - 会话回放
            - 错误上下文
        - label: 测试
          description: 功能标记和实验为受控产品变更提供相邻工作流。
          touchpoints:
            - 功能标记
            - 实验
        - label: 扩展或重新评估
          description: 团队可以接入业务数据和其他模块，但可能重新评估产品广度、事件增长和供应商集中度。
          touchpoints:
            - 计费或 CRM 上下文
            - 其他模块
            - 套件集中度审查
    approximationNotes: 这是定性机制图，不是实测漏斗。指定证据中没有阶段转化率、耗时、收入归因或留存率。
    claimRefs:
      - CU002
      - CU003
      - CU009
      - CU011
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 六项重点风险的定性影响、有证据支持的可能性信号、缓解成熟度和剩余暴露。
    data:
      columns:
        - label: 影响
          detail: 风险发生后的投资后果。
        - label: 可能性证据
          detail: 观察到的信号或明确的证据缺口；不是数值概率。
        - label: 缓解成熟度
          detail: 指定来源记录的缓解措施强度。
        - label: 剩余严重性
          detail: 纳入已记录缓解措施和范围限制后的分析师判断。
      rows:
        - label: AWS / 子服务依赖
          note: 审计员排除了云主机的实际控制措施。
          values:
            - label: 高
              tone: high
            - label: Unknown
              tone: medium
              detail: 指定证据池中没有独立的事故系列。
            - label: 中高
              tone: medium
              detail: 已记录恢复目标、备份和监控。
            - label: 高
              tone: high
        - label: 隐私与法律暴露
          note: SOC 2 无法证明每项监管或诉讼状态。
          values:
            - label: 高
              tone: high
            - label: Unknown
              tone: medium
            - label: 中
              tone: medium
              detail: 经审计的安全控制只能缓解部分法律风险。
            - label: 高
              tone: high
        - label: 免费用户经济性
          note: 97% 这一指标针对用户，而非收入或成本。
          values:
            - label: 高
              tone: high
            - label: 重要信号
              tone: medium
              detail: 公司报告称 97% 的用户不付费。
            - label: 可见性低
              tone: high
              detail: 证据池中没有转化率或单位经济数据。
            - label: 高
              tone: high
        - label: 开源扩展与支持
          note: 公司指引适用于兴趣项目部署。
          values:
            - label: 中
              tone: medium
            - label: 超过所述兴趣项目规模后为高
              tone: high
            - label: 中
              tone: medium
              detail: 已记录的路径是迁移至托管云。
            - label: 中
              tone: medium
        - label: 埋点质量
          note: 分析质量取决于客户提供的事件和身份数据。
          values:
            - label: 中
              tone: medium
            - label: 共享控制风险
              tone: medium
            - label: 中
              tone: medium
              detail: 有文档记录，但没有实测 QA 结果。
            - label: 中
              tone: medium
        - label: AI 模型性能
          note: 所引基准来自实验性代码库，不是生产产品审计。
          values:
            - label: 中低
              tone: medium
            - label: 观察到的基准弱点
              tone: medium
            - label: 早期
              tone: high
              detail: 存在公开测试，但没有外部生产验证。
            - label: 若为生产关键则为中
              tone: medium
    approximationNotes: 定性类别是分析师判断，不是实测概率。未知值仍保持未知，不根据搜索无结果进行推断。
    claimRefs:
      - CR002
      - CR007
      - CR009
      - CR010
      - CR011
      - CR016
  - id: FV001
    title: PostHog 估值与建议逻辑链
    type: flow
    summary: 展示从开发者采用和融资轮次，到估值张力及 research-more 结论的分析推演。
    data:
      nodes:
        - id: n1
          label: 开发者采用
          detail: 超过 500k 个团队和 190k 个客户账户
        - id: n2
          label: 变现不对称
          detail: 免费层下 97% 到 98% 的用户不付费
        - id: n3
          label: 企业规模上限
          detail: 竞争对手被认为更适合大规模企业部署
        - id: n4
          label: 估值升级
          detail: 2025 年从 $920M 的 D 轮升至 $1.4B 的 E 轮
        - id: n5
          label: 倍数脱节
          detail: 估计 $13.4M-$25M ARR 对应很高的估值倍数
        - id: n6
          label: 建议：research-more
          detail: 风险评级高，估值立场昂贵
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 展示推动我们估值立场的关键定量与定性权衡的逻辑决策流。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV010
      - CV014
