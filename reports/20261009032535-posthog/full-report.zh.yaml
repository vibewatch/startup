  - id: TV001
    title: 投资建议摘要
    columns:
      - 维度
      - 立场 / 评级
      - 核心驱动因素
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 开发者漏斗顶端表现突出，但收入转化未经验证，单位经济模型不透明
        - 暂缓新增增长资本；对经核实的 ARR、NRR 和客户群组开展一手尽调
      - - 信心
        - medium
        - 用户数量和融资估值有较强外部信号，但缺少经审计财务报表
        - 在争取获取私有财务数据的同时持续跟踪
      - - 风险评级
        - high
        - 97%+ 的免费用户群、企业扩展上限，以及激进的多产品路线图执行风险
        - 要求下行估值保护和严格的治理契约
      - - 估值立场
        - expensive
        - 在估计收入运行率低于 $30M 的情况下，$1.4B 估值已计入过早的企业转化
        - 若没有高于 $70M 的经认证 ARR 且毛利率超过 75%，拒绝按 $1.4B 进行一级市场定价
    notes: 建议和风险评级基于截至 2026 年评估的公开轮次、第三方二级市场估值和已披露产品采用指标。
