        - SOC 2 控制证据只覆盖部分暴露
        - 指定来源池没有监管机构、法院、当前 DPA 或法律意见来源
        - 运行由律师牵头的审查，覆盖争议、监管往来、DPA、子处理方和数据传输机制
    notes: 各行是按严重性排序的分析师评估。登记表并不完整：指定来源池包含 SOC 2 报告，但没有监管机构、法院或全面法律状态来源；unknown 表示证据不足以支持概率估计。
