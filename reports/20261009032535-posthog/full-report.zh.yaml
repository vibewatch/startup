            body: PostHog 有意让 97% 至 98% 的用户留在免费计划，形成持续脆弱点：公司必须依靠极窄的付费账户层交叉补贴巨大的事件摄取成本，同时承受传统企业买方对扩展性的质疑。
            calloutType: risk
