      - number: '1.3'
        title: 资本化历史、里程碑与平台规模
        blocks:
          - type: paragraph
            body: >-
              PostHog 的机构融资始于 2020 年 4 月的 $3.025M 种子轮，随后是 2020 年 12 月由 GV 领投的 $9M A 轮，以及 2021 年 6 月由 Y Combinator 领投的
              $15M B 轮 CO009。开发者自然采用加速后，公司在 2025 年连续完成两轮大额融资：2025 年 6 月由 Stripe 领投、估值 $920M 的 $70M D 轮，以及 2025 年 10 月由
              Peak XV 领投、估值 $1.4B 的 $75M E 轮 CO010。商业追踪报告称检测到超过 119,000 个企业和软件域名，内部遥测记录超过 500,000
              个团队；但外部分析师指出，公司仍面临自托管开源版本的扩展瓶颈，以及在大部分不付费开发者用户中提升变现转化的纪律问题 CO011 CO012。
