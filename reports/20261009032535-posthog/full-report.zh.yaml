      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 估值立场：昂贵且执行门槛高
            body: $1.4B 的 headline 估值意味着 PostHog 近期 ARR 必须非同寻常地加速。在无法核实确认收入、毛利和客户队列留存的财务报表前，投资者应避免支付独角兽价格，直到收入规模追上平台采用。
            calloutType: recommendation
