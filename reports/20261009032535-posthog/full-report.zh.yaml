  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类整合与替代性支出
        blocks:
          - type: paragraph
            body: >-
              PostHog 位于产品分析、数字体验监测、功能管理和开发者基础设施的交汇处。过去，软件公司分别购买 Mixpanel 或 Amplitude 等事件追踪工具、FullStory 或 Hotjar
              等会话录制平台，以及 LaunchDarkly 或 Optimizely 等实验平台。PostHog 的核心判断是：产品工程师和技术产品经理在调试用户旅程或上线功能时，不愿维护多家供应商合同、彼此割裂的 SDK
              和不同的数据模型。PostHog 将定量分析、行为回放和运营功能开关统一到一个平台，直接替代多个独立 SaaS 品类的支出，但不覆盖传统企业网页营销套件、商业智能仓库和重型运营应用性能监测套件。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: 可触达市场规模：自下而上的支出与分层
        blocks:
          - type: paragraph
            body: >-
              评估 PostHog 的可触达机会，需要从多个角度切入：广义产品分析市场预测、相邻的功能开关和开发者体验
              TAM，以及以开发者团队密度为基础的严谨自下而上测算。传统行业分析师将产品分析视为数十亿美元规模、年复合增速达到两位数的品类。但 PostHog
              的实际可触达市场受工程驱动组织限制，这些组织重视遥测埋点严谨性，而非营销驱动企业所需的点击式通用界面。随着数字产品扩展到每月数千万事件，PostHog
              的按用量模式可以捕捉增长；但企业采购壁垒，以及大量完全处于免费阈值内的不付费爱好者或早期账户，仍压缩了其可服务市场。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
