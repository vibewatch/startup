      - number: '5.3'
        title: 开放核心差异化伴随运营责任
        blocks:
          - type: paragraph
            body: >-
              一份 2024 年独立分析认为，开源、可定制性和用户控制是 PostHog 对工程驱动团队的核心差异化。架构和公开文档支持这一定位，但自托管并非云服务的零成本替代。一份 2026
              年独立评测称运营者需承担安全、备份、监控、升级、事故响应和恢复；计入工程时间后，云服务是多数团队的实际默认选择。该评测还称 Trust Center 声明覆盖 SOC 2 Type II，并提供
              GDPR、CCPA 和 HIPAA 指引。资料池没有审计报告或 Trust Center 原始材料，因此这些合规说法仍是二手报告而非独立审阅认证。买方应直接核实范围、例外、区域、子处理商和所需平台套餐。
            claimRefs:
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: 可靠性与成熟度证据不完整
        blocks:
          - type: paragraph
            body: >-
              指定资料池中的可靠性证据薄弱且受关系影响。直接竞争对手 Amplitude 称，PostHog 在 2025 年 9 月 29 日至 10 月 21
              日间发生的四次基础设施中断实质影响功能开关。该说法值得关注，因为功能开关可能处于生产发布路径；但竞争对比不是独立基准，资料池也没有状态历史或事故复盘佐证严重程度、持续时间或补救措施。证据质量同样不均：Built
              In 的 2026 年页面明确称主题由热门 LLM 回复生成，未经 PostHog 审阅或批准，因此扩展性表述不适合验证。本章没有获得直接变更日志、当前路线图、代码库活动、包注册表数据、SLO
              或负载基准。产品成熟度应通过运营记录和访谈检验，而非从功能广度推断。
            claimRefs:
              - CE013
              - CE016
      - number: '5.5'
        title: 展示
        blocks:
          - type: callout
            title: 产品最有力的论据是共享上下文
            body: 官方及实践者来源一致描述了一套贯穿分析、回放、功能开关、实验和其他数据面的事件与身份模型。这种整合是可信的架构差异化，但可量化的客户结果仍需买方逐一证明。
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE009
          - type: callout
            title: 生产控制证据落后于产品广度
            body: 一家竞争对手报告 2025 年有四次中断影响功能开关，但本章没有一手状态历史、事故复盘或 SLO。应把中断次数视为待核实的说法，而不是独立确认的可靠性指标。
            calloutType: risk
