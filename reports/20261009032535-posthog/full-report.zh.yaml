      - number: '5.2'
        title: 已披露的云架构与数据流
        blocks:
          - type: paragraph
            body: >-
              官方架构页给出了具体的云系统图，而非泛泛营销图。Django 承载 Web 应用和 API，Rust 服务处理事件捕获、功能开关评估及回放摄取。Kafka 是中央消息总线；Node.js CDP worker
              处理事件并可发送到外部目的地。存储包括 ClickHouse、PostgreSQL、Redis 和对象存储；Celery、Temporal 和 Dagster 分别处理短任务、可靠工作流和定时管道。PostHog
              称云应用服务运行在 AWS EKS，ClickHouse 位于自管 EC2，PostgreSQL 位于
              Aurora。披露让主要依赖清晰，但无法证明容量、延迟、恢复目标、区域故障切换或单位基础设施成本；这些仍是尽调输入，不能从组件选择推断。
