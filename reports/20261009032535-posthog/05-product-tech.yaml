chapter:
  number: 5
  title: "Product & Technology"
  summary: "PostHog presents a broad developer-oriented product stack built around shared event, identity, and business-data context. Its public architecture is unusually specific, but direct uptime evidence, security attestations, scalability benchmarks, roadmap commitments, and current developer-activity metrics are absent from the assigned evidence."
sections:
  - id: "product-scope-and-workflow"
    title: "A Broad Product Stack on Shared Context"
    body: >-
      PostHog now describes itself as a context layer that stores analytics,
      errors, replays, and business data for people and agents to query and act
      on. Its product-analytics documentation says events, persons, and
      properties are shared with session replay, feature flags, and
      experiments. Two practitioner and review sources independently describe
      a wider suite that also includes surveys, error tracking, warehouse and
      pipeline functions, and AI observability. The practical proposition is
      workflow continuity: a technical team can analyze behavior, inspect
      related user context, and control a release without rebuilding the same
      identity and audience definitions in unrelated tools. That proposition
      is credible as product design, but the assigned sources do not
      independently measure time saved, analytical accuracy, or consolidation
      economics. Breadth therefore supports a strong technical-team use case
      while increasing the implementation surface that must be governed.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE009"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-data-flow"
    title: "Documented Cloud Architecture and Data Flow"
    body: >-
      The official architecture page provides a concrete cloud-system map
      rather than a generic marketing diagram. Django serves the web
      application and API, while Rust services handle event capture, feature
      flag evaluation, and replay ingestion. Kafka is the central message bus;
      a Node.js CDP worker processes events and can deliver them to external
      destinations. The documented stores include ClickHouse, PostgreSQL,
      Redis, and blob storage, while Celery, Temporal, and Dagster divide short
      tasks, reliable workflows, and scheduled pipelines. PostHog further says
      its cloud application services run in AWS EKS, with ClickHouse on
      self-managed EC2 and PostgreSQL on Aurora. This disclosure makes the
      principal dependencies legible, but it does not establish capacity,
      latency, recovery objectives, regional failover, or unit infrastructure
      cost. Those quantities remain diligence inputs, not facts that can be
      inferred from component choice.
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "differentiation-deployment-and-trust"
    title: "Open-Core Differentiation Comes with Operating Responsibility"
    body: >-
      An independent 2024 analysis identifies open source, customization, and
      user control as central to PostHog's differentiation for engineering-led
      teams. The architecture and public documentation support that positioning,
      but self-hosting is not a costless substitute for cloud service. A 2026
      independent review says operators assume security, backups, monitoring,
      upgrades, incident response, and recovery, and describes cloud as the
      practical default for most teams once engineering time is included. The
      same review reports that PostHog's Trust Center states SOC 2 Type II
      coverage and provides GDPR, CCPA, and HIPAA guidance. Because the
      assigned pool contains neither the audit report nor the Trust Center
      artifacts themselves, those compliance statements remain secondary
      reports rather than independently reviewed certifications. Buyers should
      verify scope, exceptions, regions, subprocessors, and required platform
      packages directly.
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
  - id: "reliability-roadmap-and-evidence-quality"
    title: "Reliability and Maturity Evidence Is Incomplete"
    body: >-
      Reliability evidence in the assigned pool is thin and relationship-sensitive.
      Amplitude, a direct competitor, alleges that four PostHog infrastructure
      outages between September 29 and October 21, 2025 materially affected
      feature flags. The allegation is relevant because flags can sit in a
      production release path, but a competitor comparison is not an
      independent benchmark and the pool contains no PostHog status history or
      incident postmortem to corroborate severity, duration, or remediation.
      Evidence quality is also uneven: a 2026 Built In page explicitly says its
      themes were generated from popular LLM responses and were not reviewed or
      approved by PostHog, so its scalability language is unsuitable as
      verification. No direct changelog, current roadmap, repository activity,
      package-registry data, SLO, or load benchmark was allocated to this
      chapter. Product maturity should therefore be tested with operational
      records and reference calls rather than inferred from feature breadth.
    claimRefs:
      - "CE013"
      - "CE016"
