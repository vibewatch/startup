callouts:
  - calloutType: "risk"
    title: "Specialized Feature Deficit vs Dedicated Best-of-Breed Tools"
    body: "PostHog's strategy of delivering nine bundled tools creates exposure against point solutions that out-innovate on individual verticals. High-velocity experimentation teams often encounter statistical limitations in PostHog compared to Statsig's CUPED algorithms and automated rollbacks. Simultaneously, enterprise data science teams favor Amplitude's machine-learning cohort models and strict Lexicon/Govern data dictionaries over PostHog's permissive developer-first event logging."
    claimRefs:
      - "CP008"
      - "CP009"
      - "CP010"
  - calloutType: "insight"
    title: "Open-Core Architecture as an Antidote to Vendor Lock-In"
    body: "PostHog's MIT-licensed open-core codebase and self-hosting options serve as a critical competitive wedge in regulated markets such as healthcare and fintech. While enterprise buyers incur infrastructure and operational maintenance overhead running ClickHouse and Kafka clusters internally, the guarantee that event telemetry remains strictly within on-premise VPCs bypasses extensive vendor risk reviews that impede proprietary SaaS alternatives."
    claimRefs:
      - "CP006"
      - "CP015"
      - "CP016"

