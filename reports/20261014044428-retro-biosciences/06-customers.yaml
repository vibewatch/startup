company:
  name: "Retro Biosciences"
chapter:
  number: 6
  title: "Customers"
  summary: "Retro Biosciences is a clinical-stage biotechnology company with no commercial product sales, commercial paying customers, or recurring software-style ARR as of October 2026. Its adoption trajectory is defined by preclinical and phase-1 clinical milestones, strategic biomanufacturing agreements such as an $85 million automation deal with Multiply Labs, and future commercial reliance on pharmaceutical co-developers and institutional healthcare payers."
sections:
  - id: "customer-segmentation-commercial-model"
    title: "Customer Base Segmentation and Target End-Markets"
    body: "Retro Biosciences operates as a clinical-stage geroscience therapeutics developer rather than an enterprise software or consumer wellness provider [CU001]. Because its multi-program pipeline spans small-molecule autophagy enhancers (RTR242), stem cell reprogramming (iHSC RTR890), microglial cell replacement (iMG RTR888), and viral gene therapies, Retro has no commercial paying customers, recurring enterprise revenue, or software-style retention metrics [CU001, CU006]. The company's ultimate commercialization surface is segmented into three distinct counterparty tiers: institutional healthcare payers covering regulated disease indications, large pharmaceutical partners seeking in-licensed longevity assets, and health system transplant centers administering complex cell therapies [CU004]. Current activity is entirely pre-commercial, funded through substantial venture capital including an initial $180 million capitalization in 2022 and subsequent financing reaching a $1.8 billion valuation [CU002, CU003]. Commercial access will ultimately depend on regulatory disease-framework definitions, given that regulatory bodies like the FDA evaluate specific age-related diseases such as Alzheimer's rather than aging itself [CU005]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "named-proof-and-automation-partnerships"
    title: "Named Deployment Proof and Biomanufacturing Alliances"
    body: "In the absence of commercial software clients, Retro's operational traction is demonstrated through institutional research partnerships and biomanufacturing automation alliances [CU007, CU008]. Most notably, Retro entered into an $85 million agreement with Multiply Labs to deploy cloud-controlled robotic systems for cell therapy manufacturing, specifically targeting the scale-up of its lab-reprogrammed cell therapies [CU008]. This agreement represents a major operational commitment to transition autologous and allogeneic cell therapies from manual laboratory processes to automated production [CU008, CU009]. In addition, Retro has established research collaborations with external research centers, including work informing blood disorder therapies with Australia's Murdoch Children's Research Institute [CU007]. However, external clinical-trial adoption remains in early phases, with initial clinical trials evaluating safety and autophagic flux rather than broad commercial patient access [CU010]."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-durability-and-counterparty-risks"
    title: "Retention Dynamics, Concentration, and Biopharma Partner Risk"
    body: "Because Retro does not market subscription products, standard software-as-a-service retention benchmarks such as net revenue retention (NRR), gross revenue retention (GRR), and logo renewal rates are non-applicable [CU006]. Instead, customer durability and revenue viability depend entirely on long-term pharmaceutical alliance stability and clinical milestone execution [CU011]. The structural risks inherent in long-term longevity development alliances are demonstrated by historical industry precedents: for example, AbbVie terminated its 11-year, billion-dollar research alliance with Alphabet-backed Calico Labs after collaborative clinical programs including fosigotifator failed to deliver commercial breakthroughs, leaving Calico to pursue internal pipelines independently [CU011, CU012]. Furthermore, large technology conglomerates report that while early moonshot subsidiaries operate with dedicated capital and external partners, life science ventures face intense competition and clinical uncertainties without guaranteed commercial profitability [CU013, CU014]. For Retro, the primary counterparty risk is not customer churn in the traditional sense, but the risk of partner retrenchment, clinical pipeline attrition, or partner withdrawal before Phase 3 commercialization [CU011, CU012]."
    claimRefs:
      - "CU006"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
