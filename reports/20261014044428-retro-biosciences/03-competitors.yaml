callouts:
  - calloutType: strength
    title: The $1.8B Valuation Sets a Strategic Benchmark
    body: Retro Biosciences' $1.8 billion pre-money valuation demonstrates substantial investor confidence in multi-platform longevity biotech, providing a competitive capitalization advantage over single-hallmark peers while setting a high floor for future pharmaceutical partnership or M&A discussions.
    claimRefs:
      - CP001
      - CP009
  - calloutType: risk
    title: Translational and Regulatory Attrition Risk
    body: AbbVie's termination of its $1.75 billion Calico collaboration following the failure of fosigotifator in ALS highlights the high attrition rate of longevity partnerships. Furthermore, the absence of an FDA or EMA regulatory pathway for aging forces companies to pursue narrow disease indications, extending timelines and clinical development costs.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP012
  - calloutType: recommendation
    title: Diligence Requirement on Comparative Biomarker Readouts
    body: Investors must track exploratory lysosomal and autophagy biomarker readouts from Retro Biosciences' RTR242 Phase I trial to determine whether small molecules can achieve clinically measurable rejuvenation before committing capital based on long-dated cellular reprogramming promises.
    claimRefs:
      - CP004
      - CP014
