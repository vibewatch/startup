  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Company / Competitor
      - Price / Contract Model
      - Included Capabilities
      - Discount or Unknowns
      - Commercial Implication
    rows:
      - - Retro Biosciences
        - Pre-commercial therapeutics
        - Small molecule pipeline + cell therapy platforms
        - Drug pricing, reimbursement tiers, and margins unknown
        - Must establish orphan or specialty therapeutic pricing per disease
      - - Altos Labs
        - Pre-commercial discovery
        - Cellular reprogramming institutes & AI models
        - No disclosed commercial product or pricing model
        - Long-dated capital intensity before revenue generation
      - - Calico Life Sciences
        - Pharma co-development
        - Shared development costs and option licensing
        - Upfront funding exhausted; standalone pricing unproven
        - Requires new commercial partners following AbbVie exit
      - - Status Quo Pharmaceuticals
        - Standard prescription pricing
        - Disease-symptomatic treatment and management
        - Rebates, pharmacy benefit tiering, generic erosion
        - Established reimbursement but treats consequences rather than root causes
    notes: Pre-commercial longevity ventures lack public list prices; commercial models are inferred from biopharma precedent and partnership disclosures.
