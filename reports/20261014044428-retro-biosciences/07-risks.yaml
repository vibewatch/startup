callouts:
  - calloutType: "risk"
    title: "Clinical Translation Gap: Zero Completed Trials Behind Multi-Billion Valuation"
    body: "Retro's private valuation has escalated to $1.8 billion based on compelling longevity biology and prominent tech sponsorship. However, public analysis confirms that the company has completed zero human clinical trials. While Phase 1 safety data for RTR242 is advancing without dose-limiting toxicities, preclinical cellular rejuvenation models frequently fail in human efficacy trials, making the upcoming Alzheimer's clinical readouts a pivotal binary risk event."
    claimRefs:
      - "CR001"
      - "CR007"
      - "CR008"

  - calloutType: "recommendation"
    title: "Underwriting Discipline: Condition Further Capital on Unblinded Biomarker Data"
    body: "Prospective investors should avoid underwriting Retro as a platform software company and instead enforce standard biotechnology milestone gates. Capital commitments must be tied to verified Phase 1 pharmacokinetic and target engagement metrics for RTR242, demonstrated non-tumorigenic cellular reprogramming in non-human primates, and syndicated risk-sharing with specialized biopharma venture funds."
    claimRefs:
      - "CR002"
      - "CR009"
      - "CR011"

