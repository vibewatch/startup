      - number: '7.4'
        title: Counterparty Concentration, Leadership Dependencies, and Governance
        blocks:
          - type: paragraph
            body: >-
              Retro's operational resilience is inextricably tied to key individual relationships and specialized
              supplier infrastructure. Seed funding was provided entirely by Sam Altman, creating notable sponsor
              concentration and governance exposure should strategic priorities diverge. Scientifically, Retro depends
              heavily on co-founders Joe Betts-LaCroix, UCSF professor Sheng Ding, and Matt Buckley, alongside an elite
              network of academic advisors. Operationally, producing clinical-grade induced pluripotent stem cell (iPSC)
              lines, autologous HSC grafts, and specialized small-molecule formulations requires external contract
              development and manufacturing organizations (CDMOs) and advanced compute infrastructure for computational
              biology models. Supply disruptions or CDMO capacity constraints could derail pipeline milestones.
