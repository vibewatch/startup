  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Hurdles, CMC Complexity, and Gene Therapy IP Landscape
        blocks:
          - type: paragraph
            body: >-
              Retro's broad therapeutic strategy spans small-molecule autophagy enhancers, in vivo gene therapies, and
              stem-cell replacement modalities. While small molecules like RTR242 follow established IND pathways for
              CNS indications, Retro's cellular reprogramming and microglial cell therapies face intricate chemistry,
              manufacturing, and controls (CMC) validation hurdles under US FDA guidelines. The FDA's 2026 draft
              guidance on leveraging prior knowledge for human gene therapy products underscores substantial nonclinical
              safety requirements for genome editing and somatic cell modifications. In parallel, intellectual property
              risks surrounding engineered biologics remain dynamic. Although the Federal Circuit's 2026 REGENXBIO
              decision reinforced section 101 patent eligibility for human-engineered host cells containing recombinant
              molecules, freedom-to-operate boundaries for in vivo cellular reprogramming and Yamanaka factor delivery
              remain heavily contested across academic licensors and well-funded competitors.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
