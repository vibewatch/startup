  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation & Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Retro Biosciences presents an extraordinary combination of scientific boldness, frontier computational
              integration, and top-tier individual sponsorship. The company's May 2026 financing round established an
              enterprise mark of $1.8 billion, representing a substantial correction from the $5.0 billion valuation it
              previously targeted when circulating early fundraising materials. Despite this repricing, an objective
              underwriting assessment must conclude that the current $1.8 billion valuation remains stretched relative
              to verified clinical proof. The entire therapeutic pipeline—encompassing four distinct programs across
              cellular reprogramming, autophagy enhancement, microglial therapeutics, and tissue rejuvenation—operates
              with zero human clinical efficacy data. The lead autophagy asset RTR242 has only recently dosed its first
              human subjects in an Australian Phase 1 safety trial, which is explicitly designed to measure tolerability
              rather than disease modification or cognitive improvement. Consequently, the valuation reflects
              speculative option value on biological mechanisms rather than discounted cash flows from validated
              clinical assets. We assign a research-more recommendation with a high risk rating and a stretched
              valuation stance, counseling prospective investors to withhold capital commitments until Phase 1 safety
              and exploratory biomarker readouts provide empirical derisking.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
