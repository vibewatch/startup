  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Therapeutic Pillars and Pipeline Asset Mapping
        blocks:
          - type: paragraph
            body: >-
              Retro Biosciences operates across three primary mechanistic pillars targeting the fundamental drivers of
              human aging: autophagy enhancement, cellular reprogramming, and plasma-inspired microglial and stem cell
              therapeutics. The company's lead development asset is RTR242, an orally bioavailable small-molecule
              therapeutic designed to amplify autophagic flux, currently progressing through Phase 1 clinical
              evaluation. In parallel, Retro's cellular therapy division is advancing preclinical programs including
              RTR888, an induced pluripotent stem cell (iPSC)-derived microglial progenitor platform intended to treat
              neurodegenerative conditions such as Alzheimer's disease by replenishing phagocytic immune cells in the
              central nervous system. A third core program, RTR890, aims to generate rejuvenated hematopoietic stem
              cells from iPSCs to renew the aged blood and immune compartments via bone marrow transplantation
              protocols. Additionally, Retro is pursuing in vivo tissue reprogramming utilizing adeno-associated virus
              (AAV) delivery vectors carrying Yamanaka factors to treat osteoarthritis and sensorineural hearing loss.
              Together, these programs form an ambitious translational pipeline spanning distinct biological modalities
              from classical medicinal chemistry to complex ex vivo and in vivo cell and gene therapies.
            claimRefs:
              - CE001
              - CE002
