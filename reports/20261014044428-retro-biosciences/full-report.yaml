      - number: '7.3'
        title: Capital Intensity, Down-Round Sensitivity, and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              Advancing multiple distinct therapeutic platforms—autophagy, hematopoietic stem cell reprogramming,
              microglial cell replacement, and systemic chemical rejuvenation—imposes extraordinary capital
              requirements. Retro was seeded with $180 million from OpenAI CEO Sam Altman and confirmed a $1.8 billion
              pre-money valuation round in May 2026. However, prior reporting indicated ambitions to raise up to $1
              billion at a $5 billion mark, revealing valuation friction in private biotech markets. Because developing
              biologic and gene-editing programs requires hundreds of millions of dollars per Phase 2/3 campaign, Retro
              faces heavy dilution and continuous financing risk. Any macroeconomic tightening or setback in early
              RTR242 safety data could severely compress valuation multiples and limit access to the specialized
              syndicate capital required to sustain operations.
            claimRefs:
