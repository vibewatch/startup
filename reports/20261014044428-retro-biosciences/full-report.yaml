      - number: '6.3'
        title: Retention Dynamics, Concentration, and Biopharma Partner Risk
        blocks:
          - type: paragraph
            body: >-
              Because Retro does not market subscription products, standard software-as-a-service retention benchmarks
              such as net revenue retention (NRR), gross revenue retention (GRR), and logo renewal rates are
              non-applicable [CU006]. Instead, customer durability and revenue viability depend entirely on long-term
              pharmaceutical alliance stability and clinical milestone execution [CU011]. The structural risks inherent
              in long-term longevity development alliances are demonstrated by historical industry precedents: for
              example, AbbVie terminated its 11-year, billion-dollar research alliance with Alphabet-backed Calico Labs
              after collaborative clinical programs including fosigotifator failed to deliver commercial breakthroughs,
              leaving Calico to pursue internal pipelines independently [CU011, CU012]. Furthermore, large technology
              conglomerates report that while early moonshot subsidiaries operate with dedicated capital and external
              partners, life science ventures face intense competition and clinical uncertainties without guaranteed
              commercial profitability [CU013, CU014]. For Retro, the primary counterparty risk is not customer churn in
              the traditional sense, but the risk of partner retrenchment, clinical pipeline attrition, or partner
              withdrawal before Phase 3 commercialization [CU011, CU012].
            claimRefs:
              - CU006
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Absence of Commercial Customer Base Reflects Clinical Biotech Model
            body: >-
              Investors must not evaluate Retro Biosciences using SaaS or consumer health metrics. The company generates
              zero commercial revenue and maintains no commercial customer relationships. Its valuation and future
              liquidity depend entirely on clinical trial execution and eventual biopharma licensing or acquisition.
            calloutType: risk
