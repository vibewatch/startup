      - number: '6.2'
        title: Named Deployment Proof and Biomanufacturing Alliances
        blocks:
          - type: paragraph
            body: >-
              In the absence of commercial software clients, Retro's operational traction is demonstrated through
              institutional research partnerships and biomanufacturing automation alliances [CU007, CU008]. Most
              notably, Retro entered into an $85 million agreement with Multiply Labs to deploy cloud-controlled robotic
              systems for cell therapy manufacturing, specifically targeting the scale-up of its lab-reprogrammed cell
              therapies [CU008]. This agreement represents a major operational commitment to transition autologous and
              allogeneic cell therapies from manual laboratory processes to automated production [CU008, CU009]. In
              addition, Retro has established research collaborations with external research centers, including work
              informing blood disorder therapies with Australia's Murdoch Children's Research Institute [CU007].
              However, external clinical-trial adoption remains in early phases, with initial clinical trials evaluating
              safety and autophagic flux rather than broad commercial patient access [CU010].
