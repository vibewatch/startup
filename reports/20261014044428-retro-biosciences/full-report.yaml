      - number: '7.5'
        title: Thesis-Break Triggers, Monitoring Indicators, and Investment Diligence
        blocks:
          - type: paragraph
            body: >-
              Institutional underwriting of Retro Biosciences requires strict adherence to milestone-driven kill
              criteria rather than broad longevity vision. Key monitoring indicators include: (1) verified disclosure of
              RTR242 Phase 1 safety, pharmacokinetic, and biomarker clearance readouts; (2) filing of cleared IND
              applications for preclinical candidates RTR888 and RTR890; and (3) formal syndicate expansion beyond
              single-backer capital. Definitive thesis-break triggers include clinical trial holds due to systemic
              toxicity or oncogenic transformation in cellular reprogramming assays, failure to demonstrate in vivo
              target engagement in Phase 2 trials, or inability to secure institutional syndicate co-investors at
              non-punitive valuation terms.
            claimRefs:
