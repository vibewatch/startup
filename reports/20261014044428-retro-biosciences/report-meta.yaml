companyProfile:
  summary: >-
    Retro Biosciences is a private clinical-stage longevity biotechnology company founded in 2021 and headquartered in
    Redwood City, California. The company is developing multi-platform therapies that target aging biology, including
    autophagy enhancement, cellular reprogramming, and cell-therapy programs, while advancing its lead oral candidate
    RTR242 through Phase 1 evaluation.
