  topStrengths:
    - Large early capital base and renewed 2026 financing support long-horizon R&D.
    - Lead asset RTR242 has entered Phase 1, giving Retro an early clinical milestone.
    - Multi-platform pipeline creates optionality across autophagy, reprogramming, and cell therapy.
  topRisks:
    - Human efficacy, biomarker, and durability data remain undisclosed or incomplete.
    - Benefactor concentration and governance opacity elevate financing and control risk.
    - Concurrent platform development and cell-therapy manufacturing are capital intensive.
