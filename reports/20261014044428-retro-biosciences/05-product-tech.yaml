callouts:
  - calloutType: "risk"
    title: "In Vivo Dedifferentiation and Delivery Vector Risk"
    body: "The greatest technical hurdle for cellular reprogramming remains achieving precise in vivo factor dosing without inducing teratomas or loss of somatic identity. While AAV-mediated OSK expression demonstrates epigenetic reversal in animal models, systemic viral delivery carries substantial risks of hepatotoxicity, immunogenicity, and unpredictable off-target transduction."
    claimRefs:
      - "CE006"
      - "CE013"
  - calloutType: "insight"
    title: "Phased Translational Risk Profile"
    body: "Retro's asset portfolio is strategically bifurcated across maturity horizons. Lead asset RTR242 represents a conventional small-molecule approach with predictable clinical development dynamics, whereas RTR888, RTR890, and tissue reprogramming represent high-complexity biological modalities requiring unprecedented manufacturing and delivery validation."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE010"
