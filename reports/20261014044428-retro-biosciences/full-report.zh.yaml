            title: $1.8B 估值树立战略基准
            body: Retro Biosciences 的 $1.8B 投前估值说明投资者高度看好多平台长寿生物科技；相较只聚焦单一衰老标志的同行，公司拥有更强的资本基础，也为未来制药合作或并购谈判设定了较高底线。
