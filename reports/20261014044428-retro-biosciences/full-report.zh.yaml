      - number: '5.4'
        title: 技术脆弱性与临床转化障碍
        blocks:
          - type: paragraph
            body: >-
              尽管资本充足、机制基础有吸引力，Retro Biosciences 仍面临严峻的技术、监管和生物学转化风险。首先，使用 AAV
              载体进行体内组织重编程会遭遇严重递送瓶颈，包括中和抗体普遍存在、病毒包装容量有限，以及如果重编程因子表达控制不严，可能导致细胞失控去分化或肿瘤发生。其次，虽然主要资产 RTR242 已进入 I
              期人体试验，Retro 尚未披露同行评审的临床药代动力学、安全边界或靶点作用生物标志物数据，无法证明该小分子在人体可耐受的全身剂量下确实能诱导自噬通量。第三，RTR888 和 RTR890
              等体外异基因细胞疗法存在陡峭的生物制造规模化挑战；在规模化条件下维持核型稳定、防止免疫排斥并达到商业销货成本平价，仍未得到验证。在验证性人体生物标志物信号和临床安全记录公布前，Retro
              的多平台管线仍承担早期长寿生物科技常见的高技术损耗风险。
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 体内去分化与递送载体风险
            body: >-
              细胞重编程最大的技术障碍，仍是在不诱发畸胎瘤或丧失体细胞身份的情况下，精确控制体内因子剂量。AAV 介导的 OSK
              表达虽已在动物模型中展现表观遗传逆转，但系统性病毒递送会带来肝毒性、免疫原性和不可预测的脱靶转导等重大风险。
            calloutType: risk
            claimRefs:
              - CE006
              - CE013
          - type: callout
            title: 分阶段转化风险画像
            body: >-
              Retro 的资产组合按成熟度周期形成有意的两极分化。主要资产 RTR242 是传统小分子路径，临床开发节奏较可预测；而 RTR888、RTR890
              和组织重编程属于高复杂度生物学模式，需要前所未有的制造和递送验证。
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE010
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群体分层与目标终端市场
        blocks:
          - type: paragraph
            body: >-
              Retro Biosciences 是临床阶段的衰老科学疗法开发商，而不是企业软件或消费者健康服务商 [CU001]。由于其多项目管线覆盖小分子自噬增强剂（RTR242）、干细胞重编程（iHSC
              RTR890）、小胶质细胞替代（iMG RTR888）和病毒基因疗法，Retro 没有商业付费客户、经常性企业收入或软件式留存指标 [CU001,
              CU006]。公司的最终商业化对象分为三类交易对手：覆盖受监管疾病适应症的机构医疗支付方、寻求授权引入长寿资产的大型制药合作伙伴，以及实施复杂细胞疗法的医疗系统移植中心
              [CU004]。当前活动全部处于商业化前阶段，由大量风险资本支持，包括 2022 年初始 $180M 资本化以及后续达到 $1.8B 估值的融资 [CU002,
              CU003]。商业准入最终取决于监管对疾病框架的定义，因为 FDA 等监管机构评估的是阿尔茨海默病等具体年龄相关疾病，而非衰老本身 [CU005]。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
