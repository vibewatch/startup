  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策流程图将临床证据、估值重定价、治理风险和情景分析连接至 research-more 建议。
    data:
      nodes:
        - id: stage-proof
          label: 临床阶段与证据
          description: 核心资产 RTR242 在澳大利亚进行 Phase 1 安全性试验，尚处疗效验证前阶段
        - id: valuation-mark
          label: 估值与资本
          description: 从 $5B 目标重定价后，以 $1.8B 估值融资
        - id: capital-governance
          label: 治理集中度
          description: 高度依赖单一资助者 Sam Altman，缺乏广泛风投联合投资
        - id: category-precedent
          label: 品类下行
          description: AbbVie-Calico 终止合作等先例，说明未经验证的长寿科学淘汰率很高
        - id: scenario-balance
          label: 风险收益平衡
          description: 下行至 $300M-$500M 现金价值，抵消 $3.5B-$4.5B 的上行潜力
        - id: final-recommendation
          label: 建议：research-more
          description: 在人体临床安全性和生物标志物读数公布前，暂缓资本承诺
      edges:
        - from: stage-proof
          to: scenario-balance
        - from: valuation-mark
          to: scenario-balance
        - from: capital-governance
          to: scenario-balance
        - from: category-precedent
          to: scenario-balance
        - from: scenario-balance
          to: final-recommendation
    approximationNotes: 流程图综合临床、资本和风险输入，展示定性决策架构。
