      - number: '3.4'
        title: 护城河持久性、合作风险与商业现实
        blocks:
          - type: paragraph
            body: >-
              长寿生物科技的护城河受高转化失败率和不断变化的生物制药合作关系制约。AbbVie 与 Calico 合作关系的解体说明，即使资金充足的发现联盟，如果主要分子在 II
              期试验中无法证明疾病改善效果，也可能被终止。此外，大型制药合作伙伴通常设有较高的门槛，并会把资本转向风险更低的资产，正如 AbbVie 转向收购靶向细胞和 RNA 项目。对 Retro Biosciences
              等新兴平台而言，转换成本最终取决于支付方报销模式和健康经济学证据，而不是理论上的健康寿命增益。模块化机器人若能建立制造壁垒，就能降低销货成本；但要形成持久的竞争差异化，仍需验证人体生物标志物转化，并围绕优化的小分子递送建立可防御的知识产权。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
