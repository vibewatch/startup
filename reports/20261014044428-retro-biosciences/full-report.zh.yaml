            body: AbbVie 终止其与 Calico 的 $1.75B 合作，凸显长寿合作项目的高损耗率。此外，衰老尚无 FDA 或 EMA 监管路径，迫使公司选择狭窄的疾病适应症，从而拉长时间线并推高临床开发成本。
