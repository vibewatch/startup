            body: >-
              Retro Biosciences 的运营成本结构资本强度很高，原因在于小分子发现、细胞疗法生物制造和先进计算生物学的要求差异巨大。RTR242
              等小分子遵循可规模化的化学合成路径，生产成本相对较低；但公司的细胞疗法和组织重编程项目需要专门的生物基础设施。为控制供应并加快转化，Retro
              正投入资本建设内部自有的细胞疗法制造设施。运营自有洁净室和洁净制造套间会带来大量固定开支、设备摊销和专业技术人员成本。同时，Retro 依赖大规模计算建模和 AI
              蛋白质工程，并与美国数据中心基础设施运营商谈判，以获得高性能计算能力。这些承诺叠加起来，会让公司在多个项目从探索研究进入资本密集型临床试验执行阶段时，成本基线迅速上升。
