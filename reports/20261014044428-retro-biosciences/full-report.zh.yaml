      - - 临床执行
        - 自噬主候选药物 RTR242 快速进入澳大利亚临床试验，初期未见毒性
        - Phase 1 仅在健康志愿者中测试安全性，完全没有证明其对阿尔茨海默病的认知或疾病修饰获益
        - Phase 1/2 临床读数显示生物标志物出现统计显著调节
      - - 资本与治理
        - 单一资助者模式提供耐心的长期资本，不受短期机构风投压力影响
        - 股权结构表显示持股高度集中于 Sam Altman，缺乏独立机构治理和广泛市场联合投资
        - 与领先的独立生物医药风投基金联合完成 Series B
    notes: 评估支持或挑战投资判断的科学、计算、临床和治理支柱。
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 估值区间
      - 核心假设
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - $3.5B - $4.5B
        - RTR242 显示积极的生物标志物信号；AI 重编程因子通过 IND 前毒性门槛；达成大型药企授权交易
        - 临床试验延迟；AI 蛋白工程无法在体内复现；生物科技宏观环境收缩
        - 20%（初始信心低至中等）
      - - 基准情景
        - $1.5B - $2.0B
        - RTR242 证明安全性但尚无明确疗效；重编程推进至 IND 前临床支持研究；后续融资持平
        - 开发周期拉长；现金消耗快于里程碑推进；倍数压缩至投入资本的 1.0x
        - 55%（最可能的市场路径）
      - - 悲观情景
        - $300M - $500M
        - RTR242 遇到剂量限制性毒性或 Phase 1 试验无效；资助者信念减弱；配套项目停滞
        - 平台整体减记；合作伙伴仿效 AbbVie-Calico 先例退出；按接近净现金值清算
        - 25%（下行风险显著）
    notes: 情景模型基于澳大利亚临床里程碑和生物医药宏观融资纪律，评估未来 24-36 个月的结果。
    claimRefs:
      - CV001
      - CV010
      - CV012
      - CV013
