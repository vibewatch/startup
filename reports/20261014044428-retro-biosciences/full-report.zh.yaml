              从投资尽调角度看，              Retro Biosciences 的财务画像分化明显：机构支持极强，但资本需求也十分庞大。公司 $1.8B 投前估值反映了市场对多疾病预防医学和基础 AI
              生物学的热情；但公司没有经常性收入，现金消耗高且无法量化。科学评论指出，雷帕霉素等成熟且低成本的自噬促进剂已经存在，因此 RTR242
              等新疗法必须证明明确的疗效和安全优势，才能支撑溢价定价。此外，同时推进细胞疗法、基因疗法和小分子临床项目，并扩建自有制造设施，会带来严重融资依赖。若无法获得报道中的目标轮次资本，资产组合可能被迫重新排序，或经历稀释性的下轮融资。潜在投资判断者应以获得经核实的现金消耗台账、I
