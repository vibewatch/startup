  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 治疗支柱与管线资产映射
        blocks:
          - type: paragraph
            body: >-
              Retro Biosciences 以三大机制支柱为主线，靶向人类衰老的根本驱动因素：自噬增强、细胞重编程，以及受血浆启发的小胶质细胞和干细胞疗法。公司的主要开发资产 RTR242
              是一种口服生物利用度高的小分子疗法，旨在放大自噬通量，目前正在接受 I 期临床评估。同时，Retro 的细胞疗法部门正在推进临床前项目
              RTR888——一种由诱导多能干细胞（iPSC）衍生的小胶质细胞祖细胞平台，目标是通过补充中枢神经系统中的吞噬性免疫细胞治疗阿尔茨海默病等神经退行性疾病。              第三个核心项目 RTR890
              旨在从 iPSC 生成年轻化造血干细胞，通过骨髓移植方案更新老化的血液和免疫系统。此外，Retro 还在推进体内组织重编程，使用携带 Yamanaka
              因子的腺相关病毒（AAV）递送载体治疗骨关节炎和感音神经性听力损失。这些项目共同构成一条雄心勃勃的转化管线，覆盖从传统药物化学到复杂离体和体内细胞、基因疗法的不同生物学模式。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
      - number: '5.2'
        title: 生物学机制与表观遗传逆转
        blocks:
          - type: paragraph
            body: >-
              Retro Biosciences
              的科学架构把传统细胞降解通路与现代表观遗传年轻化结合起来。自噬增强项目试图刺激细胞内对功能失常细胞器和错误折叠蛋白聚集体的回收，绕过复杂的上游激酶信号网络，直接恢复细胞蛋白质稳态。在细胞重编程项目中，Retro
              聚焦于通过定义好的转录因子组合进行部分重编程，具体使用 Oct4、Sox2 和 Klf4（OSK），排除致癌因子 c-Myc。基础学术研究显示，短暂且非整合的 OSK 表达可以主动逆转哺乳动物组织的核糖体 DNA
              甲基化年龄，抹除与年龄相关的转录漂移，并恢复受损或老化细胞的再生能力，同时不抹除体细胞身份，也不引发与多能性相关的畸胎瘤。为加快重编程因子和合成基因回路的发现与优化，Retro 利用人工智能和机器学习模型，并与
              OpenAI 开展合作研究。这些计算框架分析高维单细胞多组学和蛋白质组学数据集，用于发现新型小分子 rejuvenation 组合和蛋白质疗法，以更高效力和组织特异性调节长寿通路。
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
