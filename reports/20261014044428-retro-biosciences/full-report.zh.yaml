      - number: '5.3'
        title: 运营架构与生物制造策略
        blocks:
          - type: paragraph
            body: >-
              把离体细胞疗法和体内基因疗法转化为临床产品，需要高度复杂的生物工艺和运营基础设施。针对 iPSC 衍生的小胶质细胞（RTR888）和造血干细胞（RTR890）候选项目，Retro
              依靠自动化闭环生物反应器，在现行良好生产规范（cGMP）标准下实现可重复的干细胞扩增和定向分化。为提高早期临床开发效率，Retro
              评估了澳大利亚临床试验通知（CTN）计划等加速监管路径；该计划允许未经批准的研究性产品在机构伦理审查下开展探索性试验，无需经历漫长的预先审批延迟。在美国，FDA
              近期指南为研究性细胞和基因疗法提供化学、生产和控制（CMC）灵活性，允许申办方把商业规模放行规格和工艺性能确认批次推迟到后期关键试验。在这一渐进式监管框架下，Retro
              可以在探索性队列中测试多个生物构建体，同时迭代优化细胞培养产率、冻存稳定性和批次放行检测。
            claimRefs:
              - CE010
              - CE011
              - CE012
