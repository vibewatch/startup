              - CU010
      - number: '6.2'
        title: 已命名的部署证明与生物制造联盟
        blocks:
          - type: paragraph
            body: >-
              在没有商业软件客户的情况下，Retro 通过机构研究合作和生物制造自动化联盟证明其运营进展 [CU007, CU008]。最突出的是，公司与 Multiply Labs 达成 $85M
              协议，部署云控制机器人系统，用于细胞疗法制造，具体服务于实验室重编程细胞疗法的规模化 [CU008]。该协议代表着一项重大运营承诺：把自体和异基因细胞疗法从手工实验室流程转为自动化生产 [CU008,
              CU009]。此外，Retro 还与外部研究中心建立研究合作，包括与澳大利亚 Murdoch Children's Research Institute 合作，为血液疾病疗法提供研究支持
              [CU007]。不过，外部临床试验采用仍处于早期，最初的临床试验评估的是安全性和自噬通量，而非广泛的商业患者准入 [CU010]。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
