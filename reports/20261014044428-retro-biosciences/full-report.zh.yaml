              Retro Biosciences 于 2021 年成立，获得 OpenAI CEO Sam Altman 提供的 $180M 大额种子资金，用于在较长运营周期内支持多个生物学方向的探索性发现。2026
              年，公司完成新融资轮首次交割，投前估值 $1.8B，由 4P Capital 领投，标志着其进入临床阶段验证。与此同时，市场报道显示，Retro 曾向家族办公室、风险基金和主权财富机构寻求最多 $1B
              增量扩张资本，用于并行人体临床试验和计算基础设施。加州州监管备案确认，公司按 Delaware 注册成立且经营状态良好；Jonathan Betts-LaCroix
