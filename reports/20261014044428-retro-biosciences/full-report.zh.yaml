  - id: FE001
    title: Retro Biosciences 技术与运营栈
    type: stack
    summary: 覆盖基础计算引擎、生物工艺平台、治疗项目和临床交付模式的分层架构。
    approximationNotes: 架构层代表根据已披露研究项目和生物科技运营要求归纳出的功能技术模块。
    claimRefs:
      - CE001
      - CE008
      - CE009
      - CE010
      - CE011
    data:
      layers:
        - label: 1. AI 与计算发现层
          description: 机器学习模型与单细胞多组学数据整合
          modules:
            - OpenAI 联合开发的细胞再生模型
            - 单细胞多组学与表观遗传时钟
            - 高通量蛋白质组学筛选
        - label: 2. 分子工程与化学层
          description: 药物化学 SAR 与病毒载体工程
          modules:
            - 小分子自噬通量诱导剂
            - AAV 病毒载体工程（OSK 因子）
            - 合成转录调节因子
        - label: 3. 细胞生物工艺与制造层
          description: 自动化封闭系统细胞疗法制造平台
          modules:
            - 多能干细胞（iPSC）维持
            - 小胶质细胞祖细胞分化（iMG）
            - 造血干细胞衍生（iHSC）
        - label: 4. 治疗管线与项目层
          description: 针对衰老驱动因素的主要生物学开发候选物
          modules:
            - 自噬项目（RTR242 小分子）
            - 小胶质细胞疗法（RTR888 iMG 细胞）
            - HSC 重编程（RTR890 iHSC 细胞）
            - 组织重编程（体内 AAV-OSK）
        - label: 5. 临床转化与监管层
          description: 临床阶段试验执行与监管路径
          modules:
            - Phase 1 探索性安全性与 PK 研究
            - 澳大利亚 CTN 临床试验基础设施
            - FDA CBER 早期 CMC 灵活性框架
        - label: 6. 患者与目标适应症交付层
          description: 核心模式所针对的疾病适应症
          modules:
            - 神经退行性疾病（阿尔茨海默病）
            - 免疫与血液系统衰退
            - 骨关节炎与年龄相关感觉丧失
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 潜在客户和商业交易对手从药物发现、临床验证到制药企业采用的推进路径。
    data:
      nodes:
        - label: 1. 临床前发现
          touchpoints:
            - Target identification across cellular reprogramming, autophagy, and microglial pathways
            - Preclinical animal model proof-of-concept and robotic automation integration
        - label: 2. 转化开发
          touchpoints:
            - Robotic cell therapy production alliance with Multiply Labs
            - Academic research partnerships for hematologic and cognitive validation
        - label: 3. Phase 1/2 临床试验
          touchpoints:
            - First-in-human trial dosing for small-molecule autophagy candidates (RTR242)
            - Biomarker verification and human safety profiling in controlled patient cohorts
        - label: 4. 生物医药授权
          touchpoints:
            - Negotiation of co-development rights with global pharmaceutical corporations
            - Upfront licensing agreements, development milestones, and royalty structures
        - label: 5. 监管批准与支付方覆盖
          touchpoints:
            - FDA / EMA approval for defined disease indications (e.g., Alzheimer's, blood disorders)
            - Institutional healthcare reimbursement and formulary inclusion
        - label: 6. 医院与患者可及性
          touchpoints:
            - Deployment to bone marrow transplant centers and specialized memory care hospitals
            - Long-term therapeutic adherence and post-market safety surveillance
    approximationNotes: 代表临床阶段生物科技疗法的标准监管和商业化推进路径。
    claimRefs:
      - CU004
      - CU005
      - CU008
      - CU010
