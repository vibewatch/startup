  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业化结构与管线收入机制
        blocks:
          - type: paragraph
            body: >-
              Retro Biosciences 是一家尚无商业阶段收入的临床阶段生物科技企业，围绕五条旨在预防多种疾病和延长寿命的独立治疗路径展开。公司的主要资产 RTR242
              是一种口服生物利用度高的小分子，旨在上调自噬通量，恢复阿尔茨海默病等中枢神经系统疾病中的溶酶体清除。更长期的管线包括细胞疗法（如小胶质细胞祖细胞替代 RTR888 和造血干细胞年轻化
              RTR890），以及腺相关病毒递送的体内组织重编程和小分子化学年轻化。各类疗法的商业实现依赖传统生物制药授权、按里程碑推进的制药合作以及最终的专科分销。由于所有候选项目仍处于 I 期或临床前阶段，Retro
              没有商业收入、ARR 或客户销售进展，近期财务生存完全依赖外部股权融资和赠款资金。
