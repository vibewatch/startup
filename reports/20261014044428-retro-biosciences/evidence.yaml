evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: undisclosed-round-economics-and-cash-runway
    missingEvidence: >-
      Exact dollar amount raised in the May 2026 financing round, post-money cash balance, burn rate, and capital
      runway.
    whyItMatters: >-
      Pre-money valuation of $1.8 billion is disclosed, but without the total capital committed and ongoing burn rate,
      investors cannot model dilution or runway through Phase 2 proof-of-concept.
    diligencePath: >-
      Request audited cap table, Series A subscription documents, and 24-month operating cash flow budget during
      technical diligence.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-investor-map-governance
    missingEvidence: >-
      Comprehensive cap table detailing full shareholder voting rights, board of directors composition, and secondary
      investors alongside 4P Capital and Sam Altman.
    whyItMatters: >-
      Key-person risk and governance concentration remain elevated if single-backer voting control persists without
      independent board oversight.
    diligencePath: Review corporate charter, investor rights agreement, voting agreements, and board committee minutes.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-and-reimbursement
    missingEvidence: >-
      Disclosed pricing benchmarks, health economic cost-effectiveness models, and reimbursement contracts for RTR242
      and iHSC therapy.
    whyItMatters: >-
      Without established pricing or payer commitments, commercial market penetration cannot be modeled beyond
      speculative analog pricing.
    diligencePath: >-
