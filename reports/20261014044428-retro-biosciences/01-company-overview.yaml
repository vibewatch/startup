company:
  name: Retro Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: Retro Biosciences is a Redwood City-based clinical-stage longevity biotechnology company founded in 2021 with the mission of extending healthy human lifespan by ten years. Initially backed by $180 million from OpenAI CEO Sam Altman, the company reached a $1.8 billion pre-money valuation in its May 2026 financing round led by 4P Capital and entered the clinic in late 2025 with its lead oral autophagy candidate RTR242.
sections:
  - id: identity-and-mission
    title: Corporate Identity, Founding, and Core Mission
    body: Retro Biosciences is a Redwood City, California-based biotechnology enterprise founded in 2021 with the singular objective of adding ten healthy years to human lifespan. Rather than developing treatments targeted narrowly at late-stage disease symptoms, Retro focuses directly on the cellular mechanisms that drive human aging. The company pursues a multi-program strategy across cellular reprogramming, autophagy enhancement, and plasma-inspired therapies. Retro publicly emerged from stealth in April 2022, securing $180 million in initial capital to fund proof-of-concept operations. The company is structured around lean operational principles and rapid laboratory iteration, deploying automated experimentation to advance aging biology from academic hypothesis into tangible clinical medicine.
    claimRefs:
      - CO008
      - CO012
      - CO013
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Executive Leadership, Scientific Founders, and Governance
    body: The company was co-founded by Chief Executive Officer Joe Betts-LaCroix, Professor Sheng Ding, and Dr. Matt Buckley. Betts-LaCroix is an experienced entrepreneur and biophysicist with academic roots at Harvard, MIT, and Caltech, having previously co-founded handheld computer pioneer OQO and preclinical research automation platform Vium, as well as serving as a part-time partner at Y Combinator. Co-founder Sheng Ding brings deep academic leadership from UCSF in small-molecule stem cell differentiation and reprogramming, while Matt Buckley provides systems integration and molecular genetics expertise from Illumina and Bayer HealthCare. Retro maintains a flat, founder-driven organizational model intended to minimize bureaucratic friction while scaling specialized scientific teams.
    claimRefs:
      - CO005
      - CO006
      - CO007
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholders
    title: Capitalization Structure, Investors, and Governance Rights
    body: Retro’s initial capitalization was marked by an extraordinary single-backer commitment from OpenAI CEO Sam Altman, who provided the entire $180 million founding commitment in 2022 representing much of his personal liquid wealth. In May 2026, Retro completed the initial close of its subsequent financing round at a pre-money valuation of $1.8 billion. The financing was led by 4P Capital alongside an undisclosed consortium of longevity-focused investors. Beyond financial sponsors, Retro’s stakeholder network encompasses key academic and industrial collaborations, including a cell therapy partnership with the Murdoch Children's Research Institute and an applied artificial intelligence initiative with OpenAI that produced specialized protein-engineering models.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO003
  - id: pipeline-and-milestones
    title: Translational Pipeline Progress and Historical Milestones
    body: Retro has transitioned rapidly from early exploratory research into active clinical-stage evaluation. Within three years of lab inception and fifteen months from target selection, Retro advanced its lead candidate RTR242 into a Phase 1 clinical trial in late 2025. RTR242 is an orally administered small molecule designed to restart autophagic flux for clearing toxic protein aggregates in Alzheimer's disease patients. Early trial monitoring indicated no dose-limiting toxicities, with initial biomarker readouts anticipated in late 2026. Behind RTR242, Retro is advancing a diversified preclinical pipeline, including induced microglial progenitor RTR888 for central nervous system disorders, hematopoietic stem cell program RTR890, and in vivo tissue reprogramming therapies targeting osteoarthritis and age-related hearing loss.
    claimRefs:
      - CO003
      - CO004
      - CO014
      - CO015
    figureRefs:
      - FO001
