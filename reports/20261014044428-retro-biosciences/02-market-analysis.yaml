callouts:
  - calloutType: "insight"
    title: "Indication-Specific Approval Pathway Bypasses Regulatory Ambiguity Surrounding Aging"
    body: "Rather than waiting for regulatory agencies like the US FDA to formally classify aging as a treatable disease, Retro Biosciences strategically anchors its clinical assets to recognized disease indications such as Alzheimer's disease and blood disorders. This approach allows the company to leverage established surrogate endpoints, standard FDA review pathways, and existing institutional reimbursement codes, providing a viable commercial bridge toward broader preventative healthspan applications."
    claimRefs:
      - "CM008"
      - "CM010"
  - calloutType: "risk"
    title: "Rapid Competitive Invalidation and Market Shifts in Therapeutic Sub-Segments"
    body: "The commercial longevity landscape is vulnerable to rapid scientific obsolescence and displacement from adjacent pharmacological advances. Retro's deliberate exit from its blood plasma intervention program and deprioritization of its liver reprogramming candidate—following the widespread commercial adoption of GLP-1 receptor agonists in metabolic liver disease—demonstrates the operational volatility inherent in developing preclinical longevity assets."
    claimRefs:
      - "CM003"
      - "CM014"
