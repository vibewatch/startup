          pharma licensing deal
        - Clinical trial delays; failure to reproduce AI protein engineering in vivo; macro biotech contraction
        - 20% (low-to-moderate initial confidence)
      - - Base Case
        - $1.5B - $2.0B
        - >-
          RTR242 establishes safety without definitive efficacy; reprogramming advances to preclinical IND-enabling
          studies; follow-on capital raised flat
        - >-
          Extended development timelines; capital burn outpacing milestones; multiple compression to 1.0x invested
          capital
        - 55% (most likely market trajectory)
      - - Bear Case
