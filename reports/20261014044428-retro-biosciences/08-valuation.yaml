        - >-
          RTR242 encounters dose-limiting toxicity or Phase 1 futility; benefactor conviction diminishes; companion
          programs stalled
        - Full platform writedown; partner exits mirroring AbbVie-Calico precedent; liquidation near net cash
        - 25% (meaningful downside risk)
