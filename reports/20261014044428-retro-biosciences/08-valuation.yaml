callouts:
  - calloutType: recommendation
    title: 'Primary Stance: Maintain Research-More Stance at $1.8B Mark'
    body: >-
      While Retro Biosciences possesses elite scientific leadership, novel AI-enabled factor engineering, and an active
      human Phase 1 safety trial, the $1.8 billion post-round valuation prices substantial execution success ahead of
      verifiable human efficacy or peer-reviewed biological data. Investors should monitor initial Australian trial
      readouts rather than chasing unvalidated longevity multiples.
    claimRefs:
      - CV001
      - CV004
      - CV011
  - calloutType: risk
    title: 'Downside Warning: Benefactor Concentration and Category Attrition'
    body: >-
      Retro's reliance on Sam Altman's capital creates idiosyncratic governance and funding risks. In the event of
      market repricing or clinical stagnation, the history of high-profile longevity moonshots—exemplified by AbbVie's
      termination of its $1.75 billion Calico partnership—demonstrates that unpartnered preclinical platforms risk
      severe multiple compression.
    claimRefs:
      - CV006
      - CV010
      - CV013
