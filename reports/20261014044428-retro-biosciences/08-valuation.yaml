        - Demonstration of in vivo efficacy across two distinct programs
      - - AI Tooling Integration
        - OpenAI collaboration and bespoke GPT-4b micro design pipeline accelerates Yamanaka factor generation by 50x
        - >-
          Model weights and sequences remain unreleased, lacking peer-reviewed validation or proven translation to human
          safety
        - Peer-reviewed publication showing reproducible human cell reprogramming
