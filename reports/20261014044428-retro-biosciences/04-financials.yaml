company:
  name: Retro Biosciences
chapter:
  number: 4
  title: Financials
  summary: Retro Biosciences operates as a clinical-stage biotechnology enterprise funded through an initial $180 million seed commitment from Sam Altman and a 2026 financing round completed at a $1.8 billion pre-money valuation. While lead autophagy candidate RTR242 advances through Phase 1 evaluation, underwriting viability faces material private-data gaps regarding recurring operating burn, cell therapy manufacturing capital expenditures, and commercial unit economics.
sections:
  - id: sec-revenue-model
    title: Commercialization Structure and Pipeline Revenue Mechanics
    body: Retro Biosciences operates as a clinical-stage biotechnology enterprise without commercial-stage revenue, structured around five distinct therapeutic tracks aimed at multi-disease prevention and lifespan extension. The company's lead asset, RTR242, is an orally bioavailable small molecule designed to upregulate autophagic flux and restore lysosomal clearance in central nervous system disorders such as Alzheimer's disease. Longer-dated pipeline programs span cell therapies, including microglial progenitor replacement (RTR888) and hematopoietic stem cell rejuvenation (RTR890), alongside adeno-associated virus-delivered in vivo tissue reprogramming and small-molecule chemical rejuvenation. Commercial realization across these modalities relies upon conventional biopharmaceutical licensing, milestone-driven pharma partnerships, and eventual specialty distribution. Because all pipeline candidates remain in Phase 1 or preclinical development, Retro reports no commercial revenue, annual recurring revenue, or customer sales traction, leaving near-term financial viability entirely dependent upon external equity financing and grant funding.
    claimRefs:
      - CI003
      - CI005
      - CI009
      - CI012
      - CI014
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: sec-cost-structure
    title: Cost Architecture and Capital Intensity Across Modalities
    body: The operating cost architecture of Retro Biosciences exhibits significant capital intensity driven by the divergent requirements of small-molecule discovery, cell therapy biomanufacturing, and advanced computational biology. While small molecules such as RTR242 follow scalable chemical synthesis pathways with relatively low production costs, Retro's cell therapy and tissue reprogramming initiatives require dedicated biological infrastructure. To control supply and accelerate translation, Retro is deploying capital toward building an internal, in-house cell therapy manufacturing facility. Operating captive cleanrooms and clean manufacturing suites introduces substantial fixed overhead, equipment amortization, and specialized technical staffing expenses. Simultaneously, Retro relies on heavy computational modeling and AI protein engineering, leading to negotiations with US data center infrastructure operators to secure high-performance computing capacity. These combined commitments ensure that Retro's cost baseline expands rapidly as multiple programs transition from exploratory research into capital-intensive clinical trial execution.
    claimRefs:
      - CI003
      - CI005
      - CI008
      - CI009
    tableRefs:
      - TI002
  - id: sec-capital-adequacy
    title: Capital Adequacy, Cash Burn, and Financing Dependencies
    body: Retro Biosciences was established in 2021 with a substantial $180 million foundation of seed funding contributed by OpenAI chief executive Sam Altman, designed to fund exploratory discovery across multiple biological tracks over an extended operating window. In 2026, the company marked its transition into clinical-stage validation by completing an initial close of a new financing round at a $1.8 billion pre-money valuation led by 4P Capital. In parallel, market reporting indicates Retro has sought up to $1 billion in incremental expansion capital from family offices, venture funds, and sovereign wealth institutions to finance parallel human clinical trials and computational infrastructure. State regulatory filings in California confirm the entity operates in good standing under Delaware incorporation, with Jonathan Betts-LaCroix serving as Chief Executive Officer, Chief Financial Officer, and Secretary. Despite these substantial headline figures, exact cash balances, net cash burn, and remaining runway duration are undisclosed private metrics, creating underwriting dependency on management disclosures.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI006
      - CI007
      - CI011
      - CI013
    tableRefs:
      - TI003
  - id: sec-financial-verdict
    title: Financial Underwriting Verdict and Core Diligence Blockers
    body: From an investment diligence perspective, Retro Biosciences presents a bifurcated financial profile characterized by exceptional institutional backing alongside formidable capital requirements. The company's $1.8 billion pre-money valuation reflects enthusiasm for multi-disease preventative medicine and foundational AI biology, yet the enterprise possesses zero recurring revenue and operates with high, unquantified cash consumption. Scientific commentary underscores that established low-cost autophagy promoters like rapamycin already exist, meaning novel therapies like RTR242 must demonstrate unequivocal efficacy and safety advantages to justify premium pricing. Furthermore, running simultaneous clinical programs across cell therapy, gene therapy, and small molecules while expanding captive manufacturing facilities creates severe funding dependency. A failure to secure reported target capital rounds could force portfolio reprioritization or dilutive down-rounds. Prospective underwriters must condition valuation acceptance upon obtaining verified cash burn ledgers, Phase 1 biomarker data packages, and explicit manufacturing capital expenditure budgets.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI010
      - CI012
      - CI014
