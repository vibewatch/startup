callouts:
  - calloutType: risk
    title: Financing Dependency and Clinical Burn Escalation
    body: Advancing five parallel therapeutic modalities alongside in-house cell manufacturing and data center compute agreements creates substantial capital consumption, leaving Retro highly vulnerable to venture market conditions if subsequent $1 billion fundraising targets face execution delays.
    claimRefs:
      - CI004
      - CI005
      - CI008
  - calloutType: insight
    title: Valuation Premium Versus Clinical Stage Disconnect
    body: The reported $1.8 billion pre-money valuation places Retro at a high premium relative to typical Phase 1 biotechnology peers, reflecting Sam Altman's sponsorship and AI platform optionality rather than demonstrated clinical de-risking or commercial unit economics.
    claimRefs:
      - CI001
      - CI002
      - CI013
