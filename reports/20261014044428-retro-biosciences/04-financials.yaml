      - - Oral Autophagy Promoters (RTR242)
        - Chronic outpatient pharmacy benefit
        - $25,000 - $60,000 annually
        - Payer formulary tiering and step therapy
        - Commercial rebates of 30% to 50% required for broad access
        - Leqembi / Kisunla Alzheimer's amyloid monoclonal antibodies
      - - Microglial Cell Therapies (RTR888)
        - Specialty medical benefit procedural reimbursement
        - $250,000 - $500,000 per treatment course
        - Value-based outcomes agreements and hospital markups
        - Lack of established inpatient diagnosis-related group payment codes
        - Commercial autologous CAR-T cell therapy precedents
      - - AAV In Vivo Tissue Reprogramming
        - Specialty gene therapy single-dose benefit
        - $800,000 - $1,500,000 per patient
        - Annuity-style installment reimbursement or upfront grants
        - Medicaid statutory discounts and durability guarantees
        - FDA-approved adeno-associated virus gene therapies (Roctavian, Elevidys)
      - - Chemical Rejuvenation Combinations
        - Outpatient preventative maintenance regimen
        - Unregulated cash-pay or Tier 3 commercial co-pay
        - Extreme price elasticity if marketed for broad healthy longevity
        - Absence of FDA disease indication for non-pathological aging
        - Generic rapamycin, metformin, and senolytic clinical trials
