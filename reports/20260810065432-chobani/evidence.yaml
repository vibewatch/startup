evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Identities, stake sizes and rights of the October 2025 equity investors.
    whyItMatters: Investor quality, preference and control terms materially affect valuation and governance.
    diligencePath: Request the 2025 subscription agreement, cap table and board-composition disclosure.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, independent directors and minority-investor protections.
    whyItMatters: Founder control without disclosed governance raises succession and oversight risk.
    diligencePath: Obtain governance documents and board roster from the company in diligence.
    relatedQuestionRefs:
      - QO008
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: cover metrics
    missingEvidence: Audited revenue, margins, household penetration and post-raise leverage.
    whyItMatters: Underwriting the ~$20B valuation requires verified financials, not projections.
    diligencePath: Request audited financial statements and management accounts under NDA.
    relatedQuestionRefs:
      - QO019
      - QO026
      - QO018
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: conflicting-estimates
    missingEvidence: >-
      Reconciled publisher definitions and licensed scan-data methodology for yogurt, Greek yogurt, oat milk and dairy
      alternatives.
    whyItMatters: >-
      Inconsistent denominators can materially overstate TAM and make share-derived SAM and SOM calculations
      incomparable.
    diligencePath: >-
      Obtain publisher methodology pages and a licensed Circana or NielsenIQ category extract with geography, channel,
      value and volume fields.
    relatedQuestionRefs:
      - QM007
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: creamer
    missingEvidence: A defensible US coffee-creamer dollar denominator and Chobani creamer net sales, volume and share definition.
    whyItMatters: The reported 11–12% share cannot be translated into a market or revenue opportunity without a common denominator.
    diligencePath: >-
      Request category scan data and Chobani SKU-level sales, distribution, price and gross-to-net bridge for creamer
      and RTD coffee.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: som-gap
    missingEvidence: >-
      Chobani's category revenue bridge, retailer-level distribution, household penetration, repeat and attainable SOM
      assumptions.
    whyItMatters: >-
      A top-down TAM range does not establish the portion Chobani can profitably capture or support valuation
      underwriting.
    diligencePath: >-
      Request management's bottom-up plan, retailer scan data, household panel cohorts and contribution-margin
      sensitivity by category.
    relatedQuestionRefs:
      - QM024
      - QM026
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: segmentation-gap
    missingEvidence: Buyer-level revenue mix, channel mix, retailer concentration and conversion rates from trial to repeat purchase.
    whyItMatters: Segment economics determine whether adjacency growth is incremental or merely shifts existing household spend.
    diligencePath: Obtain customer concentration, trade-spend, velocity, repeat-rate and cohort analyses under NDA.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: constraints
    missingEvidence: SKU-level gross margins, commodity and packaging exposure, capacity utilization and quality-control costs.
    whyItMatters: >-
      Category growth can destroy value if private-label price pressure and fixed-cost absorption overwhelm revenue
      gains.
    diligencePath: >-
      Request three-year contribution-margin bridges, capex utilization plans, commodity sensitivities and retailer
      trade terms.
    relatedQuestionRefs:
      - QM021
      - QM022
      - QM023
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Matched-SKU prices, pack sizes, promotion depth and realized net pricing across Chobani, Danone, Lactalis, Fage,
      private label and adjacent beverages.
    whyItMatters: Without a common retailer, date and unit basis, premium durability and price elasticity cannot be underwritten.
    diligencePath: >-
      Obtain a retailer or Circana/Nielsen matched-SKU panel covering list price, promotion, units and net revenue by
      brand.
    relatedQuestionRefs:
      - QP014
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: displacement
    missingEvidence: >-
      Category-level cross-elasticity, household switching, repeat and substitution data for oat milk, creamers and
      private label.
    whyItMatters: >-
      The evidence identifies plausible substitutes but does not quantify how quickly adjacent categories can erode
      yogurt share or margin.
    diligencePath: >-
      Request household-panel cohorts, retailer switching data and category-level price elasticity by geography and
      channel.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
      - TP004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Channel-level CAC, payback, velocity, trade-spend and Daily Harvest retention metrics.
    whyItMatters: Without channel contribution data, growth may be purchased through promotions or costly fulfillment.
    diligencePath: >-
      Request retailer scan data, channel marketing cohorts, trade accruals and Daily Harvest repeat/fulfillment
      reports.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capex
    missingEvidence: Plant utilization, commissioning schedule and return-on-investment case for Rome and Twin Falls.
    whyItMatters: Announced capacity can depress margins and cash flow if volume ramps slower than depreciation and staffing.
    diligencePath: >-
      Request project budgets, throughput assumptions, utilization milestones, incentives and post-ramp unit-cost
      targets.
    relatedQuestionRefs:
      - QI014
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Post-raise cash balance, burn, runway, debt balance, interest rate, maturity and covenant package.
    whyItMatters: Capital adequacy and financing dependency cannot be tested from headline funding amounts alone.
    diligencePath: Obtain post-close balance sheet, 24-month liquidity forecast, debt agreements and covenant certificates.
    relatedQuestionRefs:
      - QI018
      - QI021
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: Revenue-recognition policy, gross-to-net deductions and acquisition purchase-accounting disclosures.
    whyItMatters: Reported sales and growth cannot be evaluated for timing, mix, or M&A comparability without these policies.
    diligencePath: Request audited statements, accounting policies, retailer deduction schedules and acquisition accounting memos.
    relatedQuestionRefs:
      - QI028
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: Retailer concentration, distributor terms, receivables aging, inventory turns and spoilage rates.
    whyItMatters: Working-capital intensity can convert headline growth into weak operating cash flow.
    diligencePath: Request customer concentration, AR aging, inventory reports, supplier terms and cold-chain loss KPIs.
    relatedQuestionRefs:
      - QI029
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Audited FY2025 revenue, gross margin, EBITDA, cash flow, units and price-volume-mix bridge.
    whyItMatters: A roughly $20 billion valuation cannot be underwritten from private projections and category signals alone.
    diligencePath: Request three years of audited financials plus monthly management reporting and segment/unit bridges.
    relatedQuestionRefs:
      - QI004
      - QI013
      - QI015
      - QI016
      - QI017
      - QI026
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: quality
    missingEvidence: Plant-level HACCP plans, certifications, microbiological testing, allergen controls and corrective-action logs.
    whyItMatters: Food safety and compliance are core trust inputs, yet public sources do not quantify control performance.
    diligencePath: Request current plant audit packets, certification register, environmental monitoring and CAPA history under NDA.
    relatedQuestionRefs:
      - QE019
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: recalls
    missingEvidence: Validated recall history, complaint rates, mock-recall results and trend data across Chobani and acquired brands.
    whyItMatters: A branded food platform's downside can be driven by quality incidents and response speed.
    diligencePath: Obtain five-year recall and complaint logs, retailer chargebacks, mock-recall tests and incident postmortems.
    relatedQuestionRefs:
      - QE021
      - QE026
    relatedTableRefs:
