  - id: TU003
    title: Named customer proof table
    columns: [Named account or proof point, Customer role, Production versus pilot, Observable proof, Outcome signal, Reference quality and freshness]
    rows:
      - [Walmart, "Mass retailer / buyer", production, "Live Chobani assortment at Walmart", "National availability; economics undisclosed", "Direct retailer page, current 2026"]
      - [Walmart Connect, "Retail media / commerce partner", production, "Chobani craft-and-commerce case study", "Commercial execution described; KPI detail limited", "Partner case study, current 2026"]
      - [Costco, "Club retailer / buyer", production, "20-count Greek Yogurt Variety Pack listing", "Stock-up format; renewal and velocity undisclosed", "Direct retailer page, current 2026"]
      - [Target, "Mass retailer / buyer", production, "Chobani brand page", "Assortment access; outcomes undisclosed", "Direct retailer page, current 2026"]
      - [Kroger, "Grocery retailer / buyer", production, "Chobani yogurt search assortment", "Grocery access; outcomes undisclosed", "Direct retailer page, current 2026"]
    notes: >-
      Every row is a commercial production proof point, not a pilot claim. Retail pages establish listing and
      partner status, but do not prove purchase-order duration, sell-through, profitability or renewal.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates named US retail and commerce accounts visible in Walmart, Costco, Target, Kroger and partner
        pages accessed on 2026-08-10; other regional retailers and undisclosed procurement accounts are excluded.
    claimRefs: [CU014, CU015, CU016, CU017, CU018, CU019, CU020]
  - id: TU004
    title: Retention / repeat usage / satisfaction table
    columns: [Signal, Source or cohort proxy, Observed direction, What it supports, What it cannot establish]
    rows:
      - [Replenishment category, "Yogurt, creamer and coffee formats", positive, "Repeat-use potential", "No repeat purchase rate"]
      - [Costco variety pack, Costco listing, positive, "Stock-up and household replenishment use case", "No household cohort data"]
      - [Walmart reviews, Walmart customer reviews, mixed-to-positive, "Consumers actively evaluate products", "Not representative satisfaction sample"]
      - [Independent Costco commentary, The Daily Meal review, positive, "Third-party usage and value commentary", "Cannot establish retention or causality"]
      - [PissedConsumer complaints, PissedConsumer review board, adverse signal, "Quality and packaging monitoring need", "Cannot estimate defect rate or churn"]
    notes: >-
      Public review and category signals are directional. No public NRR, churn, repeat cohort, cancellation,
      return-rate or verified satisfaction KPI is available for Chobani's private business.
    claimRefs: [CU021, CU022, CU023, CU024, CU025, CU026, CU027]
  - id: TU005
    title: Expansion and concentration risk table
    columns: [Driver or risk, Relevant customer or channel, Mechanism, Evidence, Diligence question, Risk view]
    rows:
      - [Mega-retailer leverage, "Walmart / Costco", "Large buyers can pressure price, trade spend and shelf terms", "Named production listings", "What share of net sales and gross profit comes from each?", high]
      - [Retailer breadth, "Target / Kroger / grocery", "More accounts diversify access but add execution complexity", "Live brand and search pages", "How many doors and what is distribution-weighted velocity?", medium]
      - [Private-label competition, "Mass, grocery and club", "Lower-priced retailer brands can displace shelf space", "US yogurt category context and retailer channels", "What is branded versus private-label elasticity?", high]
      - [Cold-chain and quality execution, "All refrigerated channels", "Fill rate, freshness and returns affect authorization", "Retail and adverse review signals", "Provide retailer scorecards, returns and quality incidents", medium]
      - [Adjacent expansion, "Coffee and Daily Harvest customers", "New occasions may increase basket and cross-sell", "La Colombe and Daily Harvest acquisitions", "What customer overlap and incremental retention exists?", medium]
    notes: >-
      Concentration is a risk assessment, not a disclosed customer-revenue ranking. Procurement friction includes
      slotting, promotions, pack-size demands, compliance, replenishment and private-label substitution.
    claimRefs: [CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
