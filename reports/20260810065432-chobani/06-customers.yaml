    claimRefs: [CU021, CU022, CU024, CU025, CU026, CU027, CU034]
callouts:
  - calloutType: strength
    title: Broad named retail access
    body: >-
      Walmart, Costco, Target and Kroger provide current production-scale proof across mass, club and grocery,
      while the portfolio supports multiple household occasions.
    claimRefs: [CU014, CU016, CU017, CU018, CU019]
  - calloutType: risk
    title: Distribution is not retention evidence
    body: >-
      Listings and reviews establish access and usage signals, but private-company opacity leaves repeat cohorts,
      retailer concentration, trade spend and account profitability unverified.
    claimRefs: [CU023, CU025, CU028, CU029, CU035]
