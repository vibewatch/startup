  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Customer growth / adoption trajectory table
      missingEvidence: Account-level shipments, store doors, ACV, velocity and year-over-year unit cohorts.
      whyItMatters: Retail listings show access but cannot establish the magnitude or trajectory of adoption.
      diligencePath: Request retailer sell-through, distribution-weighted velocity and shipment-to-scan reconciliation by channel.
      relatedQuestionRefs: [QU009]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: minor
      topic: named customer proof coverage
      missingEvidence: Complete list of Chobani retail and channel accounts beyond the five named public proof points.
      whyItMatters: Public retailer pages establish selected production relationships but cannot show the full account universe.
      diligencePath: Request the current customer master, authorized-door list and account-level shipment schedule.
      relatedQuestionRefs: [QU019, QU020]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Repeat-purchase, churn, NRR and satisfaction cohorts by product, account and acquisition channel.
      whyItMatters: Replenishment-category intuition is not a substitute for measured customer durability.
      diligencePath: Obtain cohort dashboards, loyalty-panel data, subscription cancellations and retailer return rates.
      relatedQuestionRefs: [QU026]
      relatedTableRefs: [TU004]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Customer revenue and gross-profit concentration, retailer terms, slotting and trade-spend schedules.
      whyItMatters: Mega-retailer dependence can transfer economics and renewal risk away from the brand owner.
      diligencePath: Request the top-20 account schedule, customer contracts, promotional accruals and account contribution margins.
      relatedQuestionRefs: [QU028, QU029]
      relatedTableRefs: [TU005]
    - type: missing-source
      severity: minor
      topic: Daily Harvest customer retention
      missingEvidence: Current DTC subscriber count, cohort retention and cross-sell overlap with Chobani households.
      whyItMatters: The acquisition's customer-expansion value cannot be assessed from transaction announcements alone.
      diligencePath: Request Daily Harvest CRM cohorts, cancellation data and post-acquisition customer overlap analysis.
      relatedQuestionRefs: [QU036]
    - type: missing-source
      severity: material
      topic: quality-risk
      missingEvidence: Verified complaint rates, packaging investigations, phthalate testing and retailer quality scorecards.
      whyItMatters: Adverse quality signals could reduce repeat purchase, increase returns and damage retailer trust.
      diligencePath: Obtain QA incident logs, test results, complaint taxonomy and retailer chargeback data.
      relatedQuestionRefs: [QU025, QU033, QU035]
    - type: private-evidence-only
      severity: material
      topic: customer economics
      missingEvidence: Retailer-specific gross-to-net waterfall, procurement cycle times and authorization renewal terms.
      whyItMatters: Broad distribution may mask high trade spend, slotting friction or low account profitability.
      diligencePath: Request account P&Ls, contract calendars, category-review outcomes and procurement correspondence.
      relatedQuestionRefs: [QU034, QU037]
