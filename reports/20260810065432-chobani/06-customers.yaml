runDate: "2026-08-10"
company:
  name: Chobani
chapter:
  number: 6
  title: Customers
  summary: >-
    Chobani serves both retail buyers and end consumers through US grocery, mass, club and convenience
    channels, with Walmart, Costco, Target and Kroger providing named production-scale proof. The brand
    appears to have broad distribution and repeat-oriented household use, but public evidence does not
    disclose customer concentration, cohort retention, NRR or retailer economics; complaints and packaging
    concerns make quality durability a live diligence question.
sections:
  - id: customer-architecture
    title: "Customer architecture: buyer, user and payer"
    body: >-
      Chobani's customer system has three distinct roles. Retailers and distributors are the B2B buyers
      that negotiate assortment, price, promotions, service levels and shelf placement; households are the
      end users choosing yogurt, creamers, oat milk, coffee or meals; and the shopper or household is the
      payer at checkout, except where a subscription or delivery intermediary bills directly. The company
      sells into US grocery, mass, club and convenience, so customer needs differ by channel: grocery
      shoppers seek routine breakfast and snack replenishment, club members buy larger variety packs,
      mass shoppers trade off convenience and price, and convenience shoppers prioritize portability and
      immediate consumption. Product use cases span high-protein nutrition, family snacking, coffee
      preparation, dairy-free substitution and ready-to-drink consumption. The acquired Daily Harvest
      relationship adds a more meal-oriented, digitally mediated use case, while La Colombe extends the
      brand into coffee occasions. Public sources identify the channels and products, but do not disclose
      account-level revenue, household penetration or payer mix, so the segmentation below is directional.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-distribution
    title: Adoption trajectory and distribution footprint
    body: >-
      Adoption is best evidenced by distribution breadth and the persistence of retail availability rather
      than by a disclosed cohort metric. Chobani's Walmart, Costco, Target and Kroger listings show that
      the brand is stocked across mass, club and grocery environments, and the Walmart Connect case study
      describes a live craft-and-commerce program rather than a laboratory pilot. Costco's 20-count variety
      pack is a format designed for planned household replenishment, while Walmart reviews and independent
      Costco commentary provide a consumer-facing signal that products are being purchased and evaluated in
      ordinary use. The 2007 Greek-yogurt launch and later expansion into high-protein yogurt, creamers,
      oat milk and coffee indicate a multi-occasion route to wider basket penetration. Daily Harvest also
      adds access to digitally engaged, meal-planning customers through an acquired platform. These are
      adoption proxies, not proof of a quantified household-retention curve: public materials do not give
      store counts, velocity, ACV, distribution-weighted penetration, repeat rate or year-over-year unit
      cohorts. Management diligence should therefore reconcile retailer sell-through with shipment data.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: named-customer-proof
    title: "Named customer proof: production relationships, not pilots"
    body: >-
      Named customer evidence is strongest where a retailer exposes a live assortment or a partner
      describes commercial execution. Walmart carries a Chobani catalog and Walmart Connect publishes a
      Chobani craft-and-commerce case study, which together support production shipping and merchandising
      at scale rather than a prospective pilot. Costco lists a 20-count Greek Yogurt Variety Pack, while
      Target and Kroger maintain Chobani brand or search pages; these are direct retail proof points, though
      they do not disclose purchase orders, margin, renewal terms or store-level velocity. The named proof
      is therefore high quality for existence and channel access, medium for outcomes, and low for account
      economics. Consumer reviews add a separate layer: Walmart reviews and an independent Costco review
      provide usage context, while PissedConsumer supplies adverse complaints. None of these public pages
      is a substitute for retailer-confirmed sell-through, but the cross-channel pattern is consistent with
      an established production footprint. Each listed retailer should be tested for current authorization,
      SKU count, fill rate, promotional dependence and gross-to-net terms.
    claimRefs: [CU014, CU015, CU016, CU017, CU018, CU019, CU020]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: retention-and-satisfaction
    title: Retention, repeat usage and satisfaction
    body: >-
      Yogurt, creamer and coffee are replenishment categories, so repeat purchase is economically important,
      but Chobani does not publish NRR, churn, repeat cohorts, household purchase frequency or a satisfaction
      score. Variety packs and broad everyday-use formats are compatible with recurring consumption, and
      Walmart and independent review pages show that consumers are actively rating products. The sentiment
      signal is mixed rather than uniformly promotional: the brand has visible loyalty and positive usage
      commentary, but PissedConsumer records complaints involving quality and packaging, and the diligence
      brief flags phthalate concerns and related consumer litigation. Complaint-board volume is not a
      representative satisfaction sample, so it should not be extrapolated into a defect rate; it is a
      monitoring signal that may affect repeat and retailer returns. Retention durability therefore remains
      an underwriting gap. Management should provide repeat purchase by cohort and channel, subscription
      cancellation data for any Daily Harvest-linked DTC activity, complaint/return rates, quality incident
      logs and retailer scorecards to distinguish brand affinity from promotional or distribution-driven
      sales.
    claimRefs: [CU021, CU022, CU023, CU024, CU025, CU026, CU027]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-and-concentration
    title: Expansion, concentration and procurement friction
    body: >-
      Expansion can come from more occasions per household, more SKUs per retailer and cross-selling into
      adjacent coffee and meal categories. Chobani's product breadth and Daily Harvest acquisition create
      those avenues, while high-protein yogurt and creamers provide contemporary reasons for retailers to
      add shelf space. The counterweight is concentration and procurement friction. Walmart and Costco are
      named anchor accounts with enormous negotiating leverage; Target and Kroger add breadth, but public
      evidence does not reveal the revenue share of any customer, the number of doors, slotting allowances,
      trade-spend burden, private-label displacement or retailer-specific gross margins. Club and mass
      buyers can demand pack-size and price concessions, and private-label yogurt competes for the same
      shelf and can make authorizations reversible. Chobani must also fund cold-chain execution, quality
      compliance, replenishment and promotional calendars across channels. A retailer listing proves access,
      not low procurement friction. The appropriate risk posture is that distribution is broad but economic
      dependence may still be high; concentration, terms, renewal and retailer-specific profitability are
      material diligence asks before treating national availability as durable moat.
    claimRefs: [CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU005]
