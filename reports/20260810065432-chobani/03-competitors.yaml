  - id: TP002
    title: Feature / capability matrix
    columns: [Buying criterion, Chobani, Danone, Lactalis, Focused specialists, Private label or internal build]
    rows:
      - [Greek-yogurt brand equity, "Strong; category leader", "Strong multi-brand", "Strong portfolio after acquisition", "Strong authenticity niche", "Variable by retailer"]
      - [High-protein innovation, "Core differentiator and growth driver", "Oikos/Two Good presence", "Evidence in retained pack not normalized", "Focused formulations", "Can imitate; quality varies"]
      - [Portfolio breadth, "Yogurt plus oat, creamer, coffee and meals", "Broad branded nutrition portfolio", "Dairy breadth plus Yoplait/Liberté/Siggi's", "Narrower specialist scope", "Retailer can span categories"]
      - [National distribution, "Scaled US retail and CTV support", "Incumbent global scale", "Incumbent dairy and acquired US shelf access", "More focused access", "Retailer-controlled shelf"]
      - [Trust / purpose narrative, "Founder-led trust and refugee employment", "Nutrition-led corporate brands", "Heritage dairy ownership", "Authenticity-led", "Lower national narrative; retailer trust"]
      - [Manufacturing and supply access, "Twin Falls plus Rome investment", "Global/US network", "Global dairy network and acquisition assets", "Smaller relative footprint", "Co-manufacturing or retailer specifications"]
    notes: >-
      Cells are evidence-backed ordinal assessments. "Evidence in retained pack not normalized" marks a
      genuine comparison gap rather than an assertion that a capability is absent.
    claimRefs: [CP015, CP016, CP019, CP020, CP021, CP025, CP030, CP032]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [Offer or channel, Unit / packaging logic, Included value proposition, Discount or promotion reality, Evidence status, Competitive implication]
    rows:
      - [Greek yogurt cups, "Single cups and multipacks", "Protein, taste and clean-label brand promise", "Retailer-specific promotions; realized price unknown", "Relative premium supported; numeric index unavailable", "Velocity and repeat must justify premium over private label"]
      - [High-protein yogurt and creamers, "Functional line extensions", "Convenience plus protein-led nutrition", "Launch and promotion cadence not fully disclosed", "Product presence confirmed; price series gap", "Innovation can defend margin only if copied slowly"]
      - [Oat milk and adjacent beverages, "Cartons and ready-to-drink occasions", "Plant-based or coffee convenience", "Oatly/Planet Oat and Chobani prices vary by retailer", "Competitor price comparison unresolved", "Cross-category substitution raises elasticity"]
      - [Private label, "Retailer-owned cups, cartons and creamers", "Acceptable function at value price", "Retailer controls promotions and shelf placement", "Industry threat confirmed; SKU economics gap", "Low switching costs make price gaps material"]
    notes: >-
      Public sources in this pack do not provide a consistent date, retailer, pack size and net-price basis;
      no row should be read as a precise price claim. Request a matched-SKU price and promotion panel.
    claimRefs: [CP007, CP017, CP022, CP027, CP029, CP035, CP036, CP039]
  - id: TP004
    title: Moat durability / competitive risk register
    columns: [Moat or advantage, Threat or failure mode, Severity, Current evidence, Mitigation or diligence ask]
    rows:
      - [Brand trust and Greek leadership, "Private label copies taste and nutrition cues", high, "Share leadership and private-label scale coexist", "Test repeat, net price and blind taste; track share by retailer"]
      - [High-protein innovation, "Incumbent portfolios launch comparable protein SKUs", medium-high, "Danone already has Oikos and Two Good", "Measure innovation-to-shelf lead time and incremental margin"]
      - [Manufacturing footprint, "Underutilized Rome or Idaho capacity burdens returns", medium-high, "$1.2B Rome investment and $500M Idaho expansion", "Obtain capacity plan, utilization, capex ROI and covenants"]
      - [Portfolio breadth, "Adjacent expansion dilutes focus or faces scaled rivals", medium, "La Colombe and Daily Harvest broaden scope", "Request category-level contribution margins and hurdle rates"]
      - [Retail distribution and CTV, "Retailer bargaining and promotion dependence", high, "Albertsons-NBCU collaboration shows data-led GTM", "Review customer concentration, trade spend and renewal terms"]
      - [Founder-led purpose, "Succession or governance discontinuity weakens trust", medium, "Ulukaya remains chairman, CEO and majority owner", "Obtain succession plan, board rights and key-person insurance"]
    notes: >-
      Severity is an analytical ranking, not a probability estimate. Adverse evidence from Circana, RSM and
      AInvest is intentionally included to prevent a one-sided moat narrative.
    claimRefs: [CP007, CP016, CP018, CP021, CP034, CP035, CP036, CP037, CP040]
