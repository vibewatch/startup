  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Matched-SKU prices, pack sizes, promotion depth and realized net pricing across Chobani, Danone, Lactalis, Fage, private label and adjacent beverages.
      whyItMatters: Without a common retailer, date and unit basis, premium durability and price elasticity cannot be underwritten.
      diligencePath: Obtain a retailer or Circana/Nielsen matched-SKU panel covering list price, promotion, units and net revenue by brand.
      relatedQuestionRefs: [QP014]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: displacement
      missingEvidence: Category-level cross-elasticity, household switching, repeat and substitution data for oat milk, creamers and private label.
      whyItMatters: The evidence identifies plausible substitutes but does not quantify how quickly adjacent categories can erode yogurt share or margin.
      diligencePath: Request household-panel cohorts, retailer switching data and category-level price elasticity by geography and channel.
      relatedQuestionRefs: [QP026]
      relatedTableRefs: [TP003, TP004]
