schemaVersion: "report-v2"
artifact: valuation
slug: chobani
runDate: "2026-08-10"
company:
  name: Chobani
chapter:
  number: 8
  title: Valuation & Recommendation
  summary: >-
    Chobani merits a track recommendation with medium confidence: the category-leading brand and roughly
    28% reported growth support a premium, but the October 2025 ~$20 billion post-money valuation implies
    about 5.3x projected sales while audited margins, leverage, cap-table rights and investor identities
    remain private. The valuation stance is stretched, with high risk; a price reset or verified economics
    would be required before an investable buy decision.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The investment thesis is that Chobani owns a scaled, trusted US Greek-yogurt franchise and is using
      that distribution and brand permission to extend into high-protein creamers, oat milk, ready-to-drink
      coffee and plant-based meals. Reported 2025 net sales of approximately $3.8 billion and roughly 28%
      year-over-year growth indicate unusual momentum for a large food company, while the company’s roughly
      20% total-yogurt share and more than 40% Greek-yogurt share, as reported by market sources, suggest
      meaningful retailer and consumer pull. The anti-thesis is valuation and evidence quality: $20 billion
      post-money is about 5.3x projected sales, above the 2.5–4x food-and-beverage sales range, before an
      investor can verify gross margin, EBITDA, net debt, cohort or household penetration. Private-label
      pressure, Danone and Lactalis competition, $1.7 billion-plus announced plant spending, leveraged debt,
      litigation and founder concentration can convert growth into poor equity returns. Thus product-market
      quality is stronger than underwriting certainty, and price—not brand admiration—drives the call.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007]
    tableRefs: [TV002]
  - id: recommendation-and-risk
    title: Recommendation, confidence and risk rating
    body: >-
      Recommendation: track. Confidence: medium. Risk rating: high. Valuation stance: stretched. This is
      not a judgment that Chobani is a weak business; it is a decision to preserve optionality until the
      investor receives audited or at least lender-quality financial statements, the post-raise cap table,
      preference stack and evidence that growth converts to durable margin. A buyer at the reported $20
      billion post-money price would need a credible path to roughly low-to-mid-teens EBITDA margins and
      sustained high-teens growth, or a strategic scarcity premium that is not yet publicly evidenced. A
      secondary or primary entry should therefore require a discount to the last mark, information rights,
      customary minority protections and a clear liquidity plan. Hold existing exposure only if the security
      has downside protection and the position is sized for high private-company risk; exit or decline if
      diligence shows weak contribution margins, heavy net leverage, punitive preferences or a growth reset.
      The recommendation can move to buy only after the evidence and price discipline improve; it should move
      to exit when the thesis-break triggers in this chapter are breached.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-entry
    title: Financing context and entry discipline
    body: >-
      The October 2025 $650 million equity round at approximately $20 billion post-money is the current
      financing anchor, but it is a negotiated private mark rather than a continuously priced market. It
      implies roughly 5.3x FY2025 projected net sales of $3.8 billion, versus typical food and beverage
      transaction and public-company sales multiples around 2.5–4x and low-to-mid-teens EV/EBITDA. The
      premium can be defensible for a scaled category leader growing near 28%, but public evidence does not
      establish the exact share class, liquidation preference, participating rights, ratchets, secondary
      component, option-pool refresh or investor vetoes. Earlier context is also mixed: a 2021 IPO sought
      more than $10 billion and was withdrawn in September 2022, while La Colombe added a reported $550
      million term loan and the company is committing at least $1.7 billion to Rome and Twin Falls capacity.
      Entry discipline should be based on normalized revenue, EBITDA, free cash flow and net debt—not the
      headline post-money. Require a fully diluted cap table, debt schedule, subscription agreement and
      downside waterfall; absent those, use a material discount to $20 billion and do not underwrite a buy.
    claimRefs: [CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021]
    figureRefs: [FV002]
  - id: scenarios-and-comps
    title: Scenario valuation and comparable set
    body: >-
      A scenario framework is more defensible than a single point estimate because Chobani’s private
      financials leave margins, debt and mix uncertain. The base case assumes sales compound from the
      approximately $3.8 billion 2025 projection at 12–15% for five years, EBITDA margin reaches 12–14%,
      and the exit multiple normalizes toward 3.0–3.5x sales; that produces a broad enterprise-value range
      below the current mark after allowing for net debt and dilution. The bull case assumes high-protein
      innovation, coffee cross-sell and plant utilization sustain 20%+ growth and a 15–17% margin, supporting
      a premium 4–5x sales outcome. The bear case assumes private-label share gains, input inflation,
      integration friction and multiple compression to 2–2.5x sales. Danone is a public branded benchmark;
      Oatly is a distressed public challenger; Lactalis/Yoplait and Siggi’s/Fage provide strategic private or
      M&A reference points, while the $20 billion round is the relevant primary mark. None is perfectly
      comparable, so each row states a limitation and the comparable table is explicitly partial.
    claimRefs: [CV022, CV023, CV024, CV025, CV026, CV027, CV028]
    tableRefs: [TV003, TV004]
    figureRefs: [FV003]
  - id: exit-readiness
    title: Exit readiness and return logic
    body: >-
      Chobani has strategic exit characteristics—national retail distribution, a recognizable consumer
      brand, manufacturing assets and adjacency options—but it is not exit-ready for a disciplined financial
      sponsor. The failed 2021 IPO and 2022 withdrawal demonstrate that public-market timing and disclosure
      standards matter; a future IPO would require audited statements, segment reporting, governance depth,
      controls and a cleaner leverage profile. Strategic buyers could value category leadership or coffee
      access, yet the La Colombe and Daily Harvest integrations, plant ramp and any preference overhang would
      complicate a sale process. A five-year investor case should target a gross return that compensates for
      private illiquidity and dilution; at the current ~$20 billion entry, even a 4–5x sales exit may not
      generate an attractive multiple if growth decelerates and new capital ranks senior. The practical exit
      plan is to obtain information rights now, monitor quarterly KPI and covenant reporting, and preserve a
      secondary-sale option only after transfer restrictions and buyer eligibility are clear. Thesis-break
      triggers include material margin erosion, leverage above agreed limits, failed plant utilization,
      regulatory or litigation cash losses, founder succession failure and a down round.
    claimRefs: [CV029, CV030, CV031, CV032, CV033, CV034]
    tableRefs: [TV005]
  - id: final-diligence
    title: Final diligence asks and decision gates
    body: >-
      The final diligence agenda is intentionally concentrated on facts that can move the recommendation or
      valuation stance. First obtain audited FY2023–FY2025 financials and monthly management accounts,
      including revenue by category, gross-to-net, gross margin, EBITDA, free cash flow, working capital and
      customer concentration. Second reconcile the fully diluted cap table to the October 2025 subscription
      agreement, employee equity plan, KDP consideration and any TPG rollover; map liquidation preferences,
      dividends, conversion, anti-dilution, board rights and option-pool treatment. Third test operating
      economics with plant-level utilization, yield, quality incidents, capex-to-capacity, retailer velocity,
      price/promo and repeat rates. Fourth obtain litigation, insurance, regulatory and labeling files and
      quantify phthalates and “natural”/allulose exposure. Finally validate acquisition synergies, debt
      covenants, refinancing needs, succession coverage and a realistic IPO or strategic-sale timetable.
      Until these asks are answered, the correct action remains track at a stretched stance; a verified
      margin and clean preference stack could upgrade the call, while any kill trigger should force exit or
      no-entry.
    claimRefs: [CV035, CV036, CV037, CV038, CV039, CV040, CV041, CV042]
    tableRefs: [TV006]
    figureRefs: [FV004]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Assessment, Evidence, Decision implication]
    rows:
      - [Recommendation, track, "Strong brand and growth but unverified economics", "Maintain optionality; do not buy at headline mark"]
      - [Confidence, medium, "Public reporting corroborates raise; private terms remain incomplete", "Seek primary documents before sizing"]
      - [Risk rating, high, "Founder concentration, leverage, capex and litigation exposure", "Use conservative sizing and downside protections"]
      - [Valuation stance, stretched, "~5.3x projected sales versus ~2.5–4x sector range", "Require discount or superior verified margins"]
      - [Return / hold / exit, "Hold only with protections; exit on triggers", "Illiquidity and dilution can absorb growth", "Set covenant, KPI and liquidity gates"]
    notes: >-
      The recommendation is price-sensitive and evidence-sensitive; it is not a quality score. “Track,”
      “medium,” “high” and “stretched” are the controlling words for report-meta mirroring.
    claimRefs: [CV008, CV009, CV010, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Dimension, Thesis, Anti-thesis, What would change the view]
    rows:
      - [Market, "Greek yogurt and high-protein demand support category leadership", "Private label and Danone/Lactalis can compress price and share", "Sustained share and price/mix data by channel"]
      - [Product, "Brand extensions create cross-sell into creamers and coffee", "Adjacency launches may dilute focus or add integration complexity", "Cohort-level repeat, contribution margin and innovation gates"]
      - [Customers, "National retail distribution creates scale and shelf access", "Retailer concentration and promotion dependence are undisclosed", "Top-customer terms, velocity and retention reporting"]
      - [Financials, "~28% reported growth can support premium economics", "$3.8B sales are projected and margins are private", "Audited statements and normalized EBITDA / FCF"]
      - [Competition, "Brand and manufacturing footprint are hard to replicate", "Oikos, Yoplait, Fage, Siggi's and Oatly remain credible", "Verified share, CAC, price realization and churn"]
      - [Risk, "Purpose and founder vision may strengthen workforce and brand", "Founder control, capex, debt and litigation increase downside", "Succession plan, covenants, insurance and case outcomes"]
    notes: >-
      Each thesis is paired with a falsifier so the investment committee can update rather than debate
      brand sentiment. The anti-thesis is most important at the current price.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV032]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Explicit assumptions, Valuation range, Probability signal, Downside trigger / implication]
    rows:
      - [Bull, "20%+ sales CAGR; 15–17% EBITDA margin; utilization and coffee cross-sell succeed", "$18–24B EV (4–5x sales)", "Low-to-medium; requires verified premium execution", "Margin or growth miss removes premium and delays liquidity"]
      - [Base, "12–15% sales CAGR; 12–14% EBITDA margin; 3–3.5x sales exit", "$11–16B EV", "Medium; reflects current evidence and normalization", "At $20B entry, dilution and debt make returns inadequate"]
      - [Bear, "5–8% CAGR; 8–10% margin; private-label pressure and 2–2.5x sales", "$6–9B EV", "Material; adverse evidence is plausible", "Down round, covenant stress or strategic sale at a loss"]
    notes: >-
      Ranges are illustrative enterprise-value scenarios, not a claim of a public market price. Equity value
      requires verified net debt, preferences and dilution; these unknowns are why the recommendation is track.
    claimRefs: [CV022, CV023, CV024, CV025, CV026]
  - id: TV004
    title: Comparable valuation table
    columns: [Comparable, Type / status, Metric or valuation reference, Relevance, Limitation]
    rows:
      - [Danone, "Public company", "~2–2.5x sales; low-to-mid-teens EV/EBITDA sector context", "Scaled branded dairy and yogurt benchmark", "Different geography, portfolio mix and disclosure"]
      - [Oatly, "Public company; distressed challenger", "Public-market multiple compression and loss-making profile", "Plant-based adjacency and downside signal", "Distressed economics are not a clean premium-brand comp"]
      - [Lactalis / Yoplait US, "Strategic M&A", "General Mills sold US yogurt business; terms/multiples not public", "Strategic buyer and yogurt consolidation reference", "Private buyer, undisclosed price and different assets"]
      - [Siggi's / Fage, "Private branded yogurt / M&A reference", "Private status; transaction valuation not publicly standardized", "Premium yogurt positioning and category overlap", "Limited current financial disclosure"]
      - [La Colombe, "Chobani acquisition, 2023", "$900M reported purchase price", "Shows adjacency appetite and coffee strategic value", "Target scale and deal structure differ; partly debt-funded"]
      - [Chobani October 2025 round, "Primary private financing", "$650M at ~$20B post-money; ~5.3x projected sales", "Most direct current price discovery", "Negotiated mark; preferences and financials undisclosed"]
    notes: >-
      This is a partial, decision-relevant sample of public, private and M&A references rather than an
      exhaustive universe. Sector multiple observations are triangulated from DealMatrix, Peakstone,
      Baker Tilly and Greenwich; company-specific rows rely on reported transactions and filings where
      available.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers selected public, private and M&A yogurt, dairy, plant-based and financing references; excludes
        unrelated food sectors and undisclosed transactions lacking a usable valuation boundary.
    evidenceGap:
      type: missing-source
      severity: material
      topic: comparable valuation
      missingEvidence: Current trading multiples, private transaction prices and normalized Chobani EBITDA are incomplete.
      whyItMatters: A partial comp set can overstate or understate the premium required for a private category leader.
      diligencePath: Obtain current public comps, banker transaction precedents and Chobani normalized financials.
      relatedTableRefs: [TV004]
    claimRefs: [CV023, CV026, CV027, CV028, CV031]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [Trigger, Threshold / event, Transmission to thesis, Action implication]
    rows:
      - [Growth reset, "Net sales growth below 10% for two periods", "Premium growth support for 5.3x sales disappears", "Freeze new entry; re-underwrite base case"]
      - [Margin compression, "EBITDA margin below 10% or down >300 bps", "Brand scale fails to translate into economics", "Exit or demand price reset"]
      - [Leverage / liquidity, "Net leverage above 4.0x or covenant breach", "Debt absorbs cash and restricts capex / exit", "Require cure plan; exit if unresolved"]
      - [Plant execution, "Rome or Twin Falls materially late, over budget or underutilized", "$1.7B+ capex destroys returns and capacity thesis", "Stop funding and reassess impairment"]
      - [Governance / succession, "No credible successor or minority protections", "Founder key-person risk becomes unbounded", "No-entry or seek protective rights"]
      - [Legal / product, "Material adverse judgment, recall or labeling enforcement", "Cash loss and brand trust damage sales", "Exit unless insured and quantified"]
    notes: >-
      Triggers are monitoring thresholds for an investment committee, not predictions. Thresholds should be
      calibrated to the audited baseline and debt documents once obtained.
    claimRefs: [CV006, CV031, CV032, CV033, CV034]
  - id: TV006
    title: Final diligence asks table
    columns: [Topic, Missing evidence, Why it matters, Owner / diligence path]
    rows:
      - [Financial statements, "Audited FY2023–FY2025 P&L, balance sheet, cash flow and monthly accounts", "Validate sales, margins, FCF and the 5.3x denominator", "CFO / NDA data room; quality of earnings"]
      - [Cap table / preferences, "Fully diluted ownership, 2025 subscription agreement, employee plan and KDP / TPG rights", "Quantify dilution, liquidation preference and control overhang", "General counsel; investor counsel review"]
      - [Debt, "Outstanding principal, rates, maturities, covenants and security package", "Measure equity value and refinancing risk", "Treasury / lenders; covenant certificate"]
      - [Unit economics, "Price/promo, gross-to-net, velocity, repeat and contribution margin by category", "Test whether growth is profitable and defensible", "Commercial analytics; retailer data"]
      - [Capex / plants, "Rome and Twin Falls budget, schedule, utilization, yield and quality KPIs", "Assess capital intensity and execution risk", "COO / plant visits; independent engineer"]
      - [Legal / regulatory, "Phthalates, natural, zero-sugar/allulose cases, recalls and insurance", "Quantify cash, labeling and brand downside", "General counsel / regulatory counsel"]
      - [Exit readiness, "IPO controls, audited reporting, transfer limits and strategic buyer map", "Determine liquidity and realistic return path", "Board / sponsor banker; sell-side readiness"]
    notes: >-
      These asks are prioritized by their ability to change recommendation, confidence, risk rating or
      valuation stance. Unanswered material asks keep the call at track rather than permitting false precision.
    claimRefs: [CV014, CV018, CV019, CV035, CV036, CV037, CV038]
