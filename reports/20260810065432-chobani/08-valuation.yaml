  evidenceGaps:
    - id: GV001
      type: private-evidence-only
      severity: blocking
      topic: 2025 cap table and preference stack
      missingEvidence: Investor identities, share classes, ownership, liquidation preferences, anti-dilution, board rights and secondary components from the October 2025 round.
      whyItMatters: Preference and control terms can make a headline $20B post-money mark materially different from common-equity value.
      diligencePath: Request the subscription agreement, fully diluted cap table, investor rights agreement and employee equity ledger under NDA.
      relatedQuestionRefs: [QV014, QV015]
      relatedTableRefs: [TV006]
    - id: GV002
      type: private-evidence-only
      severity: material
      topic: net debt and covenants
      missingEvidence: Current debt principal, interest, maturities, covenants, security package and post-raise cash balance.
      whyItMatters: Enterprise-value scenarios cannot translate into investor returns without net debt and covenant constraints.
      diligencePath: Obtain lender certificates, debt agreements, audited balance sheet and refinancing plan.
      relatedQuestionRefs: [QV016]
      relatedTableRefs: [TV003, TV006]
    - id: GV003
      type: missing-source
      severity: material
      topic: comparable transaction data
      missingEvidence: Current public trading multiples and disclosed private/M&A prices for yogurt, dairy and plant-based peers.
      whyItMatters: The premium or discount to Chobani's private mark cannot be calibrated from a partial comparable set.
      diligencePath: Commission a banker precedent transaction set and refresh public-company multiples at entry.
      relatedQuestionRefs: [QV005, QV006, QV019, QV020]
      relatedTableRefs: [TV004]
    - id: GV004
      type: private-evidence-only
      severity: material
      topic: audited economics
      missingEvidence: Category revenue, gross-to-net, gross margin, EBITDA, free cash flow, working capital and customer concentration.
      whyItMatters: Reported revenue growth may not create value if trade spend, input costs or mix suppress contribution margin.
      diligencePath: Request audited FY2023–FY2025 statements, quality-of-earnings work and monthly management accounts.
      relatedQuestionRefs: [QV003, QV013, QV030]
      relatedTableRefs: [TV006]
    - id: GV005
      type: missing-source
      severity: material
      topic: exit readiness
      missingEvidence: IPO controls, transfer restrictions, buyer eligibility, succession plan and strategic-sale timetable.
      whyItMatters: Private illiquidity and key-person dependence can prevent realization even if operating results are strong.
      diligencePath: Obtain board materials, governance policies, transfer provisions and an investment-bank exit assessment.
      relatedQuestionRefs: [QV027, QV028, QV029]
      relatedTableRefs: [TV005, TV006]
    - id: GV006
      type: adverse-evidence-gap
      severity: material
      topic: litigation and labeling
      missingEvidence: Complete pleadings, reserves, insurance, recall history and regulatory correspondence for packaging and labeling matters.
      whyItMatters: A judgment or recall could impair brand trust, cash flow and the premium multiple.
      diligencePath: Obtain counsel case chart, insurance tower, FDA correspondence and product-quality incident log.
      relatedQuestionRefs: [QV025]
      relatedTableRefs: [TV005, TV006]
