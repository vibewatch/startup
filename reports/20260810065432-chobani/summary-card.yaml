  topStrengths:
    - >-
      Clear US Greek-yogurt category leadership (~20% total US yogurt share, ~40%+ of Greek) with a trusted,
      founder-built brand.
    - Strong, durable top-line growth (~$3.8B projected 2025 net sales, ~28% YoY) outpacing legacy CPG rivals.
    - >-
      Diversified adjacency portfolio (oat milk, high-protein creamers, La Colombe RTD coffee, Daily Harvest) extending
      the brand beyond cups of yogurt.
    - >-
      Scaled, vertically integrated manufacturing and a $1.7B+ capacity build-out (Rome NY plant, Idaho expansion)
      creating a hard-to-replicate operating moat.
  topRisks:
    - >-
      Acute key-person dependence on founder, CEO and majority owner Hamdi Ulukaya, with thin public governance
      disclosure.
    - Stretched ~$20B valuation (~5x sales) versus 2.5-4x food & beverage comps, sensitive to any growth deceleration.
    - High capital intensity and leverage funding the plant build-out amid private-label and margin pressure.
    - >-
      Ongoing labeling and packaging litigation (phthalates, "only natural", "Zero Sugar"/allulose) and
      food-safety/recall exposure.
  unresolvedGaps:
    - Identity and terms (preferences, board rights) of the October 2025 equity investors are undisclosed.
