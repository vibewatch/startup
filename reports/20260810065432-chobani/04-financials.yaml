      Yogurt prices are indicative ranges supplied for diligence framing, not Chobani-disclosed realized
      prices; null cells mean public sources do not disclose a defensible price point.
    claimRefs: [CI002, CI008, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns: [Proxy, Public status, Why it matters, Directional driver, Diligence path]
    rows:
      - [Velocity per store per week, null, "Tests consumer pull and shelf productivity", "Brand, price, promotion and distribution", "Retailer scan data by SKU and geography"]
      - [Trade-spend rate, null, "Separates gross billings from net revenue", "Promotional intensity and retailer power", "Trade accrual schedule and net-sales bridge"]
      - [CAC / payback, null, "Tests DTC and launch efficiency", "Media, sampling and repeat purchase", "Channel marketing spend and cohort retention"]
      - [Gross profit per case, null, "Connects price, COGS and logistics", "Ingredients, packaging, freight and mix", "SKU-level contribution model"]
      - [Cold-chain spoilage / fill rate, null, "Measures service-delivery leakage", "Perishability and plant/distribution execution", "Plant and distributor operating KPIs"]
    notes: >-
      No public source supplies Chobani's unit economics; these are the minimum operating proxies needed
      to test the retail and DTC motions without inventing CAC or payback.
    claimRefs: [CI011, CI012, CI013, CI015, CI016]
  - id: TI005
    title: Public financial gaps table
    columns: [Metric, Public status, Underwriting consequence, Evidence gap, Diligence path]
    rows:
      - [FY2025 net sales, "~$3.8B projected / private", "Scale is not audited", "No filed income statement", "Request audited FY2025 statements and management accounts"]
      - [Revenue growth, "~28% YoY claimed", "Cannot isolate price, volume or M&A", "Prior-year base and bridge unavailable", "Obtain monthly sales and price/mix bridge"]
      - [Gross margin / EBITDA, "Not disclosed", "Margin path cannot be valued", "No public profitability schedule", "Request three-year P&L and segment margins"]
      - ["Cash, burn and runway", "Not disclosed", "Capital adequacy cannot be tested", "No liquidity forecast", "Request cash ledger, burn and 24-month forecast"]
      - [Debt balance and covenants, "Exact balance not public", "Leverage and downside unknown", "Only reported term-loan headline", "Request debt schedule and covenant certificates"]
      - ["CAC, payback and utilization", "Not disclosed", "Efficiency and capex returns unproven", "No channel or plant KPIs", "Request retailer cohorts, CAC and plant throughput"]
    notes: >-
      This table intentionally records absent private metrics and a concrete diligence path; null or
      unavailable does not mean zero.
    claimRefs: [CI003, CI004, CI022, CI023, CI024, CI025, CI026, CI027, CI033, CI038]
  - id: TI004
    title: Capital adequacy table
    columns: [Capital item, Amount / status, Role, Dependency or trigger, Verification]
    rows:
      - [October 2025 equity, "$650M at ~20B valuation", "Funds growth, innovation and manufacturing", "Post-raise liquidity and terms unknown", "Subscription agreement and cap table"]
      - [Leveraged term loan, "~$550M reported in 2023", "Part-financed La Colombe", "Interest, maturity and covenants", "Current debt schedule and lender package"]
      - [Rome NY plant, "$1.2B announced", "Third US dairy processing capacity", "Capex draw and ramp financing", "Construction budget and sources/uses"]
      - [Twin Falls expansion, "$500M announced", "Expand existing manufacturing footprint", "Utilization must precede returns", "Project ROI and utilization plan"]
      - [Cash / burn / runway, "Not publicly disclosed", "Determines need for next round", "Construction or working-capital shortfall", "Cash forecast and downside scenarios"]
      - [Next-round trigger, "No public trigger disclosed", "Potential equity or refinancing need", "Covenant breach or capex overrun", "Board-approved financing plan"]
    notes: >-
      Capital figures are public headlines and not a substitute for a post-raise balance sheet; the
      table separates committed instruments from unknown liquidity and financing triggers.
    claimRefs: [CI028, CI029, CI030, CI031, CI032, CI033, CI034]

