callouts:
  - calloutType: strength
    title: Scaled premium CPG platform
    body: >-
      The combination of a leading yogurt franchise, adjacent beverages and acquired coffee and meal
      platforms offers multiple routes to grow revenue if distribution and repeat purchase remain strong.
    claimRefs: [CI001, CI005, CI006, CI007, CI021]
  - calloutType: risk
    title: Capital intensity and private-company opacity
    body: >-
      A reported $3.8B sales base cannot yet be matched to gross margin, cash generation, leverage or
      plant utilization, while the announced manufacturing program increases downside duration.
    claimRefs: [CI003, CI022, CI023, CI028, CI030, CI033]

