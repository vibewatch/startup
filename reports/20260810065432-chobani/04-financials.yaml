      - [Coffee creamer, null, "Premium/high-protein creamer", "Promotional calendar and channel fees", "Realized net price and gross profit per unit"]
      - [RTD coffee / meal product, null, "Retail, partner distribution or DTC", "Distributor margin and fulfillment", "Channel-specific contribution margin"]
