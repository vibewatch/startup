schemaVersion: "report-v2"
artifact: financials
slug: chobani
runDate: "2026-08-10"
company:
  name: Chobani
chapter:
  number: 4
  title: Financials
  summary: >-
    Chobani presents a scaled, premium branded CPG model with projected FY2025 net sales of about
    $3.8 billion and roughly 28% growth, but the figure is private and unaudited. The portfolio can
    broaden wallet share through yogurt, oat milk, creamers, La Colombe coffee and Daily Harvest,
    while a $1.7 billion disclosed manufacturing program, acquisition leverage and absent margin,
    cash-flow and customer economics make underwriting dependent on private diligence.
sections:
  - id: revenue-and-monetization
    title: Revenue architecture and monetization
    body: >-
      Chobani earns revenue primarily by selling branded consumer packaged food and beverage through
      retail distribution, with Greek yogurt as the economic and brand anchor. The portfolio now adds
      oat milk, coffee creamers, ready-to-drink coffee and La Colombe products, plus Daily Harvest
      plant-based meals, creating several occasions and possible cross-category merchandising rather
      than a subscription-led software model. Public descriptions support a premium positioning: a
      typical branded yogurt cup is approximately $1-$1.50 and a multipack approximately $4-$6, but
      those are indicative shelf-price ranges rather than disclosed realized net prices. Retailer
      discounts, trade spend, promotional allowances, deductions, returns and distributor margins
      therefore determine recognized net sales. The reported approximately $3.8 billion FY2025 net
      sales and 28% growth are a private, unaudited projection, not a filed income statement. Revenue
      recognition policy, segment mix, acquisition accounting and the contribution of Daily Harvest
      and La Colombe are not public, so the apparent growth rate cannot yet be decomposed into price,
      volume, mix and M&A.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: go-to-market-efficiency
    title: GTM motion and sales-efficiency proxies
    body: >-
      The commercial motion is a high-volume retail CPG route to market: national grocery, mass,
      club, convenience and foodservice shelves are the likely demand surface, supported by brand
      marketing, distributor relationships, retailer category reviews and promotional calendars. The
      model is not sold through disclosed annual contracts, so SaaS-style CAC, payback and sales-cycle
      metrics are not available. Useful proxies are velocity per store per week, weighted distribution,
      repeat purchase, trade-spend rate, price realization after promotions, fill rate and the gross
      margin earned by each channel. Chobani's category leadership and premium positioning can improve
      shelf access and pricing power, while chilled logistics, spoilage, retailer deductions and
      promotional intensity can compress contribution. La Colombe adds RTD coffee distribution through
      Keurig Dr Pepper, and Daily Harvest adds a DTC/meal occasion, but public sources do not disclose
      channel-level revenue or economics. Accordingly, the underwriting question is whether brand
      pull and incremental distribution scale faster than trade investment and cold-chain complexity,
      not whether a conventional inside-sales funnel is efficient.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: cost-structure-and-capital-intensity
    title: Cost structure, working capital and capital intensity
    body: >-
      Chobani's cost base should be understood as a food-manufacturing system: milk and other
      ingredients, packaging, direct plant labor, utilities, quality and food-safety controls,
      freight, warehousing, retailer trade spend and marketing all sit between shelf price and cash
      generation. Dairy and packaging inflation, utilization, product mix and co-manufacturing or
      distribution choices are the principal gross-margin drivers, but no public gross-margin bridge
      or EBITDA schedule is available. Perishable inventory and retailer receivables create working-
      capital exposure, while supplier terms and promotional accruals can materially change cash
      conversion. The disclosed $1.2 billion Rome, New York plant and $500 million Twin Falls expansion
      imply at least $1.7 billion of announced manufacturing investment, before maintenance capex,
      integration spending or headquarters costs. New capacity can lower unit costs at utilization,
      but commissioning risk, ramp-up, depreciation and under-absorption create a near-term margin
      headwind. The adverse case is that private-label competition and scaling costs consume the
      benefit of premium pricing before the new assets reach efficient throughput.
    claimRefs: [CI014, CI015, CI016, CI017, CI018, CI019, CI020]
    figureRefs: [FI003]
  - id: public-traction-and-gaps
    title: Public traction versus private-metric gaps
    body: >-
      Public evidence supports meaningful scale but not a complete operating dashboard. Chobani
      reports or is reported to project approximately $3.8 billion of FY2025 net sales and 28% year-
      over-year growth, with a leading US Greek-yogurt position and a broadening product portfolio.
      It has a large Twin Falls footprint, a Rome plant under construction and a portfolio expanded by
      two acquisitions. Those indicators establish distribution and capacity ambition, but they do
      not establish revenue quality, utilization or cash returns. Public sources do not provide
      audited revenue, gross margin, EBITDA, operating cash flow, burn, exact debt balance, cap table,
      CAC, payback, customer or household counts, units sold, store-level velocity, or facility
      utilization. The $3.8 billion number is particularly important to mark as a gap: it is a private
      estimate or projection and cannot be reconciled to a public filing. A diligence-quality data
      room should bridge reported sales to audited statements, segment revenue, unit volumes, price/
      mix, retailer concentration, inventory turns and plant-level throughput. Until then, growth is
      credible as a market signal but not sufficient as a margin or valuation proof point.
    claimRefs: [CI021, CI022, CI023, CI024, CI025, CI026, CI027]
    tableRefs: [TI005]
  - id: capital-adequacy-and-financing
    title: Capital adequacy and financing dependency
    body: >-
      Chobani raised $650 million of equity in October 2025 at an approximately $20 billion valuation,
      with proceeds described as supporting growth, innovation and manufacturing. That equity provides
      strategic capacity, but it is not the same as disclosed operating liquidity: public sources do
      not show cash on hand, free cash flow, monthly burn, restricted cash, investor rights or the
      amount already committed to the plant program. A reported approximately $550 million leveraged
      term loan from 2023, used around the La Colombe transaction, introduces interest expense,
      refinancing and covenant sensitivity; S&P coverage confirms a rated credit context but not a
      public current balance. The combined acquisition and manufacturing agenda makes financing
      dependency a central diligence issue. A next-round trigger would be a cash shortfall during
      plant construction or a covenant/working-capital squeeze; conversely, internally funded capex
      and positive free cash flow would reduce dependence. The appropriate use-of-funds test is whether
      equity is funding capacity with visible utilization and returns, rather than masking operating
      losses. Investors should require a post-raise balance sheet, debt schedule, liquidity forecast,
      capex phasing and downside cases before treating the valuation as adequately capitalized.
    claimRefs: [CI028, CI029, CI030, CI031, CI032, CI033, CI034]
    tableRefs: [TI004]
    figureRefs: [FI005]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Financially, Chobani has the outline of a durable premium CPG compounder: a large yogurt base,
      adjacent categories, recognizable brands and enough scale to support manufacturing leverage.
      Revenue quality is directionally attractive if repeat retail demand, price realization and
      acquisition integration hold, but the evidence is not yet investable at the precision implied by
      a roughly $20 billion valuation. The principal margin path is operational: protect premium mix,
      control trade spend and commodity exposure, fill the Rome and Idaho assets, and demonstrate that
      La Colombe and Daily Harvest add contribution rather than complexity. Capital intensity is the
      counterweight: $1.7 billion of disclosed plant investment plus debt and integration spending can
      make free cash flow lumpy and increase downside duration. The 2022 IPO withdrawal is an adverse
      financing precedent, while private-label margin pressure is an adverse category signal. The
      verdict is research-more / conditional track: do not underwrite a precise return until audited
      statements, a segment and unit bridge, gross-margin and EBITDA history, cash/burn/runway, debt
      covenants, cap table, retailer economics and plant utilization are delivered. The $3.8 billion
      sales estimate is a useful scale marker, not a substitute for those blockers.
    claimRefs: [CI035, CI036, CI037, CI038, CI039, CI040, CI041, CI042]


