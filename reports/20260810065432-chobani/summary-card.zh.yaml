  topStrengths:
    - Chobani 在美国希腊酸奶品类坐稳第一（约占美国酸奶总市场 ~20%、希腊酸奶 ~40%+），创始人打造的品牌信任度高。
    - 收入增长强且有韧性（2025 年净销售额预计约 $3.8B，同比增长 ~28%），跑赢传统 CPG 对手。
    - 相邻品类已经铺开（燕麦奶、高蛋白奶精、La Colombe 即饮咖啡、Daily Harvest），把品牌从杯装酸奶延展出去。
    - 制造端规模化且纵向一体化，超过 $1.7B 的产能建设（纽约 Rome 工厂、Idaho 扩产）正在垒出难复制的运营护城河。
  topRisks:
    - 公司高度依赖创始人、CEO 兼多数股东 Hamdi Ulukaya，公开治理披露很薄。
    - 约 $20B 估值偏紧（约 5x 销售额），高于食品饮料可比公司的 2.5–4x；增长一旦放慢，估值很敏感。
    - 自有品牌竞争和利润率压力并存，工厂扩张又需要高资本开支和杠杆融资。
    - 标签和包装诉讼仍在推进（邻苯二甲酸酯、「only natural」、「Zero Sugar」/ 阿洛酮糖），食品安全和召回风险也暴露在外。
  unresolvedGaps:
    - 2025 年 10 月股权投资人的身份和条款（优先权、董事会权利）尚未披露。
    - 没有审计财务：毛利率、EBITDA、现金消耗、现金跑道和确切债务余额均未公开。
    - 客户 / 零售商集中度和留存指标（复购率、NRR）尚未披露。
