company:
  name: Chobani
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Chobani is the leading US Greek-yogurt maker, founded by Turkish-immigrant Hamdi Ulukaya, who
    remains founder, CEO and majority owner. In October 2025 it raised $650M in equity at a roughly
    $20 billion valuation and projects about $3.8 billion in 2025 net sales, funded by a diversified
    portfolio (yogurt, oat milk, creamers, La Colombe coffee, Daily Harvest) and a major US
    manufacturing build-out. Key gaps: undisclosed 2025 investors and no audited public financials.
sections:
  - id: identity-and-model
    title: Identity, headquarters and business model
    body: >-
      Chobani is a privately held US food and beverage company best known as the leading American
      Greek-yogurt brand. It was founded by Hamdi Ulukaya, a Turkish immigrant of Kurdish descent
      who bought a shuttered Kraft yogurt plant in upstate New York with a Small Business
      Administration loan and launched Chobani-branded Greek yogurt in 2007 after starting a small
      feta operation in 2005. The company is headquartered in Norwich, New York, and operates what
      it describes as one of the world's largest yogurt manufacturing facilities in Twin Falls,
      Idaho, alongside its original upstate New York plants. Chobani's core business model is
      branded consumer packaged goods: it manufactures dairy and plant-based products and sells them
      through US grocery, mass, club and convenience retail channels, competing on protein content,
      clean-label positioning and brand trust. Over the past several years the company has broadened
      well beyond cups of yogurt into oat milk, coffee creamers, ready-to-drink coffee and, through
      acquisition, La Colombe coffee and Daily Harvest meal kits. This chapter establishes the
      identity, leadership, capital structure, scale metrics and milestone chronology that later
      chapters treat as ground truth, and flags where private-company opacity forces reliance on
      company statements rather than audited disclosure.
    claimRefs: [CO007, CO008, CO009, CO023, CO024]
  - id: leadership-governance
    title: Founders, leadership and governance
    body: >-
      Chobani's identity is inseparable from founder Hamdi Ulukaya, who serves as chairman and chief
      executive and remains the majority owner, giving the company an acute key-person dependence
      that recurs across the risk and valuation chapters. Ulukaya built Chobani around a
      purpose-driven, employee-centric philosophy: roughly three in ten of its workers are
      immigrants or refugees, and in 2016 he pledged equity stakes to long-tenured employees through
      an ownership program. He founded the Tent Partnership for Refugees in 2016, a coalition that
      mobilizes hundreds of companies to hire and integrate refugees, and has used Chobani's brand
      to advance humanitarian causes. Governance detail is comparatively thin for a company of this
      scale: as a private, founder-controlled business, Chobani discloses little about its board
      composition, independent directors or the rights attached to the equity sold in 2025. The
      concentration of ownership and decision-making in a single founder is simultaneously a
      strength — consistent long-term vision and brand stewardship — and a governance risk, because
      succession, board independence and minority-investor protections are not publicly verifiable.
      Leadership continuity below the founder, and the identities of the 2025 equity investors, are
      documented gaps carried into diligence.
    claimRefs: [CO011, CO012, CO013, CO014, CO003]
    tableRefs: [TO002]
  - id: funding-valuation
    title: Funding history, valuation and capital
    body: >-
      Chobani's headline capital event is an October 2025 equity raise of $650 million that the
      company and press reported at a valuation of roughly $20 billion, a dramatic step-up from the
      sub-$10 billion figures discussed around its aborted 2021-2022 initial public offering. The
      company said proceeds would fund capacity expansion and innovation, including a $1.2 billion
      dairy plant in Rome, New York and a $500 million expansion in Twin Falls, Idaho, but it did not
      publicly disclose the identities of the 2025 investors, describing them only as long-term,
      industry-oriented backers. Earlier in its history Chobani took a reported $750 million minority
      investment from TPG in 2014 and financed its 2023 La Colombe acquisition partly with a $550
      million term loan, leaving it with meaningful leverage that the financials chapter examines.
      The company filed to go public in November 2021 seeking a valuation above $10 billion, then
      withdrew the registration in September 2022 as the IPO market cooled. Because Chobani is
      private and does not publish audited statements, its true revenue, margin and balance-sheet
      position rest on company statements and press reporting rather than filings, and the 2025
      round's terms — preference, control and secondary components — are not public.
    claimRefs: [CO001, CO002, CO003, CO005, CO015, CO016, CO017, CO018]
    tableRefs: [TO003]
    figureRefs: [FO003]
  - id: scale-and-cover-metrics
    title: Scale and cover metrics
    body: >-
      On scale, Chobani projects approximately $3.8 billion in net sales for 2025, which it frames as
      about 28% year-over-year growth, and employs an estimated 5,000-plus people across
      manufacturing, R&D and commercial functions. It holds a leading share of the US Greek-yogurt
      category and a high-teens-to-20% share of the total US yogurt market, figures explored in the
      market and competitor chapters. Several cover metrics that investors would normally underwrite
      cannot be verified from public sources: audited revenue and profitability, gross and operating
      margins, customer or household penetration counts, net leverage after the 2025 raise, and the
      valuation's implied revenue multiple all depend on private data. The revenue figure itself is a
      company projection rather than an audited result, so it is treated as company-claimed. Where a
      cover metric is unsupported, this report records a null value plus a concrete diligence path —
      for example, requesting audited financials, a capitalization table and the 2025 subscription
      agreement — rather than substituting an estimate. The KPI snapshot table and figure summarize
      what is verifiable today and what remains an evidence gap.
    claimRefs: [CO004, CO006, CO010, CO024, CO025, CO026]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: milestones
    title: Milestone chronology
    body: >-
      Chobani's milestone chronology runs from its 2005 founding and 2007 product launch through
      rapid category leadership by the early 2010s, a 2014 TPG minority investment, the 2021 IPO
      filing and its 2022 withdrawal, the December 2023 acquisition of La Colombe, the May 2025
      acquisition of Daily Harvest, the 2025 groundbreaking of a $1.2 billion Rome, New York plant,
      and the October 2025 $650 million raise at a roughly $20 billion valuation. Interwoven are
      governance and social milestones — the 2016 employee-ownership pledge and founding of the Tent
      Partnership for Refugees — and adverse events such as the withdrawn IPO and, more recently,
      consumer-protection litigation over "natural," "zero sugar" and packaging claims addressed in
      the risks chapter. This single chronology of record anchors dating and sequencing for every
      later chapter, and the milestone timeline figure and table below present the dated entries with
      type tags and implications so that financing, product, scale, regulatory and adverse threads
      can be traced consistently. Two milestones — the exact 2025 investor syndicate and the precise
      Daily Harvest consideration — remain undated or undisclosed and are logged as gaps.
    claimRefs: [CO018, CO020, CO021, CO022, CO015, CO016, CO001, CO014]
    tableRefs: [TO004]
    figureRefs: [FO002]
