callouts:
  - calloutType: strength
    title: Category-defining brand with scaled manufacturing
    body: >-
      Chobani created the modern US Greek-yogurt category and has scaled to a projected ~$3.8B in
      2025 sales with a major US manufacturing build-out, giving it durable brand and distribution
      advantages.
    claimRefs: [CO004, CO021, CO023]
  - calloutType: risk
    title: Founder concentration and private-company opacity
    body: >-
      Founder Hamdi Ulukaya controls strategy, capital and brand as majority owner, and the absence
      of audited financials or disclosed 2025 investors leaves valuation and governance hard to
      verify.
    claimRefs: [CO011, CO003, CO024]
