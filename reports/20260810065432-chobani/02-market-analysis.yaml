      - [Plant-based household, "Non-dairy milk and flexible dietary choice", "Household shopper; retail buyer allocates plant-based shelf", "Oat-milk trial, repeat, then cross-category basket", "Taste, price and category competition", "CM014, CM015, CM022, CM026"]
      - [Coffee-at-home consumer, "Convenience, flavor and protein in creamer or cold brew", "Household shopper; coffee category buyer controls placement", "Creamer trial or RTD cold brew, then repeat occasion", "Incumbent Coffee mate and International Delight", "CM016, CM017, CM018, CM027"]
      - [Retail category buyer, "Velocity, margin, reliable supply and differentiated demand", "Retail banner or distributor pays supplier and manages trade budget", "Authorization, planogram, promotion, replenishment, expanded facings", "Spoilage, trade spend and private-label substitution", "CM021, CM023, CM031, CM032"]
