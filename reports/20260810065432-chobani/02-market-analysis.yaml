schemaVersion: "report-v2"
artifact: market-analysis
slug: chobani
runDate: "2026-08-10"
company:
  name: Chobani
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Chobani participates in a large US yogurt core, led by Greek yogurt, and extends into oat milk,
    dairy alternatives, coffee creamer and ready-to-drink coffee. The evidence supports an approximately
    $11–13 billion US yogurt boundary and strong Greek-yogurt position, but publisher definitions diverge
    materially across adjacent categories; exact SAM, SOM and household penetration remain diligence gaps.
sections:
  - id: market-boundary
    title: Market boundary and competitive substitutes
    body: >-
      The relevant market boundary begins with US retail yogurt, measured as branded and private-label
      refrigerated yogurt sold through grocery, mass, club, convenience and e-commerce channels. Within
      that boundary, Greek yogurt is the principal subcategory and the cleanest lens on Chobani's core
      position. Included spend is the consumer's recurring purchase of yogurt cups, multipacks and
      drinkable formats, together with adjacent spend that can plausibly be won by the same brand, shelf
      presence and cold-chain capabilities: oat milk, plant-based dairy alternatives, protein-forward
      creamers and ready-to-drink cold brew. Excluded from the core TAM are foodservice-only yogurt,
      restaurant beverages, unrelated plant-based meals and broad coffee occasions that do not share
      Chobani distribution or a credible product substitution path. The status quo is not simply another
      yogurt brand: consumers can substitute private label, conventional dairy yogurt, cottage cheese,
      oatmeal, fruit or a coffee beverage, while retailers can substitute shelf space toward lower-priced
      private label. This boundary prevents an inflated TAM while recognizing adjacency optionality.
    claimRefs: [CM001, CM002, CM005, CM006, CM007, CM020, CM021, CM034]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: sizing-lenses
    title: Sizing through multiple lenses
    body: >-
      A single market number is not decision-useful because publishers count different geographies,
      channels, product forms and forecast years. The evidence-constrained base case uses the supplied
      US yogurt estimate of roughly $11–13 billion, then applies a Greek-yogurt share of about 50% to
      derive an implied Greek pool of approximately $5.5–6.5 billion. Chobani's approximately 20% total
      yogurt share and 40% or greater Greek share provide two company-specific lenses, implying a larger
      core revenue opportunity than a simple brand-share claim can prove. A second lens treats oat milk
      and dairy alternatives as adjacent pools: the sources establish meaningful and growing categories,
      but their denominators vary between oat milk, plant-based milk and all dairy alternatives. A third
      lens uses coffee creamer and RTD cold brew as occasion adjacencies; Chobani's creamer share is
      approximately 11–12%, while the market denominator remains publisher-dependent. The analysis
      therefore presents ranges and shares rather than a false precision SOM, and preserves conflicting
      estimates for a diligence request.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016, CM017, CM019, CM036]
    tableRefs: [TM002]
    figureRefs: [FM002]
  - id: buyer-segmentation
    title: Buyer, user and payer segmentation
    body: >-
      The economic buyer for Chobani is usually a retail category manager or buyer who controls shelf
      placement, assortment, promotions and replenishment, while the payer is the retail banner or
      distributor that purchases inventory and remits trade terms. The end user is a household shopper
      choosing yogurt, milk or coffee products for taste, protein, convenience, dietary preference and
      price; the consumer may be a different person from the budget owner. Foodservice and convenience
      operators can act as secondary buyers for single-serve and cold-brew formats, but the evidence does
      not establish their share of Chobani sales. Adoption proceeds from buyer authorization and planogram
      placement, through trial supported by promotions and sampling, to repeat purchase and expanded
      facings. Greek-yogurt credibility lowers trial friction in core yogurt; protein claims and adjacent
      formats create permission to cross-sell. Retailer margin, velocity, spoilage, cold-chain execution
      and private-label alternatives determine whether a listing becomes durable distribution.
    claimRefs: [CM020, CM021, CM022, CM023, CM024, CM032, CM034, CM038]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: growth-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      The most credible growth drivers are high-protein demand, Greek-yogurt category leadership,
      premium-but-accessible clean-label positioning, and adjacency expansion into oat milk, creamers and
      RTD cold brew. Chobani's official portfolio and its La Colombe and Daily Harvest transactions show
      a strategy of extending brand permission beyond yogurt, while the protein-yogurt evidence points to
      a favorable consumer need state. New manufacturing capacity can support availability and reduce
      bottlenecks if utilization and input economics justify the investment. Constraints are equally
      material: private-label CPG scale creates price and margin pressure; dairy, packaging, logistics and
      refrigeration costs can compress contribution; retailer promotions can train consumers to buy on
      discount; and new categories require distinct formulas, equipment and quality controls. Oat milk
      and plant-based categories also carry competitive intensity and changing consumer preferences.
      Adoption is therefore gated by velocity, repeat rates and profitable trade spend, not merely by
      distribution breadth or headline category growth.
    claimRefs: [CM014, CM015, CM018, CM025, CM026, CM027, CM028, CM029, CM030, CM031, CM032, CM040]
    tableRefs: [TM004]
    figureRefs: [FM004]
  - id: diligence-gaps
    title: Sizing uncertainty and diligence priorities
    body: >-
      The central diligence issue is denominator discipline. Mordor, Persistence, Verified Market
      Research and Global Market Insights publish yogurt estimates that cannot be reconciled without
      confirming whether each counts retail only, foodservice, value sales, volume, or global spillover;
      Statista and Emergen introduce additional Greek and plant-based definitions. Fortune's oat-milk and
      dairy-alternatives estimates likewise describe different universes. The report preserves those
      contradictions rather than selecting the largest number. Chobani's exact SOM, household
      penetration, net price realization, retailer concentration, repeat purchase, creamer denominator
      and RTD cold-brew economics are not established by the supplied public evidence. Management should
      provide a category-by-category revenue bridge, Circana or equivalent scan data, retailer-level
      velocity and trade-spend data, cohort or household penetration, gross-to-net waterfalls, and a
      capacity-utilization plan. Sensitivity cases should hold the core yogurt pool constant while
      varying Greek share, adjacency conversion, private-label price gaps and gross margin. Until those
      inputs are available, the addressable-market conclusion is directional rather than an investable
      bottom-up SOM.
    claimRefs: [CM019, CM035, CM036, CM037, CM038, CM039, CM040]
