callouts:
  - calloutType: strength
    title: Core category leadership creates adjacency permission
    body: >-
      A roughly 50% Greek-yogurt category mix and Chobani's reported 40% or greater Greek share provide
      a credible base from which to test protein, oat-milk, creamer and RTD occasions.
    claimRefs: [CM002, CM003, CM011, CM013, CM014]
  - calloutType: risk
    title: Market size is not yet a bottom-up SOM
    body: >-
      Publisher estimates use inconsistent definitions, while Chobani's household penetration, retailer
      economics, creamer denominator and exact SOM are not public; the $11–13B core range should not be
      treated as a forecast of attainable revenue.
    claimRefs: [CM009, CM019, CM035, CM036, CM037]
