  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: conflicting-estimates
      missingEvidence: Reconciled publisher definitions and licensed scan-data methodology for yogurt, Greek yogurt, oat milk and dairy alternatives.
      whyItMatters: Inconsistent denominators can materially overstate TAM and make share-derived SAM and SOM calculations incomparable.
      diligencePath: Obtain publisher methodology pages and a licensed Circana or NielsenIQ category extract with geography, channel, value and volume fields.
      relatedQuestionRefs: [QM007, QM025]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: creamer
      missingEvidence: A defensible US coffee-creamer dollar denominator and Chobani creamer net sales, volume and share definition.
      whyItMatters: The reported 11–12% share cannot be translated into a market or revenue opportunity without a common denominator.
      diligencePath: Request category scan data and Chobani SKU-level sales, distribution, price and gross-to-net bridge for creamer and RTD coffee.
      relatedQuestionRefs: [QM010]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: blocking
      topic: som-gap
      missingEvidence: Chobani's category revenue bridge, retailer-level distribution, household penetration, repeat and attainable SOM assumptions.
      whyItMatters: A top-down TAM range does not establish the portion Chobani can profitably capture or support valuation underwriting.
      diligencePath: Request management's bottom-up plan, retailer scan data, household panel cohorts and contribution-margin sensitivity by category.
      relatedQuestionRefs: [QM024, QM026]
      relatedTableRefs: [TM002, TM003]
    - type: missing-source
      severity: material
      topic: segmentation-gap
      missingEvidence: Buyer-level revenue mix, channel mix, retailer concentration and conversion rates from trial to repeat purchase.
      whyItMatters: Segment economics determine whether adjacency growth is incremental or merely shifts existing household spend.
      diligencePath: Obtain customer concentration, trade-spend, velocity, repeat-rate and cohort analyses under NDA.
      relatedQuestionRefs: [QM026]
      relatedTableRefs: [TM003]
    - type: private-evidence-only
      severity: material
      topic: constraints
      missingEvidence: SKU-level gross margins, commodity and packaging exposure, capacity utilization and quality-control costs.
      whyItMatters: Category growth can destroy value if private-label price pressure and fixed-cost absorption overwhelm revenue gains.
      diligencePath: Request three-year contribution-margin bridges, capex utilization plans, commodity sensitivities and retailer trade terms.
      relatedQuestionRefs: [QM021, QM022, QM023]
      relatedTableRefs: [TM004]
