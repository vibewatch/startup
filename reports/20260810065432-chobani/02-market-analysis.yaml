      - [Chobani core share lens, "~20% total yogurt; ~40%+ Greek", "Share claims imply brand scale but do not establish revenue or profit", medium, "CM012, CM013"]
      - [Oat milk lens, "Meaningful US adjacent category; no single reconciled value", "Fortune, Mordor and Statista count different oat/plant-milk universes", medium, "CM014, CM019, CM039"]
      - [Dairy alternatives lens, "Meaningful adjacent category; range remains publisher-dependent", "Fortune and Emergen cover different plant-based definitions", medium, "CM015, CM019, CM036"]
      - [Creamer and RTD lens, "Creamer share ~11–12%; denominator ~$X unresolved", "Share and occasion adjacency are usable before a clean market-dollar estimate", low, "CM016, CM017, CM018"]
    notes: >-
      Dollar figures are nominal, rounded and evidence-constrained; implied Greek dollars are arithmetic
