        - 私营状态；交易估值缺乏公开统一口径
        - 高端酸奶定位和品类重叠
        - 当前财务披露有限
      - - La Colombe
        - Chobani 2023 年收购
        - 报道收购价 $900M
        - 显示相邻品类胃口和咖啡战略价值
        - 标的规模和交易结构不同；部分靠债务融资
      - - Chobani 2025 年 10 月轮次
        - 一级市场私募融资
        - 融资 $650M，投后估值约 $20B；约 5.3x 预期销售额
        - 最直接的当前价格发现
        - 协商估值；优先权和财务数据未披露
    notes: >-
      这只是与决策相关的部分样本，覆盖上市、私营和 M&A 参照，并非穷尽全量可比对象。行业倍数观察由 DealMatrix、Peakstone、Baker Tilly 和 Greenwich
      交叉校验；公司特定行则尽量依赖报道交易和申报文件。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers selected public, private and M&A yogurt, dairy, plant-based and financing references; excludes unrelated
        food sectors and undisclosed transactions lacking a usable valuation boundary.
    evidenceGap:
      type: missing-source
      severity: material
      topic: comparable valuation
      missingEvidence: Current trading multiples, private transaction prices and normalized Chobani EBITDA are incomplete.
      whyItMatters: A partial comp set can overstate or understate the premium required for a private category leader.
      diligencePath: Obtain current public comps, banker transaction precedents and Chobani normalized financials.
      relatedTableRefs:
        - TV004
    claimRefs:
      - CV023
      - CV026
      - CV027
      - CV028
      - CV031
  - id: TV005
    title: 论点破坏与终止触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 增长重置
        - 净销售额增长连续两期低于 10%
        - 支撑 5.3x 销售额倍数的溢价增长消失
        - 暂停新增进入；重写基准情景
      - - 利润率压缩
        - EBITDA 利润率低于 10% 或下降 >300 bps
        - 品牌规模未能转化为经济性
        - 退出，或要求价格重置
      - - 杠杆 / 流动性
        - 净杠杆高于 4.0x 或违反契约
        - 债务吞掉现金，并限制资本开支 / 退出
        - 要求补救方案；未解决则退出
      - - 工厂执行
        - Rome 或 Twin Falls 严重延期、超预算或利用率不足
        - $1.7B+ 资本开支毁掉回报和产能论点
        - 停止出资并重估减值
      - - 治理 / 接班
        - 没有可信接班人或少数股东保护
        - 创始人关键人风险失去边界
        - 不进入，或寻求保护性权利
      - - 法律 / 产品
        - 重大不利判决、召回或标签执法
        - 现金损失和品牌信任受损拖累销售
        - 除非已有保险且可量化，否则退出
    notes: 触发因素是投资委员会的监测阈值，不是预测。拿到经审计基线和债务文件后，应重新校准这些阈值。
    claimRefs:
      - CV006
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 财务报表
        - 经审计的 FY2023–FY2025 损益表、资产负债表、现金流量表和月度账目
        - 验证销售额、利润率、FCF 和 5.3x 分母
        - CFO / NDA 数据室；盈利质量
      - - 股权结构 / 优先权
        - 完全稀释后所有权、2025 年认购协议、员工计划和 KDP / TPG 权利
        - 量化稀释、清算优先权和控制权悬顶
        - 总法律顾问；投资人律师审阅
      - - 债务
        - 未偿本金、利率、期限、契约和担保包
        - 衡量股权价值和再融资风险
        - 财务部 / 贷款方；契约证书
      - - 单位经济性
        - 按品类披露价格 / 促销、gross-to-net、动销、复购和贡献利润
        - 验证增长是否赚钱且可防守
        - 商业分析；零售商数据
      - - 资本开支 / 工厂
        - Rome 和 Twin Falls 的预算、进度、利用率、良率和质量 KPI
        - 评估资本强度和执行风险
        - COO / 工厂走访；独立工程师
      - - 法律 / 监管
        - 邻苯二甲酸盐、天然、零糖 / 阿洛酮糖案件、召回和保险
        - 量化现金、标签和品牌下行
        - 总法律顾问 / 监管律师
      - - 退出准备
        - IPO 内控、经审计报告、转让限制和战略买家图谱
        - 判断流动性和现实回报路径
        - 董事会 / 发起人投行；卖方准备度
    notes: 这些尽调要求按其改变建议、置信度、风险评级或估值立场的能力排序。重大问题未回答时，结论只能停留在跟踪，不能给出虚假精确。
    claimRefs:
      - CV014
      - CV018
      - CV019
      - CV035
      - CV036
      - CV037
      - CV038
