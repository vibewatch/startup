      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Chobani 的经济买方通常是零售品类经理或采购员，他们控制货架位置、品类组合、促销和补货；付款方是购买库存并支付贸易条款的零售商或分销商。
              终端用户是按口味、蛋白、便利性、饮食偏好和价格来选择酸奶、奶或咖啡产品的家庭购物者；消费者可能不同于预算所有者。 餐饮服务和便利店运营商可以作为单份装和冷萃形态的次级买方，但现有证据没有说明它们占 Chobani
              销售的比例。 采用路径从买方授权和货架图位置开始，经促销和试吃支持的试用，走向复购和更多陈列面。希腊酸奶可信度降低了核心酸奶的试用摩擦；
              蛋白声明和相邻形态则给了交叉销售许可。零售商利润率、动销、损耗、冷链执行和自有品牌替代共同决定一次上架能否变成耐久分销。
