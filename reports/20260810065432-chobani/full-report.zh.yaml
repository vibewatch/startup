      - number: '5.2'
        title: 运营足迹与制造架构
        blocks:
          - type: paragraph
            body: >-
              运营模型通过设施网络和支持系统，把牛奶和其他原料转化为冷藏、包装消费品。Idaho 州 Twin Falls 被描述为全球最大酸奶工厂之一， 并与 Chobani 在纽约州北部 Norwich 和 South
              Edmeston 的足迹配套。Twin Falls 的 Innovation & Community Center 于 2019 年开放，在 R&D 与制造之间提供可见的配方和商业化接口。Chobani
              还宣布在纽约州 Rome 建设约 $1.2 billion 乳品工厂，并在 Twin Falls 扩建 $500 million，使产能成为核心技术投资。实际架构包括奶源、原料资质、配方和菌种管理、加工、
              灌装和包装、冷藏、物流、零售执行，以及反馈到新产品开发。从 Chobani 控制大量乳品加工和品牌制造的意义上说，这是垂直整合； 但公开证据没有披露供应商集中度、工厂利用率、经验证吞吐量、良率或端到端可追溯指标。
