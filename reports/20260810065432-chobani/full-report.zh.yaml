      - number: '5.3'
        title: 配方、知识产权与差异化来源
        blocks:
          - type: paragraph
            body: >-
              Chobani 的差异化是一套累积运营能力。GreyB 的专利组合分析指向配方和工艺专利，这些专利可以保护特定成分或制造方法；
              但公开评估没有证明可执行性、剩余期限、权利要求广度或自由实施空间。Innovation & Community Center 增加实验室、中试和面向社区的基础设施，
              能缩短从消费者洞察到配方、产线试验和商业化发布的路径。规模也重要，因为全国性酸奶品牌可以把工厂、冷链和质量体系摊到许多口味和包装规格上。
              品牌认知、清洁标签定位、偏蛋白产品、奶源准入和庞大零售足迹，又强化了专利层。燕麦奶对比显示，该产品在口味和使用场景属性上与 Oatly、Planet Oat 竞争；GummySearch
              只提供方向性的消费者讨论信号，不是技术基准。关键尽调问题是，专利和工艺诀窍是否带来可衡量的良率、货架期、 感官、成本或速度优势，并且竞争对手难以复制。
