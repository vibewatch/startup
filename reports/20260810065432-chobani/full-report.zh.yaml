      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最可信的增长驱动来自高蛋白需求、希腊酸奶品类领导地位、溢价但可负担的清洁标签定位，以及向燕麦奶、奶精和 RTD 冷萃扩张的相邻品类。 Chobani 的官方产品组合，以及 La Colombe 和 Daily
              Harvest 交易，显示公司在把品牌许可从酸奶向外延伸；蛋白酸奶证据也指向有利的消费者需求状态。 如果利用率和投入品经济性支撑投资，新制造产能可以支持可得性并减少瓶颈。约束同样重要：自有品牌 CPG
              规模带来价格和利润率压力； 乳品、包装、物流和冷藏成本会压缩贡献；零售商促销会训练消费者等折扣；新品类需要不同配方、设备和质量控制。燕麦奶和植物基品类也有竞争强度和变化中的消费者偏好。
              因此，采用取决于动销、复购率和有利可图的贸易投入，而不只是分销广度或表面的品类增长。
