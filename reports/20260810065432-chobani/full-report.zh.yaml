      - number: '3.4'
        title: 切换成本、锁定效应与渠道和供应准入
        blocks:
          - type: paragraph
            body: >-
              酸奶和奶精的消费者切换成本很低：购物者下次到店就能换品牌，零售商可以重置货架空间，家庭也常在价格层级和口味之间多栖。 实际锁定效应是间接且运营性的。Chobani
              的品牌习惯、零售商动销、冷链执行、制造质量体系和供应商关系，可以让追求稳定补货率的零售商更换成本上升，
              但这些都不是软件式排他锁定。分销权掌握在商超、量贩、会员仓储和便利渠道买方手里，他们控制货架图、促销和自有品牌选项。 大型既有玩家凭采购规模和现有工厂获得伙伴准入；Chobani 则凭 Twin Falls
              足迹、规划中的纽约州 Rome 工厂、全国营销以及 KDP 围绕 La Colombe 的分销关系，获得供应和渠道杠杆。因此，零售商或消费者可以多栖，但较小进入者很难复制全国冷链可得性、制造投资或伙伴可信度。
              当销量足以支持专门规格或代工制造时，零售商内部自建仍然可能。
