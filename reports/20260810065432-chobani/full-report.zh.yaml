      - number: '7.3'
        title: 运营、质量和供应链风险
        blocks:
          - type: paragraph
            body: >-
              运营风险本质上是带有食品安全后果的扩产问题。Rome 工厂和 Twin Falls
              扩建资本强度异常高，公开记录没有证明最终设计产能、投产日期、已验证良率、招聘准备度、冷链冗余或营运资本曲线。延误会让建设现金沉淀，同时旧网络继续承接需求；利用率不足的工厂也可能抬高单位成本，而不是降低成本。乳品投入品可得性和大宗商品价格会压缩利润率，劳动力短缺或流失会降低吞吐量并增加偏差风险。酸奶、咖啡和餐食套装业务还会扩大质量体系和整合接口。召回或过敏原失效低频但高影响，因为它们会通过零售商快速扩散并侵蚀信任；所给负面召回报道使其成为需要监测的风险，而不是假设风险。缓释成熟度为中：规模化食品制造商应有
              HACCP、可追溯性、供应商资质、预防性维护、清洁验证、环境监测和业务连续性计划，但这些控制在项目层面没有公开证据。应索取设施级
              KPI、第三方审计结果、召回演练、供应商集中度、牛奶采购条款、劳动力流失、资本开支备用金和冷链服务水平。终止标准应包括重复重大偏差、实质性召回、投产良率低于计划，或资本开支超支并消耗流动性余量。
