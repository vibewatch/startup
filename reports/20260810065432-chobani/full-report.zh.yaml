      - number: '6.5'
        title: 扩张、集中度和采购摩擦
        blocks:
          - type: paragraph
            body: >-
              扩张可以来自每户更多消费场景、每家零售商更多 SKU，以及向相邻咖啡和餐食品类交叉销售。Chobani 的产品广度和 Daily Harvest
              收购打开了这些路径，高蛋白酸奶和奶精也给零售商增加货架空间提供了当下理由。反向压力来自集中度和采购摩擦。Walmart 和 Costco 是具名核心客户，谈判杠杆极强；Target 和 Kroger
              增加了覆盖面，但公开证据不显示任何客户的收入占比、门店数量、进场费、贸易费用负担、自有品牌挤出或零售商特定毛利。会员店和大卖场采购方可以要求包装规格和价格让步，自有品牌酸奶争夺同一货架，也会让上架授权变得可逆。Chobani
              还必须跨渠道投入冷链执行、质量合规、补货和促销日历。零售商上架证明的是准入，不是低采购摩擦。合适的风险姿态是：分销很广，但经济依赖可能仍然很高；在把全国可得性视为可持续护城河之前，集中度、条款、续约和按零售商拆分的盈利能力都是重大尽调事项。
