      - number: '7.2'
        title: 监管和法律暴露
        blocks:
          - type: paragraph
            body: >-
              法律事项清单按可能中断销售的能力和受影响 SKU 的广度排序。邻苯二甲酸盐事项被报道为 2025–2026
              年消费者诉讼，包含致癌风险指控，但不是最终裁决；具体诉状、集体范围、保险应对和包装测试记录都需要律师审阅。监管关注会增加一个风险：私下和解可能不是唯一成本，包装变更、零售商下架、召回或监管问询都可能冲击库存和营运资本。另一宗“纯天然”酸奶诉讼未在驳回动议阶段出局，这会抬高证据开示和标签证据成本，即便存续不等于实体胜诉。Zero
              Sugar / allulose 事项因联邦优先适用被驳回，是有利的程序结果；但如果产品措辞、配方或 FDA 指引变化，未来索赔并未被消除。Chobani
              应维护逐项主张证据文件、法律保全、包装供应商证书、投诉升级、召回演练和监管变化日志。隐私和 IP
              风险在所给记录中没有事件证据；这种缺席是证据缺口，不是状态清白的证明。尽调应取得法院案卷、监管往来、保险和赔偿条款、商标和专利清单、环评许可、食品设施注册、过敏原控制和召回历史。
