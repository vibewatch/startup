              Chobani 的里程碑从 2005 年创立、2007 年产品发布开始，延伸到 2010 年代初快速成为品类领导者、2014 年 TPG 少数股权投资、 2021 年 IPO 申请及 2022 年撤回、2023
              年 12 月收购 La Colombe、2025 年 5 月收购 Daily Harvest、 2025 年动工建设纽约州 Rome 的 $1.2 billion 工厂，以及 2025 年 10 月以约 $20
