      - number: '7.5'
        title: 人、执行和财务模型风险
        blocks:
          - type: paragraph
            body: >-
              私营公司不透明放大了财务风险。Chobani 报告 2025 年净销售额约 38 亿美元、估值约 200
              亿美元，但销售额是预测值，经审计利润率、净杠杆、流动性、契约余量、营运资本季节性和客户集中度都不公开。高溢价品牌模式可能同时承受自有品牌挤压利润率、大宗商品通胀、促销强度和整合成本，而新工厂还会增加折旧、劳动力和维护。隐含约
              5x 销售倍数意味着，一旦增长放缓，执行失误的容错更低。2022 年 IPO 撤回提醒投资人：即便是规模化品类领导者，资本市场窗口也会随条件变化。人的风险同样集中：Hamdi Ulukaya
              是创始人、董事长、CEO
              和多数股东，而公开记录没有证明继任梯队、授权体系或独立董事会保护。这种集中能带来速度优势，也会削弱连续性、治理和融资谈判。缓释措施应包括经过测试的继任计划、独立董事、管理层激励一致性、13
              周现金预测、月度契约和资本开支报告、SKU
              级毛利率桥、大宗商品套保政策和整合记分卡。投资含义是有条件的：在依赖估值之前，要求经审计财务或盈利质量支持、债务文件、股权结构表和情景案例。流动性违约、毛利率持续下行、重大降估值融资，或创始人非计划缺席，都应自动触发重新投资论证。
