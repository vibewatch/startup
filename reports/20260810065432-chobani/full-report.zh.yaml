  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险姿态和投资含义
        blocks:
          - type: paragraph
            body: >-
              Chobani 最严重的暴露不是某一起孤立诉讼，而是执行与融资相互关联的风险。公司一边推进纽约州 Rome 的 12 亿美元乳品项目和 Twin Falls 的 5 亿美元扩建，一边背负与 9 亿美元 La
              Colombe 收购相关的定期贷款，还在约 200
              亿美元私人估值上做投资论证。项目、债务和估值都有文件或报道支撑，所以发生概率为中；但若投产延误、利用率爬坡滞后或利润率被压缩，影响会很高。因此，缓释成熟度评估为发展中：管理层有资本、战略分销关系和制造足迹，但公开证据没有显示整合风险仪表盘、流动性余量或契约包。在经审计财务、工厂预算和零售商经济性提供之前，剩余暴露仍然高。第二个高严重度风险簇是法律与监管：邻苯二甲酸盐包装指控、仍存续的“纯天然”主张，以及
              allulose
              标签审查，都可能带来召回、禁令、配方调整和品牌成本。投资含义是继续研究，而不是无条件买入：只有下行情境流动性、食品安全控制、标签证据和领导层连续性通过尽调，才应推进。现金消耗、项目偏差、毛利率、投诉、零售商条款和诉讼姿态应作为联动指标监测，而不是拆成孤立筒仓。
