  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑和反逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑在于，Chobani 拥有一个规模化、可信的美国希腊酸奶品牌业务，并正借助这套分销和品牌许可，延伸到高蛋白奶精、燕麦奶、即饮咖啡和植物基餐食。报告称 2025 年净销售额约 38 亿美元、同比增长约
              28%，这对一家大型食品公司来说动能罕见；市场来源称，公司拥有约 20% 的整体酸奶份额和超过 40% 的希腊酸奶份额，也说明零售商和消费者拉力有意义。反逻辑是估值和证据质量：200
              亿美元投后估值约等于预测销售额的 5.3x，高于食品饮料 2.5–4x 销售额区间，而投资人还无法验证毛利率、EBITDA、净债务、同期群或家庭渗透率。自有品牌压力、Danone 和 Lactalis 竞争、超过
              17 亿美元已宣布工厂投入、杠杆债务、诉讼和创始人集中，都可能把增长转成糟糕股权回报。因此，产品-市场质量强于投资论证确定性，决定建议的是价格，而不是对品牌的喜爱。
            claimRefs:
