      - number: '8.2'
        title: 建议、信心和风险评级
        blocks:
          - type: paragraph
            body: >-
              建议：跟踪。信心：中。风险评级：高。估值立场：偏高。这不是判断 Chobani
              是弱业务，而是在投资人收到经审计或至少贷方级财务报表、融资后股权结构表、优先权结构，以及增长能转化为可持续利润率的证据之前，先保留选择权。若按报道的 200 亿美元投后价格买入，需要一条可信路径：EBITDA
              利润率大致达到低到中双位数，并维持 15%–19%
              的增长；或者存在尚未由公开证据证明的战略稀缺性溢价。因此，老股或新股进入都应要求相对上一轮估值的折价、信息权、惯常少数股东保护和清晰流动性计划。只有证券具备下行保护，且仓位按高私营公司风险控制，才应持有既有敞口；如果尽调显示贡献利润率弱、净杠杆沉重、优先权苛刻或增长重置，应退出或拒绝。只有证据和价格纪律改善后，建议才可上调为买入；一旦本章的投资逻辑击穿触发条件被突破，应下调为退出。
            claimRefs:
