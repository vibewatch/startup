      - number: '8.6'
        title: 最终尽调事项和决策闸门
        blocks:
          - type: paragraph
            body: >-
              最终尽调议程有意集中在能改变建议或估值立场的事实。第一，取得经审计 FY2023–FY2025
              财务报表和月度管理账，包括按品类拆分收入、总额到净额、毛利率、EBITDA、自由现金流、营运资本和客户集中度。第二，将完全摊薄股权结构表与 2025 年 10 月认购协议、员工股权计划、KDP 对价和任何 TPG
              延续持有对齐；梳理清算优先权、股息、转换、反稀释、董事会权利和期权池处理。第三，用工厂级利用率、良率、质量事件、资本开支对产能、零售商动销、价格 /
              促销和复购率测试经营经济性。第四，取得诉讼、保险、监管和标签文件，并量化邻苯二甲酸盐以及“natural”/allulose 暴露。最后，验证收购协同、债务契约、再融资需求、继任覆盖和现实的 IPO
              或战略出售时间表。在这些事项回答之前，正确动作仍是在偏高估值立场下跟踪；经验证利润率和干净优先权结构可以上调建议，任何终止触发都应强制退出或不进入。
