      - number: '8.4'
        title: 情景估值和可比集合
        blocks:
          - type: paragraph
            body: >-
              情景框架比单一点估值更站得住，因为 Chobani 的私营财务使利润率、债务和组合仍不确定。基准情景假设销售额从 2025 年约 38 亿美元预测开始，在五年内以 12–15% 复合增长，EBITDA 利润率达到
              12–14%，退出倍数向 3.0–3.5x 销售额正常化；扣除净债务和摊薄后，得到的企业价值区间大幅低于当前估值。牛市情景假设高蛋白创新、咖啡交叉销售和工厂利用率支撑 20%+ 增长及 15–17%
              利润率，从而支持 4–5x 销售额的溢价结果。熊市情景假设自有品牌份额提升、投入品通胀、整合摩擦和倍数压缩到 2–2.5x 销售额。Danone 是公开品牌标杆；Oatly
              是受困的公开挑战者；Lactalis/Yoplait 和 Siggi’s/Fage 提供战略性私人或 M&A 参照点，200
              亿美元融资轮则是相关的一手估值标记。没有一个完全可比，所以每行都说明限制，可比表也明确只是局部。
