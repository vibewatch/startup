      - number: '7.4'
        title: 合作伙伴、零售商和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Chobani 的市场通路依赖一个战略价值很高、但公开来源无法完全看清的网络。Keurig Dr Pepper 通过 La Colombe
              成为少数股东和即饮分销伙伴；这层关系可以加速触达，但也会带来对服务水平、经济性、数据访问、渠道优先级和治理一致性的依赖。大型杂货、大卖场和会员店账户（如
              Walmart、Costco）的零售商集中度，是第二个依赖点：一次货架重置、自有品牌推进、不利贸易条款或下架，都可能比消费者品牌自我替代更快地减少销量。Rome
              项目还增加了监管方和激励对手方，因为纽约州支持与投资和就业承诺挂钩。资本提供方和贷款人也是依赖点；5.5 亿美元定期贷款以及融资后未披露的契约，可能在下行期限制选择。Daily Harvest
              增加了整合和组合复杂度，尽管交易条款未披露。缓释措施应包括双渠道分销、按零售商拆分的贡献利润率报告、服务水平和终止保护、替代代工或物流产能、贷款契约预测、激励合规负责人和整合里程碑。尽调应量化前十大零售商和分销商占比、合同续约日期、返利、扣款、KDP
              权利、贷款人篮子条款、控制权变更条款，以及纽约激励返还机制的精确细节。失去单一合作伙伴不一定击穿投资逻辑，但同时失去一家主要零售商和分销商会击穿。
