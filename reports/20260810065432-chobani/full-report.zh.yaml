      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              商业动作是高量零售 CPG 路由：全国商超、量贩、会员仓储、便利和餐饮服务货架，很可能是需求触面，并由品牌营销、分销商关系、 零售商品类评审和促销日历支撑。该模式不是通过已披露年度合同销售，因此 SaaS 式
              CAC、回本周期和销售周期指标不可得。 有用代理指标包括单店每周动销、加权分销、复购、贸易投入率、促销后价格实现、补货率，以及各渠道赚取的毛利率。 Chobani
              的品类领导地位和溢价定位可以改善货架准入和定价权；冷藏物流、损耗、零售商扣减和促销强度则会压缩贡献。La Colombe 通过 Keurig Dr Pepper 增加 RTD 咖啡分销，Daily Harvest
              增加 DTC/餐食场景，但公开来源没有披露渠道层面收入或经济性。 因此，承销问题不是传统内部销售漏斗是否高效，而是品牌拉力和增量分销能否快过贸易投入和冷链复杂度的上升。
