            body: >-
              具名客户证据里，最有力的是零售商展示实时在售组合，或合作伙伴讲清商业执行。Walmart 上架 Chobani 产品目录，Walmart Connect 发布 Chobani
              的创意与商业转化案例研究；两者合在一起，说明产品已经规模化出货和陈列，而不只是前瞻性试点。Costco 列出 20-count Greek Yogurt Variety Pack，Target 和 Kroger
              保留 Chobani
              品牌页或搜索页；这些都是直接零售证据，但不披露采购订单、毛利、续约条款或门店层面的动销。因此，具名证据对存在性和渠道准入的质量高，对结果的质量中等，对账户经济性的质量低。消费者评论又提供另一层信号：Walmart
              评论和独立 Costco 评论给出使用语境，PissedConsumer 则提供负面投诉。这些公开页面都不能替代零售商确认的实际售出，但跨渠道模式与既有生产足迹一致。每个列名零售商都应核验当前授权、SKU
              数量、履约率、促销依赖和总额到净额条款。
