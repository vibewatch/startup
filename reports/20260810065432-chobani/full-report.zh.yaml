      - number: '5.6'
        title: 能力成熟度与关键依赖
        blocks:
          - type: paragraph
            body: >-
              Chobani 在品牌酸奶商业化和规模化乳品加工上看起来成熟，在相邻植物基和咖啡平台上仍处于成长阶段，在证明技术表现的指标上透明度较低。
              依赖图高度集中：牛奶和原料可得性供给工厂；工厂和菌种决定质量和产能；包装与冷链伙伴影响货架期；零售商决定可见度和补货； 被收购品牌带来独立整合和渠道要求。KDP 的少数股权位置和分销关系可以帮助 La
              Colombe 触达 RTD 消费者；Daily Harvest 则提供传统乳品线之外的植物基产品和客户主张。Rome 和 Twin Falls
              资本开支可能提升韧性和创新产能，但也抬高执行、投产、利用率和固定成本风险。 因此，产品结论是运营成熟度强、技术透明度受证据限制：品牌、供应准入和工艺诀窍是可信优势；但质量控制表现、专利经济性、工厂产出、
              被收购平台整合和路线图交付的公开证据仍不足以支持低风险评级。
