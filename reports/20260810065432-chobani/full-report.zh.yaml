      - number: '4.6'
        title: 财务结论与承销阻断项
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Chobani 具备耐久溢价 CPG 复合增长公司的轮廓：庞大的酸奶底座、相邻品类、可识别品牌，以及足以支撑制造杠杆的规模。 如果零售复购需求、价格实现和收购整合守住，收入质量在方向上有吸引力；但以约
              $20 billion 估值所隐含的精度，现有证据还不可投资。 主要利润率路径是运营性的：守住溢价组合，控制贸易投入和大宗商品暴露，填满 Rome 和 Idaho 资产，并证明 La Colombe 和
              Daily Harvest 增加的是贡献而非复杂度。资本强度是制衡项：已披露 $1.7 billion 工厂投资叠加债务和整合支出，会让自由现金流起伏更大，也拉长下行持续时间。 2022 年 IPO
              撤回是不利融资先例，自有品牌利润率压力则是不利品类信号。结论是继续研究 / 有条件观察：在交付经审计报表、分部与单位桥、 毛利率和 EBITDA 历史、现金 / 烧钱速度 /
              现金跑道、债务契约、股权结构表、零售商经济性和工厂利用率前，不要承销精确回报。 $3.8 billion 销售额估计是有用的规模标记，不能替代这些阻断项。
            claimRefs:
              - CI035
              - CI036
              - CI037
              - CI038
              - CI039
