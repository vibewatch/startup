      - number: '6.2'
        title: 采用轨迹与分销足迹
        blocks:
          - type: paragraph
            body: >-
              采用最好用分销广度和零售可得性的持续性来证明，而不是用已披露队列指标。Chobani 在 Walmart、Costco、Target 和 Kroger 上架，说明品牌覆盖量贩、会员仓储和商超环境；Walmart
              Connect 案例研究描述的是已上线的创意与电商联动项目， 而不是实验室试点。Costco 的 20 件装多口味组合，是为计划性家庭补货设计的规格；Walmart 评论和独立 Costco
              评论则提供面向消费者的信号， 表明产品正被购买并在普通使用中被评价。2007 年希腊酸奶发布，以及后来向高蛋白酸奶、奶精、燕麦奶和咖啡扩张，说明公司有一条多场景路径， 可以扩大购物篮渗透。Daily
              Harvest 还通过被收购平台增加了通向数字参与度高、会做餐食规划客户的入口。这些是采用代理指标，
              不是量化家庭留存曲线的证明：公开材料没有给出门店数、动销、ACV、按分销加权渗透、复购率或同比单位队列。管理层尽调应把零售商终端售出 与出货数据对齐。
