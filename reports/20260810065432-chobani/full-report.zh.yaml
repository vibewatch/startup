        title: 护城河耐久性、商品化与反向证据
        blocks:
          - type: paragraph
            body: >-
              Chobani 的护城河只有在品牌信任和创新持续赚取高于可接受替代品的价格和动销溢价时，才具备耐久性。品牌的希腊酸奶领导地位、
              高蛋白定位、扩大的产品组合和创始人主导使命，都很难快速复制；制造投资也提高了小型进入者的固定成本和质量门槛。 反向情景同样清楚。Circana 估计美国自有品牌 CPG 销售约 $330 billion，RSM
              对利润率压力的讨论则说明，零售商既有动机也有能力把品牌功能商品化。 AInvest 将 Chobani 的增长描述为面对规模化风暴的溢价护城河，强化了资本开支、促销和相邻品类扩张稀释回报的风险。Oatly 和
              Planet Oat 可以替代乳品场景，Nestlé 和 Danone 也能凭更大规模争夺奶精相邻品类。最终投资结论是：当前位置强，但耐久性中等。
              尽调应测试净定价、复购率、零售商集中度、产能利用、供应商条款，以及 Rome 和 Idaho 投资回报，而不是假设份额会自动转成超额利润率。
