      - number: '4.3'
        title: 成本结构、营运资本与资本强度
        blocks:
          - type: paragraph
            body: >-
              Chobani 的成本基础应被理解为一个食品制造系统：牛奶和其他原料、包装、工厂一线人工、公用事业、质量和食品安全控制、货运、仓储、
              零售商贸易投入和营销，全都位于货架价格与现金生成之间。乳品和包装通胀、利用率、产品组合，以及代工制造或分销选择，是主要毛利率驱动因素； 但公开来源没有毛利率桥或 EBITDA
              明细。易腐库存和零售商应收账款带来营运资本暴露，供应商条款和促销应计也会实质改变现金转化。 已披露的纽约州 Rome $1.2 billion 工厂和 Twin Falls $500 million
              扩建，意味着公告中的制造投资至少 $1.7 billion； 这还未计入维护资本开支、整合支出或总部成本。新产能在达到利用率后可以降低单位成本，但投产风险、爬坡、折旧和吸收不足，会在近期压制利润率。
              反向情景是，自有品牌竞争和规模化成本在新资产达到高效产出前，就吃掉溢价定价收益。
