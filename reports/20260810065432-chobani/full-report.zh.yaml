      - number: '2.5'
        title: 规模测算不确定性与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              核心尽调问题是分母纪律。Mordor、Persistence、Verified Market Research 和 Global Market Insights 发布的酸奶估算，
              如果不确认各自统计的是纯零售、餐饮服务、销售额、销量还是全球外溢，就无法调和；Statista 和 Emergen 又引入额外的希腊酸奶与植物基定义。 Fortune
              对燕麦奶和乳品替代品的估算同样描述了不同市场口径。本报告保留这些矛盾，而不是挑最大数字。Chobani 的确切 SOM、家庭渗透率、净价实现、 零售商集中度、复购、奶精分母和 RTD
              冷萃经济性，都未被已提供的公开证据确立。管理层应提供分品类收入桥、Circana 或同等扫描数据、 零售商层面的动销和贸易投入数据、队列或家庭渗透、gross-to-net
              瀑布图，以及产能利用计划。敏感性情景应固定核心酸奶池， 同时改变希腊酸奶份额、相邻品类转化、自有品牌价差和毛利率。在这些输入可用前，可服务市场结论只能作为方向判断，不能作为可投资的自下而上 SOM。
