      - number: '6.4'
        title: 留存、复购和满意度
        blocks:
          - type: paragraph
            body: >-
              酸奶、奶精和咖啡都属于补货型品类，复购在经济性上很重要，但 Chobani 不披露 NRR、流失率、复购同期群、家庭购买频次或满意度得分。组合装和广泛日常使用规格与重复消费相容，Walmart
              和独立评论页也显示消费者仍在主动评价产品。情绪信号不是单向宣传，而是混合的：品牌有可见忠诚度和正面使用评论，但 PissedConsumer
              记录了涉及质量和包装的投诉，尽调简报也提示邻苯二甲酸盐担忧及相关消费者诉讼。投诉网站的数量不是代表性满意度样本，不能外推为缺陷率；它是一个监测信号，可能影响复购和零售商退货。因此，留存韧性仍是投资论证缺口。管理层应提供按同期群和渠道拆分的复购、任何与
              Daily Harvest 相关 DTC 活动的订阅取消数据、投诉 / 退货率、质量事件日志和零售商记分卡，以区分品牌亲和力与促销或铺货驱动的销售。
