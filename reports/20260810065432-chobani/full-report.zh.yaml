  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户架构：买方、用户与付款方
        blocks:
          - type: paragraph
            body: >-
              Chobani 的客户系统有三个清晰角色。零售商和分销商是 B2B 买方，负责谈判品类组合、价格、促销、服务水平和货架位置；
              家庭是终端用户，选择酸奶、奶精、燕麦奶、咖啡或餐食；购物者或家庭在结账时付款，除非由订阅或配送中介直接计费。公司向美国商超、量贩、
              会员仓储和便利渠道销售，因此客户需求因渠道而异：商超购物者寻找日常早餐和零食补货，会员仓储客户购买更大规格的多口味组合装，
              量贩购物者在便利和价格之间权衡，便利店购物者优先考虑便携和即时消费。产品使用场景覆盖高蛋白营养、家庭零食、咖啡准备、无乳替代和即饮消费。 收购 Daily Harvest
              增加了更偏餐食、由数字媒介承载的使用场景，La Colombe 则把品牌延伸到咖啡场景。公开来源能识别渠道和产品， 但不披露账户层面收入、家庭渗透或付款方组合，所以下方分层只是方向性判断。
