      - number: '8.5'
        title: 退出就绪度和回报逻辑
        blocks:
          - type: paragraph
            body: >-
              Chobani 具备战略退出特征——全国零售分销、可识别消费者品牌、制造资产和相邻品类选项——但对纪律严格的财务投资人来说还没有退出就绪。2021 年 IPO 失败和 2022
              年撤回说明，公开市场时机和披露标准很重要；未来 IPO 需要经审计报表、分部报告、治理深度、控制体系和更干净的杠杆结构。战略买家可能看重品类领导地位或咖啡准入，但 La Colombe 与 Daily
              Harvest 整合、工厂爬坡以及任何优先权包袱，都会让出售流程更复杂。五年投资案例应以能补偿私人流动性不足和摊薄的总回报为目标；按当前约 200 亿美元进入，即便以 4–5x
              销售额退出，如果增长放缓且新资本排在更优先位置，也未必能产生有吸引力的倍数。实际退出计划是现在取得信息权，监测季度 KPI
              和契约报告；只有在转让限制和买方资格明确后，才保留二级出售选项。投资逻辑击穿触发条件包括实质性利润率侵蚀、杠杆高于约定上限、工厂利用率失败、监管或诉讼现金损失、创始人继任失败和降估值融资。
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
