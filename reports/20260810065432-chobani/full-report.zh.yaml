  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 消费者产品与日常工作流
        blocks:
          - type: paragraph
            body: >-
              Chobani 的产品最好被理解为一组食用场景，而不是单一 SKU。购物者购买希腊酸奶，用于早餐、零食或以蛋白为核心的餐食组件；
              购买燕麦奶，用于咖啡、谷物或替代场景；购买奶精，用于家庭咖啡准备；购买奶油奶酪，用于涂抹和烹饪；购买 La Colombe 冷萃或即饮咖啡， 用于便携咖啡因摄入。Daily Harvest
              把组合延伸到可在家储存和准备的植物基餐食。因此，客户工作流是：发现产品，选择一个品牌冷藏或常温商品， 在适用时经零售冷链带回，消费或准备，并在场景再次出现时复购。Chobani
              官方产品界面支撑了组合广度；独立评测和从业者社区信号， 对燕麦奶如何被比较和讨论提供了有限外部证据。产品承诺结合口味、便利、蛋白、清洁标签线索和可识别品牌架构，但公开数据没有量化复购、 家庭渗透或 SKU
              层面贡献。
