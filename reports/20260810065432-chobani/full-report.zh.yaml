  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与竞争替代
        blocks:
          - type: paragraph
            body: >-
              相关市场边界从美国零售酸奶开始，口径是通过商超、量贩、会员仓储、便利和电商渠道销售的品牌及自有品牌冷藏酸奶。在这个边界内， 希腊酸奶是主要子品类，也是观察 Chobani
              核心位置最干净的镜头。纳入的消费包括消费者反复购买的杯装酸奶、组合装和可饮用形态， 也包括同一品牌、货架存在和冷链能力有望争取的相邻支出：燕麦奶、植物基乳品替代品、偏蛋白的奶精和即饮冷萃。核心 TAM
              不包括只面向餐饮服务的酸奶、 餐厅饮品、无关植物基餐食，以及不共享 Chobani 分销或可信产品替代路径的广义咖啡场景。现状替代并不只是另一个酸奶品牌： 消费者可以转向自有品牌、传统乳制酸奶、cottage
              cheese、燕麦片、水果或咖啡饮品；零售商也可以把货架空间转给价格更低的自有品牌。 这个边界既防止 TAM 被夸大，也承认相邻品类的选择权。
