  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构与变现
        blocks:
          - type: paragraph
            body: >-
              Chobani 主要靠通过零售分销销售品牌消费包装食品饮料获得收入，希腊酸奶是经济和品牌锚点。组合现在加入燕麦奶、咖啡奶精、即饮咖啡和 La Colombe 产品，再加上 Daily Harvest
              植物基餐食，形成多个消费场景和潜在跨品类陈列，而不是订阅驱动的软件模型。 公开描述支持溢价定位：典型品牌酸奶杯约 $1-$1.50，组合装约 $4-$6，但这些只是指示性货架价格区间，不是披露的已实现净价。
              因此，零售商折扣、贸易投入、促销补贴、扣减、退货和分销商利润率共同决定确认的净销售额。据报约 $3.8 billion 的 FY2025 净销售额和 28%
              增长，是私人且未经审计的预测，不是已提交的利润表。收入确认政策、分部组合、收购会计，以及 Daily Harvest 和 La Colombe 的贡献都不公开， 所以表观增长率还无法拆成价格、销量、组合和
              M&A。
