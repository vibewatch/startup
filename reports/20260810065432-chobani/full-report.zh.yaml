      - number: '5.5'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              食品质量是 Chobani 产品技术的信任层。客户信心取决于原料规格、过敏原和卫生控制、经验证的发酵和灌装、包装完整性、冷链纪律、 日期编码、营养和成分标签、投诉升级以及召回准备。Chobani
              官方界面传递产品和成分信息，但已提供公开来源没有给出可审计的工厂层面 HACCP
              摘要、第三方认证登记、微生物控制限值、投诉率趋势、召回仪表盘或包装迁移测试结果。这个证据缺口很重要，因为公司曾面临包装中邻苯二甲酸盐问题审查， 以及围绕 natural
              和糖相关声明的诉讼；即便本章来源包尚未确立法院或监管结果，这些问题也让佐证和包装质量控制具备财务相关性。 这里没有来源支持 Chobani
              曾有特定召回次数的说法，因此召回历史仍是尽调请求。正确承销姿态不是认定控制缺失，而是承认其范围、测试、 纠正行动表现和认证状态无法由公开信息衡量。
            claimRefs:
