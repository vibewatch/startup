      - number: '2.2'
        title: 用多重镜头测算规模
        blocks:
          - type: paragraph
            body: >-
              单一市场数字对决策没有帮助，因为不同发布方统计的地理范围、渠道、产品形态和预测年份都不同。受证据约束的基准情景使用给定的美国酸奶市场估算， 约 $11–13 billion，再套用约 50%
              的希腊酸奶份额，得到隐含希腊酸奶池约 $5.5–6.5 billion。Chobani 约 20% 的整体酸奶份额和 40%
              或更高的希腊酸奶份额，提供了两条公司特定镜头，意味着核心收入机会大于简单品牌份额声明所能证明的水平。
              第二个镜头把燕麦奶和乳品替代品作为相邻池：来源证明这些品类有意义且在增长，但分母在燕麦奶、植物基奶和全部乳品替代品之间摇摆。 第三个镜头使用咖啡奶精和 RTD 冷萃作为场景相邻品类；Chobani 的奶精份额约
              11–12%，但市场分母仍取决于发布方。 因此，分析呈现区间和份额，而不是虚假的精准 SOM，并保留相互冲突的估算，作为尽调请求。
