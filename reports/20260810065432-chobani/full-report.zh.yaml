      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Chobani 在 2025 年 10 月以约 $20 billion 估值完成 $650 million 股权融资，资金用途被描述为支持增长、创新和制造。
              这笔股权提供战略产能，但不等同于已披露经营流动性：公开来源没有显示手头现金、自由现金流、月度烧钱速度、受限现金、投资者权利， 或已经承诺投入工厂项目的金额。据报道 2023 年围绕 La Colombe
              交易使用了约 $550 million 杠杆定期贷款，引入利息支出、 再融资和契约敏感性；S&P 覆盖确认了评级信用背景，但没有给出公开当前余额。收购和制造议程叠加，让融资依赖成为核心尽调问题。
              下一轮融资触发点可能是工厂建设期间现金短缺，或契约 / 营运资本挤压；相反，内部资金支持资本开支且自由现金流为正，会降低依赖。
              正确的资金用途测试，是股权是否在为可见利用率和回报的产能买单，而不是掩盖经营亏损。投资者在把该估值视为资本充足前， 应要求融资后资产负债表、债务明细、流动性预测、资本开支分期和下行情景。
