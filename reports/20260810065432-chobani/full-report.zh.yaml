            body: >-
              公开证据支持公司已有有意义规模，但还不足以拼出完整运营仪表盘。Chobani 报告或据报预计 FY2025 净销售额约 $3.8 billion， 同比增长
              28%，并拥有美国希腊酸奶领先地位和扩大的产品组合。它有庞大的 Twin Falls 足迹、在建的 Rome 工厂，
              以及由两笔收购扩大的组合。这些指标证明分销和产能雄心，但不能证明收入质量、利用率或现金回报。公开来源没有提供经审计收入、毛利率、
              EBITDA、经营现金流、烧钱速度、确切债务余额、股权结构表、CAC、回本周期、客户或家庭数量、售出单位、门店层面动销或设施利用率。 $3.8 billion
              这个数字尤其需要标为缺口：它是私人估计或预测，无法与公开监管文件核对。达到尽调质量的数据室应把报告销售额桥接到经审计报表、 分部收入、单位销量、价格 /
              组合、零售商集中度、库存周转和工厂层面吞吐量。在此之前，增长作为市场信号可信，但不足以证明利润率或估值。
