chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Chobani 是一家美国私营食品饮料公司，最知名身份是美国希腊酸奶龙头品牌。公司由 Hamdi Ulukaya 创立； 这位具库尔德背景的土耳其移民先在 2005 年做小规模 feta 业务，随后靠 Small
              Business Administration 贷款买下纽约州北部一座停产的 Kraft 酸奶工厂，并在 2007 年推出 Chobani 品牌希腊酸奶。公司总部位于纽约州 Norwich，并在 Idaho 州
              Twin Falls 运营其所称全球最大酸奶制造设施之一，同时保留纽约州北部的原有工厂。Chobani 的核心商业模式是品牌消费包装品：
              公司制造乳品和植物基产品，通过美国商超、量贩、会员仓储和便利零售渠道销售，围绕蛋白含量、清洁标签定位和品牌信任竞争。 过去几年，公司已经远远走出杯装酸奶，进入燕麦奶、咖啡奶精、即饮咖啡，并通过收购拿下 La
              Colombe 咖啡和 Daily Harvest 餐食套装。本章先固定身份、领导层、资本结构、规模指标和里程碑时间线，供后续章节作为事实底座；同时标出私人公司不透明带来的限制，
              即不少判断只能依赖公司声明，而不是经审计披露。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO023
              - CO024
      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Chobani 的身份与创始人 Hamdi Ulukaya 密不可分。Ulukaya 兼任董事长和 CEO，仍是多数股东，这让公司在风险和估值章节反复出现明显的关键人依赖。 他围绕使命驱动、员工中心的理念打造
              Chobani：员工中约三成是移民或难民；2016 年，他通过员工持股计划向长期员工承诺股权份额。 他在 2016 年创立 Tent Partnership for
              Refugees，这一联盟动员数百家公司雇佣并融入难民，也借 Chobani 品牌推动人道主义议题。 对一家如此规模的公司而言，治理细节相对稀薄：Chobani 是创始人控制的私营企业，对董事会构成、独立董事以及
              2025 年售出股权附带的权利披露很少。 所有权和决策权集中在单一创始人手里，既是优势——长期愿景和品牌守护更连贯——也是治理风险，因为继任、董事会独立性和小股东保护无法公开核验。 创始人以下的领导层连续性，以及
              2025 年股权投资者身份，都是需要带入尽调的明确缺口。
