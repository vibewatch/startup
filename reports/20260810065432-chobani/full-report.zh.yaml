      - number: '8.3'
        title: 融资背景和进入纪律
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月 6.5 亿美元股权融资、约 200 亿美元投后估值，是当前融资锚点；但这是谈判形成的私人估值，不是连续定价市场。它隐含约 5.3x 的 FY2025 预测净销售额（38
              亿美元），而典型食品饮料交易和上市公司销售倍数约为 2.5–4x，EV/EBITDA 约为低到中十几倍。对一个接近 28%
              增长的规模化品类领导者而言，溢价可以辩护，但公开证据没有证明确切股权类别、清算优先权、参与权、棘轮条款、二级交易部分、期权池刷新或投资者否决权。早期背景也很复杂：2021 年 IPO 寻求超过 100
              亿美元估值，2022 年 9 月撤回；La Colombe 又带来据报 5.5 亿美元定期贷款，公司还承诺至少 17 亿美元投入 Rome 和 Twin Falls
              产能。进入纪律应基于正常化收入、EBITDA、自由现金流和净债务，而不是投后估值标题。要求完整摊薄股权结构表、债务明细、认购协议和下行情境分配瀑布；没有这些资料，就应相对 200
              亿美元使用重大折价，且不要给出买入投资论证。
            claimRefs:
              - CV014
              - CV015
