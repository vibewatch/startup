      - number: '1.3'
        title: 融资历史、估值与资本
        blocks:
          - type: paragraph
            body: >-
              Chobani 最醒目的资本事件，是 2025 年 10 月完成 $650 million 股权融资。公司和媒体称该轮估值约 $20 billion， 相比 2021-2022 年夭折 IPO 前后讨论的低于
              $10 billion 水平大幅抬升。公司称资金将用于产能扩张和创新， 包括纽约州 Rome 的 $1.2 billion 乳品工厂，以及 Idaho 州 Twin Falls 的 $500 million
              扩建； 但公司没有公开披露 2025 年投资者身份，只称其为长期、产业导向的支持者。更早之前，Chobani 据报道在 2014 年接受 TPG $750 million 少数股权投资；2023 年收购 La
              Colombe 时，又部分依靠 $550 million 定期贷款融资，因此仍有有意义的杠杆， 财务章节会进一步拆解。公司 2021 年 11 月提交上市申请，寻求超过 $10 billion 估值，随后在
              2022 年 9 月因 IPO 市场降温撤回注册。 因为 Chobani 是私营公司，也不发布经审计报表，其真实收入、利润率和资产负债表位置依赖公司声明和媒体报道，而不是监管文件； 2025
              年融资条款——优先权、控制权和是否包含老股交易——也未公开。
