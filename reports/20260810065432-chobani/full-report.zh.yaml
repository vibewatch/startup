      - number: '1.4'
        title: 规模与封面指标
        blocks:
          - type: paragraph
            body: >-
              从规模看，Chobani 预计 2025 年净销售额约 $3.8 billion，并将其描述为约 28% 的同比增长；公司估计拥有 5,000
              多名员工，覆盖制造、研发和商业职能。它在美国希腊酸奶品类占领先份额，在美国整体酸奶市场占高十位数到 20% 左右份额，
              市场和竞争对手章节会进一步展开。若投资者正常承销，若干封面指标本应核验，但公开来源无法做到：经审计收入和盈利能力、毛利率和经营利润率、 客户或家庭渗透数、2025
              年融资后的净杠杆，以及估值隐含收入倍数，都依赖私人数据。收入数字本身也只是公司预测，而非审计结果， 因此按公司声称处理。若某个封面指标没有支撑，本报告记录 null
              值和具体尽调路径——例如索取经审计财务报表、股权结构表和 2025 年认购协议—— 而不是用估算替代。KPI 快照表和图示汇总了今天能核验的内容，以及仍然存在的证据缺口。
