      - number: '7.6'
        title: 缓释、监测指标和投资逻辑击穿触发条件
        blocks:
          - type: paragraph
            body: >-
              风险项目应把不确定性转成可观察测试。在法律和监管层，监测按 SKU
              拆分的新投诉、索赔函、案卷事件、监管接触、标签变化、包装测试失败、召回通知和保险准备金变动。在运营层，跟踪里程碑偏差、投产良率、一次通过质量、报废、停机、清洁和过敏原偏差、供应商履约率、牛奶成本偏差、劳动力流失、冷链异常和纠正措施关闭。在合作伙伴层，监测零售商和分销商占比、按时足量交付表现、贸易费用率、续约日期、货架重置、KDP
              销量和贡献利润率，以及纽约激励交付物。在财务层，监测周度现金、契约余量、资本开支对预算、营运资本天数、净杠杆、利息负担、按产品拆分毛利率、自有品牌价差和估值标记。每个指标都需要负责人、节奏和升级阈值；没有预先约定动作的仪表盘不是缓释。核心尽调事项包括诉讼案卷和保险、FDA
              与州级往来、标签证据、设施审计和召回记录、工厂预算和爬坡模型、供应商和零售商合同、KDP
              条款、债务协议、股权结构表、激励协议、经审计财务、盈利质量工作和继任文件。终止标准表有意保守：重大食品安全事件、实质性禁令或召回、工厂反复表现不达标、契约违约、流动性跑道低于批准下限，或创始人连续性丧失且没有继任者，都应暂停投资并强制完整下行情境。
