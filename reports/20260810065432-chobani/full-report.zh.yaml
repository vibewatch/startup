      - number: '5.4'
        title: 部署、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              部署是一个带消费者界面的实体分销问题。产品必须按规格制造，装入正确形态，通过合适的冷藏或常温物流移动，由零售上架，并在家中准备或消费。
              因此，支持不是软件客服台，而是包装说明、营养和成分信息、零售商服务以及产品投诉处理。公开记录确认，路线图以 2025 至 2027 年的产能扩张、 高蛋白酸奶和奶精延伸，以及通过 Daily Harvest
              扩张植物基为中心。La Colombe 增加了独立咖啡平台和 KDP 关系， 可以拓宽 RTD 分销。这些都是可信战略里程碑，但不等同于有承诺日期、经验证销量、服务级别目标或发布后队列的发布计划。
              投资者在把路线图视为已交付能力前，应要求工厂投产关口、SKU 精简标准、冷链服务水平、投诉率、零售商补货率、货架期研究和被收购品牌整合计划。
