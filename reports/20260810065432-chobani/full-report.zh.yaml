  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与品类边界
        blocks:
          - type: paragraph
            body: >-
              Chobani 的直接竞争集合，是品牌冷藏酸奶货架：Danone 的 Oikos、Two Good、Activia 和 Light+Fit；Lactalis 收购的美国 Yoplait 与 Liberté
              组合；Fage；以及 Lactalis 旗下 Siggi's 冰岛风格酸奶。这些既有玩家带来成熟品牌、制造能力和零售商关系； Chobani 约 20% 的美国整体酸奶份额和超过 40%
              的希腊酸奶份额，则让它成为品类领导者，而不是利基挑战者。相邻竞争者也重要， 因为同一批健康意识消费者可以在消费场景变化时，转向 Oatly 或 Planet Oat 燕麦奶，或转向 Coffee mate 和
              International Delight 奶精。 自有品牌是最清晰的现状替代：零售商可以以更低价格提供可接受酸奶，消费者也可以跨品牌多栖。大型零售商若能接入代工制造，
              内部自建同样可信；可能进入者还包括规模化天然食品、乳品和饮料公司向高蛋白形态延伸。因此，版图覆盖产品替代、零售商自有供给和既有玩家组合反击， 不只是酸奶品牌知名度。
