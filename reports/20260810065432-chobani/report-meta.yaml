companyProfile:
  summary: >-
    Chobani is a privately held US food and beverage company founded by Turkish immigrant Hamdi
    Ulukaya, best known as the leading American Greek-yogurt brand. It has expanded well beyond
    yogurt into oat milk, high-protein coffee creamers, ready-to-drink coffee (La Colombe) and
    plant-based meals (Daily Harvest), and is undertaking a major US manufacturing build-out. In
    October 2025 it raised $650 million in equity at a roughly $20 billion valuation.
  foundedDate: "2005-01-01"
  founders:
    - name: Hamdi Ulukaya
      role: Founder, Chairman & CEO
      background: >-
        Turkish immigrant of Kurdish descent who bought a shuttered Kraft yogurt plant in upstate
        New York with an SBA loan and launched Chobani Greek yogurt in 2007.
      claimRefs: [CO007, CO011]
  foundingLocation: New Berlin / Norwich, New York, USA
  headquarters: Norwich, New York, USA (flagship plant in Twin Falls, Idaho; new NYC HQ planned)
  productSummary: >-
    Branded Greek yogurt (core), oat milk, high-protein yogurt and coffee creamers, ready-to-drink
    and cold brew coffee (La Colombe), cream cheese, and plant-based meal kits (Daily Harvest), sold
    through US grocery, mass, club and convenience retail.
  customerFocus: >-
    US grocery, mass, club and convenience retailers (Walmart, Costco, Target, Kroger, Albertsons)
    and, through them, mainstream health-conscious consumers; plus DTC subscribers via Daily Harvest.
  businessModel: >-
    Branded consumer packaged goods: vertically integrated dairy and plant-based manufacturing sold
    at premium price points through retail distribution, competing on protein, clean-label
    positioning and brand trust.
  stage: Private, late-stage (previously attempted IPO in 2021)
  fundingStatus: >-
    Raised $650 million in equity in October 2025 at a roughly $20 billion valuation; also carries
    leveraged debt (~$550M term loan) used partly to fund the La Colombe acquisition.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO011]
summary:
  headline: >-
    Category-leading, founder-controlled US yogurt brand compounding revenue at a stretched but
    defensible ~$20 billion private valuation, gated by opacity, leverage and capital intensity.
