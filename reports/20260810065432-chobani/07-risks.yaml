  - FR002
- id: operational-quality-and-safety
  title: Operational, quality and supply-chain risk
  body: 'The operational risk is a scale-up problem with food-safety consequences. The Rome plant and Twin Falls expansion
    are unusually capital-intensive, and the public record does not establish final design capacity, commissioning dates,
    validated yields, hiring readiness, cold-chain redundancy or the working-capital curve. A delay can strand construction
    cash while the legacy network continues to carry demand, and an underutilized facility can raise unit costs rather than
    lower them. Dairy input availability and commodity prices can compress margin, while labor scarcity or turnover can reduce
    throughput and increase deviation risk. Yogurt, coffee and meal-kit operations also broaden quality systems and integration
    interfaces. Recalls or allergen failures are low-frequency but high-impact because they can propagate through retailers
    and erode trust quickly; the supplied adverse recall reporting makes this a monitored risk rather than a hypothetical
    one. Mitigation maturity is medium: a scaled food manufacturer should have HACCP, traceability, supplier qualification,
    preventive maintenance, sanitation validation, environmental monitoring and business-continuity plans, but those controls
    are not publicly evidenced at the project level. Request facility-level KPIs, third-party audit results, recall simulations,
    supplier concentration, milk procurement terms, labor turnover, capex contingency and cold-chain service levels. Kill
    criteria should include repeated critical deviations, a material recall, commissioning yield below plan or capex overrun
    that consumes liquidity headroom.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR038
  - CR042
  - CR043
