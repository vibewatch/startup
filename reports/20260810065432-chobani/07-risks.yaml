  evidenceGaps:
  - type: missing-source
    severity: material
    topic: phthalates litigation
    missingEvidence: Complete court dockets, pleadings, class allegations, insurance coverage, reserves and regulator correspondence
      for packaging claims.
    whyItMatters: Potential damages, recall obligations and brand impact cannot be sized from media summaries alone.
    diligencePath: Have counsel obtain docket histories, insurer notices, supplier indemnities and packaging migration test
      reports.
    relatedQuestionRefs:
    - QR005
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: governance and succession
    missingEvidence: Board roster, independent-director rights, succession plan, delegated authority and key-person insurance.
    whyItMatters: Founder concentration is a material continuity and minority-protection risk.
    diligencePath: Request governance documents, investor rights agreement, succession materials and insurance certificates.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: blocking
    topic: liquidity and covenants
    missingEvidence: Audited financials, post-raise balance sheet, debt schedules, covenants, liquidity headroom and cash forecast.
    whyItMatters: Capex and leverage risk cannot be underwritten against a private projected-sales figure.
    diligencePath: Obtain audited statements, quality-of-earnings report, lender package and 13-week cash model under NDA.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: financial partner diligence
    missingEvidence: Retailer concentration, KDP contract economics, incentive agreement terms and complete cap table.
    whyItMatters: Channel and capital-provider dependencies may change downside cash flow and governance.
    diligencePath: Request customer/channel concentration schedules, partner agreements and New York incentive contracts.
    relatedQuestionRefs:
    - QR035
    relatedTableRefs:
    - TR003
