- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Food safety / legal
    - Critical contamination, allergen event, injunction or recall
    - Any event with broad SKU or national retailer impact
    - Pause investment; invoke recall/legal playbook and re-underwrite brand damage
  - - Plant execution
    - Commissioning yield or launch date materially misses approved plan
    - Two consecutive milestone misses or capex overrun consuming contingency
    - Freeze discretionary capex; require independent review and downside liquidity case
  - - Liquidity / leverage
    - Covenant headroom or cash runway falls below board-approved minimum
    - Forecast breach within 13 weeks or material refinancing gap
    - Stop new commitments; seek equity/debt cure and reset valuation
  - - Margin / competition
    - Private-label and commodity pressure erode economics
    - Sustained gross-margin decline with price gap widening
    - Reprice, rationalize SKUs and revise valuation multiple
  - - Partner / retailer
    - Major distributor, retailer or incentive counterparty withdraws
    - Loss of critical channel or incentive clawback notice
    - Activate alternate route-to-market and pause underwriting until replacement proven
  - - Leadership / governance
    - Founder unavailability without credible successor or independent oversight
    - Unplanned absence or control dispute with no documented delegation
    - Pause investment and require governance remediation
  notes: Thresholds are proposed IC monitoring rules, not reported company covenants; replace with board-approved limits after
    diligence.
