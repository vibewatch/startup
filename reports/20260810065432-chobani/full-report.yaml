      - number: '4.6'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Chobani has the outline of a durable premium CPG compounder: a large yogurt base, adjacent
              categories, recognizable brands and enough scale to support manufacturing leverage. Revenue quality is
              directionally attractive if repeat retail demand, price realization and acquisition integration hold, but
              the evidence is not yet investable at the precision implied by a roughly $20 billion valuation. The
              principal margin path is operational: protect premium mix, control trade spend and commodity exposure,
              fill the Rome and Idaho assets, and demonstrate that La Colombe and Daily Harvest add contribution rather
              than complexity. Capital intensity is the counterweight: $1.7 billion of disclosed plant investment plus
              debt and integration spending can make free cash flow lumpy and increase downside duration. The 2022 IPO
              withdrawal is an adverse financing precedent, while private-label margin pressure is an adverse category
              signal. The verdict is research-more / conditional track: do not underwrite a precise return until audited
              statements, a segment and unit bridge, gross-margin and EBITDA history, cash/burn/runway, debt covenants,
              cap table, retailer economics and plant utilization are delivered. The $3.8 billion sales estimate is a
              useful scale marker, not a substitute for those blockers.
