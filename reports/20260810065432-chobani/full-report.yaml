  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and monetization
        blocks:
          - type: paragraph
            body: >-
              Chobani earns revenue primarily by selling branded consumer packaged food and beverage through retail
              distribution, with Greek yogurt as the economic and brand anchor. The portfolio now adds oat milk, coffee
              creamers, ready-to-drink coffee and La Colombe products, plus Daily Harvest plant-based meals, creating
              several occasions and possible cross-category merchandising rather than a subscription-led software model.
              Public descriptions support a premium positioning: a typical branded yogurt cup is approximately $1-$1.50
              and a multipack approximately $4-$6, but those are indicative shelf-price ranges rather than disclosed
              realized net prices. Retailer discounts, trade spend, promotional allowances, deductions, returns and
              distributor margins therefore determine recognized net sales. The reported approximately $3.8 billion
              FY2025 net sales and 28% growth are a private, unaudited projection, not a filed income statement. Revenue
              recognition policy, segment mix, acquisition accounting and the contribution of Daily Harvest and La
              Colombe are not public, so the apparent growth rate cannot yet be decomposed into price, volume, mix and
              M&A.
