      - number: '2.5'
        title: Sizing uncertainty and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The central diligence issue is denominator discipline. Mordor, Persistence, Verified Market Research and
              Global Market Insights publish yogurt estimates that cannot be reconciled without confirming whether each
              counts retail only, foodservice, value sales, volume, or global spillover; Statista and Emergen introduce
              additional Greek and plant-based definitions. Fortune's oat-milk and dairy-alternatives estimates likewise
              describe different universes. The report preserves those contradictions rather than selecting the largest
              number. Chobani's exact SOM, household penetration, net price realization, retailer concentration, repeat
              purchase, creamer denominator and RTD cold-brew economics are not established by the supplied public
              evidence. Management should provide a category-by-category revenue bridge, Circana or equivalent scan
              data, retailer-level velocity and trade-spend data, cohort or household penetration, gross-to-net
              waterfalls, and a capacity-utilization plan. Sensitivity cases should hold the core yogurt pool constant
              while varying Greek share, adjacency conversion, private-label price gaps and gross margin. Until those
              inputs are available, the addressable-market conclusion is directional rather than an investable bottom-up
              SOM.
            claimRefs:
              - CM019
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
