            body: >-
              The commercial motion is a high-volume retail CPG route to market: national grocery, mass, club,
              convenience and foodservice shelves are the likely demand surface, supported by brand marketing,
              distributor relationships, retailer category reviews and promotional calendars. The model is not sold
              through disclosed annual contracts, so SaaS-style CAC, payback and sales-cycle metrics are not available.
              Useful proxies are velocity per store per week, weighted distribution, repeat purchase, trade-spend rate,
              price realization after promotions, fill rate and the gross margin earned by each channel. Chobani's
              category leadership and premium positioning can improve shelf access and pricing power, while chilled
              logistics, spoilage, retailer deductions and promotional intensity can compress contribution. La Colombe
              adds RTD coffee distribution through Keurig Dr Pepper, and Daily Harvest adds a DTC/meal occasion, but
              public sources do not disclose channel-level revenue or economics. Accordingly, the underwriting question
              is whether brand pull and incremental distribution scale faster than trade investment and cold-chain
              complexity, not whether a conventional inside-sales funnel is efficient.
