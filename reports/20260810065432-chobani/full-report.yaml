  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer architecture: buyer, user and payer'
        blocks:
          - type: paragraph
            body: >-
              Chobani's customer system has three distinct roles. Retailers and distributors are the B2B buyers that
              negotiate assortment, price, promotions, service levels and shelf placement; households are the end users
              choosing yogurt, creamers, oat milk, coffee or meals; and the shopper or household is the payer at
              checkout, except where a subscription or delivery intermediary bills directly. The company sells into US
              grocery, mass, club and convenience, so customer needs differ by channel: grocery shoppers seek routine
              breakfast and snack replenishment, club members buy larger variety packs, mass shoppers trade off
              convenience and price, and convenience shoppers prioritize portability and immediate consumption. Product
              use cases span high-protein nutrition, family snacking, coffee preparation, dairy-free substitution and
              ready-to-drink consumption. The acquired Daily Harvest relationship adds a more meal-oriented, digitally
              mediated use case, while La Colombe extends the brand into coffee occasions. Public sources identify the
              channels and products, but do not disclose account-level revenue, household penetration or payer mix, so
              the segmentation below is directional.
