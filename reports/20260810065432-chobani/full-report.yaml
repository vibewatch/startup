            body: >-
              Named customer evidence is strongest where a retailer exposes a live assortment or a partner describes
              commercial execution. Walmart carries a Chobani catalog and Walmart Connect publishes a Chobani
              craft-and-commerce case study, which together support production shipping and merchandising at scale
              rather than a prospective pilot. Costco lists a 20-count Greek Yogurt Variety Pack, while Target and
              Kroger maintain Chobani brand or search pages; these are direct retail proof points, though they do not
              disclose purchase orders, margin, renewal terms or store-level velocity. The named proof is therefore high
              quality for existence and channel access, medium for outcomes, and low for account economics. Consumer
              reviews add a separate layer: Walmart reviews and an independent Costco review provide usage context,
              while PissedConsumer supplies adverse complaints. None of these public pages is a substitute for
              retailer-confirmed sell-through, but the cross-channel pattern is consistent with an established
              production footprint. Each listed retailer should be tested for current authorization, SKU count, fill
              rate, promotional dependence and gross-to-net terms.
