      - number: '1.3'
        title: Funding history, valuation and capital
        blocks:
          - type: paragraph
            body: >-
              Chobani's headline capital event is an October 2025 equity raise of $650 million that the company and
              press reported at a valuation of roughly $20 billion, a dramatic step-up from the sub-$10 billion figures
              discussed around its aborted 2021-2022 initial public offering. The company said proceeds would fund
              capacity expansion and innovation, including a $1.2 billion dairy plant in Rome, New York and a $500
              million expansion in Twin Falls, Idaho, but it did not publicly disclose the identities of the 2025
              investors, describing them only as long-term, industry-oriented backers. Earlier in its history Chobani
              took a reported $750 million minority investment from TPG in 2014 and financed its 2023 La Colombe
              acquisition partly with a $550 million term loan, leaving it with meaningful leverage that the financials
              chapter examines. The company filed to go public in November 2021 seeking a valuation above $10 billion,
              then withdrew the registration in September 2022 as the IPO market cooled. Because Chobani is private and
              does not publish audited statements, its true revenue, margin and balance-sheet position rest on company
              statements and press reporting rather than filings, and the 2025 round's terms — preference, control and
              secondary components — are not public.
