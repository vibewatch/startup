      - number: '8.5'
        title: Exit readiness and return logic
        blocks:
          - type: paragraph
            body: >-
              Chobani has strategic exit characteristics—national retail distribution, a recognizable consumer brand,
              manufacturing assets and adjacency options—but it is not exit-ready for a disciplined financial sponsor.
              The failed 2021 IPO and 2022 withdrawal demonstrate that public-market timing and disclosure standards
              matter; a future IPO would require audited statements, segment reporting, governance depth, controls and a
              cleaner leverage profile. Strategic buyers could value category leadership or coffee access, yet the La
              Colombe and Daily Harvest integrations, plant ramp and any preference overhang would complicate a sale
              process. A five-year investor case should target a gross return that compensates for private illiquidity
              and dilution; at the current ~$20 billion entry, even a 4–5x sales exit may not generate an attractive
              multiple if growth decelerates and new capital ranks senior. The practical exit plan is to obtain
              information rights now, monitor quarterly KPI and covenant reporting, and preserve a secondary-sale option
              only after transfer restrictions and buyer eligibility are clear. Thesis-break triggers include material
              margin erosion, leverage above agreed limits, failed plant utilization, regulatory or litigation cash
              losses, founder succession failure and a down round.
            claimRefs:
              - CV029
              - CV030
              - CV031
