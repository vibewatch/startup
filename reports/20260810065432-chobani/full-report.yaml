      - number: '5.5'
        title: Trust, safety and quality controls
        blocks:
          - type: paragraph
            body: >-
              Food quality is the trust layer for Chobani's product technology. Customer confidence depends on
              ingredient specifications, allergen and sanitation controls, validated fermentation and filling, packaging
              integrity, cold-chain discipline, date coding, nutrition and ingredient labeling, complaint escalation,
              and recall readiness. Chobani's official surface communicates product and ingredient information, but the
              supplied public sources do not provide an auditable plant-level HACCP summary, third-party certification
              register, microbiological control limits, complaint-rate trend, recall dashboard, or packaging migration
              test results. That evidence gap matters because the company has faced scrutiny around phthalates in
              packaging and litigation around natural and sugar-related claims; those issues make substantiation and
              packaging-quality controls financially relevant even where a court or regulator outcome is not established
              in this chapter's source pack. No source here supports a claim that Chobani has had a particular recall
              count, so recall history remains a diligence request. The correct underwriting posture is not that
              controls are absent, but that their scope, testing, corrective-action performance and certification status
              are not publicly measurable.
