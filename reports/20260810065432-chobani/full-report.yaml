      - number: '2.3'
        title: Buyer, user and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for Chobani is usually a retail category manager or buyer who controls shelf placement,
              assortment, promotions and replenishment, while the payer is the retail banner or distributor that
              purchases inventory and remits trade terms. The end user is a household shopper choosing yogurt, milk or
              coffee products for taste, protein, convenience, dietary preference and price; the consumer may be a
              different person from the budget owner. Foodservice and convenience operators can act as secondary buyers
              for single-serve and cold-brew formats, but the evidence does not establish their share of Chobani sales.
              Adoption proceeds from buyer authorization and planogram placement, through trial supported by promotions
              and sampling, to repeat purchase and expanded facings. Greek-yogurt credibility lowers trial friction in
              core yogurt; protein claims and adjacent formats create permission to cross-sell. Retailer margin,
              velocity, spoilage, cold-chain execution and private-label alternatives determine whether a listing
              becomes durable distribution.
