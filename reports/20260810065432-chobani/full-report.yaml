      - number: '6.4'
        title: Retention, repeat usage and satisfaction
        blocks:
          - type: paragraph
            body: >-
              Yogurt, creamer and coffee are replenishment categories, so repeat purchase is economically important, but
              Chobani does not publish NRR, churn, repeat cohorts, household purchase frequency or a satisfaction score.
              Variety packs and broad everyday-use formats are compatible with recurring consumption, and Walmart and
              independent review pages show that consumers are actively rating products. The sentiment signal is mixed
              rather than uniformly promotional: the brand has visible loyalty and positive usage commentary, but
              PissedConsumer records complaints involving quality and packaging, and the diligence brief flags phthalate
              concerns and related consumer litigation. Complaint-board volume is not a representative satisfaction
              sample, so it should not be extrapolated into a defect rate; it is a monitoring signal that may affect
              repeat and retailer returns. Retention durability therefore remains an underwriting gap. Management should
              provide repeat purchase by cohort and channel, subscription cancellation data for any Daily Harvest-linked
              DTC activity, complaint/return rates, quality incident logs and retailer scorecards to distinguish brand
              affinity from promotional or distribution-driven sales.
            claimRefs:
              - CU021
              - CU022
