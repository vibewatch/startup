      - number: '3.3'
        title: Capability, pricing, distribution and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Chobani's capability advantage is a combination of high-protein product innovation, breadth across dairy
              and adjacent beverages, and a brand narrative built around trust and inclusive employment. Danone and
              Lactalis can counter with portfolio breadth, global procurement and established shelf access; Fage and
              Siggi's compete through focused Greek or Icelandic-style authenticity. Pricing is not a single contract
              metric: refrigerated cups, multipacks, creamers and oat milk are sold through retailer-specific shelf
              prices, promotions and pack sizes. The retained evidence supports a relative premium-versus-value framing
              but not an apples-to-apples price index. Chobani's retail and CTV execution, including the
              Albertsons-NBCUniversal data collaboration, is a meaningful go-to-market signal, yet retailers retain
              substantial assortment and promotion power. Trust and regulatory posture are similarly asymmetric: branded
              companies invest in nutrition and labeling claims, while private label can copy a feature at lower cost;
              all players remain exposed to FDA labeling expectations and consumer-protection scrutiny.
            claimRefs:
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
