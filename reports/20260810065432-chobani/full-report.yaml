  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and competitive substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary begins with US retail yogurt, measured as branded and private-label
              refrigerated yogurt sold through grocery, mass, club, convenience and e-commerce channels. Within that
              boundary, Greek yogurt is the principal subcategory and the cleanest lens on Chobani's core position.
              Included spend is the consumer's recurring purchase of yogurt cups, multipacks and drinkable formats,
              together with adjacent spend that can plausibly be won by the same brand, shelf presence and cold-chain
              capabilities: oat milk, plant-based dairy alternatives, protein-forward creamers and ready-to-drink cold
              brew. Excluded from the core TAM are foodservice-only yogurt, restaurant beverages, unrelated plant-based
              meals and broad coffee occasions that do not share Chobani distribution or a credible product substitution
              path. The status quo is not simply another yogurt brand: consumers can substitute private label,
              conventional dairy yogurt, cottage cheese, oatmeal, fruit or a coffee beverage, while retailers can
              substitute shelf space toward lower-priced private label. This boundary prevents an inflated TAM while
              recognizing adjacency optionality.
            claimRefs:
              - CM001
              - CM002
              - CM005
