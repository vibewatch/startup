      - number: '7.6'
        title: Mitigations, monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk program should convert uncertainty into observable tests. At the legal and regulatory layer,
              monitor new complaints by SKU, demand letters, docket events, regulator contacts, label changes, packaging
              test failures, recall notices and insurance-reserve movement. At operations, track milestone variance,
              commissioning yield, first-pass quality, scrap, downtime, sanitation and allergen deviations, supplier
              fill rate, milk-cost variance, labor turnover, cold-chain excursions and corrective-action closure. At the
              partner layer, monitor retailer and distributor share, on-time-in-full performance, trade-spend rate,
              renewal dates, shelf resets, KDP volume and contribution margin, and New York incentive deliverables. At
              the financial layer, monitor weekly cash, covenant headroom, capex-to-budget, working-capital days, net
              leverage, interest burden, gross margin by product, private-label price gaps and valuation marks. Each
              indicator needs an owner, cadence and escalation threshold; a dashboard without a pre-agreed action is not
              mitigation. The core diligence asks are litigation dockets and insurance, FDA and state correspondence,
              label substantiation, facility audits and recall records, plant budget and ramp model, supplier and
              retailer contracts, KDP terms, debt agreements, cap table, incentive agreements, audited financials,
              quality-of-earnings work and succession documents. The kill criteria table is intentionally conservative:
              a critical food-safety event, material injunction or recall, repeated plant underperformance, covenant
              breach, liquidity runway below the approved minimum, or loss of founder continuity without a successor
              should pause investment and force a full downside case.
