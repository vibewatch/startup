      - number: '8.3'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The October 2025 $650 million equity round at approximately $20 billion post-money is the current
              financing anchor, but it is a negotiated private mark rather than a continuously priced market. It implies
              roughly 5.3x FY2025 projected net sales of $3.8 billion, versus typical food and beverage transaction and
              public-company sales multiples around 2.5–4x and low-to-mid-teens EV/EBITDA. The premium can be defensible
              for a scaled category leader growing near 28%, but public evidence does not establish the exact share
              class, liquidation preference, participating rights, ratchets, secondary component, option-pool refresh or
              investor vetoes. Earlier context is also mixed: a 2021 IPO sought more than $10 billion and was withdrawn
              in September 2022, while La Colombe added a reported $550 million term loan and the company is committing
              at least $1.7 billion to Rome and Twin Falls capacity. Entry discipline should be based on normalized
              revenue, EBITDA, free cash flow and net debt—not the headline post-money. Require a fully diluted cap
              table, debt schedule, subscription agreement and downside waterfall; absent those, use a material discount
              to $20 billion and do not underwrite a buy.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
