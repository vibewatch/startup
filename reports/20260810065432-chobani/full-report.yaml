      - number: '8.4'
        title: Scenario valuation and comparable set
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single point estimate because Chobani’s private financials
              leave margins, debt and mix uncertain. The base case assumes sales compound from the approximately $3.8
              billion 2025 projection at 12–15% for five years, EBITDA margin reaches 12–14%, and the exit multiple
              normalizes toward 3.0–3.5x sales; that produces a broad enterprise-value range below the current mark
              after allowing for net debt and dilution. The bull case assumes high-protein innovation, coffee cross-sell
              and plant utilization sustain 20%+ growth and a 15–17% margin, supporting a premium 4–5x sales outcome.
              The bear case assumes private-label share gains, input inflation, integration friction and multiple
              compression to 2–2.5x sales. Danone is a public branded benchmark; Oatly is a distressed public
              challenger; Lactalis/Yoplait and Siggi’s/Fage provide strategic private or M&A reference points, while the
              $20 billion round is the relevant primary mark. None is perfectly comparable, so each row states a
              limitation and the comparable table is explicitly partial.
            claimRefs:
              - CV022
              - CV023
