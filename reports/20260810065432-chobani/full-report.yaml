  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer products and everyday workflows
        blocks:
          - type: paragraph
            body: >-
              Chobani's product is best understood as a set of food occasions rather than a single SKU. A shopper buys
              Greek yogurt for breakfast, a snack, or a protein-led meal component; oat milk for coffee, cereal, or
              substitution occasions; creamers for at-home coffee preparation; cream cheese for spreading and cooking;
              and La Colombe cold brew or ready-to-drink coffee for portable caffeine. Daily Harvest extends the
              portfolio into plant-based meals that can be stored and prepared at home. The customer workflow is
              therefore discover, select a branded refrigerated or shelf-stable item, transport it through a retail cold
              chain where applicable, consume or prepare it, and repurchase when the occasion recurs. Chobani's official
              product surface supports the breadth of the portfolio, while independent reviews and a
              practitioner-community signal provide limited external evidence on how oat milk is compared and discussed.
              The product promise combines taste, convenience, protein, clean-label cues and recognizable brand
              architecture, but public data does not quantify repeat purchase, household penetration, or SKU-level
              contribution.
