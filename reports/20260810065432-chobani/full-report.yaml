      - number: '6.2'
        title: Adoption trajectory and distribution footprint
        blocks:
          - type: paragraph
            body: >-
              Adoption is best evidenced by distribution breadth and the persistence of retail availability rather than
              by a disclosed cohort metric. Chobani's Walmart, Costco, Target and Kroger listings show that the brand is
              stocked across mass, club and grocery environments, and the Walmart Connect case study describes a live
              craft-and-commerce program rather than a laboratory pilot. Costco's 20-count variety pack is a format
              designed for planned household replenishment, while Walmart reviews and independent Costco commentary
              provide a consumer-facing signal that products are being purchased and evaluated in ordinary use. The 2007
              Greek-yogurt launch and later expansion into high-protein yogurt, creamers, oat milk and coffee indicate a
              multi-occasion route to wider basket penetration. Daily Harvest also adds access to digitally engaged,
              meal-planning customers through an acquired platform. These are adoption proxies, not proof of a
              quantified household-retention curve: public materials do not give store counts, velocity, ACV,
              distribution-weighted penetration, repeat rate or year-over-year unit cohorts. Management diligence should
              therefore reconcile retailer sell-through with shipment data.
