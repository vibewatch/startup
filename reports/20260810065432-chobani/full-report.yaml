        title: Public traction versus private-metric gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports meaningful scale but not a complete operating dashboard. Chobani reports or is
              reported to project approximately $3.8 billion of FY2025 net sales and 28% year- over-year growth, with a
              leading US Greek-yogurt position and a broadening product portfolio. It has a large Twin Falls footprint,
              a Rome plant under construction and a portfolio expanded by two acquisitions. Those indicators establish
              distribution and capacity ambition, but they do not establish revenue quality, utilization or cash
              returns. Public sources do not provide audited revenue, gross margin, EBITDA, operating cash flow, burn,
              exact debt balance, cap table, CAC, payback, customer or household counts, units sold, store-level
              velocity, or facility utilization. The $3.8 billion number is particularly important to mark as a gap: it
              is a private estimate or projection and cannot be reconciled to a public filing. A diligence-quality data
              room should bridge reported sales to audited statements, segment revenue, unit volumes, price/ mix,
              retailer concentration, inventory turns and plant-level throughput. Until then, growth is credible as a
              market signal but not sufficient as a margin or valuation proof point.
