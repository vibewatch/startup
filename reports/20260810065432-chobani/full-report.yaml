        - Target scale and deal structure differ; partly debt-funded
      - - Chobani October 2025 round
        - Primary private financing
        - $650M at ~$20B post-money; ~5.3x projected sales
        - Most direct current price discovery
        - Negotiated mark; preferences and financials undisclosed
    notes: >-
      This is a partial, decision-relevant sample of public, private and M&A references rather than an exhaustive
      universe. Sector multiple observations are triangulated from DealMatrix, Peakstone, Baker Tilly and Greenwich;
      company-specific rows rely on reported transactions and filings where available.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers selected public, private and M&A yogurt, dairy, plant-based and financing references; excludes unrelated
        food sectors and undisclosed transactions lacking a usable valuation boundary.
    evidenceGap:
      type: missing-source
      severity: material
      topic: comparable valuation
      missingEvidence: Current trading multiples, private transaction prices and normalized Chobani EBITDA are incomplete.
      whyItMatters: A partial comp set can overstate or understate the premium required for a private category leader.
      diligencePath: Obtain current public comps, banker transaction precedents and Chobani normalized financials.
      relatedTableRefs:
        - TV004
    claimRefs:
      - CV023
      - CV026
      - CV027
      - CV028
      - CV031
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth reset
        - Net sales growth below 10% for two periods
        - Premium growth support for 5.3x sales disappears
        - Freeze new entry; re-underwrite base case
      - - Margin compression
        - EBITDA margin below 10% or down >300 bps
        - Brand scale fails to translate into economics
        - Exit or demand price reset
      - - Leverage / liquidity
        - Net leverage above 4.0x or covenant breach
        - Debt absorbs cash and restricts capex / exit
        - Require cure plan; exit if unresolved
      - - Plant execution
        - Rome or Twin Falls materially late, over budget or underutilized
        - $1.7B+ capex destroys returns and capacity thesis
        - Stop funding and reassess impairment
      - - Governance / succession
        - No credible successor or minority protections
        - Founder key-person risk becomes unbounded
        - No-entry or seek protective rights
      - - Legal / product
        - Material adverse judgment, recall or labeling enforcement
        - Cash loss and brand trust damage sales
        - Exit unless insured and quantified
    notes: >-
      Triggers are monitoring thresholds for an investment committee, not predictions. Thresholds should be calibrated
      to the audited baseline and debt documents once obtained.
    claimRefs:
      - CV006
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Financial statements
        - Audited FY2023–FY2025 P&L, balance sheet, cash flow and monthly accounts
        - Validate sales, margins, FCF and the 5.3x denominator
        - CFO / NDA data room; quality of earnings
      - - Cap table / preferences
        - Fully diluted ownership, 2025 subscription agreement, employee plan and KDP / TPG rights
        - Quantify dilution, liquidation preference and control overhang
        - General counsel; investor counsel review
      - - Debt
        - Outstanding principal, rates, maturities, covenants and security package
        - Measure equity value and refinancing risk
        - Treasury / lenders; covenant certificate
      - - Unit economics
        - Price/promo, gross-to-net, velocity, repeat and contribution margin by category
        - Test whether growth is profitable and defensible
        - Commercial analytics; retailer data
      - - Capex / plants
        - Rome and Twin Falls budget, schedule, utilization, yield and quality KPIs
        - Assess capital intensity and execution risk
        - COO / plant visits; independent engineer
      - - Legal / regulatory
        - Phthalates, natural, zero-sugar/allulose cases, recalls and insurance
        - Quantify cash, labeling and brand downside
        - General counsel / regulatory counsel
      - - Exit readiness
        - IPO controls, audited reporting, transfer limits and strategic buyer map
        - Determine liquidity and realistic return path
        - Board / sponsor banker; sell-side readiness
    notes: >-
      These asks are prioritized by their ability to change recommendation, confidence, risk rating or valuation stance.
      Unanswered material asks keep the call at track rather than permitting false precision.
    claimRefs:
      - CV014
      - CV018
      - CV019
      - CV035
      - CV036
      - CV037
      - CV038
