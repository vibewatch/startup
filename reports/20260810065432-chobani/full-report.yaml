      - number: '4.5'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Chobani raised $650 million of equity in October 2025 at an approximately $20 billion valuation, with
              proceeds described as supporting growth, innovation and manufacturing. That equity provides strategic
              capacity, but it is not the same as disclosed operating liquidity: public sources do not show cash on
              hand, free cash flow, monthly burn, restricted cash, investor rights or the amount already committed to
              the plant program. A reported approximately $550 million leveraged term loan from 2023, used around the La
              Colombe transaction, introduces interest expense, refinancing and covenant sensitivity; S&P coverage
              confirms a rated credit context but not a public current balance. The combined acquisition and
              manufacturing agenda makes financing dependency a central diligence issue. A next-round trigger would be a
              cash shortfall during plant construction or a covenant/working-capital squeeze; conversely, internally
              funded capex and positive free cash flow would reduce dependence. The appropriate use-of-funds test is
              whether equity is funding capacity with visible utilization and returns, rather than masking operating
              losses. Investors should require a post-raise balance sheet, debt schedule, liquidity forecast, capex
              phasing and downside cases before treating the valuation as adequately capitalized.
