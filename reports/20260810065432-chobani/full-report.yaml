      - number: '3.5'
        title: Moat durability, commoditization and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Chobani's moat is durable only if brand trust and innovation continue to earn a price and velocity premium
              over acceptable substitutes. The brand's Greek-yogurt leadership, high-protein positioning, broadening
              portfolio and founder-led purpose are difficult to recreate quickly, while its manufacturing investments
              raise the fixed-cost and quality bar for smaller entrants. The adverse case is equally clear. Circana's
              estimate of approximately $330 billion in US private-label CPG sales and RSM's discussion of margin
              pressure show that retailers have both incentive and capability to commoditize branded features. AInvest
              frames Chobani's growth as a premium moat facing a scaling storm, reinforcing the risk that capex,
              promotions and adjacent-category expansion dilute returns. Oatly and Planet Oat can displace dairy
              occasions, and Nestlé and Danone can contest creamer adjacency with greater scale. The resulting
              investment conclusion is a strong current position but medium durability: diligence should test net
              pricing, repeat rates, retailer concentration, capacity utilization, supplier terms and the return on Rome
              and Idaho investments rather than assuming share automatically converts to excess margin.
