  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is that Chobani owns a scaled, trusted US Greek-yogurt franchise and is using that
              distribution and brand permission to extend into high-protein creamers, oat milk, ready-to-drink coffee
              and plant-based meals. Reported 2025 net sales of approximately $3.8 billion and roughly 28%
              year-over-year growth indicate unusual momentum for a large food company, while the company’s roughly 20%
              total-yogurt share and more than 40% Greek-yogurt share, as reported by market sources, suggest meaningful
              retailer and consumer pull. The anti-thesis is valuation and evidence quality: $20 billion post-money is
              about 5.3x projected sales, above the 2.5–4x food-and-beverage sales range, before an investor can verify
              gross margin, EBITDA, net debt, cohort or household penetration. Private-label pressure, Danone and
              Lactalis competition, $1.7 billion-plus announced plant spending, leveraged debt, litigation and founder
              concentration can convert growth into poor equity returns. Thus product-market quality is stronger than
              underwriting certainty, and price—not brand admiration—drives the call.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV032
      - number: '8.2'
        title: Recommendation, confidence and risk rating
        blocks:
          - type: paragraph
            body: >-
              Recommendation: track. Confidence: medium. Risk rating: high. Valuation stance: stretched. This is not a
              judgment that Chobani is a weak business; it is a decision to preserve optionality until the investor
              receives audited or at least lender-quality financial statements, the post-raise cap table, preference
              stack and evidence that growth converts to durable margin. A buyer at the reported $20 billion post-money
              price would need a credible path to roughly low-to-mid-teens EBITDA margins and sustained high-teens
              growth, or a strategic scarcity premium that is not yet publicly evidenced. A secondary or primary entry
              should therefore require a discount to the last mark, information rights, customary minority protections
              and a clear liquidity plan. Hold existing exposure only if the security has downside protection and the
              position is sized for high private-company risk; exit or decline if diligence shows weak contribution
              margins, heavy net leverage, punitive preferences or a growth reset. The recommendation can move to buy
              only after the evidence and price discipline improve; it should move to exit when the thesis-break
              triggers in this chapter are breached.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
