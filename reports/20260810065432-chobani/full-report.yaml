chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters and business model
        blocks:
          - type: paragraph
            body: >-
              Chobani is a privately held US food and beverage company best known as the leading American Greek-yogurt
              brand. It was founded by Hamdi Ulukaya, a Turkish immigrant of Kurdish descent who bought a shuttered
              Kraft yogurt plant in upstate New York with a Small Business Administration loan and launched
              Chobani-branded Greek yogurt in 2007 after starting a small feta operation in 2005. The company is
              headquartered in Norwich, New York, and operates what it describes as one of the world's largest yogurt
              manufacturing facilities in Twin Falls, Idaho, alongside its original upstate New York plants. Chobani's
              core business model is branded consumer packaged goods: it manufactures dairy and plant-based products and
              sells them through US grocery, mass, club and convenience retail channels, competing on protein content,
              clean-label positioning and brand trust. Over the past several years the company has broadened well beyond
              cups of yogurt into oat milk, coffee creamers, ready-to-drink coffee and, through acquisition, La Colombe
              coffee and Daily Harvest meal kits. This chapter establishes the identity, leadership, capital structure,
              scale metrics and milestone chronology that later chapters treat as ground truth, and flags where
              private-company opacity forces reliance on company statements rather than audited disclosure.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO023
              - CO024
      - number: '1.2'
        title: Founders, leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Chobani's identity is inseparable from founder Hamdi Ulukaya, who serves as chairman and chief executive
              and remains the majority owner, giving the company an acute key-person dependence that recurs across the
              risk and valuation chapters. Ulukaya built Chobani around a purpose-driven, employee-centric philosophy:
              roughly three in ten of its workers are immigrants or refugees, and in 2016 he pledged equity stakes to
              long-tenured employees through an ownership program. He founded the Tent Partnership for Refugees in 2016,
              a coalition that mobilizes hundreds of companies to hire and integrate refugees, and has used Chobani's
              brand to advance humanitarian causes. Governance detail is comparatively thin for a company of this scale:
              as a private, founder-controlled business, Chobani discloses little about its board composition,
              independent directors or the rights attached to the equity sold in 2025. The concentration of ownership
              and decision-making in a single founder is simultaneously a strength — consistent long-term vision and
              brand stewardship — and a governance risk, because succession, board independence and minority-investor
              protections are not publicly verifiable. Leadership continuity below the founder, and the identities of
              the 2025 equity investors, are documented gaps carried into diligence.
            claimRefs:
