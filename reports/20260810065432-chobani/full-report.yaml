      - number: '7.4'
        title: Partner, retailer and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Chobani's route to market depends on a network that is strategically valuable but not fully visible from
              public sources. Keurig Dr Pepper became a minority shareholder and RTD distribution partner through La
              Colombe; that relationship can accelerate reach, yet it also creates dependency on service levels,
              economics, data access, channel priorities and governance alignment. Retailer concentration at large
              grocery, mass and club accounts such as Walmart and Costco is a second dependency: a reset, private-label
              push, unfavorable trade terms or a delisting can reduce volume faster than a consumer brand can replace
              it. The Rome project adds a regulator and incentive counterparty because New York State support is tied to
              investment and employment commitments. Capital providers and lenders are dependency points too; the $550
              million term loan and undisclosed post-raise covenants could constrain choices during a downturn. Daily
              Harvest adds integration and portfolio complexity, even though transaction terms are undisclosed.
              Mitigations should include dual-channel distribution, retailer-level contribution-margin reporting,
              service-level and termination protections, alternative co-pack or logistics capacity, lender covenant
              forecasting, incentive compliance ownership and integration milestones. Diligence should quantify top-ten
              retailer and distributor shares, contract renewal dates, rebates, chargebacks, KDP rights, lender baskets,
              change-of-control provisions and the exact New York incentive clawback mechanics. A single partner loss is
              not automatically thesis-breaking, but simultaneous loss of a major retailer and distributor is.
            claimRefs:
              - CR018
              - CR019
              - CR020
