      - number: '4.3'
        title: Cost structure, working capital and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Chobani's cost base should be understood as a food-manufacturing system: milk and other ingredients,
              packaging, direct plant labor, utilities, quality and food-safety controls, freight, warehousing, retailer
              trade spend and marketing all sit between shelf price and cash generation. Dairy and packaging inflation,
              utilization, product mix and co-manufacturing or distribution choices are the principal gross-margin
              drivers, but no public gross-margin bridge or EBITDA schedule is available. Perishable inventory and
              retailer receivables create working- capital exposure, while supplier terms and promotional accruals can
              materially change cash conversion. The disclosed $1.2 billion Rome, New York plant and $500 million Twin
              Falls expansion imply at least $1.7 billion of announced manufacturing investment, before maintenance
              capex, integration spending or headquarters costs. New capacity can lower unit costs at utilization, but
              commissioning risk, ramp-up, depreciation and under-absorption create a near-term margin headwind. The
              adverse case is that private-label competition and scaling costs consume the benefit of premium pricing
              before the new assets reach efficient throughput.
