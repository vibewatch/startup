      - number: '8.6'
        title: Final diligence asks and decision gates
        blocks:
          - type: paragraph
            body: >-
              The final diligence agenda is intentionally concentrated on facts that can move the recommendation or
              valuation stance. First obtain audited FY2023–FY2025 financials and monthly management accounts, including
              revenue by category, gross-to-net, gross margin, EBITDA, free cash flow, working capital and customer
              concentration. Second reconcile the fully diluted cap table to the October 2025 subscription agreement,
              employee equity plan, KDP consideration and any TPG rollover; map liquidation preferences, dividends,
              conversion, anti-dilution, board rights and option-pool treatment. Third test operating economics with
              plant-level utilization, yield, quality incidents, capex-to-capacity, retailer velocity, price/promo and
              repeat rates. Fourth obtain litigation, insurance, regulatory and labeling files and quantify phthalates
              and “natural”/allulose exposure. Finally validate acquisition synergies, debt covenants, refinancing
              needs, succession coverage and a realistic IPO or strategic-sale timetable. Until these asks are answered,
              the correct action remains track at a stretched stance; a verified margin and clean preference stack could
              upgrade the call, while any kill trigger should force exit or no-entry.
            claimRefs:
