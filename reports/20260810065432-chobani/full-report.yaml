      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The most credible growth drivers are high-protein demand, Greek-yogurt category leadership,
              premium-but-accessible clean-label positioning, and adjacency expansion into oat milk, creamers and RTD
              cold brew. Chobani's official portfolio and its La Colombe and Daily Harvest transactions show a strategy
              of extending brand permission beyond yogurt, while the protein-yogurt evidence points to a favorable
              consumer need state. New manufacturing capacity can support availability and reduce bottlenecks if
              utilization and input economics justify the investment. Constraints are equally material: private-label
              CPG scale creates price and margin pressure; dairy, packaging, logistics and refrigeration costs can
              compress contribution; retailer promotions can train consumers to buy on discount; and new categories
              require distinct formulas, equipment and quality controls. Oat milk and plant-based categories also carry
              competitive intensity and changing consumer preferences. Adoption is therefore gated by velocity, repeat
              rates and profitable trade spend, not merely by distribution breadth or headline category growth.
