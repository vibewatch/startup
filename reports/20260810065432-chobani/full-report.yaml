      - number: '5.2'
        title: Operating footprint and manufacturing architecture
        blocks:
          - type: paragraph
            body: >-
              The operating model converts milk and other ingredients into chilled, packaged consumer products through a
              network of facilities and supporting systems. Twin Falls, Idaho is described as one of the world's largest
              yogurt plants and is paired with Chobani's upstate New York footprint in Norwich and South Edmeston. The
              Innovation & Community Center in Twin Falls, opened in 2019, provides a visible formulation and
              commercialization interface between R&D and manufacturing. Chobani has also announced a roughly $1.2
              billion dairy plant in Rome, New York and a $500 million Twin Falls expansion, making capacity the central
              technology investment. In practical terms, the architecture includes milk sourcing, ingredient
              qualification, formulation and culture management, processing, filling and packaging, cold storage,
              logistics, retail execution, and feedback into new product development. This is vertically integrated in
              the sense that Chobani controls substantial dairy processing and branded manufacturing, although public
              evidence does not disclose supplier concentration, plant utilization, validated throughput, yield, or
              end-to-end traceability metrics.
