      - number: '6.5'
        title: Expansion, concentration and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Expansion can come from more occasions per household, more SKUs per retailer and cross-selling into
              adjacent coffee and meal categories. Chobani's product breadth and Daily Harvest acquisition create those
              avenues, while high-protein yogurt and creamers provide contemporary reasons for retailers to add shelf
              space. The counterweight is concentration and procurement friction. Walmart and Costco are named anchor
              accounts with enormous negotiating leverage; Target and Kroger add breadth, but public evidence does not
              reveal the revenue share of any customer, the number of doors, slotting allowances, trade-spend burden,
              private-label displacement or retailer-specific gross margins. Club and mass buyers can demand pack-size
              and price concessions, and private-label yogurt competes for the same shelf and can make authorizations
              reversible. Chobani must also fund cold-chain execution, quality compliance, replenishment and promotional
              calendars across channels. A retailer listing proves access, not low procurement friction. The appropriate
              risk posture is that distribution is broad but economic dependence may still be high; concentration,
              terms, renewal and retailer-specific profitability are material diligence asks before treating national
              availability as durable moat.
