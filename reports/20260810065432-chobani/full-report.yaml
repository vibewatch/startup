      - number: '5.4'
        title: Deployment, reliability and roadmap
        blocks:
          - type: paragraph
            body: >-
              Deployment is a physical distribution problem with a consumer-facing interface. Products must be
              manufactured to specification, packed into the correct format, moved through refrigerated or ambient
              logistics as appropriate, stocked by retail and prepared or consumed at home. Support is consequently
              delivered through package instructions, nutrition and ingredient information, retailer service and product
              complaint handling rather than a software support desk. The public record confirms a roadmap centered on
              capacity expansion from 2025 through 2027, high-protein yogurt and creamer extensions, and plant-based
              expansion through Daily Harvest. La Colombe adds a separate coffee platform and a KDP relationship that
              can broaden RTD distribution. These are credible strategic milestones, but they are not the same as a
              release plan with committed dates, validated volumes, service-level targets, or post-launch cohorts.
              Investors should request plant commissioning gates, SKU rationalization criteria, cold-chain service
              levels, complaint rates, retailer fill rates, shelf-life studies and integration plans for acquired brands
              before treating the roadmap as delivered capability.
