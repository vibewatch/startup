      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              A single market number is not decision-useful because publishers count different geographies, channels,
              product forms and forecast years. The evidence-constrained base case uses the supplied US yogurt estimate
              of roughly $11–13 billion, then applies a Greek-yogurt share of about 50% to derive an implied Greek pool
              of approximately $5.5–6.5 billion. Chobani's approximately 20% total yogurt share and 40% or greater Greek
              share provide two company-specific lenses, implying a larger core revenue opportunity than a simple
              brand-share claim can prove. A second lens treats oat milk and dairy alternatives as adjacent pools: the
              sources establish meaningful and growing categories, but their denominators vary between oat milk,
              plant-based milk and all dairy alternatives. A third lens uses coffee creamer and RTD cold brew as
              occasion adjacencies; Chobani's creamer share is approximately 11–12%, while the market denominator
              remains publisher-dependent. The analysis therefore presents ranges and shares rather than a false
              precision SOM, and preserves conflicting estimates for a diligence request.
