      - number: '3.2'
        title: Competitor profiles, customers and strategic direction
        blocks:
          - type: paragraph
            body: >-
              The most relevant competitors differ in scale, customer promise and strategic direction. Danone offers a
              multi-brand nutrition portfolio with Oikos and Two Good addressing protein and Activia and Light+Fit
              addressing functional or diet-oriented occasions; its FY2025 results provide the strongest public scale
              disclosure in this comparison. Lactalis adds a global dairy owner to the US shelf after closing its
              acquisition of General Mills' US yogurt business on June 30, 2025, combining Yoplait and Liberté with its
              existing dairy capabilities and Siggi's Icelandic-style positioning. Fage remains a focused Greek yogurt
              specialist, while private label optimizes value and retailer margin rather than national brand equity.
              Chobani's own portfolio now spans yogurt, oat milk, high-protein creamers, cold brew and acquired La
              Colombe and Daily Harvest assets. Public sources do not provide normalized competitor funding, realized
              pricing or customer-level economics, so this chapter separates observed product and ownership facts from
              qualitative strategic inference and flags unsupported cells rather than guessing.
