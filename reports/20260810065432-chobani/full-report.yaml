      - number: '5.6'
        title: Capability maturity and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              Chobani appears mature in branded yogurt commercialization and scaled dairy processing, emerging in
              adjacent plant-based and coffee platforms, and less transparent in the metrics that would prove technology
              performance. The dependency map is concentrated: milk and ingredient availability feed plants; plants and
              cultures determine quality and capacity; packaging and cold-chain partners affect shelf life; retailers
              determine visibility and replenishment; and acquired brands introduce separate integration and channel
              requirements. KDP's minority position and distribution relationship can help La Colombe reach RTD
              consumers, while Daily Harvest supplies a plant-based product and customer proposition outside the
              traditional dairy line. Rome and Twin Falls capex may improve resilience and innovation capacity, but also
              raises execution, commissioning, utilization and fixed-cost risk. The product verdict is therefore strong
              operating maturity with evidence-limited technical transparency: brand, supply access and know-how are
              credible advantages, whereas public proof of quality-control performance, patent economics, plant output,
              acquired-platform integration and roadmap delivery remains insufficient for a low-risk rating.
