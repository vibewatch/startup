      - [Formulation and culture management, "Develop taste, texture, protein and shelf-life targets", "Innovation Center, cultures, ingredient qualification", "Patent advantage and repeatability not independently benchmarked"]
      - [Processing and fermentation, "Convert inputs into yogurt and dairy products", "Plant equipment, sanitation and validated process controls", "Yield, downtime and microbial metrics not public"]
      - [Filling and packaging, "Create SKU-specific packs and protect product", "Packaging suppliers, migration tests, line changeovers", "Phthalates scrutiny and packaging evidence gap"]
      - [Cold storage and logistics, "Maintain temperature and availability", "Refrigerated distribution and retailer execution", "Fill rate, excursion and shelf-life data unavailable"]
      - [R&D-to-launch feedback, "Translate consumer insight into new products", "Innovation Center, brand, retailers and acquired platforms", "Roadmap dates, launch gates and post-launch cohorts unclear"]
    notes: >-
      Architecture layers are an operating-model representation grounded in facility, R&D, product and
