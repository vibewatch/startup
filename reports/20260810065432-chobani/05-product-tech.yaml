  evidenceGaps:
    - type: missing-source
      severity: material
      topic: quality
      missingEvidence: "Plant-level HACCP plans, certifications, microbiological testing, allergen controls and corrective-action logs."
      whyItMatters: "Food safety and compliance are core trust inputs, yet public sources do not quantify control performance."
      diligencePath: "Request current plant audit packets, certification register, environmental monitoring and CAPA history under NDA."
      relatedQuestionRefs: [QE019]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: material
      topic: recalls
      missingEvidence: "Validated recall history, complaint rates, mock-recall results and trend data across Chobani and acquired brands."
      whyItMatters: "A branded food platform's downside can be driven by quality incidents and response speed."
      diligencePath: "Obtain five-year recall and complaint logs, retailer chargebacks, mock-recall tests and incident postmortems."
      relatedQuestionRefs: [QE021, QE026]
      relatedTableRefs: [TE004]
    - type: missing-source
      severity: material
      topic: capacity
      missingEvidence: "Plant throughput, utilization, yield, downtime, commissioning gates and volume targets for Rome and Twin Falls."
      whyItMatters: "The capex roadmap only creates value if new capacity is commissioned, utilized and cost-effective."
      diligencePath: "Request plant business cases, commissioning schedules, OEE/yield dashboards and 2025-2027 production plans."
      relatedQuestionRefs: [QE022, QE026]
      relatedTableRefs: [TE003, TE005]
