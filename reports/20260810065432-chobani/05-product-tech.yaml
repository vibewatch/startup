  - id: TE004
    title: "Trust / quality / compliance table"
    columns: [Control or quality area, Public status, Scope, Gap or diligence ask]
    rows:
      - [Ingredient and nutrition labeling, "Product information is public; audit evidence not supplied", "Consumer-facing labels and claims", "Obtain label review, substantiation and FDA compliance file"]
      - [Food safety and sanitation, "Expected operating requirement; metrics undisclosed", "Plants, fermentation, filling and cold chain", "Request HACCP plans, audits, environmental tests and CAPA logs"]
      - [Packaging integrity, "Quality scrutiny is a known diligence topic", "Containers, films and migration exposure", "Request phthalates testing, supplier specs and migration results"]
      - [Claims and advertising substantiation, "Litigation scrutiny noted for natural and sugar claims", "Marketing, labels and product naming", "Obtain substantiation matrix and litigation disposition"]
      - [Recall and complaint readiness, "No validated public recall dashboard in source pack", "All products and acquired brands", "Request recall history, complaint rates and mock-recall results"]
    notes: >-
      A blank public metric means evidence was not supplied, not that the control is absent; the diligence
