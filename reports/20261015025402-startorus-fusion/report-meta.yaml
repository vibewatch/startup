companyProfile:
  summary: >-
    Startorus Fusion is a 2021-founded Chinese fusion-energy startup with operating roots in Shanghai and Xi'an and a
    technical base linked to Tsinghua University's engineering-physics fusion ecosystem. The company is building a
    spherical-tokamak platform around high-temperature superconducting magnets and magnetic-reconnection heating, while
    also commercializing some adjacent electronics and control products. Public disclosures show unusually strong
    state-backed financing and a concrete milestone roadmap, but the business is still pre-commercial on reactor revenue
    and does not disclose a full cap table or customer base.
