            body: >-
              公司最有力的公开证明点来自里程碑，而不是市场。来源支持三代装置体系、SUNIST-2 的快速推进、正在建设的嘉定实验基地、2026 年 6 月的超导磁体里程碑，以及一条路线图：NTST 于 2027
              年运行、CTRFR-1 约在 2028 年完成工程验证、2030 年代初进行与电网相关的示范。这些里程碑分量不轻，但仍是计划和工程检查点，不代表反应堆经济性、客户需求或近期商业收入已得到证明。
