            body: >-
              Startorus 已从早期清华孵化项目，走向融资充足且与上海有关联的工业项目。2026 年 1 月 A 轮和 5 月 A+
              轮融资表明，公司如今处于更广泛的国家资本与产业资本联盟中，而非单纯依赖风险投资。但最强的公开证据仍限于轮次公告：审阅来源没有披露当前股权结构表、清算优先权、债务层、董事会控制权或其他投资者权利条款，因此无法判断
