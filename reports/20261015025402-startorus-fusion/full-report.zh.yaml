        - label: 中国公开托卡马克项目
          x: 3
          'y': 2
          note: BEST、EAST 和 CFEDR 是可见的基准替代方案，但在指定样本中并非风险投资式商业方案。
          claimRefs:
            - CP006
            - CP008
        - label: ITER
          x: 2
          'y': 1
          note: 全球范围的电站级聚变科学公开基准，而非近期商业产品。
          claimRefs:
            - CP008
            - CP016
    approximationNotes: 坐标分数是基于指定证据集的分析师序数判断；它们总结相对可见度，而非来源原生的数值测量。
    claimRefs:
      - CP015
      - CP016
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开观察到的价值流从国资支持的股权资本流向工程资产；在未来试验电站收入出现前，只有有限的副产品商业化。
    data:
      nodes:
        - id: equity
          label: 国资主导的股权资本
          detail: 2026 年 1 月宣布 RMB 1bn A 轮；更广义的已披露融资超过 RMB 1.5bn。
        - id: device
          label: 下一代聚变装置建设
          detail: 融资所得指定用于下一代装置及相关工程基地。
        - id: subsystems
          label: 子系统和磁体开发
          detail: 在电站收入出现前，HTS 磁体、等离子体控制及相关反应堆子系统将消耗资本。
        - id: side-products
          label: 过渡期硬件商业化
          detail: 公司披露的交付包括数百台放大器 / 集成器，以及 HTS 和等离子体系统。
        - id: verification
          label: 工程验证里程碑
          detail: 独立报道将验证时间定在 2028 年前后，而非现在。
        - id: pilot
          label: 未来试验电力收入
          detail: 商业电力输出目标定在 2032 年，但尚无公开的购电经济性披露。
      edges:
        - from: equity
          to: device
          label: 为资本开支和研发提供资金
        - from: device
          to: subsystems
          label: 推动工程工作流
        - from: subsystems
          to: side-products
          label: 形成可销售的过渡性产出
        - from: subsystems
          to: verification
          label: 必须达到技术验证
        - from: verification
          to: pilot
          label: 电力销售的前提
    approximationNotes: 该图是公开证据流程图，而非量化瀑布图；它将已披露里程碑与未披露的定价、利润率和现金流数值分开。
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开架构层次从基于磁重联的等离子体物理，延伸到现有装置、支撑性子系统，再到未来的 HTS 示范路径。
    data:
      layers:
        - label: 物理路线
          items:
            - 磁重联加热
          modules:
            - 多个极向场线圈诱导形成两个等离子体环
            - 环合并后加热主等离子体
          outputs:
            - 据称比大型辅助束流或毫米波系统更简单的加热路径
        - label: 现有装置
          items:
            - SUNIST-2
            - NTST
          modules:
            - SUNIST-2 已用于启动和控制验证
            - NTST 是正在组装的负三角度装置
          outputs:
            - 从当前物理研究通向首次等离子体运行的实验桥梁
        - label: 支撑性子系统
          items:
            - TF 线圈和 PF 线圈组
            - 脉冲电源系统
            - 77 K 冷却基础设施
            - 实时控制套件
            - 联合开发中的 1 MW 中性束
          modules:
            - 线圈鉴定和低温验收测试
            - 批量生产的模块化电源，以及已调试的 TF 电源系统
          outputs:
            - 有子系统准备就绪的证据，但尚无完整一体化反应堆验证
        - label: 实验设施
          items:
            - 上海嘉定场址
            - 西安场址
          modules:
            - 嘉定设施于 2026 年 4 月开工
            - 官方页面列出两个运营地址
          outputs:
            - 分散式布局，但各场址职责仍未披露
        - label: 扩展路径
          items:
            - CTRFR-1
          modules:
            - 下一步 HTS 球形托卡马克
            - 公开目标为 Q ~ 1
          outputs:
            - 通向未来工程验证和示范电站的桥梁
        - label: 商业化验证层
          items:
            - 客户和许可证据
          modules:
            - 电力买方、安全文件和电站经济性大多仍属非公开信息
          outputs:
            - 技术势头与可投资产品准备度之间的主要缺口
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Startorus 当前的公开商业化路径从科研可信度走向出资方和供应商协同，但终端市场客户验证仍在前方。
    data:
      items:
        - label: 科研起源可信度
          phase: 2021-2025
          actor: 清华关联创始背景和 SUNIST-2 实验
          touchpoints:
            - 清华关联分拆公司和 SUNIST-2 验证工作
            - 科研可信度先于客户披露
        - label: 国资支持的融资
          phase: 2026
          actor: 上海主导的投资者联盟
          touchpoints:
            - 10.0 亿元人民币 A 轮融资
            - 客户指标尚不可见时，资本已清晰可见
        - label: 嘉定选址和政策支持
          phase: 2026-2027
          actor: 嘉定区政府
          touchpoints:
            - 战略合作协议
            - 选址、政策和员工安置支持
        - label: 工业伙伴探索
          phase: 2026 年起
          actor: CIMC Enviro 和其他上游供应商
          touchpoints:
            - RMB 30 million 小额股权
            - 专用设备合作仍处于探索阶段
        - label: 工程验证漏斗
          phase: 2026-2029
          actor: NTST 和 Startorus-1 里程碑
          touchpoints:
            - 2026 年 NTST 安装目标
            - 2027-2029 年工程进度
        - label: 未来商业用户
          phase: 2028-2032+
          actor: 潜在电力或工业能源买方
          touchpoints:
            - 2032 年前后示范发电目标
            - 尚无公开的具名承购方或留存指标
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU008
      - CU009
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开披露缺口与长期技术里程碑重叠之处，剩余风险敞口最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余风险敞口
      rows:
        - label: 许可 / 核处理路线图
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 股权结构和融资治理不透明
          values:
            - 高
            - 高
            - 低
            - 中高
        - label: 物理路线和里程碑延期
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 磁体 / 低温系统扩展
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 政策 / 场址集中度
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 需求 / 未来承购不确定性
          values:
            - 中
            - 高
            - 中低
            - 高
    approximationNotes: 序数热力图标签总结有证据支持的风险登记项；它们不是概率分数或模型化损失估计。
    claimRefs:
      - CR004
      - CR011
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 融资实力提升了可信度，但推荐判断仍受制于商业化验证和价格纪律。
    data:
      nodes:
        - id: capital
          label: 资本获取
          value: Large 2026 A / A+ / A++ sequence
          detail: 显示投资者兴趣和融资可信度。
        - id: spend
          label: 资金用途
          value: Jiading base, NTST, CTRFR-1, HTS magnets, AI control
          detail: 资本的工程建设用途清晰可见。
        - id: proof
          label: 技术验证路径
          value: NTST and later Q>1 / demo milestones
          detail: 路线图公开，但仍处于商业化前阶段。
        - id: revenue
          label: 早期收入信号
          value: Subsystem and electronics sales
          detail: 有助于证明变现能力，但还不是反应堆规模的需求。
        - id: gap
          label: 估值瓶颈
          value: Customer demand, cap-table terms, and economics remain thin
          tone: warning
          detail: 这些缺口比表面融资规模更重要。
        - id: call
          label: 推荐
          value: research-more / stretched
          tone: warning
          detail: 密切跟踪，但入场纪律仍应绑定证据。
      edges:
        - from: capital
          to: spend
          label: 资金流入资产
        - from: spend
          to: proof
          label: 工程里程碑形成验证
        - from: proof
          to: revenue
          label: 技术进展可以支撑可销售子系统
        - from: revenue
          to: gap
          label: 收入信号仍未达到完整商业化验证
        - from: gap
          to: call
          label: 剩余缺口要求推荐判断遵守价格纪律
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV010
      - CV013
      - CV014
