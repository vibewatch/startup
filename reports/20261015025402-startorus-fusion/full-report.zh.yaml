  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - 公司方案
      - 可量化收益
      - 局限
    rows:
      - - 等离子体启动与加热
        - 主流托卡马克项目通常依赖更大型的辅助加热系统
        - 通过多组 PF 线圈和两个感应等离子体环实现磁重联加热
        - 公司称，该方案“只需要几组线圈”，相比高功率中性束或毫米波方案“复杂度和难度低得多”
        - 没有公开的效率、成本或等离子体性能横向比较
      - - 等离子体成形与约束
        - 基线球形托卡马克几何可能限制中心柱空间和边缘控制选项
        - 采用六对 PF 线圈、三角度范围较宽的 NTST 负三角度构型
        - AAPPS 摘要称，该几何可扩大中心柱空间，并支持达到 H 模水平的约束，同时避免 ELM
        - NTST 仍处于首次等离子体运行前
      - - 子系统验证与反应堆集成
        - 聚变实验项目必须分别验证磁体、脉冲功率、冷却、控制和加热子系统
        - Startorus 正在整机调试前验证线圈、脉冲功率模块、冷却系统和控制软件
        - 已公开的里程碑包括 TF0 的 22 kA 测试、已投运的 TF 电源系统，以及在 SUNIST-2 上验证的实时控制
        - 子系统通过验证，还不能证明集成反应堆的运行时间或可维护性
      - - 商业化发电路径
        - 聚变初创公司通常从实验室装置走向工程验证，再进入示范电站
        - Startorus 公开目标是在 2028 年前后完成工程验证，并在 2032 年前后让示范装置发电
        - 路线图足够具体，可以持续判断里程碑是否延期
        - 公开来源仍未显示客户部署、购电方或电站经济性证明
    notes: 本表把公司声称的收益与里程碑证据放在一起；关于简化方案的引述属于架构层面的主张，并非独立基准测试结果。
