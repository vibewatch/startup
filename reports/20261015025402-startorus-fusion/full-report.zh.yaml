  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - NTST 安装和后续工程里程碑按计划推进；子系统收入扩大；后续融资保持清洁。
        - 如果技术验证快速累积，当前估值可以被解释为押注稀缺聚变领域领先地位的期权。
        - 执行延期、成本超支和客户验证延后仍然重要。
        - 具备可能性，但需要超越公司自发更新的里程碑验证。
      - - 基准
        - 工程进展持续，融资仍可获得，但客户和经济性披露仍然有限。
        - 公司在战略上仍然有吸引力，但当前价格主要买入的是未来选择权，而非已经验证的商业现金创造能力。
        - 条款不透明、稀释和商业化所需时间仍未解决。
        - 最符合当前公开证据。
      - - 悲观
        - 技术里程碑延期、融资条款恶化，或商业化证据无法扩展到科研机构和子系统销售之外。
        - 由于估值跑在证据质量前面，后续融资或退出价格可能低于今天的热度水平。
        - 下轮融资风险、估值倍数压缩和治理不透明。
        - 仍然可信，因为估值支撑比表面叙事更薄弱。
    notes: 由于公开经济性数据仍不完整，情景表采用里程碑参考和已披露融资背景，而不是收入倍数模型。
