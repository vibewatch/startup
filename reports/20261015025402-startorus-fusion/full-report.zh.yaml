            body: >-
              公开证据显示，Startorus Fusion
              仍主要以商业化前聚变开发商身份融资，而不是一家披露了可公开持续收入的运营企业。最清晰的变现证据不是售电，而是副产品商业化：公司称已交付数百台隔离放大器和理想积分器，出口多套 HTS
              数据采集系统，并交付一套等离子体加速系统。这说明核心反应堆项目距离发电试验机仍有多年，管理层正尝试创造中间现金流。但审阅来源均未披露这些产品的客户名称、合同金额、目录价格、折扣或实际收入；公开记录只能证明商业活动存在，不能证明其规模或可重复性。
