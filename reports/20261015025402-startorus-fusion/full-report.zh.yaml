    title: 正论 / 反论表
    columns:
      - 论点
      - 当前支持
      - 哪些变化会改变判断
    rows:
      - - 近期融资显示，这家中国私营聚变初创公司获得资金的能力不同寻常。
        - 2026 年公开披露和报道显示，公司进行了大规模 A 轮、A+ 轮和 A++ 轮融资。
        - 如果后续申报或尽调显示融资带有高度结构化的优先权安排或救助式条款，支持力度会减弱。
      - - 资本正投入可识别的工程资产，而不只是概念研发。
        - 资金用途披露指向嘉定基地建设、NTST、CTRFR-1 准备工作、HTS 磁体和 AI 等离子体控制。
        - 如果独立里程碑验证和成本纪律公开，支持力度会增强。
      - - 这项业务可能通过子系统和电子设备销售实现早期变现。
        - 独立报道称，一家子公司已经在销售聚变相关电子设备和电力控制设备。
        - 如果客户名称、复购订单和利润率质量公开或经尽调确认，支持力度会增强。
      - - 当前的独角兽定位可能领先于商业验证。
        - 独立报道称，实现可行性仍需多年，公开证据也尚无有力的可比公司集合或客户需求披露。
        - 如果公司公布更有力的客户、经济性和治理证据，支持力度会减弱。
    notes: 这些行将最有力的可投资论据，与会改变估值判断的具体证据并列对照。
