companyProfile:
  summary: >-
    Startorus Fusion 是一家 2021
    年成立的中国聚变能源初创公司，运营根基位于上海和西安，技术基础连接清华大学工程物理聚变生态。公司围绕高温超导磁体和磁重联加热搭建球形托卡马克平台，同时商业化部分相关电子和控制产品。公开披露显示其国家资本融资实力突出，里程碑路线也较具体，但反应堆收入仍处于商业化前阶段，公司没有披露完整股权结构表或客户基础。
