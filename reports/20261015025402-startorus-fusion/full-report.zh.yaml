              - CM010
              - CM013
      - number: '2.3'
        title: 国家支持的发起方和科研买方主导当前采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图同样分阶段。最强证据指向市级和国家支持的产业政策发起方：它们在上海为设施、生态建设和早期反应堆项目提供资金；科研机构和产业用户则购买诊断设备、电力控制设备及 HTS
              相关系统等近期赋能硬件。这与已经有具名未来电力承购方截然不同。Startorus
              官方页面列出的嘉定和西安地址，进一步说明公司正嵌入中国工程与政策集群；但目前有公开证据的预算拥有者仍是政府、战略投资者和技术买方，而不是签署电力合同的公用事业公司。
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: 在技术和需求门槛通过前，商业电力 TAM 仍属推测
        blocks:
          - type: paragraph
            body: >-
              采用端的上行空间确实存在，但同一记录也清楚呈现了限制。DOE 路线图强调材料、基础设施、人才和商业化方面仍有缺口；Startorus
              自己的技术论点认为复杂度和运营难度更低，但这不等于反应堆经济性已经得到证明。独立报道仍称商业可行性要等多年，保留的公开证据也没有指出具名公用事业公司、工业热能买方或承购结构，投资者因而无法把长期聚变愿景转化为可辩护的
              SAM 或 SOM。估值时，公司今天可以按融资能力、集群支持、设备销售和里程碑交付来比较；未来电力市场则仍是待尽调事项，而不是可融资的收入池。
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 市场论点分阶段推进，并非立即兑现
            body: 保留证据支持公司当前销售赋能硬件、建设获得补贴的反应堆基础设施；商业电力收入仍在未来，且没有具名买方支持。
            calloutType: insight
            claimRefs:
              - CM003
              - CM011
              - CM013
          - type: callout
            title: 公开需求证明止步于承购之前
            body: 投资者兴趣和市级支持都可见，但记录仍缺少具名公用事业公司、工业热能买方或披露的承购结构，无法把长期聚变雄心转化为可辩护的 SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM006
              - CM011
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、公共项目替代者与相邻方案
        blocks:
          - type: paragraph
            body: >
              指定证据表明 Startorus 并非在无人竞争的空间里发展。Nuclear News Network 追踪表将其列入球形托卡马克民营竞赛，同行包括中国民营项目 Energy Singularity 的
              HH70、HH170，以及海外民营替代者 Tokamak Energy 的 ST40、ST80-HTS。界面又列出上海的 Energy Singularity 和
              NovaFusionX，形成另一层本土竞争。与此同时，追踪表中的 ITER 和中国公共项目仍是人才、供应商关注度和技术可信度的现状基准，即便它们没有被包装成风险投资支持的产品。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 技术定位：Startorus 的切入口是集成广度，而非已发布的商业方案
        blocks:
          - type: paragraph
            body: >
              对一家民营聚变初创公司而言，Startorus
              的公开差异化叙事异常具体，但本质仍是技术叙事。官方技术页面称，公司靠合并两个等离子体环进行磁重联加热，并据称该方法可避开主流托卡马克加热堆栈的一些复杂性。独立报道还提到 AI
              异常检测、强化学习等离子体控制和物理信息平衡重建；界面称 NTST 将测试 HTS 磁体、冷却系统和 AI 辅助控制。这种组合让 Startorus
              在指定样本中拥有更完整的公开集成叙事，但护城河仍靠工程交付，而非已披露定价、客户合同或明确转换成本。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP015
              - CP016
      - number: '3.3'
        title: 商业方案：已有子系统收入，但公开定价和买方证明仍薄弱
        blocks:
          - type: paragraph
            body: >
              商业图景比技术图景薄弱。界面报道 Startorus
              已在商业化聚变相关电子产品和电力控制设备，并从科研机构和产业客户取得早期收入；这很重要，因为它比电网电力创造了更近的产品入口。但指定公开证据没有披露目录价格、标准合同结构或反应堆路线图的具名承购方；样本中的同行项目也存在同样缺口。因此，对
              GTM、折扣和买方转换成本的竞争比较，仍应表述为待尽调缺口，而不是已证明的优势。
            claimRefs:
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
      - number: '3.4'
        title: 持久性与风险：竞赛有资金、有集群，但仍由里程碑驱动
        blocks:
          - type: paragraph
            body: >
              持久性取决于 Startorus 能否在公共项目替代者和民营同行追上之前，把融资与供应渠道转成领先优势。Fusion Energy Base 称 2026 年 1 月 A
              轮由中金资本和上海国家资本基金领投；界面称后续 A+ 轮将估值推过 10 亿美元。公司官方页面列出上海嘉定和西安地点，界面将 NTST 放在嘉定，说明其工程版图横跨两个相关制造和科研集群城市。即便如此，ITER
              仍把聚变定义为通向未来电站的长期实验桥梁，Startorus 自己的公开里程碑窗口也只指向 2030 年代初输出电力；若竞争对手先达成里程碑，公司仍可能被替代。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 最明显的切入口是堆栈集成
            body: 在指定证据中，Startorus 最有依据的差异化来自加热架构、AI 辅助控制和 HTS 磁体能力的组合，而非单一功能主张。
            calloutType: strength
            claimRefs:
              - CP002
              - CP004
              - CP009
          - type: callout
            title: 护城河仍处于客户之前
            body: 指定来源显示技术雄心和早期子系统收入，但尚未显示已披露的反应堆定价、具名公用事业买方或能证明买方锁定的合同结构。
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP016
          - type: callout
            title: 集群优势可能与物理技术同样重要
            body: 国家资本融资加上嘉定 / 西安布局表明，Startorus 的竞争不仅是反应堆设计，也包括供应商渠道和本地生态支持。
            calloutType: insight
            claimRefs:
              - CP010
              - CP011
              - CP012
