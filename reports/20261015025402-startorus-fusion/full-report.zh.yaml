              - CO015
      - number: '1.2'
        title: 创始人、技术背景与治理集中度
        blocks:
          - type: paragraph
            body: >-
              公开叙事高度集中于两位具名领导者：CEO
              陈锐和首席科学家谭毅。多份来源将两人与清华大学工程物理系联系起来，官方材料还强调核心团队累计拥有二十多年聚变经验。这种背景有助于解释投资者信心和执行速度，但也意味着关键人物集中风险，因为公开来源没有提供完整董事会名单、独立治理结构，或创始技术领导层之外的继任梯队。
