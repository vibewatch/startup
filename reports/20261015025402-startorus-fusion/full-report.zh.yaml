          - type: paragraph
            body: >
              乐观情景要求工程里程碑足够快地压低技术和融资风险，让今天的独角兽估值成为桥梁而非峰值。基准情景假定公司仍可融资且技术可信，但公开证据仍只支持按里程碑比较，而非建立收入或现金流模型。悲观情景是资本继续为装置建设提供资金，但商业证明、客户承诺和治理透明度落后，导致后续轮次或最终流动性事件低于当前热度。因此，入场纪律应绑定里程碑验证和融资条款，而不是只看行业叙事。
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: 最终建议与尽调要求
        blocks:
          - type: paragraph
            body: >
              最有依据的建议仍是继续研究，而非买入，因为公开证据足以支持跟踪公司，却还不足以坚定地判断价格。若尽调同时补齐三项缺口，估值论点会改善：2026 年轮次的准确条款和优先股堆叠；嘉定及 NTST 到 CTRFR-1
              项目的预算和现金跑道；以及非科研客户需求或已签约未来电力承购的更硬证据。如果这些事项解决且里程碑执行不掉线，观点可从偏贵转向合理；否则，相对于剩余商业化距离，当前独角兽定位仍显得过早。
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的判断
            body: 积极跟踪公司，但在公开或仅限尽调的证据补齐轮次条款、现金跑道和需求质量缺口前，维持继续研究建议；这些缺口比 headline 融资规模更重要。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV010
              - CV014
          - type: callout
            title: 什么会打破估值故事
            body: 如果里程碑执行延误、后续融资加入沉重优先权，或早期子系统销售无法转化为更广泛的未来聚变产能商业需求，偏高估值就可能回落。
            calloutType: risk
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV014
