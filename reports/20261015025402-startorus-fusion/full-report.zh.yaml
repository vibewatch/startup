  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 近期市场是聚变基础设施与硬件，而不是电力销售
        blocks:
          - type: paragraph
            body: >-
              保留来源划出的市场边界，远窄于“聚变市场巨大”的泛泛叙事。Startorus
              正在开发配备高温超导磁体、采用磁重联加热的紧凑型球形托卡马克，但现有收入证据仍位于电网供电上游。公司和合作方来源描述的近期商业化方向包括电子产品、数据采集系统、等离子体加速设备和 HTS
              磁体能力；独立报道仍将反应堆发电视为 2030 年代初的目标，而非当前买方流程。因此，今天可触达的支出更适合定义为聚变研发基础设施、实验装置建设和部件采购，而不是公用事业级电力需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM010
              - CM013
      - number: '2.2'
        title: 市场规模只能从资本、建设和时间维度估算
        blocks:
          - type: paragraph
            body: >-
              公开来源没有为 Startorus 提供清晰的 TAM/SAM/SOM，因此本章改用受证据约束的视角。DOE 的 2026 年路线图称，已有超过 $10 billion
              私人投资推动聚变技术和示范项目；这反映行业资本，而不是一家公司的可用支出池。Fusion Energy Base、界面和 Dealroom 共同显示 2026 年融资势头持续；Deye 的合作方公告则通过规划中的
              25 英亩、5 万平方米嘉定基地，补充了实体产能视角。这些输入支持分阶段的市场准备度判断，但不足以把未来电力市场收入视为当前可触达需求。
            claimRefs:
              - CM004
