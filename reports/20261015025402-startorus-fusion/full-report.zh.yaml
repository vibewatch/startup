    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与当前运营版图
        blocks:
          - type: paragraph
            body: >-
              公开材料始终将 Startorus Fusion 定位为一家 2021
              年成立的中国聚变能源初创公司，目标是商业化受控聚变系统，而非只做实验室研究。审阅证据将公司与上海、西安运营地点、清华起源的创始故事，以及把反应堆平台与相关电子和仪器产品结合的开发模式联系起来。这让公司的工业身份比许多概念型聚变初创公司更清晰，但公开记录仍未披露收入、客户集中度或经审计的商业产出。
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO014
              - CO015
