      - number: '4.2'
        title: 资本密集度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本故事比运营故事清晰得多。多份来源都指向 2026 年 1 月公布的 RMB1 billion A 轮；SCMP 还报道，上海国有基金出资约 RMB400 million，超过 50 位投资者累计融资已超过
              RMB1.5 billion。资金用于下一代聚变装置，第三方时间表仍将工程验证放在 2028 年左右、试验或示范发电装置放在 2032 年左右。这符合 TechCrunch 和 MIT Technology
              Review 描述的行业模式：投资者为设备、实验和员工成本高昂的长期工程项目提供资金，而真实商业发电仍未得到证明。因此，公司融资渠道看起来确实存在，但融资需求仍由里程碑驱动，而非靠自身造血。
