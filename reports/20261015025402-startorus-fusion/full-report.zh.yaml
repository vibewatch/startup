            body: >-
              投资判断的难点不是 Startorus 能否吸引资本，而是外部投资者能否从公开证据判断收入质量和现金持久性。Startorus
              认为其磁重联托卡马克设计比主流加热系统更简单、具备经济竞争力；更广泛的聚变研究和政策支持，也让这套叙事足以支撑融资。但公司和指定来源中的独立报道均未披露收入结构、毛利率、交付成本、客户集中度、订单积压、项目融资义务、现金余额、烧钱速度或现金跑道。合理的财务结论是：Startorus
              目前具备为里程碑交付融资的条件，但还不能按传统运营指标承保。尽调应先关注实际销售、利润桥接、预算与里程碑规划，以及轮次间依赖，再判断当前估值是否有运营表现支撑。
