company:
  name: "Startorus Fusion"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Startorus Fusion presents as a Shanghai-rooted, Tsinghua-linked fusion startup with unusually strong
    state-backed financing momentum: public materials support a RMB 1 billion Series A in January 2026, a
    RMB 500 million A+ in May 2026, and cumulative funding above RMB 2 billion. The current public case for
    scale still depends more on engineering milestones, staffing depth, and investor sponsorship than on
    disclosed revenue or customer counts, while management itself continues to acknowledge unresolved
    commercialization hurdles.
sections:
  - id: "identity-and-stage"
    title: "Identity, stage, and current operating footprint"
    body: >-
      Public materials consistently position Startorus Fusion as a 2021-founded Chinese fusion-energy startup
      pursuing commercial controlled-fusion systems rather than a lab-only research project. The reviewed
      evidence ties the company to Shanghai and Xi'an operating locations, a Tsinghua-origin founding story,
      and a development model that combines reactor-platform work with adjacent electronics and instrumentation
      products. That gives the company a clearer industrial identity than many conceptual fusion startups, but
      the public record still does not disclose revenue, customer concentration, or audited commercial output.
    claimRefs: [CO001, CO002, CO009, CO010, CO014, CO015]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Founders, technical pedigree, and governance concentration"
    body: >-
      The public narrative is tightly centered on two named leaders: CEO Chen Rui and chief scientist Tan Yi.
      Multiple sources connect both to Tsinghua University's Department of Engineering Physics, and official
      materials emphasize more than two decades of accumulated fusion experience inside the broader core team.
      That pedigree helps explain investor confidence and execution speed, but it also implies key-person
      concentration because the public source set does not provide a full board roster, independent governance
      structure, or succession depth beyond the founding technical leadership.
    claimRefs: [CO003, CO004, CO014, CO016]
    tableRefs: [TO002]
  - id: "capitalization-and-stakeholders"
    title: "Funding path and stakeholder map"
    body: >-
      Startorus has moved from an early Tsinghua spinout story to a heavily financed, Shanghai-linked
      industrial project. The January 2026 Series A and May 2026 A+ rounds support a view that the company now
      sits inside a broader state-capital and industrial-capital coalition rather than a purely venture-backed
      startup path. At the same time, the strongest public evidence remains round-announcement level: the
      reviewed sources do not disclose the current cap table, liquidation preferences, debt layer, board
      control, or other investor-rights terms that would determine how much of the headline valuation truly
      converts into durable economic flexibility.
    claimRefs: [CO005, CO006, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: "milestones-and-readiness"
    title: "Milestones and commercialization readiness"
    body: >-
      The company's strongest public proof points are milestone-based rather than market-based. Sources support
      a three-generation apparatus stack, rapid SUNIST-2 execution, a Jiading experimental base under
      construction, a June 2026 superconducting-magnet milestone, and a roadmap that pushes NTST operation into
      2027, CTRFR-1 engineering verification into roughly 2028, and grid-relevant demonstration into the early
      2030s. Those milestones are substantial, but they remain plans and engineering checkpoints, not proof of
      reactor economics, customer demand, or near-term commercial revenue.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO015, CO016]
    figureRefs: [FO001]
