      - ["Shanghai Future Industry Fund / Jiading-linked local capital", "Co-lead or strategic state-backed participant in the January 2026 round", "Links Startorus to Shanghai's future-industry agenda and the Jiading experimental-base buildout.", "Confirm exact ownership, follow-on reserve policy, and milestone conditions tied to local support."]
      - ["FORTUNE Capital and May 2026 A+ syndicate", "Lead and follow-on growth capital in the A+ round", "Adds market validation beyond the first Shanghai round and funds the next engineering milestones.", "Check whether new-money economics changed preferences, valuation step-up, or governance rights."]
      - ["Flyfot Venture Capital", "Returning investor across rounds", "Repeat participation suggests continuity support and some diligence confidence from an existing backer.", "Request pro-rata rights, historical bridge financing, and view on future capital needs."]
      - ["Jiading District government / Tsinghua collaboration base", "Policy and ecosystem counterpart rather than pure equity investor", "Execution of the Jiading base and university-linked apparatus work appears strategically important to the roadmap.", "Confirm land, permitting, subsidy, and IP-allocation terms across government and university relationships."]
