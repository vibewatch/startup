  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: round-terms
      missingEvidence: Exact 2026 cap-table terms, liquidation preferences, anti-dilution rights, board controls, and any structured downside protections.
      whyItMatters: Those terms determine whether the headline unicorn valuation is economically real for new money or mostly a headline mark above a more protective stack.
      diligencePath: Obtain the latest term sheets, shareholder agreements, and cap-table waterfall from management or lead investors.
      relatedQuestionRefs: [QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: runway-and-budget
      missingEvidence: A detailed 2027-2032 budget, cash runway, cost-to-next-milestone view, and contingency financing plan for Jiading, NTST, and CTRFR-1.
      whyItMatters: Valuation support depends on whether current funding plausibly carries the company through the next de-risking milestone without punitive dilution.
      diligencePath: Request the operating model, milestone budget, monthly burn bridge, and downside financing plan.
      relatedQuestionRefs: [QV003, QV008]
      relatedTableRefs: [TV003]
    - type: missing-source
      severity: material
      topic: comparable-set-gap
      missingEvidence: A model-appropriate comparable set with disclosed valuation, milestone, revenue, or asset-level benchmarks for relevant fusion peers or adjacent deep-tech analogues.
      whyItMatters: Without a stronger benchmark set, the current stance can only be triangulated against milestone references and investor appetite rather than against hard pricing comparables.
      diligencePath: Build a peer benchmark pack covering private fusion rounds, public proxies, and any disclosed M&A or secondary marks.
      relatedQuestionRefs: [QV007]
      relatedTableRefs: [TV003]
