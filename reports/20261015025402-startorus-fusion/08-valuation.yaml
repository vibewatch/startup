      - ["Risk rating", "high", "Commercial viability is still years away and disclosed proof remains engineering-heavy.", "Require milestone and terms diligence before sizing."]
      - ["Valuation stance", "stretched", "Independent reporting places the company above US$1 billion while public evidence still lacks revenue-based comp support.", "Seek a better entry point or materially stronger proof."]
      - ["Decision implication", "Track with milestones", "The company may earn into the mark if NTST, CTRFR-1 preparation, and demand proof advance on schedule.", "Use milestone-triggered diligence rather than momentum buying."]
    notes: "Synthesizes the chapter's cited financing, milestone, commercialization, and evidence-gap claims."
    claimRefs: [CV002, CV004, CV009, CV010, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: ["Argument", "Current support", "What would change the view"]
    rows:
      - ["Recent rounds show unusual funding access for a private fusion startup in China.", "2026 public disclosures and coverage show large A, A+, and A++ financing activity.", "Support weakens if later filings or diligence show heavily structured preferences or rescue-style terms."]
      - ["Capital is being deployed into identifiable engineering assets rather than only concept work.", "Use-of-proceeds disclosures point to Jiading base construction, NTST, CTRFR-1 preparation, HTS magnets, and AI plasma control.", "Support strengthens if independent milestone verification and cost discipline become public."]
      - ["The business has some early monetization potential through subsystem and electronics sales.", "Independent reporting says a subsidiary is already selling fusion-related electronics and power-control equipment.", "Support strengthens if customer names, repeat orders, and margin quality become public or diligence-confirmed."]
      - ["The current unicorn framing may be ahead of commercial proof.", "Independent reporting says viability remains years away and public evidence still lacks a robust comp set or customer-demand disclosure.", "Support weakens if the company publishes stronger customer, economics, and governance evidence."]
    notes: "Rows contrast the strongest investable arguments with the specific evidence that would move the valuation call."
    claimRefs: [CV002, CV003, CV006, CV009, CV010, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "NTST installation and follow-on engineering milestones stay on schedule; subsystem revenue expands; later financing remains clean.", "The current mark can be rationalized as an option on scarce fusion leadership if technical proof compounds quickly.", "Execution slippage, cost overruns, and delayed customer proof still matter.", "Possible, but needs milestone verification beyond company-issued updates."]
      - ["Base", "Engineering progress continues, financing remains available, but customer and economics disclosure stays limited.", "The company remains strategically interesting, yet the current price mainly buys into future optionality rather than proven commercial cash generation.", "Term opacity, dilution, and time-to-commercialization remain unresolved.", "Best fit for current public evidence."]
      - ["Bear", "Technical milestones slip, financing terms worsen, or commercialization evidence fails to broaden beyond research institutions and subsystem sales.", "A later round or exit could clear below today's enthusiasm because the valuation outran evidence quality.", "Down-round risk, multiple compression, and governance opacity.", "Still credible because valuation support is thinner than the headline narrative."]
    notes: "Scenario table uses milestone references and disclosed financing context rather than a revenue-multiple model because public economics data is still incomplete."
    claimRefs: [CV004, CV006, CV009, CV010, CV013, CV014]
