    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Series A financing
        - RMB 1.0bn (about $143.3m)
        - 2026-01 to 2026-05 coverage
        - Jiemian; Fusion Energy Base
        - Medium
        - Confirms investor appetite and project sponsorship
        - Says nothing directly about customer count or recurring demand
      - - Jiading strategic cooperation
        - Main research and experimental base to be established in Jiading
        - 2026-01
        - Jiemian; Shanghai government
        - High
        - Strongest public proof of institutional commitment around Startorus
        - No disclosed service usage, procurement volume, or customer spend
      - - Shanghai experimental base
        - About 25 mu and 50,000 square meters; expected operational in 2027
        - 2026-01
        - Shanghai government
        - Medium
        - Infrastructure scale supports the commercialization pathway
        - Capacity utilization and customer-linked throughput are undisclosed
      - - NTST installation start
        - Planned start in September 2026
        - 2026-01
        - Shanghai government
        - Medium
        - Marks the next validation step before any customer deployment
        - No pilot customer is attached publicly
      - - Startorus-1 engineering schedule
        - Construction starts in 2027, installation finishes in 2028, full-parameter run in 2029
        - 2026-01
        - Shanghai government
        - Medium
        - Shows an engineering funnel with dated milestones
        - Still no disclosed user conversion metrics
      - - Commercial demo target
        - Demonstration machine capable of outputting electricity around 2032
        - 2026-01
        - Fusion Energy Base
        - Medium
        - Earliest public anchor for future end-market entry
        - No named buyer, tariff, or offtake framework disclosed
    notes: >-
      Every tracked milestone is about financing, siting, or engineering readiness rather
      than customer deployment, renewals, or usage.
    claimRefs: [CU002, CU004, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Public outcome
      - Limitation
    rows:
      - - Jiading district government
        - Public-sector host / sponsor
        - Site landing, research base support, policy coordination
        - Pre-commercial infrastructure
        - Strategic cooperation agreement and relocation support are publicly disclosed
        - Counterparty proof, not proof of paid product usage
      - - Shanghai state-backed investor consortium
        - Financial sponsor
        - Funds the build-out of the next device and Shanghai base
        - Pre-commercial capital support
        - Largest reviewed 2026 private fusion financing in China
        - Investor validation is not customer validation
      - - CIMC Enviro
        - Industrial supplier / strategic shareholder
        - Exploring equipment cooperation such as specialized storage tanks
        - Exploratory / pre-product
        - RMB 30m investment and disclosed intent to become a core supplier
        - No purchase order, deployment, or recurring revenue disclosed
      - - Tsinghua-linked SUNIST-2 collaboration
        - Research collaborator
        - Experimental device co-development and validation
        - Research / pilot validation
        - Shows technical-use proof for experiments
        - Research use does not establish external customer demand
    notes: >-
      This required enumeration is partial by design because assigned public sources expose
      only counterparties and collaborators, not a full set of paying commercial customers.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the assigned source set's named public counterparties that most closely
        evidence commercialization activity as of the 2026 refresh, not a complete customer list.
    claimRefs: [CU001, CU002, CU008, CU009, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Startorus's public commercialization path currently runs from research credibility to
      sponsor and supplier alignment, with end-market customer proof still ahead.
    data:
      items:
        - label: Research-origin credibility
          phase: 2021-2025
          actor: Tsinghua-linked founding and SUNIST-2 experimentation
          touchpoints:
            - Tsinghua-linked spinout and SUNIST-2 validation work
            - Scientific credibility precedes customer disclosure
        - label: State-backed financing
          phase: 2026
          actor: Shanghai-led investor consortium
          touchpoints:
            - RMB 1.0bn Series A financing
            - Capital is visible before customer metrics are visible
        - label: Jiading siting and policy support
          phase: 2026-2027
          actor: Jiading district government
          touchpoints:
            - Strategic cooperation agreement
            - Site selection, policy, and employee-placement support
        - label: Industrial partner exploration
          phase: 2026 onward
          actor: CIMC Enviro and other upstream suppliers
          touchpoints:
            - RMB 30m small equity stake
            - Specialized equipment cooperation remains exploratory
        - label: Engineering validation funnel
          phase: 2026-2029
          actor: NTST and Startorus-1 milestones
          touchpoints:
            - 2026 NTST installation target
            - 2027-2029 engineering schedule
        - label: Future commercial users
          phase: 2028-2032+
          actor: Prospective power or industrial-energy buyers
          touchpoints:
            - Demonstration power target around 2032
            - No named offtaker or retention metric is public yet
    claimRefs: [CU001, CU004, CU006, CU008, CU009, CU011]
callouts:
  - calloutType: insight
    title: Institutional traction is real, but it is not yet customer traction
    body: >-
      Jiading's support, the Shanghai-led financing round, and CIMC Enviro's disclosed
      cooperation plans all reduce execution isolation. They do not, however, substitute
      for named end customers, repeat purchases, or signed power demand.
    claimRefs: [CU001, CU002, CU008, CU009]
  - calloutType: risk
    title: Durability still depends on proving buyer conversion after technical milestones
    body: >-
      Because the public record lacks customer count, renewal, churn, NRR, and contract
      disclosures, investors still need direct diligence on who will pay, when pilot users
      appear, and whether any single sponsor or industrial partner dominates the early funnel.
    claimRefs: [CU011, CU012, CU013]
