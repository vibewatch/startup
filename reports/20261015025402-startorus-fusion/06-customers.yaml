company:
  name: Startorus Fusion
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence for Startorus Fusion is still pre-commercial. The strongest
    proof is not a named power buyer or production deployment, but a stack of institutional
    counterparties: Jiading district as site and policy sponsor, Shanghai state-backed funds
    as capital providers, and CIMC Enviro as a prospective industrial supplier. That leaves
    retention, customer concentration, and real buyer conversion materially under-documented.
sections:
  - id: customer-proof
    title: Commercial traction is still counterparty-led, not end-customer-led
    body: >-
      The assigned source set shows real institutional traction, but it does not yet show
      paying end users for fusion power or a public production deployment. The clearest
      proof points are Jiading district's siting and policy support, the 2026 state-backed
      financing round, and CIMC Enviro's disclosed exploratory supplier relationship. Those
      are meaningful because they indicate that local government and industrial capital are
      willing to underwrite the next engineering phase, yet they are not interchangeable with
      customer adoption. Public materials reviewed for this chapter do not disclose customer
      count, installed sites, utilization, renewals, churn, or contract length, so the
      present commercialization story is best read as ecosystem formation around a long-dated
      fusion program rather than a validated revenue customer base.
    claimRefs: [CU001, CU008, CU009, CU011, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-counterparties
    title: Named proof is strongest around government sponsorship and industrial partners
    body: >-
      Startorus has stronger public evidence for counterparties that help it build than for
      customers that buy output. Independent and official sources agree that the company
      reached a strategic cooperation arrangement with Jiading district and plans to anchor
      its main research and experimental base there. The same government source says the move
      was supported through site selection, policy coordination, and employee placement,
      while a listed industrial investor, CIMC Enviro, told its own investors that it has
      taken a small equity position and is exploring related equipment cooperation. That mix
      supports a segmentation view in which public-sector sponsors, state-backed investors,
      research collaborators, and prospective upstream suppliers are observable now, while
      future power buyers remain a hypothesis attached to the 2028-2032 reactor roadmap.
    claimRefs: [CU002, CU003, CU004, CU008, CU009, CU014]
    tableRefs: [TU003]
  - id: adoption-trajectory
    title: Adoption milestones are engineering and infrastructure milestones
    body: >-
      The measurable trajectory in public sources is still milestone-based rather than
      customer-metric-based. The 2026 evidence emphasizes base construction, device
      installation timing, and engineering validation targets: Jiading's government page lays
      out a September 2026 NTST installation start, a 2027 Startorus-1 construction start,
      2028 installation completion, and 2029 full-parameter operations, while Fusion Energy
      Base frames 2028 as the engineering-verification checkpoint before a future commercial
      demonstration unit. Jiemian adds the ambition to achieve fusion energy gain above one
      before the end of the decade. These are important indicators of progress, but they are
      still readiness milestones; none of the reviewed sources attach them to public offtake
      contracts, pilot customers, or repeat-purchase behavior.
    claimRefs: [CU004, CU005, CU006, CU007, CU011]
    tableRefs: [TU002]
  - id: durability-and-expansion
    title: Durability and expansion remain the biggest customer-underwriting gaps
    body: >-
      The key underwriting gap is not whether Startorus can attract capital and local
      government support; that is already visible. The harder question is whether those
      relationships convert into durable customer demand. Sector context from SCIO/Xinhua
      remains sobering: fusion industrialization still faces major technical hurdles and a
      thinner private-capital base in China than in the United States, while China's 2026
      policy package continues to rely on large public investment and science funding to
      support frontier technologies. In that environment, Startorus can plausibly build a
      stronger commercialization funnel over time, but today's public record still lacks
      named power offtakers, usage metrics, retention disclosures, and concentration data,
      so expansion and customer durability should be treated as open diligence items rather
      than assumed strengths.
    claimRefs: [CU010, CU011, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public proof
      - Current scale / progress
      - Revenue / strategic value
      - Gap
    rows:
      - - Public-sector host / sponsor
        - Jiading district government is the visible payer-like counterparty for site support and project landing
        - Strategic cooperation agreement and relocation support for the Shanghai base
        - Project signed in 2026; base and device installation are still pre-commercial
        - High strategic value because it enables land, policy support, and local operating capacity
        - Not evidence of a paying end customer for fusion output
      - - State-backed financial sponsors
        - Shanghai STVC Group, Shanghai Future-oriented Industries Fund, and other investors fund the build-out
        - 2026 Series A round and follow-on capital coverage
        - Largest disclosed private fusion financing in China for the year in reviewed sources
        - Extends runway for engineering validation and site build-out
        - Investor support is not the same as user adoption
      - - Industrial supply-chain partners
        - CIMC Enviro and similar equipment manufacturers are the clearest public industrial counterparties
        - Disclosed small equity investment plus exploratory equipment cooperation
        - Relationship is exploratory and upstream-facing, not a deployed production contract
        - Could open hardware and engineering revenue pathways before grid power sales
        - No purchase-order value, delivery schedule, or operating deployment disclosed
      - - Future power / industrial energy users
        - Prospective electricity or industrial-heat buyers are the eventual target segment
        - Public roadmap points to verification in 2028 and a demonstration power machine around 2032
        - End-market remains future-state only
        - Core long-term value driver if Startorus reaches reactor-scale milestones
        - No named offtaker, pilot customer, or contract has been disclosed in assigned sources
    notes: >-
      Public evidence supports counterparties and commercialization enablers more than
      end-customer adoption; rows distinguish current sponsor/partner proof from future
      user hypotheses.
    claimRefs: [CU001, CU002, CU008, CU009, CU013]
