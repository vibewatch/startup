- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest disclosed financing round
    - RMB 1bn Series A
    - High
    - Confirms strong external funding access for the next build stage
    - Match bank receipts, closing dates, and investor rights to announcement claims
  - - Disclosed cumulative funding
    - '> RMB 1.5bn from >50 investors'
    - Medium
    - Shows capital has been raised, but not how much remains available
    - Request current cash balance and restricted cash
  - - Engineering-verification milestone
    - Target around 2028
    - Medium
    - Defines when technical progress might justify the next financing step
    - Request milestone budget and contingency assumptions
  - - Pilot electricity milestone
    - Target around 2032
    - Medium
    - Implies a long pre-revenue or low-revenue development window
    - Request build capex, project-finance plan, and expected pilot utilization
  - - Public revenue disclosure
    - null
    - Low
    - Without revenue or ARR, sales efficiency and quality are not underwritable
    - Request monthly revenue, revenue mix, and backlog by product line
  - - Public gross-margin disclosure
    - null
    - Low
    - Margin path is central for any hardware-plus-project business
    - Request unit cost breakdown, warranty reserve, and service burden
  - - Public burn / runway disclosure
    - null
    - Low
    - Cash-duration risk cannot be assessed from the public record
    - Request 24-month budget, headcount plan, and downside financing triggers
  notes: This table intentionally mixes disclosed milestones with null operating metrics because the public record is funding-rich but operating-metric-poor.
