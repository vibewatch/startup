company:
  name: Startorus Fusion
chapter:
  number: 4
  title: Financials
  summary: Startorus Fusion has raised unusually large state-backed capital for a private mainland fusion startup and has some early hardware-adjacent commercialization, but the public record still does not disclose revenue, pricing realization, margin structure, burn, or runway. The chapter therefore underwrites financing access and capital intensity more confidently than revenue quality.
sections:
- id: revenue-model-and-public-monetization
  title: Revenue model and public monetization evidence
  body: 'Public evidence shows Startorus Fusion is still financed primarily as a pre-commercial fusion developer rather than as a disclosed operating business with publishable recurring revenue. The clearest monetization evidence is not electricity sales but side-product commercialization: the company says it has delivered hundreds of isolation amplifiers and ideal integrators, exported multiple HTS data acquisition systems, and delivered a plasma acceleration system. That matters because it suggests management is trying to create intermediate cash-generating outputs while the core reactor program remains years away from an electricity-producing pilot. However, none of the reviewed sources discloses customer names, contract values, list pricing, discounts, or realized revenue for those products, so the public record supports existence of commercial activity but not its scale or repeatability.'
  claimRefs:
  - CI001
  - CI004
  - CI005
  - CI008
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: capital-intensity-and-financing-dependence
  title: Capital intensity and financing dependence
  body: 'The capital story is much clearer than the operating story. Multiple sources converge on a RMB1 billion Series A announced in January 2026, with SCMP also reporting that state-owned Shanghai funds contributed roughly RMB400 million and that total funding had exceeded RMB1.5 billion from more than 50 investors. The round proceeds were earmarked for the next-generation fusion device, and third-party timelines still place engineering verification around 2028 and a pilot or demonstration electricity machine around 2032. That timeline fits the wider fusion-sector pattern described by TechCrunch and MIT Technology Review: investors are funding long-duration engineering programs where equipment, experiments, and employees are expensive, while real commercial power output remains unproven. The result is a company whose funding access looks real, but whose financing need is still milestone-driven rather than self-funding.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI006
  - CI009
  - CI010
  tableRefs:
  - TI003
- id: underwriting-view-and-diligence-blockers
  title: Underwriting view and diligence blockers
  body: The underwriting problem is therefore not whether Startorus can attract capital, but whether outside investors can judge revenue quality and cash durability from public evidence. Startorus argues its magnetic-reconnection tokamak design is simpler than mainstream heating systems and should be economically competitive, and broader fusion research plus policy support make that narrative plausible enough to sustain fundraising. But neither the company nor independent reporting in the assigned source pool discloses revenue mix, gross margin, service-delivery cost, customer concentration, backlog, project-finance obligations, cash on hand, burn, or runway. The right financial verdict is that Startorus currently looks financeable for milestone delivery, not yet underwritable on conventional operating metrics. Diligence should therefore focus on realized sales, margin walk, budget-to-milestone planning, and round-to-round dependency before anyone treats the current valuation as supported
    by operating performance.
  claimRefs:
  - CI007
  - CI008
  - CI011
  - CI012
  - CI013
