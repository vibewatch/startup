  rows:
  - - Fusion-device financing
    - Equity capital funds R&D and construction rather than customer revenue
    - RMB
    - RMB 1bn Series A announced Jan 2026; total disclosed funding > RMB 1.5bn
    - High confidence on funding amount; not operating revenue
    - Obtain cap table, liquidation preferences, and use-of-funds schedule
  - - Control electronics and diagnostics
    - Sale/delivery of isolation amplifiers, ideal integrators, HTS data acquisition systems, and a plasma acceleration system
    - Units / systems
    - Company says hundreds of amplifiers/integrators delivered; no revenue disclosed
    - Commercial activity exists, but monetization scale is unverified
    - Request product revenue by SKU, ASP, gross margin, and named customers
  - - Future fusion pilot output
    - Electricity-producing demonstration machine after engineering verification milestones
    - MWh / power offtake
    - Targeted for pilot output around 2032; no disclosed customers or offtake terms
    - Roadmap only, not current revenue
    - Request pilot economics, PPA/offtake pipeline, and grid interconnection plan
  - - Magnet / HTS cooperation pipeline
    - Potential cooperation agreements tied to magnet capabilities
    - Contracts
    - Potential cooperation agreements mentioned; no executed contract values disclosed
    - Indicative only
    - Request signed agreements, pricing, and delivery obligations
  notes: Public sources mix financing, side-product commercialization, and roadmap targets; null-equivalent gaps reflect undisclosed public data rather than zero activity.
