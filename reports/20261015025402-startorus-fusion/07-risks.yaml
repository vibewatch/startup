company:
  name: Startorus Fusion
chapter:
  number: 7
  title: Risks
  summary: 'Startorus Fusion''s risk stack is dominated by capital-intensive execution: independent and government sources show a 1 billion yuan Series A, a subsequent 500 million yuan Series A+, and a roadmap that still must bridge from NTST installation in 2026 to Q>1 around 2028 and commercial demonstration in the early 2030s. A deep Tsinghua-derived talent bench, a claimed simpler heating architecture, and strong Shanghai policy support mitigate that path, but public disclosure still leaves material gaps on licensing, cap-table terms, budget/runway, supply concentration, and demand proof for future reactor output.'
sections:
- id: ranked-risk-picture
  title: Ranked risk picture
  body: The highest-severity risks cluster where schedule, capital, and disclosure gaps reinforce each other. Public sources show Startorus closed a 1 billion yuan Series A in January 2026, then a 500 million yuan Series A+ later in 2026, while still targeting NTST installation in 2026, Q>1 around 2028, and commercial demonstration power in the early 2030s. That combination means the company has meaningful execution momentum, but it also means a slip in permits, site build-out, magnet performance, or follow-on financing could compound quickly. The residual risk is highest where the public record still does not disclose the licensing stack, financing terms, or named future power buyers needed to de-risk a reactor-scale commercialization case.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR012
  - CR013
  - CR014
  figureRefs:
  - FR001
- id: regulatory-legal-and-governance-gaps
  title: Regulatory, legal, and governance gaps
  body: 'The public record supports serious investor interest and local-government backing, but it does not yet show the governance and regulatory detail that would let an investor treat those signals as fully de-risking. The Shanghai government disclosure and independent reporting document funding, project landing, and the planned build schedule, yet none of the assigned sources publishes the permit map for nuclear-material handling, tritium sourcing, activated-material disposal, or the exact environmental and safety approvals needed for a private fusion program in China. The same gap exists on financing governance: the rounds are public, but liquidation preferences, anti-dilution protections, reserved matters, and budget/runway assumptions are not.'
  claimRefs:
  - CR002
  - CR012
  - CR013
  - CR014
  tableRefs:
  - TR001
- id: execution-and-operational-risk
  title: Execution and operational risk
  body: Execution risk remains high because the public roadmap compresses several hard engineering steps into the next three years. Government and media sources place Startorus on a path from NTST installation in 2026 to a Q>1 target around 2028, while the company's own technical page presents a simplified magnetic-reconnection heating concept as a mitigation. That claim does not eliminate commissioning, reliability, and scale-up risk for high-temperature superconducting magnets, cryogenic systems, and plasma-control hardware. The official pages also identify locations in Shanghai and Xi'an, implying multi-site coordination risk, while the Tsinghua-derived technical core is both an operating strength and a key-person concentration exposure from an investor's perspective.
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR015
  tableRefs:
  - TR002
- id: dependency-capital-and-demand-risk
  title: Dependency, capital, and commercialization risk
  body: Dependency risk is not limited to suppliers. The assigned sources tie the Shanghai build-out to Jiading district support, Shanghai state-backed investors, and infrastructure that still needs to move from announced project landing to operating facility and validated device performance. Jiemian also reports that Startorus has started generating early revenue through fusion-related electronics and power-control equipment, which is a useful hedge, but the reviewed pool still does not name long-term future power buyers or show a public offtake pipeline for a reactor product. In practice, the investment thesis should break if financing remains available but milestone delivery, permitting readiness, or externally validated customer demand fails to keep pace.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR011
  - CR012
  - CR014
  - CR015
  tableRefs:
  - TR003
