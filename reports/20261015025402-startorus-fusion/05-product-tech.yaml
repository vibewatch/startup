artifact: product-tech
slug: startorus-fusion
runDate: 2026-10-15
company:
  name: Startorus Fusion
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Startorus Fusion is still best understood as a staged fusion-engineering
    program rather than a commercial product line, with public evidence centered
    on SUNIST-2, the NTST build, and a future CTRFR-1 scale-up path. The
    strongest disclosed differentiation is its magnetic-reconnection-heating and
    negative-triangularity spherical-tokamak approach, but most performance,
    reliability, safety, and commercialization proof remains company-authored or
    speaker-submitted rather than independently audited.
sections:
  - id: delivered-system-and-assets
    title: Delivered system and current asset stack
    body: >-
      Startorus' public product story is a sequence of experimental and
      pre-commercial reactor assets rather than a deployed customer-facing power
      product today. Dealroom and the company's own technical materials describe
      a pathway from the operating SUNIST-2 platform, through the NTST device
      now under assembly, toward CTRFR-1 as the next
      high-temperature-superconducting scale-up. That is meaningful technical
      progress, but it also means maturity should be judged by subsystem
      qualification and first-plasma milestones instead of revenue-grade
      deployment, uptime, or customer adoption metrics.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE012
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: architecture-and-differentiation
    title: Architecture and claimed differentiation
    body: >-
      The core technical claim is that Startorus can use magnetic reconnection
      heating inside a spherical tokamak to simplify plasma heating and reduce
      plant complexity relative to mainstream approaches that rely more heavily
      on large auxiliary heating systems. The AAPPS conference abstract adds a
      second differentiator around negative-triangularity shaping in NTST and a
      third around the long-term HTS magnet path into CTRFR-1. Those are
      credible design theses for a fusion startup, but they remain engineering
      claims until public data show repeatable confinement, integrated subsystem
      performance, and a clearer link from experimental physics to commercially
      relevant operating economics.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE013
    tableRefs:
      - TE002
  - id: maturity-dependencies-and-operating-model
    title: Maturity, dependencies, and operating model
    body: >-
      Public disclosures show genuine hardware and controls work already
      underway, not just a concept deck: the 2026 AAPPS materials describe
      wound and qualified toroidal-field coils, modular pulse-power production,
      cryogenic test infrastructure, and real-time control software validated on
      SUNIST-2. At the same time, those same materials show how much the
      roadmap still depends on successful subsystem integration,
      partner-supported neutral-beam work, and on-time commissioning of the
      Jiading facility. The two official site pages also confirm a split
      Shanghai and Xi'an footprint, but they do not explain which site owns
      R&D, manufacturing, testing, QA, or field operations.
    claimRefs:
      - CE004
      - CE006
      - CE008
      - CE009
      - CE013
      - CE014
    tableRefs:
      - TE003
  - id: trust-safety-and-commercialization-risk
    title: Trust, safety, and commercialization risk
    body: >-
      The biggest remaining gap is not whether Startorus has a plausible
      technical narrative, but whether outside investors can independently
      underwrite reactor-grade performance, safety controls, and
      commercialization timing from the current public record. The Belfer
      Center's 2026 fusion critique is a useful check here: even the best
      tokamak results remain far from system-level breakeven, and tritium plus
      neutron-management challenges stay central to any serious fusion roadmap.
      Startorus may still hit important milestones, but the current evidence
      base is much stronger on architecture and ambition than on independently
      verified uptime, safety systems, customer readiness, or regulatory
      execution.
    claimRefs:
      - CE010
      - CE011
      - CE014
callouts:
  - calloutType: insight
    title: Engineering program before productization
    body: >-
      Public evidence supports a real device portfolio and subsystem program,
      but not a commercially deployed reactor product or independently verified
      customer workflow yet.
    claimRefs:
      - CE003
      - CE004
      - CE009
  - calloutType: risk
    title: Commercial timeline is still proof-constrained
    body: >-
      The 2028 engineering-validation and 2032 demonstration narrative is
      visible across sources, but independent evidence still trails the
      company's own milestone framing on performance, safety, and integration
      risk.
    claimRefs:
      - CE003
      - CE009
      - CE011
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - SUNIST-2
        - Internal physics and controls team
        - Operating since 2023; first plasma disclosed in July 2023; used for merging-compression and control validation
        - Gives Startorus a running platform ahead of NTST commissioning
        - No public uptime, availability, or independently audited performance history
      - - NTST
        - Internal engineering program and future reactor demonstrator team
        - Under assembly; first plasma targeted by end-2026
        - Negative-triangularity spherical tokamak with six PF coil pairs and 1 MA target pulse design
        - No public integrated-plasma result yet, so maturity is still pre-first-plasma
      - - TF0 / full-scale TF magnet work
        - Magnet and cryogenic engineering team
        - Coil qualification disclosed; TF0 passed 22 kA testing
        - Connects present engineering work to future HTS reactor scaling
        - No public endurance, manufacturing-yield, or cost data
      - - CTRFR-1
        - Future commercial-demonstration program
        - Next-step HTS device with Q ~ 1 design goal rather than an operating asset
        - Frames the route from experimental machines toward reactor-grade energy gain
        - No public economics, licensing, fuel-cycle, or maintenance plan
    notes: Public evidence distinguishes operating, under-assembly, and future-design assets; null commercial metrics reflect unavailable public deployment data rather than zero activity.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE012
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - - Plasma startup and heating
        - Mainstream tokamak programs often depend on larger auxiliary heating systems
        - Magnetic reconnection heating using multiple PF coils and two induced plasma rings
        - Company says the approach "requires nothing more than several sets of coils" and is "far less complicated and difficult" than high-power neutral beam or millimeter-wave alternatives
        - No public side-by-side efficiency, cost, or plasma-performance comparison
      - - Plasma shaping and confinement
        - Baseline spherical tokamak geometry can constrain column space and edge-control options
        - NTST negative-triangularity configuration with six PF coil pairs and wide triangularity range
        - AAPPS abstract says the geometry can expand central-column space and support H-mode-level confinement without ELMs
        - Claim is still pre-first-plasma for NTST
      - - Subsystem qualification and reactor integration
        - Experimental fusion programs must individually qualify magnets, pulse power, cooling, controls, and heating subsystems
        - Startorus is qualifying coils, pulse-power modules, cooling systems, and control software before full-machine commissioning
        - Publicly disclosed milestones include 22 kA TF0 testing, commissioned TF power systems, and validated real-time control on SUNIST-2
        - Qualified subsystems do not yet prove integrated reactor uptime or maintainability
      - - Commercial path to electricity output
        - Fusion startups move from lab devices to engineering validation and then demonstration plants
        - Startorus publicly targets engineering verification around 2028 and a demonstration machine outputting electricity around 2032
        - The roadmap is specific enough to judge milestone slippage over time
        - Public sources still do not show customer deployments, power buyers, or plant-economics proof
    notes: The table mixes company-claimed benefits with milestone evidence; quoted simplification claims are architectural assertions, not independently benchmarked outcomes.
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE011
      - CE013
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Magnetic reconnection heating
        - Heats plasma by merging two induced plasma rings into a primary plasma
        - Multiple PF coils and successful control of the merging sequence
        - Public evidence is mostly company-authored, so performance and economics remain thinly verified
      - - NTST copper-magnet device
        - Near-term machine for negative-triangularity validation and first-plasma execution
        - Vacuum vessel, TF/PF/CC coils, pulse power, cooling, and facility readiness all must land together
        - Integration risk remains high until end-to-end commissioning is public
      - - Controls and diagnostics
        - Supports isoflux control, RL-based RZIp control, real-time EFIT, and density feedback
        - Continued validation on SUNIST-2 and transfer into larger machines
        - Public sources do not show long-duration operating history or fault-response data
      - - HTS scale-up path
        - Connects current engineering work to CTRFR-1 and reactor-grade field targets
        - HTS tape supply, coil manufacturing repeatability, cryogenics, and structural margins
        - Public materials disclose model-coil progress but not a full manufacturability or cost curve
      - - Dual-site footprint
        - Provides a Shanghai Jiading and Xi'an operating base
        - Clear division of site responsibilities and quality systems
        - Official pages list addresses but not the site-specific operating model
    notes: Dependencies summarize disclosed technical building blocks; missing reliability, QA, and economics detail is a diligence limitation, not evidence of failure.
    claimRefs:
      - CE004
      - CE006
      - CE008
      - CE010
      - CE012
      - CE013
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: The public architecture layers move from reconnection-based plasma physics, to current devices, to enabling subsystems, and then to a future HTS demonstration path.
    data:
      layers:
        - label: Physics approach
          items:
            - Magnetic reconnection heating
          modules:
            - Multiple poloidal field coils induce two plasma rings
            - Ring merging heats the primary plasma
          outputs:
            - Claimed simpler heating path than large auxiliary beam or millimeter-wave systems
        - label: Current devices
          items:
            - SUNIST-2
            - NTST
          modules:
            - SUNIST-2 has been used for startup and controls validation
            - NTST is the negative-triangularity machine now under assembly
          outputs:
            - Experimental bridge from present physics work to first-plasma execution
        - label: Enabling subsystems
          items:
            - TF coils and PF coil set
            - Pulse-power system
            - 77 K cooling infrastructure
            - Real-time control suite
            - 1 MW neutral beam under joint development
          modules:
            - Coil qualification and cryogenic acceptance testing
            - Batch-produced modular power supplies and commissioned TF power system
          outputs:
            - Subsystem readiness evidence without full integrated-reactor proof
        - label: Experimental facilities
          items:
            - Shanghai Jiading site
            - Xi'an site
          modules:
            - Jiading facility broke ground in April 2026
            - Official pages list both operating addresses
          outputs:
            - Distributed footprint with still-undisclosed site-level responsibilities
        - label: Scale-up path
          items:
            - CTRFR-1
          modules:
            - Next-step HTS spherical tokamak
            - Public target of Q ~ 1
          outputs:
            - Future engineering-validation and demonstration-plant bridge
        - label: Commercialization proof layer
          items:
            - Customer and licensing evidence
          modules:
            - Power buyers, safety documentation, and plant economics remain largely private
          outputs:
            - Main gap between technical momentum and investable product readiness
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE012
