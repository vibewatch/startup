        title: Founders, technical pedigree, and governance concentration
        blocks:
          - type: paragraph
            body: >-
              The public narrative is tightly centered on two named leaders: CEO Chen Rui and chief scientist Tan Yi.
              Multiple sources connect both to Tsinghua University's Department of Engineering Physics, and official
              materials emphasize more than two decades of accumulated fusion experience inside the broader core team.
              That pedigree helps explain investor confidence and execution speed, but it also implies key-person
              concentration because the public source set does not provide a full board roster, independent governance
              structure, or succession depth beyond the founding technical leadership.
