  - id: FM001
    title: Evidence-constrained market layers for Startorus Fusion
    type: pyramid
    summary: >-
      The public record supports a staged opportunity stack—sector capital, ecosystem buildout, company financing, and
      component commercialization—rather than a clean TAM/SAM/SOM.
    data:
      items:
        - label: Commercial fusion power window
          value: mid-2030s
          unit: commercialization target window
          note: >-
            DOE places pilot plants and commercial fusion power in the mid-2030s; this is timing guidance, not current
            revenue.
          claimRefs:
            - CM004
            - CM005
        - label: Fusion ecosystem buildout
          value: '>15 / >10 / >70'
          unit: private companies / national labs / universities in DOE roadmap inputs
          note: >-
            DOE says the roadmap drew on more than 15 private companies, over 10 national labs, and more than 70
            universities.
          claimRefs:
            - CM004
        - label: Shanghai cluster formation
          value: state-backed funds + private developers + suppliers
          unit: cluster composition
          note: Jiemian describes Shanghai as a concentrated fusion cluster rather than a single-project market.
          claimRefs:
            - CM006
        - label: Startorus disclosed 2026 financing
          value: $347.3m
          unit: derived disclosed USD-equivalent financing
          note: >-
            Approximation sums Fusion Energy Base's listed Series A/A+/A++ tranches and should not be treated as market
            size.
          claimRefs:
            - CM008
            - CM009
        - label: Jiading physical buildout
          value: 25 acres / 50,000 sq m
          unit: experimental base footprint
          note: Deye says the Jiading base should become operational in 2027.
          claimRefs:
            - CM010
        - label: Near-term monetization wedge
          value: electronics, HTS systems, plasma acceleration
          unit: current products / services
          note: >-
            Company-linked and independent sources show component and subsystem commercialization before reactor power
            sales.
          claimRefs:
            - CM003
    approximationNotes: >-
      The figure narrows broad fusion opportunity into the specific layers that are publicly evidenced for Startorus. It
      intentionally mixes timing, capital, cluster, facility, and product signals because retained sources do not
      support a single comparable TAM/SAM/SOM stack.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM009
      - CM010
      - CM013
