  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, public-program substitutes, and adjacent alternatives'
        blocks:
          - type: paragraph
            body: >
              The assigned evidence shows that Startorus is not competing in a blank space. The Nuclear News Network
              tracker places it in a private spherical-tokamak race that already includes Chinese private projects such
              as Energy Singularity's HH70 and HH170 and overseas private substitutes such as Tokamak Energy's ST40 and
              ST80-HTS. Jiemian adds a second domestic layer by naming Shanghai-based Energy Singularity and NovaFusionX
              as local startups pursuing different technical approaches. At the same time, ITER and the Chinese public
              programs listed in the tracker remain the status-quo benchmark for talent, supplier attention, and
              technical credibility, even when they are not packaged as venture-backed products.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 'Technical positioning: Startorus''s wedge is integration breadth, not a published commercial package'
        blocks:
          - type: paragraph
            body: >
              Startorus's public differentiation story is unusually specific for a private fusion startup, but it is
              still a technology story. Its official technical page says the company uses magnetic reconnection heating
              by merging two plasma rings and claims that approach avoids some of the complexity of mainstream tokamak
              heating stacks. Independent coverage adds AI-enabled anomaly detection, reinforcement-learning plasma
              control, and physics-informed equilibrium reconstruction, while Jiemian says NTST will test HTS magnets,
              cooling systems, and AI-assisted control. That combination gives Startorus one of the fuller public
              integration narratives in the assigned pool, but the moat still rests on engineering delivery rather than
              on disclosed pricing, customer contracts, or hard switching costs.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP009
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP015
              - CP016
      - number: '3.3'
        title: 'Commercial package: subsystem revenue exists, but public pricing and buyer proof remain thin'
        blocks:
          - type: paragraph
            body: >
              The commercial picture is thinner than the technical one. Jiemian reports that Startorus is already
              commercializing fusion-related electronics and power-control equipment and generating early revenue from
              research institutions and industrial customers, which matters because it creates a nearer-term product
              surface than grid electricity. But the assigned public evidence does not disclose list pricing, standard
              contract structures, or named offtake buyers for Startorus's reactor roadmap, and the same gap persists
              for the named peer programs in this pool. That means competitive comparisons on GTM, discounting, and
              buyer switching costs still have to be framed as diligence gaps rather than as proven advantages.
            claimRefs:
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
              - CP014
      - number: '3.4'
        title: 'Durability and risk: the race is funded and clustered, but still milestone-driven'
        blocks:
          - type: paragraph
            body: >
              The durability question is whether Startorus can turn financing and supply access into a lead before
              public-program substitutes and private peers close the gap. Fusion Energy Base says the January 2026
              Series A was led by CICC Capital and Shanghai state-backed funds, while Jiemian says the later A+ round
              pushed valuation above $1 billion. Official company pages list Shanghai Jiading and Xi'an sites, and
              Jiemian places NTST in Jiading, suggesting a two-city engineering footprint inside relevant manufacturing
              and research clusters. Even so, ITER still frames fusion as a long-horizon experimental bridge to future
              power plants, and Startorus's own public milestone window still points to electricity export only in the
              early 2030s, leaving ample room for displacement if rivals hit milestones first.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The strongest visible wedge is stack integration
            body: >-
              Across the assigned evidence, Startorus's best-supported differentiation is a combination of heating
              architecture, AI-assisted control, and HTS-magnet capability rather than a simple one-feature claim.
            calloutType: strength
            claimRefs:
              - CP002
              - CP004
              - CP009
          - type: callout
            title: The moat is still pre-customer
            body: >-
              The assigned sources show technical ambition and early subsystem revenue, but they do not yet show
              disclosed reactor pricing, named utility buyers, or contract structures that would prove buyer lock-in.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP016
          - type: callout
            title: Cluster advantages may matter as much as physics
            body: >-
              State-backed funding plus a Jiading/Xi'an footprint suggest that Startorus is competing with supplier
              access and local ecosystem support as well as with reactor design.
            calloutType: insight
            claimRefs:
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public monetization evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows Startorus Fusion is still financed primarily as a pre-commercial fusion developer
              rather than as a disclosed operating business with publishable recurring revenue. The clearest
              monetization evidence is not electricity sales but side-product commercialization: the company says it has
              delivered hundreds of isolation amplifiers and ideal integrators, exported multiple HTS data acquisition
              systems, and delivered a plasma acceleration system. That matters because it suggests management is trying
              to create intermediate cash-generating outputs while the core reactor program remains years away from an
              electricity-producing pilot. However, none of the reviewed sources discloses customer names, contract
              values, list pricing, discounts, or realized revenue for those products, so the public record supports
              existence of commercial activity but not its scale or repeatability.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI008
