  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The near-term market is fusion infrastructure and hardware, not electricity sales
        blocks:
          - type: paragraph
            body: >-
              The retained sources draw a much narrower market boundary than a generic "fusion is huge" narrative.
              Startorus is pursuing compact spherical tokamaks with high-temperature superconducting magnets and a
              magnetic-reconnection heating approach, but the revenue evidence in hand sits upstream of grid power.
              Company- and partner-linked sources describe near-term commercialization through electronics,
              data-acquisition systems, plasma-acceleration equipment, and HTS magnet capabilities, while independent
              coverage still frames reactor electricity as an early-2030s objective rather than a present buyer
              workflow. That means today's addressable spend is better defined as fusion R&D infrastructure,
              experimental-device buildout, and component procurement than as utility-scale power demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
