              - CM003
              - CM011
              - CM013
          - type: callout
            title: Public demand proof stops before offtake
            body: >-
              Investor appetite and municipal support are visible, but the record still lacks named utilities,
              industrial-heat buyers, or disclosed offtake structures that would convert long-term fusion ambition into
              a defendable SAM or SOM.
            calloutType: risk
