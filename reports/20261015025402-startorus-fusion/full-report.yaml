      - number: '2.2'
        title: Sizing has to rely on capital, buildout, and timing lenses
        blocks:
          - type: paragraph
            body: >-
              Public sources do not provide a clean TAM/SAM/SOM for Startorus, so the chapter uses evidence-constrained
              lenses instead. DOE's 2026 roadmap says more than $10 billion of private investment is already advancing
              fusion technologies and demonstration projects, which is a sector-capital signal rather than a spend pool
              available to one company. At the company level, Fusion Energy Base, Jiemian, and Dealroom together show
              continuing 2026 financing momentum, while Deye's partner release adds a physical-capacity lens via the
              planned 25-acre, 50,000-square-meter Jiading base. These inputs support a staged market-readiness view,
              but they do not justify treating future power-market revenue as currently addressable demand.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
