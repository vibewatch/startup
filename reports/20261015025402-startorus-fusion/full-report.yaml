  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Commercial traction is still counterparty-led, not end-customer-led
        blocks:
          - type: paragraph
            body: >-
              The assigned source set shows real institutional traction, but it does not yet show paying end users for
              fusion power or a public production deployment. The clearest proof points are Jiading district's siting
              and policy support, the 2026 state-backed financing round, and CIMC Enviro's disclosed exploratory
              supplier relationship. Those are meaningful because they indicate that local government and industrial
              capital are willing to underwrite the next engineering phase, yet they are not interchangeable with
              customer adoption. Public materials reviewed for this chapter do not disclose customer count, installed
              sites, utilization, renewals, churn, or contract length, so the present commercialization story is best
              read as ecosystem formation around a long-dated fusion program rather than a validated revenue customer
              base.
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU011
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
