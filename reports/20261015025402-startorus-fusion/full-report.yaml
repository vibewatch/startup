              - CE012
      - number: '5.2'
        title: Architecture and claimed differentiation
        blocks:
          - type: paragraph
            body: >-
              The core technical claim is that Startorus can use magnetic reconnection heating inside a spherical
              tokamak to simplify plasma heating and reduce plant complexity relative to mainstream approaches that rely
              more heavily on large auxiliary heating systems. The AAPPS conference abstract adds a second
              differentiator around negative-triangularity shaping in NTST and a third around the long-term HTS magnet
              path into CTRFR-1. Those are credible design theses for a fusion startup, but they remain engineering
              claims until public data show repeatable confinement, integrated subsystem performance, and a clearer link
              from experimental physics to commercially relevant operating economics.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE011
              - CE013
      - number: '5.3'
        title: Maturity, dependencies, and operating model
        blocks:
          - type: paragraph
            body: >-
              Public disclosures show genuine hardware and controls work already underway, not just a concept deck: the
              2026 AAPPS materials describe wound and qualified toroidal-field coils, modular pulse-power production,
              cryogenic test infrastructure, and real-time control software validated on SUNIST-2. At the same time,
              those same materials show how much the roadmap still depends on successful subsystem integration,
              partner-supported neutral-beam work, and on-time commissioning of the Jiading facility. The two official
              site pages also confirm a split Shanghai and Xi'an footprint, but they do not explain which site owns R&D,
              manufacturing, testing, QA, or field operations.
            claimRefs:
              - CE004
              - CE006
              - CE008
              - CE009
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE008
              - CE010
              - CE012
              - CE013
      - number: '5.4'
        title: Trust, safety, and commercialization risk
        blocks:
          - type: paragraph
            body: >-
              The biggest remaining gap is not whether Startorus has a plausible technical narrative, but whether
              outside investors can independently underwrite reactor-grade performance, safety controls, and
              commercialization timing from the current public record. The Belfer Center's 2026 fusion critique is a
              useful check here: even the best tokamak results remain far from system-level breakeven, and tritium plus
              neutron-management challenges stay central to any serious fusion roadmap. Startorus may still hit
              important milestones, but the current evidence base is much stronger on architecture and ambition than on
              independently verified uptime, safety systems, customer readiness, or regulatory execution.
            claimRefs:
              - CE010
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Engineering program before productization
            body: >-
              Public evidence supports a real device portfolio and subsystem program, but not a commercially deployed
              reactor product or independently verified customer workflow yet.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
              - CE009
          - type: callout
            title: Commercial timeline is still proof-constrained
            body: >-
              The 2028 engineering-validation and 2032 demonstration narrative is visible across sources, but
              independent evidence still trails the company's own milestone framing on performance, safety, and
              integration risk.
            calloutType: risk
            claimRefs:
