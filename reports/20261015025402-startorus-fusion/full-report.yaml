  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Public milestones show financing and engineering momentum, but commercial proof remains future-dated.
    data:
      items:
        - date: '2021-10-13'
          label: Company founded
          detail: >-
            Sina reported the Shanghai and Shaanxi entities were established on 2021-10-13, and official materials
            describe an October 2021 founding focused on commercial fusion.
          claimRefs:
            - CO001
        - date: '2023-10-20'
          label: Mission framed around commercial fusion
          detail: >-
            Official interview materials said Startorus was established in October 2021 to commercialize fusion energy
            and build China's first commercially controlled fusion reactor.
          claimRefs:
            - CO001
        - date: '2026-01-12'
          label: RMB 1 billion Series A announced
          detail: >-
            The January 2026 financing release described a RMB 1 billion Series A led by Shanghai state-capital
            investors and tied it to the next-generation apparatus plan.
          claimRefs:
            - CO005
        - date: '2026-04-10'
          label: Jiading base construction permit obtained
          detail: >-
            The May 2026 company release said the Jiading experimental base obtained its pile-foundation permit within
            24 hours of land acquisition on 2026-04-10.
          claimRefs:
            - CO010
        - date: '2026-05-07'
          label: A+ round lifts cumulative funding above RMB 2 billion
          detail: >-
            The A+ financing release said cumulative funding surpassed RMB 2 billion and linked the new money to the
            Jiading base, NTST, CTRFR-1, and reactor-grade magnets.
          claimRefs:
            - CO006
        - date: '2026-06-11'
          label: Full-scale superconducting-magnet test highlighted
          detail: >-
            The company news index highlighted completion of a 20K cryogenic energization test for a full-scale
            high-temperature superconducting toroidal field magnet.
          claimRefs:
            - CO011
        - date: '2026-12-31'
          label: NTST installation targeted by end-2026
          detail: Public roadmap materials target completion of NTST installation by the end of 2026.
          claimRefs:
            - CO012
        - date: '2027-12-31'
          label: Jiading base commissioning and NTST rated operation targeted in 2027
