              - CU008
              - CU009
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU008
              - CU009
              - CU011
      - number: '6.2'
        title: Named proof is strongest around government sponsorship and industrial partners
        blocks:
          - type: paragraph
            body: >-
              Startorus has stronger public evidence for counterparties that help it build than for customers that buy
              output. Independent and official sources agree that the company reached a strategic cooperation
              arrangement with Jiading district and plans to anchor its main research and experimental base there. The
              same government source says the move was supported through site selection, policy coordination, and
              employee placement, while a listed industrial investor, CIMC Enviro, told its own investors that it has
              taken a small equity position and is exploring related equipment cooperation. That mix supports a
              segmentation view in which public-sector sponsors, state-backed investors, research collaborators, and
              prospective upstream suppliers are observable now, while future power buyers remain a hypothesis attached
              to the 2028-2032 reactor roadmap.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
              - CU009
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU014
      - number: '6.3'
        title: Adoption milestones are engineering and infrastructure milestones
        blocks:
          - type: paragraph
            body: >-
              The measurable trajectory in public sources is still milestone-based rather than customer-metric-based.
              The 2026 evidence emphasizes base construction, device installation timing, and engineering validation
              targets: Jiading's government page lays out a September 2026 NTST installation start, a 2027 Startorus-1
              construction start, 2028 installation completion, and 2029 full-parameter operations, while Fusion Energy
              Base frames 2028 as the engineering-verification checkpoint before a future commercial demonstration unit.
              Jiemian adds the ambition to achieve fusion energy gain above one before the end of the decade. These are
              important indicators of progress, but they are still readiness milestones; none of the reviewed sources
              attach them to public offtake contracts, pilot customers, or repeat-purchase behavior.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.4'
        title: Durability and expansion remain the biggest customer-underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The key underwriting gap is not whether Startorus can attract capital and local government support; that
              is already visible. The harder question is whether those relationships convert into durable customer
              demand. Sector context from SCIO/Xinhua remains sobering: fusion industrialization still faces major
              technical hurdles and a thinner private-capital base in China than in the United States, while China's
              2026 policy package continues to rely on large public investment and science funding to support frontier
              technologies. In that environment, Startorus can plausibly build a stronger commercialization funnel over
              time, but today's public record still lacks named power offtakers, usage metrics, retention disclosures,
              and concentration data, so expansion and customer durability should be treated as open diligence items
              rather than assumed strengths.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional traction is real, but it is not yet customer traction
            body: >-
              Jiading's support, the Shanghai-led financing round, and CIMC Enviro's disclosed cooperation plans all
              reduce execution isolation. They do not, however, substitute for named end customers, repeat purchases, or
              signed power demand.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
          - type: callout
            title: Durability still depends on proving buyer conversion after technical milestones
            body: >-
              Because the public record lacks customer count, renewal, churn, NRR, and contract disclosures, investors
              still need direct diligence on who will pay, when pilot users appear, and whether any single sponsor or
              industrial partner dominates the early funnel.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risks cluster where schedule, capital, and disclosure gaps reinforce each other.
              Public sources show Startorus closed a 1 billion yuan Series A in January 2026, then a 500 million yuan
              Series A+ later in 2026, while still targeting NTST installation in 2026, Q>1 around 2028, and commercial
              demonstration power in the early 2030s. That combination means the company has meaningful execution
              momentum, but it also means a slip in permits, site build-out, magnet performance, or follow-on financing
              could compound quickly. The residual risk is highest where the public record still does not disclose the
              licensing stack, financing terms, or named future power buyers needed to de-risk a reactor-scale
              commercialization case.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and governance gaps
        blocks:
          - type: paragraph
            body: >-
              The public record supports serious investor interest and local-government backing, but it does not yet
              show the governance and regulatory detail that would let an investor treat those signals as fully
              de-risking. The Shanghai government disclosure and independent reporting document funding, project
              landing, and the planned build schedule, yet none of the assigned sources publishes the permit map for
              nuclear-material handling, tritium sourcing, activated-material disposal, or the exact environmental and
              safety approvals needed for a private fusion program in China. The same gap exists on financing
              governance: the rounds are public, but liquidation preferences, anti-dilution protections, reserved
              matters, and budget/runway assumptions are not.
            claimRefs:
              - CR002
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Execution and operational risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk remains high because the public roadmap compresses several hard engineering steps into the
              next three years. Government and media sources place Startorus on a path from NTST installation in 2026 to
              a Q>1 target around 2028, while the company's own technical page presents a simplified
              magnetic-reconnection heating concept as a mitigation. That claim does not eliminate commissioning,
              reliability, and scale-up risk for high-temperature superconducting magnets, cryogenic systems, and
              plasma-control hardware. The official pages also identify locations in Shanghai and Xi'an, implying
              multi-site coordination risk, while the Tsinghua-derived technical core is both an operating strength and
              a key-person concentration exposure from an investor's perspective.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.4'
        title: Dependency, capital, and commercialization risk
        blocks:
          - type: paragraph
            body: >-
              Dependency risk is not limited to suppliers. The assigned sources tie the Shanghai build-out to Jiading
              district support, Shanghai state-backed investors, and infrastructure that still needs to move from
              announced project landing to operating facility and validated device performance. Jiemian also reports
              that Startorus has started generating early revenue through fusion-related electronics and power-control
              equipment, which is a useful hedge, but the reviewed pool still does not name long-term future power
              buyers or show a public offtake pipeline for a reactor product. In practice, the investment thesis should
              break if financing remains available but milestone delivery, permitting readiness, or externally validated
              customer demand fails to keep pace.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital and schedule are inseparable
            body: >-
              The 2026 financing momentum is real, but the public roadmap still requires multiple years of technical and
              construction milestones before commercial reactor output is credible.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR012
          - type: callout
            title: Policy support mitigates and concentrates risk
            body: >-
              Shanghai and Jiading support lowers facility-landing risk today, yet it also means permitting, local
              execution, and political alignment are concentrated in the same counterparties.
            calloutType: insight
            claimRefs:
              - CR002
              - CR014
              - CR015
          - type: callout
            title: Use milestone-based kill criteria
            body: >-
              Investment conviction should fall sharply if the company misses NTST installation timing, cannot evidence
              a licensing path, or still lacks named future power-demand proof after the next financing cycle.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR011
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and price support
        blocks:
          - type: paragraph
            body: >
              Public valuation context improved on financing momentum, not on disclosed commercial traction. Company and
              third-party sources together show a 2026 sequence of a roughly RMB 1 billion Series A, a RMB 500 million
              Series A+, and an August 2026 A++ round of RMB 880 million, with independent reporting saying the A+ round
              pushed Startorus above a US$1 billion valuation. That is enough to show strong investor appetite and
              unusually deep access to capital for a Chinese private fusion company, but it is not enough to prove the
              current price is underwritten by revenue, backlog, or customer contracts. The evidence therefore supports
              credibility of financing access more strongly than support for the valuation itself.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis strength versus anti-thesis
        blocks:
          - type: paragraph
            body: >
              The long case is that Startorus has assembled real financing, a Tsinghua-derived technical team, disclosed
              engineering uses of proceeds, and a public milestone path that is more concrete than many earlier-stage
              deep-tech stories. The anti-thesis is that most public proof still sits at the engineering-readiness
              layer: magnets, apparatus halls, verification devices, and control systems. Even the favorable independent
              coverage still says commercial viability remains years away. That means the investment question is not
              whether Startorus is real, but whether the present price already discounts too much of the hard work
              between an experimental platform and a bankable commercial fusion asset.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV009
              - CV010
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario ranges and entry discipline
        blocks:
          - type: paragraph
            body: >
              The bull case needs engineering milestones to compress technical and financing risk quickly enough that
              today's unicorn mark becomes a bridge rather than a peak. The base case assumes the company remains
              financeable and technically credible, but public evidence still only supports milestone benchmarking
              rather than a revenue or cash-flow model. The bear case is that capital keeps funding apparatus build-out
              while commercial proof, customer commitments, and governance transparency lag, leaving later rounds or
              eventual liquidity events to clear below the current enthusiasm. For that reason, entry discipline should
              be tied to milestone verification and financing terms rather than to sector narrative alone.
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Final recommendation and diligence asks
        blocks:
          - type: paragraph
            body: >
              The most supportable recommendation remains research-more, not buy, because public evidence can justify
              following the company but not yet underwriting the price with conviction. The valuation case would improve
              if diligence closes three gaps simultaneously: exact 2026 round terms and preference stack, a budget and
              runway view for the Jiading and NTST-to-CTRFR-1 program, and harder evidence of non-research customer
              demand or contracted future power offtake. If those items clear while milestone execution stays on track,
              the stance can move from stretched toward fair. If they do not, the current unicorn framing looks early
              relative to the remaining commercialization distance.
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Follow the company actively, but keep the recommendation at research-more until public or diligence-only
              evidence closes round-terms, runway, and demand-quality gaps that matter more than headline funding size.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV010
              - CV014
          - type: callout
            title: What breaks the valuation story
            body: >-
              A stretched mark can unwind if milestone execution slips, if later financing adds heavy preferences, or if
              early subsystem sales fail to turn into broader commercial demand for future fusion capacity.
            calloutType: risk
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV014
