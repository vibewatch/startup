  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Financing strength improves credibility, but the recommendation still bottlenecks on commercialization proof and
      price discipline.
    data:
      nodes:
        - id: capital
          label: Capital access
          value: Large 2026 A / A+ / A++ sequence
          detail: Shows investor appetite and financing credibility.
        - id: spend
          label: Use of proceeds
          value: Jiading base, NTST, CTRFR-1, HTS magnets, AI control
          detail: Capital is visibly aimed at engineering build-out.
        - id: proof
          label: Technical proof path
          value: NTST and later Q>1 / demo milestones
          detail: Roadmap is public, but still pre-commercial.
        - id: revenue
          label: Early revenue signal
          value: Subsystem and electronics sales
          detail: Helpful proof of monetization, but not reactor-scale demand.
        - id: gap
          label: Valuation bottleneck
          value: Customer demand, cap-table terms, and economics remain thin
          tone: warning
          detail: These gaps matter more than headline funding size.
        - id: call
          label: Recommendation
          value: research-more / stretched
          tone: warning
          detail: Track closely, but keep entry discipline tied to evidence.
      edges:
        - from: capital
          to: spend
          label: Funds move into assets
        - from: spend
          to: proof
          label: Engineering milestones create proof
        - from: proof
          to: revenue
          label: Technical progress can support sellable subsystems
        - from: revenue
          to: gap
          label: Revenue signal still stops short of full commercialization proof
        - from: gap
          to: call
          label: Remaining gaps keep the call price-disciplined
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV010
      - CV013
      - CV014
