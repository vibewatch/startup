      - number: '1.3'
        title: Funding path and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Startorus has moved from an early Tsinghua spinout story to a heavily financed, Shanghai-linked industrial
              project. The January 2026 Series A and May 2026 A+ rounds support a view that the company now sits inside
              a broader state-capital and industrial-capital coalition rather than a purely venture-backed startup path.
              At the same time, the strongest public evidence remains round-announcement level: the reviewed sources do
              not disclose the current cap table, liquidation preferences, debt layer, board control, or other
              investor-rights terms that would determine how much of the headline valuation truly converts into durable
              economic flexibility.
