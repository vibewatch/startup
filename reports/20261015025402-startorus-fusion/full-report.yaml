              - CI007
              - CI012
      - number: '4.2'
        title: Capital intensity and financing dependence
        blocks:
          - type: paragraph
            body: >-
              The capital story is much clearer than the operating story. Multiple sources converge on a RMB1 billion
              Series A announced in January 2026, with SCMP also reporting that state-owned Shanghai funds contributed
              roughly RMB400 million and that total funding had exceeded RMB1.5 billion from more than 50 investors. The
              round proceeds were earmarked for the next-generation fusion device, and third-party timelines still place
              engineering verification around 2028 and a pilot or demonstration electricity machine around 2032. That
              timeline fits the wider fusion-sector pattern described by TechCrunch and MIT Technology Review: investors
              are funding long-duration engineering programs where equipment, experiments, and employees are expensive,
              while real commercial power output remains unproven. The result is a company whose funding access looks
              real, but whose financing need is still milestone-driven rather than self-funding.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI006
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI008
              - CI009
              - CI010
              - CI013
      - number: '4.3'
        title: Underwriting view and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The underwriting problem is therefore not whether Startorus can attract capital, but whether outside
              investors can judge revenue quality and cash durability from public evidence. Startorus argues its
              magnetic-reconnection tokamak design is simpler than mainstream heating systems and should be economically
              competitive, and broader fusion research plus policy support make that narrative plausible enough to
              sustain fundraising. But neither the company nor independent reporting in the assigned source pool
              discloses revenue mix, gross margin, service-delivery cost, customer concentration, backlog,
              project-finance obligations, cash on hand, burn, or runway. The right financial verdict is that Startorus
              currently looks financeable for milestone delivery, not yet underwritable on conventional operating
              metrics. Diligence should therefore focus on realized sales, margin walk, budget-to-milestone planning,
              and round-to-round dependency before anyone treats the current valuation as supported by operating
              performance.
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered system and current asset stack
        blocks:
          - type: paragraph
            body: >-
              Startorus' public product story is a sequence of experimental and pre-commercial reactor assets rather
              than a deployed customer-facing power product today. Dealroom and the company's own technical materials
              describe a pathway from the operating SUNIST-2 platform, through the NTST device now under assembly,
              toward CTRFR-1 as the next high-temperature-superconducting scale-up. That is meaningful technical
              progress, but it also means maturity should be judged by subsystem qualification and first-plasma
              milestones instead of revenue-grade deployment, uptime, or customer adoption metrics.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE012
