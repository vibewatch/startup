      - number: '2.3'
        title: Government-backed sponsors and research buyers dominate the current adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is also staged. The strongest evidence points to municipal and state-backed
              industrial-policy sponsors funding facilities, ecosystem formation, and early reactor programs in
              Shanghai, while research institutions and industrial users buy nearer-term enabling hardware such as
              diagnostics, power-control equipment, and HTS-related systems. That is materially different from having
              named future electricity off-takers. Startorus' official surfaces listing Jiading and Xi'an addresses
              reinforce that the company is embedding itself in a Chinese engineering-and-policy cluster, but the
              publicly evidenced budget owners today are still governments, strategic investors, and technical buyers
              rather than utilities signing power contracts.
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: Commercial-power TAM remains speculative until technical and demand gates clear
        blocks:
          - type: paragraph
            body: >-
              The adoption upside is real, but the constraints are equally clear in the same record. DOE's roadmap
              emphasizes unresolved materials, infrastructure, workforce, and commercialization gaps; Startorus' own
              technical thesis argues lower complexity and operating difficulty, but that is not the same as proven
              reactor economics. Independent reporting still describes commercial viability as years away, and the
              retained public evidence does not identify named utilities, industrial heat buyers, or offtake structures
              that would let an investor convert long-term fusion ambition into a defendable SAM or SOM. For valuation
              work, this means the company can be benchmarked today on financing access, cluster support, equipment
              sales, and milestone delivery, while the future power market remains a diligence item rather than a
              bankable revenue pool.
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
