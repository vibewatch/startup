  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Publicly observed value flow runs from state-backed equity into engineering assets, with only limited side-product
      commercialization before any future pilot-power revenue.
    data:
      nodes:
        - id: equity
          label: State-led equity capital
          detail: RMB 1bn Series A announced in Jan 2026; broader disclosed funding exceeds RMB 1.5bn.
        - id: device
          label: Next-generation fusion device build
          detail: Round proceeds are earmarked for the next-generation device and related engineering base.
        - id: subsystems
          label: Subsystem and magnet development
          detail: HTS magnets, plasma control, and related reactor subsystems absorb capital before plant revenue exists.
        - id: side-products
          label: Interim hardware commercialization
          detail: Company-disclosed deliveries include hundreds of amplifiers/integrators plus HTS and plasma systems.
        - id: verification
          label: Engineering verification milestone
          detail: Independent reporting places verification around 2028 rather than today.
        - id: pilot
          label: Future pilot electricity revenue
          detail: Commercial power output is a 2032 target with no public offtake economics disclosed.
      edges:
        - from: equity
          to: device
          label: funds capex and R&D
        - from: device
          to: subsystems
          label: drives engineering workstreams
        - from: subsystems
          to: side-products
          label: creates sellable interim outputs
        - from: subsystems
          to: verification
          label: must reach technical proof
        - from: verification
          to: pilot
          label: precondition for power sales
    approximationNotes: >-
      The figure is a public-evidence process map, not a quantified waterfall; it separates disclosed milestones from
      undisclosed pricing, margin, and cash-flow values.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public architecture layers move from reconnection-based plasma physics, to current devices, to enabling
      subsystems, and then to a future HTS demonstration path.
    data:
      layers:
        - label: Physics approach
          items:
            - Magnetic reconnection heating
          modules:
            - Multiple poloidal field coils induce two plasma rings
            - Ring merging heats the primary plasma
          outputs:
            - Claimed simpler heating path than large auxiliary beam or millimeter-wave systems
        - label: Current devices
          items:
            - SUNIST-2
            - NTST
          modules:
            - SUNIST-2 has been used for startup and controls validation
            - NTST is the negative-triangularity machine now under assembly
          outputs:
            - Experimental bridge from present physics work to first-plasma execution
        - label: Enabling subsystems
          items:
            - TF coils and PF coil set
            - Pulse-power system
            - 77 K cooling infrastructure
            - Real-time control suite
            - 1 MW neutral beam under joint development
          modules:
            - Coil qualification and cryogenic acceptance testing
            - Batch-produced modular power supplies and commissioned TF power system
          outputs:
            - Subsystem readiness evidence without full integrated-reactor proof
        - label: Experimental facilities
          items:
            - Shanghai Jiading site
            - Xi'an site
          modules:
            - Jiading facility broke ground in April 2026
            - Official pages list both operating addresses
          outputs:
            - Distributed footprint with still-undisclosed site-level responsibilities
        - label: Scale-up path
          items:
            - CTRFR-1
          modules:
            - Next-step HTS spherical tokamak
            - Public target of Q ~ 1
          outputs:
            - Future engineering-validation and demonstration-plant bridge
        - label: Commercialization proof layer
          items:
            - Customer and licensing evidence
          modules:
            - Power buyers, safety documentation, and plant economics remain largely private
          outputs:
            - Main gap between technical momentum and investable product readiness
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE012
