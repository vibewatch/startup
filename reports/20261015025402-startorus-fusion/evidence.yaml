evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Current cap table, investor rights, liquidation preferences, anti-dilution terms, and any debt or grant layers
      behind the 2026 rounds.
    whyItMatters: >-
      Headline funding and valuation do not reveal control rights, dilution risk, or true downside protection for new
      investors.
    diligencePath: Request the latest financing documents, cap table, and board-consent package from management or lead investors.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Revenue run-rate, gross margin, customer count, backlog, and concentration for the electronics or subsystem
      business.
    whyItMatters: >-
      Later valuation work cannot distinguish genuine early commercialization from pilot-only activity without hard
      commercial metrics.
    diligencePath: Request a monthly revenue bridge, top-customer list, booked orders, and product-level gross-margin detail.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Full board composition, independent directors or observers, and formal governance committees or reserved-matter
      controls.
    whyItMatters: The public story is highly founder-centric, so governance depth and investor oversight remain unclear.
    diligencePath: Obtain the current board list, governance charter, and reserved-matters schedule from company counsel.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: technical-proof
    missingEvidence: >-
      Independent reactor-grade performance evidence, including confinement, heat-load, or economics data beyond company
      roadmaps and milestone announcements.
    whyItMatters: Engineering milestones alone do not prove that the roadmap can translate into commercially viable fusion power.
    diligencePath: >-
      Request third-party technical reviews, peer-reviewed performance disclosures, and milestone test packages for
      SUNIST-2, NTST, and CTRFR-1.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: A public TAM, SAM, or bottom-up deployment model for Startorus' target geographies, segments, and units of demand.
    whyItMatters: >-
      Without a methodology-backed market model, valuation arguments rely on capital formation and milestone progress
      instead of demand depth.
    diligencePath: >-
      Request management's market model, segment assumptions, and deployment scenarios, then reconcile them against
      grid, industrial-heat, maritime, and research-tooling use cases by geography.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: future-buyers
    missingEvidence: >-
      Named utilities, industrial-heat counterparties, memoranda of understanding, or other disclosed offtake evidence
      for future reactor output.
    whyItMatters: >-
      Buyer proof determines whether future power or heat revenue belongs in a defendable SAM or SOM instead of a
      speculative long-term TAM.
    diligencePath: >-
      Request pipeline data, pilot counterparties, letters of intent, and any power-purchase or industrial-heat design
      partners tied to NTST or CTRFR-1.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: china-regulatory-path
    missingEvidence: >-
      A China-specific licensing, tritium, fuel-cycle, and activated-material-disposal workplan for commercial
      spherical-tokamak deployment.
    whyItMatters: >-
      Regulatory timing governs when the opportunity can move from research budgets and industrial-policy support into
      power-plant capex.
    diligencePath: >-
      Collect regulator correspondence, site-permit milestones, and specialist legal or policy analysis on fusion
      licensing in China.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: pricing / packaging comparison
    missingEvidence: >-
      Public price sheets, contract templates, milestone-payment structures, or named commercial buyers for Startorus
      and the peer reactor programs.
    whyItMatters: >-
      Without commercial terms, the chapter cannot prove GTM quality, discount discipline, or whether buyers face real
      switching costs.
    diligencePath: >-
      Request current proposals, term sheets, or buyer references for reactor access, subsystem sales, and any pilot or
      offtake agreements.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching cost and buyer lock-in
    missingEvidence: >-
      Named procurement criteria, retention data, pilot-to-contract conversions, or buyer interviews showing why a lab
      or utility would pick Startorus over peers.
    whyItMatters: >-
      The current moat case relies on technical differentiation, not on demonstrated commercial lock-in or multiyear
      buyer commitment.
    diligencePath: >-
      Obtain customer references, pilot conversion histories, procurement scorecards, and any signed development or
      power-sale agreements.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: enumeration-incomplete
    severity: material
    topic: competitor profile table landscape coverage
    missingEvidence: >-
      Comparable public profiles for NovaFusionX and additional Chinese or overseas private fusion entrants that would
      let the landscape move beyond a partial assigned-pool sample.
    whyItMatters: >-
      Thin peer detail can overstate Startorus's apparent edge simply because the evidence set is richer for Startorus
      than for some competitors.
    diligencePath: >-
      Expand the peer set with comparable public profile pages, fundraising disclosures, and technical milestone
      summaries for each named rival.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
