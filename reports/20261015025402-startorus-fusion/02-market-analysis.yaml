  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: A public TAM, SAM, or bottom-up deployment model for Startorus' target geographies, segments, and units of demand.
    whyItMatters: Without a methodology-backed market model, valuation arguments rely on capital formation and milestone progress instead of demand depth.
    diligencePath: Request management's market model, segment assumptions, and deployment scenarios, then reconcile them against grid, industrial-heat, maritime, and research-tooling use cases by geography.
    relatedQuestionRefs:
    - QM002
    - QM009
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: future-buyers
    missingEvidence: Named utilities, industrial-heat counterparties, memoranda of understanding, or other disclosed offtake evidence for future reactor output.
    whyItMatters: Buyer proof determines whether future power or heat revenue belongs in a defendable SAM or SOM instead of a speculative long-term TAM.
    diligencePath: Request pipeline data, pilot counterparties, letters of intent, and any power-purchase or industrial-heat design partners tied to NTST or CTRFR-1.
    relatedQuestionRefs:
    - QM003
    - QM009
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: china-regulatory-path
    missingEvidence: A China-specific licensing, tritium, fuel-cycle, and activated-material-disposal workplan for commercial spherical-tokamak deployment.
    whyItMatters: Regulatory timing governs when the opportunity can move from research budgets and industrial-policy support into power-plant capex.
    diligencePath: Collect regulator correspondence, site-permit milestones, and specialist legal or policy analysis on fusion licensing in China.
