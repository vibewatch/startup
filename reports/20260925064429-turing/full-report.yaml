              - CU013
          - type: callout
            title: Diverse Enterprise Customer Anchor
            body: >-
              Beyond frontier lab services, Turing maintains an enterprise baseline spanning over 1,000 corporate
              clients, 200 VC-backed startups, and verified Fortune 500 deployments such as Johnson & Johnson, Coinbase,
              and Dell, supported by an aggregate 4.8 out of 5.0 reference rating across 248 customer profiles.
            calloutType: strength
            claimRefs:
