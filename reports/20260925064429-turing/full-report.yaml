              - CU004
      - number: '6.2'
        title: Adoption Trajectory and Revenue Run-Rate Scale
        blocks:
          - type: paragraph
            body: >-
              Turing's adoption trajectory reflects substantial top-line momentum, with annualized revenue run-rate
              expanding to an estimated $300 million at the end of 2024, representing 150% year-over-year expansion.
              This growth has been catalyzed by the supply of high-token software engineering datasets to AI developers
              alongside steady enterprise demand. Underpinning this customer traction is a global network of over 4
              million vetted software engineers across 140 countries, evaluated via standardized coding assessments and
              calibrated technical surveys. Historical customer durability has been publicized at up to 97% engagement
              retention for remote talent placements, supporting the company's valuation milestone of $2.2 billion
              achieved during its March 2025 Series E financing round.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
          - type: table
