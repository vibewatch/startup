              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named Customer Proof, Deployments, and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Verified customer deployments demonstrate meaningful penetration across Fortune 500 enterprises,
              high-growth technology unicorns, and institutional software teams. Documented enterprise references
              include healthcare conglomerate Johnson & Johnson, cryptocurrency exchange Coinbase, electric vehicle
              manufacturer Rivian, and technology multinational Dell. In published case studies, a global fintech
              platform client registered a 6X increase in user adoption, a 50% decrease in registration drop-offs, and a
              35% gain in transaction throughput following Turing Intelligence workflow and digital wallet integration.
              Across third-party review repositories including Featured Customers, Turing sustains an aggregate
              reference rating of 4.8 out of 5.0 across 248 customer reference profiles, although contractual values and
              renewal cohorts remain privately held.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Customer Journey Dynamics and Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              The enterprise customer journey begins with low-friction algorithmic sourcing and a standard three-week
              risk-free trial, allowing engineering hiring managers to evaluate talent fit before entering long-term
              operational commitments. Successful initial placements routinely expand into multi-engineer technical pods
              and specialized vertical AI systems delivered through Turing Intelligence. However, the commercial
              velocity driven by frontier AI lab engagements creates acute customer concentration risk. Because a
              substantial share of incremental ARR stems from a concentrated cohort of foundation model creators, any
              internal development of synthetic code generation datasets by labs or deceleration in frontier training
              expenditure presents downside exposure to Turing's expansion trajectory.
            claimRefs:
              - CU011
              - CU013
              - CU015
          - type: figure
