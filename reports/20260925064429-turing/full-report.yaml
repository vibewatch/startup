            title: Frontier Lab Revenue Concentration
            body: >-
              While Turing's expansion into AI model training data has propelled revenue run-rates to approximately $300
              million, the concentration of high-growth billings within a small circle of frontier AI labs (including
              OpenAI) presents significant vulnerability if foundation model developers internalize evaluation workflows
              or curtail third-party dataset expenditures.
            calloutType: risk
            claimRefs:
