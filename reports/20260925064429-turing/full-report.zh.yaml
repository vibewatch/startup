  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与资本化背景
        blocks:
          - type: paragraph
            body: >-
              从远程开发者招募平台蜕变为关键的 AI 工程与后训练数据伙伴，彻底改写了 Turing 的估值轨迹。2025 年 3 月，公司以 $2.2 billion 投后估值完成 $111 million Series E
              轮融资，由领投方 Khazanah Nasional Berhad 联手老股东 WestBridge Capital 共同注资。历经数次有定价的股权融资，其累计风险资本融资额达 $225 million 至
              $247 million，与其逾 4 million 注册软件工程师的活跃人才库协同做大。年化 ARR 总量跃升至约 $300 million，且在该轮融资前已保持连续约 12
              个月的经营性盈利。从资本结构来看，Series E-1 优先股附带干净的 1.0x 非参与型清算优先权，发行价为每股 $7.60，确立了优先受偿的结构性保障，且无沉重的倍数附带包袱。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
