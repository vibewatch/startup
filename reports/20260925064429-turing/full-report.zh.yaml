      - number: '8.3'
        title: 可比估值倍数与对标分析
        blocks:
          - type: paragraph
            body: >-
              Turing 在 Series E 轮体现出的 7.3x ARR 隐含估值倍数，反映了其介于传统 IT 服务商与纯生成式 AI 软件平台之间的独特定位。传统数字工程与 IT 外包可比标的交易价格多在 2.0x 至
              3.5x 远期收入区间；AI 基础设施与专业模型数据服务凭借较高毛利、深度嵌入前沿实验室训练流程，获得显著溢价。私募市场对标数据显示，Turing 曾在一轮未公开融资中触及 $4.0 billion
              的阶段性估值高点，之后在 Series E 轮回调至 $2.2 billion。估值回调让入场定价更有纪律，也为前沿 AI 服务公司走向 IPO 时维持估值倍数留出空间。
            claimRefs:
              - CV001
