              - CV011
      - number: '8.2'
        title: 情景分析与回报分布
        blocks:
          - type: paragraph
            body: >-
              评估 Turing 的风险调整后回报，须同时审视前沿模型后训练服务的爆发性上行空间与大客户集中潜藏的下行脆弱性。绑定 OpenAI 等头部 AI 实验室虽显著拉动了
              ARR，但也令收入稳定性完全暴露在实验室采购策略调整与合成数据替代风险之下。在概率赋予 50% 的基准情景下，ARR 预计按 25% 的年增速提升至 $375 million 并保持盈利，对应 6.0x
              的稳健估值倍数与 $2.25 billion 的企业价值。赋予 25% 概率的乐观情景预计 ARR 按 50% 增速攀至 $450 million，估值倍数拉伸至 9.0x，公司对应估值 $4.05
              billion。相对地，悲观情景计入大单到期不续或实验室收归自研，预计 ARR 萎缩至 $220 million，估值倍数压缩至 3.0x，形成 $660 million 的估值底线。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
