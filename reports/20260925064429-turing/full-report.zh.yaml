        title: 重点图表
        blocks:
          - type: callout
            title: 绑定前沿实验室，拉动高毛利模型训练业务扩张
            body: Turing 从通用型远程开发者外派转向为 OpenAI 等前沿 AI 实验室提供专业后训练数据生成，带动 ARR 迅速扩张至 $300 million，并支撑公司较早实现经营盈利。
            calloutType: strength
