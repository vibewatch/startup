chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业法人、业务版图与战略使命
        blocks:
          - type: paragraph
            body: >-
              Turing Enterprises Inc. 是一家人工智能基础设施与托管人才企业，由斯坦福大学计算机系校友 Jonathan Siddharth 与 Vijay Krishnan 于 2018
              年创立。公司在加利福尼亚州 Palo Alto 与 San Francisco 设立双总部运营中心，命名旨在致敬计算机科学家 Alan Turing，但与英国的 Alan Turing Institute
              完全独立、无隶属关系。Turing 旗下设有两个互补业务部门：Turing AGI Advancement 为前沿 AI 实验室交付强化学习环境与评估数据集；Turing Intelligence 则面向
              Global 2000 企业客户开发并部署特定领域的智能体 AI 工作流。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: 高管领导层、治理架构与关键人结构
        blocks:
          - type: paragraph
            body: >-
              Turing 的高管团队由两位联合创始人领衔；他们曾共同打造 AI 推荐平台 Rover，后将其出售给 Revcontent，随后创办 Turing，解决工程人才自动化筛选难题。首席执行官 Jonathan
              Siddharth 负责整体战略、前沿模型开发商的商业合作及投资方联盟拓展，公司因此对他形成实质性的关键人依赖。联合创始人 Vijay Krishnan 早年主导搭建了支撑 Turing
              自动化技术筛选评估的机器学习基础设施。公司治理则在创始人控制权与早期风投机构、主权机构投资者的董事会监督之间寻求平衡。
            claimRefs:
              - CO001
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
              - CO006
      - number: '1.3'
        title: 资本历史、估值演进与股东银团
        blocks:
          - type: paragraph
            body: >-
              Turing 成立至今已完成 5 轮机构股权融资，累计募集 $225 million 一级市场股权融资。早期扩张资金来自种子轮，以及由 WestBridge Capital 领投、Foundation
              Capital 参投的 $32 million Series B 轮；2021 年 12 月，公司在估值 $1.1 billion 的 Series D 轮中跻身独角兽行列。2025 年 3 月，Turing
              完成由马来西亚主权财富基金 Khazanah Nasional Berhad 领投的 $111 million Series E 轮融资，投后估值翻倍至 $2.2 billion。股东银团囊括
              Foundation Capital、AltaIR Capital、Sozo Ventures、Amino Capital 以及 Plug and Play 等知名跨阶段投资机构。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO012
              - CO013
      - number: '1.4'
        title: 运营里程碑、收入规模与集中度逆风
        blocks:
          - type: paragraph
            body: >-
              2022 年，OpenAI 与 Turing 签约采购代码生成数据集，用于训练早期推理模型，成为公司的关键运营转折点。Turing 借助逾 4 million 名全球注册开发者，成为
              OpenAI、Anthropic、Google 和 Meta 的主要数据供应商；截至 2024 年底，年化收入运行率增至约 $300
              million，并达到经营性盈利。独立研究同时指出，公司客户高度集中于少数前沿实验室，且随着智能体代码生成日趋成熟，传统工程席位需求面临潜在长期收缩风险。
            claimRefs:
              - CO010
              - CO011
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO008
              - CO010
              - CO013
              - CO014
