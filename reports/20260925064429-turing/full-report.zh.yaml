      - number: '8.4'
        title: 投资建议评级与尽调路线图
        blocks:
          - type: paragraph
            body: >-
              综合考量运营规模、经审计的盈利能力与审慎的资本结构，给出「买入」评级，置信度为「中」，风险评级为「中」。$300 million 的 ARR
              体量、已验证的正向经营现金流以及清算优先权，为抵御市场波动提供了扎实的安全边际。然而，核心客户合同、留存指标与老股成交规模仍未公开，投资判断的置信度因此仅为「中」。审慎的投资策略应为潜在股权投资设置里程碑分批出资条款和下行保护，而不是
              在 Series E 轮价位之上盲目追高老股。投资者须开展严格的确认性尽调，重点核实前五大客户收入集中度、人才网络的单位贡献毛利率以及长期模型训练服务协议。
