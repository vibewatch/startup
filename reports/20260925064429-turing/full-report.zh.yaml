      - number: '7.3'
        title: 合作伙伴集中度与财务依赖
        blocks:
          - type: paragraph
            body: >-
              截至 2024 年底，Turing 的 ARR 迅猛攀升至约 $300 million，主引擎是 OpenAI 及少数紧密合作的前沿 AI 实验室抛出的天量后训练代码数据与模型评估大单。这一跃升虽促成了估值
              $2.2 billion 的 $111 million Series E 轮融资，却也加剧了交易对手集中风险。前沿实验室若将人工数据整理收归内部、压低价格，或转向自动生成合成代码，都可能直接冲击 Turing
              的核心营收来源。
            claimRefs:
