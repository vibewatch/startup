          detail: 客户门户、岗位需求解析，以及面向企业的用人需求界定界面。
        - label: AI 智能匹配与技术甄别引擎
          detail: 算法简历初筛、57 道标定问题问卷，以及自动化技术能力评测。
        - label: 前沿 AI 与数据生成平台
          detail: Turing AGI Advancement 产线为前沿 LLM 实验室生成代码 token、STEM 领域数据并执行 RLHF 评估。
        - label: 企业级解决方案与智能体系统
          detail: Turing Intelligence 垂直产品矩阵，涵盖 Graph-RAG 架构及智能核保自动化。
        - label: 执行环境与 CI/CD 基础设施
          detail: AWS 云托管、CloudBees Jenkins CI/CD 自动化流水线，以及 Kubernetes 容器化环境。
        - label: 全球劳动力与团队协同运营层
          detail: 自动化工时追踪、虚拟每日站会工具，并集成 Truv 就业核验服务。
    approximationNotes: 各层边界划分代表功能抽象，综合自公开招聘岗位说明与技术架构公开报告。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE008
      - CE010
      - CE013
  - id: FU001
    title: 客户生命周期旅程图
    type: journey-map
    summary: 呈现客户从企业技术人才采购、定制 AI 方案落地，延伸至前沿实验室数据战略合作的生命周期路径。
    approximationNotes: 勾勒客户从最初的人才寻访试用，逐步升级为规模化 AI 基础设施战略伙伴的标准演进路径。
    data:
      items:
        - label: 1. 甄别与寻访
          detail: 依托 57 道标定题自动测评候选人，算法在 4 天内完成匹配。
          tone: neutral
        - label: 2. 零风险试用
          detail: 提供为期 3 周的零风险试用期，供客户在正式签署合同前考察工程师契合度。
          tone: positive
        - label: 3. 嵌入日常工作流
          detail: 借助自动化站会、工时追踪和跨时区管理工具完成团队交付部署。
          tone: positive
        - label: 4. 客户账户增购拓展
          detail: 从单一开发者外派，扩展为跨多个业务部门交付全功能工程团队。
          tone: positive
        - label: 5. 前沿实验室数据供给
          detail: 签署战略项目合同，为基础大模型提供专业的复杂推理与代码生成训练数据。
          tone: opportunity
        - label: 6. 生产级 AI 解决方案交付
          detail: 植入 Turing Intelligence 专属团队，交付定制垂直 AI 系统（如 Graph-RAG、自动化核保）。
          tone: positive
    claimRefs:
      - CU011
      - CU012
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 从发生概率、潜在影响及缓释成熟度三个维度，评估主要战略与运营方向的剩余风险敞口。
    data:
      columns:
        - 低概率
        - 中等概率
        - 高概率
      rows:
        - label: 合作伙伴集中度（前沿实验室）
          values:
            - label: 剩余风险低
              tone: positive
            - label: 剩余风险中等
              tone: neutral
            - label: 实验室将数据整理收归内部或转向合成代码，带来重大风险
              tone: risk
        - label: 监管合规与承包商用工性质认定
          values:
            - label: 剩余风险低
              tone: positive
            - label: 零工经济用工法规判例持续演进，构成实质性风险敞口
              tone: warning
            - label: 严重风险敞口
              tone: risk
        - label: 企业级 AI 扩展性与多租户架构
          values:
            - label: 剩余风险低
              tone: positive
            - label: 规模化推进中面临中等延迟及数据驻留摩擦
              tone: neutral
            - label: 高延迟风险敞口
              tone: warning
        - label: 商业化推进冲突（实验室 vs 企业客户）
          values:
            - label: 剩余风险低
              tone: positive
            - label: 人力外包与 SaaS 利润率模型之间存在协同摩擦
              tone: warning
            - label: 严重的执行冲突
              tone: risk
        - label: 实体歧义与商标冲突
          values:
            - label: 影响微弱
              tone: positive
            - label: 与其他以 Turing 命名的实体存在轻度品牌混淆
              tone: neutral
            - label: 高混淆风险敞口
              tone: neutral
        - label: 开发者筛选把关与质量漂移
          values:
            - label: 依靠自动化测试流水线与评分体系可控
              tone: positive
            - label: 小众细分技术领域的代码质量存在中度漂移
              tone: neutral
            - label: 系统性质量崩盘
              tone: risk
    approximationNotes: 发生概率与严重程度分类属于定性尽调研判，综合考量了截至 2026 年已披露的客户集中度、行业情报及监管先例。
    claimRefs:
      - CR001
      - CR004
      - CR011
      - CR014
  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 将 Turing 的业务规模、财务表现、客户集中度风险和估值与投资建议串联起来。
    data:
      nodes:
        - id: scale
          label: 市场规模与人才储备
          detail: 汇聚 4M+ 经验证工程师，在前沿 LLM 实验室中扮演核心代码生成角色
          tone: positive
        - id: financials
          label: 财务执行与体量规模
          detail: ARR 运行率达 $300M，并已连续经营盈利约一年
          tone: positive
        - id: concentration
          label: 客户集中度风险
          detail: 高度依赖 OpenAI 及前沿实验室的模型训练支出，引入业绩波动风险
          tone: warning
        - id: valuation
          label: 估值纪律要求
          detail: $2.2B Series E 估值对应 7.3x 收入倍数，附带 1.0x 非参与型清算优先权，定价趋于合理
          tone: neutral
        - id: downside
          label: 下行估值底部
          detail: 盈利的核心业务支撑悲观情景估值底部为 $660M（3.0x 倍数）
          tone: adverse
        - id: milestones
          label: 投资前尽调要求
          detail: 在出资前，须核实客户合同核心条款及老股交易价格的稳定性
          tone: neutral
        - id: decision
          label: 最终投资建议：买入
          detail: 维持中等风险评级，严格控制估值纪律，并依据里程碑达成情况分批建仓
          tone: positive
      edges:
        - from: scale
          to: financials
          label: 驱动 ARR 增长
        - from: financials
          to: concentration
          label: 受客户集中度风险抵消
        - from: concentration
          to: valuation
          label: 已计入估值倍数
        - from: valuation
          to: downside
          label: 封堵倍数下行敞口
        - from: downside
          to: milestones
          label: 须经合同核实
        - from: milestones
          to: decision
          label: 支撑投资立场
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV012
      - CV014
