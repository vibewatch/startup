evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: internal-headcount-breakdown
    missingEvidence: >-
      Audited corporate headcount disclosures separating internal full-time employees by engineering, sales, and
      operations from active contractor counts.
    whyItMatters: >-
      Public figures cite 4M+ network members and hundreds of internal staff without disaggregating fixed payroll
      burdens or contractor gross margins.
    diligencePath: Request confidential employee census and departmental organizational charts in commercial diligence data room.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: frontier-lab-revenue-concentration
    missingEvidence: >-
      Customer concentration schedule showing annual revenue contribution percentages from top foundational AI accounts
      including OpenAI, Google, Anthropic, and Meta.
    whyItMatters: >-
      Rapid growth to $300M ARR is substantially tied to frontier lab post-training budgets, making the business
      vulnerable to customer in-sourcing.
    diligencePath: Inspect top-ten customer billing schedules, contract renewal terms, and customer concentration tables under NDA.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: Revenue breakdown by business line and lab customer concentration
    missingEvidence: >-
      Audited financial breakdown of Turing's $300M ARR between legacy developer placement, frontier lab post-training
      contracts, and enterprise deployment services.
    whyItMatters: >-
