callouts:
- calloutType: risk
  title: Compute Capital Intensity Threatens Core Software Gross Margins
  body: Unlike traditional SaaS applications with 75% to 80% gross margins, generative multimodal video creation requires continuous, high-latency GPU inference cycles that consume substantial compute resources per user session. Without proprietary hardware efficiencies or heavily subsidized inference infrastructure, scaling platform activity risks eroding unit economics and compressing realized gross margins.
  claimRefs:
  - CI004
  - CI005
  - CI014
- calloutType: insight
  title: Sovereign Compute Partnerships as Working Capital Substitutes
  body: Luma AI's strategic alignment with HUMAIN and access to the planned 2-gigawatt Project Halo supercluster in Saudi Arabia represents an alternative financing mechanism that offsets direct balance-sheet infrastructure expenditure. By coupling $900 million in equity capital with sovereign compute deployment, the company defers near-term infrastructure cash outflows while securing frontier training capacity.
  claimRefs:
  - CI006
  - CI010
  - CI011
