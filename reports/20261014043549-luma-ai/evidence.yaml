evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-revenue
    missingEvidence: Audited financial statements, verifiable GAAP revenue, gross margin breakdown, and monthly cash burn rate.
    whyItMatters: >-
      Luma AI carries a reported $4B private valuation supported primarily by a sovereign-backed funding round, but
      public revenue disclosures are limited to third-party estimates such as Sacra's $8M ARR estimate.
    diligencePath: >-
      Request board-approved financial decks, audited income statements, and customer cohort billings data under NDA
      during formal investment due diligence.
    relatedQuestionRefs:
      - QO006
  - type: conflicting-data
    severity: minor
    topic: workforce-headcount-discrepancy
    missingEvidence: >-
      Reconciliation of total full-time headcount between directory records (11-50 employees on FundedIQ vs 478 on
      Tracxn).
    whyItMatters: >-
      Headcount divergence obscures true fixed operating burn, organizational maturity, and productivity per employee as
      the company scales across the US and Europe.
    diligencePath: >-
      Verify payroll census, organizational chart, and active LinkedIn employment counts directly with human resources
      during diligence.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: stakeholder-map-and-supercluster-terms
    missingEvidence: >-
      Full contractual terms of the HUMAIN investment agreement, Project Halo compute pricing, and cap table liquidation
      preference breakdown.
    whyItMatters: >-
      HUMAIN's $900M investment and 2GW supercluster partnership create significant sovereign dependency and potential
      governance control asymmetries that could impact minority shareholders.
    diligencePath: >-
      Review the Series C stock purchase agreement, investor rights agreement, and compute off-take contract during
      legal diligence.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-segment-sizing
    missingEvidence: >-
      Audited breakdown of Luma AI's recurring subscription revenue, enterprise API consumption fees, and regional
      contract commitments.
    whyItMatters: >-
      Without segmented customer billings or paid conversion rates, bottom-up addressable market capture and unit
      economics cannot be independently verified from public evidence alone.
    diligencePath: >-
      Request management presentation of MRR/ARR split across Plus/Pro/Ultra tiers versus enterprise API consumption and
      sovereign project allocations.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-terms
    missingEvidence: >-
      Audited enterprise customer retention figures, multi-year minimum spend commitments, and enterprise switching
      costs for studio customers.
    whyItMatters: >-
      Without contractual visibility, enterprise lock-in cannot be verified against multi-homing studio behaviors across
      competing model APIs.
    diligencePath: Review anonymized enterprise MSA contracts and customer churn data during confirmatory diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-arr
    missingEvidence: >-
      Audited financial statements, ARR run-rate, quarterly revenue breakdown by customer tier, and historical revenue
      growth rates.
    whyItMatters: >-
      Without certified revenue and growth figures, underwriting the company's $4 billion Series C valuation multiple is
      impossible from public data alone.
    diligencePath: Request audited income statements and management accounts for fiscal years 2024 through 2026 under NDA.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: compute-unit-economics
    missingEvidence: >-
      Granular cost-of-goods-sold (COGS) data detailing inference cost per video generation, GPU cluster utilization
      efficiency, and server hosting expenses.
    whyItMatters: >-
      Direct inference costs determine whether Luma AI can achieve sustainable gross margins or if high platform volume
      accelerates operating cash burn.
    diligencePath: >-
      Obtain engineering infrastructure spend logs, cloud compute vendor invoices, and unit-level contribution margin
      models.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: humain-agreement-terms
    missingEvidence: >-
      Specific contractual terms of the HUMAIN Series C investment agreement, compute allocation pricing schedules,
      regional exclusivity clauses, and board governance provisions.
    whyItMatters: >-
      Sovereign partnership terms could impose restrictive regional deployment mandates or transfer pricing mechanisms
      that impact forward corporate governance and independent exit optionality.
    diligencePath: >-
      Conduct legal diligence review of the Series C shareholders' agreement, side letters, and Project Halo compute
      service-level agreements.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: inference-cost-and-gross-margins
    missingEvidence: >-
      Audited compute consumption profiles, dedicated GPU server cluster configurations, and per-minute generation cost
      structures across Ray3.2 and UNI-1.1 production API endpoints.
    whyItMatters: >-
      Without verified inference unit economics and compute supply contract terms, long-term gross margin viability and
      enterprise pricing defensibility cannot be confirmed.
    diligencePath: >-
      Request server cost allocation reports, cloud provider master service agreements with AMD and AWS, and internal
      gross margin tracking by customer segment.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
