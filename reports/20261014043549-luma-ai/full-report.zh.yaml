              - CP002
              - CP003
              - CP010
      - number: '3.2'
        title: 模型能力与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Luma 通过专门的架构设计形成生成式产品套件差异化：相比简单的提示词文生视频，更强调电影级物理效果和多关键帧控制。早期扩散模型常出现画面闪烁和角色漂移，Luma 的 Ray
              推理视频系列则通过整体场景理解，保持光照和角色运动的时间连续性。Ray3.14 发布后支持原生 1080p 生成，速度提升四倍，并降低每秒渲染成本。结合用于参考图像生成的 Uni-1
              多模态推理模型，以及公司积累的 3D NeRF 重建经验，Luma 的视觉控制能力明显领先，直接吸引专业级动画和广告工作流。
            claimRefs:
