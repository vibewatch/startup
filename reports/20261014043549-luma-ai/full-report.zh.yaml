            title: 支撑前沿多模态 AI 的一线算力与资本基础
            body: >-
              Luma AI 累计融资超过 $1.06B，并获得 AMD Ventures、Amazon、Andreessen Horowitz 和 HUMAIN
              的战略支持，拥有生成式视频领域资本最充足的资产负债表之一。这些资本支持公司大举训练 Ray3.2 及能够在物理环境中进行推理的世界模型。
            calloutType: strength
