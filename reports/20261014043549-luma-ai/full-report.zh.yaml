  - id: FV001
    title: 多模态估值与建议逻辑流程
    type: flow
    summary: 端到端分析决策链，将技术验证、主权计算、财务不透明和法律敞口连接到最终建议。
    data:
      nodes:
        - id: proof
          label: 多模态规模与采用
          detail: Ray3.2 发布和 30M+ 用户确立前沿产品定位。
        - id: capital
          label: 主权资本注入
          detail: 由 HUMAIN 领投的 $900M C 轮融资及 2GW Project Halo 超级集群协议。
        - id: opacity
          label: 财务披露真空
          detail: 零项公开收入披露；Sacra 估计 ARR 为 $8M（500x 倍数）。
        - id: concentration
          label: 主权集中度
          detail: 超过 80% 的资本和主要计算资源都绑定于沙特 PIF 支持的 HUMAIN。
        - id: legal
          label: 知识产权与版权诉讼
          detail: 工作室摩擦和 Carl Sagan 遗产诉讼凸显法律悬置风险。
        - id: overhang
          label: 估值倍数悬置
          detail: $4B 已确认估值 / $9B 传闻造成严重的下一轮降价融资脆弱性。
        - id: decision
          label: 立场：估值偏高 / 继续研究
          detail: 在经审计的单位经济模型和 NRR 得到核实前，暂缓注入资本。
      edges:
        - from: proof
          to: capital
        - from: capital
          to: opacity
        - from: opacity
          to: concentration
        - from: concentration
          to: legal
        - from: legal
          to: overhang
        - from: overhang
          to: decision
    approximationNotes: 展示决定最终“继续研究”建议的门槛条件的概念性顺序。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
