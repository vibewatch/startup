  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心多模态架构与模型产品
        blocks:
          - type: paragraph
            body: >-
              Luma AI 是前沿多模态人工智能模型开发商，产品面向创意媒体制作，覆盖视频、图像、音频和物理场景模拟。公司当前旗舰视频生成引擎 Ray3.2 于 2026 年 6 月发布，取代 Dream Machine 和
              Ray2 等已弃用架构。Ray3.2 专为电影级和商业制作工作流设计，采用先推理后生成的范式，在渲染像素前规划场景物理、空间一致性和镜头运动。模型支持 16-bit 色彩原生 HDR 视频生成、符合
              ACES2065-1 色彩管理的 EXR 帧序列导出，以及每个镜头最多 16 个关键帧的多关键帧控制。Luma 还提供基于 Unified Intelligence 的多模态图像模型 UNI-1.1，替代已弃用的
              Photon。UNI-1.1 支持空间和常识场景补全，可对最多 9
              张输入图像进行可控的参考引导生成，并在人类偏好的风格、编辑和参考遵循评分中排名靠前。这些基础模型共同推动架构从“输入提示词、输出视频”的生成器转向可控视觉合成流水线。
