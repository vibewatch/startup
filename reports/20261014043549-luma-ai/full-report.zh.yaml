      - number: '1.3'
        title: 风险资本化、主权支持与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Luma AI 在五轮独立风险融资中累计融资超过 $1.06 billion：从 2021 年 10 月的 $4.3 million 种子轮，发展到 Andreessen Horowitz 领投的 2024 年
              1 月 $43 million B 轮。2025 年 11 月，公司完成由 HUMAIN 领投的 $900 million C 轮融资。HUMAIN 是由沙特阿拉伯公共投资基金支持的人工智能投资平台，使 Luma
              AI 投后估值超过 $4.0 billion。战略投资者包括 AMD Ventures，以及既有投资方 Andreessen Horowitz、Amplify Partners 和 Matrix
              Partners；Amazon 和 AWS 也曾于 2024 年末参与投资。作为 C 轮协议的核心内容，Luma AI 成为 Project Halo 的锚定客户并建立研究合作。Project Halo
              是计划在沙特建设的 2-gigawatt AI 超算集群，目标是用全球数据集中的数万亿 tokens 训练多模态世界模型。
            claimRefs:
