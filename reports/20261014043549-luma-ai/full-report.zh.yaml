      - number: '2.4'
        title: 增长驱动、资本密集度与采用瓶颈
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的商业扩张受结构性顺风推动，却同时受到严重资本密集度和法律约束的限制。首要增长动力是数字广告、社交媒体平台和沉浸式互动媒体对视频内容的指数级需求。Ray3.2
              等模型让制作团队能以精细的镜头控制生成可直接播出的成片，大幅压低预可视化成本。但市场采用也面临明显障碍。第一是算力资本密集度：训练能理解物理空间动态的前沿多模态“世界模型”，需要拍字节级算力基础设施。Luma 与
              HUMAIN 合作接入沙特计划中的 2-gigawatt Project Halo 超算集群，正说明与 Google、OpenAI
              等超大规模云厂商竞争所需的巨大规模。第二是商业企业部署受法律和知识产权因素把关。Luma
              服务条款要求用户授予输入数据处理的广泛许可，并明确免除其对第三方工具和高风险应用的责任。大型企业品牌在把生成式模型接入商业播出资产前，往往要求全面的版权侵权赔偿保障，导致采购摩擦，拖慢从实验性试点到企业规模合同承诺的转变。
            claimRefs:
              - CM004
              - CM006
              - CM011
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 宏观 TAM 预测与工作室近期制作预算脱节
            body: >-
              宏观预测认为未来十年生成式 AI 支出将超过 $1.3 trillion，但 Luma AI
              近期可触达收入受现有工作室制作和营销软件预算（$8B–$15B）限制。企业创意团队采用产品，需要与非线性编辑器集成、严格的色彩管理（ACES/HDR）以及版权侵权赔偿保障，而不是单纯的提示词文生视频。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM013
          - type: callout
            title: 前沿多模态模拟的资本密集度与基础设施依赖
            body: >-
              从文生视频扩展到物理世界模拟（“世界模型”）会带来巨大的算力资本需求。Luma 依赖 HUMAIN 在沙特计划建设的 2-gigawatt Project Halo
              超算集群，正说明了这种依赖；如果没有拍字节级训练算力，想在资本充足的超大规模云厂商（Google Veo、OpenAI Sora）面前维持前沿竞争力，将挑战其独立的利润结构。
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM011
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              生成式视频和创意媒体制作市场已成为拥挤赛道，活跃参与者达数千家。根据 Tracxn 的行业跟踪，Luma AI 与近 5,000 家多模态 AI 和媒体生成领域的活跃竞争者同场竞争，其中包括超过 250
              家获得风险投资的初创公司。主要竞争前沿集中在 Runway 等专业独立研究实验室、OpenAI 和 Google 等基础模型超大规模云厂商，以及快手 Kling
              等激进的国际平台。在这一资本密集型领域竞争需要投入海量算力；Luma 获得九亿美元 C 轮融资，用于建设高吞吐超算集群基础设施，并与资本雄厚的科技巨头持续开展模型研究。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
