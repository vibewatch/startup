chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立历史与核心使命
        blocks:
          - type: paragraph
            body: >-
              Luma AI 由 Amit Jain 和 Alex Yu 于 2021
              年创立，战略使命是开发统一的通用智能，使其能够生成、理解并在物理世界中行动。公司最初在加州帕洛阿尔托开展业务，目前总部位于加州红木城。公司先凭 3D 捕捉和 NeRF 神经渲染工具获得广泛市场认知，随后于
              2024 年年中发布 Dream Machine，率先切入消费级生成式视频。2025 至 2026 年间，Luma AI 将产品架构转向具备推理能力的多模态世界模型：用面向电影级视频生成的 Ray3.2
              和可控图像推理的 UNI-1.1，替代已弃用的旧工具。公司通过网页应用、按积分计费的生产 API，以及与 Forward Deployed Creatives
              合作的定制企业部署服务于创意工作室、广告网络和开发者。
