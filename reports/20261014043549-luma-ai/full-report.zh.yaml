              按报告中的 $4.0B 估值计算，Luma AI 相对于现有商业基准的交易倍数极高，例如 Sacra 对 2024 年末 $8M
              年化收入的估算。投资人押注的是前沿模型研发速度和超算集群规模，而非当前软件现金流，因此必须严格核查企业变现能力。
            calloutType: insight
