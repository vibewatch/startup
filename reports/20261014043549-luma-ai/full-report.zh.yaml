  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Luma AI 所处的生成式媒体和合成视觉内容行业正在快速扩张，公司将边界聚焦在商业级多模态生成和符合物理规律的世界模拟。可触达的媒体市场包括视频生成、写实图像创作和神经 3D
              资产合成等专业软件支出，客户是营销团队、视觉特效（VFX）工作室和数字代理商。通用的纯文本大语言模型软件、广泛的企业 ERP 工具以及实体相机硬件，不属于这一直接类别。在 Ray3.2
              这类前沿生成式视频模型出现前，商业创作者几乎只能依赖现有替代方案：在 Maya、Blender 等软件套件中手工建模，由大量实体制作人员参与实拍商业广告，以及使用传统素材库。OpenAI、Google
              等通用基础模型实验室虽提供文生视频能力，但 Luma AI 试图通过逐帧可控、镜头控制和多资产风格一致性，直接适配工作室制作流程来形成差异化。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与受证据约束的 SOM
        blocks:
          - type: paragraph
            body: >-
              评估 Luma AI 的可触达机会，必须将宏观的自上而下预测，与受证据约束、从下而上的工作室软件预算区分开。行业分析师经常预计，整个企业工作流中的生成式 AI 市场支出在 2020 年代中期将超过 $40
              billion，到 2032 年接近 $1.3 trillion。但把这些自上而下的数字直接套到
              Luma，会高估其近期商业空间。更严谨的、受证据约束的可服务市场（SAM）只计入全球视觉特效、商业广告制作和数字资产创作预算，对应每年 $15 billion 至 $20 billion
              的可触达池子。在此范围内，Luma 的可获取市场（SOM）进一步收窄至 $8 billion 至 $12
              billion，取决于代理商和品牌为生成式资产制作、快速原型和本地化视频变体实际分配的预算。公开基准估值也反映了这一动态：Forge Global 和 CNBC 的私人市场指标显示，Luma 在完成 $900
              million C 轮后投后估值为 $3.85 billion 至 $4.0
              billion。这个估值说明投资人高度看好前沿多模态能力，但若要支撑持续的风险投资回报，必须证明创意团队会把核心制作预算从人工后期制作供应商转向持续购买 AI 模型订阅和 API 积分。
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
