      - number: '4.2'
        title: 单位经济性、算力成本驱动与利润率评估
        blocks:
          - type: paragraph
            body: >-
              由于推理算力强度极高，前沿生成式视频的底层经济性与传统云软件根本不同。生成具备时空一致性的高分辨率多秒视频，需要消耗大量 GPU
              周期，因此每次生成都会触发直接的可变托管和服务器成本。第三方分析认为，文生视频规模化会在平台使用加速时立即造成现金流压力和严重利润率挤压，迫使公司持续投入算力容量。Luma AI 通过与主权支持的 HUMAIN
              合作建设 Project Halo（沙特计划中的 2-gigawatt AI
              超算集群），可以缓解部分资本开支，但单次生成的运营成本仍是拖累综合毛利率的主要因素。高流量激增过去曾造成排队延迟，并迫使公司调整自助生成额度，凸显扩容摩擦仍在持续。更关键的是，Luma AI
              没有披露毛利率、推理单位成本、客户获取成本回收期或免费转付费效率的经审计数据。
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI012
          - type: table
