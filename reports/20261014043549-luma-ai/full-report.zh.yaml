      - number: '1.4'
        title: 运营规模、商业进展与尽调现实
        blocks:
          - type: paragraph
            body: >-
              尽管 Luma AI 获得了 $4.0 billion、位居私人市场估值前十分位的估值，公司仍严格保密 GAAP 收入、毛利率表现、算力支出和现金消耗率。第三方私营市场研究机构 Sacra
              估算，公司在消费级视频工具首次发布后，于 2024 年 12 月实现约 $8 million 的年化收入，说明创作者订阅和开发者 API 使用已开始变现。商业数据库对 Luma AI
              运营团队规模的估算差异极大：FundedIQ 给出的区间为 11–50 人，而 Tracxn 截至 2026 年 8 月报告为 478
              名员工。此外，公司还在应对好莱坞娱乐工作室围绕生成式模型训练数据摄取的持续版权审查和知识产权摩擦。IPO 前平台上的合格二级市场股份仍缺乏流动性，受公司优先购买权限制，并以折价交易，反映出严重的信息不对称。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: Project Halo 的主权集中与地缘政治暴露
            body: >-
              Luma AI 标志性的 $900M C 轮融资主要由 HUMAIN 锚定，后者是由沙特阿拉伯公共投资基金出资的商业实体。这一合作虽然确保公司可通过 Project Halo 获得计划中的 2-gigawatt
              算力，但也使其暴露于地缘政治风险、先进硬件可能受到的出口管制，以及不对称的合作伙伴依赖。
            calloutType: risk
