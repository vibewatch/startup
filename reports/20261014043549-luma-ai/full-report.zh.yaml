      - 核心尽调论点
      - 实证证据基础
      - 改变判断的触发因素
    rows:
      - - 看多投资论点
        - 前沿多模态世界模型和 Ray3.2 打开了面向全球企业广告代理商的可规模化商业视频工作流。
        - 注册用户超过 30M，Publicis 和 Adobe 已有实际部署，并在伦敦启动面向 EMEA 的国际商业业务。
        - 企业 API 采用放缓、失去大型代理商客户，或开源视频模型带来商品化。
      - - 估值怀疑
        - $4B 的私募估值脱离已披露的收入基本面，等于把多年企业执行假设为毫无瑕疵。
        - Sacra 估计 2024 年 12 月年化收入仅为 $8M，对应 500x 的追踪 ARR 倍数。
        - 经核实的经审计披露显示年化经常性收入超过 $80M，毛利率高于 60%。
      - - 计算优势论点
        - 作为 HUMAIN 2GW Project Halo 超级集群的锚定租户，其合作关系锁定了无可匹敌的低成本计算容量。
        - 与 AMD Ventures 和 HUMAIN 联合参与 C 轮投资，从而提前获得大规模区域计算基础设施。
        - Project Halo 完工延迟、美国对先进加速器的出口限制，或不利的计算资费。
      - - 治理与法律反向论点
        - 主权交易对手方高度集中，加上不断增加的知识产权诉讼，构成结构性的退出障碍。
        - Carl Sagan 遗产就未经授权生成声音提起诉讼，同时公司治理高度依赖单一交易对手 PIF。
        - 有利的法律先例确认多模态训练属于合理使用，且计算供应商实现多元化。
    notes: 比较性论点矩阵，对照技术扩展论据与商业、法律及主权集中风险。
