              - CM012
      - number: '2.3'
        title: 买方画像、采购流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的商业采用覆盖四个不同买方层级，每一层都有不同的采购路径、审批标准和预算负责人。漏斗底部是个人创作者、自由职业者和专业消费者，他们通过自助网页界面（app.lumalabs.ai）使用
              Plus、Pro 和 Ultra 订阅，通常直接刷个人或部门信用卡，采购阻力很小。价值链更上游的数字营销代理商（例如与 Publicis Groupe Middle East 和 Serviceplan
              Group 的企业合作）采购企业许可证，以简化多版本广告活动、动态本地化和快速提案可视化。在这些场景中，创意总监和制作负责人希望把交付周期从数周压缩到数小时，推动了采购。VFX 工作室和游戏开发商则通过 Luma
              API 完成技术集成，由工程团队购买用量积分，自动化资产流水线。最后，沙特 HUMAIN 计划等主权和政府基础设施买方，会把战略基础模型能力和区域模型（HUMAIN Create）纳入更广泛的国家 AI
              基础设施和数字经济建设中采购。
            claimRefs:
              - CM002
              - CM005
              - CM009
              - CM012
              - CM013
