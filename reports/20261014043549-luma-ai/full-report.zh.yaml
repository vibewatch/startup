    rows:
      - - 乐观情景（企业前沿）
        - 2028 年企业 ARR 达到 $150M；Ray3.2 和 Luma Agents 抢占大型工作室及广告支出；毛利率稳定在 65%。
        - 按 25x-33x ARR 倍数，估值为 $3.75B - $5.0B，从而支撑 C 轮入场估值并实现强劲 IPO 退出。
        - 合成媒体监管限制；Google Veo 和 OpenAI Sora 引发超大规模科技公司价格战。
        - 20% 概率（需要持续的产品护城河和无瑕疵的国际变现）
      - - 基准情景（市场共存）
        - ARR 稳步增长至 2028 年的 $50M；创意社区使用健康，但企业流失率高；毛利率压缩至 45%。
        - 按正常化的 20x ARR 倍数，估值为 $1.0B，相对 $4.0B 的 C 轮基准估值意味着账面损失 75%。
        - 计算成本通胀；Runway、Kling 和开源模型挤压中端市场。
        - 55% 概率（反映前沿模型通常的商业化轨迹和计算拖累）
      - - 悲观情景（商品化与资金紧缩）
        - 收入停滞在 $25M 以下；庞大的 GPU 推理成本消耗现金；严重的法律负债或合作伙伴关系破裂。
        - $300M - $500M 的困境重组融资或资产出售，导致普通股股权全部归零，并向优先股支付优先回报。
        - 无法筹集后续股权融资；完全依赖 HUMAIN 计算资源；具有破坏性的版权禁令。
        - 25% 概率（显著下行风险由极高资本密度和不透明经济模型驱动）
    notes: 三年情景预测基于估算收入基线、历史软件倍数及 GPU 成本假设建模。
    claimRefs:
      - CV002
      - CV006
      - CV010
      - CV011
      - CV012
