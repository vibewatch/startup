    summary: 多层市场规模金字塔，将广义宏观生成式 AI TAM 与受证据约束的可触达工作室制作层进行对比。
    approximationNotes: 自上而下的层级反映行业宏观预测；自下而上的层级受工作室软件预算分配和按额度计费的 API 定价约束。
    claimRefs:
      - CM003
      - CM004
      - CM010
      - CM011
      - CM012
    data:
      items:
        - label: 宏观生成式 AI 市场 TAM（2032 年 $1.3T）
          value: 1300000
          unit: USD M
          detail: 覆盖所有模态的全球生成式 AI 支出，包括企业软件、硬件和 IT 服务。
        - label: 生成式媒体与视觉内容创作 TAM（$40B–$60B）
          value: 50000
          unit: USD M
          detail: 面向自动化视觉生成、合成媒体和数字 3D 创作软件的可触达市场。
        - label: 专业视频制作与 VFX 软件 SAM（$15B–$20B）
          value: 17500
          unit: USD M
          detail: 专业后期制作、动画、视觉特效和动态商业视频制作工具预算。
        - label: 企业广告与营销活动创作 SOM（$8B–$12B）
          value: 10000
          unit: USD M
          detail: 代理商和品牌的创意资产生成、营销活动本地化以及多版本数字营销制作。
        - label: 直接基础模型创意订阅与 API（$1.5B–$3.0B）
          value: 2250
          unit: USD M
          detail: 直接用于视频 / 图像推理 API tokens 和创作者套餐的即时商业可触达支出。
        - label: 前沿高容量超级集群专用支出（$900M+）
          value: 900
          unit: USD M
          detail: 支撑大规模多模态世界模型的主权 / 合作伙伴基础设施部署承诺。
  - id: FP001
    title: 生成式视频竞争定位图
    type: quadrant
    summary: 在创作控制深度和生态独立性两个维度比较生成式视频供应商的竞争定位。
    data:
      points:
        - label: Luma AI
          x: 8.5
          'y': 8
          note: 创作控制力强，通过原生 Ray 与合作伙伴模型进行混合编排
        - label: Runway
          x: 8
          'y': 7.5
          note: 工作室工具成熟，拥有专用运动控制和 Gen-3 模型谱系
        - label: OpenAI（Sora）
          x: 6.5
          'y': 4
          note: 前沿模型能力与专有生态紧密整合
        - label: Google（Veo）
          x: 7
          'y': 3.5
          note: 深厚的 TPU 基础设施，并通过 Vertex AI 和 YouTube 打包云服务
        - label: Kuaishou（Kling）
          x: 7.5
          'y': 6
          note: 时间维度真实感强，聚焦消费者和移动视频创作者
        - label: 现状（CGI/VFX）
          x: 9
          'y': 9
          note: 手工制作流程控制力最大，但成本和周期时间都很高
    approximationNotes: 序数定位评分（1-10 分制）基于来源记录的创作控制功能和开放生态集成情况。
    claimRefs:
      - CP009
      - CP010
      - CP013
  - id: FI001
    title: 收入模型桥接：客户活动到毛利率
    type: flow
    summary: 展示自助用户、开发者 API 流量和企业伙伴如何转化为收入流，并与计算 COGS 对接。
    approximationNotes: 逻辑工作流模型；运营转化率和准确毛利率属于私人信息，尚未核实。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI010
      - CI014
    data:
      nodes:
        - label: 用户获取与注册
          detail: 通过网页和 iOS 应用提供免费套餐试用，带来初始用户参与。
        - label: 自助订阅升级
          detail: Plus（$9.99/月）、Pro（$29.99/月）和 Ultra（$99.99/月）分级套餐
        - label: 开发者 API 平台（Build）
          detail: 按需付费、按额度计费的图像和视频生成端点
        - label: 企业平台（Scale）
          detail: 专用推理容量、自定义 SLA 和工作室工作流合同
        - label: 毛收入变现与收款
          detail: 直接消费者付款、SaaS 平台收入和企业订单
        - label: 推理与计算基础设施 COGS
          detail: GPU 计算消耗、云基础设施成本以及 Project Halo 数据中心承诺
        - label: 净毛利率与贡献
          detail: 扣除直接推理交付和托管费用后剩余的毛利润
      edges:
        - from: User Acquisition & Sign-Up
          to: Self-Serve Subscription Upgrade
        - from: User Acquisition & Sign-Up
          to: Developer API Platform (Build)
        - from: Self-Serve Subscription Upgrade
          to: Gross Monetization & Collections
        - from: Developer API Platform (Build)
          to: Enterprise Platform (Scale)
        - from: Enterprise Platform (Scale)
          to: Gross Monetization & Collections
        - from: Gross Monetization & Collections
          to: Inference & Compute Infrastructure COGS
        - from: Inference & Compute Infrastructure COGS
          to: Net Gross Margin & Contribution
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈展示 Luma AI 如何从开发者 SDK 和应用工作区，延伸到推理基础模型和分布式主权计算基础设施。
    approximationNotes: 概念性系统架构综合了 Luma 官方文档、开发者接口和基础设施合作申报文件。
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
    data:
      layers:
        - label: 第 1 层：创意应用与工作流层
          detail: Luma Web App（app.lumalabs.ai）、iOS App 和 Luma Agents 支持多步骤并行创意工作流及共享项目状态。
        - label: 第 2 层：开发者平台与工作流集成界面
          detail: 生产级 Luma REST API（Build 与 Scale 套餐）、Python SDK、TypeScript SDK 以及用于管线集成的开源 ComfyUI 自定义节点。
        - label: 第 3 层：推理与多模态编排引擎
          detail: Unified Intelligence 规划器在像素渲染前协调文本、图像、视频和音频合成，并处理空间约束。
        - label: 第 4 层：前沿基础模型层
          detail: Ray3.2 视频生成模型（原生 HDR、ACES EXR 导出、16 个关键帧）和 UNI-1.1 多模态图像推理模型。
        - label: 第 5 层：主权与文化适配界面
          detail: HUMAIN Create 区域 AI 架构训练体现中东文化和语言细微差异的主权阿拉伯语多模态模型。
        - label: 第 6 层：分布式计算与超级集群基础设施
          detail: 沙特阿拉伯的 Project Halo 2GW AI 超级集群、AMD/AWS 计算基础设施以及拍字节级多模态数据管线。
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 公开套餐提供了多个切入和扩张界面，但各界面之间的转化率和留存率尚未披露。
    data:
      items:
        - label: 个人发现
          detail: 个人创作者通过浏览器或 iOS 进入 Luma App。
        - label: 个人付费套餐
          detail: Plus、Pro 和 Ultra 提供自助式付费套餐。
        - label: 团队工作流
          detail: 明确的创意团队使用 Luma App，但席位数和使用时长不可得。
        - label: API Build
          detail: 按使用量计费的 API 访问无需承诺，降低开发者采用门槛。
        - label: API Scale
          detail: 专用容量并承诺吞吐量和延迟，支持更大工作负载。
        - label: 企业部署
          detail: 定制化部署和 Forward Deployed Creatives 面向规模化业务工作流。
    approximationNotes: 有序条目展示可用的商业界面，而非测量得出的漏斗；公开来源未披露转化率或共享总体分母。
    claimRefs:
      - CU001
      - CU002
      - CU016
