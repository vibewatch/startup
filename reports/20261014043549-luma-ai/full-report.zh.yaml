      - number: '1.2'
        title: 高管领导、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Luma AI 由联合创始人兼首席执行官 Amit Jain 领导，他负责整体研发和商业方向，也是公司主权基础设施联盟的主要高管推动者。首席运营官 Caroline Ingeborn
              负责运营执行，统筹公司系统、人才扩张和跨境组织发展。2025 年 12 月，Luma AI 在伦敦设立 EMEA 总部，正式启动国际扩张，由前 Monks 执行副总裁、WPP 高级总监 Jason Day
              负责。公司宣布计划在 2026 年全年于伦敦招聘约 200 个工程、研究和商业合作岗位。联合创始人 Alex Yu 曾在公司早期 3D
              视觉研究中搭建基础架构，但外部数据库越来越多地将其标注为前联合创始人，凸显公司依赖 Amit Jain 维持战略和研发连续性。
