    title: Product architecture map
    type: stack
    summary: Six-tier architectural stack illustrating Luma AI's transition from developer SDKs and application workspaces through reasoning foundation models to distributed sovereign compute infrastructure.
    approximationNotes: Represents conceptual system architecture synthesized from official Luma documentation, developer interfaces, and infrastructure partnership filings.
    claimRefs:
