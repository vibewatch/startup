    data:
      layers:
        - label: 'Tier 1: Creative Application & Workflow Layer'
          detail: Luma Web App (app.lumalabs.ai), iOS App, and Luma Agents supporting multi-step parallel creative workflows and shared project state.
        - label: 'Tier 2: Developer Platform & Workflow Integration Surface'
          detail: Production Luma REST API (Build & Scale tiers), Python SDK, TypeScript SDK, and open-source ComfyUI custom nodes for pipeline integration.
        - label: 'Tier 3: Reasoning & Multimodal Orchestration Engine'
          detail: Unified Intelligence planner coordinating text, image, video, and audio synthesis with spatial constraint solvers before pixel rendering.
        - label: 'Tier 4: Frontier Foundation Model Layer'
          detail: Ray3.2 video generation model (native HDR, ACES EXR export, 16 keyframes) and UNI-1.1 multimodal image reasoning model.
        - label: 'Tier 5: Sovereign & Cultural Adaptation Surface'
          detail: HUMAIN Create regional AI architecture training sovereign Arabic multimodal models reflecting Middle Eastern cultural and linguistic nuances.
        - label: 'Tier 6: Distributed Compute & Supercluster Infrastructure'
          detail: Project Halo 2-gigawatt AI supercluster in Saudi Arabia, AMD/AWS compute infrastructure, and peta-scale multimodal data pipelines.
callouts:
  - calloutType: strength
    title: Native Cinematic Controls and Reasoning-Driven Video Generation
    body: Luma AI's Ray3.2 model differentiates from commodity prompt-to-video tools by introducing architectural features designed for professional VFX workflows, including native HDR rendering in 16-bit color, ACES2065-1 EXR export, and 16-keyframe directional guidance. By decoupling scene reasoning from pixel rendering, the system maintains spatial coherence and facial performance across 20-second sequences.
    claimRefs:
      - CE001
      - CE004
  - calloutType: risk
    title: Sovereign Compute Dependency and Unresolved Copyright Exposure
    body: Luma AI's technical roadmap for multimodal 'World Models' requires training on peta-scale datasets up to 10,000 times larger than text LLMs, creating an acute dependency on HUMAIN's unbuilt 2-gigawatt Project Halo supercluster in Saudi Arabia. Concurrently, entertainment studio copyright scrutiny and historic IP duplication accusations present unresolved legal liabilities for commercial deployment.
    claimRefs:
      - CE010
      - CE015
      - CE016
