      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The packaging implies a plausible expansion path from individual creation to team workflows, then to API
              Scale or custom enterprise deployment. Named production partners and Adobe or AWS distribution could
              broaden usage without requiring every end customer to contract directly with Luma. International
              commercial hiring and planned partnership development across the UK, European Union, and Saudi Arabia also
              indicate a push beyond the United States. However, the public record cannot establish whether these routes
              produce durable revenue. None of the retained sources discloses NRR, GRR, churn, renewal rates, contract
              length, cohort retention, satisfaction, free-to-paid conversion, or top-customer revenue concentration.
              Investor diligence should therefore treat reach and named references as adoption signals, not as evidence
              of recurring economics.
