chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Luma AI was founded in 2021 by Amit Jain and Alex Yu with the strategic mission of developing unified
              general intelligence capable of generating, understanding, and operating within the physical world. While
              originally establishing operations in Palo Alto, California, the company currently maintains its corporate
              headquarters in Redwood City, California. The company initially gained broad market recognition with its
              3D capture and NeRF neural rendering tools before pioneering consumer generative video with the release of
              Dream Machine in mid-2024. Over 2025 and 2026, Luma AI transitioned its product architecture toward
              reasoning multimodal world models, deprecating legacy tools in favor of Ray3.2 for cinematic video
              generation and UNI-1.1 for directable image reasoning. The enterprise serves creative studios, advertising
              networks, and developers through web applications, credit-based production APIs, and custom enterprise
              deployments with Forward Deployed Creatives.
