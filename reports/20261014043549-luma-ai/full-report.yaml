          Model downside protection against down-round repricing, liquidation preference overhang, and regulatory
          shifts.
      - - Valuation Stance
        - stretched
        - Implied multiple of 250x-500x ARR based on estimated $8M-$15M revenue run rate against a $4B valuation.
        - Require substantial revenue traction or significant secondary discounts (>=50%) before participating.
    notes: >-
      Ratings synthesized from verified Series C funding disclosures, Forge Global capitalization data, and third-party
      ARR estimates.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Strategic Perspective
      - Core Diligence Argument
      - Empirical Evidence Base
      - Trigger That Would Change View
    rows:
      - - Bullish Investment Thesis
        - >-
          Frontier multimodal world models and Ray3.2 unlock scalable commercial video workflows across global
          enterprise ad agencies.
        - >-
          Over 30M registered users, active deployments at Publicis and Adobe, and international EMEA commercial launch
          in London.
        - >-
          Slowing enterprise API adoption, loss of major agency accounts, or commoditization by open-source video
          models.
      - - Valuation Skepticism
        - >-
          The $4B private mark is detached from disclosed revenue fundamentals, pricing in flawless multi-year
          enterprise execution.
        - Sacra estimated annualized revenue at only $8M in December 2024, implying a 500x trailing ARR multiple.
        - Verified audited disclosure of annualized recurring revenue exceeding $80M with gross margins above 60%.
      - - Compute Advantage Thesis
        - >-
          Anchor tenant partnership on HUMAIN's 2GW Project Halo supercluster secures unmatched low-cost compute
          capacity.
        - >-
          Series C co-investment with AMD Ventures and HUMAIN, granting early access to massive regional compute
          infrastructure.
        - >-
          Delays in Project Halo completion, US export restrictions on advanced accelerators, or unfavorable compute
          tariffs.
      - - Governance & Legal Anti-Thesis
        - >-
          Heavy sovereign counterparty concentration and mounting intellectual property lawsuits create structural exit
          barriers.
        - >-
          Carl Sagan estate litigation regarding unauthorized voice generation and single-counterparty governance
          dependence on PIF.
        - >-
          Favorable legal precedent establishing fair use for multimodal training and diversification of compute
          providers.
    notes: >-
      Comparative thesis matrix contrasting technical scaling arguments against commercial, legal, and sovereign
      concentration risks.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV012
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Underwriting Scenario
      - Operating Assumptions (2026-2028)
      - Valuation & Multiple Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case (Enterprise Frontier)
        - >-
          Enterprise ARR reaches $150M by 2028; Ray3.2 and Luma Agents capture major studio and ad spend; gross margin
          stabilizes at 65%.
        - >-
          $3.75B - $5.0B valuation based on 25x-33x ARR multiple, justifying the Series C entry mark and enabling strong
          IPO exit.
        - Regulatory limits on synthetic media; hyperscaler pricing wars from Google Veo and OpenAI Sora.
        - 20% probability (requires sustained product moat and flawless international monetization)
      - - Base Case (Market Coexistence)
        - >-
          ARR grows steadily to $50M by 2028; healthy creative community usage but high enterprise churn; gross margin
          compressed to 45%.
        - >-
          $1.0B valuation based on a normalized 20x ARR multiple, implying a 75% paper loss from the $4.0B Series C
          benchmark.
        - Compute cost inflation; mid-tier market crowding from Runway, Kling, and open-source models.
        - 55% probability (reflects typical frontier model commercialization trajectories and compute drag)
      - - Bear Case (Commoditization & Crunch)
        - >-
          Revenue stalls below $25M; massive GPU inference costs consume cash; severe legal liabilities or partner
          fallouts occur.
        - >-
          $300M - $500M distressed recapitalization or asset sale, resulting in full common equity wipeout and senior
          preference payout.
        - Inability to raise follow-on equity; complete reliance on HUMAIN compute; damaging copyright injunctions.
        - 25% probability (significant downside risk driven by extreme capital intensity and opaque economics)
    notes: >-
      Three-year scenario projections modeled against estimated revenue baselines, historical software multiples, and
      GPU cost assumptions.
    claimRefs:
      - CV002
      - CV006
      - CV010
      - CV011
      - CV012
