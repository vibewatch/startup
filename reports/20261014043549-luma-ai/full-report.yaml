          detail: >-
            Luma Web App (app.lumalabs.ai), iOS App, and Luma Agents supporting multi-step parallel creative workflows
            and shared project state.
        - label: 'Tier 2: Developer Platform & Workflow Integration Surface'
          detail: >-
            Production Luma REST API (Build & Scale tiers), Python SDK, TypeScript SDK, and open-source ComfyUI custom
            nodes for pipeline integration.
        - label: 'Tier 3: Reasoning & Multimodal Orchestration Engine'
          detail: >-
            Unified Intelligence planner coordinating text, image, video, and audio synthesis with spatial constraint
            solvers before pixel rendering.
        - label: 'Tier 4: Frontier Foundation Model Layer'
          detail: >-
            Ray3.2 video generation model (native HDR, ACES EXR export, 16 keyframes) and UNI-1.1 multimodal image
            reasoning model.
        - label: 'Tier 5: Sovereign & Cultural Adaptation Surface'
          detail: >-
            HUMAIN Create regional AI architecture training sovereign Arabic multimodal models reflecting Middle Eastern
            cultural and linguistic nuances.
        - label: 'Tier 6: Distributed Compute & Supercluster Infrastructure'
          detail: >-
            Project Halo 2-gigawatt AI supercluster in Saudi Arabia, AMD/AWS compute infrastructure, and peta-scale
            multimodal data pipelines.
