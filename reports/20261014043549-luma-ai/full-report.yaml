        title: Exhibits
        blocks:
          - type: callout
            title: Sovereign Concentration and Geopolitical Exposure in Project Halo
            body: >-
              Luma AI's landmark $900M Series C round is overwhelmingly anchored by HUMAIN, a commercial entity funded
              by Saudi Arabia's Public Investment Fund. While this partnership guarantees access to planned 2-gigawatt
              compute capacity through Project Halo, it exposes the company to geopolitical risk, potential
              export-control restrictions on advanced hardware, and asymmetric partner dependency.
            calloutType: risk
            claimRefs:
