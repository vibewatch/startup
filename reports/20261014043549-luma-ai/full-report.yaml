      - number: '6.2'
        title: Adoption signals and named proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence ranges from a dated launch signal to current but incompletely defined scale claims.
              Andreessen Horowitz reported tens of thousands of Genie users on its first day in January 2024. An August
              2026 secondary profile reports more than 30 million active users, but does not define the activity period,
              account denominator, paid share, or product boundary. More commercially relevant signals include Luma's
              statement that eight named API partners are in production, its list of teams using the Luma App, and
              partner-distributed claims that Ray3 is embedded in Adobe products. Publicis Groupe, Serviceplan, Mazda,
              and Adobe offer recognizable references, yet only the Mazda and Adobe records identify a concrete
              delivered commercial or embedded distribution surface; none provides quantified customer outcomes.
