      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Dependency
        blocks:
          - type: paragraph
            body: >-
              Luma AI is led by co-founder and Chief Executive Officer Amit Jain, who provides overall research and
              commercial direction and serves as the primary executive champion for the firm's sovereign infrastructure
              alliances. Operational execution is managed by Chief Operating Officer Caroline Ingeborn, who oversees
              corporate systems, talent scaling, and cross-border organizational development. In December 2025, Luma AI
              initiated a formal international expansion by establishing its EMEA headquarters in London under the
              leadership of Jason Day, a former executive vice president at Monks and senior director at WPP. The
              company announced plans to recruit approximately 200 roles in London across engineering, research, and
              commercial partnerships throughout 2026. While co-founder Alex Yu provided foundational architecture
              during the company's early 3D vision research, external databases increasingly designate him as a former
              co-founder, highlighting key-person dependency on Amit Jain to maintain strategic and research continuity.
            claimRefs:
              - CO001
              - CO003
              - CO005
