callouts:
  - calloutType: recommendation
    title: Entry Discipline Mandatory Given 500x Estimated Revenue Multiple
    body: Luma AI's $4.0 billion valuation benchmark is underwritten on expectations of exponential multimodal market dominance rather than demonstrated fiscal scale. With independent estimates pointing to less than $15 million in annualized run-rate revenue, participating at the headline valuation implies paying upwards of 250x to 500x ARR. Prudent institutional investors should withhold direct equity investment until verifiable customer retention and gross margin metrics are audited under NDA.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV014
  - calloutType: risk
    title: Single-Counterparty Sovereign Compute and Capital Dependency
    body: Securing capital and compute from HUMAIN solves short-term GPU availability but introduces unprecedented governance and counterparty risk. Over 80% of Luma AI's Series C proceeds and its multi-year compute roadmap are concentrated in a single sovereign-backed vehicle, exposing the company to geopolitical risk, potential US export control shifts, and severe minority shareholder illiquidity.
    claimRefs:
      - CV001
      - CV008
      - CV013
