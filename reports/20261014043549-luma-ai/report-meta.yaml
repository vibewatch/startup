  topStrengths:
    - Frontier multimodal product breadth across consumer, API, and enterprise surfaces.
    - Strong capitalization and sovereign-backed compute access through HUMAIN and Project Halo.
    - Named distribution and adoption signals through AWS, Adobe, and other production references.
  topRisks:
    - Revenue, retention, gross margin, and customer concentration remain undisclosed.
