companyProfile:
  summary: >-
    Luma AI is a frontier multimodal AI company founded in 2021 by Amit Jain and Alex Yu. It began in computer vision
    and neural rendering, then expanded into consumer video generation, image reasoning, and enterprise-facing workflows
    through Dream Machine, Ray3.2, UNI-1.1, API access, and custom deployments. Public evidence shows the company
    targeting creators, developers, platform partners, and enterprise creative teams, while keeping core operating
    metrics such as revenue, retention, gross margin, and customer concentration largely undisclosed.
  foundedDate: '2021-10-30'
  founders:
    - name: Amit Jain
      role: Co-Founder & Chief Executive Officer
      background: Former Apple computer vision engineer and researcher; technical founder.
    - name: Alex Yu
      role: Co-Founder & Former CTO / Researcher
      background: UC Berkeley AI researcher specializing in NeRF and 3D vision.
  foundingLocation: Palo Alto, CA
  headquarters: Redwood City, CA
