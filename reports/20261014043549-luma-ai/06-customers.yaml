schemaVersion: "report-v2"
artifact: customers
slug: luma-ai
runDate: 2026-10-14
company:
  name: Luma AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Luma reaches individuals, developers, creative teams, and enterprises through
    self-serve plans, an API, cloud distribution, and custom deployments. Public
    evidence shows named usage and distribution, but retention, paid conversion,
    customer outcomes, contract durability, and revenue concentration remain undisclosed.
sections:
  - id: customer-segments-and-routes
    title: Customer segments and routes to adoption
    body: >-
      Luma's commercial surface spans individual creators, developer and platform
      teams, enterprise creative organizations, and users reached through cloud
      distribution. Individual plans separate Plus, Pro, and Ultra from an Enterprise
      offer, while the API separates usage-based Build access from Scale capacity with
      throughput and latency commitments. The company also describes use cases across
      advertising, film, gaming, e-commerce, education, and enterprise creative
      operations. This breadth creates multiple entry points, but it should not be read
      as segment-level traction: the retained sources do not disclose revenue mix,
      paid accounts, seats, workloads, or geography by segment. Amazon Bedrock adds a
      credible enterprise distribution route, while Tracxn independently characterizes
      the product as integrating into professional production pipelines.
    claimRefs: [CU001, CU002, CU003, CU006, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-named-proof
    title: Adoption signals and named proof
    body: >-
      Adoption evidence ranges from a dated launch signal to current but incompletely
      defined scale claims. Andreessen Horowitz reported tens of thousands of Genie
      users on its first day in January 2024. An August 2026 secondary profile reports
      more than 30 million active users, but does not define the activity period,
      account denominator, paid share, or product boundary. More commercially relevant
      signals include Luma's statement that eight named API partners are in production,
      its list of teams using the Luma App, and partner-distributed claims that Ray3 is
      embedded in Adobe products. Publicis Groupe, Serviceplan, Mazda, and Adobe offer
      recognizable references, yet only the Mazda and Adobe records identify a concrete
      delivered commercial or embedded distribution surface; none provides quantified
      customer outcomes.
    claimRefs: [CU004, CU005, CU007, CU008, CU012, CU013, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The packaging implies a plausible expansion path from individual creation to
      team workflows, then to API Scale or custom enterprise deployment. Named
      production partners and Adobe or AWS distribution could broaden usage without
      requiring every end customer to contract directly with Luma. International
      commercial hiring and planned partnership development across the UK, European
      Union, and Saudi Arabia also indicate a push beyond the United States. However,
      the public record cannot establish whether these routes produce durable revenue.
      None of the retained sources discloses NRR, GRR, churn, renewal rates, contract
      length, cohort retention, satisfaction, free-to-paid conversion, or top-customer
      revenue concentration. Investor diligence should therefore treat reach and named
      references as adoption signals, not as evidence of recurring economics.
    claimRefs: [CU001, CU002, CU005, CU006, CU010, CU011, CU016]
tables:
  - id: TU001
    title: Customer segmentation and commercial surfaces
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Strategic value
      - Evidence gap
    rows:
      - - Individual creators
        - Individual buyer, user, and payer
        - Browser and iOS creative workflows
        - Plus, Pro, and Ultra plans
        - Self-serve acquisition surface
        - Paid users, conversion, retention, and plan mix are not disclosed
      - - Developers and platforms
        - Product or engineering buyer; downstream users consume output
        - Embed image and video generation through the API
        - Eight named partners are described as in production
        - Usage-based entry and dedicated-capacity expansion
        - API calls, revenue, partner concentration, and end-user reach are not disclosed
      - - Enterprise creative teams
        - Business buyer; creative teams are users
        - Advertising, film, gaming, and enterprise creative operations
        - Five named teams are listed on the official information page
        - Custom deployment and workflow services
        - Contract value, seats, deployment stage, renewal, and outcomes are not disclosed
      - - Cloud-distributed teams
        - AWS customer buys through Bedrock; design and production teams use models
        - Design, prototyping, film production, and marketing
        - Luma models are available on Amazon Bedrock
        - Enterprise procurement and application integration channel
        - Luma usage volume, economics, and customer identity are not disclosed
    notes: >-
      Segment definitions and packaging come from Luma's official information page;
      AWS supports the Bedrock route and Tracxn supports the production-pipeline lens.
      Counts of named organizations are lower bounds derived from explicit lists, not
      total-customer estimates.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU009]
  - id: TU002
    title: Public adoption trajectory and denominator limits
    columns:
      - Metric or milestone
      - Reported value
      - Period
      - Source
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Genie launch usage
        - Tens of thousands of users on day one
        - "2024-01-09"
        - Andreessen Horowitz
        - Medium
        - Strong initial product curiosity
        - No repeat usage, paid conversion, geography, or cohort retention
      - - Dream Machine active users
        - 30M+
        - As of August 2026
        - Silicon Valley Investclub profile
        - Low to medium
        - Large reported top-of-funnel reach
        - Activity window, accounts versus people, paid share, and product boundary are undefined
      - - API production partners
        - At least eight named partners
        - Accessed 2026-10-14
        - Luma official information page
        - Medium
        - Evidence of developer and platform distribution
        - Workload, contract, revenue, and partner-share data are absent
      - - Luma App team references
        - Five named teams
        - Accessed 2026-10-14
        - Luma official information page
        - Medium
        - Evidence of enterprise-oriented use
        - Production status, seats, duration, and measured outcomes are mostly absent
      - - Adobe distribution
        - Ray3 described as embedded in Adobe products and solutions
        - "2025-11-19"
        - HUMAIN and Luma joint release
        - Medium
        - Potential scaled platform access
        - Usage, revenue share, duration, and end-customer adoption are not disclosed
    notes: >-
      Values retain each source's period and terminology. "At least" reflects that the
      official API list says "including"; it is not a total partner count. The 30M+
      figure is a secondary-source estimate with an undefined active-user denominator.
    claimRefs: [CU004, CU005, CU007, CU008, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or reference
      - Segment
      - Deployment or use case
      - Production versus pilot
      - Public outcome
      - Limitation
    rows:
      - - Publicis Groupe
        - Agency / enterprise creative team
        - Luma App creative workflows
        - Named as a trusted team; production status not disclosed
        - null
        - No deployment scope, duration, KPI, or customer-authored reference
      - - Serviceplan
        - Agency / enterprise creative team
        - Creative AI across global operations
        - Deployment claimed in an official announcement indexed by a secondary profile
        - Global-operations scope is claimed
        - No quantified productivity, quality, spend, or renewal evidence
      - - Mazda via Boundless
        - Brand / advertising
        - AI-produced commercial using Luma Agents
        - Delivered commercial is reported by a secondary profile of an official announcement
        - One named commercial
        - No campaign KPI, repeat deployment, contract value, or customer-authored validation
      - - Adobe
        - Technology platform / distribution partner
        - Ray3 embedded in Adobe products and solutions
        - Embedded integration is claimed in a joint partner release
        - Distribution inside Adobe's product surface
        - No usage, revenue contribution, customer count, or renewal evidence
    notes: >-
      This is a sample of the strongest explicit names in the retained pool, not an
      exhaustive customer list. Luma-issued and jointly issued releases are
      company/partner claims; no row establishes retention or independent outcome proof.
    enumerationScope:
      coverage: sample
      basis: >-
        Four explicit names with the clearest deployment or use descriptions in sources
        retained for this chapter as of 2026-10-14.
    claimRefs: [CU004, CU012, CU013, CU014, CU015]
figures:
  - id: FU001
    title: Customer adoption and expansion routes
    type: journey-map
    summary: >-
      Public packaging supports several entry and expansion surfaces, while conversion
      and retention between them remain undisclosed.
    data:
      items:
        - label: Individual discovery
          detail: Browser or iOS entry into the Luma App for individual creators.
        - label: Paid individual plans
          detail: Plus, Pro, and Ultra provide self-serve paid packaging.
        - label: Team workflow
          detail: Named creative teams use the Luma App, but seats and duration are unavailable.
        - label: API Build
          detail: Usage-based API access with no commitment lowers developer adoption friction.
        - label: API Scale
          detail: Dedicated capacity with throughput and latency commitments supports larger workloads.
        - label: Enterprise deployment
          detail: Custom deployment and Forward Deployed Creatives target scaled business workflows.
    approximationNotes: >-
      The ordered items show available commercial surfaces, not a measured funnel;
      public sources disclose no conversion rates or shared-population denominators.
    claimRefs: [CU001, CU002, CU016]
callouts:
  - calloutType: insight
    title: Reach is broader than independently verified customer proof
    body: >-
      The record supports multiple distribution routes and recognizable names, but most
      references are company- or partner-issued and omit quantified customer outcomes.
    claimRefs: [CU004, CU006, CU012, CU013]
  - calloutType: risk
    title: Durability and concentration remain ununderwritable
    body: >-
      Without retention, renewal, contract, paid-conversion, or customer-concentration
      data, public adoption signals cannot establish recurring revenue quality.
    claimRefs: [CU016]
