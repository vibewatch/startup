callouts:
  - calloutType: insight
    title: Multi-Model Orchestration as a Competitive Hedge
    body: Luma AI's strategy of embedding third-party frontier video models such as Google Veo and Kling alongside its native Ray architecture positions the platform as a workflow aggregator rather than a solitary foundation checkpoint. This hedges against catastrophic single-model obsolescence while capturing downstream agency subscription and API spend.
    claimRefs:
      - CP008
      - CP009
