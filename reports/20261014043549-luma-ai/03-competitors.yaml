    title: Pricing Models, Packaging Tiers, and Commercial Economics
    columns:
      - Platform / Tier
      - Entry Pricing
      - Professional / Creator Tier
      - API / Consumption Model
      - Commercial Packaging Implications
    rows:
      - - Luma AI (Dream Machine / API)
        - Free tier / $9.99/mo (Dream Machine web)
        - $30 - $300/mo (Luma App Pro/Ultra)
        - Credit-based usage (Build & Scale SLA tiers)
        - Lowers barrier for individual creators while monetizing heavy studio rendering via API credits
      - - Runway
        - Free tier / $12/mo (Standard)
        - $28 - $76/mo (Pro / Unlimited)
        - Enterprise custom API consumption pricing
        - Subscription tiers tier-gate resolution and export speed; unlimited generation on higher tiers
      - - OpenAI (Sora)
        - Bundled in ChatGPT Plus / Pro
        - $20 - $200/mo (ChatGPT tier bundling)
        - API consumption pricing per second of video
        - Leverages subscription base; treats video generation as feature add-on to core LLM subscription
      - - Kling AI
        - Free daily credits
        - $10 - $92/mo tiered subscriptions
        - Enterprise API access
        - Aggressive credit pricing designed to acquire global consumer and social video volume
    notes: Pricing structures reflect publicly documented web subscriptions, credit economics, and developer tier definitions as of 2026 (SP002, SP005, SP006).
