callouts:
  - calloutType: risk
    title: "Sovereign Concentration and Geopolitical Exposure in Project Halo"
    body: "Luma AI's landmark $900M Series C round is overwhelmingly anchored by HUMAIN, a commercial entity funded by Saudi Arabia's Public Investment Fund. While this partnership guarantees access to planned 2-gigawatt compute capacity through Project Halo, it exposes the company to geopolitical risk, potential export-control restrictions on advanced hardware, and asymmetric partner dependency."
    claimRefs: [CO007, CO010]
  - calloutType: strength
    title: "Tier-One Compute and Capital Foundation for Frontier Multimodal AI"
    body: "With over $1.06B in aggregate capital raised and strategic backing from AMD Ventures, Amazon, and Andreessen Horowitz alongside HUMAIN, Luma AI possesses one of the best-capitalized balance sheets in generative video. This capital enables aggressive model training for Ray3.2 and world models capable of reasoning across physical environments."
    claimRefs: [CO004, CO007, CO008]
  - calloutType: insight
    title: "Valuation Disconnect Against Early Revenue Traction"
    body: "At a reported $4.0B valuation, Luma AI trades at an extreme multiple against available commercial benchmarks, such as Sacra's $8M annualized revenue estimate from late 2024. Investors are underwriting frontier model research velocity and supercluster scale rather than current software cash flows, demanding rigorous diligence into enterprise monetization."
    claimRefs: [CO009, CO011, CO014]
