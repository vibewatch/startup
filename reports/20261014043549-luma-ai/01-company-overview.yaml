company:
  name: "Luma AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Luma AI is a frontier multimodal artificial intelligence enterprise founded in 2021 by Amit Jain and Alex Yu, specializing in reasoning video and world models including Ray3.2 and UNI-1.1. In November 2025, the company secured a landmark $900 million Series C financing round led by Saudi sovereign AI entity HUMAIN at a $4.0 billion post-money valuation, pairing capital with a 2-gigawatt supercluster deployment in Project Halo. While the balance sheet demonstrates tier-one capitalization alongside backing from AMD Ventures, Amazon, and Andreessen Horowitz, audited commercial traction remains closely held with third-party revenue pegged at $8 million ARR in late 2024."
sections:
  - id: corporate-identity-and-mission
    title: "Corporate Identity, Founding History, and Core Mission"
    body: "Luma AI was founded in 2021 by Amit Jain and Alex Yu with the strategic mission of developing unified general intelligence capable of generating, understanding, and operating within the physical world. While originally establishing operations in Palo Alto, California, the company currently maintains its corporate headquarters in Redwood City, California. The company initially gained broad market recognition with its 3D capture and NeRF neural rendering tools before pioneering consumer generative video with the release of Dream Machine in mid-2024. Over 2025 and 2026, Luma AI transitioned its product architecture toward reasoning multimodal world models, deprecating legacy tools in favor of Ray3.2 for cinematic video generation and UNI-1.1 for directable image reasoning. The enterprise serves creative studios, advertising networks, and developers through web applications, credit-based production APIs, and custom enterprise deployments with Forward Deployed Creatives."
    claimRefs: [CO001, CO002, CO004, CO008, CO009]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: "Executive Leadership, Governance, and Key-Person Dependency"
    body: "Luma AI is led by co-founder and Chief Executive Officer Amit Jain, who provides overall research and commercial direction and serves as the primary executive champion for the firm's sovereign infrastructure alliances. Operational execution is managed by Chief Operating Officer Caroline Ingeborn, who oversees corporate systems, talent scaling, and cross-border organizational development. In December 2025, Luma AI initiated a formal international expansion by establishing its EMEA headquarters in London under the leadership of Jason Day, a former executive vice president at Monks and senior director at WPP. The company announced plans to recruit approximately 200 roles in London across engineering, research, and commercial partnerships throughout 2026. While co-founder Alex Yu provided foundational architecture during the company's early 3D vision research, external databases increasingly designate him as a former co-founder, highlighting key-person dependency on Amit Jain to maintain strategic and research continuity."
    claimRefs: [CO001, CO003, CO005]
    tableRefs: [TO002]
  - id: capitalization-and-stakeholder-map
    title: "Venture Capitalization, Sovereign Backing, and Stakeholder Mapping"
    body: "Luma AI has raised more than $1.06 billion in cumulative lifetime financing across five distinct venture rounds, progressing from a $4.3 million Seed round in October 2021 to a $43 million Series B in January 2024 led by Andreessen Horowitz. In November 2025, the company finalized a transformative $900 million Series C financing round led by HUMAIN, the artificial intelligence investment vehicle backed by Saudi Arabia's Public Investment Fund, valuing Luma AI at upwards of $4.0 billion post-money. Strategic participation included AMD Ventures, along with existing venture backers Andreessen Horowitz, Amplify Partners, and Matrix Partners, following earlier corporate participation from Amazon and AWS in late 2024. As a central pillar of the Series C agreement, Luma AI entered an anchor customer and research partnership for Project Halo, a planned 2-gigawatt AI supercomputing cluster in Saudi Arabia designed to train multimodal world models on quadrillions of tokens across global datasets."
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: operating-scale-and-diligence-realities
    title: "Operating Scale, Commercial Traction, and Diligence Realities"
    body: "Despite securing a top-decile private valuation mark of $4.0 billion, Luma AI maintains strict private confidentiality regarding its GAAP revenue, gross margin performance, compute expenditures, and cash burn rate. Third-party private market research from Sacra estimated that the company achieved approximately $8 million in annualized revenue in December 2024 following the initial launch of its consumer video tools, indicating early monetization via creator subscriptions and developer API usage. Commercial database estimates of Luma AI's operational workforce diverge sharply, spanning from an 11-50 employee band on FundedIQ to 478 reported employees on Tracxn as of August 2026. Furthermore, the company navigates ongoing copyright scrutiny and intellectual property friction from Hollywood entertainment studios regarding generative model training ingestion. Accredited secondary market shares on pre-IPO platforms remain illiquid, subject to company right-of-first-refusal restrictions, and trade at discounts reflecting substantial information asymmetry."
    claimRefs: [CO011, CO012, CO013, CO014]
