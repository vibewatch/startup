callouts:
  - calloutType: insight
    title: Macro TAM Projections Diverge From Immediate Studio Production Budgets
    body: While macro forecasts project generative AI spending to exceed $1.3 trillion over the next decade, Luma AI's immediate addressable revenue is constrained by existing studio production and marketing software budgets ($8B–$15B). Enterprise creative adoption requires integration with non-linear editors, strict color management (ACES/HDR), and indemnification against copyright infringement rather than raw prompt-based text-to-video generation.
    claimRefs:
      - CM002
      - CM003
      - CM007
      - CM013
  - calloutType: risk
    title: Capital Intensity and Infrastructure Dependencies in Frontier Multimodal Simulation
    body: Scaling beyond text-to-video into physical world simulation ('World Models') imposes immense compute capital requirements. Luma's reliance on HUMAIN's planned 2-gigawatt Project Halo supercluster in Saudi Arabia reflects this dependency; without peta-scale training compute, maintaining frontier competitive advantage against well-capitalized hyperscalers (Google Veo, OpenAI Sora) will challenge standalone margin structures.
    claimRefs:
      - CM004
      - CM008
      - CM011
      - CM012
