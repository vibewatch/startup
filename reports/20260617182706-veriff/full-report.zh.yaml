  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Veriff 是一个 API-first、白标交付的身份验证即服务平台：企业把 Veriff SDK 嵌入注册或重新认证流程，终端用户拍摄政府 ID 并自拍，Veriff 在数秒内返回自动 approve /
              decline 决策和欺诈风险分数。产品是一组模块，而不是单次检查。核心身份验证会认证证件，并把证件头像与实时自拍匹配；Liveness / 生物识别面部分析确认用户是真实在场的人，而非伪造；Biometric
              Authentication 让回访用户用快速自拍匹配原始开户注册，完成重新验证；Fraud Intelligence 把设备、网络和行为信号叠成综合 RiskScore，并在 Veriff Station
              控制台或 API 中呈现；2025 年 AI-based Proof of Address 增加地址验证。其上是 Full Auto，即全自动决策层，尽可能把更多会话交给机器决策，不进入人工环节。平台支持来自
              230+ 个国家的 12,500+ 种证件类型，每会话运行 1,000+ 欺诈信号，把自己定位成覆盖广、自动化优先的 IDV stack，面向 fintech、crypto、gaming、mobility 和
              marketplace。
