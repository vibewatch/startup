            body: >-
              身份验证市场拥挤且碎片化：Switch Labs 统计五类能力中有 27+ 家主要供应商，Mordor 也确认没有供应商控制超过 15% 收入。Veriff 的直接同业是纯证件 + 生物识别 IDV
              厂商：Onfido（2024 年被 Entrust 收购）、Jumio、Sumsub、Persona、AU10TIX、IDnow，以及快速上升的
              Incode。更大的既有厂商和邻近玩家从上方和侧面挤压：Entrust（吸收 Onfido）、IDEMIA 和 Thales 做凭证；Socure 和 Trulioo
              做美国中心、数据驱动的身份和欺诈；Stripe Identity、Plaid 等平台玩家把验证捆进支付和 fintech
              基础设施。替代方案和现状选项仍是真实竞争：人工或网点审核、基于知识的认证、征信查询，以及最大平台自建（Uber、Bolt
              等具备足够工程深度，内化检查是可信威胁）。未来可能的新进入者包括云和支付巨头延伸原生身份能力，以及可能切掉部分开户注册环节的政府 eID / eIDAS 2.0 钱包。Veriff
              的差异化在自动化率、证件和国家覆盖广度、透明自助定价，而不是最低价或最大规模。
