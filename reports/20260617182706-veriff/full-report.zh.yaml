  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与产品
        blocks:
          - type: paragraph
            body: >-
              Veriff 是一家全球化、AI 原生身份验证（IDV）公司，2015 年成立，总部位于爱沙尼亚塔林，在 New York、London、Barcelona 设有办公室，并在 Sao Paulo
              新设美洲枢纽。公司由 Kaarel Kotkas 创立，他仍担任创始人兼 CEO；联合创始人为 Janer Gorohhov，Veriff 也曾入选 Y Combinator
              加速器。公司销售身份验证即服务：平台把自动化 AI 证件和生物识别检查与人工复核结合起来，在线验证政府签发 ID 和自拍，通常约 6 秒返回决策。它的创立土壤是爱沙尼亚先进的国家数字身份基础设施，同一生态也孕育了
              Skype、Wise 和 Bolt。Veriff 不把自己定位成一次性的开户注册合规检查，而是持续进化的「全球信任层」，在客户旅程中认证用户。公司持有 ISO/IEC 27001:2022、SOC 2 Type
              II 和 ISO/IEC 30107-3 生物识别认证，支撑其企业级定位。
