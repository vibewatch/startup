      - number: '7.4'
        title: 伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Veriff 的依赖图集中在少数节点。云：AWS 支撑计算、GPU 模型服务（SageMaker）和存储，因此 AWS 定价、可用性和政策变化会直接传导到 Veriff 的成本和 uptime。客户：Sacra
              提示，少数大型企业账户（如 Uber、Bolt）很可能贡献了不成比例的收入，因此一两个锚定客户流失或重新定价都会造成实质影响；Veriff 没有披露头部客户占比，无法给风险设上限。认证机构：Veriff
              的信任姿态依赖第三方（iBeta 对 ISO 30107-3 的测试、FIDO Alliance、SOC 2 审计方）；认证失效或被降级，会削弱企业销售。资本：尽管公司盈利且可自我融资，Veriff 自 2022
              年以来没有再融资；未来若需要资本，投资人胃口要经受比 2022 年估值更高门槛的检验。监管者本身也是一种依赖，因为执法姿态（欧盟 AI
              法案落地、Ofcom、美国州总检察长）可能一夜之间改变可服务需求和合规成本。单项伙伴风险都可管理，但合在一起意味着 Veriff 的连续性依赖 AWS
              uptime、少数锚定客户和持续认证——这是一组集中的依赖栈。
