      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Veriff 的监管暴露广且在收紧。GDPR 第 9 条规定，用于唯一识别个人的生物识别数据属于被禁止处理的特殊类别，除非适用明确同意等例外；因此，Veriff
              的合法性基础取决于每个客户都有稳健、可审计的同意流程——单个同意实现存在缺陷，就可能带来责任。欧盟 AI
              法案把远程生物识别身份识别列为高风险，并对提供方施加合格评定、透明度、人工监督、日志记录等义务；第三国提供方只要输出用于欧盟也会被覆盖。Veriff 作为欧盟提供方直接在范围内，而 EDPB 2024 年关于
              AI 模型与 GDPR 的意见，又给合法性基础和训练数据来源增加不确定性。在英国，Online Safety Act 要求高度有效的年龄保障，Ofcom 可处以最高 GBP 18 million 或全球营业额
              10% 的罚款——这既是需求顺风，也是在准确率被质疑时的责任面。在美国，Illinois Biometric Information Privacy Act（BIPA）设有私人诉权和法定赔偿；直接同业
              Incode 以 $4 million 和解一宗 BIPA 集体诉讼，说明同一诉讼理论（未取得合规同意而采集面部几何生物识别）对 Veriff 的美国业务是现实的行业性暴露。eIDAS/eIDAS 2.0 与
              AML/KYC 义务又补上一张密集合规图。剩余暴露很高：认证能缓释技术合规风险，但挡不住同意流程或跨境传输责任。
            claimRefs:
