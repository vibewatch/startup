      - number: '8.5'
        title: 可比公司组
        blocks:
          - type: paragraph
            body: >-
              可比公司组横跨最新成长轮、M&A 结果和行业基准。Persona 是最接近的新近成长型可比：2024 年 ARR 为 $141.2M，2025 年 4 月 Series D 估值 $2B，隐含收入倍数约
              14x，并由 PitchBook 和 SiliconANGLE 交叉印证。Incode 正在以约 $170M ARR 寻求最高 $3B 估值（2025 年 11 月），约
              17x。相对这些溢价估值，Onfido/Entrust 交易是关键的反向可比：Onfido ARR 约 $54.5M，2024 年战略出售时估值约 $163.4M-$400M，约
              3-4.6x——明显低于行业中位数，也提醒投资人 IDV 资产可能以低倍数退出。行业基准显示，2025 年网络安全 / fintech SaaS 收入倍数约 7.7x-9.4x，超高速增长领导者为
              10x-14x。Socure（2021 年 $4.5B）、Jumio、Sumsub（2024 年 $85.6M）和 AU10TIX
              是其他私有同业，但估值点陈旧或未披露，因此只能松散锚定可比组。综合看——Persona 的 14x 溢价、Onfido 的 3-4.6x 底部，以及约 8x 的行业中位数——约 $0.9B-$2.0B
              的公允价值区间包住陈旧的 $1.5B 估值；Veriff 的增长和量的信号让它更接近区间上半部，而不是 M&A 底部。
