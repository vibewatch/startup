      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              核心运营风险，是 deepfake 和注入攻击激增后带来的欺诈模型退化。Veriff 的价值建立在高欺诈捕获率和高自动化率上；如果 AI 生成
              deepfake、合成身份和绕过摄像头的注入攻击迭代快过检测能力，客户最依赖系统时，捕获率反而下降，信任和业务模型假设的溢价定价都会被侵蚀。行业证据很刺眼：deepfake 攻击大约每五分钟一次，伪造上升
              244%，注入攻击上升 88%，2021–2024 年欺诈大约翻倍，67% 的公司报告欺诈增加。相关的质量风险是误拒：为了抓住 deepfake
              而收紧阈值，会提高误判为负的比例，激怒真实用户，并伤害客户转化率——安全与可用性的直接张力，已经在终端用户评价中可见。安全 / 可用性风险集中在 AWS 依赖：平台运行在 AWS 的 Kubernetes 集群和
              SageMaker 上，因此一次重大的 AWS 区域宕机，或 Veriff 侧生物识别数据泄露，影响都会很高（运营停摆加 GDPR 下的监管泄露暴露）。Veriff 通过 SOC 2 Type
              II、ISO/IEC 30107-3（iBeta 测试）展示攻击检测、FIDO 认证，以及人工复核层来缓释，但这些都是针对持续演化对手的时点控制，仍留下有意义的剩余暴露。
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
