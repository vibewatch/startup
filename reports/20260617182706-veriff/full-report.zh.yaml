      - number: '4.2'
        title: Go-to-market 动作与销售效率
        blocks:
          - type: paragraph
            body: >-
              Veriff 采用混合 go-to-market：一条开发者主导、自助路径（公开定价、API/SDK 开户、$49 月最低消费）低成本获取中端市场和产品主导客户；另一条企业销售路径服务
              Uber、Bolt、Western Union、Webull 等标杆账户。公开数据未披露 CAC、回本周期或销售周期长度，因此销售效率只能从代理指标推断。最强代理指标是 2024 年披露的 Q4 收入同比增长
              75%、客户增长 60%、验证量增长三倍；随后 Sacra 估计 2025 年 ARR 增长 83% 至
              $110M，同时实现盈利。能在这种速度下转正，意味着获客效率较高，并且现有账户净收入扩张可观，因为客户验证量上升带动混合每客户收入提升。自助层降低长尾
              CAC，跨客户欺诈网络和每次验证附加项则在不同比例增加销售成本的情况下推动扩张。主要未知数是新 logo 与扩张收入的拆分、毛留存和净留存，以及企业销售动作成本；Veriff 均未公开披露。
