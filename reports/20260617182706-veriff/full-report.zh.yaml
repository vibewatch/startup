      - number: '6.4'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >-
              Veriff 未披露直接留存指标——NRR、GRR、流失率和合同期限——因此耐久性只能从代理指标推断。最强正向代理指标是认证量同比增长 30
              倍、验证量增长三倍：在按使用量计费模型下，只有现有客户留存并扩大使用，才可能出现这种增长，意味着净收入留存较高。满意度代理指标也偏有利：Veriff 被评为 G2 2025 年 Spring、Summer 和
              Autumn 报告的 Leader，并在汇总评论网站（Software Advice、G2）评分高于 4/5。主要负面信号来自终端用户体验：少数但持续存在的 Trustpilot 和 G2
              评论提到误拒、验证失败和申诉处理弱。Veriff 自身立场是，许多投诉来自被拦截的欺诈者，而非合法用户；对 IDV
              供应商而言，这部分属实，但这种表述也方便，未完全回应真实误拒伤害。对付费客户（企业）而言，耐久性信号强；对终端用户而言，满意度更混杂，如果误拒率挫伤客户自己的转化目标，可能成为潜在流失风险。
