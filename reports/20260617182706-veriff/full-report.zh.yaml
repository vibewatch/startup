  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近市场与替代方案
        blocks:
          - type: paragraph
            body: >-
              Veriff 切入身份验证（IDV）和认证市场：企业花钱远程确认一个人是否为其声称的本人，通常通过验证政府签发证件，并把证件与带生物识别活体检测的实时自拍匹配。纳入范围的支出包括证件验证、生物识别 /
              活体检查、持续生物识别认证、年龄保证，以及叠加其上的欺诈信号情报，通常按每次验证或企业订阅收费。核心边界之外，是买方常常单独采购的邻近类别：交易欺诈和支付风险评分、设备指纹、AML 交易监控、制裁 / PEP
              筛查，以及完整客户数据平台。最近的邻近市场是更宽的数字身份解决方案，它把凭证签发、可复用身份钱包和政府 eID
              纳入生命周期。现状替代方案仍有意义：人工或网点证件审核、基于知识的认证、征信机构查询，以及大型平台自建。Switch Labs 统计五类能力中有 27+
              家主要供应商，并指出没有单一供应商覆盖所有类别，因此买方经常拼接两到三种互补工具，而不是采购一套套件。Veriff 站在「证件 + 生物识别」核心，并向认证和地址证明延伸。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
