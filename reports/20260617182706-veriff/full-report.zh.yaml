  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价与商业化
        blocks:
          - type: paragraph
            body: >-
              Veriff 是一家 B2B、按使用量计费的公司：客户按验证会话付费，而不是按席位付费，收入直接绑定开户注册和认证量。主要收入流是核心证件 +
              生物识别身份验证；其上叠加更高价值的收入流，扩大每个账户收入：持续生物识别认证（回访用户重新验证）、欺诈信号情报、作为每次验证附加项的 PEP 和制裁筛查、按对象收取经常性费用的持续监控，以及 2025
              年中以来新增的 AI-based Proof of Address，带来新的可货币化验证类型。Sacra 显示，自助定价从入门 Full Auto 计划每次验证 $0.80 到 Premium 层 $1.89
              不等，月最低消费从 $49 起；企业合同谈判定价，折扣低于价目表。该使用量模型意味着收入随客户增长、随认证和筛查交叉销售复利，但也让 Veriff 暴露于量的季节性，以及每次验证价格压缩；该市场标价横跨
              $0.05-$3.00。使用费的收入确认较直接，但经常性监控和最低承诺部分引入订阅元素，提高可预测性。
