      - number: '5.4'
        title: 信任、安全、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              Veriff 处理生物识别和政府身份数据，因此信任与合规姿态就是产品的一部分。Veriff 发布 SOC 2 Type II 鉴证，覆盖信息安全控制，并符合 ISO/IEC
              30107-3（呈现攻击检测）Level 1 和 Level 2；测试方是 iBeta Quality Assurance，一家独立、获 NIST/NVLAP
              认可的生物识别测试实验室——这是其活体检测能顶住伪造的重要第三方验证。2025 年，Veriff 为 Full Auto IDV 增加 FIDO Alliance 全球认证（FIDO DocAuth，覆盖 12
              个国家），这是远程证件认证中新兴的互操作 / 保证标准；公司也获得 2025 CyberSecurity Breakthrough Award 的 fraud prevention 奖。其被动活体方案明确用于检测
              AI 生成 deepfake、合成或篡改图像，以及流式 / 预录视频——这是主要演化攻击类别。持续风险在于，威胁环境变化快于认证：行业报告（Sumsub、Entrust、Deepstrike）显示
              deepfake 和注入攻击急剧上升，约每五分钟发生一次 deepfake 攻击，因此 Veriff 的欺诈捕获率必须持续再训练才能守住。隐私和生物识别数据处理（GDPR、BIPA
              式同意制度）与这些控制并行，风险章节会深入覆盖。
