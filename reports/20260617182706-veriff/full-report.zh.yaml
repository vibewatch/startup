      - number: '5.3'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              根据 AWS 自己的工程叙述，Veriff 后端是运行在 AWS 托管 Kubernetes 集群上的微服务架构。智能层由数十个机器学习模型构成，覆盖轻量树模型到必须用 GPU
              低延迟运行的深度学习计算机视觉模型；Veriff 将这组模型标准化到 Amazon SageMaker multi-model endpoints，并称模型部署时间因此缩短约 80%，GPU serving
              成本也下降（此前为手工搭建的 Kubernetes GPU 共享方案，实例过度配置）。ML fleet 之上是欺诈信号引擎，收集设备和网络信号并压缩为单一
              RiskScore；再往上是类似身份图谱的网络，跨客户交叉引用会话，捕捉重复欺诈者。关键在于，架构明确是混合式：AI 自动化 + human-in-the-loop 复核，边缘案例由受训专家在 Veriff
              Station 裁定，这些人工决策再反馈为训练数据。人工层既是质量护栏，也是成本驱动。运营层面，平台暴露 REST APIs、webhooks 和 mobile / web
              SDKs（developers.veriff.com 有文档），支持快速嵌入式集成。依赖画像集中在 AWS（计算、SageMaker、GPU
              实例）、专有证件模板和欺诈信号数据集，以及人工复核团队——每一项都是运营杠杆点，也带来风险。
