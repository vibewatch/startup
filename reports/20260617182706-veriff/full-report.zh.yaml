        - id: volume
          label: 客户开户量
        - id: core
          label: 核心 IDV 收入
        - id: addons
          label: 附加项：认证、PEP/制裁、PoA
        - id: monitor
          label: 持续监控（按主体）
        - id: revenue
          label: ARR >$100M（2025），已盈利
