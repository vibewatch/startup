      - number: '8.6'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最可能的退出，是被更大的安全或身份识别在位巨头战略收购，类似 Entrust/Onfido 和 Incode/AuthenticID 的整合路径；考虑到 Veriff 约 $110M ARR
              的规模相对公开上市门槛仍小，近期 IPO 可能性较低。行业 M&A 成交倍数区间很宽，为 3x-17x，因此退出价值很大程度取决于 Veriff
              是作为战略溢价资产出售，还是作为财务上的规模调整资产出售。任何入场前，必须完成的尽调问题包括：经审计财务，调和三组冲突收入数字（LATKA $41.6M、爱沙尼亚实体 EUR 50.2M 营业额、公司自述
              $100M+ run-rate）；头部客户收入集中度表，用来测算锚定依赖（若一两个账户在没有锁定的情况下占主导，就是击穿论点触发器）；欺诈捕获趋势数据，用来验证护城河；当前 409A
              或二级市场估值，用来测试陈旧的 $1.5B；以及客户合同条款，用来评估重新定价风险。击穿论点和 kill 触发器——欺诈捕获率持续下降、重大监管罚款、锚定客户流失、再融资 down-round，或审计结果低于自述
              run-rate——构成入场后的监控议程。净看，只要增长持续且披露缺口关闭，以不高于 2022 年估值且带下行保护的价格入场，可提供合理的风险调整回报。
