  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Veriff 的客户基础是 B2B 组合，覆盖高增长数字平台和受监管金融机构，横跨 fintech、crypto、新银行、mobility、marketplace 和 gaming。Sacra 估计，全球有
              3,000+ 企业客户使用
              Veriff，并采用按使用量计费合同。买方通常是客户内部的欺诈、合规或增长负责人；用户是完成开户注册的客户终端用户；付款方是客户企业。按规模看，客户分层呈双峰：自助、开发者主导层（公开定价、$49
              月最低消费）获取中端市场和产品主导公司；企业层服务标杆账户。具名企业客户包括 Uber、Bolt、Instacart、Western
              Union、Bumble、Deel、Monzo、Webull、Blockchain.com 和 Starship，以及 Trustpilot——覆盖 mobility、marketplace、dating、HR
              / payroll、新银行、投资和 crypto。地域上客户基础全球化，美国是最大单一市场，LATAM（如相邻市场中的 Kueski、Valr）增长最快。垂直和地域维度上，这个基础较多元；但 Sacra
              提醒，少数大型企业账户可能贡献不成比例收入，因此细分层面的多元化并不能消除收入集中。
