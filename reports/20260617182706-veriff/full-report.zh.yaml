      - number: '3.2'
        title: 竞争对手画像：规模、融资与方向
        blocks:
          - type: paragraph
            body: >-
              从已披露财务看，Veriff 按收入处于中游，但估值融资较充足。Persona 是独立公司中的收入领跑者，2024 年收入 $141.2M（2023 年 $98.8M），并于 2025 年 4 月以 $2B
              估值融资 $200M，押注可配置、no-code 平台策略。Sumsub 报告 2024 年收入 $85.6M（2023 年 $50M），侧重一体化 KYC/AML/crypto 合规。Veriff 公司披露的
              2025 年收入超过 $100M，但最近估值仍是 2022 年 1 月的 $1.5B。Onfido 在 2024 年 2 月被 Entrust 以约 $400M 收购前，收入约 GBP 140M、员工 500
              人；现在它是 Entrust 以身份为中心安全栈中的一个功能，而非独立挑战者。Jumio 是更老的企业型玩家（2010 年成立），LATKA 最近披露的收入是 2021 年
              $42.4M，披露估值（$127.3M）看起来也陈旧。Incode 是最激进的新进入者，2025 年 11 月被报道寻求最高 $3B 估值，远高于 Veriff 最近标记。AU10TIX、IDnow（EU/eID
              聚焦）以及 Trulioo/Socure（美国数据驱动身份）补齐这个市场；战略分化在广谱平台与区域或垂直专家之间。
