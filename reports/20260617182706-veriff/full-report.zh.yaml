            body: >-
              Veriff 的成本结构把高毛利软件内核，与两个比纯 SaaS 更重的成本驱动结合在一起：运行每次验证中数十个 AI 模型所需的云 / 计算（平台在 AWS 基础设施上每会话运行 1,000+
              信号），以及裁定边缘案例的「human-in-the-loop」复核团队。这让 IDV 毛利率低于典型 SaaS；不过 Veriff 的高自动化率（Full Auto
              产品）明确就是把更多量推给机器，随规模提升利润率。2025 年在约 $110M ARR 上实现盈利，且此前 2023 年 2 月裁掉 12% 员工（66 人）重置成本基数，说明经营杠杆已经转正，计算 +
              复核成本曲线正在随自动化和量变得更有利。营运资本和 capex 未披露，但对没有制造环节的云原生软件公司而言可能较低。按使用量计费收入、正经营利润率和未披露债务三者结合，说明 Veriff
              现在可能靠经营自供血；这与 2022 年独角兽轮时烧钱增长的姿态相比，是重要变化。审计后的利润率数字未公开，因此盈利说法来自公司披露，尚未验证。
