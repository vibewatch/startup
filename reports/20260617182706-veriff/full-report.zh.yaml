      - number: '3.4'
        title: 切换成本、护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              IDV 的切换成本真实但中等：集成工作、合规再认证和欺诈阈值调优都会制造摩擦；但多供应商并用很常见，买方会把验证路由到两三家厂商，以获得覆盖、冗余和价格杠杆，这限制了任何单一供应商的锁定力。Veriff
              最有防御力的资产是跨客户欺诈信号网络（随量复利）、证件和国家覆盖广度，以及自动化率；这些能力随规模改善，也很难快速复制。较弱的护城河包括：定价权受碎片化和自助透明度约束，核心证件 +
              自拍检查越来越商品化。最重要的替代风险是：（1）deepfake 和数字注入攻击可能侵蚀任何跟不上节奏厂商的准确率优势，Jumio 报告注入攻击上升 88%；（2）Persona（$2B）和 Incode（寻求
              $3B）等资本更充足的新进入者在 R&D 和 GTM 上超过 Veriff；（3）Entrust 等既有厂商把 IDV 捆进更广的安全 / 凭证套件；（4）长期看，政府 eID 钱包（eIDAS
              2.0）和可复用身份可能减少重复第三方验证需求。Veriff 的 2022 年估值标记已经陈旧，且早于同业 2025 年融资，提示相对动能风险。
