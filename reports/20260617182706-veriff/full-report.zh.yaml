      - number: '5.5'
        title: 路线图、成熟度与差异化
        blocks:
          - type: paragraph
            body: >-
              Veriff 的发布节奏显示，公司正从单一 IDV 检查稳步扩展为多产品平台：Full Auto IDV（到 2024 年推进到当前自动决策代际）、用于重新验证的 Biometric
              Authentication，以及 2025 年 AI-based Proof of Address；每一项都在同一集成上增加可货币化能力。模块成熟度不同：核心证件 + 生物识别 IDV
              和被动活体已经成熟并获得外部认证；Fraud Intelligence / RiskScore 和 Biometric Authentication 正在增长并形成差异；Proof of Address 是
              2025 年新品，验证较少。Veriff 的差异化落在四项资产：证件覆盖广度（12,500+ 种、230+
              个国家）、降低单位成本和延迟的高自动化率、随规模改善的跨客户欺诈信号网络（数据网络效应），以及第三方认证生物识别（ISO
              30107-3、FIDO）。主要产品风险是：竞争对手追平覆盖和自动化；每次验证价格压缩；deepfake /
              注入攻击侵蚀欺诈捕获优势，快于模型适应。路线图方向——更多自动化、更多合规模块、更深欺诈情报——与收入模型和威胁轨迹一致，但能否跟上加速的欺诈军备竞赛，是关键不确定性。
