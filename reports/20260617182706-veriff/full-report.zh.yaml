  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Veriff 的风险画像由两类结构性暴露主导，并叠加一组次级风险。第一类结构性风险是监管 / 法律风险：Veriff 总部在欧盟，处理生物识别和政府身份数据，正落在 GDPR 第 9 条特殊类别数据规则、欧盟
              AI 法案对远程生物识别身份识别的高风险分类、英国 Online Safety Act 的年龄保障义务，以及美国州级生物识别隐私法规（BIPA）之下；同业已经因此出现数百万美元和解。第二类结构性风险是
              deepfake / 注入式欺诈军备竞赛：行业数据显示，deepfake 攻击大约每五分钟一次，伪造上升 244%，注入攻击上升 88%，直接威胁支撑 Veriff
              溢价定价的欺诈捕获率。次级风险包括客户集中度（少数大客户很可能主导收入）、对 AWS 的云依赖、竞争和单次验证价格压缩、对创始人 CEO Kaarel Kotkas 的关键人物依赖，以及 2022 年 1
              月估值已经陈旧。按剩余暴露排序，监管 / 生物识别隐私和 deepfake 驱动的模型退化最高（高概率、高影响、仅部分缓释）；集中度、定价和关键人物风险为中等；云宕机和执行风险更低。投资含义是，Veriff
              必须同时跑在监管者和欺诈者前面，投资论点才站得住。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR040
