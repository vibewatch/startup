      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 ARR 复合增长至 $200M+，且溢价倍数维持在 12-14x，支持在新一轮融资中重估至 $2.5B-$3B——大体接近 Persona 和 Incode 正在走的路径。基准情景假设 ARR
              增至约 $150M，按正常化约 10x 倍数计，支持约 $1.5B 估值，基本与 2022 年估值一致。熊市情景假设欺诈捕获能力被侵蚀，或监管受挫，增长和倍数压缩至约 6-8x，意味着接近 $0.7B-$0.9B
              的 down-round。敏感性分析显示，结果最受收入倍数和持续增长率影响，其次是实际 ARR 基数：在约 $110M ARR 下，每一圈倍数约对应 $110M 估值，因此仅按今天 ARR 计算，熊市 6x
              与牛市 14x 之间的差距就约为 $0.7B 到 $1.5B。触发 down-round 的条件，是欺诈捕获率持续下降，或重大监管罚款同时压缩增长和倍数。
