      - number: '7.5'
        title: 人员、执行与财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              人员与执行：Veriff 与创始人 CEO Kaarel Kotkas 绑定很深，这是创始人领导的规模化公司常见的关键人物依赖；如果他离任，会带来战略和士气风险。2023 年 2 月裁员 12%（66
              人）说明公司已经不得不调整规模；在 LATAM/APAC 快速扩张、同时争夺稀缺 AI 人才时，持续守住招聘质量也是执行风险。财务 / 模型风险：虽然 Veriff
              已盈利，但核心数字由公司自述且未经审计，公开收入数字彼此冲突（LATKA 给出 2024 年 $41.6M，而 run-rate 超过
              $100M），因此财务模型带有披露不确定性。利润率压缩风险真实存在，因为没有任何提供商份额超过约 15%，单次验证价格在 $0.05-$3.00 之间，低成本进入者可以挤压 Veriff 的溢价。估值风险来自
              2022 年 1 月 $1.5B 的陈旧估值：没有新的 primary round，当前公允价值未经验证；如果增长或市场情绪滑落，down-round
              并非不可想象。贯穿财务模型的风险是，溢价论点依赖持久的欺诈捕获优势；一旦该优势被侵蚀（即上文 deepfake 风险），定价、留存和估值会一起压缩。缓释措施和击穿论点的触发器列在 kill-criteria
