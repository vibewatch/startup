      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场可以按终端行业、部署方式、组织规模和地域清晰切分，Veriff 的 go-to-market 也跟着最高量的切片走。金融服务是最大垂直，约占 2025 年收入 30.7%（Mordor）；其后是
              mobility / 共享经济、crypto 交易所、在线 marketplace、gaming / gambling，以及受年龄保证法规推动而加速进入的社交平台。经济买方通常是合规、风险或欺诈负责人（Chief
              Compliance Officer、Head of Fraud 或 Head of Onboarding），掌管 KYC/AML 或 trust-and-safety
              预算；用户是完成开户注册的终端消费者，付款方是按验证付费的平台。大型企业贡献约 72.6% 支出（Mordor），但 SMEs 增速最快；云部署约占 65% 份额，与 Veriff 的
              API-first、云原生模型一致。采用触发点通常是监管义务（KYC/AML、年龄保证）、欺诈事件，或进入新地域时对证件覆盖的需求。采用路径是
              land-and-expand：单一开户注册用例扩展到重新验证、认证和地址证明。按解决方案类型，生物识别验证以约 35.8% 的 2025 年收入居首，这正是 Veriff 所在赛道。
