  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Veriff 的投资论点是：它是一家盈利、快速增长的领导者，所在身份验证市场结构性扩张。Sacra 估计，2025 年 ARR 约 $110M，同比约增长 83%，公司已盈利，拥有 3,000+
              客户和蓝筹客户群（Uber、Bolt、Deel、Monzo）。市场规模超过 $10B，且保持两位数增长；Veriff 经过认证的展示攻击检测和 98%+
              自动化率，支撑了溢价定价护城河。反论点有四层：市场拥挤，没有任何厂商份额超过约 15%；deepfake
              和注入攻击可能侵蚀支撑溢价定价的欺诈捕获率；锚定客户集中度未披露；最直接影响估值的是，财务数字由公司自述且未经审计，唯一公开估值点已经陈旧超过三年。论点和反论点最终都取决于同一个变量——Veriff
              能否保持持久的欺诈捕获优势。能做到，溢价倍数就有防御性；做不到，定价、留存和估值会一起压缩。
