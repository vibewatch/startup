              Onfido 在 2024 年战略出售中以约 3-4.6x 成交，说明 IDV 资产可能以远低于 Persona 和 Incode 所享高增长倍数的价格退出。若欺诈捕获能力被侵蚀，或出现监管罚款，熊市情景可把
              Veriff 压缩到 $0.7B-$0.9B 的 down-round。
            calloutType: risk
            claimRefs:
              - CV022
              - CV026
              - CV029
          - type: callout
            title: 有条件买入取决于披露
            body: 建议是在不高于 2022 年估值且带下行保护的条件下买入，前提是经审计财务能调和 $41.6M / EUR 50.2M / $100M+ 三组收入数字，并披露头部客户集中度。
            calloutType: assumption
            claimRefs:
              - CV042
              - CV037
