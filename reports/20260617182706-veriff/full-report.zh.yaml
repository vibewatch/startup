        title: 规模、牵引力与财务轨迹
        blocks:
          - type: paragraph
            body: >-
              Veriff 披露的轨迹是高速增长，并越来越接近高质量盈利。公司称 2024 年 Q4 收入同比增长 75%，验证量增长三倍、客户增长 60%；随后又称 2025 年年化收入翻过 $100M 并在 12
              月实现盈利，2025 年 Q1 盈利性收入增长超过 80%，验证量跃升 335%。LATKA 第三方数据记录 2024 年收入为 $41.6M（2023 年为 $20.2M），公司 2022
              年爱沙尼亚营业额则被报道为 7100 万欧元；这些数字与 2025 年超过 $100M 的说法放在一起，意味着 2024-2025 年收入大致翻倍。2025 年 11 月员工数约 501 人，高于 2024
              年末约 410 人，但仍低于 2022 年 12 月裁员前约 526 人的峰值。Veriff 称每季度每四个互联网用户就有一个接触其服务，认证量同比增长超过 30 倍；过去十年已验证 4
              亿人，预计未来五个月再验证 4 亿人。绝大多数量和收入仍来自美国。
