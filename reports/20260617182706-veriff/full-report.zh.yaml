          - type: paragraph
            body: >-
              Veriff 的模块对应不同客户工作流。主导工作流是新账户开户注册 / KYC：注册时用户被路由到 Veriff SDK，完成证件 + 自拍采集，调用方系统通过 webhook / API 接收决策和
              RiskScore，以决定是否放行账户创建。第二个工作流是年龄验证，服务 gaming、酒精 / 电子烟电商和受年龄保证法律约束的平台，用证件出生日期和生物识别匹配确认用户达到年龄门槛。第三个是司机 /
              工作者验证，用于 Bolt、Uber 型 mobility 和 marketplace 平台，在激活前确认驾照和身份。第四个是持续重新认证，Biometric Authentication
              让回访用户用自拍重新验证，而不是重新跑完整证件采集，降低登录、高价值交易和账户恢复摩擦。第五个是 AML/PEP 与制裁筛查，以及新增的地址证明，把同一开户注册流延展到合规检查。所有这些用例的集成模式一致：嵌入
              SDK、调用 REST API、通过 webhook 消费决策和信号，并在 Veriff Station 复核边缘案例。单一集成承载多个合规用例，是 Veriff 价值主张的核心，也驱动扩张收入。
