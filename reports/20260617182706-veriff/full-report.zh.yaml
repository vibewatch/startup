      - number: '8.3'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Veriff 七轮融资累计约 $192.3M，最后一轮 primary round 是 2022 年 1 月由 Tiger Global 和 Accel 领投的 $100M Series D，估值
              $1.5B，使其成为爱沙尼亚独角兽。此后没有披露新的 primary equity round，因此截至 2026
              年报告日期，这一估值点已陈旧超过三年。公司盈利且可自我融资，降低了近期稀释风险，但也拿走了新的第三方估值信号——没有 2024/2025 年融资来重新定价业务。按 Sacra 约 $110M ARR
              的估计，陈旧估值隐含约 13.6x trailing multiple。这个数字必须放在有争议的收入基数下阅读：LATKA 估计 2024 年只有 $41.6M，爱沙尼亚经营实体 VERIFF OU（注册代码
              12932944）申报营业额 EUR 50.2M，公司则称 run-rate 超过 $100M——这一差距会实质改变隐含倍数。因此，公开证据只能部分支持价格，不能完全支持：增长和量的信号（认证量激增 30
              倍、验证量翻三倍）与高增长倍数相符，但未经审计且相互冲突的收入数字、以及陈旧估值，意味着入场纪律应假设下行保护，而不是直接接受头部估值。
