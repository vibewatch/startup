      - number: '2.4'
        title: 增长驱动、约束与规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              三个长期驱动在扩大市场。第一，AI 生成欺诈：deepfake 和注入攻击快速上升，身份欺诈案件从 2021 到 2024 年翻了一倍多，67% 企业称 2024
              年欺诈增多（Sumsub），迫使企业持续投入活体检测和证件取证。第二，监管：KYC/AML 义务、EU AI Act 将远程生物识别身份识别列为高风险、eIDAS 2.0，以及由 UK Online Safety
              Act 牵头的一波年龄保证法律（Ofcom 最高可罚 GBP 18M 或全球营业额 10%），都创造非可选需求，并把买方基础扩到社交、gaming 和成人内容平台。第三，crypto、mobility 和
              embedded finance 的数字渠道增长。反向约束也真实存在：价格承受结构性压力（每次验证 $0.05-$3.00，企业折扣激进），市场碎片化且没有供应商份额超过
              15%，因此定价权很弱；切换成本中等（集成和合规再认证有摩擦，但多供应商并用常见）；误拒摩擦会直接伤害客户转化率，因此准确率是留存杠杆。核心尽调缺口是规模测算分歧本身：2025 年基数估算相差约 14%，CAGR
              估算相差约 5 个百分点；没有私人验证量数据，Veriff 的真实可服务份额无法核实。我们保留这些冲突，而不是用平均数抹平。
