  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Veriff 平台从采集到决策的层级。
    data:
      layers:
        - label: 采集 SDK
          detail: 移动 / 网页文档 + 自拍采集
          modules:
            - 文档照片
            - 自拍 / 活体
        - label: AI 验证
          detail: SageMaker GPU 上运行数十个 CV/ML 模型
          modules:
            - 文档认证
            - 人脸匹配
            - 被动活体
        - label: 欺诈情报
          detail: 设备 / 网络 / 行为信号汇入 RiskScore
          modules:
            - 1,000+ 信号
