      - number: '6.2'
        title: 采用与使用轨迹
        blocks:
          - type: paragraph
            body: >-
              从所有公开代理指标看，Veriff 的采用轨迹都陡峭向上。公司称 2024 年 Q4 客户数同比增长 60%、验证量增长三倍；进入 2025 年，验证量再次增长三倍，认证量同比增长超过 30
              倍——后者直接说明重复使用，因为认证验证的是现有客户的回访终端用户，而不是新用户开户注册。Veriff 称十年运营中已验证约 4 亿人，并有望仅用五个月再完成 4
              亿次验证；这一拐点既反映新客户增加，也反映现有账户使用更深。附加产品采用增长（Fraud Intelligence、Biometric Authentication 和 2025 年 Proof of
              Address）显示客户从单一验证检查扩展到同一集成上的更广合规 stack。合并来看，轨迹说明 product-market fit 强，且 land-and-expand 动能明显；不过 Veriff
              不发布活跃客户、部署数或利用率表，外部人无法精确拆分新 logo 增长和扩张。
