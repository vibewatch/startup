      - number: '6.5'
        title: 扩张、集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              Veriff 的增长模型是「先落地、再扩张」：客户先接入核心 IDV，再在同一套集成上扩到生物识别认证、欺诈情报和地址证明。账户收入上升，但销售成本不按比例增加，这与混合单客收入走高相符。反面是集中度：Sacra
              明确提示，少数大型企业账户（Uber、Bolt 这类客户）很可能贡献了不成比例的收入，因此一两个锚定账户流失或重新定价都会造成实质影响；Veriff
              也没有披露头部客户收入占比，无法量化。渠道依赖中等——采用主要靠直销（自助服务加企业销售），不是靠少数分销商，这降低了伙伴风险，但意味着获客成本由 Veriff
              自己承担。企业段的采购摩擦真实存在：安全审查、数据保护评估和生物识别合规尽调会拉长销售周期；Veriff 的 SOC 2、ISO 30107-3、FIDO
              等认证就是为了压缩这些周期。尽调里最关键的两项，是未披露的头部客户集中度，以及没有公开的留存 / 流失数据。
