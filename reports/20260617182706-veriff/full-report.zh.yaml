        title: 融资、估值与资本
        blocks:
          - type: paragraph
            body: >-
              AIN 数据显示，Veriff 七轮融资约 $192.3M；LATKA 数据库则列出相互冲突的 $92.3M，似乎漏掉了 2022 年标志性融资。关键融资事件是 2022 年 1 月完成的 $100M 轮，估值
              $1.5B，并让 Veriff 成为爱沙尼亚第六家独角兽。该轮由 Tiger Global 和 Alkeon 共同领投，老股东 IVP 和 Accel 参投。公开记录存在一个重要来源冲突：Sifted 和 AIN
              等爱沙尼亚及欧洲媒体称该轮为 Series C，其他报道（以及项目 brief）则称为 Series D。2022
              年之后，公司估值未公开重定价，任何当前评估都只能把它当作陈旧锚点。管理层称公司资产负债表稳健，重心放在盈利增长而非继续稀释；截至 2026
              年中，公司未披露新的主要股权融资。除领投方外的股权比例和董事会构成仍未披露，应列入尽调问题。
