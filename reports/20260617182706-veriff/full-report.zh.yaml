      - number: '3.3'
        title: 能力、定价与 go-to-market 对比
        blocks:
          - type: paragraph
            body: >-
              能力层面，领先纯玩家的核心趋同：证件验证、自拍 / 活体生物识别、被动呈现攻击检测、持续认证、欺诈信号情报；差异化只在自动化率、国家 / 证件覆盖和嵌入式欺诈网络的边际上。Veriff 强调高自动化率、230+
