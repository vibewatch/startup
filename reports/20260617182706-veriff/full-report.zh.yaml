      - number: '2.2'
        title: 多视角市场规模测算
        blocks:
          - type: paragraph
            body: >-
              这个市场没有一个单一数字可以定义；可信分析机构把 2025 年全球 IDV 市场集中在约 $13.75B 至 $15.65B 之间。Fortune Business Insights 估算 2025 年为
              $13.75B，MarketsandMarkets 为 $14.34B，Mordor Intelligence 为 $14.19B，The Business Research Company 为
              $15.65B。前瞻增长估算的分歧比基数更大：Mordor 给出保守模型，11.18% CAGR，到 2031 年达 $26.8B；MarketsandMarkets（15.4%，到 2030 年
              $29.32B）、The Business Research Company（16%，到 2030 年 $32.81B）和 Fortune Business Insights（15.6%，到 2034 年
              $50.58B）则集中在 15-16%。约 11% 与约 16% CAGR 的差距，是单一最大规模不确定性，会实质改变任何终值案例。对 Veriff 而言，自上而下的可服务市场窄于 headline
              TAM：其服务细分集中在金融服务（按 Mordor 约占市场 31%），外加 mobility、crypto 和在线平台，并偏向 Veriff 最大区域北美。相对于超过 $100M 的收入基数，Veriff
              在碎片化市场中只有低个位数份额；Mordor 确认没有供应商控制超过 15% 收入，因此上行空间充足，但也不存在结构性定价权。
