- id: roadmap-differentiation
  title: Roadmap, maturity and differentiation
  body: 'Veriff''s release cadence shows steady expansion from a single IDV check to a multi-product platform: Full Auto IDV (advanced to its current automated decisioning generation through 2024), Biometric Authentication for re-verification, and the 2025 AI-based Proof of Address, each adding a monetisable capability on the same integration. Maturity varies by module: core document-plus-biometric IDV and passive liveness are mature and externally certified; Fraud Intelligence/RiskScore and Biometric Authentication are growing and differentiating; Proof of Address is new (2025) and less proven. Veriff''s differentiation rests on four assets: breadth of document coverage (12,500+ types, 230+ countries), a high automation rate that lowers unit cost and latency, a cross-customer fraud-signal network that improves with scale (a data-network effect), and third-party-certified biometrics (ISO 30107-3, FIDO). The principal product risks are that competitors match coverage and automation, that
    per-verification pricing compresses, and that deepfake/injection attacks erode the fraud-capture advantage faster than models adapt. The roadmap direction — more automation, more compliance modules, deeper fraud intelligence — is coherent with both the revenue model and the threat trajectory, but execution against an accelerating fraud arms race is the key uncertainty.'
