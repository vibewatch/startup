- id: architecture
  title: Technology and operating architecture
  body: 'Veriff''s backend is a microservices architecture running on Kubernetes clusters hosted on AWS, per AWS''s own engineering account. The intelligence layer is dozens of machine-learning models spanning lightweight tree-based models to deep-learning computer-vision models that must run on GPUs for low latency; Veriff standardised this fleet on Amazon SageMaker multi-model endpoints, which it credits with cutting model deployment time by roughly 80% and reducing the cost of GPU serving (previously a hand-rolled Kubernetes GPU-sharing scheme that overprovisioned instances). On top of the ML fleet sits a fraud-signal engine that collects device and network signals and condenses them into a single RiskScore, and an identity-graph-style network that cross-references sessions to catch repeat fraudsters across customers. Critically, the architecture is explicitly hybrid: AI automation plus human-in-the-loop review, where edge cases are adjudicated by trained specialists in Veriff Station,
    and those human decisions feed back as training data. This human layer is both a quality safeguard and a cost driver. Operationally the platform exposes REST APIs, webhooks and mobile/web SDKs (documented at developers.veriff.com), supporting fast embedded integration. The dependency profile concentrates on AWS (compute, SageMaker, GPU instances), the proprietary document-template and fraud-signal datasets, and the human review workforce — each a single point of operational leverage and risk.'
  claimRefs:
  - CE012
  - CE013
