  name: Veriff
chapter:
  number: 2
  title: Market Analysis
  summary: The global identity verification market was worth roughly $14 billion in 2025 and is forecast to grow 11-16% annually, but analyst estimates diverge by ~14% on base and ~5 points on CAGR. The market is fragmented with no vendor above 15% share, pricing spans $0.05-$3.00 per verification, and growth is driven by AI/deepfake fraud, age-assurance laws, the EU AI Act and KYC/AML. Veriff serves financial services, mobility, crypto and marketplaces, skews to North America, and holds low-single-digit share.
sections:
- id: market-boundary
  title: Market boundary, adjacencies and substitutes
  body: 'Veriff sells into the identity verification (IDV) and authentication market: the spend organisations make to remotely confirm that a person is who they claim to be, typically by validating a government-issued document and matching it to a live selfie with biometric liveness. Included spend covers document verification, biometric/liveness checks, ongoing biometric authentication, age assurance and the fraud-signal intelligence layered on top, usually priced per verification or as enterprise subscriptions. Excluded from the core boundary are adjacent categories that buyers often purchase separately: transaction-fraud and payments-risk scoring, device fingerprinting, AML transaction monitoring, sanctions/PEP screening, and full customer-data platforms. The nearest adjacency is the broader digital-identity solutions market, which wraps credentialing, reusable identity wallets and government eID into the lifecycle. Status-quo substitutes remain meaningful: manual or in-branch document
    review, knowledge-based authentication, credit-bureau lookups, and in-house build by large platforms. Switch Labs counts 27+ major vendors across five capability categories and notes that no single vendor covers all categories, so buyers frequently assemble two or three complementary tools rather than one suite. Veriff positions at the document-plus-biometric core while extending into authentication and proof of address.'
  claimRefs:
