- id: drivers-constraints
  title: Growth drivers, constraints and sizing gaps
  body: 'Three secular drivers expand the market. First, AI-generated fraud: deepfake and injection attacks are rising fast, identity-fraud cases more than doubled from 2021 to 2024 and 67% of companies reported more fraud in 2024 (Sumsub), forcing continuous investment in liveness and document forensics. Second, regulation: KYC/AML obligations, the EU AI Act''s classification of remote biometric identification as high-risk, eIDAS 2.0, and a wave of age-assurance laws led by the UK Online Safety Act (Ofcom can fine up to GBP 18M or 10% of global turnover) all create non-discretionary demand and widen the buyer base into social, gaming and adult-content platforms. Third, digital-channel growth in crypto, mobility and embedded finance. Counterweighting constraints are real: pricing is under structural pressure ($0.05-$3.00 per verification with aggressive enterprise discounting), the market is fragmented with no vendor above 15% share so there is little pricing power, switching costs are moderate
    (integration and compliance re-certification, but multi-homing is common), and false-reject friction directly harms customers'' conversion, making accuracy a retention lever. The dominant diligence gap is the sizing spread itself: 2025 base estimates differ by ~14% and CAGR estimates by ~5 points, and Veriff''s true serviceable share is unverifiable without private volume data. We preserve these conflicts rather than averaging them away.'
