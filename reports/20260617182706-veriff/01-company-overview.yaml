  - TO003
- id: scale-traction-financials
  title: Scale, traction and financial trajectory
  body: Veriff's disclosed trajectory is one of rapid, increasingly profitable growth. The company reported 75% year-over-year revenue growth in Q4 2024 while tripling verification volumes and growing customers 60%, then said it doubled annual revenue past $100 million and reached profitability by December 2025, with Q1 2025 showing 80%+ profitable revenue growth and a 335% jump in verification volumes. Third-party data from LATKA recorded 2024 revenue of $41.6M (up from $20.2M in 2023), and the company's 2022 Estonian turnover was reported at 71 million euros; these figures, taken with the over-$100M 2025 claim, imply revenue roughly doubled across 2024-2025. Headcount stands at about 501 as of November 2025, up from roughly 410 at end-2024 but still below the ~526 peak of December 2022 that preceded the layoffs. Veriff claims that every fourth internet user interacts with its services each quarter and that authentication volumes grew more than 30-fold year-over-year, having verified 400
    million people over a decade with another 400 million projected in five months. The vast majority of volume and revenue still comes from the United States.
  claimRefs:
