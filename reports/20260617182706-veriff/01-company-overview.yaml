company:
  name: Veriff
chapter:
  number: 1
  title: Company Overview
  summary: Veriff is a Tallinn-founded, AI-native identity verification company that reached a $1.5B valuation in 2022 and reports doubling revenue past $100M with profitability by December 2025, though its valuation is stale and leadership is founder-concentrated.
sections:
- id: identity-and-product
  title: Identity, founding and product
  body: 'Veriff is a global, AI-native identity verification (IDV) company founded in 2015 and headquartered in Tallinn, Estonia, with offices in New York, London, Barcelona and a new Americas hub in Sao Paulo. It was founded by Kaarel Kotkas, who remains Founder and CEO, alongside co-founder Janer Gorohhov, and is an alumnus of the Y Combinator accelerator. The company sells identity-verification-as-a-service: a platform that combines automated AI document and biometric checks with human-in-the-loop review to verify government-issued IDs and selfies online, typically returning a decision in around six seconds. Its founding context is Estonia''s advanced national digital-identity infrastructure, the same ecosystem that produced Skype, Wise and Bolt. Veriff positions itself not as a one-time onboarding compliance check but as a continuously improving ''global trust layer'' that authenticates users across the customer journey. The company holds ISO/IEC 27001:2022, SOC 2 Type II and ISO/IEC
    30107-3 biometric certifications, underpinning its enterprise positioning.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
