- id: funding-and-capital
  title: Funding, valuation and capital
  body: 'Veriff has raised approximately $192.3 million across seven investment rounds, according to AIN, although the LATKA database lists a conflicting $92.3M that appears to omit the headline 2022 round. The defining financing event was a $100 million round closed in January 2022 that valued the company at $1.5 billion and made Veriff Estonia''s sixth unicorn. That round was co-led by Tiger Global and Alkeon, with participation from existing investors IVP and Accel. A notable provenance conflict exists in the public record: Estonian and European outlets such as Sifted and AIN describe the round as a Series C, while other coverage (and the engagement brief) label it a Series D. The valuation has not been publicly re-priced since 2022, making it a stale anchor for any current assessment. Management describes the company as maintaining a solid balance sheet and focusing on profitable growth rather than further dilution, and no new primary equity round has been disclosed through mid-2026.
    Ownership percentages and board composition beyond the lead investors remain undisclosed and are flagged as diligence asks.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO031
  - CO032
