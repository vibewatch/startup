- id: milestones-and-adverse
  title: Milestones, leadership and adverse events
  body: Veriff's chronology runs from its 2015 founding and Y Combinator validation through its 2022 unicorn round to its 2025 profitability milestone. Product milestones include the 2024 release of Full Auto IDV v3 and Biometric Authentication enhancements, the 2025 launch of an AI-based Proof of Address product, and a 2025 CyberSecurity Breakthrough Award for Fraud Prevention Solution of the Year. Geographic milestones include the May 2025 opening of an Americas headquarters in Sao Paulo backed by a $3 million-plus regional investment. The most material adverse event was a February 2023 layoff of 12% of staff (66 people, 42 of them in Estonia), executed roughly a year after the unicorn round amid the broader tech downturn; the company retained just over 500 employees. Leadership is concentrated around founder-CEO Kaarel Kotkas, who is the company's primary public voice, supported by co-founder Janer Gorohhov and a third-party-reported C-suite (CFO, COO, CRO, VP Legal). This founder concentration
    is a genuine key-person dependency, and governance disclosure beyond the founders and lead investors is thin.
