chapter:
  number: 7
  title: Risks
  summary: 'Veriff''s risk profile is dominated by two structural exposures: (1) dense, tightening biometric regulation — GDPR Article 9 special-category data, EU AI Act high-risk classification for remote biometric ID, UK Online Safety Act age-assurance duties (Ofcom fines to GBP 18M/10% turnover), and US BIPA, where a direct peer (Incode) already settled a class action for $4M; and (2) the deepfake/injection fraud arms race (a deepfake attack roughly every five minutes, forgeries +244%, injection attacks +88%) that threatens the fraud-capture rates underpinning premium pricing. Secondary risks are undisclosed top-customer concentration, AWS cloud dependency, per-verification price compression (no vendor >15% share; $0.05-$3.00 pricing), key-person dependence on founder-CEO Kaarel Kotkas, the 2023 12% layoff, unaudited/conflicting financials, and a stale January 2022 $1.5B valuation. The thesis-break trigger is a sustained fraud-capture decline or a material regulatory fine or anchor-customer
    loss.'
sections:
- id: risk-overview
  title: Severity-ranked risk overview
  body: 'Veriff''s risk profile is dominated by two structural exposures and a set of secondary ones. The first structural risk is regulatory/legal: as an EU-headquartered processor of biometric and government-identity data, Veriff sits squarely under the GDPR''s Article 9 special-category regime, the EU AI Act''s high-risk classification for remote biometric identification, the UK Online Safety Act''s age-assurance duties, and US state biometric-privacy statutes (BIPA) that have already produced multi-million-dollar settlements against peers. The second structural risk is the deepfake/injection fraud arms race: industry data shows a deepfake attack roughly every five minutes, forgeries up 244% and injection attacks up 88%, directly threatening the fraud-capture rates that justify Veriff''s premium pricing. Secondary risks include customer concentration (a few large accounts likely dominate revenue), cloud-dependency on AWS, competition and per-verification price compression, key-person
    dependence on founder-CEO Kaarel Kotkas, and a stale January 2022 valuation. Ranking by residual exposure, regulatory/biometric-privacy and deepfake-driven model degradation are the highest (high likelihood, high impact, partially mitigated); concentration, pricing and key-person are medium; cloud outage and execution are lower. The investment implication is that the thesis rests on Veriff staying ahead of both regulators and fraudsters simultaneously.'
