- id: people-financial
  title: People, execution and financial/model risk
  body: 'People and execution: Veriff is closely identified with founder-CEO Kaarel Kotkas, a key-person dependency typical of founder-led scale-ups; his departure would create strategic and morale risk. The February 2023 layoff of 12% of staff (66 people) shows the company has already had to right-size, and sustaining hiring quality through rapid LATAM/APAC expansion while competing for scarce AI talent is an execution risk. Financial/model risk: although profitable, Veriff''s headline figures are company-stated and unaudited, and public revenue figures conflict (LATKA $41.6M for 2024 versus run-rate $100M+), so the financial model carries disclosure uncertainty. Margin-compression risk is real because no provider holds more than ~15% share and per-verification pricing spans $0.05-$3.00, so low-cost entrants can pressure Veriff''s premium. Valuation risk is the stale January 2022 $1.5B mark: with no fresh primary round, the current fair value is unverified and a down-round is conceivable
    if growth or sentiment slips. The unifying financial-model risk is that the premium thesis depends on durable fraud-capture superiority; if that erodes (the deepfake risk above), pricing, retention and valuation all compress together. Mitigations and thesis-break triggers are set out in the kill-criteria table.'
