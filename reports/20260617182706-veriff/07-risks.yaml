- id: regulatory-legal
  title: Regulatory and legal risk
  body: 'Veriff''s regulatory exposure is broad and tightening. Under GDPR Article 9, biometric data processed for uniquely identifying a person is a prohibited special category unless an exemption such as explicit consent applies, so Veriff''s lawful basis depends on robust, auditable consent flows at every customer — a single defective consent implementation can create liability. The EU AI Act classifies remote biometric identification as high-risk and imposes provider obligations (conformity assessment, transparency, human oversight, logging) that reach third-country providers whose output is used in the EU; as an EU provider Veriff is directly in scope, and the EDPB''s 2024 opinion on AI models and GDPR adds uncertainty about lawful basis and training-data provenance. In the UK, the Online Safety Act mandates highly effective age assurance with Ofcom able to fine up to GBP 18 million or 10% of global turnover — a demand tailwind but also a liability surface if accuracy is challenged.
    In the US, the Illinois Biometric Information Privacy Act (BIPA) creates a private right of action with statutory damages; a direct peer, Incode, settled a BIPA class action for $4 million, evidencing that the same litigation theory (collecting facial-geometry biometrics without compliant consent) is a live, sector-wide exposure for Veriff''s US operations. eIDAS/eIDAS 2.0 and AML/KYC obligations round out a dense compliance map. The residual exposure is high: certifications mitigate technical conformity but not consent-flow or cross-border-transfer liability.'
  claimRefs:
  - CR007
