- id: operational-security
  title: Operational, quality and security risk
  body: 'The defining operational risk is fraud-model degradation under the deepfake and injection-attack surge. Veriff''s value rests on high fraud-capture and automation rates; if AI-generated deepfakes, synthetic identities and camera-bypassing injection attacks improve faster than detection, capture rates fall exactly when customers depend on them most, eroding both trust and the premium pricing the business model assumes. Industry evidence is stark: a deepfake attack roughly every five minutes, forgeries up 244%, injection attacks up 88%, and fraud roughly doubling 2021-2024 with 67% of firms reporting increases. A related quality risk is false rejections: tightening thresholds to catch deepfakes raises false-negative rates that frustrate legitimate users and harm customers'' conversion — a direct tension between security and usability already visible in end-user reviews. Security/availability risk is concentrated in the AWS dependency: the platform runs on Kubernetes clusters and SageMaker
    on AWS, so a major AWS regional outage or a Veriff-side breach of biometric data would be high-impact (operational downtime plus regulatory breach exposure under GDPR). Veriff mitigates with SOC 2 Type II, ISO/IEC 30107-3 (iBeta-tested) presentation-attack detection and FIDO certification, plus a human-in-the-loop review layer, but these are point-in-time controls against a continuously evolving adversary, leaving meaningful residual exposure.'
  claimRefs:
  - CR014
  - CR015
