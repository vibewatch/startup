runDate: '2026-06-17'
company:
  name: Veriff
chapter:
  number: 4
  title: Financials
  summary: 'Veriff runs a usage-based, per-verification model ($0.80-$1.89 self-serve) with expanding add-ons. Sacra estimates $110M ARR in 2025 (+83% from ~$60M), profitable, across 3,000+ customers at ~$37K blended revenue each, though LATKA''s $41.6M for 2024 conflicts and revenue is concentrated in a few large accounts. The 2023 12% layoff reset the cost base; automation lifts margins but compute-plus-human-review caps them below best-in-class SaaS. Capital adequacy is strong: ~$192.3M raised, profitable/self-funding, no disclosed debt, but a stale 2022 $1.5B mark. The binding constraint is that no audited financials, margins, retention, CAC, burn or cash are public.'
sections:
- id: revenue-streams-pricing
  title: Revenue streams, pricing and monetization
  body: 'Veriff is a B2B, usage-based business: customers pay per verification session rather than per seat, which ties revenue directly to their onboarding and authentication volumes. The primary revenue stream is core document-plus-biometric identity verification; layered on top are higher-value streams that expand revenue per account: ongoing biometric authentication (re-verification of returning users), fraud-signal intelligence, PEP and sanctions screening as per-verification add-ons, ongoing monitoring billed as a recurring fee per subject, and, since mid-2025, an AI-based Proof of Address product that adds a new monetisable verification type. Per Sacra, self-serve pricing runs from $0.80 per verification on the entry Full Auto plan up to $1.89 on the Premium tier, with monthly minimums starting at $49; enterprise contracts are negotiated and discounted below list. This usage model means revenue compounds with customers'' growth and with cross-sell into authentication and screening,
    but it also exposes Veriff to volume seasonality and to per-verification price compression in a market where list pricing spans $0.05-$3.00. Revenue recognition is straightforward for usage fees but the recurring monitoring and minimum-commitment components introduce a subscription element that improves predictability.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI030
  tableRefs:
  - TI001
  - TI002
  figureRefs:
