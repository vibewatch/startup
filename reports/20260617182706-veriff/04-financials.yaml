- id: gtm-efficiency
  title: Go-to-market motion and sales efficiency
  body: 'Veriff runs a hybrid go-to-market: a developer-led, self-serve motion (published pricing, API/SDK onboarding, $49 monthly minimums) that lands mid-market and product-led customers cheaply, alongside an enterprise sales motion for marquee accounts like Uber, Bolt, Western Union and Webull. Public data does not disclose CAC, payback or sales-cycle length, so sales efficiency must be inferred from proxies. The strongest proxy is the 2024 disclosure of 75% year-over-year Q4 revenue growth with customers up 60% and volumes tripling, followed by Sacra''s estimate of 83% ARR growth in 2025 to $110M while reaching profitability: growing that fast while turning profitable implies efficient customer acquisition and meaningful net revenue expansion from existing accounts, since blended revenue per customer rose as volumes per customer increased. The self-serve tier lowers CAC for the long tail, while the cross-customer fraud network and per-verification add-ons drive expansion without proportional
    sales cost. The principal unknowns are the split of new-logo versus expansion revenue, gross and net retention, and the cost of the enterprise sales motion, none of which Veriff discloses publicly.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI031
  - CI032
- id: cost-margin-cash
  title: Cost structure, margins and cash generation
  body: 'Veriff''s cost structure blends a high-gross-margin software core with two cost drivers that are heavier than a pure-SaaS company: cloud/compute for running dozens of AI models per verification (the platform runs 1,000+ signals per session on AWS infrastructure) and a ''human-in-the-loop'' review workforce that adjudicates edge cases. These give IDV a lower gross margin than typical SaaS, though Veriff''s high automation rate (the Full Auto product) is explicitly designed to push more volume through machines and lift margins as it scales. Reaching profitability in 2025 on roughly $110M ARR, after the February 2023 layoff of 12% of staff (66 people) that reset the cost base, indicates operating leverage is now positive and that the compute-plus-review cost curve is bending favourably with automation and volume. Working capital and capex are not disclosed but are likely modest for a cloud-native software business with no manufacturing. The combination of usage-based revenue, positive
    operating margin and no disclosed debt suggests Veriff is now self-funding from operations, a material change from the cash-burning growth posture that accompanied the 2022 unicorn round. Audited margin figures are not public, so the profitability claim is company-stated and unverified.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI033
  figureRefs:
  - FI004
- id: traction-capital
  title: Public traction and capital adequacy
  body: 'Public traction is strong but the precise revenue base is contested. Veriff and press state revenue doubled past $100M in 2025 with profitability; Sacra estimates $110M ARR (up 83% from ~$60M in 2024); LATKA, by contrast, recorded only $41.6M for 2024 (up from $20.2M in 2023), a material conflict that likely reflects different definitions (billed revenue versus run-rate ARR) and timing. Non-revenue traction is unambiguous: verification volumes tripled and authentication volumes grew more than 30-fold year-over-year, 3,000+ business customers, ~501 employees, and 400 million people verified over a decade with another 400 million projected in five months. On capital adequacy, Veriff raised roughly $192.3M in total, headlined by the $100M round of January 2022 at a $1.5B valuation, and has disclosed no new primary equity round since; management describes a solid balance sheet and there is secondary-market trading activity (per PM Insights) but no fresh primary mark. With profitability
    reached and no disclosed debt or project-finance obligations, Veriff''s financing dependency is low and there is no near-term forced-raise trigger, though the absence of a recent priced round leaves valuation stale. Burn, runway and cash-on-hand are undisclosed.'
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
