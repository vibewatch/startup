- id: verdict-gaps
  title: Financial verdict and diligence blockers
  body: 'On revenue quality, Veriff scores well: usage-based, recurring-leaning revenue across a diversified 3,000+ customer base, growing 75-83% while turning profitable, with expanding revenue per account. The principal quality caveats are customer concentration (a small number of large enterprise accounts likely drive a disproportionate share of revenue, per Sacra) and the conflicting public revenue figures. On margin path, the trajectory is positive: automation lifts gross margin and 2025 profitability proves operating leverage, but IDV''s compute-plus-human-review cost base caps margins below best-in-class SaaS. Capital intensity is low and self-funding is plausible. The binding diligence blockers are all private-data gaps: no audited financials, no disclosed gross/net retention, CAC/payback, gross margin, burn, runway, cash balance, or revenue-by-segment, and a stale 2022 valuation. These gaps mean every favourable claim (revenue scale, profitability, efficiency) rests on company statements
    and third-party estimates rather than audited evidence, and must be confirmed under NDA before underwriting a price.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI036
