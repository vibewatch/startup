- id: moat-switching
  title: Switching costs, moat durability and displacement risk
  body: 'Switching costs in IDV are real but moderate: integration work, compliance re-certification, and tuning fraud thresholds create friction, yet multi-homing is common because buyers route verifications across two or three vendors for coverage, redundancy and price leverage, which caps any single vendor''s lock-in. Veriff''s most defensible assets are its cross-customer fraud-signal network (which compounds with volume), its breadth of document and country coverage, and its automation rate, all of which improve with scale and are hard to replicate quickly. Weaker moats: pricing power is constrained by fragmentation and self-serve transparency, and the core document-plus-selfie check is increasingly commoditised. The most material displacement risks are (1) deepfake and digital-injection attacks that can erode the accuracy advantage of any vendor that fails to keep pace, with Jumio reporting injection attacks up 88%; (2) better-capitalised entrants such as Persona ($2B) and Incode (seeking
    $3B) outspending Veriff on R&D and GTM; (3) incumbents like Entrust bundling IDV into broader security/credentialing suites; and (4) the long-run risk that government eID wallets (eIDAS 2.0) and reusable identity reduce the need for repeated third-party verification. Veriff''s stale 2022 valuation, set well before peers'' 2025 raises, signals relative momentum risk.'
  claimRefs:
