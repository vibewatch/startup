companyProfile:
  summary: >-
    Veriff is a global, AI-native identity verification company headquartered in Tallinn,
    Estonia, with offices in New York and Barcelona. Founded in 2015, it provides automated
    document and biometric identity verification and authentication to fintech, crypto,
    mobility, marketplace and gaming customers worldwide. It reached roughly $110M ARR in
    2025 (about 83% growth) and is profitable, but its last primary round and valuation mark
    date to January 2022.
  foundedDate: '2015-01-01'
  founders:
