      background: Estonian entrepreneur who founded Veriff in 2015 at age 19.
      claimRefs: [CO003, CO004]
    - name: Janer Gorohhov
      role: Co-founder
      background: Co-founded Veriff and has held senior product leadership roles.
      claimRefs: [CO003]
  foundingLocation: Tallinn, Estonia
  headquarters: Tallinn, Estonia
  productSummary: >-
    AI-powered identity verification (document + selfie liveness check), biometric
    authentication, and automated fraud signals delivered as an API-first, white-label
    platform covering 11,000+ document types from 230+ countries.
  customerFocus: >-
    Fraud, compliance and growth owners at fintech, crypto, neobanking, mobility,
    marketplace and gaming companies; customers include Uber, Bolt, Deel, Monzo and Webull.
  businessModel: >-
