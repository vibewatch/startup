chapter:
  number: 6
  title: Customers
  summary: 'Veriff serves 3,000+ B2B customers across fintech, crypto, mobility, marketplaces and gaming, bimodal between self-serve mid-market and marquee enterprise accounts (Uber, Bolt, Instacart, Western Union, Bumble, Deel, Monzo, Webull, Blockchain.com). Adoption is steep: customers +60% YoY (Q4''24), verification volumes tripling, and authentication volumes up 30x — a strong repeat-usage and land-and-expand signal implying high net retention, though NRR/GRR/churn are undisclosed. Named references (Bolt, Webull, Uber, Instacart) are production deployments corroborated across independent domains, and Veriff was a G2 Leader across all three 2025 reports. The offsetting risks are undisclosed top-customer concentration (Sacra flags a few large accounts dominate revenue) and a consistent minority of end-user false-rejection complaints with weak dispute resolution.'
sections:
- id: segmentation
  title: Customer base and segmentation
  body: 'Veriff''s customer base is a B2B mix of high-growth digital platforms and regulated financial institutions, spanning fintech, crypto, neobanking, mobility, marketplaces and gaming. By Sacra''s estimate the base stands at 3,000+ business customers worldwide, served on usage-based contracts. The buyer is typically a fraud, compliance or growth owner at the customer; the user is the customer''s end user completing onboarding; the payer is the customer business. Segmentation by size is bimodal: a self-serve, developer-led tier (published pricing, $49 monthly minimums) lands mid-market and product-led companies, while an enterprise tier serves marquee accounts. Named enterprise customers include Uber, Bolt, Instacart, Western Union, Bumble, Deel, Monzo, Webull, Blockchain.com and Starship, plus Trustpilot — a span that maps onto mobility, marketplaces, dating, HR/payroll, neobanking, investing and crypto. By geography the base is global with the US the largest single market and LATAM
    (e.g. Kueski, Valr in adjacent markets) the fastest-growing. This is a diversified base by vertical and geography, but Sacra cautions that a small number of large enterprise accounts likely drive a disproportionate share of revenue, so segment-level diversification does not eliminate revenue concentration.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption and usage trajectory
  body: Veriff's adoption trajectory is steeply positive on every public proxy. The company reported customer count up 60% year-over-year in Q4 2024 and verification volumes tripling, and into 2025 verification volumes again tripled while authentication volumes grew more than 30-fold year-over-year — the latter a direct signal of repeat usage, because authentication re-verifies returning end users of existing customers rather than onboarding new ones. Veriff states it has verified roughly 400 million people over its decade of operation and is on track to complete another 400 million verifications in just five months, an inflection that reflects both new-customer additions and deeper usage within existing accounts. The growth of add-on adoption (Fraud Intelligence, Biometric Authentication and the 2025 Proof of Address) shows customers expanding from a single verification check into a broader compliance stack on the same integration. Taken together, the trajectory indicates strong product-market
    fit and a land-and-expand dynamic, though Veriff does not publish active-customer, deployment-count or utilisation tables that would let an outsider separate new-logo growth from expansion precisely.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU031
  - CU039
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-proof
  title: Named customer proof
  body: 'Veriff''s reference quality is strong: it has multiple production deployments with named, recognisable global brands corroborated across independent domains. Bolt, the European mobility super-app, publicly partnered with Veriff to speed driver and rider onboarding and prevent identity fraud, documented in both a PR Newswire release and independent trade press (The Paypers). Webull, the global investing platform, is a documented production customer via Veriff''s own case study and is named again in the Trust Awards boilerplate. Uber and Instacart are both named 2025 Veriff Trust Award winners and independently named by Sacra as enterprise accounts, evidencing production usage at scale in mobility and marketplaces. These are production deployments (not pilots) gating real onboarding flows, with evidence freshness ranging from 2022 (Bolt) to 2025-2026 (Trust Awards, Sacra). The named-customer proof table samples this set; it is not exhaustive of the 3,000+ base, and most outcome metrics
    (conversion lift, fraud reduction) are customer-attributed or company-published rather than independently audited, which caps reference quality below fully verified.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU032
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention
  title: Retention, satisfaction and durability
  body: 'Direct retention metrics — NRR, GRR, churn and contract length — are not disclosed by Veriff, so durability must be inferred from proxies. The strongest positive proxy is the 30-fold year-over-year growth in authentication volumes and tripling verification volumes: such growth on a usage-based model is only possible if existing customers are retaining and expanding usage, implying high net revenue retention. Satisfaction proxies are also favourable: Veriff was named a Leader in the G2 Spring, Summer and Autumn 2025 reports and rates above 4/5 on aggregate review sites (Software Advice, G2). The principal negative signal is end-user experience: a consistent minority of Trustpilot and G2 reviews report false rejections, verification failures and weak dispute resolution. Veriff''s own position is that many such complaints come from blocked fraudsters rather than legitimate users, which is partly true for an IDV vendor but also a convenient framing that does not fully address genuine
    false-negative harm. For the paying customer (the business), the durability signal is strong; for the end user, the satisfaction picture is mixed and a latent churn risk if false-rejection rates frustrate the customer''s own conversion goals.'
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU033
  - CU034
  - CU037
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration
  title: Expansion, concentration and procurement risk
  body: 'Veriff''s growth model is land-and-expand: customers land on core IDV and expand into biometric authentication, fraud intelligence and proof-of-address on the same integration, lifting revenue per account without proportional sales cost — consistent with rising blended revenue per customer. The flip side is concentration: Sacra explicitly flags that a small number of large enterprise accounts (the Ubers and Bolts) likely account for a disproportionate share of revenue, so the loss or repricing of one or two anchor accounts would be material, and Veriff does not disclose top-customer revenue share to quantify it. Channel dependence is moderate — adoption is largely direct (self-serve plus enterprise sales) rather than reliant on a few resellers — which reduces partner risk but means Veriff owns its own acquisition cost. Procurement friction is real in the enterprise segment, where security review, data-protection assessment and biometric-compliance diligence lengthen sales cycles,
    though Veriff''s certifications (SOC 2, ISO 30107-3, FIDO) are designed to shorten them. The binding diligence items are the undisclosed top-customer concentration and the absence of disclosed retention/churn data.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU035
  - CU038
