  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Veriff's risk profile is dominated by two structural exposures and a set of secondary ones. The first
              structural risk is regulatory/legal: as an EU-headquartered processor of biometric and government-identity
              data, Veriff sits squarely under the GDPR's Article 9 special-category regime, the EU AI Act's high-risk
              classification for remote biometric identification, the UK Online Safety Act's age-assurance duties, and
              US state biometric-privacy statutes (BIPA) that have already produced multi-million-dollar settlements
              against peers. The second structural risk is the deepfake/injection fraud arms race: industry data shows a
              deepfake attack roughly every five minutes, forgeries up 244% and injection attacks up 88%, directly
              threatening the fraud-capture rates that justify Veriff's premium pricing. Secondary risks include
              customer concentration (a few large accounts likely dominate revenue), cloud-dependency on AWS,
              competition and per-verification price compression, key-person dependence on founder-CEO Kaarel Kotkas,
              and a stale January 2022 valuation. Ranking by residual exposure, regulatory/biometric-privacy and
              deepfake-driven model degradation are the highest (high likelihood, high impact, partially mitigated);
              concentration, pricing and key-person are medium; cloud outage and execution are lower. The investment
              implication is that the thesis rests on Veriff staying ahead of both regulators and fraudsters
              simultaneously.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR040
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR040
      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Veriff's regulatory exposure is broad and tightening. Under GDPR Article 9, biometric data processed for
              uniquely identifying a person is a prohibited special category unless an exemption such as explicit
              consent applies, so Veriff's lawful basis depends on robust, auditable consent flows at every customer — a
              single defective consent implementation can create liability. The EU AI Act classifies remote biometric
              identification as high-risk and imposes provider obligations (conformity assessment, transparency, human
              oversight, logging) that reach third-country providers whose output is used in the EU; as an EU provider
              Veriff is directly in scope, and the EDPB's 2024 opinion on AI models and GDPR adds uncertainty about
              lawful basis and training-data provenance. In the UK, the Online Safety Act mandates highly effective age
              assurance with Ofcom able to fine up to GBP 18 million or 10% of global turnover — a demand tailwind but
              also a liability surface if accuracy is challenged. In the US, the Illinois Biometric Information Privacy
              Act (BIPA) creates a private right of action with statutory damages; a direct peer, Incode, settled a BIPA
              class action for $4 million, evidencing that the same litigation theory (collecting facial-geometry
              biometrics without compliant consent) is a live, sector-wide exposure for Veriff's US operations.
              eIDAS/eIDAS 2.0 and AML/KYC obligations round out a dense compliance map. The residual exposure is high:
              certifications mitigate technical conformity but not consent-flow or cross-border-transfer liability.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR041
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Operational, quality and security risk
        blocks:
          - type: paragraph
            body: >-
              The defining operational risk is fraud-model degradation under the deepfake and injection-attack surge.
              Veriff's value rests on high fraud-capture and automation rates; if AI-generated deepfakes, synthetic
              identities and camera-bypassing injection attacks improve faster than detection, capture rates fall
              exactly when customers depend on them most, eroding both trust and the premium pricing the business model
              assumes. Industry evidence is stark: a deepfake attack roughly every five minutes, forgeries up 244%,
              injection attacks up 88%, and fraud roughly doubling 2021-2024 with 67% of firms reporting increases. A
              related quality risk is false rejections: tightening thresholds to catch deepfakes raises false-negative
              rates that frustrate legitimate users and harm customers' conversion — a direct tension between security
              and usability already visible in end-user reviews. Security/availability risk is concentrated in the AWS
              dependency: the platform runs on Kubernetes clusters and SageMaker on AWS, so a major AWS regional outage
              or a Veriff-side breach of biometric data would be high-impact (operational downtime plus regulatory
              breach exposure under GDPR). Veriff mitigates with SOC 2 Type II, ISO/IEC 30107-3 (iBeta-tested)
              presentation-attack detection and FIDO certification, plus a human-in-the-loop review layer, but these are
              point-in-time controls against a continuously evolving adversary, leaving meaningful residual exposure.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR042
          - type: table
            tableRef: TR002
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
          - type: figure
