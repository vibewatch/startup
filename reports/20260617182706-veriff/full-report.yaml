              geography the base is global with the US the largest single market and LATAM (e.g. Kueski, Valr in
              adjacent markets) the fastest-growing. This is a diversified base by vertical and geography, but Sacra
              cautions that a small number of large enterprise accounts likely drive a disproportionate share of
