      - number: '2.2'
        title: Market sizing across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single number defines this market; credible analysts cluster the 2025 global IDV market between roughly
              $13.75 billion and $15.65 billion. Fortune Business Insights values 2025 at $13.75B, MarketsandMarkets at
              $14.34B, Mordor Intelligence at $14.19B, and The Business Research Company at $15.65B. Forward growth
              estimates diverge more widely than the base: Mordor models a conservative 11.18% CAGR to $26.8B by 2031,
              while MarketsandMarkets (15.4% to $29.32B by 2030), The Business Research Company (16% to $32.81B by 2030)
              and Fortune Business Insights (15.6% to $50.58B by 2034) cluster around 15-16%. The spread between an ~11%
              and ~16% CAGR is the single largest sizing uncertainty and materially changes any terminal-value case. For
              Veriff specifically, a top-down serviceable market is narrower than the headline TAM: its served segments
              concentrate in financial services (about 31% of the market per Mordor), plus mobility, crypto and online
              platforms, and skew to North America, Veriff's largest region. Against an over-$100M revenue base, Veriff
              holds low-single-digit share of a fragmented market where Mordor confirms no provider controls more than
              15% of revenue, leaving substantial headroom but also no structural pricing power.
