            body: >-
              Onfido cleared at roughly 3-4.6x in a 2024 strategic sale, showing IDV assets can exit well below the
              high-growth multiples Persona and Incode command. A bear case of fraud-capture erosion or a regulatory
              fine could compress Veriff to a $0.7B-$0.9B down-round.
            calloutType: risk
            claimRefs:
              - CV022
