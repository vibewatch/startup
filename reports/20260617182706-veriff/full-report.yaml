      - number: '7.4'
        title: Partner, dependency and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Veriff's dependency map concentrates on a few nodes. Cloud: AWS underpins compute, GPU model serving
              (SageMaker) and storage, so AWS pricing, availability and policy changes flow straight to Veriff's cost
              and uptime. Customers: Sacra flags that a small number of large enterprise accounts (e.g. Uber, Bolt)
              likely drive a disproportionate share of revenue, so losing or repricing one or two anchors would be
              material, and Veriff does not disclose top-customer share to bound the risk. Certification bodies:
              Veriff's trust posture depends on third parties (iBeta for ISO 30107-3, the FIDO Alliance, SOC 2
              auditors); a lapsed or downgraded certification would weaken enterprise sales. Capital: although
              profitable and self-funding, Veriff has not raised primary equity since 2022, so any future capital need
              would test investor appetite at a higher bar than the 2022 mark. Regulators are themselves a dependency,
              since enforcement posture (EU AI Act implementation, Ofcom, US state AGs) can change addressable demand
              and compliance cost overnight. The partner risks are individually manageable but collectively mean
              Veriff's continuity relies on AWS uptime, a handful of anchor customers and continued certification — a
              concentrated dependency stack.
            claimRefs:
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR043
