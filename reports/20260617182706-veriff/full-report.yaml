  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing and monetization
        blocks:
          - type: paragraph
            body: >-
              Veriff is a B2B, usage-based business: customers pay per verification session rather than per seat, which
              ties revenue directly to their onboarding and authentication volumes. The primary revenue stream is core
              document-plus-biometric identity verification; layered on top are higher-value streams that expand revenue
              per account: ongoing biometric authentication (re-verification of returning users), fraud-signal
              intelligence, PEP and sanctions screening as per-verification add-ons, ongoing monitoring billed as a
              recurring fee per subject, and, since mid-2025, an AI-based Proof of Address product that adds a new
              monetisable verification type. Per Sacra, self-serve pricing runs from $0.80 per verification on the entry
              Full Auto plan up to $1.89 on the Premium tier, with monthly minimums starting at $49; enterprise
              contracts are negotiated and discounted below list. This usage model means revenue compounds with
              customers' growth and with cross-sell into authentication and screening, but it also exposes Veriff to
              volume seasonality and to per-verification price compression in a market where list pricing spans
              $0.05-$3.00. Revenue recognition is straightforward for usage fees but the recurring monitoring and
              minimum-commitment components introduce a subscription element that improves predictability.
            claimRefs:
