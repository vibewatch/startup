      - number: '8.2'
        title: Recommendation, confidence and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation is a conditional buy/hold: Veriff's fundamentals (profitable, ~$110M ARR, ~83% growth)
              are attractive, but the stale 2022 mark and disclosure gaps warrant entry at or below the $1.5B valuation
              with structural downside protection. Confidence is medium because the financial base is unaudited and
              company-stated and the valuation mark is over three years old. The risk rating is medium-high, driven by
              the regulatory/biometric and deepfake-fraud exposures detailed in the risks chapter. The valuation stance
              is cautious-constructive: fundamentals likely support — and may exceed — the 2022 mark, but the absence of
              a fresh primary round leaves fair value unverified. The headline KPIs (ARR ~$110M, growth ~83%, $192.3M
              raised, $1.5B last mark, ~13.6x implied multiple, 3,000+ customers) frame an asset whose quality is high
              but whose price is unconfirmed.
            claimRefs:
              - CV002
