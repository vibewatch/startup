      - number: '8.3'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              Veriff has raised approximately $192.3M across seven rounds, with its last primary round a $100M Series D
              in January 2022 led by Tiger Global and Accel at a $1.5B valuation that made it an Estonian unicorn. No
              primary equity round has been disclosed since, so the mark is more than three years stale as of the 2026
              run date. The company is profitable and self-funding, which reduces near-term dilution risk but also
              removes a fresh third-party valuation signal — there is no 2024/2025 round to re-price the business. On
              Sacra's ~$110M ARR estimate, the stale mark implies roughly a 13.6x trailing multiple. That figure must be
              read against a contested revenue base: LATKA estimates only $41.6M for 2024, the Estonian operating entity
              VERIFF OU (registry code 12932944) filed turnover of EUR 50.2M, and the company states a $100M+ run-rate —
              a spread that materially changes the implied multiple. Public evidence therefore partially, but not fully,
              supports the price: the growth and volume signals (a 30-fold authentication-volume surge, tripling
              verification volumes) are consistent with a high-growth multiple, but the unaudited, conflicting revenue
              figures and the stale mark mean entry discipline should assume downside protection rather than the
              headline mark.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV028
      - number: '8.4'
        title: Bull, base and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes ARR compounds toward $200M+ with sustained premium multiples (12-14x), supporting a
              $2.5B-$3B re-rating in a fresh round — broadly the path Persona and Incode are on. The base case assumes
              ARR grows to roughly $150M at a normalized ~10x multiple, supporting a ~$1.5B valuation broadly in line
              with the 2022 mark. The bear case assumes fraud-capture erosion or a regulatory setback compresses growth
              and the multiple to ~6-8x, implying a down-round near $0.7B-$0.9B. Sensitivity analysis shows outcomes are
              most sensitive to the revenue multiple and the sustained growth rate, then to the realized ARR base: at
              ~$110M ARR, each turn of multiple is worth ~$110M of valuation, so the gap between a bear 6x and a bull
              14x spans roughly $0.7B to $1.5B on today's ARR alone. The down-round trigger is a sustained fraud-capture
              decline or a material regulatory fine that compresses both growth and the multiple simultaneously.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
