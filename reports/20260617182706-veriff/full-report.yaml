              anchor accounts would be material, and Veriff does not disclose top-customer revenue share to quantify it.
              Channel dependence is moderate — adoption is largely direct (self-serve plus enterprise sales) rather than
              reliant on a few resellers — which reduces partner risk but means Veriff owns its own acquisition cost.
              Procurement friction is real in the enterprise segment, where security review, data-protection assessment
              and biometric-compliance diligence lengthen sales cycles, though Veriff's certifications (SOC 2, ISO
              30107-3, FIDO) are designed to shorten them. The binding diligence items are the undisclosed top-customer
              concentration and the absence of disclosed retention/churn data.
