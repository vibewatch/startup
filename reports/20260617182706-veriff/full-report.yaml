      - number: '2.3'
        title: Buyer, user and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The market segments cleanly by end-user industry, deployment, organisation size and geography, and
              Veriff's go-to-market follows the highest-volume cuts. Financial services is the largest vertical at about
              30.7% of 2025 revenue (Mordor), followed by mobility/sharing-economy, crypto exchanges, online
              marketplaces, gaming/gambling and, increasingly, social platforms pulled in by age-assurance law. The
              economic buyer is typically a compliance, risk or fraud leader (Chief Compliance Officer, Head of Fraud,
              or Head of Onboarding) who owns the KYC/AML or trust-and-safety budget; the user is the end consumer
              completing onboarding, and the payer is the platform charged per verification. Large enterprises command
              roughly 72.6% of spend (Mordor) but SMEs grow fastest, and cloud deployment dominates at about 65% of
              share, matching Veriff's API-first, cloud-native model. The adoption trigger is usually a regulatory
              obligation (KYC/AML, age assurance), a fraud incident, or a market-entry need for new-geography document
              coverage. Adoption follows a land-and-expand path: a single onboarding use case expands into
              reverification, authentication and proof of address. Biometric verification leads by solution type at
              about 35.8% of 2025 revenue, the exact lane Veriff occupies.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
