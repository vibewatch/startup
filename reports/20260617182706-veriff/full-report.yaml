      - number: '5.2'
        title: Customer workflows and use cases
        blocks:
          - type: paragraph
            body: >-
              Veriff's modules map onto distinct customer workflows. The dominant workflow is new-account onboarding /
              KYC: at sign-up the user is routed into the Veriff SDK, completes document-plus-selfie capture, and the
              calling system receives a decision and RiskScore over webhook/API to gate account creation. A second
              workflow is age verification, used by gaming, alcohol/vape commerce and platforms subject to age-assurance
              laws, where the document's date of birth and biometric match establish that the user meets an age
              threshold. A third is driver/worker validation, used by mobility and marketplace platforms (Bolt,
              Uber-type) to confirm a driver's licence and identity before activation. A fourth is ongoing
              re-authentication, where Biometric Authentication re-verifies a returning user with a selfie rather than
              re-running full document capture, reducing friction for logins, high-value transactions and account
              recovery. A fifth is AML/PEP and sanctions screening and, newly, proof-of-address, which extend the same
              onboarding flow into compliance checks. Across all of these the integration pattern is the same: embed the
              SDK, call the REST API, consume decisions and signals via webhook, and review edge cases in Veriff
              Station. This single integration serving many compliance use cases is a core part of Veriff's value
              proposition and a driver of expansion revenue.
