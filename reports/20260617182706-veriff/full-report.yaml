      - number: '8.5'
        title: Comparable set
        blocks:
          - type: paragraph
            body: >-
              The comparable set spans fresh growth rounds, M&A outcomes and sector benchmarks. Persona is the closest
              fresh growth comparable: $141.2M ARR in 2024 and a $2B valuation in its April 2025 Series D, implying
              roughly a 14x revenue multiple, corroborated across PitchBook and SiliconANGLE. Incode is seeking up to
              $3B on ~$170M ARR (Nov 2025), about 17x. Against these premium marks, the Onfido/Entrust transaction is
              the key adverse comparable: Onfido, at ~$54.5M ARR, cleared in a 2024 strategic sale at a ~$163.4M-$400M
              valuation, roughly 3-4.6x — well below sector medians and a reminder that IDV assets can exit at low
              multiples. Sector benchmarks put cybersecurity/fintech SaaS revenue multiples at ~7.7x-9.4x in 2025, with
              hyper-growth leaders at 10x-14x. Socure ($4.5B in 2021), Jumio, Sumsub ($85.6M 2024) and AU10TIX are
              additional private peers, but their marks are stale or undisclosed and so anchor the set only loosely. On
              a blended basis — Persona's 14x premium, Onfido's 3-4.6x floor and an ~8x sector median — a fair-value
              range of roughly $0.9B-$2.0B brackets the stale $1.5B mark, with Veriff's growth and volume signals
              placing it in the upper half of that range rather than at the M&A floor.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV040
