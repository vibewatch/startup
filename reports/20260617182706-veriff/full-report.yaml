      - number: '4.3'
        title: Cost structure, margins and cash generation
        blocks:
          - type: paragraph
            body: >-
              Veriff's cost structure blends a high-gross-margin software core with two cost drivers that are heavier
              than a pure-SaaS company: cloud/compute for running dozens of AI models per verification (the platform
              runs 1,000+ signals per session on AWS infrastructure) and a 'human-in-the-loop' review workforce that
              adjudicates edge cases. These give IDV a lower gross margin than typical SaaS, though Veriff's high
              automation rate (the Full Auto product) is explicitly designed to push more volume through machines and
              lift margins as it scales. Reaching profitability in 2025 on roughly $110M ARR, after the February 2023
              layoff of 12% of staff (66 people) that reset the cost base, indicates operating leverage is now positive
              and that the compute-plus-review cost curve is bending favourably with automation and volume. Working
              capital and capex are not disclosed but are likely modest for a cloud-native software business with no
              manufacturing. The combination of usage-based revenue, positive operating margin and no disclosed debt
              suggests Veriff is now self-funding from operations, a material change from the cash-burning growth
              posture that accompanied the 2022 unicorn round. Audited margin figures are not public, so the
              profitability claim is company-stated and unverified.
