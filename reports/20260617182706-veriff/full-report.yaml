  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Veriff's investment thesis is that it is a profitable, fast-growing leader in a structurally expanding
              identity-verification market: Sacra estimates roughly $110M ARR in 2025, up about 83% year-on-year,
              profitable, with 3,000+ customers and a blue-chip base (Uber, Bolt, Deel, Monzo). The market is $10B+ and
              growing double digits, and Veriff's certified presentation-attack detection and 98%+ automation underpin a
              premium-pricing moat. The anti-thesis is fourfold: the market is crowded with no vendor above ~15% share;
              deepfake and injection attacks can erode the fraud-capture rates that justify premium pricing;
              anchor-customer concentration is undisclosed; and, most directly for valuation, the financial figures are
              company-stated and unaudited and the only public valuation mark is more than three years stale. Both the
              thesis and anti-thesis ultimately hinge on the same variable — whether Veriff sustains durable
              fraud-capture superiority. If it does, the premium multiple is defensible; if it does not, pricing,
              retention and the valuation compress together.
            claimRefs:
              - CV001
              - CV011
              - CV013
              - CV016
              - CV039
