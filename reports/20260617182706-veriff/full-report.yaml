  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: peers, incumbents and entrants'
        blocks:
          - type: paragraph
            body: >-
              Identity verification is crowded and fragmented: Switch Labs counts 27+ major vendors across five
              capability categories and Mordor confirms no provider controls more than 15% of revenue. Veriff's direct
              peers are pure-play document-plus-biometric IDV vendors: Onfido (acquired by Entrust in 2024), Jumio,
              Sumsub, Persona, AU10TIX, IDnow and the fast-rising Incode. Larger incumbents and adjacents press from
              above and the side: Entrust (which absorbed Onfido), IDEMIA and Thales in credentialing, Socure and
              Trulioo in US-centric data-driven identity and fraud, and platform players such as Stripe Identity and
              Plaid bundling verification into payments and fintech infrastructure. Substitutes and status-quo options
              remain real competition: manual or in-branch review, knowledge-based authentication, credit-bureau
              lookups, and in-house build by the largest platforms (a credible threat given Uber, Bolt and others have
              the engineering depth to internalise checks). Likely future entrants include cloud and payments incumbents
              extending native identity, and government eID/eIDAS 2.0 wallets that could disintermediate parts of
              onboarding. Veriff differentiates on automation rate, breadth of document and country coverage, and
              transparent self-serve pricing rather than on being the cheapest or the largest.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP030
              - CP031
