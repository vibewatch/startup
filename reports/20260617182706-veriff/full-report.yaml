  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies and substitutes
        blocks:
          - type: paragraph
            body: >-
              Veriff sells into the identity verification (IDV) and authentication market: the spend organisations make
              to remotely confirm that a person is who they claim to be, typically by validating a government-issued
              document and matching it to a live selfie with biometric liveness. Included spend covers document
              verification, biometric/liveness checks, ongoing biometric authentication, age assurance and the
              fraud-signal intelligence layered on top, usually priced per verification or as enterprise subscriptions.
              Excluded from the core boundary are adjacent categories that buyers often purchase separately:
              transaction-fraud and payments-risk scoring, device fingerprinting, AML transaction monitoring,
              sanctions/PEP screening, and full customer-data platforms. The nearest adjacency is the broader
              digital-identity solutions market, which wraps credentialing, reusable identity wallets and government eID
              into the lifecycle. Status-quo substitutes remain meaningful: manual or in-branch document review,
              knowledge-based authentication, credit-bureau lookups, and in-house build by large platforms. Switch Labs
              counts 27+ major vendors across five capability categories and notes that no single vendor covers all
              categories, so buyers frequently assemble two or three complementary tools rather than one suite. Veriff
              positions at the document-plus-biometric core while extending into authentication and proof of address.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM031
