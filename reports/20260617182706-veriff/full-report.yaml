            title: Deepfake/injection arms race threatens the core moat
            body: >-
              A deepfake attack roughly every five minutes, forgeries up 244% and injection attacks up 88% directly
              threaten the fraud-capture rates that justify Veriff's premium pricing — the single highest residual
              exposure, only partially mitigated by point-in-time certifications.
            calloutType: risk
