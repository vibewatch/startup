      - number: '5.4'
        title: Trust, security, privacy and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Because Veriff processes biometric and government-identity data, its trust and compliance posture is part
              of the product. Veriff publishes SOC 2 Type II attestation covering information-security controls and
              conformance with ISO/IEC 30107-3 (presentation-attack detection) at both Level 1 and Level 2, tested by
              iBeta Quality Assurance, an independent NIST/NVLAP-accredited biometrics testing lab — an important
              third-party validation that its liveness withstands spoofing. In 2025 Veriff added FIDO Alliance global
              certification for its Full Auto IDV (FIDO DocAuth, certified across 12 countries), an emerging
              interoperability/assurance standard for remote document authentication, and won the 2025 CyberSecurity
              Breakthrough Award for fraud prevention. Its passive-liveness approach is explicitly designed to detect
              AI-generated deepfakes, synthetic or manipulated images and streamed/pre-recorded video — the principal
              evolving attack class. The standing risk is that the threat environment moves faster than certifications:
              industry reporting (Sumsub, Entrust, Deepstrike) describes deepfake and injection attacks rising sharply,
              with a deepfake attack roughly every five minutes, so Veriff's fraud-capture rates must be continuously
              re-trained to hold. Privacy and biometric-data handling (GDPR, BIPA-style consent regimes) sit alongside
              these controls and are covered in depth in the risks chapter.
            claimRefs:
              - CE018
