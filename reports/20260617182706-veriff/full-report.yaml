        title: Exhibits
        blocks:
          - type: callout
            title: Fundamentals likely support the stale mark
            body: >-
              Profitable, ~$110M ARR and ~83% growth imply a ~13.6x trailing multiple — above the ~8x sector median but
              in line with the closest fresh growth comparable, Persona, at ~14x. A re-mark at sector medians would be
              ~$0.9B; at premium IDV multiples ~$1.5B-plus.
            calloutType: insight
            claimRefs:
              - CV011
