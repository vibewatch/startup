  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Veriff is an identity-verification-as-a-service platform delivered API-first and white-label: a business
              embeds Veriff's SDK into its sign-up or re-authentication flow, the end user photographs a government ID
              and takes a selfie, and Veriff returns an automated approve/decline decision plus a fraud risk score in
              seconds. The product is a suite of modules rather than a single check. Core identity verification
              authenticates the document and matches the document portrait to a live selfie; Liveness/biometric facial
              analysis confirms the user is a real, present person and not a spoof; Biometric Authentication re-verifies
              returning users with a quick selfie match against their original enrolment; Fraud Intelligence layers
              device, network and behavioural signals into a consolidated RiskScore surfaced in the Veriff Station
              console or over API; and the 2025 AI-based Proof of Address adds address verification. Above these sits
              Full Auto, the fully automated decisioning layer that pushes the maximum share of sessions through machine
              decisions with no human in the loop. The platform supports 12,500+ document types from 230+ countries and
              runs 1,000+ fraud signals per session, positioning it as a broad-coverage, automation-first IDV stack
              aimed at fintech, crypto, gaming, mobility and marketplaces.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE030
