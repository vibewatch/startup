            title: Conditional buy hinges on disclosure
            body: >-
              The recommendation is a conditional buy at or below the 2022 mark with downside protection, gated on
              audited financials reconciling the $41.6M / EUR 50.2M / $100M+ revenue figures and on top-customer
              concentration disclosure.
