      - number: '4.2'
        title: Go-to-market motion and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Veriff runs a hybrid go-to-market: a developer-led, self-serve motion (published pricing, API/SDK
              onboarding, $49 monthly minimums) that lands mid-market and product-led customers cheaply, alongside an
              enterprise sales motion for marquee accounts like Uber, Bolt, Western Union and Webull. Public data does
              not disclose CAC, payback or sales-cycle length, so sales efficiency must be inferred from proxies. The
              strongest proxy is the 2024 disclosure of 75% year-over-year Q4 revenue growth with customers up 60% and
              volumes tripling, followed by Sacra's estimate of 83% ARR growth in 2025 to $110M while reaching
              profitability: growing that fast while turning profitable implies efficient customer acquisition and
              meaningful net revenue expansion from existing accounts, since blended revenue per customer rose as
              volumes per customer increased. The self-serve tier lowers CAC for the long tail, while the cross-customer
              fraud network and per-verification add-ons drive expansion without proportional sales cost. The principal
              unknowns are the split of new-logo versus expansion revenue, gross and net retention, and the cost of the
              enterprise sales motion, none of which Veriff discloses publicly.
            claimRefs:
