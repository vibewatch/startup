      - number: '3.3'
        title: Capability, pricing and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, the leading pure-plays converge on a similar core: document verification, selfie/liveness
              biometrics, passive presentation-attack detection, ongoing authentication, and fraud-signal intelligence;
              differentiation is at the margins of automation rate, country/document coverage, and embedded fraud
              networks. Veriff emphasises a high automation rate, 230+ country and 12,500+ document coverage, and
              biometric authentication for returning users; Jumio leans on its Identity Graph for lifecycle fraud;
              Sumsub bundles AML/transaction monitoring; Persona stresses configurability and orchestration; IDnow
              specialises in EU eIDs and wallet credentials; Socure and Trulioo are strongest in US data-centric
              verification. On pricing, the market spans $0.05-$3.00+ per verification; Switch Labs singles out Veriff,
              Sumsub, Stripe Identity and Fingerprint as among the most transparent (self-serve, published pricing),
              while Jumio and Onfido require sales engagement, a GTM contrast that favours Veriff for mid-market and
              developer-led adoption. On distribution, incumbents like Entrust and Socure win through enterprise and
              government channels, whereas Veriff and Persona win bottoms-up via API/SDK self-serve. On trust and
              regulatory posture, all serious players hold ISO 27001, SOC 2 and ISO 30107-3 PAD certifications, so
              compliance is table-stakes rather than a durable edge.
            claimRefs:
