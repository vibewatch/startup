      - number: '3.2'
        title: 'Competitor profiles: scale, funding and direction'
        blocks:
          - type: paragraph
            body: >-
              On disclosed financials Veriff sits mid-pack by revenue but well-funded by valuation. Persona is the
              revenue leader among independents at $141.2M in 2024 (up from $98.8M in 2023) and raised $200M in April
              2025 at a $2B valuation, pursuing a configurable, no-code platform strategy. Sumsub reported $85.6M
              revenue in 2024 (up from $50M in 2023), leaning into all-in-one KYC/AML/crypto compliance. Veriff's
              company-stated revenue exceeded $100M in 2025 against a stale $1.5B valuation last set in January 2022.
              Onfido, before its ~$400M acquisition by Entrust in February 2024, had roughly GBP 140M revenue and 500
              staff, and is now a feature within Entrust's identity-centric security stack rather than a standalone
              challenger. Jumio is an older, enterprise-heavy player (founded 2010) whose last LATKA-disclosed revenue
              was $42.4M in 2021 and whose disclosed valuation ($127.3M) looks stale. Incode is the most aggressive new
              entrant, reported in November 2025 to be seeking up to a $3B valuation, far above Veriff's last mark.
              AU10TIX, IDnow (EU/eID focus) and Trulioo/Socure (US data-driven identity) round out a field where
              strategy splits between breadth platforms and regional or vertical specialists.
            claimRefs:
              - CP006
              - CP007
