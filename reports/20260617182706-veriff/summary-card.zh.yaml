  topStrengths:
    - 约 $110M ARR、同比约 83% 增长、3,000+ 客户且已盈利，这在私有 IDV 厂商中罕见。
    - 客户基础蓝筹且分散，覆盖金融科技、加密和出行，包含 Uber、Bolt、Deel、Monzo、Webull。
    - 在 $10B+ 且双位数增长的市场里，公司拥有经认证的反欺诈护城河（98%+ 自动化、iBeta / ISO 30107-3 PAD、FIDO）。
  topRisks:
