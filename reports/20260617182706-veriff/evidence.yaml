evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding ownership and board governance
    missingEvidence: Cap table, ownership percentages and board composition beyond lead investors
    whyItMatters: Determines control, dilution and governance quality for an investment decision
    diligencePath: Request cap table and shareholder agreement from the company; check Estonian business registry filings
    relatedQuestionRefs:
      - QO023
  - type: conflicting-data
    severity: material
    topic: funding round labeling and total raised
    missingEvidence: Authoritative confirmation of Series C vs D label and reconciled total raised
    whyItMatters: Public sources conflict ($92.3M vs $192.3M; Series C vs D), affecting funding-history accuracy
    diligencePath: Cross-check Crunchbase/PitchBook primary records and the company's own investor disclosures
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: minor
    topic: legal entity structure and domicile of Veriff
    missingEvidence: Registered legal entity name, domicile and group structure
    whyItMatters: Clarifies the contracting and regulatory entity for diligence
    diligencePath: Pull Estonian e-Business Register and any US/UK subsidiary filings
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: audited financial statements and profitability
    missingEvidence: Audited revenue, margin and profitability figures
    whyItMatters: Profitability and revenue are company-stated and unaudited
    diligencePath: Request audited financials and management accounts under NDA
    relatedQuestionRefs:
      - QO009
      - QO021
  - type: conflicting-data
    severity: material
    topic: market sizing estimates and CAGR divergence
    missingEvidence: Reconciled single-source sizing with consistent methodology
    whyItMatters: 2025 base estimates differ ~14% and CAGR ~5 points, materially changing any terminal-value case
