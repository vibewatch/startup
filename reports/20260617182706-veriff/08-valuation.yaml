company:
  name: Veriff
chapter:
  number: 8
  title: Valuation
  summary: Veriff is profitable at roughly $110M ARR (Sacra) growing about 83%, but its only public valuation anchor is a stale January 2022 $1.5B Series D (Tiger Global/Accel) — implying a ~13.6x trailing multiple that sits above the ~8x cybersecurity/fintech SaaS median yet in line with the closest fresh growth comparable, Persona ($141.2M ARR, $2B, ~14x). The downside floor is the Onfido/Entrust 2024 strategic sale at ~3-4.6x; Incode is seeking up to $3B on ~$170M ARR (~17x). A blended comparable basis brackets fair value at roughly $0.9B-$2.0B around the stale $1.5B mark. The recommendation is a conditional buy at or below the 2022 mark with downside protection, gated on audited financials (which must reconcile LATKA $41.6M, the Estonian-entity EUR 50.2M turnover, and the company-stated $100M+ run-rate) and on top-customer concentration disclosure. The dominant thesis-break triggers are a sustained fraud-capture decline or a material regulatory fine, either of which would compress growth
    and the multiple into a $0.7B-$0.9B down-round.
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: 'Veriff''s investment thesis is that it is a profitable, fast-growing leader in a structurally expanding identity-verification market: Sacra estimates roughly $110M ARR in 2025, up about 83% year-on-year, profitable, with 3,000+ customers and a blue-chip base (Uber, Bolt, Deel, Monzo). The market is $10B+ and growing double digits, and Veriff''s certified presentation-attack detection and 98%+ automation underpin a premium-pricing moat. The anti-thesis is fourfold: the market is crowded with no vendor above ~15% share; deepfake and injection attacks can erode the fraud-capture rates that justify premium pricing; anchor-customer concentration is undisclosed; and, most directly for valuation, the financial figures are company-stated and unaudited and the only public valuation mark is more than three years stale. Both the thesis and anti-thesis ultimately hinge on the same variable — whether Veriff sustains durable fraud-capture superiority. If it does, the premium multiple is defensible;
    if it does not, pricing, retention and the valuation compress together.'
  claimRefs:
  - CV001
  - CV011
  - CV013
  - CV016
  - CV039
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: recommendation
  title: Recommendation, confidence and valuation stance
  body: 'The recommendation is a conditional buy/hold: Veriff''s fundamentals (profitable, ~$110M ARR, ~83% growth) are attractive, but the stale 2022 mark and disclosure gaps warrant entry at or below the $1.5B valuation with structural downside protection. Confidence is medium because the financial base is unaudited and company-stated and the valuation mark is over three years old. The risk rating is medium-high, driven by the regulatory/biometric and deepfake-fraud exposures detailed in the risks chapter. The valuation stance is cautious-constructive: fundamentals likely support — and may exceed — the 2022 mark, but the absence of a fresh primary round leaves fair value unverified. The headline KPIs (ARR ~$110M, growth ~83%, $192.3M raised, $1.5B last mark, ~13.6x implied multiple, 3,000+ customers) frame an asset whose quality is high but whose price is unconfirmed.'
  claimRefs:
  - CV002
  - CV003
  - CV004
  - CV005
  - CV042
  tableRefs:
  - TV001
  figureRefs:
  - FV004
- id: financing-context
  title: Financing and valuation context
  body: 'Veriff has raised approximately $192.3M across seven rounds, with its last primary round a $100M Series D in January 2022 led by Tiger Global and Accel at a $1.5B valuation that made it an Estonian unicorn. No primary equity round has been disclosed since, so the mark is more than three years stale as of the 2026 run date. The company is profitable and self-funding, which reduces near-term dilution risk but also removes a fresh third-party valuation signal — there is no 2024/2025 round to re-price the business. On Sacra''s ~$110M ARR estimate, the stale mark implies roughly a 13.6x trailing multiple. That figure must be read against a contested revenue base: LATKA estimates only $41.6M for 2024, the Estonian operating entity VERIFF OU (registry code 12932944) filed turnover of EUR 50.2M, and the company states a $100M+ run-rate — a spread that materially changes the implied multiple. Public evidence therefore partially, but not fully, supports the price: the growth and volume signals
    (a 30-fold authentication-volume surge, tripling verification volumes) are consistent with a high-growth multiple, but the unaudited, conflicting revenue figures and the stale mark mean entry discipline should assume downside protection rather than the headline mark.'
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV014
  - CV028
  tableRefs: []
- id: scenarios
  title: Bull, base and bear scenarios
  body: 'The bull case assumes ARR compounds toward $200M+ with sustained premium multiples (12-14x), supporting a $2.5B-$3B re-rating in a fresh round — broadly the path Persona and Incode are on. The base case assumes ARR grows to roughly $150M at a normalized ~10x multiple, supporting a ~$1.5B valuation broadly in line with the 2022 mark. The bear case assumes fraud-capture erosion or a regulatory setback compresses growth and the multiple to ~6-8x, implying a down-round near $0.7B-$0.9B. Sensitivity analysis shows outcomes are most sensitive to the revenue multiple and the sustained growth rate, then to the realized ARR base: at ~$110M ARR, each turn of multiple is worth ~$110M of valuation, so the gap between a bear 6x and a bull 14x spans roughly $0.7B to $1.5B on today''s ARR alone. The down-round trigger is a sustained fraud-capture decline or a material regulatory fine that compresses both growth and the multiple simultaneously.'
  claimRefs:
  - CV027
  - CV028
  - CV029
  - CV030
  - CV031
  tableRefs:
  - TV003
  figureRefs:
  - FV002
  - FV003
- id: comparables
  title: Comparable set
  body: 'The comparable set spans fresh growth rounds, M&A outcomes and sector benchmarks. Persona is the closest fresh growth comparable: $141.2M ARR in 2024 and a $2B valuation in its April 2025 Series D, implying roughly a 14x revenue multiple, corroborated across PitchBook and SiliconANGLE. Incode is seeking up to $3B on ~$170M ARR (Nov 2025), about 17x. Against these premium marks, the Onfido/Entrust transaction is the key adverse comparable: Onfido, at ~$54.5M ARR, cleared in a 2024 strategic sale at a ~$163.4M-$400M valuation, roughly 3-4.6x — well below sector medians and a reminder that IDV assets can exit at low multiples. Sector benchmarks put cybersecurity/fintech SaaS revenue multiples at ~7.7x-9.4x in 2025, with hyper-growth leaders at 10x-14x. Socure ($4.5B in 2021), Jumio, Sumsub ($85.6M 2024) and AU10TIX are additional private peers, but their marks are stale or undisclosed and so anchor the set only loosely. On a blended basis — Persona''s 14x premium, Onfido''s 3-4.6x
    floor and an ~8x sector median — a fair-value range of roughly $0.9B-$2.0B brackets the stale $1.5B mark, with Veriff''s growth and volume signals placing it in the upper half of that range rather than at the M&A floor.'
  claimRefs:
  - CV018
