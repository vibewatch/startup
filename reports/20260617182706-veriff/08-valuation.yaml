- id: exit-diligence
  title: Exit readiness and final diligence asks
  body: 'The most probable exit is a strategic acquisition by a larger security or identity incumbent, mirroring the Entrust/Onfido and Incode/AuthenticID consolidation pattern; an IPO is less likely near-term given Veriff''s ~$110M ARR scale relative to public-listing thresholds. Because sector M&A clears in a wide 3x-17x range, exit value depends heavily on whether Veriff is sold as a strategic premium asset or a financial right-sizing. Before any entry, the gating diligence asks are: audited financials reconciling the three conflicting revenue figures (LATKA $41.6M, Estonian-entity EUR 50.2M turnover, company-stated $100M+ run-rate); a top-customer revenue-concentration schedule to size the anchor dependency (a thesis-break trigger if one or two accounts dominate without lock-in); fraud-capture trend data to validate the moat; a current 409A or secondary mark to test the stale $1.5B; and customer contract terms to assess repricing risk. The thesis-break and kill triggers — a sustained
    fraud-capture decline, a material regulatory fine, an anchor-customer loss, a down-round at re-raise, or an audit below the stated run-rate — define the monitoring agenda post-entry. Net, entry at or below the 2022 mark with downside protection offers a reasonable risk-adjusted return if growth persists and the disclosure gaps close.'
  claimRefs:
