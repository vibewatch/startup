callouts:
  - calloutType: "risk"
    title: "Single-Provider Public Sector Concentration Risk"
    body: "The GAO's audit of the IRS's sole-source IAL2 identity-proofing contract ($234.7 million obligated) underscores the regulatory and political fragility of ID.me's primary revenue channel, where shifting federal policy or accelerated adoption of public-sector alternatives like Login.gov could trigger severe top-line contraction."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR010"
  - calloutType: "insight"
    title: "Disbursement-Identity Decoupling in Public Benefit Programs"
    body: "While ID.me verifies claimant identities, federal benefit fraud frequently occurs at the account disbursement destination; the Plaid partnership addresses this gap but highlights ID.me's reliance on external fintech rails to defend agency fraud prevention outcomes."
    claimRefs:
      - "CR007"
      - "CR008"
