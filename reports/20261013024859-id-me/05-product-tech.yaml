chapter:
  number: 5
  title: "Product & Technology"
  summary: "ID.me combines a reusable digital wallet with identity proofing, authentication, attribute validation, and human-assisted fallback paths. Public evidence supports the product model and substantial operating scale, but current independent benchmarks, developer adoption signals, control attestations, and detailed service-level evidence remain unavailable."
sections:
  - id: "product-and-user-workflows"
    title: "Product and user workflows"
    body: >-
      ID.me's customer-facing product is a reusable identity wallet rather than only a one-time
      document-checking widget. The relying organization integrates once with the Identity Gateway,
      while a person can establish a higher-assurance credential and later consent to reuse it at
      participating services. Official materials describe self-service, video-chat, and in-person
      proofing paths; they also expose passkey MFA in the support surface. This combination addresses
      two workflows: first-time proofing when evidence and devices vary, and lower-friction return
      access after a credential exists. The model still depends on network acceptance: a reusable
      credential has practical value only where the relying party accepts ID.me, and public evidence
      does not establish portability outside that network.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-integrations"
    title: "Architecture and integration model"
    body: >-
      The documented architecture has three named core assets: the Digital Wallet, a branded or
      white-label Credential Broker, and an Attribute Exchange, coordinated through a single Identity
      Gateway integration. The broker is described as applying relying-party settings across
      authentication, proofing, and attribute verification, while the exchange validates identity
      credentials from multiple data sources. A 2026 Finovate item also describes a Plaid workflow
      that joins an ID.me-verified person to a bank account before government benefit disbursement,
      illustrating how the platform can compose with an external specialist. These are functional
      descriptions, not a verified deployment topology: public materials do not disclose component
      boundaries, data lineage, failover design, API latency, or customer-specific integration effort.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-differentiation-and-roadmap"
    title: "Maturity, differentiation, and roadmap evidence"
    body: >-
      Scale evidence suggests a mature production network, but most performance disclosures originate
      with the company. Finovate reported 152 million users across 20 federal agencies, 45 states, and
      more than 600 brands, and separately repeated company figures of 20.4 million new wallets and
      409 million successful logins in the preceding year. ID.me's own Q1 2024 data said 55% of
      subscriptions went to pre-verified users and 90.9% of newly issued IAL2 credentials involved
      waits below five minutes. These measures support the reuse thesis, yet they do not reveal
      availability, false-reject rates by cohort, integration time, or independent accuracy. Funding
      coverage says new capital is intended to accelerate secure reusable identity and AI-fraud
      defenses, but no dated feature roadmap or delivery milestones were available in the assigned
      evidence.
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE015"
      - "CE016"
  - id: "trust-controls-and-technical-risk"
    title: "Trust controls and technical risk"
    body: >-
      ID.me states that relying parties may request only the personal data reasonably required for a
      service and that users review and authorize fields before release. Its security page also claims
      SOC 2 Type 1 certification for the Identity Gateway, FedRAMP-authorized AWS hosting, FIPS 140-2
      AES-256 protection for personally identifiable information, and annual third-party audits tied
      to Kantara and FICAM accreditations. These are useful procurement signals, but the assigned pool
      contains no current audit report, penetration-test result, incident history, recovery objective,
      or independent control assessment. External commentary also flags lockouts, verification loops,
      biometric fairness concerns, and the higher operating cost of human-assisted paths. The central
      diligence question is therefore not whether controls are named, but whether their current scope,
      operating effectiveness, and user-outcome trade-offs can be demonstrated.
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
callouts:
  - calloutType: "strength"
    title: "Reuse is the product-level differentiator"
    body: "The strongest supported distinction is the combination of first-time identity proofing with subsequent credential reuse across participating relying parties; this can remove repeat proofing, but only inside the acceptance network."
    claimRefs:
      - "CE003"
      - "CE006"
  - calloutType: "risk"
    title: "Control claims exceed available verification"
    body: "The evidence names security frameworks and safeguards but does not include current audit artifacts, independent biometric benchmarks, service-level history, or recovery metrics needed to verify operating effectiveness."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
