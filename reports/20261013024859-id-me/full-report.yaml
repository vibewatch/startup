      - number: '6.3'
        title: Public Sector & Commercial Production Deployments
        blocks:
          - type: paragraph
            body: >-
              ID.me has transitioned from exploratory pilot implementations into foundational production infrastructure
              across several of the largest civilian IT environments in the United States. At the federal level, the
              Department of Veterans Affairs established ID.me alongside Login.gov as the exclusive secure
              authentication methods for VA.gov, phasing out legacy DS Logon and My HealtheVet credentials to centralize
              health care enrollment and pension distribution. Similarly, the Internal Revenue Service relies on ID.me
              as its primary taxpayer online account identity verification engine for tax records, transcript access,
              and payment agreements, following comprehensive technical and security due diligence. Across state
              governments, departments of labor in California, Arizona, New York, and dozens of other jurisdictions
              deployed ID.me to halt organized fraud syndicates, with state officials attributing tens of billions of
              dollars in prevented fraudulent disbursements to the platform. In the commercial sphere, enterprises such
              as USAA and Allscripts completed extensive processing environment reviews to secure financial transactions
              and electronic prescribing workflows, validating ID.me's enterprise compliance posture.
            claimRefs:
              - CU008
              - CU009
              - CU010
          - type: table
