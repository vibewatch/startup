      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              ID.me's forward capital adequacy is shaped by its September 2025 financing package, which raised $340
              million at a valuation exceeding $2 billion. Rather than being pure growth equity, the capital raise was
              substantially structured around a $275 million credit facility provided by Ares Management, supplemented
              by roughly $65 million in Series E equity led by Ribbit Capital. This follows a previous $132 million
              Series D equity round in April 2023 led by Viking Global Investors and a secondary tender offer in late
              2024 at a $1.8 billion valuation. While the sizable credit facility preserves founder and insider equity
              from excessive dilution, it introduces substantial ongoing debt service obligations. In conclusion, ID.me
              demonstrates impressive top-line scale and network adoption, but underwriting its premium private
              valuation remains constrained by the absence of audited GAAP financials, private gross margin disclosures,
              and forward visibility into public-sector renewal pricing.
