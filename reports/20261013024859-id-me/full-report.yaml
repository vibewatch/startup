  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Multi-Sided Network Structure
        blocks:
          - type: paragraph
            body: >-
              ID.me operates a distinct multi-sided identity platform spanning federal civilian agencies, state
              workforce departments, healthcare provider systems, and commercial consumer brands. Rather than
              functioning as a conventional point-solution vendor, the company leverages a unified digital identity
              wallet where user verification performed for one relying party creates a reusable credential across the
              entire network. At the public-sector core, 22 federal agencies and 50 state government entities deploy
              ID.me to satisfy strict federal identity assurance standards, particularly NIST 800-63-3 Identity
              Assurance Level 2 (IAL2) mandates required for high-risk benefits and tax administration. In the private
              sector, ID.me has expanded into healthcare across more than 85 provider organizations, while maintaining a
              footprint of over 600 retail brands that utilize its community verification capabilities for targeted
              discounts. However, this multi-sided structure creates asymmetric commercial dynamics: government agencies
              provide the non-negotiable user acquisition mandates, while commercial brands monetize user group
              affiliations, leaving underlying contract revenues heavily exposed to public procurement timelines.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
