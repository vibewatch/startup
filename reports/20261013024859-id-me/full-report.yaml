  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and user workflows
        blocks:
          - type: paragraph
            body: >-
              ID.me's customer-facing product is a reusable identity wallet rather than only a one-time
              document-checking widget. The relying organization integrates once with the Identity Gateway, while a
              person can establish a higher-assurance credential and later consent to reuse it at participating
              services. Official materials describe self-service, video-chat, and in-person proofing paths; they also
              expose passkey MFA in the support surface. This combination addresses two workflows: first-time proofing
              when evidence and devices vary, and lower-friction return access after a credential exists. The model
              still depends on network acceptance: a reusable credential has practical value only where the relying
              party accepts ID.me, and public evidence does not establish portability outside that network.
            claimRefs:
