      - number: '6.4'
        title: Retention Durability, Procurement Friction & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              While ID.me demonstrates deep integration across public agencies, its long-term customer durability faces
              acute risks stemming from customer concentration, procurement politics, and user friction. Public sector
              contracts represent a disproportionate share of high-assurance transaction volume and strategic value, yet
              these relationships remain vulnerable to federal policy shifts favoring government-owned alternatives like
              Login.gov. Furthermore, automated biometric screening and strict identity proofing workflows have
              generated substantial controversy: applicants frequently report account lockouts, identity verification
              loops, and extended wait times for manual video referee reviews during peak demand periods. These
              bottlenecks, highlighted in congressional inquiries and reflected in aggregate consumer review ratings
              below 3.0 out of 5 stars on Trustpilot, create persistent headline risk for contracting agency leadership.
              To deepen account stickiness and mitigate payment fraud beyond identity proofing, ID.me partnered with
              Plaid in September 2026 to verify recipient bank account ownership before state and federal benefit
              disbursement, targeting the $5.6 billion in annual improper unemployment payments. Nevertheless, detailed
              retention metrics such as net revenue retention and agency cohort renewal rates remain closely guarded
              private figures.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
