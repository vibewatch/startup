          - type: callout
            title: Credit Facility Leverage and Forward Capital Adequacy
            body: >-
              The September 2025 $340 million financing package was heavily weighted toward debt, incorporating a $275
              million Ares Management credit facility alongside $65 million in Series E equity. While providing
              substantial liquidity to scale without excessive equity dilution, the sizable debt load introduces
              interest service obligations that increase financial risk if government contract renewals face budgetary
              or competitive compression.
