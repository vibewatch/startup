              - CO008
          - type: callout
            title: Public Scrutiny and Verification Accessibility Bottlenecks
            body: >-
              High reliance on facial recognition and automated identity verification has historically triggered intense
              scrutiny from civil rights organizations and federal watchdogs, particularly when algorithmic rejections
              or video chat queue times lock vulnerable populations out of critical public assistance programs.
            calloutType: risk
            claimRefs:
              - CO010
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The addressable market for ID.me spans high-assurance digital identity proofing, multi-factor credential
              brokering, and digital consumer wallets. Traditional enterprise identity and access management (IAM)
              focuses on internal workforce authentication and directory services, whereas ID.me operates in
              citizen-facing, high-assurance identity verification where applicants must prove their real-world identity
              against authoritative records. This boundary encompasses NIST Special Publication 800-63-3 Identity
              Assurance Level 2 (IAL2) workflows, automated remote document verification, live biometric matching, and
              video-call identity referee services. Excluded from this software boundary are general payment acquiring,
              merchant banking rails, clinical electronic health record core architectures, and basic employee badge
              access systems. The addressable budget centers on federal civilian agency and state workforce department
              allocations dedicated to fraud mitigation, improper payment prevention, and citizen service modernization.
              In addition, ID.me captures commercial marketing and loyalty spend by verifying community affiliation
              status for military service members, healthcare providers, first responders, teachers, and students across
              more than 700 consumer enterprise brands.
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM012
      - number: '2.2'
        title: TAM, SAM, SOM, and Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating ID.me's addressable market requires separating broad public-sector fraud exposure from
              realistic vendor software spend. The Government Accountability Office (GAO) estimated that federal
              civilian programs suffered between $233 billion and $521 billion in annual fraud losses between 2018 and
              2022, creating urgent legislative demand for high-assurance gateway screening. Within state benefit
              ecosystems, improper payments in unemployment insurance reached $5.6 billion in fiscal year 2025,
              maintaining an elevated 14.9% error rate that underscores recurring demand for front-end identity and
              account verification. Independent market researchers model the North American digital identity
              verification and compliance market at approximately $5.2 billion in 2025 with an annual growth rate
              exceeding 16%. However, estimating ID.me's serviceable obtainable market (SOM) is constrained by private
              company opacity; while revenue increased by 450% between 2020 and 2024, ID.me does not disclose audited
              annual recurring revenue (ARR) or contractual churn rates by customer cohort. The company's expansion into
              account ownership validation through its 2026 Plaid partnership represents an effort to capture
              payment-destination verification spend beyond standalone identity proofing.
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM008
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
