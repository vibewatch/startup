      - number: '3.3'
        title: Pricing Structures, Switching Costs, and Lock-In Dynamics
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics and switching barriers in public-sector identity proofing differ fundamentally from
              standard enterprise SaaS pricing models. Neither ID.me nor federal agencies publish standardized unit rate
              cards, with commercial identity verification contracts structured through customized enterprise
              subscriptions, transaction-based verification bands, and agency-specific task orders. For agencies
              evaluating alternatives, migrating away from ID.me involves substantial technological, operational, and
              citizen-experience switching costs. Because ID.me functions as a centralized identity broker and
              credential wallet across major public gateways including VA.gov, SSA.gov, and Medicare.gov, users who have
              previously verified their identity can authenticate into newly participating agencies in under 60 seconds.
              In early 2024, pre-verified wallet sign-ins accounted for more than 55% of all user subscriptions on the
              platform, establishing a two-sided network effect where expanding citizen adoption increases agency
              integration incentives. Developing and accrediting bespoke agency-specific identity platforms requires
              multi-year software engineering investment, FedRAMP High authorization, Kantara Trust Framework audits,
              and continuous fraud operations that most public entities cannot cost-effectively sustain internally.
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP013
              - CP015
      - number: '3.4'
        title: Moat Durability, Regulatory Exposure, and Displacement Threats
        blocks:
          - type: paragraph
            body: >-
              While ID.me has built significant commercial scale—evidenced by over 150 million registered users,
              adoption across 20 federal agencies and 45 state governments, and a $340 million Series E funding round
              valuing the company at over $2 billion—its competitive moat faces persistent vulnerability from public
              policy intervention. During the pandemic, state workforce agencies credited ID.me with halting massive
              fraud operations, with California EDD citing over $125 billion and Arizona DES citing over $75 billion in
              prevented fraudulent disbursements. However, mandatory remote biometric onboarding sparked intense
              pushback from civil liberties organizations, bipartisan congressional committees, and government oversight
              bodies over facial recognition bias, privacy concerns regarding one-to-many face matching databases, and
              customer service queues that locked legitimate beneficiaries out of unemployment benefits. Although the
              IRS announced plans in 2022 to transition toward government-operated alternatives like Login.gov,
              technical integration complexities and identity assurance gaps have kept ID.me in active production across
              critical IRS tools through 2025. Nevertheless, ongoing public-sector scrutiny ensures that ID.me's
              long-term displacement risk stems not from private commercial market competition, but from potential
              legislative or executive mandates favoring public identity infrastructure.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Reusable Credential Fast Lane
            body: >-
              ID.me's strategic advantage over point-solution verification vendors lies in its portable credential
              network. With more than 55% of transactions occurring via pre-verified digital wallet sign-ins, relying
              parties benefit from sub-60-second onboarding that legacy credit bureau checks cannot replicate.
            calloutType: insight
            claimRefs:
              - CP002
              - CP007
          - type: callout
            title: Government Mandate and Policy Fragility
            body: >-
              The primary existential threat to ID.me's federal moat is public policy intervention rather than
              commercial rivals. Ongoing bipartisan congressional pressure and privacy scrutiny surrounding mandatory
              biometric collection create sustained political incentives for agencies to sponsor government-owned
              Login.gov alternatives.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              ID.me operates a dual-market identity verification model that monetizes access proofing across government
              agencies and commercial enterprises. Government contracts across twenty federal agencies and forty-five
              state agencies represent the foundational revenue driver, utilizing transaction-based task orders and
              subscription allocations for NIST IAL2 identity verification. In parallel, the company has expanded its
              commercial footprint across more than seventy healthcare systems, five hundred employers, and six hundred
              consumer brands. Commercial monetization operates via recurring software subscriptions and API transaction
              tiers for workforce onboarding and e-commerce group affiliation gating. This hybrid monetization enables
              ID.me to amortize upfront user verification expenses across subsequent commercial interactions, though
              true contract renewal terms and agency revenue concentration remain key diligence focal points.
            claimRefs:
              - CI007
              - CI010
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI007
              - CI010
