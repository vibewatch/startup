      - number: '8.2'
        title: Downside Risks and Competitive Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite widespread agency adoption across 20 federal and 45 state bodies, ID.me faces significant public
              policy, technical, and competitive vulnerabilities that directly impact its terminal value. Civil
              liberties organizations including the ACLU have heavily criticized the company's facial recognition
              deployments and one-to-many biometric database matching, sparking congressional inquiries and public
              backlash. Operational friction during peak benefit cycles resulted in prolonged wait times and account
              lockouts for legitimate claimants, driving public review sentiment down to an aggregate 2.7 stars on
              Trustpilot. Crucially, the federal government continues to expand Login.gov across more than 50 agencies
              as an in-house, non-biometric authentication alternative. Because Login.gov does not impose vendor
              licensing fees on citizens or require commercial facial scans, any federal consolidation away from
              commercial identity providers represents an existential threat to ID.me's public-sector revenue base.
