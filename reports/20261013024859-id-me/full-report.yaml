            body: >-
              The documented architecture has three named core assets: the Digital Wallet, a branded or white-label
              Credential Broker, and an Attribute Exchange, coordinated through a single Identity Gateway integration.
              The broker is described as applying relying-party settings across authentication, proofing, and attribute
