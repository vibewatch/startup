              - CR012
      - number: '7.2'
        title: Operational Quality and Security Exposure
        blocks:
          - type: paragraph
            body: >-
              From an operational standpoint, ID.me's business model requires balancing stringent identity assurance
              against user accessibility and system throughput. Automated algorithmic verification frequently encounters
              high failure rates among populations lacking established credit records or conventional documentation;
              internal data indicates automated pass rates can drop to approximately 32% in lower-income demographics.
              To prevent widespread exclusion, ID.me deploys a multi-pathway architecture comprising self-service
              document capture, remote video-chat referees, and in-person retail desks across approximately 690
              locations. While video verification successfully elevates pass rates to over 80%, this high-touch human
              fallback introduces severe operational vulnerabilities. Peak seasonal surges—such as annual tax filing
              deadlines or state unemployment spikes—frequently overwhelm video-referee queues, leading to prolonged
              wait times, user lockouts, and administrative verification loops.


              These operational frictions are reflected in consumer sentiment, where independent aggregators record
              sub-3-star average ratings characterized by persistent complaints regarding automated chatbot deflection,
              account recovery hurdles, and delayed benefit access. On the security front, ID.me maintains
              defense-in-depth protocols including AES 256-bit encryption with dynamic key rotation, SOC 2 Type 1
              certifications, and hosting within isolated Virtual Private Clouds on FedRAMP-authorized AWS
              infrastructure. User-facing defenses have also expanded to incorporate Passkey multi-factor authentication
              (MFA) and dedicated fraud reporting workflows. Nevertheless, storing sensitive identity attributes and
              biometric templates for over 150 million registered accounts makes ID.me an exceptionally lucrative target
              for credential harvesting, sophisticated social engineering, and external cyberattacks.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
