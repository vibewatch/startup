            body: >-
              ID.me states that relying parties may request only the personal data reasonably required for a service and
              that users review and authorize fields before release. Its security page also claims SOC 2 Type 1
              certification for the Identity Gateway, FedRAMP-authorized AWS hosting, FIPS 140-2 AES-256 protection for
              personally identifiable information, and annual third-party audits tied to Kantara and FICAM
              accreditations. These are useful procurement signals, but the assigned pool contains no current audit
              report, penetration-test result, incident history, recovery objective, or independent control assessment.
              External commentary also flags lockouts, verification loops, biometric fairness concerns, and the higher
