      - number: '8.4'
        title: Recommendation Stance and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              We conclude with a research-more recommendation and a stretched valuation stance. ID.me's scale in digital
              identity verification is undeniably impressive, but the hybrid debt-equity structure of the latest
              financing demonstrates that institutional equity investors demanded substantial debt leverage rather than
              pure equity risk at the $2.0 billion mark. Furthermore, the absence of publicly disclosed audited revenue,
              gross margins by customer cohort, and net revenue retention rates prevents rigorous multiple benchmarking
              against publicly traded cyber and IAM peers. Prior to committing growth equity or buying secondary shares,
              institutional investors must demand access to audited financial statements, historical debt covenant
              compliance reports, and multi-year public-sector contract renewal schedules to determine whether the
              equity value is adequately protected.
