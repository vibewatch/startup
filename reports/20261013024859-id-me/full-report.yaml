      - number: '6.2'
        title: Adoption Trajectory & Reusable Wallet Scale
        blocks:
          - type: paragraph
            body: >-
              The growth of ID.me's customer base reflects rapid post-2020 acceleration, driven initially by urgent
              state unemployment insurance fraud prevention during the pandemic and subsequently institutionalized
              across major civilian programs. Total registered digital wallet accounts expanded from 100 million in 2023
              to 130 million by mid-2024, reaching over 170 million by late 2026, representing nearly 60% of the adult
              population in the United States. Crucially for high-value government applications, over 60 million members
              have completed biometric or supervised in-person IAL2 proofing, establishing a substantial barrier to
              entry for competing credential service providers. The strategic value of this base lies in the reusable
              digital fast lane: pre-verified wallet users accounted for 55% of all new subscriptions across
              participating sites by early 2024, achieving a true pass rate exceeding 99% in under 60 seconds. This
              reusability significantly depresses ongoing verification marginal costs for partner agencies, although
              published metrics obscure the exact denominator of monthly active users versus dormant accounts created
              for one-time transactions.
            claimRefs:
              - CU001
