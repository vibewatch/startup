            title: Service Delivery Cost Bottlenecks and Labor-Intensive Verification
            body: >-
              While automated self-service verifications carry negligible marginal cost, ID.me's human-assisted video
              chat referees and physical retail partnerships represent significant operational cost centers. During
              surge demand periods, video verification queues and account lockouts create operational bottlenecks that
              can erode gross margins if automation rates fail to scale.
            calloutType: risk
