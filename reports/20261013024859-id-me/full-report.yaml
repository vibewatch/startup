      - number: '4.3'
        title: Digital Fast Lane Conversion and Credential Reuse Economics
        blocks:
          - type: paragraph
            body: >-
              The cornerstone of ID.me's financial thesis is the network effect of its reusable digital identity wallet.
              In 2024, the platform added 20.4 million new wallets and supported over 409 million successful logins,
              marking a 44 percent year-over-year increase. By the first quarter of 2024, pre-verified users accounted
              for 55 percent of all new subscriptions, up from 42 percent in early 2023. When an end user has already
              achieved IAL2 proofing, subsequent verifications at partner relying parties occur in under sixty seconds
              through pre-verified digital sign-ins, eliminating costly duplicate document checks. This credential
              portability expands operating leverage as the network grows. Nevertheless, external reports document
              periodic verification bottlenecks, customer service wait times, and account lockouts during peak
              government benefit surges, demonstrating that surges in unverified claimants can overwhelm capacity and
              temporarily compress service-delivery efficiency.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI009
              - CI010
