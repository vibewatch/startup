  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Posture
        blocks:
          - type: paragraph
            body: >-
              ID.me's rapid expansion across federal and state public services has positioned the company as an
              essential yet controversial digital gatekeeper. While the platform has attained significant compliance
              milestones—including Federal Identity, Credential, and Access Management (FICAM) certification, alignment
              with NIST SP 800-63-3 Identity Assurance Level 2 (IAL2) and Authenticator Assurance Level 2 (AAL2)
              guidelines, and a FedRAMP Moderate Authority to Operate (ATO) for its Identity Gateway—its regulatory and
              legal posture remains under sustained pressure. A prominent investigation by the Government Accountability
              Office (GAO) into the Internal Revenue Service's identity-proofing deployment revealed critical governance
              gaps. Specifically, the GAO determined that the tax agency relied on ID.me as its sole commercial provider
              of IAL2 verification without establishing measurable program objectives, formal ongoing performance
              evaluation procedures, or documenting ID.me's use of artificial intelligence within its agency AI use-case
              inventory. These deficits hinder agency oversight and raise ongoing compliance questions regarding whether
              taxpayers' rights and algorithmic fairness principles are systematically protected.


              Simultaneously, ID.me faces persistent legal and civil liberties scrutiny regarding its gatekeeping role
              for vital public benefits. Civil liberties organizations and congressional inquiries have challenged the
              requirement for citizens to route through a private, for-profit vendor requiring facial scans and
              sensitive personally identifiable information (PII) to access statutory benefits. Congressional leaders
              previously pressured federal agencies to halt mandatory facial recognition and to maintain non-biometric
              pathways or transition toward government-operated alternatives such as Login.gov. Although the Department
              of the Treasury and IRS preserved ID.me as an option alongside alternative pathways, the threat of
              regulatory mandates enforcing open interoperability or favoring public-sector credentialing solutions
              represents an enduring systemic hazard to ID.me's commercial model.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
