              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Procurement Pathways, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics differ fundamentally across ID.me's government and private-sector customer segments.
              In federal civilian agencies, Chief Information Officers and agency program directors purchase identity
              proofing through GSA Multiple Award Schedule (MAS) contracts or agency-specific blanket purchase
              agreements, driven by federal compliance mandates including FedRAMP authorization, SOC 2 Type II controls,
              and Kantara Initiative accreditations. State workforce and social service agencies procure verification
              tools to stem unemployment insurance fraud, frequently utilizing federal administrative grant funding and
              Department of Labor technical grants. Conversely, commercial retail brands procure ID.me through digital
              marketing and e-commerce budgets to automate discount eligibility for targeted demographic segments
              without requiring document handling by retail staff. Healthcare systems represent an emerging segment
              where Chief Information Security Officers procure credentialing to comply with DEA Electronic
              Prescriptions for Controlled Substances (EPCS) and patient portal security guidelines. These distinct
              procurement pathways create diverse revenue cycles, ranging from multi-year federal contract vehicles to
              consumption-based commercial API volume fees.
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption of ID.me is propelled by compelling network effects and high-friction alternatives. As ID.me's
              verified user base crossed 170 million individuals, the proportion of logins processed via its
              pre-verified digital fast lane expanded to 64% of all new subscriptions in Q3 2024. This pre-verified
              network reduces user onboarding friction to under 60 seconds and achieves pass rates above 99%.
              Furthermore, ID.me's multi-modal architecture—combining automated self-service, video referee interviews,
              and in-person retail locations—addresses the acute limitations of legacy credit bureau data brokers, which
              verify only 32% of individuals in low-income zip codes compared to an 81% true pass rate via ID.me video
              chat. Despite these strengths, structural adoption constraints persist. Significant public backlash from
              civil liberties organizations regarding facial recognition biometrics, vendor lock-in concerns among
              federal agencies, and competition from government-operated Login.gov constrain total addressable
              penetration. Security analysts note that consolidating sensitive identity documents and Social Security
              numbers into a single private repository elevates cyber risk. Evaluating long-term contract durability
              requires closing diligence gaps on government contract renewals and private revenue margins.
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reusable Credential Fast Lane Shapes Commercial Flywheel
            body: >-
              The expansion of ID.me's pre-verified user rate to 64% of new agency subscriptions in Q3 2024 demonstrates
              a consumer network effect that traditional enterprise single sign-on vendors lack. However, monetizing
              consumer credential reuse across commercial brands remains secondary to core public-sector verification
              contracts.
            calloutType: insight
            claimRefs:
              - CM001
              - CM008
          - type: callout
            title: Biometric Scrutiny and Vendor Lock-in Drive Public-Sector Hesitancy
            body: >-
              Civil liberties scrutiny surrounding facial recognition algorithms and documented backlog risks during
              peak benefits enrollment cycles create political and procurement friction for civilian agencies. The
              parallel presence of federally operated Login.gov prevents ID.me from achieving an uncontested monopoly
              across government identity proofing.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM013
          - type: callout
            title: Top-Line Fraud Exposure Is Not Addressable Software Spend
            body: >-
              While GAO estimates $521 billion in annual federal program fraud exposure and $5.6 billion in fiscal 2025
              unemployment improper payments, vendor contract values represent only a small fraction of gross program
              leakage. Extrapolating software market size directly from fraud totals risks overstating ID.me's near-term
              serviceable addressable market.
            calloutType: assumption
            claimRefs:
              - CM005
              - CM006
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Public-Sector Landscape and Direct Competitors
        blocks:
          - type: paragraph
            body: >-
              The digital identity verification landscape is split across distinct operating models: specialized
              government-operated portals, commercial identity verification vendors focused primarily on fintech and
              regulated commercial sectors, consumer biometric acceleration platforms, and legacy credit bureaus. Within
              the federal and state public sector, ID.me faces its most direct strategic substitute in Login.gov, the
              General Services Administration-managed single sign-on platform. Login.gov partners with over 50 federal,
              state, and local agencies to deliver privacy-focused identity proofing without collecting biometric facial
              scans. In contrast, commercial enterprise identity verification vendors such as Jumio, Entrust, and
              Trulioo deliver robust global document verification and automated risk analytics for commercial fintech
              and cryptocurrency applications, but maintain minimal production footprint across high-assurance
              public-sector benefits administration. Specialized physical security networks like CLEAR operate biometric
              iris and facial matching across airport security and sports stadiums, but remain inapplicable to federal
              entitlement programs. Meanwhile, legacy state government verification workflows that rely exclusively on
              credit bureaus and data broker knowledge-based verification suffer severe pass-rate penalties among
              lower-income and unbanked populations, leaving agencies dependent on modernized credential providers to
              bridge identity coverage gaps.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability Differentiation and Verification Modalities
        blocks:
          - type: paragraph
            body: >-
              Evaluating digital identity alternatives across technical and operational capabilities reveals sharp
              structural divergence between automated-only solutions and omnichannel identity verification
              architectures. Traditional algorithmic verification powered by data brokers and credit bureaus generates
              an automated pass rate of approximately 32% for applicants in the lowest income zip codes due to sparse
              credit bureau histories and stale residential records. To overcome this systemic bottleneck, ID.me
              operates an omnichannel verification architecture combining self-service automated biometric verification,
              live video calls with trained Trusted Referees, and in-person verification at retail partner locations.
              This multi-pathway design delivers certified NIST 800-63-3 Identity Assurance Level 2 (IAL2) proofing
              across diverse applicant demographics, closing an estimated 75% of the digital verification gap created by
              legacy credit bureau systems. Conversely, Login.gov emphasizes non-biometric authentication paths to
              satisfy federal privacy mandates, avoiding facial recognition but historically facing throughput
              constraints when applicants lack authoritative records. Commercial identity verification providers like
              Jumio and Trulioo excel in automated document fraud detection and international database matching, but
              lack dedicated government-cleared human referee infrastructure. CLEAR provides rapid physical transit
              verification via iris and fingerprint biometrics, but does not provide remote federal IAL2 credentialing.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
