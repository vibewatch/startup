    title: Publicly evidenced product architecture map
    type: stack
    summary: >-
      A functional stack separates the relying-party surface, reusable credential, orchestration, validation, proofing,
      and trust foundation without asserting an undisclosed deployment topology.
    data:
      layers:
        - label: Relying-party service
          detail: Government or commercial service requests authentication, proofing, or selected identity attributes.
        - label: Identity Gateway
          detail: Officially described single integration point for sign-on, MFA, proofing, and attribute validation.
        - label: Digital Wallet
          detail: Stores the reusable credential that an individual can present again inside the accepting network.
        - label: Credential Broker
          detail: Applies custom relying-party settings across providers and identity functions.
        - label: Attribute Exchange and proofing paths
          detail: Validates credentials and supports self-service, video-chat, or in-person proofing.
        - label: Trust and security foundation
