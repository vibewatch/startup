      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Network Velocity and Reusable Credential Moat
            body: >-
              With over 152 million user accounts and 76 million verified to federal NIST IAL2 benchmarks, ID.me has
              established significant network effects across 21 federal agencies and 45 state bodies. Credential
              reusability dramatically lowers marginal onboarding friction for new enterprise and agency adoptions.
            calloutType: strength
            claimRefs:
