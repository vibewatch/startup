      - number: '7.3'
        title: Partner, Platform, and Customer Dependencies
        blocks:
          - type: paragraph
            body: >-
              ID.me exhibits acute dependency and concentration risks across its customer base, partner network, and
              cloud infrastructure. Most critically, the company's financial momentum is heavily concentrated within
              public-sector accounts. Between June 2021 and April 2025 alone, the IRS obligated $234.7 million for ID.me
              licenses and support services through a blanket purchase agreement (BPA) alongside software distributor
              V3Gate. Combined with contracts across 20+ federal agencies and 50 state government entities,
              public-sector procurement represents a dominant revenue and user acquisition engine. This concentration
              creates binary renewal exposure: any macro shift in federal ICAM policy, budgetary clawbacks, or
              procurement transitions to multi-vendor frameworks would directly compress enterprise value.


              On the technological and partner front, ID.me's entire software-as-a-service delivery model depends on
              Amazon Web Services (AWS) Tier-III data centers and FedRAMP-authorized government cloud environments. An
              extended infrastructure outage or accreditation disruption would immediately compromise service
              availability across nationwide public portals. Furthermore, to address fraud occurring after identity
              proofing, ID.me entered a strategic partnership with Plaid in September 2026. This alliance links ID.me's
              digital wallet with Plaid's financial account verification rails, allowing government agencies to confirm
              that account disbursement destinations match verified recipient credentials. While this integration closes
              a critical anti-fraud loophole, it simultaneously introduces external API dependencies on Plaid and
              participating financial institutions for benefit delivery execution.
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Financial Model Risks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The financial viability of ID.me's high-valuation multiple ($2+ billion private mark) relies on
              transitioning high-cost public-sector identity acquisitions into high-margin reusable commercial network
              effects. However, substantial financial and model risks persist. First, the unit economics of
              human-assisted verification remain opaque. Scaling video referees and retail partner desks to handle
              demographic edge cases and compliance mandates requires substantial variable labor and operational
              expenditure, threatening gross margin expansion if agency pricing structures do not fully offset
              human-in-the-loop escalation costs. Second, the broader fraud landscape continues to evolve rapidly. The
              Government Accountability Office documented $5.6 billion in improper unemployment insurance payments in
              fiscal year 2025 (a 14.9% error rate), demonstrating that sophisticated criminal syndicates continually
              exploit seams between identity verification, account linkage, and state payment disbursement processors.


              From an underwriting perspective, investors must establish concrete thesis-break triggers to evaluate
              deteriorating fundamentals. Primary kill criteria include: (1) formal non-renewal or multi-vendor
              disaggregation of the IRS blanket purchase agreement upon contract expiration; (2) federal executive or
              legislative directives mandating Login.gov as the exclusive identity provider for federal agencies; (3)
              recurring GAO, DOJ, or FTC enforcement actions identifying unmitigated algorithmic bias or failure to
              implement documented AI oversight controls; and (4) material gross margin erosion resulting from rising
              referee staffing costs or expanding commercial liability in benefit fraud indemnification. In confirmatory
              diligence, investors must demand audited gross margins by customer cohort, unit costs per verification
              pathway, and contractual renewal pipeline visibility across top-tier public agencies.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR010
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Single-Provider Public Sector Concentration Risk
            body: >-
              The GAO's audit of the IRS's sole-source IAL2 identity-proofing contract ($234.7 million obligated)
              underscores the regulatory and political fragility of ID.me's primary revenue channel, where shifting
              federal policy or accelerated adoption of public-sector alternatives like Login.gov could trigger severe
              top-line contraction.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR010
          - type: callout
            title: Disbursement-Identity Decoupling in Public Benefit Programs
            body: >-
              While ID.me verifies claimant identities, federal benefit fraud frequently occurs at the account
              disbursement destination; the Plaid partnership addresses this gap but highlights ID.me's reliance on
              external fintech rails to defend agency fraud prevention outcomes.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Financing Structure
        blocks:
          - type: paragraph
            body: >-
              ID.me has positioned itself as the preeminent civilian digital identity network in the United States,
              expanding its user base to more than 152 million registered members with 76 million verified to federal
              NIST IAL2 standards. The company's platform adoption accelerated notably through 2024, adding 20.4 million
              new wallets and processing over 409 million successful authentication events. In September 2025, ID.me
              announced a headline $340 million financing package valuing the company at more than $2.0 billion, led by
              Ribbit Capital alongside Ares Credit funds and Moonshots Capital. However, critical structural scrutiny
              reveals that the transaction consisted of only $65 million in Series E equity paired with a $275 million
              credit facility from Ares. While previous private transactions and tender offers priced ID.me between
              $1.73 billion and $1.8 billion, paying a premium above $2.0 billion on an equity slice without audited
              revenue figures creates substantial valuation risk.
