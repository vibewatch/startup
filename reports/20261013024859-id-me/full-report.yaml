      - number: '8.3'
        title: Valuation Scenarios and Return Expectations
        blocks:
          - type: paragraph
            body: >-
              Valuing ID.me requires evaluating the delicate balance between rapid credential network effects and the
              significant preference overhang created by senior debt. In our bull scenario, ID.me successfully monetizes
              its 152 million consumer credentials across commercial healthcare, financial services, and emerging AI
              agent authentication workflows, driving enterprise revenue share above 50% and supporting an exit
              valuation between $3.5 billion and $4.0 billion. In our base scenario, public sector accounts renew with
              modest annual growth, but commercial expansion remains steady rather than exponential, yielding a fair
              valuation range of $2.0 billion to $2.2 billion that offers minimal equity upside relative to current
              private marks. In our bear scenario, federal agencies transition priority workloads to Login.gov and state
              unemployment contracts lapse, compressing revenue while debt service on the $275 million Ares credit
              facility triggers restructuring covenants, impairing equity value toward $1.0 billion.
            claimRefs:
