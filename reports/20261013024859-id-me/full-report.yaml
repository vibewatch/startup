      credential network scale.
    data:
      points:
        - label: ID.me
          x: 8.5
          'y': 9
          detail: High NIST 800-63-3 IAL2 accreditation and large consumer wallet network spanning over 150 million users.
        - label: Login.gov
          x: 9
          'y': 6.5
          detail: >-
            Strong federal backing across 50+ agencies, but limited commercial network and no native video referee
            fallback.
