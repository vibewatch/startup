      - number: '4.2'
        title: Pricing Structure, Unit Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              ID.me's unit economics reflect a structural divergence between automated digital fast lane transactions
              and labor-intensive human verification exceptions. The company reported revenue expansion of 450 percent
              between 2020 and 2024, with third-party private market estimates placing fiscal year 2023 revenue in the
              range of $130 million. For standard automated credential checks, marginal service costs are negligible,
              yielding high contribution margins typical of modern enterprise software. However, users who fail
              automated biometric matching or lack authoritative credit bureau records must be routed to live video chat
              referees or physical retail appointments. These manual channels introduce significant variable labor
              expenses and operational friction, representing the primary drag on overall blended gross margins. Because
              audited GAAP gross margins and channel-specific unit costs remain undisclosed, underwriting ID.me's
              long-term margin trajectory requires auditing the direct labor overhead of its human referee network.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
              - CI014
          - type: table
