            body: >-
              With over 170 million digital wallet accounts and 60 million NIST IAL2-verified holders, ID.me has built a
              formidable civilian identity network. Pre-verified users achieve over 99% authentication pass rates across
              22 federal and 50 state agencies, transforming single-agency identity proofing into an ecosystem-wide
