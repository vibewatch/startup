chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              ID.me is a commercial digital identity network and credential service provider founded in 2010 by former
              U.S. Army Ranger Blake Hall and headquartered in McLean, Virginia [CO001]. The platform originated as
              TroopSwap, a digital affiliation verification service designed to confirm military service for consumer
              retail discounts without requiring veterans to present sensitive physical documentation such as DD214
              forms [CO012]. Over the subsequent decade, ID.me expanded beyond affinity verification into high-assurance
              identity proofing for regulated government, healthcare, and enterprise sectors [CO004]. The platform
              operates as a portable digital identity wallet that enables individuals to complete identity verification
              once and seamlessly sign into participating services without redundant reverification [CO004]. As of late
              2025, ID.me reports more than 152 million registered digital wallet accounts, including over 76 million
              individuals verified to federal Identity Assurance Level 2 (IAL2) standards established by the National
              Institute of Standards and Technology (NIST) [CO004]. More than 60 million pre-verified Americans utilize
              ID.me credentials to access services across 16 federal agencies and 40 state agencies, establishing a
              reusable credential moat that lowers marginal adoption friction for newly integrated public and private
              organizations [CO008].
            claimRefs:
              - CO001
              - CO004
              - CO008
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO011
      - number: '1.2'
        title: Executive Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              ID.me was co-founded by Chief Executive Officer Blake Hall and identity strategist Matt Thompson, with
              foundational systems architecture led by technical co-founder Tanel Suurhans [CO002]. Blake Hall has
              served as the continuous public face and strategic leader of the company since inception, leveraging his
              military operational background and Harvard business training to navigate complex public-sector
              procurement cycles and federal oversight [CO001, CO003]. Executive leadership is heavily centralized
              around Hall, who serves as the primary interlocutor with congressional committees, federal agency
              directors, and institutional investors [CO003]. While Matt Thompson played an instrumental role in
              aligning ID.me's early technical roadmap with NIST 800-63-3 standards and Kantara Initiative
              accreditation, ongoing commercial scale has elevated operational dependencies on executive leadership
              across government relations and automated fraud defense [CO002, CO003]. Governance disclosures remain
              tightly guarded under private company status, with limited public visibility into independent board
              oversight, audit committee composition, or succession planning [CO003].
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization, Debt Facility, and Investor Map
        blocks:
          - type: paragraph
            body: >-
              ID.me's capital structure reflects a multi-stage transition from venture-backed identity startup to
              heavily capitalized growth-stage infrastructure provider [CO005]. In September 2025, the company announced
              a $340 million financing package at a post-money valuation exceeding $2.0 billion [CO005]. The equity
              component of this package was a Series E round led by Ribbit Capital, with participation from Moonshots
              Capital and Positive Sum [CO005, CO007]. The financing package also incorporated a $275 million credit
              facility closed in January 2025 from funds managed by Ares Management, providing substantial balance-sheet
              liquidity and non-dilutive capital to scale digital wallet capabilities [CO006, CO007]. Ares Management
              also committed to direct equity investment, joining previous growth equity backers Viking Global Investors
              and early investor FTV Capital [CO006, CO007]. The company previously completed a secondary tender offer
              in November 2024 at an indicated $1.8 billion valuation, providing employee and early shareholder
              liquidity following reported revenue expansion of 450 percent between 2020 and 2024 [CO005, CO011].
              However, audited financial statements, revenue run rates, and exact covenant restrictions governing the
              Ares credit facility remain private [CO006, CO011].
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: Corporate Evolution, Rollouts, and Operational Friction
        blocks:
          - type: paragraph
            body: >-
              ID.me's operational trajectory combines rapid public-sector penetration with recurring regulatory and
              civil liberties scrutiny [CO009, CO013]. In December 2025, ID.me achieved two landmark institutional
              milestones: entering a major contract with the Centers for Medicare & Medicaid Services (CMS) to provide
              identity verification and sign-in services on Medicare.gov starting in early 2026, and launching an early
              access deployment on FINRA's Entitlement Platform for regulated financial institutions [CO009, CO010].
              These high-assurance integrations solidify ID.me's status as a critical gatekeeper for federal healthcare
              and financial market access [CO009, CO010]. However, this rapid institutional adoption has been
              accompanied by material friction [CO013]. During the COVID-19 pandemic surge, ID.me drew widespread
              criticism from civil rights organizations, congressional committees, and affected citizens regarding its
              mandatory 1:many facial-recognition screening, algorithmic misidentifications, and extended video-call
              wait times that temporarily locked legitimate beneficiaries out of state unemployment benefits [CO013].
              While ID.me subsequently introduced live video chat agents and in-person retail verification to mitigate
              access exclusion, consumer reviews on platforms such as Trustpilot continue to document user friction with
              automated verification loops and AI support escalation [CO013, CO014].
            claimRefs:
              - CO009
              - CO010
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
