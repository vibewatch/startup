chapter:
  number: 6
  title: "Customers"
  summary: "ID.me has scaled its reusable digital identity wallet to over 170 million registered users across 22 federal agencies, 50 state governments, 85 healthcare systems, and 600 retail brands. The network achieves high consumer density and >99% reusability pass rates, but customer concentration in government benefits and ongoing verification friction create meaningful procurement and renewal vulnerabilities."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation & Multi-Sided Network Structure"
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
    body: "ID.me operates a distinct multi-sided identity platform spanning federal civilian agencies, state workforce departments, healthcare provider systems, and commercial consumer brands. Rather than functioning as a conventional point-solution vendor, the company leverages a unified digital identity wallet where user verification performed for one relying party creates a reusable credential across the entire network. At the public-sector core, 22 federal agencies and 50 state government entities deploy ID.me to satisfy strict federal identity assurance standards, particularly NIST 800-63-3 Identity Assurance Level 2 (IAL2) mandates required for high-risk benefits and tax administration. In the private sector, ID.me has expanded into healthcare across more than 85 provider organizations, while maintaining a footprint of over 600 retail brands that utilize its community verification capabilities for targeted discounts. However, this multi-sided structure creates asymmetric commercial dynamics: government agencies provide the non-negotiable user acquisition mandates, while commercial brands monetize user group affiliations, leaving underlying contract revenues heavily exposed to public procurement timelines."
  - id: "adoption-trajectory-growth"
    title: "Adoption Trajectory & Reusable Wallet Scale"
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
    body: "The growth of ID.me's customer base reflects rapid post-2020 acceleration, driven initially by urgent state unemployment insurance fraud prevention during the pandemic and subsequently institutionalized across major civilian programs. Total registered digital wallet accounts expanded from 100 million in 2023 to 130 million by mid-2024, reaching over 170 million by late 2026, representing nearly 60% of the adult population in the United States. Crucially for high-value government applications, over 60 million members have completed biometric or supervised in-person IAL2 proofing, establishing a substantial barrier to entry for competing credential service providers. The strategic value of this base lies in the reusable digital fast lane: pre-verified wallet users accounted for 55% of all new subscriptions across participating sites by early 2024, achieving a true pass rate exceeding 99% in under 60 seconds. This reusability significantly depresses ongoing verification marginal costs for partner agencies, although published metrics obscure the exact denominator of monthly active users versus dormant accounts created for one-time transactions."
  - id: "enterprise-agency-deployments"
    title: "Public Sector & Commercial Production Deployments"
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
    body: "ID.me has transitioned from exploratory pilot implementations into foundational production infrastructure across several of the largest civilian IT environments in the United States. At the federal level, the Department of Veterans Affairs established ID.me alongside Login.gov as the exclusive secure authentication methods for VA.gov, phasing out legacy DS Logon and My HealtheVet credentials to centralize health care enrollment and pension distribution. Similarly, the Internal Revenue Service relies on ID.me as its primary taxpayer online account identity verification engine for tax records, transcript access, and payment agreements, following comprehensive technical and security due diligence. Across state governments, departments of labor in California, Arizona, New York, and dozens of other jurisdictions deployed ID.me to halt organized fraud syndicates, with state officials attributing tens of billions of dollars in prevented fraudulent disbursements to the platform. In the commercial sphere, enterprises such as USAA and Allscripts completed extensive processing environment reviews to secure financial transactions and electronic prescribing workflows, validating ID.me's enterprise compliance posture."
  - id: "retention-churn-concentration"
    title: "Retention Durability, Procurement Friction & Concentration Risks"
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    body: "While ID.me demonstrates deep integration across public agencies, its long-term customer durability faces acute risks stemming from customer concentration, procurement politics, and user friction. Public sector contracts represent a disproportionate share of high-assurance transaction volume and strategic value, yet these relationships remain vulnerable to federal policy shifts favoring government-owned alternatives like Login.gov. Furthermore, automated biometric screening and strict identity proofing workflows have generated substantial controversy: applicants frequently report account lockouts, identity verification loops, and extended wait times for manual video referee reviews during peak demand periods. These bottlenecks, highlighted in congressional inquiries and reflected in aggregate consumer review ratings below 3.0 out of 5 stars on Trustpilot, create persistent headline risk for contracting agency leadership. To deepen account stickiness and mitigate payment fraud beyond identity proofing, ID.me partnered with Plaid in September 2026 to verify recipient bank account ownership before state and federal benefit disbursement, targeting the $5.6 billion in annual improper unemployment payments. Nevertheless, detailed retention metrics such as net revenue retention and agency cohort renewal rates remain closely guarded private figures."
