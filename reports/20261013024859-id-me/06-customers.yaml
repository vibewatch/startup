figures:
  - id: "FU001"
    title: "Customer Journey and Network Expansion Flywheel"
    type: "journey-map"
    summary: "Six-stage lifecycle from mandatory agency identity proofing to portable credential reuse and integrated financial account verification."
    data:
      items:
        - label: "1. Mandated Agency Proofing"
          detail: "Federal or state agency directs applicant to verify identity for critical benefits or tax access"
          tone: "neutral"
        - label: "2. Omni-Channel Verification"
          detail: "Applicant completes self-service selfie, supervised video chat, or in-person retail proofing"
          tone: "neutral"
        - label: "3. Portable Credential Minting"
          detail: "NIST 800-63-3 IAL2/AAL2 digital wallet credential issued with over 99% recurring pass rate"
          tone: "positive"
        - label: "4. Digital Fast-Lane Reuse"
          detail: "Pre-verified user logs in across 22 federal and 50 state agencies in under 60 seconds"
          tone: "positive"
        - label: "5. Cross-Sector Roaming"
          detail: "Member extends identity wallet to 85+ healthcare providers and 600+ brand discounts"
          tone: "neutral"
        - label: "6. Benefit Payment Linking"
          detail: "Plaid integration verifies bank account ownership before benefit funds disburse"
          tone: "positive"
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU013"
      - "CU014"
callouts:
  - calloutType: "strength"
    title: "Reusability Flywheel & National Scale"
    body: "With over 170 million digital wallet accounts and 60 million NIST IAL2-verified holders, ID.me has built a formidable civilian identity network. Pre-verified users achieve over 99% authentication pass rates across 22 federal and 50 state agencies, transforming single-agency identity proofing into an ecosystem-wide retention and expansion engine."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU007"
  - calloutType: "risk"
    title: "Concentration Exposure & User Friction"
    body: "Despite high agency penetration, ID.me faces material vulnerability from public-sector procurement concentration and policy shifts toward government-operated alternatives like Login.gov. Persistent consumer frustration over account lockouts and customer service bottlenecks during peak benefit cycles presents recurring reputational and contract renewal risks."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU014"
