callouts:
  - calloutType: "strength"
    title: "Network Velocity and Reusable Credential Moat"
    body: "With over 152 million user accounts and 76 million verified to federal NIST IAL2 benchmarks, ID.me has established significant network effects across 21 federal agencies and 45 state bodies. Credential reusability dramatically lowers marginal onboarding friction for new enterprise and agency adoptions."
    claimRefs:
      - "CO004"
      - "CO008"
  - calloutType: "risk"
    title: "Public Scrutiny and Verification Accessibility Bottlenecks"
    body: "High reliance on facial recognition and automated identity verification has historically triggered intense scrutiny from civil rights organizations and federal watchdogs, particularly when algorithmic rejections or video chat queue times lock vulnerable populations out of critical public assistance programs."
    claimRefs:
      - "CO010"
      - "CO013"
