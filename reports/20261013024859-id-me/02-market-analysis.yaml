callouts:
  - calloutType: "insight"
    title: "Reusable Credential Fast Lane Shapes Commercial Flywheel"
    body: "The expansion of ID.me's pre-verified user rate to 64% of new agency subscriptions in Q3 2024 demonstrates a consumer network effect that traditional enterprise single sign-on vendors lack. However, monetizing consumer credential reuse across commercial brands remains secondary to core public-sector verification contracts."
    claimRefs:
      - "CM001"
      - "CM008"

  - calloutType: "risk"
    title: "Biometric Scrutiny and Vendor Lock-in Drive Public-Sector Hesitancy"
    body: "Civil liberties scrutiny surrounding facial recognition algorithms and documented backlog risks during peak benefits enrollment cycles create political and procurement friction for civilian agencies. The parallel presence of federally operated Login.gov prevents ID.me from achieving an uncontested monopoly across government identity proofing."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM013"

  - calloutType: "assumption"
    title: "Top-Line Fraud Exposure Is Not Addressable Software Spend"
    body: "While GAO estimates $521 billion in annual federal program fraud exposure and $5.6 billion in fiscal 2025 unemployment improper payments, vendor contract values represent only a small fraction of gross program leakage. Extrapolating software market size directly from fraud totals risks overstating ID.me's near-term serviceable addressable market."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM014"

