  topStrengths:
    - Reusable identity network with repeat-use credentials across participating services.
    - Large public-sector footprint and substantial wallet / login scale.
    - Named security and compliance frameworks that support procurement conversations.
  topRisks:
    - Audited revenue, margin, and retention disclosure remains limited for a company priced above $2B.
    - Public-sector concentration and policy dependence could affect renewal visibility and growth.
    - Biometric and assisted-verification friction still create access and reputation risk.
  unresolvedGaps:
    - 2025 and 2026 audited revenue, gross margin, and retention by major customer cohort.
    - Debt covenants, preference stack, and full cap-table economics from the 2025 financing package.
    - Customer concentration and renewal visibility across IRS, CMS, and other major public-sector deployments.
    - Operational metrics on human-review rates, queue times, and wallet or API service levels.
    - Hard evidence that reusable-credential economics are strong enough to justify a sustained premium multiple.
