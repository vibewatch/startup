    title: "Recommendation: Research-More on Stretched Private Valuation"
    body: "While ID.me possesses an unmatched civilian identity network of 152 million registered users, the recent $340 million transaction reveals that $275 million was debt rather than equity. Investors should defer participating in secondary equity offerings at the >$2 billion mark until audited revenue, gross margins, and public-sector retention rates are disclosed."
