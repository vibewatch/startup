companyProfile:
  summary: >-
    ID.me is a late-stage private digital identity verification network founded in 2010 and based in McLean, Virginia.
    Its product stack centers on a reusable identity wallet and gateway that support one-time proofing, sign-on,
    attribute exchange, and assisted verification flows for government, healthcare, and commercial relying parties.
