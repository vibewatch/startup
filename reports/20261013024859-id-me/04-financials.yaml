callouts:
  - calloutType: "risk"
    title: "Service Delivery Cost Bottlenecks and Labor-Intensive Verification"
    body: "While automated self-service verifications carry negligible marginal cost, ID.me's human-assisted video chat referees and physical retail partnerships represent significant operational cost centers. During surge demand periods, video verification queues and account lockouts create operational bottlenecks that can erode gross margins if automation rates fail to scale."
    claimRefs:
      - "CI007"
      - "CI012"

  - calloutType: "insight"
    title: "Credit Facility Leverage and Forward Capital Adequacy"
    body: "The September 2025 $340 million financing package was heavily weighted toward debt, incorporating a $275 million Ares Management credit facility alongside $65 million in Series E equity. While providing substantial liquidity to scale without excessive equity dilution, the sizable debt load introduces interest service obligations that increase financial risk if government contract renewals face budgetary or competitive compression."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"

