callouts:
  - calloutType: "insight"
    title: "The Reusable Credential Fast Lane"
    body: "ID.me's strategic advantage over point-solution verification vendors lies in its portable credential network. With more than 55% of transactions occurring via pre-verified digital wallet sign-ins, relying parties benefit from sub-60-second onboarding that legacy credit bureau checks cannot replicate."
    claimRefs:
      - "CP002"
      - "CP007"
  - calloutType: "risk"
    title: "Government Mandate and Policy Fragility"
    body: "The primary existential threat to ID.me's federal moat is public policy intervention rather than commercial rivals. Ongoing bipartisan congressional pressure and privacy scrutiny surrounding mandatory biometric collection create sustained political incentives for agencies to sponsor government-owned Login.gov alternatives."
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP014"
