              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: 估值情景与回报预期
        blocks:
          - type: paragraph
            body: >-
              给 ID.me 估值，必须权衡凭证网络效应的快速增长与高级债务造成的显著优先权压顶。在乐观情景中，ID.me 成功将 152M 个消费者凭证变现，覆盖商业医疗、金融服务和新兴的 AI
              智能体认证工作流，推动企业收入占比超过 50%，支撑 $3.5B 至 $4.0B 的退出估值。在基准情景中，公共部门客户以温和的年度增速续约，商业扩张保持稳定而非指数增长，合理估值区间为 $2.0B 至
              $2.2B；相对当前私募估值，股权上行空间很小。在悲观情景中，联邦机构把重点工作负载转向 Login.gov，州级失业合同到期，收入承压；同时，$275M Ares 信贷额度的偿债触发重组契约，股权价值被压向
              $1.0B。
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV013
      - number: '8.4'
        title: 建议立场与尽调重点
        blocks:
          - type: paragraph
            body: >-
              我们的结论是“继续研究”，并认为估值偏高。ID.me 在数字身份核验上的规模无疑令人印象深刻，但最新融资采用债股混合结构，说明机构股权投资者在 $2.0B
              估值水平上要求大量债务杠杆，而不是承担纯股权风险。此外，公司未公开披露经审计收入、按客户群划分的毛利率和净收入留存率，无法与公开交易的网络安全和 IAM
              同业进行严格倍数基准比较。在投入成长股权或购买老股前，机构投资者必须要求查阅经审计财务报表、历史债务契约合规报告，以及多年公共部门合同续约计划，以判断股权价值是否得到充分保护。
            claimRefs:
              - CV003
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议：对高估值私募估值继续研究
            body: >-
              ID.me 拥有 152M 个注册用户组成的无可匹敌的民用身份网络，但近期 $340M 交易显示，其中 $275M 是债务而非股权。在披露经审计收入、毛利率和公共部门留存率之前，投资者应暂缓在 $2B+
              估值水平参与老股发行。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
          - type: callout
            title: 结构性压顶：高级信贷额度与公共部门依赖
            body: $275M Ares 信贷额度在资本结构中位居优先级较高的位置，同时零成本政府替代方案 Login.gov 的竞争不断加剧；联邦机构的任何重大合同中断，都可能在下行情景中迅速侵蚀普通股价值。
            calloutType: risk
            claimRefs:
              - CV003
              - CV008
              - CV013
