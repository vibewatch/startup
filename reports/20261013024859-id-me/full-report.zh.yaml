  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与融资结构
        blocks:
          - type: paragraph
            body: >-
              ID.me 已把自己定位为美国领先的民用数字身份网络，注册用户扩大至 152M+，其中 76M 已通过联邦 NIST IAL2 标准核验。平台采用在 2024 年明显提速，新增 20.4M
              个数字钱包，并处理了超过 409M 次成功认证。2025 年 9 月，ID.me 宣布一项名义规模为 $340M 的融资方案，公司估值超过 $2.0B；Ribbit Capital 领投，Ares Credit
              基金和 Moonshots Capital 参与。但仔细看结构，这笔交易只有 $65M 的 Series E 股权，另配 Ares 提供的 $275M 信贷额度。此前私募交易和要约收购对 ID.me 的定价在
              $1.73B 至 $1.8B 之间；在没有经审计收入数据的情况下，仅为一小部分股权支付超过 $2.0B 的溢价，带来很大的估值风险。
            claimRefs:
