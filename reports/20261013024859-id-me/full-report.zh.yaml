        title: 展示项
        blocks:
          - type: callout
            title: 网络增长速度与可复用凭证壁垒
            body: >-
              ID.me 拥有超过 1.52 亿用户账户，其中 7600 万按联邦 NIST IAL2 基准完成核验，并已在 21 个联邦机构和 45
              个州机构形成显著网络效应。凭证可复用，大幅降低新企业和机构接入的边际上线摩擦。
            calloutType: strength
            claimRefs:
              - CO004
              - CO008
          - type: callout
            title: 公共审查与验证可及性瓶颈
            body: 对人脸识别和自动身份验证的高度依赖，长期受到民权组织和联邦监督机构的强烈审查；算法拒绝或视频聊天排队时间过长尤其会让脆弱人群无法获得关键公共援助。
            calloutType: risk
            claimRefs:
