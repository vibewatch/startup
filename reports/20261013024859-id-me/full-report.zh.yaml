      - number: '7.2'
        title: 运营质量与安全暴露
        blocks:
          - type: paragraph
            body: >-
              从运营角度看，ID.me 的商业模式必须在严格身份保证、用户可及性和系统吞吐量之间取得平衡。自动算法验证经常在缺少既有征信记录或常规文件的人群中失败率较高；内部数据显示，低收入人群的自动通过率可能降至约
              32%。为避免大范围排斥，ID.me 部署多路径架构，包括自助文件采集、远程视频聊天审查员，以及遍布约 690 个地点的线下零售柜台。视频验证虽能将通过率提升至 80%
              以上，但这种高接触人工兜底带来严重运营脆弱性。年度报税截止期或州失业申请激增等季节性高峰，常常压垮视频审查队列，导致等待时间拉长、用户账户锁定和行政验证循环。\n+\n+                           
              这些运营摩擦反映在消费者情绪中：独立聚合平台记录的平均评分低于 3 星，投诉集中于自动聊天机器人推诿、账户恢复障碍和福利访问延迟。安全防护上，ID.me 维护纵深防御协议，包括带动态密钥轮换的 AES 256
              位加密、SOC 2 Type 1 认证，以及在获 FedRAMP 授权的 AWS 基础设施中使用隔离虚拟私有云托管。面向用户的防护还扩展到 Passkey 多因素认证（MFA）和专门的欺诈举报工作流。然而，为超过
              1.5 亿个注册账户存储敏感身份属性和生物识别模板，使 ID.me 成为凭证窃取、高级社会工程和外部网络攻击极具吸引力的目标。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR014
