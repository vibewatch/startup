      - number: '3.3'
        title: 定价结构、转换成本与锁定动态
        blocks:
          - type: paragraph
            body: >-
              公共部门身份核验的采购动态和转换壁垒，与标准企业 SaaS 定价模式有根本差异。ID.me
              和联邦机构都不发布标准化单价表，商业身份验证合同通常采用定制企业订阅、按交易计费的验证档位和机构专属任务订单。对评估替代方案的机构而言，迁离 ID.me 会产生显著技术、运营和公民体验转换成本。由于 ID.me
              作为 VA.gov、SSA.gov 和 Medicare.gov 等主要公共门户的集中式身份代理和凭证钱包，已完成核验的用户可以在 60 秒内登录新加入的机构。2024 年初，预核验钱包登录占平台全部用户订阅的
              55% 以上，形成双边网络效应：公民采用扩大，会提高机构集成意愿。开发并认证机构专属身份平台，需要多年软件工程投入、FedRAMP High 授权、Kantara Trust Framework
              审计和持续反欺诈运营，多数公共实体无法以具成本效益的方式在内部维持。
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP013
              - CP015
