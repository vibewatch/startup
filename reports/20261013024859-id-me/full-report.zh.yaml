      - number: '6.2'
        title: 采用轨迹与可复用钱包规模
        blocks:
          - type: paragraph
            body: >-
              ID.me 客户基础在 2020 年之后迅速加速：最初由疫情期间州失业保险反欺诈的紧急需求驱动，随后制度化进入主要民用项目。注册数字钱包账户从 2023 年的 100 million 增至 2024 年年中的
              130 million，至 2026 年末超过 170 million，约占美国成年人口的 60%。对高价值政府应用而言，超过 60 million 名成员已完成生物识别或受监督的线下 IAL2
              核验，为竞争凭证服务商建立了高进入壁垒。这一用户基础的战略价值在于可复用数字快速通道：截至 2024 年初，参与网站的新订阅中 55% 来自预核验钱包用户，在 60 秒内实现超过 99%
              的真实通过率。这种复用显著压低合作机构持续核验的边际成本，但已公布指标掩盖了月活用户与为一次性交易创建的休眠账户之间的确切分母。
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
