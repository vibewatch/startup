      - number: '6.3'
        title: 公共部门与商业生产部署
        blocks:
          - type: paragraph
            body: >-
              ID.me 已从探索性试点转为美国数个最大民用 IT 环境的基础生产设施。联邦政府方面，退伍军人事务部将 ID.me 与 Login.gov 一并设为 VA.gov 的专属安全认证方式，逐步淘汰 DS Logon
              和 My HealtheVet 凭证，以集中管理医疗登记和养老金发放。同样，国税局经过全面技术与安全尽调后，将 ID.me
              作为税务记录、成绩单访问和付款协议的主要纳税人在线账户身份验证引擎。州政府也采取了类似做法：加利福尼亚、亚利桑那、纽约及其他数十个司法辖区的劳工部门部署 ID.me
              以打击有组织欺诈，州官员将数百亿美元的避免欺诈发放归功于该平台。在商业领域，USAA 和 Allscripts 等企业完成广泛的处理环境审查，以保障金融交易和电子处方流程，验证了 ID.me 的企业合规能力。
            claimRefs:
              - CU008
