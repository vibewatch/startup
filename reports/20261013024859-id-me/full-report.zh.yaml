              认证相关的年度第三方审计。这些是有用的采购信号，但指定证据池没有当前审计报告、渗透测试结果、事件历史、恢复目标或独立控制评估。外部评论还指出账户锁定、验证循环、生物识别公平性担忧及人工辅助路径较高的运营成本。因此，核心尽调问题不是控制是否被命名，而是其当前范围、运营有效性和用户结果权衡能否得到证明。
