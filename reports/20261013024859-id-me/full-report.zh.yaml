  - id: FI001
    title: 收入模式转化流程
    type: flow
    summary: 从终端用户核验需求出发，经联邦和商业依赖方，转化为经常性交易与核验收入的路径。
    data:
      nodes:
        - id: user-verification
          label: 公民 / 消费者访问请求
          detail: 用户尝试访问政府门户（IRS、VA、州 DOL）或商业零售合作伙伴。
        - id: policy-routing
          label: 凭证与政策评估
          detail: 依赖方请求 IAL2/AAL2 证明，或核验群体属性。
        - id: channel-execution
          label: 执行核验渠道
          detail: 自动化证件自拍、远程视频核验员，或零售门店现场核验。
        - id: reusable-credential
          label: 钱包签发与预核验
          detail: 凭证存入可移植数字钱包，可在网络内即时复用 60 秒。
        - id: relying-party-billing
          label: 依赖方变现
          detail: 向机构 / 品牌收取按次核验费、年度 SaaS 订阅费或按量分层费用。
        - id: gross-margin-yield
          label: 实现贡献利润
          detail: 首次人工审核获客成本投入后，自动重复核验可带来较高增量利润。
