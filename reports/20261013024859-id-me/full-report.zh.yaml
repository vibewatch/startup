      - number: '6.4'
        title: 留存耐久性、采购摩擦与集中风险
        blocks:
          - type: paragraph
            body: >-
              ID.me 虽深度集成于公共机构，但客户长期耐久性面临客户集中、采购政治和用户摩擦带来的急迫风险。公共部门合同占高保证交易量和战略价值的比重过高，而这些关系容易受到支持 Login.gov
              等政府自有替代方案的联邦政策变化影响。此外，自动生物识别筛查和严格身份核验流程引发了大量争议：申请人在需求高峰期经常报告账户锁定、身份验证循环，以及人工视频审查等待时间过长。这些瓶颈既见于国会调查，也反映在
              Trustpilot 低于 5 星中 3 星的消费者综合评分中，给签约机构领导层带来持续的头条风险。为提高账户粘性并在身份核验之外缓解支付欺诈，ID.me 于 2026 年 9 月与 Plaid
              合作，在州和联邦福利发放前验证收款方银行账户所有权，目标是处理每年 $5.6B 的失业保险不当支付。然而，净收入留存率和机构客户群续约率等详细留存指标仍是严格保密的私营数据。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
