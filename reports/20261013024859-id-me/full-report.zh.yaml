      - number: '1.4'
        title: 公司演进、上线与运营摩擦
        blocks:
          - type: paragraph
            body: >-
              ID.me 的运营轨迹兼具公共部门快速渗透，以及持续的监管和公民自由审查 [CO009, CO013]。2025 年 12 月，ID.me
              达成两项重要机构里程碑：与美国医疗保险和医疗补助服务中心（CMS）签署重大合同，从 2026 年初开始为 Medicare.gov 提供身份验证和登录服务；并在 FINRA Entitlement
              Platform 上为受监管金融机构启动早期接入部署 [CO009, CO010]。这些高保证集成巩固了 ID.me 作为联邦医疗和金融市场访问关键守门人的地位 [CO009,
              CO010]。但快速的机构采用也伴随实质摩擦 [CO013]。新冠疫情期间，ID.me 因强制性的 1:many
              人脸识别筛查、算法误识别和视频通话排队时间过长而受到民权组织、国会委员会和受影响公民广泛批评；这些问题一度让合法受益人无法领取州失业救济 [CO013]。此后，ID.me
              引入人工视频聊天代理和线下零售验证以缓解访问排斥，但 Trustpilot 等平台的消费者评价仍记录了自动验证循环和 AI 客服升级带来的摩擦 [CO013, CO014]。
            claimRefs:
              - CO009
              - CO010
              - CO013
              - CO014
