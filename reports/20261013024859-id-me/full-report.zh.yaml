  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险状况
        blocks:
          - type: paragraph
            body: >-
              ID.me 快速扩展到联邦和州公共服务，使公司成为不可或缺但颇具争议的数字守门人。平台已取得重要合规里程碑，包括联邦身份、凭证与访问管理（FICAM）认证、符合 NIST SP 800-63-3 身份保证等级
              2（IAL2）和认证器保证等级 2（AAL2）指南，以及 Identity Gateway 的 FedRAMP Moderate 运行授权（ATO）；但其监管和法律状况仍承受持续压力。GAO
              对国税局身份核验部署的一项重要调查揭示了关键治理缺口。具体而言，GAO 认定税务机构依赖 ID.me 作为唯一商业 IAL2 验证商，却没有设定可衡量的项目目标、正式的持续绩效评估程序，也没有在机构 AI
              用例清单中记录 ID.me 使用人工智能的情况。这些缺陷妨碍机构监督，并持续引发对纳税人权利和算法公平原则是否得到系统保护的合规疑问。\n+\n+              与此同时，ID.me
              因其在关键公共福利中的守门角色，持续受到法律和公民自由审查。民权组织和国会调查质疑：公民获取法定福利，是否必须经过一家要求人脸扫描和敏感个人可识别信息（PII）的私营营利供应商。国会领导人此前曾施压联邦机构，要求停止强制人脸识别，保留非生物识别路径，或转向
              Login.gov 等政府运营替代方案。尽管财政部和 IRS 保留 ID.me 作为选项，同时提供替代路径，但要求开放互操作性或偏好公共部门凭证方案的监管命令，仍是 ID.me 商业模式的长期系统性风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
