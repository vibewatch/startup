      - CV001
      - CV003
      - CV004
      - CV012
  - id: TV002
    title: 投资论点与反论点评估
    columns:
      - 支柱
      - 投资论点
      - 反论点
      - 触发转向 / 改变判断的因素
    rows:
      - - 网络规模
        - 152M 个注册钱包和 76M 个 IAL2 凭证构成难以撼动的民用身份网络
        - 身份核验被视为同质化基础设施；用户对 ID.me 没有品牌忠诚度
        - 可互操作的联邦凭证出现，或机构转向开放标准
      - - 公共部门锁定
        - 深度嵌入 20 个联邦机构和 45 个州政府，产生持久的经常性工作流收入
        - 政治风险高，政府合同还会重新竞标；Login.gov 有联邦授权支持
        - 丢失大型机构合同（如 VA 或 IRS），或行政部门要求只能使用公共认证
      - - 商业与 AI 扩张
        - 600+ 个消费品牌和医疗合作伙伴，使 ID.me 成为 AI 代理交互的默认身份令牌
        - 企业 IAM 竞争者（Okta、Ping、Jumio）主导企业和 B2B SaaS 核验
        - 企业 ARR 快速增长（同比 >50%），且非政府收入实现盈利性多元化
      - - 资本结构
        - $340M 融资方案提供充足流动性，用于应对深度伪造和 AI 欺诈
        - $275M 信贷额度带来沉重利息支出，并对普通股享有清算优先权
        - 将债务额度全部再融资为纯股权，或由正向经营现金流覆盖偿债
    notes: 结合核心投资支柱与运营、结构性脆弱点进行平衡评估。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 估值情景与回报预期
    columns:
      - 情景
      - 隐含估值
      - 关键假设
      - 回报 / 下行情景逻辑
      - 概率信号
    rows:
      - - 乐观情景
        - $3.5B - $4.0B
        - 企业和 AI 代理核验加速；商业业务占比达到 50%；债务顺利再融资
        - 按当前私有市场估值计算 MOIC 为 2.0x；24-36 个月内成功 IPO
        - 20%
      - - 基准情景
        - $2.0B - $2.2B
        - 公共部门业务版图保持稳定；商业业务温和扩张；现金流足以偿债
        - MOIC 为 1.0x - 1.1x；估值持平，反映市场倍数压缩和债务拖累
        - 55%
      - - 悲观情景
        - $1.0B - $1.2B
        - 联邦合同转向 Login.gov；客户反对生物识别；债务契约触发重组
        - 股权折价 50%；在优先债务结构下，普通股和次级优先股被大幅稀释
        - 25%
    notes: 情景估值假设名义 $2.0B 投后基准，并反映不同的公共部门留存率。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公司从成立、军人群体核验、联邦业务扩张、信贷方案到 CMS Medicare 集成的关键发展里程碑。
    approximationNotes: 里程碑日期反映公开新闻公告和合同生效日期。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO008
      - CO009
      - CO010
      - CO012
    data:
      items:
        - label: 成立与军人群体核验
          date: '2010'
          detail: 陆军退伍军人 Blake Hall 创立公司，旨在现代化军人服役核验，让用户无需出示纸质材料即可获得零售折扣。
          tone: positive
        - label: Series B 融资与受监管领域扩张
          date: 2017-03
          detail: 在 FTV Capital 领投下融资 $19M，开始从零售群体折扣扩展到政府和医疗核验。
          tone: neutral
        - label: Series C 独角兽估值与疫情规模化
          date: 2021-03
          detail: Viking Global Investors 领投的 Series C 融资 $100M，估值 $1.5B，并在各州失业机构部署。
          tone: positive
        - label: 人脸识别审查与政策转向
          date: 2022-02
          detail: 因 1:many 人脸识别面临国会、ACLU 和公众反对；随后增加非生物识别视频聊天和现场核验选项。
          tone: adverse
        - label: 二级要约收购
          date: 2024-11
          detail: 完成二级要约收购，将私有市场股权估值验证为 $1.8B，为机构和员工提供流动性。
          tone: neutral
        - label: Ares Management $275M 信贷额度
          date: 2025-01
          detail: 与 Ares Management 完成 $275M 信贷额度，为资产负债表灵活性、钱包扩张和基础设施提供资金。
          tone: positive
        - label: Series E 融资与 $2B+ 估值
          date: 2025-09
          detail: 宣布 $340M 融资方案，其中包括 Ribbit Capital 领投的 Series E，估值超过 $2B，目标是应对 AI 驱动的欺诈。
          tone: positive
        - label: CMS Medicare.gov 与 FINRA 高保障部署
          date: 2025-12
          detail: 与 CMS 签约提供 Medicare.gov 认证，并与 FINRA 就监管 Entitlement Platform 启动早期访问。
          tone: positive
