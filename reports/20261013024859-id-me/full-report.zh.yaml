      - number: '7.3'
        title: 合作伙伴、平台与客户依赖
        blocks:
          - type: paragraph
            body: >-
              ID.me 在客户群、合作伙伴网络和云基础设施上都存在严重的依赖与集中度风险。最关键的是，公司的财务增长动能高度集中于公共部门客户。仅在 2021 年 6 月至 2025 年 4 月期间，IRS
              就通过一项总括采购协议（BPA）与软件分销商 V3Gate 合作，为 ID.me 的许可证和支持服务承担了 $234.7M。再加上覆盖 20+ 个联邦机构和 50
              个州政府实体的合同，公共部门采购已成为其收入和用户获客的主引擎。这种集中度带来二元续约风险：一旦联邦 ICAM 政策发生宏观转向、预算被追回，或采购转向多供应商框架，企业价值就会直接承压。


              技术与合作伙伴依赖同样明显：ID.me 整个软件即服务交付模式都依赖 Amazon Web Services（AWS）Tier-III 数据中心以及获 FedRAMP
              授权的政府云环境。基础设施长时间中断或认证受阻，会立即影响全国公共门户的服务可用性。此外，为应对身份核验后发生的欺诈，ID.me 于 2026 年 9 月与 Plaid 建立战略合作。该联盟把 ID.me
              的数字钱包接入 Plaid 的金融账户验证通道，让政府机构能够确认福利款项的收款账户与已验证的收款人凭证相匹配。虽然这一集成堵住了关键的反欺诈漏洞，却也让福利发放执行依赖 Plaid
              及参与其中的金融机构所提供的外部 API。
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
