  - id: FP001
    title: 竞争定位图：公共认证 vs. 可复用网络规模
    type: quadrant
    summary: 按公共认证深度和可复用凭证网络规模，对身份核验替代方案进行竞争定位。
    data:
      points:
        - label: ID.me
          x: 8.5
          'y': 9
          detail: NIST 800-63-3 IAL2 认证级别高，消费者钱包网络庞大，覆盖超过 1.5 亿用户。
        - label: Login.gov
          x: 9
          'y': 6.5
          detail: 获 50+ 个机构的强力联邦支持，但商业网络有限，也没有原生视频核验员备用方案。
        - label: 商业 CSP（Jumio / Trulioo）
          x: 4.5
          'y': 4
          detail: 商业金融科技文档分析能力先进，但缺乏联邦福利项目凭证可移植性。
        - label: CLEAR
          x: 3
          'y': 7
          detail: 在旅行场景拥有突出的消费者品牌认知，但仅限于实体检查点安保，而非福利服务。
        - label: 传统数据经纪商 / KBV
          x: 2
          'y': 3
          detail: 基于知识的提问方式已过时，在低收入人群中的通过率低，也容易遭受合成欺诈。
        - label: 机构自建系统
          x: 6
          'y': 2
          detail: 定制化机构孤岛缺乏跨部门可移植性，持续维护和审计开销高。
    approximationNotes: 坐标基于公开监管认证和有记录的活跃用户网络覆盖，采用 1 至 10 的相对评估序数综合得出。
