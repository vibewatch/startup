      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 庞大的钱包覆盖（152M 用户）被治理 / 政策风险和不透明的收入质量部分抵消
        - 在核实收入质量和利润率披露前，暂缓直接参与股权投资
      - - 信心
        - 中
        - 融资和用户规模有充分交叉印证，但私有财务数据和债务优先级仍不透明
        - 以结构化尽调里程碑持续跟踪投资敞口
      - - 风险评级
        - 高
        - 公共部门客户集中、ACLU / 生物识别审查和 Login.gov 竞争
        - 对任何私募轮次要求更高回报门槛和保护性契约
      - - 估值立场
        - 偏高
        - 最新 $340M 融资方案将公司估值推至 >$2B，但其中 $275M 是债务，股权仅 $65M
        - 未经审计单位经济数据支持，不接受按名义估值购买二级股权
    notes: 建议综合了 2025 年 9 月 Series E 与信贷方案、用户规模指标及公共部门续约风险。
