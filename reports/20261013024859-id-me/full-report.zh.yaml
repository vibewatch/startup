      - number: '8.2'
        title: 下行风险与竞争压力
        blocks:
          - type: paragraph
            body: >-
              尽管 ID.me 已被 20 个联邦和 45 个州级机构广泛采用，但公共政策、技术和竞争层面的脆弱性仍会直接影响其终值。包括 ACLU
              在内的公民自由组织强烈批评其面部识别部署及一对多生物特征数据库匹配，引发国会调查和公众反弹。福利高峰期的运营摩擦造成合法申请人长时间等待和账户锁定，使 Trustpilot 上的公开评价均值降至 2.7
              星。更关键的是，联邦政府仍在把 Login.gov 扩展到 50+ 个机构，作为政府内部、非生物识别的认证替代方案。Login.gov
              不向公民收取供应商许可费，也不要求商业面部扫描；因此，联邦政府若从商业身份提供商转向集中采用 Login.gov，就会对 ID.me 的公共部门收入基础构成生存性威胁。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
