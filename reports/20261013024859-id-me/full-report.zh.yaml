      - number: '3.4'
        title: 壁垒耐久性、监管暴露与替代威胁
        blocks:
          - type: paragraph
            body: >-
              ID.me 已形成显著商业规模——注册用户超过 1.5 亿，覆盖 20 个联邦机构和 45 个州政府，并完成使公司估值超过 $2B 的 $340M E
              轮融资——但其竞争壁垒持续受到公共政策干预的脆弱性威胁。疫情期间，州劳工机构认为 ID.me 遏制了大规模欺诈行动；加州 EDD 称其避免了超过 $125B 的欺诈发放，亚利桑那州 DES 则称避免了超过
              $75B。可是，强制远程生物识别上线因人脸识别偏差、涉及一对多人脸匹配数据库的隐私担忧，以及让合法受益人无法领取失业救济的客服排队问题，引发民权组织、两党国会委员会和政府监督机构强烈反弹。尽管 IRS 于
              2022 年宣布计划转向 Login.gov 等政府运营替代方案，技术集成复杂性和身份保证缺口使 ID.me 直到 2025 年仍在关键 IRS 工具中保持生产运行。归根结底，持续的公共部门审查意味着 ID.me
              的长期替代风险并非来自私营商业市场竞争，而是来自偏好公共身份基础设施的立法或行政命令。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
