            body: >-
              ID.me 面向客户的产品是可复用身份钱包，而不只是一次性文件核验组件。依赖组织只需与 Identity Gateway
              集成一次，个人即可建立更高保证级别的凭证，之后同意在参与服务中复用。官方材料描述了自助、视频聊天和线下核验路径，支持页面还提供 Passkey
              MFA。这一组合覆盖两种工作流：证据和设备各异时的首次核验，以及已有凭证后的低摩擦回访。该模式仍依赖网络接受度：可复用凭证只有在依赖方接受 ID.me 时才有实际价值，公开证据也无法证明其网络外的可携带性。
