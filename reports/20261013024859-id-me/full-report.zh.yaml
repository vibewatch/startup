  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与纳入支出
        blocks:
          - type: paragraph
            body: >-
              ID.me 的可服务市场覆盖高保证数字身份核验、多因素凭证代理和数字消费者钱包。传统企业身份与访问管理（IAM）聚焦内部员工认证和目录服务，而 ID.me
              面向公民、提供高保证身份验证，申请人必须依据权威记录证明真实身份。边界包括 NIST 特别出版物 800-63-3 身份保证等级
              2（IAL2）工作流、自动远程文件验证、实时生物特征匹配和视频通话身份审查服务。一般支付收单、商业银行通道、临床电子健康记录核心架构及基础员工门禁系统不在这一软件边界内。可服务预算主要来自联邦民用机构和州劳工部门，用于反欺诈、防止不当支付和公民服务现代化。此外，ID.me
              还通过核验军人、医疗人员、急救人员、教师和学生的社群归属，为超过 700 个消费者企业品牌获取商业营销和忠诚度支出。
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM012
      - number: '2.2'
        title: TAM、SAM、SOM 与受约束的测算视角
        blocks:
          - type: paragraph
            body: >-
              评估 ID.me 的可服务市场，必须把公共部门广泛的欺诈暴露额与现实可获得的软件支出区分开。美国政府问责局（GAO）估计，2018 至 2022 年间，联邦民用项目每年遭受 $233B 至 $521B
              的欺诈损失，推动立法部门迫切需要高保证网关筛查。在州福利体系中，失业保险不当支付于 2025 财年达到 $5.6B，错误率维持在较高的 14.9%，凸显前端身份和账户验证的持续需求。独立市场研究机构估计，2025
              年北美数字身份验证与合规市场约为 $5.2B，年增长率超过 16%。不过，私营公司不透明，使 ID.me 的可服务可获得市场（SOM）难以估算；尽管 2020 至 2024 年收入增长 450%，ID.me
              并未按客户群披露经审计的年度经常性收入（ARR）或合同流失率。公司通过 2026 年与 Plaid 合作进入账户所有权验证，意在获取独立身份核验之外的支付收款方验证支出。
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
              - CM008
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
      - number: '2.3'
        title: 买方细分、采购路径与预算归属
        blocks:
          - type: paragraph
            body: >-
              ID.me 的政府客户与私营部门客户，在采购上存在根本差异。联邦民用机构由首席信息官和机构项目负责人通过 GSA 多重授予计划（MAS）合同或机构专属的框架采购协议采购身份核验，采购动因包括 FedRAMP
              授权、SOC 2 Type II 控制和 Kantara Initiative
              认证等联邦合规要求。州劳工和社会服务机构采购验证工具以遏制失业保险欺诈，经常使用联邦行政拨款和劳工部技术拨款。相反，商业零售品牌从数字营销和电商预算采购
              ID.me，以自动判断目标人群的折扣资格，避免零售员工处理文件。医疗系统是新兴客户群，首席信息安全官采购凭证服务，以符合 DEA
              受控物质电子处方（EPCS）和患者门户安全指南。这些采购路径形成多样化收入周期，既有多年期联邦合同工具，也有按用量计费的商业 API 量级费用。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM012
      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与证据缺口
        blocks:
          - type: paragraph
            body: >-
              ID.me 的采用由强大的网络效应和高摩擦替代方案推动。当 ID.me 的已核验用户基数突破 1.7 亿人时，2024 年第三季度通过其预核验数字快速通道处理的登录，占全部新订阅的
              64%。这一预核验网络把用户上线时间压缩至 60 秒以内，通过率超过 99%。此外，ID.me
              的多模态架构结合自动化自助服务、视频审查访谈和线下零售网点，弥补传统征信机构数据代理商的明显局限：后者在低收入邮编中只能核验 32% 的个人，而 ID.me 视频聊天的真实通过率为
              81%。但结构性采用约束仍在，包括民权组织对人脸识别生物识别的强烈反弹、联邦机构对供应商锁定的担忧，以及政府运营的 Login.gov
              带来的竞争。安全分析师指出，将敏感身份文件和社会安全号码集中在一个私营数据库中会提高网络风险。要评估长期合同的耐久性，还需补齐政府合同续签和私营收入利润率方面的尽调缺口。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 可复用凭证快速通道塑造商业飞轮
            body: 2024 年第三季度，ID.me 预核验用户在新机构订阅中的占比升至 64%，说明其消费者网络效应是传统企业单点登录供应商不具备的。不过，在商业品牌间变现消费者凭证复用，仍排在核心公共部门验证合同之后。
            calloutType: insight
            claimRefs:
              - CM001
              - CM008
          - type: callout
            title: 生物识别审查与供应商锁定造成公共部门犹豫
            body: 围绕人脸识别算法的民权审查，以及福利登记高峰期已记录的积压风险，给民用机构带来政治和采购摩擦。联邦运营的 Login.gov 同时存在，使 ID.me 无法在政府身份核验领域形成无争议的垄断。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM013
          - type: callout
            title: 顶层欺诈暴露额不等于可服务软件支出
            body: GAO 估计联邦项目每年欺诈暴露额为 $521B，2025 财年失业保险不当支付为 $5.6B，但供应商合同金额只占项目泄漏总额的一小部分。直接从欺诈总额外推软件市场规模，可能夸大 ID.me 短期可服务市场。
            calloutType: assumption
            claimRefs:
              - CM005
              - CM006
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 公共部门格局与直接竞争者
        blocks:
          - type: paragraph
            body: >-
              数字身份验证市场分为几种不同运营模式：政府运营的专门门户、主要面向金融科技和受监管商业部门的商业身份验证供应商、消费者生物识别加速平台，以及传统征信机构。在联邦和州公共部门，ID.me
              最直接的战略替代者是由总务管理局运营的单点登录平台 Login.gov。Login.gov 与超过 50
              个联邦、州和地方机构合作，在不收集生物人脸扫描的前提下提供重视隐私的身份核验。相比之下，Jumio、Entrust 和 Trulioo
              等商业企业身份验证供应商，为商业金融科技和加密货币应用提供强大的全球文件验证和自动风险分析，但在高保证公共福利管理中的生产部署很少。CLEAR
              等专门物理安全网络，在机场安检和体育场馆使用虹膜与人脸匹配，但不适用于联邦福利项目。同时，完全依赖征信机构和数据代理商知识验证的传统州政府验证流程，在低收入和无银行账户人群中通过率严重受损，迫使机构依赖现代凭证供应商来弥合身份覆盖缺口。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 能力差异化与验证模态
        blocks:
          - type: paragraph
            body: >-
              从技术和运营能力比较数字身份替代方案，可以看到仅自动化方案与全渠道身份验证架构之间的结构性分化。由数据代理商和征信机构驱动的传统算法验证，在最低收入邮编的申请人中通过率约为
              32%，原因是征信记录稀疏、居住记录陈旧。为突破这一系统瓶颈，ID.me 运营全渠道验证架构，把自助自动生物识别验证、与受训 Trusted Referees
              的实时视频通话，以及零售合作网点的线下验证结合起来。这种多路径设计为不同申请人群体提供经认证的 NIST 800-63-3 身份保证等级 2（IAL2）核验，弥补传统征信系统造成的数字验证缺口，估计覆盖
              75%。相反，Login.gov 强调非生物识别认证路径以满足联邦隐私要求，虽避开人脸识别，但申请人缺少权威记录时，历史上会受到吞吐量约束。Jumio 和 Trulioo
              等商业身份验证供应商擅长自动文件反欺诈检测和国际数据库匹配，但没有专门的政府审查人类审查员基础设施。CLEAR 通过虹膜和指纹生物识别提供快速实体通行验证，但不提供远程联邦 IAL2 凭证服务。
