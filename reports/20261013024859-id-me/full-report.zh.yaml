chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              ID.me 是一家商业数字身份网络和凭证服务商，由前美国陆军游骑兵 Blake Hall 于 2010 年创立，总部位于弗吉尼亚州麦克莱恩 [CO001]。平台最初名为
              TroopSwap，是一项数字归属验证服务，用于确认军人身份以获得消费者零售折扣，且无需退伍军人出示 DD214 等敏感纸质材料 [CO012]。此后十多年，ID.me
              从社群归属验证扩展到面向受监管政府、医疗和企业部门的高保证身份核验 [CO004]。平台以便携式数字身份钱包运行，让个人完成一次身份核验后即可无缝登录参与服务，无需重复核验 [CO004]。截至 2025
              年末，ID.me 称其注册数字钱包账户超过 1.52 亿，其中超过 7600 万人已按美国国家标准与技术研究院（NIST）制定的联邦身份保证等级 2（IAL2）标准完成核验 [CO004]。超过 6000
              万名预核验美国人使用 ID.me 凭证访问 16 个联邦机构和 40 个州机构的服务，为新接入的公私组织建立了可复用凭证壁垒，降低了边际采用摩擦 [CO008]。
            claimRefs:
              - CO001
              - CO004
              - CO008
              - CO012
