            title: 复用飞轮与全国规模
            body: >-
              ID.me 拥有超过 1.7 亿个数字钱包账户和 6000 万名通过 NIST IAL2 核验的持有人，已构建强大的民用身份网络。预核验用户在 22 个联邦机构和 50 个州机构的认证通过率超过
              99%，把单机构身份核验转化为全生态留存和扩张引擎。
