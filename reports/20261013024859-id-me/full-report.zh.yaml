      - number: '7.4'
        title: 财务模型风险与击穿投资论点的触发条件
        blocks:
          - type: paragraph
            body: >-
              ID.me 的高估值倍数（$2B+
              私募估值）能否成立，取决于它能否把高成本的公共部门身份获客，转化为高毛利、可复用的商业网络效应。但财务和模型风险依然显著。首先，人工辅助核验的单位经济学仍不透明。要扩大视频审核员和零售合作方柜台，以处理人口统计边界案例和合规要求，就需要大量可变人工及运营支出；如果机构定价不能完全覆盖人工升级处理成本，毛利扩张就会受到威胁。其次，更广泛的欺诈格局仍在快速演变。Government
              Accountability Office 记录显示，2025 财年不当失业保险支付达到 $5.6B（错误率 14.9%），说明复杂犯罪集团持续利用身份验证、账户绑定和州级支付发放处理商之间的衔接漏洞。


              从投资判断角度，投资者必须设定明确的论点击穿触发条件，评估基本面恶化。主要终止标准包括：（1）IRS 总括采购协议到期时正式不续约，或拆分为多供应商采购；（2）联邦行政或立法指令要求各联邦机构专门使用
              Login.gov 作为身份提供商；（3）GAO、DOJ 或 FTC 反复采取执法行动，认定存在未缓解的算法偏见，或未落实书面化的 AI
              监督控制；（4）审核员人力成本上升，或福利欺诈赔偿中的商业责任扩大，导致毛利率实质性下滑。在确认性尽调中，投资者应要求按客户群提供经审计的毛利率、每条核验路径的单位成本，以及头部公共机构合同续约管道的可见性。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR010
              - CR013
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 公共部门单一供应商集中度风险
            body: >-
              GAO 对 IRS 单一来源 IAL2 身份核验合同（已承担 $234.7M）的审计，凸显了 ID.me 主要收入渠道的监管和政治脆弱性。联邦政策转向，或 Login.gov
              等公共部门替代方案加速普及，都可能造成收入端大幅收缩。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR010
          - type: callout
            title: 公共福利项目中的发放账户与身份脱钩
            body: ID.me 虽然负责核验申请人身份，但联邦福利欺诈往往发生在账户发放目的地；Plaid 合作填补了这一缺口，却也凸显 ID.me 依赖外部金融科技通道来守住机构反欺诈成果。
            calloutType: insight
            claimRefs:
