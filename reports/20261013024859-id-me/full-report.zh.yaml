            body: 尽管机构渗透率很高，ID.me 仍容易受到公共部门采购集中和转向 Login.gov 等政府运营替代方案的政策变化影响。福利高峰期持续出现账户锁定和客服瓶颈引发的消费者挫败感，构成反复出现的声誉和合同续签风险。
