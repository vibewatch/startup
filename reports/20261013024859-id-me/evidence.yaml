    keyQuote: >-
      ID.me faced significant backlash over its facial recognition software, which the American Civil Liberties Union
      (ACLU) said was problematic due to a lack of offline identity verification options, outsourcing a core government
      function, and biased biometrics that could falsely misidentify people by race or gender. In addition, ID.me
      originally stated it used one-to-one facial comparisons (comparing uploaded documents to live selfies), when in
      fact it used one-to-many, comparing faces against a database of photographs – which is less accurate and more
      prone to ethical scrutiny.
    canonical: SO009
