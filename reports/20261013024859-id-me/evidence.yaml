evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited fiscal year financial statements disclosing GAAP revenue, ARR, gross margins, and customer cohort
      retention for 2024 through 2026.
    whyItMatters: >-
      Without audited income statements, the reported 450% revenue growth cannot be verified, obscuring operating
      leverage and burn rate.
    diligencePath: Request confidential historical financial packages or auditor review reports during private round diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-and-governance
    missingEvidence: Full executive leadership team roster, board of directors composition, and committee governance charters.
    whyItMatters: >-
      Executive retention, independent board oversight, and key-person risk cannot be fully evaluated without complete
      governance disclosures.
    diligencePath: Review state corporate registry filings and request an executive org chart and board roster from company counsel.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-investor-structure
    missingEvidence: >-
      Complete cap table breakdown showing liquidation preferences, debt covenants, and senior security interests under
      the Ares $275M credit facility.
    whyItMatters: >-
      Senior credit covenants and liquidation preference stacks directly dictate junior equity recovery in downside
      scenarios.
    diligencePath: Inspect the credit facility agreement and Series E Certificate of Incorporation.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: tam-sam-som-breakdown
    missingEvidence: >-
      Audited contract values and annual recurring revenue (ARR) breakdown across federal, state, and commercial
      customer segments.
    whyItMatters: >-
      Without segmented software revenue figures, estimating ID.me's serviceable obtainable market (SOM) requires
      extrapolating from headline transaction counts and user totals rather than contractual ARR.
    diligencePath: >-
      Request management's segment revenue reporting, renewal rates, and average contract values (ACVs) across
      government versus commercial cohorts in the diligence data room.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: total-addressable-market-sizing
    missingEvidence: >-
      Standardized third-party analyst market models specifically separating reusable consumer identity wallets from
      legacy workforce IAM and one-off KYC transaction tools.
    whyItMatters: >-
      Broad cybersecurity and identity market estimates range from $15B to over $40B globally, obscuring the specific
      serviceable addressable market (SAM) for federal NIST IAL2-compliant credential broker services.
    diligencePath: >-
      Cross-reference Gartner and Forrester digital identity verification market sizing reports with GSA schedule task
      orders.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-and-procurement
    missingEvidence: >-
      Public schedule of per-verification and annual platform fees paid by federal and state agencies to ID.me versus
      Login.gov interagency agreement costs.
    whyItMatters: >-
      Without standardized unit pricing data, total cost of ownership comparisons between commercial identity providers
      and government-run alternatives cannot be audited.
    diligencePath: Review public FOIA disclosures, GSA schedule contract vehicles, and state procurement award documentation.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: competitor-scale
    missingEvidence: >-
      Audited multi-homing rates showing the percentage of government users who maintain active credentials on both
      ID.me and Login.gov.
    whyItMatters: >-
      Determines whether agencies can easily sunset ID.me or if citizen credential lock-in prevents switching to
      alternative identity providers.
    diligencePath: Request agency user-overlap logs and multi-credential telemetry from federal customer experience offices.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements providing GAAP revenue, cost of goods sold, and operating income for fiscal years
      2024 through 2026.
    whyItMatters: >-
      Without audited financial statements, investors cannot verify the durability of reported revenue growth or
      calculate GAAP gross margins.
    diligencePath: >-
      Obtain audited financial disclosures, revenue recognition schedules, and customer concentration reports under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Granular unit-level cost breakdown distinguishing automated document selfie processing from live human video
      referee and in-person verification sessions.
    whyItMatters: >-
      Direct labor costs for video referee sessions represent the primary drag on gross margin; scaling without
      labor-sparing automation threatens long-term profitability.
    diligencePath: >-
      Request operational logs detailing transaction volume by verification channel and marginal cost per completed
      identity proofing session.
    relatedQuestionRefs:
      - QI004
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public API or SDK activity, package downloads, release cadence, contributor activity, integration forum volume, or
      another practitioner-community proxy.
    whyItMatters: >-
      The assigned pool establishes enterprise integrations but not developer adoption, integration velocity, or the
      health of a public technical ecosystem.
    diligencePath: >-
      Request API documentation, SDK repositories, release notes, integration telemetry, and three recent implementer
      references from ID.me.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: independent-performance
    missingEvidence: >-
      Current independent measurements of accuracy, false rejects, completion, latency, uptime, queue times, and
      demographic performance.
    whyItMatters: >-
      Most available performance measures are company-reported, preventing independent assessment of reliability and
      inclusion trade-offs.
    diligencePath: >-
      Obtain cohort-level production reports, independent biometric evaluations, status history, SLA performance, and
      reference-customer telemetry.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current SOC report, FedRAMP authorization scope, penetration-test summary, incident history, recovery objectives,
      and data-retention schedule.
    whyItMatters: >-
      Named frameworks do not show whether controls remain in scope and operate effectively for the product and data
      flows under diligence.
    diligencePath: >-
      Review the current audit package, authorization boundary, subprocessor list, incident register,
      business-continuity tests, and deletion-control evidence in a data room.
