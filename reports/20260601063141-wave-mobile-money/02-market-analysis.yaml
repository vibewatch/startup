tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance to Wave
  rows:
  - - Domestic P2P wallet transfers
    - Low-ticket domestic transfers, stored value, cash-in/cash-out linked to a wallet
    - Cross-border remittances and bank-to-bank transfer rails
    - Individual consumer is buyer, user, and payer
    - Core everyday use case where 1% send fee and free cash services directly change behaviour
  - - Bill pay and airtime
    - Utility bill payment, airtime top-up, everyday household account servicing
    - Broader banking, lending, insurance, and wealth products
    - Household payer; consumer user
    - High-frequency, trust-building use case that turns a wallet into a daily product
  - - Merchant acceptance / QR payments
    - Low-ticket in-person acceptance, QR-led merchant checkout, simple collections
    - Enterprise card acquiring and premium omnichannel checkout stacks
    - Merchant buys service; customer is payment user; merchant budget absorbs fees
    - Most credible next monetisation frontier as WAEMU merchant points scale
  - - Business disbursements and collections
    - Payroll, supplier payouts, outlet cash collection, business app workflows
    - Full ERP treasury systems and formal cash-management products
    - Employer or merchant is buyer and payer; employee or customer is receiving user
    - Expands Wave beyond retail consumers into SMB operating budgets
  - - Agent-mediated wallet access
    - Cash loading, cash withdrawal, assisted transactions, QR-card support
    - Branch banking and ATMs for formally banked users
    - Consumer or merchant funds transaction; agent supplies liquidity service
    - Essential distribution layer in cash-heavy markets
  - - Excluded adjacencies
    - N/A
    - Cross-border remittance, savings, insurance, formal banking, cards, unsecured credit
    - Varies by product and regulated entity
    - Strategically adjacent but not a clean public lens for current Wave market sizing
  notes: Boundary set from Wave consumer and business pages, YC origin story, and TechCrunch reporting;
    chapter focuses on domestic mobile money rather than the full fintech adjacency map.
