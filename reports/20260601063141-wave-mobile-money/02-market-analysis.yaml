  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: wave-specific-som
    missingEvidence: Wave transaction value, revenue, and active-user density by country and by use case
      inside WAEMU
    whyItMatters: Without country and use-case splits, public evidence can only triangulate Wave with
      ecosystem and competitor proxies instead of a defensible SAM/SOM.
    diligencePath: Request market-level transaction value, active transactors, merchant GMV, and take-rate
      disclosures from management or lender diligence materials.
    relatedQuestionRefs:
    - QM024
    - QM026
    relatedTableRefs:
    - TM002
    - TM005
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: Comparable country-by-country market-share data for Wave versus Orange Money and
      other wallet incumbents in Senegal, Côte d'Ivoire, Mali, and other WAEMU markets
    whyItMatters: Competitive position is visible only through scattered operator disclosures and anecdotes;
      a true share view would materially sharpen valuation and moat assessment.
    diligencePath: Collect local central-bank, operator, and regulator datasets by country or request
      management market-share decks used with lenders and partners.
    relatedQuestionRefs:
    - QM015
    - QM024
    - QM026
    relatedTableRefs:
    - TM005
  - type: conflicting-data
    severity: minor
    topic: sizing-lenses
    missingEvidence: A single public dataset that aligns market-wide transaction value, operator TPV,
      MAUs, and active-account definitions across Africa and WAEMU
    whyItMatters: Public comparables are directionally useful but not apples-to-apples, which is why this
      chapter preserves multiple market lenses instead of one “precise” number.
    diligencePath: Normalize KPI definitions in a diligence model using underlying operator annual reports
      and regulator methodology notes before converting them into share or revenue estimates.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
