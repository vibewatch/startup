- id: TM003
  title: Segment or Buyer Map
  columns:
  - Segment
  - Buyer / User / Payer
  - Workflow
  - Budget Owner
  - Adoption Trigger
  rows:
  - - Consumer sender
    - Buyer=user=payer; household or individual
    - Cash in or maintain balance -> send domestic transfer -> recipient cashes out or keeps wallet value
    - Personal or household cash budget
    - Visible low fee, nearby agent, trust, and speed versus carrying cash
  - - Household bill payer
    - Buyer=user=payer; household finance manager
    - Open app -> pay utility or airtime -> avoid travel/queue and cash handling
    - Household recurring-expense budget
    - Convenience and removal of friction for small but frequent payments
  - - Micro merchant
    - Merchant buys acceptance service; customer is end payment user
    - Display QR or accept wallet payment -> receive low-ticket sales digitally -> reconcile in app
    - Merchant working-capital budget
    - Lower fee burden than incumbent wallets and less margin leakage on small tickets
  - - SME employer / payroll operator
    - Business is buyer and payer; employee is receiving user
    - Bulk disbursement through business app -> employee receives wallet value or cashes out via agent
    - Payroll / operating-expense budget
    - Cheaper and simpler domestic payout rails than bank-centric alternatives
  - - Distributor / outlet collector
    - Business buyer; outlet staff operational users
    - Collect cash from outlets -> centralise balance -> reallocate or pay suppliers
    - Treasury / cash-management budget
    - Faster cash visibility and lower handling risk than physical movement of notes
  - - Agent / assisted user pair
    - Agent provides liquidity service; consumer or merchant funds transaction
    - User cashes in or out through local agent, including QR-card assisted flows when smartphone access
      is limited
    - Customer or merchant transaction budget plus agent float
    - Distribution density and float availability in cash-heavy neighborhoods
  notes: Table separates consumer, merchant, employer, and agent economics because “wallet user” is too
    broad a category for market analysis.
  claimRefs:
  - CM019
  - CM020
  - CM030
  - CM032
  - CM036
  - CM037
- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication for Wave
  - Diligence Ask
  rows:
  - - Large covered-but-unconnected mobile base
    - Driver
    - Multi-year
    - 416M Africans already use mobile internet but 960M still do not despite coverage, leaving room for
      wallet adoption if affordability improves
    - Which Wave markets have the steepest smartphone affordability and literacy bottlenecks?
  - - Agent density and distribution depth
    - Driver
    - Ongoing
    - High agent accessibility remains a precondition for trust, float availability, and cash substitution
    - What is Wave's agent density and transaction throughput by country versus Orange/Airtel?
  - - WAEMU merchant-point growth
    - Driver
    - Now
    - 3.7M merchant points and QR-led growth make merchant acceptance the most visible next monetisation
      wedge
    - How much of Wave's current volume is consumer-to-merchant versus P2P?
  - - Common WAEMU payment rails
    - Driver
    - Structural
    - SICA-UEMOA and STAR-UEMOA reduce fragmentation risk and support interoperable settlement under a
      common regulator
    - What practical interoperability still requires bilateral operator work despite common rails?
  - - Activation gap
    - Constraint
    - Now
    - 248M opened accounts versus 76.9M active accounts shows that signup growth alone does not equal
      monetisable usage
    - What are Wave's true MAU, transacting, and retained-user curves by market?
  - - Cash-in/cash-out dominance
    - Constraint
    - Now
    - 56.76% of WAEMU transaction value is still deposits/withdrawals, limiting wallet monetisation if
      value never stays digital
    - How much of Wave's volume stays digital after receipt rather than cashing out?
  - - Licensing throughput and country-by-country approvals
    - Constraint
    - 2025-2026
    - Regional integration does not remove local approval friction for PSPs and EMIs, which can slow rollout
      into new countries or products
    - What licenses does Wave hold market by market, and what approvals remain pending?
  - - Fraud, taxes, and device affordability
    - Constraint
    - Persistent
    - GSMA explicitly flags these as reasons users revert to cash, which can compress activation, merchant
      usage, and trust
    - Which Wave markets face the highest re-cash risk from policy or fraud events?
  - - Telco-backed competitor scale
    - Constraint
    - Structural
    - Orange, MTN, Airtel, and Vodacom operate with larger disclosed user bases and balance sheets than
      Wave
    - 'Where does Wave win despite weaker balance-sheet scale: pricing, UX, or regulatory positioning?'
  notes: Drivers and constraints are tied to adoption timing, active usage conversion, and valuation relevance
    rather than generic “market growth” language.
