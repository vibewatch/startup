- id: TM005
  title: Substitute and Competitor Benchmark Table
  columns:
  - Player / Substitute
  - Core Geography
  - Pricing / Economics Signal
  - Disclosed Scale
  - Implication for Wave
  rows:
  - - Cash
    - Every Wave market; especially informal retail and household transfers
    - No explicit fee but high time, trust, loss, and distance costs
    - Default substitute, not a disclosed network metric
    - Wave must keep digital cheaper and more reliable than cash to expand the market
  - - Orange Money
    - Francophone and broader Africa & Middle East footprint
    - Orange Money grew 15.7% in Q1 2026 inside AME
    - Orange AME revenues +12.7% in Q1 2026
    - Closest large telco benchmark in Francophone markets; pricing pressure likely remains active
  - - MTN MoMo
    - Pan-African telco wallet benchmark
    - Scale supports heavy reinvestment and ecosystem breadth
    - 69.5M MAUs and $500.3B txn value in 2025
    - Shows what telco-backed wallet scale looks like when moving beyond one sub-region
  - - Airtel Money
    - 14 African markets
    - Broad wallet stack plus large active-agent base
    - 54.1M customers, 2.4M active agents, $196B TPV
    - Strong benchmark for distribution economics and merchant/service breadth
  - - M-Pesa / Vodacom / Safaricom
    - East and Southern Africa benchmark, not core Wave geography
    - Financial-services revenue already material at group level
    - 103.0M FS customers and $525.6B txn value in FY2026
    - Best benchmark for mature wallet monetisation, even if geography differs
  - - Wave
    - Eight markets, primarily West Africa
    - Free deposit/withdrawal; 1% send fee; merchant-side discounting
    - 20M+ MAUs and 150k+ agents by mid-2025
    - Price disruptor with real scale, but still less public disclosure and smaller balance-sheet support
      than the largest telcos
  notes: Benchmarks are not apples-to-apples; they are meant to show substitute pressure, pricing posture,
    and scale asymmetry rather than declare a clean market-share stack.
