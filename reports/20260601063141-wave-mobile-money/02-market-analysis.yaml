slug: wave-mobile-money
runDate: '2026-06-01'
company:
  name: Wave Mobile Money
chapter:
  number: 2
  title: Market Analysis
  summary: Wave operates in a market that is already massive at the ecosystem level but still immature
    in WAEMU activation and merchant monetisation. GSMA says mobile money processed more than $2 trillion
    globally in 2025, while BCEAO says WAEMU alone reached 248 million opened e-money accounts, 76.9 million
    active accounts, and FCFA 160,415 billion of value in 2024. Wave's 1% send-fee model and 20 million-plus
    monthly active users position it as a price-disruptive challenger, but it still faces activation gaps,
    licensing friction, tax/fraud risk, and much larger telco-backed competitors such as Orange Money,
    MTN MoMo, Airtel Money, and M-Pesa.
sections:
- id: market-boundary
  title: Market Boundary, Included Flows, and Substitutes
  body: "Wave's relevant market is not generic “fintech” or even the full universe of African digital\
    \ finance. The practical core market is low-fee domestic mobile money in Francophone West Africa:\
    \ wallet-based person-to-person transfers, cash-in and cash-out, bill pay, airtime, merchant acceptance,\
    \ and simple business disbursement or collection flows that can ride on an agent network. Wave's own\
    \ consumer site anchors the offer around free deposit and withdrawal, free bill payment, airtime purchase,\
    \ and a 1% send fee, while the business site extends that same network to payroll, outlet collections,\
    \ in-person acceptance, and online payments. The founder narrative on Y Combinator also points to\
    \ domestic money movement, not just remittances, as the central problem Wave set out to solve.\n\n\
    That boundary matters because several adjacent pools of spend should remain outside the chapter's\
    \ serviceable-market logic. Cross-border remittances, full retail banking, cards, lending, insurance,\
    \ and savings products are all strategically relevant adjacencies, but they are not the cleanest public\
    \ lens for Wave's current mobile-money moat. Likewise, premium card-led checkout, formal merchant\
    \ acquiring for enterprise retailers, and bank-to-bank transfer rails sit beside the market without\
    \ defining its core purchasing workflow. The most important status-quo substitute is still cash: users\
    \ cash in, cash out, and compare digital options against the friction, fees, and trust profile of\
    \ physical cash circulation.\n\nThe substitute set is therefore layered. Cash is the default store\
    \ and transfer rail for informal households and merchants. Telco-led wallets such as Orange Money\
    \ and Airtel Money are the closest product substitutes because they already serve domestic transfer,\
    \ bills, merchant payments, and agent-mediated cash handling. Banks and card rails matter mainly for\
    \ formally banked salaried customers or larger merchants. This is why Wave's pricing posture is so\
    \ consequential: by making digital cheaper than cash for simple domestic flows, it tries to expand\
    \ the market rather than merely win share inside a fixed incumbent wallet base.\n            "
  claimRefs:
  - CM030
  - CM031
  - CM032
  - CM037
  - CM038
  tableRefs:
  - TM001
- id: sizing-and-competition
  title: Market Size Lenses and Competitive Benchmarks
  body: "At the broadest level, mobile money is already a very large global and African market. GSMA says\
    \ more than $2 trillion flowed through mobile money wallets in 2025 after roughly $1.68 trillion in\
    \ 2024, and that Sub-Saharan Africa alone still accounts for more than 1.1 billion registered accounts.\
    \ But those global numbers are too broad for underwriting Wave. The more decision-useful public market\
    \ lens is BCEAO's WAEMU dataset: 248 million opened e-money accounts, 76.9 million active accounts,\
    \ and FCFA 160,415 billion of transaction value in 2024. That is large enough to prove material demand,\
    \ but it also shows a market where account opening still runs far ahead of sustained active usage.\n\
    \nOperator disclosures help bound the opportunity but do not create a clean SAM/SOM. MTN reported\
    \ 69.5 million MoMo monthly active customers and $500.3 billion of fintech transaction value in 2025.\
    \ Airtel Money disclosed 54.1 million customers, 2.4 million active agents, and $196 billion of TPV\
    \ in 2025/26. Vodacom reported 103.0 million financial-services customers including Safaricom and\
    \ $525.6 billion of transaction value in FY2026. Orange did not disclose a customer count in the fetched\
    \ results page, but it did show Orange Money growing 15.7% inside an Africa & Middle East segment\
    \ that grew 12.7% in Q1 2026. These benchmarks matter because they show that continental incumbents\
    \ already operate with far larger disclosed balance sheets, customer sets, and reporting systems than\
    \ Wave does.\n\nWave nevertheless has enough disclosed scale to matter. Finnfund and Norfund both\
    \ say that by mid-2025 Wave had more than 20 million monthly active users, over 150,000 agents, more\
    \ than 3,000 employees, and operations in eight markets. That makes Wave meaningful inside Francophone\
    \ West Africa, but public evidence still does not provide a true Wave-specific SAM or SOM by country.\
    \ The market-size exercise must therefore preserve multiple lenses: ecosystem transaction value, active-account\
    \ intensity, merchant-point growth, and operator-scale proxies. For diligence, that is more honest\
    \ than pretending that one clean TAM number already exists in public disclosures.\n            "
