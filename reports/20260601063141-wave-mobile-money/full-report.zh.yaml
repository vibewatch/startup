  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Wave 的客户旅程从费率主导的价值主张开始，经代理点辅助开户，再扩展到重复支付、缴费和商户工作流。
    data:
      items:
        - label: 发现
          description: 用户通过本地品牌露出、转介绍和应用商店发现，听到核心承诺：免费存取、免费缴费和 1% 转账。
        - label: 现金开户
          description: 客户或商户通过代理点、QR 卡或应用下载激活；需要帮助时，也有本地客服电话可用。
        - label: 首笔交易
          description: 钱包里的典型首笔动作是转账、支付 Woyofal 等账单，或购买话费。
        - label: 重复使用
          description: 家庭转账、经常性账单和安全现金存储带来习惯；评分和具名评价则充当满意度的公开代理。
        - label: 商户和薪资采用
          description: 企业使用 QR 收款、付款工具、代收和远程支付链接，把 Wave 从纯消费者 P2P 活动推向更宽场景。
        - label: 信任 / 服务循环
          description: 客服、收据、安全预期和开户可靠性，决定低费率承诺能否沉淀为持久使用。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU009
      - CU032
      - CU042
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 用最佳可得的 2025/2026 年公开客户指标，构建从广泛零售触达到更窄企业和商户部署的代理漏斗。
    data:
      items:
        - label: 消费者应用下载量（累计）
          value: 56000000
          detail: AppBrain 截至 2026-05-31 的估算
        - label: 月活用户
          value: 20000000
          detail: 经最佳交叉验证的 2025 年贷款方 / 媒体数据
        - label: 活跃支付用户
          value: 10000000
          detail: Pan African Visions 2026 年资料数据
        - label: 月度企业付款收款人
          value: 500000
          detail: Wave Business 官方披露
        - label: 活跃线下商户
          value: 100000
          detail: Wave Business 官方披露
    approximationNotes: 这是跨界面的代理漏斗，不是字面意义上的同一批用户。各阶段混合了来自不同来源和日期的消费者触达、交易活动和企业产品采用指标，用来展示逐层收窄的采用结构。
    claimRefs:
      - CU006
      - CU008
      - CU012
      - CU014
      - CU015
      - CU020
      - CU033
      - CU034
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开客户证据在用例具体且持续时最强；如果要判断留存或企业耐久性，则最缺私人数据。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 生产成熟度
        - 留存可见度
      rows:
        - label: Aita / Woyofal 缴费
          values:
            - 中
            - 高（具名账单方和便利性引语）
            - 已投产
            - 低
        - label: Firmin / 家庭转账
          values:
            - 中
            - 中（重复使用引语）
            - 已投产
            - 低
        - label: Kevin Simpore / 安全投诉
          values:
            - 中
            - 高（具体产品担忧）
            - 已投产
            - 低
        - label: Jk37272$ / 塞内加尔 + 科特迪瓦汇款
          values:
            - 低
            - 中（具体国家和话费用途）
            - 生产环境
            - 低
        - label: Joel Kamara / 冈比亚商户注册
          values:
            - 中
            - 高（点名国家和入驻失败）
            - 入驻流程受阻
            - 低
    claimRefs:
      - CU003
      - CU004
      - CU023
      - CU026
      - CU028
      - CU039
      - CU042
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 监管和基础设施风险集中在高可能性 / 高影响象限；隐私、投诉和安全流程风险也很重要，但相对更可控。
    claimRefs:
      - CR014
      - CR016
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR029
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 极高影响
          values:
            - label: —
              tone: neutral
              detail: 从现有证据看，本组没有低可能性且影响极高的风险。
            - label: PI-SPI 截止期
              tone: risk
              detail: 若未准备好接入 BCEAO 互操作，将削弱转账、商户受理和客户便利性。
            - label: 喀麦隆结构
              tone: risk
              detail: 只能靠合作伙伴进入、无法直接发行电子货币，可能限制战略控制力和经济性。
        - label: 高影响
          values:
            - label: —
              tone: neutral
              detail: 公开来源没有直接证明低可能性 / 高影响事件。
            - label: 隐私 / KYC 泄露
              tone: risk
              detail: 身份数据处理量大，一旦控制失灵，下行风险很高。
            - label: 牌照碎片化
              tone: risk
              detail: 逐国拿牌照会拖慢上线，也会压紧合规吞吐。
        - label: 中等影响
          values:
            - label: 安全政策范围
              tone: neutral
              detail: 负责任披露是正面信号，但供应商和 DoS 仍在范围之外。
            - label: 投诉积压
              tone: risk
              detail: 公开 SLA 已有，但积压量和升级指标未披露。
            - label: 代理点 / 内部人欺诈
              tone: risk
              detail: GSMA 欺诈类型显示，代理点主导的移动钱包体系仍持续暴露。
        - label: 残余监测项
          values:
            - label: 状态页缓释
              tone: positive
              detail: 截至审阅日，Wave 过去 90 天显示 100% 正常运行时间。
            - label: 已发布控制
              tone: positive
              detail: 隐私、投诉和披露政策减少了一部分未知数。
            - label: 监管转向压力
              tone: risk
              detail: 排除风险和费率竞争会加大调整牌照或商业模式的压力。
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管失手不会停留在局部；风险会传导到客户摩擦、交易量、利润率、营运资金需求，最后压到估值。
    claimRefs:
      - CR014
      - CR021
      - CR030
      - CR031
      - CR040
      - CR041
      - CR043
      - CR044
    data:
      nodes:
        - id: reg
          label: 监管 / 通道失手
          detail: PI-SPI 接入错过节点、牌照推进变慢，或合作伙伴范围受限。
          tone: risk
        - id: cust
          label: 客户摩擦
          detail: 转账、代理点服务或投诉处理不再顺畅。
          tone: risk
        - id: vol
          label: 交易量 / 商户拖累
          detail: 交易频次下降，商户受理变弱。
          tone: risk
        - id: margin
          label: 利润率压力
          detail: Wave 要么吸收价格压力，要么失去差异化。
          tone: risk
        - id: wc
          label: 营运资金需求
          detail: 增长和服务质量需要更多外部资金支撑。
          tone: risk
        - id: val
          label: 估值 / 建议受冲击
          detail: 承销判断从规模叙事转向风险折价。
          tone: risk
      edges:
        - from: reg
          label: 接入变慢 / 合规负担上升
          to: cust
        - from: cust
          label: 信任和便利性下降
          to: vol
        - from: vol
          label: 固定成本摊到更少交易量
          to: margin
        - from: margin
          label: 现金生成能力变弱
          to: wc
        - from: wc
          label: 再融资和稀释风险上升
          to: val
        - from: margin
          label: 竞争位置变弱
          to: val
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Wave 的风险状况由受监管基础设施和交易对手塑造：央行支付通道、喀麦隆本地银行赞助方、代理点，以及营运资金贷款人。
    claimRefs:
      - CR012
      - CR019
      - CR020
      - CR021
      - CR040
      - CR041
      - CR042
      - CR045
      - CR046
      - CR047
    data:
      nodes:
        - id: wave
          label: Wave 平台
          detail: 移动钱包产品、App、代理点和面向商户的服务。
          tone: neutral
        - id: bceao
          label: BCEAO / PI-SPI
          detail: WAEMU 互操作、支付系统治理和通道接入。
          tone: risk
        - id: cbc
          label: CBC Cameroon
          detail: 为 Wave 品牌支付服务提供喀麦隆本地持牌银行壳。
          tone: risk
        - id: beac
          label: BEAC / GIMAC
          detail: CEMAC 报告、客户资金保全和互联环境。
          tone: risk
        - id: agents
          label: 代理点网络
          detail: 存取现金分销、流动性和本地客户服务。
          tone: risk
        - id: lenders
          label: RMB + DFI 贷款人
          detail: 营运资金和扩张融资。
          tone: risk
        - id: bankpivot
          label: Wave Bank Africa
          detail: 未来可能拿到的银行牌照，意在扩大基础设施接入和产品范围。
          tone: neutral
      edges:
        - from: bceao
          label: 互操作 / 支付通道接入
          to: wave
        - from: cbc
          label: 喀麦隆持牌服务壳
          to: wave
        - from: beac
          label: 报告 / 互联约束
          to: cbc
        - from: agents
          label: 分销和流动性
          to: wave
        - from: lenders
          label: 债务融资 / 营运资金
          to: wave
        - from: bankpivot
          label: 可能的直接基础设施和信贷接入
          to: wave
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 规模和赛道增长说明机会还活着，但价格发现已经过时，叠加监管和竞争风险，结论只能维持观察。
    data:
      nodes:
        - id: scale
          label: 规模验证：20M+ MAUs、150k+ 代理点、8 个市场
          type: input
        - id: pricing
          label: 产品验证：免费存取现金，转账费 1%
          type: input
        - id: sector
          label: 赛道顺风：2025 年移动钱包交易额 >$2T
          type: input
        - id: freshness
          label: 估值缺口：最后公开股权定价仍停在 2021 年
          type: input
        - id: risk
          label: 反向压力：监管、支付通道接入、电信价格战
          type: input
        - id: decision
          label: 决策：观察 / 高风险 / 估值偏高
          type: output
        - id: upgrade
          label: 只有拿到当前收入、债务和股权结构证据，才上调判断
          type: output
      edges:
        - from: scale
          to: decision
        - from: pricing
          to: decision
        - from: sector
          to: decision
        - from: freshness
          to: decision
        - from: risk
          to: decision
        - from: decision
          to: upgrade
    approximationNotes: 这张图表达投资建议逻辑，不是机械评分卡。
    claimRefs:
      - CV005
      - CV008
      - CV013
      - CV021
      - CV023
      - CV047
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在 $400 million 基准情景收入假设下，示意不同销售额倍数带来的估值敏感性。
    data:
      items:
        - label: 1.2x 销售额
          value: 480
          note: 公开市场下行 / 严苛悲观情景
        - label: 1.6x 销售额
          value: 640
          note: 上市支付公司区间低端
        - label: 2.0x 销售额
          value: 800
          note: 基准情景底部
        - label: 2.4x 销售额
          value: 960
          note: 接近 Remitly 的区间
        - label: 2.8x 销售额
          value: 1120
          note: 已观察上市区间上端
        - label: 3.8x 销售额
          value: 1520
          note: 乐观情景 / 需要私募溢价守住独角兽区间
    approximationNotes: 柱状图把收入固定在基准情景中点，显示争议有多少来自倍数、多少来自分母风险。
    claimRefs:
      - CV037
      - CV040
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准和乐观估值区间，来自明确的收入和倍数假设。
    data:
      items:
        - label: 悲观情景
          low: 300
          mid: 390
          high: 480
          note: $250M-$300M 收入，销售额倍数 1.2x-1.6x
        - label: 基准情景
          low: 700
          mid: 980
          high: 1260
          note: $350M-$450M 收入，销售额倍数 2.0x-2.8x
        - label: 乐观情景
          low: 1500
          mid: 1985
          high: 2470
          note: $500M-$650M 收入，销售额倍数 3.0x-3.8x
    approximationNotes: 由于 Wave 仍未公开披露当前收入、毛利率或偿债负担，区间高度依赖假设。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按 IC 口径，对 Wave 的市场、验证、经济性可见度和估值纪律做方向性打分。
    data:
      items:
        - label: 品类需求
          value: 4
          note: 移动钱包和非洲 fintech 需求在结构上仍具吸引力
        - label: 规模验证
          value: 4.5
          note: 20M+ MAUs 和大型分销网络证明已有实质采用
        - label: 定价优势
          value: 4
          note: 免费存取现金叠加 1% 转账费，依然突出
        - label: 变现可见度
          value: 2
          note: 当前收入和利润率仍未公开
        - label: 监管韧性
          value: 2
          note: 支付通道接入和新市场牌照仍是活跃风险
        - label: 估值支撑
          value: 2
          note: 没有新的股权定价，上市可比公司的区间也远低于 2021 年的亢奋估值
        - label: 退出准备度
          value: 2.5
          note: 战略出售或结构化结果比近期 IPO 更现实
    approximationNotes: 分数是方向性的，用来概括验证、透明度和价格纪律的组合；它不是机械投资模型。
    claimRefs:
      - CV021
      - CV023
      - CV037
      - CV038
      - CV045
      - CV047
      - CV048
