      - number: '7.2'
        title: 运营、欺诈和消费者保护风险藏在低费率承诺之后
        blocks:
          - type: paragraph
            body: >-
              Wave 的公开承诺很直接：免费存取款、1% 转账费、免费客服电话和强安全。审核当天，状态页甚至显示过去 90 天可用性为 100%。这些确实是缓释项，但依赖代理点、商户受理、实时支付 API、KYC
              检查和客户追索的移动钱包网络，结构性风险不会因此消失。公司自己的隐私声明确认，它会收集身份证件、位置数据和执法来源信息，以履行法律义务并打击欺诈。投诉政策承诺紧凑的支付投诉
              SLA，但公开投诉量和欺诈损失披露缺失。GSMA 关于更广泛移动钱包行业的证据，是有用的反向基准：冒名、内部人欺诈、代理点欺诈、社交工程、cash-in/cash-out 滥用和 KYC
              违规仍是常见攻击路径。因此，Wave 看起来运营成熟到足以发布治理流程，但公开证据还不足以让投资人只靠公开资料评估欺诈损失或服务质量。
