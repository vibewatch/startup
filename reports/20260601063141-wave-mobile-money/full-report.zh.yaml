      - number: '3.4'
        title: 护城河耐久性、切换成本与反向证据
        blocks:
          - type: paragraph
            body: >-
              反向证据并没有说 Wave 模式已经失效；它说明护城河比醒目的费率承诺更窄。WeeTracker 报道称，在最初 PI-SPI 授权名单排除 Wave 和 MTN 后，Wave
              寻求银行牌照；同一篇文章还称，Wave 计划进入 Côte d’Ivoire 前，MTN 在当地取消了提现费，Orange Cameroon 也下调了转账费。OSIRIS 独立描述了 Côte d’Ivoire
              的同一主题：MTN 2025 年的费率动作加剧价格战，并提高了运营商在别处寻找利润率的压力。DabaFinance 对 PI-SPI
              的解读在系统层面推向同一方向——一旦跨平台转账成为受监管基线，而不是差异化，封闭生态就更难防守。


              切换成本仍重要，但它们不像企业软件那样主要是技术性的。它们是分销和行为层面的：代理触达、商户收单、工资到账、消费者信任，以及在同一产品栈里获得借贷或储蓄的便利。电信公司也把移动支付当作战略资产类别，而不是副业；MTN
              Uganda 股东甚至在 2025 年批准了 MTN MoMo 的结构性拆分。换句话说，Wave
              竞争的不是静态既有玩家。它竞争的是能复制费率战术的既有玩家、能把转账轨道商品化的监管者，以及想拥有更广金融关系的新进入者。这样一来，商户深度、储值相关性和相邻产品，就是唯一看起来可能持久的护城河层。
