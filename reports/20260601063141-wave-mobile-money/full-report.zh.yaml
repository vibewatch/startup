      - 与 Wave 的关系
    rows:
      - - 国内 P2P 钱包转账
        - 低客单价国内转账、储值、与钱包绑定的 cash-in/cash-out
        - 跨境汇款和银行到银行转账轨道
        - 个人消费者同时是买方、用户和付款方
        - 核心日常场景，1% 转账费和免费现金服务会直接改变行为
      - - 账单支付和话费充值
        - 公用事业账单支付、话费充值、日常家庭账户服务
        - 更广泛的银行、借贷、保险和财富产品
        - 家庭付款方；消费者用户
        - 高频、建立信任的场景，把钱包变成日常产品
      - - 商户受理 / QR 支付
        - 低客单价线下受理、QR 引导的商户收银、简单收款
        - 企业收单和高端全渠道收银栈
        - 商户购买服务；客户是支付用户；商户预算吸收费用
        - WAEMU 商户点位扩张时，最可信的下一条变现前沿
      - - 企业付款和收款
        - 薪资、供应商付款、门店现金归集、企业应用工作流
        - 完整 ERP 资金系统和正式现金管理产品
        - 雇主或商户是买方和付款方；员工或客户是收款用户
        - 把 Wave 从零售消费者扩展到 SMB 运营预算
      - - 代理点介导的钱包接入
        - 现金充值、现金取款、辅助交易、QR 卡支持
        - 面向正式银行用户的网点银行和 ATM
        - 消费者或商户为交易出资；代理点提供流动性服务
        - 现金占比高市场的必要分销层
      - - 排除的相邻业务
        - N/A
        - 跨境汇款、储蓄、保险、正式银行、银行卡、无担保信贷
        - 因产品和受监管实体而异
        - 战略上相邻，但并不是给当前 Wave 做市场规模测算的干净公开口径
    notes: 边界来自 Wave 消费者和企业页面、YC 起源故事和 TechCrunch 报道；本章聚焦国内移动钱包，而非完整金融科技相邻地图。
