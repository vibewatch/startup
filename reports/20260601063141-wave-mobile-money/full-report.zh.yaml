        - 2026 年 5 月市值 $39.47B；过去十二个月收入 $33.73B
        - ~1.17x 销售额；~1.24x EV / 销售额
        - 成熟规模经济性的全球数字支付基准
        - 比 Wave 广得多、更多元，也更盈利
      - - Remitly
        - 2026 年 5 月市值 $4.22B；过去十二个月收入 $1.73B
        - ~2.44x 销售额；~2.09x EV / 销售额
        - 有用的上市汇款 / 跨境可比公司，增长更强
        - 跨境汇款不同于本地移动钱包经济性
      - - Block
        - 2026 年 5 月市值 $45.07B；过去十二个月收入 $24.48B
        - ~1.84x 销售额；~1.87x EV / 销售额
        - 展示多元卖家和钱包生态在公开市场能拿到什么估值
        - 产品组合和发达市场基础设施不同
      - - Fiserv
        - 2026 年 5 月市值 $30.16B；过去十二个月收入 $21.09B
        - ~1.43x 销售额；~2.78x EV / 销售额
        - 有用的中低区间公开支付倍数锚
        - 现有支付处理商，增长和利润率画像很不同
      - - Adyen
        - 2026 年 6 月市值 $34.53B
        - 高溢价上市支付平台，2026 年重估后仍值 $34.53B
        - 说明高溢价全球支付股权在降级后仍能交易到哪里
        - 没有可逐项对照的非洲移动钱包或消费者钱包经济性
      - - Moniepoint
        - 2024 年 10 月 Series C $110M
        - ~$1B 私募估值
        - 最近非洲金融科技独角兽可比对象中最接近，且有明确私募定价
        - 商业银行和收单组合不同于 Wave 的移动钱包核心
      - - Tyme
        - 2024 年 12 月 Series D $250M
        - ~$1.5B 私募估值
        - 说明已披露的非洲金融科技赢家仍能完成大额私募轮
        - 数字银行模式和客户变现不同于 Wave
      - - Djamo
        - 2025 年 4 月融资 $17M；1M 客户
        - 成长期私募轮，规模低于独角兽
        - 有用的法语西非需求信号
        - 规模太小、披露不足，不能直接迁移倍数
    notes: 可比集合混合了公开支付处理商、汇款公司和已披露的非洲私募金融科技轮次，因为当前收入披露齐全的直接私募移动钱包估值很稀缺。
