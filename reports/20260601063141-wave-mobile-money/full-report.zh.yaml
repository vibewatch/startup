  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 竞争对手 / 替代方案
      - 观察到的定价或打包信号
      - 包含内容
      - 关键未知或注意事项
      - 对 Wave 的影响
    rows:
      - - Wave
        - 1% 转账费；充值、提现、缴费免费
        - 核心境内钱包操作和缴费
        - 已审阅公开界面未披露可匹配的活跃用户或代理网点数量
        - 消费者端公开价格主张最强，但护城河取决于能否守住
      - - Orange Money
        - 10,000 CFAF 以内转账费 54 CFAF；主转账区间为 0.5% + 4 CFAF；商户支付免费；提现另行计价
        - 钱包转账、提现、商户支付、缴费
        - 官方定价示例来自 Cameroon，不是 Côte d’Ivoire 或 Senegal 一一对应的资费
        - 透明度低于 Wave 单一标价费率，但更丰富的打包削弱纯价格对比
      - - MTN MoMo
        - 官方资费菜单覆盖转账、提现、商户支付和贷款；2025 年本地报道称 Côte d’Ivoire 部分提现费已取消
        - 转账、商户支付、快速贷款、提现
        - 通用定价页未披露一张跨市场资费表
        - MTN 可以选择性复制低费率打法，同时不放弃更宽的变现栈
      - - M-PESA / Safaricom
        - 官方费率页采用分层资费表，而不是固定费率承诺
        - 转账、商户支付、收款请求、储蓄 / 信贷
        - 具体消费者费率表只适用于 Kenya 市场
        - 说明更丰富生态可以与更复杂价目表并存
      - - Djamo / 类银行替代方案
        - 以免费账户定位和低显性费用为主，而非钱包转账头部定价
        - IBAN 账户、Visa 卡、储蓄、投资、信贷、向银行和移动钱包转账
        - 并非每条走廊上都等同于 Wave 的充值 / 提现
        - 捆绑“让钱增长”工具，在钱包上层竞争
      - - 通过 PI-SPI 的银行转账
        - WAEMU 互联互通上线后，跨平台转账不再收取额外费用
        - 跨平台账户、钱包和金融科技公司转账
        - 上线后终端用户银行定价仍未按供应商和市场稳定披露
        - 让银行联动资金流转成为基础钱包转账更清晰的替代方案
    notes: 定价行混合了确切资费、打包信号和系统级变化，因为竞争对手披露的定价各国不一致。本表聚焦用户能从已审阅官方界面和 2025 年互联互通报道中实际推断出的内容。
