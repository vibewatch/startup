companyProfile:
  summary: >-
    Wave Mobile Money 是 Drew Durbin 和 Lincoln Quirk 在 Sendwave 之后于 2018 年从 Senegal
    起步的移动支付平台。它的核心消费端产品罕见地简单：充值免费、提现免费、缴费免费，转账统一收取 1%。Wave 又在这个基础上推出 Wave Business，覆盖薪资发放、收款、商户收单，以及结账或 API
    驱动支付。2025-2026 年公开来源显示，公司月活跃用户超过 20 million，代理超过 150,000 个，覆盖八个市场，使其在非洲移动支付中拥有少见的消费者规模。尽管 2021 年以 $1.7 billion 估值完成
    $200 million Series A，并在 2025 年 6 月获得 EUR 117 million / $137 million 债务融资，公开披露对收入、利润率、治理和股权结构细节仍然偏薄。
