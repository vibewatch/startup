      - number: '5.2'
        title: 架构、集成与代理运营
        blocks:
          - type: paragraph
            body: >-
              公开架构证据真实存在，但属于间接证据。Wave 没有像支付 API 公司那样开放自助开发者门户。最清晰的架构代理证据来自合作方集成、安全、终端和代理运营材料。Product Relations Manager
              岗位把合作方集成描述为端到端流程，从技术范围界定到测试、生产上线和上线后健康度，包含与银行、公用事业、电信和政府机构一起审查 REST、SOAP、webhook、VPN 和超时细节。Application
              Security Engineer 岗位暴露出一套现代软件栈，横跨 Python、GraphQL、Kotlin、Swift、React、Postgres/CockroachDB、GCP/Terraform 和
              Kubernetes。终端工程还加入 GitOps、CI/CD、Azure，以及跨 Apple、Google、Microsoft、iOS 和 Android 设备的 fleet
              management。运营侧，区域和辖区负责人招募、签约、培训并监控代理；premium-cash 人员则管理点钞、财资系统记录和再平衡请求。结果是一个混合架构：app-first
              软件，叠加重线下现金网络和合作方管理的支付集成。
