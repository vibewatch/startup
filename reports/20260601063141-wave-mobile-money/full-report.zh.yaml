  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 哪些信息会改变判断
    rows:
      - - 投资逻辑：Wave 在法语区移动钱包里做出了少见规模
        - 2025 和 2026 年来源指向 20M+ MAU、150k+ 代理，以及很大的商户和付款人覆盖面
        - 如果当前收入或留存没有随用户基础放大，判断会转弱
      - - 投资逻辑：低价和商业产品让变现面宽过单纯 P2P
        - Wave 仍宣传 1% 转账、免费提现，以及企业支付、收款和商户工具
        - 只有管理层证明企业和商户产品带来的是可持续利润率、而不只是交易量，判断才会改善
      - - 投资逻辑：部分私募资本仍愿意为非洲金融科技赢家付高价
        - Moniepoint 和 Tyme 都在 2024 年越过独角兽门槛；Djamo 仍在 2025 年于法语西非完成融资
        - 如果 Wave 自身能以干净的普通股条款完成新一轮股权融资，判断会增强
      - - 反向逻辑：公开价格发现陈旧
        - Wave 上一次披露的股权估值仍是 2021 年 $1.7B Series A；2025 年资本是债务，不是股权
        - 如果管理层开放当前收入、利润率和股权结构数据室，担忧会缓解
      - - 反向逻辑：价格战和监管摩擦会压缩利润率、拖慢增长
        - 反向报道提示费用竞争、支付轨道排除和新市场牌照瓶颈
        - 如果 Wave 获得稳定监管接入，并证明即便电信运营商反击，抽佣率仍有韧性，担忧会缓解
      - - 反向逻辑：普通股价值可能低于头条估值
        - 债务保住了头条估值，却没有告诉投资者，契约或优先权之后普通股到底值多少
        - 如果公司披露普通债务条款和干净的优先权堆叠，担忧会缓解
    notes: 这张表把业务质量支撑与价格纪律约束拆开；本章并不是说 Wave 没有规模，而是说价格支撑弱于叙事强度。
