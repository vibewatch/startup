      - number: '2.4'
        title: 增长驱动、激活缺口与监管约束
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动很直接。移动支付继续扩张，因为非洲广阔用户基础仍未充分数字化：非洲移动互联网使用率只有 28%，且尽管已有覆盖，仍有 960 million
              人没有有效使用移动互联网。随着可负担性改善，这个缺口给钱包采用留下空间。全球生态层面的代理密度已经很高，WAEMU 的商户点位数量在 2024
              年翻了一倍多，说明低客单收单正从试验走向规模化铺开。公共政策在标题层面也支持：BCEAO 维护共同支付轨道，联盟也有明确的 2025-2030 区域金融普惠战略。


              但约束同样实质。WAEMU 的开户基数远大于活跃账户基数，活跃率为 30.9%，说明原始账户数明显高估了深度使用。充值和提现仍主导交易金额，因此市场很大一部分仍是现金桥，而不是完全数字化的商户经济。GSMA
              还警告，欺诈和交易税会把用户推回现金；同一组来源也强调设备可负担性和数字技能是持续障碍。换句话说，市场不是需求受限，而是转化受限。


              监管是一股混合力量。BCEAO 的共同规则制定支撑市场合法性，但 2024 年支付服务指令和 2025 年 5 月之后的牌照制度也抬高合规门槛。MFW4A 报告称，牌照仍按国家审批，截止日期后不久只有九家
              fintech 获批，即使在 Senegal，运营中的 fintech 数量也远多于获授权数量。对 Wave 来说，监管合法性一旦拿下可以成为护城河，但跨 WAEMU
              扩张并不顺滑。风险不是移动支付缺乏相关性；风险在于账户激活、商户变现、税务 / 欺诈压力和牌照吞吐量都会放慢相关性转化为持久经济性的速度。
