  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律敞口是第一层风险
        blocks:
          - type: paragraph
            body: >-
              Wave 并不是在一个单一同质市场运营。其塞内加尔实体 Wave Digital Finance 持有 BCEAO 电子货币牌照，但 2025-2026
              年证据显示，区域扩张仍取决于逐国审批、支付系统接入和本地监管节奏。BCEAO 支持的 PI-SPI 基础设施现在是 WAEMU
              互操作即时支付的中枢轨道，第三方报告称银行、小额信贷机构、电子货币发行方和支付机构必须在 2026 年 6 月 30
              日前接入。这个截止日期很关键，因为错过区域互操作会直接削弱客户便利性和商户效用。喀麦隆的约束更强：Wave 2025 年进入当地依托 CBC 和 COBAC 批准，不包括直接发行移动钱包，并新增
              BEAC/GIMAC 报告和互联义务。乌干达又增加一个监管方，Wave 当地条款明确把条款修订与 Bank of Uganda 授权绑定。法律层也并不轻，因为 Wave 公开承认需要承担大量
              KYC、个人数据和投诉处理义务。合在一起，监管执行就是最清楚的投资逻辑失效类别：牌照、轨道和合规审批推进多快，Wave 才能扩张多快。
