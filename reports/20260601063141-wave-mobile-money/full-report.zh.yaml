      - - 基准
        - ~$350M-$450M 收入能力，来自中等付款人吞吐量，加上一部分企业和商户贡献
        - 2.0x-2.8x 销售额对应约 $700M-$1.26B，仍低于 2021 年估值，但不至于灾难性偏离
        - ~50%：最符合真实规模，但利润率和债务负担仍未完全验证
        - 需要证据证明当前收入和贡献利润率足以支撑中位支付估值倍数
      - - 乐观
        - ~$500M-$650M 收入能力，前提是付款人吞吐量、商户使用和收款一起放大
        - 3.0x-3.8x 销售额对应约 $1.5B-$2.47B，这是完全守住或超过上一轮独角兽估值的唯一路径
        - ~25%：需要比公开来源目前能证明的强得多的变现能力和更干净的经济性
        - 当前财务数据证明 ARPU 强、利润率健康，且没有隐藏的优先权或契约包袱
    notes: 这些是透明的情景假设，不是公司报告收入。由于 Wave 仍未披露经审计的当前收入，假设锚定公开付款人和定价证据。
