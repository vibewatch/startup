        - id: integration-layer
          label: 集成与控制层
          detail: 合作伙伴管理的 API、REST/SOAP/webhook、VPN 和超时配置、客服流程、投诉处理以及身份 / 合规规则。
        - id: platform-layer
          label: 平台与安全层
