      - - 监管适应
        - 监管和定价压力加剧后，Wave 申请了银行牌照
        - 高
        - 厘清银行牌照策略是防守、进攻，还是兼具两者，以及它要修补哪些经济性
    notes: 严重性是竞争承保视角：高表示即便 Wave 本身没有产品失败，该问题也会削弱 Wave 的差异化；中表示问题重要，但影响仍取决于执行。
