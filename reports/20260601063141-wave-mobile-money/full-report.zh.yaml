      - number: '3.3'
        title: 替代品、现状与新兴进入者
        blocks:
          - type: paragraph
            body: >-
              西非任何钱包最大的替代品仍不是另一个钱包，而是现状。Airtel 自己的年报引用更广义的非洲支付背景称，60% 的成年人仍未被银行服务覆盖，90% 的支付仍以现金完成。这让现金成为包括 Wave
              在内所有数字运营商的持久对手，因为现金有普遍接受度、不需要开户，并且背后有数十年的用户习惯。银行关联转账是更正式的替代品。GSMA 报告称，2024 年银行到移动钱包转账达到 $127 billion，BCEAO
              在 WAEMU 推出的 PI-SPI 旨在把银行、钱包和 fintech 之间的跨平台转账变成基础能力。


              更具战略意义的替代品，是位于基础移动支付之上的账户层。Djamo 是 Wave 走廊里当前最清晰的例子：TechCrunch 称，截至 2025 年 4 月，它在 Côte d’Ivoire 和 Senegal
              拥有超过 one million 名客户；其自有网站现在营销 IBAN 账户、Visa 卡、储蓄、投资、信贷，以及向银行和移动钱包转账。Moov Money Côte d’Ivoire
              是更直接的本地钱包竞争对手，而 Djamo 则是一个「钱包+」进入者，瞄准那些想保留移动支付可及性、又不愿放弃类银行工具的用户。趋势方向很清楚：钱包正在被向上拉，走向更广的金融操作系统。
