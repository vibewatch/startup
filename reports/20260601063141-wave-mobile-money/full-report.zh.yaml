      - number: '3.2'
        title: 定价、套餐与产品宽度
        blocks:
          - type: paragraph
            body: >-
              Wave 的低费率承诺明确且易懂，这是产品优势的一部分：公司营销的是一个醒目的数字，而不是复杂费率阶梯。Orange、MTN 和 Safaricom 的包装更分层。Orange 官方 Cameroon
              定价仍对转账和提现收取按公式计算的费用，同时免除商户支付费；MTN 的定价页面围绕多个变现桶组织，包括转账、提现、商户支付和快捷贷款；Safaricom 发布分层费率表，并把 M-PESA
              延伸到商户收单、收款请求、储蓄和信贷流。Airtel 也更接近电信超级 app 模式，公开强调商户支付、贷款、储蓄、国际转账和庞大代理网络。


              这种宽度重要，因为它改变了「竞争」的含义。如果买方只需要低成本国内转账，Wave
              看起来很强。如果买方还看重打包商户收单、透支或信贷获取、工资到账、银行转账或更广泛的运营商关系，既有玩家产品栈就更难被替代。Orange 的 Max it 和 Safaricom 的 MySafaricom
              都展示了这套逻辑：移动支付不是孤立功能，而是更大数字关系中的一个节点。谱系另一端最清晰的相邻新进入者是 Djamo，它把移动支付的可及性与 IBAN 账户、银行卡、储蓄、投资和信贷绑在一起。
