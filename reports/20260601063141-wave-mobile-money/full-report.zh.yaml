        blocks:
          - type: paragraph
            body: >-
              外部反向图景不是 Wave 没有规模，而是规模可能仍需要防御性定价和外部资本来撑。TechCabal、Norfund、Finnfund 都把 2025 年 6
              月融资描述为用于营运资本和存量及新市场扩张的债务；这有支撑作用，也说明公开资料还看不出公司已能自我供血。同一批来源称 Wave 有 20 million 月活以上、150,000+ 代理点和 3,000+
              员工，所以即使执行轻微滑坡，也可能带来很大的现金后果。Weetracker 给出更尖锐的边：Wave 在法语区移动钱包价格上打穿既有玩家后，对手复制了打法，MTN 在科特迪瓦取消取款费，Orange
              Cameroon 在 Wave 上线前把转账费降为 0。乌干达是最清楚的证伪案例：低费率公式不能自动迁移；当地报道显示 2024 年亏损加深，并有更早收缩信号。因此依赖图谱很宽：Wave 进入喀麦隆需要
