      - number: '5.3'
        title: 信任、隐私、支持与可靠性
        blocks:
          - type: paragraph
            body: >-
              Wave 的公开信任与安全文档多于公开正常运行时间文档。隐私通知明确覆盖客户、代理、商户和 QR 卡用户，并称 Wave 收集银行详情、身份证件、通话录音、交易数据、设备和崩溃活动、用于反欺诈 /
              合规的位置数据，以及交付服务所需的合作银行或公用事业提供商数据。投诉政策很具体：通过热线或网页表单受理，多数支付投诉在 24 小时内解决，2 个工作日内回复，目标是在 15
              个工作日内解决。当地条款加入更多运营细节，包括功能机 USSD 访问、在代理点使用 QR 卡、四位 PIN 控制、银行绑定流程，以及合作银行或 Wave
              系统可能不可用的明确期间。应用商店和评论代理指标显示，用户总体信任该产品，但也暴露出熟悉的 fintech 摩擦：希望增加交易备注、更好的撤销和银行安全保护、更多账单商覆盖，以及 iPhone 上较新的虚拟
              Visa 体验相关 bug。最大缺口是可观测性：没有找到公开状态页、正常运行时间 SLA、欺诈损失率或外部事故台账。
