            body: >-
              尽管 Wave 不披露合并财务报表，它仍给出了强劲的公开采用信号。2025 年 6 月贷款方公告和 TechCabal 报道描述，Wave 月活跃用户超过 20 million，代理超过 150,000
              个，员工超过 3,000 人，并在八个市场运营。2026 年 5 月一篇简介暗示公司在 20 million-plus 基线之上进一步增长，同时提到超过 10 million 名活跃付款人和超过 2
              million 名商户。官方应用商店列表至少验证了 2026 年六个具名市场，并确认 app 仍在积极维护。这些都是有意义的需求代理指标：Wave
              似乎为一个低费率产品拼出了很大吞吐量，企业页面也称商户可以接受来自数千万用户的付款。但代理指标仍只是代理指标。公司仍没有公开披露集团收入、按市场拆分的交易额、商户支付量或已变现账单支付量，因此无法把牵引力精确转成收入质量。
