      - number: '2.3'
        title: 按工作流拆分买方、用户与付款方
        blocks:
          - type: paragraph
            body: >-
              核心消费端工作流是家庭金融，不是企业资金管理。个人转账中，买方、用户和付款方通常是同一个消费者：他给钱包充值，并向家人、朋友或交易对手转移国内价值。Wave
              的消费端主张正是为这个用例设计：充值和提现免费，转账费简单统一为
              1%，并快速完成话费购买或水电账单支付等日常任务。预算所有者因此是家庭或个人，采用触发点则是信任、低可见费用、附近代理，以及能够完成一个原本需要携带现金的任务。


              企业工作流不同。Wave Business 明确瞄准雇主、商户和门店网络，用平台发薪、收款、现金归集和线上支付。在这些资金流中，企业是付款方或预算所有者，终端客户或员工则是接收侧的操作用户。商户收单尤其重要，因为
              WAEMU 的 2024 年数据显示，支付笔数已经很大，尽管单笔支付金额仍然偏低。这一画像正适合低客单、高频次商业场景，在这里，费率透明可以改变用户行为。


              这种拆分解释了为什么买方地图不应把市场压成一个无差别的「移动钱包用户」。家庭汇款人关心便利性和规避转账费。微型商户关心收单时不损失利润。中小企业雇主关心批量付款可靠性和收款。代理关心 float
              周转和交易密度。BCEAO 的使用结构和 Airtel 的产品宽度都说明，竞争性钱包市场正向多用途生态系统收敛，但近期变现战场仍是日常国内支付，价格、分销和现金替代在这里承担大部分工作。
