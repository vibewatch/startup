  - id: TM004
    title: 增长驱动因素与约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Wave 的影响
      - 尽调问题
    rows:
      - - 覆盖已到但未联网的移动用户基数大
        - 驱动
        - 多年期
        - 非洲已有 416M 人使用移动互联网，但另有 960M 人虽被覆盖仍未使用；若可负担性改善，钱包采用仍有空间
        - 哪些 Wave 市场的智能手机可负担性和识字率瓶颈最突出？
      - - 代理网点密度与分销深度
        - 驱动
        - 持续
        - 代理点够容易触达，仍是建立信任、保证备付金可用、替代现金的前提
        - 与 Orange/Airtel 相比，Wave 各国代理点密度和交易吞吐量是多少？
      - - WAEMU 商户点增长
        - 驱动
        - 当前
        - 3.7M 个商户点和 QR 带动的增长，让商户受理成为最显眼的下一步变现切口
        - Wave 当前交易量中，C2M 与 P2P 各占多少？
      - - WAEMU 统一支付轨道
        - 驱动
        - 结构性
        - SICA-UEMOA 和 STAR-UEMOA 降低碎片化风险，并在统一监管下支持互联互通清算
        - 即使有共同轨道，哪些实际互联互通仍需要运营商双边协作？
      - - 激活缺口
        - 约束
        - 当前
        - 已开立账户 248M，对比活跃账户 76.9M，说明仅靠注册增长不等于可变现使用
        - Wave 各市场真实 MAU、交易用户和留存用户曲线如何？
      - - 充值 / 提现占主导
        - 约束
        - 当前
        - WAEMU 交易额中 56.76% 仍是存取款；如果资金从不留在数字钱包里，钱包变现会受限
        - Wave 的交易量中，收款后继续留在数字钱包而非提现的比例是多少？
      - - 牌照办理速度与逐国审批
        - 约束
        - 2025-2026
        - 区域一体化并未消除 PSP 和 EMI 的本地审批摩擦，进入新国家或推出新产品仍可能被拖慢
        - Wave 各市场持有哪些牌照，还有哪些审批未完成？
      - - 欺诈、税费与设备可负担性
        - 约束
        - 持续存在
        - GSMA 明确将这些列为用户回流现金的原因，可能挤压激活、商户使用和信任
        - 哪些 Wave 市场因政策或欺诈事件面临最高的回归现金风险？
      - - 电信运营商支持的竞争对手规模
        - 约束
        - 结构性
        - Orange、MTN、Airtel 和 Vodacom 披露的用户基数和资产负债表规模都大于 Wave
        - 资产负债表规模较弱时，Wave 靠什么取胜：定价、UX，还是监管定位？
    notes: 驱动因素和约束对应采用时点、活跃使用转化和估值影响，而不是泛泛的“市场增长”表述。
