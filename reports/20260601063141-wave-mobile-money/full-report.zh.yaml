  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 单位
      - 当前值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 消费者 P2P 转账
        - 钱包用户相互转账时收取固定费率。
        - 转账金额的 1%
        - 官方消费者端页面显示，2026 年已上线。
        - 标价高度可见；实际净抽成仍未知。
        - 月度转账量、退款，以及促销后的实际抽成率。
      - - 企业批量付款
        - 企业通过 Wave Business 发放工资或款项。
        - 发送方 1%；收款方免费
        - 截至 2026 年公开宣传。
        - 这是有用的变现杠杆，但未披露规模。
        - 总付款规模及其在企业收入结构中的占比。
      - - 商户受理 / 线下支付
        - 商户在线下受理客户钱包支付。
        - 每日前 CFA 20k 免费，之后 1%
        - Wave Business 公开宣传。
        - 显示免费门槛后可向商户变现。
        - 商户 TPV、免费门槛使用量和实际商户折扣率。
      - - 账单支付
