chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与监管锚点
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money 是以 Senegal 为锚点的移动支付平台，目标是把日常数字金融成本压到远低于电信主导的既有玩家。公司的经营故事可以追溯到 Drew Durbin 和 Lincoln
              Quirk：两人出售汇款创业公司 Sendwave 后，转向非洲国内资金流转，并于 2018 年从 Senegal 起步。它在官方页面上的消费端主张始终罕见地简单：充值、提现和缴费免费，点对点转账统一收取
              1%。这一低费率零售切口，配合用于现金转换的代理网络、QR 卡和 app 使用，以及不断扩展的企业产品栈，包括批量付款、收款、商户收单和结账 API。保留来源中 Wave 的公开法律锚点是 Senegal 的
              Wave Digital Finance SA，该公司称其于 2022 年 4 月获得 BCEAO 电子货币发行机构牌照。综合第 1 章证据，Wave 的身份清晰：它不只是一个支付
              app，而是一个受监管、由代理网络支撑的金融网络，核心差异化在于极致低价。
