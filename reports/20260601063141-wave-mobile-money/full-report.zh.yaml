      - CM044
  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 披露规模或融资
      - 目标用户 / 任务
      - 主要差异化
      - 与 Wave 对比的关键局限
    rows:
      - - Orange Money / Max it（Orange 钱包生态）
        - 电信运营商在位者 / 直接竞争
        - 39.7m 名 Orange Money 活跃客户（2024）；Côte d’Ivoire 应用文案称 Max it 约 3m 用户
        - 大众钱包用户、缴费、商户支付、电信客户
        - 披露钱包用户基数大，叠加超级 app 宽度
        - 按公式计费，透明度仍低于 Wave 的 1% 承诺
      - - MTN MoMo
        - 泛非在位者 / 直接基准
        - 69.5m 月活用户；$500.3bn 金融科技交易额（FY2025）
        - 大众转账、商户支付、贷款、缴费
        - 规模、资费深度和电信运营商主导的分销
        - 公开界面不如 Wave 简单，价格反击正在压缩利润率
      - - Airtel Money
        - 泛非在位者 / 替代基准
        - 54.1m 当前客户；2.4m 活跃代理网点；$196bn TPV（2025/26）
        - 转账、商户、储蓄、贷款、IMT
        - 代理网点密度和广泛金融科技产品集
        - 在 Wave 的法语区核心市场中，扎根程度不如 Orange 直接
      - - M-PESA / Safaricom
        - 东非基准在位者
        - 官方资费表、商户生态、专用商户应用、较强应用商店信号
        - 商户、消费者支付、储蓄 / 信贷
        - 商户与电信生态很深
        - 地域主要在东非，而非 Wave 核心 WAEMU 市场
      - - Moov Money Côte d'Ivoire（本地钱包）
        - 本地直接钱包替代方案
        - 官方称全国可用；转账上限 1,500,000 FCFA
        - Côte d’Ivoire 钱包用户和缴费
        - 本地钱包可用，且 24/7 访问
        - 披露规模小于 Orange、MTN 或 Airtel
      - - Djamo
        - 新兴数字银行 / 相邻进入者
        - 官网显示 1.5m 用户；2025 年 4 月报道称 >1m 用户并融资 $17m
        - 从仅用钱包转向账户、卡、储蓄和信贷场景的用户
        - 在移动钱包可得性之上叠加银行账户深度
        - 不像钱包在位者那样围绕充值 / 提现代理网点经济性优化
      - - 通过 PI-SPI 的银行转账
        - 正式替代方案 / 银行联动轨道
        - 自 2025 年 9 月起，银行、钱包和金融科技公司之间互联互通
        - 需要账户到钱包或账户到账户转移的用户和商户
        - 跨平台转账成为基础服务后，锁定效应降低
        - 仍依赖账户绑定和上线后的定价透明度
      - - 现金
        - 现状替代方案
        - 根据 Airtel 年报语境，非洲 90% 支付仍以现金完成
        - 日常低信任或离线交易
        - 普遍接受，且无上手摩擦
        - 没有数字账本、无法远程转账，可变现挂载点更弱
      - - 自建 / 自有技术栈
        - 商户或金融科技公司自建
        - 共享轨道和互联互通转账降低集成门槛
        - 想在银行 / 钱包轨道之上拥有自有前端的商户或金融科技公司
        - 可以自己掌握客户关系，同时外包底层轨道
        - 需要简单钱包部署之外的产品、合规和支持能力
    notes: 行项目混合了直接竞争对手、现状替代方案和相邻进入者，因为买方可以用多种方式解决同一个资金流转任务。规模标记来自确切审阅来源，未按同一日期或地域归一化。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive for the material alternatives explicitly assessed for Wave’s core jobs-to-be-done in francophone West
        Africa: direct wallets, telco incumbents, pan-African benchmarks, status-quo substitutes, and emerging digital
        entrants.
