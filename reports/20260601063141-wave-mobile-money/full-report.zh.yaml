  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与直接替代方案
        blocks:
          - type: paragraph
            body: >-
              Wave 的直接优势异常简单：它的公开页面仍锚定免费充值、免费提现、免费缴费和 1% 转账费。对核心小额转账任务来说，这是很有吸引力的消费者主张。但竞争集合远不止另一个钱包 app。Orange
              Money、MTN MoMo、Airtel Money 和 M-PESA/Safaricom 都把钱包功能与更大的披露用户基数、更丰富的相邻服务，以及由电信既有玩家构建的分销体系结合起来，而不是由独立
              fintech 搭建。具体到 Côte d’Ivoire，Moov Money 仍是另一个本地移动钱包选项；现金和银行关联转账仍重要，因为它们熟悉、广泛可得，并且互操作性越来越强。


              关键含义是，Wave 并不是在空白市场竞争。它面对的是深厚电信生态系统、作为默认习惯的现金，以及位于钱包之上的金融 app 层。即便暂不看反向证据，已披露的规模标记也不对称：Orange 报告有 39.7
              million 名活跃 Orange Money 客户，MTN 报告有 69.5 million 名 MoMo 月活跃用户，Airtel 当前移动支付页面称其服务 54.1 million 名客户和 2.4
              million 名活跃代理。Wave 被审阅的消费端页面没有发布同等规模指标，这意味着它的公开差异化更容易围绕价格和便利性展开，而不是围绕网络深度展开。
