  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入的资金流与替代品
        blocks:
          - type: paragraph
            body: >-
              Wave
              的相关市场不是泛泛的「fintech」，甚至也不是非洲数字金融的全集。实际核心市场是法语区西非的低费率国内移动支付：基于钱包的个人转账、充值和提现、缴费、话费充值、商户收单，以及可以跑在代理网络上的简单企业付款或收款流。Wave
              自己的消费端网站围绕免费充值和提现、免费缴费、话费购买和 1% 转账费来锚定产品，企业端网站则把同一张网络延伸到薪资发放、门店收款、线下收单和线上支付。Y Combinator
              上的创始人叙事也指向国内资金流转，而不只是汇款，这是 Wave 当初要解决的核心问题。


              这条边界重要，因为若干相邻支出池应留在本章可服务市场逻辑之外。跨境汇款、完整零售银行、银行卡、借贷、保险和储蓄产品都是战略上有意义的邻近领域，但它们不是观察 Wave
              当前移动支付护城河的最干净公开视角。同样，高端银行卡驱动结账、面向企业零售商的正式商户收单、银行间转账轨道，都坐在市场旁边，却不定义它的核心购买工作流。最重要的现状替代品仍是现金：用户充值、提现，并拿数字选项与实体现金流通的摩擦、费用和信任画像比较。


              因此，替代品集合是分层的。对非正式家庭和商户而言，现金是默认储值和转账轨道。Orange Money、Airtel Money
              等电信主导钱包是最接近的产品替代品，因为它们已经服务国内转账、缴费、商户支付和代理介入的现金处理。银行和银行卡轨道主要影响正式银行化的领薪客户或较大商户。这也是 Wave
              定价姿态如此关键的原因：它试图让简单国内资金流的数字方式比现金更便宜，从而扩张市场，而不只是从固定的既有钱包用户池里抢份额。
