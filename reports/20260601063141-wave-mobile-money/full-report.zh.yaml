      - number: '6.4'
        title: 扩张潜力明确，但耐久性仍取决于渠道、国家组合和具体市场执行
        blocks:
          - type: paragraph
            body: >-
              Wave 的客户故事不能读成「20 million 用户，所以风险低」。证据给出的扩张路径很清楚——商户受理、批量付款、账单支付、API 收银，以及 GSMA
              记录的西非移动钱包顺风——但渠道质量和标价同样关键。Wave 的模式仍高度依赖代理点：官方资料、公司画像和行业材料都指向大规模 cash-in/cash-out 网络、QR
              卡、地推开户和客服热线，这些仍是拉动采用的核心机制。现金占比高的市场里，这可能是优势，也会把流动性、培训和服务质量变成依赖项。最硬的反向证据来自乌干达：2025 年 4
              月两篇报道称，当地业务收入增长，但亏损也扩大，因为 MTN、Airtel 等既有玩家保住了更强的分销和品牌位置。冈比亚另一篇 2026 Wave Business
              评测称，商户注册已一年多不可用；这个信号虽小但具体，说明 B2B 推进并非每个市场都同样顺滑。与此同时，Wave
              仍未披露分国家收入结构、头部客户敞口或具名企业客户名单，集中度风险因此仍是重要分析项，但公开资料无法量化。
