  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前财务数据不及预期
        - 2025 年或当前运行率收入更接近悲观情景区间，贡献利润率疲弱
        - 2021 年独角兽估值会显得缺乏公开或私募可比区间支撑
        - 把估值重置到悲观情景附近，不再锚定旧头条
      - - 债务条款苛刻
        - 融资文件显示高定价、严格契约或强担保，使普通股从属
        - 头条企业规模会高估普通股价值
        - 按债后普通股经济性重新定价，而不是按融资头条定价
      - - 优先权包袱沉重
        - 股权结构表显示参与权、棘轮或清算优先权，明显扭曲下行分配
        - 普通股上行会比投后估值暗示的窄得多
        - 除非入场价格足以补偿优先权堆叠，否则暂停新资金承销
      - - 监管接入弱化
        - Wave 无法在关键扩张市场取得稳定支付轨道或牌照接入
        - 长期增长和利润率逻辑会变得结构性更不可信
        - 下调扩张假设，切换到更低倍数框架
      - - 价格战持续
        - 电信运营商在核心和新市场继续提供零费率或近零费率，且利润率没有修复
        - Wave 的低费率优势不再像护城河，更像经济性的天花板
        - 下调信心评级，重新参与前要求证明抽佣率可持续
    notes: 关键触发因素聚焦普通股价值，而不只是公司质量：每一项条件都可能让陈旧的独角兽估值变得不可投资，即便用户采用依然扎实。
    claimRefs:
      - CV015
      - CV017
      - CV018
      - CV019
      - CV020
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前收入桥
        - 2025 年经审计收入、毛利、当前运行率和市场层面贡献利润率
        - 没有真实分母，估值仍是情景测算，不是可承销判断
        - 财务团队、审计包和月度管理账
      - - 债务条款
        - 2025 年融资的定价、摊还、契约包、担保和本地保证
        - 债务能保住头条估值，却会实质削弱普通股价值
        - CFO、法律顾问和贷款方文件
      - - 股权结构表与优先权
        - 股权类别、清算优先权、反稀释、参与权和可转工具
        - 如果优先股保护很强，头条估值可能夸大普通股经济性
        - 法律顾问、股权结构表导出和股票购买协议
      - - 监管路线图
        - 支付系统接入、喀麦隆牌照，以及任何银行牌照流程的状态
        - 扩张价值取决于可预期的监管接入，而不是临时绕道
        - 监管事务团队和法律备忘录
      - - 核心市场盈利能力
        - 塞内加尔和科特迪瓦队列利润率、代理经济性，以及竞争下的抽佣率稳定性
        - 乐观情景需要证明低价仍能转化为有吸引力的单位经济性
        - FP&A、市场 GM 和代理网络分析
      - - 退出路径
        - 战略买家地图、财务投资人兴趣，以及任何可信公开市场时间表的证据
        - 回报承销取决于谁能接手资产，以及按什么披露标准接手
        - CEO、投行和董事会材料
    notes: 每一项尽调事项都直接对应一个变量，可能改变建议或可接受入场价格。
    claimRefs:
      - CV013
      - CV015
      - CV038
      - CV045
      - CV046
      - CV048
