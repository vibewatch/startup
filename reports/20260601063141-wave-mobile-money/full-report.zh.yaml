        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开资本充足性比投资判断更容易描述。Wave 明确在 2025 年 6 月获得一笔大型营运资金授信：EUR 117 million，约 $137 million，由 RMB
              牵头，三家发展金融机构参与。管理层和贷款方把这笔钱定义为面向营运资金、现有市场和新市场扩张的增长资本。同一组来源仍回指 2021 年 $200 million Series A、估值 $1.7
              billion，因此即便不计更早种子资本或任何后续融资，也能看到披露下限约 $337 million
              的公共资本。缺失的是投资者把这段资本历史转成现金跑道所需的一切：没有公开现金余额、总债务排期、债务定价、契约包、偿债负担或月度烧钱速度。BCEAO 监管材料确认，Wave
              在一个高度监管的电子货币和支付系统框架内运营，受牌照、担保基金和流动性纪律约束，但这并不揭示集团层面现金生成是否足以覆盖扩张。结果是，本章对资产负债表充足性的判断仍停留在方向层面，无法量化。
