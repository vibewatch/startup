  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开标价
        blocks:
          - type: paragraph
            body: >-
              对一家非洲私营 fintech 来说，Wave 的公开定价异常明确：核心消费钱包仍宣传免费充值、免费提现、免费缴费，转账统一收取
              1%。这意味着最可见的变现杠杆是转账费本身，而不是现金取用。企业端页面补充了细节。Wave Business 宣传 1% 批量付款费，以及一种商户收单模式：每天前 20,000 CFA
              的线下支付免费，增量交易量收取 1%。TechCabal 还报道称，Wave 把账单支付费用转嫁给企业，而不是终端用户。合在一起，这些披露指向一个有意设计的双边模式：Wave
              补贴消费者现金取用和低收入使用，再试图从转账量、企业付款、商户收单和账单商合作中收回经济性。核心投资判断问题不是标价清晰度，而是补贴和分销成本之后，实际抽佣率、商户折扣收入和账单商经济性缺失。
