  - id: FI004
    title: 资本密集度 / 现金流图
    type: matrix
    layout: wide
    summary: 矩阵说明，Wave 不像硬件企业那样资本开支很重，但仍会因营运资金、代理点流动性、合规和扩张亏损而呈现资本密集。
    approximationNotes: 这是定性的资本密集度图，因为 Wave 没有发布现金流量表或债务明细。
    data:
      columns:
        - 公开信号
        - 现金含义
        - 承销判断
      rows:
        - id: debt-facility
          label: 债务融资额度
          values:
            - 2025 年 6 月 €117m / 约 $137m 债务融资
            - 提供近期流动性，但也增加融资义务
            - 对近期资金充足度有利，但单独不足以判断现金续航
        - id: working-capital
          label: 营运资金用途
          values:
            - 管理层明确称融资款支持营运资金
            - 钱包、付款和结算流占用运营流动性
            - 即使硬资本开支较低，增长仍在耗现金
        - id: agent-float
          label: 代理点浮存
          values:
            - GSMA、World Bank 和 Airtel 都把浮存描述为真实需求
            - 服务商可能需要为代理点现金和电子浮存余额融资
            - 分销承诺可能在利润释放前先吃掉资本
        - id: licensing
          label: 牌照与合规
          values:
            - BCEAO 牌照和支付系统控制可见
            - 监管韧性伴随合规和资金保障开销
            - 牌照化规模更稳，但不是零成本
        - id: expansion-losses
          label: 扩张市场亏损
          values:
            - Uganda 2024 年收入低于净亏损
            - 新市场在达到密度前可能持续亏损
            - 扩张会拉长需要外部融资的周期
        - id: runway-gap
          label: 现金续航可见度
          values:
            - 现金、烧钱速度和债务条款仍未披露
            - 无法把资金充足度换算成可支撑月份
            - 未来融资依赖仍只能推断
