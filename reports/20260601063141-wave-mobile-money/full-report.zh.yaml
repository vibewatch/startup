      - number: '4.3'
        title: 代理经济性与单位经济推断
        blocks:
          - type: paragraph
            body: >-
              尽管客户体验以 app 为先，Wave 的模式在结构上高度依赖代理。产品需要密集的充值和提现覆盖、开户注册、本地支持和分销流动性，才能让免费充值和提现的承诺可信。行业证据清楚显示，隐藏成本栈就在这里。GSMA
              报告称，客户费用仍是约 80% 移动支付提供商的主要收入来源，代理佣金虽然已从提供商收入的 45% 降至 41%，仍占很大一部分。另一份 GSMA
              代理可持续性研究警告，活跃代理数量增长快于充值和提现金额，压低了平均代理经济性；提现费下调则同时挤压代理佣金和提供商利润率。World Bank
              部署指南说得更进一步：提供商可能需要借钱给代理，只为维持电子余额和手头现金。上市可比公司也强调同一模式。Airtel Money 和 MTN 披露了巨大规模，但也显示数百万代理、float
              获取和商户网络优化仍是核心运营任务。对 Wave 来说，1% 转账费只能放在公开来源无法量化的成本基础上理解。
