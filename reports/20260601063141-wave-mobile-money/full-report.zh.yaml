      - - 靠简单产品拉动消费者采用
        - 既有玩家把钱包与商户支付、储蓄、贷款和更宽的电信超级应用绑定
        - 高
        - 检验 Wave 的相邻产品深度是否足以留住更高价值用户和商户
      - - 城市商户受理势头
        - 现金仍主导许多日常支付，商户也可选择银行绑定方案
        - 中
        - 按市场量化商户份额、重复交易密度，以及数字结账与现金结账的比例
      - - 金融科技挑战者叙事
        - Djamo 等新进入者瞄准从钱包升级到账户、卡和信贷的用户
        - 中
