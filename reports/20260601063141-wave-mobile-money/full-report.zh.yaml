  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和入场纪律
        blocks:
          - type: paragraph
            body: >-
              Wave 进入估值工作时，运营重要性和公开价格发现之间错位很大。运营重要性很容易看见。官方和贷款方背书的 2025 年来源指向 8 个市场、20 million 以上月活、150,000+ 代理点、3,000+
              员工，产品仍宣传免费提现、免费取款、免费账单支付和 1% 转账费。价格发现问题同样清楚。最后一次公开披露的股权估值仍是 2021 年 9 月 $200 million Series A、估值 $1.7
              billion；下一次大型公开资本事件是 2025 年 6 月债务工具，而不是新的股权轮。这意味着，投资人可以说 Wave
              规模大、业务真实、能拿到融资，但不知道普通股在旧独角兽估值上今天是否有吸引力。因此，入场纪律必须从一条硬规则开始：不要把过期的头条估值误当成当前公允价格。纪律严的买方应先假设旧估值偏高，直到管理层在私密数据室证明当前收入、利润率、债务负担和股权结构条款。
