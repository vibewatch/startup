      - number: '8.2'
        title: 可比公司组和市场背景
        blocks:
          - type: paragraph
            body: >-
              保留下来的可比组同时指向两个方向。第一，市场并没有死。GSMA 和 BCG 都支持非洲数字金融背景仍在扩张；Moniepoint、Tyme，甚至较小的法语区玩家 Djamo
              的私人融资也说明，有证据的品类赢家仍能拿到资本。第二，当前上市支付公司的倍数比 2021 年创投周期冷静得多。PayPal、Block 和 Fiserv 都大致落在低个位数销售倍数区间；Remitly
              倍数更高，但仍远低于曾经支撑轻松叙事承销的软件异常值。对 Wave
              来说，这一点重要，因为公司没有披露分母，外部无法判断它应接近成熟支付区间、较高增长的汇款区间，还是因为非洲移动钱包的稀缺性和战略价值而高于两者。因此，可比组既不支持自动判定泡沫，也不支持随手认可过期独角兽估值。它只支持更窄的表述：Wave
              可能仍有足够价值，值得严肃尽调，但公开市场不再仅凭规模给估值加分。
