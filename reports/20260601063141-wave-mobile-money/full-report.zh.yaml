            body: >-
              由于 Wave 仍未披露当前收入和毛利率细节，情景分析必须清楚区分证据和假设。证据包括 1% 转账费模式、最好 2026 公司画像中超过 10 million
              活跃付款方，以及上市支付同业的公开倍数区间。假设则是每个付款方能带来多少月度吞吐量和增量商户或企业变现。温和变现情景下，公司收入能力可能大约落在 $250 million 至 $300 million
              区间；如果市场套用公开下行情景倍数，估值会显著低于旧独角兽估值。中间情景把 Wave 推近 $350 million 至 $450 million 收入能力，对应估值大致低于 $1.3
              billion。只有乐观情景能完全支撑 2021 年估值，而它需要明显更好的变现和一定私人市场溢价。这种不对称就是核心估值信息。上行情景仍存在，但现在取决于公开记录没有给出的证据。以估值看，Wave
              可能是一家业务优秀、但入场价格仍过高的公司；除非尽调补上分母缺口。
