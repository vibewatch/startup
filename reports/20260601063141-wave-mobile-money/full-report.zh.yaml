  - id: TM005
    title: 替代方案与竞争对手基准表
    columns:
      - 参与者 / 替代方案
      - 核心地域
      - 定价 / 经济性信号
      - 披露规模
      - 对 Wave 的影响
    rows:
      - - 现金
        - Wave 所有市场；尤其是非正规零售和家庭转账
        - 没有显性费用，但时间、信任、损耗和距离成本高
        - 默认替代方案，不是披露的网络指标
        - Wave 要扩大市场，数字方式必须比现金更便宜、更可靠
      - - Orange Money
        - 法语区及更广的非洲和中东覆盖
        - Orange Money 在 AME 区域 2026 年 Q1 增长 15.7%
        - Orange AME 收入 2026 年 Q1 +12.7%
        - 法语区市场最接近的大型电信运营商基准；价格压力可能仍会持续
      - - MTN MoMo
        - 泛非电信运营商钱包基准
        - 规模支撑重投入和生态广度
        - 2025 年 69.5M MAUs 和 $500.3B 交易额
        - 展示电信运营商支持的钱包跨出单一区域后能达到的规模形态
      - - Airtel Money
        - 14 个非洲市场
        - 广泛钱包栈叠加大型活跃代理网点基础
        - 54.1M 客户、2.4M 活跃代理网点、$196B TPV
        - 分销经济性和商户 / 服务广度的强基准
      - - M-Pesa / Vodacom / Safaricom
        - 东非和南部非洲基准，不是 Wave 核心地域
        - 金融服务收入在集团层面已具备实质体量
        - FY2026 年 103.0M 金融服务客户和 $525.6B 交易额
        - 即使地域不同，仍是成熟钱包变现的最佳基准
      - - Wave
        - 8 个市场，主要在西非
        - 充值 / 提现免费；1% 转账费；商户侧折扣
        - 截至 2025 年中，20M+ MAUs 和 150k+ 代理网点
        - 具备真实规模的价格颠覆者，但公开披露仍少于最大电信运营商，资产负债表支撑也更小
    notes: 各基准并非完全可比；本表意在展示替代压力、定价姿态和规模不对称，而不是给出干净的市场份额排序。
    claimRefs:
