      - number: '2.2'
        title: 市场规模视角与竞争基准
        blocks:
          - type: paragraph
            body: >-
              最宽口径看，移动支付已经是一个很大的全球和非洲市场。GSMA 称，2024 年约 $1.68 trillion 之后，2025 年超过 $2 trillion 流经移动支付钱包；仅 Sub-Saharan
              Africa 仍有超过 1.1 billion 注册账户。但这些全球数字对评估 Wave 过宽。更有决策价值的公开市场视角是 BCEAO 的 WAEMU 数据集：2024 年有 248 million
              个已开立电子货币账户、76.9 million 个活跃账户，以及 FCFA 160,415 billion 交易额。这足以证明需求实质存在，同时也显示开户数仍远高于持续活跃使用的市场结构。


              运营商披露有助于框定机会，但不能形成干净的 SAM/SOM。MTN 报告 2025 年有 69.5 million 名 MoMo 月活跃客户和 $500.3 billion 金融科技交易额。Airtel
              Money 披露 2025/26 年有 54.1 million 名客户、2.4 million 名活跃代理，以及 $196 billion TPV。Vodacom 报告 FY2026 有 103.0
              million 名金融服务客户，包括 Safaricom，并有 $525.6 billion 交易额。Orange 在抓取结果页没有披露客户数，但显示 Orange Money 在 Africa & Middle
              East 板块内增长 15.7%，该板块 2026 年 Q1 增长 12.7%。这些基准重要，因为它们说明，大陆级既有玩家在已披露资产负债表、客户集和报告体系上都远大于 Wave。


              尽管如此，Wave 已披露规模足以让它重要。Finnfund 和 Norfund 都表示，截至 2025 年中，Wave 月活跃用户超过 20 million，代理超过 150,000 个，员工超过 3,000
              人，并在八个市场运营。这让 Wave 在法语区西非内部具备意义，但公开证据仍没有给出按国家拆分、真正属于 Wave 的 SAM 或
              SOM。因此，市场规模测算必须保留多个视角：生态系统交易额、活跃账户强度、商户点位增长，以及运营商规模代理指标。对尽调而言，这比假装公开披露中已经存在一个干净 TAM 数字更诚实。
