  - id: TM003
    title: 细分客群 / 买方地图
    columns:
      - 客群
      - 买方 / 用户 / 付款方
      - 流程
      - 预算归属
      - 采用触发点
    rows:
      - - 个人转账发送方
        - 买方=用户=付款方；家庭或个人
        - 充值或保留余额 -> 发起境内转账 -> 收款人提现或保留钱包余额
        - 个人或家庭现金预算
        - 相比携带现金，低费率看得见、代理点近、可信且更快
      - - 家庭账单付款人
        - 买方=用户=付款方；家庭财务管理者
        - 打开 app -> 支付水电费或话费 -> 省去出行、排队和现金处理
        - 家庭经常性支出预算
        - 小额高频付款更方便，摩擦更少
      - - 微型商户
        - 商户购买收款服务；客户是最终支付用户
        - 展示 QR 或接受钱包付款 -> 小额销售款数字化到账 -> 在 app 内对账
        - 商户营运资金预算
        - 费率负担低于在位钱包，小额交易的利润流失更少
      - - SME 雇主 / 薪资发放方
        - 企业是买方和付款方；员工是收款用户
        - 用企业 app 批量发放 -> 员工收到钱包余额或经代理点提现
        - 薪资 / 运营支出预算
        - 相比以银行为中心的替代方案，境内付款轨道更便宜、更简单
      - - 经销商 / 网点收款方
        - 企业买方；门店员工是操作用户
        - 从门店收现金 -> 余额集中 -> 再分配或支付供应商
        - 财资 / 现金管理预算
        - 比搬运纸币更快看清现金、更少处理风险
      - - 代理网点 / 被协助用户组合
        - 代理网点提供流动性服务；消费者或商户为交易出资
        - 用户经本地代理点充值或提现；智能手机使用受限时，也可走 QR 卡辅助流程
        - 客户或商户交易预算，加上代理网点备付金
        - 现金使用重的街区，需要网点密度和备付金可用性
    notes: 表格拆开消费者、商户、雇主和代理网点经济性，因为“钱包用户”这个类别过宽，无法支撑市场分析。
