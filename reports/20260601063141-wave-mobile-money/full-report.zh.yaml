      - number: '4.5'
        title: 盈利风险、未来融资依赖与结论
        blocks:
          - type: paragraph
            body: >-
              最具体的反向财务证据不是来自核心 Senegal 市场，而是来自 Uganda。两篇当地关于 Wave 2024 年 Uganda 业绩的报道引用了 UGX 14.68 billion 收入、UGX 3.11
              billion 经营亏损和 UGX 14.33 billion 净亏损，并提到 BDO East Africa 出具无保留审计意见。同一组报道认为，免费充值和提现加 1% 转账费，在面对 MTN 和 Airtel
              时尚未证明经济上可持续，并提到公司为保留资本出现裁员或缩编信号。这不能证明集团模式已坏；它说明 Wave 的低费率策略在更难扩张的市场可能需要大量补贴。Seneweb 称 Wave 2024 年在 Senegal
              支付了超过 FCFA 30 billion
              税费和法定缴款，这是一个正面的规模代理指标，但仍没有披露收入、利润率或现金生成。财务结论因此是混合的：由于定价和使用看起来在核心市场有韧性，收入质量有希望；但实际抽佣率、代理佣金、贡献利润、烧钱和债务条款缺失，使投资判断仍被卡住。Wave
              看起来是一个有融资能力的规模平台，但还不是一个透明可建模的盈利模型。
