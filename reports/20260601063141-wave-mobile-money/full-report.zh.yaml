      - number: '5.4'
        title: 路线图、差异化与产品风险
        blocks:
          - type: paragraph
            body: >-
              Wave 的差异化仍从价格和执行开始，而不是公开技术护城河。行业报道称，公司靠 1% 定价、简单 UX、支持 QR 的商户收单，以及对用户体验的端到端紧密控制获取份额。2022 年 EMI
              公告显示，路线图从转账延伸到商户支付、储蓄、信贷和汇款；2025 年和 2026 年法律及评论证据则显示，公司逐步扩展到银行绑定和虚拟
              Visa。招聘材料也显示，公司持续在支持、风险、工程、支付和代理运营上招人，这符合一个仍在拓宽并加固表面的平台。但护城河正变得更运营化、更少结构性。BCEAO
              推动的互操作性降低了封闭网络价值，外部报道也认为，用户留在自有闭环内带来的黏性正在削弱。投资判断问题不再是 Wave
              能否发布更多功能，而是它能否把商户、代理、支持和可靠性表现维持在足够高的水平，让客户即便在切换成本下降时仍然留下。
