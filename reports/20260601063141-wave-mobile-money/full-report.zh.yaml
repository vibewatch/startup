            body: >-
              证据支持观察建议，置信度中等、风险高、估值偏高。这并不是说 Wave
              没有质量。相反，公司已有足够规模、产品优势和融资韧性，仍可继续进入投资视野。问题在于，估值争论现在取决于公开来源仍看不到的普通股细节：当前收入、当前利润率、偿债负担，以及旧股权结构中任何优先权负担。反向来源让谨慎更有必要，而不是更弱。Wave
              正在处理监管摩擦、支付轨道接入问题，以及大型既有玩家直接用费用反击。这些风险不会杀死业务，但如果把过期的 2021 年头条估值当成市场和资产负债表从未改变一样来支付，风险很高。实操立场因此很简单。继续跟踪
              Wave，但在越过观察状态前，必须拿到当前财务桥接、债务文件和股权结构证明。如果材料显示经济性强、下行保护正常，判断可以改善。否则，投资逻辑应迅速中止，而不是只围绕规模强行合理化。
