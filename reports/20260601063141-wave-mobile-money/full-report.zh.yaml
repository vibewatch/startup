      - number: '7.4'
        title: 缓释项存在，但承销仍需要硬性止损条件
        blocks:
          - type: paragraph
            body: >-
              证据并不支持无条件的负面判断。Wave 拥有真实的塞内加尔 EMI 牌照、明确的隐私和投诉政策、负责任披露计划、当前可用性披露，以及开发金融机构支持的贷款方。如果 PI-SPI
              互操作按时推出，互操作反而可能提升客户便利性，并降低跨运营商转账对既有电信运营商的黏性。但剩余风险仍高，因为公司同时在管理监管过渡、喀麦隆的纯合作方模式、债务融资驱动的扩张阶段，以及至少一个定价模式尚未转化为盈利的困难市场。尽调中，正确框架应是条件式，而不是二元式。只有当管理层能证明
              PI-SPI 准备就绪、欺诈和投诉控制有独立证据、债务到期与契约空间可信、从合作方主导上线走向可持续经济性的路径更清晰时，Wave
              才仍具备可投资性。任何一项失败，风险都可能从合规传导到客户摩擦，再快速传导到利润率压力。
