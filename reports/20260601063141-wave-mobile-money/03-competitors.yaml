- id: substitutes-status-quo-and-entrants
  title: Substitutes, status quo, and emerging entrants
  body: |-
    The biggest substitute to any wallet in West Africa is still not another wallet; it is the status quo. Airtel’s own annual report, citing the broader African payments context, says 60% of adults remain unbanked and 90% of payments are still made in cash. That makes cash a durable rival to every digital operator, including Wave, because cash has universal acceptance, no onboarding requirement, and decades of user habit behind it. Bank-linked transfers are a more formal substitute. GSMA reports bank-to-mobile transfers reached $127 billion in 2024, and BCEAO’s PI-SPI launch in WAEMU is intended to make cross-platform transfers between banks, wallets, and fintechs a baseline capability.

    The more strategic substitute is the account layer that sits above basic mobile money. Djamo is the clearest current example in Wave’s corridor: TechCrunch says it had more than one million customers across Côte d’Ivoire and Senegal by April 2025, and its own site now markets IBAN accounts, Visa cards, savings, investments, credit, and transfers to both banks and mobile money. Moov Money Côte d’Ivoire is a more direct local wallet rival, while Djamo is a “wallet-plus” entrant aimed at users who want the accessibility of mobile money without giving up bank-like tools. The direction of travel is clear: wallets are being pulled upward toward broader financial operating systems.
  claimRefs:
  - CP018
