tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / substitute
  - Category
  - Disclosed scale or funding
  - Target user / job
  - Primary differentiation
  - Key limitation for Wave comparison
  rows:
  - - Orange Money / Max it
    - Telco incumbent / direct
    - 39.7m active Orange Money customers (2024); ~3m Max it users in Côte d’Ivoire app copy
    - Mass-market wallet users, bills, merchant pay, telco customers
    - Large disclosed wallet base plus super-app breadth
    - Formula-based fees remain less transparent than Wave’s 1% promise
  - - MTN MoMo
    - Pan-African incumbent / direct benchmark
    - 69.5m monthly active users; $500.3bn fintech transaction value (FY2025)
    - Mass-market transfers, merchant pay, loans, bills
    - Scale, tariff depth, and telco-led distribution
    - Public surfaces are less simple than Wave and price retaliation is compressing margins
  - - Airtel Money
    - Pan-African incumbent / substitute benchmark
    - 54.1m current customers; 2.4m active agents; $196bn TPV (2025/26)
    - Transfers, merchants, savings, loans, IMT
    - Agent density and broad fintech product set
    - Less directly entrenched than Orange in Wave’s francophone core markets
  - - M-PESA / Safaricom
    - East Africa benchmark incumbent
    - Official tariff grid, merchant ecosystem, dedicated merchant app, high app-store signal
    - Merchants, consumer payments, savings / credit
    - Deep merchant and telco ecosystem depth
    - Geography is mainly East Africa rather than Wave’s core WAEMU markets
  - - Moov Money Côte d'Ivoire
    - Local direct wallet alternative
    - Official nationwide availability claim; transfers up to 1,500,000 FCFA
    - Côte d’Ivoire wallet users and bill pay
    - Local wallet availability and 24/7 access
    - Less disclosed scale than Orange, MTN, or Airtel
  - - Djamo
    - Emerging neobank / adjacent entrant
    - 1.5m users on official site; >1m users and $17m raise in Apr 2025 reporting
    - Users moving from wallet-only into account, card, savings, and credit use cases
    - Bank-account depth layered on top of mobile-money accessibility
    - Not optimized around cash-in/out agent economics like a wallet incumbent
  - - Bank transfers via PI-SPI
    - Formal substitute / bank-linked rail
    - Interoperable across banks, wallets, and fintechs from Sep 2025
    - Users and merchants who want account-to-wallet or account-to-account movement
    - Lower lock-in as cross-platform transfer becomes a baseline service
    - Still depends on account linkage and post-launch pricing transparency
  - - Cash
    - Status quo substitute
    - 90% of payments still made in cash in Africa per Airtel annual report context
    - Everyday low-trust or offline transactions
    - Universal acceptance and zero onboarding friction
    - No digital ledger, no remote transfer, and weaker monetizable attachment points
  - - Internal build / own stack
    - Merchant or fintech internal build
    - Shared rails plus interoperable transfers lower integration barriers
    - Merchants or fintechs that want their own front end over bank/wallet rails
    - Can own the customer relationship while outsourcing the rail
    - Requires product, compliance, and support capability outside a simple wallet deployment
  notes: Rows mix direct competitors, status-quo substitutes, and adjacent entrants because the buyer can solve the same money-movement job in multiple ways. Scale markers are taken from the exact reviewed sources and are not normalized to one date or geography.
