- id: pricing-and-product-breadth
  title: Pricing, packaging, and product breadth
  body: |-
    Wave’s low-fee promise is explicit and legible, which is part of the product advantage: the company markets one headline number rather than a complicated tariff ladder. Orange, MTN, and Safaricom present more layered packaging. Orange’s official Cameroon pricing still charges formula-based transfer and withdrawal fees while waiving merchant payments; MTN’s pricing surfaces are organized around multiple monetization buckets including send money, cash-out, merchant pay, and quick loans; Safaricom publishes a tiered tariff grid and extends M-PESA into merchant acceptance, request-money, and savings-and-credit flows. Airtel sits closer to the telco-super-app model as well, publicly emphasizing merchant payments, loans, savings, international transfers, and an expansive agent network.

    That breadth matters because it changes what “competition” means. If the buyer only needs low-cost domestic transfer, Wave looks strong. If the buyer also values bundled merchant acceptance, overdraft or credit access, salary receipt, bank transfers, or a broader operator relationship, the incumbent stacks become harder to displace. Orange’s Max it and Safaricom’s MySafaricom both show the logic: mobile money is not an isolated feature but one node inside a larger digital relationship. Djamo is the clearest adjacent entrant on the other side of the spectrum, pairing mobile-money accessibility with IBAN accounts, cards, savings, investments, and credit.
