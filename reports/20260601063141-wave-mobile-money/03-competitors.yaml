company:
  name: Wave Mobile Money
chapter:
  number: 3
  title: Competitors
  summary: Wave’s public edge is unusually simple low pricing, but Orange Money, MTN MoMo, Airtel Money, and M-PESA/Safaricom show much larger disclosed scale, broader product menus, and deeper ecosystem distribution. WAEMU interoperability plus 2025 fee retaliation mean transfer pricing is commoditizing, so Wave’s durable moat likely has to come from merchant depth and adjacent financial services rather than basic wallet fees alone.
sections:
- id: competitive-landscape
  title: Competitive landscape and direct alternatives
  body: |-
    Wave’s direct edge is unusually simple: its public surfaces still anchor on free cash-in, free cash-out, free bill pay, and a 1% send-money fee. That is a compelling consumer proposition for the core low-value transfer job. But the competitive set is much broader than one other wallet app. Orange Money, MTN MoMo, Airtel Money, and M-PESA/Safaricom all pair wallet functionality with larger disclosed user bases, richer adjacent services, and distribution systems that were built by telecom incumbents rather than by a standalone fintech. In Côte d’Ivoire specifically, Moov Money remains another local mobile-wallet option, while cash and bank-linked transfers still matter because they remain familiar, widely available, and increasingly interoperable.

    The key implication is that Wave is not competing in a blank space. It is competing against deep telco ecosystems, against cash as the default habit, and against financial-app layers that sit above the wallet itself. Even before looking at adverse evidence, the disclosed scale markers are lopsided: Orange reported 39.7 million active Orange Money customers, MTN reported 69.5 million monthly active MoMo users, and Airtel’s current mobile-money page says it serves 54.1 million customers and 2.4 million active agents. Wave’s reviewed consumer surfaces did not publish equivalent scale metrics, which means its public differentiation is easier to frame around price and convenience than around network depth.
  claimRefs:
