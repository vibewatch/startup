- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Wave moat claim
  - Threat or adverse evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Low-fee transfer leadership
    - MTN and Orange have already copied low-fee tactics in relevant markets
    - High
    - Request current country-by-country tariff decks and validate whether Wave still has a net all-in advantage after 2025 fee moves
  - - Closed-loop customer retention
    - PI-SPI interoperability removes single-platform lock-in and cross-platform fee friction
    - High
    - Measure how much usage survives once transfer rails are commoditized and users can keep their preferred front end
  - - Consumer adoption via simple product
    - Incumbents pair wallets with merchant pay, savings, loans, and broader telco super-apps
    - High
    - Test whether Wave has enough adjacent-product depth to retain higher-value users and merchants
  - - Urban merchant acceptance momentum
    - Cash still dominates many everyday payments and merchants can also choose bank-linked stacks
    - Medium
    - Quantify merchant share, recurring transaction density, and the ratio of digital vs cash checkout by market
  - - Fintech challenger narrative
    - Djamo and similar entrants target users graduating from wallets into accounts, cards, and credit
    - Medium
    - Track salary-receipt, savings, and credit attachment on Wave vs. adjacent entrants
  - - Regulatory adaptation
    - Wave pursued a banking license after regulatory and pricing pressure intensified
    - High
    - Clarify whether bank-licence strategy is defensive, offensive, or both, and what economics it is meant to fix
  notes: 'Severity is a competitive-underwriting view: High means the issue can shrink Wave’s differentiation without any product failure by Wave itself; Medium means it matters but is still execution-dependent.'
