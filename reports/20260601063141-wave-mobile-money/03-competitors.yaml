  evidenceGaps:
  - type: missing-source
    severity: material
    topic: wave-public-scale-disclosure
    missingEvidence: Current market-by-market Wave active-user, active-agent, and merchant-acceptance disclosures.
    whyItMatters: Without a disclosed scale baseline, it is difficult to benchmark whether Wave’s pricing edge is translating into durable distribution power versus telco incumbents.
    diligencePath: Request internal KPI snapshots by market or locate audited investor / lender materials that disclose active users, active agents, and merchant acceptance density.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP001
  - type: stale
    severity: material
    topic: post-pi-spi-pricing
    missingEvidence: Official provider-by-provider post-PI-SPI retail transfer pricing for banks and fintechs in Senegal and Côte d’Ivoire.
    whyItMatters: The interoperability thesis is central to Wave’s moat durability, but user-visible pricing after launch is not yet consistently disclosed in one official source pack.
    diligencePath: Re-run country-specific pricing checks on bank, wallet, and fintech transfer pages after more providers publish post-launch PI-SPI tariff schedules.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: multi-homing-and-churn
    missingEvidence: Customer multi-homing, churn, and merchant routing-share data after the 2025 fee changes.
    whyItMatters: Switching-cost analysis is ultimately about observed behavior, not product menus, and the public record does not show whether users actually move volume when fee gaps narrow.
    diligencePath: Obtain internal cohort retention data, merchant routing mix, or panel / processor data showing share shifts between Wave, Orange, MTN, and cash after the price-war period.
    relatedQuestionRefs:
    - QP029
    relatedTableRefs:
    - TP004
