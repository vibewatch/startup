- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor / substitute
  - Observed pricing or packaging cue
  - What is included
  - Key unknown or caveat
  - Implication for Wave
  rows:
  - - Wave
    - 1% send fee; deposits, withdrawals, bill pay free
    - Core domestic wallet actions and bills
    - Reviewed public surfaces do not disclose a matching active-user or agent count
    - Best public consumer price story, but moat depends on sustaining it
  - - Orange Money
    - 54 CFAF up to 10,000 CFAF transfer; 0.5% + 4 CFAF in main transfer band; merchant pay free; withdrawals priced separately
    - Wallet transfer, withdrawal, merchant payments, bills
    - Official pricing example is Cameroon, not a one-for-one Côte d’Ivoire or Senegal tariff
    - Less transparent than Wave’s single headline fee, but broad packaging reduces pure price comparison
  - - MTN MoMo
    - Official tariff menus for send money, cash-out, merchant pay, and loans; 2025 local reporting says some Côte d’Ivoire withdrawal fees were removed
    - Transfers, merchant pay, quick loans, cash-out
    - Generic pricing page does not disclose one cross-market tariff table
    - MTN can selectively copy low-fee tactics without abandoning a broader monetization stack
  - - M-PESA / Safaricom
    - Official rates page uses a tiered tariff grid rather than a flat-fee promise
    - Transfers, merchant pay, request money, savings / credit
    - The exact consumer grid is market-specific to Kenya
    - Shows how a richer ecosystem can coexist with a more complex price card
  - - Djamo / bank-like substitute
    - Free account positioning and low visible fees rather than wallet-transfer headline pricing
    - IBAN account, Visa card, savings, investments, credit, transfers to banks and mobile money
    - Not a cash-in/cash-out equivalent to Wave on every corridor
    - Competes above the wallet by bundling “grow your money” tools
  - - Bank transfers via PI-SPI
    - No extra inter-platform transfer fees after WAEMU interoperability launch
    - Cross-platform account, wallet, and fintech transfers
    - Post-launch end-user bank pricing is still not consistently disclosed by provider and market
    - Turns bank-linked movement into a cleaner substitute for basic wallet-to-wallet routing
  notes: Pricing rows mix exact tariffs, packaging cues, and system-level changes because disclosed competitor pricing is inconsistent across countries. The table focuses on what a user can actually infer from reviewed official surfaces plus 2025 interoperability reporting.
