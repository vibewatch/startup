  claimRefs:
  - CP032
  - CP033
- calloutType: insight
  title: Incumbent strength is breadth plus distribution
  body: Orange, MTN, Airtel, and Safaricom all pair wallet functionality with disclosed scale, broader service menus, and telco-driven distribution or merchant ecosystems. Wave’s best public edge is simpler pricing, not broader public product disclosure.
  claimRefs:
  - CP005
  - CP011
  - CP016
  - CP019
  - CP040
- calloutType: assumption
  title: Future moat has to move above transfer rails
  body: If PI-SPI interoperability and telco fee matching continue, durable differentiation shifts toward merchant acceptance, stored value, salary inflows, savings, and credit rather than basic peer-to-peer transfer fees.
