callouts:
- calloutType: strength
  title: Clear public pricing, opaque realized economics
  body: Wave is unusually transparent on list pricing and unusually opaque on realized monetization. That combination is helpful for understanding customer acquisition, but not enough for underwriting margin durability.
  claimRefs:
  - CI001
  - CI003
  - CI006
  - CI056
- calloutType: risk
  title: Uganda is the clearest adverse financial datapoint
  body: Publicly reported 2024 Uganda losses show that a free cash-access model can still consume capital when the company lacks density or faces entrenched incumbents.
  claimRefs:
  - CI046
  - CI048
  - CI049
  - CI050
- calloutType: assumption
  title: Forward financing dependency is plausible, not measurable
  body: The 2025 debt raise and large user base support a positive capital story, but absent cash, burn, and debt-service disclosures there is no auditable runway calculation.
  claimRefs:
  - CI011
  - CI013
  - CI019
  - CI057
