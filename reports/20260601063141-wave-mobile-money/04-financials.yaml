- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Consumer transfer take rate
    - 1% list fee
    - High
    - Base revenue lever is transparent even if realized take is not.
    - Provide realized net transfer revenue after refunds and promotions.
  - - Verified public MAU scale
    - 20m+ in June 2025; 23m+ in May 2026 profile
    - Medium
    - Shows large usage base and potential revenue throughput.
    - Monthly active users by country and by product line.
  - - Merchant / active payer proxy
    - 10m+ active payers and 2m+ merchants in 2026 profile
    - Medium
    - Strong monetization potential if merchant economics are positive.
    - Merchant TPV, payer conversion, and active-merchant retention.
  - - Agent network scale
    - 150k+ agents in 2025 lender releases
    - High
    - Distribution density is necessary for free cash access.
    - Active vs inactive agent counts, average transactions per agent, and commission schedule.
  - - Agent commission burden
    - GSMA says commissions were 41% of provider income in 2024 after falling from 45%
    - Medium
    - Indicates why low consumer fees can still coexist with heavy distribution cost.
    - Actual Wave commission-to-revenue ratio by market.
  - - Float / working-capital need
    - Sector guidance says agents may need financing to maintain cash and e-float
    - Medium
    - Cash-access promises are only credible if agents remain liquid.
    - Wave agent float financing tools, settlement lag, and failed-CICO rates.
  - - Public profitability benchmark
    - Uganda 2024 revenue UGX 14.68bn vs net loss UGX 14.33bn
    - High
    - Demonstrates that scale without density or favorable mix may still be loss-making.
    - Country-level P&L for core markets and expansion markets.
  - - Group gross / contribution margin
    - null
    - Low
    - Core underwriting metric remains absent.
    - Gross margin, contribution margin, and product-level unit economics by send / merchant / bill-pay.
  notes: Null fields mark private metrics that are essential for underwriting but not available publicly.
