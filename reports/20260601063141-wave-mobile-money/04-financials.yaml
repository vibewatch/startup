- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public proxy
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Consolidated group revenue
    - No public revenue; Senegal taxes and large user counts are only proxies
    - Cannot size current scale or valuation support
    - Request audited group income statement and management revenue bridge by product and country.
  - - Transaction value by market
    - WAEMU and sector data exist, but not Wave group TPV
    - Cannot convert user scale into monetized throughput
    - Request monthly TPV, send count, and bill-pay / merchant split by country.
  - - Gross margin and contribution margin
    - Sector commission benchmarks and Uganda losses imply pressure but not margin
    - Cannot assess operating leverage or moat
    - Request product-level gross margin after agent commissions, support, fraud, and partner fees.
  - - Monthly burn, cash, and runway
    - June 2025 debt raise shows liquidity access, not remaining cash
    - Runway and financing dependency remain speculative
    - Request monthly burn, ending cash, debt-service schedule, and base / downside runway.
  - - Agent commission schedule
    - GSMA and BCEAO only provide sector averages and pressure signals
    - Cannot underwrite field-level economics or churn risk
    - Request commission tables, active / inactive agent split, and average GP per agent.
  - - Merchant and biller monetization split
    - Wave advertises free user bill pay and low-cost merchant acceptance
    - Revenue quality could be stronger than retail pricing suggests, but it is invisible publicly
    - Request merchant MDR, biller commissions, payout fees, and volume by use case.
  - - Country-level profitability
    - Uganda loss disclosures show one stressed market only
    - Cannot tell whether Senegal / Côte d'Ivoire subsidize expansion or vice versa
    - Request country P&L and maturity cohort curves.
  - - Debt terms and covenants
    - Round size and lenders are public; loan economics are not
    - Cannot assess refinancing risk or fixed-charge coverage
    - Request facility agreement summary, collateral package, covenants, and drawdown schedule.
  notes: These are the missing inputs that prevent a high-confidence underwriting view despite strong public adoption signals.
