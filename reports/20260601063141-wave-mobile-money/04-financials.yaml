company:
  name: Wave Mobile Money
chapter:
  number: 4
  title: Financials
  summary: Wave's public financial story is strongest on pricing and adoption, not on disclosed income statement depth. Official and lender-backed sources confirm a 1% transfer-led model, free cash access, 20 million plus monthly active users, and a June 2025 debt facility of about $137 million, but they do not disclose group revenue, margins, burn, or runway. Uganda's 2024 losses show the model can still consume capital in harder markets, so capital adequacy remains a directional judgment rather than a fully underwritten one.
sections:
- id: revenue-model-pricing
  title: Revenue model and list pricing
  body: 'Wave''s public pricing is unusually explicit for a private African fintech: the core consumer wallet still advertises free deposits, free withdrawals, free bill payments, and a flat 1% fee to send money. That means the most visible monetization lever is the transfer fee itself, not access to cash. Business surfaces add nuance. Wave Business advertises 1% bulk payouts and a merchant acceptance model where the first 20,000 CFA of in-person payments each day are free and incremental volume is charged at 1%. TechCabal also reports that Wave passes bill-payment fees to businesses rather than to end users. Together, these disclosures imply a deliberate two-sided model: Wave subsidizes consumer cash access and low-income usage, then tries to recover economics from transfer volume, business disbursements, merchant acceptance, and biller partnerships. The core underwriting issue is not list pricing clarity; it is the absence of realized take-rate, merchant discount revenue, and biller economics
    after subsidies and distribution costs.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-proxies
  title: Public traction proxies and monetization scale
  body: 'Wave provides strong public adoption signals even though it withholds consolidated financial statements. June 2025 lender releases and TechCabal coverage described more than 20 million monthly active users, over 150,000 agents, more than 3,000 employees, and operations in eight markets. A May 2026 profile suggested further growth beyond that 20 million-plus baseline while also citing more than 10 million active payers and over 2 million merchants. Official app-store listings verify at least six named markets in 2026 and confirm that the app is still actively maintained. These are meaningful demand proxies: Wave appears to have built very large throughput for a low-fee product, and the business page says merchants can accept payments from tens of millions of users. But the proxies remain just that. There is still no public disclosure of group revenue, transaction value by market, merchant payment volume, or monetized bill-pay volume, so traction cannot be translated into revenue
    quality with any precision.'
  claimRefs:
  - CI004
  - CI005
  - CI014
  - CI015
