- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Matrix showing why Wave is not capex-heavy like a hardware business but is still capital-intensive through working capital, agent liquidity, compliance, and expansion losses.
  approximationNotes: This is a qualitative capital-intensity map because Wave does not publish a cash-flow statement or debt schedule.
  data:
    columns:
    - Public signal
    - Cash implication
    - Underwriting readout
    rows:
    - id: debt-facility
      label: Debt facility
      values:
      - June 2025 €117m / about $137m debt raise
      - Provides near-term liquidity but also adds financing obligations
      - Positive for near-term adequacy, insufficient for runway by itself
    - id: working-capital
      label: Working capital use
      values:
      - Management explicitly said proceeds support working capital
      - Wallet, payout, and settlement flows tie up operating liquidity
      - Growth is still consuming cash even if hard capex is low
    - id: agent-float
      label: Agent float
      values:
      - GSMA, World Bank, and Airtel all describe float as a real requirement
      - Providers may need to finance agent cash and e-float balances
      - Distribution promises can consume capital before margin is realized
    - id: licensing
      label: Licensing and compliance
      values:
      - BCEAO licensing and payment-system controls are visible
      - Regulatory durability comes with compliance and safeguarding overhead
      - Licensed scale is more durable, but not costless
    - id: expansion-losses
      label: Expansion-market losses
      values:
      - Uganda 2024 revenue was below net loss
      - New markets can remain loss-making before they reach density
      - Expansion can extend the period of external financing need
    - id: runway-gap
      label: Runway visibility
      values:
      - Cash, burn, and debt terms remain undisclosed
      - Capital adequacy cannot be converted into months of runway
      - Forward financing dependency remains inferential
