  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: group-revenue-disclosure
    missingEvidence: Audited consolidated revenue, transaction value, and product mix by country and use case.
    whyItMatters: Without revenue and TPV, public traction cannot be translated into underwriting scale or valuation support.
    diligencePath: Request the latest audited group P&L plus a monthly revenue / TPV bridge by country, product, and customer segment.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway-disclosure
    missingEvidence: Cash balance, monthly burn, debt-service obligations, and management runway view after the 2025 debt raise.
    whyItMatters: Capital adequacy and forward financing dependency cannot be measured without runway inputs.
    diligencePath: Request monthly cash flow, debt schedule, covenant package, and base / downside runway model from finance leadership.
    relatedQuestionRefs:
    - QI014
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-disclosure
    missingEvidence: Gross margin, contribution margin, agent commission schedule, merchant discount rate, and biller revenue share.
    whyItMatters: Wave's pricing strategy can only be judged properly if the hidden distribution and partner costs are visible.
    diligencePath: Request unit economics by product and market, including commission burden, fraud losses, support cost, and net take.
    relatedQuestionRefs:
    - QI015
    - QI019
    - QI020
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: footprint-and-network-counts
    missingEvidence: A reconciled current-country list plus active agents, active payers, and merchants using one reporting date and one definition set.
    whyItMatters: Current footprint and network density are critical inputs for evaluating revenue quality and expansion readiness.
    diligencePath: Request the latest board pack or KPI dashboard that reconciles countries, agents, merchants, and monthly active users.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: uganda-audited-statements
    missingEvidence: Direct access to the full audited 2024 Uganda financial statements rather than secondary reporting on the summary figures.
    whyItMatters: A full statement set would clarify whether losses were driven by commissions, fraud, staff cost, depreciation, or market-entry spend.
    diligencePath: Obtain the full audited Wave Transfer Uganda financial statements and management commentary.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: merchant-biller-economics
    missingEvidence: Merchant acquiring and bill-pay revenue split, fee waivers, take-rate realization, and retention by merchant cohort.
    whyItMatters: Business-side monetization is the most plausible answer to the free-user model, yet it is still economically invisible.
    diligencePath: Request merchant and biller revenue by product, plus free-threshold utilization and churn for in-person acceptance.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
