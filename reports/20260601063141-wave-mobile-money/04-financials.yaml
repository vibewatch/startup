  - Diligence ask
  rows:
  - - Consumer P2P transfers
    - Flat fee charged when one wallet user sends money to another.
    - 1% of send value
    - Live in 2026 on official consumer surfaces.
    - High visibility on list price; realized net take still unknown.
    - Monthly transfer volume, refunds, and realized take rate after promotions.
  - - Business bulk payouts
    - Businesses send payroll or disbursements through Wave Business.
    - 1% to sender; recipient free
    - Publicly advertised as of 2026.
    - Useful monetization lever but no disclosed volume.
    - Gross payout volume and share of business revenue mix.
  - - Merchant acceptance / in-person payments
    - Merchants accept customer wallet payments in person.
    - 0 on first CFA 20k daily, then 1%
    - Publicly advertised for Wave Business.
    - Suggests monetization from merchants after a free threshold.
    - Merchant TPV, free-threshold usage, and realized merchant discount rate.
  - - Bill payments
    - Consumers pay utilities or bills through the app.
    - Free to user
    - Publicly available in consumer app and official site.
    - Revenue likely sits with business-side arrangements, not consumer fees.
    - Biller commission schedule and monthly bill-pay volume.
  - - Collections / outlet cash management
    - Businesses deposit cash through agents and monitor flows in the portal.
    - Undisclosed
    - Product is live but pricing is not public.
    - Potential enterprise revenue stream with opaque economics.
    - Collections fee schedule, cash-management volume, and support cost.
  notes: List pricing is observable, but realized revenue mix and net take are not publicly disclosed.
