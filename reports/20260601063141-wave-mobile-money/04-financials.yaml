- id: agent-economics-unit-economics
  title: Agent economics and unit-economics inference
  body: 'Wave''s model is structurally agent-intensive even though the customer experience is app first. The product needs dense cash-in and cash-out coverage, onboarding, local support, and distribution liquidity to keep the promise of free deposits and withdrawals credible. Sector evidence makes clear that this is where the hidden cost stack lives. GSMA reports that customer fees are still the main revenue source for around 80% of mobile money providers and that agent commissions remain a large income share, even after declining from 45% to 41% of provider income. Separate GSMA agent-sustainability research warns that active agent counts have been growing faster than cash-in and cash-out value, reducing average agent economics, while lower withdrawal fees compress both agent commissions and provider margins. World Bank deployment guidance goes further: providers may need to lend agents money just to maintain electronic float and cash on hand. Listed comps underline the same pattern. Airtel
    Money and MTN disclose enormous scale, but they also show that millions of agents, float access, and merchant-network optimization remain core operating tasks. For Wave, that means the 1% send fee can only be understood against a cost base that public sources do not quantify.'
