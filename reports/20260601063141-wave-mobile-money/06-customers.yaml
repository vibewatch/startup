callouts:
- calloutType: strength
  title: Retail and SMB adoption is already real, not merely aspirational
  body: 'The public customer ledger is strong enough to show a live two-layer franchise: a very large consumer wallet business and a meaningful SMB payments business. Official Wave Business disclosures alone publish 500,000+ monthly business payment recipients, 1 million+ active API users, and 100,000+ active in-person merchants, while the lender/news stack keeps retail MAU above 20 million.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU012
  - CU027
- calloutType: risk
  title: Proof quality drops above the testimonial and app-store layer
  body: Wave can prove real use, but it cannot publicly prove much customer durability at enterprise depth. The retained set shows named testimonials, public ratings, and review complaints, yet it still lacks NRR, churn, country-level concentration, named enterprise logos, and a public biller directory.
  claimRefs:
  - CU003
  - CU004
  - CU037
  - CU038
  - CU039
- calloutType: risk
  title: Channel density matters as much as price when Wave enters harder markets
  body: The adverse evidence from Uganda and the Gambia argues that low fees alone do not guarantee durable customer expansion. Wave still depends on agents, localized onboarding, and smooth merchant activation; where those channels are weaker than incumbent networks, the model can remain subscale or loss-making even when the value proposition is attractive.
  claimRefs:
  - CU028
  - CU032
  - CU035
  - CU036
  - CU041
  - CU042
