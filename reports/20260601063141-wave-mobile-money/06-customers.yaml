- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / channel risk
  - Impact
  - Diligence path
  rows:
  - - Merchant acceptance via QR cards and business app
    - Merchant onboarding may be uneven across markets, as shown by the Gambia signup complaint
    - Can slow B2B rollout and weaken merchant-density flywheels outside core markets
    - Request merchant onboarding funnel, activation rate, and blocked-market causes by country
  - - Large agent network
    - 150K+ agents are a strength but create heavy dependence on cash liquidity, training, and field execution
    - Customer experience can deteriorate if agents lack float or operational discipline
    - Request active-agent share, liquidity incidents, and customer complaints tied to agents
  - - Low-fee consumer acquisition
    - Uganda losses show price alone may not overcome incumbent brand and distribution advantages
    - Expansion returns can vary materially by market even when the pricing thesis is intact
    - Request country-level unit economics, MAU, TPV, and payback by market
  - - Regional mobile-money tailwind
    - Wave does not disclose market-by-market user or revenue mix
    - The company could still be more concentrated in Senegal and Côte d’Ivoire than public narratives imply
    - Request MAU, TPV, revenue, and contribution margin split by country
  - - API and merchant-product growth
    - No named enterprise customer logos or public biller directory were retained
    - Hard to verify whether large accounts are durable or merely available product features
    - Request top 20 merchants, top billers, API accounts, and contract / usage concentration
  - - Localized support and assisted onboarding
    - Support lines prove local operations exist but do not prove fast or high-quality resolution
    - Service cost and customer satisfaction could be weaker than rating averages imply
    - Request CSAT, complaint volume, first-response time, and resolution time by market
  notes: The largest concentration unknown is not a single named customer but the unreported mix of users, merchants, and economics by country and product. The Uganda evidence shows why that gap matters.
