- id: adoption-trajectory-and-proof
  title: Adoption trajectory is well supported for retail scale and directionally supported for merchant expansion
  body: 'The adoption trajectory is credible because multiple independent 2025 lender and media sources converge around the same scale markers, and 2026 app-store surfaces show the product is still actively updated and widely used. TechCabal, Finnfund, and Norfund all place Wave above 20 million monthly active users and above 150,000 agents by June 2025, which remains the best-corroborated public operating snapshot. The 2026 consumer app surfaces then add another layer of evidence: Google Play shows 50 million-plus downloads and roughly 330,000 reviews, while AppBrain estimates 56 million cumulative downloads and 1.3 million downloads in the last 30 days. Those figures do not translate cleanly into retained users, but they do show continued top-of-funnel relevance rather than a stagnant installed base. Business evidence is narrower but still meaningful. Wave Business discloses 500,000+ monthly business payment recipients, 1 million+ active API users, and 100,000+ active in-person merchants,
    while the merchant-facing Android app itself shows 5 million-plus downloads and roughly 8,400 reviews. Named proof remains light, however. Most public proof is still testimonial or review level, not formal customer-case-study or biller-directory level, so the chapter should treat merchant expansion as real but under-documented.'
