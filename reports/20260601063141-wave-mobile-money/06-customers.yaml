  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer cohort tables showing NRR, GRR, churn, dormancy, reactivation, and merchant renewal by country and segment.
    whyItMatters: Ratings and testimonials show satisfaction, but investment-grade durability requires actual retention metrics rather than review proxies.
    diligencePath: Request consumer and merchant cohort dashboards plus definitions for active users, retained users, churned users, and reactivated users.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-and-country-mix
    missingEvidence: Market-level MAU, TPV, revenue, and contribution margin splits plus any top-customer or top-biller concentration measures.
    whyItMatters: Without a country or account mix, investors cannot tell whether Wave is broadly diversified or still heavily concentrated in a few core West African markets.
    diligencePath: Request monthly operating metrics by market and a concentration schedule covering the top merchants, billers, and country P&Ls.
    relatedQuestionRefs:
    - QU017
    - QU026
    relatedTableRefs:
    - TU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: A public or NDA-backed customer list naming major merchants, billers, API customers, and the size or maturity of each deployment.
    whyItMatters: Current named proof is mainly testimonial and review based, which proves use but not durable enterprise adoption or concentration risk.
    diligencePath: Request the top merchant and biller roster, top API accounts, deployment dates, volumes, and whether each account is pilot or production.
    relatedQuestionRefs:
    - QU018
    - QU026
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: material
    topic: scale-reconciliation
    missingEvidence: A reconciled KPI glossary covering monthly active users, active payers, merchants, agents, and country counts across 2025/2026 disclosures.
    whyItMatters: Public sources point in the same growth direction but do not use fully comparable definitions, which limits precision in adoption and concentration analysis.
    diligencePath: Request the current board or lender KPI sheet with exact metric definitions and a like-for-like bridge from 2025 disclosures to 2026 profile numbers.
    relatedQuestionRefs:
    - QU011
    - QU025
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: minor
    topic: merchant-onboarding-funnel
    missingEvidence: Country-level merchant onboarding funnel data showing applications, approvals, activations, and blocked signups.
    whyItMatters: A single Gambia complaint is not enough to size the problem, but it is enough to justify checking whether Wave Business rollout quality is uneven by market.
    diligencePath: Request merchant onboarding and activation funnels by country plus the backlog, error rates, and turnaround times for merchant signup issues.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU006
