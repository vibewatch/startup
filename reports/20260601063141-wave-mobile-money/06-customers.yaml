- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Core use case
  - Scale / proxy
  - Revenue / strategic value
  - Gap
  rows:
  - - Retail wallet users
    - Individual users and recipients
    - Cash in/out, P2P transfers, bill pay, airtime
    - 20M+ MAU; 50M+ Android downloads
    - Core volume and brand engine
    - Country-level MAU and revenue mix are undisclosed
  - - Bill-pay users
    - Households paying utilities and recurring bills
    - Woyofal and other bill payments inside the app
    - Official testimonial plus bill-pay positioning across app stores
    - Creates repeat frequency beyond one-off transfers
    - No public biller directory or bill-pay volume split
  - - Family remitters
    - Household senders and family recipients
    - Domestic transfers at a flat 1% fee
    - Firmin testimonial; positive review references to frequent sending
    - Habit-forming consumer behavior and referral loop
    - No public cohort or repeat-frequency disclosure
  - - Informal merchants and market sellers
    - Merchant owner or cashier
    - In-person acceptance via QR cards and business app receipts
    - 100K+ active in-person merchants; 5M+ business-app downloads
    - Expands acceptance network and merchant density
    - No merchant GMV, churn, or take-rate disclosure
  - - SMB employers and distributors
    - Business operator or finance/admin staff
    - Bulk payouts, payroll, and cash collection
    - 500K+ monthly business payment recipients
    - B2B payment volume broadens beyond consumer P2P
    - No ARPU, retention, or market split by recipient type
  - - API and checkout businesses
    - Merchant developer or operations team
    - Online checkout and programmable payment flows
    - 1M+ active API users
    - Potentially higher-value, stickier merchant integrations
    - No named public API customers or integration case studies
  notes: Rows combine official Wave Business disclosures with current consumer-app surfaces. Scale proxies are mixed across consumer and business layers, so they show breadth of customer segments rather than a like-for-like revenue stack.
