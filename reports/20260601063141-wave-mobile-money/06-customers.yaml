company:
  name: Wave Mobile Money
chapter:
  number: 6
  title: Customers
  summary: 'Wave’s customer proof is strongest at the mass-market consumer and SMB layer: June 2025 lender and news sources still place the network above 20 million monthly active users and 150,000 agents, while current Wave Business surfaces disclose 500,000+ monthly business payment recipients, 1 million+ active API users, and 100,000+ active in-person merchants. Customer satisfaction proxies are also real but mostly app-store and testimonial based, including roughly 330k Google Play reviews, 91k Senegal App Store ratings, Aita’s Woyofal bill-pay quote, and Firmin’s repeat family-transfer quote. The main open risk is durability outside core markets: Wave does not disclose retention or concentration data, and Uganda losses plus a Gambia merchant-signup complaint show that low-fee growth still depends on dense agent execution and market-by-market channel conditions.'
sections:
- id: retail-and-smb-segments
  title: Retail wallet users and SMB payment customers are both visible in the public record
  body: 'Wave’s retained 2025/2026 customer evidence is strongest where the company serves everyday consumers and smaller businesses, not where it would need to prove large named enterprise accounts. Current consumer surfaces consistently show the same retail jobs to be done: deposit and withdraw cash through agents, send money for a flat 1%, pay bills without fees, buy airtime, and call a local toll-free support line. Those same app surfaces jointly name Burkina Faso, Côte d’Ivoire, The Gambia, Mali, Niger, Senegal, Sierra Leone, and Uganda, which makes the current retail footprint much clearer than the higher-level country counts seen in some financing or profile coverage. The quality of proof also matters. Wave’s homepage includes named customer testimonials from Aita, who says she pays Woyofal without traveling, and Firmin, who says he now sends money to family only with Wave. On the business side, Wave Business goes beyond generic “merchant” language and publishes three concrete adoption markers—500,000+
    monthly business payment recipients, 1,000,000+ active API users, and 100,000+ active in-person merchants—plus specific workflows in payroll, collections, checkout, QR-card acceptance, and remote payment links. That is enough to conclude that customer breadth extends well beyond P2P remittance, even if large named logos remain undisclosed.'
