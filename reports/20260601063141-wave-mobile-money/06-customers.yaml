- id: TU005
  title: Complaint and service-quality proxy table
  columns:
  - Signal
  - Source / named user
  - Observation
  - Risk implication
  - Mitigant / next diligence step
  rows:
  - - Bank-link security concern
    - Kevin Simpore on Google Play
    - Wants a second security layer for bank transactions
    - Trust and fraud controls may lag user expectations when bank rails are involved
    - Review step-up authentication, fraud loss rate, and chargeback / reversal flows
  - - Transfer note request
    - KB CA on Google Play
    - Asks for a comment field during transfers or payouts
    - Weak payment metadata can reduce usefulness for consumer and SMB record-keeping
    - Request roadmap status for transfer memo fields
  - - E-receipts request
    - MmeNdiouck on JustUseApp
    - Asks for e-receipts when paying bills or sending money
    - Receipts and audit trails matter for trust and merchant / bill-pay adoption
    - Request current receipt architecture and product roadmap
  - - App-opening reliability issue
    - MmeNdiouck on JustUseApp
    - Says the application cannot be opened for a period of time
    - Service-quality interruptions can harm repeat use even when pricing remains strong
    - Request crash-free sessions, uptime, and support-ticket resolution metrics
  - - Merchant signup friction
    - Joel Kamara on Wave Business
    - Reports The Gambia merchant signup has been unavailable for more than a year
    - B2B expansion may be uneven by market even if core retail adoption is strong
    - Request merchant onboarding funnel by country and backlog by market
  - - Localized support footprint
    - Official and app-store surfaces
    - Toll-free support lines are published for Burkina Faso, Côte d’Ivoire, The Gambia, Mali, Senegal, and Uganda
    - Local support is a real mitigation, but public sources do not show CSAT or resolution speed
    - Request first-response time, resolution time, and complaint volumes by country
  notes: This table treats public reviews as service-quality proxies, not as representative survey data. It is useful for identifying recurring product or operations themes that deserve diligence follow-up.
  claimRefs:
