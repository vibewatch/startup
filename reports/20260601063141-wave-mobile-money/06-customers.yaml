figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Wave’s customer journey starts with a fee-led value proposition, moves through agent-assisted onboarding, and then expands into repeat payments, bill pay, and merchant workflows.
  data:
    items:
    - label: Discovery
      description: Users hear the core promise—free deposits and withdrawals, free bill pay, and 1% transfers—through local brand presence, referrals, and app-store discovery.
    - label: Cash onboarding
      description: Customers or merchants activate through an agent, QR card, or app download, with local support numbers available when they need help.
    - label: First transaction
      description: Typical first actions are sending money, paying a bill such as Woyofal, or buying airtime inside the wallet.
    - label: Repeat use
      description: Habit forms around family transfers, recurring bills, and safe cash storage; ratings and named reviews act as the public proxy for satisfaction.
    - label: Merchant and payroll adoption
      description: Businesses use QR acceptance, payout tools, collections, and remote payment links, moving Wave beyond purely consumer P2P activity.
    - label: Trust / service loop
      description: Customer support, receipts, security expectations, and onboarding reliability determine whether the low-fee promise compounds into durable usage.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU009
  - CU032
  - CU042
