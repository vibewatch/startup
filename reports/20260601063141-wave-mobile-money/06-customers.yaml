- id: expansion-durability-and-channel-risk
  title: Expansion potential is clear, but durability still depends on channels, country mix, and market-specific execution
  body: 'Wave’s customer story should not be read as “20 million users therefore low risk.” The evidence shows clear expansion vectors—merchant acceptance, bulk payouts, bill pay, API checkout, and the broader West African mobile-money tailwind documented by GSMA—but it also shows that channel quality matters as much as headline pricing. Wave’s model is still heavily agent-assisted: official, profile, and industry sources all point back to large cash-in/cash-out networks, QR cards, field onboarding, and customer-support lines as core adoption mechanisms. That can be a strength in cash-heavy markets, but it also creates liquidity, training, and service-quality dependence. The hardest negative proof comes from Uganda, where two April 2025 reports say the local business widened losses even as revenue grew, because incumbents like MTN and Airtel retained stronger distribution and brand positions. A separate 2026 Wave Business review from The Gambia says merchant signup has been unavailable for
    more than a year, which is a small but concrete signal that B2B rollout is not equally smooth in every market. Meanwhile, Wave still does not disclose country-level revenue mix, top-customer exposure, or a named enterprise-customer list, so concentration risk remains analytically important but publicly unquantified.'
