            body: >-
              Wave provides strong public adoption signals even though it withholds consolidated financial statements.
              June 2025 lender releases and TechCabal coverage described more than 20 million monthly active users, over
              150,000 agents, more than 3,000 employees, and operations in eight markets. A May 2026 profile suggested
              further growth beyond that 20 million-plus baseline while also citing more than 10 million active payers
              and over 2 million merchants. Official app-store listings verify at least six named markets in 2026 and
