      - number: '4.5'
        title: Profitability risk, forward financing dependency, and verdict
        blocks:
          - type: paragraph
            body: >-
              The most concrete adverse financial evidence is not from the core Senegal market but from Uganda. Two
              local reports on Wave's 2024 Uganda results cite revenue of UGX 14.68 billion, operating loss of UGX 3.11
              billion, and net loss of UGX 14.33 billion, with an unmodified BDO East Africa audit opinion. Those same
              reports argue that free cash-in and cash-out plus a 1% transfer fee has not yet proven economically
              sustainable against MTN and Airtel, and they mention layoffs or retrenchment signals as the company
              conserved capital. This does not prove the group model is broken; it does show that Wave's low-fee
              strategy can require significant subsidy in harder expansion markets. Seneweb's claim that Wave paid more
              than FCFA 30 billion of taxes and statutory contributions in Senegal in 2024 is a positive scale proxy,
              but it still does not disclose revenue, margin, or cash generation. The financial verdict is therefore
              mixed: revenue quality looks promising because pricing and usage appear durable in core markets, but
              underwriting remains blocked by missing data on realized take rates, agent commissions, contribution
              margin, burn, and debt terms. Wave looks financeable as a scale platform, not yet underwritable as a
              transparent earnings model.
