      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public capital adequacy is easier to describe than to underwrite. Wave clearly raised a large
              working-capital facility in June 2025: EUR 117 million, or about $137 million, led by RMB with three
              development-finance institutions alongside it. Management and lenders framed the money as growth capital
              for working capital and expansion into both existing and new markets. The same sources still point back to
              the 2021 $200 million Series A at a $1.7 billion valuation, so a disclosed minimum of roughly $337 million
              of public capital is visible even before earlier seed capital or any later facilities. What is missing is
              everything an investor needs to turn that capital history into runway: there is no public cash balance,
              gross debt schedule, debt pricing, covenant package, debt-service burden, or monthly burn. BCEAO
              regulatory material confirms that Wave operates inside a heavily supervised e-money and payment-systems
              framework with licensing, guarantee-fund, and liquidity discipline, but that does not reveal whether
              group-level cash generation covers expansion. The result is a chapter where balance-sheet adequacy remains
              a directional judgment rather than a measurable one.
