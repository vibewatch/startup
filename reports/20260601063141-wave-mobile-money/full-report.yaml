  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure is the first-order risk
        blocks:
          - type: paragraph
            body: >-
              Wave is not operating in a single homogeneous market. Its Senegal entity, Wave Digital Finance, holds a
              BCEAO electronic-money license, but the 2025-2026 evidence base shows that regional expansion still
              depends on country-by-country approvals, payment-system access, and local supervisory sequencing.
              BCEAO-backed PI-SPI infrastructure is now the central rail for interoperable instant payments in WAEMU,
              and third-party reporting says banks, microfinance institutions, electronic-money issuers, and payment
              institutions must connect by June 30, 2026. That deadline matters because missing regional
              interoperability would directly weaken customer convenience and merchant utility. Cameroon is even more
              constrained: Wave's 2025 launch there sits under CBC and COBAC approval, excludes direct mobile-money
              issuance, and adds BEAC/GIMAC reporting and interconnection obligations. Uganda adds another regulator,
              with Wave's local terms expressly tying amendments to Bank of Uganda authorization. The legal layer is
              similarly non-trivial because Wave publicly acknowledges extensive KYC, personal-data, and
              complaint-handling obligations. Together, these facts make regulatory execution the clearest thesis-break
              category: Wave can scale only as fast as licenses, rails, and compliance approvals clear.
