        title: >-
          Satisfaction and repeat use are visible through ratings and named reviews, but formal retention data are
          absent
        blocks:
          - type: paragraph
            body: >-
              Wave has enough customer-facing evidence to support a favorable but incomplete read on satisfaction. The
              strongest public proxies are the review surfaces: Google Play rates the consumer app 4.5 with roughly
              330,000 reviews, the Senegal App Store page shows 4.4 with about 91,000 ratings, and Côte d’Ivoire,
              France, Burkina Faso, Mali, Uganda, and the U.S. all show positive ratings with very different local
              review counts. JustUseApp’s NLP-based summary is directionally positive as well, classifying 72.6% of
              3,355 combined reviews as positive and 27.3% as neutral. Named customer proof is more persuasive than
              logos here: Firmin’s official quote implies habitual family-transfer use, and independent reviewers
              describe Wave as convenient for day-to-day transfers, airtime purchases, and cash storage. But the same
              surfaces also expose the missing layer of rigor. Public sources do not disclose NRR, GRR, churn, renewal
              rates, or contract duration for any customer segment. Complaints also cluster around product quality
              rather than headline pricing—missing transfer-note fields, missing e-receipts, app-opening issues, and
              concerns about bank-link security. That mix suggests real satisfaction, real repeat use, and real room for
              product and trust improvement.
