  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      End-to-end operating flow from customer cash access into wallet usage, merchant/business payments, and exception
      handling.
    data:
      nodes:
        - id: cash-in
          label: Customer cash-in at agent
        - id: wallet
          label: Wave wallet balance
        - id: send-bill
          label: Send money / pay bills / buy airtime
        - id: merchant-business
          label: Merchant acceptance / business payout / collections
        - id: cash-out
          label: Recipient or customer cash-out at agent
        - id: support
          label: Support / complaints / exception handling
      edges:
        - from: cash-in
          to: wallet
          label: Free deposit establishes balance
        - from: wallet
          to: send-bill
          label: 1% send or free bill-pay / airtime actions
        - from: wallet
          to: merchant-business
          label: Customer payment or employer/business workflow
        - from: merchant-business
          to: cash-out
          label: Recipients without Wave can still pick up cash via agents
        - from: send-bill
          to: cash-out
          label: Funds can return to cash through agents
        - from: wallet
          to: support
          label: User needs help, reversal, or complaint handling
        - from: merchant-business
          to: support
          label: Operational issues escalate through support channels
    approximationNotes: >-
      The flow merges consumer and business branches because Wave publishes workflows separately but does not release
      one canonical operating diagram.
