      - number: '3.4'
        title: Moat durability, switching costs, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence does not say Wave’s model is broken; it says the moat is narrower than the headline
              fee promise suggests. WeeTracker reported that Wave pursued a banking license after the initial PI-SPI
              authorized list excluded Wave and MTN, while the same article said MTN removed withdrawal fees in Côte
              d’Ivoire and Orange Cameroon cut transfer fees ahead of Wave’s planned entry. OSIRIS independently
              described the same theme in Côte d’Ivoire: MTN’s 2025 fee moves intensified a price war and increased
              pressure on operators to find margin elsewhere. DabaFinance’s interpretation of PI-SPI pushes the same
              direction at the system level—closed ecosystems become less defensible once cross-platform transfer
              becomes a regulated baseline rather than a differentiator.


              Switching costs still matter, but they are not primarily technical in the way enterprise software
              switching costs are technical. They are distributional and behavioral: agent reach, merchant acceptance,
              salary receipt, consumer trust, and the convenience of getting lending or savings in the same stack.
              Telcos are also treating mobile money as a strategic asset class, not as a side business; MTN Uganda
              shareholders even approved structural separation of MTN MoMo in 2025. Put differently, Wave is not
              competing against static incumbents. It is competing against incumbents that can copy fee tactics, against
              regulators that can commoditize transfer rails, and against new entrants that want to own a broader
              financial relationship. That leaves merchant depth, stored-value relevance, and adjacent products as the
              only plausible durable moat layers.
