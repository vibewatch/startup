            body: >-
              The strongest current scale indicators come from the June 2025 debt announcement and adjacent profiles.
              Investor and media coverage consistently place Wave above 20 million monthly active users, above 150,000
              agents, and above 3,000 employees across the continent, while official consumer surfaces keep emphasizing
              the same consumer promise that drove adoption: free cash-in and cash-out, free bill pay, and 1% transfers.
              At the same time, public footprint data are not perfectly clean. App-store listings clearly show live
              retail support numbers for Burkina Faso, Côte d’Ivoire, The Gambia, Mali, Senegal, and Uganda, whereas
