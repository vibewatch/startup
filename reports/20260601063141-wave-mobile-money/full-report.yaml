      - number: '2.3'
        title: Buyer, User, and Payer by Workflow
        blocks:
          - type: paragraph
            body: >-
              The core consumer workflow is household finance, not enterprise treasury. For a person-to-person transfer,
              the buyer, user, and payer are usually the same consumer funding a wallet and sending domestic value to
              family, friends, or counterparties. Wave's consumer proposition is built exactly for that use case: free
              cash in and out, a simple 1% send fee, and quick everyday jobs such as airtime purchase or utility bill
              payment. That makes the budget owner the household or individual, with adoption triggered by trust, low
              visible fees, nearby agents, and the ability to complete a task that would otherwise require carrying
              cash.


              The business workflow is different. Wave Business explicitly targets employers, merchants, and outlet
              networks that use the platform for payroll, customer acceptance, cash collection, and online payments. In
              those flows the business is the payer or budget owner, while end customers or employees are the
              operational users on the receiving side. Merchant acceptance is especially important because WAEMU's 2024
              data show that payment volume is already large even though payment value per transaction remains low. That
              profile fits exactly the kind of low-ticket, high-frequency commerce where fee transparency can change
              user behaviour.


              This split explains why buyer mapping should not collapse the market into one undifferentiated “mobile
              wallet user.” Household senders care about convenience and avoiding transfer fees. Micro-merchants care
              about not losing margin on acceptance. SME employers care about bulk disbursement reliability and
              collections. Agents care about float turnover and transaction density. BCEAO's usage mix and Airtel's
              product breadth both show that the competitive wallet market is converging toward multi-use ecosystems,
              but the near-term monetisation battleground is still everyday domestic payments where price, distribution,
              and cash substitution do most of the work.
                          
            claimRefs:
              - CM019
              - CM020
              - CM030
              - CM032
              - CM037
