      - number: '1.3'
        title: Funding history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Wave’s public capital history is unusually easy to anchor at the headline level and unusually thin beneath
              that headline. The decisive equity event was the September 2021 Series A, when TechCrunch and later round
              retrospectives reported a $200 million raise at a $1.7 billion valuation, making Wave Francophone Africa’s
              first unicorn and setting the benchmark private price that public sources still cite today. The next major
              disclosed capital event in the retained set is June 2025 debt financing of EUR 117 million / $137 million
              led by Rand Merchant Bank with British International Investment, Finnfund, and Norfund. Those lenders
              framed the facility as working-capital and expansion funding rather than a fresh equity repricing, so
              chapter 1 should still treat the 2021 Series A as the latest confirmed valuation event. Public sources do
              not disclose current ownership percentages, liquidation preferences, or board rights for either the 2021
              equity syndicate or the 2025 lenders. That leaves the capital narrative strong on milestone facts but
              incomplete on governance economics.
