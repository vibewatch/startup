              and one 2026 profile stretches the footprint to roughly 11 African countries. Headcount disclosure is
              similarly mixed: Y Combinator’s profile excerpt says 1,600 employees based in Dakar, while debt-round
              materials say 3,000-plus employees across the continent. Those inconsistencies do not undermine the core
              conclusion that Wave has reached meaningful scale, but they do mean exact coverage and staffing should be
              diligence asks rather than accepted as perfectly reconciled facts.
