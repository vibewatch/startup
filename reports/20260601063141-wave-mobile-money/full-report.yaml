      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is one of Wave’s strongest overview signals. Official and partner-backed sources
              consistently identify Drew Durbin as co-founder and CEO, while Y Combinator and company-history coverage
              tie Lincoln Quirk to the original founding and product logic that spun out of Sendwave. Durbin is still
              the principal public spokesperson on pricing, mission, and capital strategy, which creates both leadership
              clarity and key-person dependence. Beyond the founders, public visibility is materially thinner: June 2025
              lender materials identify Coura Sene as Regional Director and Head of Public Affairs, but the retained
              source set does not surface a current board roster, committee structure, or ownership-linked governance
              map. That gap matters because Wave is now large enough that governance quality, not just founder-product
              fit, should influence diligence. The practical read-through is that Wave looks founder-led rather than
              institutionally transparent: management continuity appears strong, but external readers still cannot
              verify full board composition or succession depth from public materials alone.
