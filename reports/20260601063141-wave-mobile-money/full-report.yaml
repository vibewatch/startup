      - number: '8.3'
        title: Scenario range and valuation logic
        blocks:
          - type: paragraph
            body: >-
              Because Wave still withholds current revenue and gross-margin detail, the scenario work has to be
              transparent about what is evidence and what is assumption. The evidence is the 1% send-fee model, the
              presence of more than 10 million active payers in the best 2026 profile, and the public multiple band from
              listed payment peers. The assumptions are how much monthly throughput and incremental merchant or business
              monetization each payer generates. Under a modest monetization case, the company could land in roughly the
              $250 million to $300 million revenue-power range and screen far below the old unicorn valuation if the
              market applies public downside multiples. A middle case moves Wave closer to $350 million to $450 million
              of revenue power and a valuation under roughly $1.3 billion. Only the bull case, which requires materially
              better monetization and some private-market premium, fully defends the 2021 mark. That asymmetry is the
              core valuation message. The upside case still exists, but it now depends on evidence the public record
              does not provide. In valuation terms, Wave looks like a name where the business can be excellent while the
              entry price is still too rich unless diligence closes the denominator gap.
            claimRefs:
              - CV037
              - CV039
              - CV040
