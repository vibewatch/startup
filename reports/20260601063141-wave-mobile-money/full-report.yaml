  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and list pricing
        blocks:
          - type: paragraph
            body: >-
              Wave's public pricing is unusually explicit for a private African fintech: the core consumer wallet still
              advertises free deposits, free withdrawals, free bill payments, and a flat 1% fee to send money. That
              means the most visible monetization lever is the transfer fee itself, not access to cash. Business
              surfaces add nuance. Wave Business advertises 1% bulk payouts and a merchant acceptance model where the
              first 20,000 CFA of in-person payments each day are free and incremental volume is charged at 1%.
              TechCabal also reports that Wave passes bill-payment fees to businesses rather than to end users.
              Together, these disclosures imply a deliberate two-sided model: Wave subsidizes consumer cash access and
              low-income usage, then tries to recover economics from transfer volume, business disbursements, merchant
              acceptance, and biller partnerships. The core underwriting issue is not list pricing clarity; it is the
              absence of realized take-rate, merchant discount revenue, and biller economics after subsidies and
              distribution costs.
