chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and regulatory anchor
        blocks:
          - type: paragraph
            body: >-
              Wave Mobile Money is a Senegal-anchored mobile-money platform built to make everyday digital finance
              dramatically cheaper than telecom-led incumbents. The company traces its operating story to Drew Durbin
              and Lincoln Quirk, who sold remittance startup Sendwave and then focused on domestic money movement in
              Africa, starting with Senegal in 2018. Its consumer proposition remains unusually simple across official
              surfaces: deposit, withdraw, and pay bills for free, then pay a flat 1% fee for peer-to-peer transfers.
              That low-fee retail wedge is paired with an agent network for cash conversion, QR-card and app-led usage,
              and a growing business stack that includes bulk payments, collections, merchant acceptance, and checkout
              APIs. Wave’s public legal anchor in the retained set is Wave Digital Finance SA in Senegal, which states
              that it obtained a BCEAO electronic-money-issuer license in April 2022. Taken together, chapter-1 evidence
              supports a clear identity: Wave is not just a payments app, but a regulated, agent-assisted financial
              network whose core differentiation is radical affordability.
