          detail: Pan African Visions 2026 profile figure
        - label: Monthly business payment recipients
          value: 500000
          detail: Official Wave Business disclosure
        - label: Active in-person merchants
          value: 100000
          detail: Official Wave Business disclosure
    approximationNotes: >-
      This is a cross-surface proxy funnel, not a literal cohort. The stages mix consumer reach, transaction activity,
      and business-product adoption metrics from different sources and dates to show narrowing adoption layers.
    claimRefs:
      - CU006
      - CU008
      - CU012
      - CU014
      - CU015
      - CU020
      - CU033
