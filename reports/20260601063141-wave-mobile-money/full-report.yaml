  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Wave enters valuation work with a stark mismatch between operating relevance and public price discovery.
              The operating relevance is easy to see. Official and lender-backed 2025 sources point to eight markets,
              more than 20 million monthly active users, more than 150,000 agents, and more than 3,000 employees, while
              the product still markets free deposits, free withdrawals, free bill payments, and a 1% send fee. The
              price-discovery problem is just as clear. The last publicly disclosed equity valuation is still the
              September 2021 $200 million Series A at $1.7 billion, and the next large public capital event was the June
              2025 debt facility, not a fresh equity round. That means investors can describe Wave as large, real, and
              financeable without knowing whether common equity at the old unicorn mark is attractive today. Entry
              discipline therefore has to start from one hard rule: do not confuse a stale headline valuation with a
              current fair price. A disciplined buyer should assume that the old mark is stretched until management
              proves current revenue, margin, debt burden, and cap-table terms in a private data room.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
