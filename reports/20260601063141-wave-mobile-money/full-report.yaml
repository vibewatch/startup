      - number: '8.4'
        title: Recommendation, kill triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a TRACK recommendation with medium confidence, high risk, and a stretched valuation
              stance. That is not a judgment that Wave lacks quality. On the contrary, the company has enough scale,
              product edge, and financing resilience to stay investable. The problem is that the valuation debate now
              turns on common-equity specifics that public sources still hide: current revenue, current margin,
              debt-service burden, and any preference overhang from the old equity stack. Adverse sources make the
              caution sharper, not softer. Wave is dealing with regulatory friction, questions around access to payment
              rails, and direct fee retaliation from large incumbents. Those risks do not kill the business, but they do
              make it dangerous to pay a stale 2021 headline as though nothing has changed in the market or in the
              balance sheet. The practical stance is therefore simple. Keep Wave active, but insist on a current
              financial bridge, debt documents, and cap-table proof before moving beyond tracking status. If those
              materials show strong economics and ordinary downside protections, the call can improve. If they do not,
              the thesis should break quickly rather than be rationalized around scale alone.
            claimRefs:
