            body: >-
              Wave has more public trust-and-safety documentation than public uptime documentation. The privacy notice
              explicitly covers customers, agents, merchants, and QR-card users, and says Wave collects banking details,
              identity documents, call recordings, transaction data, device and crash activity, location data for
              fraud/compliance, and partner-bank or utility-provider data needed to deliver services. The complaints
