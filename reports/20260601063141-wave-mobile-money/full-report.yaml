      - CE001
      - CE005
      - CE006
      - CE007
      - CE016
      - CE018
      - CE022
      - CE028
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Dependencies that most directly shape product reliability and scalability: agents, banks, partner integrations,
      support, and regulatory interoperability.
    data:
      nodes:
        - id: agent-network
          label: Agent network and field supervision
        - id: liquidity
          label: Cash and e-value liquidity
        - id: partner-banks
          label: Partner banks and card rails
        - id: biller-partners
          label: Utilities, telcos, and enterprise partners
        - id: apps
          label: Consumer and business app surfaces
        - id: platform-security
          label: Core platform and security controls
        - id: support
          label: Support and complaints operations
        - id: regulation
          label: BCEAO licensing and interoperability rules
      edges:
        - from: agent-network
          to: liquidity
          label: Field quality depends on float and cash availability
        - from: liquidity
          to: apps
          label: Free cash access breaks if liquidity fails
        - from: partner-banks
          to: apps
          label: Bank linking and card extensions depend on partner systems
        - from: biller-partners
          to: apps
          label: Bill pay and business integrations require partner uptime
        - from: platform-security
          to: apps
          label: Permissions, APIs, and mobile releases shape user trust
        - from: apps
          to: support
          label: User errors and outages surface as support demand
        - from: regulation
          to: partner-banks
          label: Licensing and interoperability govern partner access
        - from: regulation
          to: apps
          label: Interoperability changes the product moat
        - from: support
          to: agent-network
          label: Complaint resolution often loops back into field operations
    approximationNotes: >-
      Dependencies are directional rather than quantitative because Wave does not publish service-level or
      partner-volume data.
    claimRefs:
      - CE017
      - CE018
      - CE022
      - CE026
      - CE027
      - CE036
      - CE037
      - CE040
      - CE041
      - CE042
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Qualitative maturity map of Wave product modules based on public evidence depth, rollout signals, and external
      friction indicators.
    data:
      columns:
        - Public maturity
        - What is visibly working
        - Primary caveat
      rows:
        - id: consumer-wallet
          label: Consumer wallet core
          values:
            - Mature
            - Free cash-in/out, bill pay, airtime, and 1% send remain visible in 2026
            - No public uptime, reversal, or fraud-loss metrics
        - id: agent-operations
          label: Agent operations and liquidity
          values:
            - Mature but operationally heavy
            - Dedicated recruiting, training, liquidity, and premium-cash roles are visible
            - Execution quality depends on field management intensity
        - id: business-payments
          label: Business and merchant payments
          values:
            - Scaling
            - Business pages claim significant merchant, payout, and API reach
            - Public monetization and retention metrics remain thin
        - id: partner-integrations
          label: Partner integrations / APIs
          values:
            - Scaling
            - 1M+ active API users and dedicated integration roles suggest meaningful adoption
            - No public self-serve docs or changelog
        - id: bank-extensions
          label: Bank linking and virtual Visa
          values:
            - Emerging
            - Documented in Côte d’Ivoire terms and community review proxies
            - Rollout friction and adoption metrics are not public
        - id: observability
          label: External reliability observability
          values:
            - Gap
            - Support and complaint channels are public
            - No public status page, SLA, or incident history
    approximationNotes: Maturity is a public-evidence judgment, not an internal engineering maturity score.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE015
      - CE025
      - CE033
      - CE040
      - CE042
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Wave’s customer journey starts with a fee-led value proposition, moves through agent-assisted onboarding, and then
      expands into repeat payments, bill pay, and merchant workflows.
    data:
      items:
        - label: Discovery
          description: >-
            Users hear the core promise—free deposits and withdrawals, free bill pay, and 1% transfers—through local
            brand presence, referrals, and app-store discovery.
        - label: Cash onboarding
          description: >-
            Customers or merchants activate through an agent, QR card, or app download, with local support numbers
            available when they need help.
        - label: First transaction
          description: Typical first actions are sending money, paying a bill such as Woyofal, or buying airtime inside the wallet.
        - label: Repeat use
          description: >-
            Habit forms around family transfers, recurring bills, and safe cash storage; ratings and named reviews act
            as the public proxy for satisfaction.
        - label: Merchant and payroll adoption
          description: >-
            Businesses use QR acceptance, payout tools, collections, and remote payment links, moving Wave beyond purely
            consumer P2P activity.
        - label: Trust / service loop
          description: >-
            Customer support, receipts, security expectations, and onboarding reliability determine whether the low-fee
            promise compounds into durable usage.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU009
      - CU032
      - CU042
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Proxy funnel from broad retail reach to narrower business and merchant deployment, using the best available public
      2025/2026 customer metrics.
    data:
      items:
        - label: Consumer app downloads (lifetime)
          value: 56000000
          detail: AppBrain estimate as of 2026-05-31
        - label: Monthly active users
          value: 20000000
          detail: Best-corroborated 2025 lender / media figure
        - label: Active payers
