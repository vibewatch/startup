      - number: '2.4'
        title: Growth Drivers, Activation Gaps, and Regulatory Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest structural drivers are straightforward. Mobile money continues to expand because the broad
              African base is still under-digitized: mobile internet usage is only 28% in Africa, and 960 million people
              remain outside effective mobile-internet usage despite having coverage. That gap creates room for
              continued wallet adoption as affordability improves. Agent density is already high at a global ecosystem
              level, and WAEMU's merchant-point count more than doubled in 2024, showing that low-ticket acceptance is
              now moving from experimentation toward scaled rollout. Public policy is also supportive at the headline
              level: BCEAO maintains common payment rails, and the union has an explicit 2025-2030 regional
              financial-inclusion strategy.


              But the constraints are equally material. WAEMU's opened-account base is far larger than its
              active-account base, with a 30.9% activity rate, which means raw account counts materially overstate
              engaged usage. Deposits and withdrawals still dominate transaction value, so much of the market remains a
              cash bridge rather than a fully digital merchant economy. GSMA also warns that fraud and transaction taxes
              can push users back toward cash; the same sources highlight device affordability and digital skills as
              persistent barriers. In other words, the market is not demand-constrained so much as
              conversion-constrained.


              Regulation is a mixed force. BCEAO's common rule-making supports market legitimacy, but the 2024
              payment-services instruction and the post-May-2025 licensing regime also raise the compliance bar. MFW4A
              reports that licensing is still country-by-country, that only nine fintechs had been approved shortly
              after the deadline, and that even Senegal had far more operating fintechs than authorised ones. For Wave,
              that means regulatory legitimacy can be a moat once won, but expansion across WAEMU is not frictionless.
              The risk is not that mobile money lacks relevance; it is that account activation, merchant monetisation,
              tax/fraud pressure, and licensing throughput all slow the pace at which relevance converts into durable
              economics.
                          
