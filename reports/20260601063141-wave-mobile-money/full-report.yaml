  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Regulatory and infrastructure risks cluster in the high-likelihood / high-impact quadrant, while privacy,
      complaints, and security process risks are material but somewhat more controllable.
    claimRefs:
      - CR014
      - CR016
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR029
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical impact
          values:
            - label: —
              tone: neutral
              detail: No critical-impact risk in this set sits in low likelihood from current evidence.
            - label: PI-SPI deadline
              tone: risk
              detail: >-
                Missing BCEAO interoperability readiness would impair transfers, merchant acceptance, and customer
                convenience.
            - label: Cameroon structure
              tone: risk
              detail: Partner-only entry without direct e-money issuance could limit strategic control and economics.
        - label: High impact
          values:
            - label: —
              tone: neutral
              detail: Low-likelihood / high-impact events were not directly evidenced in public sources.
            - label: Privacy / KYC breach
              tone: risk
              detail: Heavy identity-data handling creates high downside if controls fail.
            - label: Licensing fragmentation
              tone: risk
              detail: Country-by-country licensing can slow launches and strain compliance throughput.
        - label: Medium impact
          values:
            - label: Security policy scope
              tone: neutral
              detail: Responsible disclosure is a positive signal, but vendors and DoS remain outside scope.
            - label: Complaint backlog
              tone: risk
              detail: Public SLAs exist, but backlog and escalation metrics are undisclosed.
            - label: Agent / insider fraud
              tone: risk
              detail: GSMA fraud typologies suggest ongoing exposure in agent-led mobile-money systems.
        - label: Residual monitor
          values:
            - label: Status-page comfort
              tone: positive
              detail: Wave showed 100% uptime over the prior 90 days on the review date.
            - label: Published controls
              tone: positive
              detail: Privacy, complaints, and disclosure policies reduce some unknowns.
            - label: Regulatory pivot pressure
              tone: risk
              detail: Exclusion and fee competition increase pressure to change charter or business model.
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Regulatory misses would not stay isolated; they would flow into customer friction, transaction volume, margins,
      working-capital needs, and ultimately valuation.
    claimRefs:
      - CR014
      - CR021
      - CR030
      - CR031
      - CR040
      - CR041
      - CR043
      - CR044
    data:
      nodes:
        - id: reg
          label: Regulatory / rail miss
          detail: Missed PI-SPI onboarding, slower licensing, or partner-scope limits.
          tone: risk
        - id: cust
          label: Customer friction
          detail: Transfers, agent service, or complaint handling become less seamless.
          tone: risk
        - id: vol
          label: Volume / merchant drag
          detail: Lower transaction frequency and weaker merchant acceptance.
          tone: risk
        - id: margin
          label: Margin pressure
          detail: Wave absorbs pricing pressure or loses differentiation.
          tone: risk
        - id: wc
          label: Working-capital need
          detail: More external capital is needed to fund growth and service quality.
          tone: risk
        - id: val
          label: Valuation / recommendation hit
          detail: Underwriting moves from scale narrative to risk discount.
          tone: risk
      edges:
        - from: reg
          label: slower access / higher compliance burden
          to: cust
        - from: cust
          label: lower trust / convenience
          to: vol
        - from: vol
          label: fixed costs spread over less volume
          to: margin
        - from: margin
          label: cash generation weakens
          to: wc
        - from: wc
          label: refinancing and dilution risk rise
          to: val
        - from: margin
          label: competitive position weakens
          to: val
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Wave's risk posture is shaped by regulated infrastructure and counterparties: central-bank rails, local bank
      sponsorship in Cameroon, agents, and working-capital lenders.
    claimRefs:
      - CR012
      - CR019
      - CR020
      - CR021
      - CR040
      - CR041
      - CR042
      - CR045
      - CR046
      - CR047
    data:
      nodes:
        - id: wave
          label: Wave platform
          detail: Mobile-money product, app, agents, and merchant-facing services.
          tone: neutral
        - id: bceao
          label: BCEAO / PI-SPI
          detail: WAEMU interoperability, payment-system governance, and rail access.
          tone: risk
        - id: cbc
          label: CBC Cameroon
          detail: Licensed local banking wrapper for Wave-branded payment services in Cameroon.
          tone: risk
        - id: beac
          label: BEAC / GIMAC
          detail: CEMAC reporting, safeguarding, and interconnection environment.
          tone: risk
        - id: agents
          label: Agent network
          detail: Cash-in/cash-out distribution, liquidity, and local customer service.
          tone: risk
        - id: lenders
          label: RMB + DFI lenders
          detail: Working-capital and expansion financing.
          tone: risk
        - id: bankpivot
          label: Wave Bank Africa
          detail: Potential future banking charter intended to broaden infrastructure access and product scope.
          tone: neutral
      edges:
        - from: bceao
          label: interoperability / rail access
          to: wave
        - from: cbc
          label: Cameroon licensed service wrapper
          to: wave
        - from: beac
          label: reporting / interconnection constraints
          to: cbc
        - from: agents
          label: distribution and liquidity
          to: wave
        - from: lenders
          label: debt financing / working capital
          to: wave
        - from: bankpivot
          label: possible direct infrastructure and credit access
          to: wave
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Scale and sector growth support a live opportunity, but stale price discovery plus regulatory and competition risk
      keep the call at TRACK.
    data:
      nodes:
        - id: scale
          label: 'Scale proof: 20M+ MAUs, 150k+ agents, 8 markets'
          type: input
        - id: pricing
          label: 'Product proof: free cash access and 1% send fee'
          type: input
        - id: sector
          label: 'Sector tailwind: mobile money >$2T transactions in 2025'
          type: input
        - id: freshness
          label: 'Valuation gap: last public equity mark still 2021'
          type: input
        - id: risk
          label: 'Adverse pressure: regulation, payment-rail access, telecom price wars'
          type: input
        - id: decision
          label: 'Decision: TRACK / high risk / stretched valuation'
          type: output
        - id: upgrade
          label: Upgrade only with current revenue, debt, and cap-table proof
          type: output
      edges:
        - from: scale
          to: decision
        - from: pricing
          to: decision
        - from: sector
          to: decision
        - from: freshness
          to: decision
        - from: risk
          to: decision
        - from: decision
          to: upgrade
    approximationNotes: This figure expresses the recommendation logic, not a mechanical scorecard.
    claimRefs:
      - CV005
      - CV008
      - CV013
      - CV021
      - CV023
      - CV047
      - CV048
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Illustrative valuation sensitivity at different sales multiples using a $400 million base-case revenue assumption.
    data:
      items:
        - label: 1.2x sales
          value: 480
          note: Public downside / harsh bear case
        - label: 1.6x sales
          value: 640
          note: Low-end public payments range
        - label: 2.0x sales
          value: 800
          note: Base-case floor
        - label: 2.4x sales
          value: 960
          note: Remitly-like vicinity
        - label: 2.8x sales
          value: 1120
          note: Upper observed public range
        - label: 3.8x sales
          value: 1520
          note: Bull case / private premium needed to defend unicorn territory
    approximationNotes: >-
      The bar chart holds revenue constant at the midpoint of the base case to show how much of the debate is multiple
      versus denominator risk.
    claimRefs:
      - CV037
      - CV040
      - CV043
      - CV044
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull valuation ranges built from explicit revenue and multiple assumptions.
    data:
      items:
        - label: Bear case
          low: 300
          mid: 390
          high: 480
          note: $250M-$300M revenue at 1.2x-1.6x sales
        - label: Base case
          low: 700
          mid: 980
          high: 1260
          note: $350M-$450M revenue at 2.0x-2.8x sales
        - label: Bull case
          low: 1500
          mid: 1985
          high: 2470
          note: $500M-$650M revenue at 3.0x-3.8x sales
    approximationNotes: >-
      Ranges are assumption-heavy because Wave still does not disclose current revenue, gross margin, or debt-service
      burden publicly.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style directional scoring of Wave on market, proof, economics visibility, and valuation discipline.
    data:
      items:
        - label: Category demand
          value: 4
          note: Mobile money and African fintech demand remain structurally attractive
        - label: Scale proof
          value: 4.5
          note: 20M+ MAUs and large distribution prove meaningful adoption
        - label: Pricing advantage
          value: 4
          note: Free cash access plus 1% sends still stands out
        - label: Monetization visibility
          value: 2
          note: Current revenue and margin remain private
        - label: Regulatory resilience
          value: 2
          note: Payment-rail access and new-market licensing remain active risks
        - label: Valuation support
          value: 2
          note: No fresh equity mark and public comp ranges sit well below 2021 exuberance
        - label: Exit readiness
          value: 2.5
          note: Strategic or structured outcomes are more plausible than near-term IPO
    approximationNotes: >-
      Scores are directional and help summarize the mix of proof, opacity, and price discipline; they are not a
      mechanical investment model.
    claimRefs:
      - CV021
      - CV023
      - CV037
      - CV038
      - CV045
      - CV047
      - CV048
