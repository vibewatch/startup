- id: architecture-integrations-and-agent-operations
  title: Architecture, integrations, and agent operations
  body: 'Public architecture evidence is real but indirect. Wave does not expose a self-serve developer portal in the way a payments API company would. Instead, the clearest architecture proxies come from partner-integration, security, endpoint, and agent-operations materials. The Product Relations Manager role describes partner integrations as an end-to-end process from technical scoping to testing, production launch, and post-launch health, including review of REST, SOAP, webhook, VPN, and timeout details with banks, utilities, telcos, and government agencies. The Application Security Engineer role exposes a modern software stack spanning Python, GraphQL, Kotlin, Swift, React, Postgres/CockroachDB, GCP/Terraform, and Kubernetes. Endpoint engineering adds GitOps, CI/CD, Azure, and fleet management across Apple, Google, Microsoft, iOS, and Android devices. On the operating side, regional and territory leads recruit, contract, train, and monitor agents, while premium-cash staff manage bill
    counting, treasury-system recording, and rebalance requests. The result is a hybrid architecture: app-first software on top of a field-heavy cash network and partner-managed payment integrations.'
