company:
  name: Wave Mobile Money
chapter:
  number: 5
  title: Product & Technology
  summary: 'Wave''s product is mature at the user-workflow layer: the consumer app still centers on free cash access and bill pay plus a 1% send fee, while Wave Business adds payroll, merchant acceptance, outlet collections, and a partner/API surface. Public technical detail exists, but mostly through legal documents, app-store signals, and hiring proxies rather than a self-serve developer portal. The main product-tech risk is thin external observability—no public status page, no public uptime or fraud metrics, and regulation-driven interoperability that can narrow Wave''s closed-loop moat.'
sections:
- id: retail-wallet-and-business-workflows
  title: Retail wallet and business workflows
  body: 'Wave''s public product map is unusually clear at the workflow layer. The consumer surface still leads with the same simple promise that built adoption: deposit, withdraw, and pay bills for free, then pay 1% to send money. App-store listings show the offer is still live across multiple West African markets in late May 2026, not a stale marketing page. The business side is now much broader than a merchant add-on. Wave Business says companies use the platform to pay employees, collect cash from outlets, accept online payments, and accept in-person payments from tens of millions of Wave users. It also claims 500K+ monthly business payment recipients, 1M+ active API users, and 100K+ active in-person merchants. Bulk payouts are designed to reach recipients who do not yet use Wave or even own smartphones, while collections let outlets deposit cash instantly at agents and monitor activity in the business portal. That breadth makes Wave a daily-operations rail, not just a low-fee peer-to-peer
    wallet.'
