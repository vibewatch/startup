    - Wave privacy notice
  - - Complaint intake and resolution SLA
    - Documented
    - Hotline and web-form complaint handling across operating markets
    - No published complaint volumes, first-contact resolution rate, or ombudsman escalation stats
    - Wave complaints policy
  - - PIN-based bank-linking controls
    - Documented
    - NSIA account linking terms define a four-digit PIN and service-unavailability windows
    - No public strong-customer-authentication or step-up-auth detail
    - Wave NSIA linking terms
  - - App-store data-safety disclosures
    - Partially documented
    - Encryption in transit and data deletion request path are shown on Google Play
    - No public independent security audit summary or breach-rate metrics
    - Google Play listing
  - - Security engineering and audit work
    - Documented by hiring proxy
    - Login/permissions centralization, SIEM, secret management, API security review, ISO-27001 and PCI-DSS familiarity
    - No public certification completion date or scope statement
    - Wave Application Security Engineer role
  - - External reliability observability
    - Gap
    - Public users can find support channels, not a status dashboard
    - No public uptime SLA, incident history, or MTTR disclosure was found
    - Complaints policy, app stores, and legal terms
  notes: Trust controls are a mix of direct policy disclosures and job-posting proxies; absent metrics are real diligence gaps, not evidence of failure.
