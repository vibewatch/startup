- id: roadmap-differentiation-and-product-risks
  title: Roadmap, differentiation, and product risks
  body: Wave's differentiation still starts with price and execution rather than a public technical moat. Industry coverage says the company captured share with 1% pricing, simple UX, QR-enabled merchant acceptance, and tight end-to-end control of the user experience. The 2022 EMI announcement showed a roadmap beyond transfers into merchant payments, savings, credit, and remittances, while 2025 and 2026 legal and review evidence shows incremental expansion into bank linking and virtual Visa. Careers materials also show ongoing hiring across support, risk, engineering, payments, and agent operations, which is consistent with a platform still broadening and hardening its surface. But the moat is getting more operational and less structural. BCEAO-driven interoperability reduces the value of a closed network, and external coverage argues that Wave loses some of the stickiness that came from users staying inside a proprietary loop. The underwriting question is no longer whether Wave can ship
    more features; it is whether it can keep merchant, agent, support, and reliability performance high enough that customers stay even when switching costs fall.
