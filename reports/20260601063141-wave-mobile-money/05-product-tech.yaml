- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Public evidence
  - Key dependency
  - Risk
  rows:
  - - User access surfaces
    - Smartphone apps remain the primary interface; some markets also document feature-phone USSD and QR-card access
    - Homepage, app stores, and localized terms
    - Android/iOS distribution, agent network, local market terms
    - Feature parity and rollout quality across markets are not public
  - - Partner integration layer
    - Connects banks, utilities, telcos, government agencies, and other external partners
    - Product Relations Manager role references REST, SOAP, webhooks, VPN, timeout configs, and launch ownership
    - Partner technical readiness and Wave integration management
    - No public self-serve API docs or changelog
  - - Security and core application stack
    - Protects customer flows and exposes likely production technologies
    - Application Security Engineer role lists Python, GraphQL, Kotlin, Swift, React, Postgres/CockroachDB, GCP/Terraform, Kubernetes
    - Secure coding, secrets, login/permissions, audits
    - Public stack proxies do not reveal architecture boundaries or resilience metrics
  - - Endpoint and internal operations platform
    - Runs employee fleet and internal tooling across operating markets and remote teams
    - Endpoint Engineer role references IaC, GitOps, CI/CD, Azure, GCP, and multi-OS device management
    - Internal IT maturity and secure device posture
    - Internal tooling strength does not equal public customer-service reliability
  - - Agent operations and liquidity engine
    - Recruits, trains, certifies, equips, and monitors agents while keeping cash/e-value available
    - Territory Lead, Regional Lead, and Premium Cash Officer roles
    - Field supervision, treasury controls, rebalancing, branding, KYC/AML discipline
    - Human-process intensity can create quality drift if rollout outruns supervision
  - - Bank-linking extensions
    - Moves value between Wave wallets and partner-bank accounts or virtual cards
    - Côte d’Ivoire product terms for NSIA, Orabank branch linking, and virtual Visa
    - Partner-bank systems, PIN controls, app UX, customer support
    - Terms already acknowledge system-unavailability periods and rollout friction
  notes: This table uses public proxies rather than confidential system diagrams; it separates documented interfaces from informed inference.
