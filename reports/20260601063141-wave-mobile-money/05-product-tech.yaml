- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Legacy workflow pain
  - Wave solution
  - Measurable benefit
  - Limitation
  rows:
  - - Send money to another person
    - Cash handoff or higher-fee telecom transfer
    - App-based transfer for 1%
    - Simple fee anchor and instant digital receipt path
    - No public reversal/error-rate metrics
  - - Turn cash into digital balance or withdraw it again
    - Branch visit or costly cash-out fees
    - Deposit and withdraw for free at agents
    - Low-friction cash access broadens wallet usability
    - Agent density and float quality are not publicly quantified by market
  - - Pay recurring bills or airtime
    - Travel to utility office or kiosk
    - In-app bill pay and airtime purchase
    - Removes queueing and extra consumer fees
    - Public biller coverage map and success-rate data are missing
  - - Pay employees or beneficiaries in bulk
    - Manual cash distribution or bank batch friction
    - Wave Business bulk payouts by phone number
    - Recipients can receive even without Wave or a smartphone
    - No public payroll or recurring-disbursement volume disclosure
  - - Accept customer payments in person
    - Cash only or expensive merchant acquiring
    - Business app for in-person payments from tens of millions of users
    - Free first 20k CFA daily lowers merchant trial cost
    - No public merchant retention or average take-rate after the free tier
  - - Collect cash from distributed outlets
    - Slow branch sweeps and weak visibility
    - Deposit at agents and monitor in real time in the business portal
    - Faster cash centralization with dashboard visibility
    - No public portal screenshots, SLA, or reconciliation metrics
  notes: Benefits are described from public product language and review proxies; no row should be read as audited throughput, conversion, or uptime.
