  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-api-docs
    missingEvidence: A public developer portal or partner-integration guide with auth model, schemas, webhook events, environments, rate limits, and changelog.
    whyItMatters: Without a self-serve technical reference, it is hard to judge integration complexity, maintenance burden, and how repeatable the business/API motion really is.
    diligencePath: Request the current partner API documentation pack, webhook schemas, sandbox workflow, and a sample implementation guide from product or partner engineering.
    relatedQuestionRefs:
    - QE009
    - QE010
    - QE026
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: uptime-and-incidents
    missingEvidence: A public or investor-only status page, uptime SLA, incident history, and MTTR or service-restoration metrics by core workflow.
    whyItMatters: Wave’s model depends on real-time trust at agents, merchants, and partner-bank rails, so reliability is a core underwriting variable rather than a cosmetic metric.
    diligencePath: Request 12-month incident logs, status-page exports if they exist privately, SLA definitions, and outage postmortems for wallet, bill-pay, and bank-linking services.
    relatedQuestionRefs:
    - QE018
    - QE023
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: fraud-and-security-metrics
    missingEvidence: Fraud-loss rates, account-takeover data, chargeback or reversal rates, penetration-test outputs, and the actual status or scope of ISO or PCI programs.
    whyItMatters: Public control descriptions are directionally good, but investors still need outcome metrics to understand whether the security posture is strong enough for a scaled money-movement product.
    diligencePath: Request fraud dashboards, security KPI packs, audit letters, certification scope documents, and a management walkthrough of incident-response and access-control practices.
    relatedQuestionRefs:
    - QE011
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: merchant-api-adoption
    missingEvidence: A split of the 1M+ active API users and 100K+ active in-person merchants by country, vertical, retention, and payments mix.
    whyItMatters: The business product looks scaled, but without segmentation it is impossible to know whether usage is concentrated in a few partners or broadly distributed across durable merchant workflows.
    diligencePath: Request merchant cohort data, API-partner counts, active-merchant retention, collections volume, and business gross-margin data by product line.
    relatedQuestionRefs:
    - QE004
    - QE009
    - QE022
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: roadmap-timing
    missingEvidence: Dated roadmap milestones for savings, credit, remittances, banking-license execution, and interoperability rollout by market.
    whyItMatters: Public evidence shows strategic direction but not timing, which makes it hard to separate already-funding modules from still-speculative roadmap narratives.
    diligencePath: Request a dated product roadmap with market-by-market launch criteria, partner dependencies, and success metrics for each expansion module.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE026
    relatedTableRefs:
    - TE005
