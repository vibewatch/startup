tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Consumer wallet
    - Retail customer
    - Mature and clearly live in 2026 app-store and homepage evidence
    - Free cash-in, free cash-out, free bill pay, and 1% send fee are unusually simple for the category
    - Country-by-country limits, reversals, and fraud-loss disclosures are still absent
  - - Agent cash network
    - Customer plus field agent
    - Mature but operations-heavy
    - Free cash access is supported by a dense, liquidity-managed field network rather than branch infrastructure
    - No public active-agent productivity, commission, or float-turn data
  - - Wave Business payouts
    - Employers and businesses
    - Live and scaled
    - Can send to any phone number, even when the recipient lacks Wave or a smartphone
    - No public breakdown of payroll vs supplier vs disbursement volumes
  - - Merchant acceptance and collections
    - In-person merchants and outlet networks
    - Live and scaled
    - First 20k CFA per day free for in-person payments; collections promise instant deposit visibility through the portal
    - No public merchant-retention, API-merchant mix, or collections fee schedule
  - - Bank linking and virtual Visa
    - Wave users in Côte d’Ivoire
    - Emerging extensions
    - Adds bank-account rails and online card acceptance beyond the core wallet
    - No public adoption, failure-rate, or rollout-by-market metrics
  notes: Rows combine marketing pages, legal-product extensions, and operating-role proxies; maturity reflects public evidence depth, not audited product telemetry.
