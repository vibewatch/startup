figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Layered public architecture proxy showing how Wave combines consumer apps, business/payment modules, partner integrations, and security/operations controls.
  data:
    layers:
    - id: access-layer
      label: Access surfaces
      detail: Consumer iOS/Android app, localized feature-phone USSD variants, QR-card support in some markets, and the Wave Business app for merchants and staff.
    - id: payments-layer
      label: Payments and workflow layer
      detail: Send money, free cash-in/out, free bill pay, airtime, bulk payouts, merchant acceptance, and outlet collections.
    - id: distribution-layer
      label: Distribution and partner layer
      detail: Agent network, business portal, bank-linking products, Orabank prepaid Visa, utilities, telcos, and other external partners.
    - id: integration-layer
      label: Integration and control layer
      detail: Partner-managed APIs, REST/SOAP/webhooks, VPN and timeout configurations, support processes, complaint handling, and identity/compliance rules.
    - id: platform-layer
      label: Platform and security layer
      detail: Python and GraphQL services, Kotlin and Swift mobile clients, React web tooling, Postgres/CockroachDB, GCP/Terraform, Kubernetes, SIEM, secrets, and endpoint controls.
  approximationNotes: Public architecture is inferred from legal terms, app-store surfaces, and hiring proxies because Wave does not publish a self-serve technical architecture document.
