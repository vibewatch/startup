- id: trust-privacy-support-and-reliability
  title: Trust, privacy, support, and reliability
  body: 'Wave has more public trust-and-safety documentation than public uptime documentation. The privacy notice explicitly covers customers, agents, merchants, and QR-card users, and says Wave collects banking details, identity documents, call recordings, transaction data, device and crash activity, location data for fraud/compliance, and partner-bank or utility-provider data needed to deliver services. The complaints policy is concrete: hotline or web-form intake, most payment complaints resolved within 24 hours, a response within 2 business days, and target resolution within 15 working days. Local terms add more operational detail, including feature-phone USSD access, QR-card usage at agent locations, four-digit PIN controls, bank-linking flows, and explicit periods when partner-bank or Wave systems may be unavailable. App-store and review proxies show that users broadly trust the product, but they also surface familiar fintech friction: requests for transaction notes, better reversal
    and bank safeguards, more biller coverage, and bugs around the newer virtual-Visa experience on iPhone. The biggest gap is observability: no public status page, uptime SLA, fraud-loss rate, or external incident ledger was found.'
