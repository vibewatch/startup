companyProfile:
  summary: >-
    Wave Mobile Money is a Senegal-launched mobile-money platform founded in 2018 by
    Drew Durbin and Lincoln Quirk after Sendwave. Its core consumer offer is unusually
    simple: free cash-in, free cash-out, free bill pay, and a flat 1% fee to send money.
    Wave has expanded that base with Wave Business products for payroll, collections,
    merchant acceptance, and checkout or API-led payments. Public 2025-2026 sources place
    the company above 20 million monthly active users, above 150,000 agents, and across
    eight markets, giving it rare consumer scale in African mobile money. Public disclosure
    is still thin on revenue, margins, governance, and cap-table detail despite the 2021
    $200 million Series A at a $1.7 billion valuation and the June 2025 EUR 117 million /
    $137 million debt facility.
  founders:
    - name: Drew Durbin
      role: Co-founder and CEO
      background: >-
        Previously built Sendwave and remains Wave's main public spokesperson on mission,
        pricing, and capital strategy.
      claimRefs:
        - CO002
        - CO003
    - name: Lincoln Quirk
      role: Co-founder
      background: >-
        Co-created Sendwave and Wave and helped drive the move from remittances into
        domestic African money movement.
      claimRefs:
        - CO001
        - CO003
  foundingLocation: Senegal
  headquarters: Dakar, Senegal
  productSummary: >-
    Wave sells a consumer mobile wallet for transfers, cash-in and cash-out, bill pay,
    airtime, and related everyday payments, plus Wave Business tooling for payroll,
    customer payments, outlet cash collection, merchant acceptance, and online checkout
    or API flows.
  customerFocus: >-
    Mass-market consumers and SMBs or merchants in African markets that need low-cost
    everyday payments, cash access, collections, payouts, and digital checkout tools.
  businessModel: >-
    The public record points to a transaction-fee model anchored on a 1% send-money fee,
    with additional monetization from business payment, merchant acceptance, collection,
    and checkout workflows while keeping cash-in and cash-out free as the core adoption
    wedge.
  stage: Late-stage private company
  fundingStatus: >-
