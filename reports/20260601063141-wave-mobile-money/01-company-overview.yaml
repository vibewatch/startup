- id: milestones-and-adverse-signals
  title: Milestones, regulatory posture, and adverse signals
  body: 'Wave’s milestone record shows a business that used regulatory structure, pricing discipline, and agent density to move from Senegal launch to continent-scale relevance. The chronology begins with the 2018 Senegal launch, tightens around the March 2021 creation of Wave Digital Finance in Senegal, then accelerates through the September 2021 unicorn Series A and April 2022 BCEAO e-money-license disclosure. The 2025 debt round and reported Cameroon authorization show the company still pushing outward geographically, while lender statements suggest Finnfund and Norfund were already involved by 2022. The adverse side of the record matters too. TechCrunch documented a 2021 conflict with Orange over airtime distribution and regulatory recourse, showing competitive friction from the outset. A 2025 Uganda report then described widening local losses despite the familiar low-fee playbook, indicating that the model does not expand frictionlessly into every new market. Wave therefore reads as
    a strong but not fully de-risked operator: category-defining in affordability, yet still exposed to country-by-country regulatory and competitive execution risk.'
