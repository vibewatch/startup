- id: founders-leadership-governance
  title: Founders, leadership, and governance visibility
  body: 'Founder continuity is one of Wave’s strongest overview signals. Official and partner-backed sources consistently identify Drew Durbin as co-founder and CEO, while Y Combinator and company-history coverage tie Lincoln Quirk to the original founding and product logic that spun out of Sendwave. Durbin is still the principal public spokesperson on pricing, mission, and capital strategy, which creates both leadership clarity and key-person dependence. Beyond the founders, public visibility is materially thinner: June 2025 lender materials identify Coura Sene as Regional Director and Head of Public Affairs, but the retained source set does not surface a current board roster, committee structure, or ownership-linked governance map. That gap matters because Wave is now large enough that governance quality, not just founder-product fit, should influence diligence. The practical read-through is that Wave looks founder-led rather than institutionally transparent: management continuity appears
    strong, but external readers still cannot verify full board composition or succession depth from public materials alone.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO030
  - CO031
  tableRefs:
  - TO002
- id: funding-and-stakeholders
  title: Funding history and stakeholder map
  body: Wave’s public capital history is unusually easy to anchor at the headline level and unusually thin beneath that headline. The decisive equity event was the September 2021 Series A, when TechCrunch and later round retrospectives reported a $200 million raise at a $1.7 billion valuation, making Wave Francophone Africa’s first unicorn and setting the benchmark private price that public sources still cite today. The next major disclosed capital event in the retained set is June 2025 debt financing of EUR 117 million / $137 million led by Rand Merchant Bank with British International Investment, Finnfund, and Norfund. Those lenders framed the facility as working-capital and expansion funding rather than a fresh equity repricing, so chapter 1 should still treat the 2021 Series A as the latest confirmed valuation event. Public sources do not disclose current ownership percentages, liquidation preferences, or board rights for either the 2021 equity syndicate or the 2025 lenders. That leaves
    the capital narrative strong on milestone facts but incomplete on governance economics.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO032
  tableRefs:
  - TO003
- id: scale-pricing-and-footprint
  title: Scale, pricing, and operating footprint
  body: 'The strongest current scale indicators come from the June 2025 debt announcement and adjacent profiles. Investor and media coverage consistently place Wave above 20 million monthly active users, above 150,000 agents, and above 3,000 employees across the continent, while official consumer surfaces keep emphasizing the same consumer promise that drove adoption: free cash-in and cash-out, free bill pay, and 1% transfers. At the same time, public footprint data are not perfectly clean. App-store listings clearly show live retail support numbers for Burkina Faso, Côte d’Ivoire, The Gambia, Mali, Senegal, and Uganda, whereas 2025 financier materials describe eight mainly West African markets and June 2025 Cameroon authorization, and one 2026 profile stretches the footprint to roughly 11 African countries. Headcount disclosure is similarly mixed: Y Combinator’s profile excerpt says 1,600 employees based in Dakar, while debt-round materials say 3,000-plus employees across the continent.
    Those inconsistencies do not undermine the core conclusion that Wave has reached meaningful scale, but they do mean exact coverage and staffing should be diligence asks rather than accepted as perfectly reconciled facts.'
  claimRefs:
  - CO005
  - CO013
  - CO014
  - CO015
