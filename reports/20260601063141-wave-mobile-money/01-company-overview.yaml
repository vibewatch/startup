company:
  name: Wave Mobile Money
chapter:
  number: 1
  title: Company Overview
  summary: Wave Mobile Money is a Senegal-anchored fintech launched in 2018 by Drew Durbin and Lincoln Quirk after Sendwave, with public product surfaces centered on free cash-in and cash-out, free bill pay, and a 1% transfer fee. The best-corroborated capital milestones are the September 2021 $200 million Series A at a $1.7 billion valuation and the June 2025 EUR 117 million / $137 million debt facility led by RMB with BII, Finnfund, and Norfund, while 2025 lender materials place Wave above 20 million monthly active users and 150,000 agents. The main open diligence items are exact board composition, precise country footprint, and reconciling public employee-count disclosures that range from 1,600 Dakar-based staff to 3,000-plus employees across the continent.
sections:
- id: identity-and-product
  title: Identity, product, and regulatory anchor
  body: 'Wave Mobile Money is a Senegal-anchored mobile-money platform built to make everyday digital finance dramatically cheaper than telecom-led incumbents. The company traces its operating story to Drew Durbin and Lincoln Quirk, who sold remittance startup Sendwave and then focused on domestic money movement in Africa, starting with Senegal in 2018. Its consumer proposition remains unusually simple across official surfaces: deposit, withdraw, and pay bills for free, then pay a flat 1% fee for peer-to-peer transfers. That low-fee retail wedge is paired with an agent network for cash conversion, QR-card and app-led usage, and a growing business stack that includes bulk payments, collections, merchant acceptance, and checkout APIs. Wave’s public legal anchor in the retained set is Wave Digital Finance SA in Senegal, which states that it obtained a BCEAO electronic-money-issuer license in April 2022. Taken together, chapter-1 evidence supports a clear identity: Wave is not just a payments
    app, but a regulated, agent-assisted financial network whose core differentiation is radical affordability.'
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  - CO006
  - CO020
  - CO021
  - CO022
  - CO036
  - CO039
