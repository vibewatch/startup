  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current, like-for-like employee count that distinguishes Dakar-based staff from total continental headcount.
    whyItMatters: Staffing is a core maturity signal and current public disclosures conflict materially.
    diligencePath: Request the latest HR roll-up by country and function plus the date and scope behind the YC and lender disclosures.
    relatedQuestionRefs:
    - QO013
  - type: conflicting-data
    severity: material
    topic: market-footprint
    missingEvidence: A regulator- and product-level country list showing which markets are fully live, newly authorized, or only planned.
    whyItMatters: Public sources disagree on whether Wave currently spans six retail countries, eight lender-defined markets, or a broader 11-country footprint.
    diligencePath: Request the latest country status matrix, license map, and launch dates from public affairs or compliance teams.
    relatedQuestionRefs:
    - QO014
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: A current board roster, ownership table, and rights summary for both equity investors and 2025 debt providers.
    whyItMatters: Founder continuity is visible, but governance quality and control rights remain opaque in public sources.
    diligencePath: Request the board observer/director list, post-money cap table, and debt-facility covenant summary under NDA.
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: Current revenue, payment volume, gross profit, and profitability data with a comparable period and definition set.
    whyItMatters: Wave’s operating scale is impressive, but investor judgment still depends on whether user growth converts into durable economics.
    diligencePath: Request the latest management accounts or board deck pages that define revenue, TPV, contribution margin, and profitability by market.
    relatedQuestionRefs:
    - QO025
