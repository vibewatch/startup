- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Wave has built unusual scale in francophone mobile money'
    - 2025 and 2026 sources point to 20M+ MAUs, 150k+ agents, and a very large merchant and payer footprint
    - A weaker view would follow if current revenue or retention fails to scale with that user base
  - - 'THESIS: Low prices and business products create a wider monetization surface than P2P alone'
    - Wave still advertises 1% sends, free cash access, and business payments, collections, and merchant tools
    - The view improves only if management shows that business and merchant products translate into durable margin, not just volume
  - - 'THESIS: Select private capital still pays up for African fintech winners'
    - Moniepoint and Tyme both cleared unicorn marks in 2024, and Djamo still raised in francophone West Africa in 2025
    - The view strengthens if Wave itself can clear a fresh equity round on clean common-equity terms
  - - 'ANTI-THESIS: Public price discovery is stale'
    - Wave's last disclosed equity mark is still the 2021 $1.7B Series A; 2025 capital was debt, not equity
    - The concern eases if management opens a current revenue, margin, and cap-table data room
  - - 'ANTI-THESIS: Price wars and regulatory friction can compress margin and delay growth'
    - Adverse reporting flags fee competition, payment-rail exclusion, and licensing bottlenecks in new markets
    - The concern eases if Wave secures durable regulatory access and shows resilient take rates despite telecom retaliation
  - - 'ANTI-THESIS: Common-equity value may sit below the headline mark'
    - Debt preserves the headline but does not tell investors what common stock is worth after covenants or preferences
    - The concern eases if the company discloses ordinary debt terms and a clean preference stack
  notes: This table separates business-quality support from price-discipline constraints; the chapter is not arguing that Wave lacks scale, only that price support is weaker than the narrative strength.
