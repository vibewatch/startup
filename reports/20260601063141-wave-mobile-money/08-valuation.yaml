- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers retained public payments and remittance peers plus disclosed private African fintech rounds; direct private mobile-money comps with both price and revenue disclosure remain sparse.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Wave
    - 2021 $1.7B equity mark; 2025 debt follow-on only
    - No fresh equity mark since 2021; public support depends on assumed revenue
    - Direct underwrite object with very large user scale and unusually low prices
    - No public current revenue, debt terms, or preference stack
  - - PayPal
    - May 2026 market cap $39.47B; trailing revenue $33.73B
    - ~1.17x sales; ~1.24x EV / sales
    - Global digital-payments benchmark for mature scaled economics
    - Much broader, more diversified, and more profitable than Wave
  - - Remitly
    - May 2026 market cap $4.22B; trailing revenue $1.73B
    - ~2.44x sales; ~2.09x EV / sales
    - Useful listed remittance / cross-border comparator with stronger growth
    - Cross-border remittance differs from domestic mobile-money economics
  - - Block
    - May 2026 market cap $45.07B; trailing revenue $24.48B
    - ~1.84x sales; ~1.87x EV / sales
    - Shows what diversified seller and wallet ecosystems command publicly
    - Different product mix and developed-market infrastructure
  - - Fiserv
    - May 2026 market cap $30.16B; trailing revenue $21.09B
    - ~1.43x sales; ~2.78x EV / sales
    - Useful lower-to-mid public payments multiple anchor
    - Incumbent processor with very different growth and margin profile
  - - Adyen
    - June 2026 market cap $34.53B
    - Premium listed payments platform still worth $34.53B after a 2026 reset
    - Shows where premium global payments equity can still trade after de-rating
    - No like-for-like African mobile-money or consumer-wallet economics
  - - Moniepoint
    - Oct 2024 Series C $110M
    - ~$1B private valuation
    - Closest recent African fintech unicorn comp with explicit private pricing
    - Business banking and acquiring mix differs from Wave's mobile-money core
  - - Tyme
    - Dec 2024 Series D $250M
    - ~$1.5B private valuation
    - Shows that disclosed African fintech winners can still clear large private rounds
    - Digital-bank model and customer monetization differ from Wave
  - - Djamo
    - Apr 2025 raise $17M; 1M customers
    - Growth-stage private round below unicorn scale
    - Useful francophone-West-Africa demand signal
    - Too small and under-disclosed for direct multiple transfer
  notes: The comparable set mixes public payments processors, remittance names, and disclosed private African fintech rounds because direct private mobile-money valuations with current revenue disclosure are scarce.
