tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  rows:
  - - Recommendation
    - TRACK — do diligence, but do not underwrite the 2021 unicorn mark at face value
    - Scale, debt access, and category demand are real, but public valuation support is stale and incomplete
  - - Confidence
    - Medium
    - The qualitative direction is clear, yet current revenue, debt terms, and preference overhang remain private
  - - Risk rating
    - High
    - Regulatory access, telecom price wars, and missing financial disclosure can all move common-equity value quickly
  - - Valuation stance
    - Stretched on public evidence
    - Public payments comps cluster around roughly 1.2x to 2.8x sales, while Wave has no fresh public denominator to prove a premium
  - - Decision implication
    - Require a current revenue bridge, debt documents, and cap-table terms before advancing
    - Without those files, downside may sit far below the stale 2021 headline valuation
  notes: 'The recommendation is explicitly price-sensitive: it reflects real business quality but insufficient public support for paying the old unicorn mark as if it were freshly validated common-equity value.'
