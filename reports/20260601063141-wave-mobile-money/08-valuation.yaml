- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current financials disappoint
    - 2025 or current run-rate revenue lands closer to the bear-case range with weak contribution margin
    - The 2021 unicorn mark would look unsupported by public or private comp ranges
    - Reset valuation toward the bear case and do not anchor to the old headline
  - - Debt terms are restrictive
    - Facility documents show high pricing, tight covenants, or strong security that subordinates common equity
    - Headline enterprise scale would overstate common-equity value
    - Reprice from post-debt common-equity economics, not from the round headline
  - - Preference overhang is heavy
    - Cap table shows participation rights, ratchets, or liquidation preferences that materially skew downside
    - Common-equity upside would be much narrower than the post-money suggests
    - Pause new-money underwriting unless entry price compensates for the preference stack
  - - Regulatory access weakens
    - Wave cannot secure stable payment-rail or licensing access in key expansion markets
    - The long-run growth and margin case would become structurally less credible
    - Cut expansion assumptions and shift to a lower multiple framework
  - - Price war persists
    - Telecoms keep zero-fee or near-zero-fee offers in core and new markets without margin recovery
    - Wave's low-fee advantage becomes less of a moat and more of a ceiling on economics
    - Downgrade confidence and require proof of durable take rate before re-engaging
  notes: 'The key triggers focus on common-equity value, not just company quality: each one is a condition that could make the stale unicorn mark uninvestable even if adoption remains real.'
  claimRefs:
  - CV015
  - CV017
  - CV018
  - CV019
  - CV020
  - CV047
  - CV048
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue bridge
    - 2025 audited revenue, gross profit, current run-rate, and market-level contribution margin
    - Without a real denominator, valuation is still scenario-based rather than underwritten
    - Finance team, auditor pack, and monthly management accounts
  - - Debt terms
    - Pricing, amortization, covenant package, security, and local guarantees on the 2025 facility
    - Debt can preserve the headline mark while materially weakening common-equity value
    - CFO, counsel, and lender documentation
  - - Cap table and preferences
    - Share classes, liquidation preferences, anti-dilution, participation, and convertibles
    - Headline valuation may overstate common-equity economics if preferred protections are strong
    - Legal counsel, cap-table export, and stock purchase agreements
  - - Regulatory roadmap
    - Status of payment-system access, Cameroon licensing, and any banking-license process
    - Expansion value depends on predictable regulatory access rather than ad hoc workarounds
    - Regulatory affairs team and counsel memos
  - - Core-market profitability
    - Senegal and Côte d’Ivoire cohort margin, agent economics, and take-rate stability under competition
    - The bull case requires proof that low prices still translate into attractive unit economics
    - FP&A, market GMs, and agent-network analytics
  - - Exit path
    - Strategic buyer map, sponsor appetite, and evidence for any credible public-market timeline
    - Return underwriting depends on who can own the asset next and on what disclosure standard
    - CEO, bankers, and board materials
  notes: Every diligence ask maps directly to a variable that could change the recommendation or the acceptable entry price.
