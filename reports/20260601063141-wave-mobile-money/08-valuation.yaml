  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Facility pricing, amortization, covenants, security package, and any market-specific guarantees for the 2025 debt raise.
    whyItMatters: Debt can preserve headline valuation while still weakening common-equity economics if the terms are restrictive or expensive.
    diligencePath: Request the signed facility agreement, side letters, covenant summary, and debt-service model from finance and counsel.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Current cap table, share classes, liquidation preferences, anti-dilution clauses, and any participation rights attached to the 2021 round or later instruments.
    whyItMatters: The headline unicorn mark can materially overstate current common-equity value if preferred investors have strong downside protections.
    diligencePath: Request the cap table, stock purchase agreements, shareholder rights agreements, and any subsequent preference amendments from legal and finance.
    relatedQuestionRefs:
    - QV032
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-coverage
    missingEvidence: More disclosed private mobile-money or African payments transactions that include both valuation and current revenue or operating-metric detail.
    whyItMatters: The comparable table necessarily blends mobile money, remittance, broad payments, and private African fintech rounds because clean direct comps remain sparse.
    diligencePath: Request investor deck references, secondary-market marks, and board materials for direct mobile-money peers; supplement with banker and shareholder references.
    relatedQuestionRefs:
    - QV016
    - QV017
    - QV018
    - QV019
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: current-financial-bridge
    missingEvidence: Audited or board-approved 2025 revenue, gross profit, burn, and current run-rate data by core market and product.
    whyItMatters: All scenario ranges rely on payer-count and pricing assumptions because the public record still lacks the actual denominator that would prove or disprove the 2021 mark.
    diligencePath: Request audited financial statements, monthly management accounts, and market-level contribution-margin bridges before accepting any price near the prior headline valuation.
    relatedQuestionRefs:
    - QV023
    - QV024
    - QV025
    - QV026
    - QV027
    - QV028
