- id: comparable-set-and-market-context
  title: Comparable set and market context
  body: 'The retained comparable set points in two directions at once. First, the market is not dead. GSMA and BCG both support a still-expanding African digital-finance backdrop, and private rounds for Moniepoint, Tyme, and even smaller francophone player Djamo show that capital still rewards category winners with proof. Second, current public payment multiples are much more sober than the 2021 venture cycle. PayPal, Block, and Fiserv all sit in a roughly low-single-digit sales band, while Remitly screens higher but still far below the software outliers that once justified easy narrative underwriting. That matters for Wave because the company has not disclosed the denominator that would show whether it belongs near a mature-payments range, a higher-growth remittance range, or somewhere above both because of scarcity and strategic value in African mobile money. The comparable set therefore supports neither an automatic bubble verdict nor a casual endorsement of the stale unicorn mark. It
    supports a narrower statement: Wave could still be valuable enough to deserve serious diligence, but the public market no longer gives free credit for scale alone.'
