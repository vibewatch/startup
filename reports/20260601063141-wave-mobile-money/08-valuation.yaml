- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue assumption
  - Valuation / return logic
  - Probability signal
  - Main downside / upside trigger
  rows:
  - - Bear
    - ~$250M-$300M revenue power from modest payer monetization and shallow merchant uptake
    - 1.2x-1.6x sales implies roughly $300M-$480M of value, far below the stale unicorn mark
    - '~25%: credible if pricing pressure and regulatory friction keep monetization thin'
    - Fee wars, payment-rail exclusion, or weak unit economics force public-comp discounting
  - - Base
    - ~$350M-$450M revenue power from moderate payer throughput plus some business and merchant contribution
    - 2.0x-2.8x sales implies roughly $700M-$1.26B, still below the 2021 mark but not catastrophically so
    - '~50%: most consistent with real scale but incomplete proof on margin and debt burden'
    - Needs evidence that current revenue and contribution margin support a mid-range payments multiple
  - - Bull
    - ~$500M-$650M revenue power if payer throughput, merchant usage, and collections scale together
    - 3.0x-3.8x sales implies roughly $1.5B-$2.47B, the only path that fully defends or beats the prior unicorn mark
    - '~25%: requires much stronger monetization and cleaner economics than public sources currently prove'
    - Current financials show strong ARPU, healthy margins, and no hidden preference or covenant overhang
  notes: These are transparent scenario assumptions, not reported company revenue. They anchor on public payer and pricing evidence because Wave still does not disclose audited current revenue.
