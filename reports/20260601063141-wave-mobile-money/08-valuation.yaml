company:
  name: Wave Mobile Money
chapter:
  number: 8
  title: Valuation
  summary: Wave still has real scale, a differentiated low-fee product, and a lender-backed balance-sheet story, but the last public equity mark is the September 2021 $1.7 billion Series A and the 2025 capital event was debt rather than fresh equity. Current public comp data for payments and remittance names sits in a much tighter sales-multiple band than the 2021 fintech cycle, while adverse reporting flags regulatory bottlenecks and fee-war pressure that could compress common-equity value. The evidence therefore supports a TRACK recommendation with medium confidence, high risk, and a stretched valuation stance until a private data room proves current revenue, debt terms, and preference overhang.
sections:
- id: financing-context-and-entry-discipline
  title: Financing context and entry discipline
  body: 'Wave enters valuation work with a stark mismatch between operating relevance and public price discovery. The operating relevance is easy to see. Official and lender-backed 2025 sources point to eight markets, more than 20 million monthly active users, more than 150,000 agents, and more than 3,000 employees, while the product still markets free deposits, free withdrawals, free bill payments, and a 1% send fee. The price-discovery problem is just as clear. The last publicly disclosed equity valuation is still the September 2021 $200 million Series A at $1.7 billion, and the next large public capital event was the June 2025 debt facility, not a fresh equity round. That means investors can describe Wave as large, real, and financeable without knowing whether common equity at the old unicorn mark is attractive today. Entry discipline therefore has to start from one hard rule: do not confuse a stale headline valuation with a current fair price. A disciplined buyer should assume that the
    old mark is stretched until management proves current revenue, margin, debt burden, and cap-table terms in a private data room.'
  claimRefs:
