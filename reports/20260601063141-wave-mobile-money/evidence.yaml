    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: wave-public-scale-disclosure
    missingEvidence: Current market-by-market Wave active-user, active-agent, and merchant-acceptance disclosures.
