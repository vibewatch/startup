- id: mitigations-and-kill-criteria
  title: Mitigations exist, but underwriting still needs hard kill criteria
  body: The evidence does not support an unqualified negative view. Wave has a real Senegal EMI license, explicit privacy and complaints policies, a responsible-disclosure program, current uptime disclosure, and development-finance-backed lenders. If PI-SPI interoperability rolls out on time, interoperability could actually improve customer convenience and make cross-operator transfers less sticky to incumbent telcos. But the residual risk is still high because the company is simultaneously managing regulatory transitions, a Cameroon partner-only model, a debt-funded expansion phase, and at least one difficult market where the pricing model has not yet translated into profitability. For diligence, the right framing is conditional rather than binary. Wave remains investable only if management can show PI-SPI readiness, independent evidence of fraud and complaint control, credible debt maturity and covenant headroom, and a clearer path from partner-led launches to durable economics. If any
    of those fail, the risk transmission from compliance to customer friction to margin pressure can happen quickly.
