- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - WAEMU interoperability failure
    - PI-SPI onboarding evidence
    - Wave cannot demonstrate customer-facing PI-SPI readiness or remains excluded past June 30, 2026.
    - Pause underwriting or require contractual downside protection tied to rail access.
  - - Cameroon structural dependence
    - Licensing scope and economics
    - Wave remains permanently partner-only in Cameroon without clear economics or standalone licensing path.
    - Treat Cameroon as optional upside, not core valuation support.
  - - Low-fee model stress
    - Country-level profitability / burn
    - Additional markets show Uganda-style losses without a credible turnaround path.
    - Cut growth assumptions and move recommendation toward avoid / research-more.
  - - Refinancing pressure
    - Debt maturity, pricing, covenants, collateral
    - Management cannot show sufficient liquidity headroom or lender support for the next 12-18 months.
    - Assume higher dilution / slower growth and require balance-sheet protections.
  - - Fraud or consumer-protection deterioration
    - Complaint backlog, reimbursements, regulator complaints, fraud losses
    - Material increase in unresolved complaints, reimbursement disputes, or fraud losses.
    - Escalate diligence to sanctions / controls review and suspend positive thesis updates.
  - - Security or service degradation
    - Incident severity and duration
    - Repeated major outage, payment-API instability, or material data incident.
    - Reset customer-retention and trust assumptions immediately.
  notes: These kill criteria translate the evidence into threshold events that can be monitored during diligence or post-investment rather than treated as static narrative risks.
