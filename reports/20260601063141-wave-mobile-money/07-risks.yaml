- id: competition-funding-and-dependency
  title: Competition, funding, and dependency risk could transmit quickly into margins
  body: 'The adverse external picture is not that Wave lacks scale; it is that scale may still require defensive pricing and external capital. TechCabal, Norfund, and Finnfund all describe the June 2025 financing as debt earmarked for working capital and expansion across existing and new markets, which is supportive but also signals that public self-funding is not yet obvious. The same sources describe more than 20 million monthly active users, more than 150,000 agents, and more than 3,000 employees, so even modest execution slippage can have large cash consequences. Weetracker adds the harsher edge: after Wave disrupted Francophone mobile money pricing, incumbents copied the tactic, with MTN removing withdrawal fees in Côte d''Ivoire and Orange Cameroon setting transfer fees to zero ahead of Wave''s launch. Uganda provides the clearest disconfirming case that the low-fee formula is not automatically portable; local reporting shows deeper 2024 losses and earlier retrenchment signals. The
    dependency map is therefore broad: Wave needs CBC for Cameroon entry, BCEAO-linked rails for interoperability, agents for liquidity and coverage, and lenders for balance-sheet flexibility.'
