company:
  name: Wave Mobile Money
chapter:
  number: 7
  title: Risks
  summary: Wave's biggest current risk cluster is regulatory and model-linked, not product-market-fit. Official Wave, BCEAO, BEAC, and Bank of Uganda materials show a multi-jurisdiction business that relies on licenses, payment-system access, KYC/privacy compliance, and local bank or regulator approvals, while 2025-2026 reporting adds adverse evidence on Cameroon entry constraints, PI-SPI deadlines, telco fee retaliation, and continued working-capital dependence. The risk picture is mitigated by real scale, published complaints/security processes, and strong lenders, but residual exposure remains high until Wave proves interoperable rail access, country-by-country licensing throughput, and economically durable expansion outside core WAEMU markets.
sections:
- id: regulatory-legal-licensing
  title: Regulatory and legal exposure is the first-order risk
  body: 'Wave is not operating in a single homogeneous market. Its Senegal entity, Wave Digital Finance, holds a BCEAO electronic-money license, but the 2025-2026 evidence base shows that regional expansion still depends on country-by-country approvals, payment-system access, and local supervisory sequencing. BCEAO-backed PI-SPI infrastructure is now the central rail for interoperable instant payments in WAEMU, and third-party reporting says banks, microfinance institutions, electronic-money issuers, and payment institutions must connect by June 30, 2026. That deadline matters because missing regional interoperability would directly weaken customer convenience and merchant utility. Cameroon is even more constrained: Wave''s 2025 launch there sits under CBC and COBAC approval, excludes direct mobile-money issuance, and adds BEAC/GIMAC reporting and interconnection obligations. Uganda adds another regulator, with Wave''s local terms expressly tying amendments to Bank of Uganda authorization.
    The legal layer is similarly non-trivial because Wave publicly acknowledges extensive KYC, personal-data, and complaint-handling obligations. Together, these facts make regulatory execution the clearest thesis-break category: Wave can scale only as fast as licenses, rails, and compliance approvals clear.'
