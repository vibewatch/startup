- id: operations-fraud-consumer-protection
  title: Operational, fraud, and consumer-protection risk sit behind the low-fee promise
  body: 'Wave''s public promise is straightforward: free deposits and withdrawals, 1% transfers, toll-free support, and strong security. The status page even showed 100% uptime over the prior 90 days on the day of review. Those are real mitigants, but they do not eliminate the structural risks of a mobile-money network that relies on agents, merchant acceptance, real-time payment APIs, KYC checks, and customer recourse. The company''s own privacy notice confirms that it collects identity documents, location data, and law-enforcement-sourced information to satisfy legal obligations and fight fraud. Its complaints policy commits to tight payment-complaint SLAs, yet public complaint volumes and fraud-loss disclosures are absent. The broader mobile-money sector evidence from GSMA is a useful adverse benchmark: impersonation, insider fraud, agent fraud, social engineering, cash-in/cash-out abuse, and KYC breaches remain common attack paths. Wave therefore looks operationally mature enough to
    publish governance processes, but not transparent enough for an investor to underwrite fraud losses or service quality from public evidence alone.'
  claimRefs:
