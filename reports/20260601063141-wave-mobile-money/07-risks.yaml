  evidenceGaps:
  - type: missing-source
    severity: material
    topic: outage-transparency
    missingEvidence: Wave does not publicly disclose multi-quarter incident counts, outage duration distribution, or postmortems beyond the current status surfaces reviewed.
    whyItMatters: Operational resilience is core to a low-fee, high-volume payments platform; thin historical outage data makes it hard to underwrite customer trust and regulator tolerance.
    diligencePath: Request 12-24 months of incident logs, severity taxonomy, recovery-time metrics, and board or risk-committee review packs for major incidents.
    relatedQuestionRefs:
    - QR012
  - type: missing-source
    severity: material
    topic: banking-pivot-governance
    missingEvidence: Public reporting names executives for Wave Bank Africa but does not disclose board composition, delegated authorities, governance committees, or regulator feedback on the charter application.
    whyItMatters: The banking pivot could reshape risk appetite, capital needs, and compliance burden; concentrated decision-making without clear governance would increase execution risk.
    diligencePath: Obtain incorporation documents, draft license application, governance charter, local board roster, and regulator correspondence for Wave Bank Africa.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: debt-terms-and-refinancing
    missingEvidence: Public sources disclose the size and purpose of the 2025 debt facility but not maturity schedule, pricing, collateral, covenants, or headroom under downside cases.
    whyItMatters: Without debt terms, investors cannot judge refinancing risk, cash-flow sensitivity, or how quickly price pressure and regulatory delays would hit liquidity.
    diligencePath: Request debt agreements, covenant model, collateral package, maturity ladder, and any lender waivers or extension options.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: fraud-and-complaint-volumes
    missingEvidence: Wave publishes policies but does not publicly provide fraud-loss rates, complaint inflow, reimbursement rates, sanctions, or regulator-escalation metrics by market.
    whyItMatters: Policies show intent, but control effectiveness depends on case volumes and outcomes; without them, consumer-protection and AML/fraud risk remain largely unquantified.
    diligencePath: Request monthly fraud dashboards, complaint aging, reimbursement ratios, suspicious-activity reporting trends, and any sanctions or consent orders.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: cameroon-standalone-license-path
    missingEvidence: Public reporting confirms a CBC-sponsored Cameroon launch, but not whether Wave has filed or intends to file for a standalone licensing path under CEMAC rules.
    whyItMatters: A permanent partner-only model could limit economics, product breadth, and strategic control in one of Central Africa's most important mobile-money markets.
    diligencePath: Ask for Cameroon legal strategy, filed applications, regulator feedback, and market-entry economics under both partner-only and standalone scenarios.
    relatedQuestionRefs:
    - QR005
    - QR006
    relatedTableRefs:
    - TR001
    - TR003
