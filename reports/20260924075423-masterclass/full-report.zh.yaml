      - number: '6.3'
        title: 客户满意度与用户评价
        blocks:
          - type: paragraph
            body: >
              MasterClass 展现出鲜明的“双重信号”特征：深入消费内容的用户给出极高评价，而在订阅流程中遭遇问题的用户则怨声载道。PCMag 在 2026 年评测中给出了 4.5/5 评分和 Editors'
              Choice 认定，高度盛赞其制作水准、导师阵容以及名人引领带来的启发价值。Apple App Store 超过 19,600 条评分显示均分为 4.6/5，表明活跃移动端用户拥有极高满意度。TechRadar
              同样将 MasterClass 评为顶尖在线学习平台之一。


              与之形成鲜明反差的是，截至 2025 年 12 月，Trustpilot 汇总的 1,059 条评价给出了 1.6/5 的“差”评。Trustpilot 的 AI
              生成摘要提炼出核心槽点：在缺乏明确提示或同意的情况下强制自动续费；退订按钮被指隐匿或无法点击；扣款后即便立刻申请退款也遭断然拒绝；客服基本全由 AI 机器人充当，完全无法转接人工客服。Sitejabber
              上的评价反映了同样的现象。商业改进局（BBB）也接到了多起消费者投诉，指控其未经授权扣费且退款艰难，与 Trustpilot 的数据相互印证。《The Atlantic》2023
              年的调查则提出了更根本的质疑：MasterClass 究竟有没有兑现其教育承诺，抑或只是提供无法沉淀为实操技能的“启发式娱乐”。


              App Store 与 Trustpilot 评分的分化符合商业常理：在应用商店评分的用户是深入体验产品并认可其价值的学习者；而在 Trustpilot
              撰写负评的用户往往由糟糕的扣费退款体验触发，无需深入接触内容。两组信号均具备尽调价值。Trustpilot
              所记录的用户体验与账单纠纷构成了重大的监管合规与声誉风险，尤其在自动续费监管更为严苛、诱导性设计（dark pattern）诉讼高发的欧盟市场更是如此。
