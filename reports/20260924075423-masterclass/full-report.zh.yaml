      - number: '5.2'
        title: 技术平台与 AI 功能
        blocks:
          - type: paragraph
            body: >
              MasterClass 的技术栈围绕高带宽视频流媒体、用于推荐相关课程的推荐引擎以及多平台分发架构构建。该平台支持 Web 浏览器（Chrome、Firefox、Safari）以及 iOS、iPad、Mac 和
              Apple TV 上的原生应用。iOS 与 Android 应用包含纯音频模式，可在播放中剥离视频画面，便于在移动途中进行播客式收听；另提供离线下载功能（仅限 Plus 和 Premium
              方案订阅用户），支持下载完整课程以便断网播放。移动端支持于 2018 年 4 月首次上线，自此成为核心产品功能之一。


              公司未公开披露底层技术基础设施——包括云服务商、CDN 合作伙伴、AI/ML
              平台或视频编码管线——这与其作为非上市公司、没有公开的投资者披露的状态一致。推荐引擎确实存在并实现了个性化课程展示，但其算法机制未见文档说明。MasterClass
              的视频制作管线并非普通的内容托管模式：课程在受控的专业影棚环境中采用电影级标准拍摄，MasterClass 制作团队与授课名师紧密配合，打磨课程结构、先后顺序与视觉呈现。


              MasterClass On Call 是近期技术上最具创新性的功能。On Call 提供 AI 助手，模仿少数精选导师的声音特征，针对开放式提问给出符合该导师专业领域与语调风格的建议。在 Beta
              测试期间，PCMag 评测人员花了一个多小时与 Chris Voss 的 On Call AI 互动，发现它虚构了一本书，并且在不同对话会话之间出现自相矛盾——以 $15/月
              的定价来看，这是重大的质量隐患。技术上 On Call 属于独立于核心订阅之外的产品，需要单独付费。


              MasterClass Certificates 整合了 AI 评分的书面作业，学员就自身工作相关的提示提交答案。AI 依据公开的标准量表打分。PCMag
              评测发现，仅靠重复关键词即可轻松通过评分，这引发了对数据隐私（作业要求提供具体项目名称和业务细节）以及该证书实际价值的担忧。对于在 MasterClass at Work
              与正规认证平台之间评估的企业采购方而言，这些都是尽调中必须关注的劣势。
