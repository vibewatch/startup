  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与课程内容体系
        blocks:
          - type: paragraph
            body: >
              MasterClass 是一家同时面向个人（DTC）与企业（B2B）的订阅制平台，主打由名流名师讲授的视频课程。产品的底层架构由三档个人订阅方案与一项企业级方案构成，均可畅看汇聚 200 多位名师、3,500
              多节精炼小课的统一课程库，内容横跨 11
              个大类。各订阅档位的差异体现在多设备同时在线数与离线下载权限，而非课程访问范围——Standard（$120/年）支持单设备在线点播，不可离线；Plus（$180/年）增加离线下载并支持 2
              台设备同时在线；Premium（$240/年）将同时在线设备数扩至 6 台以供家庭共享。MasterClass at Work（$180/席位/年）则以企业授权采购模式面向企业团队开通访问。


              11
              个内容品类涵盖表演与舞台艺术、艺术与设计、商业与创业、社区与政府、影视、美食与饮品、游戏与数字媒体、健康与身心、音乐、户外探险与赛事，以及科学与技术。各品类的规模分布并不均衡：影视与写作（艺术大类的一个分支）拥有尤为庞大的名师阵容，汇集了
              Martin Scorsese、Spike Lee、Helen Mirren、Samuel L. Jackson、Amy Poehler、Margaret Atwood、Malcolm
              Gladwell、James Patterson 等诸多名家。烹饪课主打 Gordon Ramsay、Thomas Keller、Wolfgang Puck 与 Massimo Bottura；音乐板块汇聚
              Alicia Keys、Christina Aguilera、Usher 与 Hans Zimmer；体育板块则囊括 Serena Williams、Steph Curry、Lewis Hamilton 与
              Wayne Gretzky。


              公司在 2024–2025 年推出了两条全新产品线，进一步丰富了产品矩阵：MasterClass Certificates 是联合权威机构（Navy SEAL Foundation、The Moonshot
              Factory、Microsoft、Nvidia）共同打造的认证课程，在视频之外补充阅读资料、互动测试与书面作业——相比标准的纯讲座式课程是结构性的创新；MasterClass On Call 则是 AI
              驱动的增购服务（$15/月或 $95/年），支持用户与基于特定名师声音模型训练的 AI 进行交互式问答，截至 2026 年中该产品仍处于测试阶段（Beta）。礼品卡订阅服务与对 15
              种语言的支持，共同完善了产品的全球化可用性。
