      - CR007
      - CR025
      - CR032
      - CR033
      - CR034
      - CR035
    data:
      nodes:
        - id: masterclass-core
          label: MasterClass（核心平台）
          detail: 订阅式流媒体平台；涵盖 B2C 与 B2B；提供 AI On Call 附加功能
        - id: celebrity-instructors
          label: 明星名师（200+）
          detail: 品牌护城河与内容供给；top-20 名师贡献了不成比例的获客与续费价值
