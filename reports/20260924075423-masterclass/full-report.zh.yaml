    title: 可比公司估值表
    notes: >
      上市公司数据来源于截至 2025 年年中的最新季度申报文件及市场数据。非上市公司数据（MasterClass、Skillshare）代表分析师估算及已公开的轮次数据；未见经审计的数据。上市公司的 EV/Revenue
