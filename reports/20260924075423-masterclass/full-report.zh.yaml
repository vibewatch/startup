  - id: TV005
    title: 逻辑推翻与终止触发条件
    notes: >
      触发条件按严重程度与紧急程度排序。任何单项 Tier-1 触发条件均应促使立即重新评估投资逻辑并考虑退出。Tier-2 触发条件属于方向性信号，在采取行动前需进一步积累证据。所有触发条件均依据公开可观察的证据来源（SEC
      申报文件、新闻稿、员工数据库）进行定义，无需内部信息即可实现监测。
    claimRefs:
      - CV004
      - CV005
      - CV011
      - CV015
      - CV016
      - CV017
      - CV019
      - CV034
      - CV039
      - CV040
    columns:
      - 层级
      - 触发条件
      - 可观察的阈值
      - 对投资逻辑的传导
      - 行动建议
    rows:
      - - Tier 1（否决）
        - 发生第三轮重大裁员
        - '>10% 的减员公开宣布'
        - 证实收入减速超出基准情景预期；运营陷入更深困境
        - 退出或停止跟投；将风险评级上调至极高（Critical）
      - - Tier 1（否决）
        - 证实收入低于 $100M ARR
        - 任何经审计或第三方报道的 ARR 低于 $100M
        - 悲观情景确立；基准情景排除；并购价值跌破 $200M
        - 立即退出或展开折价贱卖谈判
      - - Tier 1（否决）
        - Fidelity 强制清算或估值归零
        - SEC NPORT-P 申报文件显示对 Yanka Industries 的持仓估值为 $0 或象征性名义价值
        - 意味着公司濒临破产，或股权价值已被完全清零
        - 立即终止投资逻辑；记录处理流程以向 LP 汇报
      - - Tier 2（预警）
        - 流失互动度最高的前 5 位名人导师
        - 最高互动梯队中的导师公开宣布不再续约或离开平台
        - 品牌资产受损；面临订阅用户加速流失风险
        - 在接下来的两个季度内密切监测流失证据；收紧退出触发条件
      - - Tier 2（预警）
        - 生成式 AI 竞对推出名人声音模拟，定价 <$30/年
        - YouTube、Netflix 或专门的生成式 AI 平台发布具备类似声音 / 风格模拟能力的产品
        - 核心品牌护城河面临直接替代压力；AI 反向逻辑被触发
        - 加速尽调 AI On Call 的 ARR 数据；重新审视乐观情景发生概率
  - id: TV006
    title: 最终尽调需求清单
    notes: >
      截至 2026 年 5
      月，所有事项均为无法从公开渠道获取的信息。各项按其对估值模型的重要性进行排序。在缺乏这些信息的情况下，估值分析依赖于存在显著不确定性区间的交叉测算。责任人一栏标明了最适合提供该信息的各方；尽调路径则指出了在无法获取一手数据时可查阅的公开替代证据。
    claimRefs:
      - CV003
      - CV018
      - CV019
      - CV033
      - CV034
      - CV040
    columns:
      - 优先级
      - 议题
      - 缺失的证据
      - 为何关键
      - 责任人 / 尽调路径
    rows:
      - - P1 —— 关键
        - 当前 ARR 与增长率
        - 自 2021 年 5 月 Series F 以来未见公开收入披露
        - 最核心的估值输入变量；ARR 变动 1x 会带动基准股权价值变动 $150–700M
        - CFO（首要责任人）；替代路径：LinkedIn 员工数变动、App Store 排名趋势、Sensor Tower 下载量
      - - P1 —— 关键
        - 股权结构表与优先股堆叠
        - 未公开披露；历经 6+ 轮融资累计筹集 $461M，意味着存在巨额清算优先权
        - 决定了在不同退出价格下各类投资者的收益分配；对回报建模至关重要
        - 法律顾问（首要责任人）；替代路径：SEC Form D 历史申报文件（可获取部分数据）
      - - P1 —— 关键
        - 订阅用户数与流失率
        - 未公开披露总订阅用户数、月活跃用户数或年续费率
        - ARPU × 订阅用户数 = ARR；流失率决定了 LTV 以及所适用的估值倍数
        - CFO / 数据团队（首要责任人）；替代路径：Sensor Tower 的 DAU 趋势、App Store 评价量
      - - P2 —— 高
        - B2B 企业级 ARR 与客户数
        - MasterClass at Work 于 2022 年推出；未向公众披露收入贡献
        - B2B 是核心乐观逻辑；若未能形成规模，将抹去基准情景下 $400M+ 的价值
        - 销售 / 首席营收官（CRO，首要责任人）；替代路径：LinkedIn 上 B2B 销售职位的招聘信息、客户合作公告
      - - P2 —— 高
        - 现金跑道与当前烧钱速度
        - 未披露资产负债表；$225M Series F 于 2021 年 5 月交割，后续未确认任何新轮次
        - 决定了退出的时间压力；若跑道 <18 个月，折价贱卖风险将显著增加
        - CFO（首要责任人）；替代路径：员工人数 × 估计的全口径成本；办公室租赁公开记录
      - - P3 —— 中
        - Fidelity NPORT-P 中对 Yanka Industries 的精确估值
        - SEC NPORT-P 显示基金持仓；无法从汇总数据中单独提取 MasterClass / Yanka Industries 的估值标注
        - 当前公允价值的最佳公开替代指标；可大幅收窄 $275–550M 的悲观 / 基准区间
        - SEC EDGAR（公开）；若欧盟注册基金持有该仓位，可参考英国 FCA 对应披露
