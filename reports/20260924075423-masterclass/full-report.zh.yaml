    title: 公司里程碑时间线
    type: timeline
    summary: |
      MasterClass 从 2014 年 10 月成立到 2024–2025 年推出 AI 产品的企业与产品发展历程，包括全部六轮融资、两次员工裁减负面事件、内容治理里程碑及关键行业认可。
    claimRefs:
