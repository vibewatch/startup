      - number: '1.4'
        title: 里程碑、市场背景与不利事件
        blocks:
          - type: paragraph
            body: >
              MasterClass 的发展历程在斩获成长里程碑的同时，也伴随着数起重大不利事件。2017 年底，因演员 Kevin Spacey
              陷入可信的性侵指控，公司将其课程下架，成为平台首次遭遇名师争议的标志性事件。这也为此类极度依赖名师的商业模式敲响了内容治理风险的警钟。2022 年 6 月，据 CNBC
              报道，受疫情期需求激增消退后订阅增长放缓影响，公司裁撤了约 20% 的员工——按约 480 名员工基数计算，涉及大约 96 人。2023 年 1 月，据 The Guardian 报道，MasterClass
              又对剩余员工实施了约 13% 的裁员，折射出在 EdTech 融资环境趋紧的背景下持续承受的成本压力。


              尽管挑战严峻，MasterClass 仍分别在 2020 年与 2021 年荣获 Webby Awards，数字化体验水准获得行业认可。据 HolonIQ 预估，全球 EdTech
              市场体量达数百亿美元并具备强劲增长前景，构成了有利的长期基本面，但短期内竞争格局异常激烈。主要对手包括 Coursera（全球 148M+ 学员）、Udemy（庞大的实用技能库）、LinkedIn
              Learning（2024 年学员学习时长突破 1 billion 小时）以及 Skillshare（主打创意技能）。MasterClass
              靠名流导师品牌与顶尖制作水平形成差异化，但在职业技能与权威认证内容的覆盖度上处于竞争劣势。Trustpilot 上的评价褒贬不一，部分用户盛赞内容品质，亦有用户批评订阅价格缺乏性价比。SimilarWeb
              监测显示 masterclass.com 拥有可观的月度访问流量，但具体数值存在波动且仅为估算值。
