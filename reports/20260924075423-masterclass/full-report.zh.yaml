        - 高 —— Trustpilot 投诉模式是表面违规的直接证据
        - 获取针对取消流程的独立体验审计；取得外部法律顾问关于 FTC 合规性的意见书
      - - 《联邦贸易委员会法》第 5 条（FTC Act Section 5）—— 欺诈 / 不公平商业行为
        - 美国 —— 联邦
        - 常态化生效法规；目前未确认存在执法行动
        - 中 —— 持续的消费者投诉模式可能引发调查
        - 高 —— 禁令救济；民事罚款；声誉受损
        - 服务条款披露；公示退款政策（充分性尚未证实）
        - 中 —— 未见已确认投诉；Trustpilot/BBB 投诉趋势推高了风险
        - 索取法律顾问合规备忘录；确认 FTC 投诉数据库中无相关记录
      - - 加州自动续订法（California Automatic Renewal Law，Cal. Bus. & Prof. Code §17600–17606）
        - 美国加利福尼亚州
        - 现行有效；加州总检察长与私人原告律师团队积极执法与诉讼
        - 高 —— MasterClass 总部位于旧金山；加州自动续订法直接适用
        - 高 —— 集体诉讼风险；总检察长执法；赔偿金 + 罚款
        - 结算流程中的年度续订披露（格式/充分性尚未证实）
        - 高 —— 违反加州自动续订法将引发按订阅用户计费的损害赔偿；集体诉讼经济效益极不对称
        - 依据自动续订法核对清单，审查加州专属结算披露与取消流程体验
      - - CCPA / CPRA（加州消费者隐私法及其 2023 年修正案）
        - 美国加利福尼亚州
