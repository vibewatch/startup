        - 中 —— 涉及海外订阅用户；欧盟/英国学员数据受 GDPR 约束
        - 高 —— 最高可达全球年营业额的 4% 或 €20M；欧洲市场声誉受损
        - 隐私政策涵盖 GDPR；DPA 登记状态及标准合同条款（SCC）/充分性认定依据未披露
        - 中 —— 针对持有欧盟用户数据的非欧盟企业执法屡见不鲜；同意授权机制需行审计
        - 确认 DPA 注册登记、SCC 或充分性认定依据，以及针对欧盟/英国用户的同意授权管理
      - - COPPA —— 儿童在线隐私保护法（Children's Online Privacy Protection Act）
        - 美国 —— 联邦
        - 现行有效；由 FTC 负责执法
        - 低 —— MasterClass 设置了 18+ 年龄门槛；风险属于残留性质
        - 中 —— 面临 FTC 民事罚款；声誉受损
