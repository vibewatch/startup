      - number: '6.2'
        title: B2B 与企业级客户群体
        blocks:
          - type: paragraph
            body: >
              MasterClass at Work 是公司的 B2B 产品，是在经历 2022 年和 2023 年裁减约三分之一员工后，向企业培训（L&D）战略转型的产物。该企业产品对 50 个席位以下团队的定价为
              $180/seat/yr，更大规模的企业客户则需经由销售团队获取定制报价。B2B
              版本包含与消费级完全一致的课程库，但增设了专为企业培训设计的功能：支持向团队或个人指派学习内容、核心技能与学员活跃度分析看板，以及消费者端没有的企业专享培训材料。


              Deloitte 是目前唯一公开具名的企业客户，MasterClass 引用了“销售与利润提升 353%”的成效数据，并展示了 Deloitte 主管对培训投资回报率“极为惊人”的证言。MasterClass
              企业版营销主页虽声称“Fortune 500 强企业信赖我们”，但未列出任何其他具名客户。公司还面向员工福利项目推出了 $120/individual
              起步的企业礼品方案，支持批量采购礼品会员，而无需签订长期续约的企业授权协议。


              截至 2025–2026 年，鉴于公司持续深耕消费端且企业业务起步较晚（约 2023 年），B2B 业务在总营收中几乎可以肯定只占较小比重。不过，相比 B2C
              散客，企业席位的客户终身价值（LTV）更高，现金流也更稳固。缺乏主流 LMS 系统集成、缺少权威认证凭证，以及《The Atlantic》（2023 年）对其“启发式娱乐”标签的质疑，是其在同 Coursera
              for Business 和 LinkedIn Learning 竞争中阻碍 B2B 扩张的核心瓶颈。
