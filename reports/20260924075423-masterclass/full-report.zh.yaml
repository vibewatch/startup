      - number: '7.4'
        title: 技术、AI 颠覆与平台依赖风险
        blocks:
          - type: paragraph
            body: >
              从长期来看，生成式 AI 是对 MasterClass 竞争护城河构成最本质威胁的结构性风险。MasterClass 的差异化壁垒立足于两大支柱：(1) 对各领域顶尖名师资源的独家锁定；(2)
              打造沉浸式学习体验的电影级制作水准。AI On Call 产品（于 2023 年底/2024 年初上线，定价 $15/月）表明 MasterClass 本身正在借助 AI
              模拟导师声音并提供对话式问答互动——而同样的技术一旦掌握在竞争对手或开源模型手中，就能以近乎为零的边际成本复刻类似的交互体验。声音克隆与 AI 数字人工具（如
              ElevenLabs、HeyGen、D-ID）正在飞速演进。即便难以复制其品牌声望，复刻其产品形态的技术门槛也正在逐季降低。


              平台依赖风险严重且未见公开披露。MasterClass 在全球范围内提供流媒体播放，其底层架构几乎必然依赖大型云服务商（极可能是 AWS）以及 CDN 厂商。重大的云服务宕机、CDN 中断，或 Apple App
              Store、Google Play 单方面调整政策（如提高抽成比例或实施内容审查干预），均会瞬间冲击其服务交付或资金结算。Apple App Store 对应用内购买抽取 30% 的收入分成；若
              MasterClass 订阅收入中有相当比例来自 iOS 渠道，将构成严重的利润拖累及单点通道依赖风险。公司未公开披露其底层基础设施供应商、应用内购买占比或平台敞口数据。


              关键人物风险高度集中于 David Rogier——自联合创始人 Aaron Rasmussen 于 2017 年 1 月离开后唯一的在职联合创始人兼 CEO。近十年来，Rogier 一直是
              MasterClass 的对外部形象代言人与最高战略制定者。未见任何公开的接班计划、COO 人选或明确指定的二号人物文档记录。裁员之后的高管团队（除 Rogier
              外）未见公开披露，引发了尽调层面的信息黑箱：公司是否保留了足以推进 B2B 转型和 AI 产品落地所需的技术研发、内容制作与商业化领导力，存在极大不确定性。GDPR 与 CCPA
              的合规要求——包括被遗忘权请求、面向企业客户的数据处理协议以及数据主体访问请求响应——对研发人员在 2022–2023 年裁员中被大幅削减的公司而言，构成了持续的运营与声誉风险。
