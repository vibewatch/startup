  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 收入模式与定价体系
        blocks:
          - type: paragraph
            body: >
              MasterClass 采用以订阅为主的收入模式，核心为三档按年付费会员：Standard（$120/年）、Plus（$180/年）与 Premium（$240/年）。订阅会员可无限制畅看涵盖 200+
              位名师、3,500+ 节课程的完整目录。自创立初期以来，其定价体系大体保持稳定，但公司会不定期推出促销折扣（监测到最高达 50%
              off），导致每位订阅用户的实际变现收入难以测算。礼品卡订阅产品可带来一次性进账，但不属于经常性收入流。


              2020–2021 年，MasterClass 面向企业培训与组织学习（L&D）团队推出企业级 B2B 产品 MasterClass at Work，定价为每席位每年 $180。公司官网与《纽约时报》（New
              York Times）均证实了该产品的存在，但企业渗透率、合同数及收入贡献均未公开。拓展 B2B 是公司降低对 C 端依赖、分散收入来源的主动尝试；高额营销费用与名人合约费已压低 C 端单位经济效益。


              2024–2025 年，公司推出基于名师声音模型生成问答的 AI 产品 MasterClass On Call，按月收费 $15。On Call
              作为增量增购收入流，有效盘活了既有的内容沉淀；其收入贡献与用户采纳规模未见公开报道。对于按年收取的订阅款项，收入确认通常遵循递延收入模式（预先收款、按期摊销确认），这在订阅制软件中属于通用做法；但尚无公开财务报表证实这一会计处理。


              B2C 个人订阅、B2B 企业席位与 AI 增购服务的结合，为 MasterClass 带来了三条经济模型迥异的收入流：B2C 走高客流、低客单路线，B2B 走中等客流、中等客单并依托企业直销驱动，AI
              业务则刚刚起步。各收入流之间的具体营收结构未见公开披露。
