      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >
              MasterClass 由 David Rogier 与 Aaron Rasmussen 于 2014 年 10 月联合创立。Rogier 拥有斯坦福大学学位与哈佛商学院 MBA 学位，自公司创立起一直担任
              CEO，截至 2026 年 5 月仍在任。Rasmussen 具备技术与设计专长，于平台公开上线约两年后的 2017 年 1 月以个人原因为由离职。公开报道未显示这次离职扰乱了公司运营或融资。


              截至 2026 年，高管团队由 CEO David Rogier、首席财务官（CFO）Valen Tong、首席营销官（CMO）David Schriber 以及首席内容官（CCO）Len Amato
              组成。Amato 曾任 HBO Films 总裁，掌握着对招募顶尖名师至关重要的影视娱乐行业资源。公司的关键人物依赖主要集中在 Rogier（战略、愿景、投资人关系）与
              Amato（名师招募管线）。MasterClass 属于私有企业，未见公开披露其董事会席位构成、投资人治理权益或股权结构表（cap table）。除 Rasmussen 于 2017
              年离开外，未见其他高管重大不利变动的公开报道。公司治理结构对外界依然不透明，符合该发展阶段非上市公司的普遍特征。
