    data:
      items:
        - label: 成立（Yanka Industries Inc.）
          date: 2014-10
          details: David Rogier 与 Aaron Rasmussen 在加州旧金山注册成立 Yanka Industries Inc.。商业概念为：名人讲授的视频课程。
          tone: positive
        - label: 网站上线
          date: 2015-05
          details: MasterClass.com 正式向公众上线，首发导师包括 Dustin Hoffman、Serena Williams 和 James Patterson。
          tone: positive
        - label: Series A —— $15M
          date: '2016'
          details: $15M Series A 融资；机构投资者未公开披露。资金用于早期团队扩张与导师阵容扩充。
          tone: positive
        - label: 联合创始人离职
          date: 2017-01
          details: Aaron Rasmussen 辞去联合创始人职务并离开公司。David Rogier 作为唯一的创始高管继续执掌公司。
          tone: neutral
        - label: 下架 Kevin Spacey 课程
          date: 2017-10
          details: 在出现可信的性侵指控后，MasterClass 下架了 Kevin Spacey 的表演课程，树立了内容治理的先例。
          tone: warning
        - label: Series B —— $35M
          date: '2017'
          details: $35M Series B 融资充实了资金实力，用于市场营销及扩充导师阵容。
          tone: positive
        - label: Series C —— $80M
          date: '2018'
          details: $80M Series C 进一步扩大平台规模；为公司确立主流 EdTech 地位奠定基础。
          tone: positive
        - label: Series E —— $100M（Fidelity）
          date: 2020-05
          details: 在疫情带动的需求激增背景下，Fidelity Investments 领投 $100M Series E 融资，估值约为 ~$800M。
          tone: positive
        - label: 2020 年 Webby Award
          date: '2020'
          details: MasterClass 荣获 Webby Award 最佳教育网站奖，印证了其高品质制作水准。
          tone: positive
        - label: Series F 轮 — 融资 $225M，估值 $2.75B
          date: 2021-05
          details: Series F 轮以 $2.75 billion 估值融资 $225M（顶峰估值）；系全球估值最高的 EdTech 公司之一。
          tone: positive
        - label: 2021 年 Webby Award
          date: '2021'
          details: 连续第二年斩获 Webby Award 最佳教育平台奖。
          tone: positive
        - label: 裁员 20%
          date: 2022-06
          details: 疫情后需求回归常态，MasterClass 裁员约 96 人（约占 ~480 名员工的 ~20%）。
          tone: warning
        - label: 追加裁员 13%
          date: 2023-01
          details: 第二轮裁员削减剩余员工的约 13%；在 EdTech 行业低迷期优化成本结构。
          tone: warning
        - label: 上线 MasterClass On Call
          date: '2024'
          details: 采用讲师声音模型的 AI 互动问答增值服务（$15/month）；业务重心转向对话式学习。
          tone: neutral
