      - number: '2.4'
        title: 市场趋势与宏观顺风
        blocks:
          - type: paragraph
            body: >
              多项宏观趋势在中长期内为整体在线学习赛道、特别是 MasterClass 构筑了结构性顺风。


              AI 与在线学习的融合是短期内最剧烈的变革。自适应学习、AI 辅助辅导以及个性化课程生成，正成为头部平台的标配。LinkedIn Learning 推出了 AI 驱动的教练与角色扮演功能；Coursera 则采用
              AI 技能开发工具。MasterClass 推出基于名师声音模型生成问答的 AI 增购产品 MasterClass On Call，展现出对这一趋势的敏锐反应，但相比更成熟的 AI
              原生学习工具，该产品仍处于早期阶段。


              由于企业迫切需要针对 AI 和数字化转型升级员工技能，企业 L&D 市场的增速已超越 C 端消费市场。LinkedIn Learning 报告指出，49% 的人才发展负责人提及「AI 驱动的技能危机日益加剧」。若
              MasterClass 能在企业技能培养上拿出可衡量的成效，而非仅仅停留在满足感性向往的内容消费，这将为 MasterClass at Work 带来直接机遇。


              终身学习风潮正在拓宽个人消费端的目标市场。大众对在线教育的兴趣激增：              过去五年中，「eLearning」的搜索量暴增 271%（Exploding Topics
              数据）。九成企业提供数字化学习，68% 的员工更倾向于在工作中学习。疫情彻底改变了大众认知——57% 的美国学生对在线学习态度比疫情前更为乐观，近四分之三的学生希望继续上网课。


              微学习、移动端优先内容与游戏化交互正成为主流交付形态，在企业培训领域尤甚。MasterClass 的长视频模式（通常为 60–90 分钟的课程，拆解为每节 3–10
              分钟的小节）部分契合微学习趋势，但平台欠缺企业采购方日益看重的交互练习、考核评估与认证通道。EdTech 领域的风投资金在 2018 年为 $8.2 billion，2020 年攀升至 $16
              billion，并在 2021 年达到更高峰值，随后在 2022–2023 年骤降。HolonIQ 曾预测到 2025 年将有超过 100 家教育企业的市值突破 $1
              billion，表明即便经历短期回调，投资界对该赛道的长期信心依然坚定。
