          detail: 浏览讲师名录与课程预览；阅读 PCMag、TechRadar 等媒体评测；考量 30 天无理由退款保障
        - id: subscription
          label: 付费订阅
          detail: 选择套餐：Standard（$120/yr）、Plus（$180/yr）或 Premium（$240/yr）；填写支付信息；系统默认开启自动续费
        - id: onboarding
          label: 新手引导
          detail: 挑选首门课程；下载 iOS/Android App；可开启通勤音频模式；获取配套 PDF 工作手册
        - id: active-learning
          label: 主动学习
          detail: 观看视频课程（单节 6–20 分钟）；记录笔记；探索关联讲师；试用 On Call AI 增值功能；与家庭成员共享账号（Plus/Premium）
        - id: renewal-or-churn
          label: 续订或流失
          detail: 满 12 个月触发自动扣费；满意的学员被动续费；不满意的订阅者面临退订阻碍——此项为 Trustpilot 投诉的核心来源
