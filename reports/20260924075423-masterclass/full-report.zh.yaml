        - 低 —— 缺少流失率数据而无法计算
        - 与 CAC 结合决定获客模式在经济上是否合理
        - 索取订阅用户群组数据、续订率以及平均订阅时长
      - - 营销与销售费用占收入比例
        - 未披露；EdTech 同行为 30–50%；受名人合约与制作投资影响，MasterClass 可能处于高位
        - 低 —— 依据品类基准推断
        - 决定经营杠杆；高营销费用占比会收窄走向盈利的路径
        - 索取按渠道细分营销支出的损益表；导师合同成本结构
      - - 每门课程的内容制作资本支出
