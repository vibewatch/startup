    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >
              MasterClass 是一家在线教育平台，总部位于加利福尼亚州旧金山第 4 街 660 号（邮编 94107）。公司于 2014 年 10 月以 Yanka Industries Inc.
              名义注册成立，2015 年 5 月 12 日正式上线官方网站，初期主打 Dustin Hoffman、Serena Williams 与 James Patterson
              的课程。其核心商业模式为直接面向消费者（DTC）的订阅制：学员按年付费，即可无限制点播业内公认专家、知名人士与公众人物讲授的视频课——授课阵容从传授厨艺的 Gordon Ramsay，到讲授科学思维的 Neil
              deGrasse Tyson，覆盖广泛。


              内容覆盖 11 个品类，包括艺术与娱乐、商业、烹饪、影视、音乐、科学与技术、体育与游戏、健康身心以及写作。截至 2025 年，平台拥有 200 多位导师与 3,500 多节课程。MasterClass
              靠制作水准打出差异化：课程采用电影级规格拍摄，摒弃传统网络摄像头录课模式，PCMag 评价其带来了「近乎完美」的视听体验。不过，《大西洋月刊》（The
              Atlantic）与多位独立评论人士也提出质疑：这种偏重向往感与娱乐化的形式，能否让订阅用户真正获得可衡量的技能？


              平台提供三档订阅方案：Standard（$120/年）、Plus（$180/年）与 Premium（$240/年），其中 Plus 和 Premium 档位提供更多设备支持与额外功能。平台支持 15
              种语言，便于拓展海外市场。在个人订阅之外，MasterClass 还通过面向企业培训与组织学习（L&D）团队的 B2B 产品 MasterClass at Work 拓宽收入来源，定价为每席位每年
              $180。2024–2025 年，公司推出基于名师声音模型生成音频问答的 AI 产品 MasterClass On Call，作为增购项按每月 $15 收费。
