  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: B2C 客户画像与客群细分
        blocks:
          - type: paragraph
            body: >
              MasterClass 的主要客群是自主学习型成年人，他们追求灵感启发与技能视野，而非官方认证资质。平台的明星导师定位——Gordon Ramsay 讲烹饪、Serena Williams
              讲网球、Margaret Atwood 讲写作、Bob Iger 讲领导力——吸引了以 25–55 岁高收入、高学历职场人士为主的用户群，他们更看重名师带来的身份认同与生活憧憬，而非职业考证。这使得
              MasterClass 显著区别于主要在职业实用性与证书价值上竞争的 Coursera、LinkedIn Learning 与 Udemy。


              平台提供三档 B2C 订阅方案满足市场需求：Standard（$120/yr，仅支持在线播放，限 1 台设备）、Plus（$180/yr，支持离线下载，限 2 台设备）以及 Premium（$240/yr，支持
              6 台设备家庭共享）。所有档位均可完整浏览由 200 多位导师讲授、涵盖 11 个内容类别的 3,500 多节精炼短课。平台不设免费层级；新订阅用户享有 30
              天退款保证。礼品订阅作为主打产品面向消费者广泛营销，并向企业采购方提供单次最多 50 份会员资格的团购送礼方案。


              多语言支持覆盖 15 种语言，将潜在受众拓展至英语市场之外。SimilarWeb 数据显示，MasterClass.com 每月大约吸引 9 million
              或更多访问，展现出庞大的前端获客敞口，但实际转化率未知。除初期好奇心驱动之外的学习者长期粘性一直是其短板：订阅制娱乐学习平台的行业常规完课率仅为 20–30%，而 MasterClass
              至今尚未公开披露平台维度的完课率数据。
