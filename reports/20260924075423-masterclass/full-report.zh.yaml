  - id: TI005
    title: 公开财务缺口表
    notes: |
      MasterClass 属于私有公司，除融资轮次的新闻发布之外，未主动披露任何财务信息。本表中所有项目均代表公开信息记录中的重大空白。每条尽调路径均指明了意向投资者或收购方应提出的最低限度披露要求。
    claimRefs:
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
    columns:
      - 缺失指标
      - 重要性
      - 对投资判断的影响
      - 尽调路径
    rows:
      - - 年度收入 / ARR（2022–2026）
        - 商业可行性核心；增长率决定估值倍数
        - 缺少收入基线便无法评估收入质量、增长轨迹或公允价值
        - 索取经审计的损益表（2021–2026）或管理层编制的收入明细表；与 ARR 分析师估计进行核对调节
      - - 毛利率
        - 决定扣除内容制作、导师和交付成本后的单体盈利能力
        - 缺少毛利率便无法评估走向 EBITDA 的路径、与 EdTech 同行对比或对 FCF 建模
        - 索取 COGS 细分；导师合同条款；内容摊销政策
      - - 订阅用户数（B2C）与层级结构
        - 计算 ARPU、LTV/CAC、流失率和渠道 ROI 所必需
        - 无法判断增长是否真实、定价是否在下滑或层级结构是否在向下转移
        - 索取月活跃订阅用户数、层级分布以及年度群组留存数据
      - - MasterClass at Work 收入与席位数
        - B2B 转型具有战略意义；对收入的贡献和增长率完全不透明
        - 无法评估 B2B 成效、形成实质性贡献的时间线或企业销售 ROI
        - 索取企业合同（匿名化）、ACV、活跃席位、年度续订率及商机储备
      - - 获客成本（CAC）与 LTV
        - 任何订阅模式的基本效率指标
        - 无法判断资本效率、回本周期，也无法判断公司何时能够缩减营销支出
        - 索取按获客渠道和订阅用户入驻年份细分的渠道级营销支出
      - - 现金余额与月度消耗率
        - 除分析师估计外，资本充足度与跑道完全不透明
        - 无法评估偿债风险、距离下一轮融资的时间，或公司是否接近现金流盈亏平衡
        - 索取经审计的资产负债表（或银行资信证明）、月度现金流量表以及董事会批准的预算
      - - 债务工具与可转债
        - 隐性杠杆会带来仅凭股权分析无法察觉的下行风险
        - 未披露的债务或可转债可能触发清算优先权瀑布或反稀释，进而改变投资者的经济回报
        - 索取完整债务明细表、授信协议、可转债条款（如有）以及契约合规状况
      - - 更新后的估值（2021 年后标记）
        - 2021 年 $2.75B 的峰值估值已过时；Fidelity 的 SEC 申报文件暗示了大幅减计
        - 无法标记当前价值；前序轮次的优先股堆叠对普通股价值构成了不确定性
        - 索取最新的 409A 估值报告；二级市场交易数据；优先股转普通股分析
