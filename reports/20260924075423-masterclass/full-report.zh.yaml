      - number: '5.4'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >
              MasterClass 在信任度上的表现呈现显著分化：产品质量声誉极高，而订阅管理实践却广受诟病。产品侧，平台维持了严格的内容标准：2017 年，在针对演员 Kevin Spacey
              的多起性侵指控曝光后，平台下架其表演课程，展现出针对导师品行采取果断行动的意愿。卓越的制作质量与严苛的导师准入筛选构成了隐性质量底线，将 MasterClass 与师资良莠不齐的开放型交易平台（如
              Udemy）明确区分开来。所有内容均由 MasterClass 自有团队与各领域导师紧密配合，经审阅、结构化打磨后拍摄完成。


              但在订阅服务侧，情况要糟糕得多。Trustpilot 汇总的 1,059 条评价中，平均分仅为 1.6/5（评级为“差”），核心投诉集中于：未获明确同意即自动续费；退订困难重重；纯 AI
              客服且缺乏转人工通道；以及续费后立即申请退款仍遭拒绝。多位评测用户指出，其产品 UX
              刻意隐匿取消订阅的入口。这些投诉暴露出系统性的信任缺失；面对趋严的自动续费法规，欧美监管机构与企业采购方都视其为极其重要的风险信号。


              MasterClass 未公开披露数据安全规范、隐私合规认证（SOC 2、ISO 27001）或企业合规资质文件。MasterClass at Work 缺乏透明合规凭证，直接构成了受监管行业采购的关键阻碍。On
              Call 的 AI 评分练习会要求学员填写项目名称和具体工作情境，可能使企业机密面临输入 AI 系统后的暴露风险；该功能尚无公开的数据留存或隐私政策。


              MasterClass 采取 30 天无理由退款保证替代免费试用。虽然提供“访客通行证”（现有订阅用户分享的 14
              天访问权限），但需绑定信用卡，增加了体验门槛。这些信任信号相互矛盾：退款保证是正面承诺，但退订体验与客服设计在实际操作中大幅削弱了这种信任。
