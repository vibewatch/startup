  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接竞争对手：高端与平台型学习
        blocks:
          - type: paragraph
            body: >
              MasterClass 最直接的竞争对手是那些面向成年学员、拥有丰富在线课程目录并采用订阅制或单课购买制的平台。Coursera 是规模最大的纯线上学习上市平台，2023 财年（FY2023）披露收入为
              $522.4 million，全球注册学员超过 148 million 人。Coursera 依靠深厚的高校与机构合作构筑护城河——300 多所大学与企业联合提供官方权威认证与学位项目——打通了
              MasterClass 无法匹敌的进阶通路。Coursera 旗下的 Coursera for Business 在企业 L&D 市场直接与 MasterClass at Work 争夺客户。


              Udemy 采用点对点导师市集模式，与 MasterClass 严选名师路线大相径庭。Udemy 汇集 75,000+ 位讲师打造的约 210,000+ 门课程，据报 FY2023 收入约 $729
              million，吃下了实用技能进阶市场的绝大部分份额。Udemy 的定价模式（促销单课常在 $10–$30 区间）使其成为学员寻找针对性职业技能提升的首选。Udemy Business
              则以订阅制课程库服务企业客户，与 MasterClass at Work 展开角逐。Udemy 凭覆盖之广与亲民定价，走到了 MasterClass 高端精品路线的另一个极端。


              在创意技能细分市场中，Skillshare 是与 MasterClass 模式最为接近的订阅制竞品。Skillshare 采用统一定价的按年订阅制（约
              $168/年），主打社区化学习环境，学员可无限制观看由各行业在职专业人士讲授的短篇项目制创意课程。不同于 MasterClass，Skillshare
              强调同行社区、实操项目与迭代反馈，而非仰望感与电影级制作。Skillshare 约 3.5 million 名学员的预估规模虽不及 Coursera 或 Udemy，但切中了与 MasterClass
              创意内容重叠的细分人群。Skillshare 缺乏 MasterClass 的明星号召力，但在互动功能与社区粘性工具上更具优势。


              综合来看，这三家直接竞品切中的买方动机截然不同——权威资质背书（Coursera）、职业技能广度（Udemy）与创意社区氛围（Skillshare）——均未完全复制 MasterClass
              的向往感与娱乐化结合模式。然而，Coursera 与 Udemy 旗下的企业端产品，正对 MasterClass 试图切入的企业 L&D 市场构成与日俱增的竞争压力。
