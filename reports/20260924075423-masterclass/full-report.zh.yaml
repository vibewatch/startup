        - id: apple-google
          label: Apple App Store / Google Play
          detail: 移动端分发与应用内订阅计费；首年（Y1）30% 收入分成；平台政策风险
        - id: payment-processor
          label: 支付处理商（Stripe —— 推断）
          detail: 年度订阅计费、续费与退款；拒付争议管理
        - id: ai-vendors
          label: AI 基础设施供应商
          detail: On Call 语音与大语言模型（LLM）API；名师声音复刻；供应商未公开披露
        - id: regulators
          label: FTC / 加州总检察长（CA AG）/ CCPA 监管机构
          detail: FTC 消极选择权规则；加州 ARL 执法；CCPA 执法 —— 均直接适用
        - id: enterprise-customers
          label: 企业客户（B2B）
          detail: MasterClass at Work；Deloitte 为唯一具名参考客户；集中于极少数具名客户
      edges:
        - from: masterclass-core
          to: celebrity-instructors
          label: 品牌与内容供给 —— 依姓名绑定的单一来源
        - from: masterclass-core
          to: cloud-provider
          label: 基础设施依赖 —— 单一来源（推断）
        - from: masterclass-core
          to: apple-google
          label: 移动端分发 —— 30% 收入分成；下架风险
        - from: masterclass-core
          to: payment-processor
          label: 计费与续费 —— 若为单一处理商则存在集中度风险
        - from: masterclass-core
          to: ai-vendors
          label: On Call 产品 —— 未披露供应商；声音授权风险
        - from: masterclass-core
          to: regulators
          label: 合规义务 —— FTC、加州总检察长（CA AG）、CCPA 均拥有直接管辖权
        - from: masterclass-core
          to: enterprise-customers
          label: B2B 收入依赖 —— 仅 Deloitte 一家具名；集中度高
        - from: celebrity-instructors
          to: enterprise-customers
          label: 企业培训与发展（L&D）品牌公信力 —— 名师阵容支撑 B2B 价值主张
