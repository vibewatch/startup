      - number: '7.2'
        title: 运营与财务风险
        blocks:
          - type: paragraph
            body: >
              MasterClass 的成本结构与典型 SaaS 公司截然不同。单门课程均需达到好莱坞级制作水准——预估每门耗资 $100,000 至
              $500,000+——外加可能包含预付保底金与收入分成条款的名人导师酬劳。这些内容制作成本在拍摄完成后基本固定并成为沉没成本；一旦订户增长停滞，摊销到每位订户的单位成本便会骤增。业内估计其 2022
              年年度经常性收入（ARR）为 $125–$165M；若缺乏持续增长，其成本收入比难以为继，接连两轮的裁员印证了这一点。


              Bloomberg、CNBC、EdTech Digest 与 Hollywood Reporter 几乎同时报道了 2022 年 6 月的裁员（约占当时约 500 名员工的
              20%），官方将其归因于后疫情时代订户增速正常化以及需要“聚焦最具影响力的业务”。EdSurge、Variety 与 Hollywood Reporter 则报道了 2023 年 1
              月的第二轮裁员（约占剩余团队的 13%）。两轮裁员在 18 个月内累计裁撤了约三分之一的员工——这种规模反映出实质性的财务压力，绝非例行优化。


              Fidelity 每季度的 NPORT-P SEC 申报文件（最新为 2026 年 2 月和 2026 年 1 月季度）显示，旗下两只基金对 Yanka Industries（MasterClass
              的法人实体）优先股给出的公允价值合计约为 $58–96M——对照当年 $2.75B 峰值估值时的入场成本，这代表投资机构评估的公允价值已发生 80–90% 甚至更大幅度的减记。自 2021 年 5
              月以来，公司未公布过任何新一轮股权融资，公开渠道亦未见任何债权融资记录。现金跑道未公开披露；分析师基于裁员后的团队规模，预估其月度现金消耗在 $6–12M 区间，但距离上一轮融资已过去 5 年以上（5+
              years），公司目前的账面现金储备是未经证实的重度尽调隐患。


              B2C 订阅模式本身也带来了结构性财务风险：按年预付结合 30 天退款保证虽然在第一天带来了正向营运资金，但居高不下的退款诉求（正如 Trustpilot
              投诉集中反映的情况）将持续侵蚀实际到手收入。自动续费争议带来的拒付罚金，更增添了直接财务与运营成本。相比绝大多数同行，平台缺乏免费试用机制，既抑制了漏斗顶端的转化效率，又容易在订户感到物无所值时加剧退订流失。
