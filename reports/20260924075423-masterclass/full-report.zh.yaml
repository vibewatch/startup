      - number: '4.2'
        title: 资本结构与资金充裕度
        blocks:
          - type: paragraph
            body: >
              2014 年至 2021 年 5 月期间，MasterClass 历经 6 轮股权融资累计筹集约 $461M。2021 年 5 月 27 日通过 GlobeNewswire 宣布的 Series F 轮总计
              $225M，对应估值 $2.75 billion，使其位列当时全球估值最高的 EdTech 企业之列。Fidelity Investments 被证实为 Series E 轮（2020 年 5
              月，$100M）的领投方，公司亦指出 Fidelity 继续参投了 Series F 轮。据公开投资人记录，IVP 与 Javelin Venture Partners 亦在已确认的机构投资方之列。


              截至 2026 年 5 月，未见关于后续股权融资的公开宣布，亦未提交 IPO 招股书。Fidelity 每季度向 SEC 提交的 NPORT-P 申报文件（最近一次为 2026 年 4 月提交的截至 2026 年
              2 月 28 日的季度报表）显示，在 Fidelity Advisor Series I 投资组合持仓中列有「Yanka Industries Inc Series E」与「Yanka Industries
              Inc Series F」，其经 Fidelity 评估后的公允价值分别约为 $27.4M（Series E）与 $31.2M（Series
              F），而原始成本基数显著偏高——意味着估值相比顶峰经历了大幅减记。Fidelity 旗下另一只基金（Concord Street Trust / Founders Fund，2026 年 1 月季度）同样列出了
              Yanka Industries 持仓，公允价值分别约为 $3.9M（Series E）与 $33.5M（Series F）。这些估值标记提供了罕见的第三方佐证，表明投资机构层面对 MasterClass
              优先股的估价自 2021 年以来已出现重大下调。


              截至 2026 年 5 月，公司的在手现金、月度现金消耗（burn rate）及资金跑道未见公开披露。基于员工规模推算（裁员后约 300–400 名员工，预估人均全口径年成本
              $200K）、内容与基建投入及营销预算，分析师估计其月度现金消耗在 $8–15M 区间。若公司在 2021 年 5 月筹集的 $225M 资金按该区间下限（$8M/月）消耗，理论剩余现金约 $185M 意味着自
              2021 年 5 月起有 23+ 个月的资金跑道（即持续至 2023 年）。裁员等降本增效措施（两轮裁员）表明公司在谨慎管控资金。未见公开披露任何债务工具或信贷额度。
