    rows:
      - - B2B/企业级（MasterClass at Work）业务增长
        - B2C 消费者收入占主导（估计约 ~75–85%）；企业端收入占比极小
        - 开拓企业端可实现收入多元化，提升单客 LTV，并降低对 B2C 客户流失的敏感度
        - 调取 B2B 收入占比、企业端 ARR 及客户数；核实销售线索转化态势
      - - 将礼品订阅渠道作为获客漏斗
        - 礼品购买者 ≠ 续订用户；获赠账号在结构上流失率更高
        - 礼品收入为一次性；礼品用户转化为正式订阅用户具不确定性，且大概率低于自购用户队列
        - 调取礼品转续订转化率，以及礼品订阅占新增总订阅用户的比例
      - - 国际市场（15 种语言）
        - 附带字幕的英文内容在大型市场中可能不及本土母语竞品
        - 海外 TAM 空间广阔，但业务渗透所需的本地化深度远不止加挂字幕
        - 调取非美国订阅用户占比；评估前 5 大非英语市场的本土语言竞争激烈程度
      - - 将 On Call AI 与 Certificates 作为增购层
        - On Call 仍处 Beta 阶段；Certificates 仅有限度公开发售（GA）；PCMag 指出两者均存在质量隐忧
        - 若产品质量改善且采用规模化，On Call（$15/月）带来的增购收入有望大幅拉动 ARPU
        - 核实基础订阅用户转化为 On Call 的转化率以及 Certificates 渗透率；调取用户满意度数据
