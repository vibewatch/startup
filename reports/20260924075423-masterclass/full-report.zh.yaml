    notes: |
      业务扩张驱动因素与集中度风险基于现有公开信息评估。收入占比预估属于定性判断，并非来自已披露财务数据。尽调路径反映了截至 2026 年 5 月对处于 Series F 阶段的私营公司评估后续投资或收购考量时的标准信息调取要求。
