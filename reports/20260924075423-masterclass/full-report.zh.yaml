      - number: '1.3'
        title: 融资历史、投资方与资本结构
        blocks:
          - type: paragraph
            body: >
              2014 年至 2021 年 5 月期间，MasterClass 历经 6 轮股权融资，累计融资金额约 $461 million。公司最早披露的融资为约 $1.9 million 的种子轮。随后公司于 2016
              年完成 $15 million 的 Series A 轮，2017 年完成 $35 million 的 Series B 轮，2018 年完成 $80 million 的 Series C
              轮，持续扩充名师阵容并重金投入制作设备与团队。2020 年 5 月，MasterClass 借由新冠疫情期间居家数字娱乐与学习需求的爆发，完成由 Fidelity Investments 领投的 $100
              million Series E 轮融资。该轮融资对公司的估值约为 $800 million，也说明订阅用户增长迅猛。


              顶峰一轮为 2021 年 5 月通过 GlobeNewswire 新闻稿公布的 $225 million Series F 轮融资，对应估值达 $2.75 billion，使 MasterClass
              跻身当时全球估值最高的 EdTech 企业行列。该轮融资由机构投资者领投，老股东 Fidelity Investments 继续跟投。截至 2026 年 5
              月，未见任何估值重估事件、老股转让交易或后续融资轮次的公开披露，因此 $2.75 billion 仍是已知最近的公开估值；不过 2022–2023 年 EdTech
              市场回调大概率压缩了隐含估值倍数。Pitchbook 将 MasterClass 归为非上市公司，披露的股权融资总额约为 $461 million。公司未曾公开披露债务融资、信贷额度或营收数据。
