  - id: FR001
    title: 风险热力图
    type: matrix
    summary: >
      基于公开证据，对截至 2026 年 5 月 MasterClass
      主要风险发生可能性与影响程度的评估。风险排布依据定性评分：可能性反映可观察信号（投诉量、裁员幅度、监管执法趋势）；影响程度反映对收入、品牌、监管及投资者的冲击。右上象限（高可能性、高影响）代表最紧迫的投资风险。
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR015
      - CR021
      - CR022
      - CR023
      - CR031
      - CR032
      - CR037
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - 营销渠道成本通胀
            - 订阅用户留存下滑（完课率低）
            - 客户服务失灵（仅设 AI 客服，Trustpilot 1.6/5）
            - 自动续费面临 FTC 投诉风险敞口
        - label: 中等可能性
          values:
            - 内容制作放缓
            - B2B 销售执行未达预期
            - AI 替代侵蚀护城河
            - 明星名师丑闻
        - label: 低可能性
          values:
            - COPPA 未成年人访问违规
            - 支付通道服务中断
            - GDPR 执法行动（欧盟）
            - FTC 正式执法行动
        - label: 极低可能性
          values:
            - 应用商店下架
            - 平台重大数据泄露
            - 云基础设施持续宕机
            - CEO 离职且无继任者
  - id: FR002
    title: 风险传导图
    type: dag
    summary: |
      有向无环图展示了 MasterClass 的主要风险类别如何向下游业务结果传导。根风险属于上游诱因；叶节点代表对投资逻辑的冲击。核心传导路径从名师风险和消费者投诉出发，经由收入端，最终传导至估值。
    claimRefs:
      - CR001
      - CR005
      - CR011
      - CR015
      - CR021
      - CR023
      - CR031
      - CR032
      - CR037
    data:
      nodes:
        - id: instructor-risk
          label: 名师风险
          detail: 顶流明星名师出现丑闻、离职或离世
        - id: ai-substitution
          label: AI 替代风险
          detail: 生成式 AI 以接近零的边际成本复刻名师声音及专业知识
        - id: consumer-complaints
          label: 消费者投诉升级
          detail: 自动续费、取消订阅与退款争议（Trustpilot 1.6/5）
        - id: ftc-enforcement
          label: FTC / 监管执法
          detail: 违反 FTC 消极选择权规则（Negative Option Rule）；加州 ARL 执法；CCPA/GDPR
        - id: cost-structure
          label: 高固定成本结构
          detail: 好莱坞级制作成本 + 名师出场费；无法像 UGC 平台那样规模化扩展
        - id: subscriber-churn
          label: 订阅用户流失 / 增长停滞
          detail: 疫情后 B2C 订阅用户群体萎缩或停滞
        - id: revenue-decline
          label: 收入下滑
          detail: 年度订阅收入收缩；B2B 规模尚不足以弥补缺口
        - id: capital-exhaustion
          label: 资金耗尽风险
          detail: 自 2021 年以来未获新融资；现金跑道不透明；烧钱速度与现金储备情况不明
        - id: valuation-compression
          label: 估值承压缩水
          detail: 投资机构估值减记已较 2021 年峰值低 80–90%；面临降估值融资或减值风险
        - id: brand-damage
          label: 品牌与声誉受损
          detail: 媒体负面报道（The Atlantic 2023）、BBB 评级“F”、Trustpilot 1.6/5
        - id: b2b-execution-risk
          label: B2B 执行风险
          detail: 企业端转型需要 LMS 整合、证书体系及销售团队 —— 目前均仅部分成形或未披露
        - id: thesis-break
          label: 投资逻辑破裂
          detail: 在线教育品牌护城河 + B2B 多元化发展的核心假设被推翻
      edges:
        - from: instructor-risk
          to: brand-damage
          label: 丑闻/名师离开损害品牌
        - from: instructor-risk
          to: subscriber-churn
          label: 内容库受损导致用户流失
        - from: ai-substitution
          to: subscriber-churn
          label: 更廉价的 AI 替代品削弱付费意愿
        - from: ai-substitution
          to: b2b-execution-risk
          label: AI 工具使企业培训与发展（L&D）内容商品化
        - from: consumer-complaints
          to: ftc-enforcement
          label: 投诉量激增引发监管审查
        - from: consumer-complaints
          to: brand-damage
          label: Trustpilot/BBB 负面评分加剧声誉风险
        - from: ftc-enforcement
          to: revenue-decline
          label: 降低退订阻力会加剧用户流失；罚款消耗现金
        - from: cost-structure
          to: capital-exhaustion
          label: 高额烧钱速度加速消耗现金跑道
        - from: subscriber-churn
          to: revenue-decline
          label: 直接冲击收入
        - from: revenue-decline
          to: capital-exhaustion
          label: 收入下滑加速现金消耗
        - from: capital-exhaustion
          to: valuation-compression
          label: 被迫以苛刻条件寻求困境融资
        - from: b2b-execution-risk
          to: revenue-decline
          label: B2B 未能弥补 B2C 下滑
        - from: brand-damage
          to: b2b-execution-risk
          label: 企业买家回避 Trustpilot 仅 1.6/5 分的供应商
        - from: valuation-compression
          to: thesis-break
          label: 投资回报受损
        - from: capital-exhaustion
          to: thesis-break
          label: 现金跑道耗尽
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: |
      MasterClass 关键外部依赖关系图。各节点代表关键合作伙伴、平台、监管机构或基础设施供应商。连线标签注明依赖性质。标为“单一来源”（single-source）的节点代表尚无已确认替代方案的集中度风险。
