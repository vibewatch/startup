  - CR005
  - CR015
  - CR016
  - CR021
  - CR022
  - CR024
  - CR032
  - CR033
  - CR036
  columns:
  - Failure Mode
  - Likelihood
  - Severity
  - Mitigation Maturity
  - Residual Exposure
  - Unresolved Gap
  rows:
  - - Celebrity instructor scandal requiring content removal
    - "Medium \u2014 1 confirmed (Spacey 2017); 200+ instructors creates ongoing statistical exposure"
    - "Critical \u2014 brand damage; catalog impairment; subscriber refund demands; media cycle"
    - "Low \u2014 no public morality clause disclosure; no content insurance or removal protocol disclosed"
    - "High \u2014 no preventive controls confirmed; dependent on instructor background and public behavior"
    - Morality clause coverage, content removal SLA, refund liability protocol, and subscriber notification plan not disclosed
  - - Subscriber auto-renewal complaints and FTC enforcement action
    - "High \u2014 Trustpilot 1.6/5; BBB 'F' rating; complaint volume is ongoing and high"
    - "Critical \u2014 regulatory fines up to $51,744/violation/day; class action; subscriber trust erosion"
    - "Low \u2014 no confirmed UX remediation; complaint pattern unchanged as of 2025 reviews"
    - "High \u2014 direct regulatory exposure under FTC Negative Option Rule (2023/2024)"
    - UX audit of cancel flow and renewal disclosure against FTC Rule requirements not publicly confirmed
  - - Customer service failure (no human escalation, refund denials)
    - "High \u2014 multiple independent review platforms confirm AI-only CS pattern"
    - "High \u2014 subscriber churn; Trustpilot/BBB reputational amplification; potential regulatory trigger"
    - "Low \u2014 AI-only CS with no human path is a systemic design choice, not an outage"
    - "High \u2014 ongoing; each unresolved complaint adds to adverse review record and potential regulatory complaint"
    - No human CS escalation path; no stated SLA for billing dispute resolution; inconsistent refund honoring
  - - Platform downtime and streaming reliability failure
    - "Low \u2014 no material public outage reported; cloud-hosted streaming is generally reliable"
    - "High \u2014 subscriber satisfaction and perceived value; viral social amplification during live events"
    - "Medium \u2014 standard cloud/CDN infrastructure assumed; undisclosed provider"
    - "Medium \u2014 standard cloud HA architecture is assumed but not confirmed; SLA not public"
    - Infrastructure provider, CDN vendor, uptime SLA, and disaster recovery plan not publicly disclosed
  - - Content production pipeline failure or quality decline
    - "Medium \u2014 post-layoff team reduction may have reduced production capacity"
    - "High \u2014 catalog staleness reduces subscription value; instructor pipeline is finite"
    - "Medium \u2014 evergreen catalog provides buffer; production could be ramped via contractors"
    - "Medium \u2014 risk increases as subscriber expectations for new content grow and production pace is unknown"
    - Number of courses in production, annual content release rate, and production budget post-layoffs not disclosed
  - - Customer data breach or unauthorized access
    - "Low \u2014 no publicly confirmed major breach; standard SaaS attack surface"
    - "High \u2014 GDPR/CCPA penalty exposure; subscriber trust impairment; mandatory notification obligations"
    - "Medium \u2014 standard cloud security controls assumed; no SOC 2 or ISO 27001 certification publicly confirmed"
    - "Medium \u2014 absence of public SOC 2 is a diligence gap for enterprise customers and regulators"
    - SOC 2 Type II attestation, penetration test recency, and incident response plan not disclosed
- id: TR003
  title: Partner / Dependency Risk Register
  notes: 'Counterparty identities (cloud provider, CDN, payment processor, AI vendor) are inferred from industry norms and
    product feature analysis; MasterClass has not disclosed vendor relationships. Severity ratings reflect the service impact
    of a complete dependency failure. App store revenue share estimates use Apple''s standard 30% take rate for subscriptions
    in year one (15% from year two under certain conditions).

    '
  claimRefs:
  - CR003
  - CR007
  - CR032
  - CR033
  - CR034
  - CR035
  - CR037
  columns:
  - Dependency
  - Counterparty
  - Role
  - Concentration
  - Failure Scenario
  - Severity
  - Mitigation
  - Residual Exposure
  rows:
  - - Celebrity instructors (top 20 by brand recognition)
    - Individual talent (Serena Williams, Gordon Ramsay, etc.)
    - Core product differentiation; primary acquisition hook; catalog anchor
    - "Very High \u2014 a small number of marquee names drive the majority of marketing impressions and new trial starts"
    - Top instructor scandal, departure, or death; contract non-renewal; exclusive competitor deal
    - "Critical \u2014 loss of a marquee instructor damages discovery, acquisition, and subscription renewal value"
    - Content catalogue is evergreen; contracts are time-bounded; new instructor recruitment ongoing
    - "High \u2014 no disclosed exclusivity terms, morality clause provisions, or succession content plan"
  - - Cloud infrastructure (video hosting, CDN, compute)
    - AWS (inferred as primary provider); CDN provider undisclosed
    - Video delivery, application hosting, On Call AI compute, global latency management
    - "Very High \u2014 streaming platform cannot function without stable cloud and CDN"
    - Major cloud provider outage; CDN routing failure; cost escalation (AWS price changes)
    - "High \u2014 extended outage during peak usage would drive subscriber cancellations and media coverage"
    - Standard cloud HA multi-AZ architecture assumed; backup CDN provider status unknown
    - "Medium \u2014 cloud outages are rare but systemic; no public SLA or incident response protocol"
  - - App store distribution (iOS and Android)
    - Apple App Store (30% Y1 / 15% Y2 take rate); Google Play (same structure)
    - Primary mobile subscription distribution channel; in-app purchase revenue capture
    - "High \u2014 mobile subscribers are a significant share of total; iOS is especially important in premium demographics"
    - App store policy change; 30% take rate increase; content moderation deplatforming action
    - "High \u2014 revenue impact of increased take rate or removal from app stores would be material and immediate"
    - Web-based direct subscription available at masterclass.com; mitigates but does not eliminate app-store risk
    - "Medium \u2014 Apple's App Store has applied restrictions to subscription services; in-app share undisclosed"
  - - Payment processing
    - Stripe (inferred) or Braintree / PayPal; specific processor undisclosed
    - Annual subscription billing, renewal processing, refund handling, chargeback management
    - "High \u2014 single billing infrastructure failure would interrupt all subscription revenue"
    - Processor fraud/outage; chargeback rate exceeding processor thresholds leading to account termination
    - "High \u2014 subscription SaaS is highly sensitive to payment processor continuity"
    - 'Standard practice: secondary processor backup; but implementation not confirmed'
    - "Low \u2014 payment processor failures are rare; chargeback rate threshold is a more realistic risk vector"
  - - AI infrastructure for On Call product
    - OpenAI, AWS Bedrock, or similar (undisclosed); voice cloning vendor undisclosed
    - Powers MasterClass On Call AI interactive Q&A simulating instructor voices and expertise
    - "Medium \u2014 On Call is an add-on product at $15/month; core subscription does not depend on it"
    - API deprecation; cost increase; vendor contractual restrictions on voice replication; copyright challenge
    - "Medium \u2014 On Call product failure would impair new revenue stream but not core subscription"
    - Multi-vendor AI architecture possible; license terms for voice replication require independent review
    - "Medium \u2014 instructor voice replication raises copyright and likeness rights issues if contracts do not cover AI\
      \ use"
  - - Marketing and customer acquisition channels (Meta, Google, affiliate)
    - Meta (Facebook/Instagram); Google (search/YouTube); affiliate publishers
    - Paid acquisition of new B2C subscribers; brand awareness campaigns; content distribution
    - "High \u2014 celebrity content marketing has high earned media value, but paid channels remain critical for scale"
    - Platform policy changes (Meta ad restrictions, Google algorithm changes); cost-per-acquisition inflation
    - "Medium \u2014 CAC inflation would compress the unit economics of B2C subscriber growth"
    - Diversified channel mix assumed; organic celebrity-driven content provides some paid channel independence
    - "Medium \u2014 digital advertising costs have risen across the industry; MasterClass's specific CAC trend is undisclosed"
