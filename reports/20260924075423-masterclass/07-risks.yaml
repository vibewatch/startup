tables:
- id: TR001
  title: Regulatory / Legal Risk Register
  notes: 'Regulatory posture is based on public FTC rulemaking records, California AG enforcement history, and IAPP state
    privacy tracker data. Likelihood and severity assessments are qualitative estimates based on complaint volume, regulatory
    enforcement trends, and industry precedent. FTC civil penalty exposure assumes per-violation per-day calculation; actual
    penalty would depend on violation scope and duration. No confirmed MasterClass enforcement actions have been identified
    as of May 2026.

    '
  enumerationScope:
    coverage: partial
    basis: 'Enumerated from publicly confirmed applicable federal and state statutes and regulations as reviewed via FTC rulemaking
      records, IAPP state privacy tracker, California AG website, and Trustpilot complaint analysis. Does not include foreign
      jurisdictions (EU, UK GDPR) for which enforcement posture requires separate diligence. MasterClass has not disclosed
      any pending litigation or regulatory investigation.

      '
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  columns:
  - Rule / Law / Case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation (Current)
  - Residual Exposure
  - Diligence Path
  rows:
  - - FTC Negative Option Rule (16 C.F.R. Part 425, effective 2024)
    - "USA \u2014 Federal"
    - Final rule; in effect
    - "High \u2014 complaint profile matches prohibited practices"
    - "Critical \u2014 up to $51,744/violation/day; class action exposure"
    - Cancel-flow UX changes; disclosure improvements (unconfirmed)
    - "High \u2014 Trustpilot complaint pattern is direct evidence of prima facie violations"
    - Obtain independent UX audit of cancel flow; legal counsel opinion on FTC compliance
  - - "FTC Act Section 5 \u2014 Deceptive / Unfair Trade Practices"
    - "USA \u2014 Federal"
    - Always-on statute; no current enforcement action confirmed
    - "Medium \u2014 pattern of consumer complaints could trigger investigation"
    - "High \u2014 injunctive relief; civil monetary penalties; reputational damage"
    - Terms of service disclosure; refund policy posting (adequacy unconfirmed)
    - "Medium \u2014 no confirmed complaint; risk elevated by Trustpilot/BBB pattern"
    - Request legal counsel compliance memo; confirm FTC complaint database absence
  - - "California Automatic Renewal Law (Cal. Bus. & Prof. Code \xA717600\u201317606)"
    - California, USA
    - In force; actively enforced by CA AG and private plaintiff bar
    - "High \u2014 MasterClass is headquartered in San Francisco; CA ARL is directly applicable"
    - "High \u2014 class action exposure; AG enforcement; restitution + penalties"
    - Annual renewal disclosure in checkout flow (format/adequacy unconfirmed)
    - "High \u2014 CA ARL violations trigger per-subscriber damages; class action economics are asymmetric"
    - Audit California-specific checkout disclosures and cancellation UX against ARL checklist
  - - CCPA / CPRA (California Consumer Privacy Act and its 2023 amendments)
    - California, USA
    - In force; CPRA amendments effective 2023; CPPA enforcement active
    - "Medium \u2014 applicable to MasterClass's subscriber data at scale; no confirmed CPPA action"
    - "High \u2014 civil penalties up to $7,500/intentional violation; CPPA audit authority"
    - Privacy policy published; opt-out link present (completeness unconfirmed)
    - "Medium \u2014 no reported enforcement; risk is endemic to all consumer subscription platforms in CA"
    - Confirm data mapping, DSAR process, opt-out mechanisms, and data retention policies
  - - "EU / UK GDPR \u2014 Data Protection"
    - European Union, United Kingdom
    - In force; ICO and DPAs actively enforce
    - "Medium \u2014 international subscribers; EU/UK learner data is subject to GDPR"
    - "High \u2014 up to 4% global annual turnover or \u20AC20M; reputational harm in European markets"
    - Privacy policy covers GDPR; DPA status and SCCs/adequacy basis undisclosed
    - "Medium \u2014 enforcement of non-EU companies with EU user data is common; consent mechanisms need audit"
    - Confirm DPA registration, SCCs or adequacy reliance, and consent management for EU/UK users
  - - "COPPA \u2014 Children's Online Privacy Protection Act"
    - "USA \u2014 Federal"
    - In force; FTC enforces
    - "Low \u2014 MasterClass is age-gated for 18+; risk is residual"
    - "Medium \u2014 FTC civil penalties; reputational harm"
    - Age gate at signup; no child-directed content category
    - "Low \u2014 age-gating reduces but does not eliminate exposure if minors access platform"
    - Confirm age-gate implementation and no targeted minor marketing
- id: TR002
  title: Operational / Quality / Security Risk Register
  notes: 'Failure mode assessments are based on public incident records, consumer complaint analysis, industry operational
    benchmarks, and structural product/platform observations. MasterClass has not published a security incident report, SOC
    2 attestation, or business continuity plan. Customer service failure is rated high likelihood based on documented Trustpilot
    complaints (AI-only CS, no human escalation path).

    '
