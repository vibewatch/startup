  - - Finance / CFO
    - Capital allocation, runway management, investor relations, and any future fundraise or exit process require finance
      leadership; CFO identity post-layoffs is unknown
    - "Medium \u2014 at the company's current stage (potential funding need, no revenue disclosure), finance leadership quality\
      \ is material"
    - "High \u2014 poor runway management or fundraise misexecution would be damaging given the already compressed valuation"
    - Board oversight of financials; Rogier likely involved in investor conversations
    - Identify current CFO; confirm board audit committee composition; request audited or reviewed financials if pursuing
      investment
- id: TR005
  title: Mitigation and Kill Criteria Table
  notes: 'Kill criteria are operationalizable triggers, not qualitative judgments. Each trigger is defined so it can be monitored
    via publicly available signals (SEC filings, press releases, app store ratings, news searches) without requiring non-public
    information. Thesis-break triggers indicate events that would materially undermine the investment rationale and require
    re-underwriting or exit.

    '
  claimRefs:
  - CR001
  - CR005
  - CR009
  - CR011
  - CR015
  - CR021
  - CR023
  - CR031
  - CR032
  - CR037
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Celebrity instructor scandal (top-20 instructor)
    - News and social media monitoring for named instructor allegations; Google News alert on instructor name + MasterClass
    - Any credible published allegation of serious misconduct by a top-10-brand instructor
    - Reassess brand exposure; confirm content removal protocol; model refund liability; assess subscription impact within
      30 days
  - - FTC enforcement action or civil investigative demand
    - FTC enforcement database (ftc.gov/enforcement); PACER for civil court filings; FTC press releases
    - Any formal FTC complaint, CID, or consent order naming MasterClass (Yanka Industries)
    - "Thesis-break trigger \u2014 material legal liability, injunctive remediation cost, and reputational harm; re-underwrite\
      \ or initiate exit review"
  - - Subscriber growth stagnation or decline
    - SimilarWeb monthly traffic estimates; App Store review volume growth; Trustpilot review volume trajectory
    - Two consecutive quarters of declining SimilarWeb visits OR App Store rating below 4.0 (currently 4.6)
    - Initiate deep churn analysis; reassess LTV/CAC assumptions; potentially downgrade conviction on B2C growth
  - - "AI content substitution \u2014 competitor replicates MasterClass form factor at lower price"
    - Product announcements from well-funded AI EdTech startups; Andreessen/Sequoia portfolio company launches; App Store
      category entrant
    - Any competitor launching a credible celebrity-voice-AI instructional platform at <$5/month or free tier
    - Reassess competitive moat within 90 days; assess whether On Call is a defensive or offensive AI move; reduce terminal
      value assumption
  - - CEO David Rogier departure
    - LinkedIn profile changes; press release search; SEC Form D amendment (if new round); EDGAR filing for Yanka Industries
    - Any confirmed departure announcement without a named, experienced successor in place within 30 days
    - Hold all new investment pending new leadership assessment; assess board composition as a holding-period risk
  - - Down-round financing at material discount to $2.75B
    - Press release and SEC Form D filings on EDGAR for Yanka Industries; PitchBook/Crunchbase data updates
    - Equity round priced at < $1.4B (50% discount to 2021 peak); or bridge note with highly punitive terms
    - Trigger preference stack analysis; distressed scenario modeling; assess whether new capital improves or worsens cap
      table position
  - - Fidelity SEC write-down below $10M combined
    - Fidelity NPORT-P quarterly filings on SEC EDGAR (Fidelity Advisor Series I; Concord Street Trust)
    - "Combined Yanka Industries fair value in Fidelity NPORT-P filings below $10M (vs. ~$58\u201396M in Feb 2026)"
    - Signal of near-total investor impairment; trigger distressed/liquidation scenario modeling
  - - FTC or state AG enforcement complaint filed by consumers at scale
    - FTC Consumer Sentinel Network quarterly data reports; BBB complaint volume trend; CA AG press releases
    - More than 500 FTC Consumer Sentinel complaints in a 12-month period naming MasterClass
    - Elevate regulatory risk to 'thesis-breaking' level; require legal counsel review of enforcement probability before further
      investment
