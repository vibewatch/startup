- id: TI005
  title: Public financial gaps table
  notes: 'MasterClass is a private company and has made no voluntary financial disclosures beyond press releases for funding
    rounds. All items in this table represent material gaps in the public information record. Each diligence path describes
    the minimum disclosure request for a prospective investor or acquirer.

    '
