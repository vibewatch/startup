chapter:
  number: 4
  title: Financials
  summary: "MasterClass (Yanka Industries Inc.) is a private company that has raised approximately $461M in total equity through\
    \ its Series F in May 2021 at a $2.75B peak valuation. The company operates a dual-channel subscription model \u2014 B2C\
    \ consumer at $120\u2013$240/year and B2B enterprise (MasterClass at Work) at $180/seat/year \u2014 with an AI add-on\
    \ (On Call) at $15/month launched in 2024\u20132025. Analyst estimates place 2022 ARR at $125\u2013165M, but the company\
    \ discloses no financial data. Fidelity's SEC NPORT-P quarterly filings (Feb 2026, Jan 2026) value Fidelity's MasterClass\
    \ preferred shares at approximately $58\u201396M combined across two funds, implying deep write-downs from the $2.75B\
    \ peak. Two headcount reductions \u2014 June 2022 (~20%) and January 2023 (~13%) \u2014 confirm material cost pressure\
    \ and likely subscriber growth deceleration post-pandemic. No new funding has been disclosed since May 2021 and no IPO\
    \ has been filed. Key diligence blockers include the absence of audited financials, unknown gross margin, undisclosed\
    \ LTV/CAC, and opaque cash runway.\n"
sections:
- id: revenue-model-pricing
  title: Revenue Model and Pricing Architecture
  body: "MasterClass operates a subscription-first revenue model anchored by annual memberships in three tiers: Standard\n\
    ($120/year), Plus ($180/year), and Premium ($240/year). The subscription gives unlimited access to the full catalog\n\
    of 3,500+ lessons and 200+ instructors. Pricing has remained broadly stable since the platform's early years, though\n\
    the company offers periodic promotional discounts (observed at up to 50% off) that obscure realized revenue per\nsubscriber.\
    \ A gift-subscription product serves as a one-time revenue line but is not a recurring stream.\n\nIn 2020\u20132021, MasterClass\
    \ launched MasterClass at Work, an enterprise B2B product priced at $180/seat/year targeting\ncorporate learning and development\
    \ teams. The company's official website and the New York Times have confirmed this\nproduct, but enterprise penetration,\
    \ contract counts, and contribution to total revenue remain undisclosed. The B2B\npivot represents a deliberate effort\
    \ to diversify beyond the consumer base, where high marketing costs and celebrity\ncontract fees weigh on unit economics.\n\
    \nIn 2024\u20132025, the company launched MasterClass On Call, an AI-powered product at $15/month that offers interactive\n\
    Q&A sessions modeled on instructor voices. On Call is an incremental add-on revenue stream that leverages existing\ncontent\
    \ investment. Revenue contribution and adoption are not publicly reported. Revenue recognition for annual\nsubscriptions\
    \ follows a deferred revenue model (payment received upfront, recognized ratably), which is standard for\nsubscription\
    \ software; however, no public financial statements confirm this treatment.\n\nThe combination of B2C subscriptions, B2B\
    \ seats, and AI add-ons gives MasterClass three distinct revenue streams\nwith materially different economics: B2C is\
    \ high-volume/low-price, B2B is medium-volume/medium-price with enterprise\nsales motion, and AI is emerging. Revenue\
    \ mix between streams is not publicly disclosed.\n"
