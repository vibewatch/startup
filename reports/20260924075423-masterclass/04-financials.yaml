  columns:
  - Missing Metric
  - Why It Matters
  - Impact on Underwriting
  - Diligence Path
  rows:
  - - "Annual Revenue / ARR (2022\u20132026)"
    - Core commercial viability; growth rate determines valuation multiples
    - Cannot underwrite revenue quality, growth trajectory, or fair value without revenue baseline
    - "Request audited P&L (2021\u20132026) or management-prepared revenue schedule; reconcile with ARR analyst estimates"
  - - Gross Margin
    - Determines unit-level profitability net of content production, instructor, and delivery costs
    - Cannot assess path to EBITDA, compare to EdTech peers, or model FCF without gross margin
    - Request COGS breakdown; instructor contract terms; content amortization policy
  - - Subscriber Count (B2C) and Tier Mix
    - Necessary for ARPU, LTV/CAC, churn, and channel ROI calculations
    - Cannot determine whether growth is real, pricing is declining, or tier mix is shifting downward
    - Request monthly active subscribers, tier distribution, annual cohort retention data
  - - MasterClass at Work Revenue and Seat Count
    - B2B pivot is strategic; contribution to revenue and growth rate are completely opaque
    - Cannot assess B2B success, timeline to meaningful contribution, or enterprise sales ROI
    - Request enterprise contracts (anonymized), ACV, active seats, annual renewal rates, and pipeline
  - - Customer Acquisition Cost (CAC) and LTV
    - Fundamental efficiency metric for any subscription model
    - Cannot determine capital efficiency, payback period, or when company can reduce marketing spend
    - Request channel-level marketing spend disaggregated by acquisition channel and subscriber vintage
  - - Cash Balance and Monthly Burn Rate
    - Capital adequacy and runway are fully opaque beyond analyst estimates
    - Cannot assess solvency risk, time to next raise, or whether company is near cash-flow breakeven
    - Request audited balance sheet (or bank certificate), monthly cash flow statements, and board-approved budget
  - - Debt Instruments and Convertible Notes
    - Hidden leverage creates downside risk not visible from equity-only analysis
    - Undisclosed debt or convertible notes could trigger preference waterfalls or anti-dilution that alter investor economics
    - Request full debt schedule, credit facility agreements, convertible note terms (if any), and covenant status
  - - Updated Valuation (Post-2021 Mark)
    - The 2021 $2.75B peak valuation is stale; Fidelity SEC filings imply significant write-downs
    - Cannot mark current value; prior round preference stack creates uncertainty about common equity value
    - Request latest 409A valuation; secondary market transaction data; preferred-to-common conversion analysis
