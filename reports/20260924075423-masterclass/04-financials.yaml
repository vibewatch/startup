- id: unit-economics-cost-structure
  title: Unit Economics and Estimated Cost Structure
  body: "MasterClass's unit economics are substantially opaque because the company does not disclose revenue, subscriber counts,\n\
    churn rates, or cost of goods sold. Analyst estimates suggest 2022 ARR in the $125\u2013165M range, based on reported\n\
    subscriber growth signals and comparisons to market peers. The consumer subscription average revenue per unit (ARPU) is\n\
    directly observable from list pricing ($120\u2013$240/year), but the tier mix \u2014 which determines blended ARPU \u2014\
    \ is unknown.\nIf the majority of subscribers are on Standard ($120/year), blended ARPU is near $120; if Plus and Premium\
    \ dominate,\nit could exceed $180. No disclosed cohort data allows LTV calculation.\n\nCustomer acquisition cost (CAC)\
    \ is a critical unknown. MasterClass's marketing model relies heavily on celebrity-brand\ncontent as advertising \u2014\
    \ high-profile instructors generate earned media that reduces explicit digital CAC relative to\na pure ad-spend model.\
    \ However, instructor contract costs and cinematic production expenses are substantial (estimated\n$100K\u2013$500K+ per\
    \ course) and must be amortized against subscriber volumes. Industry analogs for direct-to-consumer EdTech\nplatforms\
    \ suggest CAC in the $40\u2013100/subscriber range, but MasterClass's premium positioning and high marketing spend\ncould\
    \ push this higher.\n\nGross margin for a subscription video-on-demand platform like MasterClass is theoretically high\
    \ (no physical COGS),\nbut content production, instructor fees (including revenue-share components), platform hosting,\
    \ and customer support\nintroduce meaningful costs that may compress gross margin to 40\u201370% \u2014 below pure SaaS\
    \ peers (65\u201380%). Marketing\nand sales expense as a share of revenue is likely elevated (30\u201350%), consistent\
    \ with the celebrity-driven growth model.\nThe two layoff rounds in 2022\u20132023 suggest management recognized the model\
    \ was not scaling efficiently and sought to\nright-size OpEx relative to revenue trajectory.\n\nMasterClass On Call introduces\
    \ a new cost item (AI inference costs) but also creates an incremental revenue line that\nleverages existing instructor\
    \ content with near-zero marginal COGS \u2014 potentially a margin-accretive add-on if adoption scales.\n"
