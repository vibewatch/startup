- id: TU001
  title: Customer segmentation table
  notes: 'Segment demographics are inferred from product positioning, pricing, content category mix, and third-party editorial
    coverage; MasterClass has not published a formal customer demographic profile. Revenue/strategic-value assessments are
    qualitative estimates based on publicly available pricing, observed marketing emphasis, and enterprise disclosures. Gaps
    reflect open diligence items as of May 2026.

    '
