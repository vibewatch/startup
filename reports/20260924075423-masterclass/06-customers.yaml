- id: b2b-enterprise-customer-base
  title: B2B and Enterprise Customer Base
  body: "MasterClass at Work is the company's B2B product, launched as a strategic pivot to enterprise\nL&D following the\
    \ 2022 and 2023 layoff cycles that cut approximately one-third of MasterClass's\nworkforce. The enterprise tier is priced\
    \ at $180/seat/yr for teams fewer than 50 seats, with\ncustom enterprise pricing for larger organizations obtained through\
    \ sales outreach. The B2B\nproduct provides the same catalog as consumer tiers but adds L&D-specific features: content\n\
    assignment to groups or individuals, analytics dashboards for top skills and learner engagement\ntracking, and exclusive\
    \ L&D-oriented assets not in the consumer catalog.\n\nDeloitte is the only publicly named enterprise customer, with MasterClass\
    \ citing a \"353%\nIncreased Sales and Profit\" outcome and a testimonial from a Deloitte leader describing the\nROI on\
    \ training as \"tremendous.\" MasterClass's marketing page for the enterprise product\nstates that \"Fortune 500 companies\
    \ trust us\" but provides no additional named customers.\nThe company also offers a corporate gifting tier starting at\
    \ $120/individual for employee\nperks and benefits programs, allowing bulk gift memberships without a recurring enterprise\n\
    license commitment.\n\nThe B2B segment is almost certainly a minority of total revenue as of 2025\u20132026, based on\n\
    the company's continued focus on consumer channels and the relatively recent (~2023) enterprise\npush. However, enterprise\
    \ accounts provide higher LTV per seat and more durable revenue than\nindividual B2C consumers. The lack of LMS integration,\
    \ the absence of accredited credentials,\nand the \"aspirational entertainment\" criticism from The Atlantic (2023) are\
    \ the primary\nobstacles to B2B expansion against Coursera for Business and LinkedIn Learning.\n"
