figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: 'Six-stage customer journey for a MasterClass B2C subscriber, from celebrity-driven awareness through evaluation,
    subscription, onboarding, active learning, and renewal or churn decision. The journey highlights key acquisition surfaces,
    product experience moments, and the auto-renewal friction point that drives Trustpilot complaints.

    '
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU006
  - CU018
  - CU019
  data:
    nodes:
    - id: awareness
      label: Awareness
      detail: Celebrity social media, gift from friend/family, word of mouth, organic search (instructor name), targeted digital
        ads
    - id: evaluation
      label: Evaluation
      detail: Browse instructor roster and course previews; read reviews on PCMag, TechRadar, or editorial sources; consider
        30-day money-back guarantee
    - id: subscription
      label: Subscription
      detail: 'Choose tier: Standard ($120/yr), Plus ($180/yr), or Premium ($240/yr); enter payment details; auto-renewal
        enabled by default'
    - id: onboarding
      label: Onboarding
      detail: Select first course; download iOS/Android app; optionally enable audio mode for commuting; access PDF workbook
        materials
    - id: active-learning
      label: Active Learning
      detail: "Watch video lessons (6\u201320 min each); take notes; explore related instructors; try On Call AI (add-on);\
        \ share account with household (Plus/Premium)"
    - id: renewal-or-churn
      label: Renewal or Churn
      detail: "Auto-renewal triggers at 12 months; satisfied learners renew passively; dissatisfied subscribers face cancellation\
        \ friction \u2014 dominant Trustpilot complaint driver"
