  - CU002
  - CU003
  - CU004
  - CU005
  - CU008
  - CU009
  - CU010
  columns:
  - Segment
  - Buyer / User / Payer
  - Use Case
  - Scale / Reach
  - Revenue / Strategic Value
  - Gap
  rows:
  - - B2C Consumer (Standard / Plus / Premium)
    - Individual payer and user
    - "Personal enrichment \u2014 writing, cooking, music, sports, business inspiration"
    - Largest segment; millions of annual subscribers globally (undisclosed count)
    - "Primary revenue driver at $120\u2013$240/yr; high volume, moderate ARPU"
    - Churn rate, renewal rate, and cohort data not disclosed; auto-renewal complaints signal friction
  - - B2C Gift Subscription
    - Third-party payer (giftor); recipient is user
    - Aspirational gifting for birthdays, holidays, professional development
    - Large; gift subscription is a featured product with dedicated purchase flow
    - Acquisition channel for new subscribers; strategic for top-of-funnel awareness
    - Gift-to-renewal conversion rate unknown; gifted accounts may not renew at same rate as self-purchased
  - - B2B Small Team (<50 seats)
    - Corporate L&D buyer; individual employees as users
    - Team professional development, leadership, creativity training at $180/seat/yr
    - Self-serve team tier; teams up to 49 seats
    - Growing segment; higher LTV per seat than B2C; recurring license model
    - No named SMB customer references; no ROI or engagement data for small-team tier
  - - B2B Enterprise (Fortune 500+)
    - Enterprise L&D or HR buyer; employee users
    - Scaled workforce upskilling; executive leadership development; corporate culture investment
    - Fortune 500 companies mentioned in marketing; custom pricing for >50 seats
    - Strategically important for revenue diversification and LTV improvement
    - No LMS integration disclosed; no accredited credentials; only Deloitte named publicly
  - - International Consumer (15 languages)
    - Individual payer/user in non-English markets
    - Multi-language access to celebrity instructor content
    - Growing global user base; 15 languages supported
    - TAM expansion; localization partially completed
    - Non-US subscriber share, churn by region, and local language competition not addressed
