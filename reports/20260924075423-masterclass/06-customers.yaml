company:
  name: MasterClass
chapter:
  number: 6
  title: Customers
  summary: "MasterClass serves two distinct customer types: a large B2C base of affluent adults (primarily ages 25\u201355)\
    \ paying $120\u2013$240/yr for celebrity-taught online learning, and a growing B2B segment (MasterClass at Work, $180/seat/yr)\
    \ targeting corporate L&D teams at Fortune 500 companies and smaller enterprises. Deloitte is the sole publicly named\
    \ enterprise customer, citing a 353% \"Increased Sales and Profit\" outcome in company marketing. Gift subscriptions represent\
    \ a meaningful third channel. Total subscriber count is not disclosed. On the satisfaction front, a sharp divergence exists\
    \ between engaged mobile learners (iOS App Store: 4.6/5 from 19,600+ ratings; PCMag: 4.5/5, Editors' Choice) and billing-focused\
    \ complainers (Trustpilot: 1.6/5 from 1,059 reviews), with auto-renewal without consent, cancellation friction, and AI-only\
    \ customer service as the dominant adverse signals. The Atlantic (2023) raised broader questions about whether MasterClass\
    \ delivers measurable educational outcomes or primarily functions as aspirational entertainment. Annual renewal rates,\
    \ cohort retention, and B2B Net Revenue Retention are all undisclosed\u2014the central diligence gaps for this chapter.\n"
sections:
- id: b2c-customer-profile-segments
  title: B2C Customer Profile and Segments
  body: "MasterClass's primary customer is a self-directed adult learner seeking inspiration and skill\nexposure rather than\
    \ formal credentials. The platform's celebrity-instructor positioning\u2014Gordon\nRamsay on cooking, Serena Williams\
    \ on tennis, Margaret Atwood on writing, and Bob Iger on\nleadership\u2014attracts an audience that skews toward higher-income,\
    \ educated professionals aged\n25\u201355 who associate the instructors with aspirational identity, not occupational training.\
    \ This\ndistinguishes MasterClass from Coursera, LinkedIn Learning, and Udemy, which compete primarily\non vocational\
    \ relevance and credential value.\n\nThree B2C subscription tiers serve this market: Standard ($120/yr, streaming only,\
    \ one device),\nPlus ($180/yr, offline downloads, two devices), and Premium ($240/yr, six-device household\nsharing).\
    \ All tiers provide full access to a catalog of more than 200 instructors and over\n3,500 bite-sized lessons across 11\
    \ content categories. No free tier exists; a 30-day money-back\nguarantee applies to new subscribers. Gift subscriptions\
    \ are available and marketed explicitly\nas an aspirational consumer purchase, with bulk gifting of up to 50 memberships\
    \ at a time\noffered to corporate gift buyers.\n\nInternational reach is supported through 15-language localization, broadening\
    \ the addressable\nmarket beyond English-speaking regions. SimilarWeb data suggests MasterClass.com attracts\napproximately\
    \ 9 million or more monthly visits, representing a substantial discovery surface\nbut with an unknown conversion rate.\
    \ Learner engagement beyond initial curiosity is a known\nweakness: industry patterns for subscription entertainment platforms\
    \ suggest course completion\nrates of 20\u201330%, and MasterClass has not published platform-level completion data.\n"
