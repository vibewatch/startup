      cost is low'
    - Independent outcome-data study showing measurable skill transfer and retention vs. control group
  - - Business Model
    - "ARPU $120\u2013$240/yr with low COGS on digital delivery; B2B (MasterClass at Work, $180/seat) opens $360B corporate\
