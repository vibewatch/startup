  rows:
  - - Tier 1 (Kill)
    - Third significant layoff round
    - '>10% headcount reduction announced publicly'
    - Confirms revenue deceleration beyond base case; operational distress escalation
    - Exit or halt follow-on; reassign risk rating to Critical
  - - Tier 1 (Kill)
    - Confirmed revenue below $100M ARR
    - Any audited or third-party-reported ARR below $100M
    - Bear case confirmed; base case eliminated; M&A value drops below $200M
    - Immediate exit or distressed-sale negotiation
  - - Tier 1 (Kill)
    - Fidelity forced liquidation or zero-value mark
    - SEC NPORT-P filing showing $0 or nominal value for Yanka Industries position
    - Implies near-insolvency or fully extinguished equity value
    - Immediate thesis kill; document process for LP reporting
  - - Tier 2 (Warn)
    - Loss of top-5 highest-engagement celebrity instructors
    - Public announcement of non-renewal or departure by instructors in top engagement cohort
    - Brand equity impairment; subscriber churn acceleration risk
    - Monitor next two quarters for churn evidence; tighten exit trigger
  - - Tier 2 (Warn)
    - GenAI competitor launches celebrity-voice simulation at <$30/year
    - Product launch by YouTube, Netflix, or dedicated GenAI platform with comparable voice/style simulation
    - Core brand moat under direct substitution pressure; AI anti-thesis activated
    - Accelerate diligence on AI On Call ARR data; revisit bull case probability
