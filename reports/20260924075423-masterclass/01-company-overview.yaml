- id: funding-capital
  title: Funding History, Investors, and Capital Structure
  body: "MasterClass has raised approximately $461 million in equity financing across six rounds from 2014\nthrough May 2021.\
    \ The earliest disclosed financing was a seed round of approximately $1.9 million.\nThe company then raised a $15 million\
    \ Series A in 2016, a $35 million Series B in 2017, and an\n$80 million Series C in 2018 as it expanded its instructor\
    \ roster and invested in production infrastructure.\nIn May 2020, MasterClass raised a $100 million Series E led by Fidelity\
    \ Investments, benefiting from\nelevated demand for at-home digital entertainment and learning during the COVID-19 pandemic.\
    \ The Series E\nvalued the company at approximately $800 million, reflecting rapid subscription growth.\n\nThe culminating\
    \ round was a $225 million Series F in May 2021, announced via GlobeNewswire press release,\nwhich valued MasterClass\
    \ at $2.75 billion and positioned it among the most highly valued EdTech companies\nglobally at that time. The Series\
    \ F was led by institutional investors with Fidelity Investments\nparticipating as a continuing backer. As of May 2026,\
    \ no re-valuation event, secondary transaction, or\nadditional fundraising round has been publicly disclosed, meaning\
    \ the $2.75 billion figure remains the\nmost recent public valuation, though the EdTech market contraction of 2022\u2013\
    2023 likely compressed\nimplied multiples. Pitchbook tracks MasterClass as a private company with total disclosed equity\n\
    financing of approximately $461 million. The company has not disclosed debt financing, credit facilities,\nor revenue\
    \ figures publicly.\n"
