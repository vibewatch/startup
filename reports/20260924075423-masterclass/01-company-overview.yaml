company:
  name: MasterClass
chapter:
  number: 1
  title: Company Overview
  summary: "MasterClass is a San Francisco-based online education platform founded in October 2014 (incorporated as Yanka\
    \ Industries Inc.) by David Rogier and Aaron Rasmussen. The platform offers video-based courses taught by world-renowned\
    \ celebrities and domain experts across 11 content categories, available via annual subscriptions ($120\u2013$240/yr for\
    \ consumers; $180/seat for enterprise). The company raised approximately $461M through a $2.75B Series F in May 2021 and\
    \ subsequently navigated two rounds of significant layoffs in 2022 and 2023 as the post-pandemic EdTech market contracted.\
    \ As of May 2026, MasterClass remains privately held with no confirmed IPO timeline, an estimated post-layoff headcount\
    \ of 300\u2013400 employees, and an expanding AI-assisted product (MasterClass On Call) alongside its flagship subscription\
    \ catalog of 200+ instructors and 3,500+ lessons.\n"
sections:
- id: identity-business-model
  title: Identity and Business Model
  body: "MasterClass is an online education platform headquartered at 660 4th Street, San Francisco, California\n94107. The\
    \ company was incorporated in October 2014 as Yanka Industries Inc. and publicly launched its\nwebsite on May 12, 2015,\
    \ initially featuring classes from Dustin Hoffman, Serena Williams, and James\nPatterson. The core business model is a\
    \ direct-to-consumer subscription: learners pay an annual fee to\naccess an unlimited catalog of on-demand video lessons\
    \ taught by recognized experts, celebrities, and\npublic figures\u2014ranging from Gordon Ramsay on cooking to Neil deGrasse\
    \ Tyson on scientific thinking.\n\nContent spans 11 categories including arts and entertainment, business, culinary arts,\
    \ film and TV,\nmusic, science and technology, sports and gaming, wellness, and writing. The platform features more\n\
    than 200 instructors and more than 3,500 lessons as of 2025. MasterClass differentiates on production\nquality: courses\
    \ are filmed cinematographically rather than in standard webcam format, which PCMag\ndescribed as giving the platform\
    \ a \"near-perfect\" visual and audio experience. However, The Atlantic\nand independent reviewers have raised whether\
    \ the aspiration-heavy, entertainment-influenced format\ntranslates to measurable skill acquisition for subscribers.\n\
    \nThree subscription tiers are available: Standard ($120/year), Plus ($180/year), and Premium ($240/year),\nwith the Plus\
    \ and Premium tiers offering expanded access and additional features. The platform is\navailable in 15 languages, supporting\
    \ international reach. MasterClass expanded its revenue streams\nbeyond consumer subscriptions with MasterClass at Work,\
    \ an enterprise B2B product priced at $180 per\nseat per year targeting corporate learning and development teams. In 2024\u2013\
    2025, the company introduced\nMasterClass On Call, an AI-powered product offering interactive question-and-answer sessions\
    \ using\naudio modeled after instructor voices, available at $15 per month as an add-on.\n"
