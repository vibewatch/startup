- id: technology-platform-ai-features
  title: Technology Platform and AI Features
  body: "MasterClass's technology stack is built around high-bandwidth video streaming, a recommendation\nengine that surfaces\
    \ relevant courses, and a multi-platform delivery architecture. The platform\nserves web browsers (Chrome, Firefox, Safari)\
    \ as well as native apps on iOS, iPad, Mac, and\nApple TV. The iOS and Android apps include an audio mode that strips\
    \ video from lesson delivery,\nenabling podcast-style consumption on the go, and an offline download feature (restricted\
    \ to\nPlus and Premium plan subscribers) that allows full course download for disconnected playback.\nMobile support was\
    \ first added in April 2018 and has been a core part of the product since.\n\nThe company has not publicly disclosed its\
    \ technical infrastructure\u2014cloud provider, CDN\npartner, AI/ML platform, or video encoding pipeline\u2014consistent\
    \ with its status as a private\ncompany with no public investor disclosures. The recommendation engine exists and personalizes\n\
    course surfacing, but its algorithmic methodology is not documented. MasterClass's video\nproduction pipeline is not a\
    \ commodity web-hosting approach: courses are shot cinematographically\nin controlled studio environments, with MasterClass's\
    \ production team working closely with\ninstructors on course structure, sequencing, and visual presentation.\n\nMasterClass\
    \ On Call is the most technically novel recent addition. On Call provides an AI\nassistant that mimics the voice patterns\
    \ of a small set of selected instructors, responding to\nopen-ended questions with advice styled to that instructor's\
    \ domain and cadence. During beta\ntesting, PCMag's reviewer spent over an hour with Chris Voss's On Call AI and found\
    \ it\nhallucinated a book and contradicted itself between sessions\u2014a material quality concern for\nthe $15/month\
    \ price point. On Call is technically a separate product from the core subscription\nand requires independent payment.\n\
    \nMasterClass Certificates integrates AI-graded written exercises where learners submit answers\nto prompts about their\
    \ work. The AI uses a visible rubric. PCMag's review found the grading\neasily satisfied by repeating keywords, raising\
    \ concerns about data privacy (exercises ask\nfor specific project names and business details) and the practical value\
    \ of the credential.\nThese are diligence-relevant weaknesses for enterprise buyers evaluating MasterClass at Work\nalongside\
    \ credentialing platforms.\n"
