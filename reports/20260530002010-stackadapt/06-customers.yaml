  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Public sources do not disclose NRR, GRR, gross churn, renewal rates, or typical contract duration by customer cohort.
      whyItMatters: Without retention math, it is impossible to underwrite durability or to translate strong campaign proof into recurring revenue quality.
      diligencePath: Request cohort retention, renewal, and contract-term data split by agency, direct brand, and partner-led accounts.
      relatedQuestionRefs:
        - QU021
      relatedTableRefs:
        - TU004
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: No retained public source disclosed top-customer revenue share or agency-versus-brand revenue mix.
      whyItMatters: Customer concentration and channel dependence could materially affect revenue durability even if logo breadth is real.
      diligencePath: Request the top-20 customer list, agency-versus-brand GMV mix, and concentration by vertical and partner channel.
      relatedQuestionRefs:
        - QU022
      relatedTableRefs:
        - TU005
    - type: private-evidence-only
      severity: material
      topic: recurring-vs-one-off
      missingEvidence: Public case studies rarely distinguish one-off campaign wins from recurring production relationships or multi-year master service agreements.
      whyItMatters: Campaign outcomes prove usefulness but not whether StackAdapt becomes an enduring budget line inside the account.
      diligencePath: Ask for named accounts with first-campaign date, current spend level, active channels, and renewal history.
      relatedQuestionRefs:
        - QU023
      relatedTableRefs:
        - TU003
    - type: access-blocked
      severity: minor
      topic: adverse-community-signal
      missingEvidence: The direct Reddit complaint thread cited during discovery could not be read without rate limits or authentication.
      whyItMatters: Direct primary access would improve confidence in how representative the fee-transparency complaints really are.
      diligencePath: Re-run with authenticated access or collect additional independent practitioner forums that quote the same thread directly.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU004
    - type: conflicting-data
      severity: minor
      topic: measurement-gap
      missingEvidence: Independent footprint datasets use different definitions than StackAdapt’s official brand count, so public customer totals are not harmonized.
      whyItMatters: Investors could misread breadth metrics if they assume brands, advertisers, tracked adopter companies, and technology-detected companies are interchangeable.
      diligencePath: Ask StackAdapt to reconcile official brand, advertiser, and active-account definitions against any third-party tracker benchmarks.
      relatedQuestionRefs:
        - QU025
      relatedTableRefs:
        - TU002
