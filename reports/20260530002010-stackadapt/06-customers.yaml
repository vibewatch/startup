  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration / durability risk
      - Impact
      - Diligence path
    rows:
      - - Self-serve, hybrid, and managed-service models
        - Public materials do not disclose how sticky each service model is or which cohort drives most gross revenue
        - Multiple service modes can widen funnel and improve upsell paths
        - Request revenue, retention, and gross margin by service model
      - - Client services and Creative Studio
        - Heavy service dependence may help retention but could also pressure margins or mask product-led stickiness
        - Services can improve adoption and expansion inside complex accounts
        - Request attach rate, renewal lift, and margin profile for service-assisted accounts
      - - Verticalized solutions in B2B, travel, healthcare, and finance
        - Public vertical pages show positioning but not customer concentration by sector
        - Vertical specialization can raise switching costs in regulated or data-heavy accounts
        - Request sector revenue mix and top-vertical growth / churn trends
      - - Partner program and APIs
        - Embedded and partner channels can create channel dependence if a few integrations dominate demand
        - APIs and partnerships can expand distribution beyond direct-seat sales
        - Request GMV share, renewal, and concentration by partner channel
      - - Omnichannel and email expansion
        - More channels can increase wallet share, but reviews imply weaker direct-response fit in some cases
        - Cross-channel orchestration supports larger budgets if outcomes stay measurable
        - Request account-level spend expansion after adding new channels
      - - Awareness-first use-case fit
        - TrustRadius and Reddit-style commentary suggest StackAdapt may be strongest for awareness, CTV, and niche targeting rather than every lower-funnel brief
        - That can limit share-of-wallet in performance-heavy advertisers
        - Request retention and ROAS by upper-funnel versus direct-response cohort
      - - Missing public concentration disclosure
        - No public top-customer share, contract length, NRR, or GRR
        - Core durability questions remain open despite strong breadth signals
        - Request top-20 customer list, renewal cohorts, and agency-versus-brand revenue split
    notes: Expansion logic is visible in the product and service model, but concentration and durability remain private-evidence topics rather than public facts.
