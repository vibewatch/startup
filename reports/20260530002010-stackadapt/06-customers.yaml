chapter:
  number: 6
  title: Customers
  summary: 'StackAdapt has credible public evidence of real customer breadth across agencies, direct brands, and multiple verticals, with recent named case studies spanning travel, hospitality, finance, healthcare, energy, and B2B demand generation. Public evidence is strongest on campaign breadth, service flexibility, and upper-funnel outcomes, but weak on renewal math: customer-count denominators vary by source, recurring contract economics are not disclosed, and negative commentary still clusters around reporting UX and fee transparency.'
sections:
  - id: customer-segmentation-and-route-to-market
    title: Customer segmentation and route to market
    body: 'Public materials show StackAdapt selling into several overlapping customer groups rather than one monolithic buyer. The official homepage frames the platform as trusted by agencies and brands, while the partner program, client-services pages, and industry solution pages expand that picture into self-serve marketers, managed-service clients, API and integration partners, and sector-specific buyers in B2B, travel, healthcare, and financial services. That mix matters because it suggests StackAdapt can land with different commercial motions: an agency seat, a direct brand team, a regulated vertical marketer that values compliance support, or a partner that embeds StackAdapt inventory and workflows through APIs. The official sector pages also imply different buyer personas inside accounts, from demand-generation leaders and media planners to healthcare marketers, financial-services teams, and tourism operators. What remains missing is revenue mix. StackAdapt discloses breadth, channels, and service models much more readily than it discloses how much GMV or recurring revenue comes from agencies versus direct brands, or from one vertical versus another.'
