tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public proof
      - Typical channels / tools
      - Strategic value
      - Gap
    rows:
      - - Agencies and holding companies
        - Buyer=agency leadership or media team; users=traders and planners; payer=agency or end client
        - Homepage positions StackAdapt for agencies; TrustRadius and TheirStack show agency and consultancy users including Monks, Direct Agents, and Search + Gather
        - Managed service, self-serve DSP, CTV, audio, display, native, reporting APIs
        - Agency base can aggregate many end advertisers and speed logo acquisition
        - Public sources do not disclose agency revenue share or retention by holdco / indie cohort
      - - Direct brands and enterprise marketers
        - Buyer=brand marketing or growth team; users=media, CRM, analytics, or performance staff; payer=brand
        - Homepage says 40,000+ brands; case studies name Hyatt, Popeyes, SentinelOne, Octopus Energy, and Sanofi campaigns
        - Omnichannel media, Creative Studio, brand lift, footfall attribution, reporting
        - Direct brand use diversifies exposure away from pure agency resale
        - No public disclosure of spend concentration by top direct brands
      - - B2B demand-generation teams
        - Buyer=marketing ops / demand gen; users=ABM and paid-media teams; payer=enterprise marketing budget
        - B2B solution page emphasizes firmographic, technographic, and job-title targeting; SentinelOne case confirms live B2B deployment
        - ABM, Page Context AI, email, CTV, DOOH, forecast and account engagement tools
        - B2B budgets can expand with pipeline measurement and multi-touch orchestration
        - No public logo list for top recurring B2B accounts beyond case studies
      - - Travel and tourism marketers
        - Buyer=destination, hospitality, or travel-brand marketing team; users=brand and media teams; payer=brand or tourism board
        - Travel solution page plus Hyatt and Hong Kong Tourism Board case studies show tourism and hotel demand
        - Travel AI Audiences, OTA placement, footfall attribution, retargeting, omnichannel travel media
        - Travel is a clearly developed vertical with APAC and destination-marketing proof
        - Public evidence proves campaigns, not repeat booking-account durability
      - - Healthcare and regulated marketers
        - Buyer=healthcare marketing, HCP campaign, or institutional team; users=brand / growth / compliance staff; payer=regulated advertiser
        - Healthcare page highlights NPI targeting and privacy-aware workflows; Sanofi case shows recruitment marketing in healthcare
        - NPI targeting, ABM for institutions, contextual targeting, privacy-aware workflows
        - Regulated-market support can increase switching costs where alternatives are weaker
        - No public customer list showing scale inside pharma, provider, or biotech accounts
      - - Financial-services marketers
        - Buyer=bank, insurance, wealth, or brokerage marketing team; users=performance, branch, or product marketers; payer=financial institution
        - Finance page and AKIN case show targeting around banking, insurance, and brokerage use cases
        - Location targeting, footfall attribution, contextual finance targeting, cross-channel activation
        - Finance vertical implies use cases with both awareness and conversion goals
        - No public evidence of branch-level renewal, contract size, or regulated-account churn
      - - Partners and embedded-channel customers
        - Buyer=technology, data, media, or measurement partner; users=product, revenue, and developer teams; payer=partner organization or shared clients
        - Partner program and enterprise API pages offer integrations, custom development, sandbox access, and go-to-market support
        - API access, co-sell motions, measurement integrations, white-label or embedded workflows
        - Partnerships can expand distribution without direct-seat selling alone
        - Partner contribution to GMV and channel concentration are not disclosed
    notes: Public segmentation evidence is broad but mostly qualitative; StackAdapt does not disclose revenue mix by segment, so economic weights remain a diligence gap.
