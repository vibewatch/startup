  - id: adoption-scale-and-public-customer-proof
    title: Adoption scale and public customer proof
    body: 'StackAdapt has enough public proof to clear the “real adoption” bar, but the proof layers have different denominators. Officially, the company advertises 40,000-plus brands and 1.5 million campaigns launched in 2024, while a 2026 StackAdapt report says platform data covered more than 6,000 global advertisers. Independent technology-tracking vendors add separate, narrower datasets: TheirStack lists 687 identified companies using StackAdapt, and Landbase claims 33,331 verified companies in its broader technology-detection corpus. Those figures are directionally useful but not directly comparable because they appear to count different universes. The strongest quality evidence comes from recent named case studies. Retained official examples cover Hyatt Asia Pacific, Sanofi with Havas People, Popeyes UK, SentinelOne, Octopus Energy, AKIN, and Hong Kong Tourism Board with Dentsu, spanning APAC, EMEA, and Europe and multiple channels such as DOOH, ABM, retargeting, contextual travel placement, and multi-channel recruitment. The gap is durability. These public stories prove campaigns ran and produced outcomes, but they usually stop at campaign-level lifts rather than contract value, renewal, or cohort retention.'
