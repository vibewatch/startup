  - id: expansion-motion-and-concentration-risk
    title: Expansion motion and concentration risk
    body: 'The land-and-expand logic is visible even though hard retention math is not. StackAdapt has multiple post-sale layers that can deepen account relationships: managed client services, creative support, omnichannel activation, ABM, verticalized data integrations, partner collaborations, and an enterprise API that lets agencies or software vendors embed StackAdapt capabilities in their own workflows. That gives StackAdapt several ways to grow beyond a single campaign brief, especially when an agency starts on awareness, adds CTV or DOOH, and then expands into email, retargeting, analytics, or white-label / API use. The risk is that the public evidence still does not answer concentration questions. StackAdapt discloses many verticals and several recent customer stories, but it does not publicly disclose top-customer revenue share, agency-versus-brand mix, renewal cohorts, or contract length. Independent review and community commentary also suggest that StackAdapt may be easier to justify for awareness and niche targeting than for every direct-response brief, which could affect wallet share inside sophisticated performance accounts.'
