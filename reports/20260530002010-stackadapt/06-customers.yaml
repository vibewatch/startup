  - id: retention-satisfaction-and-complaint-signals
    title: Retention, satisfaction, and complaint signals
    body: 'Customer satisfaction signals are broadly constructive but proxy-heavy. Gartner, TrustRadius, Software Advice, and GetApp all show that users value audience targeting, self-serve usability, support, and managed-service flexibility. The partner program further strengthens that picture by highlighting above-average customer feedback and strong Forrester scores in onboarding, training, ongoing support, pricing flexibility, and self-serve capabilities. At the same time, the recurring complaint pattern is consistent enough to matter: Gartner’s critical review cites reporting customization and transparency limitations; TrustRadius reviewers complain about clunky reporting, high CPMs, overspend risk, and weaker direct-response fit; older directory reviews mention cumbersome editing and creative workflows; and AdTechRadar’s Reddit summary centers on opaque fees. Taken together, the public record suggests that customers often like StackAdapt for audience targeting, awareness, CTV, and managed service, but the platform still creates friction around reporting UX, transparency, and lower-funnel efficiency. None of the reviewed public sources disclose NRR, GRR, gross churn, or renewal rates, so retention must be inferred from proxies rather than underwritten directly.'
