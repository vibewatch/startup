coverageNotes: >
  StackAdapt is a private company with unusually strong public marketing, hiring, and financing visibility for adtech,
  but still limited audited financial disclosure. The strongest public evidence anchors on the February 2025 Teachers'
  Venture Growth-led $235M financing, press-cited ~$2.5B valuation and ~$500M revenue / ~$125M operating-earnings
  figures, plus official product and customer proof across native, CTV, display, video, audio, DOOH, and owned-channel
  workflows. Key underwriting gaps remain around audited net revenue, gross margin, NRR, customer concentration,
  free-cash-flow conversion, liquidation preferences, and the exact primary-versus-secondary split of the 2025 round.
