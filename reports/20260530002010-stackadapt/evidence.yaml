evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership percentages
    missingEvidence: >-
      A current cap table or financing memo showing founder, Summit, Teachers’ Venture Growth, Intrepid, and other
      investor ownership after the 2025 round.
    whyItMatters: >-
      Without ownership percentages, control, dilution, and exit economics remain assumptions rather than
      diligence-grade facts.
    diligencePath: >-
      Request the 2025 financing deck, cap table, and any board materials that show post-close ownership and governance
      rights.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: board roster
    missingEvidence: A current board roster with committee assignments and director independence status.
    whyItMatters: >-
      Public sources show at least one independent director and Summit-backed board buildout, but they do not reveal the
      full oversight structure.
    diligencePath: Request a current board list, committee charter pack, and recent consent or meeting materials.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: audited financial disclosure
    missingEvidence: Audited or board-approved revenue, operating earnings, and cash-flow data for 2024 and 2025.
    whyItMatters: >-
      Public profitability signals are encouraging but still depend on investor and media narratives rather than audited
      company disclosure.
    diligencePath: >-
      Request audited financial statements, the 2025 budget package, and lender or board reporting used during the
      financing process.
  - type: conflicting-data
    severity: material
    topic: public profile consistency
    missingEvidence: A management-verified KPI pack confirming current headcount, revenue range, headquarters, and named executives.
    whyItMatters: >-
      Public directories disagree sharply on headcount, revenue, and even the CFO, which weakens confidence in external
      profile aggregators.
    diligencePath: Ask management for a current company fact sheet and reconcile it against major external profile vendors.
    relatedQuestionRefs:
      - QO017
      - QO024
  - type: access-blocked
    severity: material
    topic: wooster case substance
    missingEvidence: The complaint, dismissal agreement, and any settlement terms or releases in Wooster v. StackAdapt.
    whyItMatters: >-
      The docket confirms a case existed and ended with prejudice, but it does not show the allegations or whether the
      outcome had operational or financial significance.
    diligencePath: >-
      Pull the underlying filings from PACER or ask company counsel for the complaint, dismissal documents, and a
      litigation summary memo.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
