tables:
- id: TP001
  title: Competitive Landscape by Buyer Alternative
  columns:
  - Alternative class
  - Representative options
  - Why buyers choose it
  - Structural advantage
  - Implication for StackAdapt
  rows:
  - - Independent omnichannel DSPs
    - The Trade Desk; Viant; StackAdapt
    - Want transparent open-web media buying across many formats without a walled garden
    - Broad channel access and objective buying narratives
    - StackAdapt competes head-on here, but not with a unique category to itself
  - - Suite incumbent / enterprise stack
    - DV360; Microsoft Advertising
    - Already run analytics, search, creative, retail, or CRM workflows inside a larger platform
    - Bundle adjacent tools, data, governance, and enterprise buying teams
    - Large-platform bundling is the hardest pressure in enterprise deals
  - - Commerce-linked media platform
    - Amazon DSP; Criteo
    - Need shopper data, retail media, and closed-loop measurement tied to sales
    - Proprietary commerce signals and monetizable retail inventory
    - These vendors are stronger than StackAdapt where commerce data matters most
  - - Creative-curation / supply overlay
    - TripleLift
    - Want curated audiences, supply quality, and creative adaptation without changing the whole stack
    - Can sit inside an existing DSP relationship and improve outcomes at the supply layer
    - Reduces the odds that StackAdapt owns every part of the workflow
  - - Workflow / operations platform
    - Basis
    - Want one system for search, social, programmatic, CTV, and billing operations
    - Operational automation for agency teams
    - Competes for mid-market and agency budgets on process efficiency
  - - CTV specialist
    - MNTN
    - Need fast self-serve TV buying with clear creative and budget controls
    - Narrower use case, faster onboarding, simpler value proposition
    - Can pull upper-funnel and performance-TV spend away from a broader DSP
  - - Contextual / cookieless specialist
    - Quantcast; Seedtag
    - Need autonomous AI, privacy-first contextual buying, or cookie-light reach
    - Focused alternative for teams prioritizing identity resilience or contextual performance
    - Pressures StackAdapt’s native/contextual wedge from below
  notes: Rows summarize the main public alternative classes competing for StackAdapt-adjacent budgets as of 2026-05-30; buyers often use more than one class at the same time.
