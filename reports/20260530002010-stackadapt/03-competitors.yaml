  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: stackadapt-profitability
    missingEvidence: Audited or management-verified evidence on StackAdapt EBITDA, cash generation, and free-cash-flow profile.
    whyItMatters: Public peers disclose profitability and cash while StackAdapt does not, limiting direct underwriting of its staying power in a price war.
    diligencePath: Request current board or lender materials showing revenue mix, gross margin, EBITDA, cash burn, and covenant headroom.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized platform fee ranges, minimum commitments, rebates, and spend thresholds across StackAdapt, The Trade Desk, DV360, and Amazon DSP.
    whyItMatters: Commercial posture is central to mid-market competition, but public list cues do not reveal actual negotiated economics.
    diligencePath: Obtain sample insertion orders, master service agreements, or anonymized customer invoices by agency cohort.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Cohort retention, platform share-of-wallet, multi-homing rates, and expansion paths from native into CTV, video, and email.
    whyItMatters: Moat durability depends on whether ease of use turns into durable wallet share rather than trial usage.
    diligencePath: Ask management for logo retention, spend retention, channel attach, and top-20 agency concentration by cohort.
    relatedQuestionRefs:
    - QP025
