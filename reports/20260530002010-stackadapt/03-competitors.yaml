- id: moat-durability-and-competitive-risks
  title: Moat Durability and Competitive Risks
  body: The adverse evidence points to a moat that is real but not deeply entrenched. Digiday’s 2026 reporting shows that even The Trade Desk’s partners are exploring Amazon, direct deals, retail media networks, and other DSPs as measurement and economics shift, while another Digiday piece shows Amazon using Microsoft’s exit, streaming partnerships, and aggressive fee tactics to tighten its grip on open-web buying. Those signals matter to StackAdapt because they imply lower switching costs and more multi-homing across the category, not less. Google’s continuing antitrust remedies may create openings around dominant ecosystems, but they also underscore how unstable the policy backdrop is for ad-tech distribution and identity. StackAdapt’s new martech suite broadens its product surface and could raise customer stickiness, yet it simultaneously pulls the company into more direct competition with suites and orchestration vendors. Durable upside remains tied to agency fit, service quality, and
    native/contextual execution; durable downside comes from bundle economics, first-party data scarcity, and AI-driven feature commoditization. That makes customer concentration, agency share-of-wallet, and attach-rate expansion from native into CTV or email more important diligence items than raw feature maps alone.
