- id: TP002
  title: Competitor Profile Table
  columns:
  - Platform
  - Category
  - Scale / ownership signal
  - Best-fit buyer
  - Differentiation
  - Limitation versus StackAdapt or as a buyer choice
  rows:
  - - StackAdapt
    - Independent omnichannel DSP / marketing platform
    - Private; 40,000+ brands and 1.5M campaigns launched in 2024 claimed
    - Agencies, brands, and lean teams that want one platform plus optional support
    - Simple UI, self-serve / hybrid / managed flexibility, strong native-contextual heritage
    - No disclosed proprietary data moat or public profitability disclosure
  - - The Trade Desk
    - Independent enterprise DSP
    - Public; 2025 revenue $2.896B; 47% adjusted EBITDA margin; Q1 2026 revenue $689M
    - Large agencies and brands prioritizing objective open-internet buying
    - Open-internet identity, retail-data integrations, and global CTV depth
    - Less obviously optimized for smaller, lighter-touch teams
  - - DV360
    - Suite incumbent / enterprise buying platform
    - Alphabet-backed enterprise platform integrated with Google stack
    - Large advertisers already using Google media and analytics workflows
    - YouTube access, Analytics 360 integration, creative workspaces, machine learning
    - Higher enterprise gravity and less obvious mid-market accessibility than StackAdapt
  - - Amazon DSP
    - Commerce-linked DSP
    - Amazon-backed ad business plus shopper data and streaming inventory
    - Brands that value retail signals, Prime Video / Twitch reach, and measurable performance
    - First-party commerce data, premium streaming relationships, aggressive commercial terms
    - Buyers can become more dependent on Amazon economics and ecosystem rules
  - - Criteo
    - Commerce media / retail media platform
    - Public company with retail-media scale and open-web activation claims
    - Brands, retailers, and agencies leaning into commerce outcomes
    - 200+ retailers, 17,000 brands, 60+ DSP connections, closed-loop measurement
    - Less centered than StackAdapt on agency-friendly general-purpose DSP workflow
  - - Microsoft Advertising
    - Search-plus-programmatic ecosystem
    - Microsoft-backed advertising network spanning search, retail, gaming, video, and open-web supply
    - Advertisers that want Microsoft, Yahoo, search, and retail surfaces in one ecosystem
    - Large reach, AI narrative, publisher partnerships, and retail / gaming touchpoints
    - Standalone Microsoft Invest is being wound down, weakening buy-side clarity
  - - TripleLift
    - Curation, data, creative, and supply layer
    - Private; 5,000+ premium publisher relationships claimed
    - Advertisers wanting curated supply and creative-performance coordination
    - Can improve outcomes inside an existing DSP and extend into self-service
    - Acts more as an overlay and supply-side system than a full StackAdapt substitute
  - - Viant
    - Independent people-based DSP
    - Public; Q1 2026 revenue $88.5M and adjusted EBITDA $9.8M; CTV >50% of spend
    - Open-web advertisers focused on CTV and measurable outcomes
    - People-based identity, attention measurement, and strong CTV positioning
    - Smaller scale than The Trade Desk and narrower brand awareness than Google or Amazon
  - - Basis
    - Omnichannel workflow platform
    - Private; positions around enterprise AI and managed expertise
    - Agencies and media teams that care about process automation across channels
    - Search, social, programmatic, CTV, and billing workflow in one system
    - Competes more on operations than on proprietary audience or inventory advantages
  - - MNTN
    - CTV specialist
    - Private; self-serve performance TV platform for brands of any size
    - Brands seeking fast TV activation without full omnichannel complexity
    - QuickFrame AI, 150+ premium networks, lower starting budgets
    - Narrower than StackAdapt outside TV and upper-funnel video
  notes: Scale cells mix disclosed financials, ownership context, and company-claimed operating metrics; private-company economics are often not publicly normalized.
