- id: TP003
  title: Capability and Channel Comparison
  columns:
  - Buying criterion
  - StackAdapt
  - The Trade Desk
  - DV360
  - Amazon DSP
  - Criteo
  - Viant / TripleLift
  rows:
  - - Cross-channel breadth
    - Native, display, video, CTV, audio, DOOH, in-game, email
    - Global open-internet buying across CTV and major channels
    - TV, video, display, analytics, creative, YouTube, partner exchanges
    - Amazon and third-party display, video, audio, and streaming TV
    - Performance, retail media, display, native, video, CTV
    - 'Viant: CTV/audio/DOOH/in-game; TripleLift: display, retail media, CTV'
  - - Self-serve usability
    - Explicit self-serve, hybrid, and managed models
    - Enterprise-led; publicly less centered on low-friction onboarding
    - Sales-led enterprise workflow
    - Supported migration and partner-led onboarding
    - Easy-to-use platform narrative but less transparent commercial terms
    - Viant sales-led; TripleLift self-service expansion in late Q2 2026
  - - Native / contextual strength
    - Strong native roots and contextual AI
    - Contextual available but not the core wedge
    - Broader suite story dominates native story
    - Contextual plus shopper data, but not native-first positioning
    - Commerce-led rather than native-first
    - TripleLift and Seedtag pressure this area directly
  - - CTV / streaming edge
    - Strong channel presence, but no exclusive inventory moat disclosed
    - Deep premium CTV access and open-internet focus
    - YouTube plus TV/video planning inside Google stack
    - Prime Video, Twitch, Roku, Netflix, Disney, Spotify, SiriusXM relationships reported
    - CTV included, but commerce and retail media lead the narrative
    - Viant is increasingly CTV-centric; TripleLift uses curated omnichannel supply
  - - Identity / data moat
    - First-party and contextual targeting claims, but little proprietary data disclosed
    - UID2 plus retail-data and supply integrations
    - Google audience, analytics, and YouTube graph
    - Amazon shopper signals and premium streaming reach
    - Retailer first-party data and commerce signals
    - Viant people-based identity; TripleLift curates 1PD / 3PD and ID-less audiences
  - - AI / optimization posture
    - Machine learning core and 465B optimizations per second claimed
    - Koa / Kokai and large-scale optimization across the open internet
    - Machine-learning automation for bidding and optimization
    - Differentiated AI capabilities plus first-party signals
    - Commerce intelligence and AI decisioning
    - Viant AI Lattice Brain; TripleLift TL Spark orchestration
  - - Measurement posture
    - Unified reporting across channels and email
    - Objective buying plus financial rigor and performance claims
    - Analytics 360 and integrated measurement workflows
    - Measurement plus commerce outcomes and performance economics
    - Closed-loop SKU-level retail measurement
    - Viant attention measurement; TripleLift attention and outcome reporting
  notes: Cells summarize public positioning, not standardized product testing. “Better” means more clearly documented in public evidence, not independently benchmarked performance.
