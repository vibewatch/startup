- id: TP004
  title: Self-Serve and Agency Access Comparison
  columns:
  - Platform
  - Access model
  - Public onboarding / support signal
  - Public pricing / fee signal
  - Best fit
  - Competitive implication
  rows:
  - - StackAdapt
    - Self-serve, hybrid, or managed
    - Onboarding, training, AI recommendations, flexible support, partner network
    - No hidden tech fees claimed; actual take-rate undisclosed
    - Independent agencies and lean in-house teams
    - This is StackAdapt’s strongest clearly documented wedge
  - - Basis
    - Platform plus optional expert support
    - Managed help is explicit alongside automation tooling
    - Custom sales process
    - Agency operations and media teams
    - Competes with StackAdapt for workflow simplicity and service-heavy relationships
  - - MNTN
    - Self-serve performance TV
    - Go live in under an hour; AI video creation; budgets shown from $5K
    - Public impression calculator and budget examples
    - Smaller brands and agencies testing CTV
    - Can intercept TV budgets before a buyer needs a broader DSP
  - - Quantcast
    - Easy-to-use autonomous platform
    - End-to-end planning, activation, measurement, and reporting in one tool
    - No public list price, but simplicity is emphasized
    - Performance marketers wanting cookieless AI execution
    - Alternative for buyers who prioritize autonomy over managed support
  - - Viant
    - Sales-led platform with agency focus
    - Open-web case studies and CTV measurement materials
    - Custom sales-led commercial model
    - Agencies that value CTV and identity depth
    - Public-company credibility raises the bar for StackAdapt in agency RFPs
  - - Amazon DSP
    - Migration and partner-led support for Microsoft Invest advertisers
    - High-touch transition support is explicitly highlighted
    - Digiday reports fees often 4-8%, sometimes lower
    - Brands and agencies chasing commerce performance and scale
    - Pricing pressure can reset buyer expectations across the category
  - - The Trade Desk
    - Enterprise platform with specialized teams
    - Joint business plans and specialized support model
    - Commercial terms are negotiated, not transparent
    - Large agencies and scaled brands
    - As The Trade Desk reaches downmarket, StackAdapt’s access advantage narrows
  notes: Commercial posture uses public statements and reputable reporting, not customer contract audits. Actual fees, minimums, and service levels vary by spend and relationship.
