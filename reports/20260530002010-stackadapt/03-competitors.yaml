- id: TP005
  title: Data, Identity, and CTV Advantage Map
  columns:
  - Platform
  - Public data / identity advantage
  - Cookieless or privacy posture
  - CTV / premium supply edge
  - Why it matters against StackAdapt
  rows:
  - - StackAdapt
    - First-party, contextual, location, and audience targeting
    - Future-proofing and contextual messaging, but no proprietary identity rail disclosed
    - Broad channel support, no exclusive premium supply moat documented
    - Good breadth, weaker structural lock-in
  - - The Trade Desk
    - UID2 and retail-data integrations
    - Explicit alternative to third-party cookies
    - Premium global CTV access plus open-internet positioning
    - Identity and CTV depth are harder to replicate than UI simplicity
  - - DV360
    - Google audience and analytics graph
    - Benefits from Google’s broader data ecosystem
    - YouTube plus partner exchanges
    - Suite-level data gravity can outweigh StackAdapt’s usability edge
  - - Amazon DSP
    - Amazon shopper signals and contextual product/category targeting
    - Works on and off Amazon without relying on a seller relationship
    - Prime Video, IMDb, Twitch, and broad streaming footprint
    - Commerce plus streaming gives Amazon a sharper performance moat
  - - Criteo
    - Retailer first-party data and commerce intelligence
    - Closed-loop measurement and first-party data narrative
    - Open-web plus retailer environments across display, video, and CTV
    - Retail-media growth shifts spend toward platforms with transactional data
  - - TripleLift
    - 1PD, 3PD, and ID-less audience curation
    - Built to work without legacy identifiers in cookie-constrained environments
    - Curated omnichannel deals across 5,000+ premium publishers
    - Can complement another DSP while eroding StackAdapt’s contextual edge
  - - Viant
    - People-based identity plus attention data from TVision
    - No third-party cookies message is central to the pitch
    - CTV represents over half of spend; Netflix / YouTube / Prime Video measurement claims
    - A credible independent alternative where CTV outcomes matter
  - - Quantcast
    - Audience Graph and autonomous AI
    - Comprehensive cookieless solutions emphasized
    - Cross-device reach rather than exclusive supply
    - Keeps cookie-light performance buyers from defaulting to StackAdapt
  - - Seedtag
    - Neuro-contextual intelligence and cross-screen execution
    - Privacy-first contextual positioning is central
    - Across every screen rather than broad DSP ownership
    - Attacks the contextual story directly from a specialist angle
  notes: This table compares public data and inventory posture rather than audited identity coverage or exact match rates. It highlights where proprietary data creates structural advantage.
