- id: TP007
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat or risk claim
  - Evidence in public record
  - Severity
  - Why credible now
  - Diligence / mitigation
  rows:
  - - Ease-of-use and support are real but soft moats
    - StackAdapt is explicit about self-serve, hybrid, managed, onboarding, training, and pricing flexibility
    - medium
    - Specialists and large platforms increasingly talk about simplicity too
    - Ask for cohort retention and win-rate data by agency size
  - - Native and contextual heritage remains useful
    - Native page still centers contextual AI, first-party data, and creative support
    - medium
    - This wedge still matters when buyers want privacy-safe discovery formats
    - Check whether native-led accounts expand into CTV / video or churn out
  - - Feature-list differentiation is compressing
    - Most competitors now market AI, omnichannel coverage, and optimization
    - high
    - Public messaging across StackAdapt, TTD, DV360, Criteo, Viant, and TripleLift has converged
    - Underwrite workflow fit and partner distribution, not raw feature count
  - - First-party and commerce data are stronger moats than workflow alone
    - Amazon and Criteo pair media buying with shopper and retail signals; Google retains suite data gravity
    - high
    - These data advantages tend to survive copycat product work
    - Test whether StackAdapt can match performance without owning comparable data
  - - Multi-homing risk is rising
    - Digiday reports buyers shifting dollars among Amazon, TTD, direct deals, retail media, and other DSPs
    - high
    - If even TTD is being shopped around, smaller independents are unlikely to be single-homed
    - Measure share-of-wallet concentration and contractual stickiness by top agencies
  - - Large-platform consolidation can reset category economics
    - Amazon’s Microsoft migration and low-fee tactics show scale can drive take-rate pressure
    - high
    - Consolidation affects pricing, supply access, and account control at once
    - Ask management how margins hold if Amazon or Google become pricing umbrellas
  - - Martech expansion is double-edged
    - StackAdapt now pitches email plus programmatic orchestration in one platform
    - medium
    - Broader surface can raise retention but also expands the rival set to suites and engagement vendors
    - Track attach rates and whether cross-sell meaningfully improves retention or ACV
  notes: Severity reflects underwriting risk to StackAdapt as of 2026-05-30, not a probability-weighted forecast. Rows combine official positioning with independent industry reporting.
