- id: TP006
  title: Pricing and Economics Comparison
  columns:
  - Platform
  - Economic disclosure
  - Pricing or commercial posture
  - What the buyer gets
  - Underwriting takeaway
  rows:
  - - StackAdapt
    - Private; no public profitability disclosure
    - No hidden tech fees claimed; self-serve / hybrid / managed support is public
    - Flexible operating model plus broad channels
    - Helpful for winning mid-market agencies, but private economics remain opaque
  - - The Trade Desk
    - 2025 revenue $2.896B; 47% adjusted EBITDA margin; strong cash generation
    - Negotiated enterprise pricing and joint-business-plan economics
    - Large-scale open-internet buying with premium CTV and identity support
    - Profitability funds R&D and lowers risk of underinvestment
  - - Amazon DSP
    - Amazon ad business scale is massive; Digiday cites Q2 ad revenue of $15.7B
    - Digiday reports 4-8% fees and at times lower to win share
    - Commerce data, streaming, and low-fee pressure
    - Amazon can compress pricing for the rest of the market
  - - Criteo
    - Public-company disclosure plus broad commerce network metrics
    - Commercial terms are not broadly transparent, but platform is positioned as easy to use
    - Retail media, commerce intelligence, and closed-loop measurement
    - Buyers may accept less transparency if the commerce data advantage is real
  - - Viant
    - Q1 2026 revenue $88.5M; adjusted EBITDA $9.8M; cash $185.7M
    - Sales-led commercial model; no public list price
    - CTV-heavy independent alternative with public-company reporting
    - Smaller than TTD but still financially credible
  - - MNTN
    - Private economics undisclosed
    - Public budget examples start around $5K monthly
    - Low-friction TV buying and creative automation
    - Specialists can win by making one use case feel dramatically easier
  - - Basis
    - Private economics undisclosed
    - Custom sales process tied to platform plus services
    - Operations-heavy omnichannel workflow and optional managed help
    - Service-led competitors can compete on total process savings, not media science
  notes: Economic cells mix official financial results, public commercial language, and reputable reporting. The absence of a public price is itself informative in enterprise software and ad-tech procurement.
