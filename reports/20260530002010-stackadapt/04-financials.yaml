  - id: TI005
    title: Capital adequacy table
    columns:
      - Input
      - Public value or status
      - Evidence
      - Underwriting take
      - Diligence ask
    rows:
      - - 2025 headline round size
        - 235
        - 'USD millions; confirmed by company and multiple press reports'
        - Strong signal of investor support.
        - Confirm exact primary proceeds to company after any secondary transfers and fees.
      - - 2025 round composition
        - Mostly secondary or undisclosed
        - BetaKit reported a mostly secondary round and the company declined to confirm the split.
        - Headline funding size likely overstates balance-sheet cash added.
        - Request cap-table bridge and primary-secondary allocation.
      - - Stated use of funds
        - R&D, innovation, global expansion
        - Management and Ontario Teachers described growth uses of proceeds.
        - Indicates offensive investment intent rather than a rescue recap.
        - Verify budget by function and geography.
      - - Total capital raised
        - Over 500 or 537
        - Ontario Teachers says over $500M; Tracxn says $537M.
        - Capital history is large enough to matter, but still not perfectly reconciled.
        - Reconcile round-by-round proceeds and outstanding preferred structure.
      - - Cash on hand
        - null
        - No reviewed public source discloses current cash.
        - Runway cannot be underwritten from public evidence.
        - Request monthly cash bridge and latest balance sheet.
      - - Debt, burn, and runway
        - null
        - No reviewed public source discloses debt schedule, burn, or runway.
        - Financing dependency remains uncertain despite the latest raise.
        - Request debt agreements, covenant package, and board runway analysis.
    notes: The round itself is well corroborated, but capital adequacy remains partial because the public record does not disclose the primary cash inflow, current cash balance, burn, or debt.
    claimRefs:
      - CI009
      - CI010
      - CI013
      - CI014
      - CI015
      - CI021
