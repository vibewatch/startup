  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin-and-sales-efficiency
      missingEvidence: Gross margin by channel and customer type, CAC, payback, retention, and customer concentration remain undisclosed.
      whyItMatters: These are the core inputs needed to decide whether StackAdapt deserves a premium software-like valuation or should be underwritten more like a service-heavy ad platform.
      diligencePath: Request a finance data room with segment P&L, cohort retention, CAC and payback, gross margin by managed-service versus self-serve, and top-customer concentration.
      relatedQuestionRefs:
        - QI013
      relatedTableRefs:
        - TI006
    - type: missing-source
      severity: blocking
      topic: liquidity-and-runway
      missingEvidence: Current cash, debt, covenant package, monthly burn or generation, and board runway assumptions are not public.
      whyItMatters: Capital adequacy cannot be underwritten from the round headline alone, especially if the 2025 financing included a large secondary component.
      diligencePath: Request the latest balance sheet, debt agreements, monthly cash bridge, covenant headroom analysis, and runway case prepared for the board.
      relatedQuestionRefs:
        - QI018
        - QI024
      relatedTableRefs:
        - TI005
    - type: missing-source
      severity: material
      topic: pricing-realization
      missingEvidence: Public sources do not show realized rate cards, discounting, or the split between media pass-through, platform fees, and services.
      whyItMatters: Revenue quality depends on whether StackAdapt captures durable software-like economics or a more variable service-linked spread on campaign spend.
      diligencePath: Request standard order forms, sample invoices, discount schedules, and realized gross-to-net revenue by channel and customer cohort.
      relatedQuestionRefs:
        - QI004
        - QI006
      relatedTableRefs:
        - TI002
    - type: conflicting-data
      severity: material
      topic: revenue-and-valuation-opacity
      missingEvidence: Public sources disagree sharply on revenue and valuation, and none provide a verified consolidated number set.
      whyItMatters: Small changes in the assumed revenue base move StackAdapt's implied valuation multiple from public-comp-like to very rich, altering the investment conclusion.
      diligencePath: Request audited or board-approved consolidated revenue, ARR if used internally, current valuation bridge, and a reconciliation of legal-entity versus group reporting.
      relatedQuestionRefs:
