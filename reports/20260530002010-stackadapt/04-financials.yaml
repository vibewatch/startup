runDate: '2026-05-30'
company:
  name: StackAdapt
chapter:
  number: 4
  title: Financials
  summary: >-
    StackAdapt shows unusual scale for a private ad-tech platform: the public record supports a $235 million February 2025 round,
    more than 1,300 employees, 40,000+ brands, and press-cited revenue and operating-earnings figures that imply meaningful profitability.
    But underwriting still turns on opaque and contradictory private-company metrics—revenue estimates range from roughly $141 million to
    $500 million, the 2025 round was reportedly mostly secondary, and public sources do not disclose gross margin, burn, cash, or realized pricing.
sections:
  - id: revenue-model-and-monetization-visibility
    title: Revenue model and monetization visibility
    body: >-
      StackAdapt’s revenue model is visible at the workflow level but not at the audited ledger level. Company pages and review sites consistently
      describe a multi-channel platform that sells media execution across native, display, video, CTV, audio, in-game, DOOH, and email, with both
      self-serve and managed-service usage. Public pricing evidence is much thinner. TrustRadius says StackAdapt has no public pricing plans and no
      free version or trial, while ITQlick and SalesHive both describe custom, spend-linked commercial terms rather than a transparent rate card.
      That means the market can observe the monetization surfaces—media buying, orchestration, measurement, first-party data activation, and service
      support—but not the actual gross-to-net economics by channel, customer type, or geography. The same evidence base points to scale: StackAdapt’s
      home page says the platform serves more than 40,000 brands and launched more than 1.5 million campaigns in 2024. The right reading is that
      StackAdapt likely monetizes advertiser spend across a broad product surface, but public evidence still does not reveal how much of that spend
      becomes high-quality recurring software-like revenue versus more service-linked campaign revenue.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI037
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-estimates-and-public-comp-context
    title: Traction estimates and public comp context
    body: >-
      The strongest positive signal is that multiple independent outlets converged around a very large 2025 financing event and meaningful operating
      scale. TechCrunch, BetaKit, Ontario Teachers, and other press reports agree on a $235 million round, while StackAdapt’s official surfaces show
      broad customer and campaign activity. Where the record breaks down is on the headline financials that matter for valuation. TechCrunch and other
      press reports tied the 2025 round to roughly $500 million of annual revenue and a roughly $2.5 billion valuation, while GetLatka lists only
      $141.4 million of 2025 revenue and a $424.1 million disclosed valuation and Tracxn exposes just a $40.9 million UK-entity revenue figure.
      Those numbers do not reconcile into a single clean revenue bridge, so any underwriting model has to work with scenarios rather than a trusted
      point estimate. Public ad-tech comps help frame the range. As of 2026-05-29, The Trade Desk and Magnite trade a little above 3x EV/sales,
      PubMatic trades around 1.6x, and Criteo trades below 0.4x, with operating margins ranging from negative at PubMatic to about 20% at The Trade
      Desk. Depending on which StackAdapt revenue figure is true, the implied private multiple lands anywhere from public-comp-like to extremely rich.
    claimRefs:
      - CI002
      - CI011
      - CI012
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
