tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Current public status
      - Revenue-quality view
      - Diligence ask
    rows:
      - - Omnichannel media buying
        - Spend flows through StackAdapt across native, display, video, CTV, audio, in-game, DOOH, and email campaigns.
        - Clearly active and central to the commercial model.
        - High for existence; low for realized take rate or mix by channel.
        - Need customer invoices and net revenue by channel, geography, and customer cohort.
      - - Self-serve platform usage
        - Advertisers and agencies can plan, launch, optimize, and analyze campaigns directly in the platform.
        - Repeatedly described in company and review sources.
        - Medium; self-serve can improve scalability, but public sources do not show attach rate or seat economics.
        - Need active self-serve account count, usage depth, and support cost per account.
      - - Managed-service support
        - Client services and trading support can sit alongside platform usage for campaign setup and optimization.
        - Publicly visible in review and company descriptions.
        - Medium; service layers can aid retention but may dilute software-like gross margin.
        - Need percent of revenue from managed-service customers and service headcount mix.
      - - Email and orchestration workflows
        - StackAdapt now pitches email, first-party data orchestration, and cross-channel journeys alongside media buying.
        - Product scope is public; revenue contribution is not.
        - Medium for strategic importance; low for current revenue share.
        - Need software-orchestration revenue split and attach rates by existing DSP customers.
      - - Data and measurement layer
        - Forecasting, attribution, measurement, and first-party data activation are embedded in the workflow.
        - Clearly part of the value proposition.
        - Medium; likely improves stickiness and ROI but not separately priced in public evidence.
        - Need contract language showing whether these features increase fees or mainly reduce churn and operating cost.
    notes: Public evidence supports a broad monetization surface, but not a disclosed audited revenue mix or a realized net-revenue bridge.
    enumerationScope:
      coverage: partial
      basis: Covers the monetization surfaces explicitly visible in official company pages and independent reviews as of the 2026-05-30 run date; realized price and mix by customer segment remain private.
    claimRefs:
      - CI001
      - CI007
      - CI008
      - CI016
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Surface
      - Public price or unit visibility
      - What is actually disclosed
      - Economics implication
      - Source or diligence ask
    rows:
      - - Contract billing basis
        - Partial
        - Public review sources describe CPM, CPC, and CPE style pricing linked to campaign objectives.
        - Implies usage-based monetization rather than seat-based SaaS pricing.
        - Confirm invoice structure, rebates, and channel-specific pricing mechanics.
      - - List pricing or rate card
        - None
        - TrustRadius says no public pricing plans are listed.
        - Market cannot estimate realized price, discounting, or package mix from a public rate card.
        - Request current standard order form and discount schedule.
      - - Free version or trial
        - None
        - TrustRadius says no free version or trial is available.
        - Suggests a sales-led or qualified-budget motion rather than bottom-up free conversion.
        - Need funnel data on demo-to-close conversion and sales cycle.
      - - Minimum budget threshold
        - Low-confidence proxy only
        - SalesHive cites roughly $5,000 per month as a public starting point, while ITQlick frames spend bands as custom estimates.
        - Useful as a directional qualifier, but not reliable enough for revenue modeling.
        - Verify actual minimum spend by region, channel, and customer tier.
      - - First-year total cost view
        - Third-party estimate only
        - ITQlick estimates broad annual cost ranges that combine platform fees, onboarding, and assumed media spend.
        - Confirms pricing opacity and possible services/ad-spend bundling, not an authoritative quote sheet.
        - Need executed customer statements of work and fee schedules.
    notes: Pricing evidence is mostly review-site inference. Public sources show spend-linked monetization, but not realized pricing after discounts, agency terms, or channel mix.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI037
