  - id: TI006
    title: Unit economics table
    columns:
      - Metric
      - Value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Gross margin
        - null
        - Low
        - Without gross margin, the software-versus-service contribution of the model cannot be separated.
        - Request gross margin by channel and service layer.
      - - CAC and payback
        - null
        - Low
        - Sales efficiency is central to judging whether growth is self-funding.
        - Request cohort CAC, payback, win rates, and payback by customer tier.
      - - Revenue per employee (implied range)
        - 82 to 417
        - Low
        - Derived from conflicting public revenue estimates and 1200 to 1732 employee counts; useful only as a scenario range.
        - Provide audited revenue, average FTE count, and contractor mix.
      - - Operating margin (implied upside case)
        - 25
        - Medium
        - If the $125M operating-earnings figure on $500M revenue is directionally right, StackAdapt could already sit in strong ad-tech margin territory.
        - Confirm GAAP operating income, adjusted EBITDA, and margin reconciliation.
      - - Sales-led pricing threshold
        - Custom and quote-based
        - Medium
        - Supports a budget-qualified GTM motion rather than a free-product conversion funnel.
        - Provide minimum spend rules, free-service policy, and sales-cycle duration.
    notes: Every numeric row here is estimated or partial. Public evidence is good enough for directional efficiency proxies, but not for a clean unit-economics model.
    claimRefs:
      - CI006
      - CI019
      - CI030
      - CI031
      - CI036
  - id: TI007
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Why it matters
      - Current public evidence
      - Severity
      - Exact diligence path
    rows:
      - - Realized net revenue and take rate
        - Determines revenue quality and channel mix.
        - Public sources show campaign scale but no audited net revenue bridge.
        - Material
        - Request revenue recognition memo, gross-vs-net policy, and channel mix by year.
      - - Gross margin and cost-to-serve
        - Separates software-like economics from service-heavy delivery.
        - No reviewed source discloses gross margin or service-delivery cost.
        - Material
        - Request segment P&L with gross margin by managed-service and self-serve cohorts.
      - - Cash, burn, debt, and runway
        - Determines financing dependency and downside protection.
        - The 2025 round is public, but balance-sheet liquidity is not.
        - Blocking
        - Request latest monthly cash bridge, debt schedule, covenants, and board runway case.
      - - Primary versus secondary split in the 2025 round
        - Controls how much of the headline raise improved solvency.
        - BetaKit says the round was mostly secondary and the company declined to confirm.
        - Material
        - Request closing statement, shareholder secondary schedule, and cap-table roll-forward.
      - - Customer concentration, retention, and payback
        - Core to underwriting the stability of any premium valuation.
        - Public review sites and company pages do not disclose NRR, CAC, or concentration.
        - Material
        - Request top-customer exposure, cohort retention, sales efficiency, and renewal data.
    notes: The diligence blockers are concentrated in the finance data room rather than in market existence or product relevance.
    claimRefs:
      - CI014
      - CI035
      - CI036
      - CI037
      - CI038
