      - number: '7.3'
        title: Partner, supply, and competition risk
        blocks:
          - type: paragraph
            body: >-
              StackAdapt’s own disclosures show that the platform is not a closed system. Identity resolution,
              onboarding, delivery, verification, and measurement all sit on top of external relationships. The privacy
              policy names agencies, audience partners, and publisher or supply-side partners. The measurement
              announcement points to LiveRamp. Fraud-control material references Forensiq, and Integral Ad Science
              maintains a StackAdapt-specific DSP guide. That is a workable ecosystem strategy, but it also means any
              material change in data-partner quality, publisher access, measurement integrations, or verification
              workflows can degrade outcomes without StackAdapt fully controlling the root cause.


              Competition compounds that dependency risk. Buyers are telling StackAdapt that tool consolidation and
              AI-driven automation matter more, while Google’s DV360 still markets a broader
              planning-through-measurement operating system inside a larger distribution footprint. Even if StackAdapt
              continues to win on service and usability, it still has to defend a position in a category where scaled
              incumbents can bundle inventory access, analytics, and workflow adjacency. In a weaker ad market, the
              pressure to consolidate toward suites with broader reach or lower perceived execution risk could intensify
              quickly.
