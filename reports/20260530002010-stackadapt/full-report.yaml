      - number: '2.2'
        title: Channel opportunity map
        blocks:
          - type: paragraph
            body: >-
              Channel mix is why StackAdapt has a differentiated market story relative to single-format DSPs. Video is
              currently the fastest-growing major U.S. digital format, and CTV is attracting new budget because it
              imports television dollars into measurable, auctionable workflows. Native remains attractive because it
              fits cookie-constrained, content-embedded buying and has multiple large but inconsistent TAM estimates,
              while DOOH is moving from static awareness media toward contextual, retail-media, and omnichannel use
              cases. Audio is smaller in dollar terms, but still expanding and often complements broader full-funnel
              plans. These channels do not roll up neatly into one clean scalar because analyst definitions differ, but
              they do point in the same direction: buyers want one platform that can unify premium supply, first-party
              or contextual targeting, and reporting across multiple formats. That is the commercial logic behind
              StackAdapt's orchestration positioning.
