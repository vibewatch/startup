      - number: '4.3'
        title: Capital adequacy and efficiency read-throughs
        blocks:
          - type: paragraph
            body: >-
              The financing itself is supportive but not fully cash-protective. Ontario Teachers and related coverage
              say the round follows the 2022 Summit Partners investment and takes total investment past $500 million,
              while management said the new money would support R&D, innovation capacity, and global expansion. But
              BetaKit’s reporting is the critical caveat: the February 2025 round was reportedly mostly secondary, and
              StackAdapt declined to confirm how much of the headline raise actually stayed on the company’s balance
              sheet. That matters because the public record does not disclose current cash, monthly burn, debt,
              covenants, or runway. There are still qualitative efficiency signals. Ontario Teachers and TechCrunch both
              emphasize profitability and cost-effectiveness, the company says it has more than 1,300 employees across
              19 markets, and the product appears designed to monetize the same advertiser relationship across more
              channels and more automation. Against public comps, that could support a healthy margin structure if the
              press-cited revenue and earnings figures are directionally right. But until the company discloses gross
              margin, cash generation, and the primary-versus-secondary split in the 2025 round, capital adequacy
              remains a directional judgment rather than a fully modelable conclusion.
