  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow product definition and channel breadth
        blocks:
          - type: paragraph
            body: >-
              StackAdapt should be understood as a self-serve marketing orchestration platform whose historical DSP core
              has expanded outward into adjacent paid and owned workflows. The official product pages still foreground
              the classic DSP jobs—finding audiences, buying media, optimizing spend, and measuring outcomes—but they
              now package those jobs alongside email, first-party data activation, dynamic creative, and orchestration
              tooling. Public channel coverage is broad by adtech standards: native, display, connected TV, video,
              audio, in-game, digital out-of-home, and email all appear in current official materials, with broadcast
              radio added through an iHeartMedia integration. The workflow implication is important: a marketer can plan
              audience strategy, activate across channels, pull customer data into the same environment, and coordinate
              follow-up paths without leaving the StackAdapt surface. That breadth is the clearest product-strength
              signal because it moves StackAdapt from “easy DSP” positioning toward a more complete mid-market
              orchestration stack.
