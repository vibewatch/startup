  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and size lens
        blocks:
          - type: paragraph
            body: >-
              The relevant market for StackAdapt is not all advertising and not even all digital advertising. The
              practical boundary is open-internet, programmatically traded spend across display, online video and CTV,
              native, audio, and DOOH, because those are the surfaces where StackAdapt claims direct workflow coverage
              and where independent DSP-style orchestration matters. Search, social, and pure creative or agency-service
              revenue are better treated as adjacent budget pools rather than core TAM because they rely on different
              buying mechanics or closed inventory. Within that narrower frame, the market is still substantial: IAB
              puts total U.S. internet advertising at $294.6 billion in 2025 and programmatic excluding search at $162.4
              billion, while synthesized global estimates imply a much larger headline pool. The diligence implication
              is that StackAdapt should be evaluated against reachable, multi-channel open-web budgets, not against the
              entire digital ad economy.
