  - id: FU002
    title: Public customer-proof funnel
    type: funnel
    layout: standard
    summary: >-
      Public evidence narrows from broad platform-scale claims to a much smaller set of named, recent, and
      renewal-visible customer proofs.
    approximationNotes: >-
      Indexed values illustrate proof attrition across evidence layers; they are not one common customer denominator and
      should not be read as literal conversion rates.
    data:
      items:
        - label: Official breadth claim
          value: 100
          description: Homepage advertises 40,000+ brands and 1.5M campaigns, establishing the widest public adoption layer.
        - label: Live advertiser dataset
          value: 15
          description: >-
            The 2026 StackAdapt report references platform data from 6,000+ global advertisers, a narrower but still
            meaningful live-use subset.
        - label: Independent tracked company sets
          value: 8
          description: >-
            TheirStack and Landbase track hundreds to tens of thousands of companies, but with different methodologies
            and universes.
        - label: Named recent case studies retained
          value: 2
          description: >-
            This chapter retains seven named recent case studies with identifiable sectors, geographies, and campaign
            outcomes.
        - label: Public renewal / concentration disclosure
          value: 0.2
          description: >-
            Public sources provide almost no direct disclosure on NRR, GRR, top-customer concentration, or contract
            duration.
