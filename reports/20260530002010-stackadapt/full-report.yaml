      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              StackAdapt appears best positioned where advertisers and agencies want premium open-web access without the
              operational burden of stitching together multiple point tools. Its own materials emphasize mid-market
              usability and SMB cross-channel adoption, while third-party market coverage shows smaller brands
              increasingly bypass holdcos in favor of direct platform buying or more attentive independent agencies.
              That combination matters because the buyer is rarely the same person as the day-to-day user: budget
              authority may sit with a CMO, media lead, or agency principal, while activation happens inside performance
              or trading teams that care about workflow simplicity and faster testing. For StackAdapt, the most relevant
              adoption sequence is usually one channel first, then expansion into CTV or video, then broader
              orchestration and attribution. The company's market position is strongest when the customer values service
              and unified execution more than the absolute cheapest access to commodity inventory.
