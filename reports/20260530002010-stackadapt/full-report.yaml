      - number: '5.5'
        title: Roadmap, differentiation, and product risk
        blocks:
          - type: paragraph
            body: >-
              StackAdapt’s strongest differentiator is that it combines approachable self-serve product design with a
              visibly expanding cross-channel surface. Forrester coverage is helpful here because it corroborates not
              just functionality but packaging: self-serve capability, onboarding, training, support, and pricing
              transparency all received top marks in the 2026 evaluation recap. That supports the commercial thesis that
              StackAdapt competes by making complex omnichannel buying easier to operate than legacy enterprise stacks.
              The risk is that ease-of-use and support praise coexist with recurring review complaints that matter for
              enterprise diligence. TrustRadius and Gartner repeatedly surface reporting limits, weak transparency,
              clunky UI flows, support-dependent tasks, pacing problems, and mixed conversion outcomes. Software Advice
              adds a lower support score than functionality score, while public evidence on attribution methodology and
              security assurance remains sparse. The practical verdict is that StackAdapt looks broad, current, and
              technically serious, but still needs deeper proof on reporting rigor, trust artifacts, and implementation
              quality to fully support a premium-control narrative.
