      - number: '8.3'
        title: Scenario Range and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              A workable scenario frame makes the current mark look asymmetric. The bull case requires StackAdapt to
              keep widening its product surface beyond DSP roots, monetize AI-led channels such as the ChatGPT pilot,
              and reach a public-market window that rewards growth software rather than punishing aggressive private
              pricing. Under that setup, a roughly 5.5x multiple on a $650 million revenue base can produce enterprise
              value around $3.6 billion. The base case assumes steadier execution, moderate multiple support, and an
              eventual valuation around $2.1 billion, which is still below today’s reported mark. The bear case assumes
              public adtech multiples remain compressed and the rumored revenue proves less defensible under audited
              disclosure, producing value closer to $1.1 billion. IPO readiness is improving—an IPO-experienced CFO is
              in place and the roadmap still shows innovation—but Reuters and Renaissance both describe a 2026 issuance
              market that remains selective and valuation-sensitive. That makes timing and disclosure quality just as
              important as growth.
