        - $600M revenue
        - 3.5x EV/Sales roughly in line with best-in-class public comp support
        - $2.1B
        - Assumes steady growth, good margins, but no exuberant multiple
        - Still below the rumored 2025 mark
      - - Bear
        - $550M revenue
        - 2.0x EV/Sales closer to mixed-quality public comp range
        - $1.1B
        - Likely if audited disclosure disappoints or multiples compress further
        - Downside amplified if cap-table preferences are senior
      - - Current mark
        - $500M reported revenue
        - Reported private transaction level
        - $2.5B
        - Observed transaction reference point
        - Signal weakened if most capital was secondary
    notes: >-
      Scenario ranges are author estimates using public comp anchors, reported StackAdapt revenue, and a May 2026 IPO
      market backdrop. Implied valuations are enterprise-value proxies, not fully diluted equity values.
