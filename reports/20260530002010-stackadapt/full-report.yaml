      - number: '7.4'
        title: People, execution, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              StackAdapt’s engineering careers materials describe a technically demanding platform: more than 2.5
              billion decisions per second, several terabytes of data per day, and engineering work spanning
              infrastructure, security, and machine learning. That scale can be a strength, but it also creates
              concentrated talent and operational risk. Sustaining low-latency bidding, secure data handling,
              measurement integrations, and fraud controls requires continued hiring and retention in hard-to-replace
              roles. Public careers pages emphasize learning and collaboration, while RepVue indicates the sales
              organization is solid but not frictionless, suggesting execution quality still depends on culture and
              management consistency as the company scales.


              Governance is the clearest area of external opacity. The public materials reviewed for this chapter
              surfaced detailed privacy and contract documentation, plus a Japan-specific commercial disclosure, but not
              public-board, committee, audited-financial, or IPO-readiness detail. That does not prove weak governance;
              it does mean outside investors have limited evidence on internal controls, board independence, or
              public-company preparedness. Until diligence fills those gaps, governance opacity should be treated as a
              real residual risk rather than a neutral unknown.
