        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Track
            body: >-
              StackAdapt looks like a quality adtech asset, but the reported $2.5 billion entry point already prices in
              a large part of the product and profitability upside while leaving core diligence questions unresolved.
              Revisit only after audited quality-of-revenue, customer durability, and cap-table economics are produced.
            calloutType: recommendation
            claimRefs:
