  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              StackAdapt is not just fighting other independent DSPs for the same budget. The buyer can solve the job
              through open-internet independents like The Trade Desk and Viant, suite incumbents like DV360 and
              Microsoft, commerce-linked platforms like Amazon DSP and Criteo, creative-curation layers like TripleLift,
              workflow-centric systems like Basis, or narrower CTV and contextual specialists like MNTN, Quantcast, and
              Seedtag. StackAdapt’s public pitch still matters because it combines native, display, video, CTV, audio,
              DOOH, and email in one interface with agency-friendly support options. But the public record also shows
              that procurement compares much broader sets of alternatives than a classic ‘DSP peer list.’ The real
              competitive frame is which platform gives an agency or brand the best mix of reach, workflow simplicity,
              data advantage, and measurable outcomes without locking the buyer into more operational complexity than
              the campaign warrants.
