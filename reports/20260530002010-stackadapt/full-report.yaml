  - id: FM001
    title: Buyer / operating-model map
    type: matrix
    layout: wide
    summary: >-
      The strongest fit is not just by segment but by operating model: buyers who value premium access, guided
      execution, and simplified workflow are structurally better matches for StackAdapt than buyers optimizing only for
      raw scale.
    data:
      columns:
        - Budget owner
        - Primary KPI
        - Preferred transaction path
        - Operational need
      rows:
        - label: Independent / mid-market agency
          values:
            - label: Agency principal
              tone: positive
              detail: Controls client allocation and vendor list
            - label: Efficiency + service
              tone: positive
              detail: Needs measurable lift without adding specialist teams
            - label: PMP / curated mix
              tone: positive
              detail: Often values premium access and workflow support over raw scale
            - label: Low complexity
              tone: positive
              detail: Platform ease of use and support are central to adoption
        - label: SMB / direct brand
          values:
            - label: Owner or generalist
              tone: neutral
              detail: Budget owner and operator are often the same person
            - label: Lead generation / sales
              tone: positive
              detail: Needs clear reporting and fast activation
            - label: Self-serve plus guidance
              tone: positive
              detail: Prefers simpler interfaces and curated supply
            - label: High hand-holding
              tone: neutral
              detail: Support quality and onboarding matter materially
        - label: Enterprise performance team
          values:
            - label: VP marketing
              tone: neutral
              detail: Budget authority often separate from traders
            - label: ROI + incrementality
              tone: positive
              detail: Wants lower waste and stronger attribution
            - label: Multi-DSP / PMP blend
              tone: neutral
              detail: May compare StackAdapt against larger incumbent DSPs
            - label: Workflow integration
              tone: neutral
              detail: Needs reporting and cross-channel retargeting
        - label: CTV / omnichannel brand team
          values:
            - label: Brand or media director
              tone: positive
              detail: Owns TV-to-digital budget migration
            - label: Reach + frequency + lift
              tone: positive
              detail: Measurement must span upper and lower funnel outcomes
            - label: PMP / guaranteed heavy
              tone: neutral
              detail: Premium inventory and transparency outweigh cheapest bids
            - label: Cross-channel coordination
              tone: positive
              detail: Needs one view across CTV, video, display, and native
        - label: Holdco / large trading desk
          values:
            - label: Central trading lead
              tone: neutral
              detail: Budget authority sits inside scaled buying organizations
            - label: Scale + governance
              tone: neutral
