companyProfile:
  summary: >
    StackAdapt is a Toronto-based adtech company founded in 2014 by Vitaly Pecherskiy, Yang Han, and Ildar Shar. What
    began as a programmatic advertising platform now looks more like a broader marketing-orchestration stack, spanning
    native, display, video, CTV, audio, DOOH, email, first-party-data activation, and growing AI-assisted workflow
    tools. Public evidence supports real scale—more than 1,300 employees across 19 markets, 40,000+ brands, and 1.5
    million campaigns launched in 2024—plus credible profitability language from both investors and press. The main
    diligence caveat is not whether the business is real; it is whether the current private valuation already prices in
    a cleaner financial profile than public evidence can yet verify.
  foundedDate: '2014-01-01'
  founders:
    - name: Vitaly Pecherskiy
      role: Co-Founder & CEO
    - name: Yang Han
      role: Co-Founder & CTO
    - name: Ildar Shar
      role: Co-Founder & Board-support role
  foundingLocation: Toronto, Canada
  headquarters: Toronto, Canada
  productSummary: >
    Self-serve and managed-service advertising platform that combines programmatic media buying, audience targeting,
    creative and workflow automation, measurement, first-party-data activation, and cross-channel orchestration across
    native, display, video, CTV, audio, DOOH, direct mail, and owned-channel extensions such as email.
  customerFocus: >
    Mid-market and upper-mid-market agencies, performance marketers, and direct brands that want easier multi-channel
    activation than enterprise suites, plus regulated and verticalized buyers in healthcare, finance, travel, B2B, and
    consumer categories.
  businessModel: >
    Monetizes advertiser spend and workflow usage across a multi-channel DSP-orchestration surface, with revenue likely
    blending media-execution economics, software-like workflow value, data activation, measurement, and service support.
  stage: growth
  fundingStatus: >
    Summit Partners invested $300M in 2022 and Teachers' Venture Growth led a $235M 2025 financing with Intrepid Growth
    Partners and other investors; reporting tied the 2025 round to an approximately $2.5B valuation, while the company
    said the reported valuation and operating figures were within range but did not publish a full cap-table update.
