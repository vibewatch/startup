  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Round Context and Pricing Discipline
        blocks:
          - type: paragraph
            body: >-
              StackAdapt enters the valuation chapter with a headline that looks strong on first read: a $235 million
              2025 equity raise, a reported valuation near $2.5 billion, and reported financial scale of more than $500
              million of revenue with roughly $125 million of operating earnings. That combination implies a business
              that is both large and reportedly profitable, which helps explain why Ontario Teachers-backed TVG and
              other investors were willing to transact. The problem is price discipline, not company quality. BetaKit
              also reported that the round was mostly secondary and that StackAdapt declined to confirm the exact
              secondary component, which means the quoted valuation may reflect a liquidity-clearing transaction more
              than a clean primary-capital endorsement. At the same time, official company materials still show real
              execution momentum: more than 1,300 employees, 19 markets, an omnichannel product footprint, and continued
              AI-led expansion. The right framing is therefore a high-quality private company whose quoted price may
              already capitalize much of that progress.
            claimRefs:
