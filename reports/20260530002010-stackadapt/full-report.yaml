      - number: '4.2'
        title: Traction estimates and public comp context
        blocks:
          - type: paragraph
            body: >-
              The strongest positive signal is that multiple independent outlets converged around a very large 2025
              financing event and meaningful operating scale. TechCrunch, BetaKit, Ontario Teachers, and other press
              reports agree on a $235 million round, while StackAdapt’s official surfaces show broad customer and
              campaign activity. Where the record breaks down is on the headline financials that matter for valuation.
              TechCrunch and other press reports tied the 2025 round to roughly $500 million of annual revenue and a
              roughly $2.5 billion valuation, while GetLatka lists only $141.4 million of 2025 revenue and a $424.1
              million disclosed valuation and Tracxn exposes just a $40.9 million UK-entity revenue figure. Those
              numbers do not reconcile into a single clean revenue bridge, so any underwriting model has to work with
              scenarios rather than a trusted point estimate. Public ad-tech comps help frame the range. As of
              2026-05-29, The Trade Desk and Magnite trade a little above 3x EV/sales, PubMatic trades around 1.6x, and
              Criteo trades below 0.4x, with operating margins ranging from negative at PubMatic to about 20% at The
              Trade Desk. Depending on which StackAdapt revenue figure is true, the implied private multiple lands
              anywhere from public-comp-like to extremely rich.
