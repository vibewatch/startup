        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              StackAdapt’s revenue model is visible at the workflow level but not at the audited ledger level. Company
              pages and review sites consistently describe a multi-channel platform that sells media execution across
              native, display, video, CTV, audio, in-game, DOOH, and email, with both self-serve and managed-service
              usage. Public pricing evidence is much thinner. TrustRadius says StackAdapt has no public pricing plans
              and no free version or trial, while ITQlick and SalesHive both describe custom, spend-linked commercial
              terms rather than a transparent rate card. That means the market can observe the monetization
              surfaces—media buying, orchestration, measurement, first-party data activation, and service support—but
              not the actual gross-to-net economics by channel, customer type, or geography. The same evidence base
              points to scale: StackAdapt’s home page says the platform serves more than 40,000 brands and launched more
              than 1.5 million campaigns in 2024. The right reading is that StackAdapt likely monetizes advertiser spend
              across a broad product surface, but public evidence still does not reveal how much of that spend becomes
              high-quality recurring software-like revenue versus more service-linked campaign revenue.
