      - number: '4.4'
        title: Underwriting verdict and public data gaps
        blocks:
          - type: paragraph
            body: >-
              The public record is good enough to support a balanced financial verdict. StackAdapt is clearly not an
              early-stage concept: the company has a broad multi-channel product, visible advertiser scale, a large 2025
              financing, and investor commentary about consistent growth and profitability. The same record also argues
              against taking the headline valuation or revenue narrative at face value. The best-known private figures
              are still estimates, the reported 2025 round appears to have included substantial secondary liquidity, and
              public sources do not disclose core diligence inputs such as realized pricing, gross margin, CAC, payback,
              NRR, burn, debt, or cash on hand. That pushes the analysis toward scenarios. If the roughly $500 million
              revenue and roughly $125 million operating-earnings figures are close to reality, StackAdapt could look
              like a premium, efficiently scaled private DSP. If the lower third-party revenue and valuation numbers are
              closer to truth, the business may still be solid, but the valuation narrative is much less compelling. The
              prudent conclusion is therefore that revenue quality and margin path look directionally promising, but the
              underwriting case remains incomplete until management provides a proper finance data room.
