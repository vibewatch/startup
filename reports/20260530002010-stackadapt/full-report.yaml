  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      StackAdapt can land through self-serve, managed service, or partner routes and then expand through channels,
      services, and integrations.
    data:
      items:
        - id: discover
          label: Discover and qualify
          actor: Agency planner, brand marketer, or partner lead
          description: >-
            Buyers discover StackAdapt through vertical pages, case studies, partner outreach, or review sites and
            evaluate fit for awareness, ABM, travel, healthcare, finance, or omnichannel use cases.
          channels:
            - Homepage and industry pages
            - Review sites
            - Case studies
            - Partner network
        - id: onboard
          label: Onboard with a service model
          actor: Customer success, agency trading desk, or direct marketer
          description: >-
            Customers can start in self-serve, hybrid, or managed-service mode, with onboarding and education handled by
            client services, partner teams, or self-serve resources.
          channels:
            - Self-serve platform
            - Hybrid support
            - Managed service
            - Academy and client services
        - id: execute
          label: Launch across channels
          actor: Media team or partner operator
          description: >-
            Accounts run campaigns across display, native, video, CTV, audio, DOOH, email, or contextual / verticalized
            targeting environments depending on use case.
          channels:
            - Display and native
            - Video and CTV
            - Audio and DOOH
            - Email and retargeting
        - id: optimize
          label: Optimize and prove value
          actor: Marketer, analyst, or agency account team
          description: >-
            StackAdapt layers reporting, Creative Studio, brand-lift, footfall attribution, and campaign optimization
            support to keep accounts active after launch.
          channels:
            - Reporting and insights
            - Creative Studio
            - Brand lift
            - Footfall / visitation measurement
        - id: expand
          label: Expand or embed
          actor: Customer revenue owner or partner product lead
          description: >-
            Mature accounts can add more channels, more vertical data, managed-service scope, or API / partner
            integrations that embed StackAdapt deeper in customer workflows.
          channels:
            - Partner program
            - Enterprise API
            - Additional channels
            - Cross-functional support
