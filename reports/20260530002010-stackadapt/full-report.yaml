  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-ready scoring of StackAdapt across scale, proof, risk, and price fairness dimensions.
    data:
      items:
        - label: Scale
          value: 8/10
          note: Reported >$500M revenue and >1,300 employees across 19 markets.
        - label: Product breadth
          value: 8/10
          note: Omnichannel platform plus AI-led roadmap and ChatGPT pilot.
        - label: Profitability quality
          value: 7/10
          note: Rumored 25% operating-earnings margin compares well with public peers, but not yet audited publicly.
        - label: Public comp support
          value: 4/10
          note: Implied 5.0x revenue multiple is well above the public-peer median.
        - label: IPO readiness
          value: 6/10
          note: CFO with IPO experience and visible roadmap cadence help, but no filing path yet.
        - label: Regulatory resilience
          value: 4/10
          note: Privacy and consent enforcement remain a live adtech headwind.
        - label: Evidence completeness
          value: 5/10
          note: Important underwriting inputs are still private or press-reported.
        - label: Valuation fairness
          value: 4/10
          note: Current mark embeds a premium that public markets do not yet validate.
    approximationNotes: Scores are author judgments on a 1–10 scale anchored to the cited evidence. Higher is better.
    claimRefs:
      - CV011
      - CV013
      - CV020
      - CV023
      - CV035
      - CV036
      - CV039
      - CV044
      - CV049
