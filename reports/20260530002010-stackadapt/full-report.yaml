            body: >-
              The public activation surface is richer than the homepage marketing language alone suggests. The API
              documentation, academy walkthroughs, and partner docs show several concrete operating surfaces: GraphQL
              and pixel APIs, CRM segment syncing, device audience uploads, cross-device targeting, connector-based
              reporting, and feature areas such as Data Hub, direct mail, cross-channel attribution, and partner
