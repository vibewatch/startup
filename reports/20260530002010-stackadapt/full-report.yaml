    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              StackAdapt’s current identity is clearer than its older reputation as only a programmatic DSP. The company
              now consistently describes itself as an AI advertising and orchestration platform that unifies paid and
              owned channels such as CTV, DOOH, display, native, audio, and email inside one workflow. That platform
              message appears across the home page, platform pages, and 2026 launch materials, and it is reinforced by
              engineering-language about software built entirely in-house around AI and automation. The origin story is
              also unusually consistent for a private adtech company: recent official pages and the 2025 financing
              release all point back to a 2014 founding in Toronto by Vitaly Pecherskiy, Yang Han, and Ildar Shar. Scale
              disclosure is strong but not perfectly clean. Official sources support Toronto headquarters, a global
              footprint spanning at least 19 markets, and headcount in a 1,200 to 1,400+ band, while customer-scale
              metrics vary by lens between clients, brands, campaigns, and platform optimizations.
