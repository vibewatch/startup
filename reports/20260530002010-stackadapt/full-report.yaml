      - number: '8.4'
        title: Recommendation, Risks, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              The final call is Track, with medium confidence, a high risk rating, and a stretched valuation stance.
              StackAdapt appears to have a legitimate quality story: global scale, an AI-led product narrative, reported
              profitability, and leadership upgrades that fit a future public-company path. But the quoted $2.5 billion
              price already embeds much of that good news while leaving basic underwriting questions unanswered. The
              biggest risks are not existential operating problems; they are valuation-specific. First, the round
              appears secondary-heavy, which weakens the signaling value of the headline mark. Second, the market still
              prices listed adtech well below StackAdapt’s implied multiple. Third, privacy enforcement and opt-in rules
              continue to pressure the targeted-advertising model. The investment case only gets stronger if audited
              revenue quality, customer durability, and cap-table economics all prove cleaner than the currently public
              record suggests. Until then, investors should monitor rather than chase the round.
            claimRefs:
