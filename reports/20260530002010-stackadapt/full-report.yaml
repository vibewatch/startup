  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              StackAdapt’s risk stack is led by factors that can transmit quickly into campaign performance, customer
              retention, and valuation: privacy and cookie-policy execution, measurement durability, platform and
              partner dependence, and competition from more integrated suites. The company’s own 2026 market report
              frames the environment as a transition where buyers want fewer tools, more automation, and better
              measurable outcomes, while independent industry coverage flags rising media costs and transparency
              pressure. That combination makes ad-spend cyclicality more dangerous than a normal macro slowdown because
              weaker budgets also intensify DSP consolidation.


              The most acute investment implication is not that StackAdapt lacks mitigations; it has meaningful privacy,
              fraud, and contractual controls. The problem is that most mitigations still rely on external
              counterparties or unsettled platform rules. Browser changes can break measurement assumptions, supply-side
              or data partners can reduce coverage or quality, and governance opacity can make it harder to judge how
              resilient the company would be under stress. For investment purposes, this chapter treats privacy and
              measurement execution as the lead kill criteria, with competition, partner concentration, and talent depth
              close behind.
            claimRefs:
