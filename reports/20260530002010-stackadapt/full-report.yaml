  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited revenue misses rumor
        - FY2025 audited net revenue below $450M
        - Current mark would screen well above justified public-comp range
        - Re-underwrite from bear case and do not add exposure
      - - Margin compression
        - EBITDA / operating margin falls below 15%
        - Premium-to-peer valuation support disappears
        - Move stance from track to avoid at current price
      - - Multiple compression
        - Public-peer median EV/Sales falls to ~1.5x or lower
        - Base-case valuation falls below current mark by a wider margin
        - Demand price reset or structured downside protection
      - - IPO window shuts
        - Two or more quarters of pulled or cut venture-backed tech IPOs
        - Exit timing extends and private valuation support weakens
        - Assume longer hold and lower exit multiple
      - - Privacy enforcement shock
        - New consent enforcement reduces targeted-ad inventory economics
        - Adtech TAM and targeting efficiency both compress
        - Reassess product differentiation and sector exposure
    notes: >-
      Thresholds are monitoring thresholds rather than forecast points. They are designed to tell an IC when to stop
      relying on the current premium narrative.
    claimRefs:
      - CV020
      - CV022
      - CV023
      - CV024
      - CV041
      - CV042
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue quality
        - Audited GAAP net revenue, gross spend, and take-rate bridge
        - Determines whether a 5.0x revenue multiple is fair or misleading
        - Finance team and auditor package
      - - Round structure
        - Primary-versus-secondary split, tender mechanics, and investor rights
        - Clarifies whether the 2025 mark represents new capital demand or liquidity clearing
        - Legal counsel and cap-table administrator
      - - Cap table
        - Liquidation preferences, participating features, and option-pool overhang
        - Common-equity returns could be far below enterprise-value math
        - Corporate secretary and financing counsel
      - - Customer durability
        - Top-customer concentration, churn, cohort retention, and NRR
        - IPO readiness depends on durable recurring economics, not just scale
        - FP&A and revenue-operations review
      - - Cash conversion
        - Free-cash-flow bridge from operating earnings to cash generation
        - A private round can look attractive on margin without producing distributable cash
        - Controller plus cash-flow package
      - - New-product monetization
        - Commercial adoption of ChatGPT, Ivy Studio, and attribution products
        - Bull case needs more than headline launches; it needs monetizable proof
        - Product and go-to-market leadership interviews
    notes: These are the minimum diligence items needed before underwriting a primary purchase at the reported valuation.
    claimRefs:
      - CV005
      - CV014
      - CV015
