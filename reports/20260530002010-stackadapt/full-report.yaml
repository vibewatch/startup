      - number: '8.2'
        title: Public Comps and Multiple Benchmarking
        blocks:
          - type: paragraph
            body: >-
              The key valuation test is whether StackAdapt’s rumored 5.0x revenue multiple is actually supported by
              public evidence. On May 2026 market data, the representative adtech peer set is materially cheaper: The
              Trade Desk screens around 3.08x EV/Sales, Magnite around 3.25x, DoubleVerify around 1.85x, PubMatic around
              1.58x, and Criteo around 0.37x, for a peer median near 1.85x. StackAdapt’s pricing is therefore about 2.7x
              that median and still above The Trade Desk, the strongest scaled public benchmark in the set. The
              mitigating point is profitability and platform breadth. If the reported $125 million operating-earnings
              figure is directionally right, StackAdapt’s margin is at least in the same neighborhood as the strongest
              public peers. There is also precedent for valuation dispersion: Multiples.vc shows MNTN at a 7.7x revenue
              multiple and AppLovin at a far richer 29.1x. Even so, the burden of proof remains on StackAdapt because
              public comparables say profitable adtech scale usually clears below the quoted private mark.
