      - number: '3.2'
        title: Platform Power and Capability Convergence
        blocks:
          - type: paragraph
            body: >-
              Public feature lists now converge enough that omnichannel breadth is table stakes, not a moat. StackAdapt
              markets AI-driven targeting, first-party and contextual activation, and wide channel coverage. The Trade
              Desk answers with open-internet positioning, profitable scale, CTV reach, retail-data integrations, and
              UID2. DV360 combines creative workflows, Analytics 360, YouTube buying, and third-party exchanges inside
              one enterprise workflow. Amazon DSP layers shopper data, Prime Video and Twitch inventory, and low-fee
              share-gaining economics onto third-party supply. Criteo’s commerce graph and retail-media footprint give
              it a different but equally durable route to performance budgets. Microsoft brings search, retail, gaming,
              display, and video surfaces under a large ecosystem umbrella. The implication is that StackAdapt wins less
              by having one more channel checkbox than rivals and more by being easier to operate for teams that do not
              need the heaviest enterprise stack or the deepest proprietary data moat.
