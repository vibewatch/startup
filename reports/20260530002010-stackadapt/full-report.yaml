      - number: '1.2'
        title: Leadership, governance, and readiness signals
        blocks:
          - type: paragraph
            body: >-
              Leadership evolution is one of the most important overview facts because it speaks to succession quality,
              board maturity, and eventual exit-readiness. Co-founder Vitaly Pecherskiy became CEO at the start of 2024,
              while co-founder Ildar Shar shifted into a board-support role and Yang Han remained CTO. Since then,
              StackAdapt has built out the finance and governance bench in ways that look more like a late-stage
              scale-up than a founder-led growth startup. September 2024 brought Cassandra Hudson as CFO, November 2024
              added Anne DelSanto to the board, and May 2026 brought Blaine Fitzgerald into the CFO role with Shopify
              IPO and Kinaxis public-company scale experience. Summit’s own portfolio write-up strengthens that picture
              by saying it helped recruit multiple C-level executives plus two independent directors. The missing piece
              is completeness: public sources still do not provide a full current board roster, so governance appears to
              be maturing faster than it is being publicly disclosed.
