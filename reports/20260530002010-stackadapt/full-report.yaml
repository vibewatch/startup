      - number: '5.4'
        title: Trust, privacy, and compliance posture
        blocks:
          - type: paragraph
            body: >-
              Public trust evidence is meaningful but uneven. StackAdapt’s privacy policy is detailed and concrete about
              what the platform does: real-time bidding, pixel collection, measurement after exposure, and processing of
              identifiers such as cookie IDs, device IDs, IP addresses, email addresses, and geolocation. The same
              policy states that GDPR-covered platform processing generally relies on consent and says clients are
              contractually prohibited from uploading special-category data, which is a stronger public disclosure than
              many adtech peers provide. API docs add visible operational controls such as explicit auth headers and
              rate limits, while the partner program promises sandbox access, documentation, paired programming, and API
              support. What is thinner is the independent proof layer. Public materials in this source set do not expose
              SOC 2 or ISO attestations, public uptime commitments, detailed incident transparency, or a deeply
              explained cross-channel measurement methodology. For buyers, that means StackAdapt’s trust posture is
              policy-forward and enablement-heavy rather than independently benchmarked in the public domain.
