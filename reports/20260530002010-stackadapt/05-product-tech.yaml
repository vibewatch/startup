  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Independent public trust artifacts such as SOC 2 / ISO certifications, uptime commitments, incident-history disclosure, or a current public trust portal.
    whyItMatters: Enterprise buyers will care less about policy language alone than about auditable third-party assurance and reliability evidence.
    diligencePath: Request current certifications, pen-test summaries, uptime / incident history, and trust-portal access from StackAdapt.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: measurement-methodology
    missingEvidence: Methodology documentation for cross-channel attribution, incrementality, brand-lift studies, and how modeled versus observed conversions are separated.
    whyItMatters: Measurement is a core part of the product promise, but public feature descriptions do not yet show enough methodological depth for underwriting.
    diligencePath: Request sample attribution outputs, methodology memos, and customer references that validate measurement accuracy in production.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: material
    topic: implementation-quality
    missingEvidence: Referenceable enterprise deployment timelines, API SLA terms, rate-limit tiers, and implementation case studies for complex multi-channel customers.
    whyItMatters: The platform may be broad and self-serve, but recurring review complaints suggest time-to-value and operational control could vary materially by account complexity.
    diligencePath: Ask for enterprise deployment plans, support SLAs, API contract details, and recent customer references that use multiple channels and integrations.
