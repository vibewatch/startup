callouts:
- calloutType: strength
  title: StackAdapt now presents as an orchestration platform, not only a DSP
  body: The strongest product signal is the combination of self-serve buying, first-party data activation, email, direct mail, attribution, and partner integrations under one umbrella. That is a materially broader workflow than a classic standalone DSP, and multiple official surfaces plus partner docs corroborate that the expansion is productized rather than merely aspirational.
  claimRefs:
  - CE004
  - CE005
  - CE016
  - CE040
- calloutType: risk
  title: Reporting and workflow friction remain the clearest product risk
  body: 'Independent reviews are directionally consistent: StackAdapt is often described as easy to use and well supported, but operators still complain about clunky reporting, limited transparency, cumbersome creative or retargeting workflows, pacing issues, and uneven conversion outcomes. That combination can matter disproportionately for sophisticated buyers who care more about control and auditability than about onboarding ease.'
  claimRefs:
  - CE033
  - CE034
  - CE035
  - CE036
  - CE037
- calloutType: risk
  title: Public trust posture is more policy-rich than assurance-rich
  body: StackAdapt publishes meaningful privacy detail and visible API controls, but the retained public sources do not surface the deeper third-party trust artifacts an enterprise diligence team would usually want, such as certifications, uptime commitments, or a transparent attribution methodology. That does not imply weakness, but it does leave more buyer risk to diligence than to public evidence.
  claimRefs:
  - CE021
  - CE039
