- id: trust-privacy-and-compliance
  title: Trust, privacy, and compliance posture
  body: 'Public trust evidence is meaningful but uneven. StackAdapt’s privacy policy is detailed and concrete about what the platform does: real-time bidding, pixel collection, measurement after exposure, and processing of identifiers such as cookie IDs, device IDs, IP addresses, email addresses, and geolocation. The same policy states that GDPR-covered platform processing generally relies on consent and says clients are contractually prohibited from uploading special-category data, which is a stronger public disclosure than many adtech peers provide. API docs add visible operational controls such as explicit auth headers and rate limits, while the partner program promises sandbox access, documentation, paired programming, and API support. What is thinner is the independent proof layer. Public materials in this source set do not expose SOC 2 or ISO attestations, public uptime commitments, detailed incident transparency, or a deeply explained cross-channel measurement methodology. For buyers,
    that means StackAdapt’s trust posture is policy-forward and enablement-heavy rather than independently benchmarked in the public domain.'
  claimRefs:
  - CE012
  - CE021
  - CE027
  - CE039
  tableRefs:
  - TE004
  figureRefs: []
- id: roadmap-differentiation-and-risk
  title: Roadmap, differentiation, and product risk
  body: 'StackAdapt’s strongest differentiator is that it combines approachable self-serve product design with a visibly expanding cross-channel surface. Forrester coverage is helpful here because it corroborates not just functionality but packaging: self-serve capability, onboarding, training, support, and pricing transparency all received top marks in the 2026 evaluation recap. That supports the commercial thesis that StackAdapt competes by making complex omnichannel buying easier to operate than legacy enterprise stacks. The risk is that ease-of-use and support praise coexist with recurring review complaints that matter for enterprise diligence. TrustRadius and Gartner repeatedly surface reporting limits, weak transparency, clunky UI flows, support-dependent tasks, pacing problems, and mixed conversion outcomes. Software Advice adds a lower support score than functionality score, while public evidence on attribution methodology and security assurance remains sparse. The practical verdict
    is that StackAdapt looks broad, current, and technically serious, but still needs deeper proof on reporting rigor, trust artifacts, and implementation quality to fully support a premium-control narrative.'
