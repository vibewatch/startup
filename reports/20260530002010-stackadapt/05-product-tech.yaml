company:
  name: StackAdapt
chapter:
  number: 5
  title: Product & Technology
  summary: 'StackAdapt is credibly more than a legacy DSP at this point: official pages, academy walkthroughs, partner docs, and 2025-2026 launches show a self-serve platform that now joins programmatic media, email, first-party-data activation, direct mail, attribution, and a growing integration surface. Public jobs and API materials also suggest real technical depth—GraphQL and pixel interfaces, distributed systems, specialized data and bidding teams, and a developer ecosystem around Ivy—but the trust surface is still stronger on privacy policy and enablement than on public security attestations or measurement methodology detail. Independent reviews remain the main counterweight, repeatedly praising usability and support while also flagging reporting transparency, clunky workflows, pacing risk, and support-dependent tasks.'
sections:
- id: workflow-product-definition
  title: Workflow product definition and channel breadth
  body: 'StackAdapt should be understood as a self-serve marketing orchestration platform whose historical DSP core has expanded outward into adjacent paid and owned workflows. The official product pages still foreground the classic DSP jobs—finding audiences, buying media, optimizing spend, and measuring outcomes—but they now package those jobs alongside email, first-party data activation, dynamic creative, and orchestration tooling. Public channel coverage is broad by adtech standards: native, display, connected TV, video, audio, in-game, digital out-of-home, and email all appear in current official materials, with broadcast radio added through an iHeartMedia integration. The workflow implication is important: a marketer can plan audience strategy, activate across channels, pull customer data into the same environment, and coordinate follow-up paths without leaving the StackAdapt surface. That breadth is the clearest product-strength signal because it moves StackAdapt from “easy DSP” positioning
    toward a more complete mid-market orchestration stack.'
  claimRefs:
