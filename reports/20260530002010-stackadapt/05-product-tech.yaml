- id: operating-architecture-and-developer-signal
  title: Operating architecture and developer signal
  body: 'StackAdapt does not publish a formal architecture diagram, but the combination of API docs, engineering-career pages, partner-program language, academy walkthroughs, and current job openings reveals a useful operating picture. The company appears to run a layered platform with audience and data services, optimization engines, APIs, reporting surfaces, partner integrations, and channel-specific execution teams rather than a single undifferentiated DSP monolith. Public signals point to significant internal specialization: Greenhouse postings name teams for Data Platform, Data Delivery, Programmatic Bidding, Measurements, Integrations, Developer Ecosystem, and Orchestration Flows, while the engineering page highlights large-scale real-time bidding, terabytes of daily data, and a modern multi-language stack. The MaRS Developer Ecosystem job is especially revealing because it says StackAdapt maintains a GraphQL Public API plus MCP tools that power Ivy. That does not prove clean service
    boundaries or enterprise-grade reliability on its own, but it does support the view that StackAdapt is operating a sizable distributed software estate with real API and integration ambitions.'
