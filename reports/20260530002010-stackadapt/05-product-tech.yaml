- id: activation-measurement-and-integrations
  title: Activation, measurement, and integration surface
  body: 'The public activation surface is richer than the homepage marketing language alone suggests. The API documentation, academy walkthroughs, and partner docs show several concrete operating surfaces: GraphQL and pixel APIs, CRM segment syncing, device audience uploads, cross-device targeting, connector-based reporting, and feature areas such as Data Hub, direct mail, cross-channel attribution, and partner integrations. Hightouch’s destination docs are particularly useful because they reveal operational objects that matter to real users—CRM segments, device audiences, and pixel events—while Supermetrics shows a reporting connector that exposes standard performance fields such as cost, impressions, and CTR. Conversion 2026 then adds more proof that StackAdapt is still expanding the workflow, with Command Center, Ivy Studio, AI Video Builder, direct mail, and enhanced attribution all announced in one cycle. The result is a platform whose measurement and activation story appears real,
    but still only partially transparent: the objects are visible, yet the exact methodology behind attribution and optimization remains much less public than the feature set itself.'
