- id: milestones-caveats-and-adverse-signals
  title: Milestones, caveats, and adverse signals
  body: 'Recent milestones show StackAdapt expanding both product scope and partner reach at the same time. In 2026 it added ads in ChatGPT, used Conversion 2026 to unveil a broader orchestration roadmap, extended its Experian relationship into UK first-party data activation, and added JWX video supply and signal depth. Those moves support the company’s claim that it is broadening from ad buying into a more unified marketing platform. The main caveat is disclosure quality. Public profile vendors disagree sharply on headcount, revenue, and even executive names: Usearch, The Org, and ZoomInfo do not line up with current company statements. That inconsistency does not disprove StackAdapt’s scale, but it does reduce confidence in unaudited third-party snapshots. The clearest adverse public record is legal rather than operational. PacerMonitor shows a Colorado federal case against StackAdapt filed in 2025 and dismissed with prejudice in January 2026, yet the fetched docket still leaves the allegations
    and any settlement economics opaque.'
