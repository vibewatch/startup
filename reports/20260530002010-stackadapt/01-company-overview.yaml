- id: capital-scale-and-operating-maturity
  title: Capital history, scale, and operating maturity
  body: StackAdapt’s capital history now looks like a two-step minority-financing story rather than a bootstrapped company that suddenly raised once. Summit led a $300 million minority investment in 2022, then Teachers’ Venture Growth led a $235 million round in February 2025 with Intrepid Growth Partners and four unnamed co-investors, taking disclosed cumulative investment above $500 million. Third-party reporting places the 2025 round near a $2.5 billion valuation and around $500 million of annual revenue, but the company itself stopped short of publishing a valuation. The strongest underwriting signal is therefore not a precise multiple; it is the repeated profitability language from Teachers’ Venture Growth, TechCrunch, and Summit, plus Summit’s claim of 3x revenue growth within three years. Operating-maturity evidence points in the same direction. Finance, engineering, partnerships, and business-operations pages all describe formal functions around controls, forecasting, in-house software,
    partner-led growth initiatives, and process automation, which is the organizational profile of a company preparing to operate at materially larger scale.
