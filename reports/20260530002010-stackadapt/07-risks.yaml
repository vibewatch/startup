  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: publisher-concentration
    missingEvidence: Publisher, SSP, and audience-partner concentration by spend, impressions, and revenue exposure.
    whyItMatters: Without concentration data, it is impossible to quantify how fast supply or data-partner changes could impair delivery or margin.
    diligencePath: Request the top-10 partner exposure table, major contract renewal dates, and fallback plans by function.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: invalid-traffic-disclosure
    missingEvidence: Recent invalid-traffic, unsafe-placement, and fraud-event rates by channel, geography, and major partner.
    whyItMatters: Public anti-fraud claims are directionally helpful, but they do not show whether residual fraud risk is rising or contained.
    diligencePath: Obtain channel-level IVT dashboards, exception reports, and any brand-safety incident postmortems from the last 12 months.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: privacy-incidents-and-inquiries
    missingEvidence: Any regulator inquiry history, material privacy incident log, customer DPA disputes, or enforcement correspondence.
    whyItMatters: A clean public record does not prove a clean private record, and hidden compliance friction could change legal and reputational risk materially.
    diligencePath: Ask counsel for litigation and enforcement schedules, incident registers, and representations on past notices or investigations.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: governance-and-ipo-readiness
    missingEvidence: Board composition, committee structure, internal-control maturity, audit-readiness milestones, and any IPO or late-stage financing workstream status.
    whyItMatters: Governance readiness affects financing optionality, valuation expansion, and the company’s ability to absorb regulatory or operational shocks.
    diligencePath: Request the board deck, committee charters, auditor status, and internal-controls roadmap from management.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: service-intensity-and-margin
    missingEvidence: Support headcount, service model economics, take-rate evolution, and whether fair pricing is sustained by gross margin or by people-heavy service.
    whyItMatters: If support intensity is structurally high, downturns or customer consolidation could compress margins faster than topline suggests.
    diligencePath: Request cohort gross-margin data, service ratios, renewal motion, and customer-success staffing by revenue band.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: post-cookie-performance
    missingEvidence: Customer-level measurement deltas after browser changes, including conversion loss, modeled-lift adjustments, and channel-specific variance.
    whyItMatters: Post-cookie measurement quality is the most direct bridge from privacy change to customer retention and valuation.
    diligencePath: Request post-cookie A/B studies, browser-split attribution data, and retention outcomes for customers that moved onto contextual or first-party workflows.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
