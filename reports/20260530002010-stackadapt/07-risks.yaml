- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / cookie execution
    - Browser-policy disruption
    - StackAdapt cannot show stable targeting and conversion measurement across major browsers for two consecutive quarters.
    - Pause underwriting of aggressive growth assumptions and demand post-cookie cohort evidence.
  - - Measurement accuracy
    - Attribution degradation
    - Material customer-reported ROI drift or missing attribution after a partner or browser change.
    - Escalate to thesis-break review because product credibility is central to spend retention.
  - - Supply and partner dependence
    - Concentration shock
    - A major SSP, audience partner, or measurement provider changes terms or materially narrows access.
    - Re-cut base case for margin and customer outcomes; require concentration disclosure.
  - - Fraud / brand safety
    - Quality-control failure
    - Repeated unsafe-placement or invalid-traffic incidents escape screening.
    - Treat as reputational and contractual risk; slow deployment until controls are validated.
  - - Talent and reliability
    - Core-team attrition or incident spike
    - Meaningful infra, security, or ML attrition coincides with delivery or latency issues.
    - Assume execution drag and lower confidence in roadmap delivery.
  - - Governance opacity
    - IPO or audit process begins without disclosure discipline
    - Company pursues larger financing or IPO path without board, control, or audit transparency.
    - Demand governance diligence before underwriting valuation expansion.
  notes: These kill criteria are synthesized from public risk evidence and intended for investment monitoring rather than for operational compliance use.
