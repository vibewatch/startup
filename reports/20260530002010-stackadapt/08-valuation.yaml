- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Audited GAAP net revenue, gross spend, and take-rate bridge
    - Determines whether a 5.0x revenue multiple is fair or misleading
    - Finance team and auditor package
  - - Round structure
    - Primary-versus-secondary split, tender mechanics, and investor rights
    - Clarifies whether the 2025 mark represents new capital demand or liquidity clearing
    - Legal counsel and cap-table administrator
  - - Cap table
    - Liquidation preferences, participating features, and option-pool overhang
    - Common-equity returns could be far below enterprise-value math
    - Corporate secretary and financing counsel
  - - Customer durability
    - Top-customer concentration, churn, cohort retention, and NRR
    - IPO readiness depends on durable recurring economics, not just scale
    - FP&A and revenue-operations review
  - - Cash conversion
    - Free-cash-flow bridge from operating earnings to cash generation
    - A private round can look attractive on margin without producing distributable cash
    - Controller plus cash-flow package
  - - New-product monetization
    - Commercial adoption of ChatGPT, Ivy Studio, and attribution products
    - Bull case needs more than headline launches; it needs monetizable proof
    - Product and go-to-market leadership interviews
  notes: These are the minimum diligence items needed before underwriting a primary purchase at the reported valuation.
