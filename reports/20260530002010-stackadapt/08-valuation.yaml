  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - High-quality company; price already assumes strong execution
    - Monitor for a better entry or stronger disclosure
  - - Confidence
    - Medium
    - Valuation and revenue are partly press-reported rather than audited
    - Do not underwrite a buy without diligence completion
  - - Risk rating
    - High
    - Secondary-heavy round structure, privacy overhang, and selective IPO window
    - Require downside protection through price or terms
  - - Valuation stance
    - Stretched
    - Implied 5.0x revenue multiple vs ~1.85x public-peer median
    - Treat the current round as a ceiling, not a floor
  - - What changes the view
    - Audited quality-of-revenue plus resilient retention
    - Need proof that rumored scale maps to durable, high-quality economics
    - Could move stance from track to buy if confirmed at the same price
  notes: Current mark uses reported 2025 valuation and reported revenue/operating-earnings scale. Recommendation is price-sensitive and assumes no hidden term-sheet protections.
