callouts:
- calloutType: recommendation
  title: Recommendation — Track
  body: StackAdapt looks like a quality adtech asset, but the reported $2.5 billion entry point already prices in a large part of the product and profitability upside while leaving core diligence questions unresolved. Revisit only after audited quality-of-revenue, customer durability, and cap-table economics are produced.
  claimRefs:
  - CV003
  - CV006
  - CV036
  - CV044
  - CV045
- calloutType: risk
  title: Main valuation risk
  body: A mostly secondary round can flatter valuation optics at exactly the same moment that public adtech multiples and the IPO window are still fragile. If audited disclosure fails to validate the rumored revenue quality, downside is materially larger than the headline round implies.
  claimRefs:
  - CV005
  - CV020
  - CV035
  - CV040
  - CV041
