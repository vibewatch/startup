  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Why it supports the thesis
  - Why it supports the anti-thesis
  - What would change the view
  rows:
  - - Scale
    - Reported >$500M revenue and >1,300 employees suggest real platform scale
    - Scale is not yet backed by audited public disclosure
    - Audited FY2025 statements
  - - Profitability
    - Reported ~$125M operating earnings implies strong efficiency
    - Public evidence does not reconcile GAAP revenue, gross spend, and free cash flow
    - Margin bridge and cash-conversion detail
  - - Product narrative
    - ChatGPT pilot plus Conversion 2026 launches support an AI premium story
    - Public markets do not consistently pay AI premiums to adtech unless growth is unmistakable
    - Commercial adoption metrics for new products
  - - Round signal
    - Blue-chip growth investors participated in the 2025 raise
    - Reportedly secondary-heavy structure weakens the signal from the headline valuation
    - Primary/secondary split and use-of-proceeds breakdown
  - - Exit path
    - IPO-experienced CFO and broad product footprint improve readiness
    - Reuters and Renaissance both describe a selective 2026 IPO window
    - Two quarters of stable public software issuance
  - - Regulatory risk
    - Privacy-preserving advertising could create compliant product differentiation
    - ICO and IAPP show targeted-advertising compliance remains a live headwind
    - Evidence of resilient performance under stricter consent regimes
  notes: This table contrasts the strongest support for the current price with the main reasons to resist paying it today.
