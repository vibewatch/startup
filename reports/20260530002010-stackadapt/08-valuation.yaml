- id: scenario-exit-readiness
  title: Scenario Range and Exit Readiness
  body: A workable scenario frame makes the current mark look asymmetric. The bull case requires StackAdapt to keep widening its product surface beyond DSP roots, monetize AI-led channels such as the ChatGPT pilot, and reach a public-market window that rewards growth software rather than punishing aggressive private pricing. Under that setup, a roughly 5.5x multiple on a $650 million revenue base can produce enterprise value around $3.6 billion. The base case assumes steadier execution, moderate multiple support, and an eventual valuation around $2.1 billion, which is still below today’s reported mark. The bear case assumes public adtech multiples remain compressed and the rumored revenue proves less defensible under audited disclosure, producing value closer to $1.1 billion. IPO readiness is improving—an IPO-experienced CFO is in place and the roadmap still shows innovation—but Reuters and Renaissance both describe a 2026 issuance market that remains selective and valuation-sensitive. That
    makes timing and disclosure quality just as important as growth.
  claimRefs:
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
  - CV020
  - CV022
  - CV041
  - CV042
  - CV043
  - CV049
  tableRefs:
  - TV003
  - TV005
  figureRefs:
  - FV003
- id: recommendation-and-diligence
  title: Recommendation, Risks, and Diligence Path
  body: 'The final call is Track, with medium confidence, a high risk rating, and a stretched valuation stance. StackAdapt appears to have a legitimate quality story: global scale, an AI-led product narrative, reported profitability, and leadership upgrades that fit a future public-company path. But the quoted $2.5 billion price already embeds much of that good news while leaving basic underwriting questions unanswered. The biggest risks are not existential operating problems; they are valuation-specific. First, the round appears secondary-heavy, which weakens the signaling value of the headline mark. Second, the market still prices listed adtech well below StackAdapt’s implied multiple. Third, privacy enforcement and opt-in rules continue to pressure the targeted-advertising model. The investment case only gets stronger if audited revenue quality, customer durability, and cap-table economics all prove cleaner than the currently public record suggests. Until then, investors should monitor
    rather than chase the round.'
