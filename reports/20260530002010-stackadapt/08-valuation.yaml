  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-structure
    missingEvidence: Exact primary-versus-secondary share split and any tender mechanics for the 2025 round.
    whyItMatters: The current valuation looks less informative if most dollars only cleared secondary liquidity rather than funding new growth.
    diligencePath: Request the 2025 term sheet, closing memo, and cap-table change schedule from counsel or finance.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: blocking
    topic: quality-of-revenue
    missingEvidence: Audited GAAP net revenue, gross media spend, and take-rate bridge supporting the rumored $500 million figure.
    whyItMatters: Without revenue-recognition detail, a revenue multiple can overstate or understate the economics of the business.
    diligencePath: Obtain audited FY2025 financials plus a management bridge from gross advertiser spend to recognized revenue.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: Top-customer concentration, cohort retention, and NRR disclosure.
    whyItMatters: Exit readiness depends on showing durable customer economics, not just absolute revenue scale.
    diligencePath: Ask management for cohort tables, top-20 customer concentration, and NRR by channel and region.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-benchmark-breadth
    missingEvidence: A fuller private benchmark set beyond MNTN and the cited public adtech names.
    whyItMatters: The comparable table is deliberately selective; a broader set could tighten the justified valuation range.
    diligencePath: Add at least two more late-stage private adtech or martech benchmarks once direct disclosures are available.
    relatedTableRefs:
    - TV004
sections:
- id: valuation-context
  title: Round Context and Pricing Discipline
  body: 'StackAdapt enters the valuation chapter with a headline that looks strong on first read: a $235 million 2025 equity raise, a reported valuation near $2.5 billion, and reported financial scale of more than $500 million of revenue with roughly $125 million of operating earnings. That combination implies a business that is both large and reportedly profitable, which helps explain why Ontario Teachers-backed TVG and other investors were willing to transact. The problem is price discipline, not company quality. BetaKit also reported that the round was mostly secondary and that StackAdapt declined to confirm the exact secondary component, which means the quoted valuation may reflect a liquidity-clearing transaction more than a clean primary-capital endorsement. At the same time, official company materials still show real execution momentum: more than 1,300 employees, 19 markets, an omnichannel product footprint, and continued AI-led expansion. The right framing is therefore a high-quality
    private company whose quoted price may already capitalize much of that progress.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV005
  - CV006
  - CV011
  - CV012
  - CV013
  - CV040
  - CV047
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: comp-benchmarking
  title: Public Comps and Multiple Benchmarking
  body: 'The key valuation test is whether StackAdapt’s rumored 5.0x revenue multiple is actually supported by public evidence. On May 2026 market data, the representative adtech peer set is materially cheaper: The Trade Desk screens around 3.08x EV/Sales, Magnite around 3.25x, DoubleVerify around 1.85x, PubMatic around 1.58x, and Criteo around 0.37x, for a peer median near 1.85x. StackAdapt’s pricing is therefore about 2.7x that median and still above The Trade Desk, the strongest scaled public benchmark in the set. The mitigating point is profitability and platform breadth. If the reported $125 million operating-earnings figure is directionally right, StackAdapt’s margin is at least in the same neighborhood as the strongest public peers. There is also precedent for valuation dispersion: Multiples.vc shows MNTN at a 7.7x revenue multiple and AppLovin at a far richer 29.1x. Even so, the burden of proof remains on StackAdapt because public comparables say profitable adtech scale usually clears
    below the quoted private mark.'
  claimRefs:
  - CV006
  - CV007
  - CV026
  - CV027
  - CV028
  - CV030
  - CV031
  - CV033
  - CV035
