  topStrengths:
    - >-
      Real platform breadth across native, display, video, CTV, audio, DOOH, and owned-channel workflows gives
      StackAdapt more product depth than a narrow DSP.
    - >-
      Public evidence supports meaningful operating scale, with 40,000+ brands, 1.5 million campaigns in 2024, and
      19-market global reach.
    - >-
      Investors and press repeatedly frame the business as profitable and cost-efficient, which is rare in private
      adtech at this scale.
  topRisks:
    - >-
      The reported ~$2.5B valuation implies a premium multiple versus most listed adtech peers, while audited revenue,
      gross margin, and cash-flow detail remain undisclosed.
    - >-
      BetaKit reported the 2025 financing was mostly secondary, so the headline round size may overstate how much fresh
      balance-sheet capital entered the company.
    - >-
      Privacy, measurement, partner dependence, and suite-style competition from larger platforms could pressure
      performance and retention if market conditions weaken.
  unresolvedGaps:
    - >-
      Audited net revenue, gross margin, free-cash-flow, and balance-sheet disclosure sufficient to validate the
      profitability story.
    - Customer concentration, NRR, and cohort-retention data separating agency, brand, and vertical exposure.
    - Liquidation preferences, ownership structure, and the exact secondary-versus-primary split in the 2025 round.
    - A cleaner bridge reconciling official, press, and database estimates for headcount, valuation, and revenue.
