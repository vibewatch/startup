summary:
  headline: >
    StackAdapt looks like a real, scaled, and likely profitable adtech winner, but the secondary-heavy 2025 round,
    premium reported valuation, and incomplete financial disclosure keep the current underwriting case in the
    track-not-buy bucket.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
