coverageNotes: >
  StackAdapt 是一家私营公司。在广告技术公司里，它的公开营销、招聘和融资可见度异常高，但经审计的财务披露仍然有限。最强的公开证据锚定在 2025 年 2 月由 Teachers' Venture Growth 领投的 $235M
  融资、媒体引用的约 $2.5B 估值和约 $500M 收入 / 约 $125M 经营利润数字，以及围绕原生广告、CTV、展示广告、视频广告、音频广告、DOOH
  和自有渠道工作流的官方产品与客户证明。关键承销缺口仍在于经审计净收入、毛利率、NRR、客户集中度、自由现金流转换、清算优先权，以及 2025 年融资中新股与老股的确切拆分。
