  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值
      - 如何击穿投资逻辑
      - 行动含义
    rows:
      - - 经审计收入低于传闻
        - FY2025 经审计净收入低于 $450M
        - 当前估值标记会显著高于可由上市可比公司支撑的区间
        - 按悲观情景重新承销，并且不增加敞口
      - - 利润率压缩
        - EBITDA / 经营利润率跌破 15%
        - 相对同业估值溢价失去支撑
        - 以当前价格将立场从观察调至回避
      - - 倍数压缩
        - 上市同业 EV / Sales 中位数降至约 1.5x 或更低
        - 基准情景估值较当前标记的折价扩大
        - 要求价格重置或结构性下行保护
      - - IPO 窗口关闭
        - 风投支持科技 IPO 连续两个或更多季度撤回或降价
        - 退出时间拉长，私募估值支撑走弱
        - 假设持有期更长、退出倍数更低
      - - 隐私执法冲击
        - 新同意规则执法削弱定向广告库存经济性
        - 广告技术 TAM 与定向效率同时压缩
        - 重新评估产品差异化和板块敞口
    notes: 这些阈值是监控阈值，不是预测点；它们用于提醒 IC 何时停止依赖当前溢价叙事。
    claimRefs:
      - CV020
      - CV022
      - CV023
      - CV024
      - CV041
      - CV042
      - CV046
  - id: TV006
    title: 最终尽调清单
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 经审计 GAAP 净收入、总投放额与抽成率桥接
        - 决定 5.0x 收入倍数是合理还是误导
        - 财务团队与审计师资料包
      - - 轮次结构
        - 新股与老股比例、要约机制和投资者权利
        - 厘清 2025 年估值标记代表新资金需求还是流动性出清
        - 法律顾问与股权结构表管理员
      - - 股权结构表
        - 清算优先权、参与分配条款和期权池悬空
        - 普通股回报可能远低于企业价值测算
        - 公司秘书与融资律师
      - - 客户耐久性
        - 头部客户集中度、流失、队列留存和 NRR
        - IPO 准备度靠持久的重复收入经济性，不只是规模
        - FP&A 与收入运营复核
      - - 现金转化
        - 从经营利润到现金生成的自由现金流桥接
        - 私募轮次可能利润率好看，却不产生可分配现金
        - 财务控制团队与现金流资料包
      - - 新产品变现
        - ChatGPT、Ivy Studio 和归因产品的商业化采用
        - 乐观情景不只需要发布会标题，还需要可变现证据
        - 产品和 GTM 负责人访谈
    notes: 以据报道的估值承销新股购买前，至少需要完成这些尽调项目。
    claimRefs:
      - CV005
      - CV014
      - CV015
      - CV017
      - CV018
      - CV044
      - CV045
