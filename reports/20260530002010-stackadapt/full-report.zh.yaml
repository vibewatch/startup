  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的 StackAdapt 评分，覆盖规模、证据、风险和价格公允性。
    data:
      items:
        - label: 规模
          value: 8/10
          note: 据报道收入 >$500M，在 19 个市场拥有 >1,300 名员工。
        - label: 产品广度
          value: 8/10
          note: 全渠道平台，加上 AI 主导路线图和 ChatGPT 试点。
        - label: 盈利质量
          value: 7/10
          note: 据传 25% 营业利润率优于公开同业，但尚未经过公开审计。
        - label: 公开可比公司支撑
          value: 4/10
          note: 隐含 5.0x 收入倍数明显高于公开同业中位数。
        - label: IPO 准备度
          value: 6/10
          note: 有 IPO 经验的 CFO 和可见的路线图节奏有帮助，但尚无申报路径。
        - label: 监管韧性
          value: 4/10
          note: 隐私和同意执行仍是广告技术的现实逆风。
        - label: 证据完整性
          value: 5/10
          note: 重要承销输入仍为私有，或只见于媒体报道。
        - label: 估值公允性
          value: 4/10
          note: 当前标记包含溢价，公开市场尚未验证。
    approximationNotes: 评分是作者基于引用证据作出的 1–10 分判断。分数越高越好。
    claimRefs:
      - CV011
      - CV013
      - CV020
      - CV023
      - CV035
      - CV036
      - CV039
      - CV044
      - CV049
