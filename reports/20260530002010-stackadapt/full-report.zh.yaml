      - number: '8.3'
        title: 情景区间与退出准备度
        blocks:
          - type: paragraph
            body: >-
              一个可用的情景框架会让当前估值显得不对称。牛市情景要求 StackAdapt 继续从 DSP 根基向外拓宽产品面，变现 ChatGPT 试点等 AI
              主导渠道，并遇到一个奖励增长型软件、而非惩罚激进私募定价的公开市场窗口。在这种设定下，以 $650 million 收入为基数、约 5.5x 倍数，可以推导出约 $3.6 billion
              企业价值。基准情景假设执行更稳、倍数支撑温和，最终估值约 $2.1 billion，仍低于今天的据报估值。熊市情景假设公开 广告科技倍数继续受压，传闻收入在审计披露下不够站得住，价值更接近 $1.1
              billion。IPO 准备度正在改善——有 IPO 经验的 CFO 已到位，路线图也仍在显示创新——但 Reuters 和 Renaissance 都把 2026
              年发行市场描述为选择性强、对估值敏感。因此，时点和披露质量与增长同样重要。
