      - - 供应与合作伙伴依赖
        - 集中度冲击
        - 主要 SSP、受众合作伙伴或衡量供应商变更条款，或大幅收窄访问权限。
        - 重新测算利润率和客户结果的基准情景；要求披露集中度。
      - - 欺诈 / 品牌安全
        - 质量控制失效
        - 多次不安全投放或无效流量事故漏过筛查。
        - 将其视为声誉和合同风险；控制措施验证前放慢部署。
      - - 人才和可靠性
        - 核心团队流失或事故激增
        - 基础设施、安全或 ML 团队出现明显流失，同时交付或延迟出问题。
        - 假设执行受拖累，并下调路线图交付信心。
      - - 治理不透明
        - IPO 或审计流程启动，但披露纪律不足
        - 公司在缺少董事会、控制或审计透明度的情况下推进更大规模融资或 IPO 路径。
        - 在承销估值扩张前，要求完成治理尽调。
    notes: 这些终止标准综合公开风险证据，用于投资监测，而不是运营合规。
    claimRefs:
      - CR001
      - CR030
      - CR032
      - CR039
      - CR043
      - CR044
      - CR045
      - CR046
      - CR051
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 证据
      - 决策含义
    rows:
      - - 投资建议
        - 观察
        - 公司质量高；价格已经假设强执行
        - 观察更好入场点或更强披露
      - - 信心
        - 中
        - 估值和收入部分来自媒体报道，而非审计
        - 尽调完成前，不承销买入
      - - 风险评级
        - 高
        - 老股交易占比较高的轮次结构、隐私压力，以及选择性 IPO 窗口
        - 要求通过价格或条款获得下行保护
      - - 估值立场
        - 偏高
        - 隐含 5.0x 收入倍数，对比约 1.85x 上市可比公司中位数
        - 把当前轮次视为上限，而非底线
      - - 什么会改变判断
        - 审计后的收入质量，加上有韧性的留存
        - 需要证明传闻中的规模能对应到可持续、高质量的经济性
        - 若在同一价格确认，立场可能从观察转为买入
    notes: 当前标记采用报道的 2025 年估值，以及报道的收入 / 运营利润规模。建议对价格敏感，并假设不存在隐藏的投资条款保护。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV035
      - CV036
      - CV044
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 为何支持投资逻辑
      - 为何支持反向逻辑
      - 什么会改变判断
    rows:
      - - 规模
        - 据报道收入 >$500M、员工 >1,300 人，说明平台规模真实
        - 规模尚未得到审计后公开披露支撑
        - 审计后的 FY2025 报表
      - - 盈利能力
        - 据报道运营利润约 $125M，意味着效率较强
        - 公开证据无法勾稽 GAAP 收入、总投放额和自由现金流
        - 利润率桥接和现金转化细节
      - - 产品叙事
        - ChatGPT 试点叠加 Conversion 2026 发布，支撑 AI 溢价叙事
        - 除非增长明确无误，公开市场并不稳定给予广告技术公司 AI 溢价
        - 新产品商业采用指标
      - - 融资轮次信号
        - 顶级成长投资者参与了 2025 年融资
        - 据报道老股交易占比较高，削弱了标题估值释放的信号
        - 新股 / 老股拆分，以及募资用途明细
      - - 退出路径
        - 有 IPO 经验的 CFO 和广泛产品版图提升准备度
        - Reuters 和 Renaissance 都称 2026 年 IPO 窗口具有选择性
        - 公开软件公司发行连续两个季度稳定
      - - 监管风险
        - 保护隐私的广告方案可能打造合规产品差异化
        - ICO 和 IAPP 显示，定向广告合规仍是现实逆风
        - 在更严格同意机制下仍能保持表现的证据
    notes: 本表对照支持当前价格的最强理由，以及今天不应支付该价格的主要理由。
