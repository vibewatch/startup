      - number: '4.4'
        title: 承销结论与公开数据缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录足以支持一个均衡的财务结论。StackAdapt 显然不是早期概念：公司有宽广的多渠道产品、可见的广告主规模、大额 2025
              年融资，以及投资人关于持续增长和盈利能力的评论。同一记录也反对把标题估值或收入叙事照单全收。最知名的私募数字仍是估计；据报道 2025
              年融资包含大量老股流动性；公开来源没有披露实际定价、毛利率、CAC、回本周期、NRR、烧钱速度、债务或账上现金等核心尽调输入。这会把分析推向情景。如果约 $500 million 收入和约 $125
              million 经营利润数字接近现实，StackAdapt 可能像一家高溢价、有效率规模的私营
              DSP。如果较低的第三方收入和估值数字更接近事实，业务可能仍然扎实，但估值叙事就没有那么有说服力。因此，审慎结论是收入质量和利润率路径方向上可期，但承销案例在管理层提供正式财务资料室之前仍不完整。
