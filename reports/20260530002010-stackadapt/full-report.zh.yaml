      - number: '1.2'
        title: 领导层、治理与准备度信号
        blocks:
          - type: paragraph
            body: >-
              领导层演进是公司概况里最重要的事实之一，因为它直接关系到接班质量、董事会成熟度和最终退出准备度。联合创始人 Vitaly Pecherskiy 在 2024 年初出任 CEO；联合创始人 Ildar Shar
              转向董事会支持角色，Yang Han 留任 CTO。此后，StackAdapt 搭建财务和治理班底的方式，更像一家后期扩张公司，而不是仍由创始人单线驱动的成长型创业公司。2024 年 9 月 Cassandra
              Hudson 加入担任 CFO，2024 年 11 月 Anne DelSanto 加入董事会，2026 年 5 月 Blaine Fitzgerald 出任 CFO，带来 Shopify IPO 和
              Kinaxis 上市公司规模化经验。Summit 自己的投资组合文章也强化了这一判断：它称自己帮助招聘了多名 C
              级高管和两名独立董事。缺口在完整性：公开来源仍没有给出完整的当前董事会名单，因此治理似乎成熟得比公开披露更快。
