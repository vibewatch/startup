      - number: '7.2'
        title: 隐私、监管与衡量风险
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 公开承认其运营模式数据密集。平台隐私政策称，公司通常充当控制者，处理 cookie IDs、IP 地址和 device IDs 等假名标识符，并为广告目的与代理机构、受众伙伴、出版方
              或供给侧合作伙伴共享数据。DPA、cookie 政策和 2026 年 1 月 Data Privacy Framework 公告显示 StackAdapt
              已投入法律和跨境传输基础设施；但它们也记录了一个有意义的合规表面，需要在同意、处理者—控制者 边界、子处理者、审计权和跨境传输之间持续运转。


              外部环境仍不稳定。W3C 继续主张第三方 cookie 应该消失；MDN 把 Privacy Sandbox 描述为仍有争议的替代架构；AdExchanger 2026 年报道显示 Google
              路线图变得多么混乱。StackAdapt 的答案是情境化和隐私优先定位，加上 LiveRamp 等衡量合作伙伴；但这一答案仍留下问题：在不同浏览器、渠道和地区，cookie 后 归因准确性和客户 ROI
              是否还能保持强劲。这就是为什么即便承认公司的缓释工作，隐私执行和衡量漂移仍是本章剩余风险最高的部分。
