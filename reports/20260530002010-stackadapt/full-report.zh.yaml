      - number: '5.4'
        title: 信任、隐私与合规姿态
        blocks:
          - type: paragraph
            body: >-
              公开信任证据有意义，但并不均衡。StackAdapt 的隐私政策对平台实际做什么写得详细而具体：实时竞价、像素采集、曝光后衡量，以及处理 cookie IDs、device IDs、IP
              地址、电子邮件地址和地理位置等标识符。同一政策称，受 GDPR 覆盖的平台处理通常依赖同意，并称合同禁止客户上传特殊类别数据；这比许多广告技术同行提供了更强的公开披露。API
              文档增加了可见的运营控制，如明确身份验证头和速率限制；合作伙伴计划承诺沙盒访问、文档、结对编程和 API 支持。更薄的是独立证明层。本来源集中公开材料没有暴露 SOC 2 或 ISO
              证明、公开正常运行时间承诺、详细事件透明度，或深入解释的跨渠道衡量方法。对买家而言，这意味着 StackAdapt 的信任姿态偏政策和赋能，而不是在公开域内由独立基准充分背书。
