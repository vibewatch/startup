  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 的相关市场不是全部广告，甚至不是全部数字广告。实际边界是开放互联网里通过程序化交易的展示广告、在线视频和 CTV、原生广告、音频广告、DOOH 花费，因为这些才是 StackAdapt
              声称直接覆盖工作流、且独立 DSP 式编排真正重要的场景。搜索、社交，以及纯创意或代理服务收入，更适合作为相邻预算池，而不是核心
              TAM，因为它们依赖不同的购买机制或封闭库存。在这个更窄的框架里，市场仍然可观：IAB 预计 2025 年美国互联网广告总额为 $294.6 billion，剔除搜索的程序化广告为 $162.4
              billion；合成后的全球估算则暗示一个更大的表观市场池。尽调含义是，评估 StackAdapt 应该对标可触达的多渠道开放网络预算，而不是整个数字广告经济。
