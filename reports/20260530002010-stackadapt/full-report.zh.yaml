  - id: TP001
    title: 按买方替代方案划分的竞争格局
    columns:
      - 替代类别
      - 代表选项
      - 买方选择原因
      - 结构性优势
      - 对 StackAdapt 的含义
    rows:
      - - 独立全渠道 DSP
        - 平台对标：The Trade Desk；Viant；StackAdapt
        - 想在无围墙花园的情况下，跨多种格式透明采购开放网络媒体
        - 广泛渠道访问和客观采购叙事
        - StackAdapt 在这里正面竞争，但并不独占一个独特品类
      - - 套件型既有玩家 / 企业技术栈
        - DV360；Microsoft Advertising
        - 已在更大平台内运行分析、搜索、创意、零售或 CRM 工作流
        - 绑定相邻工具、数据、治理和企业采购团队
        - 大平台捆绑是企业交易中最难顶住的压力
      - - 连接商业数据的媒体平台
        - Amazon DSP；Criteo
        - 需要购物者数据、零售媒体和与销售绑定的闭环测量
        - 专有商业信号和可变现零售库存
        - 在商业数据最关键的场景，这些供应商强于 StackAdapt
      - - 创意精选 / 供给叠加层
        - TripleLift
        - 想要精选受众、供给质量和创意适配，但不更换整个技术栈
        - 可嵌入既有 DSP 关系，在供给层改善效果
        - 降低 StackAdapt 覆盖工作流每一环的概率
      - - 工作流 / 运营平台
        - Basis
        - 想用一个系统管理搜索、社交、程序化、CTV 和计费运营
        - 面向代理商团队的运营自动化
        - 靠流程效率争夺中端市场和代理商预算
      - - CTV 专家
        - MNTN
        - 需要快速自助采购电视广告，并清晰控制创意和预算
        - 使用场景更窄、上手更快、价值主张更简单
        - 可能从更宽的 DSP 抽走漏斗上层和效果电视支出
      - - 上下文 / 无 cookie 专家
        - Quantcast；Seedtag
        - 需要自主 AI、隐私优先的上下文采购，或低 cookie 依赖触达
        - 为优先考虑身份韧性或上下文效果的团队提供聚焦替代方案
        - 从下方挤压 StackAdapt 的原生 / 上下文楔子
    notes: 各行概括截至 2026-05-30 争夺 StackAdapt 邻近预算的主要公开替代类别；买方常常同时使用多个类别。
