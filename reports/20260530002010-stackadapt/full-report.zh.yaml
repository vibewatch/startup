  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与定价纪律
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 进入估值讨论时，第一眼看上去很强：2025 年 $235 million 股权融资、据报接近 $2.5 billion 的估值，以及超过 $500 million 收入、约 $125
              million 经营利润的财务规模。据此看，公司体量已经不小，且据报已经盈利，这也解释了为什么 Ontario Teachers 支持的 TVG
              和其他投资者愿意出手。问题不在公司质量，而在价格纪律。BetaKit 还报道称，本轮大多是老股转让，StackAdapt
              拒绝确认具体老股占比；也就是说，外界引用的估值可能更像一笔清理流动性的交易，而不是一次干净的新资金背书。同时，公司官方材料仍显示执行动能真实存在：员工超过 1,300 人、覆盖 19
              个市场、具备全渠道产品版图，并继续靠 AI 扩张。因此，更合适的框架是：这是一家高质量未上市公司，但外界报价可能已经计入了相当多进展。
