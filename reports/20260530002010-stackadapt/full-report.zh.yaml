    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 具名公开证据在广告活动结果和地域广度上最强，在续约可见性和经常性商业细节上最弱。
    data:
      columns:
        - 结果具体度
        - 地域广度
        - 服务强度
        - 续约可见性
      rows:
