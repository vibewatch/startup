      - number: '8.4'
        title: 建议、风险与尽调路径
        blocks:
          - type: paragraph
            body: >-
              最终结论是跟踪，置信度中等，风险评级高，估值立场偏紧。StackAdapt 确实有一个成立的质量故事：全球规模、AI 主导的产品叙事、据报盈利，以及符合未来上市公司路径的领导层升级。但 $2.5 billion
              报价已经嵌入相当多好消息，同时基础承销问题仍未回答。最大的风险不是生存层面的经营问题，而是估值问题。第一，本轮似乎老股占比较高，削弱了表面估值的信号价值。第二，公开市场给上市 广告科技的定价仍显著低于
              StackAdapt
              隐含倍数。第三，隐私执法和选择加入规则继续挤压定向广告模式。只有经审计收入质量、客户耐久度和股权结构经济性都比当前公开记录更干净，投资逻辑才会更强。在此之前，投资者应监测，而不是追价参与本轮。
