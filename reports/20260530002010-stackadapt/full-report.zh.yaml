      - number: '3.2'
        title: 平台力量与能力趋同
        blocks:
          - type: paragraph
            body: >-
              公开功能清单已经足够趋同，全渠道广度成了入场券，而不是护城河。StackAdapt 主打 AI 驱动定向、第一方和情境化激活，以及广泛渠道覆盖。The Trade Desk 用开放互联网定位、盈利规模、CTV
              触达、零售数据集成和 UID2 回应。DV360 把创意工作流、Analytics 360、YouTube 购买和第三方交易所合进一个企业工作流。Amazon DSP 在第三方供给上叠加购物者数据、Prime
              Video 和 Twitch 库存，以及低费率抢份额的经济性。Criteo 的商业图谱和零售媒体足迹，给它提供了另一条同样耐久的效果预算路径。Microsoft
              则把搜索、零售、游戏、展示广告和视频广告场景纳入一个大型生态伞下。含义是，StackAdapt 的胜出不太靠比对手多一个渠道勾选框，而更靠让那些不需要最重企业栈或最深自有数据护城河的团队更容易运营。
