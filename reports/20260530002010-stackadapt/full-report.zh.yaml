      - - Viant
        - 销售主导、聚焦代理商的平台
        - 开放互联网案例研究和 CTV 衡量材料
        - 销售主导的定制商业模式
        - 重视 CTV 和身份深度的代理商
        - 上市公司可信度会抬高 StackAdapt 在代理商 RFP 中的门槛
      - - Amazon DSP
        - 为 Microsoft Invest 广告主提供迁移和合作伙伴主导支持
        - 明确突出高接触度迁移支持
        - Digiday 报道费用通常为 4-8%，有时更低
        - 追求商业效果和规模的品牌与代理商
        - 价格压力可能重置整个品类的买方预期
      - - The Trade Desk
        - 企业级平台，有专业团队
