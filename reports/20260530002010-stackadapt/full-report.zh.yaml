              StackAdapt 的资本历史如今更像一段两步少数股权融资故事，而不是一家自举公司突然融了一轮。Summit 在 2022 年领投 $300 million 少数股权投资；随后 Teachers’
              Venture Growth 在 2025 年 2 月领投 $235 million 融资，Intrepid Growth Partners 和四家未具名共同投资方参投，使已披露累计投资超过 $500
