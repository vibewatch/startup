        - 正向
        - 近期
        - 66% 营销人员称，孤岛式执行会浪费最高 30% 的程序化预算；专家级多渠道广告活动显示出更高 CTR
        - 支撑 StackAdapt 的编排叙事，也让统一采购成为可销售的 ROI 故事
        - 检验客户案例能否在 StackAdapt 自有样本之外显示持续的跨渠道效果提升
      - - AI 和技术栈整合成为基线预期
        - 正向
        - 近期
        - 头部表现者整合工具、把 AI 落地运营的概率明显更高
        - 利好能把数据、创意、优化和报告打包进同一工作流的供应商
        - 验证 AI 功能是真被采用，还是主要停留在销售定位
      - - PMPs、精选供给和程序化直采提升份额
        - 正向
        - 近期
        - Guideline、EMARKETER 和 Start.io 均指向：精选或直采路径的支出高于纯开放交易所
        - 利好能够简化高端供给访问和供应路径优化的平台
        - 检查 StackAdapt 组合中有多少来自 PMPs 或保量交易，而不是开放交易所
      - - Cookie 不确定性把买方推向第一方和上下文方法
        - 偏正向
        - 当前
        - Google 仍把买方引向第一方数据、AI 和 Privacy Sandbox 信号，而 CMA 显示政策路径仍不稳定
        - 利好上下文和第一方友好型平台，但抬高产品和测量要求
        - 评估哪些身份识别和测量工作流在没有 cookie 级数据时仍能真正规模化
      - - 原生广告、DOOH 和 CTV 拓展全渠道计划
        - 正向
        - 当前至中期
        - 渠道分析报告持续显示，较新、更偏上下文的格式保持两位数增长
        - 支撑 StackAdapt 的卖点：买方想用一个平台覆盖认知和效果渠道
        - 量化客户是真正增加渠道，还是只测试一种新格式
      - - 直客品牌和 SMB 采用率上升
        - 正向
        - 近期
        - VideoWeek 和 StackAdapt 都指向更多直客或 SMB 参与自动化媒体采购
        - 将可触达客户基础扩展到大型控股广告集团关系之外
        - 按 SMB、中端市场代理商和企业细分测量 CAC 与留存
    notes: 方向反映的是市场对 StackAdapt 的影响，而不是底层趋势是否对所有广告技术供应商都正向。
