    data:
      xAxis: 运营可达性与自助适配度（1=销售驱动或垂直小众，10=中端市场容易激活）
      yAxis: 结构性数据或供应护城河（1=专有护城河有限，10=深厚第一方数据或独家供应）
      points:
        - label: StackAdapt
          x: 8
          'y': 5
          note: 支持模型灵活、工作流简单，但披露的专有数据有限
        - label: The Trade Desk
          x: 5
          'y': 8
          note: 规模化企业工作流，CTV、身份和零售数据关系较强
        - label: DV360
          x: 4
          'y': 9
          note: 绑定 YouTube 和 Google 分析数据的重企业工作流
        - label: Amazon DSP
          x: 5
          'y': 10
          note: 购物者数据加流媒体库存，形成该组最深的结构性护城河
        - label: Criteo
          x: 6
          'y': 8
          note: 商务图谱和零售商关系带来持久衡量与数据优势
        - label: Microsoft Advertising
          x: 5
          'y': 7
          note: 覆盖搜索、零售、游戏和开放网络伙伴的大型生态触达
        - label: TripleLift
          x: 6
          'y': 6
          note: 精选供应和定向护城河有意义，但不是完整平台锁定故事
        - label: Viant
          x: 6
          'y': 7
          note: 基于人的身份和 CTV 注意力衡量形成可信的独立护城河
        - label: Basis
          x: 7
          'y': 4
          note: 运营工作流和服务匹配度强，自有受众或库存优势较弱
        - label: MNTN
          x: 9
          'y': 3
          note: 电视激活非常容易，但在效果 CTV 之外刻意保持狭窄
        - label: Quantcast
          x: 8
          'y': 4
          note: 易用 AI 与无 Cookie 姿态提升了可达性，多于结构性护城河
        - label: Seedtag
          x: 7
          'y': 4
          note: 上下文专长可信，但比广平台竞争者更窄
