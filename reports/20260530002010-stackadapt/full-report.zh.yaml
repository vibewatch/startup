      - number: '4.3'
        title: 资本充足性与效率读数
        blocks:
          - type: paragraph
            body: >-
              这笔融资本身是支持性信号，但并不能完全保护现金。Ontario Teachers 和相关报道称，本轮接在 2022 年 Summit Partners 投资之后，使累计投资超过 $500
              million；管理层称新资金将支持 R&D、创新能力和全球扩张。但 BetaKit 报道才是关键保留点：2025 年 2 月融资据称大多是老股交易，StackAdapt
              拒绝确认标题融资额中究竟有多少留在公司资产负债表上。这很重要，因为公开记录没有披露当前现金、月度烧钱速度、债务、契约或现金跑道。仍然存在定性效率信号。Ontario Teachers 和 TechCrunch
              都强调盈利能力和成本效率；公司称在 19 个市场拥有 1,300
              多名员工；产品看起来被设计成可在同一广告主关系里货币化更多渠道和更多自动化。对比上市可比公司，如果媒体引用的收入和利润数字大体方向正确，这可能支持健康的利润结构。但在公司披露毛利率、现金生成和 2025
              年融资中新股与老股拆分之前，资本充足性仍是方向性判断，而不是可完全建模的结论。
