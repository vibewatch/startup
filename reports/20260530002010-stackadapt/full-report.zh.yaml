  - id: FP001
    title: 竞争定位图：运营可达性 vs. 结构性护城河
    type: quadrant
    layout: wide
    summary: 基于证据的序数地图，对比 x 轴运营可达性与 y 轴结构性数据或供应护城河；数值越高表示更容易或更深，并不等于普遍更好。
