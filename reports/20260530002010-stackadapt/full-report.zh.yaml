      - number: '2.2'
        title: 渠道机会地图
        blocks:
          - type: paragraph
            body: >-
              渠道组合是 StackAdapt 相比单一格式 DSP 拥有差异化市场故事的原因。视频广告目前是美国增长最快的主要数字格式；CTV 正在吸引新预算，因为它把电视广告资金导入可衡量、可竞价的工作流。原生广告
              仍有吸引力，因为它适配 cookie 受限、嵌入内容的购买方式，并且拥有多个规模很大但彼此不一致的 TAM 估计；DOOH 正从静态认知媒体走向情境化、零售媒体和全渠道用例。音频广告
              的美元规模较小，但仍在扩张，且常常补充更广的全漏斗计划。这些渠道无法干净汇总成一个单一标量，因为分析师定义不同；但它们都指向同一方向：买家想要一个平台，把优质供给、第一方或情境化定向，以及跨多种格式的报告统一起来。这就是
              StackAdapt 编排定位背后的商业逻辑。
