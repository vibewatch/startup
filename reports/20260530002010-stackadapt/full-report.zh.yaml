      - number: '4.2'
        title: 牵引力估计与上市可比公司背景
        blocks:
          - type: paragraph
            body: >-
              最强的正向信号是，多个独立媒体都指向一次非常大的 2025 年融资事件和有意义的运营规模。TechCrunch、BetaKit、Ontario Teachers 和其他媒体报道一致提到 $235 million
              融资；StackAdapt 官方表面也显示广泛的客户和营销活动活跃度。记录断裂之处在于估值真正需要的标题财务指标。TechCrunch 和其他媒体报道把 2025 年融资对应到约 $500 million
              年收入和约 $2.5 billion 估值；GetLatka 只列出 $141.4 million 的 2025 年收入和 $424.1 million 的已披露估值；Tracxn 只暴露一个 $40.9
              million 的英国实体收入数字。这些数字无法调和成一条干净的收入桥，因此任何承销模型都必须使用情景，而不是可信的点估计。上市广告技术可比公司有助于框定区间。截至 2026-05-29，The Trade
              Desk 和 Magnite 的 EV/sales 略高于 3x，PubMatic 约 1.6x，Criteo 低于 0.4x；经营利润率从 PubMatic 为负到 The Trade Desk 约 20%
              不等。取决于哪一个 StackAdapt 收入数字为真，隐含私募倍数可能落在接近上市可比公司的区间，也可能高得惊人。
