companyProfile:
  summary: >
    StackAdapt 是一家总部位于 Toronto 的广告技术公司，2014 年由 Vitaly Pecherskiy、Yang Han 和 Ildar Shar
    创立。它起步时是一个程序化广告平台，如今更像覆盖更广的营销编排栈，横跨 原生广告、展示广告、视频广告、CTV、音频广告、DOOH、电子邮件、第一方数据激活，以及不断增加的 AI 辅助工作流工具。公开证据支持其规模真实——在 19
    个市场拥有 1,300 多名员工、40,000+ 个品牌，并在 2024 年发起 1.5 million
    场营销活动——投资人与媒体关于盈利能力的表述也可信。尽调的主要保留点不是这家公司是否真实，而是当前私募估值是否已经计入一个比公开证据目前能验证的财务画像更干净的状态。
