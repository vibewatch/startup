              文档、工程招聘页、合作伙伴计划语言、学院演示教程和当前职位共同揭示了一张有用的运营图景。公司似乎运行的是一个分层平台，包含受众与数据服务、优化引擎、API、报告表面、合作伙伴集成和特定渠道执行团队，而不是单一、无差别的
