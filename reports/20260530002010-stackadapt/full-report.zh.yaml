        - id: execute
          label: 跨渠道启动投放
          actor: 媒体团队或合作伙伴运营方
          description: 账户会按用例，在展示、原生、视频、CTV、音频、DOOH、电子邮件，或语境 / 垂直化定向环境中投放广告。
