  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 收入假设
      - 倍数 / 逻辑
      - 隐含估值
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - $650M 收入
        - 5.5x EV/Sales，由 AI 驱动扩张和 IPO 市场接纳度支撑
        - $3.6B
        - 需要新产品和 ChatGPT 试点拓宽增长叙事
        - IPO 窗口未必奖励私募市场定价
      - - 基准
        - $600M 收入
        - 3.5x EV/Sales，大致符合一流上市可比公司支撑
        - $2.1B
        - 假设增长稳定、利润率良好，但没有亢奋倍数
        - 仍低于传闻中的 2025 年标记
      - - 悲观
        - $550M 收入
        - 2.0x EV/Sales，更接近质量参差的上市可比公司区间
        - $1.1B
        - 若审计披露不及预期或倍数进一步压缩，则更可能发生
        - 若股权结构表里的优先权更靠前，下行会被放大
      - - 当前标记
        - 据报道 $500M 收入
        - 报道中的私募交易水平
        - $2.5B
        - 已观察到的交易参考点
        - 如果大部分资金是老股交易，信号会减弱
    notes: 情景区间为作者估计，使用上市可比公司锚点、报道的 StackAdapt 收入和 2026 年 5 月 IPO 市场背景。隐含估值是企业价值代理，不是完全稀释后的股权价值。
