      - number: '7.4'
        title: 人才、执行与治理不透明
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 的工程招聘材料描述了一个技术要求很高的平台：每秒超过 2.5 billion 次决策、每天数 TB
              数据，以及横跨基础设施、安全和机器学习的工程工作。这种规模可以是优势，但也制造了集中的人才和运营风险。维持低延迟竞价、安全数据处理、衡量集成和欺诈控制，需要在难以替代的岗位上持续招聘并留住人才。公开招聘页强调学习和协作；RepVue
              则显示销售组织扎实但并非没有摩擦，说明公司扩张时，执行质量仍取决于文化和管理一致性。


              治理是外部不透明最明显的领域。本章审阅的公开材料浮现了详细的隐私和合同文件，以及一份日本特定商业披露；但没有公开董事会、委员会、经审计财务或 IPO
              准备度细节。这并不能证明治理薄弱；它意味着外部投资者对内部控制、董事会独立性或上市公司准备程度的证据有限。在尽调填补这些缺口之前，治理不透明应被视为真实剩余风险，而不是中性未知项。
