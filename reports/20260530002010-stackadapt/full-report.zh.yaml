  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流产品定义与渠道广度
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 应被理解为一个自助式营销编排平台：历史上的 DSP 核心已经向相邻的付费和自有工作流外扩。官方产品页仍然把经典 DSP
              任务放在前台——寻找受众、购买媒体、优化花费、衡量结果——但现在也把这些任务与
              电子邮件、第一方数据激活、动态创意和编排工具打包在一起。按广告技术标准看，公开渠道覆盖很广：原生广告、展示广告、连接电视、视频广告、音频广告、游戏内广告、数字户外 和电子邮件都出现在当前官方材料中，广播电台则通过
              iHeartMedia 集成加入。工作流含义很重要：营销人员可以规划受众策略，跨渠道激活，把客户数据拉进同一环境，并协调后续路径，而不必离开 StackAdapt 界面。这种广度是最清楚的产品强度信号，因为它让
              StackAdapt 从“易用 DSP”定位，走向更完整的中端市场编排栈。
