    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与运营覆盖
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 现在的定位，比过去“只是程序化 DSP”的名声清楚得多。公司如今稳定把自己描述为 AI 广告与编排平台，在同一个工作流里打通 CTV、DOOH、展示广告、原生广告、音频广告、电子邮件
              等付费和自有渠道。主页、平台页和 2026 年发布材料都在重复这一平台叙事，围绕 AI 和自动化完全自研的软件工程表述也在强化它。作为一家私营广告技术公司，StackAdapt
              的起源故事也异常一致：近期官方页面和 2025 年融资新闻稿都指向 2014 年在 Toronto 由 Vitaly Pecherskiy、Yang Han 和 Ildar Shar
              创立。规模披露很强，但并不完全干净。官方来源支持 Toronto 总部、至少覆盖 19 个市场的全球足迹，以及 1,200 到 1,400+
              人的员工区间；但客户规模指标会因观察口径不同，在客户、品牌、营销活动和平台优化次数之间切换。
