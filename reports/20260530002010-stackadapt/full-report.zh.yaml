      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              反向证据指向一个真实但并不深的护城河。Digiday 2026 年报道显示，即便是 The Trade Desk 的合作伙伴，也在随着衡量和经济性变化探索 Amazon、直接交易、零售媒体网络 和其他
              DSP；另一篇 Digiday 则显示 Amazon 借助 Microsoft 退出、流媒体合作和激进费率策略，强化自己对开放网络购买的控制。这些信号对 StackAdapt
              很重要，因为它们意味着整个品类的切换成本更低、多栖使用更多，而不是更少。Google 持续的反垄断补救措施可能在主导生态周围创造机会，但也凸显广告技术分发和身份识别的政策背景多么不稳定。StackAdapt
              新的营销技术套件拓宽了产品表面，可能提高客户粘性；但它也同时把公司拉入与套件和编排厂商更直接的竞争。耐久上行仍取决于代理机构适配、服务质量，以及原生广告 / 情境化
              执行；耐久下行则来自捆绑经济性、第一方数据稀缺，以及 AI 驱动功能商品化。因此，客户集中度、代理机构钱包份额，以及从原生广告扩展到 CTV 或电子邮件 的附加率，比原始功能地图本身更重要。
