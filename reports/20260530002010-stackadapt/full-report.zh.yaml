  - id: TM006
    title: 负面压力与市场约束表
    columns:
      - 压力
      - 证据
      - 受影响最大者
      - 重要性
      - 缓解 / 待测试事项
    rows:
      - - 2024 年激增后的增长放缓
        - Guideline 称，2024 年月度增幅曾达 20–50%，之后 2025 年增长回落到低两位数或个位数
        - 所有 DSP 和广告技术供应商
        - 运营杠杆和销售效率比表面 TAM 更重要
        - 在更疲软的宏观情景下压力测试预算
      - - CTV 碎片化和测量不一致
        - AdExchanger 称，碎片化、透明度、测量不一致和广告欺诈是 2026 年买方最担心的问题
        - CTV 买方、小型广告主和代理商
        - 可能拖慢预算迁移，并利好规模化或垂直整合卖方
        - 验证 StackAdapt 能否简化发布商访问和报告，同时不掩盖取舍
      - - CTV 替代 ID 质量存疑
        - AdExchanger 报道，市场对基于邮箱 ID 的同意、家庭错配和 QA 存疑
        - CTV 发布商、DSP 和采购高端 CPM 的品牌
        - 削弱定向主张，也可能降低可用可触达性
        - 审计哪些身份信号驱动效果，以及 QA 标准是否有文档
      - - 围墙花园和直客品牌自助服务吸走需求
        - VideoWeek 显示，在美国广告市场，品牌直采支出已超过控股广告集团份额
        - 独立 DSP、代理商和高端发布商
        - 开放网络平台必须靠服务、透明度和渠道广度取胜，而不是单纯拼规模
        - 对比 StackAdapt 的 SMB 单位经济与大型平台替代方案
      - - 程序化仍与大规模直采份额并存
        - Guideline 称，2025 年程序化约占媒体交易总量的 30%
        - 假设总钱包会快速迁移的平台
        - 限制广义广告 TAM 转化为可触达支出的速度
        - 建模时把采用视为逐步份额提升，而非即时替代
      - - 分析师 TAM 估算分散
        - 即便同一年，不同供应商对原生广告和 DOOH 的估算也差异明显
        - 投资人和战略团队
        - 过度精确的 TAM 计算会夸大 StackAdapt 可触达市场的确定性
        - 使用区间口径测算规模，并向管理层索取已披露的 SAM 下切口径
    notes: 这张表捕捉采用和估值的结构性约束，而非公司执行风险；后者放在后续章节。
