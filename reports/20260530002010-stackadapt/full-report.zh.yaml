        - TrustRadius 和 Reddit 式评论暗示，StackAdapt 可能最擅长品牌认知、CTV 和细分定向，而不是每一种下漏斗投放需求
        - 这可能限制其在重效果广告主中的钱包份额
        - 要求按上漏斗与直接响应队列提供留存和 ROAS
      - - 缺少公开集中度披露
        - 未公开头部客户占比、合同期限、NRR 或 GRR
        - 尽管广度信号强，核心耐久性问题仍未解决
        - 要求提供前 20 大客户名单、续约队列，以及代理商与品牌收入拆分
    notes: 扩张逻辑在产品和服务模式里可见，但集中度和耐久性仍需私下证据，而不是公开事实。
