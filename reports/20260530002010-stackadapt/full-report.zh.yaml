  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与货币化可见度
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 的收入模式在工作流层面可见，但在经审计账本层面不可见。公司页面和评论网站一致描述了一个多渠道平台：跨原生广告、展示广告、视频广告、CTV、音频广告、游戏内广告、DOOH
              和电子邮件销售媒体执行，并同时支持自助式和托管服务使用。公开定价证据薄得多。TrustRadius 称 StackAdapt 没有公开定价方案，也没有免费版本或试用；ITQlick 和 SalesHive
              都描述的是定制、与花费挂钩的商业条款，而不是透明价目表。也就是说，市场能看到货币化表面——媒体购买、编排、衡量、第一方数据激活和服务支持——但看不到按渠道、客户类型或地区拆分的实际毛额到净额
              经济性。同一证据基础指向规模：StackAdapt 主页称平台服务 40,000 多个品牌，并在 2024 年发起 1.5 million 多场营销活动。正确解读是，StackAdapt
              很可能在宽产品表面上货币化广告主花费，但公开证据仍未说明其中多少花费会变成高质量、类似软件的经常性收入，而多少更接近与服务绑定的营销活动收入。
