        - 要求提供服务辅助账户的附加率、续约提升和利润率画像
      - - 面向 B2B、旅行、医疗健康和金融的垂直解决方案
        - 公开垂直页面展示定位，但不披露按行业的客户集中度
        - 垂直专精可在受监管或数据密集账户中抬高切换成本
        - 要求提供行业收入结构和头部垂直领域增长 / 流失趋势
      - - 合作伙伴计划与 API
        - 若少数集成主导需求，嵌入式和合作伙伴渠道可能形成渠道依赖
        - API 和合作伙伴可把分发扩展到直接席位销售之外
        - 要求按合作伙伴渠道提供 GMV 占比、续约和集中度
      - - 全渠道和电子邮件扩张
        - 渠道更多可提高钱包份额，但评论暗示部分场景直接响应适配较弱
        - 只要结果可衡量，跨渠道编排就能支撑更大预算
