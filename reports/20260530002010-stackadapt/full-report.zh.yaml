              在接入、培训、持续支持、定价灵活性和自助能力上给出的高分。同时，反复出现的投诉模式已经足够一致，值得重视：Gartner 的批评性评论提到报告定制和透明度限制；TrustRadius 评论者抱怨报告笨重、CPM
              高、超支风险和直接响应适配较弱；较老的目录评论提到编辑和创意工作流繁琐；AdTechRadar 的 Reddit 摘要集中在费用不透明。合在一起，公开记录显示，客户常常喜欢 StackAdapt
              的受众定向、品牌认知、CTV 和托管服务，但平台在报告体验、透明度和漏斗下层效率上仍制造摩擦。所审阅公开来源都没有披露 NRR、GRR、总流失率或续约率，因此留存只能从代理指标推断，不能直接承销。
