  - id: TP002
    title: 竞争对手概况表
    columns:
      - 平台
      - 类别
      - 规模 / 所有权信号
      - 最适合买方
      - 差异化
      - 相比 StackAdapt 或作为买方选择的局限
    rows:
      - - StackAdapt
        - 独立全渠道 DSP / 营销平台
        - 私有公司；声称 2024 年服务 40,000+ 品牌并启动 1.5M 个广告活动
        - 想要一个平台并可选支持的代理商、品牌和精简团队
        - UI 简单，自助 / 混合 / 托管模式灵活，原生-上下文根基强
        - 未披露专有数据护城河，也未公开盈利能力
      - - The Trade Desk
        - 独立企业级 DSP
        - 上市公司；2025 年收入 $2.896B；调整后 EBITDA 利润率 47%；2026 年 Q1 收入 $689M
        - 优先考虑客观开放互联网采购的大型代理商和品牌
        - 开放互联网身份、零售数据集成和全球 CTV 深度
        - 对更小、接触更轻的团队而言，优化程度不那么明显
      - - DV360
        - 套件型既有玩家 / 企业采购平台
        - Alphabet 支持、并与 Google 技术栈整合的企业平台
        - 已使用 Google 媒体和分析工作流的大型广告主
        - YouTube 访问、Analytics 360 集成、创意工作区、机器学习
        - 企业吸引力更强，但中端市场可及性不如 StackAdapt 明显
      - - Amazon DSP
        - 连接商业数据的 DSP
        - Amazon 支持的广告业务，叠加购物者数据和流媒体库存
        - 重视零售信号、Prime Video / Twitch 触达和可测量效果的品牌
        - 第一方商业数据、高端流媒体关系和激进商业条款
        - 买方可能更依赖 Amazon 经济模型和生态规则
      - - Criteo
        - 商业媒体 / 零售媒体平台
        - 上市公司，具备零售媒体规模，并主张开放网络激活能力
        - 向商业结果倾斜的品牌、零售商和代理商
        - 200+ 零售商、17,000 个品牌、60+ DSP 连接、闭环测量
        - 相比 StackAdapt，不那么围绕代理商友好的通用 DSP 工作流
      - - Microsoft Advertising
        - 搜索 + 程序化生态
        - Microsoft 支持的广告网络，覆盖搜索、零售、游戏、视频和开放网络供给
        - 想在一个生态中获得 Microsoft、Yahoo、搜索和零售版位的广告主
        - 大规模触达、AI 叙事、发布商合作关系，以及零售 / 游戏触点
        - 独立的 Microsoft Invest 正在收尾，削弱买方侧清晰度
      - - TripleLift
        - 精选、数据、创意和供给层
        - 私有公司；声称拥有 5,000+ 高端发布商关系
        - 想要精选供给和创意-效果协同的广告主
        - 能在既有 DSP 内改善效果，并延伸到自助服务
        - 更像叠加层和供给侧系统，而不是完整的 StackAdapt 替代品
      - - Viant
        - 独立的基于人的 DSP
        - 上市公司；2026 年 Q1 收入 $88.5M，调整后 EBITDA $9.8M；CTV 占支出 >50%
        - 聚焦 CTV 和可测量结果的开放网络广告主
        - 基于人的身份、注意力测量和强 CTV 定位
        - 规模小于 The Trade Desk，品牌认知窄于 Google 或 Amazon
      - - Basis
        - 全渠道工作流平台
        - 私有公司；围绕企业 AI 和托管专业能力定位
        - 关注跨渠道流程自动化的代理商和媒体团队
        - 一个系统打通搜索、社交、程序化、CTV 和计费工作流
        - 更靠运营竞争，而不是专有受众或库存优势
      - - MNTN
        - CTV 专家
        - 私有公司；面向各种规模品牌的自助式效果电视平台
        - 寻求快速激活电视广告、但不想承担完整全渠道复杂度的品牌
        - QuickFrame AI、150+ 高端网络、更低起投预算
        - 在电视和漏斗上层视频之外，比 StackAdapt 更窄
    notes: 规模单元混合了披露财务、所有权背景和公司声称的运营指标；私营公司经济数据往往没有公开统一口径。
