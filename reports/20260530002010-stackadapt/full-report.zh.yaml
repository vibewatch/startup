      - number: '2.4'
        title: 增长驱动、约束与周期性
        blocks:
          - type: paragraph
            body: >-
              为 StackAdapt 创造上行的力量，也会限制 TAM 在短期内转化为干净、耐久收入。增长驱动包括减少跨渠道浪费、AI 辅助优化、更多预算流向优质 CTV 和情境化格式，以及 PMP、供给策展
              和供应路径优化的重要性上升。但这个市场并非没有摩擦。Guideline 显示，增长已经明显慢于 2024 年的激增水平；广告主的大部分媒体交易仍发生在程序化之外。EMARKETER 和 AdExchanger
              都指出，碎片化、不透明供给路径、欺诈风险和身份不确定性是持续的运营问题；CMA 和 Google 证据也显示，即便 cookie 弃用被逆转，也没有恢复一个简单的追踪体系。结果是，StackAdapt
              可以靠简化工作流和服务赢得份额，但支出仍有周期性，衡量仍有争议，买家怀疑会拖慢预算迁移。这也意味着，估值应该奖励执行质量和客户组合，而不是抽象的 TAM
              话术。一个能帮助代理机构和较小品牌用更少摩擦购买优质库存的平台，在低增长环境里应该跑赢；但前提是它证明衡量可信度，并在市场重新定价时保持供给成本透明。
