              tone: positive
              detail: 通常更看重优质资源接入和工作流支持，而非原始规模
            - label: 低复杂度
              tone: positive
              detail: 平台易用性和支持是采用的核心
        - label: SMB / 直营品牌
          values:
            - label: 老板或通才
              tone: neutral
              detail: 预算负责人和操盘手往往是同一个人
            - label: 线索生成 / 销售
              tone: positive
              detail: 需要清晰报表和快速激活
            - label: 自助 + 指导
              tone: positive
              detail: 偏好更简单的界面和精选供应
            - label: 高度陪跑
              tone: neutral
              detail: 支持质量和入门引导很关键
        - label: 企业效果营销团队
          values:
            - label: 市场 VP
              tone: neutral
              detail: 预算权限常与投放交易员分离
            - label: ROI + 增量性
              tone: positive
              detail: 希望减少浪费、强化归因
            - label: 多 DSP / PMP 混合
              tone: neutral
              detail: 可能会拿 StackAdapt 与更大的既有 DSP 比较
            - label: 工作流集成
              tone: neutral
              detail: 需要报表和跨渠道重定向
        - label: CTV / 全渠道品牌团队
          values:
            - label: 品牌或媒体总监
              tone: positive
              detail: 掌管电视预算向数字预算迁移
            - label: 触达 + 频次 + 提升
              tone: positive
              detail: 衡量必须覆盖上漏斗和下漏斗结果
            - label: PMP / 偏保证交易
              tone: neutral
              detail: 优质库存和透明度比最低出价更重要
            - label: 跨渠道协同
              tone: positive
              detail: 需要跨 CTV、视频、展示和原生广告的一张视图
        - label: 控股集团 / 大型交易台
          values:
            - label: 中央交易负责人
              tone: neutral
              detail: 预算权限位于规模化买量组织内部
            - label: 规模 + 治理
              tone: neutral
              detail: 看重交易访问、控制和平台互操作性
            - label: 多平台组合
              tone: neutral
              detail: 通常把投放拆到多个 DSP 和 PMP
            - label: 服务差异化较低
              tone: neutral
              detail: StackAdapt 更难只靠易用性拿下该客群
        - label: 零售 / 全渠道营销方
          values:
            - label: 营销或商务负责人
              tone: positive
              detail: 掌管同时关联需求生成和转化的预算
            - label: 触达 + 销售提升
              tone: positive
              detail: 希望从认知到行动串起渠道顺序
            - label: 精选优质供应
              tone: positive
              detail: 需要横跨展示、视频、CTV 和 DOOH 的可靠库存
            - label: 统一报表
              tone: positive
              detail: 一个工作流覆盖规划、激活和归因时收益更大
