      - number: '8.2'
        title: 公开可比公司与倍数基准
        blocks:
          - type: paragraph
            body: >-
              关键估值测试在于，StackAdapt 传闻中的 5.0x 收入倍数是否真有公开证据支撑。按 2026 年 5 月市场数据，代表性广告科技 可比公司明显更便宜：The Trade Desk 约 3.08x
              EV/Sales，Magnite 约 3.25x，DoubleVerify 约 1.85x，PubMatic 约 1.58x，Criteo 约 0.37x，同业中位数约 1.85x。因此，StackAdapt
              的定价约为该中位数的 2.7x，且仍高于这组可比公司中规模化程度最强的公开基准 The Trade Desk。缓释因素是盈利能力和平台宽度。如果据报的 $125 million
              经营利润大体准确，StackAdapt 的利润率至少与最强公开同业处在相近区间。估值分化也有先例：Multiples.vc 显示 MNTN 的收入倍数为 7.7x，AppLovin 则高得多，达到
              29.1x。即便如此，举证责任仍在 StackAdapt 身上，因为公开可比公司说明，盈利的广告科技规模资产通常在低于其私募报价的位置成交。
