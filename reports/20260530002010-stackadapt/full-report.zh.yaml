  - id: TV004
    title: 可比估值表
    columns:
      - 可比项
      - 规模 / 盈利能力
      - 倍数 / 估值
      - 状态
      - 参考价值
      - 局限
    rows:
      - - StackAdapt（报道的 2025 年轮次）
        - $500M 收入；$125M 运营利润（约 25% 利润率）
        - $2.5B 估值（约 5.0x 收入；约 20x 运营利润）
        - 私募轮
        - 最接近的直接定价数据点
        - 收入质量和股权结构条款未公开
      - - The Trade Desk
        - $2.97B LTM 收入；23.9% EBITDA 利润率
        - 3.08x EV/Sales；约 3.5x P/S
        - 上市
        - 一流、已规模化的开放互联网广告技术基准
        - 比 StackAdapt 更大、流动性更强，也更成熟
      - - Magnite
        - $722.55M LTM 收入；20.15% EBITDA 利润率
        - 3.25x EV/Sales；约 2.93x P/S
        - 上市
        - 具备可观规模的 CTV / 程序化广告可比公司
        - 增长叙事弱于 AI 平台公司
      - - DoubleVerify
        - $764.06M LTM 收入；17.5% EBITDA 利润率
        - 估值倍数 1.85x EV/Sales
        - 上市
        - 高利润率的数字广告衡量可比公司
        - 产品组合不同于 DSP / 编排
      - - Criteo
        - $1.92B LTM 收入；15.29% EBITDA 利润率
        - 0.37x EV/Sales；约 0.48x P/S
        - 上市
        - 展示成熟广告技术估值的下行区间
        - 传统业务画像削弱其对溢价情景的参考价值
      - - PubMatic
        - $281.67M LTM 收入；-0.51% EBITDA 利润率
        - 1.58x EV/Sales；约 1.91x P/S
        - 上市
        - 开放互联网供应侧基准
        - 规模较小，利润率更弱
      - - MNTN
        - $315M LTM 收入（据 multiples.vc）
        - 7.7x EV / LTM 收入
        - 后期私募基准
        - 说明少数已成规模的广告技术公司仍能拿到溢价私募倍数
        - 单一第三方基准，并非已披露融资轮
    notes: 上市可比公司行使用 2026 年 5 月市场数据快照；StackAdapt 和 MNTN 行依赖据报道的私募估值标记和第三方基准数据。本表是代表性样本，不是完整行业普查。
    enumerationScope:
      coverage: sample
      basis: >-
        Representative May 2026 adtech and late-stage benchmark set anchored on scaled DSP, measurement, SSP, and
        private AI-adtech names.
