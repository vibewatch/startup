  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 不只是和其他独立 DSP 争夺同一笔预算。买家可以用开放互联网独立平台解决这项工作，比如 The Trade Desk 和 Viant；也可以用 DV360 和 Microsoft
              这样的套件既有厂商、Amazon DSP 和 Criteo 这样的商业关联平台、TripleLift 这样的创意策展层、Basis 这样的工作流中心系统，或 MNTN、Quantcast、Seedtag
              这样更窄的 CTV 和情境化专家。StackAdapt 的公开卖点仍然重要，因为它把原生广告、展示广告、视频广告、CTV、音频广告、DOOH 和电子邮件
              放在同一个界面里，并配有适合代理机构的支持选项。但公开记录也显示，采购时比较的替代方案远比经典“DSP
              同行名单”更宽。真正的竞争框架是：哪一个平台能给代理机构或品牌提供触达、工作流简单度、数据优势和可衡量结果的最佳组合，同时不把买家锁进超过营销活动所需的运营复杂度。
