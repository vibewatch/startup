evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial performance and scale metrics
    missingEvidence: >-
      Audited financial statements detailing GAAP revenue, license fee ARR, clinical development cash burn rate, and
      balance sheet cash runway.
    whyItMatters: >-
      Without audited financial disclosures, the company's operating efficiency, capital consumption rate, and runway to
      next value inflection point cannot be independently modeled.
    diligencePath: >-
      Request confidential audited financial statements, historical income statements, and management cash flow
      forecasts during formal investor data-room diligence.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: board composition and cap table governance
    missingEvidence: >-
      Complete enumeration of the Board of Directors, voting agreements, investor protective provisions, liquidation
      preference stack, and secondary transaction pricing.
    whyItMatters: >-
      Governance control, board composition, and preference rights dictate founder discretion, shareholder dilution, and
      downstream exit waterfall economics.
    diligencePath: >-
      Review the Series D Amended and Restated Certificate of Incorporation, Voting Agreement, and full capitalization
      table under non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: tam-segmentation
    missingEvidence: >-
      Audited industry segmentation isolating annual clinical trial software spend from total sponsor capital
      expenditures across global biopharma.
    whyItMatters: >-
      Prevents calculating a precise addressable software market size for Formation Bio distinct from total drug
      development spending.
    diligencePath: >-
      Acquire specialized life sciences benchmarking reports from clinical trial data providers (e.g. Gartner Life
      Sciences, IDC Health Insights, or IQVIA market analytics).
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited annual revenue, gross margin, net cash burn, and balance sheet cash reserves.
    whyItMatters: >-
      Essential to underwrite operating sustainability, unit economics, and capital efficiency independent of equity
      raises.
    diligencePath: >-
      Obtain audited financial statements, historical cash burn reports, and management capitalization models in private
      data room.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: licensing-deal-terms
    missingEvidence: >-
      Granular contract terms, upfront acquisition costs, milestone payment schedules, and royalty rates across
      partnered clinical assets.
    whyItMatters: Directly determines net cash return distribution between Formation Bio, equity holders, and licensing partners.
    diligencePath: Review master in-licensing agreements, asset NewCo operating agreements, and partner milestone matrices.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: Independent, task-matched evidence of platform speed, cost, prediction quality, or clinical-development outcomes.
    whyItMatters: >-
      Company-authored workflow metrics cannot establish that the broader platform creates durable technical or clinical
      advantage.
    diligencePath: >-
      Request blinded validation studies, completed-program baselines, and partner-authored outcome evidence with
      explicit denominators and comparison periods.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: reliability-security-roadmap
    missingEvidence: >-
      Committed roadmap milestones plus production uptime, recovery, incident, security-test, certification, and GxP
      validation records.
    whyItMatters: >-
      Recruiting requirements describe intended controls but do not prove that regulated production systems achieve
      them.
    diligencePath: >-
      Review the product roadmap, system inventory, validation packages, change-control logs, incident register,
      penetration tests, and disaster-recovery results.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer or counterparty roster, contract values, renewal and expansion history, concentration by revenue or asset
      value, and contract duration.
    whyItMatters: >-
      Without denominators and economics, Sanofi's strategic importance cannot be translated into durable revenue,
      repeat behavior, or concentration exposure.
    diligencePath: >-
      Request the counterparty register, executed collaboration and license agreements, renewal history, and revenue or
      asset-value concentration schedule.
    relatedQuestionRefs:
      - QU004
      - QU005
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      An exhaustive, current list of asset originators, active pharma collaborators, completed downstream licensees,
      trial deployments, and realized outcomes.
    whyItMatters: >-
      The public sample mixes historical TrialSpark partners, a current strategic collaborator, and a technology
      provider, so it cannot establish customer breadth.
    diligencePath: >-
      Obtain management's dated counterparty list and verify each relationship with contracts, invoices, trial records,
      and counterparty references.
    relatedQuestionRefs:
      - QU003
      - QU006
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: adoption-outcomes
    missingEvidence: >-
      Measured pre/post data for Muse deployment, including recruitment time, screening yield, patients enrolled per
      site per month, cost, and expansion scope.
    whyItMatters: >-
      An announced Phase 3 use case does not establish production adoption, clinical benefit, financial value, or
      repeatability.
    diligencePath: >-
      Request trial-level operating dashboards and obtain a direct Sanofi reference that confirms deployment status,
      baseline, result, and subsequent expansion.
    relatedQuestionRefs:
      - QU002
      - QU005
  - type: access-blocked
    severity: minor
    topic: customer-evidence
    missingEvidence: >-
      Usable article body for the allocated Contrary Research company profile; the prefetched file contained only a
      privacy-policy line.
    whyItMatters: >-
      The source was allocated as net-new evidence but could not support a customer claim or quotation from the
      retrieved text.
    diligencePath: Treat the source as non-supporting unless a future authorized run retrieves the article body successfully.
    relatedQuestionRefs:
      - QU009
