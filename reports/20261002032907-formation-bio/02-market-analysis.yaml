callouts:
  - calloutType: insight
    title: The Clinical Development Bottleneck Overrides Discovery Abundance
    body: |
      While generative AI has unlocked thousands of candidate molecules in early computational discovery, biopharmaceutical productivity remains governed by clinical development capacity. Annual FDA approvals have remained flat at approximately 50 drugs despite a doubling of early candidates, demonstrating that value creation is concentrated in clinical trial execution, patient matching, and Phase 2 proof-of-concept validation.
    claimRefs:
      - CM003
      - CM004
      - CM005
  - calloutType: risk
    title: High Clinical Attrition and High Cost Throttles Portfolio Economics
    body: |
      Because clinical development requires 10 to 15 years and up to $5.5 billion per successful drug—with 90% of candidates failing overall and Phase 2 success rates hovering near 30%—Formation Bio's model depends on sustaining a statistical win rate. Even with AI-driven acceleration, developing clinical-stage assets remains exposed to biological failure, regulatory scrutiny, and high capital intensity.
    claimRefs:
      - CM003
      - CM005
      - CM009
      - CM014
