      - number: '3.3'
        title: 转换成本、护城河与战略脆弱性
        blocks:
          - type: paragraph
            body: >
              Formation Bio 的竞争差异化聚焦在“在已知中找未知”（Known in
              New）的研发逻辑与闭环技术栈上。公司用新化学实体将经过验证的作用机制应用到尚未充分探索的疾病适应症上，力图绕开靶点验证风险，同时避开拥挤的过热赛道（如 GLP-1 或 PD-1/PD-L1
              扎堆）。其内部基础设施把适应症全景扫描、竞品对标和试验模拟自动化，帮助驻企企业家（EIR）支持下的交易团队找出定价偏差或被忽视的临床资产。


              虽然具备这些优势，Formation Bio 护城河的稳固程度仍面临关键的战略脆弱性。其一，核心 AI 软件栈属于自研体系，仅在内部完成验证；在缺乏独立第三方复现或公开发表的头对头临床对比基准的情况下，关于 AI
              能从根本上缩短试验周期或削减成本的断言尚未得到监管审批证实。其二，传统制药巨头掌握着巨大的分销和商业化主导权，因此 Formation Bio 在对外授权、联合融资以及后期商业分销上，依然在结构上受制于
              Sanofi 等大型药企合作伙伴。


              生成式 AI 与商业基础模型逐步普及到传统 CRO 和生物技术竞争对手手中，商品化风险进一步凸显。FDA、EMA 等底层监管门槛与药物临床试验质量管理规范（GCP）标准严密刻板，无论 AI
              自动化程度多高，都需要大量的人工复核、严格的质量保证和统计学把关。随着临床试验数据平台层出不穷，Formation Bio
              最终能否立足，不取决于算法是否新颖，而取决于其管线资产能否顺利达成临床主要终点并拿下监管批准。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP011
