              Capital、Thrive Capital、SV Angel Growth 和 FPV Ventures 联合投资。虽然第三方二级市场与追踪平台的估值一直在 $1.0B 至 $1.7B
              之间徘徊，但由于是非上市企业，关键投资评估数据均未披露。核心指标包括年经常性收入、实际现金毛利率、净现金消耗率以及资产负债表现有现金及现金等价物，均无法得到独立审计。生物医药资产推进自带天然的科学损耗风险，仅靠工作流自动化无法确保临床疗效。因此，机构若要进行实质投资评估，必须获取私密的资产级股权结构表、里程碑时间表以及
