      - number: '1.2'
        title: 管理团队、管线拓展与公司治理
        blocks:
          - type: paragraph
            body: >-
              Formation Bio 由首席执行官 Benjamine Liu 与首席技术官 Linhao Zhang 联合创立 [CO001, CO006]。业务高管团队兼具技术工程背景与传统制药研发资历，包括首席技术官
              Dan Neil、首席科学官兼研发负责人 Michael Ehlers、首席商务官 David Steinberg 以及首席财务官 James Leslie [CO006, CO007]。2025 年 6
              月，公司启动首期驻企企业家（EIR）计划，加速细分治疗领域的管线交易，任命了多位资深业务拓展主管：Kia Motesharei（NASH/MASH）、Minji Kim（韩国 / 亚太交易）、John
              Taylor（罕见病）以及 Anthony S. Walsh（免疫与炎症）[CO002, CO008]。为补强内部管理层，公司聘请了多位行业资深顾问，包括由 Pfizer 前首席科学官 Mikael
              Dolsten 担任选药委员会主席，以及 Frank D'Amelio（Pfizer 前 CFO）和 Jay Parikh（Microsoft CoreAI 执行副总裁）[CO005,
              CO006]。尽管技术管理阵容庞大，完整的董事会成员构成与正式委员会治理章程仍保持私密、未见公开披露 [CO013]。
