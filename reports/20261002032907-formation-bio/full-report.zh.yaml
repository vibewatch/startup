      - number: '6.3'
        title: 持续性、业务扩张与客户集中度
        blocks:
          - type: paragraph
            body: >-
              常规 SaaS 持续性指标不仅处于缺失状态，而且与该模式格格不入。Formation 的 CTO 曾表示，脱离产出的管线资产，该平台本身应被视为没有独立价值；他并谈到在与 Sanofi
              的合作中免费出让了部分技术，以规避销售、维护和客户功能定制需求。真正切题的持续性检验标准应是持续获取资产的能力、临床里程碑推进、后续追加合作以及成功实现对外授权。在指定的八份公开信源中，均未披露当前客户数、合同金额、续约率、NRR、GRR、流失率或头部客户收入占比。RFP.wiki
              亦指出公开买家评价稀缺，但其竞品对比内容未被采信为独立基准。在当前部署中仅具名 Sanofi 一家的情况下，客户集中度无法量化；这里留下的是实质性的尽调证据缺口，并不能据此判断集中度偏高或偏低。
            claimRefs:
              - CU011
              - CU012
              - CU015
              - CU016
      - number: '6.4'
        title: 图表附录
        blocks:
          - type: callout
            title: 无法根据合作推断客户指标
            body: 指定证据仅具名了一家当前落地的药企，但未提供任何有关合同金额、续约、集中度、留存率或实际成果的数据。Sanofi 的参与属于战略合作背书，不能作为衡量客户广度或持续性的基准分母。
            calloutType: risk
