      - number: '2.2'
        title: 基于多维度测算视角的 TAM、SAM 与 SOM 分析
        blocks:
          - type: paragraph
            body: >
              评估 Formation Bio 的市场空间，不能单看一个粗估的总额，而要结合多套受证据约束的测算视角 [CM005, CM007]。从最宏观的口径来看，全球生物制药年度研发支出超过
              $200B，其中临床开发大致占总支出的 60% 至 70% [CM005, CM007]。第三方分析机构 Markets and Markets 预计，到 2028 年 AI 药物发现细分市场规模将达
              $4.9B，反映的是软件与服务授权收入 [CM005]。但这个口径视角较窄，因为 Formation Bio 并非纯软件供应商，而是持有管线资产的开发商，靠资产股权增值、里程碑付款和对外授权分成赚取收益
              [CM001, CM003, CM008]。


              另一个更贴切的可触达视角集中在外包及技术赋能型临床试验运营上，涵盖方案设计、患者招募以及 Phase 2/3 试验执行，全球规模估计在 $40B 至 $55B 之间 [CM002,
              CM005]。Formation Bio 的可获取市场（SOM）进一步受限于自身的战略资产收购能力：公司计划组建并推进一个由约 10 款早期（Phase 1 之后及 Phase 2）临床候选药物构成的聚焦管线组合
              [CM003, CM009]。鉴于单款新药从发现到获批通常耗时 10 至 15 年、累计资金消耗最高可达 $5.5B，只要能在一到两款成功去风险的 Phase 2
              资产上兑现价值，就能创造数亿美元的交易价值，正如公司与 Sanofi 就慢性手部湿疹达成的 $630M 对外授权交易所示 [CM003, CM005, CM010]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
