      - number: '1.4'
        title: 图表附录
        blocks:
          - type: callout
            title: 临床开发损耗对比未经证实的 AI 加速效果
            body: >-
              Formation Bio 在一级市场拿到的 $1.7B 估值，建立在一项核心假设之上：自研软件工作流和 AI
              模型能够大幅压缩临床试验周期并降低研发成本。但公司尚未向监管部门提交任何用于上市审批的治疗分子，也未发表经过同行评审、独立审计的基准数据来证明其试验进度相对传统 CRO
              和生物医药基线具备统计学显著的加速优势。因此，公司仍完全承受整个生物制药行业普遍存在的临床淘汰风险，历史上 Phase 2 和 Phase 3 试验的失败率通常高达 85% 至 90%。
            calloutType: risk
            claimRefs:
              - CO004
              - CO005
              - CO010
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、业务范畴与现状替代品
        blocks:
          - type: paragraph
            body: >
              Formation Bio 专注于 AI 驱动的临床药物开发、试验运营和管线资产许可引进这一细分市场 [CM001, CM002]。界定该市场边界，需要将临床药物开发与参与者众多的广义计算药物发现区分开来
              [CM003]。计算生物学和 AI 药物发现平台聚焦上游的从头靶点发现、分子生成设计以及临床前早期苗头化合物到先导化合物验证，Formation Bio 则明确锁定药物发现之后的临床阶段 [CM001,
              CM003]。              首席执行官 Benjamine Liu 指出，药物发现并不是行业的瓶颈；真正的瓶颈在临床开发阶段——候选药物数量持续膨胀，而 FDA
              每年批准的新疗法数量相对稳定，大约维持在每年 50 款左右 [CM003, CM004]。


              Formation Bio 覆盖的可触达支出包括 Phase 1 至 Phase 3 的临床开发费用、试验启动、患者招募、方案设计、监管申报文件生成，以及资产引进的首付款与里程碑付款承诺 [CM001,
              CM002, CM005]。这道边界不包括早期发现生物学湿实验仪器、临床前靶点筛选软件，以及下游的商业化销售团队营销与零售分销 [CM001, CM003]。Formation Bio 模式的直接现状替代品包括
              IQVIA、Labcorp 等传统合同研究组织（CRO）、大型制药申办方的内部临床开发团队，以及 Roivant Sciences、BridgeBio、PureTech 等资产收购平台或平台型生物技术控股机构
              [CM003, CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
