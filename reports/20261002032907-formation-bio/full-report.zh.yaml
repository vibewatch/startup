      - number: '3.4'
        title: 图表附录
        blocks:
          - type: callout
            title: 许可引进模式的护城河与软件供应商模式对比
            body: >
              Formation Bio 最核心的战略护城河在于其运营模式：它不是一家向态度审慎的药企采购团队兜售工具的软件商，而是一家直接分享药物股权收益的 AI 原生生物技术公司。这一机制使其免受生命科学领域常见的
              SaaS 客户流失之苦，却也将其直接推向二元药物研发风险的枪口——历史上临床试验失败率高达 90% 以上。
            calloutType: insight
            claimRefs:
              - CP001
              - CP011
              - CP015
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、交易架构与商业化权益
        blocks:
          - type: paragraph
            body: >
              Formation Bio（2016 年作为 TrialSpark 成立）不按常规 SaaS 平台或按服务收费的合同研究组织（CRO）模式运作。公司以 AI
              原生药物研发企业的身份，从生物医药合作伙伴、科研机构及新兴生物技术公司手中收购或引进临床阶段的候选药物。其商业化权益与下游收益主要围绕 NewCo
              合资实体以及带有里程碑与特许权使用费的许可引进协议构建。在该框架下，Formation Bio
              承担出资并在跨越临床概念验证（PoC）后推进研发，借资产股权增值、对外授权提成、监管里程碑付款及商业销售沉淀企业价值。2024 年 11 月，Formation Bio 联合 Sanofi 与 OpenAI 推出
              Muse，拓展了合作模式，旨在为 Phase 3 多发性硬化症项目等大型临床试验加速候选药物筛选与方案设计。鉴于 Formation Bio
              仍处于后期非上市阶段，旗下管线资产的具体交易条款、里程碑时间表及收入分成比例均未公开披露。
