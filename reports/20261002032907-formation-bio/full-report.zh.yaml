  - id: FI001
    title: 资产引进与经济转化流程
    type: flow
    summary: 从临床资产引进、自动化试验执行到下游商业变现的连续转化模型。
    data:
      nodes:
        - id: pipeline-screening
          label: 管线筛查与资产遴选
          description: 识别并评估各大药企及生物科技公司中被降低优先级或停滞的临床期资产
        - id: in-license
          label: 引进停滞的临床资产
          description: 通过设立合资 NewCo 或股权共享架构，获取被降低优先级的候选药物
        - id: tech-trial
          label: AI 与技术加速试验
          description: 应用 AI 试验方案设计、不良事件自动报告及试验中心快速入组
        - id: proof-of-concept
          label: 临床概念验证（PoC）
          description: 达成临床里程碑与 Phase 2/3 试验数据拐点
        - id: commercial-agreement
          label: 伙伴商业协议
          description: 与生物医药伙伴达成对外授权、联合商业化或买断协议
        - id: monetization
          label: 下游商业化变现
          description: 通过对外授权特许权使用费、里程碑款项或被生物药企收购实现现金回报
      edges:
        - from: pipeline-screening
          to: in-license
        - from: in-license
          to: tech-trial
        - from: tech-trial
          to: proof-of-concept
        - from: proof-of-concept
          to: commercial-agreement
        - from: commercial-agreement
          to: monetization
    approximationNotes: 体现公司管理层所勾勒的标准化定性资产开发全生命周期。
