  - id: TV002
    title: 多空逻辑权衡
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 证伪触发条件
    rows:
      - - 看多逻辑
        - AI 加速的临床执行释放被低估管线资产的价值。
        - 由 a16z 与 Sanofi 领投 $372M D 轮融资；管理团队曾参与 45+ 款已获批疗法。
        - 核心资产 Phase 3 试验失利，或无法对外转让已完成研发的项目。
      - - 看空逻辑
        - 试验运营优化无法降低底层生物学失败率。
        - 缺少公开疗效基准；临床药理学本身存在高淘汰率。
        - 同行评审独立论文证实其具备更优的 Phase 2/3 试验成功率。
      - - 商业化风险
        - 重资产负债表模式需要持续注入具稀释性的资本。
        - 历经多轮融资累计筹集逾 $600M，但尚未展现经审计的自主经营造血能力。
        - 通过里程碑款项或特许权使用费变现，实现经证实的商业现金流打平。
    notes: 综合战略公告、融资申报文件以及可比生物科技投资组合的临床运营现实。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV012
  - id: TV003
    title: 情景分析：乐观、基准与悲观情景
    columns:
      - 情景
      - 发生概率
      - 核心假设
      - 隐含估值 / 回报
      - 下行触发因素
    rows:
      - - 乐观情景
        - 25%
        - Phase 3 湿疹管线资产获 FDA 批准；AI 工具加速与 Sanofi 合作的管线资产研发。
        - $3.5B - $5.0B IPO 或收购估值（2.0x - 3.0x 回报）。
        - 试验延期、试验方案修改或出现具竞争力的替代性标准疗法。
      - - 基准情景
        - 50%
        - 试验结果喜忧参半；对外管线转让抵消资金消耗，但业务增长仍需温和注资。
        - $1.5B - $2.0B 持平持有估值（1.0x - 1.2x 回报）。
        - 入组周期拉长且临床研发人员薪酬开支持续攀升。
      - - 悲观情景
        - 25%
        - Phase 3 临床失利；外部合作停滞且未达成商业化许可。
        - <$700M 贱卖处置或清算优先权穿透损失（<0.5x 回报）。
        - 主要临床适应症的主要终点未达标，伴随严重资金消耗。
    notes: 各情景基于据报 $1.48B–$1.8B 的投后估值水平及历史生物药企临床跃迁数据，构建 3–5 年持有期模型。
    claimRefs:
