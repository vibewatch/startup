      - 评定立场
      - 分析依据
      - 决策含义
    rows:
      - - 投资建议
        - 深入调研
        - 未公开运营状况阻碍对临床资产疗效与资金消耗率开展独立审计。
        - 在经审计管线数据或商业现金流出现前，暂不投入未对冲的一级市场资金。
      - - 估值立场
        - 偏高
        - D 轮后 $1.48B–$1.8B 的估值水平反映将科技股倍数套用于高风险生物科技研发。
        - 在参与老股转让前，必须坚持定价纪律或争取清算优先权保护。
      - - 风险评级
        - 高
        - 管线高度集中、缺乏商业化批准，且面临生物科技行业常规 90% 的试验淘汰率。
        - 审慎控制投资敞口，严格按明确里程碑分批注资。
      - - 置信度
        - 中
        - 豪华投资银团与管理层背书，被公开财务披露的彻底缺失所对冲。
        - 待 Phase 2/3 临床试验读数得到核实后再做进一步研判。
    notes: 各项评估基于已公布的 D 轮交易记录、PitchBook/Forge 基准数据以及截至 2026 年已披露的管线资产。
