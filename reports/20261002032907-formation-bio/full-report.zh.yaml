  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 交易对手方、用户与付款方
        blocks:
          - type: paragraph
            body: >-
              Formation Bio 的公开商业模式要求以超出传统软件公司的视角来定义“客户”。公司称其从制药企业、大学和生物科技公司收购处于临床阶段的药物；在这些交易中，Formation
              是买方，资产所有者是卖方或授权许可方，而非付费购买软件的客户。随后 Formation 由内部药物研发团队调用自身平台。CNBC 报道指出其 AI
              技术并不作为服务对外出售，而公司官方发布的内容则将其模式描述为推进至 Phase II 及以后阶段再行对外授权。因此，具备经济实质的外部群体是资产发起方、Sanofi
              等战略合作伙伴，以及最终的制药被授权方或收购方。患者、研究者和临床试验中心可能会使用或受益于由此产生的业务流，但手头的证据并未将其列为付款方。明确这种角色分工，有助于防止将合作公告或管线资产错误视作经常性客户。
