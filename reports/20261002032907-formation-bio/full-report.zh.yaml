      - number: '2.4'
        title: 宏观增长驱动因素与关键采纳约束
        blocks:
          - type: paragraph
            body: >
              AI 药物研发市场的采纳进度与估值受到宏观行业红利的推动，同时也受制于残酷的临床与生物学现实 [CM003,
              CM005]。在需求端，驱动因素来自大药企战略重点转移、重磅药物专利悬崖，以及中国等地区和学术机构涌现出大量缺乏临床推进资金的候选分子 [CM003, CM007,
              CM011]。基础模型、深度学习和预测性临床建模的出现，让研发人员得以自动化生成患者招募材料、撰写不良事件报告并模拟试验患者队列；管理层声称试验开展速度最高可提升 50% [CM002, CM003,
              CM012]。


              与此同时，多重关键约束压制着市场采纳速度 [CM003, CM005, CM014]。首当其冲的是难以逆转的临床失败率历史规律：进入临床试验的药物估计有 90% 无法拿到监管批准，其中 Phase 2
              构成最主要的损耗关卡，候选药物成功率仅约 30% [CM003, CM005]。FDA 和 EMA 的监管框架强制执行严苛的 GxP 和生物统计合规标准，严禁以黑箱式 AI 结论取代严格的终点指标验证
              [CM006, CM013, CM014]。多中心 Phase 2 和 Phase 3 试验具有极高的资金密集度，对资产负债表的流动性要求苛刻，即便是技术赋能型研发企业也必须直面剧烈的现金消耗与二元数据读出风险
              [CM003, CM009, CM014]。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 图表附录
        blocks:
          - type: callout
            title: 临床开发瓶颈压制发现端的候选分子红利
            body: >
              尽管生成式 AI 在早期计算发现阶段释放了数以千计的候选分子，生物医药行业的实际产出依旧被临床开发产能卡死。即便早期候选分子数量翻倍，FDA 每年批准的新药数量依然停留在约 50
              款左右，说明行业价值创造高度集中在临床试验执行、患者精准匹配以及 Phase 2 概念验证（PoC）之上。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: 高临床损耗与高昂成本压制管线投资回报
            body: >
              每款新药成功研发通常耗时 10 到 15 年，资金投入最高可达 $5.5B，且候选药物总体失败率达 90%、Phase 2 成功率徘徊在 30% 附近，因此 Formation Bio
              的模式本质上依赖维持统计学上的胜率。即便拥有 AI 带来的提速优势，开发临床阶段资产依然无法摆脱生物学失败、监管严审与高资金消耗的现实。
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场替代方案
        blocks:
          - type: paragraph
            body: >
              Formation Bio（前身为
              TrialSpark）在生物医药生态圈中占据了差异化生态位，主打临床试验优化与资产许可引进，而非从头药物发现。传统药企面临持续攀升的临床试验成本和不断拉长的周期，即常说的“埃鲁姆定律”（Eroom's
              Law）。这一瓶颈导致大量具有前景的治疗假说与候选药物因资金受限而搁浅。Formation Bio 切中该瓶颈，收购、引进或合作开发处于临床阶段的资产（通常为 Phase II
              及以后），并用自研工作流技术向前推进。


              竞争格局横跨多个不同的替代阵营。直接对标方包括 Recursion Pharmaceuticals、Insilico Medicine、Owkin 等 AI
              原生生物制药企业，这些公司同样利用计算方法与机器学习模型精简研发管线。但多数直接对标企业重心深扎在早期发现、靶点确认和分子设计上，而 Formation Bio 主要聚焦临床阶段的执行与转化效率。


              老牌竞争对手来自实力雄厚的跨国制药巨头，包括 Eli Lilly、Sanofi、Pfizer 和
              Novartis。这些传统大药企拥有庞大的内部临床运营基建、雄厚的资产负债表实力以及深厚的监管沟通渠道。多家大药企正在自建 AI 能力或与 AI 专精机构合作；例如 Sanofi 联合领投了 Formation
              Bio 金额达 $372M 的 Series D 轮融资，同时与 OpenAI 和 Formation Bio 建立软件合作，共同构建 Muse 等试验设计平台。


              现状替代方案则涵盖 IQVIA、ICON、Medidata 等传统合同研究组织（CRO），以及申办方内部的试验运营团队。CRO 作为按服务收费的外包供应商提供试验执行支持，Formation Bio
              则作为委托主体或联合开发伙伴入局，直接承担药物资产的商业风险。制药公司的内部研发团队通常会临时搭建数据科学流水线，但这种作坊式探索很难达到 Formation Bio
              宣称凭专用数据基础设施实现的系统化跨适应症规模效应。
