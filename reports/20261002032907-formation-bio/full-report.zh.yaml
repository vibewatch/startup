      - number: '1.3'
        title: 资本结构、投资方与估值基准
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Formation Bio 历经多轮机构融资，累计获得超过 $600M 股权投资 [CO001, CO009]。2024 年 6 月，公司完成 $372M 的 Series D 轮融资，由
              Andreessen Horowitz（a16z）领投，法国跨国药企 Sanofi 战略跟投，风投机构 Thrive Capital、Sequoia Capital、FPV Ventures 和 SV Angel
              参投 [CO009, CO010, CO011]。PitchBook 与二级市场追踪平台在该次融资后测算其企业估值约 $1.7B，较 2021 年 Series C 轮确立的 $1.0B 估值大幅扩张
              [CO001, CO010]。更早的融资阶段包括 2016 年 11 月的种子轮、2017 年 11 月的 Series A 轮，以及 2018 年 10 月的 Series B 轮，资方包括 Founder
              Collective、Maveron 和 Thrive Capital 等早期机构
              [CO011]。尽管有顶级财团背书，作为非上市企业，公司并未公开披露经审计的财务报表、收入运行率、毛利率、现金烧钱速度或二级市场股权交易价格 [CO012]。
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO009
