  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、审批与临床开发风险
        blocks:
          - type: paragraph
            body: >-
              Formation Bio 采取许可引进模式，收购具备 Phase II 阶段基础的候选药物并推进其完成临床里程碑。但公司尚未向 FDA
              等监管机构提交任何药物的上市审批申请，其监管审批记录完全未经证明。历史生物医药开发数据表明，进入临床试验的候选药物因疗效不佳、安全性隐患或药代动力学特征不良，淘汰率高达 90% 以上。尽管 Formation
              Bio 已将针对慢性手部湿疹的核心候选药物推入 Phase III 临床试验，但 Phase III
              项目本身蕴含巨大的临床失败风险与二元监管审批敞口。任何监管暂停临床试验、未达临床主要终点或突发毒性数据，都将立刻重挫管线资产价值，击穿其自研软件能够化解新药研发风险的核心逻辑。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营工作流、AI 可靠性与执行风险
        blocks:
          - type: paragraph
            body: >-
              Formation Bio 核心的运营假设在于借助自动化软件工作流与 Muse 等智能体 LLM
              系统，取代传统临床试验各环节之间的人工作业交接，从而达成次线性规模扩张。这种架构固然削减了行政人员编制并消除了传统试验角色之间的沟通摩擦，却也引入了算法系统特有的业务失效模式。深度研究工具与 LLM
              容易产生幻觉、混淆相近适应症的语义、抓取未经审查的二次分析，以及在提取临床结果时发生隐蔽性错误。为防止出现糟糕的资产收购或有缺陷的试验方案，人类专家必须留在关键决策关卡中把关，充当质量仲裁者。自动化系统若在适应症全景分析时未能识别出隐匿毒性，或误读试验注册数据，公司就面临将数百万美元临床试验资金砸入注定走不通的疗法项目的巨大风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
