            body: >
              公司的成本结构明显偏向临床试验运营执行以及自研 AI 技术平台的开发。传统生物医药临床试验需要向患者招募、中心管理、临床监查和法规文档编制投入巨额资金。Formation Bio
              将定制大语言模型和软件自动化嵌入临床项目管理、生物统计分析、不良事件报告与自动化患者初筛，以此追求运营效率。然而，推进药物临床仍离不开实体中心协调、研究者报酬，以及涵盖 GCP、GLP、GMP
              体系的临床级合规监查。在纽约和波士顿等高成本大都市招聘生物统计、临床运营、质量工程等高级主管核心岗位，带来了可观的固定人员开支，侵蚀了纯软件行业具备的高营业利润率，每年需要数百万美元的持续预算支持。
