chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与 AI 驱动的商业模式
        blocks:
          - type: paragraph
            body: >-
              Formation Bio 于 2016 年以 TrialSpark Inc. 名义注册成立，是一家总部位于纽约的人工智能驱动型药物研发企业 [CO001]。公司不走合同研究组织（CRO）或 SaaS
              软件供应商路线，而是直接从制药巨头、生物技术初创公司以及学术医疗中心收购或许可引进处于临床阶段的候选药物 [CO002, CO003]。Formation Bio 把自研技术平台与 AI
              工作流用于候选药物评估、临床试验方案设计、患者入组招募以及临床数据解读，推进管线分子达成概念验证（PoC）拐点 [CO002, CO004]。管线项目一旦达到 Phase 2 或 Phase 3
              临床里程碑，Formation Bio 计划将其对外授权或转给商业化生物制药申办方合作开发，在锁定研发上行收益的同时避免承担下游商业分销渠道的建设成本 [CO002,
              CO003]。但核心商业逻辑依然面临巨大的监管损耗风险，因为公司尚未向卫生监管机构提交任何临床候选药物的上市审批申请 [CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
