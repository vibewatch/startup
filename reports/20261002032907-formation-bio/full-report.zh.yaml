      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 企业里程碑时间线
    type: timeline
    summary: 梳理从 2016 年以 TrialSpark 之名创立，历经 D 轮扩张、平台搭建直至招揽核心交易高管的历史里程碑。
    data:
      items:
        - label: 2016 年创立
          date: '2016-11-01'
          detail: Formation Bio 最初由 Benjamine Liu 和 Linhao Zhang 在纽约市创立，原名为 TrialSpark Inc.，旨在精简临床试验流程。
          tone: neutral
        - label: A 轮融资
          date: '2017-11-16'
          detail: 完成 Maveron 与 Founder Collective 领投的早期风险投资，用于扩大受试者招募软件规模。
          tone: positive
        - label: B 轮扩张
          date: '2018-10-31'
          detail: 获得 Thrive Capital 参投的 B 轮融资，用于建设一体化临床试验中心网络与技术基础设施。
          tone: positive
        - label: C 轮独角兽里程碑
          date: '2021-09-30'
          detail: 以 $1.0B 投后估值完成 $156M C 轮融资，业务模式转向全流程管线药物研发。
          tone: positive
        - label: 企业品牌更名
          date: '2024-05-01'
          detail: 正式由 TrialSpark 更名为 Formation Bio，体现收购与引进临床药物资产的战略转型。
          tone: neutral
        - label: D 轮融资与 Sanofi 合作
          date: '2024-06-26'
          detail: 获得由 a16z 领投、Sanofi 跟投的 $372M D 轮融资，估值攀升至 $1.7B，用于扩充内部药物管线。
          tone: positive
        - label: Muse AI 平台发布
          date: '2024-11-01'
          detail: 宣布与 OpenAI 及 Sanofi 联合推出 AI 药物研发平台 Muse，旨在加速 Phase 3 临床试验。
          tone: positive
        - label: 推出入驻企业家 (EIR) 计划
          date: '2025-06-09'
          detail: 在 MASH、亚太、罕见病与免疫治疗领域聘请首期入驻企业家 (EIR)，以推动管线引进交易。
          tone: positive
    approximationNotes: 时间线日期依据融资公告、新闻报道及企业公开声明整理；实际业务转型确切时间点属近似估算。
