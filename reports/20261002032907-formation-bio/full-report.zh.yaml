      - number: '3.2'
        title: 竞品画像与核心能力对比
        blocks:
          - type: paragraph
            body: >
              把 Formation Bio 与行业替代方案对比，需要考察规模、资本实力、产品范畴及运营模式。Formation Bio 累计融资 $615M，核心支撑是 2024 年 6 月按 $1.7B 至 $1.8B
              估值完成的 $372M Series D 轮融资。其管线覆盖免疫学、皮肤病学和神经病学领域的临床阶段资产，包括从 Lynk Pharmaceuticals 引进的中枢神经系统渗透型 TYK2 抑制剂
              BLKR201，以及针对慢性手部湿疹与骨关节炎的研发项目。


              直接竞品 Recursion Pharmaceuticals 运营着工业化自动化湿实验室与计算平台，大规模绘制生物学相互作用图谱以发现新靶点和化学实体。Insilico Medicine 同样将生成式 AI
              与强化学习贯穿生物学、化学和早期临床候选药物生成流程。相比之下，Formation Bio 部署了 Apollo、Muse、Forge 和 Delphi 等软件系统，整合了涵盖超过 720,000
              项试验的历史试验数据库以及来自 1.5 亿份患者档案的真实世界数据，用于适应症全景对标、试验方案设计并模拟技术成功率。


              采购对标分析显示，Formation Bio 的自研技术并未作为独立 SaaS 或可部署软件向第三方客户销售。公司仅在内部研发项目和合作开发中使用该平台。这与临床试验软件供应商以及 CRO
              平台方形成鲜明对比，后者通常提供多租户软件许可、按坐席收费的订阅或按次收费的数据分析服务。尽管 Formation Bio
              实现了管线运营的高度整合，但潜在商业伙伴也不得不在数据透明度、模型可复现性以及对单一供应商的深度依赖之间做出权衡。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
