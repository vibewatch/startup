      - number: '6.2'
        title: 具名合作佐证与采纳里程碑
        blocks:
          - type: paragraph
            body: >-
              Sanofi 是目前最强有力的具名交易对手方佐证，但现有证据仅能证实双方公布了合作，尚无法证明形成了可衡量的客户成果。Reuters 曾于 2024 年 5 月报道了 Sanofi、OpenAI 与
              Formation Bio 的合作，CNBC 随后报道 Sanofi 将在 Phase 3 多发性硬化症试验中率先采用 Muse 并计划拓展使用。各信源均未披露合同金额、Muse
              是否在这些试验中真正投入生产运行，也未公布招募速度、成本、入组人数或最终审批结果。某第三方访谈曾点名 Novartis、Pfizer 和 Sanofi 使用过 TrialSpark
              早期的招募与中心管理工具，但并不能证明在商业模式转型后 Novartis 或 Pfizer 仍是 Formation Bio
              当前的交易对手方。管线推进与商务拓展团队招募虽反映出业务活跃度，但两者皆非客户收入，亦非复购佐证。
            claimRefs:
