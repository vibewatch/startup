      - number: '2.3'
        title: 利益相关方分层、预算归属与采纳经济学
        blocks:
          - type: paragraph
            body: >
              Formation Bio 的混合商业模式涉及生物医药价值链上的多类不同机构主体 [CM001, CM008, CM011]。公司采用引进外部药物资产而非销售独立 SaaS
              订阅的模式，因此其“买方”和交易对手方主要分为三类：跨国药企授权方及合作伙伴、面临经营困难或现金吃紧的新兴生物科技公司，以及学术机构的技术转让办公室 [CM001, CM003, CM011]。以 Sanofi
              为代表的跨国药企既是战略投资方，也是商业化合作伙伴，在试验结束后引进 Phase 2/3 资产，或共同开发 Muse 等 AI 工具 [CM003, CM008, CM010, CM012]。


              跨国药企合作伙伴的预算主要掌握在首席商务官、外部创新负责人以及各治疗领域业务线负责人手中，资金来自业务拓展并购储备金和外部研发资本预算 [CM003, CM010,
              CM011]。现金承压的生物技术公司和高校衍生企业则是资产卖方；促使其达成交易的诱因在于风投资金收紧、专利到期倒计时，以及在不承担试验失败损失的前提下将边缘化管线资产变现的需求 [CM003, CM007,
              CM011]。采纳路径涉及高门槛的生物医药尽职调查：交易各方严格评估科学数据完整性、临床试验模拟准确度、法规合规情况以及交易结构条款 [CM006, CM011, CM013]。
            claimRefs:
