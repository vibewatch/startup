      - number: '2.3'
        title: Stakeholder Segmentation, Budget Ownership, and Adoption Economics
        blocks:
          - type: paragraph
            body: >
              Formation Bio's hybrid business model involves multiple distinct institutional stakeholders across the
              biopharmaceutical value chain [CM001, CM008, CM011]. Because the company in-licenses external drug assets
              rather than selling standalone SaaS subscriptions, its "buyers" and transaction counterparts fall into
              three primary categories: global pharmaceutical licensors/partners, distressed or cash-constrained
              emerging biotechs, and academic technology transfer offices [CM001, CM003, CM011]. Global pharma sponsors,
              such as Sanofi, act both as strategic investors and commercialization partners who in-license Phase 2/3
              assets post-trial or co-develop AI tooling like Muse [CM003, CM008, CM010, CM012].


              Budget ownership within global pharmaceutical partners resides with Chief Business Officers, heads of
              external innovation, and therapeutic area franchise heads, funded through business development M&A
              reserves and external R&D capital budgets [CM003, CM010, CM011]. Conversely, cash-constrained biotechs and
              university spinouts act as asset sellers; their adoption trigger is driven by tightening venture capital
              availability, patent expiration timelines, and the need to monetize deprioritized pipeline assets without
              absorbing trial failure costs [CM003, CM007, CM011]. The adoption pathway requires high-stakes biopharma
              due diligence: counterparties evaluate scientific data integrity, clinical trial simulation accuracy,
              regulatory compliance, and transaction structure terms [CM006, CM011, CM013].
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
              - CM013
