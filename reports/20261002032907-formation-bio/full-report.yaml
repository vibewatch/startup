      - number: '1.2'
        title: Executive Leadership, Dealmaking Expansion, and Governance
        blocks:
          - type: paragraph
            body: >-
              Formation Bio was co-founded by Chief Executive Officer Benjamine Liu and Chief Technology Officer Linhao
              Zhang [CO001, CO006]. The operational leadership team blends technology engineering experience with legacy
              pharmaceutical drug development credentials, featuring Dan Neil as Chief Technology Officer, Michael
              Ehlers as Chief Scientific Officer and Head of R&D, David Steinberg as Chief Business Officer, and James
              Leslie as Chief Financial Officer [CO006, CO007]. In June 2025, the company launched its inaugural
              Entrepreneurs in Residence (EIR) initiative to accelerate pipeline dealmaking across specialized
              therapeutic sectors, appointing seasoned business development executives Kia Motesharei (NASH/MASH), Minji
              Kim (Korea/APAC transactions), John Taylor (Rare Diseases), and Anthony S. Walsh (Immunology and
              Inflammation) [CO002, CO008]. To complement internal leadership, the company engages senior industry
              advisors including former Pfizer Chief Scientific Officer Mikael Dolsten to chair its drug selection
              committee, Frank D'Amelio (former Pfizer CFO), and Jay Parikh (EVP of CoreAI at Microsoft) [CO005, CO006].
              Despite this extensive technical leadership roster, full board of directors composition and formal
              committee governance charters remain private and undisclosed [CO013].
