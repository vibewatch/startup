      - number: '4.3'
        title: Capital Adequacy, Balance Sheet Runway, and Underwriting Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Formation Bio has raised over $608M in aggregate equity financing since inception, culminated by a $372M
              Series D financing round announced in June 2024 led by a16z with significant strategic participation from
              Sanofi, alongside Sequoia Capital, Thrive Capital, SV Angel Growth, and FPV Ventures. While third-party
              secondary and tracker valuations have hovered between $1.0B and $1.7B, the company's private standing
              leaves critical underwriting data undisclosed. Crucial metrics including annual recurring revenue,
              realized cash gross margins, net cash burn rate, and current balance sheet cash equivalents cannot be
              independently audited. Moreover, biopharma asset acceleration carries inherent scientific attrition risks
              where clinical efficacy cannot be guaranteed by workflow automation alone. Consequently, institutional
              underwriting requires access to private asset-level cap tables, milestone schedules, and Phase 2/3 trial
              performance readouts.
            claimRefs:
