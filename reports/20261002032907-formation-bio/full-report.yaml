      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Sanofi
        - Strategic Investor & Co-Development Partner
        - High
        - Sanofi discontinues Muse pilot or redirects AI investments internally
        - Critical
        - Expansion of dealmaking roster via EIRs to diversify pharma relationships
        - 'High: Key validation and co-development partner for Phase III trials'
      - - External In-Licensing Counterparties
        - Asset Sourcing Pipeline (Pharma / Biotech)
        - High
        - Biopharma peers refuse to license clinical assets or demand unfavorable economic terms
        - High
        - Hiring specialized EIR dealmakers across NASH, APAC, Rare Diseases, and Immunology
        - 'Medium: Dependent on favorable macro funding environment and distressed asset availability'
      - - OpenAI & Foundation Model Providers
        - Underlying LLM Infrastructure Provider
        - Medium
        - API downtime, model policy changes, or intellectual property disputes regarding training data
        - Medium
        - Platform-agnostic durable execution architecture and proprietary internal workflows
        - 'Low: Capability to swap underlying foundational model endpoints'
      - - Clinical Trial Sites and PIs
        - Trial Execution and Patient Enrollment
        - Medium
        - Investigator non-compliance, protocol deviations, or slow local ethics board signoffs
        - High
        - Direct site engagement tools and centralized patient recruitment via Muse platform
        - 'Medium: Clinical trial operational speed remains bounded by physical clinical infrastructure'
    notes: >-
      Ordered by severity. Assesses counterparty exposure across capital partners, licensing sources, foundational
      technology vendors, and clinical sites.
