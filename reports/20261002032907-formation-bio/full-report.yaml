      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
  - id: TV001
    title: Recommendation Summary
    columns:
      - Metric / Dimension
      - Assigned Stance
      - Analytical Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Private operational profile prevents independent audit of clinical asset efficacy and financial burn.
        - Withhold unhedged primary capital until audited pipeline data or commercial cash flows emerge.
      - - Valuation Stance
        - stretched
        - Post-Series D valuation marks of $1.48B-$1.8B reflect tech multiples applied to high-risk biotech development.
        - Require price discipline or liquidation preference protections before entering secondary transactions.
      - - Risk Rating
        - high
        - Pipeline concentration, absence of commercial approvals, and standard 90% biotech trial attrition.
        - Size exposure conservatively and mandate clear milestone-based capital deployment.
      - - Confidence Level
        - medium
        - Strong syndicate and leadership credentialing offset by complete lack of public financial disclosure.
        - Condition further conviction on verified Phase 2/3 clinical trial readouts.
    notes: >-
      Evaluations reflect published Series D transaction records, PitchBook/Forge benchmarks, and disclosed pipeline
      assets as of 2026.
    claimRefs:
      - CV007
      - CV008
      - CV010
      - CV015
  - id: TV002
    title: Thesis and Anti-Thesis Balance
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - Disconfirming Trigger
    rows:
      - - Bull Thesis
        - AI-accelerated clinical execution unlocks undervalued pipeline assets.
        - $372M Series D led by a16z and Sanofi; leadership team associated with 45+ approved therapeutics.
        - Lead asset failure in Phase 3 trials or inability to out-license completed programs.
      - - Anti-Thesis
        - Trial operations optimization cannot mitigate underlying biological failure rates.
        - Lack of public efficacy benchmarks; high attrition inherent to clinical pharmacology.
        - Independent peer-reviewed publication proving superior Phase 2/3 trial success rates.
      - - Commercial Risk
        - Asset-heavy balance sheet model requires continuous dilutive capital.
        - Over $600M raised across multiple rounds without audited operating self-sufficiency.
        - Demonstrated commercial cash flow break-even via milestone or royalty monetization.
    notes: >-
      Synthesizes strategic announcements, financing filings, and clinical operating realities across comparable biotech
      portfolios.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV012
  - id: TV003
    title: 'Scenario Analysis: Bull, Base, and Bear Cases'
    columns:
      - Scenario
      - Probability
      - Core Assumptions
      - Implied Valuation / Return
      - Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - Phase 3 eczema asset gains FDA approval; AI tools accelerate Sanofi partnered assets.
        - $3.5B - $5.0B IPO or acquisition valuation (2.0x - 3.0x return).
        - Trial delays, protocol amendments, or competitive standard-of-care displacement.
      - - Base Case
        - 50%
        - Mixed trial results; asset out-licensing offsets burn but growth requires moderate funding.
        - $1.5B - $2.0B flat holding valuation (1.0x - 1.2x return).
        - Lengthened enrollment timelines and escalating clinical developer payroll.
      - - Bear Case
        - 25%
        - Phase 3 clinical failure; partner collaborations stall without commercial licensing.
        - <$700M distressed sale or liquidation preference wipeout (<0.5x return).
        - Primary endpoint failure across lead clinical indications and severe cash burn.
    notes: >-
      Scenarios model three-to-five year holding horizon based on reported $1.48B-$1.8B post-money valuation marks and
      historical biopharma clinical transitions.
    claimRefs:
      - CV007
      - CV008
      - CV013
      - CV014
      - CV015
