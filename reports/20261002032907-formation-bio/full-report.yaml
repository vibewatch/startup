      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical Development Attrition vs. Unverified AI Acceleration
            body: >-
              Formation Bio's $1.7B private market valuation is predicated on the hypothesis that its proprietary
              software workflows and AI models can radically compress clinical trial cycle times and reduce development
              costs. However, the enterprise has yet to submit a single therapeutic molecule for regulatory approval or
              publish peer-reviewed, independently audited benchmarks demonstrating statistically significant trial
              acceleration over traditional CRO and biopharma baselines. Consequently, the company remains fully exposed
              to industry-wide biopharma clinical attrition risks, where historical Phase 2 and Phase 3 trial failure
              rates routinely exceed 85% to 90%.
            calloutType: risk
            claimRefs:
              - CO004
              - CO005
              - CO010
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Formation Bio operates in the specialized market for AI-driven clinical drug development, trial
              operations, and asset in-licensing [CM001, CM002]. Defining the boundary of this market requires
              separating clinical drug development from the broader, heavily populated field of computational drug
              discovery [CM003]. While computational biology and AI drug discovery platforms focus upstream on de novo
              target identification, molecular generative design, and early preclinical hit-to-lead validation,
              Formation Bio explicitly targets the post-discovery clinical phase [CM001, CM003]. Chief Executive
              Benjamine Liu articulates that drug discovery is not the industry's bottleneck; rather, the bottleneck
              lies in clinical development, where candidate volume has expanded while FDA annual approvals remain
              relatively stable at approximately 50 novel therapies per year [CM003, CM004].


              The addressable spend within Formation Bio's boundary encompasses Phase 1 through Phase 3 clinical
              development expenditures, trial startup, patient recruitment, protocol design, regulatory document
              generation, and asset in-licensing upfronts and milestone commitments [CM001, CM002, CM005]. Excluded from
              this boundary are early discovery biology wet-lab instrumentation, preclinical target screening software,
              and downstream commercial sales-force marketing and retail distribution [CM001, CM003]. The direct
              status-quo substitutes for Formation Bio's model include traditional contract research organizations
              (CROs) like IQVIA and Labcorp, internal clinical development teams within large pharmaceutical sponsors,
              and asset acquisition vehicles or programmatic biotech holding structures such as Roivant Sciences,
              BridgeBio, and PureTech [CM003, CM006].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM008
              - CM010
      - number: '2.2'
        title: TAM, SAM, and SOM Analysis Across Structural Sizing Lenses
        blocks:
          - type: paragraph
            body: >
              Evaluating Formation Bio's market opportunity requires applying multiple evidence-constrained sizing
              lenses rather than relying on a single top-line estimate [CM005, CM007]. At the broadest level, global
              biopharmaceutical research and development expenditure exceeds $200 billion annually, with clinical
              development representing roughly 60% to 70% of total spend [CM005, CM007]. External analyst estimates from
              Markets and Markets anticipate that the specific market for artificial intelligence in drug discovery will
              reach $4.9 billion by 2028, reflecting software and service licensing [CM005]. However, this figure is a
              narrow lens because Formation Bio operates not as a pure software vendor, but as an asset-holding
              developer that captures economic value through asset equity, milestone payments, and out-licensing
              royalties [CM001, CM003, CM008].


              A more relevant addressable lens focuses on outsourced and tech-enabled clinical trial operations,
              estimated in the $40 billion to $55 billion range globally across protocol design, recruitment, and Phase
              2/3 trial execution [CM002, CM005]. Formation Bio's serviceable obtainable market (SOM) is further
              constrained by its strategic asset acquisition capacity: the company aims to assemble and advance a
              focused portfolio of approximately 10 early-stage (post-Phase 1 and Phase 2) clinical drug candidates
              [CM003, CM009]. Given that developing a single novel therapeutic from discovery through approval requires
              10 to 15 years and up to $5.5 billion in total capital, capturing value on even one or two successful
              de-risked Phase 2 assets can generate hundreds of millions of dollars in transaction value, as
              demonstrated by the $630 million out-licensing deal with Sanofi for chronic hand eczema [CM003, CM005,
              CM010].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
