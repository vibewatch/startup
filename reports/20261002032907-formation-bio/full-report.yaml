          detail: A scientist validates the extraction before downstream analysis.
        - label: Biobank analysis
          detail: The pipeline queries three named biobanks and filters phenotype associations.
        - label: Narrative synthesis
          detail: An LLM organizes efficacy, opportunity, and safety findings.
        - label: Scientist checkpoint 2
          detail: A scientist verifies groupings and grounds claims in filtered data.
        - label: Delivery and reuse
          detail: HTML and Excel outputs plus Snowflake storage make reviewed results available through ARK.
