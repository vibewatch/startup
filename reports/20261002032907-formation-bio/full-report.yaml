      - number: '1.3'
        title: Capitalization Structure, Investors, and Valuation Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Formation Bio has secured over $600M in cumulative equity financing across multiple institutional funding
              rounds since its founding [CO001, CO009]. In June 2024, the company closed a $372M Series D financing
              round led by Andreessen Horowitz (a16z), featuring strategic pharmaceutical co-investment from French
              multinational drugmaker Sanofi alongside venture backers Thrive Capital, Sequoia Capital, FPV Ventures,
              and SV Angel [CO009, CO010, CO011]. PitchBook and secondary tracking platforms benchmarked the enterprise
              valuation at approximately $1.7B following this capitalization event, representing a marked valuation
              expansion from its previous $1.0B valuation established during its Series C round in 2021 [CO001, CO010].
              Earlier capitalization phases included a Seed round in November 2016, Series A in November 2017, and
              Series B financings in October 2018 backed by early-stage institutional investors including Founder
              Collective, Maveron, and Thrive Capital [CO011]. Despite blue-chip syndicate backing, the private
              enterprise does not publicly report audited financial statements, revenue run-rate, gross margins, cash
              burn rate, or secondary market cap-table transaction pricing [CO012].
