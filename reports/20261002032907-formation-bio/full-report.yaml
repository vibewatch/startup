chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and AI-Enabled Business Model
        blocks:
          - type: paragraph
            body: >-
              Formation Bio, originally incorporated in 2016 as TrialSpark Inc., operates as an artificial
              intelligence-driven pharmaceutical development company headquartered in New York City [CO001]. Rather than
              functioning as a contract research organization (CRO) or software-as-a-service vendor, the enterprise
              acquires or in-licenses clinical-stage therapeutic candidates from pharmaceutical corporations,
              biotechnology startups, and academic medical centers [CO002, CO003]. Formation Bio applies its proprietary
              technology platform and AI workflows across candidate evaluation, clinical trial protocol design, patient
              enrollment, and clinical data interpretation to progress molecules toward proof-of-concept inflection
              points [CO002, CO004]. Once programs reach Phase 2 or Phase 3 clinical milestones, Formation Bio aims to
              out-license or partner them back to commercial biopharmaceutical sponsors, capturing development upside
              while containing downstream commercial distribution infrastructure costs [CO002, CO003]. However, the core
              economic thesis remains exposed to substantial regulatory attrition risk, as the company has not yet
              submitted any clinical drug candidate to health authorities for regulatory approval [CO005].
            claimRefs:
