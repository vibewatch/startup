    body: "Formation Bio reported that only 43% of mechanism-of-action extractions were fully correct in internal testing. The disclosed pipeline therefore depends on expert review to prevent an early parsing error from contaminating downstream asset decisions."
    claimRefs:
      - "CE004"
      - "CE005"
  - calloutType: "recommendation"
    title: "Validate outcomes, not architecture labels"
    body: "Diligence should request blinded decision-quality studies, platform reliability records, security assessments, and GxP validation packages before assigning value to claimed speed or technical defensibility."
    claimRefs:
