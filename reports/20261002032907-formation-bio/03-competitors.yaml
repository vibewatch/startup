callouts:
  - calloutType: "insight"
    title: "The In-Licensing Moat vs. Software Vendor Dynamics"
    body: |
      Formation Bio's defining strategic moat lies in its operating model: it is not a software vendor selling to skeptical pharma procurement teams, but an AI-native biotech that captures direct drug equity. This protects it from standard life sciences SaaS churn, yet exposes it directly to binary drug development risks where clinical trial failure rates historically exceed 90%.
    claimRefs:
      - "CP001"
      - "CP011"
      - "CP015"

