callouts:
  - calloutType: "recommendation"
    title: "Capital Allocation Discipline"
    body: "Institutional investors should resist treating Formation Bio as a high-margin software business. Despite sophisticated trial management software, the enterprise economics are inextricably bound to drug development asset risk and clinical binary outcomes. Unhedged secondary purchases at headline valuations should be deferred until audited pipeline data or milestone royalty payments are disclosed."
    claimRefs:
      - "CV003"
      - "CV008"
      - "CV015"
  - calloutType: "risk"
    title: "Valuation Overhang and Liquidity Constraints"
    body: "Formation Bio's reported $1.48B to $1.8B valuation creates high hurdle rates for secondary liquidity or public exit. With secondary market volume categorized as limited and no registered S-1 filings, investors face extended lock-up durations and potential preference overhang in adverse market environments."
    claimRefs:
      - "CV007"
      - "CV009"
      - "CV010"
