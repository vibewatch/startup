callouts:
  - calloutType: risk
    title: Clinical Development Attrition vs. Unverified AI Acceleration
    body: Formation Bio's $1.7B private market valuation is predicated on the hypothesis that its proprietary software workflows and AI models can radically compress clinical trial cycle times and reduce development costs. However, the enterprise has yet to submit a single therapeutic molecule for regulatory approval or publish peer-reviewed, independently audited benchmarks demonstrating statistically significant trial acceleration over traditional CRO and biopharma baselines. Consequently, the company remains fully exposed to industry-wide biopharma clinical attrition risks, where historical Phase 2 and Phase 3 trial failure rates routinely exceed 85% to 90%.
    claimRefs:
      - CO004
      - CO005
      - CO010
      - CO014
