company:
  name: Formation Bio
chapter:
  number: 1
  title: Company Overview
  summary: Formation Bio (formerly TrialSpark) is a New York-headquartered clinical-stage biotechnology company that in-licenses drug assets and utilizes an AI-enabled development platform to accelerate clinical trials toward key inflection points. Supported by over $600M in total equity financing—including a $372M Series D co-led by a16z and Sanofi—the company advances pipeline assets while facing substantial clinical attrition risks and unverified proprietary efficiency metrics.
sections:
  - id: corporate-identity-and-operating-model
    title: Corporate Identity and AI-Enabled Business Model
    body: Formation Bio, originally incorporated in 2016 as TrialSpark Inc., operates as an artificial intelligence-driven pharmaceutical development company headquartered in New York City [CO001]. Rather than functioning as a contract research organization (CRO) or software-as-a-service vendor, the enterprise acquires or in-licenses clinical-stage therapeutic candidates from pharmaceutical corporations, biotechnology startups, and academic medical centers [CO002, CO003]. Formation Bio applies its proprietary technology platform and AI workflows across candidate evaluation, clinical trial protocol design, patient enrollment, and clinical data interpretation to progress molecules toward proof-of-concept inflection points [CO002, CO004]. Once programs reach Phase 2 or Phase 3 clinical milestones, Formation Bio aims to out-license or partner them back to commercial biopharmaceutical sponsors, capturing development upside while containing downstream commercial distribution infrastructure costs [CO002, CO003]. However, the core economic thesis remains exposed to substantial regulatory attrition risk, as the company has not yet submitted any clinical drug candidate to health authorities for regulatory approval [CO005].
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: executive-leadership-and-governance
    title: Executive Leadership, Dealmaking Expansion, and Governance
    body: Formation Bio was co-founded by Chief Executive Officer Benjamine Liu and Chief Technology Officer Linhao Zhang [CO001, CO006]. The operational leadership team blends technology engineering experience with legacy pharmaceutical drug development credentials, featuring Dan Neil as Chief Technology Officer, Michael Ehlers as Chief Scientific Officer and Head of R&D, David Steinberg as Chief Business Officer, and James Leslie as Chief Financial Officer [CO006, CO007]. In June 2025, the company launched its inaugural Entrepreneurs in Residence (EIR) initiative to accelerate pipeline dealmaking across specialized therapeutic sectors, appointing seasoned business development executives Kia Motesharei (NASH/MASH), Minji Kim (Korea/APAC transactions), John Taylor (Rare Diseases), and Anthony S. Walsh (Immunology and Inflammation) [CO002, CO008]. To complement internal leadership, the company engages senior industry advisors including former Pfizer Chief Scientific Officer Mikael Dolsten to chair its drug selection committee, Frank D'Amelio (former Pfizer CFO), and Jay Parikh (EVP of CoreAI at Microsoft) [CO005, CO006]. Despite this extensive technical leadership roster, full board of directors composition and formal committee governance charters remain private and undisclosed [CO013].
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO006
      - CO007
      - CO008
      - CO013
    tableRefs:
      - TO002
  - id: capitalization-investors-and-valuation-benchmarks
    title: Capitalization Structure, Investors, and Valuation Benchmarks
    body: Formation Bio has secured over $600M in cumulative equity financing across multiple institutional funding rounds since its founding [CO001, CO009]. In June 2024, the company closed a $372M Series D financing round led by Andreessen Horowitz (a16z), featuring strategic pharmaceutical co-investment from French multinational drugmaker Sanofi alongside venture backers Thrive Capital, Sequoia Capital, FPV Ventures, and SV Angel [CO009, CO010, CO011]. PitchBook and secondary tracking platforms benchmarked the enterprise valuation at approximately $1.7B following this capitalization event, representing a marked valuation expansion from its previous $1.0B valuation established during its Series C round in 2021 [CO001, CO010]. Earlier capitalization phases included a Seed round in November 2016, Series A in November 2017, and Series B financings in October 2018 backed by early-stage institutional investors including Founder Collective, Maveron, and Thrive Capital [CO011]. Despite blue-chip syndicate backing, the private enterprise does not publicly report audited financial statements, revenue run-rate, gross margins, cash burn rate, or secondary market cap-table transaction pricing [CO012].
    claimRefs:
      - CO001
      - CO009
      - CO010
      - CO011
      - CO012
