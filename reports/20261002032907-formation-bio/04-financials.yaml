callouts:
  - calloutType: insight
    title: Asset Co-Ownership Shifts Economics from Service Margins to Pipeline Equity
    body: >
      Unlike traditional Contract Research Organizations that bill time-and-materials fee-for-service margins,
      Formation Bio acts as an asset owner. By utilizing NewCo corporate vehicles, the company trades immediate services revenue
      for substantial long-term equity upside and licensing royalties, creating an asymmetric return profile heavily levered to clinical trial success.
    claimRefs:
      - CI001
      - CI002
      - CI004
  - calloutType: risk
    title: Scientific Attrition and High Clinical Trial Burn Preclude Pure Software Valuations
    body: >
      While software-driven trial startup and automated medical writing reduce trial duration and administrative overhead,
      they cannot eliminate inherent biological failure rates in clinical trials. With Phase 2/3 trial execution consuming millions
      in clinical vendor and patient costs, Formation Bio faces ongoing capital dependency unless commercial exits deliver liquidity.
    claimRefs:
      - CI006
      - CI007
      - CI012
      - CI014
