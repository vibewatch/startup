company:
  name: "Formation Bio"
chapter:
  number: 6
  title: "Customers"
  summary: "Formation Bio is not publicly positioned as a software vendor with a conventional customer base: it acquires or licenses drug assets, uses its technology internally, collaborates with pharma partners, and expects value to emerge through asset milestones and out-licensing. Sanofi is the only current named pharma deployment in the assigned evidence, while contract economics, repeat business, retention, customer concentration, and realized outcomes remain undisclosed."
sections:
  - id: "counterparties-not-saas-customers"
    title: "Counterparties, Users, and Payers"
    body: >-
      Formation Bio's public model requires a broader definition of "customer" than a
      software-company lens. The company says it acquires clinical-stage drugs from
      pharma companies, universities, and biotechs; in those transactions Formation is
      the buyer and the asset owner is the seller or licensor, not a customer paying for
      software. Formation then applies its platform through internal drug-development
      teams. CNBC reports that the AI methods are not sold as a service, while a company
      release describes advancement through Phase II and beyond followed by
      out-licensing. The economically relevant external groups are therefore asset
      originators, strategic collaborators such as Sanofi, and eventual pharmaceutical
      licensees or acquirers. Patients, investigators, and trial sites may use or benefit
      from the resulting workflows, but the assigned evidence does not identify them as
      payers. This role separation prevents partnership announcements or pipeline assets
      from being misreported as recurring customers.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "named-proof-and-adoption"
    title: "Named Proof and Adoption Milestones"
    body: >-
      Sanofi is the strongest current named counterparty proof, but the evidence supports
      an announced collaboration rather than a measured customer outcome. Reuters
      reported the Sanofi, OpenAI, and Formation Bio collaboration in May 2024, and CNBC
      later reported that Sanofi would first use Muse in Phase 3 multiple-sclerosis
      trials with plans to expand use. The sources do not state the contract value,
      whether Muse reached production across those trials, or the resulting recruitment
      speed, cost, enrollment, or approval outcome. A third-party interview names
      Novartis, Pfizer, and Sanofi as users of TrialSpark's earlier recruitment and site
      tools, but it does not establish that Novartis or Pfizer remain current Formation
      Bio counterparties after the business-model transition. Pipeline progress and
      business-development hiring show operating activity, yet neither is customer
      revenue or proof of repeat purchase.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-concentration"
    title: "Durability, Expansion, and Concentration"
    body: >-
      Conventional SaaS durability metrics are not merely absent; they are a poor fit for
      the disclosed model. Formation's CTO said the platform should be assumed to have no
      independent value outside the assets it produces and described giving some
      technology away in the Sanofi relationship to avoid sales, maintenance, and
      customer feature requests. The more relevant durability tests are repeat asset
      sourcing, progression through clinical milestones, follow-on collaboration, and
      successful out-licensing. None of the eight assigned public sources discloses a
      current customer count, contract value, renewal rate, NRR, GRR, churn rate, or
      top-counterparty revenue share. RFP.wiki also notes sparse public buyer reviews,
      but its competitor-comparison content is not treated as an independent benchmark.
      With only Sanofi named in a current deployment, concentration cannot be quantified;
      it remains a material diligence gap rather than evidence that concentration is
      either high or low.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU015"
      - "CU016"
