companyProfile:
  summary: >-
    Formation Bio is a New York-headquartered AI-enabled pharmaceutical development company formerly known as
    TrialSpark. It acquires or in-licenses clinical-stage assets, applies proprietary workflows to accelerate trial
    execution and asset selection, and aims to create value through clinical milestones, out-licensing, and strategic
    pharma collaborations.
