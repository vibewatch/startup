  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Hippocratic AI remains a compelling but expensive private healthcare AI story. The right call is still to track rather than upgrade: the product and traction are real, but the valuation remains ahead of the public proof on revenue, retention, and margin."
  },
  "sections": [
    {
      "id": "SV-1",
      "title": "Investment thesis and recommendation",
      "body": "The recommendation stays at track. That is not a shrug; it is a deliberate balance between strong product proof, real customer momentum, and unresolved financial opacity. The company is good enough to deserve attention, but the current evidence still does not let an investor treat the $3.5 billion valuation as obviously cheap. In other words, the asset is interesting, but the price assumes more certainty than the public data can currently deliver.",
      "claimRefs": [
        "CV001",
        "CV002",
        "CV006",
        "CV012"
      ],
      "tableRefs": [
        "TV001"
      ]
    },
    {
      "id": "SV-2",
      "title": "Bull, base, and bear cases",
      "body": "The bull case is that the company becomes the default patient-facing agent layer in healthcare and turns usage into a large, durable revenue base. The base case is more measured: adoption continues, but the valuation settles into a “prove it” phase because public revenue and retention evidence stay incomplete. The bear case is straightforward too: if regulation tightens, competitors bundle similar features, or usage proves volatile, the current multiple could become hard to defend. Those are all normal venture risks, but they matter more at this price.",
      "claimRefs": [
        "CV003",
        "CV004",
        "CV005",
        "CV010",
        "CV011"
      ],
      "tableRefs": [
        "TV002"
      ],
      "figureRefs": [
        "FV001"
      ]
    },
    {
      "id": "SV-3",
      "title": "Comparable context and exit discipline",
      "body": "The relevant comparison set is less about one perfect peer and more about the broader workflow-AI universe. The public evidence says the company has traction and category potential; it does not yet say the company has proven earnings power. That means the exit discipline today should be evidence-led: watch for audited revenue, retention durability, and whether the company can keep expanding without losing safety or trust. Until then, the smartest posture is to stay interested but not overconfident. This chapter intentionally favors a sampled, evidence-constrained view of the topic rather than an exhaustive market map, because public data is enough to show the direction of travel but not enough to settle every edge case. The practical diligence question is whether the company can keep proving value as it broadens from the first use cases into the broader workflow surface. That is the right amount of caution.",
      "claimRefs": [
        "CV007",
        "CV008",
        "CV009"
      ],
      "tableRefs": [
        "TV003"
      ]
    }
  ],
