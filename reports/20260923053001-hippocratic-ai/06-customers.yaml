  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "The customer story is commercially real: there are named deployments, public outcomes, and enough scale to show the product is in production. The remaining diligence gap is durability. There is still no public NRR, GRR, or churn disclosure, so the next refresh needs to focus on retention quality rather than just logo count."
  },
  "sections": [
    {
      "id": "SU-1",
      "title": "Customer base and deployment breadth",
      "body": "The customer story is broad enough to matter: health systems, payers, and pharma all appear in the current partner set, and the company has public references across the United States and beyond. That breadth matters because it suggests the platform can fit multiple budget owners and multiple workflow types. But breadth is only the first step. For diligence, the more important question is whether those accounts are truly in production and whether the product solves a recurring problem instead of simply producing a nice demo.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003"
      ],
      "tableRefs": [
        "TU001"
      ]
    },
    {
      "id": "SU-2",
      "title": "Outcomes and adoption signals",
      "body": "The public outcomes are encouraging. Customer quotes repeatedly point to capacity expansion, stronger outreach, and better patient engagement, and the company has cited milestones such as 23 contracts in 23 weeks and 10 million patient calls. That is enough to conclude the product is no longer a laboratory project. It is being used operationally. The next diligence step is to understand which of those deployments are durable, which are still sponsored by innovation teams, and which will survive budget tightening.",
      "claimRefs": [
        "CU004",
        "CU005",
        "CU009",
        "CU011"
      ],
      "tableRefs": [
        "TU002"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "SU-3",
      "title": "Retention, concentration, and proof gaps",
      "body": "The weakness in the customer story is not the number of logos; it is the lack of retention data. There is no public NRR, GRR, or churn disclosure, so the durability of the account base remains unproven. The other issue is concentration: some customers are also investors, which is helpful for distribution but makes arm’s-length commercial proof harder to assess. So the customer thesis is positive but incomplete. It proves demand exists, but not yet that demand is durable under normal purchasing conditions. This chapter intentionally favors a sampled, evidence-constrained view of the topic rather than an exhaustive market map, because public data is enough to show the direction of travel but not enough to settle every edge case. The practical diligence question is whether the company can keep proving value as it broadens from the first use cases into the broader workflow surface.",
      "claimRefs": [
        "CU006",
        "CU007",
        "CU008",
        "CU010",
        "CU012"
      ],
      "tableRefs": [
        "TU003"
      ]
    }
  ],
