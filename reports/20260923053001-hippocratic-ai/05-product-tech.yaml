  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "The product is a patient-facing voice-agent platform backed by a rapidly evolving Polaris architecture. The current story is strong on safety, compliance, and use-case breadth, but the diligence focus should remain on independent validation, scalability of the safety stack, and whether the roadmap expands faster than governance can comfortably support."
  },
  "sections": [
    {
      "id": "SE-1",
      "title": "Product scope and workflow fit",
      "body": "The company sells a patient-facing voice agent platform, not a clinician note tool. That means the workflows are things like post-discharge follow-up, chronic-care management, scheduling, intake, benefits support, and other structured conversations that can be done safely without diagnosis or prescribing. This matters because the company’s product-market fit depends on owning recurring patient communication tasks rather than just reducing documentation burden. It also means the product has to be good at conversational context, escalation, and compliance rather than only note generation.",
      "claimRefs": [
        "CE001",
        "CE005",
        "CE010"
      ],
      "tableRefs": [
        "TE001"
      ]
    },
    {
      "id": "SE-2",
      "title": "Architecture, benchmarks, and safety",
      "body": "Polaris 5.0 is the important technical milestone. The company describes it as a 5-trillion-parameter constellation with a 700-billion-parameter core model, and the benchmark story now spans latency, drug safety, escalation safety, multilingual switching, empathy, and compliance workflows. The right diligence question is not whether the system sounds impressive on slides; it is whether the architecture remains robust as the company adds more skills and more interaction surfaces. Voice AI for healthcare is hard because the system has to be fast, clinically accurate, and safe at the same time.",
      "claimRefs": [
        "CE002",
        "CE003",
        "CE008",
        "CE009"
      ],
      "tableRefs": [
        "TE002"
      ],
      "figureRefs": [
        "FE001"
      ]
    },
    {
      "id": "SE-3",
      "title": "Roadmap, competition, and product risk",
      "body": "The 2026 climate-agent launch shows that the roadmap is widening into resilience and event-driven outreach. That is strategically smart because it gives the company more live use cases, but it also increases the burden on testing, monitoring, and governance. The adjacent stack still includes Abridge, Suki, and Microsoft DAX Copilot, all of which own pieces of the clinical workflow and can extend into adjacent use cases over time. So the product conclusion is positive, but not complacent: the platform looks strong, yet independent validation and scope discipline still matter. This chapter intentionally favors a sampled, evidence-constrained view of the topic rather than an exhaustive market map, because public data is enough to show the direction of travel but not enough to settle every edge case. The practical diligence question is whether the company can keep proving value as it broadens from the first use cases into the broader workflow surface.",
      "claimRefs": [
        "CE004",
        "CE006",
        "CE007",
        "CE010",
        "CE011",
        "CE012"
      ],
      "tableRefs": [
        "TE003"
      ]
    }
  ],
