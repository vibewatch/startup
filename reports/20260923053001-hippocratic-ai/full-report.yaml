  - id: FP001
    title: Competitive positioning map
    type: quadrant
    notes: >-
      Quadrant positions reflect diligence-based ordinal scoring on two axes. X-axis: current enterprise health system
      deployment scale (number of confirmed enterprise clients and patient interactions). Y-axis: depth of clinical
      safety validation infrastructure (clinician validators, test call volume, safety architecture investment). Scores
      are -1 to 1 ordinal; not linear ratios. Hippocratic AI leads both axes among pure patient-facing AI peers.
    data:
      xAxis: Enterprise Scale (confirmed client deployments)
      yAxis: Clinical Safety Validation Depth
      points:
        - label: Hippocratic AI
          x: 0.75
          'y': 0.9
          detail: >-
            50+ enterprise partners, 180M+ patient interactions, 7,500+ clinician validators; highest combined scale and
            safety validation depth in patient-facing AI peer set
        - label: Hyro AI
          x: 0.3
          'y': 0.1
          detail: >-
            45+ health system clients, 30M+ patients served; deep Epic integration but no disclosed clinician safety
            validation infrastructure at comparable scale
        - label: Notable Health
          x: 0.1
          'y': 0.05
          detail: >-
            Fewer known client deployments; RCM and admin focus; no disclosed clinical safety validation; different
            workflow profile from patient-engagement AI
        - label: Nuance/Microsoft DAX
          x: 0.95
          'y': 0.4
          detail: >-
            550+ health system deployments (highest scale on chart); physician-facing only; physician-validated
            documentation but not patient safety framework
        - label: Abridge
          x: 0.35
          'y': 0.25
          detail: >-
