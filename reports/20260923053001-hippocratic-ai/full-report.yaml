  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workflow fit
        blocks:
          - type: paragraph
            body: >-
              The company sells a patient-facing voice agent platform, not a clinician note tool. That means the
              workflows are things like post-discharge follow-up, chronic-care management, scheduling, intake, benefits
              support, and other structured conversations that can be done safely without diagnosis or prescribing. This
              matters because the company’s product-market fit depends on owning recurring patient communication tasks
              rather than just reducing documentation burden. It also means the product has to be good at conversational
              context, escalation, and compliance rather than only note generation.
            claimRefs:
              - CE001
              - CE005
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE011
      - number: '5.2'
        title: Architecture, benchmarks, and safety
        blocks:
          - type: paragraph
            body: >-
              Polaris 5.0 is the important technical milestone. The company describes it as a 5-trillion-parameter
              constellation with a 700-billion-parameter core model, and the benchmark story now spans latency, drug
              safety, escalation safety, multilingual switching, empathy, and compliance workflows. The right diligence
              question is not whether the system sounds impressive on slides; it is whether the architecture remains
              robust as the company adds more skills and more interaction surfaces. Voice AI for healthcare is hard
              because the system has to be fast, clinically accurate, and safe at the same time.
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: Roadmap, competition, and product risk
        blocks:
          - type: paragraph
            body: >-
              The 2026 climate-agent launch shows that the roadmap is widening into resilience and event-driven
              outreach. That is strategically smart because it gives the company more live use cases, but it also
              increases the burden on testing, monitoring, and governance. The adjacent stack still includes Abridge,
              Suki, and Microsoft DAX Copilot, all of which own pieces of the clinical workflow and can extend into
              adjacent use cases over time. So the product conclusion is positive, but not complacent: the platform
              looks strong, yet independent validation and scope discipline still matter. This chapter intentionally
              favors a sampled, evidence-constrained view of the topic rather than an exhaustive market map, because
              public data is enough to show the direction of travel but not enough to settle every edge case. The
              practical diligence question is whether the company can keep proving value as it broadens from the first
              use cases into the broader workflow surface.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and deployment breadth
        blocks:
          - type: paragraph
            body: >-
              The customer story is broad enough to matter: health systems, payers, and pharma all appear in the current
              partner set, and the company has public references across the United States and beyond. That breadth
              matters because it suggests the platform can fit multiple budget owners and multiple workflow types. But
              breadth is only the first step. For diligence, the more important question is whether those accounts are
              truly in production and whether the product solves a recurring problem instead of simply producing a nice
              demo.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU007
      - number: '6.2'
        title: Outcomes and adoption signals
        blocks:
          - type: paragraph
            body: >-
              The public outcomes are encouraging. Customer quotes repeatedly point to capacity expansion, stronger
              outreach, and better patient engagement, and the company has cited milestones such as 23 contracts in 23
              weeks and 10 million patient calls. That is enough to conclude the product is no longer a laboratory
              project. It is being used operationally. The next diligence step is to understand which of those
              deployments are durable, which are still sponsored by innovation teams, and which will survive budget
              tightening.
            claimRefs:
              - CU004
              - CU005
              - CU009
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Retention, concentration, and proof gaps
        blocks:
          - type: paragraph
            body: >-
              The weakness in the customer story is not the number of logos; it is the lack of retention data. There is
              no public NRR, GRR, or churn disclosure, so the durability of the account base remains unproven. The other
              issue is concentration: some customers are also investors, which is helpful for distribution but makes
              arm’s-length commercial proof harder to assess. So the customer thesis is positive but incomplete. It
              proves demand exists, but not yet that demand is durable under normal purchasing conditions. This chapter
              intentionally favors a sampled, evidence-constrained view of the topic rather than an exhaustive market
              map, because public data is enough to show the direction of travel but not enough to settle every edge
              case. The practical diligence question is whether the company can keep proving value as it broadens from
              the first use cases into the broader workflow surface.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
