  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The company’s current regulatory posture is helped by its non-diagnostic positioning, but that is still a
              moving target. The longer the platform gets more capable and more clinically adjacent, the more likely it
              is that regulators, customers, or both will want stronger evidence and tighter controls. That does not
              mean the business is broken; it means the regulatory envelope is a real diligence item and not just a
              background note. Health-system buyers are sensitive to this because they are accountable for the patient
              relationship even when the software vendor is doing the heavy lifting.
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR013
      - number: '7.2'
        title: Operational, quality, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the company is exposed to the classic failure modes of patient-facing AI: misrecognition,
              bad escalation, quality drift, and overconfident output. The company’s own safety framing is reassuring,
              but it is still company-controlled evidence. Competitively, the biggest danger is not a startup copycat;
              it is a platform vendor or ambient AI incumbent that already owns the clinician workflow and compliance
              relationship. That is why Microsoft, Abridge, and Suki matter so much in the risk analysis.
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: Financial, people, and thesis-break risk
        blocks:
          - type: paragraph
            body: >-
              The financial model is exposed because usage-based pricing makes revenue sensitive to customer behavior.
              If outreach volume falls, revenue falls. The people risk is also real because founder-led companies can
              become person-dependent in ways that do not show up in product demos. The thesis-break conditions are
              therefore easy to state even if they are not easy to monitor: a regulatory reclassification, a real
              patient harm event, a major renewal miss, or a major incumbent bundling patient-facing workflows into a
              broader suite. This chapter intentionally favors a sampled, evidence-constrained view of the topic rather
              than an exhaustive market map, because public data is enough to show the direction of travel but not
              enough to settle every edge case. The practical diligence question is whether the company can keep proving
              value as it broadens from the first use cases into the broader workflow surface.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and recommendation
        blocks:
          - type: paragraph
            body: >-
              The recommendation stays at track. That is not a shrug; it is a deliberate balance between strong product
              proof, real customer momentum, and unresolved financial opacity. The company is good enough to deserve
              attention, but the current evidence still does not let an investor treat the $3.5 billion valuation as
              obviously cheap. In other words, the asset is interesting, but the price assumes more certainty than the
              public data can currently deliver.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
      - number: '8.2'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              The bull case is that the company becomes the default patient-facing agent layer in healthcare and turns
              usage into a large, durable revenue base. The base case is more measured: adoption continues, but the
              valuation settles into a “prove it” phase because public revenue and retention evidence stay incomplete.
              The bear case is straightforward too: if regulation tightens, competitors bundle similar features, or
              usage proves volatile, the current multiple could become hard to defend. Those are all normal venture
              risks, but they matter more at this price.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: Comparable context and exit discipline
        blocks:
          - type: paragraph
            body: >-
              The relevant comparison set is less about one perfect peer and more about the broader workflow-AI
              universe. The public evidence says the company has traction and category potential; it does not yet say
              the company has proven earnings power. That means the exit discipline today should be evidence-led: watch
              for audited revenue, retention durability, and whether the company can keep expanding without losing
              safety or trust. Until then, the smartest posture is to stay interested but not overconfident. This
              chapter intentionally favors a sampled, evidence-constrained view of the topic rather than an exhaustive
              market map, because public data is enough to show the direction of travel but not enough to settle every
              edge case. The practical diligence question is whether the company can keep proving value as it broadens
              from the first use cases into the broader workflow surface. That is the right amount of caution.
            claimRefs:
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
