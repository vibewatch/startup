  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "The risk profile is serious but legible: regulatory drift, safety and quality issues, dependency risk, and competition from larger workflow vendors are all real. The company’s current narrative is credible, but the public evidence is still not strong enough to call the safety and durability questions fully resolved."
  },
  "sections": [
    {
      "id": "SR-1",
      "title": "Regulatory and legal risk",
      "body": "The company’s current regulatory posture is helped by its non-diagnostic positioning, but that is still a moving target. The longer the platform gets more capable and more clinically adjacent, the more likely it is that regulators, customers, or both will want stronger evidence and tighter controls. That does not mean the business is broken; it means the regulatory envelope is a real diligence item and not just a background note. Health-system buyers are sensitive to this because they are accountable for the patient relationship even when the software vendor is doing the heavy lifting.",
      "claimRefs": [
        "CR001",
        "CR002"
      ],
      "tableRefs": [
        "TR001"
      ]
    },
    {
      "id": "SR-2",
      "title": "Operational, quality, and competitive risk",
      "body": "Operationally, the company is exposed to the classic failure modes of patient-facing AI: misrecognition, bad escalation, quality drift, and overconfident output. The company’s own safety framing is reassuring, but it is still company-controlled evidence. Competitively, the biggest danger is not a startup copycat; it is a platform vendor or ambient AI incumbent that already owns the clinician workflow and compliance relationship. That is why Microsoft, Abridge, and Suki matter so much in the risk analysis.",
      "claimRefs": [
        "CR003",
        "CR004",
        "CR009",
        "CR011"
      ],
      "tableRefs": [
        "TR002"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "SR-3",
      "title": "Financial, people, and thesis-break risk",
      "body": "The financial model is exposed because usage-based pricing makes revenue sensitive to customer behavior. If outreach volume falls, revenue falls. The people risk is also real because founder-led companies can become person-dependent in ways that do not show up in product demos. The thesis-break conditions are therefore easy to state even if they are not easy to monitor: a regulatory reclassification, a real patient harm event, a major renewal miss, or a major incumbent bundling patient-facing workflows into a broader suite. This chapter intentionally favors a sampled, evidence-constrained view of the topic rather than an exhaustive market map, because public data is enough to show the direction of travel but not enough to settle every edge case. The practical diligence question is whether the company can keep proving value as it broadens from the first use cases into the broader workflow surface.",
      "claimRefs": [
        "CR005",
        "CR006",
        "CR007",
        "CR008",
        "CR010",
        "CR012"
      ],
      "tableRefs": [
        "TR003"
      ]
    }
  ],
