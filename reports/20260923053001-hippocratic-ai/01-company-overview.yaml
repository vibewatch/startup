  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Hippocratic AI is a founder-led, safety-first healthcare AI company with a $3.5B valuation, $404M of disclosed funding, and more than 50 enterprise healthcare partners. The main diligence gap remains the absence of audited revenue disclosure; however, current product cadence, customer momentum, and strategic capital all remain strong."
  },
  "sections": [
    {
      "id": "SO-1",
      "title": "Identity, product, and business model",
      "body": "Hippocratic AI is a Palo Alto-based company founded in 2023 around a narrow but important wedge: non-diagnostic patient-facing clinical agents. The current product story is not a generic chatbot story. It is a voice-first workflow story in which the platform can handle follow-up calls, chronic-care check-ins, medication adherence, scheduling, benefits questions, and other structured interactions that would otherwise consume nurse or call-center time. The company still frames the product as a safety-first system, emphasizing that the agents do not diagnose or prescribe. That positioning matters because it shapes customer trust, regulatory posture, and the range of workflows the company can safely address.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO011"
      ],
      "tableRefs": [
        "TO001"
      ]
    },
    {
      "id": "SO-2",
      "title": "Founders, leadership, and governance",
      "body": "The business remains founder-led. Munjal Shah is the public face of the company and the CEO, while the team page still highlights Vishal Parikh as chief product officer and Subho Mukherjee as chief science officer. That combination gives the company a blend of consumer-scale product execution and AI research depth. The upside is clear: product, model, and go-to-market can stay tightly coordinated. The downside is also clear: this is still a company whose credibility is strongly tied to a small set of named leaders, so key-person risk remains meaningful even as the headcount grows and the customer list broadens.",
      "claimRefs": [
        "CO003",
        "CO004",
        "CO009"
      ],
      "tableRefs": [
        "TO002"
      ]
    },
    {
      "id": "SO-3",
      "title": "Funding, investors, and scale milestones",
      "body": "Hippocratic AI’s funding trajectory is unusually fast for a private healthcare company. The public record now shows a $50 million seed, a $53 million Series A at a $500 million valuation, a $141 million Series B at a $1.64 billion valuation, and a $126 million Series C at a $3.5 billion valuation. The company says total disclosed funding is $404 million. More importantly, the newest capital came with continued backing from major healthcare and tech investors and strategic health-system partners. That combination signals both balance-sheet strength and commercial validation, but it also raises the standard for proving durable revenue quality rather than just headline traction.",
      "claimRefs": [
        "CO005",
        "CO006",
        "CO007",
        "CO010",
        "CO012",
        "CO008"
      ],
      "tableRefs": [
        "TO003"
      ],
      "figureRefs": [
        "FO001"
      ]
    }
  ],
