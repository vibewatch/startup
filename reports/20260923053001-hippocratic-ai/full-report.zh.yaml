  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方图谱
        blocks:
          - type: paragraph
            body: >-
              这里讨论的不是泛泛的医疗
              AI，而是面向患者的临床沟通与护理自动化软件，以及相邻的临床辅助工具。买方通常是医疗系统、支付方和生命科学企业；使用者包括护士、护理管理人员、医生和运营团队。划清边界很重要：Hippocratic AI
              不只与其他“医疗 AI”公司竞争，也要和环境式病历工具、EHR 原生助手、人工呼叫中心争夺医疗机构有限的工作流时间。
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: 市场规模测算视角与采纳驱动力
        blocks:
          - type: paragraph
            body: >-
              单一 TAM
              数字不足以支撑投资判断，更稳妥的做法是按工作流测算：文书负担、外联量、护理管理频次和语种覆盖。公开资料指向相同的需求来源：医护人手短缺、临床时间紧张，以及在院外联系患者的需求。由此看，慢病随访、出院后沟通、接诊、福利咨询和多语种外联最值得关注，人工替代和患者参与度的改善也更容易衡量。
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM007
              - CM009
      - number: '2.3'
        title: 制约瓶颈、替代品与市场质疑
        blocks:
          - type: paragraph
            body: >-
              真正的难点不是生成流畅文本，而是让软件在真实工作流中值得信任、接入现有系统，并经得起采购方审价。替代方案包括人工外联团队、环境式病历工具，以及 Microsoft、Abridge、Suki 等厂商的 EHR
              助手。市场质疑者认为行业炒作过热；与精致演示或伙伴背书相比，独立验证更有分量。尽调因此要回到证据，而非叙事。本章采用有取舍的抽样视角，不试图穷尽市场：公开数据能显示趋势，却不足以回答所有边界问题。关键在于
              Hippocratic AI 从首批用例向更多工作流扩张时，能否持续证明价值。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接与相邻竞品
        blocks:
          - type: paragraph
            body: >-
              最值得关注的对手不只是另一家“AI 护士”初创公司，而是更广泛的医疗文书和工作流辅助厂商，尤其是 Abridge、Suki 和 Microsoft DAX
              Copilot。它们已进入临床工作流，掌握医疗系统里的用户注意力和分发渠道。Hippocratic 主攻患者端，但仍与这些厂商争夺同一批医疗系统 IT 和临床运营预算。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 渠道分发、转换成本与替代威胁
        blocks:
          - type: paragraph
            body: >-
              这个赛道的转换成本主要来自系统集成、机构信任和变更管理，不只看模型性能。Microsoft 可以把医疗能力并入更大的平台销售；Abridge 和 Suki 已嵌入医生文书工作流；IT
              和运营团队强的医疗系统也可能自建。因此，Hippocratic 必须持续证明，患者端产品带来的价值胜过竞品打包方案。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.3'
        title: 护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              看多者认为，Hippocratic
              的优势在于执行速度和信任：相比多数传统厂商，它更快进入患者语音工作流，也建立了鲜明的安全叙事。看空者则提醒，赛道仍新，营销说法可能领先于独立基准验证。评论和评测也说明，伙伴热情不等于产品护城河。若环境式 AI
              厂商进一步进入患者外联，凭借医生端关系和渠道优势，Hippocratic
              的护城河可能变薄。本章着眼于有证据支持的代表性样本，而非穷尽市场；公开信息能显示方向，却不足以厘清所有细节。核心问题是，公司拓展更多工作流时能否持续证明价值。
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP004
  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 收入模式与商业化变现
        blocks:
          - type: paragraph
            body: >-
              账面上，公司的收费模式很简单：每智能体小时
              $9。按用量收费让价格与实际使用挂钩，医疗系统增加工作流时也不必每次从头谈判。但收入质量取决于部署能否变成高频、日常使用，而不只是试点成功。按用量收费的软件演示时可能很亮眼，若客户用得零散，收入仍会忽高忽低。
            claimRefs:
              - CI001
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI010
              - CI012
      - number: '4.2'
        title: 资本结构与运营资金消耗
        blocks:
          - type: paragraph
            body: >-
              按医疗科技私企的标准，公司已融资颇多：种子轮、Series A、Series B 和 Series C 累计披露 $404
              million。眼下要看的不是公司能否活下去，而是能否把资金优势转成持续的收入和利润率证据。公开用途包括扩展产品、拓展海外市场和并购，说明公司仍计划投入资金争取品类领先，尚非财务自足。
            claimRefs:
              - CI003
              - CI006
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI012
      - number: '4.3'
        title: 单客经济模型与尽调结论
        blocks:
          - type: paragraph
            body: >-
              最大的财务盲点仍是收入。第三方 ARR
              估算从一千多万美元到高得多的水平；这种差距恰恰说明，市场尚未按经审计的经营数据为公司定价。员工人数也只有第三方估算。合理的结论不是公司经营乏力，而是关键数据仍不透明。若收入迅速增长，当前估值或许合理；但现有证据还不足以让投资人有足够把握为这一估值说法背书。本章聚焦有公开证据支持的样本，不求罗列整个市场：现有资料能显示趋势，却不足以解答所有细节。尽调要问的是，公司扩展工作流时能否持续证明价值。
