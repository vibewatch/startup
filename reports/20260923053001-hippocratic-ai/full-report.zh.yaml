    title: 风险分析
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              非诊断定位有助于公司应对当前监管要求，但边界仍可能变化。平台越强、越接近临床决策，监管方或客户就越可能要求更有力的证据和更严格的控制。这不代表业务出了问题，却意味着监管范围是必须核实的尽调事项。医疗系统对此尤其敏感：即便软件厂商承担大量工作，患者关系的责任仍在医疗机构。
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR013
      - number: '7.2'
        title: 运营、服务质量与竞争风险
        blocks:
          - type: paragraph
            body: >-
              面向患者的 AI
              常见失效风险包括语音识别错误、升级处置遗漏、质量漂移和过度自信的输出。公司对自身安全体系的描述令人安心，但证据仍由公司掌握。竞争方面，最大威胁不是初创公司照搬产品，而是已掌握临床工作流和合规关系的平台厂商或环境式
              AI 老牌公司。这也是 Microsoft、Abridge 和 Suki 值得重点关注的原因。
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: 财务、核心团队与逻辑证伪风险
        blocks:
          - type: paragraph
            body: >-
              按用量收费，意味着收入会随客户行为起伏：外联量下降，收入也会下降。创始人主导的公司还面临关键人物风险，这一点未必能从产品演示中看出来。投资逻辑的破裂信号并不难列出，却不容易持续监测：监管重新分类、患者受到实际伤害、重大续约未达预期，或大型厂商把患者端工作流纳入套装。本章聚焦有公开证据支持的样本，不求罗列整个市场：现有资料能显示趋势，却不足以解答所有细节。关键在于公司扩展工作流时能否持续证明价值。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR010
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资逻辑与评级建议
        blocks:
          - type: paragraph
            body: >-
              投资建议仍是跟踪。这不是含糊其辞，而是在扎实的产品验证、真实的客户增长势头和财务不透明之间作出的权衡。公司值得关注，但现有证据不足以说明 $3.5 billion
              估值便宜。标的有吸引力，价格却计入了公开数据尚无法证明的确定性。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
      - number: '8.2'
        title: 乐观、中性与悲观情景推演
        blocks:
          - type: paragraph
            body: >-
              乐观情景是公司成为医疗行业默认的患者端智能体平台，并把用量转成规模化、可持续收入。基准情景下，客户继续采纳，但收入和留存证据不足，估值仍处在“待证明”阶段。悲观情景则是监管收紧、竞品捆绑相似功能，或用量波动，令当前估值倍数难以维持。这些都是常见的风投风险，但高估值放大了影响。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: 可比估值坐标与退出纪律
        blocks:
          - type: paragraph
            body: >-
              与其寻找一个完美可比公司，不如放在更广泛的工作流 AI
              市场中衡量。公开证据显示公司已有增长势头和品类潜力，但盈利能力尚未得到验证。当前应以证据决定退出时机：关注经审计收入、留存是否稳固，以及公司能否在守住安全和信任的同时继续扩张。在此之前，保持关注但不要过度乐观。本章选取有证据支持的样本，不求穷尽市场：公开资料能显示方向，却不足以厘清所有细节。关键在于公司拓展工作流时能否持续证明价值；保持这份谨慎是合适的。
            claimRefs:
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
