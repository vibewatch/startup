chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Hippocratic AI 2023 年成立于 Palo
              Alto，主攻一个范围明确但重要的切口：面向患者的非诊断型临床智能体。它不是通用聊天机器人，而是以语音为主，承接随访电话、慢病回访、用药依从性管理、预约安排、福利咨询等结构化沟通，为护士和呼叫中心省下工时。公司强调智能体不诊断、不处方；这一定位也划定了客户信任、监管边界和可安全承接的工作流范围。
            claimRefs:
              - CO001
              - CO002
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO009
              - CO011
              - CO012
      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              公司仍由创始团队主导。Munjal Shah 是 CEO，也是公司对外代表；团队还包括首席产品官 Vishal Parikh 和首席科学官 Subho Mukherjee。团队兼具消费级产品落地经验与 AI
              研究能力，有利于产品、模型和市场拓展紧密配合。另一面是，公司声誉仍系于少数核心高管；即使员工增多、客户范围扩大，关键人物风险依然存在。
