              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: 研发路线图、竞争态势与产品风险
        blocks:
          - type: paragraph
            body: >-
              2026 年推出的极端气候应急智能体，显示产品正延伸至韧性保障和事件触发式外联。新场景有助于扩大实际用途，也增加了测试、监控和治理负担。Abridge、Suki 和 Microsoft DAX Copilot
              已占据部分临床工作流，未来也可能拓展到相邻场景。总体看，产品前景积极，但不能掉以轻心：平台能力之外，独立验证和克制扩张同样重要。本章聚焦有公开证据支持的样本，不求罗列整个市场：现有资料能显示趋势，却不足以解答所有细节。关键在于公司拓展更多工作流时能否持续证明价值。
            claimRefs:
