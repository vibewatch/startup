        blocks:
          - type: paragraph
            body: >-
              对一家非上市医疗科技公司而言，Hippocratic AI 融资节奏很快：种子轮 $50 million、Series A $53 million（估值 $500 million）、Series B $141
              million（估值 $1.64 billion）、Series C $126 million（估值 $3.5 billion）。公司称累计披露融资 $404
              million。后续融资继续获得大型医疗和科技投资方及战略医疗系统伙伴支持，既增强了资金实力，也提供商业认可；接下来，公司需要证明收入质量经得起时间检验，而不只是展示客户声量。
