  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范畴与工作流契合度
        blocks:
          - type: paragraph
            body: >-
              Hippocratic AI
              卖的是面向患者的语音智能体平台，不是医生病历工具。它承接出院随访、慢病管理、预约、接诊和福利咨询等结构化对话，无需诊断或开处方。产品能否找到市场，关键在于能否稳定承接重复发生的患者沟通任务，而不只是减轻文书负担；因此，它必须理解对话上下文、妥善升级异常并守住合规要求，不能只会生成病历摘要。
            claimRefs:
              - CE001
              - CE005
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE011
      - number: '5.2'
        title: 架构设计、性能基准与安全机制
        blocks:
          - type: paragraph
            body: >-
              Polaris 5.0 是重要的技术节点。公司称其模型星座总参数达 5 万亿，核心模型为 7000
              亿参数；基准测试覆盖时延、用药安全、升级处置安全、多语种切换、共情沟通和合规工作流。尽调重点不是宣传材料上的数字，而是技能和交互场景增加后，架构能否保持稳健。医疗语音 AI 必须同时做到响应快、临床准确且安全。
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
          - type: figure
