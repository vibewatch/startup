figures:
  - id: FO001
    title: Hippocratic AI 公司发展里程碑时间线
    type: timeline
    summary: 按时间梳理 Hippocratic AI 从成立到 2026 年产品发布的关键节点。
    data:
      items:
        - label: 创立
          date: 2023-01
          detail: Hippocratic AI 成立于加利福尼亚州 Palo Alto
          tone: positive
        - label: 种子轮 $50M
          date: 2023-05
          detail: General Catalyst 与 a16z 领投首轮机构融资
          tone: positive
        - label: A轮 $53M / $500M
          date: 2024-03
          detail: 完成估值 $500M 的 A 轮融资，医疗系统战略投资方参与
          tone: positive
        - label: B轮 $141M / $1.64B
          date: 2025-01
          detail: Kleiner Perkins 领投本轮，公司跻身独角兽行列
          tone: positive
        - label: C轮 $126M / $3.5B
          date: 2025-11
          detail: Avenir Growth 领投本轮；累计已披露融资额达 $404M
          tone: positive
        - label: Polaris 5.0
          date: 2026-04
          detail: 发布下一代医疗大模型及安全基准测试
          tone: positive
        - label: 极端气候应急智能体
          date: 2026-07
          detail: 推出应对气候事件和韧性需求的快速外联智能体
          tone: positive
    approximationNotes: 若具体日期对里程碑无公开实质意义，日期仅精确至月份。
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO007
      - CO008
      - CO010
  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    notes: 从广义医疗 AI 到 Hippocratic AI 当前可触达市场，分层估算 TAM/SAM/SOM。分析师给出区间时取中值；SOM 是尽调自下而上的估算，并非公司披露的 ARR。
    data:
      items:
        - label: TAM —— 全球医疗 AI 市场（2030年）
          value: 110.6
          unit: USD B
          detail: MarketsandMarkets 2025 年报告估计，全球医疗 AI 市场到 2030 年的 CAGR 为 38.6%；范围包括放射影像、基因组学、药物研发和临床决策支持
        - label: SAM —— 患者触达互动 AI 细分市场（2030年）
          value: 23.1
          unit: USD B
          detail: Strategic Market Research 报告称，患者互动 AI 细分市场 2024 年规模为 $1.82B，预计到 2030 年以约 25% 的 CAGR 增至 $23.1B
        - label: SOM —— Hippocratic AI 当前潜在 ARR 空间
          value: 0.068
          unit: USD B
          detail: 自下而上估算：50 家伙伴 × 平均每家 150 个智能体 × $9/智能体小时 × 每个智能体每月 83 小时 × 12 个月，得到约 $45M–$68M ARR；区间中值未经证实
        - label: 相邻工作流支出 —— 患者准入自动化
          value: 8.4
          unit: USD B
          detail: 尽调用于对照的支出估算，涵盖预约提醒、电话转接和患者来电分诊；未经独立审计。
        - label: 相邻工作流支出 —— 出院后随访外呼
          value: 5.7
          unit: USD B
          detail: 估算范围包括医疗系统和支付方弥补护理缺口、管理用药依从性及开展随访电话的支出。
        - label: 近期可触达细分市场 —— 现有合作伙伴智能体工时
          value: 0.045
          unit: USD B
          detail: 按公开价格和当前部署规模自下而上估算；列出此项是为了呈现宏观市场规模与当前变现水平的差距。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
  - id: FP001
    title: 竞争格局定位图
    type: quadrant
    notes: >-
      象限位置依据尽调对两条轴的序数评分。X 轴衡量当前企业级医疗部署规模（已确认的企业客户数和患者交互量）；Y 轴衡量临床安全验证基础（验证人员规模、测试通话量和安全架构投入）。得分为 -1 至 1
      的序数值，不代表线性比例。在纯患者端 AI 同业中，Hippocratic AI 两项均领先。
    data:
      xAxis: 企业级规模（已确认客户部署量）
      yAxis: 临床安全验证深度
      points:
        - label: Hippocratic AI
          x: 0.75
          'y': 0.9
          detail: 50+ 家企业伙伴、180M+ 次患者交互、7,500+ 名临床验证人员；在患者端 AI 同业中规模最大，临床安全验证基础也最深
        - label: Hyro AI
          x: 0.3
          'y': 0.1
          detail: 45+ 家医疗系统客户，服务 30M+ 名患者；深度集成 Epic，但未披露同等规模的临床安全验证体系
        - label: Notable Health
          x: 0.1
          'y': 0.05
          detail: 已知客户部署较少，主攻收入周期管理（RCM）和行政流程；未公开临床安全验证信息，工作流也不同于患者互动 AI
        - label: Nuance/Microsoft DAX
          x: 0.95
          'y': 0.4
          detail: 已部署于 550+ 家医疗系统（图中规模最大）；产品仅面向医生，病历能力经医生验证，但没有患者安全框架
        - label: Abridge
          x: 0.35
          'y': 0.25
          detail: 2025 年以 $6B 估值融资 $550M；专注医生端环境式病历生成，在医生文书领域临床信誉深厚，但没有患者端 AI 智能体
        - label: Suki AI
          x: 0.25
          'y': 0.15
          detail: 150+ 家医疗系统客户；提供医生文书工具，按席位收费并获 Google 支持；未见其提出患者端 AI 安全主张
        - label: Google Health
          x: 0.15
          'y': 0.35
          detail: 企业级患者端 AI 仍处研究阶段；与 HCA 合作开发 Med-PaLM 2，医疗 AI 研究实力强，但尚未大规模部署患者端企业智能体
        - label: Orbita
          x: -0.4
          'y': -0.2
          detail: 规模低于 $20M；采用 LLM 兴起前的聊天机器人技术，正被原生 LLM 竞争者赶超，目前市场影响有限
        - label: 人工呼叫中心（现状对照）
          x: 0.9
          'y': 0.55
          detail: 医疗系统普遍设有呼叫中心；注册护士（RN）能提供专业判断和执业范围内的完整照护，但综合成本高（全包 $39-65/小时），且受护士短缺制约
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
  - id: FI001
    title: 收入模型传导路径
    type: flow
    notes: 展示 Hippocratic AI 如何将产品交付按 $9/智能体小时计价，再由医疗系统获取价值，最终确认收入。各节点代表从产品能力到经济结果的价值链环节，箭头表示价值和资金流向。
    data:
      nodes:
        - id: A
          label: Polaris 3.0 推理
          detail: 22 个大模型共 4.2T 参数在 NVIDIA H100/H200 GPU 上生成患者对话；算力成本（COGS）估计为 $1–3/小时
          type: input
        - id: B
          label: 临床安全验证
          detail: 7,500+ 名持证验证人员检查对话质量和安全；持续运营及认证阶段的成本是毛利率关键因素
          type: process
        - id: C
          label: 患者交互交付
          detail: 语音优先的 AI 智能体通过电话完成患者外联任务（如出院随访、用药依从性管理）；迄今交互 180M+ 次
          type: process
        - id: D
          label: $9/智能体-小时计费
          detail: 医疗系统按标价支付每智能体小时 $9；批量折扣和企业最低消费额未披露，收入按实际用量计
          type: output
        - id: E
          label: 医疗系统获取价值
          detail: 适用的外联任务可为医疗系统省下每小时 $39–65 的护士人力成本；成本比为 4.3x；公司称人群健康 KPI 有所改善
          type: output
        - id: F
          label: B2B 企业级收入
          detail: Hippocratic AI 确认收入；ARR 代理估算为 $25–100M，但公司未披露 ARR；毛利率估计为 40–70%
          type: output
        - id: G
          label: 支付方/药企合同
          detail: 支付方会员外联和药企患者支持各自形成 B2B 收入流；C 轮材料称这是一个增长较快的板块
          type: output
      edges:
        - from: A
          to: B
          label: 推理模型生成经验证的响应
        - from: B
          to: C
          label: 经验证的智能体服务患者
        - from: C
          to: D
          label: 按交互时长计费
        - from: D
          to: E
          label: 相比护士人力节省成本
        - from: D
          to: F
          label: Hippocratic AI 确认收入
        - from: D
          to: G
          label: 同一计价模式拓展至支付方和药企
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
  - id: FE001
    title: 产品架构全景图
    type: stack
    notes: >-
      Polaris Safety Constellation 处理患者来电的流程：语音输入先经过多个 LLM
      专家智能体并行核验，再生成临床回复。核心创新就在这道并行校验：任何临床信息传达给患者前，都先由多个专家智能体检查主智能体的输出。
    data:
      layers:
        - label: 数据摄取与标准化
          detail: 患者信息和工作流输入先标准化，再进入模型路由与安全检查。
        - label: 语音编排与路由
          detail: 核心模型层之上负责语音处理、路由和时延控制。
        - label: 安全与护栏体系
          detail: 策略检查、合规过滤和升级转诊逻辑用于减少不安全输出。
        - label: 临床验证回路
          detail: 临床审核员和基准测试反馈持续校正模型表现。
        - label: EHR 与工作流集成
          detail: 集成接口把智能体接入企业工作流和患者病历。
        - label: 部署监控运维
          detail: 上线后通过日志、分析和事件响应持续监控系统。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
  - id: FU001
    title: 客户旅程图 —— 医疗系统采纳路径
    type: journey-map
    notes: >-
      梳理大型医疗系统从初步接触到正式部署、扩容的典型路径，依据 WellSpan、UHS 和 Cincinnati Children's 的已确认部署案例绘制。每个节点代表一个采纳阶段。4
      家战略投资方同时也是客户，股权关系加快了早期推进。
    data:
      nodes:
        - id: J1
          label: 初步接洽/投资人引荐
          detail: >-
            战略投资方（WellSpan、UHS、Uniting Care Queensland）于 2023 年 11 月种子轮阶段接触 Hippocratic
            AI；无投资关系的医疗系统则通过销售团队、行业会议或同行推荐接洽。2026 年 4 月后，AI Front Door 和 Nurse Co-Pilot 带来新的引荐
          type: input
        - id: J2
          label: 用例识别与确定
          detail: 医疗系统确定优先场景（出院后随访、筛查外呼、AI Front Door、慢病管理）；Hippocratic AI 的 App Store 提供 1,000+ 个预先验证的用例，可直接选用，无需定制开发
          type: process
        - id: J3
          label: 安全与合规审查
          detail: 医疗系统 IT 和法务审查 HIPAA BAA 合规、NVIDIA ACE 数据流、AWS 托管架构及 EHR 集成要求。SOC 2 / HITRUST 状态未公开确认，这会增加重视安全合规的医疗系统的采购阻力
          type: process
        - id: J4
          label: 合同与定价商务谈判
          detail: 签署企业合同；$9/智能体小时挂牌价可能有批量折扣；合同按年还是多年签署尚未披露；按行业基准估算，年度合同价值（ACV）为 $500K–$2M
          type: process
        - id: J5
          label: 入驻配置与系统上线
          detail: 医疗系统配置用例、接入患者名册并设置 EHR 数据访问权限（具体深度未披露），再配置多语种；验证人员依据该系统的临床方案检查质量
          type: process
        - id: J6
          label: 试点部署上线
          detail: 先在 1–2 家院区或特定患者群试点：UHS 先覆盖 2 家医院，WellSpan 针对特定筛查人群；扩大部署前先确定指标并建立基线
          type: process
        - id: J7
          label: 正式投产规模扩张
          detail: 试点结果良好后，扩展至更多患者群或院区。UHS 从 2 家扩至 29 家医院；WellSpan 增加海地克里奥尔语、尼泊尔语等语言支持。试点数据和临床医生认可度是扩容的关键条件
          type: process
        - id: J8
          label: 增购扩容与续约
          detail: 从 App Store 增选用例、接入更多院区，并可能拓展至同一医疗系统网络内的支付方和药企项目；续约时也可能签下多年承诺
          type: output
        - id: J9
          label: 标杆代言与口碑背书
          detail: 成功客户成为标杆（如 WellSpan 获 HAP 奖项认可），并在新闻稿中具名发声；投资人兼客户因股权关系更愿意背书，进而带来同行推荐
          type: output
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
  - id: FR001
    title: 风险热力图
    type: matrix
    notes: Hippocratic AI 主要风险的严重程度（行）和发生概率（列）矩阵；颜色深浅表示综合风险优先级。
    data:
      columns:
        - 低概率
        - 中概率
        - 高概率
      rows:
        - label: 阻断级
          values:
            - label: FDA 重新归类
              tone: warning
            - label: 患者伤害事件
              tone: negative
            - label: EHR 厂商挤压
              tone: negative
        - label: 重大级
          values:
            - label: 联邦 AI 立法
              tone: neutral
            - label: HIPAA 违规泄密
              tone: warning
            - label: 大规模幻觉爆发
              tone: warning
        - label: 轻微级
          values:
            - label: AWS 宕机
              tone: positive
            - label: 执行节奏放缓
              tone: neutral
            - label: 语音 AI 质量波动
              tone: neutral
        - label: 财务风险
          values:
            - label: 下轮折价融资信号
              tone: neutral
            - label: 调用量波动
              tone: warning
            - label: GPU 算力成本飙升
              tone: warning
        - label: 人才团队风险
          values:
            - label: 首席医疗官空缺
              tone: neutral
            - label: Shah 关键人风险
              tone: warning
            - label: 高管梯队薄弱
              tone: neutral
        - label: 声誉风险
          values:
            - label: 媒体舆论批评
              tone: neutral
            - label: 客户疑虑
              tone: warning
            - label: 品牌弱化
              tone: warning
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
  - id: FV001
    title: 投资建议决策逻辑
    type: flow
    notes: 决策树从核心论点和风险关卡推导最终建议；红色节点表示足以推翻正面建议的论点破裂条件。
    data:
      nodes:
        - id: safety
          label: 临床安全护城河
          detail: 7,500+ 名临床验证人员；22-LLM 安全星座架构；Polaris 3.0 准确率 99.38%（自报数据）
        - id: market
          label: 人力替代经济学
          detail: 每小时 $9，相比护士的 $39-65/小时成本可节省 78-86%；180M+ 次患者交互；50+ 家企业伙伴
        - id: nvidia
          label: NVIDIA 战略合作
          detail: NVentures 注资 $17M；优先获取 H100/H200 GPU 算力；针对实时语音 AI 开展 TensorRT-LLM 优化
        - id: traction
          label: 企业级商业势头
          detail: 50+ 家医疗系统；覆盖 6 个国家；23 周签约 23 单合同；UHS 部署覆盖 29 家医院
        - id: fda_gate
          label: FDA 分类监管关卡
          detail: 能否维持非 SaMD 定位？若 FDA 将产品重新归类为需 510(k) 许可的 SaMD，投资逻辑便不成立
        - id: rev_gate
          label: 收入验证关卡
          detail: ARR 是否超过 $50M、同比增长 80% 以上？这是支撑 $3.5B 估值的必要条件
        - id: ehr_gate
          label: EHR 竞争威胁关卡
          detail: Epic/Cerner 捆绑销售是否对 3 家以上实名客户构成实质威胁？若是，护城河出现裂痕
        - id: conditional_pos
          label: 有条件看好
          detail: ARR 已确认、净留存率（NRR）> 110% 且取得 FDA 意见后，才考虑以 $3-4B 估值参与 D 轮或新一轮直接增资；目标是在 5-7 年内获得 3-5x 回报
        - id: research_more
          label: 深入尽调 / 暂缓决议
          detail: 无法访问数据室或收入尚未证实，就暂缓决定；若估值高于 $4B，不参与 C 轮老股交易
        - id: avoid
          label: 规避 / 退出
          detail: 若 FDA 重新分类、具名客户因安全问题流失，或 D 轮折价融资等论点破裂条件出现，90 天内退出
      edges:
        - from: safety
          to: fda_gate
          label: 监管风险制约
        - from: market
          to: rev_gate
          label: 需核实收入
        - from: nvidia
          to: ehr_gate
          label: 竞争护城河检验
        - from: traction
          to: rev_gate
          label: 业务势头向实际收入转化
        - from: fda_gate
          to: conditional_pos
          label: 维持 FDA 非 SaMD 认定
        - from: fda_gate
          to: avoid
          label: FDA 将产品重新归类为 SaMD
        - from: rev_gate
          to: conditional_pos
          label: 确认 ARR > $50M
        - from: rev_gate
          to: research_more
          label: ARR 未获证实或 < $50M
        - from: ehr_gate
          to: conditional_pos
          label: EHR 护城河稳固
        - from: ehr_gate
          to: avoid
          label: EHR 方案挤掉 3 家以上具名客户
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
