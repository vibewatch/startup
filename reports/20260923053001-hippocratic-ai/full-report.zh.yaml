      - number: '6.3'
        title: 客户留存、集中度与证据链缺失
        blocks:
          - type: paragraph
            body: >-
              客户故事的短板不在客户名单，而在留存数据。公司没有公开 NRR、GRR
              或流失率，客户群能否长期稳定，尚未证明。部分客户同时是投资方，虽能助力分发，却让人更难判断交易是否按正常商业条件达成。因此，客户端论据虽积极但并不完整：需求确实存在，常规采购下能否留住客户还未证实。本章聚焦有公开证据支持的样本，不求罗列整个市场：现有资料能显示趋势，却不足以解答所有细节。尽调要问的是，公司扩展工作流时能否持续证明价值。
