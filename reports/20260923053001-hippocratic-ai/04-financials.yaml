  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Hippocratic AI has an attractive usage-based monetization model and a powerful balance sheet, but the financial diligence gap remains the same: revenue, margin, burn, and runway are not publicly audited. The correct conclusion is that the company is well-capitalized, but financially opaque."
  },
  "sections": [
    {
      "id": "SI-1",
      "title": "Revenue model and monetization",
      "body": "The company’s monetization model is simple on paper: $9 per agent-hour. That is a useful model because it ties price to consumption and lets a health system scale usage without negotiating every workflow from scratch. It also means revenue quality depends on whether deployments become habitual and high-volume, not just whether a pilot is successful. That distinction matters for diligence because usage-based software can look great in demos and still produce uneven revenue if customers only use it sporadically.",
      "claimRefs": [
        "CI001",
        "CI012"
      ],
      "tableRefs": [
        "TI001"
      ]
    },
    {
      "id": "SI-2",
      "title": "Capital stack and operating intensity",
      "body": "The company has raised a lot of money by private-healthcare standards: seed, Series A, Series B, and Series C now total $404 million disclosed. The capital story is therefore not about whether the company can stay alive; it is about whether the company can translate the balance sheet into durable revenue and margin evidence. The public use-of-funds language emphasizes product expansion, international growth, and M&A, which implies a business that expects to keep spending to build category leadership rather than one that is already financially self-sufficient.",
      "claimRefs": [
        "CI003",
        "CI006",
        "CI009"
      ],
      "tableRefs": [
        "TI002"
      ]
    },
    {
      "id": "SI-3",
      "title": "Unit economics and diligence verdict",
      "body": "Public revenue disclosure is still the main blind spot. Third-party estimates range from low-teens ARR to much higher figures, which is exactly the kind of spread that tells an investor the market is not yet pricing the business on audited economics. Headcount is also only available through estimates. So the right financial conclusion is not that the company is weak, but that the company remains opaque. The latest valuation may be justified if revenue scales fast, but the current evidence is not enough to underwrite that claim with high confidence. This chapter intentionally favors a sampled, evidence-constrained view of the topic rather than an exhaustive market map, because public data is enough to show the direction of travel but not enough to settle every edge case. The practical diligence question is whether the company can keep proving value as it broadens from the first use cases into the broader workflow surface.",
      "claimRefs": [
        "CI002",
        "CI004",
        "CI005",
        "CI007",
        "CI008",
        "CI010",
        "CI011"
      ],
      "tableRefs": [
        "TI003"
      ],
      "figureRefs": [
        "FI001"
      ]
    }
  ],
