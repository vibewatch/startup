- id: TP006
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Diligence ask
  rows:
  - - Channel-breadth narrative
    - Rival convergence in WhatsApp, RCS, AI agents, and cross-channel orchestration erodes uniqueness
    - high
    - Klaviyo, Braze, Salesforce, Adobe, MoEngage, and others now market similar real-time or agentic
      layers
    - Test feature parity on real use cases, not homepage language
  - - Commerce acquisition edge
    - Klaviyo’s Shopify gravity and self-serve pricing can win early commerce buyers before Insider enters
      a live sales process
    - high
    - Klaviyo’s Shopify review volume and free plan dwarf Insider’s public Shopify footprint
    - Request funnel data by deal size, channel source, and lost-deal reason
  - - Enterprise credibility
    - Braze’s disclosed revenue and customer counts plus Salesforce and Adobe ecosystems can out-signal
      Insider in large RFPs
    - high
    - Braze discloses FY2026 scale while incumbents bring formal marketplaces and partner benches
    - Review recent enterprise bake-offs, SI attach rates, and Fortune-1000 win stories
  - - Pricing power
    - Negotiation-heavy quotes create benchmark risk and discount pressure
    - high
    - Third-party Insider, Braze, and Salesforce pricing surfaces all point to opaque or modular economics
    - Compare win rates by pricing transparency and required services
  - - Composable substitution
    - Segment and mParticle let buyers unbundle data from execution and reduce single-vendor dependence
