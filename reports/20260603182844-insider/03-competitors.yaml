  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: negotiated-pricing
    missingEvidence: Recent negotiated enterprise quotes for Insider, Adobe, Bloomreach, and Netcore,
      including support, implementation, and channel-specific fees.
    whyItMatters: Public pages show directionally who is opaque versus transparent, but not the actual
      apples-to-apples deal economics that drive win-loss outcomes.
    diligencePath: Request current proposals, recent renewals, and side-by-side quote breakdowns from
      management or customer references.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: migration-data
    missingEvidence: Named customer migration or displacement case studies showing recent wins or losses
      between Insider and Braze, Klaviyo, Salesforce, or Adobe.
    whyItMatters: Without migration evidence, the moat and share-gain narrative remains plausible but
      not fully underwritten.
    diligencePath: Ask management for competitive takeout examples, churn reasons, and recent bake-off
      notes by deal size and segment.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP006
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Channel margins, referral economics, certification leverage, and SI attach rates
      by vendor.
    whyItMatters: Marketplace existence matters less than whether partners actually bring pipeline, implementation
      leverage, and retention support at scale.
    diligencePath: Request partner-sourced pipeline mix, SI dependency, and attach-rate data from Insider
      and comparable competitors where available.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: implementation-burden
    missingEvidence: Clean side-by-side benchmarks on services spend and time-to-value when moving from
      Salesforce or Adobe into Insider.
    whyItMatters: Switching-cost estimates are currently qualitative, which weakens precision on payback
      and implementation-risk modeling.
    diligencePath: Collect scoped migration estimates from system integrators and customers that have
      replaced incumbent suites with Insider.
    relatedQuestionRefs:
    - QP020
    - QP021
    relatedTableRefs:
    - TP005
