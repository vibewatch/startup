- calloutType: risk
  title: Klaviyo and Braze pressure Insider from opposite ends
  body: Klaviyo wins on transparent commerce onboarding and Shopify gravity, while Braze wins on disclosed
    enterprise scale and mobile-first credibility. Insider sits uncomfortably between those two reference
    points in public evidence.
  claimRefs:
  - CP034
  - CP036
  - CP046
- calloutType: risk
  title: AI language is no longer a moat by itself
  body: Nearly every serious peer now markets agentic workflows, unified profiles, and real-time personalization.
    That means Insider needs proof of better execution, not just similar homepage language.
  claimRefs:
  - CP041
  - CP045
- calloutType: insight
  title: Switching cost helps retention but does not create monopoly power
  body: Implementations are sticky because IDs, event taxonomies, theme code, and journey logic are embedded
    in each platform, yet marketplaces and composable CDPs keep credible exit and multi-homing paths available
    to capable teams.
  claimRefs:
  - CP039
  - CP040
  - CP048
