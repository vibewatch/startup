- id: TP005
  title: Switching cost and substitute map
  columns:
  - Path
  - What buyer gets
  - Switching / lock-in burden
  - Where Insider looks stronger or weaker
  - Likely fit
  rows:
  - - Bundled suite (Insider, Braze, Bloomreach, MoEngage, Netcore)
    - One vendor for data, journeys, and channels
    - Moderate to high because journeys, templates, IDs, and reporting are embedded in one stack
    - Insider looks stronger where WhatsApp and commerce templates matter; weaker where public scale proof
      matters
    - Teams wanting marketer-owned execution and fewer vendors
  - - Incumbent suite (Salesforce, Adobe)
    - Deep governance and broader enterprise stack standardization
    - High because suite dependencies, scripts, process controls, and partner ecosystems accumulate
    - Insider looks stronger on speed and bundle simplicity; weaker on incumbent reach
    - Large enterprises already standardized on broader clouds
  - - Commerce self-serve (Klaviyo)
    - Fast Shopify-led launch with transparent entry pricing
    - Medium because flows and segments are sticky, but the operating model is easier to replace
    - Insider looks stronger on cross-channel enterprise breadth; weaker on acquisition friction
    - SMB and growth commerce brands
  - - Composable CDP + execution (Segment or mParticle plus Braze/Klaviyo/etc.)
    - Best-of-breed flexibility and multi-homing
    - Medium to high because event taxonomy, routing, governance, and vendor coordination all matter
    - Insider looks stronger on one-vendor accountability; weaker on openness
    - Data-mature teams that already own their data layer
  - - Warehouse or internal-build path
    - Maximum control and custom logic
    - High upfront engineering and ongoing governance burden
    - Insider looks stronger on time-to-value; weaker on bespoke control
    - Highly technical or regulated teams with strong internal resources
  notes: This table focuses on operational lock-in drivers such as IDs, event schemas, SDK instrumentation,
    and workflow rebuilds rather than only contractual terms.
