- id: pricing-packaging
  title: Pricing transparency is one of the cleanest competitive separators
  body: 'Pricing and packaging remain one of the cleanest competitive separators. Klaviyo is the outlier:
    it publishes self-serve entry pricing, exposes profile and message limits, and benefits from a Shopify
    distribution motion that makes evaluation easy for smaller brands. Segment and Salesforce also expose
    at least some public entry guidance through public surfaces, but the economics still become custom
    once deployment grows. By contrast, Insider, Braze, Adobe, Netcore, and most enterprise suites still
    make buyers negotiate around active users, channels, credits, implementation, and support. Braze is
    unusually explicit about the logic of its model—platform edition, active users, and flexible credits—but
    not about a public sticker price. Insider’s pricing remains similarly usage-led and mostly opaque,
    with third-party buyers describing heavy negotiation around MTAU, channels, and contract length. That
    matters because public transparency can pull smaller commerce buyers away from Insider before a live
    sales process starts, even when Insider’s eventual functional scope is broader.'
  claimRefs:
  - CP004
  - CP008
  - CP014
  - CP027
  - CP034
  - CP043
  - CP047
  tableRefs:
  - TP003
- id: distribution-switching
  title: Distribution power and switching cost shape who can actually move budgets
  body: 'Distribution power does not come only from product quality. Klaviyo’s Shopify gravity is obvious
    in its app-store review volume; Braze now has a documented Shopify app and standard setup path; Salesforce
    and Adobe benefit from formal marketplaces and large partner benches; and mParticle and MoEngage both
    market co-sell or partner ecosystems designed to extend reach. Insider’s own Shopify listing proves
    it has real commerce distribution, but the public footprint is far smaller than Klaviyo’s and the
    ecosystem proof is thinner than Salesforce or Adobe. Once installed, switching cost is meaningful.
    Braze’s Shopify docs show workspace decisions, event mappings, and custom theme work; Segment reviewers
    note that event-taxonomy mistakes become expensive over time; Salesforce users still complain about
    SQL and AMPscript burden. Buyers can multi-home—especially with a CDP plus separate execution tools—but
    doing so raises integration, governance, and services costs. Insider’s lock-in is therefore real,
    yet not absolute: ecosystems and composable architectures keep exit paths open for teams willing to
    rewire data and workflows.'
  claimRefs:
