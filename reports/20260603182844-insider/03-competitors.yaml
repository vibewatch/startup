- calloutType: strength
  title: Insider still has a coherent bundled-commerce story
  body: 'Public sources still support a differentiated enterprise-commerce pitch: Insider combines CDP,
    personalization, AI, and cross-channel execution with unusually visible WhatsApp and merchandising
    workflows in one stack.'
  claimRefs:
  - CP001
  - CP002
