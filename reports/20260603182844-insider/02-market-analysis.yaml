- id: drivers-constraints-substitutes
  title: Growth drivers, adoption constraints, and status-quo substitutes
  body: 'Demand drivers are clear across sources: enterprises want first-party data they can activate in real time, more channels now need to be coordinated together, AI is moving from optional enhancement to workflow expectation, and sectors such as retail, travel, BFSI, and digital services keep raising the bar for personalized engagement. The same sources also show why growth can disappoint. Privacy rules are tightening in both Europe and the U.S.; browser and platform changes keep undermining third-party data habits; integration and data hygiene remain expensive; and many buyers still fail to use even half of their CDP capabilities after purchase. Those frictions help explain why adoption and utilization measurements can diverge sharply across surveys. They also create space for status-quo substitutes. Buyers can stay on stitched stacks of ESP, SMS, CRM, analytics, and warehouse tools, or buy broader suites from Twilio, Braze, Klaviyo, or Sprinklr instead of a closer MMH peer. For Insider,
    the upside comes from category convergence and integrated product breadth; the risk is that the same convergence enlarges the substitute set and raises buyer diligence standards.'
