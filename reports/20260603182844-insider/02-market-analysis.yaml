- id: TM005
  title: Status-quo substitutes and adjacent spend table
  columns:
  - substitute/adjacent
  - what buyer already owns
  - why it persists
  - where it falls short for Insider job-to-be-done
  - implication
  rows:
  - - ESP + SMS + push stack
    - Email platform, SMS vendor, mobile messaging tool, spreadsheets
    - Cheap to extend and familiar to channel teams
    - Hard to unify profiles, triggers, analytics, and journey logic across channels
    - Common incumbent for mid-market buyers and early pilots
  - - CRM / marketing cloud suite
    - Customer records, campaigns, service workflows, broader cloud contracts
    - Existing enterprise relationship and broad procurement coverage
    - May be slower to deploy or weaker on native channel breadth and specialized journey UX
    - Large-suite alternative that can crowd out budget
  - - Warehouse-native CDP + reverse ETL
    - Data warehouse, identity work, analytics team, connector layer
    - Fits organizations with strong internal data platforms and governance preferences
    - Requires more engineering and can leave marketers without turnkey orchestration
    - Strong substitute in IT-heavy enterprises
  - - CPaaS / communications + contact center platforms
    - Messaging APIs, contact-center software, voice or service tooling
    - Useful when buyer starts from communications infrastructure
    - Often requires more stitching to reach marketer-friendly orchestration and personalization
    - Broader convergence competitor rather than a pure MMH peer
  - - In-house workflow and analytics stack
    - Manual segmentation, BI dashboards, custom triggers, agency or ops work
    - Perceived control and sunk-cost bias
    - Slow iteration, fragmented ownership, and weak cross-channel coordination
    - Status quo that can delay category adoption even when pain is obvious
  notes: Substitutes can coexist with Insider in the same account; the table focuses on where buyers can defer or narrow platform spend instead of buying the full integrated stack.
