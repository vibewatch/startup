  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market taxonomy precision
    missingEvidence: A single independent 2026 source that isolates Insider’s exact MMH, CDP, personalization, and orchestration revenue pool rather than overlapping category shells.
    whyItMatters: Published estimates range from roughly $4B narrow CDP to $28B broad customer engagement, so valuation models can swing wildly if one taxonomy is chosen without reconciliation.
    diligencePath: Request management’s internal TAM/SAM deck and reconcile each layer against actual product modules, ICP segments, and win-loss notes.
    relatedQuestionRefs:
    - QM008
    - QM009
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: serviceable market by segment
    missingEvidence: Segment mix, ACV, win rates, and pipeline by retail, BFSI, travel, and mid-market cohorts.
    whyItMatters: Without real segment density and deal economics, any Insider SAM or SOM estimate remains illustrative rather than investable.
    diligencePath: Request customer count, ARR, ACV, and pipeline by segment and region plus named win-loss data versus Twilio, Braze, Klaviyo, and suites.
    relatedQuestionRefs:
    - QM009
    - QM010
    - QM027
  - type: private-evidence-only
    severity: material
    topic: pricing and contract structure
    missingEvidence: Public price book, contract floors, multi-product bundle rates, and professional-services attachment by segment.
    whyItMatters: Budget-owner analysis depends on whether Insider sells like an enterprise platform, a usage product, or a services-heavy bundle, and public sources do not resolve that.
    diligencePath: Request standard order forms, pricing architecture, contract-length distribution, and services gross margin from the data room.
    relatedQuestionRefs:
    - QM013
    - QM023
    - QM027
  - type: access-blocked
    severity: minor
    topic: gated analyst detail
    missingEvidence: Full Gartner, Forrester, and IDC methodology tables for MMH, CDP, and personalization rankings plus full buyer-benchmark appendices.
    whyItMatters: Public summaries support category direction, but licensed scorecards would sharpen competitor and buyer-committee mapping and reduce reliance on secondary recaps.
    diligencePath: Obtain licensed copies of relevant Gartner, Forrester, and IDC reports or ask management to provide screenshots and summary extracts.
    relatedQuestionRefs:
    - QM003
    - QM021
  - type: missing-source
    severity: material
    topic: implementation and utilization benchmarks
    missingEvidence: Independent benchmark data on median deployment duration, time-to-value, and renewal outcomes by vendor class.
    whyItMatters: Reviews show ramp friction, but underwriting migration risk requires broader benchmark data than vendor pages and anecdotal user comments.
    diligencePath: Request customer cohort implementation data, product usage telemetry, and third-party benchmark studies from management or advisers.
    relatedQuestionRefs:
    - QM014
    - QM024
    - QM026
