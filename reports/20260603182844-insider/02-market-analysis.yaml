callouts:
- calloutType: insight
  title: Integrated vendors benefit from category convergence
  body: The strongest structural tailwind for Insider is that buyers increasingly want data, orchestration, personalization, and channel execution in one operating layer. That is exactly the direction competitor disclosures from Twilio, Braze, and Insider itself describe.
  claimRefs:
  - CM002
  - CM003
  - CM043
  - CM044
- calloutType: risk
  title: Published TAM figures are directionally useful but not underwriting-grade
  body: Public sizing estimates are too inconsistent to support a single clean TAM, SAM, or SOM. The correct takeaway is not one precise number; it is that category shells range from narrow CDP to MMH to broad customer engagement, and Insider sits between them.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM017
- calloutType: risk
  title: Privacy, integration, and low utilization can slow real adoption
  body: The adoption story is not frictionless. Privacy laws, platform changes, legacy integration work, and low post-purchase utilization all show up repeatedly in retained sources, which means growth can lag top-line market forecasts if customers cannot operationalize the stack.
  claimRefs:
  - CM035
  - CM036
  - CM038
  - CM040
  - CM042
- calloutType: insight
  title: Budget ownership is a committee problem, not just a marketing decision
  body: The relevant buyer is usually cross-functional. Marketing and CRM teams feel the pain, but IT and data teams often control the systems of record, while executive scrutiny forces every platform purchase to show measurable value.
