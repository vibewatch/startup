- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Multichannel marketing hubs
    - Unified campaign management across email, SMS, mobile, web, and owned digital channels; customer-data activation; journey orchestration
    - Services-heavy contact-center seats, pure adtech, offline media buying
    - Marketing, CRM, and lifecycle leaders with IT support
    - Closest standardized shell for Insider’s bundle
  - - Customer data platform
    - First-party data unification, identity, segmentation, consent-aware activation, analytics handoff
    - Standalone BI, raw data lakes without activation, generic warehousing spend
    - Marketing plus data or IT co-ownership
    - Core enabling layer inside Insider’s value proposition
  - - Personalization and experimentation
    - Onsite or app personalization, recommendations, next-best-action, AI decisioning
    - CMS-only tools, basic A/B widgets without unified profiles
    - Digital commerce and growth teams
    - Explains inbound conversion and retention use cases
  - - Broad customer engagement platforms
    - Communications, data, AI, orchestration across marketing and service journeys
    - BPO services, unrelated call-center operations, generic collaboration tools
    - Enterprise CX or digital-experience budgets
    - Useful upper-bound adjacency, but too broad for direct TAM
  - - Excluded spend and status quo
    - CRM records, ESP plus SMS stack, warehouse-native DIY data tooling, manual ops
    - Pure ERP, HRIS, finance systems
    - Existing app owners and operations teams
    - These are substitutes or complements, not all directly comparable revenue pools
  notes: Boundary intentionally narrows from broad martech toward MMH, CDP, and personalization layers where Insider’s retained product evidence is strongest.
