company:
  name: Insider
chapter:
  number: 2
  title: Market Analysis
  summary: 'Insider sells into a meaningful but layered market: the best practical fit is the multichannel marketing hub category plus CDP and personalization budgets, not the entire martech universe or the whole customer-experience stack. Public 2026 sizing evidence ranges from roughly $4 billion for narrow CDP definitions to $7.1 billion for multichannel marketing hubs and $28.1 billion for broader customer engagement platforms, and that dispersion is itself informative because vendors and analysts use incompatible taxonomies. Buyers are usually cross-functional marketing, CRM, IT, and data teams funding first-party data and orchestration, while privacy, integration, utilization, and substitute stacks keep clean SAM and SOM precision weak.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and the right comparison set
  body: 'Insider’s own 2026 product surfaces describe one integrated platform for marketing and customer engagement teams that combines customer data, personalization, AI, and channel execution. That framing makes the company broader than an ESP or a single-channel messaging tool, but still narrower than the entire marketing-technology universe. The cleanest standardized category match is multichannel marketing hubs: a platform layer that centralizes customer data and runs cross-channel campaigns across email, websites, mobile, and other owned channels. CDP and personalization are crucial enabling layers inside that shell, while broad customer engagement or martech categories are useful only as outer bounds because they pull in contact-center services, offline media, sales-enablement tooling, and other budgets Insider does not directly own. For underwriting, the practical question is not whether Insider participates in a very large digital-experience market in the abstract; it is which spend
    pools a buyer would realistically compare against Insider. That comparison set points to MMH, CDP, and personalization budgets first, with broader customer-engagement suites and stitched point-tool stacks as substitutes or adjacent shells.'
