- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - AI-enabled personalization and journey automation
    - driver
    - current
    - Supports spend on platforms that can turn unified data into next-best-action and campaign execution
    - Request attach rates and monetization for AI modules versus core platform seats.
  - - First-party data and privacy-safe targeting
    - driver
    - current
    - Cookie loss and privacy pressure increase demand for platforms that unify and activate consented first-party data
    - Request data-governance architecture and clean-room / warehouse strategy.
  - - Omnichannel channel proliferation
    - driver
    - current
    - More active channels increase the value of one orchestration layer over stitched point solutions
    - Request cross-channel usage mix and channel-specific retention by segment.
  - - Retail, BFSI, and travel digitization
    - driver
    - current to medium-term
    - Verticals with high customer-data intensity and personalization needs keep funding the category
    - Request revenue mix by vertical, region, and regulated versus unregulated customers.
  - - Privacy regulation and consent burden
    - constraint
    - current
    - Raises buying friction, legal review, and operational complexity for every deployment
    - Request objection logs, DPIA templates, and region-specific data-residency controls.
  - - Integration complexity and data hygiene
    - constraint
    - current
    - Legacy stacks and poor data quality can slow implementation and reduce realized ROI
    - Request median implementation time, required services hours, and time-to-value by segment.
  - - Low utilization and learning curve
    - constraint
    - current
    - Customers may buy broad capabilities but fail to operationalize them fully
    - Request product-usage telemetry, renewal outcomes, and customer-success intervention rates.
  - - Budget scrutiny and multi-stakeholder approval
    - constraint
    - current
    - Even growing budgets face heavier ROI scrutiny and cross-functional approval workflows
    - Request recent deal cycles, approval blockers, and common proof-of-value metrics used in sales.
  notes: Drivers and constraints are tied to adoption timing and budget ownership, not just abstract category narrative.
