companyProfile:
  summary: Insider is a private, Istanbul-rooted customer engagement software company founded in 2012 by a six-founder team led publicly by CEO Hande Cilingir. The platform combines a native CDP, unified customer database, journey orchestration, personalization, recommendations, search, and newer generative and agentic AI workflows across 12+ native channels and 100+ integrations. Public evidence now supports 2,000+ customers globally, roughly 1,500+ teammates, and meaningful U.S. expansion through Bluecore, while the financing record includes a $121M Series D, a 2023 strategic investment, and a $500M Series E; the precise Series E valuation and terms remain undisclosed.
