figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests a high-touch enterprise motion that starts with migration or channel optimization, lands a KPI win, and then expands into additional channels and AI modules.
  approximationNotes: The map abstracts across multiple case studies and review sources; it describes the dominant public motion rather than a single mandatory implementation sequence.
  data:
    items:
    - label: Evaluate
      actor: Digital marketing / CRM / eCommerce lead
      touchpoints:
      - G2 or Gartner review pages
      - Reference stories on Insider customers page
      - Enterprise rankings and analyst collateral
      painpoint: Teams want a faster path off legacy marketing clouds without losing omnichannel depth.
      opportunity: 'G2 and Gartner proof plus 44 #1 enterprise rankings reduce perceived procurement risk.'
    - label: Migrate and onboard
      actor: Marketing ops + IT / implementation team
      touchpoints:
      - Automatic migrator
      - Pre-built integrations
      - Localized onboarding teams in 28 countries
      painpoint: Data readiness and implementation complexity can slow time-to-value.
      opportunity: Insider claims up to 5X faster time-to-value and 150 migrated brands in the last year.
    - label: Land initial use case
      actor: Channel owner / growth lead
      touchpoints:
      - Web personalization
      - Cart reminders
      - Test-drive or lead-gen flows
      - Push notifications
      painpoint: Teams need measurable CVR / AOV / lead lift quickly to justify platform change.
      opportunity: Samsung, Vodafone, Toyota, Adidas, and Decathlon all publish KPI wins for first-wave use cases.
    - label: Expand across channels
      actor: Lifecycle / loyalty / product marketing teams
      touchpoints:
      - Architect journeys
      - Web Push
      - Email
      - Smart Recommender
      - Search / AI segmentation
      painpoint: Point tools create fragmented journeys and duplicated data work.
      opportunity: Case studies repeatedly show movement from one use case into broader cross-channel orchestration.
    - label: Operationalize enterprise program
      actor: Regional customer success and commercial owner
      touchpoints:
      - Quarterly business reviews
      - Optimization workshops
      - Migration playbooks
      - Enterprise support
      painpoint: Advisor continuity and support responsiveness can affect satisfaction.
      opportunity: 97% willingness-to-recommend and enterprise rankings imply many accounts still see strong value after go-live.
    - label: Renew / deepen
      actor: Executive sponsor
      touchpoints:
      - Additional modules
      - AI roadmap
      - Global rollout across more teams / regions
      painpoint: Public evidence stops short of disclosed renewal or NRR proof.
      opportunity: Multi-module deployments and switching-cost proxies support expansion potential, pending private cohort data.
