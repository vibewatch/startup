- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Signal
  - 2026 reading
  - What it suggests
  - Main caveat
  - Diligence ask
  rows:
  - - G2 seller page
    - 4.8 stars from 1,292 verified reviews
    - High review volume and broadly positive satisfaction among active reviewers
    - Wayback-backed fetch; rating is not a retention metric
    - Request rating trend, review velocity, and enterprise-segment split by category
  - - G2 Spring 2026 release
    - 100/100 user satisfaction and 97% willing to recommend
    - Strong promoter-style signal and positive onboarding / support perception
    - Company-curated framing of G2 data
    - Ask for raw G2 report exports or independent CSAT/NPS
  - - G2 Summer 2026 release
    - '97% willing to recommend; 44 #1 enterprise rankings'
    - Positive enterprise buyer validation and implementation satisfaction
    - Still indirect; not a cohort renewal statistic
    - Request renewal rates for migrated enterprise accounts
  - - Gartner Peer Insights
    - 525 verified reviews with 84% five-star, 15% four-star, 1% three-star distribution
    - Broadly positive verified-user sentiment on deployment and capabilities
    - Aggregate rating still subject to review selection bias
    - Review all <=3-star feedback by region and segment during diligence
  - - Gartner critical review
    - 3.0 review citing frequent advisor changes and unstable meeting schedules
    - Customer-success consistency is the clearest adverse theme in public evidence
    - Single review; severity unknown across the base
    - Ask for CSM turnover, implementation escalation, and support SLA metrics
  - - TrustRadius review
    - Strong CRO/web push value but explicit comments about bugs and support detail
    - Product delivers measurable marketing value but quality assurance / support can slip
    - Small sample size in fetched output
    - Request bug backlog trends and support CSAT for enterprise accounts
  - - FeaturedCustomers reference volume
    - 135 reviews/testimonials, 135 case studies, 19 videos
    - Large public reference footprint and abundant customer-marketing collateral
    - Reference directories can over-represent happy customers
    - Request live reference calls across geographies and less promotional accounts
  - - Renewal and churn disclosure
    - No public NRR, GRR, logo churn, or contract-length data located
    - True durability still unproven in public evidence
    - Absence of evidence is not evidence of weakness, but it is a diligence gap
    - Request NRR/GRR by segment, cohort retention, and gross dollar churn bridge
  notes: This table deliberately separates satisfaction and reference density from actual renewal evidence. Public reviews are helpful proxies, but none replace disclosed cohort or contract economics.
