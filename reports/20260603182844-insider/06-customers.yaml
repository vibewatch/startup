- id: named-customer-proof-and-outcomes
  title: Named customer proof and case-study outcomes
  body: 'Insider’s best public customer evidence is not just logo usage; it is a fairly deep set of quantified official case studies. Samsung’s story links Insider to a 275% conversion uplift in 20 days, 24% higher conversions from web push, and 9% of Galaxy Note sales during the campaign window. Vodafone’s case study points to a 159% increase in conversion rate and more than 6X ROI, while Toyota, Adidas, Allianz, MAC Cosmetics, Decathlon, airBaltic, Burger King, CNN, and Lexus each provide narrower but still concrete proof on test-drive applications, AOV, revenue per user, ROAS, or click-through rates. This is important for diligence because it shows customers deploying Insider across materially different motions: onsite personalization, product recommendations, predictive segmentation, push notifications, lifecycle journeys, checkout optimization, and campaign migration. Requested names are only partly supportable. Samsung and Vodafone have direct outcome-rich case studies; Singapore Airlines,
    Unilever, and L’Oréal appear in official customer lists or enterprise-win releases but do not have public KPI-rich stories in the evidence set reviewed here. LEGO appears on the 2026 customers page with a 361% subscriber increase and an explicit praise quote about support quality, but not with a standalone case-study URL. Tokopedia, DeFacto, Domino’s, and IKEA Turkey-specific deployment depth did not surface in directly supportable 2026 public proof during this pass.'
