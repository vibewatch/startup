- id: satisfaction-durability-and-land-expand
  title: Satisfaction, durability proxies, and land-and-expand motion
  body: 'The durability question is partly answerable from proxies and still under-disclosed where investors care most. Public retention metrics such as NRR, GRR, logo churn, contract duration, or renewal cohorts do not appear in the source set. What is visible instead is a strong mix of review-platform volume, customer-reference density, and operational migration claims. G2’s seller page shows 4.8 stars from 1,292 verified reviews, while Insider’s own Spring and Summer 2026 G2 releases say 97% of customers are willing to recommend the platform and that more than 150 brands migrated from legacy marketing clouds in the past year, with up to 5X faster time-to-value. Gartner Peer Insights is directionally positive as well, with 525 verified reviews and an 84% / 15% / 1% five-star / four-star / three-star distribution, but it also provides the most concrete adverse signal in the set: a 3.0 review complaining about frequent advisor changes and unstable meeting schedules. TrustRadius echoes the
    same pattern — strong value from web push and conversion optimization, but explicit complaints about bugs and support detail. The case studies themselves reinforce land-and-expand. Customers regularly deploy multiple modules rather than a single campaign widget: Samsung used Architect, Smart Recommender, and overlays; Vodafone used cross-channel segmentation and onsite reminders; Adidas and Decathlon combined onsite optimization, recommendations, push, and personalization. That pattern suggests meaningful switching-cost proxies even though true retention metrics remain private.'
