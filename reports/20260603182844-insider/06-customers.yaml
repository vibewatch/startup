  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-mix-disclosure
    missingEvidence: Customer mix by geography, industry, company size, and ARR band.
    whyItMatters: Public logo diversity does not reveal where revenue is concentrated or whether segment growth is balanced.
    diligencePath: Request a current customer census by ARR band, region, industry, and top-20 account list with starting ARR.
    relatedQuestionRefs:
    - QU002
    - QU003
    - QU026
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, contract duration, and cohort renewal data.
    whyItMatters: The chapter can only infer stickiness from reviews, migrations, and multi-module deployments without the actual retention economics.
    diligencePath: Request cohort retention tables by segment and product, including gross and net dollar retention, logo churn, and average contract term.
    relatedQuestionRefs:
    - QU018
    - QU022
    - QU027
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 / top-25 customer ARR concentration and partner-sourced concentration.
    whyItMatters: A broad logo set can still hide material dependence on a small number of strategic global accounts or sourcing channels.
    diligencePath: Request concentration schedules, customer ARR histogram, top-partner sourced ARR, and the largest-customer renewal history.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU027
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: requested-brand-proof
    missingEvidence: Standalone KPI-rich public proof for LEGO, Singapore Airlines, Unilever, L’Oréal, Tokopedia, DeFacto, Domino’s, and IKEA Turkey.
    whyItMatters: The brief specifically named these accounts, but several remain logo-level or single-source references rather than durable deployment proof.
    diligencePath: Request customer-reference calls, public case-study URLs, or permissioned reference decks for the named brands.
    relatedQuestionRefs:
    - QU011
    - QU028
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: module-attach-and-expansion
    missingEvidence: Product attach rates, average modules per account, and upsell conversion from migration cohorts.
    whyItMatters: Land-and-expand is central to the thesis but currently supported only by case-study patterns and company claims, not disclosed attach data.
    diligencePath: Request product attach by segment, migration cohort expansion rates, and revenue split between single-product and multi-product accounts.
    relatedQuestionRefs:
    - QU012
    - QU020
    - QU027
    relatedTableRefs:
    - TU005
acknowledgedWarnings:
- dimension: figureType
  reason: No public time-series retention cohort exists, so the planned cohort figure was intentionally replaced with evidence-led retention tables rather than publishing speculative percentage cohorts.
