- id: concentration-risk-and-open-asks
  title: Concentration risk and open diligence asks
  body: 'The concentration story is directionally reassuring on logos and still weak on economics. A disclosed base of 2,000+ customers, one-third of the Fortune 500, and visible coverage across retail, automotive, travel, telecom, media, and insurance all argue against extreme logo concentration. At the same time, public materials do not disclose top-10 customer ARR share, the revenue split between enterprise and mid-market, top-partner sourcing, module attach by cohort, or cohort retention by geography. That means the best public evidence today supports breadth of deployment rather than durability of revenue. The most likely near-term diligence questions are therefore economic rather than marketing-led: how much ARR sits in a small number of strategic global accounts, what percent of ARR is attached to multi-product deployments, whether the recent 150-brand migration wave is expanding inside accounts or mostly replacing one vendor with another, and how much customer success bandwidth is
    required to sustain high-touch enterprise implementations. Investors should treat the public chapter as strong proof of real production use and competitive win capability, but not as a substitute for customer-cohort underwriting.'
