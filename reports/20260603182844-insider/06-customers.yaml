- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: Official sources portray a repeatable motion from legacy-cloud or point-tool replacement into multichannel activation and broader enterprise rollout.
  approximationNotes: The flow is synthesized from migration disclosures, case studies, and review pages rather than a single process document.
  data:
    nodes:
    - id: proof
      label: Proof and procurement
      detail: Buyer validates the platform through G2, Gartner, official rankings, and named customer stories.
    - id: migration
      label: Migration / integration
      detail: Teams move off incumbent clouds or point tools using automatic migration, pre-built integrations, and local onboarding.
    - id: launch
      label: Launch first channel or use case
      detail: Common first wins center on web personalization, push, cart recovery, lead generation, or onsite experimentation.
    - id: optimize
      label: Optimize measurable KPI
      detail: Case studies highlight CVR, AOV, lead generation, ROI, and test-drive application improvements.
    - id: expand
      label: Expand into cross-channel orchestration
      detail: Customers add journeys, AI segmentation, recommendations, search, and more channels from the same data layer.
    - id: enterprise
      label: Enterprise rollout and renewal
      detail: The account becomes a broader enterprise platform decision with more regions, teams, and governance requirements.
    edges:
    - from: proof
      to: migration
      label: purchase / replace prior stack
    - from: migration
      to: launch
      label: go live quickly
    - from: launch
      to: optimize
      label: measure early KPI lift
    - from: optimize
      to: expand
      label: add modules and channels
    - from: expand
      to: enterprise
      label: roll out globally / deepen usage
