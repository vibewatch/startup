chapter:
  number: 6
  title: Customers
  summary: 'Insider’s public customer proof is stronger than a typical private martech vendor: the current customers page claims 2,000+ customers, official releases show a progression from 1,200+ businesses in 2023 to 1,500+ customers in late 2024, and company case studies quantify outcomes for Samsung, Vodafone, Toyota, Adidas, Allianz, Decathlon, and other brands. The diligence upside is clear enterprise breadth, visible land-and-expand behavior across channels and AI modules, and strong review-platform sentiment; the main gaps are the absence of public NRR/GRR/churn disclosures, no public top-customer concentration schedule, and only logo-level proof for some requested names such as Singapore Airlines, Unilever, and L’Oréal.'
sections:
- id: customer-base-segmentation-and-adoption
  title: Customer base segmentation and adoption trajectory
  body: 'The public customer picture points to a company that has moved well beyond a niche regional martech tool and now sells primarily to large, digitally sophisticated brands. Insider’s 2026 customers page says the platform powers over 2,000 customers globally, orchestrates millions of customer journeys, and spans 12+ native channels from web and app to email, SMS, WhatsApp, and search. Historical disclosures give a visible growth path rather than a single static logo wall: the Q3 2023 PR said Insider had onboarded 110+ customers in the quarter and was trusted by 1,200+ businesses, while the October 2024 Series E announcement moved the disclosed base to 1,500+ customers. By mid-2026, the company was again publicly using a 2,000+ customer claim and pairing it with enterprise migration wins against legacy marketing clouds. The buyer mix visible in public proof is weighted toward digital commerce, CRM, loyalty, and lifecycle marketing teams at enterprise retail, automotive, travel, telecom,
    financial services, and consumer brands. That conclusion is still inferential rather than management-disclosed: Insider does not publish a region-by-region or ARR-band customer mix, so the segmentation table below is based on named logos, case-study industries, and the vertical mix repeated across company releases and third-party references.'
