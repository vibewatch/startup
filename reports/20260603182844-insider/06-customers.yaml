- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Dimension
  - Public evidence
  - Implication
  - Current read
  - Diligence path
  rows:
  - - Cross-channel expansion
    - Case studies repeatedly span onsite, web push, email, recommendations, search, and segmentation
    - Customers often deploy multiple modules rather than a single widget
    - Positive structural expansion vector
    - Ask for module attach by customer cohort and revenue from multi-product accounts
  - - Legacy-cloud replacement motion
    - 150 brands migrated in the past year with up to 5X faster time-to-value
    - Insider can win rip-and-replace deals against incumbent suites
    - Positive for net-new growth and competitive posture
    - Request migration retention and implementation success rates after go-live
  - - Enterprise upmarket traction
    - 'One-third of Fortune 500, 200+ enterprise brands added, 44 #1 enterprise rankings'
    - Evidence supports enterprise procurement credibility
    - Positive, but still driven by company disclosures
    - Request ARR mix by enterprise / mid-market / growth-stage segment
  - - Geographic diversification
    - Customers and teams span North America, EMEA, APAC, and Latin America / 28 countries
    - Low single-region dependency at the logo level
    - Positive on breadth, unclear on ARR weighting
    - Request ARR and churn by region plus local support coverage ratios
  - - Top-customer concentration
    - No public top-10 customer revenue schedule found
    - Economic concentration cannot be assessed from public sources
    - Material unknown
    - Request top-10 / top-25 ARR concentration and largest-single-customer history
  - - Partner concentration
    - Public sources highlight local teams and migration playbooks but not sourcing concentration
    - Channel dependence may exist but is not quantified
    - Unknown
    - Request sourced ARR by partner type and concentration among SIs / agencies / migration partners
  - - Retention economics
    - No public NRR, GRR, contract duration, or renewal cohorts
    - Durability is still a data-room question
    - Material unknown
    - Request NRR/GRR by segment, term length, renewal cohorts, and gross logo churn
  - - Service consistency risk
    - Gartner and TrustRadius both surface support / advisor consistency issues
    - Execution risk is more visible than product-gap risk
    - Moderate adverse signal
    - Request support CSAT, CSM turnover, implementation backlog, and severity-1 incident history
  notes: Public proof is strong on breadth of use and competitive wins but weak on revenue concentration and retention economics. The table focuses on what public evidence can and cannot actually underwrite.
