evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board and control structure
    missingEvidence: Current board roster, board observer rights, ownership percentages, and control provisions after Series E.
    whyItMatters: >-
      Without a current board and cap-table view, governance power, investor vetoes, and founder control cannot be
      assessed from public evidence alone.
    diligencePath: >-
      Request the current cap table, board consent schedule, investor rights agreement, and latest board roster from the
      data room.
    relatedQuestionRefs:
      - QO006
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation opacity
    missingEvidence: Post-Series-E valuation, share price, or any later financing documentation after the November 2024 round.
    whyItMatters: >-
      Series E amount is public, but the latest valuation is not; that blocks clean benchmarking of current investor
      entry price and dilution.
    diligencePath: Request Series E term sheets, updated cap table, and any later financing or secondary transaction documents.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: current ARR and revenue quality
    missingEvidence: Current ARR, revenue run rate, gross retention, NRR, and customer concentration data for 2025-2026.
    whyItMatters: >-
      Latka provides an estimate for 2024, but there is no official 2026 denominator for scale, growth efficiency, or
      valuation work.
    diligencePath: >-
      Request monthly ARR and revenue bridge, cohort retention, top-20 customer concentration, and audited or
      board-level revenue reporting.
    relatedQuestionRefs:
      - QO011
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: pricing and capital structure disclosure
    missingEvidence: Public price book, contract floor terms, debt facilities, and any secondary liquidity history.
    whyItMatters: >-
      Public materials prove scale and product breadth but do not reveal pricing power, leverage, or whether insider
      liquidity has already occurred.
    diligencePath: >-
      Request standard order forms, pricing schedule, debt register, and any tender or secondary transaction history
      from management.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: TO004 public chronology coverage
    missingEvidence: >-
      A complete chronological archive of Insider press releases or filings that confirms exact dates and details for
      each pre-2024 funding and partnership milestone.
    whyItMatters: >-
      The milestone table is directionally reliable, but the current newsroom fetch is a fast-facts page and several
      older entries still rely on database records instead of primary archived releases.
    diligencePath: >-
      Request a company press archive or financing binder and reconcile the table row-by-row against signed financing
      documents and archived announcements.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market taxonomy precision
    missingEvidence: >-
      A single independent 2026 source that isolates Insider’s exact MMH, CDP, personalization, and orchestration
      revenue pool rather than overlapping category shells.
    whyItMatters: >-
      Published estimates range from roughly $4B narrow CDP to $28B broad customer engagement, so valuation models can
      swing wildly if one taxonomy is chosen without reconciliation.
    diligencePath: >-
      Request management’s internal TAM/SAM deck and reconcile each layer against actual product modules, ICP segments,
      and win-loss notes.
    relatedQuestionRefs:
      - QM008
      - QM009
      - QM027
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: serviceable market by segment
    missingEvidence: Segment mix, ACV, win rates, and pipeline by retail, BFSI, travel, and mid-market cohorts.
    whyItMatters: >-
      Without real segment density and deal economics, any Insider SAM or SOM estimate remains illustrative rather than
      investable.
    diligencePath: >-
      Request customer count, ARR, ACV, and pipeline by segment and region plus named win-loss data versus Twilio,
      Braze, Klaviyo, and suites.
    relatedQuestionRefs:
      - QM009
      - QM010
      - QM027
  - type: private-evidence-only
    severity: material
    topic: pricing and contract structure
    missingEvidence: Public price book, contract floors, multi-product bundle rates, and professional-services attachment by segment.
    whyItMatters: >-
      Budget-owner analysis depends on whether Insider sells like an enterprise platform, a usage product, or a
      services-heavy bundle, and public sources do not resolve that.
    diligencePath: >-
      Request standard order forms, pricing architecture, contract-length distribution, and services gross margin from
      the data room.
    relatedQuestionRefs:
      - QM013
      - QM023
      - QM027
  - type: access-blocked
    severity: minor
    topic: gated analyst detail
    missingEvidence: >-
      Full Gartner, Forrester, and IDC methodology tables for MMH, CDP, and personalization rankings plus full
      buyer-benchmark appendices.
    whyItMatters: >-
      Public summaries support category direction, but licensed scorecards would sharpen competitor and buyer-committee
      mapping and reduce reliance on secondary recaps.
    diligencePath: >-
      Obtain licensed copies of relevant Gartner, Forrester, and IDC reports or ask management to provide screenshots
      and summary extracts.
    relatedQuestionRefs:
      - QM003
      - QM021
  - type: missing-source
    severity: material
    topic: implementation and utilization benchmarks
    missingEvidence: Independent benchmark data on median deployment duration, time-to-value, and renewal outcomes by vendor class.
    whyItMatters: >-
      Reviews show ramp friction, but underwriting migration risk requires broader benchmark data than vendor pages and
      anecdotal user comments.
    diligencePath: >-
      Request customer cohort implementation data, product usage telemetry, and third-party benchmark studies from
      management or advisers.
    relatedQuestionRefs:
      - QM014
      - QM024
      - QM026
  - type: private-evidence-only
    severity: material
    topic: negotiated-pricing
    missingEvidence: >-
      Recent negotiated enterprise quotes for Insider, Adobe, Bloomreach, and Netcore, including support,
      implementation, and channel-specific fees.
    whyItMatters: >-
      Public pages show directionally who is opaque versus transparent, but not the actual apples-to-apples deal
      economics that drive win-loss outcomes.
    diligencePath: >-
      Request current proposals, recent renewals, and side-by-side quote breakdowns from management or customer
      references.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: migration-data
    missingEvidence: >-
      Named customer migration or displacement case studies showing recent wins or losses between Insider and Braze,
      Klaviyo, Salesforce, or Adobe.
    whyItMatters: Without migration evidence, the moat and share-gain narrative remains plausible but not fully underwritten.
    diligencePath: >-
      Ask management for competitive takeout examples, churn reasons, and recent bake-off notes by deal size and
      segment.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP006
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Channel margins, referral economics, certification leverage, and SI attach rates by vendor.
    whyItMatters: >-
      Marketplace existence matters less than whether partners actually bring pipeline, implementation leverage, and
      retention support at scale.
    diligencePath: >-
      Request partner-sourced pipeline mix, SI dependency, and attach-rate data from Insider and comparable competitors
      where available.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: implementation-burden
    missingEvidence: >-
      Clean side-by-side benchmarks on services spend and time-to-value when moving from Salesforce or Adobe into
      Insider.
    whyItMatters: >-
      Switching-cost estimates are currently qualitative, which weakens precision on payback and implementation-risk
      modeling.
    diligencePath: >-
      Collect scoped migration estimates from system integrators and customers that have replaced incumbent suites with
      Insider.
    relatedQuestionRefs:
      - QP020
      - QP021
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: >-
      Current cash balance, monthly cash burn, runway months, and any debt or project-finance obligations are not
      disclosed in the reviewed public evidence.
    whyItMatters: >-
      Large equity rounds reduce financing risk, but they do not reveal how much capital remains or how quickly Insider
      consumes it through hiring, AI infrastructure, support, and acquisitions.
    diligencePath: >-
      Request monthly cash balances, last-12-month burn, forward budget, debt schedule, and management’s base / bear /
      bull runway scenarios after the 2024 Series E.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI006
      - TI007
  - type: private-evidence-only
    severity: blocking
    topic: revenue-margin
    missingEvidence: >-
      Official ARR, recognized revenue, gross margin, and contribution margin by product or channel are not available in
      reviewed public sources.
    whyItMatters: >-
      Without revenue and margin disclosure, the thesis rests on customer counts, message volumes, review scores, and
      fundraising rather than on actual cash-generation quality.
    diligencePath: >-
      Request monthly ARR or recurring revenue by segment, recognized revenue, gross margin by channel, and a bridge
      from subscription billings to recognized revenue.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI005
      - TI006
      - TI007
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-mix
    missingEvidence: >-
      Realized ASP, discounting policy, renewal uplifts, overage thresholds, module attach rates, and
      direct-versus-partner revenue mix are not publicly disclosed.
    whyItMatters: >-
      The public record shows how Insider sells, but not what customers actually pay after negotiation or how much of
      revenue comes from lower-margin channel-heavy workloads.
    diligencePath: >-
      Request pricing waterfall by cohort, MTAU band, and channel bundle, plus revenue mix by direct sales, partner
      sales, AI add-ons, and messaging-heavy contracts.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI001
