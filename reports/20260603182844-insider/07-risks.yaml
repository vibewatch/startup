    "number": 7,
    "title": "Risks",
    "summary": "Insider’s top public risks are not demand collapse but compliance, dependency, and execution compounding: messaging and AI workflows widen consent and transparency exposure, uptime and margins depend on third-party delivery and infrastructure vendors, and a heavily financed global expansion story is still under-disclosed on ARR, margin, concentration, incident history, and post-acquisition integration. Public mitigations are real—SOC 2 / ISO claims, mandatory 2FA, structured DPAs, and governed-data patterns—but they do not replace private diligence on reliability, AI governance, customer concentration, and unit economics."
  },
