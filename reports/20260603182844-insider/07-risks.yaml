    {
      "id": "platform-partner-and-concentration-risk",
      "title": "Cloud, platform, partner, and concentration risk",
      "body": "Insider’s dependency stack is deep enough to be a thesis variable in its own right. The subprocessor roster shows that customer geography and feature usage determine which vendors actually touch data, and it names an unusually wide set of messaging, cloud, CDN, identity, and database providers. SMS routing can vary by country, Meta sits in the WhatsApp delivery path, and even infrastructure is not fully uniform because Huawei Cloud is reserved for Turkey customers while AWS, Google Cloud, Cloudflare, Microsoft, and others appear elsewhere in the estate. The AI roadmap layers on more dependency. Insider’s 2026 OpenAI announcement makes clear that LLM capabilities now sit inside segmentation, content generation, journeys, shopping agents, and support agents, while OpenAI’s own subprocessor list adds Microsoft, AWS, Google Cloud, Cloudflare, and Snowflake underneath that layer. Distribution and ecosystem risk are visible too: Insider shows up in Shopify and AWS marketplaces, maintains broad technology partnerships, and relies on a formal partner program for GTM leverage. Customer-count disclosures lower pure logo-concentration fear, but public materials still do not disclose top-customer ARR or partner-sourced revenue concentration.",
