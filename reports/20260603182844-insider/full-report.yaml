      - number: '4.3'
        title: Cost structure and gross-margin drivers
        blocks:
          - type: paragraph
            body: >-
              Insider appears structurally more asset-light than a hardware or payments business, but it is not a
              zero-variable-cost software company either. Official contract language explicitly says prices may be
              adjusted when third-party providers such as SMS aggregators, cloud infrastructure vendors, data storage
              providers, and communication platforms raise their charges. That strongly suggests gross margin depends on
              channel mix and external vendor economics, especially for WhatsApp, SMS, and other communication-heavy use
              cases. At the same time, company and investor releases point to a sizeable fixed-cost base. BusinessWire
              and General Atlantic said Insider had a 350-plus in-house engineering team in late 2024, while subsequent
              releases highlight further AI, data, and product investment. Snowflake integration messaging focuses on
              avoiding duplicated storage and reducing data-movement cost, which supports the view that data
              infrastructure efficiency matters to Insider’s operating model. The Bluecore acquisition adds another
              layer: identity resolution and retail-event processing at 10 billion daily shopper events may strengthen
              product economics and cross-sell potential, but also adds integration cost and execution complexity. The
              likely margin profile is therefore mixed: healthy gross-profit potential on core software orchestration,
              but more variable pass-through and service-delivery leakage where communications, onboarding, migration,
              and AI workloads rise with usage.
