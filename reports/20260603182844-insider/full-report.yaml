      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is easy to articulate. Insider is visibly scaled, with public claims of more than 2,000
              customers, more than 1,500 team members, strong G2 standing, and an expanded U.S. retail footprint after
              acquiring Bluecore. The company has credible category proof: 97% willingness-to-recommend claims, a large
              archived G2 review base, and repeat messaging that 150 brands migrated from legacy marketing clouds.
              Bluecore adds more than 400 U.S. enterprise brands plus identity and shopper-data infrastructure, which
              sharpens the argument that Insider is building a broader agentic customer-engagement platform rather than
              a narrow campaign tool.


              The anti-thesis is that product proof is not the same thing as investable price proof. Archived G2
              evidence shows the platform still carries learning-curve, onboarding, support-resolution, and integration
              friction. More importantly, none of the public financing materials disclose audited ARR, churn, gross
              margin, burn, or the preference stack. That leaves investors trying to pay a premium multiple with only a
              third-party revenue estimate and qualitative product proof. In other words: the company-quality thesis can
              be true while the entry-price thesis is still too aggressive.
            claimRefs:
