      - number: '7.2'
        title: Operational, reliability, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Insider looks like a powerful but still implementation-heavy enterprise platform. The
              contract promises commercially reasonable 24/7 availability, yet the carve-outs are broad and explicitly
              include internet providers, third-party providers, hosting vendors, power failures, and denial-of-service
              attacks. That means a meaningful slice of runtime risk sits outside a simple “did Insider’s own code
              fail?” framing. Public user feedback reinforces the same point. G2’s archived pros-and-cons page reports a
              steep learning curve, time-consuming onboarding, slow support loops, and integration delays. Gartner adds
              a more account-management-oriented complaint about constantly changing advisors and unstable meeting
              schedules, while TrustRadius points to errors and bugs. Security posture is directionally better than many
              private SaaS peers: Insider publicly documents mandatory 2FA by default, SAML-based SSO, JIT and SCIM, and
              AWS-hosted regional storage. But those mitigations do not answer the diligence questions investors
              actually need answered: historical uptime, incident frequency, root-cause discipline, and how much
              operational load customer success must absorb to keep large deployments healthy after go-live.
