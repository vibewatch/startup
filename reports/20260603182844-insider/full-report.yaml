            body: >-
              The people and model risk is less about visible distress and more about how much complexity management is
              trying to absorb simultaneously. Series D and Series E materials describe a company that moved to unicorn
              status, expanded to 28 countries, grew its global team by 300%, planned further geographic investment, and
              intended to enlarge a 350-plus engineering organization while also pursuing strategic M&A.
              MARKETING-INTERACTIVE’s Singapore report adds another useful signal: aggressive regional hiring, including
              a planned 600% headcount increase. The Bluecore acquisition compounds this because it does not add a small
              feature; it adds 400-plus retail brands and a 10-billion-daily-event identity graph that now have to be
