      - number: '3.2'
        title: Capability overlap is high, but the center of gravity still differs
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is now substantial, but the center of gravity still differs by vendor. Braze remains
              the clearest mobile-first orchestration benchmark: public materials and reviews consistently emphasize
              real-time activation, Canvas journeys, segmentation depth, and AI decisioning, while its FY2026 results
              page shows continued enterprise momentum. Klaviyo starts from ecommerce email and SMS, but its 2026
              releases push further into customer-agent workflows, WhatsApp, RCS, on-site personalization, and
              retail-service automation, which narrows the breadth gap versus Insider even if the stack still feels
              commerce-first. Salesforce and Adobe win when governance, existing suite standardization, and enterprise
              process control matter most; both are powerful, but both inherit the complexity of bigger platforms.
              Bloomreach attacks from a different angle—product data, merchandising, and next-best-action depth—while
              Segment and mParticle stay closer to the data layer for teams that prefer composable execution. Insider
              therefore competes best when buyers want a marketer-facing bundled system rather than a best-of-breed
