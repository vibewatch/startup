      - number: '1.5'
        title: Milestones, Compliance Surface, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that kept widening scope after achieving unicorn status. Series D in
              2022 established Insider as a woman-led unicorn; Series E in 2024 pushed the capital base much higher and
              inserted General Atlantic board representation; the 2025 legal refreshes show a maturing
              enterprise-compliance stack; and 2026 acquisitions of MindBehind and Bluecore signal a clear move toward
              conversational and agentic customer engagement rather than just omnichannel marketing software. The legal
              surface is reasonably mature for a private SaaS company: Insider publishes a privacy notice, master
              subscription agreement, and DPA, and the DPA explicitly addresses processor duties and breach
              notification. The main diligence risk is not an obvious public blow-up but opacity. No public lawsuit or
              enforcement action surfaced in fetched materials, yet the company still lacks public disclosure on current
              valuation, ARR, pricing, debt, secondary liquidity, and the full board or control structure. Independent
              review friction and fragmented location/governance disclosure are therefore the more credible near-term
              risks than headline scandal.
