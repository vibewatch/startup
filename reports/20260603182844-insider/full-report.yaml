            - Cart reminders
            - Test-drive or lead-gen flows
            - Push notifications
          painpoint: Teams need measurable CVR / AOV / lead lift quickly to justify platform change.
          opportunity: Samsung, Vodafone, Toyota, Adidas, and Decathlon all publish KPI wins for first-wave use cases.
        - label: Expand across channels
          actor: Lifecycle / loyalty / product marketing teams
          touchpoints:
            - Architect journeys
            - Web Push
            - Email
            - Smart Recommender
            - Search / AI segmentation
          painpoint: Point tools create fragmented journeys and duplicated data work.
          opportunity: Case studies repeatedly show movement from one use case into broader cross-channel orchestration.
        - label: Operationalize enterprise program
          actor: Regional customer success and commercial owner
          touchpoints:
            - Quarterly business reviews
            - Optimization workshops
            - Migration playbooks
            - Enterprise support
          painpoint: Advisor continuity and support responsiveness can affect satisfaction.
          opportunity: >-
            97% willingness-to-recommend and enterprise rankings imply many accounts still see strong value after
            go-live.
        - label: Renew / deepen
          actor: Executive sponsor
          touchpoints:
            - Additional modules
            - AI roadmap
            - Global rollout across more teams / regions
          painpoint: Public evidence stops short of disclosed renewal or NRR proof.
          opportunity: >-
            Multi-module deployments and switching-cost proxies support expansion potential, pending private cohort
            data.
    claimRefs:
      - CU030
      - CU031
      - CU038
      - CU039
      - CU042
      - CU044
      - CU045
      - CU051
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      Official sources portray a repeatable motion from legacy-cloud or point-tool replacement into multichannel
      activation and broader enterprise rollout.
    approximationNotes: >-
      The flow is synthesized from migration disclosures, case studies, and review pages rather than a single process
      document.
    data:
      nodes:
        - id: proof
          label: Proof and procurement
          detail: Buyer validates the platform through G2, Gartner, official rankings, and named customer stories.
        - id: migration
          label: Migration / integration
          detail: >-
            Teams move off incumbent clouds or point tools using automatic migration, pre-built integrations, and local
            onboarding.
        - id: launch
          label: Launch first channel or use case
          detail: >-
            Common first wins center on web personalization, push, cart recovery, lead generation, or onsite
            experimentation.
        - id: optimize
          label: Optimize measurable KPI
          detail: Case studies highlight CVR, AOV, lead generation, ROI, and test-drive application improvements.
        - id: expand
          label: Expand into cross-channel orchestration
          detail: >-
            Customers add journeys, AI segmentation, recommendations, search, and more channels from the same data
            layer.
        - id: enterprise
          label: Enterprise rollout and renewal
          detail: >-
            The account becomes a broader enterprise platform decision with more regions, teams, and governance
            requirements.
      edges:
        - from: proof
          to: migration
          label: purchase / replace prior stack
        - from: migration
          to: launch
          label: go live quickly
        - from: launch
          to: optimize
          label: measure early KPI lift
        - from: optimize
          to: expand
          label: add modules and channels
        - from: expand
          to: enterprise
          label: roll out globally / deepen usage
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU039
      - CU050
      - CU051
