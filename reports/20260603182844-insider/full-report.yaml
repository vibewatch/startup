            body: >-
              Public sizing estimates are too inconsistent to support a single clean TAM, SAM, or SOM. The correct
              takeaway is not one precise number; it is that category shells range from narrow CDP to MMH to broad
              customer engagement, and Insider sits between them.
            calloutType: risk
            claimRefs:
