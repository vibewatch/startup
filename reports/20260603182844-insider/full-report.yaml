  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision flow from scale and product proof through pricing gap and disclosure gap to the recommended
      wait-or-reprice stance.
    data:
      nodes:
        - id: scale
          label: Scale proof
          type: input
          detail: 2,000+ customers, 1,500+ team members, Bluecore adds 400+ US brands
        - id: quality
          label: Quality proof
          type: process
          detail: 97% willingness to recommend and 1,349 archived G2 reviews support market traction
        - id: pricing
          label: Pricing gap
          type: process
          detail: Public-reference multiple ~13.3x vs roughly 1.1x–3.0x EV/Sales for listed peers
        - id: disclosure
          label: Disclosure gap
          type: process
          detail: No public ARR audit, margin bridge, burn profile, or preference waterfall
        - id: bull
          label: What must be true
          type: process
          detail: Revenue must prove out toward $300M+ and Bluecore must integrate well enough to sustain a premium multiple
        - id: decision
          label: 'Recommendation: wait / reprice'
          type: output
          detail: Proceed only with deeper private diligence or a materially lower entry price
      edges:
        - from: scale
          to: quality
          label: supports
        - from: quality
          to: pricing
          label: not sufficient on its own
        - from: pricing
          to: disclosure
          label: made worse by
        - from: pricing
          to: bull
          label: can only clear if
        - from: disclosure
          to: decision
          label: pushes to caution
        - from: bull
          to: decision
          label: defines upgrade path
    approximationNotes: >-
      The flow summarizes an IC logic chain rather than a deterministic model; each node compresses multiple public data
      points into a single gating judgment.
    claimRefs:
