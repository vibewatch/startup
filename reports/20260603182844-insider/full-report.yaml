  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and the right comparison set
        blocks:
          - type: paragraph
            body: >-
              Insider’s own 2026 product surfaces describe one integrated platform for marketing and customer engagement
              teams that combines customer data, personalization, AI, and channel execution. That framing makes the
              company broader than an ESP or a single-channel messaging tool, but still narrower than the entire
              marketing-technology universe. The cleanest standardized category match is multichannel marketing hubs: a
              platform layer that centralizes customer data and runs cross-channel campaigns across email, websites,
              mobile, and other owned channels. CDP and personalization are crucial enabling layers inside that shell,
              while broad customer engagement or martech categories are useful only as outer bounds because they pull in
              contact-center services, offline media, sales-enablement tooling, and other budgets Insider does not
              directly own. For underwriting, the practical question is not whether Insider participates in a very large
              digital-experience market in the abstract; it is which spend pools a buyer would realistically compare
              against Insider. That comparison set points to MMH, CDP, and personalization budgets first, with broader
              customer-engagement suites and stitched point-tool stacks as substitutes or adjacent shells.
            claimRefs:
