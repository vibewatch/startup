              Insider’s public scale narrative is no longer just logo-driven. Official 2024 financing materials already
              described 1,500+ customers, 28-country reach, and more than 1,100 team members; 2026 company and
              third-party review surfaces now use 2,000+ customers and roughly 1,500+ teammates as the headline scale
