      - number: '1.3'
        title: Funding History and Investor Map
        blocks:
          - type: paragraph
            body: >-
              Insider’s public financing history shows a long build from early venture rounds into late-stage growth
              capital. Crunchbase and Latka point to pre-seed, seed, Series A, Series B, and Series C rounds between
              2013 and 2020, followed by a 2022 Series D that publicly marked the company’s unicorn step-up at a $1.22
              billion valuation. A further venture round appears in 2023, and then the company announced a much larger
              $500 million Series E led by General Atlantic in November 2024. The strategic intent of that round was
              explicit: accelerate AI investment, deepen U.S. expansion, widen geographic operations, and reserve room
              for M&A. What remains missing is just as important as what is disclosed. Public materials do not show the
              post-Series-E valuation, shareholder ownership, liquidation structure, or any secondary activity, so the
              capital story is directionally impressive but still incomplete for underwriting control or entry price.
