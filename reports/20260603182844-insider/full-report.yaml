  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive frame and who actually shows up in the deal
        blocks:
          - type: paragraph
            body: >-
              The competitive field around Insider is not one clean peer set. Direct peers are vendors trying to sell
              bundled first-party data plus journey execution to the same marketing, CRM, or retention leader: Braze,
              Bloomreach, MoEngage, Netcore, and in many commerce-led evaluations Klaviyo. Incumbents Salesforce and
              Adobe still matter because they arrive with broader enterprise suites, large partner benches, and enough
              CDP or journey tooling to win platform-standardization budgets. Segment and mParticle are adjacent rather
              than clean like-for-like replacements, but they matter because they enable a composable path where a buyer
              separates data unification from execution. That split matters for Insider’s public position. Insider’s own
              surfaces still describe a broad stack—CDP, personalization, AI, journeys, and a heavy
              WhatsApp/email/web/app mix—so the strongest current wedge is enterprise commerce teams that prefer one
              bundled operating layer over a stitched stack. The risk is that almost every rival now claims some version
              of real-time AI, unified profiles, or journey automation.
