              broad enough to matter commercially because the company still markets 12+ channels, 100+ integrations,
              dedicated surfaces for web, app, email, SMS, WhatsApp, search, and recommendations, plus enterprise-scale
              volume claims around profiles, push, and email. The module map is therefore productively legible even if
              the exact commercial packaging of Predict, Sirius AI, or other sub-brands is still opaque in public
