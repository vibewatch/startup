chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Platform Scope
        blocks:
          - type: paragraph
            body: >-
              Insider is a private customer-engagement software company that now brands itself as the leading agentic
              customer engagement platform. Across the homepage and platform pages, the company describes one integrated
              system that combines a native CDP, personalization, journey orchestration, and AI-driven decisioning
              across WhatsApp, SMS, email, web, app, and site search. The company’s legal and physical footprint is more
              complicated than a single-city startup story: official contact and privacy materials point to Kağıthane,
              Istanbul as the legal controller base, while New York and San Francisco appear as prominent U.S. operating
              addresses and Crunchbase still lists New York as headquarters. For chapter-1 purposes, the best-supported
              read is an Istanbul-rooted company with a large U.S. commercial presence and a truly global office map.
              Public materials emphasize product breadth and scale, but they do not disclose public list pricing or a
              2026 ARR denominator, so the business model is clearly enterprise SaaS but the economic detail remains
              private.
            claimRefs:
