      - number: '4.2'
        title: Usage scale, customer traction, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public scale signals are much stronger than public financial statements. Insider’s current product pages
              describe a platform with more than 1 billion user profiles, roughly 40 billion push notifications per
              month, and about 1.6 billion emails per month. The company’s current marketing surface says it is trusted
              by 2,000-plus customers, while late-2024 investor announcements used a slightly older but still large
              1,500-plus customer figure. Public GTM signals also show a business that has moved well beyond
              startup-logo acquisition into enterprise replacement and expansion: Insider said it added 110-plus
              customers in Q3 2023, 200-plus enterprise brands over the prior year, and more than 150 enterprise
              migrations from legacy clouds in the 12 months before the May 2026 G2 release. G2’s review snapshot adds a
              helpful operating proxy by placing average implementation time at roughly three months. None of this gives
              CAC, payback, or net revenue retention directly, but it does show meaningful enterprise throughput and a
              repeatable implementation motion. The partner program and localized teams in dozens of countries reinforce
              a field-and-channel-assisted sales model rather than a pure product-led loop. For underwriting, that means
              the strongest public positives are adoption breadth, migration volume, and delivery scale; the weakest
              points are still conversion economics, realized ACV by segment, and cohort retention.
