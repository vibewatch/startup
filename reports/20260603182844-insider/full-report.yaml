      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The public record supports a six-founder origin story, and the strongest named operating leaders are still
              co-founders. Hande Cilingir is the clear central figure as CEO, with Serhat Soyuerel as CRO, Muharrem
              Derinkök as CPO, Mehmet Sinan Toktay as CTO, and Arda Koterin as chief customer officer; the 2022 unicorn
              release also names Okan Yedibela as VP of Engineering. This founder-heavy operating structure fits the
              company’s long product build-out and international expansion, but governance disclosure remains relatively
              thin for a business now measured in thousands of customers and employees. Series E added General Atlantic
              board representation, and company/investor materials market Insider as woman-founded and heavily
              female-led, yet the current full board roster, observer rights, and control provisions are not public.
              That combination makes founder continuity a strength, but also leaves real diligence work outstanding on
              board composition and investor governance rights.
