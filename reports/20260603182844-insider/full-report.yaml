        - Premium software multiple logic would collapse toward slower-growth public peers.
        - Treat as a valuation reset, not a minor diligence note.
      - - Bluecore integration misses
        - U.S. expansion stalls or Bluecore economics prove dilutive
        - The main 2026 upside catalyst would turn into execution drag.
        - Move to watchlist until integration KPIs recover.
      - - Comp multiple reset persists
        - Public peer EV/Sales stays below ~5x while Insider still seeks $2B+
        - Entry pricing would remain detached from the public market clearing range.
        - Do not chase the round on narrative alone.
      - - Preference overhang worsens
        - New capital introduces heavy seniority, participation, or ratchets
        - Common-equity upside could compress even if enterprise value holds.
        - Require full waterfall modeling before proceeding.
