          - type: callout
            title: Privacy, integration, and low utilization can slow real adoption
            body: >-
              The adoption story is not frictionless. Privacy laws, platform changes, legacy integration work, and low
              post-purchase utilization all show up repeatedly in retained sources, which means growth can lag top-line
              market forecasts if customers cannot operationalize the stack.
            calloutType: risk
            claimRefs:
