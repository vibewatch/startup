      - number: '3.5'
        title: Moat durability is plausible, but public adverse evidence is mostly economic and operational
        blocks:
          - type: paragraph
            body: >-
              Insider’s moat is best understood as bundled execution convenience, not as exclusive ownership of AI, CDP,
              or journey concepts. The direct peers now all market some combination of unified profiles, real-time
              segmentation, AI decisioning, or cross-channel automation, which makes commoditization risk real. The
              adverse evidence is mostly operational and economic rather than regulatory. Braze users complain about
              separate fees and forecasting uncertainty; Klaviyo users complain that costs rise with list size;
              Salesforce users complain about technical burden, modular licensing, and high cost; Segment users warn
              that event-volume pricing and taxonomy mistakes can become expensive; and MoEngage users flag slow
              analytics on large datasets. Insider’s public defense is still credible when a buyer wants WhatsApp-heavy
              enterprise commerce orchestration and prefers one vendor to a stitched stack. But the competitive pressure
              is visible from both sides: Klaviyo owns transparent commerce onboarding, Braze owns more disclosed
              enterprise scale, and Salesforce and Adobe still own the deepest incumbent channel access. Without private
              win-loss and renewal data, moat durability should be treated as plausible rather than proven.
