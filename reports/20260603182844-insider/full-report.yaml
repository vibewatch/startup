      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes the public revenue estimate is conservative, Bluecore integrates cleanly, and
              Insider compounds toward roughly $300 million to $320 million of revenue over the next several years while
              retaining a premium software-style multiple. On those assumptions, a 10x to 12x exit multiple supports
              around $3.0 billion to $3.8 billion of value. That can produce a positive outcome from a $2B+ reference
              entry, but it requires both operational execution and proof that Insider deserves a valuation framework
              much richer than listed peers.


              The base case is less forgiving and more useful. If Insider reaches only around $220 million of revenue
              and exits at 6x to 8x revenue, fair value lands near $1.3 billion to $1.8 billion. That is around or below
              the current public price reference and does not offer compelling upside before dilution. The bear case is
              worse: if revenue stays closer to $150 million to $180 million and the market applies only a 4x to 5x
              multiple, value compresses toward $0.6 billion to $0.9 billion. Because preference terms are undisclosed,
              actual downside to common-equity holders could be worse than this simple public-case math.
            claimRefs:
