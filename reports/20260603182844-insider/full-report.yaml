      - number: '2.2'
        title: Sizing lenses, contradictory estimates, and why one TAM number would mislead
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a real and growing category opportunity, but not a single settled number.
              Broad customer engagement platforms reach tens of billions of dollars, multichannel marketing hubs land in
              the high single-digit billions, and narrow CDP estimates cluster around the mid-single-digit billions.
              Then the picture widens again because some CDP analysts include broader campaign, analytics, composable,
              and service layers, producing 2025-2026 starting points closer to $8-10 billion. That is not just forecast
              noise. It is a taxonomy problem. Some publishers are effectively measuring the core unified-data layer,
              others are measuring a larger engagement-data shell, and still others are measuring an even wider
              customer-experience or martech environment. For Insider, the right reading is that the company addresses a
              meaningful but layered market where the nearest comparable shell is smaller than broad CEP or martech
              headlines and larger than the narrowest CDP definition. Public evidence is strong enough to bound the
              category and preserve estimate dispersion, but not strong enough to publish a clean Insider-specific TAM,
              SAM, or SOM without management data.
