      - number: '3.3'
        title: Pricing transparency is one of the cleanest competitive separators
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging remain one of the cleanest competitive separators. Klaviyo is the outlier: it
              publishes self-serve entry pricing, exposes profile and message limits, and benefits from a Shopify
              distribution motion that makes evaluation easy for smaller brands. Segment and Salesforce also expose at
              least some public entry guidance through public surfaces, but the economics still become custom once
              deployment grows. By contrast, Insider, Braze, Adobe, Netcore, and most enterprise suites still make
              buyers negotiate around active users, channels, credits, implementation, and support. Braze is unusually
              explicit about the logic of its model—platform edition, active users, and flexible credits—but not about a
              public sticker price. Insider’s pricing remains similarly usage-led and mostly opaque, with third-party
              buyers describing heavy negotiation around MTAU, channels, and contract length. That matters because
              public transparency can pull smaller commerce buyers away from Insider before a live sales process starts,
              even when Insider’s eventual functional scope is broader.
