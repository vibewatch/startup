      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Retained evidence points to a buyer group that is more complex than “the marketing team” but still
              anchored in customer engagement outcomes. Shopify, Insider’s own materials, and G2 reviews show the
              platform being used by CRM, lifecycle, loyalty, growth, and marketing operators who need to coordinate
              journeys across web, app, SMS, email, and WhatsApp from one place. Yet budget ownership is often shared:
              CDP research says buying groups now span two or three functions and that customer data commonly sits under
              IT, while Gartner’s budget guidance emphasizes cross-functional collaboration and internal proof of value.
              That means the economic buyer may be a lifecycle or commerce leader, but the payer often includes IT or
              data leadership. Adoption also appears staged rather than instantaneous. G2’s average implementation time
              is about three months, reviewers call out learning curves for advanced functionality, and smaller buyers
              mention technical-resource demands and unclear pricing. The likely motion is a focused pilot around one or
              two high-value journeys, then broader rollout once unified profiles and orchestration prove their
              operational and revenue value.
