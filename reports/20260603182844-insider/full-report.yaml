      - number: '3.4'
        title: Distribution power and switching cost shape who can actually move budgets
        blocks:
          - type: paragraph
            body: >-
              Distribution power does not come only from product quality. Klaviyo’s Shopify gravity is obvious in its
              app-store review volume; Braze now has a documented Shopify app and standard setup path; Salesforce and
              Adobe benefit from formal marketplaces and large partner benches; and mParticle and MoEngage both market
              co-sell or partner ecosystems designed to extend reach. Insider’s own Shopify listing proves it has real
              commerce distribution, but the public footprint is far smaller than Klaviyo’s and the ecosystem proof is
              thinner than Salesforce or Adobe. Once installed, switching cost is meaningful. Braze’s Shopify docs show
              workspace decisions, event mappings, and custom theme work; Segment reviewers note that event-taxonomy
              mistakes become expensive over time; Salesforce users still complain about SQL and AMPscript burden.
              Buyers can multi-home—especially with a CDP plus separate execution tools—but doing so raises integration,
              governance, and services costs. Insider’s lock-in is therefore real, yet not absolute: ecosystems and
              composable architectures keep exit paths open for teams willing to rewire data and workflows.
