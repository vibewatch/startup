      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public capital evidence is far clearer than public operating economics. Insider’s 2022 Series D raised
              $121 million at a $1.22 billion valuation, and a 2023 company release said a more recent investment of up
              to $105 million brought total disclosed funding to $274 million before the next large step-up. In late
              2024, General Atlantic and BusinessWire reported a $500 million Series E, with proceeds targeted at AI and
              product development, talent growth, geographic expansion, and strategic M&A. Taken together, those
              disclosures support a public minimum cumulative equity funding figure of roughly $774 million without
              reproducing the full historical round chronology from Company Overview. That is a substantial capital
              buffer for a software company. The open question is not whether Insider has raised enough money to matter;
              it is how much of that capital remains, how fast it is consumed, and how much acquisition-led expansion
              changes the burn profile. The available filing-style entity evidence is thin: the Singapore registry
              profile confirms a live local company with SGD 50,000 paid-up capital, but it does not provide the group
              cash position, leverage, or operating statements. So capital adequacy looks directionally strong, while
              runway still depends on undisclosed spending pace and balance-sheet data.
