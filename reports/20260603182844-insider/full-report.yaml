  - id: TI007
    title: Public financial gaps and adverse signals table
    columns:
      - Gap or risk
      - What public sources do say
      - Why it matters
      - Adverse signal
      - Exact diligence path
    rows:
      - - ARR / recognized revenue
        - No official public figure in reviewed sources
        - Revenue scale drives valuation discipline and GTM efficiency analysis
        - Public narrative is strong but revenue remains private
        - Request monthly and annual recurring revenue bridge by segment
      - - Gross margin / contribution margin
        - Pass-through cost logic is visible, realized margin is not
        - Channel-heavy enterprise software can hide materially different economics by product line
        - Third-party messaging and cloud cost exposure is real
        - Request gross margin waterfall by product and channel
      - - Cash / burn / runway
        - Large capital raises are public; balance-sheet usage is not
        - Runway is impossible to size without burn pace
        - Capital adequacy may look stronger than actual remaining runway
        - Request monthly cash balances, burn, and scenario runway
      - - Direct vs partner / module revenue mix
        - Partner program and channels are public, mix is not
        - Mix affects seasonality, margin, and concentration risk
        - Could hide lower-margin messaging-heavy business lines
        - Request revenue by direct, partner, AI, and channel family
      - - Pricing opacity
        - Custom quote model, opaque negotiations, and small-buyer transparency concerns
        - Hard to benchmark realized ASP and discount discipline
        - Spendbase and review sources flag negotiation-heavy buying
        - Request pricing waterfall, discount policy, and renewal uplift caps
      - - Onboarding and integration friction
        - G2 and Gartner cite steep learning curve and operational friction for some users
        - Can raise implementation cost and slow time-to-value
        - Could increase customer acquisition friction or churn risk
        - Request onboarding hours, support tickets, and failed-implementation rate
      - - Support quality and invoice friction
        - G2 and TrustRadius note support, bug, and invoice issues in some cases
        - Service inconsistency can erode retention and working-capital efficiency
        - Adverse but not thesis-breaking without frequency data
        - Request gross churn by service issue, plus billing-dispute incidence
    notes: >-
      This table captures the blockers that still separate visible commercial scale from a full valuation-grade
      financial underwrite.
