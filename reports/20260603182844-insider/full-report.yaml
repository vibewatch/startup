            title: Budget ownership is a committee problem, not just a marketing decision
            body: >-
              The relevant buyer is usually cross-functional. Marketing and CRM teams feel the pain, but IT and data
              teams often control the systems of record, while executive scrutiny forces every platform purchase to show
              measurable value.
