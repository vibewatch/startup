            body: >-
              Public trust materials are more substantial than typical marketing-security boilerplate. Insider’s DPA and
              Trust Center clearly frame Insider as processor and the customer as controller, publish a subprocessor
              roster, and point to region-specific data handling. The Trust Center also claims SOC 2 Type II, ISO
              27001:2022, an ePrivacy Seal, HIPAA compliance, and BAA availability. On the control side, the Academy
              docs describe SAML-based SSO, JIT and SCIM provisioning, and default-mandatory 2FA unless SSO is enabled.
              Channel guides further require explicit consent fields for SMS and WhatsApp, and web push setup documents
              SSL, service-worker, and file-path failure modes. The main caveat is scope. Public documentation is much
              stronger on account security, contractual processing, and consent capture than on product-wide model
              governance for the newer agentic layer. Insider does publish a narrow no-AI-training commitment for
              MindBehind messaging content, and the current DPA now defines AI Systems and AI Outputs, but buyers still
              need a fuller enterprise security review for retention, prompt logging, tenant isolation, and incident/SLA
