  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, and AI-compliance risk
        blocks:
          - type: paragraph
            body: >-
              Insider’s highest-severity public risk is regulatory and privacy compounding rather than obvious demand
              collapse. The platform’s own documentation shows that SMS and WhatsApp execution require collecting phone
              numbers, explicit channel opt-ins, and GDPR-related flags, while the DPA adds formal AI Systems, AI
              Outputs, controller-processor allocation, subprocessors, and cross-border transfer mechanics to the legal
              surface. That matters because Insider is not a single-channel email tool anymore; it is a
              multi-jurisdiction engagement layer spanning SMS, WhatsApp, email, web, app, and now conversational
              agents. External rule sets are tightening at the same time. FCC guidance still requires written consent
              for commercial texts, the ICO’s April 2026 PECR guidance emphasizes consent and soft-opt-in boundaries for
              electronic marketing, and the EU AI Act’s transparency obligations begin biting in August 2026 for
              chatbot-like interfaces. Insider does have visible mitigations through its DPA, Trust Center, and
              compliance certifications, but those are framework disclosures rather than jurisdiction-by-jurisdiction
              proof that every live messaging and AI workflow is configured correctly in every market.
