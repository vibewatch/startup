      - number: '4.5'
        title: Adverse signals and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The main financial risk is not obvious demand weakness; it is opacity. Public review and buyer commentary
              suggests Insider is powerful but can be costly and operationally heavy for buyers who enter without strong
              internal preparation. G2’s pros-and-cons snapshot highlights a steep learning curve, time-consuming
              onboarding, support and integration issues, and even invoice friction. Gartner includes at least one
              explicitly critical review centered on advisor churn and unstable meeting schedules. TrustRadius adds
              smaller but still relevant execution complaints around bugs, attention to detail, and support quality.
              Research.com and Spendbase both reinforce the pricing side of the risk: there is no public pricing page,
              smaller budgets may struggle with fit, and the real commercial outcome depends on negotiation leverage,
              contract length, volume assumptions, and hidden cost drivers such as channels or integrations. Against
              that backdrop, the decisive diligence blockers remain unchanged. Public sources reviewed do not disclose
              ARR, recognized revenue, gross margin, cash balance, burn, runway, or direct-versus-partner revenue mix.
              The balanced verdict is therefore that Insider looks like a scaled and well-capitalized enterprise SaaS
              platform, but public evidence still stops short of supporting a valuation-grade underwrite of unit
              economics or financing dependency.
