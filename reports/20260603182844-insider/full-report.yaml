      - number: '5.5'
        title: Differentiation, moats, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Insider’s differentiation claim is strongest when framed as a closed-loop operating model rather than a
              single standout feature. The company combines native customer-data infrastructure, cross-channel
              orchestration, search and recommendation, and now agentic interfaces inside one stack, then reinforces
              that story with a broad partner ecosystem and a visible developer surface. The Snowflake integration
              strengthens the case for warehouse-native activation without duplicated data, and the Bluecore acquisition
              adds a more concrete data moat by bringing a retail identification graph that processes 10 billion daily
              shopper events and already serves hundreds of enterprise brands. Product chronology also shows real
              movement: the 2023 release bundled Integration Hub, WhatsApp Commerce, and personalized search; 2025 added
