          - type: callout
            title: Bull upside needs much more than narrative
            body: >-
              The upside case works only if revenue is materially above the public estimate, Bluecore integration is
              accretive, and Insider proves it deserves a premium multiple despite public-comp compression.
            calloutType: assumption
