      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated vendors benefit from category convergence
            body: >-
              The strongest structural tailwind for Insider is that buyers increasingly want data, orchestration,
              personalization, and channel execution in one operating layer. That is exactly the direction competitor
              disclosures from Twilio, Braze, and Insider itself describe.
            calloutType: insight
