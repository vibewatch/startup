  - id: TI007
    title: 公开财务缺口与反向信号表
    columns:
      - 缺口或风险
      - 公开资料已说明什么
      - 重要性
      - 反向信号
      - 具体尽调路径
    rows:
      - - ARR / 确认收入
        - 已审阅资料未见官方公开数字
        - 收入规模决定估值纪律和 GTM 效率分析
        - 公开叙事很强，但收入仍未披露
        - 索取按细分市场划分的月度与年度经常性收入桥表
      - - 毛利率 / 贡献毛利率
        - 转嫁成本逻辑可见，实际利润率不可见
        - 渠道占比高的企业软件可能掩盖产品线之间截然不同的经济模型
        - 第三方消息和云成本敞口是真实风险
        - 索取按产品和渠道划分的毛利率瀑布
      - - 现金 / 烧钱 / 现金跑道
        - 大额融资公开，但资产负债表资金使用不公开
        - 缺少烧钱速度，无法测算现金跑道
        - 资本充足性可能看起来强于实际剩余现金跑道
        - 索取月度现金余额、烧钱速度和情景现金跑道
      - - 直营 vs 合作伙伴 / 模块收入组合
        - 合作伙伴计划和渠道公开，但收入组合不公开
        - 组合影响季节性、利润率和集中度风险
        - 可能隐藏毛利较低、消息渠道占比高的业务线
        - 索取按直营、合作伙伴、AI 和渠道家族划分的收入
      - - 定价不透明
        - 定制报价模式、谈判不透明，小买家担心透明度
        - 难以对标实际 ASP 和折扣纪律
        - Spendbase 和评测资料提示采购谈判较重
        - 索取价格瀑布、折扣政策和续约涨价上限
      - - 上线与集成摩擦
        - G2 和 Gartner 提到部分用户学习曲线陡、运营摩擦大
        - 可能抬高实施成本，并拉长价值兑现时间
        - 可能增加获客摩擦或流失风险
        - 索取上线人时、支持工单和实施失败率
      - - 支持质量与发票摩擦
        - G2 和 TrustRadius 记录了部分案例中的支持、bug 和发票问题
        - 服务不稳定会侵蚀留存和营运资本效率
        - 属于反向信号，但没有频率数据时尚不足以击穿投资逻辑
        - 索取按服务问题划分的总流失率，以及账单争议发生率
    notes: 该表梳理了仍把可见商业规模与完整估值级财务判断隔开的障碍。
