      - number: '7.2'
        title: 运营、可靠性与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Insider 是一个能力强、但仍很依赖实施的企业平台。合同承诺商业上合理的 24/7
              可用性，但免责范围很宽，明确包括互联网提供商、第三方提供商、托管供应商、电力故障和拒绝服务攻击。这意味着相当一部分运行时风险不适合简单归入「是不是 Insider 自己的代码坏了」。公开用户反馈也指向同一点。G2
              归档的优缺点页面提到学习曲线陡峭、上线耗时、支持响应周期长和集成延迟。Gartner 又补充了更偏客户管理的抱怨：顾问持续更换、会议安排不稳定；TrustRadius 则指向错误和 Bug。安全态势好于许多私有
              SaaS 同行：Insider 公开记录了默认强制 2FA、基于 SAML 的 SSO、JIT 与 SCIM，以及 AWS
              托管的区域存储。但这些缓释措施没有回答投资人真正需要的尽调问题：历史正常运行时间、事故频率、根因复盘纪律，以及大型部署上线后，客户成功团队需要吸收多少运营负荷才能保持健康运行。
