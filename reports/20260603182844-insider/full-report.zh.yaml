  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Insider 的公开变现架构像典型企业 SaaS，但比自助软件工具更受用量影响，价格透明度也更低。公司把买方导向演示和订单合同，而不是公开
              结账流程；独立评论页同样把定价描述为定制、基于订阅，而非固定标价套餐。当前主订阅协议让底层合同形态更清楚：费用与购买的订阅挂钩，超额用量可以按季度后付计费，SMS
              聚合商、云厂商、数据存储或通信平台等第三方供应商涨价时，费用也可上调。这意味着 Insider
              变现的不是单一软件席位数。经济模型很可能把基础平台承诺、渠道和模块扩张，以及与数据规模和消息强度相关的超额或转嫁项组合在一起。Spendbase
              的采购指南不是公司确认的价格，但它是有用代理，因为它与官方产品设计一致：MTAU 或客户基数、启用渠道、集成、支持和合同期限都会影响 ACV。尽调含义很直接：标价发现很差，但商业模型足够可读，可以精准索要
              MTAU 档位、渠道挂载率、超额阈值、折扣政策和续约机制。
