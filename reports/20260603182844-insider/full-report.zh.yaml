      - number: '8.4'
        title: 可比估值基准
        blocks:
          - type: paragraph
            body: >-
              上市可比图景并不轻松。Braze、Klaviyo、HubSpot 和 Sprinklr 在收入、留存和利润率上的披露都比 Insider 更新、更完整，但交易 EV/sales 水平都显著低于 Insider
              的公开参照倍数。Braze 和 Klaviyo 仍展现出耐久增长和强净留存指标，HubSpot 展示规模与盈利能力改善，Sprinklr
              则为增长较慢的企业互动软件提供较低倍数地板。除非管理层能拿出显著高于公开估计的私人指标，否则这组上市公司会让 Insider 隐含 13.3 倍收入倍数看起来偏贵。


              私有和 M&A 参照有助于定义天花板，而不是基准情景。Bloomreach 2022 年 $2.2B 融资及随后披露的 $260M ARR 表明，顶级私有 martech
              资产在规模证据更充分时可以拿到溢价价格。Twilio-Segment 和 Adobe-Marketo 等战略交易也说明，客户数据和互动资产在合适市场中可以完成两位数收入或 ARR
              倍数。但这些交易是战略控制权结果，不是常规少数股权融资。它们支持上行可选性，并不能单独支撑今天的公允价值。
