  - id: TP001
    title: 竞争对手画像表
    columns:
      - 供应商
      - 品类
      - 2026 规模 / 融资信号
      - 目标细分市场
      - 产品范围
      - 关键限制
    rows:
      - - Insider
        - 直接捆绑型同行
        - 私有公司；Shopify 列表称有 2,000+ 客户
        - 中端市场到企业级商务和生命周期团队
        - 集成 CDP、个性化、AI、旅程、WhatsApp、电子邮件、Web、App、站内搜索
        - 定价不透明，公开规模披露少于 Braze 或 Klaviyo
      - - Braze
        - 直接捆绑型同行
        - 上市公司；FY2026 收入 $738.2M，客户 2,609 家
        - 企业级和 App 优先的 B2C 品牌
        - 实时编排、分群、移动 / App 内、AI 决策
        - 定价和上手复杂；单独点数和附加组件可能影响成本
      - - Klaviyo
        - 商务主导的直接同行
        - 上市公司；FY2025 收入 $1.234B，客户 193,000+ 家
        - 从 SMB 到中端市场，并向上进入大客户的商务客户
        - 电子邮件、SMS、WhatsApp/RCS、零售 CRM、站内和支持自动化
        - 联系人列表成本会爬升，企业级广度较窄
      - - Salesforce Marketing Cloud
        - 既有套件
        - 大型上市既有厂商；评论页面可见公开入门指引
        - 标准化在 Salesforce 上的大型企业
        - Agentforce 营销、Data 360 CDP、分析、忠诚度、对话式营销
        - SQL 或 AMPscript 负担、模块复杂度、技术栈依赖
      - - Adobe Journey Optimizer + RTCDP
        - 既有套件
        - 大型上市既有厂商；企业销售以定制报价为主
        - 中端市场和企业级 Adobe 存量客户
        - 治理要求重的 RTCDP，加旅程编排和 Web 个性化
        - 需要 Adobe Experience Platform，也更依赖既有技术栈契合
      - - Bloomreach
        - 商务挑战者
        - 私有公司；公开话术围绕 Loomi AI 和商品运营深度
        - 中端市场和企业级商务
        - 客户和产品数据、下一步最佳动作、分析、推荐
        - 公开自助定价少，规模披露也较薄
      - - Twilio Segment
        - 邻近替代品
        - 公开定价页显示 25,000+ 家公司；按 MTU 计费
        - 数据成熟、在搭建可组合技术栈的团队
        - 数据管道、统一画像、受众、旅程、700+ 个 App
        - 通常仍需要单独的执行深度，事件成本也可能上升
      - - MoEngage
        - 直接区域和移动挑战者
        - 1,350+ 品牌，可见增长 / 企业级打包
        - 需要实时 App / Web 互动的营销人员和产品团队
        - 跨渠道旅程、AI 智能体、分析、交易提醒
        - 评论里仍会出现分析和事件治理摩擦
      - - Netcore
        - 直接挑战者
        - 私有公司；官方话术称 AI 原生编排覆盖 13+ 渠道
        - 企业级电商和 WhatsApp 重度品牌
        - 全渠道互动、AI 智能体、企业商务重点
        - 公开证据重度依赖卖方撰写的对比，而非披露的经济数据
      - - mParticle
        - 邻近 CDP 替代品
        - $300M 交易后由 Rokt 支持
        - 想要实时和可组合 CDP 的企业品牌
        - 混合 CDP、治理、Snowflake 原生数据层、合作伙伴生态
        - 原生营销执行不如一体化套件完整
    notes: 画像表混合使用已披露收入或客户指标与定位信号，因为私有同行不会发布可比财务细节。
