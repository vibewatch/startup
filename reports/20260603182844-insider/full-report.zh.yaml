      - number: '6.4'
        title: 集中度风险与待补尽调问题
        blocks:
          - type: paragraph
            body: >-
              从 Logo 看，集中度叙事方向上令人放心；从经济性看，证据仍弱。已披露的 2,000+ 客户、覆盖 Fortune 500 三分之一，以及零售、汽车、旅行、电信、媒体、保险等行业的可见分布，都不支持极端
              Logo 集中的担忧。但公开材料没有披露前 10 大客户 ARR
              占比、企业与中端市场收入拆分、主要合作伙伴来源、按队列划分的模块挂载率，或按地区划分的队列留存。因此，当前最好的公开证据证明的是部署广度，而不是收入耐久性。短期最可能出现的尽调问题也会偏经济性，而不是营销叙事：有多少
              ARR 集中在少数战略性全球账户中，多少 ARR 绑定了多产品部署，近期 150
              个品牌迁移潮是在客户内部扩张，还是主要以一个供应商替换另一个供应商，以及维持高接触企业部署需要多少客户成功带宽。投资人应把本章公开材料视为真实生产使用和竞争赢单能力的强证明，但不能拿它替代客户队列承销。
