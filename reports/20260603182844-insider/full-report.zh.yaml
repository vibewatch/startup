        title: 用量规模、客户牵引与销售效率代理
        blocks:
          - type: paragraph
            body: >-
              公开规模信号远强于公开财务报表。Insider 当前产品页描述的平台拥有超过 1 billion 用户画像、每月约 40 billion 条 推送通知、每月约 1.6 billion
              封电子邮件。公司当前营销界面称其获得 2,000+ 客户信任，而 2024 年末投资人公告使用的是稍旧但仍很大的 1,500+ 客户数字。公开 GTM
              信号也显示，这家公司已经远超新客户获取阶段，进入企业替换和扩张：Insider 称其在 2023 年 Q3 新增 110+ 客户，在此前一年新增 200+ 企业品牌，并在 2026 年 5 月 G2 发布前的
              12 个月里完成超过 150 个从传统营销云迁移来的企业迁移。G2 的评论快照提供了有用运营代理，显示平均实施时间约三个月。这些都没有直接给出
              CAC、回本周期或净收入留存，但确实显示了有分量的企业吞吐量和可重复实施动作。伙伴计划和几十个国家的本地化团队强化了现场销售与渠道辅助的销售模型，而非纯产品驱动循环。承销时，最强的公开正面证据是采用宽度、迁移量和交付规模；最弱点仍是转化经济性、各细分的实际
