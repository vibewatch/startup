chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与平台范围
        blocks:
          - type: paragraph
            body: >-
              Insider 是一家私营客户互动软件公司，如今把自己定位为领先的智能体客户互动平台。公司主页和平台页都在描述一套整合系统：原生 CDP、个性化、旅程编排和 AI 驱动决策，覆盖
              WhatsApp、SMS、电子邮件、网页、App 和站内搜索。公司的法律与实体版图比“单城创业公司”故事复杂：官方联系和隐私材料指向 Istanbul Kağıthane 作为法律控制者所在地，而 New
              York 和 San Francisco 是醒目的美国运营地址，Crunchbase 仍把 New York 列为总部。就第 1 章而言，证据最能支撑的判断是：这是一家植根
              Istanbul、在美国拥有庞大商业存在、办公室地图真正全球化的公司。公开材料强调产品宽度和规模，但不披露公开标价或 2026 ARR 分母，因此商业模式显然是企业 SaaS，经济细节仍属私有。
