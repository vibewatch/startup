              公开记录支持六名联合创始人的起源叙事，最强的实名运营领导者仍是联合创始人。Hande Cilingir 作为 CEO 是明确的核心人物，Serhat Soyuerel 任 CRO，Muharrem
              Derinkök 任 CPO，Mehmet Sinan Toktay 任 CTO，Arda Koterin 任首席客户官；2022 年独角兽公告还列出 Okan Yedibela
              为工程副总裁。这种创始人浓度很高的运营结构，契合公司长期产品扩展和国际化扩张，但对一家客户和员工都以千计的企业而言，治理披露仍相对稀薄。Series E 引入 General Atlantic
              董事会席位，公司和投资人材料把 Insider
              包装为由女性创立且女性领导层占比很高，但现任完整董事会名单、观察员权利和控制条款并未公开。组合起来看，创始人连续性是优势，但董事会构成和投资人治理权利仍需要实质尽调。
