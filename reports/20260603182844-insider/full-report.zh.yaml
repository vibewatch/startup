      - number: '5.4'
        title: 信任、安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              公开信任材料比典型营销安全样板更实在。Insider 的 DPA 和 Trust Center 清楚把 Insider 定位为处理者、客户定位为控制者，发布子处理者名单，并指向分区域数据处理。Trust
              Center 还声称 SOC 2 Type II、ISO 27001:2022、ePrivacy Seal、HIPAA 合规和 BAA 可用。在控制侧，Academy 文档描述了基于 SAML 的 SSO、JIT
              和 SCIM 自动开通，以及除非启用 SSO 否则默认强制 2FA。渠道指南进一步要求 SMS 和 WhatsApp 的明确同意字段，网页推送设置文档则列出 SSL、service worker 和文件路径
              失效模式。主要保留项 是范围。公开文档在账户安全、合同处理和同意捕获上强得多；对较新的智能体层，产品级模型治理披露弱得多。Insider 对 MindBehind 消息内容发布了狭窄的“不用于 AI
              训练”承诺，当前 DPA 也定义了 AI Systems 和 AI Outputs，但买方仍需要更完整的企业安全审查，覆盖留存、提示词日志、租户隔离和事件 / SLA 历史。
