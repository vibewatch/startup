  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争框架，以及交易中真正出现的对手
        blocks:
          - type: paragraph
            body: >-
              Insider 周围的竞争场不是一组干净的同行。直接同行是那些试图向同一批营销、CRM 或留存负责人销售“一方数据 +
              旅程执行”捆绑方案的厂商：Braze、Bloomreach、MoEngage、Netcore，以及在许多电商主导评估里的 Klaviyo。既有巨头 Salesforce 和 Adobe
              仍然重要，因为它们带着更宽的企业套件、大型伙伴团队，以及足够的 CDP 或旅程工具进入，能赢下平台标准化预算。Segment 和 mParticle
              是相邻玩家，不是完全同类替代，但它们重要，因为它们提供可组合路径，让买方把数据统一和执行拆开。这种拆分关系到 Insider 的公开定位。Insider
              自己的界面仍在描述一个宽栈——CDP、个性化、AI、旅程，以及很重的 WhatsApp/电子邮件/网页/App 组合——因此当前最强切口是偏好一套捆绑运营层、而不是拼接栈的企业电商
              团队。风险在于，几乎每个对手现在都声称自己拥有某种实时 AI、统一画像或旅程自动化。
