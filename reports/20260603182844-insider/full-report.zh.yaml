  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计 ARR 与收入桥
        - 2024-2026 经审计 ARR、收入、递延收入和签约额走表
        - 验证公开 $150M 估计是保守还是已经过时。
        - 财务数据室；CFO 和外部审计师。
      - - 毛利率、烧钱速度和现金跑道
        - 按产品线拆分的毛利率、现金消耗和现金跑道
        - 判断溢价软件倍数是否站得住。
        - 财务数据室；董事会材料和月度 KPI 包。
      - - 股权结构表与瀑布
        - 最新股权结构表、Series E 文件、优先权堆叠、反稀释棘轮和按比例认购权
        - 没有这些，下行和稀释无法建模。
        - 公司法律顾问和领投方法律摘要。
      - - 留存与集中度
        - NRR、总流失、扩张 ARR 和头部客户集中度
        - 区分可持续 SaaS 增长和客户流失风险。
        - 收入运营导出和客户队列复盘。
      - - Bluecore 经济性
        - 收购价、整合成本、收入组合和协同目标
        - 2026 年主要叙事催化剂可能增厚，也可能摊薄。
        - 并购工作流、整合 PMO 和经营模型。
      - - IPO 准备包
        - 审计师准备度、法律结构、报告控制和投行准备
        - 检验退出准备是真实存在，还是仍停留在叙事。
        - CEO/CFO 尽调会议，加外部法律顾问备忘录。
    notes: 前四行是承诺投资前的拦路项；Bluecore 经济性和 IPO 准备度决定简单持有或放弃之外是否还有上行。
