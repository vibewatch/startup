        - 处理方 / 控制方责任划分、GDPR/CCPA 条款、子处理方传导、泄露通知
        - 为企业尽调设定合同隐私基线
        - 需要最近签署的企业版修订稿，以及 SCC 附件处理方式
      - - 子处理方名录
        - 已发布
        - 托管、消息、分析、安全，以及按区域交付的供应商
        - 外部依赖图谱可审计
        - 未按依赖项公开可用时间或事故历史
      - - SOC 2 Type II
        - Trust Center 声称
        - 安全、可用性、处理完整性、保密性、隐私
        - 标准企业保障信号
        - 报告本身需签 NDA 或申请后才能获取
      - - ISO 27001:2022
        - Trust Center 声称
        - 信息安全管理体系
        - 说明治理正式化，控制项有人维护
        - 公开材料引用了证书，但运营指标未公开
      - - ePrivacy Seal
        - 声称自 2020 起持续持有
        - GDPR 与欧洲隐私合规
        - 支撑欧洲营销数据处理和同意管理合规
        - 没有回答 AI 日志记录或模型训练范围
      - - HIPAA + BAA 支持情况
        - Trust Center 声称
        - 行政、物理、技术保障措施，以及 PHI 处理
        - 受监管垂直行业会重点看
        - 需要逐产品确认覆盖范围
      - - SSO / SCIM / JIT
        - 文档已说明
        - SAML 2.0 联邦登录与预配
        - 支持企业身份控制和离职回收
        - 需要公开证据说明强制执行日志和租户策略控制
      - - 强制 2FA
        - 文档称默认开启
        - 个人与账户级登录加固
        - 降低控制平面账户被接管的风险
        - 启用 SSO 后 2FA 会停用，因此 IdP 侧强制执行变得关键
      - - 渠道同意采集
        - 文档已说明
        - SMS 和 WhatsApp 需要明确选择加入和 GDPR 标记
        - 对消息合法性和送达率重要
        - 未公开统一的同意审计产品页
      - - MindBehind 不训练承诺
        - 文档以窄口径说明
        - MindBehind 服务内的消息内容处理
        - 给出一条明确 AI 治理边界
        - 面向全产品的 AI 留存和训练规则仍未公开完整
    notes: 公开控制项在合同、隐私、访问主题上明显更强；全产品 AI 治理和可靠性披露弱得多。
