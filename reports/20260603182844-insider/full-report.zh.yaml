      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设公开收入估计偏保守、Bluecore 顺利整合，Insider 未来几年复合增长至大约 $300M–$320M 收入，并保住溢价软件倍数。在这些假设下，10 倍至 12 倍退出倍数可支撑约
              $3.0B–$3.8B 价值。相对 $2B+ 的参考入场价，这可以产生正收益，但前提是运营执行到位，并证明 Insider 值得采用远高于上市同业的估值框架。


              基准情景更不宽容，也更有用。如果 Insider 只做到约 $220M 收入，并以 6 倍至 8 倍收入退出，公允价值落在约
              $1.3B–$1.8B。这个水平接近或低于当前公开价格参照，在稀释前也没有提供足够有吸引力的上行。悲观情景更差：如果收入仍接近 $150M–$180M，而市场只给 4 倍至 5 倍倍数，价值会压缩至约
              $0.6B–$0.9B。由于优先权条款未披露，普通股持有人的实际下行可能比这套简单公开情景测算更差。
