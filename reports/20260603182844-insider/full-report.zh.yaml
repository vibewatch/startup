      - number: '8.5'
        title: 退出准备度、击穿投资逻辑的触发因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度的公开信号有所改善，但仍只是信号而非证明。Market Briefs 明确把 Bluecore 交易描述为 IPO 前对美国零售市场的推进，独立报道也将收购解读为弥补 Insider 美国 GTM
              缺口的方式。这点重要，因为后期客户互动平台通常需要可信的北美增长故事，才有资格进入公开上市讨论。不过，本次审阅的公开材料中没有发现 S-1、招股说明书或官方上市时间表。因此，退出准备度结论是中等，而不是强。


              如果定价长期跑在证明之前，投资逻辑就会击穿。Bluecore 整合失败、留存弱于预期、上市倍数重置并持续低于溢价 SaaS 水平，或内部人融资引入沉重优先权包袱，都可能迅速压垮估值逻辑。最终尽调议程很直接：经审计
              ARR 与收入桥、按队列划分的流失和 NRR、毛利率和烧钱画像、股权结构表与清算瀑布，以及 Bluecore 整合经济性。在这些问题得到回答前，建议应保持价格纪律，并明确附带条件。
