            body: >-
              最强的技术主线，是 Insider 记录其数据平面的方式。UCD 被描述为驱动所有产品的核心 CDP，凭借电子邮件、电话、user ID、网页、App、线上和线下行为做身份解析。Architect
              位于共享画像层之上，作为旅程引擎，提供分支逻辑、预测分群、实验控制和渠道选择。搜索和推荐也不是外挂式通用 组件：Eureka 文档描述了索引时术语处理、模糊匹配、商品运营规则和基于 ML 的排序；Smart
              Recommender 被定位为情境化产品推荐引擎，InStory 可以把这些推荐包装进故事式活动。AI 层增加了更新但战略上重要的控制平面。Insider 现在营销一套生成式、预测式和智能体栈，OpenAI
              合作把它从优化工具推向由智能体介导的购物、支持和自然语言分析。公开证据没有提供多租户隔离或模型服务的深度系统图，但它展示了一个可信产品架构：数据统一、编排、推荐、搜索和智能体界面共享同一个客户图谱。
