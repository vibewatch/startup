  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景与建议
        blocks:
          - type: paragraph
            body: >-
              Insider 有足够公开融资证据建立价格参照，但不足以让投资人有信心承销这个价格。官方来源显示，公司在 2022 年 Series D 估值 $1.22B，并在 2023 年完成一轮以 M&A 为重点的
              $105M 融资。Tech.eu 随后报道称，2023 年融资把估值推至 $2B；2024 年 General Atlantic 领投的 Series E 又新增
              $500M，但没有公开披露准确投后估值、每股价格或清算条款。这意味着，公开记录支持 $2B+ 的估值底线，但不能说明最新一轮对应的确切价格或保护条款包。


              估值问题在于，定价可见度上升得比财务可见度更快。最好的公开收入锚点仍是 Latka 对 2024 年收入约 $150M 的估计。以 $2.0B 作为参照，意味着调整现金前收入倍数约 13.3 倍，显著高于
              2026 年 6 月 Sprinklr、Braze、Klaviyo 和 HubSpot 可见的 1.1 倍至 3.0 倍 EV/sales 区间。这些上市可比公司在收入质量、利润率和留存上披露远比 Insider
              充分。因此，可提交投委会的立场应是等待或重新定价：Insider 在战略上有吸引力，但仅靠公开信息，还不足以支撑以新的 $2B+ 价格入场。
