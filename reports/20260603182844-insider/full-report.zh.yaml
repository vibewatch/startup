      - number: '4.5'
        title: 反向信号与尽调堵点
        blocks:
          - type: paragraph
            body: >-
              主要财务风险不是明显需求疲弱，而是不透明。公开评论和买方意见显示，Insider 功能强，但对准备不足的买方可能成本高、运营负担重。G2 的优缺点快照强调陡峭学习曲线、耗时
              上线导入、支持和集成问题，甚至还有发票摩擦。Gartner 至少包含一条明确负面评论，核心是顾问 流失和会议安排不稳定。TrustRadius 增加了规模更小但仍相关的执行抱怨，涉及
              缺陷、细节关注和支持质量。Research.com 与 Spendbase
              都强化了定价侧风险：没有公开定价页，预算较小的客户可能难以匹配，真实商业结果取决于谈判筹码、合同期限、用量假设，以及渠道或集成等隐藏成本驱动项。在此背景下，决定性尽调堵点不变。已审阅公开来源不披露
              ARR、确认收入、毛利率、现金余额、烧钱速度、现金跑道或直销与伙伴收入组合。平衡结论是：Insider 看起来像一个规模化、资本充足的企业 SaaS
              平台，但公开证据仍不足以支持对单位经济性或融资依赖做估值级承销。
