  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 决策流从规模和产品证据出发，穿过定价缺口与披露缺口，最后落到「等待或重新定价」的建议。
    data:
      nodes:
        - id: scale
          label: 规模证据
          type: input
          detail: 2,000+ 客户、1,500+ 团队成员，Bluecore 又带来 400+ 个美国品牌
        - id: quality
          label: 质量证据
          type: process
          detail: 97% 愿意推荐，1,349 条归档 G2 评论也支撑市场牵引力
        - id: pricing
          label: 定价缺口
          type: process
          detail: 公开参考倍数约 13.3x，上市同业 EV/Sales 约 1.1x–3.0x
        - id: disclosure
          label: 披露缺口
          type: process
          detail: 没有公开的 ARR 审计、利润率桥、烧钱曲线或优先清算瀑布
        - id: bull
          label: 必须成立的前提
          type: process
          detail: 收入必须向 $300M+ 跑通，Bluecore 整合也要足够好，才能撑住溢价倍数
        - id: decision
          label: 建议：等待 / 重新定价
          type: output
          detail: 只有在完成更深度的私下尽调，或入场价明显下调后，才推进
      edges:
        - from: scale
          to: quality
          label: 支撑
        - from: quality
          to: pricing
          label: 单独不足
        - from: pricing
          to: disclosure
          label: 因此加重
        - from: pricing
          to: bull
          label: 只有在……时才过关
        - from: disclosure
          to: decision
          label: 推向谨慎
        - from: bull
          to: decision
          label: 划定上调路径
    approximationNotes: 该流程概括的是 IC 逻辑链，不是确定性模型；每个节点都把多条公开数据压缩成一个准入判断。
