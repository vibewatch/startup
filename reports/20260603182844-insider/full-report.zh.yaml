      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑很容易说清。Insider 已有可见规模，公开声称拥有超过 2,000 家客户、1,500 多名团队成员、G2 口碑强，并在收购 Bluecore 后扩大了美国零售版图。公司具备可信的品类证明：97%
              的愿意推荐声明、庞大的归档 G2 评论基础，以及 150 个品牌从传统营销云迁移的反复表述。Bluecore 又增加 400 多个美国企业品牌，以及身份和购物者数据基础设施；这让 Insider
              正在构建更广的智能体客户互动平台，而非狭窄活动工具的说法更有力。


              反向逻辑在于，产品证明不等于可投资价格证明。归档 G2 证据显示，平台仍有学习曲线、上线、支持解决和集成摩擦。更重要的是，所有公开融资材料都没有披露经审计的
              ARR、流失、毛利率、烧钱速度或优先股堆叠。这让投资人只能用第三方收入估计和定性产品证明去支付溢价倍数。换句话说，公司质量逻辑可以成立，但入场价格逻辑仍可能过于激进。
