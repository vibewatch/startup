            body: >-
              Insider 的公开融资史显示，公司从早期风险轮一路建到后期成长资本。Crunchbase 和 Latka 指向 2013 至 2020 年间的 pre-seed、seed、Series A、Series B
              和 Series C，随后 2022 年 Series D 以 $1.22 billion 估值公开标记公司迈入独角兽阶段。2023 年又出现一轮风险融资，随后公司在 2024 年 11 月宣布由 General
              Atlantic 领投、规模大得多的 $500 million Series E。那轮融资的战略意图很明确：加速 AI 投入、深化美国扩张、拓宽地理运营，并为 M&A
              预留空间。缺失的信息与已披露信息同样重要。公开材料没有展示 Series E 后估值、股东持股、清算结构或任何老股交易，因此资本故事方向上很亮眼，但若要承销控制权或入场价格，仍不完整。
