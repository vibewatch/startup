  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 为何打破投资逻辑
      - 行动含义
    rows:
      - - 收入证明不达预期
        - 私有尽调显示收入显著低于 $200M 或增长停滞
        - 公开市场溢价倍数将失去核心支撑。
        - 立即停止或重新定价投资案。
      - - 留存质量不达预期
        - NRR 低于约 110% 或企业客户流失可见
        - 溢价软件倍数逻辑将向低增长上市同行坍缩。
        - 把它视为估值重置，而不是小的尽调备注。
      - - Bluecore 整合不达预期
        - 美国扩张停滞，或 Bluecore 经济性被证明摊薄
        - 2026 年主要上行催化剂会变成执行拖累。
        - 移入观察名单，直到整合 KPI 恢复。
      - - 可比公司倍数重置持续
        - 当 Insider 仍寻求 $2B+ 时，上市同行 EV/Sales 仍低于约 5x
        - 入场定价将继续脱离公开市场出清区间。
        - 不要只凭叙事追投本轮。
      - - 优先权悬顶恶化
        - 新增资本引入较重的高级别、参与权或反稀释棘轮
        - 即使企业价值不变，普通股上行也可能被压缩。
        - 推进前要求完整瀑布模型。
    notes: 否决触发器按投委会使用场景设计，聚焦价格敏感的失败模式，而非一般经营问题。
