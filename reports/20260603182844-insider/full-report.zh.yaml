  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开文档指向一套工作流：先采集数据，再解析身份、编排旅程、交付触点，并把反馈写回同一个画像。
    approximationNotes: 该流程抽象了零售、CRM 和消息用例，不表示存在唯一强制实施顺序。
    data:
      nodes:
        - id: collect
          label: 采集数据和目录输入
          detail: Web SDK、移动 SDK、合作伙伴集成和 Upsert API 引入用户、事件和产品数据。
        - id: unify
          label: 在 UCD 中统一画像
          detail: Email、电话和 user ID 等标识符被解析进一份客户历史，并带有同意状态。
        - id: segment
          label: 分群、预测并决策
          detail: 营销人员和 AI 使用画像信号定义受众、预测分群和下一步最佳动作。
        - id: orchestrate
          label: 在 Architect 中编排
          detail: 旅程根据规则、可达性和行为分支、等待、测试并选择渠道。
        - id: deliver
          label: 跨渠道和发现界面交付
          detail: 消息和体验通过 Web、App、Email、SMS、WhatsApp、搜索、推荐和 Stories 触达用户。
        - id: feedback
          label: 衡量结果并回写
          detail: 分析、Snowflake 回流和画像更新会改进后续分群与优化。
      edges:
        - to: unify
          label: 采集并标准化
          from: collect
        - to: segment
          label: 解析画像状态
          from: unify
        - to: orchestrate
          label: 选择受众和动作
          from: segment
        - to: deliver
          label: 启动旅程或触点
          from: orchestrate
        - to: feedback
          label: 捕捉响应和转化
          from: deliver
        - to: unify
          label: 将结果写回画像
          from: feedback
