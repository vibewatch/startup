      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              留存证据指向的买方群体比“营销团队”复杂，但仍锚定客户互动结果。Shopify、Insider 自有材料和 G2 评论显示，平台由
              CRM、生命周期、忠诚度、增长和营销运营人员使用，他们需要在一处协调网页、App、SMS、电子邮件和 WhatsApp 旅程。但预算所有权往往共享：CDP 研究称购买小组如今横跨两三个职能，客户数据通常落在 IT
              之下；Gartner 的预算指南也强调跨职能协作和内部价值证明。这意味着经济买方可能是生命周期或电商负责人，但付款方往往包括 IT 或数据领导。采用也更像分阶段，而非瞬时完成。G2
              的平均实施时间约三个月，评论者提到高级功能的学习曲线，小买方提到技术资源要求和定价不清。可能的动作是先围绕一两个高价值旅程做聚焦试点，等统一画像和编排证明运营与收入价值后，再扩大推广。
