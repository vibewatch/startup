      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开资本证据远比公开运营经济性清楚。Insider 2022 年 Series D 以 $1.22 billion 估值融资 $121 million；2023 年公司公告称，最近一笔最高 $105
              million 的投资把下一次大幅跃升前的累计披露融资推至 $274 million。2024 年末，General Atlantic 和 BusinessWire 报道 $500 million Series
              E，资金用途指向 AI 和产品开发、人才增长、地理扩张和战略 M&A。合并来看，这些披露支持公开最低累计股权融资约 $774
              million，且不需要复述公司概况里的完整历史轮次。这是软件公司的可观资本缓冲。开放问题不是 Insider
              是否融到足够多的钱以成为重要公司，而是剩余资本多少、消耗速度多快、收购驱动扩张会多大程度改变烧钱曲线。可得的监管文件式 实体证据很薄：Singapore 注册档案确认当地公司仍在运营，实缴资本 SGD
              50,000，但不提供集团现金头寸、杠杆或运营报表。因此，资本充足性方向上强，但现金跑道仍取决于未披露的支出节奏和资产负债表数据。
