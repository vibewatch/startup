    layout: wide
    summary: 公开证据显示，这是一套高接触企业打法：从迁移或渠道优化起步，先拿下 KPI 胜利，再扩张到更多渠道和 AI 模块。
    approximationNotes: 该图抽象了多个案例研究和评论来源；它描述的是公开材料中的主导打法，而不是唯一强制实施顺序。
    data:
      items:
        - label: 评估
          actor: 数字营销 / CRM / 电商负责人
          touchpoints:
            - G2 或 Gartner 评论页面
            - Insider 客户页面上的参考案例
            - 企业排名和分析师材料
          painpoint: Teams want a faster path off legacy marketing clouds without losing omnichannel depth.
          opportunity: 'G2 and Gartner proof plus 44 #1 enterprise rankings reduce perceived procurement risk.'
        - label: 迁移并上线
          actor: 营销运营 + IT / 实施团队
          touchpoints:
            - 自动迁移器
            - 预构建集成
            - 覆盖 28 个国家的本地化上线团队
          painpoint: Data readiness and implementation complexity can slow time-to-value.
          opportunity: Insider claims up to 5X faster time-to-value and 150 migrated brands in the last year.
        - label: 落地首个用例
          actor: 渠道负责人 / 增长负责人
          touchpoints:
            - Web 个性化
            - 购物车提醒
            - 试驾或获客流程
            - 推送通知
          painpoint: Teams need measurable CVR / AOV / lead lift quickly to justify platform change.
          opportunity: Samsung, Vodafone, Toyota, Adidas, and Decathlon all publish KPI wins for first-wave use cases.
        - label: 跨渠道扩张
          actor: 生命周期 / 忠诚度 / 产品营销团队
          touchpoints:
            - Architect 旅程
            - Web Push
            - Email
            - Smart Recommender
            - 搜索 / AI 分群
          painpoint: Point tools create fragmented journeys and duplicated data work.
          opportunity: Case studies repeatedly show movement from one use case into broader cross-channel orchestration.
        - label: 企业项目运营化
          actor: 区域客户成功和商业负责人
          touchpoints:
            - 季度业务复盘
            - 优化工作坊
            - 迁移手册
            - 企业支持
          painpoint: Advisor continuity and support responsiveness can affect satisfaction.
          opportunity: >-
            97% willingness-to-recommend and enterprise rankings imply many accounts still see strong value after
            go-live.
        - label: 续约 / 深化
          actor: 高管发起人
          touchpoints:
            - 追加模块
            - AI 路线图
            - 向更多团队 / 区域全球铺开
          painpoint: Public evidence stops short of disclosed renewal or NRR proof.
          opportunity: >-
            Multi-module deployments and switching-cost proxies support expansion potential, pending private cohort
            data.
    claimRefs:
      - CU030
      - CU031
      - CU038
      - CU039
      - CU042
      - CU044
      - CU045
      - CU051
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 官方来源描绘了一套可复用打法：从替换传统云或点工具开始，进入多渠道激活，再推向更广的企业推广。
    approximationNotes: 该流程综合迁移披露、案例研究和评论页面而来，不是来自单一流程文档。
    data:
      nodes:
        - id: proof
          label: 验证与采购
          detail: 买方通过 G2、Gartner、官方排名和具名客户案例验证平台。
        - id: migration
          label: 迁移 / 集成
          detail: 团队靠自动迁移、预构建集成和本地上线，迁出既有云或点工具。
        - id: launch
          label: 启动首个渠道或用例
          detail: 常见首胜集中在 Web 个性化、推送、购物车找回、获客或站内实验。
        - id: optimize
          label: 优化可衡量 KPI
          detail: 案例研究突出 CVR、AOV、获客、ROI 和试驾申请提升。
        - id: expand
          label: 扩张到跨渠道编排
          detail: 客户基于同一数据层添加旅程、AI 分群、推荐、搜索和更多渠道。
        - id: enterprise
          label: 企业推广与续约
          detail: 该账户变成更广的企业平台决策，牵涉更多区域、团队和治理要求。
      edges:
        - from: proof
          to: migration
          label: 采购 / 替换原有堆栈
        - from: migration
          to: launch
          label: 快速上线
        - from: launch
          to: optimize
          label: 衡量早期 KPI 提升
        - from: optimize
          to: expand
          label: 添加模块和渠道
        - from: expand
          to: enterprise
          label: 全球铺开 / 加深使用
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU039
      - CU050
      - CU051
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 最强公开证据集中在同时具备量化业务结果和清晰模块深度的账户；对部分头部品牌而言，只有 logo 级证据仍很常见。
