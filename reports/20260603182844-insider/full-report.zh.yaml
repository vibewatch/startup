  - id: TM005
    title: 现状替代品和邻近支出表
    columns:
      - 替代品 / 邻近项
      - 买方已拥有的东西
      - 为什么会延续
      - 在 Insider 待完成任务上哪里不足
      - 含义
    rows:
      - - ESP + SMS + push 技术栈
        - 电子邮件平台、SMS 供应商、移动消息工具、电子表格
        - 容易扩展，渠道团队也熟悉
        - 难以跨渠道统一画像、触发器、分析和旅程逻辑
        - 中端市场买方和早期试点常见的既有方案
      - - CRM / 营销云套件
        - 客户记录、营销活动、服务工作流、更广泛的云合同
        - 既有企业关系和广泛采购覆盖
        - 部署可能更慢，或在原生渠道广度和专门旅程 UX 上偏弱
        - 可挤占预算的大套件替代方案
      - - 数据仓库原生 CDP + 反向 ETL
        - 数据仓库、身份工作、分析团队、连接器层
        - 适合内部数据平台强、偏好治理的组织
        - 需要更多工程投入，也可能让营销人员拿不到开箱即用的编排
        - IT 权重高的企业里是强替代品
      - - CPaaS / 通信 + 联络中心平台
        - 消息 API、联络中心软件、语音或服务工具
        - 买方从通信基础设施起步时很有用
        - 往往需要更多拼接，才能做到营销人员友好的编排和个性化
        - 更像广义融合竞争者，而非纯 MMH 同行
      - - 自建工作流和分析栈
        - 手工分群、BI 看板、自定义触发器、代理商或运营工作
        - 控制感和沉没成本偏误
        - 迭代慢、权责碎片化、跨渠道协调弱
        - 即使痛点明显，也会拖延品类采用的现状方案
    notes: 替代品可以与 Insider 共存于同一账户；本表聚焦买方可在哪里推迟或缩窄平台支出，而不是购买完整集成栈。
