      - number: '6.3'
        title: 满意度、耐久性代理指标与落地扩张路径
        blocks:
          - type: paragraph
            body: >-
              耐久性问题只能部分靠代理指标回答；投资人最关心的部分仍披露不足。公开资料没有给出净留存率（NRR）、总留存率（GRR）、Logo
              流失、合同期限或续约队列等指标。可见的是另一组强信号：评论平台体量、客户引用密度和运营迁移说法。G2 的卖方页面显示 1,292 条已验证评论、评分 4.8 星；Insider 自己发布的 2026 年春季和夏季
              G2 新闻称，97% 的客户愿意推荐该平台，过去一年有超过 150 个品牌从传统营销云迁移过来，价值兑现速度最高快 5 倍。Gartner Peer Insights 也方向正面，有 525 条已验证评论，五星
              / 四星 / 三星占比分别为 84% / 15% / 1%；但它也给出这组材料中最具体的反向信号：一条 3.0 分评论抱怨顾问频繁更换、会议安排不稳定。TrustRadius 呈现同样模式——Web Push
              和转化优化价值强，但也明确抱怨 Bug 和支持细节。案例本身进一步强化了落地扩张路径。客户通常不是只部署一个活动小组件，而是组合多个模块：Samsung 使用 Architect、Smart
              Recommender 和叠层；Vodafone 使用跨渠道分群和站内提醒；Adidas 与 Decathlon
              结合站内优化、推荐、推送和个性化。尽管真实留存指标仍未公开，这种模式仍指向有意义的切换成本代理信号。
