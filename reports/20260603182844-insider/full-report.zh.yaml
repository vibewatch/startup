      - number: '7.3'
        title: 云、平台、合作伙伴与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Insider 的依赖栈已经深到足以成为投资逻辑变量。子处理方名单显示，客户所在地区和功能使用方式决定哪些供应商实际接触数据；名单覆盖的消息、云、CDN、身份和数据库供应商异常广。SMS
              路由会因国家而变，Meta 位于 WhatsApp 交付路径中；即便基础设施也不完全统一，因为 Huawei Cloud 专供土耳其客户，而 AWS、Google
              Cloud、Cloudflare、Microsoft 等出现在其他体系中。AI 路线图又加了一层依赖。Insider 2026 年 OpenAI 公告明确显示，LLM
              能力已经进入分群、内容生成、旅程、购物智能体和支持智能体；而 OpenAI 自身子处理方名单又在这一层下面叠加 Microsoft、AWS、Google Cloud、Cloudflare 和
              Snowflake。分发和生态风险同样可见：Insider 出现在 Shopify 和 AWS 应用市场，维持广泛技术合作伙伴关系，并依赖正式伙伴计划撬动 GTM。客户数披露降低了纯 Logo
              集中度担忧，但公开材料仍没有披露头部客户 ARR 或伙伴来源收入集中度。
