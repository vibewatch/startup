  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与正确对标集合
        blocks:
          - type: paragraph
            body: >-
              Insider 自己的 2026 年产品界面把它描述为面向营销和客户互动团队的一体化平台，组合客户数据、个性化、AI 和渠道执行。这个框架让公司比 ESP
              或单一渠道消息工具更宽，但仍窄于整个营销技术宇宙。最干净的标准化类别匹配，是多渠道营销中心（MMH）：一个平台层，集中客户数据，并跨 电子邮件、网站、移动端和其他自有渠道运行跨渠道活动。CDP
              和个性化是该壳层内部的关键使能层；广义客户互动或营销科技 类别只适合做外边界，因为它们会把联络中心服务、线下媒体、销售赋能工具和其他 Insider 并不直接拥有的预算拉进来。承销时，实际问题不是 Insider
              抽象上是否参与一个非常大的数字体验市场，而是买方会现实地拿哪些支出池与 Insider 比较。这个比较集合首先指向 MMH、CDP 和个性化预算，其次才是更宽的客户互动套件，以及拼接式点工具栈作为替代或相邻壳层。
