  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与 AI 合规风险
        blocks:
          - type: paragraph
            body: >-
              Insider 最高严重度的公开风险，不是明显需求坍塌，而是监管与隐私风险叠加。平台自有文档显示，SMS 和 WhatsApp 执行需要收集电话号码、明确的渠道 opt-in 和 GDPR 相关标记；DPA 又把
              AI Systems、AI Outputs、控制者—处理者分工、子处理方和跨境传输机制纳入法律暴露面。问题在于，Insider 已不再是单一渠道邮件工具，而是一层跨司法辖区的互动系统，覆盖
              SMS、WhatsApp、邮件、网页、App，以及如今的对话式智能体。外部规则也在同步收紧。FCC 指引仍要求商业短信取得书面同意，ICO 2026 年 4 月 PECR 指引强调电子营销的同意和软性
              opt-in 边界，EU AI Act 对类聊天机器人界面的透明度义务从 2026 年 8 月开始产生实际约束。Insider 通过 DPA、Trust Center
              和合规认证展示了可见缓释措施，但这些是框架层披露，并不是逐司法辖区证明每一条在线消息和 AI 工作流都在每个市场正确配置。
