      - number: '2.4'
        title: 增长驱动、采用约束与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素在多个来源里都很清楚：企业需要可实时激活的一方数据，需要把更多渠道协同起来，AI 正从可选增强变成工作流预期，零售、旅游、BFSI
              和数字服务等行业持续抬高个性化互动门槛。同一批来源也说明了增长为什么会低于预期。欧洲和美国的隐私规则都在收紧；浏览器和平台变化持续削弱第三方数据习惯；集成和数据卫生仍然昂贵；许多买方购买后甚至用不到一半 CDP
              能力。这些摩擦解释了为什么不同调查中的采用率和利用率测量会大幅分化。它们也给现状替代方案留下空间。买方可以继续使用由 ESP、SMS、CRM、分析和数据仓库工具拼接的栈，也可以购买
              Twilio、Braze、Klaviyo 或 Sprinklr 的更宽套件，而不是更接近的 MMH 同行。对
              Insider，向上空间来自品类融合和一体化产品宽度；风险在于，同样的融合扩大替代集合，并提高买方尽调标准。
