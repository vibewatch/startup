            body: >-
              定价和套餐设计仍是最干净的竞争分界线之一。Klaviyo 是异类：它公布自助入门价格，披露用户档案和消息限制，并受益于 Shopify 分发路径，让小品牌容易评估。Segment 和 Salesforce
              也在公开界面披露至少部分入门指引，但部署扩大后经济条件仍会转成定制。相比之下，Insider、Braze、Adobe、Netcore
              和大多数企业套件仍让买方围绕活跃用户、渠道、用量额度、实施和支持谈判。Braze 对其模型逻辑——平台版本、活跃用户和灵活用量额度——说得异常清楚，但不公布公开标价。Insider
              的定价同样由用量驱动、且多数不透明，第三方买方描述了围绕 MTAU、渠道和合同期限的重度谈判。这很重要，因为即便 Insider 最终功能范围更宽，公开透明度也可能在实时销售流程开始前就把较小电商买方拉走。
