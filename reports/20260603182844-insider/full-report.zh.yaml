  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - AI 驱动的个性化和旅程自动化
        - 驱动
        - 当前
        - 支持客户为平台付费；平台需把统一数据转成下一步最佳动作和营销活动执行
        - 索取 AI 模块相对核心平台席位的附加率和变现数据。
      - - 一方数据和隐私安全定向
        - 驱动
        - 当前
        - Cookie 流失和隐私压力抬高需求，买方更需要能统一并激活经同意的一方数据的平台
        - 索取数据治理架构，以及数据洁净室 / 数据仓库策略。
      - - 全渠道扩张
        - 驱动
        - 当前
        - 活跃渠道越多，单一编排层相对拼接式点解决方案的价值越高
        - 索取各细分市场的跨渠道使用组合和分渠道留存。
      - - 零售、BFSI 和旅游数字化
        - 驱动
        - 当前至中期
        - 客户数据密度高、个性化需求强的垂直行业会继续为该品类买单
        - 索取按垂直行业、地区以及受监管 / 非监管客户划分的收入结构。
      - - 隐私监管和同意负担
        - 约束
        - 当前
        - 每次部署都会增加购买摩擦、法务审查和运营复杂度
        - 索取异议日志、DPIA 模板和分地区数据驻留控制。
      - - 集成复杂度和数据卫生
        - 约束
        - 当前
        - 旧技术栈和低质量数据会拖慢实施，并压低实际 ROI
        - 索取中位实施时间、所需服务工时，以及各细分市场的价值实现时间。
      - - 使用率低和学习曲线
        - 约束
        - 当前
        - 客户可能买下宽泛能力，却无法把它们充分落到运营里
        - 索取产品使用遥测、续约结果和客户成功介入率。
      - - 预算审查和多方审批
        - 约束
        - 当前
        - 即使预算在增长，ROI 审查和跨职能审批流程也更重
        - 索取近期交易周期、审批卡点和销售中常用的价值验证指标。
    notes: 驱动因素和约束绑定采用时间和预算归属，而不只是抽象的品类叙事。
