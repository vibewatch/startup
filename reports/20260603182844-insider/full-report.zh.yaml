      - number: '4.3'
        title: 成本结构与毛利驱动因素
        blocks:
          - type: paragraph
            body: >-
              Insider 结构上看起来比硬件或支付业务更轻资产，但也不是零可变成本软件公司。官方合同语言明确说，当 SMS
              聚合商、云基础设施厂商、数据存储提供商和通信平台等第三方供应商提高收费时，价格可能调整。这强烈表明毛利率取决于渠道组合和外部供应商经济性，尤其是 WhatsApp、SMS
              和其他通信密集型用例。与此同时，公司和投资人公告指向可观的固定成本底座。BusinessWire 和 General Atlantic 称 Insider 在 2024 年末拥有 350+
              人内部工程团队，后续公告强调继续投入 AI、数据和产品。Snowflake 集成消息聚焦避免重复存储、降低数据移动成本，支持“数据基础设施效率影响 Insider 运营模型”的判断。Bluecore
              收购又加一层：身份解析和每天 10 billion
              零售购物者事件处理，可能增强产品经济性和交叉销售潜力，但也增加集成成本和执行复杂度。因此，可能的利润率画像是混合的：核心软件编排有健康毛利潜力，但当通信、上线、迁移和 AI
              工作负载随用量上升时，可变转嫁和服务交付漏损会更多。
