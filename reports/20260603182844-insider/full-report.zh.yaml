  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Insider 公开产品界面把采集、身份、编排、AI、交付和控制平面信任分层装进一套堆栈。
    approximationNotes: 该堆栈综合产品、学院、法律和合作伙伴材料而来，不是从官方架构图复制。
    data:
      layers:
        - id: ingestion
          label: 采集与连接器
          detail: Web SDK、移动 SDK、Upsert API、数据仓库、电商系统、分析工具和合作伙伴集成，把行为、交易和目录数据带入 Insider。
        - id: identity
          label: 身份与 CDP 层
          detail: UCD 解析标识符，存储来自线上和线下来源的画像、属性、事件、同意历史和分群输入。
        - id: orchestration
          label: 决策与编排层
          detail: Architect 使用启动器、分支逻辑、预测分群、实验和渠道规则，把画像状态转成旅程。
        - id: ai
          label: AI 与智能体层
          detail: Insider One AI、OpenAI 驱动的 Agent One、ChatGPT App 和 MCP analytics，在编排底座之上加入生成式、预测式和智能体行为。
        - id: delivery
          label: 发现与交付界面
          detail: Web、Web Push、App、Email、SMS、WhatsApp、Eureka search、Smart Recommender 和 InStory 执行个性化体验与消息触达。
        - id: trust
          label: 衡量、支持与信任控制
          detail: Analytics APIs、Snowflake 回流、迁移支持、SSO、强制 2FA、DPA 和子处理方治理闭合运营循环。
