  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 公开证据
      - 决策含义
    rows:
      - - 投资建议
        - 等待 / 重新定价
        - 公司质地确实不错，但 $2B+ 定价的证据仍不完整。
        - 没有私有尽调或更低价格，不要承销新的入场机会。
      - - 置信度
        - 中
        - 融资历史和产品证明看得见；收入质量和股权结构条款未披露。
        - 把它当筛选结论，不当作最终投委会批准。
      - - 风险评级
        - 偏高
        - 基准和悲观情景从 $2B+ 参照价出发，上行都有限或为负。
        - 推进前，需要更严密的下行保护。
      - - 估值立场
        - 按公开记录偏贵
        - 隐含收入倍数约 13.3x，而上市可比公司 EV/Sales 大约 1.1x–3.0x。
        - 把当前价格视为溢价，而不是市场出清的公允价值。
      - - 基准情景公允价值区间
        - $1.3B–$1.8B
        - 按 $220M 收入和 6x–8x 倍数推导。
        - 这是第一层重新承销区间。
      - - 什么会改变判断
        - 更多证据或更低价格
        - 经审计的 ARR、NRR、利润率和瀑布分配数据，可能支撑高于基准区间的溢价。
        - 只有私有尽调显著好于公开记录，才上调判断。
    notes: 投资建议仅基于公开信息；区间未计入未来稀释，也未计入任何未披露的优先权堆叠影响。
