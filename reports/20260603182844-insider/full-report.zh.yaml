        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Insider 顶层产品故事是连贯的：营销和客户互动团队把一方、交易和行为数据导入原生 CDP，构建统一画像和分群，在 Architect
              中编排旅程，再在宽渠道和发现界面上激活活动或体验。尽调的关键点是，Insider 不是在呈现彼此断开的点工具。当前界面把 UCD/CDP、Architect、Smart Recommender、Eureka
              搜索、InStory、渠道执行和 AI 绑进同一套运营叙事。这个叙事也宽到具备商业意义，因为公司仍在营销 12+ 渠道、100+ 集成、面向 网页、App、电子邮件、SMS、WhatsApp、搜索和推荐
              的专用界面，以及围绕用户画像、推送和电子邮件的企业级用量声明。因此，即便 Predict、Sirius AI
              或其他子品牌的确切商业打包方式在公开材料中仍不透明，模块地图也足够可读。对买方，可见的产品承诺是一套闭环套件，而不是可组合连接器包。
