  - id: TE005
    title: 部署 / 集成 / 支持表
    columns:
      - 部署触点
      - 公开实施线索
      - 运营模式信号
      - 可靠性 / 支持启示
      - 尽调缺口
    rows:
      - - Web SDK
        - 基于 GTM 的向导、生成 HTML 标签、实时测试弹窗、Insider 审核 / 批准
        - 实施更像引导式、半托管，而不是纯自助
        - 如果审核运转良好，隐性配置错误会更少
        - 需要真实实施错误率和审核周转时间
      - - Mobile SDKs
        - 向导覆盖 iOS、Android、React Native、Flutter 等
        - Insider 在维护多平台 App 埋点路径
        - 移动端触达更广，但 SDK 版本管理负担更重
        - 需要 SDK 废弃、支持窗口和崩溃影响政策
      - - 服务端 Upsert API
        - API key 生成、UAT 模式、自定义载荷、skip_hook、错误回调
        - 支持由企业控制的后台数据写入
        - 测试更安全，数据卫生更好
        - 需要公开速率限制和重试语义
      - - Web Push
        - 原生或自定义选择加入，加上 service-worker 部署和测试状态
        - Web push 对 SSL、路径和浏览器限制很敏感
        - 充分校验能减少隐藏设置错误
        - 未公开送达成功 SLA 或事故档案
      - - SMS / WhatsApp
        - 渠道文档要求明确的手机号和选择加入属性
        - 产品设置里纳入同意管理，而不只是法务操作
        - 有助于减少意外违规发送
        - 需要按运营商和市场拆分的送达率可见性
      - - 数据仓库和合作伙伴激活
        - Snowflake 安全共享，以及分析、CRM、广告、CDP 和聊天的生态页面
        - 尽管 Insider 主打一体化核心，仍有可组合输入
        - 集成宽度提升企业适配度
        - 需要按类别统计的当前活跃合作伙伴数，而不只是营销口径总数
      - - 支持与迁移动作
        - 本地客户团队、迁移服务、合作伙伴评价、Shopify 和 AWS Marketplace 反馈
        - 产品落地似乎依赖客户成功协助推广
        - 支持信号偏正面，但学习曲线投诉也存在
        - 需要实施人员配比、价值实现周期分布，以及按部署复杂度拆分的续约情况
    notes: 本表汇总可见部署机制和外部验证，不代表合同承诺的服务级别。
