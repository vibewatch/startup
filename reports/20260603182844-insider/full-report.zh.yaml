              Insider 最强的公开客户证据，不只是 Logo 墙，而是一组相当深入、带量化结果的官方案例。Samsung 案例把 Insider 与 20 天内转化率提升 275%、Web Push 转化提升
              24%、活动窗口期 Galaxy Note 销售中 9% 的贡献挂钩。Vodafone 案例显示转化率提升 159%、ROI 超过 6 倍；Toyota、Adidas、Allianz、MAC
              Cosmetics、Decathlon、airBaltic、Burger King、CNN、Lexus 也分别在试驾申请、AOV、单用户收入、ROAS 或点击率上给出更窄但仍具体的证明。尽调中，这点很重要：客户把
              Insider 用在了差异很大的场景里，包括站内个性化、商品推荐、预测分群、推送通知、生命周期旅程、结账优化和活动迁移。用户指定的客户名只能部分得到公开支撑。Samsung 和 Vodafone
              有直接、结果密集的案例；Singapore Airlines、Unilever、L’Oréal 出现在官方客户列表或企业客户赢单新闻中，但本次审阅的证据集中没有公开 KPI 密集型故事。LEGO 出现在 2026
              年客户页上，带有订阅用户增长 361% 和一段明确称赞支持质量的引语，但没有独立案例 URL。Tokopedia、DeFacto、Domino’s 以及 IKEA Turkey 的具体部署深度，在本轮检索到的
              2026 年公开证据中没有直接可支撑材料。
