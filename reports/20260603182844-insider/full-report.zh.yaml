        - 立即升级法律尽调；在控制重新验证前，下调对增长假设的信心
      - - 运营质量恶化
        - G2、Gartner 或 TrustRadius 上的评论面情绪转差，或客户成功投诉持续出现
        - 支持、上线导入、顾问流失或缺陷投诉持续上升，且没有对冲性的 KPI 披露
        - 上调上线导入成本、留存假设和实施风险
      - - 合作伙伴或供应商扰动
        - 消息、云、市场平台或 OpenAI 依赖在价格、可用性或政策上发生重大变化
        - 渠道政策变化、故障或成本冲击，损害消息投递、AI 功能或采购流程
        - 视为投资逻辑承压，要求准备应急方案并重新测算经济性
      - - 整合执行落空
        - Bluecore 整合里程碑延后，或交叉销售 / 留存证据迟迟没有出现
        - 缺少可信的收购后整合 KPI 包，或收购客户群内部出现客户流失证据
