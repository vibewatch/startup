      - number: '2.2'
        title: 规模测算视角、相互矛盾的估计，以及为什么单一 TAM 数字会误导
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个真实且增长中的品类机会，但不支持一个已经定型的单一数字。广义客户互动平台达到数百亿美元，多渠道营销中心落在高个位数十亿美元，狭义 CDP 估计集中在中个位数十亿美元。随后图景又变宽，因为一些
              CDP 分析师把更广的活动、分析、可组合和服务层纳入，给出 2025-2026 年更接近 $8-10 billion
              的起点。这不只是预测噪音，而是分类法问题。一些发布方实质上在衡量核心统一数据层，另一些在衡量更大的互动数据壳层，还有一些衡量更宽的客户体验或 营销科技环境。对
              Insider，正确解读是：公司面对一个有意义但分层的市场；最近的可比壳层小于广义 CEP 或 营销科技头条、大于最窄 CDP
              定义。公开证据足以圈定品类并保留估计分歧，但没有强到能在没有管理层数据的情况下发布干净的 Insider 专属 TAM、SAM 或 SOM。
