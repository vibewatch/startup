  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board and control structure
    missingEvidence: Current board roster, board observer rights, ownership percentages, and control provisions after Series E.
    whyItMatters: Without a current board and cap-table view, governance power, investor vetoes, and founder control cannot be assessed from public evidence alone.
    diligencePath: Request the current cap table, board consent schedule, investor rights agreement, and latest board roster from the data room.
    relatedQuestionRefs:
    - QO006
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation opacity
    missingEvidence: Post-Series-E valuation, share price, or any later financing documentation after the November 2024 round.
    whyItMatters: Series E amount is public, but the latest valuation is not; that blocks clean benchmarking of current investor entry price and dilution.
    diligencePath: Request Series E term sheets, updated cap table, and any later financing or secondary transaction documents.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: blocking
    topic: current ARR and revenue quality
    missingEvidence: Current ARR, revenue run rate, gross retention, NRR, and customer concentration data for 2025-2026.
    whyItMatters: Latka provides an estimate for 2024, but there is no official 2026 denominator for scale, growth efficiency, or valuation work.
    diligencePath: Request monthly ARR and revenue bridge, cohort retention, top-20 customer concentration, and audited or board-level revenue reporting.
    relatedQuestionRefs:
    - QO011
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: pricing and capital structure disclosure
    missingEvidence: Public price book, contract floor terms, debt facilities, and any secondary liquidity history.
    whyItMatters: Public materials prove scale and product breadth but do not reveal pricing power, leverage, or whether insider liquidity has already occurred.
    diligencePath: Request standard order forms, pricing schedule, debt register, and any tender or secondary transaction history from management.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: minor
    topic: TO004 public chronology coverage
    missingEvidence: A complete chronological archive of Insider press releases or filings that confirms exact dates and details for each pre-2024 funding and partnership milestone.
    whyItMatters: The milestone table is directionally reliable, but the current newsroom fetch is a fast-facts page and several older entries still rely on database records instead of primary archived releases.
    diligencePath: Request a company press archive or financing binder and reconcile the table row-by-row against signed financing documents and archived announcements.
    relatedTableRefs:
    - TO004
