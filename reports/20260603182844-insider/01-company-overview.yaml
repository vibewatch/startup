company:
  name: Insider
chapter:
  number: 1
  title: Company Overview
  summary: Insider is an Istanbul-rooted, globally distributed customer-engagement software company that now presents itself as an agentic customer engagement platform rather than only an omnichannel marketing suite. Public evidence supports meaningful scale—2,000+ customers, roughly 1,500+ teammates, and major late-stage financings including a $121M Series D and $500M Series E—but key underwriting data such as current valuation, ARR, pricing, and board or cap-table control terms remain private, while review platforms still flag onboarding and integration friction.
sections:
- id: section-identity
  title: Identity, Footprint, and Platform Scope
  body: 'Insider is a private customer-engagement software company that now brands itself as the leading agentic customer engagement platform. Across the homepage and platform pages, the company describes one integrated system that combines a native CDP, personalization, journey orchestration, and AI-driven decisioning across WhatsApp, SMS, email, web, app, and site search. The company’s legal and physical footprint is more complicated than a single-city startup story: official contact and privacy materials point to Kağıthane, Istanbul as the legal controller base, while New York and San Francisco appear as prominent U.S. operating addresses and Crunchbase still lists New York as headquarters. For chapter-1 purposes, the best-supported read is an Istanbul-rooted company with a large U.S. commercial presence and a truly global office map. Public materials emphasize product breadth and scale, but they do not disclose public list pricing or a 2026 ARR denominator, so the business model is clearly
    enterprise SaaS but the economic detail remains private.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO029
  - CO031
  - CO032
  - CO043
  - CO044
  figureRefs:
  - FO002
- id: section-leadership
  title: Founders, Leadership, and Governance
  body: The public record supports a six-founder origin story, and the strongest named operating leaders are still co-founders. Hande Cilingir is the clear central figure as CEO, with Serhat Soyuerel as CRO, Muharrem Derinkök as CPO, Mehmet Sinan Toktay as CTO, and Arda Koterin as chief customer officer; the 2022 unicorn release also names Okan Yedibela as VP of Engineering. This founder-heavy operating structure fits the company’s long product build-out and international expansion, but governance disclosure remains relatively thin for a business now measured in thousands of customers and employees. Series E added General Atlantic board representation, and company/investor materials market Insider as woman-founded and heavily female-led, yet the current full board roster, observer rights, and control provisions are not public. That combination makes founder continuity a strength, but also leaves real diligence work outstanding on board composition and investor governance rights.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO049
  tableRefs:
  - TO002
- id: section-capital
  title: Funding History and Investor Map
  body: 'Insider’s public financing history shows a long build from early venture rounds into late-stage growth capital. Crunchbase and Latka point to pre-seed, seed, Series A, Series B, and Series C rounds between 2013 and 2020, followed by a 2022 Series D that publicly marked the company’s unicorn step-up at a $1.22 billion valuation. A further venture round appears in 2023, and then the company announced a much larger $500 million Series E led by General Atlantic in November 2024. The strategic intent of that round was explicit: accelerate AI investment, deepen U.S. expansion, widen geographic operations, and reserve room for M&A. What remains missing is just as important as what is disclosed. Public materials do not show the post-Series-E valuation, shareholder ownership, liquidation structure, or any secondary activity, so the capital story is directionally impressive but still incomplete for underwriting control or entry price.'
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO051
  tableRefs:
  - TO003
- id: section-scale-proof
  title: Scale, Customer Proof, and External Validation
  body: 'Insider’s public scale narrative is no longer just logo-driven. Official 2024 financing materials already described 1,500+ customers, 28-country reach, and more than 1,100 team members; 2026 company and third-party review surfaces now use 2,000+ customers and roughly 1,500+ teammates as the headline scale markers. The office footprint spans the Americas, Europe, the Middle East, Africa, and APAC, while third-party trackers place the estate in the low-30s to mid-40s of locations depending on methodology. Customer proof is still curated rather than independently audited, but it is better than simple logo strips: the Somethinc case study claims 95% chatbot automation, up to 90% WhatsApp open rates, and a 50% average email open rate across 125 campaigns. Independent review platforms also matter. Gartner and G2 show substantial review volume and strong headline ratings, yet they also surface learning-curve, onboarding, support, and integration friction that should temper the polished
    growth narrative.'
  claimRefs:
