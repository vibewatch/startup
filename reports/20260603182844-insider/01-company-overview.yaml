callouts:
- calloutType: strength
  title: Scaled global platform with credible external validation
  body: 'By 2026, Insider’s public evidence supports a genuinely scaled software platform: 2,000+ customers, 1,500+ teammates, 30+ offices, meaningful enterprise logos, and durable Gartner/G2 recognition rather than a single isolated press cycle.'
  claimRefs:
  - CO024
  - CO025
  - CO036
  - CO037
- calloutType: risk
  title: Public economics remain much thinner than public positioning
  body: The company discloses headline funding and customer scale, but not its post-Series-E valuation, 2026 ARR, pricing schedule, debt, secondary liquidity history, or control terms. Those omissions materially limit valuation and governance underwriting from public evidence alone.
  claimRefs:
  - CO029
  - CO030
  - CO051
- calloutType: risk
  title: Review platforms flag implementation and support friction
  body: Independent review sources are positive overall, but they do not read like frictionless adoption. G2 and TrustRadius both point to steep learning curves, slower onboarding, integration issues, and occasional support concerns that matter for enterprise deployment risk.
  claimRefs:
  - CO039
  - CO040
  - CO041
- calloutType: insight
  title: Governance and geography disclosures are still fragmented
  body: Official and legal materials support an Istanbul-rooted business with major U.S. operating presence, while Crunchbase still lists New York as headquarters and public materials stop short of giving a current full board roster. That is manageable, but it is not clean chapter-1 disclosure.
  claimRefs:
  - CO003
  - CO004
  - CO014
  - CO049
