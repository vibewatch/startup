callouts:
  - calloutType: "strength"
    title: "Capital access and enterprise scale are visible"
    body: >-
      The public record is unusually strong on capital and throughput for a private martech company:
      Insider disclosed a $500 million Series E, says it serves 2,000+ customers, and describes a
      platform operating at billion-profile and multi-billion-message scale.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI016
      - CI029
      - CI038
  - calloutType: "risk"
    title: "Contract opacity is still the central financial risk"
    body: >-
      Buyers can infer the contract structure, but not the realized economics. Quote-only selling,
      negotiation-heavy pricing, learning-curve complaints, and support or invoice friction mean public
      evidence is still too thin to underwrite margin durability or net retention.
    claimRefs:
      - CI001
      - CI041
      - CI042
      - CI043
      - CI044
      - CI046
      - CI047
  - calloutType: "recommendation"
    title: "Request the pricing and margin waterfall before doing valuation work"
    body: >-
      The next diligence pack should focus on MTAU bands, channel mix, overage thresholds, module
      attach rates, gross margin by channel, cash balance, burn, and churn or renewal cohorts. Without
      those items, a valuation debate will be anchored more on narrative than on underwritten cash
      generation.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI036
      - CI037
      - CI048
