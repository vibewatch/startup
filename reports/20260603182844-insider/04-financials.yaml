company:
  name: "Insider"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Insider’s public evidence points to a scaled, quote-driven enterprise SaaS business monetizing a
    CDP-plus-channels stack through subscriptions, overages, add-ons, and negotiated multi-year
    contracts. Capital adequacy looks strong after a $500 million Series E, but public sources still do
    not disclose cash, burn, ARR, recognized revenue, or gross margin, so a full financial underwrite
    remains blocked on management data.
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing architecture"
    body: >-
      Insider’s public monetization architecture looks like classic enterprise SaaS, but with more usage
      sensitivity and less price transparency than a self-serve software tool. The company routes buyers
      toward demos and order-form contracting rather than a public checkout flow, while independent
      review pages likewise describe pricing as custom and subscription-based instead of fixed list
      plans. The current master subscription agreement makes the underlying contract shape clearer:
      fees are tied to purchased subscriptions, excess usage can be billed quarterly in arrears, and
      fees can rise when third-party providers such as SMS aggregators, cloud vendors, data storage,
      or communication platforms increase their charges. That means Insider is not just monetizing a
      single software seat count. The economic model likely combines a base platform commitment,
      channel and module expansion, and overage or pass-through elements linked to data scale and
      messaging intensity. Spendbase’s procurement guide is not company-confirmed pricing, but it is a
      useful proxy because it aligns with the official product design: MTAU or customer-base size,
      enabled channels, integrations, support, and contract length all appear to shape ACV. The
      diligence implication is straightforward: list-price discovery is poor, but the commercial model is
      legible enough to ask precisely for MTAU bands, channel attach rates, overage thresholds,
      discounting policy, and renewal mechanics.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
