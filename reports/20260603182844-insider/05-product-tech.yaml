  - CE014
  - CE017
  - CE041
  - CE050
- calloutType: risk
  title: Breadth is well evidenced, but packaging and reliability proof lag the story
  body: Insider publishes a lot of implementation detail, yet it still does not expose a public status ledger, module-by-module SKU map, or independent AI-performance benchmarks. Buyers can understand the platform, but they still cannot fully underwrite every operational promise from public materials alone.
  claimRefs:
  - CE030
  - CE038
  - CE048
  - CE053
  - CE059
- calloutType: recommendation
  title: Management diligence should focus on proof below the marketing layer
  body: The next diligence step is not asking what the modules are; that is already visible. It is asking for module packaging, deployment KPIs, SLA history, model-governance controls, and attach or retention by major product family so the technical moat can be translated into repeatable commercial outcomes.
  claimRefs:
  - CE024
  - CE038
  - CE041
  - CE051
  - CE059
