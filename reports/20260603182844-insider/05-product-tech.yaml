- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Insider’s public product surface layers ingestion, identity, orchestration, AI, delivery, and control-plane trust into one stack.
  approximationNotes: This stack is synthesized from product, academy, legal, and partner materials rather than copied from an official architecture diagram.
  data:
    layers:
    - id: ingestion
      label: Ingestion and connectors
      detail: Web SDK, mobile SDKs, Upsert API, warehouses, commerce systems, analytics tools, and partner integrations bring behavioral, transactional, and catalog data into Insider.
    - id: identity
      label: Identity and CDP layer
      detail: UCD resolves identifiers, stores profiles, attributes, events, consent history, and segmentation inputs across online and offline sources.
    - id: orchestration
      label: Decisioning and orchestration layer
      detail: Architect applies starters, branching logic, predictive segments, experiments, and channel rules to turn profile state into journeys.
    - id: ai
      label: AI and agent layer
      detail: Insider One AI, OpenAI-powered Agent One, ChatGPT App, and MCP analytics add generative, predictive, and agentic behaviors above the orchestration base.
    - id: delivery
      label: Discovery and delivery surfaces
      detail: Web, Web Push, App, Email, SMS, WhatsApp, Eureka search, Smart Recommender, and InStory execute personalized experiences and messaging.
    - id: trust
      label: Measurement, support, and trust controls
      detail: Analytics APIs, Snowflake return flows, migration support, SSO, mandatory 2FA, DPAs, and subprocessor governance close the operating loop.
