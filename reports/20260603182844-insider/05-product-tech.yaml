chapter:
  number: 5
  title: Product & Technology
  summary: Insider’s public product surface describes a credible closed-loop engagement stack built around a native CDP/UCD, Architect journey orchestration, discovery modules such as Smart Recommender and Eureka, broad native channel delivery, and a newly emphasized agentic AI layer. The main diligence positives are architecture coherence, explicit implementation documentation, and a visible partner or developer ecosystem; the main gaps are module packaging opacity, thin public reliability disclosure, and limited independent benchmarking of the newer AI layer.
sections:
- id: platform-definition-and-module-map
  title: Product definition and module map
  body: 'Insider’s public product story is coherent at the top level: a marketing and customer-engagement team brings first-party, transactional, and behavioral data into a native CDP, builds unified profiles and segments, orchestrates journeys in Architect, and then activates campaigns or experiences across a broad channel and discovery surface. The important point for diligence is that Insider is not presenting disconnected point tools. The current surface ties together UCD/CDP, Architect, Smart Recommender, Eureka search, InStory, channel execution, and AI under a single operating narrative. That narrative is also broad enough to matter commercially because the company still markets 12+ channels, 100+ integrations, dedicated surfaces for web, app, email, SMS, WhatsApp, search, and recommendations, plus enterprise-scale volume claims around profiles, push, and email. The module map is therefore productively legible even if the exact commercial packaging of Predict, Sirius AI, or other
    sub-brands is still opaque in public materials. For buyers, the visible product promise is a closed-loop suite rather than a composable connector bundle.'
