- id: data-ai-and-architecture
  title: Data, AI, and architecture
  body: 'The strongest technical through-line is the way Insider documents its data plane. UCD is described as the core CDP powering all products, with identity resolution across email, phone, user ID, web, app, online, and offline behavior. Architect then sits above that shared profile layer as the journey engine, with branching logic, predictive segments, experiment controls, and channel selection. Search and recommendation are not bolted on as generic widgets either: Eureka’s documentation describes indexing-time term processing, fuzzy matching, merchandising rules, and ML-based scoring, while Smart Recommender is positioned as the contextual product-suggestion engine and InStory can wrap those recommendations into story-format campaigns. The AI layer adds a newer but strategically important control plane. Insider now markets a generative, predictive, and agentic stack, and the OpenAI collaboration pushes this from optimization tooling toward agent-mediated shopping, support, and natural-language
    analytics. Public evidence does not provide a deep systems diagram for multi-tenant isolation or model serving, but it does show a credible product architecture in which data unification, orchestration, recommendation, search, and agentic interfaces all share one customer graph.'
