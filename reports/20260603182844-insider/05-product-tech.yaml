  title: Closed-loop stack is the clearest technical differentiator
  body: 'The public product surface is unusually coherent for a private martech company: one customer graph, one journey layer, native delivery channels, discovery modules, and now an agentic layer tied back to the same data foundation.'
  claimRefs:
