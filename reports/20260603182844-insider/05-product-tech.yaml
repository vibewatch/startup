- id: deployment-integrations-and-support
  title: Deployment, integrations, and operating model
  body: 'Insider’s implementation surface is unusually explicit for a private martech platform. The Academy documentation lays out GTM-based web SDK setup, real-time validation, mobile SDK paths across iOS, Android, React Native, and Flutter, a server-side Upsert API with UAT support and trigger-suppression controls, plus concrete setup guides for web push, SMS, and WhatsApp consent. That makes the deployment motion look more like an enterprise implementation program than a purely self-serve app. The operating model around that surface is also visible: Insider markets migration-as-a-service, one-to-one technical help, and local customer teams, while partner pages show a genuine ecosystem across ads, analytics, CDP, attribution, CRM, and commerce. Independent signals reinforce both the upside and the friction. Shopify and AWS Marketplace surface strong breadth, reviews, and setup praise, but third-party commentary also flags learning-curve issues and some mobile or gamification limitations.
    Netting it out, Insider appears deployable and well-instrumented, but still dependent on customer data readiness, channel consent hygiene, and hands-on enablement to realize the full stack.'
