- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or commitment
  - Public status
  - Scope
  - Why it matters
  - Remaining gap
  rows:
  - - Data Processing Addendum
    - Published
    - Processor/controller allocation, GDPR/CCPA terms, subprocessor flow-down, breach notice
    - Sets contractual privacy baseline for enterprise diligence
    - Need most recent signed enterprise redlines and SCC annex handling
  - - Subprocessor register
    - Published
    - Hosting, messaging, analytics, security, and region-specific delivery vendors
    - Makes external dependency map auditable
    - No public uptime or incident history per dependency
  - - SOC 2 Type II
    - Claimed in Trust Center
    - Security, availability, processing integrity, confidentiality, privacy
    - Standard enterprise assurance signal
    - Report itself is gated behind NDA/request
  - - ISO 27001:2022
    - Claimed in Trust Center
    - Information security management system
    - Shows formal governance and control maintenance
    - Certificate is referenced, but operational metrics are not public
  - - ePrivacy Seal
    - Claimed as continuously held since 2020
    - GDPR and European privacy compliance
    - Supports marketing-data and consent posture in Europe
    - Does not answer AI logging or model-training scope
  - - HIPAA + BAA availability
    - Claimed in Trust Center
    - Administrative, physical, technical safeguards and PHI handling
    - Relevant for regulated verticals
    - Needs product-by-product scope confirmation
  - - SSO / SCIM / JIT
    - Documented
    - SAML 2.0 federation and provisioning
    - Enterprise identity control and offboarding support
    - Need public evidence of enforcement logging and tenant policy controls
  - - Mandatory 2FA
    - Documented as default
    - Personal and account-level login hardening
    - Reduces account takeover risk on the control plane
    - 2FA is disabled when SSO is enabled, so IdP enforcement becomes critical
  - - Channel consent capture
    - Documented
    - SMS and WhatsApp require explicit opt-in and GDPR flags
    - Important for message legality and deliverability
    - No consolidated consent-audit product page is public
  - - MindBehind no-training promise
    - Documented narrowly
    - Messaging-content handling inside MindBehind services
    - Shows one explicit AI-governance boundary
    - Public product-wide AI retention and training rules remain incomplete
  notes: Public controls are materially stronger on contractual/privacy/access topics than on product-wide AI-governance and reliability disclosure.
