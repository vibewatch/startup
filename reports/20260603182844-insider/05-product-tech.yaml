  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sku-packaging
    missingEvidence: A current public or management-provided module packaging matrix showing how Architect, Predict, Sirius AI, Eureka, InStory, and Smart Recommender are bundled, sold, or attached.
    whyItMatters: The platform surface is broad, but public materials do not show how buyers actually purchase the modules or where expansion economics sit.
    diligencePath: Request the latest SKU map, order-form product schedule, and attach-rate by module family.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: reliability-sla
    missingEvidence: Public uptime metrics, incident history, or standard SLA commitments for platform and channel services.
    whyItMatters: Enterprise deployment quality depends on control-plane and messaging reliability, but public evidence stops at setup guidance and certifications.
    diligencePath: Request status-page history, standard SLA language, and top incident postmortems for the last 12 months.
