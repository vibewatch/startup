- id: TE005
  title: Deployment / integration / support table
  columns:
  - Surface
  - Public implementation cue
  - Operating-model signal
  - Reliability / support implication
  - Diligence gap
  rows:
  - - Web SDK
    - GTM-based wizard, generated HTML tags, real-time test modal, Insider review/approval
    - Implementation is guided and semi-managed rather than purely self-serve
    - Fewer silent misconfigurations if review is working well
    - Need real implementation-error rates and review turnaround times
  - - Mobile SDKs
    - Wizard covers iOS, Android, React Native, Flutter, and more
    - Insider is maintaining multi-platform app instrumentation paths
    - Broader mobile reach but more SDK-version management burden
    - Need SDK deprecation, support-window, and crash-impact policy
  - - Server-side Upsert API
    - API key generation, UAT mode, custom payloads, skip_hook, error callbacks
    - Supports enterprise-controlled back-office ingestion
    - Allows safer testing and better data hygiene
    - Need published rate limits and retry semantics
  - - Web Push
    - Native or custom opt-in plus service-worker deployment and test states
    - Web push is operationally sensitive to SSL, pathing, and browser constraints
    - Rich validation reduces hidden setup errors
    - No public delivery-success SLA or incident archive
  - - SMS / WhatsApp
    - Channel docs require explicit phone and opt-in attributes
    - Consent hygiene is treated as part of product setup, not only legal ops
    - Helps reduce accidental non-compliant sends
    - Need carrier- and market-specific deliverability visibility
  - - Warehouse and partner activation
    - Snowflake secure share plus ecosystem pages for analytics, CRM, ads, CDP, and chat
    - Composable inputs exist even though Insider markets an all-in-one core
    - Integration breadth helps enterprise fit
    - Need current active-partner counts by category rather than only marketing totals
  - - Support and migration motion
    - Local customer teams, migration service, partner reviews, Shopify and AWS marketplace feedback
    - Product appears to depend on customer-success-assisted rollout
    - Positive support signals exist, but so do learning-curve complaints
    - Need implementation staffing ratios, time-to-value distributions, and renewal by deployment complexity
  notes: The table summarizes visible deployment mechanics and external validation, not contractually committed service levels.
