- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Customer job
  - Current public maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - UCD / CDP
    - Marketing ops / data team
    - Unify profiles, events, and segmentation inputs
    - Core, heavily evidenced in product and docs
    - Identity resolution plus 12+ channel activation in one stack
    - Need public entity limits, profile-scale SLA, and exact retention defaults
  - - Architect
    - Lifecycle / CRM marketer
    - Build and automate cross-channel journeys
    - Core, heavily evidenced in docs
    - Branching logic, predictive segments, best-channel logic, A/B controls
    - Need exact throughput caps, journey concurrency, and failover details
  - - Insider One AI / Predictive layer
    - Marketing and engagement teams
    - Generate segments, optimize content, and automate decisioning
    - Current, but mostly marketed rather than benchmarked
    - Generative + predictive + agentic positioning across one UI
    - Need independent model-quality and incrementality benchmarks
  - - Agent One / Sirius AI surface
    - Commerce and support teams
    - Run shopping and support agents plus conversational analytics
    - Recent, public proof is launch-led
    - ChatGPT app, MCP analytics, and conversational agent workflows
    - Need tenant controls, prompt retention, and packaging clarity
  - - Smart Recommender
    - Ecommerce / merchandising team
    - Serve contextual product recommendations
    - Current, strong doc proof
    - Recommendation logic is connected to broader customer graph and story formats
    - Need algorithm-level performance reporting outside case studies
  - - Eureka Search
    - Search / discovery team
    - Rank site-search results and merchandising
    - Current, strong doc proof
    - NLP, typo correction, facets, ML scoring, and merchandising rules
    - Need public latency and search-quality metrics
  - - InStory
    - Onsite / campaign team
    - Create story-format engagement surfaces
    - Current, strong doc proof
    - Recommendation Story links discovery with campaign templates and analytics
    - Need adoption split between web and mobile story usage
  - - Channel suite
    - Channel ops
    - Execute messaging on web, app, email, SMS, WhatsApp, and web push
    - Current, dedicated pages and docs
    - Broad native surface reduces connector sprawl
    - Need exact channel-by-channel pricing, carrier, and deliverability dependencies
  - - API / SDK / integration surface
    - Engineering / data team
    - Connect data, catalogs, analytics, and frontends
    - Current, well evidenced in docs and GitHub
    - Web, mobile, and server-side hooks plus public SDKs and API references
    - Need public rate limits, uptime commitments, and versioning policy
  notes: Rows summarize the current public module surface rather than exact commercial bundles; Insider does not publicly disclose definitive SKU packaging.
