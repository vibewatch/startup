tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Public evidence
      - Decision implication
    rows:
      - - Recommendation
        - Wait / reprice
        - Company quality is real, but pricing evidence is incomplete at $2B+.
        - Do not underwrite a fresh entry without private diligence or a lower price.
      - - Confidence
        - Medium
        - >-
          Financing history and product proof are visible; revenue quality and cap-table terms are
          not.
        - Use as a screening verdict, not a final IC approval.
      - - Risk rating
        - Elevated
        - Base and bear cases both leave limited or negative upside from a $2B+ reference.
        - Require tighter downside protections before proceeding.
      - - Valuation stance
        - Rich on public record
        - Implied ~13.3x revenue versus roughly 1.1x–3.0x EV/Sales for public comps.
        - Treat current price as premium, not market-clearing fair value.
      - - Base-case fair-value band
        - $1.3B–$1.8B
        - Derived from $220M revenue at 6x–8x.
        - This is the first re-underwrite zone.
      - - What changes the call
        - More proof or lower price
        - Audited ARR, NRR, margin, and waterfall data could justify a premium above the base range.
        - Upgrade only if private diligence beats the public record materially.
    notes: >-
      Recommendation is based on public information only; ranges exclude future dilution and any
      undisclosed preference-stack effects.
