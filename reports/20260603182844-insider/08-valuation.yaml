  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited ARR and revenue bridge
        - 2024-2026 audited ARR, revenue, deferred revenue, and bookings walk
        - Validates whether the public $150M estimate is conservative or stale.
        - Finance data room; CFO and external auditor.
      - - Gross margin, burn, and runway
        - Gross margin by product line, cash burn, and runway
        - Determines whether a premium software multiple is justified.
        - Finance data room; board pack and monthly KPI deck.
      - - Cap table and waterfall
        - Latest cap table, Series E docs, preference stack, ratchets, and pro-rata rights
        - Without it, downside and dilution cannot be modeled.
        - Company counsel and lead-investor legal summary.
      - - Retention and concentration
        - NRR, gross churn, expansion ARR, and top-customer concentration
        - Separates durable SaaS growth from logo-churn risk.
        - Revenue operations export and customer cohort review.
      - - Bluecore economics
        - Purchase price, integration costs, revenue mix, and synergy targets
        - The main 2026 narrative catalyst could be accretive or dilutive.
        - M&A workstream, integration PMO, and operating model.
      - - IPO readiness package
        - Auditor readiness, legal structure, reporting controls, and banking prep
        - Tests whether exit-readiness is real or still narrative-only.
        - CEO/CFO diligence session plus external counsel memo.
    notes: >-
      The first four rows are commitment blockers; Bluecore economics and IPO readiness determine
      whether upside exists beyond a simple hold-or-pass decision.
