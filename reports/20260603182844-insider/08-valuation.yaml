  - id: comparable-benchmarking
    title: Comparable Valuation Benchmarking
    body: >-
      The public comparable picture is sobering. Braze, Klaviyo, HubSpot, and Sprinklr each supply
      fresher and more complete disclosure than Insider on revenue, retention, and margins, yet all
      trade at substantially lower EV/sales levels than Insider’s public-reference multiple. Braze
      and Klaviyo still show durable growth and strong net-retention metrics, HubSpot demonstrates
      scale with profitability progress, and Sprinklr provides a lower-multiple floor for
      slower-growth enterprise engagement software. That public set makes Insider’s implied 13.3x
      revenue screen look rich unless management can show private metrics materially above the
      public estimate.


      Private and M&A references help define the ceiling rather than the base. Bloomreach’s 2022
      $2.2 billion financing and later disclosure of $260 million ARR show that top-tier private
      martech assets can command premium prices when scale is better evidenced. Strategic
      transactions such as Twilio-Segment and Adobe-Marketo also demonstrate that customer-data and
      engagement assets can clear double-digit revenue or ARR multiples in the right market. But
      those deals were strategic-control outcomes, not routine minority financings. They support
      upside optionality, not today’s fair value by themselves.
