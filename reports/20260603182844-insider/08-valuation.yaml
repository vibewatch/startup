  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Theme
      - Bull evidence
      - Anti-thesis / unresolved issue
      - What would change the view
    rows:
      - - Scaled platform
        - 2,000+ customers, 1,500+ team members, 30+ offices, and a visible global footprint.
        - Scale does not substitute for disclosed ARR, margins, or a cap-table waterfall.
        - Provide audited SaaS metrics and concentration schedules.
      - - Customer proof
        - 97% willingness to recommend and 1,349 archived G2 reviews show real user traction.
        - Review evidence also shows a learning curve, onboarding drag, and integration friction.
        - Demonstrate high NRR and low gross churn despite the friction.
      - - Product moat
        - Bluecore adds U.S. enterprise retail logos plus shopper-identity data infrastructure.
        - Bluecore economics, revenue contribution, and purchase price are undisclosed.
        - Show accretive integration economics and U.S. revenue mix expansion.
      - - Strategic narrative
        - Legacy-cloud migration wins and agentic positioning support premium storytelling.
        - Premium storytelling without hard unit economics can still lead to overpaying.
        - Show that growth and margin quality justify a premium to public peers.
      - - Exit optionality
        - IPO and strategic-sale pathways both exist if U.S. execution continues.
        - No filing timetable or official IPO process disclosure is yet public.
        - Show audited readiness, legal structure, and banker preparation.
    notes: >-
      This table separates company-quality evidence from price-quality evidence; a strong platform
      does not automatically justify a premium entry.
