  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-structure-opacity
      missingEvidence: >-
        Board-approved cap table, share counts, preference waterfall, and anti-dilution or
        participation rights for the 2024 round.
      whyItMatters: >-
        Without the stack and seniority terms, downside protection and common-equity outcomes cannot
        be modeled credibly.
      diligencePath: >-
        Request the latest capitalization table, financing documents, and legal summary from company
        counsel before any IC decision.
      relatedQuestionRefs:
        - QV004
        - QV021
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: revenue-quality
      missingEvidence: >-
        Audited 2024-2026 ARR and revenue bridge, gross margin, cash burn, deferred revenue, and
        cash runway.
      whyItMatters: >-
        The public record only supports an external revenue estimate, which is not enough to justify
        a late-stage valuation or assess dilution risk.
      diligencePath: >-
        Request audited financials, monthly SaaS KPI packs, and management’s board deck for the last
        four quarters.
      relatedQuestionRefs:
        - QV005
        - QV023
        - QV025
        - QV030
      relatedTableRefs:
        - TV001
        - TV003
        - TV006
    - type: private-evidence-only
      severity: material
      topic: retention-quality
      missingEvidence: >-
        Gross churn, NRR, cohort retention, ACV mix, and top-customer concentration by region and
