company:
  name: Insider
chapter:
  number: 8
  title: Valuation & Investment Recommendation
  summary: >-
    Public evidence supports Insider as a scaled and well-regarded customer-engagement platform with
    at least a $2 billion valuation reference, but not as a cleanly underwritable $2B+ entry today.
    Using Latka's $150 million 2024 revenue estimate, the company screens at roughly 13.3x revenue
    versus about 1.1x to 3.0x EV/sales for direct public comps. The recommendation is to wait or
    reprice until management provides audited revenue, retention, margin, and preference-stack data
    or the entry price moves closer to the roughly $1.3 billion to $1.8 billion base-case range.
sections:
  - id: pricing-context
    title: Current Financing Context and Recommendation
    body: >-
      Insider has enough public financing evidence to establish a price reference, but not enough to
      underwrite that price with confidence. Official sources put the company at a $1.22 billion
      valuation in the 2022 Series D and show a further $105 million M&A-focused round in 2023.
      Tech.eu then reported that the 2023 round moved valuation to $2 billion, while the 2024
      General Atlantic-led Series E added another $500 million without publicly disclosing the exact
      post-money valuation, share price, or liquidation terms. That means the public record supports
      a $2 billion-plus floor, but not the exact price or protection package attached to the latest
      round.


      The valuation problem is that pricing visibility rose faster than financial visibility. The
      best public revenue anchor remains Latka’s estimate of roughly $150 million of 2024 revenue.
      At a $2.0 billion reference, that implies about 13.3x revenue before any adjustment for cash,
      materially above the 1.1x to 3.0x EV/sales range visible in June 2026 for Sprinklr, Braze,
      Klaviyo, and HubSpot. Those public peers offer much richer disclosure on revenue quality,
      margin, and retention than Insider does. The IC-ready stance is therefore wait or reprice:
      Insider looks strategically attractive, but not yet sufficiently evidenced to justify a fresh
      $2B+ entry on public information alone.
