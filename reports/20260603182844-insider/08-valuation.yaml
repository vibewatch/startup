  - id: exit-readiness-diligence
    title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
    body: >-
      Public signals around exit readiness have improved, but they are still signals rather than
      proof. Market Briefs explicitly described the Bluecore transaction as a U.S. retail push ahead
      of IPO, and independent coverage framed the acquisition as a way to close Insider’s U.S.
      go-to-market gap. That matters because a later-stage customer-engagement platform usually
      needs a credible North American growth story before any public listing. Still, no S-1,
      prospectus, or official listing timetable was found in the reviewed public materials. The
      exit-readiness conclusion is therefore moderate rather than strong.


      The thesis breaks if pricing outruns proof for too long. A failed Bluecore integration,
      weaker-than-expected retention, a public-multiple reset that holds below premium SaaS levels,
      or an insider financing that introduces heavy preference overhang could all collapse the
      valuation case quickly. The final diligence agenda is straightforward: audited ARR and revenue
      bridge, churn and NRR by cohort, gross margin and burn profile, cap table and waterfall, and
      Bluecore integration economics. Until those asks are answered, the recommendation should
      remain price-disciplined and explicitly conditional.
    claimRefs:
      - CV010
      - CV011
      - CV040
      - CV041
      - CV045
      - CV046
      - CV047
      - CV048
