  topStrengths:
    - >-
      Integrated closed-loop product stack spanning CDP, orchestration, recommendations, search, and newer agentic AI
      across 12+ native channels.
    - >-
      Real enterprise scale with 2,000+ customers, roughly 1,500+ teammates, strong G2 satisfaction, and visible
      migrations from legacy marketing clouds.
    - >-
      Strong capitalization, including a $500M Series E and General Atlantic backing, gives Insider room to invest in
      AI, expansion, and M&A.
    - >-
      Bluecore strengthens Insider's U.S. retail footprint and data moat through 400+ enterprise brands and a large
      shopper identity graph.
  topRisks:
    - >-
      Public disclosure is still too thin on ARR, gross margin, burn, runway, customer concentration, and the
      post-Series-E cap table.
    - >-
      The visible ~$2.0B valuation reference implies a premium multiple versus public peers and leaves limited room for
      underwriting error.
    - >-
      Review platforms still point to onboarding, support, and integration friction that can weigh on large enterprise
      deployments.
    - >-
      AI, messaging, and post-acquisition expansion increase regulatory, dependency, and execution complexity across a
      globally distributed platform.
  unresolvedGaps:
    - Audited ARR, recognized revenue bridge, and 2026 revenue quality metrics.
    - NRR, GRR, churn, contract duration, and top-customer revenue concentration.
    - Gross margin, cash balance, burn, and runway after the 2024 Series E and 2026 acquisition activity.
    - Series E share price, preference stack, anti-dilution terms, and full cap-table governance rights.
    - Bluecore integration economics, retention impact, and realized cross-sell contribution.
