chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Panthalassa's product is an autonomous wave-powered ocean compute node: waves pump seawater through a reservoir and
    single turbine, electricity powers sealed seawater-cooled AI chips, and results return via LEO satellite. The
    vertical integration is differentiated, but the product remains prototype-to-pilot maturity with unresolved
    reliability, security, environmental, and commercial-SLA evidence gaps.
sections:
  - id: product-definition
    title: Product definition and buyer workflow
    body: >-
      Panthalassa is not selling a conventional wave-energy plant, a power-purchase agreement, or an offshore
      data-center shell. The product is an autonomous floating node that converts ocean-wave motion into onboard
      electricity and uses that electricity immediately to run AI chips at sea. In customer workflow terms, a buyer
      would route suitable AI jobs to Panthalassa capacity, the node would execute inference or longer-running compute
      workloads inside a sealed marine compute module, and results would return to land through satellite backhaul. The
      company’s explicit claim is that power is never exported to shore, so the customer benefit is not cheaper grid
      electricity but compute that avoids land, grid-interconnection, cooling-water, and permitting bottlenecks. That
      makes workload selection central: delayed-result inference, simulations, and other batch-like jobs fit better than
      latency-sensitive chatbot or search traffic. The product therefore has to be diligenced as a coupled service
      workflow spanning offshore generation, remote compute operations, satellite networking, and customer job
      orchestration, not as a stand-alone marine generator.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE013
      - CE016
      - CE018
      - CE044
    tableRefs:
      - TE002
    figureRefs:
      - FE002
  - id: asset-and-architecture
    title: Node assets and operating architecture
    body: >-
      The public architecture is unusually specific for an early-stage hard-tech company. Ocean-3 is described as an
      approximately 85 meter plate-steel structure shaped like a golf ball on a tee, with investor coverage describing a
      roughly 50 meter spherical top and a long neck below the surface. As waves lift and lower the structure, seawater
      is forced up the central tube into an internal reservoir and then drained through a single turbine to produce
      electricity. That electricity powers hermetically sealed AI servers cooled through the surrounding seawater.
      Ocean-2 is the smaller prototype analogue, with a roughly 9 meter spherical top and public reporting of up to
      about 50 kilowatts in Puget Sound conditions. The architecture map should therefore be read as one vertically
      integrated asset: hull, wave pump, reservoir, turbine, power electronics, sealed compute, seawater heat exchange,
      autonomy, and satellite communications. The design may be elegant because it reduces moving parts and avoids shore
      cables, but commercial proof still depends on survivability, maintenance, and measured output in open-ocean
      conditions.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE011
      - CE021
      - CE031
    tableRefs:
      - TE001
      - TE003
    figureRefs:
      - FE001
  - id: deployment-roadmap
    title: Deployment maturity, integration, and roadmap
    body: >-
      Panthalassa’s public maturity should be scored as prototype-to-pilot rather than commercial. The sequence runs
      from Ocean-1 in 2021, through Ocean-2 and Wavehopper prototype activity in 2024, a reported 2025 Puget Sound
      Ocean-2 test near 50 kilowatts, and a planned 2026 Ocean-3 pilot series in the northern Pacific intended to
      demonstrate AI inference and refine manufacturing. Commercial deployment is targeted around 2027, while the
      longer-run vision is thousands of nodes. Integration is not a simple installation motion: it requires coastal
      factory production, tow-out or launch logistics, autonomous station-keeping, remote monitoring, satellite
      connectivity, weather routing, repair procedures, GPU payload procurement, and customer workload scheduling. The
      roadmap claims are credible enough to watch because prototypes and funding exist, but not yet bankable as a
      service-level product because public sources do not disclose uptime, repair intervals, fleet telemetry,
      environmental permits, or customer acceptance tests. The right underwriting posture is low-to-mid TRL with a major
      Ocean-3 evidence checkpoint.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
      - CE043
    tableRefs:
      - TE005
    figureRefs:
      - FE004
  - id: differentiation-and-dependencies
    title: Differentiation, moat, and critical dependencies
    body: >-
      The strongest differentiation is the fusion of two hard systems that are usually separate: wave-energy generation
      and AI compute consumption on the same autonomous hull. Conventional wave projects usually try to export
      electricity; conventional data centers solve land, grid, cooling, and staffing constraints on shore; underwater
      data-center analogues such as Project Natick test sealed marine compute but not autonomous wave generation.
      Panthalassa’s moat, if it emerges, would sit in marine engineering know-how, hull and ballast design,
      manufacturing repetition, remote operations software, thermal integration, and the ability to operate where wave
      resources are energy dense. The dependency map is equally demanding. It relies on steel fabrication and coatings,
      turbine and power electronics reliability, GPU supply, sealed-container thermal design, Starlink or comparable LEO
      connectivity, ocean-weather operations, and permitting or environmental acceptance. Several metrics are
      aspirational: up to 90% power availability, low-cost energy, and a factory capable of gigawatt-scale annual node
      output. Those claims create upside but need instrumented fleet proof before they qualify as durable product
      advantage.
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE029
      - CE031
      - CE032
      - CE033
      - CE034
      - CE037
      - CE038
    figureRefs:
      - FE003
  - id: trust-quality-compliance
    title: Trust, quality, safety, and compliance gaps
    body: >-
      Trust is the thinnest public part of the product story. A floating AI data center must survive corrosion,
      biofouling, storms, saltwater intrusion, thermal cycling, remote power faults, network interruptions, and abnormal
      incidents without on-site staff. Technical reference sources define corrosion and biofouling as ordinary marine
      hazards, while New Scientist highlights that physical intervention remains common in data-center incidents and
      that Panthalassa’s ocean sites make that intervention harder. The sealed seawater-cooled container may reduce
      water use and cooling equipment, but public sources do not provide independent PUE, chip-temperature,
      coolant-loop, corrosion-coating, anti-fouling, fire-suppression, storm-survivability, or mean-time-between-service
      data. Security and privacy are also unresolved: sources describe satellite backhaul but not encryption, tenant
      isolation, key management, incident response, or compliance attestations. Environmental trust is similarly
      incomplete because waste heat is expected to disperse into seawater, yet nearby ecosystem effects remain unclear.
      The quality-control table should be read less as a checklist passed today and more as the diligence agenda for
      Ocean-3 and first commercial contracting.
    claimRefs:
      - CE035
      - CE036
      - CE039
      - CE040
      - CE041
      - CE042
      - CE011
      - CE018
    tableRefs:
      - TE004
tables:
