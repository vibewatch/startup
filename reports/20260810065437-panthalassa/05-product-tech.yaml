callouts:
  - calloutType: strength
    title: One asset collapses generation, cooling, and compute into a single offshore product
    body: >-
      Panthalassa's most distinctive product claim is not wave generation alone; it is a self-propelled node that turns
      waves into electricity, cools sealed AI chips with seawater, and sells compute without a shore power cable.
    claimRefs:
      - CE001
      - CE003
      - CE010
      - CE011
      - CE031
  - calloutType: risk
    title: Commercial reliability is still the central unproven claim
    body: >-
      Corrosion, biofouling, storms, remote repair, satellite latency, and undisclosed security controls keep the
      product in prototype-to-pilot diligence territory until Ocean-3 produces independent operating data.
    claimRefs:
      - CE018
      - CE024
      - CE035
      - CE036
      - CE039
      - CE040
      - CE041
  - calloutType: insight
    title: Satellite backhaul shapes the usable workload mix
    body: >-
      The architecture can plausibly serve batch or delayed-result inference jobs, but higher latency versus fiber
      weakens the fit for interactive chatbot and search use cases unless connectivity improves.
    claimRefs:
      - CE016
      - CE017
      - CE018
