    title: Product module / asset matrix
    columns:
      - Module / asset
      - User / owner
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Ocean-3 node hull
        - Panthalassa operations and manufacturing
        - Pilot planned for 2026; not commercial-scale proven
        - ~85m plate-steel self-propelled structure with no shore cable
        - Open-ocean endurance, storm survivability, repair interval, and certified drawings.
      - - Ocean-2 prototype
        - Engineering and sea-trial team
        - Prototype tested in Strait/Puget Sound; ~50 kW public report
        - Smaller 9m spherical-top physical proof point
        - Instrumented test logs, independent verification, and failure history.
      - - Wavehopper / Ocean-1 prototypes
        - Engineering validation
        - Historical prototype evidence
        - Shows decade-long prototype sequence before Ocean-3
        - Specifications and lessons learned not publicly disclosed.
      - - Wave pump / reservoir / turbine
        - Power-generation subsystem
        - Mechanism described; fleet output unproven
        - Single-reservoir, single-turbine conversion inside same hull
        - Efficiency curves, fouling tolerance, and maintenance access.
      - - Sealed compute container
        - Compute payload team / AI customer
        - Concept described; no public uptime data
        - Seawater-cooled AI chips embedded in generation asset
        - Thermal performance, water ingress controls, PUE, and fire safety.
      - - Satellite backhaul and autonomy
        - Remote operations / customer workflow
        - Publicly described; SLA unknown
        - LEO satellite link allows remote ocean siting
        - Bandwidth, latency, encryption, failover, and support procedures.
    notes: >-
      Asset maturity is derived from public prototype and roadmap evidence; rows are not commercial SKUs available for
      purchase.
