  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Panthalassa solution
      - Measurable benefit
      - Limitation
    rows:
      - - Batch inference or delayed AI jobs
        - Run in land data centers constrained by grid and cooling capacity
        - Route job to ocean node; return inference tokens/results by satellite
        - Adds compute capacity without new land data-center power draw
        - Latency and bandwidth unsuitable for many interactive apps.
      - - Scientific simulation / long compute run
        - Use land HPC or cloud regions with power-price exposure
        - Run workload where wave power is generated at sea
        - Potential lower-carbon energy and no shore power cable
        - Requires validated scheduler, data transfer, and customer SLA.
      - - AI capacity expansion
        - Build or lease terrestrial data-center capacity
        - Buy compute from distributed autonomous nodes
        - Avoids some land, water, grid, and permitting bottlenecks
        - No disclosed customers or production acceptance tests.
      - - Green compute procurement
        - Contract renewable energy or offsets for land compute
        - Consume compute directly powered by ocean wave energy
        - Closer physical coupling of renewable generation and compute
        - Environmental heat effects and lifecycle analysis are not public.
      - - Remote infrastructure demonstration
        - Pilot isolated generation or marine compute separately
        - Demonstrate generation, cooling, compute, and backhaul in one node
        - Integrated proof point could de-risk scaled fleet
        - Prototype data is still company-mediated.
    notes: Use cases emphasize workloads compatible with satellite backhaul; real pricing and SLAs are not disclosed.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE018
      - CE024
      - CE041
      - CE044
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Plate-steel hull and spherical top
        - Captures wave motion and hosts reservoir/compute structure
        - Coastal steel fabrication, coatings, ballast design
        - Corrosion, fatigue, storm loading, and tow-out logistics.
      - - Central tube and reservoir
        - Pumps seawater into stored head as waves move the node
        - Hydrodynamic tuning and intake durability
        - Biofouling or debris could degrade flow and output.
      - - Single turbine and power electronics
        - Converts reservoir flow into electricity for onboard loads
        - Turbine reliability, converters, controls
        - Single-point performance bottleneck until redundancy is disclosed.
      - - GPU / AI compute payload
        - Executes inference or other suitable AI workloads
        - GPU supply, sealed racks, power conditioning
        - Thermal hotspots, hardware faults, and repair access.
      - - Seawater cooling / heat exchange
        - Rejects server heat through sealed container wall and ocean mixing
        - Container materials, monitoring, ocean currents
        - Unknown PUE, waste-heat impact, and ingress risk.
      - - LEO / Starlink backhaul
        - Sends jobs/results between node and land
        - Satellite bandwidth, antenna availability, weather resilience
        - Higher latency than fiber constrains real-time workloads.
      - - Autonomy / station keeping
        - Keeps or changes station without mooring or engine
        - Hull shape, ballast, software, weather data
        - No public reliability statistics for remote operation.
    notes: >-
      Architecture combines company claims, independent descriptions, and technical analogues; exact engineering
      specifications remain private.
    claimRefs:
