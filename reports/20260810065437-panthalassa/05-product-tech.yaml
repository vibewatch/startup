  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: >-
        Security architecture for satellite backhaul, tenant isolation, encryption, key management, compliance
        attestations, and incident response.
      whyItMatters: >-
        Customers cannot evaluate whether offshore AI compute is acceptable for proprietary or regulated workloads
        without security controls.
      diligencePath: >-
        Request a security white paper, SOC 2 or equivalent roadmap, penetration-test summaries, and customer data-flow
        diagrams.
      relatedQuestionRefs:
        - QE022
        - QE026
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: >-
        Independent Ocean-2 and Ocean-3 telemetry covering output, uptime, failures, repair interventions, weather
        windows, and remote support incidents.
      whyItMatters: >-
        The product thesis depends on autonomous operation in a harsh ocean environment where manual data-center
        intervention is difficult.
      diligencePath: >-
        Obtain instrumented sea-trial logs, third-party validation reports, and MTBF/MTTR analysis from the Ocean-3
        pilot.
      relatedQuestionRefs:
        - QE021
        - QE025
      relatedTableRefs:
        - TE003
        - TE004
    - type: missing-source
      severity: material
      topic: environment
      missingEvidence: >-
        Measured environmental impact evidence for waste heat, anti-fouling materials, underwater noise, navigation
        risk, and marine-life interaction.
      whyItMatters: Environmental acceptance and permitting risk can block or slow fleet deployment even if the engineering works.
      diligencePath: >-
        Request environmental assessments, agency correspondence, marine biologist reports, and heat-dispersion
        monitoring from pilot sites.
      relatedQuestionRefs:
        - QE027
        - QE022
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: commercial-readiness
      missingEvidence: >-
        Customer integration documents, supported workload classes, pricing, SLA, latency budgets, and production
        acceptance criteria.
      whyItMatters: >-
        The product is sold as compute capacity, so customer value depends on workflow integration and service
        guarantees, not just hardware output.
      diligencePath: >-
        Ask for pilot customer requirements, API/job-submission design, service-level drafts, and workload benchmark
        results.
      relatedQuestionRefs:
        - QE001
        - QE023
        - QE026
      relatedTableRefs:
        - TE002
    - type: conflicting-data
      severity: minor
      topic: prototype-specs
      missingEvidence: A reconciled company spec sheet distinguishing Ocean-2, Wavehopper, Ocean-3, and future node classes.
      whyItMatters: >-
        Public articles mix prototype names, dimensions, and outputs; diligence needs a clean asset lineage before
        assessing scale-up risk.
      diligencePath: Request the product requirements document and sea-trial matrix for each prototype generation.
      relatedQuestionRefs:
        - QE004
        - QE012
      relatedTableRefs:
        - TE001
        - TE005
