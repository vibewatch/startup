  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / quality metric
      - Status
      - Scope
      - Gap
    rows:
      - - Corrosion and coating qualification
        - Not publicly disclosed
        - Steel hull, turbine, container, fasteners
        - Need material specs, coating life, inspection schedule, sacrificial/anodic strategy.
      - - Biofouling management
        - Not publicly disclosed
        - Intakes, hull, heat-transfer surfaces
        - Need anti-fouling approach, cleaning plan, and performance derating assumptions.
      - - Thermal and PUE validation
        - Conceptually supported by seawater cooling
        - Sealed compute module and chip operation
        - Need measured PUE, chip temperature, water ingress, and failure data.
      - - Remote operations reliability
        - Prototype-stage evidence only
        - Autonomy, power, network, and repair workflow
        - Need MTBF, MTTR, spare strategy, and abnormal-incident playbooks.
      - - Data security and privacy
        - No public controls found
        - Satellite backhaul and multi-tenant compute
        - Need encryption, key management, tenant isolation, compliance, and incident response.
      - - Environmental heat / marine review
        - Effects unclear in public sources
        - Waste heat, noise, navigation, marine life
        - Need environmental assessment and monitoring results.
    notes: >-
      Rows are diligence controls rather than passed certifications; public materials do not disclose formal
      attestations or operational SLAs.
