chapter:
  number: 1
  title: Company Overview
  summary: >-
    Panthalassa is a Portland, Oregon public benefit corporation founded in 2016 that builds autonomous floating "nodes"
    harvesting ocean wave energy to power AI data centers at sea. In May 2026 it raised a $140M Series B led by Peter
    Thiel (about $210M total), with Financial Times framing it as a near-$1bn company. The main unresolved items are
    exact valuation, revenue and customers, and board composition.
sections:
  - id: identity
    title: Identity, product model, and operating footprint
    body: >-
      Panthalassa presents itself as a Portland, Oregon company building a fundamentally new kind of energy and
      computing infrastructure: autonomous floating platforms, which it calls nodes, that harvest ocean wave energy and
      convert it into electricity to run artificial-intelligence data centers directly at sea. Rather than transmitting
      power to shore, the company’s stated model is to co-locate generation and compute on the same offshore structure
      and sell AI compute capacity, sidestepping grid interconnection queues and land constraints. Multiple 2026 sources
      place its headquarters in Portland with prototype and sea-trial activity across the Pacific Northwest, including
      the Strait of Juan de Fuca and Puget Sound. The company is organized as a public benefit corporation, and coverage
      of its May 2026 financing spans mainstream technology, climate, and business outlets, signaling a broad public
      profile despite its early stage. In practical terms, each node is designed to operate autonomously offshore, with
      the wave-driven power system and the compute payload housed on the same structure so that no subsea power cable or
      grid interconnection is required. That architecture is the core of the company’s pitch: siting compute where
      energy is abundant at sea, rather than competing for scarce land, grid capacity, and interconnection approvals on
      shore.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
      - CO032
      - CO034
      - CO035
    figureRefs:
      - FO002
  - id: founders
    title: Founders, leadership, and key-person dependence
    body: >-
      Founding attribution is consistent across retained sources. Panthalassa was founded in 2016 and is led by
      co-founder and chief executive Garth Sheldon-Coulson, previously a senior investment associate and AI researcher
      at Bridgewater Associates, alongside co-founder and chief innovation officer Brian Moffat, an ocean-energy
      researcher who worked on wave energy at Spindrift Energy and holds three bachelor of science degrees from UC
      Irvine. The pairing anchors founder-market fit across the two disciplines the company must fuse: capital-markets
      and AI fluency on one side, and marine wave-energy engineering on the other. Public disclosure emphasizes this
      engineering-led leadership rather than a large named executive bench or a disclosed board roster, which leaves
      governance visibility thin and concentrates execution risk in two key people. That key-person concentration is a
      material diligence item given the decade-long, capital-intensive path from prototype to commercial fleet.
    claimRefs:
      - CO004
      - CO006
      - CO007
      - CO008
      - CO009
      - CO039
      - CO038
    tableRefs:
      - TO002
  - id: funding
    title: Funding, valuation, and investor base
    body: >-
      Panthalassa announced a $140 million Series B on May 4, 2026, led by Peter Thiel, bringing disclosed total capital
      raised to roughly $210 million. Financial Times characterized the company as a "$1bn ocean data centre start-up,"
      implying a near-unicorn valuation, though retained sources do not disclose an exact post-money figure. The
      syndicate blends returning backers, including Founders Fund, Gigascale Capital, Lowercarbon Capital, Unless, and
      WovenEarth, with a deep new-investor bench spanning John Doerr, Marc Benioff’s TIME Ventures, Max Levchin’s SciFi
      Ventures, Susquehanna Sustainable Investments, Hanwha Group, Fortescue Ventures, Super Micro Computer, Sozo
      Ventures, and local Oregon funds. Related special-purpose vehicles filed SEC Form D notices in 2026, disclosing
      smaller allocation pools rather than the full round. The Series B is a step-change in capital relative to
      estimated prior funding and underwrites the leap from sea-trial prototypes toward a first commercial pilot.
    claimRefs:
      - CO012
      - CO013
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO022
      - CO023
      - CO040
    tableRefs:
      - TO001
      - TO003
    figureRefs:
      - FO003
  - id: milestones
    title: Milestones, trajectory, and open questions
    body: >-
      Panthalassa’s public timeline runs from its 2016 founding through a 2021 Ocean-1 prototype deployment in the
      Strait of Juan de Fuca, later prototypes generating on the order of 50 kilowatts in Puget Sound by 2025, the May
      2026 Series B, a planned Ocean-3 pilot node in the northern Pacific around August 2026, and a stated
      commercial-deployment target near 2027. The company originally explored producing hydrogen or clean fuels before
      emphasizing AI compute, and it articulates a long-term vision of thousands of autonomous nodes. Against that
      momentum, the company is pre-revenue with no publicly disclosed paying customers, and independent commentators
      caution that corrosive, mechanically harsh ocean conditions raise real execution risk; Panthalassa did not respond
      to at least one skeptical press inquiry. Valuation precision, revenue, customer proof, and board composition
      remain the principal unresolved diligence items carried into later chapters.
    claimRefs:
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
      - CO033
