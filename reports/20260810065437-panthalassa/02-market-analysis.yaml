            - High trust and uptime hurdle
            - Power-constrained region
        - label: Neoclouds
          values:
            - AI infrastructure capacity
            - GPU batch jobs and reservations
            - Economics must beat land alternatives
            - Need differentiated capacity
        - label: AI labs
          values:
            - Research compute budgets
            - Training-adjacent or delay-tolerant inference
            - Latency and data-governance limits
            - Compute shortage
        - label: Strategics
          values:
            - Energy procurement / corporate development
            - Strategic clean-compute pilots
            - Slow procurement and option-value framing
            - Sovereign clean-compute option
        - label: Utilities
          values:
            - Utility procurement
            - Not a natural first use case
            - Power is not exported to shore
            - Only if buying compute
