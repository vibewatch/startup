chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Panthalassa's market is the narrow intersection of huge AI data-center power demand and tiny, early wave-energy
    supply. The best sizing frame separates TAM demand (~945 TWh/yr data-center electricity by 2030), wave-energy supply
    (~10 MW in 2026 to ~125 MW in 2031), and a near-term SOM limited to pilots and early nodes, with buyer adoption
    gated by trust, latency, regulation, and unit economics.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Panthalassa should not be sized as the entire wave-energy market or the entire cloud-computing market. The
      investable boundary is offshore-sited AI compute powered by ocean wave energy, where the company generates
      electricity on an autonomous node and consumes that electricity onboard to sell compute capacity. Included spend
      therefore covers the integrated stack: wave-energy conversion, marine deployment, cooling and power conditioning,
      onboard AI servers, network backhaul, and the commercial compute service. Excluded spend includes conventional
      wave-power projects that export electricity to shore, generic renewable-energy generation, and ordinary
      data-center construction unless the spend is being displaced by offshore compute. The relevant status quo is
      land-based hyperscale or colocation capacity connected to grid power, while adjacent alternatives include offshore
      wind, floating solar, nuclear or SMR-backed data centers, and plain grid procurement. This boundary is
      intentionally narrow because the market thesis depends on solving the AI power bottleneck through co-located ocean
      generation, not on proving all marine energy is a large market.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM013
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: "Two-lens sizing: huge AI demand versus tiny wave supply"
    body: >-
      The most useful sizing approach uses two lenses and refuses to merge their units. The demand lens is enormous: IEA
      projects data-center electricity demand could reach about 945 TWh per year by 2030, and SemiAnalysis frames energy
      availability as a central AI-infrastructure constraint. That lens supports a very large TAM for energy-backed
      compute capacity, but it does not prove Panthalassa can serve it. The supply lens is much smaller: Mordor
      estimates wave-energy deployment around 10 MW in 2026 growing to about 125 MW by 2031, with other analyst houses
      also describing a high-growth but early market. Panthalassa's SAM is the overlap between those lenses, namely
      wave-powered offshore AI compute. Its supportable near-term SOM is narrower still: pilot and early commercial
      nodes in 2026-2027, not a fleet-scale percentage of global AI electricity demand. The chapter therefore preserves
      TWh, MW, and node-count units separately rather than producing a single inflated TAM number.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM010
      - CM011
      - CM012
      - CM016
      - CM017
      - CM018
      - CM019
      - CM035
      - CM040
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The buyer map follows cloud and AI infrastructure budgets rather than utility procurement. Hyperscalers such as
      AWS, Azure, and Google are the most obvious archetype because they buy data-center capacity, power, networking,
      and hardware at scale. Neocloud and AI-compute specialists are also plausible because they monetize scarce GPU
      capacity and may tolerate non-traditional siting if economics and reliability work. AI labs are more likely users
      than sole payers unless they contract directly for batch or inference capacity. Adoption should begin with pilots,
      non-mission-critical batch work, and capacity reservations, because offshore autonomous nodes have to prove
      uptime, security, remote maintainability, and network performance before production workloads move. Satellite
      backhaul makes low-latency interactive services a weak first use case, while batch inference, training-adjacent
      jobs, or delay-tolerant workloads are more credible. Budget ownership likely spans cloud infrastructure,
      data-center capacity planning, AI infrastructure, and strategic energy procurement.
    claimRefs:
      - CM009
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM034
    tableRefs:
      - TM003
    figureRefs:
      - FM003
      - FM004
  - id: drivers-constraints-gaps
    title: Growth drivers, constraints, and diligence gaps
    body: >-
      The bull case is driven by AI power scarcity, interconnection delays, land constraints, decarbonization pressure,
      and strategic interest in sovereign compute capacity. Those drivers matter for valuation because they can make
      unconventional siting economically relevant if the alternative is waiting years for land, grid access, and power
      purchase agreements. The constraints are equally material. Commercial wave energy remains early; generic
      marine-energy LCOE around $388 to $618 per MWh is far above mainstream solar or wind benchmarks; offshore
      structures and GPU payloads create major capital intensity; and regulatory, maritime, environmental, and trust
      hurdles can delay adoption even without shore power export. Panthalassa and its investors cite aspirational
      economics, including low target power costs and factory-scale node production, but retained public sources do not
      disclose signed customers, pricing, node-level uptime, contracted capacity, or validated unit economics. Diligence
      should therefore preserve contradictory estimates instead of smoothing them: enormous AI electricity demand is
      real, wave deployment is tiny, and Panthalassa's actual SAM/SOM depends on pilot results and buyer trust.
    claimRefs:
      - CM014
      - CM015
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM036
      - CM037
      - CM038
      - CM039
    tableRefs:
      - TM004
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Core market
        - Offshore AI compute capacity powered by onboard wave generation
        - Grid-export wave farms and generic cloud not tied to offshore power
        - Cloud infrastructure and AI infrastructure buyers
        - Primary investable boundary for Panthalassa.
      - - Demand-side TAM
        - AI data-center electricity and compute capacity constrained by power access
        - All enterprise software or non-AI cloud workloads
        - Hyperscalers, neoclouds, AI labs
        - Explains why buyers might pay for novel siting.
      - - Supply-side lens
        - Commercial wave and marine energy deployed for useful power
        - Hydro, wind, solar, or storage without wave conversion
        - Infrastructure sponsors and strategic energy teams
        - Shows supply maturity and cost constraints.
      - - Status quo substitute
        - Land hyperscale data centers, colocation, grid power, PPAs
        - Offshore-only infrastructure
        - Cloud capacity planners and data-center real estate teams
        - Baseline buyers know and trust today.
      - - Adjacent substitutes
        - Offshore wind, floating solar, nuclear or SMR-backed data centers
        - Consumer internet or unrelated energy markets
        - Strategic energy procurement and corporate development
        - Competing ways to unlock power-constrained compute.
    notes: >-
      Market boundary separates demand-side compute spend from supply-side wave-energy hardware so the chapter does not
      double-count broad cloud or renewable markets.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM013
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Lens
      - Publisher / basis
      - Year / horizon
      - Value or unit
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - AI data-center power TAM
        - IEA / SemiAnalysis
        - "2030"
        - ~945 TWh/yr data-center electricity demand
        - Top-down demand-side electricity lens
        - high
        - Not addressable by Panthalassa without proven node scale and buyer trust.
      - - Wave-energy supply lens
        - Mordor Intelligence
        - "2026"
        - ~10 MW installed wave energy
        - Analyst market forecast baseline
        - medium
        - Tiny base; not specific to offshore compute.
      - - Wave-energy growth lens
        - Mordor Intelligence
        - "2031"
        - ~125 MW installed; ~65.7% CAGR
        - Analyst forecast from small base
        - medium
        - High CAGR can mislead because absolute MW remains small.
      - - Cross-check forecasts
        - DataM / 360i / PW / R&M
        - 2026-2033
        - Fast-growing wave-energy market
        - Multiple analyst estimates
        - medium
        - Publishers vary by horizon, geography, and paywalled methodology.
      - - Panthalassa SAM
        - Derived overlap
        - 2026 current
        - Wave-powered offshore AI compute
        - Intersection of AI compute demand and wave-powered offshore supply
        - low
        - No independent market category or revenue history disclosed.
      - - Panthalassa SOM
        - Pilot milestones
        - 2026-2027
        - Ocean-3 and early commercial nodes
        - Evidence-constrained near-term adoption unit
        - low
        - Needs pilot output, node count, pricing, and contracts.
    notes: >-
      Rows intentionally mix TWh, MW, and node-count units only as separate lenses; they should not be summed into one
      TAM figure.
    claimRefs:
      - CM006
      - CM010
      - CM011
      - CM012
      - CM017
      - CM018
      - CM019
      - CM035
      - CM036
      - CM040
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Budget owner
      - Adoption trigger
    rows:
      - - Hyperscalers
        - AWS / Azure / Google-like cloud platform teams
        - Cloud customers and internal AI services
        - Cloud infrastructure, data-center capacity, strategic energy
        - Power-constrained region or need for clean incremental capacity.
      - - Neoclouds
        - CoreWeave-like or Crusoe-like GPU capacity providers
        - AI developers buying GPU time
        - AI infrastructure and capacity procurement
        - Need differentiated energy-backed GPU capacity.
      - - AI labs
        - Frontier model or inference teams
        - Researchers and production ML applications
        - AI infrastructure, research compute, finance
        - Batch or inference workloads that tolerate offshore latency.
      - - Strategic industrial buyers
        - Large energy or technology strategics
        - Internal compute workloads
        - Corporate development and energy procurement
        - Sovereign or strategic clean-compute option value.
      - - Not primary buyers
        - Utilities or grid operators
        - Electricity customers
        - Utility procurement
        - Excluded unless buying compute, because Panthalassa does not export power to shore.
    notes: >-
      Buyer roles are inferred from cloud and AI infrastructure budget logic; no signed Panthalassa customer or LOI is
      publicly disclosed in the retained market sources.
    claimRefs:
      - CM009
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM034
  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - AI compute power scarcity
        - Driver
        - Current through 2030
        - Creates demand for non-traditional power-backed compute capacity.
        - Map target buyers with actual power shortfalls and willingness to contract.
      - - Grid interconnection and land bottlenecks
        - Driver
        - Current
        - Makes offshore siting more attractive if deployment cycles are faster.
        - Compare end-to-end permitting and deployment timelines versus land alternatives.
      - - Decarbonization and energy sovereignty
        - Driver
        - Current
        - Supports strategic premium for clean domestic compute supply.
        - Validate whether buyers pay more for wave-powered offshore compute.
      - - Tiny wave-energy installed base
        - Constraint
        - Current
        - Raises scale and reliability risk for supply-side execution.
        - Benchmark Ocean-3 output and uptime against wave-market forecasts.
      - - High marine LCOE
        - Constraint
        - Current
        - Weakens ROI unless integrated compute economics outperform generic wave benchmarks.
        - Request audited node-level cost, capacity factor, and maintenance data.
      - - Capital intensity
        - Constraint
        - Near term
        - Requires heavy financing before commercial revenue.
        - Stress-test factory capex, GPU procurement, and offshore operations budgets.
      - - Latency and networking
        - Constraint
        - Near term
        - Pushes adoption toward batch or delay-tolerant workloads first.
        - Run workload-by-workload latency and throughput trials.
      - - Regulatory, maritime, and trust hurdles
        - Constraint
        - Current to medium term
        - Can slow pilots and production conversion even without grid export.
        - Obtain permitting roadmap, insurance, security, uptime, and customer acceptance criteria.
    notes: >-
      Drivers and constraints are tied to adoption timing and diligence asks because the market is real only if buyers
      convert from shortage awareness to offshore contracts.
    claimRefs:
