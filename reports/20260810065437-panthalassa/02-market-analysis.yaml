callouts:
  - calloutType: strength
    title: A huge AI power problem gives the thesis strategic relevance
    body: >-
      IEA and SemiAnalysis evidence supports a real AI power crunch, making non-traditional siting worth investigating
      even before Panthalassa proves scale.
    claimRefs:
      - CM006
      - CM008
      - CM026
  - calloutType: risk
    title: The wave-energy supply base is tiny and expensive today
    body: >-
      Wave deployment is measured in tens to low hundreds of MW in retained forecasts, while marine LCOE remains far
      above mainstream renewables.
    claimRefs:
      - CM010
      - CM011
      - CM014
      - CM030
  - calloutType: insight
    title: SAM and SOM depend on buyer trust more than TAM size
    body: >-
      The investable market will be set by pilot uptime, latency fit, cost proof, and signed capacity contracts, not by
      broad AI electricity demand alone.
    claimRefs:
      - CM018
      - CM024
      - CM034
      - CM037
