  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market
        - AI power demand creates a large compute-siting bottleneck.
        - Wave energy market is tiny and early.
        - Independent customer demand for latency-tolerant offshore inference.
      - - Product
        - At-sea co-location avoids land, grid, and water constraints.
        - Ocean maintenance and Starlink latency may constrain usable workloads.
        - Ocean-3 telemetry showing reliable compute and networking.
      - - Financials
        - $140M Series B funds manufacturing and first deployments.
        - Pre-revenue and capital intensive with no disclosed customer contracts.
        - Signed revenue, offtake, or LOIs with credible AI buyers.
      - - Unit economics
        - $0.02/kWh, $1,500/kW, and high availability could create cost advantage.
        - Targets are not independently proven and may omit maintenance, insurance, and logistics.
        - Audited fleet-level cost, uptime, and maintenance data.
      - - Competition
        - No direct peer fuses autonomous wave generation and compute.
        - Land AI-cloud incumbents and other frontier DC concepts have stronger ecosystems.
        - Clear workload niche and price/performance evidence.
      - - Risk
        - Investor syndicate can fund iteration.
        - Corrosion, storms, biofouling, and remote repair could kill returns.
        - Survivability record through harsh-sea events.
    notes: >-
      Arguments synthesize market, product, financial, customer, competitive, and risk evidence; all view changes are
      diligence gates.
