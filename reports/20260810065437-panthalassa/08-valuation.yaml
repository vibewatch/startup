  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Ocean-3 miss
        - No verified deployment or repeated material slippage
        - Pilot proof does not arrive before financing need.
        - Pause or avoid entry.
      - - Economics miss
        - Delivered cost materially above $0.02/kWh or capex above target
        - Cost advantage versus land power disappears.
        - Reprice sharply down.
      - - Survivability failure
        - Storm, corrosion, biofouling, or repair event causes prolonged outage
        - Fleet uptime and insurance assumptions break.
        - Treat as thesis-break.
      - - Customer gap
        - No credible LOIs, contracts, or pilots from AI compute buyers
        - Pre-revenue valuation lacks demand proof.
        - Keep research-only stance.
      - - Structured financing
        - Preference-heavy or down-round terms in next raise
        - Earlier mark was not supportable.
        - Avoid unless terms protect downside.
      - - Latency/workload mismatch
        - Only low-value workloads fit satellite backhaul
        - Revenue pool smaller than thesis.
        - Cut bull-case range.
    notes: Kill triggers are designed as monitorable diligence gates rather than generic risks.
    claimRefs:
      - CV009
      - CV015
      - CV020
      - CV021
      - CV024
      - CV035
      - CV039
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Post-money and terms
        - Exact post-money, preferences, option pool, pro-rata, and ownership.
        - Determines entry price, dilution, and target return.
        - Request term sheet and cap table.
      - - Pilot results
        - Ocean-3 power, uptime, compute, cooling, latency, and autonomy data.
        - Converts model from prototype narrative to underwriteable evidence.
        - Review telemetry, logs, and third-party test reports.
      - - Customer pipeline
        - LOIs, paid pilots, workload profiles, and pricing.
        - Pre-revenue company needs demand proof.
        - Run pipeline calls and customer diligence.
      - - Unit economics
        - Capex per kW, maintenance, insurance, vessel cost, utilization, and gross margin.
        - Determines whether $0.02/kWh supports compute economics.
        - Build bottoms-up fleet model from vendor quotes and sea-trial data.
      - - Survivability
        - Storm, corrosion, biofouling, salt intrusion, and repair history.
        - Ocean reliability is the central bear case.
        - Inspect test records and independent marine-engineering review.
      - - Exit route
        - Strategic-buyer interest, IPO readiness, governance, and capital plan.
        - Frames hold period and financing dependency.
        - Interview likely buyers and review board/governance materials.
    notes: Diligence asks correspond to the unresolved evidence gaps and should be completed before any buy recommendation.
    claimRefs:
