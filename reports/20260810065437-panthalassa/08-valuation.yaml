  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Ocean-3 validates cheap reliable compute; customers sign; manufacturing scales.
        - Multi-billion infrastructure option if AI power demand pays for offshore capacity.
        - Repeat deployments, uptime, and contracted demand.
        - None if economics and contracts compound.
      - - Base
        - Pilot works, but manufacturing and customer conversion are slow.
        - Approximate $1B mark holds while investors wait for scale evidence.
        - Positive telemetry but limited revenue conversion.
        - Next round flat or structured.
      - - Bear
        - Survivability, latency, LCOE, or maintenance economics fail.
        - Down-round, distressed sale, or write-off despite strong narrative.
        - Missed pilot, no customers, or cost stack above target.
        - Avoid new money or exit secondary if possible.
    notes: Ranges are scenario bands, not price targets; they depend on undisclosed terms and unproven technical milestones.
