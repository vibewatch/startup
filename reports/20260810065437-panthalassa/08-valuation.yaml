  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation-terms
      missingEvidence: >-
        Exact post-money valuation, fully diluted capitalization, liquidation preferences, option-pool treatment, and
        pro-rata rights for the Series B.
      whyItMatters: Entry price discipline and target return cannot be assessed from a headline near-$1B framing alone.
      diligencePath: Request the Series B term sheet, cap table, and financing model from the company or lead investor.
      relatedQuestionRefs:
        - QV002
        - QV007
      relatedTableRefs:
        - TV001
        - TV006
    - type: private-evidence-only
      severity: material
      topic: customers
      missingEvidence: Signed customers, letters of intent, paid pilots, workload profiles, expected pricing, and buyer references.
      whyItMatters: >-
        Panthalassa is pre-revenue, so customer evidence is the main bridge from technology option to underwriteable
        business.
      diligencePath: Conduct management pipeline review and customer calls with hyperscalers, AI labs, and neocloud prospects.
      relatedQuestionRefs:
        - QV025
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: >-
        Independent Ocean-3 or fleet data proving energy cost, capex per kW, capacity factor, uptime, maintenance,
        insurance, and vessel-service assumptions.
      whyItMatters: The bull case depends on low-cost reliable energy; adverse evidence argues these are unproven targets.
      diligencePath: Review third-party engineering reports, telemetry, vendor quotes, insurance terms, and maintenance records.
      relatedQuestionRefs:
        - QV019
        - QV026
      relatedTableRefs:
        - TV003
        - TV006
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: >-
        A complete market map of private AI-infrastructure rounds, wave-energy peers, M&A transactions, and secondary
        marks relevant to Panthalassa.
      whyItMatters: >-
        The comparable table is a partial sample; missing private rounds could change the perceived valuation reference
        range.
      diligencePath: Build a full comps set from PitchBook/CB Insights, public filings, press releases, and banker conversations.
      relatedQuestionRefs:
        - QV023
      relatedTableRefs:
        - TV004
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: >-
        Evidence of strategic-buyer interest, IPO readiness, governance maturity, and likely capital required to reach
        exit scale.
      whyItMatters: Exit timing determines whether current investors can earn venture returns despite high capital intensity.
      diligencePath: >-
        Interview likely strategic acquirers and review board materials, governance documents, and long-range financing
        plan.
      relatedQuestionRefs:
        - QV029
      relatedTableRefs:
        - TV006
