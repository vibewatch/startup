chapter:
  number: 8
  title: Valuation
  summary: >-
    Panthalassa merits a research-more / track recommendation: the $140M Series B and near-$1B framing create frontier
    optionality, but exact valuation terms, customer proof, unit economics, and Ocean-3 evidence are missing. The
    valuation stance is unknown-to-stretched, confidence is low-to-medium, and risk is high pending milestone and terms
    diligence.
sections:
  - id: recommendation
    title: Recommendation and valuation stance
    body: >-
      The investment call is research-more / track, not buy. Panthalassa has the shape of a venture-style option on a
      real bottleneck: AI compute is power constrained, and offshore wave-powered infrastructure could be valuable if it
      avoids grid and land bottlenecks. The current public record is not strong enough to underwrite a new-money entry
      at the implied near-unicorn mark. The company has a $140 million Thiel-led Series B and about $210 million total
      raised, but the exact post-money valuation, preferences, and fully diluted ownership are not disclosed. It is also
      pre-revenue, has no publicly disclosed customers, and has not yet shown independent commercial-scale Ocean-3
      performance. That makes the price discipline unknown-to-stretched and the risk rating high even though the upside
      option is meaningful.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV034
      - CV035
      - CV036
      - CV042
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is not a generic wave-energy story; it is a co-location argument. Panthalassa wants to consume power at
      sea, sell compute, and avoid the transmission, land, cooling, and grid interconnection problems that slow land
      data centers. If the company can really deliver low-cost, high-availability energy and package it into useful
      inference capacity, it could create infrastructure value outside the grid. The anti-thesis is equally direct. Wave
      power is a small market with difficult economics, the ocean is corrosive and expensive to service, LEO latency
      limits workloads, and land-based AI-cloud incumbents have scale, procurement, software, and customer advantages.
      Because investor-backed economics are not customer proof, the thesis needs field data and pipeline evidence before
      it becomes a priced investment case.
    claimRefs:
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
      - CV018
      - CV020
      - CV021
      - CV023
      - CV027
      - CV030
    tableRefs:
      - TV002
    figureRefs:
      - FV004
  - id: financing-entry
    title: Financing context and entry discipline
    body: >-
      The financing context argues for discipline rather than false precision. Public articles supply the headline round
      and near-$1 billion framing, while SEC Form D filings show smaller related SPV allocations; none reveal the full
      cap table, post-money share count, liquidation preference, participation, pro-rata rights, or option-pool
      treatment. Methodologically, post-money valuation is only meaningful when the invested capital and fully diluted
      capital structure are known. For Panthalassa, the exact price cannot be validated from public evidence. A rational
      entry stance is therefore milestone-gated: treat the current mark as an option price on a difficult infrastructure
      breakthrough, not as a validated DCF or revenue multiple. The next financing should be assessed after Ocean-3 data
      and credible customer commitments reduce the main uncertainty bands.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV024
      - CV041
      - CV042
    figureRefs:
      - FV002
  - id: scenarios
    title: Bull, base, and bear scenarios
    body: >-
      Scenario analysis produces a wide range because a single technical proof point can change the company’s risk
      class. In the bull case, Panthalassa demonstrates useful at-sea inference, proves survivability, and shows that
      its $0.02/kWh and high-availability targets can survive real maintenance, insurance, and logistics costs. That
      could justify multi-billion-dollar infrastructure optionality. In the base case, the pilot works but scale is slow
      and capital hungry, so the implied roughly $1 billion mark merely holds while investors wait for orders and
      repeatable manufacturing. In the bear case, corrosion, biofouling, storms, latency, or wave-energy LCOE make the
      system uneconomic, and land-based alternatives win. The downside trigger is not lack of imagination; it is field
      economics failing to converge quickly enough.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV018
      - CV020
      - CV021
      - CV023
      - CV037
      - CV038
      - CV039
    tableRefs:
      - TV003
    figureRefs:
      - FV003
  - id: comparables
    title: Comparable valuation context
    body: >-
      The comparable set is useful only if clearly labeled as imperfect. Starcloud is the closest narrative analog
      because it reached a reported $1.1 billion valuation while pursuing non-terrestrial data centers, but space and
      ocean execution risks differ. CoreWeave is a demand-side AI-cloud reference, yet it is public and far more mature
      than Panthalassa. Crusoe is an AI-infrastructure analog, though public evidence in this allocation is thin for the
      exact valuation mark. CorPower Ocean and Eco Wave Power are relevant wave-energy peers, but they sell grid or
      coastal wave power rather than offshore compute. These references triangulate option value and risk appetite; they
      do not prove Panthalassa’s price. The most honest conclusion is that frontier infrastructure markets can award
      unicorn marks early, but commercial proof determines whether those marks compound or collapse.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV008
      - CV019
    tableRefs:
      - TV004
  - id: exit-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Panthalassa is not exit-ready today. A credible IPO would require revenue, customer concentration disclosure,
      repeatable unit economics, governance readiness, and a public-market narrative that converts ocean compute from
      science project to infrastructure platform. A strategic acquisition is plausible only after a buyer can diligence
      field performance and workload fit. The immediate diligence asks are therefore concrete: confirm post-money and
      terms, inspect Ocean-3 telemetry, validate customer pipeline, reconcile energy economics with maintenance and
      insurance, and review survivability data from storms and saltwater exposure. Thesis-break triggers should be
      explicit before any entry: failed Ocean-3 deployment, no customer commitments, economics materially above target,
      preference-heavy financing terms, or evidence that latency and maintenance limit the addressable workload pool.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV034
      - CV035
      - CV036
      - CV040
      - CV041
      - CV042
