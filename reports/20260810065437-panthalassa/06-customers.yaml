chapter:
  number: 6
  title: Customers
  summary: >-
    Panthalassa is pre-revenue with no disclosed signed customers, LOIs, customer pilots, revenue, retention metrics, or
    references. Demand-side sources support target-buyer urgency among hyperscalers, AI clouds, and AI labs, but those
    are proxies rather than purchase proof; customer diligence must focus on signed design partners, workload outcomes,
    and durability.
sections:
  - id: target-segments
    title: Target customers are demand-side proxies, not won accounts
    body: >-
      Panthalassa has no public customer base to segment in the ordinary sense. The correct customer lens is therefore
      prospective: hyperscale cloud platforms, large AI infrastructure buyers, neocloud or merchant GPU-cloud operators,
      and AI labs that need power-dense, delay-tolerant compute. The customer-proof sources allocated to this chapter
      intentionally function as demand-side proxies. Deloitte, IEA-linked data-center demand evidence, and hyperscale
      reference sources show that AI workloads are straining power, cooling, land, and grid access; they do not show
      that Panthalassa has converted AWS, Microsoft Azure, Google, a neocloud, or an AI lab into a customer. The implied
      buyer is infrastructure or cloud procurement, the economic sponsor is a cloud or AI-platform executive trying to
      secure power and compute capacity, and the user is an AI research or product team willing to send batch or
      inference jobs offshore. The payer would likely buy contracted capacity, not software seats, but public sources do
      not disclose revenue bands, price cards, channel motion, or signed capacity commitments.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU009
      - CU027
      - CU028
      - CU029
      - CU041
      - CU043
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Adoption trajectory stops at product pilots
    body: >-
      The public adoption trajectory is a technology trajectory rather than a customer trajectory. Panthalassa has
      disclosed prototypes such as Ocean-1, Ocean-2, and Wavehopper, a 2026 Ocean-3 pilot series, and a 2027
      commercial-deployment target. Those milestones matter because a credible Ocean-3 deployment is the prerequisite to
      any design-partner conversation, but they are not evidence of active usage, paid accounts, repeat purchases,
      production customer deployments, or utilization. CBS and the company describe a future in which multiple systems
      work together as a data center, yet the current public record still lacks signed customers, LOIs, customer pilots,
      deployed customer locations, or contracted capacity. The funnel is therefore unusually steep: broad demand is
      visible, target workloads can be described, and product pilots are planned, but every commercial proof step
      remains at zero in public evidence. This makes the customer chapter adverse despite the attractive market
      backdrop.
    claimRefs:
      - CU006
      - CU008
      - CU018
      - CU019
      - CU020
      - CU021
      - CU032
      - CU033
      - CU042
      - CU044
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-proof
    title: Named customer proof is absent
    body: >-
      The named-customer proof ledger is empty. The table deliberately lists prospective design-partner segments so
      readers can see who should be tested first, but each row is labeled as a target rather than a won customer. This
      distinction is central: AWS and Microsoft Azure are relevant because they represent hyperscale cloud buyers with
      enormous compute and power needs; colocation and AI-cloud operators are relevant because they buy power, cooling,
      and dense infrastructure; AI labs are relevant because some workloads can tolerate distance from end users. None
      of those facts is a logo win, customer quote, pilot announcement, case study, procurement record, or referenceable
      deployment. The best available proof is demand pressure plus product-market logic; the missing proof is a customer
      saying Panthalassa ran useful workloads with measurable performance, reliability, and economics. Until that
      exists, customer proof quality is low even though target-buyer urgency is credible.
    claimRefs:
      - CU007
      - CU008
      - CU022
      - CU024
      - CU026
      - CU030
      - CU034
      - CU039
      - CU040
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: retention-durability
    title: Retention, repeat usage, and satisfaction are not measurable yet
    body: >-
      Retention metrics should not be backfilled from market demand. With no disclosed customers, Panthalassa has no
      public NRR, GRR, logo churn, customer cohort, renewal term, support satisfaction score, or repeat-usage history.
      The right representation is null metrics plus explicit diligence asks. A future buyer will need evidence that
      offshore nodes can produce usable compute over months, meet service-level expectations, recover from failures
      without routine human access, and integrate into procurement and security workflows. Uptime Institute and New
      Scientist make that retention bar harder by emphasizing power, networking, remote operations, and latency as
      reliability constraints. In practice, the first retention test will not be a renewal cohort; it will be whether an
      Ocean-3 or early commercial node can run a buyer-relevant workload long enough to justify a second deployment.
      Until then, the cohort figure is intentionally blank rather than optimistic.
    claimRefs:
      - CU014
      - CU015
      - CU023
      - CU024
      - CU031
      - CU035
      - CU036
      - CU037
      - CU038
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-concentration
    title: Expansion upside comes with extreme concentration and procurement risk
    body: >-
      If Panthalassa works, expansion could be powerful: the same buyer could add nodes or fleets as a capacity product,
      and demand-side evidence suggests hyperscalers and AI clouds are hunting for power-constrained compute. The
      commercial risk is that this upside concentrates future revenue in a handful of very sophisticated buyers with
      long diligence cycles, high reliability thresholds, security reviews, and leverage over price. Procurement
      friction is higher than for ordinary cloud capacity because the infrastructure is novel, remote, satellite-linked,
      and exposed to marine hazards. Super Micro Computer should not be misread as a customer; it is disclosed as an
      investor and has relevant AI/GPU server products, making it a possible supplier or partner dependency. The
      chapter's base conclusion is therefore not that demand is absent, but that demand has not yet converted into
      adoption. The next diligence gate is signed design-partner evidence tied to workload class, uptime target, data
      path, economics, and expansion rights.
    claimRefs:
      - CU016
      - CU017
      - CU025
      - CU026
      - CU030
      - CU031
      - CU039
      - CU040
      - CU044
      - CU045
    tableRefs:
      - TU005
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Geography / vertical / size
      - Channel / use case
      - Revenue band or gap
    rows:
      - - Hyperscale cloud platforms
        - Infrastructure procurement pays; cloud capacity teams buy; AI service teams use
        - Global hyperscale; 100 MW+ data-center class; AWS/Azure/Google are proxies
        - Capacity for delay-tolerant AI inference or batch jobs at sea
        - No Panthalassa revenue band; demand proxy only.
      - - Neocloud / merchant GPU-cloud operators
        - Executive infrastructure buyer; GPU-cloud operations users; capacity resale payer
        - Large AI-cloud providers constrained by power and data-center capacity
        - Wholesale offshore compute capacity or overflow capacity
        - No disclosed contracts or reseller channel.
      - - AI labs / frontier model teams
        - Research infrastructure leaders buy; researchers submit workloads; lab budget pays
        - Large AI model developers needing batch, simulation, or inference capacity
        - Jobs that tolerate satellite backhaul and hours-to-days turnaround
        - No named lab pilot or workload outcome.
      - - Colocation and data-center operators
        - Colo operator buys capacity; tenants indirectly use; operator pays or resells
        - Multi-tenant infrastructure buyers with power/cooling constraints
        - Potential capacity partnership, not shown as channel
        - No marketplace, cross-connect, or colo partnership disclosed.
      - - Hardware / infrastructure partners
        - Partner procurement and engineering teams; not end customers
        - AI/GPU server suppliers and investors such as Super Micro
        - Supply GPU servers or integration capability for nodes
        - Partner-proof only; not customer revenue.
    notes: >-
      Segmentation is prospective because Panthalassa has no disclosed signed customers; customer-proof sources are
      demand proxies, not purchase proof.
