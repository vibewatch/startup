  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Node or fleet capacity expansion after a successful pilot
        - High dependence on a few hyperscale buyers
        - A single buyer could dominate early revenue and terms
        - Ask for target-account pipeline, buyer concentration limits, and exclusivity terms.
      - - Delay-tolerant inference or batch workload fit
        - Addressable workload may be narrower than broad AI demand
        - Limits conversion if latency-sensitive applications dominate demand
        - Validate workload benchmarks over satellite backhaul with named users.
      - - Hardware supply and integration partners
        - Supplier or investor-partner dependence, especially for AI/GPU servers
        - Delays or shortages could block customer delivery
        - Confirm Super Micro role, supply agreements, and alternative vendors.
      - - Grid and land constraints at target buyers
        - Procurement teams may still prefer proven land campuses
        - Novel offshore risk can lengthen security, insurance, and reliability review
        - Request procurement criteria and risk sign-off from design partners.
      - - Future reseller or colocation-like channel
        - No public channel or marketplace proof
        - Could force slow enterprise direct sales to sophisticated buyers
        - Ask for channel plan, partner contracts, and capacity-resale rights.
      - - Marine durability and remote operations
        - Reliability failures would damage renewals before expansion
        - Service-level skepticism may prevent multi-node orders
        - Require independent Ocean-3 uptime, maintenance, and incident data.
    notes: >-
      Expansion upside is hypothetical until signed contracts exist; concentration risk is structural because relevant
      buyers are few and powerful.
