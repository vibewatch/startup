      topic: customer-proof
      missingEvidence: Signed customers, LOIs, customer pilots, design-partner agreements, or revenue contracts for Panthalassa.
      whyItMatters: >-
        The public record contains only demand proxies and product milestones, so commercial traction cannot be
        underwritten.
      diligencePath: >-
        Request the full customer pipeline, signed agreements, LOIs, design-partner notes, and any customer-approved
        references.
      relatedQuestionRefs:
