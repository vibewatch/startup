chapter:
  number: 4
  title: Financials
  summary: >-
    Panthalassa is pre-revenue. Its financial model is to sell at-sea AI compute capacity powered by wave energy, with
    clean fuels only an optional future use case. Public evidence supports a $140M Series B, roughly $210M total raised,
    and partial SEC Form D SPV allocations, but no revenue, ARR, burn, runway, gross margin, CAC, cash balance,
    customers, or project-finance terms are disclosed. The verdict is watch-and-verify: capital access is strong, but
    unit economics and revenue quality remain unproven until Ocean-3 data and first contracts.
sections:
  - id: revenue-model
    title: "Revenue model: compute first, fuels optional, revenue absent"
    body: >-
      Panthalassa's financial story starts with a clean distinction: it is not publicly selling electricity to shore.
      The company says its autonomous nodes generate wave power offshore and consume that power onboard to run AI chips,
      returning inference tokens to land by satellite. That makes the near-term revenue hypothesis a compute-capacity
      service, not a conventional power project with a grid offtake agreement. Investor and company materials still
      leave room for clean fuels or hydrogen as future uses for abundant ocean power, but the 2026 financing narrative
      and Ocean-3 milestone are centered on AI inference at sea. No retained source discloses recognized revenue, ARR,
      pricing per token, GPU hour, reservation, or clean-fuel output. The right diligence posture is therefore to model
      revenue as zero today and treat every monetization mechanism as conditional on Ocean-3 proof plus first commercial
      contracts.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI030
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-and-traction
    title: GTM proxies are demand-side and milestone-led, not sales-efficiency proof
    body: >-
      The go-to-market motion visible from public evidence is infrastructure-led. Panthalassa must first demonstrate
      that Ocean-3 can produce useful inference at sea, then convert that proof into contracts with hyperscalers, AI
      labs, neoclouds, or enterprise compute buyers that can tolerate satellite-linked workloads. The demand-side
      argument is clear: land data centers face grid, cooling-water, permitting, and community constraints, while
      Panthalassa proposes to move the energy and cooling problem offshore. Yet sales efficiency cannot be measured.
      There is no public CAC, payback, sales cycle, channel margin, pipeline conversion, backlog, or customer
      concentration. The strongest traction proxy is not revenue but investor conviction and deployment progress: a
      large Thiel-led Series B, a broad strategic syndicate, and a stated 2026 Ocean-3 pilot before commercial
      deployments targeted for 2027.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI019
      - CI029
      - CI031
      - CI032
      - CI033
    tableRefs: []
  - id: unit-economics
    title: Unit economics depend on aspirational power cost and unpriced offshore operations
    body: >-
      The public unit-economics case is powerful but still aspirational. Lowercarbon repeats a roughly $0.02/kWh target,
      Gigascale cites around $1,500/kW manufacturing capex, a roughly 90% capacity-factor claim, and a scenario in which
      a $1 billion factory produces about 1 GW of node capacity annually. Those numbers would be highly attractive if
      realized, but they are investor- and management-sourced targets, not audited operating results from a commercial
      fleet. The cost stack is broader than energy conversion: plate-steel marine structures, coatings, turbines, power
      electronics, GPUs, sealed compute containers, satellite links, towing, maintenance vessels, insurance, corrosion
      management, biofouling, and replacement cycles all matter. DataDeep's adverse assessment directly challenges
      whether offshore operations and maintenance allow the headline two-cent power case to survive real deployment.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI034
      - CI041
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: capital-adequacy
    title: "Capital adequacy: large round, larger proof burden"
    body: >-
      Capital access is Panthalassa's clearest financial strength. The company announced a $140 million Series B on May
      4, 2026, led by Peter Thiel, and GeekWire reported about $210 million in total capital raised. The round funds
      completion of a pilot manufacturing facility near Portland and accelerates Ocean-3 deployment, but it does not
      disclose cash on hand, monthly burn, runway, debt, project finance, or expected capex through commercial scale.
      Two SEC Form D filings add useful color but not full-round accounting: one Series B allocation vehicle reported
      $319,000 sold to 14 investors, and a later B Plus vehicle reported $1,935,313 sold to 31 investors. These appear
      to be partial SPV allocation filings, not the headline round. Financing dependency remains high until Ocean-3
      produces auditable operating data or first commercial contracts.
    claimRefs:
      - CI017
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
      - CI028
      - CI040
    tableRefs:
      - TI004
    figureRefs:
      - FI003
      - FI004
  - id: public-gaps
    title: Public financial gaps dominate diligence
    body: >-
      The public record is sparse on core operating metrics. Revenue, ARR, gross margin, contribution margin, working
      capital, CAC, sales payback, cash balance, burn, runway, customer contracts, utilization, active users, and
      project-finance terms are all absent. That absence is not surprising for a private, pre-revenue
      frontier-infrastructure company, but it prevents normal software, energy, or data-center underwriting. The correct
      treatment is to preserve nulls rather than backfill with implied values from funding announcements or investor
      quotes. The financial diligence request list should therefore start with management accounts, bank balance and
      runway, customer pipeline and contract drafts, node bill of materials, maintenance budgets, insurance quotes, GPU
      procurement and depreciation assumptions, and Ocean-3 telemetry protocols that separate gross power, parasitic
      load, usable compute, and uptime.
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI013
      - CI015
      - CI018
      - CI026
      - CI032
      - CI035
      - CI038
    tableRefs:
      - TI005
  - id: verdict
    title: "Financial verdict: optionality with no revenue quality yet"
    body: >-
      Financially, Panthalassa is a high-optionality infrastructure bet rather than a company with underwritable revenue
      quality. The positive case is credible capital access, a clear demand bottleneck, a differentiated model that
      consumes power at sea, and large investor confidence behind a near-term pilot. The negative case is equally
      direct: there is no public revenue, no customers, no gross margin, no CAC, no burn or runway, no cash balance, and
      no audited data proving that marine maintenance and compute operations preserve the modeled unit economics.
      Revenue quality is therefore not applicable; margin path is unproven; capital intensity is very high. The
      investable trigger is not another press quote but measured Ocean-3 output, uptime, maintenance cadence, and first
      commercial contract economics. Until then, the verdict is watch-and-verify with major diligence blockers.
    claimRefs:
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
      - CI039
      - CI040
      - CI042
    figureRefs: []
