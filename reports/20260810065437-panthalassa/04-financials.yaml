  evidenceGaps:
    - type: private-evidence-only
      severity: critical
      topic: revenue-recognition
      missingEvidence: >-
        Executed customer contracts, billing units, SLA terms, and revenue-recognition policy for at-sea compute
        services.
      whyItMatters: >-
        Without contract terms, revenue quality, pricing, and recognition cannot be assessed for the core business
        model.
      diligencePath: >-
        Request signed agreements, draft MSAs, pricing schedules, SLA definitions, and accounting memo for compute
        revenue.
      relatedQuestionRefs:
        - QI004
        - QI018
        - QI026
      relatedTableRefs:
