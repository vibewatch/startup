companyProfile:
  summary: >-
    Panthalassa is a Portland, Oregon public benefit corporation founded in 2016 that builds autonomous floating nodes
    which convert ocean wave energy into electricity to run AI data centers at sea. Backed by a Peter Thiel-led $140M
    Series B in May 2026, it has a credible syndicate and a differentiated concept, but remains pre-revenue with no
    disclosed customers and unproven commercial-scale marine operations.
  foundedDate: '2016-01-01'
  founders:
    - name: Garth Sheldon-Coulson
      role: Co-founder and CEO
      background: Former senior investment associate and AI researcher at Bridgewater Associates.
      claimRefs: [CO006, CO007]
    - name: Brian Moffat
      role: Co-founder and Chief Innovation Officer
      background: Ocean-energy researcher; former Spindrift Energy; three BS degrees from UC Irvine.
      claimRefs: [CO008, CO009]
  foundingLocation: Portland, Oregon
  headquarters: Portland, Oregon
  productSummary: >-
    Autonomous, self-propelled floating nodes that use wave-driven turbines to generate electricity on-board and power
    hermetically sealed, seawater-cooled AI compute, with data backhauled via low-earth-orbit satellite.
  customerFocus: Hyperscalers, neocloud providers, and AI labs needing batch/inference compute capacity.
  businessModel: Sell AI compute capacity produced at sea; power is not transmitted to shore.
  stage: private, Series B
  fundingStatus: >-
    Privately funded; public sources support roughly $210M raised through the May 2026 $140M Series B led by Peter Thiel,
    with a syndicate spanning John Doerr, TIME Ventures, SciFi Ventures, and returning climate investors.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO006, CO008, CO012, CO013, CO015, CO016, CO029]
