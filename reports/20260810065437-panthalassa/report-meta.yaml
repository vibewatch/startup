  topStrengths:
    - A $140M Series B led by Peter Thiel with John Doerr, TIME Ventures, SciFi Ventures, and returning climate backers gives deep capital and a credibility halo.
    - The vertically integrated node fuses wave generation and at-sea compute in one autonomous, self-propelled hull, a genuinely differentiated concept.
    - The company rides powerful AI-compute power-demand tailwinds as land and grid constraints push interest toward novel siting.
  topRisks:
    - Pre-revenue with no disclosed paying customers and unproven commercial-scale marine survivability (corrosion, biofouling, storms).
    - No disclosed post-money valuation, revenue, margins, or board composition, so entry discipline is impossible from public evidence.
    - Execution concentrates in two co-founders, and Starlink-latency and wave-LCOE economics limit near-term viability to batch workloads.
  unresolvedGaps:
    - Exact Series B post-money valuation, price per share, and preference/dilution terms.
    - Any signed customers, letters of intent, or offtake agreements and a commercial pipeline.
    - Ocean-3 pilot results and commercial-scale survivability, uptime, and unit-economics data.
    - Current board composition, governance, and control rights.
