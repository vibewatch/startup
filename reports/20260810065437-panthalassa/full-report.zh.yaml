  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高残余风险集中在高影响的技术、运营、通信、监管和单位经济性单元。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余暴露
      rows:
        - label: 海事生存能力
