      - number: '8.3'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资背景要求纪律，而不是虚假的精确。公开文章给出头条轮次和接近 $1 billion 的叙事，SEC Form D 文件显示规模较小的相关 SPV
              配额；没有任何来源披露完整股权结构、投后股数、清算优先权、参与权、按比例认购权或期权池处理。方法上，只有已知投入资本和完全摊薄资本结构时，投后估值才有意义。就 Panthalassa
              而言，公开证据无法验证准确价格。理性的入场立场应当由里程碑设闸：把当前估值视为押注艰难基础设施突破的期权价格，而不是经验证的 DCF 或收入倍数。下一轮融资应在 Ocean-3
              数据和可信客户承诺压缩主要不确定区间之后再评估。
