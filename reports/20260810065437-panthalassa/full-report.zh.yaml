      - - 经济性失手
        - 交付成本显著高于 $0.02/kWh，或资本开支高于目标
        - 相对陆上电力的成本优势消失。
        - 大幅下调定价。
      - - 生存性失败
        - 风暴、腐蚀、生物污损或维修事件造成长时间中断
        - 船队运行时间和保险假设失效。
        - 视为论点破裂。
      - - 客户缺口
        - AI 算力买家没有可信 LOI、合同或试点
        - 尚无收入公司的估值缺少需求证明。
        - 保持仅研究立场。
      - - 结构化融资
        - 下一轮条款偏重优先权，或为降价融资
        - 此前估值标记站不住。
        - 除非条款保护下行，否则避免参与。
