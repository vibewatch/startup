      - number: '5.5'
        title: 信任、质量、安全和合规缺口
        blocks:
          - type: paragraph
            body: >-
              信任是产品故事里公开信息最薄的一环。一个漂浮 AI
              数据中心必须在没有现场人员的情况下扛住腐蚀、生物污损、风暴、海水侵入、热循环、远程电力故障、网络中断和异常事故。技术参考来源把腐蚀和生物污损定义为普通海洋风险；New Scientist
              则强调，数据中心事故中物理干预仍很常见，而 Panthalassa 的海洋站点让这种干预更难。密封、海水冷却的容器可能减少用水和冷却设备，但公开来源没有提供独立的
              PUE、芯片温度、冷却回路、抗腐蚀涂层、防污、消防、风暴生存能力或平均服务间隔数据。安全和隐私同样未解：来源描述了卫星回传，但没有描述加密、租户隔离、密钥管理、事件响应或合规认证。环境信任也不完整，因为废热预计会散入海水，但邻近生态系统影响仍不清楚。质量控制表不应被读作今天已经通过的清单，而更像是
              Ocean-3 和首批商业合同的尽调议程。
