              从公开证据看，Panthalassa 的进入市场动作由基础设施驱动。公司必须先证明 Ocean-3 能在海上产出可用推理，再把证明转成与超大规模云厂商、AI
              实验室、新云或能容忍卫星链路工作负载的企业算力买方签订的合同。需求侧论点清晰：陆上数据中心面临电网、冷却水、许可和社区约束，Panthalassa 则提出把能源和冷却问题移到海上。但销售效率无法衡量。公开信息没有
