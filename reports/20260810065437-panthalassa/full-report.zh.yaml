      - number: '7.2'
        title: 监管、法律、环境和政策暴露
        blocks:
          - type: paragraph
            body: >-
              监管风险不是一张单一许可，而是一套彼此叠加的海上能源、海事、数据中心、环境和政策体系。BOEM 监管美国外大陆架上的可再生能源，DOE
              的海洋能源项目则把波浪能定义为仍需研发、示范和降低障碍的行业。数据中心法律来源又叠加一层：选址和设计不同，NEPA、ESA、Clean Water Act、Clean Air
              Act、水、废弃物、雨水、分区、噪音、交通和公共土地审批都可能相关。符合条件的数据中心若获得联邦加速，可能有利于部分项目，但法律评论强调，州和地方审查、社区反对与诉讼仍是进度和成本风险。若美国境内拖带、维护或备件运输发生在美国港口之间，Jones
              Act 还会形成实际海事约束。环境审查尤其敏感，因为 New Scientist 报道称，海上废热对生态系统的影响仍不明确。
