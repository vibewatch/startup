  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 技术、监管和依赖风险会传导到正常运行时间、客户转化、capex、融资和估值。
    data:
      nodes:
        - id: marine
          label: 海事生存能力：腐蚀、生物污损、风暴
        - id: ops
          label: 远程运营：电力 + 网络中断
        - id: reg
          label: 监管 / 法律审批和政策变化
        - id: comms
          label: Starlink 延迟和可用性
        - id: service
          label: 服务船天数和维护成本
        - id: sla
          label: 客户 SLA / 工作负载适配
        - id: capital
          label: 下一轮融资和制造 capex
        - id: valuation
          label: 估值和投资建议
      edges:
        - from: marine
          to: service
        - from: marine
          to: sla
        - from: ops
          to: sla
        - from: comms
          to: sla
        - from: reg
          to: capital
        - from: service
          to: capital
        - from: sla
          to: capital
        - from: capital
          to: valuation
        - from: sla
          to: valuation
    approximationNotes: 不同视角：展示风险如何因果传导至经济性和估值，而不是依赖清单。
    claimRefs:
      - CR008
      - CR009
      - CR012
      - CR018
      - CR019
      - CR029
      - CR038
      - CR039
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 扩张前，Panthalassa 依赖一组窄口径的通信、硬件、监管、船舶、资本和客户交易对手。
    data:
      nodes:
        - id: pan
          label: Panthalassa Ocean-3 / 舰队计划
        - id: starlink
          label: Starlink / LEO 卫星回传
        - id: gpu
          label: GPU 和服务器供应商
        - id: factory
          label: 沿海制造和钢材供应
        - id: vessels
          label: Jones Act 合规拖船 / 服务船
        - id: regulators
          label: BOEM、海事、环境监管机构
        - id: capital
          label: Series B 轮财团和下一轮资本
        - id: customers
          label: 未来超大规模 / AI 实验室买方
        - id: monitoring
          label: 独立遥测和检查
      edges:
        - from: starlink
          to: pan
        - from: gpu
          to: pan
        - from: factory
          to: pan
        - from: vessels
          to: pan
        - from: regulators
          to: pan
        - from: capital
          to: factory
        - from: capital
          to: pan
        - from: pan
          to: customers
        - from: monitoring
          to: customers
        - from: monitoring
          to: capital
    approximationNotes: 不同视角：交易对手和资源依赖；与风险传导 DAG 的任何重叠是有意的，但不是重复分析。
    claimRefs:
      - CR011
      - CR025
      - CR026
      - CR027
      - CR028
      - CR037
      - CR039
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链把强期权价值转化为继续研究立场，因为验证和定价仍然缺失。
    data:
      nodes:
        - id: n1
          label: AI 电力瓶颈创造大上行期权
        - id: n2
          label: $140M Series B 轮 / 约 $210M 融资验证投资者兴趣
        - id: n3
          label: 外界引用接近 $1B 的估值，但准确投后估值未披露
        - id: n4
          label: 收入前、无已披露客户、Ocean-3 未经独立验证
        - id: n5
          label: 海洋、延迟和波浪 LCOE 风险仍高
        - id: n6
          label: 建议：research-more / 跟踪
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
        - from: n1
          to: n6
    approximationNotes: 流程展示投资逻辑，不是机械评分模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV016
      - CV034
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值逻辑对试点成效、单位经济、客户验证和未披露条款最敏感。
    data:
      items:
        - label: AI 电力需求拉动
          value: 3
        - label: Thiel 牵头的投资团
          value: 2
        - label: 未披露条款
          value: -2
        - label: 无客户 / 无收入
          value: -3
        - label: 单位经济未验证
          value: -3
        - label: 海上存活风险
          value: -3
    approximationNotes: 数值是投委会评分中方向性的增减，量表为 -3 到 +3，不代表估值金额。
    claimRefs:
      - CV003
      - CV007
      - CV009
      - CV015
      - CV016
      - CV020
      - CV025
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由于验证成败近乎二元、资本强度高，情景价值从可能归零到数十亿美元级期权都有。
    data:
      items:
        - label: 悲观：经济性跑不通
          low: 0
          high: 250
        - label: 基准：试点缓慢跑通
          low: 750
          high: 1250
        - label: 乐观：海上算力规模化
          low: 3000
          high: 8000
    approximationNotes: USD 百万美元区间只是基于明确假设的示意性情景带；具体持股比例和投后估值未披露。
    claimRefs:
      - CV003
      - CV015
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: KPI 指标组给市场拉动和投资人质量打高分，但验证、客户和估值证据得分低。
    data:
      items:
        - label: 市场拉动
          value: 8
          unit: score / 10
        - label: 产品验证
          value: 3
          unit: score / 10
        - label: 客户验证
          value: 1
          unit: score / 10
        - label: 单位经济验证
          value: 2
          unit: score / 10
        - label: 投资人质量
          value: 8
          unit: score / 10
        - label: 风险负担
          value: 8
          unit: score / 10 high=risky
        - label: 建议评分
          value: 4
          unit: score / 10
    approximationNotes: 分数是基于所引证据汇总出的投委会定性评级，不是经审计的 KPI。
    claimRefs:
      - CV009
      - CV011
      - CV015
      - CV016
      - CV020
      - CV025
      - CV034
