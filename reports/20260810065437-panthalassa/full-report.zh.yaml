  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 牛
        - Ocean-3 验证廉价可靠算力；客户签约；制造放量。
        - 如果 AI 电力需求愿意为离岸容量付费，公司就是数十亿美元级基础设施期权。
        - 重复部署、运行时间和已签约需求。
        - 若经济性和合同持续叠加，则无触发。
      - - 基准
        - 试点跑通，但制造和客户转化偏慢。
        - 在投资者等待规模化证据时，约 $1B 标记得以维持。
        - 遥测数据正面，但收入转化有限。
        - 下一轮持平，或带结构化条款。
      - - 熊
        - 生存性、延迟、LCOE 或维护经济性失效。
        - 叙事虽强，仍可能降价融资、困境出售或减记。
        - 试点错过、没有客户，或成本栈高于目标。
        - 避免追加新钱；可行时通过二级市场退出。
    notes: 区间是情景带，不是目标价；取决于未披露条款和未经证明的技术里程碑。
