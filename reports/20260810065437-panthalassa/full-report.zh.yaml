            body: >-
              护城河在概念上真实存在，但耐久性尚未证明。Panthalassa
              拥有一个有差异化的垂直整合故事：量产钢制节点、自主定点保持、波浪发电、板载算力和卫星回传。风险清单主要由一个事实主导：海洋系统和海上算力过去很难成为具备经济性的基础设施平台。Project Natick
              给出了强技术结果，却已退出；New Scientist 强调盐雾和波浪条件严酷，也强调必须在经济性上打败传统数据中心；OTEC
              等历史海洋能源实验则说明，天气和海浪可能在实现净发电之前摧毁基础设施。商品化风险同时压在产品两侧：波浪发电诀窍可在海洋能源同行间扩散，算力买方也能在超大规模云和新云之间多云使用。在 Ocean-3
              和早期客户合同证明正常运行时间、单位成本和监管路径之前，Panthalassa 应被视为具备竞争差异化，但尚未受到护城河保护。
