  - id: TR005
    title: 缓释措施与叫停标准表
    columns:
      - 风险
      - 监测指标
      - 阈值 / 事件
      - 行动含义
    rows:
      - - Ocean-3 生存性
        - 独立的运行时间、检查和按天气归一化的性能日志
        - 试点无法在代表性海况中持续安全运行
        - 不要资助商业船队；退回工程验证阶段。
      - - 腐蚀 / 生物污损退化
        - 检查报告、冷却温差、阻力 / 定位功耗、涂层状况
        - 材料退化或污损需要频繁上船干预
        - 按更高 O&M 重估经济性，或停止扩大部署。
      - - 电力与联网可靠性
        - 电力可用性、Starlink 运行时间、延迟和故障恢复
        - 中断超过客户 SLA 容忍度，或需要人工离岸干预
        - 仅限非关键工作负载，或暂停客户承诺。
      - - 客户转化
        - 已签 LOI、付费试点、利用率和工作负载匹配度
        - Ocean-3 验证窗口结束后仍无锚定客户或付费试点
        - 将估值视为缺乏支撑；下一轮前要求拿到战略客户。
      - - 监管 / 法律阻滞
        - 许可矩阵、机构反馈、Jones Act 船舶方案、诉讼状态
        - 关键审批路径受阻，或服务物流不可行
        - 迁移部署、重做运营设计，或停止美国扩张计划。
      - - 单位经济性
        - 计入资本开支、维护、保险、卫星和 GPU 更新后的交付算力成本
        - 试点数据出来后，成本仍远高于目标，或波浪能 LCOE 差距仍在
        - 没有新的经济性证据，不要按 $1bn 级估值投资。
    notes: 叫停标准把主要剩余风险转成可监测阈值，便于投资委员会分阶段决策。
