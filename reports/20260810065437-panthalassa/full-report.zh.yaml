  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序和剩余暴露
        blocks:
          - type: paragraph
            body: >-
              Panthalassa 的风险栈更偏向技术和运营生存能力，而不是普通软件执行。最高级别暴露在于：一座 85
              米钢制、自主、承载算力的节点，能否在开阔海域扛住腐蚀、生物污损、波浪载荷、风暴损伤和定点保持要求，同时维持电力、冷却、网络和 GPU
              可靠性。公司有实质设计缓释：简单钢结构、少量外露运动部件、无海底输出电缆、无锚、无发动机，并用分阶段原型走向
              Ocean-3。这些缓释真实存在，但还不成熟，因为投资逻辑依赖承载算力的节点穿越数月海况，而不只是此前的能源试验。实际含义是，公司应按试点闸门约束的前沿基础设施赌注来投资判断。若 Ocean-3
              在生存能力或维护画像上失败，会直接传导为更低利用率、更高维护船成本、收入延迟和明显更弱的估值逻辑。
