  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和买方工作流
        blocks:
          - type: paragraph
            body: >-
              Panthalassa 不是在销售传统波浪能电站、购电协议或海上数据中心外壳。产品是一个自主漂浮节点，把海浪运动转成板上电力，并立即用这些电力在海上运行 AI 芯片。放到客户工作流里，买方会把合适的 AI
              任务路由到 Panthalassa
              容量，节点在密封海洋算力模块内执行推理或更长时间的算力工作负载，再通过卫星回传把结果送回陆地。公司明确声称电力永不输出上岸，因此客户收益不是更便宜的电网电，而是绕开土地、电网并网、冷却水和许可瓶颈的算力。这使工作负载选择成为核心：延迟出结果的推理、仿真和其他批处理类任务，比时延敏感的聊天机器人或搜索流量更适配。因此，产品必须作为一套耦合服务工作流来尽调，横跨海上发电、远程算力运营、卫星网络和客户任务编排，而不是作为单独的海洋发电机。
