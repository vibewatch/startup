        - 标的公司，也是直接定价语境。
        - 确切投后估值和优先权未披露。
      - - Starcloud
        - 据报融资 $170M、估值 $1.1B
        - 前沿非地面数据中心类比。
        - 太空数据中心不是海洋波浪算力。
      - - CoreWeave
        - 上市 AI 云基础设施公司
        - 体现 AI 算力容量的需求侧价值。
