      - number: '7.5'
        title: 团队、执行缓释与击穿论点的触发项
        blocks:
          - type: paragraph
            body: >-
              执行风险有部分缓释：团队来自航空航天、船舶设计、软件、制造、军方和研究机构，投资财团也够深，能资助更多迭代。风险仍然实质存在，因为公开来源把公司重心放在两位联合创始人身上，治理或董事会披露有限，许多具体运营控制仍不透明。Panthalassa
              在 New Scientist 发表前也没有回应其带怀疑色彩的技术问题，因此独立尽调比媒体层面的背书更有价值。监控计划应当明确：要求独立 Ocean-3 遥测、扣除寄生负载后的净输出、Starlink
              可用性和延迟日志、腐蚀试片或检查报告、生物污损与冷却衰减数据、每个节点的服务船天数、安全事故、许可里程碑、签约客户转化，以及更新后的单位经济桥接。若试点无法达到生存能力、服务节奏、客户转化、监管许可或成本目标，投资论点就会失效。
