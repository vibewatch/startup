      - number: '8.5'
        title: 可比估值背景
        blocks:
          - type: paragraph
            body: >-
              可比集合只有在清楚标注不完美时才有用。Starcloud 是最接近的叙事类比，因为它在推进非地面数据中心时，据报道估值达到 $1.1 billion，但太空和海洋的执行风险不同。CoreWeave 可作为需求侧
              AI 云参照，但它已经上市，成熟度远高于 Panthalassa。Crusoe 是 AI 基础设施类比，不过本次材料中关于其准确估值标记的公开证据较薄。CorPower Ocean 和 Eco Wave
              Power 是相关波浪能同业，但它们出售的是并网或沿海波浪电力，而不是海上算力。这些参照能三角定位期权价值和风险偏好；它们不能证明 Panthalassa
              的价格。最诚实的结论是，前沿基础设施市场可以很早给出独角兽标记，但商业证明决定这些标记会复利还是坍塌。
