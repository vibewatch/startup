          tone: positive
        - date: '2021-01-01'
          label: Ocean-1
          detail: 首个原型部署在 Strait of Juan de Fuca。
          tone: positive
        - date: '2024-01-01'
          label: 约 70 名员工
          detail: 原型阶段团队扩张。
          tone: neutral
        - date: '2025-01-01'
          label: Puget Sound 测试
          detail: 测试约 50 kW 原型。
          tone: positive
        - date: '2026-05-04'
          label: Series B 轮
          detail: Peter Thiel 领投 $140M；累计融资约 $210M。
          tone: positive
        - date: '2026-08-01'
          label: Ocean-3 试点
          detail: 计划在北太平洋部署试点节点。
