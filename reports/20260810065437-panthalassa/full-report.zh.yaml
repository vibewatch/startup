  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              投资结论是继续研究 / 跟踪，而不是买入。Panthalassa 具备风投式期权的形态，押注的是一个真实瓶颈：AI
              算力受电力约束，如果海上波浪供能基础设施能绕开电网和土地瓶颈，就可能有价值。当前公开记录不足以支撑以隐含近独角兽估值投入新资金。公司有一轮 Peter Thiel 领投的 $140 million Series
              B，累计融资约 $210 million，但准确投后估值、优先权和完全摊薄所有权没有披露。公司也仍处于收入前，没有公开披露客户，也尚未展示独立的商业规模 Ocean-3
              表现。即便上行期权有意义，入场价格纪律也难以判断，甚至可能已经偏高；风险评级为高。
            claimRefs:
