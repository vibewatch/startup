      - number: '5.4'
        title: 差异化、护城河和关键依赖
        blocks:
          - type: paragraph
            body: >-
              最强差异化在于融合两个通常分开的硬系统：同一自主船体上的波浪能发电和 AI 算力消耗。传统波浪项目通常尝试输出电力；传统数据中心在岸上解决土地、电网、冷却和人员约束；Project Natick
              等水下数据中心类比验证密封海洋算力，但不验证自主波浪发电。如果 Panthalassa
              的护城河最终出现，它将落在海洋工程诀窍、船体和压载设计、制造复制、远程运营软件、热集成，以及在能量密集波浪资源区运行的能力上。依赖地图同样苛刻。它依赖钢材制造和涂层、涡轮与电力电子可靠性、GPU
              供给、密封容器热设计、Starlink 或可比 LEO 连接、海洋天气运营，以及许可或环境接受度。若干指标仍是愿景型：最高 90% 电力可用性、低成本能源，以及一座能达到 GW
              级年节点产出的工厂。这些主张创造上行空间，但在成为耐久产品优势之前，需要带仪表的船队证明。
