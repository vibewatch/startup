      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              核心论点不是泛泛的波浪能故事，而是共址逻辑。Panthalassa
              想在海上用电、出售算力，避开拖慢陆地数据中心的输电、土地、冷却和电网并网问题。如果公司真能交付低成本、高可用能源，并把它封装成有用的推理容量，就可能在电网之外创造基础设施价值。反向论点也很直接。波浪能市场很小，经济性难做；海洋会腐蚀设备，维护成本高；LEO
              延迟会限制工作负载；陆上 AI 云巨头在规模、采购、软件和客户上都有优势。投资方支持的经济模型不是客户证明，论点要先拿到现场数据和管线证据，才会变成可定价的投资案。
