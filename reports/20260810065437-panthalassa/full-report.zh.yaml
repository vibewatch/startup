            body: >-
              画像对比显示，在保留公司中，Panthalassa 是唯一声称把波浪发电和板载 AI 算力放进同一商业架构的公司。CorPower 通过 10–30MW CorPack
              集群给出更清晰的公用事业级波浪阵列包装；Oscilla 拥有专利支撑的 Triton 波浪能转换器；Eco Wave Power 具备上市公司能见度和 404.7 MW
              管线；Aikido、NetworkOcean、Natick、Highlander 和 Subsea Cloud 则从冷却、漂浮平台或海底角度切入海上数据中心问题。Microsoft Project Natick
              是最成熟的公开证明，显示服务器可以在海底运行，包括一次 864 台服务器部署，故障率低于陆上对照组；但同一项目已不再活跃，这削弱了「技术成功意味着商业延续」的假设。因此，功能地图给 Panthalassa
              高广度、低证明；陆上新云则相反，商业成熟度高，但没有自主海洋可再生能源护城河。
