      - number: '5.3'
        title: 部署成熟度、集成和路线图
        blocks:
          - type: paragraph
            body: >-
              Panthalassa 的公开成熟度应评为从原型到试点，而不是商业化。序列从 2021 年 Ocean-1 开始，经过 2024 年 Ocean-2 和 Wavehopper 原型活动、2025 年报告中的
              Puget Sound Ocean-2 近 50 千瓦测试，再到计划于 2026 年在北太平洋开展 Ocean-3 试点系列，用于演示 AI 推理并优化制造。商业部署目标约在 2027
              年，长期愿景则是数千个节点。集成不是简单安装动作：它需要沿海工厂生产、拖出或下水物流、自主定点保持、远程监控、卫星连接、天气航线规划、维修流程、GPU
              载荷采购和客户工作负载调度。由于已有原型和融资，路线图主张值得跟踪；但它还不能作为服务等级产品来放进银行级模型，因为公开来源没有披露正常运行时间、维修间隔、船队遥测、环境许可或客户验收测试。正确的投资判断姿态是低到中等
              TRL，并把 Ocean-3 作为重大证据检查点。
