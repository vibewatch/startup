      - CE036
      - CE041
      - CE042
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 发电和原型证据领先；信任、安全、商业 SLA 和舰队运营验证滞后。
    data:
      columns:
        - 公开成熟度
        - 证据强度
        - 主要缺口
      rows:
        - label: 波浪到电力机制
          values:
            - 原型 / 试点
            - 中
            - 远海 Ocean-3 输出和可用性。
        - label: 密封海上计算
          values:
            - 概念 / 类比支持
            - 中
            - 实测 PUE、热管理、进水和芯片可靠性。
        - label: 自主运行 / 定点保持
          values:
            - 原型主张
            - 低
            - 舰队遥测和异常事件响应。
        - label: 卫星回传
          values:
            - 可用依赖
            - 中
            - 延迟、带宽、故障切换和数据安全控制。
        - label: 制造规模
          values:
            - 愿景性计划
            - 低
            - 节点规模下的工厂吞吐量和可重复成本。
        - label: 商业服务 / SLA
          values:
            - 尚未证明
            - 低
            - 客户、定价、正常运行时间、合规和支持承诺。
    approximationNotes: 能力成熟度是基于公开证据的分析师分类，不是公司披露的 TRL 评分。
    claimRefs:
      - CE021
      - CE023
      - CE024
      - CE028
      - CE029
      - CE039
      - CE043
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 潜在买方从 AI 电力痛点走向离岸计算扩张；客户验证在转化步骤仍缺失。
    data:
      nodes:
        - id: j1
          label: 电力受限的 AI 买方识别容量需求
        - id: j2
          label: 买方筛选可容忍延迟和带宽限制的工作负载
        - id: j3
          label: Panthalassa 分享 Ocean-3 现场数据和安全架构
        - id: j4
          label: 应出现设计伙伴试点或容量预留，但公开信息没有
        - id: j5
          label: 采购审查可靠性、保险、数据路径和海事运营风险
        - id: j6
          label: 在可衡量的正常运行时间和经济性出现后，扩张才会增加节点或舰队
    approximationNotes: 旅程根据目标买方工作流推断，因为 Panthalassa 未披露客户。
    claimRefs:
      - CU001
      - CU005
      - CU013
      - CU032
      - CU041
      - CU044
      - CU045
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 需求信号广泛，但公开证据在已签客户、试点和收入处归零。
    data:
      items:
        - label: 已识别需求侧目标细分
          value: 4
          detail: 超大规模、neocloud、AI 实验室、托管数据中心类比。
        - label: 保留需求代理指标
          value: 4
          detail: Deloitte、超大规模、AWS 和 Azure 来源。
        - label: 技术原型里程碑
          value: 3
          detail: Ocean-1、Ocean-2 和 Wavehopper 海试证据。
        - label: 计划中的 Ocean-3 试点系列
          value: 1
          detail: 产品试点计划于 2026 年。
        - label: 已披露客户试点或 LOI
          value: 0
          detail: 无公开客户试点或 LOI。
        - label: 已披露签约客户 / 收入
          value: 0
          detail: 无公开客户或收入证明。
    approximationNotes: 计数汇总公开证据类别，不代表内部 pipeline。
    claimRefs:
      - CU007
      - CU008
      - CU018
      - CU019
      - CU021
      - CU024
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 市场需求证据质量强，但客户赢单、结果、留存和生产成熟度证据弱。
    data:
      columns:
        - 签约客户？
        - 需求代理质量
        - 结果具体性
        - 留存可见度
      rows:
        - label: Deloitte / IEA / SemiAnalysis 需求证据
          values:
            - 否
            - 高
            - 仅市场层面
            - None
        - label: AWS / Azure / 超大规模参考
          values:
            - 否
            - 中高
            - 仅细分层面
            - None
        - label: Panthalassa 公告和媒体
          values:
            - 否
            - 中
            - 仅产品里程碑
            - None
        - label: 不利的可靠性 / 延迟评论
          values:
            - 否
            - 风险维度高
            - 指出阻碍因素，而非结果
            - None
    approximationNotes: 矩阵对证据类别做定性评分，因为没有客户案例研究。
