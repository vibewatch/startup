              Panthalassa 于 2026 年 5 月 4 日宣布完成 $140M Series B 轮融资，由 Peter Thiel 领投，已披露累计融资约 $210M。Financial Times
              将公司称为「估值 $1bn 的海洋数据中心初创公司」，暗示接近独角兽估值，但保留来源没有披露精确的投后估值。投资团混合了回投方，包括 Founders Fund、Gigascale
              Capital、Lowercarbon Capital、Unless 和 WovenEarth，也有一批新的深口袋投资者，包括 John Doerr、Marc Benioff 的 TIME
              Ventures、Max Levchin 的 SciFi Ventures、Susquehanna Sustainable Investments、Hanwha Group、Fortescue
              Ventures、Super Micro Computer、Sozo Ventures 和俄勒冈本地基金。相关特殊目的载体在 2026 年提交了 SEC Form D
              通知，披露的是较小的配售池，而非完整轮次。相较估算的此前融资，Series B 轮是资本台阶式上行，支撑公司从海试原型迈向首个商业试点。
