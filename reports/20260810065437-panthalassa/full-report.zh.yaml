  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 维度
      - 论点
      - 反论点
      - 改变判断的证据
    rows:
      - - 市场
        - AI 电力需求制造了大型算力选址瓶颈。
        - 波浪能市场很小、也很早期。
        - 独立客户对可容忍延迟的离岸推理有需求。
      - - 产品
        - 海上共址绕开土地、电网和用水约束。
        - 海上维护和 Starlink 延迟可能限制可用工作负载。
        - Ocean-3 遥测显示算力和联网可靠。
      - - 财务
        - $140M Series B 轮为制造和首批部署供血。
        - 公司尚无收入、资本开支重，且未披露客户合同。
        - 可信 AI 买家签下收入合同、包销协议或 LOI。
      - - 单位经济性
        - $0.02/kWh、$1,500/kW 和高可用性可能形成成本优势。
        - 目标未经独立证明，且可能漏掉维护、保险和物流。
        - 经审计的船队级成本、运行时间和维护数据。
      - - 竞争
        - 尚无直接同行把自主波浪发电和算力结合起来。
        - 陆上 AI 云既有玩家和其他前沿 DC 概念生态更强。
        - 清晰的工作负载细分场景和性价比证据。
      - - 风险
        - 投资者财团能为迭代供血。
        - 腐蚀、风暴、生物污损和远程维修可能吞掉回报。
        - 穿越恶劣海况事件的生存记录。
    notes: 论点综合市场、产品、财务、客户、竞争和风险证据；所有判断变化都应由尽调闸门触发。
