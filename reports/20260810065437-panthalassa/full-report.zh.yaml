      - number: '7.3'
        title: 合作伙伴、平台、供应商与客户依赖
        blocks:
          - type: paragraph
            body: >-
              合作伙伴依赖集中在几处可能变成二元卡点的环节。通信依赖 Starlink 或类似 LEO
              回传，现有证据显示，延迟和带宽会决定工作负载组合，因此近期产品更适合可容忍延迟的推理或批处理任务，而不是低延迟消费者应用。硬件敞口同样重要：Panthalassa 需要合格
              GPU、服务器、电力电子设备、密封计算容器，并且要在海洋环境里可靠更换载荷。Super Micro
              被列为投资方，但本次留存来源并未把这一点转化为已承诺的供应协议。公司还依赖监管方批准或容忍部署海域，依赖资本方在收入前资助制造，依赖未来超大规模云厂商或 AI
              实验室客户把试点转成收入。由于公司没有披露付费客户，如果试点成功，早期收入可能集中在一两个大买方。
