  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、替代方案和可能进入者
        blocks:
          - type: paragraph
            body: >-
              Panthalassa 很难干净地映射到单一竞争类别。最接近的发电侧同行是 CorPower Ocean、Oscilla Power、Eco Wave Power、C-Power、Marine Power
              Systems、Wave Swell Energy 和 Carnegie Clean Energy 等波浪能开发商，但它们公开的产品表述主要强调发电，而不是在海上销售 AI 算力。最接近的算力侧同行是
              Aikido、NetworkOcean、Microsoft Project Natick、Subsea Cloud、Highlander Hailanyun 以及 Mitsui O.S.K.
              船载研究等漂浮、水下或船载数据中心概念；但这些替代方案通常依赖海上风电、海底冷却、驳船或船舶，而不是 Panthalassa 式的自主波浪供电节点。现状仍是陆上超大规模数据中心、GPU
              云新云、内部自建、电网电力，以及新兴的核电或面向数据中心的 SMR 方案。Starcloud
              是有用的前沿类比，因为它在太空推进远程可再生能源供电算力，说明当地面约束看起来具有约束力时，投资者会为非陆地基础设施买单。
