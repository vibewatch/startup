      - number: '7.4'
        title: 财务、模型与单位经济风险
        blocks:
          - type: paragraph
            body: >-
              财务风险与海上生存能力紧紧绑在一起。公开融资事实很强：Panthalassa 2026 年 5 月宣布 $140 million Series B，累计融资约 $210
              million。但这笔资金要在公司披露收入或付费客户之前，完成试点制造、部署 Ocean-3、证明海上推理可行，并降低制造和维护的不确定性。管理层和投资方材料给出诱人目标，包括约 $1,500/kW
              的资本开支、高容量因子、低成本电力，以及可扩到约 1 GW/年的工厂。反方观点是，腐蚀、生物污损、保险、海上维护、船舶天数和 GPU
              服务物流都可能抹掉模型收益。即便波浪能在物理上很丰富，投资判断要看的也不是总波浪资源，而是扣除寄生负载和服务干预后的交付算力成本。
