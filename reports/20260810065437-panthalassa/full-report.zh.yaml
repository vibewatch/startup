              年的商业部署目标。公司早期探索过制氢或清洁燃料，后来把重点转向 AI
              算力，并提出长期愿景：部署数千个自主节点。与这种势头相对，公司仍未产生收入，也没有公开披露付费客户；独立评论者提醒，腐蚀性强、机械环境恶劣的海洋条件会带来真实执行风险，Panthalassa
