      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图跟随云和 AI 基础设施预算，而不是公用事业采购。AWS、Azure 和 Google 等超大规模云厂商是最显然的原型，因为它们大规模购买数据中心容量、电力、网络和硬件。新云和 AI
              算力专门服务商也合理，因为它们把稀缺 GPU 容量变现；只要经济性和可靠性成立，它们可能容忍非传统选址。AI
              实验室更可能是用户而非唯一付款方，除非它们直接签约购买批处理或推理容量。采用应从试点、非关键任务批处理和容量预留开始；海上自主节点必须先证明正常运行时间、安全、远程可维护性和网络性能，生产工作负载才会迁移。卫星回传让低时延交互式服务不适合作为第一用例；批量推理、训练相关任务或可容忍延迟的工作负载更可信。预算归属可能横跨云基础设施、数据中心容量规划、AI
              基础设施和战略能源采购。
