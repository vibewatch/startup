  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和替代方案
        blocks:
          - type: paragraph
            body: >-
              Panthalassa 不能按整个波浪能市场或整个云计算市场来估算。可投资边界是由海洋波浪能供电、部署在海上的 AI
              算力：公司在自主节点上发电，并在板上消耗电力来销售算力容量。因此，纳入的支出覆盖整套集成栈：波浪能转换、海上部署、冷却和电力调节、板载 AI
              服务器、网络回传以及商业算力服务。排除的支出包括把电力输送上岸的传统波浪发电项目、一般可再生能源发电，以及普通数据中心建设，除非这些支出正被海上算力替代。相关现状是接入电网电力的陆上超大规模或托管容量；邻近替代方案包括海上风电、漂浮光伏、核电或
              SMR 支撑的数据中心，以及普通电网采购。这个边界刻意收窄，因为市场命题依赖于用同址海洋发电解决 AI 电力瓶颈，而不是证明所有海洋能源都是大市场。
