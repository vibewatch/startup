      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景分析给出的区间很宽，因为一个技术证明点就可能改变公司的风险类别。牛市情景下，Panthalassa 展示有用的海上推理，证明生存能力，并表明其 $0.02/kWh
              和高可用目标经得住真实维护、保险和物流成本。那可能支撑数十亿美元级基础设施期权价值。基准情景下，试点跑通，但规模化缓慢且吃资本，因此隐含约 $1 billion
              的估值只能维持，投资人等待订单和可重复制造。熊市情景下，腐蚀、生物污损、风暴、延迟或波浪能 LCOE 让系统不具经济性，陆基替代方案胜出。下行触发因素不是想象力不够，而是现场经济性无法足够快地收敛。
