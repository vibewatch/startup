            body: >-
              公开记录在核心运营指标上很稀疏。收入、ARR、毛利率、贡献毛利、营运资本、CAC、销售回本、现金余额、burn、runway、客户合同、利用率、活跃用户和项目融资条款都缺失。对一家私有、未产生收入的前沿基础设施公司而言，这种缺失并不意外，但它阻止了常规软件、能源或数据中心投资判断。正确处理方式是保留
              null，而不是用融资公告或投资者引述倒推出隐含值来填补。财务尽调请求清单应从管理账、银行余额和 runway、客户管线和合同草案、节点 BOM、维护预算、保险报价、GPU 采购和折旧假设，以及 Ocean-3
