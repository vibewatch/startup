        - 制约因素
        - 近期
        - 商业收入出现前需要大量融资。
        - 压测工厂资本开支、GPU 采购和海上运营预算。
      - - 时延和网络
        - 制约因素
        - 近期
        - 早期采用会先偏向批处理或可容忍延迟的工作负载。
        - 按工作负载逐项跑时延和吞吐试验。
      - - 监管、海事和信任门槛
        - 制约因素
        - 当前至中期
        - 即使不向电网外送，也可能拖慢试点和生产转化。
        - 获取许可路线图、保险、安全、可用率和客户验收标准。
    notes: 驱动因素和制约因素都挂钩采用节奏与尽调问题，因为只有买家把算力短缺认知转成海上合同，市场才算真实。
