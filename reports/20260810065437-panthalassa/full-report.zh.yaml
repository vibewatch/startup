  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 投后估值与条款
        - 确切投后估值、优先权、期权池、按比例跟投权和持股比例。
        - 决定入场价格、稀释和目标回报。
        - 索取条款清单和股权结构表。
      - - 试点结果
        - Ocean-3 电力、运行时间、算力、冷却、延迟和自主运行数据。
        - 把原型叙事转成可支撑投资判断的证据。
        - 审查遥测、日志和第三方测试报告。
      - - 客户管线
        - LOI、付费试点、工作负载画像和定价。
        - 尚无收入的公司需要需求证明。
        - 访谈管线客户并做客户尽调。
      - - 单位经济性
        - 每 kW 资本开支、维护、保险、船舶成本、利用率和毛利率。
        - 决定 $0.02/kWh 能否支撑算力经济性。
        - 用供应商报价和海试数据搭建自下而上的船队模型。
      - - 生存性
        - 风暴、腐蚀、生物污损、盐水侵入和维修历史。
        - 海上可靠性是核心熊情景。
        - 检查测试记录和独立海洋工程评审。
      - - 退出路径
        - 战略买家兴趣、IPO 准备度、治理和资本计划。
        - 界定持有期和融资依赖。
        - 访谈潜在买家，并审查董事会 / 治理材料。
    notes: 尽调要求针对尚未解决的证据缺口，应在任何买入建议前完成。
