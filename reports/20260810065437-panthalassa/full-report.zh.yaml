        title: 收入模式：算力优先，燃料可选，收入缺席
        blocks:
          - type: paragraph
            body: >-
              Panthalassa 的财务故事从一个清晰区分开始：它没有公开向岸上售电。公司称，其自主节点在海上产生波浪电力，并在板上消耗这些电力来运行 AI 芯片，再通过卫星把推理 token
              返回陆地。这让近期收入假设成为一种算力容量服务，而不是带有电网售电协议的传统电力项目。投资者和公司材料仍为清洁燃料或氢气作为丰富海洋电力的未来用途留出空间，但 2026 年融资叙事和 Ocean-3
              里程碑集中在海上 AI 推理。没有保留来源披露确认收入、ARR、按 token、GPU 小时或预留计费的定价，也没有披露清洁燃料产出。正确的尽调姿态是把今天的收入建模为零，并把每一种变现机制都视为取决于
              Ocean-3 证明和首批商业合同。
