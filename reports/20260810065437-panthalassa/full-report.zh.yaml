      - - 波浪能装机基数很小
        - 制约因素
        - 当前
        - 抬高供给侧执行的规模和可靠性风险。
        - 将 Ocean-3 的发电输出和可用率与波浪能市场预测对标。
      - - 海洋能源 LCOE 偏高
        - 制约因素
        - 当前
        - 除非一体化算力经济性跑赢通用波浪能基准，否则 ROI 会被削弱。
