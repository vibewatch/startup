      - number: '5.2'
        title: 节点资产和运营架构
        blocks:
          - type: paragraph
            body: >-
              对一家早期硬科技公司而言，公开架构异常具体。Ocean-3 被描述为一座约 85 米的钢板结构，形状像高尔夫球放在球座上；投资者报道称，上部为约 50
              米球体，水面以下有长颈结构。海浪抬升和降低该结构时，海水被迫沿中央管道进入内部水库，再通过单个涡轮排出发电。这些电力为密封 AI 服务器供电，服务器借助周围海水冷却。Ocean-2 是较小的原型类比，上部球体约
              9 米；公开报道显示，它在 Puget Sound 条件下最高约 50
              千瓦。因此，架构图应被理解为一个垂直整合资产：船体、波浪泵、水库、涡轮、电力电子、密封算力、海水换热、自主系统和卫星通信。设计可能优雅，因为它减少运动部件并避免岸上电缆；但商业证明仍取决于开阔海域条件下的生存能力、维护和实测输出。
