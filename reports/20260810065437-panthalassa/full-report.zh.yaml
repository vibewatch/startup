      - number: '3.4'
        title: 切换成本、多云使用和供给获取
        blocks:
          - type: paragraph
            body: >-
              对目标 AI 算力买方而言，切换成本看起来取决于工作负载，而不是绝对刚性。批量推理、离线训练支持和可中断工作负载，比面向用户的低时延服务更容易跨提供商路由；这支持多云使用，但限制锁定。Panthalassa
              如果控制稀缺清洁电力容量、能在能量密集的波浪区域稳定运行，并暴露熟悉的云接口，就可能形成锁定；如果时延、带宽或信任约束让客户把主要工作负载留在陆上，它也可能成为二级容量提供商。合作伙伴准入同样有希望但未验证。Super
              Micro Computer 出现在投资者名单中，对硬件供给是方向性利好；Aikido 和 Starcloud 也显示，与 NVIDIA
              相关的生态正在主动接触远程算力概念。这些都不能证明配额、客户承诺或定价权，因此合作伙伴尽调应聚焦 GPU 采购权、服务协议、卫星带宽、保险和维护物流。
