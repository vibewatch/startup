      - number: '2.4'
        title: 增长驱动、约束和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              多头逻辑由 AI
              电力稀缺、并网延迟、土地约束、脱碳压力以及对主权算力容量的战略兴趣驱动。这些因素影响估值，因为如果替代方案是等几年拿土地、电网接入和购电协议，非传统选址就可能具备经济相关性。约束同样重要。商业波浪能仍处早期；一般海洋能源
              LCOE 约 $388–$618 / MWh，远高于主流太阳能或风能基准；海上结构和 GPU 载荷带来重大资本密集度；监管、海事、环境和信任门槛，即使没有岸上送电，也可能拖慢采用。Panthalassa
              及其投资者引用的是愿景型经济性，包括低目标电力成本和工厂规模节点生产；但保留的公开来源没有披露已签客户、定价、节点级正常运行时间、已签容量或经验证的单位经济。尽调因此应保留相互矛盾的估计，而不是把它们抹平：巨大的
              AI 用电需求是真实的，波浪能部署量很小也是真实的，Panthalassa 的实际 SAM / SOM 取决于试点结果和买方信任。
