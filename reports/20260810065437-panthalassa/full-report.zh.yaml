            body: >-
              保留来源对创始信息的表述一致。Panthalassa 成立于 2016 年，由联合创始人兼 CEO Garth Sheldon-Coulson 领导；他曾任 Bridgewater Associates
              高级投资助理和 AI 研究员。另一位联合创始人兼首席创新官 Brian Moffat 是海洋能源研究员，曾在 Spindrift Energy 研究波浪能，并拥有 UC Irvine
              三个理学学士学位。两人的组合支撑创始人与市场的匹配：一端是资本市场与 AI
              能力，另一端是海洋波浪能工程。公开披露突出这种工程导向的领导层，而不是庞大的具名高管团队或已披露董事会名单；这使治理能见度偏低，也把执行风险集中在两名关键人物身上。考虑到从原型到商业船队要走十年级别、资本密集的路径，关键人物集中是重要尽调事项。
