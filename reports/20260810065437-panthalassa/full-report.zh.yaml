  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品模式和运营足迹
        blocks:
          - type: paragraph
            body: >-
              Panthalassa
              将自己定义为一家位于俄勒冈州波特兰、正在打造全新能源与算力基础设施的公司：自主漂浮平台，公司称为节点，捕获海洋波浪能并转成电力，直接在海上运行人工智能数据中心。公司并不把电送上岸，而是主张把发电和算力放在同一个海上结构上，销售
              AI 算力容量，从而绕开电网并网排队和土地约束。多家 2026 年来源显示，公司总部在波特兰，原型和海试活动分布在太平洋西北地区，包括 Juan de Fuca 海峡和 Puget
              Sound。公司以公益公司形式组织；2026 年 5
              月融资被主流科技、气候和商业媒体广泛报道，说明它虽处早期，却已有较高公开能见度。落到实践层面，每个节点设计为可在海上自主运行，海浪驱动发电系统和算力载荷装在同一结构上，因此不需要海底电缆或电网并网。该架构就是公司叙事的核心：把算力放到海上能源丰富的地方，而不是在岸上争夺稀缺土地、电网容量和并网审批。
