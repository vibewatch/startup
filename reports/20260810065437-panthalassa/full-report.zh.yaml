      - number: '2.2'
        title: 双重口径估算：巨大的 AI 需求与很小的波浪供给
        blocks:
          - type: paragraph
            body: >-
              最有用的估算方法是用两副镜头，并拒绝把单位混在一起。需求口径极大：IEA 预计，到 2030 年数据中心用电需求可能达到约 945 TWh / 年，SemiAnalysis 也把能源可得性视为 AI
              基础设施的核心约束。这个口径支撑能源背书算力容量的超大 TAM，但不能证明 Panthalassa 能服务这个市场。供给口径小得多：Mordor 估计，波浪能部署量将从 2026 年约 10 MW 增至 2031
              年约 125 MW，其他分析机构也把它描述为高增长但早期的市场。Panthalassa 的 SAM 是两副镜头的交集，即波浪供电的海上 AI 算力。可支撑的近期 SOM 更窄：2026–2027
              年的试点和早期商业节点，而不是全球 AI 用电需求的船队级百分比。因此，本章分别保留 TWh、MW 和节点数单位，而不是产出一个膨胀的单一 TAM 数字。
