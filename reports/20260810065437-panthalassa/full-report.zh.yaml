      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Panthalassa 今天还没有达到退出准备度。可信 IPO
              需要收入、客户集中度披露、可重复单位经济、治理准备度，以及能把海洋算力从科学项目转成基础设施平台的公开市场叙事。战略收购只有在买方能够尽调现场表现和工作负载匹配后才合理。眼下的尽调问题因此很具体：确认投后估值和条款，检查
              Ocean-3 遥测，验证客户管线，把能源经济性与维护和保险对齐，并审阅风暴和盐水暴露下的生存能力数据。任何入场前都应明确击穿论点的触发项：Ocean-3
              部署失败、没有客户承诺、经济性显著高于目标、融资条款偏重优先权，或证据显示延迟和维护限制可服务的工作负载池。
