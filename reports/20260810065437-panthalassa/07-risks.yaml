chapter:
  number: 7
  title: Risks
  summary: >-
    Panthalassa's risk profile is dominated by open-ocean technical survivability, remote data-center reliability,
    Starlink-constrained workloads, and unproven unit economics. Regulatory and legal exposure spans BOEM/DOE
    marine-energy policy, Jones Act logistics, environmental review, and data-center litigation risk. The investment
    case should be staged to Ocean-3 pilot proof, customer conversion, permitting clearance, and delivered-cost kill
    criteria.
sections:
  - id: severity-ranking
    title: Severity ranking and residual exposure
    body: >-
      Panthalassa's risk stack is severity-skewed toward technical and operational survivability rather than ordinary
      software execution. The highest-ranked exposure is whether an 85-meter steel, autonomous, compute-bearing node can
      survive open-ocean corrosion, biofouling, wave loading, storm damage, and station-keeping demands while also
      maintaining power, cooling, networking, and GPU reliability. The company has meaningful design mitigations: simple
      steel structures, few exposed moving parts, no subsea export cable, no anchor, no engine, and staged prototypes
      leading to Ocean-3. Those mitigations are real but immature because the investment case depends on
      compute-carrying nodes operating through months of sea states, not just prior energy trials. The practical
      implication is that the company should be underwritten as a pilot-gated frontier infrastructure bet. A failed
      Ocean-3 survivability or maintenance profile would transmit directly into lower utilization, higher service-vessel
      costs, delayed revenue, and a much weaker valuation case.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR038
      - CR040
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: regulatory-legal
    title: Regulatory, legal, environmental, and policy exposure
    body: >-
      The regulatory risk is not a single permit but an overlapping offshore-energy, maritime, data-center,
      environmental, and policy system. BOEM oversees renewable energy on the U.S. Outer Continental Shelf, while DOE's
      marine-energy program frames wave energy as a sector still needing R&D, demonstration, and barrier reduction.
      Data-center legal sources add another layer: NEPA, ESA, Clean Water Act, Clean Air Act, water, waste, stormwater,
      zoning, noise, traffic, and public-land approvals can all become relevant depending on siting and design. Federal
      acceleration for qualifying data centers may help some projects, but legal commentary emphasizes that state and
      local review, community resistance, and litigation remain schedule and cost risks. The Jones Act adds a practical
      maritime constraint if U.S. domestic towing, maintenance, or spares movement occurs between U.S. ports.
      Environmental review is especially sensitive because New Scientist reports that offshore waste-heat ecosystem
      effects remain unclear.
    claimRefs:
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR041
    tableRefs:
      - TR001
    figureRefs:
      - FR002
  - id: dependencies
    title: Partner, platform, supplier, and customer dependencies
    body: >-
      The partner-dependency profile is concentrated in places that can become binary blockers. Communications depend on
      Starlink or similar LEO backhaul, and the evidence indicates that latency and bandwidth shape the workload mix,
      leaving the near-term product better suited to delay-tolerant inference or batch jobs than low-latency consumer
      applications. Hardware exposure is also material: Panthalassa needs qualified GPUs, servers, power electronics,
      sealed compute containers, and reliable payload swaps in a marine environment. Super Micro is named as an
      investor, but retained sources do not convert that into a committed supply agreement. The company also depends on
      regulators to approve or tolerate deployment zones, capital providers to finance manufacturing before revenue, and
      future hyperscale or AI-lab customers to convert pilots into revenue. Because no paying customers are disclosed,
      early revenue could be concentrated in one or two large buyers if the pilot succeeds.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR025
      - CR026
      - CR027
      - CR028
      - CR037
      - CR042
    tableRefs:
      - TR003
    figureRefs:
      - FR003
  - id: financial-model
    title: Financial, model, and unit-economics risk
    body: >-
      Financial risk is tightly coupled to survivability. The public funding facts are strong: Panthalassa announced a
      $140 million Series B in May 2026 and about $210 million total raised. But that capital is tasked with completing
      pilot manufacturing, deploying Ocean-3, proving at-sea inference, and reducing manufacturing and maintenance
      uncertainty before the company has disclosed revenue or paying customers. Management- and investor-side materials
      cite attractive targets, including about $1,500 per kilowatt capex, high capacity factor, low-cost power, and a
      factory scaling to roughly one gigawatt per year. The adverse view is that corrosion, biofouling, insurance,
      offshore maintenance, vessel days, and GPU-service logistics can erase those modeled gains. Even if wave energy is
      physically abundant, the underwriting question is delivered compute cost after parasitic loads and service
      interventions, not gross wave resource.
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR039
    tableRefs:
      - TR005
  - id: people-monitoring
    title: People, execution mitigations, and thesis-break triggers
    body: >-
      Execution risk is partly mitigated by a specialist team drawn from aerospace, naval architecture, software,
      manufacturing, military, and research organizations, and by a deep syndicate that can finance additional
      iteration. It remains material because public sources center the company around two co-founders, offer limited
      governance or board disclosure, and leave many detailed operating controls private. Panthalassa also did not
      respond to New Scientist's skeptical technical questions before publication, which increases the value of
      independent diligence rather than press-level assurance. The monitoring plan should therefore be explicit: require
      independent Ocean-3 telemetry, net output after parasitic loads, Starlink availability and latency logs, corrosion
      coupons or inspection reports, biofouling and cooling-degradation data, service-vessel days per node, safety
      incidents, permitting milestones, signed customer conversions, and updated unit-economics bridges. The thesis
      breaks if the pilot fails survivability, service cadence, customer conversion, regulatory clearance, or cost
      targets.
    claimRefs:
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
    tableRefs:
      - TR004
