    - id: CR001
      statement: >-
        Panthalassa's highest-severity risk is open-ocean survivability because its steel nodes, turbines, electronics,
        cooling surfaces, and station-keeping must work amid corrosion, biofouling, storms, and wave damage.
      type: inferred
      topic: technical-survivability
      sourceRefs:
        - SR011
        - SR009
        - SR010
        - SR018
