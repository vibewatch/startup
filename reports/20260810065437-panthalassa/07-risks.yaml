  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitoring indicator
      - Threshold / event
      - Action implication
    rows:
      - - Ocean-3 survivability
        - Independent uptime, inspection, and weather-normalized performance logs
        - Pilot cannot sustain safe operation through representative sea states
        - Do not fund commercial fleet; reset to engineering proof stage.
      - - Corrosion / biofouling degradation
        - Inspection reports, cooling delta, drag/station-keeping power, coating condition
        - Material degradation or fouling requires frequent vessel interventions
        - Re-price economics with higher O&M or stop scale-up.
      - - Power and networking reliability
        - Power availability, Starlink uptime, latency, and outage recovery
        - Outages exceed customer SLA tolerance or require manual offshore intervention
        - Limit to non-critical workloads or pause customer commitments.
      - - Customer conversion
        - Signed LOIs, paid pilots, utilization, and workload fit
        - No anchor customer or paid pilot after Ocean-3 proof window
        - Treat valuation as unsupported; require strategic customer before next round.
      - - Regulatory / legal blockage
        - Permit matrix, agency feedback, Jones Act vessel plan, litigation status
        - Material approval path blocked or service logistics infeasible
        - Relocate deployment, redesign operations, or stop U.S. scale plan.
      - - Unit economics
        - Delivered compute cost after capex, maintenance, insurance, satellite, and GPU refresh
        - Cost remains far above target or wave LCOE gap persists after pilot data
        - Do not underwrite $1bn-scale valuation without new economics.
    notes: Kill criteria convert major residual risks into monitorable thresholds for investment committee staging.
