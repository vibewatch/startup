chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Panthalassa presents itself as a Portland, Oregon company building a fundamentally new kind of energy and
              computing infrastructure: autonomous floating platforms, which it calls nodes, that harvest ocean wave
              energy and convert it into electricity to run artificial-intelligence data centers directly at sea. Rather
              than transmitting power to shore, the company’s stated model is to co-locate generation and compute on the
              same offshore structure and sell AI compute capacity, sidestepping grid interconnection queues and land
              constraints. Multiple 2026 sources place its headquarters in Portland with prototype and sea-trial
              activity across the Pacific Northwest, including the Strait of Juan de Fuca and Puget Sound. The company
              is organized as a public benefit corporation, and coverage of its May 2026 financing spans mainstream
              technology, climate, and business outlets, signaling a broad public profile despite its early stage. In
              practical terms, each node is designed to operate autonomously offshore, with the wave-driven power system
              and the compute payload housed on the same structure so that no subsea power cable or grid interconnection
              is required. That architecture is the core of the company’s pitch: siting compute where energy is abundant
              at sea, rather than competing for scarce land, grid capacity, and interconnection approvals on shore.
