      - number: '8.5'
        title: Comparable valuation context
        blocks:
          - type: paragraph
            body: >-
              The comparable set is useful only if clearly labeled as imperfect. Starcloud is the closest narrative
              analog because it reached a reported $1.1 billion valuation while pursuing non-terrestrial data centers,
              but space and ocean execution risks differ. CoreWeave is a demand-side AI-cloud reference, yet it is
              public and far more mature than Panthalassa. Crusoe is an AI-infrastructure analog, though public evidence
              in this allocation is thin for the exact valuation mark. CorPower Ocean and Eco Wave Power are relevant
              wave-energy peers, but they sell grid or coastal wave power rather than offshore compute. These references
              triangulate option value and risk appetite; they do not prove Panthalassa’s price. The most honest
              conclusion is that frontier infrastructure markets can award unicorn marks early, but commercial proof
              determines whether those marks compound or collapse.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV008
              - CV019
          - type: table
            tableRef: TV004
            claimRefs:
