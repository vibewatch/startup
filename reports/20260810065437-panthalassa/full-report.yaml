  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The investment call is research-more / track, not buy. Panthalassa has the shape of a venture-style option
              on a real bottleneck: AI compute is power constrained, and offshore wave-powered infrastructure could be
              valuable if it avoids grid and land bottlenecks. The current public record is not strong enough to
              underwrite a new-money entry at the implied near-unicorn mark. The company has a $140 million Thiel-led
              Series B and about $210 million total raised, but the exact post-money valuation, preferences, and fully
              diluted ownership are not disclosed. It is also pre-revenue, has no publicly disclosed customers, and has
              not yet shown independent commercial-scale Ocean-3 performance. That makes the price discipline
              unknown-to-stretched and the risk rating high even though the upside option is meaningful.
            claimRefs:
              - CV001
              - CV002
              - CV003
