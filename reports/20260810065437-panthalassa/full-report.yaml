      - number: '3.2'
        title: Profiles, maturity, and feature breadth
        blocks:
          - type: paragraph
            body: >-
              The profile comparison shows Panthalassa as the only retained company claiming both wave generation and
              onboard AI compute in one commercial architecture. CorPower has clearer utility-scale wave-array packaging
              through 10-30MW CorPack clusters; Oscilla has a patent-backed Triton wave-energy converter; Eco Wave Power
              has public-company visibility and a 404.7 MW pipeline; and Aikido, NetworkOcean, Natick, Highlander, and
              Subsea Cloud attack the at-sea data-center problem from cooling, floating-platform, or subsea angles.
              Microsoft Project Natick is the most mature public proof that servers can operate subsea, including an
              864-server deployment and lower failure rates than a land control group, but the same program is no longer
              active, which weakens any assumption that technical success implies commercial continuity. The feature map
              therefore gives Panthalassa high breadth and low proof, while land neoclouds invert that pattern with high
              commercial maturity but no autonomous ocean-renewable moat.
