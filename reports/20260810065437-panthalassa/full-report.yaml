      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Track the option, do not chase the mark
            body: >-
              Panthalassa has real venture optionality, but the public record does not support a firm buy at an implied
              near-$1B valuation without terms, customers, or Ocean-3 proof.
            calloutType: recommendation
            claimRefs:
