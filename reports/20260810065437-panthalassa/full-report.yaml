  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity ranking and residual exposure
        blocks:
          - type: paragraph
            body: >-
              Panthalassa's risk stack is severity-skewed toward technical and operational survivability rather than
              ordinary software execution. The highest-ranked exposure is whether an 85-meter steel, autonomous,
              compute-bearing node can survive open-ocean corrosion, biofouling, wave loading, storm damage, and
              station-keeping demands while also maintaining power, cooling, networking, and GPU reliability. The
              company has meaningful design mitigations: simple steel structures, few exposed moving parts, no subsea
              export cable, no anchor, no engine, and staged prototypes leading to Ocean-3. Those mitigations are real
              but immature because the investment case depends on compute-carrying nodes operating through months of sea
              states, not just prior energy trials. The practical implication is that the company should be underwritten
              as a pilot-gated frontier infrastructure bet. A failed Ocean-3 survivability or maintenance profile would
              transmit directly into lower utilization, higher service-vessel costs, delayed revenue, and a much weaker
              valuation case.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR038
              - CR040
