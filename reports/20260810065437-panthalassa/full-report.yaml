        title: Expansion upside comes with extreme concentration and procurement risk
        blocks:
          - type: paragraph
            body: >-
              If Panthalassa works, expansion could be powerful: the same buyer could add nodes or fleets as a capacity
              product, and demand-side evidence suggests hyperscalers and AI clouds are hunting for power-constrained
              compute. The commercial risk is that this upside concentrates future revenue in a handful of very
              sophisticated buyers with long diligence cycles, high reliability thresholds, security reviews, and
              leverage over price. Procurement friction is higher than for ordinary cloud capacity because the
              infrastructure is novel, remote, satellite-linked, and exposed to marine hazards. Super Micro Computer
              should not be misread as a customer; it is disclosed as an investor and has relevant AI/GPU server
              products, making it a possible supplier or partner dependency. The chapter's base conclusion is therefore
              not that demand is absent, but that demand has not yet converted into adoption. The next diligence gate is
              signed design-partner evidence tied to workload class, uptime target, data path, economics, and expansion
              rights.
