              land, and grid access; they do not show that Panthalassa has converted AWS, Microsoft Azure, Google, a
              neocloud, or an AI lab into a customer. The implied buyer is infrastructure or cloud procurement, the
              economic sponsor is a cloud or AI-platform executive trying to secure power and compute capacity, and the
              user is an AI research or product team willing to send batch or inference jobs offshore. The payer would
              likely buy contracted capacity, not software seats, but public sources do not disclose revenue bands,
