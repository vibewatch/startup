      - number: '2.2'
        title: 'Two-lens sizing: huge AI demand versus tiny wave supply'
        blocks:
          - type: paragraph
            body: >-
              The most useful sizing approach uses two lenses and refuses to merge their units. The demand lens is
              enormous: IEA projects data-center electricity demand could reach about 945 TWh per year by 2030, and
              SemiAnalysis frames energy availability as a central AI-infrastructure constraint. That lens supports a
              very large TAM for energy-backed compute capacity, but it does not prove Panthalassa can serve it. The
              supply lens is much smaller: Mordor estimates wave-energy deployment around 10 MW in 2026 growing to about
              125 MW by 2031, with other analyst houses also describing a high-growth but early market. Panthalassa's
              SAM is the overlap between those lenses, namely wave-powered offshore AI compute. Its supportable
              near-term SOM is narrower still: pilot and early commercial nodes in 2026-2027, not a fleet-scale
              percentage of global AI electricity demand. The chapter therefore preserves TWh, MW, and node-count units
              separately rather than producing a single inflated TAM number.
