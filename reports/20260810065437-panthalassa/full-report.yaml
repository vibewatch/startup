      - number: '3.3'
        title: Capability, pricing, GTM, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Capability comparisons favor Panthalassa on architectural integration, but not yet on proof, pricing, or
              trust. Public sources support the node concept, cable-free architecture, and at-sea processing path, while
              wave peers support renewable-generation credibility and offshore-compute peers support cooling or siting
              credibility. Public list pricing is largely absent across the relevant frontier set, so buyers cannot yet
              compare Panthalassa on $/GPU-hour, $/kW, service-level terms, data-egress economics, latency, or contract
              duration. GTM power is also asymmetric: established hyperscalers, GPU-cloud providers, and hardware
              ecosystems already control buyer relationships and procurement trust, whereas Panthalassa must prove
              remote operations, bandwidth, uptime, security, environmental compliance, and offshore serviceability. The
              key underwriting point is that an integrated node can be strategically distinctive and still lose if
              buyers prefer known cloud vendors, clearer SLAs, or cheaper grid-connected compute.
