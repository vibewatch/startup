      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map follows cloud and AI infrastructure budgets rather than utility procurement. Hyperscalers
              such as AWS, Azure, and Google are the most obvious archetype because they buy data-center capacity,
              power, networking, and hardware at scale. Neocloud and AI-compute specialists are also plausible because
              they monetize scarce GPU capacity and may tolerate non-traditional siting if economics and reliability
              work. AI labs are more likely users than sole payers unless they contract directly for batch or inference
              capacity. Adoption should begin with pilots, non-mission-critical batch work, and capacity reservations,
              because offshore autonomous nodes have to prove uptime, security, remote maintainability, and network
              performance before production workloads move. Satellite backhaul makes low-latency interactive services a
              weak first use case, while batch inference, training-adjacent jobs, or delay-tolerant workloads are more
              credible. Budget ownership likely spans cloud infrastructure, data-center capacity planning, AI
              infrastructure, and strategic energy procurement.
