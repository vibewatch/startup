      - number: '5.5'
        title: Trust, quality, safety, and compliance gaps
        blocks:
          - type: paragraph
            body: >-
              Trust is the thinnest public part of the product story. A floating AI data center must survive corrosion,
              biofouling, storms, saltwater intrusion, thermal cycling, remote power faults, network interruptions, and
              abnormal incidents without on-site staff. Technical reference sources define corrosion and biofouling as
              ordinary marine hazards, while New Scientist highlights that physical intervention remains common in
              data-center incidents and that Panthalassa’s ocean sites make that intervention harder. The sealed
              seawater-cooled container may reduce water use and cooling equipment, but public sources do not provide
              independent PUE, chip-temperature, coolant-loop, corrosion-coating, anti-fouling, fire-suppression,
              storm-survivability, or mean-time-between-service data. Security and privacy are also unresolved: sources
              describe satellite backhaul but not encryption, tenant isolation, key management, incident response, or
              compliance attestations. Environmental trust is similarly incomplete because waste heat is expected to
              disperse into seawater, yet nearby ecosystem effects remain unclear. The quality-control table should be
              read less as a checklist passed today and more as the diligence agenda for Ocean-3 and first commercial
              contracting.
