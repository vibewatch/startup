      - number: '1.3'
        title: Funding, valuation, and investor base
        blocks:
          - type: paragraph
            body: >-
              Panthalassa announced a $140 million Series B on May 4, 2026, led by Peter Thiel, bringing disclosed total
              capital raised to roughly $210 million. Financial Times characterized the company as a "$1bn ocean data
              centre start-up," implying a near-unicorn valuation, though retained sources do not disclose an exact
              post-money figure. The syndicate blends returning backers, including Founders Fund, Gigascale Capital,
              Lowercarbon Capital, Unless, and WovenEarth, with a deep new-investor bench spanning John Doerr, Marc
              Benioff’s TIME Ventures, Max Levchin’s SciFi Ventures, Susquehanna Sustainable Investments, Hanwha Group,
              Fortescue Ventures, Super Micro Computer, Sozo Ventures, and local Oregon funds. Related special-purpose
              vehicles filed SEC Form D notices in 2026, disclosing smaller allocation pools rather than the full round.
              The Series B is a step-change in capital relative to estimated prior funding and underwrites the leap from
              sea-trial prototypes toward a first commercial pilot.
