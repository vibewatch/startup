      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is not a generic wave-energy story; it is a co-location argument. Panthalassa wants to consume
              power at sea, sell compute, and avoid the transmission, land, cooling, and grid interconnection problems
              that slow land data centers. If the company can really deliver low-cost, high-availability energy and
              package it into useful inference capacity, it could create infrastructure value outside the grid. The
              anti-thesis is equally direct. Wave power is a small market with difficult economics, the ocean is
              corrosive and expensive to service, LEO latency limits workloads, and land-based AI-cloud incumbents have
              scale, procurement, software, and customer advantages. Because investor-backed economics are not customer
              proof, the thesis needs field data and pipeline evidence before it becomes a priced investment case.
            claimRefs:
              - CV010
