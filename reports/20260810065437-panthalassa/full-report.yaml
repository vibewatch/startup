  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Panthalassa is not selling a conventional wave-energy plant, a power-purchase agreement, or an offshore
              data-center shell. The product is an autonomous floating node that converts ocean-wave motion into onboard
              electricity and uses that electricity immediately to run AI chips at sea. In customer workflow terms, a
              buyer would route suitable AI jobs to Panthalassa capacity, the node would execute inference or
              longer-running compute workloads inside a sealed marine compute module, and results would return to land
              through satellite backhaul. The company’s explicit claim is that power is never exported to shore, so the
              customer benefit is not cheaper grid electricity but compute that avoids land, grid-interconnection,
              cooling-water, and permitting bottlenecks. That makes workload selection central: delayed-result
              inference, simulations, and other batch-like jobs fit better than latency-sensitive chatbot or search
              traffic. The product therefore has to be diligenced as a coupled service workflow spanning offshore
              generation, remote compute operations, satellite networking, and customer job orchestration, not as a
              stand-alone marine generator.
            claimRefs:
              - CE001
