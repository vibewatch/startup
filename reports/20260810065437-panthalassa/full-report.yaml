  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              Panthalassa does not map cleanly to a single competitor category. The closest generation-side peers are
              wave-energy developers such as CorPower Ocean, Oscilla Power, Eco Wave Power, C-Power, Marine Power
              Systems, Wave Swell Energy, and Carnegie Clean Energy, but their public product surfaces primarily
              emphasize electricity generation rather than selling AI compute at sea. The closest compute-side peers are
              floating, underwater, or ship-based data-center concepts such as Aikido, NetworkOcean, Microsoft Project
              Natick, Subsea Cloud, Highlander Hailanyun, and Mitsui O.S.K. ship-based studies, yet those alternatives
              generally rely on offshore wind, subsea cooling, barges, or ships rather than Panthalassa-style autonomous
              wave-powered nodes. The status quo remains land hyperscale data centers, GPU-cloud neoclouds, internal
              build, grid power, and emerging nuclear or SMR-for-data-center options. Starcloud is a useful frontier
              analog because it pursues remote renewable-powered compute in space, demonstrating that investors will
              fund non-land infrastructure when terrestrial constraints look binding.
