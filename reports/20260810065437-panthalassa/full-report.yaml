  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Post-money and terms
        - Exact post-money, preferences, option pool, pro-rata, and ownership.
        - Determines entry price, dilution, and target return.
        - Request term sheet and cap table.
      - - Pilot results
        - Ocean-3 power, uptime, compute, cooling, latency, and autonomy data.
        - Converts model from prototype narrative to underwriteable evidence.
        - Review telemetry, logs, and third-party test reports.
      - - Customer pipeline
        - LOIs, paid pilots, workload profiles, and pricing.
        - Pre-revenue company needs demand proof.
        - Run pipeline calls and customer diligence.
      - - Unit economics
        - Capex per kW, maintenance, insurance, vessel cost, utilization, and gross margin.
        - Determines whether $0.02/kWh supports compute economics.
        - Build bottoms-up fleet model from vendor quotes and sea-trial data.
      - - Survivability
        - Storm, corrosion, biofouling, salt intrusion, and repair history.
        - Ocean reliability is the central bear case.
        - Inspect test records and independent marine-engineering review.
      - - Exit route
        - Strategic-buyer interest, IPO readiness, governance, and capital plan.
        - Frames hold period and financing dependency.
        - Interview likely buyers and review board/governance materials.
    notes: Diligence asks correspond to the unresolved evidence gaps and should be completed before any buy recommendation.
    claimRefs:
      - CV004
      - CV007
      - CV009
