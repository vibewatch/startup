      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Founding attribution is consistent across retained sources. Panthalassa was founded in 2016 and is led by
              co-founder and chief executive Garth Sheldon-Coulson, previously a senior investment associate and AI
              researcher at Bridgewater Associates, alongside co-founder and chief innovation officer Brian Moffat, an
              ocean-energy researcher who worked on wave energy at Spindrift Energy and holds three bachelor of science
              degrees from UC Irvine. The pairing anchors founder-market fit across the two disciplines the company must
              fuse: capital-markets and AI fluency on one side, and marine wave-energy engineering on the other. Public
              disclosure emphasizes this engineering-led leadership rather than a large named executive bench or a
              disclosed board roster, which leaves governance visibility thin and concentrates execution risk in two key
              people. That key-person concentration is a material diligence item given the decade-long,
              capital-intensive path from prototype to commercial fleet.
