      - number: '7.4'
        title: Financial, model, and unit-economics risk
        blocks:
          - type: paragraph
            body: >-
              Financial risk is tightly coupled to survivability. The public funding facts are strong: Panthalassa
              announced a $140 million Series B in May 2026 and about $210 million total raised. But that capital is
              tasked with completing pilot manufacturing, deploying Ocean-3, proving at-sea inference, and reducing
              manufacturing and maintenance uncertainty before the company has disclosed revenue or paying customers.
              Management- and investor-side materials cite attractive targets, including about $1,500 per kilowatt
              capex, high capacity factor, low-cost power, and a factory scaling to roughly one gigawatt per year. The
              adverse view is that corrosion, biofouling, insurance, offshore maintenance, vessel days, and GPU-service
              logistics can erase those modeled gains. Even if wave energy is physically abundant, the underwriting
              question is delivered compute cost after parasitic loads and service interventions, not gross wave
              resource.
            claimRefs:
