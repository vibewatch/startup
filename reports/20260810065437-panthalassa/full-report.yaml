      - number: '7.5'
        title: People, execution mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Execution risk is partly mitigated by a specialist team drawn from aerospace, naval architecture,
              software, manufacturing, military, and research organizations, and by a deep syndicate that can finance
              additional iteration. It remains material because public sources center the company around two
              co-founders, offer limited governance or board disclosure, and leave many detailed operating controls
              private. Panthalassa also did not respond to New Scientist's skeptical technical questions before
              publication, which increases the value of independent diligence rather than press-level assurance. The
              monitoring plan should therefore be explicit: require independent Ocean-3 telemetry, net output after
              parasitic loads, Starlink availability and latency logs, corrosion coupons or inspection reports,
              biofouling and cooling-degradation data, service-vessel days per node, safety incidents, permitting
              milestones, signed customer conversions, and updated unit-economics bridges. The thesis breaks if the
              pilot fails survivability, service cadence, customer conversion, regulatory clearance, or cost targets.
