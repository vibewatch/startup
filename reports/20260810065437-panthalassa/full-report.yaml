      - number: '2.4'
        title: Growth drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The bull case is driven by AI power scarcity, interconnection delays, land constraints, decarbonization
              pressure, and strategic interest in sovereign compute capacity. Those drivers matter for valuation because
              they can make unconventional siting economically relevant if the alternative is waiting years for land,
              grid access, and power purchase agreements. The constraints are equally material. Commercial wave energy
              remains early; generic marine-energy LCOE around $388 to $618 per MWh is far above mainstream solar or
              wind benchmarks; offshore structures and GPU payloads create major capital intensity; and regulatory,
              maritime, environmental, and trust hurdles can delay adoption even without shore power export. Panthalassa
              and its investors cite aspirational economics, including low target power costs and factory-scale node
              production, but retained public sources do not disclose signed customers, pricing, node-level uptime,
              contracted capacity, or validated unit economics. Diligence should therefore preserve contradictory
              estimates instead of smoothing them: enormous AI electricity demand is real, wave deployment is tiny, and
              Panthalassa's actual SAM/SOM depends on pilot results and buyer trust.
