      - number: '3.4'
        title: Switching cost, multi-homing, and supply access
        blocks:
          - type: paragraph
            body: >-
              For target AI-compute buyers, switching cost appears workload-dependent rather than absolute. Batch
              inference, offline training support, and interruptible workloads can be routed across providers more
              easily than low-latency user-facing services, which supports multi-homing but limits lock-in. Panthalassa
              could create lock-in if it controls scarce clean power capacity, operates reliably in energy-dense wave
              regions, and exposes familiar cloud interfaces; it could also become a secondary capacity provider if
              latency, bandwidth, or trust constraints keep customers on land for primary workloads. Partner access is
              similarly promising but unproven. Super Micro Computer appearing in the investor list is directionally
              helpful for hardware supply, while Aikido and Starcloud show that NVIDIA-linked ecosystems are actively
              courting remote-compute concepts. None of that proves allocation, customer commitments, or pricing power,
              so partner diligence should focus on GPU procurement rights, service agreements, satellite bandwidth,
              insurance, and maintenance logistics.
            claimRefs:
              - CP017
              - CP029
              - CP034
              - CP035
              - CP036
