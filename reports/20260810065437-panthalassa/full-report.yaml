            body: >-
              Panthalassa’s public maturity should be scored as prototype-to-pilot rather than commercial. The sequence
              runs from Ocean-1 in 2021, through Ocean-2 and Wavehopper prototype activity in 2024, a reported 2025
              Puget Sound Ocean-2 test near 50 kilowatts, and a planned 2026 Ocean-3 pilot series in the northern
