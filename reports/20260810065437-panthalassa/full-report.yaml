      - number: '3.5'
        title: Moat durability and adverse competitor evidence
        blocks:
          - type: paragraph
            body: >-
              The moat is real in concept but unproven in durability. Panthalassa owns a distinctive
              vertical-integration story: mass-produced steel nodes, autonomous station-keeping, wave generation,
              onboard compute, and satellite backhaul. The risk register is dominated by evidence that marine systems
              and offshore compute have historically struggled to become economic platforms. Project Natick showed
              strong technical results yet was retired; New Scientist highlights harsh salt and wave conditions and the
              need to beat conventional data centers on economics; and historical ocean-energy experiments such as OTEC
              demonstrate that weather and waves can destroy infrastructure before net power is achieved.
              Commoditization risk also sits on both sides of the product: wave-generation know-how can diffuse among
              marine-energy peers, while compute buyers can multi-home across hyperscalers and neoclouds. Until Ocean-3
              and early customer contracts prove uptime, unit cost, and regulatory path, Panthalassa should be treated
              as competitively differentiated but not yet moat-protected.
