      - number: '8.6'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Panthalassa is not exit-ready today. A credible IPO would require revenue, customer concentration
              disclosure, repeatable unit economics, governance readiness, and a public-market narrative that converts
              ocean compute from science project to infrastructure platform. A strategic acquisition is plausible only
              after a buyer can diligence field performance and workload fit. The immediate diligence asks are therefore
              concrete: confirm post-money and terms, inspect Ocean-3 telemetry, validate customer pipeline, reconcile
              energy economics with maintenance and insurance, and review survivability data from storms and saltwater
              exposure. Thesis-break triggers should be explicit before any entry: failed Ocean-3 deployment, no
              customer commitments, economics materially above target, preference-heavy financing terms, or evidence
              that latency and maintenance limit the addressable workload pool.
            claimRefs:
              - CV024
