      - number: '1.4'
        title: Milestones, trajectory, and open questions
        blocks:
          - type: paragraph
            body: >-
              Panthalassa’s public timeline runs from its 2016 founding through a 2021 Ocean-1 prototype deployment in
              the Strait of Juan de Fuca, later prototypes generating on the order of 50 kilowatts in Puget Sound by
              2025, the May 2026 Series B, a planned Ocean-3 pilot node in the northern Pacific around August 2026, and
              a stated commercial-deployment target near 2027. The company originally explored producing hydrogen or
              clean fuels before emphasizing AI compute, and it articulates a long-term vision of thousands of
              autonomous nodes. Against that momentum, the company is pre-revenue with no publicly disclosed paying
              customers, and independent commentators caution that corrosive, mechanically harsh ocean conditions raise
              real execution risk; Panthalassa did not respond to at least one skeptical press inquiry. Valuation
              precision, revenue, customer proof, and board composition remain the principal unresolved diligence items
              carried into later chapters.
