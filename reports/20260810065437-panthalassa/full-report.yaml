      - number: '7.3'
        title: Partner, platform, supplier, and customer dependencies
        blocks:
          - type: paragraph
            body: >-
              The partner-dependency profile is concentrated in places that can become binary blockers. Communications
              depend on Starlink or similar LEO backhaul, and the evidence indicates that latency and bandwidth shape
              the workload mix, leaving the near-term product better suited to delay-tolerant inference or batch jobs
              than low-latency consumer applications. Hardware exposure is also material: Panthalassa needs qualified
              GPUs, servers, power electronics, sealed compute containers, and reliable payload swaps in a marine
              environment. Super Micro is named as an investor, but retained sources do not convert that into a
              committed supply agreement. The company also depends on regulators to approve or tolerate deployment
              zones, capital providers to finance manufacturing before revenue, and future hyperscale or AI-lab
              customers to convert pilots into revenue. Because no paying customers are disclosed, early revenue could
              be concentrated in one or two large buyers if the pilot succeeds.
