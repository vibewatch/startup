  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Ocean-3 miss
        - No verified deployment or repeated material slippage
        - Pilot proof does not arrive before financing need.
        - Pause or avoid entry.
      - - Economics miss
        - Delivered cost materially above $0.02/kWh or capex above target
        - Cost advantage versus land power disappears.
        - Reprice sharply down.
      - - Survivability failure
        - Storm, corrosion, biofouling, or repair event causes prolonged outage
        - Fleet uptime and insurance assumptions break.
        - Treat as thesis-break.
      - - Customer gap
        - No credible LOIs, contracts, or pilots from AI compute buyers
        - Pre-revenue valuation lacks demand proof.
        - Keep research-only stance.
      - - Structured financing
        - Preference-heavy or down-round terms in next raise
        - Earlier mark was not supportable.
        - Avoid unless terms protect downside.
      - - Latency/workload mismatch
        - Only low-value workloads fit satellite backhaul
        - Revenue pool smaller than thesis.
        - Cut bull-case range.
    notes: Kill triggers are designed as monitorable diligence gates rather than generic risks.
    claimRefs:
      - CV009
      - CV015
