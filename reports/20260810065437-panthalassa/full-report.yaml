      - number: '7.2'
        title: Regulatory, legal, environmental, and policy exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk is not a single permit but an overlapping offshore-energy, maritime, data-center,
              environmental, and policy system. BOEM oversees renewable energy on the U.S. Outer Continental Shelf,
              while DOE's marine-energy program frames wave energy as a sector still needing R&D, demonstration, and
              barrier reduction. Data-center legal sources add another layer: NEPA, ESA, Clean Water Act, Clean Air Act,
              water, waste, stormwater, zoning, noise, traffic, and public-land approvals can all become relevant
              depending on siting and design. Federal acceleration for qualifying data centers may help some projects,
              but legal commentary emphasizes that state and local review, community resistance, and litigation remain
              schedule and cost risks. The Jones Act adds a practical maritime constraint if U.S. domestic towing,
              maintenance, or spares movement occurs between U.S. ports. Environmental review is especially sensitive
              because New Scientist reports that offshore waste-heat ecosystem effects remain unclear.
            claimRefs:
