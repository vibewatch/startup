  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Panthalassa should not be sized as the entire wave-energy market or the entire cloud-computing market. The
              investable boundary is offshore-sited AI compute powered by ocean wave energy, where the company generates
              electricity on an autonomous node and consumes that electricity onboard to sell compute capacity. Included
              spend therefore covers the integrated stack: wave-energy conversion, marine deployment, cooling and power
              conditioning, onboard AI servers, network backhaul, and the commercial compute service. Excluded spend
              includes conventional wave-power projects that export electricity to shore, generic renewable-energy
              generation, and ordinary data-center construction unless the spend is being displaced by offshore compute.
              The relevant status quo is land-based hyperscale or colocation capacity connected to grid power, while
              adjacent alternatives include offshore wind, floating solar, nuclear or SMR-backed data centers, and plain
              grid procurement. This boundary is intentionally narrow because the market thesis depends on solving the
              AI power bottleneck through co-located ocean generation, not on proving all marine energy is a large
              market.
