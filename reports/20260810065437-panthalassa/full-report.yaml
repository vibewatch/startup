      - number: '5.2'
        title: Node assets and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The public architecture is unusually specific for an early-stage hard-tech company. Ocean-3 is described
              as an approximately 85 meter plate-steel structure shaped like a golf ball on a tee, with investor
              coverage describing a roughly 50 meter spherical top and a long neck below the surface. As waves lift and
              lower the structure, seawater is forced up the central tube into an internal reservoir and then drained
              through a single turbine to produce electricity. That electricity powers hermetically sealed AI servers
              cooled through the surrounding seawater. Ocean-2 is the smaller prototype analogue, with a roughly 9 meter
              spherical top and public reporting of up to about 50 kilowatts in Puget Sound conditions. The architecture
              map should therefore be read as one vertically integrated asset: hull, wave pump, reservoir, turbine,
              power electronics, sealed compute, seawater heat exchange, autonomy, and satellite communications. The
              design may be elegant because it reduces moving parts and avoids shore cables, but commercial proof still
              depends on survivability, maintenance, and measured output in open-ocean conditions.
