      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis produces a wide range because a single technical proof point can change the company’s
              risk class. In the bull case, Panthalassa demonstrates useful at-sea inference, proves survivability, and
              shows that its $0.02/kWh and high-availability targets can survive real maintenance, insurance, and
              logistics costs. That could justify multi-billion-dollar infrastructure optionality. In the base case, the
              pilot works but scale is slow and capital hungry, so the implied roughly $1 billion mark merely holds
              while investors wait for orders and repeatable manufacturing. In the bear case, corrosion, biofouling,
              storms, latency, or wave-energy LCOE make the system uneconomic, and land-based alternatives win. The
              downside trigger is not lack of imagination; it is field economics failing to converge quickly enough.
            claimRefs:
