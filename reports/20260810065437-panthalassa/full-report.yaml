              therefore prospective: hyperscale cloud platforms, large AI infrastructure buyers, neocloud or merchant
              GPU-cloud operators, and AI labs that need power-dense, delay-tolerant compute. The customer-proof sources
              allocated to this chapter intentionally function as demand-side proxies. Deloitte, IEA-linked data-center
