      - number: '5.4'
        title: Differentiation, moat, and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation is the fusion of two hard systems that are usually separate: wave-energy
              generation and AI compute consumption on the same autonomous hull. Conventional wave projects usually try
              to export electricity; conventional data centers solve land, grid, cooling, and staffing constraints on
              shore; underwater data-center analogues such as Project Natick test sealed marine compute but not
              autonomous wave generation. Panthalassa’s moat, if it emerges, would sit in marine engineering know-how,
              hull and ballast design, manufacturing repetition, remote operations software, thermal integration, and
              the ability to operate where wave resources are energy dense. The dependency map is equally demanding. It
              relies on steel fabrication and coatings, turbine and power electronics reliability, GPU supply,
              sealed-container thermal design, Starlink or comparable LEO connectivity, ocean-weather operations, and
              permitting or environmental acceptance. Several metrics are aspirational: up to 90% power availability,
              low-cost energy, and a factory capable of gigawatt-scale annual node output. Those claims create upside
              but need instrumented fleet proof before they qualify as durable product advantage.
