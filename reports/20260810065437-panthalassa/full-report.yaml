      - number: '8.3'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing context argues for discipline rather than false precision. Public articles supply the
              headline round and near-$1 billion framing, while SEC Form D filings show smaller related SPV allocations;
              none reveal the full cap table, post-money share count, liquidation preference, participation, pro-rata
              rights, or option-pool treatment. Methodologically, post-money valuation is only meaningful when the
              invested capital and fully diluted capital structure are known. For Panthalassa, the exact price cannot be
              validated from public evidence. A rational entry stance is therefore milestone-gated: treat the current
              mark as an option price on a difficult infrastructure breakthrough, not as a validated DCF or revenue
              multiple. The next financing should be assessed after Ocean-3 data and credible customer commitments
              reduce the main uncertainty bands.
            claimRefs:
              - CV003
