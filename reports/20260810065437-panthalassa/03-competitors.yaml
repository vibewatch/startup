  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Comparable Panthalassa and competitor $/GPU-hour, $/kW, SLA, latency, egress, and contract-duration terms.
      whyItMatters: >-
        Without comparable pricing and packaging, differentiation cannot be translated into buyer ROI or displacement
        risk.
      diligencePath: >-
        Request Panthalassa draft customer contracts and benchmark them against cloud, neocloud, offshore wind compute,
        and internal-build cost models.
      relatedQuestionRefs:
        - QP009
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: partner-access
      missingEvidence: Binding GPU supply, satellite bandwidth, service-vessel, fabrication, and hardware-maintenance agreements.
      whyItMatters: >-
        Investor participation and public ecosystem references do not prove that Panthalassa can procure scarce
        components or operate nodes at scale.
      diligencePath: Inspect executed supplier contracts, allocation rights, maintenance SLAs, insurance terms, and fallback vendors.
      relatedQuestionRefs:
        - QP017
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: material
      topic: regulatory-trust
      missingEvidence: >-
        Project-specific permitting pathway, environmental heat-impact assessment, maritime operating approvals, and
        third-party reliability certification.
      whyItMatters: >-
        Competitive trust versus land data centers depends on uptime, environmental clearance, and operating permission,
        none of which is fully public for the commercial node.
      diligencePath: >-
        Request permit matrices, regulator correspondence, environmental study scopes, and an independent reliability
        assessment for Ocean-3.
      relatedQuestionRefs:
        - QP013
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: material
      topic: customer-proof
      missingEvidence: Signed customers, LOIs, workload commitments, or paid pilots showing buyers will purchase at-sea AI compute.
      whyItMatters: >-
        Multi-homing makes the product easy to trial but also easy to abandon unless customer demand is contractually
        visible.
      diligencePath: >-
        Review customer pipeline, signed pilot terms, target workloads, expected utilization, and reasons prospects
        would shift from land clouds.
      relatedQuestionRefs:
        - QP015
        - QP016
      relatedTableRefs:
        - TP003
