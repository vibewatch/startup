chapter:
  number: 3
  title: Competitors
  summary: >-
    Panthalassa is competitively distinctive because it combines wave-energy generation and at-sea AI compute on one
    autonomous node, while wave-energy peers, offshore data-center peers, frontier analogs, and land incumbents each
    solve only part of the buyer job. The moat is promising but unproven: pricing, customers, regulatory trust, partner
    access, and marine durability remain the key diligence gaps.
sections:
  - id: landscape
    title: "Landscape: direct peers, substitutes, and likely entrants"
    body: >-
      Panthalassa does not map cleanly to a single competitor category. The closest generation-side peers are
      wave-energy developers such as CorPower Ocean, Oscilla Power, Eco Wave Power, C-Power, Marine Power Systems, Wave
      Swell Energy, and Carnegie Clean Energy, but their public product surfaces primarily emphasize electricity
      generation rather than selling AI compute at sea. The closest compute-side peers are floating, underwater, or
      ship-based data-center concepts such as Aikido, NetworkOcean, Microsoft Project Natick, Subsea Cloud, Highlander
      Hailanyun, and Mitsui O.S.K. ship-based studies, yet those alternatives generally rely on offshore wind, subsea
      cooling, barges, or ships rather than Panthalassa-style autonomous wave-powered nodes. The status quo remains land
      hyperscale data centers, GPU-cloud neoclouds, internal build, grid power, and emerging nuclear or
      SMR-for-data-center options. Starcloud is a useful frontier analog because it pursues remote renewable-powered
      compute in space, demonstrating that investors will fund non-land infrastructure when terrestrial constraints look
      binding.
    claimRefs:
      - CP001
      - CP002
      - CP031
      - CP032
      - CP033
      - CP045
      - CP018
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: profiles
    title: Profiles, maturity, and feature breadth
    body: >-
      The profile comparison shows Panthalassa as the only retained company claiming both wave generation and onboard AI
      compute in one commercial architecture. CorPower has clearer utility-scale wave-array packaging through 10-30MW
      CorPack clusters; Oscilla has a patent-backed Triton wave-energy converter; Eco Wave Power has public-company
      visibility and a 404.7 MW pipeline; and Aikido, NetworkOcean, Natick, Highlander, and Subsea Cloud attack the
      at-sea data-center problem from cooling, floating-platform, or subsea angles. Microsoft Project Natick is the most
      mature public proof that servers can operate subsea, including an 864-server deployment and lower failure rates
      than a land control group, but the same program is no longer active, which weakens any assumption that technical
      success implies commercial continuity. The feature map therefore gives Panthalassa high breadth and low proof,
      while land neoclouds invert that pattern with high commercial maturity but no autonomous ocean-renewable moat.
    claimRefs:
      - CP003
      - CP006
      - CP008
      - CP009
      - CP011
      - CP012
      - CP013
      - CP014
      - CP026
      - CP032
    tableRefs:
      - TP002
    figureRefs:
      - FP002
  - id: comparison
    title: Capability, pricing, GTM, and trust posture
    body: >-
      Capability comparisons favor Panthalassa on architectural integration, but not yet on proof, pricing, or trust.
      Public sources support the node concept, cable-free architecture, and at-sea processing path, while wave peers
      support renewable-generation credibility and offshore-compute peers support cooling or siting credibility. Public
      list pricing is largely absent across the relevant frontier set, so buyers cannot yet compare Panthalassa on
      $/GPU-hour, $/kW, service-level terms, data-egress economics, latency, or contract duration. GTM power is also
      asymmetric: established hyperscalers, GPU-cloud providers, and hardware ecosystems already control buyer
      relationships and procurement trust, whereas Panthalassa must prove remote operations, bandwidth, uptime,
      security, environmental compliance, and offshore serviceability. The key underwriting point is that an integrated
      node can be strategically distinctive and still lose if buyers prefer known cloud vendors, clearer SLAs, or
      cheaper grid-connected compute.
    claimRefs:
      - CP002
      - CP024
      - CP025
      - CP034
      - CP035
      - CP036
      - CP037
      - CP041
      - CP044
    tableRefs:
      - TP003
  - id: switching-power
    title: Switching cost, multi-homing, and supply access
    body: >-
      For target AI-compute buyers, switching cost appears workload-dependent rather than absolute. Batch inference,
      offline training support, and interruptible workloads can be routed across providers more easily than low-latency
      user-facing services, which supports multi-homing but limits lock-in. Panthalassa could create lock-in if it
      controls scarce clean power capacity, operates reliably in energy-dense wave regions, and exposes familiar cloud
      interfaces; it could also become a secondary capacity provider if latency, bandwidth, or trust constraints keep
      customers on land for primary workloads. Partner access is similarly promising but unproven. Super Micro Computer
      appearing in the investor list is directionally helpful for hardware supply, while Aikido and Starcloud show that
      NVIDIA-linked ecosystems are actively courting remote-compute concepts. None of that proves allocation, customer
      commitments, or pricing power, so partner diligence should focus on GPU procurement rights, service agreements,
      satellite bandwidth, insurance, and maintenance logistics.
    claimRefs:
      - CP017
      - CP029
      - CP034
      - CP035
      - CP036
      - CP037
      - CP038
      - CP019
      - CP010
    figureRefs:
      - FP003
  - id: moat-risk
    title: Moat durability and adverse competitor evidence
    body: >-
      The moat is real in concept but unproven in durability. Panthalassa owns a distinctive vertical-integration story:
      mass-produced steel nodes, autonomous station-keeping, wave generation, onboard compute, and satellite backhaul.
      The risk register is dominated by evidence that marine systems and offshore compute have historically struggled to
      become economic platforms. Project Natick showed strong technical results yet was retired; New Scientist
      highlights harsh salt and wave conditions and the need to beat conventional data centers on economics; and
      historical ocean-energy experiments such as OTEC demonstrate that weather and waves can destroy infrastructure
      before net power is achieved. Commoditization risk also sits on both sides of the product: wave-generation
      know-how can diffuse among marine-energy peers, while compute buyers can multi-home across hyperscalers and
      neoclouds. Until Ocean-3 and early customer contracts prove uptime, unit cost, and regulatory path, Panthalassa
      should be treated as competitively differentiated but not yet moat-protected.
    claimRefs:
      - CP023
      - CP024
      - CP030
      - CP038
      - CP039
      - CP040
      - CP041
      - CP042
      - CP043
    tableRefs:
      - TP004
