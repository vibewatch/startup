company:
  name: Amarenco
chapter:
  number: 4
  title: Financials
  summary: Amarenco’s public record supports an underwriteable view of capital formation and asset-level financing, but not of consolidated profitability. The business model appears to be transitioning from developer-plus-asset-rotation toward a fuller IPP model built on recurring electricity-production EBITDA, with storage and tolling revenues adding flexibility value. Public evidence shows a rapidly layered capital stack—€300 million equity in 2023, a €500 million multi-country debt platform in 2024, a €188 million France facility in 2025, a €300 million HoldCo facility in January 2026, a €130 million preferred-equity tranche in December 2025/announced 2026, and a €65 million Claudia refinancing. That financing cadence is a strength, but it also underlines continuing dependence on external capital until the group reaches its stated goal of structural financial autonomy above 1 TWh annual production and 1 GW installed capacity.
sections:
- id: revenue-model
  title: Revenue model, monetization pathways, and what is publicly observable
  body: 'Amarenco’s public materials describe a business that is moving away from pure project development toward a fuller independent-power-producer model. The monetization logic appears to have four main legs: recurring electricity sales from owned solar assets; storage-related revenues tied to tolling, capacity, reserve, or trading structures; asset turnover / farm-down economics; and development or structuring value embedded in originating and financing projects. Business Cork’s 2026 financing announcement is especially useful because it explicitly ties the company’s “structural financial autonomy” target to recurring EBITDA from electricity production and asset turnover rather than to one-off development gains alone. Storage is no longer ancillary: the same announcement says Amarenco’s 94 MW / 188 MWh storage fleet contributes to grid balancing while generating revenues from energy trading. What remains missing is the most basic income-statement disclosure. None of the fetched official
    pages, legal deal summaries, or registry pages provide consolidated revenue, EBITDA, gross margin, operating cash flow, or net debt for the group. That means revenue quality can be described conceptually, but not fully underwritten from public numbers.'
  claimRefs:
