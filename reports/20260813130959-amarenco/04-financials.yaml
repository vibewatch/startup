- id: cost-structure-and-capital-intensity
  title: Cost structure, working capital, and capital intensity
  body: 'The cost structure is best understood as a capital-intensive IPP stack rather than a lightweight development shop. Major cost buckets include land and permitting, EPC and equipment, grid connection, interest during construction, O&M, central SG&A, and corporate financing overhead. Public filings are too sparse to quantify any of these precisely, but the financing record shows the scale of the requirement. The December 2024 multi-country debt platform totaled €500 million with an additional €150 million accordion, while the January 2026 HoldCo facility was explicitly framed as a way to optimize capital structure, reduce financing costs, and improve internal cash circulation. Asset-level structures reinforce the same point: the Claudia battery refinancing included a €46.9 million term loan, €3.5 million VAT facility, €11.5 million letter-of-credit facility, and €3.22 million debt-service-reserve facility, while the Osmo project also reached financial close with Société Générale. Amarenco’s
    own 2024 press release says it invests over half a billion euros annually and is constructing around 500 MW each year, making working-capital management and project-debt access central rather than incidental to the model.'
