- id: TI002
  title: Pricing / monetization table
  columns:
  - Model
  - Public price / unit / contract
  - List vs realized
  - Unknowns / discounts
  - Source / implication
  rows:
  - - Utility-scale solar offtake
    - No public standardized € / MWh contract price
    - Realized pricing unknown
    - Depends on geography, tenor, merchant exposure, and hedging
    - Competition happens in structured bids, not catalog pricing
  - - Distributed rooftop solar
    - Tender / project-specific economics; public pricing unavailable
    - Realized pricing unknown
    - Mix of rooftop design, financing, and local incentives
    - Customer value likely customized rather than price-card based
  - - Battery storage tolling / trading
    - No public standard tariff; Engie tolling disclosed on Claudia but economics private
    - Realized pricing unknown
    - Floor, upside sharing, and merchant exposure undisclosed
    - Storage value stack is strategically important but numerically opaque
  - - Asset rotation / farm-down
    - Project-sale economics not public
    - Realized pricing unknown
    - IRR targets and gain-on-sale margins not disclosed
    - Important to autonomy thesis yet unsupported in public
  - - Crowdfunding convertibles
    - 5% yield over 4 years on convertible bonds
    - Public promotional / financing terms
    - Outstanding amount and conversion behavior unknown
    - Rare public capital-pricing datapoint, but not operating monetization
  notes: The absence of public realized pricing is typical for private IPPs, but it sharply limits margin underwriting.
  claimRefs:
