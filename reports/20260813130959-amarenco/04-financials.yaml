- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: 'Public evidence supports a nuanced read of capital adequacy. On the positive side, Amarenco has repeatedly attracted new money across multiple layers of the stack: over €300 million from Arjun and co-investors in 2023, the €500 million 2024 debt platform, the €188 million France construction financing in 2025, the €300 million HoldCo platform in early 2026, and the €130 million preferred-equity tranche finalized in December 2025 with a second tranche planned for 2026. That cadence suggests lenders and investors view the platform as bankable. On the negative side, the company itself still frames structural financial autonomy as a future milestone to be reached within 24 months once production exceeds 1 TWh and installed capacity exceeds 1 GW. In other words, Amarenco is not yet presenting itself as self-funding from current operating cash flow. Registry-derived pages confirm recent annual returns and 2024 accounts filed for selected Irish entities, but they do not surface enough
    detail to assess unrestricted cash, consolidated leverage, covenant headroom, or runway. The evidence therefore supports continued capital access, but not a clean proof of balance-sheet independence today.'
  claimRefs:
  - CI028
