tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Owned solar generation
    - Electricity production sold via market, PPA, tender, or contracted structures
    - MWh / €
    - Public production threshold target >1 TWh; 2025 delivered >600 GWh
    - Potentially recurring, but realized price and margin undisclosed
    - Request by-asset revenue split, realized prices, and contract tenor
  - - Battery storage / flexibility
    - Tolling, capacity, reserve, and energy-trading revenues
    - MW / MWh / €
    - 94 MW / 188 MWh disclosed; Claudia and Osmo add monetizable storage assets
    - Potentially high-value but highly market-structure dependent
    - 'Request revenue stack by asset: tolling, ancillary, trading, capacity'
  - - Asset turnover / farm-down
    - Sale or rotation of developed assets / portfolio interests
    - Project proceeds / gain on sale
    - Management explicitly references asset turnover as part of recurring-EBITDA path
    - Can be lumpy and less recurring than generation income
    - Request historical farm-down proceeds, gains, and recycling cadence
  - - Development / structuring value
    - Origination, permitting, financing, and development economics embedded in projects
    - Project margin / fee
    - Likely present but not separately disclosed
    - Opaque; may support pipeline value before COD
    - Request development-margin bridge and capitalization policy
  - - Crowdfunding / convertibles
    - Retail investor convertible bonds with fixed yield
    - Coupon / principal
    - Official site says >€30m raised at 5% yield over 4 years
    - Financing, not operating revenue
    - Clarify outstanding balance, maturity schedule, and conversion terms
  notes: Amarenco’s public sources are much stronger on financing events and capacity milestones than on audited income-statement disclosure.
