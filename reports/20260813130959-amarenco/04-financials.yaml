  - CI014
  - CI015
  - CI016
- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Customer acquisition cost
    - Unavailable
    - low
    - Project-led businesses can hide weak sales efficiency in capitalized development spend
    - Request origination cost per MW by geography and channel
  - - Sales cycle
    - Long / project-based
    - medium
    - Permitting and financing delays strongly affect cash conversion
    - Request average months from origination to RTB / COD / monetization
  - - Gross margin by asset class
    - Unavailable
    - low
    - Needed to value owned generation versus asset sales and storage
    - Request gross margin for rooftop, ground-mount, agrivoltaic, and BESS
  - - Project debt leverage
    - Asset-specific and undisclosed in aggregate
    - medium
    - Debt sizing drives equity intensity and returns
    - Request leverage, DSCR, and tenor by financing facility
  - - Storage revenue mix
    - Partially evidenced
    - medium
    - Determines how resilient BESS cash flows are across price cycles
    - Request % of revenue from tolling, reserves, capacity, and trading
  - - Central SG&A absorption
    - Unavailable
    - low
    - Needed to assess path to structural autonomy
    - Request group overhead by function and per-MW allocation
  notes: Most unit-economics fields are unavailable publicly, so diligence must pivot from vanity growth metrics to asset-level cash-flow bridges.
  claimRefs:
  - CI010
  - CI011
  - CI019
  - CI023
  - CI024
  - CI025
- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Interpretation
  - Diligence ask
  rows:
  - - Cash on hand
    - Unavailable publicly
    - Cannot verify unrestricted liquidity
    - Request consolidated cash and trapped-cash split
  - - Monthly burn / fixed cash cost
    - Unavailable publicly
    - Cannot model runway or covenant pressure
    - Request monthly operating burn excluding growth capex
  - - Runway months
    - Unavailable publicly
    - IPP model reduces relevance of startup-style runway, but liquidity still matters
    - Request 24-month liquidity forecast
  - - Planned use of funds
    - Growth, storage deployment, capital-structure optimization, acquisitions / consolidation
    - Capital is still expansionary, not merely maintenance
    - Request use-of-funds bridge by geography and asset type
  - - Next-round trigger
    - Management targets >1 TWh annual production and >1 GW installed capacity within 24 months for structural autonomy
    - Autonomy is threshold-based and not yet achieved
    - Request downside case if threshold slips by 12 months
  - - Debt / project-finance obligations
    - 2024 €500m + €150m accordion; 2025 €188m France facility; 2026 €300m HoldCo; 2026 €65m Claudia refi; Osmo financial close
    - Material leverage and refinancing activity are core to the model
    - Request maturity ladder, covenants, hedging, and DSRA requirements
  notes: Capital adequacy is evidenced through access to financing, not through public liquidity disclosure.
  claimRefs:
  - CI007
  - CI018
  - CI020
  - CI021
  - CI026
  - CI028
  - CI029
  - CI030
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  rows:
  - - Consolidated revenue and EBITDA
    - Cannot value revenue quality or scale recurring profitability
    - Obtain audited FY2024/FY2025 consolidated financial statements
  - - Unrestricted cash and revolver availability
    - Cannot assess solvency buffer or short-term flexibility
    - Request treasury pack with cash by entity and available lines
  - - Debt maturity ladder and covenant package
    - Cannot model refinancing cliff risk
    - Request lender presentations and facility agreements summary
  - - Asset-level operating metrics
    - Cannot separate good projects from average portfolio economics
    - Request top-20 asset performance table with yield, curtailment, and realized price
  - - Farm-down / asset-rotation history
    - Cannot test whether autonomy depends on disposals
    - Request realized gains, buyers, and recycled-equity cadence
  - - Storage merchant exposure
    - Cannot stress-test BESS revenues under power-price shifts
    - Request tolling contracts, reserve participation, and hedge policies
  notes: These are the minimum data-room asks needed before a valuation view can rely on projected self-funding.
