      - number: '8.3'
        title: Current financing context and why public evidence supports a range, not a mark
        blocks:
          - type: paragraph
            body: >-
              Recent financing events provide evidence of capital access, not a clean valuation mark. Amarenco’s €130
              million preferred-equity tranche, its €300 million junior financing led by Eiffel, and multiple
              refinancing and project-finance events collectively support the idea that sophisticated capital continues
              to back the platform. They do not, however, tell outside investors what common-equity value remains after
              debt, junior capital, and preferred seniority are layered onto the structure. Public sources also frame an
              ambitious next milestone: more than 1 TWh of annual production and more than 1 GW of installed capacity
              within 24 months. If achieved with recurring EBITDA and successful asset rotation, that would improve
              valuation support materially. But until public or private diligence reveals the actual earnings base,
              leverage, and preference economics, those milestones are catalysts rather than valuation facts. This is
              the central tension of the chapter: Amarenco may be worth a lot, but public evidence cannot yet prove
              exactly how much of that value belongs to common equity holders at a given entry price.
            claimRefs:
              - CV013
              - CV014
              - CV020
              - CV021
              - CV022
              - CV035
              - CV036
              - CV037
          - type: figure
