      - number: '2.3'
        title: Buyers, users, payers, and routes to market
        blocks:
          - type: paragraph
            body: >-
              Buyers in Amarenco’s market are fragmented. Farmers and landowners care about land productivity and local
              economics; commercial and industrial site owners care about self-generation economics; municipalities and
              public-building operators respond to rooftop obligations and public-energy budgets; corporate PPA buyers
              care about compliance, hedging, and multi-market procurement strategy; utilities and TSOs increasingly
              value storage-enabled grid services. The buyer, user, and payer are often different people. Zeigo’s
              Amarenco case study shows that developers now need real customer-segmentation and advisory capability
              because corporate buyers no longer purchase solar mainly to match annual certificates; they optimize
              around volatility, greenhouse-gas accounting, and portfolio construction. In France, tender structures
              explicitly cover rooftops, parking lots, and agricultural facilities. In Ireland, RESS tenders still
              matter. In other words, route-to-market sophistication—not just project pipeline—now determines which
              developers convert addressable demand into signed offtake and financed assets.
            claimRefs:
