      - number: '7.2'
        title: 'Regulatory and legal risk: France and Ireland matter most'
        blocks:
          - type: paragraph
            body: >-
              France and Ireland carry the clearest visible regulatory exposure in the public record. In France,
              agrivoltaic projects now sit inside a much more detailed legal framework that requires pre-commissioning
              controls, follow-up checks, reversibility planning, farmer-income and agricultural-production scrutiny,
              and recurring data transmission. That is good for project legitimacy, but it also means compliance failure
              can directly impair project status or economics. The French government has also tried to accelerate
              environmental litigation for strategic renewables, which is directionally positive, but a faster appeal
              process is still an appeal process. In Ireland, policy is attempting to speed connection offers by moving
              to biannual batches and earlier planning acknowledgment, yet both CRU and legal commentary make clear that
              grid connection timing remains a real project-development risk. For Amarenco, this means the regulatory
              picture is not simply “supportive policy.” It is supportive policy plus a growing need to execute
              flawlessly through more formal permitting, grid, and compliance systems.
            claimRefs:
