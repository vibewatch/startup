      - number: '7.5'
        title: People, execution, and thesis-break monitoring
        blocks:
          - type: paragraph
            body: >-
              The remaining public risk sits in execution bandwidth and visibility. Amarenco’s own materials describe
              around 200 employees spanning 25 nationalities, active development across multiple regions, and a need for
              continuing talent growth. That is impressive, but it is not large relative to the platform complexity
              implied by agrivoltaics, rooftop portfolios, repowering, BESS construction, and multi-country financing.
              The public record also does not provide an investor-grade incident ledger, outage history, covenant
              package, or consolidated concentration map, which means outsiders cannot easily see which weak signal
              would break first. As a result, the most useful risk work is not just classification but monitoring.
              Thesis-break triggers should include loss of agrivoltaic eligibility, worsening grid-curtailment without
              sufficient storage capture, financing delays relative to pipeline needs, and visible schedule slippage on
              high-profile storage or repowering assets. Amarenco can remain an investable platform under these risks,
              but only if diligence converts today’s partial public picture into a monitored set of quantitative
              guardrails.
