  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Qualitative heatmap positioning Amarenco’s key public risks by likelihood and impact. Regulatory compliance, grid
      timing, revenue-quality deterioration, and financing dependence occupy the highest-severity cells.
    approximationNotes: >-
      Likelihood and impact are analyst estimates based on retained public evidence rather than company-internal risk
      scoring.
    data:
      columns:
        - id: low-like
          label: Low Likelihood
          detail: Risk visible but not yet clearly probable within 12-24 months
        - id: med-like
          label: Medium Likelihood
          detail: Meaningful probability if execution slips or market conditions worsen
        - id: high-like
          label: High Likelihood
          detail: Risk already visible in market structure, policy process, or company expansion path
      rows:
        - id: high-impact
          label: High Impact
          values:
            - Single-country project issue only
            - BESS execution slip; partner governance failure
            - >-
              French agrivoltaic non-compliance; Irish connection slippage; capture-price deterioration; financing
              strain
        - id: medium-impact
          label: Medium Impact
          values:
            - Minor reporting-control gap
            - Labour / EPC bottleneck; CAPEX volatility
            - Curtailment pressure; tender / RESS qualification friction
        - id: low-impact
          label: Low Impact
          values:
            - Minor public-communications inconsistency
            - Single-site remediation need
            - Routine procurement repricing absorbed in bid assumptions
    claimRefs:
