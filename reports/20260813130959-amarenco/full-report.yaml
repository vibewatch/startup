      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case for Amarenco is stronger on fundability than on transparency. Repeated financings
              across equity, preferred equity, HoldCo debt, project debt, and asset refinancing indicate real lender
              confidence and a maturing capital structure. The strategic direction is also coherent: management is
              trying to build a recurring-cash-flow IPP rather than remain a merchant developer. But public disclosure
              remains too thin to answer the core underwriting questions an investor would normally ask: actual revenue
              mix, gross margin by asset type, DSCR performance, project IRRs, central overhead, unrestricted cash, debt
              maturity ladder, and the amount of EBITDA already recurring versus still dependent on asset rotation.
              There is also a macro caution sign: Mercom says solar corporate funding fell 16% year on year in 2025, so
              Amarenco’s future capital access should not be treated as automatic. Bottom line: the company appears
              financeable and strategically coherent, but diligence should assume material information risk until
              management provides full consolidated accounts and asset-level performance data.
