  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The decision chain runs from visible platform scale and capital access through disclosure and risk gaps to a
      research-more / track recommendation rather than a firm invest call.
    data:
      nodes:
        - id: n1
          label: Real platform signals
          detail: 650 MW installed, 600+ GWh delivered, storage portfolio growing
        - id: n2
          label: Capital access visible
          detail: Preferred equity, junior financing, and refinancings remain available
        - id: n3
          label: Public financial disclosure thin
          detail: No clean audited revenue, EBITDA, net debt, or preference waterfall in public sources
        - id: n4
          label: Merchant and regulatory risk elevated
          detail: Negative prices, grid constraints, and permit complexity compress clean multiples
        - id: n5
          label: Public output is a range, not a mark
          detail: Only a discounted EV corridor is defensible from current evidence
        - id: n6
          label: Research-more / track
          detail: Upgrade only after private diligence closes the financial and structural gaps
      edges:
        - from: n1
          to: n2
          label: supports relevance
        - from: n2
          to: n3
          label: fundability ≠ fair value
        - from: n3
          to: n5
          label: missing precision
        - from: n4
          to: n5
          label: forces discount
        - from: n5
          to: n6
          label: price and diligence decide
    approximationNotes: This flow shows analytical dependencies, not timing or probability weights.
    claimRefs:
