  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization pathways, and what is publicly observable
        blocks:
          - type: paragraph
            body: >-
              Amarenco’s public materials describe a business that is moving away from pure project development toward a
              fuller independent-power-producer model. The monetization logic appears to have four main legs: recurring
              electricity sales from owned solar assets; storage-related revenues tied to tolling, capacity, reserve, or
              trading structures; asset turnover / farm-down economics; and development or structuring value embedded in
              originating and financing projects. Business Cork’s 2026 financing announcement is especially useful
              because it explicitly ties the company’s “structural financial autonomy” target to recurring EBITDA from
              electricity production and asset turnover rather than to one-off development gains alone. Storage is no
              longer ancillary: the same announcement says Amarenco’s 94 MW / 188 MWh storage fleet contributes to grid
              balancing while generating revenues from energy trading. What remains missing is the most basic
              income-statement disclosure. None of the fetched official pages, legal deal summaries, or registry pages
              provide consolidated revenue, EBITDA, gross margin, operating cash flow, or net debt for the group. That
              means revenue quality can be described conceptually, but not fully underwritten from public numbers.
