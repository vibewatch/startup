            body: >-
              The strongest public technical evidence is about Amarenco’s operating architecture. The sustainability
              report explicitly says the company manages projects from conception, development, financing, and
              construction through long-term operation, and its process map frames this as a value chain rather than a
              one-off EPC handoff. The “Our Businesses” page adds practical detail: the company combines equity,
              quasi-equity, crowdfunding, and non-recourse bank financing; manages technical, legal, fiscal, and
              commercial engineering during development; runs construction with specialized contracting expertise; and
              performs long-term asset management and O&M. Battery-storage posts then show how that architecture extends
              into operational optimization: Claudia is being repowered with hybrid NMC/LFP architecture, longer
              duration, reused infrastructure, and a tolling framework, while Osmo uses a former industrial site and
              optimized grid connection conditions. In other words, Amarenco’s technology story is really an integration
