      - number: '7.3'
        title: 'Operational and market risk: capture-price, curtailment, storage, and cost volatility'
        blocks:
          - type: paragraph
            body: >-
              Amarenco’s next layer of risk is economic rather than purely regulatory. Across Europe, solar oversupply
              is no longer an edge case. Analyst and market sources show capture factors collapsing, negative-price
              hours rising, and curtailment spreading as solar capacity outruns system flexibility. France is especially
              relevant because it is one of Amarenco’s core markets and one of the places where negative-price exposure
              has become more severe. That is precisely why co-located batteries, repowering, and smarter market
              participation matter. Amarenco appears to understand this and is already building and repowering battery
              assets, but those assets require their own EPC, financing, and grid-execution discipline. CAPEX is also
              not as benign as old solar narratives suggest. Module oversupply helped in 2023-2025, yet 2026 sources
              point to renewed volatility from Chinese tax-policy changes, supply rationalization, steel and BOS cost
              pressure, and geopolitical shipping risk. The practical consequence is simple: Amarenco cannot rely on
              falling equipment costs or easy merchant assumptions to rescue weak project design. It must design for
              flexibility, secure bankable procurement, and monetize storage effectively.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
          - type: table
            tableRef: TR002
            claimRefs:
