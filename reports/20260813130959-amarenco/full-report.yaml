      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership also shifted materially in 2025. Amarenco’s governance update says the company moved from a
              co-founder-led model toward a more structured management-team setup: co-founder Alain Desvigne became
              President while Frédéric Maenhaut, previously deputy CEO, became CEO. Public leadership materials show a
              wider bench than just the founders, including a CFO, CIO, COO, storage CEO, country managing directors,
              ESG leadership, and public-affairs leadership. That depth helps, but it does not eliminate key-person
              concentration. Desvigne still owns the strategic narrative around investors, regeneration, and partner
              relations, while Maenhaut now owns execution of the 2026-2030 plan. The April 2025 appointment of Declan
              Cullinane to run Amarenco Ireland shows the company is localizing execution in key markets. Even so, board
              composition, independent-director presence, and shareholder-rights architecture remain largely undisclosed
              in public material, which leaves governance quality only partially underwritten.
