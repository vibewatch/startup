  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for Amarenco starts with platform reality. This is not a concept-stage climate company.
              Public sources show a company with hundreds of megawatts installed, meaningful clean-power delivery, a
              growing storage footprint, and a capital base still willing to fund scale-up. Customers and counterparties
              are also more real than a superficial logo wall suggests: Vivescia, Arabian Cement, Genesis, Irish RESS
              wins, and public-sector site examples all indicate that Amarenco can originate and deliver projects in
              multiple channels. The anti-thesis is just as important. Public financial disclosure remains too weak to
              bridge those operating signals into a defensible private-market price. Preferred equity, junior
              financings, refinancings, and project-level structures prove fundability, but they also create cap-table
              and seniority uncertainty. Meanwhile, market risk has become harsher: negative prices, curtailment, and
              financing complexity now matter more than a generic solar-growth narrative. The right valuation frame is
              therefore conditional. Amarenco may deserve material value as an integrated IPP platform, but only if that
              value is purchased at a discount to cleaner, larger public IPP comparables until private diligence proves
              the quality of cash flows, leverage, and downside protection.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
