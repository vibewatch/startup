  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Amarenco actually delivers in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Amarenco’s public materials describe a full-lifecycle renewable-infrastructure service rather than a
              narrow standalone technology SKU. In workflow terms, customers or counterparties come to Amarenco when
              they need some combination of financing, project origination, permitting, construction, and long-term
              operation for solar or storage infrastructure. The sustainability report and “Our Businesses” page frame
              the company around four recurring functions—financing, development, construction, and operation &
              maintenance—wrapped around two core asset families: photovoltaic generation and energy storage. The buyer
              job differs by segment: a landowner or agri-food partner needs an agrivoltaic design that preserves land
              use; a corporate counterparty needs decarbonized electricity and possibly a regenerative CPPA; a
              grid-facing storage project needs flexible capacity and bankable operating structures. The key product
              conclusion is that Amarenco’s offering is an integrated operating model for developing and running
              solar-plus-storage assets, not a single exportable software platform or patented hardware module.
