      - number: '2.2'
        title: 'Sizing lenses: policy volume, contracted volume, and flexibility demand'
        blocks:
          - type: paragraph
            body: >-
              A single TAM number would be misleading here, so the market is better sized through several lenses. First,
              the EU’s own policy frame remains huge: the solar strategy set objectives of more than 380 GW by 2025 and
              at least 600 GW by 2030, and the Commission says the bloc has already exceeded the 2025 threshold. Second,
              long-term contracts already matter at scale: SolarPower Europe says auctions and corporate PPAs accounted
              for 92 GW of EU solar installations between 2022 and 2025, equivalent to power for 28 million homes.
              Third, European PPA contracting remains meaningful even after moderation, with Trio reporting 17.1 GW in
              2023, 15.3 GW in 2024, and 13.1 GW in 2025. Fourth, the flexibility layer is becoming inseparable from
              solar economics. The IEA calls battery storage the fastest-growing power technology in 2025, while Aurora
              and S&P show why: curtailment, congestion, and capture-price compression increasingly punish standalone
              solar exposure.
            claimRefs:
