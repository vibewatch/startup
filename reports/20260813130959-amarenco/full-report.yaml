      - number: '1.5'
        title: Underwriting gaps and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Despite the dense newsflow, several underwriting gaps remain material. First, public materials do not
              provide a clean, audited picture of revenue, EBITDA, leverage, or free cash flow at group level; the
              public record is far stronger on installed capacity and financing events than on unit economics. Second,
              headquarters presentation is mixed between Irish, French, and Paris-centric disclosures, which complicates
              legal-entity mapping and board/governance review. Third, Amarenco’s public long-term roadmap is
              directionally positive but not perfectly harmonized: older corporate pages still cite 4 GW by 2030,
              whereas the 2025 governance refresh references 2.7 GW by 2030 plus a nearer-term 1.6 GW milestone.
              Finally, no public source reviewed in this chapter provides a fresh post-2026 equity valuation or a full
              preference stack. For diligence purposes, Amarenco looks institutionally financeable and strategically
              coherent, but not yet fully transparent in the way a late-stage investor would want.
