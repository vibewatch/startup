              Amarenco’s own segmentation page is unusually explicit about who the company serves. The listed buyer or
              counterparty types include farmers, industrial companies, financial institutions, state organizations,
              private investors, electricity providers, utilities, plant owners, and project developers. The practical
              needs also vary widely: some customers want greener infrastructure for their own sites or end users; some
              want green electricity; some want grid services; some want co-development partnerships or divestment
              options. This matters because Amarenco is not dependent on a single narrow revenue surface. It sells into
              multiple buyer archetypes across distributed generation, agricultural infrastructure, public-sector sites,
              storage, and investor-backed asset ownership. The implication is positive for addressable demand, but it
              also complicates diligence because each segment likely has different procurement cycles, contract
              structures, and margin profiles. Public evidence is therefore strongest on segment breadth and solution
