              - CR025
              - CR026
              - CR035
              - CR036
      - number: '7.4'
        title: Partner, dependency, and capital-structure risk
        blocks:
          - type: paragraph
            body: >-
              Amarenco’s growth model is deeply partner- and capital-dependent. The public financing chronology includes
              repeated equity rounds, preferred equity, country facilities, holdco financing, and refinancing work. That
              is consistent with project development at scale, but it also means the platform is exposed to lender
              appetite, covenant management, refinancing timing, and the continued willingness of investors to fund the
              next leg of buildout. Geographic expansion also appears to rely partly on local structures rather than
              wholly owned greenfield control. Egypt and Thailand are both framed through JVs or acquisitions with local
              partners, while customer-facing growth increasingly relies on land partners, utilities, corporate offtake
              workflows, and policy-mediated tender systems. None of that is inherently bad; in fact, it may be the only
              efficient way to scale. But it means Amarenco’s margin capture and delivery timing do not depend only on
              internal execution. They also depend on counterparties remaining aligned, capable, and financeable.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
