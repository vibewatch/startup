            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV030
      - number: '8.2'
        title: Recommendation, confidence, risk rating, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more / track rather than invest now. That is not a statement that Amarenco
              lacks quality. It is a statement that price and structure matter too much, and public evidence still
              leaves too many variables unresolved. The confidence level is medium: enough evidence exists to support a
              real platform view and a directional valuation band, but not enough to convert that band into a conviction
              purchase price. Risk rating remains high because the company sits at the intersection of merchant-power
              risk, regulatory complexity, capital intensity, and execution bandwidth. The valuation stance is therefore
              explicit: Amarenco should trade at a discount to cleaner public-IPP references until audited revenue,
              EBITDA, net debt, preference stack, hedge/PPA mix, and project-level covenant headroom are known. If those
              data prove strong, the recommendation could move up quickly. If they disappoint, apparent strategic
              quality could still translate into poor equity returns at the wrong entry price.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
