      - number: '3.5'
        title: Bottom-line competitive take
        blocks:
          - type: paragraph
            body: >-
              Amarenco is credible as a specialist rather than a category owner. It can win where agrivoltaics,
              distributed rooftops, storage integration, and localized development matter. It is less likely to dominate
              where market share is set by cheapest capital, biggest pipeline, or deepest utility relationships. That is
              not disqualifying—many attractive European IPPs are specialists—but it means Amarenco’s competitive case
              should be underwritten as execution-led and niche-defensible, not as a durable technology platform with
              winner-take-most economics. In diligence terms, the key question is not whether Amarenco has no edge; it
              clearly does. The question is whether that edge compounds fast enough to offset the structural advantages
              of larger utilities and scaled global IPPs over the next several years.
            claimRefs:
