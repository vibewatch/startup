  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Top-down risk stack: where downside concentrates'
        blocks:
          - type: paragraph
            body: >-
              Amarenco does not look most vulnerable on basic technology existence; it looks most vulnerable where
              regulation, market design, grid readiness, and financing complexity intersect. Public evidence points to a
              company expanding into agrivoltaics, rooftop solar, storage repowering, and multi-country project finance
              at the same time. That creates multiple transmission channels for downside. A stricter French agrivoltaic
              regime can slow or disqualify projects; Irish connection batching and rising curtailment can delay or
              dilute realized revenues; negative-price dynamics can make standalone solar less bankable without storage;
              and repeated fundraisings create a constant need to keep investors, lenders, and counterparties aligned.
              These risks are not theoretical. The same sources that support Amarenco’s scale and ambition also show why
              the company’s value depends on strong execution under increasingly demanding rules and market conditions.
              The good news is that Amarenco is visibly moving toward storage, repowering, hybrid structures, and
              partner-led geographic expansion. The bad news is that each of those moves reduces one risk while adding
              another. The right conclusion is not that the model is broken; it is that this is an execution-heavy
              platform whose errors would compound quickly into revenue, liquidity, and valuation pressure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
