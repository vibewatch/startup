      - number: '3.4'
        title: Moat durability, commoditization risk, and incumbent response
        blocks:
          - type: paragraph
            body: >-
              The competitive moat is therefore practical rather than proprietary. Amarenco’s land-use know-how,
              stakeholder management, lender relationships, and ability to package agrivoltaics with storage are
              meaningful, but they are not permanently defensible if the market keeps concentrating and storage bundling
              becomes table stakes. Solarplaza’s ownership data, Aurora’s grid-stress analysis, and PPA-market signals
              all suggest that value is accruing to players with either very low capital costs or very strong
              structuring and optimization capabilities. That is a problem for any mid-cap IPP trying to play a generic
              utility-scale game. Amarenco is better positioned in distributed, agrivoltaic, and customization-heavy
              subsegments than in fully merchant utility-scale competition. But because those edges are commercial and
              operational, they must keep compounding through repeated execution. If utilities or top-tier IPPs scale
              down-market, Amarenco could face margin compression without any technology moat to fall back on.
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP034
              - CP035
              - CP036
          - type: figure
            figureRef: FP003
