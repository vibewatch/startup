        - Revenue, EBITDA, cash flow, and segment / geography splits
        - Needed to turn broad platform value into a defensible equity mark
        - Management / finance DD
      - - Capital stack
        - Debt schedule, preferred rights, liquidation waterfall, covenants, and DSCR
        - Common-equity value depends on senior claims
        - Treasury / legal DD
      - - Revenue quality
        - PPA / merchant / trading mix and hedge strategy
        - Explains sensitivity to negative prices and curtailment
        - Commercial / energy-markets DD
      - - Pipeline quality
        - Project list by MW, permitting stage, grid status, and expected COD
        - Determines whether 1 TWh / 1 GW milestones are bankable
        - Development DD
      - - Counterparty concentration
        - Top customers, partners, land providers, and lenders
        - Commercial breadth may not equal revenue diversification
        - Customer / partner DD
      - - Storage economics
        - Project-level business cases for BESS and repowering assets
        - Core to merchant-risk mitigation narrative
        - Asset-level DD
    notes: Without these items, Amarenco remains a strategically credible but partially opaque valuation target.
    claimRefs:
      - CV011
      - CV012
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
