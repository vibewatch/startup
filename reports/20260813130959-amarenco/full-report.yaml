  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Amarenco’s public identity is more nuanced than the user-supplied shorthand of a single French IPP. The
              company’s own “Who are we?” page says the current Amarenco was formed in 2018 from the merger of two
              predecessor businesses: Méthode Carré, a French photovoltaic design-and-project-management company founded
              in 2008 by Olivier Carré, and Amarenco, founded in Ireland in 2013 by Alain Desvigne and John Mullins.
              That origin story matters because the company still presents itself as a cross-border platform: its
              location page lists Cork as the Europe head office and Lagrave as the France head office, while corporate
              press releases are typically datelined Paris. Operationally, Amarenco now concentrates on
              Europe—especially France, Ireland, Spain, Portugal, and Austria—with additional French overseas presence.
              Its stated model is vertically integrated: it develops, finances, constructs, operates, and increasingly
              optimizes solar assets with storage and regenerative land-use overlays, rather than simply selling
              projects at notice-to-proceed.
