              - CV013
              - CV014
              - CV036
              - CV038
      - number: '8.4'
        title: Comparable set and scenario-based valuation ranges
        blocks:
          - type: paragraph
            body: >-
              The most useful comparables are not software peers or pure equipment vendors; they are renewable
              developers and IPPs with enough operating scale to frame Amarenco’s strategic position. Encavis is a
              particularly useful reference because it is also a European wind-and-solar IPP, yet it came with greater
              disclosure and a larger asset base at the time of its take-private. Neoen sits higher still as a much
              larger and more globally established operator, making it an upper strategic reference rather than a
              realistic direct mark. Sector benchmark sources reinforce the message: renewable multiples still exist,
              but they vary widely based on contracted revenue quality, cash flow visibility, and balance-sheet
              complexity. Because Amarenco does not publicly disclose the operating financials needed to apply those
              multiples directly, the valuation output here is a scenario band rather than a point estimate. The bear
              case assumes public risks eat into realized economics and funding confidence; the base case assumes
              Amarenco reaches its near-term production milestones but remains only partly transparent; the bull case
              requires evidence that storage and integrated IPP economics produce durable EBITDA quality strong enough
              to justify a materially tighter discount to public comparables.
            claimRefs:
              - CV015
