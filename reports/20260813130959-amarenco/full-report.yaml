      - number: '4.2'
        title: GTM motion, pricing proxies, and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Amarenco’s go-to-market motion is long-cycle and project-centric rather than transactional. Solar
              rooftops, agrivoltaic sites, utility-scale plants, and storage projects are won through land origination,
              permitting, structuring, and financing, then monetized through offtake contracts, tenders, project sales,
              or retained ownership. That structure makes classic SaaS metrics such as CAC, payback period, ARPU, or
              gross retention the wrong lens unless the company separately discloses a customer-facing software product,
              which it does not. Public evidence instead offers only proxies. Zeigo’s case study shows Amarenco
              investing in tools to get closer to corporate customers, while French rooftop tender wins and the 2025
              France financing demonstrate repeated access to project-level demand. Pricing is mostly private; the rare
              public exception is Amarenco’s crowdfunding history, where the company says it raised over €30 million
              through convertible bonds offering a 5% yield over four years. Otherwise, realized PPA prices, development
              fees, EPC margins, and farm-down spreads are not public. The correct financial conclusion is that
              Amarenco’s sales efficiency has to be inferred from repeated financing closes and asset deployment, not
              from disclosed per-customer funnel data.
