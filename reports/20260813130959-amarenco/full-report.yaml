            body: >-
              Public trust evidence exists, but it is much more process-oriented than performance-oriented. The
              sustainability report surfaces ESG governance, GDPR, cybersecurity, sustainable purchasing, EU Taxonomy
              alignment, and SBTi workstreams. Amarenco also says French operations hold ISO 9001 and ISO 14001
              certifications, and the older 2030/2050 page emphasizes health-and-safety focus plus a
              zero-serious-accident claim. The “Our Businesses” page adds a zero-tolerance statement on safety and
              security during construction. These controls matter because Amarenco’s value proposition depends on
              bankability, local acceptance, and long-lived asset performance. At the same time, the public record is
              thin on the metrics an investor would really want: inverter failure rates, energy-yield variance,
              curtailment performance, SCADA architecture, incident frequency, cyber-testing cadence, or
