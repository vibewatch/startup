  topStrengths:
    - >-
      Visible platform scale: public 2026 sources describe 650 MW installed, 600+ GWh delivered in 2025, and a growing
      storage footprint.
    - >-
      Capital access remains real, with preferred equity, junior financing, and refinancing events showing continued
      lender and sponsor engagement.
    - >-
      Commercial proof is broader than a logo wall, with named customer and partner evidence across agriculture,
      industrial power, public-sector, and land-partner channels.
    - >-
      Storage, repowering, and integrated IPP positioning create a plausible path to better revenue quality than
      standalone solar development alone.
  topRisks:
    - >-
      Public financial disclosure is too thin to support a precise common-equity valuation; audited revenue, EBITDA, net
      debt, and preference seniority remain under-disclosed.
    - >-
      Merchant-power risk, negative prices, curtailment, and grid delays can compress cash flows unless storage and
      contracting strategies work as intended.
    - >-
      The capital stack appears complex, with preferred equity, holdco financing, and multiple entities that could
      subordinate common-equity outcomes.
    - >-
      Regulatory and execution risk in France and Ireland can directly affect project timing, compliance, and realized
      value.
  unresolvedGaps:
    - >-
      Audited revenue, EBITDA, cash flow, net debt, and the full preferred-equity / debt waterfall are not publicly
      disclosed in the retained source set.
    - >-
      Project-level hedge / PPA mix, storage trading economics, and portfolio capture-price sensitivity are not publicly
      available.
    - Top-customer, top-partner, and top-lender concentration remain opaque despite visible named proof.
    - >-
      A fuller like-for-like private comp set for European solar IPPs at Amarenco's stage would require paid databases
      and banker materials.
