- id: valuation-context
  title: Current financing context and why public evidence supports a range, not a mark
  body: 'Recent financing events provide evidence of capital access, not a clean valuation mark. Amarenco’s €130 million preferred-equity tranche, its €300 million junior financing led by Eiffel, and multiple refinancing and project-finance events collectively support the idea that sophisticated capital continues to back the platform. They do not, however, tell outside investors what common-equity value remains after debt, junior capital, and preferred seniority are layered onto the structure. Public sources also frame an ambitious next milestone: more than 1 TWh of annual production and more than 1 GW of installed capacity within 24 months. If achieved with recurring EBITDA and successful asset rotation, that would improve valuation support materially. But until public or private diligence reveals the actual earnings base, leverage, and preference economics, those milestones are catalysts rather than valuation facts. This is the central tension of the chapter: Amarenco may be worth a lot,
    but public evidence cannot yet prove exactly how much of that value belongs to common equity holders at a given entry price.'
  claimRefs:
  - CV013
  - CV014
  - CV020
  - CV021
  - CV022
  - CV035
  - CV036
  - CV037
  figureRefs:
  - FV002
- id: scenarios-comparables
  title: Comparable set and scenario-based valuation ranges
  body: 'The most useful comparables are not software peers or pure equipment vendors; they are renewable developers and IPPs with enough operating scale to frame Amarenco’s strategic position. Encavis is a particularly useful reference because it is also a European wind-and-solar IPP, yet it came with greater disclosure and a larger asset base at the time of its take-private. Neoen sits higher still as a much larger and more globally established operator, making it an upper strategic reference rather than a realistic direct mark. Sector benchmark sources reinforce the message: renewable multiples still exist, but they vary widely based on contracted revenue quality, cash flow visibility, and balance-sheet complexity. Because Amarenco does not publicly disclose the operating financials needed to apply those multiples directly, the valuation output here is a scenario band rather than a point estimate. The bear case assumes public risks eat into realized economics and funding confidence; the
    base case assumes Amarenco reaches its near-term production milestones but remains only partly transparent; the bull case requires evidence that storage and integrated IPP economics produce durable EBITDA quality strong enough to justify a materially tighter discount to public comparables.'
