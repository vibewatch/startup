  - - Premium / overpay risk
    - Investor pays above public-information support without full private diligence
    - Even a good company can deliver poor equity returns if entry price embeds perfection
    - Down-round risk, preference overhang, valuation compression
    - High
  - - Reference context
    - Encavis and Neoen show that high values exist for larger, more transparent renewable IPPs
    - Use them as directional ceiling references, not direct marks for Amarenco
