- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Milestone miss
    - 1 TWh production / >1 GW installed path materially misses management timeline
    - Breaks the scale-to-EBITDA conversion thesis
    - Move toward bear case or pause investment
  - - Financing deterioration
    - New financing slower, more expensive, or more senior than expected
    - Reduces common-equity upside and signals weaker capital-market support
    - Demand much lower price or stronger protections
  - - Merchant-risk worsening
    - Capture-price / negative-price trends worsen without offsetting storage or PPA response
    - Compresses implied multiple and raises downside asymmetry
    - Lower valuation band and tighten entry discipline
  - - Regulatory / grid slippage
    - French agrivoltaic issues or Irish connection delays hit flagship projects
    - Turns thesis from execution premium to execution penalty
    - Escalate diligence or pass
  - - Cap-table surprise
    - Preferred-equity or project-finance stack proves much heavier than expected
    - Shifts value away from common equity
    - Re-underwrite entirely before proceeding
  notes: These are monitorable triggers designed to prevent strategic admiration from overwhelming price discipline.
