- id: exit-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: The most plausible exit paths for Amarenco look like sponsor recapitalization, infrastructure buyout, or portfolio monetization rather than a near-term public-market debut. Public markets can value clean-power platforms, but they also punish opaque capital structures and merchant risk. That makes diligence unusually important. Before underwriting a primary or secondary investment, investors need audited revenue and EBITDA, detailed debt and preferred-equity waterfalls, hedge and PPA mix, project-level permitting and grid status, and top-counterparty concentration. Without those inputs, the investor is not choosing between a good company and a bad company; they are choosing whether to price blind. Thesis-break triggers should include missing the 1 TWh / 1 GW milestone path, slower or more expensive financing than pipeline needs require, worsening capture-price dynamics without storage mitigation, and major regulatory or grid slippage in France or Ireland. If those issues emerge, today’s
    strategic promise could still produce unattractive equity outcomes. If they are resolved well, Amarenco could become a stronger candidate quickly—but only from a much better evidenced base.
