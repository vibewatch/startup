company:
  name: Amarenco
chapter:
  number: 8
  title: Valuation
  summary: 'Amarenco looks strategically interesting but not cleanly priceable from public evidence alone. The company has credible scale signals—650 MW installed, 600+ GWh delivered in 2025, a growing 94 MW/188 MWh storage portfolio, and repeated access to debt and preferred equity capital—but public financial disclosure is still far too thin to support a precise equity mark. The best valuation posture is therefore not “buy” or “pass” in the abstract; it is a range-bound, diligence-dependent stance. Comparable references imply that public and private renewable-power values still exist, but they reward contracted cash flow visibility, EBITDA quality, and cleaner balance-sheet transparency than Amarenco currently discloses. Neoen’s €6.1 billion take-private and Encavis’ ~€2.8 billion take-private frame the upper public-IPP context, yet both are larger and far more transparent reference points. Against that backdrop, Amarenco should be underwritten at a discount until audited revenue, EBITDA,
    net debt, preference seniority, and project-level risk sharing are disclosed. Recommendation: research-more / track, with a supportable public-information enterprise-value corridor of roughly €1.4-2.2 billion in the base case and a willingness to pay more only if private diligence proves stronger recurring EBITDA, lower cap-table friction, and successful storage-led mitigation of merchant risk.'
sections:
- id: thesis-core
  title: Investment thesis versus anti-thesis
  body: 'The positive case for Amarenco starts with platform reality. This is not a concept-stage climate company. Public sources show a company with hundreds of megawatts installed, meaningful clean-power delivery, a growing storage footprint, and a capital base still willing to fund scale-up. Customers and counterparties are also more real than a superficial logo wall suggests: Vivescia, Arabian Cement, Genesis, Irish RESS wins, and public-sector site examples all indicate that Amarenco can originate and deliver projects in multiple channels. The anti-thesis is just as important. Public financial disclosure remains too weak to bridge those operating signals into a defensible private-market price. Preferred equity, junior financings, refinancings, and project-level structures prove fundability, but they also create cap-table and seniority uncertainty. Meanwhile, market risk has become harsher: negative prices, curtailment, and financing complexity now matter more than a generic solar-growth
    narrative. The right valuation frame is therefore conditional. Amarenco may deserve material value as an integrated IPP platform, but only if that value is purchased at a discount to cleaner, larger public IPP comparables until private diligence proves the quality of cash flows, leverage, and downside protection.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  tableRefs:
  - TV002
  figureRefs:
