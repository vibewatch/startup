company:
  name: Amarenco
chapter:
  number: 6
  title: Customers
  summary: 'Amarenco serves a broad counterparty map—farmers, industrial companies, financial institutions, state organizations, utilities, power-plant owners, developers, and private investors—but public proof is much deeper on categories than on durable revenue cohorts. The strongest named evidence comes from long-duration infrastructure relationships and repeat project development: Vivescia’s eight-site partnership in France, Arabian Cement’s phase-two solar expansion at its Suez facility, Genesis’s standardized monitoring partnership across agrisolar sites, Gironde’s Saint-André-de-Cubzac canopies, and Thailand’s Seacon Square through the PSS JV. These examples show that Amarenco can win multi-year, site-specific deployments rather than just market itself abstractly. What remains missing is classic SaaS-style customer durability evidence: no public NRR, GRR, churn, renewal-rate, or top-customer concentration figures were found. The underwriting posture should therefore treat Amarenco’s
    customer base as real and diverse, but still only partially transparent on revenue concentration and repeat economics.'
sections:
- id: segmentation
  title: 'Customer base segmentation: buyer, user, payer, and use case'
  body: 'Amarenco’s own segmentation page is unusually explicit about who the company serves. The listed buyer or counterparty types include farmers, industrial companies, financial institutions, state organizations, private investors, electricity providers, utilities, plant owners, and project developers. The practical needs also vary widely: some customers want greener infrastructure for their own sites or end users; some want green electricity; some want grid services; some want co-development partnerships or divestment options. This matters because Amarenco is not dependent on a single narrow revenue surface. It sells into multiple buyer archetypes across distributed generation, agricultural infrastructure, public-sector sites, storage, and investor-backed asset ownership. The implication is positive for addressable demand, but it also complicates diligence because each segment likely has different procurement cycles, contract structures, and margin profiles. Public evidence is therefore
    strongest on segment breadth and solution fit, not on segment-level revenue split.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption trajectory and visible deployment scale
  body: 'Public adoption evidence is strongest at the project and portfolio level. Amarenco’s sustainability report says the company has deployed more than 2,000 solar and solarized infrastructures and had already achieved over 600 MW of production capacity with a 1.3 GW secured pipeline in 2024, while other 2025–2026 sources describe 650 MW installed. Public operating wins reinforce that scale. In Ireland, Amarenco says it won five RESS 4 projects totaling 29.84 MW after already securing 45 MW under RESS 2. In France, the company says it and Energie Développement won 252 MWp across CRE 4 building tenders, including 194 projects and 57.5 MWp in the 13th round alone. These are not customer-revenue cohorts, but they do prove repeated market acceptance across auctions, site owners, and partner-led procurement. The key limitation is denominator quality: public sources show installations and awards more clearly than active-customer count, segment revenue, utilization, or repeat-purchase economics.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-proof
  title: 'Named customer proof: stronger than a logo wall, weaker than a revenue cohort'
  body: 'The strongest public customer evidence comes from named, operationally specific relationships. Vivescia selected Amarenco for eight ground-mounted plants on unused land in the Grand Est, with Amarenco responsible for studies, permitting, financing, construction, O&M, and end-of-life dismantling while Vivescia contributes land and local coordination. Arabian Cement expanded its Suez-facility solar relationship with Amarenco SolarizEgypt from an initial phase into a second phase, creating a rare public example of repeat expansion at a known industrial customer site. Genesis provides another form of proof: not an electricity buyer, but a named operational partner whose environmental measurement framework is embedded across Amarenco’s ground-mount and agrisolar sites over the project lifetime. Saint-André-de-Cubzac and Seacon Square show that Amarenco can also serve public-sector and commercial-site needs with site-specific solar assets. This is materially better than a simple logo
    page, but it still falls short of disclosed cohort economics or broad retention statistics.'
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
