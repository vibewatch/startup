  rows:
  - - Farmers / agricultural landowners
    - 'Buyer: farmer or landowner; payer varies'
    - Agrivoltaics, farm buildings, trackers, greenhouses
    - Explicitly named on solution page; Vivescia and agrisolar materials support fit
    - Important for differentiated land access and rural acceptance
    - No public segment revenue split
  - - Industrial companies
    - 'Buyer/payer: industrial facility owner'
    - On-site power, discounted electricity, canopies, roofing, self-consumption
    - Arabian Cement and Thailand C&I proof
    - Potentially strong C&I demand and repeat savings logic
    - No public contract-value cohort by industry
  - - State organizations / public bodies
    - 'Buyer/payer: public authorities'
    - Public-site solar, canopies, local decarbonization
    - Saint-André-de-Cubzac / Gironde project
    - Supports public-trust and tender credibility
    - Procurement conversion and renewal data absent
  - - Financial institutions / private investors
    - 'Buyer/payer: capital providers'
    - Responsible investment, bonds, co-development, divestment
    - Named on solution page and investments page
    - Important for asset monetization and funding access
    - Not the same as end-user electricity demand
  - - Utilities / electricity providers / plant owners
    - 'Buyer/user: utilities and owners'
    - Grid services, co-development, asset sales, operations
    - Named on solution page; RESS and CRE wins show utility-like market participation
    - Supports large-project distribution
    - Direct named utility customers scarce in public sources
  - - Corporate buyers / decarbonization clients
    - 'Buyer/payer: corporates'
    - Green electricity, regenerative PPAs, customer-proximity workflows
    - Zeigo case plus regenerative CPPA and Vivescia/ACC context
    - Could become higher-value direct offtake segment
    - Public customer-name list and economics remain thin
  notes: Segmentation is strongest on declared buyer categories and delivered use cases. Public revenue-band and concentration detail remains mostly absent.
