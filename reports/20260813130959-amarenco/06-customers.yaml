- id: durability
  title: Durability, retention, and what long-duration infrastructure does and does not prove
  body: 'Long-duration infrastructure relationships create a form of stickiness, but they are not the same as disclosed retention metrics. Public sources suggest durability in several ways: Vivescia’s partnership is framed around more than thirty years of value creation; Arabian Cement returned for an amended phase-two contract after a first project already in production; Genesis’s methodology is designed to monitor Amarenco sites over the lifetime of the projects; and Seacon Square’s savings are framed over a 20-year horizon. These are meaningful indicators that Amarenco is not winning one-off, instantly disposable engagements. However, public durability evidence still has major holes. No retained source disclosed NRR, GRR, churn, contract-renewal rates, satisfaction scores, or revenue concentration by account. Amarenco’s customer reality therefore looks much stickier than a typical startup’s, but not yet transparently measurable in investor-grade cohort terms. Diligence should separate
    physical-asset duration from economic retention and from recurring revenue quality.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration
  title: Expansion vectors and concentration risk
  body: 'Amarenco’s expansion logic is visible across geography, channel, and solution type. Ireland shows repeated auction wins, Egypt shows joint-venture expansion into discounted industrial power for clients, Thailand shows C&I and agri-PV expansion through a local partner, and Vivescia shows deeper penetration into agri-food real estate. Zeigo’s customer-access case study adds another angle: Amarenco is trying to move closer to corporate buyers rather than remain only a project-originator behind intermediaries. The adverse side is that public customer transparency remains thin relative to this breadth. Named examples are still limited, public concentration metrics are absent, and several visible relationships are partnerships or JVs rather than direct end-customer contracts. That creates a real diligence question: how much of Amarenco’s future growth is driven by repeatable direct customer acquisition versus by a smaller set of large partners, tenders, and capital-backed site portfolios?
    The business appears commercially real, but concentration and channel dependence remain under-disclosed.'
  claimRefs:
