  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited group-level revenue, EBITDA, leverage, and cash-flow statements that reconcile project assets to corporate economics.
    whyItMatters: Installed capacity and financing events do not by themselves show whether the IPP model is self-funding or value accretive at the corporate level.
    diligencePath: Request the latest audited consolidated financial statements, lender model, and segment bridge from development fees to recurring production EBITDA.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: A current post-2026 valuation, full share-class map, and terms for the Arjun preferred-equity instruments and any junior HoldCo warrants or step-ups.
    whyItMatters: Without the preference stack, new-money pricing, and any downside protections, investors cannot translate Amarenco’s financing momentum into equity value.
    diligencePath: Obtain the cap table, shareholder agreement, 2026 financing term sheets, and any fairness materials prepared for the preferred-equity tranche.
    relatedQuestionRefs:
    - QO025
  - type: conflicting-data
    severity: minor
    topic: 2030-target-definition
    missingEvidence: Management clarification on whether 2030 success is 2.7 GW converted, 4 GW installed/lifecycle, or another KPI now used internally.
    whyItMatters: Target ambiguity complicates underwriting of growth pacing, storage needs, and the realism of the company’s autonomy narrative.
    diligencePath: Ask management for the latest board-approved strategic roadmap and metric definitions for installed, in-construction, advanced-development, and lifecycle portfolio figures.
    relatedQuestionRefs:
    - QO012
    - QO025
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: minor
    topic: headquarters-and-governance-map
    missingEvidence: A definitive public corporate-structure map showing legal domicile, parent-head-office designation, and board composition.
    whyItMatters: Mixed Ireland/France/Paris signaling is manageable operationally but creates noise for legal diligence, tax review, and governance benchmarking.
    diligencePath: Request the corporate structure chart, principal registered addresses, and board/committee list used for lenders and shareholders.
    relatedQuestionRefs:
    - QO005
    - QO008
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
