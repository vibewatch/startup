company:
  name: Amarenco
chapter:
  number: 1
  title: Company Overview
  summary: Amarenco is a Franco-Irish solar-and-storage IPP platform formed in 2018 from the merger of Irish developer Amarenco and French engineering firm Méthode Carré. Public 2025-2026 disclosures show 650 MW installed, roughly 600 MW in construction or construction start, and 2.9 GW in advanced development, supported by a rapid financing cadence that included a €300 million equity raise in 2023, €500 million multi-country debt in 2024, €188 million France financing in 2025, and €430 million of 2026 HoldCo plus preferred-equity capital. The company is scaling toward a recurring-cash-flow IPP model under new CEO Frédéric Maenhaut, but underwriting remains constrained by mixed headquarters presentation, inconsistent 2030 capacity targets, and limited public financial disclosure.
sections:
- id: identity-footprint-model
  title: Identity, footprint, and operating model
  body: 'Amarenco’s public identity is more nuanced than the user-supplied shorthand of a single French IPP. The company’s own “Who are we?” page says the current Amarenco was formed in 2018 from the merger of two predecessor businesses: Méthode Carré, a French photovoltaic design-and-project-management company founded in 2008 by Olivier Carré, and Amarenco, founded in Ireland in 2013 by Alain Desvigne and John Mullins. That origin story matters because the company still presents itself as a cross-border platform: its location page lists Cork as the Europe head office and Lagrave as the France head office, while corporate press releases are typically datelined Paris. Operationally, Amarenco now concentrates on Europe—especially France, Ireland, Spain, Portugal, and Austria—with additional French overseas presence. Its stated model is vertically integrated: it develops, finances, constructs, operates, and increasingly optimizes solar assets with storage and regenerative land-use overlays,
    rather than simply selling projects at notice-to-proceed.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO036
