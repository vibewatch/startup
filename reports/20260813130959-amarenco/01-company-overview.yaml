- id: leadership-governance
  title: Leadership and governance
  body: 'Leadership also shifted materially in 2025. Amarenco’s governance update says the company moved from a co-founder-led model toward a more structured management-team setup: co-founder Alain Desvigne became President while Frédéric Maenhaut, previously deputy CEO, became CEO. Public leadership materials show a wider bench than just the founders, including a CFO, CIO, COO, storage CEO, country managing directors, ESG leadership, and public-affairs leadership. That depth helps, but it does not eliminate key-person concentration. Desvigne still owns the strategic narrative around investors, regeneration, and partner relations, while Maenhaut now owns execution of the 2026-2030 plan. The April 2025 appointment of Declan Cullinane to run Amarenco Ireland shows the company is localizing execution in key markets. Even so, board composition, independent-director presence, and shareholder-rights architecture remain largely undisclosed in public material, which leaves governance quality only
    partially underwritten.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO040
  tableRefs:
  - TO002
- id: scale-assets-roadmap
  title: Scale, assets, and roadmap
  body: 'By mid-2025 Amarenco’s disclosed operating footprint had become meaningful enough to treat it as a scaled private European IPP rather than a small developer. Multiple sources converge on 650 MW of installed solar capacity. Governance and financing disclosures also cite roughly 600 MW in construction or construction start and 2.9 GW of advanced projects within a broader 4 GW life-cycle portfolio. Amarenco pairs that solar base with a growing storage franchise: Claudia in Saucats was initially one of Europe’s largest battery projects at 105 MW / 100 MWh and is being repowered to 94 MW / 188 MWh under a €65 million refinancing, while the separate 100 MW Osmo project extends the company’s French battery footprint. The company says it delivered more than 600 GWh in 2025 and is targeting more than 1 TWh of annual production backed by over 1 GW installed capacity within 24 months. The strategic through-line is clear: Amarenco is trying to become a recurring-production platform, not merely
    an origination shop.'
  claimRefs:
