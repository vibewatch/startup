- id: capital-base-milestones
  title: Capital base and milestones
  body: 'The capital stack has expanded almost every year since 2023. Arjun Infrastructure’s investment announcement says its €300 million equity commitment delivered an approximately 30% stake and brought in a new strategic shareholder alongside Tikehau and Crédit Agricole-linked investors. Amarenco then layered on increasingly sophisticated debt: a €500 million multi-country financing plus €150 million accordion in December 2024, a €188 million France-specific facility for roughly 124 MWp / about 500 projects in April 2025, and a €300 million junior HoldCo financing led by Eiffel in January 2026. That was followed by a €130 million preferred-equity tranche from Arjun, with a second tranche planned for 2026 and BNP Paribas support. Management frames these financings as stepping stones toward structural financial autonomy. The milestone record therefore supports two readings at once: Amarenco has earned repeated access to institutional capital, but it also still depends on external capital-market
    execution to complete its IPP transition.'
