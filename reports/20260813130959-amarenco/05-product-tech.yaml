- id: architecture
  title: 'Operating architecture: how projects move from origination to operation'
  body: 'The strongest public technical evidence is about Amarenco’s operating architecture. The sustainability report explicitly says the company manages projects from conception, development, financing, and construction through long-term operation, and its process map frames this as a value chain rather than a one-off EPC handoff. The “Our Businesses” page adds practical detail: the company combines equity, quasi-equity, crowdfunding, and non-recourse bank financing; manages technical, legal, fiscal, and commercial engineering during development; runs construction with specialized contracting expertise; and performs long-term asset management and O&M. Battery-storage posts then show how that architecture extends into operational optimization: Claudia is being repowered with hybrid NMC/LFP architecture, longer duration, reused infrastructure, and a tolling framework, while Osmo uses a former industrial site and optimized grid connection conditions. In other words, Amarenco’s technology
    story is really an integration story—capital structuring, site design, permitting, grid integration, and operations synchronized into one project-delivery machine.'
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: trust-quality
  title: Trust, quality, safety, and compliance controls
  body: 'Public trust evidence exists, but it is much more process-oriented than performance-oriented. The sustainability report surfaces ESG governance, GDPR, cybersecurity, sustainable purchasing, EU Taxonomy alignment, and SBTi workstreams. Amarenco also says French operations hold ISO 9001 and ISO 14001 certifications, and the older 2030/2050 page emphasizes health-and-safety focus plus a zero-serious-accident claim. The “Our Businesses” page adds a zero-tolerance statement on safety and security during construction. These controls matter because Amarenco’s value proposition depends on bankability, local acceptance, and long-lived asset performance. At the same time, the public record is thin on the metrics an investor would really want: inverter failure rates, energy-yield variance, curtailment performance, SCADA architecture, incident frequency, cyber-testing cadence, or mean-time-to-repair. The right conclusion is that Amarenco has visible governance and compliance scaffolding, but
    only partial public evidence on whether those systems consistently translate into measurable technical quality at fleet scale.'
  claimRefs:
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
