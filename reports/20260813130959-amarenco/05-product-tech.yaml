- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Amarenco solution
  - Measurable benefit
  - Limitation
  rows:
  - - Need low-carbon electricity for owned site
    - Procure project, permit site, build plant, operate long term
    - Distributed or rooftop solar project with financing and O&M support
    - Potential long-term cost control and local decarbonization
    - Public realized price and savings data not disclosed
  - - Need agricultural land use plus solar generation
    - Balance farm productivity with power generation constraints
    - Agrivoltaic design plus regeneration framing
    - Lower land-artificialization narrative and biodiversity / water-use benefits
    - No public per-project crop-yield dataset
  - - Need grid flexibility / storage revenues
    - Secure site, financing, grid access, and operating framework
    - Standalone BESS projects such as Claudia and Osmo
    - Frequency control, balancing, reserve, tolling, and resilience value
    - Public cash-yield and degradation metrics unavailable
  - - Need investor-grade project platform
    - Source pipeline, structure equity/debt, execute build, manage asset
    - Integrated financing-development-construction-O&M model
    - Single-platform coordination across lifecycle
    - Unclear how much margin or WACC edge comes from integration
  - - Need decarbonization narrative aligned with ecology
    - Combine energy procurement with ecosystem-restoration goals
    - Regenerative electrons / ECHO / regenerative CPPA framing
    - Stronger stakeholder and sustainability positioning
    - Impact claims are better narrated than independently quantified
  notes: The measurable-benefit column stays conservative because Amarenco discloses product forms more clearly than customer-by-customer outcome data.
