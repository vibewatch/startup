- id: module-map
  title: Module, asset, and capability map
  body: 'The public module map is broader than “solar developer” shorthand suggests. Amarenco’s sustainability report defines the business around distributed energy and utility-scale solar, while separate posts and project pages show agrivoltaic formats, rooftop projects, ground-mounted plants, and large standalone battery storage. The company also treats regeneration as a cross-cutting design layer through the ECHO program rather than a nice-to-have CSR appendix. On the operating side, Amarenco claims technical, administrative, insurance, security, and financial management of photovoltaic plants through its O&M stack. On the storage side, the technical evidence is more concrete than on solar hardware itself: Claudia’s repowering details, Osmo’s 100 MW / two-hour design, and the group’s push for flexibility services indicate that BESS is moving from adjacency to a core product line. Amarenco’s differentiation therefore comes from combining multiple project forms—rooftop, utility-scale, agrivoltaic,
    and storage—inside one execution model rather than from a single breakthrough component.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
