tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset line
  - Primary user / counterparty
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Distributed rooftop solar
    - Commercial / industrial site owners, public-site partners
    - Mature and repeatedly referenced
    - Good fit for localized decarbonization and lower land footprint
    - Need yield, uptime, and customer-economics data by cohort
  - - Ground-mounted utility-scale solar
    - Utilities, investors, land partners, corporate offtakers
    - Mature
    - Core IPP asset base with full-lifecycle management
    - Need realized project returns and permitting timelines
  - - Agrivoltaic / agrisolar projects
    - Farmers, agri-food groups, rural landowners
    - Growing / differentiated niche
    - Combines energy production with agricultural compatibility and biodiversity claims
    - Need crop-yield and farmer-economics evidence by project
  - - Battery energy storage systems (BESS)
    - Grid operators, power markets, lenders, tolling counterparties
    - Scaling quickly
    - Claudia and Osmo show increasingly central storage capability
    - Need operating KPIs, degradation data, and merchant-risk exposure
  - - Operation & maintenance / asset management
    - Project SPVs and long-duration asset owners
    - Mature internal capability
    - Amarenco claims technical, administrative, insurance, security, and financial management
    - Need fleet-wide uptime and MTTR metrics
  - - Regenerative overlay / ECHO program
    - Corporate partners, communities, land stakeholders
    - Active but still partly narrative-led
    - Differentiates project siting and stakeholder framing
    - Need measured biodiversity / soil outcomes tied to asset performance
  - - Financing / structuring layer
    - Co-investors, lenders, project SPVs
    - Mature
    - Integrated access to equity, quasi-equity, crowdfunding, and non-recourse debt
    - Need evidence on whether structure creates better cost of capital than peers
  notes: Amarenco’s public product surface is asset-centric, not app-centric. Rows therefore combine physical assets with the enabling delivery modules required to make those assets bankable and operable.
