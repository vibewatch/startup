- id: roadmap-differentiation
  title: Roadmap, differentiation, and the limits of the public moat
  body: Amarenco’s public roadmap is ambitious but not perfectly internally consistent. The sustainability report points to a 2024/2025 industrialization focus, a 100% power-generation business model, first regenerative CPPA activity, and capacity targets of 1 GW by 2026, 3 GW by 2030, and 25 GW by 2050. Other official pages still reference 10 regenerative GW by 2030 and 50 by 2050. That inconsistency does not negate the strategic direction, but it does reduce confidence in the precision of roadmap communication. The same is true of moat language. Amarenco clearly has differentiated know-how in agrivoltaics, regenerative positioning, financing structures, and storage integration, and it appears increasingly capable of repowering and hybridizing assets rather than merely building greenfield solar plants. But the public record does not show proprietary chemistry, unique software IP, or disclosed operational data that would make the moat deeply technical. The company should therefore be underwritten
    as a strong integrator and operator with niche design advantages, not as a proprietary hard-tech platform.
  claimRefs:
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
