- id: switching-costs-distribution
  title: Switching costs, multi-homing, and distribution power
  body: 'Competitive power in this market sits less in brand and more in control points: land origination, grid access, permitting, financing, and offtake. Before a project is tied up, multi-homing is common—landowners, lenders, and corporate buyers can assess multiple developers. After interconnection rights, land control, and contract structure are secured, switching costs rise sharply and the project economics become much harder to dislodge. That dynamic favors scaled incumbents on portfolio acquisitions and grid-heavy markets, but it also leaves room for localized specialists in more fragmented or land-sensitive niches. CVE’s direct-sales model, Lightsource bp’s data-center offering, and the utilities’ broader industrial relationships all illustrate different forms of distribution power. Amarenco’s own route-to-market proof points—French rooftop tender wins, Irish RESS projects, and battery repowering—suggest it can win where execution detail matters. The tradeoff is that those same
    niches can be copied if larger rivals decide the margins justify building agrivoltaic and storage capabilities in-house.'
