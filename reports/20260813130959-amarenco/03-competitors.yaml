- id: peer-profiles
  title: Peer profiles and where Amarenco is actually differentiated
  body: The strongest global-scale comparables are Neoen and Sonnedix, which publicly market 9.3 GW and 11.4 GW respectively, both far above Amarenco’s current 650 MW installed base. Lightsource bp and BayWa r.e. also present integrated develop-construct-operate capabilities with explicit battery-storage positioning and broader geographic reach. CVE is the clearest distributed-energy peer because it emphasizes decentralized production, PPAs, self-consumption, and service to companies, municipalities, and agriculture. Iberdrola, ENGIE, and EDF power solutions are less like-for-like operationally, but they matter because they define the upper bound of counterparty strength and route-to-market reach in Europe. Grenergy’s large BESS financing in Spain shows how quickly storage specialization is becoming part of competitive positioning. Against that backdrop, Amarenco’s comparative strengths are not a unique technology stack or unmatched scale; they are its localized agrivoltaic playbook, France-and-Ireland
    execution depth, and willingness to combine solar with storage and regeneration in smaller, more customized formats.
  claimRefs:
