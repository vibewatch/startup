  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-and-wacc
    missingEvidence: Reliable peer-level pricing, return thresholds, and cost-of-capital benchmarks for Amarenco versus larger IPPs and utilities.
    whyItMatters: Public webpages reveal business models and scale, but not the actual capital-cost edge that often determines who wins auctions, PPAs, or portfolio acquisitions.
    diligencePath: Request Amarenco management’s competitive bid logs and compare financing spreads, target IRRs, and win/loss reasons against top peers.
    relatedQuestionRefs:
    - QP018
    - QP024
  - type: missing-source
    severity: material
    topic: competitor-win-rates
    missingEvidence: Public win-rate or margin data showing where Amarenco reliably beats CVE, utilities, or larger IPPs.
    whyItMatters: A strategy narrative without empirical conversion or margin evidence can overstate niche differentiation.
    diligencePath: Obtain by-geometry pipeline conversion rates, tender strike rates, and lost-deal analyses by competitor class.
