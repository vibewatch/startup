chapter:
  number: 3
  title: Competitors
  summary: 'Amarenco faces a two-sided competitive set: larger diversified utilities and global IPPs that win on scale and cost of capital, and distributed-solar specialists that win on local execution, land access, and customer intimacy. The European large-scale solar market is already concentrated, with the top 10 owners controlling nearly half of tracked operational capacity, while PPA and storage market dynamics increasingly reward players that can bundle batteries, flexible offtake, and sophisticated structuring. Amarenco’s differentiators—agrivoltaics, distributed solar, and a regeneration narrative—are real but commercial rather than technological, so moat durability depends on execution and financing discipline more than proprietary IP.'
sections:
- id: landscape-categories
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: 'Amarenco does not compete against a single homogeneous peer set. Direct peers include distributed or mid-cap European IPPs such as CVE, Akuo, BayWa r.e., Sonnedix, Neoen, and Lightsource bp, each of which combines development and long-term asset ownership in slightly different ways. Larger incumbent threats come from integrated utilities and diversified renewable groups—especially Iberdrola, ENGIE, and EDF power solutions—which can pair project development with bigger balance sheets, grid relationships, broader customer access, and lower perceived counterparty risk. Adjacent threats come from storage-heavy specialists such as Grenergy and from solar portfolios being consolidated by financial or industrial owners. Substitutes also matter: utilities, municipalities, or large corporates can choose internal build, JV structures, or direct procurement models rather than work with a mid-cap IPP. The key competitive question is therefore where Amarenco’s local-development and land-use
    strengths matter more than sheer scale or ultra-cheap capital.'
