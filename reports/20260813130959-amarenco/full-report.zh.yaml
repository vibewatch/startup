      - number: '8.3'
        title: 当前融资背景：为什么公开证据只能支持区间，而不是定价
        blocks:
          - type: paragraph
            body: >-
              近期融资事件证明 Amarenco 能接触资本，但不能给出干净的估值标记。Amarenco 的 €130 million 优先股批次、Eiffel 牵头的 €300 million
              次级融资，以及多次再融资和项目融资事件，合在一起支持一个判断：成熟资本仍在支持平台。可是，上述融资事件并不告诉外部投资人，在债务、次级资本和优先清偿顺位层层叠加之后，普通股还剩多少价值。公开来源还给出了一个激进的下一节点：24
              个月内年产量超过 1 TWh、装机超过 1 GW。如果目标伴随经常性 EBITDA
              和成功资产轮动落地，估值支撑会明显增强。但在公开或私人尽调披露真实盈利基础、杠杆和优先权经济性之前，这些节点只是催化剂，不是估值事实。本章的核心张力就在这里：Amarenco
              可能很值钱，但公开证据还不能证明，在某个入场价下，价值到底有多少属于普通股持有人。
