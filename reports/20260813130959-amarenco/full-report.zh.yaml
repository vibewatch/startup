      - number: '2.4'
        title: 驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场上行因素很容易识别：脱碳政策、能源安全优先级、屋顶强制要求和电池规模学习曲线，都会支撑更多太阳能部署。难点在于把这些驱动因素转化为持久经济性。SolarPower Europe、S&P、Aurora、Veyt
              和 Pexapark 都指向同一个结构性摩擦：随着可再生能源渗透率上升，无差异太阳能 MWh 在日照时段的价值下降，电网接入放慢，长期购电结构也变得更技术化。西班牙最清楚地展示了现货敞口问题：2025
              年太阳能捕获价格跌破 €40/MWh，捕获率降至 61%。德国则呈现另一种失效模式：当盈亏平衡价格跑过买方支付意愿，独立太阳能 PPA 流动性就会变弱。Aurora 的排队、拥堵和限电数据，让物理约束更清楚。对
              Amarenco 来说，这意味着储能、本地执行和签约纪律已经是入场要求，而不是可选增强项。
