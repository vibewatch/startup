        title: 运营架构：项目如何从发起走到运营
        blocks:
          - type: paragraph
            body: >-
              最强的公开技术证据，来自 Amarenco 的运营架构。可持续发展报告明确表示，公司管理项目从构思、开发、融资、建设到长期运营的全过程，流程图把这描述为价值链，而不是一次性 EPC 交接。“Our
              Businesses” 页面补充了实务细节：公司结合股权、准股权、众筹和无追索银行融资；在开发阶段管理技术、法律、税务和商业工程；用专业承包能力推进建设；并执行长期资产管理和
              O&M。电池储能帖子随后显示，这套架构如何延伸到运营优化：Claudia 正用混合 NMC/LFP 架构、更长时长、复用基础设施和容量租赁框架做翻新提效；Osmo
              则利用原工业场地和优化后的电网接入条件。换句话说，Amarenco 的技术故事本质上是整合故事——资本结构、场地设计、许可审批、电网整合和运营，被同步进同一台项目交付机器。
