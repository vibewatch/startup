      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据支持对资本充足性作分层判断。积极一面，Amarenco 已在资本结构多个层级反复吸引新资金：2023 年来自 Arjun 和共同投资者的超过 €300 million，2024 年 €500
              million 债务平台，2025 年 €188 million 法国建设融资，2026 年初 €300 million HoldCo 平台，以及 2025 年 12 月完成的 €130 million
              优先股融资，第二笔计划于 2026 年推进。这样的节奏说明贷款方和投资者认为平台可融资。消极一面，公司自己仍把结构性财务自主描述为未来 24 个月内的里程碑，需要年发电量超过 1 TWh、装机容量超过 1 GW
              后实现。换句话说，Amarenco 还没有把自己呈现为可由当前经营现金流自我供血的公司。登记来源页面确认部分爱尔兰实体近期提交了年度申报和 2024
              年账目，但没有呈现足够细节来评估非受限现金、合并杠杆、约束条款余量或现金跑道。因此，证据支持公司能继续获得资本，却不能干净证明今天已经实现资产负债表独立。
