  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Amarenco 的正向逻辑从平台真实性开始。它不是概念期气候公司。公开来源显示，公司已装机数百兆瓦、交付了有意义的清洁电力、储能足迹在扩大，资本基础也仍愿意支持规模化。客户和交易对手也不只是浅层 logo
              墙：Vivescia、Arabian Cement、Genesis、爱尔兰 RESS 中标，以及公共部门场址案例，都说明 Amarenco
              能在多个渠道里获取并交付项目。反向逻辑同样重要。公开财务披露仍太薄，无法把这些运营信号转成一个站得住的私募市场价格。优先股、次级融资、再融资和项目级架构证明公司能融资，但也制造了股权结构表和清偿顺位的不确定性。与此同时，市场风险更严酷了：负电价、弃电和融资复杂度，如今比泛泛的太阳能增长叙事更重要。因此，正确的估值框架必须带条件。Amarenco
              作为一体化 IPP 平台，可能有可观价值；但在私人尽调证明现金流、杠杆和下行保护质量之前，买入价格应相对更干净、更大的上市 IPP 可比公司打折。
