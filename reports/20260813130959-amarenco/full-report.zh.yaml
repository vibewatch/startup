  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户流程看，Amarenco 实际交付什么
        blocks:
          - type: paragraph
            body: >-
              Amarenco 的公开材料描述的是全生命周期可再生基础设施服务，而不是狭窄的独立技术 SKU。从流程看，客户或交易对手在需要太阳能或储能基础设施的融资、项目发起、许可、建设和长期运营组合时，会找
              Amarenco。可持续发展报告和 “Our Businesses”
              页面把公司放在四个反复出现的功能周围：融资、开发、建设、运营与维护；它们围绕两类核心资产：光伏发电和能源储存。不同细分市场的买方任务不同：土地所有者或农业食品合作伙伴需要保留土地用途的农光互补设计；企业交易对手需要脱碳电力，可能还需要再生型
              CPPA；面向电网的储能项目需要灵活容量和可融资运营结构。关键产品结论是，Amarenco 的产品是开发和运营太阳能加储能资产的一体化运营模式，而不是单一可输出的软件平台或专利硬件模块。
