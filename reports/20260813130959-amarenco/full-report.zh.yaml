      - number: '3.4'
        title: 护城河耐久性、商品化风险与既有巨头反应
        blocks:
          - type: paragraph
            body: >-
              因此，竞争护城河更偏实务，而非专有资产。Amarenco
              的土地利用经验、利益相关方管理、贷款方关系，以及把农光互补与储能打包的能力都有意义，但如果市场继续集中、储能打包变成入场券，这些优势并非永久可防守。Solarplaza 的所有权数据、Aurora
              的电网压力分析和 PPA 市场信号都表明，价值正在流向资金成本极低，或结构设计和优化能力极强的玩家。对任何想打通用公用事业级市场的中型 IPP
              来说，这都是问题。相比完全暴露在现货的公用事业级竞争，Amarenco 在分布式、农光互补和定制化重的子板块中位置更好。但这些优势是商业和运营性质的，必须靠反复执行持续滚大。如果公用事业公司或头部 IPP
              向下沉市场扩张，Amarenco 可能在没有技术护城河可依靠的情况下承受利润率挤压。
