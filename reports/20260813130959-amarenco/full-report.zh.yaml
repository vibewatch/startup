      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 真实平台规模：650 MW 已装机、2025 年交付 600+ GWh、储能版图扩大
        - 若公开或私有尽调显示规模主张背后的项目经济性偏弱，则下调
      - - 一体化 IPP 模型可把开发转化为经常性 EBITDA，并叠加资产轮动
        - 只有披露经审计 EBITDA 质量和资产轮动利润率后，才上调
      - - 客户和交易对手证据足够真实，可支撑商业相关性
        - 若集中度实际偏窄，或收入高度依赖合作伙伴中介，则下调
      - - 反复融资证明资本获取仍然可见
        - 若资本成本上升，或结构上优先于普通股上行收益，则下调
      - - 公开财务披露太弱，今天无法精确定价
        - 若提供经审计收入、EBITDA、净债务和股权结构瀑布，则上调
      - - 市场化电价、电网和监管风险支持相对上市 IPP 同行折价
        - 若储能和合约收入能被证明抵消这些风险，则上调
    notes: 反向逻辑主要围绕定价、透明度和堆叠优先级，而不是质疑 Amarenco 是否有真实业务。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 1 TWh / 1 GW 路径滑坡；市场化电价 / 捕获压力持续；融资仍然昂贵；透明度缺口未补
        - 可支撑 EV 区间约 €0.8-1.5B；相对上市 IPP 大幅折价，并高度警惕优先股 / 债务
        - 融资压力、限电、负电价、合规拖累
        - 中
      - - 基准
        - 发电量和装机里程碑大体兑现；储能有帮助，但不能完全抵消市场化电价风险；融资仍可取得
        - 可支撑 EV 区间约 €1.4-2.2B；只有结构强、尽调扎实才可投
        - 股权结构优先级、电网延迟、部分市场化电价敞口
        - 中高
      - - 乐观
        - 里程碑达到或超额完成；经常性 EBITDA 质量得到证明；储能变现跑通；资本堆叠比担心的更干净
        - 可支撑 EV 区间约 €2.3-3.1B，接近高质量私有 IPP 区域，但仍低于头部大型可比公司
        - 执行、资本成本、扩张治理
        - 中低
      - - 溢价 / 过度支付风险
        - 投资人在没有完整私有尽调的情况下，支付高于公开信息支撑的价格
        - 即便公司不错，若入场价按完美情景定价，股权回报也可能很差
        - 降轮风险、优先股悬置压力、估值压缩
        - 高
      - - 参照背景
        - Encavis 和 Neoen 说明，规模更大、透明度更高的可再生 IPP 可以拿到高估值
        - 把它们当作方向性上限参照，而不是 Amarenco 的直接定价标尺
        - 规模 / 披露不匹配带来的伪精确
        - 高
    notes: 这些区间是企业价值走廊，不是普通股价值标尺，因为债务和优先股堆叠的公开透明度不足。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV036
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Encavis 私有化
        - 要约价格和股权价值
        - €17.50/share；股权价值约 €2.8B；2024-2025 年私有化
        - 欧洲风电 / 太阳能 IPP，运营基础更大，也有融资通道
        - 规模更大、披露更多，结构也不同于 Amarenco
      - - Neoen 私有化
        - 要约价格和企业价值
        - €39.85/share；EV 约 €6.1B；2024-2025 年 Brookfield 私有化
        - 规模化可再生 IPP 价值的高端战略参照
        - 平台大得多，公开画像更清晰，不是近似同类定价标尺
      - - Finerva 上市绿色能源组
        - 上市公司中位倍数
        - 2026 年 Q1 中位 EV/Revenue 为 5.4x，EV/EBITDA 为 16.3x
        - 板块调整后上市可再生能源公司的方向性倍数锚
        - 缺少 Amarenco 收入 / EBITDA 披露，不能直接套用
      - - DealMatrix 私有可再生能源基准
        - 私有市场估值框架
        - 私有估值取决于合约收入、电网时间表和资本成本；储能整合越来越重要
        - 可用于私有平台承销逻辑
        - 框架来源，不是 Amarenco 的实时定价标尺
      - - Phoenix 上市可比区间
        - EV/EBITDA 离散度
        - 2026 年宽区间为 5.2x 至 60.2x；资产所有者和一体化玩家通常远低于科技属性更重的离群值
        - 提醒倍数差异由商业模式质量驱动
        - 若没有更紧的财务输入，这个区间太宽，无法给 Amarenco 定价
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-useful public and private-market references found in retained sources. They are
        not a full peer screen across all renewable developers or IPPs.
    notes: 这些可比对象有意用于战略和估值语境，不做伪精确的一对一同行对标。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV029
  - id: TV005
    title: 投资逻辑破裂和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 里程碑未达
        - 1 TWh 发电量 / >1 GW 装机路径明显落后管理层时间表
        - 打破规模转化为 EBITDA 的逻辑
        - 转向悲观情景，或暂停投资
      - - 融资恶化
        - 新融资慢于预期、贵于预期，或优先级高于预期
        - 压缩普通股上行空间，并显示资本市场支持转弱
        - 要求大幅更低价格或更强保护
      - - 市场化电价风险恶化
        - 捕获价格 / 负电价趋势恶化，且没有储能或 PPA 对冲响应
        - 压缩隐含倍数，加大下行不对称
        - 下调估值区间，收紧入场纪律
      - - 监管 / 电网滑坡
        - 法国农光互补问题或爱尔兰接入延迟打击旗舰项目
        - 把投资逻辑从执行溢价扭成执行惩罚
        - 升级尽调或放弃
      - - 股权结构意外
        - 优先股或项目融资堆叠明显重于预期
        - 把价值从普通股转走
        - 推进前全面重新测算
    notes: 这些触发项可监测，用来防止战略欣赏压过价格纪律。
    claimRefs:
      - CV032
      - CV035
      - CV036
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 收入、EBITDA、现金流，以及业务分部 / 地理拆分
        - 需要这些证据，才能把宽泛平台价值落到可辩护的股权标尺
        - 管理层 / 财务尽调
      - - 资本堆叠
        - 债务偿还表、优先权、清算瀑布、契约和 DSCR
        - 普通股价值取决于优先索偿
        - 资金 / 法律尽调
      - - 收入质量
        - PPA / 市场化售电 / 交易组合和套保策略
        - 解释对负电价和限电的敏感性
        - 商业 / 电力市场尽调
      - - 管线质量
        - 按 MW、许可阶段、电网状态和预计 COD 列出的项目清单
        - 决定 1 TWh / 1 GW 里程碑是否可融资、可信
        - 开发尽调
      - - 交易对手集中度
        - 头部客户、合作伙伴、土地提供方和贷款人
        - 商业覆盖广，不等于收入分散
        - 客户 / 合作伙伴尽调
      - - 储能经济性
        - BESS 和改造升级资产的项目级商业案例
        - 这是市场化电价风险缓释叙事的核心
        - 资产级尽调
    notes: 缺少这些材料，Amarenco 仍是战略上可信、但估值部分不透明的标的。
    claimRefs:
      - CV011
      - CV012
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 最高信号量的拐点，是机构资本成形、治理专业化，以及从项目开发商转向储能赋能的 IPP。
    data:
      items:
        - date: '2013-01-01'
          label: 爱尔兰 Amarenco 成立
          detail: Alain Desvigne 和 John Mullins 在爱尔兰创立最初的 Amarenco 开发平台。
          tone: positive
        - date: '2018-01-01'
          label: 合并形成当前集团
          detail: Amarenco 与 Méthode Carré 合并，整合跨境开发和工程能力。
          tone: positive
        - date: '2023-03-15'
          label: Arjun 领投股权轮
          detail: €300m 融资和约 30% 股权，确立规模化机构背书。
          tone: positive
        - date: '2024-12-02'
          label: €500m 多国债务
          detail: 大型贷款人财团为西班牙、葡萄牙、爱尔兰和奥地利项目及再融资提供资金。
          tone: positive
        - date: '2025-04-10'
          label: €188m 法国融资
          detail: 本土贷款人为约 500 个法国屋顶和地面项目提供资金。
          tone: positive
        - date: '2025-07-10'
          label: 治理重塑
          detail: Alain Desvigne 出任总裁；Frédéric Maenhaut 出任 CEO。
          tone: warning
        - date: '2026-01-01'
          label: €300m HoldCo 平台
          detail: Eiffel 牵头的次级资本募集完成，用于优化集团层面资本结构。
          tone: positive
        - date: '2026-02-01'
          label: Claudia 改造升级
          detail: 旗舰电池从 105 MW / 100 MWh 调整为 94 MW / 188 MWh，并获得新再融资。
          tone: positive
        - date: '2026-03-13'
          label: €130m 优先股
          detail: Arjun 支持的这一档融资，被定位为迈向结构性财务自主的桥梁。
          tone: warning
        - date: '2026-07-15'
          label: TotalEnergies 组合并入
          detail: 98 GWh / ~€10m EBITDA 组合加深自有经常性发电版图。
          tone: positive
    approximationNotes: 日期为发布或公告日期；融资交割可能略早于公开披露。
    claimRefs:
      - CO018
      - CO022
      - CO024
      - CO026
      - CO027
      - CO032
      - CO038
      - CO039
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Amarenco 的模式把资本提供方、一体化太阳能开发、储能优化和再生土地利用主张串成一个平台逻辑。
    data:
      nodes:
        - id: capital
          label: 机构资本（Arjun、Tikehau、Crédit Agricole、Eiffel）
        - id: develop
          label: 一体化开发 / 融资 / 建设
        - id: solar
          label: 650 MW 已装机太阳能基础
        - id: storage
          label: 储能资产（Claudia、Osmo）
        - id: customers
          label: 土地所有者、C&I 屋顶、公用事业公司、本地利益相关方
        - id: regen
          label: 农光互补和土壤再生议程
      edges:
