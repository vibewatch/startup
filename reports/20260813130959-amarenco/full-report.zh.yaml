            body: >-
              公开模块版图比“太阳能开发商”这个短描述更宽。Amarenco 的可持续发展报告围绕分布式能源和公用事业级太阳能定义业务，另有帖子和项目页面展示农光互补形式、屋顶项目、地面电站和大型独立电池储能。公司还通过
              ECHO 计划，把再生视为贯穿设计层，而不是可有可无的 CSR 附录。在运营端，Amarenco 称其 O&M
              栈覆盖光伏电站的技术、行政、保险、安全和财务管理。在储能端，技术证据比太阳能硬件本身更具体：Claudia 的翻新提效细节、Osmo 的 100 MW / 两小时设计，以及集团对灵活性服务的推进，都表明 BESS
              正从相邻业务走向核心产品线。因此，Amarenco 的差异化来自在同一套执行模式中组合多种项目形态——屋顶、公用事业级、农光互补和储能——而不是单一突破性组件。
