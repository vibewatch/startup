      - number: '7.3'
        title: 运营与市场风险：捕获价格、限电、储能与成本波动
        blocks:
          - type: paragraph
            body: >-
              Amarenco
              下一层风险是经济性的，而不只是监管性的。欧洲范围内，太阳能过剩已经不再是边缘情形。分析师和市场来源显示，随着太阳能容量跑在系统灵活性前面，捕获系数崩塌、负价小时增加、限电扩散。法国尤其相关，因为它既是
              Amarenco 的核心市场之一，也是负电价暴露变得更严重的地方之一。这正是共址电池、翻新提效和更聪明市场参与重要的原因。Amarenco 看起来理解这一点，并且已经在建设和翻新电池资产，但这些资产也需要自己的
              EPC、融资和电网执行纪律。CAPEX 也不像旧太阳能叙事暗示的那么友好。组件过剩在 2023-2025 年有所帮助，但 2026 年来源指向新的波动，来自中国税收政策变化、供给理性化、钢材和 BOS
              成本压力，以及地缘政治运输风险。实际后果很简单：Amarenco 不能指望设备成本下降或宽松现货假设来拯救薄弱项目设计。它必须围绕灵活性做设计，锁定可融资采购，并有效变现储能。
