    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、足迹与运营模式
        blocks:
          - type: paragraph
            body: >-
              Amarenco 的公开身份，比用户给出的“单一法国 IPP”短描述更复杂。公司自己的 “Who are we?” 页面称，当前 Amarenco 由两家前身企业在 2018 年合并而来：一家是 Olivier
              Carré 于 2008 年创立的法国光伏设计和项目管理公司 Méthode Carré，另一家是 Alain Desvigne 和 John Mullins 于 2013 年在爱尔兰创立的
              Amarenco。这个起源故事很重要，因为公司至今仍把自己呈现为跨境平台：地点页面列出 Cork 为欧洲总部、Lagrave 为法国总部，而公司新闻稿通常以 Paris 发稿。从运营上看，Amarenco
              现在聚焦欧洲，尤其是法国、爱尔兰、西班牙、葡萄牙和奥地利，同时在法国海外领地也有存在。它声明的模式是纵向一体化：开发、融资、建设、运营太阳能资产，并越来越多地用储能和再生土地利用叠加优化资产，而不是在取得开工通知后简单出售项目。
