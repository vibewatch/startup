      - - 本地市场 JV / 收购
        - SolarizEgypt、PSS 等结构
        - 在核心版图之外负责项目发起、交付和市场进入
        - 中高
        - 治理或执行失败会拖慢增长，侵蚀利润率捕获
        - 中高
        - 用一致的治理机制和基于里程碑的资金释放
        - 中高
      - - 电网和市场机构
        - CRU、EirGrid、RESS 运营方、法国许可机构、ENEDIS / 电网接口
        - 并网、拍卖资格、运营灵活性
        - 高
        - 项目时间滑期或收入假设失效
        - 高
        - 提前推进电网工作，并在经济性支持时共址储能
        - 高
      - - 土地 / 客户 / 合作社伙伴
        - Vivescia 式土地伙伴、公共机构、站点业主、企业买方
        - 提供土地、场址准入、本地接受度和购电背景
        - 中
        - 伙伴退出或当地反对会降低管线转化
        - 中高
        - 用多元化管线和更强的本地利益相关方管理
        - 中
    notes: Amarenco 的扩张模型能否成立，取决于融资、土地获取、监管和本地执行上的交易对手能否保持一致。
    claimRefs:
