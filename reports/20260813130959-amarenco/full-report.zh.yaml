      - number: '8.4'
        title: 可比公司组与基于情景的估值区间
        blocks:
          - type: paragraph
            body: >-
              最有用的可比对象不是软件同行或纯设备供应商，而是具备足够运营规模、能框定 Amarenco 战略位置的可再生能源开发商和 IPP。Encavis 尤其有参考价值，因为它同样是欧洲风光
              IPP，但在私有化时披露更充分、资产基础也更大。Neoen
              的位置更高，是规模大得多、全球化程度更成熟的运营商，因此更像战略上限参考，而不是现实的直接定价锚。行业基准来源强化了同一个信息：可再生能源倍数仍存在，但会因合同收入质量、现金流可见度和资产负债表复杂度而大幅分化。Amarenco
              没有公开披露直接套用这些倍数所需的运营财务数据，所以这里的估值输出是情景带，而不是点估值。悲观情景假设公开风险吃掉已实现经济性和融资信心；基准情景假设 Amarenco
              达到近期产量里程碑，但透明度仍只有部分提升；乐观情景则要求有证据表明，储能和一体化 IPP 经济性能产生耐久的 EBITDA 质量，强到足以让相对上市可比公司的折扣明显收窄。
