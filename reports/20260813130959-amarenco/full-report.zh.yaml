        - 中高
        - 高
        - 区域专家和标准化合规手册
        - 按地区索取组织架构、人员流失率和空缺岗位填补周期
      - - 电网 / 储能工程和 EPC 监督
        - PV-BESS 混合项目和改造升级推高技术复杂度
        - 中
        - 高
