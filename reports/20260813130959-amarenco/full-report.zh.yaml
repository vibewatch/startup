            body: >-
              Amarenco
              自己的分层页面，对公司服务对象给出了少见的明确说明。列出的买方或交易对手类型包括农户、工业公司、金融机构、国家机构、私人投资者、电力供应商、公用事业公司、电站所有者和项目开发商。实际需求也差异很大：有些客户想为自己的场地或终端用户获得更绿色的基础设施；有些想要绿色电力；有些想要电网服务；有些想要共同开发伙伴关系或退出选项。这很重要，因为
              Amarenco
              并不依赖单一狭窄收入面。它卖进分布式发电、农业基础设施、公共部门场地、储能和投资者支持的资产所有权等多个买方原型。这对可服务需求是正面信号，但也增加了尽调复杂度，因为每个细分市场很可能有不同采购周期、合同结构和利润率画像。因此，公开证据最强之处在于细分宽度和方案匹配，而不是细分层面的收入拆分。
