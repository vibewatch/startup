      - number: '8.2'
        title: 建议、信心、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究 / 观察，而不是现在投资。原因不是 Amarenco
              质量不足，而是价格和结构太关键，公开证据仍留下太多未解变量。信心水平为中：证据足以支持它是一个真实平台，也能给出方向性的估值区间，但还不足以把区间转成有把握的买入价。风险评级仍为高，因为公司同时处在商售电风险、监管复杂度、资本密集和执行带宽的交叉点。估值立场因此很明确：在经审计收入、EBITDA、净债务、优先股堆叠、对冲
              / PPA 组合和项目级契约余量清楚之前，Amarenco 应相对更干净的上市 IPP
              参照打折交易。如果上述数据很强，建议可能快速上调；如果数据令人失望，表面上的战略质量仍可能在错误入场价下转化为糟糕的股权回报。
