      - number: '1.4'
        title: 资本基础与里程碑
        blocks:
          - type: paragraph
            body: >-
              自 2023 年以来，Amarenco 的资本结构几乎每年都在加厚。Arjun Infrastructure 的投资公告称，其 €300 million 股权承诺带来了约 30% 股份，并在 Tikehau 和
              Crédit Agricole 系投资者之外引入新的战略股东。随后 Amarenco 叠加了越来越复杂的债务：2024 年 12 月完成 €500 million 多国融资及 €150 million
              可追加增额额度；2025 年 4 月获得一笔法国专项 €188 million 融资，覆盖约 124 MWp / 约 500 个项目；2026 年 1 月由 Eiffel 牵头获得 €300 million 初级
              HoldCo 融资。之后又有 Arjun 提供的 €130 million 优先股融资，第二笔计划在 2026 年落地，并有 BNP Paribas
              支持。管理层把这些融资描述为迈向结构性财务自主的台阶。因此，里程碑记录同时支持两种解读：Amarenco 已经反复拿到机构资本，但要完成 IPP 转型，仍依赖外部资本市场执行。
