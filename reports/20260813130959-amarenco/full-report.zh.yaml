      - number: '3.5'
        title: 竞争结论
        blocks:
          - type: paragraph
            body: >-
              Amarenco
              更像可信的专门型选手，而不是品类所有者。凡是农光互补、分布式屋顶、储能整合和本地化开发重要的地方，它都能赢。凡是市场份额由最低资金成本、最大管线或最深公用事业关系决定的地方，它不太可能主导。这并不构成否定——许多有吸引力的欧洲
              IPP 都是专门型公司——但它意味着 Amarenco 的竞争案例应按执行驱动、细分场景可防守来承保，而不是按具备赢者拿走大多数经济性的耐久技术平台来承保。尽调中的关键问题，不是 Amarenco
              是否没有优势；它显然有。问题是未来几年，这种优势能否足够快地复利增长，抵消大型公用事业公司和规模化全球 IPP 的结构性优势。
