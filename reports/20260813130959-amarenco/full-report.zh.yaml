      - number: '2.2'
        title: 规模视角：政策容量、签约容量与灵活性需求
        blocks:
          - type: paragraph
            body: >-
              这里用单一 TAM 数字会误导判断，市场更适合从几个视角估算。第一，欧盟自身政策框架仍然庞大：太阳能战略设定的目标是 2025 年超过 380 GW、2030 年至少 600 GW，欧盟委员会称该地区已经超过
              2025 年门槛。第二，长期合同已经具备规模意义：SolarPower Europe 称，2022 至 2025 年间，拍卖和企业 PPA 占欧盟太阳能装机 92 GW，相当于为 28 million
              户家庭供电。第三，即便增速放缓，欧洲 PPA 签约仍有分量；Trio 报告 2023 年为 17.1 GW、2024 年为 15.3 GW、2025 年为 13.1
              GW。第四，灵活性层正与太阳能经济性不可分割。IEA 称电池储能是 2025 年增长最快的电力技术，Aurora 和 S&P 则解释了原因：限电、拥堵和捕获价格压缩，越来越会惩罚单独暴露于太阳能的资产。
