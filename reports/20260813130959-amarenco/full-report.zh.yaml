        - 赋权国家团队，同时保留总部资本监督
        - 审查爱尔兰、法国、MENA 和 APAC 领导层任期与决策权
      - - 财务 / 资金 / 报告控制
        - 多实体平台叠加反复融资，抬高控制负担
        - 中
        - 中高
        - 收紧资金管理和报告节奏
        - 索取契约仪表盘、流动性跑道和合并报告包
    notes: 相对公开可见员工数，平台目标显得激进；人才密度和执行系统因此是重点尽调议题。
