      - number: '1.5'
        title: 承保缺口与尽调含义
        blocks:
          - type: paragraph
            body: >-
              尽管新闻流密集，几项承保缺口仍然重要。第一，公开材料没有在集团层面给出清晰、经审计的收入、EBITDA、杠杆或自由现金流图景；公开记录更擅长证明装机容量和融资事件，而不是单位经济模型。第二，总部呈现混杂在爱尔兰、法国和以
              Paris 为中心的披露之间，增加了法人实体映射和董事会 / 治理审查难度。第三，Amarenco 的公开长期路线图方向积极，但口径并不完全统一：较早的公司页面仍提到 2030 年 4 GW，而 2025
              年治理刷新提到 2030 年 2.7 GW，外加更近期的 1.6 GW 里程碑。最后，本章审阅的公开来源都没有给出 2026 年之后的新股权估值或完整优先股堆叠。尽调视角下，Amarenco
              看起来具备机构融资能力，战略也连贯，但透明度还没有达到后期投资人想要的水平。
