      - number: '5.4'
        title: 信任、质量、安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              公开信任证据存在，但更偏流程，而非绩效。可持续发展报告呈现 ESG 治理、GDPR、网络安全、可持续采购、欧盟分类法对齐和 SBTi 工作流。Amarenco 还称法国运营持有 ISO 9001 和 ISO
              14001 认证，较早的 2030/2050 页面强调健康与安全，并声称零严重事故。“Our Businesses” 页面还补充了建设期间安全和安保零容忍表述。这些控制很重要，因为 Amarenco
              的价值主张依赖可融资性、本地接受度和长寿命资产表现。与此同时，公开记录缺少投资人真正想看的指标：逆变器故障率、发电收益偏差、限电表现、SCADA
              架构、事故频率、网络测试节奏或平均修复时间（MTTR）。正确结论是，Amarenco 有可见的治理和合规框架，但这些系统是否能在车队规模上稳定转化为可衡量技术质量，公开证据只有一部分。
