  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有巨头、相邻威胁与替代方案
        blocks:
          - type: paragraph
            body: >-
              Amarenco 不是在和一组同质化同业竞争。直接同业包括 CVE、Akuo、BayWa r.e.、Sonnedix、Neoen、Lightsource bp 等分布式或中型欧洲
              IPP，它们都以略有不同的方式结合开发和长期资产持有。更大的既有巨头威胁来自一体化公用事业公司和多元化可再生能源集团，尤其是 Iberdrola、ENGIE 和 EDF power
              solutions；这些公司能把项目开发与更大的资产负债表、电网关系、更广的客户触达和更低的感知交易对手风险配在一起。相邻威胁来自 Grenergy
              这类储能重的专门公司，也来自被金融或工业业主整合的太阳能组合。替代方案同样重要：公用事业公司、市政机构或大型企业可以选择内部自建、JV 结构或直接采购模式，而不是与中型 IPP
              合作。因此，关键竞争问题是：在哪些地方，Amarenco 的本地开发和土地利用优势，比单纯规模或超低资金成本更重要。
