  - id: TR005
    title: 缓释措施和终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 法国农光互补合规失败
        - 许可或后续检查发现
        - 旗舰场站失去农光互补分类、收到拆除令，或被要求重大整改
        - 转入红旗尽调，或重新测算法国管线价值
      - - 爱尔兰电网 / 限电恶化
        - 排队时间和限发电量
        - 并网送电明显延迟，或限电恶化且没有储能 / PPA 对冲
        - 下调近期收入假设，上调资本开支 / 储能需求
      - - 市场化电价和捕获因子恶化
        - 捕获因子 / 负电价占比
        - 若无套保缓释，组合经济性开始接近 2026 年 4 月法国情形
        - 削弱独立 PV 估值支撑，要求证明储能可变现
      - - 融资压力
        - 再融资、融资额度落地或契约压力
        - 相对管线资金需求，融资额度落地延迟、条款转弱，或契约压力显性化
        - 暂停投资，或要求更低入场价 / 更强优先权保护
      - - 储能 / 改造升级执行滑坡
        - 建设和 COD 里程碑
        - OSMO、Claudia 或类似战略资产出现重大延误或表现不及预期
        - 提高执行折价，重新评估管理层带宽
    notes: 终止标准的作用，是把分散的基础设施风险变成具体、可监测的决策触发项。
    claimRefs:
      - CR040
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 信心
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 继续研究 / 观察
        - 中
        - 高
        - 在私有财务证据补齐主要缺口前，相对更清晰的上市 IPP 给予折价
        - 不要只锚定战略叙事
      - - 上调条件
        - 满足后为中高
        - 中高
        - 若经常性 EBITDA、净债务和优先股堆叠明确有利，估值可能向区间上沿移动
        - 需要完整私有尽调和有吸引力的交易结构
      - - 下调条件
        - 触发后为高
        - 极高
        - 若里程碑滑坡、融资转弱或市场化电价风险恶化，进一步打折或放弃
        - 资本保全优先于可选性
      - - 入场纪律
        - N/A
        - 高
        - 公开信息可支撑的基准情景 EV 区间约为 €1.4-2.2B；更高价格需要更强证据
        - 价格比故事更重要
      - - 退出姿态
        - N/A
        - 中高
        - 相比近期 IPO，更可能是财务赞助方再资本化 / 基建收购 / 组合变现
        - 保守测算流动性
    notes: 本表有意把结论框定为取决于结构和证据，而不是泛泛的看多或看空。
    claimRefs:
