      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              2025 年，Amarenco 的领导层也发生了实质变化。公司治理更新称，Amarenco 从联合创始人主导的模式，转向更结构化的管理团队设置：联合创始人 Alain Desvigne 出任
              President，原副 CEO Frédéric Maenhaut 出任 CEO。公开领导层材料显示，除创始人外，公司还有更宽的管理梯队，包括 CFO、CIO、COO、储能 CEO、各国董事总经理、ESG
              负责人和公共事务负责人。这样的深度有帮助，但不能消除关键人集中。Desvigne 仍掌握围绕投资者、再生和合作伙伴关系的战略叙事，Maenhaut 则负责 2026-2030 计划的执行。2025 年 4
              月，Declan Cullinane 获任管理 Amarenco Ireland，说明公司正在关键市场本地化执行。即便如此，董事会构成、独立董事存在感和股东权利安排在公开材料中仍大体未披露，治理质量只能部分承保。
