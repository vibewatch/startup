  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、变现路径与公开可观察内容
        blocks:
          - type: paragraph
            body: >-
              Amarenco 的公开材料描述的，是一家正从纯项目开发走向更完整独立发电商模式的企业。其变现逻辑似乎有四个主要支点：自有太阳能资产的经常性电力销售；与容量租赁、容量、备用或交易结构挂钩的储能收入；资产周转 /
              权益减持经济性；以及发起和融资项目中嵌入的开发或结构设计价值。Business Cork 的 2026 年融资公告尤其有用，因为它明确把公司的“结构性财务自主”目标，和电力生产及资产周转带来的经常性 EBITDA
              绑定，而不只是一次性开发收益。储能已不再是附属业务：同一公告称，Amarenco 的 94 MW / 188 MWh
              储能车队既贡献电网平衡，也通过能源交易产生收入。缺失的仍是最基础的损益表披露。本次取得的官方页面、法律交易摘要和登记页面都没有提供集团合并收入、EBITDA、毛利率、经营现金流或净债务。因此，收入质量可以从概念上描述，却无法用公开数字完整承保。
