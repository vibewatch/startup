      - number: '2.3'
        title: 买方、用户、付款方与市场进入路径
        blocks:
          - type: paragraph
            body: >-
              Amarenco 所在市场的买方高度分散。农户和土地所有者关心土地生产率和本地经济；工商场地业主关心自发电经济性；市政机构和公共建筑运营方受屋顶义务和公共能源预算驱动；企业 PPA
              买方关心合规、对冲和多市场采购策略；公用事业公司和输电系统运营商（TSO）越来越看重储能支撑的电网服务。买方、用户和付款方往往不是同一个人。Zeigo 的 Amarenco
              案例研究显示，开发商现在需要真正的客户分层和顾问能力，因为企业买方购买太阳能，已经不再主要是为了匹配年度证书；它们围绕波动率、温室气体核算和组合构建做优化。在法国，招标结构明确覆盖屋顶、停车场和农业设施。在爱尔兰，RESS
              招标仍然重要。换句话说，现在决定开发商能否把可服务需求转化为已签约购电和已融资资产的，不只是项目管线，更是市场进入路径的成熟度。
