  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 自上而下的风险栈：下行集中在哪里
        blocks:
          - type: paragraph
            body: >-
              Amarenco
              最脆弱的地方不是基础技术是否存在，而是监管、市场设计、电网准备度和融资复杂性相互交叉的区域。公开证据指向一家公司正在同时扩张农光互补、屋顶光伏、储能翻新提效和多国项目融资。这会形成多条下行传导渠道。更严格的法国农光互补制度可能放慢项目，甚至让项目失去资格；爱尔兰并网批次和限电上升可能延迟或摊薄实际收入；负电价动态会让缺少储能的独立太阳能更难融资；反复融资则要求公司持续对齐投资人、贷款方和交易对手。这些风险不是理论。支撑
              Amarenco 规模和雄心的同一批来源，也说明为什么公司价值取决于能否在要求越来越高的规则和市场条件下强执行。好消息是，Amarenco
              明显在向储能、翻新提效、混合结构和合作伙伴主导的地域扩张移动。坏消息是，每一个动作都在降低一种风险的同时增加另一种风险。正确结论不是模式已经坏掉，而是这是一个执行很重的平台，错误会迅速复合成收入、流动性和估值压力。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR045
