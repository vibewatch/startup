      - number: '1.3'
        title: 规模、资产与路线图
        blocks:
          - type: paragraph
            body: >-
              到 2025 年中，Amarenco 披露的运营足迹已经足够有分量，应被视为有规模的私营欧洲 IPP，而不是小型开发商。多项来源都指向 650 MW 太阳能装机容量。治理和融资披露还提到约 600 MW
              在建或启动建设项目，以及 2.9 GW 高成熟度项目，置于更广泛的 4 GW 生命周期组合之内。Amarenco 在这套太阳能基础上叠加正在增长的储能业务：Saucats 的 Claudia
              最初是欧洲最大的电池项目之一，容量 105 MW / 100 MWh，并将在 €65 million 再融资下升级为 94 MW / 188 MWh；另一单 100 MW Osmo
              项目则扩大了公司在法国的电池足迹。公司称 2025 年交付超过 600 GWh，并以 24 个月内年发电量超过 1 TWh、装机容量超过 1 GW 为目标。战略主线很清楚：Amarenco
              想成为经常性发电平台，而不只是项目发起商。
