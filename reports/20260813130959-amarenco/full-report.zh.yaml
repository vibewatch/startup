companyProfile:
  summary: >-
    Amarenco 是一家后期私营太阳能 IPP 平台，规模、融资通道和储能整合都已有公开可见度。2026 年公开资料显示，公司太阳能装机容量 650 MW，2025 年交付清洁电力超过 600 GWh，并拥有 94 MW / 188
    MWh 储能组合；公司同时提出，24 个月内年发电量超过 1 TWh、装机容量超过 1 GW。Amarenco 在农业、工业、公共部门和合作伙伴渠道中看起来商业化真实，但财务和资本结构披露仍不足，难以支持精确承保。
  headquarters: Cork, Ireland
  productSummary: Amarenco 开发、融资、建设、持有并运营地面电站、屋顶光伏、农光互补和储能联动的可再生资产；它越来越把自己定位为一体化 IPP，而不是纯项目开发商。
  customerFocus: 欧洲及部分国际市场的农户和农业土地所有者、工业用电方、公共机构、土地 / 基础设施合作方、公用事业公司，以及企业脱碳交易对手。
  businessModel: 资本密集型一体化 IPP 模式：发起并开发可再生项目，完成融资和建设，从自有发电资产中获取经常性现金流，并通过储能、翻新提效、精选资产轮转 / 合作结构增厚回报。
  stage: late-stage private
  fundingStatus: 私营公司，2025-2026 年债务、次级融资、再融资和 €130M 优先股融资均有公开可见度，但公开股权估值标记披露仍不足。
