      - number: '4.3'
        title: 成本结构、营运资金与资本强度
        blocks:
          - type: paragraph
            body: >-
              成本结构最好理解为资本密集型 IPP 栈，而不是轻资产开发商。主要成本项包括土地和许可、EPC 与设备、电网接入、建设期利息、O&M、总部 SG&A
              以及公司融资开销。公开文件过于稀疏，无法精确量化任何一项，但融资记录显示了需求规模。2024 年 12 月的多国债务平台总额 €500 million，另有 €150 million 可追加增额；2026 年 1
              月 HoldCo 贷款则明确被描述为优化资本结构、降低融资成本、改善内部现金循环的工具。资产层面结构也强化了同一点：Claudia 电池再融资包括 €46.9 million 定期贷款、€3.5 million
              VAT 额度、€11.5 million 信用证额度和 €3.22 million 债务服务储备额度；Osmo 项目也已与 Société Générale 完成财务交割。Amarenco 自己的 2024
              年新闻稿称，公司每年投资超过 €500 million，并每年建设约 500 MW，这让营运资金管理和项目债务通道成为模式核心，而不是附带事项。
