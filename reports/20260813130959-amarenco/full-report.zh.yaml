      - number: '7.4'
        title: 合作伙伴、依赖关系与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              Amarenco 的增长模型高度依赖合作伙伴和资本。公开融资时间线里，反复出现股权融资、优先股、国家级融资工具、HoldCo
              融资和再融资。这种融资轨迹符合大规模项目开发的特征，但也意味着平台暴露在贷款人胃口、契约管理、再融资窗口，以及投资人是否继续为下一阶段建设买单之下。地域扩张似乎也部分依赖本地架构，而不是完全自有的绿地控制。埃及和泰国都通过与本地伙伴的合资或收购展开；面向客户的增长则越来越依赖土地伙伴、公用事业公司、企业购电流程，以及受政策调节的招标体系。这些安排本身并不坏，事实上可能是唯一高效的扩张方式。但
              Amarenco 能吃到多少利润、能否按时交付，并不只取决于内部执行，还取决于交易对手是否继续同向、具备能力并且拿得到融资。
