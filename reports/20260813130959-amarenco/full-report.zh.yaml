      - number: '3.2'
        title: 同业画像，以及 Amarenco 真正差异化的地方
        blocks:
          - type: paragraph
            body: >-
              最强的全球规模可比公司是 Neoen 和 Sonnedix，两者公开宣传的规模分别为 9.3 GW 和 11.4 GW，远高于 Amarenco 目前 650 MW 装机基础。Lightsource bp 和
              BayWa r.e. 也呈现开发—建设—运营一体化能力，明确布局电池储能，并拥有更广地理覆盖。CVE
              是最清晰的分布式能源同业，因为它强调去中心化生产、PPA、自用电，以及服务企业、市政和农业。Iberdrola、ENGIE 和 EDF power solutions
              在运营上没有那么逐项可比，但它们重要，因为它们定义了欧洲交易对手实力和市场进入触达的上限。Grenergy 在西班牙的大型 BESS
              融资显示，储能专业化正在迅速成为竞争定位的一部分。在这个背景下，Amarenco
              的相对优势不是独一无二的技术栈，也不是无可匹敌的规模，而是本地化农光互补打法、法国和爱尔兰执行深度，以及愿意在更小、更定制化的格式中把太阳能、储能和再生结合起来。
