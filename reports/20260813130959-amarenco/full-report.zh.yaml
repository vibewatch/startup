            body: >-
              Amarenco 的公开路线图有雄心，但内部并不完全一致。可持续发展报告指向 2024/2025 年工业化重心、100% 发电业务模式、首批再生型 CPPA 活动，以及 2026 年 1 GW、2030 年 3
              GW、2050 年 25 GW 的容量目标。其他官方页面仍提到 2030 年 10 个再生型 GW、2050 年 50
              个。这种不一致不会推翻战略方向，但会降低对路线图沟通精度的信心。护城河表述也是如此。Amarenco
              在农光互补、再生定位、融资结构和储能整合上显然有差异化经验，并且看起来越来越有能力对资产做翻新提效和混合化，而不仅是建设绿地太阳能电站。但公开记录没有显示专有电化学、独特软件
              IP，或足以让护城河变得深度技术化的公开运营数据。因此，公司应按强整合商和运营商、且具备细分设计优势来承保，而不是按专有硬科技平台来承保。
