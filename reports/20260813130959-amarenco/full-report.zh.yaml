      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发点与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              Amarenco
              最可能的退出路径看起来更像财务赞助方再资本化、基础设施买断或组合资产变现，而不是近期登陆公开市场。公开市场可以给清洁电力平台定价，但也会惩罚不透明的资本结构和商售电风险。因此尽调格外重要。投资人承销新股或老股交易之前，需要经审计收入和
              EBITDA、详细债务及优先股清偿瀑布、对冲与 PPA 组合、项目级许可和电网状态，以及头部交易对手集中度。没有上述输入，投资人不是在好公司和坏公司之间选择，而是在决定是否盲定价格。投资逻辑破裂触发点应包括：错过
              1 TWh / 1 GW
              里程碑路径、融资速度慢于或成本高于项目管线需要、捕获价格动态恶化且没有储能缓冲，以及法国或爱尔兰出现重大监管或电网滑坡。如果上述问题浮现，今天的战略承诺仍可能导向缺乏吸引力的股权结果；如果问题得到良好解决，Amarenco
              可能很快成为更强候选标的——但前提是证据基础明显更扎实。
