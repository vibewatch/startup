      - number: '7.5'
        title: 人才、执行与投资逻辑破裂监控
        blocks:
          - type: paragraph
            body: >-
              剩余的公开风险集中在执行带宽和可见度。Amarenco 自身材料称，公司约有 200 名员工，覆盖 25
              个国籍，在多个区域推进开发，并且仍需要继续扩充人才。员工规模可观，但相对于农光互补、屋顶组合、再赋能、BESS
              建设和多国融资共同带来的平台复杂度，并不算大。公开记录也没有提供达到投资人标准的事故台账、停机历史、契约包或合并后的集中度地图，外部人很难判断哪一个弱信号会先断裂。因此，最有用的风险工作不只是分类，而是监控。投资逻辑破裂触发点应包括：失去农光互补资格、弃电恶化且储能捕获不足、融资进度落后于项目管线需求，以及高知名度储能或再赋能资产出现可见排期滑坡。在上述风险下，Amarenco
              仍可能是可投资平台，但前提是尽调把今天这幅不完整的公开图景，转成一组可监控的量化护栏。
