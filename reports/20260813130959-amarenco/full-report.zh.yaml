      - number: '2.5'
        title: 这个市场对 Amarenco 意味着什么
        blocks:
          - type: paragraph
            body: >-
              净结果是：这个市场对 Amarenco 仍有结构性吸引力，但远没有表层装机增长暗示的那么宽容。太阳能政策雄心、屋顶义务和长期签约能力，使欧洲市场足以支撑 Amarenco 的 1 GW
              雄心。但同一组证据也说明，价值会不成比例地流向那些能把签约、储能、区域执行和电网友好型资产设计结合起来的开发商。Amarenco
              对农光互补、屋顶光伏、爱尔兰招标和电池翻新提效的聚焦，与这些要求一致。未解决的问题不是需求是否存在，而是 Amarenco
              能否在不被电网饱和、负电价或过度复杂融资结构吃掉经济性的情况下，把需求转化为高质量签约发电。因此，市场应被评为有支撑、但运营选择性很强，而不是全面顺风。
