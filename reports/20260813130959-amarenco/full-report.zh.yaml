      - number: '3.3'
        title: 切换成本、多方比选与分销力量
        blocks:
          - type: paragraph
            body: >-
              这个市场的竞争力不太在品牌，而在控制点：土地发起、电网接入、许可审批、融资和购电。在项目被锁定之前，多方比选很常见——土地所有者、贷款方和企业买方都可以评估多个开发商。一旦并网权、土地控制和合同结构落定，切换成本会急剧上升，项目经济性也更难被撬走。这种动态有利于规模化既有巨头做组合收购和电网重市场，但也为更碎片化或土地敏感细分市场中的本地专家留下空间。CVE
              的直销模式、Lightsource bp 的数据中心方案，以及公用事业公司的更广工业关系，都展示了不同形式的分销力量。Amarenco 自己的市场进入验证——法国屋顶招标中标、爱尔兰 RESS
              项目和电池翻新提效——说明它可以在执行细节重要的地方取胜。代价是，如果更大竞争者认为利润率足以支持内部自建农光互补和储能能力，这些细分优势也可以被复制。
