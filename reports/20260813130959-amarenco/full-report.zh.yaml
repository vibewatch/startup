      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Amarenco 的财务案例在可融资性上强于透明度。股权、优先股、HoldCo 债务、项目债务和资产再融资多次落地，说明贷款方有真实信心，资本结构也在成熟。战略方向同样连贯：管理层试图打造经常性现金流
              IPP，而不是停留在现货敞口开发商。但公开披露仍过薄，无法回答投资人通常会问的核心承保问题：实际收入结构、按资产类型拆分的毛利率、债务偿付覆盖率（DSCR）表现、项目
              IRR、总部开销、非受限现金、债务到期梯队，以及已经经常性化的 EBITDA 与仍依赖资产轮转的 EBITDA 各有多少。宏观上还有一个警示信号：Mercom 称 2025 年太阳能企业融资同比下降
              16%，因此不能把 Amarenco 未来融资通道视为自动存在。结论是：公司看起来可融资，战略也连贯，但在管理层提供完整合并账目和资产层面表现数据前，尽调应假设存在重大信息风险。
