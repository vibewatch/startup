      - number: '7.2'
        title: 监管与法律风险：法国和爱尔兰最重要
        blocks:
          - type: paragraph
            body: >-
              从公开记录看，法国和爱尔兰承担最清晰的监管暴露。在法国，农光互补项目现在处在更细的法律框架下，需要投运前控制、后续检查、可逆性规划、农户收入和农业产出审查，以及周期性数据报送。这有利于项目合法性，但也意味着合规失败可能直接损害项目状态或经济性。法国政府也试图加快战略性可再生能源的环境诉讼，这在方向上是正面的，但更快的上诉流程仍然是上诉流程。在爱尔兰，政策正尝试通过半年度批次和更早规划确认来加快并网报价，但
              CRU 和法律评论都明确指出，并网时点仍是真实的项目开发风险。对 Amarenco 来说，这意味着监管图景并不只是“政策支持”。它是支持性政策，加上公司越来越需要在更正式的许可、电网和合规系统中零失误执行。
            claimRefs:
