  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Amarenco 实际卖进的场景
        blocks:
          - type: paragraph
            body: >-
              Amarenco 并不覆盖整个能源转型机会集。它的实际市场边界，是欧洲太阳能 IPP
              价值栈：分布式屋顶光伏、农光互补系统、地面光伏、配套电池储能，以及把这些资产变成可融资现金流的合同结构。这个边界排除了组件制造、住宅零售供电和宽泛气候软件。因此，欧盟委员会的太阳能战略，比泛泛的清洁科技支出统计更适合作为总可用市场（TAM）锚点，因为它直接覆盖屋顶部署、公共建筑义务、许可审批，以及光伏资产获得融资的更广泛条件。Amarenco
              自身定位也强化了这一定义：它强调仅在欧洲扩张、农光互补部署、储能支撑的灵活性，以及项目所有权，而不是纯开发费。正确的市场问题不是“全球太阳能有多大？”，而是“欧洲长期限太阳能加储能、分布式和农光互补市场有多大，能吸收结构化资本和长期购电？”
            claimRefs:
