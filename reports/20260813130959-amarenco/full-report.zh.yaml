      - number: '4.2'
        title: 市场进入动作、价格代理与单位经济可见度
        blocks:
          - type: paragraph
            body: >-
              Amarenco
              的市场进入动作是长周期、以项目为中心的，而不是交易型。屋顶光伏、农光互补场地、公用事业级电站和储能项目，靠土地发起、许可审批、结构设计和融资赢下，再通过购电合同、招标、项目出售或保留所有权变现。除非公司单独披露面向客户的软件产品——目前没有——否则获客成本（CAC）、回本周期、ARPU
              或总留存这类经典 SaaS 指标都不是合适镜头。公开证据只能提供代理指标。Zeigo 的案例研究显示 Amarenco 投资工具以更贴近企业客户；法国屋顶招标中标和 2025
              年法国融资，则证明公司能反复接触项目级需求。价格大多是私密信息；少见的公开例外是 Amarenco 的众筹历史，公司称曾通过四年期、收益率 5% 的可转债筹集超过 €30 million。除此之外，已实现 PPA
              价格、开发费、EPC 利润率和权益减持价差都未公开。正确的财务结论是，Amarenco 的销售效率必须从反复融资交割和资产部署中推断，而不是从已披露的单客户漏斗数据中读取。
