tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend / volume
  - Excluded spend / volume
  - Buyer/payer
  - Why it matters to Amarenco
  rows:
  - - Distributed rooftop solar
    - Commercial rooftops, parking canopies, agricultural buildings, public roofs
    - Residential retail supply and home-solar installer economics
    - C&I owners, public entities, agricultural hosts
    - Amarenco has already won 700+ rooftop projects with TotalEnergies and competes directly here.
  - - Ground-mounted and agrivoltaic solar
    - Utility and sub-10 MW assets, agriPV systems, rural land-use projects
    - Module manufacturing, inverter OEM margins
    - Landowners, developers, banks, local communities
    - Core to Amarenco’s differentiated land-use and regeneration narrative.
  - - Solar-plus-storage IPP assets
    - Battery-coupled solar, standalone storage supporting solar portfolios
    - Pure merchant trading platforms or retail supply businesses
    - TSOs, utilities, tolling counterparties, investors
    - Storage increasingly determines bankability and capture-price resilience.
  - - Long-term contracting routes
    - Auctions, cPPAs, tolling contracts, public tenders
    - Spot-only unhedged solar merchant sales
    - Corporate energy buyers, utilities, states
    - Route-to-market sophistication is now a decisive competitive variable.
  - - Broader clean-tech adjacencies
    - Regenerative land use, project software, local energy flexibility
    - Hydrogen OEMs, EV charging retail, climate SaaS unrelated to generation
    - Adjacent partners rather than direct customers
    - Useful context, but not the primary market Amarenco must win today.
  notes: This boundary intentionally excludes broad energy-transition categories that are too far from Amarenco’s actual asset-ownership and route-to-market model.
