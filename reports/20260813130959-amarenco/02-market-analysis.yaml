- id: thesis-implications
  title: What this market means for Amarenco
  body: The net result is a market that is still structurally attractive for Amarenco but far less forgiving than top-line installation growth implies. Solar-policy ambition, rooftop obligations, and long-term contracting capacity make the European market large enough to support Amarenco’s 1 GW ambition. But the same evidence base says value accrues disproportionately to developers that can combine contracting, storage, regional execution, and grid-aware asset design. Amarenco’s focus on agrivoltaics, rooftop solar, Irish tenders, and battery repowering aligns with those requirements. The unresolved issue is not whether demand exists; it is whether Amarenco can convert that demand into high-quality contracted production without losing economics to grid saturation, negative pricing, or overly complex financing structures. That is why the market should be scored as supportive but operationally selective rather than universally buoyant.
  claimRefs:
  - CM017
  - CM028
  - CM031
  - CM034
  - CM035
  - CM036
