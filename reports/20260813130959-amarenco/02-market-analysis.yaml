chapter:
  number: 2
  title: Market Analysis
  summary: Amarenco operates in a favorable but increasingly complex European solar-and-storage market. Public policy still supports very large PV deployment and auctions/corporate PPAs have already underwritten 92 GW of EU solar installations since 2022, but wholesale-price cannibalization, curtailment, grid queues, and more sophisticated offtake requirements are shifting value toward developers that can pair solar with storage, local execution, and contract structuring. Amarenco’s focus on distributed solar, agrivoltaics, and storage in France, Ireland, Iberia, and Austria fits this market logic, but the addressable market is best understood through multiple capacity and route-to-market lenses rather than a single headline TAM.
sections:
- id: market-boundary
  title: Market boundary and what Amarenco actually sells into
  body: 'Amarenco is not exposed to the whole energy transition opportunity set. Its practical market boundary is the European solar IPP stack: distributed rooftop solar, agrivoltaic systems, ground-mounted PV, associated battery storage, and the contract structures that turn those assets into bankable cash flows. That boundary excludes module manufacturing, residential retail supply, and broad climate software. The European Commission’s solar strategy is therefore a better TAM anchor than generic clean-tech spending statistics because it addresses rooftop deployment, public-building obligations, permitting, and the broader conditions under which PV assets become financeable. Amarenco’s own positioning reinforces that narrower definition: it emphasizes Europe-only expansion, agrivoltaic deployment, storage-backed flexibility, and project ownership rather than pure development fees. The right market question is not “How big is global solar?” but “How large is the European long-duration solar-plus-storage
    and distributed/agriPV market that can absorb structured capital and long-term offtake?”'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
