- id: FM004
  title: Adoption funnel or value-chain map
  type: funnel
  layout: standard
  summary: Solar-plus-storage adoption increasingly requires a full contracting and execution funnel rather than simple project origination.
  data:
    items:
    - stage: Policy / demand trigger
      value: 100
      label: Rooftop mandates, energy security, or corporate decarbonization need appears
      detail: Public policy and energy-price volatility create initial demand.
    - stage: Site and grid screening
      value: 80
      label: Land, roof, or interconnection opportunity qualified
      detail: Queue position and curtailment risk start to shape commercial viability.
    - stage: Route-to-market selection
      value: 55
      label: Auction, tender, cPPA, or storage/flexibility revenue path chosen
      detail: Contract structure determines whether the asset can be financed.
    - stage: Financing and contracting
      value: 35
      label: Banks, funds, or offtakers commit capital and terms
      detail: PPA liquidity, DSCR, and storage economics become decisive.
    - stage: Construction and commissioning
      value: 25
      label: Asset enters operation with storage and offtake in place
      detail: Execution bottlenecks shift from policy ambition to delivery reality.
    - stage: Optimization / recurring cash flow
      value: 15
      label: Capture-price, storage, and grid-service optimization drives returns
      detail: This is where the IPP model diverges most from pure development economics.
  approximationNotes: Stage proportions are illustrative and designed to show where market attrition occurs as projects move from theoretical demand to monetizable production.
