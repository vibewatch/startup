- id: drivers-and-constraints
  title: Drivers and adoption constraints
  body: 'The market’s upside is easy to identify: decarbonization policy, energy-security priorities, rooftop mandates, and battery-scale learning curves all support more solar deployment. The harder part is translating those drivers into durable economics. SolarPower Europe, S&P, Aurora, Veyt, and Pexapark all point to the same structural friction: as renewable penetration rises, the value of undifferentiated solar MWh falls during sunny hours, grid connections slow, and long-term offtake structures become more technical. Spain illustrates the merchant-risk problem most clearly, with solar capture prices falling below €40/MWh and capture rates dropping to 61% in 2025. Germany shows a different failure mode: standalone solar PPA liquidity weakens as break-even prices outrun buyer willingness to pay. Aurora’s queue, congestion, and curtailment data make the physical constraint case even clearer. For Amarenco, the implication is that storage, local execution, and contracting discipline are
    now market-entry requirements rather than optional enhancements.'
