  topStrengths:
    - 平台规模可见：2026 年公开来源披露装机 650 MW、2025 年交付 600+ GWh，储能版图也在扩大。
    - 融资通道仍然真实：优先股、次级融资和再融资事件显示，贷款方和出资方还在持续参与。
    - 商业验证不只是 logo 墙；农业、工业用电、公共部门和土地合作伙伴渠道都有具名客户与伙伴证据。
    - 储能、改造升级和一体化 IPP 定位，给收入质量跑出一条比单纯太阳能开发更好的路径。
  topRisks:
    - 公开财务披露太薄，无法支撑精准的普通股估值；经审计收入、EBITDA、净债务和优先权顺位仍披露不足。
    - 若储能和合约策略没有按预期跑通，商电风险、负电价、弃电和并网延误都会挤压现金流。
    - 资本结构看起来复杂；优先股、控股公司融资和多实体架构，可能把普通股结果压到更低顺位。
    - 法国和爱尔兰的监管与执行风险，会直接影响项目节奏、合规和最终变现价值。
  unresolvedGaps:
    - 留存来源集没有公开经审计收入、EBITDA、现金流、净债务，以及完整的优先股 / 债务清偿瀑布。
    - 项目级套保 / PPA 组合、储能交易经济性和组合捕获电价敏感性没有公开资料。
    - >-
      Top-customer, top-partner, and top-lender concentration remain opaque despite visible named proof.
      尽管已有具名证据，最大客户、最大伙伴和最大贷款方集中度仍不透明。
    - 若要补齐 Amarenco 所处阶段欧洲太阳能 IPP 的同口径私营可比公司组，还需要付费数据库和投行材料。
