evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited group-level revenue, EBITDA, leverage, and cash-flow statements that reconcile project assets to corporate
      economics.
    whyItMatters: >-
      Installed capacity and financing events do not by themselves show whether the IPP model is self-funding or value
      accretive at the corporate level.
    diligencePath: >-
      Request the latest audited consolidated financial statements, lender model, and segment bridge from development
      fees to recurring production EBITDA.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      A current post-2026 valuation, full share-class map, and terms for the Arjun preferred-equity instruments and any
      junior HoldCo warrants or step-ups.
    whyItMatters: >-
      Without the preference stack, new-money pricing, and any downside protections, investors cannot translate
      Amarenco’s financing momentum into equity value.
    diligencePath: >-
      Obtain the cap table, shareholder agreement, 2026 financing term sheets, and any fairness materials prepared for
      the preferred-equity tranche.
    relatedQuestionRefs:
      - QO025
