    - Construction and COD milestones
    - Material delay or underperformance at OSMO, Claudia, or similar strategic assets
    - Raise execution discount and reassess management bandwidth
  notes: Kill criteria are designed to convert diffuse infrastructure risk into concrete, monitorable decision triggers.
