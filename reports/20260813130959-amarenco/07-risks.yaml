  - - Irish grid / curtailment deterioration
    - Queue timing and curtailed generation
    - Meaningful energization slippage or curtailment worsening without compensating storage / PPA response
    - Cut near-term revenue assumptions and raise capex / storage need
  - - Merchant-price and capture deterioration
    - Capture factor / negative-price share
