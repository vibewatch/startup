subtitle: Real platform, thin public financial disclosure
coverageNotes: >-
  Public evidence is strong on Amarenco's platform scale, financing access, storage strategy, and named
  customer / counterparty proof. It is weak on audited revenue, EBITDA, net debt, preference seniority,
  customer concentration, and project-level hedge / covenant detail. Headquarters framing is mixed across
  sources; this report uses Cork, Ireland as the primary public anchor while recognizing a broader
  Franco-Irish operating identity.
