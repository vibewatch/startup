companyProfile:
  summary: >-
    Amarenco is a late-stage private solar IPP platform with visible scale, financing access, and growing
    storage integration. Public 2026 sources describe 650 MW of installed solar capacity, more than 600
    GWh delivered in 2025, and a 94 MW / 188 MWh storage portfolio, alongside a stated target of
    exceeding 1 TWh of annual production and 1 GW of installed capacity within 24 months. The company
    appears commercially real across agricultural, industrial, public-sector, and partner-led channels,
    but still under-discloses the financial and capital-stack detail needed for precision underwriting.
  headquarters: Cork, Ireland
  productSummary: >-
    Amarenco develops, finances, builds, owns, and operates ground-mount, rooftop, agrivoltaic, and
    storage-linked renewable assets, increasingly positioning itself as an integrated IPP rather than a
    pure project developer.
  customerFocus: >-
    Farmers and agricultural landowners, industrial power users, public bodies, land / infrastructure
    partners, utilities, and corporate decarbonization counterparties across Europe and selected
    international markets.
  businessModel: >-
    Capital-intensive integrated IPP model: originate and develop renewable projects, finance and build
    them, generate recurring cash flow from owned production assets, and augment returns through storage,
    repowering, and selected asset-rotation / partnership structures.
  stage: late-stage private
  fundingStatus: >-
    Private company with visible 2025-2026 debt, junior financing, refinancing, and a €130M preferred
    equity tranche, but no sufficiently disclosed public equity valuation mark.
  disclosureProfile: private-undisclosed
  claimRefs: [CV001, CV003, CV004, CV008, CV013]
summary:
  headline: >-
    Amarenco is a strategically interesting solar IPP platform, but the public record still supports only a
    discounted valuation range and a research-more recommendation.
  overallScore: 5.9
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: unknown
