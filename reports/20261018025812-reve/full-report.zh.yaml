      - number: '1.3'
        title: 融资、利益相关方与当前转型
        blocks:
          - type: paragraph
            body: >-
              2026 年最重要的更新是战略变化，而非财务透明度。Reve 于 2026 年 7 月 27 日披露 OpenAI 的新投资，称部分研究人员将转往 OpenAI，同时仍表示公司保持独立。到 9
              月，DigitalToday D              报道新注册已暂停，网页图像生成产品将于 9 月 27 日关闭，客户下载和退款义务延续至 10
              月下旬。因此，现有用户连续性和路线图可信度已成为紧迫尽调事项。融资历史仍很混乱： Neuronfeed 将 Basis Set Ventures 和 Top Harvest Capital
              列为支持方，There's An AI For That 列出一笔未披露的 $30M 融资，CrackTheDeck 则声称公司达到独角兽状态并融资
              $390M。在管理层或领投方核对这些数字前，资本结构和估值基准都应视为未经验证。
