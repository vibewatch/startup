          - type: paragraph
            body: >-
              情景分析必须以里程碑为基础，因为保留证据无法计算收入倍数、现金流模型或持股回报模型。乐观情景要求经验证的付费采用、重复使用、有利的被接受输出经济性，以及为风险投资回报留出空间的入场价格；产品广度和较低 的公开
              API 价格只是信号，不能替代这些证明。基准情景假设产品继续进步但财务披露有限，保留期权价值却不足以支持定价投资。悲观情景结合模型快速替代、更强的竞争质量信号、人工质量控制需求，以及疲弱或未经
              验证的留存。在管理层提供一致的队列、成本、资本化和定价证据前，各情景有意保持定性。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 建议、退出准备度与论点失效测试
        blocks:
          - type: paragraph
            body: >-
              Reve 可以作为潜在差异化的创意工作流平台持续跟踪，但公开记录还不足以支持价格或目标回报。由于证据主要来自产品页面、目录和评论，而非经审计财务、持久的企业合同或可比交易，退出准备度尤其难以评估。下一
              道决策门槛应要求当前股权结构表和优先权瀑布图、月度收入和毛利率桥、付费队列留存及集中度、每个被接受资产的推理与支持成本，以及能区分试用和重复生产使用的客户推荐。若重复使用疲弱、重试后被接受输出的成本失去优势
              、稀释或优先权损害普通股回报，或竞争模型抹平 Reve 的控制和工作流优势，论点就会失效。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV013
              - CV015
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 价格是缺失的决策变量
            body: 产品质量可以支持继续尽调，但在所有权条款、财务表现和能支撑目标回报的价格得到验证前，不能支持投资。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV015
          - type: callout
            title: 低标价不等于单位经济性
            body: 报告的 API 基础价格不含附加项，也没有揭示重试率、基础设施成本、支持负担、毛利率，或每个被接受资产需要生成多少次。
            calloutType: assumption
            claimRefs:
              - CV008
              - CV014
