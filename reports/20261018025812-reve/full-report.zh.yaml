  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开来源将 Reve 描述为分层创意工作流，而非一次模型调用。
    data:
      layers:
        - label: 输入简报与参考资料
          detail: 提示词、上传图像和参考材料为工作流提供起点。
          modules:
            - 文本简报与后续指令
            - 上传的图像参考
            - 字面模式与灵感模式
            - PDF 或音频指导输入
        - label: 布局表示层
          detail: Reve 称，图像会在生成和编辑前被分解为类似代码的中间表示。
          modules:
            - 结构化空间规划
            - 可寻址的区域和对象
            - 用于构图的内部视觉“代码”
        - label: 生成模型
          detail: 独立报道将当前模型系列描述为原生 4K，并具备更强的文本处理能力。
          modules:
            - 原生 4K 输出
            - 密集文本与多语言文本渲染
            - 美学和细节优化
        - label: 直接操控编辑器
          detail: 对象级编辑应只修改选定元素，无需重新开始生成整张图像。
          modules:
            - 移动、调整尺寸、重新着色、替换或删除
            - 聚光、绘制和效果
            - 去除背景和放大
        - label: 对话式工作流层
          detail: 产品将聊天式细化与助手式构思和混剪结合起来。
          modules:
            - 自然语言编辑循环
            - 创意助手
            - 多图混剪工作流
        - label: 接入与治理层
          detail: 公开部署依赖浏览器应用、套餐设置、隐私控制以及现已停止服务的 API。
          modules:
            - Web 应用
            - 付费套餐能量控制
            - 训练退出选项和公开可见性设置
            - API 先处于 beta，后停止服务
    approximationNotes: 架构反映公开产品说法和独立综述，不代表内部服务图或已披露的可靠性遥测数据。
