  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据支持按使用量计费的 API 收入桥接，但实际收入仍取决于附加服务和低重试率下的执行。
    data:
      nodes:
        - label: 创意需求
          detail: 用户通过自助产品和 beta API 生成、编辑并混剪图像。
        - label: 按量计费的 API 操作
          detail: 独立分析称，创建、编辑和混剪每张图像均按 5 credits 计费。
        - label: 点数套餐
          detail: 同一分析称，7,500 credits 售价为 $10。
        - label: 基础单位收入
          detail: 该套餐意味着每张图像约 $0.0067，尚未计入附加服务。
        - label: 实际账单
          detail: 放大、去除背景、调整尺寸、延长生成时间和重试，都可能抬高每个最终采纳资产的成本。
        - label: 毛利路径
          detail: 毛利率取决于 4K 生成和迭代编辑能否保持足够高效，从而避免大量返工。
