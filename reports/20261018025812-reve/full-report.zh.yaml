      - number: '3.3'
        title: API 基础经济性有帮助，但公开定价信号波动，买方证据薄弱
        blocks:
          - type: paragraph
            body: |-
              定价是 Reve 看起来最激进的战略点：独立评论估算，其 API 基础单价明显低于 Google 已公布的图像费率，也低于 OpenAI 中等和高质量图像示例。如果产品确实能减少生产工作流中的重试，这
              会形成有意义的切入口。难点在于，仅凭公开证据无法评估这种优势是否持久。2026 年的公开定价快照多次变化，Reve 2.1 取代 2.0 后，网页订阅档位转为新的 Starter/Standard/P
              remium 或创意能量框架。同一证据集也没有具名企业客户、续约数据或迁移案例，因此转换成本仍更像架构层面的推断，而非商业上已验证的事实。
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP012
          - type: table
