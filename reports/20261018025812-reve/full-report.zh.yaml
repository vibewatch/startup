  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Reve
      - Midjourney
      - GPT-Image-2 / ChatGPT Images
      - Google 图片模型
      - 含义
    rows:
      - - 构图控制
        - 原生布局的创建 / 编辑 / 混剪，加上直接操控
        - 以提示词驱动，审美自由度更高
        - 编辑 API 能力强，但此处公开报道并非原生布局
        - 具备信息锚定和多模态能力，但此处并未定位为布局优先
        - Reve 最站得住脚的切入点是精准构图控制
      - - 高分辨率工作流
        - 官方定位为每次生成均原生支持 4K x 4K
        - 指定证据池中无相关证据
        - Trilogy 中的 OpenAI 文档将最长边限制为 3840px，并称更大输出仍属实验性
        - Google 明确提供最高 4K 的输出档位
        - Reve 将高分辨率做成标准工作流，而不是附加选项，以此竞争
      - - API 工作流覆盖
        - 创建、编辑、混剪，以及更完整的布局控制端点
        - 指定证据池中无相关证据
        - 更深的遮罩、流式处理、审核、压缩和请求调优
        - 基于信息锚定的多模态工作流选项
        - Reve 的 API 广度足以支撑创意闭环；但对工程占比较高的部署，OpenAI 仍更深入
      - - 字体排版与设计还原度
        - 官方及评测来源都强调字体排版和布局精度
        - Knowara 指出其历史上的文字准确度较弱
        - 公开质量领先者，通用生产基线很强
        - Google Pro 定位于文字渲染和信息图
        - 买方选择取决于主要失效点是布局还原度还是通用质量
      - - 分发与获取
        - 浏览器应用，无原生移动应用
        - 围绕创意探索的成熟社区
        - 通过通用助手生态分发
