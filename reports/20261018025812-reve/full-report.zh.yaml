              公开证据对 Reve 的身份和产品形态说明得比商业规模清楚。官方材料及 2025 年 3 月的独立发布报道将其定位为位于帕洛阿尔托的创意工具公司，围绕可控图像创作、编辑、混剪以及最终由 API 支持的
              工作流，而不是单一基准演示。产品节奏也较连贯：Reve Image 1.0 于 2025 年 3 月首次发布，Reve 2.0 于 2026 年 6 月加入原生 4K 布局感知编辑，第三方追踪者称 Reve
