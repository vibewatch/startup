  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开收入入口可见，但实际变现不可见
        blocks:
          - type: paragraph
            body: |-
              保留证据显示 Reve 当前有两个变现入口：自助式图像产品和 beta API，后者允许第三方在自身工作流中创建、编辑和混剪图像。这足以概括收入机制，但不足以评估收入质量。独立报道称 Reve 2.0
               已没有单独定价，因为 Reve 2.1 取代了它，投资者不应把历史模型定位误当成持久的现行价目表。指定来源中最干净的公开单价来自对 API 积分系统的独立分析：创建、编辑和混剪每张图需 5 个积分，
              7,500 个积分售价 $10，意味着不含附加项时每张图约 $0.0067。这是漏斗顶部变现的有用锚点，但不是实际收入、利润率或净留存。
