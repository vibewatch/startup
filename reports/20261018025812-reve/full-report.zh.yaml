      - number: '3.2'
        title: Reve 的差异化在于可控构图，而非泛化基准领先
        blocks:
          - type: paragraph
            body: |-
              公开差异化最强的地方不是 Reve 被普遍认为是整体最佳图像模型，而是它持续把图像结构作为可编辑的中间层。官方产品和 API 以创建、编辑、混剪操作、拖放编辑器和布局端点为中心，而不是只靠提示词生成循
              环。第三方评论也强调字面指令遵循、空间精度和排版控制，相比 Midjourney 式的审美解读更适合设计、营销和生产团队。对这些团队而言，失败不是“图像难看”，而是“模型移动了错误对象、破坏了标题或改
              掉已批准构图”。
            claimRefs:
              - CP001
