  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品入口与买方工作流
        blocks:
          - type: paragraph
            body: >-
              Reve 并非一次性图像模型。公司在应用、关于页面和启动文章中描述了一个浏览器工作区，用户可以创建、编辑、混剪和设计图像，再用自然语言命令及拖放编辑器细化结果。启动产品不只是单一模型端点：管理层把图像
              创作/混剪、beta 直接操控编辑器、创意助手和 beta API 作为一套产品推出。独立资料大体认同这一定位，将其描述为原生 4K 创意工作区，带有聊天、参考图和布局感知编辑。尽调的关键问题是，这些
              界面中哪些是持久产品，哪些只是仍在变化的模型栈外包裹的发布期界面。
            claimRefs:
              - CE001
