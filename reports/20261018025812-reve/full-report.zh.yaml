          detail: 当用户必须保留已批准元素时，直接操控和结构化布局就很重要。
        - label: 高迭代生产
          value: API and volume economics
          detail: 团队创建、编辑和混剪大量变体时，单位经济性会变得关键。
        - label: 有证据支持的 Reve 切入点
