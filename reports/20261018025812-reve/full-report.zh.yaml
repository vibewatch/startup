  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合覆盖直接设计工具、通用型 成熟巨头 与现有工作流
        blocks:
          - type: paragraph
            body: |-
              相关格局比“其他文生图初创公司”更广。Reve 销售的是围绕原生布局表示的生成、迭代编辑、混剪和 API 工作流，直接对手包括 Ideogram 等设计导向模型、OpenAI 和 Google 等成熟
              图像平台，以及作为风格社区默认选项的 Midjourney。替代方案同样很多：团队可以把通用图像 API 与自己的编辑、审批和提示词治理层组合起来。因此 Reve 不仅要在单一基准上排名靠前，还必须同
              时胜过模型质量和工作流摩擦。
