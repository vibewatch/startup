        title: 买方、用户与工作流匹配
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方和用户信号指向专业创作者，而非大众休闲消费者。官方博客把产品介绍为创作者、编辑器、助手和 API 的组合；Grokipedia 强调影视和设计工作流；Neuronfeed 明确点名设计师、
              营销人员和创意专业人士；TrilogyAI 则围绕广告、海报、电商变体、教育图形和活动概念来描述产品。这些资料显示，终端用户是设计师、营销人员和创意运营者，而预算负责人可能属于创意、品牌、增长或产品团
              队，取决于购买的是应用席位还是程序化 API 用量。企业客户结构仍未经证明：来源没有披露合同规模、客户集中度，也没有说明 API 需求来自内部团队、代理机构还是软件平台。
