          value: Crowded category
          detail: 在竞争拥挤的文本生成图像赛道中，与成熟在位者竞争。
        - label: 专业创意工作流
          value: Designers marketers film teams
          detail: 多个来源指向专业创作者使用场景，而不是面向大众消费者。
        - label: 提示词保真度与排版
          value: Precision matters
          detail: 差异化优势反复集中在可读文本、指令遵循度和精修后的输出上。
        - label: 理解布局的编辑
