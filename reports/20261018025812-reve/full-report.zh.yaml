      - number: '2.2'
        title: 受证据约束的规模视角
        blocks:
          - type: paragraph
            body: >-
              本组来源没有分析师报告、申报文件、行业协会或政府数据集提供可信的 TAM、SAM 或 SOM，因此自上而下的市场规模标题会流于推测。更稳妥的替代方案是工作流视角：官方启动文章和独立报道都描述了反复创作
              、编辑、混剪及直接操控图像的产品，而 TrilogyAI 是保留来源中唯一具体的经济信号，将 Reve 的 API 积分换算为隐含基础图像价格。这让可用的规模框架更窄，但仍与估值相关：反复制作大量设计
              变体的买方更关注可控性、吞吐量和每个被接受资产的成本，而不是抽象的品类宽度。缺失的是 Reve 当前实际承接多少工作流量的清晰公开证据，尤其是企业、API 和网页应用场景。
