          label: 采用验证
          detail: 付费留存和生产环境案例仍未验证。
        - id: economics-proof
          label: 经济性验证
          detail: 标价优势需要经过重试调整的毛利率验证。
        - id: capitalization
          label: 资本结构
          detail: 当前股权结构表、优先权安排、债务和现金均不可得。
        - id: entry-price
          label: 入场价格
          detail: 没有经过验证的当前估值或所有权条款可以支持定价。
        - id: decision
          label: 继续研究
          detail: 缺失的验证尚未汇聚前，不应认可这项投资。
    approximationNotes: 有序决策门槛，不是按概率加权或按价值比例绘制的图。
