            body: >-
              Reve 的隐私姿态比公开可靠性更具体。隐私政策确认服务覆盖图像生成、编辑、发现和策展，并称 Reve 可能使用第三方大语言模型或其他 AI 系统来运行提示词扩展或聊天功能。政策还称个人信息及其他内容
              可能被用于训练和改进服务，生成或上传的内容可能依据订阅设置对其他用户或公众可见。独立产品评论对免费计划发出同样警告，并指出付费层需要明确选择退出训练。这足以标记企业保密和治理风险，但不足以完成安全控制
              、正常运行时间、认证或事故处理尽调。官方产品资料稀疏，也意味着大多数技术细节仍来自启动文章和第三方摘要，而非持久文档。
