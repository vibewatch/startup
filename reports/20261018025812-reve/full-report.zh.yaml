        title: 市场边界与证据范围
        blocks:
          - type: paragraph
            body: >-
              保留来源对 Reve 的定义比宽泛的“创意 AI”或通用生产力市场更窄。官方页面将其描述为创意工具初创公司，产品围绕图像创作、编辑、混剪和可控工作流，而非通用多模态助手。独立资料也支持这一定位：Gro
              kipedia 和 Neuronfeed 都强调提示词遵循、文字渲染及拖放或布局感知控制，第三方评论则反复将 Reve 放在拥挤的文生图赛道中。因此，直接有证据支持的市场边界应限定为面向设计密集型工作 流的 AI
              图像生成与编辑。没有更多证据，不应把本章市场扩展到更广泛的创意软件支出、通用营销自动化或视频优先工具。
