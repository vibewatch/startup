            body: >-
              公开领导层信息范围很窄，且高度集中于创始人。公司启动文章列出 Christian Cantrell、Michaël Gharbi、Taesung Park、Jon Watte 和 Mike Speiser
              为联合创始人。独立佐证最充分的是 Cantrell；DigitalToday 称其为联合创始人兼首席产品官，曾在 Stability AI 和 Adobe 负责产品。治理情况更令人不安：Reve
               称部分 AI Research 员工将加入 OpenAI，而后续产品转向由 Cantrell 作为公开引述者说明，显示公开领导层集中在少数人手中。已审阅来源没有披露董事会构成、管理层深度或正式决策权
              ，因此后文应把治理假设视为待尽调事项，而非既成事实。
