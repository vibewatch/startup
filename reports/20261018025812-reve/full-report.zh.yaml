            body: >-
              指定来源中最新的资本数据来自 Forge 私募市场公司页面：$3.9 billion 投后估值、$1.62 billion 总融资，以及 2026 年 7 月 27 日的 Series C-2 和 Series
              C-1 轮。这说明公司近期可能筹得大量外部资本，但仍不能回答资本充足性问题。同一来源明确警告，其价格和私营公司指标可能依赖有限输入，且未经独立审计；保留来源没有披露现金、烧钱速度、现金跑道
              、债务义务或契约结构。换言之，公开融资可见度提升得比流动性可见度更快，因此本章只能把融资依赖描述为尚未解决的承保缺口，而非已解决的资本风险。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Reve 的公开财务逻辑目前是商业架构故事，而不是经营结果故事。公司似乎通过产品和 API 同时销售可控的高分辨率图像生成，公开单价足够激进，若算力和重试行为高效，能够支持高频试用。但尽调真正需要的证
              据仍缺失：收入结构、实际价格、客户集中度、毛利率、队列留存、获客成本、回本周期、现金和跑道。在这些数字出现在尽调材料前，收入质量、利润率路径和资本充足性都仍是待解问题，而非可投资事实。
            claimRefs:
