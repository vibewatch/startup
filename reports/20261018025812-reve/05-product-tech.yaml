  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-proof
      missingEvidence: Public status-page history, uptime or SLA commitments, incident history, and support-escalation metrics for the live product.
      whyItMatters: Without operational evidence, diligence cannot tell whether the layout-aware workflow was dependable enough for production teams rather than demos.
      diligencePath: Request status logs, uptime or SLA terms, support KPIs, and customer references tied to active production usage.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: security-compliance
      missingEvidence: Security certifications, governance documentation, retention controls by plan, and enterprise privacy controls beyond the public policy.
      whyItMatters: Creative teams may upload sensitive brand assets or customer material, so policy language alone does not clear security or compliance review.
      diligencePath: Request a security whitepaper, certification letters, DPA terms, retention matrix, and admin-control screenshots or documentation.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: minor
      topic: developer-signal
      missingEvidence: Public repository, package, practitioner-community, or partner-engineering proxy evidence showing external developer adoption of Reve tooling.
      whyItMatters: The chapter brief expects developer or practitioner signal when integrations matter, but the assigned pool does not provide that external proof.
      diligencePath: Request API customer references, forum or community metrics, or partner engineering case studies; otherwise document the product as non-developer-led.
