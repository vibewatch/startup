      - ["Revise one object without rebuilding the whole frame", "Select region, issue edit, inspect result", "Object-level editor with move, resize, recolor, replace, or remove actions", "Targets the changed region instead of a full-scene restart", "Public proof of error rates or state-management robustness is absent"]
      - ["Use multiple references to control structure and style", "Upload literal or inspirational references plus supporting material", "Reference-led workflow that can also use PDFs or audio as guidance", "More structured control than prompt-only generation", "No public description of permission checks, versioning, or enterprise asset governance"]
      - ["Embed image generation inside another application", "Call an API from a partner workflow", "Beta API and third-party integration surface", "Would reduce manual handoff between product and design surfaces", "API was discontinued, so this path is not currently durable"]
    notes: >-
      Benefits are limited to public product positioning, benchmark references,
      and workflow descriptions; no source in the assigned pool reports customer
      productivity deltas or verified output quality metrics.
    claimRefs: [CE004, CE005, CE006, CE007, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Input and reference ingestion", "Collect prompts, follow-up edits, and uploaded reference material", "User text and provided media; third-party AI may assist prompt processing or chat features", "External AI use and data handling are not deeply documented"]
      - ["Layout representation", "Translate visual intent into structured spatial state", "Official differentiator for composition and editability", "No public benchmark isolates how much this layer improves accuracy"]
      - ["Generation and edit engine", "Render native-4K outputs and apply targeted revisions", "Current product plus object-level editing, effects, and upscaling", "No public latency, uptime, or failure-rate disclosures"]
      - ["Governance and deployment controls", "Apply plan rules, privacy settings, and access limits", "Training settings, public visibility conditions, browser delivery, and discontinued API", "No public SOC, ISO, or status-page evidence in assigned sources"]
    notes: >-
      This is a public-evidence operating model, not an internal system diagram;
      missing items indicate documentation gaps rather than inferred absence.
    claimRefs: [CE004, CE007, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public sources describe Reve as a layered creative workflow rather than a
      single model call.
    data:
      layers:
        - label: Input brief and references
          detail: Prompts, uploaded images, and reference material seed the workflow.
          modules:
            - Text brief and follow-up instructions
            - Uploaded image references
            - Literal versus inspiration mode
            - PDF or audio guidance inputs
        - label: Layout representation
          detail: Reve says images are decomposed into a code-like intermediate representation before generation and editing.
          modules:
            - Structured spatial plan
            - Addressable regions and objects
            - Internal visual "code" for composition
        - label: Generation model
          detail: Independent coverage frames the live model family as native-4K with stronger text handling.
          modules:
            - Native 4K output
            - Dense and multilingual text rendering
            - Aesthetic and detail optimization
        - label: Direct-manipulation editor
          detail: Object-level edits are supposed to change selected elements without restarting the whole image.
          modules:
            - Move, resize, recolor, replace, or remove
            - Spotlight, drawing, and effects
            - Background removal and upscaling
        - label: Conversational workflow layer
          detail: The product combines chat-style refinement with assistant-style ideation and remixing.
          modules:
            - Natural-language edit loop
            - Creative assistant
            - Multi-image remix workflow
        - label: Access and governance layer
          detail: Public deployment depended on the browser app, plan settings, privacy controls, and a now-discontinued API.
          modules:
            - Web application
            - Paid-plan energy controls
            - Training opt-out and public visibility settings
            - API beta then discontinuation
    approximationNotes: >-
      Architecture reflects public product claims and independent roundups, not
      internal service diagrams or disclosed reliability telemetry.
    claimRefs: [CE002, CE004, CE006, CE007, CE009, CE010, CE011]
