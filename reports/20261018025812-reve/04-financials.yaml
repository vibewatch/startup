schemaVersion: report-v2
artifact: financials
slug: reve
runDate: 2026-10-18
company:
  name: Reve
chapter:
  number: 4
  title: Financials
  summary: >-
    Reve's public financial picture is strongest on product-side monetization mechanics rather than
    reported operating results: the visible revenue surfaces are a self-serve app and a beta API,
    while independent analysis points to very low headline per-image pricing before add-ons. The
    underwriting problem is that none of the retained sources disclose revenue, gross margin, burn,
    runway, or customer durability, so the latest financing headline still does not resolve capital
    adequacy.
sections:
  - id: public-revenue-surface
    title: Public revenue surface is visible, but realized monetization is not
    body: >-
      The retained evidence shows that Reve has two monetization surfaces in market today: a
      self-serve image product and a beta API that lets third parties create, edit, and remix
      images inside their own workflows. That is enough to describe the revenue mechanism at a high
      level, but not enough to underwrite revenue quality. Independent coverage of the current
      product stack says Reve 2.0 no longer has separate pricing because Reve 2.1 replaced it, so
      investors should not confuse historical model positioning with a durable current rate card.
      The cleanest public list-like price point in the assigned pool comes from independent analysis
      of the API credit system: create, edit, and remix cost 5 credits per image, and 7,500 credits
      for $10 implies roughly $0.0067 per image before add-ons. That is a useful anchor for top-of-
      funnel monetization, but it is not realized revenue, margin, or net retention.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-delivery-costs
    title: Unit-economics proxies suggest a volume model, but cost discipline is unproven
    body: >-
      Public evidence supports a specific economic pitch rather than a full unit-economics model.
      Reve emphasizes native 4K generation, layout-aware editing, and iterative create/edit/remix
      workflows, while independent analysis argues that the low base API price only matters if retry
      rates, add-on usage, and production stability stay under control. That implies a volume-driven
      model in which gross profit depends on compute efficiency and post-processing attach rates,
      not just on topline image generation counts. The same independent analysis also says Reve's
      API is broad enough for the core creative loop but less granular than OpenAI's engineering
      surface on masks, streaming, moderation, and compression, which matters because weaker control
      surfaces can translate into more retries or more manual correction cost in production.
    claimRefs: [CI002, CI004, CI005, CI006, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-visibility-and-underwriting-gaps
    title: Financing visibility is better than cash visibility
    body: >-
      The latest capital datapoint in the assigned pool comes from Forge's private-market company
      page, which lists a $3.9 billion post-money valuation, $1.62 billion total funding, and July
      27, 2026 Series C-2 and Series C-1 rounds. That is directionally useful because it indicates
      the company has raised significant external capital recently, but it is still an incomplete
      capital-adequacy answer. The same source explicitly warns that its price and private-company
      metrics may rely on limited inputs and are not independently audited, and none of the retained
      sources disclose cash on hand, burn, runway, debt obligations, or covenant structure. In
      other words, public financing visibility has improved faster than liquidity visibility, so the
      chapter can describe funding dependence only as an unresolved underwriting gap rather than a
      solved capital-risk question.
    claimRefs: [CI008, CI009, CI010, CI014]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Reve's public financial case is currently a commercial architecture story, not a disclosed
      operating-results story. The company appears to be selling controllable high-resolution image
      generation through both product and API surfaces, and the visible list economics are
      aggressive enough to support high-volume experimentation if compute and retry behavior are
      efficient. What is still missing is the evidence that matters for underwriting: revenue mix,
      realized pricing, customer concentration, gross margin, cohort retention, CAC, payback, cash,
      and runway. Until those numbers are produced in diligence, the prudent view is that revenue
      quality, margin path, and capital sufficiency remain open questions rather than investable
      facts.
    claimRefs: [CI003, CI004, CI008, CI011, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Self-serve app
        - Image creation, editing, and remixing inside Reve's own product surface
        - User access / subscription or credits
        - Public app surface is live; current subscriptions are described as creative-energy based
        - Product access is confirmed, but realized billing and paid-user mix are undisclosed
        - Request current subscription tiers, active paying users, and free-to-paid conversion
      - - Beta API
        - Programmatic create, edit, and remix workflows for third-party applications
        - Credits per image
        - API is live in beta; independent analysis cites 5 credits per image on base operations
        - Visible usage pricing exists, but realized contract terms and customer concentration are unknown
        - Request current API price export, top-customer mix, and create/edit/remix usage split
      - - Add-ons / post-processing
        - Upscaling, background removal, resizing, saved effects, and extended generation time
        - Per operation
        - Public analysis says add-ons can raise realized cost above the base per-image quote
        - Monetization surface exists, but surcharge capture and attach rates are not disclosed
        - Request surcharge schedule and attach-rate by workflow
    notes: >-
      Public snapshot only; rows describe visible monetization surfaces from assigned October 2026
      sources, not realized revenue mix or exhaustive commercial terms.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers only public app, API, and add-on surfaces visible in the assigned 2026 source pool;
        enterprise contracts, discounts, and realized billing are not publicly disclosed.
    claimRefs: [CI001, CI003, CI004, CI005, CI006]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Surface
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - API create/edit/remix
        - 5 credits per image; 7,500 credits for $10 implies about $0.0067 per base image before add-ons
        - Public list-equivalent analysis, not disclosed realized revenue
        - Add-ons, enterprise discounts, input costs, and usage mix remain unknown
        - Trilogy AI analysis plus official API availability
      - - Current subscriptions
        - Creative-energy system; separate Reve 2.0 pricing no longer shown
        - Public existence confirmed, numeric list tiers not retained in assigned evidence
        - Current tier prices, promotional credits, and renewal terms unknown
        - The Rundown archive plus official product pages
      - - Free / beta access
        - Free product entry and beta API access are both publicly marketed
        - Acquisition tactic is visible, conversion economics are not
        - No public free-to-paid conversion, payback, or retention disclosure
        - Official launch post and product surface
    notes: >-
      Public pricing evidence mixes official product statements with independent analysis; realized
      pricing, discounting, and revenue recognition remain undisclosed.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers only publicly visible list-like pricing and access terms in the assigned source set;
        private enterprise contracts and realized net price are unavailable.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Base API list price per image
        - ~$0.0067 before add-ons
        - Medium
        - Sets the visible monetization floor for programmatic usage
        - Verify the current October 2026 API price card and pack structure
      - - Delivered-cost drivers
        - Native 4K generation plus add-ons and retry behavior
        - Medium
        - Compute intensity and post-processing can compress gross margin versus the base quote
        - Request COGS per generated image by operation and retry rate by workflow
      - - Revenue quality metrics
        - null
        - Low
        - ARR, paid-user mix, and retention are required to separate hype from durable spend
        - Request MRR/ARR bridge, cohort retention, and paying-customer segmentation
      - - Sales efficiency metrics
        - null
        - Low
        - CAC, payback, and cycle length determine whether the app/API motion scales efficiently
        - Request funnel conversion, CAC, payback, and enterprise sales-cycle data
      - - Cash adequacy metrics
        - null
        - Low
        - Latest financing headlines are not the same as current liquidity or runway
        - Request cash balance, monthly burn, runway cases, and debt obligations
    notes: >-
      Null means the assigned public evidence does not disclose the metric; available cost proxies
      come from public pricing mechanics and product architecture rather than reported financials.
    claimRefs: [CI004, CI005, CI008, CI011, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a usage-metered API bridge, but realized revenue still depends on add-ons and low-retry execution.
    data:
      nodes:
        - label: Creative demand
          detail: Users generate, edit, and remix images through a self-serve product and beta API.
        - label: Metered API action
          detail: Independent analysis says create, edit, and remix are billed at 5 credits per image.
        - label: Credit package
          detail: The same analysis says 7,500 credits are sold for $10.
        - label: Base unit revenue
          detail: That package implies about $0.0067 per image before add-ons.
        - label: Realized bill
          detail: Upscaling, background removal, resizing, extended generation time, and retries can raise cost per accepted asset.
        - label: Gross-profit path
          detail: Margin depends on whether 4K generation and iterative editing stay efficient enough to avoid heavy rework.
    approximationNotes: >-
      This figure bridges only the public usage-pricing mechanics retained in the assigned pool; it
      is not a reported gross-margin waterfall or a substitute for customer-level billing data.
    claimRefs: [CI001, CI004, CI005, CI011, CI013]
callouts:
  - calloutType: insight
    title: Public economics are visible only at the top of the funnel
    body: >-
      The assigned evidence is detailed enough to describe how a create/edit/remix job can be
      monetized, but not enough to show realized price, gross profit, or retention after that job
      lands.
    claimRefs: [CI004, CI005, CI013]
  - calloutType: risk
    title: Capital adequacy is still an underwriting blocker
    body: >-
      A current valuation and funding headline does not answer cash-on-hand, burn, runway, or debt
      exposure, and Forge explicitly qualifies the reliability of its private-company datapoints.
    claimRefs: [CI009, CI010, CI014]
