figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Reve's public journey runs from free creator trial into paid plans, team
      packaging, API usage, and partner-channel access, with major evidence gaps
      on retention and customer scale.
    data:
      items:
        - label: Discover
          detail: Free access and public web availability make initial trial easy.
          touchpoints:
            - reve.com free access
            - public web app listing
        - label: Validate output
          detail: Users test prompt fidelity, editing, and remixing in the browser.
          touchpoints:
            - create, edit, and design images
            - drag-and-drop editing and remix
        - label: Upgrade
          detail: Paid Lite and Pro tiers convert heavier creator usage.
          touchpoints:
            - monthly paid tiers
            - higher allowance and video features
        - label: Collaborate
          detail: Team workspace packaging points to a sales-assisted seat motion.
          touchpoints:
            - team workspaces
            - contact-sales team plan
        - label: Integrate
          detail: Developers and platforms can adopt via API or partner channels.
          touchpoints:
            - API beta and usage-based pricing
            - Oakgen marketplace access
        - label: Expand or stall
          detail: Retention proof is missing and buyer friction is visible.
          touchpoints:
            - training-default concern on free plan
            - opaque credit economics and no public cohort data
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU006
      - CU007
      - CU011
      - CU012
callouts:
  - calloutType: strength
    title: Multiple entry points exist even without named logos
    body: >-
      Reve already exposes a credible acquisition stack — free web use, paid
      creator tiers, team packaging, API access, and at least one partner-channel
      listing — so the customer question is depth and durability, not whether the
      product can be reached by real users.
    claimRefs:
      - CU001
      - CU004
      - CU007
  - calloutType: risk
    title: The public evidence base still cannot underwrite customer durability
    body: >-
      The retained sources never disclose named reference customers, customer
      counts, NRR, churn, concentration, or contract length, and the visible
      free-plan training default plus opaque credit economics add procurement
      friction for serious buyers.
    claimRefs:
      - CU005
      - CU011
      - CU012
      - CU013
