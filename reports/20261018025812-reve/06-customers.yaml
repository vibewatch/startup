schemaVersion: report-v2
artifact: customers
slug: reve
runDate: 2026-10-18
company:
  name: Reve
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Reve has a real customer-entry stack — free web access,
    paid creator tiers, team workspace packaging, an API, and at least one
    partner-channel listing — but the proof mostly stops at product availability
    and pricing surfaces. The visible motion still looks creator-led with optional
    team and API expansion, because Reve does not publicly disclose named customer
    deployments, customer counts, retention metrics, or concentration data in the
    retained source set.
sections:
  - id: visible-customer-entry-points
    title: Visible customer entry points are creator-led, with team and API upsell paths
    body: >-
      The strongest public customer evidence is not a list of reference accounts;
      it is the shape of the product surfaces Reve has made available. Official
      pages show a browser-based experience for creating, editing, and designing
      images, while the launch post describes the product as four bundled surfaces:
      image creation/remixing, drag-and-drop editing, a creative assistant, and
      an API. Third-party reviews add pricing context that suggests a ladder from
      free experimentation to paid creator plans, team workspaces, and usage-based
      API access. That mix points to a bottom-up creator motion first, with
      higher-value expansion paths for teams and developers, rather than a
      customer base centered on already-disclosed enterprise accounts.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU014
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: public-adoption-proof
    title: Public adoption proof exists, but it is mostly packaging and channel evidence
    body: >-
      Reve's public proof of adoption is stronger on access and packaging than on
      measured deployment. Independent reviews show a free tier, paid plans, and
      an API surface; Oakgen distributes two Reve variants without requiring a
      separate Reve subscription; and public directories still describe the
      product as a web application that creators can try directly. Those are
      meaningful adoption surfaces because they show actual paths to usage and
      monetization. They do not, however, establish named production rollouts,
      customer outcomes, or account scale. The most supportable conclusion is
      that Reve has multiple reachable customer surfaces, while its public proof
      of customer depth remains thin.
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002
      - TU003
  - id: durability-and-concentration
    title: Durability, concentration, and procurement quality remain open diligence items
    body: >-
      The chapter's biggest weakness is durability evidence. None of the retained
      sources disclose customer count, paid conversion, NRR, GRR, churn, renewal
      rates, contract length, or top-customer concentration. The visible frictions
      are also more relevant for serious buyers than casual testers: AI Deck notes
      that free-plan output is used for model training by default and that the
      credit system is hard to interpret, while Reve's terms add a mandatory
      informal dispute-resolution step before arbitration. Those details do not
      disprove adoption, but they make it harder to underwrite long-term account
      quality, enterprise procurement readiness, or concentration risk from public
      evidence alone.
    claimRefs:
      - CU005
      - CU011
      - CU012
      - CU013
      - CU014
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Observable scale signal
      - Revenue / strategic value
      - Diligence gap
    rows:
      - - Free creators / prospects
        - Individual creator or marketer evaluating the web app
        - Test prompt fidelity, editing, and remixing before payment
        - Free access and daily-refreshing allowance are publicly described
        - Top-of-funnel acquisition and model-feedback surface
        - No disclosed MAU, activation, or free-to-paid conversion
      - - Paid creator subscribers
        - Freelancer, creator, or small operator paying directly
        - Higher-volume image generation, editing, and video work
        - Lite and Pro tiers are publicly described by third-party reviews
        - Direct self-serve monetization
        - No disclosed paid-account count, churn, or ARPU
      - - Team workspace buyers
        - Design lead, social team, or business buyer
        - Shared asset production and collaboration
        - Team workspaces are described and Teams is a contact-sales motion
        - Seat expansion and higher contract value
        - No named team customers, seat counts, or renewal data
      - - API / platform buyers
        - Developer, product team, or partner platform
        - Embed create, edit, and remix workflows into another product
        - API beta is official; Oakgen offers Reve through its own surface
        - B2B expansion beyond direct web subscriptions
        - No disclosed API customer logos, volume, or partner economics
    notes: >-
      Compiled from official app/blog surfaces plus independent reviews; rows
      describe visible go-to-market motions, not disclosed account counts.
