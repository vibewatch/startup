  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer case studies, customer quotes, procurement records, or public deployment announcements that identify real production users.
      whyItMatters: Without named deployment proof, product availability and pricing cannot be translated into customer quality or reference strength.
      diligencePath: Request three reference calls or signed customer case studies split across creator, team, and API buyers.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Customer count, paid conversion, churn, renewal, NRR, GRR, contract length, and top-customer concentration data.
      whyItMatters: These metrics determine whether visible adoption surfaces are durable enough to support underwriting and whether revenue is concentrated.
      diligencePath: Obtain cohort tables, renewal dashboards, and a top-10 customer revenue bridge directly from management.
      relatedQuestionRefs:
        - QU006
    - type: missing-source
      severity: minor
      topic: partner-economics
      missingEvidence: Volume, economics, and strategic importance of third-party distribution channels such as Oakgen.
      whyItMatters: Partner access broadens distribution, but its importance cannot be sized without usage or revenue-share data.
      diligencePath: Ask management for partner GMV, revenue share, and active account contribution by channel.
