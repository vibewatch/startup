company:
  name: "Reve"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Reve competes from a differentiated position on layout-native image control, but the public record
    still shows stronger incumbent power with OpenAI on generic image quality, Google on grounded
    multimodal workflows, and Midjourney on creative community and style exploration. The public
    evidence also shows packaging and pricing changing quickly through 2026, so the clearest near-term
    edge is cheap high-resolution iteration rather than a proven distribution or lock-in moat.
sections:
  - id: "competitive-landscape"
    title: "Competitive set spans direct design tools, generalist incumbents, and status-quo workflows"
    body: |-
      The relevant landscape is broader than "other text-to-image startups." Reve is trying to sell a
      workflow that combines image generation, iterative editing, remixing, and API access around a
      layout-native representation. That puts its direct comparison set against design-oriented models
      such as Ideogram, but also against incumbent image platforms like OpenAI and Google, plus
      Midjourney as the style-led community default. The substitute category is still large as well:
      teams can approximate the same buyer job by pairing a general-purpose image API with their own
      editing, approval, and prompt-governance layer, which means Reve must beat both model quality and
      workflow friction rather than just ranking well on a single benchmark.
    claimRefs: ["CP005", "CP006", "CP007", "CP008", "CP011", "CP014"]
    tableRefs: ["TP001"]
  - id: "capability-differentiation"
    title: "Reve's differentiation is controllable composition more than generic benchmark leadership"
    body: |-
      The strongest public differentiation is not that Reve is the undisputed best image model overall;
      it is that Reve keeps insisting on image structure as an editable intermediate layer. Its official
      product and API surfaces center on create/edit/remix actions, a drag-and-drop editor, and layout
      endpoints rather than a prompt-only generation loop. Third-party reviews echo that positioning by
      describing literal instruction following, spatial precision, and typography control as the product
      strengths versus Midjourney-style aesthetic interpretation. That matters for design, marketing,
      and production teams whose failure mode is not "the image looks ugly" but "the model moved the
      wrong object, broke the headline, or changed the approved composition."
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP012"]
    tableRefs: ["TP002"]
  - id: "pricing-and-switching"
    title: "Low base API economics help, but public pricing signals are volatile and buyer proof is thin"
    body: |-
      Pricing is where Reve looks most strategically aggressive, because independent commentary pegs its
      base API math well below Google's published image rates and below OpenAI's medium- and
      high-quality image examples. That is a meaningful wedge if the product really reduces retries in
      production workflows. The harder part is underwriting durability from public evidence alone. Public
      pricing snapshots changed across 2026, shifting from one set of web subscription tiers to newer
      Starter/Standard/Premium or creative-energy framing as Reve 2.1 replaced 2.0. The same evidence
      set also lacks named enterprise references, renewal data, or migration case studies, so switching
      costs still look more architectural than commercially proven.
    claimRefs: ["CP003", "CP008", "CP009", "CP012"]
    tableRefs: ["TP003"]
  - id: "durability-and-displacement"
    title: "Moat durability is still vulnerable to incumbent quality, grounding, and distribution"
    body: |-
      The public adverse evidence is not that Reve has no product edge; it is that the edge may be
      narrow enough for incumbents to respond. FelloAI still places GPT-Image-2 ahead of Reve on the
      June 2026 blind-vote leaderboard, and Trilogy argues OpenAI remains the safest default for broad
      production image generation because it exposes a deeper engineering surface. Google's image stack,
      meanwhile, is positioned for grounded visualizations and infographics that tie into broader
      multimodal infrastructure. Midjourney keeps a style-and-community niche, and public reviews still
      cite Reve limitations including slower inference, no mobile app, and unaudited vendor claims on
      fastest-4K or least-compute leadership. For now, that leaves Reve with a real capability wedge but
      only partially evidenced defensibility.
    claimRefs: ["CP005", "CP006", "CP007", "CP010", "CP011", "CP013", "CP014"]
    figureRefs: ["FP001"]
callouts:
  - calloutType: "strength"
    title: "Best-evidenced strength"
    body: >-
      The clearest public differentiation is layout-native controllability across create, edit, remix,
      and direct manipulation rather than a pure prompt-to-pixels workflow.
    claimRefs: ["CP001", "CP002", "CP003", "CP004"]
  - calloutType: "risk"
    title: "Best-evidenced displacement risk"
    body: >-
      OpenAI, Google, and Midjourney each own a different incumbent advantage—quality, grounded
      multimodal workflows, or creator distribution—that Reve has not yet neutralized in public evidence.
    claimRefs: ["CP005", "CP006", "CP007", "CP011", "CP013"]
