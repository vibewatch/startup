evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: Public board list, executive roster, role descriptions, and decision-rights map.
    whyItMatters: >-
      Leadership concentration and governance rights affect execution risk, control, and succession planning during the
      product pivot.
    diligencePath: Request board materials, executive org chart, and cap-table-linked governance docs from management.
    relatedQuestionRefs:
      - QO002
      - QO005
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Full financing history, ownership percentages, board or observer rights, and any strategic restrictions tied to
      OpenAI.
    whyItMatters: >-
      The current public record does not show who controls the company economically or strategically after the 2026
      investment.
    diligencePath: Obtain the cap table, financing deck, and executed term documents for the OpenAI round and prior financings.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: snapshot kpi table coverage
    missingEvidence: Revenue, run-rate, gross margin, customer count, headcount, and paid-cohort retention data.
    whyItMatters: The underwriting case cannot be stress-tested without validated commercial scale and efficiency metrics.
    diligencePath: Request the operating KPI pack, billing extracts, cohort tables, and HRIS-backed headcount report.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-scale
    missingEvidence: >-
      A reconciled financing history that explains whether public references to $30 million or $390 million refer to
      different rounds, instruments, or data errors.
    whyItMatters: Conflicting financing totals undermine any valuation, dilution, or runway baseline for later diligence chapters.
    diligencePath: >-
      Confirm round history directly with management and at least one named investor, then tie every amount to date,
      instrument, and post-money valuation.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: post-shutdown roadmap
    missingEvidence: >-
      Public launch timing, pricing, and customer migration detail for the workflow-oriented products Reve says it is
      now building.
    whyItMatters: >-
      The company has deprecated its legacy image-generation surface before the replacement offering is clearly
      documented.
    diligencePath: >-
      Request current roadmap, product launch calendar, migration playbook, and revenue model for the post-pivot product
      set.
    relatedQuestionRefs:
      - QO006
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A credible analyst, trade-association, filing, or government source that sizes the addressable market with
      explicit methodology.
    whyItMatters: >-
      Without a reliable external sizing baseline, valuation discussion can only lean on workflow logic and product
      economics.
    diligencePath: >-
      Search for analyst or trade-association market reports that explicitly size AI image generation, design
      automation, or related creative-workflow spend.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Public disclosure of customer mix, API versus app usage, enterprise contract shapes, and budget-owner
      concentration.
    whyItMatters: >-
      The buyer map remains inferential until the company or independent references show who is actually paying and
      renewing.
    diligencePath: >-
      Look for customer case studies, procurement references, implementation partners, or product documentation that
      discloses usage by segment.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: continuity-risk
    missingEvidence: >-
      Direct official explanation reconciling the API shutdown and creative-tooling sunset with earlier continuity
      promises.
    whyItMatters: >-
      Continuity risk affects whether workflow strengths can translate into durable adoption and therefore changes
      valuation relevance.
    diligencePath: >-
      Recheck official blog, support, and product-status surfaces for updated continuity statements or post-shutdown
      migration details.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: switching-cost-evidence
    missingEvidence: >-
      Named enterprise win/loss studies, renewal cohorts, and multi-homing behavior across Reve, OpenAI, Google, and
      Midjourney.
    whyItMatters: >-
      Without customer migration and retention evidence, the moat case rests on product architecture rather than proven
      buyer lock-in.
    diligencePath: >-
      Request top-customer cohorts, renewal by segment, reasons-for-win/loss notes, and API usage concentration for the
      top paid accounts.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: stale
    severity: material
    topic: pricing-volatility
    missingEvidence: Live 2.1 pricing exports for web and API plans, plus realized discounting or bundled enterprise terms.
    whyItMatters: >-
      Competitive pricing is one of Reve's clearest public wedges, but fast-changing packaging can invalidate list-price
      comparisons.
    diligencePath: >-
      Pull the current pricing page, current API console rates, and any enterprise price book or discount schedule
      before underwriting cost advantage.
    relatedQuestionRefs:
      - QP003
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Controlled benchmark data on safe-zone adherence, edit stability, and typography retention versus OpenAI, Google,
      Ideogram, and Midjourney.
    whyItMatters: >-
      Reve's layout-native control thesis is credible, but the public sources here do not prove how often it wins in
      repeated production tasks.
    diligencePath: >-
      Run a structured bake-off across fixed creative briefs, edit passes, and post-processing flows using the same
      prompts, references, and acceptance criteria.
    relatedQuestionRefs:
      - QP002
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: core-operating-metrics
    missingEvidence: Current revenue, ARR, gross margin, cash balance, monthly burn, runway, and paid-customer counts.
    whyItMatters: These are the minimum inputs needed to judge revenue quality, margin path, and financing dependency.
    diligencePath: Request a monthly P&L bridge, cash bridge, board-level KPI dashboard, and customer cohort summary.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
  - type: enumeration-incomplete
    severity: material
    topic: public pricing tables
    missingEvidence: Exhaustive pricing, discounting, and enterprise contract terms across the self-serve product, API, and add-ons.
    whyItMatters: >-
      The public tables can describe visible surfaces but cannot support realized pricing or revenue-recognition
      conclusions.
    diligencePath: Request the current rate card, enterprise order form templates, discount policy, and add-on attach-rate report.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, conversion funnel, win rates, and enterprise sales-cycle data.
    whyItMatters: >-
      Without sales-efficiency data, the chapter cannot test whether the beta API and self-serve motion scale
      economically.
    diligencePath: Request pipeline funnel data, CAC by channel, sales-cycle distributions, and payback calculations by segment.
    relatedQuestionRefs:
      - QI003
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: COGS per image job, retry-rate distributions, and gross margin by create/edit/remix workflow.
    whyItMatters: >-
      The low public list price may be attractive commercially but still unattractive economically if compute or retry
      costs are high.
    diligencePath: Request cost-accounting output by operation, retry telemetry, and gross-margin waterfalls for the API and app.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability-proof
    missingEvidence: >-
      Public status-page history, uptime or SLA commitments, incident history, and support-escalation metrics for the
      live product.
    whyItMatters: >-
      Without operational evidence, diligence cannot tell whether the layout-aware workflow was dependable enough for
      production teams rather than demos.
    diligencePath: Request status logs, uptime or SLA terms, support KPIs, and customer references tied to active production usage.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Security certifications, governance documentation, retention controls by plan, and enterprise privacy controls
      beyond the public policy.
    whyItMatters: >-
      Creative teams may upload sensitive brand assets or customer material, so policy language alone does not clear
      security or compliance review.
    diligencePath: >-
      Request a security whitepaper, certification letters, DPA terms, retention matrix, and admin-control screenshots
      or documentation.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public repository, package, practitioner-community, or partner-engineering proxy evidence showing external
      developer adoption of Reve tooling.
    whyItMatters: >-
      The chapter brief expects developer or practitioner signal when integrations matter, but the assigned pool does
      not provide that external proof.
    diligencePath: >-
      Request API customer references, forum or community metrics, or partner engineering case studies; otherwise
      document the product as non-developer-led.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named customer case studies, customer quotes, procurement records, or public deployment announcements that
      identify real production users.
    whyItMatters: >-
      Without named deployment proof, product availability and pricing cannot be translated into customer quality or
      reference strength.
    diligencePath: Request three reference calls or signed customer case studies split across creator, team, and API buyers.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Customer count, paid conversion, churn, renewal, NRR, GRR, contract length, and top-customer concentration data.
    whyItMatters: >-
      These metrics determine whether visible adoption surfaces are durable enough to support underwriting and whether
      revenue is concentrated.
    diligencePath: Obtain cohort tables, renewal dashboards, and a top-10 customer revenue bridge directly from management.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: minor
    topic: partner-economics
    missingEvidence: Volume, economics, and strategic importance of third-party distribution channels such as Oakgen.
    whyItMatters: Partner access broadens distribution, but its importance cannot be sized without usage or revenue-share data.
    diligencePath: Ask management for partner GMV, revenue share, and active account contribution by channel.
  - type: private-evidence-only
    severity: blocking
    topic: service-continuity
    missingEvidence: Primary confirmation or contradiction of the reported API, image-generation, login, export, and refund timeline.
    whyItMatters: >-
      The most severe risk signal is competitor-issued, so its dates cannot support a final continuity judgment without
      company or customer records.
    diligencePath: >-
      Obtain management notices, customer communications, refund completion records, service logs, and current access
      demonstrations.
    relatedQuestionRefs:
      - QR002
      - QR006
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Privacy, security, training-data, provenance, incident, and legal-governance documentation.
    whyItMatters: Public product pages cannot establish enterprise control maturity or bound legal and regulatory exposure.
    diligencePath: >-
      Request the DPA, trust packet, assurance reports, incident register, model-governance memo, and counsel's claims
      and regulatory schedule.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-model-risk
    missingEvidence: Current burn, runway, gross margin, compute commitments, refund liability, and working-capital data.
    whyItMatters: >-
      The public pool cannot quantify whether a product transition or service wind-down is funded and economically
      contained.
    diligencePath: >-
      Review the current operating plan, cash and debt schedule, compute contracts, refund reserve, and a 24-month
      runway bridge.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: team-and-customer-concentration
    missingEvidence: >-
      Current organization, key-person retention, customer concentration, contractual transition duties, and partner
      dependencies.
    whyItMatters: >-
      A small team and hosted product surfaces can magnify personnel and counterparty shocks, but the pool does not
      quantify concentration.
    diligencePath: >-
      Request the organization and retention plan, top-customer schedule, partner register, support obligations, and
      successor-product ownership map.
    relatedQuestionRefs:
      - QR003
      - QR005
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: valuation-inputs
    missingEvidence: >-
      Current cap table, fully diluted ownership, preferences, debt, cash, burn, audited revenue, gross margin, and
      financing terms.
    whyItMatters: >-
      These inputs determine dilution, downside protection, runway, and whether any proposed entry price can meet target
      returns.
    diligencePath: >-
      Obtain management's signed financing documents, board-approved capitalization table, bank statements, and monthly
      financial package; reconcile them to investor counsel's waterfall.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV010
  - type: missing-source
    severity: material
    topic: transaction-comparables
    missingEvidence: >-
      Recent disclosed private rounds, secondary marks, or M&A transactions that are comparable on business model,
      scale, growth, and margin.
    whyItMatters: Product feature comparisons cannot establish enterprise value or a defensible entry multiple.
    diligencePath: >-
      Build a banker-verified transaction set after revenue mix and cohort economics are disclosed, then normalize for
      growth, margins, and preference terms.
    relatedQuestionRefs:
      - QV009
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A dated employee roster and contractor split reconciling the public estimates of 11 and 84 people.
    whyItMatters: Team size affects burn, execution capacity, and interpretation of capital efficiency.
    diligencePath: Request a payroll-backed roster by function and reconcile employees, contractors, and affiliated personnel.
    relatedQuestionRefs:
      - QV002
