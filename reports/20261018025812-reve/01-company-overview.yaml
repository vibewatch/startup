figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show fast 2025-2026 product iteration followed by a
      strategic OpenAI deal and shutdown of the legacy image-generation service.
    data:
      items:
        - date: "2023"
          label: Company founded
          details: CrackTheDeck dates Reve's founding to 2023, but the reviewed official materials do not publish a more specific incorporation date.
          tone: neutral
          claimRefs: [CO012]
        - date: "2025-03-25"
          label: Reve Image 1.0 launches
          details: VentureBeat and DigitalToday place Reve Image 1.0 as the company's first public release.
          tone: positive
          claimRefs: [CO005]
        - date: "2025-11"
          label: Unicorn-status claim appears
          details: CrackTheDeck says Reve reached unicorn status in November 2025 with $390 million raised, but this remains single-source in this packet.
          tone: warning
          claimRefs: [CO015]
        - date: "2026-06"
          label: Reve 2.0 release
          details: Third-party product trackers describe Reve 2.0 as a native-4K, layout-aware image generation and editing release.
          tone: positive
          claimRefs: [CO006]
        - date: "2026-07"
          label: Reve 2.1 becomes current release
          details: Therundown says Reve 2.1 replaced Reve 2.0 the following month and became the active offering.
          tone: positive
          claimRefs: [CO007]
        - date: "2026-07-27"
          label: OpenAI investment announced
          details: Reve disclosed a new OpenAI investment.
          tone: positive
          claimRefs: [CO008]
        - date: "2026-07-27"
          label: Research-staff transition disclosed
          details: Reve said some AI Research staff would join OpenAI while the company continued operating independently.
          tone: warning
          claimRefs: [CO009]
        - date: "2026-09-17 / 2026-09-27"
          label: Legacy web product winds down
          details: DigitalToday reported new sign-ups were suspended on Sept. 17 and website image generation would end on Sept. 27.
          tone: negative
          claimRefs: [CO010]
        - date: "2026-10-31"
          label: Customer off-ramp deadline
          details: Existing users were told they could download created images through Oct. 31, with September subscriber refunds due by mid-October.
          tone: warning
          claimRefs: [CO010]
    approximationNotes: null
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO012, CO015]
