schemaVersion: report-v2
artifact: company-overview
slug: reve
runDate: 2026-10-18
company:
  name: Reve
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Reve is a Palo Alto AI creative-tooling startup with a visible 2025-2026
    product arc from Reve Image 1.0 to Reve 2.1, but the refresh evidence also
    shows a sharp transition: a July 2026 OpenAI investment, research-staff
    movement to OpenAI, and a September 2026 shutdown of the legacy web
    image-generation service. Identity and product milestones are reasonably
    well supported, while funding totals, valuation, governance depth, and
    commercial scale remain thin or contradictory in public sources.
sections:
  - id: identity-and-product-baseline
    title: Identity and product baseline
    body: >-
      The public evidence establishes Reve's identity and product shape more
      clearly than its commercial scale. Official materials and an independent
      March 2025 launch article place Reve in Palo Alto and describe it as a
      creative-tooling company built around controllable image creation,
      editing, remixing, and eventually API-assisted workflows rather than a
      single benchmark demo. The visible product cadence is also coherent:
      Reve Image 1.0 was the first release in March 2025, Reve 2.0 added
      native 4K layout-aware editing in June 2026, and third-party trackers
      describe Reve 2.1 as the active release from July 2026 onward. What is
      still missing is the commercial layer: public sources in this packet do
      not substantiate revenue, customer counts, or current monetization after
      the late-2026 product reset.
    claimRefs: [CO001, CO002, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      Public leadership visibility is narrow and founder-heavy. The clearest
      official naming comes from the company's launch post, which lists
      Christian Cantrell, Michaël Gharbi, Taesung Park, Jon Watte, and Mike
      Speiser as co-founders. Independent corroboration is strongest for
      Cantrell, whom DigitalToday identifies as co-founder and chief product
      officer with prior product leadership at Stability AI and Adobe. The
      broader governance read is less comfortable: Reve says some AI Research
      staff will join OpenAI, while Cantrell is the quoted public voice on the
      subsequent product pivot, implying meaningful concentration in a small
      public-facing leadership set. Board composition, broader executive depth,
      and formal decision rights are not disclosed in the reviewed sources, so
      later chapters should treat governance assumptions as open diligence work,
      not established fact.
    claimRefs: [CO003, CO004, CO009, CO011, CO016]
    tableRefs: [TO002]
  - id: funding-scale-and-transition
    title: Funding, stakeholder map, and current transition
    body: >-
      The most material 2026 update is strategic rather than financially
      transparent. Reve disclosed a new OpenAI investment on July 27, 2026,
      said some research staff would move to OpenAI, and still maintained that
      the company would remain independent. By September, DigitalToday reported
      that new sign-ups were already suspended and the web image-generation
      product would shut down on Sept. 27, with customer download and refund
      obligations stretching into late October. That makes existing-user
      continuity and roadmap credibility immediate diligence items. Funding
      history remains noisy: Neuronfeed names Basis Set Ventures and Top
      Harvest Capital as backers, There's An AI For That lists one undisclosed
      $30 million round, and CrackTheDeck claims unicorn status with $390
      million raised. Until management or lead investors reconcile those
      numbers, the capital structure and valuation baseline should be treated
      as unverified.
    claimRefs: [CO008, CO009, CO010, CO011, CO013, CO014, CO015]
    tableRefs: [TO003]
