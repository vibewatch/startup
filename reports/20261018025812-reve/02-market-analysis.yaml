      whyItMatters: Without a reliable external sizing baseline, valuation discussion can only lean on workflow logic and product economics.
      diligencePath: Search for analyst or trade-association market reports that explicitly size AI image generation, design automation, or related creative-workflow spend.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-segmentation
      missingEvidence: Public disclosure of customer mix, API versus app usage, enterprise contract shapes, and budget-owner concentration.
      whyItMatters: The buyer map remains inferential until the company or independent references show who is actually paying and renewing.
