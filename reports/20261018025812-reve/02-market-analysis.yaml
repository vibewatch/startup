chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence supports a narrow market definition for Reve: AI image generation and
    editing workflows where prompt fidelity, typography, layout-aware control, and iterative
    production matter more than generic "AI creativity" breadth. The source pool does not
    support a defensible TAM/SAM/SOM dollar stack, so the strongest market lens is workflow
    and unit economics, paired with clear adoption constraints from a crowded category, low
    switching costs, and 2026 product-continuity risk.
sections:
  - id: market-boundary
    title: Market boundary and evidentiary scope
    body: >-
      The retained sources define Reve more narrowly than a broad "creative AI" or general
      productivity market. Official surfaces describe the company as a creative tooling startup
      and frame the product around image creation, editing, remixing, and controllable
      workflows rather than a general multimodal assistant. Independent profiles reinforce that
      positioning: Grokipedia and Neuronfeed both emphasize prompt adherence, text rendering,
      and drag-and-drop or layout-aware control as the product's distinguishing features, while
      third-party commentary repeatedly places Reve inside the crowded text-to-image category.
      That supports treating the directly evidenced market boundary as AI image generation and
      editing for design-heavy workflows. It does not support extending the chapter's market
      definition to broader creative-software spend, general marketing automation, or video-
      first tooling without additional evidence.
    claimRefs: [CM001, CM005, CM006, CM015]
    tableRefs: [TM001]
  - id: sizing-lens
    title: Evidence-constrained sizing lens
    body: >-
      This source pool does not contain a credible public TAM, SAM, or SOM estimate from an
      analyst report, filing, trade association, or government dataset, so a top-down market-
      size headline would be speculative. The defensible alternative is a workflow lens: the
      official launch post and independent writeups consistently describe a product aimed at
      repeated creation, editing, remixing, and direct manipulation of images, while TrilogyAI
      supplies the only concrete economic signal in the retained pool by translating Reve's API
      credits into an implied base image price. That makes the usable sizing frame narrower but
      still relevant to valuation: buyers who iterate through many design variants care about
      controllability, throughput, and cost per accepted asset, not just abstract category
      breadth. The missing piece is clean public evidence on how much of that workflow volume
      Reve actually serves today, especially across enterprise, API, and web-app use cases.
    claimRefs: [CM003, CM004, CM010, CM011, CM016, CM017]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyer, user, and workflow fit
    body: >-
      The clearest buyer and user signals point to professional creators rather than a mass
      casual-consumer audience. The official blog introduces the product as a bundled creator,
      editor, assistant, and API surface; Grokipedia highlights film and design workflows;
      Neuronfeed explicitly names designers, marketers, and creative professionals; and
      TrilogyAI frames the product around ads, posters, ecommerce variants, educational
      graphics, and campaign concepts. Those references suggest a practical adoption path in
      which end users are designers, marketers, and creative operators, while budget owners can
      sit in creative, brand, growth, or product teams depending on whether the purchase is app
      seats or programmatic API usage. What remains unproven is the enterprise mix: the pool
      does not disclose contract sizes, customer concentration, or whether API demand is led by
      internal teams, agencies, or software platforms.
    claimRefs: [CM003, CM005, CM007, CM010, CM015, CM017]
    tableRefs: [TM003]
  - id: adoption-drivers-and-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      The main adoption drivers in this evidence set are controllability and production
      economics. Official and third-party sources repeatedly emphasize prompt fidelity, legible
      in-image text, direct manipulation, layout-aware editing, and API-enabled workflows, all
      of which matter more in production use cases than in one-off consumer experimentation.
      TrilogyAI strengthens that case by arguing that low unit pricing can matter when teams
      generate, edit, and remix assets at volume. The constraints are equally clear. CrackTheDeck
      describes a crowded category with large incumbents and low switching costs, while the CJ AI
      Marketing piece records a 2026 API shutdown and management's shift away from creative tools.
      Together, those sources suggest that Reve's valuation case depends less on broad AI-image
      market enthusiasm and more on whether the company can convert workflow-specific product
      strengths into durable, repeatable usage without the continuity shocks already visible in
      the retained evidence.
    claimRefs: [CM008, CM009, CM010, CM013, CM014, CM017, CM018]
