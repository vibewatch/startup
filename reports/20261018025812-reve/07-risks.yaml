      - ["Generated-output defects", "Medium", "Medium", "Close inspection recommended by a product archive", "Medium", "Measured defect rates, human-QA controls, and customer remediation history."]
    notes: "The shutdown likelihoods are conditional because the only retained source for the dates is competitor-issued; all ratings are analyst judgments, and no recorded incident list was available in the assigned pool."
