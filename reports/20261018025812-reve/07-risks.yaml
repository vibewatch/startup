    notes: "Counterparty and concentration descriptions preserve the issuer limits of the source pool; the OpenAI relationship and team transition are competitor-reported and uncorroborated here."
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR005", "CR006", "CR009", "CR010", "CR012", "CR016"]
