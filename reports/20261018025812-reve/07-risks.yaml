slug: "reve"
runDate: "2026-10-18"
company:
  name: "Reve"
chapter:
  number: 7
  title: "Risks"
  summary: "The clearest current risk signal is a competitor-issued report that Reve discontinued its API and wound down image generation during August-October 2026; because the assigned pool contains no primary shutdown notice, that timeline remains low-confidence but diligence-critical. Public materials also point to beta-era product surfaces, a small team, closed-source technology, and limited governance disclosure, leaving continuity, control, and financial durability as the principal residual risks."
sections:
  - id: "continuity-and-execution"
    title: "Service continuity is the most concrete near-term risk"
    body: >-
      Recraft, a direct competitor, reports that Reve discontinued its API on
      August 14, stopped new subscriptions on September 17, ended image
      generation on September 27, and preserved login and library export only
      through October 31, 2026. The same source says September payments for
      active plans would be refunded. These dates are specific and recent, but
      the issuer has a commercial interest in migration and the assigned pool
      contains no primary Reve shutdown notice, so each remains a
      low-confidence third-party report rather than a verified company event.
      Even with that caveat, simultaneous API and application withdrawal would
      be a high-impact continuity failure for integrated customers and makes
      primary notice, refund, export, and data-retention records immediate
      diligence requirements.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR016"]
    tableRefs: ["TR002"]
  - id: "governance-and-product-controls"
    title: "Governance and product-control risk remains disclosure-driven"
    body: >-
      Reve's retained official pages describe image creation, editing, a
      layout representation, and beta product surfaces; they do not provide a
      trust center, privacy assessment, security certification, incident
      record, training-data governance memo, or legal docket within this
      assigned evidence set. That is a limitation of the available pool, not
      proof that controls or incidents do not exist. Third-party descriptions
      add two relevant control constraints: the model is closed-source, and the
      visible API is prompt/image-driven rather than a hard layout-constraint
      interface. A product archive also warns that generated text, logos, and
      visual details require close inspection. Enterprise readiness therefore
      depends on private control evidence and human quality assurance that the
      public record does not yet establish.
    claimRefs: ["CR007", "CR008", "CR011", "CR012", "CR014", "CR015"]
    tableRefs: ["TR001"]
  - id: "people-and-platform-dependencies"
    title: "A small team and reported strategic shift increase dependency risk"
    body: >-
      Reve calls itself a small team, while an independent directory listed
      company size at 11 in July 2026. Recraft further reports that the product
      studio is moving away from creative tooling after an OpenAI investment
      and that members of Reve's research team joined OpenAI. Those strategic
      and personnel statements are not independently corroborated in this
      pool, but they identify a plausible concentration channel: a small
      organization supporting a closed model, web application, and API can be
      disproportionately affected by a research-team transition. The
      underwriting response is not to assume failure, but to require a current
      organization chart, retention plan, roadmap ownership, model-operating
      commitments, and customer-transition obligations.
    claimRefs: ["CR005", "CR006", "CR009", "CR010", "CR012", "CR016"]
    tableRefs: ["TR003"]
  - id: "residual-risk-and-kill-criteria"
    title: "Residual exposure stays high until primary operating evidence closes the gaps"
    body: >-
      Mitigation evidence is narrow. The reported export window and September
      refund would reduce immediate customer harm, but neither demonstrates
      continued service, enterprise support, or long-term product ownership.
      Product materials show a substantive technical concept, yet a July-to-
      August archive already described Reve 2.0 as historical after replacement
      by Reve 2.1, underscoring roadmap velocity rather than durability. Thesis-
      break triggers should therefore be measurable: primary confirmation that
      core services have ended without a funded successor plan, loss of the
      team required to operate the model, inability to produce privacy and
      security controls, or failure to document runway and customer-transition
      liabilities. Until management evidence addresses those tests, risk
      reduction would be assumed rather than demonstrated.
    claimRefs: ["CR003", "CR004", "CR005", "CR006", "CR011", "CR013", "CR016"]
    figureRefs: ["FR001"]
