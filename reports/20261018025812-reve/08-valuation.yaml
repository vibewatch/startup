    claimRefs: [CV001, CV007, CV009, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: Price is the missing decision variable
    body: >-
      Product quality can justify continued diligence, but it cannot justify an investment without
      verified ownership terms, financial performance, and a price that supports target returns.
    claimRefs: [CV013, CV015]
  - calloutType: assumption
    title: Low list price is not unit economics
    body: >-
      The reported base API price excludes add-ons and does not reveal retry rates, infrastructure
      cost, support burden, gross margin, or the number of generations required per accepted asset.
    claimRefs: [CV008, CV014]
