schemaVersion: "report-v2"
artifact: valuation
slug: reve
runDate: 2026-10-18
company:
  name: Reve
chapter:
  number: 8
  title: Valuation
  summary: >-
    Reve presents a credible product-differentiation case around controllable image creation,
    layout-aware editing, and low-cost iteration, but the assigned public evidence does not
    establish a current transaction price or the operating metrics needed to underwrite it.
    The resulting recommendation is research-more: require verified capitalization, retention,
    unit economics, and an entry price before converting product interest into an investment call.
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: >-
      The investable thesis is narrower than a generic bet on image generation. Reve says its
      product combines creation, remixing, object-level editing, an assistant, and an API, while
      its layout representation is intended to preserve spatial relationships and make individual
      elements manipulable. Independent product analysis adds an economic angle: one review
      calculated a roughly $0.0067 base API price per image before add-ons and argued that this
      matters for high-volume creative iteration. The anti-thesis is equally material. That same
      analysis said OpenAI's gpt-image-2 held the stronger public blind-vote quality signal as of
      June 2026, and another review cautioned that generated text, logos, and visual details still
      need inspection. Product differentiation is therefore plausible, but durable willingness
      to pay, accepted-output economics, and retention remain unproven.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV012, CV014]
    tableRefs: [TV002]
  - id: financing-and-entry
    title: Financing context and entry discipline
    body: >-
      The financing record available to this chapter is not sufficient for a conventional private
      valuation. Tracxn describes Reve as a seed-stage company and reports $2.1 million of total
      funding, but the assigned source set provides no term sheet, capitalization table, preference
      stack, debt schedule, audited revenue, gross margin, cash burn, or current cash balance.
      Headcount evidence also conflicts: Tracxn reports 84 employees as of September 2026, whereas
      a directory page last updated in July lists company size as 11. Those discrepancies make
      dilution, runway, and cost structure impossible to model responsibly. With no verified
      current valuation or entry terms, the stance is unknown rather than attractive or expensive;
      the decision should remain research-more with low confidence and high underwriting risk.
    claimRefs: [CV001, CV002, CV003, CV004, CV013, CV015]
    tableRefs: [TV001]
  - id: scenario-framework
    title: Bull, base, and bear cases
    body: >-
      Scenario analysis must remain milestone-based because a revenue multiple, cash-flow model,
      and ownership-return model cannot be calculated from the retained evidence. The bull case
      requires verified paid adoption, repeat usage, favorable accepted-output economics, and an
      entry price that leaves room for venture returns; product breadth and low stated API cost
      are signals, not substitutes for those proofs. The base case assumes product progress
      continues while financial disclosure remains limited, preserving optionality but not
      supporting a priced investment. The bear case combines rapid model replacement, stronger
      competitor quality signals, manual quality-control needs, and weak or unverified retention.
      Each case is intentionally qualitative until management supplies consistent cohort, cost,
      capitalization, and pricing evidence.
    claimRefs: [CV005, CV008, CV009, CV010, CV011, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: recommendation-and-diligence
    title: Recommendation, exit readiness, and thesis-break tests
    body: >-
      Reve should be monitored as a potentially differentiated creative-workflow platform, but the
      public record does not yet support a price or target return. Exit readiness is especially
      difficult to assess because the evidence is dominated by product pages, directories, and
      reviews rather than audited financials, durable enterprise contracts, or comparable
      transactions. The next decision gate should require a current cap table and preference
      waterfall; monthly revenue and gross-margin bridges; paid-cohort retention and concentration;
      inference and support cost per accepted asset; and customer references that separate trials
      from repeat production use. The thesis breaks if repeat usage is weak, accepted-output cost
      loses its apparent advantage after retries, dilution or preferences impair common-equity
      returns, or competing models erase Reve's control and workflow advantage.
    claimRefs: [CV005, CV006, CV008, CV009, CV010, CV011, CV013, CV015, CV016]
    figureRefs: [FV001]
