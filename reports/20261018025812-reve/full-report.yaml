      - number: '3.2'
        title: Reve's differentiation is controllable composition more than generic benchmark leadership
        blocks:
          - type: paragraph
            body: |-
              The strongest public differentiation is not that Reve is the undisputed best image model overall;
              it is that Reve keeps insisting on image structure as an editable intermediate layer. Its official
              product and API surfaces center on create/edit/remix actions, a drag-and-drop editor, and layout
              endpoints rather than a prompt-only generation loop. Third-party reviews echo that positioning by
              describing literal instruction following, spatial precision, and typography control as the product
              strengths versus Midjourney-style aesthetic interpretation. That matters for design, marketing,
              and production teams whose failure mode is not "the image looks ugly" but "the model moved the
              wrong object, broke the headline, or changed the approved composition."
            claimRefs:
              - CP001
              - CP002
