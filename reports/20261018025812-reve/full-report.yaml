  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a usage-metered API bridge, but realized revenue still depends on add-ons and low-retry
      execution.
    data:
      nodes:
        - label: Creative demand
          detail: Users generate, edit, and remix images through a self-serve product and beta API.
        - label: Metered API action
          detail: Independent analysis says create, edit, and remix are billed at 5 credits per image.
        - label: Credit package
          detail: The same analysis says 7,500 credits are sold for $10.
        - label: Base unit revenue
          detail: That package implies about $0.0067 per image before add-ons.
        - label: Realized bill
          detail: >-
            Upscaling, background removal, resizing, extended generation time, and retries can raise cost per accepted
            asset.
        - label: Gross-profit path
          detail: Margin depends on whether 4K generation and iterative editing stay efficient enough to avoid heavy rework.
    approximationNotes: >-
      This figure bridges only the public usage-pricing mechanics retained in the assigned pool; it is not a reported
      gross-margin waterfall or a substitute for customer-level billing data.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI011
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public sources describe Reve as a layered creative workflow rather than a single model call.
    data:
      layers:
        - label: Input brief and references
          detail: Prompts, uploaded images, and reference material seed the workflow.
          modules:
            - Text brief and follow-up instructions
            - Uploaded image references
            - Literal versus inspiration mode
            - PDF or audio guidance inputs
        - label: Layout representation
          detail: Reve says images are decomposed into a code-like intermediate representation before generation and editing.
          modules:
            - Structured spatial plan
            - Addressable regions and objects
            - Internal visual "code" for composition
        - label: Generation model
          detail: Independent coverage frames the live model family as native-4K with stronger text handling.
          modules:
            - Native 4K output
            - Dense and multilingual text rendering
            - Aesthetic and detail optimization
        - label: Direct-manipulation editor
          detail: Object-level edits are supposed to change selected elements without restarting the whole image.
          modules:
            - Move, resize, recolor, replace, or remove
            - Spotlight, drawing, and effects
            - Background removal and upscaling
        - label: Conversational workflow layer
          detail: The product combines chat-style refinement with assistant-style ideation and remixing.
          modules:
            - Natural-language edit loop
            - Creative assistant
            - Multi-image remix workflow
        - label: Access and governance layer
          detail: Public deployment depended on the browser app, plan settings, privacy controls, and a now-discontinued API.
          modules:
            - Web application
            - Paid-plan energy controls
            - Training opt-out and public visibility settings
            - API beta then discontinuation
    approximationNotes: >-
      Architecture reflects public product claims and independent roundups, not internal service diagrams or disclosed
      reliability telemetry.
    claimRefs:
      - CE002
      - CE004
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Reve's public journey runs from free creator trial into paid plans, team packaging, API usage, and partner-channel
      access, with major evidence gaps on retention and customer scale.
    data:
      items:
        - label: Discover
          detail: Free access and public web availability make initial trial easy.
          touchpoints:
            - reve.com free access
            - public web app listing
        - label: Validate output
          detail: Users test prompt fidelity, editing, and remixing in the browser.
          touchpoints:
            - create, edit, and design images
            - drag-and-drop editing and remix
        - label: Upgrade
          detail: Paid Lite and Pro tiers convert heavier creator usage.
          touchpoints:
            - monthly paid tiers
            - higher allowance and video features
        - label: Collaborate
          detail: Team workspace packaging points to a sales-assisted seat motion.
          touchpoints:
            - team workspaces
            - contact-sales team plan
        - label: Integrate
          detail: Developers and platforms can adopt via API or partner channels.
          touchpoints:
            - API beta and usage-based pricing
            - Oakgen marketplace access
        - label: Expand or stall
          detail: Retention proof is missing and buyer friction is visible.
          touchpoints:
            - training-default concern on free plan
            - opaque credit economics and no public cohort data
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU006
      - CU007
      - CU011
      - CU012
