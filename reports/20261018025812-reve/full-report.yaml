        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is narrow and founder-heavy. The clearest official naming comes from the
              company's launch post, which lists Christian Cantrell, Michaël Gharbi, Taesung Park, Jon Watte, and Mike
              Speiser as co-founders. Independent corroboration is strongest for Cantrell, whom DigitalToday identifies
              as co-founder and chief product officer with prior product leadership at Stability AI and Adobe. The
              broader governance read is less comfortable: Reve says some AI Research staff will join OpenAI, while
              Cantrell is the quoted public voice on the subsequent product pivot, implying meaningful concentration in
              a small public-facing leadership set. Board composition, broader executive depth, and formal decision
              rights are not disclosed in the reviewed sources, so later chapters should treat governance assumptions as
              open diligence work, not established fact.
