      - number: '4.2'
        title: Unit-economics proxies suggest a volume model, but cost discipline is unproven
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a specific economic pitch rather than a full unit-economics model. Reve
              emphasizes native 4K generation, layout-aware editing, and iterative create/edit/remix workflows, while
              independent analysis argues that the low base API price only matters if retry rates, add-on usage, and
              production stability stay under control. That implies a volume-driven model in which gross profit depends
              on compute efficiency and post-processing attach rates, not just on topline image generation counts. The
              same independent analysis also says Reve's API is broad enough for the core creative loop but less
              granular than OpenAI's engineering surface on masks, streaming, moderation, and compression, which matters
              because weaker control surfaces can translate into more retries or more manual correction cost in
              production.
