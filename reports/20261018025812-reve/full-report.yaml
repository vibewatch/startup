              - CM017
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The main adoption drivers in this evidence set are controllability and production economics. Official and
              third-party sources repeatedly emphasize prompt fidelity, legible in-image text, direct manipulation,
              layout-aware editing, and API-enabled workflows, all of which matter more in production use cases than in
              one-off consumer experimentation. TrilogyAI strengthens that case by arguing that low unit pricing can
              matter when teams generate, edit, and remix assets at volume. The constraints are equally clear.
              CrackTheDeck describes a crowded category with large incumbents and low switching costs, while the CJ AI
              Marketing piece records a 2026 API shutdown and management's shift away from creative tools. Together,
              those sources suggest that Reve's valuation case depends less on broad AI-image market enthusiasm and more
              on whether the company can convert workflow-specific product strengths into durable, repeatable usage
              without the continuity shocks already visible in the retained evidence.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
              - CM017
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans direct design tools, generalist incumbents, and status-quo workflows
        blocks:
          - type: paragraph
            body: |-
              The relevant landscape is broader than "other text-to-image startups." Reve is trying to sell a
              workflow that combines image generation, iterative editing, remixing, and API access around a
              layout-native representation. That puts its direct comparison set against design-oriented models
              such as Ideogram, but also against incumbent image platforms like OpenAI and Google, plus
              Midjourney as the style-led community default. The substitute category is still large as well:
              teams can approximate the same buyer job by pairing a general-purpose image API with their own
              editing, approval, and prompt-governance layer, which means Reve must beat both model quality and
              workflow friction rather than just ranking well on a single benchmark.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP014
