  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidentiary scope
        blocks:
          - type: paragraph
            body: >-
              The retained sources define Reve more narrowly than a broad "creative AI" or general productivity market.
              Official surfaces describe the company as a creative tooling startup and frame the product around image
              creation, editing, remixing, and controllable workflows rather than a general multimodal assistant.
              Independent profiles reinforce that positioning: Grokipedia and Neuronfeed both emphasize prompt
              adherence, text rendering, and drag-and-drop or layout-aware control as the product's distinguishing
              features, while third-party commentary repeatedly places Reve inside the crowded text-to-image category.
              That supports treating the directly evidenced market boundary as AI image generation and editing for
              design-heavy workflows. It does not support extending the chapter's market definition to broader
              creative-software spend, general marketing automation, or video- first tooling without additional
              evidence.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM007
              - CM010
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing lens
        blocks:
          - type: paragraph
            body: >-
              This source pool does not contain a credible public TAM, SAM, or SOM estimate from an analyst report,
              filing, trade association, or government dataset, so a top-down market- size headline would be
              speculative. The defensible alternative is a workflow lens: the official launch post and independent
              writeups consistently describe a product aimed at repeated creation, editing, remixing, and direct
              manipulation of images, while TrilogyAI supplies the only concrete economic signal in the retained pool by
              translating Reve's API credits into an implied base image price. That makes the usable sizing frame
              narrower but still relevant to valuation: buyers who iterate through many design variants care about
              controllability, throughput, and cost per accepted asset, not just abstract category breadth. The missing
              piece is clean public evidence on how much of that workflow volume Reve actually serves today, especially
              across enterprise, API, and web-app use cases.
            claimRefs:
