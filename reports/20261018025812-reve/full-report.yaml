      - number: '4.3'
        title: Financing visibility is better than cash visibility
        blocks:
          - type: paragraph
            body: >-
              The latest capital datapoint in the assigned pool comes from Forge's private-market company page, which
              lists a $3.9 billion post-money valuation, $1.62 billion total funding, and July 27, 2026 Series C-2 and
              Series C-1 rounds. That is directionally useful because it indicates the company has raised significant
              external capital recently, but it is still an incomplete capital-adequacy answer. The same source
              explicitly warns that its price and private-company metrics may rely on limited inputs and are not
              independently audited, and none of the retained sources disclose cash on hand, burn, runway, debt
              obligations, or covenant structure. In other words, public financing visibility has improved faster than
              liquidity visibility, so the chapter can describe funding dependence only as an unresolved underwriting
              gap rather than a solved capital-risk question.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Reve's public financial case is currently a commercial architecture story, not a disclosed
              operating-results story. The company appears to be selling controllable high-resolution image generation
              through both product and API surfaces, and the visible list economics are aggressive enough to support
              high-volume experimentation if compute and retry behavior are efficient. What is still missing is the
              evidence that matters for underwriting: revenue mix, realized pricing, customer concentration, gross
              margin, cohort retention, CAC, payback, cash, and runway. Until those numbers are produced in diligence,
              the prudent view is that revenue quality, margin path, and capital sufficiency remain open questions
              rather than investable facts.
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI011
              - CI013
              - CI014
