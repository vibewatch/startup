        title: Exhibits
        blocks:
          - type: callout
            title: Public economics are visible only at the top of the funnel
            body: >-
              The assigned evidence is detailed enough to describe how a create/edit/remix job can be monetized, but not
              enough to show realized price, gross profit, or retention after that job lands.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI013
          - type: callout
            title: Capital adequacy is still an underwriting blocker
            body: >-
              A current valuation and funding headline does not answer cash-on-hand, burn, runway, or debt exposure, and
              Forge explicitly qualifies the reliability of its private-company datapoints.
            calloutType: risk
            claimRefs:
              - CI009
