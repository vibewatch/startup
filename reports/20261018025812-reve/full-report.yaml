  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Reve is not positioned as a one-shot image model. Across its app, about page, and launch post, the company
              describes a browser workspace that lets users create, edit, remix, and design images, then refine them
              with natural-language commands and a drag-and-drop editor. The launch package is broader than a single
              model endpoint: management presented an image creator/remixer, a beta direct-manipulation editor, a
              creative assistant, and a beta API as one bundled product. Independent profiles broadly agree with that
              framing, describing the live product as a native-4K creative workspace with chat, references, and
              layout-aware editing. For diligence, the key question is which of those surfaces were durable products
              versus launch-era wrappers around a still-moving model stack.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
