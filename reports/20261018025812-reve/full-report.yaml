              - CE011
      - number: '5.2'
        title: Architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              Reve's main technical differentiator is its claim that images are decomposed into a code-like "layout
              representation" before generation and editing. In the official launch narrative, that intermediate
              representation is what makes complex spatial relationships, conversational revisions, and object-level
              direct manipulation possible without throwing away the whole composition. Third-party coverage reinforces
              the same theme, describing Reve 2.x as a layout-aware, native-4K system with stronger multilingual text
              rendering and explicit support for literal or inspirational references. That combination matters because
              it shifts the value proposition from prompt artistry toward structured creative workflow control. The
              independent proof point is still imperfect: benchmark rank and product-directory summaries validate
              attention and feature framing, but they do not prove repeatable production quality or enterprise
              reliability.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
