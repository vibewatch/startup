  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Visible customer entry points are creator-led, with team and API upsell paths
        blocks:
          - type: paragraph
            body: >-
              The strongest public customer evidence is not a list of reference accounts; it is the shape of the product
              surfaces Reve has made available. Official pages show a browser-based experience for creating, editing,
              and designing images, while the launch post describes the product as four bundled surfaces: image
              creation/remixing, drag-and-drop editing, a creative assistant, and an API. Third-party reviews add
              pricing context that suggests a ladder from free experimentation to paid creator plans, team workspaces,
              and usage-based API access. That mix points to a bottom-up creator motion first, with higher-value
              expansion paths for teams and developers, rather than a customer base centered on already-disclosed
              enterprise accounts.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU011
              - CU012
      - number: '6.2'
        title: Public adoption proof exists, but it is mostly packaging and channel evidence
        blocks:
          - type: paragraph
            body: >-
              Reve's public proof of adoption is stronger on access and packaging than on measured deployment.
              Independent reviews show a free tier, paid plans, and an API surface; Oakgen distributes two Reve variants
              without requiring a separate Reve subscription; and public directories still describe the product as a web
              application that creators can try directly. Those are meaningful adoption surfaces because they show
              actual paths to usage and monetization. They do not, however, establish named production rollouts,
              customer outcomes, or account scale. The most supportable conclusion is that Reve has multiple reachable
              customer surfaces, while its public proof of customer depth remains thin.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU009
              - CU011
              - CU012
      - number: '6.3'
        title: Durability, concentration, and procurement quality remain open diligence items
        blocks:
          - type: paragraph
            body: >-
              The chapter's biggest weakness is durability evidence. None of the retained sources disclose customer
              count, paid conversion, NRR, GRR, churn, renewal rates, contract length, or top-customer concentration.
              The visible frictions are also more relevant for serious buyers than casual testers: AI Deck notes that
              free-plan output is used for model training by default and that the credit system is hard to interpret,
              while Reve's terms add a mandatory informal dispute-resolution step before arbitration. Those details do
              not disprove adoption, but they make it harder to underwrite long-term account quality, enterprise
              procurement readiness, or concentration risk from public evidence alone.
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple entry points exist even without named logos
            body: >-
              Reve already exposes a credible acquisition stack — free web use, paid creator tiers, team packaging, API
              access, and at least one partner-channel listing — so the customer question is depth and durability, not
              whether the product can be reached by real users.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU007
          - type: callout
            title: The public evidence base still cannot underwrite customer durability
            body: >-
              The retained sources never disclose named reference customers, customer counts, NRR, churn, concentration,
              or contract length, and the visible free-plan training default plus opaque credit economics add
              procurement friction for serious buyers.
            calloutType: risk
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Service continuity is the most concrete near-term risk
        blocks:
          - type: paragraph
            body: >-
              Recraft, a direct competitor, reports that Reve discontinued its API on August 14, stopped new
              subscriptions on September 17, ended image generation on September 27, and preserved login and library
              export only through October 31, 2026. The same source says September payments for active plans would be
              refunded. These dates are specific and recent, but the issuer has a commercial interest in migration and
              the assigned pool contains no primary Reve shutdown notice, so each remains a low-confidence third-party
              report rather than a verified company event. Even with that caveat, simultaneous API and application
              withdrawal would be a high-impact continuity failure for integrated customers and makes primary notice,
              refund, export, and data-retention records immediate diligence requirements.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR014
              - CR016
      - number: '7.2'
        title: Governance and product-control risk remains disclosure-driven
        blocks:
          - type: paragraph
            body: >-
              Reve's retained official pages describe image creation, editing, a layout representation, and beta product
              surfaces; they do not provide a trust center, privacy assessment, security certification, incident record,
              training-data governance memo, or legal docket within this assigned evidence set. That is a limitation of
              the available pool, not proof that controls or incidents do not exist. Third-party descriptions add two
              relevant control constraints: the model is closed-source, and the visible API is prompt/image-driven
              rather than a hard layout-constraint interface. A product archive also warns that generated text, logos,
              and visual details require close inspection. Enterprise readiness therefore depends on private control
              evidence and human quality assurance that the public record does not yet establish.
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: A small team and reported strategic shift increase dependency risk
        blocks:
          - type: paragraph
            body: >-
              Reve calls itself a small team, while an independent directory listed company size at 11 in July 2026.
              Recraft further reports that the product studio is moving away from creative tooling after an OpenAI
              investment and that members of Reve's research team joined OpenAI. Those strategic and personnel
              statements are not independently corroborated in this pool, but they identify a plausible concentration
              channel: a small organization supporting a closed model, web application, and API can be
              disproportionately affected by a research-team transition. The underwriting response is not to assume
              failure, but to require a current organization chart, retention plan, roadmap ownership, model-operating
              commitments, and customer-transition obligations.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR012
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR012
              - CR016
      - number: '7.4'
        title: Residual exposure stays high until primary operating evidence closes the gaps
        blocks:
          - type: paragraph
            body: >-
              Mitigation evidence is narrow. The reported export window and September refund would reduce immediate
              customer harm, but neither demonstrates continued service, enterprise support, or long-term product
              ownership. Product materials show a substantive technical concept, yet a July-to- August archive already
              described Reve 2.0 as historical after replacement by Reve 2.1, underscoring roadmap velocity rather than
              durability. Thesis- break triggers should therefore be measurable: primary confirmation that core services
              have ended without a funded successor plan, loss of the team required to operate the model, inability to
              produce privacy and security controls, or failure to document runway and customer-transition liabilities.
              Until management evidence addresses those tests, risk reduction would be assumed rather than demonstrated.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary shutdown evidence is the gating diligence item
            body: >-
              The dates are specific enough to act on but come from a competitor; service notices, customer
              communications, refund records, and current access tests must confirm or rebut them.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Do not underwrite risk reduction from marketing pages
            body: >-
              Require control documents, current staffing, runway, and customer-transition liabilities before lowering
              the continuity or governance risk assessment.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is narrower than a generic bet on image generation. Reve says its product combines
              creation, remixing, object-level editing, an assistant, and an API, while its layout representation is
              intended to preserve spatial relationships and make individual elements manipulable. Independent product
              analysis adds an economic angle: one review calculated a roughly $0.0067 base API price per image before
              add-ons and argued that this matters for high-volume creative iteration. The anti-thesis is equally
              material. That same analysis said OpenAI's gpt-image-2 held the stronger public blind-vote quality signal
              as of June 2026, and another review cautioned that generated text, logos, and visual details still need
              inspection. Product differentiation is therefore plausible, but durable willingness to pay,
              accepted-output economics, and retention remain unproven.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record available to this chapter is not sufficient for a conventional private valuation.
              Tracxn describes Reve as a seed-stage company and reports $2.1 million of total funding, but the assigned
              source set provides no term sheet, capitalization table, preference stack, debt schedule, audited revenue,
              gross margin, cash burn, or current cash balance. Headcount evidence also conflicts: Tracxn reports 84
              employees as of September 2026, whereas a directory page last updated in July lists company size as 11.
              Those discrepancies make dilution, runway, and cost structure impossible to model responsibly. With no
              verified current valuation or entry terms, the stance is unknown rather than attractive or expensive; the
              decision should remain research-more with low confidence and high underwriting risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV015
      - number: '8.3'
        title: Bull, base, and bear cases
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain milestone-based because a revenue multiple, cash-flow model, and
              ownership-return model cannot be calculated from the retained evidence. The bull case requires verified
              paid adoption, repeat usage, favorable accepted-output economics, and an entry price that leaves room for
              venture returns; product breadth and low stated API cost are signals, not substitutes for those proofs.
              The base case assumes product progress continues while financial disclosure remains limited, preserving
              optionality but not supporting a priced investment. The bear case combines rapid model replacement,
              stronger competitor quality signals, manual quality-control needs, and weak or unverified retention. Each
              case is intentionally qualitative until management supplies consistent cohort, cost, capitalization, and
              pricing evidence.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation, exit readiness, and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              Reve should be monitored as a potentially differentiated creative-workflow platform, but the public record
              does not yet support a price or target return. Exit readiness is especially difficult to assess because
              the evidence is dominated by product pages, directories, and reviews rather than audited financials,
              durable enterprise contracts, or comparable transactions. The next decision gate should require a current
              cap table and preference waterfall; monthly revenue and gross-margin bridges; paid-cohort retention and
              concentration; inference and support cost per accepted asset; and customer references that separate trials
              from repeat production use. The thesis breaks if repeat usage is weak, accepted-output cost loses its
              apparent advantage after retries, dilution or preferences impair common-equity returns, or competing
              models erase Reve's control and workflow advantage.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the missing decision variable
            body: >-
              Product quality can justify continued diligence, but it cannot justify an investment without verified
              ownership terms, financial performance, and a price that supports target returns.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV015
          - type: callout
            title: Low list price is not unit economics
            body: >-
              The reported base API price excludes add-ons and does not reveal retry rates, infrastructure cost, support
              burden, gross margin, or the number of generations required per accepted asset.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV014
