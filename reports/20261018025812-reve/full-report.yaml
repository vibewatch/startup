      - number: '1.3'
        title: Funding, stakeholder map, and current transition
        blocks:
          - type: paragraph
            body: >-
              The most material 2026 update is strategic rather than financially transparent. Reve disclosed a new
              OpenAI investment on July 27, 2026, said some research staff would move to OpenAI, and still maintained
              that the company would remain independent. By September, DigitalToday reported that new sign-ups were
              already suspended and the web image-generation product would shut down on Sept. 27, with customer download
              and refund obligations stretching into late October. That makes existing-user continuity and roadmap
              credibility immediate diligence items. Funding history remains noisy: Neuronfeed names Basis Set Ventures
              and Top Harvest Capital as backers, There's An AI For That lists one undisclosed $30 million round, and
              CrackTheDeck claims unicorn status with $390 million raised. Until management or lead investors reconcile
              those numbers, the capital structure and valuation baseline should be treated as unverified.
