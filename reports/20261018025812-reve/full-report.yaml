      - number: '2.3'
        title: Buyer, user, and workflow fit
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer and user signals point to professional creators rather than a mass casual-consumer
              audience. The official blog introduces the product as a bundled creator, editor, assistant, and API
              surface; Grokipedia highlights film and design workflows; Neuronfeed explicitly names designers,
              marketers, and creative professionals; and TrilogyAI frames the product around ads, posters, ecommerce
              variants, educational graphics, and campaign concepts. Those references suggest a practical adoption path
              in which end users are designers, marketers, and creative operators, while budget owners can sit in
              creative, brand, growth, or product teams depending on whether the purchase is app seats or programmatic
              API usage. What remains unproven is the enterprise mix: the pool does not disclose contract sizes,
              customer concentration, or whether API demand is led by internal teams, agencies, or software platforms.
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM010
              - CM015
