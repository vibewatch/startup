  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Public revenue surface is visible, but realized monetization is not
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows that Reve has two monetization surfaces in market today: a self-serve image
              product and a beta API that lets third parties create, edit, and remix images inside their own workflows.
              That is enough to describe the revenue mechanism at a high level, but not enough to underwrite revenue
              quality. Independent coverage of the current product stack says Reve 2.0 no longer has separate pricing
              because Reve 2.1 replaced it, so investors should not confuse historical model positioning with a durable
              current rate card. The cleanest public list-like price point in the assigned pool comes from independent
              analysis of the API credit system: create, edit, and remix cost 5 credits per image, and 7,500 credits for
              $10 implies roughly $0.0067 per image before add-ons. That is a useful anchor for top-of- funnel
              monetization, but it is not realized revenue, margin, or net retention.
            claimRefs:
