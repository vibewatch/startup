      - number: '5.3'
        title: Maturity, deployment, and dependency posture
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests a product surface that advanced quickly but remained operationally fluid. Reve
              itself labeled the drag-and-drop editor and API as beta at launch, while third-party product roundups
              describe the app as an active browser workspace but note that the API had already been discontinued by
              mid-August 2026. A later competitor teardown goes further, saying the consumer web product stopped new
              sign-ups and image creation in September and was left open only long enough for users to download prior
              work by October 31. Even if those shutdown milestones are accurate, they do not erase the technical merit
              of the layout-aware editing approach; they do show that deployment and integration continuity were weak
              enough to become a core diligence topic. The underwriting issue is therefore product permanence, not just
              model quality.
            claimRefs:
              - CE003
              - CE006
              - CE011
              - CE012
          - type: table
