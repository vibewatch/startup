      The retained evidence narrows Reve's addressable slice qualitatively from broad AI image generation to
      controllable, iteration-heavy creative workflows.
    data:
      items:
        - label: Broad AI image generation
          value: Crowded category
          detail: Competes inside a crowded text-to-image field with established incumbents.
        - label: Professional creative workflows
          value: Designers marketers film teams
          detail: Multiple sources point to professional creator use cases rather than general consumer breadth.
        - label: Prompt fidelity and typography
          value: Precision matters
          detail: Differentiation repeatedly centers on legible text, adherence, and refined outputs.
        - label: Layout-aware editing
          value: Structured control
          detail: Direct manipulation and structured layouts matter when the user must preserve approved elements.
        - label: Iteration-heavy production
          value: API and volume economics
          detail: Unit economics become material when teams create, edit, and remix many variants.
        - label: Evidence-backed Reve beachhead
          value: Web app plus beta API
          detail: The strongest support is for creator and design workflows served through the app and API surfaces.
    approximationNotes: >-
      No retained source provides a reliable TAM/SAM/SOM dollar stack, so this pyramid is a qualitative narrowing of the
      served market based on repeated workflow descriptions rather than a quantitative sizing hierarchy.
    claimRefs:
      - CM003
      - CM005
      - CM008
      - CM010
      - CM015
      - CM017
