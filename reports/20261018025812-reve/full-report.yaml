      - number: '1.1'
        title: Identity and product baseline
        blocks:
          - type: paragraph
            body: >-
              The public evidence establishes Reve's identity and product shape more clearly than its commercial scale.
              Official materials and an independent March 2025 launch article place Reve in Palo Alto and describe it as
              a creative-tooling company built around controllable image creation, editing, remixing, and eventually
              API-assisted workflows rather than a single benchmark demo. The visible product cadence is also coherent:
              Reve Image 1.0 was the first release in March 2025, Reve 2.0 added native 4K layout-aware editing in June
              2026, and third-party trackers describe Reve 2.1 as the active release from July 2026 onward. What is
              still missing is the commercial layer: public sources in this packet do not substantiate revenue, customer
              counts, or current monetization after the late-2026 product reset.
