              - CE011
      - number: '5.4'
        title: Trust, privacy, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Reve's privacy posture is more concrete than its public reliability posture. The privacy policy confirms
              that the service covers image generation, editing, discovery, and curation, and says Reve may use
              third-party large language models or other AI systems to operate prompt expansion or chat-based features.
              The same policy says personal information and other content may be used to train and improve the service,
              and that generated or uploaded content can be visible to other users or the public depending on
              subscription settings. Independent product reviews echo the same warning for free plans and note that paid
              tiers require explicit training opt-outs. That is enough to flag enterprise confidentiality and governance
              risk, but not enough to clear diligence on security controls, uptime, certifications, or incident
              handling. The sparse official product surface also means most technical detail still comes from a launch
              essay and third-party summaries rather than durable documentation.
            claimRefs:
              - CE009
              - CE010
              - CE013
