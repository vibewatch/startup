      - number: '3.3'
        title: Low base API economics help, but public pricing signals are volatile and buyer proof is thin
        blocks:
          - type: paragraph
            body: |-
              Pricing is where Reve looks most strategically aggressive, because independent commentary pegs its
              base API math well below Google's published image rates and below OpenAI's medium- and
              high-quality image examples. That is a meaningful wedge if the product really reduces retries in
              production workflows. The harder part is underwriting durability from public evidence alone. Public
              pricing snapshots changed across 2026, shifting from one set of web subscription tiers to newer
              Starter/Standard/Premium or creative-energy framing as Reve 2.1 replaced 2.0. The same evidence
              set also lacks named enterprise references, renewal data, or migration case studies, so switching
              costs still look more architectural than commercially proven.
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP012
