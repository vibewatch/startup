  title: Trust, privacy, and compliance controls
  columns:
  - Control / certification
  - Public status
  - Scope
  - Gap
  rows:
  - - SOC2 Type II
    - Claimed on public surface
    - Enterprise-grade security posture
    - Need report period, auditor, and carve-outs
  - - ISO 27001
    - Claimed on public surface
    - Information-security management
    - Need certificate number and scope
  - - GDPR
    - Claimed on public surface
    - Privacy and data-processing posture
    - Need DPA and subprocessors list
  - - Payment security
    - Third-party gateways process payment details
    - Payment data handling
    - Need gateway names and PCI responsibility matrix
  - - Training-data consent
    - Concept art not used for model training without consent
    - Uploaded image-to-3D inputs
    - Need retention window and deletion audit evidence
  notes: Controls are first-party statements unless a certification artifact is later obtained.
