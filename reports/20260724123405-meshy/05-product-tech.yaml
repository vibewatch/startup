  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture-gap
    missingEvidence: Model architecture, training-data composition, evaluation sets, and repeatability metrics for Meshy foundation
      models.
    whyItMatters: Without architecture and benchmark disclosure, diligence cannot separate durable model advantage from fast
      product packaging.
    diligencePath: Request technical whitepaper, benchmark suite, red-team results, and model-card style disclosures under
      NDA.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: benchmark
    missingEvidence: Independent Meshy-versus-Rodin or Meshy-versus-Tripo geometry and topology benchmark with identical prompts.
    whyItMatters: Competitive differentiation depends on output quality, not just generation speed or format coverage.
    diligencePath: Run controlled prompt/image benchmark across peers and score topology cleanliness, material quality, and
      artist cleanup time.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: security
    missingEvidence: SOC2 Type II report, ISO 27001 certificate scope, GDPR DPA, subprocessors list, and retention/deletion
      controls.
    whyItMatters: Enterprise buyers will require scope and auditor evidence rather than certification badges or marketing
      claims.
    diligencePath: Collect certification artifacts, security questionnaire, DPA, subprocessors, and recent penetration-test
      summary.
    relatedQuestionRefs:
    - QE016
    - QE023
    relatedTableRefs:
