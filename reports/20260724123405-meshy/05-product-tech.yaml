- id: TE004
  title: Performance, quality, and limitation signals
  columns:
  - Signal
  - Public value / direction
  - Source stance
  - Underwriting implication
  rows:
  - - Text-to-3D speed
    - Under one minute claimed for fully textured models
    - Confirming official
    - Strong prototyping speed claim, but needs independent timing
  - - Image-to-3D speed
    - Less than one minute claimed from a single image
    - Confirming official
    - Good ideation workflow, but hard cases remain unbenchmarked
  - - Auto Split speed
    - About 40 seconds for split result
    - Confirming official
    - Useful print-prep automation if slicer validation holds
  - - Animation speed
    - Minutes rather than days; 500-plus motions
    - Confirming official
    - Character prototyping advantage over manual rigging
  - - Print readiness
    - Most generated models are not print-ready as generated
    - Adverse independent
    - Auto Split is a needed compensating control, not proof of clean source geometry
  - - Credit retry friction
    - Retries may reproduce the same errors and waste credits
    - Adverse independent
    - Quality failures can become economic friction at scale
  notes: Independent adverse rows are retained to prevent over-reading first-party speed and quality claims.
