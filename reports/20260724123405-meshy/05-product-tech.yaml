- id: TE001
  title: Product capability catalog
  columns:
  - Capability
  - Primary user/job
  - Status/maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Text-to-3D
    - Creators describing an asset in natural language
    - Live product and API surface
    - Fast prompt-to-preview workflow
    - Need third-party fidelity and repeatability benchmark
  - - Image-to-3D
    - Artists converting concept art or reference images
    - Live product and API surface
    - Single-image path plus multi-image API variant
    - Need consistency across hard viewpoints and occluded geometry
  - - AI Texturing
    - Game and content teams texturing existing meshes
    - Live product and API surface
    - PBR map support including metallic, roughness, and normal maps
    - Need material accuracy tests against authored Substance workflows
  - - Animation and auto-rigging
    - Character creators and game prototypers
    - Live feature and API surface
    - 500-plus motion library and programmatic animation outputs
    - Need deformation-quality evidence on non-standard characters
  - - Remesh / smart topology
    - Technical artists cleaning generated assets
    - Live API surface
    - Target face-count and smart-topology controls
    - Need proof of clean topology for production pipelines
  - - Meshy 3D Agent
    - Nontechnical users orchestrating multi-step 3D creation
    - Beta support surface
    - Chat workflow spanning ideation, concepts, and output
    - Need retention, task success, and boundary-condition evidence
  - - Auto Split
    - 3D-printing users preparing large or multicolor objects
    - Live help and blog surface
    - Part segmentation plus watertight caps for printing
    - Need slicer-level validation across materials and printers
  - - Meshy Labs
    - Game developers exploring AI-native gameplay
    - Announced at GDC 2026
    - Extends beyond assets into gameplay experiments
    - Need technical details and developer access model
  notes: Enumeration is based on official product, docs, help, and 2026 announcement pages; maturity is public-surface maturity,
    not private usage proof.
