company:
  name: Meshy
chapter:
  number: 5
  title: Product & Technology
  summary: Meshy offers a broad AI 3D asset stack across text/image generation, PBR texturing, remesh, rigging, animation,
    agentic creation, print preparation, APIs, and plugins. The product is strongest for rapid prototyping and developer integration,
    but production-readiness diligence must verify topology quality, independent benchmarks, security scope, and proprietary
    model details.
sections:
- id: product-surface-and-workflow
  title: Product surface and workflow fit
  body: 'Meshy’s product surface is best understood as a rapid 3D-asset creation workflow, not as a single model endpoint.
    The official pages and help center support a catalog that spans text-to-3D, image-to-3D, AI texturing, rigging and animation,
    remesh controls, Meshy 3D Agent, Auto Split for 3D printing, and API access. The strongest current fit is ideation and
    prototyping: a creator can start from a prompt or reference image, generate a preview in under a minute according to Meshy’s
    pages, refine or texture the result, then move it into game, DCC, web, AR, or print workflows. The diligence angle is
    therefore module-specific. Text and image generation look mature on public surfaces; Meshy Agent and Meshy Labs look more
    exploratory; Auto Split is a valuable compensating control for print workflows rather than proof that raw outputs are
    always clean.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE011
  - CE024
  - CE032
  - CE034
  tableRefs:
  - TE001
  figureRefs:
  - FE002
- id: architecture-api-and-pipeline
  title: Architecture, API, and generation pipeline
  body: 'Public evidence exposes a concrete operating pipeline while leaving the model internals proprietary. Meshy documents
    text-to-3D, image-to-3D, multi-image, retexture, remesh, rigging, animation, webhooks, balance, and pricing endpoints.
    The technical pattern is asynchronous: create generation or post-processing tasks, inspect outputs and task state, use
    webhooks for status updates, and monitor credit balance for operations. The product pipeline inferred from those docs
    is input → preview → refine → texture → remesh → rig or animate → export. The strongest technical controls visible in
    public are PBR-map support, smart-topology and face-count controls, and animation output formats. What is not public is
    equally important: Meshy does not disclose model architecture, training corpus composition, benchmark methodology, or
    repeatability statistics in the reviewed sources.'
  claimRefs:
  - CE006
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE022
  - CE023
  - CE038
  - CE040
  - CE042
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: formats-integrations-and-developer-surface
  title: Formats, integrations, and developer surface
  body: 'Meshy’s developer and integration surface is broader than a consumer-only generator. Export evidence covers common
    interchange formats including GLB, FBX, OBJ, STL, BLEND, and USDZ, while the animation API specifically returns GLB and
    FBX animation outputs and USDZ-related processed assets. Official sources also point to plugin or partner routes: Unity,
    ComfyUI, and a general plugin help surface. GitHub developer-signal is visible through Meshy MCP and 3D-agent repositories,
    which matters because agentic creation workflows are a logical extension of the product. The open question is not whether
    integration points exist; it is whether they are reliable, versioned, and adopted at production scale. Public sources
    do not yet provide uptime, package downloads, active developer counts, or enterprise SLA evidence.'
  claimRefs:
  - CE009
  - CE010
  - CE012
  - CE013
  - CE014
  - CE033
  - CE039
  tableRefs:
  - TE002
  figureRefs: []
- id: performance-quality-and-limitations
  title: Performance, quality, and limitations
  body: 'The quality case is a mix of strong first-party speed claims and meaningful independent caveats. Meshy claims sub-minute
    text-to-3D and image-to-3D workflows, roughly 40-second Auto Split results, and animation workflows that can move from
    upload to animated character in minutes. Those claims support a clear productivity thesis for prototyping. However, There’s
    An AI For That flags that most generated models are not print-ready as generated because they can exceed build plates,
    need color separation, or contain open mesh surfaces. Costbench separately reports credit-related frustration when retries
    reproduce the same errors. These adverse sources do not negate Meshy’s utility, but they shift the underwriting stance:
    generated assets should be treated as fast drafts requiring topology, printability, and material QA before production.'
  claimRefs:
  - CE003
  - CE004
  - CE008
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE041
  tableRefs:
  - TE004
  figureRefs:
  - FE003
- id: trust-security-roadmap-and-gaps
  title: Trust, security, roadmap, and gaps
  body: 'Meshy’s trust posture is directionally positive but not fully diligence-ready. The public surface claims SOC2 Type
    II, ISO 27001, and GDPR certifications; the help center says payment details are handled through third-party gateways
    rather than stored directly by Meshy; and another support article says concept-art uploads are not used for training without
    consent. Those are important controls for enterprise and creator adoption, especially when customers upload proprietary
    concepts. Roadmap momentum is also visible through Meshy 5, Meshy 6, Meshy 3D Agent, Auto Split, and Meshy Labs at GDC
    2026. The remaining gaps are specific: obtain certification artifacts and scope, status and incident history, deletion
    and retention policies, benchmarked output quality, and private architecture details before underwriting Meshy as a production-grade
    3D asset infrastructure layer.'
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE035
  - CE036
  - CE037
  - CE038
  - CE042
