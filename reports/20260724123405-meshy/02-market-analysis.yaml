chapter:
  number: 2
  title: Market Analysis
  summary: Meshy's core market is best defined as AI-generated 3D assets and workflows, not all 3D software or metaverse spend. Public evidence supports a 2026 direct market in the low-single-digit billions with larger adjacencies, but professional adoption depends on quality, rights, integration, and conversion from broad creator interest into paid production use.
sections:
- id: boundary-and-substitutes
  title: Market boundary and substitutes
  body: Meshy's relevant market is not the whole 3D software industry. The core boundary is AI-assisted generation of editable 3D assets from text, images, conversations, or API calls; it includes asset generation, texturing, remesh/topology, export, and developer integration when those capabilities replace manual asset creation. It excludes conventional DCC license spend when artists still model by hand in Maya, Blender, or Substance, although those tools remain the workflow context and substitute budget. It also excludes asset-store purchases unless a buyer is replacing stock models with generated custom assets. Adjacencies such as metaverse worlds, digital twins, 3D rendering, AR/VR commerce, and 3D printing matter because they consume 3D content, but they should be treated as demand pools rather than counted wholesale as Meshy's TAM. This boundary prevents double counting.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM005
  - CM006
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  tableRefs:
  - TM001
- id: multiple-sizing-lenses
  title: Multiple sizing lenses
  body: 'The direct top-down lens supports a multi-billion-dollar but still emerging category: the AI 3D assets estimate is about $3.23 billion in 2026 and roughly $9.4 billion by 2030, while the narrower AI 3D asset generation and texturing forecast reaches $12.84 billion by 2036. A gaming-specific SAM is more conservative, with generative AI in gaming estimated at $2.21 billion in 2026 and $5.09 billion in 2030. Broader metaverse, digital-twin, and 3D-rendering markets are useful ceilings and demand signals, not immediately addressable revenue. For diligence, the investable view is a range: low equals gaming-first adoption, base equals AI 3D asset software, and upside requires penetration of digital-twin, AR/VR, ecommerce, and printing workflows.'
