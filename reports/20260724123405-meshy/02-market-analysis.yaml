- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'Growth is driven by a real production pain point: games, VFX, ecommerce, digital twins, 3D printing, and AR/VR all need more 3D assets than scarce specialist labor can make cheaply. Meshy''s own claims emphasize dramatic time and cost compression, and independent AI 3D commentary describes the same shift from multi-day pipelines to minutes. However, the market is not de-risked. Professional buyers still care about topology, riggability, texture quality, IP provenance, tool integration, and asset governance. Gartner''s adverse AI-cycle view is a reminder that broad GenAI enthusiasm can cool when governance and reliability limits surface. Open-source 3D models, Blender, asset stores, and incumbent DCC suites also cap pricing power unless Meshy proves production-ready quality and distribution advantages.'
  claimRefs:
  - CM027
  - CM028
  - CM029
  - CM030
  - CM031
  - CM032
  - CM038
  - CM039
  - CM041
  tableRefs:
  - TM004
  figureRefs:
  - FM004
- id: sizing-gaps-and-diligence
  title: Sizing gaps and diligence implications
  body: 'The biggest market-analysis risk is false precision. Public analyst reports define categories differently: some include all generative AI for 3D assets, some include texturing, some focus on gaming, and others describe adjacent visualization, metaverse, or digital-twin pools. Meshy''s disclosed scale proves demand, but public sources do not break out paying customer count, conversion, enterprise penetration, churn, or revenue by vertical. Therefore the chapter preserves contradictory lenses rather than forcing one TAM number. Follow-up diligence should request cohort-level ARR by segment, API versus web revenue, enterprise pipeline deployments, paid conversion from registered users, customer acquisition cost by use case, and proof that generated assets survive professional production review without extensive manual rework. This is especially important because registered-user scale can coexist with low paid conversion, while enterprise API revenue can be material even with fewer
    accounts.'
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM036
  - CM037
