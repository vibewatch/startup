tables:
- id: TM001
  title: Market definition table
  columns:
  - Category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core AI 3D asset generation
    - Text/image/conversation-to-3D generation, texturing, topology, export, API usage
    - Manual-only DCC seats and unrelated 2D image generation
    - Creators, studios, developers, product teams
    - Direct Meshy revenue pool
  - - Traditional DCC tools
    - DCC plug-ins or AI features when tied to generation workflows
    - Base Maya/Blender/Substance licenses used only for manual modeling
    - Artists, studios, design departments
    - Substitute and integration surface
  - - Asset stores
    - Custom generated replacements for stock 3D assets
    - One-off stock-model purchases not displaced by generation
    - Indie developers, marketers, ecommerce teams
    - Status-quo substitute
  - - Gaming and VFX
    - AI-generated props, environments, textures, prototyping assets
    - Full game software or entertainment revenue
    - Studios, publishers, VFX producers
    - Near-term SAM anchor
  - - 3D printing / makers
    - Generated printable models, repair/splitting, STL export
    - Printer hardware and materials
    - Makers, hobbyists, printing brands
    - Adjacent adoption wedge
  - - Digital twins / AR-VR / ecommerce
    - 3D content creation for immersive visualization
    - Full simulation platforms, headsets, or commerce GMV
    - Manufacturers, retailers, spatial teams
    - Upside demand pool
  notes: Boundary table separates direct AI 3D generation revenue from adjacent demand pools and substitutes; it is not a market-size sum.
