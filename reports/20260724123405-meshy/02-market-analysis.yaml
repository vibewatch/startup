- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Time-to-asset compression
    - Driver
    - Now
    - Moves creation from specialist bottleneck toward self-serve workflows
    - Verify customer before/after labor hours
  - - Gaming and VFX content volume
    - Driver
    - Now to 2030
    - Supports gaming-first SAM and studio pipeline demand
    - Request revenue by game studio cohort
  - - API and plugin integration
    - Driver
    - Now
    - Can turn Meshy from a web tool into embedded infrastructure
    - Review API usage, uptime, and enterprise security controls
  - - Spatial computing, digital twins, ecommerce 3D
    - Driver
    - 2026+
    - Expands upside beyond games if assets are production-ready
    - Validate paid pilots outside games
  - - Quality/topology/rigging gap
    - Constraint
    - Now
    - Limits professional adoption when cleanup cost remains high
    - Run asset QA with pro artists
  - - IP provenance and governance
    - Constraint
    - Now
    - Enterprise buyers may delay deployment without rights clarity
    - Review training-data, indemnity, and moderation terms
  - - Incumbent DCC and asset stores
    - Constraint
    - Persistent
    - Limits pricing power and creates multi-homing
    - Benchmark against Maya/Blender/Substance/store workflow cost
  - - Open-source 3D models
    - Constraint
    - 2025-2026 onward
    - Commoditizes draft asset generation and pressures API pricing
    - Compare quality, license, and unit economics vs open models
  - - GenAI disillusionment / governance
    - Constraint
    - Current cycle
    - May slow buyer urgency if reliability disappoints
    - Ask for renewal, expansion, and production deployment evidence
  notes: Drivers and constraints combine market reports, official product evidence, and one adverse Gartner source; timing is qualitative.
