    - Move toward avoid
  - - Weak paid conversion
    - User growth rises but paid accounts stagnate
    - Freemium scale loses valuation relevance
    - Require price reset
  - - Margin drag
    - Inference or training cost prevents software-like margin
    - Exit multiple shifts toward lower SaaS/infra range
    - Underwrite bear case
  - - Moat erosion
    - Incumbent creative or AI platforms match workflow quality
    - Multiple compresses through competition
    - Delay or reduce entry price
  - - Preference overhang
    - Series B terms materially impair common or new-money upside
    - Return profile worsens despite company growth
    - Require cap-table terms
