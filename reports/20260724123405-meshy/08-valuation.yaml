- id: scenario-sensitivity
  title: Scenario and sensitivity analysis
  body: A scenario lens clarifies how much execution is embedded in the latest price. The bear case assumes ARR doubles to
    about $60 million but the exit multiple compresses to 12x as conversion or margin concerns surface; that outcome is worth
    roughly $0.7 billion and would make the Series B price look expensive. The base case assumes ARR reaches about $120 million
    and exits at 25x, yielding roughly $3.0 billion and a plausible venture return before dilution. The bull case requires
    Meshy to become the durable AI-3D workflow layer, reach about $250 million ARR, and preserve a 35x premium multiple, producing
    about $8.8 billion of value. These cases deliberately compress the multiple as revenue scales because today’s 50x depends
    on exceptional growth. The practical underwriting question is therefore not whether Meshy is good, but how much price
    discipline compensates for still-private economics.
  claimRefs:
  - CV036
  - CV037
  - CV038
  - CV039
  - CV045
  - CV046
  tableRefs:
  - TV003
  figureRefs:
  - FV001
  - FV003
- id: drivers-risks
  title: Valuation drivers and downside risks
  body: 'The positive valuation drivers are category scarcity, product breadth, usage scale, and a 2026 market that rewards
    AI growth. Meshy also benefits from the narrative that AI applications are moving into 3D workflows. The adverse drivers
    are equally important: a freemium funnel can create impressive registered-user and model-generation metrics without proportional
    paid retention; incumbents and big AI platforms can reduce differentiation; and the broader AI market remains vulnerable
    to hype-cycle resets. Skeptical valuation sources emphasize capital efficiency and profitability path, which are precisely
    the fields Meshy has not publicly disclosed. The key diligence ask is a revenue-quality bridge from free user to paid
    account to retained ARR, paired with workflow-level gross margin. Without that bridge, investors risk underwriting user-scale
    optics rather than economic durability.'
  claimRefs:
  - CV032
  - CV033
  - CV034
  - CV035
  - CV041
  - CV042
  - CV049
  tableRefs:
  - TV005
  figureRefs: []
- id: exit-readiness
  title: Exit path, liquidity, and final diligence asks
  body: 'Meshy’s exit path is plausible but not immediate on public evidence. A 2026 funding and exit market with many new
    unicorns and stronger IPO/M&A activity supports optionality, and strategic buyers in creative software or AI infrastructure
    have logical reasons to care about 3D asset generation. However, IPO readiness requires audited revenue quality, governance,
    retention, margin, and predictable enterprise expansion; acquisition readiness requires proof that Meshy owns a workflow
    layer rather than a replaceable model feature. The final diligence list should therefore focus on six items: revenue quality,
    gross margin, cap-table terms, enterprise traction, moat durability, and exit readiness. If those items validate, the
    current valuation can migrate from stretched to fair as ARR scales. If they disappoint, the same price becomes expensive
    because multiple compression would transmit directly into downside.'
  claimRefs:
  - CV017
  - CV018
  - CV029
  - CV030
