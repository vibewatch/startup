  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Liquidation preferences, option pool, pro-rata rights and other Series B terms are not public.
    whyItMatters: Terms determine whether a new investor can earn venture returns even if enterprise value increases.
    diligencePath: Review signed financing documents and pro-forma capitalization table under NDA.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Paid customer count, ARR cohort bridge, NRR, GRR and gross margin are not disclosed publicly.
    whyItMatters: These metrics determine whether user scale supports a premium ARR multiple.
    diligencePath: Request finance export, billing cohort analysis and customer-renewal data.
    relatedQuestionRefs:
    - QV023
    - QV025
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A full private-market comp set with disclosed ARR, valuation, preference terms and growth is unavailable
      publicly.
    whyItMatters: The comparable table is a sample and cannot prove a precise fair value multiple.
    diligencePath: Commission private-market data pull from PitchBook, Carta, Forge or direct investor marks.
    relatedQuestionRefs:
    - QV010
    relatedTableRefs:
    - TV004
