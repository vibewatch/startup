- id: TV006
  title: Final diligence asks
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Revenue quality
    - Paid customer count, NRR, GRR and ARR bridge
    - Validates whether 12M users monetize
    - Request cohort ARR waterfall
  - - Gross margin
    - Inference, training and cloud cost by workflow
    - Determines sustainable software multiple
    - Review cloud invoices and margin bridge
  - - Cap table
    - Liquidation preference, option pool and pro-rata rights
    - Determines entry price and return waterfall
    - Review financing documents
  - - Enterprise traction
    - Named enterprise logos, ACV and renewal behavior
    - Tests path to $100M+ ARR
    - Customer calls and contract sample
  - - Moat durability
    - Benchmark quality, latency and workflow lock-in versus peers
    - Determines exit multiple durability
    - Run blinded asset-quality benchmark
  - - Exit readiness
    - Audit readiness, revenue recognition and governance
    - Determines IPO or acquisition optionality
    - CFO diligence and buyer landscape review
  notes: These asks define what must be confirmed before upgrading from track to buy.
