company:
  name: Meshy
chapter:
  number: 8
  title: Valuation Assessment
  summary: Meshy’s $1.5B post-money valuation is supported by rare AI-3D traction and a hot 2026 AI funding market, but the
    implied ~50x ARR multiple is stretched. The chapter recommends track / research-more until private diligence verifies
    retention, gross margin, paid conversion and cap-table terms.
sections:
- id: valuation-snapshot
  title: Valuation snapshot and recommendation
  body: 'Meshy’s valuation case is unusually clear on headline price and unusually incomplete on underwriting detail. The
    company announced a nearly $400 million Series B at a $1.5 billion valuation, and separately disclosed a $30 million ARR
    milestone at GDC 2026. Those two facts imply roughly 50x ARR, a level that can be rationalized only by sustained category
    leadership, rapid enterprise conversion, and a still-supportive AI funding market. The investment stance is therefore
    track / research-more, not buy at any price. Meshy has real proof points: a large user base, more than 100 million generated
    models, explicit ARR disclosure, and investors willing to fund the category at scale. But the public file does not yet
    show net revenue retention, gross margin, paid conversion, preference terms, or cohort quality. That makes the company
    attractive to monitor but price-sensitive to underwrite.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV006
  - CV007
  - CV008
  - CV039
  - CV040
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV004
- id: multiple-benchmarking
  title: Comparable-company and multiple benchmarking
  body: 'The multiple benchmark is the core adverse tension. Meshy’s implied 50x ARR is within the upper end of several 2026
    AI valuation frameworks, but it is far above conventional SaaS references and should not be normalized simply because
    AI markets are hot. The best comparable set is necessarily mixed: Baseten shows investor appetite for high-growth AI infrastructure,
    Genspark shows premium pricing for agentic productivity, Tripo and Luma frame product adjacency, while Adobe and NVIDIA
    filings frame mature creative-software and AI-infrastructure alternatives. This is a sample rather than a clean peer group
    because many private AI rounds omit ARR, liquidation preferences, and revenue quality. The comp read is thus supportive
    of Meshy’s ability to raise at a premium, but not conclusive that the premium is intrinsically fair. The appropriate stance
    is stretched with a path to fair if ARR rapidly catches up.'
  claimRefs:
  - CV011
  - CV012
  - CV015
  - CV016
  - CV021
  - CV024
  - CV027
  - CV028
  - CV029
  - CV030
