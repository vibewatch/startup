- id: monetization-model
  title: Monetization mechanics and list pricing
  body: Meshy monetizes through a freemium self-serve funnel, paid subscriptions, enterprise plans and API usage. Official
    pricing lists a Free plan with monthly credits, paid tiers at $20, $60 and $100 per month, and custom Enterprise packaging.
    The docs explain that credits fund generation workflows, while the API page states that API usage requires Pro tier or
    above. This supports a plausible mix of seat subscription revenue, higher-value enterprise contracting and usage-based
    API or credit monetization. The limitation is that public list pricing is not realized pricing. It says little about discounts,
    annual contracts, enterprise minimums, gross revenue retention, paid-seat expansion, or whether generated-model volume
    falls in free or paid cohorts. As a result, the monetization model is real and visible, but revenue mix and revenue quality
    remain private-evidence-only diligence items.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
