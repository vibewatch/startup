- id: unit-economics-opacity
  title: Unit economics, burn and freemium risk
  body: 'The adverse financial read is opacity rather than absence of traction. The reviewed public sources do not disclose
    gross margin, CAC, payback, NRR, GRR, monthly burn, runway or paid-customer count. Those omissions matter more for Meshy
    than for a low-compute SaaS product because AI 3D generation can carry meaningful inference, model-training and infrastructure
    costs, and because a freemium product can accumulate impressive user and model counts without proportional paid retention.
    Subscription-benchmark sources reinforce that recurring-revenue quality depends on retention, expansion and subscriber
    behavior, none of which Meshy discloses publicly. Investors should therefore separate three layers: official traction,
    observable list pricing, and unavailable private economics. The required diligence path is a cohort-level revenue bridge
    from registered user to paid account to retained ARR, with workflow-level gross margin and cloud cost attached.'
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI032
  - CI033
  - CI034
  - CI035
  - CI045
  tableRefs:
  - TI004
  figureRefs:
  - FI003
- id: valuation-benchmark-verdict
  title: Valuation benchmark and financial verdict
  body: 'At the canonical $30 million ARR input, Meshy’s $1.5 billion valuation implies roughly 50x ARR. That can be defensible
    only if the official 12x growth, enterprise adoption, model-quality advantage and global expansion translate into durable,
    high-margin recurring revenue. It is stretched versus ordinary SaaS multiple benchmarks, though AI-native software frameworks
    allow much richer multiples for exceptional growth and defensibility. The conflicting $300 million ARR headline would
    imply a very different valuation picture, but it is not reliable enough to underwrite. The financial verdict is therefore
    ‘promising but not bankable from public data alone’: capital adequacy improved sharply after the Series B, and the revenue
    engine is visible, yet the key determinants of value—retention, paid conversion, gross margin, burn and revenue mix—remain
    private. The next investment step should be a data-room request, not a price-only debate.'
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  - CI037
  - CI045
