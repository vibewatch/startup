  - FI001
- id: arr-traction-quality
  title: ARR, usage and revenue-quality evidence
  body: 'The strongest revenue evidence is Meshy’s official $30 million ARR milestone at GDC 2026 and its statement that ARR
    had grown about 12x year over year. That disclosure is powerful because it gives a current run-rate anchor, but it is
    also unaudited and incomplete. The public record contains a material contradiction: 36Kr Europe’s headline says over $300
    million ARR, while Meshy’s own GDC announcement says $30 million. This chapter treats the $300 million figure as an adverse,
    low-confidence outlier and uses $30 million as the canonical underwriting input. Usage metrics reinforce the growth story—more
    than 12 million registered users and more than 100 million generated models—but those are top-of-funnel or workload proxies.
    They do not reveal paying accounts, free-to-paid conversion, credit consumption mix, enterprise ACV, churn or revenue
    recognition policy.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
