company:
  name: Meshy
chapter:
  number: 4
  title: Financial Analysis
  summary: 'Meshy shows rare public traction for an AI-3D startup: nearly $400M of new capital, a $1.5B valuation, and an
    official $30M ARR milestone. The financial conclusion is constrained by conflicting ARR coverage and undisclosed gross
    margin, retention, conversion, burn and runway.'
sections:
- id: funding-capital-adequacy
  title: Funding scale and capital adequacy
  body: 'Meshy’s public financial story begins with an unusually large July 2026 Series B rather than with detailed operating
    accounts. The company announced nearly $400 million of new capital at a $1.5 billion valuation, with IDG Capital, Matrix
    Partners China and Monolith Management leading and existing backers participating. For underwriting, the financing is
    best treated as a capital-adequacy input, not proof of attractive unit economics: it gives Meshy room to fund foundation-model
    R&D, inference infrastructure and enterprise expansion, but it does not disclose cash on hand, burn, debt, cloud commitments
    or milestone-based spending controls. The early funding record is less complete because profile sources point to earlier
    financing while official sources primarily emphasize the Series B. The chapter therefore uses local financing claims only
    where needed for forward capital analysis and flags private data still needed to calculate true runway.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI028
  - CI038
  - CI039
  - CI040
  - CI046
