  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Gross margin, inference cost per generation, support cost and workflow-level cloud expense.
    whyItMatters: Gross margin determines whether rapid usage growth converts into high-quality recurring revenue.
    diligencePath: Request cohort gross-margin schedules by product workflow, API customer and enterprise account.
    relatedQuestionRefs:
    - QI026
    - QI030
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: enterprise pricing
    missingEvidence: Enterprise ACV, discounts, implementation fees, credit overage pricing and renewal terms.
    whyItMatters: Public list pricing cannot underwrite revenue quality or expansion without realized contract data.
    diligencePath: Review anonymized enterprise contracts, discounting waterfall and bookings-to-ARR reconciliation.
    relatedQuestionRefs:
    - QI027
    - QI030
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Cash balance after close, monthly burn, debt or cloud commitments, and forecast runway.
    whyItMatters: The large Series B improves funding capacity but cannot prove runway without burn and obligations.
    diligencePath: Request bank statements, board cash forecast, vendor minimums and debt/commitment schedule.
    relatedQuestionRefs:
    - QI028
    - QI030
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: freemium conversion
    missingEvidence: Registered-to-active-to-paid cohort conversion, paid-customer count, churn, NRR and GRR.
    whyItMatters: Twelve million users and 100 million models may overstate monetizable demand if conversion is weak.
    diligencePath: Request monthly cohort funnel from registration through paid plan/API usage and retained ARR.
    relatedQuestionRefs:
    - QI026
    - QI029
    - QI030
    relatedTableRefs:
    - TI002
    - TI004
  - type: conflicting-data
    severity: material
    topic: ARR conflict
    missingEvidence: Management reconciliation of the $30M official ARR milestone versus the $300M third-party headline.
    whyItMatters: ARR is the denominator for valuation and revenue-quality analysis, so a 10x discrepancy changes the entire
      underwriting frame.
    diligencePath: Ask management for ARR definition, monthly ARR schedule, press-correction record and audited revenue tie-out.
    relatedQuestionRefs:
    - QI006
    - QI030
    relatedTableRefs:
    - TI002
    - TI006
  - type: access-blocked
    severity: minor
    topic: market-data profiles
    missingEvidence: Full Crunchbase, PitchBook and CB Insights profile details were not all accessible in reviewed public
      fetches.
    whyItMatters: Restricted databases may contain prior-round, cap-table or investor details relevant to financing chronology.
    diligencePath: Use licensed database access or request the company cap table and financing history directly.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI001
