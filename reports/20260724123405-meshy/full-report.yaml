      - number: '8.3'
        title: Scenario and sensitivity analysis
        blocks:
          - type: paragraph
            body: >-
              A scenario lens clarifies how much execution is embedded in the latest price. The bear case assumes ARR
              doubles to about $60 million but the exit multiple compresses to 12x as conversion or margin concerns
              surface; that outcome is worth roughly $0.7 billion and would make the Series B price look expensive. The
              base case assumes ARR reaches about $120 million and exits at 25x, yielding roughly $3.0 billion and a
              plausible venture return before dilution. The bull case requires Meshy to become the durable AI-3D
              workflow layer, reach about $250 million ARR, and preserve a 35x premium multiple, producing about $8.8
              billion of value. These cases deliberately compress the multiple as revenue scales because today’s 50x
              depends on exceptional growth. The practical underwriting question is therefore not whether Meshy is good,
              but how much price discipline compensates for still-private economics.
            claimRefs:
              - CV036
