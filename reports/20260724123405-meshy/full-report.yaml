  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding scale and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Meshy’s public financial story begins with an unusually large July 2026 Series B rather than with detailed
              operating accounts. The company announced nearly $400 million of new capital at a $1.5 billion valuation,
              with IDG Capital, Matrix Partners China and Monolith Management leading and existing backers
              participating. For underwriting, the financing is best treated as a capital-adequacy input, not proof of
              attractive unit economics: it gives Meshy room to fund foundation-model R&D, inference infrastructure and
              enterprise expansion, but it does not disclose cash on hand, burn, debt, cloud commitments or
              milestone-based spending controls. The early funding record is less complete because profile sources point
              to earlier financing while official sources primarily emphasize the Series B. The chapter therefore uses
              local financing claims only where needed for forward capital analysis and flags private data still needed
              to calculate true runway.
