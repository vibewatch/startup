  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              Meshy competes in a broader arena than the phrase text-to-3D suggests. The direct peer set includes Tripo
              and Hyper3D Rodin, because both promise rapid text or image generation of downloadable 3D assets. Luma is
              adjacent because its current public positioning is broader creative agents, image, and video APIs rather
              than mesh-first asset production. Kaedim is a workflow substitute for teams that start with sketches, art
              direction, product photos, or briefs and want an inspected production asset rather than a self-serve
              instant draft. Spline competes when the buyer’s job is a browser-native interactive 3D experience. Adobe
              Substance, Blender, Maya, and ZBrush remain incumbent substitutes for professional control. NVIDIA
              Omniverse, Google DeepMind world models, Hunyuan3D, TRELLIS, and Stable Fast 3D matter because they can
              reset buyer expectations around cost, control, and model availability. This framing also keeps the
              comparison buyer-centered: the relevant question is not which model looks best in a gallery, but which
              alternative can reliably deliver an editable, licensable, downstream-ready asset for the buyer's specific
              workflow.
