      - number: '8.2'
        title: Comparable-company and multiple benchmarking
        blocks:
          - type: paragraph
            body: >-
              The multiple benchmark is the core adverse tension. Meshy’s implied 50x ARR is within the upper end of
              several 2026 AI valuation frameworks, but it is far above conventional SaaS references and should not be
              normalized simply because AI markets are hot. The best comparable set is necessarily mixed: Baseten shows
              investor appetite for high-growth AI infrastructure, Genspark shows premium pricing for agentic
              productivity, Tripo and Luma frame product adjacency, while Adobe and NVIDIA filings frame mature
              creative-software and AI-infrastructure alternatives. This is a sample rather than a clean peer group
              because many private AI rounds omit ARR, liquidation preferences, and revenue quality. The comp read is
              thus supportive of Meshy’s ability to raise at a premium, but not conclusive that the premium is
              intrinsically fair. The appropriate stance is stretched with a path to fair if ARR rapidly catches up.
            claimRefs:
