            body: >-
              The adverse financial read is opacity rather than absence of traction. The reviewed public sources do not
              disclose gross margin, CAC, payback, NRR, GRR, monthly burn, runway or paid-customer count. Those
              omissions matter more for Meshy than for a low-compute SaaS product because AI 3D generation can carry
              meaningful inference, model-training and infrastructure costs, and because a freemium product can
              accumulate impressive user and model counts without proportional paid retention. Subscription-benchmark
              sources reinforce that recurring-revenue quality depends on retention, expansion and subscriber behavior,
              none of which Meshy discloses publicly. Investors should therefore separate three layers: official
              traction, observable list pricing, and unavailable private economics. The required diligence path is a
              cohort-level revenue bridge from registered user to paid account to retained ARR, with workflow-level
