  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              Meshy’s adverse case is not a single-point failure; it is the interaction of valuation, competition, legal
              provenance, geopolitical scrutiny, and execution load. The company has credible scale signals, including
              public claims of more than 100 million generated assets and third-party reporting of more than 12 million
              registered users, but those adoption metrics do not by themselves prove enterprise conversion, gross
              margin, or durable retention. The July 2026 financing creates a high bar: at a reported $1.5 billion
              valuation, even a canonical diligence assumption of roughly $30 million ARR implies about a 50x ARR entry
              multiple. The highest-priority diligence work is therefore to separate observed facts from residual
              exposure: verify ARR quality, customer concentration, GPU economics, and whether Meshy’s mitigation claims
              around privacy, training data, and output ownership are contractually enforceable for target enterprise
              use cases.
