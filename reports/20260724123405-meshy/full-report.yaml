      - number: '3.2'
        title: Capability, packaging, and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              The head-to-head comparison gives Meshy a real breadth advantage. Meshy combines text-to-3D, image-to-3D,
              texturing, API access, rigging, 600-plus animation clips, multi-format exports, and an emerging print
              fulfillment loop. That stack is unusually coherent for creators who want one place to move from idea to
              asset. Tripo pressures Meshy on free credits, smart-mesh packaging, and game-friendly batch workflows.
              Rodin pressures Meshy on the hardest professional dimension: geometry and topology quality. Luma’s
              retained evidence points more toward image/video creative infrastructure than mesh production, while
              Spline’s strength is web-native collaboration and interactivity. Pricing also matters: Blender is free,
              Spline and Tripo publish low entry paid tiers, and Rodin can command more where output quality is the
              buyer’s constraint. Meshy must therefore prove that speed plus breadth offsets cheaper or more specialized
              alternatives. The absence of uniform third-party benchmarks makes public feature claims insufficient by
              themselves, so pricing and workflow claims should be treated as screens for diligence rather than final
              proof of superiority.
