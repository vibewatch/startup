            body: >-
              Meshy’s product surface is best understood as a rapid 3D-asset creation workflow, not as a single model
              endpoint. The official pages and help center support a catalog that spans text-to-3D, image-to-3D, AI
              texturing, rigging and animation, remesh controls, Meshy 3D Agent, Auto Split for 3D printing, and API
