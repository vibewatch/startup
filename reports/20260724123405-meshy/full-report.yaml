      - number: '2.5'
        title: Sizing gaps and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The biggest market-analysis risk is false precision. Public analyst reports define categories differently:
              some include all generative AI for 3D assets, some include texturing, some focus on gaming, and others
              describe adjacent visualization, metaverse, or digital-twin pools. Meshy's disclosed scale proves demand,
              but public sources do not break out paying customer count, conversion, enterprise penetration, churn, or
              revenue by vertical. Therefore the chapter preserves contradictory lenses rather than forcing one TAM
              number. Follow-up diligence should request cohort-level ARR by segment, API versus web revenue, enterprise
              pipeline deployments, paid conversion from registered users, customer acquisition cost by use case, and
              proof that generated assets survive professional production review without extensive manual rework. This
              is especially important because registered-user scale can coexist with low paid conversion, while
              enterprise API revenue can be material even with fewer accounts.
