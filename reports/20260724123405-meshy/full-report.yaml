      - number: '7.2'
        title: Competitive and existential risk
        blocks:
          - type: paragraph
            body: >-
              The competitive threat is unusually severe because Meshy is squeezed from three directions at once.
              Open-source releases such as Hunyuan3D, TRELLIS, TRELLIS.2, and TripoSR lower the cost for developers to
              reproduce parts of the generation stack or benchmark against public alternatives. Direct product
              competitors such as Tripo and Hyper3D Rodin market similar text-or-image-to-3D experiences, while
              incumbents such as Adobe and NVIDIA own entrenched professional workflows, distribution, and rendering
              infrastructure. Google and OpenAI add a platform risk: even if their current public pages are broader than
              3D asset generation, their model and agent platforms can absorb adjacent creation workflows. The
              investment implication is that Meshy’s moat must be workflow depth, speed, data-rights posture, community,
              and enterprise trust—not simply access to a capable 3D foundation model.
