      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation is unusually wide because the same asset-generation primitive can be self-serve for
              creators and embedded infrastructure for teams. Indie game developers and hobbyists are typically user,
              buyer, and payer in one person, making price, speed, export formats, and ease of cleanup decisive.
              Studios, VFX shops, and publishers split the user from the payer: artists and technical directors use the
              tool, while a producer, tools lead, or central technology group controls budget and governance.
              Product-design, manufacturing, and ecommerce teams buy from different budgets and need workflow
              integration, brand control, and rights clarity. Education and maker segments expand reach but are less
              reliable for near-term revenue unless they convert into subscriptions or API usage.
