      - number: '8.4'
        title: Valuation drivers and downside risks
        blocks:
          - type: paragraph
            body: >-
              The positive valuation drivers are category scarcity, product breadth, usage scale, and a 2026 market that
              rewards AI growth. Meshy also benefits from the narrative that AI applications are moving into 3D
              workflows. The adverse drivers are equally important: a freemium funnel can create impressive
              registered-user and model-generation metrics without proportional paid retention; incumbents and big AI
              platforms can reduce differentiation; and the broader AI market remains vulnerable to hype-cycle resets.
              Skeptical valuation sources emphasize capital efficiency and profitability path, which are precisely the
              fields Meshy has not publicly disclosed. The key diligence ask is a revenue-quality bridge from free user
              to paid account to retained ARR, paired with workflow-level gross margin. Without that bridge, investors
              risk underwriting user-scale optics rather than economic durability.
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV041
              - CV042
              - CV049
          - type: table
            tableRef: TV005
            claimRefs:
              - CV041
              - CV042
              - CV044
              - CV045
              - CV046
      - number: '8.5'
        title: Exit path, liquidity, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Meshy’s exit path is plausible but not immediate on public evidence. A 2026 funding and exit market with
              many new unicorns and stronger IPO/M&A activity supports optionality, and strategic buyers in creative
              software or AI infrastructure have logical reasons to care about 3D asset generation. However, IPO
              readiness requires audited revenue quality, governance, retention, margin, and predictable enterprise
              expansion; acquisition readiness requires proof that Meshy owns a workflow layer rather than a replaceable
              model feature. The final diligence list should therefore focus on six items: revenue quality, gross
              margin, cap-table terms, enterprise traction, moat durability, and exit readiness. If those items
              validate, the current valuation can migrate from stretched to fair as ARR scales. If they disappoint, the
              same price becomes expensive because multiple compression would transmit directly into downside.
            claimRefs:
              - CV017
              - CV018
              - CV029
              - CV030
              - CV040
              - CV043
              - CV044
              - CV045
              - CV046
