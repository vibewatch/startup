      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Growth is driven by a real production pain point: games, VFX, ecommerce, digital twins, 3D printing, and
              AR/VR all need more 3D assets than scarce specialist labor can make cheaply. Meshy's own claims emphasize
              dramatic time and cost compression, and independent AI 3D commentary describes the same shift from
              multi-day pipelines to minutes. However, the market is not de-risked. Professional buyers still care about
              topology, riggability, texture quality, IP provenance, tool integration, and asset governance. Gartner's
              adverse AI-cycle view is a reminder that broad GenAI enthusiasm can cool when governance and reliability
              limits surface. Open-source 3D models, Blender, asset stores, and incumbent DCC suites also cap pricing
              power unless Meshy proves production-ready quality and distribution advantages.
