      - number: '7.3'
        title: Technology, quality, and production-readiness risk
        blocks:
          - type: paragraph
            body: >-
              The quality risk is not that Meshy lacks useful output; the stronger adverse reading is that usefulness
              for ideation and background assets may not translate into AAA, hero-asset, or deformation-critical
              production use. Meshy’s own product pages emphasize speed and ease of creation, and the 2026 product
              coverage highlights Smart Topology and 3D-printing improvements, but independent workflow review still
              notes manual adjustment needs for some character-generation cases. That gap matters because professional
              buyers pay for reliability, predictable topology, IP-safe reuse, and low cleanup time. A model that
              creates compelling first drafts can still face gross-margin pressure if support, regeneration, or human
              cleanup becomes necessary for enterprise adoption. The diligence ask is to inspect before-and-after
              meshes, failed prompts, generation retry rates, and customer evidence showing shipped production assets
              rather than demos.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR043
              - CR044
              - CR045
