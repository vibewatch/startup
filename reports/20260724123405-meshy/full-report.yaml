  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation snapshot and recommendation
        blocks:
          - type: paragraph
            body: >-
              Meshy’s valuation case is unusually clear on headline price and unusually incomplete on underwriting
              detail. The company announced a nearly $400 million Series B at a $1.5 billion valuation, and separately
              disclosed a $30 million ARR milestone at GDC 2026. Those two facts imply roughly 50x ARR, a level that can
              be rationalized only by sustained category leadership, rapid enterprise conversion, and a still-supportive
              AI funding market. The investment stance is therefore track / research-more, not buy at any price. Meshy
              has real proof points: a large user base, more than 100 million generated models, explicit ARR disclosure,
              and investors willing to fund the category at scale. But the public file does not yet show net revenue
              retention, gross margin, paid conversion, preference terms, or cohort quality. That makes the company
              attractive to monitor but price-sensitive to underwrite.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV039
              - CV040
