              estimate is about $3.23 billion in 2026 and roughly $9.4 billion by 2030, while the narrower AI 3D asset
              generation and texturing forecast reaches $12.84 billion by 2036. A gaming-specific SAM is more
              conservative, with generative AI in gaming estimated at $2.21 billion in 2026 and $5.09 billion in 2030.
