companyProfile:
  summary: >-
    Meshy is a Silicon Valley-based generative-AI company whose platform turns text prompts and reference images into
    production-ready 3D models in about a minute, with AI texturing, auto-rigging and animation, a 3D printing workflow,
    and a REST API. Founded in 2021 by MIT-trained researcher Ethan Hu, it has grown to more than 12 million registered
    users and over 100 million models generated, and in July 2026 raised nearly $400 million at a $1.5 billion valuation
    in the largest funding round to date for an AI-3D company.
  foundedDate: '2021-01-01'
  founders:
    - name: Ethan Hu
      role: Founder & CEO
      background: MIT-trained Ph.D. known for creating the Taichi GPU programming language before founding Meshy.
      claimRefs:
        - CO005
        - CO006
  foundingLocation: San Jose, California, United States
  headquarters: San Jose, California, United States
  productSummary: >-
    Text-to-3D and image-to-3D AI generation with AI PBR texturing, auto-rigging/animation, remesh, the Meshy 3D Agent,
    Auto Split for 3D printing, multi-format export (FBX, OBJ, GLB, USDZ, STL), engine plugins, and a REST API with
    enterprise controls.
  customerFocus: >-
    Game developers, 3D artists, product and industrial designers, manufacturers, 3D-printing creators, e-commerce
    brands, and educators.
  businessModel: Freemium with paid subscription tiers (Pro/Premium/Studio/Ultra), enterprise plans, and credit-based API licensing.
  stage: Series B
  fundingStatus: >-
