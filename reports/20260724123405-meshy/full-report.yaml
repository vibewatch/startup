      - number: '3.3'
        title: Differentiation, switching costs, and workflow moats
        blocks:
          - type: paragraph
            body: >-
              Meshy’s strongest moat is not any single feature. It is the bundle: large user scale, a freemium funnel,
              API access, rapid preview generation, downloadable formats, animation, engine-oriented workflows, and 3D
              printing adjacency. Those features create moderate switching costs when a team has prompts, asset history,
              API calls, engine import conventions, and downstream workflows wired around Meshy. However, the switching
              cost is not absolute. AI 3D buyers can multi-home by running the same prompt in Rodin, Tripo, an
              aggregator, or an open model, then keeping whichever output is best. This means Meshy’s flywheel must show
              up as visibly better outputs, lower cycle cost, or smoother downstream completion rather than as brand
              alone. The Formlabs and animation loops are valuable because they push Meshy beyond first-draft generation
              into completion, where rivals have fewer identical touchpoints.
