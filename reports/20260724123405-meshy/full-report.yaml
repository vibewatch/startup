      - number: '7.4'
        title: IP, copyright, and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Legal exposure is the canonical adverse-source domain for this chapter. Meshy’s policies improve the
              customer story by describing paid-user output ownership, enterprise training-data protections, U.S.-based
              AWS storage, and security certifications. However, AI copyright law remains unstable in 2026: public
              trackers list active training-data lawsuits, and the Anthropic/Bartz settlement created a large monetary
              benchmark while preserving important distinctions between lawful training use and allegedly pirated
              acquisition. Meshy’s 3D domain adds extra uncertainty because inputs and outputs can include copyrighted
              characters, game assets, industrial designs, scans, and user-provided reference art. The most important
              mitigation is not generic terms language; it is auditable training-data provenance, enterprise indemnity
              scope, takedown handling, and proof that customer or uploaded assets are not used outside contracted
              permissions.
            claimRefs:
              - CR013
