        title: Funding, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The clearest company-stage signal is the July 2026 Series B: Meshy announced nearly $400 million at a $1.5
              billion valuation, with Yahoo carrying the same company-distributed release and independent summaries
              repeating the main financing facts. The chapter uses $1.5 billion as the canonical valuation because the
              release is direct and timestamped, while The SaaS News’ over-$1.38 billion figure is treated as a lower
              conflicting summary rather than the report-wide anchor. Investors named publicly include IDG Capital,
              Matrix Partners China, Monolith Management, Granite Asia, HongShan or Sequoia China, BAI Capital, and
              Source Code Capital. The use of proceeds is broad but coherent: foundation-model R&D, infrastructure, and
              global enterprise expansion. The risk is that prior-round terms, exact ownership, debt, secondaries, and
              investor rights remain private, while the named investor set is materially China-linked for a company
              presented as Silicon Valley-based.
