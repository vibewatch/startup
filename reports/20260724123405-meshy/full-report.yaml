  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Meshy's relevant market is not the whole 3D software industry. The core boundary is AI-assisted generation
              of editable 3D assets from text, images, conversations, or API calls; it includes asset generation,
              texturing, remesh/topology, export, and developer integration when those capabilities replace manual asset
              creation. It excludes conventional DCC license spend when artists still model by hand in Maya, Blender, or
              Substance, although those tools remain the workflow context and substitute budget. It also excludes
              asset-store purchases unless a buyer is replacing stock models with generated custom assets. Adjacencies
              such as metaverse worlds, digital twins, 3D rendering, AR/VR commerce, and 3D printing matter because they
              consume 3D content, but they should be treated as demand pools rather than counted wholesale as Meshy's
              TAM. This boundary prevents double counting.
