      - number: '1.2'
        title: Leadership and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The public leadership record is highly founder-centric. Meshy repeatedly names Ethan Hu as founder and
              CEO, and the evidence for founder-market fit is strong: Hu is described as an MIT-trained Ph.D. in
              computer graphics and AI and is associated with Taichi, an open-source GPU programming language used in
              high-performance graphics contexts. That background maps tightly to Meshy’s technical problem: generating
              geometry, textures, animation-ready assets, and production-export formats at speed. The adverse
              implication is governance opacity rather than a known personnel problem. Reviewed public sources did not
              disclose a complete executive bench, independent directors, or board composition. For underwriting, that
              means diligence should confirm whether Meshy has operational leaders capable of scaling enterprise sales,
              infrastructure, security, and finance if the founder remains the dominant technical and external voice.
