chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product surface
        blocks:
          - type: paragraph
            body: >-
              Meshy is best understood as a private, Silicon Valley-rooted AI 3D creation platform rather than a narrow
              design utility. The official product and help surfaces define the company around text-to-3D, image-to-3D,
              AI texturing, animation, and API workflows, with outputs intended for game development, 3D printing,
              AR/VR, product design, education, and content creation. The product proposition is unusually concrete for
              a generative-AI company: users start from text, an image, or a concept, preview the resulting asset, and
              export it into standard 3D workflows. Public sources support San Jose/Silicon Valley as the operating
              locus and 2021 as the founding year, but the strongest official pages emphasize mission and scale more
              than incorporation records or registered-office detail. The chapter therefore treats Meshy as a
              US-positioned, private Series B company whose exact legal entity, cap table, and employee base still
              require primary diligence.
