      - number: '7.5'
        title: Geopolitical, CFIUS, cybersecurity, and data-residency risk
        blocks:
          - type: paragraph
            body: >-
              Meshy is described as U.S.-operated through Meshy LLC, yet its financing coverage names several
              China-linked or China-origin investment brands, including IDG Capital, Matrix Partners China, HongShan,
              BAI Capital, and Source Code Capital. That does not establish wrongdoing, control, or reviewability, but
              it does create a diligence flag in a U.S.-China AI environment where government and media sources are
              explicitly warning about AI IP theft, distillation, cyberattacks, and insider threats. Treasury’s CFIUS
              framework and GAO’s mitigation work show that foreign-investment risk can turn on access to sensitive
              technical information, governance rights, data, and control rights. Meshy should be underwritten with a
              clean cap-table rights review, data-access map, insider-threat controls, and customer-facing answers on
              where generated assets and uploads reside.
            claimRefs:
