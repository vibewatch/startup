  rows:
  - - Meshy
    - AI text/image-to-3D platform
    - Nearly $400M Series B; $1.5B valuation; 12M+ users; 100M+ models
    - Creators, game developers, 3D artists, product designers
    - Fast one-minute generation, large freemium funnel, API, animation, 3D printing loop
    - Rougher production geometry versus Rodin in adverse reviews
  - - Tripo AI
    - AI text/image-to-3D direct peer
    - Free tier; Pro around $19.90 monthly before annual discount
    - Game developers and fast prototypers
    - Smart Mesh, low-poly, batch generation, high credit allowance
    - Less evidence of Meshy-scale ARR or user base
  - - Hyper3D Rodin
    - High-fidelity AI 3D direct peer
    - Creator plan $30 monthly or $24 annualized monthly
    - Professional artists, studios, production asset creators
    - Production-oriented geometry, UVs, textures, Smart Low-Poly
    - Higher effective price and potentially less freemium scale
  - - Luma AI
    - AI reconstruction / video / creative agents
    - No 3D asset-specific scale in retained sources
    - Creative teams building image/video campaigns and physical AI workflows
    - Frontier video/image APIs and creative-agent workflow
    - Less mesh-first and less game-asset-specific than Meshy
  - - Kaedim
    - 2D-to-3D production workflow
    - Private pricing not verified from public page
    - Game, product, ecommerce, and marketing teams
    - Human-in-loop review loop and production handoff
    - Hours-scale workflow rather than instant self-serve generation
  - - Spline
    - Web-native interactive 3D design
    - Seat pricing at $12 and $20 monthly billed annually
    - Design teams and web-experience builders
    - Collaborative browser editor, interactive exports, integrated AI
    - Not a specialist production-mesh generator
  - - Adobe / Substance 3D
    - Incumbent material and texture suite
    - Adobe product line; public page shows Substance 3D collection
    - Artists and enterprise creative teams
    - Professional materials and texturing workflows
    - Complements or substitutes texturing, not full prompt-to-mesh
  - - NVIDIA Omniverse
    - Big-tech simulation and OpenUSD platform
    - NVIDIA ecosystem and developer platform
    - Simulation, physical AI, enterprise developers
    - OpenUSD, SimReady, synthetic data, scene optimization
    - More platform infrastructure than creator-first generator
  - - Blender / Maya / ZBrush
    - Manual incumbent tools
    - Blender free; Maya/ZBrush established commercial tools
    - Professional artists, studios, technical artists
    - Precision, control, pipeline maturity, training ecosystem
    - Skill-intensive and slower for first drafts
  - - Hunyuan3D / TRELLIS / Stable Fast 3D
    - Open-source and research models
    - Open repositories and model releases
    - Developers and teams able to self-host or adapt models
    - Low marginal cost, modifiability, fast reconstruction research
    - Operational burden and product UX left to adopter
  notes: Partial landscape focused on public 2026 evidence, direct AI 3D rivals, incumbents, big-tech platforms, and open-source
