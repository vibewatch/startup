- id: competitive-threats-and-adverse-evidence
  title: Competitive threats and adverse evidence
  body: 'The adverse evidence is clear enough to underwrite a specific competitive risk. Independent comparison sources rank
    Rodin above Meshy for production-ready geometry, clean quad topology, UVs, and PBR textures, and they describe Tripo as
    stronger for raw speed or game-ready topology in some workflows. A separate comparison criticizes Meshy’s single-model
    lock-in, which is exactly the weakness aggregators exploit. Open-source models compound the threat because Hunyuan3D,
    TRELLIS, and Stable Fast 3D give technical users low-cost alternatives that can be embedded into internal tools. Big-tech
    work on simulation, world models, and physical AI is more indirect today, but it could become existential if OpenAI, Google,
    NVIDIA, Adobe, or Autodesk turn distribution into a default 3D-generation feature. The diligence task is therefore benchmark-based:
    test the same prompts across Meshy, Rodin, Tripo, Spline, and open models, then score usable meshes after rigging, editing,
    printing, and engine import rather than screenshots alone.'
