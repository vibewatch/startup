      - number: '2.5'
        title: 市场规模缺口与尽调含义
        blocks:
          - type: paragraph
            body: >-
              市场分析最大的风险是虚假精确。公开分析报告对品类定义不一：有的包括所有 3D 资产生成式 AI，有的包括贴图，有的聚焦游戏，还有的描述相邻可视化、元宇宙或数字孪生池。Meshy
              披露的规模证明了需求，但公开来源没有拆出付费客户数、转化率、企业渗透率、流失率或按垂直行业划分的收入。因此，本章保留相互矛盾的口径，而不是强行给出一个 TAM 数字。后续尽调应要求按细分市场提供队列级
              ARR、API 与 Web 收入拆分、企业管线部署、注册用户付费转化、按用例划分的获客成本，以及生成资产无需大量人工返工即可通过专业生产评审的证据。注册用户规模可以与低付费转化并存，而企业 API
              收入即使账户更少也可能具有实质性，因此这点尤其重要。
            claimRefs:
