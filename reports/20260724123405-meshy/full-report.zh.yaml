  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值快照与建议
        blocks:
          - type: paragraph
            body: >-
              Meshy 的估值案例在头部价格上异常清晰，在投资细节上异常不完整。公司宣布以 $1.5 billion 估值完成近 $400 million Series B，并另行在 GDC 2026 披露 $30
              million ARR 里程碑。这两个事实意味着约 50x ARR；只有持续的品类领导、快速企业转化和仍然友好的 AI 融资市场才能解释这一水平。因此，投资姿态应是跟踪 /
              继续研究，而不是不计价格买入。Meshy 有真实证明点：庞大用户基础、超过 1 亿个已生成模型、明确 ARR
              披露，以及愿意大规模押注该品类的投资者。但公开文件尚未展示净收入留存、毛利率、付费转化、优先权条款或队列质量。这使公司值得监控，但投资定价对价格高度敏感。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
