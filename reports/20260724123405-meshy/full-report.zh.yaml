            body: >-
              公开领导层记录高度围绕创始人展开。Meshy 反复把 Ethan Hu 列为创始人兼 CEO，创始人与市场匹配的证据较强：Hu 被描述为受过 MIT 训练、研究计算机图形和 AI 的博士，并与 Taichi
