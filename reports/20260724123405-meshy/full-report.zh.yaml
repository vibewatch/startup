  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资规模与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Meshy 的公开财务故事不是从详细经营报表开始，而是从一轮异常大的 2026 年 7 月 Series B 开始。公司宣布以 $1.5 billion 估值获得近 $400 million 新资本，由 IDG
              Capital、Matrix Partners China 和 Monolith Management 领投，老股东参投。投资判断上，这轮融资更适合作为资本充足性输入，而不是有吸引力单位经济的证明：它给
              Meshy 留出资金做基础模型研发、推理基础设施和企业扩张，但没有披露账上现金、烧钱、债务、云承诺或里程碑式支出控制。早期融资记录更不完整，因为资料库来源指向更早融资，而官方来源主要强调 Series
              B。因此，本章只在前瞻资本分析需要时使用早期融资主张，并标出仍需私有数据才能计算真实资金跑道。
