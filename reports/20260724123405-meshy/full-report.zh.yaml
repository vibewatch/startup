      - number: '8.3'
        title: 情景与敏感性分析
        blocks:
          - type: paragraph
            body: >-
              情景视角能看清最新价格埋进了多少执行假设。熊案假设 ARR 翻倍至约 $60 million， 但转化或利润率担忧浮出水面后，退出倍数压缩到 12x；结果价值约 $0.7 billion， 会让 Series B
              价格显得昂贵。基准案假设 ARR 达到约 $120 million，并以 25x 退出， 产生约 $3.0 billion 价值，摊薄前具备合理的风险投资回报。牛案要求 Meshy 成为持久的 AI-3D
              工作流层，ARR 达到约 $250 million，并守住 35x 的溢价倍数，带来约 $8.8 billion 价值。上述情景刻意让倍数随收入规模扩大而压缩，因为今天的 50x 依赖异常增长。因此，
              实际承销问题不是 Meshy 好不好，而是多大的价格纪律能补偿仍未公开的经营经济性。
            claimRefs:
