        title: 性能、质量与局限
        blocks:
          - type: paragraph
            body: >-
              质量案例由强烈的第一方速度主张和有意义的独立提示混合而成。Meshy 声称文本生成 3D 和图像生成 3D 工作流低于一分钟，Auto Split 结果约 40
              秒，动画工作流可在数分钟内从上传走到动画角色。这些主张支撑了清晰的原型生产率命题。不过，There’s An AI For That
              提示，多数生成模型按生成结果本身并非打印就绪，因为它们可能超过构建板、需要颜色分离，或包含开放网格表面。Costbench 另行报告了重试复现相同错误时与积分相关的挫败感。这些反向来源并不否定 Meshy
              的效用，但会改变投资判断姿态：生成资产应被视为快速草稿，投产前仍需拓扑、可打印性和材料 QA。
