      - number: '8.2'
        title: 可比公司与倍数基准
        blocks:
          - type: paragraph
            body: >-
              倍数基准是核心反向张力。Meshy 隐含的 50x ARR 位于多套 2026 年 AI 估值框架上沿， 但远高于传统 SaaS 参照，不能因为 AI 市场火热就把它常态化。最合适的可比组合必然混杂：
              Baseten 说明投资人愿意为高增长 AI 基础设施买单，Genspark 说明智能体生产力可以拿到溢价， Tripo 和 Luma 界定产品邻近性，Adobe 与 NVIDIA 的文件则给成熟创意软件和 AI
              基础设施替代方案定锚。 上述组合只是样本，不是干净的同业组，因为许多私有 AI 融资不披露 ARR、清算优先权和收入质量。 因此，可比公司读数支持 Meshy
              以溢价融资的能力，但不能证明溢价天然合理。合适判断是： 估值偏撑；如果 ARR 快速追上，有机会走向合理。
