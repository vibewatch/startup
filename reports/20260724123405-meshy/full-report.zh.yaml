    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品边界
        blocks:
          - type: paragraph
            body: >-
              Meshy 更像一家扎根 Silicon Valley 的私有 AI 3D 创作平台，而不是一个狭义设计工具。官方产品页和帮助中心把公司定义在文本生成 3D、图像生成 3D、AI 贴图、动画和 API
              工作流上，输出面向游戏开发、3D 打印、AR/VR、产品设计、教育和内容创作。生成式 AI 公司常把价值说得抽象，Meshy 的产品主张却相当具体：用户从文本、图像或概念出发，预览生成资产，再导出到标准 3D
              工作流。公开来源支持 San Jose / Silicon Valley 是运营重心、2021 年是创立年份，但最强的官方页面更强调使命和规模，而不是注册实体或办公地址细节。因此，本章把 Meshy
              视为一家定位美国的私有 Series B 公司；其准确法律实体、股权结构和员工基础仍需一手尽调。
