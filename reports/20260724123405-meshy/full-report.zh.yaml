      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方分层异常宽，因为同一个资产生成原语既可服务自助创作者，也可嵌入团队基础设施。独立游戏开发者和爱好者通常一人兼具用户、买方和付款方身份，价格、速度、导出格式和清理便利性因此决定购买。工作室、VFX
              公司和发行商则把用户与付款方拆开：艺术家和技术总监使用工具，制作人、工具负责人或中央技术组控制预算和治理。产品设计、制造和电商团队来自不同预算池，更需要工作流集成、品牌控制和权利清晰度。教育和创客群体能扩大触达，但若不能转成订阅或
              API 用量，近期收入可靠性较低。
