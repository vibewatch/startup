            body: >-
              法律暴露是本章的标准反向来源领域。Meshy 的政策描述了付费用户输出所有权、企业训练数据保护、美国境内 AWS 存储和安全认证，改善了客户叙事。不过，2026 年 AI
              版权法仍不稳定：公开追踪器列出活跃训练数据诉讼，Anthropic/Bartz 和解创造了一个大型金额基准，同时保留了合法训练使用与涉嫌盗版获取之间的重要区分。Meshy 的 3D
              领域又增加了额外不确定性，因为输入和输出可能包含受版权保护的角色、游戏资产、工业设计、扫描件和用户提供参考图。最重要的缓释不是泛泛的条款语言，而是可审计的训练数据来源、企业赔偿保障范围、下架处理，以及客户或上传资产不会在合同许可之外被使用的证明。
