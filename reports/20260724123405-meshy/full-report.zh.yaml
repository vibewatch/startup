companyProfile:
  summary: >-
    Meshy 是一家扎根 Silicon Valley 的生成式 AI 公司，平台可在约一分钟内把文本提示和参考图像转成可投产的 3D 模型，并提供 AI 贴图、自动绑定与动画、3D 打印工作流和 REST API。公司由 MIT
    训练背景的研究员 Ethan Hu 于 2021 年创立，注册用户已超过 1200 万，生成模型超过 1 亿；2026 年 7 月，公司以 $1.5 billion 估值融资近 $400 million，成为迄今 AI-3D
    公司最大一轮融资。
  foundedDate: '2021-01-01'
  founders:
    - name: Ethan Hu
      role: 创始人兼 CEO
      background: 创办 Meshy 前因打造 Taichi GPU 编程语言而知名，具有 MIT 博士训练背景。
      claimRefs:
        - CO005
        - CO006
  foundingLocation: San Jose, California, United States
  headquarters: San Jose, California, United States
  productSummary: >-
    文本生成 3D 与图像生成 3D 的 AI 生成能力，叠加 AI PBR 贴图、自动绑定 / 动画、重网格、Meshy 3D Agent、面向 3D 打印的 Auto
    Split、多格式导出（FBX、OBJ、GLB、USDZ、STL）、引擎插件，以及带企业控制项的 REST API。
  customerFocus: 游戏开发者、3D 艺术家、产品和工业设计师、制造商、3D 打印创作者、电商品牌和教育用户。
  businessModel: 免费增值模式，叠加付费订阅层级（Pro/Premium/Studio/Ultra）、企业方案，以及按积分计费的 API 授权。
  stage: Series B
