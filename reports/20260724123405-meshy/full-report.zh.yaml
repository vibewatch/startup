          - type: paragraph
            body: >-
              财务和执行风险在于，Meshy 的公开叙事已经跑在变现质量的公开证明前面。融资报道指向全球扩张和研发，但没有披露毛利率、烧钱、净留存、客户集中度、付费转化或每个成功资产的 GPU
              成本。拥有数百万用户的免费增值产品仍可能经济上脆弱：免费使用可能吃掉推理容量，付费用户可能在新鲜感之后流失，企业合同也可能要求沉重赔偿保障和支持。创始人 / CEO Ethan Hu 是公司故事的核心；当
              Meshy 从产品驱动采用走向企业销售、合规和支持时，这会带来关键人物和组织扩张问题。打破投资命题的测试很具体：留存低于基准、来源问题未解、安全控制失败，或下轮融资承压，都会改变投资姿态。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR045
              - CR046
              - CR050
