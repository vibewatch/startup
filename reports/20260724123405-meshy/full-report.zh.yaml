            body: >-
              Meshy 的反向案例不是单点失败，而是估值、竞争、法律来源、地缘政治审查和执行负荷之间的相互作用。公司有可信规模信号，包括公开声称生成资产超过 1 亿，以及第三方报道注册用户超过 1200
              万；但这些采用指标本身不能证明企业转化、毛利率或持久留存。2026 年 7 月融资抬高了门槛：按报道 $1.5 billion 估值，即使用约 $30 million ARR 的基准尽调假设，进入倍数也约为
              50x ARR。因此，最高优先级尽调是把已观察事实与剩余暴露拆开：验证 ARR 质量、客户集中度、GPU 经济性，以及 Meshy 关于隐私、训练数据和输出所有权的缓释主张是否能对目标企业用例形成合同约束。
