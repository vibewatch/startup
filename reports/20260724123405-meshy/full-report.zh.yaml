      - number: '8.4'
        title: 估值驱动因素与下行风险
        blocks:
          - type: paragraph
            body: >-
              正向估值驱动来自品类稀缺、产品宽度、使用规模，以及 2026 年市场对 AI 增长的奖励。 AI 应用正进入 3D 工作流，Meshy 也吃到了这条叙事红利。反向驱动同样关键：免费增值漏斗可以做出亮眼的
              注册用户和模型生成指标，却不一定带来同比例的付费留存；在位厂商和大型 AI 平台可能削弱差异化； 更广泛的 AI 市场仍容易遭遇炒作周期重置。持怀疑态度的估值资料强调资本效率和盈利路径， 上述字段正是 Meshy
              尚未公开披露的内容。核心尽调问题，是从免费用户到账户付费再到留存 ARR 的收入质量桥接， 并配上工作流级毛利率。没有这条收入桥接，投资人承销的可能只是用户规模观感，而不是经济耐久性。
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV041
              - CV042
              - CV049
          - type: table
            tableRef: TV005
            claimRefs:
              - CV041
              - CV042
              - CV044
              - CV045
              - CV046
      - number: '8.5'
        title: 退出路径、流动性与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Meshy 的退出路径存在，但不近在眼前。2026 年融资与退出市场新独角兽多、 IPO/M&A 活动更强，给可选性提供支撑；创意软件或 AI 基础设施领域的战略买家也有合理理由关注 3D
              资产生成。不过，IPO 准备度需要经审计的收入质量、治理、留存、利润率，以及可预测的企业客户扩张； 并购准备度需要证明 Meshy 拥有工作流层，而不是一个可替换的模型功能。最终尽调清单应聚焦六项：
              收入质量、毛利率、股权结构条款、企业客户牵引、护城河耐久性和退出准备度。如果六项均得到验证， ARR 扩大后，当前估值可以从偏撑走向合理。如果结果令人失望，同一价格会变得昂贵， 因为倍数压缩会直接传导为下行风险。
            claimRefs:
              - CV017
