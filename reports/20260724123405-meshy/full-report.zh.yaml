  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Meshy 的相关市场不是整个 3D 软件行业。核心边界是借助 AI 从文本、图像、对话或 API 调用生成可编辑 3D 资产；当这些能力替代手工资产制作时，市场应包括资产生成、贴图、重网格 /
              拓扑、导出和开发者集成。若艺术家仍在 Maya、Blender 或 Substance 里手工建模，传统 DCC
              授权开支不应计入，尽管这些工具仍是工作流背景和替代预算。素材商店购买也不应计入，除非买方正在用生成的定制资产替代库存模型。元宇宙世界、数字孪生、3D 渲染、AR/VR 商务和 3D
              打印等相邻领域重要，因为它们消耗 3D 内容；但它们应被视为需求池，而不是整体计入 Meshy 的 TAM。这个边界可以防止重复计算。
