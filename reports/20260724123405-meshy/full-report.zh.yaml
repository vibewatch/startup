            body: >-
              财务反向解读是透明度不足，而不是没有牵引力。已审阅公开来源没有披露毛利率、CAC、回本周期、NRR、GRR、月度烧钱、资金跑道或付费客户数。相比低算力 SaaS，这些遗漏对 Meshy 更重要，因为 AI 3D
              生成可能承担有意义的推理、模型训练和基础设施成本；免费增值产品也可能累积亮眼用户数和模型数，却没有相称的付费留存。订阅基准来源也强调，经常性收入质量取决于留存、扩张和订户行为，而 Meshy
              没有公开任何一项。投资人因此应拆开三层：官方牵引力、可观察标价，以及拿不到的私有经济性。必要尽调路径是搭一座队列级收入桥，从注册用户到付费账户再到留存 ARR，并附上工作流层面的毛利率和云成本。
