  topStrengths:
    - Category-leading scale with 12M+ registered users and 100M+ models generated on the platform
    - Nearly $400M Series B at a $1.5B valuation, the largest AI-3D round to date, with ~12x YoY ARR growth
    - Broad product surface (text/image-to-3D, texturing, rigging, 3D-printing loop, API) and strong ecosystem/enterprise adoption signals
  topRisks:
    - Stretched ~50x ARR valuation dependent on years of durable execution and monetization ramp
    - Existential competition from OpenAI/Google/NVIDIA/Adobe entering 3D and fast-improving open-source 3D models
    - China-linked investor base for a US company raises CFIUS/geopolitical exposure, plus AI training-data copyright risk
  unresolvedGaps:
    - No disclosed total capital raised, cap table, headcount, gross margin, burn, or runway
    - Freemium-to-paid conversion, retention/NRR, and unit economics (CAC/LTV) are not public
    - ARR is reported inconsistently across sources ($30M official vs higher third-party marks), limiting revenue-quality underwriting
