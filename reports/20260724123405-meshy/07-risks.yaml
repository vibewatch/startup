  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: CFIUS investor-rights review
    missingEvidence: Cap table, side letters, board observer rights, information rights, and counsel analysis of CFIUS reviewability.
    whyItMatters: Public investor names flag a risk but cannot prove control, access rights, or mandatory filing obligations.
    diligencePath: Request cap-table documents and an outside-counsel memo mapping rights to CFIUS and outbound-control rules.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
    - TR003
  - type: conflicting-data
    severity: material
    topic: model differentiation versus open-source alternatives
    missingEvidence: Current head-to-head benchmarks on identical prompts, topology quality, texture quality, generation latency,
      retry rate, and enterprise workflow acceptance.
    whyItMatters: Open-source releases show commoditization pressure, but public evidence does not quantify Meshy's remaining
      technical lead.
    diligencePath: Run blinded benchmark tests against Hunyuan3D, TRELLIS, TripoSR, Tripo, and Hyper3D on investor-selected
      prompts.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR006
  - type: private-evidence-only
    severity: blocking
    topic: financial model evidence
    missingEvidence: ARR bridge, paid conversion, gross margin, GPU cost per successful generation, burn, runway, NRR, churn,
      and customer concentration.
    whyItMatters: The reported valuation cannot be underwritten without knowing whether usage converts into durable high-margin
      recurring revenue.
    diligencePath: Request management accounts, cohort retention, cloud/GPU invoices, pipeline, top-customer schedule, and
      board-approved operating plan.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: Regulatory / legal risk register completeness
    missingEvidence: Formal legal memo covering every jurisdiction, active claim, insurance policy, and customer contract
      exception.
    whyItMatters: The public register is necessarily partial and may miss non-public disputes, takedowns, or regulator inquiries.
    diligencePath: Have counsel confirm no pending claims and reconcile public-source register against internal legal matter
      list.
    relatedQuestionRefs:
    - QR017
    - QR022
    relatedTableRefs:
    - TR001
