  - TR003
  figureRefs:
  - FR003
- id: financial-execution-risk
  title: Financial model, key-person, and execution risk
  body: 'The financial and execution risk is that Meshy’s public narrative has outpaced public proof of monetization quality.
    Funding coverage points to global expansion and R&D, but does not disclose gross margin, burn, net retention, customer
    concentration, paid conversion, or GPU cost per successful asset. A freemium product with millions of users can still
    be economically fragile if free usage consumes inference capacity, if paid users churn after novelty use, or if enterprise
    contracts demand heavy indemnity and support. Founder/CEO Ethan Hu is central to the company’s story, raising key-person
    and organizational scaling questions as Meshy moves from product-led adoption to enterprise sales, compliance, and support.
    The thesis-break tests are concrete: retention below benchmark, unresolved provenance, security-control failure, or down-round
    financing pressure would all change the investment stance.'
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  - CR009
