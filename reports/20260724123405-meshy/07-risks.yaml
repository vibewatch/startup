company:
  name: Meshy
chapter:
  number: 7
  title: Risk Analysis
  summary: Meshy's risk profile is dominated by adverse legal provenance, open-source and incumbent competition, U.S.-China/CFIUS
    scrutiny, and valuation sensitivity at a reported $1.5 billion price. The chapter separates public facts from inferred
    residual exposure and converts each top risk into concrete diligence asks and thesis-break triggers.
sections:
- id: severity-ranked-risk-view
  title: Severity-ranked risk view
  body: 'Meshy’s adverse case is not a single-point failure; it is the interaction of valuation, competition, legal provenance,
    geopolitical scrutiny, and execution load. The company has credible scale signals, including public claims of more than
    100 million generated assets and third-party reporting of more than 12 million registered users, but those adoption metrics
    do not by themselves prove enterprise conversion, gross margin, or durable retention. The July 2026 financing creates
    a high bar: at a reported $1.5 billion valuation, even a canonical diligence assumption of roughly $30 million ARR implies
    about a 50x ARR entry multiple. The highest-priority diligence work is therefore to separate observed facts from residual
    exposure: verify ARR quality, customer concentration, GPU economics, and whether Meshy’s mitigation claims around privacy,
    training data, and output ownership are contractually enforceable for target enterprise use cases.'
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR046
  - CR050
  tableRefs:
  - TR001
  figureRefs:
  - FR001
  - FR004
- id: competitive-existential-risk
  title: Competitive and existential risk
  body: 'The competitive threat is unusually severe because Meshy is squeezed from three directions at once. Open-source releases
    such as Hunyuan3D, TRELLIS, TRELLIS.2, and TripoSR lower the cost for developers to reproduce parts of the generation
    stack or benchmark against public alternatives. Direct product competitors such as Tripo and Hyper3D Rodin market similar
    text-or-image-to-3D experiences, while incumbents such as Adobe and NVIDIA own entrenched professional workflows, distribution,
    and rendering infrastructure. Google and OpenAI add a platform risk: even if their current public pages are broader than
    3D asset generation, their model and agent platforms can absorb adjacent creation workflows. The investment implication
    is that Meshy’s moat must be workflow depth, speed, data-rights posture, community, and enterprise trust—not simply access
    to a capable 3D foundation model.'
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
