- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Valuation stretch
    - ARR quality and net retention
    - ARR materially below $30M or weak expansion retention
    - Do not underwrite 50x ARR; reprice or pass
  - - Copyright provenance
    - Dataset audit and indemnity scope
    - No auditable provenance or narrow/uninsured indemnity
    - Block enterprise-heavy investment case
  - - CFIUS/geopolitical
    - Investor rights and data access
    - China-linked rights include sensitive technical information access
    - Require counsel opinion and mitigation before investment
  - - Production quality
    - Customer shipped-asset proof
    - Demos dominate and production customers require heavy manual cleanup
    - Treat Meshy as prosumer tool, not enterprise platform
  - - GPU economics
    - Gross margin and retry rate
    - High retry/support load or weak gross margin after paid conversion
    - Cut valuation multiple and demand usage controls
  - - Key-person execution
    - Leadership bench and operating metrics
    - No scaled GTM/compliance leadership post-Series B
    - Condition investment on senior hires and board reporting
  notes: Kill criteria translate the risk register into diligence tests; thresholds are investment-policy triggers, not company-disclosed
    guidance.
