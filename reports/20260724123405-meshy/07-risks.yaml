- id: technology-quality-risk
  title: Technology, quality, and production-readiness risk
  body: The quality risk is not that Meshy lacks useful output; the stronger adverse reading is that usefulness for ideation
    and background assets may not translate into AAA, hero-asset, or deformation-critical production use. Meshy’s own product
    pages emphasize speed and ease of creation, and the 2026 product coverage highlights Smart Topology and 3D-printing improvements,
    but independent workflow review still notes manual adjustment needs for some character-generation cases. That gap matters
    because professional buyers pay for reliability, predictable topology, IP-safe reuse, and low cleanup time. A model that
    creates compelling first drafts can still face gross-margin pressure if support, regeneration, or human cleanup becomes
    necessary for enterprise adoption. The diligence ask is to inspect before-and-after meshes, failed prompts, generation
    retry rates, and customer evidence showing shipped production assets rather than demos.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR043
  - CR044
  - CR045
  tableRefs:
  - TR002
  figureRefs: []
- id: ip-legal-regulatory-risk
  title: IP, copyright, and regulatory risk
  body: 'Legal exposure is the canonical adverse-source domain for this chapter. Meshy’s policies improve the customer story
    by describing paid-user output ownership, enterprise training-data protections, U.S.-based AWS storage, and security certifications.
    However, AI copyright law remains unstable in 2026: public trackers list active training-data lawsuits, and the Anthropic/Bartz
    settlement created a large monetary benchmark while preserving important distinctions between lawful training use and
    allegedly pirated acquisition. Meshy’s 3D domain adds extra uncertainty because inputs and outputs can include copyrighted
    characters, game assets, industrial designs, scans, and user-provided reference art. The most important mitigation is
    not generic terms language; it is auditable training-data provenance, enterprise indemnity scope, takedown handling, and
    proof that customer or uploaded assets are not used outside contracted permissions.'
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
  tableRefs:
  - TR005
  figureRefs: []
- id: geopolitical-security-risk
  title: Geopolitical, CFIUS, cybersecurity, and data-residency risk
  body: Meshy is described as U.S.-operated through Meshy LLC, yet its financing coverage names several China-linked or China-origin
    investment brands, including IDG Capital, Matrix Partners China, HongShan, BAI Capital, and Source Code Capital. That
    does not establish wrongdoing, control, or reviewability, but it does create a diligence flag in a U.S.-China AI environment
    where government and media sources are explicitly warning about AI IP theft, distillation, cyberattacks, and insider threats.
    Treasury’s CFIUS framework and GAO’s mitigation work show that foreign-investment risk can turn on access to sensitive
    technical information, governance rights, data, and control rights. Meshy should be underwritten with a clean cap-table
    rights review, data-access map, insider-threat controls, and customer-facing answers on where generated assets and uploads
    reside.
  claimRefs:
  - CR008
  - CR010
  - CR011
  - CR012
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
  - CR041
