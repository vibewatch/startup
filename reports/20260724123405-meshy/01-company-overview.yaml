company:
  name: Meshy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Meshy is a Silicon Valley-rooted AI 3D creation platform that announced nearly $400M of Series B capital at a $1.5B
    valuation in July 2026. The strongest evidence supports substantial usage and product breadth, while the main
    diligence risks are private-company metric opacity, a founder-centric leadership record, and conflicting
    ARR/valuation summaries.
sections:
  - id: identity-and-product
    title: Identity and product surface
    body: >-
      Meshy is best understood as a private, Silicon Valley-rooted AI 3D creation platform rather than a narrow design
      utility. The official product and help surfaces define the company around text-to-3D, image-to-3D, AI texturing,
      animation, and API workflows, with outputs intended for game development, 3D printing, AR/VR, product design,
      education, and content creation. The product proposition is unusually concrete for a generative-AI company: users
      start from text, an image, or a concept, preview the resulting asset, and export it into standard 3D workflows.
      Public sources support San Jose/Silicon Valley as the operating locus and 2021 as the founding year, but the
      strongest official pages emphasize mission and scale more than incorporation records or registered-office detail.
      The chapter therefore treats Meshy as a US-positioned, private Series B company whose exact legal entity, cap
      table, and employee base still require primary diligence.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO024
      - CO026
      - CO028
      - CO029
      - CO034
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: leadership-and-dependence
    title: Leadership and key-person dependence
    body: >-
      The public leadership record is highly founder-centric. Meshy repeatedly names Ethan Hu as founder and CEO, and
      the evidence for founder-market fit is strong: Hu is described as an MIT-trained Ph.D. in computer graphics and AI
      and is associated with Taichi, an open-source GPU programming language used in high-performance graphics contexts.
      That background maps tightly to Meshy’s technical problem: generating geometry, textures, animation-ready assets,
      and production-export formats at speed. The adverse implication is governance opacity rather than a known
      personnel problem. Reviewed public sources did not disclose a complete executive bench, independent directors, or
      board composition. For underwriting, that means diligence should confirm whether Meshy has operational leaders
      capable of scaling enterprise sales, infrastructure, security, and finance if the founder remains the dominant
      technical and external voice.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO021
      - CO022
      - CO023
    tableRefs:
      - TO002
  - id: funding-valuation-and-investors
    title: Funding, valuation, and stakeholder map
    body: >-
      The clearest company-stage signal is the July 2026 Series B: Meshy announced nearly $400 million at a $1.5 billion
      valuation, with Yahoo carrying the same company-distributed release and independent summaries repeating the main
      financing facts. The chapter uses $1.5 billion as the canonical valuation because the release is direct and
      timestamped, while The SaaS News’ over-$1.38 billion figure is treated as a lower conflicting summary rather than
      the report-wide anchor. Investors named publicly include IDG Capital, Matrix Partners China, Monolith Management,
      Granite Asia, HongShan or Sequoia China, BAI Capital, and Source Code Capital. The use of proceeds is broad but
      coherent: foundation-model R&D, infrastructure, and global enterprise expansion. The risk is that prior-round
      terms, exact ownership, debt, secondaries, and investor rights remain private, while the named investor set is
      materially China-linked for a company presented as Silicon Valley-based.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO037
      - CO038
      - CO039
    tableRefs:
      - TO003
  - id: scale-and-disclosure-quality
    title: Scale, KPIs, and disclosure quality
    body: >-
      Meshy’s top-line scale story is unusually specific for a private AI tooling company, but still unaudited. The July
      2026 release reports more than 12 million registered users, more than 100 million models created, and
      approximately 12x year-over-year ARR growth. The March 2026 GDC release gives a more precise $30 million ARR
      milestone, while 36Kr later reported ARR exceeding $40 million in April 2026 and described aggressive internal
      AI-native operating practices. Those figures are directionally supportive but not equivalent to audited revenue,
      cohort retention, gross margin, net revenue retention, or cash-burn evidence. Headcount is especially unresolved:
      36Kr mentions a 150-person operating concept, but that is framed as internal philosophy rather than a verified
      current employee count. For the overview, unsupported cover metrics are carried as null or gap items rather than
      padded with database estimates blocked behind restricted sources.
    claimRefs:
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO035
      - CO036
      - CO040
      - CO042
      - CO044
    figureRefs:
      - FO003
  - id: milestones-and-adverse-checks
    title: Milestones and adverse checks
    body: >-
      The milestone record shows a company that moved from product launch to scaled commercial narrative quickly. A
      third-party profile places the initial Meshy-1 public launch in October 2023; official and company-distributed
      sources then show successive expansion into Meshy 6, Meshy Labs, Meshy 3D Agent, Auto Split, printability, Unity
      workflows, and a Formlabs-related printing workflow. The adverse screen did not uncover a public lawsuit,
      sanctions item, or regulatory enforcement action in the reviewed source set, but it did uncover three material
      diligence caveats: conflicting ARR and valuation summaries, restricted access to investor databases, and ambiguity
      around whether some product-workflow references are formal partnerships or tutorials. That distinction matters
      because later chapters should not convert product-marketing proof into contractual customer or channel evidence
      without source-level confirmation.
    claimRefs:
      - CO030
      - CO031
      - CO032
      - CO033
      - CO036
      - CO038
      - CO041
      - CO043
      - CO044
    tableRefs:
      - TO004
    figureRefs:
      - FO001
