summary:
  headline: >-
    Meshy is the scale and mindshare leader in AI 3D generation with an exceptional user base and growth, but its ~$1.5B
    valuation prices in roughly 50x ARR against unproven monetization, intensifying big-tech and open-source
    competition, and a China-linked investor base.
