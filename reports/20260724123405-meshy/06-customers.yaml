tables:
- id: TU001
  title: Customer segment map
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale or traction signal
  - Revenue or strategic value
  - Diligence gap
  rows:
  - - Game studios and indie developers
    - Artists, producers, technical artists; studio or self-serve payer
    - Base meshes, characters, props, game-engine-ready assets
    - Customer page and case article cite Jupiter, 37 Interactive, and game workflows
    - High strategic value because game asset volume is recurring and workflow-integrated
    - No public paid-seat count, ACV, or game-studio retention
  - - 3D-printing hobbyists and tabletop creators
    - Makers, TTRPG creators, print-service users; self-serve or API payer
    - Printable miniatures, figurines, keychains, personalized objects
    - Thorns Tavern and Form Now evidence show AI-to-print workflows
    - Strategic bridge from digital models to physical fulfillment
    - Printability quality and fulfillment economics are not disclosed
  - - Professional 3D artists and designers
    - Artists, product designers, industrial designers; individual or team payer
    - Concept iteration, texturing, remesh, rigging, export to DCC tools
    - Official use cases and plugins support Blender, Unity, Unreal workflows
    - Paid tools and credits can monetize higher-frequency professionals
    - Depth of features for advanced users is challenged by reviews
  - - Education and XR creators
    - Teachers, students, educators, AR/VR creators; school or individual payer
    - Learning assets, Roblox-compatible classroom/game design, spatial content
    - Help center has education plan and official use cases include XR & Education
    - Low-friction adoption can seed future creators and institutions
    - No public school count, renewal rate, or education revenue
  - - Enterprise/API integrators
    - Product teams, game/platform operators, manufacturers; enterprise payer
    - Programmatic model generation, bulk workflows, embedded custom products
    - API docs define Pro-plus access and Enterprise rate limits
    - Potentially highest ACV and strongest workflow lock-in
    - Enterprise account count, NRR, and contract length undisclosed
  notes: Segmentation is based on public use-case, customer-story, help, and documentation sources; it does not estimate revenue
    mix.
