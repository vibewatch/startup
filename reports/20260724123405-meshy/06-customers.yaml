  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: conversion
    missingEvidence: Paid subscribers, active users, free-to-paid conversion, enterprise account count, and conversion by
      cohort.
    whyItMatters: The public funnel proves awareness and usage but not the durability or monetization rate of that usage.
    diligencePath: Request monthly cohort tables for registrations, active users, paid upgrades, paid seats, enterprise accounts,
      and churn.
    relatedQuestionRefs:
    - QU007
    - QU018
    - QU030
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, logo retention, churn, renewal rate, and contract duration by customer segment.
    whyItMatters: Retention determines whether the large user base becomes recurring revenue or remains promotional usage.
    diligencePath: Review subscription billing cohorts, enterprise renewal files, cancellation reasons, and support escalations
      for the last eight quarters.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU030
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: customer-enumeration
    missingEvidence: Complete customer list, customer count by segment, geography, size, and revenue band.
    whyItMatters: Public named references may over-represent successful deployments and cannot measure concentration risk.
    diligencePath: Request anonymized customer roster with ARR bands, segment tags, geography, acquisition channel, and renewal
      status.
    relatedQuestionRefs:
    - QU008
    - QU026
    - QU027
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: quality
    missingEvidence: Verified defect rates, generation failure rates, printability repair rates, refunds, and quality-related
      churn.
    whyItMatters: Adverse review themes around depth, performance, scalability, and printability could cap enterprise adoption
      or paid conversion.
    diligencePath: Run a blinded output-quality benchmark and review support-ticket tags, refund reasons, and enterprise SLA
      compliance.
    relatedQuestionRefs:
    - QU020
    - QU024
    - QU030
    relatedTableRefs:
    - TU004
