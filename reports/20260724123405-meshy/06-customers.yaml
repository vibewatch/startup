    severity: material
    topic: partnership-economics
    missingEvidence: Contract terms, revenue share, partner-sourced revenue, and dependency obligations for Form Now and printer
      ecosystem partners.
    whyItMatters: Partnerships can expand distribution but may also create dependency, margin, or roadmap risk.
    diligencePath: Review partner agreements, integration usage, partner-sourced revenue, and technical support obligations.
