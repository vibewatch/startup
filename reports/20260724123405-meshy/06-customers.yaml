company:
  name: Meshy
chapter:
  number: 6
  title: Customers & Traction
  summary: Meshy has unusually strong top-of-funnel traction and several named workflow case studies, but public evidence
    does not disclose active users, paid conversion, retention, or concentration. The chapter treats customer demand as real
    while carrying quality, credit, attribution, and conversion opacity as diligence risks.
sections:
- id: segment-map
  title: Customer segmentation and buyer/user map
  body: 'Meshy’s customer surface is broad rather than concentrated in one narrow vertical. The clearest public segments are
    game and media creators, 3D-printing and maker workflows, XR or education use cases, and professional 3D artists or designers
    who need faster ideation. Official use-case language frames Meshy as a bridge into game engines, slicers, motion pipelines,
    and AR viewers, which implies both individual creator adoption and team workflow insertion. The customer page and production
    cases add named proof in game-adjacent studios, glasses-free 3D display hardware, and tabletop-miniature production. For
    diligence, the important distinction is that user segments are visible but payer segmentation is not: free creators, paid
    self-serve subscribers, API integrators, and Enterprise teams are all plausible, yet public sources do not allocate revenue
    or retention by segment. That makes the segmentation investable as demand evidence, but incomplete as a revenue-quality
    map.'
  claimRefs:
  - CU001
  - CU002
  - CU006
  - CU032
  - CU033
  - CU043
  - CU048
  tableRefs:
  - TU001
  figureRefs:
  - FU003
- id: named-customer-proof
  title: Named customers and quantified workflow outcomes
  body: 'The strongest customer proof is not logo breadth; it is the presence of named references with quantified workflow
    outcomes. Meshy’s own customer page names Stratton Studios, Thorns Tavern, and Jupiter, while the HackerNoon production
    article adds 37 Interactive Entertainment and more detailed production mechanics. Jupiter is the cleanest quantified case
    because both Meshy’s page and the production write-up point to a one-week-to-two-hour workflow change, reported as a 98%
    production-time reduction. Thorns Tavern is strategically different: the Meshy API is described as embedded in a consumer
    custom-miniature pipeline, reducing modeling time from one to two weeks to minutes and cutting per-model cost by 80%.
    Those cases support real workflow value, but they remain vendor-visible references rather than independently audited renewals
    or revenue commitments.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU047
  - CU048
