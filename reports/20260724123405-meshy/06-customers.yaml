  - TU002
  figureRefs:
  - FU002
- id: adoption-traction-funnel
  title: Adoption trajectory and conversion visibility
  body: 'Meshy’s top-of-funnel traction is unusually visible for a private AI tooling company: the July 2026 financing announcement
    states more than 12 million registered users and more than 100 million models created, while March 2026 GDC messaging
    cited more than 10 million users and 100 million models. Those figures are meaningful because they show global awareness
    and workload scale, and they are corroborated by independent republication and directory coverage. They do not, however,
    prove monetization quality. Registered users can include dormant free accounts, generated models can include low-value
    experimentation, and no reviewed public source discloses paid subscribers, active users, cohort retention, enterprise
    account count, or free-to-paid conversion. Underwriting should therefore treat Meshy as having strong adoption evidence
    but a still-private conversion bridge from usage to durable revenue.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU044
  - CU045
  tableRefs:
  - TU003
  figureRefs:
  - FU001
- id: satisfaction-and-adverse-signals
  title: Satisfaction, retention, and adverse signals
  body: 'The public satisfaction record is mixed in a way that matters for diligence. Independent directories generally describe
    Meshy as accessible and useful for rapid 3D generation, and TopAI.tools reports a high recommendation share across a small
    review base. At the same time, SaaSHub records adverse themes: the product may not provide the depth demanded by advanced
    users, and performance or scalability can concern demanding design environments. Meshy’s own help content also acknowledges
    practical production issues by publishing articles on hollow 3D-printing models and printability checks. These are not
    thesis-breaking by themselves; every generative 3D workflow needs cleanup. But they do show why customer success, quality
    controls, credit economics, and paid-conversion evidence should be diligence priorities rather than assumed from raw user
    count. Public retention metrics are absent.'
  claimRefs:
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
  - CU039
  - CU040
  - CU041
  - CU042
  - CU044
  - CU045
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: partnerships-and-distribution
  title: Partnerships, distribution, and expansion paths
  body: 'Meshy’s expansion path is broader than a browser tool. The Formlabs Form Now report is the most concrete distribution
    proof because it links Meshy creation to professional physical manufacturing and reports a two-day finished-part promise.
    The same report names xTool, Snapmaker, Flashforge, and MakerWorld/Bambu Lab as ecosystem partners or integrations around
    AI-generated physical output. On the digital-production side, official documentation and help materials support plugins
    or workflows for Blender, Unity, Unreal, Roblox, and Godot. This creates multiple land-and-expand vectors: creators can
    start free, upgrade for credits and API access, integrate assets into production tools, and potentially move to Enterprise
    for higher API limits and retention. The remaining risk is concentration opacity: partner dependence, channel revenue
    share, and customer concentration are not publicly quantified.'
  claimRefs:
