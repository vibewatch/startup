evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current employee count from a company source, payroll export, LinkedIn Recruiter snapshot, or investor data room.
    whyItMatters: >-
      Headcount is needed to assess operating leverage, burn, enterprise-sales capacity, and whether the AI-native
      organization claim is credible.
    diligencePath: Request current org chart, department-level headcount, hiring plan, and payroll reconciliation from management.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Cap table, prior financing terms, option pool, liquidation preferences, investor rights, debt, and secondary-sale
      detail.
    whyItMatters: The $1.5B valuation cannot be interpreted without ownership, preferences, and prior-round context.
    diligencePath: Request fully diluted cap table, financing documents, investor consent rights, and board observer list.
    relatedQuestionRefs:
      - QO033
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: investor-database-corroboration
    missingEvidence: Readable Crunchbase, Tracxn, and PitchBook profiles for Meshy.
    whyItMatters: These databases may contain headcount, funding-history, and investor fields not present in public releases.
    diligencePath: Use licensed database access or ask management to export profile screenshots with source dates.
    relatedQuestionRefs:
      - QO034
  - type: conflicting-data
    severity: material
    topic: arr
    missingEvidence: Monthly ARR bridge from December 2025 through July 2026 with gross revenue retention and refunds.
    whyItMatters: Public $30M ARR and 36Kr’s higher later ARR report cannot be reconciled without company books.
    diligencePath: Request ARR waterfall, billing system export, revenue recognition policy, and customer-cohort retention.
    relatedQuestionRefs:
      - QO020
      - QO040
  - type: missing-source
    severity: minor
    topic: partnership
    missingEvidence: Executed agreement or joint announcement confirming whether Formlabs is a contractual partner.
    whyItMatters: A tutorial workflow should not be counted as channel traction unless a commercial relationship exists.
    diligencePath: Ask management for partner contract, revenue contribution, and joint go-to-market plan.
