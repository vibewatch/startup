    diligencePath: >-
      Request management cohort data by segment: registered users, active creators, paid seats, API accounts, ARR,
      retention, and expansion.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: conflicting-data
    severity: material
    topic: market-boundary
    missingEvidence: >-
      Analyst reports use different category boundaries for AI 3D assets, texturing, gaming AI, rendering, metaverse,
      and digital twins.
    whyItMatters: A single TAM number could overstate Meshy's addressable spend by counting adjacent platform or hardware revenue.
    diligencePath: Normalize paid market reports to software/API asset-generation revenue by end market and geography.
    relatedQuestionRefs:
      - QM021
      - QM026
  - type: missing-source
    severity: minor
    topic: segment-revenue
    missingEvidence: No public source breaks Meshy's ARR among games, 3D printing, product design, ecommerce, education, and API use.
    whyItMatters: Segment mix drives gross margin, sales motion, retention, and valuation comparables.
    diligencePath: Ask for ARR waterfall by segment, ACV, CAC, NRR, and top customer concentration.
