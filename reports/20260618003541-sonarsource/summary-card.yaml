summary:
  headline: >-
    Sonar is the category-defining code-quality and clean-code leader with massive developer adoption and deep Fortune
    100 penetration, but financial opacity, a four-year-stale $4.7B mark, and AI-era SAST commoditization warrant
    tracking rather than conviction.
