- id: comparable-multiples-and-market-reset
  title: Comparable Multiples and the 2022-to-2026 Market Reset
  body: 'Comparable evidence pushes against taking $4.7B at face value. Public SaaS and developer-tool multiples compressed
    materially after 2021, with several 2026 data providers placing median public SaaS revenue multiples in the low-to-mid
    single digits and premium developer-tool names dispersing widely by growth and profitability. GitLab provides a mature
    public DevSecOps floor, Datadog and JFrog show what premium public outliers can command, and Snyk is the closest private
    developer-security comp. The private AppSec set is also mixed: Veracode, Checkmarx, Sonatype, Semgrep, Sentry, and Snyk
    all support strategic value, but not a single clean answer for Sonar''s current mark.


    The most relevant comp conclusion is dispersion. Sonar deserves a premium to generic SaaS if its developer adoption, Fortune
    100 penetration, AI-code-verification narrative, retention, and margins are real. But a 20x-plus multiple is still a high
    bar in 2026. The adverse stance is not that Sonar is impaired; it is that multiple compression means the same $4.7B headline
    now requires materially more revenue proof than it did in 2022. Without audited ARR, NRR, growth, margin, or a recent
    mark, comparable valuation supports a range rather than a point estimate.'
  claimRefs:
  - CV010
  - CV011
  - CV012
  - CV013
