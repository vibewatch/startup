- id: TV007
  title: Final Diligence Asks and Kill Triggers Table
  columns:
  - Topic
  - Missing Evidence or Trigger
  - Why It Matters
  - Action Implication
  rows:
  - - Revenue / ARR
    - Audited revenue, ARR bridge, bookings, deferred revenue
    - Determines whether $4.7B is 48x, 24x, or lower
    - Block buy until received
  - - Retention
    - NRR, GRR, churn, expansion by product and segment
    - Validates premium multiple durability
    - Require best-in-class retention for premium entry
  - - Margins / FCF
    - Gross margin, EBITDA, FCF margin, Cloud/support COGS
    - Required for Rule-of-40 and DCF-lite
    - Downgrade if growth consumes cash inefficiently
  - - Cap table
    - Liquidation preferences, option pool, debt, primary/secondary split
    - Headline valuation may not equal common-equity value
    - Model investor returns under actual preference stack
  - - Valuation mark
    - Latest 409A, secondary trades, investor marks
    - Tests whether $4.7B survived market reset
    - Reprice if discounted secondary exists
  - - Competition/pricing
    - Win/loss vs GitHub, Snyk, Semgrep, Checkmarx and realized discounting
    - Compression can hit NRR and multiple
    - Kill trigger if pricing pressure is structural
  - - IPO readiness
    - S-1 status, auditor readiness, bank mandate, public-company controls
    - Exit timing affects liquidity and target multiple
    - Track if IPO remains speculative
  notes: Rows combine diligence asks and thesis-break triggers; absence of evidence does not prove weakness but blocks a high-conviction
    buy call.
