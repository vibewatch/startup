- id: recommendation-exit-and-diligence
  title: Recommendation, Exit Paths, and Final Diligence Asks
  body: 'The IC recommendation is research-more / track at the $4.7B reference price. Sonar has real strengths: category recognition,
    7M+ developers, 75%+ Fortune 100 penetration, a large capital raise, and an AI-code-verification narrative that could
    expand demand. It also has plausible exit paths. An IPO is signaled by leadership choices and scale ambition, while strategic
    or PE outcomes are plausible given Veracode, Checkmarx, and Sonatype transaction history. However, no public S-1 or official
    IPO timetable exists, and private-company illiquidity makes the stale mark less useful for entry discipline.


    The diligence path is therefore explicit. Do not underwrite a new investment at $4.7B unless management supplies audited
    revenue, current ARR, ARR bridge, NRR/GRR, gross margin, FCF margin, cash, burn, debt, customer concentration, realized
    pricing, cap table, liquidation preferences, and the latest 409A or secondary marks. A verified revenue run-rate below
    $150M, a discounted secondary, weak retention, or evidence that GitHub and open-source alternatives are compressing pricing
    should move the stance toward avoid. Conversely, audited revenue above $250M-$300M with strong Rule-of-40 metrics could
    move the mark from stretched to fair.'
