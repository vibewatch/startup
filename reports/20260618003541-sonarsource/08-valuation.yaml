  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: Audited 2024-2026 revenue, current ARR, ARR bridge, bookings, deferred revenue, and revenue recognition
      policy
    whyItMatters: The implied valuation multiple ranges from roughly 48x to 23.5x depending on unaudited revenue estimates.
    diligencePath: Request audited financials, ARR bridge, bookings report, deferred revenue schedule, and revenue-recognition
      memo under NDA.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV032
    relatedTableRefs:
    - TV002
    - TV004
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: Latest 409A valuation, investor marks, secondary transaction prices, and any post-2022 financing terms
    whyItMatters: The Series D mark is four years stale and may not reflect the 2026 multiple environment or private illiquidity.
    diligencePath: Request board materials, 409A reports, tender-offer records, investor marks, and preferred-stock financing
      documents.
    relatedQuestionRefs:
    - QV003
    - QV029
    - QV030
    - QV032
    relatedTableRefs:
    - TV001
    - TV007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: NRR, GRR, gross margin, EBITDA, FCF margin, CAC payback, churn, and Cloud/support COGS
    whyItMatters: These metrics decide whether Sonar deserves a premium Rule-of-40 or public-outlier multiple.
    diligencePath: Request SaaS KPI pack by segment, product, cohort, and deployment model.
    relatedQuestionRefs:
    - QV020
    - QV028
    relatedTableRefs:
    - TV005
    - TV007
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: Full banker-grade comparable-company and precedent-transaction set with exact EV, revenue, growth, margin,
      and term adjustments
    whyItMatters: The comparable valuation table is a representative sample, not a complete fairness-opinion comp deck.
    diligencePath: Build a banker-quality comp workbook from subscribed Capital IQ/PitchBook/FactSet data and company filings.
    relatedQuestionRefs:
    - QV008
    - QV009
    - QV010
    - QV011
    - QV012
    - QV013
    - QV014
    relatedTableRefs:
