  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Cap table, liquidation preferences, participation rights, debt, warrants, option pool, and primary-vs-secondary
      split in the Series D
    whyItMatters: Headline valuation may not translate into the same economics for a new investor or common shareholders.
    diligencePath: Request fully diluted cap table, preferred-stock purchase agreements, investor-rights agreement, debt schedules,
      and option-pool model.
    relatedQuestionRefs:
