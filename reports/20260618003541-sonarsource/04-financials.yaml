callouts:
  - calloutType: strength
    title: "Recurring Software Model with Scalable Value Metric"
    body: >
      Sonar monetizes through recurring Cloud and Server commercial editions where LOC growth, enterprise controls, and support needs can expand contract value without per-developer seat friction.
    claimRefs: [CI002, CI003, CI004, CI005, CI008]
  - calloutType: risk
    title: "Valuation and Revenue Estimates Are Not Underwriteable Yet"
    body: >
      The $4.7B valuation is a 2022 financing mark, while 2024-2026 revenue estimates conflict across Latka, Growjo, Owler, and the high-case diligence brief; audited revenue, ARR, retention, margin, and cash burn are required.
    claimRefs: [CI009, CI012, CI014, CI015, CI026, CI033, CI040]
  - calloutType: assumption
    title: "High Gross Margin Is Plausible but Unproven"
    body: >
      Sonar should have software-like gross-margin potential, yet Cloud hosting, enterprise support, services, and acquisition integration costs are not quantified publicly, so margin and FCF remain data-room questions.
    claimRefs: [CI017, CI022, CI023, CI034]

