      - number: '2.2'
        title: 规模测算口径：TAM、SAM、SOM 与冲突估计
        blocks:
          - type: paragraph
            body: >
              公开市场规模记录足够不一致，保留区间比选择单一 TAM 更诚实。Forrester 的 2026 年 SAST 评论称，SAST 已是成熟市场，竞争和整合加剧；Mordor 估算 SAST 2026 年为
              $0.68B，到 2031 年增至 $1.89B，CAGR 为 22.82%。MarkWide 给出大得多的 SAST 软件口径：2026 年 $1.85B，2035 年 $7.26B，CAGR 为
              16.4%。Verified Market Research 使用更宽的 AST 定义，报告 2023 年 $33.2B，到 2031 年升至 $56.2B，CAGR 为 26.25%；这是有用的上限，但会高估
              Sonar 眼前可触达市场，因为其中包含静态代码验证之外的测试方式和服务。


              一个务实的市场堆栈是：窄口径 SAST 作为地板；加入 SCA 和技术债管理构成 Sonar 的 SAM；把 AI 代码审查 / 验证视为增长最快的扩张层；完整 AST / 开发者工具篮子只作为 TAM
              背景。Mordor 的开发者工具口径在 2026 年为 $7.44B，CAGR 为 16.12%；AI 代码工具口径在 2026 年为 $9.35B，CAGR 为 26.23%。AI
              代码助手市场波动更大：MarketsandMarkets 估计 2025 年为 $8.14B，到 2032 年达 $127.05B，CAGR 为 48.1%。Sonar 的 SOM
              受当前收入代理约束，而不是市场规模约束：共享的 canonical 估计是 2024 年约 $98M，2026 年向约 $200M 迈进，这意味着在窄口径 SAST 中份额为低个位数，在更大的 AI
              代码工具机会中份额更小。
