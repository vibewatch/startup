      - number: '4.3'
        title: 利润率、单位经济与运营效率
        blocks:
          - type: paragraph
            body: >
              Sonar 可能的毛利率画像应更接近高毛利软件和 SaaS，而不是服务，但这是推断，不是已披露事实。公司销售分析器和托管 / 自管理软件，而不是库存密集型硬件；增量 Cloud
              使用、支持、客户成功和自托管维护应是主要交付成本。SonarQube Server 也把部分基础设施负担推给客户，而 SonarQube Cloud
              在内部承担托管和运营成本。这种组合通常支持较强的毛利潜力，但公开来源没有披露 Cloud 占比、托管成本、支持强度、专业服务附加率或毛利率。


              效率信号混合，但不令人警惕。Latka 的 $98.1M 收入和 869 名员工，意味着人均收入约 $113K。Growjo 的 $139.1M 收入和 748 名员工，意味着约 $186K。Tracxn 的
              950 名员工估计结合相同的 2026 年收入区间，意味着效率显著更低：在 $139M 时约 $146K，在 $200M 时约 $211K。这些估计来自不一致的分母，不是管理层 KPI。最大的未知数是 CAC
              payback、净收入留存、毛利率、R&D 资本化，以及 AI 收购是否会在增加 ARR 前先推高整合成本。
