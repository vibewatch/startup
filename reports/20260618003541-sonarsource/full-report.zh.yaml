      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              财务结论建设性但有保留。Sonar 看起来拥有高质量的经常性软件收入模式、企业级打包、来自 AI 代码生成的可信需求顺风，以及足够的历史资本来避免明显融资困境。负面同样重要：收入未经审计，公开估计冲突，$4.7B
              估值已经陈旧，实际企业定价不透明，单位经济大多是私有信息。Vendr 的采购分析明确把 Sonar 定价描述为可变、可谈判，并依赖代码库规模和支持选择；PeerSpot
              用户指出价格竞争力、误报和安全功能缺口。这些不是偿付能力红旗，但它们是承销不确定性的直接证据。


              因此，尽调应聚焦三个问题。第一，当前收入运行率更接近 $100M、$140M 还是 $200M，其中多少是真正的订阅 ARR？第二，毛利率、净留存、CAC 回收期和人均收入是否支撑高端 SaaS 倍数？第三，在
              Tidelift、AutoCodeRover 和 Gitar 整合成本之后，现金续航是否仍然充足？没有这些私有指标，本章可以验证收入机制和融资历史，但无法验证估值公允性或 IPO 准备度。
            claimRefs:
              - CI036
