      - number: '3.2'
        title: 直接与传统 SAST 对比
        blocks:
          - type: paragraph
            body: >-
              传统 AppSec 竞争对手从上方挤压 Sonar。Veracode、Checkmarx、Coverity 和 Fortify
              卖给安全与合规团队，这些团队看重漏洞类别覆盖广度、可审计性、二进制或混合扫描，以及平台级 AppSec 覆盖。相比 Sonar，它们的弱点是开发者拉力：Sonar 的历史是在 IDE 和 CI quality
              gates 中嵌入代码质量治理，而不只是安全团队的检测队列。Snyk 和 Semgrep 则从侧面挤压 Sonar，主打开发者优先的 SAST、依赖安全、自定义规则和 AI 辅助分诊。GitLab 和
              GitHub 不同：它们把安全打包进仓库和合并工作流。对 GitHub 原生账户，CodeQL 加 Copilot Autofix 可以降低采用单独扫描器的必要性；对 GitLab 原生账户，内置 SAST
              也创造了类似的最省力路径。因此，Sonar 必须在异构 DevOps 栈中，靠质量覆盖广度、低噪声和治理一致性取胜。
