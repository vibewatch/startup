  - id: TV007
    title: 最终尽调问题与否决触发因素表
    columns:
      - 主题
      - 缺失证据或触发因素
      - 为什么重要
      - 行动含义
    rows:
      - - 收入 / ARR
        - 经审计收入、ARR 桥接、订单、递延收入
        - 决定 $4.7B 是 48x、24x，还是更低
        - 收到前阻止买入
      - - 留存
        - NRR、GRR、流失率、按产品和细分拆分的扩张
        - 验证溢价倍数能否持续
        - 只有同类最佳留存才能支撑溢价进入
      - - 利润率 / FCF
        - 毛利率、EBITDA、FCF 利润率、Cloud / 支持 COGS
        - Rule-of-40 和 DCF-lite 必需
        - 如果增长低效消耗现金，则下调判断
      - - 股权结构表
        - 清算优先权、期权池、债务、新股 / 老股拆分
        - 名义估值未必等于普通股价值
        - 按实际优先股堆叠建模投资者回报
      - - 估值标记
        - 最新 409A、老股交易、投资者标记
        - 测试 $4.7B 是否顶住市场重置
        - 如果存在折价老股交易，则重定价
      - - 竞争 / 定价
        - 相对 GitHub、Snyk、Semgrep、Checkmarx 的赢单 / 输单和实际折扣
        - 压缩可能打击 NRR 和倍数
        - 如果定价压力是结构性的，则触发否决
      - - IPO 准备度
        - S-1 状态、审计师准备度、投行授权、上市公司控制体系
        - 退出时点影响流动性和目标倍数
        - 如果 IPO 仍属猜测，则继续跟踪
    notes: 各行把尽调问题和投资逻辑破裂触发因素合并呈现；没有证据并不证明公司弱，但会阻止高确信度买入判断。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
