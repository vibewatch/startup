        - 仓库原生捆绑包
        - CodeQL、密钥 / 依赖监控、Copilot Autofix
        - Microsoft / GitHub 分发；CodeQL 对 OSS / 研究免费
        - 最危险的 GitHub 原生捆绑威胁
