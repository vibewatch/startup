            body: >-
              监管是双面风险。欧盟 Cyber Resilience Act 和 CISA Secure by Design
              运动可以加速对自动化代码验证、SBOM、漏洞处理和安全开发证据的需求。同一套制度也会提高客户对产品安全、流程文档和供应商问责的期待。Sonar 发布了法律、DPA
              和高级安全条款；本章来源集中唯一审阅到的公开诉讼事项是 2023 年提起的一起商标案，未发现重大产品安全诉讼或已披露泄露。但没有发现并不等于尽调闭环。IC
              应要求法律清单、开源许可证合规证据、网络保险、漏洞披露记录、NDA 下的 SOC 2，以及 kill-trigger 仪表盘。结构性风险需要定价纪律；可管理风险需要缓释成熟度证据和可监控阈值。
