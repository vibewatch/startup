      - number: '6.5'
        title: 持久性、扩张、集中度和证据缺口
        blocks:
          - type: paragraph
            body: >
              Sonar 的持久性信号是间接的。最强的留存代理指标是工作流嵌入：质量门禁一旦配置进 CI/CD，SonarQube for IDE 同步规则配置，PR 装饰出现在 GitHub、GitLab、Bitbucket
              和 Azure DevOps 中，管理层仪表盘或合规报告依赖该系统，切换成本就会上升。官方文档和 marketplace 列表显示其与 Azure DevOps、Bitbucket、面向 GitHub 的工作流和
              SonarQube Cloud 扩展集成；客户故事也显示其在数千个代码库和项目中标准化。这些都是可信的扩张机制，尤其适用于受监管金融服务、医疗、公营部门相邻行业和大型多语言企业。


              但公开证据没有披露 Sonar 的净收入留存、毛收入留存、logo 流失、平均合同期限、头部客户集中度、付费客户数或 cohort
              扩张。不同来源的组织数口径不一致，可能混合了免费、社区、开源、推断和付费使用。具名案例研究有选择性且由公司发布，所以它们是成功部署的优秀证据，却不能代表中位客户结果。因此尽调应要求一份分层客户瀑布，拆分
              Community Build、Cloud Free、Team、Enterprise Cloud、Developer、Enterprise 和 Data Center；并要求按细分的 logo 留存和 NRR、按
              LOC 区间的扩张、流失原因、续约涨价、支持工单 SLA，以及前 20 大客户集中度。
