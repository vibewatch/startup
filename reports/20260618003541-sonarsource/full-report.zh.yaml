      - number: '8.3'
        title: 熊 / 基准 / 牛情景和估值方法
        blocks:
          - type: paragraph
            body: >-
              估值情景采用收入倍数，因为公开证据不足以支撑完整 DCF。ARR、NRR、毛利率、EBITDA、FCF、现金、现金消耗和债务都未公开，所以轻量 DCF 只能做敏感性演练。熊情景假设 Sonar 收入更接近
              $140M，并获得 8x 倍数，对应约 $1.1B 企业价值。基准情景使用共享的 2026 年高估计 $200M，以及 12x 的高溢价 AppSec / 开发者工具倍数，对应约 $2.4B。牛情景要求收入接近
              $300M，或有清晰的 IPO 级增长、留存和利润率证据；按 18x 计算，可达到约 $5.4B。


              这个区间说明 $4.7B 标记有可能成立，但不是基准情景。若要在今天证明它合理，Sonar 可能需要证明自己更接近牛情景而非基准情景：持续高增长、强企业扩张、软件级毛利率、有限定价摩擦，以及可信 IPO
              窗口。如果收入更接近 $100M-$150M，或公开 SaaS 倍数仍是正确基准，该估值就会高出好几倍收入。因此本章把估值立场定为偏高，而非公允。
