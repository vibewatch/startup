      - number: '6.2'
        title: 具名客户证明和生产环境证据
        blocks:
          - type: paragraph
            body: >
              Sonar 的具名客户证据比单纯 logo 墙更强，因为多篇官方客户故事把工具与具体生产流程连了起来。Cisco 将 SonarQube 描述为 AI-first 工程战略的集中验证层，SonarQube for
              IDE 和 SonarQube 指标会进入开发者工作流和管理层仪表盘；案例研究提到三个月修复 27,000 个问题，部分团队生产力最高提升 3x。Xero 报告从本地部署迁移到 SonarQube
              Cloud，接入 3,500 个代码库，并在全球产品团队中统一质量门禁。Freshworks 称其管理超过 2,000 个 GitHub 代码库，并把 SonarQube 嵌入标准 CI
              模板，让每个拉取请求都通过质量门禁检查、安全分析和秘密检测。


              欧洲案例研究补上了受监管行业证据。IMSA 是法国第二大健康保险组织的 IT 供应商，报告称将 SonarQube Server 作为超过 2,000 个项目的强制质量门禁，覆盖 Java、COBOL 和
              JavaScript，并提到代码覆盖率从 40% 提升到 60%。Findomestic Banca 是 BNP Paribas Personal Finance 的子公司，与 GitLab、Jenkins、IQ
              Server Lifecycle 和 Fortify 一起使用 SonarQube Server，微服务测试覆盖率提升 70%，新代码中的 bug 和安全漏洞接近为零。DEPT 将 SonarQube Cloud
              描述为全球团队的集中验证层，问题识别速度提升 60%，排障时间至少下降 30%。
