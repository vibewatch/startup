            body: >
              公开收入数据相互冲突。Latka 称 Sonar 2024 年收入达到 $98.1M，团队 869 人；Growjo 估计当前年收入为 $139.1M，人均收入 $185,900。Owler 把 Sonar
              放在宽泛的 $100M-$500M 年收入区间，一份尽调简报则提示第三方 2026 年估计接近
              $200M。这些来源都未经审计，且若干轮次标签或员工数彼此冲突，因此正确处理方式是区间，而不是点估计。唯一由公司披露的收入目标是定性且愿景式的：Sonar 称 Series D 将帮助公司向 $1B 收入迈进。


              隐含的增长挑战很陡。如果 Latka 的 2024 年 $98.1M 大方向正确，达到 $1B 需要约十倍增长。如果 2026 年基数更接近 $139M，剩余差距仍约七倍；如果第三方高位估计 $200M
              正确，Sonar 仍需要约五倍增长。对一个拥有 700 万+ 开发者、Fortune 100 渗透率和 AI 代码顺风的品类领导者，这可能成立；但公开数据没有披露 ARR、净留存、客户数、总流失率或按 LOC
              层级的队列扩张。这些缺口比任何单个追踪平台估计的精确度更重要。
