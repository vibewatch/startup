companyProfile:
  summary: >
    SonarSource 以 Sonar 为品牌运营，是一家位于日内瓦地区（瑞士 Vernier）的代码质量和代码安全公司，2008 年由 Olivier Gaudin、Freddy Mallet 和 Simon Brandhof
    创立。Sonar 打造 SonarQube 系列静态分析产品，用来发现开发者编写代码、第三方代码和 AI 生成代码中的 bug、代码异味和安全漏洞。产品组合覆盖自托管的 SonarQube Server（以及免费的
    Community Build）、SaaS 版 SonarQube Cloud（原 SonarCloud）和 IDE 原生的 SonarQube for IDE（原 SonarLint），由「Clean Code」方法论和
    Quality Gates 串起来。Sonar 称，已有 700 多万开发者和超过 75% 的 Fortune 100 采用。2022 年 4 月，公司完成 $412M Series D，估值 $4.7B，由 Advent
    International 和 General Catalyst 领投，Insight Partners、Permira 参投；此后收购 AutoCodeRover、Tidelift 和 Gitar，向智能体式 AI
    代码验证推进。Tariq Shaukat（前 Google Cloud 和 Bumble 总裁）在 2023 年 9 月以联席 CEO 身份加入后，成为唯一 CEO；联合创始人 Olivier Gaudin 转任 Founder
    and Chairman。
