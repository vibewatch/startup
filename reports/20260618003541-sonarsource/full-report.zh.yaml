            body: >-
              竞争风险分为三条线。第一，平台打包方可以吸收安全预算：GitHub、GitLab 和 Microsoft 已经掌握代码库、CI/CD、身份和开发者工作流界面，增量 SAST 和 AI
              修复很容易被打包进更大的企业续约。第二，CodeRabbit、CodeAnt、Qodo 和 Greptile 等 AI-native
              审查工具切入拉取请求审查时刻，实施摩擦更低，并围绕速度、精度和代码库感知推理来讲故事。第三，开源替代正在变强：Sonar 的 Community Build 仍是免费的自托管选项，OpenGrep
              表明静态分析生态可以围绕商业条款分叉。这些是结构性风险，不只是功能缺口，因为它们扎根于工作流控制和买方整合。尽调要按细分对比 Sonar 相对于 GitHub Advanced Security、GitLab
              Ultimate、Snyk、Semgrep/OpenGrep 和 AI 审查创业公司的 win/loss 数据。
