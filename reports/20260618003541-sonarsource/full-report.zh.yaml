  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险论点和严重性排序
        blocks:
          - type: paragraph
            body: >-
              Sonar 的风险画像并非由某一起已披露诉讼、泄露或偿付能力事件主导；真正主导它的是强势在位者特许经营权与快速压缩市场之间的碰撞。最大的结构性风险是：SAST 和代码质量检查被嵌入开发者平台和 AI
              代码审查工作流，而不再作为独立品类采购。GitHub Code Security 把 CodeQL、Copilot Autofix、依赖审查和安全活动组合在开发者已经工作的同一个拉取请求流程中，GitLab 和
              Microsoft 也在延伸类似的平台逻辑。Sonar 的缓释因素是庞大装机基础、语言深度、企业治理能力，以及通过 Gitar 进入 AI 代码验证；但剩余敞口是真实的：如果买方把静态分析视为一个功能，Sonar
              就必须证明自己是验证系统记录，而不是又一个扫描器。财务不透明和收购执行是接下来两个尽调重点。
