      - number: '2.3'
        title: 买方、用户、付款方与采用分层
        blocks:
          - type: paragraph
            body: >
              Sonar 由开发者拉入组织，但通常通过工程和安全预算变现。开发者和团队负责人是日常用户：他们要 IDE 反馈、pull-request decoration、更少误报和更少后期返工循环。优先事项是标准化代码质量
              gates、降低技术债、扩大 AI 辅助开发且不牺牲可维护性时，工程领导和平台团队就是经济买方。当 SAST、漏洞优先级排序、SBOM / SCA
              和可审计性绑定到合规项目、软件供应链风险或受监管发布时，AppSec 团队和 CISO 会成为买方或共同买方。采购和财务塑造最终方案，因为企业版本通常按代码行、用户或仓库范围计价。


              采用路径通常是自下而上到平台化，而不是单个 CISO 指令。开发者或团队先采用 SonarQube Community Build、SonarQube for IDE、GitHub checks 或云试用；平台
              / 安全团队随后在仓库间标准化 gates；当合规报告、分支 / PR 工作流、SCA、治理和支持需求超过免费或开源能力时，企业交易扩大。GitHub 默认的公开仓库代码扫描和 secret scanning
              构成强大的捆绑替代，但私有 / 内部仓库需要 GitHub Advanced Security 产品，给中立的多 SCM 供应商留下空间。因此，买方地图会按部署模式分裂：cloud-first SME
              关注速度和成本；受监管企业关注自托管、数据主权、审计轨迹，以及跨 GitHub、GitLab、Bitbucket、Azure DevOps 和 IDE 的政策一致性。
