      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Sonar 最关键的融资事件是 Series D：2022 年 4 月 25–26 日，公司宣布以 $4.7B 估值融资 $412M。该轮由新投资者 Advent International 和 General
              Catalyst 领投，既有投资者 Insight Partners 参投，Permira 的 Growth Opportunities Fund 也加入。Sonar 称，资金将用于全球商业化扩张，推动公司向
              $1B 收入迈进。Insight Partners 作为「既有投资者」参投，说明 Series D 之前至少还有一轮规模较小的融资；第三方数据库把 Sonar 的累计融资额放在略高于 $412M
              标称数字的水平，但公司没有公布完整的逐轮融资历史。


              $4.7B 估值让 Sonar 成为明确的独角兽，也成为欧洲最有价值的开发者工具公司之一。Sonar 是私营公司且偏向盈利，没有在 2022
              年之后披露新一轮融资，也没有披露经审计财务或官方更新估值。众包和分析师估计显示，收入从 2024 年约 $98M（Latka）升至 2026 年估计
              $200M（第三方追踪平台），但这些数字未经验证，且相互冲突。投资财团中没有战略或企业投资者，保留了 Sonar 作为中立工具供应商横跨不同云和开发者生态的独立性。因此，Sonar
              的披露画像是私营未披露：资本充足的成长阶段公司，财务基本面必须靠代理指标和第三方数据推断。
