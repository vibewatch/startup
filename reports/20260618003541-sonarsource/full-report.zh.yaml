  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点、隐含倍数和陈旧性
        blocks:
          - type: paragraph
            body: >-
              Sonar 的估值分析从一个硬锚点开始：2022 年 4 月 Series D。Sonar 宣布获得 $412M 新投资，估值 $4.7B，由 Advent International 和 General
              Catalyst 领投，Insight Partners 和 Permira Growth Opportunities 参与。这个标记作为融资事实可信，但作为 2026 年公允价值估计很弱。它大约已有四年，发生在
              2021-2022 年软件估值繁荣接近尾声时，之后没有官方一级融资、IPO 申报或已披露二级交易刷新。因此本章把 $4.7B 视为最后一轮估值参考，而不是当前内在价值。


              隐含倍数是关键问题。使用共享规范收入估计——2024 年约 $98M——Series D 估值约等于 48x 收入。即便 Sonar 接近第三方 2026 年高情景估计 $200M，该估值仍隐含约 23.5x
              收入。这些是高溢价软件倍数，不是普通 SAST 或开发者工具倍数，而且所有收入数字都未经审计。因此正确投资立场应对价格敏感：Sonar 可能是一家优秀公司，但公开记录无法证明今天的公允价值等于陈旧的 2022
              年标记。
