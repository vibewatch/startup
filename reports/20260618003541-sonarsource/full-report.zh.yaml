      - number: '6.4'
        title: 客户满意度、评论主题和批评
        blocks:
          - type: paragraph
            body: >
              公开评论整体偏正面，但不能无歧义地证明企业留存。评论聚合器和评论摘要集中在高评分：G2 的网页搜索摘要显示 141 条评论约 4.4/5，Gartner Peer Insights 约 124 条评论
              4.3/5，Capterra/Software Advice 约 4.5/5，TrustRadius 约 8/10，PeerSpot 约 4.0/5，推荐信号为
              84%。反复出现的正面主题包括广泛语言支持、质量门禁、CI/CD 集成、PR 反馈、技术债可视化和开发者教育。Capterra 评论特别提到 Azure DevOps、Jenkins、Bitbucket、PR
              装饰和对开发者友好的修复指引；PeerSpot 则强调本地安装、社区版价值、仪表盘、Jenkins 集成和质量门禁控制。


              负面一侧对尽调很重要。PeerSpot 的优缺点页面称，SonarQube 需要为社区用户提供更好的支持和文档，存在误报和漏洞检测问题，定价也可以更有竞争力。Capterra
              评论者提到误报、报告生成延迟、小企业授权费用高、本地部署使用困难，以及跨组合的高管报告耗时。独立 2026 年评论还补充，自托管需要持续 DevOps 工作，Community Build
              缺少分支分析和拉取请求装饰，基于 LOC 的计费可能让买方意外，AI-native 竞争对手在对话式代码审查上更强。这些批评不会抵消强采用，但界定了低成熟度团队和接近付费 LOC
              阈值的大型代码库中的流失与扩张风险。
