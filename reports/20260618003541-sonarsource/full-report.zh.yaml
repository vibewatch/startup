      - number: '7.3'
        title: 产品、技术和安全风险
        blocks:
          - type: paragraph
            body: >-
              产品风险可管理，但必须被度量，而不是靠叙事带过。评论仍提到误报、动态分析缺口、成本和自托管运维摩擦；这些问题重要，因为开发者信任是任何代码质量工具的货币。AI
              抬高了门槛：一个产生噪声问题的确定性扫描器，可能被优先提供有用拉取请求评论的工具替代，即便后者在合规完整性上更弱。Sonar 的缓释因素有意义：信任中心材料提到 ISO 27001:2022、SOC 2 Type
              II、渗透测试、安全 SDLC 控制、每个拉取请求上的 SAST，以及云韧性实践。但代码扫描会制造不对称安全敞口，因为扫描报告可能包含源代码。因此 Sonar 的安全姿态需要通过 SOC 2
              报告、渗透测试摘要、事件历史、漏洞披露记录，以及 Tidelift 带来的 SCA 增量已经整合而非并列存在的证据来私下验证。
