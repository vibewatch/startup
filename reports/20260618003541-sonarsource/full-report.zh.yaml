              SonarQube Server 2026.1 LTA 是一个重要产品里程碑，因为它把一年的 AI、安全、语言和平台工作打包进长期活跃发布线。同一版本也提高了运维要求：Server 现在要求 Java 21 或
              Java 25 以及完整 JDK，从 Helm chart 中移除嵌入式 PostgreSQL 依赖，并更新支持的数据库、scanner、Kubernetes 和 OpenShift 范围。这进一步强化了
              Server 与 Cloud 的权衡。自托管客户获得控制权、插件灵活性、数据驻留和 Data Center Edition 中的 HA 选项，但也继承升级、数据库管理、容量规划、备份和运行可靠性。Cloud
              客户能以显著更低的运维负担更快获得平台更新，但在插件和驻留约束上控制更少。集成广度足以满足多数企业 SDLC：GitHub、GitLab、Bitbucket、Azure DevOps、Jenkins /
