  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础、规模和细分
        blocks:
          - type: paragraph
            body: >
              Sonar 的采用基础覆盖个人开发者、开源项目、SMB 团队、中型市场工程组织和大型受监管企业。最强的规模事实仍来自公司披露，而非审计数据：Sonar 及其产品页面称，超过 700 万开发者使用 Sonar，超过
              75% 的 Fortune 100 依赖 SonarQube，社区成员超过 45,000 人。Sonar 自己的 SonarQube 产品页还称，平台获得全球超过 700 万开发者和 500,000
              家组织信任；Atlassian Marketplace 上 SonarSource 的文案则提到超过 6,000 家商业客户，以及被超过 200,000 家组织信任的 Community
              Edition。这些数字方向一致，但并不完全相同。因此最稳妥的解读是：Sonar 已有广泛全球渗透，但不同官方页面对“组织数”的定义并不一致。


              独立需求数据供应商提供了第二层视角，但同样不完美。Landbase 列出 5,511 家经验证使用 SonarQube 的公司，TheirStack 列出 21,554 家公司和用户，6sense 报告超过
              11,929 家公司将 SonarQube 用作代码质量工具。这些数据集有助于三角验证采用情况，但不能等同于付费客户数，因为它们可能通过技术信号、招聘信息、网页和公开痕迹推断使用情况。按细分看，产品先由开发者和
              DevOps 团队带入企业；一旦团队需要拉取请求装饰、分支分析、合规仪表盘、企业语言、数据驻留或支持，平台工程、安全、合规或工程领导层就会把它纳入预算。
            claimRefs:
