      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >
              四个结构性驱动支撑 Sonar 的品类扩张。第一，AI 生成代码增加审查量和不确定性：GitHub 报告平台上有 1.8 亿+ 开发者、2025 年合并 5.187 亿个 pull requests，并且超过
              110 万个公开仓库使用 LLM SDK；Sonar 的调查称，使用 AI 工具的开发者提交的代码中有 42% 为 AI 生成或 AI 辅助，The Register 则指出，只有 48% 的人总是在提交前检查
              AI 辅助代码。第二，监管把 secure-by-design 和供应链透明度推入产品要求：EU Cyber Resilience Act 从 2026 年 9 月起引入强制性网络安全要求和报告义务，CISA
              则把 SBOM 视为软件供应链风险管理的关键构件。第三，技术债已经成为董事会能读懂的成本语言；CISQ 的标准把静态分析发现转化为未来纠正性维护成本，Sonar 引用 Gartner 的观点称，到 2027
              年架构技术债将占技术债的 80%。第四，shift-left DevSecOps 让 IDE 和 CI 集成比周期性审计更有价值。


              约束同样重要。Forrester 将 SAST 描述为成熟市场，竞争、整合和差异化压力并存。GitHub 的免费公开仓库保护和企业原生 GHAS 产品，为以 GitHub 为中心的组织设置了低摩擦默认选择。开源
              AppSec 栈能以零许可证成本为小团队覆盖 SAST、SCA、IaC、secrets 和 DAST。AST 工具也面对调优开销：一个 AST
              市场来源把集成复杂度和误报列为约束，这呼应了用户层面的担忧——信噪比差会降低开发者生产力。尽调缺口不是市场是否够大，而是 Sonar 在捆绑平台和开源替代压缩独立产品定价之前，能把 AI 代码验证扩张变现多少。
