      - number: '1.4'
        title: 产品组合、品牌更新与规模
        blocks:
          - type: paragraph
            body: >
              2024 年底命名更新后，Sonar 的产品组合围绕 SonarQube 品牌组织，并把产品名称统一到 SonarQube 之下。SonarQube Server
              是自托管分析器（原本简单称为「SonarQube」）；SonarQube Cloud 是 SaaS 产品（原 SonarCloud）；SonarQube for IDE 是编辑器内扩展（原
              SonarLint）；SonarQube Community Build 是免费的开源版本。平台在开发者编写代码、第三方代码和 AI
              生成代码中执行静态分析、静态应用安全测试（SAST），并越来越多覆盖软件组成分析（SCA），通过 quality gates 集成到 IDE 和 CI/CD 流水线。


              从 2024 年底开始，Sonar 通过收购驱动转向 AI 时代的代码验证。2024 年 12 月 17 日，公司宣布达成收购 Tidelift（开源供应链风险）的最终协议；2025 年 2 月收购
              AutoCodeRover，这是一家从 National University of Singapore 拆分出的自主 AI 软件工程 agent；2026 年 5 月 21 日收购 AI 原生代码审查平台
              Gitar。三笔交易合在一起，把 SonarQube 定位为覆盖第一方、开源和 agent 生成代码的「AI 代码验证」层。Sonar 披露的规模指标包括 700 万+ 开发者、75%+ 的 Fortune
              100、每天分析 7500 亿行代码，以及 4.5 万+ 社区成员。不过，独立评论者仍反复指出产品批评点——复杂代码中的残余误报、自托管部署的运维负担、按代码行计价在规模化时成本较高，以及免费 Community
              Build 功能受限——这些都冲淡了公司的采用叙事。
