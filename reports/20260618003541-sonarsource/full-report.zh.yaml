      - number: '7.4'
        title: 财务、执行和领导力风险
        blocks:
          - type: paragraph
            body: >-
              财务风险的核心是能否承保。Sonar 的 $4.7B 估值已经过去四年，没有公开审计财务，收入估算仍来自第三方且相互冲突。公司运营上可以非常有吸引力，但如果没有
              ARR、增长、毛利率、NRR、客户集中度、cohort 扩张和现金消耗证据，仍很难定价。执行风险又放大了这种不透明：公司在约十八个月内推进 AI 验证转向，同时吸收 Tidelift、AutoCodeRover
              和 Gitar。Gitar 在战略上合理，但它让 Sonar 直接进入嘈杂的 AI-native 代码审查市场，而核心 SonarQube
              特许经营权还必须继续服务企业合规买方。领导力风险中等，而非迫在眉睫：Tariq Shaukat 带来 IPO 扩张经验，Olivier Gaudin 仍任创始人兼董事长，但单一 CEO 过渡和
              Geneva/Austin 双运营模式应通过管理层背调、继任覆盖和整合 OKR 来测试。
            claimRefs:
