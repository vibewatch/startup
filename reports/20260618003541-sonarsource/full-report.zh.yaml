      - number: '8.4'
        title: 建议、退出路径和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              IC 建议是在 $4.7B 参考价格下继续研究 / 跟踪。Sonar 有真实优势：品类认知、700 万+开发者、75%+ Fortune 100 渗透、大额融资，以及可能扩大需求的 AI
              代码验证叙事。它也有可行退出路径。领导层选择和规模雄心释放了 IPO 信号；考虑 Veracode、Checkmarx 和 Sonatype 的交易历史，战略收购或 PE 结果也合理。不过，没有公开 S-1
              或官方 IPO 时间表，私有公司流动性不足也让陈旧标记不太适合作为入场纪律。


              尽调路径因此很明确。除非管理层提供审计收入、当前 ARR、ARR 桥接表、NRR/GRR、毛利率、FCF 利润率、现金、现金消耗、债务、客户集中度、实际定价、股权结构、清算优先权，以及最新 409A
              或二级市场估值，否则不要按 $4.7B 承保新投资。若验证后的收入运行率低于 $150M、出现折价二级交易、留存较弱，或有证据表明 GitHub 和开源替代正在压缩定价，立场应转向回避。反过来，如果审计收入超过
              $250M-$300M 且 Rule-of-40 指标强，估值标记可以从偏高转为公允。
