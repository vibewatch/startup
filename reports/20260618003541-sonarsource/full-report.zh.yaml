            body: >-
              产品最强的技术资产是覆盖广度、工作流位置和机构成熟度。Sonar 覆盖大量语言和 IaC 表面，坐在 IDE 和 CI/CD
              中，并拥有足够治理功能服务大型企业和受监管团队。弱点是静态分析的经典取舍：广度和确定性规则带来有用覆盖，但动态行为、业务逻辑、运行时授权缺陷和不常见框架模式，仍需要测试、威胁建模、DAST / IAST 或专门
              AppSec 工具。独立评论也指出误报噪声和调优工作；Sonar 自己的规则文档把可维护性 / 可靠性误报目标设为零，漏洞真阳性目标设为超过
              80%，但尽调应要求客户遥测，而不是依赖供应商目标。SCA、Tidelift 整合、Gitar 整合、AutoCodeRover 商业化、AI CodeFix
              接受率、可用性历史和实际误报率，仍是重要的私有证据请求。
