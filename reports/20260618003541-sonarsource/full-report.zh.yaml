      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              Sonar 的领导层由技术创始人和经验丰富的商业运营者共同组成。联合创始人 Olivier Gaudin 在公司大部分历史中担任 CEO，现任 Founder and Chairman。2023 年 9
              月，Tariq Shaukat 以联席 CEO 和董事身份加入，任务是把公司推向最终具备上市公司画像的规模；他曾任 Google Cloud 总裁和 Bumble 总裁，并帮助 Bumble 完成 IPO。到
              2026 年，Shaukat 被称为 Chief Executive Officer，Gaudin 转任 Founder and Chairman，显示公司有意推进从创始人到职业 CEO 的接班。


              更广泛的高管团队包括 Chief Technology Officer Andrea Malagodi、EVP of Transformation Ali Adl-Tabatabai
              以及其他职能负责人。联合创始人 Freddy Mallet 和 Simon Brandhof 塑造了最初的 SonarQube 引擎和平台架构。治理受到 Series D 投资财团影响——Advent
              International、General Catalyst、Insight Partners 和 Permira 在 2022 年轮次中获得董事会代表权和经济权益。作为私营公司，Sonar
              不公开披露完整董事会构成、创始人持股比例或保护性条款，数据室仍需回答关键治理问题。联席 CEO 到 CEO 的过渡把执行责任集中在一位相对新的 CEO
              身上，同时通过董事长角色保留创始人影响力；这种结构能缓解但不能消除关键人物依赖。
