  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >
              Sonar 通过 SonarQube Server 的商业版本、SonarQube Cloud 订阅、企业支持和相关服务，把代码验证变现；SonarQube Community Build 和 SonarQube
              for IDE 仍是重要的免费或低摩擦采用入口，而不是直接收入引擎。核心公开定价信号不是按开发者授权。Sonar 自己的定价页面强调代码行数，Cloud Team 计划每月 $32 起，自托管 Developer
              版在 100K+ LOC 时每年 $750 起，Enterprise 则转向定制或销售主导的年度定价。独立采购基准描述的是同一机制：支出主要随已分析 LOC、部署模式、版本、支持和合同期限变化。


              该模式在财务上有吸引力，因为随着企业代码库增长、AI
              生成代码增加验证量，价值指标会扩张。但它也会制造买方摩擦：评论者和采购指南强调，真实企业账单包括维护、实施、基础设施、高级支持，以及潜在超额或补差成本。因此，对承销而言，标价只适合当打包地图。实际
