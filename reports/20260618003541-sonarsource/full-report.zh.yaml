            body: >-
              Sonar 的护城河持久，但并非牢不可破。持久要素包括开源安装基础、开发者熟悉度、横跨质量和安全的广泛规则覆盖、适配 CI/CD 治理的 quality
              gates，以及可信的企业采用。侵蚀向量同样具体：GitHub 可以把 CodeQL 和 Copilot Autofix 打包进主导性的仓库工作流；GitLab 可以对其 DevOps 基础做同样的事；Snyk
              和 Semgrep 可以赢得开发者优先的安全预算；Fortify、Checkmarx 和 Veracode 可以拿下受监管安全项目；AI 原生审查工具可以捕获人类和 agent
              编写代码时增长最快的交互界面。承销结论是，Sonar 应被视为代码质量加安全治理的品类领导者，但最重要的尽调工作是拿到分层级别的 win/loss 证据，尤其是对 GitHub 捆绑和 AI
