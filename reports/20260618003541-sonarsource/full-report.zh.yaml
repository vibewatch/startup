      - number: '6.3'
        title: 商业化动作、定价和扩张循环
        blocks:
          - type: paragraph
            body: >
              Sonar 的商业化动作是典型开发者工具阶梯。免费的 Community Build 和 SonarQube for IDE 先让个人开发者、开源项目或单分支项目自下而上熟悉产品。随后 SonarQube
              Cloud 给小团队一条低摩擦 SaaS 路径：官方定价显示，Team 计划每月 $32 起，可分析最多 100,000 行私有代码；免费云层级允许探索最多 50,000
              行私有项目代码。代码库、合规需求和开发者人数增加后，买方会转向 Team、Enterprise Cloud 或自托管 Server
              版本，获得基于代码行数的定价、企业语言、SSO/SCIM、审计日志、组合仪表盘、监管报告和支持。


              这套动作支撑先落地再扩张，因为产品会嵌入 CI/CD、拉取请求、IDE 和高管仪表盘。Freshworks 和 Xero 展示了从代码库接入和标准化拉取请求工作流开始的扩张；IMSA 和 Findomestic
              展示了向组合报告、质量门禁和遗留语言覆盖的扩张。同一模型也会制造摩擦：商业定价绑定分析代码行数上限，而不是席位，所以即便开发者人数稳定，代码库增长也会推高成本。第三方定价评论和 PeerSpot
              用户反复提到企业定价偏高、续约涨价、自托管开销和 Community Build 限制，尤其会成为缺少平台工程能力的小团队的采购异议。
