      - number: '8.2'
        title: 可比倍数和 2022 到 2026 的市场重置
        blocks:
          - type: paragraph
            body: >-
              可比证据不支持照单全收 $4.7B。2021 年之后，公开 SaaS 和开发者工具倍数明显压缩，多家 2026 年数据供应商将公开 SaaS
              收入倍数中位数放在低到中个位数区间，高溢价开发者工具公司则按增长和盈利能力大幅分化。GitLab 提供成熟公开 DevSecOps 下限，Datadog 和 JFrog 展示高溢价公开异常值能拿到的水平，Snyk
              是最接近的私有开发者安全可比公司。私有 AppSec 组合同样混杂：Veracode、Checkmarx、Sonatype、Semgrep、Sentry 和 Snyk 都支持战略价值，但不能给 Sonar
              当前估值一个干净答案。


              最相关的可比结论是分散。只要 Sonar 的开发者采用、Fortune 100 渗透、AI 代码验证叙事、留存和利润率属实，它就应较通用 SaaS 享有溢价。但 20x 以上倍数在 2026
              年仍是高门槛。负面立场不是说 Sonar 受损，而是倍数压缩意味着，同一个 $4.7B 标题估值现在需要比 2022 年强得多的收入证明。没有审计
              ARR、NRR、增长、利润率或近期估值标记，可比估值只支持一个区间，而不是一个点估计。
