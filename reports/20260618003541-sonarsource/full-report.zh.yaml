        title: 分析引擎、规则与架构
        blocks:
          - type: paragraph
            body: >-
              技术核心是确定性的静态分析和代码安全引擎：把源代码解析为语言特定表示，应用规则目录，并计算 Quality Gates 可执行的指标。Sonar 的公开材料强调 Clean Code
              品质——可维护性、可靠性和安全性——文档则展示具体规则治理：规则状态、语言过滤、标签、模板、自定义规则创建、profile 分配和扩展描述。安全方面，2026.1 LTA 的信息是，Sonar
              正从简单模式匹配走向更深的语义和数据流分析。Advanced Security 结合 SAST、SCA、SBOM 报告、secrets detection 和恶意包检测。关键尽调点不是 Sonar
              是否有静态分析——它显然有——而是客户是否已经把 profiles、优先规则和接受工作流调到足以在规模化时维持开发者信任。
