      - number: '1.5'
        title: 关键里程碑与负面信号
        blocks:
          - type: paragraph
            body: >
              Sonar 的轨迹大致跨越十八年，分为三个阶段：开源社区建设（2008–2018）、商业化扩张和 mega-round（2019–2023），以及 AI 验证转向（2024–2026）。开源 SonarQube
              引擎播下广泛开发者采用的种子；2022 年 Series D 提供资本和 $4.7B 估值；2023 年 Tariq Shaukat 到任，加上 Tidelift、AutoCodeRover 和 Gitar
              收购，把公司重新导向 AI 代码验证与治理。报道持续把 Shaukat 的加盟——考虑到他在 Bumble 的 IPO 经验——解读为最终上市准备，尽管截至 2026 年中 Sonar 尚未公布任何具体 IPO
              时间表。


              负面和观察项信号真实存在，但还不严重。最重要的是财务不透明：没有经审计财务、没有官方的 2022 年后估值，且第三方收入估计相互冲突，增加了承销难度。企业用户对产品层面的批评集中在动态代码误报、自托管
              SonarQube 的 DevOps 负担，以及相较 Codacy、DeepSource、CodeRabbit 和 CodeAnt 等更轻量云原生对手的价格摩擦。AI
              转向也带来整合和执行风险：十八个月内三笔收购必须被吸收，同时不能扰动核心分析器；Sonar 现在还更直接地面对一波 AI
              原生代码审查创业公司。上述事项都不是已披露的法律、监管或偿付能力事件，但合在一起定义了后续章节的尽调议程。
