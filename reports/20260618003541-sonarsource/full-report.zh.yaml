chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与总部
        blocks:
          - type: paragraph
            body: >
              Sonar 是 SonarSource SA 的运营品牌，一家软件公司，构建代码质量和代码安全工具，品牌叙事是「Clean Code」，近来又扩展到「AI 代码验证与治理」。公司 2008
              年创立于瑞士日内瓦地区（法律实体注册在日内瓦州，历史上与 Vernier 相关），三位创始工程师是 Olivier Gaudin、Freddy Mallet 和 Simon
              Brandhof。创始人围绕开源静态分析引擎 SonarQube 搭建业务；SonarQube 后来成为多语言持续代码检查的事实标准。


              Sonar 虽然创立于瑞士，法律注册地也仍在瑞士，但已逐步建立重要的美国布局，并称自己是双总部公司：在日内瓦基地之外，运营总部位于德州 Austin；美国枢纽支撑其全球商业化扩张。Sonar
              的使命是帮助开发者在缺陷进入生产环境之前，通过分析人工编写代码、AI 生成代码和第三方开源代码，交付高质量、安全的软件。截至 2026 年中，公司称超过 700 万开发者和超过 75% 的 Fortune 100
              使用 SonarQube，其引擎每天分析约 7500 亿行代码。这些规模数字来自公司披露，并可在 Sonar 自有介绍页面、新闻稿和第三方资料中相互印证，但具体组织数量因来源而异。
