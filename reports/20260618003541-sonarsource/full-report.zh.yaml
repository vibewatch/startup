  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局地图与竞争分层
        blocks:
          - type: paragraph
            body: >-
              Sonar 的竞争格局不是一场单一的 SAST 对比测试。它横跨四项重叠任务：持续代码质量治理、安全扫描、仓库原生修复，以及 AI 辅助 pull request 审查。直接安全同业包括
              Snyk、Veracode、Checkmarx、Black Duck Coverity、GitLab SAST、带 CodeQL 的 GitHub Advanced Security、Semgrep 和
              OpenText Fortify；Forrester 的 SAST 供应商集合也独立验证了其中大部分分组。Codacy、DeepSource、Code Climate 和 Embold
              等相邻质量工具竞争更轻的代码健康预算，ESLint、PMD、SpotBugs、Opengrep 和 SonarQube Community Build
              则限制窄场景或开源重度团队的付费意愿。这种分层很重要，因为当买方重视多语言 quality gates 和广泛开发者采用时，Sonar 的护城河最强；但当买方想要一个安全套件、一个仓库原生捆绑包或一个快速 AI
              审查器时，护城河会变弱。
