  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >
              不应把 Sonar 按泛网络安全公司来测算。它可防守的核心，是面向第一方代码质量和安全的静态分析：在代码合并前发现 bug、漏洞、代码异味、可维护性问题和技术债热点的规则。因此，直接纳入的支出覆盖 SAST /
              静态应用安全测试、代码质量和技术债管理工具、IDE / CI quality gates，以及被打包进同一开发者工作流的部分 SCA 和 AI 代码审查。更广义的 AST
              市场只是相邻市场，而非核心，因为其中还包含 DAST、IAST、API 测试、移动测试、渗透测试服务、ASPM 和运行时控制，这些都不是 Sonar 能完全替代的。


              最重要的市场边界细节是替代。工程组织可以继续使用人工 pull-request review、linter 规则、编译器检查、测试覆盖率和 GitHub 原生检查作为现状。安全组织可以购买
              GitHub、Snyk、Veracode、Checkmarx、GitLab、OpenText 或 Black Duck 的套件；小团队也能用
              Semgrep、Trivy、Grype、Gitleaks、TruffleHog、ZAP 和 Nuclei 等开源工具，在零许可证成本下拼出一套。Sonar 的市场不是 AppSec
              的每一美元，而是组织愿意分配给一个有观点的验证层的支出：该层在开发者工作流中统一代码质量、安全、SCA 和 AI 生成代码治理。
