        title: 产品组合与开发者工作流
        blocks:
          - type: paragraph
            body: >-
              理解 Sonar 的产品架构，最好把它看作一个分析引擎，通过四个工作流承载面暴露。SonarQube Server 是自托管控制平面，服务于希望把代码和分析数据留在自有基础设施内的企业。SonarQube
              Cloud 是托管 SaaS 路径，适合希望由 Sonar 运营基础设施、扩缩容、更新和可用性的团队。SonarQube for IDE 是 shift-left 扩展，前身为
              SonarLint；connected mode 把开发者本地规则、排除项、质量 profiles、已接受问题和通知，连接回 Server、Cloud 或 Community Build。SonarQube
              Community Build 仍是免费入口，但对现代 PR 中心的企业工作流而言，完整度明显较低。因此，客户任务是持续验证：在代码编写时识别质量和安全问题，在 pull requests 和 CI 流水线上执行
              quality gates，再把结果送入协作和审计系统。
