callouts:
  - calloutType: insight
    title: "The Direct Market Is Smaller Than the Narrative TAM"
    body: >
      The most defensible direct SAST lens is below $2B in 2026, while broader AST and AI-code-tools baskets are much larger but include spend Sonar cannot automatically capture. Valuation work should model expansion from SAST into SCA and AI verification, not assume full AST TAM penetration.
    claimRefs: [CM009, CM010, CM011, CM016]
  - calloutType: strength
    title: "AI Code Turns Verification into a Growth Market"
    body: >
      GitHub activity, Sonar's developer survey, and The Register's critique all point to the same pressure: AI is increasing code volume faster than trust and manual review capacity, which directly supports a verification-layer thesis.
    claimRefs: [CM028, CM029, CM030]
  - calloutType: risk
    title: "Bundled and Open-Source Substitutes Cap Pricing Power"
    body: >
      GitHub defaults and free open-source AppSec stacks make the low end of the market difficult to monetize; Sonar must justify paid expansion through multi-SCM governance, signal quality, SCA, AI assurance, and enterprise compliance.
    claimRefs: [CM006, CM007, CM034, CM035]

