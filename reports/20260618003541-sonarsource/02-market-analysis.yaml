schemaVersion: "report-v2"
artifact: market-analysis
slug: sonarsource
runDate: "2026-06-18"
company:
  name: SonarSource
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Sonar participates in a multi-layer market spanning code quality, SAST/static analysis, SCA, broader
    application security testing, developer tools, and AI-code verification. The narrowest source-backed SAST
    lens is roughly $0.68B in 2026, while adjacent AI-code-tools and developer-tools lenses are $9.35B and
    $7.44B respectively; the resulting investable SAM is large but fragmented, because buyers can substitute
    bundled GitHub security, open-source AppSec stacks, manual review, or adjacent AST/SCA platforms.

sections:
  - id: market-boundary-and-substitutes
    title: "Market Boundary, Included Spend, and Substitutes"
    body: |
      Sonar should not be sized as a generic cybersecurity company. Its defensible core is static analysis for first-party code quality and security: rules that find bugs, vulnerabilities, code smells, maintainability problems, and technical-debt hotspots before code is merged. The directly included spend therefore covers SAST/static application security testing, code-quality and technical-debt management tools, IDE/CI quality gates, and the parts of SCA and AI-code review that are bundled into the same developer workflow. The broader AST market is an adjacency rather than the core, because it also includes DAST, IAST, API testing, mobile testing, penetration-testing services, ASPM, and runtime controls that Sonar does not fully replace.

      The most important market-boundary nuance is substitution. Engineering organizations can continue using manual pull-request review, linter rules, compiler checks, test coverage, and GitHub-native checks as a status quo. Security organizations can buy suites from GitHub, Snyk, Veracode, Checkmarx, GitLab, OpenText, or Black Duck; smaller teams can assemble open-source tools such as Semgrep, Trivy, Grype, Gitleaks, TruffleHog, ZAP, and Nuclei at zero license cost. Sonar's market is therefore the spend organizations are willing to allocate to an opinionated verification layer that unifies code quality, security, SCA, and AI-generated-code governance in developer workflows, not every dollar spent on AppSec.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM001]
    figureRefs: [FM004]

  - id: sizing-lenses-and-tam-sam-som
    title: "Sizing Lenses: TAM, SAM, SOM, and Conflicting Estimates"
    body: |
      The public sizing record is inconsistent enough that preserving the range is more honest than selecting a single TAM. Forrester's 2026 SAST commentary says SAST is now a mature market with intensified competition and consolidation, while Mordor sizes SAST at $0.68B in 2026 growing to $1.89B by 2031 at 22.82% CAGR. MarkWide reports a much larger SAST software lens of $1.85B in 2026 and $7.26B by 2035 at 16.4% CAGR. Verified Market Research uses a broader AST definition and reports $33.2B in 2023, rising to $56.2B by 2031 at 26.25% CAGR; that is a useful ceiling but overstates Sonar's immediate addressable market because it includes testing modalities and services outside static code verification.

      A practical market stack is: narrow SAST as the floor; add SCA and technical-debt management for Sonar's SAM; treat AI-code review/verification as the fastest-growing expansion layer; and reserve the full AST/developer-tools baskets as TAM context only. Mordor's developer-tools lens is $7.44B in 2026 at 16.12% CAGR, while its AI-code-tools lens is $9.35B in 2026 at 26.23% CAGR. The AI-code-assistant market is even more volatile: MarketsandMarkets estimates $8.14B in 2025 and $127.05B by 2032 at 48.1% CAGR. Sonar's SOM is constrained by its current revenue proxy, not market size: the shared canonical estimate is ~$98M in 2024 rising toward ~$200M in 2026, implying low-single-digit share of the narrow SAST lens and a much smaller share of the larger AI-code-tools opportunity.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016, CM017, CM018]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: buyer-user-payer-segmentation
    title: "Buyer, User, Payer, and Adoption Segmentation"
    body: |
      Sonar is pulled into organizations by developers but normally monetized through engineering and security budgets. Developers and team leads are the daily users: they want IDE feedback, pull-request decoration, fewer false positives, and fewer late-cycle rework loops. Engineering leaders and platform teams are the economic buyers when the priority is standardizing code quality gates, reducing technical debt, and scaling AI-assisted development without letting maintainability degrade. AppSec teams and CISOs become the buyer or co-buyer when SAST, vulnerability prioritization, SBOM/SCA, and auditability are attached to compliance programs, software-supply-chain risk, or regulated releases. Procurement and finance shape the final package because enterprise editions are typically priced by lines of code, users, or repository scope.

      The adoption path is usually bottom-up-to-platform rather than a single CISO mandate. A developer or team adopts SonarQube Community Build, SonarQube for IDE, GitHub checks, or a cloud trial; a platform/security group then standardizes gates across repositories; and the enterprise deal expands when compliance reporting, branch/PR workflow, SCA, governance, and support requirements exceed free or open-source capability. GitHub's default public-repository code scanning and secret scanning create a powerful bundled substitute, but private/internal repositories require GitHub Advanced Security products, leaving space for neutral multi-SCM vendors. The buyer map therefore fragments by deployment model: cloud-first SMEs care about speed and cost; regulated enterprises care about self-hosting, data sovereignty, audit trails, and policy consistency across GitHub, GitLab, Bitbucket, Azure DevOps, and IDEs.
    claimRefs: [CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM026, CM027]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: growth-drivers-constraints-and-gaps
    title: "Growth Drivers, Constraints, and Diligence Gaps"
    body: |
      Four structural drivers support Sonar's category expansion. First, AI-generated code increases review volume and uncertainty: GitHub reports 180M+ developers on the platform, 518.7M merged pull requests in 2025, and more than 1.1M public repositories using LLM SDKs; Sonar's survey says developers using AI tools commit 42% AI-generated or AI-assisted code, while The Register highlights that only 48% always check AI-assisted code before committing it. Second, regulation is pushing secure-by-design and supply-chain transparency into product requirements: the EU Cyber Resilience Act introduces mandatory cybersecurity requirements and reporting obligations from September 2026, while CISA frames SBOMs as a key building block for software supply-chain risk management. Third, technical debt has become a board-readable cost language; CISQ's standard translates static-analysis findings into future corrective maintenance cost, and Sonar cites Gartner's view that architectural technical debt will account for 80% of technical debt by 2027. Fourth, shift-left DevSecOps makes IDE and CI integration more valuable than periodic audits.

      Constraints are equally material. Forrester characterizes SAST as mature, with competition, consolidation, and differentiation pressure. GitHub's free public-repository protections and enterprise-native GHAS products set a low-friction default for GitHub-centered organizations. Open-source AppSec stacks can cover SAST, SCA, IaC, secrets, and DAST at zero license cost for small teams. AST tools also face tuning overhead: one AST market source reports integration complexity and false positives as restraints, echoing user-level concerns that poor signal-to-noise reduces developer productivity. The diligence gap is not whether the market is large; it is how much of the AI-code-verification expansion Sonar can monetize before bundled platforms and open-source alternatives compress standalone pricing.
    claimRefs: [CM028, CM029, CM030, CM031, CM032, CM033, CM034, CM035, CM036, CM037, CM038, CM039, CM040]
    tableRefs: [TM004]
    figureRefs: []

