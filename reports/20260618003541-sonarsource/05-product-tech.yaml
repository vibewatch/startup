  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: signal-quality
    missingEvidence: Customer-level true-positive, false-positive, suppression, and rule-tuning telemetry by language and
      edition.
    whyItMatters: Vendor quality targets and independent reviews diverge; signal quality determines developer trust and renewal
      risk.
    diligencePath: Request anonymized enterprise telemetry, benchmark studies, and customer reference interviews.
    relatedQuestionRefs:
    - QE022
    - QE025
  - type: private-evidence-only
    severity: material
    topic: AI-adoption
    missingEvidence: AI CodeFix and Remediation Agent acceptance rates, rollback rates, security review results, and quota
      utilization.
    whyItMatters: AI features are strategic but could create risk if patches are low quality or rarely accepted.
    diligencePath: Review product analytics, design-partner case studies, and incident postmortems under NDA.
    relatedQuestionRefs:
    - QE015
    - QE017
    - QE025
    relatedTableRefs:
    - TE006
  - type: private-evidence-only
    severity: material
    topic: SCA
    missingEvidence: Detailed Tidelift integration roadmap, SCA package coverage, license-policy depth, and win/loss versus
      dedicated SCA vendors.
    whyItMatters: SCA is newer than the core analyzer and is central to the open-source supply-chain thesis.
    diligencePath: Request roadmap, coverage benchmarks, customer adoption metrics, and competitive bake-off results.
    relatedQuestionRefs:
    - QE020
    - QE023
    - QE025
    relatedTableRefs:
    - TE003
    - TE005
