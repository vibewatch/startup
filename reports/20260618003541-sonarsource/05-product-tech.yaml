- id: strengths-limitations-and-diligence-gaps
  title: Strengths, Limitations, and Technical Diligence Gaps
  body: 'The product’s strongest technical assets are breadth, workflow placement, and institutional maturity. Sonar covers
    a large language and IaC surface, sits in IDEs and CI/CD, and has enough governance features for large enterprises and
    regulated teams. Its weakness is the classic static-analysis tradeoff: breadth and deterministic rules produce useful
    coverage, but dynamic behavior, business logic, runtime authorization flaws, and unusual framework patterns still require
    testing, threat modeling, DAST/IAST, or dedicated AppSec tooling. Independent reviews also flag false-positive noise and
    tuning work; Sonar’s own rule documentation targets zero false positives for maintainability/reliability and over 80%
    true positives for vulnerabilities, but diligence should request customer telemetry rather than rely on vendor goals.
    SCA, Tidelift integration, Gitar integration, AutoCodeRover commercialization, AI CodeFix acceptance rates, uptime history,
    and realized false-positive rates remain important private-evidence asks.'
  claimRefs:
  - CE015
  - CE034
  - CE035
  - CE036
  - CE038
  - CE040
