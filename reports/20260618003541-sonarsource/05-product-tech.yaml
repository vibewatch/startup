- id: engine-and-architecture
  title: Analysis Engine, Rules, and Architecture
  body: 'The technical core is a deterministic static-analysis and code-security engine that parses source into language-specific
    representations, applies rule catalogs, and computes metrics that Quality Gates can enforce. Sonar’s public materials
    emphasize Clean Code qualities — maintainability, reliability, and security — while the documentation shows concrete rule
    governance: rule status, language filters, tags, templates, custom rule creation, profile assignment, and extended descriptions.
    For security, the 2026.1 LTA message is that Sonar is moving beyond simple pattern matching toward deeper semantic and
    data-flow analysis. Advanced Security combines SAST, SCA, SBOM reporting, secrets detection, and malicious package detection.
    The key diligence point is not whether Sonar has static analysis — it clearly does — but whether customers have tuned
    profiles, prioritized rules, and acceptance workflows enough to preserve developer trust at scale.'
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE019
  - CE039
  tableRefs:
  - TE003
