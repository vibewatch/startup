callouts:
- calloutType: strength
  title: Breadth plus workflow placement is the core moat
  body: Sonar is differentiated less by one isolated algorithm than by a broad, deterministic rules engine embedded in IDEs,
    PRs, CI/CD, and enterprise reporting. That placement makes it a policy layer for code quality and security rather than
    just a scanner.
  claimRefs:
  - CE011
  - CE013
  - CE019
  - CE021
- calloutType: strength
  title: AI strategy routes agents through verification
  body: 'AI CodeFix, AI Code Assurance, AutoCodeRover, and Gitar all point to the same thesis: AI can create or fix code,
    but Sonar wants deterministic analysis, gates, and auditability to verify the result before merge.'
  claimRefs:
  - CE024
  - CE025
  - CE027
  - CE031
  - CE032
- calloutType: risk
  title: Static analysis still needs tuning and complementary controls
  body: Independent reviews and the nature of SAST indicate that false positives, dynamic behavior, business logic, and runtime
    authorization flaws remain material limitations. Diligence should request customer-level signal-quality telemetry and
    evidence of complementary AppSec tooling.
  claimRefs:
  - CE015
  - CE035
  - CE036
  - CE040
- calloutType: risk
  title: Newer SCA and AI layers need integration proof
  body: Tidelift, AutoCodeRover, and Gitar expand the platform story, but they also create integration risk. The investment
    case needs proof that these assets are adopted, governed, and monetized without diluting SonarQube’s core analyzer trust.
  claimRefs:
  - CE030
  - CE032
  - CE033
  - CE038
  - CE040
