- id: TE003
  title: Technology and Capability Architecture Table
  columns:
  - Layer / component
  - Role
  - Technical basis
  - Dependency
  - Risk
  rows:
  - - Language analyzers
    - Parse source and generate issues
    - Language-specific AST/semantic rules
    - Analyzer coverage by edition and language
    - Dynamic features can reduce precision
  - - Rule catalog and quality profiles
    - Define quality/security policy
    - Ready/Beta/Deprecated rules, tags, custom templates
    - Admin tuning and governance
    - Untuned breadth may create false positives
  - - Quality Gates
    - Enforce release readiness
    - Metric thresholds on new/overall code
    - SCM/CI integration and branch model
    - Noisy gates can block delivery
  - - SAST / taint analysis
    - Track untrusted data to sensitive sinks
    - Context-aware data-flow analysis
    - Advanced Security/language support
    - Not a runtime/business-logic analyzer
  - - SCA / SBOM
    - Detect vulnerable dependencies and package risk
    - Dependency manifests, SBOM import, malicious package data
    - Ecosystem support and Tidelift integration
    - Newer than dedicated SCA incumbents
  - - Secrets and IaC analysis
    - Prevent leaked credentials and pipeline misconfig
    - Pattern/semantic rules for YAML/JSON/GitHub Actions/Bash
    - Repository file coverage
    - Custom secret patterns need governance
  - - AI CodeFix and remediation
    - Suggest or generate fixes
    - LLM-generated edits routed through Sonar findings
    - Model selection, quotas, privacy settings
    - Acceptance rate and safety need proof
  notes: Architecture layers are public-documentation abstractions, not an internal code architecture disclosure.
  enumerationScope:
    coverage: partial
    basis: Publicly documented platform layers relevant to SonarQube Server 2026.1 and adjacent AI products.
