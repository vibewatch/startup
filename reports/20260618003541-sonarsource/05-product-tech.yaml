company:
  name: SonarSource
chapter:
  number: 5
  title: Product & Technology
  summary: Sonar’s product stack is a mature static-analysis and code-verification engine exposed through self-hosted Server,
    SaaS Cloud, IDE extensions, and a free Community Build, now being extended with SCA and AI verification assets. The core
    strength is breadth plus workflow enforcement through rules, Quality Gates, and integrations; the diligence risks are
    tuning/false positives, self-hosted operations, newer SCA maturity, and integration proof for AI acquisitions.
sections:
- id: portfolio-and-workflow
  title: Portfolio and Developer Workflow
  body: 'Sonar’s product architecture is best understood as one analysis engine exposed through four workflow surfaces. SonarQube
    Server is the self-hosted control plane for enterprises that want code and analysis data inside their own infrastructure.
    SonarQube Cloud is the managed SaaS path for teams that prefer Sonar to operate infrastructure, scaling, updates, and
    availability. SonarQube for IDE is the shift-left extension formerly known as SonarLint, and connected mode ties a developer’s
    local rules, exclusions, quality profiles, accepted issues, and notifications back to Server, Cloud, or Community Build.
    SonarQube Community Build remains the free on-ramp, but it is materially less complete for modern PR-centric enterprise
    workflows. The customer job is therefore continuous verification: identify quality and security issues as code is written,
    enforce quality gates on pull requests and CI pipelines, then feed results into collaboration and audit systems.'
  claimRefs:
