- id: TE002
  title: Developer Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow pain
  - Sonar solution
  - Measurable benefit
  - Limitation
  rows:
  - - Developer writes code
    - Issues found late in PR or CI
    - SonarQube for IDE local analysis and QuickFix
    - Earlier remediation before commit
    - Local findings depend on IDE/language support and connected mode
  - - Reviewer evaluates PR
    - Manual review misses deterministic issues
    - PR decoration and Quality Gate status
    - Automated pass/fail signal in SCM
    - Gate quality depends on profile tuning
  - - Build pipeline enforces standards
    - CI lacks policy semantics
    - Quality Gate reports to CI and can fail pipelines
    - Release readiness becomes a machine-checkable control
    - Can block teams if noisy rules are not tuned
  - - Security team tracks vulnerabilities
    - Separate SAST/SCA tools fragment context
    - Advanced Security unifies SAST, SCA, secrets and SBOMs
    - Single pane for code and dependency risk
    - SCA maturity is newer than core analyzer
  - - Platform team audits compliance
    - Evidence spread across tools
    - JFrog evidence, standards reports, portfolios
    - Better audit trail for regulated teams
    - Edition and integration availability vary
  notes: Use cases summarize documented workflow integrations and known limitations; benefits require customer telemetry to
    quantify.
  enumerationScope:
    coverage: sample
    basis: Representative workflow jobs across developer, reviewer, pipeline, security, and platform personas.
