- id: regulatory-legal-and-diligence-triggers
  title: Regulatory, Legal, and Diligence Triggers
  body: Regulation is a two-sided risk. The EU Cyber Resilience Act and CISA Secure by Design movement can accelerate demand
    for automated code verification, SBOM, vulnerability handling, and secure-development evidence. The same regimes also
    raise customer expectations for product security, documented processes, and vendor accountability. Sonar publishes legal,
    DPA, and advanced security terms, and the only public litigation item reviewed here was a trademark case filed in 2023;
    no material product-security lawsuit or disclosed breach was identified in the chapter source set. That absence is not
    diligence closure. The IC should require a legal schedule, open-source license compliance evidence, cyber-insurance, vulnerability-disclosure
    records, SOC 2 under NDA, and a kill-trigger dashboard. Structural risks require pricing discipline; manageable risks
    require evidence of mitigation maturity and monitorable thresholds.
  claimRefs:
  - CR023
  - CR024
  - CR025
  - CR026
