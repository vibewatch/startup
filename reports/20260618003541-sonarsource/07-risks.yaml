callouts:
- calloutType: risk
  title: 'Structural risk: SAST becomes a platform feature'
  body: GitHub, GitLab, and Microsoft can bundle code security into the same developer workflows that already host source
    control, pull requests, CI, and identity. This is the highest-conviction structural risk because Sonar cannot fully control
    buyer preference for platform consolidation.
  claimRefs:
  - CR001
  - CR006
  - CR007
  - CR040
- calloutType: risk
  title: 'Manageable risk: product noise must be quantified'
  body: False positives, dynamic-code gaps, and self-hosted burden are not thesis-breaking if Sonar can show low suppression
    rates, fast remediation, and high renewal among large regulated customers. The diligence issue is measurement, not anecdote.
  claimRefs:
  - CR016
  - CR017
  - CR041
  - CR042
- calloutType: recommendation
  title: Diligence stance
  body: Treat Sonar as a strong franchise with material underwriteability gaps. Do not clear valuation without audited financials,
    AI review benchmarks, acquisition-integration milestones, security evidence, and legal schedules.
  claimRefs:
  - CR029
  - CR033
  - CR044
