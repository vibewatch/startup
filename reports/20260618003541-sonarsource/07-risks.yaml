- id: TR006
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold/event
  - Action implication
  rows:
  - - Platform bundling
    - GHAS/GitLab/Microsoft displacement in renewals
    - Win/loss shows platform bundles causing >25% of lost ARR
    - Reprice entry or require stronger product differentiation
  - - AI-native PR review
    - Gitar/Sonar underperforms on actioned-comment precision
    - Independent or customer benchmark trails CodeRabbit/CodeAnt/Qodo/Greptile materially
    - Pause premium valuation until AI roadmap proves pull
  - - Financial opacity
    - Audited ARR/growth/margin unavailable in data room
    - Management cannot reconcile $98M vs ~$200M estimates and path to $1B revenue
    - Do not underwrite growth valuation
  - - Integration overload
    - Acquired products remain separate after two release cycles
    - No unified packaging, SSO, data model, or cross-sell motion
    - Treat M&A as cost center, not synergy
  - - Developer trust
    - False-positive suppression or issue-ignore rate high
    - Customer cohorts show rising suppressions or declining active projects
    - Demand remediation plan and retention covenants
  - - Security incident
    - Material breach or source-code exposure
    - Confirmed customer-code exposure or delayed disclosure
    - Thesis-break unless response and insurance are exceptional
  - - Regulatory/legal
    - CRA/customer compliance gap
    - Product workflows cannot evidence vulnerability handling and SBOM/open-source controls
    - Increase compliance diligence reserve and legal protections
  - - Leadership transition
    - Executive attrition or unclear decision rights
    - Loss of key acquired founders or unresolved CEO/founder split
    - Require stronger governance covenants
  notes: Thresholds are proposed IC monitoring triggers; final limits should be calibrated against data-room ARR, churn, customer
    references, and product telemetry.
