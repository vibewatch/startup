chapter:
  number: 7
  title: Risks
  summary: Sonar’s adverse risk profile is led by structural competitive pressure from GitHub/GitLab/Microsoft bundling and
    AI-native code-review rivals, compounded by financial opacity and the integration burden of three acquisitions in roughly
    eighteen months. Product noise, self-hosted operations, security exposure, and EU software-security regulation are material
    but more manageable if Sonar can evidence mitigation maturity and customer outcomes.
sections:
- id: risk-thesis-and-ranking
  title: Risk Thesis and Severity Ranking
  body: 'Sonar’s risk profile is not dominated by a single disclosed lawsuit, breach, or solvency event; it is dominated by
    a collision between a strong incumbent franchise and a rapidly compressing market. The top structural risk is that SAST
    and code-quality checks become embedded in developer platforms and AI code-review workflows rather than purchased as a
    stand-alone category. GitHub Code Security combines CodeQL, Copilot Autofix, dependency review, and security campaigns
    in the same pull-request workflow where developers already work, while GitLab and Microsoft extend similar platform logic.
    Sonar’s mitigant is its large installed base, language depth, enterprise governance, and move into AI code verification
    through Gitar, but the residual exposure is real: if buyers perceive static analysis as a feature, Sonar must prove it
    is the verification system of record, not another scanner. Financial opacity and acquisition execution are the next two
    diligence priorities.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR039
  - CR040
  tableRefs:
  - TR001
  - TR002
  figureRefs:
  - FR001
- id: competitive-and-market-risks
  title: Competitive and Market Risks
  body: 'Competitive risk splits into three lanes. First, platform bundlers can absorb security budgets: GitHub, GitLab, and
    Microsoft already own repository, CI/CD, identity, and developer workflow surfaces, so incremental SAST and AI remediation
    are easy to bundle into broader enterprise renewals. Second, AI-native review tools such as CodeRabbit, CodeAnt, Qodo,
    and Greptile attack the pull-request review moment with lower implementation friction and messaging around speed, precision,
    and codebase-aware reasoning. Third, open-source substitution is improving: Sonar’s Community Build remains a free self-managed
    option, and OpenGrep shows that the static-analysis ecosystem can fork around commercial terms. These are structural risks,
    not just feature gaps, because they are rooted in workflow control and buyer consolidation. The diligence ask is to compare
    Sonar win/loss data against GitHub Advanced Security, GitLab Ultimate, Snyk, Semgrep/OpenGrep, and AI review startups
    by segment.'
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
