company:
  name: SonarSource
chapter:
  number: 3
  title: Competitors
  summary: Sonar is a code-quality and code-security governance leader, but the competitive set is fragmenting across enterprise
    SAST suites, developer-first AppSec platforms, GitHub/GitLab bundling, open-source substitutes, and AI-native code review.
    Its moat is strongest in multi-language quality gates and developer trust; the highest-pressure threats are GitHub Advanced
    Security with CodeQL/Copilot Autofix and AI-native PR review tools.
sections:
- id: landscape-map
  title: Landscape Map and Competitive Segments
  body: 'Sonar’s competitive landscape is not a single SAST bake-off. It spans four overlapping jobs: continuous code-quality
    governance, security scanning, repository-native remediation, and AI-assisted pull-request review. The direct security
    peer set includes Snyk, Veracode, Checkmarx, Black Duck Coverity, GitLab SAST, GitHub Advanced Security with CodeQL, Semgrep,
    and OpenText Fortify; Forrester’s SAST vendor set independently validates most of this grouping. Adjacent quality tools
    such as Codacy, DeepSource, Code Climate, and Embold compete for lighter code-health budgets, while ESLint, PMD, SpotBugs,
    Opengrep, and SonarQube Community Build constrain willingness to pay in narrow or open-source-heavy teams. This segmentation
    matters because Sonar’s moat is strongest when buyers value multi-language quality gates and broad developer adoption,
    but weaker when the buyer wants one security suite, one repository-native bundle, or a fast AI reviewer.'
  claimRefs:
  - CP001
  - CP002
  - CP024
  - CP026
  - CP027
  - CP029
  - CP031
  - CP037
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: direct-incumbent-comparison
  title: Direct and Legacy SAST Comparison
  body: 'The legacy AppSec competitors pressure Sonar from above. Veracode, Checkmarx, Coverity, and Fortify sell to security
    and compliance teams that prize breadth of vulnerability categories, auditability, binary or hybrid scanning, and platform-wide
    AppSec coverage. Their weakness versus Sonar is developer pull: Sonar’s history is code-quality governance embedded in
    IDE and CI quality gates, not only security-team detection queues. Snyk and Semgrep pressure Sonar laterally with developer-first
    SAST, dependency security, custom rules, and AI-assisted triage. GitLab and GitHub are different: they bundle security
    into the repository and merge workflow. For GitHub-native accounts, CodeQL plus Copilot Autofix can reduce the need to
    adopt a separate scanner; for GitLab-native accounts, built-in SAST creates a similar path of least resistance. Sonar
    therefore has to win on quality breadth, low noise, and governance consistency across heterogeneous DevOps stacks.'
  claimRefs:
  - CP003
  - CP005
  - CP006
  - CP007
  - CP008
  - CP009
  - CP010
  - CP011
  - CP013
  - CP032
