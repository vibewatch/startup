- id: moats-and-threat-verdict
  title: Moat Durability and Threat Verdict
  body: 'Sonar’s moat is durable but not unassailable. The durable elements are the open-source install base, developer familiarity,
    broad rule coverage across quality and security, quality gates that fit CI/CD governance, and credible enterprise adoption.
    The erosion vectors are equally concrete: GitHub can bundle CodeQL and Copilot Autofix into the dominant repository workflow;
    GitLab can do the same for its DevOps base; Snyk and Semgrep can win developer-first security budgets; Fortify, Checkmarx,
    and Veracode can win regulated security programs; and AI-native review tools can capture the fastest-growing interaction
    surface for code written by humans and agents. The underwriting conclusion is that Sonar should be treated as a category
    leader in code quality plus security governance, but its most important diligence work is segment-level win/loss evidence
    against GitHub bundling and AI-native review tools, not another generic feature checklist.'
  claimRefs:
  - CP028
  - CP031
  - CP032
  - CP033
  - CP034
