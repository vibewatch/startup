- id: ai-native-review-threat
  title: AI-Native Code Review and Workflow Entrants
  body: The fastest-changing threat is AI-native review. CodeRabbit, CodeAnt AI, Qodo, Greptile, Graphite, and Bito do not
    need to replace SonarQube’s full analyzer to erode mindshare; they can start at the pull request, where developers feel
    review latency and context-switching most acutely. Greptile’s public claim of 9,000+ teams, CodeRabbit’s “leader in AI
    code reviews” positioning, Qodo’s standards-aware review, and Graphite’s PR workflow layer all point to a review-centric
    wedge. These tools are particularly dangerous if developers come to expect natural-language review comments, codebase-aware
    reasoning, and suggested fixes before they think about a formal quality gate. Sonar’s Gitar acquisition partly addresses
    this gap, but the competitive bar is no longer just finding issues; it is turning findings into trusted, low-friction
    fixes inside the developer’s existing workflow.
  claimRefs:
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP034
  - CP040
  - CP044
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: pricing-packaging-and-substitutes
  title: Pricing, Packaging, Multi-Homing, and Substitutes
  body: 'Public pricing evidence is uneven, but the buyer tradeoff is clear. Sonar frames paid adoption around lines of code
    and code-verification scale; Snyk and Semgrep public pages emphasize developer or platform plans; GitHub and GitLab are
    frequently evaluated as part of a broader repository or DevOps platform. This creates a multi-homing pattern: an enterprise
    can keep Sonar for quality gates, add Snyk for dependency risk, use GHAS for GitHub-hosted repositories, and still let
    teams run ESLint or PMD locally. The substitute threat is highest in small teams and open-source projects where language-specific
    linting, SonarQube Community Build, or Opengrep can solve “good enough” inspection needs. It is lower in large enterprises
    where policy enforcement, portfolio reporting, and governance across many languages are harder to assemble from free tools.'
  claimRefs:
