callouts:
  - calloutType: strength
    title: "Broad developer mindshare with enterprise references"
    body: >
      Sonar combines company-reported scale (7M+ developers and 75%+ of the Fortune 100) with production customer stories at Cisco, Xero, Freshworks, IMSA, DEPT, and Findomestic, giving it unusually strong adoption proof for a private developer-tools company.
    claimRefs: [CU001, CU002, CU010, CU011, CU012, CU013, CU014, CU016]
  - calloutType: strength
    title: "Bottom-up adoption can expand into governance budgets"
    body: >
      The free/Cloud/Developer-to-Enterprise ladder lets Sonar start with developers and expand into platform, security, compliance, and executive reporting once quality gates and portfolio dashboards become operating infrastructure.
    claimRefs: [CU020, CU021, CU023, CU024, CU025, CU039]
  - calloutType: risk
    title: "Retention economics remain private"
    body: >
      Public evidence shows workflow embedment and satisfied reviewers, but Sonar has not disclosed NRR, GRR, logo churn, paid customer count, average contract length, or concentration, leaving durability underwriting dependent on data-room evidence.
    claimRefs: [CU040, CU041, CU042, CU043, CU044]
  - calloutType: risk
    title: "Pricing and false positives are credible churn vectors"
    body: >
      Reviewers repeatedly flag false positives, community/support limits, self-hosted overhead, and LOC-based pricing friction, especially for teams that need pull-request workflows but are not yet enterprise-scale buyers.
    claimRefs: [CU035, CU036, CU037, CU038]

