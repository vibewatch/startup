  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Net revenue retention, gross revenue retention, logo churn, cohort retention, and renewal rates by product tier"
      whyItMatters: "Public customer proof shows adoption but not durability; retention metrics determine whether Sonar's embedded workflows convert into compounding revenue."
      diligencePath: "Request NRR/GRR/churn cohorts segmented by Community-to-paid, Cloud Team, Enterprise Cloud, Developer, Enterprise, and Data Center."
      relatedQuestionRefs: [QU017, QU018, QU025]
      relatedTableRefs: [TU005]
    - type: private-evidence-only
      severity: material
      topic: paid-customer-count
      missingEvidence: "Paid customer count and active account count separated from free, community, inferred, and organization-level usage figures"
      whyItMatters: "Official and third-party organization counts vary widely, so paid penetration and monetization cannot be underwritten from public scale metrics alone."
      diligencePath: "Request a customer waterfall with definitions for developer users, organizations, paying accounts, enterprise accounts, and active production deployments."
      relatedQuestionRefs: [QU004, QU005, QU026]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: "Complete customer-story corpus with all named customers, deployment status, products used, outcomes, and publication dates"
      whyItMatters: "The named-customer table is a representative sample, not an exhaustive population, so it cannot establish median customer outcome quality."
      diligencePath: "Request Sonar's full reference roster and permission to speak with churned, expanded, and neutral customers across tiers."
      relatedQuestionRefs: [QU006, QU023, QU027]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: "Top-customer revenue concentration, top-20 customer share, largest renewal dates, and vertical concentration"
      whyItMatters: "Enterprise developer-tools vendors can appear broadly adopted while still depending on a concentrated set of high-ACV customers."
      diligencePath: "Request customer concentration schedule by ARR, renewal month, product tier, and vertical; test exposure to financial services and technology customers."
      relatedQuestionRefs: [QU022, QU025]
    - type: conflicting-data
      severity: minor
      topic: organization-count
      missingEvidence: "Reconciled definition of 500K organizations, 400K organizations, 200K organizations, 6,000 customers, and third-party company-use estimates"
      whyItMatters: "Different definitions can overstate commercial penetration if free or inferred usage is mixed with paid customers."
      diligencePath: "Ask management to map each public scale metric to an internal source system and definition."
      relatedQuestionRefs: [QU004, QU005, QU026]
      relatedTableRefs: [TU002]
    - type: private-evidence-only
      severity: material
      topic: pricing-friction
      missingEvidence: "Renewal uplift history, discounting, win/loss reasons, downgrade requests, and support-ticket history tied to LOC-based pricing"
      whyItMatters: "Public reviewers cite pricing friction and false positives; private churn and renewal data are needed to quantify whether these are noise or material expansion blockers."
