summary:
  headline: Sonar 是代码质量和 Clean Code 领域的品类定义者，开发者采用规模巨大，并深度打入 Fortune 100；但财务不透明、$4.7B 估值标记已陈旧四年，AI 时代 SAST 商品化风险上升，更适合观察而非建立确信。
