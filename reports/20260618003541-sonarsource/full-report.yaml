              The adverse side is material for diligence. PeerSpot's pros-and-cons page states that SonarQube needs
              better support and documentation for community users, has false-positive and vulnerability-detection
              issues, and could be more competitively priced. Capterra reviewers mention false positives,
              report-generation delays, expensive licensing for small businesses, difficult on-premise use, and
              long-running executive reporting across portfolios. Independent 2026 reviews add that self-hosting
              requires ongoing DevOps work, Community Build lacks branch analysis and pull-request decoration, LOC-based
              billing can surprise buyers, and AI-native competitors are stronger in conversational code review. These
              criticisms do not negate strong adoption, but they define churn and expansion risks in lower-maturity
