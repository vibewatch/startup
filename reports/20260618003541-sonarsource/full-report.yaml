              Freshworks says it manages more than 2,000 GitHub repositories and embeds SonarQube into standard CI
              templates so every pull request passes quality-gate checks, security analysis, and secret detection.


              The European case studies add regulated-industry proof. IMSA, IT provider for France's second-largest
              health insurance organization, reports using SonarQube Server as a mandatory quality gate across over
              2,000 projects, including Java, COBOL, and JavaScript, and cites code coverage improvement from 40% to
              60%. Findomestic Banca, a BNP Paribas Personal Finance subsidiary, uses SonarQube Server alongside GitLab,
              Jenkins, IQ Server Lifecycle, and Fortify, with a 70% increase in microservices test coverage and
