      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Four structural drivers support Sonar's category expansion. First, AI-generated code increases review
              volume and uncertainty: GitHub reports 180M+ developers on the platform, 518.7M merged pull requests in
              2025, and more than 1.1M public repositories using LLM SDKs; Sonar's survey says developers using AI tools
              commit 42% AI-generated or AI-assisted code, while The Register highlights that only 48% always check
              AI-assisted code before committing it. Second, regulation is pushing secure-by-design and supply-chain
              transparency into product requirements: the EU Cyber Resilience Act introduces mandatory cybersecurity
              requirements and reporting obligations from September 2026, while CISA frames SBOMs as a key building
              block for software supply-chain risk management. Third, technical debt has become a board-readable cost
              language; CISQ's standard translates static-analysis findings into future corrective maintenance cost, and
              Sonar cites Gartner's view that architectural technical debt will account for 80% of technical debt by
              2027. Fourth, shift-left DevSecOps makes IDE and CI integration more valuable than periodic audits.


              Constraints are equally material. Forrester characterizes SAST as mature, with competition, consolidation,
              and differentiation pressure. GitHub's free public-repository protections and enterprise-native GHAS
              products set a low-friction default for GitHub-centered organizations. Open-source AppSec stacks can cover
              SAST, SCA, IaC, secrets, and DAST at zero license cost for small teams. AST tools also face tuning
              overhead: one AST market source reports integration complexity and false positives as restraints, echoing
              user-level concerns that poor signal-to-noise reduces developer productivity. The diligence gap is not
              whether the market is large; it is how much of the AI-code-verification expansion Sonar can monetize
              before bundled platforms and open-source alternatives compress standalone pricing.
            claimRefs:
