      - number: '4.2'
        title: Revenue Estimates, Growth Trajectory, and Conflicts
        blocks:
          - type: paragraph
            body: >
              Public revenue data is conflicting. Latka states that Sonar reached $98.1M revenue in 2024 with a
              869-person team, while Growjo estimates current annual revenue at $139.1M and revenue per employee at
              $185,900. Owler places Sonar in a broad $100M-$500M annual revenue bucket, and the diligence brief flags
              third-party 2026 estimates approaching $200M. None of these sources is audited, and several round labels
              or employee counts conflict with one another, so the right treatment is a range, not a point estimate. The
              only company-disclosed revenue target is qualitative and aspirational: Sonar said the Series D would help
              drive toward $1B in revenue.


              The implied growth challenge is steep. If the $98.1M 2024 Latka figure is directionally right, reaching
              $1B requires roughly a tenfold increase. If the 2026 base is closer to $139M, the remaining gap is still
              about sevenfold; if the high third-party estimate of $200M is correct, Sonar would still need
              approximately fivefold growth. That can be plausible for a category leader with 7M+ developers, Fortune
              100 penetration, and an AI-code tailwind, but public data does not disclose ARR, net retention, customer
              count, gross churn, or cohort expansion by LOC tier. Those gaps matter more than precision in any single
              tracker estimate.
