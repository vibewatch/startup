      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              The financial verdict is constructive but caveated. Sonar appears to have a high-quality recurring
              software revenue model, enterprise-grade packaging, credible demand tailwinds from AI code generation, and
              enough historical capital to avoid obvious financing distress. The adverse side is equally important:
              revenue is not audited, public estimates conflict, the $4.7B valuation is stale, realized enterprise
              pricing is opaque, and unit economics are mostly private. Vendr's procurement analysis explicitly frames
              Sonar pricing as variable, negotiable, and dependent on codebase size and support choices; PeerSpot users
              flag pricing competitiveness, false positives, and security-feature gaps. Those are not solvency red
              flags, but they are direct evidence of underwriting uncertainty.


              Diligence should therefore focus on three questions. First, is the current revenue run-rate closer to
              $100M, $140M, or $200M, and what share is true subscription ARR? Second, do gross margin, net retention,
              CAC payback, and revenue per employee support a premium SaaS multiple? Third, does cash runway remain
              strong after Tidelift, AutoCodeRover, and Gitar integration costs? Without those private metrics, the
              chapter can validate the revenue mechanism and funding history, but cannot validate valuation fairness or
              IPO readiness.
            claimRefs:
              - CI036
              - CI037
              - CI038
              - CI039
              - CI040
