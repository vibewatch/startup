  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Thesis and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Sonar’s risk profile is not dominated by a single disclosed lawsuit, breach, or solvency event; it is
              dominated by a collision between a strong incumbent franchise and a rapidly compressing market. The top
              structural risk is that SAST and code-quality checks become embedded in developer platforms and AI
              code-review workflows rather than purchased as a stand-alone category. GitHub Code Security combines
              CodeQL, Copilot Autofix, dependency review, and security campaigns in the same pull-request workflow where
              developers already work, while GitLab and Microsoft extend similar platform logic. Sonar’s mitigant is its
              large installed base, language depth, enterprise governance, and move into AI code verification through
              Gitar, but the residual exposure is real: if buyers perceive static analysis as a feature, Sonar must
              prove it is the verification system of record, not another scanner. Financial opacity and acquisition
              execution are the next two diligence priorities.
