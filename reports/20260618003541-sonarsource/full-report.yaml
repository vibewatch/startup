            body: >-
              SonarQube Server 2026.1 LTA is a meaningful product milestone because it packages a year of AI, security,
              language, and platform work into the long-term active release line. The same release also raises
              operational requirements: Server now expects Java 21 or Java 25 with a full JDK, removes the embedded
              PostgreSQL dependency from the Helm chart, and updates supported database, scanner, Kubernetes, and
              OpenShift ranges. That reinforces the Server-versus-Cloud tradeoff. Self-hosted customers gain control,
              plugin flexibility, data residency, and HA options in Data Center Edition, but they inherit upgrades,
              database administration, capacity planning, backups, and operational reliability. Cloud customers receive
              faster access to platform updates with materially lower operational burden, but with less control over
              plugin and residency constraints. Integrations are broad enough to meet most enterprise SDLCs: GitHub,
              GitLab, Bitbucket, Azure DevOps, Jenkins/scanners, Jira, Slack, JFrog, and IDEs.
