        title: AI Layer and Agentic-Code Verification
        blocks:
          - type: paragraph
            body: >-
              Sonar’s AI layer is a portfolio extension rather than a replacement for the deterministic analyzer. AI
              CodeFix converts selected issues into suggested patches and, in Server Enterprise/Data Center, can use
              Sonar-managed OpenAI models or a customer Azure OpenAI model. AI Code Assurance adds governance semantics
              for AI-generated code through qualified gates, labels, badges, and portfolio visibility. AutoCodeRover
              contributes an autonomous remediation agent grounded in AST-aware code search and optional test-based
              fault localization; NUS says the commercial SonarQube Remediation Agent verifies each fix through Sonar’s
              analysis engine before proposing it. Gitar adds natural-language and intent-aware AI-native PR review that
              can complement deterministic rules, while Tidelift extends the platform toward open-source supply-chain
              assurance. The coherent strategy is “vibe, then verify”: let code volume rise, but require deterministic
              gates, evidence, and auditability before merge.
