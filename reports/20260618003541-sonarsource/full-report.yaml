  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >
              Sonar monetizes code verification through recurring commercial editions of SonarQube Server, SonarQube
              Cloud subscriptions, enterprise support, and associated services; SonarQube Community Build and SonarQube
              for IDE remain important free or low-friction adoption surfaces rather than direct revenue engines. The
              core public pricing signal is not per-developer licensing. Sonar's own pricing pages emphasize lines of
              code, starting at $32 monthly for the Cloud Team plan and $750 annually for self-hosted Developer at 100K+
              LOC, with Enterprise moving to custom or sales-led annual pricing. Independent procurement benchmarks
              describe the same mechanism: spend varies primarily by LOC analyzed, deployment model, edition, support,
              and contract term.


              This model is financially attractive because the value metric expands as enterprise codebases grow and as
              AI-generated code increases verification volume. It is also a buyer-friction risk: reviewers and
              procurement guides emphasize that the real enterprise bill includes maintenance, implementation,
              infrastructure, premium support, and potential overage or true-up costs. For underwriting, list prices are
              therefore useful only as a packaging map. Realized ARR, discounting, expansion by LOC tier, and renewal
              cohorts remain private evidence. The chapter treats revenue numbers as estimates unless they come directly
              from company financing disclosures.
            claimRefs:
              - CI001
              - CI002
              - CI003
