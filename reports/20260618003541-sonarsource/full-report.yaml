  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Sonar should not be sized as a generic cybersecurity company. Its defensible core is static analysis for
              first-party code quality and security: rules that find bugs, vulnerabilities, code smells, maintainability
              problems, and technical-debt hotspots before code is merged. The directly included spend therefore covers
              SAST/static application security testing, code-quality and technical-debt management tools, IDE/CI quality
              gates, and the parts of SCA and AI-code review that are bundled into the same developer workflow. The
              broader AST market is an adjacency rather than the core, because it also includes DAST, IAST, API testing,
              mobile testing, penetration-testing services, ASPM, and runtime controls that Sonar does not fully
              replace.


              The most important market-boundary nuance is substitution. Engineering organizations can continue using
              manual pull-request review, linter rules, compiler checks, test coverage, and GitHub-native checks as a
              status quo. Security organizations can buy suites from GitHub, Snyk, Veracode, Checkmarx, GitLab,
              OpenText, or Black Duck; smaller teams can assemble open-source tools such as Semgrep, Trivy, Grype,
              Gitleaks, TruffleHog, ZAP, and Nuclei at zero license cost. Sonar's market is therefore the spend
              organizations are willing to allocate to an opinionated verification layer that unifies code quality,
              security, SCA, and AI-generated-code governance in developer workflows, not every dollar spent on AppSec.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
