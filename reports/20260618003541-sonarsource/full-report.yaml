            title: Multiple Compression Is the Central Valuation Risk
            body: >-
              The adverse valuation evidence is market-wide rather than company-specific: 2026 SaaS multiples are
              materially lower than 2021 peaks, so the same headline mark now needs much stronger revenue proof.
