  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Headquarters
        blocks:
          - type: paragraph
            body: |
              Sonar — the operating brand of SonarSource SA — is a software company that builds tools for code
              quality and code security, branded "Clean Code" and more recently "AI code verification and
              governance." The company was founded in 2008 in the Geneva area of Switzerland (the legal entity is
              registered in the canton of Geneva, historically associated with Vernier) by three engineers:
              Olivier Gaudin, Freddy Mallet, and Simon Brandhof. The founders built the business around an
              open-source static-analysis engine, SonarQube, which became the de facto standard for continuous
              code inspection across many programming languages.

              Although founded and still legally domiciled in Switzerland, Sonar has progressively added a major
              United States presence and now describes itself as dual-headquartered, with an operating
              headquarters in Austin, Texas alongside its Geneva base; the US hub anchors its global go-to-market
              build-out. Sonar's mission is to help developers deliver high-quality and secure software by
              analyzing human-written code, AI-generated code, and third-party open-source code before defects
              reach production. As of mid-2026 the company reports that more than 7 million developers and over
              75% of the Fortune 100 use SonarQube, and that its engine analyzes roughly 750 billion lines of code
              every day. These scale figures are company-reported and are corroborated across Sonar's own about
              page, press releases, and third-party profiles, though precise organization counts vary by source.
