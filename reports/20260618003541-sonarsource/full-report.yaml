      - number: '7.2'
        title: Competitive and Market Risks
        blocks:
          - type: paragraph
            body: >-
              Competitive risk splits into three lanes. First, platform bundlers can absorb security budgets: GitHub,
              GitLab, and Microsoft already own repository, CI/CD, identity, and developer workflow surfaces, so
              incremental SAST and AI remediation are easy to bundle into broader enterprise renewals. Second, AI-native
              review tools such as CodeRabbit, CodeAnt, Qodo, and Greptile attack the pull-request review moment with
              lower implementation friction and messaging around speed, precision, and codebase-aware reasoning. Third,
              open-source substitution is improving: Sonar’s Community Build remains a free self-managed option, and
              OpenGrep shows that the static-analysis ecosystem can fork around commercial terms. These are structural
              risks, not just feature gaps, because they are rooted in workflow control and buyer consolidation. The
              diligence ask is to compare Sonar win/loss data against GitHub Advanced Security, GitLab Ultimate, Snyk,
              Semgrep/OpenGrep, and AI review startups by segment.
