        blocks:
          - type: paragraph
            body: >-
              The financial risk is underwriteability. Sonar’s $4.7B valuation is four years old, no audited financials
              are public, and revenue estimates remain third-party and conflicting. The company can be very attractive
              operationally and still be difficult to price without ARR, growth, gross margin, NRR, customer
              concentration, cohort expansion, and cash-burn evidence. Execution risk compounds that opacity: the
              company has pursued an AI-verification pivot while absorbing Tidelift, AutoCodeRover, and Gitar in roughly
              eighteen months. Gitar is strategically logical, but it puts Sonar directly into the noisy AI-native
              code-review market while the core SonarQube franchise must keep serving enterprise compliance buyers.
              Leadership risk is moderate rather than acute: Tariq Shaukat brings IPO-scaling experience and Olivier
