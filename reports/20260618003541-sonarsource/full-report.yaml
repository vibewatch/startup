        title: Pricing, Packaging, Multi-Homing, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is uneven, but the buyer tradeoff is clear. Sonar frames paid adoption around
              lines of code and code-verification scale; Snyk and Semgrep public pages emphasize developer or platform
              plans; GitHub and GitLab are frequently evaluated as part of a broader repository or DevOps platform. This
              creates a multi-homing pattern: an enterprise can keep Sonar for quality gates, add Snyk for dependency
              risk, use GHAS for GitHub-hosted repositories, and still let teams run ESLint or PMD locally. The
              substitute threat is highest in small teams and open-source projects where language-specific linting,
              SonarQube Community Build, or Opengrep can solve “good enough” inspection needs. It is lower in large
              enterprises where policy enforcement, portfolio reporting, and governance across many languages are harder
              to assemble from free tools.
