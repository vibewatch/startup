      - number: '6.3'
        title: Go-to-Market Motion, Pricing, and Expansion Loop
        blocks:
          - type: paragraph
            body: >
              Sonar's go-to-market motion is a classic developer-tools ladder. The free Community Build and SonarQube
              for IDE create bottom-up familiarity for individual developers and open-source or single-branch projects.
              SonarQube Cloud then gives smaller teams a low-friction SaaS path: official pricing says the Team plan
              starts at $32 monthly for analysis up to 100,000 private lines of code, while the free cloud tier allows
              private-project exploration up to 50,000 lines of code. As codebases, compliance needs, and developer
              counts increase, buyers move toward Team, Enterprise Cloud, or self-managed Server editions with
              line-of-code-based pricing, enterprise languages, SSO/SCIM, audit logs, portfolio dashboards, regulatory
              reports, and support.


              This motion supports land-and-expand because the product becomes embedded in CI/CD, pull requests, IDEs,
              and executive dashboards. Freshworks and Xero show expansion from repository onboarding and standardized
              pull-request workflows; IMSA and Findomestic show expansion into portfolio reporting, quality gates, and
              legacy-language coverage. The same model creates friction: commercial pricing is tied to maximum lines of
              code analyzed rather than seats, so cost can rise as codebases grow even if developer headcount is stable.
              Third-party pricing reviews and PeerSpot users flag steep enterprise pricing, renewal increases,
              self-hosting overhead, and Community Build limitations as recurring purchase objections, especially for
              small teams without platform-engineering capacity.
