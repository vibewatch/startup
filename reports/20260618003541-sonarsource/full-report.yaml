      - number: '8.3'
        title: Bear/Base/Bull Scenarios and Valuation Methods
        blocks:
          - type: paragraph
            body: >-
              The valuation scenarios use revenue multiples because public evidence does not support a full DCF. ARR,
              NRR, gross margin, EBITDA, FCF, cash, burn, and debt are all private, so a DCF-lite can only be a
              sensitivity exercise. The bear case assumes Sonar is closer to $140M of revenue and receives an 8x
              multiple, producing roughly $1.1B of enterprise value. The base case uses the shared 2026 high estimate of
              $200M and a 12x premium AppSec/devtools multiple, producing about $2.4B. The bull case requires either
              revenue nearer $300M or clear IPO-grade growth, retention, and margin evidence; at 18x, that reaches about
              $5.4B.


              This range frames the $4.7B mark as possible but not base-case. To justify it today, Sonar likely needs to
              prove it is closer to the bull case than the base case: sustained high growth, strong enterprise
              expansion, software-level gross margins, limited pricing friction, and a credible IPO window. If revenue
              is nearer $100M-$150M or if public SaaS multiples remain the correct benchmark, the mark is stretched by
              several turns. This is why the chapter treats the valuation stance as stretched rather than fair.
            claimRefs:
              - CV022
              - CV023
              - CV024
