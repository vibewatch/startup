      - number: '1.5'
        title: Key Milestones and Adverse Signals
        blocks:
          - type: paragraph
            body: |
              Sonar's trajectory spans roughly eighteen years across three phases: open-source community building
              (2008–2018), commercial scaling and the mega-round (2019–2023), and an AI-verification pivot
              (2024–2026). The open-source SonarQube engine seeded broad developer adoption; the 2022 Series D
              provided capital and a $4.7 billion valuation; and the 2023 arrival of Tariq Shaukat plus the
              Tidelift, AutoCodeRover, and Gitar acquisitions reoriented the company toward AI code verification
              and governance. Reporting consistently frames the Shaukat hire — given his Bumble IPO experience — as
              preparation for an eventual public listing, although Sonar has not announced any concrete IPO
              timetable as of mid-2026.

              Adverse and watch-item signals are real if not severe. The most significant is financial opacity: no
              audited financials, no official post-2022 valuation, and conflicting third-party revenue estimates
              complicate underwriting. Product-level criticism from enterprise reviewers centers on false
              positives in dynamic code, the DevOps burden of running self-hosted SonarQube, and pricing friction
              relative to lighter cloud-native rivals such as Codacy, DeepSource, CodeRabbit, and CodeAnt. The AI
              pivot also introduces integration and execution risk: three acquisitions in eighteen months must be
              absorbed without disrupting the core analyzer, and Sonar now competes more directly with a wave of
              AI-native code-review startups. None of these constitutes a disclosed legal, regulatory, or
              solvency event, but collectively they define the diligence agenda for later chapters.
