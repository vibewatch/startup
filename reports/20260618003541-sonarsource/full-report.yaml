  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base, Scale, and Segments
        blocks:
          - type: paragraph
            body: >
              Sonar's adoption base spans individual developers, open-source projects, SMB teams, mid-market engineering
              organizations, and large regulated enterprises. The strongest scale facts remain company-reported rather
              than audited: Sonar and its product pages state that more than 7 million developers use Sonar, more than
              75% of the Fortune 100 rely on SonarQube, and the community has over 45,000 members. Sonar's own SonarQube
              product page also states that the platform is trusted by over 7 million developers and 500,000
              organizations globally, while Atlassian Marketplace copy for SonarSource cites over 6,000 commercial
              customers and a Community Edition trusted by more than 200,000 organizations. These figures are
              directionally consistent but not identical, so the safest interpretation is broad global penetration with
              organization-count definitions that vary across official surfaces.


              Independent demand-data vendors add a second, imperfect lens. Landbase lists 5,511 verified companies
              using SonarQube, TheirStack lists 21,554 companies and users, and 6sense reports more than 11,929
              companies using SonarQube as a code-quality tool. These datasets are useful for adoption triangulation,
              but they are not equivalent to paying-customer counts because they may infer use from technology signals,
              job posts, pages, and public traces. Segment-wise, the product is pulled into enterprises by developers
              and DevOps teams, then budgeted by platform engineering, security, compliance, or engineering leadership
              once teams need pull-request decoration, branch analysis, compliance dashboards, enterprise languages,
              data residency, or support.
