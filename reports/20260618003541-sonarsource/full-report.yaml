      - number: '4.4'
        title: Capital Structure, Cash, Burn, and Runway
        blocks:
          - type: paragraph
            body: >
              Sonar is unusually well capitalized for a private developer-tools company. Its April 2022 Series D raised
              $412M at a $4.7B valuation, led by Advent International and General Catalyst with participation from
              existing investor Insight Partners and Permira Growth Opportunities Fund. Tracxn and Growjo put total
              funding around $457M-$458M, reflecting an earlier $45M 2016 Insight-led round and a small $824K 2025 entry
              in Tracxn's table. These figures align directionally with the shared report spec, but they are still
              secondary databases beyond the official Series D announcement.


              The unresolved question is capital adequacy. Sonar has not disclosed current cash, debt, burn, runway, or
              profitability. Some market commentary describes the company as capital-efficient or profitable-leaning,
              but public sources reviewed here do not provide audited proof. The safer conclusion is that the large 2022
              raise, recurring software model, and absence of disclosed layoffs or distress signals reduce near-term
              financing risk, while three acquisitions from late 2024 through 2026 and continued GTM expansion imply
              ongoing investment. Underwriting should request cash, monthly burn, free cash flow, debt facilities,
              acquisition consideration, and board-approved operating plan before relying on any runway narrative.
