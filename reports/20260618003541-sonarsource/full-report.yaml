        blocks:
          - type: paragraph
            body: >-
              Product risk is manageable but must be measured rather than narrated. Reviews still mention false
              positives, dynamic-analysis gaps, cost, and self-hosted operational friction; those issues matter because
              developer trust is the currency of any code-quality tool. AI raises the bar: a deterministic scanner that
              produces noisy issues can be displaced by tools that prioritize useful pull-request comments, even if
              those tools are less complete for compliance. Sonar’s mitigants are meaningful: trust-center materials
              cite ISO 27001:2022, SOC 2 Type II, penetration testing, secure SDLC controls, SAST on every pull request,
              and cloud resilience practices. Yet code scanning creates asymmetric security exposure because scan
              reports can contain source code. Sonar’s security posture therefore needs private validation through SOC 2
              reports, penetration-test summaries, incident history, vulnerability disclosure records, and evidence that
              SCA additions from Tidelift are integrated rather than adjacent.
