            body: >
              Sonar's named-customer evidence is better than a logo wall because several official customer stories tie
              the tool to concrete production workflows. Cisco describes SonarQube as a centralized verification layer
              for an AI-first engineering strategy, with SonarQube for IDE and SonarQube metrics feeding developer
