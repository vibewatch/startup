      - number: '2.2'
        title: 'Sizing Lenses: TAM, SAM, SOM, and Conflicting Estimates'
        blocks:
          - type: paragraph
            body: >
              The public sizing record is inconsistent enough that preserving the range is more honest than selecting a
              single TAM. Forrester's 2026 SAST commentary says SAST is now a mature market with intensified competition
              and consolidation, while Mordor sizes SAST at $0.68B in 2026 growing to $1.89B by 2031 at 22.82% CAGR.
              MarkWide reports a much larger SAST software lens of $1.85B in 2026 and $7.26B by 2035 at 16.4% CAGR.
              Verified Market Research uses a broader AST definition and reports $33.2B in 2023, rising to $56.2B by
              2031 at 26.25% CAGR; that is a useful ceiling but overstates Sonar's immediate addressable market because
              it includes testing modalities and services outside static code verification.


              A practical market stack is: narrow SAST as the floor; add SCA and technical-debt management for Sonar's
              SAM; treat AI-code review/verification as the fastest-growing expansion layer; and reserve the full
              AST/developer-tools baskets as TAM context only. Mordor's developer-tools lens is $7.44B in 2026 at 16.12%
              CAGR, while its AI-code-tools lens is $9.35B in 2026 at 26.23% CAGR. The AI-code-assistant market is even
              more volatile: MarketsandMarkets estimates $8.14B in 2025 and $127.05B by 2032 at 48.1% CAGR. Sonar's SOM
              is constrained by its current revenue proxy, not market size: the shared canonical estimate is ~$98M in
              2024 rising toward ~$200M in 2026, implying low-single-digit share of the narrow SAST lens and a much
              smaller share of the larger AI-code-tools opportunity.
