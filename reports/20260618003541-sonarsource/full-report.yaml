  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Anchor, Implied Multiples, and Staleness
        blocks:
          - type: paragraph
            body: >-
              Sonar's valuation analysis starts with a single hard anchor: the April 2022 Series D. Sonar announced
              $412M of new investment at a $4.7B valuation, led by Advent International and General Catalyst with
              Insight Partners and Permira Growth Opportunities participating. That mark is credible as a financing fact
              but weak as a 2026 fair-value estimate. It is roughly four years old, was struck near the end of the
              2021-2022 software-valuation boom, and has not been refreshed by an official primary round, IPO filing, or
              disclosed secondary transaction. The chapter therefore treats $4.7B as the last-mark reference, not the
              current intrinsic value.


              The implied multiple is the key problem. Using the shared canonical revenue estimate of about $98M in
              2024, the Series D valuation equals roughly 48x revenue. Even if Sonar is near the high-case third-party
              2026 estimate of $200M, the mark still implies about 23.5x revenue. Those are premium software multiples,
              not ordinary SAST or developer-tool multiples, and all revenue figures are unaudited. The right investment
              stance is therefore price-sensitive: Sonar may be an excellent company, but the public record does not
              prove that today's fair value equals the stale 2022 mark.
            claimRefs:
