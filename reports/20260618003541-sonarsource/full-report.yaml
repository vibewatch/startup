      - number: '1.4'
        title: Product Portfolio, Rebrand, and Scale
        blocks:
          - type: paragraph
            body: |
              Sonar's portfolio is organized around the SonarQube brand following a late-2024 naming refresh that
              unified product names under SonarQube. SonarQube Server is the self-hosted analyzer (formerly simply
              "SonarQube"); SonarQube Cloud is the SaaS offering (formerly SonarCloud); SonarQube for IDE is the
              in-editor extension (formerly SonarLint); and SonarQube Community Build is the free open-source
              edition. The platform performs static analysis, static application security testing (SAST), and,
              increasingly, software composition analysis (SCA) across developer-written, third-party, and
              AI-generated code, integrating into IDEs and CI/CD pipelines with quality gates.

              Beginning in late 2024 Sonar executed an acquisition-led pivot toward AI-era code verification. It
              announced a definitive agreement to acquire Tidelift (open-source supply-chain risk) on December 17,
              2024; acquired AutoCodeRover, an autonomous AI software-engineering agent spun out of the National
              University of Singapore, in February 2025; and acquired Gitar, an AI-native code-review platform, on
              May 21, 2026. Together these deals position SonarQube as an "AI code verification" layer spanning
              first-party, open-source, and agent-generated code. Sonar reports scale metrics of 7M+ developers,
              75%+ of the Fortune 100, 750 billion lines of code analyzed daily, and 45,000+ community members.
              Independent reviewers nonetheless flag recurring product criticisms — residual false positives in
              complex code, operational overhead for self-hosted deployments, line-of-code-based pricing that can
              be costly at scale, and a feature-limited free Community Build — that temper the company's adoption
              narrative.
