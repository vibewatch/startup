      - number: '3.3'
        title: AI-Native Code Review and Workflow Entrants
        blocks:
          - type: paragraph
            body: >-
              The fastest-changing threat is AI-native review. CodeRabbit, CodeAnt AI, Qodo, Greptile, Graphite, and
              Bito do not need to replace SonarQube’s full analyzer to erode mindshare; they can start at the pull
              request, where developers feel review latency and context-switching most acutely. Greptile’s public claim
              of 9,000+ teams, CodeRabbit’s “leader in AI code reviews” positioning, Qodo’s standards-aware review, and
              Graphite’s PR workflow layer all point to a review-centric wedge. These tools are particularly dangerous
              if developers come to expect natural-language review comments, codebase-aware reasoning, and suggested
              fixes before they think about a formal quality gate. Sonar’s Gitar acquisition partly addresses this gap,
              but the competitive bar is no longer just finding issues; it is turning findings into trusted,
              low-friction fixes inside the developer’s existing workflow.
