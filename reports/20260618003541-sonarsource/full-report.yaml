      - number: '4.3'
        title: Margins, Unit Economics, and Operating Efficiency
        blocks:
          - type: paragraph
            body: >
              Sonar's likely gross-margin profile should resemble high-margin software and SaaS more than services, but
              this is an inference, not a disclosed fact. The company sells analyzers and hosted/self-managed software
              rather than inventory-heavy hardware; incremental Cloud usage, support, customer success, and self-hosted
              maintenance should be the main delivery costs. SonarQube Server also pushes some infrastructure burden to
              customers, while SonarQube Cloud carries hosting and operations costs internally. That mix generally
              supports strong gross margin potential, but public sources do not disclose Cloud mix, hosting cost,
              support intensity, professional-services attach rate, or gross margin.


              Efficiency signals are mixed but not alarming. Latka's $98.1M revenue and 869 employees imply roughly
              $113K revenue per employee. Growjo's $139.1M revenue and 748 employees imply roughly $186K. Tracxn's
              950-employee estimate combined with the same 2026 revenue range implies materially lower efficiency, about
              $146K at $139M or $211K at $200M. These are estimates built from inconsistent denominators, not management
              KPIs. The biggest unknowns are CAC payback, net revenue retention, gross margin, R&D capitalization, and
              whether AI acquisitions increase integration cost before adding ARR.
