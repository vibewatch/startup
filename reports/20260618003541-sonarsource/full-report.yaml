  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and Developer Workflow
        blocks:
          - type: paragraph
            body: >-
              Sonar’s product architecture is best understood as one analysis engine exposed through four workflow
              surfaces. SonarQube Server is the self-hosted control plane for enterprises that want code and analysis
              data inside their own infrastructure. SonarQube Cloud is the managed SaaS path for teams that prefer Sonar
              to operate infrastructure, scaling, updates, and availability. SonarQube for IDE is the shift-left
              extension formerly known as SonarLint, and connected mode ties a developer’s local rules, exclusions,
              quality profiles, accepted issues, and notifications back to Server, Cloud, or Community Build. SonarQube
              Community Build remains the free on-ramp, but it is materially less complete for modern PR-centric
              enterprise workflows. The customer job is therefore continuous verification: identify quality and security
              issues as code is written, enforce quality gates on pull requests and CI pipelines, then feed results into
              collaboration and audit systems.
