  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Map and Competitive Segments
        blocks:
          - type: paragraph
            body: >-
              Sonar’s competitive landscape is not a single SAST bake-off. It spans four overlapping jobs: continuous
              code-quality governance, security scanning, repository-native remediation, and AI-assisted pull-request
              review. The direct security peer set includes Snyk, Veracode, Checkmarx, Black Duck Coverity, GitLab SAST,
              GitHub Advanced Security with CodeQL, Semgrep, and OpenText Fortify; Forrester’s SAST vendor set
              independently validates most of this grouping. Adjacent quality tools such as Codacy, DeepSource, Code
              Climate, and Embold compete for lighter code-health budgets, while ESLint, PMD, SpotBugs, Opengrep, and
              SonarQube Community Build constrain willingness to pay in narrow or open-source-heavy teams. This
              segmentation matters because Sonar’s moat is strongest when buyers value multi-language quality gates and
              broad developer adoption, but weaker when the buyer wants one security suite, one repository-native
              bundle, or a fast AI reviewer.
