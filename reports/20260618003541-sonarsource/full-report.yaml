      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Segmentation
        blocks:
          - type: paragraph
            body: >
              Sonar is pulled into organizations by developers but normally monetized through engineering and security
              budgets. Developers and team leads are the daily users: they want IDE feedback, pull-request decoration,
              fewer false positives, and fewer late-cycle rework loops. Engineering leaders and platform teams are the
              economic buyers when the priority is standardizing code quality gates, reducing technical debt, and
              scaling AI-assisted development without letting maintainability degrade. AppSec teams and CISOs become the
              buyer or co-buyer when SAST, vulnerability prioritization, SBOM/SCA, and auditability are attached to
              compliance programs, software-supply-chain risk, or regulated releases. Procurement and finance shape the
              final package because enterprise editions are typically priced by lines of code, users, or repository
              scope.


              The adoption path is usually bottom-up-to-platform rather than a single CISO mandate. A developer or team
              adopts SonarQube Community Build, SonarQube for IDE, GitHub checks, or a cloud trial; a platform/security
              group then standardizes gates across repositories; and the enterprise deal expands when compliance
              reporting, branch/PR workflow, SCA, governance, and support requirements exceed free or open-source
              capability. GitHub's default public-repository code scanning and secret scanning create a powerful bundled
              substitute, but private/internal repositories require GitHub Advanced Security products, leaving space for
              neutral multi-SCM vendors. The buyer map therefore fragments by deployment model: cloud-first SMEs care
              about speed and cost; regulated enterprises care about self-hosting, data sovereignty, audit trails, and
              policy consistency across GitHub, GitLab, Bitbucket, Azure DevOps, and IDEs.
