      - number: '3.2'
        title: Direct and Legacy SAST Comparison
        blocks:
          - type: paragraph
            body: >-
              The legacy AppSec competitors pressure Sonar from above. Veracode, Checkmarx, Coverity, and Fortify sell
              to security and compliance teams that prize breadth of vulnerability categories, auditability, binary or
              hybrid scanning, and platform-wide AppSec coverage. Their weakness versus Sonar is developer pull: Sonar’s
              history is code-quality governance embedded in IDE and CI quality gates, not only security-team detection
              queues. Snyk and Semgrep pressure Sonar laterally with developer-first SAST, dependency security, custom
              rules, and AI-assisted triage. GitLab and GitHub are different: they bundle security into the repository
              and merge workflow. For GitHub-native accounts, CodeQL plus Copilot Autofix can reduce the need to adopt a
              separate scanner; for GitLab-native accounts, built-in SAST creates a similar path of least resistance.
              Sonar therefore has to win on quality breadth, low noise, and governance consistency across heterogeneous
              DevOps stacks.
