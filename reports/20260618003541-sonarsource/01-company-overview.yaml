callouts:
  - calloutType: strength
    title: "Category-Defining Developer Adoption"
    body: >
      Sonar's open-source SonarQube engine seeded adoption by 7M+ developers and 75%+ of the Fortune 100,
      analyzing roughly 750 billion lines of code daily. This bottom-up developer install base is a durable
      land-and-expand funnel that few code-quality competitors can match.
    claimRefs: [CO003, CO030, CO031, CO004]

  - calloutType: strength
    title: "Well-Capitalized with IPO-Caliber Leadership"
    body: >
      The 2022 $412M Series D at a $4.7B valuation from Advent, General Catalyst, Insight, and Permira gave
      Sonar substantial runway, and the hire of Tariq Shaukat — who led Bumble's IPO — signals deliberate
      preparation for a public-company trajectory under founder-chairman oversight.
    claimRefs: [CO005, CO006, CO008, CO009]

  - calloutType: risk
    title: "Financial Opacity Limits Conviction"
    body: >
      Sonar discloses no audited financials and no official valuation update since 2022. Third-party revenue
      estimates conflict (≈$98M in 2024 per Latka vs. ~$200M for 2026 elsewhere), forcing reliance on
      operational proxies rather than verified fundamentals.
    claimRefs: [CO032, CO033, CO019]

  - calloutType: risk
    title: "Acquisition-Led AI Pivot Adds Execution Risk"
    body: >
      Three acquisitions in eighteen months (Tidelift, AutoCodeRover, Gitar) must be integrated without
      disrupting the core analyzer, while AI-native code-review rivals intensify competition — a meaningful
      execution and integration risk during the run-up to any IPO.
    claimRefs: [CO024, CO025, CO026, CO038]

