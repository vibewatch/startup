  foundingLocation: "Vernier (Geneva area), Switzerland"
  headquarters: "Geneva, Switzerland (Vernier); US HQ in Austin, TX"
  productSummary: >
    SonarQube Server (self-hosted, in Community Build, Developer, Enterprise, and Data Center editions),
    SonarQube Cloud (SaaS, formerly SonarCloud), and SonarQube for IDE (formerly SonarLint, with connected
    mode). The platform performs static analysis, SAST and increasingly SCA across 30+ languages, using
    deep semantic and taint/dataflow analysis, customizable rules, and Quality Gates built around the
    "Clean Code" methodology. An AI layer adds AI CodeFix, AI Code Assurance, and acquired technology from
    AutoCodeRover (autonomous AI agent), Gitar (AI-native code review), and Tidelift (open-source supply chain).
  customerFocus: "Individual developers and open-source projects (free Community Build / IDE) through SMB and mid-market, expanding to large enterprises and the public sector; 75%+ of the Fortune 100 and 400K+ organizations reported."
  businessModel: "Open-source-led, bottom-up adoption funnel: free Community Build and SonarQube for IDE drive developer usage, converting to paid SonarQube Cloud self-serve and to SonarQube Server Developer/Enterprise/Data Center editions plus enterprise direct sales, priced per developer / lines of code."
  stage: "Series D (late-stage private; IPO reportedly under consideration)"
  fundingStatus: "$412M Series D closed April 2022 at a $4.7B valuation, led by Advent International and General Catalyst with Insight Partners and Permira; third-party trackers estimate total funding near $457M–$458M. No primary financing valuation update announced since 2022."
