companyProfile:
  summary: >
    SonarSource, which brands itself as Sonar, is a Geneva-area (Vernier, Switzerland) code-quality and
    code-security company founded in 2008 by Olivier Gaudin, Freddy Mallet, and Simon Brandhof. Sonar
    builds the SonarQube family of static analysis products that detect bugs, code smells, and security
    vulnerabilities across developer-written, third-party, and AI-generated code. Its portfolio spans
    the self-hosted SonarQube Server (and free Community Build), the SaaS SonarQube Cloud (formerly
    SonarCloud), and the IDE-native SonarQube for IDE (formerly SonarLint), unified by the "Clean Code"
    methodology and Quality Gates. Sonar reports adoption by more than 7 million developers and over 75%
    of the Fortune 100. In April 2022 it raised a $412M Series D at a $4.7B valuation led by Advent
    International and General Catalyst (with Insight Partners and Permira), and it has since acquired
    AutoCodeRover, Tidelift, and Gitar to push into agentic AI code verification. Tariq Shaukat (ex-Google
    Cloud and Bumble president) became sole CEO after joining as co-CEO in September 2023, with co-founder
    Olivier Gaudin transitioning to Founder and Chairman.
  foundedDate: "2008-01-01"
  founders:
    - name: "Olivier Gaudin"
      role: "Co-Founder, Founder & Chairman (former CEO)"
      background: "Led Sonar as CEO for most of its history before transitioning to Founder and Chairman; remains the company's central founder figure."
