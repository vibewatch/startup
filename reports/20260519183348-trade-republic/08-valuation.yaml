- id: SV-SEC-05
  title: Recommendation and Risk Rating
  body: 'RECOMMENDATION: TRACK. Trade Republic earns a Track rating rather than Research More because the growth and profitability
    signals are genuine and confirmed by institutional secondary participants, but the valuation at €12.5 billion implies
    a premium multiple that requires financial transparency the company does not currently provide publicly. For investors
    with access to private data rooms, a Research More or Consider rating would apply; for those relying on public information,
    Track is appropriate until FY2024–2025 audited financials or an IPO prospectus discloses the revenue base, EBITDA margin,
    and MTF revenue ramp. Risk rating: HIGH. Primary risks include (1) PFOF revenue displacement under the MTF model, which
    remains unproven at scale; (2) interest rate sensitivity—EUR rate cuts by the ECB in 2025–2026 could compress net interest
    margin on client cash balances; (3) financial opacity risk—no public accounts means adverse developments may remain invisible
    to market participants until a funding event forces disclosure; (4) competitive risk from incumbent banks launching mobile
    brokerage services; and (5) regulatory risk as ESMA and national consumer bodies continue to scrutinise order-routing
    and data-monetisation models. Valuation stance: STRETCHED. The €12.5 billion mark implies 25–31× estimated 2025 revenue
    versus 14.9× for Robinhood and 3.7× P/Net Contribution for eToro, and requires sustained 40%+ revenue CAGR with expanding
    margins to grow into the multiple at a typical 2027 IPO horizon. The AUM-based metric (8.3% of AUM) is the strongest argument
    for the current mark. Down-round risk is moderate but non-trivial.'
  claimRefs:
  - CV043
  - CV044
  - CV045
  tableRefs:
  - TV005
