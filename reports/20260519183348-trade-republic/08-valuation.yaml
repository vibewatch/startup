callouts:
- id: CLV001
  calloutType: insight
  title: AUM-Based Valuation Most Defensible
  body: At 8.3% of AUM (€12.5B / €150B), Trade Republic's valuation is materially lower than Robinhood's 34.6% of platform
    assets ratio. The AUM-based metric is therefore the strongest argument for the current mark; the revenue multiple (25–31×
    estimated 2025) is the primary source of stretch. If Trade Republic can grow AUM to €200-250B by 2027 while maintaining
    the current revenue-per-AUM ratio, the valuation becomes increasingly defensible even without revenue multiple expansion.
  claimRefs:
  - CV020
  - CV025
- id: CLV002
  calloutType: risk
  title: PFOF Revenue Displacement Remains Unquantified
  body: Trade Republic's BaFin MTF licence obtained January 2026 is designed to replicate PFOF economics under a post-MiFIR
    compliant structure, but actual revenue per order under MTF market-making spreads versus prior PFOF rates has not been
    disclosed. ESMA's research found that PFOF created conflicts of interest and sub-optimal execution quality; the MTF structure
    reduces the conflict but may also reduce the per-order economics. This is the single largest unquantified risk in the
    valuation.
  claimRefs:
  - CV029
  - CV035
  - CV039
- id: CLV003
  calloutType: insight
  title: Secondary-Only Structure Signals Cash-Generative Business
  body: The December 2025 secondary transaction generated zero new information about forward capital needs because no primary
    capital was raised. It validates that the business is cash-generative and self-funding, but the absence of a primary round
    also means no formal subscription agreement required new investors to accept standard information rights—reducing the
    transparency benefit that typically accompanies primary institutional rounds.
  claimRefs:
  - CV002
  - CV004
  - CV009
