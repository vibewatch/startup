- id: SV-SEC-06
  title: Exit Readiness and Final Diligence Asks
  body: 'Trade Republic has demonstrated pre-IPO readiness on several dimensions: ECB banking licence obtained December 2023,
    three years of reported profitability, and an institutional investor base of Fidelity, Wellington, and GIC quality. The
    most likely exit paths are (1) a Nasdaq or Frankfurt Stock Exchange IPO at 18–36 months post-secondary, (2) a strategic
    acquisition by a large European bank or asset manager seeking retail distribution at scale, or (3) continued secondary
    liquidity events with primary capital raised only if geographic expansion requires regulatory licensing capital. Critical
    diligence asks prior to any investment at or above the €12.5 billion mark include: FY2024 and FY2025 audited IFRS revenue
    and EBITDA; the MTF revenue-per-order versus prior PFOF economics; the split between interest income and trading commission
    in the FY2025 revenue base; net revenue per customer by cohort vintage; AUM retention sensitivity to a 20%+ equity market
    drawdown; and the full cap table with liquidation preference waterfall. Without these data points, the precision of any
    DCF or multiple-based valuation is insufficient to underwrite a material position at the current mark.'
  claimRefs:
  - CV001
  - CV007
  - CV008
  - CV009
