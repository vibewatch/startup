  evidenceGaps:
  - type: no-public-evidence
    severity: high
    topic: FY2024–2025 audited revenue and EBITDA not publicly available
    missingEvidence: Trade Republic has not published FY2024 or FY2025 IFRS consolidated accounts. The Bundesanzeiger filing
      for FY2024 is expected approximately Q3–Q4 2026. Without audited revenue and EBITDA, the 25–31× implied P/S multiple
      cannot be independently verified.
    whyItMatters: The implied revenue multiple is the primary source of valuation stretch; without confirmed revenue, any
      bull/base/bear scenario analysis rests on analyst estimates with wide uncertainty bands. This limits the completeness
      of the comparable valuation table, where Trade Republic's own P/S is an estimate.
    diligencePath: Request FY2024 and FY2025 audited IFRS accounts under NDA; monitor Bundesanzeiger for FY2024 annual report;
      watch for IPO prospectus or S-1/F-1 filing on SEC EDGAR.
    relatedQuestionRefs:
    - QV001
    - QV002
    - QV004
    - QV008
    relatedTableRefs:
    - TV004
  - type: no-public-evidence
    severity: high
    topic: MTF revenue-per-order economics vs prior PFOF rates undisclosed
    missingEvidence: Trade Republic obtained its BaFin MTF licence in January 2026 and has not publicly disclosed actual revenue-per-order
      data under the new MTF model versus the prior PFOF rates. This is the single largest unquantified risk in the valuation
      scenario distribution.
    whyItMatters: The MTF model outcome determines whether the bull, base, or bear scenario materialises; if MTF economics
      restore only 50% of prior PFOF rates, the bear scenario becomes the base case.
    diligencePath: Request management data-room presentation on MTF economic model; benchmark against eToro F-1 PFOF disclosure
      for methodology; monitor quarterly operational updates if available.
    relatedQuestionRefs:
    - QV023
    - QV025
    - QV028
  - type: no-public-evidence
    severity: minor
    topic: Cap table, preference stack, and option pool not publicly disclosed
    missingEvidence: Trade Republic has not publicly disclosed its equity cap table, share classes, liquidation preferences,
      or employee option pool. Secondary buyers at €12.5 billion need to understand their economic position relative to prior
      preferred shareholders.
    whyItMatters: An undisclosed preference stack could significantly affect the net proceeds available to secondary purchasers
      in an IPO or M&A exit scenario.
    diligencePath: Request cap table, shareholder agreement, and waterfall analysis under NDA as part of any material investment
      due diligence.
    relatedQuestionRefs:
    - QV022
