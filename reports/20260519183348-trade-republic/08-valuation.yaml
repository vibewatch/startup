company:
  name: Trade Republic
chapter:
  number: 8
  title: Valuation
  summary: 'Trade Republic''s December 2025 secondary sale at €12.5 billion establishes a decacorn mark 2.5× above the 2022
    Series C extension (~€5 billion), backed by first-time institutional shareholders Fidelity, Wellington Management, GIC,
    Khosla Ventures, Lingotto, and Aglaé Ventures with no new primary capital raised. The implied 25–31× estimated 2025 revenue
    multiple represents a material premium to public comparable Robinhood (~15× P/S) and a stretch versus eToro (~4× P/Net
    Contribution), warranted only if profitability continues to compound from the confirmed €14 million FY2023 net profit
    base and top-line growth continues at the 2× pace implied by customer count doubling from ~4 million to 10 million between
    2023 and December 2025. The January 2026 BaFin MTF licence must successfully offset European PFOF ban revenue displacement.
    Financial opacity—Trade Republic remains a private GmbH with no public IFRS filings—limits independent verification. Recommendation:
    TRACK pending material new evidence on FY2024–2025 audited revenue, EBITDA margin, and MTF revenue ramp.'
sections:
- id: SV-SEC-01
  title: Valuation Context and Anchor
  body: 'Trade Republic''s December 2025 secondary round priced the company''s equity at €12.5 billion following the sale
    of approximately €1.2 billion of existing shares by early investors and employees. This transaction involved no new primary
    capital: the company did not issue new shares, and the proceeds went entirely to selling shareholders, confirming management''s
    prior statements that Trade Republic requires no external funding given three consecutive years of profitability. The
    prior institutional mark was the Series C extension closed in June 2022 at approximately €5 billion, co-led by Ontario
    Teachers'' Pension Plan Board at a reported €250 million ticket. The December 2025 secondary therefore implies a 2.5×
    step-up in roughly 42 months, a compound annual appreciation of approximately 32% for early shareholders. Key business
    metrics underpinning the mark include 10 million customers across 17 European countries (up from roughly 4 million at
    the 2022 round), €150 billion in assets under management, and FY2023 net commission income of €179 million with a net
    profit of €14 million versus a loss of €145 million in FY2022. The company received a full ECB banking licence in December
    2023, enabling interest income on client deposits, and obtained a BaFin MTF licence in January 2026 to comply with the
    EU PFOF ban and continue executing customer orders. New investors at the secondary—Fidelity, Wellington Management, GIC,
    Khosla Ventures, Lingotto, and Aglaé Ventures—represent a material quality signal, as these institutions typically conduct
    independent due diligence on revenue and profitability before acquiring secondary exposure. The absence of a down-round
    or re-pricing corroborates no structural adverse change. However, secondary market prices carry an illiquidity premium
    and reflect private-market sentiment that can diverge substantially from public-market comps during risk-on cycles.'
