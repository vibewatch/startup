- id: SV-SEC-04
  title: Investment Thesis and Anti-Thesis
  body: 'The investment thesis rests on five structural pillars. First, Trade Republic is the largest European retail neobroker
    by customer count with 10 million clients across 17 countries, a network position that drives price discovery, liquidity,
    and brand moat. Second, the company has been profitable for three consecutive years, demonstrating that its unit economics
    work at scale—a claim almost no European fintech of its generation can match. Third, the €150 billion AUM base generates
    a structural interest income annuity: at 3% blended yield on even half of investable balances, the income stream alone
    approaches €225 million annually, independent of trading volumes. Fourth, the January 2026 MTF licence shows proactive
    regulatory adaptation—management anticipated the PFOF ban and built infrastructure to comply before the deadline. Fifth,
    the new investor base (Fidelity, Wellington, GIC) is composed of institutions that have independently modelled private
    financials and concluded the €12.5 billion mark is defensible. The anti-thesis is equally compelling. Trade Republic publishes
    no IFRS consolidated accounts beyond partial FY2023 data; there is no way for secondary market purchasers to independently
    verify FY2024–2025 revenue, margin, or balance sheet health without non-public access. PFOF has driven a substantial portion
    of neo-broker transaction revenue, and while the MTF structure aims to replicate these economics, actual revenue per order
    in an MTF model is subject to competitive market-making spread compression. ESMA and national consumer bodies continue
    to scrutinise order-routing practices. Approximately 70% of Trade Republic customers are reportedly first-time investors—highly
    sensitive to market downturns. Finally, comparing Trade Republic to Robinhood is imperfect: Robinhood has crypto revenue,
    options, margin lending, and a much deeper product suite, making the 25–31× implied revenue multiple harder to justify
    on a pure peer-comparison basis.'
