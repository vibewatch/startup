- id: section-4
  title: Capital Adequacy and Financial Profile
  body: |
    Trade Republic has raised more than €1 billion in total primary capital across its venture funding rounds from 2019 through 2022, without raising any primary capital since the June 2022 Series C extension. The company's official statement in December 2025 explicitly confirmed it does not require new capital and that the €1.2 billion secondary transaction was entirely an existing-shareholder exit — no proceeds went to the company. Three consecutive profitable fiscal years (FY2022/23, FY2023/24, FY2024/25) mean Trade Republic is funded by operating cash flow and its existing capital base.
    The ECB banking licence obtained in December 2023 imposes prudential capital requirements under the Capital Requirements Regulation (CRR) and the Single Supervisory Mechanism. Trade Republic has not publicly disclosed its CET1 ratio, total capital requirement, or liquidity coverage ratio. However, the confirmed multi-year profitability and the absence of any BaFin capital-adequacy notice or public intervention suggests the company is comfortably above minimum regulatory capital thresholds. The balance sheet total was approximately €7 billion at end of FY2022/23; with €150 billion AUM by December 2025 (much of which is held in customer custody rather than on Trade Republic's own balance sheet), the bank balance-sheet total is expected to have grown substantially but remains undisclosed.
    For financing dependency assessment: Trade Republic appears capital-independent in the near term given confirmed profitability, no burn, and no imminent debt obligations from the public record. The primary forward financing uncertainty is the cost of the MTF infrastructure build-out — which may require capital investment in technology and market-maker relationships — and the possible revenue shortfall if PFOF replacement economics are less favourable than the existing model. No debt or project-finance obligations appear in the public record.
