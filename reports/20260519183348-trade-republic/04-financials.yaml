chapter:
  number: 4
  title: Financials
  summary: 'Trade Republic reported a first-ever net profit of €14.07 million in FY2022/23 (fiscal year ending September 2023)
    on approximately €190 million revenue, swinging from a €145 million loss the prior year. FY2023/24 saw net income rise
    approximately three-fold and revenues grow more than 50 percent year-on-year, with German financial-register filings pointing
    to roughly €340 million in total revenue and €34.8 million net profit. The company confirmed three consecutive profitable
    fiscal years as of December 2025 and stated it requires no new primary capital. Revenue comes from three main streams:
    payment for order flow (PFOF) commissions — now below 30 percent of revenues — net interest income on customer cash balances
    at 2 percent per annum, and ancillary fees (crypto spread, card interchange). A BaFin-granted MTF licence (January 2026)
    positions Trade Republic to route trades through its own market structure ahead of Germany''s June 2026 PFOF ban. Key
    financial information gaps include the detailed FY2024/25 P&L, granular cost-structure breakdown, disclosed unit-economics
    metrics, and regulatory capital ratios.'
sections:
- id: section-1
  title: Revenue Model and Streams
  body: |
    Trade Republic operates a three-pillar revenue model built on order routing, banking-model interest income, and ancillary fees. The first and historically dominant pillar is payment for order flow (PFOF): when customers execute trades, Trade Republic routes those orders to a market maker — primarily Lang & Schwarz through the LS Exchange — and receives a rebate per order. Under this model, the headline fee to the customer is just €1 per executed order (a Fremdkostenpauschale, or external settlement cost), with zero explicit commission. PFOF has been declining as a share of total revenue; as of January 2026, the company itself acknowledged that PFOF accounts for less than 30 percent of revenues, down from the majority in earlier years.
    The second and now dominant pillar is net interest income. After obtaining its full ECB banking licence in December 2023, Trade Republic began holding customer deposits directly and passing a portion of the ECB deposit rate to customers as 2 percent per annum on uninvested cash balances (reduced from 2.25 percent in June 2025). With over €150 billion in assets under management as of December 2025, even a modest cash fraction generates material interest income — the interest spread between what Trade Republic earns on deposits placed at the ECB or custodian banks and what it pays customers forms the gross interest margin. This pillar is substantially larger in FY2023/24 than FY2022/23 given the much higher AUM base.
    The third pillar covers ancillary fees: a 1 percent spread on crypto trades, a 0.7 percent fee on subsequent credit card and digital wallet deposits (initial deposits and bank transfers are free), card interchange from the Visa debit card, and potential future premium subscription revenues (not yet launched). ETF trades and savings plan purchases are free of the €1 settlement fee, making passive investing effectively zero cost — a deliberate acquisition strategy. Revenue from fixed-income products introduced in 2024 and private markets access launched in 2025 remains at early-stage scale. The Bundesanzeiger register holds Trade Republic's annual account filings from which these revenue figures are drawn.
