- id: section-2
  title: Pricing and Monetization
  body: |
    Trade Republic's list pricing is unusually simple and transparent compared with traditional brokers, which is itself a competitive moat. The core price point — €1 per trade regardless of order size — applies to equities, bonds, and ETF single purchases. This covers exchange connectivity and settlement costs passed through from Lang & Schwarz; Trade Republic earns its margin from the PFOF rebate paid by the market maker rather than from the customer fee itself. ETF savings plans are completely free. Crypto assets carry a 1 percent bid-ask spread with no separate commission. Card deposits beyond the first are charged at 0.7 percent, and all bank transfer deposits are free.
    Cash interest at 2 percent per annum (as of mid-2025) is paid daily on all uninvested euro balances, a feature that has driven significant customer acquisition and AUM inflows. This rate moves with the ECB deposit rate and was reduced from 2.25 percent when the ECB cut rates in mid-2025. Customer cash is distributed across multiple custodian banks (Solaris SE, Deutsche Bank, J.P. Morgan SE, Citibank Europe, HSBC Continental Europe), and deposit insurance covers up to €100,000 per customer under the German EdB scheme, with securities protected up to €20,000 under the German EdW investor compensation scheme.
    Compared to competitor DEGIRO — which charges €0 explicit commission on European home-exchange trades plus a per-exchange connectivity fee of approximately €2.50 per year per exchange — Trade Republic's €1 flat fee is slightly higher for small frequent home-exchange traders but simpler and more competitive across all asset classes including US equities (where DEGIRO charges a transaction fee plus per-share fee). Finanztip, Germany's largest independent consumer-finance platform, listed Trade Republic among the top very-cheap brokers as of September 2025, alongside Smartbroker+, Finanzen.net Zero, and Scalable Capital (Free Broker).
