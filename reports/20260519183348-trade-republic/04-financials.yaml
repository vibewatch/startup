callouts:
- calloutType: strength
  title: Three consecutive profitable years with no new primary capital
  body: Trade Republic confirmed in its December 2025 press release that it has been profitable for three consecutive fiscal
    years and that it does not require new primary capital. This distinguishes it from the large majority of European neobrokers,
    which remain loss-making or capital-dependent at scale. The combination of positive net income, growing AUM, and no new
    equity dilution suggests the zero-commission model can generate durable economics when supplemented by interest income
    and the transition away from PFOF.
  claimRefs:
  - CI016
  - CI017
  - CI018
- calloutType: risk
  title: PFOF ban creates revenue model transition risk in FY2026/27
  body: Germany's PFOF exemption under MiFIR expires in June 2026. Trade Republic obtained a BaFin MTF licence in January
    2026, but the economic terms of the MTF model — including which market makers it will engage, at what rebate economics,
    and whether the net per-order revenue to Trade Republic is equivalent to the legacy PFOF arrangement — are entirely undisclosed.
    If the MTF generates materially lower per-order revenue, and interest income does not fully compensate, FY2026/27 could
    see margin compression despite continued customer and AUM growth.
  claimRefs:
  - CI009
  - CI022
  - CI023
  - CI024
- calloutType: risk
  title: Customer service complaints create regulatory and churn risk
  body: Trade Republic has faced months of sustained criticism for customer-service deficiencies, including account freezes,
    withdrawal delays, and slow AI-chat responses. The vzbv (Germany's federal consumer-protection federation) recorded a
    75 percent year-on-year increase in complaints against Trade Republic as of October 2025. BrokerChooser's 2026 review
    independently documents user-reported operational problems. These complaints constitute both a BaFin consumer-protection
    regulatory risk and a net-promoter-score risk that could slow the referral-driven customer growth model.
  claimRefs:
  - CI027
  - CI031
  - CI037
- calloutType: insight
  title: Interest income now the structural revenue engine — ECB rate sensitivity is key
  body: 'The introduction of 2 percent cash interest in January 2023, combined with €150 billion in AUM as of December 2025,
    has transformed Trade Republic''s revenue structure. Net interest income is now estimated to be the largest and most stable
    revenue stream. This creates meaningful sensitivity to ECB rate decisions: each 25 basis-point ECB cut reduces Trade Republic''s
    gross interest income by an estimated €50–100 million annually (depending on the cash fraction of AUM), while forcing
    a simultaneous decision on whether to reduce the customer rate or compress the margin.'
  claimRefs:
  - CI004
  - CI012
  - CI013
  - CI020
