company:
  name: Trade Republic

chapter:
  number: 1
  title: Company Overview
  summary: >-
    Trade Republic Bank GmbH is a Berlin-based digital bank and neobroker founded in 2015 within the Comdirect Bank
    startup incubator. As of December 2025 the platform serves more than 10 million customers across 17-plus European
    countries with over €150 billion in assets under management. Initially a zero-commission stock trading app, Trade
    Republic received a full ECB banking license in December 2023 and diversified into savings accounts, debit cards,
    current accounts, and private-market access. The company reached decacorn status in December 2025 when a €1.2
    billion secondary round led by Founders Fund and existing investors valued it at €12.5 billion. Trade Republic has
    been profitable for three consecutive fiscal years and is preparing to replace its PFOF-based revenue model ahead
    of the EU-wide ban taking effect in June 2026.

sections:
  - id: section-1
    title: Company Identity and Product Portfolio
    body: >
      Trade Republic Bank GmbH is a Berlin-based neobroker and digital bank that operates as one of Europe's largest
      retail investment platforms. The company was founded in 2015 inside the Comdirect Bank startup incubator in
      Munich and later relocated its headquarters to Berlin, where it remains incorporated under German law and
      supervised by BaFin and the Deutsche Bundesbank. Its legal structure is that of a GmbH (Gesellschaft mit
      beschränkter Haftung), and it holds an ECB-granted full banking license obtained in December 2023, which
      separates it from earlier-generation neobrokers that relied exclusively on third-party partner banks.

      The product portfolio spans zero-commission trading in stocks, ETFs, crypto assets, bonds, and derivatives
      alongside savings plans (Sparpläne), a Visa debit card, euro-denominated current accounts, and interest
      products paying 2% per annum on uninvested cash balances as of early 2026. Trade Republic also offers
      access to private-market investments for eligible customers. This breadth positions Trade Republic as a
      vertically integrated consumer finance platform rather than a single-product brokerage. Approximately 70% of
      its customer base consists of first-time investors, giving the platform an unusually large retail-education
      component. The company operates in 17-plus European countries including Germany, Austria, France, Spain,
      Italy, the Netherlands, and several other EU member states, and employed approximately 1,100 people as of 2025.
    claimRefs:
      - CO001
