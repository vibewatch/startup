callouts:
  - calloutType: strength
    title: Decacorn status with confirmed multi-year profitability
    body: >-
      Unlike many neobrokers that have remained loss-making at scale, Trade Republic confirmed three consecutive
      profitable fiscal years as of December 2025 while simultaneously reaching 10 million customers and a €12.5
      billion valuation. The combination of consumer scale, ECB banking license, and demonstrated unit economics
      distinguishes it within the European retail-investing landscape.
    claimRefs:
      - CO018
      - CO024
      - CO028
  - calloutType: risk
    title: PFOF revenue transition and operational risk pattern
    body: >-
      Trade Republic's historical revenue model relied substantially on payment for order flow, which will be
      eliminated under the EU pan-European ban (Germany's exemption expires June 2026). The company is transitioning
      to an MTF-based order routing model, but the revenue impact of this transition is not yet quantifiable from
      public data. In parallel, the company faces a pattern of recurring adverse events — platform outages,
      consumer-protection lawsuits, and sharply rising customer complaints — that constitute a material operational
      and reputational risk thread.
    claimRefs:
      - CO033
      - CO035
      - CO036
      - CO037
      - CO038
  - calloutType: insight
    title: Interest income emerges as the structural revenue engine
    body: >-
      With €150 billion in AUM and a 2% per annum cash interest product, Trade Republic's interest income has
      become a significant and growing revenue line that partially offsets PFOF dependency. The shift from
      pure-brokerage to banking-model revenue mirrors the strategic rationale behind obtaining the ECB banking
      license and expanding into current accounts and debit cards.
    claimRefs:
      - CO014
      - CO030
      - CO031
      - CO042

