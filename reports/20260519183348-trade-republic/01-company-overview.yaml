  - id: section-4
    title: Scale, Growth, and Financial Performance
    body: >
      Trade Republic's growth trajectory over the four years from 2021 to 2025 is among the most dramatic in
      European fintech. The platform grew from roughly 1 million customers in 2021 to 4 million by early 2022, 8
      million and €100 billion AUM by January 2025, and more than 10 million customers with over €150 billion AUM
      by December 2025. That pace — doubling the customer base and assets in roughly twelve months — reflects both
      organic growth driven by the interest-on-cash product launch and European market expansion including
      dedicated branches established in France, Spain, and Italy in early 2025.

      On financial performance, Trade Republic achieved its first reported net profit in FY2022/23 (the fiscal year
      ending September 2023), reporting approximately €14.1 million in net profit on revenues of roughly €190
      million (€179.9 million in commissions and €10.2 million in interest income), compared with a loss of
      approximately €145 million in the prior period. FY2023/24 data reported by German financial media shows
      roughly €34.8 million net profit on approximately €340 million in revenues (€316 million commissions,
      €225 million administrative expenses, €67 million personnel costs). The company stated in December 2025 that
      it had been profitable for three consecutive fiscal years, confirming continued positive performance in
      FY2024/25. This financial trajectory is material because it demonstrates that the zero-commission model can
      be profitable at scale without relying solely on PFOF when supplemented by interest income and ancillary
      banking services.
    claimRefs:
      - CO023
      - CO024
