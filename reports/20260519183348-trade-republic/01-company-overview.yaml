  - id: section-2
    title: Founders and Leadership
    body: >
      Trade Republic was founded by three co-founders whose complementary academic backgrounds span philosophy,
      physics, and computer science. Christian Hecker studied philosophy in Frankfurt and mathematics and serves as
      CEO; he has been the primary public face of the company throughout its growth journey. Thomas Pischke, who
      studied physics, and Marco Cancellieri, who holds a background in computer science, round out the founding
      trio and remain involved in company leadership. The three founders built the initial product together before
      the company received its first external investment.

      An important early governance fact is that Sino AG, a German securities trading firm, became an early
      majority shareholder around 2017 after investing in the Comdirect-incubated startup. This introduced an
      institutional co-owner at an early stage that differs from typical angel-to-VC trajectories. As the company
      expanded through successive funding rounds from Creandum, Project A, Accel, Founders Fund, and Sequoia, the
      cap table evolved significantly. Beyond the founding team, Trade Republic has not publicly disclosed a broader
      senior leadership roster as of the current report date, which itself is a diligence consideration: the
      leadership concentration and succession risk around the three founders remain relevant to any deeper
      governance assessment.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
    tableRefs:
      - TO002

  - id: section-3
    title: Funding History and Investor Base
    body: >
      Trade Republic's capital formation history follows a conventional VC-to-growth-equity arc that accelerated
      significantly from 2020 onward. The company attracted seed and early-stage backing from Creandum, Project A
      Ventures, and Accel before Founders Fund, the Silicon Valley fund co-founded by Peter Thiel, invested in its
      Series A and later rounds. In May 2021, Trade Republic raised approximately $900 million in a large Series C
      led by Sequoia Capital and Founders Fund at a reported $5 billion valuation, marking its first unicorn
      designation and establishing it among the highest-valued European consumer fintechs at the time.

      A June 2022 Series C extension of €250 million was led by Ontario Teachers' Pension Plan Board at a
      valuation of approximately €5 billion, adding a Canadian institutional anchor. The December 2025 secondary
      transaction fundamentally reset the investor base: a €1.2 billion secondary share sale at €12.5 billion
      pre-money valuation was led by Founders Fund alongside existing investors Sequoia Capital, Accel, TCV, and
      Thrive Capital, with major new entrants including Wellington Management, GIC (the Singapore sovereign wealth
      fund), Fidelity Management and Research, Khosla Ventures, Lingotto Innovation, and Aglaé (the tech-investment
      vehicle of the Arnault family). This secondary round made Trade Republic Europe's first decacorn neobroker
      and significantly broadened the institutional shareholder base with long-duration capital.
    claimRefs:
      - CO014
      - CO015
      - CO016
