summary:
  headline: >-
    Trade Republic is a credible European neobroker decacorn with 10 million customers, €150 billion AUM, and three
    profitable years, but the June 2026 PFOF ban creates an unquantified revenue cliff, the €12.5 billion secondary mark
    implies a 25–31× estimated P/S that screens stretched, and private financial opacity precludes independent valuation
    verification.
