summary:
  headline: >-
    Trade Republic 是可信的欧洲新经纪商十角兽，拥有 1000 万客户、€150 billion 管理资产（AUM），且连续三年盈利；但 2026 年 6 月 PFOF 禁令会带来未量化的收入断崖，€12.5
    billion 老股估值对应估计 25–31× P/S，已显偏高，私营财务披露不足也无法独立核验估值。
  overallScore: 6.5
