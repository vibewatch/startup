slug: trade-republic
runDate: "2026-05-19"
company:
  name: Trade Republic

chapter:
  number: 7
  title: Risks
  summary: >-
    Trade Republic carries an above-average risk profile for a profitable neobank: regulatory exposure is acute
    from the June 2026 PFOF ban affecting approximately 30% of revenue, a live misleading-advertising lawsuit
    over deposit-insurance disclosures filed by Verbraucherzentrale Baden-Württemberg, and 4,000+ BaFin complaints
    from the 2021 GameStop halt. Operationally, April 2025 app outages, dividend-processing errors, and a 75%
    year-on-year rise in formal consumer-body complaints signal that platform reliability has not scaled with
    customer growth. Partner dependency on Lang & Schwarz Exchange for order execution and on BlackRock for
    customer cash introduces critical third-party concentration risks. None of these individually is a fatal
    thesis break, but their convergence at the same time — precisely when the PFOF exemption expires — represents
    the primary investment risk.

sections:
  - id: section-regulatory-legal
    title: Regulatory and Legal Risks
    body: >-
      Trade Republic faces its most material near-term risk from the EU-wide PFOF ban embedded in the amended
      MiFIR (Regulation EU 2024/791), which prohibits investment firms from receiving PFOF as of 28 March 2024.
      Germany notified ESMA on 21 March 2024 that it would use the transitional exemption permitted by Article
      39a(2) of MiFIR, allowing German-domiciled investment firms to continue receiving PFOF from German-domiciled
      clients until 30 June 2026. That deadline is fewer than six weeks from the report date, creating an imminent
      revenue-model transition event. PFOF accounted for approximately 30% of Trade Republic revenue as of January
      2026, down from about one-third at the time of its ECB banking licence in December 2023. Trade Republic
      subsidiary Trade Republic Business III GmbH obtained a BaFin multilateral trading facility (MTF) licence in
      January 2026 to give the company the option to self-execute equity orders and capture the spread currently
      paid to Lang & Schwarz Exchange. However, the actual build-out of live MTF operations remains unconfirmed at
      the report date, so transition risk cannot be fully assessed.

      The GameStop episode of January 2021 remains a live regulatory tail: more than 4,000 complaints were filed
      with BaFin after Trade Republic temporarily halted purchases in meme stocks. No formal BaFin enforcement
      action has been publicly confirmed as of the report date, but the scale of complaints places Trade Republic
      on BaFin supervisory radar. In February 2025, Verbraucherzentrale Baden-Württemberg filed a lawsuit alleging
      misleading advertising on two material points: (a) describing the 3% interest rate as unlimited without
      adequately disclosing that the rate is variable and ECB-dependent; and (b) implying full statutory deposit
      insurance coverage without disclosing that cash in money market funds managed by BlackRock is not covered
      by the EUR 100,000 statutory deposit-insurance guarantee. Separately, Verbraucherzentrale Hamburg issued a
      cease-and-desist notice in 2022 for promoting a free share for account opening while sometimes allocating
      only fractional shares; Trade Republic signed an undertaking. An adverse judgment in the VZ-BW lawsuit could
      require material changes to marketing across all 17+ operating markets, raising customer acquisition costs
      and potentially triggering regulatory scrutiny in other jurisdictions.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
    tableRefs:
      - TR001
    figureRefs:
      - FR001

  - id: section-operational-technology
    title: Operational and Technology Risks
    body: >-
      Platform reliability emerged as a documented, recurrent risk category in 2024 and 2025. In April 2025,
      during extreme market volatility driven by US tariff announcements, Trade Republic app became unavailable,
      preventing users from viewing portfolios or executing trades. The episode was not isolated: other German
      neobrokers also reported simultaneous technical difficulties, but Trade Republic outage attracted particular
      attention given its scale of over 10 million customers and EUR 150 billion in assets under management.
      The Digital Operational Resilience Act (DORA), which came into force across the EU in January 2025, now
      mandates that financial entities including banks maintain written ICT risk-management frameworks, conduct
      annual resilience testing, and notify regulators of major ICT incidents within strict time windows. As a
      newly licensed bank under ECB supervision, Trade Republic faces the full DORA obligation set, and any
      material ICT incident can now trigger a supervisory inquiry.

      Dividend processing failures in 2024 and 2025 linked to a system migration, a September 2025 incident in
      which Trade Republic wrongly debited excessive withholding tax following a delayed update to Nvidia stock-split
      record (with at least one case involving EUR 9,686 in erroneous charges), and November 2025 allegations from
      competitors about slow portfolio transfer execution collectively indicate a pattern of operational errors in
      corporate-actions processing. By 31 October 2025, Verbraucherzentrale Bundesverband had recorded 350 formal
      complaints about Trade Republic, a 75% year-on-year increase. Trade Republic support model relies primarily
      on an in-app chat interface, with some responses generated by AI. Consumer advocates argue this is
      insufficient for a licensed bank handling customers primary current accounts, savings, and investment
      portfolios. BaFin supervisory expectations for banks regarding customer-service standards differ from those
      for the lighter-touch CRR investment-firm licence Trade Republic held prior to December 2023.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
    tableRefs:
      - TR002
    figureRefs:
      - FR002

  - id: section-partner-dependency
    title: Partner and Dependency Risks
    body: >-
      Three critical third-party dependencies define Trade Republic operating architecture. First, equity order
      execution flows through the Lang & Schwarz Exchange, a regulated marketplace operated by Hamburg Stock
      Exchange. Trade Republic receives a rebate (PFOF) for routing orders to this venue. The June 2026 PFOF
      ban will force a decision: either complete the MTF build-out and internalise execution, or establish a new
      execution arrangement under MiFID II best-execution rules without PFOF. The economics of each path are not
      publicly disclosed and represent a material diligence gap. Second, customer cash is split between partner
      banks (including Deutsche Bank, formerly also Solaris, J.P. Morgan SE, and Citibank Europe) and money
      market funds managed by BlackRock. The statutory deposit guarantee covers only the bank-held portion up to
      EUR 100,000 per customer. The money-market-fund portion is classified as Sondervermögen under German law
      (ring-fenced special assets), which provides creditor protection in a BlackRock entity insolvency but does
      not protect against market value loss. Trade Republic does not allow customers to control their allocation
      between the two pools, creating an information and risk asymmetry that the VZ-BW lawsuit specifically targets.
      Third, Trade Republic cloud and technology infrastructure is described as proprietary and built in-house,
      but DORA compliance obligations require disclosure of material ICT third-party providers. The specific cloud
      providers have not been publicly confirmed; this is a residual diligence gap. A failure at any of these three
      dependency points could simultaneously affect customer access, regulatory compliance posture, and revenue.
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
    tableRefs:
      - TR003

  - id: section-financial-model
    title: Financial and Model Risks
    body: >-
      Trade Republic financial model in 2026 is in structural transition. The company reported EUR 34.8 million
      in annual profit for financial year 2023/24 on revenue of approximately EUR 340 million, with commission
      income of EUR 316 million representing over 93% of the total. General administrative expenses were EUR 225
      million, including EUR 67 million in personnel costs. At a EUR 12.5 billion December 2025 secondary
      valuation, Trade Republic trades at approximately 37x FY23/24 revenue — a multiple that demands sustained
      high revenue growth with no significant model disruption.

      Three risks could compress revenue below the base: (1) the PFOF ban removes approximately 30% of revenue
      unless fully replaced by MTF-internalized spread income or explicitly priced commission; (2) ECB rate cuts
      reduce the net interest income earned on customer float, which Trade Republic passes through at 1:1 (the
      rate moved from 2.25% to 2.0% in June 2025); and (3) sustained market-volatility-driven trading inactivity
      reduces transaction-fee revenue. Capital risk is lower than for earlier-stage neobanks given three consecutive
      profitable years, but the ECB banking licence subjects Trade Republic to SREP-driven capital adequacy
      assessments and potential supervisory add-ons if BaFin and ECB flag elevated operational or compliance risk.
      Fraud and AML risk is latent: as Trade Republic processes millions of transactions including crypto trades,
      derivatives, and its Kinderdepot (children account) product, the surface area for financial crime compliance
      failures expands. Concentration in the EU retail investor segment means the business has no geographic or
      customer-segment hedge against a prolonged equity-market downturn.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
    tableRefs:
      - TR004

  - id: section-mitigations-kill-criteria
    title: Mitigations and Kill Criteria
    body: >-
      Trade Republic strongest structural mitigation is the ECB banking licence itself: it enables direct
      deposit-taking, eliminates partner-bank dependency for custodying the core deposit book, and gives the
      company standing to apply for payment system access, widening its revenue options beyond brokerage. The
      January 2026 MTF licence is a proactive hedge against the PFOF ban and, if fully operationalised, could
      allow Trade Republic to capture the execution spread it currently pays away. Three consecutive profitable
      years provide a financial buffer. The founders remain technically engaged in the product, reducing execution
      risk associated with leadership transitions. Consumer complaint volume, while growing, is concentrated in
      specific operational areas (dividend delays, portfolio transfers, customer service) that the company has
      acknowledged and is reportedly addressing through headcount expansion.

      Thesis-break triggers are specific and measurable: (a) a court injunction or BaFin enforcement order
      requiring Trade Republic to materially change its deposit-insurance and interest-rate advertising across
      17+ markets; (b) a failure to implement credible PFOF revenue replacement before 30 June 2026, resulting
      in a revenue step-down exceeding 20% without visible offset; (c) a major ICT incident under DORA leading
      to ECB supervisory action or capital surcharge; (d) a shift in ECB rates that takes the deposit facility
      rate below 1%, removing most of the float income; and (e) a BaFin supervisory action that restricts product
      features, increases capital requirements, or limits customer onboarding in Trade Republic core German market.
      Monitoring indicators include: the BaFin supervisory database for MTF status updates on Trade Republic
      Business III GmbH; the VZ-BW lawsuit docket; the Verbraucherzentrale Bundesverband complaint statistics;
      and Trade Republic next published annual accounts.
    claimRefs:
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
