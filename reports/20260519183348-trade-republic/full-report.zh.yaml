      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              Trade Republic 由三位联合创始人创办，三人的学术背景互补，横跨哲学、物理和计算机科学。Christian Hecker 在 Frankfurt 学哲学，也学过数学，现任
              CEO；在公司增长过程中，他一直是最主要的公众面孔。Thomas Pischke 学物理，Marco Cancellieri 具备计算机科学背景，二人与 Hecker
              组成创始三人组，并仍参与公司领导。公司获得第一笔外部投资前，三位创始人共同搭出了最初产品。

              早期治理上的一个重要事实是：德国证券交易公司 Sino AG 在 2017 前后投资这家 Comdirect 孵化公司后，成为早期多数股东。这让 Trade Republic
              很早就引入了机构共同所有者，不同于典型的天使到 VC 路径。随着公司先后获得 Creandum、Project A、Accel、Founders Fund 和 Sequoia
              等轮次融资，股权结构表发生了显著变化。除创始团队外，截至当前报告日期，Trade Republic
              尚未公开更广泛的高级领导层名单；这本身就是尽调要点：三位创始人周围的领导集中度和接班风险，仍应纳入更深入的治理评估。
