      - number: '6.4'
        title: 客户满意度、投诉与支持质量
        blocks:
          - type: paragraph
            body: >
              客服是 Trade Republic 记录最清楚的运营和声誉短板。2024 年 6 月，公司关闭内部客服子公司 Trade Republic Service GmbH，裁掉数十名服务员工，
              将支持外包给第三方提供商。到 2025 年底，唯一支持渠道是应用内聊天功能；常见问题由 AI 生成回复，复杂案件才有人工客服，而且只提供文字沟通，没有电话热线。

              德国消费者保护数据确认服务质量明显恶化。到 2025 年 10 月 31 日，VZBV（Bundesverband der Verbraucherzentralen）在联邦范围内记录了 350 起关于 Trade
              Republic 的投诉，同比增长 75%。VZBV 称，没有其他新型券商或数字银行按客户数计算收到这么多投诉。据报道，BaFin 投诉数也以相近速度增加，但监管机构拒绝确认细节。 WiWo 2025 年 9
              月报道称，Trade Republic 推出私募股权产品时，用户在 Reddit、Instagram 和 YouTube 公开要求改善客服；在服务没有改善的情况下， 市场情绪强烈反对继续扩展功能。在
              BrokerChooser（2026 年，基于 2026 年 2–5 月 28+ 条独立论坛意见）上，用户最常提到的问题是：支持慢或无帮助、账户冻结和无法解释的提款冻结， 以及应用 bug 导致交易失败或被阻断。

              Trade Republic 于 2025 年 12 月回应 WiWo，承诺在下一阶段服务扩展中提供个人联系选项，目标时间为 2026 年春季。截至 2026 年 5 月，公司支持页面宣传「24/7
              支持：电话和聊天」， 说明该公告至少已有部分落地。它能否解决平台增长野心与服务能力之间的结构性缺口，仍是关键尽调问题。
