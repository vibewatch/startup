  - id: TU005
    title: 扩张与集中度风险评估
    columns:
      - 扩张驱动
      - 集中度风险
      - 影响评估
      - 尽调路径
    rows:
      - - 地理扩张（法国、西班牙、意大利全国分行）
        - 德国历史上约占客户 ~67%；现正转向约 ~33% 国际客户
        - 降低单一市场监管 / 经济风险；法国 PEA 进一步抬高跨境粘性
        - 索取各国 AUM 和客户占比；跟踪法国 PEA 增长与标准账户对比
      - - 产品深化（卡、银行、PEA、PE）
        - 单一产品用户粘性低于多产品客户
        - 如果跨产品采用率站住，单客 LTV 更高；降低交易收入集中度
        - 索取银行卡激活率、使用 2+ 产品的客户占比
      - - 储蓄计划自动投资锁定效应
        - 月度储蓄计划塑造默认留下的行为惯性；取消需要主动退出
        - 储蓄计划用户流失结构性更低；该队列人均 AUM 可能更高
        - 比较储蓄计划用户与非储蓄计划用户流失率（向管理层索取）
      - - 法国 PEA 税务退出摩擦
        - 法国 >1M 客户；PEA 提款存在资本利得税锁定效应
        - PEA 入金后结构性粘性高；转向竞争对手会带来税务成本
        - 跟踪法国 PEA AUM 增长；核验 PEA 产品监管合规
      - - PFOF 欧盟禁令（June 2026）
        - 收入模型部分依赖订单流付款佣金（PFOF）
        - 客户定价可能变化；价格敏感的新手投资者可能流失
        - 监测面向客户的定价沟通；跟踪费用调整是否触发投诉激增
      - - 客户服务恶化
        - 所有客群；高价值客户最可能流向服务更好的竞争对手
        - 投诉激增（VZBV +75%、BaFin 同样增加）可能导致高 AUM 客户不成比例流失
        - 跟踪 BaFin/VZBV 月度投诉趋势；评估 2026 春电话支持质量
      - - 单一客户集中度风险
        - 无企业客户；集中度来自储户分布结构，而非单一客户
        - 前 10% 储户可能贡献不成比例的 NII；确切占比未知
        - 向管理层索取按客户百分位（P50、P75、P90、P99）划分的 AUM 分布
    notes: 影响评估基于产品机制、行业类比和可得证据推断；没有财务模型可精确量化流失或集中度风险。PFOF 禁令影响取决于 Trade Republic 替代收入爬坡（利息收入、结算费）。
