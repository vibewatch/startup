      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              公开与私募可比公司只能部分校准 €12.5 billion 估值，但各自都有局限：Robinhood 和 eToro
              是已上市、在美国注册并披露财务的实体，欧洲新型券商可比公司则处在不同规模或成熟度。Robinhood Markets (HOOD) 是商业模式上最接近的公开参照——面向散户、零佣金执行的券商——FY2025
              总净收入 $4.473 billion（同比 +52%），净利润 $1.879 billion，截至 December 31, 2025 有 27.0 million 入金客户。May 2026 其公开市值为
              $66.82 billion，对应约 14.9× trailing P/S 和 35.6× P/E。Robinhood 的规模、美国市场深度、加密货币和衍生品收入——这些板块在 Trade Republic
              不存在或尚处早期——解释了部分倍数溢价。eToro Group (ETOR) 于 2024 完成 Nasdaq IPO，其 SEC F-1 披露 FY2024 总佣金收入 $931 million、净利润
              $192 million。FY2025 净利润为 $215.7 million，毛利达到 $857 million；eToro 在 May 2026 的市值约为 $3.20 billion，对应约 3.7×
              P/Net Contribution 和 14.9× P/E。flatexDEGIRO (FTK:DE) 是上市欧洲折扣券商，受利润率压力影响，市值低于 €1 billion，P/S 低于 2×，与 Trade
              Republic 隐含倍数形成鲜明反差。Revolut 在 August 2024 员工售股中估值 $45 billion，按多元化银行业务估计 $3 billion 收入计算，约 15× P/S。N26
              最新标记估值为 $9 billion（2021），明显低于当前成长型欧盟金融科技公司的隐含倍数。Trade Republic 隐含 P/S 为 25–31×（假设 FY2025 收入为 €400–500
              million，该估计从 FY2023 €179 million 基数和约 2× 客户 CAGR 推得），高于所有公开可比公司。按 AUM 计算的指标（€12.5 billion / €150 billion
              AUM = 8.3%）比 Robinhood 34.6% 平台资产比更温和，说明 AUM 口径估值可以自洽；溢价主要集中在收入倍数拉伸。
