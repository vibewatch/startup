      - number: '4.2'
        title: 定价与变现
        blocks:
          - type: paragraph
            body: >
              与传统券商相比，Trade Republic 的标价异常简单透明，这本身就是竞争护城河。核心价格点——不论订单规模，每笔交易 €1——适用于股票、债券和 ETF 单笔买入。这覆盖 Lang & Schwarz
              转嫁的交易所连接和结算成本；Trade Republic 的利润来自做市商支付的 PFOF 返佣，而不是客户费用本身。ETF 储蓄计划完全免费。加密资产收取 1% 买卖价差，不另收佣金。首次之后的卡入金按
              0.7% 收费，所有银行转账入金免费。

              现金利息按年化 2%（截至 mid-2025）每日支付给所有未投资欧元余额，这一功能显著推动获客和 AUM 流入。利率跟随 ECB 存款利率变动，并在 ECB 于 mid-2025 降息时从 2.25%
              下调。客户现金分布在多家托管银行（Solaris SE、Deutsche Bank、J.P. Morgan SE、Citibank Europe、HSBC Continental Europe），根据德国 EdB
              计划，每位客户最高 €100,000 存款受保护；证券则根据德国 EdW 投资者赔偿计划最高保护 €20,000。

              相比竞争对手 DEGIRO——其欧洲本土交易所交易显性佣金为 €0，另按每个交易所收取约每年每所 €2.50 的连接费——Trade Republic 的 €1
              固定费用对小额高频本土交易者略高，但更简单，并且在包括美国股票在内的所有资产类别上更具竞争力（DEGIRO 对美国股票收交易费加每股费用）。德国最大独立消费者金融平台 Finanztip 在 September
              2025 将 Trade Republic 列入顶级超低价券商，与 Smartbroker+、Finanzen.net Zero 和 Scalable Capital（Free Broker）并列。
