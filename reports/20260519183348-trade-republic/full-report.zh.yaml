  - id: FM001
    title: 欧洲零售投资市场 — TAM / SAM / SOM 规模金字塔
    type: pyramid
    layout: standard
    summary: 以家庭金融资产总量为起点，到 Trade Republic 可触达和已实现的市场机会，测算欧洲零售投资平台市场的 TAM/SAM/SOM。
    approximationNotes: 所有数字均为基于 EFAMA、ECB 和分析师来源的估计。收入 TAM 存在争议（€2B–€8B 区间）；SOM 反映基于 €150B AUM、假设 0.3–0.7% 货币化率推算出的 AUM 隐含收入。
    data:
      nodes:
        - id: TAM
          label: EU 家庭金融资产总额
          value: ~€25 trillion (total stock)
          detail: 包括存款、保险、养老金、基金；ECB 2024 汇总统计
        - id: SAM-fund
          label: EU UCITS 投资基金资产
          value: ~€20 trillion (AUM stock)
          detail: EFAMA 2024；可通过基金平台和新券商投资
        - id: SAM-revenue
          label: 年收入 TAM — EU 零售平台
          value: €2B–€8B estimated
          detail: 区间反映定义分歧；包括券商佣金、点差、利息、加密
        - id: SAM-TR
