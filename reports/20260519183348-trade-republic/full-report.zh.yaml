      - number: '3.3'
        title: 相邻平台与全球进入者
        blocks:
          - type: paragraph
            body: >
              eToro（NASDAQ: ETOR）是一家以色列创立的社交和跟单交易平台；截至 December 31, 2025，拥有 3.81 million 个入金账户，管理资产 $18.5 billion。其跟单交易和
              Smart Portfolios 使其不同于纯券商，并吸引了与 Trade Republic 70 % 首次投资者基础高度重叠的新手群体。不过，eToro 在欧洲销售
              CFDs——监管研究显示，多数散户客户在这一产品类别上亏钱——并在 2023 年就美国客户未注册证券相关 SEC 指控达成和解。BrokerChooser 评测者指出，高货币兑换费、$5
              提现费和客服慢是长期弱点。Revolut 在结构上是最危险的分发威胁：截至 March 2026，它有 70 million 名客户，2025 收入 £4.5
              billion，规模压过任何欧洲新型券商；其股票交易模块（1,500+ 只美国股票）是付费计划中的免费功能。Revolut 持有 UK 和 Lithuania 银行牌照，并在 November 2025 估值
              $75 billion。但 Revolut 的投资产品很窄（UK 以外没有 ETF、没有储蓄计划、没有固定收益），BrokerChooser 也将客服差和研究工具基础薄弱标为结构性弱点。N26
              通过与其银行账户集成的第三方服务提供免手续费股票和 ETF 交易，但投资只是其核心主张的附属品；N26 明确提醒用户，碎股投资组合不能转移，说明它对券商深度投入有限。Robinhood（NASDAQ:
              HOOD）在 2025 实现 $4.47 billion 收入和 $1.88 billion 净利润，规模和盈利能力远超任何欧洲新型券商，并已开始 EU 扩张。它的免佣金、App
              优先模型已经被验证，但其美国监管记录（2021 年 FINRA 创纪录 $70 million 罚款、多次宕机事件）也说明进入新市场存在执行风险。
