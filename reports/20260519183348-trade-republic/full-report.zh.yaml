  - id: TE003
    title: Trade Republic 技术与运营架构
    columns:
      - 层级 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 移动 App（iOS/Swift、Android）
        - 主要用户界面；承载所有投资、银行和支付操作
        - Apple App Store、Google Play 分发；要求 iOS 16+
        - 应用商店政策变化；iOS 版本碎片化
      - - SectionKit（开源，Swift）
        - 支撑大多数界面的 UICollectionView 组件库
        - 内部 iOS 工程团队；MIT 开源
        - 社区维护风险；约 30 种 section 类型后，屏幕复杂度触顶
      - - 自研银行核心
        - IBAN 发放、存款管理、利息计提、SEPA 处理
        - ECB 银行牌照；BaFin / Bundesbank 监管
        - 单一供应商风险（没有第三方银行软件备份）
      - - 合作银行（Solaris、DB、JPM SE、Citibank EU）
        - TR IBAN 推出前为客户现金提供旧有存款托管；部分角色仍在延续
        - 双边协议；合作方偿付能力
        - 合作方退出会带来集中度风险；存款保险拆分容易让客户混淆
      - - 货币市场基金（现金溢出）
        - 合作银行存放之外，更高现金余额的生息工具
        - 基金管理人；ECB 利率环境
        - 不受法定存款保险覆盖；利率敏感
      - - Lang & Schwarz Exchange（订单路由）
        - 股票订单执行；TR 收取 PFOF 返佣
        - Lang & Schwarz 协议；德国 PFOF 豁免持续到 30 June 2026
        - PFOF 禁令生效日可能扰动收入和执行
      - - MTF（Trade Republic Business III GmbH，BaFin 牌照 Jan 2026）
        - PFOF 之后潜在的内部股票撮合引擎
        - BaFin MTF 授权；流动性提供方
        - 运营仍不成熟；截至 January 2026，是否部署尚未最终确定
      - - Cilicon（开源 macOS CI）
        - 使用 Apple Virtualization Framework，为 iOS / macOS 构建提供一次性自托管 CI 运行器
        - Apple Silicon 硬件；GitHub Actions / Buildkite / GitLab API
        - macOS 15.0–15.3 SSH 稳定性问题（README 中有提示）
    notes: >-
      架构细节来自开源仓库（Cilicon、SectionKit）、Sifted 关于银行牌照的报道、 Handelsblatt 的 MTF 文章（January 2026）和 Wikipedia。内部性能指标和服务端架构
      未公开披露。
