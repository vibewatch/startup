      - number: '8.4'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑建立在五个结构性支柱上。第一，Trade Republic 按客户数已是欧洲最大散户新型券商，在 17 个国家拥有 10 million
              客户，网络位置带来价格发现、流动性和品牌护城河。第二，公司连续三个财年盈利，证明其单位经济模型在规模化后跑得通——同代欧洲金融科技公司几乎没有谁能提出同样主张。第三，€150 billion AUM
              形成结构性利息收入年金：即便只按可投资余额的一半、3% 混合收益率计算，单这条收入流每年就接近 €225 million，且不依赖交易量。第四，January 2026 的 MTF
              牌照显示管理层主动适应监管——团队预判 PFOF 禁令，并在截止日期前搭好合规基础设施。第五，新投资人（Fidelity、Wellington、GIC）都是已独立建模私有财务数据并认为 €12.5 billion
              标记可辩护的机构。反向逻辑同样有力。除 FY2023 部分数据外，Trade Republic 不披露 IFRS 合并账目；没有非公开权限的老股买家无法独立核验 FY2024–2025
              收入、利润率或资产负债表健康度。PFOF 一直驱动新型券商交易收入的相当一部分，MTF 架构虽试图复刻这种经济性，但 MTF 模型下每笔订单实际收入会受做市价差竞争压缩。ESMA
              和各国消费者机构仍在审查订单路由做法。据报道，Trade Republic 约 70% 客户是首次投资者，对市场下行高度敏感。最后，拿 Trade Republic 对标 Robinhood
              并不完美：Robinhood 有加密货币收入、期权、保证金融资和更深的产品套件，因此若只按纯同业比较，25–31× 隐含收入倍数更难自圆其说。
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
