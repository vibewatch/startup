      - number: '6.5'
        title: 留存、耐久性、集中度与证据缺口
        blocks:
          - type: paragraph
            body: >
              Trade Republic 没有公开披露任何标准留存指标：净收入留存率（NRR）、总收入留存率（GRR）、客户流失率、队列存续曲线和净推荐值（NPS），在公开文件和新闻稿中都缺失。
              对任何试图建模客户基数耐久性的投资者来说，这是重要证据缺口。平台结构特征显示，留存具备部分自我强化：储蓄计划每月自动投资，形成默认「留下」决策，行为粘性高于自主决策交易平台。 法国 PEA
              产品还带来税务退出摩擦。BrokerChooser 将 Trade Republic 描述为最适合长期投资者，这与平台偏向被动、定投用户一致。

              集中度风险主要来自地域和人口结构，而不是单一客户。德国历史上约占客户基数三分之二；国际客户占比升至三分之一，降低了单一市场监管和经济敞口。没有客户分位层面的 AUM 分布数据， 但 €1
              最低投资门槛意味着存在大量小额账户长尾。高余额客户可能不成比例地贡献 AUM 相关利息收入；这一子集若流失，财务影响会很大。2026 年 6 月 EU PFOF 禁令可能影响定价或订单路由；
              若为补偿而重新定价，可能引发价格敏感型首次投资者流失。VZBV 和 BaFin 记录的客服恶化带来了流失风险，但公司尚未公开量化。Trade Republic 客户委员会（「Apply Now」）
              作为结构化反馈渠道存在，但似乎只面向少数高参与度客户，而非更广泛客户基数。
