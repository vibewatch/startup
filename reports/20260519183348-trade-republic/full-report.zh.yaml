      - number: '4.5'
        title: 财务信息缺口
        blocks:
          - type: paragraph
            body: >
              作为德国私营 GmbH，Trade Republic 必须向 Bundesanzeiger 和德国商业登记册提交年度账目，但不需要以新闻稿形式发布完整经审计财报。 公开记录包含 FY2022/23 和
              FY2023/24 的简要损益数据（可通过商业登记册获取，也被德国财经媒体报道），但截至本报告日期，以下重要财务数据仍无法从公开来源取得： (1) FY2024/25 损益表——截至 2025 年 9
              月的财年尚未提交或报道；(2) 按资产类别拆分的细分收入（股票、ETF、债券、加密货币、私募市场）； (3) PFOF / Lang & Schwarz Exchange 安排下披露的毛利率；(4)
              客户存款净息差，以及 €150B AUM 中现金与已投资资产的精确比例；(5) 获客成本（CAC）、回本周期和客户终身价值（LTV）；(6) CRR / SSM 下的监管资本比率；(7) 新 MTF
              基础设施的收入和成本基础； (8) 与 Lang & Schwarz 协议的财务条款及任何照付不议义务；(9) Trade Republic 集团结构内的内部收入与成本分摊（GmbH 母公司加 Trade
              Republic Business III GmbH 这个 MTF 子公司）。

              另外，利息收入对 ECB 利率变动的敏感性也未披露：如果 ECB 继续把利率降向 2%（2024 年底已经在这一水平附近），Trade Republic 的净息差会被压缩， 公司可能需要下调 2%
              客户利率，削弱产品吸引力，并可能影响客户留存。这一利率敏感性，是 FY2025/26 和 FY2026/27 展望中最重要、且无法用公开数据量化的财务风险之一。
