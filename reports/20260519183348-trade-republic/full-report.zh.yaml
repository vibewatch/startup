      - number: '2.4'
        title: 增长驱动、采用约束与监管重塑
        blocks:
          - type: paragraph
            body: >
              欧洲零售投资市场同时承受结构性增长顺风和近期监管逆风，两股力量正在一起重塑竞争动态和收入模型。

              最强的结构性增长驱动是 EU
              养老金缺口：未来二十年，多数成员国公共养老金替代率预计下降，个人承担退休储蓄的责任会越来越大。人口结构、劳动市场模式变化和社会保险体系财政约束共同推动这一结构性转变，给零售投资带来一个不依赖短期利率周期的长期激励。EU
              Capital Markets Union 政策议程明确瞄准这一缺口，试图把欧洲家庭储蓄从银行存款（EU 在股票配置上明显落后 US）转向资本市场工具。

              利率动态两头作用。2015–2022 的零到低利率环境，最初因储蓄收益降至零而加速了股票市场参与。之后的高利率阶段（ECB deposit facility rate at 4%,
              2023–2024）给股票交易收入带来竞争压力，同时让现金利息产品变得有吸引力——Trade Republic 用 4% 利息报价抓住了这一动态。ECB 从 2024 开始降息（按 ECB January
              2025 bulletin，每次 25bp），正在降低储蓄收益竞争，并可能重新加速股票产品资金流入。

              PFOF 禁令（MiFIR amendment, June 2026）是近期最重要的约束。PFOF 指做市商为获得散户订单流向券商付款；它曾为 Germany 和 the Netherlands
              的新型券商提供相当大一部分收入。ESMA 正式呼吁禁令，理由是利益冲突以及散户客户执行质量欠佳。禁令迫使 Trade Republic
              和同业转向替代收入模型：基于点差的执行、利息收入、订阅费或高级产品。DORA（Digital Operational Resilience Act）自 January 2025 生效，又增加了一层合规成本，要求
              ICT 韧性测试和第三方风险管理——这对小平台负担格外重，但凭借完整银行牌照和既有监管基础设施，Trade Republic 有能力消化。

              消费者倡导研究中也存在反向信号：Finanztip 和 Stiftung Warentest 对新型券商执行质量、客户服务响应速度和投资者保护披露充分性提出担忧。这可能拖慢更成熟散户群体的采用，也可能触发
              ESMA 对营销标准给出更多指引。
