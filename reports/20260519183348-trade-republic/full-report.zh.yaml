            body: >-
              Trade Republic 已确认的规模——18 个欧洲国家 10 million 客户、€150 billion AUM——使其按客户数和 AUM 计都成为欧洲最大零售券商平台。仅 2024 年就实现
              100% 客户增长（4M → 8M）和 3× AUM 增长（€35B → €100B），按欧洲新型券商标准非常突出，也说明零佣金、移动优先投资模式拥有强产品市场匹配。
