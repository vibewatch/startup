      - number: '1.3'
        title: 融资历史与投资者基础
        blocks:
          - type: paragraph
            body: >
              Trade Republic 的资本形成路径符合从 VC 到成长股权的常规弧线，并在 2020 之后明显加速。公司先后获得 Creandum、Project A Ventures 和 Accel
              的种子及早期支持；随后由 Peter Thiel 共同创办的硅谷基金 Founders Fund 投资其 Series A 及后续轮次。May 2021，Trade Republic 完成约 $900
              million 的大型 Series C，由 Sequoia Capital 和 Founders Fund 领投，据报道估值 $5
              billion；这让它首次进入独角兽行列，也跻身当时估值最高的欧洲消费者金融科技公司之一。

              June 2022 的 €250 million Series C extension 由 Ontario Teachers' Pension Plan Board 领投，估值约 €5
              billion，并引入加拿大机构锚定投资人。December 2025 老股交易则从根本上重置了投资者基础：这笔 €1.2 billion 老股出售以 €12.5 billion 投前估值进行，由
              Founders Fund 牵头，现有投资者 Sequoia Capital、Accel、TCV 和 Thrive Capital 参与，新增主要投资者包括 Wellington
              Management、GIC（新加坡主权财富基金）、Fidelity Management and Research、Khosla Ventures、Lingotto Innovation 和
              Aglaé（Arnault family 旗下科技投资工具）。这一老股轮让 Trade Republic 成为欧洲首个十角兽新型券商，也用长期资本大幅拓宽了机构股东基础。
