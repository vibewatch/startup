      - number: '1.4'
        title: 规模、增长与财务表现
        blocks:
          - type: paragraph
            body: >
              2021 到 2025 的四年里，Trade Republic 的增长轨迹是欧洲金融科技中最激进的一条。平台从 2021 约 1 million 名客户，增长到 early 2022 的 4 million；到
              January 2025 达到 8 million 名客户和 €100 billion AUM；再到 December 2025 超过 10 million 名客户、AUM 超过 €150
              billion。这样的速度——大约十二个月内客户数和资产翻倍——反映了两股力量：现金生息产品推出带来的自然增长，以及欧洲市场扩张，包括 early 2025 在 France、Spain 和 Italy
              设立专门分支。

              财务表现上，Trade Republic 在 FY2022/23（截至 September 2023 的财年）首次报告净利润：收入约 €190 million（佣金 €179.9 million、利息收入
              €10.2 million），净利润约 €14.1 million；上一期间则亏损约 €145 million。德国财经媒体报道的 FY2023/24 数据显示，公司收入约 €340 million（佣金
              €316 million、行政费用 €225 million、人员成本 €67 million），净利润约 €34.8 million。公司在 December 2025 表示已连续三个财年盈利，确认
              FY2024/25 延续正向表现。这条财务曲线很关键：它说明零佣金模型只要叠加利息收入和附属银行服务，不完全依赖 PFOF，也能在规模化后盈利。
