      - number: '5.3'
        title: 银行、卡与支付功能
        blocks:
          - type: paragraph
            body: >
              自 2023 年 12 月取得 ECB 银行牌照后，Trade Republic 已推出完整活期账户套件：独立德国 IBAN、SEPA 转账、定期转账指令、直接借记，以及 2024 年推出的免月费 Visa
              借记卡。该卡支持单笔 €100 起全球 ATM 无限次免费提现，并接入 Apple Pay 和 Samsung Wallet，用于非接触支付。旅行功能主打免手续费外币刷卡消费。 现金利息按 ECB
              存款利率设定（ECB 降息后，截至 2025 年 6 月为 2.00% p.a.），接受 TR IBAN 的客户可对无限额余额按日计息。Saveback 机制——把合格卡消费的 1%（最高
              €1,500/month）记入储蓄计划——前提是储蓄计划每月至少投入 €50。客户现金要么放在合作银行（按 EU 规则，每家银行最高 €100,000 存款保险），
              要么放在货币市场基金（不受法定存款保险覆盖）；这一差异成为 Verbraucherzentrale BW 在 2025 年 1 月提起诉讼的核心。
