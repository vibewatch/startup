      - number: '1.5'
        title: 监管地位与反向事件
        blocks:
          - type: paragraph
            body: >
              Trade Republic 的监管记录既有重要进展，也有反复出现、需要尽调关注的反向事件。积极面是，December 2023 取得完整 ECB 银行牌照是结构性里程碑：它摆脱了对
              Solarisbank、Deutsche Bank AG、JPMorgan SE 和 Citibank Europe 等合作银行的依赖，使 Trade Republic 能够直接持有客户存款，最高到
              €100,000 存款保险限额。BaFin 和 Deutsche Bundesbank 根据 Banking Act（Kreditwesengesetz）共同监管。

              反向面上，多起事件已经累积成运营和合规风险模式。January 2021，散户交易狂潮期间，Trade Republic 暂停 GameStop 相关证券交易，引发客户向 BaFin 提出超过 4,000
              起投诉。2022 年，一场“免费股票”促销活动因误导性广告收到 Verbraucherzentrale Hamburg 的停止侵权函。April 2025，高市场波动期间平台发生宕机。October
              2025，全国消费者监督机构 Verbraucherzentrale Bundesverband（vzbv）报告针对 Trade Republic 的投诉达到 350 起，同比增加 75%，原因包括仅靠 AI
              聊天支持带来的客户服务不足，以及证券账户转移延迟。February 2025，Verbraucherzentrale Baden-Württemberg 因 Trade Republic
              利率和存款保险条款涉嫌误导性广告提起诉讼。Trade Republic 回应称计划扩充人工客服；January 2026，Trade Republic Business III GmbH 获得 BaFin
              的多边交易设施（MTF）牌照，为德国于 June 2026 生效的 EU PFOF 禁令做准备。
