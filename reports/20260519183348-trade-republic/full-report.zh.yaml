      - number: '8.3'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              三种情景刻画假设 2027 IPO 或 Series D 新股融资时的合理估值区间，取决于收入轨迹、利润率扩张和市场环境。乐观情景（€20–25 billion）假设 Trade Republic 在
              FY2026 收入约 €750 million，由 MTF 执行费用全面替代 PFOF 经济性，并叠加 €150 billion AUM 存款带来的利息收入增长。在该情景下，公司 EBITDA 利润率扩至
              20%+，按约 €1 billion 的 FY2027 估计收入以 Robinhood 水平 15× P/S 上市，同时受益于欧盟散户投资参与率持续提升。基准情景（€12–16 billion）假设到
              FY2026 收入达到 €450–550 million，净利率稳定在 5–10%，MTF 收入部分抵消流失的 PFOF 经济性，公司以约 12× trailing P/S 上市或融资——大体持平于
              December 2025 老股标记。若 MTF 模型恢复此前 PFOF 经济性的 70–80%，这一情景最可能成立。悲观情景（€6–9 billion）假设 PFOF 迁移使每笔订单净收入下降 30–40%，若
              ECB 进一步降息则利息收入被压缩，收入增速降至 20% 以下，市场对成长型金融科技公司的情绪恶化。关键敏感项是 PFOF 收入替代：如果 MTF 模型恢复 80%+ 的此前 PFOF
              经济性，基准情景适用；如果只恢复 50%，悲观情景更可能。这个二元变量拉开了很宽的概率扇面：按乐观 / 基准 / 悲观 25%/50%/25% 加权，期望值约 €13–14 billion，接近当前标记。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
