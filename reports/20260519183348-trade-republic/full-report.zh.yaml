      - number: '6.2'
        title: 按使用场景、产品与群体划分客户
        blocks:
          - type: paragraph
            body: >
              Trade Republic 服务的是纯零售个人客户，没有企业或机构客户。在这一人群中，客户覆盖多个相互重叠的使用场景：使用 ETF 和股票储蓄计划（Sparpläne）、
              每月自动投资的长期被动投资者；交易股票、ETF、加密货币和债券的活跃零售交易者；被无限额余额 2% p.a. 现金利率吸引的零售银行客户；合格月消费可获得 1% Saveback 并记入储蓄计划的借记卡用户；法国
              PEA 税收优惠储蓄客群；以及使用新推出儿童储蓄账户的早期家庭客群。BrokerChooser 将 Trade Republic 评为「最适合寻求低成本、
              移动优先投资的长期投资者」，这反映出平台设计更偏向被动、定投型用户，而不是活跃交易者；后者会觉得产品受限（没有衍生品、图表功能基础）。

              据估计，Trade Republic 70% 客户是首次投资者——注册前没有任何券商或投资账户。这一多数群体在欧洲券商格局中并不常见，也塑造了平台的教育口吻、UX 简洁度，
              以及比活跃交易更强调储蓄计划。它也意味着存在大量余额很小的长尾账户（最低投资：€1），因此 AUM 分布很可能被少数高余额客户拉偏。公司明确称，2023–2024 年推出卡和活期账户， 是 2024
              年客户增长的「重要贡献因素」，把 Trade Republic 的触达从有投资意愿的用户扩展到日常银行客户；这些客户可能积极投资，也可能不投资。这种拓宽让客户基数更异质， 不同产品使用场景的留存动态也不同。
