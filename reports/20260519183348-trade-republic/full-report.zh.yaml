            body: >
              Trade Republic 的核心产品差异化靠三根支柱支撑：(1) 极简定价（每笔交易 €1、免费储蓄计划、无卡费、2% 现金利息）；(2) 自建银行基础设施，
              让产品深度整合，不受第三方银行软件延迟拖累；(3) 作为 BaFin / ECB 持牌银行而非 CRR 投资公司，具备监管可信度。2026 年路线图由两项结构性切换定义： 在德国 2026 年 6 月 30
              日豁免到期前，借助 MTF 牌照或替代交易场所替代 PFOF 收入（截至 2026 年 1 月低于总收入 30%）；以及把客服从纯 AI 聊天扩展到直接真人联系。 进入私募市场（Apollo、EQT
              合作）和固定收益，拓宽了零售股票之外的资产类别。2025 年 9 月进入波兰——首个非欧元区市场——是在 ECB 利率环境之外测试这套打法。 关键未决风险包括禁令后定价中的 PFOF 收入缺口、待决的
