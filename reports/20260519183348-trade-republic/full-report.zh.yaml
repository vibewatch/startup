      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: Scalable Capital 的 ECB 银行牌照补上了 Trade Republic 的监管护城河
            body: >
              从 2023 到 Scalable Capital 在 2025 获得自有牌照前，Trade Republic 是唯一拥有完整 ECB 银行牌照的欧洲新型券商，处于独特竞争位置。这条护城河支撑了 Trade
              Republic 无需银行合作伙伴即可提供存款利息、IBAN 账户和 Visa 卡的能力；如今，这条护城河已经被共享。Scalable 可以匹配 Trade Republic
              的银行产品组合，同时保留其订阅模型对高频交易者的成本优势。尽调应评估，监管独占之外，Trade Republic 如何靠产品深度和品牌继续差异化。
            calloutType: risk
            claimRefs:
              - CP033
              - CP034
          - type: callout
            title: 消费者反向证据 — 投诉激增与广告诉讼
            body: >
              德国主要消费者联合会 VZBV 报告针对 Trade Republic 的投诉大幅增加；Verbraucherzentrale Baden-Württemberg 在 2025 年因涉嫌误导性利率广告起诉
              Trade Republic。April 2025 市场抛售期间的平台宕机，又叠加了声誉风险。对一个 70 % 用户都是首次投资者、信任是核心留存机制的平台而言，这些都是重要反向信号。
