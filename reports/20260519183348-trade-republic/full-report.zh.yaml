      - number: '7.5'
        title: 缓释因素与否决条件
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 最强的结构性缓释因素就是 ECB 银行牌照本身：它允许公司直接吸收存款，消除核心存款账簿托管对合作银行的依赖，并让公司具备申请支付系统接入的资格，
              将收入选项从券商业务扩展出去。2026 年 1 月取得的 MTF 牌照，是对 PFOF 禁令的主动对冲；如果全面投产，Trade Republic 或可拿回目前外付的执行价差。
              连续三年盈利提供了财务缓冲。创始人仍深度参与产品技术，降低了领导层更替带来的执行风险。消费者投诉量虽在增长，但集中在特定运营领域（股息延迟、投资组合转移、客服）， 公司已承认这些问题，据报道也在通过扩充人手处理。

              打破投资逻辑的触发条件具体且可衡量：(a) 法院禁令或 BaFin 执法令要求 Trade Republic 在 17+ 市场大幅修改存款保险和利率广告；(b) 未能在 2026 年 6 月 30 日前落实可信的
              PFOF 收入替代方案，导致收入阶跃式下滑超过 20%，且看不到抵消项；(c) DORA 下的重大 ICT 事件引发 ECB 监管行动或资本附加；(d) ECB 利率变化使存款便利利率低于 1%，
              拿走大部分浮存收入；(e) BaFin 监管行动限制产品功能、提高资本要求，或限制 Trade Republic 核心德国市场的客户开户。监测指标包括：BaFin 监管数据库中 Trade Republic
              Business III GmbH 的 MTF 状态更新；VZ-BW 诉讼案卷；Verbraucherzentrale Bundesverband 投诉统计；以及 Trade Republic
              下一份已发布年度账目。
