      - number: '4.3'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >
              对一家私营公司而言，Trade Republic 披露的单位经济性数据很少；但已发布的年度账目数据和财经媒体分析，足以做部分重建。FY2022/23，公司行政和运营成本较上一年减少约 €84
              million——这是一次剧烈的结构改善，归因于 2022 金融科技行业收缩后营销支出下降、技术成本降低和运营效率提升。FY2022/23，公司在约 €190 million 收入上实现 €14.07
              million 净利润，意味着约 7% 净利率。FY2023/24，德国商业登记数据指向约 €340 million 收入、约 €34.8 million 净利润——约 10% 净利率；以约 7–8
              million 平均客户为基数，单客户收入约为每年 €40–50（年化单用户收入，ARPU）。

              与全服务银行相比，这个 ARPU 明显偏低，但符合新型券商同业组。截至 December 2025，公司拥有 10 million 名客户和 €150 billion AUM，隐含每位客户 AUM 为
              €15,000——这个数字有意义，说明客户不只是开空账户。FY2023/24，Trade Republic 对 AUM 的有效抽成率（收入占 AUM 比例）估计约
              0.2–0.3%，远低于智能投顾或主动基金管理人收取的 50–100 个基点费用；但对一家靠交易量和规模变现的低成本平台而言，这一水平合理。

              毛利率驱动因素包括 PFOF 返佣经济性（不透明，未公开披露）、客户现金净息差，以及 1% 加密点差。最大成本类别是人员成本（按商业登记数据，FY2023/24 约 €67
              million）、行政成本（FY2023/24 约 €225 million），以及在 17+ 欧洲市场运营全牌照银行产生的监管合规成本。BrokerChooser 的 2026
              评测指出，客服容量一直是反复出现的痛点；有记录的用户报告包括账户冻结、提现延迟和支持响应慢——这说明，客服成本投入不足曾是运营利润率来源，但也正在变成更大的责任风险。
