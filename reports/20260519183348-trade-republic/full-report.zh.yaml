chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与产品组合
        blocks:
          - type: paragraph
            body: >
              Trade Republic Bank GmbH 是总部位于 Berlin 的新型券商和数字银行，也是欧洲最大的零售投资平台之一。公司 2015 年在 Munich 的 Comdirect Bank
              创业孵化器成立，之后将总部迁至 Berlin；公司仍按德国法注册，受 BaFin 和 Deutsche Bundesbank 监管。其法律形式为 GmbH（Gesellschaft mit
              beschränkter Haftung），并持有 December 2023 取得、由 ECB 授予的完整银行牌照；这使它有别于早期完全依赖第三方合作银行的新型券商。

              产品组合覆盖股票、ETF、加密资产、债券和衍生品零佣金交易，也包括储蓄计划（Sparpläne）、Visa 借记卡、欧元活期账户，以及截至 early 2026 向未投资现金余额支付年化 2%
              的利息产品。Trade Republic 还为符合条件的客户提供私募市场投资入口。这一宽度让 Trade Republic 更像纵向整合的消费者金融平台，而不是单一产品券商。约 70%
              的客户是首次投资者，因此平台承担了异常大的散户教育功能。公司进入 17 个以上欧洲国家，包括 Germany、Austria、France、Spain、Italy、the Netherlands 以及多个其他
              EU 成员国；截至 2025，员工约 1,100 人。
