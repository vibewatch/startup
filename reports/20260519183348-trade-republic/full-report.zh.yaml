      - number: '3.4'
        title: 切换成本、锁定效应与多栖使用
        blocks:
          - type: paragraph
            body: >
              欧洲零售券商的切换成本中等，但不能忽视。Trade Republic 的储蓄计划（Sparpläne）——对股票、ETF
              或加密货币做周期性自动投资——会培养使用习惯，并积累让用户不愿转移的持仓。整合后的产品组合（券商 + 利息账户 + Visa 借记卡）让 Trade Republic
              成为许多客户的主要金融关系，提高了转向单一产品券商的感知成本。不过，结构性锁定有限：EU 的 MiFID II 框架要求投资组合转移权，转出时每个持仓 €0–€25 的标准费用，对较大组合仍可承受。N26
              明确指出，碎股和 ETF 无法通过投资组合转移，这暴露出一个实践障碍，会降低包括 Trade Republic
              在内所有新型券商之间的可携性。多栖使用——同时使用多家券商——在欧洲活跃散户中很普遍，这意味着即便是自己的客户，Trade Republic 也拿不到全部钱包份额。Revolut
              用户常在专门券商处开第二个账户，以获得更广的 ETF 覆盖。最强的事实锁定机制有三类：（1）储蓄计划心理——动量式投资带来惯性；（2）现金利息——持有 2.5 % p.a.
              闲置余额的客户，搬走现金会有机会成本；（3）品牌信任——一旦用户把养老金储蓄交给某个平台，不论产品缺口如何，迁移的情绪成本都很高。包括 Trade Republic
              在内，欧洲新型券商基本没有分发锁定（独家渠道、雇主合作等）。
            claimRefs:
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
      - number: '3.5'
        title: 护城河耐久性、反向证据与竞争风险
        blocks:
          - type: paragraph
            body: >
              Trade Republic 的竞争优势——价格领导力、银行牌照整合，以及首次投资者中的品牌信任——都面临具体威胁。Scalable Capital 2025 年取得 ECB 银行牌照，消除了 Trade
              Republic 自 2023 以来拥有的监管护城河；Scalable 因此可以提供存款利息和卡产品，这些此前在新型券商板块只有 Trade Republic 能做。DEGIRO 对活跃交易者的逐笔成本更低（€1
              加处理费，而 Trade Republic 是 €1 固定收费），交易所接入也更强（50+ 家交易所，对比 Trade Republic 更窄的选择），这会吸引 Trade Republic
              难以留住的更成熟投资者群体。商品化威胁真实存在：当定价趋近于零（N26 免手续费交易、Revolut 付费计划中的免费月度交易），收入就必须迁移到银行点差和利息收入——这正是 Trade Republic
              正在执行的策略，但也让它暴露于利率周期风险。针对 Trade Republic 自身的反向证据很重要：VZBV（德国主要消费者联合会）报告针对 Trade Republic
              的投诉大幅增加；Verbraucherzentrale Baden-Württemberg 在 2025 年就误导性利率广告起诉 Trade Republic；WirtschaftsWoche
              报道记录了客服失败，这些失败推动了客户流失，并迫使 Trade Republic 公开承诺扩充服务。April 2025
              高峰市场波动期间的平台宕机，进一步凸显快速扩张带来的运营风险。这些反向信号有竞争意义：它们削弱了 Trade Republic
              相对监管较弱同业所声称的信任差距，也给比较媒体和消费者倡导者提供了把用户导向别处的理由。
