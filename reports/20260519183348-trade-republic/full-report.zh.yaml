      - number: '7.4'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              2026 年，Trade Republic 的财务模型正处于结构性转型。公司 FY2023/24 收入约 EUR 340 million，年利润 EUR 34.8 million；其中佣金收入 EUR 316
              million， 占总收入超过 93%。一般管理费用为 EUR 225 million，其中人员成本 EUR 67 million。按 2025 年 12 月老股交易 EUR 12.5 billion 估值计算，
              Trade Republic 约为 FY23/24 收入的 37x——这个倍数要求公司持续保持高收入增长，且模型不能出现重大扰动。

              三类风险可能把收入压到基准以下：(1) PFOF 禁令拿走约 30% 收入，除非由 MTF 内部化价差收入或明确定价佣金完全替代；(2) ECB 降息降低客户浮存资金带来的净利息收入， 而 Trade
              Republic 以 1:1 传导（2025 年 6 月利率从 2.25% 调至 2.0%）；(3) 市场波动持续导致交易不活跃，削减交易费收入。鉴于已经连续三年盈利， 资本风险低于更早期新型银行；但 ECB
              银行牌照使 Trade Republic 接受 SREP 驱动的资本充足率评估。如果 BaFin 和 ECB 标记运营或合规风险上升，还可能出现监管附加要求。 欺诈和 AML 风险潜伏存在：随着 Trade
              Republic 处理包括加密货币交易、衍生品和 Kinderdepot（儿童账户）产品在内的数百万笔交易，金融犯罪合规失误的暴露面会扩大。 业务集中在 EU
              零售投资者群体，也意味着若股票市场长期下行，公司没有地域或客户细分上的对冲。
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
