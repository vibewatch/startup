      - number: '2.2'
        title: 市场规模 — TAM、SAM 与矛盾估计
        blocks:
          - type: paragraph
            body: >
              用不同镜头看，欧洲零售投资市场规模会得出互不兼容的估计；这些矛盾应被保留，而不是被强行调和。最宽口径指标——EU 家庭金融资产总额，包括银行存款、人寿保险、养老金权益和投资基金——按 ECB 汇总统计，2024
              年估计超过 €25 trillion。但这一数字包含投资平台无法触达的被动储蓄。更窄的 TAM——EU 零售投资平台可触达的年度收入——分析师估计在 €2 billion 到 €8 billion
              之间，取决于是否计入订阅费、交易收入、外汇点差、加密交易收入和客户现金利息收入。EFAMA 报告称，欧洲 UCITS 行业资产从 2020 约 €16 trillion 增至 2024 超过 €20
              trillion，反映市场升值和净流入，但这些是存量指标（总 AUM），不是收入指标。

              Trade Republic 的 SAM——在其当前地域和产品足迹下可触达的子集——还受到三项约束：监管授权仅覆盖 17 个以上 EU 成员国；零佣金模型排除了逐笔交易佣金收入；公司没有投顾服务。基于 Trade
              Republic 自身轨迹（€150 billion AUM、10 million 名客户）和已披露的连续三年盈利，PFOF 等价收入与过渡期收入的粗略收入 SAM 似乎在每年 €500 million 到
              €1.5 billion 区间内有合理性；但由于 Trade Republic 没有披露收入拆分，这个数字本质上很不精确。可获取市场（SOM）——Trade Republic
              近期现实可拿下的份额——考虑到其欧洲领先位置，已经部分兑现；但 June 2026 前必须完成收入模型转型的 PFOF 禁令，仍在施压。

              一个关键矛盾数据点是：EFAMA 的 UCITS 数据和 ECB
              家庭资产负债表都指向非常庞大的可投资资产存量；而按收入口径的分析师估计显示变现率很低，这意味着要么存在显著价格下行压力，要么潜藏很大的收入上行空间。没有 Trade Republic 自身 P&L
              披露，任何一边都无法确认。
