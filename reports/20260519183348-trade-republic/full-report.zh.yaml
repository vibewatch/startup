      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 的运营架构由三项关键第三方依赖定义。第一，股票订单执行流向 Lang & Schwarz Exchange，这是由 Hamburg Stock Exchange 运营的受监管市场。
              Trade Republic 因把订单路由到该场所而获得返点（PFOF）。2026 年 6 月 PFOF 禁令将迫使公司做选择：要么完成 MTF 建设并内部化执行，要么在没有 PFOF 的情况下， 按 MiFID
              II 最佳执行规则建立新的执行安排。每条路径的经济性都未公开披露，是重要尽调缺口。第二，客户现金被分在合作银行（包括 Deutsche Bank，此前还包括 Solaris、J.P. Morgan SE 和
              Citibank Europe）以及 BlackRock 管理的货币市场基金之间。法定存款保证只覆盖银行持有部分，每名客户最高 EUR 100,000。 货币市场基金部分按德国法归类为
              Sondervermögen（隔离特别资产），在 BlackRock 实体破产时提供债权人保护，但不防范市场价值损失。Trade Republic 不允许客户控制两类资金池之间的分配，
              形成信息与风险不对称，也正是 VZ-BW 诉讼瞄准的问题。第三，Trade Republic 的云和技术基础设施被描述为自有且自建，但 DORA 合规义务要求披露重要 ICT 第三方提供商。
              具体云提供商尚未公开确认，这是残余尽调缺口。上述三处依赖点中任何一处失效，都可能同时影响客户访问、监管合规状态和收入。
