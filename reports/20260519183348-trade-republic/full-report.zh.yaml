      - number: '4.7'
        title: 图表
        blocks:
          - type: callout
            title: 连续三年盈利，且没有新增新股资本
            body: >-
              Trade Republic 在 2025 年 12 月新闻稿中确认，公司已连续三个财年盈利，且不需要新增新股资本。这使它区别于绝大多数欧洲新型券商，后者在规模化后仍亏损或依赖资本。 正净利润、增长中的
              AUM、没有新增股权稀释三者叠加，说明零佣金模式在利息收入补充、并逐步摆脱 PFOF 后，可以产生更持久的经济性。
            calloutType: strength
            claimRefs:
              - CI016
              - CI017
              - CI018
          - type: callout
            title: PFOF 禁令给 FY2026/27 带来收入模型切换风险
            body: >-
              德国在 MiFIR 下的 PFOF 豁免将于 2026 年 6 月到期。Trade Republic 已在 2026 年 1 月取得 BaFin MTF 牌照，但 MTF 模式的经济条款完全未披露：
              包括会接入哪些做市商、返点经济性如何、Trade Republic 的单笔订单净收入是否等同于传统 PFOF 安排。如果 MTF 产生的单笔订单收入显著更低，且利息收入无法完全补上， 即便客户和 AUM
              继续增长，FY2026/27 也可能出现利润率压缩。
            calloutType: risk
            claimRefs:
              - CI009
              - CI022
              - CI023
              - CI024
          - type: callout
            title: 客服投诉带来监管和流失风险
            body: >-
              Trade Republic 因客服短板连续数月遭到批评，问题包括账户冻结、提款延迟、AI 聊天响应慢。到 2025 年 10 月，vzbv（德国联邦消费者保护协会）记录的 Trade Republic
              相关投诉同比增加 75%。BrokerChooser 2026 年评测也独立记录了用户报告的运营问题。这些投诉既构成 BaFin 消费者保护监管风险，也构成净推荐值风险， 可能拖慢依靠转介绍驱动的客户增长模式。
            calloutType: risk
            claimRefs:
              - CI027
              - CI031
              - CI037
          - type: callout
            title: 利息收入已成结构性收入引擎——ECB 利率敏感性是关键
            body: >-
              2023 年 1 月推出 2% 现金利息，加上截至 2025 年 12 月的 €150 billion AUM，已经改变了 Trade Republic 的收入结构。
              目前估计净利息收入是最大、也最稳定的收入流。这使公司对 ECB 利率决策高度敏感：ECB 每降息 25 个基点，Trade Republic 年化总利息收入估计减少 €50–100 million （取决于
              AUM 中现金占比），同时公司还必须决定是下调客户利率，还是压缩自身利润率。
            calloutType: insight
            claimRefs:
              - CI004
              - CI012
              - CI013
              - CI020
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户流程
        blocks:
          - type: paragraph
            body: >
              Trade Republic 用一个移动应用把投资、消费和储蓄串在一起，覆盖 iOS（版本 4.2621.0，要求 iOS 16+，326.6 MB）和 Android。 应用覆盖完整零售金融生命周期：移动
              KYC 开户；用 SEPA 入金，从 €1 起投资超过 10,000 只股票、ETF 和加密货币；免费的 ETF 与股票储蓄计划（Sparpläne），自动定期执行； 从 €1 起投债券（固定收益）；通过
              Apollo 和 EQT 合作接入私募市场基金；以及 Visa 借记卡，对无限额余额提供与 ECB 挂钩的 2% p.a. 现金利息。 Saveback 功能把卡消费的 1%（最高
              €1,500/month）记入用户储蓄计划，打通日常消费与长期投资。儿童储蓄账户把产品延伸到未成年投资者。2022 年 10 月推出的碎股交易， 让用户可以从 €1 起投资高价股票。单笔证券订单收取固定 €1
              第三方结算费；储蓄计划执行免费。
