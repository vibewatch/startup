          - type: callout
            title: 尽调优先级：MTF 收入模型与 VZ-BW 诉讼状态
            body: >-
              作出任何投资决定前，最高优先级的两个尽调问题是：(1) 确认 Trade Republic Business III GmbH 是否已通过 MTF 执行实时客户交易，以及相对于 PFOF 的利润率如何； (2)
              获取 VZ-BW 诉讼当前状态，包括是否已发出或预计会发出临时禁令。两者都会实质影响当前 EUR 12.5 billion 估值下的投资逻辑。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR033
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与锚点
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 2025 年 12 月老股交易中，早期投资者和员工出售约 €1.2 billion 现有股份，公司股权定价为 €12.5 billion。这笔交易不包含新增新股资本：
              公司没有发行新股，资金全部流向出售股东，印证了管理层此前说法——连续三年盈利后，Trade Republic 不需要外部融资。上一轮机构估值锚点是 2022 年 6 月完成的 Series C 延展轮，估值约
              €5 billion，由 Ontario Teachers' Pension Plan Board 联合领投，据报道出资 €250 million。因此，2025 年 12 月老股交易意味着约 42
              个月内估值提升 2.5×，早期股东复合年升值约 32%。支撑该估值的关键业务指标包括：17 个欧洲国家 10 million 客户（高于 2022 年融资时约 4 million）、€150 billion
              AUM、 FY2023 净佣金收入 €179 million、净利润 €14 million，而 FY2022 亏损 €145 million。公司于 2023 年 12 月取得完整 ECB
              银行牌照，可以从客户存款获得利息收入； 又于 2026 年 1 月取得 BaFin MTF 牌照，以符合 EU PFOF 禁令并继续执行客户订单。老股交易的新投资者——Fidelity、Wellington
              Management、GIC、Khosla Ventures、 Lingotto 和 Aglaé
              Ventures——构成重要质量信号，因为这类机构通常会在获得老股敞口前，对收入和盈利能力做独立尽调。没有下轮融资或重新定价，也印证没有结构性负面变化。
              但老股市场价格包含流动性不足溢价，也反映私募市场情绪；在风险偏好上行周期，这种情绪可能与公开市场可比公司显著背离。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
