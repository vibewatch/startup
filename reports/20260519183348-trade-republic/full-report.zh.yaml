  - id: FO002
    title: 商业模式与产品流
    type: flow
    layout: standard
    summary: Trade Republic 把零售投资者聚合到垂直整合平台；收入来自订单路由（PFOF 转型）、现金利息和银行服务，同时监管约束塑造成本和合规架构。
    data:
      nodes:
        - id: customers
          label: 零售投资者（10M+，70% 首次投资）
          detail: 主要是年轻、移动优先的欧洲零售投资者，被零佣金交易吸引。
          tone: positive
        - id: products
          label: 零佣金交易与银行业务
          detail: 股票、ETF、加密货币、债券、衍生品、储蓄计划、借记卡、活期账户、利息产品。
          tone: positive
        - id: revenue-trading
          label: 订单路由与 PFOF（转型中）
          detail: 把零售订单流导向做市商产生收入；EU 禁令要求到 2026 年 6 月前用 MTF 方案替代。
          tone: neutral
        - id: revenue-banking
          label: 利息收入与银行费用
          detail: €150B+ AUM 和客户现金余额产生的净息差，年化 2%；主要增长驱动。
          tone: positive
        - id: regulation
          label: ECB / BaFin / Bundesbank 监管
          detail: 自 2023 年 12 月持有完整银行牌照；EU 法规要求完成 PFOF 转型。
          tone: neutral
        - id: constraints
          label: 负面事件与诉讼
          detail: 客服投诉、平台宕机、消费者保护诉讼、广告审查。
          tone: warning
      edges:
        - from: customers
          to: products
        - from: products
          to: revenue-trading
        - from: products
          to: revenue-banking
        - from: regulation
          to: products
        - from: constraints
          to: products
    approximationNotes: null
    claimRefs:
