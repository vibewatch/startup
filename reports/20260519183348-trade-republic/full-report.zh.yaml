      - number: '3.2'
        title: 直接同业画像 — Scalable Capital 与 flatexDEGIRO
        blocks:
          - type: paragraph
            body: >
              Scalable Capital 是 Trade Republic 在欧洲结构上最相似的对手。Scalable 于 2014 在 Munich 创立，2016 以智能投顾起步，2020 之后转向自助券商。到
              2025，Scalable 持有 €30 billion AUM、超过 1 million 名客户，并获得完整 ECB 银行牌照；这侵蚀了 Trade Republic
              此前作为唯一拥有完整欧洲银行授权的新型券商的监管独占优势。Scalable 的商业模式依赖固定费率订阅（Prime Broker），用月费换取无限交易；这比 Trade Republic
              的逐笔收费模型更奖励高频交易者。Scalable 还运营 European Investor Exchange（EIX），这是它与 Hannover Stock Exchange
              共同创办的自有交易场所——一套纵向整合打法，可能降低其对第三方做市商的依赖。Scalable 服务 Germany、Austria、France、Italy、Spain 和 the
              Netherlands，意味着地理竞争几乎全面重叠。flatexDEGIRO（Nasdaq 上市：FTK）是低成本泛欧洲券商存量玩家，直接覆盖面最大：在 16 个国家拥有 3.5 million
              名客户，每年处理超过 75 million 笔交易。DEGIRO 早在 Trade Republic 2019 推出前，就已在欧洲开创低成本交易；其逐笔费用为每笔股票交易 €1 加交易所处理费，并对核心 ETF
              组合零佣金。FlatexDEGIRO 受益于银行身份（FlatexDEGIRO Bank AG）和机构级托管基础设施，但缺少推动 Trade Republic 存款增长的消费者银行业务和现金生息产品组合。
