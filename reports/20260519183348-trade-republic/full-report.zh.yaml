      - number: '2.3'
        title: 购买者、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              欧洲零售投资市场的购买者版图高度碎片化，无法套入单一画像。对新型券商而言，最重要的分层维度是既有投资经验：Trade Republic 客户中约 70%
              是首次投资者，这说明平台更像此前没有投资的欧洲人的入口，而不是从传统券商迁移价值的打法。首次投资者这一群体，人均 AUM 低，对用户体验和 App
              质量高度敏感；价格弹性集中在零佣金定位，而不是绝对收益；起步时也更倾向 ETF 储蓄计划，而不是主动选股。

              在新型券商交易里，付费方和用户通常是同一个人——自助式散户投资是直面消费者模型，个人同时承担决策和成本。这里没有企业或 B2B
              付费方动态。预算完全由散户客户掌握，由其配置可自由支配储蓄。不同细分人群的采用触发点不同：首次投资者看重移动 App
              简单、零佣金定位和社会证明；从传统券商迁移的成熟用户看重费用对比和产品宽度；从现金储蓄转向利息产品的用户，看重与传统银行储蓄账户的收益率比较。

              购买者分层也带有地域维度：德国散户投资者的股票参与率历史上低于 Scandinavia 或 the Netherlands 等同业市场，说明德国和南欧市场的可触达增长，可能高于已经高度参与的市场。World
              Bank Global Findex 2025 数据确认，欧洲银行账户渗透率超过 94%，因此零售投资的障碍不是金融接入，而是行为惯性和价格敏感。
