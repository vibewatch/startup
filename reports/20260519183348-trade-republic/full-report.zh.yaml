      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              2024 和 2025 年，平台可靠性已成为有记录、反复出现的风险类别。2025 年 4 月，在美国关税公告引发极端市场波动期间，Trade Republic 应用无法使用，用户无法查看投资组合或执行交易。
              这不是孤立事件：其他德国新型券商也报告了同时发生的技术问题，但鉴于 Trade Republic 拥有超过 10 million 客户和 EUR 150 billion AUM，其宕机受到格外关注。 2025 年
              1 月在 EU 全域生效的《数字运营韧性法案》（DORA）现在要求包括银行在内的金融实体维护书面 ICT 风险管理框架，进行年度韧性测试， 并在严格时限内向监管机构报告重大 ICT 事件。作为 ECB
              监管下的新持牌银行，Trade Republic 需要承担完整 DORA 义务；任何重大 ICT 事件现在都可能触发监管问询。

              2024 和 2025 年与系统迁移相关的股息处理失败、2025 年 9 月因 Nvidia 拆股记录延迟更新而错误多扣预提税的事件（至少一例错误扣款 EUR 9,686）、 以及 2025 年 11
              月竞争对手关于投资组合转移执行缓慢的指控，共同显示公司在公司行动处理上存在一类运营错误。到 2025 年 10 月 31 日， Verbraucherzentrale Bundesverband 已记录 350
              起关于 Trade Republic 的正式投诉，同比增长 75%。Trade Republic 支持模式主要依赖应用内聊天界面，部分回复由 AI 生成。
              消费者权益人士认为，对于一家处理客户主要活期账户、储蓄和投资组合的持牌银行，这种支持不足。BaFin 对银行客服标准的监管预期，与 Trade Republic 在 2023 年 12 月前持有的轻监管 CRR
              投资公司牌照不同。
