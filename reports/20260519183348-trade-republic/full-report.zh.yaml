  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户规模与地域分布
        blocks:
          - type: paragraph
            body: >
              Trade Republic 的客户数在 2025 年底突破 10 million，高于 2025 年 1 月的 8 million 和 2024 年初约 4 million——不到两年扩大 2.5×。 截至
              2026 年初，公司 Google Play 页面写着「18 个欧洲国家超过 10 million 用户、€150 billion 资产」，相当于 AUM 较 2024 年初约 €35 billion
              接近三倍增长。联合创始人 Christian Hecker 在 2025 年 1 月确认，客户「仅用六年」累计储蓄超过 €100 billion，其中很大一部分是首次投资者。WiWo 2025 年 12
              月报道称，内部人士估计客户基数到 2025 年底可能达到 12 million。

              2024 年，地域分布发生明显变化。历史上，德国一直主导客户基数。但截至 2025 年 1 月，Trade Republic 8 million 客户中有三分之一来自国际（非德国）市场——
              这是一次显著转变，反映出 2024 年借记卡和活期账户产品在 17+ EU 成员国铺开。法国成为最大国际市场，到 2025 年 1 月客户超过 1 million。 TradeInformer
              指出，历史上大多数客户都在德国获客，因此 2024 年国际化是结构性拐点。人均 AUM 增速快于客户数（AUM 增至三倍，客户增至两倍），说明平均余额上升； 但公司没有公开客户层面的 AUM 分布。
