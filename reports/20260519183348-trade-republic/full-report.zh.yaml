  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 最重要的近期风险，来自修订版 MiFIR（Regulation EU 2024/791）内嵌的 EU 全域 PFOF 禁令；该禁令自 2024 年 3 月 28 日起禁止投资公司收取
              PFOF。 德国于 2024 年 3 月 21 日通知 ESMA，将使用 MiFIR Article 39a(2) 允许的过渡豁免，允许注册在德国的投资公司继续从德国客户处收取 PFOF，直到 2026 年 6
              月 30 日。 该期限距报告日期不足六周，构成迫近的收入模型切换事件。截至 2026 年 1 月，PFOF 约占 Trade Republic 收入 30%，低于 2023 年 12 月取得 ECB
              银行牌照时约三分之一的水平。 Trade Republic 子公司 Trade Republic Business III GmbH 于 2026 年 1 月取得 BaFin
              多边交易设施（MTF）牌照，让公司可以选择自行执行股票订单，并获取目前支付给 Lang & Schwarz Exchange 的价差。不过，截至报告日期，实时 MTF
              运营的实际建设仍未确认，因此无法完整评估切换风险。

              2021 年 1 月 GameStop 事件仍是未消失的监管尾部风险：Trade Republic 临时暂停 meme 股票买入后，BaFin 收到超过 4,000 起投诉。截至报告日期，尚未公开确认 BaFin
              采取正式执法行动，但投诉规模足以让 Trade Republic 进入 BaFin 监管视野。2025 年 2 月，Verbraucherzentrale Baden-Württemberg 提起诉讼，
              指控其在两个重要事项上存在误导性广告：(a) 将 3% 利率描述为无限额，却未充分披露该利率可变且依赖 ECB；(b) 暗示享有完整法定存款保险覆盖， 却未披露由 BlackRock
              管理的货币市场基金中的现金不受 EUR 100,000 法定存款保险保证覆盖。另一起事件中，Verbraucherzentrale Hamburg 于 2022 年就开户赠送免费股票的宣传发出停止侵权通知，
              因为有时只分配碎股；Trade Republic 签署了承诺函。如果 VZ-BW 诉讼出现不利判决，公司可能需要大幅修改 17+ 运营市场的营销，提高获客成本，并可能触发其他司法辖区监管审查。
