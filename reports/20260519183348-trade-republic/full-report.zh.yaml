            body: >-
              估计 70% 的 Trade Republic 客户是首次投资者。这个人群是一把双刃剑：一方面，它创造了一个庞大且渗透不足的获客漏斗，并让 Trade Republic 成为新一代欧洲零售投资者的入口；
              另一方面，首次投资者金融素养更低、余额更小，对 UX 摩擦和客服失败更敏感，也缺乏横向经验来形成忠诚。服务质量缺口叠加首次投资者占多数，提高了支持恶化导致客户不成比例脱离的风险。
