            tableRef: TV006
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV013
      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: AUM 口径估值最站得住
            body: >-
              按 AUM 的 8.3%（€12.5B / €150B）计算，Trade Republic 估值显著低于 Robinhood 34.6% 的平台资产比。因此，AUM
              口径指标是支持当前标记的最强论据；收入倍数（估计 2025 年的 25–31×）才是估值偏高的主要来源。如果 Trade Republic 到 2027 将 AUM 增至 €200-250B，并维持当前收入 /
              AUM 比率，即使收入倍数不扩张，估值也会越来越站得住。
            calloutType: insight
            claimRefs:
              - CV020
              - CV025
          - type: callout
            title: PFOF 收入迁移仍未量化
            body: >-
              Trade Republic 在 January 2026 获得 BaFin MTF 牌照，设计目的，是在 MiFIR 后合规结构下复刻 PFOF 经济性；但 MTF 做市价差下每笔订单实际收入相对过去 PFOF
              费率如何，公司尚未披露。ESMA 研究发现，PFOF 会造成利益冲突和次优执行质量；MTF 结构降低了冲突，但也可能削弱单笔订单经济性。这是估值中最大、且尚未量化的单一风险。
            calloutType: risk
            claimRefs:
              - CV029
              - CV035
              - CV039
          - type: callout
            title: 纯老股结构显示业务能自我造血
            body: >-
              December 2025
              老股交易没有募集任何新股资本，因此没有释放关于未来资本需求的新信息。它验证了业务能产生现金并自我融资，但没有新股轮也意味着没有正式认购协议要求新投资人接受标准信息权——通常伴随机构新股轮而来的透明度收益因此被削弱。
            calloutType: insight
            claimRefs:
              - CV002
              - CV004
              - CV009
