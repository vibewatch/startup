      - number: '2.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: PFOF 禁令到 June 2026 造成结构性收入断点
            body: >-
              MiFIR amendment 禁止 EU 散户客户 PFOF，并将于 June 2026 生效。历史上，PFOF 为 Germany 和 the Netherlands 的新型券商贡献了重要收入份额。ESMA
              以利益冲突为由呼吁禁令。Trade Republic 必须在截止日前完成收入模型转型，而禁令后的利润率轨迹尚未在公开数据中显现。任何尽调流程都应要求公司清楚说明后 PFOF 收入架构，以及按客户计的单位经济性。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM025
          - type: callout
            title: EU 养老金缺口是持久的结构性顺风
            body: >-
              EU 成员国公共养老金替代率下降，是人口结构、劳动市场变化和财政约束共同作用的结果；这为零售投资创造了跨越利率周期的结构性激励。EU CMU 和 Retail Investment Strategy
              政策明确瞄准这一缺口。对 Trade Republic 而言，这是一条长期获客顺风，不受短期货币政策波动左右，也让欧洲零售投资市场比一轮周期性的股票参与热潮更耐久。
            calloutType: insight
            claimRefs:
              - CM014
              - CM016
              - CM017
              - CM030
          - type: callout
            title: 没有行业级披露，TAM 收入估计只能是推测
            body: >-
              €2B–€8B 的年度收入 TAM 区间，反映的是实质不确定性，不是四舍五入。没有权威的 EU
              级数据库按产品类型追踪零售投资平台收入。区间下限只假设券商佣金；上限则计入利息收入和相邻业务。分析师和投资者应把任何具体中点视为假设，而非发现；在锚定某个 TAM 数字前，应要求 Trade Republic
              做自下而上的收入披露。
            calloutType: assumption
            claimRefs:
              - CM033
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图分类
        blocks:
          - type: paragraph
            body: >
              Trade Republic 的竞争集合至少横跨六类。直接新型券商同业——Scalable Capital 和
              flatexDEGIRO/DEGIRO——争夺同一批欧洲散户自助投资者，产品菜单高度重叠。相邻金融科技平台——eToro、Revolut 和 N26——把投资作为更广泛金融超级 App
              或社交交易生态中的一个模块。总部位于美国的 Robinhood 是结构性进入者威胁，它已经进入 EU
              市场，并带着经过验证的零佣金打法。传统全服务存量券商（Comdirect、ING、DKB）和大型财富管理机构，也在解决同一个底层养老金缺口问题，只是成本更高、摩擦更大。现状——什么都不做，或只用储蓄账户——仍是首次投资者最大的隐性竞争者；这类用户占
              Trade Republic 客户基础的 70
              %。大型银行自建是概率较低的威胁，但不能忽视，因为平台时代的存量机构正在投资数字券商能力。因此，竞争强度最高的地方，是欧洲直接新型券商之间；价格、产品宽度、信任和分发能力正在越来越趋同。
