      - number: '4.4'
        title: 资本充足率与财务画像
        blocks:
          - type: paragraph
            body: >
              2019 至 2022 年间，Trade Republic 在多轮风险融资中累计获得超过 €1 billion 新股资本；2022 年 6 月 Series C 延展轮之后，公司没有再融入新股资本。公司 2025
              年 12 月的官方声明明确确认，Trade Republic 不需要新资本， €1.2 billion 老股交易完全是现有股东退出，资金没有进入公司。FY2022/23、FY2023/24、FY2024/25
              连续三个财年盈利， 意味着 Trade Republic 靠经营现金流和现有资本金运转。

              2023 年 12 月取得 ECB 银行牌照后，Trade Republic 需要遵守《资本要求条例》（CRR）和单一监管机制下的审慎资本要求。公司尚未公开披露 CET1
              比率、总资本要求或流动性覆盖率。不过，已经确认的多年盈利， 加上没有 BaFin 资本充足率通知或公开干预，说明公司大概率明显高于最低监管资本门槛。FY2022/23 末资产负债表总额约 €7 billion；
              到 2025 年 12 月 AUM 达到 €150 billion（其中很大一部分由客户托管，并不在 Trade Republic 自身资产负债表上），银行资产负债表总额预计已显著扩大， 但公司仍未披露。

              从融资依赖度看，Trade Republic 近期似乎不依赖外部资本：盈利已经确认，业务不再烧钱，公开记录中也没有即将到期的债务义务。前瞻融资不确定性主要在于 MTF
              基础设施建设成本——这可能需要投入技术和做市商关系——以及如果 PFOF 替代经济性不如现有模式，收入可能出现缺口。公开记录中没有债务或项目融资义务。
