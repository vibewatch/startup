      - number: '8.5'
        title: 建议与风险评级
        blocks:
          - type: paragraph
            body: >-
              建议：观察。Trade Republic 得到观察而非继续研究评级，因为增长和盈利信号真实，并由机构老股参与方确认；但 €12.5 billion
              估值意味着溢价倍数，而支撑这个倍数需要公司目前尚未公开提供的财务透明度。能进入私有数据室的投资人，可以适用继续研究或考虑评级；只依赖公开信息的投资人，在 FY2024–2025 经审计财务或 IPO
              招股说明书披露收入基数、EBITDA 利润率和 MTF 收入爬坡之前，观察更合适。风险评级：高。主要风险包括：（1）MTF 模型下 PFOF 收入迁移，大规模有效性仍未验证；（2）利率敏感性——ECB 若在
              2025–2026 降低 EUR
              利率，客户现金余额的净利差可能被压缩；（3）财务不透明风险——没有公开账目意味着负面变化可能在融资事件迫使披露之前一直不被市场参与者看见；（4）在位银行推出移动券商服务带来的竞争风险；（5）监管风险，ESMA
              和各国消费者机构仍在审查订单路由和数据变现模式。估值立场：偏高。€12.5 billion 标记对应估计 2025 年收入的 25–31×，高于 Robinhood 的 14.9× 和 eToro 的 3.7×
              P/Net Contribution；若要在典型 2027 IPO 时间窗口消化该倍数，公司需要收入 CAGR 持续 40%+ 且利润率扩大。AUM 口径指标（AUM 的
              8.3%）是支持当前标记的最强论据。下轮降估风险中等，但并非可以忽略。
            claimRefs:
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV005
            claimRefs:
              - CV004
              - CV043
              - CV044
              - CV045
      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Trade Republic 已在多个维度具备 IPO 前准备度：December 2023 获得 ECB 银行牌照，据称连续三年盈利，并拥有 Fidelity、Wellington、GIC
              级别的机构投资人基础。最可能的退出路径包括：（1）老股交易后 18–36 months 在 Nasdaq 或 Frankfurt Stock Exchange
              IPO；（2）被寻求大规模散户分销的大型欧洲银行或资产管理公司战略收购；（3）继续通过老股交易提供流动性，只有当地理扩张需要监管牌照资本时才募集新股资本。在 €12.5 billion
              或更高估值投资前，关键尽调问题包括：FY2024 和 FY2025 经审计 IFRS 收入和 EBITDA；MTF 每笔订单收入相对此前 PFOF 经济性的差距；FY2025
              收入基数中利息收入与交易佣金的拆分；按队列年份划分的每客户净收入；在股市下跌 20%+ 时 AUM 留存的敏感性；以及包含清算优先权瀑布的完整股权结构表。没有这些数据点，任何 DCF
              或倍数法估值都不够精确，无法支持在当前标记下注重大仓位。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV045
