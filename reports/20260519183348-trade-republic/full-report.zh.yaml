      - number: '5.4'
        title: 信任、安全、监管合规与隐私
        blocks:
          - type: paragraph
            body: >
              Trade Republic 作为持完整牌照的德国银行运营，在 ECB 监督下接受 BaFin 和 Bundesbank 监管。客户股票持仓放在 Clearstream 体系托管方的综合账户中， 与 TR
              自有资产隔离。平台提供公开可访问的漏洞披露计划。App Store 隐私标签显示，公司会收集联系信息、金融信息和诊断数据；位置和使用数据也会被收集。 PSD2
              账户信息和支付发起服务向注册第三方提供商开放。负面一面是，2025 年 4 月市场波动期间的平台中断引发广泛批评。2021 年 1 月 GameStop 交易限制导致超过 4,000 起 BaFin
              投诉。2025 年 9 月 Nvidia 税务错误，曾从个人账户错误扣款最高 €9,686。2025 年 11 月的投资组合转移延迟，促使竞争对手呼吁 BaFin 干预。 客服基础设施依赖应用内 AI
              辅助聊天；TR 于 2025 年 12 月宣布，计划在 2026 年春季增加直接联系支持。Verbraucherzentrale BW 诉讼（2025 年 1 月提起） 挑战 TR
              对现金利息和存款保护范围的宣传，结果仍未出炉。Stiftung Warentest 于 2024 年将 TR 从其储蓄比较中移除，因为现金余额中的货币市场基金部分不在法定存款保险范围内。
