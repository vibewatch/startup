      - number: '6.3'
        title: 国际扩张——法国、西班牙和意大利分行
        blocks:
          - type: paragraph
            body: >
              Trade Republic 于 2025 年在法国、西班牙和意大利设立三个本地银行分行，从而推出完全本地化的银行产品，包括本国 IBAN、本地支付轨道和各国特定的受监管储蓄工具。 法国分行发展最成熟：Trade
              Republic 为 PEA（Plan d'Épargne en Actions，法国政府支持的税收优惠投资账户）提供免佣金储蓄计划。PEA 粘性尤其强——一旦投入， 客户退出时需要缴纳资本利得税，形成比
              Trade Republic 标准德国产品更强的结构性锁定。2025 年 1 月上线时，法国客户还获得了本国 IBAN 和支付 3% p.a. 利息的活期账户。

              公司公开目标是成为「第一家真正的欧洲银行」，在每个市场提供最有吸引力的本地银行和储蓄产品。国际市场总经理 Julian Collin 称法国发布是「欧洲第二大银行市场储户的重要里程碑」。
              法国、西班牙、意大利合计代表 EU 五大银行市场中的三个。公司没有披露西班牙和意大利各自的客户数。公司称其可触达欧洲 340 million 潜在人群，当前客户基数约等于这一可触达人群的 3%
              渗透率。2025–2026 年，本国 IBAN 和本地支付方式将扩展到许多 EU 市场。
