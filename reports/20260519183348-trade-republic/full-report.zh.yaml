    notes: 触发信号基于估值分析框架；实际信号出现时间取决于 Trade Republic 财务披露节奏（Bundesanzeiger）以及潜在 IPO 招股书提交。
    columns:
      - 触发信号
      - 方向
      - 观察信号
    rows:
      - - MTF 单笔订单收入 < 既有 PFOF 经济性的 50%
        - 下调至回避
        - 任何公开文件中的 2026 年 Q2/Q3 交易量与每笔交易收入
      - - FY2024-2025 经审计收入低于 €300M
        - 下调至回避
        - Bundesanzeiger 文件或 IPO 招股书披露
      - - FY2024-2025 收入超过 €600M，且 EBITDA 利润率 15%+
        - 上调至考虑
        - Bundesanzeiger 文件、S-1/F-1 招股书或可信媒体披露
      - - ECB 降息把存款收益率压到 1% 以下
        - 下调至观察 / 回避
        - ECB 政策会议；Trade Republic 存款利率公告
      - - 提交包含完整财务数据的 IPO 文件
        - 上调至继续研究 / 考虑
        - SEC EDGAR S-1/F-1、BaFin KAP 或 Frankfurt Stock Exchange 招股书
    claimRefs:
      - CV004
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调问题清单
    description: Information requests required before underwriting a material position at or above the €12.5 billion mark.
    sectionRef: SV-SEC-06
    type: factual-snapshot
    notes: 所有事项都需要非公开数据室权限或 IPO 招股书披露。事项按对估值不确定性的影响排序；第 1、2 项会阻断任何投资决策。
    columns:
      - 尽调事项
      - 关键性原因
      - 来源 / 权限
    rows:
      - - FY2024 和 FY2025 经审计 IFRS 收入、EBITDA、净利润
        - 验证隐含 25-31× 收入倍数；确认盈利连续性
        - 私有数据室或 Bundesanzeiger 年报（预计 2026 年 Q3-Q4）
      - - 按工具类别拆分的 MTF 单笔订单收入与既有 PFOF 费率
        - PFOF 禁令是首要结构性风险；MTF 经济性决定收入底线
        - 管理层数据室；对标 eToro F-1 中的 PFOF 披露
      - - FY2025 收入中利息收入与交易佣金拆分
        - ECB 银行牌照影响；NIM 对降息的敏感性；收入质量
        - 私有数据室；对标 Robinhood 10-K 利息收入科目
      - - 按队列年份拆分的单客净收入（2019-2025 队列）
        - 首次投资者流失风险；核实 LTV/CAC 以支撑承销
        - 管理层数据室；用 Bundesanzeiger 总收入与客户数作为代理
      - - '-20% 和 -30% 股票市场情景下的 AUM 留存敏感性'
        - 70% 首次投资者队列脆弱性；评估悲观情景概率
        - 管理层压力测试披露；用 eToro F-1 中 FY2020 COVID 数据作行业代理
      - - 股权结构表、期权池和清算优先权瀑布
        - €12.5B 价格入场的老股投资者，IPO 前需要看清优先股堆叠
        - 公司章程文件；通过数据室获取投资者权利协议
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV009
      - CV013
