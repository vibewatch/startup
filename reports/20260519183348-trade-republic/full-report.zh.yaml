      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Trade Republic 的财务画像是：一家成长期数字银行，在没有放弃激进产品扩张的同时实现了正净利润。收入质量好坏参半：
              多年盈利真实存在，并由商业登记文件验证；转向净利息收入也降低了 PFOF 禁令敞口。但直到最近，PFOF 仍是主导收入来源，切换到基于 MTF 的订单路由带来执行风险： 如果 MTF 单笔订单经济性显著低于与
              Lang & Schwarz 的 PFOF 安排，即便客户数继续增长，FY2026/27 的收入结构也可能恶化。

              利润率路径说得通，但还不能视为确定。FY2022/23 至 FY2023/24，收入同比增长超过 50%，在这一收入基数上净利率约 7–10%； Trade Republic
              已经展现经营杠杆——成本增速远慢于收入。如果这一模式延续，且 PFOF 到 MTF 的迁移收入中性，FY2026/27 净利率达到 15–20% 看起来可实现。
              对一个软件加银行平台而言，资本强度较低：没有制造，没有库存，资本开支很轻。主要资本需求是维持监管资本、技术投入和地域扩张。

              从财务角度看，主要尽调卡点包括：(1) MTF 收入经济性与传统 PFOF 模式相比仍未披露；(2) FY2024/25 损益表尚未进入公开记录；(3) ECB / BaFin 监管下的 CET1
              比率和监管资本状况；(4) 利息收入支柱的利率敏感性；(5) 客服产能问题能否从结构上解决，它同时带来监管风险（BaFin / 消费者保护审查） 和流失风险。以 €12.5 billion 估值对应约 €340
              million 历史收入（FY2023/24），隐含收入倍数约 37×，这个水平偏激进，需要持续 40–50% 年收入增长，才能回落到合理退出倍数；如果客户规模和 AUM
              轨迹延续，这并非不可实现，但会受宏观利率环境和竞争压力影响。
