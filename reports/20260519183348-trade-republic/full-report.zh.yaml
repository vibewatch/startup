  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              欧洲零售投资市场，最合适的定义是一组受监管服务：让私人个人把储蓄配置到可转让证券、集合投资计划和结构性存款中。根据 MiFID II（Directive 2014/65/EU），“零售客户”
              指任何非专业客户，覆盖绝大多数私人家庭。这个宽口径法律边界包括佣金制和零佣金券商、ETF
              与储蓄计划平台、提供投资产品的数字银行，以及智能投顾。它明确排除机构资产管理、批发银行、企业财资，以及没有投资产品层的纯零售银行。

              在这个边界内，Trade Republic 属于新型券商和数字零售银行子板块：零佣金股票与 ETF 交易、债券入口、加密货币、储蓄计划、现金利息产品，以及绑定 IBAN
              的借记卡。这与完整零售投资服务市场有重叠，但范围更窄——提供基金分销、投顾服务或复杂衍生品的平台，触达的是 Trade Republic
              目前尚未服务的客户群。因此，相关总可用市场（TAM）包括所有拥有可投资储蓄、寻求低成本自助投资的 EU 私人个人；可服务市场（SAM）则受限于 Trade Republic 持有监管授权的国家（截至 2025 为
              17 个以上 EU 成员国），以及数字化参与度高、成本敏感的散户目标人群。

              按现状替代方案看，关键替代品包括：传统银行提供的托管账户和逐笔交易佣金（新型券商出现前为每笔
              €5–15）、本土银行储蓄存款、作为储蓄载体的实物房地产，以及政府储蓄债券。零佣金新型券商的出现，从结构上打破了传统券商的价格保护伞，也把此前不活跃的储蓄者转化为首次股票投资者——EU Retail
              Investment Strategy 试图延续并制度化这一过程。
