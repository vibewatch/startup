  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与收入线
        blocks:
          - type: paragraph
            body: >
              Trade Republic 的收入模型有三根支柱：订单路由、银行模型利息收入和附属费用。第一根，也是历史上的主导支柱，是订单流付款（PFOF）：客户执行交易时，Trade Republic
              将订单路由给做市商——主要是通过 LS Exchange 路由给 Lang & Schwarz——并按订单获得返佣。在这个模型下，客户看到的标价费用只有每笔成交订单
              €1（Fremdkostenpauschale，即外部结算成本），没有显性佣金。PFOF 在总收入中的占比一直下降；截至 January 2026，公司自己承认 PFOF 占收入不到 30%，低于早年多数水平。

              第二根、也是现在的主导支柱，是净利息收入。December 2023 取得完整 ECB 银行牌照后，Trade Republic 开始直接持有客户存款，并把部分 ECB 存款利率以未投资现金余额年化 2%
              的形式返还客户（June 2025 从 2.25% 下调）。截至 December 2025，AUM 超过 €150 billion，即便现金比例不高，也会产生可观利息收入——Trade Republic
              将存款放在 ECB 或托管银行获得的收益，与付给客户的利息之间形成利差，即总利息利润率。鉴于 AUM 基数大幅提高，FY2023/24 这一支柱明显大于 FY2022/23。

              第三根支柱覆盖附属费用：加密交易 1% 点差；后续信用卡和数字钱包入金 0.7% 费用（首次入金和银行转账免费）；Visa 借记卡交换费；以及未来可能推出的高级订阅收入（尚未上线）。ETF 交易和储蓄计划买入免
              €1 结算费，让被动投资几乎零成本——这是有意设计的获客策略。2024 年推出的固定收益产品和 2025 年推出的私募市场入口，收入仍处早期规模。Bundesanzeiger 登记簿保存了 Trade
              Republic 的年度账目文件，上述收入数字来自这些文件。
