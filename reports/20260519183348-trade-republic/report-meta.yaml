  foundingLocation: Munich, Germany
  headquarters: Berlin, Germany
  productSummary: >-
    Trade Republic offers retail investors zero-commission stock, ETF, crypto, bond, and
    derivative trading plus automated savings plans (Sparpläne). The platform also provides
    euro current accounts, a Visa debit card, a 2% p.a. cash interest product, and access to
    private-market investments. All order execution is routed through the Lang & Schwarz LS
    Exchange under a payment-for-order-flow arrangement that generates the primary commission
    revenue line, with the MTF licence obtained in January 2026 expected to replace PFOF
    economics post-ban.
  customerFocus: >-
    European retail investors, long-term savers, and young mobile-first consumers seeking
    low-cost access to diversified investment portfolios, saving products, and everyday banking.
  businessModel: >-
    Revenue is primarily driven by PFOF commissions from LS Exchange (less than 30% of revenue
    as of January 2026), a €1 settlement fee per non-ETF-savings-plan trade, and net interest
    margin on client cash balances held under the ECB banking licence. Post-ban economics will
    depend on the MTF market-making spread model. Three profitable fiscal years indicate
    operating leverage on a low fixed-cost infrastructure.
  stage: Private
  fundingStatus: >-
    Trade Republic has raised more than €1 billion in total primary venture capital across
    rounds from 2019 through 2022: a €12 million 2019 seed round led by Project A, a 2020
    Series A/B with Accel and Peter Thiel, and a June 2022 Series C extension at approximately
    €5 billion valuation co-led by Ontario Teachers' Pension Plan Board with a €250 million
    ticket. No primary capital has been raised since mid-2022. The December 2025 €1.2 billion
    transaction was a secondary sale by existing shareholders at a €12.5 billion post-money mark.
