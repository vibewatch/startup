summary:
  headline: >-
    Trade Republic is a credible European neobroker decacorn with 10 million customers, €150
    billion AUM, and three profitable years, but the June 2026 PFOF ban creates an unquantified
    revenue cliff, the €12.5 billion secondary mark implies a 25–31× estimated P/S that screens
    stretched, and private financial opacity precludes independent valuation verification.
  overallScore: 6.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 13500
    revenueRunRateUsdM: 540
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 1100
    customerCount: 10000000
    headcount: 1100
  topStrengths:
    - >-
      Trade Republic is one of very few European private fintechs to report three consecutive
      profitable fiscal years (FY2022/23: €14M net profit; FY2023/24: ~3× growth; FY2024/25:
      ~€348M net profit per Handelsblatt citing regulatory filings), creating a genuine
      earnings-growth narrative for the valuation.
    - >-
      The AUM-based valuation argument is the most defensible metric: at 8.3% of €150 billion
      AUM the mark is materially below Robinhood's 34.6% of platform assets, suggesting the
      multiple is not entirely without anchor if AUM growth continues.
    - >-
      Trade Republic has achieved scale across 17+ European markets with 10 million customers,
      demonstrating a pan-European distribution moat and low per-customer acquisition cost that
      favours further monetization as product breadth increases.
    - >-
      The ECB banking licence and BaFin MTF licence obtained in 2023 and 2026 respectively
      provide regulatory infrastructure that smaller European competitors cannot easily replicate
      and that diversifies the revenue model beyond the legacy PFOF arrangement.
    - >-
      The December 2025 secondary transacted at institutional terms with first-time buyers
      (Fidelity, Wellington, GIC, Khosla), providing credible price discovery and signalling
      institutional willingness to accept a long-dated European fintech at decacorn marks.
  topRisks:
    - >-
      PFOF revenue — less than 30% of revenue as of January 2026 — will be prohibited across
      the EU from June 2026 for German-domiciled firms after the transitional exemption expires.
      Actual revenue-per-order economics under the new BaFin MTF market-making model have not
      been disclosed and remain the single largest unquantified risk in the bull/base/bear
      scenario distribution.
    - >-
      At an estimated 25–31× FY2025 revenue multiple Trade Republic is priced above Robinhood
      (~15×) and well above European fintech comparables, with no audited FY2024 or FY2025
      IFRS financials to verify the P/S denominator — leaving any bull-case argument dependent
      on unconfirmed revenue estimates.
    - >-
      Concentration in the German retail investor market creates structural exposure to German
      economic conditions, BaFin regulatory risk, and competitive rate compression from
      traditional banks that have accelerated digital-investing product launches since 2023.
    - >-
      Financial opacity remains far below public-market standards: no audited IFRS consolidated
      accounts have been filed since FY2022/23, there is no public segment reporting, and the
      cap table, preference stack, and option pool are entirely undisclosed.
    - >-
      ESMA's PFOF opinion and the MiFIR revision created a hostile regulatory signal; ongoing
      DORA compliance obligations since January 2025 add operational risk, and any BaFin
      enforcement action in the post-licence period would directly impair the premium valuation
      multiple.
  unresolvedGaps:
    - >-
      FY2024 and FY2025 audited IFRS consolidated financials: Trade Republic has not filed
      accounts for these fiscal years as of the research date; the Bundesanzeiger FY2024
      filing is expected approximately Q3–Q4 2026.
    - >-
      MTF revenue-per-order economics: Trade Republic has not disclosed actual revenue per
      executed order under the new BaFin MTF market-making structure versus the prior PFOF
      arrangement, leaving the post-ban revenue impact entirely unquantified.
    - >-
      Cap table, preference stack, and employee option pool: entirely undisclosed for a
      private GmbH; required for a complete waterfall analysis in any exit scenario.
    - >-
      Customer churn, retention cohorts, and repeat-deposit behaviour: no verified monthly
      active user, DAU/MAU, or cohort-level retention data has been made public; at a 25–31×
      estimated P/S the bull case depends on strong retention as the competitive moat narrows.
    - >-
      FY2024/25 net profit confirmation: third-party reports citing ~€348M net profit for
      FY2024/25 are based on regulatory filings cited by Handelsblatt but no primary source
      has been independently verified at research date.
disclaimer: >-
  This report is based on public sources available as of 2026-05-19. Trade Republic Bank GmbH
  is a private company; financial figures including revenue, net profit, AUM, and valuation
  estimates are drawn from a mix of Bundesanzeiger filings, press coverage, and analyst
  research and are not independently audited. Valuation and scenario analysis are speculative
  and do not constitute investment advice.
