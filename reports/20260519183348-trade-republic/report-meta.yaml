subtitle: European Decacorn Neobroker — PFOF Revenue Cliff, Strong AUM Growth, High Opacity
coverageNotes: >-
  Trade Republic is a private GmbH with no publicly filed IFRS consolidated accounts since
  FY2022/23 (Bundesanzeiger). Revenue estimates for FY2024 and FY2025 are third-party
  analyst extrapolations; FY2023 audited net profit of €14.07 million and net commission
  income of €179.9 million are the primary verified anchors. The December 2025 secondary
  priced equity at €12.5 billion; no audited post-round financial statements are available
  to independently verify the implied P/S multiple. PFOF phase-out risk by June 2026 and MTF
  revenue economics are material unknowns at research date.
