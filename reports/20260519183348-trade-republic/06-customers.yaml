  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: retention-gap
      missingEvidence: >-
        Cohort-level customer retention data: NRR, GRR, monthly churn rate by product tier
        (savings plan users vs. card users vs. banking-only), and cohort survival curves.
      whyItMatters: >-
        Without retention data, investors cannot distinguish genuine durability (sticky savings-plan
        users) from high nominal growth masking rapid churn among lower-engagement users. The complaint
        surge makes this gap especially acute.
      diligencePath: >-
        Request cohort retention report from management; if unavailable, seek agreement to track
        monthly active user (MAU) definition alongside registered account count in a data room.
      relatedQuestionRefs:
        - QU009
        - QU010
        - QU018

    - type: missing-source
      severity: material
      topic: customer-count
      missingEvidence: >-
        Country-level customer breakdown for all 18 European markets beyond France (>1M confirmed
        Jan 2025); Spain, Italy, and all other markets have no disclosed customer count.
      whyItMatters: >-
        International expansion is a core bull thesis; without country-level data, investors cannot
        assess the depth of France's success, whether Spain/Italy have reached meaningful scale, or
        whether international growth is concentrated in France alone.
      diligencePath: >-
        Request management presentation with country-level customer count, AUM split, and monthly
        active user data; cross-check with German/French branch filings once available.
      relatedQuestionRefs:
        - QU002
        - QU022
        - QU027

    - type: missing-source
      severity: material
      topic: customer-satisfaction
      missingEvidence: >-
        Trustpilot and Apple App Store ratings and review text for Trade Republic; both platforms
        were inaccessible or blocked during the fetch window.
      whyItMatters: >-
        App store ratings are the most widely cited public satisfaction proxy for consumer fintech;
        their absence makes it impossible to corroborate or challenge the VZBV complaint data with
        user-facing rating trends.
      diligencePath: >-
        Revisit Trustpilot and Apple App Store directly; monitor rating trajectory over time;
        check if Germany-specific Trustpilot page is accessible.
      relatedQuestionRefs:
        - QU011
        - QU014
        - QU015

    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: >-
        Customer AUM distribution by percentile (P50, P75, P90, P99); top-decile depositor
        contribution to total AUM; single-depositor or cohort concentration metrics.
      whyItMatters: >-
        If the top 5% of customers hold 50%+ of AUM, churn among high-balance users would be
        disproportionately financially damaging. The €1 minimum investment implies a fat lower tail
        but the upper-tail concentration is unknown.
