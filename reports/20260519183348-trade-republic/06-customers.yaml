callouts:
  - calloutType: strength
    title: Europe's Largest Retail Broker with 10M+ Customers and €150B+ AUM
    body: >-
      Trade Republic's confirmed scale — 10 million customers and €150 billion AUM across 18 European
      countries — positions it as Europe's largest retail brokerage platform by customer count and AUM.
      The 100% customer growth (4M → 8M) and 3× AUM growth (€35B → €100B) achieved in 2024 alone are
      exceptional by European neobroker standards and signal strong product-market fit for the zero-
      commission, mobile-first investing model.
    claimRefs:
      - CU001
      - CU003
      - CU030
      - CU031

  - calloutType: risk
    title: Customer Service Complaints Surging with No Disclosed Churn Data
    body: >-
      VZBV consumer complaints rose 75% year-over-year to 350 by October 2025, with VZBV explicitly
      stating Trade Republic receives more complaints per customer than any comparable neobroker or
      digital bank. BaFin complaint volumes rose similarly. Trade Republic shuttered its in-house
      service team in June 2024 and replaced it with an AI chat function, a decision that preceded the
      complaint surge. With no published NRR, churn rate, or NPS data, investors cannot determine
      whether complaint volumes have begun to translate into measurable customer attrition.
    claimRefs:
      - CU018
      - CU019
      - CU021
      - CU022
      - CU027

  - calloutType: insight
    title: First-Time Investor Majority Creates Long-Term Upside and Loyalty Risk
    body: >-
      An estimated 70% of Trade Republic's customers are first-time investors. This is a double-edged
      demographic: it creates a large, underpenetrated acquisition funnel and positions Trade Republic
      as the entry point for an emerging generation of European retail investors. But first-time
      investors also have lower financial literacy, smaller balances, higher sensitivity to UX friction
      and customer service failures, and no comparative context to reward loyalty. The combination of
      a service quality gap and a majority first-time-investor base elevates the risk that deteriorating
      support will drive disproportionate disengagement.
    claimRefs:
      - CU011
      - CU012
      - CU024
      - CU027

