  - id: sec-retention-gaps
    title: Retention, Durability, Concentration, and Evidence Gaps
    body: >
      Trade Republic does not publicly disclose any standard retention metrics: net revenue retention
      (NRR), gross revenue retention (GRR), customer churn rates, cohort survival curves, and net
      promoter scores (NPS) are all absent from public filings and press releases. This is a material
      evidence gap for any investor attempting to model durability of the customer base. The platform's
      structural characteristics suggest partial self-reinforcing retention: savings plans auto-invest
      monthly, creating a default "stay" decision that is behaviourally stickier than discretionary
      trading platforms. The PEA product in France additionally creates tax-exit friction. BrokerChooser
      characterises Trade Republic as best for long-term investors, consistent with the platform's bias
      toward passive, recurring users.

      Concentration risk is primarily geographic and demographic rather than single-client. Germany
      historically represented roughly two-thirds of the customer base; the shift to one-third
      international reduces single-market regulatory and economic exposure. No data on AUM distribution
      by customer percentile is available, but the €1 minimum investment implies a long tail of very
      small accounts. Higher-balance customers may disproportionately drive AUM-linked interest income;
      churn among that subset would be financially material. The PFOF EU ban in June 2026 may affect
      pricing or order routing; any re-pricing to compensate could trigger attrition among price-sensitive
      first-time investors. The customer service deterioration documented by VZBV and BaFin introduces
      churn risk that has not been publicly quantified. Trade Republic's customer council ("Apply Now")
      exists as a structured feedback channel but appears to target a small subset of engaged customers,
      not the broader base.
