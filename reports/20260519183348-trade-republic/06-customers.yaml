  - id: sec-segmentation
    title: Customer Segmentation by Use Case, Product, and Segment
    body: >
      Trade Republic serves a purely retail individual customer base with no enterprise or institutional
      clients. Within that population, the customer base spans several overlapping use cases: long-term
      passive investors using ETF and stock savings plans (Sparpläne) who invest automatically each
      month; active retail traders in equities, ETFs, crypto, and bonds; retail banking customers
      attracted by the 2% p.a. cash interest rate on unlimited balances; debit card users earning 1%
      Saveback into their savings plan on qualifying monthly spending; a French tax-advantaged PEA savings
      segment; and a nascent family segment using the newly launched child savings account. BrokerChooser
      identifies Trade Republic as "best for long-term investors seeking low-cost, mobile-first investing,"
      reflecting the platform's design bias toward passive, recurring-investment users rather than
      active traders, who find the product limited (no derivatives, basic charting).

      An estimated 70% of Trade Republic's customers are first-time investors — users who had no prior
      brokerage or investment account before signing up. This majority is unusual in the European brokerage
      landscape and shapes the platform's educational tone, UX simplicity, and the savings-plan emphasis
      over active trading. It also implies a long tail of very small balances (minimum investment: €1),
      meaning the AUM distribution is likely skewed by a small number of high-balance customers. The card
      and current-account launch in 2023–2024 was explicitly cited by the company as a "significant
      contributor" to 2024 customer growth, extending Trade Republic's reach from investment-minded users
      to everyday banking customers who may or may not be actively investing. This broadening creates
      a
      more heterogeneous base with differing retention dynamics across product use cases.
