  - id: sec-intl-expansion
    title: International Expansion — France, Spain, and Italy Branches
    body: >
      Trade Republic established three national bank branches in France, Spain, and Italy in 2025,
      enabling fully localised banking products including national IBANs, local payment rails, and
      country-specific regulated savings instruments. The French branch is the most developed: Trade
      Republic offers commission-free savings plans for the PEA (Plan d'Épargne en Actions), France's
      government-sponsored tax-advantaged investment account. The PEA is a particularly sticky product
      —
      once invested, customers face capital gains tax on withdrawal, creating structural lock-in stronger
      than Trade Republic's standard German offering. French customers were also offered a national IBAN
      and current account paying 3% p.a. interest as of the January 2025 launch.

      The company's stated ambition is to become "the first truly European bank" offering the most
      attractive local banking and savings products in every market. Julian Collin, General Manager
      International Markets, described the French launch as "a major milestone for savers in the
      second-largest banking market in Europe." France, Spain, and Italy together represent three of the
      five largest banking markets in the EU. Customer count data for Spain and Italy individually has
      not
      been disclosed. The company states it reaches a potential audience of 340 million people across
      Europe, with the current customer base representing approximately 3% penetration of that reachable
      population. National IBANs and local payment methods will be extended across many EU markets
      through 2025–2026.
    claimRefs:
      - CU007
