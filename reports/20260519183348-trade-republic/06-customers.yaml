  - id: TU005
    title: Expansion and Concentration Risk Assessment
    columns:
      - Expansion Driver
      - Concentration Risk
      - Impact Assessment
      - Diligence Path
    rows:
      -   - Geographic expansion (France, Spain, Italy national branches)
          - Germany historically ~67% of customers; now shifting to ~33% international
          - Reduces single-market regulatory / economic risk; French PEA adds sticky cross-border 
            layer
          - Request % of AUM and customers by country; track French PEA growth vs. standard accounts
      -   - Product deepening (card, banking, PEA, PE)
          - Single-product users have lower stickiness than multi-product customers
          - Higher per-customer LTV if cross-product adoption holds; reduces trading-revenue 
            concentration
          - Request card activation rate; percentage of customers using 2+ products
      -   - Savings plan auto-invest lock-in
          - Monthly savings plan creates behavioural default-stay; cancellation requires active 
            opt-out
          - Structurally lower churn for savings-plan users; this cohort likely has higher AUM per 
            head
          - Compare churn rates between savings-plan users and non-savings-plan users (request from 
            mgmt)
      -   - French PEA tax-exit friction
          - France >1M customers with capital-gains lock-in on PEA withdrawal
          - High structural stickiness once PEA is funded; competitor switching carries tax cost
          - Track French PEA AUM growth; verify PEA product regulatory compliance
      -   - PFOF EU ban (June 2026)
          - Revenue model partially dependent on payment-for-order-flow commissions
          - Customer pricing may change; risk of attrition among price-sensitive first-time 
            investors
          - Monitor customer communication on pricing; track whether fee changes trigger complaint 
            surge
      -   - Customer service deterioration
          - All segments; higher-value customers most likely to churn to better-serviced competitors
          - Complaint surge (+75% VZBV, +comparable BaFin) could drive disproportionate high-AUM 
            churn
          - Track BaFin/VZBV monthly complaint trend; assess spring 2026 phone-support quality
      -   - Single-customer concentration risk
          - No enterprise clients; concentration is structural (depositor distribution) not 
            single-client
          - Top-decile depositors likely drive disproportionate NII; unknown exact share
          - Request AUM distribution by customer percentile (P50, P75, P90, P99) from management
    notes: >-
      Impact assessments are inferred from product mechanics, industry analogues, and available evidence;
      no financial model is available to quantify churn or concentration risk precisely.
      PFOF ban impact depends on Trade Republic's alternative revenue ramp (interest income, settlement
      fees).
    claimRefs:
