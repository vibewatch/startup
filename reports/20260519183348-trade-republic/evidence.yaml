evidenceGaps:
  - type: no-public-evidence
    severity: major
    topic: FY2024/25 audited financials not yet publicly available
    missingEvidence: >-
      Trade Republic confirmed three consecutive profitable years in December 2025 but has not yet published its
      FY2024/25 annual accounts. All financial figures in this chapter are based on prior-year German commercial
      register filings and financial media reporting.
    whyItMatters: >-
      The most recent fiscal year profit, revenue, and margin data would confirm whether profitability is growing or
      flat and validate the revenue-mix shift from PFOF to interest income.
    diligencePath: >-
      Request FY2024/25 audited profit and loss statement, balance sheet, and cash flow statement under NDA; cross-check
      with Bundesanzeiger filing when published.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: no-public-evidence
    severity: major
    topic: Visa debit card interchange and revenue model not publicly disclosed
    missingEvidence: >-
      Trade Republic's Visa card page describes the product but does not disclose interchange rates, fee structures, or
      the contribution of card revenue to the overall P&L.
    whyItMatters: >-
      As PFOF revenue diminishes, card-related banking revenue could become a meaningful supplementary stream; without
      disclosure, its materiality cannot be assessed.
    diligencePath: Request card revenue breakdown in financial diligence; ask for interchange agreements and card P&L.
    relatedQuestionRefs:
      - QO012
  - type: no-public-evidence
    severity: minor
    topic: Outcome of Verbraucherzentrale BW lawsuit unknown
    missingEvidence: >-
      The February 2025 lawsuit filed by Verbraucherzentrale Baden-Württemberg over misleading interest-rate and
      deposit-insurance advertising had not reached a public verdict as of the report run date.
    whyItMatters: >-
      An adverse judgment could require Trade Republic to modify product marketing, pay fines, or issue customer
      remediation; it would also reinforce the pattern of advertising-compliance risk.
    diligencePath: >-
      Monitor Verbraucherzentrale BW press releases and Landgericht Stuttgart or Frankfurt docket for outcome; request
      legal team update under NDA.
    relatedQuestionRefs:
      - QO025
  - type: no-public-evidence
    severity: minor
    topic: Competitive benchmarking versus eToro, Scalable Capital, and DEGIRO not available in this chapter
    missingEvidence: >-
      Public sources reviewed for this chapter focus on Trade Republic rather than providing comparative metrics against
      European peers such as eToro, Scalable Capital, or DEGIRO. Relative market-share, customer-growth, and
      unit-economics comparisons are not available from this source set.
    whyItMatters: >-
      Understanding Trade Republic's competitive position requires direct comparison of customer count, AUM per
      customer, and revenue per user against peers; this is deferred to the market-analysis chapter.
    diligencePath: >-
      Develop comparative analysis in chapter 02 (Market Analysis) using public filings and analyst reports for peer
      neobrokers.
    relatedQuestionRefs:
      - QO029
  - type: no-public-evidence
    severity: minor
    topic: Full cap table and economic rights for TO003 investor map not publicly available
    missingEvidence: >-
      Trade Republic has not publicly disclosed equity stakes, share classes, liquidation preferences, or anti-dilution
      provisions for any investor. The partial investor map in TO003 captures disclosed names and rounds only; economic
      structure and governance rights are not in the public record.
    whyItMatters: >-
      Understanding investor alignment, board influence, and downside protection requires the full cap table and side
      letters, which are unavailable without NDA-based disclosure.
    diligencePath: >-
      Request cap table, shareholder agreement, and voting rights summary under NDA; confirm which if any investors have
      board observer or consent rights.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: blocking
    topic: PFOF revenue share at Trade Republic
    missingEvidence: >-
      Trade Republic has not disclosed the share of revenues attributable to PFOF vs other sources; no public P&L or
      segmented revenue breakdown is available.
    whyItMatters: >-
      Without knowing the PFOF revenue share, the magnitude of the June 2026 revenue cliff and the margin impact of the
      transition cannot be quantified, making investment thesis stress-testing impossible.
    diligencePath: >-
      Request revenue breakdown in due diligence data room; benchmark against publicly disclosed PFOF revenue at US
      brokers like Robinhood; reverse-engineer from ESMA data on PFOF volumes by market maker.
    relatedQuestionRefs:
      - QM018
      - QM024
  - type: missing-source
    severity: material
    topic: Post-PFOF ban EU neobroker unit economics
    missingEvidence: >-
      No public forecast or disclosed performance data exists for EU neobroker revenue models operating without PFOF;
      the ban takes effect June 2026 and no platform has yet published post-transition P&L.
    whyItMatters: >-
      The post-ban revenue model determines the long-term unit economics of EU neobrokers and thus the investment thesis
      for Trade Republic at its €12.5B valuation.
    diligencePath: >-
      Request internal management accounts and post-ban revenue projections in due diligence; interview management on
      spread-based vs subscription vs interest income mix; obtain ESMA consultation data on market maker PFOF volume by
      broker.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: ARPU by customer segment (first-timer vs experienced vs yield-seeker)
    missingEvidence: >-
      No published segmented ARPU or LTV data exists for EU neobroker customer cohorts; Trade Republic has not disclosed
      per-segment revenue contribution.
    whyItMatters: >-
      ARPU by segment determines which customer acquisition channel has the highest ROI and whether the 70% first-timer
      cohort is profitable at current monetisation rates.
    diligencePath: >-
      Request cohort-level revenue and retention data from Trade Republic management; cross-reference with Robinhood's
      public SEC disclosures on ARPU evolution by product tier.
    relatedQuestionRefs:
      - QM026
  - type: conflicting-data
    severity: material
    topic: EU retail brokerage annual revenue TAM — conflicting estimates
    missingEvidence: >-
