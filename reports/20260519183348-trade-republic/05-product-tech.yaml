  - id: roadmap-differentiation-risks
    title: "Roadmap, Differentiation, and Key Risks"
    body: >
      Trade Republic's core product differentiation rests on three pillars: (1) extreme pricing
      simplicity (€1 per trade, free savings plans, no card fee, 2% cash interest), (2) in-house
      banking infrastructure that enables tight product integration without third-party banking
      software latency, and (3) regulatory credibility as a BaFin/ECB-licensed bank rather than
      a CRR investment firm. Its 2026 roadmap is defined by two structural transitions: replacing
      PFOF revenue (sub-30% of total revenues as of January 2026) ahead of Germany's 30 June 2026
      exemption expiry by leveraging the MTF licence or alternative venues; and scaling customer
      support from AI-only chat to direct personal contact. Expansion into private markets (Apollo,
      EQT partnerships) and fixed income broadens asset class coverage beyond retail equities.
      The September 2025 Poland launch — the first non-eurozone market — tests the playbook outside
      the ECB interest-rate environment. Key open risks include the PFOF revenue gap on post-ban
      pricing, the pending Verbraucherzentrale BW lawsuit and associated reputation risk, and
      unresolved competitive fee comparison data for markets outside Germany.
    claimRefs:
