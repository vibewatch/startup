  - id: trust-security-compliance
    title: "Trust, Security, Regulatory Compliance, and Privacy"
    body: >
      Trade Republic operates as a fully licensed German bank supervised by BaFin and the Bundesbank
      under ECB oversight. Customer equity holdings are held in omnibus accounts at Clearstream-chain
      custodians, separated from TR's own assets. The platform offers a publicly accessible
      vulnerability-disclosure programme. App Store privacy labels indicate that contact information,
      financial information, and diagnostic data are collected; location and usage data are also gathered.
      PSD2 account information and payment initiation services are offered to registered third-party
      providers. On the adverse side, the April 2025 platform disruption during market volatility
      drew widespread criticism. The January 2021 GameStop trading restrictions led to more than 4,000
      BaFin complaints. A September 2025 Nvidia tax error debited up to €9,686 from individual accounts
      incorrectly. Portfolio-transfer delays in November 2025 prompted a competitor to call for BaFin
      intervention. Customer-service infrastructure relies on in-app AI-assisted chat; TR announced
      plans in December 2025 to add direct contact support in spring 2026. The Verbraucherzentrale BW
      lawsuit (filed January 2025) challenges TR's advertising of cash interest and deposit protection
      scope; the outcome is pending. Stiftung Warentest removed TR from its savings comparison in 2024
      because the money-market-fund portion of cash balances falls outside statutory deposit insurance.
