  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "competitive fee comparison"
      missingEvidence: "Detailed fee and spread comparison across Trade Republic, Scalable Capital, Revolut, Degiro, and XTB in multiple markets."
      whyItMatters: "Without a side-by-side fee analysis, investors cannot assess whether TR's €1 fee and 2% interest rate are best-in-class or merely competitive in each market."
