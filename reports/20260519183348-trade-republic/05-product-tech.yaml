      missingEvidence: "Server-side architecture, database stack, uptime SLA, microservice topology, and data platform details for Trade Republic."
      whyItMatters: "The April 2025 outage and June 2024 dividend migration suggest architectural stress points; without SLA data investors cannot assess reliability risk."
