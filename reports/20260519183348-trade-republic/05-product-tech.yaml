callouts:
  - calloutType: risk
    title: "PFOF Revenue Cliff — 30 June 2026"
    body: >
      Germany's temporary PFOF exemption expires on 30 June 2026. PFOF accounts for less than 30% of
      Trade Republic's revenues as of January 2026 and all equity trades currently flow through Lang &
      Schwarz Exchange under this mechanism. The MTF licence obtained in January 2026 offers an option
      to internalise execution, but deployment has not been decided. A mispriced post-ban fee structure
      could compress margins or reduce competitiveness. This is the single most consequential near-term
      business-model transition the company faces.
    claimRefs:
      - CE016
      - CE017
      - CE023
      - CE024

  - calloutType: risk
    title: "Deposit-Protection Transparency — Live Legal Risk"
    body: >
      Verbraucherzentrale Baden-Württemberg filed suit against Trade Republic in January 2025 over
      allegedly misleading advertising of the 3% (now 2%) cash interest rate and the deposit-protection
      scope, specifically failing to disclose that higher balances are routed to money market funds not
      covered by statutory deposit insurance. Stiftung Warentest removed TR from its savings account
      comparison for the same reason. An adverse court ruling could require TR to revise marketing,
      restructure the cash-management model, or offer remediation to affected customers.
    claimRefs:
      - CE021
      - CE036
      - CE038

  - calloutType: strength
    title: "In-House Banking Stack — Strategic Moat"
    body: >
      Trade Republic's decision to build its banking infrastructure entirely in-house — without relying on
      Banking-as-a-Service providers such as Railsr or Solaris for its core — positions it to iterate
      on product features at speed and capture full economics from the banking layer. CEO Hecker has
      described this as essential for crossing from €1 billion to €10 billion scale, and the ability to
      launch an IBAN, card, interest product, and private markets portal within two years of receiving the
      banking licence validates the architecture. Open-source tools (SectionKit, Cilicon) signal genuine
      engineering depth.
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE018

