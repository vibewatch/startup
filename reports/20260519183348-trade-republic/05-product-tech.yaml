  - id: technology-architecture-and-operating-model
    title: "Technology Architecture and Operating Model"
    body: >
      Trade Republic built its entire banking infrastructure in-house rather than relying on a third-party
      banking-software vendor — a strategic choice CEO Christian Hecker has described as essential for
      reaching €10 billion-scale. The app is Swift-first on iOS; the open-source SectionKit library
      (UICollectionView component framework, 72 GitHub stars, MIT licence, last updated April 2026)
      is used extensively across screens, sometimes with up to 30 section types per view. Cilicon,
      a self-hosted macOS CI tool (1,161 GitHub stars, leveraging Apple's Virtualization Framework
      for ephemeral runners) is Trade Republic's contribution to developer tooling. Prior to its ECB
      banking licence, customer funds were held through Solaris, Deutsche Bank, J.P. Morgan SE, and
      Citibank Europe. Since June 2024, the current-account rollout gives customers individual TR IBANs;
      higher cash balances can be routed to money market funds for yield, creating a mixed deposit/fund
      model. Equity order flow is routed through Lang & Schwarz Exchange; a BaFin MTF licence obtained
      by a TR subsidiary in January 2026 provides the option to internalise equity execution after the
      PFOF phase-out on 30 June 2026. PSD2 open-banking endpoints are available for third-party account
      information and payment initiation services.
    claimRefs:
