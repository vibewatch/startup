runDate: "2026-05-19"
company:
  name: Trade Republic

chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Trade Republic has evolved from a mobile-only neobroker into an integrated investment and banking platform
    serving over 10 million customers in 18 European countries with €150 billion in assets. Built on an
    in-house banking stack following its ECB banking licence (December 2023), the app spans stocks, ETFs,
    savings plans, crypto, bonds, private markets, a Visa debit card, and cash interest. Operational risks
    centre on platform reliability (April 2025 outage), customer service capacity (AI-only chat until
    spring 2026 expansion), deposit-protection transparency (Verbraucherzentrale BW lawsuit pending),
    and the PFOF revenue model transition ahead of Germany's 30 June 2026 exemption expiry.

sections:
  - id: product-suite-and-workflow
    title: "Product Suite and Customer Workflow"
    body: >
      Trade Republic delivers an integrated invest-spend-save experience through a single mobile app
      available on iOS (version 4.2621.0, requiring iOS 16+, 326.6 MB) and Android. The app covers
      the full retail financial lifecycle: account opening with mobile KYC, SEPA-funded investing in
      over 10,000 stocks, ETFs, and cryptocurrencies from €1, free ETF and stock savings plans
      (Sparpläne) with automated periodic execution, bond (fixed-income) investing from €1, private
      market fund access via Apollo and EQT partnerships, and a Visa debit card with 2% p.a. ECB-linked
      cash interest on unlimited balances. The Saveback feature credits 1% of card spending (up to
      €1,500/month) into the user's savings plan, closing a loop between daily spending and long-term
      investing. Child savings accounts extend the product to junior investors. Fractional share trading,
      introduced in October 2022, lets users invest from €1 in high-priced stocks. Single securities
      orders carry a flat €1 third-party settlement fee; savings-plan executions are free.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
