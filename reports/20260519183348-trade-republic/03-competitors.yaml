slug: trade-republic
runDate: "2026-05-19"
company:
  name: Trade Republic

chapter:
  number: 3
  title: Competitors
  summary: >
    Trade Republic occupies the intersection of low-cost neobroker and full-stack ECB-licensed digital bank in Europe,
    competing most directly with Scalable Capital in Germany and flatexDEGIRO across the continent, while eToro, Revolut,
    and Robinhood address adjacent or overlapping demand pools. With 10 million customers and over €100 billion in AUM,
    Trade Republic leads European neobrokers on scale, but faces intensifying pressure from Scalable Capital's parallel
    banking licence, Revolut's massive 70-million-user distribution base, and DEGIRO's incumbency among cost-conscious
    self-directed traders. Switching costs are moderate — savings plans and multi-asset portfolios create stickiness,
    though fractional-share portability and low subscription switching costs limit structural lock-in. Adverse evidence
    includes a surge in consumer complaints to German watchdog VZBV, a lawsuit over interest advertising, and a platform
    outage during the April 2025 market selloff.

sections:
  - id: landscape-overview
    title: Competitive Landscape Taxonomy
    body: >
      Trade Republic's competitive set spans at least six distinct categories. Direct neobroker peers — Scalable Capital
      and flatexDEGIRO/DEGIRO — contest the same European retail self-directed investor audience with overlapping product
      menus. Adjacent fintech platforms — eToro, Revolut, and N26 — offer investing as one module inside broader financial
      super-apps or social trading ecosystems. US-headquartered Robinhood is a structural entrant threat, having launched
      in EU markets while carrying a proven zero-commission playbook. Traditional full-service incumbent brokers
      (Comdirect, ING, DKB) and large wealth managers address the same underlying pension-gap problem but at higher cost
      and friction. The status quo — doing nothing, or using a savings account only — remains the largest implicit
      competitor for first-time investors, who represent 70 % of Trade Republic's customer base. Internal build by large
      banks is a lower-probability threat but cannot be dismissed as platform-era incumbents invest in digital brokerage
      capabilities. The competitive intensity is therefore highest among European direct neobrokers, where pricing,
      product breadth, trust, and distribution power increasingly converge.
    claimRefs: [CP001, CP002, CP003, CP004, CP005]
    tableRefs: [TP001]

  - id: direct-peer-profiles
    title: Direct Peer Profiles — Scalable Capital and flatexDEGIRO
    body: >
      Scalable Capital is Trade Republic's most structurally similar rival in Europe. Founded in Munich in 2014,
      Scalable launched as a robo-advisor in 2016, then pivoted to self-directed brokerage from 2020 onward. By 2025
      it held €30 billion in AUM and over one million customers, and received a full ECB banking licence, eroding Trade
      Republic's previous exclusive regulatory advantage as the only neobroker with full European banking authorisation.
      Scalable's business model relies on a flat-rate subscription (Prime Broker), giving unlimited trades for a monthly
      fee, which rewards frequent traders over Trade Republic's per-trade model. Scalable also operates the European
      Investor Exchange (EIX), co-founded with Hannover Stock Exchange, as a proprietary trading venue — a vertical
      integration play that could reduce its dependence on third-party market makers. Scalable serves Germany, Austria,
      France, Italy, Spain, and the Netherlands, meaning direct geographic competition is near-total.
      flatexDEGIRO (Nasdaq-listed: FTK) is the incumbent low-cost pan-European broker with the largest direct footprint:
      3.5 million customers in 16 countries and over 75 million transactions processed annually. DEGIRO pioneered
      low-cost trading in Europe well before Trade Republic's 2019 launch, with per-trade fees of €1 per stock trade
      plus exchange handling and zero commission on its core ETF selection. FlatexDEGIRO benefits from bank-status
      (FlatexDEGIRO Bank AG) and institutional-scale custody infrastructure, but lacks the consumer-banking and
      interest-on-cash product suite that has driven Trade Republic's deposit growth.
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]

  - id: adjacent-platforms
    title: Adjacent Platforms and Global Entrants
    body: >
      eToro (NASDAQ: ETOR) is an Israeli-founded social and copy-trading platform with 3.81 million funded accounts
      and $18.5 billion in assets under administration as of December 31, 2025. Its copy trading and Smart Portfolios
      differentiate it from pure brokerage, attracting a beginner segment that overlaps substantially with Trade
      Republic's 70 % first-time investor base. However, eToro sells CFDs in Europe — a product class from which
      regulatory studies show a majority of retail customers lose money — and settled SEC charges in 2023 related to
      unregistered securities for US customers. BrokerChooser reviewers note high currency conversion fees, a $5
      withdrawal fee, and slow customer support as chronic weaknesses. Revolut is structurally the most dangerous
      distribution threat: its 70 million customers as of March 2026 and £4.5 billion in 2025 revenue dwarf any
      European neobroker, and its stock trading module (1,500+ US stocks) is a free inclusion in paid plans. Revolut
      holds banking licences in the UK and Lithuania and was valued at $75 billion in November 2025. However, Revolut's
      investing product is narrow (no ETFs outside the UK, no savings plans, no fixed income) and BrokerChooser flags
      poor customer service and basic research tools as structural weaknesses. N26 offers fee-free stock and ETF trading
      via a third-party integration with its banking account, but investing is ancillary to its core proposition; N26
      explicitly warns users that fractional share portfolio transfers are impossible, reflecting limited commitment to
      brokerage depth. Robinhood (NASDAQ: HOOD) generated $4.47 billion in revenue and $1.88 billion in net income in
      2025, demonstrating scale and profitability that far exceed any European neobroker, and has begun EU expansion.
      Its commission-free, app-first model is a proven template, but its US regulatory record (record FINRA fine of
      $70 million in 2021, multiple outage incidents) illustrates execution risk in new markets.
    claimRefs: [CP016, CP017, CP018, CP019, CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP027]
    figureRefs: [FP002]

  - id: switching-cost-analysis
    title: Switching Costs, Lock-in, and Multi-Homing
    body: >
      Switching costs in European retail brokerage are moderate but not negligible. Trade Republic's savings plans
      (Sparpläne) — recurring automated investments in stocks, ETFs, or crypto — create habitual engagement and
      accumulate portfolio positions that users are reluctant to transfer. The integrated product suite (brokerage plus
      interest account plus Visa debit card) makes Trade Republic a financial primary relationship for many customers,
      raising the perceived cost of switching to a single-product broker. However, structural lock-in is limited:
      the EU's MiFID II framework mandates portfolio transfer rights, and the standard fee of €0–€25 per position for
      outgoing transfers is manageable for larger portfolios. N26 explicitly notes that fractional shares and ETFs
      cannot be transferred in a portfolio transfer, pointing to a practical barrier that reduces portability across
      all neobrokers including Trade Republic. Multi-homing — using multiple brokers simultaneously — is widespread
      among active European retail investors, meaning Trade Republic does not capture all wallet share even from its
      own customers. Revolut users commonly hold a second account at a dedicated brokerage for ETF breadth. The
      strongest de-facto lock-in mechanisms are: (1) savings plan psychology — momentum investing creates inertia;
      (2) cash interest — customers with idle balances at 2.5 % p.a. face an opportunity cost of moving cash;
      (3) brand trust — once a user has committed their pension savings to a platform, the emotional cost of moving
      is high regardless of product gaps. Distribution lock-in (exclusive channels, employer partnerships) is not
      meaningfully present for any European neobroker including Trade Republic.
    claimRefs: [CP028, CP029, CP030, CP031, CP032]

  - id: moat-durability-competitive-risk
    title: Moat Durability, Adverse Evidence, and Competitive Risks
    body: >
      Trade Republic's competitive advantages — price leadership, banking licence integration, and brand trust among
      first-time investors — are each under specific threat. Scalable Capital's 2025 ECB banking licence eliminates
      the regulatory moat that Trade Republic held since 2023, enabling Scalable to offer deposit interest and card
      products that previously only Trade Republic provided in the neobroker segment. DEGIRO's lower per-trade cost
      for active traders (€1 plus handling, versus Trade Republic's €1 flat) and superior exchange access (50+
      exchanges vs. Trade Republic's narrower selection) attract the more sophisticated investor cohort that Trade
      Republic struggles to retain. The threat of commoditisation is real: where pricing is converging toward zero
      (N26 fee-free trading, Revolut's free monthly trades in paid plans), revenue will need to migrate to banking
      spreads and interest income — precisely the strategy Trade Republic is executing but which exposes it to
      interest-rate cycle risk. Adverse evidence against Trade Republic itself is material: the VZBV (Germany's
      leading consumer federation) reported a strong increase in complaints about Trade Republic, the
      Verbraucherzentrale Baden-Württemberg filed a lawsuit against Trade Republic over misleading interest rate
      advertising in 2025, and a WirtschaftsWoche report documented customer service failures that drove churn
      and required Trade Republic to publicly commit to service expansion. A platform outage in April 2025 during
      peak market volatility further highlighted the operational risk that comes with rapid scaling. These adverse
      signals matter competitively: they reduce the trust differential that Trade Republic claims over less-regulated
      peers and give comparison media and consumer advocates grounds for steering users elsewhere.
    claimRefs: [CP033, CP034, CP035, CP036, CP037, CP038, CP039, CP040]
    tableRefs: [TP004]
    figureRefs: [FP003]

