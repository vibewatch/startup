callouts:
  - calloutType: risk
    title: Scalable Capital's ECB Banking Licence Closes Trade Republic's Regulatory Moat
    body: >
      Trade Republic held a unique competitive position as the only European neobroker with a full ECB banking licence
      from 2023 until Scalable Capital received its own licence in 2025. This moat — which underpinned Trade Republic's
      ability to offer deposit interest, IBAN accounts, and Visa cards without a banking partner — is now shared.
      Scalable can match Trade Republic's banking product suite while retaining its subscription-model cost advantage
      for frequent traders. Diligence should assess how Trade Republic differentiates on product depth and brand beyond
      regulatory exclusivity.
    claimRefs: [CP033, CP034]

  - calloutType: risk
    title: Adverse Consumer Evidence — Complaint Surge and Advertising Lawsuit
    body: >
      Germany's leading consumer federation VZBV reported a strong increase in complaints about Trade Republic, and
      Verbraucherzentrale Baden-Württemberg filed a lawsuit against Trade Republic in 2025 over allegedly misleading
      interest rate advertising. A platform outage in April 2025 during the market selloff compounded reputational
      risk. These are material adverse signals for a platform where 70 % of users are first-time investors whose
      trust is the core retention mechanism.
    claimRefs: [CP035, CP036, CP037]

  - calloutType: insight
    title: Revolut's Distribution Advantage Outscales All European Neobrokers Combined
    body: >
      Revolut's 70 million customer base as of March 2026 gives it a cross-sell surface for investing that no
      European neobroker — including Trade Republic with 10 million — can match. Even a 5 % conversion rate from
      Revolut banking users to active stock traders would rival Trade Republic's entire active investor base.
      If Revolut deepens its ETF and savings plan offering, it becomes a structural threat rather than a substitute.
    claimRefs: [CP019, CP020, CP021]

