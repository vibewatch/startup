      - number: '6.4'
        title: Customer Satisfaction, Complaints, and Support Quality
        blocks:
          - type: paragraph
            body: >
              Trade Republic's customer service is its most clearly documented operational and reputational weakness. In
              June 2024, the company shut its in-house customer service subsidiary (Trade Republic Service GmbH) and
              laid off dozens of service staff, outsourcing support to third-party providers. By late 2025, the only
              support channel was a chat function inside the app, with AI-generated responses for common queries and
              human agents available only for complex cases — exclusively in writing, with no phone hotline available.

              German consumer protection data confirm material service degradation. The VZBV (Bundesverband der
              Verbraucherzentralen) recorded 350 complaints about Trade Republic in the federal territory by October 31,
              2025 — a 75% year-over-year increase. VZBV stated that no other neobroker or digital bank received as many
              complaints relative to customer count. BaFin's complaint count also reportedly increased at a comparable
              rate, though the regulator declined to confirm specifics. WiWo reported in September 2025 that users
              publicly demanded better customer service on Reddit, Instagram, and YouTube when Trade Republic launched
              its private equity product, with sentiment running strongly against feature expansion in the absence of
              service improvements. On BrokerChooser (2026, based on 28+ independent forum opinions, February–May 2026),
              the most frequently cited user concerns were: slow or unhelpful support, account freezes and unexplained
              withdrawal holds, and app bugs causing failed or blocked trades.

              Trade Republic responded to WiWo in December 2025 by promising personal contact options in a next service
              expansion phase, citing a spring 2026 target. The company's support page as of May 2026 promotes "Support
              24/7: Call and Chat," suggesting the announcement has been at least partially acted upon. Whether this
              resolves the structural gap between the platform's growth ambition and its service capacity remains a key
              diligence question.
            claimRefs:
