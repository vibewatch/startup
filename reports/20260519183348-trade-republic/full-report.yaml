  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Trade Republic faces its most material near-term risk from the EU-wide PFOF ban embedded in the amended
              MiFIR (Regulation EU 2024/791), which prohibits investment firms from receiving PFOF as of 28 March 2024.
              Germany notified ESMA on 21 March 2024 that it would use the transitional exemption permitted by Article
              39a(2) of MiFIR, allowing German-domiciled investment firms to continue receiving PFOF from
              German-domiciled clients until 30 June 2026. That deadline is fewer than six weeks from the report date,
              creating an imminent revenue-model transition event. PFOF accounted for approximately 30% of Trade
              Republic revenue as of January 2026, down from about one-third at the time of its ECB banking licence in
              December 2023. Trade Republic subsidiary Trade Republic Business III GmbH obtained a BaFin multilateral
              trading facility (MTF) licence in January 2026 to give the company the option to self-execute equity
              orders and capture the spread currently paid to Lang & Schwarz Exchange. However, the actual build-out of
              live MTF operations remains unconfirmed at the report date, so transition risk cannot be fully assessed.

              The GameStop episode of January 2021 remains a live regulatory tail: more than 4,000 complaints were filed
              with BaFin after Trade Republic temporarily halted purchases in meme stocks. No formal BaFin enforcement
              action has been publicly confirmed as of the report date, but the scale of complaints places Trade
              Republic on BaFin supervisory radar. In February 2025, Verbraucherzentrale Baden-Württemberg filed a
              lawsuit alleging misleading advertising on two material points: (a) describing the 3% interest rate as
              unlimited without adequately disclosing that the rate is variable and ECB-dependent; and (b) implying full
              statutory deposit insurance coverage without disclosing that cash in money market funds managed by
              BlackRock is not covered by the EUR 100,000 statutory deposit-insurance guarantee. Separately,
              Verbraucherzentrale Hamburg issued a cease-and-desist notice in 2022 for promoting a free share for
              account opening while sometimes allocating only fractional shares; Trade Republic signed an undertaking.
              An adverse judgment in the VZ-BW lawsuit could require material changes to marketing across all 17+
              operating markets, raising customer acquisition costs and potentially triggering regulatory scrutiny in
              other jurisdictions.
