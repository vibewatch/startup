          - type: callout
            title: Interest income emerges as the structural revenue engine
            body: >-
              With €150 billion in AUM and a 2% per annum cash interest product, Trade Republic's interest income has
              become a significant and growing revenue line that partially offsets PFOF dependency. The shift from
              pure-brokerage to banking-model revenue mirrors the strategic rationale behind obtaining the ECB banking
              license and expanding into current accounts and debit cards.
