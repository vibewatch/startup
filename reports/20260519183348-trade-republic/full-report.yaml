      - number: '4.5'
        title: Financial Information Gaps
        blocks:
          - type: paragraph
            body: >
              As a private German GmbH, Trade Republic is required to file annual accounts with the Bundesanzeiger and
              the German commercial register, but is not required to publish full audited financial statements in
              press-release form. The public record contains FY2022/23 and FY2023/24 summary P&L figures (available via
              the commercial register and reported by German financial media), but the following material financial data
              remains unavailable from public sources as of the report date: (1) FY2024/25 P&L — the year ending
              September 2025 has not been filed or reported; (2) granular revenue breakdown by asset class (equities,
              ETFs, bonds, crypto, private markets); (3) disclosed gross margin on the PFOF/LS Exchange arrangement; (4)
              net interest margin on customer deposits and the exact cash-versus-invested allocation within the €150B
              AUM; (5) customer acquisition cost (CAC), payback period, and lifetime value (LTV); (6) regulatory capital
              ratios under CRR/SSM; (7) revenues and cost basis for the new MTF infrastructure; (8) the financial terms
              of the agreement with Lang & Schwarz and any take-or-pay obligations; and (9) inter-company revenue and
              cost allocations within the Trade Republic group structure (GmbH parent plus Trade Republic Business III
              GmbH MTF subsidiary).

              Additionally, the sensitivity of interest income to ECB rate changes is not disclosed: if the ECB
              continues cutting rates toward 2 percent (where it already sat in late 2024), Trade Republic's net
              interest spread compresses and it may need to reduce the 2 percent customer rate, reducing the product's
              attractiveness and potentially affecting customer retention. This rate sensitivity is among the most
              material financial risks for the FY2025/26 and FY2026/27 outlook that are not quantifiable from public
              data.
