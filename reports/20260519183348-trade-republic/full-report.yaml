      - number: '3.2'
        title: Direct Peer Profiles — Scalable Capital and flatexDEGIRO
        blocks:
          - type: paragraph
            body: >
              Scalable Capital is Trade Republic's most structurally similar rival in Europe. Founded in Munich in 2014,
              Scalable launched as a robo-advisor in 2016, then pivoted to self-directed brokerage from 2020 onward. By
              2025 it held €30 billion in AUM and over one million customers, and received a full ECB banking licence,
              eroding Trade Republic's previous exclusive regulatory advantage as the only neobroker with full European
              banking authorisation. Scalable's business model relies on a flat-rate subscription (Prime Broker), giving
              unlimited trades for a monthly fee, which rewards frequent traders over Trade Republic's per-trade model.
              Scalable also operates the European Investor Exchange (EIX), co-founded with Hannover Stock Exchange, as a
              proprietary trading venue — a vertical integration play that could reduce its dependence on third-party
              market makers. Scalable serves Germany, Austria, France, Italy, Spain, and the Netherlands, meaning direct
              geographic competition is near-total. flatexDEGIRO (Nasdaq-listed: FTK) is the incumbent low-cost
              pan-European broker with the largest direct footprint: 3.5 million customers in 16 countries and over 75
              million transactions processed annually. DEGIRO pioneered low-cost trading in Europe well before Trade
              Republic's 2019 launch, with per-trade fees of €1 per stock trade plus exchange handling and zero
              commission on its core ETF selection. FlatexDEGIRO benefits from bank-status (FlatexDEGIRO Bank AG) and
              institutional-scale custody infrastructure, but lacks the consumer-banking and interest-on-cash product
              suite that has driven Trade Republic's deposit growth.
