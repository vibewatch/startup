companyProfile:
  summary: >-
    Trade Republic was founded in 2015 in Munich's Comdirect Bank startup incubator by Christian Hecker, Thomas Pischke,
    and Marco Cancellieri, later relocating to Berlin. Originally a zero-commission stock-trading app for German retail
    investors, it rapidly expanded to 17-plus European countries and in December 2023 received a full banking licence
    from the European Central Bank. By December 2025 the platform served more than 10 million customers with €150
    billion in assets under management — implying a roughly 2.5× AUM increase since the 2022 Series C extension. A €1.2
    billion secondary transaction in December 2025 valued the company at €12.5 billion, with Founders Fund, Fidelity,
    Wellington Management, GIC, Khosla Ventures, Lingotto, and Aglaé Ventures participating. Three consecutive
    profitable fiscal years (FY2022/23 through FY2024/25) underpin management's claim that no new primary capital is
    required.
