      - number: '8.3'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Three scenarios model the plausible valuation range at a hypothetical 2027 IPO or Series D primary round,
              contingent on revenue trajectory, margin expansion, and market conditions. The bull case (€20–25 billion)
              assumes Trade Republic achieves approximately €750 million in FY2026 revenue, driven by MTF execution fees
              fully replacing PFOF economics plus growing interest income on €150 billion AUM deposits. In this scenario
              the company widens EBITDA margin to 20%+, lists at a Robinhood-level 15× P/S on approximately €1 billion
              FY2027 estimated revenue, and benefits from continued EU retail investor participation growth. The base
              case (€12–16 billion) assumes revenues reach €450–550 million by FY2026 with stable 5–10% net margins, MTF
              revenue partially offsets lost PFOF economics, and the company lists or raises primary capital at
              approximately 12× trailing P/S—approximately flat to the December 2025 secondary mark. This scenario is
              most likely if the MTF model restores 70–80% of prior PFOF economics. The bear case (€6–9 billion) assumes
              the PFOF transition reduces net revenue per order by 30–40%, interest income compresses if the ECB cuts
              rates further, revenue growth decelerates below 20%, and market sentiment toward growth fintech
              deteriorates. The key sensitivity is PFOF revenue replacement: if the MTF model restores 80%+ of prior
              PFOF economics, the base case applies. If it restores only 50%, the bear case becomes likely. This binary
              creates a wide probability fan: the expected value across bull/base/bear (25%/50%/25% weighting) implies
              approximately €13–14 billion—near the current mark.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
