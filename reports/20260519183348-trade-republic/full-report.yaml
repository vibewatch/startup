      - number: '8.2'
        title: Comparable Company Analysis
        blocks:
          - type: paragraph
            body: >-
              Public and private comparables allow partial triangulation of the €12.5 billion mark, though all face
              limitations: Robinhood and eToro are public US-registered entities with disclosed financials, while
              European neo-broker comps operate at different scale or maturity. Robinhood Markets (HOOD), the closest
              public analogue by business model—retail brokerage with zero-commission execution—reported FY2025 total
              net revenues of $4.473 billion (+52% YoY), net income of $1.879 billion, and 27.0 million funded customers
              as of December 31, 2025. Its public market capitalisation stood at $66.82 billion in May 2026, implying
              approximately 14.9× trailing P/S and 35.6× P/E. Robinhood's scale, US market depth, crypto, and
              derivatives revenue—segments absent or nascent at Trade Republic—explain a portion of the multiple
              premium. eToro Group (ETOR), which completed its Nasdaq IPO in 2024, reported $931 million in total
              commission income and $192 million net income in FY2024 via its SEC F-1. FY2025 net income was $215.7
              million and gross profit reached $857 million; eToro's May 2026 market cap was approximately $3.20
              billion, implying roughly 3.7× P/Net Contribution and 14.9× P/E. flatexDEGIRO (FTK:DE), the listed
              European discount broker, carries a sub-€1 billion market cap due to margin pressure, giving a P/S below
              2×—a stark contrast to Trade Republic's implied multiple. Revolut was valued at $45 billion in its August
              2024 employee share sale, implying ~15× P/S on estimated $3 billion revenue from diversified banking. N26
              was last marked at $9 billion (2021), well below current implied multiples for growing EU fintechs. The
              implied Trade Republic P/S of 25–31× (assuming FY2025 revenue of €400–500 million estimated from FY2023
              base of €179 million at approximate 2× customer CAGR) sits well above every public comp. The AUM-based
              metric (€12.5 billion / €150 billion AUM = 8.3%) is more benign than Robinhood's 34.6% of platform assets
              ratio, suggesting the AUM-based valuation is defensible; the premium is concentrated in the
              revenue-multiple stretch.
            claimRefs:
