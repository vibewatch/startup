          detail: 1% crypto spread; Visa debit interchange; 0.7% on non-first card deposits.
          tone: neutral
        - id: revenue
          label: Revenue (~€340M FY2023/24 est.)
          detail: 'Three-pillar revenue base: PFOF transitioning to MTF, interest income, and fees.'
          tone: positive
