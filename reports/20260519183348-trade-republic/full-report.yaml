          label: Zero-commission trading and banking
          detail: Stocks, ETFs, crypto, bonds, derivatives, savings plans, debit card, current account, interest product.
          tone: positive
        - id: revenue-trading
          label: Order routing and PFOF (transitioning)
          detail: >-
