            calloutType: risk
            claimRefs:
              - CU018
              - CU019
              - CU021
              - CU022
              - CU027
          - type: callout
            title: First-Time Investor Majority Creates Long-Term Upside and Loyalty Risk
            body: >-
              An estimated 70% of Trade Republic's customers are first-time investors. This is a double-edged
              demographic: it creates a large, underpenetrated acquisition funnel and positions Trade Republic as the
              entry point for an emerging generation of European retail investors. But first-time investors also have
              lower financial literacy, smaller balances, higher sensitivity to UX friction and customer service
              failures, and no comparative context to reward loyalty. The combination of a service quality gap and a
              majority first-time-investor base elevates the risk that deteriorating support will drive disproportionate
