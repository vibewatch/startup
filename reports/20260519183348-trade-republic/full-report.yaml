      - number: '5.3'
        title: Banking, Card, and Payment Features
        blocks:
          - type: paragraph
            body: >
              Since obtaining its ECB banking licence in December 2023, Trade Republic has rolled out a full
              current-account suite: individual German IBANs, SEPA credit transfers, standing orders, direct debits, and
              a Visa debit card with no monthly fee launched in 2024. The card supports unlimited free global ATM
              withdrawals from amounts of €100 and integrates with Apple Pay and Samsung Wallet for contactless payment.
              The travel feature promotes fee-free foreign-currency card spending. Cash interest is set at the ECB
              deposit rate (2.00% p.a. as of June 2025 after the ECB cut) and accrues daily on unlimited balances for
              customers who have accepted a TR IBAN. The Saveback mechanic — 1% of eligible card spending (up to
              €1,500/month) credited to a savings plan — is conditional on maintaining at least €50/month in savings
              plan contributions. Customer cash is held either at partner banks (deposit-insured up to €100,000 per bank
              under EU rules) or in money market funds (not covered by statutory deposit insurance), a distinction that
              became the subject of a Verbraucherzentrale BW lawsuit filed in January 2025.
