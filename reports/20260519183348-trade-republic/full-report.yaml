        title: Exhibits
        blocks:
          - type: callout
            title: Scalable Capital's ECB Banking Licence Closes Trade Republic's Regulatory Moat
            body: >
              Trade Republic held a unique competitive position as the only European neobroker with a full ECB banking
              licence from 2023 until Scalable Capital received its own licence in 2025. This moat — which underpinned
              Trade Republic's ability to offer deposit interest, IBAN accounts, and Visa cards without a banking
