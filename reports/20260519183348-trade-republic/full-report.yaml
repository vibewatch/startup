      - number: '3.4'
        title: Switching Costs, Lock-in, and Multi-Homing
        blocks:
          - type: paragraph
            body: >
              Switching costs in European retail brokerage are moderate but not negligible. Trade Republic's savings
              plans (Sparpläne) — recurring automated investments in stocks, ETFs, or crypto — create habitual
              engagement and accumulate portfolio positions that users are reluctant to transfer. The integrated product
              suite (brokerage plus interest account plus Visa debit card) makes Trade Republic a financial primary
              relationship for many customers, raising the perceived cost of switching to a single-product broker.
              However, structural lock-in is limited: the EU's MiFID II framework mandates portfolio transfer rights,
              and the standard fee of €0–€25 per position for outgoing transfers is manageable for larger portfolios.
              N26 explicitly notes that fractional shares and ETFs cannot be transferred in a portfolio transfer,
              pointing to a practical barrier that reduces portability across all neobrokers including Trade Republic.
              Multi-homing — using multiple brokers simultaneously — is widespread among active European retail
              investors, meaning Trade Republic does not capture all wallet share even from its own customers. Revolut
              users commonly hold a second account at a dedicated brokerage for ETF breadth. The strongest de-facto
              lock-in mechanisms are: (1) savings plan psychology — momentum investing creates inertia; (2) cash
              interest — customers with idle balances at 2.5 % p.a. face an opportunity cost of moving cash; (3) brand
              trust — once a user has committed their pension savings to a platform, the emotional cost of moving is
              high regardless of product gaps. Distribution lock-in (exclusive channels, employer partnerships) is not
              meaningfully present for any European neobroker including Trade Republic.
            claimRefs:
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
      - number: '3.5'
        title: Moat Durability, Adverse Evidence, and Competitive Risks
        blocks:
          - type: paragraph
            body: >
              Trade Republic's competitive advantages — price leadership, banking licence integration, and brand trust
              among first-time investors — are each under specific threat. Scalable Capital's 2025 ECB banking licence
              eliminates the regulatory moat that Trade Republic held since 2023, enabling Scalable to offer deposit
              interest and card products that previously only Trade Republic provided in the neobroker segment. DEGIRO's
              lower per-trade cost for active traders (€1 plus handling, versus Trade Republic's €1 flat) and superior
              exchange access (50+ exchanges vs. Trade Republic's narrower selection) attract the more sophisticated
              investor cohort that Trade Republic struggles to retain. The threat of commoditisation is real: where
              pricing is converging toward zero (N26 fee-free trading, Revolut's free monthly trades in paid plans),
              revenue will need to migrate to banking spreads and interest income — precisely the strategy Trade
              Republic is executing but which exposes it to interest-rate cycle risk. Adverse evidence against Trade
              Republic itself is material: the VZBV (Germany's leading consumer federation) reported a strong increase
              in complaints about Trade Republic, the Verbraucherzentrale Baden-Württemberg filed a lawsuit against
              Trade Republic over misleading interest rate advertising in 2025, and a WirtschaftsWoche report documented
              customer service failures that drove churn and required Trade Republic to publicly commit to service
              expansion. A platform outage in April 2025 during peak market volatility further highlighted the
              operational risk that comes with rapid scaling. These adverse signals matter competitively: they reduce
              the trust differential that Trade Republic claims over less-regulated peers and give comparison media and
              consumer advocates grounds for steering users elsewhere.
