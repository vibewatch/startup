      - number: '2.2'
        title: Market Sizing — TAM, SAM, and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              Multiple lenses produce incompatible estimates of the European retail investment market size, and these
              contradictions must be preserved rather than resolved. The broadest measure—total EU household financial
              assets including bank deposits, life insurance, pension entitlements, and investment funds—exceeded an
              estimated €25 trillion in 2024 based on ECB aggregate statistics. However, this figure encompasses passive
              savings that are not addressable by investment platforms. A narrower TAM—annual revenues addressable by
              retail investment platforms in the EU—is estimated by analysts at between €2 billion and €8 billion,
              depending on whether subscription fees, transaction revenues, foreign-exchange spreads, crypto trading
              revenues, and interest income on client cash are included. EFAMA reported European UCITS industry assets
              grew from approximately €16 trillion in 2020 to over €20 trillion by 2024, reflecting market appreciation
              and net inflows, but these are stock figures (total AUM) rather than revenue figures.

              The SAM for Trade Republic—the subset accessible given its current geographic and product footprint—is
              further constrained by: regulatory authorisation limited to 17-plus EU member states, the zero-commission
              model which excludes per-trade commission revenue, and the absence of advisory services. Based on Trade
              Republic's own trajectory (€150 billion AUM, 10 million customers) and the disclosed profitability across
              three consecutive years, a rough revenue SAM in the range of €500 million to €1.5 billion annually in
              PFOF-equivalent and transitional revenues appears plausible, but this figure is inherently imprecise
              because Trade Republic has not disclosed its revenue breakdown. The SOM—Trade Republic's realistic
              near-term capture— is already partially realised given its leading European position, but remains under
              pressure from the PFOF ban requiring a complete revenue-model transition by June 2026.

              A key contradictory data point: EFAMA's UCITS figures and ECB household balance sheet data point to a very
              large total stock of investable assets, while revenue-based analyst estimates suggest the monetisation
              rate is very low, implying either significant price-down pressure or large latent revenue upside. Neither
              view can be confirmed without Trade Republic's own P&L disclosure.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM020
              - CM021
              - CM026
