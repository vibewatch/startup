      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: PFOF Ban Creates Structural Revenue Discontinuity by June 2026
            body: >-
              The MiFIR amendment banning PFOF for EU retail clients takes effect June 2026. PFOF historically funded a
              material share of neobroker revenues across Germany and the Netherlands. ESMA called for the ban citing
              conflicts of interest. Trade Republic must complete its revenue-model transition before the deadline, and
              the post-ban margin trajectory is not yet visible in public data. Any due-diligence process should demand
              a clear view of post-PFOF revenue architecture and its unit economics per customer.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM025
          - type: callout
            title: EU Pension Gap Is the Durable Structural Tailwind
            body: >-
              The declining public pension replacement rate across EU member states—a function of demographics, labour
              market shifts, and fiscal constraints—creates a structural incentive for retail investing that persists
              across interest rate cycles. The EU CMU and Retail Investment Strategy policies explicitly target this
              gap. For Trade Republic, this represents a long-horizon customer acquisition tailwind that is insensitive
              to short-term monetary policy movements, making the European retail investment market materially more
              durable than a cyclical equity participation wave.
            calloutType: insight
            claimRefs:
              - CM014
              - CM016
              - CM017
              - CM030
          - type: callout
            title: TAM Revenue Estimates Are Speculative Without Industry-Level Disclosure
            body: >-
              The €2B–€8B annual revenue TAM range reflects genuine uncertainty rather than rounding. No authoritative
              EU-wide database tracks retail investment platform revenues by product type. The range's lower bound
              assumes only broker commissions; the upper bound includes interest income and adjacencies. Analysts and
              investors should treat any specific mid-point as an assumption rather than a finding, and demand
              bottoms-up revenue disclosure from Trade Republic before anchoring to a specific TAM number.
            calloutType: assumption
            claimRefs:
              - CM033
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Taxonomy
        blocks:
          - type: paragraph
            body: >
              Trade Republic's competitive set spans at least six distinct categories. Direct neobroker peers — Scalable
              Capital and flatexDEGIRO/DEGIRO — contest the same European retail self-directed investor audience with
              overlapping product menus. Adjacent fintech platforms — eToro, Revolut, and N26 — offer investing as one
              module inside broader financial super-apps or social trading ecosystems. US-headquartered Robinhood is a
              structural entrant threat, having launched in EU markets while carrying a proven zero-commission playbook.
              Traditional full-service incumbent brokers (Comdirect, ING, DKB) and large wealth managers address the
              same underlying pension-gap problem but at higher cost and friction. The status quo — doing nothing, or
              using a savings account only — remains the largest implicit competitor for first-time investors, who
              represent 70 % of Trade Republic's customer base. Internal build by large banks is a lower-probability
              threat but cannot be dismissed as platform-era incumbents invest in digital brokerage capabilities. The
              competitive intensity is therefore highest among European direct neobrokers, where pricing, product
              breadth, trust, and distribution power increasingly converge.
