      - number: '8.6'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Trade Republic has demonstrated pre-IPO readiness on several dimensions: ECB banking licence obtained
              December 2023, three years of reported profitability, and an institutional investor base of Fidelity,
              Wellington, and GIC quality. The most likely exit paths are (1) a Nasdaq or Frankfurt Stock Exchange IPO
              at 18–36 months post-secondary, (2) a strategic acquisition by a large European bank or asset manager
              seeking retail distribution at scale, or (3) continued secondary liquidity events with primary capital
              raised only if geographic expansion requires regulatory licensing capital. Critical diligence asks prior
              to any investment at or above the €12.5 billion mark include: FY2024 and FY2025 audited IFRS revenue and
              EBITDA; the MTF revenue-per-order versus prior PFOF economics; the split between interest income and
              trading commission in the FY2025 revenue base; net revenue per customer by cohort vintage; AUM retention
              sensitivity to a 20%+ equity market drawdown; and the full cap table with liquidation preference
              waterfall. Without these data points, the precision of any DCF or multiple-based valuation is insufficient
              to underwrite a material position at the current mark.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV013
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: AUM-Based Valuation Most Defensible
            body: >-
              At 8.3% of AUM (€12.5B / €150B), Trade Republic's valuation is materially lower than Robinhood's 34.6% of
              platform assets ratio. The AUM-based metric is therefore the strongest argument for the current mark; the
              revenue multiple (25–31× estimated 2025) is the primary source of stretch. If Trade Republic can grow AUM
              to €200-250B by 2027 while maintaining the current revenue-per-AUM ratio, the valuation becomes
              increasingly defensible even without revenue multiple expansion.
            calloutType: insight
            claimRefs:
              - CV020
              - CV025
          - type: callout
            title: PFOF Revenue Displacement Remains Unquantified
            body: >-
              Trade Republic's BaFin MTF licence obtained January 2026 is designed to replicate PFOF economics under a
              post-MiFIR compliant structure, but actual revenue per order under MTF market-making spreads versus prior
              PFOF rates has not been disclosed. ESMA's research found that PFOF created conflicts of interest and
              sub-optimal execution quality; the MTF structure reduces the conflict but may also reduce the per-order
              economics. This is the single largest unquantified risk in the valuation.
            calloutType: risk
            claimRefs:
              - CV029
              - CV035
              - CV039
          - type: callout
            title: Secondary-Only Structure Signals Cash-Generative Business
            body: >-
              The December 2025 secondary transaction generated zero new information about forward capital needs because
              no primary capital was raised. It validates that the business is cash-generative and self-funding, but the
              absence of a primary round also means no formal subscription agreement required new investors to accept
              standard information rights—reducing the transparency benefit that typically accompanies primary
              institutional rounds.
            calloutType: insight
            claimRefs:
              - CV002
              - CV004
              - CV009
