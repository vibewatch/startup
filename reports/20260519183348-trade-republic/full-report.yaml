      - number: '3.3'
        title: Adjacent Platforms and Global Entrants
        blocks:
          - type: paragraph
            body: >
              eToro (NASDAQ: ETOR) is an Israeli-founded social and copy-trading platform with 3.81 million funded
              accounts and $18.5 billion in assets under administration as of December 31, 2025. Its copy trading and
              Smart Portfolios differentiate it from pure brokerage, attracting a beginner segment that overlaps
              substantially with Trade Republic's 70 % first-time investor base. However, eToro sells CFDs in Europe — a
              product class from which regulatory studies show a majority of retail customers lose money — and settled
              SEC charges in 2023 related to unregistered securities for US customers. BrokerChooser reviewers note high
              currency conversion fees, a $5 withdrawal fee, and slow customer support as chronic weaknesses. Revolut is
              structurally the most dangerous distribution threat: its 70 million customers as of March 2026 and £4.5
              billion in 2025 revenue dwarf any European neobroker, and its stock trading module (1,500+ US stocks) is a
              free inclusion in paid plans. Revolut holds banking licences in the UK and Lithuania and was valued at $75
              billion in November 2025. However, Revolut's investing product is narrow (no ETFs outside the UK, no
              savings plans, no fixed income) and BrokerChooser flags poor customer service and basic research tools as
              structural weaknesses. N26 offers fee-free stock and ETF trading via a third-party integration with its
              banking account, but investing is ancillary to its core proposition; N26 explicitly warns users that
              fractional share portfolio transfers are impossible, reflecting limited commitment to brokerage depth.
              Robinhood (NASDAQ: HOOD) generated $4.47 billion in revenue and $1.88 billion in net income in 2025,
              demonstrating scale and profitability that far exceed any European neobroker, and has begun EU expansion.
              Its commission-free, app-first model is a proven template, but its US regulatory record (record FINRA fine
              of $70 million in 2021, multiple outage incidents) illustrates execution risk in new markets.
