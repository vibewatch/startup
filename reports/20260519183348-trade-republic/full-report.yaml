      - number: '1.3'
        title: Funding History and Investor Base
        blocks:
          - type: paragraph
            body: >
              Trade Republic's capital formation history follows a conventional VC-to-growth-equity arc that accelerated
              significantly from 2020 onward. The company attracted seed and early-stage backing from Creandum, Project
              A Ventures, and Accel before Founders Fund, the Silicon Valley fund co-founded by Peter Thiel, invested in
              its Series A and later rounds. In May 2021, Trade Republic raised approximately $900 million in a large
              Series C led by Sequoia Capital and Founders Fund at a reported $5 billion valuation, marking its first
              unicorn designation and establishing it among the highest-valued European consumer fintechs at the time.

              A June 2022 Series C extension of €250 million was led by Ontario Teachers' Pension Plan Board at a
              valuation of approximately €5 billion, adding a Canadian institutional anchor. The December 2025 secondary
              transaction fundamentally reset the investor base: a €1.2 billion secondary share sale at €12.5 billion
              pre-money valuation was led by Founders Fund alongside existing investors Sequoia Capital, Accel, TCV, and
              Thrive Capital, with major new entrants including Wellington Management, GIC (the Singapore sovereign
              wealth fund), Fidelity Management and Research, Khosla Ventures, Lingotto Innovation, and Aglaé (the
              tech-investment vehicle of the Arnault family). This secondary round made Trade Republic Europe's first
              decacorn neobroker and significantly broadened the institutional shareholder base with long-duration
              capital.
