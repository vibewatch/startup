  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              The European retail investment market is best defined as the suite of regulated services enabling private
              individuals to allocate savings into transferable securities, collective investment schemes, and
              structured deposits. Under MiFID II (Directive 2014/65/EU), a "retail client" is any client who is not a
              professional client—covering the overwhelming majority of private households. This broad legal boundary
              encompasses commission-based and zero-commission brokers, ETF and savings-plan platforms, digital banks
              offering investment products, and robo-advisers. It explicitly excludes institutional asset management,
              wholesale banking, corporate treasury, and purely retail banking without an investment product layer.

              Within this boundary, Trade Republic operates in the neobroker and digital retail bank sub-segment: zero-
              commission equity and ETF trading, bond access, crypto, savings plans, cash interest products, and a debit
              card linked to an IBAN. This overlaps with, but is narrower than, the full retail investment service
              market—platforms offering fund distribution, advisory services, or complex derivatives reach customer
              segments that Trade Republic does not currently serve. The relevant TAM therefore includes all EU private
              individuals with investable savings seeking cost-efficient self-directed investing, while the SAM is
              bounded by the countries where Trade Republic holds regulatory authorisation (17-plus EU member states as
              of 2025) and by the target demographic of digitally-engaged, cost-sensitive retail investors.

              Key substitutes in the status-quo sense include: traditional banks offering custody accounts with
              per-trade commissions (€5–15 per trade pre-neobroker era), savings deposits with domestic banks, physical
              real estate as a savings vehicle, and government savings bonds. The arrival of zero-commission neobrokers
              structurally disrupted the traditional broker price umbrella and converted previously inactive savers into
              first-time equity investors—a process the EU Retail Investment Strategy aims to continue and formalize.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM023
              - CM032
              - CM035
