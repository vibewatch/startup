      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The European retail investment market exhibits a highly fragmented buyer landscape that does not fit a
              single persona. The most important segmentation dimension for neobrokers is prior investing experience:
              approximately 70% of Trade Republic customers are first-time investors, a proportion that reflects the
              platform's positioning as a point-of-entry for previously unbanked or non-investing Europeans rather than
              a value-migration play from traditional brokers. This first-time investor segment is characterised by low
              assets under management per capita, high sensitivity to user experience and app quality, price elasticity
              concentrated on zero-commission positioning rather than absolute return, and a propensity to start with
              ETF savings plans rather than active stock picking.

              The payer and user are typically the same individual in neobroker transactions—self-directed retail
              investing is a direct-to-consumer model where the individual bears both the decision and the cost. There
              is no enterprise or B2B payer dynamic. Budget ownership rests entirely with the retail customer, who
              allocates discretionary savings. The adoption trigger differs by segment: first-timers respond to
              mobile-app simplicity, zero-commission positioning, and social proof; experienced migrants from
              traditional brokers respond to fee comparisons and product breadth; cash savers migrating into interest
              products respond to yield comparisons with traditional bank savings accounts.

              Buyer segmentation also has a geographic dimension: German retail investors have historically had below-
              average equity participation rates relative to peers in Scandinavia or the Netherlands, suggesting higher
              addressable growth in Germany and Southern European markets than in already-engaged markets. The World
              Bank Global Findex 2025 data confirms greater-than-94% bank account penetration in Europe, meaning the
              barrier to retail investing is not financial access but behavioral inertia and price sensitivity.
            claimRefs:
              - CM003
              - CM015
              - CM018
              - CM027
              - CM028
              - CM029
              - CM038
