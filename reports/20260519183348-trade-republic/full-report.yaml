    title: Business model and product flow
    type: flow
    layout: standard
    summary: >-
      Trade Republic aggregates retail investors into a vertically integrated platform; revenue flows from order routing
      (PFOF transition), interest on cash, and banking services, while regulatory constraints shape the cost and
      compliance architecture.
    data:
      nodes:
        - id: customers
