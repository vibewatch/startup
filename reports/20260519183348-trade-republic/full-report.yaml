      - number: '4.6'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >
              Trade Republic's financial profile as of May 2026 is that of a growth-stage digital bank that has achieved
              positive net income without abandoning aggressive product expansion. The revenue quality is mixed: the
              multi-year profitability is real and verified by commercial-register filings, and the shift toward net
              interest income reduces exposure to the PFOF ban. However, PFOF was still the dominant revenue component
              until recently, and the transition to MTF-based order routing introduces execution risk: if the MTF
              generates materially lower per-order economics than the PFOF arrangement with Lang & Schwarz, the revenue
              mix could deteriorate in FY2026/27 even as customer numbers grow.

              The margin path is plausible but not assured. At roughly 7–10 percent net margin on a revenue base that
              grew 50+ percent year-on-year from FY2022/23 to FY2023/24, Trade Republic is demonstrating operational
              leverage — costs grew much more slowly than revenues. If this pattern continues and the PFOF-to-MTF
              transition is revenue-neutral, the margin path to 15–20 percent net margin by FY2026/27 appears
              achievable. Capital intensity is low for a software-and-banking platform: no manufacturing, no inventory,
              minimal capex. The primary capital calls are regulatory capital maintenance, technology investment, and
              geographic expansion.

              The main diligence blockers from a financial perspective are: (1) the undisclosed MTF revenue economics
              versus the legacy PFOF model; (2) the FY2024/25 P&L (not yet in the public record); (3) the CET1 ratio and
              regulatory capital position under ECB/BaFin supervision; (4) the interest-rate sensitivity of the
              interest-income pillar; and (5) the structural resolution of the customer-service capacity problem, which
              carries both regulatory risk (BaFin/consumer-protection scrutiny) and churn risk. At a €12.5 billion
              valuation on approximately €340 million trailing revenue (FY2023/24), the implied revenue multiple of
              roughly 37× is ambitious and requires sustained 40–50 percent annual revenue growth to decompresses toward
              a reasonable exit multiple — achievable if the customer-scale and AUM trajectory continues, but sensitive
              to macro rate environment and competitive pressure.
            claimRefs:
              - CI001
