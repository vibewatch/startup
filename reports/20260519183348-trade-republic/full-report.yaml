      - number: '7.4'
        title: Financial and Model Risks
        blocks:
          - type: paragraph
            body: >-
              Trade Republic financial model in 2026 is in structural transition. The company reported EUR 34.8 million
              in annual profit for financial year 2023/24 on revenue of approximately EUR 340 million, with commission
              income of EUR 316 million representing over 93% of the total. General administrative expenses were EUR 225
              million, including EUR 67 million in personnel costs. At a EUR 12.5 billion December 2025 secondary
              valuation, Trade Republic trades at approximately 37x FY23/24 revenue — a multiple that demands sustained
              high revenue growth with no significant model disruption.

              Three risks could compress revenue below the base: (1) the PFOF ban removes approximately 30% of revenue
              unless fully replaced by MTF-internalized spread income or explicitly priced commission; (2) ECB rate cuts
              reduce the net interest income earned on customer float, which Trade Republic passes through at 1:1 (the
              rate moved from 2.25% to 2.0% in June 2025); and (3) sustained market-volatility-driven trading inactivity
              reduces transaction-fee revenue. Capital risk is lower than for earlier-stage neobanks given three
              consecutive profitable years, but the ECB banking licence subjects Trade Republic to SREP-driven capital
              adequacy assessments and potential supervisory add-ons if BaFin and ECB flag elevated operational or
              compliance risk. Fraud and AML risk is latent: as Trade Republic processes millions of transactions
              including crypto trades, derivatives, and its Kinderdepot (children account) product, the surface area for
              financial crime compliance failures expands. Concentration in the EU retail investor segment means the
              business has no geographic or customer-segment hedge against a prolonged equity-market downturn.
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
          - type: table
            tableRef: TR004
            claimRefs:
              - CR018
              - CR027
              - CR037
      - number: '7.5'
        title: Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Trade Republic strongest structural mitigation is the ECB banking licence itself: it enables direct
              deposit-taking, eliminates partner-bank dependency for custodying the core deposit book, and gives the
              company standing to apply for payment system access, widening its revenue options beyond brokerage. The
              January 2026 MTF licence is a proactive hedge against the PFOF ban and, if fully operationalised, could
              allow Trade Republic to capture the execution spread it currently pays away. Three consecutive profitable
              years provide a financial buffer. The founders remain technically engaged in the product, reducing
              execution risk associated with leadership transitions. Consumer complaint volume, while growing, is
              concentrated in specific operational areas (dividend delays, portfolio transfers, customer service) that
              the company has acknowledged and is reportedly addressing through headcount expansion.

              Thesis-break triggers are specific and measurable: (a) a court injunction or BaFin enforcement order
              requiring Trade Republic to materially change its deposit-insurance and interest-rate advertising across
              17+ markets; (b) a failure to implement credible PFOF revenue replacement before 30 June 2026, resulting
              in a revenue step-down exceeding 20% without visible offset; (c) a major ICT incident under DORA leading
              to ECB supervisory action or capital surcharge; (d) a shift in ECB rates that takes the deposit facility
              rate below 1%, removing most of the float income; and (e) a BaFin supervisory action that restricts
              product features, increases capital requirements, or limits customer onboarding in Trade Republic core
              German market. Monitoring indicators include: the BaFin supervisory database for MTF status updates on
              Trade Republic Business III GmbH; the VZ-BW lawsuit docket; the Verbraucherzentrale Bundesverband
              complaint statistics; and Trade Republic next published annual accounts.
