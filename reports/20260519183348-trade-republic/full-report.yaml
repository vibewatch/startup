      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >
              Trade Republic was founded by three co-founders whose complementary academic backgrounds span philosophy,
              physics, and computer science. Christian Hecker studied philosophy in Frankfurt and mathematics and serves
              as CEO; he has been the primary public face of the company throughout its growth journey. Thomas Pischke,
              who studied physics, and Marco Cancellieri, who holds a background in computer science, round out the
              founding trio and remain involved in company leadership. The three founders built the initial product
              together before the company received its first external investment.

              An important early governance fact is that Sino AG, a German securities trading firm, became an early
              majority shareholder around 2017 after investing in the Comdirect-incubated startup. This introduced an
              institutional co-owner at an early stage that differs from typical angel-to-VC trajectories. As the
              company expanded through successive funding rounds from Creandum, Project A, Accel, Founders Fund, and
              Sequoia, the cap table evolved significantly. Beyond the founding team, Trade Republic has not publicly
              disclosed a broader senior leadership roster as of the current report date, which itself is a diligence
              consideration: the leadership concentration and succession risk around the three founders remain relevant
              to any deeper governance assessment.
