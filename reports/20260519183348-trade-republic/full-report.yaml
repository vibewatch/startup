      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >
              Trade Republic's disclosed unit-economics data is sparse for a private company, but published annual
              account data and financial-media analysis allow partial reconstruction. In FY2022/23, the company's
              administrative and operating costs fell by approximately €84 million versus the prior year — a dramatic
              structural improvement attributable to reduced marketing spend, lower technology costs, and operational
              efficiency gains following the 2022 fintech-sector retrenchment. The FY2022/23 net profit of €14.07
              million on roughly €190 million revenue implies an approximate net margin of 7 percent. In FY2023/24,
              German commercial-register data points to net income of approximately €34.8 million on roughly €340
              million revenue — approximately 10 percent net margin — while revenue per customer on a base of roughly
              7–8 million average customers works out to approximately €40–50 per customer per year (annualised revenue
              per user, or ARPU).

              This ARPU is notably low relative to full-service banks but consistent with the neobroker peer set. At 10
              million customers and €150 billion AUM as of December 2025, the implied AUM per customer is €15,000 — a
              meaningful figure suggesting customers are not just opening empty accounts. Trade Republic's effective
              take rate on AUM (revenue as a percentage of AUM) for FY2023/24 is estimated at roughly 0.2–0.3 percent,
              far below the 50–100 basis-point fees charged by robo-advisors or active fund managers, but appropriate
              for a low-cost platform whose monetisation is based on volume and scale.

              Gross margin drivers include the PFOF rebate economics (opaque — not publicly disclosed), the net interest
              spread on customer cash, and the 1 percent crypto spread. The largest cost categories are personnel costs
              (approximately €67 million in FY2023/24 per commercial register data), administrative costs (~€225 million
              FY2023/24), and regulatory compliance costs associated with operating a fully-licensed bank across 17+
              European markets. BrokerChooser's 2026 review notes that customer service capacity has been a recurring
              pain point, with documented user reports of account freezes, withdrawal delays, and slow support —
              indicating that service-cost underinvestment has been a source of operational margin, but also a growing
              liability risk.
