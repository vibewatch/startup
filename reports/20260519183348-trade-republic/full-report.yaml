      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'PFOF Ban: June 2026 Revenue Cliff'
            body: >-
              Germany transitional PFOF exemption expires 30 June 2026 — fewer than six weeks from the report date. PFOF
              contributes approximately 30% of Trade Republic revenue. The MTF licence obtained in January 2026 is a
              credible mitigation path, but its operationalization timeline and revenue economics are unconfirmed.
              Investors should demand a signed or executed MTF trading-readiness timeline as a pre-closing condition.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Misleading Advertising Lawsuit and Deposit Insurance Disclosure
            body: >-
              Verbraucherzentrale Baden-Württemberg February 2025 lawsuit against Trade Republic is the most legally
              material adverse event in the current report period. If Stuttgart court issues a preliminary injunction,
              Trade Republic must materially revise cash-product marketing across 17+ EU markets. The lawsuit also
              signals regulatory and reputational risk from Trade Republic practice of routing customer cash to
              non-deposit-insured money market funds without clear front-of-interface disclosure.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: callout
            title: 'Diligence Priority: MTF Revenue Model and VZ-BW Lawsuit Status'
            body: >-
              The two highest-priority diligence asks before any investment decision are: (1) confirm whether Trade
              Republic Business III GmbH is executing live client trades through the MTF, and at what margin relative to
              PFOF; and (2) obtain current status of the VZ-BW lawsuit including whether a preliminary injunction has
              been issued or is expected. Both materially affect the thesis at the current EUR 12.5 billion valuation.
            calloutType: recommendation
