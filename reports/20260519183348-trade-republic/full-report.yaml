      - number: '1.5'
        title: Regulatory Standing and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Trade Republic's regulatory record combines notable achievements with recurring adverse events that
              warrant diligence attention. On the positive side, the full ECB banking license obtained in December 2023
              was a structural milestone: it removed dependency on partner banks such as Solarisbank, Deutsche Bank AG,
              JPMorgan SE, and Citibank Europe, enabling Trade Republic to hold customer deposits directly up to the
              €100,000 deposit-insurance limit. BaFin and the Deutsche Bundesbank serve as co-regulators under the
              Banking Act (Kreditwesengesetz).

              On the adverse side, several incidents have accumulated into a pattern of operational and compliance risk.
              In January 2021, Trade Republic halted trading in GameStop-linked securities during the retail trading
              frenzy, generating more than 4,000 BaFin complaints from customers. In 2022, a "free share" promotional
              campaign led to a cease-and-desist letter from Verbraucherzentrale Hamburg over misleading advertising. A
              platform outage in April 2025 occurred during high market volatility. In October 2025, the national
              consumer watchdog body Verbraucherzentrale Bundesverband (vzbv) reported 350 complaints against Trade
              Republic, representing a 75% increase year-over-year, citing customer service deficiencies associated with
              AI-only chat support and delays in depot transfers. In February 2025, Verbraucherzentrale
              Baden-Württemberg filed a lawsuit over alleged misleading advertising of Trade Republic's interest rate
              and deposit insurance terms. Trade Republic has responded by announcing plans to expand human customer
              service, and in January 2026 it obtained a BaFin license for Trade Republic Business III GmbH as a
              multilateral trading facility (MTF) to prepare for the EU ban on PFOF, which takes effect in Germany in
              June 2026.
