          - type: callout
            title: PFOF revenue transition and operational risk pattern
            body: >-
              Trade Republic's historical revenue model relied substantially on payment for order flow, which will be
              eliminated under the EU pan-European ban (Germany's exemption expires June 2026). The company is
              transitioning to an MTF-based order routing model, but the revenue impact of this transition is not yet
              quantifiable from public data. In parallel, the company faces a pattern of recurring adverse events —
              platform outages, consumer-protection lawsuits, and sharply rising customer complaints — that constitute a
              material operational and reputational risk thread.
            calloutType: risk
            claimRefs:
