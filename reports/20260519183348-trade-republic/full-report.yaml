            body: >-
              VZBV consumer complaints rose 75% year-over-year to 350 by October 2025, with VZBV explicitly stating
              Trade Republic receives more complaints per customer than any comparable neobroker or digital bank. BaFin
              complaint volumes rose similarly. Trade Republic shuttered its in-house service team in June 2024 and
              replaced it with an AI chat function, a decision that preceded the complaint surge. With no published NRR,
              churn rate, or NPS data, investors cannot determine whether complaint volumes have begun to translate into
