  - id: TV005
    title: Thesis-Break Triggers
    description: Conditions that would materially alter the Track recommendation toward either Avoid or Consider.
    sectionRef: SV-SEC-05
    type: factual-snapshot
    notes: >-
      Triggers are based on the valuation analysis framework; actual signal timing depends on Trade Republic financial
      disclosure cadence (Bundesanzeiger) and potential IPO prospectus filing.
    columns:
      - Trigger
      - Direction
      - Signal to Watch
    rows:
      - - MTF revenue-per-order <50% of prior PFOF economics
        - Downgrade to Avoid
        - Q2/Q3 2026 trading volume vs revenue per trade in any public filing
      - - FY2024-2025 audited revenue below €300M
        - Downgrade to Avoid
        - Bundesanzeiger filing or IPO prospectus disclosure
      - - FY2024-2025 revenue above €600M with 15%+ EBITDA margin
        - Upgrade to Consider
        - Bundesanzeiger filing, S-1/F-1 prospectus, or credible media disclosure
      - - ECB rate cuts reducing deposit yield below 1%
        - Downgrade to Track/Avoid
        - ECB policy meetings; Trade Republic deposit rate announcements
      - - IPO filing with full financials
        - Upgrade to Research More / Consider
        - SEC EDGAR S-1/F-1, BaFin KAP, or Frankfurt Stock Exchange prospectus
    claimRefs:
      - CV004
      - CV043
      - CV044
      - CV045
