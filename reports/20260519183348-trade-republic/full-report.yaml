            title: Europe's Largest Retail Broker with 10M+ Customers and €150B+ AUM
            body: >-
              Trade Republic's confirmed scale — 10 million customers and €150 billion AUM across 18 European countries
              — positions it as Europe's largest retail brokerage platform by customer count and AUM. The 100% customer
              growth (4M → 8M) and 3× AUM growth (€35B → €100B) achieved in 2024 alone are exceptional by European
              neobroker standards and signal strong product-market fit for the zero- commission, mobile-first investing
              model.
