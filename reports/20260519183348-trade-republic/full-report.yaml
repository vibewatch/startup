  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >
              Trade Republic operates a three-pillar revenue model built on order routing, banking-model interest
              income, and ancillary fees. The first and historically dominant pillar is payment for order flow (PFOF):
              when customers execute trades, Trade Republic routes those orders to a market maker — primarily Lang &
              Schwarz through the LS Exchange — and receives a rebate per order. Under this model, the headline fee to
              the customer is just €1 per executed order (a Fremdkostenpauschale, or external settlement cost), with
              zero explicit commission. PFOF has been declining as a share of total revenue; as of January 2026, the
              company itself acknowledged that PFOF accounts for less than 30 percent of revenues, down from the
              majority in earlier years.

              The second and now dominant pillar is net interest income. After obtaining its full ECB banking licence in
              December 2023, Trade Republic began holding customer deposits directly and passing a portion of the ECB
              deposit rate to customers as 2 percent per annum on uninvested cash balances (reduced from 2.25 percent in
              June 2025). With over €150 billion in assets under management as of December 2025, even a modest cash
              fraction generates material interest income — the interest spread between what Trade Republic earns on
              deposits placed at the ECB or custodian banks and what it pays customers forms the gross interest margin.
              This pillar is substantially larger in FY2023/24 than FY2022/23 given the much higher AUM base.

              The third pillar covers ancillary fees: a 1 percent spread on crypto trades, a 0.7 percent fee on
              subsequent credit card and digital wallet deposits (initial deposits and bank transfers are free), card
              interchange from the Visa debit card, and potential future premium subscription revenues (not yet
              launched). ETF trades and savings plan purchases are free of the €1 settlement fee, making passive
              investing effectively zero cost — a deliberate acquisition strategy. Revenue from fixed-income products
              introduced in 2024 and private markets access launched in 2025 remains at early-stage scale. The
              Bundesanzeiger register holds Trade Republic's annual account filings from which these revenue figures are
              drawn.
