  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Scale and Geographic Distribution
        blocks:
          - type: paragraph
            body: >
              Trade Republic's customer count crossed 10 million in late 2025, up from 8 million in January 2025 and
              approximately 4 million at the start of 2024 — a 2.5× expansion in under two years. The company's Google
              Play listing as of early 2026 describes "over 10 million users and €150 billion in assets across 18
              European countries," representing a near-tripling of AUM from roughly €35 billion in early 2024.
              Co-founder Christian Hecker confirmed in January 2025 that customers have collectively saved over €100
              billion "in just six years," with a large portion of those customers being first-time investors. WiWo
              reported in December 2025 that insider estimates suggested the customer base could reach 12 million by
              year-end 2025.

              The geographic distribution has shifted materially during 2024. Germany historically dominated the
              customer base. As of January 2025, however, one-third of Trade Republic's 8 million customers came from
              international (non-German) markets — a dramatic shift reflecting the 2024 rollout of the debit card and
              current-account products across 17-plus EU member states. France emerged as the largest international
              market, with more than 1 million customers by January 2025. TradeInformer noted that historically most
              clients were onboarded in Germany, making the 2024 internationalisation a structural inflection. AUM per
              customer rose faster than headcount (AUM tripled while customers doubled), suggesting average balances
              grew — though no customer-level AUM distribution is public.
            claimRefs:
