      - number: '7.2'
        title: Operational and Technology Risks
        blocks:
          - type: paragraph
            body: >-
              Platform reliability emerged as a documented, recurrent risk category in 2024 and 2025. In April 2025,
              during extreme market volatility driven by US tariff announcements, Trade Republic app became unavailable,
              preventing users from viewing portfolios or executing trades. The episode was not isolated: other German
              neobrokers also reported simultaneous technical difficulties, but Trade Republic outage attracted
              particular attention given its scale of over 10 million customers and EUR 150 billion in assets under
              management. The Digital Operational Resilience Act (DORA), which came into force across the EU in January
              2025, now mandates that financial entities including banks maintain written ICT risk-management
              frameworks, conduct annual resilience testing, and notify regulators of major ICT incidents within strict
              time windows. As a newly licensed bank under ECB supervision, Trade Republic faces the full DORA
              obligation set, and any material ICT incident can now trigger a supervisory inquiry.

              Dividend processing failures in 2024 and 2025 linked to a system migration, a September 2025 incident in
              which Trade Republic wrongly debited excessive withholding tax following a delayed update to Nvidia
              stock-split record (with at least one case involving EUR 9,686 in erroneous charges), and November 2025
              allegations from competitors about slow portfolio transfer execution collectively indicate a pattern of
              operational errors in corporate-actions processing. By 31 October 2025, Verbraucherzentrale Bundesverband
              had recorded 350 formal complaints about Trade Republic, a 75% year-on-year increase. Trade Republic
              support model relies primarily on an in-app chat interface, with some responses generated by AI. Consumer
              advocates argue this is insufficient for a licensed bank handling customers primary current accounts,
              savings, and investment portfolios. BaFin supervisory expectations for banks regarding customer-service
              standards differ from those for the lighter-touch CRR investment-firm licence Trade Republic held prior to
              December 2023.
            claimRefs:
              - CR011
