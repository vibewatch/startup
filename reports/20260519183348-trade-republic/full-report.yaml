      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Decacorn status with confirmed multi-year profitability
            body: >-
              Unlike many neobrokers that have remained loss-making at scale, Trade Republic confirmed three consecutive
              profitable fiscal years as of December 2025 while simultaneously reaching 10 million customers and a €12.5
              billion valuation. The combination of consumer scale, ECB banking license, and demonstrated unit economics
              distinguishes it within the European retail-investing landscape.
