tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Use case
      - Scale / evidence
      - Revenue / strategic value
      - Gap
    rows:
      - - Individual creators and consumers
        - Buyer and user are the same; payer is the subscriber
        - Text-to-video, image generation, creative exploration on Dream Machine
        - 30M+ worldwide users (company-claimed, Sept 2025)
        - Recurring subscription revenue; high volume but low per-unit value
        - No cohort, churn, or conversion metrics disclosed.
      - - Independent and boutique agencies
        - Buyer is the agency; users are creative staff; payer is the agency or brand client
        - Commercial production (Mazda campaign), campaign ideation, brand assets
        - Boundless (Johannesburg) delivered Mazda first AI commercial; follow-on agreement signed
        - Project-level or retainer access; strategic value in proof-of-concept
        - Deployment depth beyond one campaign is undisclosed.
      - - Global advertising agency groups
        - Buyer is the group C-suite; users are creative and strategy teams; payer is the agency network
        - Enterprise-wide AI workflow standardization; multi-market campaign production
        - Serviceplan Group (43+ locations, 6,500+ staff); Publicis Groupe ME (3,600+ staff, 8 markets)
        - Enterprise contracts; highest disclosed strategic value
        - No contract length, renewal, or NRR disclosed.
      - - Entertainment and production studios
        - Buyer is the studio/production company; users are directors, VFX artists; payer is the studio
        - Virtual production, visual effects, pre-visualization, post-production
        - Wonder Project / Innovative Dreams (AWS-backed, Prime Video debut); Monks, Galeria, Strawberry Frog at Ray3 launch
        - High-value long-term engagements if sustained; creative differentiation
        - Still launch-stage proof; no multi-project renewal evidence.
      - - Technology platform integrations
        - Buyer is the platform (Adobe, Amazon); users are platform subscribers worldwide; payer is the platform
        - Embedded AI video/image generation inside creative software and cloud services
        - Adobe Firefly (global Creative Cloud Pro); Amazon Bedrock (enterprise teams)
        - Potentially largest distribution reach via platform multiplier
        - Dependency on platform contract renewal; no disclosed revenue share.
      - - MENA and sovereign AI channels
        - Buyer is HUMAIN / PIF entity; users are enterprises and government agencies; payer is sovereign/public sector
        - Arabic-native AI content, HUMAIN Create deployment, regional enterprise adoption
        - HUMAIN Create (Ray3 deployed); Publicis Groupe ME MENA preferred partner; Riyadh office opened
        - Strategic and capital significance; creates HUMAIN concentration dependency
        - HUMAIN is both investor and customer; arms-length economics undisclosed.
      - - API and developer customers
        - Buyer is a software company or developer; users are end-product users; payer is the developer/company
        - Generative video and image via REST API; @ai-sdk/luma and lumaai npm packages
        - Lumaai npm package available; @ai-sdk/luma (Luma Photon) available via AI SDK
        - Recurring API revenue with potential for large-scale production workloads
        - Install counts, developer count, and API revenue not disclosed.
      - - Education
        - Buyer is the institution or educator; users are students and educators; payer is institution or educator
        - Classroom AI video generation, creative storytelling, generative-AI literacy
        - Application-based educator program and student ambassador program live; no named institutions disclosed
        - Long-term pipeline investment; near-term revenue likely minimal
        - No institutions named; adoption scale entirely undisclosed.
    notes: >-
      Segmentation is based on disclosed partner and customer announcements; revenue contribution by segment is
      not publicly reported. The MENA channel blends commercial and investor relationships, complicating
      assessment of arms-length customer economics.
