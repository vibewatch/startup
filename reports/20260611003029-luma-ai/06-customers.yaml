figures:
  - id: FU001
    title: Customer journey map — segments, entry surfaces, and expansion loops
    type: journey-map
    layout: wide
    summary: >-
      Illustrates how five customer segments enter Luma's ecosystem through distinct surfaces and
      deepen through expansion loops toward enterprise commitment.
    data:
      nodes:
        - id: consumer
          label: Individual Creator / Consumer
          description: >-
            Enters via Dream Machine free trial or direct sign-up; upgrades through Plus ($30/mo),
            Pro ($90/mo), Ultra ($300/mo) tiers; expansion via Agents workflows and higher credit usage.
        - id: indie-agency
          label: Independent / Boutique Agency
          description: >-
            Enters via product trial or EMEA outreach; converts through named project delivery
            (e.g., Boundless/Mazda); expands through follow-on client work agreement.
        - id: global-agency
          label: Global Agency Group
          description: >-
            Entered via London office / executive relationship (Jason Day); converts through
            enterprise agreement (Serviceplan, Publicis ME); expands across group locations and workflow layers.
        - id: platform
          label: Technology Platform (Adobe, AWS)
          description: >-
            Entered via API partnership at model launch (Ray3 + Adobe Firefly); distribution through
            platform subscriber base; expands via model version upgrades and deeper SDK integration.
        - id: production-studio
          label: Entertainment / Production Studio
          description: >-
            Entered via Wonder Project collaboration and Innovative Dreams co-launch with AWS;
            deepens through project-by-project production use; expansion loop includes Dream Lab LA.
        - id: sovereign-mena
          label: Sovereign / MENA Enterprise (HUMAIN)
          description: >-
            Entered via Series C investment and HUMAIN Create deployment; Riyadh office serves as
            hub; expands through Publicis ME preferred-partner channel and Arabic-native model rollout.
    claimRefs:
      - CU001
      - CU004
      - CU008
      - CU010
      - CU011
      - CU013

