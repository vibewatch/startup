  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact if dependency fails
      - Diligence path
    rows:
      - - Agency land-and-expand (add products, markets, brands under existing group contracts)
        - Serviceplan and Publicis ME collectively cover Europe and MENA; limited other named group-level wins
        - Loss of either anchor group would remove the primary enterprise-validation narrative
        - Request contract terms, renewal dates, and multi-year commitments for group-level accounts.
      - - HUMAIN Create / Saudi sovereign AI channel
        - HUMAIN is both lead $900M Series C investor and primary MENA enterprise deployment channel
        - Unwinding HUMAIN relationship would simultaneously reduce capital and largest-disclosed deployment surface
        - Clarify commercial terms governing HUMAIN Create; confirm arms-length pricing and volume commitments.
      - - Adobe Firefly platform distribution
        - Adobe integration is the largest disclosed distribution channel; no disclosed alternative at same scale
        - Loss of Adobe integration would remove global Creative Cloud access; developer stickiness reduced
        - Request integration contract length, minimum usage commitments, and revenue-share economics.
      - - AWS / Amazon Bedrock platform distribution
        - AWS is investor, cloud provider, and Bedrock distribution partner; triple dependency
        - Triple role creates leverage asymmetry; AWS-side termination would affect compute, distribution, and Innovative Dreams partnership simultaneously
        - Confirm contractual independence of each AWS relationship (investor, cloud, marketplace).
      - - Geographic expansion (London, Riyadh offices)
        - No named non-MENA, non-UK enterprise wins yet; EMEA proof is thin beyond Serviceplan
        - Expansion investment may fail to generate proportional customer wins in new geographies
        - Track named enterprise customer announcements from London and Riyadh offices in 2026.
      - - IP/copyright litigation risk for enterprise procurement
        - Monster Camp incident and sector-wide AI training-data litigation create enterprise procurement friction
        - Enterprise customers in brand-sensitive or regulated industries may require IP indemnification
        - Confirm whether enterprise contracts include IP indemnification; monitor AI copyright case developments.
    notes: >-
      Concentration risks are assessed qualitatively from disclosed partnership structures and investor relationships.
      No revenue concentration data (e.g., share of revenue from top 3 customers) has been disclosed.
