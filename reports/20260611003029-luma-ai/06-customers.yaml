callouts:
  - calloutType: strength
    title: Two landmark agency group wins corroborated by independent press
    body: >-
      Serviceplan Group and Publicis Groupe Middle East represent the two most-substantive enterprise-agency proofs to date.
      Both are corroborated by multiple independent sources (BusinessWire press releases, trade publication Campaign Middle East,
      and official Luma news pages), both feature named C-suite endorsements, and both describe production deployment rather
      than pilot. Together they signal that Luma AI has achieved credible agency-tier validation at scale across Europe and MENA.
    claimRefs:
      - CU005
      - CU006
      - CU007

  - calloutType: risk
    title: HUMAIN concentration spans investment, compute, and customer channels simultaneously
    body: >-
      HUMAIN is Luma AI's $900M Series C lead investor, primary MENA enterprise deployment channel (HUMAIN Create), and
      future compute provider (Project Halo 2GW supercluster). This triple dependency creates an unquantified concentration
      risk: a HUMAIN relationship change could simultaneously reduce capital access, enterprise customer base, and compute
      infrastructure. No arms-length commercial terms for the HUMAIN Create deployment have been publicly disclosed.
    claimRefs:
      - CU033
      - CU034
      - CU039

  - calloutType: risk
    title: IP litigation risk may create enterprise procurement friction
    body: >-
      The June 2024 Monster Camp incident (Pixar characters reproduced via Dream Machine, reported by The Verge) and
      ongoing sector-wide AI copyright litigation (documented by BakerLaw 2025-2026 tracker) mean enterprise customers
      in brand-sensitive or regulated industries may require IP indemnification clauses. Luma's response attributed
      the incident to user-uploaded content, but the company declined to detail moderation methods or training-data sourcing.
    claimRefs:
      - CU035
      - CU036
      - CU037

