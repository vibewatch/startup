  - id: named-production-proof-and-outcomes
    body: >-
      The strongest production evidence comes from three independent vectors: global agency group deployments,
      platform-level integrations with major technology incumbents, and a named studio-production use case.
      Serviceplan Group's February 2026 announcement is the most significant agency proof: the group described the
      partnership as operational infrastructure across 43 locations spanning strategy, creative development, content
      production, and delivery—language that implies a production rollout rather than a pilot. CEO Florian Haller's
      public endorsement ("faster, smarter, and at greater scale") and Jason Day's quote about "measurable operational
      and financial strength" are consistent with production-level adoption. Publicis Groupe Middle East named Luma its
      preferred partner in MENA with intent to integrate AI into creative and production workflows for brands across Saudi
      Arabia and the wider region; independent corroboration from Campaign Middle East confirms this partnership as of
      February 2026. Boundless delivered an approved Mazda campaign from brief to final approval in under two weeks—
      production by any standard—and subsequently signed an agreement to integrate Luma across future client work.
      On the platform side, Adobe offers unlimited Ray3 generations for 14 days to paid Firefly and Creative Cloud Pro
      customers; Amazon Bedrock hosts Luma models for enterprise teams; and AWS's own innovation case study names Luma as
      a cloud-native AI company building frontier visual models on Amazon SageMaker HyperPod. Dentsu Digital Japan, as
      sole Ray3 launch partner in Japan, indicated production pipeline intent ("integrate Ray3 into its production
      pipelines"). Wonder Project's Innovative Dreams studio actively used Luma for an Amazon MGM Studios project
      ("The Old Stories: Moses") confirmed to debut on Prime Video, making this a live studio production proof
      with a named network partner. Agency launch partners Monks (S4), Galeria, and Strawberry Frog were cited in the
      Ray3 announcement as early adopters for film, advertising, and creative industries, though their deployments
      have less disclosed outcome specificity. HUMAIN Create deployed Ray3 across the MENA region for creators in
      public and private sectors. The quality limitation across most enterprise proofs is that they are
      launch-announcement or partnership-announcement documents rather than renewal, retention, or cohort evidence.
