    severity: minor
    topic: market-sizing-regional
    missingEvidence: >-
      Fortune Business Insights, Grand View Research, and Technavio provide contradictory regional breakdowns for AI
      video generator market share (North America vs. Asia Pacific as largest region), and no independent source
      resolves the conflict.
    whyItMatters: >-
      Regional market leadership affects where Luma AI should prioritize sales and partnership investment; conflicting
      estimates prevent confident GTM geographic recommendations.
    diligencePath: >-
      Commission a regional primary survey of AI video generator buyers or obtain a premium full-access report from one
      of the analysts to review their methodology.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: regulatory-legal
    missingEvidence: >-
      No public data on how Luma AI's enterprise customers are contractually managing IP provenance and copyright
      compliance for AI-generated content in commercial use.
    whyItMatters: >-
      The D.C. Circuit ruling and Copyright Office conclusions create IP uncertainty that may be the biggest near-term
      barrier to enterprise scaling; how Luma AI addresses this in commercial contracts is a material diligence point.
    diligencePath: >-
      Review Luma AI's commercial-use license, terms of service, and representative enterprise contracts; seek legal
      opinion on whether "no-training-on-content" policy adequately addresses copyright risk for buyers.
    relatedQuestionRefs:
      - QM018
  - type: missing-source
    severity: minor
    topic: competitive-differentiation
    missingEvidence: >-
      No independent benchmark comparing Luma AI Ray3's output quality, latency, or cost-per-second against Runway
      Gen-4, Kling 3.0, or Google Veo 3.1 is available from a credible third-party source.
    whyItMatters: >-
      Technical differentiation is a key Luma AI value claim; without independent benchmarks, the assertion that Ray3
      offers superior cinematic quality cannot be verified against competitors.
    diligencePath: >-
      Obtain independent creative quality evaluation from a design research firm or film production professional;
      cross-reference with customer references at Serviceplan Group and Dentsu Digital on model selection rationale.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      No cross-publisher consensus or academic study has reconciled the 18–20% CAGR (Grand View / Fortune) range with
      Technavio's 35.4% CAGR, leaving the defensible long-run growth rate uncertain.
    whyItMatters: >-
      CAGR assumptions materially affect Luma AI's implied revenue trajectory and valuation multiples; a 35% CAGR versus
      an 18% CAGR roughly doubles the 2029 market size and therefore the implied addressable revenue.
    diligencePath: >-
      Request full methodology notes from one analyst (Grand View or Fortune); assess which market boundary aligns with
      Luma AI's actual revenue scope.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
