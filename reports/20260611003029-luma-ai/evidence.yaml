  - type: missing-source
    severity: minor
    topic: education-segment
    missingEvidence: >-
      No public data on the size, pricing, or conversion rate of Luma AI's Education Program exists; the institutional
      education market for AI video tools has not been independently sized.
    whyItMatters: >-
      The education channel could be a meaningful B2I (business-to-institution) revenue stream and user acquisition
      funnel; without data its contribution to Luma AI's TAM or commercial performance cannot be estimated.
    diligencePath: >-
      Request institutional partnership count and revenue from Luma AI management; benchmark against Synthesia and
      Runway education programs for pricing comps.
