evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: Revenue, ARR, gross margin, and operating expense figures for Luma AI.
    whyItMatters: >-
      Without revenue disclosure, the ~$4B valuation cannot be assessed against any revenue or ARR multiple, making
      financial diligence incomplete.
    diligencePath: >-
      Request audited financial statements or management accounts during formal diligence; cross-check AWS Bedrock and
      Adobe Firefly partnership terms for any revenue-share disclosures.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, independent director list, investor governance rights, and post-Series-C cap table.
    whyItMatters: >-
      HUMAIN's PIF status and the sovereign-fund dimension of the lead investor create governance questions that cannot
      be assessed without a board roster and rights structure.
    diligencePath: >-
      Request capitalization table, investor rights agreement, and board composition from management; assess HUMAIN's
      governance rights and any veto or information-right provisions.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: >-
      Confirmation or denial of Alex Yu's current CTO role or departure from Luma AI, and details of any leadership
      succession plan.
    whyItMatters: >-
      Alex Yu is a co-founder and the architect of Luma's core visual foundation models; unconfirmed departure would
      represent a material key-person risk at the CTO level.
    diligencePath: >-
      Request direct management confirmation; review any LinkedIn profile updates or official company statements; ask
      for an org chart during diligence.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: key-person dependency
    missingEvidence: >-
      Succession planning documentation for CEO Amit Jain, formal key-person assessment, and details of any non-compete
      or retention agreements for technical co-founders.
    whyItMatters: >-
      Amit Jain is the sole consistent public face of the company; departure or incapacity without a clear succession
      plan would create operational and investor confidence risk.
    diligencePath: >-
      Request key-person agreements, succession planning memo, and leadership depth assessment during formal diligence;
      interview direct reports to CEO.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: adverse — copyright
    missingEvidence: >-
      Clear disclosure of Luma AI's training data sources, any content licensing agreements, or copyright
      indemnification provisions for enterprise customers.
    whyItMatters: >-
      The June 2024 copyright incident and Luma's non-response to training-data questions leave open material IP risk,
      particularly as generative AI copyright litigation intensifies per BakerHostetler's 2026 AI case tracker.
    diligencePath: >-
      Request training data provenance documentation, licensing agreements, and enterprise indemnification terms; assess
      exposure against active AI copyright litigation landscape.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: minor
    topic: investors
    missingEvidence: >-
      Complete named investor roster with stake sizes, liquidation preferences, and secondary transfer history across
      all funding rounds.
    whyItMatters: >-
      Without a full cap table, the economic and governance rights of AMD Ventures, NVIDIA, Amazon, and early angels
      cannot be assessed for dilution and alignment.
    diligencePath: >-
      Request capitalization table from management; cross-check with any available secondary market data or VC firm
      portfolio disclosures.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: infrastructure
    missingEvidence: >-
      Verified Project Halo deployment milestones, current operational capacity, and contractual commitments between
      Luma AI and HUMAIN for compute delivery.
    whyItMatters: >-
      The Series C is partly premised on access to 2GW of compute; delivery delays or changes in HUMAIN's build plan
      would affect Luma's model training roadmap.
    diligencePath: >-
      Request HUMAIN compute delivery schedule, any SLA or contractual milestones, and interim AWS capacity as fallback
      documentation.
    relatedQuestionRefs:
      - QO027
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      No audited revenue data for the AI video generator market or for Luma AI's specific cinematic/professional segment
      exists in the public record.
    whyItMatters: >-
      All sizing figures are third-party analyst estimates with materially different market boundaries. Without primary
      revenue data from Luma AI or from a credible industry association, TAM precision is impossible to establish.
    diligencePath: >-
      Request Luma AI management data room with subscription revenue, API revenue, and enterprise contract totals;
      cross-reference with AWS and Adobe disclosed volume metrics if available.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: diligence-gap
    missingEvidence: >-
      No independent measurement of average Luma AI enterprise contract value, customer renewal rates, NPS, or
      conversion from API trial to paid production workloads is available in the public record.
    whyItMatters: >-
      Without commercial conversion and retention metrics, the quality of Luma AI's enterprise buyer motion—evidenced by
      agency deal announcements—cannot be translated into revenue predictability or retention risk assessments.
    diligencePath: >-
      Request customer cohort data from Luma AI; seek reference calls with Serviceplan Group, Dentsu Digital, or other
      disclosed enterprise buyers; request churn and NRR data.
    relatedQuestionRefs:
      - QM025
      - QM011
