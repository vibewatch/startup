  topStrengths:
    - >-
      Ray3/Ray3.2 reasoning video model embedded in Adobe Firefly globally and available on Amazon Bedrock, providing
      enterprise distribution proof with two major platforms.
    - >-
      30M+ worldwide users and Series C led by HUMAIN with Andreessen Horowitz and AMD Ventures confirming investor
      conviction at the $4B mark.
    - >-
      Project Halo 2-gigawatt AI supercluster partnership provides potential structural compute cost advantage if
      pricing terms prove favorable.
  topRisks:
    - >-
      Zero revenue disclosure — no ARR, gross margin, conversion rate, or burn rate — makes the $4B valuation entirely a
      forward-inference on product quality and user breadth.
    - >-
      HUMAIN's triple role as lead investor, primary compute provider, and commercial customer creates undisclosed
      governance and margin entanglement with no clean precedent.
    - >-
      Sector copyright litigation (Bartz v. Anthropic $1.5B settlement; Disney v. Midjourney pending) and Luma's June
      2024 IP incident create unresolved training-data liability risk.
  unresolvedGaps:
    - Audited or board-level revenue, gross margin, and burn rate for all revenue segments.
    - >-
      HUMAIN investment agreement, compute pricing terms, exclusivity provisions, and board conflict-of-interest
      management.
    - Training data licensing strategy and disclosure of legal reserves for copyright exposure.
    - Free-to-paid conversion rate, enterprise NRR, and top-customer revenue concentration.
    - Cap table, liquidation preferences, and preference-stack implications from the Series C.
    - Confirmation or denial of Alex Yu's CTO status and leadership bench continuity.
