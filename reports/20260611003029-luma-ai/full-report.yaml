  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Defining Luma AI's market requires separating what buyers actually substitute when they pay for AI video
              generation from adjacent software categories that may appear in the same budget conversation. Luma AI's
              homepage positions the company around "unified general intelligence that can generate, understand, and
              operate in the physical world," but its revenue-generating surface in 2026 is principally AI-native visual
              content creation: text-to-video and image-to-video generation (Ray3 models), AI image generation (Uni-1),
              and a multi-model marketplace that distributes third-party models including Veo 3.1, Kling Omni, and
              Seedance 2.0 alongside Luma's own models. Included spend covers subscription fees paid by individual and
              team users, per-credit API consumption charges for developers and agencies embedding AI video into
              products, and enterprise custom contracts with dedicated support and custom fine-tuning. Excluded spend
              includes raw cloud compute infrastructure costs, video hosting and CDN fees, traditional post-production
              software without AI generation capability, and human production agency fees for work AI does not displace.
              The status-quo substitutes a buyer considers before adopting Luma AI are: traditional film or commercial
              production crews and studios (for agencies and brands), stock video libraries such as Getty or Storyblocks
              (for marketing and social teams), manual motion graphics and VFX pipelines (for entertainment and gaming),
              and horizontal AI tools such as Adobe Premiere Pro's non-generative editing suite. The market boundary is
              therefore defined by willingness to substitute AI-native generation for one of these prior workflows, not
              by all creative software spend. One market-definitional complexity is that Luma AI's multi-model
              marketplace positions it as both a competitor and a distributor for models from Google, OpenAI, and
              Kuaishou, blurring the boundary between a standalone AI video generator and an aggregator platform—a
              strategic tension with material implications for market share estimates and pricing power.
            claimRefs:
              - CM001
              - CM002
              - CM003
