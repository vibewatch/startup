  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Luma AI has earned serious investor attention, but the current $4 billion private mark cannot be
              underwritten confidently from public evidence alone. The positives are material: a $900 million Series C
              closed in November 2025 with sovereign-backed HUMAIN as lead, Andreessen Horowitz and AMD Ventures as
              participants, and three independent media outlets confirming the valuation mark. The platform's 30
              million-plus worldwide users and 150-plus-person team indicate genuine scale. Ray3 — described as the
              world's first reasoning video model — launched in September 2025 and is already embedded in Adobe Firefly
              globally, with a June 2026 Ray3.2 upgrade adding frame-level API control for studios and agencies. The
              CNBC Disruptor 50 listing at number 35 in May 2026 provides independent recognition of commercial
              traction.

              The negatives are equally material. Luma AI has disclosed zero revenue-related metrics: no ARR, no take
              rate, no gross margin, no burn rate, no customer count distinction between free and paying users. The $4
              billion mark therefore rests entirely on the quality of the business being inferred from product
              capability, user breadth, and partnership announcements — all of which are consistent with a high-quality
              company but none of which closes the valuation gap between "interesting" and "underwritable." The HUMAIN
              relationship — simultaneously the largest investor, the compute provider for Project Halo, and the
              co-developer of Arabic-language AI models — creates a governance and independence question with no
              precedent in conventional early-stage diligence. Sector copyright litigation has escalated to a $1.5
              billion settlement in Bartz v. Anthropic, and Luma's own Dream Machine produced recognizable Monsters Inc.
              characters in June 2024 with the CEO declining to disclose training-data sources.

              The disciplined investment call is research-more: not avoid, because the upside is genuine, but not buy
              until the economics and legal posture are opened. The mark should be treated as a negotiation reference,
              not as settled fair value.
