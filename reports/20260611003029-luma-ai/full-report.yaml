  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Copyright litigation expands to Luma directly
        - >-
          A named complaint citing Dream Machine or Ray3 as a primary defendant, or a court ruling that forces
          training-data disclosure.
        - Directly compresses enterprise trust and increases reserve requirements.
        - Move case to avoid or require a very steep discount; pause integration deals.
      - - HUMAIN compute terms are above market or include exclusivity
        - >-
          Data-room review reveals pricing at or above spot GPU market rates, or geographic exclusivity limiting MENA
          distribution independently.
        - Collapses the Project Halo compute advantage thesis.
        - Re-underwrite as if Luma bears full compute cost; revise bull scenario down.
      - - Revenue quality is below threshold
        - >-
          Free-to-paid conversion below 2%, enterprise NRR below 100%, or API revenue concentrated in fewer than five
          customers.
        - Thin economics do not support a $4B mark at any plausible exit multiple.
        - Require either a price reset or a diligence-linked earnout tied to ARR.
      - - Google Veo or another free-tier competitor erodes Pro pricing
        - Pro/Ultra churn materially increases or API price-per-generation falls more than 30% within 12 months.
        - Collapses the premium-pricing assumption that underlies bull and base cases.
        - Cut valuation toward Runway-comparable range; monitor competitive ASP trends.
      - - Alex Yu co-founder departure confirmed and bench gap is unaddressed
        - Public disclosure or reliable reporting confirms change in CTO function without a credible successor.
        - Research technical moat durability; key-man risk materializes.
        - Require leadership bench diligence before proceeding at current price.
    notes: >-
      These are the specific downside triggers that should change price or decision, not merely headline risks. Each
      trigger maps to a diligence ask in TV006.
