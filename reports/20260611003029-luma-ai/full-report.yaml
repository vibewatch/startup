  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The investment call chains from product and capital proof through unresolved economics and structural governance
      to a research-more conclusion.
    data:
      nodes:
        - id: A
          label: $900M Series C at $4B
          detail: Corroborated by CNBC, Economic Times, Business Wire.
          tone: positive
        - id: B
          label: Ray3/3.2 + enterprise proof
          detail: Adobe global embed, Amazon Bedrock, Dentsu sole Japan partner, 30M+ users.
          tone: positive
        - id: C
          label: AI video market growth
          detail: $788M (2025) to $3.44B (2033) at 20% CAGR; enterprise segment highest-value.
          tone: positive
        - id: D
          label: Revenue / economics test
          detail: Zero financial disclosure — no ARR, margin, or conversion rate publicly available.
          tone: risk
        - id: E
          label: HUMAIN governance test
          detail: Investor, compute provider, and commercial partner in one entity; terms undisclosed.
          tone: risk
        - id: F
          label: Copyright / IP test
          detail: Bartz $1.5B settlement, Disney v. Midjourney pending, June 2024 IP incident.
          tone: risk
        - id: G
          label: research-more / stretched
          detail: Public record supports interest but not underwriting at $4B without data room.
          tone: risk
      edges:
        - from: A
          to: B
          label: confirms demand
        - from: B
          to: C
          label: scales into
        - from: C
          to: D
          label: needs revenue proof
        - from: D
          to: E
          label: plus governance clarity
        - from: E
          to: F
          label: plus IP resolution
        - from: F
          to: G
          label: until all three clear
    claimRefs:
      - CV001
      - CV002
      - CV012
      - CV017
      - CV031
      - CV034
      - CV041
  - id: FV002
    title: Valuation sensitivity to economics scenario
    type: bar
    layout: wide
    summary: >-
      Luma AI's implied fair value ranges from $1B to $6B+ depending on whether the hidden economics prove thin-margin,
      acceptable, or software-like.
    data:
      items:
        - label: Stability AI-like distress scenario
          value: 1
          detail: If copyright liability is material and competitive pricing collapses. Stability AI-like outcome.
          tone: risk
        - label: Runway-like comparable floor
          value: 1.5
          detail: Aligned with Runway ML's last known ~$1.5B private mark; thin-margin or intermediary economics.
          tone: risk
        - label: Bear case ceiling
          value: 2
          detail: Bear case upper bound if economics are thin but company survives competitive pressure.
          tone: neutral
        - label: Base case floor
          value: 2.5
          detail: Requires diligence to confirm acceptable revenue quality and controlled IP exposure.
          tone: neutral
        - label: Current round reference
          value: 4
          detail: November 2025 private mark; needs data-room confirmation to be treated as fair value.
          tone: neutral
        - label: Bull case with software economics
          value: 5.5
          detail: Requires strong free-to-paid conversion, HUMAIN compute advantage, and clean copyright posture.
          tone: positive
    claimRefs:
      - CV002
      - CV025
      - CV027
      - CV029
      - CV037
      - CV041
      - CV046
  - id: FV003
    title: Valuation and return range by scenario
    type: range
    layout: standard
    summary: >-
      The public-evidence range is wide because missing revenue and governance data can shift the fair-value band by
      3-4x from bear to bull.
    data:
      items:
        - label: Bear
          low: 1
          mid: 1.5
          high: 2
          displayValue: $1.0B-$2.0B
          detail: Copyright liability expands, HUMAIN terms dilutive, Veo free-tier erodes pricing.
          tone: risk
        - label: Base
          low: 2.5
          mid: 3.2
          high: 4
          displayValue: $2.5B-$4.0B
          detail: Economics are acceptable; HUMAIN neutral; copyright manageable; some competitive pressure.
          tone: neutral
        - label: Bull
          low: 4.5
          mid: 5
          high: 6
          displayValue: $4.5B-$6.0B
          detail: Software-like economics confirmed; HUMAIN compute advantage; clear copyright posture; Ray3.2 API wins.
          tone: positive
        - label: Preferred entry zone
          low: 2.5
          mid: 3
          high: 3.5
          displayValue: $2.5B-$3.5B
          detail: Range where investors are better compensated for current disclosure gaps and downside scenarios.
          tone: positive
    claimRefs:
      - CV002
      - CV025
      - CV029
      - CV037
      - CV040
      - CV041
      - CV046
  - id: FV004
    title: Investment KPIs scorecard
    type: kpi
    layout: wide
    summary: >-
      These are the six key investment metrics that should drive an underwriting decision for Luma AI at the current $4
      billion mark.
    data:
      items:
        - label: Last round valuation
          value: $4B (Nov 2025)
          detail: Corroborated by three independent outlets. Reference mark, not confirmed fair value.
          tone: neutral
        - label: Total capital raised
          value: $1.3B+
          detail: Self-reported on careers page; implies high capital intensity relative to undisclosed revenue.
          tone: neutral
        - label: User scale
          value: 30M+ worldwide users
          detail: Company-claimed from careers page. Free/paid split undisclosed.
          tone: positive
        - label: Revenue metrics
          value: Undisclosed
          detail: No ARR, MRR, take rate, gross margin, or burn rate in public record.
          tone: risk
        - label: IP / legal posture
          value: Unresolved
          detail: Sector $1.5B settlement, June 2024 IP incident, no training data disclosure.
          tone: risk
        - label: HUMAIN governance
          value: Undisclosed terms
          detail: Investor + compute provider + customer simultaneously; terms not public.
          tone: risk
        - label: Enterprise distribution proof
          value: Adobe, AWS, Dentsu Digital confirmed
          detail: Three major enterprise distribution channels publicly confirmed, no revenue values.
          tone: positive
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV009
      - CV017
      - CV018
      - CV031
      - CV034
