      - number: '5.2'
        title: Architecture, operating stack, and API/deployment
        blocks:
          - type: paragraph
            body: >-
              The core generative architecture is a transformer model trained on multimodal data—video, image, audio,
              and language—at a scale the CEO describes as approximately 1,000 times the data used by the largest large
              language models and totalling 1.2 quintillion tokens for Dream Machine V2. Training runs on Amazon
              SageMaker HyperPod, which provides the GPU cluster management, networking, and storage needed to sustain
              this data volume. The finished models are deployed through a public REST API and, separately, through
              Amazon Bedrock as a managed model endpoint, giving enterprise buyers a second consumption path that avoids
              direct API key management. The company's stated architectural philosophy is unified joint training across
              modalities rather than specialist models stitched together, reasoning that cross-modal backpropagation
              enables richer reasoning capabilities than independent specialist pipelines. Ray3's multimodal reasoning
              system generates both text and visual tokens during inference, allowing it to plan scenes before
              rendering, as described in the official launch post. The API surface is tiered: a Build (pay-as-you-go)
              tier starting at $0.15 per 540p/5s clip and a Scale (dedicated capacity) tier that requires a minimum
              four-unit commitment and provides a guaranteed throughput SLA plus built-in moderation and prompt
              enhancement. The company publishes Python, Node, Go, and TypeScript SDKs under the lumalabs GitHub
              organisation and exposes a ComfyUI integration with 212 public forks. Two research model weights (IMM and
              TVM) are also published on HuggingFace with a combined download record visible. Architecture specifics
              beyond these public descriptions—model sizes, inference latencies at scale, SLO percentiles, caching
              architecture, and the GPU/compute provider mix for inference—are not disclosed publicly.
