  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, platform aggregators, adjacent alternatives, and status-quo substitutes'
        blocks:
          - type: paragraph
            body: >-
              As of June 2026, the AI video generation competitive field can be divided into five overlapping groups.
              Direct peers competing for the same professional creator, agency, and enterprise buyer include Runway
              (Gen-4.5, multi-model platform) and Google Veo 3.1 (native audio, distributed through Gemini, Google Flow,
              and third-party marketplaces). OpenAI's Sora was a major direct rival until April 26, 2026, when OpenAI
              discontinued its web and app experiences; the Sora API will be discontinued on September 24, 2026,
              materially reshaping the market. Consumer and creator-focused rivals include Pika (2.5 model, mobile
              Pikaffects app, Pika Agent, and MCP integrations targeting viral content formats) and Kling AI (Kuaishou's
              Kling 3.0 with native audio and VIDEO 3.0 Omni, available on both a consumer platform and an enterprise
              API). Adjacent business video alternatives, which serve a different buyer but may capture enterprise L&D
              or training budgets that Luma AI could otherwise grow into, include Synthesia ($18/month+, SOC 2,
              avatar-based, 50,000+ teams) and Colossyan ($27/month+, NEO 2 model, 80+ languages). The status-quo
              substitutes—traditional film production crews, stock video libraries, and manual VFX pipelines—represent
              the largest displacement opportunity but also the hardest procurement conversation. Open-source entrants,
              led by Lightricks' LTX-Video 13B (real-time DiT-based generation at 1216×704 resolution), represent a
              lower-cost self-hosted option that can serve developer-heavy enterprise teams without incurring API fees.
              Adobe Firefly's multi-model marketplace, which distributes Luma AI's Ray3 alongside Runway, Google, and
              OpenAI models, occupies an ambiguous position: it is simultaneously one of Luma AI's two most important
              distribution partners and an aggregator whose brand could eventually capture the buyer relationship across
              the entire competitive set.
