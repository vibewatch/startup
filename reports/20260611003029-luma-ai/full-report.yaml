  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk stack ranking and thesis-break framing
        blocks:
          - type: paragraph
            body: >-
              Luma AI's public risk record orders clearly into five tiers. First is legal and IP risk: the generative AI
              sector has produced over 70 copyright infringement lawsuits, a $1.5 billion settlement in Bartz v.
              Anthropic, active litigation in Disney v. Midjourney and In Re OpenAI, and in Luma's specific case a
              documented June 2024 incident in which Dream Machine reproduced recognizable Monsters Inc. characters
              while the CEO declined to disclose training-data sources. This is not a theoretical risk; it is an active
              and sector-defining legal environment in which Luma has already attracted adverse media coverage for IP
              replication. Second is geopolitical and structural concentration risk: HUMAIN, a PIF (Saudi sovereign
              wealth fund) portfolio company, is simultaneously Luma's largest investor, primary compute supplier via
              Project Halo, and co-developer of Arabic sovereign AI models. Third is capital-intensity risk: the
              2-gigawatt Project Halo supercluster—beginning deployment in Q1 2026 and completing by 2028-29—commits
              Luma to a multi-year infrastructure dependency in a foreign jurisdiction. Fourth is competitive
              commoditization: Google DeepMind's Veo 3.1, Runway Gen-4, Kling AI, and other well-resourced models
              compete in the same segment and can erode Luma's pricing power rapidly. Fifth is enterprise trust and
              operational risk: the company has no disclosed SOC 2 certification, trust center, or third-party training
              data audit, and its no-train enterprise guarantee is unverified. The right investment posture is not
              rejection but conditional conviction: thesis survival requires clearing IP posture, HUMAIN governance
              terms, and enterprise security attestation before the $4 billion valuation is treated as durable.
