      content moderation. Low/Medium = GPU supply constraint. Assessments are qualitative based on public source set
      only.
    claimRefs:
      - CR001
      - CR003
      - CR012
      - CR021
      - CR024
      - CR026
      - CR034
      - CR042
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing how top risks flow into revenue, margin, compute access, customer relationships,
      and valuation for Luma AI.
    data:
      nodes:
        - id: ip-litigation
          label: Training-data IP litigation
        - id: humain-unwind
          label: HUMAIN relationship unwind
        - id: geo-risk
          label: U.S.-Saudi geopolitical risk
        - id: compute-access
          label: Compute access (Project Halo / AWS)
        - id: revenue
          label: Revenue and enterprise pipeline
        - id: trust-gap
          label: Enterprise trust infrastructure gap
        - id: commoditization
          label: Competitive commoditization (Veo / Runway)
        - id: valuation
          label: $4B valuation durability
        - id: cto-bench
          label: Research bench / CTO transition
      edges:
        - from: ip-litigation
          to: revenue
          label: Customer churn / procurement block
        - from: ip-litigation
          to: valuation
          label: Litigation liability haircut
        - from: humain-unwind
          to: compute-access
          label: Project Halo delay or cancellation
        - from: humain-unwind
          to: revenue
          label: HUMAIN Create commercial channel loss
        - from: humain-unwind
          to: valuation
          label: Capital and infrastructure repricing
        - from: geo-risk
          to: humain-unwind
          label: PIF or U.S. export-control trigger
        - from: compute-access
          to: valuation
          label: Training velocity impairment
        - from: trust-gap
          to: revenue
          label: Enterprise procurement blocked
        - from: commoditization
          to: revenue
          label: Pricing pressure and market-share erosion
        - from: commoditization
          to: valuation
          label: Revenue growth rate compression
        - from: cto-bench
          to: compute-access
          label: Research roadmap slowdown
    approximationNotes: >-
      Edge weights are qualitative; edge directions represent plausible causal flows based on public evidence, not
      quantified probability paths.
