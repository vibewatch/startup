      - number: '8.2'
        title: Market context and comparable valuation set
        blocks:
          - type: paragraph
            body: >-
              Two market questions determine whether the $4 billion mark is plausible: is the market large enough to
              support a $4 billion winner, and what does the current comparable set imply about price-to-scale?

              On market size, three analyst publishers produce conflicting estimates whose divergence reflects genuine
              disagreement on market boundaries rather than rounding error. Grand View Research places the AI video
              generator segment at $788.5 million in 2025, growing at 20.3% CAGR to $3.44 billion by 2033, using a
              narrow definition focused on text-to-video and image-to-video tools. Technavio's broader AI video market —
              which includes analytics, monitoring, and avatar tools — estimates $12.98 billion in incremental value by
              2029 at a 35.4% CAGR. Fortune Business Insights anchors a middle estimate focused on creative AI tooling
              specifically. The 2025 market baseline of roughly $700 million to $800 million for the narrowest
              definition means Luma AI at a $4 billion private mark is already priced at roughly 5x the current segment
              TAM — a multiple that is defensible only if you believe Luma captures a large and growing share of an
              expanding market and carries significant platform premium.

              The private comparable set is thin but directional. Runway ML, the closest pure-play competitor, raised
              $141 million at an estimated sub-$1.5 billion valuation in 2023. Stability AI navigated layoffs and
              financial stress in 2024 without a clean comparable round. Midjourney is reportedly profitable but has
              disclosed no valuation. OpenAI's Sora model is a direct competitive threat but is valued as part of
              OpenAI's $157 billion ecosystem, not as a standalone video-generation business. These data points
              collectively suggest that Luma's $4 billion mark is a substantial premium to most disclosed AI video
              comparables — a premium that could be justified by Ray3's reasoning capability advantage, the enterprise
              distribution footprint, and the HUMAIN compute infrastructure, but not by revenue scale alone, since
              revenue is undisclosed.

              Adobe Firefly, as a public company's multi-model marketplace that includes Luma's Ray3, offers a
              read-through: Adobe ($ADBE) trades at approximately 10x revenue with an AI creative tools product mix.
              That multiple applied to Luma's undisclosed revenue base is not directly comparable, but it sets a ceiling
              on AI-creative-tools multiples in the public market and underscores that revenue quality matters more than
              user count at this stage.
