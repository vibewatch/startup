            claimRefs: []
      - number: '7.3'
        title: Partner/HUMAIN concentration, geopolitical, and capital-intensity risks
        blocks:
          - type: paragraph
            body: >-
              The HUMAIN relationship is Luma's most distinctive risk factor because it combines three normally
              independent risk vectors into a single counterparty. First, HUMAIN is the lead investor in the $900M
              Series C, which makes it the single largest external capital provider with governance rights not publicly
              disclosed. Second, HUMAIN is the co-developer of the Project Halo 2-gigawatt compute supercluster in Saudi
              Arabia, which will be Luma's primary training and inference infrastructure from 2026 through at least
              2028-29—a multi-year facility commitment in a foreign jurisdiction. Third, HUMAIN Create is Luma's
              designated commercial vehicle for the MENA region, meaning HUMAIN is simultaneously Luma's biggest
              investor, infrastructure provider, and key customer channel in one of Luma's most publicly promoted growth
              markets. When CNBC confirmed Luma's $4 billion valuation in November 2025, the company's implied future
              revenues included HUMAIN Create as a commercial engine, making the valuation structurally dependent on a
              relationship with a Saudi sovereign entity.

              HUMAIN is a PIF company—a portfolio company of Saudi Arabia's Public Investment Fund. This raises a
              distinct set of geopolitical risks: U.S. export controls on advanced AI compute, potential OFAC sanctions
              scrutiny of sovereign-linked AI deployments, and the broader unpredictability of U.S.-Saudi diplomatic and
              technology-transfer relations. The June 2026 CNBC news feed itself showed breaking coverage of U.S.
              military strikes on Iran and resulting oil-price volatility, illustrating that Middle East geopolitical
              turbulence is not a remote scenario. Project Halo's 2028-29 completion timeline means Luma is making a
              3-year bet on Saudi jurisdiction stability and on HUMAIN's own continued organizational health and PIF
              backing.

              Capital intensity is the third dimension. Training frontier multimodal models requires tens of thousands
              of high-end GPUs operating continuously. The 2-gigawatt supercluster is explicitly described by CEO Jain
              as "one of the largest GPU deployments in the world." Luma has disclosed no revenue, gross margin, or burn
              rate; the $900M round therefore provides limited visibility into how long the company can sustain both its
              model training ambitions and its commercial operations without additional external capital. If the HUMAIN
              relationship were to unwind—whether due to geopolitical events, governance disputes, or commercial
              disappointment—the combined loss of investment, compute, and customer channel would represent a structural
              thesis-break scenario.
