        title: Customer segmentation and adoption surfaces
        blocks:
          - type: paragraph
            body: >-
              Luma AI's customer base spans four primary tiers that differ in buyer type, commitment depth, and evidence
              quality. The consumer/individual tier is the broadest surface: the company claimed 30 million worldwide
              users at the Ray3 launch in September 2025, accessible through self-serve subscription plans ranging from
              Plus ($30/month) to Ultra ($300/month). This tier generates steady subscription revenue but carries the
              highest churn uncertainty because no cohort or renewal data has been disclosed. The enterprise agency tier
              is where the most substantive production proof resides: Serviceplan Group (43+ global locations, 6,500+
              professionals) signed as Luma AI's first globally standardized agency partner in February 2026, followed
              by Publicis Groupe Middle East (3,600+ staff, 8 MENA markets) naming Luma its preferred generative-AI
              creative technology partner. Boutique and independent agencies are also present—Boundless (Johannesburg)
              produced Mazda's first AI-generated commercial in under two weeks using Luma Agents. The
              technology-platform tier anchors the enterprise distribution story: Adobe embedded Ray3 inside Adobe
              Firefly globally at the September 2025 launch, and Amazon Bedrock hosts Luma models for teams in design,
              film production, and marketing. The entertainment and production studio tier emerged in 2026 with Wonder
              Project and Luma launching Innovative Dreams, an AWS-backed production services company whose first
              project is an Amazon MGM Studios commission debuting on Prime Video. A nascent API/developer tier is
              served through the lumaai npm package and the @ai-sdk/luma provider package, indicating a developer-side
              funnel. An education program (for educators and student ambassadors) represents a long-horizon pipeline
              segment with no named institutions yet disclosed. Geographically, the US remains the core market;
              international expansion is being built through London (200 roles planned in 2026) and Riyadh offices.
