              The employer-facing career page also discloses a team size of 150+ with 57 open roles as of the run date,
              and references $1.3B+ in total funding. The Amplify Partners podcast (December 2024) describes Dream
              Machine V2 being trained on 1.2 quintillion tokens — emphasizing training scale, not revenue. The AWS case
              study references Luma training "1,000 times more data than the largest LLMs" using Amazon SageMaker
              HyperPod, a compute dependency that is financially significant but whose cost structure is not disclosed.

              GTM efficiency proxies are thin. Enterprise announcements describe Luma AI as providing "Forward Deployed
              Creatives" who embed with enterprise customers, which suggests a customer-success–heavy land-and-expand
              motion. This adds go-to-market cost but could expand contract values if attach rates improve. The
              Serviceplan Group and Publicis Groupe partnerships both reference company-wide AI workflow deployments
              across thousands of creative professionals, which — if monetized at enterprise plan rates — would
