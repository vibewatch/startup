      - number: '3.3'
        title: Pricing visibility, trust posture, and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Luma AI's public pricing is relatively transparent for consumer and API tiers: Plus at $30/month, Pro at
              $90/month, Ultra at $300/month, with credit-based per-generation costs listed on the pricing page (e.g.,
              100 credits per 5-second 720p Ray3.2 clip). Runway's Standard plan at $12/month annually undercuts Luma
              AI's entry price for individual creators by 60%, though credit allowances and quality tiers differ.
              Synthesia's Starter at $18/month (annual) and Colossyan's Starter at $27/month are priced in a similar
              consumer range but for an entirely different output format (avatar-based talking-head). Google Veo 3.1
              pricing through Gemini and Google Flow is bundled into Google's subscription ecosystem with no standalone
              per-second price card publicly visible from the fetched DeepMind page; Veo 3.1 is available through Luma
              AI's own marketplace at 140 credits per 5-second generation and 280 credits for 10 seconds, giving an
              indirect benchmark. OpenAI's Sora, now discontinued, removes a pricing pressure point that had competed
              directly with Luma AI's consumer tier. On trust and regulatory posture, the strongest adverse signal in
              the public record is a 2024 Verge article documenting Luma AI's Dream Machine generating content
              resembling Disney's Monsters Inc. IP—a case that raised questions about training data transparency and
              content moderation enforcement that Luma CEO Amit Jain attributed to a user-uploaded image rather than
              model generation. The Copyright Alliance's 2025 year-in-review of AI copyright cases catalogs ongoing
              litigation risk across the AI video generation sector. Synthesia, by contrast, holds SOC 2 Type II, ISO
              42001, and GDPR certifications, and Colossyan also markets SOC 2 compliance—creating a visible trust gap
              in the corporate procurement process that Luma AI does not publicly address with equivalent
              certifications. The IP and trust posture gap is potentially material in regulated enterprise segments such
              as advertising, film, and healthcare training, where Luma AI's most important agency launch partners
              operate.
