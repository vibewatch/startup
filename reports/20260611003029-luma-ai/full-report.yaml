      - number: '8.4'
        title: Final diligence asks and investment view
        blocks:
          - type: paragraph
            body: >-
              The remaining due-diligence work to convert Luma AI from interesting to underwritable at the current mark
              clusters into four areas. First, economic disclosure: audited or board-level revenue, gross margin, and
              burn rate are the core missing files. Without them, no investor can know whether the $4 billion mark is a
              5x current-revenue multiple or a notional mark on future expectations. Second, HUMAIN governance: the
              investment agreement, compute pricing terms, exclusivity provisions, and board-level conflict management
              are structural elements that materially affect true enterprise value. A compute arrangement priced well
              above market would compress Luma's effective margins; an exclusivity provision limiting distribution in
              Middle Eastern markets would cap TAM. Third, IP posture: the company has not publicly disclosed training
              data sources, licensing agreements, or a legal strategy for the copyright exposure that produced a $1.5
              billion settlement elsewhere in the sector. Fourth, enterprise trust infrastructure: no SOC 2
              certification, no published DPA, and no third-party training-data audit is publicly available — gaps that
              matter for the enterprise deals with Adobe, AWS, and Dentsu Digital.

              If diligence closes these gaps favorably, the bull case becomes credible and the $4 billion mark is
              supportable. If any of the four areas produces an adverse finding, the appropriate response is either a
              price reset, a structured round with earnouts tied to economic milestones, or withdrawal from the process.
              The current public record is not sufficient to issue a buy at $4 billion. The correct posture is
              research-more, with the specific checklist above as the success criterion for conversion.
            claimRefs:
