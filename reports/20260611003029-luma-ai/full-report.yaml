      - number: '4.3'
        title: Capital adequacy, cost structure, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Luma AI's capital history is detailed in press releases and investor announcements. The company filed a
              Form D with the SEC in August 2023 recording a $25.5 million offering with 20 investors. TechCrunch
              reported in January 2024 that Luma completed a Series B of $43 million led by Andreessen Horowitz,
              bringing cumulative capital to just over $70 million. In November 2025, Luma announced a $900 million
              Series C led by HUMAIN (a Saudi PIF company), with significant participation from AMD Ventures and
              continued backing from Andreessen Horowitz, Amplify Partners, and Matrix Partners, at a reported valuation
              of $4 billion. The careers page now states $1.3B+ total funding, consistent with the Series C plus any
              subsequent funding reported by early 2026.

              The financing structure is unusual: HUMAIN is simultaneously the Series C lead investor, the compute
              infrastructure provider (Project Halo, a 2GW AI supercluster in Saudi Arabia), and a go-to-market partner
              through HUMAIN Create. This three-dimensional relationship creates financial interdependency that is not
              present in a typical VC relationship. Luma AI will become a customer of HUMAIN's compute infrastructure as
              Project Halo is built out starting Q1 2026 — the economic terms of this arrangement (whether compute is
              provided at cost, below-market, or market rate) are not disclosed and represent a material diligence gap
              for modeling burn and gross margin.

              Compute cost is the primary cost driver for a frontier multimodal AI company. Luma trains on 1,000× more
              data than leading LLMs and uses Amazon SageMaker HyperPod as its primary training infrastructure alongside
              its HUMAIN relationship. At the research velocity described — building Dream Machine V2 on 1.2 quintillion
              tokens, followed by Ray3 (described as "more than twice the size of Ray2"), and now Ray3.2 with
              multi-keyframe API — the compute budget is likely the single largest operating line item. No monthly burn
              rate, total compute spend, or gross margin are disclosed. Runway cannot be derived from public sources;
              the $900M Series C provides a substantial nominal cushion, but the burn trajectory of a frontier AI
              company investing at this scale is unknown.
