      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not conflate fresh financing with settled fair value
            body: >-
              The November 2025 Series C is a meaningful positive signal, but sovereign-backed or strategic investors
              can underwrite private information that public investors do not have access to. The $4 billion mark should
              be treated as evidence of informed demand, not as proof of economic fair value, until a data room confirms
              the economics and governance assumptions that would justify the price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV034
              - CV037
          - type: callout
            title: What must be true for the bull case to hold
            body: >-
              The bull case requires: free-to-paid conversion at or above 5% of the 30M user base; Pro or Ultra pricing
              sustaining at $90-300/mo against free-tier competition from Google Veo; HUMAIN compute arrangement priced
              below market; Ray3.2 API winning major studio integrations in 2026; and a clean resolution of the training
              data copyright exposure. None of these have been confirmed publicly.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV016
              - CV021
              - CV034
              - CV040
          - type: callout
            title: The adverse scenario is sector-driven, not just company-specific
            body: >-
              Luma's bear case is amplified by sector forces: Bartz v. Anthropic's $1.5B settlement has established a
              dollar quantum for training-data liability; Google's free-tier Veo distribution compresses consumer
              willingness to pay; and AI market corrections (per CEO Jain's own comment) happen roughly every two years.
              These risks are not Luma-specific but they compound the company-specific disclosure gaps.
            calloutType: risk
            claimRefs:
