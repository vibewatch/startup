      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: IP and copyright uncertainty is the sharpest near-term adoption constraint
            body: >-
              The D.C. Circuit ruling (March 2025) and the Copyright Office's January 2025 conclusion that prompts alone
              cannot establish authorship create a tangible IP risk that enterprise legal teams must resolve before
              approving AI video for branded commercial content. Luma AI's "no training on your content" and
              commercial-use guarantees partially address this, but the question of whether AI-generated output itself
              is protectable as IP for the buyer's brand remains unsettled law as of June 2026. Diligence should verify
              how large enterprise clients are managing this risk in contract terms with Luma AI.
