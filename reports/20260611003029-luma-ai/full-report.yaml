      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Frontier model credibility backed by world-class technical founders
            body: >-
              The combination of Alex Yu's pioneering NeRF research, Jiaming Song's DDIM contributions, and Matthew
              Tancik's NeRF co-authorship gives Luma AI an unusually deep technical founding team relative to most
              generative-video startups. a16z's endorsement of the team as "world-class" with a "rare combination of
              both world class multimodal research and product design" provides independent corroboration of technical
              differentiation.
            calloutType: strength
            claimRefs:
              - CO005
              - CO008
              - CO009
              - CO039
          - type: callout
            title: Copyright and training-data transparency remains an open diligence question
            body: >-
              The June 2024 Monsters Inc. incident documented by The Verge highlighted that Luma AI has not publicly
              disclosed what copyrighted material, if any, its models were trained on. While CEO Jain attributed the
              specific incident to a user uploading copyrighted images, he did not respond to questions about
              training-data composition. Given the active AI copyright litigation landscape tracked by BakerHostetler's
              AI copyright case tracker, this transparency gap represents a material legal and reputational risk that
              diligence should address directly.
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
              - CO038
          - type: callout
            title: Key-person concentration and unconfirmed CTO status
            body: >-
              Amit Jain is the singular public face of Luma AI across all major announcements. Alex Yu's personal
              website describes his Luma AI role in past tense, raising the question of whether the company has already
              experienced a CTO-level departure. Neither risk is currently confirmable from public sources, but both
              warrant direct management interviews and reference checks during formal diligence.
