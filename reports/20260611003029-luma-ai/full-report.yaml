      - number: '8.3'
        title: Bull, base, and bear scenarios with downside triggers
        blocks:
          - type: paragraph
            body: >-
              The wide spread between a plausible bear case and a plausible bull case for Luma reflects the absence of
              economic disclosure, not a disagreement about market opportunity. All three scenarios share the same
              market backdrop: a fast-growing AI video market, strong enterprise partnerships, and a technically
              differentiated product stack. What separates them is whether hidden economics prove software-like or
              thin-margin, and whether the legal and governance overhangs clear.

              The bull case requires three proofs: first, that the 30 million users translate into a meaningful paying
              cohort at Pro or Ultra pricing, generating substantial subscription ARR; second, that Ray3 and Ray3.2's
              positioning as professional-grade tools sustains a pricing premium over Runway ML and free-tier Google Veo
              competition; and third, that HUMAIN's Project Halo compute commitment reduces Luma's marginal training
              cost enough to improve unit economics relative to a market-rate GPU cluster. Under the bull case, the $4
              billion mark is defensible and could grow with a Series D or eventual public offering.

              The base case is more skeptical. Consumer subscriptions convert at typical SaaS rates below 5%; the API
              and enterprise segments grow but face pricing pressure from Google's Veo and Adobe's multi-model
              marketplace strategy; and HUMAIN's structural position as investor-customer-compute-provider introduces
              contractual terms that dilute the apparent economics of the partnership. The $4 billion mark becomes
              defensible only at the top of the base-case range after diligence validates acceptable revenue quality and
              controlled IP exposure.

              The bear case is straightforward: if the Disney v. Midjourney litigation precedent expands Luma's
              copyright exposure, if the HUMAIN compute arrangement is priced at market rates that compress margins, or
              if competitive commoditization from Google Veo 3.1 erodes Luma's pricing premium, the comparable set
              migrates toward Stability AI and Runway-like marks rather than toward a software multiple. CEO Amit Jain
              acknowledged in November 2025 that sector corrections happen roughly every two years and that some AI
              companies are currently overvalued — an unusually candid admission that the $4 billion mark is at risk of
              being reassessed in a correction cycle.
