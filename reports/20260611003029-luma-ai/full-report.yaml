chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and current scale
        blocks:
          - type: paragraph
            body: >-
              Luma AI describes itself as building "unified general intelligence that can generate, understand, and
              operate in the physical world." This mission-level framing positions the company not merely as a video or
              image generation tool but as a long-horizon bet on multimodal artificial general intelligence. In
              practice, the primary commercial products are Dream Machine—a text-to-video and image-to-video
              platform—and the Ray3 reasoning video model, described by the company as the world's first reasoning video
              model capable of creating physically accurate videos, animations, and visuals. Luma also offers Genie
              (text-to-3D), UNI-1 (unified understanding and generation), and an open science effort called the Open
              Physical AI Lab. The platform is accessible via subscription tiers (Plus at $30/month, Pro at $90/month,
              Ultra at $300/month) as well as API and enterprise custom plans, indicating a consumer-plus-enterprise
              go-to-market. As of June 2026, the company's careers page reports more than 30 million users worldwide and
              a team of over 150 people, both of which are company-claimed and unaudited but specific enough to anchor a
              scale narrative. The Dream Machine V2 was trained on approximately 1.2 quintillion tokens according to CEO
              Amit Jain in December 2024, and Luma trains on up to 1,000 times more data than the largest large language
              models per an AWS case study. These scale markers are consistent with the infrastructure investment
              embedded in the Series C and the Project Halo supercluster commitment. Ray3 is embedded within Adobe's
              global products and solutions and is available on Amazon Bedrock, providing two enterprise distribution
              channels that independently corroborate commercial traction beyond the consumer subscription base.
