      - number: '2.2'
        title: TAM, SAM, and contradictory sizing estimates
        blocks:
          - type: paragraph
            body: >-
              Three major analyst publishers have sized the AI video generator or AI video market for the 2025–2026
              period, and their estimates diverge by more than an order of magnitude depending on market boundary
              definition. Grand View Research put the narrowly defined global AI video generator market at $788.5
              million in 2025 and projected $3.44 billion by 2033 at a 20.3% CAGR. Fortune Business Insights arrived at
              a closely aligned $716.8 million base in 2025, projecting $847 million in 2026 and $3.35 billion by 2034
              at an 18.8% CAGR. Technavio, however, forecast the broader AI video market (which includes video
              analytics, processing, and enhancement alongside generation) to grow by $12.98 billion between 2024 and
              2029 at a CAGR of 35.4%—roughly double the growth rate cited by Grand View and Fortune. These are not
              rounding differences; they imply materially different inclusion rules. Grand View and Fortune scope to
              software platforms that generate video from text, PowerPoint, or image inputs. Technavio's scope also
              captures AI-powered video analytics, object detection, quality enhancement, and surveillance tools, a
              category whose enterprise value is largely independent of creative content generation. Regional estimates
              add further contradiction. Fortune attributes 41% of the 2025 market to North America ($293.8 million),
              while Grand View gives Asia Pacific the largest regional share at 31%. Technavio separately estimates
              North America at approximately 45%. These three publishers cannot all be correct without using different
              regional allocation methodologies. The diligence conclusion is therefore that the AI video generator
              market is categorically proven as a multi-hundred-million dollar and growing segment, but no single TAM
              number is reliable enough to anchor a valuation argument. The better sizing discipline is a
              segment-constrained lens: Fortune's large-enterprise segment holds 50.86% of the market in 2026, implying
              roughly $430–480 million of serviceable spend from enterprises alone, excluding the SME and individual
              creator segments where Runway, Pika, and Canva also compete.
            claimRefs:
