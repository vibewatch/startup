      - number: '5.3'
        title: Roadmap, releases, and developer signal
        blocks:
          - type: paragraph
            body: >-
              Luma AI's public release cadence accelerated sharply between 2024 and 2026. Dream Machine launched in June
              2024 with 120-frame video generation in under 120 seconds. Ray2 arrived in January 2025 with a claimed 10×
              compute increase over Ray1 and a new multi-modal architecture. The subsequent twelve months added Camera
              Motion Concepts (March 2025), Camera Angle Concepts (April 2025), Reframe (May 2025), Modify Video (June
              2025), the Modify Video API (June 2025), Ray3 with HDR EXR and reasoning (September 2025), Ray3 Modify
              with character reference (December 2025), Ray3.14 with 4× speed and 3× cost improvement (January 2026),
              the Open Physical AI Lab announcement (June 1, 2026), and Ray3.2 with the first full Ray API surface (June
              9, 2026). This cadence—roughly one meaningful public release every six to eight weeks—indicates a
              productive applied-research team. Developer engagement is real but modest at this stage: the
              ComfyUI-LumaAI-API repository has 22 GitHub stars and 212 forks (the highest fork count in the
              organisation), the lumaai-python SDK has 8 stars and 45 forks, and the new luma-agents-* SDKs (Python,
              Node, Go, TypeScript) were created in June 2026 with minimal stars so far. HuggingFace lists two public
              models: lumaai/imm (Inductive Moment Matching, 585 stars) and lumaai/tvm (Terminal Velocity Matching, 1
              star with 87 forks). The Vercel AI SDK @ai-sdk/luma package exposes Photon image models via a standard npm
              dependency, extending integrations into the broader developer AI tooling ecosystem. The direction of the
              roadmap is clear: from video-generation-only toward multi-modal creative agents, and from proprietary
              closed weights toward a parallel open-science effort in physical AI. No formal public roadmap with dates
              beyond what has been shipped exists, meaning forward roadmap commitments are inferred from research
