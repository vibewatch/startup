  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              Luma AI operates a multi-tier monetization architecture spanning consumer subscriptions, self-serve API
              access, and enterprise relationships. On the consumer side, Dream Machine is available at three publicly
              priced tiers: Plus ($30/month or $300/year), Pro ($90/month or $900/year), and Ultra ($300/month or
              $3,000/year). The credit-based system ties each tier to a usage multiplier — Pro offers 4× the usage of
              Plus and Ultra offers 15× — creating a clear upsell ladder tied to generation volume. Annual billing
              provides a 20% discount and likely improves net revenue retention signals, though actual churn and renewal
              data are not disclosed.

              The API monetization layer is priced per generation and exposed at two tiers. The Build tier
              (pay-as-you-go) prices Ray3.2 text-to-video at $0.15 for 540p/5s up to $3.60 for 1080p/10s, with HDR
              output at 2× SDR pricing and HDR+EXR at 3×. The Scale tier (dedicated capacity) requires a minimum
              four-unit commitment and provides a guaranteed throughput SLA. No Scale pricing is publicly disclosed;
              buyers must contact sales. API pricing is list pricing only; realized average revenue per API call, volume
              discount schedules, and contract structures are not publicly available.

              Enterprise customers access the platform through a Team or Enterprise plan (both priced on contact) that
              adds SSO, usage analytics, custom fine-tuning, and dedicated Forward Deployed Creatives. The company has
              publicly announced enterprise relationships with Serviceplan Group (6,500+ employees, 43+ offices),
              Publicis Groupe Middle East, Dentsu Digital (Japan launch partner), Adobe (first Ray3 integration into
              Adobe Firefly), and AWS/Amazon Bedrock. These announcements describe multi-year strategic partnerships and
              global workflow deployments but do not disclose contract values, seat counts, or revenue contribution. The
              HUMAIN partnership (Series C anchor) combines compute access, model training, and go-to-market, blurring
              the boundary between investor and customer; the financial treatment of this relationship is material but
              undisclosed.
