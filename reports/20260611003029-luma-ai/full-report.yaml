      - number: '7.2'
        title: Legal, IP, and regulatory risks
        blocks:
          - type: paragraph
            body: >-
              The generative AI industry's copyright liability exposure crystallized in 2025 with the Bartz v. Anthropic
              settlement for $1.5 billion, where the court found AI training on copyrighted books was exceedingly
              transformative fair use but that storing pirated copies was not—resulting in approximately $3,000 per
              infringing work. Cases such as Disney v. Midjourney (Central District of California, active) and In Re
              OpenAI Copyright Infringement Litigation (S.D.N.Y., active) confirm this is now a mature litigation
              environment with structured precedent and escalating plaintiff sophistication. Norton Rose Fulbright's
              March 2026 update identifies at least six major AI copyright cases at various stages, with the Supreme
              Court's March 2, 2026 denial of certiorari in Thaler v. Perlmutter confirming that human authorship
              remains a foundational requirement—meaning AI outputs from prompts alone cannot be copyrighted by the
              generator.

              For Luma specifically, The Verge reported in June 2024 that Dream Machine's promotional videos contained a
              recognizable rendition of Mike Wazowski from Pixar's Monsters Inc. Luma CEO Amit Jain attributed the
              output to a user-uploaded image, claimed Luma uses "industry standard programmatic methods" to moderate
              content, but declined to respond to questions about training-data composition. This opacity is a
              litigation-structuring risk: if training data includes copyrighted visual content scraped from the
              internet, Luma's liability profile resembles Anthropic's pre-settlement posture. The U.S. Congress CRS
              Legal Sidebar on generative AI and copyright confirmed that the copyright status of AI training pipelines
              using web-scraped data remains legally unresolved, with ongoing court cases providing progressively more
              plaintiff-favoring roadmaps for litigation.

              On the regulatory side, the U.S. Copyright Office's January 2025 report confirmed that prompts alone do
              not confer copyright ownership on AI outputs, and BakerHostetler's AI copyright case tracker documents
              ongoing cases that set precedent across the entire AI value chain. No public evidence shows Luma AI being
              party to any filed copyright suit as of June 2026, but the sector environment and Luma's own documented IP
              reproduction incident place this risk at the top of the diligence register.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
