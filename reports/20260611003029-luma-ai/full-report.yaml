      - number: '3.4'
        title: Switching costs, moat durability, and commoditization risk
        blocks:
          - type: paragraph
            body: >-
              Luma AI's moat argument rests on three reinforcing advantages: technical differentiation (native HDR/EXR,
              multi-keyframe, 20-second generation), distribution entrenchment (Adobe Firefly global integration, Amazon
              Bedrock availability, 30 million users), and an expanding multi-model marketplace that increases the cost
              of switching away from Dream Machine because the platform simultaneously offers Veo 3.1, Kling Omni, GPT
              Image 2, and Seedance 2.0 alongside Luma's own models. However, the same marketplace logic creates a
              switching-cost paradox: by aggregating competitors inside Dream Machine, Luma AI reduces API churn risk
              but also makes it easier for a buyer to evaluate and ultimately prefer a competitor model without leaving
              the platform, potentially accelerating migration once a superior model emerges. Distribution lock-in
              through Adobe is the strongest durable advantage in the public record: Ray3 is embedded in Adobe Firefly
              globally and listed as one of the "top AI models" alongside Adobe's own Firefly models, Google, OpenAI,
              and Runway—but Adobe treats all providers as interchangeable and could deprioritize Luma AI in its model
              mix if competitive offerings improve. The multi-homing risk is high: Runway offers Veo 3.1 and Kling 3.0
              Pro on its Standard plan, meaning a Runway subscriber can access most of the same models as a Luma AI
              subscriber without switching platforms. Open-source commoditization from models like LTX-Video 13B
              accelerates this risk at the API tier—any enterprise that can self-host a 13B parameter model can
              replicate much of the generation quality at near-zero marginal cost. The market-level tailwind from
              Fortune's $716.8 million 2025 market estimate and Technavio's $12.98 billion incremental growth projection
              through 2029 provides room for multiple winners, but also invites continued entry. The clearest adverse
              signal on moat durability is the IP/copyright transparency gap documented by The Verge and the Copyright
              Alliance's litigation catalog, which create a reputational liability in regulated enterprise procurement
              that competitors with governance certifications can exploit in competitive evaluations.
