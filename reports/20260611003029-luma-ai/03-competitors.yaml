  - id: FP003
    title: Moat / readiness KPIs
    type: kpi
    layout: standard
    summary: >-
      Luma AI's strongest moat signals are its HDR/EXR technical lead and the Adobe/AWS distribution
      channels. The highest risks are Google's ecosystem distribution advantage, Runway's price
      competition at the entry tier, and open-source commoditization from LTX-Video.
    data:
      items:
        - label: Direct peer pressure (Runway)
          value: high
          detail: Runway Gen-4.5 undercuts Luma AI on entry pricing ($12 vs $30/mo) with a comparable multi-model offer
          tone: warning
        - label: Ecosystem distribution threat (Google, Adobe)
          value: high
          detail: Google Veo 3.1 is distributed through Gemini and Flow; Adobe Firefly aggregates all major models including Luma AI
          tone: negative
        - label: HDR/EXR technical differentiation
          value: high
          detail: No other major cloud AI video provider publicly documents equivalent native HDR/EXR output as of June 2026
          tone: positive
        - label: Switching cost depth (API / production pipeline)
          value: medium
          detail: Multi-keyframe, V2V, and EXR pipeline integration create friction; but Runway and Veo are building comparable features
          tone: warning
        - label: IP/copyright regulatory posture
          value: elevated-risk
          detail: 2024 Verge coverage and AI copyright litigation landscape create procurement risk vs. compliance-certified peers (Synthesia ISO 42001, SOC 2)
          tone: negative
        - label: Open-source commoditization risk
          value: medium-high
          detail: LTX-Video 13B real-time generation at 1216x704 enables enterprise self-hosting without API costs
          tone: warning
        - label: Sora discontinuation opportunity
          value: positive
          detail: OpenAI Sora app/web discontinued April 2026; API to end September 2026; API migration demand benefits Luma AI, Runway, and Veo equally
          tone: positive
    approximationNotes: >-
      KPI labels are analytical summaries derived from publicly fetched evidence, not company-reported
      internal metrics. Severity labels (high, medium, elevated-risk) reflect the analyst's reading
      of competitive risk, not a formal risk-scoring methodology.
