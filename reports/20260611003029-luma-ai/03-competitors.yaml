  - id: capability-and-distribution
    title: Capability comparison and distribution strategy
    body: >-
      Luma AI's Ray3.2 differentiates on professional production specifications that are not yet
      publicly replicated by direct peers: native 16-bit HDR generation in ACES2065-1 EXR format,
      up to 16 keyframes per clip for frame-level directorial control, up to 20-second clips at
      1080p, and a video-to-video modification workflow for reshaping existing footage. These
      capabilities are confirmed by the Ray3.2 feature page and the introducing-Ray3.2 launch
      announcement. Runway Gen-4.5 offers a different breadth: its Standard plan includes access
      to third-party models alongside Runway's own Gen-4 and Gen-4.5, plus Veo 3.1 on Runway's
      own marketplace, a built-in Aleph video editor, and Act-Two performance capture—making
      Runway a more integrated production tool at a lower entry price of $12/month versus Luma
      AI's $30/month Plus tier. Google Veo 3.1 adds native audio generation and cinematic
      storytelling targeting filmmakers, and its direct distribution through Gemini and Google
      Flow eliminates the need for an intermediary for Google's existing user base. Kling AI 3.0's
      native audio and multi-modal instruction parsing are now comparable on the audio dimension
      where Luma AI depends on ElevenLabs marketplace integration. On the distribution side, Luma
      AI has built two anchored enterprise channels: Ray3 embedded in Adobe Firefly (global launch,
      September 2025) and availability on Amazon Bedrock. Adobe distributes Ray3 alongside Runway
      and other models inside the same Firefly multi-model interface, creating a two-step
      competitive risk: Luma AI benefits from Adobe's distribution today but may face commoditizing
      pressure as Firefly consolidates buyer loyalty at the platform layer. Synthesia and
      Colossyan operate in a distinct workflow—avatar-based talking-head corporate video—but both
      have now integrated external generative video models (Synthesia integrates Veo 3.1 and
      Sora 2 for 8-second generative clips), expanding their addressable use case toward Luma AI's
      territory at the margin. Open-source LTX-Video 13B, with its real-time generation capability
      at 1216×704 and a range of model sizes (2B distilled to 13B dev), enables self-hosted
      deployment that can undercut API pricing for any enterprise with in-house ML infrastructure.
      Luma AI's ComfyUI integration nodes on GitHub allow it to participate in the developer
      ecosystem alongside Runway, Kling, and open-source models, but the GitHub repository for
      Luma's ComfyUI nodes shows lower community signals than the Lightricks LTX-Video Hugging
      Face model card with its extensive variant lineup.
