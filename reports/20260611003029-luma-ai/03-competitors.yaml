      severity: material
      topic: Kling-strategic-plans
      missingEvidence: >-
        Kling AI's 2026 enterprise pricing, Kuaishou's strategic roadmap for global AI video expansion, and the degree to which Kling's Chinese-market origin affects US and European enterprise procurement are not disclosed on the fetched Kling AI pages.
      whyItMatters: >-
        If Kuaishou is willing to subsidize Kling AI pricing in Western markets, it could compress Luma AI margins without a disclosed pricing signal; geopolitical procurement risk is material but unquantified.
