callouts:
  - calloutType: strength
    title: Native HDR/EXR output is Luma AI's clearest technical wedge
    body: >-
      Ray3.2's native 16-bit HDR generation in ACES2065-1 EXR format is publicly documented and
      not yet matched by other major cloud AI video providers. For film, advertising, and VFX
      post-production buyers, this is a real procurement differentiator—but it requires confirmation
      that actual pipeline integrations (Resolve, Nuke) use the capability in practice.
    claimRefs:
      - CP001
      - CP004
      - CP039
  - calloutType: risk
    title: Adobe Firefly is a distribution partner and an aggregation risk simultaneously
    body: >-
      Luma AI's Ray3 embedding in Adobe Firefly provides global reach today but Adobe distributes
      Runway, Google, and OpenAI models in the same interface, treating all providers as
      interchangeable. Any improvement in a competing model could shift Adobe's model mix without
      requiring a strategic decision.
    claimRefs:
      - CP016
      - CP017
      - CP034
  - calloutType: risk
    title: IP/trust posture is a gap versus compliance-certified competitors
    body: >-
      The 2024 Verge coverage of Monsters Inc. IP in Luma AI's generated content and the broader
      AI copyright litigation landscape create a material diligence burden in regulated enterprise
      procurement. Synthesia's ISO 42001 and SOC 2 Type II certifications are visible trust
      differentiators that Luma AI does not publicly match.
    claimRefs:
      - CP031
      - CP032
      - CP035
      - CP036
  - calloutType: insight
    title: Sora's discontinuation opens an API migration window
    body: >-
      OpenAI's decision to discontinue Sora web/app (April 2026) and API (September 2026) creates
      a near-term migration demand for API customers who built on Sora's endpoint. Luma AI, Runway,
      and Veo all benefit, but the winner will depend on API compatibility, pricing, and quality
      benchmarks for migrating workflows.
    claimRefs:
      - CP014
      - CP015
      - CP040

