  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - moat claim
      - threat
      - severity
      - mitigation/diligence ask
    rows:
      - - Native HDR/EXR professional output sets Luma AI apart in post-production pipelines
        - No other major cloud AI video provider currently advertises equivalent HDR/EXR specs; but Runway or Veo could add HDR in future model iterations
        - High
        - Request independent benchmark comparison of output quality in professional colorist/VFX workflows; ask pipeline partners whether HDR specification is a procurement requirement
      - - Adobe Firefly distribution creates large-scale global reach
        - Adobe treats Luma AI as one of multiple interchangeable providers alongside Runway, Google, and OpenAI; model mix can be rebalanced without Luma AI
        - High
        - Request evidence of contractual exclusivity or preferred-provider terms with Adobe; track whether Runway or Veo gain preferential placement in Firefly over time
      - - Multi-model Dream Machine marketplace locks in platform-level user behavior
        - Runway offers the same competitor models (Veo 3.1, Kling) on its own Standard plan; Luma AI marketplace creates low-friction model comparison that can accelerate churn
        - High
        - Request cohort retention data by entry-point model (Ray3.2 vs. third-party); ask whether users who access third-party models on Dream Machine have higher churn rates
      - - Consumer brand with 30M+ users provides top-of-funnel scale
        - User base is company-claimed and unaudited; 30M users does not directly translate to paid conversion or enterprise revenue
        - Medium
        - Request MAU, paid-conversion rate, and ARPU breakdowns to assess whether scale translates to defensible revenue
      - - API no-train guarantee and enterprise SLA differentiate Scale tier
        - Open-source models like LTX-Video 13B allow enterprises with in-house ML to match generation quality without API fees or data trust concerns
        - High
        - Request evidence of enterprises that evaluated open-source alternatives and chose Luma AI API; ask for self-service vs. managed API split in Scale plan customer base
      - - IP/copyright exposure weaker than compliance-certified competitors
        - 2024 Verge adverse coverage and ongoing AI copyright litigation landscape means regulated enterprise buyers (healthcare, legal, government) may prefer Synthesia or Google Firefly partners with stronger trust postures
        - Medium-High
        - Request Luma AI's data governance and training data licensing documentation; assess whether ISO 42001 or equivalent certification is on the roadmap
    notes: >-
      Severity is an analytical judgement from the retained evidence set, not a company-reported score.
      Each row names a specific diligence artefact needed to convert narrative moat claims into
      verifiable underwriting evidence. Open-source commoditization risk is assessed relative to
      the LTX-Video 13B model's publicly documented capabilities.
