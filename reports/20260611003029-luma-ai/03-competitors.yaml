        Publicly reported revenue, funding round sizes, and user scale for Runway, Pika, and Kling AI as of 2026 are not confirmed by fetched official sources; only indirect signals and prior-year reports are available.
      whyItMatters: >-
        Without revenue or funding comparables, the relative competitive threat of well-funded peers like Runway (Google/NVIDIA/Salesforce backed) and Kling AI (Kuaishou public company) cannot be benchmarked.
