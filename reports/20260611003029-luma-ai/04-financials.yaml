  - id: financial-gaps-and-verdict
    title: Financial gaps and diligence verdict
    body: >-
      Luma AI is a frontier AI company at an early stage of enterprise monetization.
      Consumer demand at 30M+ users and accelerating enterprise partner announcements
      are consistent with real revenue activity across subscription and API channels,
      and the breadth of named enterprise customers (Adobe, Serviceplan Group, Publicis,
      Dentsu Digital, AWS/Bedrock) indicates the enterprise motion is beyond proof-of-concept.
      The $4 billion valuation at Series C implies either strong near-term revenue
      expectations or a technology/optionality premium justified by the World Model thesis
      — the public record cannot distinguish between these interpretations.

      The financial verdict is that revenue quality and margin path cannot be assessed
      from public data. No ARR, run-rate revenue, realized pricing versus list pricing,
      gross margin, net revenue retention, or unit economics have been disclosed. The
      HUMAIN compute relationship introduces a structural cost and revenue dependency
      that is both financially material and opaque. The company's copyright litigation
      exposure (noted in IP tracker databases) is a potential legal cost that could
      affect the income statement. The $900M raise provides nominal capital adequacy,
      but burn rate and runway are unknowable without private financials. Any underwriting
      judgment at the $4B valuation requires private diligence: revenue and ARR with
      recognition policy, gross margin by tier, compute cost schedule and HUMAIN
      economic terms, unit economics (CAC, LTV, churn), and a full cap table.
    claimRefs:
      - CI035
      - CI036
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041
    tableRefs:
      - TI005

