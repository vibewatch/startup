callouts:
  - calloutType: risk
    title: HUMAIN dual-role creates opaque financial interdependency
    body: >-
      HUMAIN is simultaneously the lead Series C investor, the primary compute
      infrastructure provider (Project Halo 2GW supercluster), and a go-to-market
      partner (HUMAIN Create). This three-way relationship means that Luma AI's
      capital adequacy, gross margin, and revenue may all be partially determined
      by the economic terms of a single counterparty relationship. If compute is
      provided below market rate, it could flatter gross margin in financial models;
      if HUMAIN Create revenue is bundled with the investment, it could inflate ARR
      optics. The financial treatment of this relationship is the single largest
      diligence risk in the financials chapter.
    claimRefs:
      - CI030
      - CI031
      - CI032
      - CI033

  - calloutType: risk
    title: Revenue and burn entirely undisclosed for a $4B valuation company
    body: >-
      Luma AI has raised $1.3B+ in total capital and carries a $4B Series C valuation
      but has disclosed no revenue, ARR, gross margin, burn rate, or runway. Consumer
      traction at 30M+ users is real but the paying fraction is unknown. At a frontier
      AI compute intensity (training on 1,000× LLM data volumes), monthly burn likely
      runs in the tens of millions of dollars, making the $900M raise a 1–3 year
      runway depending on monetization velocity — but this cannot be confirmed from
      public sources. Any investment decision at this valuation requires private
      financial disclosure.
    claimRefs:
      - CI035
      - CI036
      - CI037
      - CI038

  - calloutType: strength
    title: Enterprise monetization is diversifying rapidly across major platforms
    body: >-
      Luma AI has secured named enterprise relationships with Adobe (Ray3 in Firefly
      globally), AWS/Amazon Bedrock, Serviceplan Group (first major agency to standardize
      AI for creative work company-wide), Publicis Groupe Middle East, and Dentsu Digital
      Japan. These are not exploratory pilots — the Serviceplan Group partnership
      describes company-wide workflow deployment across 6,500+ professionals and 43+
      locations. Enterprise channel diversification at this scale, if backed by recurring
      contract revenue, would provide meaningful ARR base and distribution leverage.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013

