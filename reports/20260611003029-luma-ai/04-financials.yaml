  - id: traction-and-unit-economics
    title: Traction proxies and unit-economics visibility
    body: >-
      The strongest public traction signal is the user base. Luma's careers page and the
      Ray3 launch announcement both cite 30 million or more users worldwide on Dream Machine.
      The Ray3 launch (September 2025) described the platform as "powers creation for over
      30 million users," confirming this is an active platform figure at the time of a major
      product launch. A prior milestone from January 2024 cited just over 2 million users
      at Series B — implying roughly 15× growth over approximately 20 months if the 30M
      figure is registered accounts, though no distinction between active monthly users,
      registered accounts, and paying subscribers is made publicly. Conversion rate from
      free to paid, average revenue per user, churn, and net revenue retention are all
      private.

      The employer-facing career page also discloses a team size of 150+ with 57 open
      roles as of the run date, and references $1.3B+ in total funding. The Amplify
      Partners podcast (December 2024) describes Dream Machine V2 being trained on 1.2
      quintillion tokens — emphasizing training scale, not revenue. The AWS case study
      references Luma training "1,000 times more data than the largest LLMs" using
      Amazon SageMaker HyperPod, a compute dependency that is financially significant
      but whose cost structure is not disclosed.

      GTM efficiency proxies are thin. Enterprise announcements describe Luma AI as
      providing "Forward Deployed Creatives" who embed with enterprise customers, which
      suggests a customer-success–heavy land-and-expand motion. This adds go-to-market
      cost but could expand contract values if attach rates improve. The Serviceplan Group
      and Publicis Groupe partnerships both reference company-wide AI workflow deployments
      across thousands of creative professionals, which — if monetized at enterprise plan
      rates — would represent meaningful seat-license revenue, but no contract values are
      cited. CAC, LTV, payback period, and sales cycle duration are all unavailable.
    claimRefs:
