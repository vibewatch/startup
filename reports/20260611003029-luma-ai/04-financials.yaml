  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: Total revenue, ARR, and revenue run rate by segment (consumer, API, enterprise)
      whyItMatters: Cannot assess revenue quality, growth trajectory, or valuation multiple without a revenue baseline
      diligencePath: Request audited P&L statements for the last 3 fiscal years and a current ARR bridge by product segment
      relatedQuestionRefs:
        - QI006
        - QI022

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: Gross margin by segment and blended gross margin with COGS detail
      whyItMatters: At frontier AI compute intensity, gross margin could range from deeply negative to 60%+; this range spans investment to distress
      diligencePath: Request COGS breakdown by compute, infrastructure, people, and content acquisition; reconcile to segment gross margins
      relatedQuestionRefs:
        - QI012

    - type: private-evidence-only
      severity: blocking
      topic: burn-runway
      missingEvidence: Monthly burn rate, cash on hand, and runway calculation
      whyItMatters: At this scale of compute investment, burn likely runs in tens of millions per month; $900M raise may provide 1–3 years depending on burn trajectory
      diligencePath: Request CFO-signed cash flow statements and monthly P&L for last 4 quarters; model runway scenario
      relatedQuestionRefs:
        - QI011

    - type: private-evidence-only
      severity: material
      topic: humain-relationship
      missingEvidence: Economic terms of HUMAIN relationship — compute pricing, revenue share for HUMAIN Create, and any below-market concessions in the Series C terms
      whyItMatters: HUMAIN is investor, compute provider, and GTM partner; below-market compute would flatter gross margin; bundled revenue could inflate ARR optics
      diligencePath: Obtain full HUMAIN compute services agreement, HUMAIN Create revenue share terms, and Series C term sheet
      relatedQuestionRefs:
        - QI010
        - QI020

    - type: private-evidence-only
      severity: material
      topic: paying-users
      missingEvidence: Paying subscriber count, tier mix, and free-to-paid conversion rate
      whyItMatters: 30M+ total users does not reveal revenue; even 1% paid conversion at $90 ARPU would imply different revenue than 5% at $30 ARPU
      diligencePath: Request monthly cohort data by subscription tier with churn and upgrade/downgrade rates for last 8 quarters
      relatedQuestionRefs:
        - QI017

    - type: private-evidence-only
      severity: material
      topic: enterprise-contracts
      missingEvidence: Enterprise ACV, seat counts, contract duration, and NRR for Adobe, Serviceplan Group, Publicis MENA, and Dentsu deployments
      whyItMatters: Enterprise revenue quality depends on contract structure; without ACV and renewal data, the revenue base is ununderwritable
      diligencePath: Request ARR bridge by enterprise customer cohort with cohort-level NRR and ACV distribution
      relatedQuestionRefs:
        - QI008

    - type: private-evidence-only
      severity: material
      topic: platform-integration-economics
      missingEvidence: Revenue share or API fee structure for Adobe Firefly and Amazon Bedrock integrations
      whyItMatters: Platform integrations could contribute meaningfully to API revenue if user volumes are high; economic terms determine contribution margin
      diligencePath: Obtain integration contracts; request API revenue contribution by channel
      relatedQuestionRefs:
        - QI009

    - type: private-evidence-only
      severity: minor
      topic: debt
      missingEvidence: Schedule of any debt facilities, convertible notes, or revenue-based financing not on the equity cap table
      whyItMatters: Hidden debt obligations could affect runway and future equity dilution
      diligencePath: Request full cap table and debt schedule as part of legal due diligence
      relatedQuestionRefs:
        - QI024

    - type: missing-source
      severity: minor
      topic: legal-risk
      missingEvidence: Specific litigation filings naming Luma AI in copyright class actions
      whyItMatters: If Luma AI is a named defendant, the financial exposure from settlements or injunctions could be material
      diligencePath: Search PACER for filings naming Luma AI or LumaLabs Inc.; request legal counsel's liability reserve summary
      relatedQuestionRefs:
        - QI025

