      - number: '3.2'
        title: 能力对比与分发策略
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的 Ray3.2 在专业生产规格上形成差异化，而这些规格尚未被直接同业公开复制：原生 16-bit HDR，以 ACES2065-1 EXR 格式生成；每段最多 16
              个关键帧，支持帧级导演控制；最高 1080p、20-second clips；以及用于重塑既有素材的视频到视频修改工作流。这些能力由 Ray3.2 功能页面和 introducing-Ray3.2
              发布公告确认。Runway Gen-4.5 提供另一种广度：其 Standard 方案除 Runway 自有 Gen-4 和 Gen-4.5 外，还可使用第三方模型，并在 Runway 自有市场提供 Veo
              3.1；同时内置 Aleph 视频编辑器和 Act-Two 表演捕捉，使 Runway 以 $12/month 的更低入门价，成为比 Luma AI $30/month Plus
              层级更一体化的制作工具。Google Veo 3.1 增加原生音频生成和面向电影人的电影化叙事；它通过 Gemini 和 Google Flow 直接分发，使 Google 既有用户群不需要中介。Kling AI
              3.0 的原生音频和多模态指令解析，在音频维度上已经可比；Luma AI 在该维度依赖 ElevenLabs 市场集成。分发侧，Luma AI 已搭建两条锚定企业渠道：Ray3 嵌入 Adobe
              Firefly（全球发布，2025 年 9 月），并可在 Amazon Bedrock 使用。Adobe 在同一个 Firefly 多模型界面中同时分发 Ray3、Runway
              和其他模型，带来两步竞争风险：Luma AI 今天受益于 Adobe 分发，但随着 Firefly 在平台层整合买家忠诚度，Luma 可能面临商品化压力。Synthesia 和 Colossyan
              位于不同工作流——基于 avatar 的 talking-head 企业视频——但两者现在都集成了外部生成式视频模型（Synthesia 集成 Veo 3.1 和 Sora 2，用于 8-second
              generative clips），在边缘上把可服务用例推向 Luma AI 的领地。开源 LTX-Video 13B 具备 1216×704 实时生成能力，并有一系列模型规模（2B distilled 到
              13B dev），使拥有内部 ML 基础设施的企业可以自托管部署，从而压低 API 定价。Luma AI 在 GitHub 上的 ComfyUI integration nodes 使其能与
              Runway、Kling 和开源模型一起参与开发者生态，但 Luma 的 ComfyUI nodes 仓库社区信号低于 Lightricks LTX-Video Hugging Face model card
              及其丰富变体阵容。
