      - number: '2.3'
        title: 优先渠道中的买家、用户与付费方细分
        blocks:
          - type: paragraph
            body: >-
              AI 视频生成市场可分为五类买家画像，它们在预算归属、采用触发点和为专业级输出付费意愿上不同。企业创意代理和全球广告网络代表最高价值买家：Serviceplan Group 是欧洲最大独立代理集团，拥有
              6,500 名员工、覆盖 43 个地点，2026 年 2 月与 Luma AI 签约成为其 AI 技术伙伴，明确目标是压缩制作周期并提升多市场营销活动吞吐量。Publicis Groupe Middle East
              同月将 Luma AI 指定为生成式 AI 创意伙伴；Dentsu Digital 于 2025 年 9 月成为 Ray3 在日本唯一启动伙伴。这些交易证明，代理垂直在 2026
              年是活跃且高价值的买家。电影和商业制作工作室是第二类细分，证据包括 Boundless 2026 年 4 月用 Luma Agents 在不到两周内制作出 Mazda 在 South Africa 的首支 AI
              生成广告，以及 Ray3 的原生 HDR 和 16-bit EXR 输出让 AI 生成视频兼容专业后期制作流程。营销和品牌团队代表最大的应用细分（Fortune 称按支出占市场
              33.88%），通常由营销活动或品牌预算支付，CMO 或品牌总监是主要预算所有者。独立创作者和社媒团队是增长最快的应用细分（社媒 CAGR：23.5%），由 Luma 的消费者 Plus 和 Pro
              层级服务。开发者和平台构建者构成第五类：公司通过 Ray3.2 API 将 AI 视频嵌入自有产品，Luma 为生产级工作负载提供带专用容量和延迟 SLA 的 Scale 层级。Amazon Bedrock 和
              Adobe Firefly 是分发渠道，降低了该开发者细分的集成门槛。教育是一个新兴相邻市场：Luma AI 运营正式 Education
              Program，为高校教育者和学生大使提供独立申请流程，目标是降低机构采用摩擦。
