companyProfile:
  summary: >-
    Luma AI 是一家总部位于 Palo Alto 的前沿多模态 AI 公司，由 Amit Jain（CEO）、Alex Yu（前 CTO）和 Alberto Taiuti 于 2021–2022 年共同创立。旗舰产品 Dream
    Machine 视频平台和 Ray3 推理视频模型服务全球 30M+ 用户，覆盖消费者订阅（Plus $30/mo、Pro $90/mo、Ultra $300/mo）和企业 API 渠道。Ray3 已嵌入 Adobe
    全球产品，并可在 Amazon Bedrock 使用；Dentsu Digital 将 Luma 指定为其在日本唯一的 AI 视频合作伙伴。2025 年 11 月，Luma 完成由 HUMAIN——一家 Saudi PIF
    公司——领投的 $900M Series C，投后估值约 $4 billion，累计融资达到 $1.3B+。融资之外，Luma 还宣布 Project Halo，即位于 Saudi Arabia 的 2-gigawatt AI
    超级集群。公司在 2025–2026 年开设 London 和 Riyadh 办公室，并在 CNBC 2026 Disruptor 50 榜单中排名 #35。关键披露缺口包括收入、毛利率、免费转付费转化率和 HUMAIN 治理条款。
