  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险堆栈排序与投资逻辑破裂框架
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的公开风险记录可以清晰排成五层。第一是法律和 IP 风险：生成式 AI 行业已出现 70 多起版权侵权诉讼，Bartz v. Anthropic 达成 $1.5 billion 和解，Disney
              v. Midjourney 和 In Re OpenAI 仍在进行；就 Luma 本身而言，2024 年 6 月已有记录显示 Dream Machine 复现了可识别的 Monsters Inc. 角色，同时
              CEO 拒绝披露训练数据来源。这不是理论风险，而是活跃且定义行业走向的法律环境；Luma 已因 IP 复现受到负面媒体关注。第二是地缘政治和结构性集中风险：HUMAIN 是 PIF（Saudi sovereign
              wealth fund）投资组合公司，同时是 Luma 最大投资者、通过 Project Halo 提供的主要算力供应商，以及阿拉伯主权 AI 模型的共同开发方。第三是资本强度风险：2-gigawatt
              Project Halo 超级集群——2026 年 Q1 开始部署，2028-29 年完成——把 Luma 绑定到位于外国司法辖区的多年基础设施依赖。第四是竞争商品化：Google DeepMind 的 Veo
              3.1、Runway Gen-4、Kling AI 及其他资源充足的模型都在同一细分市场竞争，并可能迅速侵蚀 Luma 的定价权。第五是企业信任和运营风险：公司未披露 SOC 2
              认证、信任中心或第三方训练数据审计，企业不用于训练的保证也未经验证。正确的投资姿态不是否定，而是有条件的信心：在把 $4 billion 估值视为耐久之前，投资逻辑必须先清除 IP 姿态、HUMAIN
              治理条款和企业安全证明三道门槛。
