      - number: '8.4'
        title: 最终尽调问题与投资观点
        blocks:
          - type: paragraph
            body: >-
              要把 Luma AI 从「有趣」推进到可按当前标记承销，剩余尽调集中在四个领域。第一，经济披露：经审计或董事会级别的收入、毛利率和烧钱速度，是核心缺失文件。没有这些，投资者无法知道 $4 billion
              标记是当前收入 5x 倍数，还是押注未来预期的名义标记。第二，HUMAIN
              治理：投资协议、算力定价条款、排他性条款，以及董事会层面的冲突管理，都是会实质影响真实企业价值的结构性元素。若算力安排价格显著高于市场，会压缩 Luma 的有效利润率；若排他性条款限制中东市场分发，则会封顶
              TAM。第三，IP 姿态：公司未公开披露训练数据来源、授权协议，或针对行业其他公司已产生 $1.5 billion 和解的版权风险的法律策略。第四，企业信任基础设施：没有 SOC 2 认证、没有公开
              DPA、没有第三方训练数据审计——这些缺口会影响与 Adobe、AWS 和 Dentsu Digital 的企业交易。

              若尽调能有利地补上这些缺口，乐观情景就变得可信，$4 billion 标记也可支撑。若四个领域中任何一个出现反向发现，合适的回应要么是价格重设，要么是设置与经济里程碑绑定 earnout
              的结构化轮次，要么退出流程。当前公开记录不足以支持在 $4 billion 买入。正确姿态是继续研究，并以上述具体清单作为转化成功标准。
