      - number: '3.3'
        title: 定价可见度、信任姿态与监管风险
        blocks:
          - type: paragraph
            body: >-
              Luma AI 面向消费者和 API 层级的公开定价相对透明：Plus $30/month、Pro $90/month、Ultra $300/month，定价页面列出按 credit 计的单次生成成本（例如，每个
              5-second 720p Ray3.2 clip 需要 100 credits）。Runway 的 Standard 年付方案为 $12/month，较 Luma AI 面向个人创作者的入门价低 60%，但
              credit 配额和质量层级不同。Synthesia 的 Starter 年付 $18/month、Colossyan 的 Starter $27/month，处在相近消费者价格带，但输出格式完全不同（基于
              avatar 的 talking-head）。Google Veo 3.1 通过 Gemini 和 Google Flow 的定价捆绑在 Google 订阅生态中；抓取到的 DeepMind
              页面未公开独立按秒价格卡。Veo 3.1 可在 Luma AI 自有市场使用，5-second generation 需要 140 credits，10 seconds 需要 280
              credits，提供了间接基准。OpenAI 的 Sora 现已停止，移除了曾直接竞争 Luma AI 消费者层级的定价压力点。信任与监管姿态方面，公开记录中最强的反向信号是 The Verge 2024
              年文章，记录 Luma AI 的 Dream Machine 生成了类似 Disney《Monsters Inc.》IP 的内容；该事件引发训练数据透明度和内容审核执行问题，Luma CEO Amit Jain
              将其归因于用户上传图像，而非模型生成。Copyright Alliance 的 2025 年 AI 版权案件年度回顾梳理了 AI 视频生成领域持续存在的诉讼风险。相比之下，Synthesia 拥有 SOC 2
              Type II、ISO 42001 和 GDPR 认证，Colossyan 也营销 SOC 2 合规——这在企业采购流程中形成可见信任缺口，而 Luma AI 没有公开给出同等认证。IP
              和信任姿态缺口在广告、电影和医疗培训等受监管企业细分中可能具有实质性；Luma AI 最重要的代理启动伙伴正是在这些领域运营。
