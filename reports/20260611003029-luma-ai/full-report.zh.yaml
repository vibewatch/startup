      - number: '8.3'
        title: 乐观、基准与悲观情景，以及下行情触发因素
        blocks:
          - type: paragraph
            body: >-
              Luma 的可信悲观情景和可信乐观情景之间差距很大，根源是经济披露缺失，而不是各方对市场机会看法不同。三个情景共享同一市场背景：AI
              视频市场快速增长、企业合作伙伴强劲、产品栈在技术上有差异。真正区分情景的是，隐藏的经济性最终像软件业务，还是薄利业务；法律和治理阴影能否消除。

              乐观情景需要三项证明：第一，30 million 用户能转化为有意义的付费队列，按 Pro 或 Ultra 定价产生可观订阅 ARR；第二，Ray3 和 Ray3.2 作为专业级工具的定位，能够相对 Runway
              ML 和免费层 Google Veo 竞争维持定价溢价；第三，HUMAIN 的 Project Halo 算力承诺能把 Luma 的边际训练成本压低到低于市场价 GPU
              集群，从而改善单位经济模型。在乐观情景下，$4 billion 标记站得住，并可能随 Series D 或最终公开发行继续增长。

              基准情景更谨慎。消费订阅按典型 SaaS 转化率低于 5%；API 和企业分部增长，但面对 Google Veo 和 Adobe 多模型市场策略的定价压力；HUMAIN 作为投资者 - 客户 -
              算力提供方的结构性位置，引入了会稀释合作表观经济性的合同条款。只有在尽调验证收入质量可接受且 IP 风险受控后，$4 billion 标记才在基准情景区间顶部变得可辩护。

              悲观情景很直接：若 Disney v. Midjourney 诉讼先例扩大 Luma 的版权风险，若 HUMAIN 算力安排按市场价定价并压缩利润率，或若 Google Veo 3.1 的竞争商品化侵蚀 Luma
              的定价溢价，可比组就会向 Stability AI 和 Runway 式估值迁移，而不是向软件倍数靠拢。CEO Amit Jain 在 2025 年 11 月承认，行业调整大约每两年发生一次，且部分 AI
              公司当前估值过高——这一罕见坦率的表态说明，$4 billion 标记存在在调整周期中被重估的风险。
