  - id: FE001
    title: 产品架构图 —— 模型与平台栈
    type: stack
    layout: wide
    summary: Luma AI 的产品栈以互联网规模训练基础设施为底座，向上经过模型层（Ray3.2、Ray3.14、Ray3、Uni-1），再分发到平台界面（Dream Machine、API、Bedrock、ComfyUI）。
    data:
      layers:
        - label: 训练基础设施
          detail: >-
            Amazon SageMaker HyperPod 管理 GPU 集群；Dream Machine V2 使用约 1.2 quintillion tokens
            的互联网规模多模态数据；视频、图像、音频和语言数据规模达数十 PB。
        - label: 基础模型层
          detail: >-
            统一联合训练的 transformer 架构；Ray3.2（视频，2026 年 6 月）、Ray3.14（视频，速度 / 成本）、Ray3（推理 + HDR）、Uni-1（统一理解 +
            生成）、Photon/Photon Flash（图像），以及开放在 HuggingFace 上的研究权重 IMM 和 TVM。
        - label: API 与推理层
          detail: >-
            REST API 提供 Build（PAYG）和 Scale（专属、SLA）层级；支持 Python、Node、Go 和 TypeScript SDK；Amazon Bedrock 托管端点；Scale
            层级提供审核和提示词增强。
        - label: 平台分发层
          detail: >-
            Dream Machine（基于浏览器的消费者 / 企业平台，含 Plus、Pro、Ultra、Team、Enterprise 订阅层级）；ComfyUI 自定义节点（212 个 fork）；Vercel AI
            SDK 的 @ai-sdk/luma npm 包；Adobe Firefly 集成（Ray3 首个外部合作伙伴）。
    approximationNotes: 这套栈来自官方产品页、API 文档、AWS 案例研究和 CEO 访谈的外部重构。内部层级边界和推理服务架构没有公开披露。
