    rows:
      - - 训练数据版权诉讼
        - 内容权利人对 Luma AI 提起具名诉讼
        - 任何将 Luma AI 或 Dream Machine 列为版权侵权方的已提交诉状
        - 暂停或重组投资；要求立即评估诉讼并披露训练数据。
      - - HUMAIN 集中关系松动
