  - id: FM001
    title: AI 视频生成市场规模金字塔 — 从 TAM 到估计 SAM
    type: pyramid
    layout: standard
    summary: 从最宽口径的 AI 视频市场定义，到 Luma AI 主要竞争的电影级与专业细分市场，嵌套展示各层边界和规模不确定性。
    data:
      items:
        - label: 最宽口径 AI 视频市场（Technavio 定义）
          value: $12.98B incremental 2024–2029 (35.4% CAGR)
          detail: Technavio 的定义包括 AI 视频分析、处理、监控和生成；CAGR 接近仅生成器估计值的两倍；不能与 GVR / Fortune 口径直接比较。
          tone: neutral
        - label: AI 视频生成器市场（Grand View / Fortune 共识）
          value: $717–789M (2025); $847–946M (2026E)
          detail: >-
            Grand View：2025 年 $788.5M，20.3% CAGR 至 2033 年 $3.44B。Fortune：2025 年 $716.8M，18.8% CAGR 至 2034 年
            $3.35B。两者均覆盖从文本、图像或文档输入生成视频的软件平台。
          tone: neutral
        - label: 大型企业 AI 视频细分（推断 SAM 代理）
          value: ~$430–480M (2026E); Fortune large-enterprise share 50.86%
          detail: 将 Fortune 的大型企业占比应用于其 2026 年估计；代表与 Luma AI 代理商和工作室交易最相关的细分。高度近似；没有直接 SAM 数据。
          tone: neutral
        - label: 电影级与专业 AI 视频（Luma AI 可服务细分）
          value: No authoritative figure; subset of large-enterprise SAM
          detail: >-
            Luma AI 的专业细分（代理商、电影、广告，且要求 HDR/4K）是大型企业 SAM 的进一步子集；无法用公开数据测算；以 Serviceplan、Publicis MENA、Dentsu Digital
            等已披露交易代表。
          tone: neutral
    approximationNotes: 大型企业 SAM 代理把 Fortune 2026 年 50.86% 的大型企业占比应用于 Fortune 的 $847M 2026 年市场估计；这是粗略近似，不是已报告数字。所有数字均为第三方分析师估计，置信度中到低。
