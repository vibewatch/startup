      - number: '2.2'
        title: TAM、SAM 与相互矛盾的规模估算
        blocks:
          - type: paragraph
            body: >-
              三家主要分析机构为 2025–2026 年 AI 视频生成器或 AI 视频市场做过规模测算，但由于市场边界定义不同，估算相差超过一个数量级。Grand View Research 将狭义的全球 AI
              视频生成器市场定为 2025 年 $788.5 million，并预计到 2033 年达到 $3.44 billion，CAGR 为 20.3%。Fortune Business Insights 的 2025
              年基数接近，为 $716.8 million，并预计 2026 年为 $847 million、2034 年为 $3.35 billion，CAGR 为 18.8%。但 Technavio 预测，更广义的 AI
              视频市场（除生成外还包括视频分析、处理和增强）将在 2024 至 2029 年间增长 $12.98 billion，CAGR 为 35.4%——约为 Grand View 和 Fortune
              所引增长率的两倍。这不是四舍五入差异，而是意味着纳入规则实质不同。Grand View 和 Fortune 聚焦从文本、PowerPoint 或图像输入生成视频的软件平台。Technavio 的范围还包括 AI
              驱动的视频分析、目标检测、质量增强和监控工具，而该品类的企业价值很大程度上独立于创意内容生成。区域估算进一步矛盾。Fortune 认为北美占 2025 年市场的 41%（$293.8 million），Grand
              View 则给出亚太最大区域份额 31%。Technavio 另行估计北美约为 45%。若不采用不同的区域分配方法，三家机构不可能同时正确。因此尽调结论是，AI
              视频生成器市场作为一个数亿美元且增长中的细分赛道已经被类别层面证明，但没有任何单一 TAM 数字可靠到足以支撑估值论证。更好的规模纪律是采用受细分约束的视角：Fortune 的大型企业细分在 2026 年占市场
              50.86%，意味着仅企业端可服务支出大约为 $430–480 million，且不包括 Runway、Pika 和 Canva 也参与竞争的 SME 与个人创作者细分。
