    type: matrix
    layout: wide
    summary: 4 × 3 风险数量矩阵，展示 Luma AI 已识别风险落在哪些可能性 - 严重程度单元格。严重 / 高可能性和高严重程度 / 高可能性单元格最密集。
    data:
      columns:
