  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 投资判断从产品和资本证明出发，经过未解决的经济性和结构性治理问题，最终落到继续研究的结论。
    data:
      nodes:
        - id: A
          label: $900M Series C，估值 $4B
          detail: CNBC、Economic Times、Business Wire 均有佐证。
          tone: positive
        - id: B
          label: Ray3/3.2 + 企业证明
          detail: Adobe 全球嵌入、Amazon Bedrock、Dentsu 日本唯一合作伙伴、30M+ 用户。
          tone: positive
        - id: C
          label: AI 视频市场增长
          detail: 从 $788M（2025 年）到 $3.44B（2033 年），CAGR 为 20%；企业细分价值最高。
          tone: positive
        - id: D
          label: 收入 / 经济性测试
          detail: 财务披露为零 —— 没有公开 ARR、利润率或转化率。
          tone: risk
        - id: E
          label: HUMAIN 治理测试
          detail: 同一实体同时是投资方、算力提供方和商业伙伴；条款未披露。
          tone: risk
        - id: F
          label: 版权 / IP 测试
          detail: Bartz $1.5B 和解、Disney v. Midjourney 未决、2024 年 6 月 IP 事件。
          tone: risk
        - id: G
          label: 继续研究 / 估值偏紧
          detail: 公开记录支持保持兴趣，但没有数据室材料，无法按 $4B 承销。
          tone: risk
      edges:
        - from: A
          to: B
          label: 确认需求
        - from: B
          to: C
          label: 扩展到
        - from: C
          to: D
          label: 需要收入证明
        - from: D
          to: E
          label: 再加治理清晰度
        - from: E
          to: F
          label: 再加 IP 解决
        - from: F
          to: G
          label: 直到三项都清除
    claimRefs:
      - CV001
      - CV002
      - CV012
      - CV017
      - CV031
      - CV034
      - CV041
  - id: FV002
    title: 估值对经济性情景的敏感性
    type: bar
    layout: wide
    summary: Luma AI 的隐含公允价值在 $1B 到 $6B+ 之间摆动，取决于隐藏经济性最终是薄利、可接受，还是接近软件模式。
    data:
      items:
        - label: Stability AI 式困境情景
          value: 1
          detail: 如果版权责任具有实质性，且竞争定价崩塌，结果会类似 Stability AI。
          tone: risk
        - label: Runway 式可比下限
          value: 1.5
          detail: 对齐 Runway ML 最后已知的约 $1.5B 私募估值；对应薄利或中介型经济性。
          tone: risk
        - label: 熊市情景上限
          value: 2
          detail: 如果经济性偏薄但公司顶住竞争压力，这是熊市情景上界。
          tone: neutral
        - label: 基准情景下限
          value: 2.5
          detail: 需要尽调确认收入质量可接受，且 IP 敞口受控。
          tone: neutral
        - label: 当前轮次参考
          value: 4
          detail: 2025 年 11 月私募估值；需要数据室确认后，才能作为公允价值看待。
          tone: neutral
        - label: 软件经济性的牛市情景
          value: 5.5
          detail: 需要强劲免费转付费、HUMAIN 算力优势和干净的版权姿态。
          tone: positive
    claimRefs:
      - CV002
      - CV025
      - CV027
      - CV029
      - CV037
      - CV041
      - CV046
  - id: FV003
    title: 各情景估值与回报区间
    type: range
    layout: standard
    summary: 公开证据给出的区间很宽，因为缺失的收入和治理数据足以让公允价值带从熊市到牛市移动 3-4x。
    data:
      items:
        - label: 熊市
          low: 1
          mid: 1.5
          high: 2
          displayValue: $1.0B-$2.0B
          detail: 版权责任扩大，HUMAIN 条款摊薄，Veo 免费层侵蚀定价。
          tone: risk
        - label: 基准
          low: 2.5
          mid: 3.2
          high: 4
          displayValue: $2.5B-$4.0B
          detail: 经济性可接受；HUMAIN 中性；版权可控；存在一定竞争压力。
          tone: neutral
        - label: 牛市
          low: 4.5
          mid: 5
          high: 6
          displayValue: $4.5B-$6.0B
          detail: 确认软件式经济性；HUMAIN 算力优势；版权姿态清晰；Ray3.2 API 胜出。
          tone: positive
        - label: 理想进入区间
          low: 2.5
          mid: 3
          high: 3.5
          displayValue: $2.5B-$3.5B
          detail: 在该区间内，投资者能因当前披露缺口和下行情景获得更充分补偿。
          tone: positive
    claimRefs:
      - CV002
      - CV025
      - CV029
      - CV037
      - CV040
      - CV041
      - CV046
  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: wide
    summary: 这是当前 $4 billion 估值下，承销 Luma AI 时最该驱动决策的六项关键投资指标。
    data:
      items:
        - label: 上轮估值
          value: $4B (Nov 2025)
          detail: 三家独立媒体佐证。参考估值，不等于已确认公允价值。
          tone: neutral
        - label: 累计融资额
          value: $1.3B+
          detail: 招聘页面自报；相对未披露收入，显示资本强度较高。
          tone: neutral
        - label: 用户规模
          value: 30M+ worldwide users
          detail: 公司在招聘页面声称。免费 / 付费拆分未披露。
          tone: positive
        - label: 收入指标
          value: Undisclosed
          detail: 公开记录中没有 ARR、MRR、抽成率、毛利率或 burn rate。
          tone: risk
        - label: IP / 法律姿态
          value: Unresolved
          detail: 行业 $1.5B 和解、2024 年 6 月 IP 事件、无训练数据披露。
          tone: risk
        - label: HUMAIN 治理
          value: Undisclosed terms
          detail: 同时是投资方 + 算力提供方 + 客户；条款未公开。
          tone: risk
        - label: 企业分发证明
          value: Adobe, AWS, Dentsu Digital confirmed
          detail: 已公开确认三大企业分发渠道，但没有收入金额。
          tone: positive
    claimRefs:
