  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 指标或最近估值
      - 与 Luma 的相关性
      - 局限
    rows:
      - - Luma AI（当前轮）
        - 私有 — 最新轮
        - $4B 投后估值；$900M Series C；累计融资 $1.3B+
        - 直接标的公司；提供当前价格发现锚点
        - 未披露 ARR、利润率或优先股堆叠；仅凭公开经济性无法验证估值。
      - - Runway ML
        - 私有 — 最近已知估值
        - 估计估值 ~$1.5B；2023 年融资 $141M；自助订阅模式
        - 最接近的 AI 视频纯标的；同样有 B2C 和 API 渠道
        - Luma 的 $4B 估值意味着相对 Runway 最近已知价格约 ~2.7x 溢价；溢价需要产品和分发证据支撑。
      - - Stability AI
        - 私有 — 承压
        - 2024 年裁员并承受财务压力；估值从 2023 年 $4B 峰值压缩
        - 反向可比，显示生成式 AI 估值下行可以很快
        - 模型（扩散图像）和赛道不同；其财务困境不能直接类比 Luma 获得资金支持的状态。
      - - OpenAI（Sora）
        - 私有 — 生态可比
        - OpenAI 2025 年估值 $157B+；Sora 视频模型是直接竞争威胁，但未单独估值
        - 为已有收入的规模化 AI 模型平台估值设定上限
        - OpenAI 有已确认收入和多产品组合；无法单独抽出 Sora 作为可比对象。
      - - Adobe Firefly / ADBE
        - 上市 — 将 Luma 整合为分发伙伴
        - Adobe 交易约为 10x 收入；Firefly 是分发 Ray3 的 AI 创意多模型市场
        - 提供规模化 AI 创意工具的公开市场穿透读数
        - Adobe 是成熟盈利公司；相对早期初创公司倍数压缩属预期之内，该比较仅具方向性。
      - - AI 视频市场 TAM（GVR 2025）
        - 分析师市场数据
        - 2025 年 $788.5M；预计到 2033 年达 $3.44B，CAGR 20.3%
        - 界定 Luma 必须从中增长、才能匹配估值的可服务收入池
        - Luma $4B 估值已是 2025 年窄口径细分 TAM 的 5x；需要市场份额主导和品类扩张才能说得通。
    notes: 倍数和估值是基于已披露轮次数据与已发布分析师估计得出的近似穿透读数。Runway ML 估值来自已报道融资轮的估计，不是已确认投后估值。Adobe 倍数仅为指示性、方向性参考。
    enumerationScope:
