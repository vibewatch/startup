  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Luma AI 采用多层变现架构，覆盖消费者订阅、自助 API 访问和企业关系。消费者侧，Dream Machine 提供三个公开定价层级：Plus（$30/month 或
              $300/year）、Pro（$90/month 或 $900/year）和 Ultra（$300/month 或 $3,000/year）。基于 credit 的系统将每个层级与使用倍数绑定——Pro 提供
              Plus 的 4× 用量，Ultra 提供 15×——形成一条与生成量挂钩的清晰增购阶梯。年付提供 20% 折扣，可能改善净收入留存信号，但实际流失和续约数据未披露。

              API 变现层按次生成计费，并公开为两个层级。Build 层（pay-as-you-go）中，Ray3.2 文生视频价格从 540p/5s 的 $0.15 到 1080p/10s 的 $3.60 不等；HDR
              输出为 SDR 价格的 2×，HDR+EXR 为 3×。Scale 层（专用容量）要求至少承诺四个 unit，并提供有保障的吞吐量 SLA。Scale 定价未公开披露；买方必须联系销售。API 定价只是标价；每次
              API 调用的实际平均收入、量折计划和合同结构都未公开。

              企业客户通过 Team 或 Enterprise 方案访问平台（两者均需联系定价），额外获得 SSO、使用分析、定制微调和专属 Forward Deployed Creatives。公司公开宣布的企业关系包括
              Serviceplan Group（6,500+ 员工、43+ 办公室）、Publicis Groupe Middle East、Dentsu Digital（日本启动伙伴）、Adobe（Ray3 首次集成进
              Adobe Firefly）以及 AWS/Amazon Bedrock。这些公告描述了多年战略合作和全球工作流部署，但未披露合同金额、席位数或收入贡献。HUMAIN 合作（Series C
              锚定方）结合算力访问、模型训练和 GTM，模糊了投资人与客户之间的边界；这段关系的财务处理很重要，但未披露。
