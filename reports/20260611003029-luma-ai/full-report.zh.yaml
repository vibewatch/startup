  - id: FM004
    title: AI 视频生成采用漏斗 — 从需求触发到生产部署
    type: funnel
    layout: standard
    summary: 企业采用 AI 视频会从需求触发走过五个阶段，最终进入平台集成；最长延迟出现在法律 / IP 审查和多利益相关方签批。
    data:
      items:
        - label: 需求触发与认知
          value: 100
          detail: 视频占移动互联网流量 >65%；制作团队面临产量 / 成本瓶颈；竞争对手采用 AI（如 Serviceplan Group）会触发同业评估。
          tone: neutral
        - label: 试用与模型评估
          value: 70
          detail: Luma 提供基于积分的按生成付费 API（Build 计划）和消费者层级；评估者会拿输出质量与 Runway、Kling AI、Pika 比较，切换成本低且没有最低承诺。
          tone: neutral
        - label: 法律与 IP 审查
          value: 50
          detail: D.C. Circuit（2025 年 3 月）和 Copyright Office（2025 年 1 月）裁定之后，企业法务团队必须核验 Luma 的商业使用保证和不使用客户内容训练政策，才会批准生产规模部署。
          tone: neutral
        - label: 付费订阅或企业合同
          value: 30
          detail: 从免费 / 试用转付费，需要 CMO 或代理商运营签批；企业合同包括 Forward Deployed Creatives 提供上线支持。
          tone: positive
        - label: 平台与流水线集成
          value: 15
          detail: 全量部署通过 Adobe Firefly（自 2025 年 9 月全球可用）、Amazon Bedrock，或带专用容量单元和 SLA 的直接 API，把 Luma 模型接入既有制作流水线。
          tone: positive
