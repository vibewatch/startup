      - number: '7.3'
        title: 合作伙伴 / HUMAIN 集中、地缘政治与资本强度风险
        blocks:
          - type: paragraph
            body: >-
              HUMAIN 关系是 Luma 最独特的风险因素，因为它把通常独立的三条风险向量合并到一个交易对手身上。第一，HUMAIN 是 $900M Series C
              的领投方，因此是单一最大外部资本提供方，但治理权利未公开披露。第二，HUMAIN 是 Saudi Arabia 的 Project Halo 2-gigawatt 算力超级集群共同开发方；从 2026 年到至少
              2028-29 年，它将成为 Luma 的主要训练和推理基础设施——这是位于外国司法辖区的多年设施承诺。第三，HUMAIN Create 是 Luma 在 MENA 地区指定的商业载体，意味着 HUMAIN 在
              Luma 最公开宣传的增长市场之一，同时充当最大投资者、基础设施提供方和关键客户渠道。CNBC 在 2025 年 11 月确认 Luma 的 $4 billion 估值时，公司隐含的未来收入包含 HUMAIN
              Create 这一商业引擎，使估值在结构上依赖与 Saudi 主权实体的关系。

              HUMAIN 是一家 PIF 公司——Saudi Arabia Public Investment Fund 的投资组合公司。这带来一组独立的地缘政治风险：美国对先进 AI 算力的出口管制、OFAC 对主权关联
              AI 部署的潜在制裁审查，以及美沙外交和技术转移关系本身的不确定性。2026 年 6 月 CNBC 新闻流本身就出现了美国对 Iran 军事打击及由此引发的油价波动报道，说明 Middle East
              地缘动荡并非遥远情景。Project Halo 的 2028-29 年完工时间线意味着，Luma 正在对 Saudi 司法辖区稳定性、HUMAIN 自身组织健康和 PIF 持续支持押下 3 年赌注。

              资本强度是第三个维度。训练前沿多模态模型需要数以万计高端 GPU 持续运行。CEO Jain 明确将 2-gigawatt 超级集群称为「全球最大 GPU 部署之一」。Luma
              未披露收入、毛利率或烧钱速度；因此，$900M 轮融资只能有限说明公司能在没有额外外部资本的情况下，同时支撑模型训练野心和商业运营多久。若 HUMAIN
              关系解除——无论因为地缘政治事件、治理争议还是商业失望——投资、算力和客户渠道同时流失，将构成结构性的投资逻辑破裂情景。
