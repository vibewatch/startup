      - number: '7.4'
        title: 运营、竞争与执行风险
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的运营风险集中在三处：企业信任基础设施缺口、竞争商品化压力，以及仍然较小团队的规模化执行。企业信任方面，公司自己的企业页面声称不会用客户内容训练模型——这是强卖点——但该保证仅由公司声称。到
              2026 年 6 月，公开渠道未提到 SOC 2 Type II 认证、ISO 27001、信任中心或第三方审计。对金融服务、医疗、法律等高度监管行业的企业客户而言，这一缺口是采购阻断项；任何读过行业 IP
              诉讼版图的客户，也会把缺少训练数据卡视为可信度问题。企业 API 的 Scale 层提供专属容量和有保障的 SLA，但定价仅按需提供，阻碍了透明的竞争评估。

              竞争商品化正在加速。Google DeepMind 的 Veo 3.1 是由全球最大 AI 研究组织支持、正在积极推广的视频生成模型；Runway 的 Gen-4 和 Gen-4 Turbo 起价
              $12/month（入门版），在消费端和专业使用场景上直接竞争。OpenAI 于 2026 年 4 月停用 Sora——这一进展移除了一个竞争者，但也说明，即便资源充足的视频 AI
              项目，若模型质量或商业动能不足，也会被关闭。Luma CEO Jain 在 2025 年 11 月告诉 CNBC，Ray3 基准高于 Sora 2，约与 Veo 3 同一水平；这一定位是正面的，但也确认 Luma
              并非遥遥领先，和超大规模云厂商达到基准持平就是当前天花板。随着 Google、Microsoft 和 Meta 以相当或更大规模投入算力资源，Luma 维持任何基准优势的窗口可能很窄。

              一个 150+ 人团队同时服务 30M+ 用户并推进多城市扩张（Palo Alto、London、Riyadh），执行风险真实存在。CNBC Disruptor 50 在 2026 年 5 月将 Luma 排在
              #35，反映了广泛的竞争认可，但也把它置于拥挤的竞争梯队。计划中的 London 办公室（2026 年 200 个岗位）和 Riyadh 办公室要求公司同时在两个海外市场招聘、合规并推进客户侧爬坡。公司未披露
              ARR、流失、企业合同金额或任何可用来跟踪商业执行质量相对投入资本的财务指标。
