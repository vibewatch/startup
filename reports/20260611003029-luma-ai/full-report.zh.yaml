      - number: '7.2'
        title: 法律、IP 与监管风险
        blocks:
          - type: paragraph
            body: >-
              生成式 AI 行业的版权责任风险在 2025 年因 Bartz v. Anthropic 和解而具象化，金额达 $1.5 billion。法院认定，用受版权保护书籍训练 AI
              属于高度转换性的合理使用，但存储盗版副本不属于合理使用——结果约为每件侵权作品 $3,000。Disney v. Midjourney（Central District of California，进行中）和
              In Re OpenAI Copyright Infringement Litigation（S.D.N.Y.，进行中）等案件确认，诉讼环境已成熟，先例结构更清晰，原告专业度也在升级。Norton Rose
              Fulbright 2026 年 3 月更新指出，至少六起主要 AI 版权案件处在不同阶段；Supreme Court 于 2026 年 3 月 2 日拒绝受理 Thaler v. Perlmutter
              的上诉，也确认了人类作者身份仍是基础要求——也就是说，仅由提示词生成的 AI 输出，生成者无法获得版权。

              对 Luma 具体而言，The Verge 在 2024 年 6 月报道称，Dream Machine 的宣传视频包含 Pixar《Monsters Inc.》中 Mike Wazowski
              的可识别再现。Luma CEO Amit Jain 将输出归因于用户上传图像，称 Luma
              使用「行业标准的程序化方法」审核内容，但拒绝回应训练数据构成问题。这种不透明构成诉讼结构风险：若训练数据包含从互联网抓取的受版权保护视觉内容，Luma 的责任画像就类似 Anthropic 和解前的姿态。U.S.
              Congress CRS 关于生成式 AI 与版权的 Legal Sidebar 确认，使用网页抓取数据的 AI 训练管线，其版权状态在法律上仍未解决，正在进行的法院案件正为原告提供越来越清晰的诉讼路线图。

              监管侧，U.S. Copyright Office 2025 年 1 月报告确认，单靠提示词不会赋予 AI 输出的版权所有权；BakerHostetler 的 AI 版权案件追踪器记录了正在为整个 AI
              价值链树立先例的持续案件。公开证据显示，截至 2026 年 6 月，Luma AI 尚未成为任何已提交版权诉讼的当事方；但行业环境叠加 Luma 自身已记录的 IP 复现事件，使该风险位居尽调登记册首位。
