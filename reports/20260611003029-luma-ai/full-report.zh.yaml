      - number: '2.4'
        title: 增长驱动、采用约束与竞争压力
        blocks:
          - type: paragraph
            body: >-
              AI 视频生成需求建立在三项结构性顺风之上。第一，NTIA 数据显示视频占全球移动互联网流量超过 65%，持续制造制作瓶颈：品牌和创作者需要的视频量超过传统方法能高效供给的上限，而 AI
              显著降低制作时间和成本。第二，虚拟网红和合成代言人兴起，使品牌无需制作开销也能创建 24/7 数字代表，把 AI 生成视频的用例从单纯内容替代扩展出去。第三，Fortune Business Insights 和
              Grand View Research 均将 SME 采用识别为最快结构性增长向量（SME 预计 CAGR 为 21.1%，整体为 18.8%），驱动力是小团队可以用消费者级价格获得专业级输出。2026
              年的首要采用约束是知识产权和版权不确定性。美国 D.C. Circuit Court of Appeals 于 2025 年 3 月确认，Copyright Act 要求版权保护必须有人类作者，由此确立纯 AI
              生成内容不能获得版权。美国 Copyright Office 进一步在 2025 年 1 月得出结论：仅有 prompt
              不足以提供足够的人类创造性控制来确立作者身份。对广告、娱乐和品牌内容领域的企业买家——Luma AI 最高价值细分——而言，这些裁定形成实质 IP 来源风险，法务团队必须先清除该风险，才能批准生产级 AI
              视频部署。司法辖区之间的监管碎片化又增加摩擦：EU AI Act、不断演进的 deepfake 标注要求，以及各国不同的内容真实性法律，都要求持续合规监测。竞争压力也在加剧。Google DeepMind 将
              Veo 3.1 定位为带音频的电影级视频模型，可通过 Adobe Firefly 和 Google 自有平台使用。Kling AI（Kuaishou）面向全球提供 Kling 3.0 和 Kling
              Omni，并具备有竞争力的 credit 定价。Pika AI 提供不断扩展的短视频和 agent 栈。RunwayML 的 Standard 方案起价 $12/month，明显低于 Luma
              的消费者入门价。OpenAI 于 2026 年 4 月停止 Sora，移除了一个资金充足的在位竞争者，对剩余平台构成显著的短期顺风。Adobe Firefly 聚合多个 AI 视频模型，包括 Veo
              3.1、Kling AI 和 Luma Ray3.2，使 Adobe 同时成为分发伙伴和竞争性聚合器。Stability AI
              继续推进开放权重音频生成，显示更广泛的生成式媒体生态仍在扩张。最大的未解商业缺口是，Luma AI 没有任何公开收入、合同金额或续约率数据；缺少这些数据，广泛市场采用能否转化为商业规模，无法独立验证。
