      - number: '1.2'
        title: 创始团队、领导梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Luma AI 由 Amit Jain（CEO）、Alex Yu（前 CTO）和 Alberto Taiuti 联合创立，三人的背景分别覆盖 Apple 硬件与计算机视觉、UC Berkeley AI
              研究和自动驾驶系统，互补性强。Amit Jain 在创立 Luma 前负责 Apple Vision Pro 多媒体体验开发，直接经历过消费硬件、计算机视觉和创作工具的交叉地带。Alex Yu 在 UC
              Berkeley 发表过 NeRF 3D 渲染的开创性研究；a16z 将 Luma 核心多模态模型能力归功于他，认为这是公司技术差异化的来源。Alberto Taiuti 在创立公司前曾在 Apple 从事
              AR/VR 工作，并在 Skydio 担任 Senior Autonomy Software Engineer。公开记录中的一个实质性信号是，Alex Yu 个人网站用过去时描述其 Luma AI
              角色（「我曾是联合创始人兼 CTO」），由此引出关键人物是否已离任的问题；截至 2026 年 6 月，官方沟通既未确认也未否认。创始人之外的运营班底只部分可见：官方新闻材料将 Caroline Ingeborn
              列为 COO；Jiaming Song 曾在 NVIDIA 领导 DDIM 扩散模型基础工作，现任 Chief Scientist；Neural Radiance Fields 共同作者 Matthew
              Tancik 负责应用研究；Jason Day 于 2025 年 12 月加入，担任 Head of EMEA。治理透明度有限。a16z 的 Anjney Midha 在其公开资料中列明自己担任 Luma AI
              董事。公开来源包中未识别到完整董事会名单、独立董事名单或 Series C 后治理权利披露。关键人物集中度高：Amit Jain
              是所有融资轮次和多数重大产品发布中唯一稳定的公开叙事者，这构成依赖风险，标准尽调需要通过完整领导力评估来处理。
