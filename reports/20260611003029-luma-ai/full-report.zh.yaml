  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的商业产品围绕 Dream Machine 搭建。Dream Machine
              是一个基于浏览器的创意平台，把文生视频、图生视频、视频转视频、图像生成和音频工具放在同一个订阅与积分计费界面下。底层模型族包括 Ray3.2（2026 年 6 月，当前旗舰）、Ray3.14（2026 年 1
              月，速度 / 成本优化版本，比 Ray3 快 4×、便宜 3×），以及 Ray3（2025 年 9 月，首个支持原生 HDR ACES EXR 输出的推理视频模型）。每一代都瞄准专业创意管线：原生 1080p
              输出、最长 20 秒片段、多关键帧导演控制，以及可直接接入 Resolve 和 Nuke 后期制作流程的 EXR 导出。图像生成界面由 Uni-1 支撑，这是 Luma 在发布 Ray3.2
              时同步宣布的首个统一理解与生成模型；Photon/Photon Flash 也通过 @ai-sdk/luma npm 包和 Vercel AI SDK 提供。名为 Genie 的文生 3D 模型在 Series
              B（2024 年 1 月）时发布，产品线仍有引用，但当前主导航不再突出。Open Physical AI Lab（2026 年 6
              月）把研究路线延伸到开放科学框架下的机器人世界模型泛化。企业访问权限增加了自定义微调、SSO、共享团队积分、使用分析、专属 Forward Deployed
              Creatives，以及不用于训练的保证。产品宽度是真实的——官方页面、更新日志和新闻公告都能佐证各个模块——但公开的操作者级文档深度差异很大：视频生成栈证据充分，较新的 Uni-1 和 Physical AI
              Lab 计划则披露较少。
