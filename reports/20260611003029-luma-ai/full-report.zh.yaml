      - number: '1.4'
        title: 公开里程碑、扩张与反向信号
        blocks:
          - type: paragraph
            body: >-
              公开记录支撑的故事是：公司从 2021 年的 3D 智能手机捕捉应用，演进为到 2025–2026 年已与大型工作室和广告代理建立企业合作的多模态 AI 平台。公司创立后很快推出智能手机 3D 捕捉应用，随后在
              2023 年 11 月推出 Genie，这是首个大规模公开发布的生成式 3D 模型，前四周吸引 100,000 名用户。2024 年 1 月 Series B 与 2024 年 6 月 Dream Machine
              视频平台发布，标志着公司从 3D 捕捉转向文生视频生成。Dream Machine 发布伴随一次反向事件：The Verge 2024 年 6 月报道称，用户利用该平台生成了带有
              Pixar/Disney《Monsters Inc.》角色的视频，立即引发版权、训练数据透明度和内容审核担忧。CEO Jain 回应称，Monsters Inc.
              角色出现是因为用户上传了受版权保护的源素材，上传受版权保护内容违反 Luma 服务条款；但 Luma 未回应其训练数据是否包含版权材料的问题。该事件是保留来源包中最实质的公开反向信号；考虑到
              BakerHostetler 的 AI copyright case tracker 等法律分析机构仍在跟踪更广泛的 AI 版权诉讼，这仍是活跃尽调问题。2025 年 4 月 Ray2 集成进 Adobe
              Firefly、2025 年 5 月 HUMAIN 合作、2025 年 11 月 Series C、2025 年 12 月 London 办公室开业、2026 年 2 月 Riyadh 办公室和 Publicis
              Groupe MENA 合作，共同构成清晰的加速轨迹。2026 年 5 月 CNBC Disruptor 50 排名第 35 位，增加了第三方认可标记。主要缺口包括：（a）无公开收入或 ARR
              披露；（b）Alex Yu 当前 CTO 状态不确定；（c）无董事会构成或治理结构披露；（d）Project Halo 的最终规模和时间表仍取决于 HUMAIN 执行。
