      - number: '5.2'
        title: 架构、运行栈与 API / 部署
        blocks:
          - type: paragraph
            body: >-
              核心生成架构是一个 transformer 模型，在视频、图像、音频和语言等多模态数据上训练。CEO 称其规模约为最大大语言模型所用数据的 1,000 倍，Dream Machine V2 总计 1.2
              quintillion tokens。训练跑在 Amazon SageMaker HyperPod 上，后者提供 GPU 集群管理、网络和存储，支撑这一数据量。成品模型通过公开 REST API
              部署，另一路则作为 Amazon Bedrock 的托管模型端点提供，让企业买家能走第二条消费路径，避免直接管理 API
              key。公司宣称的架构哲学是跨模态统一联合训练，而不是把专用模型拼接在一起；其理由是，跨模态反向传播能带来比独立专用管线更丰富的推理能力。官方发布文章称，Ray3 的多模态推理系统在推理时同时生成文本和视觉
              token，因此能先规划场景再渲染。API 分层：Build 层按量付费，每个 540p/5s 片段起价 $0.15；Scale 层提供专属容量，要求最低四个单元承诺，并提供有保障的吞吐
              SLA，以及内置审核和提示增强。公司在 lumalabs GitHub 组织下发布 Python、Node、Go 和 TypeScript SDK，并提供一个拥有 212 个公开 fork 的 ComfyUI
              集成。两个研究模型权重（IMM 和 TVM）也发布在 HuggingFace 上，并可看到合计下载记录。除上述公开描述外，模型大小、规模化推理延迟、SLO 分位数、缓存架构，以及推理侧 GPU /
              算力供应商组合等架构细节均未公开披露。
