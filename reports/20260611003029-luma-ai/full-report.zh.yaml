      - number: '5.4'
        title: 信任、安全、IP、训练数据与竞争语境
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的公开信任层面比产品野心薄。正面看，企业层级明确承诺不用于训练——客户生成或上传的内容不会被用于训练模型；Scale API 层也包含内置审核和提示增强。HUMAIN
              合作强调具备文化意识的护栏，企业部署包含 SSO 和访问控制。但在保留来源集中，找不到公开信任中心、状态页、SOC 2 或 ISO 27001 认证清单，或消费端平台的 SLA
              百分比。训练数据来源不透明：公司承认使用互联网级多模态数据训练，视频数据达到数十 PB，但未发布数据卡、授权披露或退出机制。这是关系到 Luma 的行业性风险：Copyright Alliance 报告称，截至
              2025 年，针对多家生成式视频和图像公司的 AI 训练数据版权诉讼仍在进行；Baker McKenzie 的案件追踪器也记录了同一 AI 创意行业的持续诉讼。IP 方面，Amplify Partners 的
              CEO 访谈提到原创架构研究（统一模型训练，以及在 HuggingFace 发布的 IMM/TVM 论文），Alex Yu 的联合创始人网站也引用了来自 Berkeley 的 NeRF 和 Plenoxels
              论文。这代表真实的公开研究谱系，但保留来源集中未识别出已提交专利。竞争语境上，Veo（Google DeepMind）和 LTX-Video（Lightricks，开放权重）是最可见的直接基准——Veo
              瞄准同一电影级质量段，LTX-Video 的开放权重模型则降低了开发者侧部署门槛。若发生授权事件或诉讼证据开示，训练数据和 IP 问题最可能成为阻断性尽调项。
