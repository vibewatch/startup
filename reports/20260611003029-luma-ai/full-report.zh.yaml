        - BIS 或 OFAC 针对 HUMAIN 的具名执法行动，或限制向 Project Halo 转移 GPU
        - 算力依赖型投资逻辑破裂；评估对训练时间表和估值的影响。
    notes: 终止标准定义为可监测公开信号；私有信号（内部财务指标、未公开流失）应在任何投资结构中谈判为报告权。
