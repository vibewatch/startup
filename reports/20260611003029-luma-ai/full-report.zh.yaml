      - number: '4.3'
        title: 资本充足性、成本结构与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的资本历史在新闻稿和投资人公告中披露较详。公司 2023 年 8 月向 SEC 提交 Form D，记录一笔 $25.5 million 发行，涉及 20 名投资人。TechCrunch 2024
              年 1 月报道，Luma 完成由 Andreessen Horowitz 领投的 $43 million Series B，使累计资本略高于 $70 million。2025 年 11 月，Luma 宣布由
              HUMAIN（一家 Saudi PIF 公司）领投的 $900 million Series C，AMD Ventures 大额参投，Andreessen Horowitz、Amplify Partners 和
              Matrix Partners 继续支持，报道估值为 $4 billion。招聘页面现称累计融资 $1.3B+，与 Series C 加上截至 2026 年初报道的任何后续融资相一致。

              融资结构不寻常：HUMAIN 同时是 Series C 领投方、算力基础设施提供方（Project Halo，位于 Saudi Arabia 的 2GW AI 超级集群），以及通过 HUMAIN Create
              进入市场的伙伴。这种三维关系制造了典型 VC 关系中不存在的财务相互依赖。Project Halo 自 2026 年 Q1 开始建设后，Luma AI 将成为 HUMAIN
              算力基础设施的客户——该安排的经济条款（算力是按成本、低于市场价还是市场价提供）未披露，是建模烧钱速度和毛利率的实质尽调缺口。

              算力成本是前沿多模态 AI 公司的主要成本驱动。Luma 训练数据量是领先 LLM 的 1,000×，并使用 Amazon SageMaker HyperPod 作为主要训练基础设施，同时维持 HUMAIN
              关系。按照公司描述的研发速度——Dream Machine V2 基于 1.2 quintillion tokens 构建，随后推出 Ray3（被描述为「规模超过 Ray2 两倍」），再到带多关键帧 API 的
              Ray3.2——算力预算很可能是最大的单项运营支出。公司未披露月度烧钱速度、总算力支出或毛利率。现金跑道无法从公开来源推导；$900M Series C 提供了可观的名义缓冲，但一家前沿 AI
              公司按这一规模投入时的烧钱轨迹仍未知。
