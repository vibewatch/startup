      - number: '6.2'
        blocks:
          - type: paragraph
            body: >-
              最强的生产证据来自三条独立路径：全球代理集团部署、与大型技术既有厂商的平台级集成，以及具名工作室制作案例。Serviceplan Group 2026 年 2 月的公告是最重要的代理证明：该集团把合作描述为覆盖
              43 个地点的运营基础设施，横跨战略、创意开发、内容制作和交付——这套表述指向生产部署，而非试点。CEO Florian Haller 关于「更快、更聪明、规模更大」的公开背书，以及 Jason Day
              关于「可衡量的运营和财务实力」的引述，都与生产级采用相吻合。Publicis Groupe Middle East 将 Luma 指定为 MENA 首选合作伙伴，意图把 AI 整合进面向 Saudi Arabia
              及更广泛地区品牌的创意和制作工作流；Campaign Middle East 的独立佐证确认该合作截至 2026 年 2 月仍成立。Boundless 在不到两周内完成了一条 Mazda
              广告，从简报到最终批准——按任何标准都属于生产——并随后签署协议，将 Luma 整合进未来客户工作。平台侧，Adobe 向付费 Firefly 和 Creative Cloud Pro 客户提供 14 天无限
              Ray3 生成；Amazon Bedrock 为企业团队托管 Luma 模型；AWS 自己的创新案例研究也把 Luma 称为在 Amazon SageMaker HyperPod 上构建前沿视觉模型的云原生 AI
              公司。Dentsu Digital Japan 作为日本唯一 Ray3 发布合作伙伴，表达了生产管线意图（「将 Ray3 整合进其制作管线」）。Wonder Project 的 Innovative Dreams
              工作室已积极使用 Luma 执行 Amazon MGM Studios 项目（「The Old Stories: Moses」），并确认将在 Prime Video
              首播，使其成为带具名网络合作方的实时工作室制作证明。Ray3 公告还把代理发布合作伙伴 Monks（S4）、Galeria 和 Strawberry Frog
              列为电影、广告和创意行业的早期采用者，但其部署结果披露较少。HUMAIN Create 在 MENA 地区面向公共和私营部门创作者部署了
              Ray3。多数企业证明的质量限制在于，它们是发布公告或合作公告，而不是续约、留存或队列证据。
