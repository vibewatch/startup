chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前规模
        blocks:
          - type: paragraph
            body: >-
              Luma AI 自称在构建「能够生成、理解并操作物理世界的统一通用智能」。这一使命叙事把公司放在更长周期的多模态通用人工智能赌注里，而不只是视频或图像生成工具。落到商业化层面，核心产品是 Dream
              Machine——文生视频和图生视频平台——以及 Ray3 推理视频模型；公司称 Ray3 是全球首个推理视频模型，能够生成物理准确的视频、动画和视觉内容。Luma 还提供 Genie（文生
              3D）、UNI-1（统一理解与生成），并推进名为 Open Physical AI Lab 的开放科学项目。平台通过订阅层级（Plus $30/month、Pro $90/month、Ultra
              $300/month）、API 和企业定制方案开放，体现出消费者加企业的 GTM 路径。截至 2026 年 6 月，公司招聘页面称全球用户超过 30 million、团队超过 150
              人；这两项均为公司口径且未经审计，但足够具体，可支撑规模叙事。CEO Amit Jain 2024 年 12 月称 Dream Machine V2 使用约 1.2 quintillion tokens
              训练；AWS 案例研究称 Luma 的训练数据量最高达到最大型大语言模型的 1,000 倍。这些规模指标与 Series C 融资和 Project Halo 超级集群承诺中的基础设施投入相互印证。Ray3
              已嵌入 Adobe 全球产品与解决方案，并可在 Amazon Bedrock 使用，形成两条企业分发渠道，也从独立侧面验证其商业牵引力并不只来自消费者订阅。
