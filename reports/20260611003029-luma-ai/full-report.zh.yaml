      数值是每个单元格内已识别风险的数量。严重 / 低 = HUMAIN 解约；严重 / 中 = 地缘政治出口管制；严重 / 高 = 训练数据版权。高 / 低 = Adobe 渠道退出；高 / 中 = SOC2
      缺口、人才梯队、不训练不可验证、DPA 缺口、客户集中；高 / 高 = 企业信任门槛、基准测试落后。中 / 中 = 财务不透明、API 可靠性、多市场执行；中 / 高 = 内容审核。低 / 中 = GPU
      供给约束。评估仅基于公开来源集，属于定性判断。
