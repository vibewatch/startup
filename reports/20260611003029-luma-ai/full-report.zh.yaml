  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入与单位经济
        - 订阅、API 和企业客户分部的 ARR、毛利率、烧钱速度，以及收入确认方法。
        - 要在 $4B 估值附近承销任何倍数，这是核心缺失材料；没有它，估值完全只是猜测。
        - CFO 数据室资料包和审计师演示材料。
      - - HUMAIN 治理与算力条款
        - 投资协议、算力定价表、排他性条款、董事会层面的利益冲突管理，以及商业关系文件。
        - HUMAIN 同时是投资方、算力供应商和客户；结构性纠缠可能稀释表面经济性。
        - 总法律顾问和 Series C 主投方文件。
      - - IP 与训练数据姿态
        - 训练数据授权或合理使用法律策略、任何版权风险准备金，以及 2024 年 6 月 Monsters Inc. 事件响应披露。
        - Bartz v. Anthropic 的 $1.5B 和解，以及 Disney v. Midjourney 的未决诉讼，让训练数据姿态成为财务风险，而不只是公关风险。
        - 法律顾问；要求披露训练数据类别和授权日志。
      - - 企业信任基础设施
        - SOC 2 Type II 认证、已发布的 DPA，以及第三方训练数据审计结果。
        - Adobe、AWS 和 Dentsu Digital 合同几乎肯定会要求这些；公共记录缺位就是尽调缺口。
        - CISO 和 DPO；要求认证状态和时间表。
      - - 留存与集中度
        - 免费转付费率、企业 NRR、GRR、流失率，以及头部客户收入集中度。
        - 需要判断 30M 用户能否转化为耐久的经常性经济，还是只是宽漏斗入口、缺少可变现付费群体。
        - CFO 和商业运营团队。
      - - 股权结构表与优先股堆叠
        - 清算优先权、顺位、附带协议、如有 HUMAIN 算力换股权条款，以及 Series C 中任何结构化投资者权利。
        - 即使头部估值守住，也会影响真实下行保护和普通股结果。
        - CFO 和首席法律顾问。
    notes: 这些是把 Luma AI 从“有意思”推进到可在 $4B 左右上一轮价格承销所需的最低文件。即便只给出部分答案，也可能足以收窄情景区间。
