  - id: TV003
    title: 乐观、基准与悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值与回报逻辑
      - 概率信号
      - 主要下行触发因素
    rows:
      - - 乐观
        - 免费转付费率 ≥5%；Pro/Ultra ASP 在规模化后维持 $90-$300/mo；HUMAIN 算力定价低于市场；Ray3.2 API 在 2026 年拿下三家或更多大型工作室集成；版权立场过关。
        - 2027 年视角的公允价值区间为 $4.5B-$6B；当前轮估值可辩护，Series D 高于 $4B 仍有上行。
        - 未来 12 个月内需通过尽调确认经济性和干净 IP 立场。公开信号（Adobe 全球嵌入、Dentsu 独家伙伴）方向一致。
        - Google Veo 免费层分发引发竞争价格塌陷，或版权反向判决出现，都会快速制造下行。
      - - 基准
        - 转化率 ≤3%；API 和企业业务增长但面临定价压力；HUMAIN 安排是中性而非经济上有利；版权风险可控但未解决。
        - $2.5B-$4.0B 区间；只有尽调验证收入质量可接受后，当前估值才在区间上沿成立。
        - 基于公开证据，这是最可能路径。需要数据室访问来补上经济性缺口。
        - 任何治理反向发现或版权升级，都会让该区间快速向悲观情景塌陷。
      - - 悲观
        - 转化薄；HUMAIN 条款摊薄；Disney v. Midjourney 先例扩大诉讼敞口；Google Veo 侵蚀 B2C 定价；Project Halo 延迟推后训练时间表。
        - $1.0B-$2.0B 区间；上一轮估值大概率下调；降价轮风险实质存在。
        - 若数据室保持关闭，或下一轮融资前出现反向法律证据，悲观情景将成为基准情景。
        - 在该情景下，员工留任、合作伙伴犹豫和 HUMAIN 重新谈判风险会同时叠加。
    notes: 区间是基于情景的承保判断，锚定公开可比区间和已披露融资背景，而非 DCF。收入和利润率未披露，因此区间较宽。概率信号反映公开证据质量，不是正式概率估计。
