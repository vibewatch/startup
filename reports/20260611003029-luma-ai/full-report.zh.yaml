        title: 图表
        blocks:
          - type: callout
            title: 不要把新融资等同于已确定公允价值
            body: >-
              2025 年 11 月 Series C 是有意义的正面信号，但主权支持或战略投资者可以基于公开投资者拿不到的私人信息承销。除非数据室确认足以支撑价格的经济性和治理假设，否则 $4 billion
              标记应被视为知情需求的证据，而不是经济公允价值的证明。
