            body: >-
              Luma 的悲观情景被行业力量放大：Bartz v. Anthropic 的 $1.5B 和解已经为训练数据责任设定了金额量级；Google 免费层 Veo 分发压缩消费者付费意愿；AI 市场调整（按 CEO
              Jain 自己的说法）大约每两年发生一次。这些风险并非 Luma 独有，但会叠加公司自身的披露缺口。
