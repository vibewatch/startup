      - number: '3.4'
        title: 切换成本、护城河耐久性与商品化风险
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的护城河论点建立在三项相互强化的优势上：技术差异化（原生 HDR/EXR、多关键帧、20-second generation）、分发嵌入（Adobe Firefly 全球集成、Amazon
              Bedrock 可用、30 million 用户），以及不断扩展的多模型市场。Dream Machine 同时提供 Veo 3.1、Kling Omni、GPT Image 2、Seedance 2.0 和
              Luma 自有模型，提高了离开平台的切换成本。不过，同一套市场逻辑也制造切换成本悖论：Luma AI 把竞争者聚合进 Dream Machine，降低了 API
              流失风险，但也让买家更容易在不离开平台的情况下评估并最终偏好竞争模型；一旦出现更优模型，迁移反而可能加速。公开记录中最强的耐久优势是通过 Adobe 实现的分发锁定：Ray3 已嵌入 Adobe Firefly
              全球，并被列为「顶级 AI 模型」之一，与 Adobe 自有 Firefly 模型、Google、OpenAI 和 Runway 并列——但 Adobe 将所有供应商视为可替换；若竞争产品改善，Adobe
              可以在模型组合中降低 Luma AI 权重，而不需要做出战略决定。多栖风险很高：Runway 的 Standard 方案提供 Veo 3.1 和 Kling 3.0 Pro，意味着 Runway
              订阅者无需切换平台，就能访问与 Luma AI 订阅者相同的大部分模型。LTX-Video 13B 等开源模型在 API 层加速商品化风险——任何能够自托管 13B
              参数模型的企业，都可以用近零边际成本复刻相当一部分生成质量。Fortune 对 2025 年市场 $716.8 million 的估计，以及 Technavio 对 2029 年前 $12.98 billion
              增量增长的预测，为多个赢家留下空间，但也会吸引持续进入。护城河耐久性上最清晰的反向信号，是 The Verge 记录的 IP/版权透明度缺口和 Copyright Alliance
              诉讼目录；它们在受监管企业采购中构成声誉负债，拥有治理认证的竞争者可在竞争评估中利用这一点。
