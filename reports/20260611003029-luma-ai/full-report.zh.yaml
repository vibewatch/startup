  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 论点
      - 改变判断的条件
    rows:
      - - Ray3/Ray3.2 的推理能力和 HDR 生产级输出，构成相对 Runway 和 Pika 的有记录技术领先。
        - 需要超出公司自称对比的基准证据，并且在 Google Veo 3.1 竞争回应下仍能守住。
      - - 30M+ 用户，以及 Adobe、AWS、Dentsu Digital 的企业客户胜利，确认商业需求不只是消费者热度。
        - 需要免费转付费率、企业合同额和净留存率，才能判断规模能否变现。
      - - HUMAIN Series C 提供 2GW 算力基础设施承诺，可能从结构上压低 Luma 的训练和推理成本。
        - 需要算力定价条款和排他条款，才能判断安排在经济上有利还是摊薄。
      - - $4B 估值相对当前 $700-800M AI 视频 TAM（GVR 2025）带有溢价；若 Luma 到 2030 年拿下数十亿美元市场的大份额，才说得通。
        - 市场规模估计差异很大（GVR $788M vs. Technavio $12.98B 增量）；仅靠 TAM 无法验证该估值。
      - - 反向逻辑：HUMAIN 同时是投资方、算力提供方、客户和联合开发方——结构性纠缠让估值无法干净穿透。
        - 若 HUMAIN 的治理、定价和董事会层面冲突管理获得披露，并显示为公平交易或有利安排，该担忧可解除。
      - - 反向逻辑：Bartz v. Anthropic（$1.5B 和解）确立的版权敞口，以及待决的 Disney v. Midjourney 诉讼，给视频生成带来行业级下行风险。
        - 若 Luma 披露训练数据授权、证明训练合理使用立场，并提供法律准备金文件，该担忧可解除。
    notes: 论点被定义为会随价格和尽调变化的投资主张，而非静态公司属性。每条反向逻辑都对应 TV006 中的一项尽调要求。
