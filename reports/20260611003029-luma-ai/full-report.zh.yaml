      - number: '5.3'
        title: 路线图、发布节奏与开发者信号
        blocks:
          - type: paragraph
            body: >-
              2024 到 2026 年间，Luma AI 的公开发布节奏明显加速。Dream Machine 在 2024 年 6 月上线，可在 120 秒内生成 120 帧视频。Ray2 于 2025 年 1
              月发布，声称算力较 Ray1 提升 10×，并采用新的多模态架构。随后十二个月陆续加入 Camera Motion Concepts（2025 年 3 月）、Camera Angle Concepts（2025
              年 4 月）、Reframe（2025 年 5 月）、Modify Video（2025 年 6 月）、Modify Video API（2025 年 6 月）、带 HDR EXR 和推理能力的
              Ray3（2025 年 9 月）、带角色参考的 Ray3 Modify（2025 年 12 月）、速度提升 4×、成本改善 3× 的 Ray3.14（2026 年 1 月）、Open Physical AI
              Lab 公告（2026 年 6 月 1 日），以及首个完整 Ray API 界面的 Ray3.2（2026 年 6 月 9
              日）。这一节奏——大约每六到八周一次有意义的公开发布——说明应用研究团队产出较强。开发者参与真实存在，但现阶段规模不大：ComfyUI-LumaAI-API 仓库有 22 个 GitHub star 和 212
              个 fork（组织内 fork 数最高），lumaai-python SDK 有 8 个 star 和 45 个 fork，新的 luma-agents-*
              SDK（Python、Node、Go、TypeScript）在 2026 年 6 月创建，目前 star 很少。HuggingFace 列出两个公开模型：lumaai/imm（Inductive Moment
              Matching，585 个 star）和 lumaai/tvm（Terminal Velocity Matching，1 个 star、87 个 fork）。Vercel AI SDK 的
              @ai-sdk/luma 包通过标准 npm 依赖开放 Photon 图像模型，把集成延伸到更广泛的开发者 AI 工具体系。路线方向清晰：从仅视频生成走向多模态创意智能体，也从自研闭源权重走向物理 AI
              上并行的开放科学尝试。除已交付内容外，公司没有发布带日期的正式公开路线图，因此前瞻路线承诺只能从研究方向推断，而非产品管理披露。
