  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              界定 Luma AI 的市场，首先要区分买家为 AI 视频生成付费时实际替代了什么，以及哪些相邻软件品类只是出现在同一预算讨论中。Luma AI
              首页把公司定位为围绕「能够生成、理解并操作物理世界的统一通用智能」展开，但到 2026 年，其创收表面主要是 AI 原生视觉内容创作：文生视频和图生视频生成（Ray3 模型）、AI
              图像生成（Uni-1），以及一个多模型市场，除 Luma 自有模型外，还分发 Veo 3.1、Kling Omni、Seedance 2.0 等第三方模型。纳入支出包括个人和团队用户支付的订阅费、开发者和代理商将
              AI 视频嵌入产品时产生的按 credit API 消耗费用，以及带专属支持和定制微调的企业定制合同。排除支出包括原始云计算基础设施成本、视频托管和 CDN 费用、没有 AI 生成能力的传统后期制作软件，以及
              AI 不替代的人类制作代理费用。买家采用 Luma AI 前考虑的现状替代方案包括：传统电影或商业制作团队和工作室（面向代理商与品牌）、Getty 或 Storyblocks
              等素材视频库（面向营销和社媒团队）、手工动态图形和 VFX 流程（面向娱乐和游戏），以及 Adobe Premiere Pro 非生成式剪辑套件等横向 AI 工具。因此，市场边界由买家是否愿意用 AI
              原生生成替代上述既有工作流定义，而不是由所有创意软件支出定义。一个市场定义上的复杂点在于，Luma AI 的多模型市场让它同时成为 Google、OpenAI 和 Kuaishou
              模型的竞争者与分发商，模糊了独立 AI 视频生成器与聚合平台之间的边界；这项战略张力会实质影响市场份额估算和定价权。
