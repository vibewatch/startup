  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、平台聚合器、相邻替代方案与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，AI 视频生成竞争场可分为五个重叠群组。争夺同一批专业创作者、代理商和企业买家的直接同业包括 Runway（Gen-4.5、多模型平台）和 Google Veo 3.1（原生音频，通过
              Gemini、Google Flow 和第三方市场分发）。OpenAI 的 Sora 曾是主要直接对手，直到 2026 年 4 月 26 日 OpenAI 停止其 web 和 app 体验；Sora API 将于
              2026 年 9 月 24 日停止，这将实质重塑市场。面向消费者和创作者的对手包括 Pika（2.5 模型、移动端 Pikaffects app、Pika Agent，以及面向病毒式内容格式的 MCP 集成）和
              Kling AI（Kuaishou 的 Kling 3.0，带原生音频和 VIDEO 3.0 Omni，同时提供消费者平台和企业 API）。相邻商业视频替代方案服务不同买家，但可能吸收 Luma AI
              原本可延伸进入的企业 L&D 或培训预算，包括 Synthesia（$18/month+、SOC 2、基于 avatar、50,000+ 团队）和 Colossyan（$27/month+、NEO 2
              模型、80+ languages）。现状替代方案——传统电影制作团队、素材视频库和手工 VFX 流程——代表最大的替代机会，但也是最难推进的采购讨论。以 Lightricks 的 LTX-Video 13B
              为代表的开源进入者（基于 DiT 的实时生成，分辨率 1216×704）提供低成本自托管选项，可服务不想承担 API 费用、开发者资源较强的企业团队。Adobe Firefly 的多模型市场分发 Luma AI
              的 Ray3，同时分发 Runway、Google 和 OpenAI 模型，位置暧昧：它今天是 Luma AI 最重要的两个分发伙伴之一，也可能成为跨整个竞争集合捕获买家关系的聚合器品牌。
