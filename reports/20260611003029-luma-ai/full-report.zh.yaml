  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: Luma AI 最强的护城河信号是 HDR/EXR 技术领先，以及 Adobe / AWS 分发渠道。最高风险来自 Google 的生态分发优势、Runway 在入门层级的价格竞争，以及 LTX-Video 带来的开源商品化。
    data:
      items:
        - label: 直接同行压力（Runway）
          value: high
          detail: Runway Gen-4.5 以可比的多模型产品，在入门价格上压过 Luma AI（$12 vs $30/月）
          tone: warning
        - label: 生态分发威胁（Google、Adobe）
          value: high
          detail: Google Veo 3.1 通过 Gemini 和 Flow 分发；Adobe Firefly 聚合包括 Luma AI 在内的所有主要模型
          tone: negative
        - label: HDR/EXR 技术差异化
          value: high
          detail: 截至 2026 年 6 月，没有其他主要云端 AI 视频提供商公开记录了等同的原生 HDR/EXR 输出
          tone: positive
        - label: 切换成本深度（API / 制作流水线）
          value: medium
          detail: 多关键帧、V2V 和 EXR 流水线集成会制造摩擦；但 Runway 和 Veo 正在构建可比功能
          tone: warning
        - label: IP / 版权监管姿态
          value: elevated-risk
          detail: 2024 年 Verge 报道和 AI 版权诉讼环境，相比合规认证同行（Synthesia ISO 42001、SOC 2）会制造采购风险
          tone: negative
        - label: 开源商品化风险
          value: medium-high
          detail: LTX-Video 13B 实时生成、1216x704，让企业可在没有 API 成本的情况下自托管
          tone: warning
        - label: Sora 停用机会
          value: positive
          detail: OpenAI Sora app / web 于 2026 年 4 月停用；API 将于 2026 年 9 月结束；API 迁移需求同等利好 Luma AI、Runway 和 Veo
          tone: positive
    approximationNotes: KPI 标签是基于公开抓取证据得出的分析摘要，不是公司报告的内部指标。严重程度标签（高、中、风险抬升）反映分析师对竞争风险的解读，不是正式风险评分方法。
