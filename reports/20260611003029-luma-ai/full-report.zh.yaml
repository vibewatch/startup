        blocks:
          - type: paragraph
            body: >-
              最强公开牵引力信号是用户基数。Luma 招聘页面和 Ray3 发布公告均引用 Dream Machine 全球 30 million 或更多用户。Ray3 发布（2025 年 9 月）称该平台「为超过 30
              million 用户的创作提供动力」，确认这是重大产品发布时的活跃平台口径。2024 年 1 月 Series B 时此前里程碑仅为略高于 2 million 用户——若 30M 指注册账号，则约 20
              个月内增长约 15×；但公开信息未区分月活用户、注册账号和付费订阅者。免费转付费转化率、ARPU、流失率和净收入留存均为私有信息。

              面向雇主的招聘页面还披露，运行日期时团队规模为 150+，开放职位 57 个，并提到累计融资 $1.3B+。Amplify Partners 播客（2024 年 12 月）称 Dream Machine V2
              使用 1.2 quintillion tokens 训练——强调的是训练规模，不是收入。AWS 案例研究提到，Luma 使用 Amazon SageMaker HyperPod 训练的数据量「比最大 LLM 多
              1,000 倍」，这是一项财务上重要的算力依赖，但成本结构未披露。

              GTM 效率代理指标很薄。企业公告称 Luma AI 提供会嵌入企业客户的「前置部署创意人员」，这暗示其落地后扩张动作依赖较重的客户成功投入。这会增加 GTM
              成本，但若附着率提升，也可能扩大合同金额。Serviceplan Group 和 Publicis Groupe 合作均提到在数千名创意专业人士中进行公司范围 AI
              工作流部署；若按企业方案价格变现，将代表有意义的席位许可收入，但没有引用合同金额。CAC、LTV、回本周期和销售周期时长均不可得。
