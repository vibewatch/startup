      - number: '6.3'
        title: 留存缺口、扩张信号与集中风险
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的公开证据几乎没有触及续约经济。任何分层都未披露 NRR、GRR、流失、合同期限或客户收入集中度。消费订阅模型通过使用积分累积形成一定黏性；企业层级则靠品牌专属微调和 SSO /
              访问控制增强黏性。但没有队列数据证明试用用户会以有意义的比例转为付费订阅，也没有数据证明企业合同会续约。对这一阶段的公司而言，缺少这些指标在结构上并不意外，但这意味着收入耐久性叙事几乎完全压在增长故事上。扩张信号在范围上积极，但证据偏薄：Serviceplan
              的「House of AI」数字孪生生态暗示深度工作流整合，拆掉成本较高；Publicis ME 的「preferred partner」定位暗示合同深度超过单个项目；Boundless
              后续同意在未来客户工作中使用 Luma，是目前最具体的扩张证明。代理行业的 land-and-expand
              逻辑合理——集团签下企业访问权限，在一个产品线推动团队上量，再向更多活动和市场加深使用——但公开渠道没有收入轨迹或增购数据。最大结构性风险是投资者 - 客户集中：HUMAIN 是 Luma 的 Series C
              领投方（$900M），同时也是最大的企业部署渠道（HUMAIN Create、Riyadh 办公室、Project Halo
              算力）。这模糊了商业牵引力和投资者赞助采用之间的边界，并制造依赖关系；若关系解除，资本获取和客户基础会同时收缩。Adobe 的全球 Firefly 集成是高价值分发渠道，但也是集中点——失去 Adobe
              合作会显著削弱 Luma 触达专业创意工作流的能力。Monster Camp 事件（2024 年 6 月，The Verge 报道）是负面的客户信任信号：一名用户的 AI 生成视频明显出现 Pixar
              角色，引发版权担忧。Luma 将其归因于用户上传内容，但该事件说明，IP 风险可能在受监管或品牌敏感环境中制造企业采购摩擦。BakerLaw 的 2025-2026 AI 版权案件追踪器记录了 AI
              训练数据行业的持续诉讼；行业风险适用于 Luma，并可能迫使企业客户寻求合同性 IP 赔偿。教育项目采用（教育者和学生大使报名表）仍处早期管线，未披露具名机构或牵引指标。开发者采用由 npm 包（lumaai 和
              @ai-sdk/luma）及 ComfyUI 集成体现，但安装量未公开。
