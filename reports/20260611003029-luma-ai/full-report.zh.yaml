        title: 证据材料
        blocks:
          - type: callout
            title: IP 和版权不确定性是最尖锐的近期采用约束
            body: >-
              D.C. Circuit 裁定（2025 年 3 月）以及 Copyright Office 2025 年 1 月关于仅凭 prompt 不能确立作者身份的结论，制造了企业法务团队必须先解决的实际 IP
              风险，然后才会批准 AI 视频用于品牌商业内容。Luma AI 的「不使用你的内容进行训练」和商用保障只能部分缓解该风险；截至 2026 年 6 月，AI 生成输出本身是否可作为买方品牌的 IP
              受到保护，法律仍未落定。尽调应核实大型企业客户如何在与 Luma AI 的合同条款中管理这一风险。
