  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与采用界面
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的客户基础分为四个主要层级，买方类型、承诺深度和证据质量各不相同。消费端 / 个人层级覆盖最广：公司在 2025 年 9 月 Ray3 发布时称全球用户达 30
              million，可通过自助订阅方案访问，价格从 Plus（$30/month）到
              Ultra（$300/month）。这一层级产生稳定订阅收入，但流失不确定性最高，因为公司未披露任何队列或续约数据。企业代理层级拥有最实质性的生产证据：Serviceplan Group（43+
              全球地点，6,500+ 专业人员）在 2026 年 2 月签约，成为 Luma AI 首个全球标准化代理合作伙伴；随后 Publicis Groupe Middle East（3,600+ 员工，8 个 MENA
              市场）将 Luma 指定为其首选生成式 AI 创意技术合作伙伴。精品和独立代理也已出现——Boundless（约翰内斯堡）使用 Luma Agents 在不到两周内制作了 Mazda 首支 AI
              生成广告。技术平台层级支撑企业分发叙事：Adobe 在 2025 年 9 月发布时把 Ray3 嵌入全球 Adobe Firefly，Amazon Bedrock 为设计、电影制作和营销团队托管 Luma
              模型。娱乐和制作工作室层级在 2026 年出现，Wonder Project 与 Luma 推出 Innovative Dreams，这是一家由 AWS 支持的制作服务公司，首个项目是将在 Prime Video
              首播的 Amazon MGM Studios 委托项目。新生的 API / 开发者层级通过 lumaai npm 包和 @ai-sdk/luma provider
              包服务，显示开发者侧漏斗正在形成。教育项目（面向教育者和学生大使）是长期管线分层，目前尚未披露具名机构。地域上，美国仍是核心市场；国际扩张正通过伦敦（2026 年计划 200 个岗位）和 Riyadh
              办公室推进。
