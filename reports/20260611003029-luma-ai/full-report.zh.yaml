      - number: '1.3'
        title: 融资历史、投资人基础与资本结构
        blocks:
          - type: paragraph
            body: >-
              Luma AI 的融资历史可识别为四个阶段。最早期资本包括 Series B 前融资，使 Series B 完成前累计融资约 $27 million（由 $43 million Series B 后累计 $70
              million 反推）。早期投资人包括 Amplify Partners、South Park Commons 和 NVIDIA。$43 million 的 Series B 于 2024 年 1 月完成，由
              Andreessen Horowitz 领投；TechCrunch 和 a16z 均确认了该轮融资，熟悉事项的消息源将估值锚定在 $200 million 至 $300 million 之间。2025 年 11
              月 19 日宣布的 $900 million Series C 由 HUMAIN——Saudi Arabia 的 Public Investment Fund 公司——领投，AMD Ventures 和既有投资人
              Andreessen Horowitz、Amplify Partners、Matrix Partners 大额参投。Economic Times 报道称，接近公司的消息源将 Series C 估值锚定在约 $4
              billion。公司招聘页面显示，截至 2026 年 6 月累计融资为 $1.3 billion-plus，暗示除已宣布轮次外还有增量资本。投资人构成带有明显战略权重：HUMAIN
              带来算力基础设施（Project Halo，位于 Saudi Arabia 的 2GW AI 超级集群）和 GTM 触达；AMD Ventures 提供芯片厂商层面的供应链关系；官方沟通将 Amazon 和
              NVIDIA 列为支持方，但未披露其持仓金额和权利。缺失的仍是完全稀释后的股权结构表、任何老股流动性信息、Series C 授予的确切治理权利，以及 HUMAIN 的主权基金身份与该合作地缘政治风险之间的关系。
