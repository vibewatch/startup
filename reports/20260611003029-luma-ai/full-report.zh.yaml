            body: >-
              乐观情景要求：30M 用户基础的免费转付费率达到或超过 5%；Pro 或 Ultra 定价在面对 Google Veo 免费层竞争时仍守住 $90-300/mo；HUMAIN 算力安排低于市场价；Ray3.2
              API 在 2026 年赢下主要工作室集成；训练数据版权风险干净解决。以上均未获得公开确认。
