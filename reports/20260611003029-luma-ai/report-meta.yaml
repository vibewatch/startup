companyProfile:
  summary: >-
    Luma AI is a Palo Alto-headquartered frontier multimodal AI company co-founded in
    2021–2022 by Amit Jain (CEO), Alex Yu (formerly CTO), and Alberto Taiuti. Its
    flagship Dream Machine video platform and Ray3 reasoning video model serve 30M+
    worldwide users across consumer subscriptions (Plus $30/mo, Pro $90/mo, Ultra
    $300/mo) and enterprise API channels. Ray3 is embedded in Adobe's global products
    and available on Amazon Bedrock; Dentsu Digital named Luma as its sole AI video
    partner in Japan. In November 2025, Luma closed a $900M Series C led by
    HUMAIN — a Saudi PIF company — at a ~$4 billion post-money valuation, bringing
    total capital raised to $1.3B+. Alongside the financing, Luma announced Project
    Halo, a 2-gigawatt AI supercluster in Saudi Arabia. The company opened London and
    Riyadh offices in 2025–2026 and ranked #35 on CNBC's 2026 Disruptor 50 list.
    Key disclosure gaps include revenue, gross margin, free-to-paid conversion, and
    HUMAIN governance terms.
