    - HUMAIN 投资协议、算力定价条款、排他性安排，以及董事会利益冲突管理机制。
    - 训练数据授权策略，以及针对版权敞口计提法律储备的披露。
    - 免费到付费转化率、企业 NRR，以及头部客户收入集中度。
    - Series C 后的股权结构表、清算优先权和优先股堆叠影响。
    - Alex Yu 是否仍担任 CTO 的确认或否认，以及管理层梯队连续性。
