  topStrengths:
    - Ray3/Ray3.2 推理视频模型已嵌入全球版 Adobe Firefly，并登陆 Amazon Bedrock，两大平台给出了企业级分发证明。
    - 全球用户超过 30M，HUMAIN 领投 Series C，Andreessen Horowitz 和 AMD Ventures 参投，投资人对 $4B 估值有明确下注。
    - Project Halo 的 2 吉瓦 AI 超级集群合作若定价条款有利，可能带来结构性算力成本优势。
  topRisks:
    - 收入披露为零，没有 ARR、毛利率、转化率或烧钱速度，$4B 估值只能从产品质量和用户广度向前推。
    - HUMAIN 同时是领投方、主要算力提供方和商业客户，治理与利润率缠在一起，且缺少已披露细节和清晰先例。
    - 行业版权诉讼（Bartz v. Anthropic $1.5B 和解；Disney v. Midjourney 尚未结案）叠加 Luma 2024 年 6 月 IP 事件，训练数据责任风险仍未解开。
  unresolvedGaps:
