    rows:
      - - Training-data copyright infringement
        - U.S. federal courts (N.D. Cal., S.D.N.Y., C.D. Cal.)
        - Active sector litigation; Bartz v. Anthropic settled $1.5B Sep 2025; Disney v. Midjourney and In Re OpenAI active.
        - High
        - Critical
        - CEO claims industry-standard moderation; company has not disclosed training-data composition publicly.
        - Require training-data provenance card, licensed-dataset list, and legal opinion on fair-use posture before underwriting.
      - - AI output IP replication (user-driven)
        - U.S.; potentially EU and UK
        - Dream Machine reproduced Monsters Inc. IP in June 2024 promotional video; no lawsuit disclosed.
        - Medium
        - High
        - CEO attributed to user-uploaded image; content moderation methods claimed but not specified.
        - Obtain content-moderation architecture review, false-positive/false-negative rates, and terms-of-service enforcement evidence.
      - - AI output copyright non-registrability risk
        - U.S. Copyright Office; federal courts
        - Supreme Court denied certiorari Mar 2026 in Thaler v. Perlmutter; human authorship required for copyright.
        - High
        - Medium
        - Enterprise customers relying on Luma outputs as copyrightable creative work must embed sufficient human authorship.
        - Clarify enterprise IP ownership policy and whether Luma's enterprise agreements address output copyright allocation to customers.
      - - Data privacy and enterprise DPA compliance
        - U.S., EU (GDPR), UK (UK GDPR), Saudi Arabia
        - No public DPA or privacy compliance documentation for enterprise API discovered in June 2026 source review.
        - Medium
        - High
        - Enterprise page references SSO and access controls; no independent DPA or privacy certification published.
        - Request data processing agreement, sub-processor list, GDPR Article 28 compliance evidence, and Saudi data-residency terms.
      - - Geopolitical / export-control risk from HUMAIN
        - U.S. BIS; OFAC; Saudi Arabia
        - HUMAIN is a PIF company; U.S. export controls on advanced AI compute are active and expanding.
        - Medium
        - High
        - No public OFAC enforcement action against HUMAIN found as of June 2026.
        - Confirm HUMAIN's compliance with U.S. export-control requirements; obtain export-control legal opinion covering GPU and model transfers.
    notes: >-
      Severity ranks the investment consequence, not the probability of enforcement. Rows ordered by severity.
      No Luma-specific copyright lawsuit was identified in the public source set as of June 2026; sector
      litigation posture and the documented IP replication incident set the risk floor.
