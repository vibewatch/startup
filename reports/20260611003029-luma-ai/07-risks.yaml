  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Training-data copyright litigation
        - Named lawsuit filed against Luma AI by a content rights holder
        - Any filed complaint naming Luma AI or Dream Machine in copyright infringement
        - Pause or restructure investment; require immediate litigation assessment and training-data disclosure.
      - - HUMAIN concentration unwind
        - HUMAIN withdraws from Project Halo, reduces Series C participation, or exits HUMAIN Create
        - Any public announcement of HUMAIN compute delay by > 6 months or commercial partnership termination
        - Thesis-break; reassess valuation under no-HUMAIN scenario; estimate probability of alternative compute sourcing.
      - - Competitive benchmark parity loss
        - Google Veo or Runway achieves consistently superior benchmark scores across professional video metrics
        - Public third-party evaluations show Luma trailing on 3+ consecutive benchmark rounds
        - Downgrade competitive moat assessment; increase discount rate; revisit ARR projections.
      - - Enterprise trust gap remains unresolved
        - SOC 2 Type II or equivalent certification still absent after 12 months post-investment
        - No certification announcement by Q4 2026 (or equivalent negotiated deadline)
        - Flag as active procurement risk; escalate to board-level diligence request.
      - - Geopolitical escalation affecting Saudi operations
        - U.S. government action (export control, OFAC) affecting HUMAIN or Project Halo
        - BIS or OFAC enforcement action naming HUMAIN or restrictions on GPU transfer to Project Halo
        - Thesis-break for compute-dependent investment case; evaluate impact on training timeline and valuation.
    notes: >-
      Kill criteria are defined as monitorable public signals; private signals (internal financial metrics,
      unpublished attrition) would be negotiated as reporting rights in any investment structure.

