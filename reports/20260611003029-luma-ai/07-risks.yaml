  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: HUMAIN governance structure
      missingEvidence: Separate governance documentation covering investment, compute, and commercial roles of HUMAIN; board representation and consent rights; break-clause or termination provisions in each agreement dimension.
      whyItMatters: Without governance separation, a deterioration in any one HUMAIN dimension can cascade to all three; investors cannot model downside scenarios without knowing exit provisions.
      diligencePath: Request copies of Series C investment agreement, Project Halo compute agreement, and HUMAIN Create commercial agreement; have counsel map consent rights and cross-default provisions.
      relatedQuestionRefs:
        - QR007
        - QR017
        - QR021
        - QR028

    - type: missing-source
      severity: blocking
      topic: training data provenance
      missingEvidence: Training-data composition card, licensed dataset list, or legal fair-use opinion covering Luma's video and image model training corpora.
      whyItMatters: The Bartz v. Anthropic $1.5B settlement and Disney v. Midjourney active litigation show the financial magnitude of training-data liability; Luma's documented refusal to disclose this information is a specific risk flag.
      diligencePath: Require training-data provenance report from Luma's legal team; commission independent IP counsel review; obtain indemnification for IP claims arising from training data.
      relatedQuestionRefs:
        - QR001
        - QR004
        - QR013

    - type: missing-source
      severity: material
      topic: enterprise security certification
      missingEvidence: SOC 2 Type II report, ISO 27001 certification, or equivalent third-party security attestation covering Luma AI's production environment and data handling.
      whyItMatters: Regulated enterprise customers in financial services, healthcare, and legal sectors require independent attestation; absence blocks procurement and signals immaturity of security controls.
      diligencePath: Request SOC 2 Type II report (or confirm in-progress timeline) and review ISMS documentation before enterprise valuation premium is ascribed.
      relatedQuestionRefs:
        - QR005
        - QR020

    - type: missing-source
