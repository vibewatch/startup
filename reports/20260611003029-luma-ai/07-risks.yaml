callouts:
  - calloutType: risk
    title: HUMAIN triple-role concentration is the most structurally unusual risk
    body: >-
      No equivalent example of a single sovereign-linked entity serving simultaneously as lead
      investor, primary compute provider, and primary commercial channel partner was identified
      in this chapter's source review. The lack of separation means that a deterioration in
      any one dimension of the HUMAIN relationship can propagate rapidly into all three.
      Investors should require explicit documentation of governance structures that separate
      these roles before treating HUMAIN as three independent positive signals.
    claimRefs:
      - CR012
      - CR013
      - CR014
      - CR044

  - calloutType: risk
    title: IP litigation environment has no Luma-specific filed case but sector precedent is dangerous
    body: >-
      As of June 2026, no copyright infringement lawsuit naming Luma AI specifically has been
      identified in the public source set. However, the Bartz v. Anthropic $1.5B settlement,
      Disney v. Midjourney, and In Re OpenAI all operate on similar training-data theories,
      and Luma's documented refusal to disclose training-data composition (per The Verge,
      June 2024) leaves its liability posture opaque. The CRS Legal Sidebar confirms this
      question is unresolved in law. Pre-investment legal opinion on training-data provenance
      is mandatory.
