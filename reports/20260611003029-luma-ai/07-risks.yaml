  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Why it matters
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
    rows:
      - - Enterprise trust-infrastructure gap (no SOC 2 / trust center)
        - Regulated enterprise customers require third-party security attestation for procurement; absence blocks deals and creates liability.
        - High
        - High
        - Emerging; enterprise page references SSO and access controls but no external certification is disclosed.
        - Procurement blocker for FSI, healthcare, and legal verticals until SOC 2 Type II or equivalent is obtained.
      - - No-train guarantee unverifiability
        - Enterprise IP protection is entirely company-claimed; customers cannot audit training pipeline exclusions independently.
        - Medium
        - High
        - Partial; contractual assurance exists but no technical or audit path is published.
        - Require contractual warranty, escrow of training logs, or third-party audit before including in procurement terms.
      - - Model output IP replication
        - Generative model outputs may reproduce copyrightable elements from training data, exposing customers to downstream liability.
        - Medium
        - High
        - Partial; CEO references moderation systems but rates, architecture, and coverage are undisclosed.
        - Obtain false-positive/negative rates, indemnification terms, and legal opinion on output liability allocation.
      - - API reliability and SLA coverage
        - Dream Machine and Ray3 API are production-critical for enterprise agency workflows; downtime disrupts client deliverables.
        - Medium
        - Medium
        - Partial; Scale tier offers dedicated capacity SLA but no public status page or uptime history disclosed.
        - Request SLA terms, uptime track record, incident history, and rollback procedures for enterprise contracts.
    notes: >-
      Mitigation maturity reflects only publicly observable evidence. Enterprise security posture may be stronger
      than public disclosure suggests; absence of public documentation is itself a risk signal for sophisticated buyers.

  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / channel
      - Failure scenario
      - Likelihood
      - Severity
      - Mitigation evidence
      - Residual exposure
    rows:
      - - Lead investor + compute + commercial partner concentration
        - HUMAIN (PIF portfolio company)
        - HUMAIN unwinds from any one role (investor, compute, commercial); cascading effect on capital, infrastructure, and revenue.
        - Low-Medium
        - Critical
        - Project Halo has begun deployment; Riyadh office announced Feb 2026; Publicis MENA partnership provides partial revenue diversification.
        - Obtain governance documentation separating investment, commercial, and compute relationships; confirm break-clause terms.
      - - Cloud compute dependency (inference and enterprise distribution)
        - Amazon Web Services (Amazon Bedrock)
        - AWS changes pricing, removes Luma from Bedrock, or restricts API access; Luma loses enterprise distribution channel and inference infrastructure.
        - Low
        - High
        - Amazon Bedrock hosts Luma models for enterprise; AWS is an existing investor per Series C announcement.
        - Confirm multi-cloud contingency; review AWS hosting terms and exit provisions.
      - - Key enterprise distribution channel
        - Adobe (Firefly global embedding)
        - Adobe removes Ray3 from Firefly or shifts to a competing model; Luma loses access to Adobe's global enterprise user base.
        - Low
        - High
        - Adobe embedded Ray3 globally at September 2025 launch; partnership appears strategic but commercial terms are not public.
        - Obtain partnership term length, exclusivity terms, renewal triggers, and revenue contribution disclosure.
      - - Agency enterprise customer concentration
        - Serviceplan Group (6,500+ staff), Publicis Groupe Middle East (3,600+ staff)
        - Two largest disclosed enterprise customers exit or reduce scope; customer concentration compounds revenue risk.
        - Low-Medium
        - Medium
        - Both partnerships announced in 2026; no NRR or renewal metrics disclosed.
        - Obtain top-five customer revenue concentration, contract lengths, NRR, and renewal evidence before commitment.
      - - GPU and compute availability
        - NVIDIA / AMD (hardware); Project Halo (facility)
        - GPU supply constraint or Saudi facility delay disrupts training timeline; Sora discontinuation precedent shows compute/model economics can shift rapidly.
        - Medium
        - High
        - HUMAIN partnership provides 2GW committed capacity; AMD also participated in Series C.
        - Confirm compute delivery schedule, delay provisions, and alternative sourcing if Project Halo timeline slips beyond 2028-29.
    notes: >-
      Rows ordered by severity. The HUMAIN triple-role concentration is treated as Critical because no other
      publicly disclosed relationship substitutes for its investor, compute, and commercial functions simultaneously.

