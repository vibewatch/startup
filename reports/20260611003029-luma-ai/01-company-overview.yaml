  - id: leadership-and-governance
    title: Founding team, leadership bench, and governance visibility
    body: >-
      Luma AI was co-founded by Amit Jain (CEO), Alex Yu (formerly CTO), and Alberto
      Taiuti, each bringing complementary backgrounds in Apple hardware and computer vision,
      UC Berkeley AI research, and autonomous systems respectively. Amit Jain led Vision Pro
      multimedia experience development at Apple before co-founding Luma, giving him direct
      experience in the intersection of consumer hardware, computer vision, and creative
      tooling. Alex Yu authored pioneering research on NeRF-based 3D rendering at UC
      Berkeley and is credited by a16z with building the core multimodal model capabilities
      that define Luma's technical differentiation. Alberto Taiuti worked at Apple on AR/VR
      and as a Senior Autonomy Software Engineer at Skydio before co-founding the company.
      A material flag in the public record is that Alex Yu's personal website describes his
      Luma AI role in the past tense ("Previously, I was the co-founder and CTO"), raising
      a key-person departure question that has not been confirmed or denied in official
      communications as of June 2026. The operating bench beyond founders is partially
      visible: Caroline Ingeborn is named as COO in official press materials; Jiaming Song,
      who led foundational work on DDIM diffusion models at NVIDIA, serves as Chief Scientist;
      Matthew Tancik, co-creator of Neural Radiance Fields, leads applied research; and Jason
      Day joined as Head of EMEA in December 2025. Governance transparency is limited.
      a16z's Anjney Midha is listed as serving on Luma AI's board in his public profile.
      No full board roster, independent director list, or post-Series-C governance rights
      disclosure has been identified in the public source pack. Key-person concentration
      is high: Amit Jain is the sole consistent public narrator across all funding rounds
      and most major product announcements, representing a dependency risk that standard
      diligence would address with a full leadership assessment.
