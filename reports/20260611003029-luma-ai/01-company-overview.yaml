  - id: capital-structure
    title: Funding history, investor base, and capital structure
    body: >-
      Luma AI's financing history covers four identified stages. The earliest capital
      included pre-Series-B funding that brought total raised to approximately $27 million
      before the Series B close (implied by the $70 million total after a $43 million Series B).
      Early investors included Amplify Partners, South Park Commons, and NVIDIA. The Series B
      of $43 million closed in January 2024, led by Andreessen Horowitz; TechCrunch and a16z
      both confirmed the round, and a source familiar with the matter pegged the valuation at
      between $200 million and $300 million. The $900 million Series C announced on
      November 19, 2025 was led by HUMAIN—a Public Investment Fund company of Saudi Arabia—
      with significant participation from AMD Ventures and existing investors Andreessen
      Horowitz, Amplify Partners, and Matrix Partners. Sources close to the company pegged
      the Series C valuation at approximately $4 billion, per Economic Times reporting. The
      company's careers page reports total raised at $1.3 billion-plus as of June 2026,
      implying some incremental capital beyond the announced rounds. The investor composition
      is strategically weighted: HUMAIN brings compute infrastructure (Project Halo, a 2GW
      AI supercluster in Saudi Arabia) and go-to-market access; AMD Ventures provides a
      chipmaker-level supply-chain relationship; and Amazon and NVIDIA are listed as backers
      in official communications, though the amounts and rights for those positions are not
      disclosed. What remains missing is the fully diluted cap table, any secondary liquidity
      information, the exact governance rights granted in the Series C, and the relationship
      between HUMAIN's sovereign-fund status and any geopolitical risk to the partnership.
