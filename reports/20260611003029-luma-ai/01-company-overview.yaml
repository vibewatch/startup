  - id: milestones-and-adverse
    title: Milestones of record, expansion, and adverse signals
    body: >-
      The public record supports a company that evolved from a 3D smartphone capture app
      in 2021 to a multimodal AI platform with enterprise partnerships at major studios and
      ad agencies by 2025–2026. The founding of the company led quickly to the smartphone
      3D capture app and later to Genie (November 2023), the first publicly released
      generative 3D model at scale, which attracted 100,000 users in its first four weeks.
      The Series B in January 2024 and the Dream Machine video platform launch in June 2024
      marked the pivot from 3D capture to text-to-video generation. An adverse event
      accompanied the Dream Machine launch: The Verge reported in June 2024 that users
      had generated videos featuring Monsters Inc. characters from Pixar/Disney using
      the platform, raising immediate concerns about copyright, training-data transparency,
      and content moderation. CEO Jain responded that the Monsters Inc. characters appeared
      because a user uploaded copyrighted source material, and that uploading copyrighted
      content violates Luma's Terms of Service; however, Luma did not respond to questions
      about whether its training data includes copyrighted materials. This incident is the
      most substantive adverse public signal in the retained source pack and remains a
      live diligence question given that broader AI copyright litigation is actively tracked
      by legal analysts including BakerHostetler's AI copyright case tracker. The April 2025
      Ray2 integration into Adobe Firefly, the May 2025 HUMAIN partnership, the November
      2025 Series C, December 2025 London office opening, and February 2026 Riyadh office
      and Publicis Groupe MENA partnership constitute a clear acceleration trajectory.
      The CNBC Disruptor 50 ranking at position 35 in May 2026 adds a third-party
      recognition marker. The main gap areas are: (a) no public revenue or ARR disclosure;
      (b) uncertainty about Alex Yu's current CTO status; (c) no board composition or
      governance structure disclosure; and (d) the ultimate scale and timeline of Project
      Halo remain subject to HUMAIN's execution.
