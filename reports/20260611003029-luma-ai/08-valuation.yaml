  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Type
      - Metric or last mark
      - Relevance to Luma
      - Limitation
    rows:
      - - Luma AI (current round)
        - Private — latest round
        - $4B post-money valuation; $900M Series C; $1.3B+ total raised
        - Direct subject company; provides current price-discovery anchor
        - No disclosed ARR, margin, or preference-stack; valuation cannot be validated
          from public economics alone.
      - - Runway ML
        - Private — last known mark
        - ~$1.5B estimated valuation; $141M raised in 2023; self-serve subscription model
        - Closest AI video pure-play; same B2C and API channels
        - Luma's $4B mark implies a ~2.7x premium to Runway's last known price; premium
          needs product and distribution evidence to justify.
      - - Stability AI
        - Private — distressed
        - Layoffs and financial stress in 2024; valuation compressed from $4B 2023 peak
        - Adverse comp showing how quickly AI generative valuations can decline
        - Different model (diffusion image) and sector; financial distress not directly
          analogous to Luma's funded position.
      - - OpenAI (Sora)
        - Private — ecosystem comp
        - OpenAI valued at $157B+ in 2025; Sora video model is direct competitive threat
          but not separately valued
        - Sets ceiling for AI model platform valuation at scale with known revenue
        - OpenAI has confirmed revenue and a multi-product portfolio; Sora alone is
          not separately extractable as a comparable.
      - - Adobe Firefly / ADBE
        - Public — integrating Luma as distribution partner
        - Adobe trades at approximately 10x revenue; Firefly is an AI creative multi-model
          marketplace that distributes Ray3
        - Provides a public-market read-through on AI creative tools at scale
        - Adobe is a mature profitable company; multiple compression vs. an early-stage
          startup is expected and the comparison is directional only.
      - - AI video market TAM (GVR 2025)
        - Analyst market data
        - $788.5M in 2025; projected $3.44B by 2033 at 20.3% CAGR
        - Defines the addressable revenue pool from which Luma must grow into its valuation
        - Luma at $4B is already priced at 5x the 2025 narrow-definition segment TAM;
          requires market-share dominance and category expansion to be justified.
    notes: >-
      Multiples and marks are approximate read-throughs using disclosed round data and
      published analyst estimates. Runway ML mark is an estimate from reported funding
      rounds, not a confirmed post-money valuation. Adobe multiple is indicative and
      directional only.
