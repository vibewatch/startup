  - id: TV003
    title: Bull, base, and bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Valuation and return logic
      - Probability signal
      - Primary downside trigger
    rows:
      - - Bull
        - >-
          Free-to-paid conversion ≥5%; Pro/Ultra ASP sustains $90-$300/mo at scale;
          HUMAIN compute pricing below market; Ray3.2 API wins three or more major
          studio integrations in 2026; copyright posture clears.
        - $4.5B-$6B fair value range on 2027-horizon; current round mark is defensible
          and there is upside to a Series D above $4B.
        - Requires diligence confirmation of economics and clean IP posture within the
          next 12 months. Public signals (Adobe global embed, Dentsu sole partner) are
          directionally consistent.
        - Competitive price collapse from Google Veo free-tier distribution or copyright
          adverse ruling creates rapid downside.
      - - Base
        - >-
          Conversion ≤3%; API and enterprise grow but face pricing pressure; HUMAIN
          arrangement is neutral rather than economically favorable; copyright risk
          is manageable but unresolved.
        - $2.5B-$4.0B range; current mark works at the upper end only after diligence
          validates acceptable revenue quality.
        - Most plausible path given public evidence. Requires data-room access to close
          the economics gap.
        - Any governance adverse finding or copyright escalation collapses this range
          toward the bear case quickly.
      - - Bear
        - >-
          Thin conversion; HUMAIN terms are dilutive; Disney v. Midjourney precedent
          expands litigation exposure; Google Veo erodes B2C pricing; Project Halo
          delays push training timeline.
        - $1.0B-$2.0B range; markdown from last round likely; down-round risk is material.
        - Becomes the base case if data room stays closed or adverse legal evidence
          surfaces before next raise.
        - Employee retention, partner hesitation, and HUMAIN renegotiation risk compound
          simultaneously in this scenario.
    notes: >-
      Ranges are scenario-based underwriting judgments anchored to public comp bands and
      disclosed financing context, not a DCF. Ranges are wide because revenue and margin
      are undisclosed. Probability signals reflect the public evidence quality, not
      a formal probability estimate.
