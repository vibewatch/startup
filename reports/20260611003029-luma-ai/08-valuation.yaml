  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue and unit economics
        - ARR, gross margin, burn rate, and revenue-recognition methodology for
          subscription, API, and enterprise segments.
        - Core missing file for underwriting any multiple at the $4B mark; without it
          the valuation is entirely speculative.
        - CFO data-room pack and auditor deck.
      - - HUMAIN governance and compute terms
        - Investment agreement, compute pricing schedule, exclusivity provisions,
          board-level conflict-of-interest management, and commercial relationship
          documentation.
        - HUMAIN is simultaneously investor, compute provider, and customer; structural
          entanglement may dilute apparent economics.
        - General counsel and lead Series C investor documentation.
      - - IP and training data posture
        - Training data licensing or fair-use legal strategy, any reserves for copyright
          exposure, and disclosure of the June 2024 Monsters Inc. incident response.
        - Bartz v. Anthropic $1.5B settlement and Disney v. Midjourney pending litigation
          make training-data posture a financial risk, not just a PR one.
        - Legal counsel; request training data category disclosure and license log.
      - - Enterprise trust infrastructure
        - SOC 2 Type II certification, published DPA, and third-party training-data
          audit results.
        - Adobe, AWS, and Dentsu Digital contracts almost certainly require these; their
          absence from the public record is a diligence gap.
        - CISO and DPO; request certification status and timeline.
      - - Retention and concentration
        - Free-to-paid conversion rate, enterprise NRR, GRR, churn, and top-customer
          revenue concentration.
        - Needed to know whether 30M users translates into durable recurring economics
          or wide-top-of-funnel without a monetizable paying cohort.
        - CFO and commercial operations team.
      - - Cap table and preference stack
        - Liquidation preferences, seniority, side letters, HUMAIN compute-for-equity
          terms if any, and any structured investor rights from the Series C.
        - Affects true downside protection and common-equity outcomes even if headline
          valuation holds.
        - CFO and lead legal counsel.
    notes: >-
      These are the minimum files required to convert Luma AI from interesting to
      underwritable at or near the $4B last-round price. Partial answers may still be
      sufficient to narrow the scenario range.
