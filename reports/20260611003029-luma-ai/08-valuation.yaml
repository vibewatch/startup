  - id: TV002
    title: Thesis and anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - Ray3/Ray3.2 reasoning capability and HDR production-grade output represent a documented technical lead over Runway and Pika.
        - Needs benchmarking evidence beyond company-claimed comparisons and must hold under competitive response from Google Veo 3.1.
      - - 30M+ users and enterprise wins at Adobe, AWS, and Dentsu Digital confirm real commercial demand beyond consumer hype.
        - Need free-to-paid conversion rate, enterprise contract values, and net revenue retention to know whether scale is monetizable.
      - - The HUMAIN Series C provides a 2GW compute infrastructure commitment that could structurally lower Luma's training and inference costs.
        - Need the compute pricing terms and exclusivity clauses to determine whether the arrangement is economically favorable or dilutive.
      - - The $4B mark is a premium to the $700-800M current AI video TAM (GVR 2025), justified if Luma captures a large share of a multi-billion market by 2030.
        - Market size estimates diverge widely (GVR $788M vs. Technavio $12.98B incremental); TAM alone cannot validate the mark.
      - - "Anti-thesis: HUMAIN is simultaneously investor, compute provider, customer, and co-developer — a structural entanglement with no clean valuation read-through."
        - Clears if HUMAIN governance, pricing, and board-level conflict management are disclosed and shown to be arms-length or favorable.
      - - "Anti-thesis: The copyright exposure established in Bartz v. Anthropic ($1.5B settlement) and pending Disney v. Midjourney litigation creates a sector-level downside risk specific to video generation."
        - Clears if Luma discloses training data licensing, demonstrates training fair-use posture, and provides legal reserve documentation.
    notes: >-
      Arguments are framed as investment claims that can move with price and diligence,
      not as static company attributes. Each anti-thesis row corresponds to a diligence
      ask in TV006.
