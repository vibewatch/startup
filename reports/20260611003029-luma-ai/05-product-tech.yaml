  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Multimodal transformer core
        - Generates video, image, and unified tokens from text, image, or video prompts
        - Trained jointly on internet-scale video, image, audio, and language data
        - Training-data provenance undisclosed; copyright litigation risk applies to this layer.
      - - Amazon SageMaker HyperPod (training)
        - GPU cluster management for large-scale model training
        - AWS infrastructure dependency for training runs
        - Single-cloud training dependency; migration to multi-cloud would require re-validation.
      - - Amazon Bedrock (inference endpoint)
        - Managed model API for enterprise buyers who prefer AWS-native access
        - AWS Bedrock marketplace and model-serving infrastructure
        - Distribution tied to AWS; loss of Bedrock listing would reduce enterprise reach.
      - - REST API + SDK layer
        - Exposes Ray and Photon models to developers; Build and Scale tiers
        - Luma's own serving infrastructure; credential management per client
        - No public status page or uptime SLA percentage; incident history undisclosed.
      - - Dream Machine front-end platform
        - Browser-based UX for consumer and enterprise creative workflows
        - Luma's own web infrastructure; third-party payment and auth services
        - No public status page or SLA; user-reported outages are not tracked publicly.
      - - ComfyUI / SDK ecosystem
        - Third-party integrations extending Luma into existing creative toolchains
        - Community-maintained ComfyUI nodes; Vercel AI SDK @ai-sdk/luma package
        - Community maintenance risk; node compatibility can lag model API changes.
