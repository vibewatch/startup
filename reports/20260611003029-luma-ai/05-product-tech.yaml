    title: Product architecture map — model and platform stack
    type: stack
    layout: wide
    summary: >-
      Luma AI's product stack runs from internet-scale training infrastructure
      at the base through model layers (Ray3.2, Ray3.14, Ray3, Uni-1) to
      platform distribution surfaces (Dream Machine, API, Bedrock, ComfyUI).
    data:
      layers:
        - label: Training infrastructure
          detail: >-
            Amazon SageMaker HyperPod for GPU cluster management; internet-scale
            multimodal data at approximately 1.2 quintillion tokens (Dream
            Machine V2); tens of petabytes of video, image, audio, and language.
        - label: Foundation model layer
          detail: >-
            Unified joint-training transformer architecture; Ray3.2 (video,
            June 2026), Ray3.14 (video, speed/cost), Ray3 (reasoning + HDR),
            Uni-1 (unified understanding + generation), Photon/Photon Flash
            (image), and research weights IMM and TVM (open on HuggingFace).
        - label: API and inference layer
          detail: >-
            REST API with Build (PAYG) and Scale (dedicated, SLA) tiers;
            Python, Node, Go, and TypeScript SDKs; Amazon Bedrock managed
            endpoint; moderation and prompt enhancement on Scale tier.
        - label: Platform distribution layer
          detail: >-
            Dream Machine (browser-based consumer/enterprise platform with Plus,
            Pro, Ultra, Team, Enterprise subscription tiers); ComfyUI custom
            nodes (212 forks); Vercel AI SDK @ai-sdk/luma npm package; Adobe
            Firefly integration (first Ray3 external partner).
    approximationNotes: >-
      This stack is an external reconstruction from official product pages, API
      documentation, AWS case study, and CEO interview. Internal layer boundaries
      and inference-serving architecture are not publicly disclosed.
