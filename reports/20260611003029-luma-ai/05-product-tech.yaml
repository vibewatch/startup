  - id: trust-safety-ip-and-competitive-context
    title: Trust, safety, IP, training data, and competitive context
    body: >-
      Luma AI's public trust surface is thinner than its product ambition. On
      the positive side, the enterprise tier explicitly promises a no-train
      guarantee—content generated or uploaded by customers is not used to train
      models—and the Scale API tier includes built-in moderation and prompt
      enhancement. The HUMAIN partnership highlights culturally aware
      guardrails, and enterprise deployments include SSO and access controls.
      However, no public trust center, status page, SOC 2 or ISO 27001
      certification list, or SLA percentage for the consumer platform is
      discoverable in the retained source set. Training data provenance is
      opaque: the company acknowledges internet-scale multimodal training on
      tens of petabytes of video data but has not published a data card,
      licensing disclosure, or opt-out mechanism. This is a sector-wide exposure
      relevant to Luma: the Copyright Alliance reported that AI training-data
      copyright lawsuits are active against multiple generative video and image
      companies as of 2025, and Baker McKenzie's case tracker logs ongoing
      litigation across the same AI creative sector. On IP, the Amplify Partners
      CEO interview references original architectural research (unified model
      training, IMM/TVM papers published on HuggingFace) and Alex Yu's
      co-founder site cites published NeRF and Plenoxels papers from Berkeley.
      These represent a real published-research lineage, though no filed patents
      were identified in the retained source set. On competitive context, Veo
      (Google DeepMind) and LTX-Video (Lightricks, open weights) represent the
      most visible direct benchmarks—Veo targets the same cinematic quality
      segment while LTX-Video's open-weight model lowers barriers for
      developer-side deployments. The training-data and IP questions are the
      most likely blocking diligence items if a licensing event or litigation
      discovery were to occur.
