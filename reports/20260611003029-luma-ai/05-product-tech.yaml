company:
  name: Luma AI
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Luma AI's product surface centers on Dream Machine—a multimodal creative
    platform—powered by a frontier video model family (Ray3.2, Ray3.14, Ray3)
    alongside a unified understanding-generation model (Uni-1) and a nascent
    Open Physical AI Lab. The technology story is credible: a transformer-based
    generative architecture trained at internet scale on Amazon SageMaker
    HyperPod and exposed through a structured REST API with a growing SDK
    ecosystem and verified enterprise integrations into Adobe Firefly and Amazon
    Bedrock. The June 2026 Ray3.2 release marks the first full Ray API
    exposure, adding multi-keyframe direction, HDR+EXR output, and Modify Video
    V2. Developer signal is modest but real—22 public GitHub repositories, a
    ComfyUI integration with 212 forks, and new Agents SDKs (Python, Node, Go,
    TypeScript) released in June 2026. Trust gaps are material: no public trust
    center, status page, SOC 2 certification, or training-data card is available
    externally; the no-train enterprise guarantee is company-claimed only; and
    copyright litigation risk from training-data sourcing is an unresolved
    sector-wide concern that applies to Luma.

sections:
  - id: product-definition-and-module-map
    title: Product definition and module map
    body: >-
      Luma AI's commercial product is built around Dream Machine, a
      browser-based creative platform that unifies text-to-video, image-to-video,
      video-to-video, image generation, and audio tools under a single
      subscription-and-credit billing surface. The underlying model family spans
      Ray3.2 (June 2026, the current flagship), Ray3.14 (January 2026, the
      speed/cost-optimised variant at 4× faster and 3× cheaper than Ray3), and
      Ray3 (September 2025, the first reasoning video model capable of native
      HDR ACES EXR output). Each generation targets the professional creative
      pipeline: native 1080p output, up to 20-second clips, multi-keyframe
      direction, and EXR exports that fit directly into Resolve and Nuke
      post-production workflows. The image-generation surface is served by
      Uni-1, Luma's first unified understanding-and-generation model announced
      alongside Ray3.2, and by Photon/Photon Flash which are available through
      the @ai-sdk/luma npm package and the Vercel AI SDK. A text-to-3D model
      called Genie was released at Series B (January 2024) and remains
      referenced in the product line but is not highlighted in the current
      principal navigation. The Open Physical AI Lab (June 2026) extends the
      research roadmap into robot-world-model generalisation on an open-science
      basis. Enterprise access adds custom fine-tuning, SSO, shared team
      credits, usage analytics, dedicated Forward Deployed Creatives, and a
      no-train guarantee. The product breadth is genuine—official pages,
      changelog entries, and news announcements corroborate each module—but the
      depth of public operator-level documentation varies widely between the
      well-evidenced video generation stack and the newer Uni-1 and Physical AI
      Lab initiatives.
