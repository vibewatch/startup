  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-artifacts-gap
      missingEvidence: >-
        A public trust center, status page, SOC 2 Type II report, or platform
        SLA percentage covering Dream Machine and the Ray3.2 API.
      whyItMatters: >-
        Enterprise buyers, regulated-industry customers, and the Scale API
        tier's implicit SLA all require independently verifiable operational
        assurances that are not currently accessible in public sources.
      diligencePath: >-
        Request trust-center exports, SOC 2 or ISO 27001 certification scope,
        uptime SLO percentile data, and incident-response runbooks under NDA
        from Luma's security and infrastructure teams.
      relatedQuestionRefs:
        - QE019
        - QE035

    - type: private-evidence-only
      severity: material
      topic: training-data-provenance
      missingEvidence: >-
        A data card or training-data disclosure naming content sources,
        licensing arrangements, opt-out mechanisms, and copyright-cleared
        data fraction for each model generation.
      whyItMatters: >-
        Active sector-wide copyright litigation makes training-data provenance
        a material legal risk. Without a public data card, external diligence
        cannot assess exposure, and a discovery order could force disclosure
        under unfavorable conditions.
      diligencePath: >-
        Request the internal training-data sourcing policy, any copyright
        agreements or licensing terms negotiated with content owners, and
        counsel's opinion on litigation exposure under NDA.
      relatedQuestionRefs:
        - QE020
        - QE021

    - type: missing-source
      severity: material
      topic: performance-benchmarks
      missingEvidence: >-
        A credible third-party benchmark comparing Ray3.2 output quality,
        motion coherence, instruction following, and latency against Veo 3.1,
        Runway Gen-4, Sora, and Kling at equivalent resolutions and prompts.
      whyItMatters: >-
        Product claims of cinematic-grade quality and professional pipeline
        readiness are company-authored; independent benchmarks are needed
        to assess real-world differentiation versus growing competition.
      diligencePath: >-
        Commission or locate academic or third-party evaluation studies, or
        request internal benchmark methodology and test-prompt sets under NDA.
      relatedQuestionRefs:
        - QE023
        - QE024

    - type: private-evidence-only
      severity: minor
      topic: api-uptime-and-reliability
      missingEvidence: >-
        Public API uptime percentages, p99 inference latency, incident history,
        and the specific SLA terms attached to the Scale dedicated-capacity tier.
      whyItMatters: >-
        Without public reliability evidence, enterprise integrators cannot
        assess operational risk before committing to Scale-tier or pipeline
        deployments.
      diligencePath: >-
        Request historical uptime reports, p99 latency benchmarks at steady-state
        load, and the full Scale-tier SLA document from Luma's partnerships team.
      relatedQuestionRefs:
        - QE004
