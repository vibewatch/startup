callouts:
  - calloutType: strength
    title: Credible professional video pipeline with HDR and EXR support
    body: >-
      Ray3 and Ray3.2 output native 16-bit HDR in ACES2065-1 EXR format,
      enabling direct compositing in Resolve and Nuke. This is a verifiable
      technical differentiator against most competing models, supported by
      official documentation and corroborated by Adobe's Firefly integration.
    claimRefs:
      - CE003
      - CE004
      - CE015
      - CE021

  - calloutType: risk
    title: Training-data provenance is opaque and carries active copyright exposure
    body: >-
      Luma has not published a training-data card, licensing disclosure, or
      opt-out mechanism. The CEO acknowledges training on tens of petabytes of
      internet-sourced multimodal data. Active copyright litigation against AI
      training-data practices in the creative sector, documented by the Copyright
      Alliance and Baker McKenzie, makes this a material unresolved diligence item.
    claimRefs:
      - CE035
      - CE036
      - CE037
      - CE038
      - CE039

