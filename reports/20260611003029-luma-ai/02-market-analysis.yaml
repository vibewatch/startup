  - id: buyer-segmentation
    title: Buyer, user, and payer segmentation across priority channels
    body: >-
      The AI video generation market segments into five buyer archetypes that differ in
      budget ownership, adoption trigger, and willingness to pay for professional-quality
      output. Enterprise creative agencies and global advertising networks represent the
      highest-value buyer: Serviceplan Group, Europe's largest independent agency group
      with 6,500 employees across 43 locations, contracted Luma AI as its AI technology
      partner in February 2026 specifically to compress production timelines and increase
      throughput across multi-market campaigns. Publicis Groupe Middle East named Luma AI
      its generative AI creative partner in the same month, and Dentsu Digital became a
      sole launch partner in Japan for Ray3 in September 2025. These deals establish that
      the agency vertical is an active and high-value buyer in 2026. Film and commercial
      production studios are a second segment, evidenced by Boundless producing Mazda's
      first AI-generated commercial in South Africa in under two weeks using Luma Agents
      in April 2026, and Ray3's native HDR and 16-bit EXR output making AI-generated
      video compatible with professional post-production pipelines. Marketing and brand
      teams represent the largest application segment (33.88% of the market by spend
      according to Fortune), typically operating under campaign or brand budgets with a
      CMO or brand director as the primary budget owner. Independent creators and social
      media teams are the fastest-growing application segment (social media CAGR: 23.5%)
      and are served by Luma's consumer Plus and Pro tiers. Developer and platform builders
      represent a fifth segment: companies embedding AI video into their own products via
      the Ray3.2 API, with Luma offering a Scale tier with dedicated capacity and latency
      SLA for production-grade workloads. Amazon Bedrock and Adobe Firefly serve as
      distribution channels that lower the integration barrier for this developer segment.
      The education segment is an emerging adjacency: Luma AI runs a formal Education
      Program with separate application flows for educators and student ambassadors at
      universities, targeting lower-friction institutional adoption.
