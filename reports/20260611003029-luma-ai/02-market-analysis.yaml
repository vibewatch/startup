  - id: TM004
    title: Growth drivers and adoption constraints
    columns:
      - Driver or constraint
      - Direction
      - Timing
      - Implication for Luma AI
      - Diligence ask
    rows:
      - - Video content dominates internet traffic (>65% of mobile traffic per NTIA)
        - Driver
        - Current
        - Creates structural bottleneck in video production capacity that AI directly addresses
        - Verify whether Luma AI's production customers cite volume bottleneck as the primary adoption reason
      - - SME affordability and accessibility
        - Driver
        - Current and near-term (21.1% projected SME CAGR)
        - Consumer tiers ($30–$90/month) serve SME market without enterprise sales investment
        - Confirm whether SME segment generates meaningful subscription revenue vs. enterprise deals
      - - Rise of virtual influencers and synthetic brand spokespersons
        - Driver
        - Medium-term
        - Expands use-case surface beyond content replacement into always-on brand representation
        - Assess whether Luma AI's product roadmap explicitly targets synthetic spokesperson workflows
      - - Adobe and Amazon Bedrock distribution partnerships
        - Driver
        - Current
        - Reduces barrier for enterprise creative teams to discover and trial Luma AI models
        - Quantify model usage via these channels vs. direct API and subscription
      - - OpenAI Sora discontinuation (April 2026)
        - Driver
        - Current (near-term tailwind)
        - Removes one well-funded consumer AI video competitor; may redirect user demand to Runway, Kling, or Luma
        - Monitor whether Luma AI's user acquisition or API trial volumes increased post-April 2026
      - - IP and copyright uncertainty (U.S. D.C. Circuit, March 2025)
        - Constraint
        - Current and persistent
        - Enterprise legal teams must clear AI-generated content IP risk before production-scale deployment
        - Determine how Luma AI's "no training on your content" guarantee and commercial-use license address legal risk
      - - Regulatory fragmentation across jurisdictions
        - Constraint
        - Current and worsening
        - EU AI Act, deepfake labeling, and national content authenticity rules increase compliance overhead for global agencies
        - Assess Luma AI's trust and safety and compliance roadmap for GDPR and EU AI Act
      - - Multi-model aggregator competition from Adobe Firefly
        - Constraint
        - Current
        - Adobe's aggregator model may reduce Luma AI's direct pricing power by normalizing model-as-a-commodity
        - Monitor whether Adobe's aggregator position compresses Luma AI's per-generation revenue over time
    notes: >-
      Drivers and constraints are assessed based on published analyst reports (Grand View,
      Fortune, Technavio), public regulatory filings (U.S. D.C. Circuit Court, Copyright Office),
      and observed competitive events (OpenAI Sora discontinuation, Adobe Firefly multi-model
      launch). Timing judgments are the author's synthesis; no Luma AI internal roadmap or
      customer survey data is available to calibrate adoption speed.
