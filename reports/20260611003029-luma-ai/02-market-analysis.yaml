  - id: drivers-and-constraints
    title: Growth drivers, adoption constraints, and competitive pressure
    body: >-
      The demand case for AI video generation rests on three structural tailwinds. First,
      video commands more than 65% of global mobile internet traffic per NTIA data, creating
      a continuous production bottleneck: brands and creators need more video than traditional
      methods can efficiently supply, and AI reduces the time and cost of production
      significantly. Second, the rise of virtual influencers and synthetic spokespeople
      enables brands to create 24/7 digital representatives without production overhead,
      expanding the use-case surface for AI-generated video beyond pure content replacement.
      Third, Fortune Business Insights and Grand View Research independently identify
      SME adoption (projected 21.1% CAGR for SMEs versus 18.8% overall) as the fastest
      structural growth vector, driven by tools that give small teams professional-quality
      output at consumer-grade prices.
      The primary adoption constraint in 2026 is intellectual property and copyright
      uncertainty. The U.S. D.C. Circuit Court of Appeals affirmed in March 2025 that
      the Copyright Act requires human authorship for copyright protection, establishing
      that purely AI-generated content cannot be copyrighted. The U.S. Copyright Office
      further concluded in January 2025 that prompts alone do not provide sufficient human
      creative control to establish authorship. For enterprise buyers in advertising,
      entertainment, and branded content—Luma AI's highest-value segment—these rulings
      create material IP provenance risk that legal teams must clear before approving
      production-scale AI video deployment. Regulatory fragmentation across jurisdictions
      adds further friction: the EU AI Act, evolving deepfake labeling requirements, and
      varying national content authenticity laws all require compliance monitoring.
      Competitive pressure is also intensifying. Google DeepMind markets Veo 3.1 as a
      cinematic video model with audio, accessible via Adobe Firefly and Google's own
      platform. Kling AI (Kuaishou) offers Kling 3.0 and Kling Omni globally with
      competitive credit pricing. Pika AI offers a growing short-form video and agent
      stack. RunwayML prices its Standard plan from $12/month, well below Luma's consumer
      entry point. OpenAI discontinued Sora in April 2026, removing a well-funded
      incumbent from active competition—a notable near-term tailwind for remaining
      platforms. Adobe Firefly aggregates multiple AI video models including Veo 3.1,
      Kling AI, and Luma Ray3.2, making Adobe simultaneously a distribution partner
      and a competitive aggregator. Stability AI continues advancing in open-weight audio
      generation, signaling that the broader generative media ecosystem is expanding. The
      largest unresolved commercial gap is the absence of any public data on Luma AI's
      revenue, contract values, or renewal rates—without which the conversion of broad
      market adoption into commercial scale cannot be independently verified.
