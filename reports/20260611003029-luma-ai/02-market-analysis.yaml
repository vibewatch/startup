callouts:
  - calloutType: risk
    title: IP and copyright uncertainty is the sharpest near-term adoption constraint
    body: >-
      The D.C. Circuit ruling (March 2025) and the Copyright Office's January 2025 conclusion
      that prompts alone cannot establish authorship create a tangible IP risk that enterprise
      legal teams must resolve before approving AI video for branded commercial content.
      Luma AI's "no training on your content" and commercial-use guarantees partially address
      this, but the question of whether AI-generated output itself is protectable as IP for
      the buyer's brand remains unsettled law as of June 2026. Diligence should verify how
      large enterprise clients are managing this risk in contract terms with Luma AI.
    claimRefs:
      - CM031
      - CM032
      - CM033

  - calloutType: insight
    title: "Sora's discontinuation removes a well-funded competitor but narrows the consumer proof-of-concept market"
    body: >-
      OpenAI's decision to discontinue the Sora web and app experience in April 2026 reduces
      consumer-facing AI video competition in the short term. However, Sora also served as a
      mass-market proof-of-concept that helped legitimize AI video generation for both
      enterprise buyers and investors. Its absence may slow market category education even as
      it shifts user volume toward platforms like Luma AI, Runway, and Kling AI.
    claimRefs:
      - CM025
      - CM026

  - calloutType: assumption
    title: SAM and SOM estimates are highly approximate and not independently verified
    body: >-
      No third-party analyst has published a serviceable addressable market or serviceable
      obtainable market estimate specifically for Luma AI's cinematic/professional AI video
      segment. The $430–480M large-enterprise proxy SAM derived from Fortune Business
      Insights is a rough approximation, not a reported figure. All market sizing in this
      chapter should be treated as directional, not as investment-grade precision estimates.
    claimRefs:
      - CM006
      - CM007
      - CM009
      - CM042

