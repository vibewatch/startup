schemaVersion: report-v2
artifact: financials
slug: eavor-technologies
runDate: 2026-10-16
company:
  name: Eavor Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence points to a financing-heavy first-commercial-project phase: Eavor is trying
    to convert Geretsried's technical proof into a capital-light licensing and services model, but
    investors still lack public revenue, margin, CAC, and runway disclosures that would support a
    full underwriting case.
sections:
  - id: revenue-model
    title: Revenue model and monetization path
    body: >-
      Eavor's own 2026 Geretsried update reframes the company less as a perpetual project owner
      and more as a geothermal technology licensor that monetizes through licensing,
      engineering/technical work, specialized well and construction services after FID, and
      selected operating services, while still keeping some direct exposure where it is the
      developer, most visibly at Geretsried. That matters because the commercial quality of the
      model depends on whether future deployments move from balance-sheet-heavy project
      development toward repeatable license-and-service revenue. The public monetization evidence
      is still transitional rather than mature: Geretsried was designed as a four-loop, combined
      heat-and-power project sized for 8.2 MWe and 64 MWth, but Eavor says the first few years
      route heat into the ORC plant before district-heating sales to offtakers, including the
      local municipality, become meaningful. Public materials therefore support a credible revenue
      mechanism, but not yet a disclosed fee schedule, signed heat tariff, realized service price,
      or royalty take rate that would let investors distinguish list intent from monetized
      contract economics. [CI001][CI002][CI003][CI004][CI005][CI015]
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics
    title: Unit economics and cost structure proxies
    body: >-
      The best public operating denominators come from Geretsried's physical performance rather
      than any disclosed P&L. Eavor says Loop #1 is producing roughly 8.5 MWth, or more than
      2 MWth per lateral pair today, versus a five-year design basis of 1.3 MWth per pair. The
      same update says the current average thermal duty is 11.8 MWth and the oversized ORC plant
      is converting that heat at roughly 4.3% efficiency, implying today's electricity economics
      are still constrained by a one-loop commissioning state rather than steady-state project
      configuration. The cost case is also still FOAK-sensitive. Canary reports that the first
      eight laterals took more than 100 days in an environment where rigs can cost about
      $100,000 per day, which is exactly the kind of drilling-time exposure that can swamp early
      project returns. Offsetting that, Eavor's 2025 review says drilling time per lateral fell
      50%, bit run lengths tripled, and Rock Pipe cut well-construction costs by more than 40%.
      Those are promising learning-curve indicators, but they are not yet the same thing as
      disclosed gross margin or cash payback. [CI006][CI007][CI008][CI009][CI014][CI016]
    claimRefs: [CI006, CI007, CI008, CI009, CI014, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting blockers
    body: >-
      Public financing evidence shows Eavor can attract strategic and public-sector capital, but
      it does not yet show whether commercialization can finance itself. ThinkGeoEnergy reported
      a $182 million 2023 funding round that included $90 million from Canada Growth Fund, and
      Eavor's 2025 review says CGF later announced a further CAD 138 million commitment. The
      company's own December 2025 milestone release adds project-level support in the form of an
      InvestEU-guaranteed loan of nearly EUR45 million, an EU Innovation Fund grant, and bank
      backing around Geretsried. Older company-authored material also shows the pattern of
      continued external financing: a March 2023 presentation cited more than $135 million of
      private equity already raised, a Series B process underway, and a pipeline of 200-plus
      projects, while a 2021 Deep Energy announcement described a capital-raising vehicle for
      European deployments with Eavor committing EUR10 million of initial funding. That is enough
      to conclude Eavor is financeable; it is not enough to conclude capital adequacy, because
      retained public evidence still does not disclose current revenue, gross margin, customer
      concentration, signed heat prices, debt covenants, budget-to-complete, or cash runway.
      [CI010][CI011][CI012][CI013][CI014][CI015]
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
callouts:
  - calloutType: strength
    title: Licensing can improve revenue quality if Geretsried becomes a repeatable proof point
    body: >-
      The bullish financial case is not project power sales alone; it is Eavor shifting future
      deployments toward license and service revenue while partners absorb more project capital.
    claimRefs: [CI001, CI002, CI003, CI008]
  - calloutType: risk
    title: Public evidence still looks pre-underwrite
    body: >-
      Geretsried's learning curve is promising, but the public record still lacks the revenue,
      margin, tariff, and runway disclosures that would convert a technical milestone into a
      bankable company model.
    claimRefs: [CI009, CI014, CI015]
  - calloutType: recommendation
    title: Treat forward economics as scenario inputs, not validated realized margins
    body: >-
      The right diligence posture is to model licensing and services as the intended end-state,
      while treating heat pricing, project cash generation, and financing sufficiency as open
      diligence items until management provides contract and cash data.
    claimRefs: [CI003, CI004, CI011, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Technology licensing
        - Eavor-Loop deployment rights and technology transfer to third-party developers or operators
        - Per project / per licensed loop
        - Publicly described as the core scale path; no public fee schedule disclosed
        - Potentially high leverage if partner capex replaces Eavor balance-sheet ownership
        - Provide master license terms, royalty/take-rate mechanics, and exclusivity scope
      - - Engineering and technical services
        - Design, modeling, software, and technical support around loop deployment
        - Services contract
        - Publicly described as an active offering; utilization and realized pricing undisclosed
        - Likely nearer-term revenue bridge, but gross margin and staffing intensity are unknown
        - Provide service catalog, billing basis, and segment gross margin history
      - - Specialized well and construction services after FID
        - Selected drilling and construction scopes retained by Eavor after final investment decision
        - Project scope / well package
        - Publicly described in the 2026 Geretsried update; no public contract economics
        - Execution-heavy revenue that may dilute margin if Eavor keeps too much scope
        - Provide scope boundaries, subcontractor mix, and contribution margin by project
      - - Operating services and direct developer exposure
        - Operating support plus direct participation where Eavor remains a project developer
        - Operating contract / project economics
        - Geretsried remains direct exposure; public ownership and cash waterfall undisclosed
        - Highest capital exposure and least visibility on timing of cash realization
        - Provide ownership %, cash-call obligations, and operating-fee structure
    notes: >-
      Public sources define the revenue legs but not the realized pricing, margin mix, or
      contract terms for any stream. [CI001][CI002][CI003][CI015]
    claimRefs: [CI001, CI002, CI003, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Revenue leg
      - Price / unit / contract signal
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - District-heating sales from Geretsried
        - Heat is intended for district-heating offtakers, including the local municipality; exact tariff not disclosed
        - No realized public tariff or signed-volume disclosure
        - Counterparty, price formula, escalation, and contracted capacity remain undisclosed
        - SI001, SI008
      - - Geretsried power economics
        - Eavor says the path to future power competitiveness is below $75/MWh in average gradients
        - Public figure is a forward-looking economics claim, not a realized selling price
        - No public PPA, balancing-cost, or realized revenue disclosure
        - SI001
      - - Licensing / training / transfer
        - Company presentation says Eavor supports partners through technology licensing, training, and transfer
        - No public rate card or royalty schedule
        - Minimum commitments, milestone triggers, and geographic rights are undisclosed
        - SI007, SI001
      - - Specialized services
        - Engineering, technical, construction, and operating services are disclosed as revenue paths
        - No realized public day rates or service-margin disclosure
        - Staffing model, reimbursables, and partner pass-through economics are undisclosed
        - SI001
    notes: >-
      This table separates publicly described monetization mechanisms from realized pricing. Blank
      contract economics are diligence gaps, not zero values. [CI001][CI002][CI004][CI008][CI012][CI015]
    claimRefs: [CI001, CI002, CI004, CI008, CI012, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Loop #1 thermal output
        - Approximately 8.5 MWth currently; more than 2 MWth per lateral pair today versus 1.3 MWth per pair on the five-year design basis
        - High
        - Provides the public denominator for early heat and power monetization
        - Provide monthly production history, decline assumptions, and net export by season
      - - Current ORC conversion efficiency
        - Roughly 4.3% at an average 11.8 MWth because the plant is oversized for one loop
        - High
        - Shows early electricity monetization is still below the intended full-project operating point
        - Provide seasonal efficiency curve, parasitic loads, and net sold power
      - - Drilling productivity and FOAK capex pressure
        - First eight laterals took more than 100 days at about $100k/day rig cost; later drilling improved 50% and future pairs are targeted at about three weeks
        - Medium
        - Drilling time is the most visible public capex sensitivity in the model
        - Provide a well-by-well time and cost ledger with repeatability assumptions
      - - Well-construction cost improvement
        - Rock Pipe is said to reduce well-construction costs by more than 40%
        - High
        - Completion-cost compression is central to any future gross-margin story
        - Provide before/after cost stack, supplier quotes, and assumptions by geology
      - - Corporate underwriting metrics
        - Revenue, gross margin, CAC/payback, signed heat tariff, customer concentration, and cash runway are not publicly disclosed in retained evidence
        - Medium
        - Missing company-level denominators block underwriting of revenue quality and financing sufficiency
        - Provide a 2025-2026 revenue bridge, margin bridge, sales funnel, and 18-month cash plan
    notes: >-
      Public unit economics are mostly project-physics proxies rather than full company
      financials; undisclosed company metrics remain diligence blockers. [CI006][CI007][CI008][CI009][CI014][CI015]
    claimRefs: [CI006, CI007, CI008, CI009, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a commercialization path that starts with Geretsried proof and
      sponsor capital, then shifts toward license and service revenue if partner-led deployments
      scale.
    data:
      nodes:
        - label: Geretsried technical proof
          detail: Thermal output, electricity generation, and drilling improvements turn the flagship into a commercial reference asset.
        - label: Sponsor and lender support
          detail: Equity, grants, and project finance keep first-commercial deployment moving while economics mature.
        - label: License Eavor-Loop
          detail: Eavor says licensing is the long-run core scale path for global deployment.
        - label: Deliver specialized services
          detail: Engineering, technical, construction, and operating scopes support partner projects after FID.
        - label: Sell heat and power from projects
          detail: Geretsried starts with electricity production and is meant to add district-heating offtake once derisked.
        - label: Shift toward cash-generative mix
          detail: The intended end-state is more capital-light license/service revenue and less direct project balance-sheet exposure.
      edges:
        - from: Geretsried technical proof
          to: Sponsor and lender support
          label: Proof point helps unlock sponsor, grant, and lender confidence
        - from: Sponsor and lender support
          to: License Eavor-Loop
          label: Capital supports commercialization beyond the flagship
        - from: License Eavor-Loop
          to: Deliver specialized services
          label: Each licensed deployment still needs Eavor know-how
        - from: Deliver specialized services
          to: Sell heat and power from projects
          label: Partner projects and Geretsried create monetizable energy output
        - from: Sell heat and power from projects
          to: Shift toward cash-generative mix
          label: Successful operating assets feed future license and service demand
    approximationNotes: >-
      This is a business-model flow rather than a cash-flow waterfall; it shows monetization
      sequence, not audited revenue shares.
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI011, CI012]
