company:
  name: Eavor Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Eavor has crossed the threshold from prototype to first commercial delivery, but the assigned public record still reads as a late-stage commercialization story rather than a transparent scaled operator. The strongest evidence is the combination of Eavor's official Geretsried launch claims, independent reporting on the 2023 capital raise and 2025 drilling economics, and a still-thin public disclosure record on valuation, revenue, customer count, headcount, and governance rights.
sections:
- id: identity-and-stage
  title: Identity, product, and current stage
  body: 'Eavor presents itself as a Calgary-based geothermal company building around the closed-loop Eavor-Loop rather than around a one-off project EPC model. The assigned official pages consistently describe a sealed working-fluid system designed to deliver dispatchable heat and power without fracking or a permeable aquifer, while independent coverage shows the company only recently crossing from pilot proof to first commercial delivery at Geretsried. That combination supports describing Eavor as a late-stage private commercialization story: the technical narrative is concrete, the first commercial milestone is real, and the operating-scale disclosure set is still sparse.'
  claimRefs:
  - CO001
  - CO007
  - CO016
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership bench, founder continuity, and governance visibility
  body: The visible public leadership record is concentrated in a small set of named operators. Mark Fitzgerald appears as the current President and CEO only after an October 2025 transition, while Jeanine Vany remains one of the clearest public founder voices explaining the company's commercialization path and technical learning curve. Older company material also shows that Eavor had already assembled a formal board and advisor network by 2023, but the assigned 2025-2026 sources do not clarify how that board evolved, what control rights strategic investors hold, or how lender governance works around Geretsried. That leaves meaningful key-person and governance diligence open even though executive functional coverage is visible.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO004
  tableRefs:
  - TO002
- id: capital-base-and-stakeholders
  title: Capital support is strategic, but the full stack is still opaque
  body: Eavor's disclosed funding support is strategically strong even if it is not yet fully transparent. The clearest public event in the assigned pool is the October 2023 C$182 million equity round led by OMV, with Canada Growth Fund, Microsoft's climate fund, Japan Energy Fund, and other existing backers participating; project-level support later expanded to include EU Innovation Fund backing and an InvestEU-guaranteed loan cited at nearly €45 million. A 2021 partnership with Deep Energy Capital also signals that Eavor sought a dedicated project-finance pathway for European deployment well before Geretsried reached first power. What remains missing is a clean public reconciliation of lifetime capital raised, preference stack, debt covenants, and stakeholder control terms.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO013
  tableRefs:
  - TO003
- id: milestones-and-execution
  title: Milestones show real progress, while execution risk remains open
  body: 'The milestone trail is credible: Eavor says it was founded in 2017, moved its Eavor-Lite pilot into construction in 2019, put that pilot into operation the same year, started Geretsried earthworks in 2022, began drilling there in 2023, and claimed first German grid power by December 2025. But the assigned pool also preserves why the investment case is still not cleanly de-risked. Canary reported that the first eight Geretsried laterals each took more than 100 days to drill, and Eavor''s own parliamentary evidence acknowledged that first-of-a-kind economics were not expected to work without financial support. Readers can therefore treat Geretsried as an authentic commercialization proof point, not as proof that the model is already repeatable on fully disclosed economics.'
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO014
  - CO015
  figureRefs:
  - FO001
