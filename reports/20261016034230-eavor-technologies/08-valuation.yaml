    title: Recommendation logic
    type: flow
    summary: Recommendation flows from stronger proof and funding support into a final constraint created by unresolved economics and price opacity.
    data:
      nodes:
        - label: "Commercial proof"
          detail: "Geretsried began delivering electricity to the German grid in December 2025."
        - label: "Follow-on capital"
          detail: "CGF committed up to ~C$138 million in 2025 after the $182 million 2023 equity round."
        - label: "Learning curve"
          detail: "Reported drilling time and well-construction improvements suggest future cost-down potential."
        - label: "Economic caveat"
          detail: "Independent coverage still highlights long drilling durations and uncertainty over whether flow rates and temperatures will pay off economically."
        - label: "Price opacity"
          detail: "Public sources still do not show the latest round amount, post-money valuation, or preference stack."
        - label: "Investment output"
          detail: "Research-more, high risk, valuation unknown."
      edges:
        - from: "Commercial proof"
          to: "Follow-on capital"
          label: "Proof helped sustain financing support"
        - from: "Follow-on capital"
          to: "Learning curve"
          label: "Capital funds commercialization and iteration"
        - from: "Learning curve"
          to: "Economic caveat"
          label: "Improvements help, but the cost case is not closed"
        - from: "Economic caveat"
          to: "Price opacity"
          label: "Incomplete economics make missing terms more consequential"
        - from: "Price opacity"
          to: "Investment output"
          label: "No price-backed buy case yet"
    approximationNotes: The flow is analytical rather than quantitative because the assigned public evidence does not support a numeric fair-value model.
    claimRefs: [CV001, CV003, CV004, CV005, CV008, CV010, CV012, CV015, CV016]
