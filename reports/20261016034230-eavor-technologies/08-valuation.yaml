      - ["Confidence / risk rating", "medium confidence / high risk", "The direction of progress is visible, but execution and economics remain sensitive to first-of-a-kind drilling performance."]
      - ["Valuation stance", unknown, "Wait for disclosed round terms, preference stack, and project economics before taking a price-positive view."]
    notes: Public evidence supports the qualitative call but not a numeric fair-value range because current valuation and seniority terms remain undisclosed.
    claimRefs: [CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence-supported read, What would change the view]
    rows:
      - [Thesis, "Geretsried moved Eavor from concept validation toward first commercial proof by delivering power to the German grid in December 2025.", "Sustained operating data, repeat deployment schedules, and customer conversions would strengthen this into a scale thesis."]
      - [Thesis, "Strategic/public capital stayed available after the 2023 round through CGF's up to ~C$138 million 2025 commitment.", "Disclosure that milestone capital has been drawn cleanly and without punitive structuring would reduce financing risk further."]
      - [Anti-thesis, "Public sources still do not disclose the latest round amount, post-money valuation, or liquidation preferences.", "A signed financing summary with valuation, seniority, and dilution terms would allow a real price-versus-quality judgment."]
      - [Anti-thesis, "Independent reporting still frames Eavor as a drilling and thermal-performance bet whose economics are not yet fully proven.", "Post-commissioning heat-delivery, uptime, and unit-cost evidence from Geretsried would test whether the learning curve is investable."]
    notes: Rows mix official and independent evidence; the table is analytical and therefore keeps explicit caveats in the text rather than implying a scored model.
    claimRefs: [CV001, CV003, CV004, CV008, CV010, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, "Valuation / return logic", "Probability signal", "Downside trigger"]
    rows:
      - [Bull, "Geretsried's commissioning translates into repeatable drilling cost-down, strong thermal output, and visible customer conversion in follow-on markets.", "Only then would premium growth or infrastructure-style valuation support become credible, and only after the private round terms are disclosed.", "Positive if additional projects are financed on cleaner terms after operating data is released.", "Fails if new projects require heavily structured capital or if thermal performance misses modeled output."]
      - [Base, "Eavor proves the technology but still needs more time and disclosure to show durable project economics, customer conversion, and financing efficiency.", "The correct stance remains valuation unknown, with capital deployment deferred pending evidence rather than forced into a speculative fair-value range.", "Best fits today's evidence: milestone financing plus proof point, but incomplete economics and terms.", "Any delay in converting proof into transparent economics extends the hold-and-watch posture."]
      - [Bear, "First-of-a-kind drilling complexity, capital intensity, or heat-transfer limits keep project returns below expectations and force additional financing before the model is visibly self-funding.", "That outcome would pressure valuation through down-round or preference-overhang risk rather than through a simple multiple reset.", "Supported by the still-visible cost and thermal caveats in independent coverage.", "A weak next financing or underwhelming Geretsried operating metrics would move the case here quickly."]
    notes: The scenarios are directional because the assigned public evidence does not support a numeric valuation range, current share count, or modeled target return.
    claimRefs: [CV004, CV005, CV007, CV008, CV010, CV013, CV014]
