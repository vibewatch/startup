schemaVersion: "report-v2"
artifact: valuation
slug: eavor-technologies
runDate: 2026-10-16
company:
  name: Eavor Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Eavor now has a stronger commercialization proof point than in the prior cycle because
    Geretsried began supplying electricity to the German grid in December 2025 and Canada
    Growth Fund followed its 2023 round with a new up to ~C$138 million commitment in June
    2025. But public evidence still does not show the latest round amount, current post-money
    valuation, liquidation terms, or plant-level operating economics, and independent reporting
    still frames the business as a bet on drilling execution and heat-extraction economics. The
    best-supported position is research-more, with high execution risk and an unknown valuation
    stance rather than a price-backed buy call.
sections:
  - id: commercialization-vs-price
    title: Commercial proof improved faster than pricing transparency
    body: >-
      Eavor's public case strengthened meaningfully in 2025 because the company moved from
      promising first-of-a-kind construction into first electricity at Geretsried, while still
      attracting follow-on capital from Canada Growth Fund after the 2023 equity round. That
      combination matters for valuation because it shifts the discussion from pure technical
      promise to partial commercial validation. Even so, the public record remains thin where
      investors actually need pricing discipline: Tracxn identifies a latest Series C round in
      July 2025 and reports total funding of $245 million, but the visible profile still
      withholds the amount and post-money valuation fields, and no public source in this pool
      discloses liquidation preferences, project-level debt priority, or a reconciled cash
      runway. Geretsried also benefited from an InvestEU-guaranteed loan of nearly €45 million
      and an EU Innovation Fund grant, showing that the financing stack extends beyond corporate
      equity without revealing how those claims rank against new equity. The evidence therefore
      supports a company with improving proof and financing access, but not a company whose entry
      price can be underwritten from public evidence alone.
    claimRefs: [CV001, CV002, CV003, CV004, CV009, CV010, CV011, CV012, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: scenario-framework
    title: The scenario spread is driven more by economics disclosure than by concept validity
    body: >-
      The valuation debate is no longer about whether Eavor can generate any commercial output at
      all; Geretsried's grid connection resolves that first-order question. The harder question is
      whether Eavor can repeat the design at costs and thermal performance that earn attractive
      returns once first-of-a-kind friction subsides. Eavor's 2025 review says drilling time per
      lateral fell 50% and Rock Pipe reduced well construction costs by more than 40%, which is
      directionally positive for future projects. Independent reporting still adds the necessary
      caution: Canary Media reported that the first eight lateral wells took over 100 days each,
      and Cornell's Jeff Tester sees the central challenge as whether temperatures and flow rates
      are high enough to pay off economically.
      That mix argues for a wide scenario band in which upside exists if Geretsried's learning
      curve proves portable, but downside remains significant if cost-down and heat-delivery
      assumptions do not translate into repeatable project returns.
    claimRefs: [CV004, CV005, CV007, CV008, CV013, CV016]
    tableRefs: [TV002, TV003]
  - id: decision-rule-and-diligence
    title: Public evidence supports patience, not valuation aggression
    body: >-
      A buy recommendation would require both business quality evidence and price evidence, and
      the second leg is still missing here. The sources support a credible anti-fragile thesis
      around strategic sponsorship, milestone financing, and first-of-a-kind execution, but they
      do not support a numeric fair-value range, a target return, or clean downside protection
      analysis because the current round terms and preference stack are undisclosed. The right
      public-market-style conclusion is therefore research-more with an unknown valuation stance
      and a high-risk profile. The next diligence inflection should be documentary rather than
      narrative: management should disclose the latest round amount and post-money valuation,
      preference and lender seniority terms, Geretsried unit economics after commissioning, and
      signed customer or project-conversion evidence beyond strategic enthusiasm. Without those
      items, any aggressive entry decision would rest on technology faith rather than underwritten
      valuation evidence. Tracxn's funding comparison also shows why capital raised is not a
      valuation proxy: it reports $1.12 billion of total funding for Fervo versus $245 million for
      Eavor, but neither figure supplies enterprise value, ownership, or investor return. Exit
      readiness therefore remains conditional on repeatable projects and disclosed economics, not
      merely on a well-funded peer set.
    claimRefs: [CV006, CV009, CV010, CV011, CV012, CV014]
callouts:
  - calloutType: recommendation
    title: Best-supported call
    body: Research-more is the strongest evidence-based recommendation because commercialization proof improved materially, but public sources still do not reveal the price, preference stack, or operating economics needed for a valuation-backed buy decision.
    claimRefs: [CV011, CV012]
  - calloutType: assumption
    title: What would change the view
    body: A disclosed current round price, seniority terms, and post-commissioning Geretsried economics could move the stance from unknown to supportable, while a structured down round or weak thermal economics would harden the bear case quickly.
    claimRefs: [CV008, CV010, CV013, CV014]
