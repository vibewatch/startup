          displayValue: "500,000+ people"
          unit: "people"
          note: "JETRO / Eavor screen for cities with existing fossil-fed district-heating networks."
        - label: "Industrial heat threshold"
          value: 15
          displayValue: "15 MWth"
          unit: "MWth"
          note: "Company screen for agricultural or industrial heating applications."
    approximationNotes: "Layers mix sector ceilings, demand context, project anchors, and buyer thresholds because no retained source discloses a closed-loop-only TAM/SAM/SOM."
    claimRefs: [CM004, CM006, CM012, CM013]
