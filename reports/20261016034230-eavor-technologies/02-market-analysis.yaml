company:
  name: Eavor Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Eavor's market is narrower than a generic geothermal TAM: the retained evidence points
    to dispatchable clean power, district heating, and industrial heat use cases where
    closed-loop geothermal can avoid aquifer dependence or fracking. Public sizing remains
    evidence-constrained, with only broad next-generation geothermal and heat-demand lenses
    available, so the commercial question is less whether demand exists than whether
    Geretsried proves repeatable project economics.
sections:
  - id: market-boundary
    title: Market boundary is firm heat and power, not geothermal writ large
    body: >
      The retained sources describe Eavor as a closed-loop geothermal developer selling
      dispatchable heat, cooling, and power from hot-rock sites that do not require a
      permeable aquifer, fluid exchange with the formation, or fracking. That definition
      puts Eavor in a narrower market than "all geothermal" and a very different market than
      intermittent renewables: the included spend is for 24/7 power, district heat, and
      combined heat-and-power systems where siting flexibility, low land intensity, and water
      simplicity matter. The excluded spend is the much broader pool of conventional
      hydrothermal projects that need the right reservoir and the even broader market for
      all clean generation capacity. Geretsried reinforces that boundary because the first
      commercial configuration is framed as both electricity and district heat, which points
      to municipal utilities, industrial heat users, and infrastructure sponsors as the
      practical budget owners rather than retail power buyers.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Public sizing is a stack of broad lenses rather than a closed-loop TAM model
    body: >
      Public market evidence does not provide a clean closed-loop TAM, SAM, and SOM cascade,
      so the chapter has to preserve multiple imperfect lenses instead of pretending they add
      up precisely. The broadest lens is next-generation geothermal overall: in an Eavor
      release summarizing DOE's Liftoff work, the company says next-generation geothermal
      power could grow more than 20 times by 2050 and contribute 90 GW of clean power. A
      Europe-specific demand lens is heat-heavy rather than electricity-heavy, with Eavor's
      UK parliamentary evidence saying more than half of Europe's energy use is tied to heat
      production. Eavor's own application screens then narrow the opportunity into concrete
      thresholds such as 2 MWe projects, 15 MWth industrial heat loads, and large
      district-heating cities, while Geretsried's 60-64 MWth and 8-8.2 MWe public figures
      give a project-scale anchor. Those lenses are helpful for diligence, but they are not
      additive and they do not isolate a closed-loop-only serviceable market.
    claimRefs: [CM004, CM005, CM006, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-drivers-and-constraints
    title: Early buyers are visible, but conversion still depends on economics
    body: >
      The retained sources point to three credible early-buyer clusters: municipal or utility
      heat-network sponsors, firms that need firm 24/7 clean power, and partners with
      drilling or infrastructure capability that can help replicate projects market by
      market. Independent coverage also surfaces near-term geographies where that offer may
      resonate, including Germany, Japan, and the eastern United States, especially where
      energy security or data-center growth increases the value of around-the-clock supply.
      The gating issue is not abstract interest but bankability. Independent and company
      adjacent sources alike say Geretsried still has to prove commercial-scale cost and
      financing performance, and Canary's quoted Cornell view is that temperatures and flow
      rates still need to be high enough to pay off economically. In practice, Eavor's
      adoption curve depends on converting a first-of-a-kind engineering milestone into a
      repeatable project template that financiers and offtakers will treat as routine.
    claimRefs: [CM007, CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
