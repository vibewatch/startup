      - ["Firm clean power / CHP", "Utility, IPP, or corporate offtaker", "Grid customers, commercial sites, or CHP host facilities", "Utility procurement team or contracted offtaker", "Contract long-duration geothermal output where renewables need a firm complement", "Generation procurement or PPA budget", "Need for 24/7 clean power, energy security, or flexible CHP output."]
      - ["Industrial / agricultural heat", "Industrial plant or agro-processing operator", "On-site process operators", "Facility owner", "Substitute fossil-fired thermal supply with geothermal heat or CHP", "Plant capex and energy budget", "Large steady thermal loads, especially around or above 15 MWth."]
      - ["Replication partners", "Energy major, driller, or infrastructure developer", "Project execution teams", "Partner balance sheet or project SPV", "License, co-develop, and replicate closed-loop projects market by market", "Corporate development or project-finance stack", "Confidence that Geretsried-style performance can be repeated at financeable cost."]
    notes: "Buyer roles are derived from application thresholds, project structure, and independent market commentary rather than from disclosed customer contracts."
    claimRefs: [CM006, CM007, CM008, CM010]
