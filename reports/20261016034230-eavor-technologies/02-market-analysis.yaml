      - ["District heating and cooling", "Municipal heat-network capex, offtake, and retrofit budgets", "Individual-building heating products and non-network residential spend", "Municipalities, district-heating operators, public utilities", "Geretsried and Eavor application materials frame heat networks as a primary entry wedge."]
      - ["Industrial and agricultural heat", "Process heat and CHP loads at or above Eavor's minimum thermal threshold", "Low-load or residential heat demand that cannot justify bespoke deep geothermal", "Industrial site owners, agro-processing operators", "Company application screens explicitly call out 15 MWth-scale thermal buyers."]
      - ["Project development / licensing", "Development, drilling, and technology-transfer spend for replicated geothermal projects", "Retail hardware sales or mass-market equipment distribution", "Energy majors, drilling partners, infrastructure developers", "Eavor's commercialization path relies on repeated deployments with partners, not a consumer channel."]
    notes: "Rows define the addressable jobs surfaced by the retained sources; they are strategic boundaries rather than measured revenue pools."
    claimRefs: [CM001, CM002, CM003, CM007]
