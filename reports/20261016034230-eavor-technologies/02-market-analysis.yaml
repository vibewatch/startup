      - ["Eavor written evidence to UK Parliament", "2022", "Europe", ">50% of energy use tied to heat production", null, "Demand-context statement in company-authored policy submission", "medium", "Large heat-demand pool, but not an Eavor-specific market size."]
      - ["ENKI benchmark article", "2026", "European Union", "43 GW enhanced-geothermal potential", null, "Adjacent-market lens cited alongside Eavor's heat-and-power positioning", "medium", "Enhanced geothermal is not the same as Eavor's closed-loop product."]
      - ["JETRO / Eavor case-study screen", "2023", "Dense urban heat markets", "500,000+ people for preferred district-heating entry points", null, "Company application threshold for where district heat is most attractive", "medium", "Buyer-threshold screen rather than monetary TAM."]
      - ["Public Geretsried project disclosures", "2022-2026", "Geretsried, Germany", "60-64 MWth thermal and 8-8.2 MWe electrical", null, "Project-scale anchor assembled from planning and commissioning sources", "medium", "Project disclosures drift over time, so this is not a precise denominator."]
    notes: "The table preserves the best public sizing lenses available, but the units are intentionally heterogeneous because no retained source isolates a closed-loop TAM/SAM/SOM."
    claimRefs: [CM004, CM005, CM012, CM013]
