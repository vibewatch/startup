evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: Current board composition, investor control rights, liquidation preferences, and project-lender governance terms.
    whyItMatters: >-
      These rights determine whether strategic backers can shape capital allocation, future fundraising, or downside
      outcomes during commercialization.
    diligencePath: >-
      Request the latest board roster, cap table rights summary, and any material lender or project-governance documents
      from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale-metrics
    missingEvidence: Current valuation, revenue or ARR, customer count, and headcount with dates and denominators.
    whyItMatters: >-
      Those metrics anchor scale, operating maturity, and whether Geretsried progress has translated into a repeatable
      commercial business.
    diligencePath: >-
      Ask management for the latest financing memo or board pack showing post-money valuation, booked revenue, active
      customers, and current headcount.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: closed-loop-sam-som
    missingEvidence: >-
      An independent market model that isolates closed-loop geothermal demand from broader next-generation geothermal
      and EGS categories.
    whyItMatters: >-
      Without a closed-loop-only denominator, valuation and adoption cases can be overstated by borrowing a broader
      geothermal TAM.
    diligencePath: >-
      Request third-party market work or build a bottoms-up model from district-heating loads, firm-power procurement,
      and industrial heat demand in target geographies.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-pipeline
    missingEvidence: >-
      Signed pipeline by segment, offtake terms, licensing economics, and conversion rates from first project to repeat
      deployments.
    whyItMatters: >-
      The market can look large in principle while still failing to convert if customer acquisition, project
      replication, or project finance do not scale.
    diligencePath: >-
      Obtain management pipeline data, customer LOIs or contracts, and project-level economics for post-Geretsried
      deployments.
  - type: missing-source
    severity: material
    topic: public-pricing-transparency
    missingEvidence: >-
      Public disclosures of Eavor's licensing economics, project tariffs, royalty structure, and realized customer
      pricing.
    whyItMatters: >-
      Without actual commercial terms, the chapter can compare packaging logic but cannot underwrite gross-margin
      durability or switching-cost economics.
    diligencePath: >-
      Request executed term sheets or sample commercial agreements for Geretsried, district-heat offtakes, and any
      technology-license contracts.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: repeatable-bankability
    missingEvidence: >-
      A third-party operating dataset for Loop Two plus any non-recourse or project-level financing package tied to
      replicated Eavor-Loops.
    whyItMatters: >-
      Repeatability and financing are the clearest tests of whether Eavor's first-mover proof becomes a durable moat
      instead of a one-off demonstration.
    diligencePath: Obtain Loop Two drilling and production KPI readouts and lender materials for the next financed deployment.
  - type: missing-source
    severity: material
    topic: apples-to-apples-cost
    missingEvidence: >-
      Independent LCOE or LCOH comparisons using matched assumptions across Eavor, Fervo, XGS, Sage, GreenFire, and
      conventional hydrothermal.
    whyItMatters: >-
      Most public comparison claims are architecture-level rather than like-for-like economic benchmarks, limiting
      pricing and displacement conclusions.
    diligencePath: >-
      Commission third-party techno-economic benchmarking using standardized depth, temperature, and load-factor
      assumptions.
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Current revenue, segment mix, gross margin, and any recurring-versus-project revenue breakout.
    whyItMatters: Revenue quality cannot be underwritten from project milestones alone.
    diligencePath: Request the 2025 and 2026 management P&L, segment revenue bridge, and auditor-reviewed revenue-recognition policy.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: monetization-terms
    missingEvidence: Signed heat and power offtake terms plus license, training, and service fee schedules.
    whyItMatters: Public monetization mechanisms exist, but realized pricing and customer economics do not.
    diligencePath: Request executed or near-final customer contracts, tariff formulas, and sample licensing agreements.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: blocking
    topic: capital-plan
    missingEvidence: Cash on hand, monthly burn, Geretsried budget-to-complete, debt covenants, and minimum liquidity thresholds.
    whyItMatters: Strategic capital support does not prove runway sufficiency or financing independence.
    diligencePath: Request the latest board cash forecast, debt documents, grant conditions, and project completion budget.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: Pipeline conversion, sales cycle, CAC, payback, and partner-channel economics by geography.
    whyItMatters: A licensing thesis only becomes attractive if customer acquisition and partner enablement scale efficiently.
    diligencePath: Request funnel metrics, signed-versus-pipeline projects, channel incentive terms, and win/loss analysis.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: practitioner-signal
    missingEvidence: >-
      Independent practitioner or developer-style signal on field performance, supportability, and repeat deployment
      quality.
    whyItMatters: >-
      The assigned pool can show first commercial operation, but it does not prove that the operating model is broadly
      repeatable or well supported outside company narratives.
    diligencePath: >-
      Obtain operator references, third-party engineering postmortems, conference papers from non-Eavor presenters, or
      partner operating reports from Geretsried or later sites.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-and-controls
    missingEvidence: >-
      Public evidence on cybersecurity, data/privacy controls, formal quality systems, and any relevant certifications
      for plant monitoring and control environments.
    whyItMatters: >-
      Trust and compliance are part of the chapter brief, but the assigned pool mainly covers subsurface safety claims
      rather than operational-control governance.
    diligencePath: >-
      Request security architecture, OT monitoring standards, certification packages, and internal control documentation
      for operating sites.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: steady-state-performance
    missingEvidence: Audited long-run output, uptime, decline, and maintenance data from Eavor-Lite or Geretsried.
    whyItMatters: >-
      First commercial power is important, but underwriting repeatable economics and reliability requires more than
      startup and engineering-milestone claims.
    diligencePath: >-
      Request plant-level operating reports, availability logs, maintenance history, and reconciled thermal/electrical
      output curves.
    relatedQuestionRefs:
      - QE004
      - QE007
      - QE008
  - type: missing-source
    severity: minor
    topic: roadmap-and-support
    missingEvidence: A dated public roadmap for future modules, deployment templates, and post-handover support structure.
    whyItMatters: >-
      The licensing and partner-led deployment model shifts execution risk toward field transfer, but the public
      materials do not explain support obligations in detail.
    diligencePath: >-
      Request rollout playbooks, partner QA standards, training materials, and target-state support SLAs for future
      projects.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: Public NRR, GRR, churn, renewal rates, contract duration, and top-customer concentration for 2025-2026.
    whyItMatters: >-
      Without durability metrics, customer quality is being inferred from project milestones and named counterparties
      rather than repeat economics.
    diligencePath: >-
      Request cohort retention, contract-tenor, backlog-conversion, and concentration disclosures from management and
      compare them with project-level offtake contracts.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: A complete roster of signed offtakers, heat buyers, pilot counterparties, and converted production customers.
    whyItMatters: >-
      The public record supports only a partial named counterparty list, so concentration and repeatability can be
      understated or overstated.
    diligencePath: >-
      Obtain the full commercial pipeline segmented by live site, contracted project, approved PPA, feasibility study,
      and partner-led regional program.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: project-economics
    missingEvidence: >-
      Current net electrical output, thermal delivery, availability, cost per completed loop, and project-level cash
