  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >
              决定性风险在 Geretsried 的执行，因为 Eavor 现在已经积累了足够的真实运营历史，表现不佳的重要性超过了概念层面的承诺。公司和友好的报道都确认 Geretsried 已进入部分商业运营，并仍被定位为
              8.2 MW、约 60—64 MW 热能的参考电厂；但指定来源中的反向证据显示，首个商业项目距离清晰的验证点仍很远。CleanTechnica
              称四对计划井中只有一对完成，已完成的是六条水平闭环而不是十二条；当前毛发电量可能仅勉强覆盖厂用电。由此，最重要的尽调问题很简单：Eavor 能否把 Geretsried
              从一个技术上有意思的里程碑变成可复制的资产，让第三方在无需救助式经济条件的情况下为其融资、承保并运营？如果不能，风险就不只是一个疲弱项目，而是更广泛许可战略的商业化叙事失效。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
