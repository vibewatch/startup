            body: >-
              Eavor 将自己定位为一家总部位于 Calgary 的地热公司，围绕闭环 Eavor-Loop 建设业务，而不是依赖一次性项目 EPC
              模式。指定的官方页面始终将其描述为一种密封工作流体系统：无需压裂或可渗透含水层，就能提供可调度的热能和电力；独立报道则显示，公司最近才在 Geretsried 从试点验证迈向首次商业交付。因此，Eavor
              可以被视为一家处于后期商业化阶段的私营公司：技术叙事具体，首次商业里程碑真实，但运营规模数据仍很稀疏。
