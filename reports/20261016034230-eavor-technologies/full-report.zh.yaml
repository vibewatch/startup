          - type: callout
            title: 最重要的尽调问题
            body: 下一步尽调应将当前 Geretsried 运营数据、伙伴义务和区域供热商业化里程碑与公开里程碑叙事逐项勾稽，再决定是否为可扩展性赋予溢价。
            calloutType: insight
            claimRefs:
              - CR002
              - CR011
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 商业验证进展快于定价透明度
        blocks:
          - type: paragraph
            body: >-
              Eavor 的公开案例在 2025 年明显增强：公司从有前景的首创建设推进到 Geretsried 首次发电，同时在 2023 年股权轮后继续吸引 Canada Growth Fund
              的追加资本。这一组合对估值很重要，因为讨论已经从纯技术承诺转向部分商业验证。即便如此，投资者真正需要定价纪律的地方仍缺少公开记录：Tracxn 认定最近一轮是 2025 年 7 月的 Series
              C，并报告总融资额为 $245 million，但可见档案仍未披露融资金额和投后估值字段；指定来源池中没有公开披露清算优先权、项目层面债务优先级或勾稽后的现金跑道。Geretsried 还获得近 €45
              million 的 InvestEU 担保贷款和 EU Innovation Fund
              资助，说明融资结构不止公司股权，却没有说明这些融资债权主张相对于新股权的排序。因此，证据支持一家验证进展和融资渠道都在改善的公司，但不支持仅凭公开证据对其入场价格进行投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: 情景差异更多由经济性披露驱动，而非概念有效性
        blocks:
          - type: paragraph
            body: >-
              估值讨论已不再是 Eavor 能否产生任何商业产出；Geretsried 并网已经回答了这个一阶问题。更难的问题是，首创摩擦消退后，Eavor 能否以足以带来有吸引力回报的成本和热性能复制该设计。Eavor
              2025 年回顾称，每条水平井钻井时间下降 50%，Rock Pipe 将井建设成本降低超过 40%，这对未来项目具有积极方向。独立报道仍提供必要的谨慎：Canary Media 报道前八条水平井每条耗时超过
              100 天，Cornell 的 Jeff Tester 则认为核心挑战是温度和流量是否足以产生经济回报。综合来看，情景区间应当较宽：如果 Geretsried
              的学习曲线可迁移，上行空间存在；但如果降本和供热假设无法转化为可复制的项目回报，下行风险仍然显著。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: 公开证据支持耐心，而非激进估值
        blocks:
          - type: paragraph
            body: >-
              买入建议需要业务质量证据和价格证据，而后者在这里仍缺失。来源支持围绕战略赞助、里程碑融资和首创执行的可信抗脆弱逻辑，但由于当前轮次条款和优先股堆叠未披露，无法支持数值公允价值区间、目标回报或清晰的下行保护分析。因此，符合公开市场风格的结论是继续研究，估值立场未知，风险较高。下一次尽调突破应依赖文件而非叙事：管理层应披露最近一轮融资金额和投后估值、优先权与贷款方级次条款、Geretsried
              调试后的单位经济性，以及超出战略热情的已签客户或项目转化证据。没有这些信息，任何激进的入场决定都建立在技术信念而非可支撑的估值证据之上。Tracxn 的融资对比也说明融资额不是估值代理：其报告 Fervo 总融资
              $1.12 billion，Eavor 为 $245 million，但两者都不能提供企业价值、所有权或投资者回报。因此，退出准备度仍取决于可复制项目和已披露经济性，而不只是同行资本充足。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 证据最充分的判断
            body: 继续研究是证据最充分的建议：商业化验证明显改善，但公开来源仍未揭示估值支撑买入决策所需的价格、优先股堆叠或运营经济性。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
          - type: callout
            title: 哪些信息会改变判断
            body: 如果披露当前轮次价格、级次条款和调试后 Geretsried 经济性，立场可能从未知转为可支持；反之，有结构性折价融资或热能经济性疲弱，则会迅速强化悲观情景。
            calloutType: assumption
            claimRefs:
              - CV008
              - CV010
              - CV013
              - CV014
