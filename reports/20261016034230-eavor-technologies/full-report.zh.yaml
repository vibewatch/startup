              仍是最清晰的创始人声音之一，负责解释公司的商业化路径和技术学习曲线。较早的公司材料还显示，Eavor 到 2023 年已经组建了正式董事会和顾问网络，但指定的 2025—2026
              年来源没有说明董事会如何演变、战略投资者拥有哪些控制权，或 Geretsried 周边的贷款方治理如何运作。因此，尽管高管职能覆盖情况可见，关键人物和治理尽调仍有重要缺口。
