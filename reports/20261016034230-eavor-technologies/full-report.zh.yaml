      - number: '4.2'
        title: 单位经济性与成本结构代理指标
        blocks:
          - type: paragraph
            body: >-
              最好的公开运营分母来自 Geretsried 的实体表现，而非任何已披露的损益表。Eavor 称，Loop #1 目前产出约 8.5 MWth，即每对水平井超过 2 MWth，而五年设计基准为每对 1.3
              MWth。同一份更新称，当前平均热负荷为 11.8 MWth，超大 ORC 电厂将这些热能转化为电力的效率约为 4.3%，因此当前电力经济性仍受单回路调试状态限制，而非稳定运行的项目配置。成本逻辑也仍对 FOAK
              敏感。Canary 报道称，前八条水平井耗时超过 100 天；在钻机每天成本约 $100,000 的环境中，这正是可能吞噬早期项目回报的钻井时间敞口。另一方面，Eavor 的 2025
              年回顾称，每条水平井的钻井时间下降 50%，钻头单次进尺提高三倍，Rock Pipe 将井建设成本降低超过
              40%。这些都是有希望的学习曲线指标，但还不能等同于已披露的毛利率或现金回收期。[CI006][CI007][CI008][CI009][CI014][CI016]
