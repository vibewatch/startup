      - number: '4.3'
        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              公开融资证据显示 Eavor 能吸引战略资本和公共部门资本，但尚不足以证明商业化可以自我融资。ThinkGeoEnergy 报道称，2023 年 $182 million 融资中包括 Canada Growth
              Fund 的 $90 million；Eavor 的 2025 年回顾称，CGF 后来又宣布追加 CAD 138 million 承诺。公司 2025 年 12 月的里程碑新闻稿还披露了项目层面的支持，包括近
              EUR45 million 的 InvestEU 担保贷款、EU Innovation Fund 资助和 Geretsried 周边的银行支持。较早的公司材料也显示外部融资持续存在：2023 年 3
              月演示文稿称，公司已筹集超过 $135 million 私募股权，Series B 正在推进，并有 200+ 个项目储备；2021 年 Deep Energy 公告则描述了一个用于欧洲部署的募资载体，Eavor
              承诺投入 EUR10 million 初始资金。这足以说明 Eavor
              具备融资能力，却不足以证明资本充足，因为保留的公开证据仍未披露当前收入、毛利率、客户集中度、已签署热能价格、债务契约、完工预算或现金跑道。[CI010][CI011][CI012][CI013][CI014][CI015]
