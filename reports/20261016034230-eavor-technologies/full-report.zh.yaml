              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 首要逻辑破坏触发点
            body: 如果 Geretsried 无法从部分运营走向持续、明确为正的净产出，并实现明显更好的重复回路经济性，Eavor 的许可和扩张叙事将很难按普通项目条款融资。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
