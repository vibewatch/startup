              - CM004
              - CM006
              - CM012
              - CM013
      - number: '2.3'
        title: 早期买家已经出现，但转化仍取决于经济性
        blocks:
          - type: paragraph
            body: >
              保留的来源指向三类可信的早期买家：市政或公用事业热网赞助方、需要全天候稳定清洁电力的企业，以及拥有钻井或基础设施能力、能够在各个市场复制项目的合作伙伴。独立报道还指出了这项方案可能产生共鸣的近期地域，包括德国、日本和美国东部，尤其是能源安全或数据中心增长提高全天候供给价值的地区。真正的门槛不是抽象兴趣，而是能否获得融资。独立来源和公司相关来源都表示，Geretsried
              仍需证明商业规模的成本和融资表现；Canary 引述 Cornell 的观点称，温度和流量仍必须足够高，项目才有经济回报。实际上，Eavor
              的采用曲线取决于能否把首创工程里程碑转化为融资方和承购方视为常规的可复制项目模板。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按技术架构而非单一品牌看竞争格局
        blocks:
          - type: paragraph
            body: >
              Eavor
              的合理对比集合比地热初创公司的名单更广。只要买方已经拥有高温、可渗透且含流体的储层，传统水热地热就是现有方案，因为它已经得到商业验证，尽管面临用水、回灌和许可限制。更直接的初创竞争对手至少分成三类技术路线：Fervo
              等裂隙储层 EGS 公司，XGS 和 GreenFire 等闭环同行，以及 Sage 等相邻的地热储能或混合方案。因此，买方并非只在 Eavor 和某一家初创公司之间选择，而是在开放系统现有方案、节水闭环和
              EGS 设计之间权衡；当买方更看重储层产能而非选址灵活性时，EGS 可能扩张更快。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP015
