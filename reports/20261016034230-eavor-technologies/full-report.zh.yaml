  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - Geretsried 投产后，钻井成本持续下降、热输出强劲，并在后续市场实现可见的客户转化。
        - 只有这样，溢价增长或基础设施式估值才有可信度；而且还要等私募融资轮条款披露。
        - 运营数据发布后，若新增项目能以更干净的条款融资，则信号为正面。
        - 若新项目需要高度结构化资本，或热性能低于模型输出，则该情景失效。
      - - 基准
        - Eavor 证明技术可行，但仍需更多时间和披露来展示持久的项目经济性、客户转化和融资效率。
        - 正确立场仍是估值未知：在证据出现前暂缓投入资金，而不是硬塞进一个投机性的公允价值区间。
        - 最符合当前证据：里程碑融资加上证明点，但经济性和条款仍不完整。
        - 任何把证明转化为透明经济性的延迟，都会延长观望姿态。
      - - 悲观
        - 首个同类项目的钻井复杂度、资本密集度或传热限制令项目回报低于预期，并在模式明显实现自我造血前迫使公司追加融资。
        - 这种结果会通过下轮融资或优先权悬垂风险压低估值，而不是简单重置倍数。
        - 独立报道中仍然可见的成本和热性能限定支持这一情景。
        - 若下一轮融资疲弱，或 Geretsried 运营指标令人失望，情况会很快转向该情景。
    notes: 这些情景只提供方向性判断，因为指定的公开证据不足以支持数值化估值区间、当前股数或模型化目标回报。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV013
      - CV014
