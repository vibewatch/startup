  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐结论从更强的证明和资金支持出发，最终受未解决的经济性和价格不透明所限制。
    data:
      nodes:
        - label: 商业化证明
          detail: Geretsried 于 2025 年 12 月开始向德国电网输送电力。
        - label: 后续资本
          detail: CGF 在 2023 年 $182 million 股权融资轮后，于 2025 年承诺提供最高约 C$138 million。
        - label: 学习曲线
          detail: 据报道，钻井时间和井筒建设均有改善，显示未来存在降本潜力。
        - label: 经济性限定
          detail: 独立报道仍强调钻井周期长，并质疑流量和温度能否带来经济回报。
        - label: 价格不透明
          detail: 公开来源仍未显示最新融资额、投后估值或优先股堆叠。
        - label: 投资输出
          detail: 继续研究、高风险、估值未知。
      edges:
        - from: Commercial proof
          to: Follow-on capital
          label: 证明帮助维持融资支持
        - from: Follow-on capital
          to: Learning curve
          label: 资本为商业化和迭代提供资金
        - from: Learning curve
          to: Economic caveat
          label: 改进有帮助，但成本逻辑尚未闭合
        - from: Economic caveat
          to: Price opacity
          label: 经济性不完整，使缺失条款的影响更大
        - from: Price opacity
          to: Investment output
          label: 尚无价格支撑的买入逻辑
    approximationNotes: 该流程用于分析而非量化，因为指定的公开证据不足以支持数值化公允价值模型。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV008
      - CV010
      - CV012
      - CV015
      - CV016
