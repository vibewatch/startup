              - CR014
              - CR015
      - number: '7.2'
        title: 监管、法律与市场进入风险
        blocks:
          - type: paragraph
            body: >
              指定来源没有显示正在进行的公开诉讼或执法行动，但显示 Eavor 下一波扩张依赖尚不完整、且公开证据有限的法律和许可条件。最清晰的例子是日本：JETRO
              称，纯热能资源仍没有明确的地热法律，资源所有权也不确定。这并不会自动阻止 Eavor，但意味着项目权利、利益相关方沟通和地方审批必须逐个市场解决，不能从德国参考项目推定。Geretsried
              本身也依赖此前的许可进展、区域供热承购准备和市政建设路径。因此，监管风险不是“公司能否在某处钻井”，而是每个新司法辖区能否及时提供同样的权利、社会许可和承购准备度，以支持项目融资。
            claimRefs:
              - CR002
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR012
              - CR013
              - CR015
      - number: '7.3'
        title: 运营与商业化风险
        blocks:
          - type: paragraph
            body: >
              运营风险仍高，因为首个商业项目看起来更像学习平台，而非成熟交付模板。Canary Media 报道称，十二条水平井中的前八条每条耗时超过 100 天；Eavor
              自己的年度回顾则称，团队还要解决侧钻和水平井内液压连通问题。这些事实本身并非致命，公司也指出了加快钻井和降低 Rock Pipe 完井成本等重要缓解措施。但缓解逻辑仍由管理层主导，尚未得到独立银行级验证；在
              Geretsried 证明持续净产出、可复制回路完井，以及从首创学习走向正常项目经济性的可信路径之前，剩余风险敞口仍高。这里的终止标准不是错过公关里程碑，而是无法证明 Loop 2
              及后续回路能以明显更好的进度、性能和成本交付。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.4'
        title: 资本、伙伴与客户依赖风险
        blocks:
          - type: paragraph
            body: >
              Eavor 仍高度依赖外部资本和战略交易对手，因此同时面临集中度风险和估值风险。公司早在 2022 年就承认，没有财务支持，首个超深闭环项目预计无法实现经济可行；后续来源显示，公司继续依赖大额融资，包括 2023
              年 C$182 million 股权轮和 2025 年 Canada Growth Fund 追加的 C$138 million 承诺。商业化路径也仍由伙伴塑造：Chubu 的投资被称为日本扩张的关键，OMV
              称其向 Loop 1 提供了地下和钻井专业知识，区域供热交付仍依赖下游网络建设和承购执行。因此，即使核心物理性能改善，赞助方关系破裂、贷款方兴趣弱于预期或客户网络部署延迟，也可能拖慢增长。只有当 Eavor
              能指出并非主要由补贴支持的重复订单或里程碑合同时，这一逻辑才真正去风险。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
