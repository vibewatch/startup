  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是稳定热能和电力，而非广义地热
        blocks:
          - type: paragraph
            body: >
              保留的来源将 Eavor 描述为一家闭环地热开发商：在不需要可渗透含水层、地层流体交换或压裂的热岩场址，销售可调度的热能、制冷和电力。这个定义将 Eavor
              放在比“全部地热”更窄的市场，也与间歇性可再生能源截然不同：纳入的支出针对全天候电力、区域供热和热电联产系统，这些场景看重选址灵活性、低土地占用和用水简单。排除在外的是规模大得多的传统水热项目市场，它们需要合适的储层，以及更广泛的所有清洁发电容量市场。Geretsried
              进一步强化了这一边界，因为其首个商业配置同时面向发电和区域供热，实际预算所有者因此更可能是市政公用事业、工业热能用户和基础设施赞助方，而不是零售电力买家。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: 公开市场规模是多层宽泛视角，而非闭环 TAM 模型
        blocks:
          - type: paragraph
            body: >
              公开市场证据没有提供清晰的闭环 TAM、SAM 和 SOM 递进模型，因此本章保留多个并不完美的视角，而不是假装它们可以精确相加。最宽的视角是整体下一代地热：在总结 DOE Liftoff 工作的 Eavor
              新闻稿中，公司称下一代地热电力到 2050 年可能增长超过二十倍，并贡献 90 GW 清洁电力。欧洲特定需求的视角偏向热能而非电力，Eavor 提交给英国议会的证据称，欧洲超过一半的能源使用与产热有关。Eavor
              自己的应用筛选进一步将机会收窄为具体门槛，例如 2 MWe 项目、15 MWth 工业热负荷和大型区域供热城市；Geretsried 公开的 60—64 MWth 和 8—8.2 MWe
              数据则提供了项目规模锚点。这些视角有助于尽调，但不能相加，也没有单独界定仅闭环市场的可服务规模。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
