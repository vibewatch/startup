        title: 资本支持具有战略性，但完整资本结构仍不透明
        blocks:
          - type: paragraph
            body: >-
              Eavor 已披露的融资支持具有很强的战略性，但目前仍不完全透明。指定来源中最清晰的公开事件是 2023 年 10 月由 OMV 领投的 C$182 million 股权轮，Canada Growth
              Fund、Microsoft 的气候基金、Japan Energy Fund 及其他现有投资者参与；项目层面的支持后来又扩展到 EU Innovation Fund 资金和一笔据称接近 €45 million 的
              InvestEU 担保贷款。2021 年与 Deep Energy Capital 的合作也表明，在 Geretsried 首次发电之前很久，Eavor
              就在为欧洲部署寻找专门的项目融资路径。仍缺少的是对累计融资额、优先股堆叠、债务契约和利益相关方控制条款的清晰公开勾稽。
