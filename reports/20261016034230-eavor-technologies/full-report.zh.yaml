      - number: '3.3'
        title: 市场进入路径依赖合作伙伴和定制项目，而非目录定价
        blocks:
          - type: paragraph
            body: >
              保留来源呈现的商业化模式是基础设施承包，而不是软件式产品包装。Eavor 自己的材料和管理层评论指向区域供热网络、公用事业规模电力项目、长期 PPA 或 FIT
              结构，以及依赖外部钻井和项目执行能力的许可模式。这一点具有战略意义：帮助 Eavor
              分销的同一批公用事业、战略投资者和油气执行伙伴，也可能在热能和钻井打法更容易复制后压缩其护城河。因此，这个市场不像透明的价格战，更像一场争夺合作伙伴、融资、许可和逐个场址可信运营证明的竞赛。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 在可复制性和融资能力跟上之前，护城河的持久性仍属暂时判断
        blocks:
          - type: paragraph
            body: >
              最重要的不利信号不是 Eavor 缺少技术叙事，而是竞争对手已经沿着其他路径显露出获取需求的能力。Fervo 拥有更清晰的融资和与超大规模云服务商关联的电力证据；XGS 即使尚未完成并网验证，也已经出现大型
              Meta 关联项目的信号。Eavor
              自己的材料也暗示，只有在首次商业化执行实现规模验证后，复制项目的融资才会跟上。换言之，当前的竞争问题是：在资本更充足或扩张更快的对手占据高价值稳定电力和区域供热机会之前，Eavor
              能否把差异化架构变成可复制、可融资的部署。
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 差异化来自架构，而非分销
            body: |
              Eavor 最清晰的区隔是节水型闭环架构，适合渗透性或回灌受限的区域供热和稳定电力场址；但其市场进入仍要依靠合作伙伴、公用事业和周期较长的基础设施合同。
            calloutType: insight
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP012
          - type: callout
            title: 竞争对手获取需求的速度可能超过先发新颖性
            body: |
              Fervo 和 XGS 已经在其他地热路径上展现大型客户或融资信号，因此 Eavor 仍需要可复制的 Geretsried 式执行和后续融资，才能避免闭环的新颖性最终只剩一个技术特征。
            calloutType: risk
            claimRefs:
              - CP005
