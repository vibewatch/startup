      - number: '3.2'
        title: 在用水、地质和城市选址重要的场景，Eavor 的差异化最清晰
        blocks:
          - type: paragraph
            body: >
              指定来源中的公开证据支持一种具体但并非普遍适用的差异化逻辑。Eavor 最有力的卖点不是融资势头，而是 Eavor
              主张密封回路可以摆脱对渗透性的依赖、无需回灌和压裂，同时服务于靠近需求中心的区域供热或稳定电力场景。与传统水热方案相比，以及与仍依赖注入流体和裂隙储层的 EGS
              方案相比，这一定位具有优势。但限制也很清楚：Geretsried 只跨过了首次商业验证门槛。当买方询问 Eavor
              是否真的比另一种下一代地热架构更难替代时，可复制性、降本和多回路执行能力比最初的首次发电里程碑更重要。
            claimRefs:
