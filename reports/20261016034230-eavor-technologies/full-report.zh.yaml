        title: 里程碑显示真实进展，但执行风险仍未解除
        blocks:
          - type: paragraph
            body: >-
              里程碑链条可信：Eavor 称其于 2017 年成立，2019 年开始建设 Eavor-Lite 试点并于同年投入运行，2022 年启动 Geretsried 土建，2023 年开始钻井，并声称截至 2025 年
              12 月已实现德国首次并网发电。但指定来源也保留了投资逻辑尚未彻底去风险的原因。Canary 报道称，Geretsried 最初八条水平井每条钻井时间都超过 100 天；Eavor
              自己提交的议会证词也承认，没有财务支持，首创项目的经济性预计无法成立。因此，Geretsried 可以被视为真实的商业化验证点，但不能视为该模式已在完全披露的经济性下实现可复制的证明。
