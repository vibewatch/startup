      - - 反向论点
        - 公开来源仍未披露最新融资额、投后估值或清算优先权。
        - 若有签署版融资摘要，列明估值、优先级和稀释条款，才可能真正比较价格与质量。
      - - 反向论点
        - 独立报道仍将 Eavor 视为押注钻井和热性能的项目，其经济性尚未完全得到证明。
