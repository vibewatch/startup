  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现路径
        blocks:
          - type: paragraph
            body: >-
              Eavor 在 2026 年 Geretsried 更新中重新定义了自身角色：公司不再主要是长期持有项目的业主，而更像一家地热技术许可方，通过许可、工程和技术工作、FID
              后的专用井及施工服务，以及部分运营服务变现；在作为开发商的项目中，公司仍保留一定直接风险敞口，Geretsried
              最为明显。这一点很重要，因为模型的商业质量取决于未来部署能否从重资产负债表的项目开发，转向可复制的许可和服务收入。公开的变现证据仍处于过渡期，尚未成熟：Geretsried 按四回路热电联产项目规划，规模为
              8.2 MWe 和 64 MWth，但 Eavor 表示，最初几年会先将热能送入 ORC
              电厂，之后包括当地市政机构在内的承购方购买区域供热才会变得重要。因此，公开材料支持一种可信的收入机制，但尚未披露费率表、已签署的热能价格、实际服务价格或特许权使用费率，投资者仍无法据此区分挂牌意向与已变现的合同经济性。[CI001][CI002][CI003][CI004][CI005][CI015]
