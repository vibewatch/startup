          x: 3
          'y': 5
          detail: Geretsried 已实现首次商业闭环发电，但 Loop Two 的执行和成本可重复性仍需证明。
        - label: Fervo
          x: 5
          'y': 2
          detail: 在留存证据中融资和超大规模云厂商关联购电证明最强，但 EGS 依赖压裂和注水。
        - label: XGS
          x: 3
          'y': 4
          detail: 客户端释放出强烈的 150 MW 信号，且主打循环用水；但留存来源称其尚未并网。
        - label: GreenFire
          x: 3
          'y': 4
          detail: 已有地热井上的商业改造得到证明，但改造范围窄于完整新田块部署。
        - label: Sage
          x: 3
          'y': 3
          detail: 试点推进快，并具备储能切入点；但采用的是裂隙储层架构，而非纯封闭环路。
        - label: 常规水热地热
          x: 5
          'y': 1
          detail: 在存在高温渗透性储层的地区拥有深厚的现有运营证明，但水资源、渗透性和回灌仍决定选址，灵活性较低。
    approximationNotes: |
      点位是分析师根据留存公开证据作出的序数判断，不是厂商基准，也不是渲染器推断的排名。
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP006
      - CP007
      - CP008
      - CP015
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据指向一条商业化路径：先靠 Geretsried 的证明和发起方资本起步，若合作伙伴主导的部署实现规模化，再转向许可和服务收入。
    data:
      nodes:
        - label: Geretsried 技术证明
          detail: 热输出、发电和钻井改进，让旗舰项目成为商业参考资产。
        - label: 发起方与贷款方支持
          detail: 股权、赠款和项目融资让首个商业项目继续推进，同时等待经济性成熟。
        - label: 许可 Eavor-Loop
          detail: Eavor 表示，许可是其面向全球部署的长期核心规模化路径。
        - label: 提供专业服务
          detail: FID 后，工程、技术、建设和运营服务范围为合作伙伴项目提供支持。
        - label: 出售项目热能与电力
          detail: Geretsried 先发电，去风险后计划增加区域供热购能。
        - label: 转向现金创造型组合
          detail: 目标终局是增加轻资产的许可 / 服务收入，减少项目直接占用资产负债表。
      edges:
        - from: Geretsried technical proof
          to: Sponsor and lender support
          label: 证明点有助于赢得发起方、赠款方和贷款方信心
        - from: Sponsor and lender support
          to: License Eavor-Loop
          label: 资本支持旗舰项目以外的商业化
        - from: License Eavor-Loop
          to: Deliver specialized services
          label: 每个获许可的部署仍需 Eavor 的专业能力
        - from: Deliver specialized services
          to: Sell heat and power from projects
          label: 合作伙伴项目和 Geretsried 创造可变现的能源产出
        - from: Sell heat and power from projects
          to: Shift toward cash-generative mix
          label: 成功运营的资产带来未来许可和服务需求
    approximationNotes: 这是商业模式流程图，而非现金流瀑布图；它展示变现顺序，不代表经审计的收入占比。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI010
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 从客户购能到地下循环的闭环地热架构。
    data:
      layers:
        - label: 客户购能
          summary: Heat and power are sold into site-specific demand surfaces rather than through a generic software workflow.
          modules:
            - 区域供热网络
            - 电网购电
            - 工业热需求
          outputs:
            - 全天候热能和电力
        - label: 地面电站
          summary: Surface equipment extracts heat and either converts it to power or transfers it into a heat network.
          modules:
            - 现场电站
            - 换热器
            - 地面管道
          outputs:
            - 电力外送
            - 热量传递
        - label: 井筒几何
          summary: Commercial and demo assets both rely on vertical wells linked to multilateral laterals.
          modules:
            - 两口垂直井
            - 多分支水平井
            - AMR 引导的地下连接
          outputs:
            - 地下闭环回路
        - label: 验证与监测
          summary: Public proof today comes from technical papers, monitoring studies, and first-commercial operating updates.
          modules:
            - 地震监测研究
            - 示范与商业现场报告
            - 会议白皮书
          outputs:
            - 技术验证材料包
        - label: 地下循环
          summary: A sealed loop circulates working fluid through rock and relies on thermosiphon rather than pumps.
          modules:
            - 工作流体
            - 热虹吸
            - Rock-Pipe 密封
          outputs:
            - 通过传导收集热量
        - label: 商业转移模式
          summary: >-
            The public go-to-market path relies on partner execution rather than Eavor owning every downstream operating
            step.
          modules:
            - 向钻井合作伙伴授权
            - 按场址交付项目
            - 区域合作伙伴支持
          outputs:
            - 可复制的后续部署
    approximationNotes: null
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Eavor 的公开客户旅程始于政策或韧性需求，先按场址验证技术，之后才转化为签约供热、供电或合作伙伴主导的部署。
    data:
      items:
        - label: 需求触发
          touchpoints:
            - 欧洲能源安全与区域供热脱碳
            - 美国西部对可调度电力的需求
            - 新兴 AI 数据中心和电力受限市场的兴趣
        - label: 技术筛选
          touchpoints:
            - 场址评估与地热可行性分析
            - 围绕闭环地热与压裂地热的交易对手教育
        - label: 首个同类项目钻井
          touchpoints:
            - Geretsried 环路钻井与井筒建设
            - 水平井和钻头寿命带来的学习曲线收益
        - label: 合同签订
          touchpoints:
            - 与 Enercity 签订供热合同
            - 与 NV Energy 签订 PPA
            - 与 Sonoma Clean Power 开展 GeoZone 合作
        - label: 初步商业证明
          touchpoints:
            - Geretsried 向德国电网输送电力
            - 完全建成后区域供热规模预计为 64 MW
        - label: 扩张渠道
          touchpoints:
            - OMV 优先许可和区域部署支持
            - Deep Energy 资本形成路径
            - 瞄准日本、美国东部和 AI 关联需求
    approximationNotes: 这是根据已命名的里程碑和交易对手综合出的定性旅程，不是转化率漏斗。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在 Geretsried 产出、融资依赖和由合作伙伴塑造的商业化，而非纯粹的概念科学。
    data:
      columns:
