schemaVersion: report-v2
artifact: customers
slug: eavor-technologies
runDate: 2026-10-16
company:
  name: Eavor Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Eavor now has real adoption proof because Geretsried moved from a first-of-a-kind drillout into
    grid-connected commercial operation, but the public customer record still looks concentrated around
    a handful of anchor counterparties rather than a broad repeat-deployment base. The strongest evidence
    is named utility and partner relationships in Germany, Nevada, California, and Europe; the weakest
    evidence is retention, renewal, and concentration data, which remain largely undisclosed.
sections:
  - id: customer-segments-and-buying-motion
    title: Customer segments and buying motion
    body: >-
      The public customer picture is more segmented by use case and commercialization channel than by a
      simple utility-logo count. Eavor's own materials point to two main demand surfaces: direct-heat
      buyers in Europe and electricity buyers in the western United States, while later independent
      coverage adds AI-data-center and power-constrained markets such as Japan and the eastern United
      States. The named proof is strongest where a specific buyer, contract surface, or deployment
      geography is attached to the claim: Enercity in Hanover for district heating, NV Energy in Nevada
      for a power purchase agreement, Sonoma Clean Power for a development cooperation, and OMV plus Deep
      Energy as commercialization partners. That mix suggests Eavor is selling both project output and a
      partner-enabled deployment model, but it also means buyer/user/payer roles often sit across several
      institutions rather than in a single contracted customer account.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU010, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-named-deployments
    title: Adoption proof and named deployments
    body: >-
      The clearest proof of real adoption is Geretsried: Eavor says the site began delivering electricity
      to the German grid in December 2025, and independent coverage treats it as the first commercial
      closed-loop reference rather than a lab-scale demo. Around that anchor asset, the rest of the
      public record shows a small but meaningful set of named counterparties. Enercity is tied to a heat
      supply contract, NV Energy to a 20 MW PPA that reportedly secured regulatory approval, Sonoma Clean
      Power to a development cooperation, and OMV to a licensing and deployment partnership. Those are
      stronger than unactionable logo pages, but they are not equivalent proofs: some show live delivery,
      some show contracted intent, and some show partner access without disclosed customer revenue. The
      chapter therefore treats named counterparties as tiered proof rather than counting them as equal
      customers.
    claimRefs: [CU001, CU002, CU004, CU005, CU006, CU007, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Durability, expansion, and concentration risk
    body: >-
      Public durability evidence is still the weak point. The reviewed sources do not disclose churn,
      NRR, GRR, renewal rates, contract duration, or top-customer concentration, so there is no
      externally supportable retention curve comparable to software or power-development peers. The
      visible expansion thesis instead rests on forward indicators: a first commercial site reaching the
      grid, claimed drilling-productivity gains, partner capital and licensing structures, and reported
      interest from new geographies and data-center-linked markets. Independent coverage is also where the
      main adoption caution appears. Canary highlighted that the first eight lateral wells took more than
      100 days each and cited outside criticism that closed-loop projects still have to prove they can
      sustain temperatures and flow rates high enough to pay off economically. That means customer
      expansion may depend less on marketing demand than on whether Geretsried-style projects become
      repeatable at attractive loop-level economics.
    claimRefs: [CU009, CU011, CU012, CU013, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / strategic value
      - Gap
    rows:
      - - European district-heating utilities
        - Utility buyer; municipal or regional heat end users; payer via long-term heat offtake
        - Baseload heat for district-heating networks
        - Hanover contract cited at up to 30 MW; Geretsried also positions district heat as a core output
        - Contract economics, start date, and recurring revenue are undisclosed
      - - Western US power offtakers
        - Utility or grid-serving buyer; grid operators and retail load ultimately use the power
        - Dispatchable geothermal electricity
        - NV Energy PPA is the clearest named US power relationship; Geretsried gives an 8.2 MW reference plant
        - Public materials do not confirm live delivery under the NV Energy agreement
      - - Public-sector resilience buyers
        - Base operator / federal sponsor / project partners
        - Secure on-site energy evaluation for defense infrastructure
        - Joint Base San Antonio evaluation shows a public-sector channel beyond classic utilities
        - Evaluation is not equivalent to a production deployment or recurring customer revenue
      - - Strategic energy partners and licensors
        - OMV and Deep Energy as development and commercialization partners rather than end-load customers
        - Licensing, capital formation, and regional deployment support
        - OMV gets preferred licensing terms; Deep Energy was formed to raise capital for Eavor deployments
        - Revenue share, conversion timing, and partner concentration are not public
    notes: Public segmentation mixes live delivery, signed contracts, evaluations, and partner channels; rows are not equivalent revenue proofs.
    claimRefs: [CU003, CU004, CU006, CU007, CU008, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - First commercial customer proof
        - Geretsried began supplying electricity to the German grid
        - "2025-12-04"
        - Eavor press release; Eavor Year in Review 2025; Geothermal Canada / S&P excerpt
        - High
        - Moves Eavor from demonstration proof into live commercial delivery
        - No disclosed revenue run rate, utilization, or contract-value disclosure
      - - Full design scale of flagship site
        - 8.2 MW electric plus 64 MW district heating when fully completed
        - Late 2025
        - Canary Media
        - Medium
        - Establishes the approximate size of the first reference customer deployment
        - Capacity factor, realized output, and ramp profile remain undisclosed
      - - Drilling productivity improvement
        - First 8 laterals took over 100 days each; remaining 4 were drilled 50% faster
        - 2025
        - Canary Media; Eavor Year in Review 2025
        - Medium
        - Better drilling performance could widen the economically viable customer set
        - Public sources still lack cost per completed loop or payback by project
      - - Pipeline interest
        - Japan, eastern US, AI data centers, and multinational visitor delegations cited as follow-on demand
        - 2025-12
        - Geothermal Canada / S&P excerpt; Eavor Year in Review 2025
        - Medium
        - Shows top-of-funnel demand beyond one German site
        - No disclosed conversion rate from interest to contracted backlog
    notes: Trajectory evidence combines achieved delivery, expected design capacity, drilling-learning claims, and pipeline signals rather than a single customer-count series.
    claimRefs: [CU001, CU002, CU009, CU010, CU011, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Geretsried regional grid and district-heating market
        - German power and municipal heat market
        - First commercial Eavor-Loop delivering electricity and planned district heat
        - Early commercial production
        - Electricity started flowing to the German grid; full site is described as 8.2 MW electric and 64 MW thermal when completed
        - Still one flagship site rather than a diversified fleet
      - - Enercity AG
        - District-heating utility
        - Hanover heat supply contract
        - Contracted, not publicly evidenced as operating
        - Eavor says the contract covers up to 30 MW of geothermal heat
        - Start date, pricing, and realized volumes are not public
      - - NV Energy
        - Utility power offtaker
        - 20 MW power purchase agreement in Nevada
        - Contracted / approved, not publicly evidenced as operating
        - Eavor says the PPA was signed in 2022 and approved by the Nevada regulator in 2023
        - Public sources reviewed here do not confirm delivered power under the agreement
      - - Sonoma Clean Power
        - Community-choice / public clean-power buyer
        - GeoZone cooperation for new geothermal development
        - Cooperation / evaluation
        - Eavor says the initiative targeted up to 200 MW equivalent of geothermal development
        - Cooperation evidence is weaker than a live operating asset or signed recurring offtake
    notes: Rows reflect the named public counterparties found in assigned 2023-2025 sources, not a full customer ledger or contracted backlog disclosure.
    enumerationScope:
      coverage: partial
      basis: Public rows include only named counterparties explicitly described in assigned 2023-2025 sources, not a complete company customer roster.
    claimRefs: [CU001, CU002, CU004, CU005, CU006]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Eavor's public customer journey starts with policy or resiliency demand, moves through site-specific
      technical validation, and only then converts into contracted heat, power, or partner-led rollout.
    data:
      items:
        - label: Demand trigger
          touchpoints:
            - Energy security and district-heating decarbonization in Europe
            - Dispatchable power demand in the western United States
            - Emerging AI data-center and power-constrained market interest
        - label: Technical screening
          touchpoints:
            - Site evaluation and geothermal feasibility assessment
            - Counterparty education around closed-loop versus fracked geothermal
        - label: First-of-a-kind drilling
          touchpoints:
            - Geretsried loop drilling and well construction
            - Learning-curve gains on laterals and bit life
        - label: Contract formation
          touchpoints:
            - Heat-supply contract with Enercity
            - PPA with NV Energy
            - GeoZone cooperation with Sonoma Clean Power
        - label: Initial commercial proof
          touchpoints:
            - Electricity delivered to the German grid from Geretsried
            - District-heating scale framed at 64 MW when fully completed
        - label: Expansion channel
          touchpoints:
            - OMV preferred licensing and regional deployment support
            - Deep Energy capital-formation path
            - Targeting Japan, the eastern US, and AI-linked demand
    approximationNotes: This is a qualitative journey synthesized from named milestones and counterparties, not a conversion-rate funnel.
    claimRefs: [CU001, CU004, CU006, CU007, CU008, CU010, CU011, CU015]
callouts:
  - calloutType: strength
    title: Real commercial proof now exists
    body: >-
      Geretsried reaching the grid materially upgrades Eavor's customer story from pilot rhetoric to at
      least one live commercial reference, which makes later utility and partner conversations more credible.
    claimRefs: [CU001, CU002]
  - calloutType: risk
    title: Public durability proof remains thin
    body: >-
      The public record still lacks retention, renewal, backlog conversion, and concentration metrics, so
      customer durability is being inferred from counterparties and project milestones rather than measured
      cohort performance.
    claimRefs: [CU011, CU012, CU013, CU014]
