      - ["Surface offtake layer", "Power or district-heating operator", "Commercially demonstrated for first power export; broader rollout still early", "Can feed either electricity generation or district-heating transfer from the same closed-loop heat source", "No public O&M staffing, uptime, or service-level disclosure in the pool"]
