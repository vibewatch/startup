artifact: product-tech
slug: eavor-technologies
runDate: 2026-10-16
company:
  name: Eavor Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Eavor now has public proof that its closed-loop geothermal design can move from
    prototype to grid-connected commercial operation, and the company has disclosed
    concrete 2025 drilling and completion improvements around Geretsried. The
    product architecture is legible - sealed multilateral loops, thermosiphon
    circulation, and surface conversion/offtake equipment - but most detailed
    technical proof in this pool remains company-controlled, while repeatable
    operating data, certifications, and practitioner ecosystem evidence are still thin.
sections:
  - id: product-definition
    title: Product definition and customer job
    body: >-
      In customer workflow terms, Eavor sells a geothermal heat-and-power system
      rather than a software product: a buyer must site, drill, connect, and operate
      a closed-loop subsurface radiator that can feed either a district-heating
      network or an on-site/grid-connected power block. The German company surface
      describes the product as an underground heat exchanger with a heat-transfer
      fluid circulating in closed loops deep underground, while also claiming that
      the system does not require underground thermal water and therefore avoids the
      exploration-risk profile of conventional hydrothermal projects. The independent
      reserve article supports the commercial framing by describing Geretsried as an
      8 MW facility already sending power to the grid.
    claimRefs: [CE001, CE002, CE013]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      The disclosed operating model is built around sealed multilateral wellbores,
      circulation by thermosiphon, and surface equipment that either converts heat
      to electricity or transfers it directly into heating networks. Eavor
      Deutschland says warm and cold working fluids circulate independently in the
      loop without pumps, and it describes Rock-Pipe as the sealing method for the
      horizontal multilateral wells. At commercial scale, Eavor says Geretsried used
      two vertical wells and twelve lateral wells linked underground with its active
      magnetic ranging tool, producing six connected well pairs. That architecture is
      specific enough to diligence, but it also shows how much performance depends on
      drilling precision, completion quality, and surface-integration execution.
    claimRefs: [CE003, CE004, CE005, CE006]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity, differentiation, and current proof
    body: >-
      The strongest maturity evidence is not the original demo narrative but the
      2025-2026 combination of Geretsried startup and disclosed engineering gains.
      Eavor's year-in-review claims a 50% reduction in drilling time per lateral, a
      threefold increase in bit run length, and more than 40% lower well
      construction cost for Rock Pipe relative to conventional cemented casing.
      Eavor Deutschland also frames patents in drilling and borehole sealing as a
      core differentiator, while the company technical-resources page aggregates
      supporting material on seismic monitoring, techno-economics, dispatchability,
      and audits. Together that points to a real proprietary operating stack, but
      the assigned pool still leans heavily toward company-issued evidence rather
      than independent post-startup performance validation.
    claimRefs: [CE007, CE008, CE009, CE010, CE016]
  - id: controls-risks-and-gaps
    title: Trust, controls, and unresolved technical risk
    body: >-
      The product story includes explicit safety and quality assertions, but the
      public proof is uneven. Eavor's technical-resources page excerpts a 2025
      seismic-monitoring study that reported no detected seismicity within 30 km of
      operations during the monitored two-year period, which is directionally useful
      for the company's "no induced seismicity" thesis. At the same time, the
      independent Geothermal Canada article makes the central execution risk plain:
      closed-loop geothermal may avoid some hydrothermal tradeoffs, but extracting
      enough heat still requires a large amount of accurate drilling, and Eavor
      remains a bet on drilling improvements. The chapter therefore supports
      technical plausibility and first-commercial maturity, but not a fully
      underwritten view of repeatable operating economics, controls, or support at
      fleet scale.
    claimRefs: [CE010, CE014, CE015]
