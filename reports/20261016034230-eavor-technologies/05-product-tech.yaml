    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Deliver grid electricity from geothermal heat", "Conventional geothermal depends on hydrothermal resource access and site-specific reservoir behavior", "Closed-loop wells move heat to an on-site power plant and export electricity", "Geretsried is reported as an 8 MW facility sending power to the grid", "No public net capacity-factor, heat-rate, or uptime series in the assigned pool"]
      - ["Supply district heating", "District systems need a local steady heat source that can connect through heat-exchange equipment", "Eavor says the loop can feed a district-heating network via a heat exchanger", "German product page explicitly positions district-heating integration as a core use case", "No public customer contract structure or delivered-heat pricing in the pool"]
      - ["Reduce parasitic pumping load in lower-temperature geothermal settings", "Many geothermal systems need continuous pumping to move working fluid", "Thermosiphon circulation is designed to move fluid without pumps", "Company materials claim no energy or maintenance cost for pumps", "Assigned evidence does not include independent measured lifecycle parasitic-load data"]
      - ["Replicate deployment through partners", "Specialized drilling and operations must still be executed in each new geography", "Eavor envisions licensing its technology to oil and gas companies that handle drilling and operations", "Independent reserve coverage points to a partner-led commercialization route", "Support, QA, and transfer-learning model remain under-documented in public evidence"]
    notes: "Benefits combine company claims and one independent reserve article; missing operational denominators remain explicit rather than estimated."
    claimRefs: [CE002, CE003, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Closed-loop working fluid", "Carries heat through the underground loop and back to surface", "Stable circulation path and thermal exchange with surrounding rock", "Public materials do not disclose full fluid-management or replacement assumptions"]
      - ["Thermosiphon circulation", "Moves warm and cold fluids without pumps", "Density differential between warm and cold working fluid", "If field conditions reduce thermosiphon performance, output and economics can weaken"]
      - ["Vertical wells plus multilateral laterals", "Create the subsurface radiator and heat-exchange area", "High-precision drilling, intersection accuracy, and wellbore quality", "Commercial scale remains highly sensitive to drilling productivity and error rates"]
      - ["AMR intersection workflow", "Connects laterals underground at commercial scale", "Directional drilling execution and downhole sensing", "Repeatability outside Geretsried is not yet independently evidenced in this pool"]
      - ["Rock-Pipe sealing", "Isolates horizontal laterals from surrounding rock", "Completion quality and long-run well integrity", "Public sources do not provide long-duration failure or remediation history"]
    notes: "Architecture rows reflect the disclosed closed-loop design; several dependencies remain inferred because the assigned pool lacks an independent engineering teardown."
    claimRefs: [CE003, CE004, CE005, CE007, CE009, CE015]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Closed-loop geothermal architecture from customer offtake down to subsurface circulation.
    data:
      layers:
        - label: Customer offtake
          summary: Heat and power are sold into site-specific demand surfaces rather than through a generic software workflow.
          modules:
            - District-heating network
            - Grid-power offtake
            - Industrial heat demand
          outputs:
            - 24/7 heat and electricity
        - label: Surface plant
          summary: Surface equipment extracts heat and either converts it to power or transfers it into a heat network.
          modules:
            - On-site power plant
            - Heat exchanger
            - Surface pipeline
          outputs:
            - Electricity export
            - Heat transfer
        - label: Well geometry
          summary: Commercial and demo assets both rely on vertical wells linked to multilateral laterals.
          modules:
            - Two vertical wells
            - Multilateral lateral wells
            - AMR-guided underground connection
          outputs:
            - Closed underground circuit
        - label: Validation and monitoring
          summary: Public proof today comes from technical papers, monitoring studies, and first-commercial operating updates.
          modules:
            - Seismic monitoring study
            - Demo and commercial field reports
            - Conference white papers
          outputs:
            - Technical validation package
        - label: Subsurface circulation
          summary: A sealed loop circulates working fluid through rock and relies on thermosiphon rather than pumps.
          modules:
            - Working fluid
            - Thermosiphon
            - Rock-Pipe sealing
          outputs:
            - Heat gathered by conduction
        - label: Commercial transfer model
          summary: The public go-to-market path relies on partner execution rather than Eavor owning every downstream operating step.
          modules:
            - Licensing to drilling partners
            - Site-specific project delivery
            - Regional partner support
          outputs:
            - Replicated future deployments
    approximationNotes: null
    claimRefs: [CE001, CE003, CE004, CE005, CE006]
callouts:
  - calloutType: strength
    title: Commercial proof is now real, not hypothetical
    body: >-
      Geretsried gives Eavor a stronger product-maturity story than most
      pre-commercial geothermal peers because the assigned pool includes both the
      company's detailed design description and an independent article confirming that
      power is already being sent to the grid.
    claimRefs: [CE005, CE006, CE013]
  - calloutType: risk
    title: The product still hinges on drilling execution
    body: >-
      Even after first commercial power, the technical moat and the technical risk are
      the same thing: Eavor must keep improving drilling speed, precision, and
      completion quality for the design to scale economically across sites.
    claimRefs: [CE007, CE008, CE009, CE015]
