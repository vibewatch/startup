      - number: '6.2'
        title: Adoption proof and named deployments
        blocks:
          - type: paragraph
            body: >-
              The clearest proof of real adoption is Geretsried: Eavor says the site began delivering electricity to the
              German grid in December 2025, and independent coverage treats it as the first commercial closed-loop
              reference rather than a lab-scale demo. Around that anchor asset, the rest of the public record shows a
              small but meaningful set of named counterparties. Enercity is tied to a heat supply contract, NV Energy to
              a 20 MW PPA that reportedly secured regulatory approval, Sonoma Clean Power to a development cooperation,
              and OMV to a licensing and deployment partnership. Those are stronger than unactionable logo pages, but
              they are not equivalent proofs: some show live delivery, some show contracted intent, and some show
              partner access without disclosed customer revenue. The chapter therefore treats named counterparties as
              tiered proof rather than counting them as equal customers.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
              - CU014
