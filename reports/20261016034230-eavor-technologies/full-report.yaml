      - number: '1.4'
        title: Milestones show real progress, while execution risk remains open
        blocks:
          - type: paragraph
            body: >-
              The milestone trail is credible: Eavor says it was founded in 2017, moved its Eavor-Lite pilot into
              construction in 2019, put that pilot into operation the same year, started Geretsried earthworks in 2022,
              began drilling there in 2023, and claimed first German grid power by December 2025. But the assigned pool
              also preserves why the investment case is still not cleanly de-risked. Canary reported that the first
              eight Geretsried laterals each took more than 100 days to drill, and Eavor's own parliamentary evidence
              acknowledged that first-of-a-kind economics were not expected to work without financial support. Readers
              can therefore treat Geretsried as an authentic commercialization proof point, not as proof that the model
              is already repeatable on fully disclosed economics.
