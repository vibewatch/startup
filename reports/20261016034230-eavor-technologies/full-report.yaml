  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              The public customer picture is more segmented by use case and commercialization channel than by a simple
              utility-logo count. Eavor's own materials point to two main demand surfaces: direct-heat buyers in Europe
              and electricity buyers in the western United States, while later independent coverage adds AI-data-center
              and power-constrained markets such as Japan and the eastern United States. The named proof is strongest
              where a specific buyer, contract surface, or deployment geography is attached to the claim: Enercity in
              Hanover for district heating, NV Energy in Nevada for a power purchase agreement, Sonoma Clean Power for a
              development cooperation, and OMV plus Deep Energy as commercialization partners. That mix suggests Eavor
              is selling both project output and a partner-enabled deployment model, but it also means buyer/user/payer
              roles often sit across several institutions rather than in a single contracted customer account.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU015
          - type: table
            tableRef: TU001
