chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current stage
        blocks:
          - type: paragraph
            body: >-
              Eavor presents itself as a Calgary-based geothermal company building around the closed-loop Eavor-Loop
              rather than around a one-off project EPC model. The assigned official pages consistently describe a sealed
              working-fluid system designed to deliver dispatchable heat and power without fracking or a permeable
              aquifer, while independent coverage shows the company only recently crossing from pilot proof to first
              commercial delivery at Geretsried. That combination supports describing Eavor as a late-stage private
              commercialization story: the technical narrative is concrete, the first commercial milestone is real, and
              the operating-scale disclosure set is still sparse.
