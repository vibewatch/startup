              - CU002
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is still the weak point. The reviewed sources do not disclose churn, NRR, GRR,
              renewal rates, contract duration, or top-customer concentration, so there is no externally supportable
              retention curve comparable to software or power-development peers. The visible expansion thesis instead
              rests on forward indicators: a first commercial site reaching the grid, claimed drilling-productivity
              gains, partner capital and licensing structures, and reported interest from new geographies and
              data-center-linked markets. Independent coverage is also where the main adoption caution appears. Canary
              highlighted that the first eight lateral wells took more than 100 days each and cited outside criticism
              that closed-loop projects still have to prove they can sustain temperatures and flow rates high enough to
              pay off economically. That means customer expansion may depend less on marketing demand than on whether
              Geretsried-style projects become repeatable at attractive loop-level economics.
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real commercial proof now exists
            body: >-
              Geretsried reaching the grid materially upgrades Eavor's customer story from pilot rhetoric to at least
              one live commercial reference, which makes later utility and partner conversations more credible.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: Public durability proof remains thin
            body: >-
              The public record still lacks retention, renewal, backlog conversion, and concentration metrics, so
              customer durability is being inferred from counterparties and project milestones rather than measured
              cohort performance.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >
              The decisive risk is execution at Geretsried, because Eavor now has enough real-world operating history
              for underperformance to matter more than concept-level promise. The company and friendly coverage both
              confirm that Geretsried has reached partial commercial operation and remains positioned as an 8.2 MW /
              roughly 60-64 MW thermal reference plant, but the adverse evidence in the assigned pool says the first
              commercial build is still far from a clean proof point. CleanTechnica described only one of four planned
              well pairs as complete, six completed horizontal loops rather than twelve, and current gross electrical
              output that may only barely clear plant parasitic demand. That makes the top diligence question simple:
              can Eavor turn Geretsried from a technically interesting milestone into a repeatable asset that third
              parties will finance, insure, and operate without rescue economics. If not, the downside is not just one
              weak project; it is a broken commercialization narrative for the broader licensing strategy.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and market-entry risk
        blocks:
          - type: paragraph
            body: >
              The assigned pool does not show an active public lawsuit or enforcement action, but it does show that
              Eavor's next-wave expansion depends on legal and permitting conditions that remain incomplete or lightly
              evidenced in public. The clearest example is Japan, where JETRO says there is still no clear geothermal
              law for pure-heat resources and that ownership of the resource remains uncertain. That does not block
              Eavor automatically, but it means project rights, stakeholder engagement, and local approvals must be
              solved market by market rather than assumed from the German reference case. Geretsried itself also relied
              on prior permitting progress, planned district-heating offtake preparation, and a municipality buildout
              path, so the regulatory risk is not "can the company drill somewhere" but whether each new jurisdiction
              will provide the same combination of rights, social license, and offtake readiness in time for project
              finance.
            claimRefs:
              - CR002
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR012
              - CR013
              - CR015
      - number: '7.3'
        title: Operational and commercialization risk
        blocks:
          - type: paragraph
            body: >
              Operational risk remains high because the first commercial project still looks like a learning platform
              rather than a mature delivery template. Canary Media reported that the first eight of twelve lateral wells
              took more than 100 days to complete, while Eavor's own year-in-review says the team had to work through
              sidetracking and intra-lateral hydraulic communication problems. Those facts are not fatal on their own,
              and the company also points to meaningful mitigations such as faster drilling and lower-cost Rock Pipe
              completions. But the mitigation case is still management-led rather than independently bank-validated, so
              residual exposure remains high until Geretsried demonstrates sustained net output, repeatable loop
              completion, and a credible path from first-of-a-kind learning to normalized project economics. The kill
              criterion here is not a missed PR milestone; it is failure to show that Loop 2 and later loops can be
              delivered with materially better schedule, performance, and cost.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.4'
        title: Capital, partner, and customer dependency risk
        blocks:
          - type: paragraph
            body: >
              Eavor still depends heavily on outside capital and strategic counterparties, which raises both
              concentration risk and valuation risk. The company acknowledged as early as 2022 that the first ultra-deep
              closed-loop project was not expected to be economically viable without financial support, and later
              sources show continued reliance on large financings, including the C$182 million 2023 equity round and a
              further C$138 million Canada Growth Fund commitment in 2025. The commercialization path also remains
              partner-shaped: Chubu's investment is described as pivotal to Japan expansion, OMV says it contributed
              subsurface and drilling know-how to Loop 1, and district-heating delivery still depends on downstream
              network buildout and offtake execution. That means a failed sponsor relationship, weaker-than-expected
              lender appetite, or delayed customer network deployment could slow growth even if the core physics
              improve. The thesis only de-risks when Eavor can point to repeat orders or milestone-based contracts that
              are not primarily subsidized proof points.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              If Geretsried cannot move from partial operation to sustained, clearly net-positive output with materially
              better repeat-loop economics, Eavor's licensing and expansion story becomes much harder to finance on
              ordinary project terms.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR009
          - type: callout
            title: Most important diligence ask
            body: >-
              The next diligence step is to reconcile current Geretsried operating data, partner obligations, and
              district-heating commercialization milestones against the public milestone narrative before assigning any
              premium for scalability.
            calloutType: insight
            claimRefs:
              - CR002
              - CR011
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Commercial proof improved faster than pricing transparency
        blocks:
          - type: paragraph
            body: >-
              Eavor's public case strengthened meaningfully in 2025 because the company moved from promising
              first-of-a-kind construction into first electricity at Geretsried, while still attracting follow-on
              capital from Canada Growth Fund after the 2023 equity round. That combination matters for valuation
              because it shifts the discussion from pure technical promise to partial commercial validation. Even so,
              the public record remains thin where investors actually need pricing discipline: Tracxn identifies a
              latest Series C round in July 2025 and reports total funding of $245 million, but the visible profile
              still withholds the amount and post-money valuation fields, and no public source in this pool discloses
              liquidation preferences, project-level debt priority, or a reconciled cash runway. Geretsried also
              benefited from an InvestEU-guaranteed loan of nearly €45 million and an EU Innovation Fund grant, showing
              that the financing stack extends beyond corporate equity without revealing how those claims rank against
              new equity. The evidence therefore supports a company with improving proof and financing access, but not a
              company whose entry price can be underwritten from public evidence alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: The scenario spread is driven more by economics disclosure than by concept validity
        blocks:
          - type: paragraph
            body: >-
              The valuation debate is no longer about whether Eavor can generate any commercial output at all;
              Geretsried's grid connection resolves that first-order question. The harder question is whether Eavor can
              repeat the design at costs and thermal performance that earn attractive returns once first-of-a-kind
              friction subsides. Eavor's 2025 review says drilling time per lateral fell 50% and Rock Pipe reduced well
              construction costs by more than 40%, which is directionally positive for future projects. Independent
              reporting still adds the necessary caution: Canary Media reported that the first eight lateral wells took
              over 100 days each, and Cornell's Jeff Tester sees the central challenge as whether temperatures and flow
              rates are high enough to pay off economically. That mix argues for a wide scenario band in which upside
              exists if Geretsried's learning curve proves portable, but downside remains significant if cost-down and
              heat-delivery assumptions do not translate into repeatable project returns.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: Public evidence supports patience, not valuation aggression
        blocks:
          - type: paragraph
            body: >-
              A buy recommendation would require both business quality evidence and price evidence, and the second leg
              is still missing here. The sources support a credible anti-fragile thesis around strategic sponsorship,
              milestone financing, and first-of-a-kind execution, but they do not support a numeric fair-value range, a
              target return, or clean downside protection analysis because the current round terms and preference stack
              are undisclosed. The right public-market-style conclusion is therefore research-more with an unknown
              valuation stance and a high-risk profile. The next diligence inflection should be documentary rather than
              narrative: management should disclose the latest round amount and post-money valuation, preference and
              lender seniority terms, Geretsried unit economics after commissioning, and signed customer or
              project-conversion evidence beyond strategic enthusiasm. Without those items, any aggressive entry
              decision would rest on technology faith rather than underwritten valuation evidence. Tracxn's funding
              comparison also shows why capital raised is not a valuation proxy: it reports $1.12 billion of total
              funding for Fervo versus $245 million for Eavor, but neither figure supplies enterprise value, ownership,
              or investor return. Exit readiness therefore remains conditional on repeatable projects and disclosed
              economics, not merely on a well-funded peer set.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Best-supported call
            body: >-
              Research-more is the strongest evidence-based recommendation because commercialization proof improved
              materially, but public sources still do not reveal the price, preference stack, or operating economics
              needed for a valuation-backed buy decision.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
          - type: callout
            title: What would change the view
            body: >-
              A disclosed current round price, seniority terms, and post-commissioning Geretsried economics could move
              the stance from unknown to supportable, while a structured down round or weak thermal economics would
              harden the bear case quickly.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV010
              - CV013
              - CV014
