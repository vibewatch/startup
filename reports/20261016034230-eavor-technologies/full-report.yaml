        - 'Best fits today''s evidence: milestone financing plus proof point, but incomplete economics and terms.'
        - Any delay in converting proof into transparent economics extends the hold-and-watch posture.
      - - Bear
        - >-
          First-of-a-kind drilling complexity, capital intensity, or heat-transfer limits keep project returns below
          expectations and force additional financing before the model is visibly self-funding.
        - >-
          That outcome would pressure valuation through down-round or preference-overhang risk rather than through a
          simple multiple reset.
        - Supported by the still-visible cost and thermal caveats in independent coverage.
        - A weak next financing or underwhelming Geretsried operating metrics would move the case here quickly.
    notes: >-
      The scenarios are directional because the assigned public evidence does not support a numeric valuation range,
      current share count, or modeled target return.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV013
      - CV014
