  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is firm heat and power, not geothermal writ large
        blocks:
          - type: paragraph
            body: >
              The retained sources describe Eavor as a closed-loop geothermal developer selling dispatchable heat,
              cooling, and power from hot-rock sites that do not require a permeable aquifer, fluid exchange with the
              formation, or fracking. That definition puts Eavor in a narrower market than "all geothermal" and a very
              different market than intermittent renewables: the included spend is for 24/7 power, district heat, and
              combined heat-and-power systems where siting flexibility, low land intensity, and water simplicity matter.
              The excluded spend is the much broader pool of conventional hydrothermal projects that need the right
              reservoir and the even broader market for all clean generation capacity. Geretsried reinforces that
              boundary because the first commercial configuration is framed as both electricity and district heat, which
              points to municipal utilities, industrial heat users, and infrastructure sponsors as the practical budget
              owners rather than retail power buyers.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
      - number: '2.2'
        title: Public sizing is a stack of broad lenses rather than a closed-loop TAM model
        blocks:
          - type: paragraph
            body: >
              Public market evidence does not provide a clean closed-loop TAM, SAM, and SOM cascade, so the chapter has
              to preserve multiple imperfect lenses instead of pretending they add up precisely. The broadest lens is
              next-generation geothermal overall: in an Eavor release summarizing DOE's Liftoff work, the company says
              next-generation geothermal power could grow more than 20 times by 2050 and contribute 90 GW of clean
              power. A Europe-specific demand lens is heat-heavy rather than electricity-heavy, with Eavor's UK
              parliamentary evidence saying more than half of Europe's energy use is tied to heat production. Eavor's
              own application screens then narrow the opportunity into concrete thresholds such as 2 MWe projects, 15
              MWth industrial heat loads, and large district-heating cities, while Geretsried's 60-64 MWth and 8-8.2 MWe
              public figures give a project-scale anchor. Those lenses are helpful for diligence, but they are not
              additive and they do not isolate a closed-loop-only serviceable market.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM006
              - CM012
              - CM013
      - number: '2.3'
        title: Early buyers are visible, but conversion still depends on economics
        blocks:
          - type: paragraph
            body: >
              The retained sources point to three credible early-buyer clusters: municipal or utility heat-network
              sponsors, firms that need firm 24/7 clean power, and partners with drilling or infrastructure capability
              that can help replicate projects market by market. Independent coverage also surfaces near-term
              geographies where that offer may resonate, including Germany, Japan, and the eastern United States,
              especially where energy security or data-center growth increases the value of around-the-clock supply. The
              gating issue is not abstract interest but bankability. Independent and company adjacent sources alike say
              Geretsried still has to prove commercial-scale cost and financing performance, and Canary's quoted Cornell
              view is that temperatures and flow rates still need to be high enough to pay off economically. In
              practice, Eavor's adoption curve depends on converting a first-of-a-kind engineering milestone into a
              repeatable project template that financiers and offtakers will treat as routine.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape by architecture, not by logo alone
        blocks:
          - type: paragraph
            body: >
              The right comparison set for Eavor is broader than a shortlist of geothermal startups. Conventional
              hydrothermal remains the incumbent whenever a buyer already has access to hot, permeable, fluid-bearing
              reservoirs, because it is commercially proven even if it carries water, reinjection, and permitting
              constraints. The more direct startup rivals split into at least three technical camps: fractured-reservoir
              EGS players such as Fervo, closed-loop peers such as XGS and GreenFire, and adjacent geothermal-storage or
              hybrid approaches such as Sage. That means buyers are not choosing only between Eavor and one named
              startup; they are choosing between open-system incumbents, water-light closed loops, and EGS designs that
              may scale faster where the buyer values reservoir productivity more than siting flexibility.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP015
      - number: '3.2'
        title: Eavor's differentiation is clearest where water, geology, and urban siting matter
        blocks:
          - type: paragraph
            body: >
              Public evidence in the assigned pool supports a specific, but not universal, differentiation case. Eavor's
              strongest pitch is not raw financing momentum; it is the claim that a sealed loop can avoid permeability
              dependence, reinjection, and fracking while serving district heat or firm-power use cases near demand
              centers. That position compares well against conventional hydrothermal and against EGS approaches that
              still depend on injected fluids and fractured reservoirs. The limit is that Geretsried has only cleared
              the first commercial proof threshold. Repeatability, cost-down, and multi-loop execution still matter more
              than the initial first-power milestone when a buyer asks whether Eavor is truly harder to replace than
              another next-generation geothermal architecture.
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP015
