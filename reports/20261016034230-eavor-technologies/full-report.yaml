        title: Leadership bench, founder continuity, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The visible public leadership record is concentrated in a small set of named operators. Mark Fitzgerald
              appears as the current President and CEO only after an October 2025 transition, while Jeanine Vany remains
              one of the clearest public founder voices explaining the company's commercialization path and technical
              learning curve. Older company material also shows that Eavor had already assembled a formal board and
              advisor network by 2023, but the assigned 2025-2026 sources do not clarify how that board evolved, what
              control rights strategic investors hold, or how lender governance works around Geretsried. That leaves
              meaningful key-person and governance diligence open even though executive functional coverage is visible.
