      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is built around sealed multilateral wellbores, circulation by thermosiphon,
              and surface equipment that either converts heat to electricity or transfers it directly into heating
              networks. Eavor Deutschland says warm and cold working fluids circulate independently in the loop without
              pumps, and it describes Rock-Pipe as the sealing method for the horizontal multilateral wells. At
              commercial scale, Eavor says Geretsried used two vertical wells and twelve lateral wells linked
              underground with its active magnetic ranging tool, producing six connected well pairs. That architecture
              is specific enough to diligence, but it also shows how much performance depends on drilling precision,
              completion quality, and surface-integration execution.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
              - CE009
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: Maturity, differentiation, and current proof
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity evidence is not the original demo narrative but the 2025-2026 combination of
              Geretsried startup and disclosed engineering gains. Eavor's year-in-review claims a 50% reduction in
              drilling time per lateral, a threefold increase in bit run length, and more than 40% lower well
              construction cost for Rock Pipe relative to conventional cemented casing. Eavor Deutschland also frames
              patents in drilling and borehole sealing as a core differentiator, while the company technical-resources
              page aggregates supporting material on seismic monitoring, techno-economics, dispatchability, and audits.
              Together that points to a real proprietary operating stack, but the assigned pool still leans heavily
              toward company-issued evidence rather than independent post-startup performance validation.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE016
      - number: '5.4'
        title: Trust, controls, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              The product story includes explicit safety and quality assertions, but the public proof is uneven. Eavor's
              technical-resources page excerpts a 2025 seismic-monitoring study that reported no detected seismicity
              within 30 km of operations during the monitored two-year period, which is directionally useful for the
              company's "no induced seismicity" thesis. At the same time, the independent Geothermal Canada article
              makes the central execution risk plain: closed-loop geothermal may avoid some hydrothermal tradeoffs, but
              extracting enough heat still requires a large amount of accurate drilling, and Eavor remains a bet on
              drilling improvements. The chapter therefore supports technical plausibility and first-commercial
              maturity, but not a fully underwritten view of repeatable operating economics, controls, or support at
              fleet scale.
            claimRefs:
              - CE010
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof is now real, not hypothetical
            body: >-
              Geretsried gives Eavor a stronger product-maturity story than most pre-commercial geothermal peers because
              the assigned pool includes both the company's detailed design description and an independent article
              confirming that power is already being sent to the grid.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE013
          - type: callout
            title: The product still hinges on drilling execution
            body: >-
              Even after first commercial power, the technical moat and the technical risk are the same thing: Eavor
              must keep improving drilling speed, precision, and completion quality for the design to scale economically
              across sites.
            calloutType: risk
            claimRefs:
