      - number: '4.2'
        title: Unit economics and cost structure proxies
        blocks:
          - type: paragraph
            body: >-
              The best public operating denominators come from Geretsried's physical performance rather than any
              disclosed P&L. Eavor says Loop #1 is producing roughly 8.5 MWth, or more than 2 MWth per lateral pair
              today, versus a five-year design basis of 1.3 MWth per pair. The same update says the current average
              thermal duty is 11.8 MWth and the oversized ORC plant is converting that heat at roughly 4.3% efficiency,
              implying today's electricity economics are still constrained by a one-loop commissioning state rather than
              steady-state project configuration. The cost case is also still FOAK-sensitive. Canary reports that the
              first eight laterals took more than 100 days in an environment where rigs can cost about $100,000 per day,
              which is exactly the kind of drilling-time exposure that can swamp early project returns. Offsetting that,
              Eavor's 2025 review says drilling time per lateral fell 50%, bit run lengths tripled, and Rock Pipe cut
              well-construction costs by more than 40%. Those are promising learning-curve indicators, but they are not
              yet the same thing as disclosed gross margin or cash payback. [CI006][CI007][CI008][CI009][CI014][CI016]
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
              - CI015
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence shows Eavor can attract strategic and public-sector capital, but it does not yet
              show whether commercialization can finance itself. ThinkGeoEnergy reported a $182 million 2023 funding
              round that included $90 million from Canada Growth Fund, and Eavor's 2025 review says CGF later announced
              a further CAD 138 million commitment. The company's own December 2025 milestone release adds project-level
              support in the form of an InvestEU-guaranteed loan of nearly EUR45 million, an EU Innovation Fund grant,
              and bank backing around Geretsried. Older company-authored material also shows the pattern of continued
              external financing: a March 2023 presentation cited more than $135 million of private equity already
              raised, a Series B process underway, and a pipeline of 200-plus projects, while a 2021 Deep Energy
              announcement described a capital-raising vehicle for European deployments with Eavor committing EUR10
              million of initial funding. That is enough to conclude Eavor is financeable; it is not enough to conclude
              capital adequacy, because retained public evidence still does not disclose current revenue, gross margin,
              customer concentration, signed heat prices, debt covenants, budget-to-complete, or cash runway.
              [CI010][CI011][CI012][CI013][CI014][CI015]
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Licensing can improve revenue quality if Geretsried becomes a repeatable proof point
            body: >-
              The bullish financial case is not project power sales alone; it is Eavor shifting future deployments
              toward license and service revenue while partners absorb more project capital.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
          - type: callout
            title: Public evidence still looks pre-underwrite
            body: >-
              Geretsried's learning curve is promising, but the public record still lacks the revenue, margin, tariff,
              and runway disclosures that would convert a technical milestone into a bankable company model.
            calloutType: risk
            claimRefs:
              - CI009
              - CI014
              - CI015
          - type: callout
            title: Treat forward economics as scenario inputs, not validated realized margins
            body: >-
              The right diligence posture is to model licensing and services as the intended end-state, while treating
              heat pricing, project cash generation, and financing sufficiency as open diligence items until management
              provides contract and cash data.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer job
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Eavor sells a geothermal heat-and-power system rather than a software product:
              a buyer must site, drill, connect, and operate a closed-loop subsurface radiator that can feed either a
              district-heating network or an on-site/grid-connected power block. The German company surface describes
              the product as an underground heat exchanger with a heat-transfer fluid circulating in closed loops deep
              underground, while also claiming that the system does not require underground thermal water and therefore
              avoids the exploration-risk profile of conventional hydrothermal projects. The independent reserve article
              supports the commercial framing by describing Geretsried as an 8 MW facility already sending power to the
              grid.
            claimRefs:
              - CE001
              - CE002
              - CE013
