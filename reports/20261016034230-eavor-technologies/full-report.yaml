  - id: FM001
    title: Market sizing and adoption layers
    type: pyramid
    summary: >
      Public sizing moves from broad next-generation geothermal scenarios to narrower buyer thresholds and project
      anchors; it does not produce a closed-loop-only TAM waterfall.
    data:
      items:
        - label: Next-generation geothermal roadmap
          value: 90
          displayValue: 90 GW by 2050
          unit: GW
          note: Company-cited DOE pathway for next-generation geothermal power overall.
        - label: European enhanced-geothermal adjacency
          value: 43
          displayValue: 43 GW
          unit: GW
          note: Adjacent market reference cited in ENKI, not a closed-loop-only market.
        - label: Europe heat-demand context
          value: 50
          displayValue: '>50%'
          unit: '% of energy use'
          note: Company parliamentary evidence frames heat as the dominant European energy demand pool.
        - label: Geretsried thermal anchor
          value: 64
          displayValue: 60-64 MWth
          unit: MWth
          note: Public project disclosures vary, so the figure is shown as a range-like anchor.
        - label: Preferred urban heat entry point
          value: 500000
          displayValue: 500,000+ people
          unit: people
          note: JETRO / Eavor screen for cities with existing fossil-fed district-heating networks.
        - label: Industrial heat threshold
          value: 15
          displayValue: 15 MWth
          unit: MWth
          note: Company screen for agricultural or industrial heating applications.
    approximationNotes: >-
      Layers mix sector ceilings, demand context, project anchors, and buyer thresholds because no retained source
      discloses a closed-loop-only TAM/SAM/SOM.
    claimRefs:
      - CM004
      - CM006
      - CM012
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >
      Ordinal 1-5 scoring places alternatives by visible commercial proof and by siting flexibility or water-light
      operating profile.
    data:
      xAxis:
        label: Commercial proof and financing readiness
        min: 1
        max: 5
        lowLabel: pilot stage
        highLabel: bankability signal
      yAxis:
        label: Siting flexibility and water-light operations
        min: 1
        max: 5
        lowLabel: geology constrained
        highLabel: broadly flexible
      points:
        - label: Eavor
          x: 3
          'y': 5
          detail: >-
            First commercial closed-loop power at Geretsried, but Loop Two execution and cost repeatability still need
            proof.
        - label: Fervo
          x: 5
          'y': 2
          detail: >-
            Best visible financing and hyperscaler-linked offtake proof in the retained pool, but EGS uses fracturing
            and injected water.
        - label: XGS
          x: 3
          'y': 4
          detail: >-
            Strong 150 MW customer signal and water-recycling pitch, but the retained source says it has not yet
            connected to the grid.
        - label: GreenFire
          x: 3
          'y': 4
          detail: >-
            Commercial retrofit proof on an existing geothermal well, with narrower retrofit scope than a full new-field
            rollout.
        - label: Sage
          x: 3
          'y': 3
          detail: >-
            Fast pilot progression and storage angle, but a fractured-reservoir architecture rather than a pure sealed
            loop.
        - label: Conventional hydrothermal
          x: 5
          'y': 1
          detail: >-
            Deep incumbent operating proof where hot permeable reservoirs exist, but low flexibility because water,
            permeability, and reinjection still govern siting.
    approximationNotes: >
      Point placement is an analyst-derived ordinal read from retained public evidence, not a vendor benchmark or
      renderer-inferred ranking.
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP006
      - CP007
      - CP008
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a commercialization path that starts with Geretsried proof and sponsor capital, then
      shifts toward license and service revenue if partner-led deployments scale.
    data:
      nodes:
        - label: Geretsried technical proof
          detail: >-
            Thermal output, electricity generation, and drilling improvements turn the flagship into a commercial
            reference asset.
        - label: Sponsor and lender support
          detail: Equity, grants, and project finance keep first-commercial deployment moving while economics mature.
        - label: License Eavor-Loop
          detail: Eavor says licensing is the long-run core scale path for global deployment.
        - label: Deliver specialized services
          detail: Engineering, technical, construction, and operating scopes support partner projects after FID.
        - label: Sell heat and power from projects
          detail: Geretsried starts with electricity production and is meant to add district-heating offtake once derisked.
        - label: Shift toward cash-generative mix
          detail: >-
            The intended end-state is more capital-light license/service revenue and less direct project balance-sheet
            exposure.
      edges:
        - from: Geretsried technical proof
          to: Sponsor and lender support
          label: Proof point helps unlock sponsor, grant, and lender confidence
        - from: Sponsor and lender support
          to: License Eavor-Loop
          label: Capital supports commercialization beyond the flagship
        - from: License Eavor-Loop
          to: Deliver specialized services
          label: Each licensed deployment still needs Eavor know-how
        - from: Deliver specialized services
          to: Sell heat and power from projects
          label: Partner projects and Geretsried create monetizable energy output
        - from: Sell heat and power from projects
          to: Shift toward cash-generative mix
          label: Successful operating assets feed future license and service demand
    approximationNotes: >-
      This is a business-model flow rather than a cash-flow waterfall; it shows monetization sequence, not audited
      revenue shares.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI010
      - CI011
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Closed-loop geothermal architecture from customer offtake down to subsurface circulation.
    data:
      layers:
        - label: Customer offtake
          summary: Heat and power are sold into site-specific demand surfaces rather than through a generic software workflow.
          modules:
            - District-heating network
            - Grid-power offtake
            - Industrial heat demand
          outputs:
            - 24/7 heat and electricity
        - label: Surface plant
          summary: Surface equipment extracts heat and either converts it to power or transfers it into a heat network.
          modules:
            - On-site power plant
            - Heat exchanger
            - Surface pipeline
          outputs:
            - Electricity export
            - Heat transfer
        - label: Well geometry
          summary: Commercial and demo assets both rely on vertical wells linked to multilateral laterals.
          modules:
            - Two vertical wells
            - Multilateral lateral wells
            - AMR-guided underground connection
          outputs:
            - Closed underground circuit
        - label: Validation and monitoring
          summary: Public proof today comes from technical papers, monitoring studies, and first-commercial operating updates.
          modules:
            - Seismic monitoring study
            - Demo and commercial field reports
            - Conference white papers
          outputs:
            - Technical validation package
        - label: Subsurface circulation
          summary: A sealed loop circulates working fluid through rock and relies on thermosiphon rather than pumps.
          modules:
            - Working fluid
            - Thermosiphon
            - Rock-Pipe sealing
          outputs:
            - Heat gathered by conduction
        - label: Commercial transfer model
          summary: >-
            The public go-to-market path relies on partner execution rather than Eavor owning every downstream operating
            step.
          modules:
            - Licensing to drilling partners
            - Site-specific project delivery
            - Regional partner support
          outputs:
            - Replicated future deployments
    approximationNotes: null
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Eavor's public customer journey starts with policy or resiliency demand, moves through site-specific technical
      validation, and only then converts into contracted heat, power, or partner-led rollout.
    data:
      items:
        - label: Demand trigger
          touchpoints:
            - Energy security and district-heating decarbonization in Europe
            - Dispatchable power demand in the western United States
            - Emerging AI data-center and power-constrained market interest
        - label: Technical screening
          touchpoints:
            - Site evaluation and geothermal feasibility assessment
            - Counterparty education around closed-loop versus fracked geothermal
        - label: First-of-a-kind drilling
          touchpoints:
            - Geretsried loop drilling and well construction
            - Learning-curve gains on laterals and bit life
        - label: Contract formation
          touchpoints:
            - Heat-supply contract with Enercity
            - PPA with NV Energy
            - GeoZone cooperation with Sonoma Clean Power
        - label: Initial commercial proof
          touchpoints:
            - Electricity delivered to the German grid from Geretsried
            - District-heating scale framed at 64 MW when fully completed
        - label: Expansion channel
          touchpoints:
            - OMV preferred licensing and regional deployment support
            - Deep Energy capital-formation path
            - Targeting Japan, the eastern US, and AI-linked demand
