              - CP015
      - number: '3.3'
        title: Route to market looks partner-led and bespoke, not catalog-priced
        blocks:
          - type: paragraph
            body: >
              The commercialization pattern in retained sources is infrastructure contracting, not software-style
              packaging. Eavor's own materials and management comments point to district heat networks, utility-scale
              power projects, long-term PPA or FIT structures, and a licensing model that leans on external drilling and
              project-execution capability. That is strategically important because the same utilities, strategic
              investors, and oil-and-gas execution partners that help Eavor distribute can also compress its moat if the
              thermal and drilling playbook becomes easier to copy. The market therefore looks less like a transparent
              price war and more like a race to secure partners, financing, permits, and credible site-by-site operating
              proof.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability remains provisional until repeatability and financing catch up
        blocks:
          - type: paragraph
            body: >
              The most important adverse signal is not that Eavor lacks a technical story; it is that competitors
              already show visible demand capture on alternative pathways. Fervo has clearer financing and
              hyperscaler-linked power evidence, and XGS has a large Meta-linked project signal even before reaching
              grid proof. Eavor's own materials also imply that replication financing follows only after
              first-commercial execution is proven at scale. In other words, the current competitive question is whether
              Eavor can turn a differentiated architecture into repeatable, financeable deployment before
              better-capitalized or faster-scaling rivals occupy the highest-value firm-power and district-heat
              opportunities.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is architectural, not distribution-led
            body: >
              Eavor's clearest separation is a water-light closed-loop architecture that fits district heat and
              firm-power sites where permeability or reinjection is a constraint, but its route to market still runs
              through partners, utilities, and long-cycle infrastructure contracts.
            calloutType: insight
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP012
          - type: callout
            title: Rival demand capture can outrun first-mover novelty
            body: >
              Fervo and XGS already show large customer or financing signals on alternative geothermal pathways, so
              Eavor still needs repeatable Geretsried-style execution and follow-on financing to keep closed-loop
              novelty from becoming only a technical feature.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization path
        blocks:
          - type: paragraph
            body: >-
              Eavor's own 2026 Geretsried update reframes the company less as a perpetual project owner and more as a
              geothermal technology licensor that monetizes through licensing, engineering/technical work, specialized
              well and construction services after FID, and selected operating services, while still keeping some direct
              exposure where it is the developer, most visibly at Geretsried. That matters because the commercial
              quality of the model depends on whether future deployments move from balance-sheet-heavy project
              development toward repeatable license-and-service revenue. The public monetization evidence is still
              transitional rather than mature: Geretsried was designed as a four-loop, combined heat-and-power project
              sized for 8.2 MWe and 64 MWth, but Eavor says the first few years route heat into the ORC plant before
              district-heating sales to offtakers, including the local municipality, become meaningful. Public materials
              therefore support a credible revenue mechanism, but not yet a disclosed fee schedule, signed heat tariff,
              realized service price, or royalty take rate that would let investors distinguish list intent from
              monetized contract economics. [CI001][CI002][CI003][CI004][CI005][CI015]
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
