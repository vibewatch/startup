figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The highest residual risks cluster around Geretsried output, financing dependence, and partner-shaped commercialization rather than pure conceptual science.
    data:
      columns:
        - label: Likelihood
          detail: 12-24 month forward view
        - label: Impact
          detail: Effect on equity value and project-bankability
        - label: Mitigation maturity
          note: Higher means the company has shown a concrete countermeasure
        - label: Residual exposure
          detail: Risk remaining after current public mitigations
      rows:
        - label: Geretsried output gap
          note: Output remains the reference-plant gating issue.
          values: [High, High, Low, High]
        - label: Drilling repeatability
          note: Improvement is visible, but only on a limited sample.
          values: [Medium-High, High, Medium, Medium-High]
        - label: Subsidy / capital dependence
          note: Commercial viability still appears subsidy-shaped.
          values: [High, High, Medium, High]
        - label: Japan regulatory ambiguity
          note: Market expansion relies on unresolved resource-rights clarity.
          values: [Medium-High, Medium-High, Low, Medium-High]
        - label: Partner concentration
          note: Chubu and OMV matter disproportionately to the current story.
          values: [Medium-High, High, Medium, Medium-High]
        - label: Heat offtake / network timing
          note: Thermal monetization depends on downstream buildout.
          values: [Medium, High, Low-Medium, Medium-High]
    approximationNotes: "Qualitative matrix synthesized from assigned sources; cells summarize supported severity and mitigation posture rather than invented numeric probabilities."
    claimRefs: [CR004, CR005, CR006, CR009, CR012, CR014, CR015]
callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: If Geretsried cannot move from partial operation to sustained, clearly net-positive output with materially better repeat-loop economics, Eavor's licensing and expansion story becomes much harder to finance on ordinary project terms.
    claimRefs: [CR001, CR004, CR005, CR006, CR009]
  - calloutType: insight
    title: Most important diligence ask
    body: The next diligence step is to reconcile current Geretsried operating data, partner obligations, and district-heating commercialization milestones against the public milestone narrative before assigning any premium for scalability.
    claimRefs: [CR002, CR011, CR015, CR016]
