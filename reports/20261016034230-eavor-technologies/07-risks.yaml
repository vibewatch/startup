artifact: risks
slug: eavor-technologies
runDate: 2026-10-16
company:
  name: Eavor Technologies
chapter:
  number: 7
  title: Risks
  summary: Eavor's risk stack is dominated by whether Geretsried becomes a repeatable, bankable proof point rather than a one-off subsidized demonstration. Public evidence shows real technical progress and strategic backing, but it also leaves unresolved performance, financing, regulatory-expansion, and partner-dependence questions that can still break the investment case.
sections:
  - id: ranked-risk-view
    title: Ranked risk view
    body: >
      The decisive risk is execution at Geretsried, because Eavor now has enough
      real-world operating history for underperformance to matter more than
      concept-level promise. The company and friendly coverage both confirm that
      Geretsried has reached partial commercial operation and remains positioned
      as an 8.2 MW / roughly 60-64 MW thermal reference plant, but the adverse
      evidence in the assigned pool says the first commercial build is still far
      from a clean proof point. CleanTechnica described only one of four planned
      well pairs as complete, six completed horizontal loops rather than twelve,
      and current gross electrical output that may only barely clear plant
      parasitic demand. That makes the top diligence question simple: can Eavor
      turn Geretsried from a technically interesting milestone into a repeatable
      asset that third parties will finance, insure, and operate without rescue
      economics. If not, the downside is not just one weak project; it is a
      broken commercialization narrative for the broader licensing strategy.
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR009]
    figureRefs: [FR001]
  - id: regulatory-and-market-entry
    title: Regulatory, legal, and market-entry risk
    body: >
      The assigned pool does not show an active public lawsuit or enforcement
      action, but it does show that Eavor's next-wave expansion depends on legal
      and permitting conditions that remain incomplete or lightly evidenced in
      public. The clearest example is Japan, where JETRO says there is still no
      clear geothermal law for pure-heat resources and that ownership of the
      resource remains uncertain. That does not block Eavor automatically, but
      it means project rights, stakeholder engagement, and local approvals must
      be solved market by market rather than assumed from the German reference
      case. Geretsried itself also relied on prior permitting progress, planned
      district-heating offtake preparation, and a municipality buildout path,
      so the regulatory risk is not "can the company drill somewhere" but
      whether each new jurisdiction will provide the same combination of rights,
      social license, and offtake readiness in time for project finance.
    claimRefs: [CR002, CR012, CR013, CR015]
    tableRefs: [TR001]
  - id: operational-and-commercialization
    title: Operational and commercialization risk
    body: >
      Operational risk remains high because the first commercial project still
      looks like a learning platform rather than a mature delivery template.
      Canary Media reported that the first eight of twelve lateral wells took
      more than 100 days to complete, while Eavor's own year-in-review says the
      team had to work through sidetracking and intra-lateral hydraulic
      communication problems. Those facts are not fatal on their own, and the
      company also points to meaningful mitigations such as faster drilling and
      lower-cost Rock Pipe completions. But the mitigation case is still
      management-led rather than independently bank-validated, so residual
      exposure remains high until Geretsried demonstrates sustained net output,
      repeatable loop completion, and a credible path from first-of-a-kind
      learning to normalized project economics. The kill criterion here is not a
      missed PR milestone; it is failure to show that Loop 2 and later loops can
      be delivered with materially better schedule, performance, and cost.
    claimRefs: [CR003, CR004, CR005, CR006, CR007, CR008, CR016]
    tableRefs: [TR002]
  - id: capital-and-dependency
    title: Capital, partner, and customer dependency risk
    body: >
      Eavor still depends heavily on outside capital and strategic counterparties,
      which raises both concentration risk and valuation risk. The company
      acknowledged as early as 2022 that the first ultra-deep closed-loop
      project was not expected to be economically viable without financial
      support, and later sources show continued reliance on large financings,
      including the C$182 million 2023 equity round and a further C$138 million
      Canada Growth Fund commitment in 2025. The commercialization path also
      remains partner-shaped: Chubu's investment is described as pivotal to
      Japan expansion, OMV says it contributed subsurface and drilling know-how
      to Loop 1, and district-heating delivery still depends on downstream
      network buildout and offtake execution. That means a failed sponsor
      relationship, weaker-than-expected lender appetite, or delayed customer
      network deployment could slow growth even if the core physics improve.
      The thesis only de-risks when Eavor can point to repeat orders or
      milestone-based contracts that are not primarily subsidized proof points.
    claimRefs: [CR009, CR010, CR011, CR014, CR015, CR016]
    tableRefs: [TR003]
