figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >
      Ordinal 1-5 scoring places alternatives by visible commercial proof and by siting
      flexibility or water-light operating profile.
    data:
      xAxis:
        label: Commercial proof and financing readiness
        min: 1
        max: 5
        lowLabel: pilot stage
        highLabel: bankability signal
      yAxis:
        label: Siting flexibility and water-light operations
        min: 1
        max: 5
        lowLabel: geology constrained
        highLabel: broadly flexible
      points:
        - label: Eavor
          x: 3
          y: 5
          detail: First commercial closed-loop power at Geretsried, but Loop Two execution and cost repeatability still need proof.
        - label: Fervo
          x: 5
          y: 2
          detail: Best visible financing and hyperscaler-linked offtake proof in the retained pool, but EGS uses fracturing and injected water.
        - label: XGS
          x: 3
          y: 4
          detail: Strong 150 MW customer signal and water-recycling pitch, but the retained source says it has not yet connected to the grid.
        - label: GreenFire
          x: 3
          y: 4
          detail: Commercial retrofit proof on an existing geothermal well, with narrower retrofit scope than a full new-field rollout.
        - label: Sage
          x: 3
          y: 3
          detail: Fast pilot progression and storage angle, but a fractured-reservoir architecture rather than a pure sealed loop.
        - label: Conventional hydrothermal
          x: 5
          y: 1
          detail: Deep incumbent operating proof where hot permeable reservoirs exist, but low flexibility because water, permeability, and reinjection still govern siting.
    approximationNotes: >
      Point placement is an analyst-derived ordinal read from retained public evidence, not a
      vendor benchmark or renderer-inferred ranking.
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP008, CP015]
callouts:
  - calloutType: insight
    title: Differentiation is architectural, not distribution-led
    body: >
      Eavor's clearest separation is a water-light closed-loop architecture that fits district
      heat and firm-power sites where permeability or reinjection is a constraint, but its route
      to market still runs through partners, utilities, and long-cycle infrastructure contracts.
    claimRefs: [CP007, CP009, CP010, CP012]
  - calloutType: risk
    title: Rival demand capture can outrun first-mover novelty
    body: >
      Fervo and XGS already show large customer or financing signals on alternative geothermal
      pathways, so Eavor still needs repeatable Geretsried-style execution and follow-on
      financing to keep closed-loop novelty from becoming only a technical feature.
    claimRefs: [CP005, CP006, CP008, CP013]
