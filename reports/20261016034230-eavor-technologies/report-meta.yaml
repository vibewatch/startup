  topStrengths:
    - First commercial electricity delivery at Geretsried provides a real-world proof point for the Eavor-Loop.
    - Strategic and public-sector financing support suggests the company remains financeable.
    - The closed-loop design is differentiated from conventional hydrothermal geothermal systems.
  topRisks:
    - Public revenue, margin, and valuation disclosure remain too thin for full underwriting.
    - Drilling and subsurface execution still create major cost and schedule uncertainty.
    - Governance, preference-stack, and customer pipeline visibility remain limited.
  unresolvedGaps:
    - Current post-money valuation and liquidation-preference stack remain undisclosed.
    - No public revenue, ARR, gross margin, or cash-runway figures were located for 2025 or 2026.
    - >-
      A reconciled budget-to-complete and steady-state commercial operating plan for the full Geretsried scope are still
      not public.
    - >-
      Public materials do not fully explain the CEO transition or the governance rights held by strategic investors and
      project lenders.
    - >-
      Broader customer pipeline, signed licensing economics, and repeatable post-Geretsried deployment demand remain
      only partially evidenced.
