  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: propulsion-failure
      missingEvidence: >-
        Regulator-accepted anomaly report, root-cause closure matrix, redesigned pump and
        inverter qualification data, and integrated-stage test results.
      whyItMatters: >-
        Management's remediation statement does not establish that the two flight failure modes
        have been eliminated.
      diligencePath: >-
        Review controlled technical reports with engineering leadership and confirm corrective
        action acceptance directly with the Australian Space Agency.
      relatedQuestionRefs: [QR001, QR002, QR009]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: licensing
      missingEvidence: >-
        Current TestFlight2 permit conditions, flight-management approvals, insurance
        requirements, and regulator correspondence after TestFlight1.
      whyItMatters: >-
        A licensed facility and prior permit do not establish authorization or timing for the
        next mission.
      diligencePath: >-
        Obtain primary permit documents and written regulator confirmation of open conditions
        and corrective-action milestones.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001, TR003]
    - type: enumeration-incomplete
      severity: material
      topic: legal-exposure
      missingEvidence: >-
        Court, patent, insurance, environmental-enforcement, workplace-safety, and regulator
        records sufficient to complete the legal and safety register.
      whyItMatters: >-
        The assigned evidence only carries company statements on immediate safety effects and
        does not prove absence of wider legal exposure.
      diligencePath: >-
        Run Australian court, IP Australia, environmental, workplace-safety, and insurance
        searches and obtain counsel confirmation.
      relatedQuestionRefs: [QR004]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: supplier-dependency
      missingEvidence: >-
        Critical supplier list, sole-source spend, affected pump and inverter vendors,
        alternate-source qualification, lead times, quality escapes, and inventory coverage.
      whyItMatters: >-
        Hundreds of suppliers can increase breadth without reducing concentration in
        flight-critical components.
      diligencePath: >-
        Review the approved vendor list, bill of materials, quality records, supplier recovery
        plan, and second-source qualification schedule.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: financial-model-risk
      missingEvidence: >-
        Current unrestricted cash, monthly burn, committed capex, financing terms, runway,
        launch-unit economics, insured losses, and customer-backed backlog.
      whyItMatters: >-
        A large financing round does not show how many failed or delayed campaigns the balance
        sheet can absorb before commercial operations.
      diligencePath: >-
        Obtain the latest management accounts, cash bridge, cap table, financing documents,
        signed launch contracts, deposit schedule, and downside runway model.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
