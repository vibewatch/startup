schemaVersion: report-v2
artifact: risks
slug: gilmour-space-technologies
runDate: 2026-10-21
company:
  name: Gilmour Space Technologies
chapter:
  number: 7
  title: Risks
  summary: >-
    Gilmour Space remains exposed to binary launch-execution risk: Eris TestFlight1 flew for
    about 14 seconds, and the company's investigation identified two oxidiser-pump failure
    modes involving electrical and thermal faults. Licensing and new financing provide a path
    forward, but qualification closure, supplier concentration, launch cadence, burn, runway,
    and customer-backed economics remain material diligence gaps.
sections:
  - id: flight-reliability-and-operational-exposure
    title: Flight reliability and operational exposure
    body: >-
      Eris has crossed the threshold from ground development into flight, but it has not yet
      demonstrated orbital reliability. Independent accounts report that TestFlight1 returned
      to the ground about 14 seconds after liftoff. The company's subsequent investigation
      attributes the mission loss to two independent failure modes in the oxidiser-pump
      subsystem: one first-stage motor lost thrust about nine seconds after ignition and
      another showed similar behaviour around 17 seconds. The disclosed faults involved pump
      motors and inverters, including externally sourced components. This is therefore both a
      design-qualification risk and a supplier-interface risk, not merely an isolated launch
      operations issue. Earlier fairing separation from electrical backfeed and repeated
      weather and operational delays add evidence of systems-integration and cadence risk.
      Gilmour says design, qualification, and process improvements are being implemented, but
      the assigned evidence does not show completed requalification or a successful repeat
      flight. A clean TestFlight2 that closes the pump findings is the central technical
      de-risking gate.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal-and-safety-exposure
    title: Regulatory, legal, and safety exposure
    body: >-
      Bowen is not an unlicensed concept site: Gilmour reports a facility licence in March
      2024, a launch permit in November 2024, and approval of a flight management plan in July
      2025. Independent reporting also describes CASA approval in late April 2025 and final
      Australian Space Agency sign-off on May 13, 2025 for the maiden flight. Those milestones
      reduce site-establishment risk but do not make future missions permissionless; the first
      orbital campaign itself showed that regulatory sequencing can move a schedule. After
      TestFlight1, Gilmour said its final investigation report was submitted to the Australian
      Space Agency with the Office of the Space Regulator. The company also lists ISO 9001,
      ISO 14001, and ISO 45001 certifications and said the anomaly caused no injuries or adverse
      environmental impacts. These are positive controls, but the retained pool does not
      independently establish certification scope, current mission-specific permit conditions,
      insurance adequacy, litigation status, environmental enforcement history, or regulator
      acceptance of corrective actions. Those omissions remain diligence items rather than
      evidence that no exposure exists.
    claimRefs: [CR002, CR007, CR008, CR011]
    tableRefs: [TR001]
  - id: supplier-capital-and-partner-dependencies
    title: Supplier, capital, and partner dependencies
    body: >-
      The supply chain is broad and at least one disclosed failure path crossed the
      make-versus-buy boundary. The National Reconstruction Fund Corporation says Gilmour
      relies on hundreds of Australian suppliers, while the flight investigation identified
      externally supplied components among the affected pump motors and inverters. Neither
      source names the supplier, alternative qualification status, lead time, or concentration,
      so resilience cannot be inferred from supplier count alone. Capital dependence is also
      material. The NRFC committed A$75 million for Eris development, manufacturing scale-up,
      and Bowen expansion, and two government sources describe a A$217 million Series E led by
      NRFC and Hostplus. Funding raised is not cash available: the evidence does not disclose
      burn, current cash, runway, launch-unit economics, remaining infrastructure commitments,
      or financing conditions. Investors should therefore treat financing as capacity to
      execute an expensive plan, not proof that the plan is fully funded through reliable
      commercial operations.
    claimRefs: [CR003, CR012, CR013, CR014, CR015]
    tableRefs: [TR003]
  - id: monitoring-mitigations-and-thesis-breaks
    title: Monitoring, mitigations, and thesis-breaks
    body: >-
      Monitoring should focus on evidence that converts stated remediation into demonstrated
      reliability. Before the next launch, diligence should obtain the regulator-accepted
      anomaly report, root-cause closure matrix, redesigned pump and inverter qualification
      results, supplier change-control records, integrated-stage test results, and the
      mission-specific permit path. During TestFlight2, the minimum technical proof is stable
      first-stage thrust through the prior failure window, nominal guidance and separation
      behaviour, and safe completion within the licensed envelope. After flight, the investment
      case requires a credible cadence plan, contracted customer milestones, and a cash runway
      that absorbs another test failure without emergency financing. A repeat pump or
      integration failure, regulator refusal or material delay after corrective-action review,
      inability to qualify alternate critical suppliers, or runway exhaustion before
      orbital proof would break the near-term thesis. Conversely, a safe, regulator-cleared
      repeat flight with disclosed corrective-action closure would materially reduce the
      dominant risk, although it would not by itself establish commercial economics.
    claimRefs: [CR003, CR004, CR007, CR009, CR010, CR012, CR014, CR015, CR016]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
