        - Company reports March 2024 facility licence; NRFC describes Bowen as licensed
        - Low near-term revocation evidence; renewal scope unknown
        - Critical
        - Licensed facility and completed first campaign
        - Verify licence currency, conditions, insurance, and change-control obligations with the regulator
      - - Mission launch permit and flight management approvals
        - Australia
        - November 2024 permit and July 2025 flight-management approval reported; maiden-flight sign-off followed in May 2025
        - Medium schedule risk
        - High
        - Prior approval pathway is established
        - Obtain TestFlight2 permit milestones, open conditions, and regulator correspondence
      - - TestFlight1 anomaly reporting and corrective-action acceptance
        - Australia
        - Company says final report was submitted to the Australian Space Agency and Office of the Space Regulator
        - Medium
        - Critical
        - Investigation completed and improvements stated
        - Review the regulator-accepted report, closure evidence, and any restrictions on return to flight
      - - Safety, environmental, litigation, IP, and insurance exposure
        - Australia and mission counterparties
        - Company reported no injuries or adverse environmental impacts; wider legal status is not established
        - Unknown
        - High
        - ISO certifications and designated safety area are stated controls
        - Run regulator, court, patent, environmental, and insurance diligence; absence from this pool is not proof of no exposure
    notes: >-
      Partial public-evidence register as of 2026-10-21; permit scope, corrective-action
      acceptance, insurance, litigation, IP, and environmental enforcement require primary
      regulator or legal documents.
    enumerationScope:
      coverage: partial
      basis: Public licensing, launch-investigation, certification, and safety evidence retained for this chapter.
    claimRefs: [CR002, CR007, CR008, CR011]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Evidence and likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap or monitor
    rows:
      - - Oxidiser-pump motor or inverter failure
        - Demonstrated in TestFlight1
        - Critical
        - Design, qualification, and process improvements stated; completion not evidenced
        - Repeat loss of thrust and vehicle
        - Qualification reports, integrated-stage testing, and successful flight through prior failure window
      - - Electrical integration and backfeed
        - Premature fairing separation occurred during May 2025 launch preparation
        - High
        - Immediate issue was fixed; broader recurrence evidence unavailable
        - Pad delay or mission loss from unexpected electrical interaction
        - System-level fault-injection, power-isolation, and regression-test evidence
      - - Launch cadence and weather sensitivity
        - Campaign moved through cyclone, wind, and operational delays
        - High
        - Prior campaign completed; repeatable cadence unproven
        - Revenue and customer milestones slip with each window
        - Tested turnaround plan, weather assumptions, and schedule reserve
      - - Critical supplier interface
        - Externally sourced components were among affected pump-system hardware
        - High
        - Supplier-specific remediation and alternates undisclosed
        - Long-lead redesign, requalification, or recurring defect
        - Supplier identity, escape analysis, second source, inventory, and acceptance testing
      - - Integrated scale-up
        - A$75 million NRFC investment targets rocket, satellite, manufacturing, and spaceport expansion
        - Medium
        - Capital committed; operating execution not demonstrated
        - Simultaneous facility, workforce, and vehicle scale strains quality systems
        - Yield, non-conformance, rework, staffing, and test-throughput metrics
    notes: >-
      Severity and likelihood are analyst assessments tied to the cited incidents and stated
      remediation; no probability percentages are implied, and mitigation maturity remains
      limited by unavailable qualification records.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR013]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Pump motors and inverters
        - Unnamed external supplier components
        - Not disclosed
        - Defect recurrence or requalification delay blocks return to flight
        - Critical
        - Design and qualification changes are stated
        - No supplier, alternate-source, or closure evidence in the assigned pool
      - - Broader manufacturing supply chain
        - Hundreds of Australian suppliers reported by NRFC
        - Supplier count disclosed; spend and sole-source shares are not
        - Long-lead part or quality escape constrains cadence
        - High
        - Domestic network and scale-up capital
        - Breadth does not establish substitutability or inventory resilience
      - - Launch authorization
        - Australian Space Agency, Office of the Space Regulator, and CASA
        - Mandatory approval path
        - Corrective-action or mission approval delays TestFlight2
        - High
        - First campaign established an approval pathway
        - Future permit conditions and anomaly-closure acceptance remain unavailable
      - - Expansion capital
        - NRFC, Hostplus, and Series E syndicate
        - A$217 million round announced; current liquidity undisclosed
        - Capital runs short before orbital reliability and revenue cadence
        - High
        - Large new equity round and A$75 million NRFC participation
        - Funding raised is not cash available; burn, runway, commitments, and terms are gaps
      - - Commercial launch demand
        - Commercial, government, and defence customers
        - No revenue-bearing backlog or customer concentration disclosed in retained sources
        - Delayed reliability proof pushes customers to alternate launch providers
        - High
        - Integrated vehicle, satellite, and licensed-spaceport offering
        - Contract firmness, deposits, cancellation rights, and customer concentration require diligence
    notes: >-
      The register distinguishes disclosed dependencies from unsupported concentration
      assumptions; null concentration data and undisclosed financing terms remain explicit gaps.
    claimRefs: [CR003, CR007, CR012, CR013, CR014, CR015]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Demonstrated technical failures dominate current residual risk; licensing, suppliers,
      cadence, and runway remain high because control effectiveness is not publicly evidenced.
    data:
      columns:
        - label: Likelihood evidence
          detail: Whether the risk has occurred or is supported by a disclosed dependency.
        - label: Impact
          detail: Analyst assessment of consequence to return-to-flight and investment timing.
        - label: Mitigation maturity
          detail: Publicly evidenced maturity, not management intention alone.
      rows:
        - label: Oxidiser-pump subsystem
          note: TestFlight1 investigation identified two failure modes.
          values:
            - label: Demonstrated
              tone: negative
            - label: Critical
              tone: negative
            - label: Improvements in progress
              tone: warning
        - label: Electrical integration
          note: Fairing separation followed electrical backfeed during launch preparation.
          values:
            - label: Demonstrated
              tone: negative
            - label: High
              tone: negative
            - label: Immediate fix reported
              tone: warning
        - label: Regulatory timing
          note: First campaign obtained approvals; TestFlight2 conditions are unavailable.
          values:
            - label: Recurring process
              tone: warning
            - label: High
              tone: negative
            - label: Path established
              tone: neutral
        - label: Weather and cadence
          note: Cyclone, wind, and operational delays affected the maiden campaign.
          values:
            - label: Demonstrated
              tone: negative
            - label: High
              tone: negative
            - label: Repeatability unproven
              tone: warning
        - label: Supplier dependence
          note: External components were involved; concentration and alternatives are undisclosed.
          values:
            - label: Disclosed
              tone: warning
            - label: High
              tone: negative
            - label: Closure unavailable
              tone: negative
        - label: Funding and runway
          note: Equity raised is disclosed, but burn, cash, commitments, and runway are not.
          values:
            - label: Exposure unresolved
              tone: warning
            - label: High
              tone: negative
            - label: New capital raised
              tone: neutral
    approximationNotes: >-
      Ordinal labels summarize cited evidence and explicit gaps; they are not probabilities,
      benchmark scores, or independently verified control ratings.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR007, CR012, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Return-to-flight is the dominant thesis gate
    body: >-
      The next flight must demonstrate closure of the oxidiser-pump and electrical-integration
      findings; a stated redesign without qualification evidence does not reduce residual risk
      enough for underwriting.
    claimRefs: [CR002, CR003, CR004, CR016]
