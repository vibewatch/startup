    topic: certifications-and-controls
    missingEvidence: >-
      Certificates, certification scope, issuing bodies, audit dates, nonconformities, and product-specific quality
      records.
    whyItMatters: >-
      Management-system certifications do not independently prove vehicle reliability, configuration control, or mission
      safety.
    diligencePath: >-
      Obtain certificate copies and audit reports, then trace sampled propulsion, avionics, and fairing hardware through
      the quality system.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
