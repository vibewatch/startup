evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Current revenue, burn, gross margin, cash balance, runway, and revenue-bearing backlog.
    whyItMatters: Financing proceeds cannot establish commercial traction or the time available to achieve reliable orbit.
    diligencePath: Request audited accounts, monthly management reporting, bank statements, burn bridge, and contract-level backlog.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership-and-governance
    missingEvidence: >-
      Fully diluted cap table, financing security terms, voting rights, board roster, and investor protective
      provisions.
    whyItMatters: Named participation does not reveal control, dilution, liquidation preferences, or governance concentration.
    diligencePath: Review the Series E documents, shareholder register, constitution, board minutes, and investor side letters.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: next-launch
    missingEvidence: Authoritative current launch window, readiness criteria, payload, and completed outcome for Eris TestFlight 2.
    whyItMatters: A repeat flight is the clearest near-term test of whether the first-flight failure has been remediated.
    diligencePath: Obtain the current mission manifest, regulator approvals, test-completion records, and post-flight report.
    relatedQuestionRefs:
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: leadership-depth
    missingEvidence: Complete executive and board roster with biographies, remit, tenure, succession coverage, and independence.
    whyItMatters: Three publicly named people are insufficient to assess management depth for a capital-intensive launch program.
    diligencePath: Request the organization chart, board register, committee charters, succession plan, and key-person insurance.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: Independent market-spend estimates with geography, period, category boundary, methodology, and growth assumptions.
    whyItMatters: Without a comparable denominator, a monetary TAM, SAM, SOM, or growth rate would be synthetic.
    diligencePath: >-
      Obtain current launch-demand studies and government procurement totals, then reconcile their categories to
      Gilmour’s payload and orbit envelope.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Named budget owners, procurement cycles, contract values, win rates, and mission conversion data by customer
      segment.
    whyItMatters: Segment names do not reveal willingness to pay, adoption timing, or attainable revenue.
    diligencePath: >-
      Review the qualified pipeline, executed contracts, customer references, procurement documents, and lost-deal
      analysis.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: payload-capacity
    missingEvidence: >-
      A current mission-specific payload users guide reconciling the 215 kg and approximately 300 kg figures by orbit
      and configuration.
    whyItMatters: Payload capacity determines the serviceable mission set and makes unit-price comparisons meaningful.
    diligencePath: >-
      Obtain the controlled Eris payload users guide and validate capacity against the intended orbit, inclination, and
      rideshare configuration.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: contracted-demand
    missingEvidence: >-
      Revenue-bearing launch backlog, customer concentration, deposits, cancellation rights, and launch-window
      commitments.
    whyItMatters: Management cadence targets and general demand statements do not establish utilization or a defendable SOM.
    diligencePath: >-
      Inspect the contract schedule and backlog bridge, then interview representative commercial and government
      customers.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: competitive-landscape
    missingEvidence: >-
      An exhaustive buyer-alternative set covering launch brokers, rideshare incumbents, likely entrants, internal-build
      programs, and delayed-mission status quo options.
    whyItMatters: >-
      Missing alternatives can overstate both Gilmour's differentiation and the addressable share available to dedicated
      launch.
    diligencePath: >-
      Build a procurement-led competitor census from recent launch manifests, agency vendor lists, and customer requests
      for proposal.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable quotes, realized contract prices, payload and orbit adjustments, discounts, service levels, and
      termination terms.
    whyItMatters: Packaging alone cannot establish price advantage, switching cost, or contribution economics.
    diligencePath: >-
      Obtain anonymized customer proposals and executed launch-service agreements for Gilmour and at least two flying
      alternatives.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Firm backlog, mission cadence, on-time performance, customer concentration, and repeat-purchase evidence across
      the compared providers.
    whyItMatters: >-
      These metrics determine whether infrastructure breadth converts into durable distribution power and revenue
      quality.
    diligencePath: >-
      Reconcile signed manifests and deposits with operator schedules, customer confirmations, and launch-regulator
      records.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Current unrestricted cash, monthly cash burn, debt schedules, committed capital receipts, and milestone-adjusted
      runway.
    whyItMatters: >-
      Financing raised cannot be converted into a runway estimate without cash receipts, restrictions, obligations, and
      forward spending.
    diligencePath: >-
      Obtain bank statements, the latest balance sheet, monthly cash-flow actuals, financing agreements, and a
      board-approved 24-month forecast.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-gap
    missingEvidence: >-
      Executed contracts, backlog by mission, cancellation rights, payment milestones, recognized revenue, and customer
      concentration.
    whyItMatters: Public mission and partnership activity does not establish collectible revenue or backlog quality.
    diligencePath: Review the contract ledger, top customer agreements, deferred revenue schedule, invoices, and cash collections.
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Cost per test and commercial launch, expendable hardware cost, direct labor, rework, insurance, and launch-site
      operating cost.
    whyItMatters: Gross-margin potential and fixed-cost absorption cannot be assessed from target launch cadence alone.
    diligencePath: Reconcile mission-level bills of materials and labor routings to management accounts and TestFlight budgets.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Pipeline conversion, sales cycle, customer acquisition cost, bid costs, channel economics, and deposits by
      mission.
    whyItMatters: >-
      A consultative enterprise and government sales motion may require long cycles and substantial pre-contract
      engineering.
    diligencePath: Inspect CRM cohorts, bid logs, channel agreements, contract win rates, and sales compensation by customer segment.
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: product-documentation
    missingEvidence: >-
      Configuration-controlled Eris and ElaraSat datasheets, payload interface control documents, and service-level
      commitments.
    whyItMatters: >-
      These documents define compatibility, integration work, accepted environments, and the contractual performance
      customers can underwrite.
    diligencePath: >-
      Request current ICDs, payload user guides, qualification matrices, standard launch-services terms, and
      change-control history in the data room.
