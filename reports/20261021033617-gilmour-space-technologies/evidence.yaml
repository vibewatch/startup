      independent technical-community proxy.
    whyItMatters: >-
      The assigned successful source pool contains general news, official, supplier, and investor material but no
      observable practitioner signal for engineering depth or ecosystem adoption.
    diligencePath: >-
      Request engineering publications and conference presentations, and interview launch-integration partners and
      former aerospace program staff under appropriate confidentiality.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: >-
      Customer cohort schedule with active customer count, renewal dates, GRR, NRR, churn, contract duration, and
      expansion revenue.
    whyItMatters: Without cohort evidence, durability and land-and-expand economics cannot be measured.
    diligencePath: >-
      Obtain a customer-level contract and billing export reconciled to management accounts, then interview a sample of
      renewed and non-renewed customers.
    relatedQuestionRefs:
