company:
  name: Gilmour Space Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Gilmour Space is a privately held Gold Coast aerospace company combining the
    Eris launch vehicle, ElaraSat satellite platform, and Bowen Orbital Spaceport.
    A reported A$217 million Series E and workforce above 220 provide scale, but
    the July 2025 Eris test ended after about 14 seconds and current revenue,
    runway, backlog, and cap-table evidence remain unavailable.
sections:
  - id: identity-and-operating-model
    title: Identity and integrated operating model
    body: >-
      Founded on the Gold Coast in 2013 by brothers Adam and James Gilmour, the
      company remains a privately held Australian launch-services developer. Its
      official positioning combines three mutually reinforcing assets: Eris launch
      vehicles, the ElaraSat satellite platform, and licensed launch operations at
      Bowen. Gold Coast houses headquarters and manufacturing, while Bowen is the
      operating launch site. This is broader than a single-rocket proposition:
      management is attempting to control vehicle, spacecraft, and launch-site
      interfaces for commercial, government, and defence missions. That integration
      may reduce coordination friction, but it also concentrates capital and
      execution demands inside one development-stage company.
    claimRefs: [CO001, CO002, CO003, CO013]
    tableRefs: [TO001]
  - id: capital-and-scale
    title: Capital base and disclosed scale
    body: >-
      The clearest current scale markers are financing and employment rather than
      commercial output. Multiple sources report a Series E of A$217 million,
      equivalent to roughly US$145 million in one tracker, while an Australian
      technology publication says the valuation topped $1 billion without naming
      the currency in the fetched text. NRFC says it invested $75 million and
      co-led the round with Hostplus; the same public evidence places headcount
      above 220. Earlier venture funding was reported at $142 million before the
      Series E, but currency conventions, grants, debt, secondary transactions,
      revenue, cash balance, and runway are not disclosed well enough to calculate
      total capital available or capital efficiency.
    claimRefs: [CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Public leadership evidence is narrow. Adam Gilmour is consistently identified
      as co-founder and chief executive, while James Gilmour is identified as a
      co-founder without a current operating title in the assigned material.
      NewSpaceTracker reports that former NASA Deputy Administrator Pamela Melroy
      joined the board in June 2026, adding relevant institutional experience.
      Nevertheless, the public roster does not establish a complete executive team,
      board composition, voting rights, succession plan, or division of technical
      authority. The combination of Adam's CEO role and prominence in launch and
      financing communications therefore supports a key-person concern that should
      be tested through management and governance documents.
    claimRefs: [CO001, CO015, CO016]
    tableRefs: [TO002]
  - id: execution-milestones
    title: Milestones, technical setback, and next proof point
    body: >-
      Gilmour has converted infrastructure and spacecraft development into tangible
      milestones: Bowen received orbital-launch licensing, ElaraSat has operated on
      orbit, and Eris left the pad in July 2025. The rocket then crashed after about
      14 seconds. Adam Gilmour initially attributed the loss to apparent engine
      failure; a later tracker account says the April 2026 investigation identified
      electrical and thermal faults in pump motors and inverters on two first-stage
      motors. As of the tracker's September 2026 update, another attempt was still
      described for 2026. That makes a repeat flight—not the first brief lift-off—
      the next decisive evidence of launch-system maturity. No assigned source
      establishes a completed second attempt by the run date.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
