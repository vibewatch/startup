company:
  name: Gilmour Space Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Gilmour Space is building an integrated Australian space stack spanning the
    Eris launch vehicle, ElaraSat satellite bus, Bowen Orbital Spaceport, and
    Hyperflight service. ElaraSat has on-orbit evidence, but Eris remains in
    flight qualification after its 14-second TestFlight1 ended at the pad, so
    launch reliability, interfaces, and repeatable operations remain the core
    technical underwriting gaps.
sections:
  - id: product-system-and-customer-workflow
    title: Product system and customer workflow
    body: >-
      The product is not a single rocket: the company presents an integrated
      mission system comprising Eris launch services, the ElaraSat satellite
      platform, the licensed Bowen spaceport, and Hyperflight hypersonic
      flights. For a satellite customer, the intended workflow runs from
      mission and orbit selection through payload integration, launch from
      Bowen, and, when relevant, use of an ElaraSat bus. This combination could
      reduce coordination across vehicle, spacecraft, and launch-site vendors,
      but the public evidence does not provide a payload interface control
      document, service-level commitment, integration timetable, or realised
      mission pricing. The product surface is therefore legible while the
      customer handoff and contractual performance envelope remain largely
      private.
    claimRefs: [CE001, CE003, CE007, CE008, CE016]
    tableRefs: [TE001, TE002]
  - id: architecture-and-industrial-model
    title: Architecture and industrial model
    body: >-
      Eris is described as a three-stage vehicle whose main engines use liquid
      oxidiser with a solid fuel grain. The current catalogue specification is
      approximately 305 kilograms to a 500-kilometre sun-synchronous orbit, but
      that is a supplier specification rather than demonstrated orbital
      performance. The operating architecture also depends on Australian
      manufacturing, hundreds of domestic suppliers, and a licensed launch
      site. A government-supported next-generation liquid-engine program
      indicates that propulsion development may extend beyond the present
      hybrid configuration. Vertical integration can shorten organizational
      interfaces, yet it also concentrates vehicle, manufacturing, spacecraft,
      and spaceport execution risk inside one still-scaling operator.
    claimRefs: [CE002, CE003, CE007, CE010, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-reliability-and-roadmap
    title: Maturity, reliability, and roadmap
    body: >-
      The portfolio has uneven maturity. NRFC and Startup Daily report that the
      100-kilogram ElaraSat bus reached orbit on a United States rideshare
      mission, providing meaningful spacecraft heritage. Eris has not yet
      demonstrated orbit: TestFlight1 flew for about 14 seconds in July 2025
      before returning to the launch area, with the chief executive attributing
      the outcome to an apparent engine failure. Earlier, an electrical
      feedback event unintentionally triggered the single-use fairing
      separation system and delayed the attempt. The current supplier-derived
      roadmap targets TestFlight2 for early 2027. That sequence shows learning
      activity, but not closure of the engine or fairing failure modes, orbital
      insertion, payload deployment, launch cadence, or repeatability.
    claimRefs: [CE004, CE005, CE006, CE008, CE011, CE012]
  - id: differentiation-controls-and-diligence
    title: Differentiation, controls, and diligence priorities
    body: >-
      Gilmour's most defensible public differentiation is system ownership:
      vehicle, satellite platform, and licensed Australian launch site under
      one operator, with sovereign access as the customer proposition. The
      company also states that it is certified to ISO 9001, ISO 45001, and ISO
      14001, which signals formal quality, safety, and environmental management
      systems but does not by itself validate launch reliability. No public
      datasheet or interface control document was available in the retained
      evidence, and the assigned pool contained no developer repository,
      practitioner forum, engineering talk, or comparable community signal.
      Technical diligence should therefore prioritize configuration-controlled
      interface documents, TestFlight1 root-cause and corrective-action
      records, certification scopes and audits, supply-chain qualification,
      and TestFlight2 acceptance criteria.
    claimRefs: [CE009, CE014, CE015, CE016]
callouts:
  - calloutType: risk
    title: Orbital proof remains the gating milestone
    body: >-
      ElaraSat provides spacecraft heritage, but Eris has yet to demonstrate
      orbital insertion. TestFlight2 should be underwritten against disclosed
      root-cause closure and explicit mission-success criteria rather than the
      launch date alone.
    claimRefs: [CE004, CE005, CE008, CE012, CE015]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or asset
      - Primary buyer or user
      - Public maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Eris orbital launch service
        - Commercial, government, and defence payload owners
        - TestFlight1 flew for about 14 seconds but did not reach orbit; TestFlight2 targeted for early 2027
        - Australian-operated dedicated access to selected orbits
        - Root-cause closure, achieved performance, reliability plan, interfaces, and cadence
      - - ElaraSat satellite bus
        - Payload owners needing a spacecraft platform
        - A 100 kg bus was reported operating on orbit after a U.S. rideshare launch
        - Can pair a company-built bus with launch and mission services
        - Payload accommodation, production history, reliability, and customer acceptance data
      - - Bowen Orbital Spaceport
        - Gilmour missions and prospective launch customers
        - Licensed for orbital launch operations
        - Company-controlled Australian launch site
        - Demonstrated turnaround, range availability, weather constraints, and operating cadence
      - - Hyperflight service
        - Government, defence, and technology-test users
        - Listed on the company product surface; no completed mission evidence in the retained pool
        - Extends the site and vehicle capability toward hypersonic testing
        - Vehicle configuration, flight envelope, approvals, schedule, and customer proof
    notes: >-
      Statuses reflect public evidence available through 2026-10-21; the
      absence of a disclosed specification or mission is recorded as a gap, not
      as proof that the capability does not exist.
    claimRefs: [CE001, CE004, CE007, CE008, CE012, CE014]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow
      - Gilmour solution
      - Publicly evidenced benefit
      - Limitation
    rows:
      - - Place a small satellite into a selected orbit
        - Procure launch capacity and integrate a payload with a vehicle and range
        - Dedicated or rideshare Eris mission from Bowen
        - Public specification targets about 305 kg to 500 km SSO
        - Capacity is a supplier specification and Eris has not demonstrated orbit
      - - Host and operate a customer payload
        - Select a bus, integrate payloads, and buy launch separately or together
        - ElaraSat multi-mission satellite bus with launch-service option
        - A 100 kg ElaraSat bus has reported on-orbit heritage
        - Public payload interfaces, reliability data, and delivery terms are unavailable
      - - Conduct sovereign or hypersonic mission testing
        - Coordinate vehicle, range, licensing, and mission operations
        - Company-operated Bowen spaceport and Hyperflight service
        - One provider controls the advertised site and mission stack
        - No retained evidence quantifies turnaround, flight envelope, or completed Hyperflight missions
    notes: >-
      Benefits are limited to capabilities evidenced by the retained sources;
      pricing, integration duration, realised mission outcomes, and contractual
      service levels were not publicly available.
    claimRefs: [CE001, CE003, CE007, CE008, CE014, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role
      - Key dependency
      - Technical or operating risk
    rows:
      - - Mission and payload interface
        - Translates orbit and payload needs into vehicle and bus requirements
        - Configuration-controlled datasheet and interface control document
        - No public ICD or complete datasheet was available
      - - Eris launch vehicle
        - Three-stage transport to low Earth and sun-synchronous orbit
        - Hybrid main propulsion, stage qualification, and fairing separation
        - Orbital performance is unproven; engine and fairing events require closure evidence
      - - ElaraSat platform
        - Hosts customer payloads and provides the spacecraft bus
        - Payload integration, production quality, and launch compatibility
        - One reported on-orbit bus does not establish fleet reliability or repeatability
      - - Manufacturing and supply network
        - Produces rocket and satellite hardware in Australia
        - Hundreds of domestic suppliers and scaling capital
        - Supplier qualification, bottlenecks, and yield are not publicly quantified
      - - Bowen launch operations
        - Provides licensed range and launch-site operations
        - Regulatory permissions, weather, ground systems, and turnaround
        - First-flight outcome and prior weather delays leave cadence unproven
      - - Quality and propulsion roadmap
        - Governs production systems and future engine development
        - ISO management systems and next-generation liquid-engine work
        - Certification scope, audit findings, and configuration transition are undisclosed
    notes: >-
      The architecture is reconstructed from public product, government, and
      news sources; undisclosed design details and qualification evidence are
      explicitly treated as diligence gaps.
    claimRefs: [CE002, CE005, CE006, CE008, CE009, CE010, CE013, CE015, CE016]
