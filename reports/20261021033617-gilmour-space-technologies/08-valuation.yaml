company:
  name: Gilmour Space Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Gilmour Space has secured substantial strategic capital and assembled an integrated launch,
    satellite, and licensed-spaceport platform, but its first Eris flight ended after about 14
    seconds and the retained evidence does not disclose the financial or security-term inputs
    needed to underwrite a price. The appropriate stance is research-more at high risk, with entry
    contingent on orbital, commercial, and financing-term proof.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is research-more rather than invest at the currently reported mark.
      Multiples lists a $721 million valuation in May 2026, while independent and investor sources
      corroborate a large Series E but do not provide the cap table, preference stack, revenue,
      cash burn, runway, or unit economics required for a preference-adjusted return model.
      Strategic financing validates institutional willingness to fund the sovereign-space mission;
      it does not establish that the entry price compensates for technical and commercialization
      risk. Confidence is medium because financing and operating milestones are visible, but the
      most decision-critical economics remain private. Entry discipline should therefore require
      verified financing terms, a current financial model, and milestone-based pricing rather than
      relying on an isolated third-party valuation estimate.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV012]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and proof burden
    body: >-
      The thesis is that Gilmour has assembled scarce Australian infrastructure: an integrated
      launch vehicle, satellite platform, and licensed orbital spaceport, supported by public and
      institutional capital. ElaraSat's reported on-orbit operation provides a concrete satellite
      proof point, and the Series E is earmarked for Eris development, manufacturing scale, and
      spaceport expansion. The anti-thesis is equally material. The first Eris attempt crashed
      after roughly 14 seconds, leaving orbital insertion, reliability, cadence, and launch
      economics unproven. A large capital raise can extend the qualification program, but it may
      also precede further dilution if repeated tests or delays consume capital before
      revenue-bearing launch cadence emerges. The investment case should move only when technical
      proof and commercial evidence improve together.
    claimRefs: [CV005, CV006, CV009, CV010, CV011, CV013, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: >-
      Public-company revenue multiples are context rather than a valuation answer. The retained
      market-data source lists a wide range across businesses with different product mixes,
      maturity, margins, and capital structures; Gilmour has no verified revenue denominator in
      the assigned evidence, so applying those multiples would create false precision. The bull
      case requires orbital success followed by evidence of contracted, economically attractive
      missions. The base case assumes continued technical progress under the Series E while
      postponing price conviction until financial disclosure improves. The bear case is a longer
      qualification cycle, repeated launch failure, or commercialization delay that consumes the
      new capital and forces repricing or dilution. None of these cases supports a defensible
      valuation range or target return without private evidence.
    claimRefs: [CV002, CV004, CV005, CV007, CV008, CV009, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: decision-gates-and-exit-readiness
    title: Decision gates, exit readiness, and final diligence
    body: >-
      Exit readiness is low because the retained sources establish neither a public-market
      timetable nor transaction evidence, and they do not disclose the financial profile needed
      to test strategic or public comparables. The next underwriting gate is not another funding
      headline; it is a package of evidence connecting flight reliability to revenue, margin,
      cash consumption, and contractual backlog. Required diligence includes Series E documents,
      the fully diluted cap table, liquidation preferences, monthly burn and runway, launch and
      satellite backlog, cancellation terms, per-mission contribution economics, and the current
      Eris qualification plan. A successful orbital flight plus verified commercial conversion
      would improve the view. Repeated failures, material schedule slippage, or a financing need
      before commercial cadence would break the thesis and should halt entry.
    claimRefs: [CV006, CV008, CV012, CV013, CV014, CV015]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, Research more, Do not invest without milestone and private-data diligence]
      - [Confidence, Medium, Financing and technical events are visible but economics are not]
      - [Risk rating, High, Orbital reliability and commercial cadence remain unproven]
      - [Valuation stance, Stretched and insufficiently supported, Treat the reported mark as context rather than an underwritten price]
    notes: >-
      Assessments are analyst judgments based only on the retained sources; no current cap table,
      security terms, revenue, burn, runway, or unit-economics package was available.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV008, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, Integrated launch vehicle satellite platform and licensed spaceport create a scarce sovereign-capability position, Successful orbital missions with contracted customer conversion]
      - [Thesis, Series E capital supports Eris qualification manufacturing scale and spaceport expansion, Evidence that spending produces reliable cadence and attractive mission economics]
      - [Anti-thesis, The first Eris attempt ended after about 14 seconds without reaching orbit, Repeatable orbital insertion and an independently reviewed reliability plan]
      - [Anti-thesis, Financial and preference inputs needed to price dilution and returns are absent, Full cap table financing documents and a current operating model]
    notes: >-
      This is a bounded thesis map, not an exhaustive risk register; financing use is sourced to
      investors, while future commercial and technical outcomes remain conditional.
    claimRefs: [CV005, CV006, CV009, CV010, CV011, CV013, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, Orbital success followed by reliable cadence and verified revenue-bearing missions, Re-underwrite after milestones; no defensible range before revenue and financing terms are disclosed, Orbital insertion plus contracted commercial conversion, Qualification success does not convert into economic launch demand]
      - [Base, Series E funds continued qualification and manufacturing progress but commercial proof remains limited, Defer price conviction and use milestone-conditioned entry terms, Transparent test progress cash runway and backlog disclosure, Schedule slippage consumes runway before cadence]
      - [Bear, Further flight failure or delay requires additional capital before commercial scale, Downside cannot be bounded from public evidence and capital impairment is plausible, Repeated technical setbacks or near-term financing need, Down round punitive preferences or loss of customer commitments]
    notes: >-
      Scenario values and probabilities are intentionally not quantified because the assigned
      evidence lacks revenue, margin, cash-flow, cap-table, preference, and reliable exit inputs.
    claimRefs: [CV002, CV005, CV008, CV009, CV013, CV014, CV015]
