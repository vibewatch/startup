callouts:
  - calloutType: recommendation
    title: Price is the unresolved variable
    body: >-
      Institutional backing and sovereign strategic value justify continued diligence, but they do
      not substitute for security terms, operating economics, or repeatable orbital performance.
      Require the private-data package and milestone-conditioned entry terms before underwriting.
    claimRefs: [CV002, CV004, CV005, CV008, CV012]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      Halt entry if another material flight failure or schedule delay creates a financing need
      before Gilmour demonstrates reliable orbital performance and revenue-bearing commercial
      conversion.
    claimRefs: [CV005, CV006, CV015]
