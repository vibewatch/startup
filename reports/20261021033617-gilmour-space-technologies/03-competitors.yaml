      - ["Satellite platform", "ElaraSat documented and operated on orbit", "Unknown", "Unknown", "Unknown", "Unknown", "Unknown"]
      - ["Controlled launch site", "Licensed Bowen Orbital Spaceport documented", "Unknown", "Unknown", "Unknown", "Unknown", "Unknown"]
    notes: >-
      Cells show only capabilities explicitly documented in the assigned sources;
      "unknown" means not established by this evidence set, not that a capability is
      absent.
    claimRefs: [CP001, CP002, CP003, CP005, CP008, CP010]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Provider or cohort
      - Documented package
      - Price or contract model
      - Included capability evidence
      - Investment implication
    rows:
      - [Gilmour Space, "Dedicated launch", "Not disclosed", "Eris mission path from Bowen", "Cannot compare delivered cost or schedule risk"]
      - [Gilmour Space, "Rideshare mission", "Not disclosed", "Rideshare path is marketed; prior ElaraSat used a U.S. rideshare", "Multi-homing remains feasible without disclosed exclusivity"]
      - [Gilmour Space, "Integrated satellite plus launch pathway", "Not disclosed", "ElaraSat, Eris, and spaceport are presented as an integrated stack", "Potential coordination advantage is unquantified"]
      - ["Flying U.S. peers", "Rocket Lab Electron and Firefly Alpha", "Not disclosed in assigned evidence", "Flying launch vehicles documented by SetterVC", "Operational maturity may outweigh unproven integration benefits"]
      - ["European development peers", "Isar, Orbex, and PLD small-launch vehicles", "Not disclosed in assigned evidence", "Dedicated small-launch positioning documented", "Price pressure and future capacity cannot yet be quantified"]
    notes: >-
      No comparable list or realized prices, discounts, minimum commitments, service
      levels, or contracted backlog were disclosed in the eight retained sources.
    claimRefs: [CP003, CP005, CP008, CP009, CP010, CP014, CP015]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal positioning separates documented launch maturity from documented breadth
      of the offering; scores are analytical classifications, not market benchmarks.
    data:
      points:
        - label: Gilmour Space
          x: 2
          y: 5
          note: "Test flight without orbit; launch vehicle, satellite bus, and licensed spaceport documented"
        - label: Rocket Lab
          x: 5
          y: 2
          note: "Electron described as flying; broader scope not evaluated in assigned evidence"
        - label: Firefly Aerospace
          x: 5
          y: 2
          note: "Alpha described as flying; broader scope not evaluated in assigned evidence"
        - label: Isar Aerospace
          x: 1
          y: 2
          note: "Development-stage rocket and in-house manufacturing documented"
        - label: Orbex
          x: 1
          y: 2
          note: "Prime development for polar and sun-synchronous missions documented"
        - label: PLD Space
          x: 1
          y: 2
          note: "Direct sub-tonne dedicated-launch peer; maturity details not established"
    approximationNotes: >-
      X is a 1-5 ordinal of launch maturity in the assigned evidence (1 development,
      2 test flight without orbit, 5 flying); Y is a 1-5 ordinal of documented offering
      breadth (2 launch vehicle only in this corpus, 5 launch plus satellite plus
      spaceport). Scores measure retained evidence, not undisclosed capabilities,
      reliability, price, market share, or a universal benchmark.
    claimRefs: [CP003, CP008, CP016]
callouts:
  - calloutType: risk
    title: Operational proof outranks infrastructure breadth
    body: >-
      Gilmour has assembled unusually broad sovereign infrastructure, but the assigned
      evidence still supports a pre-orbit launch-maturity classification. Repeat flight
      performance and contracted economics are the decisive moat tests.
    claimRefs: [CP002, CP003, CP012, CP014]
  - calloutType: assumption
    title: Pricing comparison remains open
    body: >-
      Packaging can be compared, but no retained source supports a normalized
      price-per-kilogram, mission price, discount, or realized-contract comparison.
    claimRefs: [CP009, CP015]
