company:
  name: Gilmour Space Technologies
chapter:
  number: 3
  title: Competitors
  summary: >-
    Gilmour Space is differentiated by an Australian launch-vehicle, satellite-platform,
    and licensed-spaceport stack, but that breadth has not yet translated into orbital
    launch heritage. The retained evidence shows a field that includes flying U.S.
    launch providers and European development-stage peers, while leaving price,
    backlog, reliability, and switching-cost comparisons materially unresolved.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant competitive set is wider than dedicated small-launch developers.
      Gilmour markets dedicated and rideshare mission paths, so a payload owner can
      compare a dedicated mission with a shared launch rather than choosing only among
      like-for-like rockets. SetterVC's explicitly illustrative list names Rocket Lab,
      Firefly Aerospace, Isar Aerospace, Orbex, and PLD Space; it describes the first
      two as flying providers and the latter three as development-stage small-launch
      peers. Gilmour's integrated offer adds ElaraSat and Bowen spaceport operations.
      The assigned evidence does not identify the full population of likely entrants,
      launch brokers, internal-build programs, or status-quo mission delays, so the
      landscape below is a documented sample rather than an exhaustive market census.
    claimRefs: [CP001, CP008, CP010]
    tableRefs: [TP001]
  - id: capability-and-maturity
    title: Capability breadth versus operational maturity
    body: >-
      Gilmour's strongest documented distinction is vertical breadth: Eris launch
      vehicles, the ElaraSat satellite platform, and a regulator-licensed orbital
      spaceport under one Australian operator. ElaraSat has operated on orbit after a
      U.S. rideshare launch, but Eris TestFlight1 fell back after 14 seconds and did
      not reach orbit. That creates an important asymmetry: satellite heritage and
      infrastructure are real, while launch reliability remains unproven. Rocket Lab
      and Firefly are described as flying vehicles in the retained peer source,
      whereas Isar, Orbex, and PLD are described principally through vehicles under
      development. The matrix therefore marks evidence not present in the assigned
      corpus as unknown instead of converting product descriptions into performance
      claims.
    claimRefs: [CP002, CP003, CP005, CP008, CP016]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: distribution-and-lock-in
    title: Distribution, access, and switching dynamics
    body: >-
      Bowen's licensing and the company's end-to-end manufacturing footprint create
      a potentially meaningful sovereign-access position for Australian commercial,
      government, and defence missions. Reproducing that position is not merely a
      vehicle-design exercise: management described a path involving 24 Queensland
      permits plus environmental and airspace approvals, and the company says it
      relies on hundreds of domestic suppliers. Those assets can increase partner and
      regulatory access advantages, but they do not yet prove customer lock-in.
      Payload customers can still multi-home across dedicated and rideshare options,
      and the retained sources disclose no exclusivity terms, migration costs,
      schedule guarantees, or contractual penalties. The stack may reduce coordination
      burden, but orbital reliability and repeat cadence remain the more important
      competitive proof points.
    claimRefs: [CP002, CP007, CP010, CP011, CP013, CP014]
  - id: pricing-and-moat
    title: Pricing evidence and moat durability
    body: >-
      No retained source publishes a comparable list price, realized contract price,
      discount schedule, service-level commitment, or firm launch backlog for Gilmour
      and the named peers. The pricing table therefore records packaging only and
      treats economics as unknown. Gilmour's January 2026 Series E and planned spending
      on vehicle qualification, manufacturing, test, and launch infrastructure provide
      capacity to keep developing the integrated model, but funding raised is not
      evidence of customer demand or launch economics. The first-flight engine failure
      is direct adverse evidence against assuming the infrastructure lead is already a
      durable moat. A defensible moat verdict requires repeat orbital success, cadence,
      contracted demand, and unit-level pricing that withstand comparison with flying
      alternatives.
    claimRefs: [CP004, CP006, CP009, CP012, CP013, CP014, CP015]
    tableRefs: [TP003]
