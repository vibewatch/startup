          - type: callout
            title: 融资不能证明资金续航
            body: A$217 million 的 E 轮是已募资本，不是当前可用现金、现金消耗、剩余基础设施承诺或支撑商业发射频次所需资金的证据。
            calloutType: assumption
            claimRefs:
              - CR013
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是按当前报告估值直接投资。Multiples 列出 2026 年 5 月 $721 million 的估值；独立来源和投资者来源证实存在大额 E
              轮，但没有提供用于优先权调整回报模型所需的股权结构表、优先股堆叠、收入、现金消耗、资金续航或单元经济性。战略融资验证了机构愿意为主权太空任务提供资金，但不能证明入场价格足以补偿技术和商业化风险。置信度为中等：融资与运营里程碑可见，但最影响决策的经济性仍属非公开信息。因此，入场纪律应要求经过验证的融资条款、当前财务模型和基于里程碑的定价，而不是依赖孤立的第三方估值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV012
      - number: '8.2'
        title: 投资论点、反论点与证明负担
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Gilmour 已搭建稀缺的澳大利亚基础设施，包括一体化运载火箭、卫星平台和获许可的轨道空间港，并得到公共资本和机构资本支持。ElaraSat 已被报道在轨运行，为卫星提供了具体验证点；E
              轮资金则指定用于 Eris 开发、制造扩产和空间港扩建。反论点同样重要。Eris 首次尝试约 14
              秒后坠毁，入轨、可靠性、发射频次和发射经济性都未经验证。大额融资可以延长验证计划，但如果重复测试或延期在产生收入的发射频次形成前消耗资本，也可能先带来进一步稀释。只有技术证明与商业证据同步改善，投资逻辑才应推进。
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              上市公司收入倍数只能提供背景，不能直接回答估值。保留的市场数据来源列出了不同产品组合、成熟度、利润率和资本结构企业的宽泛区间；指定证据中没有 Gilmour
              已验证的收入分母，因此套用这些倍数会制造虚假精确。乐观情景要求成功入轨，随后证明任务已签约且经济性有吸引力。基准情景假设 E
              轮支持技术持续进步，在财务披露改善前暂不形成价格判断。悲观情景是验证周期延长、发射反复失败或商业化延期，消耗新资本并迫使重定价或稀释。没有私有证据，任何情景都无法支持可辩护的估值区间或目标回报。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 决策门槛、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备度较低，因为保留来源既没有确定公开市场时间表，也没有提供交易证据，更没有披露用于检验战略或上市公司可比对象的财务画像。下一道投资评估门槛不是又一条融资新闻，而是一套把飞行可靠性连接到收入、利润率、现金消耗和合同积压的证据。所需尽调包括
              E 轮文件、完全摊薄股权结构表、清算优先权、月度消耗与资金续航、发射和卫星积压、取消条款、每次任务贡献经济性，以及当前 Eris
              验证计划。成功入轨并证明商业转化会改善判断。若反复失败、进度严重滑移，或在商业发射频次形成前需要融资，论点将破裂，应停止入场。
            claimRefs:
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格是尚未解决的变量
            body: 机构支持和主权战略价值足以支持继续尽调，但不能替代证券条款、运营经济性或可重复的轨道表现。投资评估前应要求私有数据包和以里程碑为条件的入场条款。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV012
          - type: callout
            title: 论点破裂触发条件
            body: 如果又一次重大飞行失败或进度延期导致公司在证明可靠轨道表现和产生收入的商业转化前需要融资，应停止入场。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV015
