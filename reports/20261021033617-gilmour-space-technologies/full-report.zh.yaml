chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与一体化运营模式
        blocks:
          - type: paragraph
            body: >-
              公司由兄弟 Adam Gilmour 和 James Gilmour 于 2013 年在黄金海岸创立，至今仍是一家私营澳大利亚发射服务开发商。官方定位将三项相互强化的资产组合在一起：Eris
              运载火箭、ElaraSat 卫星平台，以及 Bowen 获许可的发射运营。黄金海岸设有总部和制造基地，Bowen
              则是实际发射场。这不只是单枚火箭的产品叙事：管理层正试图为商业、政府和国防任务掌控运载火箭、航天器与发射场之间的接口。一体化可能减少协调摩擦，但也把资本与执行压力集中在一家仍处于开发阶段的公司内。
