  - id: TV003
    title: 看涨、基准与看跌情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 看涨
        - 成功入轨，随后保持可靠发射节奏，并完成经验证的创收任务
        - 里程碑落地后重新评估；在收入和融资条款披露前，无法提出可辩护的区间
        - 入轨加上商业合同转化
        - 资质成功并不等于形成有经济价值的发射需求
      - - 基准
        - E 轮融资支持持续资质认证和制造推进，但商业证明仍有限
        - 暂缓形成价格判断，采用与里程碑挂钩的入场条款
        - 透明的测试进展、现金跑道和积压订单披露
        - 进度延误在形成发射节奏前消耗现金跑道
      - - 看跌
        - 进一步的飞行失败或延误迫使公司在商业规模化前追加资本
        - 公开证据无法界定下行空间，资本减值是合理可能
        - 技术挫折反复，或近期需要融资
        - 下轮融资、惩罚性优先权，或失去客户承诺
    notes: 情景值和概率有意不作量化，因为分配到的证据缺少收入、利润率、现金流、股权结构表、优先权和可靠退出输入。
