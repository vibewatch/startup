    rows:
      - - 氧化剂泵电机或逆变器故障
        - 已在 TestFlight1 中发生
        - 严重
        - 已说明设计、鉴定和流程改进；但未证明已完成
        - 推力和运载器再次损失
        - 鉴定报告、集成级段测试，以及成功飞越此前故障窗口的证据
      - - 电气集成与回馈
        - 2025 年 5 月发射准备期间曾提前发生整流罩分离
        - 高
        - 直接问题已修复；更广泛的复发证据不可得
        - 意外电气交互导致发射台延误或任务损失
        - 系统级故障注入、功率隔离和回归测试证据
      - - 发射节奏与天气敏感性
        - 发射批次经历了气旋、风力和运营延误
        - 高
        - 既有批次已完成；可重复的发射节奏尚未证明
        - 每个发射窗口都可能导致收入和客户里程碑延期
        - 经测试的周转方案、天气假设和进度储备
      - - 关键供应商接口
        - 受影响的泵系统硬件中包括外部采购组件
        - 高
        - 供应商层面的整改和替代方案未披露
        - 长交期部件重新设计、重新鉴定或反复缺陷
        - 供应商身份、逃逸分析、第二供应源、库存和验收测试
      - - 集成扩张
        - A$75 million NRFC 投资目标覆盖火箭、卫星、制造和航天港扩张
        - 中
        - 资本已承诺；运营执行尚未证明
        - 设施、人员和运载器同步扩张，给质量体系带来压力
        - 良率、不合格、返工、人员配置和测试吞吐量指标
    notes: 严重性和可能性是分析师根据所引事件及已说明的整改措施作出的判断；不代表任何概率百分比， 且由于鉴定记录不可得，缓解措施成熟度仍然有限。
