              相关竞争集合比专用小型发射开发商更广。Gilmour 同时面向专用任务和拼车发射，因此载荷所有者可以比较专用任务与共享发射，而不必只在同类火箭之间选择。SetterVC 明确称其名单仅作示例，列出 Rocket
