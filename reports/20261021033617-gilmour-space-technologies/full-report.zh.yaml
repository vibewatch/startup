        blocks:
          - type: paragraph
            body: >-
              因此，财务逻辑得到融资支持，而非收入验证。AFR 于 2025 年 7 月报道，尽管首次飞行时间很短，投资者仍预计公司将获得超过 A$100 million 的新增资本；后续 NRFC
              披露显示，公司完成了一笔规模大得多的 E
              轮融资。这证明赞助方仍有意愿、主权能力也有价值，但没有解决现金消耗、债务或项目融资义务、发射层面的毛利率、营运资金需求，或实现可重复轨道服务所需的资本规模。投资评估仍应以银行流水、月度现金消耗、带付款里程碑的已承诺积压、单次飞行成本模型和覆盖下一技术里程碑的资金桥为条件。
