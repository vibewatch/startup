      - number: '7.2'
        title: 监管、法律与安全暴露
        blocks:
          - type: paragraph
            body: >-
              Bowen 并非未获许可的概念场址：Gilmour 报告称其于 2024 年 3 月取得设施许可、2024 年 11 月取得发射许可，并于 2025 年 7 月获得飞行管理计划批准。独立报道还称，CASA 于
              2025 年 4 月下旬批准，澳大利亚航天局于 2025 年 5 月 13
              日为首飞作出最终签字。这些里程碑降低了场址建设风险，但不会让未来任务无需许可；首次轨道任务本身就显示监管顺序可能推动进度变化。TestFlight1 之后，Gilmour 称最终调查报告已与 Space
              Regulator 办公室一并提交给澳大利亚航天局。公司还列出 ISO 9001、ISO 14001 和 ISO 45001
              认证，并称异常没有造成人员受伤或不利环境影响。这些是积极控制措施，但保留来源池无法独立确认认证范围、当前任务特定许可条件、保险充足性、诉讼状态、环境执法记录或监管方是否接受纠正措施。这些遗漏仍是尽调事项，而不是不存在暴露的证据。
