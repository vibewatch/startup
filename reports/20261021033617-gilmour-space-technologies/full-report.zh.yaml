        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应围绕小型载荷进入轨道来界定，而不是覆盖整个太空经济。Gilmour 面向商业、政府和国防任务，提供涵盖 Eris 运载火箭、ElaraSat 卫星平台及获许可 Bowen
              空间港的一体化方案。这形成了核心发射服务市场，以及卫星平台和高超音速测试等相邻市场；但制造、下游卫星应用和广义太空服务支出应排除在核心边界之外。现状替代方案包括海外专用发射、拼车发射、轨道转移服务，以及等待合适运力或轨道通达条件后再执行任务。证据表明轨道通达受限，但没有量化
              Gilmour 能争取多少支出。
