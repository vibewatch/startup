        blocks:
          - type: paragraph
            body: >-
              已披露的资金用途指向纵向整合的成本基础。NRFC 称其 A$75 million 投资将用于推进 Eris、扩大火箭和卫星制造，并扩建 Bowen；同时披露员工数超过 220 人，且依赖数百家澳大利亚供应商。此前
              E 轮融资也被描述为用于制造、测试和初始发射。NRFC 报道 E 轮融资额为 A$217 million，但这只是该轮累计融资，不是已披露的手头现金或资金续航。2025 年 7
              月的飞行结果进一步说明，在假设生产频次带来经营杠杆前，必须建模重复测试硬件、发射场运营、返工和进度滑移。
