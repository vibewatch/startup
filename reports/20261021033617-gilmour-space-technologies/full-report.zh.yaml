        title: 资本基础与已披露规模
        blocks:
          - type: paragraph
            body: >-
              当前最清晰的规模指标是融资和员工数，而非商业产出。多份来源称 E 轮融资为 A$217 million；一份追踪资料折算约为 US$145 million。澳大利亚一家科技媒体称估值超过 $1
              billion，但抓取文本没有注明币种。NRFC 称其投资 $75 million，并与 Hostplus 共同领投；同一批公开证据显示员工数超过 220 人。此前市场曾报道 E 轮前累计获得 $142
              million 风投，但币种口径、补助、债务、老股交易、收入、现金余额和资金续航披露不足，无法据此计算可用总资本或资本效率。
