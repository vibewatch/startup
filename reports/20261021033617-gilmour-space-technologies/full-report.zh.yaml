      - number: '1.4'
        title: 里程碑、技术挫折与下一项验证点
        blocks:
          - type: paragraph
            body: >-
              Gilmour 已将基础设施和航天器开发转化为具体里程碑：Bowen 获得轨道发射许可，ElaraSat 已在轨运行，Eris 于 2025 年 7 月离开发射台。但火箭约 14 秒后坠毁。Adam
              Gilmour 最初将损失归因于疑似发动机故障；后续追踪资料称，2026 年 4 月调查发现两台一级发动机的泵电机和逆变器存在电气与热故障。截至该追踪资料 2026 年 9 月更新，下一次尝试仍计划在 2026
              年进行。因此，下一项决定性证据是重复飞行，而不是首次短暂升空。指定来源没有证明截至本次运行日期第二次尝试已经完成。
