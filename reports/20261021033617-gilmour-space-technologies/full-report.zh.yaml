            body: >-
              公开领导层证据有限。Adam Gilmour 一贯被列为联合创始人兼 CEO，而指定材料只将 James Gilmour 列为联合创始人，未给出其当前运营职务。NewSpaceTracker 报道，前 NASA
              副局长 Pamela Melroy 于 2026 年 6 月加入董事会，带来相关机构经验。但公开名册无法确认完整的高管团队、董事会构成、投票权、继任计划或技术权限分工。Adam 同时担任 CEO
