              平台。这种组合可能减少运载火箭、航天器和发射场供应商之间的协调，但公开证据没有提供载荷接口控制文件、服务级别承诺、集成时间表或实际任务价格。因此产品边界清晰，但客户交接和合同绩效范围大多仍属非公开信息。
