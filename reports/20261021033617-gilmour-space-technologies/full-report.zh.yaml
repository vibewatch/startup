        blocks:
          - type: paragraph
            body: >-
              Bowen 的许可和公司端到端制造布局，为澳大利亚商业、政府和国防任务形成了潜在的重要主权通达地位。复制这一地位不只是设计火箭：管理层描述的路径涉及 24
              项昆士兰许可，以及环境和空域审批；公司还称依赖数百家本土供应商。这些资产可能提升合作伙伴和监管通达优势，但尚未证明客户会被锁定。载荷客户仍可在专用发射和拼车方案之间多平台选择，保留来源也没有披露排他条款、迁移成本、进度保证或合同罚则。一体化架构可能降低协调负担，但轨道可靠性和可重复发射频次仍是更重要的竞争验证点。
