              秒后结束，因此可靠性和发射频次仍未经验证。业务资本密集：公共投资者正在为运载火箭开发、制造扩产和空间港扩建提供资金，供应链则覆盖数百家澳大利亚供应商。监管许可、任务保障、载荷集成、天气和生产准备度都可能拉长采用周期。因此，估值应更重视已证明的轨道交付和产生收入的积压订单，而不是宽泛的行业增长叙事。
