              供应链广泛，且至少一条已披露的故障路径跨越了自制与外购边界。National Reconstruction Fund Corporation 称 Gilmour
              依赖数百家澳大利亚供应商，飞行调查则在受影响的泵电机和逆变器中发现了外购部件。两个来源都没有说明供应商、替代资质、交付周期或集中度，因此不能仅凭供应商数量推断韧性。资本依赖同样重大。NRFC 承诺 A$75
