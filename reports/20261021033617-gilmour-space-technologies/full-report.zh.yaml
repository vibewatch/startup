              轮。已募融资不等于可用现金：证据没有披露现金消耗、当前现金、资金续航、单次发射经济性、剩余基础设施承诺或融资条件。因此，投资者应把融资视为执行昂贵计划的能力，而不是计划已经获得可靠商业运营所需的全部资金。
