  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 飞行可靠性与运营暴露
        blocks:
          - type: paragraph
            body: >-
              Eris 已从地面开发跨入飞行阶段，但尚未证明轨道可靠性。独立报道称 TestFlight1 升空约 14 秒后返回地面。公司后续调查将任务损失归因于氧化剂泵子系统的两种独立故障模式：一台一级发动机在点火约 9
              秒后失去推力，另一台在约 17
              秒时出现类似表现。已披露故障涉及泵电机和逆变器，包括外购部件。因此，这既是设计验证风险，也是供应商接口风险，不只是孤立的发射运营问题。此前由电气反馈触发的整流罩分离，以及反复的天气和运营延期，又增加了系统集成和发射频次风险。Gilmour
              称正在实施设计、验证和流程改进，但指定证据没有显示重新验证已完成或重复飞行成功。能解决泵故障发现的 TestFlight2 是核心技术去风险门槛。
