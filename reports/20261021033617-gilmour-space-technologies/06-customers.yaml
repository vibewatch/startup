    title: Customer evidence-maturity journey
    type: journey-map
    summary: >-
      The available evidence reaches technical qualification and a named partner mission, but
      leaves commercial contracting, production launch, renewal, and expansion largely unverified.
    data:
      items:
        - label: Payload need
          value: Prospective
          detail: Satellite and payload operators are invited to contact the launch sales team.
          touchpoints:
            - Launch enquiry email
            - Official mission-options page
        - label: Mission fit
          value: Offered
          detail: Dedicated launch, rideshare, satellite-platform, and hypersonic options are presented.
          touchpoints:
            - Eris launch services
            - ElaraSat platform
        - label: Contracting
          value: Not disclosed
          detail: Pricing, deposits, contracted capacity, and backlog are absent from retained evidence.
          touchpoints:
            - Procurement diligence
            - Contract schedule request
        - label: Technical qualification
          value: Partial
          detail: ElaraSat operated on orbit, while Eris TestFlight 1 did not reach orbit.
          touchpoints:
            - ElaraSat operation
            - Eris flight testing
        - label: Production deployment
          value: Partner proof
          detail: Starfish reported controlled proximity operations around ElaraSat.
          touchpoints:
            - Starfish Otter Pup 2
            - ElaraSat
        - label: Renewal and expansion
          value: Not disclosed
          detail: No retention, renewal, expansion, or concentration metrics are available.
          touchpoints:
            - Renewal schedule request
            - Customer cohort analysis
    approximationNotes: >-
      Ordered stages show evidence maturity, not a measured conversion funnel or verified
      customer process; no conversion rates are inferred.
    claimRefs: [CU002, CU004, CU006, CU009, CU010, CU016]
callouts:
  - calloutType: risk
    title: Commercial proof remains the central customer diligence gap
    body: >-
      Technical milestones and named relationships do not establish a revenue-bearing backlog
      or durable customer demand. Obtain the contract ledger before assigning value to customer
      scale, retention, expansion, or concentration.
    claimRefs: [CU007, CU008, CU016]
