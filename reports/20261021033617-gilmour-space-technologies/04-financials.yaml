artifact: financials
slug: gilmour-space-technologies
runDate: 2026-10-21
company:
  name: Gilmour Space Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Gilmour Space has an integrated but still financially opaque revenue model spanning launch,
    satellite, spaceport, and hypersonic services. A$217 million of disclosed Series E funding and
    a A$75 million NRFC investment expand the operating base, but neither funding raised nor stated
    launch cadence establishes revenue, margin, cash availability, or runway.
sections:
  - id: revenue-architecture
    title: Revenue architecture is broad, but monetization remains unpriced
    body: >-
      Gilmour Space presents an integrated commercial system rather than a single launch product:
      Eris launch services, the ElaraSat satellite platform, Bowen Orbital Spaceport operations,
      and Hyperflight hypersonic services. The customer proposition is directed to commercial,
      government, and defence missions, with the official site inviting payload customers to
      assess dedicated launch, rideshare, and other mission options. This creates several plausible
      transaction units—launch, payload slot, satellite bus, spaceport service, or flight
      campaign—but the retained official pages publish no list price, standard contract structure,
      discount schedule, or realized price. The integrated offer may improve capture per mission;
      it also makes revenue recognition and segment economics impossible to separate without
      contracts and management accounts.
    claimRefs: [CI001, CI002, CI003, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: public-traction
    title: Technical activity is visible; revenue quality is not
    body: >-
      Public evidence shows operating activity but does not establish commercial revenue. The first
      Eris test flight was airborne for about 14 seconds and did not reach orbit; ABC reported the
      chief executive attributed the crash to apparent engine failure. Management nevertheless
      described a path from a second rocket intended to reach orbit to a later rocket carrying a
      commercial satellite, and a long-term cadence goal of four launches per year before exceeding
      twelve. Those are operating targets, not booked sales or utilization. The retained EquityZen
      page places revenue and financial data behind investor sign-up, while the official pages and
      release index provide no realized revenue, backlog value, customer concentration, or contract
      conversion data.
    claimRefs: [CI004, CI008, CI009, CI010, CI014]
  - id: cost-and-capital
    title: Manufacturing scale and repeated flights make the model capital intensive
    body: >-
      The disclosed use of capital points to a vertically integrated cost base. NRFC says its A$75
      million investment is intended to advance Eris, scale rocket and satellite manufacturing, and
      expand Bowen; it also reports more than 220 employees and reliance on hundreds of Australian
      suppliers. Earlier Series D proceeds were likewise described as funding manufacture, testing,
      and initial launches. NRFC reports A$217 million raised in the Series E round, but that amount
      is cumulative financing for the round, not reported cash on hand or runway. The July 2025
      flight outcome reinforces the need to model repeated test hardware, launch-site operations,
      rework, and schedule slippage before assuming production cadence creates operating leverage.
    claimRefs: [CI005, CI006, CI007, CI008, CI012, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financing validates strategic support, not unit economics
    body: >-
      The financial case is therefore financing-supported rather than revenue-validated. AFR
      reported in July 2025 that investors expected more than A$100 million of fresh capital despite
      the abbreviated first flight, and the later NRFC disclosure shows that a much larger Series E
      was assembled. This is evidence of continued sponsor appetite and sovereign-capability value,
      but it does not resolve cash burn, debt or project-finance obligations, launch-level gross
      margin, working-capital needs, or the amount of capital required to achieve repeatable orbital
      service. Underwriting should remain conditional on bank statements, monthly burn, committed
      backlog with payment milestones, cost-per-flight builds, and a runway bridge through the next
      technical milestone.
    claimRefs: [CI006, CI011, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Commercial unit, Public status, Revenue-quality diligence]
    rows:
      - [Eris launch services, Dedicated or rideshare access to orbit, Launch or payload slot, Pre-repeatable orbital service, Signed contracts and payment milestones]
      - [ElaraSat platform, Satellite-bus delivery or integrated mission, Satellite bus or mission, On-orbit capability reported by NRFC, Segment revenue and manufacturing margin]
      - [Bowen spaceport, Launch-site and campaign operations, Campaign or site service, Licensed operating asset, Internal transfer pricing and third-party utilization]
      - [Hyperflight, Hypersonic flight-test service, Flight campaign, Listed as an official service, Customer-funded bookings and direct campaign cost]
    notes: >-
      Streams and status come from retained official or investor sources; no row should be read as
      evidence of realized revenue, published pricing, or positive gross margin.
    claimRefs: [CI001, CI002, CI003, CI005, CI014]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Offer, Likely contract basis, Public list price, Realized price evidence, Required diligence]
    rows:
      - [Dedicated launch, Mission-specific contract, Not disclosed, Not disclosed, Executed order forms and cancellation terms]
      - [Rideshare launch, Payload slot or mass allocation, Not disclosed, Not disclosed, Price per kilogram and minimum commitment]
      - [ElaraSat platform, Bus sale or integrated mission, Not disclosed, Not disclosed, Bill of materials and milestone billing]
      - [Spaceport or Hyperflight service, Campaign-specific service, Not disclosed, Not disclosed, Facility fee schedule and customer-funded costs]
    notes: >-
      Contract bases are analytical classifications of the official service descriptions; prices,
      discounts, realized revenue, and recognition policies were unavailable in the assigned evidence.
    claimRefs: [CI001, CI003, CI014, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value or status, Confidence, Why it matters, Diligence request]
    rows:
      - [Series E funding raised, "A$217 million", Medium, Funds scaling but is not cash available, Cash receipts by close and restricted-use schedule]
      - [NRFC investment, "A$75 million", High, Material external capital for assets and scaling, Investment instrument and draw conditions]
      - [Target launch cadence, "4 per year, eventually more than 12", Medium, Cadence drives fixed-cost absorption, Capacity plan and probability-weighted manifest]
      - [First Eris flight result, "About 14 seconds; did not reach orbit", High, Implies further test and rework cost, TestFlight-1 cost and TestFlight-2 budget]
      - [Revenue gross margin burn and runway, Not publicly disclosed, High confidence in gap, Blocks capital-efficiency underwriting, Monthly management accounts and 24-month cash bridge]
    notes: >-
      Funding raised is not cash on hand; cadence is a management target; the flight result is an
      operating milestone, not a revenue measure; unavailable metrics are not estimated as zero.
    claimRefs: [CI005, CI006, CI008, CI009, CI013]
figures:
  - id: FI001
    title: Mission-to-economics evidence bridge
    type: flow
    summary: >-
      The operating path is public, while contract conversion, recognized revenue, and gross profit
      remain unverified.
    data:
      nodes:
        - id: mission-need
          label: Commercial government or defence mission need
        - id: mission-design
          label: Dedicated rideshare satellite or hypersonic configuration
        - id: contracted-offer
          label: Contract price and payment milestones not disclosed
        - id: delivery-assets
          label: Eris ElaraSat and Bowen delivery assets
        - id: flight-outcome
          label: Repeatable orbital delivery not yet demonstrated
        - id: economics
          label: Recognized revenue and gross profit not disclosed
    approximationNotes: >-
      This is an evidence-status sequence, not a value-proportional funnel or a forecast of conversion.
    claimRefs: [CI001, CI002, CI008, CI010, CI014, CI016]
callouts:
  - calloutType: risk
    title: Funding cannot substitute for a runway bridge
    body: >-
      The A$217 million Series E disclosure establishes capital raised, not current unrestricted
      cash. Underwriting requires cash receipts, monthly burn, debt obligations, milestone spending,
      and remaining capital needs through repeatable orbital service.
    claimRefs: [CI005, CI006, CI012, CI013]
