company:
  name: Gilmour Space Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Gilmour addresses a narrow initial market in small-satellite launch and adjacent satellite-platform
    services, with sovereign Australian access and southern-hemisphere geography as differentiators.
    The evidence supports capacity and market-boundary lenses but not a defensible monetary TAM, SAM,
    SOM, buyer budget, or contracted-demand estimate.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market should be bounded around access to orbit for small payloads rather than the
      entire space economy. Gilmour presents an integrated offer spanning Eris launch vehicles,
      ElaraSat satellite platforms, and the licensed Bowen spaceport for commercial, government, and
      defence missions. That creates a core launch-services market plus satellite-bus and hypersonic-test
      adjacencies, but manufacturing, downstream satellite applications, and broad space-services spend
      should remain outside the core boundary. Status-quo substitutes include foreign dedicated launch,
      rideshare missions, orbital-transfer services, and delaying a mission until suitable capacity or
      orbit access becomes available. The evidence says access is constrained, but it does not quantify
      how much spending is contestable by Gilmour.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      A monetary TAM or growth rate cannot be responsibly calculated from this source pool because none
      supplies a market-spend denominator, forecast period, geography-specific procurement total, or
      comparable analyst methodology. The available sizing lenses are instead supply-side and unit-based:
      NewSpace Index lists one launch, a $7 million launch cost, and 215 kilograms of performance, while
      a Skybrokers supplier page describes capacity of up to about 300 kilograms. ABC reports management's
      aspiration to ramp to four launches per year and eventually more than twelve, but this is a target,
      not contracted demand or demonstrated throughput. These measures frame a potential serviceable
      envelope while leaving utilization, pricing realization, mission mix, and revenue conversion open.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM016]
    tableRefs: [TM002]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The source-backed buyer set comprises commercial satellite and payload operators, government and
      defence mission sponsors, and organizations seeking a satellite platform or hypersonic-test service.
      Engineers and mission teams are the likely users of launch and platform capability, while program,
      procurement, or capability owners are the likely payers; however, the assigned evidence does not
      identify actual budget owners, procurement cycles, contract values, or conversion rates. Adoption
      therefore depends on matching payload mass and orbit needs, passing regulatory and safety gates,
      demonstrating reliable flight performance, and converting sovereign-access policy into funded
      missions. The licensed Bowen site reduces one infrastructure barrier, but it does not by itself
      establish customer demand.
    claimRefs: [CM002, CM003, CM004, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      The strongest drivers are policy demand for sovereign access, Australia's southern-hemisphere
      location, public investment in domestic capability, and the ability to combine launch, satellite,
      and spaceport services. The same evidence also exposes material constraints. Eris has one recorded
      launch and its debut ended after about fourteen seconds, so reliability and cadence remain
      unproven. The business is capital intensive: public investors are funding vehicle development,
      manufacturing scale, and spaceport expansion, while the supply chain spans hundreds of Australian
      suppliers. Regulatory licensing, mission assurance, payload integration, weather, and production
      readiness can lengthen adoption. Valuation should therefore weight proven orbital delivery and
      revenue-bearing backlog more heavily than broad industry-growth narratives.
    claimRefs: [CM004, CM008, CM009, CM011, CM012, CM013, CM014, CM015]
