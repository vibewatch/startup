              - CU004
              - CU006
              - CU009
              - CU010
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof remains the central customer diligence gap
            body: >-
              Technical milestones and named relationships do not establish a revenue-bearing backlog or durable
              customer demand. Obtain the contract ledger before assigning value to customer scale, retention,
              expansion, or concentration.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Flight reliability and operational exposure
        blocks:
          - type: paragraph
            body: >-
              Eris has crossed the threshold from ground development into flight, but it has not yet demonstrated
              orbital reliability. Independent accounts report that TestFlight1 returned to the ground about 14 seconds
              after liftoff. The company's subsequent investigation attributes the mission loss to two independent
              failure modes in the oxidiser-pump subsystem: one first-stage motor lost thrust about nine seconds after
              ignition and another showed similar behaviour around 17 seconds. The disclosed faults involved pump motors
              and inverters, including externally sourced components. This is therefore both a design-qualification risk
              and a supplier-interface risk, not merely an isolated launch operations issue. Earlier fairing separation
              from electrical backfeed and repeated weather and operational delays add evidence of systems-integration
              and cadence risk. Gilmour says design, qualification, and process improvements are being implemented, but
              the assigned evidence does not show completed requalification or a successful repeat flight. A clean
              TestFlight2 that closes the pump findings is the central technical de-risking gate.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Bowen is not an unlicensed concept site: Gilmour reports a facility licence in March 2024, a launch permit
              in November 2024, and approval of a flight management plan in July 2025. Independent reporting also
              describes CASA approval in late April 2025 and final Australian Space Agency sign-off on May 13, 2025 for
              the maiden flight. Those milestones reduce site-establishment risk but do not make future missions
              permissionless; the first orbital campaign itself showed that regulatory sequencing can move a schedule.
              After TestFlight1, Gilmour said its final investigation report was submitted to the Australian Space
              Agency with the Office of the Space Regulator. The company also lists ISO 9001, ISO 14001, and ISO 45001
              certifications and said the anomaly caused no injuries or adverse environmental impacts. These are
              positive controls, but the retained pool does not independently establish certification scope, current
              mission-specific permit conditions, insurance adequacy, litigation status, environmental enforcement
              history, or regulator acceptance of corrective actions. Those omissions remain diligence items rather than
              evidence that no exposure exists.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR011
      - number: '7.3'
        title: Supplier, capital, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The supply chain is broad and at least one disclosed failure path crossed the make-versus-buy boundary.
              The National Reconstruction Fund Corporation says Gilmour relies on hundreds of Australian suppliers,
              while the flight investigation identified externally supplied components among the affected pump motors
              and inverters. Neither source names the supplier, alternative qualification status, lead time, or
              concentration, so resilience cannot be inferred from supplier count alone. Capital dependence is also
              material. The NRFC committed A$75 million for Eris development, manufacturing scale-up, and Bowen
              expansion, and two government sources describe a A$217 million Series E led by NRFC and Hostplus. Funding
              raised is not cash available: the evidence does not disclose burn, current cash, runway, launch-unit
              economics, remaining infrastructure commitments, or financing conditions. Investors should therefore treat
              financing as capacity to execute an expensive plan, not proof that the plan is fully funded through
              reliable commercial operations.
            claimRefs:
              - CR003
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Monitoring, mitigations, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Monitoring should focus on evidence that converts stated remediation into demonstrated reliability. Before
              the next launch, diligence should obtain the regulator-accepted anomaly report, root-cause closure matrix,
              redesigned pump and inverter qualification results, supplier change-control records, integrated-stage test
              results, and the mission-specific permit path. During TestFlight2, the minimum technical proof is stable
              first-stage thrust through the prior failure window, nominal guidance and separation behaviour, and safe
              completion within the licensed envelope. After flight, the investment case requires a credible cadence
              plan, contracted customer milestones, and a cash runway that absorbs another test failure without
              emergency financing. A repeat pump or integration failure, regulator refusal or material delay after
              corrective-action review, inability to qualify alternate critical suppliers, or runway exhaustion before
              orbital proof would break the near-term thesis. Conversely, a safe, regulator-cleared repeat flight with
              disclosed corrective-action closure would materially reduce the dominant risk, although it would not by
              itself establish commercial economics.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Return-to-flight is the dominant thesis gate
            body: >-
              The next flight must demonstrate closure of the oxidiser-pump and electrical-integration findings; a
              stated redesign without qualification evidence does not reduce residual risk enough for underwriting.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR016
          - type: callout
            title: Financing does not establish runway
            body: >-
              The A$217 million Series E is capital raised, not evidence of current cash available, burn, remaining
              infrastructure commitments, or funding through commercial launch cadence.
            calloutType: assumption
            claimRefs:
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more rather than invest at the currently reported mark. Multiples lists a
              $721 million valuation in May 2026, while independent and investor sources corroborate a large Series E
              but do not provide the cap table, preference stack, revenue, cash burn, runway, or unit economics required
              for a preference-adjusted return model. Strategic financing validates institutional willingness to fund
              the sovereign-space mission; it does not establish that the entry price compensates for technical and
              commercialization risk. Confidence is medium because financing and operating milestones are visible, but
              the most decision-critical economics remain private. Entry discipline should therefore require verified
              financing terms, a current financial model, and milestone-based pricing rather than relying on an isolated
              third-party valuation estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV012
      - number: '8.2'
        title: Thesis, anti-thesis, and proof burden
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Gilmour has assembled scarce Australian infrastructure: an integrated launch vehicle,
              satellite platform, and licensed orbital spaceport, supported by public and institutional capital.
              ElaraSat's reported on-orbit operation provides a concrete satellite proof point, and the Series E is
              earmarked for Eris development, manufacturing scale, and spaceport expansion. The anti-thesis is equally
              material. The first Eris attempt crashed after roughly 14 seconds, leaving orbital insertion, reliability,
              cadence, and launch economics unproven. A large capital raise can extend the qualification program, but it
              may also precede further dilution if repeated tests or delays consume capital before revenue-bearing
              launch cadence emerges. The investment case should move only when technical proof and commercial evidence
              improve together.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public-company revenue multiples are context rather than a valuation answer. The retained market-data
              source lists a wide range across businesses with different product mixes, maturity, margins, and capital
              structures; Gilmour has no verified revenue denominator in the assigned evidence, so applying those
              multiples would create false precision. The bull case requires orbital success followed by evidence of
              contracted, economically attractive missions. The base case assumes continued technical progress under the
              Series E while postponing price conviction until financial disclosure improves. The bear case is a longer
              qualification cycle, repeated launch failure, or commercialization delay that consumes the new capital and
              forces repricing or dilution. None of these cases supports a defensible valuation range or target return
              without private evidence.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Decision gates, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is low because the retained sources establish neither a public-market timetable nor
              transaction evidence, and they do not disclose the financial profile needed to test strategic or public
              comparables. The next underwriting gate is not another funding headline; it is a package of evidence
              connecting flight reliability to revenue, margin, cash consumption, and contractual backlog. Required
              diligence includes Series E documents, the fully diluted cap table, liquidation preferences, monthly burn
              and runway, launch and satellite backlog, cancellation terms, per-mission contribution economics, and the
              current Eris qualification plan. A successful orbital flight plus verified commercial conversion would
              improve the view. Repeated failures, material schedule slippage, or a financing need before commercial
              cadence would break the thesis and should halt entry.
            claimRefs:
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the unresolved variable
            body: >-
              Institutional backing and sovereign strategic value justify continued diligence, but they do not
              substitute for security terms, operating economics, or repeatable orbital performance. Require the
              private-data package and milestone-conditioned entry terms before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV012
          - type: callout
            title: Thesis-break trigger
            body: >-
              Halt entry if another material flight failure or schedule delay creates a financing need before Gilmour
              demonstrates reliable orbital performance and revenue-bearing commercial conversion.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV015
