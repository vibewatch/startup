  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded around access to orbit for small payloads rather than the entire
              space economy. Gilmour presents an integrated offer spanning Eris launch vehicles, ElaraSat satellite
              platforms, and the licensed Bowen spaceport for commercial, government, and defence missions. That creates
              a core launch-services market plus satellite-bus and hypersonic-test adjacencies, but manufacturing,
              downstream satellite applications, and broad space-services spend should remain outside the core boundary.
              Status-quo substitutes include foreign dedicated launch, rideshare missions, orbital-transfer services,
              and delaying a mission until suitable capacity or orbit access becomes available. The evidence says access
              is constrained, but it does not quantify how much spending is contestable by Gilmour.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
