          label: Integrated assets
          detail: Launch vehicle, satellite platform, and licensed spaceport.
        - id: satellite-proof
          label: Satellite proof
          detail: ElaraSat has reported successful on-orbit operation.
        - id: launch-gap
          label: Launch proof gap
          detail: First Eris flight ended after about 14 seconds.
        - id: economics-gap
          label: Economics gap
          detail: Revenue, runway, unit economics, and security terms remain undisclosed.
        - id: recommendation
          label: Research more
          detail: Reprice only after orbital, commercial, and financing-term proof.
    approximationNotes: The sequence is an analytical decision chain, not a probability-weighted valuation model.
    claimRefs:
