      - number: '5.3'
        title: Maturity, reliability, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The portfolio has uneven maturity. NRFC and Startup Daily report that the 100-kilogram ElaraSat bus
              reached orbit on a United States rideshare mission, providing meaningful spacecraft heritage. Eris has not
              yet demonstrated orbit: TestFlight1 flew for about 14 seconds in July 2025 before returning to the launch
              area, with the chief executive attributing the outcome to an apparent engine failure. Earlier, an
              electrical feedback event unintentionally triggered the single-use fairing separation system and delayed
              the attempt. The current supplier-derived roadmap targets TestFlight2 for early 2027. That sequence shows
              learning activity, but not closure of the engine or fairing failure modes, orbital insertion, payload
              deployment, launch cadence, or repeatability.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation, controls, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Gilmour's most defensible public differentiation is system ownership: vehicle, satellite platform, and
              licensed Australian launch site under one operator, with sovereign access as the customer proposition. The
              company also states that it is certified to ISO 9001, ISO 45001, and ISO 14001, which signals formal
              quality, safety, and environmental management systems but does not by itself validate launch reliability.
              No public datasheet or interface control document was available in the retained evidence, and the assigned
              pool contained no developer repository, practitioner forum, engineering talk, or comparable community
              signal. Technical diligence should therefore prioritize configuration-controlled interface documents,
              TestFlight1 root-cause and corrective-action records, certification scopes and audits, supply-chain
              qualification, and TestFlight2 acceptance criteria.
            claimRefs:
              - CE009
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Orbital proof remains the gating milestone
            body: >-
              ElaraSat provides spacecraft heritage, but Eris has yet to demonstrate orbital insertion. TestFlight2
              should be underwritten against disclosed root-cause closure and explicit mission-success criteria rather
              than the launch date alone.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE012
              - CE015
  - number: 6
