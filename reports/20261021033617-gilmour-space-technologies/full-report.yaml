            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU008
      - number: '6.2'
        title: Adoption evidence is technical, not commercial
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is asset-level. The National Reconstruction Fund Corporation reports
              successful on-orbit operation of the 100 kg ElaraSat bus after a U.S. rideshare launch, while a Starfish
              Space update says Otter Pup 2 completed acquisition and operated under control within one kilometre of
              ElaraSat. Those facts demonstrate an operating spacecraft and a real partner mission around it.
              Launch-service maturity is much earlier: ABC reported that Eris TestFlight 1 flew for about 14 seconds
              before crashing after an apparent engine failure. Management's stated sequence was for the next rocket to
              reach orbit and the following rocket to carry a commercial satellite. The stated ambition of four launches
              annually and eventually more than twelve is a roadmap, not achieved utilization.
            claimRefs:
              - CU004
              - CU005
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.3'
        title: Named relationships do not yet establish customers
        blocks:
          - type: paragraph
            body: >-
              The retained sources name Starfish Space, Sojitz Corporation, and Transcelestial, but the evidence quality
              differs materially from a customer case study. Starfish provides the strongest external proof because its
              spacecraft is described operating near ElaraSat in orbit. The Sojitz and Transcelestial evidence available
              here is limited to titles on Gilmour Space's own media-release index: an agreement with Sojitz and
              selection of Transcelestial lasers. None of the retained text identifies who pays Gilmour Space, contract
              value, production duration, renewal, or a quantified customer outcome. These are valid relationship
              signals and potential routes to distribution or mission demand, but they should not be counted as three
              verified revenue customers or as proof of repeat purchase.
            claimRefs:
              - CU005
              - CU006
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU016
      - number: '6.4'
        title: Durability, expansion, and concentration remain unobservable
        blocks:
          - type: paragraph
            body: >-
              The retained source set provides no customer count, NRR, GRR, churn, renewal rate, contract duration,
              satisfaction measure, contracted launch backlog, customer revenue, top-customer share, or
              counterparty-level commercial terms. That is a limitation of the available evidence, not proof that
              Gilmour Space has no contracts or repeat demand. LinkedIn's 46,334 followers indicate audience reach, but
              followers are not customers and should not be used as an adoption denominator. Likewise, financing
              confidence after the first launch attempt and a supplier-directory profile do not demonstrate customer
              conversion. Underwriting durability requires a contract-level schedule separating paid missions, deposits,
              letters of intent, pilots, and partner agreements, together with cohort renewal and concentration data.
              Until then, the customer journey can only be shown as an evidence-maturity path with explicit gaps at
              contracting, production launch, renewal, and expansion.
            claimRefs:
              - CU007
              - CU008
              - CU012
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
