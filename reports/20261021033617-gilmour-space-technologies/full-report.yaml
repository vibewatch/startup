  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broad, but monetization remains unpriced
        blocks:
          - type: paragraph
            body: >-
              Gilmour Space presents an integrated commercial system rather than a single launch product: Eris launch
              services, the ElaraSat satellite platform, Bowen Orbital Spaceport operations, and Hyperflight hypersonic
              services. The customer proposition is directed to commercial, government, and defence missions, with the
              official site inviting payload customers to assess dedicated launch, rideshare, and other mission options.
              This creates several plausible transaction units—launch, payload slot, satellite bus, spaceport service,
              or flight campaign—but the retained official pages publish no list price, standard contract structure,
              discount schedule, or realized price. The integrated offer may improve capture per mission; it also makes
              revenue recognition and segment economics impossible to separate without contracts and management
              accounts.
