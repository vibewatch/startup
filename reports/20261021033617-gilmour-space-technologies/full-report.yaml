  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is wider than dedicated small-launch developers. Gilmour markets dedicated
              and rideshare mission paths, so a payload owner can compare a dedicated mission with a shared launch
              rather than choosing only among like-for-like rockets. SetterVC's explicitly illustrative list names
              Rocket Lab, Firefly Aerospace, Isar Aerospace, Orbex, and PLD Space; it describes the first two as flying
              providers and the latter three as development-stage small-launch peers. Gilmour's integrated offer adds
              ElaraSat and Bowen spaceport operations. The assigned evidence does not identify the full population of
              likely entrants, launch brokers, internal-build programs, or status-quo mission delays, so the landscape
              below is a documented sample rather than an exhaustive market census.
