  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The product is not a single rocket: the company presents an integrated mission system comprising Eris
              launch services, the ElaraSat satellite platform, the licensed Bowen spaceport, and Hyperflight hypersonic
              flights. For a satellite customer, the intended workflow runs from mission and orbit selection through
              payload integration, launch from Bowen, and, when relevant, use of an ElaraSat bus. This combination could
              reduce coordination across vehicle, spacecraft, and launch-site vendors, but the public evidence does not
              provide a payload interface control document, service-level commitment, integration timetable, or realised
              mission pricing. The product surface is therefore legible while the customer handoff and contractual
              performance envelope remain largely private.
