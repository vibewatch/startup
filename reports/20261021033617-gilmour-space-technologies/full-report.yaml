            figureRef: FM001
            claimRefs:
              - CM004
              - CM012
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              A monetary TAM or growth rate cannot be responsibly calculated from this source pool because none supplies
              a market-spend denominator, forecast period, geography-specific procurement total, or comparable analyst
              methodology. The available sizing lenses are instead supply-side and unit-based: NewSpace Index lists one
              launch, a $7 million launch cost, and 215 kilograms of performance, while a Skybrokers supplier page
              describes capacity of up to about 300 kilograms. ABC reports management's aspiration to ramp to four
              launches per year and eventually more than twelve, but this is a target, not contracted demand or
              demonstrated throughput. These measures frame a potential serviceable envelope while leaving utilization,
              pricing realization, mission mix, and revenue conversion open.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
