      - number: '3.2'
        title: Capability breadth versus operational maturity
        blocks:
          - type: paragraph
            body: >-
              Gilmour's strongest documented distinction is vertical breadth: Eris launch vehicles, the ElaraSat
              satellite platform, and a regulator-licensed orbital spaceport under one Australian operator. ElaraSat has
              operated on orbit after a U.S. rideshare launch, but Eris TestFlight1 fell back after 14 seconds and did
              not reach orbit. That creates an important asymmetry: satellite heritage and infrastructure are real,
              while launch reliability remains unproven. Rocket Lab and Firefly are described as flying vehicles in the
              retained peer source, whereas Isar, Orbex, and PLD are described principally through vehicles under
              development. The matrix therefore marks evidence not present in the assigned corpus as unknown instead of
              converting product descriptions into performance claims.
