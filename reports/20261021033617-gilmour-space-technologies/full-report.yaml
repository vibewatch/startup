      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The source-backed buyer set comprises commercial satellite and payload operators, government and defence
              mission sponsors, and organizations seeking a satellite platform or hypersonic-test service. Engineers and
              mission teams are the likely users of launch and platform capability, while program, procurement, or
              capability owners are the likely payers; however, the assigned evidence does not identify actual budget
              owners, procurement cycles, contract values, or conversion rates. Adoption therefore depends on matching
              payload mass and orbit needs, passing regulatory and safety gates, demonstrating reliable flight
              performance, and converting sovereign-access policy into funded missions. The licensed Bowen site reduces
              one infrastructure barrier, but it does not by itself establish customer demand.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM013
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers are policy demand for sovereign access, Australia's southern-hemisphere location,
              public investment in domestic capability, and the ability to combine launch, satellite, and spaceport
              services. The same evidence also exposes material constraints. Eris has one recorded launch and its debut
              ended after about fourteen seconds, so reliability and cadence remain unproven. The business is capital
              intensive: public investors are funding vehicle development, manufacturing scale, and spaceport expansion,
              while the supply chain spans hundreds of Australian suppliers. Regulatory licensing, mission assurance,
              payload integration, weather, and production readiness can lengthen adoption. Valuation should therefore
              weight proven orbital delivery and revenue-bearing backlog more heavily than broad industry-growth
              narratives.
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Proof of demand must follow proof of flight
            body: >-
              Market narratives cannot substitute for orbital delivery, repeatable cadence, firm pricing, and
              revenue-bearing backlog. The next underwriting step is to reconcile the payload envelope and obtain
              customer-level procurement evidence before assigning a monetary SOM.
            calloutType: risk
            claimRefs:
