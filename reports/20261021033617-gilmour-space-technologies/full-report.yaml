        title: Exhibits
        blocks:
          - type: callout
            title: Funding cannot substitute for a runway bridge
            body: >-
              The A$217 million Series E disclosure establishes capital raised, not current unrestricted cash.
              Underwriting requires cash receipts, monthly burn, debt obligations, milestone spending, and remaining
              capital needs through repeatable orbital service.
            calloutType: risk
            claimRefs:
