            tableRef: TO003
            claimRefs:
              - CO004
              - CO006
              - CO008
      - number: '1.3'
        title: Leadership, governance, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is narrow. Adam Gilmour is consistently identified as co-founder and chief
              executive, while James Gilmour is identified as a co-founder without a current operating title in the
              assigned material. NewSpaceTracker reports that former NASA Deputy Administrator Pamela Melroy joined the
              board in June 2026, adding relevant institutional experience. Nevertheless, the public roster does not
              establish a complete executive team, board composition, voting rights, succession plan, or division of
              technical authority. The combination of Adam's CEO role and prominence in launch and financing
              communications therefore supports a key-person concern that should be tested through management and
              governance documents.
            claimRefs:
              - CO001
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO015
              - CO016
      - number: '1.4'
        title: Milestones, technical setback, and next proof point
        blocks:
          - type: paragraph
            body: >-
              Gilmour has converted infrastructure and spacecraft development into tangible milestones: Bowen received
              orbital-launch licensing, ElaraSat has operated on orbit, and Eris left the pad in July 2025. The rocket
              then crashed after about 14 seconds. Adam Gilmour initially attributed the loss to apparent engine
              failure; a later tracker account says the April 2026 investigation identified electrical and thermal
              faults in pump motors and inverters on two first-stage motors. As of the tracker's September 2026 update,
              another attempt was still described for 2026. That makes a repeat flight—not the first brief lift-off— the
              next decisive evidence of launch-system maturity. No assigned source establishes a completed second
              attempt by the run date.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
