chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and integrated operating model
        blocks:
          - type: paragraph
            body: >-
              Founded on the Gold Coast in 2013 by brothers Adam and James Gilmour, the company remains a privately held
              Australian launch-services developer. Its official positioning combines three mutually reinforcing assets:
              Eris launch vehicles, the ElaraSat satellite platform, and licensed launch operations at Bowen. Gold Coast
              houses headquarters and manufacturing, while Bowen is the operating launch site. This is broader than a
              single-rocket proposition: management is attempting to control vehicle, spacecraft, and launch-site
              interfaces for commercial, government, and defence missions. That integration may reduce coordination
              friction, but it also concentrates capital and execution demands inside one development-stage company.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO007
              - CO009
      - number: '1.2'
        title: Capital base and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              The clearest current scale markers are financing and employment rather than commercial output. Multiple
              sources report a Series E of A$217 million, equivalent to roughly US$145 million in one tracker, while an
              Australian technology publication says the valuation topped $1 billion without naming the currency in the
              fetched text. NRFC says it invested $75 million and co-led the round with Hostplus; the same public
              evidence places headcount above 220. Earlier venture funding was reported at $142 million before the
              Series E, but currency conventions, grants, debt, secondary transactions, revenue, cash balance, and
              runway are not disclosed well enough to calculate total capital available or capital efficiency.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
