      - number: '4.2'
        title: Technical activity is visible; revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows operating activity but does not establish commercial revenue. The first Eris test
              flight was airborne for about 14 seconds and did not reach orbit; ABC reported the chief executive
              attributed the crash to apparent engine failure. Management nevertheless described a path from a second
              rocket intended to reach orbit to a later rocket carrying a commercial satellite, and a long-term cadence
              goal of four launches per year before exceeding twelve. Those are operating targets, not booked sales or
              utilization. The retained EquityZen page places revenue and financial data behind investor sign-up, while
              the official pages and release index provide no realized revenue, backlog value, customer concentration,
              or contract conversion data.
            claimRefs:
              - CI004
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.3'
        title: Manufacturing scale and repeated flights make the model capital intensive
        blocks:
          - type: paragraph
            body: >-
              The disclosed use of capital points to a vertically integrated cost base. NRFC says its A$75 million
              investment is intended to advance Eris, scale rocket and satellite manufacturing, and expand Bowen; it
              also reports more than 220 employees and reliance on hundreds of Australian suppliers. Earlier Series D
              proceeds were likewise described as funding manufacture, testing, and initial launches. NRFC reports A$217
              million raised in the Series E round, but that amount is cumulative financing for the round, not reported
              cash on hand or runway. The July 2025 flight outcome reinforces the need to model repeated test hardware,
              launch-site operations, rework, and schedule slippage before assuming production cadence creates operating
              leverage.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
              - CI013
      - number: '4.4'
        title: Financing validates strategic support, not unit economics
        blocks:
          - type: paragraph
            body: >-
              The financial case is therefore financing-supported rather than revenue-validated. AFR reported in July
              2025 that investors expected more than A$100 million of fresh capital despite the abbreviated first
              flight, and the later NRFC disclosure shows that a much larger Series E was assembled. This is evidence of
              continued sponsor appetite and sovereign-capability value, but it does not resolve cash burn, debt or
              project-finance obligations, launch-level gross margin, working-capital needs, or the amount of capital
              required to achieve repeatable orbital service. Underwriting should remain conditional on bank statements,
              monthly burn, committed backlog with payment milestones, cost-per-flight builds, and a runway bridge
              through the next technical milestone.
            claimRefs:
              - CI006
              - CI011
              - CI012
              - CI013
              - CI014
