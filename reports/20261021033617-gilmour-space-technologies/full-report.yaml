            body: >-
              Gilmour Space presents an integrated offer spanning Eris launch services, the ElaraSat satellite platform,
              and Bowen Orbital Spaceport for commercial, government, and defence missions. The clearest buyer surface
              is a payload or satellite operator evaluating a dedicated launch, rideshare mission, or another route to
