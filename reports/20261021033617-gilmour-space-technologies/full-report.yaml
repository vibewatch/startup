  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Demonstrated technical failures dominate current residual risk; licensing, suppliers, cadence, and runway remain
      high because control effectiveness is not publicly evidenced.
    data:
      columns:
        - label: Likelihood evidence
          detail: Whether the risk has occurred or is supported by a disclosed dependency.
        - label: Impact
          detail: Analyst assessment of consequence to return-to-flight and investment timing.
        - label: Mitigation maturity
          detail: Publicly evidenced maturity, not management intention alone.
      rows:
        - label: Oxidiser-pump subsystem
          note: TestFlight1 investigation identified two failure modes.
          values:
            - label: Demonstrated
              tone: negative
            - label: Critical
              tone: negative
            - label: Improvements in progress
              tone: warning
        - label: Electrical integration
          note: Fairing separation followed electrical backfeed during launch preparation.
          values:
            - label: Demonstrated
              tone: negative
            - label: High
              tone: negative
            - label: Immediate fix reported
              tone: warning
        - label: Regulatory timing
          note: First campaign obtained approvals; TestFlight2 conditions are unavailable.
          values:
            - label: Recurring process
              tone: warning
            - label: High
              tone: negative
            - label: Path established
              tone: neutral
        - label: Weather and cadence
          note: Cyclone, wind, and operational delays affected the maiden campaign.
          values:
            - label: Demonstrated
              tone: negative
            - label: High
              tone: negative
            - label: Repeatability unproven
              tone: warning
        - label: Supplier dependence
          note: External components were involved; concentration and alternatives are undisclosed.
          values:
            - label: Disclosed
              tone: warning
            - label: High
              tone: negative
            - label: Closure unavailable
              tone: negative
        - label: Funding and runway
          note: Equity raised is disclosed, but burn, cash, commitments, and runway are not.
          values:
            - label: Exposure unresolved
              tone: warning
            - label: High
              tone: negative
            - label: New capital raised
              tone: neutral
    approximationNotes: >-
      Ordinal labels summarize cited evidence and explicit gaps; they are not probabilities, benchmark scores, or
      independently verified control ratings.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR012
      - CR014
      - CR015
      - CR016
