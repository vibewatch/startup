      - number: '3.3'
        title: Distribution, access, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              Bowen's licensing and the company's end-to-end manufacturing footprint create a potentially meaningful
              sovereign-access position for Australian commercial, government, and defence missions. Reproducing that
              position is not merely a vehicle-design exercise: management described a path involving 24 Queensland
              permits plus environmental and airspace approvals, and the company says it relies on hundreds of domestic
              suppliers. Those assets can increase partner and regulatory access advantages, but they do not yet prove
              customer lock-in. Payload customers can still multi-home across dedicated and rideshare options, and the
              retained sources disclose no exclusivity terms, migration costs, schedule guarantees, or contractual
              penalties. The stack may reduce coordination burden, but orbital reliability and repeat cadence remain the
              more important competitive proof points.
            claimRefs:
              - CP002
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Pricing evidence and moat durability
        blocks:
          - type: paragraph
            body: >-
              No retained source publishes a comparable list price, realized contract price, discount schedule,
              service-level commitment, or firm launch backlog for Gilmour and the named peers. The pricing table
              therefore records packaging only and treats economics as unknown. Gilmour's January 2026 Series E and
              planned spending on vehicle qualification, manufacturing, test, and launch infrastructure provide capacity
              to keep developing the integrated model, but funding raised is not evidence of customer demand or launch
              economics. The first-flight engine failure is direct adverse evidence against assuming the infrastructure
              lead is already a durable moat. A defensible moat verdict requires repeat orbital success, cadence,
              contracted demand, and unit-level pricing that withstand comparison with flying alternatives.
