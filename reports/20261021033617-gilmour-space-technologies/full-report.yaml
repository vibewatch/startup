      - number: '5.2'
        title: Architecture and industrial model
        blocks:
          - type: paragraph
            body: >-
              Eris is described as a three-stage vehicle whose main engines use liquid oxidiser with a solid fuel grain.
              The current catalogue specification is approximately 305 kilograms to a 500-kilometre sun-synchronous
              orbit, but that is a supplier specification rather than demonstrated orbital performance. The operating
              architecture also depends on Australian manufacturing, hundreds of domestic suppliers, and a licensed
              launch site. A government-supported next-generation liquid-engine program indicates that propulsion
              development may extend beyond the present hybrid configuration. Vertical integration can shorten
              organizational interfaces, yet it also concentrates vehicle, manufacturing, spacecraft, and spaceport
              execution risk inside one still-scaling operator.
