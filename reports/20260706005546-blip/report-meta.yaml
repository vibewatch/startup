companyProfile:
  summary: Blip is a Belo Horizonte-based enterprise conversational AI company that
    sells SaaS tooling and managed expertise for marketing, commerce, support, and
    service journeys across WhatsApp, Instagram, Messenger, RCS, Apple, and related
    channels. The business grew out of the Take.net lineage, remains founder-led,
    and combines platform subscriptions, messaging-linked usage economics, and services
    around deployment and optimization for large brands.
