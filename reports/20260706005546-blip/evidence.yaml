evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board roster, committee structure, independent-director status, and shareholder-rights summary for the
      post-Series-C company.
    whyItMatters: >-
      Governance depth and reserved-matter control affect key-person risk, follow-on financing leverage, and exit
      optionality.
    diligencePath: >-
      Request the latest board deck or corporate-governance summary, post-Series-C shareholder agreement, and a current
      org chart from management.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: valuation-disclosure
    missingEvidence: A primary source or credible independent report that states the valuation attached to the 2024 Series C.
    whyItMatters: >-
      Without a round valuation, later valuation work cannot anchor dilution, price momentum, or round-step-up analysis
      cleanly.
    diligencePath: >-
      Ask management or lead investors for the priced round terms, or obtain a shareholder update or transaction legal
      memo that states valuation explicitly.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure-detail
    missingEvidence: >-
      Post-Series-C cap table, ownership percentages, any venture debt or credit lines, and disclosure of secondary
      share sales if any occurred.
    whyItMatters: >-
      Economic ownership and hidden leverage change control, liquidation preference analysis, and how much of the
      funding actually went to growth versus liquidity.
    diligencePath: >-
      Request the cap table, financing summary schedule, board consents, and any debt covenant package from management
      or lead counsel.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: fresh-scale-metrics
    missingEvidence: >-
      A 2025-2026 management metric pack with current headcount, ARR or run-rate, and consistent definitions for brands,
      contacts, conversations, and message volume.
    whyItMatters: >-
      Later chapters need a current denominator set; otherwise Blip can look larger or smaller depending on which metric
      family a source chose to emphasize.
    diligencePath: >-
      Ask management for the latest board or investor KPI dashboard and definitions glossary for customer, contact,
      interaction, and employee metrics.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: blip-contract-economics
    missingEvidence: Blip contract-value distribution, pricing by message volume or workflow, and gross-margin profile by channel.
    whyItMatters: >-
      Without pricing and ACV data, public market lenses cannot be translated into a defensible SAM or SOM for valuation
      work.
    diligencePath: >-
      Request cohort-level pricing, ACV, and gross-margin breakdowns by vertical, channel, and deployment model from
      management.
    relatedQuestionRefs:
      - QM009
      - QM025
  - type: missing-source
    severity: material
    topic: api-versus-app-adoption
    missingEvidence: Independent breakdown of WhatsApp Business app usage versus API usage by company size in Brazil and wider LATAM.
    whyItMatters: >-
      Blip participates mainly in higher-value enterprise API workflows, so channel-depth figures overstate the
      immediately serviceable market if API penetration is low.
    diligencePath: >-
      Look for Meta partner disclosures, telecom studies, or enterprise surveys that separate business-app adoption from
      API adoption by segment.
    relatedQuestionRefs:
      - QM014
      - QM025
  - type: missing-source
    severity: minor
    topic: independent-roi-benchmarks
    missingEvidence: >-
      Independent benchmarks for conversation-to-order conversion, containment, and retention by workflow in Brazil or
      LATAM.
    whyItMatters: >-
      Most hard ROI examples available publicly are company or platform case studies, which can bias expected payback
      upward.
    diligencePath: >-
      Benchmark win rates and operating metrics against third-party implementation partners, customer interviews, and
      procurement references.
    relatedQuestionRefs:
      - QM015
      - QM018
      - QM025
  - type: access-blocked
    severity: material
    topic: regulated-workflow-compliance
    missingEvidence: >-
      Detailed public guidance on how enterprise deployers operationalize LGPD, template governance, retention, and
      deletion requirements inside regulated journeys.
    whyItMatters: >-
      Compliance readiness affects which verticals are truly addressable and how much services intensity or legal review
      each deployment needs.
    diligencePath: >-
      Review customer implementation documentation, DPA templates, retention policies, and regulator or counsel guidance
      for BFSI and healthcare deployments.
