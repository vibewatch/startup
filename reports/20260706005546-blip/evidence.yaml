      - QP027
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-gap
    missingEvidence: >-
      Win-loss data or churn-destination data showing which alternatives Blip most often loses to, and why buyers switch
      away or stay multi-homed.
    whyItMatters: >-
      The public landscape shows who can plausibly compete, but it does not reveal the actual displacement vector or
      whether bundle incumbents or WhatsApp-native peers are the dominant threat in live deals.
    diligencePath: >-
      Ask for the last twelve months of competitive intelligence notes, churn reason codes, and named alternative
