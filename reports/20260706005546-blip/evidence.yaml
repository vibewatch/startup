      - QM020
      - QM023
  - type: private-evidence-only
    severity: material
    topic: competitive-pricing-gap
    missingEvidence: >-
      Anonymized quote data showing Blip’s realized enterprise pricing at comparable WhatsApp volumes versus Zenvia,
      Gupshup, Twilio, and bundled incumbent alternatives.
    whyItMatters: >-
      List-price surfaces are enough to show discovery friction and price pressure, but not enough to determine whether
      Blip actually clears or loses enterprise deals on economics.
    diligencePath: >-
      Request recent quote decks, discount bands, and message-volume assumptions from Blip sales leadership, then
      compare them against buyer alternatives in recent RFPs.
