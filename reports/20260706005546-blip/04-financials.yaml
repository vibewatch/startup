    {
      "id": "gtm-sales-efficiency",
      "title": "Go-to-Market Motion and Sales-Efficiency Proxies",
      "body": "Blip appears to combine a self-serve entry point with a distinctly sales-assisted enterprise motion. The pricing page offers a free account and a defined procurement path—diagnosis and demo, commercial proposal, contract signing, then onboarding—while the WhatsApp page emphasizes official Meta certification and operational setup requirements such as legal and financial verification. That structure implies Blip is not relying on purely frictionless product-led conversion; it is using a hybrid model in which free or pilot usage opens the door, but scaled monetization happens through contract-led expansion. Public sales-efficiency proxies come not from disclosed CAC or payback data but from customer outcome cases. Banco Arbi reports 54% conversion in conversational credit; Leroy Merlin reports 111 million GMV and 0.5% abandonment via WhatsApp; Itaú distributed 2.5 million books to more than 800,000 users through 8 million messages; Banco PAN links a WhatsApp contestation flow to a 40% improvement in Banco Central complaint ranking; and iFood ties automated onboarding to more than 26% conversion, 97.6% CSAT, and materially lower abandonment. Microsoft case studies add labor leverage: one Blip client reportedly reduced service time 42% and improved satisfaction 10%, while Blip itself says it processes more than 1 billion messages monthly. These are meaningful proof points for ROI and expansion potential, but they still do not answer CAC, payback, quota productivity, or retention.",
