    {
      "id": "disclosure-gaps-verdict",
      "title": "Public Traction, Private-Metric Gaps, and Financial Verdict",
      "body": "Blip has enough public traction to prove commercial relevance, but not enough disclosure to support a clean underwriting model. On the positive side, multiple sources place the company above 50 million conversations per day, above 1 billion messages per month, above 3,700 to 4,000 brands, and above $100 million of revenue at least historically, while case studies show the platform can drive conversion, GMV, complaint reduction, and support productivity in real customer workflows. On the negative side, the public record is internally inconsistent. Latka estimates 2024 ARR at $133.6 million yet still describes Blip as bootstrapped, while Craft still shows total funding of $100 million even after the widely reported 2024 Series C took cumulative funding to $230 million. Those mismatches are not fatal, but they are a warning that third-party market-data surfaces lag reality. The deeper problem is omission: none of the reviewed sources provides audited financial statements, reconciled revenue mix, gross margin by product or channel, CAC, payback, NRR, churn, cash balance, burn, or runway. Verdict: revenue quality looks directionally solid because large customers use Blip for mission-critical workflows and measurable outcomes, margin path looks plausible because automation and infrastructure efficiency are improving, and capital intensity looks moderate rather than extreme, but the diligence blockers are substantial enough that the chapter supports monitoring and management diligence, not blind underwriting conviction.",
