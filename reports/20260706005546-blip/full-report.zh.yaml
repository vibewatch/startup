      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Blip 在大部分历史中靠自举经营，直到 2020 年才引入机构资本。第一笔大额融资是 2020 年 10 月由 Warburg Pincus 领投的 US$100 million Series A 轮；随后
              2022 年 6 月又从同一投资方获得 US$70 million Series B 轮。2022 年融资明确用于国际扩张、 产品投入和收购；同一时期，管理层称业务年化收入已突破 US$100
              million。随后，公司通过两次外延动作继续增长：2022 年收购 STILINGUE， 加深社交聆听能力；又在墨西哥—伊比利亚通道收购 GUS，支撑国际化落地。2024 年 11 月，Blip 宣布
              SoftBank 领投、Microsoft 参投的 US$60 million Series C 轮，使已披露累计融资达到 US$230 million。未知部分与已知部分同样重要。已审阅来源没有披露
              Series C 估值、任何老股转让成分、债务额度、精确持股比例，或 SoftBank、Microsoft、Warburg 在投后的治理权利。
