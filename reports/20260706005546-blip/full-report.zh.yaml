      - number: '3.3'
        title: 既有厂商、替代方案与分发能力
        blocks:
          - type: paragraph
            body: >-
              对 Blip 最严重的竞争威胁，不只是另一家 WhatsApp 专家，而是更大的软件栈把对话式服务吸收到买方已经信任、已经预算的套件里。 Salesforce 带来最大的装机基础不对称，因为 Service
              Cloud 位于更大的 CRM、工作流和数据资产之中。Zendesk 从客服工单系统方向施加相邻压力， 承诺 AI 优先服务、全渠道支持和低摩擦入门价格。Intercom 通过把问题重新定义为 AI agent
              结果来竞争，并允许与现有客服工单系统共存， 降低不想彻底替换系统的买方迁移摩擦。在替代端，Meta 自己的 WhatsApp Business Platform 文档让技术成熟团队的内部自建始终可信。
              Twilio 和 Sinch 又强化了这条替代路径，因为它们让 API 优先、可编程通信采购变得常态化。结果是，Blip 的分发劣势是真实存在的： 即使产品适配良好，买方仍可能偏好已经掌握
              CRM、客服工单系统、通信层或工程工作流的供应商。
