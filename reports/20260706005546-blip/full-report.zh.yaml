      - number: '2.2'
        title: 估算镜头与互相矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据支持类别需求，但不支持一个干净的 TAM 标题数。Research and Markets 按交易额衡量拉美对话式商贸市场，2023 年达到 US$26.4 billion，2028 年达到
              US$65.3 billion。Bonafide 给出巴西专项增长视角，2026 至 2031 年 CAGR 高于 14.77%。 相比之下，Fortune、Grand View 和 Precedence
              按软件或平台收入衡量对话式 AI，把全球市场放在 2025 年约 US$14.3 billion 至 US$19.21 billion、2026 年 US$17.7 billion 至 US$23.82
              billion 之间。Fortune 的拉美软件镜头在 2025 年只有约 US$1.11 billion，2026 年约 US$1.31
              billion。这些数字并不矛盾，因为一个镜头衡量经由对话发生的商贸交易，其他镜头衡量技术收入。 对 Blip 来说，这意味着广义需求无疑很大，但任何精确的 TAM、SAM 或 SOM
              都需要公司私有输入，例如合同价值、API 组合、地域组合和各工作流附加率。 正确产出应是受约束的多镜头估算框架，保留矛盾，而不是把矛盾抹平。
