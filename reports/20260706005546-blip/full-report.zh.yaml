              耐久度是公开客户记录中最弱的一块。Blip 材料提供了许多时点结果快照，但没有披露 NRR、GRR、流失率、续约率或合同期限。最好的公开代理指标是间接的： Nespresso
              从迁移扩展到服务和销售流程，Casas Bahia 在多个 Black Friday 周期复用 Blip，iFood 报告单一流程中 97.6% CSAT， Banco PAN 称超过 40,000
