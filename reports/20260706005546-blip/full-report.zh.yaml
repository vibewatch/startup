        - 品类拥挤、渠道依赖和估值不透明会大幅拉动回报。
      - - 估值立场
        - unknown
        - Series C 轮金额公开，Series C 轮价格未公开。
      - - 持有 / 退出策略
        - 跟踪 IPO 准备度或战略可选性
        - ARR 桥、股权结构条款和公开市场准备度更清楚后再复盘。
      - - 入场纪律
        - 倾向用低于高溢价软件标尺的情景区间来测算
        - 拿到股权结构、优先权条款和毛利率披露前，不要把 Blip 视为干净的独角兽可比公司。
    notes: 这是作者判断表：建议字段把有来源支撑的公司质量与估值缺失下的纪律合并，而不是假装当前估值可观察。
