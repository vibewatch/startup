      - - Zenvia
        - 拉美 CX 直接套件
        - 拉美上市 SaaS 厂商；2021 年 Nasdaq IPO；覆盖 180+ 个国家
        - 需要客户云加 WhatsApp 商务和服务的拉美品牌
        - Customer Cloud 加 AI 智能体、CRM/ERP 连接、官方 Meta 伙伴关系；公布月度套餐
        - 买方需要本地化 CX 软件和自助价格锚时，Zenvia 是最接近的区域同业
      - - Gupshup
        - 对话云垂直厂商
        - 50,000+ 家企业，130+ 个国家，年对话量 120B
        - 重视 WhatsApp、AI 旅程和营销 / 商务 / 支持编排的全球品牌
        - Conversation Cloud 加 WhatsApp API、AI 智能体、共享收件箱和入门定价
        - 对 WhatsApp 主导自动化经济性和上手摩擦形成直接压力
      - - Infobip
        - 全球 CPaaS / 联络中心老牌厂商
        - 全球通信平台运营商
        - 需要全渠道互动和联络中心工具的企业
        - AgentOS 栈覆盖 AI 智能体、聊天机器人构建器、云联络中心、CDP 和对话式 AI
        - 以企业通信厂商身份从上方竞争，电信根基更广
      - - Twilio
        - 全球 CPaaS 老牌厂商
        - 大型上市 CPaaS 平台，渠道和数据工具覆盖广
        - 需要可编程通信的开发者和企业平台团队
        - 客户互动平台加 Flex、Conversations、CDP，以及按量付费的 WhatsApp 定价
        - 买方偏好 API 而非托管 CX 软件时，Twilio 是最可信的可编程替代方案
      - - Sinch
        - 全球通信老牌厂商
        - 200k+ 客户，年收入 $2.4B，覆盖 65 个国家
        - 需要消息、语音、邮件和信任资质的大型企业
        - 消息平台、API、聊天机器人构建器、联络中心，以及具备企业合规姿态的 WhatsApp
        - 企业信任和规模可能比 Blip 特定工作流打磨更重要
      - - Salesforce Service Cloud
        - CRM / 服务老牌厂商
        - 150,000+ 家公司使用 Salesforce 平台
        - 已将数据和工作流标准化到 Salesforce 的大型企业
        - 更广 CRM 套件内的 AI 智能体、案例管理、知识库、自动化和服务定价
        - 靠分销、装机基础和套件能力取胜，而不是 WhatsApp 优先的专业化
      - - Zendesk
        - 帮助台 / 服务老牌厂商
        - 装机基础大，Marketplace 应用和伙伴超过 1,800 个
        - 希望获得 AI 优先服务、但不想完整迁移 CRM 的支持团队
        - AI 优先服务平台，提供全渠道支持和较低入门价
        - 邻近套件压力不小，因为服务团队无需更换核心帮助台就能增加消息能力
      - - Intercom
        - AI 优先支持老牌厂商
        - 30,000+ 家公司，ARR >$400M，1,400+ 名员工
        - 需要 AI 智能体加帮助台工作流的数字原生支持团队
        - Fin AI 智能体、帮助台，以及包含 WhatsApp 的按量付费渠道打包
        - 抬高 AI 优先门槛，也支持与既有帮助台共存
      - - Yellow.ai
        - AI 智能体邻近厂商
        - 1,300+ 家企业；年对话洞察基础 16B+
        - 希望在聊天、语音、邮件和支持中部署智能体式自动化的企业
        - 覆盖 15+ 个 LLM 的智能体式 AI 平台，先有免费层，之后按解决量计费
        - 竞争点更多在自主 AI 广度，而不是 WhatsApp 本地化
      - - Meta WhatsApp 平台 + 内部自建
        - 替代方案 / 内部自建
        - 官方渠道文档和 API 齐全，但没有打包好的服务工作流
        - 愿意在内部拼装编排、CRM、分析和支持的大型团队
        - 直接走 Cloud API，集成和工程投入由买方承担
