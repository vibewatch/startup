  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Blip 从电信起家，走向融资、并购、AI 绑定的国际化规模，关键路径如下。
    data:
      items:
        - date: '1997'
          label: Take Phone 起点
          detail: 创始人在 Belo Horizonte 以 UFMG 手机亭起步
          tone: positive
