      - - 用户同意、模板和转人工规则
        - 约束
        - 当前 / 持续
        - 运营合规是硬门槛，在治理重的旅程里会拖慢上线
        - 索取 Blip 在同意获取和升级设计上的实施手册
      - - LGPD 同意和数据治理要求
        - 约束
        - 持续
        - 敏感数据工作流需要谨慎的法律设计、存储控制和删除逻辑
        - 审查 Blip 如何在巴西支持数据最小化、删除和可审计性
      - - 集成和专业服务负担
        - 约束
        - 当前 / 持续
        - 企业项目往往要先打通 CRM、支付、分析和流程集成，ROI 才会显现
        - 按工作流和垂直行业衡量上线周期与服务投入强度
      - - 云端与本地部署偏好不清
        - 约束
        - 持续
        - 分析师意见不一，说明部署偏好仍按行业分化，一刀切产品策略会更难
        - 核查 Blip 需求中仍有多少依赖混合或受控环境
      - - 市场规模测算口径不清
        - 约束
        - 持续
        - 如果把交易价值误当软件收入，标题式 TAM 叙事会夸大机会
        - 每个规模测算口径都必须绑定确切单位和方法
    notes: 有些因素在品类层面拉动需求，但到了部署层面仍会带来运营摩擦。尽调问题有意面向未来，不应解读为已经验证的事实。
