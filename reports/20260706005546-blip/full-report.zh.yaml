companyProfile:
  summary: >-
    Blip 总部位于 Belo Horizonte，是一家面向企业的对话式 AI 公司。它向客户销售 SaaS 工具和托管式专业能力， 覆盖 WhatsApp、Instagram、Messenger、RCS、Apple
    等相关渠道里的营销、商贸、支持和服务旅程。公司从 Take.net 体系中长出来，至今仍由创始人主导；商业模式把平台订阅、与消息渠道挂钩的用量经济，以及大品牌部署和优化所需的服务组合在一起。
