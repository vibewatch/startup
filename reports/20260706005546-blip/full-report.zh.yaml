  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Blip 的公开产品故事不只是“WhatsApp 上的聊天机器人”。官方界面一贯把公司定义为企业级对话平台，贯穿客户生命周期端到端旅程， 并明确包含营销、销售、商贸、服务和 AI
              主导的工作流模块。这很重要，因为它把尽调镜头从单渠道自动化转向运营模型宽度：买方不只是支持团队，
              也包括希望把获客、转化、服务和留存搬进消息环境的增长、销售和数字体验团队。可见的打包资产强化了这个定位。首页点名产品目录和 WhatsApp Payments，平台和集成页面展示了一个宽的跨渠道层，横跨
              WhatsApp、Instagram、Facebook Messenger、Telegram、 Microsoft Teams、Apple Messages for Business、Google
              RCS、电子邮件和 SMS。按工作流看，Blip 销售的是一个系统：把用户从获客或营销活动入口带入自动化对话，
              在互动推进时保留上下文，并在触及自动化边界时升级给人工坐席。宽度确实是差异化，但也意味着投资者应按模块成熟度和生态依赖来思考， 而不能假设每个界面都同样强。
