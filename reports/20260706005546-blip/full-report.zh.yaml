      - number: '5.3'
        title: 信任、安全、隐私与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              Blip 的信任界面比典型初创公司的信任中心外壳更实在。公司公开描述了对齐 ISO 27001 的治理、LGPD/GDPR 隐私义务、 由 DPA 支撑的合同、具名 Data Protection
              Officer、子处理方审查、业务连续性规划和明确的事故管理流程。信任中心材料也不止停留在政策标签， 而进入运营控制：传输中数据使用 TLS 1.2/1.3，静态数据至少 AES-128，SIEM
              日志、DLP、WAF 和防火墙保护，以及客户请求或合同终止后 30 天删除活跃客户数据的路径。 话虽如此，控制词汇强并不代表产品风险消失。公开事故记录显示，2026 年有数次中断集中在 WhatsApp
              送达，另有 2026 年 4 月的 AI agents 不稳定；部分事故说明明确指向 Meta 侧故障。这在战略上很重要：Blip 最强渠道也是由伙伴治理的渠道，因此可靠性、入驻和部分功能推出
              也会从上游平台继承。尽调上，正确结论不是 Blip 缺少控制，而是公司拥有有意义的控制，但仍处在伙伴和云依赖之中，这些依赖会表现为客户可见的服务风险。
