chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与商业模式
        blocks:
          - type: paragraph
            body: >-
              Blip 更应被看作一家长期经营的巴西企业软件公司，而不是新成立的 AI 初创公司。它的商业根源可追溯到 1997 年 UFMG 校内的 Take Phone 手机亭；公开数据库和投资者材料则把正式创立年份放在
              1999 年，并归入后来的 Take.net 脉络。今天，公司把自己定位为对话智能平台，帮助企业在消息渠道里获取、服务、转化和留存客户。 官方产品叙事不只是单一聊天机器人：Blip
              打包了营销活动编排、客服、对话内支付、分析，以及 Stilingue by Blip、 Blip Cred、专业服务等相邻产品。变现模式符合企业 SaaS
              和用量型软件的逻辑，把平台计划、与渠道消息挂钩的经济模型和实施支持组合起来。 官方材料也说得很清楚：Blip 的分发离不开 Meta、Google、Apple、Microsoft 等渠道伙伴。
