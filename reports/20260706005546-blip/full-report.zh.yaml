      - number: '2.3'
        title: 买方、细分市场与采用路径
        blocks:
          - type: paragraph
            body: >-
              围绕 Blip 的购买动作跨职能，但仍清晰可读。产品证据和案例研究首先指向企业零售、金融服务、医疗、物流和服务运营团队，
              它们关心响应速度、转化、留存和工作流自动化。日常用户通常是服务坐席、增长营销人员、电商运营和运营团队；预算负责人更多是
              CX、商贸、营销、支持或数字渠道负责人，而不是纯基础设施买方。在巴西和拉美，异常强的消息使用习惯帮助采用。Twilio 的 2026 年研究称，31% 的 LATAM 公司已经为客服完全部署对话式 AI，44%
              的巴西公司已完成或接近完成；该地区消费者通过消息应用 与 AI 互动的频率是全球平均水平的三倍。Aurora Inbox 和 Agência e-Plus 又加上一层习惯证据：巴西估计有 197 million
              WhatsApp 用户，约 10 million 家企业使用 WhatsApp Business，超过 80% 的巴西人用 WhatsApp 联系企业。采用路径通常从一个工作流开始，
              例如营销活动响应、订单支持或服务分诊；ROI 可见之后，再扩展到 CRM、支付、分析和 AI agent 自动化。
