      - number: '8.2'
        title: 建议、置信度、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              本章建议继续研究，而不是买入、回避，甚至也不是干净的跟踪观察。原因不是执行弱，而是缺少价格发现。按业务质量看，Blip 具备可投资性：它有长期支持的财务赞助方、Microsoft
              的战略参与、有利润增长证据、规模化客户采用，以及平台支撑每天数千万次对话的技术证明。但本工作流的建议纪律对价格敏感。同一组乐观证据也显示，管理层仍希望在美国 IPO
              窗口可信前把收入做得明显更大，国际收入在收入结构中仍低于 10%，且没有已审阅来源披露 2024 年 Series C
              的投后估值。因此，置信度为中，风险为高，估值立场未知。正确的投资者姿态是继续做建立确信的工作，但不要把看不见的估值标记当作公开报价来承销。
