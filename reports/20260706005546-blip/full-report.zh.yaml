      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层连续性是 Blip 故事的核心。Roberto Oliveira 仍以联合创始人兼 CEO 身份代表公司露面；Daniel Costa 仍出现在创始人治理角色中，并在 2022
              年投资者材料中被描述为董事长兼人力负责人。第三方高管数据库还显示， Marcelo Costa de Oliveira 是联合创始人和董事会成员，Marcelo Hein 是最常与融资和收购绑定的财务或战略高管，
              Juliano Braz 是营收负责人。这足以证明公司仍由创始人主导经营，但不足以证明治理透明度扎实。已审阅的官方材料没有披露完整董事会名单、
              独立董事名单、委员会结构或详细接班梯队。尽调上的实际结论是：关键人依赖确实存在，战略、资本配置和对外叙事仍集中在一个小的创始人— 财务圈层，公开证据不足以证明更深的治理厚度。
