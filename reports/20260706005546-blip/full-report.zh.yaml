      - number: '1.5'
        title: 里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              后续章节应复用的时间线，是一个“转向后放大规模”的故事。创始人先做早期电信和铃声产品，2005 年卖掉公司，2008 年回购， 并在约 2014 年开始打造现在的企业对话平台。2020 年和 2022 年
              Warburg 轮次之后，公司机构化加速；STILINGUE 和 GUS 收购则标志着 它有意走向更宽的 AI 能力和国际足迹。到 2024 年，Blip 公开把自己描述为重新盈利、活跃于国际市场，并准备借
              SoftBank 和 Microsoft 资金进入新产品周期。这个正向弧线不应掩盖负面证据。2023 年 9 月，Blip 裁掉 143 名员工，约占员工数 9%，以守住盈利能力。 2026
              年上半年，Reclame AQUI 仍显示三位数投诉量，且反复出现账单和服务质量主题。Blip 自己的状态页也记录了 2026 年 6 月 23 日的事故，
              涉及消息发送缓慢和媒体上传失败。单看任何一个信号都不会打破公司叙事，但合在一起说明：Blip 已在有意义的规模上运营，同时承受真实的执行和可靠性压力。
