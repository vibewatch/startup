      - number: '8.6'
        title: 退出准备度、论点破裂触发点与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备度有方向性，但并不完整。管理层已公开讨论美国 IPO 路径，并称公司正在朝资本市场级治理和透明度推进；但同一次采访也承认，成功发行的收入门槛现在更接近每年 $300
              million。这让当前披露与公开市场准备度之间留下真实缺口。战略出售也可能发生，因为股权结构中已经有 Warburg Pincus、SoftBank 和 Microsoft，平台又处在企业服务、AI
              工具和商业消息交叉处。但论点破裂触发点同样真实：增长明显低于 30-40% 区间，国际扩张无法提升收入结构，有证据显示 Meta 或渠道定价能挤压经济性，或尽调显示 2024 年融资条款已经把 Blip
              定在难以防守的前瞻 ARR 区间之上。因此，最终尽调应瞄准缺失的估值条款、通往 IPO 门槛的实际 ARR 桥、国际业务经济性，以及可能把一家有吸引力公司变成糟糕入场点的治理或优先权细节。
