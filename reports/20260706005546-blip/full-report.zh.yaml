  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 公开证据显示，消息运营和集成管道已经成熟；较新的 AI 辅助界面成熟度更不均衡。
    data:
      columns:
        - 成熟度
        - 主要公开证据
        - 关键依赖
        - 主要风险
      rows:
        - label: Desk 转接
          values:
            - 高
            - 详细帮助文档 + 工作流指标
            - Blip 认证和队列设置
            - 公开经济账和并发能力未披露
        - label: SDK / HTTP API
          values:
            - 高
            - GitHub / npm 包 + 帮助文档
            - 凭证、端点、开发者投入
            - 没有公开的租户隔离或限速细节
        - label: WhatsApp 运营栈
          values:
            - 高
            - BSP 消息、Flows、MM Lite、状态历史
            - Meta 验证和政策质量
            - 上游渠道不稳定可能影响服务
        - label: 集成生态
          values:
            - 中高
            - 250+ 个集成 + Zapier 应用页
            - 连接器维护和伙伴 API
            - 支持深度因连接器而异
        - label: AI Agent
          values:
            - 中
            - 营销页 + Microsoft 故事 + 状态页
            - Azure / OpenAI 栈和知识质量
            - 公开文档薄，且有一次公开 AI 事件
        - label: Builder Assistant
          values:
            - 中低
            - 帮助文章明确标注 beta
            - ChatGPT 行为和产品路线图
            - 功能集有限，未来条款可能变化
