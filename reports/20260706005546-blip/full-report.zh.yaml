      - number: '3.4'
        title: 切换成本、多栖使用与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              Blip 确实有切换成本，但这些成本更像运营性成本，而非垄断性锁定。一旦团队在一套对话式栈内搭好流程、分析、坐席例程和服务流程， 迁移就会消耗人力、代价不低。但同样的公开页面也说明，这些成本并非绝对。Meta
              暴露核心渠道，Twilio 和 Gupshup 推动可编程或低摩擦采用路径， Zenvia 公布本地计划锚点，Intercom 明确称 Fin
              可以叠在另一套客服工单系统之上。这意味着买方可以多栖、试点或重构平台，而不必放弃更大的系统。 对耐久度最不利的证据是，几乎每个已审阅同业现在都承诺 AI agent、全渠道工作流、分析和人工接管。如果 Blip
              不能在以巴西为核心的 WhatsApp 运营中证明更好转化、更快解决或更强经济性，这个类别就会滑向套件选择或渠道成本套利。因此，耐久切入口比功能清单更窄：
              顾问式部署、本地运营知识，以及在这些能力比全球套件宽度更重要的市场里经过验证的 WhatsApp 执行。
