        - Claro Chile 报告服务支持成本下降 50%、NPS +7；一个 Copilot 试点在取得可衡量销售增量后扩大
        - 适合经常性、高量服务和向上销售旅程
        - 智利及一家哥伦比亚伙伴之外的覆盖广度尚未公开
      - - 医疗、物流和出行运营
        - 运营或 CX 负责人；终端用户是患者、司机和 App 用户；付款方是服务运营预算
        - 预约、检查结果、官方消息和定向 opt-in 活动
