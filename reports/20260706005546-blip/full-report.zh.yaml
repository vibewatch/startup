  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Blip 按泛化的“聊天机器人公司”估算，也不应把它等同于整个联络中心软件市场。Blip 自己的产品定位，加上 WhatsApp 商业平台文档，指向一个更窄的类别：企业级对话式
              AI，在以消息为主导的渠道中编排营销、商贸、服务和支持旅程。 这个边界包括对话设计、自动化、分析、AI agent 层、渠道编排，以及在 WhatsApp 和相邻渠道内执行的商贸或客服工作流。 它不包括广义电商
              GMV、全部 CRM 席位、全部呼叫中心支出，也不包括结构化业务工作流之外的每一条消息发送。主要替代方案不只是直接的对话式 AI 厂商，还包括现状下的网页或应用流程、外包呼叫中心团队、通用网站聊天插件、Meta
              原生工具，以及接到 CRM 或支持系统上的内部机器人。 这个更窄的框架很重要，因为 Blip 的价值主张不是“所有数字互动”，而是在客户已经高频使用的渠道内，把高意图对话转成可衡量的收入、留存和服务结果。
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
              - CM007
