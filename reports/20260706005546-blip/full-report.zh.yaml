      - - 实际成交价格和折扣
        - 免费层和第三方 $750/月价格下限公开；企业定价未公开
        - 无法测试净抽成率和合同质量
        - 样本合同，含折扣阶梯、超额费用和渠道加价
      - - 按产品 / 渠道拆分的毛利率
        - 基础设施和工作流效率代理指标存在；实际毛利率不存在
        - 判断 Blip 能否像软件一样复利增长，还是更像低毛利通信层，必须拿到产品 / 渠道毛利率
        - 经审计的毛利率桥，按产品、渠道和服务线拆分
      - - 现金、烧钱和资金跑道
        - CEO 称 2023 年恢复产生现金；未披露余额或资金跑道
        - 仅靠公开来源无法判断资本充足性
        - 当前现金报表、过去十二个月烧钱和情景资金跑道模型
      - - CAC、回本期和配额产能
        - 案例研究显示转化和生产率，但没有获客或服务成本
        - 混合 GTM 可能很高效，也可能销售很重；公开证据无法判断
        - 分客群 CAC、回本期、销售周期和销售代表产能仪表盘
      - - 留存 / NRR / 流失
        - 未找到公开分群数据
        - 没有扩张和流失行为，就无法评估收入质量
        - 分群数据包，含 NRR、logo 流失、总收入留存和收缩
      - - 收入确认和递延收入
        - 计费机制公开，但服务、配额和转付费用的会计处理未公开
        - 确认政策会实质影响报告增长质量和现金转化
        - 会计备忘录，加递延收入和服务确认明细表
    notes: 这些不是表面缺口；每个缺失指标都会直接限制对收入质量、毛利耐久性或资本充足性的判断。
