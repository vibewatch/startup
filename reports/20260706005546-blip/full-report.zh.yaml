      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              采用顺风确实存在。消息在巴西已经成为习惯，WhatsApp 继续加入更丰富的商业原语，例如 click-to-WhatsApp 广告、Flows 和 Meta Business
              Agent，多家分析机构仍显示对话式 AI 和对话式商贸快速增长。零售和电商仍是最清晰的量级驱动，但医疗和受监管服务也重要，
              因为复杂工作流、文档需求和高服务负载都会奖励自动化。即便如此，约束是结构性的，不是表面问题。WhatsApp 政策要求取得用户同意、 人工接管路径，以及 24 小时服务窗口之外的模板纪律。LGPD
              又叠加巴西同意和数据处理义务。平台定价按已送达消息收费， 这意味着预算负责人必须证明增量转化、效率或留存，而不只是互动。集成工作量同样重要：Blip 自己销售专业服务，正因为企业部署往往需要架构、
              治理、分析和持续优化。最后，分析师对云端与本地部署谁占主导并不一致，公开来源也没有披露 Blip 的合同经济、工作流组合或按客户细分拆分的收入。 这些仍是决定估值信心的主要缺口。
