      - number: '8.3'
        title: 融资背景、入场纪律与悬而未决事项
        blocks:
          - type: paragraph
            body: >-
              Blip 已在三轮披露融资中至少募集 $230 million：2020 年 $100 million、2022 年 $70 million、2024 年 11 月 $60
              million。这个顺序重要，因为它同时显示赞助方持续支持和管理层纪律。2024 年 Brazil Journal 采访明确称，公司不是为了生存而融资，因为上一年已经达到盈亏平衡；Mobile Time
              报道称，管理层仍把美国 IPO 视为目标退出，但现在认为这条路需要约 $300 million 年收入才跑得通。因此，入场纪律必须盯住仍被隐藏的内容：Series C
              投后估值、清算优先权、员工期权刷新，以及下一轮融资是一级、二级还是战略性质。公开证据还显示，国际市场收入占比仍低于
              10%，意味着扩张故事大部分还在前面，而不是已经兑现。悬而未决的不是困境资本，而是估值不透明，再加上距离既定 IPO 门槛还有执行距离。
            claimRefs:
              - CV006
