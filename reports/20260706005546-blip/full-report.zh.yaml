      - number: '4.2'
        title: 市场进入动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Blip 似乎把自助入口和明显销售辅助的企业动作结合起来。定价页提供免费账户和明确采购路径——诊断与演示、商业方案、签约、再到上线导入； WhatsApp 页面则强调官方 Meta
              认证，以及法律和财务验证等运营设置要求。这个结构意味着 Blip 并不依赖纯粹无摩擦的产品驱动转化； 它采用混合模式，由免费或试点使用打开入口，规模化变现则靠合同驱动扩张。公开销售效率代理指标不来自已披露 CAC
              或回本数据， 而来自客户结果案例。Banco Arbi 报告对话式信贷 54% 转化；Leroy Merlin 报告 WhatsApp 带来 111 million GMV 和 0.5% 放弃率； Itaú 通过
              8 million 条消息向超过 800,000 名用户分发 2.5 million 本书；Banco PAN 把 WhatsApp 争议处理流程与 Banco Central 投诉排名提升 40%
              联系起来；iFood 将自动化入驻与超过 26% 转化、97.6% CSAT 和明显更低放弃率联系起来。Microsoft 案例研究又加入劳动力杠杆： 据称一个 Blip 客户将服务时间减少 42%、满意度提升
              10%，而 Blip 自己称每月处理超过 1 billion 条消息。这些都是有意义的 ROI 和扩张潜力证据， 但仍没有回答 CAC、回本期、配额产能或留存。
