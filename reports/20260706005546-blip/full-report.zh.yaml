      - number: '8.5'
        title: 可比公司集合及其真实含义
        blocks:
          - type: paragraph
            body: >-
              可比公司集合有信息量，但不够精确。Zenvia 是最接近的区域公开类比，因为它在巴西运营，业务混合 CPaaS 与软件；其 2023 年申报显示收入 R$807.6 million、毛利率 40.9%、活跃客户
              12,929 家、NRE 92.4%，但也有成本削减、再融资和低于预期的增长。这一点有帮助，因为它显示，如果通信平台业务无法同时守住增长和经济性，公开市场投资者会如何惩罚。全球同业更宽也更强：Twilio
              营销全栈 WhatsApp 消息与通话，Gupshup 称在 2025 年又融资 $60 million 后服务 130 个国家的 50,000 家客户，Infobip
              突出反复获得分析师领导者地位，Zendesk 则把 AI 驱动的 WhatsApp 支持卖给 160,000 家公司的存量客户群。它们都不是一对一干净可比，但合在一起说明，Blip
              应该因规模和产品质量获得信用，同时仍要按全球拥挤赛道定价，而不是按本地垄断定价。
