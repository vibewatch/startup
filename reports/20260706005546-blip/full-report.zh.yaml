      - number: '3.2'
        title: 直接同业、能力与定价压力
        blocks:
          - type: paragraph
            body: >-
              Blip 最干净的直接重叠对象，是那些把 WhatsApp 做成销售和支持运营中心，而不是附加渠道的厂商。Zenvia 是最接近的区域同业， 因为它营销一套统一 Customer
              Cloud，用于获客、转化销售和服务客户，并叠加 AI agent、官方 Meta 伙伴消息能力，以及以巴西雷亚尔计价的公开月度计划。 Gupshup 是最清晰的全球直接同业，因为它把 Conversation
              Cloud、WhatsApp API 接入、AI agent 和支持自动化打包成一个对该类别而言异常明确的入门套餐。 Twilio 施加的是另一种同样重要的压力：它让买方可以通过按量付费基础设施价格，直接为
              WhatsApp 送达经济性做基准。Yellow.ai 和 Intercom 则把比较范围从渠道软件扩展到 AI 结果软件，公开发布以解决率为中心的套餐和 ROI 叙事。在这个背景下，Blip
