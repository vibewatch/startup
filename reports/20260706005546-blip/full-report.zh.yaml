  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Blip 的投资论点，在拉美私营软件公司中罕见地具体。Warburg Pincus 在 2020 年以 $100 million Series A 支持公司，2022 年又投了 $70 million
              Series B；此前公司已在 2020 年达到 $40 million ARR，并在 2022 年跨过 $100 million 年化收入。到 2024 年，管理层公开谈到 ARR 超过 $150
              million、年增长 40%、客户超过 4,000 家、员工超过 1,500 人、业务覆盖 32 个以上国家，并恢复盈亏平衡和现金生成。产品论点也强于普通聊天机器人厂商叙事：Blip 深度贴合 WhatsApp
              商业场景，有五年 Microsoft 合作、MongoDB 背书的规模案例，以及 Meta 官方定位。反论点是，这仍是拥挤的 CPaaS 与对话式 AI 市场，存在定价压力、渠道依赖，也没有披露 Series C
              估值或优先权条款。公开证据支持公司质量，但不能支持精准入场价格。
