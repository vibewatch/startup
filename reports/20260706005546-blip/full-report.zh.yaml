      - number: '7.3'
        title: 合作伙伴、客户、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              Blip 最重要的依赖是 Meta 和 WhatsApp，但公开证据也指向另外一层执行风险：交付服务重、基础设施依赖高。Meta
              自己的伙伴资料显示，合作伙伴可以处理入驻、账户管理、模板，甚至计费机制；WhatsApp 按已送达消息收费，价格又随市场和类别变化。Blip
              页面确认，企业部署可能面对单独的渠道费用和外部验证关口。基础设施伙伴同样清晰可见。MongoDB 案例研究称，迁移前旧 CRM 宕机曾是真问题；Microsoft 称 Blip 正在使用 Azure
              OpenAI，同时每月处理超过 10 亿条消息。财务上，公开资料支撑了真实规模——$60 million Series C、总融资约 $230 million、2022 年收入超过 $100 million，以及
              2023 年恢复现金生成的说法。但同样的规模也迫使公司在国际扩张和 AI 路线图上交付，同时不能让支持质量下滑。公开客户证明很广，但留存和集中度仍未披露。
