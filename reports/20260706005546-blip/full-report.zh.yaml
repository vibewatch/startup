      - number: '7.2'
        title: 运营可靠性、服务与安全交付
        blocks:
          - type: paragraph
            body: >-
              运营风险不能轻看：Blip 嵌进企业级客服、商务和通知流程，而不是只在外围提供工具。公开文档显示它的技术面很宽——构建器、SDK、webhook、集成、自动化、AI
              辅助、质量监控和嵌入式交付服务都在里面。这种纵深有战略吸引力，但也增加了落地出错的路径。Blip 自己的状态页披露，2026 年 6 月 23
              日曾出现消息发送变慢、媒体上传失败的事故。负面客户证据比总体口碑分数更值得担心：一条 Capterra 评价指称支持薄弱、事故被隐藏、退出有摩擦、合同价格更高；一条 2026 年 Reclame Aqui
              投诉则称付费部署一直没有激活，支持团队把用户在不同渠道之间来回推。MongoDB 和 Microsoft 都描述了真实的工程进展和显著规模，但公开资料仍缺少 MTTR、严重程度分布和 SLA
              赔付数据。因此，可靠性和服务质量还需要作为运营事实尽调，不能直接当成既有优势。
