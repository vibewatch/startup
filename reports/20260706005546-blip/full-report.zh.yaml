      - number: '5.2'
        title: 构建界面、运营架构与部署模型
        blocks:
          - type: paragraph
            body: >-
              Blip 是真实平台而不是幻灯片软件，最强证据来自公开文档中可见的大量具体构建和部署界面。Blip 暴露 Visual Builder、SDK 和 HTTP API； 帮助文档还描述 router/subbot
              层级、Microsoft Teams 发布步骤、SMS API 用法，以及 Flows 和 Marketing Messages Lite API 等越来越结构化的 WhatsApp
              界面。合在一起，这些材料意味着一种运营架构：渠道适配器和营销活动界面位于控制平面之上，由控制平面管理路由、工作流逻辑、 凭证和升级。Router/subbot 支持显示，Blip
              预期较大客户会组合可复用的对话服务，而不是构建一个单体机器人。Desk 加入带有工单、队列和指标的人工运营层； Teams 和 WhatsApp
              的渠道专项部署步骤，则显示外部身份、应用审核和政策闸口进入流程的位置。底层方面，第三方案例研究提供了更多技术深度： Microsoft 描述基于 Azure OpenAI 的回复建议，MongoDB 记录了一次
              CRM 迁移，消除了宕机并为向量搜索扩展打下基础。结果是一个可信但依赖伙伴的栈： 产品大量价值来自跨外部渠道和云系统编排客户工作流，而不是端到端拥有每一层。
