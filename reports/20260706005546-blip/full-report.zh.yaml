      - CV035
      - CV036
  - id: TV005
    title: 论点破裂与杀手触发条件表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入规模不达标
        - Blip 无法证明从 >$150M ARR 走向 ~$300M IPO 门槛的可信路径
        - 打破公开退出叙事，削弱溢价倍数支撑
        - 不支付溢价轮价格；按私募下行情景重新承销
      - - 增长降速
        - 披露增长显著低于 30-40% 区间，且没有利润率上行抵消
        - 故事从规模化增长转为成熟消息基础设施
        - 下调目标倍数，仅重新审视战略出售假设
      - - 渠道 / 定价挤压
        - Meta、WhatsApp 或更广泛 CPaaS 定价变化压缩单位经济性或限制分销
        - 削弱护城河，把 Blip 推近大宗化 API 可比公司
        - 除非更高软件收入占比抵消，否则视为论点破裂
      - - 条款不透明
        - Series C 或后续条款显示沉重优先权、估值棘轮或老股压力
        - 即使经营业务仍强，入场经济性也恶化
        - 回避，或要求大幅更低入场价
      - - 国际扩张停滞
        - 并购和扩张后，国际收入仍未成规模
        - 削弱全球平台估值支撑的战略理由
        - 重估为巴西聚焦的软件结果，而不是全球平台案例
    notes: 阈值是决策规则，不是公司指引；它们把有来源的经营事实转化为明确的投资否决标准。
    claimRefs:
      - CV013
      - CV014
      - CV036
      - CV040
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - Series C 投后估值与优先权
        - 实际估值、清算优先权、老股比例和期权池刷新
        - 决定当前入场价是否已经计入牛市情景
        - 索取融资文件，或经管理层确认的股权结构摘要
      - - 当前 ARR 桥接
        - 最新 ARR / 收入、增长节奏，以及与既定 ~$300M IPO 门槛之间的差距
        - 为严肃估值工作设定分母，并检验退出时点
        - 获取管理层 KPI 包或董事会材料
      - - 利润率与现金流质量
        - 毛利率、自由现金流画像，以及 AI 或渠道成本稀释软件经济性的幅度
        - 区分溢价软件资产和拥挤消息层
        - 索取经审计或管理层审阅的财务桥接
      - - 国际收入结构
        - 按巴西、墨西哥、欧洲和任何新市场拆分的收入、客户集中度和回本期
        - 检验扩张是在增厚价值，还是只为估值叙事服务
        - 审阅分部报告和 GUS 收购后整合仪表盘
      - - 战略与监管依赖
        - Meta 渠道经济性、LGPD 合规控制、Microsoft 商业依赖
        - 厘清第三方平台是在增强业务，还是给业务封顶
        - 法务 / 合规尽调，加上伙伴合同审阅
    notes: 这些问题聚焦最能影响估值的证据缺口，而不是宽泛运营尽调。
    claimRefs:
      - CV022
      - CV036
      - CV037
      - CV040
      - CV043
