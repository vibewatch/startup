  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与解决方案类型
        blocks:
          - type: paragraph
            body: >-
              Blip 并不是在一条狭窄的聊天机器人赛道里竞争。买方至少有五条相互重叠的路径可以解决同一件事。第一类是直接的 WhatsApp 原生套件和客户云套件， 例如 Zenvia 和 Gupshup；两者都围绕
              WhatsApp 打包营销活动工具、机器人或 AI agent、多坐席服务和客户数据工作流。第二类是全球 CPaaS 和通信巨头，例如 Twilio、Infobip 和 Sinch；它们把类别向外扩展到
              API、联络中心工具和更宽的通信基础设施。第三类是 Salesforce、Zendesk 和 Intercom 等 CRM 与客服工单系统既有厂商；它们把消息当成更大服务操作系统里的一个渠道。第四类是
              Yellow.ai 等 AI 优先的相邻平台；它们销售 WhatsApp 之外的自主支持、语音或邮件自动化。第五条是替代路径：直接基于 Meta 的 WhatsApp 平台搭建，同时在内部缝合
              CRM、工单和分析。这个框架重要，因为 Blip 很少只靠功能清单输赢；买方也会把它和分发能力、打包杠杆、 以及自己内部组装的意愿放在一起比较。
