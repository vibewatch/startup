      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 Blip 再维持约 40% 增长一年，提升国际收入占比，并把 Microsoft、Meta
              和企业客户位置转化为更有防御性的软件溢价，而不是被按消息中间件折价定价。沿着这条路径，公司有可能从当前公开底线的 $150 million 以上
              ARR，走向十亿美元估值区间，且不需要英雄式假设。基准情景假设执行稳健但放缓：收入复合增长、盈利能力保持，但价格竞争和渠道集中度把倍数压在中个位数 ARR 区间。熊市情景假设 CPaaS
              定价压力更像公开和后期阶段同业，而不是高溢价 SaaS；Meta 依赖和全球竞争者宽度会在 Blip 达到偏好的 IPO
              规模前压缩估值。由于当前私人估值标记未披露，这些明确只是情景区间，不是对当前股权结构的断言。目的在于展示价值对规模和倍数纪律的敏感度。
