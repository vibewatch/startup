      - CE016
      - CE019
      - CE020
      - CE021
      - CE027
      - CE028
      - CE036
      - CE041
      - CE042
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Blip 的公开客户旅程通常始于 WhatsApp 密集型工作流压力，经过签约和 Meta 验证，再从一个上线流程扩展到更广的运营使用。
    data:
      nodes:
        - id: need
          label: 工作流压力
          detail: 品牌需要在客户已使用的渠道里改善支持、线索资格判断、入门引导或下单。
        - id: onboarding
          label: 签约与渠道设置
          detail: 法律和财务检查、Meta 验证、套餐设置、官方账号开通。
        - id: launch
          label: 首个上线流程
          detail: 首个活动、支持机器人、入门旅程或服务状态流程在 WhatsApp 或 Messenger 上线。
        - id: operate
          label: 人工 + AI 运营
          detail: Desk、Copilot、路由和坐席转接支撑更高量级的生产使用。
        - id: expand
          label: 工作流扩展
          detail: 客户加入更多用例，如商业、服务、激活或欺诈支持。
        - id: durability
          label: 续约 / 集中度测试
          detail: 这里的公开结果证明仍强，但续约账和头部客户敞口大多仍未披露。
    approximationNotes: 阶段来自产品页面和具名客户案例推断，而不是 Blip 已发布的销售流程图。
