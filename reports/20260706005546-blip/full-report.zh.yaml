  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价模式与计费复杂度
        blocks:
          - type: paragraph
            body: >-
              Blip 销售一套企业级对话平台，覆盖 WhatsApp 和其他消息渠道上的营销、商贸和客户关怀，并在这个核心之上叠加相邻变现。 官方定价页和 WhatsApp 页面说明了三件事。第一，Blip
              使用一个漏斗：从免费账户起步，再把客户迁移到带对话额度的付费计划， 最后进入定制企业合同。第二，WhatsApp 经济性没有被完全吸收到一个简单 SaaS 价格里：Blip 表示
              Startup、Lite、Plus 和 Super 计划包含平台用量加月度 WhatsApp 额度，而 Enterprise 会单独收取 WhatsApp 渠道费，主动外发消息还会产生 Meta 费用。第三，
              Blip 营销 Stilingue、Professional Services、Blip Cred 和 Blip Go 等相邻模块，意味着收入可以来自附加模块、部署工作和垂直工作流， 而不只是一个订阅
              SKU。仍不透明的是经常性软件、渠道转嫁计费、服务和更高毛利模块之间的组合。SoftwareAdvice 给出每月 $750 的公开下限， 但官方网站仍未披露付费层级标价、折扣表、超额用量逻辑和实际企业定价。
