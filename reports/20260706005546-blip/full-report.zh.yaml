  - id: TV002
    title: 看多 / 反向逻辑表
    columns:
      - 维度
      - 看多逻辑
      - 反向逻辑 / 何事会改变判断
    rows:
      - - 市场
        - CPaaS 和对话式 AI 增长很快，AI 正在提升自动化和个性化。
        - 如果品类持续商品化、靠价格驱动，增长就无法支撑高溢价估值。
      - - 产品
        - Blip 拥有规模化的 WhatsApp 原生平台、Microsoft 合作关系，以及有文档记录的基础设施改善。
        - 如果这些优势主要是实施打磨，而不是耐久护城河，全球既有巨头可以追上差距。
      - - 客户
        - Blip 有 4,000 家客户、大型参考 logo 和可衡量 ROI 案例。
        - 如果头部客户很容易被竞争 API 或套件赢回，客户数量就没那么重要。
      - - 财务
        - 一家拉美私营软件资产能做到 ARR 超过 $150M、增长 40%、恢复现金生成能力，强度很少见。
        - 没有公开来源把当前 ARR、利润率或国际收入占比与 IPO 目标对上，质量可能被高估。
      - - 竞争
        - 区域和全球可比公司验证了商业消息市场的规模和战略价值。
        - Twilio、Infobip、Gupshup、Zendesk、Zenvia 等公司证明，这个赛道拥挤且资本充足。
      - - 估值
        - 如果 Blip 向 $200M+ ARR 复合增长并守住盈利，独角兽结果就有可能实现。
        - Series C 估值未披露，当前入场价可能已经计入上行空间，回报余地很小。
    notes: 每个反方论点都对应一项尽调问题或杀手触发条件；这是一张对称的决策表，不是泛泛的公司质量总结。
