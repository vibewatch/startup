      - number: '4.5'
        title: 公开牵引、私有指标缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              Blip 的公开牵引足以证明商业相关性，但披露不足以支撑干净的承销模型。正面看，多项来源把公司放在每天超过 50 million 次对话、每月超过 1 billion 条消息、超过 3,700 至 4,000
              个品牌，以及至少历史上超过 US$100 million 收入的位置；案例研究显示，平台可以在真实客户工作流中推动转化、 GMV、投诉减少和支持生产率。负面看，公开记录内部不一致。Latka 估算 2024 年
              ARR 为 $133.6 million，却仍把 Blip 描述为自举公司； Craft 即便在广泛报道的 2024 年 Series C 轮将累计融资推至 $230 million 之后，仍显示总融资 $100
              million。这些错配不致命， 但提醒我们第三方市场数据界面会滞后于现实。更深的问题是缺失：已审阅来源没有提供经审计财务报表、可对账收入构成、按产品或渠道拆分的毛利率、
              CAC、回本期、NRR、流失率、现金余额、现金消耗或现金续航期。判断：收入质量方向上扎实，因为大客户把 Blip 用于关键任务工作流和可衡量结果；
              利润率路径看起来可行，因为自动化和基础设施效率在改善；资本强度看起来中等而非极端。但尽调阻碍足够大，本章支持持续监控和管理层尽调， 不支持盲目承销信心。
