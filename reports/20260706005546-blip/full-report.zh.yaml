  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与平台政策风险
        blocks:
          - type: paragraph
            body: >-
              Blip 的法律暴露不在于某一起已披露诉讼，而在于产品高度依赖合规数据处理和第三方消息规则。它自己的隐私和 LGPD 材料显示，
              处理范围很宽，覆盖注册、支付、投诉、营销、安全、信用分析和法律抗辩，同时承认会与伙伴和提供商共享数据。只有当控制者—运营者边界、
              供应商合同、删除工作流和同意捕获在实践中都跑通时，这种宽度才可管理。更难控的外部变量是 Meta。Blip 表示，WhatsApp 入驻 和激活依赖 Meta
              验证，用户同意环节出错可能导致账户被封，企业经济性还可能包含单独 WhatsApp 渠道费用。CADE 在 2026 年 1 月介入 Meta 新 WhatsApp AI 条款，以及 Meta
              随后给出巴西专项豁免，说明平台政策会按司法辖区变化。对投资者来说，后果很清楚： 隐私、API 接入和渠道经济性是纠缠在一起的风险，而不是彼此独立的工作流。
