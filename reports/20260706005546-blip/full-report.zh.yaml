  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Blip 的公开客户记录显示，它的客户组合覆盖广泛的企业和偏高端中型市场，核心是高容量对话工作流，而不是狭窄垂直细分。 公司称超过 4,000 个品牌使用其解决方案，平台管理 80 million
              活跃联系人，运营覆盖 32 个国家；但可见证据集仍有清晰重心： 巴西、葡语企业买方和 WhatsApp 优先的运营模型。具名案例集中在受监管金融（Itaú、XP、Banco PAN）、电信和服务运营（Claro
              Chile）、 零售和 CPG（Casas Bahia、Nespresso、Coca-Cola）、医疗（Hermes Pardini）、物流与出行（TruckPad、Gringo）以及平台商家入驻（iFood）。
              这个组合意味着，Blip 通常由营销、客服、运营或销售领导团队采购；这些团队需要自动化大规模入站或外发旅程，同时保留人工接管、合规和渠道认证。 因此，实际买方故事是工作流强度和渠道执行，而不只是聊天机器人试验。
