  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 运营流程从活动或客户入口开始，进入自动化、可选人工升级，再到会话后优化。
    data:
      nodes:
        - id: entry
          label: 获客或接收
          detail: 用户来自广告、外联、支持或入站消息
        - id: verify
          label: 接入渠道
          detail: 业务验证和渠道设置，尤其是 WhatsApp / WABA
        - id: design
          label: 设计旅程
          detail: Builder、SDK 或 HTTP API 定义流程和内容
        - id: automate
          label: 自动化互动
          detail: 流程、AI 内容、活动和集成处理常见任务
        - id: handoff
          label: 按需升级
          detail: Desk 带着上下文将会话路由到坐席队列
        - id: optimize
          label: 分析并改进
          detail: 指标、活动信号和数据反馈打磨工作流
      edges:
        - from: entry
          to: verify
          label: 受治理渠道需要
        - from: verify
          to: design
          label: 使能
        - from: design
          to: automate
          label: 驱动
        - from: automate
          to: handoff
          label: 转入
        - from: handoff
          to: optimize
          label: 指标流入
    claimRefs:
      - CE001
      - CE011
      - CE014
      - CE016
      - CE019
      - CE021
      - CE040
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: Blip 要兑现价值主张，离不开上游渠道计划、云 / AI 提供商和客户系统集成。
    data:
      nodes:
        - id: meta
          label: Meta / WhatsApp
          detail: WABA 验证、Cloud API、MM Lite、渠道质量
        - id: applegoogle
          label: Apple / Google
          detail: Messages for Business 和 RCS 伙伴计划
        - id: microsoft
          label: Microsoft
          detail: Teams 部署路径和 Azure OpenAI 基础设施
        - id: customer
          label: 客户系统
          detail: CRM、营销、表单、日历和运营数据
        - id: blipcore
          label: Blip 控制层
          detail: Builder、路由器 / 子机器人、Desk、API、集成
        - id: data
          label: 数据 / 存储层
          detail: MongoDB Atlas，加上客户自有数据存储和连接器
        - id: ops
          label: 信任 / 运营控制
          detail: DPO、DPA、SIEM、WAF、DLP、连续性、事件管理
      edges:
