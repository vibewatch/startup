      - number: '1.4'
        title: 规模、足迹与指标质量
        blocks:
          - type: paragraph
            body: >-
              证据权重支持 Blip 已经达到有意义的规模，但读者需要盯紧指标口径和发布时间。官方站点材料现在声称每天 125 million 次互动、80 million 活跃联系人，以及覆盖 32 个国家的超过 4,000
              个品牌。独立 2024 年报道大体印证了客户和地域故事，通常把 Blip 描述为约 4,000 个客户或品牌，并在 Mexico City 和 Madrid 设有办公室，正更强力推进以 WhatsApp
              为重心的市场。 财务披露方向积极，但不是完全最新：2024 年报道称 ARR 超过 US$150 million，2023 年增长约 40%，公司已回到盈亏平衡或正向现金生成。 员工数证据更弱。最好的公开信号是
              2024 年超过 1,500 名员工，对比 2023 年 9 月裁员前约 1,700 人；未看到 2025-2026 年官方更新。 伙伴案例也支撑平台深度：Microsoft 基础设施上每月超过 1
              billion 条消息，MongoDB 支撑的工作负载上每天超过 50 million 次对话。
