callouts:
- calloutType: strength
  title: Real developer surface, not just messaging-market copy
  body: Public SDK packages, a published design-system repo, router/subbot documentation, and channel-specific deployment guides give Blip materially stronger product credibility than a startup whose only evidence is marketing pages.
  claimRefs:
  - CE008
  - CE010
  - CE012
  - CE027
  - CE028
- calloutType: risk
  title: Channel dependence is a core technical risk, not a side note
  body: 'Blip’s strongest commercial surface is also its most partner-governed one: WhatsApp onboarding, message quality, MM Lite eligibility, and some public incidents all show that Meta can influence activation speed, feature reach, and service reliability.'
  claimRefs:
  - CE014
  - CE019
  - CE036
  - CE037
  - CE040
- calloutType: risk
  title: AI surfaces are promising but publicly less mature than the core channel stack
