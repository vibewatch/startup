  evidenceGaps:
  - type: missing-source
    severity: material
    topic: release-cadence
    missingEvidence: A dated public changelog or release-note feed covering AI Agent, Builder Assistant, and Marketing Messages Lite milestones, GA criteria, deprecations, and support windows.
    whyItMatters: Without a canonical changelog, module maturity and roadmap must be inferred from scattered marketing pages and help articles, which weakens conviction on release discipline.
    diligencePath: Request the product release calendar, formal feature-stage definitions, and the customer-facing changelog used by support and customer-success teams.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: core-architecture
    missingEvidence: Internal architecture diagrams or design docs showing orchestration, tenant isolation, queueing, model routing, state management, and failover boundaries across channels.
    whyItMatters: Public documentation proves the feature surface exists but does not show how the control plane scales, isolates faults, or arbitrates between upstream partners and internal services.
    diligencePath: Ask engineering leadership for a technical architecture review, data-flow diagram, and production dependency map with failure domains and recovery paths.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: sla-methodology
    missingEvidence: A public or diligence-room SLA exhibit and postmortem archive explaining the 99.5% availability claim and how it reconciles with 2026 incident history.
    whyItMatters: Availability marketing cannot be stress-tested against the observed incident pattern without the formal service objective, exclusions, and remediation process.
    diligencePath: Request the MSA/SLA schedules, historical uptime reporting, and post-incident reviews shared with enterprise customers.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
    - TE005
