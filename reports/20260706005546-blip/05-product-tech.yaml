- id: trust-compliance-and-reliability
  title: Trust, Security, Privacy, and Reliability Controls
  body: 'Blip’s trust surface is more substantial than the typical startup trust-center shell. The company publicly describes ISO 27001-aligned governance, LGPD/GDPR privacy obligations, DPA-backed contracting, a named Data Protection Officer, subprocessors review, business continuity planning, and defined incident-management procedures. The trust-center materials also go beyond policy labels into operating controls: TLS 1.2/1.3 for data in transit, at least AES-128 at rest, SIEM logging, DLP, WAF and firewall protections, and a stated 30-day deletion path for active customer data after request or termination. That said, product risk does not disappear just because the control vocabulary is strong. The public incident feed shows several 2026 disruptions concentrated around WhatsApp delivery plus an April 2026 AI-agents instability, and some incident notes explicitly point to Meta-side failures. This is strategically important: because Blip’s strongest channel is also a partner-governed channel,
    reliability, onboarding, and certain feature rollouts are partly inherited from upstream platforms. For diligence, the right conclusion is not that Blip lacks controls; it is that the company has meaningful controls but still operates inside partner and cloud dependencies that can surface as customer-visible service risk.'
