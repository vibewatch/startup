- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Main diligence gap
  rows:
  - - Lifecycle platform
    - Digital CX / product owner
    - Mature umbrella positioning
    - One system spanning marketing, sales, commerce, and service journeys
    - Public module boundaries are clearer than public SKU or packaging boundaries
  - - Desk human-service layer
    - Support operations / supervisors
    - Mature and well documented
    - Transparent bot-to-agent handoff with queues, tickets, metrics, and history
    - No public evidence on seat economics or enterprise throughput ceilings
  - - Builder + SDK + HTTP API
    - Conversation designers and developers
    - Mature core surface
    - Supports no-code, coded, and any-language API patterns
    - No public architecture diagram for queueing, orchestration, or rate isolation
  - - WhatsApp operating stack
    - CX ops / growth ops
    - Mature but partner-gated
    - BSP status, unlimited-agent support, Flows, MM Lite, and WABA management workflow
    - Activation and quality depend on Meta review and upstream policy
  - - AI Agent / Copilot layer
    - Service leaders / AI transformation teams
    - Production-marketed but mixed public maturity
    - Positions Blip above simple chatbots via knowledge-grounded and assistive AI
    - Thin public release detail versus strong marketing claims
  - - Integration ecosystem
    - CRM / martech / service admins
    - Broad and active
    - 250+ listed integrations plus Zapier automations across common business apps
    - No public exhaustive integration changelog or support-level matrix
  notes: Rows summarize the principal product surfaces evidenced by official pages, help docs, and partner/developer artifacts as of the 2026 run date; maturity labels reflect documentation depth and public operating proof, not private roadmap access.
