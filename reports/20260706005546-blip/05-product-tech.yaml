  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Blip solution
  - Measurable benefit / signal
  - Limitation
  rows:
  - - Convert campaign traffic into conversations
    - Ads, active messages, or outreach point users into messaging
    - Marketing and sales modules route users into conversational journeys
    - Official marketing pages cite higher conversion and large-scale campaign handling
    - Public evidence does not disclose conversion methodology by cohort
  - - Sell or qualify in-channel
    - Customer expresses interest, asks questions, browses catalog, or requests payment
    - Commerce + sales surfaces combine AI conversation, catalogs, and WhatsApp payment flow
    - Commerce page positions purchase-to-payment workflow inside messaging
    - Public pricing and take-rate mechanics are not disclosed
  - - Resolve support issues with escalation
    - Bot handles common intents, then hands off when automation boundary is reached
    - Desk queues, tickets, and agent workflows receive the conversation without breaking context
    - Docs show queue rules, history, metrics, and ticket transfer behavior
    - No public SLA or staffing benchmarks for enterprise teams
  - - Run structured WhatsApp transactions
    - Customer needs a form-like interaction inside chat
    - WhatsApp Flows create WABA-scoped structured experiences with preview/publish lifecycle
    - Flow JSON and preview endpoints show the feature is operational
    - Requires Meta/WABA constraints and, for advanced data flows, customer endpoints
  - - Send compliant active messages
    - Brand launches marketing or notification campaigns at scale
    - MM Lite and API surfaces automate WhatsApp sends under Meta rules
    - Docs show onboarding, status checks, and campaign reporting flow
    - Delivery quality and eligibility depend on Meta account status
  - - Extend conversations into back-office systems
    - Teams need CRM, martech, forms, or calendar triggers
    - 250+ integrations plus Zapier workflows connect Blip to common business apps
    - Zapier and integrations pages show real triggers/actions and app coverage
    - No public support matrix for every connector or version
  notes: The workflow table focuses on operational jobs the platform performs in customer-facing deployments, not just feature names; benefit statements stay tied to public signals rather than private ROI claims.
