- id: build-surfaces-and-operating-architecture
  title: Build Surfaces, Operating Architecture, and Deployment Model
  body: 'The strongest evidence that Blip is a real platform rather than slideware is the number of concrete build and deployment surfaces visible in public documentation. Blip exposes a visual Builder, SDKs, and an HTTP API; its help docs also describe router/subbot hierarchies, Microsoft Teams publication steps, SMS API usage, and increasingly structured WhatsApp surfaces such as Flows and Marketing Messages Lite API. Together these materials imply an operating architecture in which channel adapters and campaign surfaces sit on top of a control plane that manages routing, workflow logic, credentials, and escalation. Router/subbot support shows that Blip expects larger customers to compose reusable conversation services rather than build one monolithic bot. Desk adds the human-operations layer with tickets, queues, and metrics, while channel-specific deployment steps for Teams and WhatsApp show where external identity, app-review, and policy gates enter the process. Under the hood, third-party
    case studies give additional technical depth: Microsoft describes Azure OpenAI-based response suggestion, and MongoDB documents a CRM migration that removed downtime and set up vector-search expansion. The result is a credible but partner-dependent stack: much of the product’s value comes from orchestrating customer workflows across external channel and cloud systems rather than owning every layer end to end.'
  claimRefs:
