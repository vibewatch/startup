- id: comparable-set
  title: Comparable Set and What It Really Says
  body: >-
    The comparable set is informative but not precise. Zenvia is the closest regional public analog because it operates in Brazil with a CPaaS-plus-software mix; its 2023 filing shows revenue of R$807.6 million, 40.9% gross profit margin, 12,929 active customers, and 92.4% NRE, but also cost cuts, refinancing, and slower-than-expected growth. That is helpful because it shows how public investors can punish communication-platform businesses that do not keep growth and economics clean. Global peers are broader and stronger: Twilio markets full-stack WhatsApp messaging and calling, Gupshup says it serves 50,000 customers in 130 countries after raising another $60 million in 2025, Infobip highlights repeated analyst-leader status, and Zendesk markets AI-powered WhatsApp support into a 160,000-company installed base. None of those are clean one-for-one comps, but together they say Blip deserves credit for scale and product quality while still being priced against a globally crowded field rather
    than a local monopoly.
  claimRefs:
  - CV026
  - CV029
  - CV030
  - CV031
  - CV032
