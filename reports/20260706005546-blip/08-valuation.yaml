- id: financing-context
  title: Financing Context, Entry Discipline and Overhang
  body: >-
    Blip has raised at least $230 million across three disclosed rounds: $100 million in 2020, $70 million in 2022, and $60 million in November 2024. That sequence matters because it shows both sponsor persistence and management discipline. The 2024 Brazil Journal interview explicitly said the company was not raising for survival because it had already reached break-even in the prior year, and Mobile Time reported that management still sees a U.S. IPO as the target exit but now believes roughly $300 million of annual revenue is required for that path to work. Entry discipline therefore has to focus on what is still hidden: Series C post-money, liquidation preferences, employee option refresh, and whether the next financing is primary, secondary, or strategic. Public evidence also shows that international markets still account for less than 10% of revenue, which means much of the expansion case remains ahead rather than behind. The overhang is not distress capital; it is valuation opacity
    plus execution distance to the stated IPO bar.
  claimRefs:
  - CV006
  - CV008
  - CV012
  - CV013
  - CV014
  - CV036
  - CV037
  - CV040
  - CV043
  figureRefs:
