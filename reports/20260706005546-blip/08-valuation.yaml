- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risk
  - Probability signal
  rows:
  - - Bull
    - >-
      Blip sustains ~40% growth, expands international mix, and keeps profitable execution while strategic partners deepen distribution.
    - >-
      Illustrative value migrates into a $1.2B-$1.5B band as forward ARR approaches or exceeds ~$210M and the market awards a software-like premium.
    - Requires both continued growth and proof that channel dependence does not cap margins.
    - >-
      Possible, because current growth and partner evidence are real, but not yet proven in a disclosed public-ready model.
  - - Base
    - >-
      Growth remains healthy but not explosive, profitability holds, and the market applies a mid-single-digit ARR multiple.
    - >-
      Illustrative value centers around roughly $750M-$1.1B, enough for a respectable outcome but not enough to justify paying an invisible premium.
    - Multiple compression and slower international scaling keep value from re-rating quickly.
    - Most likely, because it matches the disclosed ARR floor and current opacity on terms and mix.
  - - Bear
    - >-
      Growth slips toward the low 20s or below, price competition intensifies, and investors anchor Blip closer to pressured public CPaaS names.
    - >-
      Illustrative value falls into roughly $450M-$700M, creating down-round or weak-exit risk if the current private mark is already near unicorn territory.
    - Meta dependence, crowded competitors, and IPO-window delay all compound.
    - >-
      A real downside path, because public peers and analyst market data both flag pricing pressure and security/compliance constraints.
  notes: >-
    Scenario values are explicit estimates derived from the disclosed ARR floor and illustrative ARR-multiple bands; they are not quoted market values or leaked round terms.
