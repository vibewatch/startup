- id: scenarios
  title: Bull, Base and Bear Cases
  body: >-
    The bull case assumes Blip sustains roughly 40% growth for another year, lifts international mix, and converts its Microsoft, Meta, and enterprise position into a more defensible software premium rather than a messaging middleware discount. On that path, the company could plausibly move from the current public floor of more than $150 million ARR toward a billion-dollar valuation band without heroic assumptions. The base case assumes solid but slower execution: revenue compounds, profitability remains intact, but price competition and channel concentration keep the multiple in a mid-single-digit ARR band. The bear case assumes CPaaS pricing pressure looks more like the public and late-stage peer set than like premium SaaS, with Meta dependence and global competitor breadth compressing valuation before Blip reaches its preferred IPO scale. Because the current private mark is undisclosed, these are explicitly scenario ranges, not claims about the current cap table. Their purpose is to show
    the sensitivity of value to scale and multiple discipline.
  claimRefs:
  - CV009
  - CV010
  - CV025
  - CV027
  - CV028
