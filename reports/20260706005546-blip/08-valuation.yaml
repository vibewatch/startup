  - - Infobip
    - Analyst positioning
    - 2025-26 analyst sources consistently rank it as a CPaaS leader
    - Signals that category leadership exists at global scale outside U.S. public comps
    - No direct valuation or audited public financials on the cited page
  - - Gupshup
    - Private funding + scale disclosure
    - Raised $60M in 2025; 50,000+ customers; 130+ countries; 120B+ messages annually
    - Demonstrates a large private conversational-AI peer still needs fresh capital while scaling globally
    - Official press release is company-positive and does not disclose valuation
  - - Zendesk
    - Official WhatsApp / AI support footprint
    - 160,000 companies and AI-first WhatsApp support messaging
    - Shows the broader CX-suite alternative buyers can choose instead of a point conversational platform
    - Not a CPaaS pure-play and the cited page is product marketing rather than valuation disclosure
