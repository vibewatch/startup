  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation-terms
    missingEvidence: >-
      The Series C post-money valuation, share price, liquidation preferences, option-pool changes, and any secondary component remain undisclosed in the public record.
    whyItMatters: >-
      These terms determine whether a new investor would be buying into a high-quality company at a reasonable entry or at a capped-return price.
    diligencePath: Request the financing deck, cap table, and legal term summary directly from management or counsel.
    relatedQuestionRefs:
    - QV008
    - QV009
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: current-arr-bridge
    missingEvidence: No reviewed source reconciles the latest ARR or revenue run rate to management’s stated ~$300M IPO threshold.
    whyItMatters: >-
      The ARR bridge is the denominator for every scenario range and is the cleanest test of whether Blip is nearing premium public-market readiness.
    diligencePath: Obtain a dated ARR bridge, cohort growth view, and management forecast showing the path to the IPO threshold.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV003
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set-coverage
    missingEvidence: >-
      Several private and public peers do not disclose directly comparable valuation, revenue, or margin data on the reviewed pages, leaving the comparable table intentionally partial.
    whyItMatters: >-
      Incomplete comparable coverage widens the valuation range and limits confidence in any single-multiple conclusion.
    diligencePath: >-
      Add direct earnings or financing documents for the closest peers, or use a management data room with cleaner peer benchmarking.
    relatedQuestionRefs:
    - QV018
    - QV026
    relatedTableRefs:
    - TV004
