- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Anti-thesis / what would change the view
  rows:
  - - Market
    - CPaaS and conversational AI are growing quickly, with AI improving automation and personalization.
    - If the category stays commoditized and price-led, growth will not translate into premium valuation support.
  - - Product
    - Blip has a scaled WhatsApp-native platform, Microsoft partnership, and documented infrastructure gains.
    - >-
      If those advantages are mostly implementation polish rather than durable moat, global incumbents can close the gap.
  - - Customers
    - Blip shows 4,000 customers, large reference logos, and measurable ROI examples.
    - Customer count matters less if top accounts are easy to win back with rival APIs or suites.
  - - Financials
    - >-
      ARR above $150M, 40% growth, and return to cash generation are unusually strong for a private LatAm software asset.
    - >-
      No public source reconciles current ARR, margin, or international mix to the IPO target, so quality may be overstated.
  - - Competition
    - Regional and global comps validate the market size and strategic value of business messaging.
    - Twilio, Infobip, Gupshup, Zendesk, Zenvia and others prove the field is crowded and well capitalized.
  - - Valuation
    - If Blip compounds toward $200M+ ARR and keeps profits, a unicorn outcome is plausible.
    - >-
      Without a disclosed Series C mark, the current entry could already embed the upside and leave little room for return.
  notes: >-
    Each anti-thesis item maps to a diligence ask or kill trigger; this is a symmetric decision table, not a generic company-quality summary.
