company:
  name: Blip
chapter:
  number: 8
  title: Valuation
  summary: >-
    Blip is a high-quality conversational AI and WhatsApp infrastructure asset, but this chapter stops short of a priced buy call because the November 2024 Series C disclosed $60 million of new capital without disclosing the post-money valuation, preference stack, or updated revenue base. The public record supports a strong operating story—ARR above $150 million in 2023, 40% growth, return to cash generation, 4,000 customers, 32-plus countries, major strategic partners, and a stated U.S. IPO ambition—but it also supports a disciplined anti-thesis: CPaaS remains crowded, pricing pressure is real, and the company still needs roughly $300 million of annual revenue for a stronger IPO setup. We therefore rate Blip research-more with medium confidence, high risk, and an unknown valuation stance, while illustrating a scenario band rather than pretending the current price is observable.
sections:
- id: thesis-antithesis
  title: Investment Thesis and Anti-Thesis
  body: >-
    The thesis for Blip is unusually concrete for a private Latin American software company. Warburg Pincus backed the business with a $100 million Series A in 2020 and a $70 million Series B in 2022 after the company had already reached $40 million ARR in 2020 and then crossed $100 million of annualized revenue in 2022. By 2024, management was publicly discussing ARR above $150 million, 40% annual growth, more than 4,000 customers, more than 1,500 employees, operations in more than 32 countries, and a return to break-even and cash generation. The product thesis is also stronger than a normal chatbot vendor story: Blip is deeply aligned with WhatsApp commerce, has a five-year Microsoft collaboration, a MongoDB-backed scale case, and official Meta positioning. The anti-thesis is that this is still a crowded CPaaS and conversational AI market with pricing pressure, channel dependence, and no disclosed Series C valuation or preference terms. Public evidence supports company quality, but not
    a precise entry price.
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV006
  - CV008
  - CV009
