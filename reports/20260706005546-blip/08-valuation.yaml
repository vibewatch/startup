- id: exit-diligence
  title: Exit Readiness, Thesis-Break Triggers and Final Diligence
  body: >-
    Exit readiness is directional, not complete. Management has openly discussed a U.S. IPO path and said the company is working toward capital-markets-grade governance and transparency, but the same interview also admitted that the revenue threshold for a successful offering is now closer to $300 million annually. That leaves a real gap between current disclosure and public-market readiness. A strategic sale is possible because the cap table already contains Warburg Pincus, SoftBank, and Microsoft, and the platform sits at the intersection of enterprise service, AI tooling, and business messaging. But thesis-break triggers are equally real: growth slowing well below the 30-40% band, international expansion failing to lift revenue mix, evidence that Meta or channel pricing can squeeze economics, or diligence showing that the 2024 round terms already priced Blip above a defendable forward ARR band. Final diligence should therefore target the missing valuation terms, the actual ARR bridge
    to the IPO threshold, international economics, and the governance or preference details that could convert an attractive company into an unattractive entry.
  claimRefs:
