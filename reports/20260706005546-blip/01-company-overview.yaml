callouts:
- calloutType: strength
  title: Rare combination of longevity, partner access, and fresh capital
  body: Few conversational-AI companies combine a 25-year operating history, official channel partnerships, a US$230 million funding trail, and visible cross-border expansion. That makes Blip more institutionally mature than its startup label may suggest.
  claimRefs:
  - CO003
  - CO007
  - CO024
  - CO025
  - CO042
- calloutType: risk
  title: Disclosure opacity remains material despite obvious scale
  body: Blip’s public story is directionally strong, but investors still lack a disclosed valuation, precise post-round ownership, fresh headcount, and a full governance picture. Workforce cuts, complaint volume, and recent status incidents show that execution risk is not theoretical.
  claimRefs:
  - CO014
