- id: funding-capitalization
  title: Funding History and Capital Structure
  body: 'Blip spent most of its history bootstrapped before taking institutional capital in 2020. The first major round was a US$100 million Series A led by Warburg Pincus in October 2020, followed by a US$70 million Series B from the same investor in June 2022. The 2022 round was tied explicitly to international expansion, product investment, and acquisitions, and it coincided with a period when management said the business had crossed US$100 million in annualized revenue. Growth then continued through two inorganic steps: STILINGUE in 2022 to deepen social listening and GUS in the Mexico-Iberia corridor to support international rollout. In November 2024, Blip announced a US$60 million Series C led by SoftBank with Microsoft participation, taking total disclosed capital raised to US$230 million. What remains opaque is as important as what is known. Reviewed sources did not disclose the Series C valuation, any secondary component, debt facilities, precise ownership percentages, or post-round
    governance rights for SoftBank, Microsoft, or Warburg.'
