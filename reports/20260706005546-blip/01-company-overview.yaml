company:
  name: Blip
chapter:
  number: 1
  title: Company Overview
  summary: 'Blip is a Belo Horizonte-rooted Brazilian conversational AI platform that grew out of the Take Phone/Take.net lineage and is still led by co-founder Roberto Oliveira. Public materials support US$230 million raised across Warburg-led Series A/B rounds and a SoftBank-led, Microsoft-backed US$60 million Series C, plus scale around 4,000 brands across 32-33 countries and 125 million daily interactions. The core disclosure gap is not traction but precision: valuation, current cap-table detail, debt, and truly current revenue and headcount figures remain private or stale.'
sections:
- id: identity-business-model
  title: Identity, Origins, and Business Model
  body: 'Blip should be treated as a long-running Brazilian enterprise software company rather than a newly formed AI startup. Its commercial roots go back to a 1997 Take Phone mobile-phone kiosk at UFMG, while public databases and investor materials place the formal company founding year at 1999 under the later Take.net lineage. Today the company presents itself as a conversational intelligence platform that helps enterprises acquire, serve, convert, and retain customers across messaging channels. The official product narrative is broader than a single chatbot tool: Blip bundles campaign orchestration, customer service, payments inside conversations, analytics, and adjacent products such as Stilingue by Blip, Blip Cred, and professional services. The monetization model is consistent with enterprise SaaS and usage software, combining platform plans, channel-linked messaging economics, and implementation support. Official materials also make clear that Blip’s distribution is inseparable from
    its dependence on channel partners such as Meta, Google, Apple, and Microsoft.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO006
  - CO007
  - CO008
  - CO045
  figureRefs:
  - FO002
- id: leadership-governance
  title: Founders, Leadership, and Governance
  body: 'Leadership continuity is a central part of the Blip story. Roberto Oliveira remains the public face of the company as co-founder and CEO, while Daniel Costa still appears in founder-governance roles and was described in 2022 investor materials as chairman and head of people. Third-party executive databases also surface Marcelo Costa de Oliveira as a co-founder and board member, Marcelo Hein as the finance or strategy executive most associated with funding and acquisitions, and Juliano Braz as the revenue leader. That is enough to establish a founder-led operating model, but not enough to establish robust governance transparency. Reviewed official materials do not publish a full board roster, independent-director list, committee structure, or detailed succession bench. For diligence purposes, the practical conclusion is that key-person dependence is real: strategy, capital allocation, and external narrative remain concentrated in a small founder-finance circle, with limited public
    evidence of broader governance depth.'
  claimRefs:
