- id: milestones-and-adverse-signals
  title: Milestones and Adverse Signals
  body: The chronology that later chapters should reuse is a pivot-and-scale story. The founders built early telecom and ringtone products, sold the business in 2005, repurchased it in 2008, and began building the current enterprise conversational platform around 2014. Institutionalization accelerated after the 2020 and 2022 Warburg rounds, while the STILINGUE and GUS acquisitions marked a deliberate move toward a broader AI and international footprint. By 2024, Blip was publicly framing itself as profitable again, internationally active, and ready to use SoftBank and Microsoft capital for a new product cycle. That positive arc should not hide the adverse evidence. In September 2023, Blip cut 143 employees, roughly 9% of staff, to defend profitability. In the first half of 2026, Reclame AQUI still showed triple-digit complaint volume with recurring billing and service-quality themes. And Blip’s own status page recorded a June 23 2026 incident involving slow message sending and media-upload
    failures. None of these signals breaks the company narrative, but together they show that Blip is operating at meaningful scale with real execution and reliability pressure.
