      - number: '3.2'
        title: Direct peers, capabilities, and pricing pressure
        blocks:
          - type: paragraph
            body: >-
              Blip’s cleanest direct overlap is with vendors that make WhatsApp the operational center of sales and
              support rather than an add-on channel. Zenvia is the closest regional peer because it markets a unified
              Customer Cloud for attracting leads, converting sales, and serving customers, then layers in AI agents,
              official Meta-partner messaging, and published monthly plans in Brazilian reais. Gupshup is the clearest
              global direct peer because it wraps Conversation Cloud, WhatsApp API access, AI agents, and support
              automation into a starter package that is unusually explicit for the category. Twilio applies a different
              but equally important pressure: it lets buyers benchmark the economics of WhatsApp delivery directly
              through pay-as-you-go infrastructure pricing. Yellow.ai and Intercom widen the comparison from channel
              software to AI-outcome software by publishing resolution-oriented packaging and ROI narratives. In that
              context, Blip’s public commercial posture is defensible for consultative enterprise selling, but it is
              weaker as a discovery asset because its public page mostly exposes a free entry tier and an upgrade path
              instead of a full commercial ladder.
