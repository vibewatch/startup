      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption tailwinds are real. Messaging is already habitual in Brazil, WhatsApp keeps adding richer
              commercial primitives such as ads that click to WhatsApp, Flows, and Meta Business Agent, and multiple
              analysts still show fast growth for conversational AI and conversational commerce. Retail and ecommerce
              remain the clearest volume driver, but healthcare and regulated services also matter because complex
              workflows, documentation needs, and high service loads reward automation. Even so, the constraints are
              structural rather than cosmetic. WhatsApp policy requires opt-in, human handoff paths, and template
              discipline outside the 24-hour service window. LGPD adds Brazilian consent and data-processing
              obligations. Platform pricing is per delivered message, which means budget owners must prove incremental
              conversion, efficiency, or retention, not just engagement. Integration effort also matters: Blip itself
              sells professional services because enterprise deployment often needs architecture, governance, analytics,
              and ongoing optimization. Finally, analysts disagree on cloud-versus-on-prem dominance, and public sources
              do not reveal Blip’s contract economics, workflow mix, or revenue split by customer segment. Those are the
              main gaps that still govern valuation confidence.
