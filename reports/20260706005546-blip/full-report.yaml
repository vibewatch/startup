  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Modules, and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Blip’s public product story is not just ‘a chatbot on WhatsApp.’ The official surface consistently frames
              the company as an enterprise conversational platform that runs end-to-end journeys across the customer
              lifecycle, with explicit marketing, sales, commerce, service, and AI-led workflow modules. That matters
              because it changes the diligence lens from single-channel automation to operating-model breadth: the buyer
              is not only a support team, but also growth, sales, and digital-experience teams that want to move
              acquisition, conversion, service, and retention into messaging environments. The visible packaged assets
              reinforce that positioning. The homepage calls out product catalogs and WhatsApp Payments, while the
              platform and integration pages show a broad cross-channel layer that spans WhatsApp, Instagram, Facebook
              Messenger, Telegram, Microsoft Teams, Apple Messages for Business, Google RCS, email, and SMS. In workflow
              terms, Blip is selling a system that moves a user from acquisition or campaign entry into an automated
              conversation, keeps context as the interaction progresses, and can escalate to a human agent when the
              automation boundary is reached. The breadth is a real differentiator, but it also means investors should
              think in terms of module maturity and ecosystem dependency instead of assuming uniform strength across
              every surface.
