      - number: '5.4'
        title: Maturity, Differentiation, and Public Roadmap Signals
        blocks:
          - type: paragraph
            body: >-
              Blip’s maturity profile is uneven in a way that is typical for an established platform adding new AI
              layers on top of older messaging infrastructure. The mature surfaces appear to be WhatsApp channel
              operations, Desk handoff, SDK/API access, and broad integration plumbing; those areas have detailed
              workflow or operational documentation and are reinforced by partner and developer-signal evidence. The
              next tier is structured-message capability: WhatsApp Flows and Marketing Messages Lite are clearly real,
              but they are still bounded by WABA state, Meta approvals, and partner-program mechanics. The least mature
              public surface is AI-assisted creation and AI-led service automation. Builder Assistant is still
              explicitly beta, and AI Agent is marketed as production-facing but has comparatively thin technical
              documentation and even shows up in the incident log. This does not negate the product opportunity—if
              anything, it shows Blip is trying to move up-stack from channel management into higher-value AI workflow
              orchestration—but it does mean the roadmap has to be inferred from scattered marketing pages, help
              articles, and partner case studies rather than from a formal public changelog. Blip’s moat is breadth and
              embedded workflow control; its open diligence question is how consistently mature each layer is behind
              that broad promise.
