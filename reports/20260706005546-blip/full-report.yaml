  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and Billing Complexity
        blocks:
          - type: paragraph
            body: >-
              Blip sells an enterprise conversational platform that spans marketing, commerce, and customer care across
              WhatsApp and other messaging channels, then layers adjacent monetization around that core. The official
              pricing and WhatsApp pages make three things clear. First, Blip uses a funnel that starts with a free
              account, then moves customers into paid plans with conversation quotas, and finally into custom enterprise
              contracts. Second, WhatsApp economics are not fully absorbed inside one simple SaaS price: Blip states
              that Startup, Lite, Plus, and Super plans include platform usage plus a monthly WhatsApp allowance, while
              Enterprise charges the WhatsApp channel separately and active outbound messages incur a Meta fee. Third,
              Blip markets adjacent modules such as Stilingue, Professional Services, Blip Cred, and Blip Go, implying
              revenue can come from add-ons, deployment work, and vertical workflows rather than only from one
              subscription SKU. What remains opaque is the mix between recurring software, pass-through channel billing,
              services, and higher-margin modules. SoftwareAdvice provides a public floor of $750 per month, but the
              official site still withholds paid-tier list prices, discount schedules, overage logic, and realized
              enterprise pricing.
            claimRefs:
