      - number: '2.2'
        title: Sizing Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Public sizing data supports demand for the category, but it does not support one clean headline TAM.
              Research and Markets sizes Latin American conversational commerce as transaction value, reaching US$26.4
              billion in 2023 and US$65.3 billion by 2028. Bonafide offers a Brazil-specific growth view above 14.77%
              CAGR from 2026 to 2031. By contrast, Fortune, Grand View, and Precedence size conversational AI as
              software or platform revenue, placing the global market between roughly US$14.3 billion and US$19.21
              billion in 2025 and between US$17.7 billion and US$23.82 billion in 2026. Fortune’s Latin America software
              lens is only about US$1.11 billion in 2025 and US$1.31 billion in 2026. Those numbers are not inconsistent
              because one lens measures commerce transacted through conversations while the others measure technology
              revenue. For Blip, that means broad demand is undeniably large, but any precise TAM, SAM, or SOM requires
              private company inputs such as contract value, API mix, geography mix, and attach rates by workflow. The
              right output is a constrained, multi-lens sizing frame that preserves contradictions instead of smoothing
              them away.
            claimRefs:
