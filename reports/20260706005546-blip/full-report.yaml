  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue scale miss
        - Blip cannot evidence a credible path from >$150M ARR toward the ~$300M IPO threshold
        - Breaks the public-exit narrative and weakens premium multiple support
        - Do not pay a premium round price; re-underwrite to private-downside scenarios
      - - Growth deceleration
        - Reported growth falls materially below the 30-40% band without offsetting margin upside
        - Turns the story from scaled growth to mature messaging infrastructure
        - Reduce target multiple and revisit strategic-sale assumptions only
      - - Channel / pricing squeeze
        - Meta, WhatsApp, or broader CPaaS pricing changes compress unit economics or limit distribution
        - Weakens moat and pushes Blip closer to commodity-API comparables
        - Treat as a thesis break unless offset by higher software mix
      - - Opaque terms
        - Series C or later terms reveal heavy preferences, ratchets, or secondary overhang
        - Entry economics deteriorate even if the operating business remains strong
        - Avoid or demand a materially lower entry price
      - - International expansion stall
        - International revenue stays sub-scale after M&A and expansion efforts
        - Reduces the strategic rationale for global-platform valuation support
        - Re-rate to a Brazil-focused software outcome rather than a global platform case
    notes: >-
      Thresholds are decision rules rather than company guidance; they translate sourced operating facts into explicit
      investment kill criteria.
    claimRefs:
      - CV013
      - CV014
      - CV036
      - CV040
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Series C post-money and preferences
        - Actual valuation, liquidation preferences, secondary mix, and option-pool refresh
