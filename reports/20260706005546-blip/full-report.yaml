  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Blip should not be sized as a generic “chatbot company” or as the full contact-center software market. Its
              own product positioning, together with WhatsApp’s business-platform documentation, points to a narrower
              category: enterprise conversational AI that orchestrates marketing, commerce, service, and support
              journeys inside messaging-led channels. That boundary includes conversational design, automation,
              analytics, AI-agent layers, channel orchestration, and commerce or care workflows executed inside WhatsApp
              and adjacent channels. It excludes broad e-commerce GMV, all CRM seats, all call-center spend, and every
              messaging send outside a structured business workflow. The main substitutes are not only direct
              conversational-AI vendors; they also include status-quo web or app flows, outsourced call-center teams,
              generic website chat widgets, native Meta tooling, and in-house bots stitched onto CRM or support systems.
              That narrower framing matters because Blip’s value proposition is not “all digital engagement”; it is
              turning high-intent conversations into measurable revenue, retention, and service outcomes within channels
              customers already use heavily.
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
