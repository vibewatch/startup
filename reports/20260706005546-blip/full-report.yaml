      - - Current ARR bridge
        - Latest ARR/revenue, growth cadence, and the gap to the stated ~$300M IPO threshold
        - Sets the denominator for any serious valuation work and tests exit timing
        - Obtain management KPI pack or board materials
      - - Margin and cash-flow quality
        - Gross margin, free-cash-flow profile, and how much AI or channel costs dilute software economics
        - Distinguishes a premium software asset from a crowded messaging layer
        - Request audited or management-reviewed financial bridge
      - - International mix
        - Revenue, customer concentration, and payback by Brazil, Mexico, Europe and any new markets
        - Tests whether expansion is accretive or just narrative support for valuation
        - Review segment reporting and post-GUS integration dashboard
      - - Strategic and regulatory dependencies
        - Meta channel economics, LGPD compliance controls, Microsoft commercial dependencies
        - Clarifies whether third-party platforms strengthen or cap the business
        - Legal/compliance diligence plus partner-contract review
    notes: These asks focus on evidence gaps that most directly move valuation rather than on broad operational diligence.
