      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The public financing record shows a business that is no longer capital-light or purely bootstrapped.
              Forbes covered a $100 million Series A in 2020, LatAm List says Blip added a $70 million Series B in 2022,
              and TechCrunch plus LatAm List report a further $60 million Series C in November 2024, taking cumulative
              capital raised to $230 million. TechCrunch says the latest round was earmarked for international expansion
              and product development; ABES separately frames the five-year Microsoft collaboration as a
              platform-scaling and AI-investment push. Those uses of funds fit a company still investing for growth
              rather than harvesting mature cash flows. Management’s statement that Blip resumed generating cash in 2023
              is directionally positive, but the 2023 layoff of 143 employees—roughly 9% of staff—shows capital
              discipline has already been tested. The layoffs were explicitly framed around preserving growth and
              profitability. That mix suggests adequate access to equity capital and some operational flexibility, but
              not enough disclosure to underwrite runway. No reviewed source discloses cash on hand, monthly burn, cash
              conversion, debt facilities, or project-finance obligations. The most plausible financing dependency is
              therefore not near-term solvency, but the need to keep funding product, AI, channel, and international
              expansion while WhatsApp and infrastructure economics remain only partially visible.
            claimRefs:
