              - CV040
      - number: '8.5'
        title: Comparable Set and What It Really Says
        blocks:
          - type: paragraph
            body: >-
              The comparable set is informative but not precise. Zenvia is the closest regional public analog because it
              operates in Brazil with a CPaaS-plus-software mix; its 2023 filing shows revenue of R$807.6 million, 40.9%
              gross profit margin, 12,929 active customers, and 92.4% NRE, but also cost cuts, refinancing, and
              slower-than-expected growth. That is helpful because it shows how public investors can punish
              communication-platform businesses that do not keep growth and economics clean. Global peers are broader
              and stronger: Twilio markets full-stack WhatsApp messaging and calling, Gupshup says it serves 50,000
              customers in 130 countries after raising another $60 million in 2025, Infobip highlights repeated
              analyst-leader status, and Zendesk markets AI-powered WhatsApp support into a 160,000-company installed
              base. None of those are clean one-for-one comps, but together they say Blip deserves credit for scale and
              product quality while still being priced against a globally crowded field rather than a local monopoly.
            claimRefs:
              - CV026
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV044
          - type: table
            tableRef: TV004
            claimRefs:
              - CV026
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
      - number: '8.6'
        title: Exit Readiness, Thesis-Break Triggers and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is directional, not complete. Management has openly discussed a U.S. IPO path and said the
              company is working toward capital-markets-grade governance and transparency, but the same interview also
              admitted that the revenue threshold for a successful offering is now closer to $300 million annually. That
              leaves a real gap between current disclosure and public-market readiness. A strategic sale is possible
              because the cap table already contains Warburg Pincus, SoftBank, and Microsoft, and the platform sits at
              the intersection of enterprise service, AI tooling, and business messaging. But thesis-break triggers are
              equally real: growth slowing well below the 30-40% band, international expansion failing to lift revenue
              mix, evidence that Meta or channel pricing can squeeze economics, or diligence showing that the 2024 round
              terms already priced Blip above a defendable forward ARR band. Final diligence should therefore target the
              missing valuation terms, the actual ARR bridge to the IPO threshold, international economics, and the
              governance or preference details that could convert an attractive company into an unattractive entry.
            claimRefs:
              - CV013
              - CV014
              - CV022
              - CV036
              - CV037
              - CV040
              - CV042
              - CV043
          - type: table
            tableRef: TV005
            claimRefs:
              - CV013
              - CV014
              - CV036
              - CV040
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV022
              - CV036
              - CV037
              - CV040
              - CV043
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Research more until Blip’s actual round terms are visible
            body: >-
              Blip looks strong enough to keep on the front foot with diligence, but not strong enough to justify
              pretending that an undisclosed Series C mark is investable. Underwrite the business, not a rumor.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV036
              - CV041
          - type: callout
            title: The most important downside is invisible valuation, not weak operations
            body: >-
              The public record already supports sponsor quality, scale, and profitable growth. The unresolved risk is
              whether the price and terms of the latest round already capture that upside while leaving new investors
              with poor entry economics.
            calloutType: risk
            claimRefs:
              - CV006
              - CV012
              - CV036
              - CV043
