      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity is a central part of the Blip story. Roberto Oliveira remains the public face of the
              company as co-founder and CEO, while Daniel Costa still appears in founder-governance roles and was
              described in 2022 investor materials as chairman and head of people. Third-party executive databases also
              surface Marcelo Costa de Oliveira as a co-founder and board member, Marcelo Hein as the finance or
              strategy executive most associated with funding and acquisitions, and Juliano Braz as the revenue leader.
              That is enough to establish a founder-led operating model, but not enough to establish robust governance
              transparency. Reviewed official materials do not publish a full board roster, independent-director list,
              committee structure, or detailed succession bench. For diligence purposes, the practical conclusion is
              that key-person dependence is real: strategy, capital allocation, and external narrative remain
              concentrated in a small founder-finance circle, with limited public evidence of broader governance depth.
