chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origins, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Blip should be treated as a long-running Brazilian enterprise software company rather than a newly formed
              AI startup. Its commercial roots go back to a 1997 Take Phone mobile-phone kiosk at UFMG, while public
              databases and investor materials place the formal company founding year at 1999 under the later Take.net
              lineage. Today the company presents itself as a conversational intelligence platform that helps
              enterprises acquire, serve, convert, and retain customers across messaging channels. The official product
              narrative is broader than a single chatbot tool: Blip bundles campaign orchestration, customer service,
              payments inside conversations, analytics, and adjacent products such as Stilingue by Blip, Blip Cred, and
              professional services. The monetization model is consistent with enterprise SaaS and usage software,
              combining platform plans, channel-linked messaging economics, and implementation support. Official
              materials also make clear that Blip’s distribution is inseparable from its dependence on channel partners
              such as Meta, Google, Apple, and Microsoft.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO007
              - CO008
              - CO045
