      - number: '7.2'
        title: Operational Reliability, Service, and Security Delivery
        blocks:
          - type: paragraph
            body: >-
              Operational risk is meaningful because Blip sits inside customer service, commerce, and notification
              workflows at enterprise scale rather than around them. Public docs show a broad technical surface—builder,
              SDKs, webhooks, integrations, automation, AI assistance, quality monitoring, and embedded delivery
              services—which is strategically attractive but increases the number of ways a rollout can break. Blip’s
              own status page disclosed a June 23, 2026 incident with slow message sending and media-upload failures.
              Adverse customer evidence is more troubling than the aggregate reputation score alone: a Capterra review
              alleged weak support, hidden incidents, exit friction, and a higher contract price, while a 2026 Reclame
              Aqui complaint described a paid deployment that never activated and support that passed the user between
              channels. MongoDB and Microsoft both describe real engineering progress and significant scale, but the
              public file still lacks MTTR, severity distributions, and SLA-credit data. That means reliability and
              service quality still need diligence as operating facts, not assumed strengths.
