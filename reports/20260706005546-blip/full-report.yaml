  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and solution classes
        blocks:
          - type: paragraph
            body: >-
              Blip is not competing in a single narrow chatbot lane. The buyer can solve the same job through at least
              five overlapping routes. First are direct WhatsApp-native and customer-cloud suites such as Zenvia and
              Gupshup, both of which package campaign tooling, bots or AI agents, multi-agent service, and customer-data
              workflows around WhatsApp. Second are global CPaaS and communications incumbents such as Twilio, Infobip,
              and Sinch, which extend the category outward into APIs, contact-center tools, and broader communications
              infrastructure. Third are CRM and helpdesk incumbents such as Salesforce, Zendesk, and Intercom that treat
              messaging as one channel inside a wider service operating system. Fourth are AI-first adjacent platforms
              such as Yellow.ai that sell autonomous support and voice or email automation beyond WhatsApp. Fifth is the
              substitute route: building directly on Meta’s WhatsApp platform while stitching together CRM, ticketing,
              and analytics internally. That framing matters because Blip rarely wins or loses on a feature checklist
              alone; it is also being compared against distribution power, bundle leverage, and a buyer’s appetite for
              internal assembly.
            claimRefs:
