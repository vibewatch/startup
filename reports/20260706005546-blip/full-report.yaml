      - number: '6.4'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Blip does show credible land-and-expand patterns, but the economics of that expansion are not transparent.
              Nespresso moved from migration into commerce flows, Claro scaled a pilot into a second partner, and
              Coca-Cola runs both B2B ordering and service bots; those are all positive signs that Blip can widen its
              footprint after an initial win. At the same time, the public file does not reveal whether revenue is truly
              diversified across the 4,000-plus claimed brands or whether a smaller set of enterprise accounts
              contributes a disproportionate share of volume and value. Channel dependence is also real. Blip's
              strongest proofs sit on WhatsApp-heavy journeys, WhatsApp pricing is volume-based, and policy rules
              require opt-in, template governance, and human escalation paths. For regulated customers in finance and
              health, those rules sit on top of LGPD privacy obligations. The main diligence question is therefore not
              whether Blip can land customers, but how profitably and durably it can expand them under Meta-dependent
              economics and with undisclosed concentration.
