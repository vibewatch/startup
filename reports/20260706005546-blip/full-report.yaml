      - number: '7.3'
        title: Partner, Customer, Financial, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Blip’s most important dependency is Meta and WhatsApp, but public evidence also points to execution risk
              created by service-heavy delivery and infrastructure dependence. Meta’s own partner materials show
              partners can handle onboarding, account management, templates, and even billing mechanics, while WhatsApp
              pricing is per delivered message and varies by market and category. Blip’s pages confirm that enterprise
              deployments can face separate channel charges and external verification gates. Infrastructure partners are
              also visible. MongoDB’s case study says legacy CRM downtime was a real issue before migration, and
              Microsoft says Blip is using Azure OpenAI while processing more than one billion messages monthly.
              Financially, the public file supports real scale—$60 million Series C, about $230 million total funding,
              more than $100 million revenue in 2022, and a claim of resumed cash generation in 2023—but that same scale
              creates pressure to execute on international expansion and AI roadmaps without letting support quality
              slip. Public customer proof is broad, but retention and concentration remain undisclosed.
