  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Blip is unusually concrete for a private Latin American software company. Warburg Pincus
              backed the business with a $100 million Series A in 2020 and a $70 million Series B in 2022 after the
              company had already reached $40 million ARR in 2020 and then crossed $100 million of annualized revenue in
              2022. By 2024, management was publicly discussing ARR above $150 million, 40% annual growth, more than
              4,000 customers, more than 1,500 employees, operations in more than 32 countries, and a return to
              break-even and cash generation. The product thesis is also stronger than a normal chatbot vendor story:
              Blip is deeply aligned with WhatsApp commerce, has a five-year Microsoft collaboration, a MongoDB-backed
              scale case, and official Meta positioning. The anti-thesis is that this is still a crowded CPaaS and
              conversational AI market with pricing pressure, channel dependence, and no disclosed Series C valuation or
              preference terms. Public evidence supports company quality, but not a precise entry price.
            claimRefs:
              - CV001
              - CV003
              - CV004
