      - number: '1.4'
        title: Scale, Footprint, and Metric Quality
        blocks:
          - type: paragraph
            body: >-
              The weight of the evidence supports a business that has achieved meaningful scale, but readers should pay
              attention to metric denominators and vintage. Official site materials now claim 125 million interactions
              per day, 80 million active contacts, and more than 4,000 brands across 32 countries. Independent 2024
              coverage broadly corroborates the customer and geographic story, usually framing Blip at roughly 4,000
              customers or brands with offices in Mexico City and Madrid and a stronger push into WhatsApp-heavy
              markets. Financial disclosure is directionally positive but not fully current: 2024 reporting said ARR
              exceeded US$150 million, 2023 growth was about 40%, and the company had returned to break-even or positive
              cash generation. Headcount is weaker evidence. The best public signals are over 1,500 employees in 2024
              versus about 1,700 before the September 2023 layoffs, with no reviewed 2025-2026 official refresh. Partner
              case studies also support platform depth, citing more than 1 billion monthly messages on Microsoft
              infrastructure and more than 50 million daily conversations on MongoDB-supported workloads.
