              outcome snapshots, but they do not disclose NRR, GRR, churn, renewal rates, or contract duration. The best
              public proxies are indirect: Nespresso expanded its relationship from migration into service and sales
              flows, Casas Bahia reused Blip across multiple Black Friday cycles, iFood reports 97.6% CSAT in one flow,
