  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-and-dpa-detail
    missingEvidence: Current DPA, subprocessor list, transfer map, and any live regulatory correspondence touching messaging, AI, or cross-border data handling.
    whyItMatters: Public privacy materials show broad processing and partner sharing, but investors still need the contract-grade evidence that explains controller / operator boundaries and transfer practice.
    diligencePath: Request the executed DPA, subprocessors register, RoPA summary, and any ANPD- or sector-regulator-facing compliance memos.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-metrics
    missingEvidence: Twelve to eighteen months of incident history with severity labels, MTTR, root-cause categories, customer-impact scope, and SLA-credit payouts.
    whyItMatters: One public 2026 incident plus adverse reviews is enough to make reliability material, but not enough to underwrite the true recurrence and margin impact of outages.
    diligencePath: Request an incident postmortem pack, on-call metrics, SLA-performance history, and a breakdown of outages by Meta-side versus Blip-side cause.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-retention
    missingEvidence: Current NRR, GRR, logo churn, top-10 customer revenue share, channel mix by revenue, and customer-cohort renewal performance.
    whyItMatters: Public case studies prove logos and outcomes, but they do not show whether the customer base is durable, diversified, or economically attractive enough to absorb platform shocks.
    diligencePath: Request cohort dashboards, top-account concentration, pipeline-to-renewal bridge, and segment-level gross margin by customer motion.
    relatedQuestionRefs:
    - QR019
    - QR021
    - QR030
  - type: conflicting-data
    severity: minor
    topic: scale-metric-reconciliation
    missingEvidence: One reconciled KPI sheet for brands served, conversations per day, messages per month, headcount, and active geographies.
    whyItMatters: Scale claims are directionally consistent but not identical across official and independent sources, which can distort confidence when investors build operating or valuation models.
    diligencePath: Ask management for the latest board KPI pack and definitions for interactions, conversations, active contacts, brands, and chatbot counts.
    relatedQuestionRefs:
    - QR022
    - QR025
  - type: access-blocked
    severity: minor
    topic: anpd-whatsapp-meta-detail
    missingEvidence: Readable official ANPD decision text on WhatsApp-Meta data-sharing and any implications for business-messaging providers.
    whyItMatters: The LGPD and CADE evidence are strong enough to rank risk, but ANPD-specific treatment of WhatsApp-Meta data sharing could affect the forward compliance posture of ecosystem partners.
    diligencePath: Pull the technical note or decision PDF directly from ANPD’s official document repository and ask counsel to summarize implications for BSPs and conversation platforms.
    relatedQuestionRefs:
    - QR007
