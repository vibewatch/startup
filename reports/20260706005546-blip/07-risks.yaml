chapter:
  number: 7
  title: Risks
  summary: 'Blip has real scale, visible customer proof, and meaningful mitigants, but its risk profile is still dominated by Meta / WhatsApp dependence, service-heavy enterprise delivery, and incomplete public disclosure on retention, concentration, DPA terms, and operating quality. The public record supports a medium-high residual risk rating: the company looks credible, yet several thesis-critical variables sit outside its direct control.'
sections:
- id: legal-regulatory-and-platform-policy-risk
  title: Legal, Regulatory, and Platform-Policy Risk
  body: 'Blip’s legal exposure is less about one disclosed lawsuit and more about how much its product depends on compliant data handling plus third-party messaging rules. Its own privacy and LGPD materials show a wide processing footprint spanning registration, payments, complaints, marketing, security, credit analysis, and legal defense, while also acknowledging partner and provider data sharing. That breadth is manageable only if controller-operator boundaries, vendor contracts, deletion workflows, and consent capture all work in practice. The harder external variable is Meta. Blip states that WhatsApp onboarding and activation depend on Meta verification, that opt-in mistakes can lead to account blocking, and that enterprise economics can include separate WhatsApp channel charges. CADE’s January 2026 intervention against Meta’s new WhatsApp AI terms, plus Meta’s Brazil-specific exemption afterward, show that platform policy can change jurisdiction by jurisdiction. For investors, the
    consequence is clear: privacy, API access, and channel economics are entangled risks rather than separate workstreams.'
