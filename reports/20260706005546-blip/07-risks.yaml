- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Meta policy / platform risk
    - WhatsApp terms, partner notices, onboarding conversion
    - Any rule change that adds customer categories to the Brazil restriction set or materially worsens onboarding time
    - Pause conviction until management shows contractual and channel contingency
  - - Reliability / incident risk
    - Sev-1 or Sev-2 frequency and MTTR
    - Repeated message-delivery incidents or no credible incident metrics in diligence
    - Escalate risk rating and discount retention assumptions
  - - Support / implementation risk
    - Time-to-launch, escalations, complaint velocity
    - Activation failures persist or support metrics deteriorate as the company scales
    - Treat cost-to-serve and churn risk as thesis-breaking until fixed
  - - Channel-economics risk
    - WhatsApp pricing pass-through and gross-margin bridge
    - Meta fee changes or customer pricing resistance compress contribution margin
    - Rework model assumptions and demand price-protection evidence
  - - Customer durability risk
    - Top-customer share, NRR, GRR, logo churn
    - Management cannot show healthy renewal cohorts or acceptable concentration
    - Move from underwriting growth to researching downside scenarios
  notes: These kill criteria convert public risks into diligence triggers so that positive partnership and scale signals are not mistaken for closed risk.
