- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Primary threat
  - Evidence from reviewed sources
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Brazil-first WhatsApp operating expertise
    - Zenvia and Gupshup publish similarly WhatsApp-centric CX narratives
    - Both direct peers market official WhatsApp capabilities and public starter pricing
    - High
    - Ask Blip for competitive win rates in Brazil by segment and channel complexity
  - - Managed service plus workflow support
    - Twilio and Meta direct build reduce software lock-in for technical buyers
    - Twilio and Meta emphasize APIs, pay-go economics, and direct programmability
    - High
    - Validate whether Blip wins when platform teams, not CX leaders, own the budget
  - - Embedded analytics and integrations
    - Incumbent suites can absorb messaging into existing CRM/helpdesk workflows
    - Salesforce, Zendesk, and Intercom all package service plus AI plus ecosystems
    - High
    - Request migration stories where Blip displaced incumbent suites, not just point tools
  - - Operational switching costs in flows and service desks
    - Free trials and freemium packaging lower experimentation friction
    - Blip, Zenvia, Twilio, Intercom, and Yellow.ai all expose low-friction trial motions
    - Medium
    - Quantify time-to-value and reimplementation cost versus alternative stacks
  - - WhatsApp specialization
    - AI-agent features are being commoditized across the landscape
    - Reviewed competitor pages repeatedly promise AI agents, human handoff, omnichannel, and analytics
    - High
    - Demand hard proof of outcome advantage such as resolution lift, conversion lift, or lower service cost
  - - Enterprise trust and governance readiness
    - Trust posture can be matched by larger vendors
    - Sinch, Salesforce, Zendesk, and Yellow.ai all publish strong compliance or governance claims
    - Medium
    - Check Blip trust-center depth, audit certifications, and regulated-industry references
  notes: 'This register is intentionally judgmental: it translates official product and pricing pages into diligence hypotheses about moat durability, not audited outcome data. Severity reflects competitive downside if the named threat proves true in live deals.'
