tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / ownership signal
  - Target customer
  - Product scope / pricing signal
  - Strategic note
  rows:
  - - Blip
    - Direct WhatsApp CX suite
    - Private Brazil-based platform; public page cites 40,000+ customers
    - Brazil-anchored mid-market and enterprise brands using WhatsApp for sales and service
    - Managed conversation stack across marketing, sales, care; free entry tier but WhatsApp requires upgrade
    - Strong local WhatsApp execution wedge, but public pricing is less transparent than some peers
  - - Zenvia
    - Direct LatAm CX suite
    - Public LatAm SaaS vendor; Nasdaq IPO in 2021; present in 180+ countries
    - LatAm brands needing customer cloud plus WhatsApp commerce and service
    - Customer Cloud plus AI agents, CRM/ERP links, official Meta partnership; publishes monthly plans
    - Closest regional peer when buyers want localized CX software with self-serve price anchors
  - - Gupshup
    - Direct conversation-cloud specialist
    - 50,000+ businesses, 130+ countries, 120B conversations annually
    - Global brands prioritizing WhatsApp, AI journeys, and marketing-commerce-support orchestration
    - Conversation Cloud plus WhatsApp API, AI agents, shared inbox, and starter pricing
    - Strong direct pressure on WhatsApp-led automation economics and onboarding friction
  - - Infobip
    - Global CPaaS / contact-center incumbent
    - Global communications platform operator
    - Enterprises wanting omnichannel engagement plus contact-center tooling
    - AgentOS stack spans AI agents, chatbot builder, cloud contact center, CDP, and conversational AI
    - Competes from above as an enterprise communications vendor with broader telecom roots
  - - Twilio
    - Global CPaaS incumbent
    - Large public CPaaS platform with broad channel and data tooling
    - Builders and enterprise platform teams wanting programmable communications
    - Customer engagement platform plus Flex, Conversations, CDP, and pay-as-you-go WhatsApp pricing
    - Most credible programmable substitute when buyers prefer APIs over managed CX software
  - - Sinch
    - Global communications incumbent
    - 200k+ customers, $2.4B annual revenue, 65-country presence
    - Large enterprises needing messaging, voice, email, and trust credentials
    - Messaging platform, APIs, chatbot builder, contact center, and WhatsApp with enterprise compliance posture
    - Enterprise trust and scale can matter more than Blip-specific workflow polish
  - - Salesforce Service Cloud
    - CRM / service incumbent
    - 150,000+ companies on Salesforce platform
    - Large enterprises already standardized on Salesforce data and workflows
    - AI agents, case management, knowledge, automation, and service pricing inside broader CRM bundle
    - Wins through distribution, installed base, and bundle power rather than WhatsApp-first specialization
  - - Zendesk
    - Helpdesk / service incumbent
    - Large installed base with 1,800+ marketplace apps and partners
    - Support teams wanting AI-first service without full CRM migration
    - AI-first service platform with omnichannel support and low entry pricing
    - Adjacent suite pressure is meaningful because service teams can add messaging without changing core helpdesk
  - - Intercom
    - AI-first support incumbent
    - 30,000+ companies, >$400M ARR, 1,400+ people
    - Digital-native support teams wanting AI agent plus helpdesk workflow
    - Fin AI agent, helpdesk, and pay-as-you-go channel packaging including WhatsApp
    - Raises the AI-first bar and supports coexistence with existing helpdesks
  - - Yellow.ai
    - AI-agent adjacent
    - 1,300+ enterprises; 16B+ annual conversation insight base
    - Enterprises seeking agentic automation across chat, voice, email, and support
    - Agentic AI platform across 15+ LLMs with free tier then resolution-based pricing
    - Competes more on autonomous AI breadth than on WhatsApp localization
  - - Meta WhatsApp platform + internal build
    - Substitute / internal build
    - Official channel docs and APIs, but no packaged service workflow
    - Larger teams willing to assemble orchestration, CRM, analytics, and support in-house
    - Direct Cloud API path with buyer-owned integrations and engineering effort
    - Keeps category switching and multi-homing pressure structurally high
  notes: Rows cover the direct, incumbent, adjacent, and substitute options most visible in reviewed official sources as of the 2026 run date; ownership signals are used where private funding detail is not freshly public.
