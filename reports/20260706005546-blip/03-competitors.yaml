chapter:
  number: 3
  title: Competitors
  summary: Blip competes most directly with Zenvia and Gupshup for WhatsApp-centric customer engagement in Latin America, but the real pressure comes from a wider stack of global CPaaS vendors, CRM and helpdesk incumbents, AI-first automation platforms, and direct build on Meta’s own platform. Public evidence suggests Blip still has a real wedge in Brazil-oriented WhatsApp service operations, yet that wedge is only moderately durable because rival pages increasingly advertise the same AI-agent, omnichannel, and workflow claims while publishing clearer starter pricing or leveraging much larger installed bases.
sections:
- id: landscape-and-solution-classes
  title: Landscape and solution classes
  body: 'Blip is not competing in a single narrow chatbot lane. The buyer can solve the same job through at least five overlapping routes. First are direct WhatsApp-native and customer-cloud suites such as Zenvia and Gupshup, both of which package campaign tooling, bots or AI agents, multi-agent service, and customer-data workflows around WhatsApp. Second are global CPaaS and communications incumbents such as Twilio, Infobip, and Sinch, which extend the category outward into APIs, contact-center tools, and broader communications infrastructure. Third are CRM and helpdesk incumbents such as Salesforce, Zendesk, and Intercom that treat messaging as one channel inside a wider service operating system. Fourth are AI-first adjacent platforms such as Yellow.ai that sell autonomous support and voice or email automation beyond WhatsApp. Fifth is the substitute route: building directly on Meta’s WhatsApp platform while stitching together CRM, ticketing, and analytics internally. That framing matters
    because Blip rarely wins or loses on a feature checklist alone; it is also being compared against distribution power, bundle leverage, and a buyer’s appetite for internal assembly.'
