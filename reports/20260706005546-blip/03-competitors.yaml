- id: switching-costs-multi-homing-and-moat-durability
  title: Switching costs, multi-homing, and moat durability
  body: 'Blip does have switching costs, but they look operational rather than monopolistic. Once a team has built flows, analytics, agent routines, and service processes inside a conversational stack, migration is inconvenient and expensive in staff time. Yet the same public pages show why those costs are not absolute. Meta exposes the core channel, Twilio and Gupshup push programmable or low-friction adoption paths, Zenvia publishes local plan anchors, and Intercom explicitly says Fin can sit on top of another helpdesk. That means buyers can multi-home, pilot, or re-platform without abandoning their broader systems. The most adverse evidence for durability is that nearly every reviewed peer now promises AI agents, omnichannel workflows, analytics, and human handoff. If Blip cannot prove better conversion, faster resolution, or stronger economics in Brazil-led WhatsApp operations, the category will drift toward bundle selection or channel-cost arbitrage. The durable wedge is therefore narrower
    than the feature list: consultative deployment, local operating knowledge, and proven WhatsApp execution in markets where those qualities matter more than the sheer breadth of a global suite.'
