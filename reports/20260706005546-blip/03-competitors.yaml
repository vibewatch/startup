  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-pricing-gap
    missingEvidence: Anonymized quote data showing Blip’s realized enterprise pricing at comparable WhatsApp volumes versus Zenvia, Gupshup, Twilio, and bundled incumbent alternatives.
    whyItMatters: List-price surfaces are enough to show discovery friction and price pressure, but not enough to determine whether Blip actually clears or loses enterprise deals on economics.
    diligencePath: Request recent quote decks, discount bands, and message-volume assumptions from Blip sales leadership, then compare them against buyer alternatives in recent RFPs.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-gap
    missingEvidence: Win-loss data or churn-destination data showing which alternatives Blip most often loses to, and why buyers switch away or stay multi-homed.
    whyItMatters: The public landscape shows who can plausibly compete, but it does not reveal the actual displacement vector or whether bundle incumbents or WhatsApp-native peers are the dominant threat in live deals.
    diligencePath: Ask for the last twelve months of competitive intelligence notes, churn reason codes, and named alternative vendors from Blip’s revenue operations or customer success teams.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP004
