- id: incumbents-substitutes-and-distribution-power
  title: Incumbents, substitutes, and distribution power
  body: 'The most serious competitive threat to Blip is not only another WhatsApp specialist. It is the ability of larger software stacks to absorb conversational service into a bundle that a buyer already trusts and budgets for. Salesforce brings the biggest installed-base asymmetry because Service Cloud sits inside a much larger CRM, workflow, and data estate. Zendesk exerts adjacent pressure from the helpdesk direction by promising AI-first service, omnichannel support, and low-friction entry pricing. Intercom competes by reframing the problem around AI agent outcomes and by allowing coexistence with existing helpdesks, which lowers migration friction for buyers who do not want a full rip-and-replace. On the substitute end, Meta’s own WhatsApp Business Platform documentation keeps internal build permanently credible for technically mature teams. Twilio and Sinch reinforce that substitute path because they normalize API-first, programmable communications buying. The result is a market
    where Blip’s distribution disadvantage is real: even when the product fit is good, a buyer may still prefer the vendor that already owns the CRM, the helpdesk, the communications layer, or the engineering workflow.'
