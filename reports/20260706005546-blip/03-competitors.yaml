- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / class
  - Public price signal
  - Contract motion
  - Included capabilities signal
  - Unknowns / caveats
  - Implication for Blip
  rows:
  - - Blip
    - Free account with 2 agents; paid WhatsApp terms not listed
    - Hybrid self-serve entry plus upgrade / sales conversation
    - Core intelligent contact tooling, but WhatsApp integration is outside the free tier
    - Enterprise volume bands and realized WhatsApp economics are not public
    - Creates room above free trial, but weak public price anchor versus transparent peers
  - - Zenvia
    - Starter R$0 software tier with paid channel package; Specialist R$600/mo; Expert R$1,800/mo plus activation/channel charges
    - Self-serve plan selection with WhatsApp add-ons
    - Customer Cloud, AI agents, and packaged channel volumes
    - Brazilian pricing page is most explicit for local buyers; enterprise discounts unknown
    - Direct local price pressure on Blip in Brazil-led evaluations
  - - Gupshup
    - $100/mo after first 3 months free plus $0.008 per message and Meta charges
    - Low-friction starter plan
    - Campaigns, bot studio, multi-agent dashboard, analytics, APIs
    - Actual enterprise discounts and extra Meta costs still vary by use case
    - Very clear benchmark for WhatsApp-led automation buyers
  - - Infobip
    - Try for free / contact us on reviewed pricing surface
    - Sales-led enterprise packaging
    - AgentOS, AI agents, chatbot builder, contact center, conversational AI
    - List rates for enterprise configurations were not visible on reviewed page excerpt
    - Competes on breadth and enterprise fit more than transparent price undercutting
  - - Twilio
    - Usage-based pricing; WhatsApp starts at $0.005 per message
    - Developer-led pay-as-you-go with volume discounts
    - Communications APIs, Conversations, Flex, and AI tooling
    - Total cost depends on usage, orchestration, and adjacent modules
    - Strong commoditization pressure when buyers benchmark channel economics directly
  - - Salesforce Service Cloud
    - $25 / $100 suite entry, then $175 Enterprise, $350 Unlimited, $550 Einstein 1 Service
    - Seat-based enterprise bundle
    - CRM, AI agents, knowledge, workflow automation, and service console
    - Full buyer cost depends on edition, credits, and adjacent clouds
    - Expensive, but powerful when already embedded in Salesforce workflows
  - - Zendesk
    - Starting from $19/month
    - Seat-based service platform
    - AI-first service, messaging, contact center, and marketplace ecosystem
    - Specific plan-to-plan feature mapping was truncated on reviewed page
    - Low-cost adjacent pressure on teams already running Zendesk
  - - Intercom
    - $19 / $85 / $132 per seat plus $0.99 per Fin outcome and pay-as-you-go WhatsApp
    - Seat plus usage hybrid
    - Fin AI agent, inbox, help center, workflows, and multibrand support
    - ROI depends heavily on Fin outcomes and channel usage
    - AI-first buyer can compare Blip against measurable automation ROI claims
  - - Yellow.ai
    - Free tier with 500 sessions per month, then $0.99 per resolution; enterprise custom
    - Freemium plus enterprise
    - Agentic AI, voice, email, copilots, analytics, and enterprise controls
    - Enterprise pricing for large deployments is still custom
    - Creates a modern AI-agent benchmark that Blip must answer with service outcomes
  notes: Pricing is list or surface pricing only; it should not be interpreted as realized enterprise ASPs. Where a reviewed page did not expose detailed terms, the row calls that out explicitly rather than inferring discounts.
