- id: retention-and-durability
  title: Retention, Repeat Usage, and Durability
  body: 'Durability is the weakest part of the public customer record. Blip''s materials provide many point-in-time outcome snapshots, but they do not disclose NRR, GRR, churn, renewal rates, or contract duration. The best public proxies are indirect: Nespresso expanded its relationship from migration into service and sales flows, Casas Bahia reused Blip across multiple Black Friday cycles, iFood reports 97.6% CSAT in one flow, Banco PAN says more than 40,000 customers were satisfied in its contestation journey, and FeaturedCustomers aggregates a 4.8 out of 5 score from 504 reference ratings. Those are useful signals, but they still do not convert deployment proof into revenue durability. Category-level evidence also warns against overconfidence: Twilio found Brazilian companies rate conversational-AI satisfaction much higher than consumers do, and June 2026 status incidents show that reliability problems can still affect live customer journeys. Public evidence therefore supports adoption,
    but only partially supports retention.'
  claimRefs:
