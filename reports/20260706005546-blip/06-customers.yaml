company:
  name: Blip
chapter:
  number: 6
  title: Customers
  summary: 'Blip / Take Blip has stronger public customer proof than the typical private conversational-AI vendor: its own case studies and partner references show live deployments across banking, telecom, retail, healthcare, logistics, and marketplace onboarding, with quantified outcomes such as 50% lower support costs at Claro Chile, more than 2.5 million books distributed for Itaú, 80 million-plus messages and 30% bot-order share for Coca-Cola, 97.6% CSAT at iFood, and 3.6x efficiency at XP. Platform-scale references also imply real breadth—4,000-plus brands, 80 million active contacts, thousands of businesses, more than 50 million daily conversations, and more than 1 billion monthly messages—but durability is less transparent because public NRR, churn, renewal, and concentration data are not disclosed. The main customer risk is therefore not lack of adoption proof, but incomplete visibility into renewal and whale exposure combined with WhatsApp/Meta dependence and visible service-reliability
    events.'
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'Blip''s public customer record suggests a broad enterprise and upper-midmarket customer mix centered on high-volume conversational workflows rather than a narrow vertical niche. The company says more than 4,000 brands use its solutions, 80 million active contacts are managed on the platform, and operations reach 32 countries, but the visible proof set still has a clear center of gravity: Brazil, Portuguese-speaking enterprise buyers, and WhatsApp-first operating models. The named cases cluster in regulated finance (Itaú, XP, Banco PAN), telecom and service operations (Claro Chile), retail and CPG (Casas Bahia, Nespresso, Coca-Cola), healthcare (Hermes Pardini), logistics and mobility (TruckPad, Gringo), and marketplace onboarding (iFood). That mix implies Blip is usually bought by marketing, customer-service, operations, or sales-leadership teams that need to automate large inbound or outbound journeys while preserving human handoff, compliance, and channel certification. The practical
    buyer story is therefore workflow intensity and channel execution, not just chatbot experimentation.'
