figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Blip's public customer journey typically starts with WhatsApp-heavy workflow pressure, moves through contracting and Meta verification, and then expands from one live flow into broader operating usage.
  data:
    nodes:
    - id: need
      label: Workflow pressure
      detail: Brand needs better support, lead qualification, onboarding, or ordering inside channels customers already use.
    - id: onboarding
      label: Contract and channel setup
      detail: Legal and financial checks, Meta verification, plan setup, and official account provisioning.
    - id: launch
      label: Initial live flow
      detail: First campaign, support bot, onboarding journey, or service-status flow goes live on WhatsApp or Messenger.
    - id: operate
      label: Human + AI operations
      detail: Desk, Copilot, routing, and agent handoff support higher-volume production usage.
    - id: expand
      label: Workflow expansion
      detail: Customer adds more use cases such as commerce, service, activation, or fraud support.
    - id: durability
      label: Renewal / concentration test
      detail: Public outcome proof remains strong here, but renewal math and top-account exposure are still mostly undisclosed.
  approximationNotes: Stages are inferred from product pages and named customer cases rather than from a published Blip sales-process diagram.
  claimRefs:
  - CU003
  - CU012
  - CU021
  - CU033
  - CU040
  - CU043
