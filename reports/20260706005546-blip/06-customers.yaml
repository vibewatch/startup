- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Public status
  - Impact
  - Best public evidence
  - Diligence path
  rows:
  - - Land-and-expand inside accounts
    - Supported but unquantified
    - Positive for ACV growth if attach rates are real
    - Nespresso added sales flows; Claro expanded a pilot; Coca-Cola runs B2B plus service bots
    - Request module-level expansion ARR, attach rates, and number of workflows per top account
  - - WhatsApp / Meta dependence
    - Clearly present
    - High on unit economics and customer-operating model
    - Most named cases are WhatsApp-led; pricing is per delivered message; policy governs templates and opt-in
    - Model gross margin sensitivity to Meta pricing, and request channel mix by revenue and volume
  - - Privacy / consent friction
    - Clearly present in regulated markets
    - Medium-High on implementation time and legal review
    - WhatsApp policy requires opt-in and escalation; LGPD imposes data-processing obligations
    - Request win-loss data for regulated accounts and typical implementation timeline by vertical
  - - Customer concentration
    - Publicly unresolved
    - Potentially material if a small set of enterprise accounts dominates volume or spend
    - Blip discloses a broad logo base but no top-customer mix or whale exposure
    - Request top-10 customer revenue share, any >10% customers, and message-volume concentration
  - - Reference-quality bias
    - Known limitation
    - Medium because vendor-authored proof can overstate durability
    - Most quantified proof is Blip-authored or partner-authored rather than customer-owned disclosure
    - Prioritize customer calls, independent ROI decks, and churn / renewal evidence in diligence
  notes: The expansion story is credible at the workflow level, but the public record still does not show whether expansion converts into diversified and durable revenue at the account level.
