- id: adoption-and-named-customer-proof
  title: Adoption Trajectory and Named Customer Proof
  body: The adoption case is strongest where Blip can be tied to concrete, live operating outcomes. Partner references from MongoDB and Microsoft anchor platform scale with thousands of businesses, more than 50 million daily conversations, 40% to 50% annual growth in the period covered by the MongoDB migration, and more than 1 billion monthly messages in Microsoft's account. The named customer file then shows that this traffic is not purely cosmetic. Claro Chile used Blip to cut support costs by 50% and raise NPS by seven points in a production service flow, while a separate Claro Copilot rollout started as an October 2025 pilot and expanded to a second partner after measurable results. Itaú, Casas Bahia, Coca-Cola, iFood, XP, and Banco PAN each publish quantified workflow outcomes, and several relationships appear to span more than one use case or more than one campaign cycle. The result is a public record that is much better on real deployment proof than on simple logo-dropping.
