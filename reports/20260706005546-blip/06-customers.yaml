tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Revenue / strategic value
  - Main gap
  rows:
  - - Financial services and regulated enterprises
    - Marketing, sales, CX, fraud, and operations leaders; end users are retail customers; payer is enterprise software and channel budget
    - Campaign distribution, lead qualification, fraud contestation, and customer support
    - Itaú reached 800k+ users and 8M+ messages; XP reported 3.6x efficiency; Banco PAN cited 40k+ satisfied customers
    - High ACV potential and sticky regulated workflows
    - No public renewal, contract value, or segment NRR disclosure
  - - Retail, CPG, and commerce brands
    - Commerce, CRM, and service teams; end users are shoppers; payer is digital commerce budget
    - Promotions, ordering, active messaging, and after-sales service
    - Casas Bahia logged 36M+ campaign messages; Coca-Cola cited 80M+ messages and 30% bot-order share in one franchise; Nespresso disclosed 57.6%-72.9% campaign conversion
    - Strong message volume and revenue-adjacent automation potential
    - Repeat-purchase, attach-rate, and gross-margin impact are not disclosed
  - - Telecom and service operations
    - Service ops and sales managers; end users are subscribers or prospects; payer is support and sales budget
    - Technical-visit status, sales assistance, and objection handling on WhatsApp
    - Claro Chile reported 50% lower support costs and +7 NPS in service, while a Copilot pilot expanded after measurable sales gains
    - Good fit for recurring high-volume service and upsell journeys
    - Breadth beyond Chile and one Colombia partner is not yet public
  - - Healthcare, logistics, and mobility operations
    - Operations or CX leaders; end users are patients, drivers, and app users; payer is service-operations budget
    - Appointments, exam results, official messaging, and targeted opt-in campaigns
    - Hermes Pardini served 40k+ customers and 2M+ messages; TruckPad cited 15k monthly users; Gringo raised terms acceptance 95%
    - Shows utility in operational rather than purely marketing journeys
    - ACV, renewals, and multichannel expansion depth are not public
  - - Marketplace and partner onboarding
    - Partner-success or growth teams; end users are merchants or partners; payer is ecosystem growth budget
    - Restaurant onboarding, contract signing, and activation support
    - iFood disclosed 26% conversion in the automated flow, 97.6% CSAT, and 76.6% lower abandonment in one period
    - Strategically valuable because onboarding quality affects marketplace growth
    - No public data on retention of onboarded partners or cross-sell into other workflows
  notes: Rows group visible customers by buyer and workflow rather than by legal entity count because Blip discloses far more about use cases and outcomes than about customer revenue bands or contract values.
