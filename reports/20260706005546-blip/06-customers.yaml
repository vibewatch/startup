  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Segmented NRR, GRR, churn, renewal rate, and average contract length by top customer cohort.
    whyItMatters: Without renewal math, strong deployment proof cannot be translated into durable revenue quality or customer lifetime value.
    diligencePath: Request customer-retention cohort tables, renewal dashboards, and customer-success scorecards for the top 20 accounts.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, any customer above 10% of revenue, and message-volume concentration by account.
    whyItMatters: A broad logo base does not rule out whale dependence if a small number of enterprises drive most volume and spend.
    diligencePath: Request a top-10 customer concentration waterfall plus account-level ACV, message volume, and gross margin contribution.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: independent-reference-depth
    missingEvidence: Customer-authored renewal narratives, independent ROI studies, and reference calls that are not routed through Blip or its close partners.
    whyItMatters: Most visible proof is vendor- or partner-authored, which is enough to prove deployment but not enough to fully prove durability or pricing power.
    diligencePath: Prioritize direct customer reference calls in finance, retail, and telecom, and request customer-owned KPI decks for at least five large accounts.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
