- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for adoption
  - Diligence ask
  rows:
  - - Brazilian and LATAM messaging habit
    - Driver
    - Current / ongoing
    - High baseline WhatsApp usage lowers channel-learning friction and makes conversational journeys easier to launch
    - How much of Blip volume comes from repeat service versus net-new commerce use cases?
  - - Conversational-AI deployment maturity in Brazil and LATAM
    - Driver
    - '2026'
    - Twilio data suggests the region is no longer purely experimental, which can shorten education cycles for enterprise sales
    - Request Blip pipeline split between greenfield education and rip-and-replace deals
  - - Meta feature expansion (ads, Flows, Business Agent)
    - Driver
    - Current / ongoing
    - Richer native primitives widen the number of funded workflows inside messaging
    - Which new Meta primitives are driving measurable ACV expansion for Blip?
  - - Retail and ecommerce demand
    - Driver
    - Current / ongoing
    - High-frequency transactional journeys create the clearest ROI case for conversational automation
    - What share of Blip revenue depends on retail seasonality or campaign budgets?
  - - Per-message pricing on WhatsApp
    - Constraint
    - Current / ongoing
    - Budget owners must prove conversion or efficiency gains above message costs and integration costs
    - Model gross margin by workflow and message category for top verticals
  - - Opt-in, template, and handoff rules
    - Constraint
    - Current / ongoing
    - Operational compliance is mandatory and can slow launches in heavily governed journeys
    - Ask for Blip implementation playbooks for consent capture and escalation design
  - - LGPD consent and data-governance requirements
    - Constraint
    - Persistent
    - Sensitive-data workflows require careful legal design, storage controls, and deletion logic
    - Review how Blip supports data minimization, deletion, and auditability in Brazil
  - - Integration and professional-services burden
    - Constraint
    - Current / ongoing
    - Enterprise programs often need CRM, payments, analytics, and process integration before ROI appears
    - Measure time-to-live and services intensity by workflow and vertical
  - - Cloud-versus-on-prem ambiguity
    - Constraint
    - Ongoing
    - Analyst disagreement signals that deployment preference is still sector-specific, which complicates one-size-fits-all product strategy
    - Check how much of Blip demand still depends on hybrid or controlled environments
  - - Lens ambiguity in market sizing
    - Constraint
    - Ongoing
    - Headline TAM storytelling can overstate opportunity if transaction value is mistaken for software revenue
    - Keep every sizing lens tied to its exact unit and methodology
  notes: Some factors are demand accelerants at the category level but still create operating friction at the deployment level. The diligence asks are intentionally forward-looking and should not be read as already-verified facts.
