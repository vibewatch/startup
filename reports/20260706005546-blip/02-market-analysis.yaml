chapter:
  number: 2
  title: Market Analysis
  summary: 'Blip operates in a real but definition-sensitive market: enterprise conversational AI and conversational commerce built on messaging channels, especially WhatsApp in Brazil and Latin America. Broad demand is large and still growing, but public sources split sharply between transaction-value and software-revenue lenses, so the right output is a constrained multi-lens sizing frame rather than a single TAM headline.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Substitutes
  body: 'Blip should not be sized as a generic “chatbot company” or as the full contact-center software market. Its own product positioning, together with WhatsApp’s business-platform documentation, points to a narrower category: enterprise conversational AI that orchestrates marketing, commerce, service, and support journeys inside messaging-led channels. That boundary includes conversational design, automation, analytics, AI-agent layers, channel orchestration, and commerce or care workflows executed inside WhatsApp and adjacent channels. It excludes broad e-commerce GMV, all CRM seats, all call-center spend, and every messaging send outside a structured business workflow. The main substitutes are not only direct conversational-AI vendors; they also include status-quo web or app flows, outsourced call-center teams, generic website chat widgets, native Meta tooling, and in-house bots stitched onto CRM or support systems. That narrower framing matters because Blip’s value proposition is
    not “all digital engagement”; it is turning high-intent conversations into measurable revenue, retention, and service outcomes within channels customers already use heavily.'
  claimRefs:
  - CM001
  - CM003
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM001
- id: sizing-lenses-and-contradictions
  title: Sizing Lenses and Contradictory Estimates
  body: Public sizing data supports demand for the category, but it does not support one clean headline TAM. Research and Markets sizes Latin American conversational commerce as transaction value, reaching US$26.4 billion in 2023 and US$65.3 billion by 2028. Bonafide offers a Brazil-specific growth view above 14.77% CAGR from 2026 to 2031. By contrast, Fortune, Grand View, and Precedence size conversational AI as software or platform revenue, placing the global market between roughly US$14.3 billion and US$19.21 billion in 2025 and between US$17.7 billion and US$23.82 billion in 2026. Fortune’s Latin America software lens is only about US$1.11 billion in 2025 and US$1.31 billion in 2026. Those numbers are not inconsistent because one lens measures commerce transacted through conversations while the others measure technology revenue. For Blip, that means broad demand is undeniably large, but any precise TAM, SAM, or SOM requires private company inputs such as contract value, API mix, geography
    mix, and attach rates by workflow. The right output is a constrained, multi-lens sizing frame that preserves contradictions instead of smoothing them away.
  claimRefs:
