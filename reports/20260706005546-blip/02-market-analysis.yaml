callouts:
- calloutType: insight
  title: Use Multiple Lenses, Not One TAM Headline
  body: The broadest published number in this chapter is conversational-commerce transaction value, not software revenue. Treating it as Blip’s platform TAM would overstate the monetizable pool. The more credible approach is to preserve a broad demand lens, a regional software lens, and a channel-depth lens side by side.
  claimRefs:
  - CM009
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
- calloutType: insight
  title: Brazil Has a Rare Mix of Habit and Workflow Density
  body: Brazil combines high WhatsApp penetration, strong business usage, and a messaging-first customer culture. That makes it unusually fertile for conversational-commerce and service automation, which helps explain why Blip’s home market matters more than a generic global TAM slide would suggest.
  claimRefs:
  - CM018
  - CM020
  - CM021
  - CM022
  - CM023
- calloutType: risk
  title: Compliance and Integration Work Govern Real ROI
  body: The biggest commercial risk is not whether messaging works. It is whether teams can operationalize consent, templates, human handoff, integrations, and pricing discipline fast enough to sustain margin and customer experience at scale.
  claimRefs:
  - CM027
  - CM031
  - CM032
  - CM033
  - CM035
  - CM037
  - CM040
