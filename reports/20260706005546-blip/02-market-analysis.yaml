- id: FM004
  title: Adoption funnel or value-chain map
  type: funnel
  layout: standard
  summary: Typical enterprise adoption moves from channel familiarity to pilot, integration, automation, and scaled multi-workflow rollout; drop-off usually occurs at compliance or integration stages rather than at initial awareness.
