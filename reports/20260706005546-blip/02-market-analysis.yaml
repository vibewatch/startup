  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: blip-contract-economics
    missingEvidence: Blip contract-value distribution, pricing by message volume or workflow, and gross-margin profile by channel.
    whyItMatters: Without pricing and ACV data, public market lenses cannot be translated into a defensible SAM or SOM for valuation work.
    diligencePath: Request cohort-level pricing, ACV, and gross-margin breakdowns by vertical, channel, and deployment model from management.
    relatedQuestionRefs:
    - QM009
    - QM025
  - type: missing-source
    severity: material
    topic: api-versus-app-adoption
    missingEvidence: Independent breakdown of WhatsApp Business app usage versus API usage by company size in Brazil and wider LATAM.
    whyItMatters: Blip participates mainly in higher-value enterprise API workflows, so channel-depth figures overstate the immediately serviceable market if API penetration is low.
    diligencePath: Look for Meta partner disclosures, telecom studies, or enterprise surveys that separate business-app adoption from API adoption by segment.
    relatedQuestionRefs:
    - QM014
    - QM025
  - type: missing-source
    severity: minor
    topic: independent-roi-benchmarks
    missingEvidence: Independent benchmarks for conversation-to-order conversion, containment, and retention by workflow in Brazil or LATAM.
    whyItMatters: Most hard ROI examples available publicly are company or platform case studies, which can bias expected payback upward.
    diligencePath: Benchmark win rates and operating metrics against third-party implementation partners, customer interviews, and procurement references.
    relatedQuestionRefs:
    - QM015
    - QM018
    - QM025
  - type: access-blocked
    severity: material
    topic: regulated-workflow-compliance
    missingEvidence: Detailed public guidance on how enterprise deployers operationalize LGPD, template governance, retention, and deletion requirements inside regulated journeys.
    whyItMatters: Compliance readiness affects which verticals are truly addressable and how much services intensity or legal review each deployment needs.
    diligencePath: Review customer implementation documentation, DPA templates, retention policies, and regulator or counsel guidance for BFSI and healthcare deployments.
    relatedQuestionRefs:
    - QM020
    - QM023
