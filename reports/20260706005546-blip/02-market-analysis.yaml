- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer
  - Primary user
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  - Why Blip fits
  rows:
  - - Enterprise retail / ecommerce
    - Head of ecommerce, CRM, or growth
    - Sales ops, support agents, merchandisers
    - Growth or digital-commerce budget
    - Catalogs, recommendations, cart recovery, order help
    - Need to convert high-intent messaging traffic and reduce abandonment
    - Blip and WhatsApp both support product-led journeys, catalog-driven flows, and campaign-to-chat motion
  - - Banks, fintechs, and insurers
    - CX leader, digital channels head, service ops leader
    - Service teams, onboarding teams, branch-support staff
    - CX, service, or digital-channel budget
    - Statements, invoices, loan or account support, proactive notifications
    - High service volume plus need for secure, documented interactions
    - Blip markets privacy-aware financial workflows and already highlights BFSI cases
  - - Healthcare and appointment-heavy services
    - Operations lead, service leader, digital patient-experience owner
    - Schedulers, service agents, patients or members
    - Operations or care-experience budget
    - Scheduling, reminders, triage, results lookup, follow-up
    - Need 24/7 response without scaling headcount linearly
    - Automation handles repetitive demand while human escalation stays available
  - - Customer-support operations
    - Support director or CX operations leader
    - Agents, supervisors, bot designers
    - Service-operations budget
    - FAQ automation, triage, routing, post-sale care
    - Queue pressure, SLA pressure, and off-hours demand
    - WhatsApp and Blip both emphasize automation plus human handoff
  - - Marketing and lead-gen teams
    - Growth marketing or lifecycle marketing lead
    - Campaign managers, SDRs, CRM teams
    - Acquisition or lifecycle marketing budget
    - Ads that click to WhatsApp, lead capture, offers, nurturing
    - Need better conversion from paid traffic or inactive audiences
    - Meta and WhatsApp features make marketing-to-chat a distinct buying motion
  - - Regulated or documentation-heavy operators
    - Compliance-conscious digital or service leader
    - Ops teams, reviewers, support agents
    - Hybrid budget across operations, compliance, and product
    - Guided data capture, controlled templates, permissioned service journeys
    - Need traceability, consent, and controlled escalation
    - This is where policy mastery and services matter more than raw chatbot count
  notes: Rows map buyer, user, and payer roles rather than a census of every vertical. Budget owner is the functional team most likely to justify spend first; IT often joins later for integration and governance.
