figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: wide
  summary: Constrained layers move from broad transactional demand to tighter software revenue and finally to observable Blip footprint, because public data does not permit a clean single-unit TAM/SAM/SOM stack.
  data:
    nodes:
    - id: tam
      label: Broad demand lens — LATAM conversational commerce US$65.3B by 2028
      detail: Research and Markets transaction-value forecast for conversations that drive commerce across the region
    - id: sam
      label: Regional software lens — LATAM conversational AI US$1.31B in 2026
      detail: Fortune Business Insights software-revenue view for conversational AI in Latin America
    - id: serviceable
      label: Brazil channel-depth lens — 197M WhatsApp users, ~10M businesses, 18%-22% API adoption in medium/large companies
      detail: Aurora Inbox adoption proxy showing why Brazil is Blip’s deepest natural pool even without a public SAM number
    - id: observable
      label: Observable Blip footprint — 3,700 brands, 28 countries, 125M daily conversations
      detail: Company-disclosed installed-base and activity metrics show meaningful market presence but not market share
  approximationNotes: The pyramid intentionally mixes transaction value, software revenue, adoption depth, and company footprint because public sources do not reveal Blip-specific revenue share or contract economics. Each layer is a separate lens, not an additive stack.
