tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded / substitute spend
  - Buyer / payer
  - Why it matters for Blip
  rows:
  - - Enterprise conversational-AI platform
    - Journey orchestration, NLP, AI agents, analytics, routing, channel management across messaging and web
    - Broad CRM seat spend, generic software-development tools, undifferentiated CPaaS volume
    - CX, digital-channel, commerce, support, and operations leaders
    - This is the product layer Blip actually sells into
  - - Conversational commerce workflow
    - Catalogs, cart recovery, product recommendations, order assistance, payment handoff inside messaging
    - All ecommerce GMV and marketplace take rate outside messaging-led workflows
    - Growth, ecommerce, CRM, and sales owners
    - Captures the revenue-oriented wedge most relevant to retail and fintech use cases
  - - Customer-care automation
    - FAQ automation, triage, routing, notifications, appointment support, post-sale service
    - All call-center labor, all ticketing software, pure email support tools
    - Support operations, CX, service leaders
    - Explains why support budgets can fund adoption alongside growth budgets
  - - Regulated-service workflows
    - Banking service, healthcare scheduling, documentation-heavy service interactions, secure notifications
    - Core banking systems, EMR systems, underwriting engines, every regulated product balance
    - BFSI, healthcare, and public-service operators
    - Regulated workflows raise value and compliance complexity at the same time
  - - Status-quo substitutes
    - Native Meta or WhatsApp tooling, web checkout, call-center or BPO teams, in-house bots, generic chat widgets
    - —
    - Existing budget owners keep these tools until ROI for Blip is proven
    - Blip often competes against “good enough” incumbency rather than a blank-sheet budget
  notes: 'Boundary is intentionally narrow: the chapter sizes messaging-led conversational software and workflow spend, not all digital commerce, all customer-support labor, or all messaging traffic.'
