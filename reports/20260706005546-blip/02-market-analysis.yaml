    - stage: Pilot
      label: Single workflow pilot in support, marketing, or commerce
      value: 68
    - stage: Integration
      label: CRM, payments, analytics, or knowledge-base integration
      value: 44
    - stage: Automation
      label: AI workflows plus human handoff designed and approved
      value: 29
    - stage: Expansion
      label: More than one functional team funding additional use cases
      value: 17
    - stage: Scaled program
      label: Enterprise rollout with ongoing services and optimization
      value: 9
  approximationNotes: Values are directional percentages used to show friction points, not measured funnel conversion data. The relative drop-offs are anchored to Twilio deployment maturity, WhatsApp policy requirements, and Blip’s own services-heavy deployment model.
