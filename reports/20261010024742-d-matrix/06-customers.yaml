chapter:
  number: 6
  title: "Customers"
  summary: "d-Matrix targets enterprise datacenters and hyperscalers seeking scalable, low-latency generative AI inference across Corsair accelerators and upcoming Raptor XPUs. While commercial validation is evidenced by strategic ecosystem partnerships and disclosed deployments such as server integrations with Supermicro and global expansion banking with J.P. Morgan, verified customer metrics including ARR, customer counts, NRR, and renewal cohorts remain undisclosed. The company's adoption strategy relies heavily on hyperscaler qualification and ecosystem leverage through the NVIDIA NVLink Fusion initiative alongside SquadRack reference architectures."
sections:
  - id: "customer-segmentation-and-target-buyers"
    title: "Customer Segmentation and Target Buyers"
    body: |
      d-Matrix addresses three primary customer segments facing severe operational and economic bottlenecks in running large-scale generative AI inference workloads: enterprise IT and private datacenter operators, hyperscalers and tier-2 cloud service providers, and sovereign AI infrastructure initiatives. The fundamental value proposition across these segments centers on overcoming the memory-wall constraint in generative token generation. By co-locating digital matrix compute directly on the memory fabric, d-Matrix delivers ultra-low interactive latency while significantly curtailing power draw and rack space compared to conventional GPU clusters.

      Enterprise datacenter buyers prioritize predictable total cost of ownership (TCO) and drop-in integration within standard server envelopes. For these customers, the Corsair accelerator card provides PCIe form-factor deployment supported by the Aviator SDK, avoiding custom datacenter facility redesigns. Conversely, hyperscalers and cloud service providers evaluate inference accelerators on batch throughput, multi-tenant isolation, and cluster-scale networking interconnects. The strategic agreement with NVIDIA to integrate the upcoming Raptor XPU into NVLink Fusion and MGX modular rack ecosystems represents a pivotal alignment with hyperscaler procurement practices, allowing cloud operators to deploy specialized inference compute without dismantling standardized rack architectures.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "adoption-trajectory-and-deployment-proof"
    title: "Adoption Trajectory and Deployment Proof"
    body: |
      Publicly verified proof of commercial adoption at d-Matrix demonstrates tangible commercialization momentum accompanied by strict disclosure boundaries. The company began shipping its initial inference processors and commercial hardware platforms following its Series B funding round, and co-founder and CEO Sid Sheth confirmed that d-Matrix has successfully generated commercial revenue over the past two years. Furthermore, global banking partner J.P. Morgan Startup Banking verified that d-Matrix has utilized its cross-border commercial banking and treasury infrastructure to scale operations across five global sites and multiple international markets.

      Hardware deployment proof is anchored by key original equipment manufacturer (OEM) and reference architecture partnerships. Super Micro Computer has integrated d-Matrix accelerators into enterprise server platforms, providing certified hardware systems for enterprise machine learning pipelines. Furthermore, d-Matrix co-developed the SquadRack open-standards reference architecture alongside Arista Networks, Broadcom, and Supermicro to support multi-accelerator datacenter deployments. Nevertheless, production-scale reference accounts, specific customer logos in continuous live production, and volume delivery schedules for next-generation platforms remain tightly guarded private company data.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
      - "TU003"

  - id: "retention-expansion-and-concentration-risks"
    title: "Retention, Expansion, and Concentration Risks"
    body: |
      The customer durability and expansion profile of d-Matrix is defined by the unique economics and qualification cycles of datacenter semiconductor procurement. In hardware-accelerated infrastructure, initial customer engagements typically start as developer evaluations or pilot deployments using small node counts. Once an accelerator is qualified for specific model families—such as interactive Llama 70B serving—expansion occurs via rack-scale infrastructure orders. d-Matrix's Aviator software layer is codesigned to minimize switching friction by offering PyTorch-compatible programming interfaces alongside low-level custom kernel execution.

      Crucially, significant commercial and platform concentration risks surround d-Matrix's go-to-market trajectory. Although the NVLink Fusion agreement provides a direct distribution channel into NVIDIA's expansive rack ecosystem, it simultaneously introduces acute platform dependency on NVIDIA's proprietary interconnect standards and architectural roadmap. Additionally, with Raptor silicon scheduled to tape out before the end of 2026 and integrated MGX systems targeted for initial availability in the fourth quarter of 2027, commercial engagements for next-generation systems represent forward-looking roadmap commitments rather than realized production revenue. In the absence of audited retention, customer concentration ratios, and backlog disclosures, investors must treat volume commercialization as an ongoing diligence gap.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"

