evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Audited revenue or ARR, gross margin, customer count, concentration, pricing, cash balance and runway.
    whyItMatters: Funding and valuation cannot establish commercial traction, capital efficiency or financing durability.
    diligencePath: >-
      Request audited financials, monthly KPI cohorts, customer-level revenue bridge, bank statements and the current
      operating plan.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive and board roster, cap table, investor ownership, security rights, succession plans and
      delegated authorities.
    whyItMatters: Founder dependence and financing participation do not reveal actual control, oversight or continuity protections.
    diligencePath: >-
      Obtain the charter, bylaws, voting agreements, board minutes, fully diluted cap table and key-person succession
      materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent evidence covering material litigation, regulatory actions, outages, security incidents and failed
      customer deployments.
    whyItMatters: An empty allocated adverse-query result does not prove that incidents or disputes are absent.
    diligencePath: >-
      Run jurisdictional court, regulator, security-notice, customer-reference and incident-log checks before investment
      committee review.
    relatedQuestionRefs:
      - QO010
  - type: conflicting-data
    severity: material
    topic: tam-methodology-variance
    missingEvidence: >-
      Reconciled bottom-up census of datacenter inference server sockets and dedicated decode accelerator attach rates
      across hyperscalers.
    whyItMatters: >-
      Independent analyst estimates for 2030 AI silicon spending diverge widely from $76.7B (Chronicle Journal /
      Tokenring) to $323.1B (StartEngine / PitchBook) and $546.0B (Futurum Group), reflecting differing definitions of
      chip scope and workload boundaries.
    diligencePath: >-
      Audit cloud service provider capital expenditure disclosures and server build telemetry from major ODMs (Foxconn,
      Quanta, Wiwynn) to isolate decode-socket procurement budgets.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-switching-costs-and-contract-pricing
    missingEvidence: >-
      Audited customer procurement contracts, realized hardware discount structures, and named enterprise multi-homing
      deployment data comparing d-Matrix Corsair to Nvidia and Groq.
    whyItMatters: >-
      Without realized contract pricing and switching friction metrics, underwriting depends on vendor-claimed
      efficiency metrics rather than proven enterprise purchasing commitments.
    diligencePath: >-
      Request customer references, customer pilot evaluations, realized bill-of-materials pricing sheets, and
      multi-homing benchmark reports under confidential diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Customer contracts showing product-level list price, realized price, billing unit, discounts, term, support, and
      revenue-recognition treatment.
    whyItMatters: >-
      Without contract economics, the product architecture cannot be translated into revenue quality, recurring mix, or
      gross-margin expectations.
    diligencePath: >-
      Review representative signed contracts, invoices, deferred-revenue schedules, and the revenue-recognition policy
      under NDA.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
