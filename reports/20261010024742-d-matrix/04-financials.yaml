company:
  name: "d-Matrix"
chapter:
  number: 4
  title: "Financials"
  summary: "d-Matrix has financed a full-stack inference platform with a $275 million Series C at a reported $2 billion valuation, but public sources disagree on cumulative funding and do not disclose current revenue, pricing, gross margin, cash, burn, or runway. The financial case therefore rests on historical management targets and product-efficiency claims rather than underwritable operating results."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model is visible at the product layer, not the contract layer"
    body: >-
      The commercial offering combines Corsair inference accelerators, JetStream networking,
      and Aviator software, but the retained evidence does not show how consideration is
      allocated among those components. Public materials describe a full-stack platform and
      large-scale deployments rather than a disclosed price list, billing unit, contract
      duration, or revenue-recognition policy. Corsair is presented in an industry-standard
      PCIe form factor, which makes a hardware sale plausible, while Aviator could be bundled
      enablement rather than separately recurring software; neither conclusion can be treated
      as a reported revenue mix. Underwriting should therefore avoid assigning SaaS-like
      recurring revenue or software margins until contracts, invoices, and accounting policies
      establish what customers buy and when revenue is recognized.
    claimRefs:
      - "CI001"
      - "CI012"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "go-to-market-and-economic-promise"
    title: "The sales proposition is economic, but the economics remain company-claimed"
    body: >-
      d-Matrix says the platform is intended for hyperscale, enterprise, and sovereign
      customers, implying a concentrated, technically demanding infrastructure sale rather
      than a self-serve motion. The company claims tenfold faster performance, threefold lower
      cost, and three-to-fivefold better energy efficiency than GPU-based systems. Those claims
      explain the buyer value proposition and could support premium hardware economics if they
      persist in customer workloads, but the evidence set contains no realized average selling
      price, sales-cycle data, proof-of-concept conversion rate, channel take rate, support
      burden, or customer-level total-cost analysis. The bridge from workload value to revenue
      and gross profit is therefore a diligence framework, not a quantified forecast.
    claimRefs:
      - "CI002"
      - "CI011"
      - "CI016"
    figureRefs:
      - "FI001"
  - id: "traction-and-capital-adequacy"
    title: "Financing is substantial; capital adequacy is still unproven"
    body: >-
      The strongest public financial event is the November 2025 Series C: multiple sources
      report $275 million raised at a $2 billion valuation. The company-issued release says
      cumulative funding reached $450 million and that the new money would support the roadmap,
      global expansion, and multiple large-scale deployments. Two market-data sources instead
      report $476 million and about $500 million, so even the cumulative funding denominator
      requires cap-table reconciliation. More importantly, funding raised is not cash
      available. None of the retained sources provides cash on hand, monthly burn, committed
      foundry or packaging payments, acquisition consideration, debt, working-capital needs, or
      runway. The financing can fund execution, but it does not by itself establish solvency
      through commercial breakeven.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"
  - id: "financial-verdict"
    title: "Financial verdict: promising value proposition, insufficient underwriting data"
    body: >-
      A 2023 report attributed to management a projection of less than $10 million of revenue
      that year, followed by a target of more than $70 million to $75 million in annual revenue
      within two years and breakeven on the same horizon. Those statements are historical
      forecasts, not evidence that either milestone was achieved. The retained current sources
      do not disclose recognized revenue, ARR, gross margin, cash burn, or runway. EquityZen
      also flags heavy capital requirements and competition from incumbents with much larger
      balance sheets and developer ecosystems. The investment case may improve if production
      deployments convert to repeat orders at defensible margins, but current public evidence
      cannot support a revenue-quality, margin-path, or capital-adequacy conclusion.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI013"
      - "CI016"
