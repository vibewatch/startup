callouts:
  - calloutType: "insight"
    title: "The Decode vs. Prefill Economic Divide"
    body: "Inference workloads exhibit a fundamental split between compute-heavy prefill phases that favor raw GPU floating-point operations and memory-bound decode token generation that suffers from severe memory-wall bottlenecks. By specializing in decode-phase acceleration via digital in-memory compute, d-Matrix addresses the primary cost and latency driver without attempting to displace incumbent GPUs from prefill clustering."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
  - calloutType: "risk"
    title: "Power Availability and Ecosystem Switching Inertia"
    body: "Despite superior energy efficiency per token, adoption of specialized inference silicon faces headwinds from datacenter power rationing and ecosystem lock-in. With up to 40% of AI facilities projected to encounter power ceilings by 2027 and financial backers scrutinizing enterprise ROI, hardware deployments depend heavily on seamless interoperability through standard PCIe trays and NVLink interconnects."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
