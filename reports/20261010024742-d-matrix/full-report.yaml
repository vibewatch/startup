  - id: TE003
    title: Platform Subsystems, Dependencies & Technical Risk Matrix
    columns:
      - Architecture Subsystem
      - Primary Technical Role
      - Critical Hardware / Software Dependency
      - Primary Failure Mode & Diligence Risk
    rows:
      - - Digital In-Memory Compute (DIMC)
        - Arithmetic MAC logic woven directly into 64x64 SRAM bitcells
        - Standard CMOS logic foundry process (TSMC)
        - SRAM scaling stagnation, silicon die area overhead (3,200 mm² per card), and reticle limit constraints
      - - DMX Link Die-to-Die Interconnect
        - Low-latency, all-to-all chiplet communication within organic substrate package
        - Custom physical layer based on OCP ODSA standards
        - Cross-chiplet routing congestion, packaging yield loss, and latency penalties when scaling beyond 8 chiplets
      - - Raptor 3DIMC Stacking Subsystem
        - Vertical stacking of DRAM die over SRAM logic die via TSVs for next-generation XPUs
        - Advanced 3D packaging foundry integration and custom DRAM wafer supply
        - >-
          Thermal hot spots from stacking active memory over logic die; tape-out slip beyond 2026 and Q4 2027 delivery
          risk
      - - NVLink Fusion & MGX Rack Integration
        - Scale-up interface connecting d-Matrix XPUs into NVIDIA rack infrastructure alongside Vera CPUs
        - NVIDIA NVLink Fusion ecosystem, Astera Labs retimers, and NVIDIA MGX modular tray standards
        - >-
          Platform dependency on NVIDIA roadmap timing, proprietary interface licensing, and potential partner channel
          conflict
    notes: >-
