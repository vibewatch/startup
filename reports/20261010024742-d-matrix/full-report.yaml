  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Rapid tier-1 hyperscaler production rollout; Wallaroo software accelerates ARR past $150M; Corsair/JetStream
          widely adopted
        - 15x-20x forward multiple yielding $3.0B-$4.5B valuation (1.5x-2.25x return potential on Series C baseline)
        - Foundry capacity allocation constraints and aggressive competitive GPU discounting from Nvidia
        - 20% probability; contingent on confirmed hyperscaler volume purchase agreements
      - - Base Case
        - >-
          Selective enterprise and tier-2 cloud adoption; ARR reaches $30M-$60M; moderate integration delays with
          GigaIO/Wallaroo
        - 8x-12x forward multiple supporting $1.5B-$2.2B valuation (1.0x-1.1x return potential; holding value)
        - Prolonged enterprise proof-of-concept conversion cycles and ongoing software maintenance overhead
        - 55% probability; reflects current market conditions and commercialization pace
      - - Bear Case
        - >-
          Enterprise pilots fail to scale into volume deployments; Wallaroo customer churn; Nvidia NVLink ecosystem
          locks out independent margin
        - Severe valuation down-round to $500M-$800M (downside loss of 60%-75% from Series C valuation mark)
        - Runway exhaustion requiring dilutive recapitalization or distressed platform sale to a legacy hardware vendor
        - 25% probability; elevated risk given high hardware burn and aggressive private valuation targets
    notes: >-
      Scenario assumptions model 24-month horizon based on comparable semiconductor and enterprise infrastructure
      multiples.
