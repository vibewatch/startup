      - number: '5.3'
        title: Aviator Software SDK, Block Floating Point & NVLink Fusion Rack Integration
        blocks:
          - type: paragraph
            body: >-
              Software co-design and ecosystem compatibility determine accelerator viability in modern datacenter
              environments. The Aviator software SDK serves as the primary software interface for the platform, offering
              PyTorch-compatible abstractions alongside low-level graph compilation and custom kernel dispatch to
              minimize developer onboarding friction. To optimize arithmetic density and memory footprint, Corsair
              natively supports Open Compute Project (OCP) Microscaling (MX) Block Floating Point numerical formats,
              executing MXINT8 at 2,400 TFLOPs and MXINT4 at 9,600 TFLOPs of peak dense compute per card. In September
              2026, d-Matrix announced a multi-year integration roadmap with NVIDIA to connect next-generation inference
              processors into NVIDIA's MGX rackscale architecture via NVLink Fusion. This rack-level architecture
              features NVIDIA Vera CPUs, BlueField-4 DPUs, ConnectX-9 SuperNICs, and Astera Labs PCIe retimers, enabling
              heterogeneous disaggregation where NVIDIA GPUs manage compute-heavy prefill phases while d-Matrix XPUs
              handle latency-sensitive token decode.
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
              - CE013
