  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for AI inference accelerators is demarcated by the fundamental architectural requirements of
              production machine learning deployment as opposed to frontier model pre-training. d-Matrix defines its
              addressable market boundary around enterprise and cloud datacenter server racks executing generative AI
              and transformer-based inference. Included within this addressable spend are dedicated PCIe accelerator
              cards, chiplet-based digital in-memory compute modules, specialized rack-scale scale-up interconnect
              fabrics, and inference compilation software licenses. Conversely, the market excludes capital allocated
              toward general-purpose GPU clusters optimized exclusively for model training, consumer edge devices, and
              generic CPU enterprise hosting that does not run large-scale transformer workloads. The status-quo
              substitute remains dense clusters of NVIDIA H100 and Blackwell GPUs, which dominate existing datacenter
              allocations despite suffering from extreme energy consumption and memory-wall bottlenecks during
              interactive token generation. By delivering compute-dense accelerators that allow operators to execute
              models up to 100 billion parameters within a single server rack, d-Matrix aims to carve out a specialized
              decode tier within standard enterprise datacenters.
            claimRefs:
              - CM006
              - CM008
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM008
              - CM013
      - number: '2.2'
        title: Market Sizing Lenses, TAM Projections, and Segment Forecasts
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for d-Matrix requires analyzing multiple sizing lenses, as research
              methodologies diverge significantly in their classification of AI silicon. According to Futurum Group's 1H
              2026 AI chipset forecast, agent- and reasoning-first inference silicon spending is projected to grow from
              $35.9 billion in 2025 to $546.0 billion by 2030, overtaking pre-training as the largest datacenter
              workload category by 2027. Within this broader landscape, the specialized XPU sub-market where d-Matrix
              competes is expected to expand from $37.4 billion to $237.2 billion over the same five-year window.
              Independent investment disclosures from StartEngine cite baseline forecasts placing the aggregate AI chip
              market at $323.1 billion by 2030, while more conservative hardware industry projections from Tokenring and
              Chronicle Journal report an addressable hardware base of $76.7 billion by 2030 and $231.8 billion by 2035.
              d-Matrix's serviceable addressable market focuses on heterogeneous datacenter racks requiring low-latency
              decode acceleration, where next-generation Raptor XPUs are scheduled to enter commercial availability
              through NVIDIA MGX reference systems in Q4 2027.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
