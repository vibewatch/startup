          - type: paragraph
            body: >-
              The public leadership evidence centers on two co-founders: Sid Sheth as chief executive and Sudeep Bhoja
              as chief technology officer. Their shared Inphi background is relevant founder-market fit because the
              company says their prior work exposed them to datacenter interconnect demand across large cloud providers
              before they formed d-Matrix. It also creates visible key-person concentration across capital formation,
