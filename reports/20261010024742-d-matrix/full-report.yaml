            title: Severe Commercial Concentration and Roadmap Execution Risks
            body: >-
              With Raptor MGX systems slated for availability in late 2027 and customer metrics such as ARR, active
              account counts, and NRR remaining unstated, commercial valuation depends heavily on multiyear execution
              milestones and potential platform lock-in with NVIDIA's rack architecture.
