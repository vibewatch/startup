  - id: TE002
    title: Inference Workload & Operational Use-Case Mapping
    columns:
      - Operational Job
      - Conventional GPU Workflow
      - d-Matrix Platform Solution
      - Claimed Operational Benefit
      - Operational Limitation & Diligence Risk
    rows:
      - - Interactive LLM Token Generation
        - High-cost HBM GPUs (H100/B200) executing memory-bandwidth-bound decode loops
        - Corsair DIMC Performance Memory serving weights from on-chip SRAM at 150 TB/s
        - Up to 10x faster token generation and 2ms per token on 70B models
        - 2 GB SRAM per card limits full on-chip execution to smaller models or requires massive card counts
      - - Disaggregated Inference (Prefill vs Decode)
        - Single GPU architecture handling compute-bound prefill and bandwidth-bound decode with inefficient utilization
        - >-
          NVIDIA GPUs handle compute-heavy prefill; Corsair or Raptor XPUs handle latency-critical decode via NVLink
          Fusion
        - Optimized TCO by matching hardware architecture to specific inference phase requirements
        - Cross-vendor pipeline orchestration complexity and inter-system PCIe/NVLink data transfer latencies
      - - High-Throughput Offline Batching
        - Large clusters of general-purpose GPUs processing large batch queues with high power consumption
        - Corsair operating in Capacity Mode using up to 256 GB board-level LPDDR5 memory
        - Up to 3x lower cost-performance and 3-5x improved energy efficiency over traditional GPUs
        - LPDDR5 memory bandwidth is substantially lower than SRAM, forfeiting ultra-low token latency
      - - Agentic AI & Real-Time Voice Services
        - GPU servers struggling with erratic burst requests, strict interactive SLAs, and multi-tenant context switches
        - SquadRack and MGX rackscale modular trays deploying low-latency decode engines close to networking
        - Sub-human response latency enabling seamless multi-turn voice agents and real-time coding assistants
        - Requires custom model compilation via Aviator; lacks plug-and-play drop-in parity with CUDA ecosystem
    notes: >-
      Workload optimizations and token velocity metrics reflect vendor-claimed performance profiles; disaggregated
      prefill/decode requires integration with host GPU infrastructure and verified scheduling runtimes.
    claimRefs:
      - CE001
