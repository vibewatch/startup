      - number: '6.3'
        title: Retention, Expansion, and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              The customer durability and expansion profile of d-Matrix is defined by the unique economics and
              qualification cycles of datacenter semiconductor procurement. In hardware-accelerated infrastructure,
              initial customer engagements typically start as developer evaluations or pilot deployments using small
              node counts. Once an accelerator is qualified for specific model families—such as interactive Llama 70B
              serving—expansion occurs via rack-scale infrastructure orders. d-Matrix's Aviator software layer is
              codesigned to minimize switching friction by offering PyTorch-compatible programming interfaces alongside
              low-level custom kernel execution.


              Crucially, significant commercial and platform concentration risks surround d-Matrix's go-to-market
              trajectory. Although the NVLink Fusion agreement provides a direct distribution channel into NVIDIA's
              expansive rack ecosystem, it simultaneously introduces acute platform dependency on NVIDIA's proprietary
              interconnect standards and architectural roadmap. Additionally, with Raptor silicon scheduled to tape out
              before the end of 2026 and integrated MGX systems targeted for initial availability in the fourth quarter
              of 2027, commercial engagements for next-generation systems represent forward-looking roadmap commitments
              rather than realized production revenue. In the absence of audited retention, customer concentration
              ratios, and backlog disclosures, investors must treat volume commercialization as an ongoing diligence
              gap.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
