  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Corporate Structure Risks
        blocks:
          - type: paragraph
            body: >-
              d-Matrix operates as a dual-entity venture with core corporate operations in Santa Clara, California, and
              an engineering subsidiary in India, D-MATRIX INDIA PRIVATE LIMITED. This distributed operational footprint
              exposes the company to cross-border intellectual property management, foreign subsidiary compliance, and
              multi-jurisdiction labor regulations. As d-Matrix prepares Corsair accelerators and JetStream networking
              hardware for international enterprise and sovereign datacenter deployments, export control classifications
              and high-performance compute trade restrictions represent critical regulatory checkpoints. While the
              company has avoided public patent litigation or formal regulatory enforcement actions to date, scaling
              advanced AI silicon globally requires strict adherence to international commercial standards and proactive
              compliance monitoring. Additionally, external automated filing retrieval encounters noise from academic
              matrix completion literature.
            claimRefs:
              - CR001
