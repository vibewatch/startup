    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              d-Matrix was founded in 2019 and identified Santa Clara, California as its headquarters in its November
              2025 financing announcement. The company describes a full-stack inference platform spanning Corsair
              accelerator cards, JetStream networking and Aviator software, with memory-centric compute intended to
              reduce data movement during inference. This is a focused AI-infrastructure business rather than a
              general-purpose model vendor. As of November 2025, the company reported more than 250 employees worldwide
              and offices in Toronto, Sydney, Bangalore and Belgrade in addition to Santa Clara. Those scale figures are
              company-issued snapshots, not independently audited current counts. A January 2025 founder interview said
              d-Matrix had generated revenue during the preceding two years but supplied no revenue, ARR, customer-count
              or margin value.
