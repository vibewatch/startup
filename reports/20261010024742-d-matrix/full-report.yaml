        title: Exhibits
        blocks:
          - type: callout
            title: Ecosystem Leverage Bypasses Datacenter Facility Redesign
            body: >-
              d-Matrix's dual-track hardware approach—offering PCIe-compatible Corsair accelerators today while
              codesigning next-generation Raptor XPUs for NVIDIA NVLink Fusion racks—allows customers to adopt
              digital-in-memory compute without rebuilding electrical, thermal, or networking infrastructure. This
              pragmatic strategy lowers initial procurement hurdles for datacenter operators.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
