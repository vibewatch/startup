      - number: '5.4'
        title: Technical Differentiation, Scalability Boundaries & Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              While d-Matrix reports significant energy efficiency benefits—claiming 0.3 picojoules per bit for on-chip
              SRAM compute versus 3.0 picojoules per bit for HBM-based GPUs—several critical engineering, yield, and
              deployment boundaries require rigorous investor diligence. The physical scaling stagnation of SRAM
              bitcells constrains on-chip memory to 2 GB per card, forcing hyperscalers running 70B+ parameter models to
              deploy multi-card clusters or accept the performance penalty of LPDDR5 capacity memory. Furthermore,
              d-Matrix's next-generation Raptor processor relies on vertical 3D DRAM-over-logic stacking via
              through-silicon vias (TSVs), introducing severe thermal dissipation challenges and advanced packaging
              yield uncertainties ahead of its targeted Q4 2027 commercial availability. Crucially, public performance
              metrics currently rest entirely on vendor whitepapers and simulated projections; independent third-party
              MLPerf benchmark audits, multi-tenant enterprise SOC 2 compliance certifications, and production customer
              reliability data remain unverified.
            claimRefs:
              - CE008
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Architectural Trade-Off: SRAM Bandwidth vs. Memory Density'
            body: >-
              By integrating compute directly into SRAM bitcells, d-Matrix achieves an unprecedented 150 TB/s of memory
              bandwidth per card, enabling ultra-fast token decode. However, because SRAM is physically sparse (yielding
              only 2 GB per card across 3,200 mm² of silicon), large models cannot reside entirely on-chip,
              necessitating either large cluster footprints or hybrid reliance on slower off-chip LPDDR5 capacity
              memory.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
          - type: callout
            title: Ecosystem Interoperability and 3D Packaging Hurdles
            body: >-
              While the September 2026 NVIDIA NVLink Fusion and MGX collaboration grants d-Matrix a credible rackscale
              path into tier-one datacenters, commercial execution hinges on two unverified milestones: timely tape-out
              and thermal validation of Raptor's 3D DRAM-over-logic stacked silicon, and market willingness to adopt
              semi-custom silicon without third-party MLPerf benchmark verification.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Target Buyers
        blocks:
          - type: paragraph
            body: >
              d-Matrix addresses three primary customer segments facing severe operational and economic bottlenecks in
              running large-scale generative AI inference workloads: enterprise IT and private datacenter operators,
              hyperscalers and tier-2 cloud service providers, and sovereign AI infrastructure initiatives. The
              fundamental value proposition across these segments centers on overcoming the memory-wall constraint in
              generative token generation. By co-locating digital matrix compute directly on the memory fabric, d-Matrix
              delivers ultra-low interactive latency while significantly curtailing power draw and rack space compared
              to conventional GPU clusters.


              Enterprise datacenter buyers prioritize predictable total cost of ownership (TCO) and drop-in integration
              within standard server envelopes. For these customers, the Corsair accelerator card provides PCIe
              form-factor deployment supported by the Aviator SDK, avoiding custom datacenter facility redesigns.
              Conversely, hyperscalers and cloud service providers evaluate inference accelerators on batch throughput,
              multi-tenant isolation, and cluster-scale networking interconnects. The strategic agreement with NVIDIA to
              integrate the upcoming Raptor XPU into NVLink Fusion and MGX modular rack ecosystems represents a pivotal
              alignment with hyperscaler procurement practices, allowing cloud operators to deploy specialized inference
              compute without dismantling standardized rack architectures.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
