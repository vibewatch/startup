  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio, Hardware Accelerators & Commercial Form Factors
        blocks:
          - type: paragraph
            body: >-
              d-Matrix delivers a purpose-built AI inference compute platform engineered to accelerate generative AI
              workloads in standard enterprise and hyperscale datacenters. The company's hardware portfolio centers on
              Corsair, a full-height, full-length (FHFL) PCIe Gen5 x16 accelerator card that houses 3,200 mm² of silicon
              across eight modular chiplets on an organic substrate. To support scalable datacenter deployments without
              requiring exotic liquid-cooling infrastructure, Corsair is designed for standard air-cooled server
              enclosures with a 600W thermal design envelope. For larger models, d-Matrix pairs two Corsair cards via a
              top-mounted DMX Bridge card into a dual-card configuration that integrates 16 chiplets into a coherent
              accelerator complex. Scale-out connectivity across server chassis and top-of-rack leaf switches is handled
              by d-Matrix's JetStream network interface cards, which stream model activations over standard datacenter
              Ethernet without necessitating dedicated InfiniBand fabrics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE012
      - number: '5.2'
        title: Digital In-Memory Compute Architecture & Dual-Tier Memory Subsystems
        blocks:
          - type: paragraph
            body: >-
              At the architectural core of the Corsair platform is Digital In-Memory Compute (DIMC), an approach that
              addresses the memory wall inherent in traditional Von Neumann accelerator architectures. Rather than
              relying on separate High Bandwidth Memory (HBM) stacks connected through costly silicon interposers,
              d-Matrix embeds arithmetic multiplication and accumulation logic directly into 64x64 SRAM bitcell arrays
              using standard TSMC CMOS logic processes. This tight physical coupling yields 2 GB of integrated on-chip
              Performance Memory per card delivering an aggregate memory bandwidth of 150 TB/s—an order of magnitude
              higher than conventional HBM3 implementations. Because pure SRAM remains cost-prohibitive for storing
              massive multi-billion parameter weights, Corsair implements a dual-tier memory hierarchy by placing up to
              256 GB of board-level LPDDR5 Capacity Memory alongside the compute dies. Through the Aviator software
              runtime, workloads operate in either Performance Mode for latency-critical decode phases or Capacity Mode
