  - id: FP001
    title: 'Competitive Positioning Map: Architectural Focus vs. Deployment Ecosystem Flexibility'
    type: quadrant
    summary: >-
      Ordinal mapping of AI inference solutions evaluating compute-memory integration against datacenter deployment
      flexibility.
    data:
      points:
        - label: d-Matrix Corsair
          x: 8.5
          'y': 7.5
          note: High DIMC memory-compute integration with open standard PCIe brownfield deployment
        - label: Nvidia GPUs (H100/B200)
          x: 4.5
          'y': 9
          note: External HBM architecture with dominant CUDA ecosystem and widespread cloud availability
        - label: Groq LPU
          x: 8
          'y': 5.5
          note: High on-chip SRAM integration but requires dedicated appliance density or cloud API
        - label: Cerebras CS-3
          x: 9
          'y': 3.5
          note: Wafer-scale compute-memory integration constrained by specialized liquid-cooled chassis
        - label: Hyperscaler ASICs (TPU/Trainium)
          x: 5
          'y': 4
          note: Custom silicon optimized for captive cloud instances with zero on-prem flexibility
        - label: Fractile (Early DIMC)
          x: 7.5
          'y': 3
          note: In-memory compute concept with early-stage commercial and packaging maturity
        - label: Status-Quo Server CPUs
          x: 2
          'y': 6
          note: Von Neumann architecture with universal datacenter deployment but poor inference throughput
    approximationNotes: >-
      Coordinates reflect qualitative ordinal positioning on a 1-10 scale based on published architectural disclosures
      and standard datacenter packaging compatibility, rather than third-party benchmark scores.
