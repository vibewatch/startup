  - id: FE001
    title: d-Matrix Full-Stack AI Inference System Architecture
    type: stack
    summary: >-
      Six-layer architectural hierarchy spanning custom DIMC silicon, dual-tier memory subsystems, die-to-die and
      rackscale interconnects, the Aviator runtime compiler, and enterprise application interfaces.
    data:
      layers:
        - label: Enterprise Application & Agentic Workflows
          detail: Real-time coding assistants, conversational voice agents, and high-interactivity enterprise LLMs
        - label: Aviator Compiler & Runtime Toolchain
          detail: PyTorch integration, graph compilation, custom kernel dispatch, and OCP MXINT8/MXINT4 quantization
        - label: Network & Scale-Out Fabric Layer
          detail: JetStream PCIe NICs, top-of-rack Ethernet leaf switches, and NVIDIA NVLink Fusion rackscale interconnect
        - label: Dual-Tier Memory Hierarchy Subsystem
          detail: 2 GB on-chip SRAM Performance Memory (150 TB/s) paired with up to 256 GB off-chip LPDDR5 Capacity Memory
        - label: Chiplet Packaging & DMX Link Interconnect
          detail: Eight chiplets per PCIe card on organic substrate with all-to-all DMX Link die-to-die mesh topology
        - label: Digital In-Memory Compute (DIMC) Core Silicon
          detail: 256 DIMC cores per chiplet integrating arithmetic logic directly into 64x64 SRAM bitcells in standard CMOS
    approximationNotes: >-
      Layer hierarchy synthesizes hardware, firmware, and software specifications documented in d-Matrix technical
      whitepapers and NVIDIA MGX partnership announcements.
    claimRefs:
      - CE001
