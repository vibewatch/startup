callouts:
  - calloutType: "insight"
    title: "Strategic Interoperability via NVLink Fusion"
    body: "Rather than pursuing a direct head-on displacement of Nvidia's entire infrastructure stack, d-Matrix has adopted a co-opetition strategy by joining Nvidia's NVLink Fusion ecosystem. By adopting NVLink to interface its Corsair and next-generation Raptor XPUs alongside Nvidia CPUs, DPUs, and networking hardware, d-Matrix significantly reduces datacenter integration friction for enterprise customers operating heterogeneous computing clusters."
    claimRefs:
      - "CP003"
      - "CP013"
  - calloutType: "risk"
    title: "Entrenched Incumbent Software Moat"
    body: "Nvidia's deep moat is cemented by its comprehensive CUDA ecosystem, which represents billions of dollars in enterprise software optimization. Although d-Matrix's Aviator software bridges open frameworks like PyTorch and Triton, customers face operational inertia and perceived switching costs before transitioning mission-critical inference pipelines away from proven GPU runtimes."
    claimRefs:
      - "CP002"
      - "CP014"
