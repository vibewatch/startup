slug: "d-matrix"
runDate: "2026-10-10"
company:
  name: "d-Matrix"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    d-Matrix is a Santa Clara AI-inference silicon company founded in 2019 and led by
    co-founders Sid Sheth and Sudeep Bhoja. Its November 2025 Series C established a
    company-reported $2 billion valuation and $450 million of total funding, but public
    evidence still does not quantify revenue, customer count, ownership terms, or board control.
sections:
  - id: "identity-and-operating-footprint"
    title: "Identity and operating footprint"
    body: >-
      d-Matrix was founded in 2019 and identified Santa Clara, California as its headquarters
      in its November 2025 financing announcement. The company describes a full-stack
      inference platform spanning Corsair accelerator cards, JetStream networking and Aviator
      software, with memory-centric compute intended to reduce data movement during inference.
      This is a focused AI-infrastructure business rather than a general-purpose model vendor.
      As of November 2025, the company reported more than 250 employees worldwide and offices
      in Toronto, Sydney, Bangalore and Belgrade in addition to Santa Clara. Those scale figures
      are company-issued snapshots, not independently audited current counts. A January 2025
      founder interview said d-Matrix had generated revenue during the preceding two years but
      supplied no revenue, ARR, customer-count or margin value.
    claimRefs: ["CO001", "CO002", "CO003", "CO009", "CO010"]
    tableRefs: ["TO001"]
  - id: "founder-led-leadership"
    title: "Founder-led leadership and governance concentration"
    body: >-
      The public leadership evidence centers on two co-founders: Sid Sheth as chief executive
      and Sudeep Bhoja as chief technology officer. Their shared Inphi background is relevant
      founder-market fit because the company says their prior work exposed them to datacenter
      interconnect demand across large cloud providers before they formed d-Matrix. It also
      creates visible key-person concentration across capital formation, product strategy and
      architecture. The assigned evidence does not enumerate the full executive team, board,
      observer rights, succession plan or delegated operating authorities. Investors should
      therefore treat founder continuity and governance depth as open diligence items rather
      than infer institutional controls from the size of the financing syndicate.
    claimRefs: ["CO004", "CO005"]
    tableRefs: ["TO002"]
  - id: "capital-and-stakeholders"
    title: "Capital base and stakeholder structure"
    body: >-
      d-Matrix announced a $275 million Series C in November 2025 at a $2 billion valuation,
      bringing company-reported cumulative funding to $450 million. Independent coverage
      repeated the round size, valuation and cumulative funding, but the public record in this
      evidence set does not disclose whether the valuation is pre-money or post-money, the
      security terms, liquidation preferences, ownership percentages, debt, secondaries or
      board rights. BullhoundCapital, Triatomic Capital and Temasek co-led the round; QIA and
      EDBI joined as new participants, while M12 and several other existing investors followed
      on. In October 2026, GuruFocus reported a planned Nvidia investment, while d-Matrix's
      homepage announced an NVLink Fusion relationship; the amount, security and governance
      implications of that planned investment remain undisclosed.
    claimRefs: ["CO006", "CO007", "CO008", "CO011", "CO016"]
    tableRefs: ["TO003"]
  - id: "execution-history-and-fragility"
    title: "Execution history and disclosed fragility"
    body: >-
      The operating history shows repeated technical and financing pivots rather than a linear
      product path. The founders recount building a first chip in 2020 while coming within two
      weeks of running out of cash, then securing a $40 million Series A in 2021. They describe
      a 2022 shift toward generative Transformer workloads and the Corsair architecture, followed
      by a $110 million Series B in 2023. The later Series C and reported Nvidia interest improve
      strategic optionality, but neither proves repeat production demand or durable economics.
      The adverse record available to this chapter is principally the company's own retrospective
      disclosure; adverse-search queries returned no allocated results, so the absence of an
      independent incident source must not be read as evidence that no legal, regulatory,
      reliability or customer issues exist.
    claimRefs: ["CO012", "CO013", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
