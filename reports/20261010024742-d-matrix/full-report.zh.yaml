      - number: '6.1'
        title: 客户细分与目标买家
        blocks:
          - type: paragraph
            body: >
              d-Matrix 面向三类主要客户：面临大规模生成式 AI 推理运营和经济瓶颈的企业 IT 与私有数据中心运营商、超大规模及二线云服务商，以及主权 AI 基础设施项目。各细分市场的核心价值主张，都是解决生成式
              token 生成中的内存墙约束。d-Matrix 将数字矩阵计算直接放在内存互联上，在相比传统 GPU 集群显著降低功耗和机架空间的同时，实现极低交互延迟。


              企业数据中心买家优先考虑可预测的总拥有成本（TCO）和标准服务器机箱内的即插即用整合。Corsair 加速卡配合 Aviator SDK，支持 PCIe
              形态部署，避免定制数据中心设施改造。相反，超大规模客户和云服务商按批量吞吐量、多租户隔离和集群级网络互联评估推理加速器。与 NVIDIA 达成的战略协议，将即将推出的 Raptor XPU 接入 NVLink
              Fusion 和 MGX 模块化机架生态，是对超大规模采购惯例的重要对齐；云运营商可以部署专用推理计算，而无需拆除标准化机架架构。
