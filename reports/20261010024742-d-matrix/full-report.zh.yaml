          tone: positive
          claimRefs:
            - CO013
        - date: '2022'
          label: 生成式 AI 架构转向
          detail: 客户讨论促使公司重新聚焦生成式 Transformer 工作负载和 Corsair 架构。
          tone: neutral
          claimRefs:
