    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 成立于 2019 年，并在 2025 年 11 月融资公告中将 Santa Clara, California 列为总部。公司称其全栈推理平台覆盖 Corsair 加速卡、JetStream
              网络和 Aviator 软件，采用以内存为中心的计算，旨在减少推理时的数据搬运。这是一家聚焦 AI 基础设施的企业，而非通用模型厂商。截至 2025 年 11 月，公司报告全球员工超过 250 人，除 Santa
              Clara 外还在 Toronto、Sydney、Bangalore 和 Belgrade 设有办公室。这些规模数据是公司发布的快照，并非独立审计的当前人数。2025 年 1
              月的一次创始人访谈称，d-Matrix 在此前两年已产生收入，但未提供收入、ARR、客户数或利润率数据。
