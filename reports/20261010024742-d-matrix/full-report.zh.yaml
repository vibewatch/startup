  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合、硬件加速器与商业形态
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 提供专用 AI 推理计算平台，面向标准企业和超大规模数据中心中的生成式 AI 工作负载。硬件组合以 Corsair 为核心：这是一张全高全长（FHFL）PCIe Gen5 x16
              加速卡，在有机基板上以八个模块化 chiplet 承载 3,200 mm² 芯片。为支持可扩展数据中心部署而无需特殊液冷设施，Corsair 面向标准风冷服务器机箱设计，热设计功耗为
              600W。对更大模型，d-Matrix 通过顶部安装的 DMX Bridge 卡连接两张 Corsair，组成双卡配置，将 16 个 chiplet
              集成为统一加速器复合体。服务器机箱和机架顶部叶交换机之间的横向扩展连接由 d-Matrix 的 JetStream 网卡处理；它们通过标准数据中心 Ethernet 传输模型激活值，无需专用 InfiniBand
              网络。
