            title: 架构权衡：SRAM 带宽与内存密度
            body: >-
              d-Matrix 将计算直接集成进 SRAM bitcell，使每张卡达到前所未有的 150 TB/s 内存带宽，从而实现超快 token decode。但 SRAM 的物理稀疏性使 3,200 mm²
              芯片每卡只能提供 2 GB，大模型无法完全驻留片上，只能采用大型集群，或混用速度更慢的片外 LPDDR5 容量内存。
