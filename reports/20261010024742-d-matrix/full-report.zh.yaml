  - id: FM001
    title: 市场规模视角：AI 推理硬件支出的层级结构
    type: pyramid
    summary: 市场规模从 AI 硬件总支出逐层收窄，直至 d-Matrix 可服务的解码阶段推理市场。
    approximationNotes: >-
      预测综合 Futurum Group 2025–2030 年预测数据、StartEngine 市场披露以及 Tokenring / Chronicle Journal 硬件估算； 自下而上的 SOM
      反映受容量约束的解码加速部署能力。
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM014
    data:
      items:
        - label: AI 硬件总市场（2030 年）
          value: 323.1
          unit: USD B
          detail: 最宽口径的硬件范围，涵盖加速器、内存、网络和系统基础设施
          tone: neutral
        - label: 智能体与推理芯片（2030 年）
          value: 546
          unit: USD B
          detail: Futurum 预测，到 2027 年推理芯片工作负载支出将超过训练支出
          tone: positive
        - label: 专用 XPU 推理子市场（2030 年）
          value: 237.2
          unit: USD B
          detail: 与 GPU 集群直接竞争的定制化和领域专用推理加速器
          tone: opportunity
        - label: 数据中心 LLM 与 Transformer 推理（2026 年）
          value: 35.9
          unit: USD B
          detail: 生成式 AI 推理芯片部署的近期可服务基线
          tone: neutral
        - label: 异构机架解耦（SAM）
          value: 12.5
          unit: USD B
          detail: 适用于 MGX 和 PCIe 服务器部署中模块化解码加速的推理插槽
          tone: opportunity
        - label: 近期可服务可获取市场（SOM）
          value: 1.8
          unit: USD B
          detail: 早期云厂商和企业客户的首批可服务部署，受容量约束
          tone: neutral
  - id: FP001
    title: 竞争定位图：架构重点与部署生态灵活性
    type: quadrant
    summary: 以序数方式对 AI 推理方案进行定位，比较计算与内存整合程度以及数据中心部署灵活性。
    data:
      points:
        - label: d-Matrix Corsair
          x: 8.5
          'y': 7.5
          note: DIMC 存算高度整合，支持开放标准 PCIe 存量环境部署
        - label: Nvidia GPU（H100 / B200）
          x: 4.5
          'y': 9
          note: 外置 HBM 架构，拥有主导性的 CUDA 生态和广泛的云端可用性
        - label: Groq LPU
          x: 8
          'y': 5.5
          note: 片上 SRAM 高度整合，但需要专用设备密度或云 API
        - label: Cerebras CS-3
          x: 9
          'y': 3.5
          note: 晶圆级计算与内存整合，但受专用液冷机箱限制
        - label: 超大规模云厂商 ASIC（TPU / Trainium）
          x: 5
          'y': 4
          note: 为封闭云实例优化的定制芯片，不具备本地部署灵活性
        - label: Fractile（早期 DIMC）
          x: 7.5
          'y': 3
          note: 存内计算概念，商业化和封装成熟度仍处早期
        - label: 现有服务器 CPU
          x: 2
          'y': 6
          note: 冯·诺依曼架构，可普遍部署于数据中心，但推理吞吐能力较弱
    approximationNotes: 坐标基于公开架构披露和标准数据中心封装兼容性，对 1–10 量表进行定性序数定位，而非第三方基准分数。
    claimRefs:
      - CP012
      - CP013
  - id: FI001
