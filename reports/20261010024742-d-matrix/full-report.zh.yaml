          - type: paragraph
            body: >-
              将半导体硬件从试点芯片扩展到商业批量，带来严重运营和制造风险。d-Matrix 依赖先进晶圆厂封装和第三方半导体制造，把数字内存计算架构集成进标准 PCIe 加速卡。CEO Sid Sheth
              报告称，公司在战略转向生成式 Transformer 模型后，前两年已产生商业收入；但公司仍需持续优化 Aviator 软件栈编译器，以克服围绕 Nvidia CUDA
              的开发者锁定。硬件从多芯片原型验证过渡到高可靠、高可用的数据中心工作负载，需要持续验证密集机架级部署中的散热、芯片缺陷密度和互联可靠性。
            claimRefs:
              - CR004
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR013
      - number: '7.3'
        title: 交易对手、生态与竞争集中度
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 的市场进入策略与关键生态伙伴紧密相连，形成显著交易对手依赖。公司已将 SquadRack 参考架构与 Super Micro Computer、Arista 和 Broadcom
              等服务器制造商及网络供应商整合。更重要的是，d-Matrix 已采用 Nvidia 的 NVLink Fusion 互联，把下一代 Raptor 处理器直接连接到 Nvidia AI
              集群。该合作促进机架级互操作并缓解直接平台排斥，但也让 d-Matrix 的产品路线图受制于 Nvidia 的平台标准。此外，公司面临至少 34 家活跃数据中心 AI
              芯片开发商的日益激烈竞争，其中包括资金充足、争夺有限客户试点预算的推理初创企业。
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
      - number: '7.4'
        title: 财务敞口、估值实现与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 以 $2 billion 投后估值完成 $275 million Series C，累计筹得 $450 million，用于硬件开发和客户扩张。但据报道，公司在 2026 年寻求以 $5
              billion
              估值融资，已在收入规模得到验证前抬高了业绩预期。公开披露缺少经审计毛利率、单位生产成本、现金消耗率和客户续约数据。关键论点失效触发点包括晶圆厂合作伙伴严重的封装良率延迟、企业客户在初始生产试点期间流失，或
              Nvidia 战略转向、限制第三方加速器进入 NVLink 生态集群。
            claimRefs:
              - CR001
              - CR009
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 关键论点失效触发点与交易对手集中风险
            body: >-
              d-Matrix 的商业扩张高度依赖在深化与 Nvidia 通过 NVLink Fusion 的协同开发时维持架构中立。若 Nvidia
              的开放平台策略发生重大变化，或封装配额延迟，可能立即损害批量生产和估值里程碑。
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 的核心投资论点，建立在数据中心 AI 推理工作负载的架构颠覆上。传统加速器架构面临严重内存墙：计算核心与内存之间持续搬运数据，消耗大量能源并限制吞吐量。d-Matrix 通过 Corsair
              加速器中的数字内存计算芯片处理这一物理瓶颈，声称在大语言模型上性能最高提升 10x、成本降低 3x、能效提升 3-5x。公司还通过积极的战略收购，从纯芯片组件供应商转向一体化全栈数据中心平台。2026 年 4
              月收购 GigaIO 的数据中心业务后，d-Matrix 获得 FabreX PCIe 内存互联和机架级互联工程；2026 年 8 月收购 Wallaroo.ai 又增加了即用型 AI
              部署和模型编排软件。通过采用 Nvidia NVLink Fusion 互联，d-Matrix 也建立了与主流 GPU 部署共存的务实路径。


              反论点则强调严峻的执行、竞争和估值阻力。推理芯片市场高度拥挤，Tracxn 记录了 34 家活跃竞争者，其中包括 Cerebras、Groq 和专用 ASIC 初创公司等 17 家已融资企业，它们都与
              Nvidia 的主导平台竞争。作为全栈平台竞争，d-Matrix 必须直接面对 Nvidia 根深蒂固的 CUDA 和 Triton 开发者生态。四个月内完成两项收购，会带来严重的并购后整合风险、开发者分心以及
              Wallaroo 既有账户潜在流失。最关键的是，尽管架构主张很有吸引力，公开记录缺少经验证的收入运行率、客户留存数据和单位利润率，因此 $2.0B 估值可能反映资本市场势头，而非持久的商业采用。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: 融资背景、进入纪律与估值立场
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 于 2025 年 11 月 12 日确立对外估值标记，完成 $275 million Series C；该轮融资给公司带来 $2.0 billion 投后估值，并使三轮累计机构股权融资达到
              $450 million。Series C 银团体现出强劲的国际机构和主权支持，由 Bullhound Capital、Triatomic Capital 和 Temasek 共同领投，Qatar
              Investment Authority、新加坡 EDBI、Microsoft 的 M12 风投基金及现有风投支持者参与。该轮之后，The Information 于 2026 年 7
              月的市场报道显示，d-Matrix 正探索目标估值 $5.0 billion 的新融资；随后 2026 年 10 月的报道披露，Nvidia 正计划围绕生态互操作性讨论少数股权投资。


              从进入纪律看，我们认为当前 $2.0 billion 估值偏高，并认为传闻中的 $5.0 billion 目标缺乏锚定。虽然一线银团验证了公司的技术可行性，但公开来源没有披露经审计收入
              收入运行率、年化经常性收入（ARR）、毛利率或活跃生产部署量。在收入生成得到证明前，支付 $2.0 billion 或更高估值，意味着在未经验证的企业客户商业进展上承受异常高的远期倍数。若超大规模客户评估停滞，或
              GPU 竞争性折扣压缩半导体毛利率，在这些价位进入的投资者将面临严重的倍数压缩风险。在商业收入规模得到证实前，资本保全要求维持进入纪律。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
      - number: '8.3'
        title: 情景建模：乐观、基准与悲观情形
        blocks:
          - type: paragraph
            body: >-
              为量化 d-Matrix 在 24 个月期限内经风险调整的回报特征，我们基于现实的企业硬件采用周期和可比基础设施倍数，建模乐观、基准和悲观运营情景。在乐观情景（概率 20%）下，d-Matrix
              成功将试点转化为至少两家超大规模云厂商和多家企业私有云的多兆瓦生产部署。Corsair 卡、JetStream 网络和集成的 Wallaroo 软件规模化后，ARR 超过 $150 million，毛利率超过
              60%。按当前 AI 基础设施远期收入 15x 至 20x 的估值倍数，企业价值扩大至 $3.0B-$4.5B，相对于 C 轮投后估值带来颇具吸引力的 1.5x-2.25x 回报。


              在基准情景（概率 55%）下，d-Matrix 在二线云服务商和企业私有数据中心取得适度商业进展，但超大规模云厂商的部署仍局限于专用评估集群。由于与 Wallaroo 和 GigaIO
              的合并后整合挑战拉长交付周期，ARR 达到 $30 million 至 $60 million。按远期收入 8x 至 12x 的正常化硬件与软件倍数估值，估值稳定在 $1.5B 和 $2.2B 之间，相对于 C
              轮入场价格，持有回报大致持平至小幅增长。在悲观情景（概率 25%）下，由于软件尚不成熟、传统 Wallaroo 客户流失，以及 Nvidia 加速推出低成本 GPU
              产品，企业试点未能转化为批量采购承诺。现金续航期迅速缩短，迫使公司以 $500M-$800M 进行稀释性下轮融资或结构化资本重组，意味着 60% 至 75% 的资本损失。
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 建议立场、尽调要求与论点破坏触发因素
        blocks:
          - type: paragraph
            body: >-
              综合我们的技术、战略和财务发现，我们对 d-Matrix 的投资建议为“进一步研究”，信心程度中等，风险评级高，估值立场偏高。d-Matrix
              通过数字存内计算架构展现了真正的芯片创新，并通过并购整合了战略性的机架级和编排资产。此外，通过 NVLink Fusion 与 Nvidia 的生态对齐降低了近期平台过时风险。然而，完全缺乏可核实的收入
              里程碑、生产部署数据和客户留存指标，使得以 $2.0B 投后估值投入资本具有投机性。当前潜在上行空间尚不足以抵御执行风险和竞争风险，无法提供足够的安全边际。


              在将建议重新评估为积极买入立场之前，潜在投资者必须完成四项强制性尽调要求。第一，取得经审计的财务报表， 确认过去十二个月的商业收入、软件 ARR 以及按产品线划分的毛利率。第二，对传统 Wallaroo
              企业客户和活跃的 Corsair 试点参与者进行客户参考核查，以量化留存率和工作负载满意度。第三，核实与 TSMC 的半导体供应协议
              和晶圆代工分配，以确保交付能力。第四，审查股权结构表条款，确认清算优先权和二级交易定价。相反，明确的论点破坏性否决标准包括：关键创始技术领导层的任何流失；Wallaroo 整合后客户持续流失；Corsair
              芯片在独立生产审计中未达到所称的 3x 能效；或出现低于 C 轮优先权的下轮融资证据。
            claimRefs:
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 图表附件
        blocks:
          - type: callout
            title: 尽调建议：进一步研究
            body: 保持严格的资本纪律，在管理层提供经过核实的客户遥测数据、生产毛利率和经审计的商业 ARR 证明之前， 暂缓直接投资 d-Matrix 的股权。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
          - type: callout
            title: 估值悬置与下轮融资敞口
            body: 公司累计融资 4.5 亿美元，且私募融资讨论目标最高达 50 亿美元；任何数据中心客户转化速度放缓都将威胁 严重的估值下轮融资敞口。
            calloutType: risk
            claimRefs:
              - CV004
              - CV012
