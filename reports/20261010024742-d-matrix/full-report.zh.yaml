      - number: '5.4'
        title: 技术差异化、扩展边界与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              d-Matrix 报告了显著能效优势——芯片上 SRAM 计算每 bit 为 0.3 picojoule，而基于 HBM 的 GPU 为 3.0
              picojoule——但仍有多项工程、良率和部署边界需要严格尽调。SRAM bitcell 的物理扩展停滞把每卡片上内存限制在 2 GB，迫使运行 70B+ 参数模型的超大规模客户部署多卡集群，或接受
              LPDDR5 容量内存的性能损失。此外，d-Matrix 下一代 Raptor 处理器依赖通过硅通孔（TSV）实现的垂直 3D DRAM-over-logic 堆叠，在目标于 2027
              年第四季度商业供应前带来严重散热挑战和先进封装良率不确定性。关键是，当前公开性能指标完全依赖厂商白皮书和模拟预测；独立第三方 MLPerf 基准审计、多租户企业 SOC 2 合规认证和生产客户可靠性数据仍未验证。
            claimRefs:
              - CE008
              - CE010
              - CE014
      - number: '5.5'
