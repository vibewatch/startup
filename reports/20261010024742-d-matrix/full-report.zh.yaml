            - CO005
        - date: '2020'
          label: 首颗芯片落地
          detail: 创始人称，团队在 12 个月内完成首颗芯片的构建和封装，并跑通软件栈。
          tone: positive
          claimRefs:
            - CO012
        - date: '2020'
          label: 现金濒临耗尽
          detail: 公司称，在改变募资方式前，距离现金耗尽只剩两周。
          tone: risk
          claimRefs:
