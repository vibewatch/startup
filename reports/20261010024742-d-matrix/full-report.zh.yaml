  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 分析支柱
      - 核心论点
      - 反论点
      - 哪些事实会改变判断
    rows:
      - - 芯片架构
        - 数字存内计算（DIMC）压缩数据搬运，以 3–5 倍能效和低延迟取胜
        - 超大规模云厂商可能更偏好已有通用 GPU 集群：其开发者软件生态成熟，而非小众芯片
        - 独立第三方生产环境 MLPerf 基准验证持续的数据中心级能效
      - - 全栈平台并购
        - 收购 GigaIO 和 Wallaroo 加快机架级部署，并补齐端到端软件能力
        - 四个月内完成两起收购，可能造成严重的组织整合摩擦和软件开发者流失
        - 证明软件团队留存良好，且 Aviator-Wallaroo 客户部署能够无缝统一
      - - 生态联盟
        - 采用 NVLink Fusion 并与 Nvidia 展开投资洽谈，确立与行业标准共存的关键路径
        - 互操作合作可能使 d-Matrix 从属于 Nvidia 的平台路线图，却无法建立独立定价权
        - 披露商业 OEM 收入分成协议，并保证最低订货量
      - - 估值与财务纪律
        - 快速增长的生成式 AI 推理支出，为高性价比芯片打开巨大的可服务市场
        - 在 20 亿美元估值、商业收入尚未验证的情况下，入场价格体现的是 AI 热潮峰值，而非已实现的现金流
        - 披露经审计的 ARR 超过 5,000 万美元，且毛利率可持续高于 60%
    notes: 将核心价值驱动因素与关键执行、技术和市场风险进行对照，并列出可量化的转向指标。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 一线超大规模云厂商迅速转入生产；Wallaroo 软件推动 ARR 超过 $150M；Corsair / JetStream 获得广泛采用
        - 15x-20x 远期倍数对应 $3.0B-$4.5B 估值（相对 Series C 基线有 1.5x-2.25x 回报潜力）
        - 晶圆厂产能分配受限，以及 Nvidia 激进的 GPU 竞争性降价
        - 20% 概率；取决于确认超大规模云厂商的大额采购协议
      - - 基准情景
        - 企业和二线云厂商选择性采用；ARR 达到 $30M-$60M；GigaIO / Wallaroo 整合出现中度延迟
        - 8x-12x 远期倍数支撑 $1.5B-$2.2B 估值（1.0x-1.1x 回报潜力；持有价值）
        - 企业概念验证转化周期拉长，软件维护开销持续
        - 55% 概率；反映当前市场条件和商业化速度
      - - 悲观情景
        - 企业试点无法扩展为批量部署；Wallaroo 客户流失；Nvidia NVLink 生态将独立利润空间拒之门外
        - 估值大幅下调至 $500M-$800M（相对 Series C 估值标记下跌 60%-75%）
        - 现金续航耗尽，需要稀释性重组或向传统硬件厂商低价出售平台
        - 25% 概率；鉴于硬件烧钱规模大、私募估值目标激进，风险偏高
    notes: 基于可比半导体和企业基础设施倍数，对未来 24 个月的情景假设进行建模。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑与融资转向
    type: timeline
    summary: 时间线将产品转向与资本事件并置，并保留公司对 2020 年流动性压力的自述。
    data:
      items:
        - date: '2019'
          label: 公司成立
          detail: Sid Sheth 和 Sudeep Bhoja 离开 Inphi，围绕 AI 推理创立 d-Matrix。
          tone: neutral
          claimRefs:
