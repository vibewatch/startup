  - id: FE001
    title: d-Matrix 全栈 AI 推理系统架构
    type: stack
    summary: 六层架构层级覆盖定制 DIMC 芯片、双层内存子系统、芯片间和机架级互连、Aviator 运行时编译器以及企业应用接口。
    data:
      layers:
        - label: 企业应用与智能体工作流
          detail: 实时代码助手、对话式语音智能体以及高交互企业 LLM
        - label: Aviator 编译器与运行时工具链
          detail: PyTorch 集成、图编译、自定义内核调度以及 OCP MXINT8 / MXINT4 量化
        - label: 网络与横向扩展互连层
          detail: JetStream PCIe NIC、机架顶端以太网叶交换机以及 NVIDIA NVLink Fusion 机架级互连
        - label: 双层内存层级子系统
          detail: 2 GB 片上 SRAM 性能内存（150 TB/s），搭配最高 256 GB 片外 LPDDR5 容量内存
        - label: Chiplet 封装与 DMX Link 互连
          detail: 每张 PCIe 卡搭载八个 Chiplet，位于有机基板上，并采用全互连 DMX Link 芯片间网状拓扑
        - label: 数字存内计算（DIMC）核心芯片
          detail: 每个 Chiplet 集成 256 个 DIMC 核心，将算术逻辑直接嵌入标准 CMOS 的 64×64 SRAM 位单元
    approximationNotes: 层级综合了 d-Matrix 技术白皮书和 NVIDIA MGX 合作公告中记录的硬件、固件及软件规格。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从初步评估到机架级扩展的客户采用生命周期。
    approximationNotes: 阶段划分综合平台要求，反映数据中心硬件采购和认证的标准流程。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU008
      - CU011
      - CU012
    data:
      items:
        - label: 1. 工作负载分析
          detail: 客户使用 Aviator 仿真工具评估交互式 LLM 延迟、令牌吞吐目标和功耗上限。
          tone: neutral
        - label: 2. Corsair PCIe 试点
          detail: 基础设施团队将标准 PCIe Corsair 卡装入现有企业服务器，对真实 Llama 70B 工作负载进行基准测试。
          tone: neutral
        - label: 3. 系统集成
          detail: 通过 Aviator PyTorch API 优化软件栈，并在 Supermicro 认证服务器配置上验证部署。
          tone: positive
        - label: 4. 节点级扩展
          detail: 企业从评估服务器扩展到跨私有或托管数据中心设施的多节点集群。
          tone: positive
        - label: 5. 机架级架构
          detail: 客户评估用于高密度生成式推理集群的多机架 SquadRack 或 NVLink Fusion 拓扑。
          tone: adverse
        - label: 6. 长期机群更新
          detail: 规划认证和迁移，转向集成 NVIDIA MGX 模块化机架标准的下一代 Raptor XPU。
          tone: adverse
