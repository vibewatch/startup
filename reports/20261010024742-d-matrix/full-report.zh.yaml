      - number: '5.3'
        title: Aviator 软件 SDK、块浮点与 NVLink Fusion 机架整合
        blocks:
          - type: paragraph
            body: >-
              软件协同设计和生态兼容性决定加速器在现代数据中心环境中的可行性。Aviator 软件 SDK 是平台的主要软件接口，提供兼容 PyTorch 的抽象、底层图编译和自定义 kernel
              调度，以降低开发者上手摩擦。为提高算术密度并缩小内存占用，Corsair 原生支持 Open Compute Project（OCP）Microscaling（MX）Block Floating Point
              数值格式，每张卡的峰值密集计算能力为 MXINT8 2,400 TFLOPs、MXINT4 9,600 TFLOPs。2026 年 9 月，d-Matrix 宣布与 NVIDIA 的多年整合路线图：通过
              NVLink Fusion，将下一代推理处理器接入 NVIDIA MGX rackscale 架构。该机架级架构包含 NVIDIA Vera CPU、BlueField-4 DPU、ConnectX-9
              SuperNIC 和 Astera Labs PCIe retimer，支持异构拆分：NVIDIA GPU 处理计算密集型 prefill 阶段，d-Matrix XPU 处理延迟敏感的 token
              decode。
            claimRefs:
              - CE005
