  - id: TE002
    title: 推理工作负载与运营用例映射
    columns:
      - 运营任务
      - 传统 GPU 工作流
      - d-Matrix 平台方案
      - 声称的运营收益
      - 运营限制与尽调风险
    rows:
      - - 交互式 LLM 令牌生成
        - 高成本 HBM GPU（H100/B200）执行受内存带宽限制的解码循环
        - Corsair DIMC 性能内存以 150 TB/s 从片上 SRAM 提供权重
        - 令牌生成速度最高提升 10x，70B 模型每个令牌耗时 2ms
        - 每张卡 2 GB SRAM 限制片上完整执行只能覆盖较小模型，或需要大量卡
      - - 解耦推理（预填充与解码）
        - 单一 GPU 架构同时处理计算受限的预填充和带宽受限的解码，利用率低
        - NVIDIA GPU 负责计算密集型预填充；Corsair 或 Raptor XPU 通过 NVLink Fusion 负责延迟关键型解码
        - 让硬件架构匹配特定推理阶段需求，从而优化 TCO
        - 跨厂商流水线编排复杂，系统间 PCIe/NVLink 数据传输存在延迟
      - - 高吞吐离线批处理
        - 大型通用 GPU 集群处理大批量队列，功耗较高
        - Corsair 以容量模式运行，使用最高 256 GB 板载 LPDDR5 内存
        - 成本性能最高降低 3x，能效较传统 GPU 提升 3-5x
        - LPDDR5 内存带宽显著低于 SRAM，会牺牲超低令牌延迟
      - - 智能体 AI 与实时语音服务
        - GPU 服务器难以应对无规律的突发请求、严格的交互式 SLA 及多租户上下文切换
        - SquadRack 和 MGX 机架级模块化托盘将低延迟解码引擎部署在网络设备附近
        - 亚人类响应延迟支持流畅的多轮语音智能体和实时编程助手
        - 需要通过 Aviator 编译自定义模型；无法与 CUDA 生态实现即插即用的同等兼容
    notes: 工作负载优化和令牌速度指标反映厂商声称的性能特征；解耦预填充 / 解码需要接入主机 GPU 基础设施，并经过验证的调度运行时支持。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE008
      - CE009
      - CE011
