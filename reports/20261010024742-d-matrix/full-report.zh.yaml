  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              AI 推理加速器市场由生产级机器学习部署的基本架构需求界定，而不是前沿模型预训练。d-Matrix 将可服务市场边界定义在运行生成式 AI 和 transformer
              推理的企业及云数据中心服务器机架。计入的支出包括专用 PCIe 加速卡、基于 chiplet 的数字内存计算模块、专用机架级 scale-up 互联网络以及推理编译软件许可。相反，市场不包括只为模型训练优化的通用
              GPU 集群、消费级边缘设备，以及不运行大规模 transformer 工作负载的通用 CPU 企业托管。现状替代方案仍是密集的 NVIDIA H100 和 Blackwell GPU 集群；尽管交互式
              token 生成面临极高能耗和内存墙瓶颈，它们仍占据现有数据中心配置。d-Matrix 通过提供计算密集型加速器，让运营方在单个服务器机架内运行最高 100 billion
              参数的模型，目标是在标准企业数据中心中切出专门的 decode 层。
            claimRefs:
              - CM006
              - CM008
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM008
              - CM013
      - number: '2.2'
        title: 市场规模口径、TAM 预测与细分市场预测
        blocks:
          - type: paragraph
            body: >-
              评估 d-Matrix 的市场机会需要采用多种规模口径，因为各研究方法对 AI 芯片的分类差异很大。根据 Futurum Group 的 1H 2026 AI 芯片预测，以 agent 和 reasoning
              为先的推理芯片支出预计从 2025 年的 $35.9 billion 增至 2030 年的 $546.0 billion，并在 2027
              年超过预训练，成为最大的数据中心工作负载类别。在这一更大市场中，d-Matrix 竞争的专用 XPU 子市场预计将在同一五年窗口内从 $37.4 billion 增至 $237.2
              billion。StartEngine 的独立投资披露引用基准预测，预计 AI 芯片总市场到 2030 年达到 $323.1 billion；Tokenring 和 Chronicle Journal
              更保守的硬件行业预测则给出 2030 年 $76.7 billion、2035 年 $231.8 billion 的可服务硬件基础。d-Matrix 的可服务市场聚焦于需要低延迟 decode
              加速的异构数据中心机架；下一代 Raptor XPU 计划通过 NVIDIA MGX 参考系统于 2027 年第四季度进入商业供应。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM014
      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              专用推理硬件的商业化路径覆盖三类主要买家：二线云和 neocloud 服务商、前沿人工智能研究实验室，以及大型企业数据中心运营方。云服务商和前沿实验室最早采用，原因是服务 agentic 工作流和交互式
              reasoning 模型的运营开支不断上升。在这些组织中，采购预算通常由基础设施工程和云运营副总裁掌控，硬件主要按每 token 总拥有成本和交互延迟门槛评估。Gimlet Labs 在 2026 年将
              Corsair 加速器部署到 Gimlet Cloud，用于把 speculative decoding 从 GPU 卸载，从而实现显著延迟和效率提升，证明了这一路径的商业效果。2026 年末，NVIDIA
              计划中的股权投资和 NVLink Fusion 合作进一步提供战略验证，建立互操作桥梁，让超大规模和企业买家无需重新设计标准数据中心机架，便可将 d-Matrix decode 托盘与 NVIDIA Vera
              CPU 及网络设备并用。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动、电力约束与 ROI 瓶颈
        blocks:
          - type: paragraph
            body: >-
              生成式 AI token 需求带来强劲顺风，但推理加速器市场受到严峻的物理和经济约束。最紧迫的结构性驱动是数据中心电力可得性；Gartner 研究警告，到 2027 年最多 40% 的运营中 AI
              数据中心可能面临严重电力约束，能源高效架构将成为持续扩容的必要条件。但宏观经济和生态摩擦抑制了采用。d-Matrix 管理层明确指出，出资方正在审视商业软件回报缓慢的问题，并担心 AI
              基础设施泡沫；需要更广泛的下游应用采用，才能释放企业硬件预算。此外，监管限制和美国出口管制压缩了对中国大规模数据中心需求的触达，使可服务机会集中在西方超大规模客户、主权云项目和合规地区企业。要克服软件栈惯性，并证明异构部署中的长期硬件可靠性，仍是新兴芯片供应商的关键难题。
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: Decode 与 Prefill 的经济性分野
            body: >-
              推理工作负载在计算密集型 prefill 阶段和内存受限的 decode token 生成之间存在根本分野：前者偏好原始 GPU 浮点运算，后者受到严重内存墙瓶颈影响。d-Matrix 通过数字内存计算专攻
              decode 加速，解决主要成本和延迟驱动因素，而不是试图把现有 GPU 从 prefill 集群中替换掉。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 电力可得性与生态切换惯性
            body: >-
              专用推理芯片虽然每个 token 的能效更高，但采用仍受数据中心电力配给和生态锁定阻碍。预计到 2027 年最多 40% 的 AI 设施会遇到电力上限，而出资方也在审视企业 ROI，因此硬件部署高度依赖通过标准
              PCIe 托盘和 NVLink 互联实现无缝互操作。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: AI 推理竞争格局：直接同业、既有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              人工智能推理芯片的商业格局，核心是既有 GPU 架构与专用推理加速器之间不断加剧的竞争。Nvidia 依靠无处不在的 CUDA
              软件平台和完整系统封装，在企业及超大规模数据中心保持压倒性地位。在此背景下，专注解决推理延迟和成本瓶颈的硬件初创公司不断出现。直接挑战者包括 Groq，其 Tensor Streaming Processor
              架构强调确定性的低延迟 token 交付；以及 Cerebras Systems，其巨型晶圆级引擎绕开芯片间通信限制。此外，Fractile、Oxmiq 和 XCENA
              等早期内存计算初创公司探索模拟或数字内存处理。同时，大型云超大规模厂商部署自有 ASIC，例如 Google TPU 和 AWS
              Inferentia，承接内部高容量工作负载，也成为第三方商用加速器的现状替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
      - number: '3.2'
        title: 架构与能力权衡：内存计算、GPU 与 ASIC
        blocks:
          - type: paragraph
            body: >-
              评估推理加速器需要分析物理内存层级和计算基底。Nvidia Hopper、Blackwell 等传统 GPU 架构遵循经典冯·诺依曼原则，高速计算核心持续在外部高带宽内存（HBM）之间搬运权重和激活值。HBM
              虽提供很高的总带宽，但交互式 token 生成中的外部内存搬运会带来严重的散热和能耗代价。d-Matrix 以数字内存计算（DIMC）处理这一物理瓶颈，把计算逻辑直接放在多芯片封装内的高密度 SRAM
              模块旁。d-Matrix 还刻意绕开受限的 HBM 供应链，以避免由一线 GPU 厂商主导的配给和溢价。软件生态则不同：既有厂商依赖 CUDA 等深度固化的专有生态，d-Matrix 则围绕
              PyTorch、MLIR 和 Triton DSL 等开放标准组织 Aviator SDK，支持模型编译，无需开发者重写核心模型定义。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 封装、互联与部署经济性
        blocks:
          - type: paragraph
            body: >-
              企业和云数据中心采用硬件，很大程度取决于封装形态、功耗范围和互联兼容性。d-Matrix 将旗舰 Corsair 加速器设计为标准 600-watt PCIe 卡，可安装在 Supermicro、Dell 和
              HPE 等 OEM 制造的行业标准服务器中。与专用液冷设备或定制服务器机箱相比，这种 brownfield 封装策略可减少数据中心设施改造支出。但各竞争者的商业定价模式仍高度异质且不透明。GroqCloud 等云
              token 服务商公布每百万 token 的透明 API 价格，商用 GPU 也以透明的二级系统溢价交易，而 d-Matrix 的目录价格和实际折扣仍属私有信息。资本为初始企业试点扩张提供了跑道，其中包括总计
              $450 million 的融资，以及 2025 年末完成的 $275 million Series C。
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: 护城河持久性、生态切换壁垒与既有厂商竞合
        blocks:
          - type: paragraph
            body: >-
              商用半导体市场要维持长期护城河，必须抵御既有厂商持续吸收功能和软件锁定。BCG 增长份额矩阵等成熟组合框架表明，挑战者硬件产品必须先在交互式 agentic
              reasoning、实时生成等高增长细分市场取得可防守份额，才能避免既有厂商规模经济把利润率商品化。d-Matrix 没有与 Nvidia 进行全面系统替换，而是采取战略竞合。通过把 Nvidia 的
              NVLink Fusion 互联纳入产品路线图，d-Matrix 让其加速器可以在异构机架架构中与 Nvidia CPU、网络卡和 DPU 并行连接。但客户切换成本仍很高：已经优化 CUDA
              生产推理栈的企业，只有在看到有说服力的吞吐量和总拥有成本优势后，才会采用多硬件部署架构。
            claimRefs:
              - CP003
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
