      - number: '5.2'
        title: 数字内存计算架构与双层内存子系统
        blocks:
          - type: paragraph
            body: >-
              Corsair 平台的架构核心是数字内存计算（DIMC），用于处理传统冯·诺依曼加速器架构固有的内存墙。d-Matrix 不依赖通过昂贵硅中介层连接的独立高带宽内存（HBM）堆栈，而是采用标准 TSMC CMOS
              逻辑工艺，将算术乘加逻辑直接嵌入 64x64 SRAM bitcell 阵列。这种紧密物理耦合使每张卡拥有 2 GB 集成 Performance Memory，总内存带宽达 150 TB/s，比传统 HBM3
              实现高一个数量级。纯 SRAM 存放数十亿参数权重的成本过高，因此 Corsair 在计算裸片旁放置最高 256 GB 的板级 LPDDR5 Capacity Memory，形成双层内存层级。通过 Aviator
              软件运行时，工作负载可在延迟敏感的 decode 阶段使用 Performance Mode，也可在面向吞吐量的批量推理中使用 Capacity Mode。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE008
