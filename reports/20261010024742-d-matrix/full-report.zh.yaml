  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 按顺序串联技术架构、并购扩张、财务现实与最终建议的尽调决策链。
    data:
      nodes:
        - id: node-architecture
          label: DIMC 架构具备差异化
          detail: 内存计算在 LLM 工作负载上实现 3-5x 能效和低延迟推理
        - id: node-platform
          label: 全栈平台构建
          detail: 收购 GigaIO 和 Wallaroo 后，公司获得了机架级网络和编排软件
        - id: node-ecosystem
          label: Nvidia NVLink 互操作性
          detail: 这一战略定位支持半定制集成，并能与主流 GPU 基础设施协同
        - id: node-commercial
          label: 商业验证未披露
          detail: 经审计的 ARR、毛利率、客户留存率和单位经济性仍未公开披露
        - id: node-valuation
          label: $2B+ 估值过高
          detail: Series C 定价和 $5B 传闻没有为运营执行偏差留下安全边际
        - id: node-recommendation
          label: 继续研究立场
          detail: 保持跟踪纪律；配置资本前，必须核实客户部署情况
