    rows:
      - - 数字存内计算（DIMC）
        - 将算术 MAC 逻辑直接编织进 64x64 SRAM 位单元
        - 标准 CMOS 逻辑晶圆厂工艺（TSMC）
        - SRAM 扩展停滞、硅晶圆面积开销（每张卡 3,200 mm²）及光罩极限约束
      - - DMX Link Die-to-Die 互连
        - 有机基板封装内的低延迟全互联芯粒通信
        - 基于 OCP ODSA 标准的定制物理层
        - 芯粒间路由拥塞、封装良率损失，以及超过 8 个芯粒后扩展的延迟惩罚
      - - Raptor 3DIMC 堆叠子系统
        - 面向下一代 XPU，通过 TSV 将 DRAM 裸片垂直堆叠在 SRAM 逻辑裸片上
        - 先进 3D 封装晶圆厂集成及定制 DRAM 晶圆供应
        - 有源内存堆叠在逻辑裸片上方造成热热点；流片可能推迟至 2026 年之后，并带来 2027 年第四季度交付风险
      - - NVLink Fusion 与 MGX 机架集成
        - 将 d-Matrix XPU 与 Vera CPU 一起接入 NVIDIA 机架基础设施的纵向扩展接口
        - NVIDIA NVLink Fusion 生态、Astera Labs 重定时器及 NVIDIA MGX 模块化托盘标准
        - 平台依赖 NVIDIA 路线图时点和专有接口许可，并可能与合作伙伴渠道发生冲突
    notes: 子系统依赖和路线图里程碑反映 NVIDIA 于 2026 年 9 月发布的官方 NVLink Fusion 披露及技术白皮书文件；热性能和良率仍未获独立实验室认证。
