callouts:
  - calloutType: "insight"
    title: "Architectural Trade-Off: SRAM Bandwidth vs. Memory Density"
    body: "By integrating compute directly into SRAM bitcells, d-Matrix achieves an unprecedented 150 TB/s of memory bandwidth per card, enabling ultra-fast token decode. However, because SRAM is physically sparse (yielding only 2 GB per card across 3,200 mm² of silicon), large models cannot reside entirely on-chip, necessitating either large cluster footprints or hybrid reliance on slower off-chip LPDDR5 capacity memory."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE008"
  - calloutType: "risk"
    title: "Ecosystem Interoperability and 3D Packaging Hurdles"
    body: "While the September 2026 NVIDIA NVLink Fusion and MGX collaboration grants d-Matrix a credible rackscale path into tier-one datacenters, commercial execution hinges on two unverified milestones: timely tape-out and thermal validation of Raptor's 3D DRAM-over-logic stacked silicon, and market willingness to adopt semi-custom silicon without third-party MLPerf benchmark verification."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE013"
      - "CE014"
