  - id: "aviator-software-and-rackscale-integration"
    title: "Aviator Software SDK, Block Floating Point & NVLink Fusion Rack Integration"
    body: >-
      Software co-design and ecosystem compatibility determine accelerator viability in modern datacenter environments. The Aviator software SDK serves as the primary software interface for the platform, offering PyTorch-compatible abstractions alongside low-level graph compilation and custom kernel dispatch to minimize developer onboarding friction. To optimize arithmetic density and memory footprint, Corsair natively supports Open Compute Project (OCP) Microscaling (MX) Block Floating Point numerical formats, executing MXINT8 at 2,400 TFLOPs and MXINT4 at 9,600 TFLOPs of peak dense compute per card. In September 2026, d-Matrix announced a multi-year integration roadmap with NVIDIA to connect next-generation inference processors into NVIDIA's MGX rackscale architecture via NVLink Fusion. This rack-level architecture features NVIDIA Vera CPUs, BlueField-4 DPUs, ConnectX-9 SuperNICs, and Astera Labs PCIe retimers, enabling heterogeneous disaggregation where NVIDIA GPUs manage compute-heavy prefill phases while d-Matrix XPUs handle latency-sensitive token decode.
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE013"
    tableRefs:
      - "TE003"
  - id: "technical-differentiation-and-engineering-risks"
    title: "Technical Differentiation, Scalability Boundaries & Diligence Gaps"
    body: >-
      While d-Matrix reports significant energy efficiency benefits—claiming 0.3 picojoules per bit for on-chip SRAM compute versus 3.0 picojoules per bit for HBM-based GPUs—several critical engineering, yield, and deployment boundaries require rigorous investor diligence. The physical scaling stagnation of SRAM bitcells constrains on-chip memory to 2 GB per card, forcing hyperscalers running 70B+ parameter models to deploy multi-card clusters or accept the performance penalty of LPDDR5 capacity memory. Furthermore, d-Matrix's next-generation Raptor processor relies on vertical 3D DRAM-over-logic stacking via through-silicon vias (TSVs), introducing severe thermal dissipation challenges and advanced packaging yield uncertainties ahead of its targeted Q4 2027 commercial availability. Crucially, public performance metrics currently rest entirely on vendor whitepapers and simulated projections; independent third-party MLPerf benchmark audits, multi-tenant enterprise SOC 2 compliance certifications, and production customer reliability data remain unverified.
    claimRefs:
      - "CE008"
      - "CE010"
      - "CE014"
