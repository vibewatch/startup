  topStrengths:
  - Strong strategic positioning in AI/HPC data infrastructure, with product depth that now spans training, inference, orchestration, and sovereign-AI workflows.
  - Credible customer proof across marquee AI, enterprise, and research accounts including xAI, NVIDIA, TotalEnergies, and major HPC institutions.
  - 'Market backdrop remains favorable: independent sources still show strong AI-storage and data- infrastructure demand growth through 2030.'
  - Blackstone's $300 million investment validates company quality and reduces near-term financing pressure.
  - If the reported path toward roughly $1 billion of 2026 revenue is real, DDN's implied revenue multiple is not obviously out of line with selected public infrastructure comps.
  topRisks:
  - Public evidence remains thin on customer concentration, renewals, and cohort durability, which are exactly the variables that determine whether DDN deserves a premium multiple.
  - Product-line margin and software-mix opacity leave open the risk that the business is more systems- or project-heavy than the premium AI-platform story implies.
  - Dependency on flagship customers, NVIDIA alignment, and partner / managed-service routes could create concentration or margin-capture risk.
  - Litigation history, formal security assurance, and capital-structure terms are not public enough to fully underwrite downside.
  - At a $5B entry point, even a good company can produce mediocre returns if growth normalizes or disclosure during diligence reveals weaker quality than the public narrative suggests.
  unresolvedGaps:
  - Top-customer concentration, renewal cohorts, NRR/GRR, and expansion histories for flagship AI and sovereign accounts.
  - Product-line gross margins, software/services attach, and contribution economics across legacy storage versus newer platform layers.
  - Full litigation, IP, warranty, and claims schedule, plus any material security-audit or incident history.
  - Cap-table and term detail including preferences, liquidation rights, secondary history, and other investor protections.
  - Evidence that newer inference and orchestration layers are sticking in production with the same durability as DDN's legacy file-system core.
