companyProfile:
  summary: 'DDN is a 1998-founded AI and HPC data-infrastructure company that evolved from a parallel- file-system and supercomputing specialist into a broader data-intelligence platform vendor. Its current public product stack spans EXAScaler, Infinia, Horizon, HyperPOD, and related workflow packaging for AI factories, inference, sovereign AI, research computing, and data- intensive enterprise environments. The January 2025 Blackstone investment of $300 million at a stated $5 billion valuation validated DDN''s strategic importance in AI infrastructure and reduced near-term financing risk. Public evidence also shows meaningful customer proof across xAI, NVIDIA, Core42, TotalEnergies, and major research institutions. What remains under- disclosed is the economic layer: audited revenue quality, customer concentration, renewal behavior, product-line margins, legal exposure, and capital-structure terms.'
