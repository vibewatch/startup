        title: 能力广度与证据对比
        blocks:
          - type: paragraph
            body: >-
              这个市场里的能力比较离不开证据质量。DDN 公开的训练侧叙事围绕 AI400X3、AI400X2 Turbo 这类源自 EXAScaler 的系统展开；到 2026 年，公司公告进一步推向推理、GPU
              发起的数据访问和 KV-cache 加速。这让 DDN 当前叙事不再只是“并行文件系统”。StorageReview 的评测尤其重要，因为它标准化了买家该如何阅读厂商主张：DDN 拥有当前 MLPerf
              Storage v2.0 证据和强 NVIDIA 验证；IBM 也有经审计证明；VAST 有高知名度客户赢单，但没有 MLPerf 提交；WEKA
              的经审计提交则属于较老一代。这些差异重要，因为许多采购决策从厂商营销开始，最终却落到哪些主张能在共同规则下被佐证。若评估框架更重视证据、HPC 血统和与 NVIDIA
              的直接集成，而不只是平台广度或云邻近封装，DDN 看起来最强。
