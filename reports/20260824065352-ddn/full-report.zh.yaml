      - number: '8.4'
        title: 退出路径、触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              DDN 作为战略价值资产更容易被支持，作为完全透明的公开市场故事则更难。未来 IPO
              有可能，但前提是公司最终能够披露更干净的财务、法律和运营信息。出售给更大的基础设施、存储或平台公司，可能更容易成立，因为买方能用公开市场无法使用的方式承保协同效应和装机基础匹配。对今天的投资人来说，实际含义很直接：只有当尽调包回答了驱动倍数质量的变量，才应投入资本。这些变量包括客户集中度、队列续约、产品线利润率、优先股堆叠细节、诉讼历史和安全保障。如果答案良好，估值可以成立；如果答案令人失望，下行更多来自倍数压缩，而不是战略价值崩塌。在这些答案出现之前，上行应视为有条件，下行应视为倍数驱动而非生存危机。接受高价之前，先把这些问题查清。
