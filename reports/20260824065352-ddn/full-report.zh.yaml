  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与投资逻辑平衡
        blocks:
          - type: paragraph
            body: >-
              DDN 已经有资格获得高于小众存储厂商的估值。市场背景有利，客户证明真实，Blackstone 投资也验证了成熟资本看重它在 AI
              基础设施中的战略位置。这些都是有意义的正面因素。但它们不能抹掉强公司与显然有吸引力的入场价之间的差别。公开证据对 DDN
              战略价值的支撑，远强于对底层收入质量的支撑。这就是核心估值问题。一家公司可以配得上溢价叙事，却仍在利润率、集中度和续约动态上留下太多不确定性，外部投资人很难称其价格便宜。这种不对称正是推荐必须保持价格敏感、而不能只赞赏品类顺风的原因。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV036
              - CV038
              - CV039
