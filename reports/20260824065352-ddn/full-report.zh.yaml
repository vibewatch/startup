  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              DDN
              的变现模型不只是“卖一台存储盒子”。公开产品和解决方案组合至少暗示五层经济来源：集成设备、高性能文件系统软件、更新的数据平台或编排软件、支持和专业服务，以及托管或云邻近交付。这种宽度重要，因为它创造的经常性收入潜力，比
              DDN 传统 HPC 存储形象暗示的更高。Horizon、云服务和 Managed Lustre
              关系都指向这个方向。与此同时，公开定价几乎完全不透明。大型部署没有有用的公开标价框架，也无法仅靠公开来源清楚拆分产品收入、支持、云或服务。这意味着，从外部看，收入模型在战略上很有吸引力，但财务拆解不足。买家付钱，显然不只是买
              TB，而是买被避免的 GPU 浪费和运营简化。
