      - number: '6.4'
        title: 客户结论与尽调要求
        blocks:
          - type: paragraph
            body: >-
              客户证明是 DDN 的净优势，但客户分析仍是净缺口。具名案例集合足以支撑一个判断：DDN 正在生产级或接近生产级场景中，服务严肃的
              AI、科研和企业工作负载。但这些证据不足以让人对留存质量、扩张速度或集中度承受能力形成高信心。这个区别重要，因为晚期基础设施公司从外部看可能同样亮眼，无论它们是真的高度分散，还是只被少数超大项目锚定。尽调的正确下一步不是要更多
              客户名称，而是要队列数据、续约历史、头部客户敞口，以及新一代 AI 客户正从初始存储部署扩展到更广平台的证据。对于晚期估值，这项缺失的耐久性证据太重要，不能被当作普通私有公司披露不足轻轻带过。
            claimRefs:
              - CU031
              - CU032
              - CU033
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与整体画像
        blocks:
          - type: paragraph
            body: >-
              DDN 的风险画像从一个有用区分开始：市场风险低于执行风险。AI 与 HPC 数据基础设施需求真实，客户证明真实，Blackstone 投资后资本可得性也大幅改善。更难的问题是，等 AI
              周期成熟后，这些正面因素能否转化为分散、高质量、且利润率有韧性的收入基础。因此，公开记录指向一个典型晚期基础设施模式：一家公司可以很强，但如果少数旗舰账户主导结果、伙伴依赖拿走太多价值，或新产品层无法像传统平台那样干净地制度化，它仍可能成为令人失望的投资。这让尽调质量真正决定投资结果。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR033
              - CR040
