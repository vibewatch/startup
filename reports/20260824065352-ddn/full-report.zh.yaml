      - number: '6.2'
        title: 具名客户证明与采用质量
        blocks:
          - type: paragraph
            body: >-
              DDN 客户证据最强的地方，是许多案例读起来像真实部署。xAI、NVIDIA、TotalEnergies、Purdue、NCSA 等不是随机 logo；它们契合 DDN
              声称要解决的核心问题：共享数据环境需要高吞吐，算力利用率很关键。TotalEnergies 尤其强，因为 Pangea 5 故事在 DDN 之外也得到佐证。NVIDIA
              即便公开叙事不如完整工程案例具体，战略价值仍然很强，因为它验证了 DDN 与现代 AI 工厂基础设施的对齐。公开证据还暗示 DDN
              同时服务多种采用界面：直接企业或机构销售、公共部门采购，以及伙伴主导或云邻近环境。最大保留项是，即便好的案例研究，也不会自动证明扩张或当前支出水平。因此，客户章节支持产品-市场匹配，但仍留下每个大型部署内部变现质量这一更难的问题。
