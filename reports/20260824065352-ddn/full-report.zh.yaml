      - number: '6.3'
        title: 耐久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              当问题从“谁在使用 DDN？”转向“收入基础有多耐久、多分散？”时，公开记录明显变弱。未发现公开 NRR、GRR、流失率或标准化客户满意度指标。最好的间接耐久性信号，是 DDN
              与关键任务环境的可重复匹配，以及公司一边仍能引用长周期科研客户，一边也能新增当前 AI 名称。这说明平台不是只属于某一个时代的产品。但这并没有回答承保中的核心问题：续约、合同期限，或新 AI
              客户是否会在首次部署后实质扩张。集中度风险很可能重要，正因为可见名称都很大、很具战略性。当客户名单由贴近超大规模云的 AI 项目和巨型算力环境领衔时，即便整体 logo
              名册很长，少数账户也可能不成比例地拉动收入。缺少披露的队列数据意味着，扩张仍更像可信机制，而不是量化事实；这个区别必须保持清楚。
