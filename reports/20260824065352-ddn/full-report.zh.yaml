companyProfile:
  summary: >-
    DDN 是一家创立于 1998 年的 AI 与 HPC 数据基础设施公司，起家于并行文件系统和超算领域，如今扩展为更宽的数据智能平台厂商。它当前公开的产品栈覆盖
    EXAScaler、Infinia、Horizon、HyperPOD，以及面向 AI 工厂、推理、主权 AI、科研计算和数据密集型企业环境的工作流打包。Blackstone 在 2025 年 1 月以 $5B 估值投资
    $300M，验证了 DDN 在 AI 基础设施中的战略重要性，也降低了近期融资风险。公开证据还显示，xAI、NVIDIA、Core42、TotalEnergies
    和主要研究机构都构成有意义的客户证明。仍未充分披露的是经济层：经审计的收入质量、客户集中度、续约行为、产品线利润率、法律风险敞口和资本结构条款。
