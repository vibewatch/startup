  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、既有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比“所有存储厂商”更窄，也更有结构。第三方图谱和评测持续把 DDN 放在高性能文件与 AI 存储层级，与 WEKA、VAST Data、IBM Storage Scale
              以及少数既有企业厂商并列。这组专业厂商直接争夺 AI 工厂、贴近超大规模云的部署，以及共享吞吐、检查点速度或主权真正重要的科研环境。替代品不只是同类设备。Google Managed Lustre
              等托管服务，以及 Oracle 这类集成云 AI
              平台，也能通过移除部署摩擦来争夺同一笔预算。这一点重要，因为买家越来越是在不同战略模型之间选择：专业数据平台、既有混合云技术栈，或用峰值控制换运营简单度的托管云服务。把这些统统装进一个桶，会遮住 DDN
              真正占优的位置，也会遮住它只是众多可接受解法之一的场景。
