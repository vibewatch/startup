chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、历史与商业模式
        blocks:
          - type: paragraph
            body: >-
              DDN 是当前 AI 技术栈中仍存活的老牌基础设施专家之一：官方历史可追溯到 1998 年，当时 MegaDrive 与 ImpactData 合并成立公司；公开材料至今仍显示总部位于加州
              Chatsworth。到 2026 年，公司之所以重要，不只是因为资历老，而是因为它完成了转身。DDN 不再把自己包装成泛用存储厂商。官网和产品页都把 DDN
              定位为数据智能平台公司，帮助客户以高吞吐、低延迟持续喂饱 AI 训练、推理和分析工作负载。商业叙事很一致：DDN 向运行 AI 工厂、云 GPU 服务、主权 AI 项目和传统 HPC
              环境的客户销售硬件-软件系统及相关平台软件。EXAScaler 锚定训练侧并行文件系统叙事，Infinia 和更新的编排层把产品线延伸到推理和多租户 AI 运营。这个定位重要，因为它把 DDN
              从实验室超算的小众赛道推到更大的企业 AI 基础设施预算项里。
