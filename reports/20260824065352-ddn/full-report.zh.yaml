  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Rows focus on the public infrastructure and storage comparables most useful for framing DDN’s implied revenue
        multiple; the set is illustrative rather than exhaustive.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 契合度
      - 局限
    rows:
      - - NetApp
        - 市值 / 收入
        - 市值 ~$37.7B / 收入 ~$6.9B ≈ ~5.4x
        - 与存储和数据管理高度相邻
        - 上市公司披露更充分，业务组合更成熟
      - - Pure Storage
        - 市值 / 收入
        - 市值 ~$22.4B / 收入 ~$3.66B ≈ ~6.1x
        - 现代存储可比公司，软件属性更强
        - 仍不是完美的私有 AI 基础设施类比
      - - HPE
        - 市值 / 收入
        - 市值 ~$70.8B / 收入 ~$38.8B ≈ ~1.8x
        - 展示更广泛、硬件占比较高的基础设施下行倍数
        - 业务组合和规模远宽于 DDN
      - - IBM
        - 市值 / 收入
        - 市值 ~$222.0B / 收入 ~$68.9B ≈ ~3.2x
        - 展示多元化基础设施 / 软件基准
        - 过于多元，不能作为纯存储可比
      - - Oracle
        - 市值 / 收入
        - 市值 ~$421.9B / 收入 ~$67.35B ≈ ~6.3x
        - 显示软件属性更强的基础设施敞口能获得什么定价
        - 规模远大于 DDN，软件属性也更强
    notes: 基于 $1B 收入叙事，DDN 隐含 ~5x，落在公开市场区间内；但披露更少，折价仍应足够明显。
