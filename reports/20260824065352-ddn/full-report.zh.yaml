      - number: '2.2'
        title: TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              宽口径市场报告解释了投资人为什么兴奋于 AI 存储，但它们只是起点。Mordor 对 AI 驱动存储的预测显示，市场将在 2025 年达到 $27.06B，到 2030 年达到 $76.6B；Castle
              Rock 则描述了一个与检查点写入、替换周期和 AI 数据服务绑定的巨大 HPC 与 AI 存储加数据管理机会。这些自上而下的数字在方向上有用：它们说明品类很大、增长很快，也在变得更具战略性。但它们不是 DDN
              在实践中的可触达市场。DDN 的现实 SAM 更窄，因为公司最强的场景，是高吞吐共享数据层、主权要求或云规模训练经济性真正重要的地方。这个子集包括 neocloud、主权 AI 项目、科研超算和先进企业 AI
              工厂。现实 SOM 还要更窄：只包括近期正在部署或升级这些环境的买家。尽调含义是，DDN 可以身处大市场，但并非每一美元与 AI 有关的存储支出都和它的胜率或定价权有关。
