  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              尽调第一步，是把市场定义对。DDN 不是把通用企业存储卖进无差别的文件共享工作负载；它卖的是数据基础设施，用来消除 AI 训练、推理、分析和传统 HPC 的瓶颈。因此，纳入支出不是“所有存储”，而是专门为让昂贵
              GPU 或超算环境保持生产力而购买的文件、对象、键值、编排和托管数据服务子集。DDN 自身产品线把这一区分讲得很清楚：EXAScaler 对应高吞吐训练侧，Infinia
              和更新服务则覆盖推理与数据管理层。相邻竞争者包括 IBM、NetApp 等既有厂商，WEKA、VAST 等 AI 原生专家，以及 Google Managed Lustre
              等公有云托管服务。应排除的支出包括商品化 SMB NAS 和办公室 IT 协作存储，在这些场景里，DDN 的性能和主权主张不是采购的决定性标准。
