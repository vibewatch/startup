      - number: '2.3'
        title: 买家、用户与预算所有者分层
        blocks:
          - type: paragraph
            body: >-
              这个市场的买家分层更多取决于部署模式，而不是公司规模。在贴近超大规模云厂商和 neocloud 的环境里，买家通常是基础设施平台团队，任务是一边把 GPU 集群变现，一边守住服务水平表现。在主权 AI
              项目里，决策可能落在国家或公共部门算力机构手中；它们看重数据驻留、租户隔离和战略控制，权重不亚于吞吐。在企业 AI
              工厂里，采购中心更宽：基础设施工程、研究、安全和高管赞助人都会影响决策，因为存储同时影响模型生产力和 GPU 资本回报。购买后的用户不是办公室存储管理员，而是平台工程师、MLOps
              团队、研究人员和推理运营人员。这解释了 Google Managed Lustre 这类托管产品为什么重要：有些买家想要并行文件系统性能，但不想重建完整 HPC 团队的运营复杂度。这也解释了为什么 DDN
              越来越用 AI 工厂和推理经济性的语言来讲故事，而不只讲文件系统基准。
