      - number: '8.2'
        title: 价格支撑与可比框架
        blocks:
          - type: paragraph
            body: >-
              到 2026 年 8 月，2025 年 1 月的 $5B 标记在方向上仍可支撑，但前提是采用有纪律的假设。如果关于 DDN 正迈向 $1B 收入的公开报道大体准确，这个估值意味着约 5x 收入。按简单市值 /
              收入框架看，这并不明显偏离 NetApp、Pure Storage 等上市基础设施可比公司，也低于 Oracle 这类软件含量更高的大型平台。不过，上市可比公司披露、治理和风险因素细节明显优于 DDN。这意味着
              DDN 不能只因为处在有吸引力的品类，就自动继承同业倍数。可比公司的关键教训不是 $5B 太高，而是只有当增长和质量叙事在尽调中证明耐久，价格才站得住。换句话说，倍数可以挣出来，但公开记录还没有完全去风险。
