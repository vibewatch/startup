    approximationNotes: 单元格反映公开证据质量，而非绝对技术质量。
    data:
      columns:
        - 公开成熟度信号
        - 独立证据
        - 合作伙伴依赖
        - 运营复杂度
      rows:
        - label: EXAScaler / 训练
          values:
            - label: 高
              tone: positive
            - label: 中高
              tone: positive
            - label: 中
              tone: neutral
            - label: 高
              tone: warning
        - label: Infinia / 推理
          values:
            - label: 中高
              tone: positive
            - label: 中
              tone: neutral
            - label: 高
              tone: warning
            - label: 中
              tone: neutral
        - label: Horizon / 编排
          values:
            - label: 中
              tone: neutral
            - label: 中低
              tone: warning
            - label: 中
              tone: neutral
            - label: 中高
              tone: warning
        - label: 信任 / 合规层
          values:
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
            - label: 中
              tone: neutral
            - label: 高
              tone: warning
    claimRefs:
      - CE020
      - CE027
      - CE019
      - CE024
      - CE034
  - id: FU001
    title: 客户旅程图
    type: flow
    layout: wide
    summary: 当数据基础设施卡住昂贵算力或关键研究时，DDN 最容易拿下客户。
    approximationNotes: 这些阶段综合案例研究中反复出现的模式，并非一条通用旅程。
    data:
      nodes:
        - id: problem
          label: 问题识别
          detail: 买方看到 GPU、仿真或研究工作流瓶颈
          type: input
        - id: validate
          label: 技术验证
          detail: 评估架构适配和共享数据性能
          type: process
        - id: deploy
          label: 部署
          detail: 系统或服务进入准生产使用
          type: process
        - id: expand
          label: 扩张
          detail: 增加更多工作负载、站点或模块
          type: process
        - id: reference
          label: 标杆价值
          detail: 客户成为同类买家的证明点
          type: output
      edges:
        - from: problem
          to: validate
          label: 预算与需求浮现
        - from: validate
          to: deploy
          label: 买方拍板
        - from: deploy
          to: expand
          label: 适配度带动更多使用
        - from: expand
          to: reference
          label: 公开背书累积
    claimRefs:
      - CU001
      - CU006
      - CU022
      - CU039
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 可见潜在客户中，只有一部分变成具名部署；具名部署中也只有一部分提供强公开成效证据。
    approximationNotes: 证据漏斗只是概念框架，不是基于数量的销售漏斗。
    data:
      nodes:
        - id: interest
          label: 目标细分兴趣
          detail: AI 实验室、研究机构、主权项目、企业
          type: input
        - id: validation
          label: 架构验证
          detail: 围绕吞吐、适配和运营的证明
          type: process
        - id: deployment
          label: 具名部署
          detail: 出现案例研究或公开背书
          type: process
        - id: expansion
          label: 扩张 / 重复使用
          detail: 公开披露不足的阶段
          type: output
      edges:
        - from: interest
          to: validation
          label: 技术尽调
        - from: validation
          to: deployment
          label: 买方拍板
        - from: deployment
          to: expansion
          label: 需要续约与加购证据
    claimRefs:
      - CU006
      - CU007
      - CU024
      - CU032
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 公开证据最能证明具名部署存在，但对留存或经济性的证明较弱。
    approximationNotes: 单元格评分的是公开证据质量，而非客户本身质量。
    data:
      columns:
        - 具名部署证明
        - 结果具体性
        - 经济性可见度
        - 留存可见度
      rows:
        - label: xAI
          values:
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
            - label: 低
              tone: warning
        - label: TotalEnergies
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 中低
              tone: warning
            - label: 低
              tone: warning
        - label: 学术 / 研究客户组
          values:
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
            - label: 低
              tone: warning
        - label: 合作伙伴主导路径
          values:
            - label: 中
              tone: neutral
            - label: 中低
              tone: warning
            - label: 低
              tone: warning
            - label: 低
              tone: warning
    claimRefs:
      - CU009
      - CU015
      - CU027
      - CU020
      - CU039
  - id: FU004
    title: 扩张 / 集中度逻辑图
    type: matrix
    layout: wide
    summary: 最高价值客户细分也带来最高的集中度和续约不透明风险。
    approximationNotes: 矩阵排序基于公开证据模式，不代表确切收入占比。
    data:
      columns:
        - 战略价值
        - 扩张潜力
        - 集中度风险
        - 续约可见度
      rows:
        - label: AI 实验室 / GPU 云
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 高
              tone: warning
            - label: 低
              tone: warning
        - label: 研究 / 学术机构
          values:
            - label: 中高
              tone: positive
            - label: 中
              tone: neutral
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
        - label: 主权 / 公共算力
          values:
            - label: 高
              tone: positive
            - label: 中高
              tone: positive
            - label: 高
              tone: warning
            - label: 低
              tone: warning
        - label: 企业垂直行业
          values:
            - label: 中
              tone: neutral
            - label: 中
              tone: neutral
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
    claimRefs:
      - CU002
      - CU026
      - CU025
      - CU030
      - CU028
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 集中度、生态依赖和与披露挂钩的估值风险主导公开风险图景。
    approximationNotes: 单元格按公开证据集中的剩余风险排序，不是概率损失预测。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 客户集中度
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: warning
            - label: 中低
              tone: warning
            - label: 高
              tone: warning
        - label: 合作伙伴 / NVIDIA 依赖
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: warning
            - label: 中
              tone: neutral
            - label: 中高
              tone: warning
        - label: 运营复杂度
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: warning
            - label: 中
              tone: neutral
            - label: 高
              tone: warning
        - label: 披露 / 估值风险
          values:
            - label: 高
              tone: warning
            - label: 高
              tone: warning
            - label: 低
              tone: warning
            - label: 高
              tone: warning
    claimRefs:
      - CR001
      - CR015
      - CR012
      - CR009
      - CR019
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 监管和控制风险重要，因为它们可能直接传导到销售速度、客户扩张和估值支撑。
    approximationNotes: 图中展示因果通道，而非测算弹性。
    data:
      nodes:
        - id: reg
          label: 监管 / 法律暴露面
        - id: ops
          label: 运营控制
        - id: sales
          label: 交易速度与地域
        - id: cust
          label: 客户扩张与信任
        - id: val
          label: 估值支撑
      edges:
        - from: reg
          to: sales
          label: 改变产品能在哪里销售
        - from: ops
          to: cust
          label: 影响信任和留存
        - from: sales
          to: val
          label: 增长放慢削弱支撑
        - from: cust
          to: val
          label: 可持续性下降压缩价格
        - from: reg
          to: val
          label: 风险折价扩大
    claimRefs:
      - CR005
      - CR006
      - CR010
      - CR024
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: DDN 最重要的外部依赖集中在加速器生态、渠道路径、主要客户和政策体系。
    approximationNotes: 该图突出集中度暴露面，而非合同规模。
    data:
      nodes:
        - id: ddn
          label: DDN
        - id: nvidia
          label: NVIDIA 生态
        - id: cloud
          label: Google / 托管云路径
        - id: partners
          label: 区域 / 主权合作伙伴
        - id: flagships
          label: 标杆客户
        - id: policy
          label: 监管机构 / 政策体系
      edges:
        - from: nvidia
          to: ddn
          label: 路线图和市场信号
        - from: cloud
          to: ddn
          label: 间接交付和利润率取舍
        - from: partners
          to: ddn
          label: 区域执行和准入
        - from: flagships
          to: ddn
          label: 集中度和证明价值
        - from: policy
          to: ddn
          label: 出口和治理约束
    claimRefs:
      - CR012
      - CR013
      - CR015
      - CR027
      - CR037
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 投资建议来自真实战略验证，再经过证据质量和估值纪律过滤。
    approximationNotes: 该流程是对报告证据的综合，不是机械评分引擎。
    data:
      nodes:
        - id: proof
          label: 战略验证
          detail: 客户、产品和市场顺风
          type: input
        - id: quality
          label: 证据质量检查
          detail: 财务和法律披露仍不完整
          type: process
        - id: price
          label: 价格纪律
          detail: ~$5B 需要可持续性支撑，不能只靠相关性
          type: process
        - id: call
          label: 投资建议
          detail: 有条件投资 / 继续研究
          type: output
      edges:
        - from: proof
          to: quality
          label: 战略验证真实但不完整
        - from: quality
          to: price
          label: 不透明度拉大所需折价
        - from: price
          to: call
          label: 投资建议转为有条件
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最大的估值敏感项是收入质量变量，而不只是收入规模。
    approximationNotes: 条形是序数敏感性权重，不是数学增量。
    data:
      items:
        - label: 客户集中度
          value: 5
          unit: /5
        - label: 软件 / 毛利率结构
          value: 5
          unit: /5
        - label: 续约质量
          value: 5
          unit: /5
        - label: 收入规模
          value: 4
          unit: /5
        - label: 合作伙伴依赖
          value: 3
          unit: /5
        - label: 法律 / 安全意外风险
          value: 4
          unit: /5
    claimRefs:
      - CV029
      - CV030
      - CV023
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支撑的是一个较宽但有中枢的区间，而非精确点估值。
    approximationNotes: 区间反映情景化公开证据支撑，不是正式折现现金流模型。
    data:
      items:
        - label: 悲观
          low: 2.5
          high: 4
          unit: USD bn
        - label: 基准
          low: 4.5
          high: 6
          unit: USD bn
        - label: 乐观
          low: 7
          high: 10
          unit: USD bn
    claimRefs:
      - CV043
      - CV011
      - CV012
      - CV013
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: DDN 在市场和战略验证上得分很高，但证据质量和估值吸引力只属中等。
    approximationNotes: 分数是分析师基于证据集按 1–5 分给出的判断。
    data:
      items:
        - label: 市场顺风
          value: 5
          unit: /5
        - label: 客户验证
          value: 5
          unit: /5
        - label: 护城河 / 相关性
          value: 4
          unit: /5
        - label: 财务透明度
          value: 2
          unit: /5
        - label: 风险控制可见度
          value: 2
          unit: /5
        - label: $5B 估值下的吸引力
          value: 3
          unit: /5
    claimRefs:
      - CV036
      - CV032
      - CV040
      - CV044
