      - number: '4.2'
        title: 公开牵引力与收入质量
        blocks:
          - type: paragraph
            body: >-
              公司公开里程碑显示，它在当前 AI 周期前就已具备相当规模，2021 年达到 $400M 收入和 11,000 家客户。更新的第三方报道指向 2025 年约 $500M 收入、2026 年约 $1B
              指引，增速相当剧烈。结合背景看，这种加速并非不合理，因为 DDN 卡在 GPU 密集型 AI 部署的基础设施瓶颈上，并且在云、金融、生命科学和能源领域拥有明星客户证明。但质量警示很重要。Welcome.AI
              提醒得对：2026 年数字是指引，不是经审计结果；少数大型 AI 合同的集中度可能扭曲可持续性。公开牵引力是真实的；收入质量的公开证据仍不完整。因此，战略需求与可报告、可持续收入之间的差距，是核心财务问题。
