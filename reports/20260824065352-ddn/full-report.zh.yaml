      - number: '7.4'
        title: 财务与估值风险
        blocks:
          - type: paragraph
            body: >-
              财务上，主要担忧不是近期流动性。Blackstone 投资和 DDN
              显现出的规模降低了这项担忧。更大的问题是，在缺少经审计、分部级透明度的情况下，投资人被要求从战略证据跨到经济信心。关于快速收入增长的公开报道有助于支撑上行逻辑，但不能解决大型部署中的毛利率结构、续约质量或营运资本动态问题。如果
              DDN 能继续复合增长，并且软件与服务附加良好，$5B 标记可能证明合理；如果业务比头条叙事暗示的更偏硬件或项目型，这个估值也可能显得吃力。因此，DDN
              的风险最好理解为与估值挂钩的执行风险，而不是典型创业公司的生存风险。
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR030
              - CR038
      - number: '7.5'
        title: 缓释因素、触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              DDN
              的投资理由并不是风险很小，而是风险可读，并且在尽调严格时可能可控。最好的可见缓释因素，是新资本、广泛战略价值、生态验证，以及跨多个终端市场的客户宽度。但在这个估值上，叙事带来的舒适感不够。投资人需要可监控触发器：伙伴路线结构恶化、旗舰客户无法扩张、推理时代模块粘不住、支持事件增加，或政策摩擦拖慢主权和跨境项目。强制尽调项依然清楚：安全控制、诉讼和索赔历史、产品线经济性、头部客户集中度、客户队列，以及新平台层的运营成熟度。因此，价格纪律是缓释的一部分，而不是替代品。
