  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              阅读 DDN 产品组合的正确方式，是把它看成多模块 AI 数据平台，而不是单一存储产品。官方材料覆盖 EXAScaler、Infinia、Horizon、HyperPOD 和
              IndustrySync，每个模块指向客户工作流中的不同层。EXAScaler 仍是训练侧吞吐引擎；Infinia 把平台延伸到推理、RAG 和分布式数据服务；Horizon
              面向安全多租户和自助服务提供编排界面；HyperPOD 封装更系统级的 AI 基础设施结果；IndustrySync 则把叙事适配到垂直工作流。这种宽度重要，因为它把 DDN
              从狭窄的文件系统对话推到更宽的平台对话里。它也带来边界问题：公开来源能清楚展示技术形态，却不太能说明附加销售率、产品线经济性，或每个模块在生产中部署得有多广。这一点具有战略意义，因为买家越来越希望由一个供应商叙事覆盖数据准备、训练、推理和托管运营，而不是自己把故事拼起来。
