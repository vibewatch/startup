      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              Blackstone 的 $300M 投资显著降低了 DDN 对近期融资的依赖，也传递了对其增长路径的信心。管理层把这笔钱定义为
              R&D、商业化扩张和伙伴开发的加速资本，而不是维持生存的过桥资金。这支持了积极的资本充足性判断。剩下的问题是披露质量，不是资金可得性。公开来源仍未提供现金余额、债务、现金跑道、毛利率、留存，或 CFO
              级别的分部经济性调节表。第三方追踪机构对融资历史有方向性价值，但不能替代经审计财务报表。因此，财务结论是：战略质量和当前需求有利，但利润率耐久性和经常性收入深度只能给中等置信度。尽调团队应假设这家公司强到值得认真研究，同时也私密到仍可能带来意外。实际看，业务具备可投资性，但必须先经过正式数据室审查。它正是那类原则上看起来很强、但仍要求投资人在每一个收入质量指标上保持纪律的晚期私有公司。
