      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场需求侧很强。Mordor 明确把 GenAI 工作负载爆发和企业转向本地 AI 列为主要驱动因素，DDN 自身叙事也强调 GPU 利用率、更快的检查点写入和更低 token
              成本。存储已经从后台仓库变成性能杠杆。但强需求并不会消除采用约束。高端 AI 存储仍需要可观资本开支或较高承诺云支出；迁移复杂度、运营模式错配，或 NVIDIA
              参考架构验证需求，都可能拖慢部署。主权因素也是双刃剑：它扩大公共部门和国家级 AI 项目需求，同时带来采购、分段和安全负担，拉长销售周期。最后，大型云平台和既有厂商正在向上游技术栈推进，意味着 DDN
              追逐的是一块增长中的蛋糕，但也必须和能力越来越强的替代方案分享。实际结果是，市场确有顺风，但销售动作和执行中都有不小摩擦。
