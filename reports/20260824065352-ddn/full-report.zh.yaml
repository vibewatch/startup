      - number: '4.3'
        title: 成本结构、利润率路径与资本强度
        blocks:
          - type: paragraph
            body: >-
              DDN 不是纯软件公司，因此不能按 SaaS 口径给它套经济模型。公司集成设备，并支持复杂客户环境，这很可能让毛利率天花板低于纯基础设施软件。另一方面，市场背景有利：如果存储正在阻碍昂贵 GPU
              被充分利用，产品就可以围绕被避免的算力浪费来销售，而不是围绕廉价字节来销售。即便在硬件-软件混合模式下，这种动态也能支撑溢价经济性。营运资本和服务仍然重要。集成系统意味着库存和部署规划，大型安装意味着实施、现场工程和支持负担。相对于芯片厂商或完整基础设施所有者，DDN
              的资本强度看起来适中；相对于纯 SaaS 厂商，则明显更高。因此，利润率路径很可能有吸引力但结构混合，硬件、软件和服务的贡献各不相同。这让收入结构披露比单一头条收入数字更重要。
