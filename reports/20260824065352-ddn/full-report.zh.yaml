      - number: '5.2'
        title: 架构、集成与依赖
        blocks:
          - type: paragraph
            body: >-
              从架构上看，DDN 现在卖的是数据平面，也是运营模式。EXAScaler 仍是训练用的标准高性能文件系统层；Infinia 引入面向推理的数据层，明确谈到 KV-cache、RAG 和实时数据流。Horizon
              增加了安全多租户和自助服务的编排表面。平台与 NVIDIA 生态绑定很深：DDN 自身材料和 NVIDIA 引用都把兼容性和高性能数据移动放在关键位置。由 DDN 技术驱动的 Google Managed
              Lustre 说明，这套架构不仅能作为直接设备部署，也能以云托管服务形式出现。这提高了 DDN 的灵活性，但也意味着部分差异化依赖伙伴生态和持续演进的接口标准，而这些并不完全由 DDN
              控制。由此形成的架构很强，但也给尽调留下真实负担：互操作性、版本管理和伙伴控制的发布节奏都要核实。
