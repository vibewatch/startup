        title: 领导层、治理与创始人依赖
        blocks:
          - type: paragraph
            body: >-
              创始人延续性是 DDN 叙事的核心。Alex Bouzari 仍任 CEO，Paul Bloch
              仍是联合创始人和最高运营层成员；公开领导团队还包括产品、财务、技术支持和技术负责人。复杂基础设施公司的优势靠长期工程积累和客户关系支撑，这种延续性是真实的治理优势。它也带来典型的关键人物风险。公开证据仍把战略方向、投资者沟通和品类定位高度系于
              Bouzari 与 Bloch，任何交接都会具有实质影响。Blackstone 2025 年 1 月的投资并没有把 DDN 变成被动持有的组合公司：Blackstone
              直接出现在领导团队页面上，投资人的治理角色相当可见，意味着其战略参与度不低。2026 年新增的法务与人力领导任命，进一步说明 DDN
              正在为更大的全球运营版图搭建管理纵深，但完整董事会名单和交易后的准确控制条款仍未完全公开。
