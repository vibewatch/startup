      - number: '3.3'
        title: 分销能力、切换成本与客户证明不对称
        blocks:
          - type: paragraph
            body: >-
              强产品故事抹不掉商业化差异。既有厂商和云平台可以把存储与更广的基础设施打包，因此在采购中更有杠杆，也能吸收一部分运营负担。DDN 已经表示希望扩大分销商和 OEM
              触达，但公开渠道能见度仍弱于主要既有厂商。与此同时，DDN
              核心细分市场的切换成本并不低。一个集群一旦把共享数据层标准化，换供应商就意味着迁移流水线、重跑基准、重新训练运营团队。由此形成真实锁定效应，尽管不同工作负载层或不同集群之间仍可多供应商并存。客户证明的不对称在这里很关键：有具名
              AI 工厂赢单的 AI 原生专家，比公开案例更薄、更泛化的既有厂商更容易证明就绪度。DDN 今天受益于这种不对称，但如果买家认定便利性胜过峰值控制，云托管选项可能削弱这种优势。
            claimRefs:
