      - number: '8.3'
        title: 情景、建议与持有纪律
        blocks:
          - type: paragraph
            body: >-
              基准情景应赋予最高概率，因为它最符合当前证据组合。在这个情景中，DDN 仍是重要的 AI
              数据基础设施公司，继续良好增长，也配得上持续的溢价待遇，但不应获得无差别重估。乐观情景需要的不只是收入增长：还需要证明业务具备软件式耐久性，新平台层附加更广，并且能清楚分散到少数旗舰部署之外。悲观情景不是业务失败，而是更普通的结果：DDN
              仍然相关，但比溢价故事假设的更偏项目型、更集中或更硬件加权。在这些条件下，即便公司本身仍不错，估值也可能压缩。因此，建议应是有条件、以里程碑为基础，而不是纯粹由叙事驱动。纪律型投资人应按情景和里程碑思考，而不是把
              AI 动能做一次英雄式外推。换句话说，投资人应要求证据证明 DDN 正作为平台公司复合增长，而不只是冲浪一波临时采购潮。
