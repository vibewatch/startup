      - number: '1.3'
        title: 资本结构、估值与封面指标
        blocks:
          - type: paragraph
            body: >-
              DDN 公开记录中的关键资本事件，是 Blackstone 2025 年 1 月以 $5B 估值投资 $300M。DDN 和 Blackstone 都把这一轮定义为继续高速增长的燃料，而不是救命钱；CRN 对
              Paul Bloch 的采访把动机讲得很直白：加速 R&D、流程、分销商与 OEM 伙伴关系，以及更广泛的高管层销售。值得注意的是，DDN 和 Blackstone
              都称这是公司在盈利且私人持有二十多年后首次引入外部机构资本。第三方追踪机构补充称，累计融资很可能接近 $310M，意味着 Blackstone
              这一轮主导了公司资本结构历史。因此，公开封面指标呈现不对称：估值、轮次规模、GPU 覆盖规模和部分历史收入里程碑相对可见；当前员工数、经审计的 2025 年收入、准确所有权拆分、债务和优先权条款则仍不透明。AI
              Weekly 和 Welcome.AI 都转述了管理层指引：收入可能从 2025 年约 $500M 增至 2026 年约 $1B。但这些数字仍是公司指引，不是经审计的备案，最多只能按中等置信度看待。
