      - number: '7.2'
        title: 法律、监管与安全风险
        blocks:
          - type: paragraph
            body: >-
              公开法律和监管证据足以确认真实义务，但不足以完成尽调闭环。DDN 的隐私政策显示，公司在支持、营销、账户管理和跨境传输中承担有意义的数据处理责任。先进计算基础设施出口管制，为任何参与全球 AI
              建设的供应商制造了可信的地缘政治约束；主权 AI 定位也增加了会影响部署的司法辖区和政策制度数量。与此同时，已收集材料没有清楚呈现诉讼历史、IP
              纠纷或正式安全保障。两者叠加形成熟悉的不对称：合规暴露面显然真实，但 DDN 用成熟控制管理它的证据，比产品叙事更薄。
