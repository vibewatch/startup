      - number: '7.3'
        title: 运营、伙伴与客户风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，DDN 正在卖进出错成本很高的困难环境。支撑溢价定价的复杂性，也提高了部署、可用性、安全和支持的要求。NVIDIA
              对齐是一项重要资产，也是一项依赖；云托管和伙伴主导路线有助于触达客户，却可能稀释利润率并模糊客户所有权。客户集中度是另一个主要传导通道。公开
              客户名单很宽，但许多最强案例都是超大账户。这对可信度很好，对收入也可能很好，但它也带来一种可能：少数关系同时主导增长和被感知的市场领导力。正确解读不是 DDN 脆弱，而是收入引擎可能比营销表面看起来更不平滑。
