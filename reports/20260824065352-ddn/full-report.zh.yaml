            body: >-
              对一家仍常被存储产品定义的公司来说，DDN 的客户基础异常宽。公开案例覆盖 xAI、Bitdeer 这类 AI 实验室和 GPU 云客户，NVIDIA 这类战略生态名称，Core42、C-DAC
              这类主权或国家算力环境，Purdue、NCSA、Helmholtz Munich、University of Florida 等高校和研究机构，以及 Jump
              Trading、Roche、TotalEnergies
              等企业或行业买家。这种宽度支撑了跨买家类型的分层叙事，但还没有揭示收入如何在这些类型之间分布。公开集合更擅长点名机构，却不擅长拆清每个账户里的买方、运营方、终端用户和预算所有者；因此，战略地图比经济地图更清楚。多样性本身有意义：它意味着
              DDN 解决的是一类能够跨地域、跨垂直行业迁移的数据基础设施问题，而不是单一小众账户模式。
