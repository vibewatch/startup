- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Rows focus on the public infrastructure and storage comparables most useful for framing DDN’s implied revenue multiple; the set is illustrative rather than exhaustive.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - NetApp
    - Market cap / revenue
    - ~$37.7B / ~$6.9B ≈ ~5.4x
    - Close storage and data-management adjacency
    - Public company with broader disclosure and mature mix
  - - Pure Storage
    - Market cap / revenue
    - ~$22.4B / ~$3.66B ≈ ~6.1x
    - Modern storage comp with stronger software profile
    - Still not a perfect private AI-infra analog
  - - HPE
    - Market cap / revenue
    - ~$70.8B / ~$38.8B ≈ ~1.8x
    - Shows downside multiple for broader hardware-heavy infra
    - Mix and scale are much broader than DDN
  - - IBM
    - Market cap / revenue
    - ~$222.0B / ~$68.9B ≈ ~3.2x
    - Illustrates diversified infra/software benchmark
    - Too diversified to be a pure storage comp
  - - Oracle
    - Market cap / revenue
    - ~$421.9B / ~$67.35B ≈ ~6.3x
    - Shows what software-rich infrastructure exposure can command
    - Far larger and more software-rich than DDN
  notes: DDN’s implied ~5x on a $1B revenue narrative sits inside the public range, but the discount for lower disclosure should remain meaningful.
  claimRefs:
