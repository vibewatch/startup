  - CV019
  - CV020
  - CV021
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Flagship concentration worse than expected
    - Top-customer mix materially dominates revenue
    - Durability and multiple quality fall
    - Step back or demand better terms
  - - Renewal / cohort weakness
    - Expansion is low or churn is meaningful
    - Bull case breaks
    - Re-underwrite to base/bear
  - - Margin mix disappointment
    - Software/services mix lower than implied
    - Premium multiple weakens
    - Increase discount or pass
  - - Platform attach weakness
    - Newer modules do not stick in major accounts
    - AI-platform thesis weakens
    - Downgrade strategic-premium view
  - - Legal / security surprise
    - Material litigation or control issues appear
    - Confidence drops sharply
    - Pause or terminate diligence
  notes: These are monitorable triggers that connect directly to whether DDN deserves a premium late-stage multiple.
