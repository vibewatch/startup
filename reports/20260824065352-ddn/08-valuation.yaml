  - CV028
  - CV033
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Customer concentration
    - Top-10 customer mix and expansion histories
    - Concentration changes durability and valuation multiple
    - Finance + sales ops data room
  - - Renewal quality
    - Cohort retention, NRR, GRR, churn
    - Needed to distinguish strategic relevance from revenue quality
    - Finance data room
  - - Product-line margins
    - Hardware vs software/services economics
    - Determines whether DDN deserves software-like premium
    - CFO / FP&A review
  - - Capital structure
    - Preference stack, liquidation rights, secondary history
    - Needed for real return math
    - Legal + cap table review
  - - Legal / security
    - Litigation schedule, audit evidence, incident history
    - Protects against hidden downside
    - Counsel + security diligence
  notes: Without these items, the recommendation should remain conditional rather than strongly affirmative.
