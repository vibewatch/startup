  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue approaches or surpasses $1B with durable platform attach, better software mix, diversified flagship growth
    - Could justify premium multiple expansion and valuation materially above prior mark
    - Need proof on retention and platform attach
    - Possible but not base
  - - Base
    - Strong growth continues but disclosure remains partial and economics are good-not-perfect
    - Supports valuation roughly around or modestly above prior mark
    - Multiple capped by opacity
    - Highest-probability
  - - Bear
    - Growth normalizes, concentration is high, and economics look more systems-heavy
    - Multiple compresses toward broader infra hardware peers
    - Downside mostly via multiple compression
    - Real and non-trivial
  notes: Scenarios are meant to bracket valuation support, not to imply point-estimate certainty.
