- id: capitalization-and-cover-metrics
  title: Capitalization, valuation, and cover metrics
  body: 'The defining capital event in DDN’s public record is Blackstone’s January 2025 investment: $300 million at a stated $5 billion valuation. Both DDN and Blackstone frame the round as fuel for further rapid growth rather than rescue capital, and CRN’s interview with Paul Bloch makes the motive explicit: acceleration of R&D, processes, reseller and OEM partnerships, and broader executive-level selling. The deal is notable because DDN and Blackstone each describe it as the first outside institutional capital after more than two decades of profitable private ownership. Third-party trackers add that lifetime funding likely sits near $310 million, implying the Blackstone round dominates the company’s capitalization history. Public cover metrics are therefore asymmetrical. Valuation, round size, GPU footprint, and selected historical revenue milestones are fairly visible. By contrast, current headcount, audited 2025 revenue, exact ownership splits, debt, and preference terms remain opaque.
    AI Weekly and Welcome.AI both repeat management guidance that revenue could reach roughly $1 billion in 2026 after about $500 million in 2025, but those figures remain company guidance rather than audited filings and should be treated as medium-confidence at best.'
  claimRefs:
