  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: Post-2025 cap table, board rights, liquidation preferences, and any debt or structured terms attached to the Blackstone investment.
    whyItMatters: Headline valuation can materially overstate common-equity value if preferences or investor protections are substantial.
    diligencePath: Request the term sheet, cap table, and board observer documents from management or lead investor.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An authoritative current employee count and geographic employee distribution.
    whyItMatters: Operating leverage and service capacity cannot be judged cleanly without current staffing data.
    diligencePath: Request the latest org chart or payroll/headcount dashboard broken out by function and region.
    relatedQuestionRefs:
    - QO005
    - QO019
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: current-revenue
    missingEvidence: Audited 2025 revenue, backlog, and 2026 run-rate reconciliation versus public guidance.
    whyItMatters: The public 2026 revenue guide is central to valuation framing but remains unaudited and could overstate durable economics.
    diligencePath: Request audited 2024-2025 financials plus 2026 monthly actuals versus budget.
    relatedQuestionRefs:
    - QO017
    - QO018
    - QO025
  - type: missing-source
    severity: material
    topic: leadership-governance
    missingEvidence: A full current board list, committee structure, and complete C-suite roster after the Blackstone transaction.
    whyItMatters: The published leadership page shows only a subset of governance information, limiting diligence on control, succession depth, and sponsor influence.
    diligencePath: Request the board deck cover page, current org chart, and governance committee roster from management.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
    - TO002
