      - number: '7.2'
        title: Legal, regulatory, and security risk
        blocks:
          - type: paragraph
            body: >-
              Public legal and regulatory evidence is enough to establish real obligations but not enough to close
              diligence. DDN’s privacy policy shows meaningful data-handling responsibilities across support, marketing,
              account management, and cross-border transfer. Export controls on advanced-computing infrastructure create
              a plausible geopolitical constraint for any vendor participating in global AI buildouts, and sovereign-AI
              positioning increases the number of jurisdictions and policy regimes that can affect deployments. At the
              same time, the gathered set does not provide a clean picture of litigation history, IP disputes, or formal
              security assurance. That combination produces a familiar asymmetry: the compliance surface is clearly
              real, but the proof that DDN is managing it with mature controls is thinner than the product narrative.
