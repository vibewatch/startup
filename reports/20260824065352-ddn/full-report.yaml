      - number: '1.2'
        title: Leadership, governance, and founder dependence
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is central to the DDN narrative. Alex Bouzari remains CEO and Paul Bloch remains a
              co-founder and top operating leader, while the published leadership bench shows a broader executive layer
              including product, finance, technical support, and technology leaders. That continuity is a real
              governance strength for a complex infrastructure company whose advantage depends on long-lived engineering
              and customer relationships. It also creates classic key-person risk. Public evidence still ties strategic
              direction, investor messaging, and category positioning heavily to Bouzari and Bloch, so any transition
              would be material. The January 2025 Blackstone investment did not turn DDN into a passive portfolio
              company: Blackstone appears directly on the leadership page, making the investor’s governance role visible
              in a way that suggests meaningful strategic involvement. New 2026 appointments in legal and people
              leadership reinforce that DDN is building managerial depth for a larger global operating footprint, but
              the complete board roster and exact post-deal control terms are still not fully public.
