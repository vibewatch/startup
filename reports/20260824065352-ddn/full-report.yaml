      - number: '7.5'
        title: Mitigations, triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The case for DDN is not that risks are small; it is that risks are legible and potentially manageable if
              diligence is rigorous. The best visible mitigations are fresh capital, broad strategic relevance,
              ecosystem validation, and customer breadth across multiple end markets. But narrative comfort is not
              enough at this valuation. Investors need monitorable triggers: evidence of partner-route mix worsening,
              flagship customers failing to expand, inference-era modules not sticking, support incidents increasing, or
              policy friction delaying sovereign and cross-border programs. Mandatory diligence items remain clear:
              security controls, litigation and claims history, product-line economics, top-customer concentration,
              customer cohorts, and the operational maturity of new platform layers. Price discipline is therefore part
              of mitigation, not a substitute for it.
