  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              DDN’s monetization model is broader than “sell a storage box.” The public product and solution set implies
              at least five economic layers: integrated appliances, high-performance file-system software, newer
              data-platform or orchestration software, support and professional services, and managed or cloud-adjacent
              delivery. That breadth matters because it creates more recurring-revenue potential than DDN’s classic
              HPC-storage image suggests. Horizon, cloud services, and managed Lustre relationships all point in that
              direction. At the same time, public pricing is almost completely opaque. There is no useful public
              list-price framework for large deployments, and there is no clean way to separate product revenue from
              support, cloud, or services using public sources alone. This means the revenue model looks strategically
              attractive but financially under-specified from the outside. Buyers are clearly paying for avoided GPU
              waste and operational simplification, not just terabytes.
