  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and overall profile
        blocks:
          - type: paragraph
            body: >-
              DDN’s risk profile starts with a useful distinction: market risk is lower than execution risk. Demand for
              AI and HPC data infrastructure is real, customer proof is real, and capital access improved sharply after
              the Blackstone investment. The harder question is whether those positives translate into a revenue base
              that remains diversified, high quality, and margin-resilient once the AI cycle matures. The public record
              therefore points to a classic late-stage infrastructure pattern: a strong company can still become a
              disappointing investment if a few flagship accounts dominate outcomes, if partner dependence captures too
              much value, or if newer product layers fail to institutionalize as cleanly as the legacy platform. That
              makes diligence quality a true determinant of investment outcome.
