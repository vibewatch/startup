      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Blackstone’s $300 million investment materially reduced near-term financing dependency and signaled
              confidence in DDN’s growth path. Management framed the money as acceleration capital for R&D, go-to-market
              expansion, and partner development, not as a bridge to survival. That supports a positive capital-adequacy
              read. The remaining issue is disclosure quality, not funding availability. Public sources still do not
              provide cash-on-hand, debt, runway, gross margin, retention, or a CFO-level reconciliation of segment
              economics. Third-party trackers are directionally useful for funding history, but they are not a
              substitute for audited financial statements. As a result, the financial verdict is favorable on strategic
              quality and current demand, but only medium confidence on margin durability and recurring-revenue depth. A
              diligence team should assume the business is strong enough to matter and private enough to still surprise.
              In practical terms, the business looks investable, but only after a proper data-room pass. It is exactly
              the sort of late-stage private company that looks strong in principle yet still demands diligence
              discipline on every quality-of-revenue metric.
