  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              The first diligence task is to define the market correctly. DDN does not sell generic enterprise storage
              into undifferentiated file-sharing workloads; it sells data infrastructure that exists to remove
              bottlenecks from AI training, inference, analytics, and classic HPC. That means the included spend is not
              “all storage.” It is the subset of file, object, key-value, orchestration, and managed data services
              bought specifically to keep expensive GPU or supercomputing environments productive. DDN’s own product
              line makes the distinction visible. EXAScaler fits the high-throughput training side, while Infinia and
              newer services address inference and data-management layers. The relevant adjacencies are incumbents such
              as IBM and NetApp, AI-native specialists such as WEKA and VAST, and public-cloud managed services such as
              Google Managed Lustre. Excluded spend should include commodity SMB NAS and office IT collaboration
              storage, where DDN’s performance and sovereignty claims are not the deciding purchase criterion.
