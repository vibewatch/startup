      - number: '5.4'
        title: Trust controls, roadmap, and open gaps
        blocks:
          - type: paragraph
            body: >-
              Trust and control are visible themes in DDN’s 2026 messaging, especially around sovereign AI and
              multi-tenant operation. Public materials mention secure multitenancy, access controls, isolation, and
              encryption, and the federal and sovereign pages reinforce that DDN expects to serve environments where
              governance matters as much as throughput. What remains less visible is the formal assurance layer. The
              source set is thinner on named certifications, external audits, uptime discipline, or incident-management
              process than it is on technical aspiration. The roadmap itself is clearly active: KV-cache integration,
              inference economics, and agentic-AI language all show a platform still evolving quickly. That is positive
              for relevance, but it also means a prudent buyer should ask for hard artifacts — architecture diagrams,
              failure-recovery runbooks, benchmark methodology, and formal compliance evidence — before underwriting the
              platform at face value. For a diligence reader, the central question is not whether the platform is
              ambitious; it is whether the newest control and orchestration layers are already institutionalized with
