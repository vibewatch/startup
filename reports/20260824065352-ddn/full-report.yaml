      - number: '7.4'
        title: Financial and valuation risk
        blocks:
          - type: paragraph
            body: >-
              Financially, the main concern is not near-term liquidity. Blackstone’s investment and DDN’s apparent scale
              reduce that worry. The bigger issue is that investors are being asked to bridge from strategic evidence to
              economic confidence without audited, segment-level transparency. Public reports about fast revenue growth
              help support the upside case, but they do not settle questions about gross margin mix, renewal quality, or
              working-capital dynamics on large deployments. A $5B mark may prove reasonable if DDN continues to
              compound with good software and services attach; it can also prove demanding if the business is more
              hardware- or project-heavy than the headline narrative implies. This is why risk in DDN is best understood
              as valuation-linked execution risk rather than classic startup survival risk.
