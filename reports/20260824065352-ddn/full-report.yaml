      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              DDN’s moat is not best understood as a single benchmark or a single product feature. The strongest
              evidence-backed moat combines long HPC credibility, current MLPerf proof, a real installed base in marquee
              AI environments, and increasingly tight alignment with NVIDIA’s reference stack. That is a good moat, but
              it is not unassailable. Cloud-managed services can compress the value of specialist operations expertise,
              and rival specialists can shift the frame from training storage to full data-platform and
              inference-economics narratives. DDN is also less transparent than public incumbents on pricing, win rates,
              and financial strength, which makes it harder for outsiders to judge how durable its competitive advantage
              really is. The right next step is not to guess. It is to review win/loss data, pricing history, and actual
              segment-by-segment competitor overlap. Until then, the public record supports DDN as a category leader
              with meaningful but not impregnable moat durability. That is especially true as inference economics,
              managed cloud, and bundle power reshape what buyers view as good enough.
