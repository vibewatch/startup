chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, history, and business model
        blocks:
          - type: paragraph
            body: >-
              DDN is one of the older surviving infrastructure specialists in the current AI stack: its official history
              traces the company to 1998, when it was formed from the merger of MegaDrive and ImpactData, and its public
              materials still locate headquarters in Chatsworth, California. What makes the company relevant in 2026 is
              not just age but adaptation. The firm no longer presents itself as a generic storage vendor. Across its
              homepage and product pages, DDN frames itself as a data intelligence platform company that helps customers
              keep AI training, inference, and analytics workloads fed at high throughput and low latency. The
              commercial story is consistent: DDN sells hardware-software systems and related platform software for
              customers running AI factories, cloud GPU services, sovereign AI programs, and traditional HPC
              environments. EXAScaler anchors the training-side parallel-file-system story, while Infinia and newer
              orchestration layers extend the product line into inference and multi-tenant AI operations. That
              positioning matters because it moves DDN from the niche of lab supercomputing into the much larger
              enterprise AI infrastructure budget line.
