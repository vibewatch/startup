  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              The right way to read DDN’s product set is as a multi-module AI data platform rather than a standalone
              storage product. Official materials span EXAScaler, Infinia, Horizon, HyperPOD, and IndustrySync, each
              aimed at a different layer of the customer workflow. EXAScaler remains the training-side throughput
              engine; Infinia extends the platform into inference, RAG, and distributed data services; Horizon targets
              multi-tenant AI operations; HyperPOD packages more system-level AI infrastructure outcomes; and
              IndustrySync adapts the story for vertical workflows. That breadth matters because it moves DDN from a
              narrow file-system conversation into a broader platform conversation. It also creates boundary questions:
              public sources are clear on the technology shape but much less clear on attach rates, product-line
              economics, or how widely each module is deployed in production. That matters strategically because buyers
              increasingly want one vendor narrative covering data preparation, training, inference, and managed
              operations instead of stitching the story together themselves.
