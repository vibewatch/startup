      - number: '4.3'
        title: Cost structure, margin path, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              DDN is not a pure software company, so its economics should not be benchmarked as if they were SaaS. The
              company integrates appliances and supports complex customer environments, which likely creates a lower
              gross-margin ceiling than pure infrastructure software. On the other hand, the market context is
              favorable: if storage is preventing expensive GPUs from being fully utilized, the product can be sold
              against avoided compute waste rather than cheap bytes. That dynamic can support premium economics even in
              a hardware-software mix. Working capital and services still matter. Integrated systems imply inventory and
              deployment planning, and large installations imply implementation, field engineering, and support burdens.
              Relative to a chip vendor or full infrastructure owner, DDN’s capital intensity appears moderate; relative
              to a pure SaaS vendor, it is meaningfully higher. The margin path is therefore likely attractive but
