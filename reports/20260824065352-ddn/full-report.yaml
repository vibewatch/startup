      - number: '2.2'
        title: TAM, SAM, and SOM lenses
        blocks:
          - type: paragraph
            body: >-
              Broad market reports show why investors are excited about AI storage, but they are only a starting point.
              Mordor’s AI-powered storage forecast reaches $27.06 billion in 2025 and $76.6 billion by 2030, while
              Castle Rock describes an enormous HPC and AI storage-plus-data-management opportunity tied to
              checkpointing, replacement cycles, and AI data services. Those top-down numbers are directionally useful:
              they show the category is large, growing quickly, and becoming strategic. They are not DDN’s addressable
              market in practice. DDN’s realistic SAM is narrower because the company is strongest where high-throughput
              shared data layers, sovereignty, or cloud-scale training economics truly matter. That subset includes
              neoclouds, sovereign AI programs, research supercomputing, and advanced enterprise AI factories. The
              realistic SOM is narrower still: only those buyers actively deploying or upgrading these environments in
              the near term. The diligence implication is that DDN can be in a large market without every dollar of
              AI-related storage spend being relevant to its win-rate or pricing power.
