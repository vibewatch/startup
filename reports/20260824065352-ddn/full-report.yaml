      - number: '8.3'
        title: Scenarios, recommendation, and hold discipline
        blocks:
          - type: paragraph
            body: >-
              The base case should carry the highest probability because it best matches the current evidence mix. In
              that case, DDN remains an important AI data-infrastructure company, keeps growing well, and deserves
              continued premium treatment, but not an indiscriminate re-rating. The bull case requires more than
              top-line growth: it requires proof of software-like durability, broader attach into newer platform layers,
              and clear diversification beyond a handful of flagship deployments. The bear case is not business failure.
              It is a more ordinary outcome in which DDN remains relevant but turns out to be more project-heavy, more
              concentrated, or more hardware-weighted than the premium story assumes. Under those conditions, the
              valuation can compress even while the company itself remains good. That is why the recommendation should
              be conditional and milestone-based rather than purely narrative-driven. A disciplined investor should
              therefore think in scenarios and milestones, not in a single heroic extrapolation of AI momentum. Put
              differently, investors should require proof that DDN is compounding as a platform company, not merely
              surfing a temporary procurement wave.
