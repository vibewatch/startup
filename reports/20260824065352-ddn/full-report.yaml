      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand side of the market is strong. Mordor explicitly identifies the GenAI workload explosion and the
              enterprise shift toward on-prem AI as major drivers, while DDN’s own messaging emphasizes GPU utilization,
              faster checkpointing, and lower token economics. Storage has become a performance lever, not a background
              repository. Yet strong demand does not eliminate adoption constraints. Premium AI storage still requires
              meaningful capex or high committed cloud spend; deployment can be slowed by migration complexity,
              operating-model mismatch, or the need for NVIDIA reference-architecture validation. Sovereignty is another
              double-edged factor: it expands demand in public-sector and national AI programs, but it also imposes
              procurement, segmentation, and security burdens that lengthen sales cycles. Finally, large cloud platforms
              and incumbent vendors are moving up the stack, which means DDN is chasing a growing pie while sharing it
              with increasingly capable alternatives. The practical outcome is a market with real tailwinds but
              non-trivial friction in both sales motion and execution.
