        title: Public traction and revenue quality
        blocks:
          - type: paragraph
            body: >-
              The company’s published milestones show substantial scale well before the current AI cycle, culminating in
              a 2021 milestone of $400 million in revenue and 11,000 customers. More recent third-party coverage points
              to about $500 million in 2025 revenue and a roughly $1 billion 2026 guide, which is a dramatic
              acceleration. That acceleration is plausible in context because DDN sits at the infrastructure bottleneck
              of GPU-heavy AI deployments and has marquee customer proof in cloud, finance, life sciences, and energy.
              But the quality caveat matters. Welcome.AI is right to highlight that the 2026 number is guidance rather
              than audited results and that concentration around a small number of large AI contracts could distort
              durability. Public traction is real; public evidence on revenue quality is still incomplete. The
              difference between strategic demand and reportable, durable revenue is therefore the central financial
              question.
