      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              DDN’s customer base looks unusually broad for a company still most often described through its storage
              products. Public references span AI-lab and GPU-cloud customers such as xAI and Bitdeer, strategic
              ecosystem names such as NVIDIA, sovereign or national-compute environments such as Core42 and C-DAC,
              academic and research institutions such as Purdue, NCSA, Helmholtz Munich, and the University of Florida,
              plus enterprise or industry buyers including Jump Trading, Roche, and TotalEnergies. That breadth supports
              a segmentation story across buyer types, but it does not yet reveal how revenue is distributed between
              them. The public set is much better at naming institutions than at separating buyer, operator, end-user,
              and budget owner inside each account, which means the strategic map is clearer than the economic map. The
              diversity itself is meaningful: it implies DDN is solving a class of data-infrastructure problems that
              travels across geographies and verticals, not a single niche account pattern.
