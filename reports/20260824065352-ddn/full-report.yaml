      - number: '3.3'
        title: Distribution power, switching cost, and customer-proof asymmetry
        blocks:
          - type: paragraph
            body: >-
              A strong product story does not erase go-to-market differences. Incumbents and cloud platforms can bundle
              storage with broader infrastructure, which gives them leverage in procurement and lets them absorb part of
              the operations burden. DDN has signaled that it wants broader reseller and OEM reach, but its public
              channel visibility is still thinner than the major incumbents’. At the same time, switching costs in DDN’s
              core segment are meaningful. Once a cluster standardizes on a shared data layer, changing vendors means
              moving pipelines, re-running benchmarks, and retraining operations teams. That creates real lock-in,
              although multi-homing is possible across separate workload layers or separate clusters. Customer-proof
              asymmetry matters here: AI-native specialists with named AI-factory wins have an easier time proving
              readiness than incumbents whose public references are thinner or more generalized. DDN benefits from that
              asymmetry today, but cloud-managed options could blunt it if buyers decide convenience beats peak control.
            claimRefs:
