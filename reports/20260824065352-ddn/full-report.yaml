      - number: '1.4'
        title: Milestones and customer proof
        blocks:
          - type: paragraph
            body: >-
              DDN’s own historical timeline shows a business that had already achieved material scale before the current
              AI boom: more than $100 million in annual revenue by 2008, more than $200 million by 2011, 70% penetration
              of the TOP500 by 2016, and a 2021 milestone of $400 million in annual revenue with 11,000 customers. The
              company then broadened beyond classic HPC storage through acquisitions, including Intel’s Lustre team and
              Tintri assets in 2018 and IntelliFlash plus Nexenta in 2019. What changed in 2024-2026 is not that DDN
              suddenly became real, but that the market started valuing its capabilities as essential to AI-factory
              economics. Customer proof now stretches from NVIDIA’s own internal AI factories to xAI’s Colossus-scale
              buildout, Core42 sovereign AI infrastructure, and TotalEnergies’ next-generation Pangea 5 supercomputer.
              Those references support the claim that DDN has crossed from research and government prestige into
              commercial AI infrastructure relevance. The caution is that public proof is still much better on marquee
              deployments than on the underlying economics of those contracts.
