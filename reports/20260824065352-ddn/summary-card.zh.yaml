  topStrengths:
    - AI/HPC 数据基础设施战略位置强，产品深度已覆盖训练、推理、编排和主权 AI 工作流。
    - xAI、NVIDIA、TotalEnergies 以及主要 HPC 机构等标杆 AI、企业和科研客户，给出了可信客户证明。
    - 市场底色仍然有利：独立来源继续显示，AI 存储和数据基础设施需求到 2030 年仍会强劲增长。
    - Blackstone 的 $300 million 投资验证了公司质量，也缓解了近期融资压力。
    - 如果据报道 2026 年收入约 $1 billion 的路径属实，DDN 隐含收入倍数与部分上市基础设施可比公司相比并不明显离谱。
  topRisks:
    - 公开证据在客户集中度、续约和 cohort 持久性上仍很薄，而这些变量正是判断 DDN 是否配得上溢价倍数的关键。
    - 产品线毛利和软件占比不透明，留下一个风险：这门生意可能比溢价 AI 平台叙事更偏系统或项目型。
    - 对旗舰客户、NVIDIA 协同以及合作伙伴 / 托管服务路径的依赖，可能带来集中度或利润分成风险。
    - 诉讼历史、正式安全保障和资本结构条款公开不足，无法充分承销下行风险。
    - 以 $5B 价格进入，即便公司不错，只要增长正常化，或尽调披露的质量弱于公开叙事，回报也可能平庸。
  unresolvedGaps:
    - 旗舰 AI 和主权客户的头部客户集中度、续约 cohort、NRR/GRR，以及扩张历史。
    - 产品线毛利率、软件 / 服务绑定情况，以及传统存储与新平台层之间的贡献经济性。
    - 完整诉讼、IP、质保和索赔清单，以及任何重大安全审计或事件历史。
    - 股权结构表和条款细节，包括优先权、清算权、老股交易历史和其他投资人保护。
    - 新推理和编排层能像 DDN 传统文件系统核心一样在生产环境中长期留存的证据。
