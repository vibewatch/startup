chapter:
  number: 5
  title: Product & Tech
  summary: DDN’s product story has expanded meaningfully beyond classic parallel file systems. EXAScaler still anchors the training-side architecture, but Infinia, Horizon, HyperPOD, and newer workflow packaging show a deliberate push into inference, orchestration, and multi-tenant AI-factory operations. The strongest technical edge in public evidence is DDN’s close NVIDIA integration and current benchmark credibility; the largest remaining gaps are around formal security certifications, operational runbooks, and which claimed performance gains are independently verifiable.
sections:
- id: product-definition-and-modules
  title: Product definition and module map
  body: 'The right way to read DDN’s product set is as a multi-module AI data platform rather than a standalone storage product. Official materials span EXAScaler, Infinia, Horizon, HyperPOD, and IndustrySync, each aimed at a different layer of the customer workflow. EXAScaler remains the training-side throughput engine; Infinia extends the platform into inference, RAG, and distributed data services; Horizon targets multi-tenant AI operations; HyperPOD packages more system-level AI infrastructure outcomes; and IndustrySync adapts the story for vertical workflows. That breadth matters because it moves DDN from a narrow file-system conversation into a broader platform conversation. It also creates boundary questions: public sources are clear on the technology shape but much less clear on attach rates, product-line economics, or how widely each module is deployed in production. That matters strategically because buyers increasingly want one vendor narrative covering data preparation, training,
    inference, and managed operations instead of stitching the story together themselves.'
