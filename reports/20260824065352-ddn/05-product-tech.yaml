- id: architecture-and-dependencies
  title: Architecture, integration, and dependencies
  body: 'Architecturally, DDN is now selling both a data plane and an operating model. EXAScaler remains the canonical high-performance file-system layer for training, while Infinia introduces an inference-oriented data layer that explicitly talks about KV-cache, RAG, and real-time data flow. Horizon adds an orchestration surface for secure multi-tenancy and self-service. The platform is deeply tied to the NVIDIA ecosystem: DDN’s own materials and NVIDIA references position compatibility and high-performance data movement as essential. Google Managed Lustre powered by DDN technology shows how the architecture can also surface as a cloud-managed service instead of only as a direct appliance deployment. This makes DDN more flexible, but also means part of its differentiation depends on partner ecosystems and evolving interface standards that it does not fully control. The resulting architecture is powerful, but it also creates a real diligence burden around interoperability, versioning, and
    partner-controlled release cadence.'
