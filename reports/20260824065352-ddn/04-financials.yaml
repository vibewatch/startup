  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-acquisition-economics
    missingEvidence: Actual sales-cycle length, CAC, payback, and partner contribution by segment.
    whyItMatters: The business may be highly attractive, but without GTM efficiency data it is impossible to judge scalability of growth.
    diligencePath: Request cohort-level sales efficiency and channel-contribution data.
