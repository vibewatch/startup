- id: operational-partner-and-customer-risk
  title: Operational, partner, and customer risk
  body: Operationally, DDN is selling into difficult environments where mistakes are expensive. The same complexity that supports premium pricing also raises the burden on deployment, uptime, security, and support. NVIDIA alignment is a major asset, but also a dependency; cloud-managed and partner-led routes help reach customers, yet can dilute margin and obscure customer ownership. Customer concentration is the other major transmission channel. The public logo set is broad, but many of the strongest references are very large accounts. That is excellent for credibility and potentially excellent for revenue, but it raises the possibility that a small number of relationships dominate both growth and perceived market leadership. The right interpretation is not that DDN is fragile, but that the revenue engine may be lumpier than the marketing surface suggests.
  claimRefs:
  - CR009
  - CR011
  - CR012
  - CR013
  - CR015
  - CR031
  - CR032
  - CR037
  tableRefs:
  - TR002
  - TR003
