  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Segment-by-segment win/loss records showing which vendors DDN actually faces, why it wins, and where it loses on capability or pricing.
    whyItMatters: Public competitor pages do not reveal the real overlap set or whether DDN’s moat holds in live procurement.
    diligencePath: Request the last 12 months of enterprise, neocloud, and sovereign AI win/loss files.
    relatedQuestionRefs:
    - QP005
    - QP013
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: pricing-visibility
    missingEvidence: Actual packaging, discounting, support attach, and TCO comparisons across DDN and its main rivals.
    whyItMatters: Public pricing opacity makes it impossible to know whether DDN wins on economics, performance, or both.
    diligencePath: Collect live quotes or procurement snapshots for three to five representative cluster sizes.
    relatedQuestionRefs:
    - QP012
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: competitor-evidence-gap
    missingEvidence: Neutral third-party testing or detailed customer references for vendors whose claims are mostly vendor-issued.
    whyItMatters: Benchmark asymmetry can make one vendor look stronger simply because others disclose less or choose different proof.
    diligencePath: Gather analyst or customer validation on VAST, WEKA, and managed-cloud alternatives from current buyers.
    relatedQuestionRefs:
    - QP008
    - QP009
    - QP010
    relatedTableRefs:
    - TP001
    - TP002
  - type: conflicting-data
    severity: minor
    topic: cloud-substitution
    missingEvidence: Evidence on where managed cloud is already displacing direct specialist storage in production AI-factory accounts.
    whyItMatters: This is the most credible route for moat compression but is hard to quantify from vendor-owned sources.
    diligencePath: Interview cloud-first buyers and review renewal/displacement cases.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
