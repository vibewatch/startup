- id: customer-verdict-and-diligence-asks
  title: Customer verdict and diligence asks
  body: Customer proof is a net strength for DDN, but customer analytics remain a net gap. The named-reference set is strong enough to support the claim that DDN is serving serious AI, research, and enterprise workloads in production-like settings. It is not strong enough to support a confident view on retention quality, expansion velocity, or concentration tolerance. That distinction matters because late-stage infrastructure companies can look equally impressive from the outside whether they are broadly diversified or simply anchored by a handful of very large programs. The right next step for diligence is therefore not more logos; it is cohort data, renewal histories, top-customer exposure, and evidence that newer AI-era customers are expanding into the broader platform rather than stopping at an initial storage deployment. For a late-stage valuation, that missing durability evidence is too important to waive away as a normal private-company omission.
  claimRefs:
  - CU031
  - CU032
  - CU033
  tableRefs: []
