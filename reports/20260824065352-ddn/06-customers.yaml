company:
  name: DDN
chapter:
  number: 6
  title: Customers
  summary: 'DDN’s public customer evidence is better than its public economics. The company can point to a broad mix of AI labs, sovereign or public compute programs, universities, life-science institutions, finance, and energy customers, and several of those references look like real production environments rather than lightweight pilots. What remains missing is the durability layer: public sources do not disclose renewal, churn, NRR, or top-customer concentration, so the logo set proves adoption quality more confidently than it proves retention or revenue diversification.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'DDN’s customer base looks unusually broad for a company still most often described through its storage products. Public references span AI-lab and GPU-cloud customers such as xAI and Bitdeer, strategic ecosystem names such as NVIDIA, sovereign or national-compute environments such as Core42 and C-DAC, academic and research institutions such as Purdue, NCSA, Helmholtz Munich, and the University of Florida, plus enterprise or industry buyers including Jump Trading, Roche, and TotalEnergies. That breadth supports a segmentation story across buyer types, but it does not yet reveal how revenue is distributed between them. The public set is much better at naming institutions than at separating buyer, operator, end-user, and budget owner inside each account, which means the strategic map is clearer than the economic map. The diversity itself is meaningful: it implies DDN is solving a class of data-infrastructure problems that travels across geographies and verticals, not a single niche
    account pattern.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
