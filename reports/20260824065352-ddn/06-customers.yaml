- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration
  body: The public record gets much weaker once the question shifts from “who uses DDN?” to “how durable and diversified is the revenue base?” No public NRR, GRR, churn, or standardized customer-satisfaction measures were found. The best indirect durability signals are repeatable fit with mission-critical environments and the fact that DDN can still cite long-cycle research customers while also adding current AI names. That suggests the platform is not a one-era product. But it does not answer the central underwriting questions around renewals, contract length, or whether new AI customers expand meaningfully after the first deployment. Concentration risk is likely material precisely because the visible names are large and strategic. When a customer list is topped by hyperscale-adjacent AI programs and giant compute environments, a small number of accounts can move revenue disproportionately even if the overall logo roster is long. The lack of disclosed cohorts means expansion is still more
    of a credible mechanism than a quantified fact, and that distinction should stay explicit.
  claimRefs:
  - CU020
