  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A single reconciled sizing model that isolates the segment where DDN’s premium shared-data architecture is truly required.
    whyItMatters: Broad TAM headlines can materially overstate the company’s practical addressable spend and distort valuation expectations.
    diligencePath: Build a bottoms-up model from GPU-cluster counts, storage intensity per GPU, and average deal size by segment.
    relatedQuestionRefs:
    - QM005
    - QM006
    - QM007
    - QM008
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: ddn-market-share
    missingEvidence: DDN revenue mix by hyperscaler, sovereign AI, enterprise AI, and legacy HPC segments.
    whyItMatters: Without segment mix, the SAM and SOM lens cannot be tied cleanly to DDN’s actual starting position or win-rate.
    diligencePath: Request segment revenue bridges, top-customer mix, and pipeline by vertical from management.
    relatedQuestionRefs:
    - QM010
    - QM022
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owners
    missingEvidence: Real procurement records showing who signs, who pays, and what metrics unlock approval in representative DDN deals.
    whyItMatters: Buyer mapping drives sales-cycle assumptions and determines whether DDN can expand from technical buyers to executive budget owners.
    diligencePath: Review three to five recent deal files across hyperscaler, sovereign, and enterprise segments.
    relatedQuestionRefs:
    - QM014
    - QM023
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: training-vs-inference-split
    missingEvidence: Hard revenue split or pipeline split between training-oriented storage and inference-oriented data services.
    whyItMatters: The market narrative is shifting toward inference economics, but DDN’s economic exposure to that shift is not publicly quantified.
    diligencePath: Request product-line ARR, bookings, and attach-rate data for EXAScaler, Infinia, and orchestration layers.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM001
    - TM004
