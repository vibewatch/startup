- id: buyer-segmentation
  title: Buyer, user, and budget-owner segmentation
  body: 'Buyer segmentation in this market follows deployment model more than company size. In hyperscaler-adjacent and neocloud environments, the buyer is typically an infrastructure platform team tasked with monetizing GPU fleets while protecting service-level performance. In sovereign AI programs, the decision can sit with a national or public-sector compute authority that values residency, tenancy isolation, and strategic control as much as throughput. In enterprise AI factories, the buying center becomes broader: infrastructure engineering, research, security, and executive sponsors all influence the decision because storage affects both model productivity and return on GPU capital. The users after purchase are platform engineers, MLOps teams, researchers, and inference operators rather than office-storage admins. This explains why managed offerings such as Google’s Managed Lustre matter: some buyers want parallel-file-system performance without recreating the full operational complexity
    of an HPC shop. It also explains why DDN increasingly talks in the language of AI factories and inference economics rather than only in file-system benchmarks.'
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM017
