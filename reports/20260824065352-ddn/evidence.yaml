evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Post-2025 cap table, board rights, liquidation preferences, and any debt or structured terms attached to the
      Blackstone investment.
    whyItMatters: >-
      Headline valuation can materially overstate common-equity value if preferences or investor protections are
      substantial.
    diligencePath: Request the term sheet, cap table, and board observer documents from management or lead investor.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An authoritative current employee count and geographic employee distribution.
    whyItMatters: Operating leverage and service capacity cannot be judged cleanly without current staffing data.
    diligencePath: Request the latest org chart or payroll/headcount dashboard broken out by function and region.
    relatedQuestionRefs:
      - QO005
      - QO019
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: current-revenue
    missingEvidence: Audited 2025 revenue, backlog, and 2026 run-rate reconciliation versus public guidance.
    whyItMatters: >-
      The public 2026 revenue guide is central to valuation framing but remains unaudited and could overstate durable
      economics.
    diligencePath: Request audited 2024-2025 financials plus 2026 monthly actuals versus budget.
    relatedQuestionRefs:
      - QO017
      - QO018
      - QO025
  - type: missing-source
    severity: material
    topic: leadership-governance
    missingEvidence: A full current board list, committee structure, and complete C-suite roster after the Blackstone transaction.
    whyItMatters: >-
      The published leadership page shows only a subset of governance information, limiting diligence on control,
      succession depth, and sponsor influence.
    diligencePath: Request the board deck cover page, current org chart, and governance committee roster from management.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A single reconciled sizing model that isolates the segment where DDN’s premium shared-data architecture is truly
      required.
    whyItMatters: >-
      Broad TAM headlines can materially overstate the company’s practical addressable spend and distort valuation
      expectations.
    diligencePath: Build a bottoms-up model from GPU-cluster counts, storage intensity per GPU, and average deal size by segment.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: ddn-market-share
    missingEvidence: DDN revenue mix by hyperscaler, sovereign AI, enterprise AI, and legacy HPC segments.
    whyItMatters: Without segment mix, the SAM and SOM lens cannot be tied cleanly to DDN’s actual starting position or win-rate.
    diligencePath: Request segment revenue bridges, top-customer mix, and pipeline by vertical from management.
    relatedQuestionRefs:
      - QM010
      - QM022
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owners
    missingEvidence: >-
      Real procurement records showing who signs, who pays, and what metrics unlock approval in representative DDN
      deals.
    whyItMatters: >-
      Buyer mapping drives sales-cycle assumptions and determines whether DDN can expand from technical buyers to
      executive budget owners.
    diligencePath: Review three to five recent deal files across hyperscaler, sovereign, and enterprise segments.
    relatedQuestionRefs:
      - QM014
      - QM023
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: training-vs-inference-split
    missingEvidence: Hard revenue split or pipeline split between training-oriented storage and inference-oriented data services.
    whyItMatters: >-
      The market narrative is shifting toward inference economics, but DDN’s economic exposure to that shift is not
      publicly quantified.
    diligencePath: Request product-line ARR, bookings, and attach-rate data for EXAScaler, Infinia, and orchestration layers.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM001
      - TM004
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Segment-by-segment win/loss records showing which vendors DDN actually faces, why it wins, and where it loses on
      capability or pricing.
    whyItMatters: Public competitor pages do not reveal the real overlap set or whether DDN’s moat holds in live procurement.
    diligencePath: Request the last 12 months of enterprise, neocloud, and sovereign AI win/loss files.
    relatedQuestionRefs:
      - QP005
      - QP013
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: pricing-visibility
    missingEvidence: Actual packaging, discounting, support attach, and TCO comparisons across DDN and its main rivals.
    whyItMatters: Public pricing opacity makes it impossible to know whether DDN wins on economics, performance, or both.
    diligencePath: Collect live quotes or procurement snapshots for three to five representative cluster sizes.
    relatedQuestionRefs:
      - QP012
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-evidence-gap
    missingEvidence: Neutral third-party testing or detailed customer references for vendors whose claims are mostly vendor-issued.
    whyItMatters: >-
      Benchmark asymmetry can make one vendor look stronger simply because others disclose less or choose different
      proof.
    diligencePath: Gather analyst or customer validation on VAST, WEKA, and managed-cloud alternatives from current buyers.
    relatedQuestionRefs:
      - QP008
