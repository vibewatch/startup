callouts:
  - calloutType: risk
    title: Product Reclassification Threatens High-Margin Pick'em Engine
    body: >-
      The regulatory shift from treating pick'em player predictions as skill-based fantasy sports to classifying them as
      unlicensed sports betting directly targets Underdog Fantasy's most lucrative and viral consumer engagement
      mechanic. While the transition to peer-to-peer Champions contests in Florida and New Jersey demonstrates
      remarkable regulatory adaptability, peer-to-peer prize structures alter unit economics and liquidity requirements
      compared to traditional against-the-house pick'em.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
  - calloutType: insight
    title: NFL Seasonality Creates Extreme Capital and Operational Asymmetry
    body: >-
      With revenue reportedly doubling in a single month during the autumn peak, Underdog Fantasy operates under severe
      seasonal cash flow asymmetry. Infrastructure, headcount, and regulatory defense must be scaled to withstand peak
      NFL Sunday concurrent loads, yet sustained during the multi-month spring and summer sports lull, increasing
      dependence on outside capital reserves.
    claimRefs:
      - CR012
      - CR013
      - CR015
