callouts:
  - calloutType: "risk"
    title: "Regulatory Hold Risk and Legal Settlement Exposure"
    body: |
      Underdog's core high-margin Pick'em product operates in an intensifying state regulatory crosswind. With New York mandating an $18M settlement over licensing non-compliance and class-action lawsuits challenging Pick'em as unlicensed sports betting, any state-level restriction or legal reclassification poses immediate downward pressure on top-line handle and realized margins.
    claimRefs:
      - "CI002"
      - "CI011"
  - calloutType: "insight"
    title: "Proprietary Tech Margin Advantage Versus M&A Debt Realities"
    body: |
      Building proprietary sportsbook software gave Underdog an important technological differentiator over white-label competitors, supporting a 2.8x revenue multiple in its $1.3B IG Group buyout. However, the transaction terms revealed approximately $160M in outstanding debt and required positive 2026 EBITDA earnout hurdles, indicating that scaling consumer sports operations entailed substantial capital burn.
    claimRefs:
      - "CI006"
      - "CI012"
      - "CI013"
