    Stakenborg, and Trevor John. It scaled through paid fantasy contests, Pick'em products, sportsbook wagering, and
    event contracts, then agreed in 2026 to be acquired by IG Group for up to $1.3 billion while continuing to face
    substantial regulatory scrutiny.
