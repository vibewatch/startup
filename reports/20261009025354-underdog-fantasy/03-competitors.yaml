callouts:
  - calloutType: "insight"
    title: "The Fantasy-to-Sportsbook CAC Arbitrage"
    body: "The core strategic logic of Underdog Fantasy is customer acquisition arbitrage. Incumbent sportsbooks spend $500 to $800 to acquire a single bettor via paid media, whereas Underdog leverages Best Ball tournaments and Pick'em games to acquire sports fans for $50 to $80. If Underdog can successfully migrate its fantasy audience onto its proprietary sportsbook, it secures massive structural acquisition efficiencies against DraftKings and FanDuel."
    claimRefs:
      - "CP002"
      - "CP007"
  - calloutType: "risk"
    title: "Pick'em Regulatory Reclassification as an Existential Headwind"
    body: "Player-prop pick'em games represent Underdog's primary daily revenue engine but face escalating regulatory risk. With state gaming commissions in New York, Florida, and other jurisdictions classifying pick'em as unlicensed sports gambling, Underdog faces heavy fines, class-action litigation, and forced operational transitions to lower-margin peer-to-peer or licensed sportsbook models."
    claimRefs:
      - "CP002"
      - "CP010"
      - "CP011"
      - "CP012"
