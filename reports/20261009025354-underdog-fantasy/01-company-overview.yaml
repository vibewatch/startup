chapter:
  number: 1
  title: "Company Overview"
  summary: "Underdog Fantasy is a Brooklyn-based sports gaming company founded in 2020 by Jeremy Levine, Brandon Stakenborg, and Trevor John that scaled through paid daily fantasy sports and Pick'em contests before reaching a $1.225 billion Series C valuation and agreeing to be acquired by London-listed IG Group for up to $1.3 billion in 2026."
sections:
  - id: "corporate-identity-and-leadership"
    title: "Corporate Identity, Founding Team, and Governance"
    body: |
      Underdog Sports, LLC (doing business as Underdog Fantasy) is a sports gaming and prediction platform founded in 2020 and headquartered at 150 Waterbury Street in Brooklyn, New York. The business was established by serial fantasy sports entrepreneur Jeremy Levine alongside co-founders Brandon Stakenborg and Trevor John, drawing upon previous executive and engineering experience from earlier sports gaming ventures including StarStreet and DRAFT. Levine serves as founder and Chief Executive Officer, acting as the public leader and primary strategic architect behind Underdog's product positioning and legal navigation, while Stakenborg and John oversaw mobile product development and technical architecture. The wider operational executive team historically included Chief Operating Officer and Chief Financial Officer Dustin Cooper, General Counsel Nicholas Green, and Chief Marketing Officer Elizabeth Marro.

      Corporate governance evolved from a founder-controlled venture cap table toward institutional board representation. Early equity financing rounds brought institutional oversight from lead venture firms Spark Capital, Acies Investments, and BlackRock, alongside strategic athlete and media syndicates. Governance reached a transformative transition in July 2026 when London-listed trading and prediction-markets provider IG Group Holdings plc entered into a definitive agreement to acquire Underdog for total potential consideration of up to $1.3 billion. Upon closing, ultimate governance oversight shifts from private venture board delegates to IG Group's public board of directors, while founder Jeremy Levine continues leading operational execution within the enlarged corporate group.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-scale-metrics"
    title: "Financing History, Secondary Liquidity, and Scale Metrics"
    body: |
      Underdog Fantasy financed its high-velocity expansion across four primary capital raises, accumulating approximately $115 million to $145 million in total paid-in equity capital. The company closed a $10 million celebrity and angel seed round in May 2021 backed by Mark Cuban and Kevin Durant's Thirty Five Ventures, followed by a $35 million Series B financing in July 2022 co-led by BlackRock and Acies Investments at a post-money valuation of $485 million. In March 2025, Underdog secured its landmark unicorn Series C round led by Spark Capital, raising an initial tranche of $70 million toward an expanded $100 million round at a pre-money valuation of $1.225 billion to $1.23 billion. Secondary trading on the Nasdaq Private Market (NPM) ATS tracked private share valuations indicating a per-share price of $9.69 in September 2026.

      Operating scale indicators reflect substantial retail market penetration alongside notable private disclosure constraints. The company serves over 4 million registered accounts and more than 2.4 million active participants across 40 eligible states, having distributed over $2 billion in cumulative customer prize payouts. Full-time headcount expanded to between 250 and 520 personnel before restructuring, which included approximately 125 workforce reductions in early 2026 as the organization streamlined costs. Annual net revenues have been estimated between $73.4 million and $466 million across private analyst trackers, though audited gross gaming revenues, state-by-state take rates, and cash burn remain confidential private company gaps.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO001"
