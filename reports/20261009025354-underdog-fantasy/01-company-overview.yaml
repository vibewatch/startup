callouts:
  - calloutType: "insight"
    title: "Strategic Transition to Federal Prediction Markets"
    body: |
      Underdog's acquisition of Aristotle Exchange and pending sale to IG Group highlight a calculated shift away from fragmented, highly contentious state-level fantasy sports licensing. By converting sports predictions into CFTC-regulated derivatives contracts, Underdog attempts to insulate its core wagering mechanics from aggressive state gaming commissions.
    claimRefs:
      - "CO004"
      - "CO015"
      - "CO016"
  - calloutType: "risk"
    title: "Persistent Legal Exposure in Legacy Pick'em Products"
    body: |
      Despite pivoting to CFTC event contracts and surrendering state fantasy licenses, historical Pick'em offerings remain subject to substantial legal risk. Federal class actions such as Ballentine v. Underdog Sports and regulatory settlements like New York's $17.5M sanction highlight lingering civil liabilities.
    claimRefs:
      - "CO014"
      - "CO015"
