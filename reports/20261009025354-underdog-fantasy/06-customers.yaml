callouts:
- calloutType: risk
  title: Regulatory Fragmentation Threatens Customer Acquisition and Retention Economics
  body: Underdog Fantasy's customer economics remain heavily vulnerable to state regulatory
    crackdowns on player-prop pick'em contests. While prediction markets provide an
    alternative regulatory pathway via federal CFTC oversight, the loss of pick'em
    availability in major states like New York and Michigan constrains overall addressable
    player pools, inflates customer acquisition costs, and exposes the company to
    consumer restitution liabilities.
  claimRefs:
  - CU008
  - CU011
  - CU012
- calloutType: insight
  title: Retention Relies on Heavy Promotional Subsidy in Lieu of Disclosed Organic
    Durability
  body: In the absence of audited cohort retention disclosures, Underdog's apparent
    player stickiness is heavily reinforced by structured promotional architecture—including
    loss-mitigation features like Flex entries, injury rescues, and recurring weekly
    deposit matches. Diligence must establish whether users remain active once promotional
    subsidies abate or whether churn accelerates during off-season sports lulls.
  claimRefs:
  - CU009
  - CU010
