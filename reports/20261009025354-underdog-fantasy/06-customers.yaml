chapter:
  number: 6
  title: Customers
  summary: Underdog Fantasy serves retail sports gaming consumers across daily fantasy
    drafts, player prop pick'em, and prediction markets, scaling to millions of registered
    fans across 40+ states. However, private ownership obscures cohort retention and
    unit-level customer lifetime value, while regulatory actions and consumer litigation
    over prop formats create material jurisdictional churn risks.
sections:
- id: customer-segmentation-and-personas
  title: Customer Segmentation and Platform User Personas
  body: 'Underdog Fantasy targets mainstream American sports fans seeking fast-paced,
    high-engagement gaming formats without the burdensome administrative overhead
    of traditional season-long fantasy leagues. The platform''s core retail user base
    divides across distinct product-driven personas: Best Ball season-long drafters
    who draft once and rely on automated weekly optimization, casual pick''em participants
    making higher-or-lower player statistical projections, and prediction-market traders
    participating in event-contract trading across sporting outcomes. While traditional
    fantasy operators such as ESPN Fantasy and Yahoo Fantasy focus primarily on free-to-play
    season-long engagement, Underdog emphasizes real-money daily and tournament formats
    that generate direct transaction fee and contest hold revenue. To maintain customer
    transaction security and prevent account takeover across its expanding retail
    base, Underdog integrated Sift machine learning to identify stolen payment instruments
    and curtail payment fraud hurdles for legitimate participants.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
- id: adoption-trajectory-and-geographic-reach
  title: Adoption Trajectory and State-Level Operational Footprint
  body: Underdog Fantasy has demonstrated rapid retail customer adoption since its
    2020 inception, expanding its public footprint across more than 40 states and
    Washington, D.C. The company claims millions of participating fans on its mobile
    platforms, supported by prominent flagship tournaments including its marquee $15
    million Best Ball Mania contest. On consumer storefronts, Underdog's Android application
    has accumulated over 181,000 public reviews with a 4.8-star rating, underscoring
    substantial mobile retail distribution and brand engagement. However, platform
    adoption remains unevenly distributed due to fragmented state-by-state gaming
    legislation. While prediction markets and Rips operate across almost all jurisdictions
    except Nevada, pick'em prop contests face outright prohibitions or regulatory
    challenges in major states such as Michigan and New York, requiring Underdog to
    constantly adapt its jurisdictional product mix.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: customer-retention-service-quality-and-legal-risks
  title: Durability, Customer Support Strain, and Adversarial Consumer Exposure
  body: 'Because Underdog Fantasy remains a private venture-backed entity, critical
    customer durability indicators—such as net revenue retention, repeat-deposit rates,
    customer acquisition costs, and cohort churn curves—remain closely guarded trade
    secrets. Instead, customer retention is actively maintained through extensive
    promotional incentives, including new-user deposit bonuses, Flex entry loss protections,
    and recurring seasonal promotions such as profit boosts and referral rewards.
    Meanwhile, operational scaling has placed visible strain on customer support infrastructure:
    customer service representatives navigate heavy ticket volumes and seasonal surges
    during the NFL peak, leading to intermittent wait times and employee satisfaction
    disparities. Most critically, Underdog faces material adverse legal and regulatory
    exposure from consumer class action litigation alleging that unlicensed pick''em
    games deceptive to retail consumers constitute unlawful sports betting, directly
    threatening customer lifetime value and operating continuity in contested jurisdictions.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  tableRefs:
  - TU003
tables:
- id: TU001
  title: Customer Base Segmentation and Product Alignment
  columns:
  - Segment
  - Primary User & Payer
  - Core Use Case
  - Platform Scale & Geographic Reach
  - Revenue & Strategic Value
  - Key Diligence Gap
  rows:
  - - Season-Long Drafters
    - Casual and hardcore fantasy sports enthusiasts
    - Draft-only Best Ball leagues with automated weekly lineup scoring
    - 40+ states and D.C.; anchors summer and autumn football draft spikes
    - Drives large upfront entry fee liquidity and multi-million dollar flagship pools
    - Cohort retention into secondary sports seasons remains undisclosed
  - - Pick'em Contestants
    - Daily sports fans and player-prop bettors
    - Higher/lower player statistical performance prop combinations
    - Active in 30+ states; excluded or restricted in NY, MI, and other states
    - High-margin contest hold and house margin via multi-leg parlays
    - Subject to active state regulatory bans and class action litigation
  - - Prediction Market Traders
    - Event-driven sports traders and macro bettors
    - Direct trading on team and player outcome contracts via CFTC-licensed exchange
    - National availability across 40+ states via federally regulated exchange stack
    - Transfers volume from external exchanges, capturing exchange transaction clearing
      fees
    - Realized user volume and trade liquidity depth remain unverified publicly
  - - Digital Card Collectors
    - Sports memorabilia collectors and gamified pack rippers
    - 'Underdog Rips: purchasing, trading, and redeeming digital/physical sports card
      packs'
    - Available across 49 states (all except Nevada)
    - Diversifies revenue outside live sporting contest calendars
    - Active monthly pack buyers and gross secondary sales volume are unquantified
