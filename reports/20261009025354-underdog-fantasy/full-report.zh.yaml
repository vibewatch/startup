            title: 监管碎片化威胁获客与留存经济性
            body: >-
              Underdog Fantasy 的客户经济性高度容易受到州级监管打击球员道具 Pick'em 赛事的影响。预测市场虽可通过联邦 CFTC 监管提供另一条路径，但纽约、密歇根等主要州失去 Pick'em
              可用性，会压缩整体可寻址玩家池、推高获客成本，并使公司承担消费者赔偿责任。
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU012
          - type: callout
            title: 留存依赖高额促销补贴，而非已披露的自然持久性
            body: >-
              在没有经审计的队列留存披露时，Underdog 看似稳定的玩家参与度，很大程度上由结构化促销支撑，包括 Flex 投注、伤病救济和每周重复入金匹配等损失缓释功能。
              尽调必须确认：促销补贴停止后用户是否仍保持活跃，还是会在赛季间歇期加速流失。
            calloutType: insight
            claimRefs:
              - CU009
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律重新分类风险
        blocks:
          - type: paragraph
            body: >-
              Underdog Fantasy 的核心投资论点风险，在于其核心 Pick'em
              玩法正被监管和法律重新分类。公司最初依靠联邦和州级每日梦幻体育（DFS）豁免快速扩张，但各主要司法辖区的州博彩委员会越来越审查球员预测 Pick'em 是否属于无牌体育博彩，而非真正的技能游戏。 2023 年末至
              2024 年初，纽约州博彩委员会（NYSGC）更新 DFS 规则，明确禁止庄家对抗型 Pick'em，导致据报道 $17.5M 至 $18M 的监管和解，并迫使 Underdog
              在获得临时许可、只能恢复选秀型赛事前突然退出纽约市场。 佛罗里达博彩控制委员会采取类似执法行动，迫使 Underdog 停止佛罗里达的庄家对抗型 Pick'em，并转向点对点 Champions
              赛事结构以遵守州博彩框架。 此外，私人民事原告在纽约东区联邦法院提起集体诉讼，指控违反纽约《刑法》和《一般义务法》，要求追回投注损失并索赔超过 $5M。
              公司通过开发点对点玩法并在俄亥俄等部分司法辖区取得完整体育博彩牌照，展现了灵活的产品合规能力；但州级重新分类仍在压缩 Underdog 的 TAM，并抬高持续合规成本。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
