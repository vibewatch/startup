  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览与分类
        blocks:
          - type: paragraph
            body: >-
              Underdog Fantasy 周边竞争者分为五类：直接的 Pick'em
              和每日梦幻体育（DFS）挑战者（PrizePicks、Sleeper、Betr）；传统体育博彩平台（DraftKings、FanDuel、BetMGM、Caesars）；传统梦幻体育平台（Yahoo
              Fantasy、ESPN Fantasy）；零售交叉销售巨头（Fanatics Betting & Gaming）；以及受监管的事件预测市场（Kalshi、Polymarket）[CP001, CP002,
              CP003]。 Underdog 最初通过率先推出赛季 Best Ball 锦标赛切入高利润细分市场：系统自动设置最佳首发阵容，消除了赛季中的弃将和交易管理；同时推出快速球员道具 Pick'em
              赛事[CP001, CP004, CP005]。 但更广泛的体育博彩行业正在结构性趋同：梦幻体育主要充当低成本获客引擎（客户获取成本 $50-$80），把用户升级到体育博彩（客户终身价值 $2,500）和最高
              ARPU 的线上赌场游戏（iGaming）[CP002, CP006]。 因此，传统体育博彩平台和挑战者都在各州复制赛事形式，Fanatics 等零售巨头则利用商品生态，以估计 $19 的 CAC
              交叉销售投注客户[CP002, CP003]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: 同行画像、技术范围与能力
        blocks:
          - type: paragraph
            body: >-
              直接竞争者在融资结构、产品范围和技术架构上差异很大。PrizePicks 是 Underdog 在球员道具 Pick'em 上最接近的同行，主要是自力更生、高交易量运营商，没有机构风投资本支持[CP001,
              CP002]。 Sleeper 以自然社交功能、联赛聊天和现代用户体验形成差异，先以赛季梦幻体育为锚点，再叠加 Pick'em 赛事[CP001, CP002]。 相比之下，DraftKings 和
              FanDuel 等市场领导者运营完整的数字生态，覆盖 DFS、体育博彩和线上赌场游戏（iGaming），拥有主导性的营销预算和全国流动性[CP001, CP002, CP007]。 Underdog
              的关键技术差异在于自有、从零搭建的软件架构：不同于最初依赖离岸或白标平台的竞争者（如 DraftKings 早期的第三方引擎），Underdog 内部搭建体育博彩和 DFS
              基础设施，以支持统一账户、共享钱包，以及梦幻选秀与体育博彩之间的无缝切换[CP002, CP007, CP008]。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
