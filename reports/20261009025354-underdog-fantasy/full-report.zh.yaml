        title: 展示项
        blocks:
          - type: callout
            title: 向联邦预测市场的战略转型
            body: >-
              Underdog 收购 Aristotle Exchange 并待售给 IG Group，体现出公司有意离开碎片化且争议不断的州级梦幻体育牌照体系。 公司把体育预测转换为受 CFTC
              监管的衍生品合约，试图让核心投注机制免受州博彩委员会的强力打击。
            calloutType: insight
            claimRefs:
              - CO004
              - CO015
              - CO016
          - type: callout
            title: 传统 Pick'em 产品的持续法律风险
            body: >-
              即使转向 CFTC 事件合约并交回州梦幻体育牌照，历史 Pick'em 产品仍面临重大法律风险。Ballentine v. Underdog Sports 等联邦集体诉讼，以及纽约 $17.5M
              监管和解，都说明民事责任仍未消失。
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与收入池
        blocks:
          - type: paragraph
            body: >-
              不应把 Underdog 按单一、无差别的“体育博彩”市场估值。其核心付费梦幻体育产品包括 Best Ball 选秀和 Pick'em 赛事，而预测市场扩张带来的是另一套监管结构下的事件合约。
              持牌固定赔率体育博彩、免费赛季梦幻联赛和体育媒体争夺同一份消费者注意力，但收入池、法律许可和单位经济性并不相同。 Sacra 估算，梦幻体育赛事通过报名费变现，运营方抽成约 10% 至 15%，但引文没有披露
              Underdog 经审计的交易量或实际抽成率；Preqin 的预览同样列出多个收入渠道，却没有量化其贡献。 因此，可投资边界应是 Underdog
              实际能够触达的付费报名和合约交易，而不是全部体育投注或全部球迷参与。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM014
              - CM015
      - number: '2.2'
        title: 避免虚假精确的市场测算
        blocks:
          - type: paragraph
            body: >-
              已分配证据支持多种观察角度，但没有一种本身足以构成可靠的 TAM。转述 Technavio 数据的开发者行业文章预测，全球梦幻体育市场将在 2023 至 2027 年以 6.43% 的 CAGR 扩张至
              $9.72B；文章还称 2022 年美国有 50.4m 名梦幻体育参与者。Sacra 另行引用 $40B 至 $50B
              的成熟美国体育博彩市场，但没有说明该数值是投注额、博彩总收入还是其他口径。公司发布的应用文案称拥有数百万球迷、累计赢取超过 $2B；2025 年 3 月的一篇文章则称用户接近 400 万。
              这些是受众和奖金发放指标，不是年收入或可寻址支出。若没有付费用户、报名量、地域收入、留存率和贡献利润数据，编制公司自身的 SAM 或 SOM 就是在臆测，而不是测量。
            claimRefs:
