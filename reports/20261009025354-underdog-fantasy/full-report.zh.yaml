  - id: FE001
    title: Underdog Fantasy 技术与运营栈
    type: stack
    summary: 架构栈图展示客户端呈现、竞猜逻辑、数据工程管道和合规控制。
    data:
      layers:
        - label: 客户端呈现层
          detail: 跨平台移动应用覆盖 iOS 和 Android，并配有响应式网页界面
          modules:
            - 原生 iOS 应用
            - 原生 Android 应用
            - 响应式网页客户端
            - 推送通知引擎
        - label: 游戏引擎与竞猜逻辑
          detail: 核心竞猜引擎管理选秀执行、道具投注单和专有体育博彩投注
          modules:
            - Best Ball 选秀引擎
            - Pick'em 投注单构建器
            - Pick'em Champions 玩家对玩家逻辑
            - 专有体育博彩投注引擎
        - label: 分析与数据转换
          detail: 云数据仓库和分析转换管道，为实时 BI 和数据科学提供动力
          modules:
            - Google Cloud BigQuery 数据仓库
            - DBT 数据转换模型
            - BI 分析报告层
            - 实时比赛数据接入
        - label: 合规与企业安全
          detail: 覆盖各州司法辖区的监管治理、身份验证、地理围栏和 PII 管理
          modules:
            - 州级地理围栏与位置验证
            - 受监管 PII 与玩家数据治理
            - 负责任博彩存款限额
            - 企业 IAM 与终端安全
        - label: 核心交易账本
          detail: 处理数字钱包账户、竞猜入场结算和玩家派彩分发
          modules:
            - 玩家钱包余额服务
            - 竞猜入场费结算
            - 自动即时提现引擎
            - 多司法辖区税务账本
        - label: 第三方数据流与服务
          detail: 接入外部体育数据计分流、KYC 身份验证和支付网关
          modules:
            - 实时体育计分数据流
            - KYC 身份验证 API
            - 支付网关集成
            - 地理位置验证供应商
    approximationNotes: 各层组件综合自公开的数据工程岗位、公司简介和移动应用分发渠道。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
      - CE009
      - CE013
  - id: FU001
    title: Underdog Fantasy 客户旅程与变现生命周期
    type: journey-map
    summary: 展示客户从促销获客到留存循环、监管摩擦及最终钱包扩张的端到端进程。
    data:
      items:
        - label: 获客与注册
          touchpoints:
            - 联盟推广代码（GRINDERS）
            - 首次存款匹配（$5 入场可获 $100 奖金）
            - 下载移动应用（iOS/Android）
          experience: Low barrier to entry with generous introductory bet-and-get credit incentives.
        - label: 注册与 KYC 验证
          touchpoints:
            - 按州级年龄/地点要求核验身份
            - Sift 自动欺诈检测与盗刷卡筛查
            - 银行账户/银行卡支付接入
          experience: Automated verification protects legitimate players but introduces friction in restricted states.
        - label: 核心赛事参与
          touchpoints:
            - Best Ball 选秀大厅（NFL、NBA、MLB、PGA）
            - 球员统计 Higher/Lower Pick'em 卡牌
            - Champions 点对点赛事池
          experience: Fast and intuitive user interface optimized for quick mobile draft and prop selection.
        - label: 参与与留存循环
          touchpoints:
            - Vulture 保护与伤病救援
            - 每周促销加成代币（More Money Mondays）
            - Flex 入场损失保险（最高 120x 倍数）
          experience: Gamified safety nets and recurring bonuses encourage repeat deposits and active weekly play.
        - label: 产品扩张与多元化
          touchpoints:
            - CFTC 持牌预测市场结果交易
            - 购买 Underdog Rips 体育卡包
            - 参与跨运动项目的季节性选秀
          experience: Cross-selling adjacent products expands customer wallet share outside traditional fantasy windows.
        - label: 提现与司法辖区摩擦
          touchpoints:
            - 通过电子邮件确认的支付出款（PayPal、Venmo、Trustly）
            - 州级强制存款上限（MA、MD、TN）
            - 地理围栏拦截与州监管机构发出的停止并终止令
          experience: Swift 24-72 hour cashouts counterbalanced by sudden product restrictions in banned states.
    approximationNotes: 各阶段与触点综合自 RotoGrinders 测试评测、Sift 欺诈防范合作公告及州监管申报文件。
    claimRefs:
      - CU002
      - CU003
      - CU008
      - CU010
      - CU012
