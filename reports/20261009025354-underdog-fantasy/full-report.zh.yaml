  - id: FV001
    title: 估值逻辑与决策流程
    type: flow
    summary: 从运营规模出发，依次经过监管阻力，最终形成跟踪建议。
    data:
      nodes:
        - id: scale
          label: 1. 规模与增长势头
          detail: 活跃用户超过 2.4M，奖金发放超过 $2B，累计融资 $115M
        - id: round
          label: 2. Series C 轮估值标记
          detail: 2025 年初估值标记为 $1.225B-$1.23B
        - id: headwinds
          label: 3. 法律与监管暴露
          detail: 纽约州集体诉讼、7 个州交回牌照，以及重组
        - id: pivot
          label: 4. 战略转型
          detail: 收购 Aristotle Exchange，以自行清算预测市场交易
        - id: ma_cap
          label: 5. 并购交易上限
          detail: 已同意 IG Group 以最高 $1.3B 收购，并附带 $200M 业绩支付
        - id: decision
          label: 6. 建议
          detail: 剩余上行空间有限，估值合理，建议持续跟踪
      edges:
        - from: scale
          to: round
        - from: round
          to: headwinds
        - from: headwinds
          to: pivot
        - from: pivot
          to: ma_cap
        - from: ma_cap
          to: decision
    approximationNotes: 图示战略依赖关系；各节点反映已报道的交易指标与法律事件。
