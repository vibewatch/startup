chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创始团队与治理
        blocks:
          - type: paragraph
            body: >-
              Underdog Sports, LLC（以 Underdog Fantasy 名义经营）是一家成立于 2020 年、总部位于纽约布鲁克林 150 Waterbury Street 的体育博彩与预测平台。
              公司由连续创业的梦幻体育企业家 Jeremy Levine 与联合创始人 Brandon Stakenborg、Trevor John 创立，延续了他们在 StarStreet、DRAFT
              等早期体育博彩项目积累的管理和工程经验。 Levine 担任创始人兼首席执行官，是 Underdog 产品定位和法律应对的公开负责人及主要战略设计者；Stakenborg 和 John
              负责移动产品开发与技术架构。 更广泛的运营高管团队过去还包括首席运营官兼首席财务官 Dustin Cooper、总法律顾问 Nicholas Green 和首席营销官 Elizabeth Marro。

              公司治理从创始人控制的股权结构表，逐步转向机构参与董事会。早期股权融资引入了 Spark Capital、Acies Investments、BlackRock 等领投机构，以及运动员和媒体战略投资者。 2026
              年 7 月，伦敦上市的交易及预测市场服务商 IG Group Holdings plc 签署最终协议，以最高 $1.3B 的总对价收购 Underdog，治理由私募风投董事代表转向 IG Group
              的上市公司董事会；创始人 Jeremy Levine 继续在扩大后的集团内负责运营执行。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
