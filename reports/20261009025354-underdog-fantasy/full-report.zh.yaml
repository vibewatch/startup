  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现机制
        blocks:
          - type: paragraph
            body: >-
              Underdog Fantasy 运营消费体育博彩平台，收入来自报名费、赛事佣金和体育博彩利润。在基础的每日梦幻体育（DFS）赛事，尤其是 Best Ball
              锦标赛中，公司从报名费中扣除赛事费用，通常保留用户总报名费的 10% 至 15%，其余返还为保证奖池。 在球员道具 Pick'em 赛事中，用户在两至八个球员腿上选择更高或更低的表现预测。Underdog
              不收固定费用，而是把庄家优势嵌入多段赔率，用休闲串关有效获得高利润。

              随着自有技术推出，变现框架扩展到持牌全服务线上体育博彩，2024 年 3 月从北卡罗来纳开始。在体育博彩中，收入来自运营商博彩总收入（GGR），即传统让分、大小分和道具盘口的统计持有率或水钱。 此外，通过
              Crypto.com Derivatives North America（CDNA）的事件合约产品，Underdog 引入预测市场机制，以交易量和用户参与费变现。
