            body: >-
              尽管品牌知名度高、注册用户超过 400 万，Underdog 的结构性转换成本仍低，用户多平台使用普遍[CP002, CP007]。体育迷会同时下载多个应用，在
              PrizePicks、Underdog、Sleeper 和 Betr 之间比较球员预测盘口，并寻找促销入金匹配[CP002, CP009]。 梦幻体育的网络效应主要局限于私人社交联赛和 Underdog $15M
              Best Ball Mania 这类巨额保证奖池赛事，后者需要充足流动性才能举办[CP001, CP008]。 州级监管机构和商业体育博彩游说团体把球员道具 Pick'em
