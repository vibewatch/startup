      - number: '1.3'
        title: 产品演进、公司里程碑与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              Underdog 的核心产品围绕两种独特玩法打造：Best Ball 锦标赛和球员预测 Pick'em 赛事。Best Ball
              要求用户在赛季开始前进行蛇形选秀，再由自动计分算法每周优化有效阵容，用户无需在赛季中管理阵容，最终形成 $15M Best Ball Mania 等旗舰赛事。 Pick'em 则要求用户预测真实运动员在 15
              项运动、25 个联赛中是否超过或低于统计基准，将 2 至 8 个选择组合成类似串关的投注，最高可获得 5,000x 倍数。之后，公司与 Crypto.com | Derivatives North
              America（CDNA）合作，推出事件驱动的预测合约。

              这一产品策略与州博彩监管机构及原告律师群体发生严重冲突。2025 年 2 月，消费者原告在纽约东区联邦法院提起集体诉讼，指控 Underdog 的庄家对抗型 Pick'em
              游戏属于未经许可的商业体育博彩，而非法律规定的互动梦幻体育技能游戏。 佛罗里达、马萨诸塞和阿肯色的州博彩委员会针对庄家对抗型 Pick'em 机制发布停止并终止令或监管禁令，Underdog 还同纽约当局达成
              $17.5M 和解。 此后，Underdog 于 2025 年 12 月关闭北卡罗来纳州体育博彩业务，2026 年 9 月交回七州梦幻体育牌照，并收购 Aristotle Exchange 的 CFTC
              指定合约市场和衍生品清算机构牌照，将用户迁移至联邦监管的预测市场。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
