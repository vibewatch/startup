      - number: '4.3'
        title: 资本充足性、监管负债与收购估值
        blocks:
          - type: paragraph
            body: >-
              战略收购前，Underdog 通过多轮融资募资 $115M 风投股权，其中包括 2022 年 7 月由 BlackRock 和 Acies Investment 领投、估值 $485M 的 $35M B 轮，以及
              2025 年 3 月由 Spark Capital 领投、以 $1.225B 投前估值募资 $70M 的 C 轮。 尽管营收规模强劲——2022 年为 $500M，进入 2026 年前为
              $466M——法律与监管负担加剧仍考验资本充足性。在纽约，Underdog 因临时牌照条款同纽约州博彩委员会以 $18M 和解，同时面临依据《一般义务法》指控无牌体育博彩的集体诉讼。

              2026 年 7 月 29 日，IG Group 同意以最高约 $1.3B 的总对价收购 Underdog Sports Holdings, Inc.。交易企业价值约 $1.1B，包括 $963M
              的前期股权价值（$380M 现金和 24.1m 股新增 IG 普通股，投后估值 $1.23B）、交割时偿还约 $160M Underdog 债务，以及与 2026 年净博彩收入目标和正向 2026 年
              EBITDA 挂钩、最高 $200M 的 earnout。 交易对应 Underdog 2.8x 的尾部收入（$466M）和 28.3x 的
              EBITDA；交易解决了独立流动性需求，但也确认公司既有债务和业绩门槛都很高。
            claimRefs:
