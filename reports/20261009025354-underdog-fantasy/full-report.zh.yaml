            title: 研究用户队列，而不是追逐表面上的 TAM
            body: 在给市场份额情景估值前，应索取各产品和州级报名量、实际抽成、入金用户转化、留存率、促销支出和贡献利润。
            calloutType: recommendation
            claimRefs:
              - CM002
