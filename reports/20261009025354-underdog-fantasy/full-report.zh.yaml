        - 10-15% 的抽成率被州合规成本和牌照费侵蚀
        - 经审计的贡献利润率证明成熟州用户群实现盈利
      - - 监管与法律
        - 专有软件及转向受 CFTC 监管的预测市场，降低风险敞口
        - 纽约州联邦集体诉讼及七州牌照交回威胁核心模式
        - 有利的司法裁决确认 Pick'em 按州博彩法属于技能型游戏
      - - 流动性与退出
        - IG Group 收购通过包含业绩递延付款的安排提供最高 $1.3B 的流动性
        - 监管审查或递延付款未达成，可能使股权价值接近或低于 Series C
        - IG Group 交易获得最终监管批准并正式交割
    notes: 直接对比投资催化剂与结构性监管、运营风险。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: 牛市、基准和熊市情景估值模型
    columns:
      - 情景
      - 假设估值
      - 关键运营与监管驱动因素
      - 下行触发因素 / 催化剂
      - 概率权重
    rows:
      - - 乐观情景
        - $1,300M
        - IG Group 交易顺利完成；$200M 递延付款全部实现；预测市场实现规模化
        - 加速整合至全球博彩平台，并完成全部债务清偿
        - 25%
      - - 基准情景
        - $1,100M
        - 收购完成，但七州牌照交回导致递延付款未达成
        - 核心 DFS 利润率保持稳定，而体育博彩业务继续关闭
        - 55%
      - - 悲观情景
        - $500M
        - IG Group 交易因监管障碍终止；纽约州集体诉讼施加重大责任
        - 各州广泛禁止 Pick'em 模式，迫使公司紧急进行折价融资
        - 20%
    notes: 情景估值反映经递延付款、债务偿还和诉讼风险调整后的股权对价。
    claimRefs:
      - CV005
      - CV007
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 覆盖 2020 年创立至 2026 年 IG Group 收购期间的关键公司、融资、运营和监管里程碑。
    data:
      items:
        - label: 公司创立与上线
          date: '2020-10-15'
          detail: Jeremy Levine、Brandon Stakenborg 和 Trevor John 注册成立 Underdog Sports，并推出 Best Ball 移动应用。
          tone: positive
        - label: 名人种子融资轮
          date: '2021-05-03'
          detail: 从 Mark Cuban、Kevin Durant 的 Thirty Five Ventures 及娱乐圈人士处获得 $10 million 种子融资。
          tone: positive
        - label: Series B 机构融资
          date: '2022-07-26'
          detail: BlackRock 和 Acies Investments 领投，融资 $35 million，投后估值 $485 million。
          tone: positive
        - label: 俄亥俄州体育博彩牌照授予
          date: '2022-12-14'
          detail: 获 Ohio Casino Control Commission 授予移动体育博彩服务牌照，以推动体育博彩业务上线。
          tone: positive
        - label: 北卡罗来纳州体育博彩上线
          date: '2024-03-11'
          detail: 在北卡罗来纳州新开放的合法市场推出专有的全服务移动体育博彩产品。
          tone: positive
        - label: Series C 独角兽估值轮
          date: '2025-03-26'
          detail: Spark Capital 领投，完成 $70M-$100M Series C，投前估值达到 $1.225 billion。
          tone: positive
        - label: 纽约州消费者集体诉讼
          date: '2025-02-26'
          detail: 联邦集体诉讼在 EDNY 提起，指称 Pick'em 游戏构成未经许可的庄家对赌型体育博彩。
          tone: negative
        - label: 北卡罗来纳州体育博彩关闭
          date: '2025-12-15'
          detail: 因促销和获客成本高企，关闭北卡罗来纳州的独立体育博彩应用。
          tone: negative
        - label: 员工架构重组
          date: '2026-02-15'
          detail: 公司围绕预测市场合约重组，员工人数减少约 125 人。
          tone: negative
        - label: Aristotle Exchange 收购
          date: '2026-03-10'
          detail: 收购受 CFTC 监管的指定合约市场和清算组织基础设施，以提供事件合约。
          tone: positive
        - label: IG Group 收购协议
          date: '2026-07-15'
          detail: 达成协议，由伦敦上市公司 IG Group Holdings plc 收购，总对价最高达 $1.3 billion。
          tone: positive
        - label: 多州牌照交回
          date: '2026-09-15'
          detail: 在监管机构对 pick'em 机制产生摩擦之际，交回七州的互动梦幻体育牌照。
          tone: negative
    approximationNotes: 日期反映已报道的交易公告、监管申报日期及法院起诉记录。
