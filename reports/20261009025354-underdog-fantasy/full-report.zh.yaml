              - CO005
      - number: '1.2'
        title: 融资历史、二级流动性与规模指标
        blocks:
          - type: paragraph
            body: >-
              Underdog Fantasy 通过四轮主要融资支持高速扩张，累计实缴股权资本约 $115M 至 $145M。公司于 2021 年 5 月完成 $10M 的名人及天使种子轮，投资方包括 Mark Cuban 和
              Kevin Durant 的 Thirty Five Ventures； 2022 年 7 月完成 $35M 的 B 轮融资，由 BlackRock 与 Acies Investments 联合领投，投后估值
              $485M。 2025 年 3 月，Underdog 完成标志性的独角兽 C 轮融资，由 Spark Capital 领投，首笔募资 $70M，目标总额 $100M，投前估值 $1.225B 至 $1.23B。
              Nasdaq Private Market（NPM）ATS 的二级交易显示，2026 年 9 月私人股权估值对应的每股价格为 $9.69。

              运营规模显示出较深的零售市场渗透，但私人公司披露仍受限。公司服务超过 400 万个注册账户，在 40 个合资格州拥有超过 240 万名活跃参与者，累计向客户发放的奖金超过 $2B。 重组前全职员工数增至 250
              至 520 人，2026 年初削减约 125 个岗位以压缩成本。私人分析追踪机构估算年净收入在 $73.4M 至 $466M 之间，但经审计的博彩总收入、各州抽成率和现金消耗仍未公开。
