      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              通常，用户和付费方是同一个消费者，但不同玩法的动机不同。Best Ball 在选秀后减少持续管理阵容的工作；Pick'em 提供短周期预测流程，覆盖公司自称的 15 项运动和超过 25
              个联赛；事件合约则要求用户评估可交易结果并承担明确的交易风险。 历史覆盖范围本就碎片化：一份第三方资料称，截至 2022 年 7 月 Underdog 在九个指定州不可用，但这一旧资料不能证明当前触达范围。
              采用取决于把体育注意力转化为入金和重复行为，而不只是下载或注册。免费梦幻联赛是低成本替代品，体育博彩和交易所也在争夺同一笔可支配钱包。 公开来源没有披露个人消费者之外的预算决策权，也没有提供队列级转化和留存数据。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              产品广度、移动分发和低维护赛事形式支持用户参与；预测市场则可能借助联邦商品监管扩大可寻址地域。 SportsPro 报道称，Underdog 在通过 Crypto.com 推出预测市场后收购了 Aristotle
              Exchange，为自有事件合约铺路。但这不等于可以不受限制地进入市场：同一篇文章描述了预测市场运营商与州监管机构之间的法律冲突。 公司还在 2025
              年末关闭了唯一的北卡罗来纳州体育博彩业务，说明截至报告日，体育博彩相邻业务并非持续运营的渠道。 另外，联邦起诉书中的原告称 Pick'em
              是按公司设定盘口进行的无牌博彩；这些仍是指控，不是法院认定，但足以说明分类风险重大。因此，只有在核实司法辖区可用性、入金用户转化、流动性和法律可持续性后，估值才应为期权价值付费。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场准入取决于法律
            body: 联邦事件合约监管可能扩大分发范围，但州级挑战和待决的 Pick'em 指控意味着，不能把理论触达范围视为持久的可服务市场。
            calloutType: risk
            claimRefs:
              - CM012
              - CM015
