      - number: '3.3'
        title: 定价机制、抽成率与单位经济
        blocks:
          - type: paragraph
            body: >-
              梦幻体育、体育博彩和赌场游戏的变现方式存在明显利润差异，决定了竞争行为。传统 DFS 和赛季 Best Ball 锦标赛通常按总报名费的 10% 至 15% 收取赛事抽成，净利润率约为 12%[CP001,
              CP002]。 在球员道具 Pick'em 游戏中，运营方在多段串关（需要命中 2 至 5 个或更多高 / 低目标）中嵌入隐含庄家优势，因此交易频率和抽成率都高于季赛[CP001, CP002, CP009]。
              但体育博彩利润率约 30%，iGaming（数字二十一点、轮盘和老虎机）利润率约 70%，远高于梦幻体育，迫使运营商把用户往高价值产品升级[CP002]。
              客户获取经济性也明显偏向梦幻体育运营商：体育博彩平台通过大规模电视广告获取一名新投注者要花 $500 至 $800，而 Underdog 获取梦幻体育用户只需 $50 至 $80，前端 CAC
              效率显著更高[CP002, CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
