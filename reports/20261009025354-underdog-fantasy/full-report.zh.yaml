            body: >-
              Underdog Fantasy 面临的核心技术和架构矛盾，在于 Pick'em 机制的监管分类和法律执行。纽约联邦法院受理的民事集体诉讼称，Underdog 的 Pick'em 和 Pick'em
              Champions 赛事构成未取得州移动体育博彩牌照的非法体育博彩。
              纽约、马萨诸塞、阿肯色、佛罗里达、怀俄明、马里兰和西弗吉尼亚的监管机构及州博彩部门，已发布停止并终止令或监管规则，限制模仿体育博彩道具串关的庄家对抗型球员道具赛事。 Underdog
