callouts:
  - calloutType: "insight"
    title: "Proprietary Sportsbook Engine as a Strategic Moat and Cost Burden"
    body: "Underdog Fantasy's decision to build its sportsbook infrastructure on internally engineered technology rather than licensing a third-party white-label provider establishes significant long-term product flexibility and higher margin capture at scale. However, this architectural approach demands continuous capital expenditure and specialized engineering talent to maintain real-time odds modeling, settlement integrity, and state-by-state compliance reporting."
    claimRefs:
      - "CE006"
      - "CE008"
      - "CE009"
  - calloutType: "risk"
    title: "Vulnerability of Pick'em Mechanics to State Proposition Gaming Bans"
    body: "The technical elegance of Underdog's pick'em interface masks acute regulatory fragility. Because the platform acts as the house counterparty setting over/under lines in standard Pick'em games, state regulators increasingly treat the product as unlicensed sports wagering rather than peer-to-peer skill-based fantasy, threatening sudden market exclusions and heavy retrospective liability."
    claimRefs:
      - "CE003"
      - "CE011"
      - "CE012"
