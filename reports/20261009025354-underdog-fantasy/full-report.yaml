      - number: '1.3'
        title: Product Evolution, Corporate Milestones, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >
              Underdog's core product architecture was pioneered around two distinctive gaming formats: Best Ball
              tournaments and player-projection Pick'em contests. In Best Ball, users conduct snake drafts before
              athletic seasons commence, relying on automated scoring algorithms to optimize active rosters weekly
              without in-season lineup management, culminating in marquee competitions like the $15 million Best Ball
              Mania. In Pick'em contests, users predict whether real-world athletes will exceed or fall short of
              statistical benchmarks across 15 sports and 25 leagues, combining 2 to 8 selections into parlay-style
              entries that yield multipliers up to 5,000x. The company later deployed event-driven prediction contracts
              under a commercial partnership with Crypto.com | Derivatives North America (CDNA).


              This product strategy generated severe friction with state gaming regulators and the plaintiff bar. In
              February 2025, consumer plaintiffs filed a federal class-action lawsuit in the Eastern District of New
              York alleging that Underdog's against-the-house Pick'em games constitute unlicensed commercial sports
              gambling rather than statutory interactive fantasy skill contests. State gaming commissions in Florida,
              Massachusetts, and Arkansas issued cease-and-desist orders or regulatory bans against against-the-house
              pick'em mechanics, and Underdog agreed to a $17.5 million settlement with New York authorities. In
              response, Underdog closed its North Carolina sports betting operation in December 2025, surrendered
              fantasy sports licenses across seven states in September 2026, and acquired Aristotle Exchange's CFTC
              Designated Contract Market and Derivatives Clearing Organisation licenses to migrate users into federally
              supervised prediction markets.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Transition to Federal Prediction Markets
            body: >
              Underdog's acquisition of Aristotle Exchange and pending sale to IG Group highlight a calculated shift
              away from fragmented, highly contentious state-level fantasy sports licensing. By converting sports
              predictions into CFTC-regulated derivatives contracts, Underdog attempts to insulate its core wagering
              mechanics from aggressive state gaming commissions.
            calloutType: insight
            claimRefs:
              - CO004
              - CO015
              - CO016
          - type: callout
            title: Persistent Legal Exposure in Legacy Pick'em Products
            body: >
              Despite pivoting to CFTC event contracts and surrendering state fantasy licenses, historical Pick'em
              offerings remain subject to substantial legal risk. Federal class actions such as Ballentine v. Underdog
              Sports and regulatory settlements like New York's $17.5M sanction highlight lingering civil liabilities.
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and revenue pool
        blocks:
          - type: paragraph
            body: >
              Underdog should not be valued against a single undifferentiated “sports gaming” market. Its core
              paid-fantasy products include Best Ball drafts and Pick'em contests, while its prediction-market expansion
              introduces event contracts governed through a different regulatory structure. Licensed fixed-odds
              sportsbooks, free season-long fantasy leagues, and sports media compete for the same consumer attention
              but do not share the same revenue pool, legal permissions, or unit economics. Sacra estimates that fantasy
              contests monetize through entry fees with a roughly 10% to 15% operator take, but the excerpt does not
              provide audited Underdog volume or realized take rate. Preqin's preview similarly lists multiple revenue
              channels without quantifying their contribution. The investable boundary is therefore paid entries and
              contract activity actually accessible to Underdog, not all sports wagering or all fan engagement.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM014
              - CM015
      - number: '2.2'
        title: Sizing without false precision
        blocks:
          - type: paragraph
            body: >
              The allocated evidence supports several lenses, none of which is a defensible TAM by itself. A
              developer-industry article relaying Technavio data projects $9.72 billion of global fantasy-sports market
              expansion at a 6.43% CAGR between 2023 and 2027; it also reports 50.4 million U.S. fantasy participants in
              2022. Sacra separately cites a $40 billion to $50 billion mature U.S. sports-betting market, but does not
              define whether that value is handle, gross gaming revenue, or another measure. Company-issued app copy
              claims millions of fans and more than $2 billion won, while a March 2025 article reports nearly four
              million users. Those are audience and payout indicators, not annual revenue or addressable spend. Without
              paid-user, entry-volume, geographic-revenue, retention, and contribution-margin data, a company-specific
              SAM or SOM would be invented rather than measured.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM009
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >
              The user and payer are generally the same individual consumer, but motivations differ by format. Best Ball
              reduces ongoing roster-management work after the draft; Pick'em offers a short-cycle projection workflow
              across a company-claimed 15 sports and more than 25 leagues; event contracts ask users to evaluate
              tradable outcomes and accept explicit trading risk. The historical footprint was already fragmented: a
              third-party profile said Underdog was unavailable in nine named states as of July 2022, a vintage that
              cannot establish current reach. Adoption depends on converting sports attention into funded, repeat
              behavior, not merely app downloads or registrations. Free fantasy leagues are a low-cost substitute, while
              sportsbooks and exchanges compete for the same discretionary wallet. Public sources do not disclose budget
              ownership beyond the individual consumer or provide cohort-level conversion and retention.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >
              Product breadth, mobile distribution, and low-maintenance contest formats support engagement, while
              prediction markets can extend the addressable geography under federal commodities regulation. SportsPro
              reports that Underdog acquired Aristotle Exchange after launching prediction markets through Crypto.com,
              giving the company a route to its own event contracts. That route is not equivalent to unrestricted market
              access: the same article describes legal clashes between prediction-market operators and state regulators.
              The company also closed its sole North Carolina sportsbook in late 2025, evidence that the sportsbook
              adjacency did not remain a live channel at the reporting date. Separately, plaintiffs in a federal
              complaint allege that Pick'em amounts to unlicensed wagering against company-set lines; those are
              allegations, not adjudicated findings, but they demonstrate material classification risk. Valuation should
              therefore reward optionality only after verifying jurisdictional availability, funded-user conversion,
              liquidity, and legal durability.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market access is a legal variable
            body: >-
              Federal event-contract regulation may broaden distribution, but state challenges and the pending Pick'em
              allegations prevent treating theoretical reach as durable serviceable market.
            calloutType: risk
            claimRefs:
              - CM012
              - CM015
          - type: callout
            title: Underwrite cohorts, not headline TAM
            body: >-
              Request product- and state-level entry volume, realized take, funded-user conversion, retention,
              promotional spend, and contribution margin before assigning value to market-share scenarios.
            calloutType: recommendation
            claimRefs:
              - CM002
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Underdog Fantasy spans five distinct operator categories: direct
              pick'em and daily fantasy sports (DFS) challengers (PrizePicks, Sleeper, Betr), incumbent sportsbooks
              (DraftKings, FanDuel, BetMGM, Caesars), traditional fantasy platforms (Yahoo Fantasy, ESPN Fantasy),
              retail cross-sell giants (Fanatics Betting & Gaming), and regulated event prediction markets (Kalshi,
              Polymarket) [CP001, CP002, CP003]. Underdog originally carved out a high-margin niche by pioneering
              season-long Best Ball tournaments—which eliminate in-season waiver and trade management by auto-setting
              optimal starting lineups—and rapid-fire player-prop Pick'em contests [CP001, CP004, CP005]. However, the
              broader sports gaming industry is undergoing structural convergence where fantasy sports functions
              primarily as a low-cost lead-generation engine ($50-$80 customer acquisition cost) to upsell users into
              sportsbooks ($2,500 customer lifetime value) and maximum-ARPU online casino games (iGaming) [CP002,
              CP006]. In response, established sportsbooks and challengers are duplicating contest formats across
              states, while retail giants like Fanatics exploit merchandise ecosystems to cross-sell betting customers
              at estimated $19 CAC [CP002, CP003].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
      - number: '3.2'
        title: Peer Profiles, Technical Scope, and Capabilities
        blocks:
          - type: paragraph
            body: >-
              Direct competitors vary significantly across funding structures, product scope, and technological
              architecture. PrizePicks stands as Underdog's closest peer in player-prop pick'em contests, operating
              primarily as a bootstrapped, high-volume operator without institutional venture capital backing [CP001,
              CP002]. Sleeper differentiates through organic social features, league chat functionality, and modern user
              experience, using season-long fantasy as its anchor before layering on pick'em contests [CP001, CP002]. In
              contrast, market leaders DraftKings and FanDuel operate fully integrated digital ecosystems encompassing
              DFS, sportsbooks, and online casino gaming (iGaming), commanding dominant marketing budgets and nationwide
              liquidity [CP001, CP002, CP007]. Underdog's key technical differentiator is its proprietary, ground-up
              software architecture: unlike competitors that initially relied on offshore or white-label platforms (such
              as DraftKings' early third-party engine), Underdog built its sportsbook and DFS infrastructure internally
              to support a unified user account, shared wallet, and seamless transition between fantasy drafts and
              sports betting [CP002, CP007, CP008].
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
      - number: '3.3'
        title: Pricing Mechanics, Take Rates, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Monetization across fantasy sports, sports betting, and casino gaming exhibits stark margin disparities
              that dictate competitive behavior. In traditional DFS and season-long Best Ball tournaments, operators
              charge a contest rake typically ranging between 10% and 15% of total entry fees, yielding net margins of
              approximately 12% [CP001, CP002]. In player-prop Pick'em games, operators build in an implicit house
              advantage on parlay-style multi-leg entries (requiring 2 to 5 or more selections to hit higher/lower
              targets), generating much higher transaction frequency and take rates than seasonal tournaments [CP001,
              CP002, CP009]. However, sportsbook margins (~30%) and iGaming margins (~70% for digital blackjack,
              roulette, and slots) dwarf fantasy margins, creating intense economic pressure for operators to push users
              upmarket [CP002]. Furthermore, customer acquisition economics heavily favor fantasy operators: while
              sportsbooks expend $500 to $800 to acquire a new sports bettor through heavy broadcast advertising,
              Underdog acquires fantasy users for $50 to $80, capturing significant upfront CAC efficiency [CP002,
              CP007].
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP006
      - number: '3.4'
        title: Switching Costs, Multi-Homing, and Adverse Regulatory Pressures
        blocks:
          - type: paragraph
            body: >-
              Despite strong brand recognition and over 4 million registered users, Underdog faces low structural
              switching costs and extensive user multi-homing [CP002, CP007]. Sports fans routinely download multiple
              apps—comparing player projection lines across PrizePicks, Underdog, Sleeper, and Betr, while seeking
              promotional deposit matches [CP002, CP009]. Network effects in fantasy are largely confined to private
              social leagues and massive guaranteed prize pool (GPP) tournaments like Underdog's $15M Best Ball Mania,
              which require substantial liquidity to host [CP001, CP008]. Moat durability is further challenged by
              aggressive state-level regulatory crackdowns against player-prop pick'em games, which state gaming
              commissions and commercial sportsbook lobbyists categorize as unlicensed sports wagering rather than games
              of skill [CP010, CP011]. Regulatory actions—including an $18 million New York settlement, state market
              exits, and federal class-action litigation—have forced Underdog to pivot toward peer-to-peer Pick'em
              Champions models and licensed sports betting in states like North Carolina [CP002, CP007, CP011, CP012].
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Fantasy-to-Sportsbook CAC Arbitrage
            body: >-
              The core strategic logic of Underdog Fantasy is customer acquisition arbitrage. Incumbent sportsbooks
              spend $500 to $800 to acquire a single bettor via paid media, whereas Underdog leverages Best Ball
              tournaments and Pick'em games to acquire sports fans for $50 to $80. If Underdog can successfully migrate
              its fantasy audience onto its proprietary sportsbook, it secures massive structural acquisition
              efficiencies against DraftKings and FanDuel.
            calloutType: insight
            claimRefs:
              - CP002
              - CP007
          - type: callout
            title: Pick'em Regulatory Reclassification as an Existential Headwind
            body: >-
              Player-prop pick'em games represent Underdog's primary daily revenue engine but face escalating regulatory
              risk. With state gaming commissions in New York, Florida, and other jurisdictions classifying pick'em as
              unlicensed sports gambling, Underdog faces heavy fines, class-action litigation, and forced operational
              transitions to lower-margin peer-to-peer or licensed sportsbook models.
            calloutType: risk
            claimRefs:
              - CP002
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >
              Underdog Fantasy operates a consumer sports-gaming platform structured around entry fees, contest
              commissions, and sportsbook wagering margins. In its foundational Daily Fantasy Sports (DFS)
              contests—specifically Best Ball tournaments—the company generates revenue by withholding a contest fee,
              typically retaining 10% to 15% of gross user entry fees while returning the remainder as guaranteed prize
              pools. In player prop pick'em contests, users select higher or lower performance projections across two to
              eight player legs. Rather than charging a flat fee, Underdog engineers house advantage into multi-leg
              payout odds, effectively capturing high margin against recreational parlays.


              The monetization framework expanded into licensed full-service online sports wagering with its proprietary
              technology rollout, beginning in North Carolina in March 2024. In sports betting, revenue derives from
              operator gross gaming revenue (GGR)—the statistical hold or vigorish applied across traditional spreads,
              totals, and props. Furthermore, through event contract offerings on Crypto.com Derivatives North America
              (CDNA), Underdog introduced prediction market mechanics, monetizing transactional volume and user
              participation fees.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
      - number: '4.2'
        title: Cost Structure and GTM Efficiency Drivers
        blocks:
          - type: paragraph
            body: >
              Underdog's cost architecture contrasts with legacy sports gaming operators that license third-party
              white-label betting engines. By developing proprietary betting software and in-house gaming
              infrastructure, Underdog avoids third-party platform revenue-share royalties, giving it structural gross
              margin flexibility. However, direct service-delivery costs remain substantial: payment processing
              interchange across Apple Pay, PayPal, credit cards, and bank transfers, alongside geolocation
              verification, real-time sports statistics feeds, and cloud hosting infrastructure.


              Customer acquisition economics leverage organic and creator-driven channels rather than exclusive reliance
              on national broadcast media ad buys. Underdog expanded its organic customer acquisition funnel through
              original media podcasts, retired athlete partnerships, and social creator networks, mitigating paid
              customer acquisition costs (CAC). Nevertheless, marketing efficiency faces headwinds from promotional
              deposit matches and user retention bonuses, which carry playthrough restrictions and expire after 14 days,
              driving upfront customer onboarding expenses.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI012
              - CI013
      - number: '4.3'
        title: Capital Adequacy, Regulatory Liabilities, and Acquisition Valuation
        blocks:
          - type: paragraph
            body: >
              Prior to strategic acquisition, Underdog raised $115M in venture equity across multiple financing rounds,
              including a $35M Series B in July 2022 valuing the entity at $485M, and a Series C round led by Spark
              Capital in March 2025 that secured $70M at a $1.225B pre-money valuation ($1.23B post-money). Despite
              strong top-line scale—recorded at $500M in 2022 and $466M leading into 2026—capital adequacy was tested by
              intensifying legal and regulatory liabilities. In New York, Underdog settled with the New York State
              Gaming Commission for $18M regarding temporary licensing terms, while facing class-action litigation
              alleging unlicensed sports gambling under General Obligations Law.


              On July 29, 2026, IG Group agreed to acquire Underdog Sports Holdings, Inc. for total consideration of up
              to approximately $1.3B. The transaction was structured around an enterprise value of approximately $1.1B,
              comprising $963M upfront equity value ($380M cash and 24.1M new IG ordinary shares), the repayment of
              approximately $160M of Underdog debt at closing, and an earnout of up to $200M tied to 2026 net gaming
              revenue targets and positive 2026 EBITDA. The transaction benchmarked Underdog at 2.8x trailing revenue
              ($466M) and 28.3x EBITDA, resolving standalone liquidity needs but confirming substantial pre-existing
              indebtedness and performance hurdles.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Hold Risk and Legal Settlement Exposure
            body: >
              Underdog's core high-margin Pick'em product operates in an intensifying state regulatory crosswind. With
              New York mandating an $18M settlement over licensing non-compliance and class-action lawsuits challenging
              Pick'em as unlicensed sports betting, any state-level restriction or legal reclassification poses
              immediate downward pressure on top-line handle and realized margins.
            calloutType: risk
            claimRefs:
              - CI002
              - CI011
          - type: callout
            title: Proprietary Tech Margin Advantage Versus M&A Debt Realities
            body: >
              Building proprietary sportsbook software gave Underdog an important technological differentiator over
              white-label competitors, supporting a 2.8x revenue multiple in its $1.3B IG Group buyout. However, the
              transaction terms revealed approximately $160M in outstanding debt and required positive 2026 EBITDA
              earnout hurdles, indicating that scaling consumer sports operations entailed substantial capital burn.
            calloutType: insight
            claimRefs:
              - CI006
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture, Contest Formats, and Player Workflows
        blocks:
          - type: paragraph
            body: >-
              Underdog Fantasy operates an integrated consumer sports entertainment platform that delivers streamlined
              contest workflows across iOS, Android, and web touchpoints. Founded in 2020 by Jeremy Levine, Brandon
              Stakenborg, and Trevor John, the company established immediate product-market fit by dismantling the
              friction inherent to traditional season-long fantasy management and complex salary-cap DFS platforms. Its
              flagship offering, Best Ball tournaments such as the multi-million-dollar Best Ball Mania series,
              introduces a fast-draft format where participants draft an athlete roster once prior to season kickoff,
              after which the platform's automated scoring engine calculates optimal weekly scoring combinations without
              requiring manual roster management or waiver-wire transactions. Alongside season-long tournament formats,
              Underdog scaled rapid-engagement daily fantasy games centered on Pick'em contests, where users predict
              whether professional athletes will finish higher or lower than specified statistical benchmarks set by the
              company across multiple statistical categories. In standard Pick'em entries, participants combine multiple
              individual player predictions into parlay-style slips where every individual leg must succeed to yield a
              payout, complemented by insured structures and peer-pool formats such as Pick'em Champions designed to
              navigate evolving state-level game-of-skill definitions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
