      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Fragmentation Threatens Customer Acquisition and Retention Economics
            body: >-
              Underdog Fantasy's customer economics remain heavily vulnerable to state regulatory crackdowns on
              player-prop pick'em contests. While prediction markets provide an alternative regulatory pathway via
              federal CFTC oversight, the loss of pick'em availability in major states like New York and Michigan
              constrains overall addressable player pools, inflates customer acquisition costs, and exposes the company
              to consumer restitution liabilities.
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU012
          - type: callout
            title: Retention Relies on Heavy Promotional Subsidy in Lieu of Disclosed Organic Durability
            body: >-
              In the absence of audited cohort retention disclosures, Underdog's apparent player stickiness is heavily
              reinforced by structured promotional architecture—including loss-mitigation features like Flex entries,
              injury rescues, and recurring weekly deposit matches. Diligence must establish whether users remain active
              once promotional subsidies abate or whether churn accelerates during off-season sports lulls.
            calloutType: insight
            claimRefs:
              - CU009
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Reclassification Exposure
        blocks:
          - type: paragraph
            body: >-
              The central thesis risk for Underdog Fantasy is the active regulatory and legal reclassification of its
              core pick'em gaming formats. While Underdog initially scaled rapidly under federal and state Daily Fantasy
              Sports (DFS) carve-outs, state gaming commissions across major jurisdictions have increasingly scrutinized
              whether pick'em player-prediction contests constitute unlicensed sports betting rather than bona fide
              games of skill. In late 2023 and early 2024, the New York State Gaming Commission (NYSGC) updated its DFS
              regulations to explicitly prohibit against-the-house pick'em contests, resulting in a reported $17.5M to
              $18M regulatory settlement and forcing Underdog to abruptly withdraw from the state market before securing
              a temporary permit to resume only draft-style contests. Similar enforcement actions by the Florida Gaming
              Control Commission forced Underdog to halt against-the-house pick'em in Florida, prompting the operator to
              pivot toward peer-to-peer Champions contest structures to comply with state gaming frameworks. Compounding
              administrative actions, private civil litigants filed federal class-action complaints in the Eastern
              District of New York alleging violations of New York Penal Law and General Obligations Law seeking
              recovery of wagering losses and damages exceeding $5M. The company has demonstrated agile product
              compliance by engineering peer-to-peer formats and obtaining full sports betting licensure in select
              jurisdictions such as Ohio, but state-level reclassifications continue to compress Underdog's addressable
              TAM and elevate ongoing compliance costs.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
