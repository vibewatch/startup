      - number: '6.2'
        title: Adoption Trajectory and State-Level Operational Footprint
        blocks:
          - type: paragraph
            body: >-
              Underdog Fantasy has demonstrated rapid retail customer adoption since its 2020 inception, expanding its
              public footprint across more than 40 states and Washington, D.C. The company claims millions of
              participating fans on its mobile platforms, supported by prominent flagship tournaments including its
              marquee $15 million Best Ball Mania contest. On consumer storefronts, Underdog's Android application has
              accumulated over 181,000 public reviews with a 4.8-star rating, underscoring substantial mobile retail
              distribution and brand engagement. However, platform adoption remains unevenly distributed due to
              fragmented state-by-state gaming legislation. While prediction markets and Rips operate across almost all
              jurisdictions except Nevada, pick'em prop contests face outright prohibitions or regulatory challenges in
              major states such as Michigan and New York, requiring Underdog to constantly adapt its jurisdictional
              product mix.
            claimRefs:
