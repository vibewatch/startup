  - id: FU001
    title: Underdog Fantasy Customer Journey and Monetization Lifecycle
    type: journey-map
    summary: >-
      End-to-end customer progression from promotional acquisition to retention loops, regulatory friction, and eventual
      wallet expansion.
    data:
      items:
        - label: Acquisition & Signup
          touchpoints:
            - Affiliate promo codes (GRINDERS)
            - First-time deposit match ($5 entry for $100 bonus)
            - Mobile app download (iOS/Android)
          experience: Low barrier to entry with generous introductory bet-and-get credit incentives.
        - label: Onboarding & KYC Verification
          touchpoints:
            - Identity verification against state age/location requirements
            - Sift automated fraud detection and stolen card screening
            - Bank account/card payment integration
          experience: Automated verification protects legitimate players but introduces friction in restricted states.
        - label: Core Contest Participation
          touchpoints:
            - Best Ball draft lobbies (NFL, NBA, MLB, PGA)
            - Higher/Lower player statistical Pick'em cards
            - Champions peer-to-peer contest pools
          experience: Fast and intuitive user interface optimized for quick mobile draft and prop selection.
        - label: Engagement & Retention Loops
          touchpoints:
            - Vulture protection and injury rescues
            - Weekly promotional boost tokens (More Money Mondays)
            - Flex entry loss insurance (multipliers up to 120x)
          experience: Gamified safety nets and recurring bonuses encourage repeat deposits and active weekly play.
        - label: Product Expansion & Diversification
          touchpoints:
            - CFTC-licensed prediction market outcome trading
            - Underdog Rips sports card pack purchases
            - Cross-sport seasonal draft participation
          experience: Cross-selling adjacent products expands customer wallet share outside traditional fantasy windows.
        - label: Withdrawal & Jurisdictional Friction
          touchpoints:
            - Email-confirmed payment payout (PayPal, Venmo, Trustly)
            - State-mandated deposit caps (MA, MD, TN)
            - Geofencing blocks and state regulatory cease-and-desist orders
          experience: Swift 24-72 hour cashouts counterbalanced by sudden product restrictions in banned states.
    approximationNotes: >-
      Stages and touchpoints synthesized from RotoGrinders testing reviews, Sift fraud partnership announcements, and
      state regulatory filings.
    claimRefs:
      - CU002
      - CU003
      - CU008
