  - id: TV002
    title: Thesis and Anti-Thesis Matrix
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter-Argument
      - What Would Change the View
    rows:
      - - Product & Market Fit
        - Best Ball and Pick'em formats drive rapid user growth and over $2B won.
        - Extreme seasonal dependence on the NFL season creates revenue volatility.
        - Evidence of steady off-season retention across NBA, MLB, and esports contests.
      - - Unit Economics & CAC
        - Viral contest structures acquire users at a fraction of sportsbook CAC.
        - Take rate of 10-15% is eroded by state compliance costs and licensing fees.
        - Audited contribution margins demonstrating profitability across mature state cohorts.
      - - Regulatory & Legal
        - Proprietary software and pivot to CFTC-regulated prediction markets reduce exposure.
        - Federal class-action lawsuit in NY and 7 state license surrenders threaten core model.
        - Favorable judicial ruling upholding Pick'em as games of skill under state gambling laws.
      - - Liquidity & Exit
        - IG Group acquisition offers structured liquidity up to $1.3B with earnouts.
        - Regulatory review or earnout failure could leave equity value near or below Series C.
        - Definitive regulatory approval and formal closing of the IG Group transaction.
    notes: Direct comparison of investment catalysts against structural regulatory and operational risks.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
