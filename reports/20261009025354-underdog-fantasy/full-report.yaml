      - number: '6.3'
        title: Durability, Customer Support Strain, and Adversarial Consumer Exposure
        blocks:
          - type: paragraph
            body: >-
              Because Underdog Fantasy remains a private venture-backed entity, critical customer durability
              indicators—such as net revenue retention, repeat-deposit rates, customer acquisition costs, and cohort
              churn curves—remain closely guarded trade secrets. Instead, customer retention is actively maintained
              through extensive promotional incentives, including new-user deposit bonuses, Flex entry loss protections,
              and recurring seasonal promotions such as profit boosts and referral rewards. Meanwhile, operational
              scaling has placed visible strain on customer support infrastructure: customer service representatives
              navigate heavy ticket volumes and seasonal surges during the NFL peak, leading to intermittent wait times
              and employee satisfaction disparities. Most critically, Underdog faces material adverse legal and
              regulatory exposure from consumer class action litigation alleging that unlicensed pick'em games deceptive
              to retail consumers constitute unlawful sports betting, directly threatening customer lifetime value and
              operating continuity in contested jurisdictions.
            claimRefs:
              - CU009
