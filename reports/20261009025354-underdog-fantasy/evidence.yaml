evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements detailing exact annual net gaming revenue, realized contest rake take rates, gross
      profit margins, and net cash burn.
    whyItMatters: >-
      Independent valuation and cash flow sustainability cannot be verified without audited financial records,
      especially given conflicting public estimates ranging from $73.4M to $466M.
    diligencePath: >-
      Review internal financial accounting schedules, audited income statements, or public disclosure documents from IG
      Group regarding the Underdog transaction.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration
    missingEvidence: >-
      Full historical roster of departmental vice presidents and engineering directors beyond core executive officers
      and co-founders.
    whyItMatters: >-
      Leadership and founder table sample reflects C-suite and public founders but omits secondary operational
      leadership layers.
    diligencePath: Inspect comprehensive internal organizational charts and employee directories.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-enumeration
    missingEvidence: >-
      Comprehensive private capitalization table showing exact cap-table percentages for minority angel investors,
      athlete syndicates, and seed participants.
    whyItMatters: >-
      Stakeholder or investor map reflects lead institutional venture sponsors, acquirers, and prominent celebrity
      angels, but secondary angel syndicate allocations remain private.
    diligencePath: Inspect company cap table schedules, private placement memorandums, and corporate filings.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: company-specific market sizing
    missingEvidence: >-
      Product- and state-level paid users, gross entry volume, realized take, retention, promotional spend, and
      contribution margin.
    whyItMatters: >-
      These denominators are required to distinguish broad fan interest from a serviceable and economically obtainable
      market.
    diligencePath: >-
      Request monthly cohort and state-level operating data from management, reconcile it to audited revenue, and test
      retention after promotions.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: product classification and market access
    missingEvidence: >-
      Final legal outcomes and a current jurisdiction-by-jurisdiction product availability schedule for Pick'em and
      event contracts.
    whyItMatters: >-
      The serviceable market changes if regulators or courts classify a product as wagering that requires a different
      license.
    diligencePath: Obtain outside-counsel memoranda, active licenses, regulator correspondence, and the current product-state matrix.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: unit-margins
    missingEvidence: Audited gross margin percentages, state-by-state net gaming revenue mix, and user acquisition payback periods.
    whyItMatters: >-
      Without segmented contribution margins and marketing CAC efficiency data, underwriting long-term profitability
      under state tax and licensing burdens is constrained.
    diligencePath: >-
      Obtain confidential information memorandum (CIM), audited financial statements, and monthly cohort revenue
      realization schedules.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: infrastructure-telemetry
    missingEvidence: >-
      Real-time query latency SLA metrics, internal data synchronization benchmarks, and specific live sports odds data
      provider contract agreements.
    whyItMatters: >-
      Direct operational latency and live data vendor costs dictate in-game proposition settlement speed, contest
      scalability, and operating margin structure.
    diligencePath: >-
      Request engineering architectural architecture review packets, data feed supplier master service agreements, and
      peak-draft infrastructure telemetry from management.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited monthly cohort retention curves, annual churn rates, and organic repeat-deposit frequencies for Underdog
      Fantasy users.
    whyItMatters: >-
      Without cohort retention disclosures, evaluating underlying customer durability and organic lifetime value
      separate from heavy promotional subsidies is impossible.
    diligencePath: >-
      Request confidential historical cohort retention tables and depositor retention curves from management during
      private diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: material
    topic: operational-metrics
    missingEvidence: >-
      Audited game-day peak concurrent transaction volume, server uptime SLA records during NFL Sunday slates, and
      latency benchmarks.
    whyItMatters: >-
      Technical platform resiliency during peak sports betting windows directly dictates transaction completion rates
      and customer retention.
    diligencePath: >-
      Request engineering DevOps dashboards, historical incident logs, and CDN/cloud failover test records during
      confirmatory diligence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-enumeration
    missingEvidence: Complete state-by-state regulatory filings and formal administrative inquiry correspondence outside NY and FL.
