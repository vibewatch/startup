      Reclassification risk varies across individual state attorneys general and gaming commissions, directly defining
      addressable domestic market size.
    diligencePath: >-
      Conduct 50-state regulatory review of DFS versus sports wagering definitions and pending state gaming control
      board dockets.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
