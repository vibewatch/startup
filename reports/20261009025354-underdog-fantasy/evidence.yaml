    whyItMatters: >-
      External estimates of $73.4M revenue cannot be verified without GAAP disclosures, leaving revenue multiples
      speculative.
    diligencePath: Review confidential information memorandum (CIM) or audited financial exhibits in private data room.
    relatedQuestionRefs:
      - QV005
  - type: private-evidence-only
    severity: material
    topic: ma-closing-conditions
    missingEvidence: >-
      Definitive terms, antitrust filings, and regulatory closing conditions for the IG Group $1.3B acquisition
