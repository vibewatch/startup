  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: Original incorporation documents, earliest board materials, or an official management clarification that reconciles 2014 pre-launch references with the current 2015 founding date.
    whyItMatters: Company-overview is the canonical source for later chapters; an unresolved founding-date narrative can create cross-chapter drift on identity and milestone chronology.
    diligencePath: Request formation documents, the first investor deck, or direct written confirmation from management on incorporation date versus operating launch date.
    relatedQuestionRefs:
    - QO003
    - QO004
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and clear executive org chart from an official company source.
    whyItMatters: Board visibility is necessary to assess governance quality, investor control, succession planning, and the degree of key-person dependence around Arvin Vohra.
    diligencePath: Request the latest board list, board-observer rights, and an internal org chart from Redaptive or lead investors.
    relatedQuestionRefs:
    - QO006
    - QO023
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count by geography and function.
    whyItMatters: Headcount is a key maturity and operating-leverage signal for an asset- and service-heavy platform business, especially given the disclosed India office and multi-site execution model.
    diligencePath: Request HRIS export, payroll summary, or lender presentation with current FTE count and outsourced labor mix.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
