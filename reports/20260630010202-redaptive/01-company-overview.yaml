- calloutType: risk
  title: Public disclosure is rich on financing but thin on economics and governance
  body: Redaptive discloses many rounds, facilities, and customer stories, yet the reviewed public record still does not provide current headcount, revenue, ARR, or a clearly disclosed board roster. That imbalance limits confidence in translating deployment volume into enterprise economics, and it raises diligence importance around covenant usage, customer concentration, and executive succession. Capital dependence is not necessarily a weakness for this model, but the model is difficult to underwrite externally without lender or board materials.
