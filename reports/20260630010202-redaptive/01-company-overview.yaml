- calloutType: insight
  title: The brief’s biggest factual corrections are around founders and funding labels
  body: The reviewed sources do not support the brief’s references to Bret Kugelmass, Keith Kellison, Shawn Herr, or a GIC-backed $200M facility. Instead, public founder material centers Arvin Vohra and John Rhow, while the matched $200M event points to CPP Investments in 2022 and later debt capacity comes from CDPQ, Nuveen, Deutsche, Rabobank, Mitsubishi HC Capital America, and ATLAS SP. This makes chapter 1 the right place to normalize the identity and capital-stack record before later chapters reuse it.
