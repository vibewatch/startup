callouts:
- calloutType: strength
  title: Redaptive’s moat is its financing architecture, not just retrofit know-how
  body: Most public evidence about Redaptive’s differentiation points to financing depth and recycling of contract cash flows rather than to one proprietary hardware category. The progression from warehouse lines to a $650M credit facility and then to a $216M ABS suggests the company is building a repeatable capital-market machine around enterprise energy contracts. That matters because it can let Redaptive scale faster than contractors or software-only competitors that still depend on customer CapEx approval cycles.
  claimRefs:
