  topStrengths:
    - Redaptive has credible enterprise proof across multi-site customers and publicly documented savings outcomes.
    - >-
      The company has expanded beyond venture equity into warehouse debt, a large credit facility, and ABS funding that
      can support project deployment scale.
    - >-
      The bundled model of capital, execution, and Redaptive ONE measurement creates a differentiated wedge versus pure
      equipment vendors or software-only peers.
  topRisks:
