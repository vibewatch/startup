company:
  name: Redaptive Inc.
chapter:
  number: 5
  title: Product & Technology
  summary: 'Redaptive’s product is a bundled modernization stack: structured capital, turnkey project
    delivery, and a real metering-and-analytics layer branded as Redaptive ONE. Public customer and partner
    proof shows the platform handling electricity, water, and gas monitoring, reporting, alerts, M&V,
    and increasingly storage and EV-adjacent workflows. The main gaps are public cyber-assurance evidence,
    open integration documentation, and fleet-wide uptime or SLA transparency.'
sections:
- id: '5.1'
  title: Product surface and customer workflow fit
  body: 'Redaptive does not sell a single point product; it sells a bundled modernization program that
    combines capital, execution, and a data layer. The solution page and EaaS guide frame the offer in
    operational terms: customers that cannot or do not want to spend owner CapEx can fund upgrades, generation
    assets, and energy-data tooling through operating payments tied to savings or measured performance.
    That bundle reaches well beyond lighting retrofits. Redaptive publicly lists metering and reporting,
    controls, HVAC, rooftop solar, battery storage, CHP, microgrids, generators, and EV charging as supported
    systems, then shows those modules being assembled into customer workflows for triple-net real estate,
    industrial portfolios, healthcare campuses, and developer-led onsite-power projects. The WPT and 182-property
    metering cases make the workflow concrete: Redaptive designs the metering scheme, coordinates with
    tenants and installers, commissions the devices, validates data, and turns the output into Energy
    Star, GRESB, and tenant-engagement workflows. Iron Mountain and Verdant show the same pattern in broader
    infrastructure programs, where data analytics sit alongside physical upgrades rather than after them.'
