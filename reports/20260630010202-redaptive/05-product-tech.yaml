- id: '5.2'
  title: Platform, data layer, and implementation mechanics
  body: 'The strongest public product-tech evidence sits in the metering and reporting layer. Contract
    documents define a stack that includes proprietary metering equipment, firmware, commissioning tools,
    API access, and the platform itself, while the Redaptive ONE brochure and launch coverage describe
    circuit-level and asset-level data flowing into a dashboard that supports baseline setting, reporting,
    alerts, and measurement and verification. Public customer proof goes beyond abstract claims. WPT says
    Redaptive deployed shadow metering across 16 locations in five months and cut monitoring costs by
    half, while the 182-property case shows Redaptive managing site assessment, commissioning, and data
    validation before scaling a pilot to a portfolio program. Partner proof widens the architecture: Honeywell
    adds building controls and Honeywell Forge-linked software context, HydroPoint adds non-invasive water
    monitoring, and GRESB explicitly positions Redaptive as a solution provider for interval data, tenant
    visibility, and measurement verification. The trust story is more mixed. The DPA, warranty, and terms
    give real evidence of breach notification, subprocessor controls, audit rights, support windows, API-key
    controls, and meter-quality terms. But the retained public sources still look more like commercial/legal
    scaffolding than a full public trust center, which matters because Redaptive increasingly asks customers
    to rely on a remote data and analytics layer to underwrite savings, ESG reporting, and operational
    decisions.'
