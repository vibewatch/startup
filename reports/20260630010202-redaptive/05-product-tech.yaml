  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public cybersecurity assurance
    missingEvidence: No retained public source shows SOC 2, ISO 27001, penetration-test summaries, or
      a public trust-center package for Redaptive ONE or the underlying metering platform.
    whyItMatters: Enterprise buyers are being asked to trust remote analytics, alerts, and in some cases
      optimization guidance across large portfolios, so public security assurance materially affects diligence
      comfort.
    diligencePath: Request security certifications, recent third-party audit reports, incident-response
      procedures, and a current control-matrix package for the platform and metering environment.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: developer-facing API and integration documentation
    missingEvidence: The public terms mention APIs, API keys, SDK-assisted access, and customer documentation,
      but the retained sources do not expose reference docs, auth examples, webhook/event models, or implementation
      guides.
    whyItMatters: Integration depth is part of product defensibility and implementation risk, especially
      for customers that want Redaptive data to feed portfolio systems, tenant workflows, or external
      optimization stacks.
    diligencePath: Request current API documentation, supported endpoints, auth and rate-limit design,
      sample payloads, and example production integrations with reporting or BMS/EMS systems.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: fleet uptime and service-level transparency
    missingEvidence: No retained public source discloses platform uptime, meter-read success rates, alert-delivery
      reliability, support SLAs, or outage history for Redaptive’s monitoring stack.
    whyItMatters: When the product is sold as measurable-outcomes infrastructure, uptime and service reliability
      become product quality metrics rather than back-office metrics.
    diligencePath: Request historical uptime reports, support severity targets, alert-delivery metrics,
      meter-read completeness dashboards, and named customer references willing to discuss operational
      reliability.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
