- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Redaptive solution
  - Measurable benefit
  - Limitation
  rows:
  - - Triple-net owner needs tenant utility data
    - Chase bills across tenants and utilities or accept incomplete ESG coverage
    - Install shadow meters, validate data, and route it into Redaptive ONE and Energy Star/GRESB workflows
    - WPT reports 50% lower monitoring costs; 182-site case scaled data visibility across 87.8M square
      feet
    - Public proof is concentrated in a handful of case studies
  - - Portfolio team needs verified savings and baselines
    - Model savings from engineering estimates and invoice history
    - Use circuit-level or asset-level metering plus baseline tracking for M&V and reporting
    - Public materials say the platform measures actual kWh savings and tracks performance against baselines
    - No public methodology document explains every baseline-adjustment rule
  - - Industrial or campus operator needs resilience and lower demand charges
    - Rely on grid power and manually manage peaks
    - Finance BESS, configure EMS-led peak shaving, and optionally add solar or backup power
    - Public storage guidance shows direct demand-charge reduction logic and stacked value streams
    - Tariff fit and incentive availability vary materially by site and market
  - - Developer or manufacturer needs onsite resilient generation
    - Self-fund a complex microgrid or defer the project
    - Use Redaptive financing plus partner delivery for solar, storage, CHP, and generator-backed microgrids
    - Verdant case reached a $74M zero-capex, 25-year ESA structure
    - Operational responsibility splits among partners are only lightly described publicly
  - - CRE owner wants EV charging without upfront capex
    - Procure charging hardware, site work, software, and financing separately
    - Use IUC charging-as-a-service with Redaptive capital backing and rollout support
    - Public pipeline includes several hundred committed chargers and multi-thousand-site expansion plans
    - Public material does not show charger utilization or uptime cohorts yet
  notes: Benefits are direct customer or partner-reported outcomes when available; otherwise they are
    framed as company-claimed workflow advantages.
