- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Meters, submeters, and field sensors
    - Capture electric, gas, and water usage at building or asset level
    - Customer site access, meter placement, and hardware health
    - Public sources do not disclose fleet hardware failure rates or replacement cadence
  - - Commissioning and data validation
    - Calibrate installs and validate readings against utility bills
    - Customer utility-bill access and field coordination
    - Validation can fail or remain incomplete if utility data is unavailable
  - - Cloud data platform and dashboards
    - Aggregate data, show portfolio/site analytics, alerts, and reporting outputs
    - Internet connectivity, cloud services, and customer user provisioning
    - Terms warn of outages or degraded accuracy from third-party systems and connectivity issues
  - - API and reporting integrations
    - Connect Redaptive data to Energy Star or third-party reporting workflows
    - API keys, customer identity controls, and external software availability
    - Public documentation references APIs and SDKs but not open reference docs or code examples
  - - EMS and optimization logic for storage
    - Forecast peaks and dispatch batteries against cost or resilience objectives
    - Battery telemetry, tariff logic, and forecast quality
    - Savings depend on forecasting accuracy and correct sequencing of dispatch events
  - - Partner overlay and engineering support
    - Extend the stack with controls, water intelligence, tenant utility workflows, and program design
    - Honeywell, HydroPoint, GRESB, IUC, and engineering support staff
    - Product breadth increasingly depends on partner execution and interface management
  notes: Architecture row boundaries synthesize official pages, terms, partner proof, and customer proof;
    they are not a disclosed reference architecture diagram.
