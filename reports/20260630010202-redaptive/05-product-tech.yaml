- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality lever
  - Status
  - Scope
  - Gap
  rows:
  - - Data processing addendum and subprocessor controls
    - Public contract artifact available
    - Processor obligations, confidentiality, breach notice, audit rights, SCC-related transfer terms
    - No public SOC report, penetration-test summary, or trust-center dashboard
  - - API and user-access restrictions
    - Public contractual controls visible
    - Authorized users, API keys, use restrictions, suspension rights, anti-circumvention language
    - No public auth-flow examples or developer reference guide
  - - Meter validation against utility bills
    - Explicitly required
    - Calibration and accuracy support for installed metering
    - Requires customer utility-bill access and is vulnerable to incomplete data handoff
  - - Support services
    - Public support window disclosed
    - Business-hours remote troubleshooting and case initiation workflow
    - No public severity-tier SLA or uptime commitment table
  - - Equipment warranty
    - Public warranty artifact available
    - Five-year parts warranty for gas and electric meters; third-party hardware uses OEM warranties
    - No public fleet-level defect rate or claims history
  notes: This table captures only controls visible in retained public materials; absence claims refer
    to missing public evidence, not to proof that private controls do not exist.
