  rows:
  - - Infrastructure monetization / EaaS program
    - CFO, sustainability, facilities leader
    - Commercial core offer
    - Bundles capital, delivery, and measured outcomes instead of a single retrofit loan
    - Public sources do not disclose cohort-level contract renewal or default rates
  - - Redaptive ONE data and reporting platform
    - Energy, sustainability, asset management teams
    - Commercial and customer-proven
    - Cloud-based electric, water, and gas visibility tied to reporting, alerts, and M&V
    - No public customer-facing API reference or role-permission model detail
  - - Shadow metering / utility data capture
    - Triple-net portfolio owners and property teams
    - Commercial and scaled
    - Turns tenant-controlled utility data into owner-accessible interval data without bill scraping
    - Public docs do not quantify meter failure rates or recalibration cadence
  - - Generation and storage offering
    - Industrial, developer, and resilience-focused operators
    - Commercial but partner-composed
    - Combines storage, solar, microgrid, and CHP funding with EMS-guided savings logic
    - Asset ownership splits and site-level operating responsibilities are not fully public
  - - EV charging financing partnership
    - Commercial real estate owners, parking operators, REITs
    - Scaling through partner channel
    - Pairs Redaptive capital with IUC charging-as-a-service delivery for portfolio deployments
    - Redaptive does not publish charger software, uptime, or driver-support standards
  - - Controls and mechanical modernization layer
    - Facility engineering and operations teams
    - Commercial core offer
    - Can wrap controls, HVAC, lighting, and other measures under one implementation and financing program
    - Public sources are thin on named control-system integration patterns beyond Honeywell context
  notes: Rows mix official product pages, customer proof, and partner proof; maturity labels reflect public
    deployment evidence rather than private revenue mix.
