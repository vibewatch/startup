- calloutType: strength
  title: The metering and reporting layer looks like a real product, not a presentation wrapper
  body: 'Contracts, brochures, customer cases, and third-party coverage all point to the same product
    core: Redaptive owns a real meter-plus-platform layer that captures utility data, validates it, and
    turns it into reporting, alerts, and measurement workflows.'
  claimRefs:
  - CE007
  - CE008
  - CE014
  - CE018
  - CE019
  - CE020
- calloutType: insight
  title: Distributed-energy breadth is real, but the stack is deliberately partner-composed
  body: Solar, storage, microgrid, and EV offerings are publicly visible, yet the deepest control and
    deployment proof comes through partners such as Honeywell, HydroPoint, Verdant, and IUC. Redaptive’s
    role is orchestration, capital, metering, and outcomes—not building every subsystem itself.
  claimRefs:
  - CE022
  - CE023
  - CE026
  - CE029
  - CE030
  - CE042
- calloutType: risk
  title: Public trust, API, and fleet-reliability transparency lag the ambition of the platform story
  body: Redaptive publishes privacy, warranty, and terms artifacts, but the retained public materials
    do not expose open API reference docs, a public trust center, or fleet-wide uptime/SLA evidence. Those
    gaps matter because the product increasingly asks customers to rely on remote data and controls for
    business-critical decisions.
  claimRefs:
  - CE010
  - CE034
  - CE035
  - CE039
