        - 若公开披露评级结果、损失历史和预付率，这项融资优势会更持久，也更容易估值。
      - - 客户验证
        - 包括 McKesson、Iron Mountain 和 UniFirst 在内的大客户案例显示，企业部署真实存在，不只是试点。
        - 留存、续约和集中度数据会把使用验证转成价值验证。
      - - 战略验证
        - Honeywell 的投资和计划内部部署说明，工业合作伙伴认为该平台有用。
        - 披露估值基准或后续战略轮，会显著增强价格支撑。
      - - 反方：分母风险
        - 公开收入估算互相冲突，且没有一个经过公司审计。
        - 经审计的收入、利润率和现金流披露，可能迅速补上分母缺口。
      - - 反方：公开可比公司压力
        - 透明的公开能源基础设施和清洁能源软件公司，收入倍数低得多。
        - 只有私下尽调显示 Redaptive 经济性优于公开可比公司，这个溢价才更站得住。
    notes: 反方不是说 Redaptive 没有需求，而是公开记录尚未证明这只股权值得享受溢价倍数。
