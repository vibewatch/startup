      - CU037
  - id: FU003
    title: 采购和扩张流程
    type: flow
    layout: wide
    summary: 展示 Redaptive 从合同批准到重复扩张必须跑通的运营顺序。
    data:
      nodes:
        - id: pain
          label: 识别痛点
          description: 延期维护、ESG 报告压力、韧性风险或公用事业成本上升，让发起人必须行动。
        - id: business-case
          label: 搭建商业方案
          description: Redaptive 把项目转成 OpEx 式服务方案，而不是 CapEx 申请。
        - id: data-rights
          label: 数据 / 访问获批
          description: 必须拿到公用事业账单访问、租户协调、场地勘查和验证输入。
        - id: contract
          label: 签署主协议
          description: 多年期条款、付款逻辑和访问权确定；根据平台条款，错过付款可能触发暂停。
        - id: deployment
          label: 部署 + 计量
          description: 安装照明、HVAC、太阳能、储能或计量，并在资产层面测量。
        - id: expand
          label: 扩张决策
          description: 首批项目跑通后，可以增加更多场地或技术，而不必重走完整采购周期。
    approximationNotes: 该流程结合了 Redaptive 法律条款、EaaS 合同描述和客户故事中的采购叙事；具体顺序可能因账户而异。
