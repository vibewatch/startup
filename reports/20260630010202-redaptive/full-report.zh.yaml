    title: 分销 / 信任 / 转换成本图谱
    columns:
      - 供应商 / 类别
      - 主要渠道或触达买方路径
      - 交付 / 信任信号
      - 可能的转换或多供应商并用动态
      - 对 Redaptive 的风险
    rows:
      - - Redaptive
        - 围绕延期维护、可持续发展和资产组合升级直接销售给企业
        - 可计量结果、供应商中立叙事，以及机构融资伙伴
        - 资产组合项目启动后最强，但公开资料未显示终止摩擦
        - 需要证明融资之外的价值，才能守住对既有厂商的份额
      - - Ameresco
        - 公共部门、机构、公用事业和企业基础设施采购
        - 50+ 个办公室、1,500+ 名员工，以及长期预算中性合同记录
        - 服务覆盖广，可能降低买方再引入专业厂商的需求
        - 采购方看重一家上市公司全服务交易对手时，Ameresco 更容易赢
      - - Schneider Electric
        - 微电网、韧性项目和合作伙伴生态路径
        - 全球自动化品牌，加上拥有 20+ 家伙伴的项目资本计划
        - 生态结构能让 Schneider 在更广的韧性项目里更黏
        - 在韧性主导、社区规模或伙伴拼装项目中，可能把 Redaptive 挤出去
      - - NORESCO / ENFRA
        - 联邦公用事业总协议、园区采购和自执行基础设施路径
        - NORESCO 的联邦项目资历；ENFRA 的工程和施工深度
        - 单一责任承包商逻辑会削弱买方另请融资专家的意愿
        - 买方已熟悉 ESPC/UESC 或希望自执行交付时，威胁尤其大
      - - CPower
        - 电网项目和 DER 业主路径
        - NRG 持股、VPP 规模和市场准入经验
        - 更容易与现有资产或其他改造供应商搭配，而不是完全替代它们
        - 灵活性价值可能被其分流；当收入货币化比现代化融资更重要时，它也可能成为优先替代方案
      - - Budderfly
        - 面向分布式商业网点和加盟体系的直接路径
        - 信息简单、持续监控，以及不断增长的全国网点基础
        - 多网点运营商很容易先在部分地点试点
        - 在小型商业场景重叠度高；这些客户更看重合同简单，而不是定制化项目设计
    notes: 本表聚焦买方触达路径和运营信任，因为公开证据显示，这些因素比单纯功能主张更能拉开差异。
