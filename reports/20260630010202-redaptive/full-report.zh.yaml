  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Redaptive
              不应被当作大宗能源销售商或纯楼宇软件供应商来分析。其公开材料把市场定义为面向大型资产组合的外包式基础设施现代化：服务商带来资本、项目交付和持续计量，让客户购买结果，而不是直接拥有设备。因此，纳入支出包括照明、HVAC、控制等能效改造，以及部分可再生能源或充电项目；还包括验证节省、支撑
              ESG 或投资者报告所需的计量、基准和公用事业智能层。排除支出包括大宗电力销售、公用事业输配基础设施，以及不依赖第三方融资或长期服务合同的通用资产负债表融资改造。现状方案很碎片：CapEx
              委员会、有担保租赁或贷款、可用地区的 C-PACE、传统 ESCO 合同，以及人工采集公用事业数据。这一边界很重要，因为 Redaptive
              赢在融资摩擦和计量摩擦同时存在的场景，尤其是租赁或多站点环境；业主、租户和设施团队的激励天然不一致。
