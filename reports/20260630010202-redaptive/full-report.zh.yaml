      - number: '2.2'
        title: 受证据约束的规模测算口径
        blocks:
          - type: paragraph
            body: >-
              “面向多站点商业建筑的 Energy-as-a-Service”没有单一权威公开 TAM，因此本章保留多个相邻口径，而不是假装它们能合成一个干净数字。漏斗底部是一个很大的底层支出池：EIA
              称，在最近一次完整全国调查中，美国商业建筑能源支出为 $141 billion；DOE 和 AEO 2026 也都把商业建筑能耗描述为巨大且仍在增长的问题。围绕这个支出池，分析师对 EaaS
              的估算随范围差异很大。有的只覆盖北美商业 EaaS，有的覆盖全部北美 EaaS，还有的覆盖 Redaptive 也触及的相邻改造或 BEMS 层。这些差异有分析价值，而不是噪音：它们说明 Redaptive
              处在融资、改造执行和数据服务的交汇处。公开来源支持一个规模大且增长中的可服务市场，但不支持为 Redaptive 给出精确的收入口径 SOM；这仍是尽调缺口。
