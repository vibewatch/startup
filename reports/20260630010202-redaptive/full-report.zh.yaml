      - number: '2.3'
        title: 买方、用户与预算所有者分层
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的买方图谱是多线程的，而不是单一线程。在房地产场景，最初的拥护者往往是需要可审计公用事业数据来做 GRESB
              或投资者报告的可持续发展或资产管理团队；但最终经济账还必须打动物业管理团队、租户和业主。在大型工业或物流资产组合中，用户需求通常是降低运营成本或缓解延期维护，设施和运营团队推动实施，财务团队审查服务合同经济性。在
              Iron Mountain 或 UniFirst 这样的企业项目中，当净零要求和 OpEx
              灵活性对齐，高级设施领导层就能赞助现代化。因此，“买方”很少是单一画像：可持续发展团队关心可审计数据，设施团队关心执行和停机，财务关心表外或服务费处理，业主关心租户协同或资产价值。Redaptive
              的市场在这些群体都被老旧基础设施困扰、但没人愿意为传统的全资产组合 CapEx 项目买单时最强。
