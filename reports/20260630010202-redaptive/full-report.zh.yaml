        title: 单位经济性代理指标与交付经济性
        blocks:
          - type: paragraph
            body: >-
              Redaptive 虽未披露公司级财务报表，却提供了异常丰富的客户结果代理指标。在具名案例中，公司用零前期资本部署、保留客户 CapEx、多站点铺开和十年总能源节省来呈现价值。仅 Iron Mountain
              就被描述为一个覆盖 382 处设施、持续十年的项目，预计产生 $101.7 million 总节省，并保留 $45.9 million 客户资本；Berry
              Global、McKesson、Cintas、Saint-Gobain 和 UniFirst 也都被呈现为具备可量化节省、减排和部署面积的资产组合级项目。这些披露意味着 Redaptive 的 GTM
              动作面向大型企业资产组合，管理层称项目通常从约 500,000 平方英尺起步也强化了这一点。它们还显示，Redaptive
              的经济性证明点是客户净收益和预算可预测性，而不是披露的供应商利润率。这一点很重要，因为同一批公开材料确认 Redaptive
              保留施工、资产表现、激励收取和部分维护风险。结果是：这个模式对客户可以很有商业说服力，但供应商侧毛利、损失拨备和融资利差经济性仍不透明。
