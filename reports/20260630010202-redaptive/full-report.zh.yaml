  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 公开或私下收入确认不及预期
        - 当前年收入被证明更接近公开低端估计，而不是明显更高的私下数据。
        - 相比公开可比公司倍数，历史 $1B 标记显得偏高。
        - 按公开可比区间重切估值，避免以溢价进入。
      - - ABS / 评级不及预期
        - 最终评级、利差或损失表现明显弱于管理层叙事暗示。
        - 合同融资优势变得不那么持久，也不那么可扩展。
        - 从「继续研究 / 跟踪」转为回避，直到重新核算融资经济性。
      - - 出现稀释性股权融资
        - 公司以低于 2022 年独角兽标记的价格融资，或附带较重优先权条款。
        - 新价格发现会把基准向下重置。
        - 除非稀释同时换来异常强的增长可见度，否则视为论点破裂。
      - - 客户集中度或续约转弱
        - 大客户群显示不续约、重新定价压力或高度集中。
        - 客户证明不再转化为持久企业价值。
        - 重新评估收入质量，并收窄任何牛市情景区间。
      - - 公开可比公司倍数再次压缩
        - 高端公开能源基础设施倍数明显跌破当前区间。
        - 即便执行强劲，也未必支撑溢价私募定价。
        - 在参与前，要求相对 2022 年标记有更大折价。
    notes: 这些触发项聚焦可衡量的估值传导，而不是泛泛的宏观恐惧。
