  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入与增长
        - 最新经审计或董事会批准的收入桥，包括 2025 年和 2026 年年初至今表现。
        - 没有分母，就无法承销隐含倍数。
        - 在 NDA 下索取经审计财务包和 cohort 桥。
      - - 毛利率与现金转化
        - 项目层面和合并口径的毛利率、EBITDA、现金流和营运资本状况。
        - 如果利润率偏薄，结构化融资可能掩盖普通股经济性疲弱。
        - 结合管理层和贷款方材料，要求审阅财务工作流。
      - - ABS 经济性与评级
        - 最终 Kroll 结果、垫付率、信用增级、逾期 / 损失数据和契约包。
        - 这现在是融资论点和下行风险的核心。
        - 从财务或资本市场团队获取发行材料和贷款方 deck。
      - - 股权结构与优先权
        - 清算优先权、反稀释保护、可转换性、认股权证，以及 2024–2025 年资本附带的权利。
        - 即便头部估值看起来有溢价，普通股进入经济性仍可能很差。
        - 与法律顾问审阅 cap table 模型和所有治理文件。
      - - 客户质量
        - 续约率、集中度、合同条款、节省验证和违约历史。
        - 只有合同持久且可回款，客户证明才有意义。
        - 索取头部客户清单和合同样本集。
      - - 退出路径
        - 管理层对战略出售、私下再融资、二级流动性和 IPO 准备度的看法。
        - 可能的退出路线会改变持有期、治理需求和可接受进入价格。
        - 在管理层会议和董事会材料中讨论明确退出情景。
    notes: 每个尽调问题都与投资相关，因为缺失信息可能显著改变建议或价格容忍度。
    claimRefs:
      - CV037
      - CV038
