        title: 资本栈、项目融资与额度演进
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的融资历史显示，其运营模式既建立在股权支持上，也建立在反复获取结构化信贷的能力上。公开来源显示，Deutsche Bank 在 2023 年提供 $125 million
              仓储额度，用于证券化客户合同并支持有竞争力的定价；ATLAS SP 在 2024 年提供 $225 million 仓储额度，启动更宽的设备融资产品组合；CDPQ 和 Nuveen 在 2025 年 5 月提供
              $650 million 信贷额度；Deutsche Bank 安排了 2025 年 12 月约 $216 million 的首单证券化。Tracxn 的融资时间线还记录了 2024 年 10 月 $100
              million Series E 以及此前股权轮，说明公司把股权与越来越机构化的债务混合使用。2025 年证券化是最有信息量的材料，因为第三方披露展示了抵押资产池，而不只是新闻稿标题金额。KBRA
              描述的资产池包括面向 46 个债务人的 1,445 份租约，证券化价值约 $244.5 million，包含预融资池；SEC ABS-15G 文件确认 Redaptive Sustainability
              Services 发起该交易，并附上 Deloitte 商定程序报告。这套架构有利于资本获取，但也说明增长依赖仓储、定期债务和资本市场持续接受，而不是内部现金生成。
