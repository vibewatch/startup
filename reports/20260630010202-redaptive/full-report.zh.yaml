            body: >-
              最终投资判断取决于一小组缺失的私人事实，而不是找到更多公开赞美。第一，投资者需要当前收入桥、利润率结构和现金转换视图，因为公开估计相互冲突，且没有一个来自经审计的公司披露。第二，投资者需要合同级融资数据：ABS
              预付率、客户集中度、损失、逾期历史和最终评级结果。第三，投资者需要股权结构细节，包括清算优先权，以及任何可能使新普通股居后的结构化资本附加条款。第四，投资者需要留存和续约质量证据，让客户证明转化为持久价值，而不是一次性项目胜利。如果这些尽调请求返回强结果，判断可以从继续研究转向跟踪或更好。如果结果较弱，或
              Redaptive 需要按类似上市可比公司的倍数补充股权，论点会很快破裂。因此，本章建议有意保持对证据和价格敏感。
