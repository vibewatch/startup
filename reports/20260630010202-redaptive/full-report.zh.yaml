      - number: '6.3'
        title: 合同形态与采购含义
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的客户承诺离不开其合同结构。在公司自身对 EaaS 与 ESCO 的解释中，EaaS 是供应商融资的多年期服务协议——通常 5 到 20 年——而不是固定范围设备采购。Equipment
              Finance Advisor 补充称，Redaptive 使用履约合同，依靠约 10 到 15
              年期限内计量节省的一定比例来还款。这种结构可以缩短资本受限客户的商业论证周期，但并不会消除采购复杂度。在房地产用例中，Redaptive 仍需要公用事业账单访问、计量验证、租户协调和物业经理认同。DaaS
              条款把这一点说得很直白：Redaptive 称，如果不能用客户公用事业账单验证，就无法确保适当的仪表准确性。平台和 DaaS
              条款在签约后也具有运营意义，因为它们把访问限制在授权用户，允许因未付款或安全担忧暂停服务，并排除停机或利润损失责任。最强的扩张证据——Iron Mountain
              和生命科学制造商——说明了主协议为什么重要：一旦一个安装点跑通，Redaptive 可以增加站点或技术，而不必每次重启 RFP。
