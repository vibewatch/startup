              把分析、需求管理、DER、微电网、运营和项目融资叠进一个长期成熟的全服务模式。Schneider 更偏韧性、微电网以及由合作伙伴支持的所有权或运营。NORESCO 以保证节省型 ESPC 和公用事业支持的
