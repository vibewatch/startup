      - number: '7.3'
        title: 法律、监管与数据风险
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的法律和监管负担不轻，因为公司处理平台数据、计量表安装申请、跨境个人数据条款，以及在压力情境下分配风险的合同语言。隐私政策称，Redaptive
              收集联系方式、雇佣信息、设备标识符和能源使用数据；DPA 又把业务纳入 GDPR、英国、瑞士和 EEA
              传输规则、SCC、子处理方监督和数据主体权利。加州隐私法还增加了单独的披露和响应义务。同时，平台和数据条款把不可抗力定义得足够宽，纳入公用事业中断和政府命令；设备质保只覆盖零件，排除拆除和重新安装成本，并把第三方硬件推给制造商质保。这些对基础设施软件并不异常，但意味着隐私投诉、数据传输问题或计量故障，会比普通营销页面暗示的更快变成合同争议。Redaptive
              的公开材料没有展示经审计的安全状态、事故历史或公开子处理方名单，剩余监管和法律风险仍然实质存在。
