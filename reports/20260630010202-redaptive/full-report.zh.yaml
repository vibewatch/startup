    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 城市级建筑绩效标准（NYC、Boston、DC）
        - 驱动因素
        - 当前生效，并持续收紧至 2030 年以后
        - 推动业主计量并升级建筑绩效
        - 哪些受覆盖的建筑细分市场与 Redaptive 当前垂直行业组合重叠最多？
      - - 179D 税收扣除和现行工资加成
        - 驱动因素
        - 当前
        - 改善深度改造经济性，并可能提升项目可行性
        - Redaptive 近期管线中，实际把 179D 变现的比例是多少？
      - - 商业建筑能源需求和用电增长
        - 驱动因素
        - 当前至长期
        - 支撑庞大的支出池，并提高能效或负荷控制的价值
        - 哪些垂直行业的公用事业强度上升最快？
      - - 基准对标和可审计数据工作流
        - 驱动因素
        - 当前
        - 让计量和报告成为采购动作的一部分，而不只是锦上添花
        - 赢单中有多少比例始于数据或基准对标项目，而不是 CapEx 替换项目？
      - - 热泵和电气化势头
        - 驱动因素
        - 当前至中期
        - 将升级范围从照明扩大到更大的 HVAC 和电气化项目
        - Redaptive 能否持续承保电气化占比较高的节省案例？
      - - 租赁建筑里的激励错配
        - 约束
        - 结构性 / 持续存在
        - 除非解决成本转嫁，否则会压低业主出资升级意愿
        - 哪些合同结构已经跑出可重复的业主—租户对齐？
      - - 回收期长，项目预算达六到七位数
        - 约束
        - 结构性 / 持续存在
        - 承保、融资和风险转移成为采用的关键
        - Redaptive 在较长期限项目上有什么损失或违约经验？
      - - 绩效信任和计量要求
        - 约束
        - 当前
        - 客户需要高置信度的节省和运营证据，才会规模化铺开
        - 早期数据项目转化为改造融资的频率有多高？
      - - 现有厂商融资深度带来的竞争
        - 约束
        - 当前
        - 大型现有厂商可以打包资本、服务和既有客户关系
        - 面对 Ameresco、JCI、Schneider 或 Siemens，Redaptive 在哪里赢、哪里输？
      - - 公开市场定义模糊
        - 约束
        - 当前
        - EaaS、ESCO、改造和 BEMS 口径重叠，Redaptive 份额或定价很难对标
        - 管理层能否提供清晰的内部 SAM 分类，以及按垂直行业拆分的发起量？
