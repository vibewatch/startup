      - number: '1.3'
        title: 融资、估值与资本栈
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的资本历史很重要，因为其商业模式离不开融资能力。最强的公开估值证据仍是 2022 年 12 月 CPP 支持的融资轮：外部报道和 Tracxn 都支持约 $200M 的融资事件，Tracxn
              还把该轮标注为 $1B 投后估值。2023 年，公司把 Series E 扩至约 $250M，投资方包括 Honeywell、CPP Investments、CBRE、Linse Capital
              等。此后，融资叙事明显转向结构化债务和项目资本，而不是典型风险投资轮。


              仓储融资和信贷额度的时间线对公司概览章节格外重要，因为它定义了 Redaptive 的运营护城河。Deutsche Bank 在 2023 年 8 月提供 $125M 仓储额度。ATLAS SP 在 2024 年
              4 月新增 $225M 仓储额度，用于设备融资。一个月后，Deutsche、Rabobank 和 Mitsubishi HC Capital America 又把另一项额度扩至 $250M。CPP 随后在
              2024 年 10 月追加 $100M 股权。2025 年 5 月，CDPQ 和 Nuveen 提供 $650M 信贷额度；2025 年 12 月，Redaptive 宣布首单由长期 EaaS 合同支持的
              $216M ABS。


              这一序列显示，公司融资方式更像混合型基础设施金融平台，而不是纯软件创业公司。复杂性也解释了为什么公开数据集里的总资本数字差异很大。Commercial Observer 称 Redaptive 在 2024
              年后续融资后总资本超过 $1B；Tracxn 追踪为 11 轮 $733M；CB Insights 显示 16 轮
              $1.978B。这些总数未必互相矛盾——它们似乎反映了对仓储债务、信贷额度和证券化所得的不同处理方式。对尽调而言，实际含义很清楚：当前投后估值、已消耗总资本的精确数值，以及债务与股权的归一化，都需要公司或投资方直接确认。
