      - number: '4.4'
        title: 信用、交易对手与披露边界
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的证券化披露比普通私营公司新闻稿更能增强对合同支持规模的信心，但也暴露了公开承保的边界。抵押资产池横跨 46 个债务人，但 KBRA 仍指出有意义的集中度：Texas、California 和
              New Jersey 占证券化价值的 43.2%，约一半资产池为绩效调整付款，而不是完全固定付款。加权平均剩余期限为 95 个月，拉长了对客户信用质量、设备表现和节省验证纪律的暴露。ESG Dive
              补充称，首单证券化有意排除了经济性依赖投资税收抵免的资产，使公开资产池更容易评级，但可能比公司的完整部署范围更窄。同时，Redaptive 自身公开指标更像营销口径，而不是经审计口径：一个官方页面称已融资
              $1.2 billion-plus，2026 年高管简报则称已投资 $1.6 billion-plus、18,700-plus 个项目和 $480 million
              客户节省。这些数字可能反映不同日期或定义，但漂移突出了缺少可对账 KPI 包的问题。公开材料仍未披露收入、毛利、烧钱、跑道、队列损失、按收入计算的客户集中度，或 ABS 票息和信用增级条款。
