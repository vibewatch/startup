      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Arvin Vohra 是今天 Redaptive 有清晰证据支撑的公开门面。2024–2025 年官方融资公告把他列为 CEO，独立资料也把他的背景指向 Lehman Brothers、Barclays 和
              Enlighted 的能源结构化融资经历。已审阅的创始人材料还指向 John Rhow 这位另一名联合创始人，但公开记录并不对称：Rhow 出现在创始人访谈和数据平台里，近期官方融资材料却几乎完全聚焦
              Vohra。Built In 在 2022 年末仍显示 Rhow 为执行董事长兼总裁，CB Insights 也继续把他列为创始人兼总裁。


              CEO 之下，Redaptive 公开展示的领导层是选择性披露，而非完整披露。Monish Sharma 在 2024 年 10 月被介绍为新任 CTO；Joel Ullmann 在合作伙伴计划公告中以
              Chief Partnerships Officer 身份出现；Matt Gembrin
              多次作为资本市场高管露面，负责仓储、信贷和证券化交易。这足以证明公司在技术、合作伙伴和融资职能上有可运转的班底，但不足以推断出完整披露的高管组织架构。


              治理透明度比融资透明度更薄。官网没有发布董事会页面，CB Insights 则列出 Sheeraz Haji
              为董事。由于董事会名单不完整，且当前大多数官方沟通都强调少数几名领导者，治理可见度仍是局部的，关键人物依赖看起来偏高——尤其围绕 Vohra 在战略、融资和外部商业拓展中的锚点角色。
