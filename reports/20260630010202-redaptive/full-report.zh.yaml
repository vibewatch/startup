  - id: TP005
    title: 护城河持久性 / 竞争风险登记表
    columns:
      - Redaptive 的护城河主张
      - 主要威胁
      - 严重程度
      - 当前证据
      - 缓释措施 / 尽调问题
    rows:
      - - 资产组合层面的融资加可计量结果，比单纯设备销售更难复制
        - 既有 ESCO 同样能去掉前期成本，并打包交付、O&M 和采购渠道
        - 高
        - Ameresco、Schneider、NORESCO 和 ENFRA 都在营销「融资 + 交付」结构
        - 要求按垂直行业提供赢单 / 输单数据，并证明客户为何选择 Redaptive 而不是全服务既有厂商
      - - 资本市场支持的合同证券化带来差异化资金深度
        - 大型既有厂商和同业仍可通过上市公司资产负债表、伙伴网络或私募基础设施投资者获得大规模项目资本
        - 中
        - Redaptive 完成首单 ABS，但 Schneider 伙伴提到 $7.5B，Budderfly 称已募集资本超过 $1B
        - 询问证券化后，Redaptive 相对同业的定价或客户经济性有何改善
      - - 买方不喜欢锁定生态时，供应商中立的现代化方案有吸引力
        - 买方可能更偏好单一自执行或平台型既有厂商，因为后者掌控更多设计、控制系统和现场执行
        - 中
        - ENFRA 自执行；Siemens 和 Schneider 更深地嵌入控制与运营；NORESCO 垂直整合
        - 验证供应商中立采购是否提高实际节省、速度或资产正常运行时间
      - - Redaptive 可以把自己定位为替代现状 CapEx 预算的方案
        - ESPC 和 UESC 已在机构采购中把零前期现代化做成常态
        - 高
        - DOE 和 NORESCO 材料显示，ESPC/UESC 路径成熟，带有保证节省和公用事业总协议
        - 说明 Redaptive 在哪些场景赢过 ESPC，而不只是与 ESPC 并存
      - - 分布式网点项目管理是一个可防守的细分位
        - Budderfly 以更简单的信息和不断增长的 VPP 叠加层，直接争夺分布式商业网点
        - 中
        - Budderfly 报告 8,000+ 个网点、管理 340.8 MW，并提供少报价摩擦、零前期投入的打包方案
        - 按网点形态拆分 Redaptive 管线，并询问 Budderfly 是否更多出现在小型场景机会中
      - - 现代化数据和监控可能带来黏性
        - 合同上线后，公开资料未显示转换成本、续约率或多供应商并用行为
        - 重大
        - 每家供应商都强调监控或长期绩效，但公开合同细节有限
        - 在假设黏性可持续前，要求提供总留存、续约和提前终止统计
    notes: 严重程度反映 Redaptive 定价权和赢单质量承压，而不是现代化需求是否消失。本表有意列出替代合同模式和相邻玩家，不只列直接 EaaS 同业。
