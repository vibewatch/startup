      - number: '7.2'
        title: 项目执行与履约风险
        blocks:
          - type: paragraph
            body: >-
              执行风险位于模式核心，因为 Redaptive 不只是为设备融资；它还审计、设计、采购、安装、维护、计量，并按实现的节省开票。DOE 的 AT&T 案例称，Redaptive 协调了近 650
              处设施和大量承包商的铺开；Redaptive 自有案例也显示，Iron Mountain、Cintas、McKesson、一个 182
              站点的房地产计量组合、一个七年期生命科学现代化项目和一座医院冷却站更换都有类似规模。这种广度证明需求存在，也抬高了验收延迟、基线争议、安装延期和调试复杂度的风险。医院案例尤其有说明力：付款会延后到冷却站完工并验收之后；AT&T
              案例则明确把月度账单和计量节省挂钩。如果节省被高估，或硬件、控制系统、分包商表现不达标，Redaptive 既要补救运营问题，也会承受现金回收压力。从照明扩展到
              HVAC、太阳能、储能、计量表和数据解决方案，会扩大钱包份额，但质量控制、安全和供应商管理只会更难，不会更简单。
