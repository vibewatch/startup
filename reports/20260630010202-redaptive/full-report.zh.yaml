    rows:
      - - Redaptive
        - 直接 EaaS 专业厂商
        - 私有平台，已融资项目超过 $1.2B，并发行由 Fortune 500 合同支持的首单 ABS
        - 有延期维护和可持续目标的多站点商业及工业资产组合
        - 组合级现代化、节省分享合同和实时计量
        - 公开证据在融资和监测上最强，未披露赢率或标价
      - - Ameresco
        - 现有 ESCO / 基础设施集成商
        - 上市公司，1,500+ 名员工、50+ 个办公室，已获取 / 筹集 $3.5B+ 项目融资
        - 联邦、州、地方、教育、医疗、数据中心、公用事业和工业客户
        - 预算中性的 ESPC、PPA、表外 EaaS、DER、微电网和 O&M，一套动作打包
        - 服务面更宽，可能显得不够厂商中立，或不如融资主导的专业厂商聚焦
      - - Schneider Electric
        - 现有能源与韧性集成商
        - 全球上市公司品牌，按年报节奏披露；一项 20+ 伙伴韧性计划关联 $7.5B 资本
        - 大型企业、市政、园区，以及以韧性为主线的基础设施买方
        - 能与伙伴一起融资、设计、建设、持有、运营并维护 EaaS 或微电网项目
        - 定位更偏韧性和生态编排，而不是纯粹的改造融资切口
      - - Siemens Smart Infrastructure
        - 现有智慧基础设施平台叠加选择性 EaaS
        - 全球上市公司平台存在感；本次抓取证据主要集中在 Building X 和一个 EaaS 案例研究
        - 需要控制、优化和服务支持型现代化的工业和建筑业主
        - 能把智慧基础设施软件、控制、电池储能，以及 Siemens Financial Services 支持的 OPEX 结构组合起来
        - 本组公开证据比 Ameresco、Schneider 或 NORESCO 更窄，也更偏具体案例
      - - NORESCO
        - 现有联邦 / 机构 ESCO
        - 40+ 年、10,000+ 座设施、$5B 保证节省，具备 DOE 和公用事业合同资历
        - 使用 ESPC 或 UESC 路径的联邦机构、机构客户和基础设施业主
        - 保证节省型 ESPC 执行，以及由公用事业支撑的 UESC 路径，联邦可信度很深
        - 采购和设施现代化导向，可能让它在私营多站点 C&I 资产组合中差异化不够
      - - ENFRA (Bernhard)
        - 直接 / 现有厂商混合体
        - 2,600+ 名员工、20+ 个 EaaS 合作关系，Bernhard 时代扩张后已融资项目超过 $2B
        - 医疗、高等教育、酒店和工业基础设施业主
        - 在一个整合品牌下自营工程、施工、维护和 EaaS
        - 更名时间较近，公开证据没有披露详细定价或更名后的赢率数据
      - - CPower
        - 相邻替代品
        - NRG 旗下 VPP 平台，覆盖 23,000+ 个站点、6.7 GW，自 2015 年以来向客户交付 $1.4B
        - 寻求电网市场收入和灵活性变现的大型能源用户和 DER 所有者
        - 把灵活负荷、电池、发电机和微电网变成经常性电网收入
        - 不能纯粹替代全站点现代化，或融资主导的延期维护项目
      - - Budderfly
        - 直接相邻的分布式站点 EaaS
        - 私营公司，收入运行率 $250M，8,000+ 个站点，管理 340.8 MW，已融资超过 $1B
        - 餐厅、零售、健身房、便利店、办公室和其他分布式商业站点
        - 面向小体量多站点运营商，提供简单的零前期升级、监测、维护和简化账单
        - 相比 Redaptive 或 ESCO 现有厂商，它在定制化园区、工业或公共基础设施现代化上的定位不那么明显
    notes: 各行聚焦本次审阅来源中记录最清楚的直接、现有厂商、相邻和替代类别；规模信号只使用本轮抓取到的公开证据。
