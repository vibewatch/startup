      - number: '1.4'
        title: 客户、规模信号、里程碑与负面事项
        blocks:
          - type: paragraph
            body: >-
              客户验证是 Redaptive 最强的公开资产之一。官方案例研究验证了 Berry Global、McKesson、Iron Mountain、Cintas、Saint-Gobain 和 WPT Capital
              Advisors 等具名部署；2024 年 10 月股权公告则称 Redaptive 服务超过 40 家 Fortune 500 公司。Commercial Observer
              还给出一个更宽但仍由公司转述的数字：150 个客户，并点名 T-Mobile 为例；但在已审阅材料中，没有找到权威证据支撑简报提到的 Google、Walmart、Target 或
              Boeing。因此，证据支持其具备有意义的企业客户牵引力，但不支持完整的暗示客户名单。


              客户案例也说明，Redaptive 销售的并不只是孤立改造。Iron Mountain 扩展到五个国家的 382 处设施；McKesson 覆盖 28 处设施；Berry Global 覆盖 38
              个地点；Cintas 覆盖 125 个地点并加入一个太阳能试点；Saint-Gobain 横跨 30 个站点；WPT 用 Redaptive ONE
              自动化采集公用事业数据。这些案例合在一起，支撑了管理层的说法：Redaptive 面向多站点现代化，而不是单栋建筑项目。


              公开负面信号存在，但比资本叙事窄。Built In 报道称 Redaptive 在 2022 年 12 月私募轮之前取消了计划中的 IPO，强化了公司仍依赖私人资本市场的判断。另一起事件是 GI Endurant
              于 2023 年 5 月在 New York Supreme Court 起诉 Redaptive
              Services，但该案后来中止或驳回。更大的尽调担忧并不是某个单一事件本身，而是公开披露在融资方面远比治理、员工数或收入丰富，这限制了外部分析师把 Redaptive 的部署规模转化为企业经济性的置信度。
