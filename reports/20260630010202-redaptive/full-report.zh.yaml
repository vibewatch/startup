              Redaptive 披露了大量融资轮、信贷额度和客户故事，但已审阅的公开记录仍没有给出当前员工数、收入、ARR
              或清晰披露的董事会名单。这种不平衡限制了外界把部署量转化为企业经济性的信心，也提高了对契约使用、客户集中度和高管接班的尽调重要性。资本依赖对该模式未必是弱点，但没有贷款方或董事会材料，外部很难承保这个模式。
