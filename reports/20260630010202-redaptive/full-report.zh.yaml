      - number: '4.5'
        title: 财务判断
        blocks:
          - type: paragraph
            body: >-
              Redaptive
              的公开证据支持一个可信结论：客户认可这个模式，机构资本提供方也认为合同支持的现金流可融资。反复出现的仓储额度、养老金支持的信贷、首单证券化和企业案例研究合在一起，让公司看起来是商业上真实存在，而不是概念。承保问题不是缺少活动，而是缺少核心公司财务披露。公开来源没有说明
              Redaptive 捕获了客户总节省中的多少、混合资金成本是多少、仓储或 ABS
              结构里有多少损失保护，或公司管理费用和维护义务是否吃掉了大部分服务费利差。因此，正确的财务态度应当谨慎，而不是否定：模式看起来可扩张，也能获得机构融资，但业务仍资本密集、暴露于信用风险且披露不足。任何投资者都应要求管理账、合同队列表现、客户集中度、实际毛利数据和证券化条款清单，再把当前资本栈视为持久自由现金流生成能力的证明。
