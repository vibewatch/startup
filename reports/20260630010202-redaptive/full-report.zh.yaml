            body: >-
              Redaptive 面向大型、分布式建筑资产组合销售，而不是面向单一资产业主或消费者市场。公司把工业、医疗和房地产作为核心垂直领域营销；Equipment Finance Advisor
              则把最适配客户描述为大型企业组织——通常是 Fortune 1000 公司——拥有或控制大量房地产。公开客户故事站点地图强化了这一定位：抓取时可见 24 个故事 URL，故事集中在工业 / 物流、房地产 /
              酒店以及医疗 / 生命科学领域，只有一个可见金融案例和一个可见教育 /
              渠道案例。买方、用户和付款方角色随细分市场而变。在医疗场景，采购可能涉及设施、运营、房地产、财务、法务和资本规划。在房地产场景，业主或资产管理人通常签约并付款，租户、物业经理或公用事业账户持有人则成为必要参与者，因为他们控制能耗数据或受益于更低运营成本。开发商和渠道伙伴是另一条动作：Redaptive
