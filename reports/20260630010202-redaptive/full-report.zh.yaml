      - number: '8.2'
        title: 融资背景与价格发现
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的融资历史方向上很强，但估值披露很弱。Honeywell 2023 年 3 月的战略投资显示合作伙伴兴趣，却没有披露价格。2023 年 8 月 Deutsche Bank 仓储额度、2025
              年 5 月 CDPQ/Nuveen 信贷额度，以及 2025 年 12 月由 Deutsche Bank 安排的 ABS，都说明资本提供方把 Redaptive
              合同视为可融资资产。这是有意义的战略优势，因为它可以推迟普通股稀释，让公司用结构化资本而不只是风险轮融资来资助项目。但这也改变了承销问题。公开投资者仍不知道预付率、信用增级、损失经验、集中度或契约余量；ABS
              公告本身也说资产池仍在等待 Kroll 最终评级。换言之，公司改善了资本可得性，却没有给外部投资者一个新的、透明的普通股估值标记。因此，融资栈支持公司继续推进，但不能让人有把握地认定股权价值显著高于上一个可见的
