  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Redaptive（标的）
        - 最后可见股权估值与后续融资背景
        - Tracxn 显示，2022 年 12 月 19 日投后估值为 $1B；之后公开融资是仓储债务、$650M 信贷额度和 $216M ABS，而不是新披露的定价轮。
        - 表明公开价格发现已经滞后，但债务容量扩大了。
        - 2025–2026 年没有公开普通股估值标记可确认独角兽估值是否仍成立。
      - - Ameresco
        - 2026 年 6 月市值 / 2025 年收入
        - $1.40B 市值 / $1.932B 收入 ≈ 0.7x 追踪收入。
        - 项目占比高的能效和基础设施现代化业务中，最合适的公开可比公司。
        - 比 Redaptive 更成熟、已上市，也更多元化。
      - - Stem
        - 2026 年 6 月市值 / FY2025 收入
        - $66.99M 市值 / $156.3M 收入 ≈ 0.4x 追踪收入。
        - 作为警示性可比公司有用：这家清洁能源平台在硬件和订单承压后大幅转向。
        - 困境交易价格可能低估健康、软件占比更高的平台。
      - - Fluence Energy
        - 2026 年 6 月市值 / FY2025 收入和 FY2026 指引中点
        - $3.52B 市值 / $2.3B FY2025 收入 ≈ 1.5x 追踪收入；按 $3.4B 的 FY2026 指引中点约为 1.0x。
        - 展示了一个有规模、有积压订单支撑、且带软件能力的能源基础设施平台，在公开市场能拿到什么估值。
        - 储能硬件和全球公用事业敞口不同于 Redaptive 的改造融资模型。
      - - Energy Vault
        - 2026 年 6 月市值 / FY2025 收入和 FY2026 指引
        - $0.80B 市值 / $203.7M FY2025 收入 ≈ 3.9x 追踪收入；按 FY2026 指引约为 2.7x–3.6x。
        - 对仍采用项目融资和经常性资产策略的储能基础设施叙事来说，这是公开市场高端倍数。
        - 业务组合现在包括 AI 基础设施和自有资产，因此直接可比性不完美。
    notes: 标的行有意强调过时的股权估值标记和后续结构化融资，而不是假装存在新的公开倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-useful transparent public comparables plus the subject financing row. It is
        partial because no credible public source discloses Redaptive’s current audited revenue, current equity
        valuation, or a broad private secondary comp set.
