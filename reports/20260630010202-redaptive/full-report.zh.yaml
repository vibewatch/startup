      - number: '2.4'
        title: 顺风、采用约束与市场结构
        blocks:
          - type: paragraph
            body: >-
              需求顺风真实存在，并且越来越来自监管。New York City、Boston 和 Washington, DC 的大型建筑排放制度迫使业主测量、报告并改善表现。179D
              等联邦激励改善了改造项目经济性，ENERGY STAR Portfolio Manager 则给业主和服务商提供了标准基准工作流。与此同时，这个品类并非没有摩擦。ACEEE 和 Sustainable
              Markets Initiative
              的独立研究称，最大障碍是业主、租户、贷款方、承包商和物业经理之间的协调，尤其当建筑在长回收期项目成熟前发生转手时。资本强度又放大了这道障碍：深度改造可能达到六位数或七位数，通常还需要长期服务合同才能让现金流跑通。这种动态把市场推向同时具备项目交付能力和持久融资渠道的玩家。Redaptive
              自身的证券化证明，资本市场准入正成为差异化因素；但它也证明，这个市场在运营和融资上都很吃力，不只是软件抢地盘。
