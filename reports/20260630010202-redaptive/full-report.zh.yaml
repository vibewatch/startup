  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本、信用与披露风险
        blocks:
          - type: paragraph
            body: >-
              Redaptive 最尖锐的风险在于，增长看起来由融资驱动，而非靠自身现金自我供给。管理层和行业报道把该模式描述为一套资本化故事：先有 Rabobank、Deutsche Bank 和 Atlas/Apollo
              结构，之后靠 $650M 信贷额度和首单资产支持证券化放大规模。这只有在应收款表现良好时才是优势。KBRA 2025 年评级池仍只有 46 个债务人，约一半是绩效调整合同，加权平均剩余期限 95
              个月，因此账单争议或履约不足会很快传导到回款、仓储额度和新增投放节奏。披露质量又放大了信用问题。官网首页、高管简报、关于页面和招聘页面对站点、项目、部署资本、节省和减排给出不同数字，却没有公开调节表。这种不一致不能证明履约不佳，但会抬高尽调成本，也更难把发放增长映射到实际信用表现。在
              Redaptive 更直接披露逾期、损失、契约和头部债务人数据之前，投资者应把融资可得性和披露纪律视为决定论点的关键风险，而不是背景条件。
