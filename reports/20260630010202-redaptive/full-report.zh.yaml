  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议框架
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的公开证据足以让投资者认真关注，但还不足以支撑价格确信。正面故事清晰可见：公司如今把自己定位成基础设施变现平台，而不是简单的项目贷款方；近期客户材料指向与 McKesson、Iron
              Mountain 和 UniFirst 的规模化部署；2025 年 12 月 ABS 说明机构债务投资者愿意承销一池长期 EaaS 合同。负面故事也同样清晰，而且对本章更重要：最后一个公开股权估值信号仍是
              Tracxn 在 2022 年 12 月给出的 $1B
              标记，而当前收入、现金生成、客户集中度、续约行为和股权结构经济性都未披露。因此，本章更适合给出继续研究建议，而不是买入，甚至也不是干净的跟踪判断。投资者可以主张 Redaptive
              具有战略价值，但还无法从公开证据证明，在 2026 年这个透明上市可比公司通常以低得多收入倍数交易的市场里，公司配得上持续的独角兽以上估值。
