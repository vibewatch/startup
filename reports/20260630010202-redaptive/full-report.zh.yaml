      - number: '8.3'
        title: 可比倍数与价格纪律
        blocks:
          - type: paragraph
            body: >-
              透明的上市可比公司会约束任何为 Redaptive 隐含倍数辩护的尝试。Ameresco 是最干净的项目与效率类比对象，按其 2026 年 6 月市值和 2025 年披露收入计算，交易约为过去十二个月收入的
              0.7x。Stem 在电池硬件经济性和订单长期崩塌后，交易约为过去十二个月收入的 0.4x。Fluence 具备更多软件属性和更大的积压订单支撑型储能平台，交易约为过去十二个月收入的 1.5x，按 2026
              财年指引中点约为 1.0x。Energy Vault 筛选出来最贵，约为过去十二个月收入的 3.9x，按 2026 年指引约为 2.7x 至 3.6x；但即便这个倍数，也远低于把 Redaptive 上一个公开
              $1B 标记与目前唯一可得公开收入估计相比时隐含的 10x 至 15x 区间。正确结论不是 Redaptive 必然低于
              $1B，而是任何等于或高于该标记的估值，都需要私人证据证明收入、毛利率、合同耐久性和资产负债表质量显著好于公开可比公司和公开供应商估计当前显示的水平。
