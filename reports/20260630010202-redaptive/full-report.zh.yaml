  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 公开估算低估收入，ABS 市场以合理条款重复打开，且不需要在 2022 年标记以下进行稀释性股权融资。
        - 如果合同支持现金流和利润率被证明强于公开可比公司暗示，$1.2B-$1.8B 股权价值就有防守性。
        - 执行或融资滑坡会迅速侵蚀溢价，因为公开可比公司集合仍锚定在低得多的位置。
        - 有可能，但需要私下尽调推翻今天偏弱的公开分母。
      - - 基准
        - 客户部署继续推进，结构化债务仍可获得，但披露依旧很薄，也没有披露新的定价股权标记。
        - $0.8B-$1.2B 支持持有 / 观察，而不是明确的溢价入场。
        - 如果融资利差走阔或收入质量令人失望，估值持平到下调仍有可能。
        - 与保留下来的公开证据最一致。
      - - 熊市
        - 合同表现或融资条件迫使普通股按类似公开可比公司的视角重新定价。
        - 如果公司必须在疲软市场融资，$0.4B-$0.8B 会变得可信；在承压下行轮中，估值还可能更低。
        - 新股权稀释、客户集中或评级结果失败，都可能迅速传导到普通股价格。
        - 反向公开可比证据让这一情景仍有实质可能。
    notes: 情景价值是方向性股权区间，来自公开可比公司倍数、第三方收入估算，以及公司转向结构化金融的可见变化。
