      - number: '6.4'
        title: 持久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Redaptive 一旦嵌入客户体系，可能形成较强粘性，但这种韧性更容易从扩张案例推断，难以用披露的留存指标量化。Iron Mountain
              从试点走到持续十年的全球铺开；生命科学客户从三处站点的照明试点，扩展到同一项目下的 HVAC，再到太阳能；领先房地产投资者把试点放大到 182
              个站点；多医院系统也已在讨论后续项目。这些都是很强的复用信号。不过，所审阅资料中，Redaptive 没有公开披露
              NRR、GRR、流失率、续约率或活跃客户数。可见证明也集中在少数企业垂直行业，以及愿意采用长期、数据密集型合同的客户。集中不等于需求弱——大型企业 logo
              本身是优势——但公开记录确实偏向能源支出重、设施复杂、资本受限的多站点组织。主要反向类比来自 ESCO/EPC 风险学术文献，文献把成本、工期、质保、信息和协调失灵列为改造项目中的反复问题。Redaptive
              现有证据库有不少成功故事，但投资者仍需要客户级留存、合同经济性和参考访谈，才能把亮眼案例研究和可持续组合经济性区分开。
