      - number: '7.4'
        title: 集中度、竞争与否决条件
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的客户集很有吸引力，但可能高度集中。公开案例集中在超大型企业和组合业主——AT&T、Iron
              Mountain、Cintas、McKesson、一家全球生命科学制造商，以及机构房地产和医院系统——但没有任何公开材料披露按客户划分的收入占比、头部债务人敞口、续约率或实际损失历史。这一点重要，因为大客户扩张是该模式的核心经济性之一，但大客户也带来采购摩擦、定制化实施要求和重新谈判杠杆。竞争压力也真实存在。Honeywell
              和 Ameresco 都在营销广泛的效率、韧性、现代化和楼宇服务平台，交付团队更深，资产负债表也比 Redaptive 更大。在这样的背景下，正确的尽调姿态不是纠结需求是否存在，而是判断 Redaptive
              能否比企业买方寻找替代方案更快地持续融资、交付并验证结果。如果管理层不能调节官方指标、披露头部债务人敞口、展示绩效调整合同上的稳定回款，并记录安全和计量控制，投资者就应假设今天的增长故事可能压缩成一个更难融资的执行故事。
