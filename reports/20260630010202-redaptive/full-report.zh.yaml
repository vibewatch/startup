      - number: '8.4'
        title: 情景与敏感性分析
        blocks:
          - type: paragraph
            body: >-
              公开输入不完整，因此情景框架必须保持区间化，并明确写出假设。牛市情景要求三件事同时朝 Redaptive 有利方向发展：公开收入估计显著低估真实规模；2025 年 ABS 和 2025
              年信贷额度证明可重复，且资本成本没有显著上升；公司避免在低于 2022 年独角兽标记的价格进行稀释性股权融资。在这组条件下，$1.2B 至 $1.8B
              的股权区间可以辩护。基准情景假设业务继续投放资本并赢得客户，但披露仍然稀薄，融资市场把公司估值拉近高端上市成长型基础设施可比公司；这指向约 $0.8B 至
              $1.2B。熊市情景假设合同履约、资本市场利差或客户集中度迫使普通股按上市可比公司视角重新定价，而不是由私募叙事支撑；这会给出严酷得多的 $0.4B 至 $0.8B
              区间，并且存在低于该区间的下轮融资路径。主导敏感性不是单纯市场需求，而是分母可见度、合同现金表现和融资条款。
