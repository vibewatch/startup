  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现机制
        blocks:
          - type: paragraph
            body: >-
              Redaptive 的公开材料一直描述的是供应商融资的 Energy-as-a-Service
              结构，而不是传统软件订阅或设备销售模式。公司出资承担项目开发、施工、设备所有权、计量基础设施和部分维护义务，再通过与经验证的避免能源消耗或其他计量表现结果挂钩的月度服务付款收回资本。官方材料描述的合同期限通常为
              5 到 20 年，并强调在实现真实风险转移时可获得表外或运营费用处理。公开变现不止核心服务费：到 2024 年，Redaptive
              已扩展到设备融资产品，包括租赁、贷款、短期租赁转换和售后回租。缺失的是标价或实际价格披露。公司解释了付款结构，但不披露合同
              APR、节省分成、门槛收益率或加权平均服务费，因此公开分析可以解释机制，却无法按合同队列独立重建收入或利润率。
