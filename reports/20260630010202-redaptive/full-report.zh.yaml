chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、模式与覆盖范围
        blocks:
          - type: paragraph
            body: >-
              Redaptive Inc. 对外使用 Redaptive 品牌，把自己定位为面向大型商业和工业资产组合的 Energy-as-a-Service
              与基础设施变现服务商。公司当前官方叙事不再强调一次性改造，而是强调程序化资本部署：Redaptive 称，公司把资本、执行和可量化结果组合起来，让客户无需争夺传统 CapEx
              预算也能升级基础设施。其运营模式仍与早期 Redaptive EaaS 说明高度一致——共享节省、零前期成本的合同，把诊断、采购、安装和计量表现打包成一段服务关系。


              公司当前披露的版图以 Denver 为中心：总部地址列为 1601 19th Street，另在 2024 年重点披露了位于 McGregor Square 的 25,000 平方英尺办公室。公司还披露在印度
              Pune 设有办公室，意味着运营覆盖两大洲，尽管公开品牌仍明显锚定美国。产品范围已从早期以照明为先的表述，扩展到 HVAC、照明、太阳能、储能、EV
              充电、控制和计量等更宽的栈。规模口径可观但由公司自行提供：官网目前引用 $1.2B 已部署资本、12,000+ 个已完成项目、$353M 能源节省和 6,000+
              个已改造站点；这说明运营已相当成熟，即便公司仍未披露经审计财务。


              创立时间线并不完全干净。当前官方材料一致使用 2015 年，早期创始人访谈则提到 2014 年。最稳妥的判断是：2015 年是公司采用的规范创立日期，2014 年更像是上线前开发期，而不是相互冲突的当前公司身份。
