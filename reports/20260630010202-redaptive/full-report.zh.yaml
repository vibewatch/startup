      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: Redaptive 的护城河是融资架构，不只是改造经验
            body: >-
              关于 Redaptive 差异化的大多数公开证据指向融资深度和合同现金流循环，而不是某一类专有硬件。从仓储额度到 $650M 信贷额度，再到 $216M ABS
              的推进，说明公司正围绕企业能源合同搭建一台可复制的资本市场机器。其意义在于，Redaptive 可能比仍依赖客户 CapEx 审批周期的承包商或纯软件竞争者扩张更快。
