          tone: risk
        - label: 2. 高管发起人形成
          detail: 设施、运营、可持续、财务或资产管理团队把升级包装成资产组合层面的商业方案。
          tone: neutral
        - label: 3. 结构化融资路径
          detail: Redaptive 提供由服务商融资的多年期服务条款，让项目无需前期 CapEx 也能推进。
          tone: positive
        - label: 4. 试点或首次部署
          detail: 常见起点是照明、计量，或替换一处关键机房，用来验证节省和交付能力。
          tone: positive
        - label: 5. 数据支撑的验证
          detail: 计量和报告为 GRESB、ESG、韧性或降本目标提供内部证据。
          tone: positive
        - label: 6. 多场地 / 多技术扩张
          detail: 项目跑通后，会在主协议下增加场地，或从照明扩展到 HVAC、太阳能、储能及更广泛的现代化改造。
          tone: positive
    approximationNotes: 各阶段综合了 Redaptive 案例研究和伙伴描述中的常见路径；并非每个账户都会公开披露每个阶段。
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU024
      - CU027
      - CU033
  - id: FU002
    title: 客户证据矩阵 — 成熟度和证据质量
    type: matrix
    layout: wide
    summary: 按生产成熟度、结果具体性和独立验证深度，对比最强的可见客户证据。
    data:
      columns:
        - 部署成熟度
        - 结果具体性
        - 独立 / 客户控制的验证
        - 扩张信号
        - 主要限制
      rows:
        - label: Iron Mountain
          values:
            - 规模化生产项目
            - 高 — 设施、国家、节省、保留资本均明确
            - 低到中 — 主要由 Redaptive 撰写
            - 高 — 从试点到全球铺开
            - 经济性仍由公司撰写
        - label: McKesson
          values:
            - 生产部署
            - 高 — 设施、面积、kWh、CO2、节省均明确
            - 中 — 被案例研究聚合方转载
            - Unknown
            - 未披露续约或第二阶段
        - label: WPT Capital Advisors
          values:
            - 生产数据项目
            - 高 — 地点、降本、监测量均明确
            - 高 — WPT 报告和伙伴引述
            - 中 — 报告平台支撑增长
            - 未披露合同经济性
        - label: Fiera / NNN 地产账户
          values:
            - 生产计量项目
            - 中 — 地点和报告结果
            - 低 — 大多由 Redaptive 撰写
            - 中 — 暗示租户互动扩张
            - 客户自有引用很少
        - label: 多医院系统
          values:
            - 交付中 / 生产基础设施
            - 中 — 利益相关方数量和消除的年租赁成本
            - 低 — 客户名称未披露
            - 中 — 披露后续讨论
            - 匿名账户，且无合同条款
        - label: 通过 eEnergy 覆盖英国学校
          values:
            - 项目化铺开
            - 中 — 地点和避免的 CapEx
            - 中 — 伙伴发布公告
            - 高 — 有资金支持的渠道扩张路径
            - 终端学校名单和已实现队列未披露
    approximationNotes: 证据质量是分析师判断，依据是来源独立性、具体性，以及客户或伙伴是否控制证据链的某个环节。
