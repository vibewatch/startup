  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: redaptive-pricing
    missingEvidence: Public contract pricing, service-fee take rates, or project-level unit economics for Redaptive EaaS programs.
    whyItMatters: Without pricing, it is impossible to convert footprint and case-study evidence into a revenue-based view of Redaptive's competitive position or margin structure.
    diligencePath: Request anonymized term sheets or sample economics by vertical, including service-fee structure, savings share, and tenor.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: redaptive-som
    missingEvidence: Public revenue, originated contract volume, or active contract balance that would support a quantified Redaptive SOM.
    whyItMatters: A capital-intensive market can look large while still being difficult for one provider to scale; SOM is needed to judge concentration, execution velocity, and valuation relevance.
    diligencePath: Request current ARR or contracted recurring revenue, annual originations, active project count, and funding capacity by channel.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: icp-building-count
    missingEvidence: A current public count of multi-site North American commercial buildings matching Redaptive's ideal customer profile across leased and owner-occupied portfolios.
    whyItMatters: That count would tighten the bridge from macro EaaS estimates to a more realistic Redaptive SAM based on building stock rather than abstract market reports.
    diligencePath: Use paid commercial real-estate datasets or portfolio registries to count target properties by size, lease type, and vertical.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: market-taxonomy-overlap
    missingEvidence: A single high-quality public taxonomy that reconciles EaaS, ESCO, energy retrofit, and BEMS layers without overlap.
    whyItMatters: Current public estimates use incompatible scope definitions, so valuation narratives can overstate comparability between Redaptive and adjacent service categories.
    diligencePath: Ask management for its internal market taxonomy and map each external benchmark to that schema before using any TAM number in valuation work.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM001
    - TM002
