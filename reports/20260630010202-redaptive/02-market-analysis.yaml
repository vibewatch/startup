callouts:
- calloutType: insight
  title: The clearest wedge is not “all energy services” but financed modernization in hard-to-coordinate portfolios
  body: The strongest public proof is in multi-site real estate, industrial, and enterprise facilities where outdated equipment, reporting needs, and split incentives all show up at once.
  claimRefs:
  - CM017
  - CM034
  - CM035
  - CM040
  - CM042
- calloutType: risk
  title: Public TAM evidence is broad, but Redaptive-specific SAM and SOM remain opaque
  body: Analyst forecasts confirm a large EaaS and retrofit backdrop, yet no retained public source discloses Redaptive pricing, revenue, or originated contract share. Market-share math therefore remains a diligence item.
  claimRefs:
  - CM016
  - CM047
  - CM048
- calloutType: assumption
  title: Financing depth is part of the product
  body: The market increasingly rewards providers that can underwrite long-tenor savings contracts and recycle them through deeper financing channels. That makes capital access a strategic variable, not a back-office detail.
  claimRefs:
  - CM018
  - CM019
  - CM033
  - CM046
