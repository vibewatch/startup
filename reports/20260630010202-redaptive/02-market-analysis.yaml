- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - City-level building performance standards (NYC, Boston, DC)
    - Driver
    - Current and tightening through 2030+
    - Push owners toward measuring and upgrading building performance
    - Which covered-building segments overlap most with Redaptive's current vertical mix?
  - - 179D tax deduction and prevailing-wage uplift
    - Driver
    - Current
    - Improves deep-retrofit economics and can increase project viability
    - How much of Redaptive's recent pipeline actually monetizes 179D?
  - - Commercial-building energy demand and electricity growth
    - Driver
    - Current to long term
    - Supports a large spend pool and higher value from efficiency or load control
    - Which verticals show the fastest rising utility intensity?
  - - Benchmarking and auditable data workflows
    - Driver
    - Current
    - Makes metering and reporting part of the buying motion, not just a nice-to-have
    - What share of wins start as data or benchmarking projects versus capex replacement projects?
  - - Heat-pump and electrification momentum
    - Driver
    - Current to medium term
    - Expands upgrade scope beyond lighting toward larger HVAC and electrification programs
    - Can Redaptive consistently underwrite electrification-heavy savings cases?
  - - Split incentives in leased buildings
    - Constraint
    - Structural / persistent
    - Suppresses owner willingness to fund upgrades unless cost-pass-through is solved
    - Which contract structures have produced repeatable owner-tenant alignment?
  - - Long paybacks and six- or seven-figure project budgets
    - Constraint
    - Structural / persistent
    - Makes underwriting, financing, and risk transfer critical to adoption
    - What loss or default experience does Redaptive have on longer-tenor programs?
  - - Performance-trust and measurement requirements
    - Constraint
    - Current
    - Customers need high-confidence savings and operational proof before scaling
    - How often do early data projects convert into retrofit financings?
  - - Competitive financing depth among incumbents
    - Constraint
    - Current
    - Large incumbents can bundle capital, services, and existing customer relationships
    - Where does Redaptive win or lose versus Ameresco, JCI, Schneider, or Siemens?
  - - Public-market-definition ambiguity
    - Constraint
    - Current
    - Hard to benchmark Redaptive share or pricing because EaaS, ESCO, retrofit, and BEMS scopes overlap
    - Can management provide a clean internal SAM taxonomy and originating volume by vertical?
  notes: Rows mix drivers and constraints because Redaptive's category is governed by regulation, financing, and organizational friction at the same time.
