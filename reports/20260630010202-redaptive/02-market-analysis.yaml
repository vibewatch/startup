company:
  name: Redaptive Inc.
chapter:
  number: 2
  title: Market Analysis
  summary: Public evidence supports a large and growing demand pool around outsourced energy modernization for commercial buildings, but the exact size of Redaptive's served market depends on which adjacent layer—commercial EaaS, broader EaaS, retrofit spending, or building-energy-management services—is being measured. Demand is clearly supported by tightening building-performance standards, 179D incentives, benchmarking workflows, and rising commercial energy-management complexity, while adoption is still slowed by split incentives, capital intensity, and the need for trusted measurement. Redaptive appears best positioned in multi-site commercial real-estate and enterprise facility portfolios where financing and data visibility are both binding constraints.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'Redaptive should not be analyzed as a commodity-energy seller or as a pure building-software vendor. Its public materials define the market as outsourced infrastructure modernization for large portfolios: the provider brings capital, project delivery, and ongoing measurement so customers can buy outcomes rather than own equipment directly. Included spend therefore covers energy-efficiency retrofits such as lighting, HVAC, controls, and selected renewable or charging projects, plus the metering, benchmarking, and utility-intelligence layers needed to verify savings and support ESG or investor reporting. Excluded spend includes commodity power sales, utility wires-and-pipes infrastructure, and generic balance-sheet-funded retrofits that do not rely on third-party financing or long-term service contracts. The status quo is fragmented: CapEx committees, secured leases or loans, C-PACE where available, traditional ESCO contracts, and manual utility-data gathering. That boundary matters
    because Redaptive wins where financing friction and measurement friction are both present, especially in leased or multi-site environments where owner, tenant, and facilities teams do not naturally share the same incentives.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM029
  - CM042
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Evidence-Constrained Sizing Lenses
  body: 'There is no single authoritative public TAM for “Energy-as-a-Service for multi-site commercial buildings,” so the chapter preserves several adjacent lenses instead of pretending they are one clean number. At the bottom of the funnel is a very large underlying spend pool: EIA says U.S. commercial buildings spent $141 billion on energy in the last full nationwide survey, while DOE and AEO 2026 both frame commercial-building energy use as a large and still-growing problem. Around that spend pool, analyst estimates for EaaS vary widely depending on scope. Some cover North America commercial EaaS only, others all North America EaaS, and others the adjacent retrofit or BEMS layers that Redaptive also touches. Those differences are analytically useful rather than noise: they show that Redaptive sits at the overlap of financing, retrofit execution, and data services. Public sources support a large and growing served market, but they do not support a precise revenue-based SOM for Redaptive,
    which remains a diligence gap.'
