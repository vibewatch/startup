tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Primary Buyer / Payer
  - Relevance to Redaptive
  rows:
  - - EaaS-financed retrofit delivery
    - Lighting, HVAC, controls, metering, selected renewables or EV upgrades, turnkey execution
    - Commodity power supply and balance-sheet-funded projects with no third-party service contract
    - Corporate facilities, finance, asset owners
    - Core current market boundary
  - - Utility intelligence and benchmarking
    - Meters, benchmarking, ESG or investor reporting workflows, measurement and verification
    - Generic reporting software with no building-level utility-data ingestion
    - Sustainability, ESG, asset-management, facilities analytics teams
    - Core enabling layer and wedge into broader programs
  - - Real-estate owner or tenant alignment
    - Portfolio modernization in leased spaces, cost-pass-through design, tenant energy collaboration
    - One-off tenant improvement projects paid fully by the landlord or tenant outside a service structure
    - Asset managers, owners, property managers, major tenants
    - High-fit wedge where split incentives are acute
  - - Traditional ESCO or EPC programs
    - Guaranteed-savings contracting, especially in public or institutional settings
    - Pure software subscriptions with no project delivery or financing
    - Public-sector energy managers, campuses, some commercial owners
    - Important substitute and adjacent channel
  - - Capital-light service alternative
    - Service-fee or shared-savings treatment over multi-year terms
    - Internal CapEx committees, secured leases, standard project loans, and purely manual utility-data collection
    - Finance leaders and procurement stakeholders
    - Explains why Redaptive competes on financing structure as much as technology
  notes: Boundary is intentionally narrow around financed modernization plus verified utility intelligence; generic energy supply and self-funded construction budgets are excluded.
