    - Request vertical revenue mix and top-customer concentration
  - - Dependence on capital-markets-backed funding facilities
    - Concentration risk
    - 'Material: customer offer depends on cost and availability of funding'
    - $125M DB facility, $650M CDPQ/Nuveen facility, $216M ABS
    - Review warehouse covenants, ABS eligibility rules, and funding-match discipline
  - - Data-rights and tenant coordination burden in leased assets
    - Concentration risk
    - 'Medium: can delay implementation even when economics are compelling'
    - WPT, Fiera, leading real-estate investor, DaaS terms
    - Test one live procurement with tenant data access and utility-bill sharing
  - - Lack of public retention / renewal disclosure
    - Concentration risk
    - 'High analytical uncertainty: case-study wins may not equal durable cohort economics'
    - Across official, partner, and external sources
    - Request renewal, churn, and cohort profitability data under NDA
