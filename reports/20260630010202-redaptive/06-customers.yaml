callouts:
- calloutType: strength
  title: Outcome-backed proof is real, not logo wallpaper
  body: Redaptive's best public references disclose site counts, square footage, metered volumes, or savings outcomes. Iron Mountain, McKesson, Cintas, WPT, Fiera, and the leading real-estate investor all provide more than a logo.
  claimRefs:
