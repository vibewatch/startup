- id: FU003
  title: Procurement and Expansion Flow
  type: flow
  layout: wide
  summary: Illustrates the operational sequence Redaptive must navigate from contract approval to repeat expansion.
  data:
    nodes:
    - id: pain
      label: Pain identified
      description: Deferred maintenance, ESG reporting pressure, resilience risk, or rising utility cost creates sponsor urgency.
    - id: business-case
      label: Business case framed
      description: Redaptive converts the project into an OpEx-style service case rather than a CapEx request.
    - id: data-rights
      label: Data / access cleared
      description: Utility-bill access, tenant coordination, site surveys, and validation inputs must be secured.
    - id: contract
      label: Master agreement signed
      description: Multi-year terms, payment logic, and access rights are established; missed payments can trigger suspension under platform terms.
    - id: deployment
      label: Deployment + metering
      description: Lighting, HVAC, solar, storage, or metering is installed and measured at the asset level.
    - id: expand
      label: Expansion decision
      description: If first projects prove out, additional sites or technologies can be added without repeating the full procurement cycle.
  approximationNotes: The flow combines Redaptive legal terms, EaaS contract descriptions, and customer-story procurement narratives; exact ordering can vary by account.
