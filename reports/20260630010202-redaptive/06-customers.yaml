company:
  name: Redaptive Inc.
chapter:
  number: 6
  title: Customers
  summary: 'Redaptive''s visible customer proof is strongest with large multi-site enterprise accounts in industrial/logistics, real estate, and healthcare: its public customer sitemap exposed 24 story pages, and marquee cases such as Iron Mountain, McKesson, Cintas, WPT, Fiera, and a multi-hospital system carry specific site, savings, or metering outcomes rather than logo-only claims. The commercial motion appears sticky once adopted because Redaptive finances upgrades as multi-year service agreements and often expands from pilot metering or lighting into broader portfolio rollouts under master agreements. The main gaps are the absence of public customer-count or retention disclosures, concentration of visible proof in a narrow set of enterprise verticals, and limited customer-controlled validation outside a few partner/customer documents.'
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation
  body: 'Redaptive sells into large, distributed building portfolios rather than into single-asset owners or consumer markets. The company markets industrial, healthcare, and real estate as its core verticals, and Equipment Finance Advisor described the best fit as large enterprise organizations—often Fortune 1000 companies—with significant owned or controlled real estate. The public customer-story sitemap reinforces that positioning: at fetch time it exposed 24 story URLs, with stories concentrated in industrial/logistics, real estate/hospitality, and healthcare/life sciences, and only one visible finance example and one visible education/channel example. Buyer, user, and payer roles vary by segment. In healthcare, procurement can involve facilities, operations, real estate, finance, legal, and capital planning. In real estate, the owner or asset manager usually signs and pays, while tenants, property managers, or utility-account holders become necessary participants because they control
    consumption data or benefit from lower operating costs. Developers and channel partners are a separate motion: Redaptive positions itself as embedded capital and execution support inside a partner pipeline, not only as a direct-to-owner vendor.'
