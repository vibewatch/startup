- id: named-customer-proof
  title: Named Customer Proof and Adoption Depth
  body: 'The strongest proof is outcome-based, not just logo-based. Iron Mountain is the clearest flagship: the relationship began with a lighting pilot and scaled under a single master agreement to 382 facilities across five countries, with projected $101.7 million of gross savings and $45.9 million of preserved capital. McKesson''s story discloses 28 facilities, 6.5 million square feet, 22 million kWh of reduction, and $2 million of gross energy savings. Cintas and Saint-Gobain add more industrial proof, while WPT, Fiera, and another global private-equity real-estate owner show that Redaptive ONE can turn utility data collection from a manual reporting task into a portfolio operating system. The WPT case is especially useful because Redaptive''s own story, a case-study aggregator, a WPT-authored sustainability report, and a press release with a WPT quote all point in the same direction: automated, whole-building data collection and reporting value across a distributed industrial portfolio.
    The public library also shows several anonymous or semi-anonymous stories—global supply chain leader, pharma company, leading food distributor—which means proof breadth is wider than the named-logo set but evidence quality is uneven by account.'
