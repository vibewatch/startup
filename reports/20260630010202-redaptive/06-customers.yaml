- calloutType: insight
  title: Stickiness comes from master agreements and data loops
  body: The best durability signal is not a disclosed NRR figure—it is expansion after first deployment. Iron Mountain, the life-sciences manufacturer, and the NNN real-estate case all show pilot-to-program scaling once data and delivery prove out.
  claimRefs:
  - CU018
  - CU027
  - CU033
- calloutType: risk
  title: Visible proof is concentrated and retention math is opaque
  body: Public evidence clusters around large industrial, healthcare, and real-estate portfolios, while customer count, renewal, churn, and top-account exposure remain undisclosed. That makes the reference set impressive but analytically incomplete.
  claimRefs:
  - CU034
  - CU035
  - CU036
  - CU039
- calloutType: recommendation
  title: Next diligence step should be customer-controlled references plus contract economics
  body: Before taking Redaptive customer durability at face value, obtain three reference calls (one industrial, one healthcare, one real-estate owner) and review a sample contract for pricing, renewal, termination, residual ownership, and savings-verification logic.
  claimRefs:
  - CU037
  - CU038
  - CU039
