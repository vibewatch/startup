    - CapEx avoidance for mission-critical infrastructure with resilience and compliance implications
    - No public renewal, churn, or expansion-rate data for health-system accounts
  - - Real estate owners / managers / RE PE
    - Owner, asset manager, sustainability or reporting team
    - Property managers plus tenants supplying utility data
    - Iron Mountain, WPT Capital Advisors, Fiera Real Estate, leading real-estate investor
    - Portfolio-level NOI, GRESB, investor reporting, tenant engagement, and CapEx preservation
    - Tenant data rights and owner-tenant alignment remain implementation bottlenecks
  - - Channel / developer / partner-led deals
    - Developer or delivery partner, sometimes end customer
    - Partner project teams plus end-site operators
    - eEnergy UK schools, Titan Energy New England hotel modernization, Honeywell collaboration
    - Extends Redaptive capital and execution into markets where a partner owns origination or delivery
    - Named end-customer visibility is thinner than on direct enterprise stories
  - - Education / public-like estates
    - Trusts, school operators, delivery partner-backed buyers
    - School facility teams and administrators
    - UK schools program via eEnergy across 179 locations
    - Zero-upfront funding can unlock estates with constrained capital budgets
    - Underlying school names, renewal terms, and realized savings are not publicly itemized
