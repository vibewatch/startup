- id: durability-expansion-and-risk
  title: Durability, Expansion, and Concentration Risk
  body: Public evidence suggests Redaptive can become sticky once embedded, but durability is easier to infer from expansions than to quantify from reported retention metrics. Iron Mountain grew from a pilot to a decade-long global rollout; the life-sciences customer moved from a three-site lighting pilot into HVAC and then solar under the same program; the leading real-estate investor scaled a pilot to 182 sites; and the multi-hospital system is already discussing further projects. Those are strong repeat-use signals. However, Redaptive discloses no public NRR, GRR, churn, renewal-rate, or active-customer-count figures in the sources reviewed. The visible proof base is also concentrated in a narrow set of enterprise verticals and in customers willing to adopt long-duration, data-intensive contracts. That concentration does not mean demand is weak—large enterprise logos are a strength—but it does mean the public record is skewed toward multi-site organizations with heavy energy spend, complex
    facilities, and capital constraints. The main adverse analog comes from academic ESCO/EPC risk literature, which flags cost, schedule, warranty, information, and coordination failures as recurring issues in retrofit programs. Redaptive's current evidence base shows many success stories, but investors still need customer-level retention, contract economics, and reference calls to separate impressive case studies from durable portfolio economics.
  claimRefs:
  - CU033
  - CU034
  - CU035
  - CU036
