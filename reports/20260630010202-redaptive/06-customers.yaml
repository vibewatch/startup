  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Cohort-level NRR, GRR, churn, renewal, and active-customer-count disclosures by vertical and by major program vintage.
    whyItMatters: Without cohort math, visible case-study wins cannot be translated into customer durability, revenue concentration, or lifetime-value confidence.
    diligencePath: Request a management retention pack under NDA with annual active-customer counts, renewals, churn reasons, and top-10 customer exposure.
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Sample customer contract economics covering service term, savings-share formula, renewal mechanics, termination rights, residual asset treatment, and incentive true-up logic.
    whyItMatters: Customer stickiness and unit economics depend on contract mechanics, not just on installation outcomes or marketing case studies.
    diligencePath: 'Review one executed contract from each of three archetypes: direct enterprise, leased real estate, and partner/channel-led deployment.'
  - type: enumeration-incomplete
    severity: minor
    topic: public-customer-proof-subset
    missingEvidence: A complete, attributable list mapping each public story URL to customer name, stage, and measurable outcome where possible.
    whyItMatters: The named-customer table is intentionally partial because several public stories are anonymous or too thin to classify confidently.
    diligencePath: Request a reference matrix from management that reconciles the public story library with live account names, sector, stage, and current status.
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: customer-controlled-validation
    missingEvidence: Customer-controlled case studies or reference calls beyond WPT, Honeywell, and eEnergy—especially from Iron Mountain, McKesson, or one large industrial operator.
    whyItMatters: Most operational outcome detail currently originates from Redaptive-authored stories, which weakens external validation breadth.
    diligencePath: Arrange three reference calls and request one customer-owned case study or board deck excerpt per target vertical.
  - type: missing-source
    severity: minor
    topic: uk-schools-end-customers
    missingEvidence: Named school or multi-academy-trust references tied to the UK eEnergy / Redaptive program and realized post-deployment savings.
    whyItMatters: The partner-backed UK expansion thesis is visible, but the underlying end-customer roster and achieved economics remain opaque.
    diligencePath: Request the named trust list, delivered projects by stage, and realized savings versus forecast for the first UK cohorts.
