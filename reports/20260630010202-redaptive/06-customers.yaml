figures:
- id: FU001
  title: Customer Journey Map — From Sponsor Pain to Portfolio Expansion
  type: journey-map
  layout: wide
  summary: Shows the recurring Redaptive enterprise buying path observed across industrial, healthcare, and real-estate stories.
  data:
    nodes:
    - label: 1. Deferred infrastructure pain
      detail: Customers start with aging lighting, HVAC, cooling plants, or missing utility-data visibility under capital constraints.
      tone: risk
    - label: 2. Executive sponsor forms
      detail: Facilities, operations, sustainability, finance, or asset-management teams frame the upgrade as a portfolio business case.
      tone: neutral
    - label: 3. Structured funding path
      detail: Redaptive offers provider-financed, multi-year service terms so projects can move without upfront CapEx.
      tone: positive
    - label: 4. Pilot or first deployment
      detail: Common starting points are lighting, metering, or one critical plant replacement to validate savings and delivery.
      tone: positive
    - label: 5. Data-backed validation
      detail: Metering and reporting create internal proof for GRESB, ESG, resilience, or cost-reduction goals.
      tone: positive
    - label: 6. Multi-site / multi-technology expansion
      detail: Successful programs add sites or move from lighting into HVAC, solar, storage, or broader modernization under master agreements.
      tone: positive
  approximationNotes: Stages synthesize the common path visible across Redaptive case studies and partner descriptions; not every account discloses each stage publicly.
  claimRefs:
