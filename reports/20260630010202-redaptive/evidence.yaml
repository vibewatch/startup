evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: >-
      Original incorporation documents, earliest board materials, or an official management clarification that
      reconciles 2014 pre-launch references with the current 2015 founding date.
    whyItMatters: >-
      Company-overview is the canonical source for later chapters; an unresolved founding-date narrative can create
      cross-chapter drift on identity and milestone chronology.
    diligencePath: >-
      Request formation documents, the first investor deck, or direct written confirmation from management on
      incorporation date versus operating launch date.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and clear executive org chart from an official company source.
    whyItMatters: >-
      Board visibility is necessary to assess governance quality, investor control, succession planning, and the degree
      of key-person dependence around Arvin Vohra.
    diligencePath: Request the latest board list, board-observer rights, and an internal org chart from Redaptive or lead investors.
    relatedQuestionRefs:
      - QO006
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count by geography and function.
    whyItMatters: >-
      Headcount is a key maturity and operating-leverage signal for an asset- and service-heavy platform business,
      especially given the disclosed India office and multi-site execution model.
    diligencePath: Request HRIS export, payroll summary, or lender presentation with current FTE count and outsourced labor mix.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, gross margin, and portfolio cash-yield disclosure.
    whyItMatters: >-
      Without revenue or cash-generation data, it is difficult to judge whether Redaptive’s large capital stack is
      scaling efficiently or merely financing future growth.
    diligencePath: >-
      Request audited financial statements, management accounts, or lender underwriting materials tied to the warehouse
      and ABS structures.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: aggregate-capital
    missingEvidence: >-
      A management-normalized capital table separating equity raised, warehouse debt capacity, drawn balances, corporate
      credit, and term ABS proceeds.
    whyItMatters: >-
      Public databases disagree sharply on total capital, and that disagreement can materially distort assessments of
      dilution, leverage, and efficiency of capital consumption.
    diligencePath: >-
      Request a board-approved capitalization summary or lender deck that reconciles each financing event to an exact
      as-of-date capital-stack snapshot.
    relatedQuestionRefs:
      - QO019
      - QO031
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: redaptive-pricing
    missingEvidence: Public contract pricing, service-fee take rates, or project-level unit economics for Redaptive EaaS programs.
    whyItMatters: >-
      Without pricing, it is impossible to convert footprint and case-study evidence into a revenue-based view of
      Redaptive's competitive position or margin structure.
    diligencePath: >-
      Request anonymized term sheets or sample economics by vertical, including service-fee structure, savings share,
      and tenor.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: redaptive-som
    missingEvidence: >-
      Public revenue, originated contract volume, or active contract balance that would support a quantified Redaptive
      SOM.
    whyItMatters: >-
      A capital-intensive market can look large while still being difficult for one provider to scale; SOM is needed to
      judge concentration, execution velocity, and valuation relevance.
    diligencePath: >-
      Request current ARR or contracted recurring revenue, annual originations, active project count, and funding
      capacity by channel.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: icp-building-count
    missingEvidence: >-
      A current public count of multi-site North American commercial buildings matching Redaptive's ideal customer
      profile across leased and owner-occupied portfolios.
    whyItMatters: >-
      That count would tighten the bridge from macro EaaS estimates to a more realistic Redaptive SAM based on building
      stock rather than abstract market reports.
    diligencePath: >-
      Use paid commercial real-estate datasets or portfolio registries to count target properties by size, lease type,
      and vertical.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: market-taxonomy-overlap
    missingEvidence: >-
      A single high-quality public taxonomy that reconciles EaaS, ESCO, energy retrofit, and BEMS layers without
      overlap.
    whyItMatters: >-
      Current public estimates use incompatible scope definitions, so valuation narratives can overstate comparability
      between Redaptive and adjacent service categories.
    diligencePath: >-
      Ask management for its internal market taxonomy and map each external benchmark to that schema before using any
      TAM number in valuation work.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM001
      - TM002
  - type: missing-source
    severity: material
    topic: public-pricing-transparency
    missingEvidence: >-
      Actual contract schedules, realized savings-share percentages, termination penalties, and discounting terms for
      Redaptive and the main competitor set.
    whyItMatters: >-
      Without contract-level economics, the pricing comparison can only compare public packaging signals rather than
      true customer cost or margin pressure.
    diligencePath: >-
      Request sample MSAs, order forms, or customer invoices from management and compare them with competitor term
      sheets gathered in live diligence.
    relatedQuestionRefs:
      - QP013
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-multi-homing
    missingEvidence: >-
      Renewal rates, integration unwind costs, contract-assignment terms, and evidence of customers using multiple
      providers at once.
    whyItMatters: >-
      Public pages stress stickiness and monitoring, but they do not show whether Redaptive relationships are harder to
      displace than incumbent or substitute contracts.
    diligencePath: >-
      Ask management for gross retention, contract duration by cohort, and examples of customers that expanded,
      switched, or multi-homed between vendors.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Named win-loss data against Ameresco, Schneider, NORESCO, ENFRA, Budderfly, and CPower, plus reasons codes for
      wins and losses.
    whyItMatters: >-
      The moat discussion is directionally sound from public evidence, but underwriting competitive durability requires
      actual proof of conversion and renewal behavior in live deals.
    diligencePath: >-
      Obtain CRM-derived win-loss data, reference calls from lost opportunities, and pipeline segmentation by buyer type
      and competitor encountered.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP005
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape-coverage
    missingEvidence: >-
      A fuller list of regional ESCOs, private project developers, and finance partners that may matter in specific
      verticals or geographies.
    whyItMatters: >-
      The chapter covers the named competitive set and the main substitute classes, but not every smaller regional or
      verticalized contractor that could appear in a deal.
    diligencePath: >-
      Expand the long list by vertical and geography during live pipeline review, then test whether those players appear
      meaningfully in current opportunities.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current unrestricted cash balance, monthly operating burn, and facility headroom by debt line.
    whyItMatters: Without cash and burn data, the public capital stack cannot be converted into runway or next-round timing.
    diligencePath: >-
      Request trailing 12-month monthly cash-flow statements plus a debt-availability schedule from management and
      lenders.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: provider-margin
    missingEvidence: Cohort-level gross margin, maintenance cost, incentive pass-through, and default / loss history.
    whyItMatters: Customer savings do not reveal whether Redaptive itself earns durable gross spread after retained risk costs.
    diligencePath: Request contract-cohort margin bridges and servicing performance by warehouse / ABS collateral vintage.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue share, top-obligor exposure, renewal rates, and overlap between corporate revenue and
      securitized collateral.
    whyItMatters: >-
      A small number of enterprise accounts could dominate cash generation even if the ABS pool itself looks
      diversified.
    diligencePath: Request top-10 customer concentration disclosures and obligor-level exposure tables for warehouse and ABS pools.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: debt-structure-terms
    missingEvidence: ABS note coupons, warehouse advance rates, reserve triggers, overcollateralization, and covenant package.
    whyItMatters: >-
      Facility headline size alone does not show whether Redaptive's cost of capital leaves enough spread after
      servicing and losses.
    diligencePath: >-
      Obtain warehouse agreements, securitization term sheets, servicing agreements, and any rating-agency presale
      report.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: conflicting-data
    severity: minor
    topic: public-kpi-definitions
    missingEvidence: >-
      Reconciled KPI definitions for capital deployed, sites modernized, projects completed, and customer savings across
      Redaptive marketing materials.
    whyItMatters: >-
      Metric drift does not break the core thesis, but it weakens confidence in trend analysis and makes external
      benchmarking noisy.
    diligencePath: >-
      Request lender or board KPI definitions and a dated historical schedule that ties each public metric to a
      consistent denominator.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: public cybersecurity assurance
    missingEvidence: >-
      No retained public source shows SOC 2, ISO 27001, penetration-test summaries, or a public trust-center package for
      Redaptive ONE or the underlying metering platform.
    whyItMatters: >-
      Enterprise buyers are being asked to trust remote analytics, alerts, and in some cases optimization guidance
      across large portfolios, so public security assurance materially affects diligence comfort.
    diligencePath: >-
      Request security certifications, recent third-party audit reports, incident-response procedures, and a current
      control-matrix package for the platform and metering environment.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: developer-facing API and integration documentation
    missingEvidence: >-
      The public terms mention APIs, API keys, SDK-assisted access, and customer documentation, but the retained sources
      do not expose reference docs, auth examples, webhook/event models, or implementation guides.
    whyItMatters: >-
      Integration depth is part of product defensibility and implementation risk, especially for customers that want
      Redaptive data to feed portfolio systems, tenant workflows, or external optimization stacks.
    diligencePath: >-
      Request current API documentation, supported endpoints, auth and rate-limit design, sample payloads, and example
      production integrations with reporting or BMS/EMS systems.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: fleet uptime and service-level transparency
    missingEvidence: >-
      No retained public source discloses platform uptime, meter-read success rates, alert-delivery reliability, support
      SLAs, or outage history for Redaptive’s monitoring stack.
    whyItMatters: >-
      When the product is sold as measurable-outcomes infrastructure, uptime and service reliability become product
      quality metrics rather than back-office metrics.
    diligencePath: >-
      Request historical uptime reports, support severity targets, alert-delivery metrics, meter-read completeness
      dashboards, and named customer references willing to discuss operational reliability.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Cohort-level NRR, GRR, churn, renewal, and active-customer-count disclosures by vertical and by major program
      vintage.
    whyItMatters: >-
      Without cohort math, visible case-study wins cannot be translated into customer durability, revenue concentration,
      or lifetime-value confidence.
    diligencePath: >-
      Request a management retention pack under NDA with annual active-customer counts, renewals, churn reasons, and
      top-10 customer exposure.
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Sample customer contract economics covering service term, savings-share formula, renewal mechanics, termination
      rights, residual asset treatment, and incentive true-up logic.
    whyItMatters: >-
      Customer stickiness and unit economics depend on contract mechanics, not just on installation outcomes or
      marketing case studies.
    diligencePath: >-
      Review one executed contract from each of three archetypes: direct enterprise, leased real estate, and
      partner/channel-led deployment.
  - type: enumeration-incomplete
    severity: minor
    topic: public-customer-proof-subset
    missingEvidence: >-
      A complete, attributable list mapping each public story URL to customer name, stage, and measurable outcome where
      possible.
    whyItMatters: >-
      The named-customer table is intentionally partial because several public stories are anonymous or too thin to
      classify confidently.
    diligencePath: >-
      Request a reference matrix from management that reconciles the public story library with live account names,
      sector, stage, and current status.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-controlled-validation
    missingEvidence: >-
      Customer-controlled case studies or reference calls beyond WPT, Honeywell, and eEnergy—especially from Iron
      Mountain, McKesson, or one large industrial operator.
    whyItMatters: >-
      Most operational outcome detail currently originates from Redaptive-authored stories, which weakens external
      validation breadth.
    diligencePath: Arrange three reference calls and request one customer-owned case study or board deck excerpt per target vertical.
  - type: missing-source
    severity: minor
    topic: uk-schools-end-customers
    missingEvidence: >-
      Named school or multi-academy-trust references tied to the UK eEnergy / Redaptive program and realized
      post-deployment savings.
    whyItMatters: >-
      The partner-backed UK expansion thesis is visible, but the underlying end-customer roster and achieved economics
      remain opaque.
    diligencePath: >-
      Request the named trust list, delivered projects by stage, and realized savings versus forecast for the first UK
      cohorts.
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: >-
      Top-customer and top-obligor revenue share, renewal profile, and cross-default exposure across the enterprise book
      and ABS collateral pool.
    whyItMatters: >-
      Large enterprise programs are central to the thesis, so undisclosed concentration can magnify both collections and
      growth volatility.
    diligencePath: Request customer concentration schedule, top-10 obligor list, and renewal cohort view under NDA.
    relatedQuestionRefs:
      - QR015
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: blocking
    topic: portfolio credit performance
    missingEvidence: >-
      Delinquency, default, covenant, loss, and realized cash-collection history for warehouse lines and the 2025 ABS
      pool.
    whyItMatters: >-
      Financing is a thesis-critical dependency, so investors need evidence that originations are translating into
      stable collections and refinance capacity.
    diligencePath: >-
      Obtain lender reporting packages, servicer data, KBRA surveillance materials, and management's monthly collections
      dashboard.
    relatedQuestionRefs:
