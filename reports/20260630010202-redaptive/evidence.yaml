    topic: security and subprocessors
    missingEvidence: >-
      Audited security controls, public incident history, and a current subprocessor list for platform and meter data
      flows.
    whyItMatters: >-
      Privacy and measurement claims rely on durable control execution, and the public file does not prove that posture
