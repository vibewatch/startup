            body: >-
              Warehouse lenders, pension-backed credit investors, and a first securitization all indicate that
              sophisticated counterparties view Redaptive’s contract cash flows as financeable. That does not prove
              equity-like returns, but it does de-risk the question of whether external capital is available at all.
