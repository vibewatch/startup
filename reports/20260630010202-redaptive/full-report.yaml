      - number: '5.3'
        title: Distributed-energy offerings, dependency stack, and defensibility
        blocks:
          - type: paragraph
            body: >-
              Redaptive’s distributed-energy story is broader in 2026 than a basic efficiency-finance pitch. The company
              now openly markets solar, battery storage, microgrids, CHP, generators, and EV charging alongside data
              products, and its public thought leadership shows that these are not passive line items. The storage
              material explains incentive stacking, behind-the-meter operating logic, and EMS-dependent peak shaving;
              the Verdant case shows Redaptive financing a multi-asset microgrid; and the IUC partnership extends the
              model into EV charging with pipelines sized in the thousands of chargers. That breadth is the company’s
              clearest product moat but also its clearest dependency risk. Redaptive’s architecture is increasingly
              partner-composed: Honeywell for controls and enterprise software context, HydroPoint for water
              intelligence, and IUC for charging deployment, while Redaptive supplies capital, metering, program
              management, and reporting. That mix is defensible because it is difficult to replicate the combined
              financing, implementation, portfolio data, and partner-orchestration muscle at the same time. It is also
              where diligence should press hardest, because partner-composed products can fail at the interfaces between
              finance, data, controls, and field service. The public record remains thin on open API documentation,
              customer-facing reference implementations, public cyber certifications, and fleet-wide uptime or SLA
              disclosure. For a company selling measurable outcomes across energy, water, storage, and EV
              infrastructure, those omissions are not fatal—but they are material for enterprise diligence and
              deployment underwriting decisions.
