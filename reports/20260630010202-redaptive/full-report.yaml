  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Redaptive is not selling into an empty category. Buyers can solve the same job through at least four
              alternative routes. First are direct or near-direct EaaS providers such as Budderfly and ENFRA, which also
              promise no-upfront-capital upgrades and long-term service relationships. Second are incumbent ESCO and
              infrastructure players such as Ameresco, Schneider Electric, NORESCO, and selected Siemens Smart
              Infrastructure offerings, which combine financing, engineering, project delivery, and long-term operations
              under broader energy or resiliency programs. Third are grid-flex and monetization substitutes such as
              CPower, which focus less on funding deep retrofits and more on turning existing distributed assets into
              recurring revenue. Fourth is the status quo procurement path itself: ESPC and UESC frameworks that already
              let agencies, campuses, and institutions modernize facilities without paying CapEx upfront. Redaptive's
              own materials stress vendor-agnostic portfolio modernization, shared-savings fees, and real-time tracking,
              but the field it faces is broader and more contract-driven than a normal software market.
