      - number: '7.2'
        title: Project Execution and Performance Risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk sits at the core of the model because Redaptive is not just financing equipment; it audits,
              designs, procures, installs, maintains, meters, and bills against delivered savings. DOE's AT&T case says
              Redaptive coordinated rollouts across nearly 650 facilities and numerous contractors, and Redaptive's own
              case studies show similar scale across Iron Mountain, Cintas, McKesson, a 182-site real-estate metering
              portfolio, a seven-year life-sciences modernization program, and a hospital cooling-plant replacement.
              That breadth proves demand but also raises the risk of acceptance delays, baseline disputes, installation
              slippage, and commissioning complexity. The hospital case is especially revealing because payment is
              deferred until the plant is complete and accepted, while the AT&T case explicitly ties monthly billing to
              measured savings. If savings are overestimated or hardware, controls, or subcontractors do not perform,
              Redaptive can face both operational remediation and cash-collection pressure. The move from lighting into
              HVAC, solar, storage, meters, and data solutions expands wallet share but makes quality control, safety,
              and vendor management harder, not easier.
