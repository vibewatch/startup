        - Escalate legal review and require audited controls, subprocessor transparency, and remediation plan
      - - Disclosure discipline risk
        - Official metrics remain inconsistent across major public surfaces
        - Management cannot bridge project, site, savings, and capital figures to a single reporting pack
        - Assume reporting immaturity and haircut growth confidence even if commercial momentum remains strong
