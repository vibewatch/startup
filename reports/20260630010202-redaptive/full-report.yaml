      - number: '8.5'
        title: Diligence Gaps and Thesis-Breakers
        blocks:
          - type: paragraph
            body: >-
              The final investment call hinges on a short list of missing private facts, not on finding more public
              praise. First, investors need a current revenue bridge, margin profile, and cash conversion view because
              the public estimates disagree and none comes from audited company disclosure. Second, investors need
              contract-level financing data: ABS advance rates, customer concentration, losses, delinquency history, and
              final rating outcome. Third, they need cap-table detail, including liquidation preferences and any terms
              attached to structured capital that could subordinate new common equity. Fourth, they need evidence on
              retention and renewal quality so customer proof translates into durable value instead of into one-time
              project wins. If those diligence requests come back strong, the call can migrate from research-more toward
              track or better. If they come back weak, or if Redaptive needs fresh equity at public-comp-like multiples,
              the thesis breaks quickly. That is why this chapter’s recommendation is intentionally evidence-sensitive
              and price-sensitive.
