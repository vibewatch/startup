  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital, Credit, and Disclosure Risk
        blocks:
          - type: paragraph
            body: >-
              Redaptive's most acute risk is that growth appears financing-led rather than cash-self-funded. Management
              and trade coverage describe the model as a capitalization story that scaled through a $650 million credit
              facility and a first asset-backed securitization, after earlier Rabobank, Deutsche Bank, and Atlas/Apollo
              structures. That is a strength only if receivables perform. KBRA's 2025 rated pool still had just 46
              obligors, roughly half performance-adjusted contracts, and 95 months of weighted average remaining tenor,
              so billing disputes or underperformance can flow quickly into collections, warehouse capacity, and
              new-origination pace. Disclosure quality compounds the credit question. The homepage, executive brief,
              about page, and careers page publish different figures for sites, projects, capital deployed, savings, and
              emissions without a public reconciliation. That inconsistency does not prove underperformance, but it
              raises diligence cost and makes it harder to map originations growth to realized credit performance. Until
              Redaptive discloses delinquency, loss, covenant, and top-obligor data more directly, investors should
              treat financing availability and disclosure discipline as thesis-critical risks rather than background
              conditions.
