          public comps imply.
        - >-
          Execution or financing slippage quickly erodes the premium because the public comp set still anchors much
          lower.
        - Possible, but it requires private diligence to overturn today’s weak public denominator.
      - - Base
        - >-
          Customer deployments continue, structured debt remains available, but disclosure stays thin and no new priced
          equity mark is disclosed.
        - $0.8B-$1.2B supports a hold/monitor stance rather than a clear premium entry.
        - A flat-to-down valuation outcome is still possible if financing spreads widen or revenue quality disappoints.
        - Most consistent with retained public evidence.
      - - Bear
        - Contract performance or funding conditions force common-equity repricing against public-comp-like lenses.
        - >-
          $0.4B-$0.8B, with downside below that in a stressed down-round, becomes plausible if the company must raise
          equity in a weak market.
        - >-
          New equity dilution, customer concentration, or failed rating outcomes can transmit quickly into the
          common-equity price.
        - The adverse public comparable evidence keeps this scenario materially live.
    notes: >-
      Scenario values are directional equity ranges derived from public comparable multiples, third-party revenue
      estimates, and the observed shift toward structured finance.
