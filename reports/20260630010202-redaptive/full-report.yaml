      - number: '2.2'
        title: Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              There is no single authoritative public TAM for “Energy-as-a-Service for multi-site commercial buildings,”
              so the chapter preserves several adjacent lenses instead of pretending they are one clean number. At the
              bottom of the funnel is a very large underlying spend pool: EIA says U.S. commercial buildings spent $141
              billion on energy in the last full nationwide survey, while DOE and AEO 2026 both frame
              commercial-building energy use as a large and still-growing problem. Around that spend pool, analyst
              estimates for EaaS vary widely depending on scope. Some cover North America commercial EaaS only, others
              all North America EaaS, and others the adjacent retrofit or BEMS layers that Redaptive also touches. Those
              differences are analytically useful rather than noise: they show that Redaptive sits at the overlap of
              financing, retrofit execution, and data services. Public sources support a large and growing served
              market, but they do not support a precise revenue-based SOM for Redaptive, which remains a diligence gap.
