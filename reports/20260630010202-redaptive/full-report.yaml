  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Public or private revenue confirmation disappoints
        - Current annual revenue proves closer to low public estimates than to a materially higher private figure.
        - The historical $1B mark looks stretched relative to public comp multiples.
        - Re-cut valuation to public-comp ranges and avoid premium entry pricing.
      - - ABS/rating underperforms expectations
        - Final ratings, spreads, or loss performance are materially weaker than management narrative implies.
        - Contract-finance advantage becomes less durable and less scalable.
        - Move from research-more/track to avoid until financing economics are re-underwritten.
      - - Dilutive equity financing appears
        - Company raises common equity below the 2022 unicorn mark or with heavy preference terms.
        - Fresh price discovery would reset the benchmark downward.
        - Treat as a thesis break unless dilution also buys unusually strong growth visibility.
      - - Customer concentration or renewals weaken
        - Large customer cohorts show non-renewal, repricing pressure, or heavy concentration.
        - Customer proof stops translating into durable enterprise value.
        - Re-rate revenue quality and narrow any bull-case range.
      - - Public comparable compression resumes
        - High-end public energy-infrastructure multiples fall materially below today’s range.
        - Even strong execution may not support premium private pricing.
        - Require a larger discount to the 2022 mark before engaging.
    notes: The triggers focus on measurable valuation transmission rather than on general macro fear.
    claimRefs:
      - CV017
      - CV025
      - CV035
      - CV038
      - CV040
      - CV041
      - CV045
      - CV049
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Current revenue and growth
        - Latest audited or board-approved revenue bridge, including 2025 and year-to-date 2026 performance.
        - Without a denominator, the implied multiple cannot be underwritten.
        - Request audited financial package and cohort bridge under NDA.
      - - Gross margin and cash conversion
        - Project-level and consolidated gross margin, EBITDA, cash flow, and working-capital profile.
        - Structured finance can mask weak common-equity economics if margins are thin.
        - Request finance workstream review with management and lender materials.
      - - ABS economics and ratings
        - Final Kroll outcome, advance rates, credit enhancement, delinquency/loss data, and covenant package.
        - This is now central to the financing thesis and downside risk.
        - Obtain offering materials and lender deck from treasury or capital-markets team.
      - - Cap table and preferences
        - >-
          Liquidation preferences, anti-dilution protections, convertibility, warrants, and rights attached to 2024-2025
          capital.
        - A premium headline valuation can still produce poor common-equity entry economics.
        - Review cap-table model and all governing documents with counsel.
      - - Customer quality
        - Renewal rates, concentration, contract terms, savings verification, and default history.
        - Customer proof only matters if the contracts are durable and collectible.
        - Request top-customer schedule and contract sample set.
      - - Exit path
        - Management view on strategic sale, private refinancing, secondary liquidity, and IPO readiness.
        - The likely exit route changes holding period, governance needs, and acceptable entry price.
        - Discuss explicit exit scenarios in management meetings and board materials.
    notes: >-
      Each diligence ask is investment-relevant because the missing information could move the recommendation or price
      tolerance materially.
    claimRefs:
      - CV037
      - CV038
      - CV040
      - CV041
      - CV046
