  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Redaptive's public materials consistently describe a provider-financed Energy-as-a-Service structure
              rather than a conventional software subscription or equipment-sale model. The company funds project
              development, construction, equipment ownership, measurement infrastructure, and selected maintenance
              obligations, then recovers its capital through monthly service payments tied to verified avoided energy
              consumption or other measured performance outcomes. Official materials describe contract terms that
              typically run five to twenty years and emphasize off-balance-sheet or operating-expense treatment when
              true risk transfer is achieved. Public monetization is broader than the core service fee alone: by 2024
              Redaptive had expanded into equipment financing products including leases, loans, short-term-rental
              conversions, and sale-leasebacks. What is missing is list pricing or realized price disclosure. The
              company explains how payments are structured, but it does not publish contract APRs, savings-share splits,
              hurdle rates, or weighted average service fees, so public analysis can explain the mechanism but cannot
              independently rebuild revenue or margin by contract cohort.
