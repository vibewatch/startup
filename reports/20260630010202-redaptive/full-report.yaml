      - number: '1.3'
        title: Funding, Valuation, and Capital Stack
        blocks:
          - type: paragraph
            body: >-
              Redaptive’s capital history matters because the business model is inseparable from financing capacity. The
              strongest public valuation datapoint remains the December 2022 CPP-backed round: external reporting and
              Tracxn both support a roughly $200M financing event, and Tracxn tags that round with a $1B post-money
              valuation. In 2023 the company extended Series E to approximately $250M with Honeywell, CPP Investments,
              CBRE, Linse Capital, and others. After that, the financing story shifts heavily toward structured debt and
              project capital rather than classic venture rounds.


              The warehouse and facility chronology is unusually important for a company-overview chapter because it
              defines Redaptive’s operating moat. Deutsche Bank provided a $125M warehouse facility in August 2023.
              ATLAS SP added a $225M warehouse in April 2024 for equipment financing. One month later Deutsche,
              Rabobank, and Mitsubishi HC Capital America expanded another facility to $250M. CPP then added $100M of
              follow-on equity in October 2024. In May 2025 CDPQ and Nuveen provided a $650M credit facility, and in
              December 2025 Redaptive announced an inaugural $216M ABS backed by long-term EaaS contracts.


              This sequence shows a company financed less like a pure software startup and more like a hybrid
              infrastructure-finance platform. That complexity also explains why aggregate capital figures diverge
              sharply across public datasets. Commercial Observer says Redaptive topped $1B in total capital after the
              2024 follow-on; Tracxn tracks $733M over 11 rounds; CB Insights shows $1.978B over 16 rounds. Those totals
              are not necessarily mutually exclusive—they appear to reflect different treatment of warehouse debt,
              credit facilities, and securitization proceeds. The practical implication for diligence is clear: current
              post-money valuation, exact total capital consumed, and debt-equity normalization all require direct
              company or investor confirmation.
