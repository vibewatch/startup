      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Arvin Vohra is the clearly supported public face of Redaptive today. Official 2024-2025 financing releases
              identify him as CEO, and independent profiles tie him to an energy-structured finance background at Lehman
              Brothers, Barclays, and Enlighted. The reviewed founder material also points to John Rhow as the other
              co-founder, but the public record is asymmetrical: Rhow appears in founder interviews and data platforms,
              yet recent official financing materials focus almost entirely on Vohra. Built In still showed Rhow as
              executive chairman and president in late 2022, and CB Insights continues to list him as founder and
              president.


              Below the CEO layer, Redaptive’s public leadership surface is selective rather than comprehensive. Monish
              Sharma was presented as the newly hired CTO in October 2024, Joel Ullmann surfaced as Chief Partnerships
              Officer in the partner-program announcement, and Matt Gembrin appears repeatedly as the capital-markets
              executive guiding warehouse, credit, and securitization transactions. That is enough to establish a
              functional bench in technology, partnerships, and finance, but not enough to infer a fully disclosed
              executive org chart.


              Governance transparency is thinner than financing transparency. The official site does not publish a board
              page, while CB Insights lists Sheeraz Haji as a director. Because the board roster is incomplete and most
              current official communications emphasize a narrow set of leaders, governance visibility remains partial
              and key-person dependence appears high—particularly around Vohra’s role as strategy, fundraising, and
              external-commercial anchor.
