  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation Frame
        blocks:
          - type: paragraph
            body: >-
              Redaptive has enough public proof to earn serious attention, but not enough to justify price conviction.
              The positive case is visible: the company now presents itself as an infrastructure monetization platform
              rather than a simple project lender, recent customer material points to scaled deployments with McKesson,
              Iron Mountain, and UniFirst, and the December 2025 ABS suggests institutional debt investors are willing
              to underwrite a pool of long-duration EaaS contracts. The negative case is also visible and matters more
              for this chapter: the last public equity valuation signal is still the $1B December 2022 Tracxn mark,
              while current revenue, cash generation, customer concentration, renewal behavior, and cap-table economics
              remain undisclosed. That pushes the chapter toward a research-more recommendation rather than a buy or
              even a clean track call. Investors can argue Redaptive is strategically valuable, but they cannot yet
              demonstrate from public evidence that the company deserves a persistent unicorn-plus valuation in a 2026
              market where transparent public comparables usually trade on much lower revenue multiples.
