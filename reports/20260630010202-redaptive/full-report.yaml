  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Redaptive should not be analyzed as a commodity-energy seller or as a pure building-software vendor. Its
              public materials define the market as outsourced infrastructure modernization for large portfolios: the
              provider brings capital, project delivery, and ongoing measurement so customers can buy outcomes rather
              than own equipment directly. Included spend therefore covers energy-efficiency retrofits such as lighting,
              HVAC, controls, and selected renewable or charging projects, plus the metering, benchmarking, and
              utility-intelligence layers needed to verify savings and support ESG or investor reporting. Excluded spend
              includes commodity power sales, utility wires-and-pipes infrastructure, and generic balance-sheet-funded
              retrofits that do not rely on third-party financing or long-term service contracts. The status quo is
              fragmented: CapEx committees, secured leases or loans, C-PACE where available, traditional ESCO contracts,
              and manual utility-data gathering. That boundary matters because Redaptive wins where financing friction
              and measurement friction are both present, especially in leased or multi-site environments where owner,
              tenant, and facilities teams do not naturally share the same incentives.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM029
