      - number: '8.2'
        title: Financing Context and Price Discovery
        blocks:
          - type: paragraph
            body: >-
              Redaptive’s financing history is directionally strong but valuation disclosure is weak. Honeywell’s March
              2023 strategic investment showed partner interest but disclosed no price. The August 2023 Deutsche Bank
              warehouse facility, May 2025 CDPQ/Nuveen credit facility, and December 2025 Deutsche Bank-arranged ABS all
              indicate that capital providers view Redaptive’s contracts as financeable assets. That is a meaningful
              strategic strength because it can defer common-equity dilution and lets the company fund projects from
              structured capital instead of from only venture rounds. But it also changes the underwriting problem.
              Public investors still do not know advance rates, credit enhancement, loss experience, concentration, or
              covenant headroom, and the ABS announcement itself said the asset pool was still pending final Kroll
              ratings. In other words, the company has improved access to capital without giving outside investors a
              fresh, transparent common-equity mark. The financing stack therefore supports continuation, but not a
              confident conclusion that the equity is worth materially more than the last visible 2022 benchmark.
