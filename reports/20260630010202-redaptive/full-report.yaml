      - number: '2.3'
        title: Buyer, User, and Budget-Owner Segmentation
        blocks:
          - type: paragraph
            body: >-
              Redaptive's buyer map is multi-threaded rather than single-threaded. In real estate, the initial champion
              is often a sustainability or asset-management team that needs auditable utility data for GRESB or investor
              reporting, while the eventual economic case has to resonate with property management teams, tenants, and
              ownership. In large industrial or logistics portfolios, the user need is usually lower operating cost or
              deferred-maintenance relief, with facilities and operations teams driving implementation and finance teams
              reviewing service-contract economics. In corporate programs like Iron Mountain or UniFirst, senior
              facilities leadership can sponsor modernization when net-zero mandates and OpEx flexibility line up. This
              means the “buyer” is rarely one persona: sustainability teams care about auditable data, facilities teams
              care about execution and downtime, finance cares about off-balance-sheet or service-fee treatment, and
              owners care about tenant alignment or asset value. Redaptive's market is strongest where those groups all
              feel pain from outdated infrastructure but none wants to fund a conventional portfolio-wide CapEx program.
            claimRefs:
