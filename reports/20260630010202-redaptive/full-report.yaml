      - number: '1.4'
        title: Customers, Scale Signals, Milestones, and Adverse Items
        blocks:
          - type: paragraph
            body: >-
              Customer proof is one of Redaptive’s strongest public assets. Official case studies verify named
              deployments with Berry Global, McKesson, Iron Mountain, Cintas, Saint-Gobain, and WPT Capital Advisors,
              while the October 2024 equity announcement says Redaptive serves more than 40 Fortune 500 companies.
              Commercial Observer adds a broader but still company-mediated figure of 150 customers and names T-Mobile
              as one example, though no authoritative evidence was found in the reviewed set for the brief’s hints about
              Google, Walmart, Target, or Boeing. The evidence therefore supports meaningful enterprise traction, but
              not the full hinted customer list.


              The customer stories also demonstrate that Redaptive is selling more than isolated retrofits. Iron
              Mountain scaled to 382 facilities across five countries; McKesson covered 28 facilities; Berry Global
              covered 38 locations; Cintas covered 125 locations and added a solar pilot; Saint-Gobain spanned 30 sites;
              and WPT used Redaptive ONE to automate utility-data capture. Together, these cases support management’s
              claim that Redaptive is oriented toward multi-site modernization rather than single-building projects.


              Adverse public signals exist, but they are narrower than the capital narrative. Built In reported that
              Redaptive canceled a planned IPO before the December 2022 private round, reinforcing the company’s
              continued dependence on private capital markets. Separately, GI Endurant sued Redaptive Services in New
              York Supreme Court in May 2023, though the case was later discontinued or dismissed. The bigger diligence
              concern is not either one event in isolation; it is that public disclosure remains much richer on
              capital-raising than on governance, headcount, or revenue, which limits how confidently an outside analyst
              can translate Redaptive’s deployment scale into enterprise economics.
