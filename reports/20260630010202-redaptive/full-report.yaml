      - number: '8.4'
        title: Scenario and Sensitivity Analysis
        blocks:
          - type: paragraph
            body: >-
              Because public inputs are incomplete, the scenario framework must stay range-based and explicit about
              assumptions. A bull case requires three things to break in Redaptive’s favor at once: public revenue
              estimates materially understate true scale, the 2025 ABS and 2025 credit facility prove repeatable without
              materially higher cost of capital, and the company avoids a dilutive equity raise below its 2022 unicorn
              mark. Under that set of conditions, a $1.2B to $1.8B equity range is defensible. A base case assumes the
              business continues to deploy capital and win customers, but that disclosure remains thin and financing
              markets value the company closer to high-end public growth infrastructure comps; that points to roughly
              $0.8B to $1.2B. A bear case assumes contract performance, capital-market spreads, or customer
              concentration force common-equity repricing against public-comp lenses instead of private narrative
              support; that produces a much harsher $0.4B to $0.8B range, with a down-round path below that band. The
              dominant sensitivities are denominator visibility, contract cash performance, and financing terms rather
              than market demand alone.
