      - number: '6.3'
        title: Contract Shape and Procurement Implications
        blocks:
          - type: paragraph
            body: >-
              Redaptive's customer promise is inseparable from its contract structure. In the company's own EaaS-vs-ESCO
              explanation, EaaS is a provider-financed, multi-year service agreement—typically 5 to 20 years—rather than
              a fixed-scope equipment purchase. Equipment Finance Advisor added that Redaptive uses performance
              contracts repaid from a percentage of measured savings over roughly 10- to 15-year tenors. That structure
              can shorten the business case for capital-constrained customers, but it does not eliminate procurement
              complexity. In real-estate use cases, Redaptive still needs utility-bill access, metering validation,
              tenant coordination, and property-manager buy-in. The DaaS terms make this explicit: Redaptive says it
              cannot ensure proper meter accuracy if it cannot validate against customer utility bills. The platform and
              DaaS terms also matter operationally after signature because they limit access to authorized users, permit
              service suspension for missed payments or security concerns, and disclaim liability for outages or lost
              profits. The strongest expansion proofs—Iron Mountain and the life-sciences manufacturer—show why master
              agreements matter: once one installation proves out, Redaptive can add sites or technologies without
              restarting every RFP.
