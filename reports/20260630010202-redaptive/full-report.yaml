chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Model, and Footprint
        blocks:
          - type: paragraph
            body: >-
              Redaptive Inc., branded publicly as Redaptive, positions itself as an Energy-as-a-Service and
              infrastructure monetization provider for large commercial and industrial portfolios. The current official
              message is less about one-off retrofits and more about programmatic capital deployment: Redaptive says it
              combines capital, execution, and measurable outcomes so customers can modernize infrastructure without
              competing for traditional CapEx. The operating model still maps closely to the earlier Redaptive EaaS
              explanation—shared-savings, no-upfront-cost contracts that bundle diagnostics, procurement, installation,
              and measured performance into a single service relationship.


              The company’s currently disclosed footprint centers on Denver, where it lists headquarters at 1601 19th
              Street and separately highlighted a 25,000-square-foot McGregor Square office opened in 2024. It also
              discloses a Pune, India office, implying a two-continent operating footprint even though the public brand
              stays strongly U.S.-anchored. Product scope has broadened from the earlier lighting-first framing to a
              much wider stack of HVAC, lighting, solar, storage, EV charging, controls, and metering. Scale claims are
              sizable but company-mediated: the website now cites $1.2B deployed capital, 12,000+ completed projects,
              $353M of energy savings, and 6,000+ transformed sites, which indicates meaningful operating maturity even
              though audited financial disclosure remains absent.


              Founding chronology is not perfectly clean. Current official materials consistently use 2015, while
              earlier founder interviews cite 2014. The most defensible read is that 2015 is the canonical company-used
              founding date and 2014 reflects pre-launch development rather than a conflicting current corporate
              identity.
