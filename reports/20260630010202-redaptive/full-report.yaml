      - number: '4.3'
        title: Capital Stack, Project Finance, and Facility Evolution
        blocks:
          - type: paragraph
            body: >-
              Redaptive's financing history shows an operating model built on repeat access to structured credit as much
              as on equity support. Public sources show a $125 million Deutsche Bank warehouse facility in 2023 designed
              to securitize customer contracts and support competitive pricing, a $225 million ATLAS SP warehouse
              facility in 2024 that launched a broader equipment-financing product set, a $650 million credit facility
              from CDPQ and Nuveen in May 2025, and an inaugural December 2025 securitization of approximately $216
              million arranged by Deutsche Bank. Tracxn's funding chronology also records a $100 million Series E in
              October 2024 and prior equity rounds, suggesting the company has blended equity with increasingly
              institutional debt. The 2025 securitization is the most revealing artifact because third-party disclosures
              show the collateral pool rather than just the headline press-release amount. KBRA describes 1,445 leases
              to 46 obligors with roughly $244.5 million of securitization value including a prefunding pool, while the
              SEC ABS-15G filing confirms Redaptive Sustainability Services sponsored the transaction and attached a
              Deloitte agreed-upon-procedures report. This architecture is positive for capital access, but it also
              shows that growth depends on continued warehouse, term-debt, and capital-markets receptivity rather than
              on internally funded cash generation.
