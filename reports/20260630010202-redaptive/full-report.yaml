      - number: '4.4'
        title: Credit, Counterparty, and Disclosure Limits
        blocks:
          - type: paragraph
            body: >-
              Redaptive's securitization disclosures create more confidence in contract-backed scale than a normal
              private-company press release would, but they also surface the limits of public underwriting. The
              collateral pool is diversified across 46 obligors, yet KBRA still identifies meaningful concentration:
              Texas, California, and New Jersey represent 43.2 percent of securitization value, and about half of the
              pool is performance-adjusted rather than fully fixed payment. Weighted average remaining tenor is 95
              months, which lengthens exposure to customer credit quality, equipment performance, and
              savings-verification discipline. ESG Dive adds that the first securitization intentionally excluded assets
              whose economics depended on investment tax credits, making the published pool easier to rate but
              potentially narrower than the company's full deployment universe. Meanwhile, Redaptive's own public
              metrics are marketing-style rather than audited: one official surface says $1.2 billion-plus funded, while
              a 2026 executive brief claims $1.6 billion-plus invested, 18,700-plus projects, and $480 million of
              customer savings. Those numbers may reflect different dates or definitions, but the drift underscores the
              absence of a reconciled KPI pack. Public materials still do not disclose revenue, gross margin, burn,
              runway, cohort losses, customer concentration by revenue, or ABS coupon and credit-enhancement terms.
