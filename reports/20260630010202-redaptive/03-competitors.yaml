- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Vendor / class
  - Public pricing signal
  - Contract model
  - CapEx treatment
  - Included operating scope
  - Implication / unknown
  rows:
  - - Redaptive
    - No list pricing disclosed in fetched materials
    - Shared-savings EaaS contract, often 5 to 20 years
    - Customer avoids owning, maintaining, or paying upfront for equipment
    - Project oversight, financing, monitoring, and measured performance
    - Clear financing story; realized savings share, renewal terms, and early-termination economics are not public
  - - Ameresco
    - No public list price; budget-neutral language is explicit
    - ESPC, PPA, and off-balance-sheet EaaS
    - Avoids upfront customer capital and can move costs off balance sheet / off credit
    - Analytics, efficiency, DER, microgrids, and O&M
    - Pricing is negotiated; breadth can be attractive for large procurements
  - - Schneider Electric
    - No public list price; predictable monthly payments are explicit
    - EaaS service contract, often paired with partner financing and ownership
    - Zero upfront costs in fetched EaaS examples
    - Consult, design, build, operate, and maintain
    - Procurement rides partner ecosystem strength more than posted tariff-like pricing
  - - NORESCO
    - No public list price; guaranteed-savings language is explicit
    - ESPC or UESC performance contracts
    - Avoids upfront capital and repays through guaranteed savings
    - Turnkey design, implementation, financing, M&V, and O&M
    - Very strong for institutional procurement; less transparent for private-market commercial buyers
  - - ENFRA
    - No public list price disclosed
    - Long-term EaaS partnerships plus engineering and construction scope
    - Financed-project structure is public, but contract-level terms are not
    - Engineering, construction, maintenance, and asset management
    - Integrated delivery is a strength, but realized commercial terms remain private
  - - CPower
    - No public list price; revenue-share logic is more visible than fees
    - Demand response, energy-flexibility, and market-access program agreements
    - Does not mainly replace CapEx; monetizes existing or newly deployed assets
    - Program enrollment, dispatch, and market participation support
    - Substitute economics depend on market revenue and tariff structures, not only retrofit ROI
  - - Budderfly
    - No menu pricing; website claims one monthly bill up to 5% lower than otherwise paid
    - Energy-as-a-service agreement for distributed commercial sites
    - No upfront equipment investment by the customer
    - Equipment upgrades, monitoring, maintenance, and billing transparency
    - Simple packaging is a selling point, but realized contract economics are still quote-based and private
  notes: Public pricing disclosure is thin across the entire set, so the table compares contract mechanics and cost-treatment signals rather than pretending the vendors publish directly comparable unit prices.
  enumerationScope:
    coverage: partial
    basis: The comparison covers the main vendor classes with publicly fetchable contract-language signals, but it cannot expose undisclosed savings-share percentages, discounting, or customer-specific renewal terms.
