- id: TP004
  title: Distribution / Trust / Switching-Cost Map
  columns:
  - Vendor / class
  - Primary channel or route to buyer
  - Delivery / trust signal
  - Likely switching or multi-homing dynamic
  - Risk to Redaptive
  rows:
  - - Redaptive
    - Direct enterprise sale around deferred maintenance, sustainability, and portfolio upgrades
    - Measured outcomes, vendor-agnostic message, and institutional financing partners
    - Strongest once a portfolio program is active, but public sources do not show termination friction
    - Needs to prove value beyond financing to defend share against incumbents
  - - Ameresco
    - Public-sector, institutional, utility, and enterprise infrastructure procurement
    - 50+ offices, 1,500+ employees, and long record in budget-neutral contracts
    - Broad services may reduce buyer need to add another specialist
    - Can win where procurement values one full-service public-company counterparty
  - - Schneider Electric
    - Microgrid, resilience, and partner-ecosystem routes
    - Global automation brand plus project-capital initiative with 20+ partners
    - Ecosystem structure can make Schneider sticky inside broader resilience programs
    - Can crowd Redaptive out of resilience-led, community-scale, or partner-assembled projects
  - - NORESCO / ENFRA
    - Federal utility master agreements, campus procurement, and self-perform infrastructure routes
    - NORESCO federal pedigree; ENFRA engineering and construction depth
    - Single-accountable-contractor logic can reduce appetite for separate financing specialists
    - Especially threatening where buyers already know ESPC/UESC or want self-perform delivery
  - - CPower
    - Grid-program and DER-owner route
    - NRG ownership, VPP scale, and market-access expertise
    - Easy to pair with existing assets or other retrofit vendors rather than replace them entirely
    - Can siphon off flexibility value or become a preferred substitute when revenue monetization matters more than modernization finance
  - - Budderfly
    - Direct distributed-site commercial and franchise route
    - Simple message, ongoing monitoring, and growing national site base
    - Can be easy for a multi-site operator to pilot at a subset of locations
    - Strong overlap at the small-format commercial end where contract simplicity matters more than bespoke project design
  notes: The table focuses on buyer-access route and operational trust, because those factors appear more differentiating in public evidence than feature claims alone.
