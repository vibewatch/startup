- id: distribution-trust-and-switching-dynamics
  title: Distribution, Trust, and Switching Dynamics
  body: 'Incumbent distribution and trust are the clearest reasons Redaptive will not win on financing alone. Ameresco comes with public-company scale, more than 50 regional offices, and procurement familiarity across government, education, healthcare, and industrial accounts. Schneider can route buyers through a large microgrid and resilience partner ecosystem, while NORESCO has federal credibility through UESC relationships with 14 utilities and a long DOE Super ESPC history. ENFRA adds self-perform engineering, construction, and maintenance depth, which can matter when buyers want a single accountable contractor rather than a financing specialist coordinating third parties. CPower and Budderfly pressure Redaptive from different edges: CPower can turn existing or newly deployed assets into grid-market revenue, while Budderfly targets distributed commercial sites with a simpler turnkey message. Public sources do not show enough contract detail to quantify actual termination costs, bundling
    concessions, or renewal frictions, but the evidence is strong enough to conclude that buyer choice often turns on procurement route and operating model rather than a pure technology comparison.'
