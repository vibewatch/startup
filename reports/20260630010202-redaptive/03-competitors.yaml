- id: TP005
  title: Moat Durability / Competitive Risk Register
  columns:
  - Redaptive moat claim
  - Primary threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Portfolio-wide financing plus measured outcomes is harder to match than simple equipment sales
    - Incumbent ESCOs also remove upfront cost and bundle delivery, O&M, and procurement channels
    - High
    - Ameresco, Schneider, NORESCO, and ENFRA all market financing-plus-delivery structures
    - Request win/loss data by vertical and evidence of why customers choose Redaptive over full-service incumbents
  - - Capital-markets-backed contract securitization creates differentiated funding depth
    - Large incumbents and peers can still access massive project capital through public balance sheets, partner networks, or private infrastructure investors
    - Medium
    - Redaptive completed an inaugural ABS, but Schneider partners cite $7.5B and Budderfly says capital raised exceeds $1B
    - Ask how Redaptive pricing or customer economics improved after securitization relative to peers
  - - Vendor-agnostic modernization can appeal where buyers dislike locked ecosystems
    - Buyers may prefer a single self-perform or platform incumbent that owns more of design, controls, and field execution
    - Medium
    - ENFRA self-performs; Siemens and Schneider embed controls and operations more deeply; NORESCO is vertically integrated
    - Test whether vendor-agnostic sourcing improves realized savings, speed, or asset uptime
  - - Redaptive can position itself against status quo CapEx budgets
    - ESPC and UESC already normalize no-upfront modernization in institutional procurement
    - High
    - DOE and NORESCO materials show mature ESPC/UESC routes with guaranteed savings and utility master agreements
    - Clarify where Redaptive wins against ESPC rather than merely alongside it
  - - Distributed-site program management is a defendable niche
    - Budderfly competes directly for distributed commercial sites with a simpler message and growing VPP overlay
    - Medium
    - Budderfly reports 8,000+ sites, 340.8 MW under management, and quote-light no-upfront packaging
    - Segment Redaptive pipeline by site format and ask whether Budderfly appears in more small-format opportunities
  - - Modernization data and monitoring may create stickiness
    - Public sources do not show switching costs, renewal rates, or multi-homing behavior once contracts are live
    - Material
    - Every vendor stresses monitoring or long-term performance, but public contract details are limited
    - Ask for gross retention, renewal, and early-termination statistics before assuming stickiness is durable
  notes: Severity reflects pressure on Redaptive pricing power and win quality, not whether demand for modernization disappears. The table intentionally surfaces substitute contracting models and adjacent players, not only direct EaaS peers.
