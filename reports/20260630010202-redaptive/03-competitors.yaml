  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-pricing-transparency
    missingEvidence: Actual contract schedules, realized savings-share percentages, termination penalties, and discounting terms for Redaptive and the main competitor set.
    whyItMatters: Without contract-level economics, the pricing comparison can only compare public packaging signals rather than true customer cost or margin pressure.
    diligencePath: Request sample MSAs, order forms, or customer invoices from management and compare them with competitor term sheets gathered in live diligence.
    relatedQuestionRefs:
    - QP013
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-multi-homing
    missingEvidence: Renewal rates, integration unwind costs, contract-assignment terms, and evidence of customers using multiple providers at once.
    whyItMatters: Public pages stress stickiness and monitoring, but they do not show whether Redaptive relationships are harder to displace than incumbent or substitute contracts.
    diligencePath: Ask management for gross retention, contract duration by cohort, and examples of customers that expanded, switched, or multi-homed between vendors.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Named win-loss data against Ameresco, Schneider, NORESCO, ENFRA, Budderfly, and CPower, plus reasons codes for wins and losses.
    whyItMatters: The moat discussion is directionally sound from public evidence, but underwriting competitive durability requires actual proof of conversion and renewal behavior in live deals.
    diligencePath: Obtain CRM-derived win-loss data, reference calls from lost opportunities, and pipeline segmentation by buyer type and competitor encountered.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape-coverage
    missingEvidence: A fuller list of regional ESCOs, private project developers, and finance partners that may matter in specific verticals or geographies.
    whyItMatters: The chapter covers the named competitive set and the main substitute classes, but not every smaller regional or verticalized contractor that could appear in a deal.
    diligencePath: Expand the long list by vertical and geography during live pipeline review, then test whether those players appear meaningfully in current opportunities.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
