- id: capability-pricing-and-contract-comparison
  title: Capability, Pricing, and Contract Comparison
  body: 'The main competitive split is not whether vendors remove upfront cost; many of them do. The sharper question is what each vendor wraps around that financing promise. Redaptive emphasizes portfolio-wide modernization, measured performance, and securitized contract cash flows. Ameresco layers analytics, demand management, DER, microgrids, operations, and project finance into a long-established full-service model. Schneider leans into resilience, microgrids, and partner-backed ownership or operations. NORESCO anchors around guaranteed-savings ESPCs and utility-enabled UESC structures. ENFRA pairs EaaS with self-perform engineering and construction. Budderfly packages smaller-format distributed-site upgrades, monitoring, and simplified monthly bills for commercial operators. CPower is different again: it monetizes flexible demand, batteries, generators, and microgrids through demand response and VPP programs rather than being a pure retrofit financier. Public list pricing remains scarce
    across the set, so buyers are mostly comparing contract mechanics, channel fit, and delivery scope rather than transparent unit prices.'
