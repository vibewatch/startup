  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-customer and top-obligor revenue share, renewal profile, and cross-default exposure across the enterprise book and ABS collateral pool.
    whyItMatters: Large enterprise programs are central to the thesis, so undisclosed concentration can magnify both collections and growth volatility.
    diligencePath: Request customer concentration schedule, top-10 obligor list, and renewal cohort view under NDA.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: portfolio credit performance
    missingEvidence: Delinquency, default, covenant, loss, and realized cash-collection history for warehouse lines and the 2025 ABS pool.
    whyItMatters: Financing is a thesis-critical dependency, so investors need evidence that originations are translating into stable collections and refinance capacity.
    diligencePath: Obtain lender reporting packages, servicer data, KBRA surveillance materials, and management's monthly collections dashboard.
    relatedQuestionRefs:
    - QR020
    - QR032
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: security and subprocessors
    missingEvidence: Audited security controls, public incident history, and a current subprocessor list for platform and meter data flows.
    whyItMatters: Privacy and measurement claims rely on durable control execution, and the public file does not prove that posture adequately.
    diligencePath: Request SOC 2 / ISO materials, incident log summaries, penetration-test results, and the live subprocessor schedule.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: realized savings variance
    missingEvidence: Portfolio-level realized-vs-underwritten savings performance, dispute rates, and acceptance-cycle metrics across key customer cohorts.
    whyItMatters: Performance-adjusted billing and customer acceptance are direct cash-flow drivers, so weak savings realization can damage both collections and repeat business.
    diligencePath: Sample project-level M&V reports, invoice dispute logs, and acceptance timing across AT&T-, Iron Mountain-, healthcare-, and industrial-style programs.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR002
    - TR005
