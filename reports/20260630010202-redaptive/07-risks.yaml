- id: concentration-competition-and-kill-criteria
  title: Concentration, Competition, and Kill Criteria
  body: Redaptive's customer set is attractive but potentially concentrated. Public examples cluster around very large enterprises and portfolio owners—AT&T, Iron Mountain, Cintas, McKesson, a global life-sciences manufacturer, and institutional real-estate and hospital systems—yet none of the public materials disclose revenue share by customer, top-obligor exposure, renewal rates, or realized loss history. That matters because large-account expansion is one of the model's core economics, but large accounts also create procurement friction, bespoke implementation demands, and renegotiation leverage. Competitive pressure is also real. Honeywell and Ameresco each market broad efficiency, resilience, modernization, and building-service platforms with deeper delivery benches and larger balance sheets than Redaptive. Against that backdrop, the right diligence posture is to focus less on whether demand exists and more on whether Redaptive can keep funding, delivering, and verifying outcomes faster
    than enterprise buyers can source alternatives. If management cannot reconcile official metrics, disclose top-obligor exposure, show stable collections on performance-adjusted contracts, and document security and measurement controls, investors should assume today's growth story could compress into a harder-to-fund execution story.
