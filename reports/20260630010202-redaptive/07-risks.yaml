- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Collections / credit performance risk
    - Receivables delinquency, downgrade, or covenant pressure in rated or warehouse pools
    - Any unexpected KBRA action, rising delinquency trends, or shrinking lender availability
    - Pause growth assumptions and re-underwrite enterprise credit quality before committing more capital
  - - Performance-adjusted cash-flow volatility
    - Savings shortfalls or disputed invoices on flagship portfolios
    - Repeated acceptance delays or realized savings materially below underwritten levels
    - Treat margin and valuation assumptions as overstated until performance data is reconciled
  - - Customer concentration risk
    - Management cannot disclose top-obligor share, renewal profile, or cross-default exposure
    - No credible customer-concentration schedule by diligence close
    - Require price protection, concentration caps, or a no-go decision
  - - Privacy / regulatory risk
    - Security incident, privacy complaint, or failed data-subject request handling
    - Any regulator inquiry, breach notification, or material control exception
    - Escalate legal review and require audited controls, subprocessor transparency, and remediation plan
  - - Disclosure discipline risk
    - Official metrics remain inconsistent across major public surfaces
    - Management cannot bridge project, site, savings, and capital figures to a single reporting pack
    - Assume reporting immaturity and haircut growth confidence even if commercial momentum remains strong
  notes: These kill criteria convert the chapter's open questions into monitorable diligence gates rather than generic caution flags.
