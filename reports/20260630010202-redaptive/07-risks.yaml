- id: legal-regulatory-and-data-risk
  title: Legal, Regulatory, and Data Risk
  body: Redaptive's legal and regulatory burden is meaningful because the company handles platform data, meter-install applications, cross-border personal data terms, and contract language that allocates risk under stress. The privacy policy says Redaptive collects contact details, employment information, device identifiers, and energy-usage data, while the DPA pulls the business into GDPR, UK, Swiss, and EEA transfer rules, SCCs, subprocessor oversight, and data-subject rights. California privacy law adds separate disclosure and response duties. Meanwhile, the platform and data terms define force majeure broadly enough to include utility outages and government orders, and the equipment warranty is parts-only, excludes removal and reinstallation costs, and pushes third-party hardware to manufacturer warranties. None of that is unusual for infrastructure software, but it means a privacy complaint, data-transfer issue, or metering failure can become a contract dispute faster than generic marketing
    pages suggest. Because Redaptive's public materials do not surface audited security posture, incident history, or a public subprocessor list, the residual regulatory and legal risk remains material.
  claimRefs:
  - CR020
  - CR029
  - CR030
  - CR031
  - CR032
