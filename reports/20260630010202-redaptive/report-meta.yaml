companyProfile:
  summary: >-
    Redaptive is a private Energy-as-a-Service platform that combines structured capital, turnkey deployment, and the
    Redaptive ONE metering-and-analytics layer to modernize energy infrastructure across large commercial and industrial
    portfolios. The public record shows a business scaled around multi-site enterprise customers, warehouse and ABS-backed
    financing, and measurable savings outcomes rather than a pure software subscription model.
