- id: financial-verdict
  title: Financial Verdict
  body: 'Redaptive''s public evidence supports a credible conclusion that customers value the model and that institutional capital providers view contract-backed cash flows as financeable. Repeated warehouse facilities, pension-backed credit, a first securitization, and enterprise case studies together make the company look commercially real rather than conceptual. The problem for underwriting is not absence of activity; it is absence of core corporate financial disclosure. Public sources do not reveal how much of customer gross savings Redaptive captures, what its blended cost of capital is, how much loss protection sits in warehouse or ABS structures, or whether corporate overhead and maintenance obligations consume most of the service-fee spread. The right financial stance is therefore cautious rather than dismissive: the model appears scalable and institutionally fundable, but the business remains capital-intensive, credit-exposed, and disclosure-light. Any investor should require management
    accounts, contract-cohort performance, customer concentration, realized gross-margin data, and securitization term sheets before treating the current capital stack as proof of durable free-cash-flow generation.'
