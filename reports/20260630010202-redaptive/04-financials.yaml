company:
  name: Redaptive Inc.
chapter:
  number: 4
  title: Financials
  summary: Redaptive runs a provider-financed Energy-as-a-Service model that converts customer energy upgrades into multi-year service payments tied to verified savings, but it does not disclose public revenue, gross margin, burn, or cash data. The capital stack is meaningful — at least a $125 million Deutsche Bank warehouse facility in 2023, a $225 million ATLAS SP warehouse in 2024, a $650 million CDPQ/Nuveen credit facility in 2025, and an inaugural approximately $216 million securitization backed by 1,445 leases to 46 obligors — which supports deployment scale but also confirms heavy dependence on external financing. Named customer programs show strong gross-savings outcomes and low upfront customer friction, yet underwriting remains blocked by opaque corporate financials, preliminary securitization disclosures, and unresolved customer-concentration and loss-history questions.
sections:
- id: revenue-model
  title: Revenue Model and Monetization Mechanics
  body: 'Redaptive''s public materials consistently describe a provider-financed Energy-as-a-Service structure rather than a conventional software subscription or equipment-sale model. The company funds project development, construction, equipment ownership, measurement infrastructure, and selected maintenance obligations, then recovers its capital through monthly service payments tied to verified avoided energy consumption or other measured performance outcomes. Official materials describe contract terms that typically run five to twenty years and emphasize off-balance-sheet or operating-expense treatment when true risk transfer is achieved. Public monetization is broader than the core service fee alone: by 2024 Redaptive had expanded into equipment financing products including leases, loans, short-term-rental conversions, and sale-leasebacks. What is missing is list pricing or realized price disclosure. The company explains how payments are structured, but it does not publish contract
    APRs, savings-share splits, hurdle rates, or weighted average service fees, so public analysis can explain the mechanism but cannot independently rebuild revenue or margin by contract cohort.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI023
