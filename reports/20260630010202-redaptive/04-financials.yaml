  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current unrestricted cash balance, monthly operating burn, and facility headroom by debt line.
    whyItMatters: Without cash and burn data, the public capital stack cannot be converted into runway or next-round timing.
    diligencePath: Request trailing 12-month monthly cash-flow statements plus a debt-availability schedule from management and lenders.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: provider-margin
    missingEvidence: Cohort-level gross margin, maintenance cost, incentive pass-through, and default / loss history.
    whyItMatters: Customer savings do not reveal whether Redaptive itself earns durable gross spread after retained risk costs.
    diligencePath: Request contract-cohort margin bridges and servicing performance by warehouse / ABS collateral vintage.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-obligor exposure, renewal rates, and overlap between corporate revenue and securitized collateral.
    whyItMatters: A small number of enterprise accounts could dominate cash generation even if the ABS pool itself looks diversified.
    diligencePath: Request top-10 customer concentration disclosures and obligor-level exposure tables for warehouse and ABS pools.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: debt-structure-terms
    missingEvidence: ABS note coupons, warehouse advance rates, reserve triggers, overcollateralization, and covenant package.
    whyItMatters: Facility headline size alone does not show whether Redaptive's cost of capital leaves enough spread after servicing and losses.
    diligencePath: Obtain warehouse agreements, securitization term sheets, servicing agreements, and any rating-agency presale report.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: minor
    topic: public-kpi-definitions
    missingEvidence: Reconciled KPI definitions for capital deployed, sites modernized, projects completed, and customer savings across Redaptive marketing materials.
    whyItMatters: Metric drift does not break the core thesis, but it weakens confidence in trend analysis and makes external benchmarking noisy.
    diligencePath: Request lender or board KPI definitions and a dated historical schedule that ties each public metric to a consistent denominator.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI005
