- id: unit-economics
  title: Unit Economics Proxies and Delivery Economics
  body: Redaptive provides unusually rich customer-outcome proxies even though it withholds company-level financial statements. Across named case studies, the company frames value through zero-upfront-capital deployment, preserved customer CapEx, multi-site rollouts, and ten-year gross energy-savings totals. Iron Mountain alone is presented as a 382-facility, decade-long program expected to produce $101.7 million of gross savings while preserving $45.9 million of customer capital; Berry Global, McKesson, Cintas, Saint-Gobain, and UniFirst are all presented as portfolio-scale programs with measurable savings, emissions reductions, and square footage deployed. These disclosures imply that Redaptive's GTM motion is oriented to large enterprise portfolios, which is reinforced by management's statement that programs generally start around 500,000 square feet. They also show that Redaptive's economic proof point is customer net benefit and budget predictability rather than disclosed provider margin.
    That matters because the same public materials confirm Redaptive retains construction, asset-performance, incentive-collection, and selected maintenance risk. The result is a model that can be commercially persuasive for customers while still leaving provider-side gross margin, loss provisioning, and financing-spread economics opaque.
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI029
