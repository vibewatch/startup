- id: TI005
  title: Public financial gaps table
  notes: Enumerates the highest-value diligence gaps that remain after reviewing official, news, filing, and market-data sources.
  columns:
  - Missing Metric or Document
  - Impact on Underwriting
  - Exact Diligence Path
  rows:
  - - Revenue by stream and cohort
    - Without stream-level revenue, investors cannot tell whether economics are driven by core EaaS, equipment financing, or one-off program effects
    - Request monthly revenue by contract cohort, product line, and customer vertical
  - - Gross margin / maintenance burden / defaults
    - Without gross margin and loss data, there is no view into how much retained performance risk Redaptive monetizes successfully
    - Request cohort margin bridge including maintenance, incentive, and default experience
  - - Cash balance, burn, and runway
    - No public cash or burn disclosure means the capital stack cannot be translated into runway
    - Request trailing 12-month monthly cash flow and unrestricted cash balance
  - - Customer concentration and obligor overlap
    - Case studies show enterprise scale, but public sources do not reveal how much revenue sits in the top five customers or overlaps the ABS obligor pool
    - Request top-10 customer revenue share and overlap with warehouse / ABS collateral
  - - ABS term economics
    - Public filings and rating releases omit coupon, advance rate, overcollateralization, and trigger details
    - Obtain offering memorandum, note terms, and servicing / reserve waterfall
  - - KPI definition pack
    - Official materials cite different capital-deployed and project-count metrics, making public KPI trend analysis unreliable
    - Request board or lender KPI definitions and a reconciled historical KPI schedule
