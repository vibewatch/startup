- id: TI003
  title: Unit economics table
  notes: Redaptive does not publish provider-side gross margin or CAC/payback. Public unit-economics evidence is therefore proxied through contract structure, minimum project size, and customer outcome disclosures.
  columns:
  - Metric
  - Value or Proxy
  - Confidence
  - Why It Matters
  - Diligence Ask
  rows:
  - - Typical contract tenor
    - 5-20 years
    - Medium
    - Long terms help amortize upfront capital and installation cost across service payments
    - Request weighted-average remaining contract life by cohort and by warehouse / ABS pool
  - - Minimum public program scale
    - Approximately 500,000 square feet
    - Medium
    - Implies enterprise-oriented sales motion and minimum deployment size for economics to work
    - Request distribution of project size, signed pipeline, and sales-cycle length
  - - Customer payment basis
    - Verified savings / measured output rather than equipment purchase
    - High
    - Shows revenue quality depends on measurement discipline and contract performance, not one-time sales
    - Request reconciliation between metered savings, invoiced fees, and cash collected
  - - Provider risk transfer
    - Construction, asset-performance, incentive-collection, and select maintenance risk remain with Redaptive
    - Medium
    - These retained obligations can compress margin if projects underperform
    - Request reserve policy, warranty loss history, and maintenance cost assumptions
  - - Named-customer savings proxy
    - Public case studies range from roughly $2M to $101.7M of 10-year gross savings
    - Medium
    - Shows the value proposition can be material enough to support service-fee capture at scale
    - Request Redaptive share of gross savings and realized gross profit by representative cohort
  - - Public CAC / payback disclosure
    - None
    - High
    - Absence of CAC and payback disclosure prevents direct underwriting of sales efficiency
    - Request fully loaded acquisition cost, payback period, and win-rate by vertical
