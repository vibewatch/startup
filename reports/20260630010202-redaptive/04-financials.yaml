  rows:
  - - Core EaaS service payments
    - Monthly service fee tied to verified avoided energy consumption or other measured performance output
    - USD per month per project or portfolio
    - Active; structured as provider-financed, pay-for-performance contracts
    - Medium — mechanism is well described, realized pricing is private
    - Obtain sample contracts showing savings-share formula, escalators, and termination terms
  - - Equipment financing products
    - Leases, loans, short-term rental conversions, and sale-leasebacks for new and used equipment
    - USD financing payment / lease payment
    - Active since 2024 expansion with ATLAS SP warehouse support
    - Medium — product set is public, take rate and pricing are private
    - Request product mix, credit losses, and realized yield by financing product
  - - Metering and data-enabled monitoring
    - Redaptive installs meters and uses platform reporting to validate savings and support ESG reporting
    - Embedded in service fee or bundled contract value
    - Commercially active, but no standalone pricing disclosed
    - Low — capability is public, monetization split is not
    - Clarify whether data platform revenue is separate, bundled, or a customer-acquisition tool
  - - Customer incentive capture / financing spread
    - Provider collects incentives and absorbs incentive-collection risk in its model
    - Embedded contract economics
    - Economically important but not disclosed as a line item
    - Low — inferred from contract mechanics, not broken out publicly
    - Request waterfall showing incentive value, provider spread, and customer pass-through
  - - ABS / warehouse-supported contract cash flows
    - Long-term customer payment streams are financed through warehouse lines and securitization structures
    - Contract receivable cash flows
    - Publicly evidenced by 2023-2025 facilities and 2025 ABS
    - Medium — financing path is public, realized asset yields are private
    - Obtain warehouse advance rates, covenant package, and securitization cash-flow waterfall
