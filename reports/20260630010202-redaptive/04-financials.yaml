callouts:
- calloutType: risk
  title: Public Underwriting Is Blocked by Missing Corporate Financials
  body: Despite abundant project and financing announcements, Redaptive does not publicly disclose revenue by stream, gross margin, EBITDA, cash balance, or burn rate. The capital stack cannot be translated into runway or return on capital without management accounts and lender materials.
  claimRefs:
  - CI025
  - CI026
  - CI027
- calloutType: risk
  title: ABS Disclosure Reveals Real Diversification but Also Real Concentration
  body: The 2025 ABS pool spans 46 obligors, yet the top three states still represent 43.2 percent of securitization value and roughly half of payments are performance-adjusted. That combination means counterparty, measurement, and asset-performance discipline remain first-order credit risks.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI037
- calloutType: strength
  title: Institutional Capital Providers Continue to Re-Up
  body: Warehouse lenders, pension-backed credit investors, and a first securitization all indicate that sophisticated counterparties view Redaptive’s contract cash flows as financeable. That does not prove equity-like returns, but it does de-risk the question of whether external capital is available at all.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI022
- calloutType: recommendation
  title: Request Cohort-Level Contract Economics Before Any New Capital
  body: 'The next diligence step should be a contract-cohort data room: monthly cash collections, default history, maintenance burden, customer concentration, warehouse availability, ABS triggers, and realized gross margin by product. Without that package, public evidence only proves deployment scale and financing access, not durable free-cash-flow economics.'
  claimRefs:
  - CI026
  - CI027
  - CI037
  - CI038
  - CI039
