- id: TI001
  title: Revenue streams table
  notes: Enumerates the revenue mechanisms visible from public materials only. Realized pricing, gross margin, and stream-level contribution are not publicly disclosed.
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current Value or Status
  - Quality
