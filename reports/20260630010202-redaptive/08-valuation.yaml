- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Redaptive (subject)
    - Last visible equity mark and later financing context
    - $1B post-money as of Dec. 19, 2022 per Tracxn; later public financings were warehouse debt, a $650M
      credit facility, and a $216M ABS rather than a new disclosed priced round.
    - Shows that public price discovery is stale while debt capacity has expanded.
    - No public 2025-2026 common-equity mark exists to confirm whether the unicorn valuation still holds.
  - - Ameresco
    - June 2026 market cap / 2025 revenue
    - $1.40B market cap / $1.932B revenue ≈ 0.7x trailing revenue.
    - Best public analogue for project-heavy energy efficiency and infrastructure modernization.
    - More mature, public, and diversified than Redaptive.
  - - Stem
    - June 2026 market cap / FY2025 revenue
    - $66.99M market cap / $156.3M revenue ≈ 0.4x trailing revenue.
    - Useful cautionary comp for a clean-energy platform that pivoted hard after hardware and booking
      stress.
    - Distressed trading likely understates a healthy software-heavy platform.
  - - Fluence Energy
    - June 2026 market cap / FY2025 revenue and FY2026 midpoint guidance
    - $3.52B market cap / $2.3B FY2025 revenue ≈ 1.5x trailing revenue; about 1.0x on $3.4B FY2026 midpoint
      guidance.
    - Shows what a scaled, backlog-backed energy-infrastructure platform with software can command in
      public markets.
    - Storage hardware and global utility exposure differ from Redaptive’s retrofit-finance model.
  - - Energy Vault
    - June 2026 market cap / FY2025 revenue and FY2026 guidance
    - $0.80B market cap / $203.7M FY2025 revenue ≈ 3.9x trailing revenue; about 2.7x-3.6x on FY2026 guidance.
    - Upper-end public multiple for an energy-storage infrastructure story still using project finance
      and recurring asset strategies.
    - Business mix now includes AI infrastructure and owned assets, so direct comparability is imperfect.
  notes: The subject row intentionally emphasizes stale equity marking and later structured financings
    rather than pretending a fresh public multiple exists.
