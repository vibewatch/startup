  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-equity-mark
    missingEvidence: A current priced equity round, secondary transaction summary, or board-approved 409A
      range showing how common equity is marked after the 2025 debt and ABS financings.
    whyItMatters: Without a fresh equity benchmark, investors are anchoring to a stale 2022 unicorn mark
      while the capital structure has evolved materially.
    diligencePath: Request current financing memo, board materials, and latest internal valuation range
      under NDA.
    relatedQuestionRefs:
    - QV002
    - QV019
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-denominator
    missingEvidence: Audited 2025 and year-to-date 2026 revenue, gross margin, EBITDA, and cash-flow data.
    whyItMatters: The public record offers conflicting third-party revenue estimates, so any implied multiple
      or scenario range remains fragile without management-grade financials.
    diligencePath: Obtain audited financial statements plus a bridge from reported revenue to contract
      backlog and cash conversion.
    relatedQuestionRefs:
    - QV009
    - QV020
    - QV021
    - QV025
  - type: private-evidence-only
    severity: material
    topic: structured-finance-terms
    missingEvidence: ABS and warehouse term sheets, advance rates, credit-enhancement levels, delinquency
      data, and final rating outcome.
    whyItMatters: Structured finance is now central to the valuation story; weak terms or weak performance
      would directly cut equity value and financing flexibility.
    diligencePath: Review lender presentation, Kroll package, and portfolio-performance tape with the
      capital-markets team.
    relatedQuestionRefs:
    - QV005
    - QV018
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-preferences
    missingEvidence: Preference stack, anti-dilution protections, warrants, and rights attached to recent
      capital providers.
    whyItMatters: A headline valuation can still produce poor common-equity outcomes if liquidation rights
      and dilution economics are unfavorable.
    diligencePath: Request cap-table model and governing documents from counsel and finance before discussing
      price.
    relatedQuestionRefs:
    - QV019
    - QV030
    relatedTableRefs:
    - TV006
