- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - thesis
  - what would change the view
  rows:
  - - Contract-finance innovation
    - Redaptive has shown it can raise warehouse, credit-facility, and ABS capital against operating contracts.
    - A public disclosure of rating results, loss history, and advance rates would make this financing
      edge more durable and easier to value.
  - - Customer proof
    - Large customer examples including McKesson, Iron Mountain, and UniFirst show real enterprise deployment
      rather than pilot-only activity.
    - Retention, renewal, and concentration data would convert proof-of-use into proof-of-value.
  - - Strategic validation
    - Honeywell’s investment and planned internal deployment suggest industrial partners find the platform
      relevant.
    - A disclosed valuation benchmark or follow-on strategic round would materially strengthen price support.
  - - 'Anti-thesis: denominator risk'
    - Public revenue estimates conflict, and none is company-audited.
    - Audited revenue, margin, and cash-flow disclosure could close the denominator gap quickly.
  - - 'Anti-thesis: public comp pressure'
    - Transparent public energy-infrastructure and clean-energy software names trade on much lower revenue
      multiples.
    - The premium becomes more defensible only if private diligence shows Redaptive has better economics
      than the public set.
  notes: The anti-thesis is not that Redaptive lacks demand; it is that the public record does not yet
    prove the equity deserves a premium multiple.
