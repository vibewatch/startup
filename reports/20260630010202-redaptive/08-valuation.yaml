- id: comparables-and-price-discipline
  title: Comparable Multiples and Price Discipline
  body: Transparent public comparables impose discipline on any attempt to defend Redaptive’s implied
    multiple. Ameresco is the cleanest project-and-efficiency analogue and trades at roughly 0.7x trailing
    revenue using its June 2026 market cap and 2025 reported revenue. Stem trades at about 0.4x trailing
    revenue after an extended collapse in battery-hardware economics and bookings. Fluence, which has
    more software and a larger backlog-backed storage platform, trades at roughly 1.5x trailing revenue
    and about 1.0x on fiscal 2026 midpoint guidance. Energy Vault screens richest at roughly 3.9x trailing
    revenue and about 2.7x to 3.6x on 2026 guidance, but even that multiple sits well below the 10x to
    15x range implied if Redaptive’s last public $1B mark is compared with the only public revenue estimates
    currently available. The right conclusion is not that Redaptive must be worth less than $1B. It is
    that any valuation at or above that mark requires private evidence showing revenue, gross margin,
    contract durability, and balance-sheet quality that are materially better than what public comparables
    and public vendor estimates presently suggest.
  claimRefs:
