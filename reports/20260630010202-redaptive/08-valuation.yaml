- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Public or private revenue confirmation disappoints
    - Current annual revenue proves closer to low public estimates than to a materially higher private
      figure.
    - The historical $1B mark looks stretched relative to public comp multiples.
    - Re-cut valuation to public-comp ranges and avoid premium entry pricing.
  - - ABS/rating underperforms expectations
    - Final ratings, spreads, or loss performance are materially weaker than management narrative implies.
    - Contract-finance advantage becomes less durable and less scalable.
    - Move from research-more/track to avoid until financing economics are re-underwritten.
  - - Dilutive equity financing appears
    - Company raises common equity below the 2022 unicorn mark or with heavy preference terms.
    - Fresh price discovery would reset the benchmark downward.
    - Treat as a thesis break unless dilution also buys unusually strong growth visibility.
  - - Customer concentration or renewals weaken
    - Large customer cohorts show non-renewal, repricing pressure, or heavy concentration.
    - Customer proof stops translating into durable enterprise value.
    - Re-rate revenue quality and narrow any bull-case range.
  - - Public comparable compression resumes
    - High-end public energy-infrastructure multiples fall materially below today’s range.
    - Even strong execution may not support premium private pricing.
    - Require a larger discount to the 2022 mark before engaging.
  notes: The triggers focus on measurable valuation transmission rather than on general macro fear.
