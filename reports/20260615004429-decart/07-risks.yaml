      - TR001

  - id: operational-model
    title: Operational, Model Quality, and Security Risks
    body: >
      Decart's operational risk is dominated by the fundamental architectural limitations of its autoregressive world
      models and its deep dependency on AWS infrastructure. On model quality: TechCrunch's independent June 2026 test
      of Oasis 3 documented three distinct failure modes — (1) thematic coherence degradation within minutes as the
      context window fills; (2) physics-consistency failures where vehicles pass through other vehicles because the
      model lacks proper collision simulation; and (3) control responsiveness issues preventing precise navigation.
      CEO Leitersdorf acknowledged all three as ongoing research problems, attributing the context degradation to the
      fact that generating video at 30fps consumes ~8,000 tokens per frame and fills context windows very rapidly at
      hundreds of thousands of tokens per second. The company is researching longer-context and memory-compression
      techniques. For AV customers, physics failures are not cosmetic — they mean synthetic training data may contain
      physically invalid scenarios that could degrade downstream model behavior. This creates a direct training-data
      quality risk for Decart's target AV market. On infrastructure: Decart's Lucy model runs on AWS Trainium3 and is
      distributed via Amazon Bedrock, creating a concentrated single-cloud dependency. A sustained AWS outage would
      halt all inference operations. The Trainium3 hardware is newly announced and limited in broader availability,
      creating hardware-sourcing risk during scale-up. On security: as a platform generating real-time video from
      customer-supplied prompts, Decart faces prompt injection risks, jailbreak risk for AUP-prohibited content
      (deepfakes, CSAM, weapons synthesis), and API key compromise risk. The AUP (February 2026) addresses prohibited
      uses but independent audit of content moderation effectiveness has not been identified.
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
    tableRefs:
      - TR002
    figureRefs:
      - FR002

  - id: partner-dependency
    title: Partner, Dependency, and Customer Concentration Risks
    body: >
      Decart's go-to-market and infrastructure strategy creates layered concentration risks. The most material single
      dependency is AWS/Amazon: Decart's Lucy model runs on AWS Trainium3, models are distributed via Amazon Bedrock,
      and Amazon itself is listed as a strategic customer — creating a three-way concentration where Amazon is
      simultaneously cloud provider, distribution channel, and revenue source. If Amazon develops competing
      internal world-model capabilities (plausible given their AWS AI infrastructure investment) or reduces
      Bedrock shelf-space for third-party models, Decart's distribution channel collapses at the same time as its
      infrastructure. Similarly, Nvidia is both Decart's primary alternative compute supplier and an equity investor
      (Nvidia participated in both the $100M Series B and the $300M Series C). A material Nvidia relationship dispute
      or competitive pivot would simultaneously affect Decart's hardware roadmap and its cap table optics. Customer
      concentration is amplified by the investor/customer overlap: Toyota Ventures, Adobe Ventures, and eBay Ventures
      are equity investors whose parent companies are also listed as strategic customers. This arrangement is positive
      for signal quality but creates adverse incentive dynamics — a customer churning from the platform while holding
      equity sends a particularly damaging market signal. Startupfortune (June 2026) noted that Decart's real market
      is the "dozens of AV programs, robotics labs, and drone startups" below the Waymo/Tesla/Nvidia tier — meaning
      its monetizable customer base is smaller, less well-capitalized, and less strategically sticky than the
      strategic investor/customers. The developer community (100,000+ registered) is large but API revenue at
      $0.02/second is highly volume-dependent and the revenue per developer at typical usage patterns is uncertain.
    claimRefs:
      - CR022
      - CR023
      - CR024
      - CR025
      - CR026
      - CR027
    tableRefs:
      - TR003
    figureRefs:
      - FR003

  - id: people-execution
    title: People, Execution, and Financing Risks
    body: >
      Decart's execution risks center on key-person dependency, geopolitical exposure, and the financing gap between
      its $4 billion valuation and publicly disclosed revenue metrics. Dean Leitersdorf (CEO, 27 years old) has been
      the primary public face, fundraiser, and technical narrative driver for every round from seed to Series C.
      His departure would simultaneously create a fundraising, technical credibility, and media-narrative gap at a
      critical scale-up phase. The company's leadership team outside the two co-founders is not publicly documented
      in depth, with Dr. Kfir Aberman (formerly Snap and Google, co-creator of DreamBooth) being the most senior
      publicly named hire as head of the SF R&D center. This creates execution risk in the event of any co-founder or
      Aberman departure. The Israeli operational HQ creates geopolitical risk: a sustained escalation in the
      Israel-Gaza conflict or broader regional instability would affect the Tel Aviv engineering team's ability to
      operate, access visas for global travel, and maintain relationships with risk-sensitive enterprise customers.
      Several large enterprises (particularly in defense-adjacent sectors) have procurement policies against
      vendors in active conflict zones. Financing risk: Decart has raised $450M+ but claims lifetime burn of "less
      than $100M" (CEO, June 2026). Even if this is accurate, the burn rate will accelerate significantly as the
      company scales AV/physical-AI simulation infrastructure, expands headcount from 60+ employees, and builds out
      enterprise sales capacity. At the $4 billion valuation, the next round would need to be at $5–6 billion or
      higher to avoid a flat/down round, which requires demonstrable revenue traction that is not yet publicly
      evidenced.
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
    tableRefs:
      - TR004

  - id: mitigation-diligence
    title: Mitigations, Kill Criteria, and Diligence Asks
    body: >
      Decart has taken meaningful but incomplete steps to mitigate its top risks. Regulatory: the AUP (February
      2026) explicitly references EU AI Act, DSA, and DMCA; this demonstrates regulatory awareness but is not
      a substitute for training-data transparency obligations or a licensing framework. Technical: the CEO has
      publicly acknowledged physics-consistency and context-window limitations and stated active research
      programs; the next model version is expected to address video-seeded world generation, which may improve
      consistency. Infrastructure: the AWS Trainium3 deal provides performance efficiency but increases AWS
      lock-in; no public multi-cloud fallback has been identified. People: the SF R&D center hire of Dr. Kfir
      Aberman represents geographic and talent diversification but does not resolve co-founder concentration.
      The mitigation and kill-criteria table (TR005) maps each major risk to monitorable triggers and
      investment-thesis implications. Diligence asks prioritized by urgency: (1) training-data licensing
      agreements — the single most material unresolved item for EU market access; (2) independent security
      and content-moderation audit; (3) AV customer physics-accuracy acceptance criteria — whether Decart's
      physics simulation meets safety-case requirements for any AV company; (4) revenue composition by
      product line and customer — DOS licensing vs. Lucy API vs. Oasis 3 enterprise; (5) retention metrics
      for e-commerce and gaming customers using Lucy.
    claimRefs:
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
    tableRefs:
      - TR005

