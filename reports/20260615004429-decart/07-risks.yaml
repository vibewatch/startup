company:
  name: Decart
chapter:
  number: 7
  title: Risks
  summary: >
    Decart's risk profile is dominated by four themes: (1) copyright and training-data exposure under evolving EU and
    US frameworks that could impose retroactive liability for AI training on unlicensed content; (2) model reliability
    and physics-consistency limitations that reviewers have already documented in Oasis 3, creating customer-facing
    quality risk; (3) critical infrastructure concentration — AWS Trainium3, Amazon Bedrock distribution, and Nvidia as
    both hardware supplier and investor create correlated single-vendor exposure; and (4) customer and investor overlap
    (Toyota, Adobe, eBay are both strategic investors and paying customers), creating conflict-of-interest and
    concentration dynamics that are atypical for a $4 billion company with under $450 million raised. At $4 billion
    valuation with opaque financials, thesis-break risk is high if regulatory enforcement, competitive displacement,
    or customer concentration materializes.

sections:
  - id: risk-overview
    title: Risk Overview and Severity Framework
    body: >
      Decart faces a multi-layered risk stack that is elevated relative to its $4 billion valuation and early revenue
      stage. The company operates at the intersection of three high-risk regulatory zones: generative AI copyright law
      (training-data liability), the EU AI Act (real-time AI systems), and US state-level AI governance frameworks that
      are accelerating in 2026. On top of the regulatory overhang, the company's core technology — autoregressive
      world models — has documented reliability limitations that are fundamental to the architecture and not cosmetic:
      TechCrunch's independent review of Oasis 3 (June 2026) found physics-consistency failures and context-window
      degradation within minutes of generation, issues the CEO acknowledged as ongoing research problems. Operationally,
      Decart's concentration in AWS Trainium3 infrastructure and its go-to-market dependence on Amazon Bedrock creates
      a single-throat-to-choke failure mode at the infrastructure layer. Competitively, Google DeepMind (Genie 3),
      Waymo (internal world model on Genie 3), Runway ($5.3B, $315M Series E, Feb 2026), and Luma AI ($900M Series C)
      are all advancing with significantly more resources or defensible strategic positions. The risk heatmap (FR001)
      plots these themes by likelihood and residual impact after reported mitigations. The most concentrated risks —
      copyright liability and competitive displacement — are in the high-likelihood, high-impact quadrant.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
    figureRefs:
      - FR001

  - id: regulatory-legal
    title: Regulatory, Legal, and IP Risks
    body: >
      Training-data copyright is Decart's most structurally ambiguous legal risk. The EU Parliament's Legal Affairs
      Committee published its report "Copyright and Generative AI — Opportunities and Challenges" (February 2026,
      17-3 vote) calling for a rebuttable presumption that any GenAI model placed on the EU market has used
      copyrighted works for training unless full transparency obligations are met. This presumption — if enacted into
      EU law — would reverse the burden of proof onto Decart, and a 5–7% flat-rate turnover fee was proposed for
      retroactive licensing pending a formal framework. Separately, the US Copyright Office's ongoing AI rulemaking
      (Part 3 of its AI Report) is developing guidance on licensing frameworks for AI training; the Office has not
      yet issued binding rules but its guidance shapes litigation posture and future statutory risk. Osborne Clarke's
      February 2026 legal analysis describes the EU situation as a "watershed moment" where existing opt-out systems
      are insufficient and new frameworks are likely binding on non-EU AI providers serving EU markets (market-of-
      destination principle). The 2025 Trump Executive Order on AI (December 2025) signals federal intent to
      preempt state AI regulation in the US but does not eliminate risk — Gunder LLP's 2026 AI laws update notes
      that states like Colorado and California have enacted comprehensive AI governance statutes that continue to
      operate and are already shaping vendor contracting. Decart's AUP (updated February 2026) explicitly acknowledges
      the EU AI Act, DSA, and DMCA as governing frameworks, and prohibits use in military/weapons, real-time
      biometric surveillance, and social scoring contexts. No public IP litigation against Decart has been identified
      as of June 2026, but the absence of lawsuits does not confirm training-data licensing compliance. The diligence
      ask is a full training-data provenance audit with licensing agreements for any copyright-protected sources.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR045
      - CR046
