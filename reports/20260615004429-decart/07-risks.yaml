callouts:
  - calloutType: risk
    title: Physics-Consistency Failure — AV Market Blocking Risk
    body: >
      TechCrunch's June 2026 review of Oasis 3 documented vehicles passing through each other and loss of navigational
      control — physics failures the CEO described as an active research problem. For autonomous vehicle customers,
      synthetic training data that violates physical laws could degrade real-world model behavior, creating both a
      product liability risk and an adoption barrier. Until Decart demonstrates physics-accurate simulation meeting
      AV industry acceptance criteria, the physical AI revenue thesis is unproven.
    claimRefs:
      - CR015
      - CR016
  - calloutType: risk
    title: EU Copyright Rebuttable Presumption — Retroactive Liability
    body: >
      The EU Parliament's Legal Affairs Committee voted 17-3 (February 2026) to propose a rebuttable presumption
      that any GenAI model placed on the EU market has used copyrighted works for training unless full transparency
      is demonstrated. A proposed 5–7% flat-rate turnover fee for past uses is under discussion. If enacted, this
      framework would shift the burden of proof to Decart and create retroactive liability exposure. Decart's
      training-data provenance has not been publicly disclosed.
    claimRefs:
      - CR007
      - CR008

