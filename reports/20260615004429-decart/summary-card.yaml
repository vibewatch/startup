  topStrengths:
    - >-
      Real-time world-model stack spans product and infrastructure, with DOS giving Decart a credible cost/latency
      differentiation story.
    - >-
      Strategic backing from Radical, Nvidia, Sequoia, Benchmark, and customer-linked investors increases distribution
      odds beyond a typical early AI startup.
    - >-
      AWS/Trainium and Amazon strategic-customer signals provide unusually strong enterprise-platform validation for a
      company this young.
    - >-
      Product surface already reaches multiple monetization lanes: interactive video, gaming/media tooling, and
      physical-AI simulation.
  topRisks:
    - >-
      No public revenue, ARR, gross-margin, or customer-count disclosure exists to anchor a $4 billion valuation on
      fundamentals.
    - >-
      Oasis 3 still shows physics and coherence limitations that could block the highest-value AV and robotics use
      cases.
    - >-
      Named customer proof is thin, with Amazon the only clearly disclosed strategic customer and most enterprise demand
      still described at cohort level.
    - >-
      Copyright and EU AI/copyright regulation exposure could become expensive before Decart discloses enough scale to
      absorb it comfortably.
    - >-
      Competitors such as Runway, World Labs, and Google DeepMind have comparable or greater resources and are moving
      into similar world-model territory.
  unresolvedGaps:
    - Audited revenue, ARR, burn, and gross-margin disclosure.
    - Customer count, retention, concentration, and contract-duration detail.
    - Evidence of paid production adoption in autonomous-vehicle or broader physical-AI simulation.
    - Full board composition, cap-table ownership, preferences, and investor governance rights.
    - Current 2026 headcount and organizational build-out outside the founders and San Francisco R&D lead.
