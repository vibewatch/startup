  evidenceGaps:
    - type: private-evidence-only
      severity: minor
      topic: competitor developer community
      missingEvidence: >-
        Public data on the number of active API developers or users for Runway, World Labs, and Luma AI
        world-model products in 2026, comparable to Decart's self-reported 100K+ developer count on Lucy.
      whyItMatters: >-
        Without comparative developer-community size data, the relative stickiness of Decart's developer
        ecosystem advantage versus competitors cannot be assessed quantitatively, making the moat durability
        argument harder to underwrite.
      diligencePath: >-
        Request developer account counts and monthly active developer metrics from Decart under NDA;
        review Runway and World Labs API launch materials and community announcements for any disclosed
        developer numbers; interview developer-relations staff at each company.
      relatedQuestionRefs:
        - QP016

    - type: missing-source
      missingEvidence: >-
        Independent third-party benchmark comparing Decart DOS inference cost and speed vs Runway, World Labs,
        and standard GPU-cloud inference for equivalent world-model workloads in 2026.
      whyItMatters: >-
        The CEO's "100x cost efficiency" and "8x faster" claims are unaudited and company-sourced. Without
        independent benchmarks, the cost moat cannot be verified and competitors could match it without
        Decart's disclosure.
      diligencePath: >-
        Commission independent inference benchmarking firm (e.g., MLCommons, Epoch AI) to run
        apples-to-apples generation cost comparisons across Decart, Runway, and standard GPU APIs on the
        same video/world-model prompts; request Decart's internal cost data under NDA.
      relatedQuestionRefs:
        - QP006

    - type: private-evidence-only
      severity: material
      topic: competitor pricing
      missingEvidence: >-
        Public per-second or per-generation pricing for Runway, World Labs, and Luma AI for world-model
        API workloads comparable to Decart's $0.02/sec Oasis 3 pricing.
      whyItMatters: >-
        Without competitor API pricing, the pricing comparison table relies on Decart's self-reported
        pricing as the only data point; a large price difference in either direction would materially
        change the competitive value proposition.
      diligencePath: >-
        Request Runway and Luma AI enterprise pricing sheets or pilot quotes; interview customers who
        have evaluated both Decart and Runway for comparable creative or simulation workloads.
      relatedQuestionRefs:
        - QP002

    - type: missing-source
      severity: minor
      topic: AV synthetic data acceptance
      missingEvidence: >-
        Regulatory or industry-standards guidance specifically addressing whether autonomous vehicle
        training miles generated by world models (such as Oasis 3) are accepted as evidence of
        safety coverage by NHTSA, UNECE, or comparable bodies in 2026.
      whyItMatters: >-
        If safety regulators do not accept Oasis 3-generated scenarios as evidence of real-world
        edge-case coverage, the regulatory-approval pathway for AV programs using synthetic training
        data is unclear, reducing the revenue potential of Decart's Oasis strategy.
      diligencePath: >-
        Review NHTSA Automated Vehicles Policy 2026 update; search UNECE WP.29 for synthetic data
        guidance; interview AV company regulatory leads on their position on world-model-generated miles.
      relatedQuestionRefs:
        - QP019
