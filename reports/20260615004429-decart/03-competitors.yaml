  - calloutType: insight
    title: Decart's real-time latency edge is real but research-only rivals can close it
    body: >-
      As of mid-2026, Decart is the only vendor offering sub-30ms interactive world-model generation
      through a public API. Google DeepMind's Genie 3 matches or exceeds Decart's capability in research
      settings but is not yet a commercial product — a window that is likely months, not years.
    claimRefs:
      - CP003
      - CP006
      - CP032
  - calloutType: risk
    title: Physics-consistency failures in Oasis 3 are a material adoption barrier for AV companies
    body: >-
      TechCrunch's independent June 2026 test found that Oasis 3 cars drive through each other and
      environments degrade over long sessions. These are fundamental auto-regressive architecture
      challenges the CEO acknowledged. Until resolved, safety-critical AV training use cases face
      data-quality risk.
    claimRefs:
      - CP013
      - CP014
      - CP022
      - CP023
  - calloutType: strength
    title: Developer API flywheel mirrors OpenAI's LLM strategy
    body: >-
      Decart's $0.02/sec Oasis 3 public API replicates the developer-ecosystem play that made OpenAI's
      text API sticky. With 100K+ developers already on Lucy, the platform has demonstrated ability
      to build a bottom-up developer community before incumbents ship competing APIs.
    claimRefs:
      - CP009
      - CP010
      - CP028
