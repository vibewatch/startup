  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - moat claim
      - threat
      - severity
      - mitigation / diligence ask
    rows:
      - - Decart has unique real-time latency (<30ms) with no commercial peer as of mid-2026
        - Google DeepMind Genie 3 could launch a commercial API; NVIDIA DRIVE Sim already runs at near-real-time in controlled AV environments
        - high
        - Monitor Genie 3 commercial roadmap; compare Oasis 3 latency benchmark against any new commercial releases in H2 2026
      - - DOS cost stack gives Decart 100x efficiency claim vs comparable systems
        - Runway, World Labs, and Luma AI have raised hundreds of millions for compute scaling; cloud providers may commoditize inference efficiency with standard kernels
        - medium
        - Request independent benchmark proof for the 100x claim; assess whether DOS efficiency derives from hardware co-design or model architecture choices that can be replicated
      - - 100K+ developer community creates API stickiness before incumbents ship
        - Genie 3 has Google Developers ecosystem; Runway and World Labs have existing creative communities; switching cost is low if API contracts are not long-term
        - medium
        - Assess developer retention and reactivation rates; understand contract duration and average API spend per developer
      - - AWS distribution via Bedrock and Trainium3 partnership gives Decart enterprise reach
        - AWS Bedrock is multi-vendor; Amazon will offer competing models in the same marketplace; distribution advantage evaporates if a competing world model lands on Bedrock
        - medium
        - Review AWS exclusivity terms and co-sell commitment; assess whether Toyota, Adobe, eBay investor/customer relationships create diversified distribution beyond AWS
      - - Oasis 3 is only production API for photorealistic multi-camera driving simulation at retail price
        - Physics consistency failures (rigid-body, entity collision) reduce AV company confidence; Waymo's Genie 3 internal use sets precedent for top-tier AV programs building in-house
        - high
        - Obtain AV company pilot evidence that generated scenarios actually transfer to real driving improvements; assess timeline to physics-consistency fixes the CEO acknowledged in June 2026
    notes: >-
      Severity ratings are ordinal judgments based on reviewed evidence, not formal risk scores.
      The register focuses on factors most likely to affect competitive durability within 3–5 years.
