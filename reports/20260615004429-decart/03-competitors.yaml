  - id: section-2
    title: 'Competitor profiles: Runway, World Labs, DeepMind/Genie 3, Luma AI, Inworld, and Rosebud'
    body: >-
      Runway raised $315 million in a Series E in February 2026, nearly doubling its valuation to $5.3 billion.
      The company is best known for physics-aware video generation (Gen 4.5) and is explicitly pre-training
      the "next generation of world models" for products and industries beyond media. Runway already has
      partnerships with Adobe and is expanding into gaming and robotics, making it the most direct frontier
      peer to Decart's Lucy model in creative and media workflows. It has a CoreWeave compute partnership
      and a team of approximately 140 people in February 2026.


      World Labs raised $1 billion in February 2026, including $200 million from Autodesk, at a valuation
      reportedly targeting $5 billion. Founded by Fei-Fei Li, its Marble product generates editable,
      downloadable 3D environments from images, video, or text. The Autodesk partnership focuses on media
      and entertainment use cases initially and positions World Labs as the closest spatial-AI peer to
      Decart's Oasis world for 3D content creation workflows, though not for real-time driving simulation.


      Google DeepMind's Genie 3, released in research preview in August 2025, generates interactive worlds
      at 24 fps and 720p, supports promptable world events, and already powers Waymo's internal simulation
      architecture. It is not available as a public commercial API, which gives Decart a temporal window
      before Google potentially monetizes this capability externally.


      Luma AI raised $900 million in November 2025 with a 2-gigawatt AI supercluster partnership in Saudi
      Arabia. It is primarily known for Dream Machine and video generation, with world models as a stated
      future direction. Inworld AI pivoted to realtime voice AI for consumer companion apps, achieving
      1 million users in 19 days on a $500 million valuation, and is no longer a direct simulation
      competitor. Rosebud AI focuses on text-to-3D-game creation and represents a development-tooling
      substitute rather than an inference-infrastructure competitor.
