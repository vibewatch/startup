chapter:
  number: 6
  title: Customers
  summary: Public evidence supports Decart selling into a mix of hyperscalers, AI labs, enterprise media or commerce workflows, and a broad self-serve developer base, with Amazon standing out as the only clearly named strategic customer. The commercial surface is real—public pricing, try-on and SDK examples, GitHub repos, and repeated AWS distribution references—but disclosure is still thin on exact customer counts, retention, revenue concentration, and the breadth of named production deployments.
sections:
- id: segment-map
  title: Customer segments and buyer map
  body: The fetched sources point to a multi-layer customer base rather than a single wedge. At the top end, Decart sells infrastructure and model capacity to cloud providers, AI labs, and hyperscale buyers through DOS and partnership-driven distribution. The $300 million company publication and CTech coverage both frame Amazon as a strategic customer, while also saying Decart is already generating revenue from contracts with large cloud providers and AI laboratories. A second layer is enterprise application buyers in commerce, media, streaming, and advertising, where Lucy supports virtual try-on, livestreaming effects, and dynamic content workflows. A third layer is physical-AI developers and AV teams using Oasis 3 for camera-first simulation. Finally, a self-serve developer community sits underneath the enterprise motion, supported by public docs, pricing, SDKs, examples, and GitHub repositories. That mix is promising because it diversifies product surfaces, but the public record still
    leaves open which layer contributes most of current revenue.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU011
  - CU012
  - CU027
  - CU031
  - CU034
  - CU039
