- id: public-proof
  title: Public customer proof and ecosystem evidence
  body: 'The strongest named proof is Amazon. Multiple fetched sources—Decart’s own publication, CTech, and JNS—say Amazon joined as a strategic customer as part of the 2026 financing and partnership ecosystem. That signal is stronger than a generic integration because it is repeated across company and independent reporting and linked to concrete Bedrock or Trainium distribution language. Beyond Amazon, the evidence base becomes more cohort-level than logo-level. The company and third-party sources describe revenue from large cloud providers, AI labs, hyperscalers, and deployments across commerce, streaming, social, gaming, and physical-AI scenarios, but they do not publish a comparable list of named production customers. Developer-facing proof is much richer: the GitHub organization, Python SDK, Quest XR project, try-on guides, and AWS partner articles all show how users can actually adopt the product. That split matters for diligence because it suggests strong top-of-funnel and ecosystem
    credibility, but thinner public proof on enterprise breadth than the headline funding round might imply.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU012
  - CU013
  - CU019
