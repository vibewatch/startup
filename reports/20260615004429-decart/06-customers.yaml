- id: adoption-and-onboarding
  title: Adoption signals and self-serve onboarding
  body: Decart’s customer acquisition strategy appears to rely heavily on a developer-first front door. The pricing page exposes self-serve rates, the try-on walkthrough shows how a merchant would integrate live try-on into a product page, the GitHub organization exposes SDKs and reference implementations, and partner coverage repeatedly says Bedrock distribution lowers integration friction for AWS-native teams. This matters because the company is trying to turn realtime AI from a bespoke enterprise sale into an accessible API motion. TechCrunch reports a community of more than 100,000 developers, many building on Lucy in e-commerce and livestreaming, and the public try-on repo count provides a smaller but more concrete artifact-level proof of onboarding effort. However, the public surface still stops short of true funnel transparency. There is no disclosed conversion rate from registered developers to paying accounts, no named list of production merchants using try-on, and no public churn
    or renewal metric that would demonstrate durable monetization from the developer base.
  claimRefs:
  - CU005
  - CU006
