- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - Bedrock and AWS channel distribution
    - Amazon may account for outsized strategic leverage or customer access
    - Could accelerate growth but compress negotiating leverage and pricing independence
    - Request revenue split by direct sales, AWS-channel sales, and top-customer concentration
  - - Self-serve developer adoption
    - Large registered community may convert weakly into durable paid usage
    - Could create top-of-funnel excitement without equivalent retention economics
    - Request cohort conversion from signup to paid usage and repeat spend by use case
  - - Physical-AI simulation wedge
    - Large incumbents can internalize simulation stacks or demand richer modalities
    - Could limit Decart to experimentation budgets instead of core-stack standardization
    - Request named pilots, renewal evidence, and modality roadmap beyond RGB camera output
  - - Broad vertical marketing story
    - Public named-logo disclosure lags the breadth of industries cited
    - Could signal that a few infrastructure buyers dominate while long-tail vertical adoption remains early
    - Request named references in commerce, streaming, gaming, robotics, and AI labs
  notes: Risks are derived from the gap between visible onboarding assets and the much thinner public disclosure on revenue concentration and retention.
