- id: durability-and-concentration
  title: Retention, concentration, and adverse disclosure gaps
  body: 'The main customer risk is not a lack of surface-level activity; it is the narrowness of public disclosure. Amazon is the only clearly named strategic customer across the fetched sources, while the rest of the commercial story depends on broad but unnamed categories such as cloud providers, AI labs, hyperscalers, commerce deployments, and developers. That raises a concentration question: if a meaningful share of near-term revenue depends on a small number of infrastructure customers or on Amazon-linked distribution, downside could be sharper than the company’s diversified marketing story suggests. The other gap is durability. None of the fetched sources publish NRR, GRR, churn, contract length, or even an exact active customer count. Public pricing and example repos make onboarding legible, but they do not prove repeat spend or enterprise standardization. Startup Fortune is the clearest skeptical source because it frames Oasis 3 as a bet on renting simulation before larger incumbents
    internalize the capability and notes current modality limitations versus more mature internal stacks.'
