- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer/User/Payer
  - Use Case
  - Scale
  - Revenue/Strategic Value
  - Gap
  rows:
  - - Cloud providers and hyperscalers
    - Infrastructure buyers, platform teams, model groups
    - License DOS, accelerate inference, and distribute Decart models
    - Company cites contracts with several large providers but does not name most of them
    - Potentially high ACV and strategic distribution leverage
    - Public sources do not show customer count, contract duration, or revenue share by provider
  - - AI labs and model builders
    - Research and inference teams
    - Use DOS and realtime model infrastructure to reduce compute cost and latency
    - Described as active contract base in company and CTech sources
    - Supports infrastructure-moat thesis beyond Decart’s own models
    - No named AI-lab logos or renewal data are disclosed
  - - Enterprise commerce, media, streaming, and advertising buyers
    - Product, growth, and content teams
    - Virtual try-on, livestreaming effects, dynamic video, social experiences
    - Public docs show clear workflows, but customer logos are mostly unnamed
    - Shows broad applicability for Lucy surfaces
    - Outcomes and retention by vertical are not publicly disclosed
  - - Physical-AI and AV developers
    - Simulation, robotics, and autonomy teams
    - Prompted multiview driving and world-model simulation via Oasis 3
    - Public API lowers entry barrier for experimentation
    - Could expand TAM beyond media into training and evaluation
    - Physical-AI buyer proof is mostly aspirational and Amazon-linked rather than a broad disclosed roster
  - - Self-serve developers and open-source community
    - Developers, hobbyists, and product builders
    - API experiments, SDK integrations, XR demos, and try-on prototypes
    - TechCrunch cites 100,000+ developers; GitHub exposes many starter assets
    - Low-friction pipeline for adoption and partner amplification
    - Conversion to paying accounts and repeat spend are undisclosed
  notes: Segments combine named evidence with cohort-level proof; absence of public revenue splits is a core diligence limitation.
