              potential AV enterprise contracts (unannounced, no public evidence yet). CBInsights confirms no ARR or
              financial metrics have been publicly disclosed by Decart. In a bull scenario, Decart converts its 100,000+
              developer community into paying customers at even modest retention, achieves 3-5 enterprise gaming or AV
              contracts, and reaches $30 million ARR by end of 2026 and $200 million by 2028 — yielding a 20x forward
              multiple that sustains current valuation. In a base scenario, adoption is slower and Decart reaches $15
              million ARR by end of 2026 and $80-100 million by 2028 at a 20x multiple, implying a significantly
              discounted valuation of $1.6-2.0 billion versus the $4 billion current pricing. In a bear scenario,
              physics failures close the AV market and competition from Runway and Google limits gaming adoption; Decart
              reaches $25 million ARR by 2028, implying a $500 million valuation at 20x — an 87.5% discount to current
              pricing. Roblox Corporation's SEC 10-K filings provide a comparable public company anchor: Roblox
              generated approximately $3.9 billion in revenue in fiscal 2025 at a market capitalization near $26
              billion, implying a price/revenue multiple of approximately 6-7x for a mature gaming platform — suggesting
              that even bull-case Decart revenues would need to be exceptional to sustain a $4 billion market value at
              maturity-stage multiples.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
