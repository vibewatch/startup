      - number: '3.3'
        title: 'Decart differentiation: real-time latency, DOS cost moat, and developer-ecosystem strategy'
        blocks:
          - type: paragraph
            body: >-
              Decart's core differentiation rests on three pillars that competitors have not matched in production
              systems as of mid-2026. First, real-time inference latency: Lucy runs at under 30 milliseconds
              time-to-first-frame, generating up to 100 frames per second via the DOS stack optimized for Amazon
              Trainium3, versus Genie 3's 24-fps research-only pipeline. Second, cost efficiency: Decart claims a 100x
              improvement in cost efficiency over comparable systems, enabled by DOS, which achieves over 80% Model
              FLOPS Utilization on Trainium3 hardware. Third, the developer ecosystem: by pricing Oasis 3 at $0.02 per
              second via public API from day one, Decart is building the same developer ecosystem flywheel that made
              OpenAI's text API sticky — the startup already has more than 100,000 developers building on Lucy.


              The DOS stack is architecturally differentiated in that it runs on any hardware (NVIDIA GPU, Amazon
              Trainium, Google TPU) rather than being tied to one cloud provider. Oasis 3 generates three synchronized
              camera feeds (front-facing plus two side-facing), matching the perception setup of most camera-first AV
              stacks. Decart's CEO stated the company had burned "drastically less" than $100 million in its lifetime
              despite raising over $450 million, which if accurate suggests DOS cost efficiency applies to internal
              inference economics as well as external sales. However, this is a company-claimed metric without
              independent audit corroboration.


              The key strategic bet is that mid-tier AV companies, robotics startups, and drone programs that cannot
              afford Google-DeepMind-scale research budgets will prefer to rent Oasis simulation at $0.02/sec rather
              than build internal systems — an addressable segment the CEO estimates at dozens of programs globally.
