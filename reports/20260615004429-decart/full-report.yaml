      - number: '4.2'
        title: GTM motion and developer flywheel
        blocks:
          - type: paragraph
            body: |
              Decart's go-to-market strategy as of mid-2026 combines a self-serve developer API with direct
              enterprise sales through strategic partnerships. The developer-led path has produced a community
              of more than 100,000 developers building primarily on the Lucy API for e-commerce virtual try-on
              and livestreaming transformation use cases, with Oasis 3 launched in June 2026 targeting autonomous
              vehicle simulation developers as a second vertical. The AWS Bedrock integration is the enterprise
              distribution anchor, giving Decart access to Amazon's sales force and cloud marketplace credibility
              without the cost of building a direct enterprise sales organization from scratch. This reduces
              upfront customer acquisition cost but cedes margin and control to Amazon's commercial terms.
              Strategic investors Toyota, Adobe, and eBay are described by CEO Leitersdorf as "all potential
              customers," creating a captive initial enterprise pipeline that does not reflect arms-length
              commercial conversion. NVIDIA's dual role as investor and hardware partner further blurs the
              distinction between financial support and commercial demand. No customer count by revenue tier,
              net revenue retention, or sales cycle data has been disclosed. The primary GTM risk is that
              Decart's revenue concentration in a small number of hyperscaler DOS licensing deals and a large,
              mostly non-revenue-generating developer base creates a barbell revenue structure — a handful of
              large contracts offset by high-volume but low-monetization developer API usage — making aggregate
              revenue quality difficult to assess without a customer-by-revenue breakdown.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI015
              - CI016
              - CI022
              - CI027
      - number: '4.3'
        title: Cost structure, gross margin drivers, and capital intensity
        blocks:
          - type: paragraph
            body: |
              Decart's cost structure is dominated by compute and R&D payroll, with no owned hardware capital
              expenditure given its asset-light model using leased Amazon Trainium3, NVIDIA GPU, and Google TPU
              capacity. The gross margin profile of a managed inference API business at scale would typically
              run 50–80% for software-defined services, but Decart's actual margins depend critically on the
              terms of its hyperscaler compute agreements, the cost of Trainium3 versus standard NVIDIA instance
              pricing, and whether DOS licensing revenue carries substantially higher margins than API usage.
              Publicly, the DOS optimization layer is described as delivering over 80% Model FLOPS Utilization
              on Trainium3 — a hardware efficiency metric cited by AWS VP Nafea Bshara — and reducing per-video
              production cost from hundreds or thousands of dollars to less than $0.25 per video. If accurate,
              these efficiency gains translate directly into gross margin improvement relative to peers running
              on standard inference infrastructure. However, these are company-claimed benchmarks with no
              independent third-party audit. DOS 2.0, announced alongside the $300M raise, claims 1,600+ tokens
              per second for agentic inference versus an industry average of approximately 200 tokens per second,
              and up to 100 frames per second for world models. If the cost advantage is as described, Decart's
              gross margin on API revenue could materially exceed commodity inference API margins. R&D payroll
              for 60+ employees (many with deep low-level systems and HPC expertise) adds a significant fixed
              cost base. The company has not disclosed COGS, gross margin, headcount cost, or any unit-economics
              metric publicly.
            claimRefs:
