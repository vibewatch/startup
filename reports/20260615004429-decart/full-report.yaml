      - number: '3.4'
        title: Moat durability, switching costs, and commoditization risk
        blocks:
          - type: paragraph
            body: >-
              Decart's moat is real but narrow and time-bounded. The switch to Oasis 3 is sticky while it is the only
              production-ready API for real-time driving simulation: once AV training pipelines integrate
              Oasis-generated scenarios, the switching cost includes re-collecting or re-labeling synthetic data from a
              different format. However, the moat has at least three structural vulnerabilities.


              First, the two firms most capable of building a competing real-time world model — Google (via DeepMind)
              and NVIDIA (which is an investor in Decart but runs its own DRIVE simulation stack) — have R&D budgets
              orders of magnitude larger than Decart's. Waymo has already implemented Genie 3 internally, setting a
              precedent for the top AV tier self-sourcing. Second, Runway, World Labs, and Luma AI are all explicitly
              investing in world models and have raised comparable or larger financing; if any of them ships a
              competitive real-time API, Decart's first-mover developer ecosystem advantage faces direct pressure.
              Third, the distribution channel through AWS Bedrock, while positive for reach, makes Decart dependent on
              Amazon's go-to-market and pricing architecture.


              Scenario's aggregator model, which offers 550+ models from 50+ providers, illustrates how commodity
              infrastructure markets evolve: once multiple world-model vendors exist, an aggregator could undercut any
              single vendor's pricing moat. For now that risk is prospective, but it frames the 3–5 year competitive
              durability question correctly.
