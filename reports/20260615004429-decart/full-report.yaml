        title: Mitigations, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Decart has taken meaningful but incomplete steps to mitigate its top risks. Regulatory: the AUP (February
              2026) explicitly references EU AI Act, DSA, and DMCA; this demonstrates regulatory awareness but is not a
              substitute for training-data transparency obligations or a licensing framework. Technical: the CEO has
              publicly acknowledged physics-consistency and context-window limitations and stated active research
              programs; the next model version is expected to address video-seeded world generation, which may improve
              consistency. Infrastructure: the AWS Trainium3 deal provides performance efficiency but increases AWS
              lock-in; no public multi-cloud fallback has been identified. People: the SF R&D center hire of Dr. Kfir
              Aberman represents geographic and talent diversification but does not resolve co-founder concentration.
              The mitigation and kill-criteria table (TR005) maps each major risk to monitorable triggers and
