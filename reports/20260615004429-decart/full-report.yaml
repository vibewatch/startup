      - number: '7.2'
        title: Regulatory, Legal, and IP Risks
        blocks:
          - type: paragraph
            body: >
              Training-data copyright is Decart's most structurally ambiguous legal risk. The EU Parliament's Legal
              Affairs Committee published its report "Copyright and Generative AI — Opportunities and Challenges"
              (February 2026, 17-3 vote) calling for a rebuttable presumption that any GenAI model placed on the EU
              market has used copyrighted works for training unless full transparency obligations are met. This
              presumption — if enacted into EU law — would reverse the burden of proof onto Decart, and a 5–7% flat-rate
              turnover fee was proposed for retroactive licensing pending a formal framework. Separately, the US
              Copyright Office's ongoing AI rulemaking (Part 3 of its AI Report) is developing guidance on licensing
              frameworks for AI training; the Office has not yet issued binding rules but its guidance shapes litigation
              posture and future statutory risk. Osborne Clarke's February 2026 legal analysis describes the EU
              situation as a "watershed moment" where existing opt-out systems are insufficient and new frameworks are
              likely binding on non-EU AI providers serving EU markets (market-of- destination principle). The 2025
              Trump Executive Order on AI (December 2025) signals federal intent to preempt state AI regulation in the
              US but does not eliminate risk — Gunder LLP's 2026 AI laws update notes that states like Colorado and
              California have enacted comprehensive AI governance statutes that continue to operate and are already
              shaping vendor contracting. Decart's AUP (updated February 2026) explicitly acknowledges the EU AI Act,
              DSA, and DMCA as governing frameworks, and prohibits use in military/weapons, real-time biometric
              surveillance, and social scoring contexts. No public IP litigation against Decart has been identified as
              of June 2026, but the absence of lawsuits does not confirm training-data licensing compliance. The
              diligence ask is a full training-data provenance audit with licensing agreements for any
              copyright-protected sources.
