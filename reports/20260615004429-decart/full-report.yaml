        - medium
        - >-
          Assess developer retention and reactivation rates; understand contract duration and average API spend per
          developer
      - - AWS distribution via Bedrock and Trainium3 partnership gives Decart enterprise reach
        - >-
          AWS Bedrock is multi-vendor; Amazon will offer competing models in the same marketplace; distribution
          advantage evaporates if a competing world model lands on Bedrock
        - medium
        - >-
          Review AWS exclusivity terms and co-sell commitment; assess whether Toyota, Adobe, eBay investor/customer
