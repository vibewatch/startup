      - number: '3.5'
        title: 'Adverse dynamics: physics-consistency limitations, internal builds, and buyer caution'
        blocks:
          - type: paragraph
            body: >-
              Independent testing by TechCrunch at launch found that Oasis 3's environment thematic integrity degrades
              rapidly during extended interaction — a New York City street prompt produced a strong initial scene that
              quickly became a generic Western urban environment, and the model did not preserve geographic landmarks
              across navigation. More critically, vehicles in Oasis 3 drive through each other, indicating the model
              does not yet simulate rigid-body physics correctly. Decart's CEO acknowledged this as "a major research
              problem we're cracking now," attributing it to data imbalance between normal driving and collision
              scenarios.


              These limitations matter because AV companies evaluating Oasis 3 for edge-case synthetic data generation
              will need to validate that generated scenarios transfer to real-world behavior before committing training
              budgets. Synthetic data that does not respect physics may introduce distributional artifacts into trained
              perception or planning models.


              On the internal-build dimension, Waymo, Tesla, NVIDIA, and Wayve are all building comparable world-model
              simulation in-house. Decart's real addressable market is therefore the second and third tiers of AV
              programs, robotics labs, and drone startups that cannot self-fund a world-model research effort. This
              concentration of addressable customers at the mid-tier reduces the near-term revenue ceiling and creates
              concentration risk if large customers are few in number.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP023
              - CP031
              - CP032
