      - number: '8.6'
        title: Recommendation, Diligence Asks, and Disclosure Limitations
        blocks:
          - type: paragraph
            body: >
              Recommended stance: TRACK. Confidence: Medium. Risk rating: High. Valuation stance: Stretched. The
              investment case for Decart is asymmetric — the technical differentiation, AWS partnership, and strategic
              investor quality are genuinely superior, but the $4 billion price point embeds execution assumptions that
              are not yet evidenced by any public financial disclosure. The recommendation is to track rather than pass
              because the TAM is large enough and the technical moat is real enough that a premature "pass" risks
              missing a generational platform opportunity; but a "buy" recommendation requires financial validation that
              is currently unavailable. The upgrade trigger to "buy" is: (1) disclosure of ARR at or above $25 million
              with demonstrated YoY growth; (2) at least one public AV enterprise contract with disclosed TCO; (3)
              publication of a physics-consistency roadmap with measurable milestones. The downgrade trigger to "pass"
              is: any material copyright enforcement action, confirmed physics failures blocking AV adoption, or a
              Runway/Google world model launch at price parity. Disclosure limitation: all financial projections in this
              chapter are assumption-led; Decart has not publicly disclosed revenue, ARR, bookings, burn rate, gross
              margin, customer count, or retention metrics as of June 2026. This chapter presents scenario ranges only
              and explicitly cannot support a specific investment price recommendation. Investors should treat the $4
              billion valuation as a hypothesis to be tested, not a validated market price.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Stretched Valuation — No Revenue Anchor
            body: >
              Decart's $4 billion valuation is entirely assumption-led. The company has not disclosed any revenue, ARR,
              bookings, or profitability metrics as of June 2026. The current pricing embeds bull-case execution across
              gaming simulation, AV enterprise contracts, and e-commerce API adoption. At base-case assumptions using
              publicly available pricing ($0.02/second) and developer community size (~100,000 accounts), the implied
              2028E ARR of $80-100 million produces a valuation of approximately $1.6-2.0 billion — a 50-60% discount to
              current pricing.
            calloutType: insight
            claimRefs:
              - CV020
              - CV021
              - CV036
          - type: callout
            title: Adverse View — Physics Limitations Create AV Thesis Risk
            body: >
              The autonomous vehicle simulation vertical arguably represents 30-50% of Decart's bull-case valuation.
              TechCrunch's June 2026 independent review documented vehicles passing through each other and navigation
              failures in Oasis 3 — physics-consistency issues the CEO acknowledged as "a major research problem we're
              cracking now." If AV customers require physics-accurate simulation (which is a baseline requirement for
              synthetic training data in safety-critical applications), this thesis leg could fail entirely. Decart has
              not published a physics-accuracy roadmap with measurable milestones.
            calloutType: insight
            claimRefs:
              - CV027
              - CV028
              - CV029
