    type: range
    layout: wide
    summary: >
      Range chart showing Decart's implied equity valuation under bear, base, and bull scenarios, with confidence
      intervals reflecting the uncertainty of assumption-led projections. The current $4B price sits at the top of the
      range. All figures are assumption-led; Decart has not disclosed any financial metrics.
    data:
      items:
        - label: Bear scenario (physics fails, slow adoption)
          low: 0.3
          high: 0.8
          unit: $B
          detail: 20x on $15-40M 2028E ARR; 87.5% discount to current at midpoint
        - label: Base scenario (API scale, no AV)
          low: 1
          high: 2.5
          unit: $B
          detail: 20x on $50-125M 2028E ARR; 38-75% discount to current
        - label: Bull scenario (gaming + AV enterprise)
          low: 3.5
          high: 6
          unit: $B
          detail: 20x on $175-300M 2028E ARR; at or above current price
        - label: Current $4B entry price
          low: 4
          high: 4
          unit: $B
          detail: May 2026 Series C; requires bull-case execution to show positive return
        - label: Private peer range (Luma to Runway)
          low: 0.9
          high: 5.3
          unit: $B
          detail: Peer group range; Luma $0.9B to Runway $5.3B (Feb 2026)
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV026
  - id: FV004
    title: Investment KPIs — Decart Scorecard
    type: kpi
    layout: wide
    summary: >
      IC-ready KPI scorecard assessing Decart across six investment dimensions: market, technical proof, competitive
      moat, financial evidence, risk profile, and valuation. Scores are evidence-based assessments derived from public
      sources only. Red/amber/green assigned based on available evidence as of June 2026.
    data:
      items:
        - label: Market opportunity
          value: 8/10
          unit: score
          detail: Large gaming TAM ($210B+), confirmed GenAI tailwind (BCG), e-commerce and AV emerging verticals
        - label: Technical proof
          value: 7/10
          unit: score
          detail: Real-time world model is unique at current latency; Oasis/Minecraft and Lucy launched commercially
        - label: Competitive moat
          value: 6/10
          unit: score
          detail: AWS Trainium3 and Amazon Bedrock partnership; but Runway, World Labs, Google Genie advancing
        - label: Financial evidence
          value: 2/10
          unit: score
          detail: No ARR, revenue, bookings, margin, or burn rate disclosed publicly; all financials are estimates
        - label: Risk profile
          value: 4/10
          unit: score
          detail: Physics failures documented; copyright exposure; customer concentration unknown; high-risk
        - label: Valuation discipline
          value: 3/10
          unit: score
          detail: $4B with no revenue anchor; base case implies 56% discount; only bull case supports current price
