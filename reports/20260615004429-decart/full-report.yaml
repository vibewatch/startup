      - number: '1.3'
        title: Capital base, valuation path, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Decart's funding history is unusually compressed. The company emerged from stealth on October 31, 2024
              with a $21 million round led by Sequoia and joined by Oren Zeev's Zeev Ventures, alongside the viral Oasis
              Minecraft-style demo. Ynet's August 2025 interview reports that two early back-to-back rounds totaled $53
              million at a roughly $500 million valuation before the company crossed unicorn status. On August 7, 2025
              Decart announced a $100 million Series B at a $3.1 billion post-money valuation, bringing cumulative
              capital to $153 million, with Sequoia, Benchmark, and Zeev Ventures rolling over and Aleph VC entering as
              a new investor. On May 18, 2026 Decart disclosed a $300 million round led by Radical Ventures at a roughly
              $4 billion valuation, with NVIDIA, eBay Ventures, Adobe Ventures, Toyota Ventures, Atreides Management,
              and Valor Equity Partners joining alongside returning Sequoia, Benchmark, and Zeev Ventures; private
              backers in the round include OpenAI co-founder Andrej Karpathy, former Disney CEO Michael Eisner, members
              of the Nintendo founding family, and gaming investor Moritz Baier-Lentz. Decart itself states the company
              has raised over $450 million to date, and Amazon is publicly described as a strategic customer rather than
              a disclosed equity investor. Leitersdorf told Ynet in August 2025 that Decart had used less than $10
              million of its $153 million in capital, a self-reported burn that has not been independently audited.
