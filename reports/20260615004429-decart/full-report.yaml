      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: |
              Decart's total capitalization exceeds $450 million after its $300M Series C in May 2026. The
              funding chronology comprises approximately $53 million in seed and early-stage rounds, a $100
              million Series B at a $3.1 billion valuation (August 2025, led by existing investors Sequoia,
              Benchmark, and Zeev, plus new investor Aleph VC), and a $300 million Series C at approximately
              $4 billion (May 2026, led by Radical Ventures with strategic participants NVIDIA, Toyota Ventures,
              Adobe Ventures, eBay Ventures, and Amazon as strategic customer). The SEC Form D filed September
              2025 by JSL Decart.AI Coinvest, L.P. (CIK 0002084011) confirms a Delaware LP co-investment
              vehicle was formed for the Series B, though the document provides minimal additional detail on
              investor composition or valuation mechanics. CEO Leitersdorf stated in August 2025 that Decart
              had spent less than $10 million of its $153 million in capital, with operating costs covered by
              DOS licensing revenue. In June 2026, he revised this to "drastically less than $100 million" in
              lifetime spend — consistent with, but less precise than, the August 2025 claim. Both figures are
              CEO-stated with no independent audit or board attestation provided. If the lifetime spend claim
              is taken at face value, Decart enters mid-2026 with roughly $350–$440 million in cash, implying
              multi-year runway even at materially higher monthly burn than the CEO's implied sub-$1M/month
              figure. Strategic investors participate commercially: NVIDIA as hardware partner and DOS
              distribution vehicle, Amazon as customer and Bedrock distribution channel, and Toyota, Adobe, and
              eBay as potential customers and validators of enterprise demand. This creates a financing-commercial
              co-dependency where investment terms may be partially predicated on commercial commitments,
              reducing the independence of either signal.
