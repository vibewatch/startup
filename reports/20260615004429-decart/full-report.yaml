      - number: '7.5'
        title: People, Execution, and Financing Risks
        blocks:
          - type: paragraph
            body: >
              Decart's execution risks center on key-person dependency, geopolitical exposure, and the financing gap
              between its $4 billion valuation and publicly disclosed revenue metrics. Dean Leitersdorf (CEO, 27 years
              old) has been the primary public face, fundraiser, and technical narrative driver for every round from
              seed to Series C. His departure would simultaneously create a fundraising, technical credibility, and
              media-narrative gap at a critical scale-up phase. The company's leadership team outside the two
              co-founders is not publicly documented in depth, with Dr. Kfir Aberman (formerly Snap and Google,
              co-creator of DreamBooth) being the most senior publicly named hire as head of the SF R&D center. This
              creates execution risk in the event of any co-founder or Aberman departure. The Israeli operational HQ
              creates geopolitical risk: a sustained escalation in the Israel-Gaza conflict or broader regional
              instability would affect the Tel Aviv engineering team's ability to operate, access visas for global
              travel, and maintain relationships with risk-sensitive enterprise customers. Several large enterprises
              (particularly in defense-adjacent sectors) have procurement policies against vendors in active conflict
              zones. Financing risk: Decart has raised $450M+ but claims lifetime burn of "less than $100M" (CEO, June
              2026). Even if this is accurate, the burn rate will accelerate significantly as the company scales
              AV/physical-AI simulation infrastructure, expands headcount from 60+ employees, and builds out enterprise
              sales capacity. At the $4 billion valuation, the next round would need to be at $5–6 billion or higher to
              avoid a flat/down round, which requires demonstrable revenue traction that is not yet publicly evidenced.
