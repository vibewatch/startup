      - - DOS cost stack gives Decart 100x efficiency claim vs comparable systems
        - >-
          Runway, World Labs, and Luma AI have raised hundreds of millions for compute scaling; cloud providers may
          commoditize inference efficiency with standard kernels
        - medium
        - >-
