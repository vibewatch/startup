  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: |
              Decart operates three publicly documented revenue streams as of mid-2026. The first — and historically
              earliest — is DOS licensing to major cloud providers, AI laboratories, and hyperscale infrastructure
              companies through multi-million-dollar commercial contracts. The company's optimization stack was
              profitable enough on this basis for the CEO to claim in August 2025 that Decart had spent less than
              $10 million of its $153 million in capital raised, funding its tens of millions in GPU compute costs
              through licensing revenue. The second stream is API pay-per-second: Lucy 2.1 (realtime video editing,
              720p) is priced at $0.02 per generated second, Lucy Restyle 2 (style transfer) at $0.01 per second,
              Oasis 3 Preview (physical AI and driving simulation) at $0.02 per second for self-serve access, and
              the prior-generation Lucy Clip at $0.15 per second. Enterprise pricing for Oasis 3 and custom
              deployments depends on use case and is not publicly disclosed. The third stream is enterprise
              distribution via AWS Bedrock, announced as part of the $300M Series C in May 2026, which enables
              Amazon's enterprise customer base to access Decart technology for media, commerce, advertising, and
              physical AI use cases under custom commercial terms. Revenue recognition dynamics differ across
              streams: DOS licensing contracts likely follow completion-of-delivery or ratable-license recognition;
              pay-per-second API revenue is recognized as consumed; enterprise Bedrock contracts would follow
              negotiated multi-year delivery schedules. The mix between these streams and the relative sizes of
              each segment are not publicly disclosed, constituting the primary revenue-quality diligence gap.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
              - CI007
              - CI014
              - CI015
