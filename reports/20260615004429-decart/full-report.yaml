  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'World-model landscape in 2026: direct labs, incumbents, adjacents, and internal-build substitutes'
        blocks:
          - type: paragraph
            body: >-
              Decart does not compete in a well-bounded software category. Its Lucy model for immersive experiences
              competes with video-generation platforms such as Runway and Luma AI that are themselves pivoting toward
              world models. Its Oasis model for physical-AI simulation competes with both research-grade systems (Google
              DeepMind's Genie 3, released as a research preview in August 2025) and large internal build programs at
              Waymo, Tesla, NVIDIA, and Wayve. Its DOS inference stack competes with hyperscaler GPU clouds and
              dedicated inference optimization vendors.


              The common thread across all three product lines is real-time, interactive generation at
              sub-30-millisecond latency — a capability that, as of mid-2026, no competitor has matched in a
              commercially available API. Genie 3 generates frames at 24 fps at 720p but remains a research preview
              without a public paid API. Runway's latest Gen 4.5 produces high-definition video with audio and character
              consistency, but targets post-production and creative workflows rather than live interactive simulation.
              World Labs' Marble product creates downloadable 3D environments for design and entertainment, not
              real-time driving simulation. Luma AI raised $900 million in November 2025 at a multi-billion valuation
              and is expanding into world models, but has no publicly disclosed real-time interactive API.


              The two classes of competitor that most directly undercut Decart's long-term thesis are: (1) internal
              builds by the top-tier AV players who have Google-grade research budgets and proprietary sensor data, and
              (2) future commercial releases by the same general-purpose video labs already raising capital at
              comparable valuations. Scenario and Inworld AI represent adjacent substitutes focused on gaming tooling
              and AI characters, respectively, but do not directly address real-time driving simulation.
            claimRefs:
