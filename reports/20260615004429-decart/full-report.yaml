      - number: '8.5'
        title: Valuation Framework, Risk Factors, and Thesis Breaks
        blocks:
          - type: paragraph
            body: >
              The current $4 billion valuation can be decomposed into three components: (1) demonstrated technical
              optionality — real-time world model architecture that is unique at current latency and fidelity specs; (2)
              infrastructure partnership premium — AWS Trainium3 production deal and Amazon Bedrock distribution create
              scale that most startups at this stage do not have; and (3) strategic investor premium — the
              customer-investor structure implies high early adoption probability. Against this, the adverse thesis is
              material: TechCrunch's June 2026 independent review documented physics-consistency failures in Oasis 3
              that the CEO acknowledged as an active research problem, indicating core product limitations are not
              cosmetic. CBInsights rates Decart as high-risk due to lack of financial disclosure. The physics limitation
              is the key thesis-break trigger for the AV vertical, which arguably accounts for 30-50% of the bull-case
              valuation. Three additional thesis-break triggers are: (A) failure to demonstrate enterprise-grade ARR by
              Q4 2026; (B) a material copyright enforcement action targeting Decart's training data in the EU; or (C)
              Runway or Google shipping a real-time world model at competitive price-quality levels within 12-18 months.
              At current comparable valuations, the AWS and Nvidia strategic partnerships do not justify the premium to
              peers: Runway has similar strategic relationships (Adobe acquisition candidate) and disclosed commercial
              traction. A diligence session must include audited revenue, gross margin, burn rate, and customer
              concentration data before any recommendation can be upgraded beyond "track."
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV006
