  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Framework
        blocks:
          - type: paragraph
            body: >
              Decart faces a multi-layered risk stack that is elevated relative to its $4 billion valuation and early
              revenue stage. The company operates at the intersection of three high-risk regulatory zones: generative AI
              copyright law (training-data liability), the EU AI Act (real-time AI systems), and US state-level AI
              governance frameworks that are accelerating in 2026. On top of the regulatory overhang, the company's core
              technology — autoregressive world models — has documented reliability limitations that are fundamental to
              the architecture and not cosmetic: TechCrunch's independent review of Oasis 3 (June 2026) found
              physics-consistency failures and context-window degradation within minutes of generation, issues the CEO
              acknowledged as ongoing research problems. Operationally, Decart's concentration in AWS Trainium3
              infrastructure and its go-to-market dependence on Amazon Bedrock creates a single-throat-to-choke failure
              mode at the infrastructure layer. Competitively, Google DeepMind (Genie 3), Waymo (internal world model on
              Genie 3), Runway ($5.3B, $315M Series E, Feb 2026), and Luma AI ($900M Series C) are all advancing with
              significantly more resources or defensible strategic positions. The risk heatmap (FR001) plots these
              themes by likelihood and residual impact after reported mitigations. The most concentrated risks —
              copyright liability and competitive displacement — are in the high-likelihood, high-impact quadrant.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
