chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and product surface
        blocks:
          - type: paragraph
            body: >-
              Decart describes itself as a fully vertically integrated frontier AI research lab founded in 2023 that
              builds state-of-the-art real-time world models together with the ultra-optimized infrastructure to run
              them. The company's own May 2026 funding release frames the business as three product lines that share one
              stack: Lucy, a real-time world model for immersive video and interactive experiences; Oasis, a real-time
              world model targeted at Physical AI and robotics simulation; and DOS, the Decart Optimization Stack that
              compiles model weights down to NVIDIA GPUs, Google TPUs, and Amazon Trainium silicon. Decart sells API
              access on a pay-as-you-go basis through platform.decart.ai, with realtime models such as Lucy 2.1 and
              Oasis 3 Preview priced at roughly $0.02 per second of active generation and image edits at single-cent
              unit prices, and offers enterprise pricing on top through a sales contact. The company anchors its
              operations in Tel Aviv, with disclosed offices in northern Israel, San Francisco, and New York and a
              2025-opened San Francisco R&D center led by Dr. Kfir Aberman. The pre-2026 product surface also included
              Mirage, the company's livestream diffusion model that Decart positioned as the predecessor to the Lucy
              family of real-time video models.
