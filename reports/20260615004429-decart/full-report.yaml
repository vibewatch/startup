      - number: '7.3'
        title: Operational, Model Quality, and Security Risks
        blocks:
          - type: paragraph
            body: >
              Decart's operational risk is dominated by the fundamental architectural limitations of its autoregressive
              world models and its deep dependency on AWS infrastructure. On model quality: TechCrunch's independent
              June 2026 test of Oasis 3 documented three distinct failure modes — (1) thematic coherence degradation
              within minutes as the context window fills; (2) physics-consistency failures where vehicles pass through
              other vehicles because the model lacks proper collision simulation; and (3) control responsiveness issues
              preventing precise navigation. CEO Leitersdorf acknowledged all three as ongoing research problems,
              attributing the context degradation to the fact that generating video at 30fps consumes ~8,000 tokens per
              frame and fills context windows very rapidly at hundreds of thousands of tokens per second. The company is
              researching longer-context and memory-compression techniques. For AV customers, physics failures are not
              cosmetic — they mean synthetic training data may contain physically invalid scenarios that could degrade
              downstream model behavior. This creates a direct training-data quality risk for Decart's target AV market.
              On infrastructure: Decart's Lucy model runs on AWS Trainium3 and is distributed via Amazon Bedrock,
              creating a concentrated single-cloud dependency. A sustained AWS outage would halt all inference
              operations. The Trainium3 hardware is newly announced and limited in broader availability, creating
              hardware-sourcing risk during scale-up. On security: as a platform generating real-time video from
              customer-supplied prompts, Decart faces prompt injection risks, jailbreak risk for AUP-prohibited content
              (deepfakes, CSAM, weapons synthesis), and API key compromise risk. The AUP (February 2026) addresses
              prohibited uses but independent audit of content moderation effectiveness has not been identified.
            claimRefs:
              - CR015
              - CR016
