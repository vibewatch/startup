    sections:
      - number: '8.1'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Decart has raised over $450 million across multiple rounds since its founding in 2022, with a trajectory
              that places it among the fastest-valued Israeli AI startups on record. The most recent round — a $300
              million Series C closed in May 2026 — brought the post-money valuation to approximately $4 billion. The
              round was notable for its strategic composition: lead investors include technology companies that are
              simultaneously paying customers (Toyota, Adobe, eBay Ventures), creating an unusual alignment structure
              where capital and commercial adoption are bundled. Radical Ventures led, with participation from Nvidia,
              Sequoia Capital, and Benchmark. Prior to the Series C, Decart raised $100 million at a $3.1 billion
              valuation in August 2025 (Series B), implying a 29% step-up in approximately nine months. The cumulative
              dilution and pre-money ownership structure have not been publicly disclosed. The $450 million+ war chest
              is substantial for a company at Decart's commercial stage, and implies a multi-year runway even at
              elevated compute spending, but burn rate figures are not available for validation. The strategic investor
              base introduces governance complexity: customers who are also investors may have conflicting incentives
              around product roadmap, enterprise pricing, and potential exit routes.
