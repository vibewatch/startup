      - number: '7.4'
        title: Partner, Dependency, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Decart's go-to-market and infrastructure strategy creates layered concentration risks. The most material
              single dependency is AWS/Amazon: Decart's Lucy model runs on AWS Trainium3, models are distributed via
              Amazon Bedrock, and Amazon itself is listed as a strategic customer — creating a three-way concentration
              where Amazon is simultaneously cloud provider, distribution channel, and revenue source. If Amazon
              develops competing internal world-model capabilities (plausible given their AWS AI infrastructure
              investment) or reduces Bedrock shelf-space for third-party models, Decart's distribution channel collapses
              at the same time as its infrastructure. Similarly, Nvidia is both Decart's primary alternative compute
              supplier and an equity investor (Nvidia participated in both the $100M Series B and the $300M Series C). A
              material Nvidia relationship dispute or competitive pivot would simultaneously affect Decart's hardware
              roadmap and its cap table optics. Customer concentration is amplified by the investor/customer overlap:
              Toyota Ventures, Adobe Ventures, and eBay Ventures are equity investors whose parent companies are also
              listed as strategic customers. This arrangement is positive for signal quality but creates adverse
              incentive dynamics — a customer churning from the platform while holding equity sends a particularly
              damaging market signal. Startupfortune (June 2026) noted that Decart's real market is the "dozens of AV
              programs, robotics labs, and drone startups" below the Waymo/Tesla/Nvidia tier — meaning its monetizable
              customer base is smaller, less well-capitalized, and less strategically sticky than the strategic
              investor/customers. The developer community (100,000+ registered) is large but API revenue at $0.02/second
              is highly volume-dependent and the revenue per developer at typical usage patterns is uncertain.
