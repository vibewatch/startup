            body: >
              TechCrunch's June 2026 review of Oasis 3 documented vehicles passing through each other and loss of
              navigational control — physics failures the CEO described as an active research problem. For autonomous
              vehicle customers, synthetic training data that violates physical laws could degrade real-world model
