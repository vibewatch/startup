              The nearest public comparables for Decart are private-market peers in AI video, world modeling, and AI
              gaming infrastructure. Runway AI — the closest functional comparable — raised $315 million at a $5.3
              billion valuation in February 2026, and has publicly indicated it is expanding from creative video editing
              toward world models, making it a direct future competitor with a $1.3 billion valuation premium over
              Decart. World Labs raised $200 million in February 2026 with an anchor investment from Autodesk, targeting
              professional 3D workflows at a similar ~$5 billion implied valuation; it is narrower in scope than Decart
              but has a clearer commercial vertical in the $25 billion 3D design software market. Luma AI raised $900
              million in Series C funding from HUMAIN (Saudi Arabia's state AI fund) in November 2025 at a ~$900 million
              valuation — a case where total capital raised ($450 million at time of round) approximately equals
              post-money valuation, suggesting significant investor caution on the video generation sub-segment. Inworld
              AI, valued at over $500 million with $100 million raised, is the primary AI-native games infrastructure
              peer; its focus on NPC character engines is narrower but complementary. The peer group average post-money
              valuation is approximately $2.9 billion, and Decart's $4 billion represents a 38% premium over the peer
              group average. The premium is defensible if real-time world simulation proves to be a higher-value
              architecture than post-production video generation, but is currently assumption-led given Decart's opaque
