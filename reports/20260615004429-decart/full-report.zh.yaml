      - number: '1.3'
        title: 资本基础、估值路径与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Decart 的融资历史压缩得异常快。公司于 2024 年 10 月 31 日走出隐身状态，宣布由 Sequoia 领投、Oren Zeev 的 Zeev Ventures 参投的 $21 million
              轮融资，并同时推出病毒式传播的 Oasis 类 Minecraft 演示。Ynet 2025 年 8 月访谈称，公司在跨过独角兽门槛前，两个早期连续轮次合计融资 $53 million，估值约 $500
              million。2025 年 8 月 7 日，Decart 宣布以 $3.1 billion 投后估值完成 $100 million Series B，使累计融资达到 $153
              million；Sequoia、Benchmark 和 Zeev Ventures 继续跟投，Aleph VC 作为新投资人进入。2026 年 5 月 18 日，Decart 披露由 Radical
              Ventures 领投、估值约 $4 billion 的 $300 million 轮融资，NVIDIA、eBay Ventures、Adobe Ventures、Toyota Ventures、Atreides
              Management 和 Valor Equity Partners 与回归的 Sequoia、Benchmark、Zeev Ventures 一同参投；该轮私人支持者包括 OpenAI 联合创始人 Andrej
              Karpathy、前 Disney CEO Michael Eisner、Nintendo 创始家族成员和游戏投资人 Moritz Baier-Lentz。Decart 自称迄今已融资超过 $450
              million；Amazon 公开身份是战略客户，而不是已披露股权投资人。Leitersdorf 于 2025 年 8 月告诉 Ynet，Decart 使用的 $153 million 资本不到 $10
              million；这是公司自报消耗，未经过独立审计。
