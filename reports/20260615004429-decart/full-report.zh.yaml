      - number: '8.6'
        title: 建议、尽调问题与披露限制
        blocks:
          - type: paragraph
            body: >
              建议立场：跟踪。置信度：中。风险评级：高。估值立场：偏贵。Decart 的投资案例具有不对称性——技术差异化、AWS 合作和战略投资者质量确实优于同类，但 $4 billion
              价格内嵌的执行假设，尚未被任何公开财务披露证明。建议跟踪而非直接放弃，是因为 TAM 足够大、技术 moat
              也足够真实，过早「放弃」可能错过代际平台机会；但「买入」建议需要财务验证，目前拿不到。升级为「买入」的触发器是：（1）披露 ARR 达到或超过 $25 million，并有 YoY 增长；（2）至少一个公开 AV
              企业合同，且披露 TCO；（3）发布带可衡量里程碑的物理一致性路线图。降级为「放弃」的触发器是：任何重大版权执法行动、确认物理失败阻断 AV 采用，或 Runway/Google
              以价格平价推出世界模型。披露限制：本章所有财务预测都由假设驱动；截至 2026 年 6 月，Decart 未公开披露收入、ARR、bookings、burn
              rate、毛利率、客户数或留存指标。本章只给出情景区间，明确不能支撑具体投资价格建议。投资者应把 $4 billion 估值视为待验证假设，而非已经验证的市场价格。
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 估值偏贵——没有收入锚点
            body: >
              Decart 的 $4 billion 估值完全由假设驱动。截至 2026 年 6 月，公司没有披露任何收入、ARR、bookings 或盈利指标。当前定价内嵌了游戏模拟、AV 企业合同和电商 API
              采用的牛市执行。按公开可得定价（$0.02/second）和开发者社区规模（约 100,000 个账户）的基准假设，2028E ARR 隐含为 $80-100 million，对应估值约 $1.6-2.0
              billion，较当前定价折价 50-60%。
            calloutType: insight
            claimRefs:
              - CV020
              - CV021
              - CV036
          - type: callout
            title: 反向观点——物理限制带来 AV Thesis 风险
            body: >
              自动驾驶模拟垂直可能代表 Decart 牛市估值的 30-50%。TechCrunch 2026 年 6 月独立评测记录了 Oasis 3 中车辆互相穿透和导航失败——CEO 承认这些物理一致性问题是「a
              major research problem we're cracking now」。如果 AV 客户要求物理精确模拟（这是安全关键应用中合成训练数据的基线要求），这条 thesis 可能完全失效。Decart
              尚未发布带可衡量里程碑的物理精度路线图。
            calloutType: insight
            claimRefs:
              - CV027
              - CV028
              - CV029
