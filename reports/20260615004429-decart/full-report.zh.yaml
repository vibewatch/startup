        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >
              Decart 最接近的公开可比对象，是 AI 视频、世界建模和 AI 游戏基础设施领域的私募市场同行。Runway AI 是功能上最接近的可比公司，2026 年 2 月以 $5.3 billion 估值融资
              $315 million，并公开表示正从创意视频编辑扩展到世界模型，因此是未来直接竞争者，估值比 Decart 高 $1.3 billion。World Labs 在 2026 年 2 月融资 $200
              million，Autodesk 锚定投资，目标是专业 3D 工作流，隐含估值约 $5 billion；它范围比 Decart 更窄，但在 $25 billion 3D 设计软件市场中商业垂直更清晰。Luma
              AI 在 2025 年 11 月从 HUMAIN（Saudi Arabia 国家 AI 基金）获得 $900 million Series C，估值约 $900 million——这是一个总融资额（该轮时
              $450 million）大致等于投后估值的案例，说明投资者对视频生成子领域相当谨慎。Inworld AI 估值超过 $500 million、融资 $100 million，是主要 AI-native
              游戏基础设施同行；其 NPC 角色引擎聚焦更窄，但具有互补性。同行组平均投后估值约 $2.9 billion，Decart 的 $4 billion 比同行均值溢价
              38%。如果实时世界模拟证明比后期视频生成是更高价值架构，该溢价可以成立；但在 Decart 商业指标不透明的情况下，目前仍主要由假设支撑。
            claimRefs:
