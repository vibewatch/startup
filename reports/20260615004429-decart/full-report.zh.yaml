      - number: '4.2'
        title: GTM 动作与开发者飞轮
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Decart 的市场进入策略把自助开发者 API 与通过战略合作伙伴推进的直接企业销售结合起来。开发者主导路径已经形成超过 100,000 名开发者的社区，主要在 Lucy API
              上构建电商虚拟试穿和直播转换用例；2026 年 6 月推出的 Oasis 3 则把自动驾驶模拟开发者作为第二个垂直方向。AWS Bedrock 集成是企业分发锚点，让 Decart 能接触 Amazon
              销售队伍和云市场信誉，而不必从零搭建直接企业销售组织。这降低了前期获客成本，但也把利润率和控制权交给 Amazon 的商业条款。CEO Leitersdorf 将战略投资人 Toyota、Adobe、eBay
              描述为「都可能成为客户」，形成一个被锁定的初始企业管线，但它并不反映独立公平交易下的商业转化。NVIDIA
              既是投资人又是硬件伙伴，也进一步模糊了财务支持与商业需求之间的边界。公司未披露按收入层级划分的客户数、净收入留存或销售周期数据。核心 GTM 风险是：Decart 收入集中在少数超大规模云厂商 DOS
              授权大单，同时拥有庞大但大多尚未产生收入的开发者基础，由此形成杠铃式收入结构——少数大合同抵消高量但低变现的开发者 API 使用——在没有按收入划分客户明细前，整体收入质量很难评估。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI015
