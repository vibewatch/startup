      - number: '7.4'
        title: 合作伙伴、依赖与客户集中度风险
        blocks:
          - type: paragraph
            body: >
              Decart 的 go-to-market 和基础设施策略形成了多层集中度风险。最实质的单一依赖是 AWS/Amazon：Decart 的 Lucy 模型运行在 AWS Trainium3 上，模型通过
              Amazon Bedrock 分发，Amazon 自身又被列为战略客户——Amazon 同时是云服务商、分发渠道和收入来源，形成三重集中。如果 Amazon 开发竞争性内部世界模型能力（考虑到其 AWS AI
              基础设施投入，这并非不可能），或降低 Bedrock 对第三方模型的 shelf-space，Decart 的分发渠道会和基础设施一起塌陷。类似地，Nvidia 既是 Decart
              的主要替代算力供应方，也是股权投资者（Nvidia 参与了 $100M Series B 和 $300M Series C）。一旦 Nvidia 关系出现重大争议或竞争性转向，Decart 的硬件路线图和 cap
              table 观感会同时受影响。投资者 / 客户重叠会放大客户集中度：Toyota Ventures、Adobe Ventures、eBay Ventures
              都是股权投资者，其母公司也被列为战略客户。这一安排对信号质量有利，但会制造不利激励动态——持股客户如果从平台流失，会向市场释放尤其负面的信号。Startupfortune（2026 年 6 月）指出，Decart
              的真实市场是 Waymo/Tesla/Nvidia 层级以下「数十个 AV 项目、机器人实验室和无人机创业公司」——这意味着可变现客户基础更小、资本实力更弱，战略黏性也低于战略投资者 /
              客户。开发者社区（100,000+ 注册）规模很大，但 $0.02/second 的 API 收入高度依赖使用量，典型使用模式下每名开发者收入仍不确定。
