      - number: '2.2'
        title: 规模测算视角、区间与方法限制
        blocks:
          - type: paragraph
            body: >-
              没有单一公开规模测算能覆盖 Decart 的完整机会，因此本章用三个视角锚定。视角 1（游戏生成式 AI，最接近的纯品类）：The Business Research Company 估算该市场 2025 年为
              $1.79 billion，2026 年增至 $2.21 billion，2030 年达到 $5.09 billion，CAGR 为 23.2%，亚太是 2025 年最大区域；Research and
              Markets 转载了几乎相同的 2025–2030 年预测，并把序列延伸到 2035 年，包含确定性和非确定性细分。视角 2（云游戏，作为低延迟、服务器渲染互动娱乐的代理）：BCG 2026 Video
              Gaming Report 估算云游戏 2025 年约 $1.4 billion，2030 年扩至约 $18.3 billion，复合年增长率超过 50%；报告还指出，60% 受访玩家尝试过云游戏，其中 80%
              反馈体验正面。视角 3（UGC 创作者经济，即 Decart 工具所赋能的平台层）：BCG 报告 Fortnite 和 Roblox UGC 创作者分成在 2025 年超过 $1.5 billion，且 40%
              玩家消费的 UGC 多于一年前。这些视角都没有测算 Oasis 3 明确瞄准的 Physical-AI / 世界模型模拟细分；McKinsey State of AI report
              这个最常被引用的跨行业基准，在本次运行中访问被拒。因此本章并列保留三个已引用区间，把游戏生成式 AI 序列视为最直接相关的 SAM 视角，并标注 Physical-AI 模拟是一个证据受限、尚未发布独立测算的
              TAM。
