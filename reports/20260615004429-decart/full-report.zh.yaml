      - number: '8.3'
        title: 总可寻址市场
        blocks:
          - type: paragraph
            body: >
              Decart 覆盖三个重叠市场，成熟度各不相同。BCG Global Gaming Survey 将 2025 年全球游戏市场规模估为约 $210
              billion，这是近期切入口：嵌入游戏引擎的模拟基础设施可采用按 session 或 API call 收费模式，瞄准开发者工具预算的 3-5%；若 Decart 完成工具链集成，仅游戏模拟的
              serviceable addressable market 就可能达到 $1-3 billion。BCG 特别把生成式 AI 识别为游戏行业的主要结构性变化，并预计 2025 年中约 20% 新 Steam
              游戏披露使用 AI（为上一年两倍），游戏行业也正走出三年 post-pandemic 低迷。The Business Research Company 估算，2025 年游戏生成式 AI 市场为 $2.1
              billion，到 2030 年以 30% CAGR 增长至 $10.5 billion——Decart 的实时世界模拟是该细分中的高端产品。Research and Markets 同样将 2025 年生成式
              AI 游戏市场估为 $2.1 billion，并预计到 2030 年 CAGR 为 24%。第二个板块——自动驾驶模拟——可能是最大价值池，但 Decart
              已记录的物理一致性限制让技术风险最高。第三个板块——电商和零售试穿——已通过 Lucy 模型产生 API 收入，是近期 ARR 路径最清晰的部分，尽管 TAM 更小（AI 虚拟试穿约
              $500M-1B）。McKinsey State of AI 报告确认，大型组织企业 AI 采用率已超过 72%，验证了企业需求背景；但 Decart 能分到多少仍未量化。Statista 将 2025
              年全球移动游戏市场规模估为约 $92 billion，这是 Decart API 可直接触达的总游戏 TAM 子集。
            claimRefs:
