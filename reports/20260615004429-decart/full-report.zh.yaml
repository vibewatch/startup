              与许多早期前沿模型产品不同，Decart 面向生产用户露出了清晰的运营界面：公开定价、客户端 token 的
              FAQ、划分输入和输出所有权的条款、可接受使用政策，以及公开状态页。这些材料对尽调有用，因为它们把实际边界说清楚了。浏览器和移动端集成应使用短期客户端 token，而不是永久 API key；活跃会话在
              token 过期后仍会保留；公司也通过专门状态站披露 uptime 历史。法律界面更值得谨慎。条款把输出权利分配给用户，但也为 Decart
