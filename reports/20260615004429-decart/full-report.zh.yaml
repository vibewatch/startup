  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 公开资料显示，客户旅程大致从发现开始，经由自助原型验证进入企业部署，再走向合作伙伴主导的扩张。
    data:
      items:
        - label: 发现
          value: Find Decart through docs, press, AWS ecosystem, or GitHub
        - label: 原型
          value: Test self-serve pricing, SDKs, and example repos for a narrow workflow
        - label: 评估
          value: Assess model quality, latency, and enterprise fit for the intended vertical
        - label: 部署
