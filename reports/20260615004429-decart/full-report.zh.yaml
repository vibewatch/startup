        blocks:
          - type: paragraph
            body: >-
              公开时间线从 2023 年底创立开始，经 2024 年 10 月 31 日退出隐身和 Oasis 病毒式演示，进入 2025 年扩张期（Mirage 发布、$100 million Series B、旧金山
              R&D 中心、员工数从约 15 人增至约 60 人），再到 2026 年战略基础设施推进（DOS 2.0 发布、围绕 Lucy2 的 AWS Trainium3 合作、Amazon 战略客户认定、Radical
              领投的 $300 million 轮融资和约 $4 billion 估值，以及 2026 年 6 月 10 日 Oasis 3 Preview 以每秒 $0.02 登陆公共 API）。Decart 公开称
              Lucy 响应时间低于 30 毫秒，DOS 栈可交付超过 100-fps 的全高清推理和超过 1,600 tokens-per-second 的智能体吞吐；公司还称服务的开发者社区超过 100,000
              名。负面和不确定信号与增长故事并存：TechCrunch 2024 年 10 月对 Oasis 的评测指出未解决的版权问题，因为模型训练使用了 Minecraft 画面，却未披露 Microsoft
              授权；TechCrunch 2026 年 6 月对 Oasis 3
              的评测称长生成会退化、汽车会穿过其他汽车，物理一致性仍是开放研究问题；经审计收入、确切当前员工数、逐项股权结构和独立董事会构成仍未进入公开记录。因此本章保留的判断是：Decart
              是一家扩张快、资本充足、偏基础设施的世界模型实验室；关键尽调变量仍是创始人集中度、未披露财务细节，以及超真实演示与生产级物理之间的差距。
