      - number: '1.2'
        title: 创始人、领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Decart 由 Dr. Dean Leitersdorf（CEO）和 Moshe Shalev（CPO）于 2023 年底创立，两人是在以色列军事情报部队 Unit 8200
              服预备役时相识。Leitersdorf 在 24 岁前就在 Technion 取得三个计算机科学学位和博士学位；Shalev 成长于以色列 Bnei Brak 的极端正统派社区，后来服役于 Unit
              8200，并加入 Decart 负责运营与产品。公开材料还显示，DreamBooth 扩散调优技术的共同创造者、Snap 和 Google 前高级研究员 Dr. Kfir Aberman，自 2025 年 8 月
              Series B 起领导公司旧金山 R&D 中心。Decart 自己 2026 年 5 月的公告仍把 Leitersdorf 作为面向公众的 CEO
              和主要发言人；所有已审阅来源中，公司都没有公布独立董事会构成或治理披露。这个模式叠加报道中点名的高管面较窄，说明即便在 Radical 领投 $300 million 之后，公司仍高度依赖
              Leitersdorf，治理图景也仍偏薄。Decart 是一家 Delaware C-corp，通过投资人和行业新闻稿以 Decart.AI, Inc.
              名义对外营销；公开记录尚未说明外部董事、审计委员会或独立董事长。
