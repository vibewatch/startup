      - number: '3.5'
        title: 负面动态：物理一致性限制、内部自建与买方谨慎
        blocks:
          - type: paragraph
            body: >-
              TechCrunch 在发布时的独立测试发现，Oasis 3 的环境主题完整性会在长时间交互中快速退化——一个 New York City
              街道提示最初生成了强场景，但很快变成泛化的西部城市环境，模型也无法在导航中保留地理地标。更关键的是，Oasis 3 中车辆会彼此穿过，说明模型尚未正确模拟刚体物理。Decart CEO
              承认这是「我们正在攻克的重大研究问题」，并将其归因于正常驾驶和碰撞场景之间的数据不平衡。


              这些限制很重要，因为评估 Oasis 3 用于边缘案例合成数据生成的 AV 公司，在投入训练预算前，需要验证生成场景能否迁移到真实世界行为。不尊重物理的合成数据，可能把分布伪影引入已训练的感知或规划模型。


              在内部自建维度，Waymo、Tesla、NVIDIA 和 Wayve 都在内部构建可比的世界模型模拟。因此 Decart 真正可服务市场，是无法自筹世界模型研究努力的第二、第三梯队 AV
              项目、机器人实验室和无人机初创公司。可服务客户集中在中端梯队，会压低近期收入天花板；如果大型客户数量很少，也会带来集中度风险。
