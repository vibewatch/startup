      - number: '4.3'
        title: 成本结构、毛利驱动与资本强度
        blocks:
          - type: paragraph
            body: >
              Decart 的成本结构由算力和 R&D 薪酬主导；公司采用租用 Amazon Trainium3、NVIDIA GPU 和 Google TPU 容量的轻资产模式，因此没有自有硬件资本开支。规模化托管推理
              API 业务的毛利率通常会达到 50–80% 的软件定义服务区间，但 Decart 的实际利润率关键取决于它与超大规模云厂商签订的算力协议条款、Trainium3 相对标准 NVIDIA 实例定价的成本，以及
              DOS 授权收入是否比 API 使用拥有显著更高利润率。公开说法中，DOS 优化层在 Trainium3 上实现超过 80% Model FLOPS Utilization——这是 AWS VP Nafea
              Bshara 引用的硬件效率指标——并把每条视频的生产成本从数百或数千美元降至低于
              $0.25。若属实，这些效率提升会相对使用标准推理基础设施的同业，直接转化为毛利改善。不过，这些都是公司主张的基准，没有独立第三方审计。随 $300M 融资一起发布的 DOS 2.0 声称智能体推理达到
              1,600+ tokens per second，而行业平均约 200 tokens per second，世界模型最高达到 100 frames per second。如果成本优势确如描述，Decart 的
              API 收入毛利率可能显著高于商品化推理 API 利润率。60+ 名员工的 R&D 薪酬（许多具备深厚底层系统和 HPC 专长）增加了显著固定成本基础。公司没有公开披露
              COGS、毛利率、员工成本或任何单位经济指标。
