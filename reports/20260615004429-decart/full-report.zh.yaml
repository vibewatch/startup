      - number: '5.2'
        title: Oasis 3 API 机制与工作流
        blocks:
          - type: paragraph
            body: >-
              Oasis 3 文档展示的是一套真实运行工作流，而不是模糊的演示叙事。开发者连接托管 gRPC 端点，用文本提示初始化场景，然后反复发送由四组油门和转向配对组成的固定动作块。服务会为每条已标示的摄像头流返回四帧
              RGB，文档将这些摄像头描述为左前、正前和右前。这个接口支撑了一个具体主张：产品为闭环推理而建，不是一次性视频渲染。文档还包含 RL
              示例和碰撞风险演示，使产品比缺乏可复现机制的研究预览明显更接近开发者可用。不过，公开证据尚未显示许多 AV 技术栈想要的更丰富模拟模态，例如
              lidar、分割或显式物理状态导出，因此当前公开产品最强的用途，似乎是摄像头优先 实验和早期工作流集成，而不是完整替代模拟器。
