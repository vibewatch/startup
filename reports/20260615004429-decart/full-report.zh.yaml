      - number: '8.4'
        title: 收入情景与财务建模
        blocks:
          - type: paragraph
            body: >
              由于没有任何公开收入数据，估值建模只能靠假设情景构建。主要收入驱动因素包括：（A）电商和直播的 Lucy 模型 API 费用（当前 traction）；（B）Oasis 3 游戏模拟 API 费用，定价
              $0.02/second（2026 年 6 月推出）；（C）潜在 AV 企业合同（尚未宣布，暂无公开证据）。CBInsights 确认 Decart 未公开披露 ARR 或财务指标。牛市情景下，Decart 将
              100,000+ 开发者社区转化为付费客户，即便留存适中，也拿下 3-5 个企业游戏或 AV 合同，到 2026 年底达到 $30 million ARR、2028 年达到 $200 million；按 20x
              forward multiple，可支撑当前估值。基准情景下，采用更慢，Decart 到 2026 年底达到 $15 million ARR，2028 年达到 $80-100 million；按 20x
              multiple，隐含估值 $1.6-2.0 billion，相比当前 $4 billion 定价显著折价。熊市情景下，物理失败关闭 AV 市场，Runway 和 Google 竞争限制游戏采用；Decart
              2028 年 ARR 仅 $25 million，按 20x 估值为 $500 million，较当前定价折价 87.5%。Roblox Corporation 的 SEC 10-K
              文件提供了公开公司锚点：Roblox 2025 财年收入约 $3.9 billion，市值接近 $26 billion，隐含 price/revenue multiple 约 6-7x；这说明即便 Decart
              达成牛市收入，若按成熟阶段倍数，要支撑 $4 billion 市值也需要异常出色。
            claimRefs:
