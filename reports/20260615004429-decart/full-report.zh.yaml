      - number: '3.2'
        title: 竞争对手画像：Runway、World Labs、DeepMind/Genie 3、Luma AI、Inworld 与 Rosebud
        blocks:
          - type: paragraph
            body: >-
              Runway 于 2026 年 2 月完成 $315 million Series E，估值几乎翻倍至 $5.3 billion。公司最知名的是具备物理感知的视频生成（Gen
              4.5），并明确在为媒体以外的产品和行业预训练「下一代世界模型」。Runway 已与 Adobe 建立合作，并在扩展到游戏和机器人，使其成为 Decart 的 Lucy
              模型在创意和媒体工作流中最直接的前沿同业。它与 CoreWeave 有算力合作，2026 年 2 月团队约 140 人。


              World Labs 于 2026 年 2 月融资 $1 billion，其中包括 Autodesk 的 $200 million，估值据报目标为 $5 billion。公司由 Fei-Fei Li
              创立，Marble 产品可从图像、视频或文本生成可编辑、可下载的 3D 环境。Autodesk 合作最初聚焦媒体和娱乐用例，并把 World Labs 定位为 Decart Oasis 世界在 3D
              内容创作工作流中最接近的空间 AI 同业，但不是实时驾驶模拟同业。


              Google DeepMind 的 Genie 3 于 2025 年 8 月以研究预览形式发布，可在 24 fps 和 720p 下生成交互世界，支持可提示的世界事件，并已驱动 Waymo
              的内部模拟架构。它没有作为公开商业 API 提供，这给 Decart 留出了一个时间窗口，直到 Google 可能向外部变现这一能力。


              Luma AI 于 2025 年 11 月融资 $900 million，并在沙特拥有 2-gigawatt AI 超级集群合作。公司主要以 Dream Machine
              和视频生成知名，世界模型是已声明的未来方向。Inworld AI 转向面向消费者陪伴应用的实时语音 AI，在 $500 million 估值下 19 天获得 100 万用户，不再是直接模拟竞争者。Rosebud
              AI 专注文本到 3D 游戏创作，代表开发工具替代，而不是推理基础设施竞争者。
