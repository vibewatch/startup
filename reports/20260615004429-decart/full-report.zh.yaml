      - number: '3.3'
        title: Decart 差异化：实时延迟、DOS 成本护城河与开发者生态策略
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Decart 的核心差异化建立在三根支柱上，竞争对手尚未在生产系统中匹配。第一，实时推理延迟：Lucy 的首帧时间低于 30 毫秒，并通过针对 Amazon Trainium3 优化的
              DOS 栈生成最高 100 帧 / 秒，而 Genie 3 是 24-fps 的研究专用管线。第二，成本效率：Decart 称借助 DOS，相比可比系统成本效率提升 100x；DOS 在 Trainium3
              硬件上实现超过 80% Model FLOPS Utilization。第三，开发者生态：Oasis 3 从第一天起就以公共 API、每秒 $0.02 定价，Decart 正在构建让 OpenAI 文本 API
              变得粘性的同一类开发者生态飞轮——这家初创公司已经有超过 100,000 名开发者在 Lucy 上构建。


              DOS 栈的架构差异在于它能运行在任意硬件（NVIDIA GPU、Amazon Trainium、Google TPU）上，而不是绑定单一云服务商。Oasis 3
              生成三路同步摄像头画面（正前方加两个侧前方），匹配多数摄像头优先 AV 栈的感知设置。Decart CEO 称公司累计支出「远低于」$100 million，尽管融资超过 $450 million；若属实，说明
              DOS 成本效率不仅作用于外部销售，也作用于内部推理经济性。不过，这是公司主张指标，没有独立审计佐证。


              关键战略押注是：负担不起 Google-DeepMind 级研究预算的中型 AV 公司、机器人初创公司和无人机项目，会选择以 $0.02/sec 租用 Oasis 模拟，而不是自建内部系统——CEO
              估算全球有数十个这样的可服务项目。
