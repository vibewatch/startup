  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性框架
        blocks:
          - type: paragraph
            body: >
              Decart 面临多层风险堆栈，相比 $4 billion 估值和早期收入阶段，风险偏高。公司处在三个高风险监管区的交叉点：生成式 AI 版权法（训练数据责任）、EU AI Act（实时 AI 系统），以及
              2026 年加速推进的美国州级 AI 治理框架。监管悬顶之外，公司的核心技术——自回归世界模型——存在有记录的可靠性限制，而且这些限制是架构性的，不是表面问题：TechCrunch 对 Oasis 3
              的独立评测（2026 年 6 月）发现，生成几分钟内就出现物理一致性失败和上下文窗口退化，CEO 也承认这些是持续研究问题。运营上，Decart 集中使用 AWS Trainium3 基础设施，并依赖
              Amazon Bedrock 做 go-to-market，基础设施层存在单点卡脖子模式。竞争上，Google DeepMind（Genie 3）、Waymo（基于 Genie 3
              的内部世界模型）、Runway（$5.3B、$315M Series E、2026 年 2 月）和 Luma AI（$900M Series
              C）都在推进，资源显著更多，或战略位置更可防守。风险热力图（FR001）按可能性和报告缓释后的剩余影响绘制这些主题。最集中的风险——版权责任和竞争替代——落在高可能性、高影响象限。
