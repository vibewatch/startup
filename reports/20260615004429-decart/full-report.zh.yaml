  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 截至 2026 年中，Decart 拥有独特实时延迟（<30ms），没有商业同侪
        - Google DeepMind Genie 3 可能推出商业 API；NVIDIA DRIVE Sim 已能在受控 AV 环境中接近实时运行
        - 高
        - 跟踪 Genie 3 商业化路线图；把 Oasis 3 延迟基准与 2026 年下半年任何新的商业版本对比
      - - DOS 成本栈支撑 Decart 相比可比系统 100x 效率主张
        - Runway、World Labs 和 Luma AI 已为算力扩张融资数亿美元；云服务商可能用标准内核把推理效率商品化
        - 中
        - 要求 100x 主张的独立基准证明；评估 DOS 效率来自硬件协同设计，还是来自可复制的模型架构选择
      - - 100K+ 开发者社区在既有玩家发货前形成 API 粘性
        - Genie 3 拥有 Google Developers 生态；Runway 和 World Labs 已有创意社区；若 API 合同不是长期合同，切换成本较低
        - 中
        - 评估开发者留存率和再激活率；理解合同期限和单个开发者平均 API 支出
      - - 通过 Bedrock 与 Trainium3 合作接入 AWS 分发，给 Decart 带来企业触达
        - AWS Bedrock 是多供应商平台；Amazon 会在同一市场提供竞争模型；若竞争世界模型进入 Bedrock，分发优势会消失
        - 中
        - 审阅 AWS 排他条款和联合销售承诺；评估 Toyota、Adobe、eBay 的投资人 / 客户关系是否能在 AWS 之外形成多元分发
      - - Oasis 3 是唯一按零售价提供的照片级多摄像头驾驶仿真生产 API
        - 物理一致性问题（刚体、实体碰撞）会削弱 AV 公司信心；Waymo 内部使用 Genie 3，为顶级 AV 项目自建树立先例
        - 高
