  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: |
      风险热力图按发生可能性（x 轴）和对投资论点的剩余影响（y 轴）绘制 Decart 的关键投资风险。每个单元格列出该象限的主要风险主题。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - label: EU 版权追溯性营业额征费（拟议）
              tone: warning
            - label: AWS / Bedrock 竞争替代；未达收入里程碑导致下轮估值下调
              tone: negative
            - label: 物理失败阻断 AV 市场；版权诉讼（集体诉讼）
              tone: negative
        - label: 高影响
          values:
            - label: CEO 离职；US Copyright Office 约束性规则
              tone: warning
            - label: Nvidia 竞争转向；以色列地缘政治扰动；企业客户流失
              tone: warning
            - label: 模型性能相对 Google DeepMind / Runway 触顶；监管执法
              tone: negative
        - label: 中等影响
          values:
            - label: Kfir Aberman 离职；州级 AI 治理合规负担
              tone: neutral
            - label: 开发者社区迁移；内容审核事件
              tone: warning
            - label: 上下文窗口退化限制会话长度；人才流向超大规模云厂商
              tone: warning
        - label: 低影响
          values:
            - label: （未识别）
              tone: neutral
            - label: AWS Trainium3 硬件分配延迟
              tone: neutral
            - label: 提示注入 / 越狱事件（孤立）
              tone: neutral
    claimRefs:
      - CR001
      - CR007
      - CR015
      - CR022
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: |
      有向无环图展示根因触发事件如何级联为 Decart 投资的下游破题结果。
    data:
      nodes:
        - id: copyright_eu
          label: EU 版权可反驳推定立法生效
        - id: physics_fail
          label: AV 客户确认物理失败
        - id: aws_compete
          label: Amazon 推出竞争性 Bedrock 世界模型
        - id: model_plateau
          label: Google DeepMind / Runway 达到价格质量平价
        - id: ceo_depart
          label: CEO Leitersdorf 离职
        - id: revenue_miss
          label: 收入同比增长 <100%；下一轮估值持平
        - id: customer_churn
          label: 战略投资方 / 客户（Toyota/Adobe）流失
        - id: regulation_action
          label: EU / US 监管执法行动立案
        - id: eu_market_loss
          label: EU 市场准入受限
        - id: av_thesis_break
          label: 物理 AI 论点崩塌；TAM 收缩至仅电商
        - id: valuation_compress
          label: Series D / IPO 估值倍数压缩
        - id: down_round
          label: 下轮估值下调或融资缺口
      edges:
        - from: copyright_eu
          to: regulation_action
        - from: copyright_eu
          to: eu_market_loss
        - from: physics_fail
          to: av_thesis_break
        - from: aws_compete
          to: customer_churn
        - from: model_plateau
          to: customer_churn
        - from: ceo_depart
          to: revenue_miss
        - from: revenue_miss
          to: down_round
        - from: customer_churn
          to: revenue_miss
        - from: regulation_action
          to: eu_market_loss
        - from: eu_market_loss
          to: valuation_compress
        - from: av_thesis_break
          to: valuation_compress
        - from: down_round
          to: valuation_compress
    claimRefs:
      - CR007
      - CR015
      - CR022
      - CR033
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: |
      Decart 关键外部依赖的有向无环图。节点代表系统、供应商或实体；边代表依赖关系（上游 → 下游故障路径）。
    data:
      nodes:
        - id: aws_trainium
          label: AWS Trainium3（Lucy 模型算力）
        - id: amazon_bedrock
          label: Amazon Bedrock（分发渠道）
        - id: nvidia_gpu
          label: Nvidia GPU / 硬件（DOS 优化与训练）
        - id: dos_stack
          label: DOS 优化栈（Decart 自有）
        - id: lucy_model
          label: Lucy 模型（实时视频 API）
        - id: oasis3_model
          label: Oasis 3 模型（AV / 物理 AI API）
        - id: developer_api
          label: 开发者 API（100K+ 社区）
        - id: enterprise_av
          label: AV / 机器人企业客户
        - id: strategic_customers
          label: Toyota、Adobe、eBay（投资方 / 客户）
        - id: investor_base
          label: Radical、Sequoia、Benchmark（财务支持方）
      edges:
        - from: aws_trainium
          to: lucy_model
        - from: aws_trainium
          to: oasis3_model
        - from: amazon_bedrock
          to: developer_api
        - from: nvidia_gpu
          to: dos_stack
        - from: dos_stack
          to: lucy_model
        - from: dos_stack
          to: oasis3_model
        - from: lucy_model
          to: developer_api
        - from: oasis3_model
          to: enterprise_av
        - from: developer_api
          to: strategic_customers
        - from: enterprise_av
          to: investor_base
        - from: strategic_customers
          to: investor_base
    claimRefs:
      - CR022
      - CR023
      - CR024
  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: |
      流程图展示从市场、技术、财务输入到最终 TRACK 建议的证据链，并带有高风险和估值偏高的框架。每个节点代表一个关键证据点或结论，箭头表示逻辑依赖。
    data:
      nodes:
        - id: market_evidence
          label: 大市场顺风 — $210B 游戏市场 + GenAI 作为主驱动（BCG 2026）
          detail: BCG 证实 20% 的 Steam 游戏使用 AI，游戏行业走出寒冬
        - id: tech_evidence
          label: 独特实时世界模型 — 低于 100ms 延迟，缺少近似同行
          detail: Oasis 3、Lucy 模型；驾驶模拟 2026 年 6 月上线
        - id: capital_evidence
          label: 已融资 $450M，AWS Trainium3 生产交易，Radical/Nvidia/Sequoia 背书
          detail: 战略投资方兼客户（Toyota、Adobe、eBay）形成利益绑定
        - id: risk_evidence
          label: Oasis 3 已确认物理失败；没有公开收入或财务披露
          detail: TechCrunch 2026 年 6 月评测；CBInsights 证实没有财务数据
        - id: valuation_evidence
          label: $4B = 较同行均值溢价 38%；基准情形意味着折价 56%
          detail: 只有 2028E ARR $200M+ 的牛市情形，才能以 20x 支撑当前价格
        - id: recommendation
          label: TRACK — 中等信心，高风险，估值偏高
          detail: 上调触发条件：ARR $25M+，并有经审计财务与 AV 合同
      edges:
        - from: market_evidence
          to: recommendation
        - from: tech_evidence
          to: recommendation
        - from: capital_evidence
          to: recommendation
        - from: risk_evidence
          to: recommendation
        - from: valuation_evidence
          to: recommendation
    claimRefs:
      - CV017
      - CV034
      - CV035
      - CV027
      - CV028
      - CV038
  - id: FV002
    title: ARR 假设下的估值敏感性
    type: bar
    layout: wide
    summary: |
      条形图展示在固定 20x 收入倍数下，Decart 的隐含估值如何随不同 2028E ARR 假设变化。图中呈现当前 $4B 价格与情景隐含价值之间的差距。所有 ARR 数字均由假设驱动；没有公开收入数据。
    data:
      items:
        - label: 熊市（2028E $25M ARR × 20x）
          value: 0.5
          detail: 物理失败阻断 AV 市场，Runway 在游戏场景替代 Decart 的情景
        - label: 基准（2028E $88M ARR × 20x）
          value: 1.75
          detail: API 在游戏和电商中采用；无 AV 收入；较当前折价 56%
        - label: 当前 $4B 价格
          value: 4
          detail: 2026 年 5 月 Series C 投后估值；需要牛市情形兑现才站得住
        - label: 牛市（2028E $200M ARR × 20x）
          value: 4
          detail: 游戏 SDK + AV 企业合同；开发者社区转化率 2-3%
        - label: Runway Series E（$5.3B）
          value: 5.3
          detail: 最接近的可比公司，已有披露的商业收入；2026 年 2 月
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV025
      - CV039
  - id: FV003
    title: 分情景估值回报区间
    type: range
    layout: wide
    summary: |
      区间图展示熊市、基准、牛市情景下 Decart 的隐含股权估值，置信区间反映假设驱动预测的不确定性。当前 $4B 价格位于区间顶部。所有数字均由假设驱动；Decart 没有披露任何财务指标。
    data:
      items:
        - label: 熊市情景（物理失败，采用缓慢）
          low: 0.3
          high: 0.8
          unit: $B
          detail: 2028E ARR $15-40M 对应 20x；按中点较当前折价 87.5%
        - label: 基准情景（API 扩张，无 AV）
          low: 1
          high: 2.5
          unit: $B
          detail: 2028E ARR $50-125M 对应 20x；较当前折价 38-75%
        - label: 牛市情景（游戏 + AV 企业）
          low: 3.5
          high: 6
          unit: $B
          detail: 2028E ARR $175-300M 对应 20x；达到或高于当前价格
        - label: 当前 $4B 入场价格
          low: 4
          high: 4
          unit: $B
          detail: 2026 年 5 月 Series C；需要牛市情形兑现才有正回报
        - label: 私募同行区间（Luma 到 Runway）
          low: 0.9
          high: 5.3
          unit: $B
          detail: 同行组区间；Luma $0.9B 到 Runway $5.3B（2026 年 2 月）
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV026
  - id: FV004
    title: 投资 KPI — Decart 记分卡
    type: kpi
    layout: wide
    summary: |
      IC 可用的 KPI 记分卡，从六个投资维度评估 Decart：市场、技术证明、竞争护城河、财务证据、风险画像和估值。评分是基于公开来源的证据评估。红 / 黄 / 绿依据截至 2026 年 6 月可获得的证据分配。
    data:
      items:
        - label: 市场机会
          value: 8/10
          unit: score
          detail: 游戏 TAM 大（$210B+），GenAI 顺风已被确认（BCG），电商和 AV 垂直正在出现
        - label: 技术证明
          value: 7/10
          unit: score
          detail: 实时世界模型在当前延迟水平下具备独特性；Oasis/Minecraft 和 Lucy 已商业发布
        - label: 竞争护城河
          value: 6/10
          unit: score
          detail: AWS Trainium3 与 Amazon Bedrock 合作；但 Runway、World Labs、Google Genie 在推进
        - label: 财务证据
          value: 2/10
          unit: score
          detail: 未公开披露 ARR、收入、预订额、毛利率或烧钱速度；所有财务数据都是估算
        - label: 风险画像
          value: 4/10
          unit: score
          detail: 物理失败已有记录；版权风险敞口；客户集中度未知；高风险
        - label: 估值纪律
          value: 3/10
          unit: score
          detail: $4B 缺少收入锚点；基准情形意味着折价 56%；只有牛市情形支撑当前价格
    claimRefs:
      - CV011
      - CV033
      - CV035
      - CV036
      - CV027
      - CV021
