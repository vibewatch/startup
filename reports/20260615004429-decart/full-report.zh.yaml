  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Decart 经营三条有公开文档的收入流。第一条——也是历史上最早的一条——是向主要云服务商、AI 实验室和超大规模基础设施公司授权
              DOS，合同金额达数百万美元。基于这项优化栈的盈利能力，CEO 才能在 2025 年 8 月声称 Decart 在已融资的 $153 million 中花费不到 $10 million，并靠授权收入覆盖数千万美元
              GPU 算力成本。第二条是 API 按秒付费：Lucy 2.1（实时视频编辑，720p）每生成秒定价 $0.02，Lucy Restyle 2（风格迁移）每秒 $0.01，Oasis 3
              Preview（physical AI 与驾驶模拟）自助访问每秒 $0.02，上一代 Lucy Clip 每秒 $0.15。Oasis 3 和定制部署的企业定价取决于用例，未公开披露。第三条是通过 AWS
              Bedrock 做企业分发，作为 2026 年 5 月 $300M Series C 的一部分宣布，使               Amazon 企业客户群能够在定制商业条款下访问 Decart
              技术，用于媒体、商业、广告和 Physical AI 用例。各收入流的收入确认动态不同：DOS 授权合同可能按交付完成或可摊销授权确认；按秒付费 API 收入随消耗确认；Bedrock
              企业合同会遵循协商后的多年交付计划。这些收入流之间的组合及各细分相对规模均未公开披露，构成收入质量的首要尽调缺口。
