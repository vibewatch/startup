        - 没有实时互动 API；生产重点是创意工作流，不是仿真
      - - World Labs
        - 直接空间 AI / 世界模型实验室
        - $1B 融资，包括 Autodesk $200M；目标估值约 $5B（2026 年 2 月）
        - 设计、娱乐、建筑；与 Autodesk 做 3D CAD 集成
        - Marble 3D 环境创建、Fei-Fei Li 的学术背书
        - 产品只能下载 3D，不是实时驾驶仿真；商业范围仍早期
      - - Google DeepMind / Genie 3
        - 在位研究实验室 / 内部仿真
        - Alphabet 内部 R&D 预算近乎无限
        - 研究社区；内部 Waymo 仿真；未来企业业务待定
        - 24 fps / 720p 互动世界生成、可由提示词触发世界事件，被 Waymo 使用
        - 仅研究预览，没有公开付费 API；部署时间线未披露
      - - Luma AI
        - 相邻视频 / 世界模型实验室
        - $900M Series C，由 Humain 领投（2025 年 11 月）；2-GW 沙特 AI 超级集群合作
        - 按已披露路线图，面向创意、游戏和 AV 行业
        - Dream Machine 视频生成；已声明世界模型方向，但尚未作为 API 发布
        - 截至 2026 年中没有实时互动仿真 API；产品成熟度低于 Runway
      - - Inworld AI
        - 相邻 / 游戏实时语音 AI
        - $50M 融资，估值 $500M；总融资超过 $100M
        - 消费级陪伴应用、游戏角色 AI；OtherHalf 产品 19 天获 100 万用户
        - 实时语音 AI，TTS 低于 $13 / 100 万字符；已从游戏 NPC 引擎重心转向
        - 不是世界模型竞争对手；买方细分不同于 Oasis（仿真 vs 角色 AI）
      - - Rosebud AI
        - 相邻 / AI 游戏创建
        - 种子阶段；Crunchbase 上公开融资数据有限
        - 独立开发者用文本提示创建 3D 游戏
        - 无代码游戏创建，非工程师也能上手
        - 没有实时推理或仿真能力；不是 Oasis 或 Lucy 的替代品
      - - 内部 AV 仿真（Waymo / Tesla / NVIDIA / Wayve）
        - 现状 / 内部自建
        - 顶级 AV 项目近乎无限；NVIDIA DRIVE Sim 预算未披露
        - 顶级 AV OEM 和一级 AV 项目，且内部有世界模型 R&D
        - 自有传感器数据、物理引擎集成、监管熟悉度
        - 外部买方无法获得；可寻址市场只剩自筹项目
      - - 现状：没有世界模型仿真（手工采集数据 + 传统仿真器）
        - 现状 / 替代品
        - 零新增资本开支；使用现有传感器车队和传统游戏引擎仿真器
        - 不愿按秒支付生成成本的 AV 项目；更小团队
