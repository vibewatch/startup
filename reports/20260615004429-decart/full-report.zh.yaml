              Decart 已对其主要风险采取了有意义但不完整的缓释措施。监管：AUP（2026 年 2 月）明确引用 EU AI Act、DSA 和
              DMCA；这显示了监管意识，但不能替代训练数据透明度义务或许可框架。技术：CEO 已公开承认物理一致性和上下文窗口限制，并称有主动研究项目；下一代模型预计会解决视频播种的世界生成，可能改善一致性。基础设施：AWS
              Trainium3 交易提供性能效率，但加重 AWS lock-in；未发现公开 multi-cloud fallback。人员：SF R&D center 招聘 Dr. Kfir Aberman
              带来了地域和人才多元化，但没有解决联合创始人集中度。缓释和 kill-criteria 表（TR005）把每个主要风险映射到可监测触发器和投资 thesis
