chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营模式与产品表面
        blocks:
          - type: paragraph
            body: >-
              Decart 将自己描述为一家创立于 2023 年、完全纵向一体化的前沿 AI 研究实验室，既构建最先进的实时世界模型，也构建运行这些模型所需的超优化基础设施。公司 2026 年 5
              月的融资新闻稿把业务框定为共用同一栈的三条产品线：Lucy 是面向沉浸式视频和交互体验的实时世界模型；Oasis 是面向 Physical AI 和机器人模拟的实时世界模型；DOS 是 Decart
              Optimization Stack，可将模型权重编译到 NVIDIA GPU、Google TPU 和 Amazon Trainium 芯片上。Decart 通过 platform.decart.ai
              按用量销售 API 访问；Lucy 2.1 和 Oasis 3 Preview 等实时模型的定价约为每秒主动生成
              $0.02，图像编辑则是单美分级单价，并通过销售联系人提供企业定价。公司运营锚点在特拉维夫，已披露办公室包括以色列北部、旧金山和纽约，并于 2025 年在旧金山开设由 Dr. Kfir Aberman 领导的
              R&D 中心。2026 年前的产品表面还包括 Mirage，这是 Decart 的直播扩散模型，公司将其定位为 Lucy 系列实时视频模型的前身。
