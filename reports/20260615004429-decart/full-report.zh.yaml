      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              2026 年 5 月 $300M Series C 后，Decart 总资本化超过 $450 million。融资时间线包括约 $53 million 的种子和早期轮次、$100 million Series
              B（2025 年 8 月，估值 $3.1 billion，由既有投资人 Sequoia、Benchmark、Zeev 领投，加上新投资人 Aleph VC），以及约 $4 billion 估值的 $300
              million Series C（2026 年 5 月，由 Radical Ventures 领投，战略参与方包括 NVIDIA、Toyota Ventures、Adobe Ventures、eBay
              Ventures，Amazon 是战略客户）。JSL Decart.AI Coinvest, L.P.（CIK 0002084011）于 2025 年 9 月提交的 SEC Form D 确认，为 Series
              B 成立了 Delaware LP 共同投资载体，但文件对投资人构成或估值机制提供的额外细节很少。CEO Leitersdorf 于 2025 年 8 月称，Decart 在 $153 million
              资本中花费不到 $10 million，运营成本由 DOS 授权收入覆盖。              2026 年 6 月，他把口径改为累计支出「远低于 $100 million」——与 2025 年 8
              月说法一致，但不如前者精确。两项数字都来自 CEO 表述，没有独立审计或董事会证明。若按表面接受累计支出说法，Decart 进入 2026 年中时约有 $350–$440 million
              现金，即便月度消耗显著高于 CEO 暗示的低于 $1M/month，也意味着多年资金跑道。战略投资人也参与商业：NVIDIA 作为硬件伙伴和 DOS 分发载体，Amazon 作为客户和 Bedrock
              分发渠道，Toyota、Adobe、eBay 则作为潜在客户和企业需求验证者。这制造了融资—商业共依赖：投资条款可能部分基于商业承诺，从而削弱两种信号的独立性。
