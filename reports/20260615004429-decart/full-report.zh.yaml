        title: 技术栈定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Decart 将公司定位为纵向一体化研究实验室，而不是单一模型供应商。公开技术栈分成三层：DOS 是优化和推理层；Lucy 是服务商业、流媒体、游戏和直播媒体的实时视觉转换与试穿产品族；Oasis 3 是用于闭环
              Physical-AI 模拟的可提示世界模型。产品表面可通过云 API 访问，并提供官方 SDK 和公开定价，这比许多前沿模型发布更具体。与此同时，Decart 仍在快速切换叙事：2024 年 Oasis
              发布以类似 Minecraft 的交互演示为中心，随后 Lucy 成为直播视频用例中可见的生产产品，2026 年 Oasis 3 发布又把公司重新框定在 Physical AI
              和自动驾驶模拟周围。这种宽度在战略上有吸引力，但也意味着买方仍需要尽调：技术栈中已有多少被产品化，多少仍由研究驱动。
