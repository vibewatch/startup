      - number: '8.5'
        title: 估值框架、风险因素与 Thesis 破裂点
        blocks:
          - type: paragraph
            body: >
              当前 $4 billion 估值可拆成三部分：（1）已展示的技术 optionality——在当前延迟和保真度规格下独特的实时世界模型架构；（2）基础设施合作溢价——AWS Trainium3 生产交易和
              Amazon Bedrock 分发，提供了多数同阶段初创公司没有的规模；（3）战略投资者溢价——客户兼投资者结构意味着早期采用概率较高。反面 thesis 同样实质：TechCrunch 2026 年 6
              月独立评测记录了 Oasis 3 物理一致性失败，CEO 承认这是正在攻关的研究问题，说明核心产品限制不是表面瑕疵。CBInsights 因缺乏财务披露将 Decart 评为高风险。物理限制是 AV 垂直的关键
              thesis-break 触发器，而 AV 可能占牛市估值的 30-50%。另外三个 thesis-break 触发器是：（A）到 2026 年 Q4 仍无法展示 enterprise-grade
              ARR；（B）EU 针对 Decart 训练数据发起重大版权执法行动；或（C）Runway 或 Google 在 12-18 个月内推出价格 / 质量有竞争力的实时世界模型。按当前可比估值，AWS 和
              Nvidia 战略合作不足以解释相对同行的溢价：Runway 也有类似战略关系（Adobe 潜在收购候选），并披露了商业
              traction。任何建议升级到「跟踪」以上之前，尽调会议必须拿到经审计收入、毛利率、burn rate 和客户集中度数据。
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
