    rows:
      - - 游戏生成式 AI（核心 SAM 口径）
        - 工作室和创作者在程序化内容、关卡 / 世界生成、NPC 行为、叙事、自适应个性化、AI QA 工具上的支出（TBRC / Research and Markets 定义）
        - GPU 硬件资本开支；博彩收入；非实时 VFX
        - 游戏工作室、引擎团队、UGC 平台（CTO / 内容负责人掌握预算）
        - Lucy 和 Oasis 直接瞄准游戏与互动娱乐的实时生成；这是公开规模数据最接近的资金池。
      - - 云游戏和实时互动视频
        - 纯流媒体玩家，以及在远端渲染并分发画面的混合 / 捆绑式云游戏服务（BCG 定义）
        - 设备端主机 / PC 计算；广播级流媒体基础设施；静态 OTT 视频
        - 云游戏平台和玩家终端客户（消费者）
        - Decart 低于 30 ms 的响应时间和 DOS 基础设施，切中同一类对延迟敏感的服务瓶颈。
      - - 世界模型和物理 AI / AV 仿真
        - 面向自动驾驶、机器人和具身 AI 的软件、仿真与合成场景生成（无公开市场规模）
        - 车辆硬件；LIDAR 传感器；车载计算；整车层面工程
        - AV / 自动驾驶项目（自动驾驶 / AI 安全负责人）和机器人实验室
        - Oasis 3 Preview 以该细分为定位，并明确获得 Toyota Ventures 和 NVIDIA 背书。
      - - UGC 创作者经济（下游需求池）
        - Fortnite、Roblox、Minecraft 及其他平台上的创作者分成（BCG 称 2025 年超过 $1.5B）
        - 托管 / CDN 基础设施；应用商店保留的平台抽成
        - UGC 平台（付款方）；个人创作者（用户）
        - Decart 工具作为这些平台创作者的「镐和铲」，沉淀价值。
      - - 生成式 AI 推理 / 优化基础设施
        - 面向低延迟模型的云转售推理；授权给云厂商的优化栈（Decart DOS on AWS Trainium 是具名例子）
