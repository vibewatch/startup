  - id: TI005
    slug: public-financial-gaps-table
    title: 公开财务缺口表
    description: >-
      Key financial metrics absent from public disclosure that constitute blocking diligence items for a $4B valuation
      underwriting.
    layout: standard
    columns:
      - 缺失指标
      - 对承销的重要性
      - 若不披露的影响
      - 尽调路径
    rows:
      - - 按产品线拆分 ARR / MRR
        - 相对 $4B 估值的收入基线；用于计算 ARR 倍数
        - 无法判断隐含 20–40x ARR 倍数是否有支撑
        - 向 CFO 要求按收入流拆分 MRR（DOS 授权 / Lucy API / Oasis API / 企业）
      - - 毛利率（混合及按收入流）
        - 长期企业价值的首要决定因素；计算成本杠杆
        - 无法评估定价权或成本竞争力
        - 要求经审计 P&L；对比 DOS 授权毛利率与 API 毛利率
      - - 月度烧钱率和现金头寸
        - 资本充足性和融资风险；runway 评估
        - 没有烧钱数据就无法验证多年现金 runway 主张
        - 要求 2026 年 Q1 现金流量表和当前银行余额
      - - DOS 合同数量和 HHI
        - 收入集中度风险；客户依赖
        - 无法评估失去一个超大规模云服务商合同是否会造成重大收入下滑
        - 要求 DOS 授权合同数量、规模分布和续约条款
      - - 净收入留存（NRR）和流失率
        - 收入质量信号；经常性 vs. 交易性；客户满意度
        - 没有 NRR 就无法区分经常性收入和一次性收入
        - 分别要求开发者 API 和企业收入流的用户 cohort NRR 分析
    notes: 五个指标都是 AI 基础设施公司 Series C 阶段的标准承销输入。缺失这些指标，意味着承销完全依赖未经验证的 CEO 说法——对 $4B 估值而言，这是非标准风险因素。
    sourceRefs:
      - SI022
      - SI028
