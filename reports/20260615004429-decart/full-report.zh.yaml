      - number: '7.3'
        title: 运营、模型质量与安全风险
        blocks:
          - type: paragraph
            body: >
              Decart 的运营风险主要来自自回归世界模型的根本架构限制，以及对 AWS 基础设施的深度依赖。模型质量方面：TechCrunch 2026 年 6 月对 Oasis 3
              的独立测试记录了三类故障——（1）上下文窗口填满后，几分钟内主题一致性退化；（2）物理一致性失败，车辆彼此穿透，因为模型缺少真正碰撞模拟；（3）控制响应问题，无法精确导航。CEO Leitersdorf
              承认三者都是持续研究问题，并把上下文退化归因于：30fps 视频生成每帧消耗约 8,000 tokens，在每秒数十万 tokens 的速度下会很快填满上下文窗口。公司在研究更长上下文和记忆压缩技术。对 AV
              客户而言，物理失败不是外观瑕疵——合成训练数据可能包含物理上无效的场景，进而劣化下游模型行为。这给 Decart 目标 AV 市场带来直接训练数据质量风险。基础设施方面：Decart 的 Lucy 模型运行在
              AWS Trainium3 上，并通过 Amazon Bedrock 分发，形成集中单云依赖。持续 AWS 故障会中断全部推理运营。Trainium3
              硬件刚发布，广泛供应有限，规模化阶段存在硬件采购风险。安全方面：作为一个根据客户提示生成实时视频的平台，Decart 面临 prompt injection、绕过 AUP
              生成禁止内容（deepfake、CSAM、武器合成）的 jailbreak 风险，以及 API key 泄露风险。AUP（2026 年 2 月）覆盖了禁止用途，但未发现内容审核有效性的独立审计。
