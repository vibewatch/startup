      - number: '3.4'
        title: 护城河耐久度、切换成本与商品化风险
        blocks:
          - type: paragraph
            body: >-
              Decart 的护城河真实存在，但很窄，也有时间边界。当 Oasis 3 仍是唯一生产就绪的实时驾驶模拟 API 时，迁移到 Oasis 3 具备粘性：一旦 AV 训练管线集成 Oasis
              生成场景，切换成本就包括用不同格式重新收集或重新标注合成数据。不过，这条护城河至少有三处结构性脆弱点。


              第一，最有能力构建竞争性实时世界模型的两家公司——Google（通过 DeepMind）和 NVIDIA（虽是 Decart 投资人，但运行自己的 DRIVE 模拟栈）——R&D 预算比 Decart
              高几个数量级。Waymo 已经在内部部署 Genie 3，为顶级 AV 梯队自给自足立下先例。第二，Runway、World Labs 和 Luma AI
              都在明确投资世界模型，并已获得相当或更大的融资；如果其中任何一家推出有竞争力的实时 API，Decart 的先发开发者生态优势将面临直接压力。第三，通过 AWS Bedrock 的分发渠道虽有利于触达，却让
              Decart 依赖 Amazon 的市场进入和定价架构。


              Scenario 的聚合器模式提供 50+ 家供应商的 550+
              个模型，说明商品化基础设施市场会如何演化：一旦多个世界模型供应商存在，聚合器就可能压低任何单一供应商的定价护城河。眼下这个风险仍偏前瞻，但它正确框定了 3–5 年竞争耐久度问题。
