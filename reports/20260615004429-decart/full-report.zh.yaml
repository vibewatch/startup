      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              今天为 Decart 技术栈付费或使用的有四类买方。（a）游戏工作室和引擎团队，BCG 估算约 50% 的工作室已经使用某种 AI，并指出到 2025 年中，约 20% 新 Steam 游戏披露使用
              AI；预算负责人是 CTO 和内容负责人，采用触发点是生成工具能明确缩短 AAA 游戏内容周期，而这类游戏单款预算可达 $300 million。（b）UGC 平台和创作者，$1.5 billion
              的创作者分成池吸引扩散模型和世界模型供应商充当「卖铲人」；付款方是平台（Roblox、Fortnite、Minecraft），用户是创作者。（c）生成式 AI 基础设施客户，云服务商（Amazon/AWS 是
              Decart 已点名的战略客户）授权 DOS，以优化自己横跨 NVIDIA、TPU 和 Trainium 芯片的模型服务；付款方是云平台，用户是其企业租户，采用触发点是 GPU/Trainium
              效率。（d）Physical-AI 和 AV 模拟买方（Toyota Ventures 和 Nintendo 家族出现在 Decart 股权结构中，构成相邻信号），Oasis 3 Preview 被放在
              Waymo、Tesla、Wayve 和 NVIDIA DRIVE Sim 的内部模拟器对面；预算负责人是自动驾驶项目负责人，采用取决于物理保真度和安全论证可接受度。四类客群共同的公开自助采用路径，是 Decart
              在 platform.decart.ai 上的 API——每秒 $0.02 的实时价格层，加上美分级图像编辑调用——再叠加企业合同。Decart 2026 年 6 月向 TechCrunch 报告的
