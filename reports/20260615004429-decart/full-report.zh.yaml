  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Decart 的可服务市场位于三个松散相连的支出池交汇处，而不是一个成熟品类。第一是游戏中的生成式 AI，独立分析机构把它定义为游戏工作室和创作者经济平台内部，来自程序化内容生成、关卡 / 世界搭建、NPC
              行为、叙事生成、自适应个性化和 AI 驱动 QA 的收入。第二是实时生成视频和互动视频，Decart 的 Lucy 2.1 可转换或生成连续视频流，竞争对象包括编辑流程视频模型（Runway、Luma、Adobe
              Firefly Video），以及 UGC 平台（Fortnite、Roblox、Minecraft）的游戏内视频管线。第三是 Physical-AI / 世界模型模拟，Oasis 3 Preview
              面向自动驾驶数据生成，竞争对象包括 Waymo 内部模拟器、NVIDIA Cosmos/DRIVE Sim 栈、World Labs Marble、Google DeepMind Genie 3，以及 Tesla
              和 Wayve 的专有 AV 模拟器。买方层面的现状替代方案很关键：手工游戏内容（美术、设计师、过场动画团队）、传统驾驶模拟引擎（Unreal/CARLA），以及传统非实时视频模型（Sora、Veo、Runway
              Gen），这些模型输出批处理结果，而不是低于 30 毫秒的交互帧。排除的支出包括受监管商业博彩（AGA 的 $51B/month 序列属于另一个池）、GPU 硬件资本开支（输入成本而非软件收入），以及非实时的广播
              / 电影 VFX 支出。Decart 每秒 $0.02 的标价把 API 定在开发者工具支出与推理算力之间的边界上，因此公司市场边界最好理解为横向实时生成式 AI 基础设施品类，而不是只属于游戏的一个科目。
