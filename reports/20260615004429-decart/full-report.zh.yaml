      - number: '7.2'
        title: 监管、法律与 IP 风险
        blocks:
          - type: paragraph
            body: >
              训练数据版权是 Decart 最结构性模糊的法律风险。EU Parliament Legal Affairs Committee 在 2026 年 2 月以 17-3 票通过报告「Copyright and
              Generative AI — Opportunities and Challenges」，呼吁建立可反驳推定：任何投放 EU 市场的 GenAI
              模型，除非满足完整透明度义务，否则推定使用了受版权保护作品训练。该推定一旦写入 EU 法，将把举证责任倒置给 Decart；在正式框架落地前，报告还提出对既往使用征收 5–7% flat-rate
              turnover fee。另一路，美国 Copyright Office 仍在推进 AI rulemaking（AI Report 第 3 部分），制定 AI
              训练许可框架指引；办公室尚未发布有约束力规则，但其指引会影响诉讼姿态和未来法定风险。Osborne Clarke 2026 年 2 月法律分析称，EU 局面是一个「watershed moment」：现有
              opt-out 系统不足，新框架很可能约束服务 EU 市场的非 EU AI 提供商（market-of-destination principle）。2025 年 Trump Executive Order on
              AI（2025 年 12 月）显示联邦层面有意预先排除州级 AI 监管，但风险并未消失——Gunder LLP 的 2026 AI laws update 指出，Colorado、California
              等州已制定综合 AI 治理法规，并继续运行，也已影响供应商合同。Decart 的 AUP（2026 年 2 月更新）明确承认 EU AI Act、DSA 和 DMCA 等治理框架，并禁止军事 /
              武器、实时生物识别监控和社会评分场景。截至 2026 年 6 月，未发现针对 Decart 的公开 IP
              诉讼，但没有诉讼并不能证明训练数据许可合规。尽调需要完整训练数据来源审计，并取得任何受版权保护来源的许可协议。
