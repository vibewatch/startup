  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 2026 年世界模型版图：直接实验室、既有厂商、邻近玩家与内部自建替代
        blocks:
          - type: paragraph
            body: >-
              Decart 并不在一个边界清晰的软件品类中竞争。面向沉浸式体验的 Lucy 模型，竞争对象是 Runway、Luma AI 等视频生成平台，而这些平台本身也在转向世界模型。面向 Physical-AI 模拟的
              Oasis 模型，同时面对研究级系统（Google DeepMind 的 Genie 3，2025 年 8 月以研究预览形式发布），以及 Waymo、Tesla、NVIDIA、Wayve
              的大型内部自建项目。DOS 推理栈则与超大规模云厂商 GPU 云和专门的推理优化供应商竞争。


              三条产品线的共同主线，是低于 30 毫秒延迟的实时、交互式生成——截至 2026 年中，还没有竞争对手在商业可用 API 中匹配这一能力。Genie 3 能以 24 fps、720p
              生成帧，但仍是研究预览，没有公开付费 API。Runway 最新的 Gen 4.5 可生成带音频和角色一致性的高清视频，但面向后期制作和创意工作流，而不是实时交互模拟。World Labs 的 Marble
              产品生成可下载的 3D 环境，服务设计和娱乐，而不是实时驾驶模拟。Luma AI 于 2025 年 11 月融资 $900 million，估值达数十亿美元，并在扩展到世界模型，但尚未公开披露实时交互 API。


              最直接削弱 Decart 长期论点的两类竞争者是：（1）顶级 AV 玩家内部自建，这些玩家拥有 Google 级研究预算和专有传感器数据；（2）已经以相近估值融资的通用视频实验室未来商业化发布。Scenario
              和 Inworld AI 分别代表聚焦游戏工具和 AI 角色的邻近替代，但并不直接覆盖实时驾驶模拟。
