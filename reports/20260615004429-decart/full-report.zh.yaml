              Ventures），形成一种不常见的绑定结构，把资本和商业采用捆在一起。Radical Ventures 领投，Nvidia、Sequoia Capital 和 Benchmark 参投。Series C
              之前，Decart 在 2025 年 8 月以 $3.1 billion 估值完成 $100 million Series B，意味着约九个月内估值上升 29%。累计稀释和 pre-money
              所有权结构尚未公开。对 Decart 当前商业阶段而言，$450 million+ 现金储备相当充足，即使计算开支上升，也意味着多年 runway；但 burn rate
