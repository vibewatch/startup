      - number: '2.4'
        title: 增长驱动、采用约束与需要保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              顺风很具体。延迟敏感工作负载（实时玩法、AV 场景生成、直播视频转换）是批处理导向的视频和图像生成器留下的供给缺口；云游戏 >50% CAGR，以及 2024 到 2025 年披露使用 AI 的 Steam
              游戏数量翻倍，都指向实时生成式 AI 基础设施楔子。逆风同样具体。欧洲议会 2026 年 3 月主动报告（报告员 Axel Voss，17-3
              投票）要求逐项披露所有受版权保护训练数据，提出在缺乏透明度时推定侵权但允许反驳，并提出对生成式 AI 提供商征收 5–7% 全球营业额的固定版权费；Osborne Clarke 将其称为 EU
              监管制度的「分水岭时刻」。EU AI Act 的 General Purpose AI 义务已自 2025 年 8 月 2 日起生效，Digital Omnibus 则推迟了原定 2026 年 8
              月生效的高风险义务。在美国，California AI Transparency Act 和 GenAI Training Data Transparency Act 于 2026 年 1 月 1
              日生效，Texas Responsible AI Governance Act 同日生效，Trump 政府 2025 年 12 月 11 日行政令指示 DOJ 以联邦优先权为由挑战州级 AI 法律。US
              Copyright Office 正在发布的报告系列仍是 AI 与版权的主要联邦框架。需要保留的矛盾：（i）云游戏预测和游戏生成式 AI 预测在规模和单位上不一致（玩家小时数 vs.
              工作室软件支出）；（ii）Physical-AI 模拟尚无已发布 TAM，但 Decart 投资人（Toyota Ventures、NVIDIA、Radical）押注它会成为 Decart
              最大细分；（iii）工作室采用 AI 正在上升，但 BCG 自己的调查显示玩家抵触 AI 用于美术 / 动画，提示消费端采用风险；（iv）GDC 2026 State of the Game Industry
              Report 这个权威开发者调查在本次运行中有付费墙，本文图表未直接引用。
