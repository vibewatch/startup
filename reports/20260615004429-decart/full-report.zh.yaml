      - number: '4.5'
        title: 收入质量、披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >
              Decart 讲出了有吸引力的资本效率叙事和多收入流架构，但几乎所有财务主张都来自 CEO，无法独立验证。截至 2026 年中，公司没有公开披露
              ARR、毛利率、EBITDA、按层级划分的客户数、净收入留存、消耗率或经审计账目。公司是在以色列运营的私营实体，在运营司法辖区没有公开提交账目的法定义务。Decart 唯一公开金融工具，是共同投资载体 JSL
              Decart.AI Coinvest, L.P. 的 SEC Form D；这是一份程序性文件，确认 Delaware LP 存在，不提供财务表现数据。TechCrunch 对 Oasis 3 的评测（2026
              年 6 月）指出重大负面技术限制——物理一致性失败、长会话环境退化、上下文窗口约束——CEO 自己也承认这些是活跃研究问题。这些限制直接影响 Oasis AV
              模拟收入流的财务前景：如果无法在规模化下保证物理保真，企业 AV 客户会推迟或限制采用。2026 年 5 月 $300 million 融资——发生在 CEO
              声称公司几乎不需要资本约九个月后——暗示公司战略转向激进增长投资（招聘、基础设施、模型训练、美国扩张），这与此前资本效率叙事存在张力。公司是在押注产品市场契合拐点，还是进入增长投资周期，在没有季度管理账目前无法判断。五个阻断性尽调问题是：（1）已确认
              ARR 和按收入流划分的收入组合，（2）按产品线划分的毛利率，（3）截至 2026 年 Q2 的月度消耗率和现金头寸，（4）DOS 授权合同条款和集中度，（5）将「数百万美元收入」与 $3.1–4.0
              billion 估值之间做调和；按标准 SaaS 倍数，后者隐含 $300M+ ARR。
