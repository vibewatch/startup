        title: 人员、执行与融资风险
        blocks:
          - type: paragraph
            body: >
              Decart 的执行风险集中在 key-person 依赖、地缘政治暴露，以及 $4 billion 估值与公开收入指标之间的融资落差。Dean Leitersdorf（CEO，27 岁）一直是从 seed 到
              Series C 每一轮的主要公众面孔、融资人和技术叙事驱动者。他若离开，会在关键规模化阶段同时造成融资、技术可信度和媒体叙事缺口。除两位联合创始人外，公司的领导团队公开记录不深；Dr. Kfir
              Aberman（前 Snap 和 Google、DreamBooth 共同创造者）是公开点名的最资深招聘，担任 SF R&D center 负责人。任何联合创始人或 Aberman
              离开，都会带来执行风险。以色列运营总部带来地缘风险：Israel-Gaza 冲突或更广泛区域不稳定若持续升级，会影响 Tel Aviv
              工程团队运营、全球差旅签证，以及与风险敏感型企业客户的关系。若干大型企业（尤其 defense-adjacent 行业）有采购政策，限制采购活跃冲突地区供应商。融资风险：Decart 已融资 $450M+，但声称
              lifetime burn「less than $100M」（CEO，2026 年 6 月）。即便属实，随着公司扩展 AV/physical-AI 模拟基础设施、员工数从 60+
              扩张，并搭建企业销售能力，burn rate 会显著加速。在 $4 billion 估值下，下一轮需要达到 $5–6 billion 或更高，才能避免 flat/down round；这要求公司拿出可证明的收入
              traction，而公开证据尚未支持。
