        - 驱动
        - 2025-2030
        - 工作室侧在生产流水线中使用 AI 逐步常态化。
        - 确认 Decart 是否能在 Unity / Unreal 流水线内拿下工作室业务。
      - - EU AI Act GPAI 义务 + 2026 年 3 月版权报告
        - 约束
        - 2025 年 8 月 2 日起生效；版权解决方案拟于 2026 年 3 月提出
        - 逐项训练数据透明度、可反驳的侵权推定、潜在 5–7% 营业额固定费率费用，以及覆盖向欧盟提供服务的非欧盟提供商的地域效力。
        - 审计 Decart 的训练数据来源、透明度披露和欧盟合规路线图。
      - - 美国州级 AI 法律于 2026 年 1 月 1 日生效（CA SB 942 + AB 2013、TX TRAIGA）
        - 约束
        - 2026 年 1 月 1 日起
        - 增加逐州透明度、训练数据和治理义务；Trump 2025 年 12 月 11 日行政令正在测试联邦优先权。
        - 将 Decart 的加州敞口（旧金山研发中心）与 AI Transparency Act 和 AB 2013 义务逐项对照。
      - - GPU / Trainium 计算成本和容量
        - 约束
        - 持续至 2030 年
        - 实时生成受计算约束；DOS 多厂商优化是一道对冲，但算力分配仍是硬约束。
        - 按厂商（NVIDIA / TPU / Trainium）量化 Decart 的计算 COGS 和承诺使用合约。
      - - 玩家对生成式 AI 艺术 / 动画的情绪
        - 约束
        - 现在
        - BCG 调研显示，成人对 AI 艺术持负面看法的比例只有约 10%，对 NPC / 任务持负面看法约 5–7%，但消费者反弹风险不为零，尤其对 AAA 品牌。
        - 按滚动 6 个月窗口跟踪工作室层面披露和玩家社区情绪。
      - - 用 Minecraft 素材训练带来的版权不透明（Oasis 2024 年 10 月 + 2026 年欧盟框架）
        - 约束
        - 自 2024 年 10 月以来的持续风险
        - 这是一个反向信号，会放大欧盟版权压力；还可能影响加州 AB 2013 下未来美国执法的形态。
        - 索取 Decart 的训练数据清单，以及围绕 Minecraft 素材使用与 Microsoft / Mojang 或其他授权方的往来函件。
    notes: 约束行是本章最关键的尽调内容；在承销前，应对照 Decart 的合规姿态和任何未公布授权交易继续追问。
