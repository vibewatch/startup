companyProfile:
  summary: Decart is a Tel Aviv-based vertically integrated AI research lab founded in late 2023 by Dean Leitersdorf and Moshe Shalev. It has moved from the 2024 Oasis viral Minecraft-style demo into a broader platform thesis spanning Lucy for real-time video transformation, Oasis for world simulation and physical AI, and DOS as the optimized inference-and-training stack underneath both. The company now sells API access and enterprise integrations into commerce, streaming, gaming, and cloud/physical-AI workflows, backed by an unusually strategic investor roster and an AWS-centered go-to-market path.
  foundedDate: '2023-10-01'
