  - id: total-addressable-market
    title: Total Addressable Market
    body: >
      Decart addresses three overlapping market segments with different maturity profiles. The global
      gaming market, sized at approximately $210 billion in 2025 by BCG's Global Gaming Survey, is
      the near-term wedge: simulation infrastructure embedded in game engines could capture a fee-per-
      session or API-call model targeting 3-5% of developer tooling budgets — implying a serviceable
      addressable market of $1-3 billion in gaming simulation alone if Decart achieves toolset
      integration. BCG specifically identifies generative AI as a primary structural change in the
      gaming industry, projecting that ~20% of new Steam games disclosed AI use in mid-2025 (double
      the prior year), and that the gaming industry is exiting its three-year post-pandemic slump.
      The Business Research Company estimates the generative AI in gaming market at $2.1 billion in
      2025, growing to $10.5 billion by 2030 at a 30% CAGR — Decart's real-time world simulation
      is a premium offering within this segment. Research and Markets similarly sizes the generative
      AI gaming market at $2.1 billion in 2025 growing at a 24% CAGR through 2030. The second
      segment — autonomous vehicle simulation — is potentially the largest value pool but carries
      the most technology risk given Decart's documented physics-consistency limitations. The third
      segment — e-commerce and retail try-on — is already generating API revenue via the Lucy model
      and is the clearest near-term ARR path, though the TAM is smaller ($500M-1B for AI virtual
      try-on). McKinsey's State of AI report confirms enterprise AI adoption rates have crossed 72%
      in large organizations, validating the enterprise demand backdrop, though Decart's share of
      that spend is unquantified. Statista sizes the global mobile games market at approximately $92
      billion in 2025, a subset of the total gaming TAM directly accessible through Decart's API.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
