callouts:
  - calloutType: insight
    title: Stretched Valuation — No Revenue Anchor
    body: >
      Decart's $4 billion valuation is entirely assumption-led. The company has not disclosed any
      revenue, ARR, bookings, or profitability metrics as of June 2026. The current pricing embeds
      bull-case execution across gaming simulation, AV enterprise contracts, and e-commerce API
      adoption. At base-case assumptions using publicly available pricing ($0.02/second) and developer
      community size (~100,000 accounts), the implied 2028E ARR of $80-100 million produces a
      valuation of approximately $1.6-2.0 billion — a 50-60% discount to current pricing.
    claimRefs:
      - CV020
      - CV021
      - CV036
  - calloutType: insight
    title: Adverse View — Physics Limitations Create AV Thesis Risk
    body: >
      The autonomous vehicle simulation vertical arguably represents 30-50% of Decart's bull-case
      valuation. TechCrunch's June 2026 independent review documented vehicles passing through each
      other and navigation failures in Oasis 3 — physics-consistency issues the CEO acknowledged as
      "a major research problem we're cracking now." If AV customers require physics-accurate simulation
      (which is a baseline requirement for synthetic training data in safety-critical applications),
      this thesis leg could fail entirely. Decart has not published a physics-accuracy roadmap with
      measurable milestones.
    claimRefs:
      - CV027
      - CV028
      - CV029

