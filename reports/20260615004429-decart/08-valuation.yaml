company:
  name: Decart
chapter:
  number: 8
  title: Valuation & Investment Framing
  summary: >
    Decart's May 2026 Series C at ~$4 billion is underwritten by strong momentum — three major product
    launches in 18 months, a $300 million strategic raise from tech leaders who are simultaneously
    customers, an AWS Trainium3 production partnership, and a defensible autoregressive world-model
    architecture that outpaces peers on real-time latency. However, the thesis carries four structural
    vulnerabilities: (1) no publicly disclosed revenue, ARR, or margin data, making any valuation
    multiple speculative; (2) physics-consistency limitations independently documented in Oasis 3 that
    could foreclose the autonomous vehicle market — the largest near-term TAM expansion; (3) heavy
    comparable compression risk as Runway ($5.3B, reported commercial revenues), World Labs ($5B with
    Autodesk strategic anchor), and Google DeepMind Genie all advance with more resources; and (4) an
    unusual investor-customer overlap that could distort governance and deal terms. The TAM is real — the
    global gaming market exceeds $210 billion, and BCG estimates GenAI will be a primary growth driver
    in the next five years — but Decart's serviceable market is far smaller and the conversion path
    from technical capability to enterprise ARR is not yet demonstrated. On public evidence only, the
    base-case valuation scenario produces a significant discount to current pricing. The recommended
    stance is track with high risk and a stretched valuation framing; the upgrade trigger is
    demonstrated ARR scale crossing $30M+ with audited financials, or a clear-path AV customer contract.

sections:
  - id: funding-history
    title: Funding History and Capital Structure
    body: >
      Decart has raised over $450 million across multiple rounds since its founding in 2022, with a
      trajectory that places it among the fastest-valued Israeli AI startups on record. The most recent
      round — a $300 million Series C closed in May 2026 — brought the post-money valuation to
      approximately $4 billion. The round was notable for its strategic composition: lead investors
      include technology companies that are simultaneously paying customers (Toyota, Adobe, eBay
      Ventures), creating an unusual alignment structure where capital and commercial adoption are
      bundled. Radical Ventures led, with participation from Nvidia, Sequoia Capital, and Benchmark.
      Prior to the Series C, Decart raised $100 million at a $3.1 billion valuation in August 2025
      (Series B), implying a 29% step-up in approximately nine months. The cumulative dilution and
      pre-money ownership structure have not been publicly disclosed. The $450 million+ war chest
      is substantial for a company at Decart's commercial stage, and implies a multi-year runway even
      at elevated compute spending, but burn rate figures are not available for validation. The
      strategic investor base introduces governance complexity: customers who are also investors may
      have conflicting incentives around product roadmap, enterprise pricing, and potential exit routes.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
    tableRefs:
      - TV001
    figureRefs:
      - FV001

  - id: comparable-companies
    title: Comparable Company Analysis
    body: >
      The nearest public comparables for Decart are private-market peers in AI video, world modeling,
      and AI gaming infrastructure. Runway AI — the closest functional comparable — raised $315 million
      at a $5.3 billion valuation in February 2026, and has publicly indicated it is expanding from
      creative video editing toward world models, making it a direct future competitor with a $1.3
      billion valuation premium over Decart. World Labs raised $200 million in February 2026 with an
      anchor investment from Autodesk, targeting professional 3D workflows at a similar ~$5 billion
      implied valuation; it is narrower in scope than Decart but has a clearer commercial vertical in
      the $25 billion 3D design software market. Luma AI raised $900 million in Series C funding from
      HUMAIN (Saudi Arabia's state AI fund) in November 2025 at a ~$900 million valuation — a case
      where total capital raised ($450 million at time of round) approximately equals post-money
      valuation, suggesting significant investor caution on the video generation sub-segment. Inworld
      AI, valued at over $500 million with $100 million raised, is the primary AI-native games
      infrastructure peer; its focus on NPC character engines is narrower but complementary. The peer
      group average post-money valuation is approximately $2.9 billion, and Decart's $4 billion
      represents a 38% premium over the peer group average. The premium is defensible if real-time
      world simulation proves to be a higher-value architecture than post-production video generation,
      but is currently assumption-led given Decart's opaque commercial metrics.
