  - id: revenue-scenarios
    title: Revenue Scenarios and Financial Modeling
    body: >
      In the absence of any publicly disclosed revenue data, valuation modeling requires assumption-led
      scenario construction. The primary revenue drivers are: (A) Lucy model API fees for e-commerce
      and livestreaming (current traction); (B) Oasis 3 gaming simulation API fees at $0.02/second
      (launched June 2026); and (C) potential AV enterprise contracts (unannounced, no public evidence
      yet). CBInsights confirms no ARR or financial metrics have been publicly disclosed by Decart.
      In a bull scenario, Decart converts its 100,000+ developer community into paying customers at
      even modest retention, achieves 3-5 enterprise gaming or AV contracts, and reaches $30 million
      ARR by end of 2026 and $200 million by 2028 — yielding a 20x forward multiple that sustains
      current valuation. In a base scenario, adoption is slower and Decart reaches $15 million ARR
      by end of 2026 and $80-100 million by 2028 at a 20x multiple, implying a significantly discounted
      valuation of $1.6-2.0 billion versus the $4 billion current pricing. In a bear scenario,
      physics failures close the AV market and competition from Runway and Google limits gaming
      adoption; Decart reaches $25 million ARR by 2028, implying a $500 million valuation at 20x —
      an 87.5% discount to current pricing. Roblox Corporation's SEC 10-K filings provide a comparable
      public company anchor: Roblox generated approximately $3.9 billion in revenue in fiscal 2025
      at a market capitalization near $26 billion, implying a price/revenue multiple of approximately
      6-7x for a mature gaming platform — suggesting that even bull-case Decart revenues would need
      to be exceptional to sustain a $4 billion market value at maturity-stage multiples.
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
    tableRefs:
      - TV004
      - TV005

  - id: valuation-framework
    title: Valuation Framework, Risk Factors, and Thesis Breaks
    body: >
      The current $4 billion valuation can be decomposed into three components: (1) demonstrated
      technical optionality — real-time world model architecture that is unique at current latency
      and fidelity specs; (2) infrastructure partnership premium — AWS Trainium3 production deal and
      Amazon Bedrock distribution create scale that most startups at this stage do not have; and
      (3) strategic investor premium — the customer-investor structure implies high early adoption
      probability. Against this, the adverse thesis is material: TechCrunch's June 2026 independent
      review documented physics-consistency failures in Oasis 3 that the CEO acknowledged as an
      active research problem, indicating core product limitations are not cosmetic. CBInsights
      rates Decart as high-risk due to lack of financial disclosure. The physics limitation is the
      key thesis-break trigger for the AV vertical, which arguably accounts for 30-50% of the
      bull-case valuation. Three additional thesis-break triggers are: (A) failure to demonstrate
      enterprise-grade ARR by Q4 2026; (B) a material copyright enforcement action targeting
      Decart's training data in the EU; or (C) Runway or Google shipping a real-time world model
      at competitive price-quality levels within 12-18 months. At current comparable valuations,
      the AWS and Nvidia strategic partnerships do not justify the premium to peers: Runway has
      similar strategic relationships (Adobe acquisition candidate) and disclosed commercial traction.
      A diligence session must include audited revenue, gross margin, burn rate, and customer
      concentration data before any recommendation can be upgraded beyond "track."
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
    tableRefs:
      - TV006
    figureRefs:
      - FV004

  - id: recommendation
    title: Recommendation, Diligence Asks, and Disclosure Limitations
    body: >
      Recommended stance: TRACK. Confidence: Medium. Risk rating: High. Valuation stance: Stretched.
      The investment case for Decart is asymmetric — the technical differentiation, AWS partnership,
      and strategic investor quality are genuinely superior, but the $4 billion price point embeds
      execution assumptions that are not yet evidenced by any public financial disclosure. The
      recommendation is to track rather than pass because the TAM is large enough and the technical
      moat is real enough that a premature "pass" risks missing a generational platform opportunity;
      but a "buy" recommendation requires financial validation that is currently unavailable. The
      upgrade trigger to "buy" is: (1) disclosure of ARR at or above $25 million with demonstrated
      YoY growth; (2) at least one public AV enterprise contract with disclosed TCO; (3) publication
      of a physics-consistency roadmap with measurable milestones. The downgrade trigger to "pass" is:
      any material copyright enforcement action, confirmed physics failures blocking AV adoption, or
      a Runway/Google world model launch at price parity. Disclosure limitation: all financial
      projections in this chapter are assumption-led; Decart has not publicly disclosed revenue,
      ARR, bookings, burn rate, gross margin, customer count, or retention metrics as of June 2026.
      This chapter presents scenario ranges only and explicitly cannot support a specific investment
      price recommendation. Investors should treat the $4 billion valuation as a hypothesis to be
      tested, not a validated market price.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
