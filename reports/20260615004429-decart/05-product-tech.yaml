- id: TE002
  title: Workflow and use-case table
  columns:
  - User Job
  - Current Workflow
  - Decart Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Realtime video transformation
    - Developer stitches together camera capture, low-latency inference, and live rendering
    - Lucy realtime APIs plus official SDKs and client-token auth
    - Public docs show production-oriented browser and mobile flows with usage-based pricing
    - Independent measurement of output quality and uptime by segment is limited
  - - E-commerce virtual try-on
    - Merchant typically relies on static images or asynchronous rendering
    - Lucy VTON and try-on guides support webcam-based live sessions
    - Official examples show product-page try-on flows and six production-ready examples
    - No public merchant conversion or repeat-usage metrics are disclosed
  - - Physical-AI simulation
    - Team often builds rare-scenario datasets or simulator tooling internally
    - Oasis 3 Preview generates multiview driving scenes from prompts and actions
    - Public API access and $0.02/sec list price lower experimentation barriers
    - Current public product is camera-first and not yet a full physics or sensor simulator
  - - VR / immersive experiments
    - XR builder usually custom-integrates passthrough camera and stylization stack
    - Decart-XR open-source Quest app demonstrates realtime transformed passthrough
    - Open-source sample shows sub-200ms claim and complete Quest pipeline wiring
    - This is a developer demo, not evidence of scaled commercial deployment
  notes: Benefits reflect what the fetched docs and repositories explicitly expose, not independently measured ROI.
