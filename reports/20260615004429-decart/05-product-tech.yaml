- id: governance-and-operations
  title: Governance, privacy, safety, and operational surfaces
  body: 'Unlike many early-stage frontier-model products, Decart exposes a visible operating surface for production users: published pricing, FAQ guidance on client tokens, terms allocating ownership between input and output, an acceptable-use policy, and a public status page. These materials are useful for diligence because they clarify practical boundaries. Browser and mobile integrations are expected to use short-lived client tokens rather than permanent API keys, active sessions survive token expiry, and the company publishes uptime history through a dedicated status site. The legal surface is more cautionary. Terms assign output rights to users but also reserve broad rights for Decart to use content to improve the platform and for marketing. The privacy policy says the company may process inputs, outputs, generated media, and live audio or video recordings for product improvement and research. The AUP forbids deceptive deepfakes, military use, and safety-critical workflows where failures
    could cause severe harm, which is notable given Decart’s marketing toward physical-AI and autonomous-driving use cases.'
  claimRefs:
  - CE033
