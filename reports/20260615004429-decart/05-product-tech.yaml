- id: oasis-architecture
  title: Oasis 3 API mechanics and workflow
  body: 'The Oasis 3 documentation exposes a real operating workflow rather than a vague demo narrative. Developers open a session against a hosted gRPC endpoint, initialize the scene with a text prompt, and then repeatedly send fixed action chunks made of four throttle-and-steering pairs. The service returns four RGB frames for each advertised camera stream, which the docs describe as left-forward, front, and right-forward. That interface supports a specific claim: the product is built for closed-loop inference rather than one-shot video rendering. The docs also include an RL example and collision-risk demo, which makes the product meaningfully more developer-ready than research previews that lack reproducible mechanics. Still, public evidence does not yet show the richer simulation modalities many AV stacks want, such as lidar, segmentation, or explicit physics-state export, so the current public product appears strongest for camera-first experimentation and early workflow integration
    rather than a full simulator replacement.'
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
