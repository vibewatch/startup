artifact: product-tech
slug: decart
runDate: '2026-06-15'
company:
  name: Decart
chapter:
  number: 5
  title: Product & Technology
  summary: Decart presents a vertically integrated real-time AI stack that combines DOS infrastructure software with Lucy creative models and Oasis 3 physical-AI simulation. The public documentation is unusually complete for a young company and supports clear API, pricing, policy, and SDK surfaces, but the strongest performance and physics claims remain largely company asserted, while independent testing still shows coherence and collision limitations.
sections:
- id: stack-overview
  title: Stack definition and module map
  body: 'Decart positions the company as a vertically integrated research lab rather than a single-model vendor. The public stack separates into three layers: DOS, the optimization and inference layer; Lucy, a family of real-time visual transformation and try-on products for commerce, streaming, gaming, and live media; and Oasis 3, a promptable world model for closed-loop physical-AI simulation. The product surfaces are accessible through a cloud API with official SDKs and published pricing, which is materially more concrete than many frontier-model launches. At the same time, Decart is still moving quickly across narratives: the 2024 Oasis launch centered on a Minecraft-like interactive demo, Lucy then became the visible production product for live video use cases, and the 2026 Oasis 3 launch reframed the company around physical AI and autonomous-vehicle simulation. That breadth is strategically interesting, but it also means buyers still need diligence on how much of the stack is productized
    versus still research-led.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
