- id: TE003
  title: Technology architecture table
  columns:
  - Layer/Component
  - Role
  - Dependency
  - Risk
  rows:
  - - Client layer
    - Browser, mobile, Python, and XR apps capture media, prompts, and controls
    - Short-lived client tokens, official SDKs, device camera access
    - Misconfigured auth or client-side key handling can expose credentials or break sessions
  - - API / SDK layer
    - Routes requests to Lucy and Oasis endpoints and normalizes integration patterns
    - Decart docs, SDK maintenance, and endpoint stability
    - Version drift or insufficient enterprise controls could increase switching cost
  - - Realtime inference layer
    - Runs Lucy edits or Oasis multiview rollouts with live response loops
    - Model architecture plus DOS runtime efficiency
    - Latency, coherence, or memory limits directly degrade user experience and training usefulness
  - - DOS optimization layer
    - Abstracts hardware-specific optimization across GPU, TPU, and Trainium stacks
    - Deep hardware collaboration and continued compiler/runtime tuning
    - Competitive advantage may be hard to verify externally and may depend on continued partner access
  - - Cloud / hardware layer
    - Underlying compute on NVIDIA, AWS Trainium, and Google TPU environments
    - Partner capacity, silicon roadmaps, and cloud distribution agreements
    - Hardware concentration or delayed access to new chips could compress Decart’s realtime advantage
  notes: Architecture is reconstructed from public docs, repositories, and company releases rather than a formal systems diagram published by Decart.
