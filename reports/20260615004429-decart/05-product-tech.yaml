- id: caveats-and-open-questions
  title: Independent caveats and unresolved technical risk
  body: 'The public evidence base is strongest on interfaces and weakest on long-horizon simulation quality. TechCrunch’s hands-on reporting is the clearest independent caution: the model can produce compelling photorealistic driving scenes, but scene identity can drift over time and other vehicles can pass through one another. That lines up with Decart’s own caveats. The 2024 Oasis research post openly described issues around domain generalization, memory, distant-detail fuzziness, precise inventory or object control, and the need for scaling to address them. The 2026 Oasis page itself says the system is not a physics engine. These are not fatal flaws for an early world-model platform, but they matter for procurement because they narrow where current deployments are credible. Decart looks most credible today as an API-accessible real-time visual or simulation layer with unusually complete developer tooling; it looks less proven as a drop-in replacement for mature physical simulators or
    as a fully validated training substrate for safety-critical autonomy.'
  claimRefs:
