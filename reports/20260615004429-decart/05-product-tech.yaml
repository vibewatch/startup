tables:
- id: TE001
  title: Product module and asset matrix
  columns:
  - Module
  - User/Buyer
  - Maturity/Status
  - Key Differentiation
  - Diligence Gap
  rows:
  - - DOS / optimization engine
    - Cloud providers, AI labs, Decart internal model teams
    - Company says in production; DOS 2.0 announced May 2026
    - Hardware-portable low-latency inference and training layer across NVIDIA, TPU, and Trainium
    - No independent benchmark package or customer case study quantifies the claimed 8x speed / 100x efficiency advantages
  - - Lucy 2.1 realtime and related Lucy apps
    - Developers building commerce, streaming, gaming, and live-media apps
    - Public docs, SDKs, pricing, and examples available
    - Realtime visual transformation with SDK support and client-token browser flows
    - Independent quality and retention data for production customers are not disclosed
  - - Oasis 3 Preview
    - AV, robotics, and physical-AI developers
    - Public API preview live in June 2026
    - Promptable multiview world model with explicit action loop and public pay-per-second pricing
    - Public evidence does not yet show lidar, segmentation, deterministic replay, or long-horizon validation
  - - API / SDK surface
    - Application developers and platform integrators
    - General availability docs and official SDKs visible
    - Published JavaScript, Python, Swift, Android, and specialized Oasis tooling reduce integration friction
    - Enterprise support, SLA terms, and versioning guarantees are not publicly detailed
  - - Open-source developer assets
    - Community developers, VR creators, and experimenters
    - GitHub org with SDK, RL example, try-on, and Quest XR repos
    - Visible community-facing examples act as developer-signal proof beyond marketing pages
    - Repo activity is visible, but public issue volume and production adoption are not disclosed
  notes: Snapshot of public product surfaces as fetched on 2026-06-15; maturity labels distinguish documented availability from independently verified production scale.
