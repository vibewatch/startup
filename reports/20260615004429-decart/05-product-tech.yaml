- id: performance-and-differentiation
  title: Performance claims, hardware coupling, and differentiation
  body: 'Decart’s strongest differentiation claim is that it can run world and video models in real time because the company co-designs model architecture with its DOS infrastructure layer. Company materials claim DOS 2.0 can exceed 1,600 tokens per second for agentic inference, run across NVIDIA GPUs, Google TPUs, and Amazon Trainium, and push full-HD video or world-model workloads toward 100 FPS. Independent coverage partly supports the hardware-optimization story: AI News and partner coverage describe Decart optimizing Lucy on AWS Trainium and targeting lower latency on Trainium3, while TechCrunch explains why Oasis 3 frame generation quickly becomes a token-throughput problem. However, much of the cost-efficiency advantage, hardware portability, and multiview coherence story still comes from company or partner framing rather than third-party benchmarking. Against alternative world-model approaches such as Genie 3, Decart is differentiated today more by immediate API access, explicit
    control loops, and production intent than by independently verified long-horizon realism.'
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
