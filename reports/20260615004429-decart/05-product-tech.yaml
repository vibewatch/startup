    - label: Realtime inference layer
      detail: Lucy creative models and Oasis 3 world-model inference services execute on top of DOS.
    - label: API / SDK layer
      detail: REST, realtime, gRPC, and official SDK abstractions expose the hosted model endpoints.
    - label: Application layer
      detail: Customer apps include commerce try-on, livestreaming, XR, and physical-AI simulation workflows.
