  evidenceGaps:
  - type: missing-source
    severity: material
    topic: simulation-validation
    missingEvidence: Independent benchmark or customer case study showing simulation-to-real transfer or measurable training gains from Oasis 3.
    whyItMatters: Without external validation, the value of public API access for physical-AI training remains more architectural than outcome-proven.
    diligencePath: Request customer pilots, benchmark reports, or internal experiment summaries that compare Oasis 3 against existing simulators.
    relatedQuestionRefs:
    - QE021
  - type: missing-source
    severity: material
    topic: sensor-modality
    missingEvidence: Documentation proving whether Oasis exposes lidar, depth, segmentation, map, or state outputs in addition to RGB camera frames.
    whyItMatters: Many autonomy and robotics buyers need more than RGB imagery to replace or complement existing simulation pipelines.
    diligencePath: Ask Decart for the current modality roadmap, API schema, and examples beyond the three camera streams.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: minor
    topic: enterprise-support
    missingEvidence: Public SLA, enterprise support matrix, or incident-response commitments for production users.
    whyItMatters: Operational readiness and procurement friction depend on support guarantees, not only on a public status page.
    diligencePath: Request enterprise contract templates, SLA language, and support escalation details.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
