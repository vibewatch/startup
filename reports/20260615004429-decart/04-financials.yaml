chapter:
  number: 4
  title: Financials
  summary: >-
    Decart has raised more than $450 million across three rounds (seed ~$53M, Series B $100M at $3.1B,
    Series C $300M at $4B) but operates with no audited public disclosure of revenues, gross margins,
    or burn rate. Revenue streams span DOS licensing to hyperscalers, pay-per-second Lucy and Oasis
    APIs ($0.02/sec list), and enterprise contracts via AWS Bedrock, yet all financial performance
    claims — "millions in revenue," "nearing profitability," sub-$10M lifetime spend through
    August 2025 — originate from the CEO with no independent corroboration. Strategic investors
    (NVIDIA, Amazon, Toyota, Adobe, eBay) in the $300M round create commercial alignment but also
    conflict-of-interest dynamics. Underwriting depends heavily on company claims rather than audited
    disclosure; gross margin, ARR, burn rate, and customer concentration are the four blocking
    diligence gaps.

sections:
  - id: revenue-model-pricing
    title: Revenue model and pricing architecture
    body: |
      Decart operates three publicly documented revenue streams as of mid-2026. The first — and historically
      earliest — is DOS licensing to major cloud providers, AI laboratories, and hyperscale infrastructure
      companies through multi-million-dollar commercial contracts. The company's optimization stack was
      profitable enough on this basis for the CEO to claim in August 2025 that Decart had spent less than
      $10 million of its $153 million in capital raised, funding its tens of millions in GPU compute costs
      through licensing revenue. The second stream is API pay-per-second: Lucy 2.1 (realtime video editing,
      720p) is priced at $0.02 per generated second, Lucy Restyle 2 (style transfer) at $0.01 per second,
      Oasis 3 Preview (physical AI and driving simulation) at $0.02 per second for self-serve access, and
      the prior-generation Lucy Clip at $0.15 per second. Enterprise pricing for Oasis 3 and custom
      deployments depends on use case and is not publicly disclosed. The third stream is enterprise
      distribution via AWS Bedrock, announced as part of the $300M Series C in May 2026, which enables
      Amazon's enterprise customer base to access Decart technology for media, commerce, advertising, and
      physical AI use cases under custom commercial terms. Revenue recognition dynamics differ across
      streams: DOS licensing contracts likely follow completion-of-delivery or ratable-license recognition;
      pay-per-second API revenue is recognized as consumed; enterprise Bedrock contracts would follow
      negotiated multi-year delivery schedules. The mix between these streams and the relative sizes of
      each segment are not publicly disclosed, constituting the primary revenue-quality diligence gap.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI006
      - CI007
      - CI014
      - CI015
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001

  - id: gtm-sales-efficiency
    title: GTM motion and developer flywheel
    body: |
      Decart's go-to-market strategy as of mid-2026 combines a self-serve developer API with direct
      enterprise sales through strategic partnerships. The developer-led path has produced a community
      of more than 100,000 developers building primarily on the Lucy API for e-commerce virtual try-on
      and livestreaming transformation use cases, with Oasis 3 launched in June 2026 targeting autonomous
      vehicle simulation developers as a second vertical. The AWS Bedrock integration is the enterprise
      distribution anchor, giving Decart access to Amazon's sales force and cloud marketplace credibility
      without the cost of building a direct enterprise sales organization from scratch. This reduces
      upfront customer acquisition cost but cedes margin and control to Amazon's commercial terms.
      Strategic investors Toyota, Adobe, and eBay are described by CEO Leitersdorf as "all potential
      customers," creating a captive initial enterprise pipeline that does not reflect arms-length
      commercial conversion. NVIDIA's dual role as investor and hardware partner further blurs the
      distinction between financial support and commercial demand. No customer count by revenue tier,
      net revenue retention, or sales cycle data has been disclosed. The primary GTM risk is that
      Decart's revenue concentration in a small number of hyperscaler DOS licensing deals and a large,
      mostly non-revenue-generating developer base creates a barbell revenue structure — a handful of
      large contracts offset by high-volume but low-monetization developer API usage — making aggregate
      revenue quality difficult to assess without a customer-by-revenue breakdown.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI015
      - CI016
      - CI022
      - CI027

  - id: cost-structure-margins
    title: Cost structure, gross margin drivers, and capital intensity
    body: |
      Decart's cost structure is dominated by compute and R&D payroll, with no owned hardware capital
      expenditure given its asset-light model using leased Amazon Trainium3, NVIDIA GPU, and Google TPU
      capacity. The gross margin profile of a managed inference API business at scale would typically
      run 50–80% for software-defined services, but Decart's actual margins depend critically on the
      terms of its hyperscaler compute agreements, the cost of Trainium3 versus standard NVIDIA instance
      pricing, and whether DOS licensing revenue carries substantially higher margins than API usage.
      Publicly, the DOS optimization layer is described as delivering over 80% Model FLOPS Utilization
      on Trainium3 — a hardware efficiency metric cited by AWS VP Nafea Bshara — and reducing per-video
      production cost from hundreds or thousands of dollars to less than $0.25 per video. If accurate,
      these efficiency gains translate directly into gross margin improvement relative to peers running
      on standard inference infrastructure. However, these are company-claimed benchmarks with no
      independent third-party audit. DOS 2.0, announced alongside the $300M raise, claims 1,600+ tokens
      per second for agentic inference versus an industry average of approximately 200 tokens per second,
      and up to 100 frames per second for world models. If the cost advantage is as described, Decart's
      gross margin on API revenue could materially exceed commodity inference API margins. R&D payroll
      for 60+ employees (many with deep low-level systems and HPC expertise) adds a significant fixed
      cost base. The company has not disclosed COGS, gross margin, headcount cost, or any unit-economics
      metric publicly.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI021
      - CI024
      - CI034
      - CI035
    tableRefs:
      - TI003
    figureRefs:
      - FI002

  - id: capital-adequacy-financing
    title: Capital adequacy and financing dependency
    body: |
      Decart's total capitalization exceeds $450 million after its $300M Series C in May 2026. The
      funding chronology comprises approximately $53 million in seed and early-stage rounds, a $100
      million Series B at a $3.1 billion valuation (August 2025, led by existing investors Sequoia,
      Benchmark, and Zeev, plus new investor Aleph VC), and a $300 million Series C at approximately
      $4 billion (May 2026, led by Radical Ventures with strategic participants NVIDIA, Toyota Ventures,
      Adobe Ventures, eBay Ventures, and Amazon as strategic customer). The SEC Form D filed September
      2025 by JSL Decart.AI Coinvest, L.P. (CIK 0002084011) confirms a Delaware LP co-investment
      vehicle was formed for the Series B, though the document provides minimal additional detail on
      investor composition or valuation mechanics. CEO Leitersdorf stated in August 2025 that Decart
      had spent less than $10 million of its $153 million in capital, with operating costs covered by
      DOS licensing revenue. In June 2026, he revised this to "drastically less than $100 million" in
      lifetime spend — consistent with, but less precise than, the August 2025 claim. Both figures are
      CEO-stated with no independent audit or board attestation provided. If the lifetime spend claim
      is taken at face value, Decart enters mid-2026 with roughly $350–$440 million in cash, implying
      multi-year runway even at materially higher monthly burn than the CEO's implied sub-$1M/month
      figure. Strategic investors participate commercially: NVIDIA as hardware partner and DOS
      distribution vehicle, Amazon as customer and Bedrock distribution channel, and Toyota, Adobe, and
      eBay as potential customers and validators of enterprise demand. This creates a financing-commercial
      co-dependency where investment terms may be partially predicated on commercial commitments,
      reducing the independence of either signal.
    claimRefs:
      - CI001
      - CI002
      - CI012
      - CI013
      - CI017
      - CI020
      - CI025
      - CI026
      - CI027
      - CI029
