  - id: TI005
    slug: public-financial-gaps-table
    title: Public financial gaps table
    description: "Key financial metrics absent from public disclosure that constitute blocking diligence items for a $4B valuation underwriting."
    layout: standard
    columns:
      - Missing metric
      - Why it matters to underwriting
      - Impact if undisclosed
      - Diligence path
    rows:
      - - ARR / MRR by product line
        - Revenue baseline against $4B valuation; enables ARR-multiple calculation
        - Cannot determine whether implied 20–40x ARR multiple is supported
        - Request MRR by stream (DOS licensing / Lucy API / Oasis API / enterprise) from CFO
      - - Gross margin (blended and by stream)
        - Primary determinant of long-run enterprise value; compute-cost leverage
        - Cannot assess pricing power or cost competitiveness
        - Require audited P&L; benchmark DOS licensing margin vs. API margin
      - - Monthly burn rate and cash position
        - Capital adequacy and financing risk; runway assessment
        - Multi-year runway claim cannot be validated without burn data
        - Request Q1 2026 cash-flow statement and current bank balance
      - - DOS contract count and HHI
        - Revenue concentration risk; customer dependency
        - Cannot assess whether loss of one hyperscaler contract causes material revenue decline
        - Request count, size distribution, and renewal terms for DOS licensing contracts
      - - Net revenue retention (NRR) and churn
        - Revenue quality signal; recurring vs. transactional; customer satisfaction
        - Cannot distinguish recurring from one-time revenue without NRR
        - Request cohort NRR analysis for developer API and enterprise streams separately
    notes: "All five metrics are standard underwriting inputs at Series C stage for AI infrastructure companies. Their absence means underwriting relies entirely on unverified CEO claims — a non-standard risk factor for a $4B valuation."
    sourceRefs:
      - SI022
      - SI028

