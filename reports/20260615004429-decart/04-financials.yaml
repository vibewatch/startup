callouts:
  - calloutType: risk
    title: All financial performance metrics are CEO-stated and unaudited
    body: >-
      Every financial performance claim for Decart — "millions in revenue," "nearing profitability," and
      sub-$10M lifetime spend through August 2025 — originates exclusively from CEO Dean Leitersdorf with
      no board attestation, auditor sign-off, or third-party verification. At a $4B valuation, this level
      of disclosure dependency is non-standard and constitutes a primary underwriting risk.
    claimRefs:
      - CI013
      - CI018
      - CI033
  - calloutType: insight
    title: Asset-light DOS model implies structurally high gross margins if compute costs are managed efficiently
    body: >-
      Decart's pay-per-second pricing at $0.02/sec and its leased-compute model suggest a gross margin
      profile that could structurally resemble 50–80% at scale — if compute costs are efficiently managed
      through DOS optimization. The reported >80% MFU on Trainium3 and sub-$0.25/video production cost
      support this hypothesis, but no actual gross margin figure is disclosed.
    claimRefs:
      - CI010
      - CI011
      - CI024
  - calloutType: risk
    title: Strategic investor overlap creates conflict-of-interest dynamics in commercial contracts
    body: >-
      NVIDIA, Amazon, Toyota, Adobe, and eBay are simultaneously investors in and potential customers of
      Decart. If commercial contracts with these entities are influenced by investment terms, reported
      revenue from these relationships may not reflect true arms-length demand — a standard but material
      risk for early-stage companies using strategic rounds to establish commercial relationships.
    claimRefs:
      - CI016
      - CI027

