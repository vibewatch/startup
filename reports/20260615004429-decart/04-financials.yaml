  - id: financial-verdict
    title: Revenue quality, disclosure gaps, and financial verdict
    body: |
      Decart presents a compelling capital-efficiency narrative and a multi-stream revenue architecture,
      but nearly all financial claims originate from the CEO and cannot be independently verified. As
      of mid-2026, no ARR, gross margin, EBITDA, customer count by tier, net revenue retention, burn
      rate, or audited accounts have been disclosed publicly. The company is a private Israeli entity
      with no statutory obligation to file public accounts in its operating jurisdiction. Decart's only
      public financial instrument is the SEC Form D for the co-investment vehicle JSL Decart.AI
      Coinvest, L.P., which is a procedural filing confirming a Delaware LP and providing no financial
      performance data. The TechCrunch review of Oasis 3 (June 2026) identifies materially adverse
      technical limitations — physics-consistency failures, environmental degradation over long sessions,
      and context-window constraints — that the CEO himself acknowledges as active research problems.
      These limitations are directly relevant to the financial outlook for the Oasis AV simulation
      revenue stream: if physics fidelity cannot be guaranteed at scale, enterprise AV customers will
      defer or limit adoption. The $300 million raise in May 2026 — approximately nine months after the
      CEO claimed the company barely needed capital — implies a strategic pivot toward aggressive growth
      investment (hiring, infrastructure, model training, US expansion) that is in tension with the prior
      capital-efficiency narrative. Whether the company is spending toward a product-market-fit inflection
      or toward a growth investment cycle is unknowable without quarterly management accounts. The five
      blocking diligence questions are: (1) confirmed ARR and revenue mix by stream, (2) gross margin by
      product line, (3) monthly burn rate and cash position as of Q2 2026, (4) terms and concentration
      of DOS licensing contracts, and (5) a reconciliation of "millions in revenue" against the $3.1–4.0
      billion valuation that implies $300M+ ARR at standard SaaS multiples.
    claimRefs:
      - CI018
      - CI019
      - CI022
      - CI023
      - CI025
      - CI031
      - CI032
      - CI033
    tableRefs:
      - TI005

