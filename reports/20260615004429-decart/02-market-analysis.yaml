figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      Pyramid orders the three sizing lenses from broadest interactive entertainment context (cloud gaming +
      gaming economy) down to Decart's serviceable wedge (generative AI in gaming) and its earliest realized
      bookings (Decart 2026 revenue, undisclosed).
    data:
      nodes:
        - id: tam-broad
          label: Interactive entertainment context (~$200B+ global)
          detail: Full PC/console/mobile gaming economy plus cloud gaming and UGC creator payouts.
          tone: neutral
        - id: tam-real-time
          label: Cloud gaming + real-time interactive video ($1.4B → $18.3B by 2030 per BCG)
          detail: Real-time server-rendered serving where DOS infra has direct latency relevance.
          tone: positive
        - id: sam-gen-ai-gaming
          label: Generative AI in gaming ($1.79B 2025 → $5.09B 2030 per TBRC)
          detail: Direct SAM lens for Decart's gaming-segment Lucy/Oasis usage.
          tone: positive
        - id: physical-ai
          label: Physical-AI / world-model simulation (no published size)
          detail: AV/robotics simulation segment; Oasis 3 Preview targets this; size unmeasured.
          tone: warning
        - id: som-decart
          label: Decart realized revenue (undisclosed)
          detail: Self-described as "significant"; no audited or itemized revenue published.
          tone: warning
    approximationNotes: >-
      Pyramid orders lenses by inclusiveness, not by additive math. Cloud-gaming and gen-AI-in-gaming sit in
      different unit definitions and should not be summed.
    claimRefs:
      - CM001
      - CM003
      - CM007
      - CM015
      - CM020
