  - id: section-3
    title: Buyers, users, payers, and adoption path
    body: >-
      Four buyer cohorts pay for or use Decart's stack today. (a) Game studios and engine teams, where BCG
      estimates roughly 50% of studios already use AI of some kind and notes that around 20% of new Steam
      titles disclosed AI use by mid-2025; budget owners are CTOs and head-of-content, with adoption
      triggered when generative tools demonstrably shorten content cycles for AAA titles whose budgets can
      reach $300 million per game. (b) UGC platforms and creators, where the $1.5 billion creator-payout pool
      attracts diffusion- and world-model vendors as picks-and-shovels suppliers; the payer is the platform
      (Roblox, Fortnite, Minecraft) and the user is the creator. (c) Generative-AI infrastructure customers,
      where cloud providers (Amazon/AWS is a named Decart strategic customer) license DOS to optimize their
      own model serving across NVIDIA, TPU, and Trainium silicon; the payer is the cloud platform, the user
      is its enterprise tenant, and the adoption trigger is GPU/Trainium efficiency. (d) Physical-AI and
      AV simulation buyers (Toyota Ventures and the Nintendo family appear on Decart's cap table as
      adjacent signals), where Oasis 3 Preview is positioned against in-house simulators at Waymo, Tesla,
      Wayve, and NVIDIA's DRIVE Sim; budget owner is the autonomy program head, and adoption is gated by
      physics fidelity and safety-case acceptability. Across all four cohorts, the published self-serve
      adoption path is Decart's API at platform.decart.ai - a $0.02-per-second realtime price tier plus
      cent-level image-edit calls - layered with enterprise contracts on top. The 100,000-developer
      community Decart reported to TechCrunch in June 2026 is the early funnel for paid usage.
