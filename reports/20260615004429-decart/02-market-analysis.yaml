    title: Growth drivers and constraints table
    columns:
      - driver or constraint
      - direction
      - timing
      - implication
      - diligence ask
    rows:
      - - Latency-sensitive workloads (real-time game, AV scene, livestream)
        - driver
        - Now through 2030
        - >-
          Carves a defensible wedge where batch generators (Sora, Veo, Runway) cannot serve sub-30 ms loops.
        - >-
          Quantify what fraction of Decart's revenue is genuinely latency-bound vs. batch substitutable.
      - - Cloud-gaming CAGR >50% (BCG)
        - driver
        - 2025-2030
        - >-
          Expands the addressable pool for real-time server-rendered interactive media that Decart's stack
          targets.
        - >-
          Test whether DOS / Lucy commercial wins follow cloud-gaming adoption curves.
      - - "AI adoption by game studios doubling (BCG: 20% of new 2025 Steam titles disclose AI use)"
        - driver
        - 2025-2030
        - >-
          Studio-side normalization of AI in production pipelines.
        - >-
          Confirm whether Decart wins studio business inside Unity/Unreal pipelines.
      - - EU AI Act GPAI obligations + March 2026 Copyright report
        - constraint
        - In force from 2 Aug 2025; copyright resolution proposed Mar 2026
        - >-
          Itemised training-data transparency, rebuttable infringement presumption, potential 5-7%
          turnover flat-rate fee, territorial reach to non-EU providers serving the EU.
        - >-
          Audit Decart's training-data provenance, transparency disclosures, and EU compliance roadmap.
      - - US state AI laws taking effect 1 Jan 2026 (CA SB 942 + AB 2013, TX TRAIGA)
        - constraint
        - From 1 Jan 2026
        - >-
          Adds state-by-state transparency, training-data, and governance obligations; Trump 11 Dec 2025
          executive order is testing federal preemption.
        - >-
          Map Decart's California exposure (SF R&D center) against AI Transparency Act and AB 2013
          obligations.
      - - GPU/Trainium compute cost and capacity
        - constraint
        - Ongoing through 2030
        - >-
          Real-time generation is compute-bound; DOS multi-vendor optimization is a hedge but compute
          allocation is a binding constraint.
        - >-
          Quantify Decart's compute COGS by vendor (NVIDIA / TPU / Trainium) and committed-use contracts.
      - - Player sentiment toward generative AI in art/animation
        - constraint
        - Now
        - >-
          BCG survey shows only ~10% adult negative view on AI art and ~5-7% on NPCs/quests, but consumer
          backlash risk is non-zero, especially for AAA brands.
        - >-
          Track studio-level disclosures and player community sentiment over rolling 6-month windows.
      - - Copyright opacity from training on Minecraft footage (Oasis Oct 2024 + 2026 EU framing)
        - constraint
        - Standing risk since Oct 2024
        - >-
          Adverse signal that compounds EU copyright pressure; could shape future US enforcement under
          California's AB 2013.
        - >-
          Request Decart's training-data inventory and Microsoft/Mojang or other licensor correspondence on
          Minecraft footage usage.
    notes: >-
      Constraints rows are the most material diligence content in this chapter and warrant follow-up against
      Decart's compliance posture and any unannounced licensing deals before underwriting.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Every driver and constraint cited or quantified in reviewed sources is included; soft macro factors
        (interest rates, equity-market sentiment) are intentionally excluded as out of scope.
