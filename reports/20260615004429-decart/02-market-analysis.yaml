  evidenceGaps:
    - type: missing-source
      severity: material
      topic: physical-ai-tam
      missingEvidence: >-
        No reviewed analyst source publishes an independent market size for the AV / physical-AI / world-model
        simulation segment that Decart's Oasis 3 Preview targets.
      whyItMatters: >-
        Decart's 2026 investor mix (NVIDIA, Toyota Ventures, Andrej Karpathy) appears to bet on this segment
        becoming material, but with no independent sizing the implied TAM is unverified.
      diligencePath: >-
        Commission a bottom-up AV-simulation sizing from a primary provider (e.g. NVIDIA Cosmos/DRIVE Sim,
        Applied Intuition) or estimate from disclosed AV synthetic-data programs.
      relatedQuestionRefs:
        - QM007
      relatedTableRefs:
        - TM002
    - type: access-blocked
      severity: material
      topic: cross-industry-ai-adoption
      missingEvidence: >-
        McKinsey's State of AI page returned an Access Denied error during this run, preventing direct
        citation of its cross-industry generative-AI adoption benchmarks for 2026.
      whyItMatters: >-
        State of AI is the most-cited cross-industry benchmark for AI adoption and budget penetration; its
        absence weakens the buyer-side adoption discussion.
      diligencePath: >-
        Refetch with an alternate UA profile, or pay for the McKinsey report direct, then triangulate
        adoption rates against Gartner and BCG.
      relatedQuestionRefs:
        - QM004
      relatedTableRefs:
        - TM002
    - type: access-blocked
      severity: minor
      topic: developer-survey
      missingEvidence: >-
        The 2026 GDC State of the Game Industry Report is paywalled in this run; we cite only its scope and
        title.
      whyItMatters: >-
        GDC's survey is the canonical developer-side input on generative-AI adoption inside studios.
      diligencePath: >-
        Purchase or request the 2026 GDC SOTI report and cross-check against BCG's 2025-2026 survey.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM004
    - type: conflicting-data
      severity: minor
      topic: sizing-lens-comparability
      missingEvidence: >-
        TBRC's generative-AI-in-gaming sizing and BCG's cloud-gaming forecast use different units (studio
        software revenue vs. player-hour revenue), so headline comparisons can mislead.
      whyItMatters: >-
        Different unit definitions can be summed naively into an inflated TAM; the chapter preserves them
        side-by-side rather than adding.
      diligencePath: >-
        Use one methodology per investment lens and disclose unit basis when quoting any sizing in a memo.
      relatedQuestionRefs:
        - QM005
      relatedTableRefs:
        - TM002
    - type: enumeration-incomplete
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Beyond Amazon as a named strategic customer, Decart's 2026 disclosures do not enumerate named
        enterprise customers, named studio partnerships, or named AV/robotics buyers.
      whyItMatters: >-
        Customer-concentration and pipeline visibility are the single largest gaps in the buyer-side
        analysis; without them the funnel below "100,000 developers" is opaque.
      diligencePath: >-
        Request a customer list with revenue concentration, contract type, and pilot vs. production status
        during a management session.
      relatedQuestionRefs:
        - QM019
      relatedTableRefs:
        - TM003
