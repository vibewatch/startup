    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance to Decart
    rows:
      - - Generative AI in gaming (core SAM lens)
        - >-
          Studio and creator spend on procedural content, level/world generation, NPC behavior, narrative,
          adaptive personalization, AI QA tools (TBRC / Research and Markets definition)
        - GPU hardware capex; gambling revenue; non-real-time VFX
        - Game studios, engine teams, UGC platforms (CTO/Head of Content as budget owner)
        - >-
          Lucy and Oasis directly target real-time generation for gaming and interactive entertainment; this
          is the closest publicly sized pool.
      - - Cloud gaming and real-time interactive video
        - >-
          Streaming pure-plays plus hybrid/bundled cloud-gaming services that render and serve frames remotely
          (BCG definition)
        - >-
          On-device console/PC compute; broadcast-grade streaming infra; static OTT video
        - Cloud-gaming platforms and player end-customer (consumer)
        - >-
          Decart's sub-30 ms response time and DOS infra address the same latency-sensitive serving
          bottleneck.
      - - World models and physical-AI / AV simulation
        - >-
          Software, simulation, and synthetic-scene generation for autonomous vehicles, robotics, and
          embodied AI (no public market sizing)
        - >-
          Vehicle hardware; LIDAR sensors; on-vehicle compute; vehicle-level engineering
        - >-
          AV/autonomy programs (head of autonomy/AI safety) and robotics labs
        - >-
          Oasis 3 Preview is positioned for this segment with explicit Toyota Ventures and NVIDIA backing.
      - - UGC creator economy (downstream demand pool)
        - >-
          Creator payouts on Fortnite, Roblox, Minecraft, and other platforms ($1.5B+ in 2025 per BCG)
        - >-
          Hosting/CDN infra; platform take-rates retained by storefronts
        - >-
          UGC platform (payer); individual creator (user)
        - >-
          Decart's tools accrue value as picks-and-shovels for creators on these platforms.
      - - Generative-AI inference / optimization infrastructure
        - >-
          Cloud-resold inference for low-latency models; optimization stacks licensed to clouds (Decart DOS
          on AWS Trainium is a named example)
        - >-
          Bare-metal GPU capex; training-only spend; non-inference services
        - Cloud platforms (payer); enterprise tenants of those clouds (user)
        - >-
          DOS 2.0 explicitly competes here; AWS strategic-customer relationship is the disclosed proof point.
      - - Adjacent batch / edit-pass generative video
        - >-
          Sora, Veo, Runway Gen, Luma, Adobe Firefly Video (non-real-time generation and editing)
        - >-
          Static image generation; non-video creative suites
        - Creative pros and post-production teams
        - >-
          Substitute spend pool: clients may pick batch outputs over real-time API for non-interactive
          deliverables.
    notes: >-
      "Relevance to Decart" is a qualitative judgment based on Decart's own product positioning and the
      buyer fit of each segment; included/excluded spend follows the published category definitions of TBRC,
      BCG, and Research and Markets.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover every spend pool that public sources connect to Decart's stated product line; truly
        adjacent pools (movie VFX, broadcast graphics, advertising) are excluded as out of scope rather than
        listed exhaustively.
