      - CM021
      - CM027
      - CM029
      - CM030
callouts:
  - calloutType: insight
    title: The sized SAM is small relative to the unsized adjacency Decart is betting on
    body: >-
      The most defensible publicly sized lens (generative AI in gaming, ~$5B by 2030) is materially smaller
      than the unsized AV/world-model simulation segment that Decart's 2026 investor mix (NVIDIA, Toyota
      Ventures, Andrej Karpathy) appears to underwrite.
    claimRefs:
      - CM010
      - CM011
      - CM020
      - CM024
  - calloutType: risk
    title: EU copyright pressure is a binding 2026 constraint, not a future risk
    body: >-
      The March 2026 EU Parliament report proposes itemised training-data transparency, a rebuttable
      infringement presumption, and a 5-7% global-turnover flat-rate copyright fee; combined with the still
      unresolved Minecraft training-data question from Oct 2024, Decart's EU exposure is a live diligence
      item.
    claimRefs:
      - CM031
      - CM032
      - CM033
      - CM038
  - calloutType: strength
    title: Latency-bound demand looks defensible
    body: >-
      Real-time generation (sub-30 ms loops for gameplay, AV simulation, livestream) is a category where
      batch generators cannot compete and where Decart has shipping product (Lucy 2.1, Oasis 3 Preview, DOS
      2.0) and disclosed cloud partnerships.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM025
      - CM026
