company:
  name: Decart
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Decart competes in real-time generative AI for gaming, interactive video, world models, and physical-AI
    simulation. Generative AI in gaming is independently sized at $1.79B in 2025 growing to ~$5.09B by 2030
    (TBRC, ~23% CAGR), cloud gaming at $1.4B to $18.3B over the same window (BCG, >50% CAGR), and adjacent
    physical-AI / AV simulation revenue is unsized in public sources. Buyers split between game studios and
    UGC platforms, generative-AI infrastructure customers (clouds, AV builders, robotics labs), and developer
    self-serve, with EU copyright/AI Act obligations and US state-law fragmentation as 2026 adoption
    constraints whose binding force on training data and inference disclosure is still being calibrated.
sections:
  - id: section-1
    title: Market boundary, included spend, and status-quo substitutes
    body: >-
      Decart's addressable market sits at the intersection of three loosely linked spend pools rather than
      one mature category. The first is generative AI in gaming, defined by independent analyst firms as
      revenues from procedural content generation, level/world building, NPC behavior, narrative generation,
      adaptive personalization, and AI-driven QA inside game studios and creator-economy platforms. The
      second is real-time generative video and interactive video, where Decart's Lucy 2.1 transforms or
      generates a continuous stream and competes with edit-pass video models (Runway, Luma, Adobe Firefly
      Video) and with the in-game video pipelines of UGC platforms (Fortnite, Roblox, Minecraft). The third
      is physical-AI / world-model simulation, where Oasis 3 Preview targets autonomous-vehicle data
      generation alongside Waymo's in-house simulator, NVIDIA's Cosmos/DRIVE Sim stack, World Labs Marble,
      Google DeepMind Genie 3, and Tesla's and Wayve's proprietary AV simulators. Status-quo substitutes are
      decisive at the buyer level: hand-built game content (artists, designers, cinematics teams), traditional
      driving-sim engines (Unreal/CARLA), and conventional non-real-time video models (Sora, Veo, Runway Gen)
      that ship batch outputs rather than sub-30-millisecond interactive frames. Excluded spend includes
      regulated commercial gambling (the $51B/month AGA series is a different pool), GPU hardware capex (an
      input cost rather than software revenue), and broadcaster/film VFX spend that is not real-time. Decart's
      $0.02-per-second list price prices its API at the boundary between developer-tools spend and inference
      compute, which means the company's market boundary is best read as a horizontal real-time generative-AI
      infrastructure category rather than as a gaming-only line item.
    claimRefs:
