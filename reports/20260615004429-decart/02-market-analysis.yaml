  - id: FM004
    title: Adoption funnel or value-chain map
    type: funnel
    layout: standard
    summary: >-
      Adoption funnel from broad real-time generative-AI awareness, to Decart developer signups, to paid API
      usage, to enterprise/named-strategic-customer status. Most paid stages are undisclosed in 2026 public
      sources, so the funnel narrows from a public 100,000 developer count to a single named enterprise
      customer.
    data:
      items:
        - label: Decart developer community (June 2026)
          value: 100000
          unit: developers
          detail: Self-reported by Leitersdorf to TechCrunch; primary top-of-funnel signal.
          tone: positive
        - label: Paid API customers (publicly disclosed)
          value: 0
          unit: named customers
          detail: Decart monetises Lucy/Oasis via per-second API but does not publish paid-customer counts.
          tone: warning
        - label: Strategic enterprise customers named
          value: 1
          unit: named customers
          detail: Amazon is the only publicly named strategic customer; other names undisclosed.
          tone: warning
        - label: Cumulative capital raised (USD millions)
          value: 450
          unit: USD millions
          detail: Decart self-reports over $450M raised cumulatively as of May 2026.
          tone: positive
        - label: Latest valuation (USD billions)
          value: 4
          unit: USD billions
          detail: May 2026 Radical-led round at ~$4B valuation; sets the implied SOM expectation.
          tone: positive
    approximationNotes: >-
      Funnel mixes developer-population, customer counts, and capital metrics because Decart does not
      publish a unified buyer funnel; each stage is the best public proxy.
