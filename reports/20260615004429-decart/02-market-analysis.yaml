  - id: section-4
    title: Growth drivers, adoption constraints, and contradictions to preserve
    body: >-
      The tailwinds are concrete. Latency-sensitive workloads (real-time gameplay, AV scene generation,
      livestream video transformation) are an underserved gap left by batch-oriented video and image
      generators; cloud gaming's >50% CAGR and the doubling of AI-disclosing Steam titles between 2024 and
      2025 both indicate a real-time generative-AI infrastructure wedge. The headwinds are equally concrete.
      The European Parliament's March 2026 own-initiative report (rapporteur Axel Voss, 17-3 vote) demands
      itemised transparency over all copyright-protected training data, proposes a rebuttable presumption of
      infringement absent transparency, and floats a 5-7% global-turnover flat-rate copyright fee on
      generative-AI providers; Osborne Clarke characterizes this as a "watershed moment" for the EU
      regulatory regime. The EU AI Act's General Purpose AI obligations have been in force since 2 August
      2025, with the Digital Omnibus delaying the high-risk obligations originally scheduled for August
      2026. In the US, the California AI Transparency Act and GenAI Training Data Transparency Act took
      effect on 1 January 2026, the Texas Responsible AI Governance Act took effect the same day, and the
      Trump administration's 11 December 2025 executive order directed DOJ to challenge state AI laws on
      preemption grounds. The US Copyright Office's ongoing report series remains the primary federal
      framing for AI and copyright. Contradictions to preserve: (i) cloud-gaming forecasts disagree with
      generative-AI-in-gaming forecasts on scale and unit (player-hours vs. studio software spend); (ii)
      physical-AI simulation has no published TAM yet Decart's investors (Toyota Ventures, NVIDIA, Radical)
      bet that it becomes Decart's largest segment; (iii) studio adoption of AI is rising but BCG's own
      survey shows player resistance to AI in art/animation, suggesting consumer-side adoption risk; (iv)
      the GDC 2026 State of the Game Industry Report - the canonical developer survey - is paywalled in
      this run and not directly cited in the figures here.
    claimRefs:
