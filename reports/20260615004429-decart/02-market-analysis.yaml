  - id: section-2
    title: Sizing lenses, ranges, and methodology limits
    body: >-
      No single public sizing captures Decart's full opportunity, so three lenses anchor the chapter. Lens 1
      (generative AI in gaming, the closest pure-play): The Business Research Company sizes the market at
      $1.79 billion in 2025 growing to $2.21 billion in 2026 and $5.09 billion by 2030 at 23.2% CAGR, with
      Asia-Pacific the largest region in 2025; Research and Markets republishes a near-identical 2025-2030
      forecast and extends the series to 2035 with deterministic and nondeterministic segments. Lens 2
      (cloud gaming as a proxy for low-latency, server-rendered interactive entertainment): BCG's 2026 Video
      Gaming Report puts cloud gaming at roughly $1.4 billion in 2025 expanding to about $18.3 billion in
      2030 at a compound annual growth rate above 50%, and notes that 60% of surveyed players have tried
      cloud gaming with 80% reporting a positive experience. Lens 3 (UGC creator economy, the platform layer
      Decart's tools enable): BCG reports Fortnite and Roblox UGC creator payouts exceeding $1.5 billion in
      2025 and 40% of gamers consuming more UGC than a year earlier. None of these lenses size the physical-AI
      / world-model simulation segment that Oasis 3 explicitly targets, and McKinsey's State of AI report -
      the most-cited cross-industry benchmark - was access-denied during this run. The chapter therefore
      preserves three quoted ranges side-by-side, treats the generative-AI-in-gaming series as the most
      directly relevant SAM lens, and flags physical-AI simulation as an evidence-constrained TAM whose
      independent sizing is not yet published.
