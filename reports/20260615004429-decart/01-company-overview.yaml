  - id: section-2
    title: Founders, leadership, governance, and key-person dependence
    body: >-
      Decart was founded in late 2023 by Dr. Dean Leitersdorf (CEO) and Moshe Shalev (CPO), who met as Unit 8200
      reservists in Israel's military intelligence corps. Leitersdorf earned three computer-science degrees and a
      doctorate from the Technion before turning twenty-four, while Shalev grew up in Israel's ultra-Orthodox
      community in Bnei Brak before serving in Unit 8200 and joining Decart as its operations-and-product lead.
      Public materials also identify Dr. Kfir Aberman, a co-creator of the DreamBooth diffusion-tuning technique
      and a former senior researcher at Snap and Google, as the head of the company's San Francisco R&D center
      from the August 2025 Series B onward. Decart's own May 2026 announcements continue to treat Leitersdorf as
      the public-facing CEO and primary spokesperson, and the company has not published an independent board
      composition or governance disclosures in any reviewed source. That pattern, paired with the small executive
      surface area named in coverage, supports a high key-person dependence on Leitersdorf and a still-thin
      governance picture even after the $300 million Radical-led round. Decart is a Delaware C-corp marketed as
      Decart.AI, Inc. through investor and trade releases, and the public record does not yet describe outside
      directors, an audit committee, or any independent board chair.
