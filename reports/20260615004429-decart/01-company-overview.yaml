callouts:
  - calloutType: strength
    title: Vertical integration is a real moat candidate
    body: >-
      Decart's own DOS optimization stack underlies both Lucy and Oasis, runs across NVIDIA, Trainium3, and TPU,
      and is the only public claim that ties the company's frontier-model demos to a durable infrastructure
      story rather than to a single viral demo.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO042
      - CO043
  - calloutType: insight
    title: Investor coalition reads as strategic, not just financial
    body: >-
      The 2026 round combines a frontier-AI lead (Radical), a strategic chip partner (NVIDIA), and corporate
      VCs from creative tools (Adobe), automotive (Toyota), and commerce (eBay) - the same verticals Decart
      names as Lucy and Oasis customer industries.
    claimRefs:
      - CO025
      - CO026
      - CO029
      - CO030
      - CO034
  - calloutType: risk
    title: Founder concentration and undisclosed financials are live diligence issues
    body: >-
      Public materials disclose two co-founders, one US R&D lead, and no board composition; revenue, headcount,
      and cap-table economics remain self-reported. Combined with TechCrunch's Oasis 3 caveats and the
      unresolved Minecraft training-data question, this is the cluster of unknowns that most affects
      underwriting confidence.
    claimRefs:
      - CO013
      - CO022
      - CO040
      - CO049
      - CO050
