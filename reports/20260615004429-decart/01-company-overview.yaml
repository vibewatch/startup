  - id: section-4
    title: Milestone chronology, scale signals, and evidence gaps
    body: >-
      The public chronology runs from the late-2023 founding, through the October 31, 2024 stealth exit and Oasis
      viral demo, into a 2025 build-out (Mirage launch, $100 million Series B, San Francisco R&D center, growth
      from roughly fifteen to about sixty employees) and a 2026 strategic-infrastructure push (DOS 2.0 announce,
      AWS Trainium3 partnership for Lucy2, Amazon strategic-customer designation, $300 million Radical-led round
      at a roughly $4 billion valuation, and the June 10, 2026 Oasis 3 Preview launch on a public API at $0.02
      per second). Decart publicly claims that Lucy operates at sub-30-millisecond response time and that the
      DOS stack delivers more than 100-fps full-HD inference and over 1,600 tokens-per-second agentic throughput,
      and the company says it serves a developer community exceeding 100,000 users. Adverse and uncertain signals
      coexist with this growth story: TechCrunch's October 2024 review of Oasis flagged unresolved copyright
      questions because the model was trained on Minecraft footage without disclosed permission from Microsoft;
      TechCrunch's June 2026 review of Oasis 3 reported that long generations degrade, that cars drive through
      other cars, and that physics consistency is an open research problem; and audited revenue, an exact current
      headcount, an itemized cap table, and an independent board composition are still not in the public record.
      The chapter therefore preserves Decart as a fast-scaling, well-capitalized infrastructure-leaning
      world-models lab whose key diligence variables remain founder concentration, undisclosed financial detail,
      and the gap between hyper-real demos and production-grade physics.
