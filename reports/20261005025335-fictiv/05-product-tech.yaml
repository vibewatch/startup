artifact: product-tech
slug: fictiv
runDate: 2026-10-05
company:
  name: Fictiv
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Fictiv delivers a software-mediated manufacturing workflow that accepts customer CAD
    and specifications, configures process and material choices, supplies automated DFM
    feedback, routes work to subcontracted manufacturing partners, and returns order and
    inspection records. The visible product is mature enough to support quoting and order
    management, but public evidence remains weak on uptime, integrations, certification
    scope, the underlying production software stack, and independently measured quality.
sections:
  - id: product-surface
    title: Product surface and manufacturing coverage
    body: >-
      Fictiv is best understood as a managed digital-manufacturing service rather than a
      standalone engineering application or an owned-factory operator. Its public workflow
      covers CNC machining, 3D printing, urethane casting, die casting, and injection
      molding, with process, material, finish, quantity, and drawing inputs captured before
      quotation. The surrounding resource center adds design guides, checklists, selectors,
      calculators, and process education, which reduces customer preparation friction but
      does not itself prove production performance. The module map therefore separates the
      transactional platform, manufacturability guidance, manufacturing service lines,
      production visibility, and educational tooling. Public sources establish breadth and
      workflow mechanics more clearly than service-level reliability, API availability, or
      process-by-process certification coverage.
    claimRefs: [CE001, CE002, CE003, CE013]
    tableRefs: [TE001]
  - id: customer-workflow
    title: Customer workflow from CAD to delivered part
    body: >-
      A customer creates an account, uploads a supported CAD or drawing file, configures the
      manufacturing process and requirements, receives a quote and automated DFM feedback,
      then checks out and monitors production. The official walkthrough says the platform
      can auto-generate a 2D drawing from a 3D CAD file and provides order status, shipment
      tracking, inspection-report data, part photos, and access to drawings after purchase.
      This is a coherent digital thread at the customer interface, and the 2021 launch of
      real-time part photos and inspection data indicates that production transparency has
      been a product priority. However, the assigned evidence does not quantify quote
      accuracy, DFM defect detection, delivery reliability, system uptime, or the share of
      orders receiving each quality artifact.
    claimRefs: [CE002, CE003, CE005]
    tableRefs: [TE002]
  - id: operating-architecture
    title: Operating architecture and differentiation
    body: >-
      The operating model combines cloud software with an orchestration layer and a managed
      network of external manufacturers. Fictiv describes design, quoting, billing, and
      logistics systems feeding an intelligent orchestration engine; an independent 2020
      profile likewise described workflow software paired with vetted manufacturers and
      AI/ML-assisted manufacturability feedback. The same profile reported that Fictiv did
      not own factories or machine shops, while the current terms expressly permit
      subcontracting and sharing customer specifications with manufacturing partners.
      Fictiv's differentiation is therefore the control plane, partner management, and
      information flow, not proprietary production assets. A 2026 competitor-authored
      comparison asserts stronger workflow visibility than Xometry, but its commercial
      relationship and absence of disclosed testing make that evidence directional rather
      than an independent benchmark.
    claimRefs: [CE004, CE006, CE007, CE008, CE015, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-quality-and-roadmap
    title: Trust, quality, security, and roadmap gaps
    body: >-
      Contract terms expose the most decision-relevant product risks. Customers remain
      responsible for complete specifications and correct implementation of DFM feedback;
      partner subcontracting requires specification sharing; the standard warranty is only
      72 hours unless a quote states otherwise; and high-risk products face additional
      exclusions. Fictiv may use service data internally, generally in de-identified or
      aggregated form, while promising not to train generative AI on customer data unless
      it has been irreversibly de-identified and aggregated. The terms also disclaim
      uninterrupted or error-free service and preservation of data without loss. Public
      material reviewed here does not provide an auditable security architecture, uptime
      history, API documentation, developer ecosystem, certification scope, or dated
      product roadmap. A Scribd upload names WordPress, PHP, Python, and MySQL, but its
      AI-enhanced description and missing primary documentation make that stack claim
      unsuitable for underwriting.
    claimRefs: [CE009, CE010, CE011, CE012, CE014]
