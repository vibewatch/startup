callouts:
  - calloutType: risk
    title: Control-plane value depends on partner execution
    body: >-
      Fictiv's software can standardize intake, routing, and visibility, but the current
      terms permit subcontracting, specification sharing, and broad warranty limitations.
      Underwriting should therefore test partner-level quality and security controls rather
      than treating the platform interface as proof of uniform factory execution.
    claimRefs: [CE008, CE010, CE011, CE012, CE016]
