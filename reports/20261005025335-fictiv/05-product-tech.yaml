      - ["Place and monitor an order", "Accept quote, pay, then track production and shipping", "Status, delivery estimate, and tracking number", null, "Obtain historical on-time delivery and cancellation rates"]
      - ["Review quality evidence", "Access inspection reports, part photos, and ordered-part drawings", "Cloud-based production records", null, "Confirm artifact coverage, retention period, and auditability by process"]
    notes: "The sources describe workflow features but provide no common denominator or current performance KPI; null means no measurable benefit was disclosed."
    claimRefs: [CE002, CE003, CE005, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - External dependency
      - Primary risk
    rows:
      - ["Customer specification layer", "Captures CAD, drawings, quantities, and special requirements", "Customer data quality and completeness", "Incorrect specifications or DFM implementation remain the customer's responsibility"]
      - ["Commerce and workflow systems", "Quote, configure, bill, collaborate, and track orders", "Internet service and undisclosed software infrastructure", "No public uptime, recovery, or integration evidence"]
      - ["Orchestration engine", "Matches work to managed production capacity", "Matching logic and partner availability", "Public evidence does not quantify match quality or capacity resilience"]
      - ["Manufacturing partner network", "Produces custom parts for Fictiv orders", "Third-party factories and subcontractors", "Specifications are shared and partner acts or omissions are contractually constrained"]
      - ["Quality and order record", "Returns photos, inspection data, drawings, and shipment status", "Partner inspection processes and data capture", "Coverage, retention, and independent quality benchmarks are undisclosed"]
    notes: "Architecture is reconstructed only from the assigned official terms, official product descriptions, and one independent 2020 profile; internal implementation details remain unverified."
    claimRefs: [CE004, CE007, CE008, CE012]
