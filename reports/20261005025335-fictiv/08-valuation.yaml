callouts:
  - calloutType: "insight"
    title: "Capital Recovery and Strategic Exit Realization"
    body: "MISUMI Group's $350 million all-cash acquisition of Fictiv provided a clean liquidity event for early and late-stage investors, returning capital above the $192 million invested. However, the transaction valuation highlights that hardware-marketplace software platforms often face valuation caps when constrained by physical gross margins and working capital intensity."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV010"
  - calloutType: "risk"
    title: "Operational and Export Compliance Constraints"
    body: "Fictiv's operating terms strictly exclude weapon manufacturing and place full customs, tariff, and export compliance liabilities (ITAR/EAR) on customers. These rigid legal boundaries, combined with non-cancellable custom orders, highlight that platform scaling requires rigorous operational oversight across cross-border fulfillment corridors."
    claimRefs:
      - "CV012"
      - "CV013"
