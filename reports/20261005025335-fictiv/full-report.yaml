        - Eliminates platform margin squeeze on volatile metals/resins, shifting inflation risk to buyer
        - Fictiv Terms of Service (Section 9)
      - - Order Cancellation & Refunds
        - Custom orders cannot be cancelled once placed; no refunds after quote acceptance
        - 100% committed revenue upon order confirmation
        - Eliminates WIP inventory inventory write-downs and cancellation stranded costs
        - Fictiv Terms of Service (Section 6)
      - - Shipping & Tariff Allocation
        - EXW (customer pays inland freight and duties) or DDP (Fictiv IOR with prepaid duties)
        - Tariffs and duties passed directly through to customer invoice
        - Insulates Fictiv from customs clearance penalties and tariff rate adjustments
        - Fictiv Terms of Service (Section 8)
