chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Operating Model, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Fictiv was founded in 2013 by brothers Dave and Nate Evans. Its operating model combines digital quoting,
              design-for-manufacturability feedback, order tracking, and sourcing with a managed network of
              manufacturing partners rather than presenting a single-factory model. The current company page names
              Centers of Excellence and in-region teams in the United States, Mexico, India, and China, while a live
              company-authored Mexico quality-engineering posting describes coordination with counterparts in China,
              India, and the United States. The precise headquarters label needs reconciliation: Tracxn describes San
              Francisco as the headquarters, whereas Fictiv's May 2026 terms name Oakland as its principal place of
              business. The latter is a legal-address statement, not proof that every operating function moved from San
              Francisco.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
