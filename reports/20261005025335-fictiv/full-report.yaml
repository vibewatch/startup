  - id: TV002
    title: Core Thesis and Anti-Thesis Analysis
    columns:
      - Thesis Pillar
      - Core Argument
      - Anti-Thesis Risk
      - Thesis-Break Indicator
    rows:
      - - Market Architecture
        - Cloud orchestration abstracts supplier fragmentation across CNC, 3D printing, and molding
        - Low switching costs for enterprise customers who multi-source across brokers
        - Loss of tier-one enterprise accounts or gross margin compression below 20%
      - - Scale Economics
        - 35M+ components delivered across 3,000+ companies with automated DFM engines
        - High fulfillment overhead and quality inspection costs across global partner shops
        - Sustained rise in scrap rates or delivery dispute claims exceeding contractual thresholds
      - - Strategic Synergy
        - Direct integration into MISUMI's physical infrastructure and 318,000 corporate clients
        - Integration friction, corporate overhead allocation, and potential supplier attrition
        - Turnover in core engineering leadership or stagnation in cross-sold digital orders
    notes: Evaluates the strategic drivers and risks governing Fictiv's business model inside MISUMI.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
