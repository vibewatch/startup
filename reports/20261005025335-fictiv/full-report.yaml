        - No qualified partner is available or a partner repeatedly fails quality requirements
        - High
        - Supplier audits, CAPA, 8D, PPAP, FAI, and cross-region quality staff
        - High until capacity, concentration, and scorecard data are reviewed
      - - Cross-border logistics and customs
        - Carriers, customs brokers, manufacturing partners, and import authorities
        - Movement and entry of custom parts
        - Four-country footprint reported; lane mix undisclosed
        - Delay, tariff change, customs information failure, or force-majeure interruption
        - High
        - Multiple centers, delivery notices, IOR options, and contractual pass-through
        - Medium-high because route redundancy and customer price tolerance are unquantified
      - - Parent integration and strategic prioritization
        - MISUMI Group / MISUMI Americas
        - Corporate integration, investment, platform direction, and commercial coordination
        - Single parent relationship
        - Integration changes product priorities, control ownership, talent retention, or execution cadence
        - Medium-high
        - Broader MISUMI platform initiatives and parent investment announcements
        - Medium-high because Fictiv-specific integration KPIs and governance are not public
      - - Input costs and customer pass-through
        - Material suppliers, trade authorities, and customers
        - Materials, tariffs, duties, and order economics
        - Supplier and customer mix undisclosed
        - Input-cost or duty increases cannot be passed through without order loss or margin compression
        - Medium-high
        - Terms permit renegotiation at a 3% material-cost change and allocate duties to customers
        - Medium because realized pass-through, gross margin, and cancellation sensitivity are unknown
    notes: >-
      Ordered by severity; concentration is reported as unknown where the assigned sources provide no counterparty,
      lane, revenue, or process denominator.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR013
      - CR014
