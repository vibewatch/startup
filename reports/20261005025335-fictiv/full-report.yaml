              - CE003
              - CE004
              - CE005
              - CE008
              - CE016
      - number: '5.4'
        title: Trust, quality, security, and roadmap gaps
        blocks:
          - type: paragraph
            body: >-
              Contract terms expose the most decision-relevant product risks. Customers remain responsible for complete
              specifications and correct implementation of DFM feedback; partner subcontracting requires specification
              sharing; the standard warranty is only 72 hours unless a quote states otherwise; and high-risk products
              face additional exclusions. Fictiv may use service data internally, generally in de-identified or
              aggregated form, while promising not to train generative AI on customer data unless it has been
              irreversibly de-identified and aggregated. The terms also disclaim uninterrupted or error-free service and
              preservation of data without loss. Public material reviewed here does not provide an auditable security
              architecture, uptime history, API documentation, developer ecosystem, certification scope, or dated
              product roadmap. A Scribd upload names WordPress, PHP, Python, and MySQL, but its AI-enhanced description
              and missing primary documentation make that stack claim unsuitable for underwriting.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Control-plane value depends on partner execution
            body: >-
              Fictiv's software can standardize intake, routing, and visibility, but the current terms permit
              subcontracting, specification sharing, and broad warranty limitations. Underwriting should therefore test
              partner-level quality and security controls rather than treating the platform interface as proof of
              uniform factory execution.
            calloutType: risk
            claimRefs:
              - CE008
              - CE010
              - CE011
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buying Roles
        blocks:
          - type: paragraph
            body: >-
              Fictiv positions the service for hardware teams moving from a CAD file and prototype through production,
              with engineers using instant quoting, design-for-manufacturability feedback, order tracking, and a managed
              manufacturing network. The addressable user set spans early-stage companies and large enterprises, while
              the commercial roles called out in the evidence include supply-chain managers, procurement teams,
              engineers, and program leaders. The company names robotics, aerospace, medtech, automotive, EV and eVTOL
              among served verticals, but it does not disclose account, order, or revenue mix by vertical or customer
              size. A Fictiv-authored 2024 manufacturing report also describes resilience, agility, speed, efficiency,
              revenue, and cost pressure among manufacturing and supply-chain teams; that industry context helps explain
              buyer demand but is not evidence of Fictiv customer conversion.
            claimRefs:
              - CU001
              - CU004
              - CU008
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU008
              - CU010
              - CU016
      - number: '6.2'
        title: Adoption Scale and Customer Proof
        blocks:
          - type: paragraph
            body: >-
              The strongest scale evidence is company-issued and cumulative. Fictiv's current homepage reports more than
              42 million parts manufactured through its network and more than 6,000 companies served; a February 2021
              company release reported more than 12 million parts over the preceding six years. These vintages indicate
              a larger disclosed production footprint, but definitions may have changed and the figures provide neither
              annual order volume nor active-account denominators, so they cannot support a growth rate, retention
              estimate, or cohort conclusion. Named proof is much thinner: the 2021 release cites traction with
              enterprise companies such as Honeywell, while the homepage carries a Heliospace engineer's three-day
              turnaround testimonial. Neither source discloses contract value, recurring order volume, deployment
              duration, or a controlled outcome baseline.
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU007
              - CU008
      - number: '6.3'
        title: Expansion Signals and Durability
        blocks:
          - type: paragraph
            body: >-
              Current hiring language provides a directional, not realized, view of expansion. A MISUMI Americas
              strategic-program role describes serving enterprises and startups from new product development and
              introduction through mass production, with cross-functional sales, engineering, fulfillment, and
              customer-advocacy responsibilities. A separate business-systems role covers PLM, ERP, TMS, and MRP systems
              and explicitly balances customer satisfaction, growth, reliable delivery, and efficiency. Together these
              company-issued job descriptions suggest an effort to embed Fictiv more deeply in customer workflows after
              the MISUMI combination, but they do not prove renewal, wallet-share expansion, or successful production
              conversion. No NRR, GRR, churn, contract-length, cohort, satisfaction, or repeat-order metric appears in
              the retained evidence, leaving durability and concentration as material private-data diligence items.
            claimRefs:
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU011
              - CU012
              - CU014
              - CU015
      - number: '6.4'
        title: Commercial Friction and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              Fictiv's May 2026 standard terms create procurement friction that may matter more as customers move into
              regulated or production use. Orders cannot be cancelled after placement and accepted quotes are not
              refunded; defect claims require an RMA and return within 72 hours of delivery. Products designated as high
              risk, including specified medical-device, automotive, aircraft, aeronautics, and weaponry applications, do
              not receive the standard limited warranty, and customers must accept and pay even when those products do
              not materially conform to specifications. These are standard-form terms rather than negotiated enterprise
              agreements, but they show why production durability cannot be inferred from aggregate part counts. The
              current newsroom snapshot emphasizes platform, investment, award, and partnership headlines without
              customer-level deployment outcomes, while the remaining evidence is overwhelmingly company- or
              investor-issued rather than independent customer validation.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption breadth is not durability
            body: >-
              The 6,000+ companies-served and 42M+ parts figures are cumulative company claims. Without active-account,
              repeat-order, cohort-retention, contract-length, or concentration data, they cannot establish recurring
              customer demand.
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
          - type: callout
            title: Prioritize customer-level data
            body: >-
              Request active-customer cohorts, repeat-order frequency, NRR and GRR, top-customer revenue concentration,
              segment gross profit, production conversion, and reference calls that distinguish pilots from recurring
              production.
            calloutType: recommendation
            claimRefs:
              - CU005
              - CU007
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              Fictiv's risk profile is shaped by coordinating sensitive technical data, custom production, and
              cross-border delivery through a distributed partner network. The most consequential exposure is not proof
              of a recorded enforcement action or systemic quality failure; the assigned evidence does not establish
              either. It is the combination of high-impact failure modes and missing frequency data. Fictiv says
              unsupported EAR classifications require off-platform review, while its terms prohibit customers from
              uploading controlled CCL or USML data and allocate substantial compliance responsibility to them [CR001,
              CR002, CR003]. Operationally, one independent review documents an order and shipping failure, while other
              reviews report on-time, in-spec delivery, so the available sample shows variance rather than a reliable
              defect or late-delivery rate [CR005, CR006]. The investment view should therefore remain conditional on
              private control-testing, supplier-quality, and post-integration KPI evidence rather than treating
              published policies as proof of effective execution [CR008, CR009, CR010, CR016].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR009
              - CR010
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and data-handling exposure
        blocks:
          - type: paragraph
            body: >-
              Export controls are the clearest regulatory boundary in the public record. Fictiv states that its
              platform-supported EAR classifications are limited to EAR99 and 9E991, with other EAR-controlled projects
              initiated off-platform before files are uploaded [CR001]. Its stated mitigation combines classification
              confirmation and automated detection of export-control language, while the terms place a separate
              obligation on customers not to upload CCL- or USML-controlled data [CR002, CR003]. This layered design is
              directionally credible but remains company-issued evidence; no regulator audit, control-test result,
              exception volume, or incident history was available in the assigned pool. Contract terms also narrow
              remedies for high-risk products and disclaim uninterrupted or error-free service, increasing diligence
              importance for safety-critical or confidential programs [CR004, CR015]. These provisions describe
              allocation of risk, not the incidence of claims or failures, and absence of a cited incident cannot be
              read as evidence that none occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR015
      - number: '7.3'
        title: Operational, quality, and counterparty dependencies
        blocks:
          - type: paragraph
            body: >-
              Manufacturing-partner execution is a structural dependency. Fictiv's terms permit subcontracting,
              disclosure of specifications to manufacturing partners, and order cancellation when no partner is
              available; they also limit Fictiv's responsibility for partner acts outside specified return and warranty
              obligations [CR007, CR013]. The current company-issued quality-engineer posting shows a mitigation system
              built around supplier audits, CAPA, 8D root-cause work, PPAP, FAI, and cross-region standardization, but
              it publishes no rejection, escape, rework, or on-time-in-full metrics [CR008]. The independent review
              sample is mixed: a specific April 2025 complaint reports an order miss and shipment delay, while several
              other customers report timely and conforming parts [CR005, CR006]. LeadIQ describes four operating centers
              across the United States, Mexico, China, and India and a May 2026 MISUMI integration, adding geographic
              diversification but also cross-border and integration complexity [CR009]. Neither diversification nor
              process documentation establishes consistent supplier performance.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR008
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
      - number: '7.4'
        title: Financial exposure, monitoring indicators, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Public financial risk evidence is insufficient for a burn, runway, or liquidity conclusion. A 2021 company
              release says a $35 million Series D brought total investment to $92 million and was intended partly for
              supply-chain and network infrastructure; this is historical funding raised, not current cash available
              [CR011]. Current terms allow repricing negotiations after a material-cost increase of at least 3% and
              allocate tariffs and duties to the customer, but public evidence does not show pass-through acceptance,
              gross-margin sensitivity, working-capital needs, or bad-debt exposure [CR014]. The practical monitoring
              set is therefore exception-based: off-platform export classifications, controlled-data alerts, supplier
              nonconformance and CAPA aging, late-order incidence, RMA outcomes, partner concentration, and
              Fictiv-specific post-integration quality and margin KPIs [CR016]. Thesis-break events should include a
              material export-control breach or enforcement action, persistent quality or delivery deterioration without
              corrective closure, loss of critical manufacturing capacity without rerouting, or liquidity evidence
              inconsistent with required service levels. These are diligence triggers, not claims that such events have
              occurred.
            claimRefs:
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not infer a clean incident history
            body: >-
              The assigned pool contains policies, terms, a job posting, company announcements, market-data summaries,
              and customer reviews; it does not contain a regulator clearance, complete litigation search, security
              audit, or incident register. No recorded incident in this evidence set is not evidence of no incident.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR015
          - type: callout
            title: Evidence required before risk can be underwritten
            body: >-
              Require export-control test results, supplier concentration and scorecards, on-time-in-full and RMA
              cohorts, security assurance, Fictiv-specific post-integration KPIs, and current liquidity and margin
              evidence. Deterioration without timely corrective closure should break the operating thesis.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR009
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Fictiv rests on its cloud-orchestrated digital manufacturing platform,
              which virtualizes custom mechanical component procurement across a distributed network of vetted
              manufacturing partners. By replacing weeks of fragmented offline sourcing with automated
              design-for-manufacturability analysis and rapid quoting across 3D printing, CNC machining, urethane
              casting, and injection molding, Fictiv achieved substantial volume scale, producing over 35 million
              prototype and commercial parts across sectors such as robotics, aerospace, clean energy, and medical
              devices. However, the investment anti-thesis highlights that Fictiv remained structurally unprofitable as
              an independent venture, facing intense competition, low custom-parts gross margins, and heavy working
              capital demands that capped its independent upside and necessitated an outright sale to an industrial
              acquirer.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Financing History and Acquisition Context
        blocks:
          - type: paragraph
            body: >-
              Founded in 2013 by Dave Evans and Nate Evans, Fictiv built out its capital base through progressive equity
              rounds, raising an early $15 million Series B led by Sinovation Ventures in May 2018, a $35 million Series
              D in February 2021 led by 40 North Ventures with Honeywell, and a $100 million Series E in May 2022 led by
              Activate Capital. Cumulative private funding reached $192 million across institutional backers including
              Accel, Bill Gates, G2 Venture Partners, and Standard Investments. In April 2025, Fictiv executed an
              agreement to be acquired by Japanese industrial components distributor MISUMI Group Inc. in an all-cash
              transaction valued at $350 million, absorbing Fictiv's 400 employees and distributed production operations
              across the United States, China, India, and Mexico into MISUMI's global logistics network spanning 318,000
              corporate clients.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Valuation Scenarios and Operational Boundaries
        blocks:
          - type: paragraph
            body: >-
              The $350 million all-cash acquisition benchmark reflects an estimated 2.5x to 3.5x trailing revenue
              multiple, representing a fair exit multiple for on-demand manufacturing platforms given typical custom
              hardware fabrication gross margins of 25% to 35%. While the acquisition delivered a full cash recovery
              exceeding total invested capital of $192 million, the implied capital efficiency indicates a modest
              multiple on invested capital for late-stage venture participants. Furthermore, Fictiv's commercial terms
              enforce strict customer liabilities, operational restrictions against weapon-related production,
              non-cancellable custom purchase orders, and mandatory customer indemnification for export controls,
              underscoring material compliance boundaries that govern platform utilization within MISUMI.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV010
              - CV011
      - number: '8.4'
        title: Recommendation Stance and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our formal recommendation stance is track with medium confidence, reflecting a fair valuation stance
              anchored to the $350 million transaction benchmark. Because Fictiv has transitioned from an independent
              venture asset to a wholly owned operating subsidiary of MISUMI Group Inc., direct equity investment is no
              longer accessible outside of MISUMI public equity. Priority diligence asks focus on post-acquisition
              integration milestones, commercial synergy realization across MISUMI's 318,000 industrial client base, key
              personnel retention across the 400-employee technical team, and unit-level gross margin progression across
              regional production facilities.
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Recovery and Strategic Exit Realization
            body: >-
              MISUMI Group's $350 million all-cash acquisition of Fictiv provided a clean liquidity event for early and
              late-stage investors, returning capital above the $192 million invested. However, the transaction
              valuation highlights that hardware-marketplace software platforms often face valuation caps when
              constrained by physical gross margins and working capital intensity.
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV010
          - type: callout
            title: Operational and Export Compliance Constraints
            body: >-
              Fictiv's operating terms strictly exclude weapon manufacturing and place full customs, tariff, and export
              compliance liabilities (ITAR/EAR) on customers. These rigid legal boundaries, combined with
              non-cancellable custom orders, highlight that platform scaling requires rigorous operational oversight
              across cross-border fulfillment corridors.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
