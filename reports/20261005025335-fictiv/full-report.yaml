        blocks:
          - type: paragraph
            body: >-
              Company disclosures show a larger cumulative operating footprint over time: the May 2022 Series E release
              cited more than 19 million parts and more than 3,000 product companies, while the current about page
              displays more than 42 million parts and more than 5,000 companies served. These are cumulative company
              claims, not audited revenue or recurring customer metrics. Financing evidence is clearer historically:
              Fictiv announced a $35 million round in February 2021 and a $100 million Series E in May 2022; the latter
              brought disclosed total funding to $192 million. The current company page instead shows "$200M total
              investment," a differently named and later figure that should not be treated as revenue, cash available,
              or a precise funding total without reconciliation. Third-party profiles classify Fictiv as acquired and
              report integration with MISUMI in May 2026, but the assigned evidence does not support a transaction price
              or exact acquisition date.
