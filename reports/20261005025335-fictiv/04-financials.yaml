callouts:
  - calloutType: "insight"
    title: "Negative Working Capital Dynamic in Standard Operations"
    body: "Fictiv's standard commercial terms mandate upfront credit card payment prior to initiating part fabrication. This contract structure provides an advantageous negative working capital cycle on transactional orders, as cash is collected days or weeks before manufacturing partner accounts payable are settled."
    claimRefs:
      - "CI002"
  - calloutType: "risk"
    title: "Opacity of Unit Gross Margins Across Fabrication Processes"
    body: "Because Fictiv aggregates commoditized 3D printing and CNC machining alongside high-complexity injection molding and casting, blended gross margins may obscure severe margin compression in competitive prototype categories. Independent underwriting cannot verify process-level profitability without private management ledgers."
    claimRefs:
      - "CI006"
      - "CI010"
