chapter:
  number: 7
  title: "Risks"
  summary: "The highest residual risks are export-control execution, manufacturing-partner quality and delivery variance, and limited visibility into post-integration operating controls. Fictiv describes concrete mitigations, but public evidence does not quantify incident rates, supplier concentration, current liquidity, or control effectiveness."
sections:
  - id: "risk-ranking"
    title: "Risk ranking and investment implication"
    body: >-
      Fictiv's risk profile is shaped by coordinating sensitive technical data, custom
      production, and cross-border delivery through a distributed partner network. The
      most consequential exposure is not proof of a recorded enforcement action or
      systemic quality failure; the assigned evidence does not establish either. It is
      the combination of high-impact failure modes and missing frequency data. Fictiv
      says unsupported EAR classifications require off-platform review, while its terms
      prohibit customers from uploading controlled CCL or USML data and allocate
      substantial compliance responsibility to them [CR001, CR002, CR003]. Operationally,
      one independent review documents an order and shipping failure, while other reviews
      report on-time, in-spec delivery, so the available sample shows variance rather
      than a reliable defect or late-delivery rate [CR005, CR006]. The investment view
      should therefore remain conditional on private control-testing, supplier-quality,
      and post-integration KPI evidence rather than treating published policies as proof
      of effective execution [CR008, CR009, CR010, CR016].
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-legal"
    title: "Regulatory, legal, and data-handling exposure"
    body: >-
      Export controls are the clearest regulatory boundary in the public record. Fictiv
      states that its platform-supported EAR classifications are limited to EAR99 and
      9E991, with other EAR-controlled projects initiated off-platform before files are
      uploaded [CR001]. Its stated mitigation combines classification confirmation and
      automated detection of export-control language, while the terms place a separate
      obligation on customers not to upload CCL- or USML-controlled data [CR002, CR003].
      This layered design is directionally credible but remains company-issued evidence;
      no regulator audit, control-test result, exception volume, or incident history was
      available in the assigned pool. Contract terms also narrow remedies for high-risk
      products and disclaim uninterrupted or error-free service, increasing diligence
      importance for safety-critical or confidential programs [CR004, CR015]. These
      provisions describe allocation of risk, not the incidence of claims or failures,
      and absence of a cited incident cannot be read as evidence that none occurred.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operations-and-dependencies"
    title: "Operational, quality, and counterparty dependencies"
    body: >-
      Manufacturing-partner execution is a structural dependency. Fictiv's terms permit
      subcontracting, disclosure of specifications to manufacturing partners, and order
      cancellation when no partner is available; they also limit Fictiv's responsibility
      for partner acts outside specified return and warranty obligations [CR007, CR013].
      The current company-issued quality-engineer posting shows a mitigation system built
      around supplier audits, CAPA, 8D root-cause work, PPAP, FAI, and cross-region
      standardization, but it publishes no rejection, escape, rework, or on-time-in-full
      metrics [CR008]. The independent review sample is mixed: a specific April 2025
      complaint reports an order miss and shipment delay, while several other customers
      report timely and conforming parts [CR005, CR006]. LeadIQ describes four operating
      centers across the United States, Mexico, China, and India and a May 2026 MISUMI
      integration, adding geographic diversification but also cross-border and integration
      complexity [CR009]. Neither diversification nor process documentation establishes
      consistent supplier performance.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR013"
    tableRefs:
      - "TR002"
      - "TR003"
  - id: "financial-monitoring-and-kill-criteria"
    title: "Financial exposure, monitoring indicators, and thesis breaks"
    body: >-
      Public financial risk evidence is insufficient for a burn, runway, or liquidity
      conclusion. A 2021 company release says a $35 million Series D brought total
      investment to $92 million and was intended partly for supply-chain and network
      infrastructure; this is historical funding raised, not current cash available
      [CR011]. Current terms allow repricing negotiations after a material-cost increase
      of at least 3% and allocate tariffs and duties to the customer, but public evidence
      does not show pass-through acceptance, gross-margin sensitivity, working-capital
      needs, or bad-debt exposure [CR014]. The practical monitoring set is therefore
      exception-based: off-platform export classifications, controlled-data alerts,
      supplier nonconformance and CAPA aging, late-order incidence, RMA outcomes, partner
      concentration, and Fictiv-specific post-integration quality and margin KPIs [CR016].
      Thesis-break events should include a material export-control breach or enforcement
      action, persistent quality or delivery deterioration without corrective closure,
      loss of critical manufacturing capacity without rerouting, or liquidity evidence
      inconsistent with required service levels. These are diligence triggers, not claims
      that such events have occurred.
    claimRefs:
      - "CR011"
      - "CR014"
      - "CR016"
