callouts:
  - calloutType: "risk"
    title: "Do not infer a clean incident history"
    body: "The assigned pool contains policies, terms, a job posting, company announcements, market-data summaries, and customer reviews; it does not contain a regulator clearance, complete litigation search, security audit, or incident register. No recorded incident in this evidence set is not evidence of no incident."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR015"
  - calloutType: "recommendation"
    title: "Evidence required before risk can be underwritten"
    body: "Require export-control test results, supplier concentration and scorecards, on-time-in-full and RMA cohorts, security assurance, Fictiv-specific post-integration KPIs, and current liquidity and margin evidence. Deterioration without timely corrective closure should break the operating thesis."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR014"
      - "CR016"
