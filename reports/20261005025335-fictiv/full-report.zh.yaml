      - number: '4.3'
        title: 资本充足性、战略所有权与投资判断
        blocks:
          - type: paragraph
            body: >-
              收购前，Fictiv 共筹集 $192M 风险资本，并于 2022 年 5 月完成由 Activate Capital 领投、Honeywell、40 North Ventures 和 Accel 参与的
              $100M Series E。 随后，日本工业零部件分销商 MISUMI Group Inc. 以约 $350M 收购 Fictiv，彻底改变了其资本充足性：独立偿付能力风险和对风险融资的依赖，
              被一家致力于全球数字化制造扩张的企业提供的资产负债表支持所取代。然而，从独立财务评估角度看，Fictiv 仍受披露不透明影响。
              独立收入运行率、扣除报废和检验成本后的贡献毛利、供应链中断期间的营运资本占用，以及并购后整合协同，均未经核实。 虽然与 MISUMI
              的战略协同带来强大的商业分销杠杆，但在经审计的分部披露出现前，机构投资判断必须把已报告利润率和经常性收入质量视为未经验证的私有数据。
            claimRefs:
