      - number: '2.3'
        title: 买方分层、预算归属与企业采购动态
        blocks:
          - type: paragraph
            body: >-
              Fictiv 平台上的采购决策由两个组织中心主导：工程开发团队和企业采购组织。在早期产品开发阶段，机械设计工程师、研发项目经理和机器人系统架构师掌握部门原型预算。
              这些技术买家看重快速报价、实时可制造性设计（DFM）指导和压缩迭代周期，选择 Fictiv 是为了省去等待加工店报价的数周时间。
              当硬件项目进入桥接制造和持续替换件采购阶段，预算归属会转向正式的供应链高管、采购经理和采购专员。商业买家会从物料清单（BOM）总成本降低、 供应商整合、交付周期可靠性和地理贸易风险分散等维度评估
              Fictiv。按标准平台条款，付款通过企业信用卡或预授权账单账户预付； Fictiv 因而成为法律上的商户和记录卖方，而实际生产则外包给经过审查的制造合作伙伴网络。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用催化剂、监管约束与尽调不确定性
        blocks:
          - type: paragraph
            body: >-
              宏观供应链波动、关税敞口，以及医疗机器人、航空航天、清洁能源和消费设备等高复杂度行业压缩硬件开发周期的要求，正在推动平台采用。 HFS Research
              的行业分析称，企业平台协调器通过算法匹配合作伙伴、在美国、墨西哥、中国和印度之间进行多区域分配，最多可将上市时间改善 40%， 并将物料清单成本降低 15% 至
              25%。但显著摩擦点限制了企业钱包份额。Fictiv 标准服务条款明确要求买方接受被归类为高风险产品的零件——包括医疗器械、武器、汽车和飞机——
              且不享有标准的规格符合性有限保修；未经高管授权，也不得将其用于关键生命支持系统。此外，采购团队还要面对更换长期合作的本地机加工厂、处理敏感 CAD 几何数据的出口管制和知识产权保护，
              以及比较供应商加价与直接向工厂采购之间差异等切换障碍。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 硬件开发中的采购协调困境
            body: >-
              硬件工程速度的根本约束在于采购摩擦，而不是 CAD 设计速度。在传统流程中，机械工程师要花数天至数周，在分散的加工店之间管理报价交接， 使实体测试迭代之间出现大量停滞。Fictiv
              的核心市场价值主张，就是把自动报价和可制造性反馈与轻资产、质量受控的供应商网络结合起来，消除这项协调成本。
            calloutType: insight
            claimRefs:
              - CM001
              - CM009
              - CM013
          - type: callout
            title: 高风险工业应用中的法律保修边界
            body: >-
              Fictiv 积极瞄准医疗器械、机器人、汽车和航空航天等受监管的高毛利行业，但其服务条款包含严格的责任限制。
              购买被指定为高风险产品的客户，即使零件在重大程度上不符合规格，也必须依法接受并付款；未经高管授权，平台零件不得用于关键生命支持应用。 对评估关键任务组件部署的企业质量团队而言，这构成持续的尽调风险。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场分类、竞争者类型与运营模式
        blocks:
          - type: paragraph
            body: >-
              定制精密制造领域由不同的运营架构构成，并非同质化供应商池。Fictiv 把自己定位为受管理的制造合作伙伴网络，而非开放公共市场， 在包括美国、墨西哥、中国和印度在内的五个运营区域筛选约 250
              家制造伙伴。与之直接相对的是 Xometry：它运营 AI 驱动的全球市场， 汇集超过 5,000 家分布式加工店和供应商。Protolabs
              等内部数字化制造老牌企业拥有自己的生产设备和设施，追求快速原型周转和极高一致性，而不是供应商撮合。 与此同时，RapidDirect 和 Unionfab 等海外直销制造商依托自有工厂车队，提供低批量价格低
              20% 至 30% 的优势；欧洲的 MakerVerse 等区域平台， 以及 OpenSpindle 等礼宾式服务，则分别瞄准特定地理区域和初创公司物料清单需求。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
