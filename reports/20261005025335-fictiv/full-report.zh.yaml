              - CR013
              - CR014
      - number: '7.4'
        title: 财务敞口、监测指标与论点失效
        blocks:
          - type: paragraph
            body: >-
              公开财务风险证据不足以得出烧钱、现金跑道或流动性结论。公司 2021 年新闻稿称，$35M Series D 使累计投资达到 $92M， 资金部分用于供应链和网络基础设施；这是历史融资额，不是当前可用现金
              [CR011]。 当前条款允许在材料成本至少上涨 3% 后重新议价，并把关税和税费分配给客户，但公开证据没有显示转嫁是否被接受、毛利敏感度、营运资本需求或坏账敞口 [CR014]。
              因此，实际监测集合应以例外为中心：平台外出口分类、受控数据警报、供应商不合格项和 CAPA 积压、订单延迟发生率、RMA 结果、合作伙伴集中度， 以及 Fictiv 整合后的专属质量和利润率 KPI
              [CR016]。论点失效事件应包括重大出口管制违规或执法行动、质量或交付持续恶化且未及时纠正、 关键制造能力丧失且无法重新分配，或流动性证据与所需服务水平不一致。这些是尽调触发条件，并不是声称这些事件已经发生。
            claimRefs:
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要推断事件记录清白
            body: 指定证据池包含政策、条款、招聘信息、公司公告、市场数据摘要和客户评价，但不包含监管机构许可、完整诉讼检索、安全审计或事件登记册。 这组证据中没有记录事件，并不等于没有发生事件。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR015
          - type: callout
            title: 风险投资判断前必须取得的证据
            body: 应要求提供出口管制测试结果、供应商集中度和评分卡、准时足量交付及 RMA 群组、安全保障、Fictiv 整合后的专属 KPI，以及当前流动性和利润率证据。 如果恶化未能及时纠正，应视为运营论点失效。
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR009
              - CR014
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的核心投资论点来自云端协调的数字化制造平台：平台把定制机械零部件采购虚拟化，并连接分布式的经审查制造合作伙伴网络。Fictiv 靠自动化可制造性设计分析和快速报价，把 3D 打印、CNC
              加工、聚氨酯浇注和注塑整合起来，替代数周的分散线下采购， 在机器人、航空航天、清洁能源和医疗器械等行业生产了超过 3,500 万个原型及商业零件，达到相当的规模。 但反论点指出，Fictiv
              作为独立创业公司一直在结构上无利可图，面临激烈竞争、定制零件低毛利和沉重营运资本需求； 这些因素压低了独立发展的上行空间，也最终迫使其整体出售给工业买方。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: 融资历史与收购背景
        blocks:
          - type: paragraph
            body: >-
              Fictiv 由 Dave Evans 和 Nate Evans 于 2013 年创立，通过多轮股权融资逐步搭建资本基础：2018 年 5 月完成由 Sinovation Ventures 领投的 $15M
              Series B， 2021 年 2 月完成由 40 North Ventures 领投、Honeywell 参与的 $35M Series D，2022 年 5 月完成由 Activate Capital
              领投的 $100M Series E。 包括 Accel、Bill Gates、G2 Venture Partners 和 Standard Investments 在内的机构投资者累计投入私募资金 $192M。
              2025 年 4 月，Fictiv 签署协议，由日本工业零部件分销商 MISUMI Group Inc. 以 $350M 估值、全现金交易收购， 将 Fictiv 的 400
              名员工和分布在美国、中国、印度及墨西哥的生产运营并入 MISUMI 覆盖 318,000 家企业客户的全球物流网络。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 估值情景与运营边界
        blocks:
          - type: paragraph
            body: >-
              $350M 全现金收购基准对应预计 2.5x 至 3.5x 的收入后续倍数；鉴于定制硬件制造通常有 25% 至 35% 的毛利率， 这对按需制造平台而言属于合理退出倍数。虽然收购以全现金形式实现了超过 $192M
              总投入资本的完整回收， 但隐含的资本效率表明，后期风险投资参与者获得的投入资本倍数较为有限。此外，Fictiv 商业条款设置严格的客户责任、
              针对武器相关生产的运营限制、不可取消的定制采购订单，以及由客户承担出口管制赔偿的义务，凸显了 MISUMI 体系内平台使用所受的实质合规边界。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV010
              - CV011
      - number: '8.4'
        title: 建议立场与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们的正式建议立场是中等信心跟踪，估值判断锚定在 $350M 交易基准上。由于 Fictiv 已从独立创业资产转为 MISUMI Group Inc. 全资运营子公司， 除投资 MISUMI
              公开股票外，外部投资者已无法直接参与其股权。优先尽调应关注收购后的整合里程碑、在 MISUMI 318,000 家工业客户基础上的商业协同兑现、 400
              人技术团队的关键人员留任，以及各区域生产设施的单位毛利率变化。
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本回收与战略退出兑现
            body: >-
              MISUMI Group 以 $350M 全现金收购 Fictiv，为早期和后期投资者提供了清晰的流动性事件，回收资本超过 $192M 投入。
              但交易估值也说明，硬件市场平台软件在受到实体毛利率和营运资本强度约束时，往往会面临估值上限。
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV010
          - type: callout
            title: 运营与出口合规约束
            body: Fictiv 的运营条款明确排除武器制造，并将全部海关、关税和出口合规责任（ITAR/EAR）交由客户承担。这些严格的法律边界，加上不可取消的定制订单，说明平台要扩张，必须对跨境履约通道实施严格的运营监督。
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
