      - number: '4.2'
        title: 成本结构、单位经济性与运营效率
        blocks:
          - type: paragraph
            body: >-
              Fictiv 走的是轻资产协调器路线：销货成本（COGS）很高且多为可变成本，直接与合作加工店的制造、原材料、物流和质量保证挂钩。 与传统纵向一体化合同制造商不同，Fictiv
              不必承担运营自有加工店的资本密集度和折旧负担，而是用人工智能算法进行即时可制造性设计（DFM）分析和自动报价。 公开运营披露显示，2021 年核心收入增长超过 100%，员工数同时增加
              81%，也说明公司在全球供应链波动期间快速扩张。 第三方研究称，企业客户通过 Fictiv 在美国、中国、印度和墨西哥的分布式制造中心进行采购，可降低 15 至 25% 的物料清单（BOM）成本，并将上市时间缩短
              40%。 但更细的单位经济性——包括各制造工艺的毛利率、客户获取成本（CAC）、回收期和净收入留存率（NRR）——仍是未披露的私有指标，需要管理层直接说明。
