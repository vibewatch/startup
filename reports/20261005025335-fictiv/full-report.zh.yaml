  - id: FM001
    title: 市场规模层级：从宏观制造业产出到可捕获的定制支出
    type: pyramid
    summary: 金字塔图将宏观经济制造业总产出，与 Fictiv 目标市场中专业化、可数字化触达的定制机械零件细分领域进行对比。
    data:
      nodes:
        - id: macro-global-output
          label: 全球制造业产出（2024 年 $34.8T）
          name: Global Manufacturing Output ($34.8T in 2024)
          details: 覆盖工业、材料、消费、汽车和医疗等全部类别的全球制造业总产出。
        - id: global-value-added
          label: 全球增加值（2024 年 $8.6T）
          name: Global Value Added ($8.6T in 2024)
          details: 扣除中间投入成本后的全球制造业净产出，覆盖 552 万家企业。
        - id: us-manufacturing-gdp
          label: 美国制造业 GDP 贡献（2023 年 $2.8T）
          name: US Manufacturing GDP Contribution ($2.8T in 2023)
          details: 支撑美国工业生产和原型制造活动的年度国内制造业增加值。
        - id: medical-device-subsector
          label: 全球医疗器械产出（2024 年 $1.4T）
          name: Global Medical Devices Output ($1.4T in 2024)
          details: 高价值精密制造细分领域，定制手术机器人和医疗器械占 Fictiv 业务量的 25%+。
        - id: serviceable-digital-orchestration
          label: 可服务的数字制造与原型制造（数百亿美元）
          name: Serviceable Digital Manufacturing & Prototyping (Tens of Billions USD)
          details: 可由数字化按需编排平台触达的外包定制机械零件支出。
        - id: fictiv-capturable-footprint
          label: Fictiv 平台交易规模（$350M 收购基准；已交付 19M+ 个零件）
          name: Fictiv Platform Volume Scale ($350M acquisition base; 19M+ parts delivered)
          details: 已交付累计 35M+ 个零件、服务 3,000+ 家客户公司，且有 $350M 收购估值支撑的可捕获交易量。
