  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务支出范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              全球制造业经济对应数十万亿美元的总产值和增加值，但 Fictiv 的可服务边界局限于定制机械零部件采购、原型制作和低至中等批量的按需生产。
              在工业和医疗制造总产出中，工程团队通常会把标准目录硬件与定制加工零件分开。Fictiv 瞄准后者，具体包括 CNC 加工、工业 3D 打印（增材制造）、
              注塑、聚氨酯浇注、钣金加工和压铸。可服务支出既包括快速新产品开发（NPI）原型，也包括桥接量产订单；在这些场景中，速度、多工艺灵活性和跨境物流韧性， 比自有大规模工厂的规模化单位成本折扣更重要。相反，Fictiv
              的商业条款和业务模式明确排除大批量通用零件、自有内部装配线、原材料商品供应，
              以及不承诺定制保修赔偿的生命支持或关键军事组件。现状替代方案包括分散的本地加工店、需要长时间人工报价的传统合同制造商（CM）、内部模型车间和企业原型实验室， 以及其他数字化经纪平台。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角：宏观产出、数字化协调与可捕获定制支出
        blocks:
          - type: paragraph
            body: >-
              评估 Fictiv 的可服务市场，必须把全球制造业总产出与可由数字化触达的定制机械零部件细分市场区分开。行业出版物汇总的宏观统计基准显示， 2024 年全球制造业市场产出为 $34.8T，预计 2029 年达到
              $36.7T，其中医疗器械和产品约占 $1.4T。但引用数万亿美元级的广义制造业产出会夸大可服务需求，
              因为其中绝大多数来自内部劳动力、原材料开采、连续化学加工和专用大批量装配线。可服务市场明显收窄至定制原型及按需零件采购， 横跨北美、欧洲和亚洲，估计规模为数百亿美元。Fictiv
              的可获取服务市场，是企业硬件团队愿意通过轻资产云平台协调器分配的外包机械支出部分。 Fictiv 在美国、中国、印度和墨西哥维持卓越中心，使其网络能够承接跨境、多区域采购需求；公司历史累计生产超过 1,900
              万个零件，并与超过 3,000 家产品公司建立商业关系。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
