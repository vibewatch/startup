  - id: FI001
    title: Fictiv 客户订单到现金与毛利流程架构
    type: flow
    summary: 展示客户采购需求依次转化为现金回收、自动供应商路由和净毛利实现的过程。
    data:
      nodes:
        - id: rfq-input
          label: 客户 CAD 与 RFQ
          note: 客户将 3D CAD 模型和规格上传至云端门户
        - id: instant-quote
          label: AI 定价与 DFM 引擎
          note: 自动分析可制造性并生成动态报价
        - id: cash-collection
          label: 预收现金
          note: 全额信用卡预付款或经批准的 PO 定金
        - id: supplier-routing
          label: 全球合作伙伴路由
          note: 生产分配至经筛选的供应商中心（美国、墨西哥、中国、印度）
        - id: qa-logistics
          label: 质量检验与 DDP 运输
          note: 现场 QA 核验并管理海关税费
        - id: gross-spread
          label: 净利润实现
          note: Fictiv 在支付供应商款项并扣除运输成本后取得毛利差额
      edges:
        - from: rfq-input
          to: instant-quote
        - from: instant-quote
          to: cash-collection
        - from: cash-collection
          to: supplier-routing
        - from: supplier-routing
          to: qa-logistics
        - from: qa-logistics
          to: gross-spread
    approximationNotes: 流程依据已公开条款展示标准订单机制；定制企业客户的合同条款可能有所不同。
