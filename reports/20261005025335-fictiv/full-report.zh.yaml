      - number: '3.3'
        title: 差异化持久性、区域供应链缺口与切换动态
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的竞争壁垒来自新产品导入（NPI）期间形成的客户黏性：早期可制造性设计（DFM）协作、工装验证和质量检验机制，会把平台嵌入企业生产项目。
              但切换成本并不对称：在平台之间转移五个快速原型零件几乎没有摩擦，而迁移持续运行的多零件物料清单，则需要重新验证、转移工装并承担检验验证风险。 Fictiv
              的一项重要竞争短板是缺少专门的欧洲制造网络；欧洲客户的货物在国际制造后通过完税交货（DDP）物流进口，因此相较 MakerVerse 等本地供应商面临交付周期、汇率和增值税劣势。 Fictiv 于 2025 年
              6 月被 MISUMI Group 收购后，将定制按需零件与 MISUMI 可配置标准机械零部件目录对接，以应对商品化。
