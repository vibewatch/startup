        - 跨经纪商多源采购的企业客户转换成本低
        - 丢失一级企业客户，或毛利率压缩至 20% 以下
      - - 规模经济
        - 借助自动化 DFM 引擎，已向 3,000 多家公司交付 35M+ 个零件
        - 全球合作工厂的履约间接成本和质量检验成本高
        - 废品率持续上升，或交付争议索赔主张超过合同阈值
      - - 战略协同
        - 直接接入 MISUMI 的实体基础设施和 318,000 家企业客户
        - 整合摩擦、公司间接费用分摊及潜在供应商流失
        - 核心工程管理层流失，或交叉销售的数字订单停滞
    notes: 评估支撑 Fictiv 在 MISUMI 体系内商业模式的战略驱动因素与风险。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
