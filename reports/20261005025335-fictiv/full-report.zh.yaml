  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              Fictiv 的风险画像由几项因素共同塑造：通过分散的合作伙伴网络协调敏感技术数据、定制生产和跨境交付。最重要的敞口并不是已有执法行动或系统性质量失败的证据，
              指定证据并未证明任一情况，而是高影响失败模式与发生频率数据缺失的组合。Fictiv 表示，不受支持的 EAR 分类必须转到平台外审查； 其条款禁止客户上传受控 CCL 或 USML
              数据，并把大量合规责任分配给客户 [CR001, CR002, CR003]。运营上，一份独立评价记录了一次订单和运输失败，
              另一些评价则称交付准时且符合规格，因此现有样本显示的是波动，而不是可靠的缺陷率或延迟交付率 [CR005, CR006]。 因此，投资判断应以私下控制测试、供应商质量和整合后 KPI
              证据为条件，不能把已发布政策当成有效执行的证明 [CR008, CR009, CR010, CR016]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR009
              - CR010
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: 监管、法律与数据处理敞口
        blocks:
          - type: paragraph
            body: >-
              出口管制是公开记录中最清晰的监管边界。Fictiv 表示，平台支持的 EAR 分类仅限 EAR99 和 9E991，其他受 EAR 控制的项目必须在上传文件前转到平台外启动 [CR001]。
              其缓解措施结合分类确认与出口管制语言自动检测；条款则另行要求客户不得上传受 CCL 或 USML 控制的数据 [CR002, CR003]。
              这套分层设计在方向上可信，但仍是公司出具的证据；指定证据池中没有监管机构审计、控制测试结果、例外数量或事件历史。 合同条款还收窄高风险产品的救济，并免责于不间断或无错误服务，使安全关键或机密项目更需要尽调
              [CR004, CR015]。 这些条款说明的是风险分配，不是索赔主张或失败发生率；没有引用事件不能解读为从未发生事件。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR015
      - number: '7.3'
        title: 运营、质量与交易对手依赖
        blocks:
          - type: paragraph
            body: >-
              制造合作伙伴的执行能力是一项结构性依赖。Fictiv 条款允许分包、向制造伙伴披露规格，并在没有可用合作伙伴时取消订单； 在约定的退货和保修义务之外，也限制 Fictiv 对合作伙伴行为的责任 [CR007,
              CR013]。 当前公司发布的质量工程师岗位显示了一套围绕供应商审计、CAPA、8D 根因分析、PPAP、FAI 和跨区域标准化建立的缓解体系， 但没有发布拒收、漏检、返工或准时足量交付指标
              [CR008]。独立评价样本并不一致：一份具体的 2025 年 4 月投诉称订单未交付并延迟发货， 另有几位客户称零件及时且符合规格 [CR005, CR006]。LeadIQ
              描述了美国、墨西哥、中国和印度的四个运营中心，以及 2026 年 5 月与 MISUMI 的整合， 这增加了地域分散，也增加了跨境和整合复杂度 [CR009]。地域分散和流程文件都不能证明供应商表现稳定。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR008
              - CR015
          - type: table
            tableRef: TR003
