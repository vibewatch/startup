      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 报价分叉：算法覆盖面与受管理审核
            body: >-
              数字化制造的核心架构张力，在于算法报价自动化与受管理工程审核之间的取舍。Xometry 和 MakerVerse 等平台依靠机器学习及图纸 OCR 优先提供即时有约束力的报价，
              最大化漏斗吞吐量。相比之下，Fictiv 会把含关键 GD&T 的复杂 2D 图纸有意转入为期数日的人工工程审核，以牺牲即时转化速度为代价，换取更高制造良率和企业 NPI 项目的稳定质量执行。
