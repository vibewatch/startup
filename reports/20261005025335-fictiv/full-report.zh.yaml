              detail: 制造选项
            - label: 公差和图纸标注
              detail: 生产要求
        - label: 3. 报价与 DFM
          detail: 平台软件返回价格和交付预估，并给出自动化可制造性警告。
          items:
            - label: 自动报价
              detail: 价格和交付预估
            - label: 自动 DFM 反馈
              detail: 可制造性警告
        - label: 4. 数字编排
          detail: 订单、计费、物流和合作伙伴匹配系统协调交易与产能路由。
          items:
            - label: 订单、计费和物流系统
              detail: 交易控制
            - label: 合作伙伴匹配
              detail: 产能路由
        - label: 5. 合作伙伴制造
          detail: 外部制造合作伙伴在 Fictiv 的项目和质量监督下完成实体生产。
          items:
