  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现机制与定价结构
        blocks:
          - type: paragraph
            body: >-
              Fictiv 主要通过数字化定制机械零部件订单赚取收入，作为记录上的合同制造商，同时把实际生产外包给经过审查的全球供应商网络。
              公司主要靠交易毛利变现——即客户报价与合作伙伴生产及物流成本之间的价差——并辅以专用工装和企业采购条款。 公司法律披露和平台条款显示，标准定制订单须在工单执行前通过信用卡或借记卡预付；符合条件的企业账户则可在
              50% 工装订金和里程碑计费下使用采购订单开票。 按 Fictiv 标准条款，订单一旦接受，客户不得取消；除非选择带预先计算费用的完税交货（DDP）运输，报价还会明确把关税、海关税费和内陆运费风险转给客户。
              如果报价与制造之间材料成本波动达到 3% 或以上，Fictiv 还可单方面取消订单或要求重新谈判，从而把平台贡献毛利与原材料通胀隔离。
