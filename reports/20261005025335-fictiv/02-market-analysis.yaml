callouts:
  - calloutType: "insight"
    title: "The Sourcing Coordination Dilemma in Hardware Development"
    body: "Hardware engineering velocity is fundamentally constrained by procurement friction rather than CAD design speed. In traditional workflows, mechanical engineers spend days to weeks managing quoting handoffs across fragmented machine shops, introducing substantial downtime between physical test iterations. Fictiv's core market value proposition centers on eliminating this coordination tax by combining automated quoting and manufacturability feedback with an asset-light, quality-managed supplier network."
    claimRefs:
      - "CM001"
      - "CM009"
      - "CM013"
  - calloutType: "risk"
    title: "Legal Warranty Boundaries in High-Risk Industrial Applications"
    body: "While Fictiv actively targets regulated high-margin sectors such as medical devices, robotics, automotive, and aerospace, its commercial terms of service incorporate strict liability limitations. Customers purchasing components designated as High Risk Products are legally required to accept and pay for parts even if they fail to conform materially to specifications, and platform components are prohibited from critical life-support applications without executive authorization. This presents an ongoing diligence risk for enterprise quality teams evaluating mission-critical component deployments."
    claimRefs:
      - "CM015"
      - "CM016"
