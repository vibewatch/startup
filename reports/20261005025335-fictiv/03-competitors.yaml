callouts:
  - calloutType: "insight"
    title: "The Quoting Bifurcation: Algorithmic Breadth vs Managed Review"
    body: "The core architectural tension in digital manufacturing is between algorithmic quote automation and managed engineering review. Platforms like Xometry and MakerVerse prioritize instant binding quotes via machine learning and drawing OCR, maximizing funnel throughput. In contrast, Fictiv intentionally routes complex 2D drawings with critical GD&T into a multi-day human engineering review, sacrificing instant conversion speed to secure higher manufacturing yield and reliable quality execution on enterprise NPI programs."
    claimRefs:
      - "CP001"
      - "CP007"
      - "CP008"
  - calloutType: "risk"
    title: "Regional Sourcing Vulnerability in European Markets"
    body: "Fictiv operates without a dedicated European manufacturing partner footprint, forcing EMEA customers to source precision components from facilities in the US, Mexico, China, or India. Despite offering Delivered Duty Paid (DDP) logistics, this structural gap creates significant competitive exposure against native European platforms like MakerVerse, which offer zero-tariff intra-EU shipping, EUR billing, and strict GDPR data governance."
    claimRefs:
      - "CP008"
      - "CP014"
      - "CP015"
