chapter:
  number: 6
  title: "Customers"
  summary: "Fictiv reports broad adoption across 6,000+ companies and 42M+ manufactured parts, but those cumulative company-issued metrics do not establish active usage or retention. Public customer proof in the retained evidence is limited to a Honeywell enterprise reference and a Heliospace testimonial, while current hiring signals point to an intended expansion path from product development through mass production."
sections:
  - id: "customer-segments-and-buyers"
    title: "Customer Segments and Buying Roles"
    body: >-
      Fictiv positions the service for hardware teams moving from a CAD file and prototype through production, with engineers using instant quoting, design-for-manufacturability feedback, order tracking, and a managed manufacturing network. The addressable user set spans early-stage companies and large enterprises, while the commercial roles called out in the evidence include supply-chain managers, procurement teams, engineers, and program leaders. The company names robotics, aerospace, medtech, automotive, EV and eVTOL among served verticals, but it does not disclose account, order, or revenue mix by vertical or customer size. A Fictiv-authored 2024 manufacturing report also describes resilience, agility, speed, efficiency, revenue, and cost pressure among manufacturing and supply-chain teams; that industry context helps explain buyer demand but is not evidence of Fictiv customer conversion.
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU008"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "adoption-and-proof"
    title: "Adoption Scale and Customer Proof"
    body: >-
      The strongest scale evidence is company-issued and cumulative. Fictiv's current homepage reports more than 42 million parts manufactured through its network and more than 6,000 companies served; a February 2021 company release reported more than 12 million parts over the preceding six years. These vintages indicate a larger disclosed production footprint, but definitions may have changed and the figures provide neither annual order volume nor active-account denominators, so they cannot support a growth rate, retention estimate, or cohort conclusion. Named proof is much thinner: the 2021 release cites traction with enterprise companies such as Honeywell, while the homepage carries a Heliospace engineer's three-day turnaround testimonial. Neither source discloses contract value, recurring order volume, deployment duration, or a controlled outcome baseline.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "expansion-and-durability"
    title: "Expansion Signals and Durability"
    body: >-
      Current hiring language provides a directional, not realized, view of expansion. A MISUMI Americas strategic-program role describes serving enterprises and startups from new product development and introduction through mass production, with cross-functional sales, engineering, fulfillment, and customer-advocacy responsibilities. A separate business-systems role covers PLM, ERP, TMS, and MRP systems and explicitly balances customer satisfaction, growth, reliable delivery, and efficiency. Together these company-issued job descriptions suggest an effort to embed Fictiv more deeply in customer workflows after the MISUMI combination, but they do not prove renewal, wallet-share expansion, or successful production conversion. No NRR, GRR, churn, contract-length, cohort, satisfaction, or repeat-order metric appears in the retained evidence, leaving durability and concentration as material private-data diligence items.
    claimRefs:
      - "CU011"
      - "CU012"
    figureRefs:
      - "FU001"
  - id: "commercial-friction-and-evidence-quality"
    title: "Commercial Friction and Evidence Quality"
    body: >-
      Fictiv's May 2026 standard terms create procurement friction that may matter more as customers move into regulated or production use. Orders cannot be cancelled after placement and accepted quotes are not refunded; defect claims require an RMA and return within 72 hours of delivery. Products designated as high risk, including specified medical-device, automotive, aircraft, aeronautics, and weaponry applications, do not receive the standard limited warranty, and customers must accept and pay even when those products do not materially conform to specifications. These are standard-form terms rather than negotiated enterprise agreements, but they show why production durability cannot be inferred from aggregate part counts. The current newsroom snapshot emphasizes platform, investment, award, and partnership headlines without customer-level deployment outcomes, while the remaining evidence is overwhelmingly company- or investor-issued rather than independent customer validation.
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
