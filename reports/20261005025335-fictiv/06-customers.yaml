callouts:
  - calloutType: "risk"
    title: "Adoption breadth is not durability"
    body: "The 6,000+ companies-served and 42M+ parts figures are cumulative company claims. Without active-account, repeat-order, cohort-retention, contract-length, or concentration data, they cannot establish recurring customer demand."
    claimRefs:
      - "CU002"
      - "CU003"
  - calloutType: "recommendation"
    title: "Prioritize customer-level data"
    body: "Request active-customer cohorts, repeat-order frequency, NRR and GRR, top-customer revenue concentration, segment gross profit, production conversion, and reference calls that distinguish pilots from recurring production."
    claimRefs:
      - "CU005"
      - "CU007"
      - "CU013"
