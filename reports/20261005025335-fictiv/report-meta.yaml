companyProfile:
  summary: >-
    Fictiv is a digital manufacturing and supply-chain orchestration platform that coordinates on-demand custom-part
    production through a managed global partner network. The company was founded in 2013 by Dave and Nate Evans and
    later reached a definitive $350 million acquisition by MISUMI Group, but current standalone financials, governance,
    and post-integration operating metrics remain only partially disclosed.
