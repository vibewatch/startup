evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-and-scale-metrics
    missingEvidence: >-
      Current standalone revenue, ARR, gross margin, repeat-order or retention metrics, cash balance, audited
      active-customer count, verified global headcount, and post-integration valuation.
    whyItMatters: >-
      Cumulative parts and companies-served claims cannot establish the current revenue base, unit economics, liquidity,
      workforce scale, customer quality, or valuation.
    diligencePath: >-
      Request MISUMI segment reporting, Fictiv management accounts, bank statements, current payroll records, customer
      cohort exports, and the acquisition valuation bridge under confidentiality.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-control
    missingEvidence: >-
      Current board roster, shareholder and voting rights, founder incentives, executive succession plan, and Fictiv
      autonomy boundaries within MISUMI.
    whyItMatters: >-
      The public executive roster does not establish who controls budgets, product priorities, executive appointments,
      or integration decisions.
    diligencePath: >-
      Obtain the acquisition agreement, current organizational chart, board minutes, delegation-of-authority matrix,
      management retention plan, and founder employment agreements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters-and-capital-labels
    missingEvidence: >-
      A current corporate record reconciling San Francisco headquarters with the Oakland principal place of business,
      plus a financing schedule reconciling $192M total funding with $200M total investment.
    whyItMatters: >-
      Unreconciled location labels impair entity mapping, while non-equivalent capital labels can lead readers to
      overstate funding raised or cash available.
    diligencePath: >-
      Review current Delaware and California registrations, MISUMI organizational records, and the fully diluted
      financing ledger with security type and transaction date.
    relatedQuestionRefs:
      - QO001
      - QO003
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: post-acquisition-financials
    missingEvidence: Disclosed revenue run-rate, net retention rates, and gross margin profiles under MISUMI Group ownership.
    whyItMatters: Prevents independent quantitative verification of post-acquisition commercial growth and margin expansion.
    diligencePath: >-
      Review future MISUMI Group subsidiary segment disclosures, investor relations releases, or audited subsidiary
      filings.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: enterprise-retention
    missingEvidence: >-
      Audited post-acquisition customer retention rates, net revenue retention (NRR), and repeat order percentages
      across multi-part enterprise bills of materials.
    whyItMatters: >-
      Validating whether Fictiv's managed service model successfully locks in enterprise accounts against lower-cost
      automated marketplace competitors like Xometry.
    diligencePath: >-
      Request customer cohort retention and gross margin breakdowns by customer account tier from MISUMI segment
      management.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: gross-margin-breakdown
    missingEvidence: >-
      Audited gross margin and contribution margin percentages segmented by manufacturing process (CNC, 3D printing,
      injection molding, urethane casting).
    whyItMatters: >-
      Gross margin reflects pricing power and the efficiency of AI quotation algorithms versus partner manufacturing
      costs.
    diligencePath: Obtain private management accounts or segmental disclosures under MISUMI reporting.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-nrr
    missingEvidence: >-
      Historical Net Revenue Retention (NRR) and customer cohort repurchase rates across prototyping versus production
      tiers.
    whyItMatters: Determines whether platform usage is transactional project-based work or sticky recurring supply chain spend.
    diligencePath: Request customer cohort retention and gross dollar retention (GDR) schedules from management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: deployment-reliability-roadmap
    missingEvidence: >-
      Current API and integration documentation, status and incident history, support SLAs, release notes, and a dated
      post-acquisition product roadmap.
    whyItMatters: >-
      Without operational telemetry and versioned documentation, feature availability does not establish production
      reliability, integration cost, or roadmap execution.
    diligencePath: >-
      Request the API catalog, integration list, 24-month incident log, uptime and support-SLA reports, release history,
      and approved 12- to 24-month roadmap.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: quality-certifications
    missingEvidence: >-
      Process-, region-, and partner-level certification scope plus independent defect, rework, on-time-delivery, and
      inspection-coverage data.
    whyItMatters: >-
      Platform-level quality claims cannot establish uniform execution across subcontracted factories or regulated use
      cases.
    diligencePath: >-
      Sample partner audit files, certificates with scope and expiry, inspection records, corrective actions, and cohort
      KPIs by process and geography.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: security-developer-signal
    missingEvidence: >-
      Public security architecture, audit reports, data-residency controls, developer documentation, repository or
      package activity, and practitioner-community evidence.
    whyItMatters: >-
      The assigned pool contains no reliable developer surface or independent proof of software maturity, security
      controls, or integration adoption.
    diligencePath: >-
      Review SOC reports and penetration-test summaries, map data subprocessors and residency, and obtain API usage,
      release, support-ticket, and integration-adoption metrics.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: stale
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      Current independent testing of quote accuracy, DFM coverage, delivery reliability, inspection completeness, and
      supplier transparency.
    whyItMatters: >-
