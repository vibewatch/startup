company:
  name: "Fictiv"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Fictiv is a founder-led digital manufacturing platform that coordinates on-demand custom-parts production through a managed global partner network. Public evidence supports a 2013 founding, $192 million of funding by May 2022, later integration with MISUMI, and expanding reported production scale, but current standalone financials, governance, valuation, and verified headcount remain unavailable."
sections:
  - id: "identity-and-operating-model"
    title: "Identity, Operating Model, and Geographic Footprint"
    body: >-
      Fictiv was founded in 2013 by brothers Dave and Nate Evans. Its operating model combines
      digital quoting, design-for-manufacturability feedback, order tracking, and sourcing with
      a managed network of manufacturing partners rather than presenting a single-factory model.
      The current company page names Centers of Excellence and in-region teams in the United
      States, Mexico, India, and China, while a live company-authored Mexico quality-engineering
      posting describes coordination with counterparts in China, India, and the United States.
      The precise headquarters label needs reconciliation: Tracxn describes San Francisco as the
      headquarters, whereas Fictiv's May 2026 terms name Oakland as its principal place of
      business. The latter is a legal-address statement, not proof that every operating function
      moved from San Francisco.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "scale-and-capital"
    title: "Reported Scale, Financing, and Ownership Stage"
    body: >-
      Company disclosures show a larger cumulative operating footprint over time: the May 2022
      Series E release cited more than 19 million parts and more than 3,000 product companies,
      while the current about page displays more than 42 million parts and more than 5,000
      companies served. These are cumulative company claims, not audited revenue or recurring
      customer metrics. Financing evidence is clearer historically: Fictiv announced a $35
      million round in February 2021 and a $100 million Series E in May 2022; the latter brought
      disclosed total funding to $192 million. The current company page instead shows "$200M
      total investment," a differently named and later figure that should not be treated as
      revenue, cash available, or a precise funding total without reconciliation. Third-party
      profiles classify Fictiv as acquired and report integration with MISUMI in May 2026, but
      the assigned evidence does not support a transaction price or exact acquisition date.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership Coverage and Governance Gaps"
    body: >-
      Fictiv's current leadership page retains both founders in senior roles, with Dave Evans as
      chief executive and Nathan Evans as chief experience officer. It also lists functional
      executives in finance, revenue, information systems, and marketing, plus general managers
      for the United States, Mexico, China, and India. That roster provides broad operating
      coverage across commercial, financial, technology, and regional manufacturing functions.
      Founder continuity remains strategically important because the Evans brothers still own
      the company vision and customer-experience remit, but the public pages do not disclose
      board membership, decision rights, management incentives, or autonomy boundaries after
      MISUMI integration. A current Mexico quality-engineering vacancy is evidence of operating
      activity and a growing quality team, not an independent headcount benchmark.
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "milestones-and-risk-boundaries"
    title: "Milestones and Commercial Risk Boundaries"
    body: >-
      The available chronology shows a progression from founder-led platform formation through
      product transparency features, late-stage financing, rising cumulative production claims,
      and integration into the MISUMI ecosystem. Fictiv's 2026 newsroom now foregrounds MISUMI
      Americas initiatives, including a separately described $50 million venture fund; that
      parent-affiliate initiative is not funding raised by Fictiv. Commercial terms also place
      material risk at the customer boundary: title and risk of loss pass before goods arrive at
      the first United States port of entry, regardless of the Incoterm used. Because this is a
      company-issued contract rather than an independent complaint, it establishes the written
      allocation of risk but does not show how often disputes, defects, or shipment losses occur.
      No independent adverse incident record was available in the assigned successful pool.
    claimRefs:
      - "CO008"
      - "CO012"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
