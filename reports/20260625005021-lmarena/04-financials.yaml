  - id: section-cost
    title: Cost structure, unit economics, and capital adequacy
    body: >-
      LMArena's cost structure has three primary categories inferred from public evidence. First, compute
      and infrastructure: serving 60 million conversations per month across frontier models requires
      substantial cloud compute. While the public leaderboard uses model APIs from partner labs (which may
      be provided at reduced or no cost under partnership agreements), the enterprise evaluation product
      likely incurs real inference costs at scale. Second, engineering and research headcount: the company
      had 41 employees as of the January 2026 Series A announcement. At typical Silicon Valley all-in
      compensation for a technical startup, this implies annual headcount costs of roughly $15–25 million.
      Third, community management, data annotation quality assurance, and go-to-market costs that are
      impossible to size from public information. Gross margins are not disclosed; a software-like model
      with low marginal cost per evaluation could achieve 60–80% gross margins, but high compute costs
      per conversation could compress this to 40–60%. No third-party estimate with strong foundation exists.


      Capital adequacy appears strong in the near term. The company has raised $250 million total across
      its May 2025 seed round ($100 million at $600 million valuation) and January 2026 Series A ($150
      million at $1.7 billion valuation). With a lean team of 41 employees and first commercial revenue
      only established in September 2025, the cash burn is likely well below $30 million annually as of
      early 2026. Rough estimates suggest a runway of at least 18–36 months without further fundraising,
      but no official burn rate or cash position has been disclosed. LMArena stated it will use the
      Series A funds to expand its technical team, strengthen research capabilities, and build new platform
      features — all of which will increase future burn. The Recall Capital-LMArena feeder fund (SEC Form D,
      filed February 2026) confirms the capital-formation activity but does not disclose LMArena's own
      balance sheet. No debt or project-finance obligations have been reported publicly.
    claimRefs:
