  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: realized revenue and NRR
      missingEvidence: >-
        LMArena has not disclosed realized full-year 2025 revenue, contracted ARR, net revenue
        retention, or churn data; the only available metric is the December 2025 annualized
        consumption run rate.
      whyItMatters: >-
        Without NRR and churn data, the $30 M run rate cannot be underwritten as a durable revenue
        base; a one-time evaluation cadence could annualize at $30 M but never recur at the same
        pace. This distinction materially affects the 57x valuation judgment.
      diligencePath: >-
        Request monthly revenue actuals from September–December 2025, FY2026 Q1 actuals, cohort-level
        NRR by client segment, and definition of a "churned" client in the consumption model.
      relatedQuestionRefs:
        - QI003
        - QI016
        - QI022
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: gross margin and cost structure
      missingEvidence: >-
        Gross margin, compute infrastructure costs, and engineering compensation are not publicly
        disclosed; estimates require strong assumptions about partner API subsidy arrangements.
      whyItMatters: >-
        Gross margin is the primary lever for whether LMArena's unit economics are venture-scale or
        service-company scale. A 40% margin at $30 M run rate implies $12 M gross profit; a 70%
        margin implies $21 M — a material difference for underwriting.
      diligencePath: >-
        Request management P&L with gross profit line; confirm whether model partner API costs are
        subsidized under revenue-sharing or partnership agreements, and what the infrastructure cost
        per evaluation is.
      relatedQuestionRefs:
        - QI016
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: material
      topic: customer concentration and revenue breakdown
      missingEvidence: >-
        The revenue share attributable to the three confirmed AI lab clients (OpenAI, Google, xAI)
        versus other enterprise clients is unknown; no third-party has independently verified the
        ~100 client count.
      whyItMatters: >-
        If three clients represent 50%+ of revenue, any single defection is a material financial event.
        The conflict-of-interest risk is amplified if the same three labs constitute both the concentration
        risk and the methodological independence threat.
      diligencePath: >-
        Request revenue breakdown by customer tier (AI lab vs enterprise); confirm whether any single
        client exceeds 20% of revenue; verify the ~100 client figure with management.
      relatedQuestionRefs:
        - QI020
        - QI023
      relatedTableRefs:
        - TI005
    - type: conflicting-data
      severity: material
      topic: headcount as of June 2026
      missingEvidence: >-
        Company had 41 employees at January 2026 Series A; LMArena stated it would expand its
        technical team with Series A proceeds. Current headcount as of June 2026 is unknown, meaning
        the burn rate estimate may already be materially outdated.
      whyItMatters: >-
        Burn rate and runway estimates depend heavily on headcount; a ramp to 100+ employees would
        approximately double the estimated monthly burn and cut the runway projection significantly.
      diligencePath: >-
        Request current headcount as of most recent quarter, monthly payroll run rate, and any hiring
        plan with timeline to inform forward burn model.
      relatedQuestionRefs:
        - QI023
        - QI025
      relatedTableRefs:
        - TI003
        - TI004
