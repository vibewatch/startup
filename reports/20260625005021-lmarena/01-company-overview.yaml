callouts:
  - calloutType: strength
    title: Fastest-Ramping AI Evaluation Unicorn
    body: >
      LMArena went from a UC Berkeley research project to a $1.7 billion valuation within approximately
      three years, and reached $30 million annualized revenue within four months of commercial launch.
      The combination of a trusted free leaderboard driving massive user acquisition, institutional investor
      backing, and named enterprise customers (OpenAI, Google, xAI) demonstrates exceptional product-market
      fit in the AI evaluation category.
    claimRefs: [CO011, CO015, CO034, CO025]

  - calloutType: risk
    title: Benchmark Integrity Risk — The Leaderboard Illusion
    body: >
      A peer-reviewed paper from Cohere, Stanford, MIT, and Ai2 documented evidence that LMArena allowed
      major AI labs to privately test multiple model variants and selectively disclose only high-performing
      scores, with Meta testing at least 27 Llama 4 variants before release. LMArena disputed the findings
      but the paper's asymmetric data access claims (Google and OpenAI each receiving ~19–20% of all battle
      data vs. 29.7% for 83 combined open-weight models) represent a structural credibility risk. If further
      evidence of preferential access emerges, it could erode the platform's authority with independent labs
      and enterprise customers.
    claimRefs: [CO027, CO028, CO029, CO030, CO041]

  - calloutType: risk
    title: Key-Person Dependence on Founding Team
    body: >
      Angelopoulos functions as scientific authority, primary spokesperson, and CEO. No non-founder
      executive team has been publicly disclosed. The company's reputational moat rests heavily on
      academic founder credentials. An abrupt departure by Angelopoulos or Chiang would create both
      operational risk and a potential credibility vacuum that could benefit emerging competitors
      such as Scale AI's SEAL Showdown.
    claimRefs: [CO003, CO006, CO033, CO039]

