company:
  name: LMArena
chapter:
  number: 1
  title: Company Overview
  summary: >
    LMArena (now branded "Arena"), founded in 2023 as a UC Berkeley research project, is the world's most-used
    crowdsourced AI model evaluation platform. It raised $250 million across seed and Series A rounds by January
    2026, reaching a $1.7 billion post-money valuation within seven months of launching its commercial AI Evaluations
    product, which hit an annualized run rate of $30 million by December 2025. Unresolved credibility challenges from
    a 2025 paper alleging preferential access for select AI labs represent a persistent risk that the company has
    publicly disputed but not fully resolved.

sections:
  - id: identity-and-product
    title: Identity and Product
    body: >
      LMArena, now operating under the brand "Arena," is an AI model evaluation platform that enables users
      to compare frontier AI models through anonymous head-to-head battles. A user submits a prompt to two
      unlabeled models simultaneously, votes on the better response, and only then sees which models were judged.
      Aggregated votes power a public leaderboard using a Bradley-Terry / Elo-based ranking algorithm, generating
      continuous, real-world performance comparisons across large language models and multimodal AI systems.
      The corporate entity, Arena Intelligence Inc., was incorporated on April 18, 2025, transitioning the
      Chatbot Arena research project into a commercial enterprise. Headquarters is in the San Francisco Bay Area
      (specific address undisclosed), consistent with UC Berkeley origins. Primary websites operate at arena.ai
      and lmarena.ai.
      LMArena's commercial product, AI Evaluations, launched in September 2025, providing enterprises, model labs,
      and developers with community-grounded performance analytics, representative feedback samples, and service-level
      agreements. Named commercial customers include OpenAI, Google, and xAI. The business model is
      evaluation-as-a-service: clients pay for systematic assessments of model performance across domains such
      as software engineering, law, and medicine.
      The platform has expanded well beyond text-only LLM comparison to include Search Arena, WebDev Arena,
      Vision Arena, text-to-image, text-to-video, and Agent Arena (launched June 2026). This multimodal
      expansion broadens LMArena's evaluable surface and addressable customer base. As of June 2026, the
      Arena brand is the de facto public leaderboard for frontier AI models, with its rankings cited in
      product announcements, investor materials, and academic publications by every major AI lab.
    claimRefs: [CO001, CO002, CO005, CO007, CO008, CO009, CO016, CO024, CO025, CO026, CO036]
    figureRefs: [FO002, FO003]

  - id: founders-and-leadership
    title: Founders and Leadership
    body: >
      LMArena was co-founded by three people with UC Berkeley affiliations. Anastasios Angelopoulos, CEO,
      was a postdoctoral researcher in Statistics and Machine Learning at UC Berkeley and is the primary public
      spokesperson. Wei-Lin Chiang, co-founder, completed his PhD in distributed systems at Berkeley and was
      instrumental in building the FastChat serving framework that underlies Chatbot Arena. Ion Stoica, a
      UC Berkeley Computer Science professor and serial entrepreneur (co-founder of Databricks and Anyscale),
      joined as co-founder, providing commercialization experience and industry credibility.
      Original Chatbot Arena research involved additional contributors including Lianmin Zheng and faculty
      advisors Michael Jordan and Joseph Gonzalez. The founding team demonstrates strong founder-market fit:
      Angelopoulos and Chiang co-authored the key academic papers establishing the evaluation methodology,
      and Stoica's track record at Databricks provides operational depth rarely seen in academic spinouts.
      Key-person dependency is elevated: Angelopoulos serves as both scientific lead and CEO. No non-founder
      C-suite executives have been publicly named. No board composition or independent director disclosures
      have been made, typical for early-stage private companies. No leadership departures or governance changes
      have been disclosed since incorporation. However, the 2025 benchmark integrity controversy revealed a
      tension between Stoica (who publicly disputed the Leaderboard Illusion findings) and external researchers,
      highlighting how the founding team's credibility is central to the platform's legitimacy.
    claimRefs: [CO003, CO004, CO005, CO006, CO021, CO030, CO031, CO033, CO039, CO043]
    tableRefs: [TO002]

  - id: funding-and-investors
    title: Funding History and Investors
    body: >
      LMArena's pre-commercial funding came from grants and donations, including contributions from Google's
      Kaggle platform, Andreessen Horowitz, and Together AI, primarily in the form of compute resources and
      cash to support research infrastructure.
      In May 2025, following incorporation, LMArena raised a $100 million seed round co-led by Andreessen
      Horowitz and UC Investments (the University of California's endowment), at a $600 million post-money
      valuation. Lightspeed Venture Partners, Felicis, and Kleiner Perkins also participated. In January
      2026, the company raised a $150 million Series A at a $1.7 billion post-money valuation — nearly triple
      the seed valuation — co-led by Felicis and UC Investments, with Andreessen Horowitz, The House Fund,
      LDVP, Kleiner Perkins, Lightspeed, and Laude Ventures participating. Total capital raised stands at
      approximately $250 million as of January 2026.
      UC Investments' dual role as University of California endowment manager and institutional backer of a
      UC Berkeley spinout, and Andreessen Horowitz's portfolio overlap with models on the Arena leaderboard
      (including Mistral), represent potential conflicts of interest noted by external critics. No secondary
      transactions or debt facilities have been publicly disclosed.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO021, CO040]
    tableRefs: [TO003]

  - id: traction-metrics
    title: Traction Metrics and Financial Indicators
    body: >
      By January 2026, LMArena reported over 5 million monthly users across 150 countries and 60 million
      conversations per month. The community accumulated more than 50 million votes across text, vision,
      web development, search, video, and image modalities, and participated in evaluating more than 400
      distinct AI models. LMArena also released 145,000 open-source battle data points from expert and
      occupational evaluation categories.
      On the financial side, the annualized consumption run rate — the company's ARR proxy — surpassed
      $30 million in December 2025, approximately four months after commercial launch. This is stated as an
      annualized run rate rather than realized GAAP revenue, and independently audited figures are unavailable.
      The rapid ramp from zero to $30 million annualized in four months is exceptional, but the structure of
      the commercial service (SLA-bound deliverables with community raters) implies potential labor cost
      constraints on gross margin that have not been disclosed. LMArena has not disclosed headcount, burn
      rate, or gross margin, which limits financial diligence from publicly available information alone.
      Deduplication filters remove approximately 10% of submitted votes, and identity-leak detection removes
      fewer than 4% of all votes as of July 2025 methodology updates, indicating active data quality management.
    claimRefs: [CO015, CO017, CO018, CO019, CO020, CO023, CO034, CO035, CO038, CO039]
    tableRefs: [TO001]

  - id: milestones-and-adverse
    title: Milestones and Adverse Events
    body: >
      LMArena's trajectory spans approximately three years from research demo to unicorn. The original Chatbot
      Arena launched in May 2023. Academic publications followed rapidly, culminating in the Chatbot Arena
      paper (arXiv:2403.04132) establishing its Bradley-Terry methodology. By 2024 the platform had become
      the de facto reference benchmark, cited by every major AI lab.
      The first material adverse event came in early 2025 when Meta tested at least 27 private Llama 4 model
      variants on Chatbot Arena, submitting an arena-optimized version that scored near the top while the
      publicly released version ranked 32nd. LMArena apologized and updated leaderboard policies. In April
      2025, a peer-reviewed paper titled "The Leaderboard Illusion" (Cohere, Stanford, MIT, Ai2) formally
      documented alleged systematic bias in LMArena's private testing practices. LMArena co-founder Ion Stoica
      publicly disputed the findings as "inaccuracies." LMArena introduced new sampling algorithms and
      published updated transparency policies in response.
      The company incorporated in April 2025, raised $100 million in May 2025, launched its commercial
      product in September 2025, and closed the Series A in January 2026, achieving unicorn status. No
      regulatory investigations, litigation, sanctions, or enforcement actions have been publicly disclosed
      as of June 2026.
    claimRefs: [CO001, CO002, CO005, CO016, CO027, CO028, CO029, CO030, CO037, CO041, CO042]
    tableRefs: [TO004]
    figureRefs: [FO001]

