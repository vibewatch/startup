  - id: technical-architecture
    title: "Technical Architecture and Evaluation Methodology"
    body: >
      All Arena leaderboards use the Bradley-Terry (BT) pairwise comparison model, which infers a
      latent skill coefficient for each model from win/loss outcomes. LMArena's Arena-Rank Python
      package, open-sourced under Apache 2.0 and published on GitHub and PyPI, implements the BT
      fitting with closed-form confidence-interval calculation and a 30x speedup over the historical
      FastChat implementation. The package also supports reweighting to correct for non-uniform
      sampling, meaning models with fewer battles are not penalized. Style-control extensions layer
      additional covariates (token length, markdown header count, markdown bold count, markdown list
      count) into the BT regression to separate substance from stylistic formatting effects; coefficient
      estimation shows that length is the dominant style factor. For the Agent Arena, ranking uses
      causal tracing rather than pairwise votes: the arena treats each component selection as a
      treatment in a multi-intervention randomized controlled trial, aggregating multiple behavioral
      signals (confirmed success, praise/complaint, steerability, bash-error recovery, tool
      hallucination) into a single net-improvement estimate per model. The Arena-Hard pipeline (BenchBuilder,
      arXiv:2406.11939) automates benchmark construction by extracting hard prompts from the live
      Arena dataset via a seven-criterion hardness labeler; Arena-Hard-Auto v0.1 achieves 98.6%
      agreement with human preference rankings at a cost of approximately $20. The Search Arena
      methodology, published as a dataset and paper accepted at ICLR 2026 (arXiv:2506.05334), extends
      the BT model to search-augmented LLM systems across 11+ models from Perplexity, Gemini, and
      OpenAI. Prior to sharing any conversation data, LMArena uses GCP's Sensitive Data Protection API
      to remove personally identifiable information. Since July 2025, methodology updates are publicly
      logged in the Leaderboard Changelog.
