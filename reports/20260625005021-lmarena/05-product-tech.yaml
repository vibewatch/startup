callouts:
  - calloutType: strength
    title: "Real-World Data at Unprecedented Scale"
    body: >
      With 250M+ conversations and 5M+ monthly users across 150+ countries, LMArena has assembled
      the world's largest continuously refreshed human-preference dataset for LLM evaluation. This
      scale creates a compounding data-network moat that static or lab-constructed benchmarks cannot
      replicate, and that has been validated in peer-reviewed work (NeurIPS 2023, ICLR 2026).
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007

  - calloutType: risk
    title: "Gaming and Credibility Risk from Lab Partnerships"
    body: >
      The Meta Llama 4 Maverick incident (April 2025) and the Cohere/Stanford/MIT/AI2 paper alleging
      preferential sampling for top labs are credible product risks: if the community perceives the
      leaderboard as gameable or commercially biased, the platform loses its core value proposition
      as an independent arbiter. The company's commercial revenue from the same labs it evaluates
      creates a structural conflict that policy updates alone may not fully resolve.
    claimRefs:
      - CE024
      - CE025
      - CE026
      - CE027

  - calloutType: risk
    title: "Enterprise Trust Gap: Missing Compliance Certifications"
    body: >
      LMArena has no publicly disclosed SOC 2 Type II, ISO 27001, or third-party security audit for
      its AI Evaluations commercial product. For enterprise buyers handling sensitive prompt data in
      evaluation workloads, the absence of these certifications is a procurement blocker, and the
      current privacy policy lacks enterprise DPA language.
    claimRefs:
      - CE037
      - CE038

