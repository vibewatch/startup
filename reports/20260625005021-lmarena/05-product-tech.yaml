  - id: deployment-infrastructure
    title: "Deployment, Data Infrastructure, and Developer Ecosystem"
    body: >
      The Arena-Rank ranking engine is published as a pip-installable Python package
      (pip install arena-rank) under the lmarena GitHub organization, which also hosts the
      list repository. The FastChat repository (lm-sys/FastChat, now primarily in maintenance mode)
      originally powered Chatbot Arena and remains a reference for the Vicuna model weights. The
      lmarena-ai HuggingFace organization hosts p2l (prompt-to-leaderboard) model variants used
      internally for preference modeling, and releases public battle datasets (e.g.,
      arena-human-preference-140k) to support external research. As of June 2026 the changelog
      records ongoing model additions at a pace of several new models per week across leaderboards.
      The Code Arena's persistent sessions are built on Cloudflare R2 storage with CodeMirror 6
      for source views and live rendering of generated web applications. Agent Mode sessions averaged
      approximately 16.5 structured tool calls per session, with roughly 75.6% of sessions using at
      least one tool; the highest-use sessions ran very long chains in a single week, covering coding,
      file creation, and web synthesis tasks. In one measured 7-day window, Agent Mode wrote 40.3
      million lines of code across successful write_file calls, approximately 1,000 lines per coding
      session. Battles in Direct, integrated since May 2026, converts 10% of direct chat sessions into
      pairwise battles, with position-bias and same-org-indicator corrections applied to the BT fit.
      No API is publicly documented for third-party consumption of Arena scores or raw vote data, though
      open datasets are released periodically on HuggingFace.
