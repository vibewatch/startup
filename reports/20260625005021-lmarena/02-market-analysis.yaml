  evidenceGaps:
  - type: missing-source
    severity: material
    topic: SAM and SOM remain author-derived rather than publisher-backed
    missingEvidence: No verified source in this run publishes a LMArena-specific or even standalone-evaluation-software SAM/SOM decomposition that excludes bundled cloud and MLOps revenue.
    whyItMatters: Without a primary-source SAM/SOM, market-share and valuation arguments are range-based rather than independently auditable.
    diligencePath: Request management's internal market map, segment revenue split, and bottoms-up customer-count or ACV model under NDA.
    relatedQuestionRefs:
    - QM009
    - QM010
    - QM024
  - type: private-evidence-only
    severity: material
    topic: Evaluation spend as a share of AI R&D or product budgets is not publicly disclosed
    missingEvidence: Neither frontier labs nor enterprise buyers disclose what percentage of AI program budgets is spent on third-party evaluation software.
    whyItMatters: Budget-intensity data are needed to translate upstream AI spending into realistic evaluation-software demand.
    diligencePath: Ask customers or management for budget-allocation benchmarks, procurement ranges, or anonymized spend cohorts.
    relatedQuestionRefs:
    - QM011
  - type: private-evidence-only
    severity: material
    topic: Pricing and deal-size data for LMArena and peers are undisclosed
    missingEvidence: Open sources do not reveal ACV bands, usage pricing, seat counts, or renewal mechanics for LMArena, Galileo, Patronus, Arize, or similar vendors.
    whyItMatters: Without pricing data, ARR cannot be converted into customer-count, expansion-rate, or competitive-win-rate conclusions.
    diligencePath: Request order forms, pricing sheets, or customer references that disclose contract structure and renewal behavior.
    relatedQuestionRefs:
    - QM020
  - type: enumeration-incomplete
    severity: material
    topic: Competitor revenue and share mapping across independent evaluation startups is incomplete
    missingEvidence: Verified sources name competitors but do not provide consistent revenue, ARR, or customer-scale disclosure across the startup cohort.
    whyItMatters: Incomplete competitor scale data make it hard to judge whether LMArena is an outlier leader or one of several similarly sized specialists.
    diligencePath: Collect private market intel, financing decks, or customer reference checks for Arize, Galileo, Patronus, Future AGI, and adjacent vendors.
    relatedQuestionRefs:
    - QM014
  - type: conflicting-data
    severity: minor
    topic: Broad versus narrow category definitions remain unresolved
    missingEvidence: Public sources do not expose enough methodological detail to fully reconcile the $2.36B broad platform estimate with the materially smaller narrow benchmarking-tools lens.
    whyItMatters: Definition drift can make market-share arguments look stronger or weaker without any change in company performance.
    diligencePath: Obtain the underlying methodology notes from report publishers and test which workflows are actually counted in each estimate.
    relatedQuestionRefs:
