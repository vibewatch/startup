callouts:
- calloutType: risk
  title: Sizing is highly sensitive to category definition
  body: A broad platform TAM can justify a large strategic opportunity, but a narrower benchmarking-only lens can be far smaller. Investors should avoid simple market-share math until LMArena's revenue mix between public benchmark operations, agent evaluation, and enterprise vertical workflows is verified.
  claimRefs:
  - CM001
  - CM003
  - CM024
  - CM042
- calloutType: insight
  title: The real SAM is likely much smaller than the headline TAM
  body: LMArena's likely monetizable SAM sits inside the broad evaluation-platform category because bundled hyperscaler tools, generic MLOps, and non-paid open benchmarking absorb part of the surrounding spend. That does not negate the opportunity; it sharpens where a standalone trusted-evaluation vendor can plausibly win.
  claimRefs:
  - CM021
  - CM022
  - CM037
  - CM043
- calloutType: recommendation
  title: Validate budget intensity and pricing before leaning on TAM
  body: 'The next diligence step should be customer-level market validation: confirm average contract value, renewal behavior, and what share of customer AI budgets flows to third-party evaluation. Without those data, TAM-based valuation arguments remain more narrative than analytical.'
  claimRefs:
  - CM038
  - CM039
  - CM040
  - CM041
