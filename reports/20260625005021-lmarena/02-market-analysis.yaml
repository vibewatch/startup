- id: evidence-gaps-and-contradictions
  title: Evidence Gaps and Contradictions
  body: 'The main diligence problem is not source scarcity but source mismatch. Public market reports disagree on the category boundary; company and media sources disclose valuation and anecdotal customer names but not enough contract detail to model share; competitor-revenue data are fragmentary; and no verified source in this run discloses what percentage of frontier-lab or enterprise AI budgets is actually spent on evaluation software. That means the chapter can support a credible range-based view but not a single precise SAM or market-share conclusion. Investors should preserve the contradiction instead of forcing a point estimate: LMArena may already be large relative to a narrow benchmarking-tools niche, while still tiny relative to the broader AI evaluation platform opportunity. Resolving that gap requires customer, pricing, and budget-intensity evidence that is not public in the verified source set.'
