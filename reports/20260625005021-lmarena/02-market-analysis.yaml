- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Type
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Enterprise AI production adoption at scale
    - driver
    - 2026-now
    - More production workloads create recurring need for regression, governance, and release testing
    - What portion of production AI teams currently buy third-party evaluation rather than build in-house?
  - - Exploding upstream AI software and model spend
    - driver
    - 2026-2030
    - Evaluation budgets can grow as a small but expanding percentage of a much larger AI stack
    - Can management show expansion of spend per existing customer as AI programs mature?
  - - Agentic AI and workflow automation
    - driver
    - 2026-2030
    - Multi-step agents need workflow and causal evaluation, expanding beyond chatbot ranking
    - How much revenue is tied to agent evaluation versus classic leaderboard workflows?
  - - Benchmark rivalry among frontier labs
    - driver
    - current
    - Launch competition increases demand for credible third-party measurement and narrative control
    - Which buyer segment uses LMArena primarily for external signaling versus internal QA?
  - - Benchmark gaming allegations
    - constraint
    - current
    - Trust erosion can make public scores less monetizable unless tied to controlled enterprise workflows
    - What anti-gaming controls and audit trails does LMArena offer paying customers?
  - - Crowdsourced-rater bias and representativeness criticism
    - constraint
    - current
    - Open-arena votes may not satisfy regulated buyers that need domain-grounded evaluation
    - What share of enterprise evaluations use curated expert raters or private datasets?
  - - Bundling pressure from clouds and MLOps platforms
    - constraint
    - 2026-2028
    - Standalone vendors may face lower pricing power if evaluation becomes a feature not a category
    - Where does LMArena win against bundled MLflow, hyperscaler, or observability workflows?
  - - Sparse public pricing and contract disclosure
    - constraint
    - current
    - Outside investors cannot independently translate TAM into forecastable revenue capture
    - Can management disclose ACV bands, renewal rates, and seat or usage expansion dynamics?
  notes: Drivers and constraints are directional, not weighted; several could be positive for category demand while negative for standalone vendor economics at the same time.
