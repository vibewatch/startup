    - Core training compute, raw inference spend, generic traffic monetization
    - Frontier labs, model API vendors, benchmark sponsors
    - This is the reputational wedge that created LMArena's market visibility
  - - Enterprise model evaluation workflows
    - Regression testing, eval datasets, domain scoring, release gating, QA dashboards
    - Generic BI, ticketing, or unrelated developer productivity tools
    - AI platform teams, model quality leads, domain product owners
    - This is where recurring software spend is most likely to persist beyond public leaderboard usage
  - - Agent and workflow evaluation
    - Multi-step task success scoring, causal traces, workflow benchmarks, tool-use reliability
    - General agent orchestration without measurement, generic copilots
    - Applied AI teams building agents into workflows
    - Agent Arena expands the market beyond chatbot ranking into execution reliability
  - - Regulated and high-stakes vertical validation
    - Legal, medical, engineering, and compliance-sensitive evaluation projects
    - Consumer entertainment chat ranking with no business-critical decision path
    - Domain leaders, risk owners, quality teams
    - LMArena explicitly markets these domains as monetizable beachheads
  - - Bundled platform evaluation
    - Evaluation features embedded in clouds, MLOps suites, and experiment platforms
    - N/A
    - AWS, Google, Microsoft, Databricks, MLflow users
    - This spend exists in the ecosystem but is only partly accessible to a standalone vendor
  - - Adjacent but excluded infrastructure
    - Training data pipelines, foundation-model hosting, inference serving, generic observability
    - All of these remain outside the scoped evaluation software market
    - Infra teams and CTO budgets
    - Excluding these prevents overstatement of the addressable market
  notes: Boundary rows are intentionally scoped to monetizable evaluation software rather than all AI tooling; bundled platform evaluation is included as context but only partly addressable by LMArena.
