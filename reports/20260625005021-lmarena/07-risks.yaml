callouts:
  - calloutType: risk
    title: Structural Conflict of Interest Is an Existential Risk
    body: >
      LMArena earns revenue from the same labs it evaluates. A single high-profile
      investigation documenting that commercial relationships influenced leaderboard
      outcomes would collapse both the public credibility and the enterprise evaluation
      revenue simultaneously. This is a thesis-break event requiring pre-emptive
      governance disclosures and third-party audit commitments before this risk can
      be adequately mitigated.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006

  - calloutType: risk
    title: GDPR Compliance Gap Is Material and Unaudited
    body: >
      LMArena shares user prompts with AI providers as part of its operational model.
      The company's privacy policy acknowledges this but no external GDPR audit or
      formal EU AI Act compliance document has been publicly filed. With 5M monthly
      users in 150 countries, a single EU DPA enforcement action could impose
      fines of up to 4% of global annual turnover under GDPR.
    claimRefs:
      - CR007
      - CR008
      - CR010

  - calloutType: recommendation
    title: Require Independent Methodology Audit Before Deepening Exposure
    body: >
      Any investor considering material exposure to LMArena should require an
      independent statistical audit of the Arena scoring methodology — replicating
      and responding to the findings of arXiv 2504.20879 — as a condition of
      commitment. Without this, the credibility narrative rests on self-attestation
      from an interested party.
    claimRefs:
      - CR002
      - CR003
      - CR004

