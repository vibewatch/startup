  evidenceGaps:
    - type: missing-source
      severity: minor
      topic: DSA-VLOP-threshold
      missingEvidence: >
        Confirmed EU Monthly Active User (MAU) count for LMArena to assess whether the
        45M EU user threshold for VLOP designation under the Digital Services Act has been
        or is approaching being triggered.
      whyItMatters: >
        VLOP designation imposes systemic risk assessments, independent audits, and
        transparency reporting obligations that would materially increase compliance costs.
      diligencePath: >
        Request EU-specific MAU data from LMArena; monitor EU Commission VLOP designation list.
      relatedQuestionRefs: [QR006]

    - type: missing-source
      severity: material
      topic: cloud-infrastructure
      missingEvidence: >
        Formal confirmation of which cloud providers LMArena uses, the contractual terms,
        and whether redundancy exists across multiple cloud regions or providers.
      whyItMatters: >
        Single-cloud dependency would create critical availability and pricing risks,
        especially since GCP is owned by Google, which is also a paying customer.
      diligencePath: >
        Request infrastructure documentation; review AWS/GCP/Azure contract terms in data room.
      relatedQuestionRefs: [QR009]

    - type: private-evidence-only
      severity: blocking
      topic: revenue-concentration
      missingEvidence: >
        Exact revenue breakdown by customer to assess top-customer concentration;
        contract terms and renewal rates for major AI lab relationships.
      whyItMatters: >
        Concentration risk assessment is speculative without knowing whether the
        top 3 labs represent 50% or 90% of $30M ARR.
      diligencePath: >
        Request board pack / data room with customer cohort breakdown, renewal schedule,
        and ARR by customer segment.
      relatedQuestionRefs: [QR014]

    - type: missing-source
      severity: material
      topic: security-certification
      missingEvidence: >
        SOC 2 Type II or ISO 27001 certification report demonstrating security
        controls around the evaluation dataset and user data.
      whyItMatters: >
        Enterprise customers pay for evaluation services that include sensitive
        model output data; lack of certification creates enterprise sales risk
        and GDPR accountability gap.
      diligencePath: >
        Request SOC 2 Type II report; if absent, assess timeline and commitment
        for obtaining certification.
      relatedQuestionRefs: [QR019, QR020]

    - type: missing-source
      severity: material
      topic: EU-AI-Act
      missingEvidence: >
        LMArena's self-assessment or external audit under the EU AI Act's
        GPAI model obligations (in force August 2025).
      whyItMatters: >
        If LMArena's evaluation products are classified as high-risk AI systems in
        regulated domains (law, medicine), additional obligations including human
        oversight and post-market monitoring apply.
      diligencePath: >
        Request EU AI Act compliance self-assessment; engage EU legal counsel
        for GPAI classification analysis.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: material
      topic: API-dependency
      missingEvidence: >
        Formal API access agreements or SLAs between LMArena and AI providers
        (OpenAI, Google, Anthropic, xAI) governing availability, pricing, and
        termination conditions.
      whyItMatters: >
        Any major lab can withdraw API access with short notice, creating leaderboard
        gaps and potential revenue loss; contractual protections reduce this risk materially.
      diligencePath: >
        Request copies of API agreements or term sheets with major model providers.
      relatedQuestionRefs: [QR010, QR016]

    - type: enumeration-incomplete
      severity: minor
      topic: export-controls
      missingEvidence: >
        Compliance program documentation for US export controls and sanctions screening
        covering LMArena's API and evaluation services across 150 countries.
      whyItMatters: >
        Serving users in sanctioned jurisdictions through AI models with dual-use
        potential creates export-control exposure.
      diligencePath: >
        Request OFAC/export-control compliance policy; verify jurisdiction-level
        access restrictions in platform terms of service.
      relatedQuestionRefs: [QR025]

    - type: missing-source
      severity: minor
      topic: academic-commercial-tension
      missingEvidence: >
        Documentation of founder time allocation between academic research commitments
        (UC Berkeley SkyLab affiliation, publication requirements) and commercial leadership.
      whyItMatters: >
        Academic publication timelines and open-source release obligations may conflict
        with enterprise product roadmap and competitive confidentiality requirements.
      diligencePath: >
        Review founder employment agreements; clarify IP assignment and publication
        restriction terms with UC Berkeley.
      relatedQuestionRefs: [QR021]

    - type: missing-source
      severity: minor
      topic: voting-integrity
      missingEvidence: >
        LMArena's disclosed anomaly-detection procedures for identifying sybil accounts,
        coordinated voting campaigns, or prompt injection attacks in the battle data.
      whyItMatters: >
        Statistical integrity of rankings depends on unmanipulated vote distribution;
        absence of published anomaly-detection methodology leaves this risk unverified.
      diligencePath: >
        Request security team disclosure on voting integrity; review published
        methodology papers for detection discussion.
      relatedQuestionRefs: [QR024]

    - type: missing-source
      severity: minor
      topic: competitive-threat-internalisation
      missingEvidence: >
        Evidence of whether major AI labs (Google, OpenAI, Microsoft) have built or
        are building internal community-scale evaluation platforms that could displace
        LMArena for their own model development purposes.
      whyItMatters: >
        If paying customers internalize evaluation, LMArena loses both its revenue
        source and its model access simultaneously.
      diligencePath: >
        Monitor AI lab engineering blogs, job postings, and conference papers for
        evaluation infrastructure development.
      relatedQuestionRefs: [QR026]

    - type: missing-source
      severity: minor
      topic: two-tier-evaluation
      missingEvidence: >
        Detailed policy documentation distinguishing what paying enterprise customers
        receive in commercial evaluations vs what the public leaderboard provides,
