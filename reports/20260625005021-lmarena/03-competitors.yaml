callouts:
  - calloutType: strength
    title: Human-preference data moat is real but not insurmountable
    body: >-
      LMArena's 60 million monthly conversations and 6 million+ cumulative preference votes represent the
      largest public human-preference benchmark dataset in existence. No free competitor has anything close.
      This creates a genuine defensible signal for labs and enterprises that need user-preference grounding
      beyond academic test scores.
    claimRefs:
      - CP001
      - CP002
      - CP039
  - calloutType: risk
    title: Benchmark gaming and selective disclosure undermine the independence narrative
    body: >-
      The Leaderboard Illusion paper (Singh et al., 2025) provides quantified evidence that Google and
      OpenAI received a combined ~40% of all arena battle data and that Meta privately tested 27 Llama 4
      variants. LMArena denied systematic bias but committed to algorithm reforms, signaling the critique
      had operational merit. This creates an ongoing credibility risk for LMArena's core product claim of
      fair, transparent evaluation.
    claimRefs:
      - CP028
      - CP029
      - CP030
      - CP034
      - CP035
  - calloutType: insight
    title: Free automated competitors serve researchers but do not threaten the enterprise evaluation business
    body: >-
      Stanford HELM, EleutherAI harness, and the HuggingFace Open LLM Leaderboard are not monetized and
      do not compete for the enterprise budget that LMArena's AI Evaluations product targets. The real
      competitive pressure from free tools is reputational: they offer credible, reproducible evaluation
      as an alternative to Arena's human-preference signal, limiting how much LMArena can charge for the
      methodology itself.
    claimRefs:
      - CP017
      - CP019
      - CP023
      - CP038
