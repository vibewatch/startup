  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: lmarena enterprise pricing
      missingEvidence: >-
        LMArena has not published a public price card or contract terms for its AI Evaluations product;
        the $300K per-client average is derived from division of run-rate by customer count, not confirmed
        by the company.
      whyItMatters: >-
        Without confirmed pricing, it is impossible to verify whether LMArena can sustain margins or
        whether the enterprise service can generate the economics implied by its $1.7 B valuation.
      diligencePath: >-
        Request sample enterprise contracts and realized ACV distribution from management under NDA;
        confirm whether pricing is usage-based, seat-based, or time-boxed.
      relatedQuestionRefs:
        - QP024
    - type: missing-source
      severity: material
      topic: scale ai enterprise evaluation pricing
      missingEvidence: >-
        Scale AI has no publicly listed price card for its GenAI Platform evaluation services; analyst
        aggregations are the only public data point.
      whyItMatters: >-
        Without a verified Scale AI price point, the pricing comparison between Scale AI and LMArena
        rests on a low-confidence analyst figure that could be materially off.
      diligencePath: >-
        Contact Scale AI's enterprise sales team for a published or indicated range; cross-reference
        with any public references to Scale AI contract values in media coverage.
      relatedQuestionRefs:
        - QP024
    - type: missing-source
      severity: minor
      topic: likelihood of hyperscaler entrant
      missingEvidence: >-
        No public evidence of any major cloud provider (Google Cloud, AWS, Azure) actively building a
        competing neutral AI evaluation platform as of June 2026.
      whyItMatters: >-
        If a hyperscaler built a neutral evaluation platform bundled with cloud services, it could
        credibly undercut LMArena's independence narrative and community-based moat.
      diligencePath: >-
        Monitor AWS, Azure, and Google Cloud product roadmap announcements and job postings for
        evaluation-platform signals; review any public statements by hyperscaler executives on benchmark
        strategy.
      relatedQuestionRefs:
        - QP025
    - type: conflicting-data
      severity: material
      topic: algorithm reform implementation
      missingEvidence: >-
        LMArena committed to a new sampling algorithm after the Singh et al. critique; no independent
        verification of whether the reform was implemented or reduced data-access asymmetry.
      whyItMatters: >-
        If the algorithm reform was not substantively implemented, the Leaderboard Illusion critique
        remains an active vulnerability that a competitor or regulator could use to challenge LMArena's
        independence claim.
      diligencePath: >-
        Request LMArena's post-reform battle sampling methodology documentation and independent audit;
        review any academic follow-up study measuring post-reform data access distribution.
      relatedQuestionRefs:
        - QP006
        - QP025
