company:
  name: LMArena

chapter:
  number: 6
  title: "Customers"
  summary: >
    LMArena serves two distinct customer segments: a large free community user base (5M+ monthly users)
    that provides the preference-vote signal and a small but fast-growing set of paying enterprise and
    AI-lab customers who purchase the AI Evaluations commercial service. Named paying customers confirmed
    in official communications include OpenAI, Google, and xAI; Anthropic and Meta participate as model
    providers though their paying status is less clearly distinguished. The platform achieved an
    annualized revenue run-rate of $30M in December 2025, less than four months after the September 2025
    commercial launch. Key adverse evidence includes the structural conflict of interest between paying
    labs and the ranked leaderboard, the Meta Llama 4 gaming incident, and a research paper from
    Cohere/Stanford/MIT/AI2 alleging preferential access for top labs. Retention and cohort data remain
    undisclosed and are a material diligence gap.

sections:
  - id: customer-segmentation
    title: "Customer Base Segmentation"
    body: >
      LMArena's customer base has two fundamentally different segments that must be distinguished
      carefully. The first is the free community, a global population of 5 million or more monthly
      users across 150+ countries who interact with the platform at no charge through arena.ai. These
      users submit prompts, vote on model outputs, and power the collective preference signal that
      underpins the leaderboards. This community spans developers, researchers, students, knowledge
      workers, and enthusiasts; per the two-year anniversary blog (April 2025), approximately 41% of
      battles involve open-source models, suggesting a technically sophisticated user base. The
      company generates no direct revenue from this segment but derives its core IP (preference data)
      and brand credibility from it. The second is the commercial customer segment, which consists
      of AI labs and enterprises that pay for the AI Evaluations service launched in September 2025.
      Named paying customers confirmed in the January 2026 Series A press release include OpenAI,
      Google, and xAI. Anthropic and Meta are major model providers on the leaderboard but their
      paying status as AI Evaluations subscribers is not separately confirmed in public disclosures;
      the TechCrunch 2026 article notes LMArena "partnered with" OpenAI, Google, and Anthropic for
      model submissions, a category that encompasses both commercial and non-commercial relationships.
      Enterprises (non-lab companies using AI Evaluations to benchmark models for their own
      applications) are a third stated target segment; no named enterprise non-lab customers have
      been publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: "Adoption Trajectory and Usage Metrics"
    body: >
      LMArena's community adoption has been rapid and well-documented. The platform launched in
      May 2023 as a UC Berkeley research project; by May 2025 it disclosed the $100M seed round
      at a $600M valuation with significant traction. By January 2026, at the time of the Series A
      announcement, LMArena reported 5M+ monthly users (up from an implied ~3M cited in the
      September 2025 AI Evaluations blog), 60M+ monthly conversations, 250M+ cumulative conversations,
      and 2M+ monthly votes. The Series A blog post quantified community growth as "25x" since the
      seed round in May 2025. In terms of model evaluations, LMArena has evaluated 400+ public
      models and 300+ pre-release model variants. From September 2025 (commercial launch) to
      December 2025 (less than four months), the annualized revenue consumption run-rate reached
      $30M, per CEO Anastasios Angelopoulos and confirmed in TechCrunch's January 2026 article and
      the official press release. The Series A post also reported 50M+ community votes collected,
      145k+ open-source battle data points released, and 400+ model evaluations across modalities.
      Notably, the platform's growth appears primarily pull-driven: the TechCrunch podcast episode
      notes that LMArena leaderboards "became something of an obsession among model makers,"
      implying low customer-acquisition cost for the community segment.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: named-customer-proof
    title: "Named Customer Proof and Production Evidence"
    body: >
      Named paying customer evidence for the AI Evaluations commercial product is limited but
      specific. The January 2026 PR Newswire press release states: "LMArena works with leading AI
      labs and enterprises, including OpenAI, Google and xAI, all drawing on LMArena's evaluations
      to improve their models for production use cases." This constitutes direct company-stated
      customer naming and is the strongest public customer-proof available. Separately, the Felicis
      partner Peter Deng stated in the same press release: "We're leading this round because LMArena
      has built the most trusted, reliable, real-world signal of AI performance. They have become
      essential infrastructure for every lab and enterprise." The company's Agent Arena methodology
      blog post documents real user sessions — a live sports-TV schedule site, a self-hosted movie
      watchlist, an autonomous underwater vehicle autopilot — as examples of production-style
      deployments, though these are community users, not paying enterprise customers. Prior to
      commercialization, Google's Kaggle, a16z, and Together AI had donated compute and grants to
      LMSYS (the precursor nonprofit). The lmsys.org historical launch records show the original
      2023 partnership structure with UC Berkeley. For model providers that are not confirmed as
      paying: Anthropic and Meta are frequently cited as having their flagship models on the
      leaderboard, but the TechCrunch 2025 and 2026 articles consistently name only OpenAI, Google,
      and Anthropic as "partners" and only OpenAI, Google, and xAI as named commercial customers
      in the press release. No government procurement records, G2/Capterra reviews, or independent
      third-party case studies are publicly available for the AI Evaluations service.
    claimRefs:
      - CU005
      - CU006
      - CU012
      - CU013
      - CU014
      - CU015
    tableRefs:
      - TU003
    figureRefs:
      - FU003

  - id: retention-durability
    title: "Retention, Durability, and Repeat Usage"
    body: >
      LMArena has not publicly disclosed formal retention metrics such as net revenue retention
      (NRR), gross revenue retention (GRR), or customer churn for its AI Evaluations product. The
      platform is too young commercially (launched September 2025) to have multi-year cohort data.
      For the community segment, the principal retention signal is platform activity: the 25x
      community growth year-over-year (May 2025 to January 2026 per the Series A blog) and 250M+
      cumulative conversations versus 60M/month active generation suggest that most of the cumulative
      usage reflects a growing ongoing community rather than one-time visits. The AI Evaluations
      product exhibits a consumption-based model ("annualized consumption rate" rather than
      subscription ARR), which means that retention depends on labs and enterprises continuously
      submitting evaluation requests. The rapid ramp from $0 to $30M annualized in under four
      months implies initial strong lab demand; whether that sustains as labs develop internal
      evaluation capabilities is a key risk. The leaderboard changelog shows continuous model
      additions (several per week in June 2026), which serves as an indirect proxy for ongoing
      model-provider engagement. The lack of any disclosed customer logo wall, case study site, or
      testimonial page (other than investor quotes from Felicis and UC Investments) is notable for
      a company at $1.7B valuation and $30M ARR run-rate.
    claimRefs:
      - CU007
      - CU009
      - CU010
      - CU011
      - CU016
      - CU017
      - CU018
    tableRefs:
      - TU004

  - id: adverse-concentration-conflicts
    title: "Adverse Evidence: Conflicts, Gaming, and Concentration Risk"
    body: >
      LMArena's customer and model-provider relationships create well-documented structural risks.
      First, the conflict of interest: the same AI labs (OpenAI, Google, Anthropic, and others)
      that pay for AI Evaluations and serve as commercial customers are also the entities whose
      models are ranked on the public leaderboard. This creates an inherent incentive for labs to
      optimize for Arena performance, which they can do via the pre-release testing protocol. The
      TechCrunch podcast episode directly raises this: "how a team like theirs can build a neutral
      benchmark when the companies they're ranking are also their backers." Second, the Meta Llama 4
      Maverick incident (April 2025): Meta submitted a "chat-optimized experimental" version of
      Maverick to the arena that achieved a #2 ranking, but the publicly released model ranked
      approximately 32nd. LMArena updated its policy and stated "Meta's interpretation of our policy
      did not match what we expect from model providers." This incident shows that the commercial
      partnership structure (which depends on labs submitting models) creates practical pressure to
      accommodate behavior that damages leaderboard integrity. Third, the Cohere/Stanford/MIT/AI2
      study (April 2025) alleged that Meta could privately test 27 model variants between January
      and March 2025 before selecting the highest performer, that sampling rates were disproportionate
      for top labs, and that the study's preliminary findings were not disputed by LMArena when
      shared. LMArena denied the specific claims but announced a new sampling algorithm. These
      allegations have not been independently adjudicated. Fourth, customer concentration: with
      only three publicly named paying customers (OpenAI, Google, xAI), LMArena's commercial
      revenue is highly concentrated; if any of these labs develop or contract an alternative
      evaluation vendor, the impact on ARR could be significant.
    claimRefs:
      - CU005
      - CU006
      - CU012
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
