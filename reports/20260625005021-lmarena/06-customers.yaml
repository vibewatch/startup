callouts:
  - calloutType: strength
    title: "Rapid Commercial Ramp with Named Enterprise Lab Customers"
    body: >
      Achieving $30M annualized revenue run-rate in under four months from a standing start
      (September–December 2025), with OpenAI, Google, and xAI as named customers, demonstrates
      strong product-market fit among top-tier AI labs. The platform's community trust and data
      quality created a pull-based commercial entry that most B2B SaaS companies cannot replicate.
    claimRefs:
      - CU005
      - CU006
      - CU011

  - calloutType: risk
    title: "Structural Conflict of Interest: Customers Are Also the Ranked Entities"
    body: >
      OpenAI, Google, Anthropic, and xAI simultaneously pay for LMArena evaluations and are
      the primary entities whose models are ranked on the public leaderboard. This creates a
      conflict that no policy update fully resolves: labs have financial and reputational
      incentives to optimize for Arena performance, and LMArena has financial incentives to
      maintain these lab relationships. The Meta gaming incident and the Cohere/Stanford
      research paper are concrete materializations of this structural risk.
    claimRefs:
      - CU019
