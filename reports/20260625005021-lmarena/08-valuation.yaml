callouts:
  - calloutType: recommendation
    title: Track — Conditional Path to Buy Requires Methodology Audit and Entry Discipline
    body: >
      LMArena is a genuinely interesting asset: first-mover position in an expanding
      market, proven network effects, and exceptional revenue trajectory. However, the
      current $1.7B valuation at 57x ARR leaves insufficient margin of safety given the
      unresolved conflict-of-interest and multiple-compression exposure. The recommendation
      is "track" with a conditional buy signal at entry below 30x forward ARR, conditioned
      on receipt of an independent statistical audit of the Arena methodology.
    claimRefs:
      - CV001
      - CV011
      - CV015
      - CV018

  - calloutType: assumption
    title: Revenue Uncertainty Is Material — ARR Is a Run Rate, Not a Full-Year Figure
    body: >
      LMArena's stated $30M "annualized consumption run rate" represents December 2025
      monthly revenue multiplied by 12. The company has fewer than four months of
      commercial operation history. Churn, pricing dynamics, and revenue mix between
      AI labs and enterprises are not publicly disclosed. All valuation scenarios in this
      chapter treat the $30M figure as a directional signal, not a confirmed stable ARR.
    claimRefs:
      - CV002
      - CV006

  - calloutType: risk
    title: Stretched Multiple Requires Flawless Execution and Sustained Credibility
    body: >
      At 57x ARR with no path to profitability disclosed, the current valuation prices in
      a scenario where LMArena both grows ARR rapidly AND maintains the credibility premium
      that justifies a platform multiple above enterprise SaaS medians. The bear case —
      a credibility collapse — is not merely a downside scenario; it is an existential
      event that collapses both revenue and multiple simultaneously.
    claimRefs:
      - CV005
      - CV013
      - CV016

