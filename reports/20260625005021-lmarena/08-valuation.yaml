        The comparable valuation table (TV004) is partial; a more complete set of comparables
        would narrow the valuation range for LMArena and reduce uncertainty in the recommendation.
      diligencePath: >
        Engage a deal-flow database (PitchBook, Crunchbase) to identify AI evaluation/monitoring
        private rounds in 2024–2026 with disclosed revenue multiples.
      relatedQuestionRefs: [QV005]
      relatedTableRefs: [TV004]

    - type: private-evidence-only
      severity: minor
      topic: institutional-positioning
      missingEvidence: >
        Secondary market transaction data for LMArena shares after Series A close,
        including any insider or early-investor share sales.
      whyItMatters: >
        Insider selling patterns after a financing event are an early signal of
