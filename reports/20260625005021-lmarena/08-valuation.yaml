  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: customer-concentration
      missingEvidence: >
        Customer cohort breakdown showing top-3 customer share of $30M ARR, net revenue
        retention by cohort, and churn data since September 2025 launch.
      whyItMatters: >
        Extreme revenue concentration in 3 paying labs at 57x ARR creates a scenario
        where customer churn is simultaneously an ARR and credibility crisis.
      diligencePath: >
        Request data room; prioritize customer cohort data and NRR report.
      relatedQuestionRefs: [QV011]

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >
        Full capitalization table including option pool percentage, preferred stock
        terms, liquidation preferences, anti-dilution provisions, and pro-rata rights.
      whyItMatters: >
        At a 57x ARR multiple with long expected hold periods, liquidation preference
        stack materially affects investor return scenarios especially in a bear case.
      diligencePath: >
        Standard Series A due diligence; request cap table and preference summary
        from counsel.
      relatedQuestionRefs: [QV012]

    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: >
        Evidence of strategic acquirer discussions, M&A outreach from hyperscalers,
        or formal IPO readiness preparation (audited financials, governance improvements).
      whyItMatters: >
        Exit readiness is a key valuation input for a 57x ARR early-stage company;
        the current evidence base does not support clear exit scenario.
      diligencePath: >
        Interview management on exit strategy; assess readiness for hyperscaler
        acquisition conversations (Google, Microsoft, Amazon all have evaluation needs).
      relatedQuestionRefs: [QV015]

    - type: private-evidence-only
      severity: material
      topic: infrastructure-costs
      missingEvidence: >
