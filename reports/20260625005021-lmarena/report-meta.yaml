  foundingLocation: UC Berkeley / San Francisco Bay Area, California
  headquarters: San Francisco Bay Area, California, USA
  productSummary: >-
    Crowdsourced AI model evaluation platform spanning text, coding, search, vision, image, video,
    and agent benchmarks, plus a paid enterprise evaluation product that packages community-grounded
    testing, representative battle samples, leaderboard infrastructure, and SLA-backed analysis.
  customerFocus: >-
    Frontier AI labs, enterprise AI buyers, product teams, and developers that need comparative
    model evaluation for release decisions, procurement, and product quality measurement.
  businessModel: >-
    Evaluation-as-a-service: paid custom and private model evaluations, enterprise benchmarking, and
    related platform services layered on top of the public Arena leaderboard and open evaluation
    datasets.
  stage: Series A
  fundingStatus: >-
