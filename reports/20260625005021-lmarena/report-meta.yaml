  topStrengths:
    - The public Arena leaderboard has become a de facto reference point for frontier-model launches, giving LMArena an unusual data and distribution moat.
    - "Community scale is real: 5M monthly users, 60M monthly conversations, and 50M votes create an evaluation dataset that is hard for new entrants to reproduce quickly."
    - The company commercialized rapidly, launching AI Evaluations in September 2025 and reaching a $30M annualized run rate by December 2025.
    - Product expansion across search, coding, multimodal, and agent benchmarks increases the plausible ARR ceiling beyond text-model comparison alone.
    - Tier-1 investor support and strong academic roots improve credibility with AI labs and enterprise buyers despite limited operating history.
  topRisks:
    - "Structural conflict of interest: major paying labs and investors overlap with the entities whose models LMArena publicly evaluates."
    - Benchmark integrity has already been challenged by the Leaderboard Illusion paper and the Meta Maverick incident, raising real credibility risk.
    - The $1.7B valuation implies roughly 57x the disclosed $30M annualized run rate, leaving little room for execution misses or multiple compression.
    - Revenue quality is still opaque because the company discloses a run-rate proxy rather than audited revenue, gross margin, or customer-concentration data.
    - "Governance disclosure is thin for a company in an adjudication role: public evidence does not yet show board composition, independence controls, or detailed cap-table terms."
  unresolvedGaps:
    - Top-customer concentration and net revenue retention are not publicly disclosed.
    - Gross margin, compute cost structure, and burn rate remain unavailable from public sources.
    - No independent statistical audit has publicly resolved the neutrality concerns raised in 2025.
    - Board composition, investor rights, and liquidation-preference details are still private.
