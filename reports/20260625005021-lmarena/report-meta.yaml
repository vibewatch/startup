companyProfile:
  summary: >-
    LMArena grew out of the UC Berkeley LMSYS / Chatbot Arena research effort launched in 2023 and
    commercialized as Arena Intelligence Inc. in April 2025. Its core product is a blind,
    pairwise human-preference evaluation platform where users compare anonymous AI model outputs,
    generating a public leaderboard and a proprietary stream of real-world preference data. The
    company monetizes through paid AI evaluation services for model labs, enterprises, and
    developers, including the AI Evaluations product launched in September 2025 with auditability,
    representative sample reporting, and service-level agreements. LMArena's traction is unusual:
    public materials cite 5M monthly users, 60M monthly conversations, 50M votes since the seed
    round, and a $30M annualized consumption run rate by December 2025. The same business also
    carries a structural tension because the most important customers and investors overlap with the
    labs whose models the platform evaluates.
  foundedDate: '2023-05-03'
  founders:
    - name: Anastasios Angelopoulos
      role: CEO and co-founder
      background: UC Berkeley statistics and machine-learning researcher; primary public face of Arena's evaluation methodology and commercialization.
      claimRefs: [CO003, CO006]
    - name: Wei-Lin Chiang
      role: Co-founder
      background: UC Berkeley distributed-systems PhD who helped build FastChat and the original Chatbot Arena infrastructure.
      claimRefs: [CO003, CO033]
    - name: Ion Stoica
