companyProfile:
  summary: >-
    LMArena 源自 UC Berkeley LMSYS / Chatbot Arena 在 2023 年启动的研究项目，并在 2025 年 4 月商业化为 Arena Intelligence
    Inc.。它的核心产品是一个盲测、成对的人类偏好评测平台：用户比较匿名 AI 模型输出，由此生成公开排行榜和一条专有的真实世界偏好数据流。公司通过向模型实验室、企业和开发者提供付费 AI 评测服务变现，其中包括 2025 年 9
    月推出的 AI Evaluations 产品，提供可审计性、代表性样本报告和服务级别协议。LMArena 的增长很少见：公开材料显示，月活用户 500 万、月度对话 6000 万、种子轮后累计投票 5000 万次，并在 2025 年
    12 月达到 $30M 年化消费运行率。同一门生意也有结构性张力：最重要的客户和投资人，与平台所评测模型背后的实验室高度重叠。
