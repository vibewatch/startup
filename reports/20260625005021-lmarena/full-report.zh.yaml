      - number: '3.3'
        title: 护城河持久性、切换成本与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              LMArena 的竞争持久性建立在三个因素上：同类最大规模的众包偏好数据集；由学术根基强化的社区信任（UC Berkeley LMSYS Org、FastChat
              开源基础设施）；以及深度引用网络效应——前沿实验室在营销材料和投资人沟通中引用 Arena 排名，从而抬高退出成本。AI 实验室的切换成本真实存在：如果 Arena
              不再是市场信号，它们既有的基准投入就会失去营销价值。这在 LMArena 与客户实验室之间形成互相依赖，带来收入稳定性，也带来结构性独立风险。


              关于护城河的负面证据可信且重要。Singh 等人在 2025 年发表的 Leaderboard Illusion 论文（Cohere、Stanford、MIT、Ai2）量化了数据访问不对称：Google 和
              OpenAI 估计分别获得 Arena 总数据的 19.2% 和 20.4%，而 83 个开放权重模型合计只获得 29.7%。Meta 在 Llama 4 发布前测试了 27
              个私有模型变体，只选择最高分版本；TechCrunch 证实，普通 Maverick 重新提交后排名第 32。LMArena 否认偏差定性，但承诺修改算法，说明批评具有运营层面的分量。第二个负面动态是
              Goodhart 定律：当 Arena 排名开始驱动采购决策，实验室会针对 Arena 特定模式优化，信号质量随之下降，也提高了资源充足的竞争者声称方法更优的概率。


              支撑 Arena 的 Elo 算法开源，任何资金充足的团队都能复制。难以复制的是社区。Scale AI 的企业触达更广，数据标注能力更深，但尚未建立公开偏好排行榜。真正的替代威胁来自内部自建：如果某个 AI
              实验室认为 Arena 的利益冲突问题无解，它可以资助一个竞争性的中立机构。免费学术工具（HELM、HuggingFace）已经在研究用例中承担这类可信度功能，也限制了 LMArena 能为方法本身收取多少溢价。
