      - number: '1.6'
        title: 展示项
        blocks:
          - type: callout
            title: 增速最快的 AI 评测独角兽
            body: >
              LMArena 在约三年内从 UC Berkeley 研究项目走到 $1.7B 估值，并在商业化推出四个月内达到 $30M 年化收入。可信免费排行榜带来大规模获客，机构投资人背书，再加上
              OpenAI、Google、xAI 等具名企业客户，证明它在 AI 评测品类中具备异常强的产品—市场匹配。
            calloutType: strength
            claimRefs:
              - CO011
