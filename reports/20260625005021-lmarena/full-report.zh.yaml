      - number: '5.3'
        title: 部署、数据基础设施与开发者生态
        blocks:
          - type: paragraph
            body: >
              Arena-Rank 排名引擎作为可用 pip 安装的 Python 包发布（pip install arena-rank），归属于 lmarena GitHub 组织，该组织也托管 list
              仓库。FastChat 仓库（lm-sys/FastChat，现在主要处于维护模式）最初支撑 Chatbot Arena，并继续作为 Vicuna 模型权重的参考。lmarena-ai HuggingFace
              组织托管内部用于偏好建模的 p2l（prompt-to-leaderboard）模型变体，并发布公开对战数据集（例如 arena-human-preference-140k）以支持外部研究。截至 2026 年 6
              月，changelog 记录了各排行榜每周新增数个模型的持续节奏。Code Arena 的持久会话建立在 Cloudflare R2 存储之上，用 CodeMirror 6
              展示源码视图和生成网页应用的实时渲染。Agent Mode 会话平均约 16.5 次结构化工具调用，约 75.6%
              的会话至少使用一个工具；最高使用会话在单周内运行很长调用链，覆盖编码、文件创建和网页合成任务。在一个被测的 7 天窗口中，Agent Mode 通过成功的 write_file 调用写入 4030
              万行代码，约每个编码会话 1000 行。Battles in Direct 自 2026 年 5 月集成后，把 10% 的直接聊天会话转化为成对对战，并对 BT
              拟合应用位置偏差和同组织指示器修正。公司未公开记录面向第三方消费 Arena 分数或原始投票数据的 API，但会定期在 HuggingFace 发布开放数据集。
