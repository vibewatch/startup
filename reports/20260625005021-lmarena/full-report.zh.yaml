      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪——转向买入需方法论审计与进入纪律
            body: >
              LMArena 是一个真正有意思的资产：扩张市场中的先发位置、已经验证的网络效应，以及异常出色的收入轨迹。不过，当前 $1.7B 估值对应 57x
              ARR，在利益冲突未解决且存在倍数压缩敞口时，安全边际不足。建议为「track」；若取得 Arena 方法论独立统计审计，并能以低于 30x forward ARR 的价格进入，则出现有条件买入信号。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV015
              - CV018
          - type: callout
            title: 收入不确定性重大——ARR 是 run rate，不是全年数字
            body: >
              LMArena 披露的 $30M「annualized consumption run rate」代表 2025 年 12 月月收入乘以 12。公司商业化运营历史不足四个月。流失、定价动态，以及 AI
              实验室与企业之间的收入组合均未公开披露。本章所有估值情景都把 $30M 视为方向性信号，而非已确认稳定 ARR。
            calloutType: assumption
            claimRefs:
              - CV002
              - CV006
          - type: callout
            title: 拉伸倍数要求无瑕执行和持续可信度
            body: >
              当前估值为 57x ARR，且未披露盈利路径，定价中隐含一种情景：LMArena 既能快速增长 ARR，又能维持可信度溢价，支撑高于企业 SaaS
              中位数的平台倍数。熊市情景——可信度坍塌——不只是下行情景；它是生死事件，会让收入和倍数同时坍塌。
            calloutType: risk
            claimRefs:
              - CV005
              - CV013
              - CV016
