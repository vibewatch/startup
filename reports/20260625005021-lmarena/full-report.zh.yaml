      - number: '2.2'
        title: 市场规模与有争议估计
        blocks:
          - type: paragraph
            body: >-
              在已验证来源中，最干净的 2026 年宽口径市场锚点是 AI 模型评测平台市场报告：2025 年 $1.86B，2026 年增至 $2.36B，CAGR 为 27.3%，2030 年达到
              $6.24B。这个视角大概率包含面向模型实验室、应用开发者和强合规组织销售的企业评测软件。Precedence Research 的窄口径视角则指向明显更小的基准工具细分，2026 年约
              $0.85B，因为它似乎排除了部分打包或相邻工作流，并强调评测加基准工具，而非完整平台层。Gartner 的 2026 年 AI 支出预测和 Presenc AI
              的生产采用调查都支持评测预算会从当前基数快速扩张，但无法解决边界问题。务实结论是：LMArena 真正可变现市场可能远小于宽口径 TAM；但如果它能拿下可信、嵌入工作流的支出，仍足以支撑一家有意义的独立公司。
