      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >
              LMArena 商业化前的资金来自资助和捐赠，包括 Google 的 Kaggle 平台、Andreessen Horowitz 和 Together AI
              的贡献，主要以算力资源和现金形式支持研究基础设施。2025 年 5 月，公司注册成立后，LMArena 完成 $100M 种子轮，由 Andreessen Horowitz 与 UC
              Investments（University of California 的捐赠基金）共同领投，投后估值 $600M。Lightspeed Venture Partners、Felicis 和 Kleiner
              Perkins 也参与投资。2026 年 1 月，公司以 $1.7B 投后估值完成 $150M Series A，估值接近种子轮的三倍，由 Felicis 和 UC Investments
              共同领投，Andreessen Horowitz、The House Fund、LDVP、Kleiner Perkins、Lightspeed 和 Laude Ventures 参投。截至 2026 年 1
              月，融资总额约 $250M。UC Investments 同时是 University of California 捐赠基金管理方，也是 UC Berkeley spinout 的机构支持者；Andreessen
              Horowitz 的投资组合又与 Arena 排行榜上的模型（包括 Mistral）重叠。这些都构成外部批评者指出的潜在利益冲突。公司尚未公开披露二级交易或债务融资安排。
