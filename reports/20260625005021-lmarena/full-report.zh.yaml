      - number: '5.2'
        title: 技术架构与评测方法
        blocks:
          - type: paragraph
            body: >
              所有 Arena 排行榜都使用 Bradley-Terry（BT）成对比较模型，根据胜负结果推断每个模型的潜在能力系数。LMArena 的 Arena-Rank Python 包以 Apache 2.0
              开源，并发布在 GitHub 和 PyPI 上，实现了 BT 拟合、闭式置信区间计算，相比历史 FastChat 实现提速 30
              倍。该包也支持重新加权来修正非均匀采样，意味着对战较少的模型不会被惩罚。风格控制扩展把额外协变量（token 长度、markdown 标题数、markdown 加粗数、markdown 列表数）叠加入 BT
              回归，用于把内容实质与风格式格式化效应分开；系数估计显示长度是主导风格因素。Agent Arena 不用成对投票排名，而是使用因果追踪：Arena 把每次组件选择视为多干预随机对照试验中的一个
              treatment，聚合多个行为信号（确认成功、表扬 / 投诉、可引导性、bash 错误恢复、工具幻觉），为每个模型形成单一净改进估计。Arena-Hard
              流水线（BenchBuilder，arXiv:2406.11939）通过七标准难度标注器，从实时 Arena 数据集中抽取 hard prompts，自动构建基准；Arena-Hard-Auto v0.1 以约
              $20 成本达到与人类偏好排名 98.6% 的一致性。Search Arena 方法以数据集和论文形式发表，并被 ICLR 2026 接收（arXiv:2506.05334），将 BT 模型扩展到来自
              Perplexity、Gemini 和 OpenAI 的 11+ 搜索增强 LLM 系统。在分享任何对话数据之前，LMArena 使用 GCP Sensitive Data Protection API
              移除个人身份信息。自 2025 年 7 月起，方法更新会公开记录在 Leaderboard Changelog。
