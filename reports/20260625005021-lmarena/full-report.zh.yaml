      - number: '5.5'
        title: 信任、安全、质量控制与负面证据
        blocks:
          - type: paragraph
            body: >
              LMArena 的公开排行榜政策（最后更新于 2026 年 4 月 30 日）明确了模型上榜资格、采样规则（要求 ≥20% 的对战发生在公开可用模型之间）、匿名模型的预发布测试协议，以及数据共享政策：发布前用
              GCP 的 Sensitive Data Protection API 清洗对话。可是，截至 2026 年 6 月，LMArena 尚未发布 SOC 2 Type II 或 ISO 27001
              认证，也未公开披露第三方安全审计；help.arena.ai 的隐私政策页也缺少企业数据处理协议（DPA）细节。平台经历过两次严重的可信度挑战。第一，2025 年 4 月，Meta
              提交了一个「experimental, chat-optimized」版本的 Llama 4 Maverick，在 Arena 排名第 2，但它并非公开发布模型；随后 LMArena
              更新政策，并重新给公开版本打分，后者跌至第 32 名。第二，Cohere、Stanford、MIT 与 AI2 在 2025 年 4
              月发表论文，指称部分大实验室（Meta、OpenAI、Google、Amazon）获得了不成比例的高采样率，并能选择性压低表现较差的预发布变体，构成基准博弈；LMArena
              否认这些不准确之处，并指向其已发布的采样透明度。这些事件带来持续的声誉风险，也促使研究社区呼吁更严格的预发布限制、独立审计和算法透明度。AI Evaluations 商业产品提供 SLA
              承诺，但详细的正常运行时间 SLA 条款和安全披露并未公开。
