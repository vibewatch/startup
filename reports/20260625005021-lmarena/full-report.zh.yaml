          - type: callout
            title: 基准完整性风险——The Leaderboard Illusion
            body: >
              Cohere、Stanford、MIT 和 Ai2 的一篇同行评议论文记录了证据：LMArena 允许主要 AI 实验室私下测试多个模型变体，并只选择披露高分结果；Meta 在发布前测试了至少 27 个
              Llama 4 变体。LMArena 反驳了这些发现，但论文提出的数据访问不对称主张（Google 和 OpenAI 分别获得约 19–20% 的全部对战数据，而 83 个开放权重模型合计为
              29.7%）构成结构性可信度风险。如果进一步证据显示存在优先访问，平台在独立实验室和企业客户中的权威性可能被削弱。
            calloutType: risk
