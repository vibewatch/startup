  - id: FV001
    title: 推荐逻辑流——从证据到确信度
    type: flow
    layout: wide
    summary: |
      从市场规模和社区验证出发，经过风险评估和估值证据，最终落到“跟踪，满足条件后买入”的建议。
    data:
      nodes:
        - id: f1
          label: AI 评估市场：2026 年 $2.36B → 2030 年 $6.24B（27% CAGR）
        - id: f2
          label: LMArena 社区：5M MAU、每月 60M 对话、400+ 个模型
        - id: f3
          label: 网络效应护城河：独特规模的实时人类偏好数据
        - id: f4
          label: 利益冲突：收入来自被评估实验室（结构性风险）
        - id: f5
          label: 估值：$1.7B，对应 57x ARR——倍数偏高
        - id: f6
          label: 条件路径：方法论审计 + 以 <30x NTM ARR 入场
        - id: f7
          label: 建议：跟踪（满足条件后买入）
    claimRefs:
      - CV011
      - CV012
      - CV015
  - id: FV002
    title: 估值敏感性——ARR 增长 vs 退出倍数
    type: bar
    layout: wide
    summary: |
      展示在不同 ARR 增长情景（$45M、$75M、$120M）和退出倍数情景（15x、25x、40x）下，2028 年隐含退出估值如何变化，覆盖从压力情景到牛市情景的区间。
    data:
      items:
        - label: $45M ARR × 15x（熊市退出）
          value: 675
        - label: $45M ARR × 25x（熊市-基准退出）
          value: 1125
        - label: $75M ARR × 20x（基准退出）
          value: 1500
        - label: $75M ARR × 30x（基准-牛市退出）
          value: 2250
        - label: $120M ARR × 25x（牛市退出）
          value: 3000
        - label: $120M ARR × 40x（牛市-溢价退出）
          value: 4800
    approximationNotes: |
      ARR 预测由 2025 年 12 月 $30M 基线外推；退出倍数基于公开 AI 基础设施 SaaS 可比公司。数值单位为 USD 百万美元。不是财务模型输出，仅作示意。
    claimRefs:
      - CV009
      - CV010
      - CV016
  - id: FV003
    title: 估值 / 回报区间——以 $1.7B 进入 LMArena
    type: range
    layout: standard
    summary: |
      低 / 基准 / 高三档 2028 年退出估值区间及假设，展示以 $1.7B 入场与示意摊薄入场价对应的回报倍数。
    data:
      items:
        - label: 熊市情景（可信度危机）
          low: 200
          mid: 400
          high: 600
        - label: 基准情景（$70M ARR，25x 退出）
          low: 1500
          mid: 1750
          high: 2100
        - label: 牛市情景（$120M ARR，40x 退出）
          low: 3000
          mid: 4000
          high: 5000
    approximationNotes: |
      所有数字均为 USD 百万美元（2028 年退出价值）。熊市情景假设可信度崩塌、ARR 流失至 <$25M；基准情景假设持续增长且倍数适度压缩；牛市情景假设突破式增长并维持平台溢价倍数。
    claimRefs:
      - CV016
  - id: FV004
    title: 投资 KPI——IC 可用评分卡
    type: kpi
    layout: standard
    summary: |
      围绕七个评估维度给出 IC 可用评分，反映截至运行日期支撑各维度的证据质量和完整度。
    data:
      items:
        - label: 市场规模与 TAM
          value: 8/10
        - label: 产品 / 技术护城河
          value: 7/10
        - label: 客户与收入验证
          value: 6/10
        - label: 团队与执行
          value: 6/10
        - label: 治理与风险
          value: 4/10
        - label: 估值纪律
          value: 3/10
        - label: 证据质量
          value: 6/10
    approximationNotes: |
      分数是作者仅基于可得公开证据按 1–10 分作出的判断，不是算法输出。治理分数因利益冲突未解决、缺少独立审计而受罚；估值分数因 57x ARR 倍数而受罚。
    claimRefs:
      - CV015
      - CV012
      - CV013
