chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品
        blocks:
          - type: paragraph
            body: >
              LMArena 现在以「Arena」品牌运营，是一个 AI 模型评测平台，让用户通过匿名一对一对战比较前沿 AI
              模型。用户同时向两个未标注模型提交提示词，投票选出更好的回答，然后才看到被评测的是哪些模型。聚合投票通过 Bradley-Terry / Elo 排名算法驱动公开排行榜，持续生成大型语言模型和多模态 AI
              系统在真实世界中的表现对比。公司实体 Arena Intelligence Inc. 于 2025 年 4 月 18 日注册成立，把 Chatbot Arena 研究项目转为商业公司。总部位于 San
              Francisco Bay Area（具体地址未披露），与 UC Berkeley 渊源一致。主要网站为 arena.ai 和 lmarena.ai。LMArena 的商业产品 AI Evaluations 于
              2025 年 9 月推出，为企业、模型实验室和开发者提供基于社区的表现分析、代表性反馈样本和服务级别协议。已具名商业客户包括 OpenAI、Google 和
              xAI。商业模式是评测即服务：客户付费，让公司系统评估模型在软件工程、法律、医疗等领域的表现。平台已经远远超出纯文本 LLM 比较，扩展到 Search Arena、WebDev Arena、Vision
              Arena、文生图、文生视频，以及 2026 年 6 月推出的 Agent Arena。多模态扩张扩大了 LMArena 可评测的表面，也扩大了可触达客户群。截至 2026 年 6 月，Arena
              品牌已经成为前沿 AI 模型事实上的公开排行榜，其排名被所有主要 AI 实验室写入产品发布、投资人材料和学术论文。
