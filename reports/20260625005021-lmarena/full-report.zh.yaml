        - 没有 NRR，就无法区分增长型账户（利好）和一次性试点评估（不利于耐久性）
        - 分别获取 AI 实验室客户和企业客户的队列级 NRR；确认是否已有客户流失
      - - 毛利率（P&L 层面）
        - 毛利率决定 $30 M 年化消耗规模指向的是可扩展的高毛利业务，还是杠杆有限的服务交付模式
        - 要求管理账提供毛利行；确认合作伙伴 API 成本和基础设施成本如何处理
      - - ACV 和合同条款
        - 无法验证隐含 $300 K ACV，也无法确认定价是限时、按用量还是按事件
