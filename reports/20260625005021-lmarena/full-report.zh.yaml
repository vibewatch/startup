      - number: '6.3'
        title: 具名客户证明与生产证据
        blocks:
          - type: paragraph
            body: >
              AI Evaluations 商业产品的具名付费客户证据有限，但指向明确。2026 年 1 月 PR Newswire 新闻稿称：「LMArena works with leading AI labs and
              enterprises, including OpenAI, Google and xAI, all drawing on LMArena's evaluations to improve their
              models for production use cases.」这是公司直接点名客户，也是目前最强的公开客户证明。另一个证据来自 Felicis 合伙人 Peter Deng，他在同一新闻稿中表示：「We're
              leading this round because LMArena has built the most trusted, reliable, real-world signal of AI
              performance. They have become essential infrastructure for every lab and enterprise.」公司的 Agent Arena
              方法论博客记录了真实用户会话——一个实时体育电视赛程网站、一个自托管电影待看片单、一个自主水下航行器自动驾驶——作为生产式部署示例，不过这些是社区用户，不是付费企业客户。商业化之前，Google 的
              Kaggle、a16z 和 Together AI 曾向 LMSYS（前身非营利组织）捐赠算力和 grant。lmsys.org 的历史上线记录显示，最初 2023 年的合作结构包括 UC
              Berkeley。尚未确认付费的模型提供方包括 Anthropic 和 Meta：二者经常因旗舰模型上榜而被提及，但 TechCrunch 2025 和 2026 年文章一直只把 OpenAI、Google 与
              Anthropic 称为「partners」，而新闻稿中具名商业客户只有 OpenAI、Google 和 xAI。AI Evaluations 服务没有公开可得的政府采购记录、G2/Capterra
              评价或独立第三方案例研究。
