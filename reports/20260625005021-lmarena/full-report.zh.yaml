      - number: '6.2'
        title: 采用轨迹与使用指标
        blocks:
          - type: paragraph
            body: >
              LMArena 的社区采用增长很快，且证据链较完整。平台 2023 年 5 月作为 UC Berkeley 研究项目上线；到 2025 年 5 月，公司披露以 $600M 估值完成 $100M
              种子轮，彼时已有显著牵引力。到 2026 年 1 月 Series A 公告时，LMArena 报告 5M+ 月度用户（高于 2025 年 9 月 AI Evaluations 博客中隐含的约 3M）、60M+
              月度对话、250M+ 累计对话和 2M+ 月度投票。Series A 博客把 2025 年 5 月种子轮以来的社区增长量化为「25x」。模型评估方面，LMArena 已评估 400+ 个公开模型和 300+
              个预发布模型变体。从 2025 年 9 月商业化上线到 2025 年 12 月（不到四个月），按 CEO Anastasios Angelopoulos 披露、并由 TechCrunch 2026 年 1
              月文章和官方新闻稿确认，年化收入消耗 run-rate 达到 $30M。Series A 文章还披露，平台已收集 50M+ 社区投票、发布 145k+ 开源对战数据点，并完成 400+
              次跨模态模型评估。值得注意的是，平台增长看起来主要由拉动驱动：TechCrunch 播客提到，LMArena 排行榜「became something of an obsession among model
              makers」，意味着社区客群的获客成本较低。
