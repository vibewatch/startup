  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >
              Arena Intelligence, Inc.（d/b/a LMArena）在 2026 年 1 月宣布完成 $150M Series A，投后估值 $1.7B。此前公司于 2025 年 5 月以 $600M
              估值完成 $100M 种子轮，约七个月内累计融资达到 $250M。Series A 由 Felicis 和 UC Investments（University of
              California）领投，Andreessen Horowitz、The House Fund、LDVP、Kleiner Perkins、Lightspeed Venture Partners 和 Laude
              Ventures 参投。公司年化「consumption run rate」——公司称其等同于 ARR——在 2025 年 12 月超过 $30M，距离 2025 年 9 月推出首个商业产品（AI
              Evaluations）不到四个月。按 $30M run rate 计算，投后估值 / ARR 倍数约为 57x，而晚期 Series A SaaS 公司通常在 8-15x。不过，四个月内从 $0
              ARR（2025 年 5 月）到 $30M ARR（2025 年 12 月）的轨迹极其罕见，投资人定价的是未来增长，而不是当前收入。SEC EDGAR Form D（accession
              0002113470-26-000001，2026 年 2 月提交）中「Recall Capital-LMArena」二级基金规模为 $382,500，显示二级市场需求，其隐含估值与 Series A
              价格一致。股权结构细节——从种子轮到 Series A 的稀释（种子轮约出售 17%，Series A 约出售 9%）——基于披露的投后估值和轮次规模，隐含 Series A 前企业价值为
              $1.55B。未发现可转债、优先清算权或既往 down-round 风险的公开证据；公司八个月内估值 step-up 为 2.83x。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV041
