            title: 对创始团队的关键人依赖
            body: >
              Angelopoulos 同时承担科学权威、主要发言人和 CEO 角色。公司尚未公开披露非创始人高管团队。公司的声誉护城河高度依赖学术创始人资历。如果 Angelopoulos 或 Chiang
              突然离开，将同时带来运营风险和可信度真空，并可能让 Scale AI 的 SEAL Showdown 等新竞争者受益。
