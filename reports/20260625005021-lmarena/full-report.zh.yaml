      - number: '8.4'
        title: 建议、情景与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              总体建议为「track」，并在满足以下条件时具备转向「buy」路径：（a）收到回应 arXiv 2504.20879 发现的独立方法论审计；（b）以低于未来十二个月 ARR 30x 的估值进入（意味着若按当前
              $1.7B 价格承诺投资，ARR 至少需达到
              $57M）；（c）商业合同条款确认，付费实验室客户相对于公开排行榜方法论没有获得偏好评估定价。鉴于利益冲突和倍数压缩风险，风险评级为「high」。对该建议的置信度为「medium」——证据足以形成观点，但关键风险因素具有结构性且未解决。估值立场是「stretched」。公司的轨迹、社区参与度和先发优势真实存在；但为这些优势付出的价格并不便宜。牛市情景要求到
              2026 年底 ARR 达到 $75M+ 且可信度不破；熊市情景是可信度坍塌，收入和估值一起压缩至 $200-400M（类似其他行业的基准声誉危机）。持有期较长且有强治理影响力的投资人，如果以 30x
              forward ARR 或更低价格进入，在 base case 下有可信的风险 / 回报情景。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
