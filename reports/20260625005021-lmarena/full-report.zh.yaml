      - number: '8.2'
        title: 估值分析——多重视角
        blocks:
          - type: paragraph
            body: >
              收入倍数分析：在 $30M ARR 和 $1.7B 估值下，ARR 倍数为 57x，把 LMArena 放在后期 AI 基础设施融资轮次的最高十分位。AI 评估基础设施的可比公司很少：Weights and
              Biases 于 2025 年 3 月被 CoreWeave 以 $1.4B 收购（训练 / 评估平台，工具链更宽）；Scale AI 的估值已达数十亿美元区间，收入规模也大一个数量级。早期纯 AI
              基准测试公司没有直接公开可比。最相关的类比是 AI「卖铲人」基础设施：LMArena 作为中立数据层的定位，类似 Bloomberg 或 S&P Global
              服务金融市场——一个具备高切换成本的可信数据特许权。按 The Business Research Company，AI 模型评估市场 2025 年为 $1.86B，预计 2026 年达到 $2.36B，2030
              年以 27.3% CAGR 增至 $6.24B。如果 LMArena 到 2028 年拿下 $3B 市场的 5-10%，收入为 $150-300M，按 15-20x 倍数，对应 $2.25-6B
              估值——这是公开可比退出的 base-to-bull 区间。增长可持续性：四个月达到 $30M，隐含每月新增 $7.5M 的增长速度。即便未来 12 个月只维持该速度的 50%，也会新增 $45M ARR，到
              2026 年底达到 $75M ARR。若倍数压缩到 25x（符合成熟企业 SaaS 特许经营），估值为 $1.875B——大致持平当前。若按 20x 倍数（高增长公开 SaaS 中位数），$75M ARR 对应
              $1.5B。因此，当前 $1.7B 估值取决于：（a）维持快速 ARR 增长，（b）守住平台溢价倍数，或（c）两者兼具。下方情景分析更明确地展示结果分布。
            claimRefs:
              - CV006
              - CV007
