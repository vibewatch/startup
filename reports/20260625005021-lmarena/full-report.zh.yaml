      - number: '7.3'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >
              LMArena 的运营风险集中在平台可靠性、数据质量完整性，以及社区生成评估数据集的安全。每月 6000 万次对话流经其基础设施，一旦持续宕机或发生数据泄露，会直接伤害 LMArena
              区别于静态基准的实时、连续评估主张。平台高度依赖云基础设施（同时运行多个实时 AI 模型 API 的算力成本），其价格和可用性由第三方控制，其中包括 LMArena 正在评估的同一批 AI
              实验室。如果某个提供商撤回 API 访问——当实验室质疑评分或竞争格局变化时，这并非不可行——排行榜会立刻出现缺口。统计完整性是另一项运营风险：LMArena 的 Elo/Bradley-Terry
              评分依赖足够均匀且无偏的对战分布；任何系统性 prompt injection、协同投票活动或针对平台用户基础的女巫攻击，都会污染排名信号，而且未必能被实时发现。2026 年 5 月转向「Battles in
              Direct」后，10% 的 direct-chat
              会话生成对战投票，需要事后校正位置偏差和同组织指标偏差，这说明方法论更新会在事后改变模型排名。评估数据集是具有商业价值的资产，如何防范模型蒸馏攻击或未经授权抓取，仍是持续担忧；尤其是领先 AI
              实验室有财务动机研究评估分布。约 41 人的员工规模，对于这一量级的平台形成了关键人集中风险。
