  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接基准平台、自动化排行榜、数据标注商，以及自建替代方案
        blocks:
          - type: paragraph
            body: >-
              LMArena 位于 AI 模型评测和基准测试领域，目前没有单一竞争对手能复刻它的全栈。可触达的竞争集合有四层。第一，人类偏好平台：LMArena 是众包成对模型比较的主导公开平台；截至 2026 年 1
              月，没有任何免费替代品能接近其 500 万月活用户或 6000 万月度对话量。第二，自动化学术排行榜：HuggingFace Open LLM Leaderboard（由 EleutherAI
              lm-evaluation-harness 驱动）、Stanford HELM 和 BenchLM 聚合 MMLU、GPQA Diamond、SWE-Bench
              等标准化基准分数，覆盖数百个模型，但不采用人类偏好投票。这些工具免费且开源，但衡量的是任务准确性，不是整体用户满意度。第三，企业评测供应商：Scale AI 的 GenAI Platform
              为企业和政府客户提供定制评测、微调和数据标注流水线，每个项目 $93 K–$400 K+；它不运营公开排行榜。第四，现状替代方案：AI 实验室可以用 EleutherAI harness 或 OpenAI
              Evals 自建内部评测流水线并运行自己的测试集，完全规避第三方依赖。潜在进入者包括任何想通过基准界面区分其模型市场的大型云厂商，或由大型 AI
              实验室孵化的内部中立评测机构。真正重要的竞争维度是人类偏好规模、企业收入潜力、第三方独立性和方法可信度。
