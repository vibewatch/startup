      - number: '2.3'
        title: 买方分层与采购
        blocks:
          - type: paragraph
            body: >-
              LMArena 的买方地图有两个不同重心。第一类是前沿实验室和模型 API
              供应商，它们在重大版本发布前后需要可信第三方基准、发布验证和竞争信号。第二类是监管或专业知识密集型企业，它们在法律、医疗和工程工作流中需要领域评测，因为失败成本高，公开消费者基准不够用。这些细分大概率采购方式不同：实验室从中央模型、安全或研究平台预算中支付评测费用；企业则常由
              AI 平台负责人、产品 owner，或风险与质量团队采购。竞争也很混合。Scale AI、Arize、Galileo、Patronus、MLflow，以及大型云或平台厂商都在攻打相邻栈位；CoreWeave 收购
