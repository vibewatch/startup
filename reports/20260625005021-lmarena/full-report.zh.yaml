      - number: '7.2'
        title: 监管、法律与数据隐私风险
        blocks:
          - type: paragraph
            body: >
              LMArena 面对复杂且快速变化的监管环境。法律实体 Arena Intelligence, Inc. d/b/a LMArena 处理来自 150 个国家、500
              万月度用户的个人数据，因此触发欧盟《通用数据保护条例》（GDPR）、欧盟 AI Act（通用 AI 模型义务自 2025 年 8 月起生效）、Digital Services Act（规模达到时可能触发 VLOP
              门槛），以及包括 California CPRA 在内的一系列美国州隐私法义务。LMArena 自身隐私政策（2025 年 9 月生效）明确提醒用户，prompt 和生成回复可能被公开共享，这带来 GDPR 第
              7 条下用户同意充分性的风险。已训练评估模型的删除权挑战（GDPR 第 17 条）是整个 AI 行业已知合规缺口，目前没有明确的执法解释。欧盟 AI Act 关于通用 AI
              文档和透明度的要求，也会增加运营负担。LMArena 将用户 prompt 分享给 AI 提供商用于模型改进，这种做法带来数据流义务，必须在各司法辖区用数据处理协议覆盖。欧盟 AI Act 对「高风险」AI
              系统的定义尚未明确点名 AI 基准测试平台，但法律、医疗、就业等受监管领域的评估可能引来行业特定审查。截至运行日期，公开记录未发现直接涉及 LMArena 或 Arena Intelligence, Inc.
              的诉讼；不过，公司尚未披露其合规认证状态或任何监管问询。用户提交 prompt 被用于训练带来的 IP 风险，在多个司法辖区仍是未定法律问题。
