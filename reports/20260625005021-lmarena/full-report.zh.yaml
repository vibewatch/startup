  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与商业化进展
        blocks:
          - type: paragraph
            body: >-
              LMArena 的收入模式是从免费到企业的漏斗。免费公开排行榜每月服务 150 个国家的 500 万用户，生成 6000 万次模型比较对话，承担社区和信任建设层功能。企业、模型实验室和 AI 开发者为
              LMArena 的商业 AI Evaluations 产品付费（2025 年 9 月推出），该产品提供基于真实用户反馈的定制评测小组、代表性数据样本，以及按 SLA 承诺的交付周期。LMArena
              未发布公开价格表；所有企业合同都直接协商。三类已确认企业客户包括 AI 实验室（2026 年 1 月 Series A 新闻稿明确提及
              OpenAI、Google、xAI）、软件企业，以及受监管专业垂直领域（法律、医疗、科学研究）。公司年化消费运行率在 2025 年 12 月超过 $30M——距离产品上线不到四个月。


              收入确认是重要 caveat：LMArena 和 TechCrunch 都把这个数字描述为「consumption run rate」，而不是已实现年度数字。TechCrunch
              指出，公司用消费率来描述其「年度经常性收入（ARR）」，反映的是按使用量计费，而非预付合同式 SaaS ARR。按 GetLatka 汇总的约 100 个企业客户计算，隐含平均合同额约为每客户
              $300,000——这是用运行率除以客户数得出的估计，并非公司披露数字。实际 ACV 分布、合同期限和续约率均未公开。
