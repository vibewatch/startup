      - number: '1.5'
        title: 里程碑与负面事件
        blocks:
          - type: paragraph
            body: >
              LMArena 从研究演示走到独角兽，历时约三年。最初的 Chatbot Arena 于 2023 年 5 月上线。学术论文快速跟进，最终以 Chatbot Arena
              论文（arXiv:2403.04132）确立 Bradley-Terry 方法。到 2024 年，平台已成为事实上的参考基准，被每家主要 AI 实验室引用。首个重大负面事件发生在 2025 年初：Meta 在
              Chatbot Arena 上测试了至少 27 个私有 Llama 4 模型变体，提交了一个为 Arena 优化的版本，得分接近榜首，而公开发布版本排名第 32。LMArena 随后道歉并更新排行榜政策。2025
              年 4 月，一篇题为《The Leaderboard Illusion》（Cohere、Stanford、MIT、Ai2）的同行评议论文正式记录了对 LMArena
              私有测试做法存在系统性偏差的指控。LMArena 联合创始人 Ion Stoica 公开称这些发现存在「不准确」。作为回应，LMArena 引入新的采样算法并发布更新后的透明度政策。公司 2025 年 4
              月注册成立，2025 年 5 月融资 $100M，2025 年 9 月推出商业产品，并在 2026 年 1 月完成 Series A，跻身独角兽。截至 2026 年 6
              月，未公开披露监管调查、诉讼、制裁或执法行动。
