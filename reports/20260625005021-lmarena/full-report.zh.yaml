      - number: '1.4'
        title: 增长指标与财务信号
        blocks:
          - type: paragraph
            body: >
              到 2026 年 1 月，LMArena 报告称其月活用户超过 500 万，覆盖 150 个国家，每月产生 6000 万次对话。社区在文本、视觉、网页开发、搜索、视频和图像等模态中累计超过 5000
              万次投票，并参与评测 400 多个不同 AI 模型。LMArena 还发布了来自专家和职业评测类别的 14.5 万个开源对战数据点。财务侧，公司 ARR 代理指标——年化消费运行率——在 2025 年 12
              月超过 $30M，距离商业化推出约四个月。这个数字被表述为年化运行率，而非已实现 GAAP 收入；独立审计数据不可得。四个月内从零冲到 $30M 年化极不寻常，但商业服务结构（带 SLA
              的交付物加社区评分者）意味着毛利率可能受到劳动力成本约束，公司尚未披露。LMArena 没有披露员工数、烧钱速度或毛利率，仅靠公开信息很难完成财务尽调。去重过滤器会移除约 10% 的提交投票；截至 2025 年
              7 月方法更新，身份泄露检测移除的投票少于全部投票的 4%，说明公司在主动管理数据质量。
