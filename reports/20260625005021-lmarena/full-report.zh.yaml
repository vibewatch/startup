              从其评估的同一批实验室获得收入。只要出现一次高关注度调查，证明商业关系影响了排行榜结果，公开可信度和企业评估收入会同时坍塌。这是打破投资论点的事件；在该风险得到充分缓释前，公司需要预先披露治理安排并承诺第三方审计。
