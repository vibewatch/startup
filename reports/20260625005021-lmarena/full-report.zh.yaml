  - id: TE003
    title: 技术与运营架构
    columns:
      - 层 / 组件
      - 作用
      - 依赖 / 实现
      - 风险
    rows:
      - - Arena-Rank（排名引擎）
        - 为所有 Arena 计算 BT 系数、置信区间和风格控制后的分数
        - 开源 Python 包（Apache 2.0）；GitHub lmarena/arena-rank；PyPI arena-rank
        - 方法论开放 = 可复现，但也可被竞争对手复刻
      - - Bradley-Terry 成对模型
        - 核心统计模型；从胜负对战中推断潜在能力
        - 自研 Python 实现；比 FastChat 基线快 30 倍；闭式 CI
        - 模型假设（IID 对战、无时间漂移）在重度采样操纵下可能失效
      - - 风格控制扩展
        - 在 BT 回归中把内容实力与格式效果拆开
        - 加性协变量回归；长度、markdown 标题、加粗、列表数量
        - 仅有四个风格协变量；更丰富的语义风格尚未捕捉
      - - 因果追踪（Agent Arena）
        - 通过多干预 RCT 对智能体组件排名；衡量净处理效应
        - 自研统计框架，结合 5 个行为信号
        - 方法论新颖；因果识别假设尚未由第三方验证
      - - BenchBuilder / Arena-Hard 管线
        - 用 LLM 标注器从实时 Arena 数据自动生成高难基准子集
        - arXiv:2406.11939；基于 GPT-4 的难度评分器；7 项难度标准
        - 依赖 GPT-4 做标注；标注器偏差会渗入基准质量
      - - 数据清洗（GCP Sensitive Data Protection API）
        - 公开数据发布前移除 PII
        - Google Cloud Platform API；任何共享数据集发布前调用
        - 依赖单一云厂商；未发布独立 PII 审计
      - - Web 平台（arena.ai）
        - 承载对战、投票 UI、排行榜、Direct Chat、Agent Mode、Code Arena
        - JavaScript 前端；服务器架构未披露
        - 社区信任的单点故障；正常运行时间 SLA 未公开
      - - Cloudflare R2 + CodeMirror 6（Code Arena 基础设施）
        - 存储持久代码会话；渲染实时 Web 应用预览
        - Cloudflare R2 存快照；CodeMirror 6 做代码展示；流式前端
        - 数据驻留和保留政策未披露
      - - FastChat（遗留）
        - 历史上的服务和训练平台；原 Chatbot Arena 后端
        - GitHub lm-sys/FastChat；截至 2025 年主要处于维护模式
        - 已被主动降级优先级；仍在 FastChat 上的外部用户存在迁移风险
      - - p2l 模型（HuggingFace）
