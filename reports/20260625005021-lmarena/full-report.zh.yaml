  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 Arena 模态
        blocks:
          - type: paragraph
            body: >
              LMArena 的核心面向用户产品是 arena.ai 上的 Arena 平台，它针对给定提示词展示两个匿名 AI 模型之间的对战，并记录社区偏好投票。截至 2026 年 6 月，平台支持十个不同评测
              Arena：Text（通用聊天）、Code（智能体式网页开发和编码）、Search（检索增强生成）、Agent（自主多步任务完成）、Vision（多模态理解）、Text-to-Image（图像生成）、Text-to-Video（视频生成）、Image
              Edit（图像编辑模型）、Document（长文档分析），以及一个独立 Direct Chat 模式，用户可在没有成对对战结构的情况下与所选模型交互。Agent Arena 是最新、技术复杂度最高的
              Arena，于 2026 年 6 月 4 日推出，它根据每周 2M+ 工具调用推导出的因果处理效应为编排模型排名。Code Arena 由早期 WebDev Arena（2024 年 12
              月推出）重建而来，是一个实时、隔离的编码环境，模型可通过结构化工具调用自主创建、修改和执行文件，输出持久化在 Cloudflare R2，并通过 CodeMirror 6 展示。自 2026 年 5
              月起，LMArena 还加入「Battles in Direct」，把 10% 的 Direct Chat 会话路由到匿名成对对战，以增加每日投票量。商业产品 AI Evaluations（2025 年 9
              月推出）是一项卖给 AI 实验室和企业的合同评测服务，提供带代表性反馈样本和 SLA 支持交付周期的深度评测。所有公开模型评测都可在公开排行榜上免费获得；商业产品则增加私有、保密、受 SLA 管理的评测运行。
