  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 利益冲突与基准完整性风险
        blocks:
          - type: paragraph
            body: >
              LMArena 的核心风险，是独立裁判身份与收入模型之间的结构性冲突。公司向同一批 AI
              实验室——OpenAI、Google、xAI——收取付费评估服务费用，而这些实验室的模型又出现在其公开排行榜上。这种双重角色会制造真实或被感知的偏袒激励。来自 Cohere、Stanford、MIT 和 AI2
              的学术研究人员在《The Leaderboard Illusion》（arXiv
              2504.20879）中记录了这些动态：少数大型提供商可以私下测试多个模型变体，只选择披露最佳分数，并获得不成比例的更多评估对战。Meta 的 Llama 4 Maverick
              事件进一步说明，即使没有明确违规，政策缝隙也足以让基准博弈发生：Meta 向 LMArena 提交了一个针对对话性优化、从未公开发布的模型，拿到前二排名，直到差异被公开曝光。LMArena 已在 2026 年 4
              月更新政策，但商业依赖与中立感知之间的根本张力仍然存在。包括独立研究员 Gwern 在内的评论者称该排行榜是「a cancer」，并质疑其信号是否仍有科学价值。ucstrategies.com 分析发现，专门为
              Arena 偏好调优的模型最多可把分数抬高 100 Elo；SurgeAI 分析则发现，评估者有 52% 的时间不同意 LMArena
              投票。一旦可信度叙事永久裂开——例如出现高关注度偏见调查、付费实验室丑闻，或监管机构调查 AI 基准准确性声明——LMArena 面向消费者的排行榜和企业评估收入两端的产品价值主张会同时坍塌。
