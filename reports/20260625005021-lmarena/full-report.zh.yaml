      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              LMArena 由三位具有 UC Berkeley 背景的人士共同创立。CEO Anastasios Angelopoulos 曾是 UC Berkeley
              统计学与机器学习博士后研究员，也是公司主要公开发言人。联合创始人 Wei-Lin Chiang 在 Berkeley 完成分布式系统博士学位，是搭建支撑 Chatbot Arena 的 FastChat
              服务框架的关键成员。UC Berkeley 计算机科学教授、连续创业者 Ion Stoica（Databricks 和 Anyscale 联合创始人）以联合创始人身份加入，带来商业化经验和产业可信度。最初的
              Chatbot Arena 研究还包括 Lianmin Zheng 等更多贡献者，以及 Michael Jordan、Joseph Gonzalez
              等教职顾问。创始团队展现出强创始人—市场匹配：Angelopoulos 和 Chiang 合著了奠定评测方法的关键学术论文，Stoica 在 Databricks 的履历则带来学术 spinout
              少见的运营深度。关键人依赖偏高：Angelopoulos 同时担任科学负责人和 CEO。公司尚未公开任命非创始人的 C-suite
              高管。董事会组成或独立董事也未披露，这对早期私营公司并不罕见。自注册成立以来，公司未披露领导层离职或治理变更。不过，2025 年基准完整性争议暴露了 Stoica（公开反驳 Leaderboard
              Illusion 发现）与外部研究者之间的张力，也凸显创始团队可信度对平台合法性有多关键。
