  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              LMArena 的客户基础分成两个本质不同的群体，必须仔细区分。第一类是免费社区：来自 150+ 个国家、每月 500 万以上的全球用户，通过 arena.ai 免费使用平台。这些用户提交
              prompt、为模型输出投票，支撑排行榜背后的集体偏好信号。社区覆盖开发者、研究人员、学生、知识工作者和爱好者；按两周年博客（2025 年 4 月）披露，约 41%
              的对战涉及开源模型，说明用户基础技术含量较高。公司不从这一群体直接变现，但从中获得核心 IP（偏好数据）和品牌可信度。第二类是商业客户，即为 2025 年 9 月推出的 AI Evaluations 服务付费的
              AI 实验室和企业。2026 年 1 月 Series A 新闻稿确认的具名付费客户包括 OpenAI、Google 和 xAI。Anthropic 与 Meta
              是排行榜上的主要模型提供方，但公开披露并未单独确认它们是否为 AI Evaluations 付费订阅客户；TechCrunch 2026 年文章称 LMArena 与 OpenAI、Google 和
              Anthropic 在模型提交上「partnered with」，这一类别同时包含商业和非商业关系。企业（非实验室公司用 AI Evaluations
              为自身应用基准测试模型）是公司声明的第三个目标客群；目前没有公开披露任何具名的非实验室企业客户。
