            - IP / 版权暴露
            - 安全人才缺口
        - label: 低影响
          values:
            - IP 诉讼（目前无案件）
            - ''
            - 轻微投票异常
            - 学术人才流失
    approximationNotes: |
      可能性和影响评级是作者基于公开证据和监管先例作出的评估；LMArena 未披露内部风险台账。
    claimRefs:
      - CR001
      - CR007
      - CR012
      - CR017
  - id: FR002
    title: 风险传导图——LMArena 风险如何流向收入与可信度
    type: dag
    layout: wide
    summary: |
      这张有向无环图展示，根因风险如何传导到收入、用户参与、监管暴露和估值等下游影响。
