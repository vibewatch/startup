  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 独立方法论审计
        - 对 Leaderboard Illusion 论文发现和 LMArena 公开回应做外部统计复现
        - 核心可信度资产未经审计；自我证明不足以支撑投资承诺
        - 聘请独立学者或咨询机构；把交付结果作为投资条件
      - - 客户集中度与 NRR
        - 按客户层级拆分 ARR、前三大客户占比、净收入留存率和 cohort 流失数据
        - 汇总 $30M ARR 掩盖了极高估值下的集中度风险
        - 向数据室索取；若无法提供，考虑延长 90 天尽调
      - - 股权结构与清算优先权
        - 完整资本结构表，包括期权池、优先权条款、反稀释条款和 pro-rata 权利
        - 57x ARR 意味着持有期较长；清算顺位会显著影响回报情景
        - 标准 Series A 尽调；通常可在数据室获得
      - - EU AI Act 合规状态
        - EU AI Act（2025 年 8 月）要求的 GPAI 模型文档、数据来源记录和版权政策
        - 不合规会带来 EU 市场风险，并引发受监管行业企业客户顾虑
        - 索取法律意见；承诺投资前请 EU 律师审阅
      - - 基础设施与 SLA 协议
        - 云服务商协议（GCP 合同）、AI 提供商 API 访问协议和企业评测 SLA
        - 平台可用性和收入连续性依赖未披露的第三方协议
        - 在数据室索取；特别关注提供商终止通知期
      - - 员工数与招聘计划
        - 组织架构图，列出现有缺口、支撑每名员工 $10M+ ARR 的招聘计划，以及创始人关键人协议
        - 41 人支撑 $30M ARR 已很精简；扩至 $100M ARR 需要显著补组织
        - 在启动会议中向管理层索取
    notes: |
      尽调问题按接近当前 $1.7B 估值入场的投资人优先级排序。第 1 和第 2 项被视为买入决策的阻断项。第 3–6 项对投资结构设计和交割后监控有实质影响。
    claimRefs:
      - CV019
