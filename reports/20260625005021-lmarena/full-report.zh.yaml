      - - 客户集中度（top-3 收入占比）
        - 如果三个实验室客户（OpenAI、Google、xAI）贡献 50%+ 收入，任何单一客户流失都是重大事件
        - 要求按客户层级拆分收入；标记任何单一客户收入占比 >20% 的情况
      - - 截至 2026 年 6 月的人数和烧钱
