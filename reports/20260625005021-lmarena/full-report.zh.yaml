  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              LMArena 应被放在 AI
              评测与基准测试软件层中分析，而不是泛模型基础设施或可观测性公司。纳入的市场包括人类偏好基准测试、自动化回归测试、面向监管或重专业知识场景的领域评测工作流，以及更新的智能体评测产品——后者评估多步任务成功率，而不只看单轮聊天质量。可服务市场不包括基础模型训练算力、通用
              MLOps 编排、广义开发者工具，以及未作为托管工作流软件销售的开源评测脚本。这个边界很重要：有些发布方测算的是宽口径评测平台品类，有些则测算狭义基准工具细分，导致 TAM 相差数倍。LMArena
              自身商业信息强调法律、医疗和工程评测，说明它可变现市场更接近高风险验证支出，而不是单靠公开排行榜流量定义。
