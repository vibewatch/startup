      - number: '4.2'
        title: 成本结构、单位经济与资本充足性
        blocks:
          - type: paragraph
            body: >-
              从公开证据推断，LMArena 的成本结构有三大类。第一，算力和基础设施：每月跨前沿模型服务 6000 万次对话，需要大量云算力。公开排行榜使用合作实验室提供的模型
              API（可能根据合作协议以折扣或免费方式提供），但企业评测产品在规模化后很可能产生真实推理成本。第二，工程和研究人员：截至 2026 年 1 月 Series A 公告，公司有 41 名员工。按 Silicon
              Valley 技术初创公司的典型全包薪酬，这意味着年人员成本约 $15–25M。第三，社区管理、数据标注质量保障和 go-to-market
              成本，这些无法从公开信息中测算。毛利率未披露；如果是边际评测成本较低的软件式模型，毛利率可能达到 60–80%，但每次对话算力成本高也可能把毛利率压到 40–60%。没有坚实依据的第三方估计。


              近期资本充足性看起来很强。公司已在 2025 年 5 月种子轮（$100M，估值 $600M）和 2026 年 1 月 Series A（$150M，估值 $1.7B）累计融资 $250M。团队精简至 41
              人，首个商业收入到 2025 年 9 月才建立，因此截至 2026 年初，年现金消耗大概率远低于 $30M。粗略估算显示，不再融资也至少有 18–36 个月
              runway，但公司未披露官方烧钱率或现金余额。LMArena 表示将把 Series A 资金用于扩充技术团队、强化研究能力并搭建新平台功能——这些都会提高未来 burn。Recall
