      - number: '6.4'
        title: 留存、耐久性与重复使用
        blocks:
          - type: paragraph
            body: >
              LMArena 尚未公开披露 AI Evaluations 产品的正式留存指标，例如净收入留存（NRR）、总收入留存（GRR）或客户流失率。商业化时间还太短（2025 年 9 月上线），没有多年 cohort
              数据。社区端的主要留存信号是平台活跃度：按 Series A 博客，2025 年 5 月至 2026 年 1 月社区同比增长 25x；250M+ 累计对话相对
              60M/月活跃生成量，说明累计使用的大部分来自持续扩大的活跃社区，而非一次性访问。AI Evaluations 采用基于消耗的模型（「annualized consumption rate」而非订阅
              ARR），因此留存取决于实验室和企业是否持续提交评估请求。不到四个月从 $0 爬到 $30M 年化，显示初始实验室需求强劲；但实验室发展内部评估能力后，这种需求能否持续，是关键风险。排行榜 changelog
              显示模型持续新增（2026 年 6 月每周数个），可作为模型提供方持续参与的间接代理。对于一家估值 $1.7B、ARR run-rate 为 $30M 的公司而言，没有披露客户 logo 墙、案例研究站点或
              testimonial 页面（除 Felicis 与 UC Investments 的投资人引述外），这一点值得注意。
