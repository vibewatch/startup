      - number: '3.2'
        title: 功能与能力对比：人类偏好 vs. 自动化基准
        blocks:
          - type: paragraph
            body: >-
              AI 评测的核心能力分野，在于人类偏好排行榜（LMArena 及其 LMSYS 前身）和自动化基准流水线（HuggingFace Open LLM Leaderboard、Stanford
              HELM、EleutherAI lm-evaluation-harness、OpenAI Evals）。LMArena 的 Elo 排名系统在 2024 年 Chatbot Arena
              论文中有描述，它聚合用户提交的任意任务成对投票，形成一个持续更新、反映真实使用模式而非策划测试集的信号。实践中，这意味着 LMArena
              对用户在日常任务中感知到的风格、流畅度和有用性信号更敏感——包括写代码、写作、回答问题——但可复现性弱于自动化基准，因为两个用户完全可能合理地偏好相反输出。


              自动化排行榜可复现且任务特定。Stanford HELM 在统一 harness 上评估准确性、校准、鲁棒性、偏见和效率等维度，更适合需要受控测量的研究者。HuggingFace Open LLM
              Leaderboard 主要跟踪开源和开放权重模型在标准化学术测试上的表现。EleutherAI 的 harness 支撑两者，并且可以免费 fork。BenchLM 截至 2026 年 6 月聚合了 261
              个模型的 249 个基准，并单独跟踪价格和速度。ArtificialAnalysis 提供独立 API 吞吐、延迟和成本基准。Scale AI
              的企业评测产品填补的是另一块空白：针对客户具体生产用例的定制、私有、SLA 支持评测，而不是公开排行榜。这种模式不与 LMArena 争夺品牌认知，但可能争夺企业预算。


              LMArena 的关键差异化在于网络效应（用户越多 → 投票越多 → 排名统计稳定性越强）、跨模态覆盖（截至 2025–2026
              年覆盖文本、视觉、图像生成、视频、网页开发），以及与前沿实验室的大量预发布合作。它的弱点是方法可复现性、用户群偏向技术熟练的早期采用者，以及向同一批被排名实验室销售评测服务带来的内在张力。没有竞争对手把公开排行榜界面和企业付费评测服务放在同一个品牌下，这既是
              LMArena 的结构性护城河，也是它的利益冲突风险。
