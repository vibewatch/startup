      - number: '6.5'
        title: 反向证据：冲突、博弈与集中度风险
        blocks:
          - type: paragraph
            body: >
              LMArena 的客户和模型提供方关系带来有充分记录的结构性风险。第一是利益冲突：付费使用 AI Evaluations、充当商业客户的同一批 AI 实验室（OpenAI、Google、Anthropic
              等），也是其模型在公开排行榜上被排名的主体。这天然激励实验室优化 Arena 表现，而它们可以通过预发布测试协议做到这一点。TechCrunch 播客直接提出这个问题：「how a team like
              theirs can build a neutral benchmark when the companies they're ranking are also their backers.」第二是 Meta
              Llama 4 Maverick 事件（2025 年 4 月）：Meta 向 Arena 提交了一个「chat-optimized experimental」版本的 Maverick，拿到第 2
              名，但公开发布模型大约排在第 32。LMArena 更新政策并表示「Meta's interpretation of our policy did not match what we expect from
              model providers.」该事件说明，依赖实验室提交模型的商业合作结构，会给平台带来实际压力，去容纳损害排行榜完整性的行为。第三，Cohere/Stanford/MIT/AI2 研究（2025 年 4
              月）指称，Meta 可在 2025 年 1 月至 3 月间私下测试 27 个模型变体，再选择表现最好者提交；顶级实验室获得不成比例的采样率；研究初步发现分享给 LMArena 后并未被其否认。LMArena
              否认具体指控，但宣布了新的采样算法。这些指控尚未经过独立裁定。第四，客户集中：公开具名的付费客户只有三家（OpenAI、Google、xAI），LMArena
              的商业收入高度集中；若其中任何一家实验室自建或签约替代评估供应商，对 ARR 的影响可能显著。
