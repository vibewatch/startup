        blocks:
          - type: paragraph
            body: >
              LMArena's public leaderboard policy (last updated April 30, 2026) specifies eligibility criteria for model
              listing, a sampling policy requiring ≥20% of battles to be between publicly available models, a
              pre-release testing protocol for anonymized models, and a data-sharing policy using GCP's Sensitive Data
              Protection API to sanitize conversations before release. However, as of June 2026 LMArena has not
              published SOC 2 Type II or ISO 27001 certifications, no third-party security audit is publicly disclosed,
              and the help.arena.ai privacy policy page lacks enterprise data processing agreement (DPA) details. The
              platform has faced two serious credibility challenges. First, in April 2025 Meta submitted an
              "experimental, chat-optimized" version of Llama 4 Maverick that ranked #2 on the arena but was not the
              publicly released model; LMArena subsequently updated its policy and rescored the public version, which
              fell to 32nd place. Second, a paper authored by Cohere, Stanford, MIT, and AI2 in April 2025 alleged that
              certain large labs (Meta, OpenAI, Google, Amazon) received disproportionately high sampling rates and
              could selectively suppress low-performing pre-release variants, constituting benchmark gaming; LMArena
              denied the inaccuracies and pointed to its published sampling transparency. These incidents create ongoing
              reputational risk and have prompted calls from the research community for tighter pre-release limits,
              independent audits, and algorithmic transparency. The AI Evaluations commercial product offers SLA
