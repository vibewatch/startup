      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >
              LMArena's pre-commercial funding came from grants and donations, including contributions from Google's
              Kaggle platform, Andreessen Horowitz, and Together AI, primarily in the form of compute resources and cash
              to support research infrastructure. In May 2025, following incorporation, LMArena raised a $100 million
              seed round co-led by Andreessen Horowitz and UC Investments (the University of California's endowment), at
              a $600 million post-money valuation. Lightspeed Venture Partners, Felicis, and Kleiner Perkins also
              participated. In January 2026, the company raised a $150 million Series A at a $1.7 billion post-money
              valuation — nearly triple the seed valuation — co-led by Felicis and UC Investments, with Andreessen
              Horowitz, The House Fund, LDVP, Kleiner Perkins, Lightspeed, and Laude Ventures participating. Total
              capital raised stands at approximately $250 million as of January 2026. UC Investments' dual role as
              University of California endowment manager and institutional backer of a UC Berkeley spinout, and
              Andreessen Horowitz's portfolio overlap with models on the Arena leaderboard (including Mistral),
              represent potential conflicts of interest noted by external critics. No secondary transactions or debt
              facilities have been publicly disclosed.
