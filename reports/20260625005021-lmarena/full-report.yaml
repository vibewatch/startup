  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Independent methodology audit
        - External statistical replication of Leaderboard Illusion paper findings and LMArena's published responses
        - Core credibility asset is unaudited; self-attestation insufficient for investment commitment
        - Engage independent academic or consulting firm; condition investment on delivery
      - - Customer concentration and NRR
        - ARR breakdown by customer tier, top-3 customer share, net revenue retention rate, and cohort churn data
        - Extreme valuation concentration risk hidden behind aggregate $30M ARR figure
        - Request from data room; consider 90-day diligence extension if unavailable
      - - Cap table and liquidation preferences
        - Full capitalization table with option pool, preference terms, anti-dilution provisions, and pro-rata rights
        - 57x ARR implies long hold period; liquidation stack materially affects return scenarios
        - Standard Series A due diligence; typically available in data room
      - - EU AI Act compliance status
        - GPAI model documentation, data provenance records, and copyright policy required under EU AI Act (August 2025)
        - Non-compliance creates EU market risk and enterprise customer concern in regulated industries
        - Request legal opinion; review with EU counsel before commitment
      - - Infrastructure and SLA agreements
        - Cloud provider agreements (GCP contract), AI provider API access agreements, and enterprise evaluation SLAs
        - Platform availability and revenue continuity depend on undisclosed third-party agreements
        - Request in data room; pay particular attention to provider termination notice periods
      - - Headcount and hiring plan
        - >-
          Organization chart with current gaps, hiring plan to $10M+ ARR per employee, and key-man agreements for
          founders
        - 41 headcount at $30M ARR is thin; scaling to $100M ARR requires significant organizational build
        - Request from management in kick-off meeting
    notes: >
      Diligence asks are prioritized for an investor entering at or near the current $1.7B valuation. Items 1 and 2 are
      considered blocking for a buy decision. Items 3–6 are material for investment structuring and post-close
      monitoring.
