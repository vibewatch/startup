        title: Product Portfolio and Arena Modalities
        blocks:
          - type: paragraph
            body: >
              LMArena's core user-facing product is the Arena platform at arena.ai, which presents battles between two
              anonymized AI models for a given prompt and records the community's preference vote. As of June 2026 the
              platform supports ten distinct evaluation arenas: Text (general chat), Code (agentic web-development and
              coding), Search (retrieval-augmented generation), Agent (autonomous multi-step task completion), Vision
              (multimodal understanding), Text-to-Image (image generation), Text-to-Video (video generation), Image Edit
              (image-editing models), Document (long-form document analysis), and a separate Direct Chat mode where
              users interact with a chosen model without the pairwise battle structure. The Agent Arena is the newest
              and most technically complex arena, launched June 4, 2026, which ranks orchestrator models on causal
              treatment effects derived from 2M+ tool calls per week. Code Arena, rebuilt from the earlier WebDev Arena
              (launched December 2024), operates as a live, isolated coding environment where models autonomously
              create, modify, and execute files through structured tool calls, with outputs persisted in Cloudflare R2
              and displayed via CodeMirror 6. Since May 2026 LMArena also includes "Battles in Direct," routing 10% of
              Direct Chat sessions into anonymous pairwise battles to increase daily vote volume. The commercial
              product, AI Evaluations (launched September 2025), is a contract evaluation service sold to AI labs and
              enterprises, offering in-depth evaluations with representative feedback samples and SLA-backed delivery
              timelines. All public model evaluations are available free of charge on the public leaderboard; the
              commercial product adds private, confidential, SLA-governed evaluation runs.
