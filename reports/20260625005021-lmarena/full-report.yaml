  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              LMArena should be analyzed as part of the AI evaluation and benchmarking software layer rather than as a
              general model-infrastructure or observability company. The included market spans human-preference
              benchmarking, automated regression testing, domain-specific evaluation workflows for regulated or
              expertise-heavy use cases, and newer agent-evaluation products that score multi-step task success instead
              of only single-turn chat quality. Excluded from the serviceable market are foundation-model training
              compute, generic MLOps orchestration, broad developer tooling, and open-source evaluation scripts that are
              not sold as managed workflow software. That boundary matters because some publishers size a broad
              evaluation-platform category, while others size a narrow benchmarking-tools niche, producing multi-fold
              TAM divergence. LMArena’s own commercial messaging emphasizes law, medicine, and engineering evaluation,
              which suggests its monetizable market is defined more by high-stakes validation spend than by public
              leaderboard traffic alone.
            claimRefs:
