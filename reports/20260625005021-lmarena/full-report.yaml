  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >
              Arena Intelligence, Inc. (d/b/a LMArena) raised $150 million in a Series A round announced January 2026,
              achieving a post-money valuation of $1.7 billion. This followed a $100 million seed round at a $600
              million valuation in May 2025, bringing total capital raised to $250 million in approximately seven
              months. The Series A was led by Felicis and UC Investments (University of California), with participation
              from Andreessen Horowitz, The House Fund, LDVP, Kleiner Perkins, Lightspeed Venture Partners, and Laude
              Ventures. The company's annualized "consumption run rate" — which it describes as equivalent to ARR —
              surpassed $30 million in December 2025, less than four months after launching its first commercial product
              (AI Evaluations) in September 2025. This gives a post-money valuation-to-ARR multiple of approximately 57x
              on the $30M run rate, compared with 8-15x typically seen for late Series A SaaS companies. However, the
              trajectory from $0 ARR (May 2025) to $30M ARR (December 2025) in four months is exceptional and investors
              are pricing forward growth, not current revenue. The SEC EDGAR Form D (accession 0002113470-26-000001,
              filed February 2026) for the "Recall Capital-LMArena" secondary fund at $382,500 indicates
              secondary-market demand at implied valuations consistent with the Series A price. Cap table details —
              dilution from seed to Series A (approximately 17% sold at seed, approximately 9% sold at Series A) imply a
              pre-money Series A enterprise value of $1.55 billion based on disclosed post-money valuation and round
              size. No public evidence of convertible notes, preferred liquidation preferences, or prior down-round risk
              has been found; the company raised at a 2.83x step-up in eight months.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV041
