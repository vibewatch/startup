      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >
              LMArena was co-founded by three people with UC Berkeley affiliations. Anastasios Angelopoulos, CEO, was a
              postdoctoral researcher in Statistics and Machine Learning at UC Berkeley and is the primary public
              spokesperson. Wei-Lin Chiang, co-founder, completed his PhD in distributed systems at Berkeley and was
              instrumental in building the FastChat serving framework that underlies Chatbot Arena. Ion Stoica, a UC
              Berkeley Computer Science professor and serial entrepreneur (co-founder of Databricks and Anyscale),
              joined as co-founder, providing commercialization experience and industry credibility. Original Chatbot
              Arena research involved additional contributors including Lianmin Zheng and faculty advisors Michael
              Jordan and Joseph Gonzalez. The founding team demonstrates strong founder-market fit: Angelopoulos and
              Chiang co-authored the key academic papers establishing the evaluation methodology, and Stoica's track
              record at Databricks provides operational depth rarely seen in academic spinouts. Key-person dependency is
              elevated: Angelopoulos serves as both scientific lead and CEO. No non-founder C-suite executives have been
              publicly named. No board composition or independent director disclosures have been made, typical for
              early-stage private companies. No leadership departures or governance changes have been disclosed since
              incorporation. However, the 2025 benchmark integrity controversy revealed a tension between Stoica (who
              publicly disputed the Leaderboard Illusion findings) and external researchers, highlighting how the
              founding team's credibility is central to the platform's legitimacy.
