chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Product
        blocks:
          - type: paragraph
            body: >
              LMArena, now operating under the brand "Arena," is an AI model evaluation platform that enables users to
              compare frontier AI models through anonymous head-to-head battles. A user submits a prompt to two
              unlabeled models simultaneously, votes on the better response, and only then sees which models were
              judged. Aggregated votes power a public leaderboard using a Bradley-Terry / Elo-based ranking algorithm,
              generating continuous, real-world performance comparisons across large language models and multimodal AI
              systems. The corporate entity, Arena Intelligence Inc., was incorporated on April 18, 2025, transitioning
              the Chatbot Arena research project into a commercial enterprise. Headquarters is in the San Francisco Bay
              Area (specific address undisclosed), consistent with UC Berkeley origins. Primary websites operate at
              arena.ai and lmarena.ai. LMArena's commercial product, AI Evaluations, launched in September 2025,
              providing enterprises, model labs, and developers with community-grounded performance analytics,
              representative feedback samples, and service-level agreements. Named commercial customers include OpenAI,
              Google, and xAI. The business model is evaluation-as-a-service: clients pay for systematic assessments of
              model performance across domains such as software engineering, law, and medicine. The platform has
              expanded well beyond text-only LLM comparison to include Search Arena, WebDev Arena, Vision Arena,
              text-to-image, text-to-video, and Agent Arena (launched June 2026). This multimodal expansion broadens
              LMArena's evaluable surface and addressable customer base. As of June 2026, the Arena brand is the de
              facto public leaderboard for frontier AI models, with its rankings cited in product announcements,
              investor materials, and academic publications by every major AI lab.
