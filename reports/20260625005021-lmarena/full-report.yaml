      - number: '1.5'
        title: Milestones and Adverse Events
        blocks:
          - type: paragraph
            body: >
              LMArena's trajectory spans approximately three years from research demo to unicorn. The original Chatbot
              Arena launched in May 2023. Academic publications followed rapidly, culminating in the Chatbot Arena paper
              (arXiv:2403.04132) establishing its Bradley-Terry methodology. By 2024 the platform had become the de
              facto reference benchmark, cited by every major AI lab. The first material adverse event came in early
              2025 when Meta tested at least 27 private Llama 4 model variants on Chatbot Arena, submitting an
              arena-optimized version that scored near the top while the publicly released version ranked 32nd. LMArena
              apologized and updated leaderboard policies. In April 2025, a peer-reviewed paper titled "The Leaderboard
              Illusion" (Cohere, Stanford, MIT, Ai2) formally documented alleged systematic bias in LMArena's private
              testing practices. LMArena co-founder Ion Stoica publicly disputed the findings as "inaccuracies." LMArena
              introduced new sampling algorithms and published updated transparency policies in response. The company
              incorporated in April 2025, raised $100 million in May 2025, launched its commercial product in September
              2025, and closed the Series A in January 2026, achieving unicorn status. No regulatory investigations,
              litigation, sanctions, or enforcement actions have been publicly disclosed as of June 2026.
