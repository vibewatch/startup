      - - Top-lab customer churn
        - Any of OpenAI, Google, or xAI publicly terminates evaluation contract or removes models
        - Revenue cliff (majority of $30M ARR at risk); community coverage gap
        - Thesis warning; evaluate concentration and replacement pipeline before escalating
