      - number: '7.3'
        title: Operational, Technical, and Security Risks
        blocks:
          - type: paragraph
            body: >
              LMArena's operational risks center on platform reliability, data quality integrity, and the security of
              its community-generated evaluation dataset. With 60 million monthly conversations flowing through its
              infrastructure, a sustained outage or data breach would directly damage the real-time,
              continuous-evaluation proposition that differentiates LMArena from static benchmarks. The platform depends
              heavily on cloud infrastructure (compute costs for running multiple live AI model APIs simultaneously)
              whose pricing and availability are controlled by third parties including the same AI labs LMArena
              evaluates. A provider pulling API access — feasible if a lab disputes a rating or competitive dynamic
              shifts — would immediately create gaps in the leaderboard. Statistical integrity is another operational
              risk: LMArena's Elo/Bradley-Terry scoring relies on a sufficiently uniform and unbiased distribution of
              battles; any systematic prompt injection, coordinated voting campaigns, or sybil attacks on the platform's
              user base would corrupt the ranking signal without necessarily being detectable in real time. The shift to
              "Battles in Direct" (May 2026) where 10% of direct-chat sessions generate battle votes required post-hoc
              bias corrections for position bias and same-organization indicator bias, demonstrating that methodological
              updates can shift model rankings after the fact. Security of the evaluation dataset — a commercially
              valuable asset — against model distillation attacks or unauthorized scraping is an ongoing concern,
              particularly given that leading AI labs have financial incentives to study the evaluation distribution.
              Employee headcount of ~41 creates key-person concentration for a platform of this scale.
            claimRefs:
