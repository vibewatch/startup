      - number: '8.2'
        title: Valuation Analysis — Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              Revenue-multiple analysis: At $30M ARR and $1.7B valuation, the ARR multiple is 57x — placing LMArena in
              the top decile of late-stage AI infrastructure funding rounds. The comparable universe for AI evaluation
              infrastructure is thin: Weights and Biases was acquired by CoreWeave for $1.4 billion in March 2025 (a
              training/evaluation platform with broader tooling), Scale AI has been valued in the multi-billion range
              with revenues an order of magnitude larger. For early-stage pure-play AI benchmarking, no direct public
              comparables exist. The most relevant analogies are AI "picks and shovels" infrastructure: LMArena's
              position as a neutral data layer resembles how Bloomberg or S&P Global serves financial markets — a
              trusted data franchise with high switching costs. The AI model evaluation market was $1.86B in 2025 and is
              projected to reach $2.36B in 2026 and $6.24B by 2030 at 27.3% CAGR per The Business Research Company. If
              LMArena captures 5-10% of a $3B market by 2028, revenue of $150-300M at a 15-20x multiple implies a
              $2.25-6B valuation — the base-to-bull range for a public-comparable exit. Growth sustainability: reaching
              $30M in four months implies an implied growth rate of $7.5M per month. Sustaining even 50% of this adds
              $45M ARR in the next 12 months, reaching $75M ARR by end-2026. At a compressed 25x multiple (consistent
              with a maturing enterprise SaaS franchise), that implies a $1.875B valuation — roughly flat to current. At
              20x multiple (public SaaS median for high-growth), $75M ARR yields $1.5B. The current $1.7B valuation thus
              depends on either (a) sustaining rapid ARR growth, (b) maintaining the premium platform multiple, or (c)
              both. Scenario analysis below reveals the distribution of outcomes more explicitly.
