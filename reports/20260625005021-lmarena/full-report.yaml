  - id: TE003
    title: Technology and Operating Architecture
    columns:
      - Layer / Component
      - Role
      - Dependency / Implementation
      - Risk
    rows:
      - - Arena-Rank (ranking engine)
        - Computes BT coefficients, confidence intervals, style-controlled scores for all arenas
        - Open-source Python package (Apache 2.0); GitHub lmarena/arena-rank; PyPI arena-rank
        - Methodology open = reproducible but also replicable by rivals
      - - Bradley-Terry pairwise model
        - Core statistical model; infers latent skill from win/loss battles
        - Custom Python implementation; 30x speedup over FastChat baseline; closed-form CIs
        - Model assumptions (IID battles, no temporal drift) may degrade under heavy sampling manipulation
      - - Style-control extension
        - Separates substance from formatting effects in BT regression
        - Additive covariate regression; length, markdown headers, bold, list counts
        - Only four style covariates; richer semantic style not yet captured
      - - Causal tracing (Agent Arena)
        - Ranks agent components via multi-intervention RCT; measures net treatment effects
        - Custom statistical framework combining 5 behavioral signals
        - Novel methodology; causal identification assumptions unvalidated by third parties
      - - BenchBuilder / Arena-Hard pipeline
        - Auto-generates hard benchmark subsets from live Arena data using LLM-labeler
        - arXiv:2406.11939; GPT-4-based hardness scorer; 7 hardness criteria
        - Depends on GPT-4 for labeling; bias from labeler bleeds into benchmark quality
      - - Data sanitization (GCP Sensitive Data Protection API)
        - PII removal before public data release
        - Google Cloud Platform API; called pre-release of any shared dataset
        - Reliance on single cloud vendor; no independent PII audit published
      - - Web platform (arena.ai)
        - Hosts battles, voting UI, leaderboards, Direct Chat, Agent Mode, Code Arena
        - JavaScript front-end; server architecture not disclosed
        - Single point of failure for community trust; uptime SLA not public
      - - Cloudflare R2 + CodeMirror 6 (Code Arena)
        - Stores persistent code sessions; renders live web app previews
        - Cloudflare R2 for snapshots; CodeMirror 6 for code display; streaming frontend
        - Data residency and retention policy not disclosed
      - - FastChat (legacy)
        - Historical platform for serving and training; original Chatbot Arena backend
