  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: >-
          Competitive landscape: direct benchmarkers, automated leaderboards, data labelers, and build-it-yourself
          substitutes
        blocks:
          - type: paragraph
            body: >-
              LMArena operates in the AI model evaluation and benchmarking space, where no single competitor replicates
              its full stack. The addressable competitive set has four tiers. First, human-preference platforms: LMArena
              is the dominant public platform for crowdsourced pairwise model comparison; no comparable free alternative
              exists at anything close to its 5 million monthly user scale or 60 million monthly conversation volume as
              of January 2026. Second, automated academic leaderboards: the HuggingFace Open LLM Leaderboard (powered by
              EleutherAI lm-evaluation-harness), Stanford HELM, and BenchLM aggregate standardized benchmark scores such
              as MMLU, GPQA Diamond, and SWE-Bench across hundreds of models without human preference voting. These
              tools are free and open-source but measure task accuracy, not holistic user satisfaction. Third,
              enterprise evaluation vendors: Scale AI's GenAI Platform offers customized evaluation, fine-tuning, and
              data-labeling pipelines for enterprise and government clients at $93 K–$400 K+ per engagement; it does not
              host a public leaderboard. Fourth, status-quo substitutes: AI labs can build internal evaluation pipelines
              using EleutherAI's harness or OpenAI Evals and run their own test sets, avoiding third-party dependency
              entirely. Likely entrants include any major cloud provider building a benchmark surface to differentiate
              its model marketplace, or a large AI lab spinning up an in-house neutral evaluation arm. The meaningful
              competitive dimensions are human-preference scale, enterprise revenue potential, third-party independence,
              and methodology credibility.
            claimRefs:
