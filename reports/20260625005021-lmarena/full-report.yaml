      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several forces support above-market growth for trusted evaluation vendors. Global AI software and model
              spending are surging in 2026, enterprise AI has moved into production at a high share of large companies,
              and the shift toward agents increases the need for workflow-level evaluation rather than static prompt
              testing. Benchmark rivalry itself also stimulates demand, because model providers want external proof
              points and enterprises want independent quality signals. Yet the category also has real constraints.
              Benchmark gaming allegations, questions about crowdsourced-rater bias, and skepticism about public
              leaderboards all undermine willingness to pay for scores that are not clearly tied to production outcomes.
              Standalone vendors may also face pricing pressure from bundled cloud and MLOps tools, while limited public
              pricing disclosure makes it hard to separate durable software demand from novelty-driven experimentation.
