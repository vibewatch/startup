              LMArena's commercial model depends on a small set of large AI labs and enterprises for the majority of its
              $30M annualized revenue. With approximately 100 paying customers as of early 2026 and the top clients
              being OpenAI, Google, and xAI, revenue concentration is material: the loss of even one or two Tier-1 lab
              relationships could represent a disproportionate revenue decline. The same labs are simultaneously
              LMArena's best customers and its most motivated potential gaming adversaries, creating a tension with no
              clean resolution. The $1.7 billion valuation implies a ~57x revenue multiple on $30M ARR, pricing in
              substantial growth expectations that require maintaining trust, expanding into new domains, and upselling
              existing customers. At 41 employees, execution capacity is thin relative to the product surface area
              LMArena has already committed to (Agent Arena, WebDev Arena, Vision, Video, Search, Code, Document
              leaderboards plus commercial evaluations). The company's origins as a UC Berkeley research project mean
