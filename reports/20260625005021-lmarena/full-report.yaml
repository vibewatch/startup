  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              LMArena's customer base has two fundamentally different segments that must be distinguished carefully. The
              first is the free community, a global population of 5 million or more monthly users across 150+ countries
              who interact with the platform at no charge through arena.ai. These users submit prompts, vote on model
              outputs, and power the collective preference signal that underpins the leaderboards. This community spans
              developers, researchers, students, knowledge workers, and enthusiasts; per the two-year anniversary blog
              (April 2025), approximately 41% of battles involve open-source models, suggesting a technically
              sophisticated user base. The company generates no direct revenue from this segment but derives its core IP
              (preference data) and brand credibility from it. The second is the commercial customer segment, which
              consists of AI labs and enterprises that pay for the AI Evaluations service launched in September 2025.
              Named paying customers confirmed in the January 2026 Series A press release include OpenAI, Google, and
              xAI. Anthropic and Meta are major model providers on the leaderboard but their paying status as AI
              Evaluations subscribers is not separately confirmed in public disclosures; the TechCrunch 2026 article
              notes LMArena "partnered with" OpenAI, Google, and Anthropic for model submissions, a category that
              encompasses both commercial and non-commercial relationships. Enterprises (non-lab companies using AI
              Evaluations to benchmark models for their own applications) are a third stated target segment; no named
              enterprise non-lab customers have been publicly disclosed.
