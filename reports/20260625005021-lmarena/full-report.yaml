      - number: '6.5'
        title: 'Adverse Evidence: Conflicts, Gaming, and Concentration Risk'
        blocks:
          - type: paragraph
            body: >
              LMArena's customer and model-provider relationships create well-documented structural risks. First, the
              conflict of interest: the same AI labs (OpenAI, Google, Anthropic, and others) that pay for AI Evaluations
              and serve as commercial customers are also the entities whose models are ranked on the public leaderboard.
              This creates an inherent incentive for labs to optimize for Arena performance, which they can do via the
              pre-release testing protocol. The TechCrunch podcast episode directly raises this: "how a team like theirs
              can build a neutral benchmark when the companies they're ranking are also their backers." Second, the Meta
              Llama 4 Maverick incident (April 2025): Meta submitted a "chat-optimized experimental" version of Maverick
              to the arena that achieved a #2 ranking, but the publicly released model ranked approximately 32nd.
              LMArena updated its policy and stated "Meta's interpretation of our policy did not match what we expect
              from model providers." This incident shows that the commercial partnership structure (which depends on
              labs submitting models) creates practical pressure to accommodate behavior that damages leaderboard
              integrity. Third, the Cohere/Stanford/MIT/AI2 study (April 2025) alleged that Meta could privately test 27
              model variants between January and March 2025 before selecting the highest performer, that sampling rates
              were disproportionate for top labs, and that the study's preliminary findings were not disputed by LMArena
              when shared. LMArena denied the specific claims but announced a new sampling algorithm. These allegations
              have not been independently adjudicated. Fourth, customer concentration: with only three publicly named
              paying customers (OpenAI, Google, xAI), LMArena's commercial revenue is highly concentrated; if any of
              these labs develop or contract an alternative evaluation vendor, the impact on ARR could be significant.
