      - number: '1.4'
        title: Traction Metrics and Financial Indicators
        blocks:
          - type: paragraph
            body: >
              By January 2026, LMArena reported over 5 million monthly users across 150 countries and 60 million
              conversations per month. The community accumulated more than 50 million votes across text, vision, web
              development, search, video, and image modalities, and participated in evaluating more than 400 distinct AI
              models. LMArena also released 145,000 open-source battle data points from expert and occupational
              evaluation categories. On the financial side, the annualized consumption run rate — the company's ARR
              proxy — surpassed $30 million in December 2025, approximately four months after commercial launch. This is
              stated as an annualized run rate rather than realized GAAP revenue, and independently audited figures are
              unavailable. The rapid ramp from zero to $30 million annualized in four months is exceptional, but the
              structure of the commercial service (SLA-bound deliverables with community raters) implies potential labor
              cost constraints on gross margin that have not been disclosed. LMArena has not disclosed headcount, burn
              rate, or gross margin, which limits financial diligence from publicly available information alone.
              Deduplication filters remove approximately 10% of submitted votes, and identity-leak detection removes
              fewer than 4% of all votes as of July 2025 methodology updates, indicating active data quality management.
            claimRefs:
