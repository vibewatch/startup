  - id: FV003
    title: Valuation / Return Range — LMArena Entry at $1.7B
    type: range
    layout: standard
    summary: >
      Low/base/high 2028 exit valuation range with assumptions, illustrating return multiples for a $1.7B entry vs
      illustrative diluted entry.
    data:
      items:
        - label: Bear Case (credibility crisis)
          low: 200
          mid: 400
          high: 600
        - label: Base Case ($70M ARR, 25x exit)
          low: 1500
          mid: 1750
          high: 2100
        - label: Bull Case ($120M ARR, 40x exit)
          low: 3000
          mid: 4000
          high: 5000
    approximationNotes: >
      All figures in USD millions (2028 exit value). Bear case assumes credibility collapse and ARR churn to <$25M; base
      case assumes sustained growth and moderate multiple compression; bull case assumes breakout growth and premium
      platform multiple maintenance.
    claimRefs:
      - CV016
