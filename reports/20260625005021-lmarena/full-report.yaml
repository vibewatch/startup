        - Two or more peer-reviewed papers in a single quarter documenting systematic bias that LMArena does not rebut
        - 'Thesis break: exit or suspend evaluation; reopen only if methodology independently audited'
      - - Top-lab customer churn
        - Renewal of commercial evaluation agreements with OpenAI, Google, xAI
        - Any one of the top-3 labs publicly terminates or publicly disputes evaluation results
        - Monitor contract renewal dates; escalate if renewal in doubt
      - - Regulatory enforcement action
        - EU DPA inquiries, FTC requests for information, or state AG investigations disclosed
        - Any formal regulatory investigation opened against Arena Intelligence, Inc.
        - 'Thesis break: freeze new capital deployment pending legal resolution'
      - - Benchmark credibility abandonment by developer community
        - GitHub stars, HuggingFace leaderboard citations, and developer forum references to Arena methodology
        - Arena citation rate in model launch announcements drops >30% YoY
        - 'Thesis warning: investigate root cause and assess mitigation'
      - - Revenue concentration cliff
        - Share of ARR from top-3 customers disclosed in board materials
        - Single customer exceeds 40% of ARR and signals dissatisfaction
        - 'Thesis warning: diversification required before next funding round'
      - - Key-person departure
        - Public announcement or LinkedIn update from Angelopoulos or Chiang
        - Either founder departs within 24 months of Series A close
        - 'Thesis break: immediate hold pending succession clarity'
    notes: >
      Trigger thresholds are author-defined heuristics based on comparable early-stage AI infrastructure company
      diligence practice. All triggers are subject to context — a single negative event does not necessarily break the
      investment thesis in isolation.
