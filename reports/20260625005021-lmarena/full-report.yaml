  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Conflict of Interest and Benchmark Integrity Risk
        blocks:
          - type: paragraph
            body: >
              LMArena's cardinal risk is the structural conflict between its independent-arbiter identity and its
              revenue model. The company charges the same AI laboratories — OpenAI, Google, xAI — whose models appear on
              its public leaderboard for paid evaluation services. This dual role creates incentives, real or perceived,
              for preferential treatment. Academic researchers from Cohere, Stanford, MIT, and AI2 documented these
              dynamics in "The Leaderboard Illusion" (arXiv 2504.20879), finding that a handful of large providers could
              privately test multiple model variants, selectively disclose only their best scores, and receive
              disproportionately more evaluation battles. Meta's Llama 4 Maverick episode — in which Meta submitted a
              conversationality-optimized model to LMArena that it never publicly released, achieving a top-two ranking
              before the discrepancy was publicly exposed — demonstrated that policy gaps can allow benchmark gaming
              even without explicit rule violations. LMArena updated its policies in April 2026 but the fundamental
              tension between commercial dependency and perceived neutrality persists. Commentators including
              independent researcher Gwern have called the leaderboard "a cancer" and questioned whether its signal
              retains scientific value. The ucstrategies.com analysis found that models tuned specifically for Arena
              preferences can inflate scores by up to 100 Elo points, while SurgeAI analysis found evaluators disagreed
              with LMArena votes 52% of the time. If the credibility narrative fractures permanently — through a
              high-profile bias investigation, a paying-lab scandal, or a regulatory inquiry into AI benchmark accuracy
              claims — LMArena's entire product value proposition collapses simultaneously in both its consumer-facing
              leaderboard and its enterprise evaluation revenue.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
