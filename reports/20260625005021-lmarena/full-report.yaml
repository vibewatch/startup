companyProfile:
  summary: >-
    LMArena grew out of the UC Berkeley LMSYS / Chatbot Arena research effort launched in 2023 and commercialized as
    Arena Intelligence Inc. in April 2025. Its core product is a blind, pairwise human-preference evaluation platform
    where users compare anonymous AI model outputs, generating a public leaderboard and a proprietary stream of
    real-world preference data. The company monetizes through paid AI evaluation services for model labs, enterprises,
    and developers, including the AI Evaluations product launched in September 2025 with auditability, representative
    sample reporting, and service-level agreements. LMArena's traction is unusual: public materials cite 5M monthly
    users, 60M monthly conversations, 50M votes since the seed round, and a $30M annualized consumption run rate by
    December 2025. The same business also carries a structural tension because the most important customers and
    investors overlap with the labs whose models the platform evaluates.
