      - number: '7.2'
        title: Regulatory, Legal, and Data Privacy Risks
        blocks:
          - type: paragraph
            body: >
              LMArena operates under a complex and rapidly evolving regulatory environment. The legal entity, Arena
              Intelligence, Inc. d/b/a LMArena, processes personal data from 5 million monthly users across 150
              countries, triggering obligations under the EU General Data Protection Regulation (GDPR), the EU AI Act
              (general-purpose AI model obligations active since August 2025), the Digital Services Act (potentially
              VLOP thresholds at scale), and a patchwork of US state privacy laws including California's CPRA. LMArena's
              own privacy policy (effective September 2025) explicitly warns users that prompts and generated responses
              may be shared publicly, raising user-consent adequacy risks under GDPR Article 7. The right-to-erasure
              challenge for trained evaluation models (GDPR Article 17) is a known compliance gap across the AI industry
              with no settled enforcement interpretation. The EU AI Act's general-purpose AI documentation and
              transparency requirements impose additional operational overhead. LMArena's practice of sharing user
              prompts with AI providers for model improvement purposes creates data-flow obligations that must be
              covered by data processing agreements in each jurisdiction. The EU AI Act's definition of "high-risk" AI
              system has not explicitly named AI benchmarking platforms, but evaluations in regulated domains (law,
              medicine, employment) could attract sector-specific scrutiny. No litigation directly involving LMArena or
              Arena Intelligence, Inc. was found in public records as of the run date; however, the company has not
              disclosed its compliance attestation status or any regulatory inquiries. IP risk from user-submitted
              prompts used in training is an unsettled area of law across multiple jurisdictions.
            claimRefs:
