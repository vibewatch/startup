      - number: '3.3'
        title: Moat durability, switching costs, and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              LMArena's competitive durability rests on three factors: a crowdsourced preference dataset that is the
              largest of its kind, community trust reinforced by academic roots (UC Berkeley LMSYS Org, FastChat
              open-source infrastructure), and deep citation network effects — frontier labs cite Arena rankings in
              marketing materials and investor communications, raising the cost of defection. Switching costs for AI
              labs are real: if Arena ceases to be the market's signal, their existing benchmark investments lose
              marketing value. This creates a mutual dependency between LMArena and its client labs that provides
              revenue stability but also structural independence risk.


              The adverse evidence on moat is credible and material. The 2025 Leaderboard Illusion paper by Singh et al.
              (Cohere, Stanford, MIT, Ai2) quantifies data access asymmetry: Google and OpenAI received an estimated
              19.2 % and 20.4 % of total Arena data respectively, while 83 combined open-weight models received only
              29.7 %. Meta tested 27 private model variants before the Llama 4 release, selecting only the top scorer,
              which TechCrunch confirmed then ranked 32nd once the vanilla Maverick was re-submitted. LMArena denied the
              characterization of bias but committed to algorithm changes, signaling the critique had operational merit.
              A second adverse dynamic is Goodhart's Law: as Arena rankings drive procurement decisions, labs will
              optimize for Arena-specific patterns, degrading the signal quality and increasing the likelihood a
              well-resourced competitor can credibly claim superior methodology.


              The Elo algorithm underlying Arena is open-source and replicable by any well-funded team. What is not
              easily replicated is the community. Scale AI has a larger enterprise footprint and deeper data-labeling
              expertise, but has not built a public preference leaderboard. The real displacement threat is internal
              build: an AI lab that decides Arena's conflict-of-interest problem is unsolvable could fund a competing
              neutral body. The free academic tools (HELM, HuggingFace) already serve that credibility function for
              research use cases, keeping a ceiling on how much LMArena can claim scientific neutrality.
