      - - Revenue trajectory
        - $30M ARR in 4 months from $0 is exceptional; indicates strong product-market fit in AI evaluation
        - Revenue concentrated in ~100 customers; top-3 labs likely represent majority; any churn is disproportionate
        - Customer cohort data shows <20% concentration in top 3 and NRR >110%
      - - Valuation support
