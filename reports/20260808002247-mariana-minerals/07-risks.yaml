company:
  name: Mariana Minerals
chapter:
  number: 7
  title: Risks
  summary: 'Mariana’s top risks are execution and capital intensity rather than a lack of narrative relevance. The company is attempting to restart and optimize a copper asset, commercialize a produced-water lithium facility, and stand up an autonomy-heavy software layer at the same time. That creates a stacked risk profile: regulatory and permitting exposure around mining, water, and industrial safety; operational risk in scaling first-of-kind or under-proven processes; partner dependency on Select Water and Pronto; financial risk from opaque burn and large future capital needs; and people risk from the need to hire and retain rare controls, ML, metallurgical, and site-operations talent. Public evidence does not show a thesis-breaking event today, but it also does not show the mitigation maturity one would want before underwriting with high confidence. The correct framing is high risk with identifiable mitigants, not unbounded risk.'
sections:
- id: regulatory-legal
  title: Regulatory and legal risk
  body: Mariana’s regulatory exposure spans mine operations, refining, water handling, and any industrial autonomy deployment layered on top. Lithium One’s produced-water model sits in a water-and-oilfield regulatory context where EPA Class II injection-well rules, state-level water and disposal regimes, and environmental permitting all matter. Copper One and any future mine expansion sit within federal and state mining-law frameworks and mine-safety oversight. These exposures are manageable in principle, but they are non-trivial because Mariana is trying to accelerate timelines in sectors where permits, environmental controls, and operating rules can create delays or cost inflation. The public record does not surface litigation or enforcement against Mariana, which is good, but it also does not provide a permit matrix, incident history, or an environmental and safety compliance dashboard. Mariana’s posted privacy policy helps only at the web-governance layer; it does not answer the more
    important industrial legal questions around site safety, environmental obligations, or operational assurance.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-technical
  title: Operational, technical, and quality risk
  body: 'Operationally, Mariana is doing several difficult things at once. Copper One requires continuous mine-and-refinery coordination, feedstock variability management, and a credible path from restart narrative to materially higher output. Lithium One requires scaling a produced-water lithium process into dependable commercial output in a market where even focused peers still face engineering and financing gates. Mariana’s software and autonomy claims increase upside but also create failure modes: bad instrumentation, model drift, weak human override design, or poor partner integration can harm throughput, quality, or safety. Public sources describe simulation, predictive maintenance, reinforcement learning, and control loops, which is specific enough to take seriously but not specific enough to verify independently. The core operational risk is therefore not that the company lacks a plan; it is that the plan touches many tightly coupled systems with limited public KPI proof.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
