- id: partner-dependency
  title: Partner and dependency risk
  body: 'Mariana’s model depends on more counterparties than a simple “own the asset” story implies. Select Water is strategically important to Lithium One’s infrastructure logic, and Pronto is important to the autonomy deployment story at Copper One. Strategic investors may help with future financing or commercial introductions, but they can also create expectation risk if milestones slip. End-customer dependence is likely to be concentrated when it eventually becomes visible: a small number of anchor offtakes could dominate revenue, making counterparties powerful. The good news is that the current partner set looks credible and industrially relevant. The bad news is that concentrated, high-value partners can become chokepoints. Public evidence does not disclose substitution options, termination terms, or fallback plans if a key counterparty changes strategic direction. That makes dependency risk material even before any obvious counterparty stress appears.'
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-model
  title: Financial and model risk
  body: 'Financial risk remains high because public visibility into burn, cash, debt, and project-finance strategy is low while capital needs are plainly large. The company has raised meaningful capital, but it is advancing two industrial projects plus a software-and-automation build. That combination is expensive even when milestones are met; it becomes much more expensive if schedule slips or qualification takes longer than planned. Commodity exposure adds another layer. Copper and lithium markets may be strategically attractive, but they are still volatile and cyclic. Mariana’s story also relies on autonomy and software improving economics, yet public evidence does not show the size or durability of that uplift. Financial-model risk therefore includes both classic capex risk and a subtler proof-risk: if the software benefit is smaller than hoped, Mariana could end up looking like a capital-hungry miner with a thinner moat than the current valuation assumes.'
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  tableRefs:
  - TR004
- id: people-mitigation-and-kill-criteria
  title: People risk, mitigations, and thesis-break triggers
  body: 'People risk is visible in the hiring pattern. Mariana is recruiting across machine learning, process controls, mechatronics, metallurgy, drilling automation, pilot-plant operations, and site execution. That breadth supports the ambition of the model, but it also shows the company still depends on assembling and retaining a rare multidisciplinary team. Mitigants exist: strategic capital access, brownfield copper positioning, credible partners, and a mission aligned with industrial policy. Still, the most important monitors are straightforward. If Lithium One fails to translate dialogue into binding commercial contracts, if Copper One cannot show measurable operating improvement from the software stack, if regulatory or safety issues delay execution, or if additional financing arrives on punitive terms, the thesis weakens quickly. Mariana’s risk posture is therefore investable only for backers willing to monitor milestones closely and revise views as evidence arrives.'
