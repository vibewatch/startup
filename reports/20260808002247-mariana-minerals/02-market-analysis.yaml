    - Refined copper cathode purchased by mills, fabricators, traders, and industrial users
    - Exploration software spend; upstream ore value before refining
    - Rod mills, brass mills, cable/fabrication buyers, traders
    - Copper One sells into this physical market
  - - U.S. battery-grade lithium chemicals market
    - Lithium carbonate / hydroxide procurement for battery and materials chains
    - Generic mining tech budgets; EV retail spend
    - Cathode makers, traders, OEM procurement teams, intermediaries
    - Lithium One’s first product is planned as battery-grade lithium salts
  - - Domestic supply-chain resilience premium
    - Procurement decisions that value U.S. origin, qualification, and reduced China exposure
    - Pure spot arbitrage with no sourcing constraints
    - Industrial buyers, policy-supported programs, strategic offtakers
    - Could support Mariana pricing or contract access if supply is credible
  - - Status-quo substitutes
    - Imported refined copper, imported lithium chemicals, conventional miners/refiners, exported scrap for foreign processing
    - Internal enterprise software build budgets
    - Incumbent commodity producers and traders
    - Mariana must beat or complement these default channels
  notes: The relevant market boundary is physical metals and chemicals supply, not mining-software SaaS. Mariana’s AI matters only insofar as it changes cost, reliability, or speed in these product markets.
