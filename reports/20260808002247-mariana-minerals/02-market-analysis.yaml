company:
  name: Mariana Minerals
chapter:
  number: 2
  title: Market Analysis
  summary: 'Mariana is not selling mine software into a greenfield category; it is competing inside two large, strategically stressed physical markets: U.S. refined copper and battery-grade lithium chemicals. The top-down opportunity is large because U.S. copper imports and lithium import reliance remain high while electrification, grid buildout, and AI infrastructure expand demand, but Mariana’s near-term attainable market is much narrower because Copper One and Lithium One are asset-specific supply projects that must clear permitting, commissioning, and product-qualification hurdles. The most important market insight is that domestic critical-minerals supply carries a resilience premium, but only if Mariana can deliver reliable volumes faster and at lower cost than incumbents or other U.S. developers.'
sections:
- id: market-boundary-and-status-quo
  title: Market Boundary, Included Spend, and Status-Quo Alternatives
  body: Mariana’s market is best defined as domestic supply of refined copper and battery-grade lithium chemicals rather than “AI for mining.” Copper One is aimed at selling refined copper cathode into U.S. industrial demand, while Lithium One is designed to sell battery-grade lithium salts produced from oil-and-gas wastewater. That means the relevant spend pools are metal and chemical procurement budgets, not enterprise software budgets. The status quo is not another startup dashboard; it is imported refined copper, imported lithium carbonate or hydroxide, conventional mining/refining capacity operated by large incumbents, and in some cases export of U.S. raw or scrap material for foreign processing. This boundary matters because Mariana’s economic proposition depends on delivering physical units with schedule, quality, and cost credibility. The company’s software can only monetize if it changes project economics or supply reliability enough to win real commodity offtake. In practice, Mariana
    is trying to insert itself into a market where buyers care about price, impurity profile, domestic-source resilience, and continuity of supply more than they care about software novelty.
  claimRefs:
