- id: drivers-and-constraints
  title: Growth Drivers, Adoption Constraints, and Timing Frictions
  body: 'Demand-side support for Mariana’s markets is real. IEA analysis shows copper demand rising as cleantech, grids, and broader electrification grow, while strategic-minerals policy is increasingly shaped by resilience concerns and Chinese refining concentration. Mariana’s own domestic-supply thesis therefore sits on a real macro foundation. But the supply side is brutal. IEA still expects copper and lithium deficits through 2035, yet Dallas Fed, Carnegie, CFR, EY, and sector reporting all underline the same constraint set: capital intensity, slow permitting, technical scale-up risk, upstream-to-midstream bottlenecks, and workforce shortages. Mining Technology’s 2025-to-2026 outlook adds that autonomy adoption is spreading but still early, with just over 4% of mining equipment autonomous or autonomous-ready and only a few thousand autonomous haul trucks installed globally. That makes Mariana directionally well-positioned if autonomy lowers cost and schedule, but it does not make the
    go-to-market easy. The company is competing in markets that are attractive precisely because they are difficult to enter.'
