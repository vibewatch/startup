- id: market-judgment-and-gaps
  title: Market Judgment and Remaining Sizing Gaps
  body: The market takeaway is that Mariana’s addressable opportunity is economically large but operationally narrow in the near term. Copper and lithium both benefit from structural demand, domestic-sourcing policy interest, and refining bottlenecks that should reward reliable U.S. production. At the same time, Mariana’s lithium SOM is tiny relative to the national buildout problem, and its copper target should be viewed as a site-level expansion plan rather than a solution to U.S. import dependence. The company does appear to be aiming at the right choke points — refined units, not just upstream resource claims — and that is important because midstream value capture is where many Western supply chains remain weak. The unresolved market questions are whether buyers will pay a domestic resilience premium, whether Mariana can qualify product quickly enough, and whether its software actually reduces cost and ramp time enough to offset the structural disadvantages of new U.S. supply projects.
  claimRefs:
  - CM035
  - CM036
  - CM037
  - CM038
