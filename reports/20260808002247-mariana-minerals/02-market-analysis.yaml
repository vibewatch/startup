callouts:
- calloutType: insight
  title: The market is large because the bottleneck is physical supply, not software adoption
  body: Mariana’s addressable value comes from producing scarce refined units inside constrained supply chains. If Copper One and Lithium One work, the software matters because it makes tonnes cheaper and faster, not because buyers separately pay for software seats.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM031
- calloutType: risk
  title: Lithium One is a strategic wedge, not a scale solution by itself
  body: A 3,000 tpa lithium-salts target can still matter commercially, but it is small relative to both the U.S. project pipeline and peer DLE ambitions. The investment case requires replication and qualification, not just a first-site startup.
  claimRefs:
  - CM015
  - CM016
  - CM020
  - CM038
