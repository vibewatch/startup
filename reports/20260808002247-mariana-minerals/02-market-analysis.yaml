- id: buyers-users-and-adoption
  title: Buyer / User / Payer Segmentation and Adoption Path
  body: 'The buyer map differs sharply between copper and lithium. Refined copper is ultimately consumed across construction, electrical/electronics, transport, and industrial machinery, but Mariana’s direct commercial interface is more likely to be traders, rod mills, brass mills, cable producers, and other industrial fabricators. On lithium, the direct commercial target is not the end EV buyer but cathode producers, battery-material traders, OEM procurement teams, and intermediaries that can absorb lithium carbonate into broader battery-material supply chains. Fastmarkets reports that Mariana intends to emphasize lithium carbonate first because it is more fungible across chemistries and that the company is negotiating long-term offtakes with OEMs and intermediaries. That is strategically sensible: a young producer needs flexible channels more than a single locked-in process path. The adoption path for both products still runs through qualification, reliability proof, logistics, and domestic-sourcing
    credibility. In other words, the market will not reward autonomy narratives on their own; it will reward on-spec tonnes delivered on time.'
