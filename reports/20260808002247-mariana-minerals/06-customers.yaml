company:
  name: Mariana Minerals
chapter:
  number: 6
  title: Customers
  summary: 'Mariana has not yet disclosed a conventional customer roster; the public evidence base is instead built from partner deployments, buyer-intent signals, and operational proof sites. The most credible external proof today is not volume customer adoption but counterparties willing to put real infrastructure or autonomy systems around Mariana’s projects: Select Water at Lithium One and Pronto at Copper One. On the demand side, Fastmarkets reports ongoing negotiation with OEMs and intermediaries and says management expects most Lithium One output to move under long-term offtake structures, but no named buyer is public. This means customer quality is currently stronger as strategic intent than as disclosed contracted revenue. The core customer risk is concentration: when customer proof does emerge, it is likely to be a handful of large industrial counterparties with long qualification cycles. The chapter conclusion is that Mariana has credible early commercial engagement signals, but
    public customer adoption and retention evidence remains thin.'
sections:
- id: segmentation
  title: Who the customers, users, and payers probably are
  body: 'Mariana’s customer map is atypical because the company sits between industrial software and physical commodity supply. The external payers that matter economically are likely copper buyers, battery and cathode supply-chain participants, OEMs, and intermediaries able to take lithium product under long-term or spot contracts. The day-to-day users of MarianaOS are internal operators, engineers, and process teams at Copper One and Lithium One rather than outside enterprise-software users. In the current public record, investors remain the near-term economic payers for the buildout while end customers are still mostly future contracted buyers. This means the segmentation problem has to separate buyer, user, payer, and proof source. Mariana also has a strategic-counterparty layer that is not the same as end demand but still matters to commercialization: Select Water provides infrastructure validation for Lithium One, and Pronto provides deployment validation for autonomy at Copper One.
    Public evidence therefore supports a tiered segmentation: future commodity buyers, current operating users, enabling commercial partners, and strategic capital providers who may open doors but do not themselves prove recurring product demand.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
- id: adoption-trajectory
  title: Adoption trajectory and what counts as proof today
  body: 'Because Mariana has not published customer counts or active revenue, the best public adoption markers are milestone-based rather than volume-based. Copper One shows real-world operating deployment: Mariana publicly describes an operating mine and refinery where MineOS, PlantOS, and Pronto-enabled autonomy are being pushed into production settings. Lithium One shows infrastructure commitment: Mariana and Select Water broke ground on a commercial produced-water lithium extraction facility, which is stronger than a slideware announcement even if buyer contracts remain undisclosed. Fastmarkets adds the clearest direct buyer signal by reporting Mariana is in discussions with OEMs and intermediaries and expects a majority of output to sit under long-term offtake structures. None of these facts amount to repeat-purchase, NRR, or account-scale evidence. They do, however, show the company is moving from pure story to counterparties willing to allocate equipment, infrastructure, and negotiation
    effort around the projects. Public adoption should therefore be called early and strategically meaningful, but not yet broad or contractually mature.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU001
  - FU002
- id: named-proof-and-quality
  title: 'Named proof: what counterparties actually confirm'
  body: 'The best named proof in the public record comes from counterparties rather than from end customers. Select Water’s own investor-relations site confirms the Lithium One groundbreaking and frames the facility as a commercial produced-water lithium extraction project in Texas. TechCrunch and Pronto confirm that Mariana is using Pronto to automate haul trucks and drill rigs at Copper One, while Pronto’s own materials describe the capability stack and mine-operator orientation of the system. These are meaningful proof points because they show external organizations are committing to Mariana’s operating model. But they are not the same as disclosed product buyers or long-term offtake customers. The strongest missing proof is a named copper off-taker or named lithium buyer. Strategic investors such as Khosla, a16z, Mitsubishi, and BHP Ventures provide credibility and potential channel adjacency, yet investor presence cannot be counted as customer adoption. The right evidence-quality ranking
    is therefore: named operating or infrastructure counterparty proof is real; named end-buyer proof is still mostly absent.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  tableRefs:
  - TU003
  - TU004
  figureRefs:
  - FU003
- id: retention-and-expansion
  title: Retention, repeat usage, expansion, and concentration risk
  body: 'There is no public retention dataset for Mariana. No NRR, GRR, renewal, churn, cohort, or satisfaction metric is disclosed, which is unsurprising for a still-ramping industrial platform. The most useful proxy for retention today is continued partner commitment and milestone progression: Select Water’s broader 2026 disclosures show it continues to invest in water infrastructure and won new contract work, while Pronto continues marketing mining autonomy as an active operating business. These facts do not prove Mariana-specific renewals, but they do reduce the risk that the counterparties are ephemeral. Expansion logic is plausible: if Copper One proves low-cost, autonomy-enabled production, Mariana can add more buyers or more sites; if Lithium One reaches commercial production with a long-term offtake base, buyer expansion could follow. Concentration risk remains high. Initial commercial success will likely depend on a small number of large industrial counterparties whose procurement
    cycles are long and whose bargaining power is significant. The most realistic customer outcome over the next phase is not a diversified customer count but a narrow set of high-value contracts.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  tableRefs:
  - TU005
  - TU006
- id: customer-verdict
  title: Customer verdict and diligence blockers
  body: 'The public record suggests Mariana is past the point of being a purely conceptual customer story, but it is not yet at the point of proven customer durability. There is credible operating proof through Copper One, credible infrastructure proof through Select Water, and credible buyer-intent signals via Lithium One offtake discussions. What is missing are the fields most investors care about for commercial confidence: named buyers, signed offtake contracts, repeat purchase behavior, concentration disclosure, and satisfaction or retention evidence. Mariana’s customer risk is therefore not lack of market need but lack of disclosed commercial closure. The most important diligence asks are simple: name the buyers, show the contract terms, quantify qualification progress, and separate operating partners from actual customers. Until then Mariana should be treated as pre-broad-adoption with strategically meaningful but still incomplete customer proof.'
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
