companyProfile:
  summary: >-
    Mariana Minerals was founded in San Francisco to rebuild domestic critical-minerals capacity through a
    combined software-and-operations model. CEO Turner Caldwell, a former Tesla operator, has framed the
    company around MarianaOS — CapitalProjectOS for capital delivery, MineOS for mine operations, and PlantOS
    for refinery management. Mariana's flagship projects are Copper One in Utah, where the company is pushing
    autonomy and plant optimization at a restarted copper asset, and Lithium One in Texas, where it is scaling
    a produced-water lithium facility with Select Water. As of August 2026 the company has raised about
    $400 million including a $310 million Series B at a $1.5 billion post-money valuation led by Khosla
    Ventures, with investors including a16z, Breakthrough Energy Ventures, BHP Ventures, Mitsubishi, and
    In-Q-Tel.
