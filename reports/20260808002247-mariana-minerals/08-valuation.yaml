- id: recommendation
  title: Recommendation, confidence, and valuation stance
  body: 'Recommendation: Research More / Wait at current price. Confidence: Medium. Risk rating: High. Valuation stance: Full to rich on disclosed evidence. This is a price-sensitive call, not a dismissal of the company. Mariana could absolutely grow into or beyond the current mark if Copper One produces measurable operating gains, if Lithium One signs bankable contracts and hits the 2027 timeline, and if financing remains available on reasonable terms. But public evidence today does not justify high-conviction underwriting at $1.5B. Existing insiders or strategic investors may rationally hold because they likely have access to private operating data and because the optionality is real. A new investor without privileged diligence should treat the current price as demanding relative to disclosed proof. The most likely near-term improvement in the call would come from signed offtakes, site-level KPI disclosure, or a financing structure that shows scale-up is fundable without punitive dilution.'
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
