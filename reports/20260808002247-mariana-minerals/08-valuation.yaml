- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No bankable customer closure
    - No convincing buyer or offtake proof as 2027 lithium target nears
    - Undercuts commercialization and financing case
    - Move from wait to negative stance
  - - No measured Copper One uplift
    - No credible KPI evidence from software/autonomy rollout
    - Software premium compresses
    - Remove technology multiple from model
  - - Punitive financing
    - Next financing implies sharp down-round risk or poor terms
    - Signals valuation and capital-plan weakness
    - Reset fair-value range lower
  - - Regulatory / safety disruption
    - Material permit, safety, or environmental event
    - Hits credibility and schedule simultaneously
    - Escalate to thesis-break review
  - - Key partner stress
    - Select Water or Pronto scope narrows materially
    - Raises dependency and execution risk
    - Reassess milestone assumptions
  notes: These are the main events that would change the recommendation faster than gradual narrative drift.
