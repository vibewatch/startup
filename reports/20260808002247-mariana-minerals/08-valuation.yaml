company:
  name: Mariana Minerals
chapter:
  number: 8
  title: Valuation
  summary: 'Mariana’s August 2026 Series B at a $1.5 billion post-money valuation prices in meaningful success before public proof is complete. The market, product, and strategic-supply-chain narratives are strong enough to justify real venture interest, but the public evidence base is still missing the core fields that normally support a premium industrial-tech mark: current revenue, signed customer contracts, site-level unit economics, and a visible project-finance path. Relative to public lithium developers such as Standard Lithium (~$0.58B market cap) and Lithium Americas (~$1.13B market cap), Mariana already sits above more disclosed but still risky resource companies. Relative to large-scale established materials or royalty companies, Mariana is obviously earlier and less de-risked. The right call at the current public price anchor is not an outright bear view on the company; it is a price-sensitive “research more / wait” stance. Upside remains meaningful if Copper One proves autonomy-led
    economics and Lithium One lands bankable offtakes, but current evidence does not yet support paying up aggressively at $1.5B.'
sections:
- id: thesis-antithesis
  title: Investment thesis and anti-thesis
  body: 'The bull thesis is coherent. Mariana sits in a strategically important market, owns or controls real asset proof points, and has a differentiated software-plus-operations story that is more concrete than many industrial-AI startups. Copper One gives it a public operating site, Lithium One gives it a high-upside domestic lithium wedge, and the investor base suggests the company has attracted serious conviction. The anti-thesis is equally clear: almost every underwriting-critical field remains private. The public record does not show revenue, margins, signed end-buyer contracts, burn, or an auditable capital plan. That means the current valuation rests more on a forward option value than on de-risked operating performance. Mariana may deserve a premium to a purely conceptual software company or a pre-asset slideware startup, but it does not yet deserve to be treated like a proven industrial operator. The key valuation question is therefore not whether the story is interesting; it
    is whether $1.5B already discounts too much of the future proof curve.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV002
  figureRefs:
