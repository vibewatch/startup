chapter:
  number: 3
  title: Competitors
  summary: Mariana competes less with generic mine-tech vendors than with a mixed set of AI-native explorers, domestic lithium developers, downstream critical-material platforms, and incumbent miners. KoBold Metals is the clearest private “AI + critical minerals” peer, but it is much larger-scale and more exploration/development oriented; Lilac Solutions and Standard Lithium are stronger disclosed commercial benchmarks for lithium readiness; Redwood Materials is a powerful downstream substitute for domestic-materials relevance but not a direct mine-operator analog. Mariana’s main differentiator is the combination of brownfield copper restart, produced-water lithium, and an internal autonomy stack, but that edge is still narrative-heavy because public offtake and economics validation trail some peers.
sections:
- id: landscape-and-classes
  title: 'Landscape: direct peers, adjacents, incumbents, and substitutes'
  body: 'Mariana’s competitive set spans several classes that solve adjacent slices of the same supply-chain problem. The direct peer bucket includes AI-native or software-forward critical-mineral developers such as KoBold Metals and, on the lithium side, project-backed DLE companies such as Standard Lithium, Lilac Solutions, and EnergyX. Adjacent competitors include downstream platforms like Redwood Materials that do not mine ore or produced water directly but still compete for strategic relevance, customer attention, and industrial-policy capital by supplying domestic critical materials. The incumbent bucket includes established miners and refiners with existing offtake relationships, large balance sheets, and operational depth. The status quo substitute remains imported copper and lithium chemicals processed outside the United States. This matters because Mariana is trying to beat both a technology field and an industrial field at once: it must look more agile than incumbents while also
    looking more commercially real than technology-led peers.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
