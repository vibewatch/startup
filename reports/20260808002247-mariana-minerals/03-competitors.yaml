callouts:
- calloutType: strength
  title: Mariana’s direct differentiation is operating-model breadth
  body: No reviewed peer combines an owned copper restart, a produced-water lithium project, and an explicitly named three-layer autonomy stack in the same way. That breadth is strategically interesting even if it is not yet commercially proven.
  claimRefs:
  - CP013
  - CP014
  - CP021
- calloutType: risk
  title: Lithium peers disclose stronger customer readiness today
  body: Standard Lithium and Lilac have publicly named offtake counterparties and clearer construction pathways. Until Mariana discloses comparable evidence, investors should assume a commercial-readiness gap despite the broader platform story.
