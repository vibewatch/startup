- id: moat-durability-and-risks
  title: Moat durability, switching cost, and displacement risk
  body: 'Mariana’s moat claim rests on three linked ideas: first, software-first execution can restart or build mineral assets faster; second, learning compounds across copper and lithium operations; third, domestic supply-chain urgency creates room for a new entrant. Those are plausible but still contestable. KoBold’s science and capital base could dominate the AI narrative in mining. Lilac and Standard Lithium have already disclosed stronger commercial-readiness signals in lithium. Redwood can capture domestic-supply-chain mindshare without taking greenfield mining risk. Incumbent miners and processors still own the deepest customer relationships, operating teams, and balance sheets. The practical switching cost for customers is also lower than software markets because copper cathode and lithium carbonate are specification-driven commodity-like products once qualified. That means Mariana’s software moat matters only if it lowers cost, improves reliability, or accelerates delivery faster
    than peers can imitate. The threat is not just one direct rival; it is a field of better-capitalized companies proving adjacent parts of the stack sooner.'
