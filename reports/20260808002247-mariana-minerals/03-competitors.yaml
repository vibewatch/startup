- id: competitive-judgment-and-gaps
  title: Competitive judgment and remaining gaps
  body: The competitive picture suggests Mariana is well positioned conceptually but not yet first in disclosed commercial proof. Its direct differentiation against KoBold is brownfield restart and refining control instead of pure discovery/development. Its differentiation against DLE peers is operating-model breadth across copper and lithium rather than lithium-only extraction. Its weakness is that those distinctions remain more narrative than bankable customer evidence in public materials. The most valuable unanswered questions are whether Copper One’s autonomy deployment produces measurable cost/throughput gains, whether Lithium One closes binding offtake and qualification milestones, and whether the company can keep raising capital without losing discipline to better-evidenced peers. For now Mariana looks competitively interesting, but not yet competitively settled.
