- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Mariana solution
  - Measurable benefit
  - Limitation
  rows:
  - - Deliver capital projects
    - Fragmented project data across planning and execution
    - CapitalProjectOS as project lifecycle system
    - Potential faster delivery and coordination
    - No public benchmarked time or cost savings
  - - Run mine fleet and daily operations
    - Thousands of interdependent daily decisions with scarce skilled labor
    - MineOS orchestration and autonomy integration
    - Potential utilization, labor, and safety gains
    - No audited fleet KPI disclosure
  - - Optimize copper refining
    - Variable feedstock and complex leach / SX-EW control loops
    - PlantOS with simulation, predictive maintenance, and control models
    - Potential higher recovery and lower refining cost
    - No public process-control outcome data
  - - Deploy haulage autonomy
    - Manual or semi-manual haulage in rugged environments
    - Pronto autonomy stack integrated at Copper One
    - Potential lower incidents, fuel, and downtime
    - Partner dependency and site-integration risk
  - - Scale produced-water lithium process
    - Sparse Western process know-how and scarce talent
    - Lithium One + MarianaOS + process development hiring
    - Potential faster path to commercial buildout
    - Commercial chemistry validation still undisclosed
  notes: Benefits are directionally supported, but public evidence for realized deltas remains limited.
