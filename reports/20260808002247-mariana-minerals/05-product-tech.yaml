- id: architecture-and-dependencies
  title: Architecture, autonomy, and critical dependencies
  body: 'The public architecture is directional rather than fully specified, but it is detailed enough to infer the main layers. Mariana says MarianaOS uses simulation, predictive maintenance, and reinforcement learning to improve mine and refinery workflows. The Series B announcement adds a more explicit control-loop description for PlantOS and says lab-scale experiments and kinetic models connect to a world model that exchanges control signals and sensor feedback with the plant. At Copper One, TechCrunch says Mariana tapped Pronto to help automate haul trucks and drill rigs. Pronto’s own materials describe a turnkey autonomy stack using computer vision, GNSS, rugged camera/GPS hardware, machine-learning object detection, a retrofit drive-by-wire kit, and site-specific safety rules with little infrastructure modification. This indicates Mariana’s architecture depends not only on internal software but also on specialized autonomy partners, sensors, skilled site personnel, and robust process-control
    engineering. The dependency chain is wide: failure in safety systems, partner integration, plant instrumentation, or data quality can all weaken the stack.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
