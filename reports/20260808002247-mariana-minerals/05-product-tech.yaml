company:
  name: Mariana Minerals
chapter:
  number: 5
  title: Product & Technology
  summary: 'Mariana’s “product” is best understood as an integrated operating system for critical-minerals assets rather than a standalone enterprise-software SKU. Public materials define three software layers—CapitalProjectOS, MineOS, and PlantOS—wrapped around owned or controlled industrial assets including Copper One and Lithium One. The strongest evidence of technical ambition is the specificity of the operating model: simulation, predictive maintenance, reinforcement learning, autonomous control loops, and deep hiring across machine learning, process controls, mechatronics, metallurgy, and pilot-plant operations. The clearest third-party proof of field deployment is the Pronto partnership for autonomous haulage at Copper One. The weakest part of the record is not imagination but verification: public sources do not provide audited throughput uplifts, named compliance certifications, detailed architecture diagrams, or third-party reliability benchmarks. The technology case is therefore
    credible and unusually concrete for a private mining startup, but still only partially validated.'
sections:
- id: product-definition
  title: What Mariana actually delivers
  body: 'Mariana does not appear to sell generic mining software into a broad external customer base. Instead, its public materials frame the company as an owner-operator of critical-minerals assets whose proprietary operating system improves how projects are built, mines are run, and refining plants are controlled. The named software layers are CapitalProjectOS for capital delivery, MineOS for mine operations, and PlantOS for refinery management. These are paired with physical assets: Copper One in Utah and Lithium One in Texas. In practical workflow terms, Mariana is selling future copper and lithium output produced from a tighter human-machine operating loop, not simply code. This distinction is important because the product’s utility must be judged by safety, throughput, recovery, cost, and deployment speed—not by seats, APIs, or UI polish alone. Public sources suggest the company sees software and industrial execution as inseparable.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  tableRefs: []
  figureRefs: []
- id: module-asset-map
  title: Module, asset, and workflow map
  body: 'The module map visible from public sources is richer than the homepage alone suggests. CapitalProjectOS is described as a single source of truth across planning, engineering, procurement, cost control, scheduling, and construction management. MineOS monitors and orchestrates decisions across geology, fleet, haulage, maintenance, and workforce coordination. PlantOS is oriented toward refining performance, including control of heap bioleaching, solvent extraction, electrowinning, and lithium process steps. Copper One functions as the main public proof site for combined software-and-operations claims, while Lithium One extends the stack into produced-water lithium extraction and process development. The careers surface reinforces the same picture: Mariana is staffing software development, process development, mining operations, plant-and-process engineering, and site roles in parallel. This is not a thin software overlay on someone else’s mine; it is a full-stack industrial operating
    model.'
  claimRefs:
