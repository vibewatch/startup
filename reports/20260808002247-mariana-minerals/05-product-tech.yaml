    - Ties operational decisions to data and automation across mine workflows
    - Need measured utilization, safety, and throughput uplift
  - - PlantOS
    - Metallurgy and plant-operations teams
    - Publicly named; control-loop description disclosed
    - Targets refining and process-control optimization with model-driven control
    - Need plant KPI and independent validation
  - - Copper One
    - Internal operating team; eventual copper buyers indirectly served
    - Most mature operating proof site in public record
    - Real asset proving software in production-like conditions
    - Need current throughput, recovery, and autonomy penetration
  - - Lithium One
    - Process-development and commercial team; eventual lithium buyers indirectly served
    - Pre-commercial / scale-up toward 2027
    - Extends stack into produced-water lithium and refinery control
    - Need pilot and quality data plus qualification milestones
  - - Process development / pilot platform
    - R&D, metallurgy, and pilot-plant staff
    - Implied active via hiring
    - Bridges design assumptions to commercial execution
    - Need actual pilot results and transfer-to-plant metrics
