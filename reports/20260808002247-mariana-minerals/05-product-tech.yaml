    severity: material
    topic: architecture-spec
    missingEvidence: A detailed system architecture for MarianaOS including control interfaces, partner boundaries, and safety interlocks.
    whyItMatters: Without this, investors cannot separate proprietary core logic from partner-supplied capabilities.
    diligencePath: Request technical architecture deck and component ownership map.
