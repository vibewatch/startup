- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - CapitalProjectOS data layer
    - Project coordination and execution visibility
    - Internal data discipline and engineering adoption
    - Weak input quality undermines planning value
  - - MineOS orchestration layer
    - Mine decision support and operational control
    - Instrumentation, dispatch data, and site processes
    - Low-quality telemetry or poor adoption weakens control value
  - - PlantOS control loop
    - Refining process optimization and autonomous control
    - Sensors, models, metallurgical knowledge, plant automation
    - Bad models or instrumentation faults can harm yield and safety
  - - Pronto autonomy stack
    - Haulage and drill autonomy integration at Copper One
    - Partner software, computer vision, GNSS, camera/GPS hardware, drive-by-wire retrofit
    - Partner integration or safety-system failure
  - - Simulation / predictive maintenance / RL
    - Model-driven optimization across assets
    - Training data, domain expertise, human oversight
    - Model drift, sparse data, and false confidence
  - - Human-in-the-loop operations
    - Operational exception handling and safety override
    - Skilled operators and process engineers
    - Talent scarcity can bottleneck deployment
  notes: Architecture is inferred from public descriptions and partner documentation; Mariana has not published a full technical spec.
