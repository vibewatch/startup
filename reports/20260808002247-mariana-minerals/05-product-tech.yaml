  - FE003
- id: maturity-roadmap-and-validation
  title: Deployment maturity, roadmap, and validation limits
  body: 'Mariana’s technology maturity is uneven but legible. Copper One is the most mature operating proof point because it is an active site and the company has publicly described specific autonomy and control ambitions there. Lithium One looks more like a scaling and process-development program approaching commercial production in 2027. The company’s hiring profile strongly implies that substantial core systems remain under active construction: multiple open roles target machine learning, data engineering, full-stack software, mechatronics, pilot-plant operations, metallurgy, drilling engineering, and process controls. That breadth is a good signal for seriousness, but it also means the technology stack is still being assembled and industrialized. Public proof of outcome remains limited. Mariana claims meaningful uplift in mining and refining operations, but no source provides audited KPI deltas for throughput, recovery, downtime, or safety. Product maturity should therefore be treated
    as partially deployed and internally promising rather than independently validated.'
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-quality-and-gaps
  title: Trust, safety, privacy, and quality controls
  body: Trust and quality controls are the least mature public surface. Pronto emphasizes safety systems suitable for mine operators, including access controls, activity notifications, monitoring, utilization metrics, and all-stop interactions with manually operated equipment. Mariana’s privacy policy confirms the company has at least a formal web privacy regime, but it does not substitute for operational safety, cybersecurity, or industrial-quality certifications. No public source in the reviewed set shows named ISO certifications, mine-safety performance dashboards, incident disclosures, status-page reliability data, or independent assurance around autonomy. This does not prove the controls are absent; it means buyers and investors cannot verify them from public evidence. Given that Mariana’s wedge depends on software controlling physical industrial processes, the diligence bar on safety and control quality should be high. The correct conclusion is that trust posture is directionally serious
    but still under-disclosed.
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
