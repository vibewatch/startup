  topStrengths:
    - >-
      Real asset proof points at Copper One and Lithium One make the story more concrete than most industrial-AI
      startups.
    - >-
      MarianaOS is described with enough specificity—CapitalProjectOS, MineOS, PlantOS, autonomy integration, and
      control loops—to suggest a serious technical buildout.
    - >-
      The investor base is unusually strong for a private mining startup and indicates real strategic conviction around
      domestic critical-minerals supply.
    - Market tailwinds from U.S. critical-minerals urgency and copper/lithium relevance are real and likely durable.
  topRisks:
    - >-
      Public customer proof remains thin: no named end buyers or signed offtake terms are disclosed in the retained
      source set.
    - >-
      Financial transparency is low: current revenue, margins, burn, debt, and financing plan are not publicly
      disclosed.
    - Execution is stacked across copper operations, lithium scale-up, autonomy integration, and regulatory compliance.
    - >-
      The $1.5B mark already assumes meaningful future proof conversion and could reset lower if milestones slip or
      financing becomes punitive.
  unresolvedGaps:
    - Current cash balance, burn rate, debt, and full capital plan remain private.
    - Named buyers, contract terms, and qualification milestones for copper and lithium output remain undisclosed.
    - Measured Copper One and Lithium One KPI deltas tied to MarianaOS are not publicly available.
    - Permit matrix, compliance history, and key counterparty termination terms are not public.
    - >-
      A perfect public comp for an AI-driven critical-minerals owner-operator does not exist, so valuation remains
      scenario-heavy.
