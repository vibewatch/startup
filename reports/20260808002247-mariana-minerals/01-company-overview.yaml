- id: leadership-and-footprint
  title: Leadership Bench, Talent Footprint, and Key-Person Dependence
  body: The leadership bench supports the thesis that Mariana is trying to solve a hard operational problem rather than merely pitching a concept. Founder and CEO Turner Caldwell previously spent roughly nine years at Tesla, where multiple sources say he worked on battery minerals, recycling, factory design, and lithium-refinery construction. Mariana’s two other named co-founders are CTO Juan Lozano and CFO Baker Tilney; public materials give titles but still provide much less background detail on them than on Caldwell, which is a diligence gap. The broader leadership team on the company’s about page includes a COO, Chief People Officer, commercial/product leadership, plant-engineering, corporate-development, legal, product-development, analytical, and special-projects leads. Hiring data also points to a multi-site operating footprint spanning San Francisco HQ, Houston engineering, Moab operations at Copper One, and technical recruiting in Ann Arbor. That breadth helps the execution story,
    but Caldwell remains a clear key-person dependency because he anchors the fundraising narrative, the Tesla credibility transfer, and the core "factory mindset for mining" pitch. Public board composition and governance rights were not disclosed in the reviewed sources.
