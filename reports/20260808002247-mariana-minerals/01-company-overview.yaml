company:
  name: Mariana Minerals
chapter:
  number: 1
  title: Company Overview
  summary: Mariana Minerals is a 2024-founded, San Francisco-based, software-first critical minerals developer and operator that owns mines and refineries rather than licensing software. The company has raised about $400 million, including a $310 million Series B led by Khosla Ventures in August 2026 at a $1.5 billion valuation, to scale Copper One in Utah and Lithium One in East Texas while deploying its MarianaOS stack across capital projects, mine operations, and refining. The core diligence tension is that management has assembled credible industrial and AI talent around two real assets, but public disclosure on revenue, board governance, exact project economics, and production ramp remains thin.
sections:
- id: identity-and-mission
  title: Identity, Mission, and Operating Model
  body: 'Mariana Minerals describes itself as a software-first, vertically integrated minerals company focused on supplying the metals needed for AI infrastructure, electrification, and defense systems. The company was founded in 2024, is headquartered in San Francisco, and frames its mission as rebuilding the U.S. critical-minerals supply chain by combining industrial execution with reinforcement-learning software and project orchestration tools. Unlike a software vendor selling mine-tech subscriptions, Mariana owns and operates assets itself: the business model is to acquire, build, restart, or expand mineral projects and improve their economics with MarianaOS. That distinction matters because Mariana is underwriting commodity price, permitting, construction, and operating risk directly rather than capturing high-margin SaaS revenue. The company says its near-term goal is to build ten projects in ten years and that Copper One and Lithium One already use the three MarianaOS modules — CapitalProjectOS,
    MineOS, and PlantOS — across buildout, mine orchestration, and refining control. Public materials consistently position Mariana closer to a project developer-operator with AI leverage than to a pure mining software startup.'
