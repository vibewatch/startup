- id: go-to-market-and-sales-efficiency
  title: GTM motion and sales-efficiency proxies
  body: 'Mariana’s go-to-market motion appears to be slow-cycle, qualification-heavy industrial selling rather than rapid-volume customer acquisition. Copper customers care about product specification, reliability, and delivery, while lithium buyers require qualification and often prefer long-term offtake structures. Fastmarkets says Mariana expects Lithium One to allocate roughly 70% of production under long-term offtakes with the rest sold on spot markets, which is consistent with an industrial contracting model. Public disclosures also point to use of intermediaries in addition to direct OEM relationships, suggesting Mariana may balance bankable long-dated contracts with channel flexibility. The company’s investor roster—Khosla, a16z, Breakthrough Energy Ventures, BHP Ventures, Mitsubishi, In-Q-Tel—likely helps credibility with strategic counterparties, but it does not substitute for signed customer proof. There is no public data on sales cycle length, customer-acquisition cost, payback,
    channel rebates, or renewal economics because the company is not selling software. The best public proxy for sales efficiency is milestone progression: Copper One restart speed, Lithium One construction progress, and the pace at which counterparties convert from dialogue to binding offtake.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  tableRefs:
  - TI002
  figureRefs:
  - FI002
- id: cost-structure-and-unit-economics
  title: Cost structure, gross-margin drivers, and missing unit economics
  body: 'The likely cost stack is legible even though the actual numbers are not. Copper One’s economics will be driven by mining productivity, heap leach and SX-EW recovery, refining throughput, energy, reagents, maintenance, labor, and logistics. Lithium One adds produced-water handling, extraction media or chemical inputs, water-treatment infrastructure, and conversion costs before any battery-grade product can ship. Brownfield and partner-based choices should reduce some upfront spending relative to greenfield analogs: Copper One leverages an acquired idle site and refining package, while Lithium One pairs with Select Water around produced-water infrastructure. But lower relative capex does not mean low absolute capex. Peer and partner benchmarks remain large: Select Water alone guided to $250-$290 million of 2026 net capex and reported $277.8 million of liquidity at June 30, 2026, underscoring the scale of infrastructure spending that produced-water systems can require. Publicly disclosed
    unit-economics fields for Mariana—cash cost per pound copper, lithium recovery rate, realized price, gross margin, working-capital cycle, and site-level utilization—are all unavailable, making underwriting impossible without management materials.'
