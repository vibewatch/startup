- id: capital-adequacy
  title: Capital adequacy, financing dependency, and next-round risk
  body: 'Mariana’s public financing story is strong at the headline level and weak at the operating-detail level. The company announced a $310 million Series B in August 2026 at a $1.5 billion post-money valuation, bringing total capital raised to about $400 million. Those funds are described as supporting Copper One, Lithium One, and continued MarianaOS buildout. That is a credible balance-sheet starting point for an industrial startup, especially with strategic investors on the cap table. It is not obviously enough to fully build, ramp, and derisk two mineral assets plus a software-and-automation organization if commercial timelines slip. Public analogs reinforce the point: Standard Lithium’s 2026 disclosures show customer offtake, permitting, engineering, and financing milestones remain critical even for a single-commodity DLE developer; Select Water’s filings and quarterly update show that water-infrastructure businesses can consume hundreds of millions of dollars in annual capex. Mariana
    has disclosed no cash-on-hand figure, no monthly burn, no debt, no project-finance package, and no explicit next-round trigger. The likely conclusion is that Mariana will need either asset-level debt, strategic project finance, more equity, or some combination before both flagship assets are fully scaled.'
