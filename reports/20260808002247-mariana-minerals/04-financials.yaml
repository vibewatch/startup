company:
  name: Mariana Minerals
chapter:
  number: 4
  title: Financials
  summary: Mariana Minerals looks economically like a capital-intensive industrial developer, not a SaaS company. Public evidence supports a future revenue model based on copper cathode, scrap-fed copper recovery, and lithium chemicals sold under long-term offtake plus spot-style arrangements, but it does not support a current revenue, margin, burn, or cash balance underwrite. The company has raised about $400 million, including a $310 million Series B, which is substantial for a private mining startup but likely insufficient to fully derisk both a 50,000 tpa copper buildout and a commercial produced-water lithium facility without additional project finance, strategic capital, or another equity round. Brownfield positioning at Copper One and infrastructure partnership at Lithium One may reduce relative capital intensity versus greenfield peers, yet public evidence still points to significant capex, working-capital, and qualification needs. The financial verdict is that Mariana has a plausible
    industrial revenue model and strong capital access narrative, but public disclosure is far too thin to support a clean underwriting view on revenue quality, margin path, or runway.
sections:
- id: revenue-model
  title: Revenue streams, monetization, and recognition logic
  body: 'Mariana’s public materials indicate a physical-products revenue model rather than a software-licensing model. Copper One is described as a copper mining and refining asset intended to reach 50,000 metric tonnes per year of combined geologic and scrap-fed output, which implies revenue from copper cathode or other refined copper units sold into industrial channels. Lithium One is positioned as a produced-water lithium facility serving OEMs and intermediaries, with Fastmarkets reporting Mariana is negotiating long-term and spot-style offtake structures. The company markets MarianaOS as the execution layer across capital projects, mine operations, and plant management, but no public source indicates that Mariana sells MarianaOS as standalone software; it appears to monetize through asset ownership and operating performance. That distinction matters because revenue recognition and gross-profit structure should look like industrial commodity supply: realized price, delivered tonnage,
    recovery rate, and contract mix matter far more than seats or subscriptions. The public source set does not disclose current production revenue, realized copper price, lithium product mix, or any active revenue base. Investors therefore have to treat the model as economically plausible but not yet financially transparent.'
