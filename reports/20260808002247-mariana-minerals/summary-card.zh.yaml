  topStrengths:
    - Copper One 和 Lithium One 的真实资产验证，让这家公司比多数 industrial-AI 初创更具体。
    - MarianaOS 的描述足够细：CapitalProjectOS、MineOS、PlantOS、autonomy 集成和控制回路，显示技术建设不是空壳。
    - 对一家私有采矿初创来说，投资人阵容异常强，说明市场对美国本土关键矿产供应有真实战略信念。
    - 美国关键矿产紧迫性、铜和锂的相关性，提供真实且大概率持久的市场顺风。
  topRisks:
    - 公开客户证据仍薄：保留来源里没有披露具名终端买方或已签 offtake 条款。
    - 财务透明度低：当前收入、利润率、烧钱、债务和融资计划均未公开。
    - 执行同时压在铜业务、锂规模化、autonomy 集成和监管合规上。
    - $1.5B 标记已经假设未来里程碑会大量兑现；一旦里程碑延迟或融资条款变差，估值可能下调。
  unresolvedGaps:
