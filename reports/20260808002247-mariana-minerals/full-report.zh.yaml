      - number: '2.5'
        title: 市场判断与剩余规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              市场结论是，Mariana 的可寻址机会在经济上很大，但近期运营上很窄。铜和锂都受益于结构性需求、本土采购政策兴趣和精炼瓶颈，可靠的美国产量应能得到回报。与此同时，Mariana 的锂 SOM
              相对于美国全国建设问题很小，其铜目标也应被视为单一场地扩张计划，而非美国进口依赖的解决方案。公司似乎瞄准了正确的卡点——精炼单位，而不只是上游资源主张——这一点重要，因为中游价值捕捉仍是许多西方供应链的弱处。未解决的市场问题包括：买方是否愿意为本土韧性支付溢价；Mariana
              能否足够快完成产品资质认证；以及其软件是否真能足够降低成本和爬坡时间，抵消美国新供应项目的结构性劣势。
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 市场大，是因为瓶颈在实体供应，不在软件采用
            body: Mariana 的可寻址价值来自在受限供应链内生产稀缺精炼单位。如果 Copper One 和 Lithium One 跑通，软件之所以重要，是因为它让吨数更便宜、更快，而不是因为买方会另外为软件席位付费。
