  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              看多论点是连贯的。Mariana 所在市场具备战略重要性，拥有或控制真实资产证明点，而且「软件 + 运营」故事比许多工业 AI 初创公司更具体。Copper One 给了它一个公开运营现场，Lithium One
              给了它一个上行空间很高的美国本土锂切入口，投资人阵容也表明公司吸引了严肃信念。反论点同样清楚：几乎所有承销关键字段都仍是私有信息。公开材料没有收入、利润率、已签终端买方合同、烧钱速度，也没有可审计的资本计划。这意味着当前估值更多压在远期选择权价值上，而不是已经去风险的经营表现上。Mariana
              也许应该相对纯概念软件公司或尚无资产的 PPT 初创公司享受溢价，但还不该被当成已经验证的工业运营商。关键估值问题因此不是故事是否有趣，而是 $1.5B 是否已经提前消化了太多未来证明曲线。
