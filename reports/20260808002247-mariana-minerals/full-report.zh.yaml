      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Mariana
              的财务案例方向上有吸引力，但仅凭公开证据还不能承销。正面看，公司似乎在战略需求市场中通过真实工业产出变现；作为私营矿业创业公司，它拿到了异常强的投资人；它选择的运营模式也可能相对绿地同业压缩开发周期。负面看，几乎所有承销关键字段都缺失：当前收入、发货量、实际定价、毛利率、EBITDA、烧钱、现金余额、债务契约、项目融资假设和合同
              backlog。最重要的尽调阻断项是：Copper One 能否真正交付低成本 50,000 tpa 画像；Lithium One 能否拿下约束性客户合同并在 2027
              年达到商业生产；资本结构能否吸收不可避免的进度波动。在这些事项得到证据前，Mariana 应被视为有前景但财务不透明的工业建设项目，而不是已经去风险的运营公司。
