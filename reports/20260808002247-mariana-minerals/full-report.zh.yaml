      - number: '2.4'
        title: 增长驱动、采用约束与时间摩擦
        blocks:
          - type: paragraph
            body: >-
              Mariana 所在市场的需求侧支撑是真实的。IEA 分析显示，随着 cleantech、电网和更广泛电气化增长，铜需求在上升；战略矿产政策也越来越受韧性顾虑和中国精炼集中度影响。因此，Mariana
              自身的本土供应论点有真实宏观基础。但供给侧极其残酷。IEA 仍预计铜和锂到 2035 年前存在缺口，而 Dallas Fed、Carnegie、CFR、EY
              以及行业报道都强调同一组约束：资本密集、许可缓慢、技术放大风险、上游到中游瓶颈和劳动力短缺。Mining Technology 的 2025 至 2026 年展望还补充说，自动化采用在扩散但仍处早期，刚超过 4%
              的采矿设备为自动化或可自动化，全球安装的自动驾驶矿卡仅几千台。如果自动化能降低成本和压缩工期，Mariana 的方向就有利；但这并不让商业落地变得容易。公司竞争的市场之所以有吸引力，恰恰是因为进入难。
