      - number: '1.3'
        title: 融资历史、投资人组合与资本信号
        blocks:
          - type: paragraph
            body: >-
              对一家 2024 年创立的公司而言，Mariana 融资推进得异常快。2025 年 7 月的 Series A 公告称，该轮由 Andreessen Horowitz 领投，Breakthrough Energy
              Ventures 和 Khosla Ventures 继续支持，使当时累计融资达到 $85 million。约十三个月后，Mariana 宣布由 Khosla Ventures 领投的 $310 million
              Series B，a16z、Breakthrough Energy Ventures、BHP Ventures、Mitsubishi Corporation、In-Q-Tel
              以及更长名单的新财务投资人参投，使母公司和项目资本累计融资约 $400 million。Fortune、The Next Web、AI Weekly 和 Discovery Alert 均佐证了 $310
              million 轮次规模和 $1.5 billion 估值。股东名单具有战略意义：风险投资机构验证软件野心，BHP Ventures 带来矿业信号，Mitsubishi 暗示工业商业相关性，In-Q-Tel
              则叠加了与公司本土供应链叙事一致的美国国家安全角度。代价是，在收入、利润率或稳定产量尚无公开证据之前，Mariana 已经按高信念硬科技平台定价。
