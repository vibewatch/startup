      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Mariana 的 go-to-market 更像慢周期、重资质认证的工业销售，而不是快速放量获客。铜客户在意产品规格、可靠性和交付；锂买家需要资质认证，也往往偏好长期 offtake
              结构。Fastmarkets 称 Mariana 预计 Lithium One 约 70% 的产量分配给长期 offtake，其余在现货市场出售，这与工业合同模式一致。公开披露还指向直接 OEM
              关系之外的中间商使用，说明 Mariana 可能在可融资的长期合同和渠道灵活性之间做平衡。公司投资人阵容——Khosla、a16z、Breakthrough Energy Ventures、BHP
              Ventures、Mitsubishi、In-Q-Tel——可能提升战略交易对手信任，但不能替代已签客户证明。由于公司不卖软件，没有公开数据披露销售周期长度、获客成本、回本期、渠道返利或续约经济性。公开可见的最佳销售效率代理指标是里程碑推进：Copper
              One 重启速度、Lithium One 建设进展，以及交易对手从对话转为约束性 offtake 的速度。
