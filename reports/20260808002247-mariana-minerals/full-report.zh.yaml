  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险最高的部分集中在资本强度、商业化和执行。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 高影响
          values:
