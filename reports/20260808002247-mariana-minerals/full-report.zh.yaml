        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Mariana
              的护城河主张建立在三个相连观点上：第一，软件优先的执行方式可以更快重启或建设矿产资产；第二，学习会在铜和锂运营之间复利；第三，美国本土供应链紧迫性给新进入者留出空间。这些观点可信，但仍可争辩。KoBold
              的科学能力和资本基础可能主导矿业 AI 叙事。Lilac 和 Standard Lithium 已经在锂领域披露更强的商业就绪信号。Redwood
              可以在不承担绿地采矿风险的情况下捕捉本土供应链心智。在位矿商和加工商仍拥有最深的客户关系、运营团队和资产负债表。客户实际切换成本也低于软件市场，因为铜阴极和碳酸锂一旦通过认证，就是规格驱动、接近大宗商品的产品。这意味着
              Mariana 的软件护城河只有在比同业更快降低成本、提升可靠性或加速交付时才重要。威胁不只是某一个直接对手，而是一群资本更足的公司更早证明栈中相邻部分。
