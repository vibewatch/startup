      - number: '7.5'
        title: 人才风险、缓释因素与击穿论点的触发点
        blocks:
          - type: paragraph
            body: >-
              人才风险可以从招聘模式里看到。Mariana
              正在招聘机器学习、过程控制、机电一体化、冶金、钻探自动化、试点工厂运营和现场执行人才。这种跨度支撑了模式雄心，也说明公司仍依赖组建并留住罕见的跨学科团队。缓释因素存在：战略资本渠道、棕地铜资产定位、可信合作伙伴，以及与产业政策一致的使命。尽管如此，最重要的监测指标很直接。如果
              Lithium One 不能把对话转化成有约束力的商业合同，如果 Copper One
              无法展示来自软件栈的可量化运营改善，如果监管或安全问题拖慢执行，或如果新增融资条款严苛，投资论点会迅速变弱。因此，Mariana 的风险姿态只适合愿意紧盯里程碑、并随着证据更新观点的支持者。
