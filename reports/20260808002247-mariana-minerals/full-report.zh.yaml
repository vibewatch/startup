      - number: '4.3'
        title: 成本结构、毛利驱动与缺失的单位经济性
        blocks:
          - type: paragraph
            body: >-
              尽管实际数字未知，可能的成本栈仍然清晰。Copper One 的经济性将由采矿生产率、堆浸和 SX-EW 回收率、精炼产量、能源、试剂、维护、人工和物流驱动。Lithium One
              还会增加采出水处理、提取介质或化学投入、水处理基础设施，以及电池级产品发货前的转化成本。棕地和基于合作伙伴的选择，应能相对绿地类比项目减少部分前期支出：Copper One
              利用收购来的闲置场地和精炼包，Lithium One 则围绕采出水基础设施与 Select Water 配对。但相对 capex 更低，并不等于绝对 capex 低。同业和合作伙伴基准仍然很大：Select
              Water 单独指引 2026 年净 capex 为 $250-$290 million，并报告截至 2026 年 6 月 30 日流动性为 $277.8
              million，凸显采出水系统可能需要的基础设施投入规模。Mariana 公开披露的单位经济性字段——每磅铜现金成本、锂回收率、实际价格、毛利率、营运资本周期和场地级利用率——全都缺失；没有管理层材料，无法承销。
