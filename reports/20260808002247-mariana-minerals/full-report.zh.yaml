  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Mariana 实际交付什么
        blocks:
          - type: paragraph
            body: >-
              Mariana 看起来并不向广泛外部客户群销售通用矿业软件。公开材料把公司描述为关键矿产资产的 owner-operator，其专有操作系统改善项目建设、矿山运行和精炼厂控制。具名软件层包括负责资本交付的
              CapitalProjectOS、负责矿山运营的 MineOS，以及负责炼厂管理的 PlantOS。它们与实体资产配对：Utah 的 Copper One 和 Texas 的 Lithium
              One。按实际工作流看，Mariana 销售的是未来由更紧密人机运营闭环生产的铜和锂产量，而不只是代码。这个差别重要，因为产品效用必须用安全性、产量、回收率、成本和部署速度来判断，而不是只看席位、API 或 UI
              精致度。公开来源显示，公司把软件和工业执行视为不可分割。
