      - number: '7.2'
        title: 运营、技术与质量风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Mariana 同时在做几件难事。Copper One 需要矿山与精炼厂持续协同、管理原料波动，并把重启叙事兑现为实质性更高产出。Lithium One
              需要把采出水提锂工艺放大到可靠商业产出；即便是更聚焦的同行，在这个市场里仍要跨过工程和融资关口。Mariana
              的软件与自动化主张抬高了上行空间，也带来失效模式：仪表数据差、模型漂移、人工接管设计薄弱，或合作伙伴集成不佳，都可能伤害产量、质量或安全。公开来源提到仿真、预测性维护、强化学习和控制回路，具体到足以认真对待，但还不足以独立验证。因此，核心运营风险不是公司没有计划，而是这套计划牵涉许多紧密耦合的系统，公开
              KPI 证明仍有限。
