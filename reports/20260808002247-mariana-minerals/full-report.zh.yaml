      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Mariana 的模式依赖的交易对手，比简单的「拥有资产」故事更多。Select Water 对 Lithium One 的基础设施逻辑很关键，Pronto 对 Copper One
              的自动化部署叙事也很关键。战略投资人可能帮助未来融资或商业引介，但一旦里程碑滑坡，也会制造预期风险。终端客户依赖一旦浮出水面，很可能高度集中：少数锚定承购合同可能主导收入，让交易对手变得强势。好消息是，当前合作伙伴组合看起来可信，也贴近工业场景。坏消息是，集中且高价值的合作伙伴可能变成卡点。如果关键交易对手改变战略方向，公开证据没有披露替代选项、终止条款或备选方案。因此，即便还没有明显交易对手压力，依赖风险已经很实质。
