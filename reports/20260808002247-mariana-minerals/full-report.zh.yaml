            body: >-
              公开架构偏方向性而非完全具体，但足以推断主要层次。Mariana 称 MarianaOS 使用仿真、预测性维护和强化学习来改善矿山与炼厂工作流。Series B 公告进一步给出 PlantOS
              的控制闭环描述，称实验室规模实验和动力学模型连接到一个世界模型，并与工厂交换控制信号和传感器反馈。在 Copper One，TechCrunch 称 Mariana 找到 Pronto
              协助自动化矿卡和钻机。Pronto 自身材料描述了一套交钥匙自动化栈：计算机视觉、GNSS、加固摄像头 / GPS 硬件、机器学习目标检测、改装 drive-by-wire
              套件，以及几乎不需改造基础设施的场地专属安全规则。这说明 Mariana
              的架构不只依赖内部软件，还依赖专业自动化合作伙伴、传感器、熟练现场人员和稳健的过程控制工程。依赖链很宽：安全系统、伙伴集成、工厂仪表或数据质量任何一环失败，都可能削弱这套栈。
