  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Mariana 的市场更应定义为美国本土精炼铜和电池级锂化学品供应，而不是“AI for mining”。Copper One 目标是向美国工业需求销售精炼铜阴极；Lithium One
              则设计为销售从油气废水中生产的电池级锂盐。这意味着相关支出池是金属和化学品采购预算，而非企业软件预算。现状替代方案也不是另一家创业公司的仪表盘，而是进口精炼铜、进口碳酸锂或氢氧化锂、大型在位企业运营的传统采矿 /
              精炼产能，以及某些情况下把美国原料或废料出口到海外加工。这个边界很重要，因为 Mariana
              的经济主张取决于能否以可信的进度、质量和成本交付实体单位。公司的软件只有在足以改变项目经济性或供应可靠性、赢得真实大宗商品 offtake 时，才能变现。实际中，Mariana
              试图进入的是一个买方更在意价格、杂质谱、本土来源韧性和供货连续性，而不是软件新奇性的市场。
