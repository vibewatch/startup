chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Mariana Minerals 自称是一家软件优先、纵向整合的矿产公司，重点供应 AI 基础设施、电气化和国防系统所需金属。公司创立于 2024 年，总部在 San
              Francisco，把使命表述为：用工业执行能力结合强化学习软件和项目编排工具，重建美国关键矿产供应链。Mariana
              不像向矿山出售技术订阅的普通软件供应商，而是自己拥有并运营资产：公司收购、建设、重启或扩建矿产项目，并用 MarianaOS 改善其经济性。这个差别很关键，因为 Mariana
              直接承担大宗商品价格、许可、建设和运营风险，而不是获取高毛利 SaaS 收入。公司称，近期目标是在十年内建设十个项目；Copper One 和 Lithium One 已经在建设、矿山编排和精炼控制中使用
              CapitalProjectOS、MineOS、PlantOS 三个 MarianaOS 模块。公开材料一贯把 Mariana 定位得更接近借助 AI 的项目开发运营商，而不是纯粹的矿业软件创业公司。
