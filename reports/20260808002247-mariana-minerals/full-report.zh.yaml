      - number: '8.3'
        title: 融资背景、可比公司与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开价格锚，是 2026 年 8 月这轮 Series B：融资 $310M，投后估值 $1.5B，总融资约
              $400M。对一家试图同时拥有软件选择权和关键矿产资产的私有公司来说，这个估值很严肃，但不荒谬。问题在于，可比公司两面都能切。按市值看，Mariana 已经高于 Standard Lithium、Lithium
              Americas 等上市 DLE 公司，尽管后者披露更多，在某些情况下承购和许可里程碑也更清楚。另一方面，相比 Albemarle、Freeport-McMoRan、Royal
              Gold、Franco-Nevada、Wheaton Precious Metals 等大型上市材料生产商或权利金公司，Mariana
              规模小得多、阶段更早、验证更少。因此，入场纪律必须追问：溢价到底在买什么？答案是美国本土供应链价值、软件选择权价值和多资产上行空间的混合，而不是当下财务证明。这让估值可以被理解，但一旦里程碑滑坡，也会变得脆弱。
