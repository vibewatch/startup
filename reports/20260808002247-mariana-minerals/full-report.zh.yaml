      - number: '8.5'
        title: 退出准备度、击穿论点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              以当前公开证据看，Mariana 尚未达到公开市场准备度。它可能在私募市场具备机构融资能力，因为战略投资人可以承销周期更长的工业选择权；但若要达到 IPO
              质量，必须披露更多运营记录。未来最可能的正向退出路径包括：在证明改善后进行后期私募轮；当一个或两个资产大幅去风险后发生战略交易；或在客户、资本开支和运营指标更清晰后最终上市。最重要的尽调问题直接，也与前文一致：当前现金和烧钱速度、已签或接近签约的买方、站点级单位经济性、许可状态、合作伙伴条款，以及
              Copper One / Lithium One 可量化的表现变化。击穿论点的触发点也清楚：围绕 2027
              年锂目标没有可信客户闭环，没有可量化的软件驱动运营提升，监管或安全中断，或下一步融资带有惩罚性条款。在这些问题解决前，估值判断应继续依赖证据，并保持谨慎。
