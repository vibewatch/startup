      - number: '2.3'
        title: 买方 / 用户 / 付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              铜和锂的买方地图差异很大。精炼铜最终用于建筑、电气 / 电子、交通和工业机械，但 Mariana 的直接商业接口更可能是贸易商、线杆厂、黄铜厂、电缆生产商和其他工业加工商。锂方面，直接商业目标不是终端 EV
              买家，而是正极材料生产商、电池材料贸易商、OEM 采购团队，以及能把碳酸锂吸收到更广电池材料供应链中的中间商。Fastmarkets 报道称，Mariana
              打算先强调碳酸锂，因为它在不同化学体系中更可替代；公司也在与 OEM 和中间商谈判长期
              offtake。这个策略合理：年轻生产商更需要灵活渠道，而不是单一路径锁死。两类产品的采用路径仍要穿过资质认证、可靠性证明、物流和本土采购可信度。换句话说，市场不会只为自动化叙事买单；市场会奖励按规格、按时交付的吨数。
