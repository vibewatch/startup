  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、变现方式与确认逻辑
        blocks:
          - type: paragraph
            body: >-
              Mariana 的公开材料指向实体产品收入模式，而不是软件授权模式。Copper One 被描述为铜矿和精炼资产，目标是达到每年 50,000
              公吨由地质矿料和废料进料组成的综合产量，这意味着收入来自向工业渠道销售铜阴极或其他精炼铜单位。Lithium One 被定位为服务 OEM 和中间商的采出水锂设施；Fastmarkets 报道称 Mariana
              正在谈判长期和现货式 offtake 结构。公司把 MarianaOS 营销为横跨资本项目、矿山运营和工厂管理的执行层，但没有公开来源显示 Mariana 将 MarianaOS
              作为独立软件出售；它似乎通过资产所有权和运营表现变现。这个差别重要，因为收入确认和毛利结构应像工业大宗商品供应：实际价格、交付吨数、回收率和合同组合，远比席位或订阅重要。公开来源集合没有披露当前生产收入、实际铜价、锂产品组合或任何活跃收入基础。因此，投资人必须把该模式视为经济上可行，但财务上尚不透明。
            claimRefs:
              - CI001
              - CI002
              - CI003
