        title: 建议、信心与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议：继续研究 / 按当前价格等待。信心：中。风险评级：高。估值立场：基于已披露证据，估值充分到偏贵。这是一个价格敏感的判断，不是否定公司。如果 Copper One 产出可量化运营收益，如果 Lithium
              One 签下可融资的合同并按 2027 年时间线推进，如果融资仍能以合理条款获得，Mariana 完全可能长进甚至超过当前估值。但今天的公开证据不足以支撑以 $1.5B
              做高信心承销。现有内部人或战略投资人继续持有是理性的，因为他们很可能能看到私有运营数据，而且选择权确实存在。没有特权尽调的新投资人，应把当前价格视为相对已披露证明偏苛刻。最可能在短期内改善判断的证据，是已签承购、站点级
              KPI 披露，或一套显示放大可融资且不会造成惩罚性稀释的融资结构。
