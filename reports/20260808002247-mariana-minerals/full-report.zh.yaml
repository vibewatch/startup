figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: >-
      Mariana 把早期公司通常需要多年的路径压缩到约两年：2024-2025 年创立并完成 Series A，2025 年末推出 Lithium One，2026 年初推出 Copper One 并达成自主化合作，随后在
      2026 年 8 月完成金额为 $310 million 的 Series B。
    data:
      items:
        - date: '2024-07-21'
          label: 公开发布
          detail: Mariana 以软件优先的矿业公司身份亮相。
          tone: positive
        - date: '2025-07-21'
          label: Series A 背景
          detail: 公司称，由 a16z 领投的 Series A 使累计融资达到 $85M。
          tone: positive
        - date: '2025-10-24'
          label: Lithium One 发布
          detail: 伴随 2027 年上半年投产目标，采出水提锂项目启动。
          tone: positive
        - date: '2025-10-23'
          label: Select / Mariana 破土动工
          detail: 德州首个商业化采出水提锂场站公开。
          tone: positive
        - date: '2025-12-01'
          label: Copper One 已收购
          detail: 媒体和公司信息显示，Copper One 收购发生在 2025 年末。
          tone: positive
        - date: '2026-03-16'
          label: Copper One 发布
          detail: 犹他矿山和冶炼厂成为 Mariana 的铜旗舰项目。
          tone: positive
        - date: '2026-04-09'
          label: Pronto 合作
          detail: Copper One 宣布接入自主运输。
          tone: positive
        - date: '2026-08-03'
          label: Series B 完成交割
          detail: Khosla 领投 $310M，估值 ~$1.5B；累计融资 ~$400M。
          tone: positive
        - date: '2027-06-30'
          label: Lithium One 目标启动
          detail: 目标在 2027 年上半年商业化生产。
          tone: warning
    approximationNotes: 2025-10-23 的 Select 破土动工日期来自合作方信息和同期媒体报道推断。Copper One 收购定为 2025 年末，是因为确切交割日期未披露。
