companyProfile:
  summary: >-
    Mariana Minerals 创立于 San Francisco，试图用软件和运营结合的模式重建美国本土关键矿产能力。CEO Turner Caldwell 曾在 Tesla 负责运营，他把公司叙事建立在 MarianaOS
    之上——用于资本交付的 CapitalProjectOS、用于矿山运营的 MineOS，以及用于炼厂管理的 PlantOS。Mariana 的旗舰项目包括 Utah 的 Copper
    One，公司正在这座重启的铜资产上推进自动化和工厂优化；另一个是 Texas 的 Lithium One，公司与 Select Water 合作扩大一座采出水锂设施。截至 2026 年 8 月，公司已累计融资约 $400
    million，其中包括由 Khosla Ventures 领投、投后估值 $1.5 billion 的 $310 million Series B，投资方还包括 a16z、Breakthrough Energy
    Ventures、BHP Ventures、Mitsubishi 和 In-Q-Tel。
