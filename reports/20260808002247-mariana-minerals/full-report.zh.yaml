              能力广度不等于商业就绪度。Mariana 公开栈覆盖 CapitalProjectOS、MineOS 和 PlantOS，并应用于铜和锂两类资产，这说明它比许多只做锂的 DLE
              同业有更强的跨场地运营野心。但公开商业证明仍落后于部分竞争者。Lilac 已披露一份约束性十年 take-or-pay offtake 协议、Phase 1 产能、EPCM 合作方和美国制造线。Standard
              Lithium 已披露与 Trafigura 的约束性 offtake，以及更清晰的 pre-FID 里程碑地图。相比之下，Mariana 只公开表示 Lithium One 正在与 OEM
              和中间商谈判。KoBold 融资规模更大、资产尺度世界级，但不那么明显聚焦于棕地自动化和湿法冶金过程控制。Redwood 在美国本土电池回收和储能部署的下游规模无可匹敌，但其商业模式与 Mariana
