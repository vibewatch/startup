              公开来源可见的模块地图，比官网本身暗示的更丰富。CapitalProjectOS 被描述为横跨规划、工程、采购、成本控制、排程和施工管理的单一事实源。MineOS
              监控并编排地质、车队、运输、维护和劳动力协调中的决策。PlantOS 面向精炼表现，包括堆浸生物浸出、溶剂萃取、电积和锂流程步骤控制。Copper One 是软件加运营主张的主要公开证明场地，Lithium
              One 则把这套栈延伸到采出水锂提取和工艺开发。招聘页面强化了同一幅图景：Mariana 同时招聘软件开发、工艺开发、采矿运营、工厂与工艺工程，以及现场岗位。这不是贴在别人矿山上的薄软件层，而是全栈工业运营模式。
