      - number: '1.5'
        title: 负面信号、矛盾与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              对 Mariana 故事最强的反驳不是公司缺乏野心，而是公开披露仍落后于估值。所审阅资料没有提供经审计收入、毛利率、现金消耗、债务、项目级
              capex、董事会成员，或融资轮背后的详细优先权结构。独立报道也强化了一个判断：矿业自动化和非常规锂提取都面临艰难落地风险。AI Weekly 明确提醒，Copper One
              产量水平和单位经济性仍未验证，自动化采矿历史上也常常承诺过高。Dallas Fed 另指出，美国非常规锂项目往往面临低价格、十亿美元级 capex 需求、长回收期和商业化延误。Mariana
              在不同来源中也存在指标漂移：Copper One 被描述为向每年 50,000 公吨爬坡，但只有部分媒体给出到 2030 年的时间框架；同样，媒体把 Lithium One 描述为 Texas 项目，而公司和
              Fastmarkets 材料则把原料和基础设施足迹延伸到 western Louisiana 与 East
              Texas。这些模糊点可管理，但也强化了一个结论：应把公司作为执行密集型工业创业公司来尽调，而不是已经去风险的软件平台。
