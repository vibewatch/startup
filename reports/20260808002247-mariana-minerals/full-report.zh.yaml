        title: 领导班底、人才足迹与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              管理层背景支撑了一个判断：Mariana 试图解决的是艰难的运营问题，不只是推销一个概念。创始人兼 CEO Turner Caldwell 此前在 Tesla
              工作约九年，多方资料称他参与过电池矿产、回收、工厂设计和锂精炼厂建设。Mariana 另外两位具名联合创始人是 CTO Juan Lozano 和 CFO Baker
              Tilney；公开材料给出了头衔，但对二人的背景披露远少于 Caldwell，这是尽调缺口。公司官网 about 页面列出的更广义领导团队还包括 COO、首席人事官、商业 /
              产品负责人、工厂工程、企业发展、法务、产品开发、分析和特殊项目负责人。招聘数据也显示，公司有多地点运营足迹：San Francisco 总部、Houston 工程团队、Copper One 所在 Moab
              运营，以及 Ann Arbor 技术招聘。这种广度有助于执行叙事，但 Caldwell 仍是清晰的关键人依赖：融资叙事、Tesla 信誉迁移，以及“把工厂思维带进矿业”的核心 pitch
              都由他锚定。所审阅资料未披露公开董事会构成和治理权利。
