        title: 牛、基准与熊情景
        blocks:
          - type: paragraph
            body: >-
              Mariana 的情景区间异常宽，因为它同时是运营故事、融资故事和技术溢价故事。牛市情景下，Copper One 证明软件驱动的经济性真实存在，Lithium One 锁定锚定客户并继续朝 2027
              年投产推进，新增资本也以合理条款到位；这可以支撑远高于当前轮次的估值。基准情景下，证明缓慢到来，公司仍有意思，当前估值大致公平但谈不上明显便宜。熊市情景下，客户证明滑坡，自动化收益仍以叙事为主，或融资条款更严苛；那将意味着公允价值低于
              Series B。由于公开经济性数据很薄，这些情景更适合作为纪律工具，而不是精确价格目标。它们说明了哪些证据必须出现才能证明上行空间，也说明哪些失败会迅速压缩估值。
