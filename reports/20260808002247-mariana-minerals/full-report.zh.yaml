  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Mariana 的监管暴露横跨矿山运营、精炼、水处理，以及叠加其上的任何工业自动化部署。Lithium One 的采出水模式处在水务和油田监管语境中，EPA Class II
              注入井规则、州级水务和处置制度、环境许可都很关键。Copper One 以及未来任何矿山扩张，则落在联邦和州矿业法框架与矿山安全监管之下。原则上这些暴露可以管理，但并不轻，因为 Mariana
              试图在许可、环境控制和运营规则都可能拖慢进度或推高成本的行业里压缩时间线。公开材料没有显示 Mariana 面临诉讼或执法，这很好；但材料也没有给出许可矩阵、事故历史，或环境与安全合规看板。Mariana
              发布的隐私政策只覆盖网站治理层面，回答不了更重要的工业法律问题：现场安全、环境义务和运营保障。
