            body: >-
              KoBold Metals 是最明显的私营对照，因为它同样把软件和 AI 叙事包在关键矿产周围，但模式不同。KoBold 的公开材料强调勘探科学、机器预测，以及 Mingomba 的超大规模铜开发；KoBold
              称该项目在 2030 年代初年产量预计超过 300,000 公吨。Redwood Materials 位置更偏下游：它回收电池，生产锂、镍、钴、铜和正极活性材料，并为数据中心和电网部署储能。EnergyX
              是一家技术加项目混合公司，围绕 GET-Lit 膜和 Lonestar、Black Giant 等锂项目建设。Standard Lithium 是接近商业化的美国锂开发商，重点在 Arkansas 和 East
              Texas；Lilac 则是这组来源中披露最充分、商业成熟度最高的 DLE 标杆，具备制造、EPCM 和约束性 offtake 里程碑。Mariana 的独特组合是棕地铜重启、采出水锂，以及矿山 /
