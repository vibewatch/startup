      - number: '1.4'
        title: 资产基础、运营里程碑与当前规模
        blocks:
          - type: paragraph
            body: >-
              Mariana 的旗舰资产是真项目，不是幻灯片里的试点。2026 年 3 月宣布的 Copper One 位于 Utah 东南部，是一座运营中的铜矿和湿法冶金炼厂，Mariana 于 2025 年末从原
              Lisbon Valley 团队手中收购。公司和媒体资料一致认为，该场地包括采矿、浸出、溶剂萃取和电积基础设施，Mariana 还希望把废料进料与开采矿料结合。公开目标是把综合产量扩大到每年 50,000
              公吨精炼铜；但各来源对具体时间和当前运行率说法不一，投资人应把这个产量目标视为愿景，而非已经达成。Lithium One 于 2025 年 10 月宣布，并由 Select Water Solutions
              合作支持，设计为 East Texas / western Louisiana 的 GWh 级采出水锂设施，目标是每年最高 3,000 公吨电池级锂盐，并在 2027 年上半年进入商业生产。两项资产让
              Mariana 比许多关键矿产创业公司拥有更具体的工业基础，但也让公司立刻暴露在重启、调试和大宗商品周期风险中。
