      - number: '2.2'
        title: 透过铜与锂供应看 TAM / SAM / SOM
        blocks:
          - type: paragraph
            body: >-
              总可寻址市场显然很大，但尽调真正有用的问题是，Mariana 能从前两个场地切到多少。铜方面，USGS 将 2025 年美国表观一次精炼铜和旧废铜消费量估为 2.2 million 公吨，净进口依赖度
              57%，精炼铜进口 1.7 million 吨。按 2025 年美国生产商阴极铜价格 $4.90 / 磅计算，国内精炼铜需求池每年超过 $20 billion。锂方面，USGS 估算 2025 年全球消费量为
              263,000 公吨锂含量，电池级碳酸锂均价约 $9,000 / 吨，美国净进口依赖度超过 50%。Dallas Fed 研究显示美国有 66 个锂项目，但只有少数在建，且许多项目需要超过 $1 billion
              资本。因此，Mariana 眼前的 SOM 小得多：Copper One 的 50,000 tpa 铜目标，以及 Lithium One 的 3,000 tpa
              锂盐目标；后者是一个有意义的试点商业化切口，而非足以改变市场规模的位置。投资逻辑取决于这些首批产量能否成为可复制平台，而不只是第一个场地的体量。
