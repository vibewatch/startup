      - number: '4.4'
        title: 资本充足性、融资依赖与下一轮风险
        blocks:
          - type: paragraph
            body: >-
              Mariana 的公开融资故事标题很强，运营细节很弱。公司于 2026 年 8 月宣布 $310 million Series B，投后估值 $1.5 billion，使累计融资达到约 $400
              million。这些资金被描述为支持 Copper One、Lithium One 和 MarianaOS
              持续建设。对一家工业创业公司而言，这是可信的资产负债表起点，尤其是股东名单里有战略投资人。但如果商业时间表延误，这笔钱未必足以完整建设、爬坡并去风险两个矿产资产，再加一个软件与自动化组织。公开类比强化了这一点：Standard
              Lithium 的 2026 年披露显示，即便是单一大宗商品 DLE 开发商，客户 offtake、许可、工程和融资里程碑仍然关键；Select Water
              的文件和季度更新显示，水基础设施业务每年可能吃掉数亿美元 capex。Mariana 未披露手头现金、月度烧钱、债务、项目融资包或明确下一轮触发条件。更可能的结论是，在两个旗舰资产完全放大之前，Mariana
              需要资产级债务、战略项目融资、更多股权，或几者组合。
