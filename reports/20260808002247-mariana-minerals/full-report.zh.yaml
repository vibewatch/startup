      - number: '7.4'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              财务风险仍高，因为外界几乎看不到烧钱速度、现金、债务和项目融资策略，而资本需求显然很大。公司已经融到可观资本，但它同时推进两个工业项目和一套软件自动化建设。即使里程碑按期兑现，这个组合也很烧钱；如果排期滑坡或认证耗时超过计划，成本会更高。大宗商品暴露又加了一层风险。铜和锂市场具备战略吸引力，但仍然波动且有周期性。Mariana
              的故事还依赖自动化和软件改善经济性，但公开证据没有显示这部分提升的幅度或耐久性。因此，财务模型风险既包括经典的资本开支风险，也包括更微妙的证明风险：如果软件收益小于预期，Mariana
              可能看起来更像一家资本饥渴、护城河比当前估值假设更薄的矿业公司。
