  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻玩家、在位者与替代方案
        blocks:
          - type: paragraph
            body: >-
              Mariana 的竞争集合横跨几类玩家，它们解决的是同一供应链问题的相邻切片。直接同业包括 KoBold Metals 等 AI 原生或软件前置的关键矿产开发商；锂侧则包括 Standard
              Lithium、Lilac Solutions、EnergyX 等由项目支撑的 DLE 公司。相邻竞争者包括 Redwood Materials
              这类下游平台，它们不直接开采矿石或采出水，但通过供应美国本土关键材料，仍会争夺战略相关性、客户注意力和产业政策资本。在位者则包括已有 offtake
              关系、大资产负债表和运营深度的成熟矿商与精炼商。替代方案还包括进口材料、海外加工和传统项目开发商，在美国本土供给证明不足时，它们可能继续服务美国。这个维度重要，因为 Mariana
              试图同时打赢技术场和工业场：既要显得比在位者更敏捷，又要比技术主导型同业更具商业真实性。
