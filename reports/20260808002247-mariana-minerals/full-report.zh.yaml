        title: 客户、用户和付款方大概率是谁
        blocks:
          - type: paragraph
            body: >-
              Mariana
              的客户地图并不典型，因为公司站在工业软件和实体大宗商品供应之间。真正具有经济意义的外部付款方，可能是铜买家、电池和正极材料供应链参与者、OEM，以及能够通过长期或现货合同承接锂产品的中间商。MarianaOS
              的日常用户不是外部企业软件用户，而是 Copper One 和 Lithium One
              的内部运营人员、工程师和工艺团队。在当前公开记录中，建设期的近端经济付款方仍是投资人，终端客户大多仍是未来签约买家。这意味着分层问题必须区分买方、用户、付款方和证明来源。Mariana
              还有一层战略交易对手，它不等同于终端需求，但对商业化仍然重要：Select Water 为 Lithium One 提供基础设施验证，Pronto 为 Copper One
              的自动化提供部署验证。因此，公开证据支持一种分层：未来大宗商品买家、当前运营用户、赋能型商业伙伴，以及可能打开渠道但本身不能证明复购需求的战略资本提供方。
