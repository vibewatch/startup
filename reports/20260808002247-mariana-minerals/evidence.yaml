    whyItMatters: >-
      Cross-commodity market numbers are easy to misuse, especially when different sources use tonnes Li, LCE, and
      refined metal volumes.
    diligencePath: Ask management for one internal TAM/SAM/SOM model with unit definitions and price assumptions.
