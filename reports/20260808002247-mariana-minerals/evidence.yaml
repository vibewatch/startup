evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Audited or management-certified revenue, gross margin, and run-rate disclosure for Copper One and any interim
      product sales.
    whyItMatters: >-
      Without revenue quality and margin data, investors cannot judge whether Mariana is still pre-revenue,
      early-revenue, or already generating meaningful asset cash flow.
    diligencePath: >-
      Request current management reporting package with monthly production, realized pricing, gross profit, and
      site-level opex.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: Board composition, observer rights, and governance terms for Series A and Series B investors.
    whyItMatters: >-
      Governance determines control, financing flexibility, and whether strategic investors have blocking or
      preferential rights.
    diligencePath: Request board roster, investor-rights summary, and any side-letter list from counsel.
    relatedQuestionRefs:
      - QO017
      - QO021
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: copper-one-acquisition
    missingEvidence: >-
      Exact purchase price, transaction structure, and any reclamation or legacy-liability assumptions tied to the
      Copper One acquisition.
    whyItMatters: >-
      Asset entry price and inherited obligations shape return-on-capital and downside scenarios for the flagship copper
      thesis.
    diligencePath: Obtain acquisition agreement summary, title/permit schedule, and assumed-liabilities schedule.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: series-b-terms
    missingEvidence: Liquidation preference stack, anti-dilution terms, project-level SPVs, and investor ownership after the Series B.
    whyItMatters: >-
      A headline valuation can materially overstate common-equity value if preference overhang or structurally senior
      project capital is large.
    diligencePath: Request latest cap table, financing docs, and project-level capital structure map.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: copper-target-timing
    missingEvidence: >-
      A reconciled management statement showing current Copper One output, current plant utilization, and the exact year
      for the 50,000 tpa target.
    whyItMatters: Public sources agree on the target magnitude but differ on whether it is a near-term ramp or a 2030 objective.
    diligencePath: Ask management for the current production dashboard and phased ramp plan.
    relatedQuestionRefs:
      - QO019
  - type: missing-source
    severity: material
    topic: pricing-premium
    missingEvidence: >-
      Named buyer or signed contract showing what premium, if any, a customer will pay for Mariana’s domestic copper or
      lithium output versus imported supply.
    whyItMatters: >-
      The market case assumes resilience value, but there is no public proof yet that buyers convert this into higher
      realized pricing or stronger take-or-pay terms.
    diligencePath: Request offtake drafts, pricing formulas, or third-party customer interviews.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: copper-offtake
    missingEvidence: >-
      Named Copper One customers, product qualification status, or term-sheet evidence with mills, traders, or
      fabricators.
    whyItMatters: >-
      Without channel proof, the copper market thesis remains a demand narrative rather than a commercialized
      go-to-market.
    diligencePath: Obtain customer pipeline, cathode spec sheets, and any signed qualification milestones.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: lithium-offtake
    missingEvidence: >-
      Specific lithium offtake counterparties, contract duration, committed volumes, and qualification milestones for
      Lithium One.
    whyItMatters: >-
      Fastmarkets indicates negotiations exist, but absence of public contract proof keeps customer conversion risk
      high.
    diligencePath: Request offtake LOIs, qualification test results, and buyer list under NDA.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-estimate-units
    missingEvidence: >-
      A unified management sizing framework that reconciles copper tonnes, lithium content, and lithium-chemical units
