              - CV031
              - CV040
      - number: '8.3'
        title: Financing context, comparables, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The cleanest public price anchor is the August 2026 Series B itself: $310 million raised at a $1.5 billion
              post-money valuation and roughly $400 million total capital raised. That is a serious but not absurd
              valuation for a private company trying to own both software optionality and critical-minerals assets. The
              problem is that the comp set cuts both ways. Mariana is already worth more than public DLE names like
              Standard Lithium and Lithium Americas on a market-cap basis, despite those companies offering more public
              disclosures and, in some cases, clearer offtake and permitting milestones. On the other hand, Mariana is
              far smaller, earlier, and less proven than major listed material producers or royalty companies such as
              Albemarle, Freeport-McMoRan, Royal Gold, Franco-Nevada, and Wheaton Precious Metals. Entry discipline
              therefore has to ask what exactly the premium is paying for. The answer is a blend of domestic
              supply-chain relevance, software-option value, and multi-asset upside—not current financial proof. That
              makes the mark understandable, but also fragile if milestones slip.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV004
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The scenario range is unusually wide because Mariana is simultaneously an operating story, a financing
              story, and a technology-premium story. In the bull case, Copper One demonstrates real software-led
              economics, Lithium One secures anchor customers and remains on track for 2027 production, and additional
              capital arrives on reasonable terms; that can support a valuation well above the current round. In the
              base case, proof arrives slowly, the company remains interesting, and the current mark proves roughly fair
              but not obviously cheap. In the bear case, customer proof slips, autonomy benefits remain narrative-heavy,
              or financing becomes more punitive; that would imply a lower fair value than the Series B. Because public
              data on economics is thin, these scenarios are best interpreted as discipline tools rather than precise
              price targets. They clarify what evidence must arrive to justify upside and what failures would compress
              valuation quickly.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV003
