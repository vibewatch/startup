            body: >-
              Mariana’s go-to-market motion appears to be slow-cycle, qualification-heavy industrial selling rather than
              rapid-volume customer acquisition. Copper customers care about product specification, reliability, and
              delivery, while lithium buyers require qualification and often prefer long-term offtake structures.
              Fastmarkets says Mariana expects Lithium One to allocate roughly 70% of production under long-term
              offtakes with the rest sold on spot markets, which is consistent with an industrial contracting model.
              Public disclosures also point to use of intermediaries in addition to direct OEM relationships, suggesting
              Mariana may balance bankable long-dated contracts with channel flexibility. The company’s investor
              roster—Khosla, a16z, Breakthrough Energy Ventures, BHP Ventures, Mitsubishi, In-Q-Tel—likely helps
              credibility with strategic counterparties, but it does not substitute for signed customer proof. There is
              no public data on sales cycle length, customer-acquisition cost, payback, channel rebates, or renewal
              economics because the company is not selling software. The best public proxy for sales efficiency is
              milestone progression: Copper One restart speed, Lithium One construction progress, and the pace at which
              counterparties convert from dialogue to binding offtake.
