  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who the customers, users, and payers probably are
        blocks:
          - type: paragraph
            body: >-
              Mariana’s customer map is atypical because the company sits between industrial software and physical
              commodity supply. The external payers that matter economically are likely copper buyers, battery and
              cathode supply-chain participants, OEMs, and intermediaries able to take lithium product under long-term
              or spot contracts. The day-to-day users of MarianaOS are internal operators, engineers, and process teams
              at Copper One and Lithium One rather than outside enterprise-software users. In the current public record,
              investors remain the near-term economic payers for the buildout while end customers are still mostly
              future contracted buyers. This means the segmentation problem has to separate buyer, user, payer, and
              proof source. Mariana also has a strategic-counterparty layer that is not the same as end demand but still
              matters to commercialization: Select Water provides infrastructure validation for Lithium One, and Pronto
              provides deployment validation for autonomy at Copper One. Public evidence therefore supports a tiered
              segmentation: future commodity buyers, current operating users, enabling commercial partners, and
              strategic capital providers who may open doors but do not themselves prove recurring product demand.
