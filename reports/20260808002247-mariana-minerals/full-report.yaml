            title: Mariana is underwriting real industrial assets, not just selling AI tools
            body: >-
              Owning Copper One and building Lithium One creates harder execution risk than SaaS, but it also means
              Mariana can capture commodity upside and operational learning directly if MarianaOS improves throughput,
