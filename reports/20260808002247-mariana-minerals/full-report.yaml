            body: >-
              The public record suggests Mariana is past the point of being a purely conceptual customer story, but it
              is not yet at the point of proven customer durability. There is credible operating proof through Copper
              One, credible infrastructure proof through Select Water, and credible buyer-intent signals via Lithium One
              offtake discussions. What is missing are the fields most investors care about for commercial confidence:
              named buyers, signed offtake contracts, repeat purchase behavior, concentration disclosure, and
              satisfaction or retention evidence. Mariana’s customer risk is therefore not lack of market need but lack
              of disclosed commercial closure. The most important diligence asks are simple: name the buyers, show the
              contract terms, quantify qualification progress, and separate operating partners from actual customers.
              Until then Mariana should be treated as pre-broad-adoption with strategically meaningful but still
              incomplete customer proof.
            claimRefs:
              - CU029
              - CU030
              - CU031
              - CU032
              - CU033
              - CU034
              - CU035
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Counterparty proof is real even if end-buyer proof is weak
            body: >-
              Select Water and Pronto matter because they show external organizations are willing to commit
              infrastructure and autonomy systems around Mariana’s projects.
            calloutType: strength
            claimRefs:
              - CU009
              - CU015
              - CU016
          - type: callout
            title: Commercial closure is still mostly hidden
            body: >-
              Public buyer names, contract terms, retention metrics, and concentration data are still absent. That keeps
              Mariana in an early commercial-proof bucket despite encouraging strategic signals.
            calloutType: risk
            claimRefs:
              - CU018
              - CU022
