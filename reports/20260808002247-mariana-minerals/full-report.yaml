              - CR010
              - CR018
              - CR026
              - CR027
              - CR037
      - number: '7.2'
        title: Operational, technical, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Mariana is doing several difficult things at once. Copper One requires continuous
              mine-and-refinery coordination, feedstock variability management, and a credible path from restart
              narrative to materially higher output. Lithium One requires scaling a produced-water lithium process into
              dependable commercial output in a market where even focused peers still face engineering and financing
              gates. Mariana’s software and autonomy claims increase upside but also create failure modes: bad
              instrumentation, model drift, weak human override design, or poor partner integration can harm throughput,
              quality, or safety. Public sources describe simulation, predictive maintenance, reinforcement learning,
              and control loops, which is specific enough to take seriously but not specific enough to verify
              independently. The core operational risk is therefore not that the company lacks a plan; it is that the
              plan touches many tightly coupled systems with limited public KPI proof.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
