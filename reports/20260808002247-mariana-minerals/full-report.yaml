              - CR011
              - CR025
              - CR029
              - CR038
      - number: '7.3'
        title: Partner and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Mariana’s model depends on more counterparties than a simple “own the asset” story implies. Select Water
              is strategically important to Lithium One’s infrastructure logic, and Pronto is important to the autonomy
              deployment story at Copper One. Strategic investors may help with future financing or commercial
              introductions, but they can also create expectation risk if milestones slip. End-customer dependence is
              likely to be concentrated when it eventually becomes visible: a small number of anchor offtakes could
              dominate revenue, making counterparties powerful. The good news is that the current partner set looks
              credible and industrially relevant. The bad news is that concentrated, high-value partners can become
              chokepoints. Public evidence does not disclose substitution options, termination terms, or fallback plans
              if a key counterparty changes strategic direction. That makes dependency risk material even before any
              obvious counterparty stress appears.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
