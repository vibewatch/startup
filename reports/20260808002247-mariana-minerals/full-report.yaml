  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Mariana actually delivers
        blocks:
          - type: paragraph
            body: >-
              Mariana does not appear to sell generic mining software into a broad external customer base. Instead, its
              public materials frame the company as an owner-operator of critical-minerals assets whose proprietary
              operating system improves how projects are built, mines are run, and refining plants are controlled. The
              named software layers are CapitalProjectOS for capital delivery, MineOS for mine operations, and PlantOS
              for refinery management. These are paired with physical assets: Copper One in Utah and Lithium One in
              Texas. In practical workflow terms, Mariana is selling future copper and lithium output produced from a
              tighter human-machine operating loop, not simply code. This distinction is important because the product’s
              utility must be judged by safety, throughput, recovery, cost, and deployment speed—not by seats, APIs, or
              UI polish alone. Public sources suggest the company sees software and industrial execution as inseparable.
