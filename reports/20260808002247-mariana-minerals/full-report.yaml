              - CV039
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Current price already assumes more proof than public sources provide
            body: >-
              Mariana may still win, but the public record is not yet rich enough to justify aggressive entry at $1.5B
              without private diligence.
            calloutType: risk
            claimRefs:
