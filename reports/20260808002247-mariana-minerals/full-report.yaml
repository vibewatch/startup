  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Mariana’s regulatory exposure spans mine operations, refining, water handling, and any industrial autonomy
              deployment layered on top. Lithium One’s produced-water model sits in a water-and-oilfield regulatory
              context where EPA Class II injection-well rules, state-level water and disposal regimes, and environmental
              permitting all matter. Copper One and any future mine expansion sit within federal and state mining-law
              frameworks and mine-safety oversight. These exposures are manageable in principle, but they are
              non-trivial because Mariana is trying to accelerate timelines in sectors where permits, environmental
              controls, and operating rules can create delays or cost inflation. The public record does not surface
              litigation or enforcement against Mariana, which is good, but it also does not provide a permit matrix,
              incident history, or an environmental and safety compliance dashboard. Mariana’s posted privacy policy
              helps only at the web-governance layer; it does not answer the more important industrial legal questions
              around site safety, environmental obligations, or operational assurance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
