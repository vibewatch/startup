  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacents, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Mariana’s competitive set spans several classes that solve adjacent slices of the same supply-chain
              problem. The direct peer bucket includes AI-native or software-forward critical-mineral developers such as
              KoBold Metals and, on the lithium side, project-backed DLE companies such as Standard Lithium, Lilac
              Solutions, and EnergyX. Adjacent competitors include downstream platforms like Redwood Materials that do
              not mine ore or produced water directly but still compete for strategic relevance, customer attention, and
              industrial-policy capital by supplying domestic critical materials. The incumbent bucket includes
              established miners and refiners with existing offtake relationships, large balance sheets, and operational
              depth. The status quo substitute remains imported copper and lithium chemicals processed outside the
              United States. This matters because Mariana is trying to beat both a technology field and an industrial
              field at once: it must look more agile than incumbents while also looking more commercially real than
              technology-led peers.
            claimRefs:
              - CP001
              - CP002
              - CP003
