      - number: '1.5'
        title: Adverse Signals, Contradictions, and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest pushback on the Mariana story is not that the company lacks ambition; it is that public
              disclosure still lags the valuation. No reviewed source provided audited revenue, gross margin, cash burn,
              debt, project-level capex, board membership, or the detailed preference stack behind the financing rounds.
              Independent reporting reinforces that autonomy in mining and unconventional lithium extraction both face
              hard implementation risks. AI Weekly explicitly cautioned that Copper One production levels and unit
              economics remain unverified and that autonomous mining has a history of overpromising. The Dallas Fed
              separately noted that unconventional U.S. lithium projects often face low prices, billion-dollar capex
              needs, long payback periods, and commercialization slippage. Mariana also presents some metric drift
              across sources: Copper One is described as ramping toward 50,000 metric tons per year, but only some media
              specify a by-2030 frame; similarly, media describe Lithium One as Texas-based while company and
              Fastmarkets materials extend the feedstock and infrastructure footprint into western Louisiana and East
              Texas. These are manageable ambiguities, but they reinforce that the company should be diligenced as an
              execution-heavy industrial startup rather than a de-risked software platform.
            claimRefs:
              - CO034
              - CO035
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
