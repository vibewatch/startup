      - number: '3.2'
        title: Direct competitor profiles and what each owns
        blocks:
          - type: paragraph
            body: >-
              KoBold Metals is the most obvious private comparison point because it also wraps a software-and-AI story
              around critical minerals, but the model is different. KoBold’s public materials emphasize exploration
              science, machine prediction, and very large-scale copper development at Mingomba, where KoBold says output
              is expected above 300,000 metric tonnes annually in the early 2030s. Redwood Materials sits farther
              downstream: it recycles batteries, produces lithium, nickel, cobalt, copper, and cathode active material,
              and deploys energy storage for data centers and the grid. EnergyX is a hybrid technology-plus-project
              company built around GET-Lit membranes and lithium projects such as Lonestar and Black Giant. Standard
              Lithium is a near-commercial U.S. lithium developer focused on Arkansas and East Texas, and Lilac is the
              most disclosed commercially mature DLE benchmark in this source set, with manufacturing, EPCM, and binding
              offtake milestones. Mariana’s distinctive combination is brownfield copper restart plus produced-water
              lithium plus mine/refinery autonomy. No single peer covers exactly that blend.
