              described as a single source of truth across planning, engineering, procurement, cost control, scheduling,
              and construction management. MineOS monitors and orchestrates decisions across geology, fleet, haulage,
              maintenance, and workforce coordination. PlantOS is oriented toward refining performance, including
              control of heap bioleaching, solvent extraction, electrowinning, and lithium process steps. Copper One
              functions as the main public proof site for combined software-and-operations claims, while Lithium One
              extends the stack into produced-water lithium extraction and process development. The careers surface
              reinforces the same picture: Mariana is staffing software development, process development, mining
              operations, plant-and-process engineering, and site roles in parallel. This is not a thin software overlay
              on someone else’s mine; it is a full-stack industrial operating model.
