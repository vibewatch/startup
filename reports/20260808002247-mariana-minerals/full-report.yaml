      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: High-risk status comes from stacked execution, not just from one permit or one customer
            body: >-
              Mariana is attempting to synchronize software, copper operations, lithium process scale-up, partners, and
              financing. The combined system matters more than any single headline risk.
            calloutType: risk
            claimRefs:
