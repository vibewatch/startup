            body: >-
              There is no public retention dataset for Mariana. No NRR, GRR, renewal, churn, cohort, or satisfaction
              metric is disclosed, which is unsurprising for a still-ramping industrial platform. The most useful proxy
              for retention today is continued partner commitment and milestone progression: Select Water’s broader 2026
              disclosures show it continues to invest in water infrastructure and won new contract work, while Pronto
              continues marketing mining autonomy as an active operating business. These facts do not prove
              Mariana-specific renewals, but they do reduce the risk that the counterparties are ephemeral. Expansion
              logic is plausible: if Copper One proves low-cost, autonomy-enabled production, Mariana can add more
              buyers or more sites; if Lithium One reaches commercial production with a long-term offtake base, buyer
              expansion could follow. Concentration risk remains high. Initial commercial success will likely depend on
              a small number of large industrial counterparties whose procurement cycles are long and whose bargaining
              power is significant. The most realistic customer outcome over the next phase is not a diversified
