      - number: '3.3'
        title: Capability, packaging, and commercial proof comparison
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is not the same as commercial readiness. Mariana’s public stack spans CapitalProjectOS,
              MineOS, and PlantOS and is applied to both copper and lithium assets, which suggests stronger cross-site
              operating ambition than many lithium-only DLE peers. But public commercial proof still lags some
              competitors. Lilac has disclosed a binding 10-year take-or-pay offtake agreement, Phase 1 capacity, EPCM
              partner, and U.S. manufacturing line. Standard Lithium has disclosed a binding offtake with Trafigura and
              a clearer pre-FID milestone map. Mariana, by contrast, has only publicly indicated ongoing OEM and
              intermediary negotiations for Lithium One. KoBold has larger funding and world-class asset scale but is
              less obviously focused on brownfield autonomy and hydrometallurgical process control. Redwood has
              unmatched downstream scale in domestic battery recycling and energy-storage deployment, but its business
              model is fundamentally different from Mariana’s mine-and-refinery ownership model. Across private peers,
              exact pricing is rarely public; the more relevant comparison is contract structure, disclosed customer
              proof, and stage-gate readiness.
