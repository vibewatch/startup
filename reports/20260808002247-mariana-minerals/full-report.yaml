      - number: '2.5'
        title: Market Judgment and Remaining Sizing Gaps
        blocks:
          - type: paragraph
            body: >-
              The market takeaway is that Mariana’s addressable opportunity is economically large but operationally
              narrow in the near term. Copper and lithium both benefit from structural demand, domestic-sourcing policy
              interest, and refining bottlenecks that should reward reliable U.S. production. At the same time,
              Mariana’s lithium SOM is tiny relative to the national buildout problem, and its copper target should be
              viewed as a site-level expansion plan rather than a solution to U.S. import dependence. The company does
              appear to be aiming at the right choke points — refined units, not just upstream resource claims — and
              that is important because midstream value capture is where many Western supply chains remain weak. The
              unresolved market questions are whether buyers will pay a domestic resilience premium, whether Mariana can
              qualify product quickly enough, and whether its software actually reduces cost and ramp time enough to
              offset the structural disadvantages of new U.S. supply projects.
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is large because the bottleneck is physical supply, not software adoption
            body: >-
              Mariana’s addressable value comes from producing scarce refined units inside constrained supply chains. If
              Copper One and Lithium One work, the software matters because it makes tonnes cheaper and faster, not
              because buyers separately pay for software seats.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM031
          - type: callout
            title: Lithium One is a strategic wedge, not a scale solution by itself
            body: >-
              A 3,000 tpa lithium-salts target can still matter commercially, but it is small relative to both the U.S.
              project pipeline and peer DLE ambitions. The investment case requires replication and qualification, not
              just a first-site startup.
            calloutType: risk
            claimRefs:
              - CM015
