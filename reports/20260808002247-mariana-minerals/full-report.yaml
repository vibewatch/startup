          - type: callout
            title: The upside is real if milestones convert
            body: >-
              A real Copper One operating wedge plus bankable Lithium One customers could move Mariana from an ambitious
              story to a de-risking industrial platform faster than many early resource startups.
            calloutType: strength
            claimRefs:
              - CV002
              - CV014
              - CV024
