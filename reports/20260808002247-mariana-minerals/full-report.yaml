      - number: '2.2'
        title: TAM / SAM / SOM Through Copper and Lithium Supply Lenses
        blocks:
          - type: paragraph
            body: >-
              The total addressable market is clearly large, but the useful diligence question is how much of it Mariana
              can plausibly access from its first two sites. On copper, USGS puts 2025 U.S. apparent primary refined
              copper and old-scrap consumption at 2.2 million metric tons, with 57% net import reliance and 1.7 million
              tons of refined imports. Using the 2025 U.S. producer cathode price of $4.90 per pound implies a domestic
              refined-copper demand pool above $20 billion annually. On lithium, USGS pegs global 2025 consumption at
              263,000 metric tons lithium content, with an average battery-grade lithium carbonate price of about $9,000
              per ton and U.S. net import reliance greater than 50%. Dallas Fed work shows 66 U.S. lithium projects, but
              only a small number are under construction and many require more than $1 billion of capital. Mariana’s
              immediate SOM is therefore much smaller: a 50,000 tpa copper target at Copper One and a 3,000 tpa
              lithium-salts target at Lithium One, with the latter representing a meaningful pilot-commercial wedge
              rather than a market-shaping scale position. The investment case depends on whether those first units
              become a replicable platform, not on the first-site volume alone.
            claimRefs:
