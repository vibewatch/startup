      - number: '7.4'
        title: Financial and model risk
        blocks:
          - type: paragraph
            body: >-
              Financial risk remains high because public visibility into burn, cash, debt, and project-finance strategy
              is low while capital needs are plainly large. The company has raised meaningful capital, but it is
              advancing two industrial projects plus a software-and-automation build. That combination is expensive even
              when milestones are met; it becomes much more expensive if schedule slips or qualification takes longer
              than planned. Commodity exposure adds another layer. Copper and lithium markets may be strategically
              attractive, but they are still volatile and cyclic. Mariana’s story also relies on autonomy and software
              improving economics, yet public evidence does not show the size or durability of that uplift.
              Financial-model risk therefore includes both classic capex risk and a subtler proof-risk: if the software
              benefit is smaller than hoped, Mariana could end up looking like a capital-hungry miner with a thinner
              moat than the current valuation assumes.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
          - type: table
            tableRef: TR004
            claimRefs:
