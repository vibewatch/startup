chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Mariana Minerals describes itself as a software-first, vertically integrated minerals company focused on
              supplying the metals needed for AI infrastructure, electrification, and defense systems. The company was
              founded in 2024, is headquartered in San Francisco, and frames its mission as rebuilding the U.S.
              critical-minerals supply chain by combining industrial execution with reinforcement-learning software and
              project orchestration tools. Unlike a software vendor selling mine-tech subscriptions, Mariana owns and
              operates assets itself: the business model is to acquire, build, restart, or expand mineral projects and
              improve their economics with MarianaOS. That distinction matters because Mariana is underwriting commodity
              price, permitting, construction, and operating risk directly rather than capturing high-margin SaaS
              revenue. The company says its near-term goal is to build ten projects in ten years and that Copper One and
              Lithium One already use the three MarianaOS modules — CapitalProjectOS, MineOS, and PlantOS — across
              buildout, mine orchestration, and refining control. Public materials consistently position Mariana closer
              to a project developer-operator with AI leverage than to a pure mining software startup.
