  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, monetization, and recognition logic
        blocks:
          - type: paragraph
            body: >-
              Mariana’s public materials indicate a physical-products revenue model rather than a software-licensing
              model. Copper One is described as a copper mining and refining asset intended to reach 50,000 metric
              tonnes per year of combined geologic and scrap-fed output, which implies revenue from copper cathode or
              other refined copper units sold into industrial channels. Lithium One is positioned as a produced-water
              lithium facility serving OEMs and intermediaries, with Fastmarkets reporting Mariana is negotiating
              long-term and spot-style offtake structures. The company markets MarianaOS as the execution layer across
              capital projects, mine operations, and plant management, but no public source indicates that Mariana sells
              MarianaOS as standalone software; it appears to monetize through asset ownership and operating
              performance. That distinction matters because revenue recognition and gross-profit structure should look
              like industrial commodity supply: realized price, delivered tonnage, recovery rate, and contract mix
              matter far more than seats or subscriptions. The public source set does not disclose current production
              revenue, realized copper price, lithium product mix, or any active revenue base. Investors therefore have
              to treat the model as economically plausible but not yet financially transparent.
