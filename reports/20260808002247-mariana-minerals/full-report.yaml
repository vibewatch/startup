  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Mariana’s market is best defined as domestic supply of refined copper and battery-grade lithium chemicals
              rather than “AI for mining.” Copper One is aimed at selling refined copper cathode into U.S. industrial
              demand, while Lithium One is designed to sell battery-grade lithium salts produced from oil-and-gas
              wastewater. That means the relevant spend pools are metal and chemical procurement budgets, not enterprise
              software budgets. The status quo is not another startup dashboard; it is imported refined copper, imported
              lithium carbonate or hydroxide, conventional mining/refining capacity operated by large incumbents, and in
              some cases export of U.S. raw or scrap material for foreign processing. This boundary matters because
              Mariana’s economic proposition depends on delivering physical units with schedule, quality, and cost
              credibility. The company’s software can only monetize if it changes project economics or supply
              reliability enough to win real commodity offtake. In practice, Mariana is trying to insert itself into a
              market where buyers care about price, impurity profile, domestic-source resilience, and continuity of
              supply more than they care about software novelty.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
