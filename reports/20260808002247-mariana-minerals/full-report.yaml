  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is coherent. Mariana sits in a strategically important market, owns or controls real asset
              proof points, and has a differentiated software-plus-operations story that is more concrete than many
              industrial-AI startups. Copper One gives it a public operating site, Lithium One gives it a high-upside
              domestic lithium wedge, and the investor base suggests the company has attracted serious conviction. The
              anti-thesis is equally clear: almost every underwriting-critical field remains private. The public record
              does not show revenue, margins, signed end-buyer contracts, burn, or an auditable capital plan. That means
              the current valuation rests more on a forward option value than on de-risked operating performance.
              Mariana may deserve a premium to a purely conceptual software company or a pre-asset slideware startup,
              but it does not yet deserve to be treated like a proven industrial operator. The key valuation question is
              therefore not whether the story is interesting; it is whether $1.5B already discounts too much of the
              future proof curve.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
