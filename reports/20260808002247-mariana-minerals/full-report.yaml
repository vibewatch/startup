      - number: '8.5'
        title: Exit readiness, thesis-breaks, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Mariana is not public-market ready on current public evidence. It may be institutionally financeable in
              private markets because strategic investors can underwrite longer-duration industrial options, but an
              IPO-quality record would require much more operating disclosure. The most likely future positive exit
              paths are: a later-stage private round at improved proof, a strategic transaction once one or both assets
              are materially de-risked, or an eventual public listing after customer, capex, and operating metrics are
              clearer. The most important diligence asks are direct and familiar from the earlier chapters: current cash
              and burn, signed or near-signed buyers, site-level unit economics, permit status, partner terms, and
              measured Copper One / Lithium One performance deltas. The thesis-break triggers are also clear: no
              credible customer closure around the 2027 lithium target, no measurable software-driven operating uplift,
              regulatory or safety disruptions, or punitive next-step financing. Until those are resolved, the valuation
              call should stay evidence-sensitive and cautious.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
