        title: Cost structure, gross-margin drivers, and missing unit economics
        blocks:
          - type: paragraph
            body: >-
              The likely cost stack is legible even though the actual numbers are not. Copper One’s economics will be
              driven by mining productivity, heap leach and SX-EW recovery, refining throughput, energy, reagents,
              maintenance, labor, and logistics. Lithium One adds produced-water handling, extraction media or chemical
              inputs, water-treatment infrastructure, and conversion costs before any battery-grade product can ship.
              Brownfield and partner-based choices should reduce some upfront spending relative to greenfield analogs:
              Copper One leverages an acquired idle site and refining package, while Lithium One pairs with Select Water
              around produced-water infrastructure. But lower relative capex does not mean low absolute capex. Peer and
              partner benchmarks remain large: Select Water alone guided to $250-$290 million of 2026 net capex and
              reported $277.8 million of liquidity at June 30, 2026, underscoring the scale of infrastructure spending
              that produced-water systems can require. Publicly disclosed unit-economics fields for Mariana—cash cost
              per pound copper, lithium recovery rate, realized price, gross margin, working-capital cycle, and
              site-level utilization—are all unavailable, making underwriting impossible without management materials.
