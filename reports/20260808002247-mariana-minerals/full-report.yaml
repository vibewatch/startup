      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cash and burn
        - No public runway view
        - Determines financing risk and leverage
        - Request current cash, monthly burn, and debt schedule
      - - Customer contracts
        - No named buyers or terms
        - Determines revenue quality and bankability
        - Request signed / near-signed offtakes and qualification stage
      - - Unit economics
        - No public cash cost, recovery, or gross margin
        - Determines whether software changes economics materially
        - Request site-level KPI and cost model
      - - Permits and compliance
        - No public permit matrix
        - Determines timeline realism
        - Request permit tracker and compliance history
      - - Partner terms
        - No disclosed termination or substitution terms
        - Determines dependency severity
        - Request summaries of Select Water and Pronto agreements
      - - Milestone governance
        - No public milestone gating framework
        - Determines whether management is managing risk rigorously
        - Request PMO and board-milestone materials
    notes: If these asks are answered well, the recommendation could improve without any change in the external market.
