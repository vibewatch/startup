              - CR034
              - CR035
              - CR036
      - number: '7.5'
        title: People risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              People risk is visible in the hiring pattern. Mariana is recruiting across machine learning, process
              controls, mechatronics, metallurgy, drilling automation, pilot-plant operations, and site execution. That
              breadth supports the ambition of the model, but it also shows the company still depends on assembling and
              retaining a rare multidisciplinary team. Mitigants exist: strategic capital access, brownfield copper
              positioning, credible partners, and a mission aligned with industrial policy. Still, the most important
              monitors are straightforward. If Lithium One fails to translate dialogue into binding commercial
              contracts, if Copper One cannot show measurable operating improvement from the software stack, if
              regulatory or safety issues delay execution, or if additional financing arrives on punitive terms, the
              thesis weakens quickly. Mariana’s risk posture is therefore investable only for backers willing to monitor
              milestones closely and revise views as evidence arrives.
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
