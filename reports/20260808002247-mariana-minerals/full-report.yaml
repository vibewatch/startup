      - number: '1.3'
        title: Funding History, Investor Mix, and Capital Signaling
        blocks:
          - type: paragraph
            body: >-
              Mariana has moved unusually fast on fundraising for a company founded in 2024. Its July 2025 Series A
              announcement said the round was led by Andreessen Horowitz with continued support from Breakthrough Energy
              Ventures and Khosla Ventures, bringing total capital raised at that point to $85 million. Roughly thirteen
              months later, Mariana announced a $310 million Series B led by Khosla Ventures with participation from
              a16z, Breakthrough Energy Ventures, BHP Ventures, Mitsubishi Corporation, In-Q-Tel, and a longer list of
              new financial investors, bringing parent and project capital raised to approximately $400 million.
              Fortune, The Next Web, AI Weekly, and Discovery Alert all corroborate the $310 million round size and $1.5
              billion valuation. The cap table matters strategically: venture firms validate software ambition, BHP
              Ventures brings mining-industry signal, Mitsubishi suggests industrial-commercial relevance, and In-Q-Tel
              adds a U.S. national-security angle aligned with the company’s domestic-supply-chain narrative. The
              tradeoff is that Mariana is now priced like a high-conviction hard-tech platform before public evidence on
              revenue, margins, or stable production throughput is available.
