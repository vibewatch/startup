            body: >-
              The financial case for Mariana is directionally attractive but not yet underwritable from public evidence
              alone. Positively, the company appears to be monetizing real industrial outputs in markets with strategic
              demand, it has secured unusually strong investors for a private mining startup, and it is choosing
              operating models that may compress development timelines relative to greenfield peers. Negatively, nearly
              every underwriting-critical field is missing: current revenue, shipment volume, realized pricing, gross
              margin, EBITDA, burn, cash balance, debt covenants, project-finance assumptions, and contract backlog. The
              most important diligence blockers are whether Copper One can actually deliver a low-cost 50,000 tpa
              profile, whether Lithium One closes binding customer contracts and reaches commercial production in 2027,
              and whether the capital stack can absorb inevitable schedule volatility. Until those items are evidenced,
