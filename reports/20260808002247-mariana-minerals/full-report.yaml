      - number: '1.4'
        title: Asset Base, Operating Milestones, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              Mariana’s flagship assets are real projects rather than pilots-in-slideware. Copper One, announced in
              March 2026, is an operating copper mine and hydrometallurgical refinery in southeastern Utah that Mariana
              acquired in late 2025 from the prior Lisbon Valley team. Company and media sources agree the site includes
              mine, leach, solvent-extraction, and electrowinning infrastructure and that Mariana wants to integrate
              scrap feed alongside mined material. The public target is to scale combined output to 50,000 metric tons
              per year of refined copper, although sources differ on exact timing and current run-rate, so investors
              should treat the output target as aspirational rather than achieved. Lithium One, announced in October
              2025 and backed by a Select Water Solutions partnership, is designed as a GWh-scale produced-water lithium
              facility in East Texas / western Louisiana with up to 3,000 metric tons per year of battery-grade lithium
              salts and commercial production targeted for the first half of 2027. Together the assets give Mariana a
              more concrete industrial base than many critical-minerals startups, but they also expose the company to
              restart, commissioning, and commodity-cycle risk immediately.
