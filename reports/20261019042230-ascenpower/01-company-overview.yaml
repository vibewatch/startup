company:
  name: "AscenPower"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    AscenPower has credible public evidence of a real Guangzhou/Nansha silicon-carbide
    manufacturing buildout: the company traces back to a 2021 project launch, public
    sources place line connection in March 2023 and mass production in June 2023, and
    a company-supplied 2024 profile says it later closed an approximately RMB1 billion
    Series A. The same evidence is materially weaker on founders, board control, named
    investors, customer conversion, and revenue quality, so this chapter establishes
    industrial footprint and financing momentum more clearly than it proves operating
    performance.
sections:
  - id: "identity-footprint"
    title: "Identity, footprint, and industrial footprint"
    body: >-
      The assigned evidence consistently describes AscenPower (Guangdong Xinyueneng
      Semiconductor) as a Guangzhou, Nansha-based manufacturer and R&D company focused
      on automotive-grade and industrial-control silicon-carbide power devices, rather
      than a fabless design startup. Two public sources anchor the buildout around
      a 2021 project with a stated RMB7.5 billion investment plan for 240,000 6-inch
      wafers per year and 240,000 8-inch wafers per year, while public sources place
      line connection in March 2023, mass production in June 2023, and 10,000 wafers
      per month of 6-inch output by the end of 2023. Product scope is also consistent
      across sources: IGBT, SiC SBD/JBS, and SiC MOSFET devices targeting new-energy
      vehicles, industrial power, smart grids, and photovoltaic applications. The
      resulting picture is a real capital-intensive manufacturing program with credible
      physical milestones, but still without the audited operating disclosures that
      later underwriting will need.
    claimRefs: ["CO001", "CO002", "CO003", "CO005"]
    tableRefs: ["TO001"]
    figureRefs: ["FO001"]
  - id: "leadership-funding-stakeholders"
    title: "Leadership, funding, and stakeholder map"
    body: >-
      Public leadership disclosure in the assigned pool is thin. The only named
      executive-level figure is chairman Xiao Guowei, who appears in the June 2023
      manufacturing update, while a later company-supplied profile points to an
      experienced foundry-construction and technical team without naming the wider
      founder roster, board, or cap-table control structure. Funding visibility is
      similarly partial: the strongest current evidence is a company-originated 2024
      profile stating that AscenPower completed an approximately RMB1 billion Series A
      in September 2024, and Hurun's 2025 unicorn list adds a valuation signal that
      the company crossed the US$1 billion threshold for private-company inclusion.
      What remains missing is the information diligence actually needs for control and
      financing risk: named Series A investors, governance rights, liquidation
      preferences, board composition, and whether the unicorn signal corresponds to a
      priced round or only an index estimate.
    claimRefs: ["CO006", "CO007", "CO008"]
    tableRefs: ["TO002", "TO003"]
  - id: "traction-risks-and-gaps"
    title: "Traction, external pressure points, and open underwriting gaps"
    body: >-
      The assigned evidence supports early manufacturing traction, but it does not yet
      support a clean operating-performance read. In June 2023, AscenPower said it had
      signed more than 10 COT clients, and the November 2024 company profile says
      customer products using its chips had already reached batch production in
      industrial power, photovoltaic inverters, and charging-pile end markets. That is
      directionally positive, yet the pool still does not identify named
      mass-production automotive customers, current revenue-bearing customer count,
      revenue run rate, gross margin, headcount, or cash runway. External signals also
      complicate the story: independent industry mapping shows aggressive Chinese SiC
      capacity scaling, Li Auto's February 2025 disclosure shows OEM SiC insourcing is
      real, TrendForce reported a 2% year-over-year decline in global NEV sales in
      1Q26, and the available public pure-play SiC comparator has been volatile enough
      that peer
      multiples are weak proof of durable private value. The result is a company with
      tangible manufacturing progress but still substantial disclosure risk.
    claimRefs: ["CO004", "CO009", "CO010", "CO011", "CO012", "CO013", "CO014"]
