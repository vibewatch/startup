callouts:
  - calloutType: "strength"
    title: "Manufacturing existence is better evidenced than economics"
    body: >-
      The assigned pool does establish a real fab buildout: a 2021 launch, 2023 line
      connection and mass production, 10,000 wafers per month on the 6-inch line, and
      a 2024 financing event. Those are stronger than the usual aspirational startup
      signals.
    claimRefs: ["CO002", "CO003", "CO006"]
  - calloutType: "risk"
    title: "Governance opacity and industry pressure still dominate diligence"
    body: >-
      The company can point to capacity and policy-backed momentum, but investors still
      need named investors, board/control rights, customer conversion proof, and hard
      operating metrics while the surrounding SiC market faces insourcing, softer NEV
      demand, and volatile peer valuations.
    claimRefs: ["CO008", "CO011", "CO012", "CO013", "CO014"]
