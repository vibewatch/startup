      - ["Current throughput proxy", "36Kr says the line has entered mass production at 10k wafers per month", "Medium", "Earliest public signal that the fab is moving beyond construction into operating cadence", "Monthly sell-through, yield, scrap, and inventory build"]
      - ["Financing support vs. fab ambition", "About RMB1B Series A plus a possible newcomer award capped at RMB300M versus RMB7.5B project ambition", "Medium", "Suggests financing dependency unless there is undisclosed project finance or customer funding", "Cash balance, undrawn facilities, subsidy receipts, and covenant package"]
      - ["Working-capital profile", "Chinese EV supply chains can benefit from extended supplier payment terms, but AscenPower-specific DSO/DPO terms are undisclosed", "Medium", "Payment timing can change apparent cash efficiency even before true margin improvement", "Customer receivable aging, supplier terms, and inventory days"]
      - ["Gross margin / burn / runway", null, "Low", "These are the core underwriting inputs for capital adequacy and next-round timing", "Gross margin by node/product, monthly opex, capex plan, burn, and runway"]
