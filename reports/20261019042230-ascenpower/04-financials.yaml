company:
  name: AscenPower
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence frames AscenPower as a capital-intensive SiC manufacturing buildout rather than a disclosed operating business: third-party reporting cites a RMB7.5 billion fab project, roughly RMB1 billion of Series A funding, and a line now said to be at 10,000 wafers per month, but no retained source discloses revenue, gross margin, cash, burn, or runway. Industry sources suggest scale economics improve materially as eight-inch / 200mm production ramps, yet OEM insourcing and softer Chinese EV demand leave the company financially interesting but still difficult to underwrite from public data alone.
sections:
  - id: monetization-visibility
    title: Monetization is visible, but revenue quality is not
    body: >-
      The public record is enough to identify what AscenPower is trying to sell, but not enough to judge how much of that activity has turned into durable revenue. Third-party reporting describes a merchant SiC business aimed at automotive-grade and industrial power devices, with customer tape-out and sample-validation activity already underway, and it places the company in EV, smart-grid, photovoltaic, and industrial end markets. What is still missing is the revenue layer that matters most for underwriting: realized ASPs, customer concentration, segment mix, contract duration, and the conversion rate from signed tape-out programs into volume production. Even the more accessible English company-database surfaces remain skeletal, which reinforces that public databases are not substitutes for operating disclosure here.
    claimRefs: [CI005, CI006, CI011, CI012, CI014]
    tableRefs: [TI001, TI002]
  - id: capex-and-unit-economics
    title: Capex burden is clear; margin bridge is still largely private
    body: >-
      The clearest financial fact in the public record is the size of the manufacturing ambition. Independent reporting ties the project to RMB7.5 billion of planned investment and dual 6-inch / 8-inch nameplate buildout, while later reporting says the line has already entered mass production at 10,000 wafers per month. That matters because SiC economics are unusually sensitive to wafer size, yield, and utilization: industry sources explicitly call out the shift to eight-inch manufacturing as an economies-of-scale lever, and technical analysis says a 200mm wafer carries about 1.78x the area of a 150mm wafer. The problem is that none of the retained sources disclose yield, scrap, gross margin, or depreciation burden, so scale is visible but the actual unit-economics bridge remains largely private.
    claimRefs: [CI001, CI002, CI007, CI010, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: external-pressure-on-revenue-and-utilization
    title: External pressure points could slow pricing power and fab utilization
    body: >-
      The industry backdrop is supportive in the long run but demanding in the near term. Technavio still forecasts fast SiC market expansion, yet supplier capture is not guaranteed: CnEVPost reported Li Auto mass-producing its own SiC modules, and CNBC's Rhodium-backed reporting argues that the strongest Chinese EV cost advantages come from vertical integration, scale, and working-capital discipline rather than subsidies alone. TrendForce adds a second caution, noting a 2% year-over-year decline in global NEV sales in 1Q26, weak Chinese demand, and rising component-cost pressure. For AscenPower, that combination means the commercial question is not only whether demand exists for SiC, but whether enough of that demand remains available to an independent merchant supplier at acceptable pricing and utilization.
    claimRefs: [CI007, CI008, CI009, CI010, CI012]
  - id: capital-adequacy-verdict
    title: Capital adequacy is the core diligence blocker
    body: >-
      Public sources do show real financing momentum: 36Kr says AscenPower closed about RMB1 billion of Series A funding and reported a post-money valuation above RMB7 billion, and policy support in Nansha can offset a portion of fab capex. Even so, disclosed financing still looks small relative to the disclosed project scale, which implies further capital needs unless there is additional debt, subsidy, or customer-prepayment support that is not public. Because the retained sources do not disclose cash balance, debt terms, burn, working capital, or runway, the current evidence supports a forward-looking conclusion but not a full underwriting case: AscenPower may be building a strategically relevant SiC asset, but public data still leaves its financing dependency unresolved.
    claimRefs: [CI002, CI003, CI004, CI012, CI013]
