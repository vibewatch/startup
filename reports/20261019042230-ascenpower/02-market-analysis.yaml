callouts:
  - calloutType: insight
    title: Demand is not the same as monetizable share
    body: >-
      Independent signals support real SiC demand growth, but AscenPower's
      public disclosures still describe capacity and signed customers more
      clearly than monetizable production mix, so underwriting has to center on
      qualification and conversion rather than broad TAM.
    claimRefs: [CM004, CM006, CM008, CM010, CM015]
  - calloutType: risk
    title: Internalization and cost inflation can compress merchant upside
    body: >-
      OEM moves toward in-house SiC modules and broader cost pressure across EV
      platforms can both weaken merchant foundry pricing power even if overall
      end-market demand keeps growing.
    claimRefs: [CM007, CM012, CM013, CM014]
