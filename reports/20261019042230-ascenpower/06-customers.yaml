  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof set
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Unnamed signed tape-out customers (40+)
        - Automotive and broader SiC design ecosystem
        - Tape-out and sample / validation activity
        - Pilot and qualification, not confirmed production
        - Supports breadth of inbound commercial interest
        - No customer names, order values, or repeat-purchase data
      - - Unnamed COT customers (10+)
        - Foundry-style automotive and industrial programs
        - Customer engagement around outsourced SiC manufacturing
        - Commercial qualification stage
        - Shows earlier customer acquisition before line-scale ramp
        - Age of disclosure is older and customer overlap is unknown
      - - Unnamed customer-specific SKUs (4)
        - Customer programs with defined specifications
        - Products reportedly nearing customer-specific mass production
        - Pre-production / ramp-adjacent
        - Best public signal that some accounts moved past evaluation
        - No named account, SOP date, shipped volume, or revenue proof
    notes: >-
      This is intentionally a partial enumeration of the public proof that exists today; the chapter does not
      have named customer references in the assigned source pool, so anonymous proof sets are shown instead.
