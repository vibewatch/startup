company:
  name: AscenPower
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports a broad early customer funnel for AscenPower across automotive and industrial
    SiC use cases, with 40+ signed tape-out customers in 2024 and earlier disclosure of 10+ COT customers
    plus four customer-specific programs nearing mass production. The weak point is proof quality: the
    assigned sources do not name production customers, disclose retention metrics, or quantify concentration,
    while major EV OEMs are also internalizing SiC modules and tightening qualification pressure.
sections:
  - id: customer-segments-and-proof-quality
    title: Customer segments are broad, but public proof remains mostly anonymous
    body: >-
      The assigned sources consistently position AscenPower as a supplier to automotive-grade and industrial
      power-device buyers rather than a single-program specialist. Company-sourced and independent profiles
      point to use cases in new-energy vehicles, industrial power, smart grids, and photovoltaic equipment,
      which matters because SiC demand is pulled by several end markets rather than just passenger EVs.
      That breadth improves theoretical account coverage, but the proof stack is still weighted toward
      anonymous aggregates instead of named production deployments. The strongest public adoption claims are
      counts of signed customers and tape-out programs, not customer names, contract values, or production
      revenue shares, so the chapter's customer story is directionally positive but still thin on directly
      verifiable account-level evidence.
    claimRefs: [CU001, CU002, CU003, CU004, CU012, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory-and-qualification
    title: Adoption signals show a progressing funnel from qualification to early production
    body: >-
      The adoption trajectory is best read as a sequence of qualification milestones rather than as proof of
      durable recurring revenue. EET China, using company-sourced information from 2023, said AscenPower had
      signed more than 10 COT customers and was close to mass-producing four customer-specific products.
      36Kr later reported that the production line had entered mass production, reached monthly capacity of
      10,000 wafers, and signed tape-out agreements with more than 40 customers, including OEMs and sample
      validation accounts. Huacheng separately highlighted IATF16949 certification, which reduces one major
      automotive procurement hurdle. Together these signals support a view that AscenPower has moved beyond
      pure lab-stage demand, but they still stop short of naming customers, volumes shipped, or revenue
      conversion from pilot and validation work into sustained production programs.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU009, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Durability and concentration remain the biggest customer underwriting gaps
    body: >-
      The central diligence problem is not whether AscenPower can attract customer interest; it is whether
      that interest converts into sticky, diversified production revenue. None of the assigned sources
      disclose renewal rates, NRR, churn, contract length, or top-customer concentration, so durability has
      to be treated as unverified. External market signals add pressure. TrendForce reported a 2% year-on-
      year decline in global NEV sales in 1Q26 and said China's NEV market underperformed, while major OEMs
      such as Li Auto and Nio are pushing SiC modules closer to in-house control or designated production
      partners. That does not disprove AscenPower's growth story, but it means the company still faces real
      procurement friction, pricing pressure, and concentration risk until it can show named production
      accounts, repeat orders, and account-level revenue mix.
    claimRefs: [CU008, CU010, CU011, CU013, CU015, CU016]
callouts:
  - calloutType: insight
    title: Broad funnel, narrow proof
    body: >-
      Public evidence supports a real customer funnel across automotive and industrial SiC programs, but the
      proof quality is still mostly anonymous counts and qualification milestones rather than named production
      customers or renewal data.
    claimRefs: [CU003, CU004, CU005, CU012, CU013]
  - calloutType: risk
    title: OEM vertical integration can compress merchant-supplier leverage
    body: >-
      Li Auto and Nio's in-house or tightly partnered SiC module programs show that leading EV buyers may
      internalize more of the value chain, which can raise qualification standards and weaken pricing power
      for independent merchant suppliers.
    claimRefs: [CU010, CU011, CU015]
tables:
