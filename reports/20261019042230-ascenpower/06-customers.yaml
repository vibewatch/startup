      - Buyer / user / payer
      - Current public proof
      - Strategic value
      - Gap
    rows:
      - - NEV traction and powertrain
        - EV OEMs, module teams, and automotive-qualified SiC design houses
        - Public use-case positioning plus unnamed OEM and validation-customer references
        - Largest near-term volume pool and strongest fit with automotive-grade positioning
        - No named production customer, SOP timing, or revenue share disclosed
      - - Industrial power
        - Industrial power-equipment OEMs and control-system designers
        - Product descriptions repeatedly include industrial power use cases
        - Diversifies exposure beyond passenger EV cycles
        - No named deployments, contract structure, or renewal evidence
      - - Smart grid and utility power electronics
        - Grid-equipment makers and integrators
        - Included in company positioning and multi-vertical SiC demand map
        - Could support higher-voltage, longer-cycle accounts
        - No public customer names or procurement records in assigned sources
      - - PV inverter and energy applications
        - Inverter makers, storage-adjacent power-electronics teams
        - Included in company positioning and SiC end-market coverage
        - Adds non-auto expansion surface if qualification succeeds
        - No public proof of shipped volume or live installations
    notes: >-
      Uses public positioning and market evidence to map buyer surfaces; null customer-name proof means the
      assigned sources did not identify a named deployment for that segment.
    claimRefs: [CU001, CU002, CU012, CU014]
