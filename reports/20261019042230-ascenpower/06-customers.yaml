  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-proof-gap
      missingEvidence: Named production customers, deployment dates, and account-level use cases for the programs behind the 40+ and 10+ customer counts.
      whyItMatters: Without named production proof, it is impossible to separate real shipped adoption from qualification-stage pipeline.
      diligencePath: Request customer case studies, purchase-order evidence, PPAP or qualification milestones, and customer reference calls for top automotive and industrial accounts.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: Renewal, churn, NRR, GRR, contract length, and repeat-order data by cohort or major account.
      whyItMatters: Durability is the core underwriting question for a capital-intensive SiC fab, and public demand claims do not prove sticky revenue.
      diligencePath: Obtain cohort retention schedules, backlog or reorder data, and top-customer contract summaries from management or the data room.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, end-market mix, and any dependency on a small number of OEM or module programs.
      whyItMatters: A broad funnel can still hide single-account concentration if only a few programs convert into volume production.
      diligencePath: Request a customer concentration schedule by revenue and gross margin, split by automotive, industrial, grid, and PV programs.
