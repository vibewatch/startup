      - "Dependency"
      - "Risk"
    rows:
      - ["Project capital buildout", "Funds the fab, clean room, and equipment stack for automotive/industrial SiC output", "Large upfront capex plus state-backed semiconductor ecosystem support", "Execution can outrun commercial proof if utilization and customer SOP lag capacity"]
      - ["Clean room and equipment move-in", "Turns the project from construction into commissionable manufacturing space", "Facility completion, tool installation, and process commissioning", "Construction completion does not by itself prove repeatable yield or qualification"]
      - ["6-inch production line", "Current disclosed production base and the line most visibly tied to mass-production claims", "Stable substrate supply, yield learning, and customer validation throughput", "Public sources cite scale claims but not current utilization or scrap rates"]
      - ["8-inch production line", "Longer-term scale and cost roadmap embedded in project design", "Capex, tool readiness, and process transfer beyond current disclosed output", "Public evidence names designed capacity but not live 8-inch volume output"]
      - ["Automotive/customer qualification layer", "Converts tape-outs and samples into durable production revenue", "OEM/tier-1 validation, reliability testing, and program wins", "Public evidence shows signed and validation-stage customers, not named SOP programs"]
      - ["Industry supply chain context", "Determines whether AscenPower can scale with the broader SiC market", "Upstream substrate availability, wafer-size transition, and NEV demand", "Rising component costs and merchant-supplier disintermediation can compress pricing power"]
    notes: "This is an operating architecture rather than a software architecture; the largest unverified variables are qualification, utilization, and upstream SiC supply constraints."
    claimRefs: ["CE003", "CE005", "CE009", "CE011", "CE012"]
