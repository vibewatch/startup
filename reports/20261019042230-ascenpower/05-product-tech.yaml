company:
  name: "AscenPower"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "AscenPower's public product story is a manufacturing-first silicon-carbide stack: automotive and industrial SiC power devices built around a large 6-inch/8-inch fab project rather than a publicly documented software or module ecosystem. Independent reporting supports real fab-ramp milestones and product-family disclosures, but the public record still lacks named SOP programs, official datasheets, qualification evidence, and practitioner/developer signals that would prove how mature the automotive-grade claim is in production."
sections:
  - id: "product-scope-and-maturity"
    title: "Product scope is clear; maturity proof is still mostly company-framed"
    body: >
      The public evidence consistently describes AscenPower as a silicon-carbide power-device manufacturer focused on automotive and industrial power conversion rather than a broad semiconductor-design platform. Across JW Insights/Laoyaoba and 36Kr, the named portfolio is SiC SBD/JBS, MOSFET, and IGBT devices for new-energy vehicles, industrial power supplies, smart grids, and photovoltaic applications. The maturity signal is stronger than a concept-stage fab story: reporting says the company had reached mass production for a series of vehicle and industrial-control chips and disclosed 1200V plus 16mOhm/35mOhm specifications. The reports also use a 10,000-per-month 6-inch "chip" or "piece" capacity formulation without resolving whether the count denotes wafers or finished dies. The available evidence therefore remains weighted toward company-described progress rather than third-party verification of shipping programs, field reliability, or published product documentation.
    claimRefs: ["CE001", "CE002", "CE004", "CE013", "CE015"]
    tableRefs: ["TE001"]
  - id: "manufacturing-stack-and-dependencies"
    title: "The operating model is a fab buildout tied to wafer-scale execution and EV demand"
    body: >
      The architecture that is actually visible in public sources is an operating stack: clean-room completion, equipment move-in, line commissioning, then scale-up of 6-inch and 8-inch silicon-carbide capacity into customer tape-out and validation. AscenPower's project was reported as a RMB7.5 billion build with planned annual output of 240,000 6-inch and 240,000 8-inch SiC "chips," although the public wording does not settle whether those counts denote wafers or finished dies. The company framed the November 2022 clean-room milestone as the handoff to equipment move-in and commissioning. Industry sources matter because they explain what the company narrative does not: TrendForce and SemiconductorX describe a SiC supply chain constrained by automotive adoption, expensive upstream materials, and the 150mm-to-200mm transition. AscenPower's product story therefore depends on sustaining substrate, tooling, qualification, and yield execution through a capital-intensive manufacturing ramp.
    claimRefs: ["CE003", "CE005", "CE009", "CE011", "CE012"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-and-control-gaps"
    title: "Differentiation rests on domestic auto-grade positioning, but public controls remain under-documented"
    body: >
      Public differentiation claims are understandable: sources describe AscenPower as one of China's largest automotive-focused SiC manufacturing projects, highlight a fast 15-month buildout to formal line-through, and link the business to a domestic push for localized automotive-grade power semiconductors. Those are meaningful advantages if they translate into stable supply for local EV and industrial customers. The unresolved issue is control evidence. The available sources cite signed tape-out or sampling customers, but not named SOP automotive programs; they discuss product families and capacity, but not official datasheets, public qualification reports, or a visible developer or practitioner surface that would let outsiders inspect integration depth. Investors should therefore treat the moat as plausible but only partially verified, with the biggest diligence need on qualification, product documentation, and real customer production status.
    claimRefs: ["CE006", "CE007", "CE008", "CE010", "CE013", "CE014"]
    tableRefs: ["TE002"]
callouts:
  - calloutType: "strength"
    title: "The strongest public signal is execution speed on a hard manufacturing problem"
    body: "Independent reporting does not prove unit economics or automotive qualification, but it does show that AscenPower moved from project launch to clean-room completion and then to a mass-production narrative unusually quickly for a capital-intensive SiC fab build."
    claimRefs: ["CE003", "CE004", "CE005", "CE006"]
  - calloutType: "risk"
    title: "Public maturity evidence lags the mass-production story"
    body: "The chapter's key risk is not that AscenPower lacks a visible product category, but that public evidence still stops short of named SOP customers, official datasheets, qualification disclosures, and practitioner/developer proof that would validate the automotive-grade positioning in day-to-day field use."
    claimRefs: ["CE007", "CE008", "CE013", "CE014"]
