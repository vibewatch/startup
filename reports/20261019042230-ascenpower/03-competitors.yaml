      - [Wolfspeed, Global merchant incumbent, "$1.22bn market cap in Oct 2026; dedicated 200mm Mohawk Valley fab", "Global EV and industrial SiC demand", "Vertical integration from substrate to device and a disclosed 200mm manufacturing lead", "Chapter 11 restructuring shows scale has not translated into resilient economics"]
      - ["SICC / Shandong Tianyue", Chinese substrate-led incumbent, "State-supported expansion with growing device capability", "Merchant substrate and device supply into Chinese EV and industrial markets", "One of the Chinese producers scaling aggressively as share shifts toward local supply", "Retained pool does not provide public pricing or customer-specific proof in this chapter"]
      - ["Mitsubishi Electric", Japanese incumbent, "JPY100bn five-year investment plan for an 8-inch SiC fab", "Automotive, renewable-energy, and industrial power applications", "Incumbent balance-sheet capacity and explicit 8-inch expansion roadmap", "The retained pool does not show direct pricing or China-specific channel reach"]
      - ["Li Auto internal build", Captive OEM substitute, "Mass production started at Suzhou semiconductor and Changzhou drive bases", "Li Auto's own next-generation BEV launches", "Guaranteed internal demand can displace merchant module purchases on captive platforms", "Not an open merchant supplier to third-party OEMs"]
      - ["Nio internal build", Captive OEM substitute, "First C-sample rolled off line with production supplier support", "Nio high-voltage BEV platforms", "Shows another OEM path to qualify SiC internally before broad merchant procurement", "Still moving toward mass production rather than a disclosed broad installed base"]
    notes: Public evidence is uneven across operators; "scale / funding signal" mixes the most directly disclosed comparable indicators rather than forcing one metric.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - AscenPower
      - Merchant incumbents
      - Chinese merchant peers
      - Captive OEM builds
    rows:
      - ["Merchant openness to third-party buyers", "Yes; public materials describe external customers and customer agreements", "Yes; merchant substrate/device model", "Yes; merchant supply orientation", "No; internal vehicle programs consume the disclosed modules"]
      - ["Disclosed manufacturing posture", "6-inch mass production with 8-inch reserve line", "Dedicated 200mm and large fab footprints disclosed", "Aggressive scaling with state support; capacity detail uneven by operator", "Module production milestones disclosed, but broad merchant fab availability is not the goal"]
      - ["Automotive qualification signal", "Automotive-grade chips mass-produced / sampled and about to complete verification", "Existing auto-grade supplier position implied by leading-device/fab status", "Chinese supply share is rising, but the retained pool gives limited qualification detail by peer", "Qualification is linked to the sponsoring OEM's own vehicle platform"]
      - ["Route to demand", "External customer acquisition and tape-out conversion", "Global merchant sales and ecosystem partnerships", "Domestic Chinese merchant ecosystem", "Internal captive demand from the OEM's own BEV roadmap"]
      - ["Public pricing transparency", "Unknown in retained public sources", "Unknown in retained public sources", "Unknown in retained public sources", "Unknown in retained public sources"]
    notes: Unsupported cells are marked unknown or framed at the class level; the retained pool supports posture and route-to-market better than one-for-one spec parity.
    claimRefs: [CP001, CP002, CP003, CP005, CP008, CP009, CP010, CP013, CP014]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor / class
      - Public price or unit
      - Contract / packaging model
      - Included capabilities
      - Discounts / unknowns
      - Implication
    rows:
      - [AscenPower, "List pricing not publicly disclosed in retained sources", "Merchant chip supply to external customers", "SiC SBD/JBS, MOSFET, IGBT; 6-inch current ramp and reserved 8-inch line", "Realized ASP, rebates, and long-term contract terms are unknown", "Commercial diligence should focus on conversion from tape-out to production revenue, not headline price"]
      - [Wolfspeed, "List pricing not publicly disclosed in retained sources", "Merchant substrate-to-device supply", "Vertically integrated SiC manufacturing with dedicated 200mm fab footprint", "Program-level pricing and customer concentration are unknown here", "Scale is visible publicly, but margin durability is still questionable"]
      - ["Li Auto internal build", "No merchant list price; internal transfer economics not public", "Captive module supply for Li Auto vehicles", "In-house SiC power modules and next-generation drive assemblies", "Internal cost structure and make-versus-buy thresholds are unknown", "Internalization can remove high-volume vehicle programs from the merchant opportunity set"]
      - ["Nio internal build", "No merchant list price; internal transfer economics not public", "Captive module qualification with outside manufacturing partner", "1200V SiC module path tied to Nio's own high-voltage platform", "Ramp timing, yields, and internal economics are not public", "Even pre-mass-production captive programs weaken the assumption that OEMs must buy merchant modules"]
    notes: The retained pool does not publish comparable list prices, so this exhibit compares commercialization model and the missing price evidence directly.
    claimRefs: [CP005, CP006, CP009, CP010, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Merchant openness and disclosed manufacturing scale separate global incumbents from captive OEM substitutes, with AscenPower positioned between them.
    data:
      xAxis:
        label: Merchant openness / third-party availability
        min: 1
        max: 5
        lowLabel: captive / internal only
        highLabel: open merchant supplier
      yAxis:
        label: Disclosed manufacturing scale readiness
        min: 1
        max: 5
        lowLabel: prototype / qualification stage
        highLabel: dedicated fab or large-scale production
      points:
        - label: AscenPower
          x: 4
          y: 3
          detail: Merchant-facing automotive SiC supplier with current 6-inch production progress and reserved 8-inch expansion.
        - label: Wolfspeed
          x: 5
          y: 5
          detail: Open merchant supplier with dedicated 200mm fab and vertical substrate-to-device integration.
        - label: Chinese merchant peers
          x: 4
          y: 4
          detail: SICC, TanKeBlue, Sanan, and related Chinese peers are scaling aggressively with state support.
        - label: Mitsubishi Electric
          x: 4
          y: 4
          detail: Incumbent operator expanding into an 8-inch SiC fab with explicit capex backing.
        - label: Li Auto internal build
          x: 1
          y: 3
          detail: Mass-produced captive module program designed for Li Auto's own BEV roadmap rather than third-party sales.
        - label: Nio internal build
          x: 1
          y: 2
          detail: Captive module path has reached C-sample stage but still points inward to Nio's own platform.
    approximationNotes: Scores are evidence-backed ordinal placements on 1-5 axes; they summarize channel openness and disclosed scale rather than measured market share or cost.
    claimRefs: [CP002, CP005, CP008, CP009, CP010, CP011, CP014]
callouts:
  - calloutType: insight
    title: AscenPower is competing from the middle, not from the edge
    body: >-
      The strongest public evidence positions AscenPower between global merchant scale leaders and
      captive OEM substitutes: more externally open than Li Auto or Nio, but with less disclosed
      200mm scale than Wolfspeed or other incumbents expanding large-format SiC capacity.
    claimRefs: [CP005, CP009, CP010, CP014]
  - calloutType: risk
    title: Captive OEM modules shrink the default merchant opportunity set
    body: >-
      Li Auto's mass production and Nio's C-sample progress show that some EV OEMs are willing to
      internalize SiC modules once platform volume and performance needs justify it, reducing the
      assumption that every EV program will source merchant modules externally.
    claimRefs: [CP009, CP010]
