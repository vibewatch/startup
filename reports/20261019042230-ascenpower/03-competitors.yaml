company:
  name: AscenPower
chapter:
  number: 3
  title: Competitors
  summary: >-
    AscenPower competes in a three-way field: global merchant SiC incumbents with larger disclosed
    fab footprints, Chinese merchant peers scaling with policy support, and EV OEMs that are
    internalizing SiC modules instead of buying broadly from third parties. The retained evidence
    supports AscenPower's merchant-facing progress on automotive-grade capacity and customer
    development, but it also shows that captive OEM programs and better-capitalized 200mm operators
    can compress differentiation before public pricing or design-win quality are fully visible.
sections:
  - id: landscape-overview
    title: Merchant incumbents, local merchant peers, and captive OEM builds all compete for the same design slots
    body: >-
      The retained pool does not support a narrow "one-peer" framing. AscenPower is selling into an
      automotive and industrial SiC market where buyers can choose among global merchant suppliers,
      Chinese substrate and device specialists, and internal OEM module programs. On the merchant
      side, AscenPower has public evidence of mass-produced 1200V-class chips, more than 40 customer
      agreements, and tape-out coverage across many domestic design companies. That is meaningful
      progress, but the same evidence set shows larger operators with broader manufacturing assets:
      semiconductorx describes Wolfspeed as the leading Western vertically integrated operator with a
      dedicated 200mm fab, while TrendForce highlights additional incumbent expansion from Mitsubishi.
      At the same time, Li Auto and Nio are not just customers of the ecosystem; their in-house SiC
      module programs show that some vehicle platforms can bypass merchant suppliers altogether,
      especially once production volume justifies internalization.
    claimRefs: [CP001, CP003, CP005, CP009, CP010, CP011, CP014]
    tableRefs: [TP001]
  - id: capability-and-route-to-market
    title: Public evidence supports route-to-market and scale comparisons more cleanly than price comparisons
    body: >-
      AscenPower's best-supported differentiation is not lowest-price disclosure; it is a China-based
      merchant route to market with automotive-grade ambitions. TrendForce says phase one was ramping
      toward 240,000 annual 6-inch chips and that the reserved second phase targeted 8-inch output,
      while QCC lists 621 insured employees in the 2025 annual report, both consistent with a real
      operating footprint rather than a lab project. Still, the evidence does not place AscenPower at
      parity with the most disclosed scale leaders. semiconductorx ties Wolfspeed's positioning to a
      first dedicated 200mm SiC fab, and the same source says Chinese producers such as SICC, TanKeBlue,
      Sanan, and BYD are scaling aggressively with state support. The direct comparison the public record
      supports, therefore, is channel openness, manufacturing posture, and qualification progress. The
      public record does not support strong claims about per-unit chip pricing or discounting, so the
      pricing exhibit below stays explicit about unknowns instead of fabricating a superficial ASP league table.
    claimRefs: [CP002, CP004, CP005, CP008, CP011, CP013, CP014]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: durability-and-displacement-risk
    title: Competitive durability is limited by OEM internalization and the fragile economics of SiC scale
    body: >-
      The adverse evidence in this pool is less about one better feature and more about industry structure.
      semiconductorx says Wolfspeed entered Chapter 11 after heavy capex and weaker-than-expected near-term
      revenue, which matters because it shows that even a technologically advanced, vertically integrated
      SiC leader can struggle to convert fab scale into durable shareholder value. TrendForce adds a second
      pressure point: global NEV sales fell year over year in 1Q26, Chinese brands lost share when domestic
      demand weakened, and upstream component cost pressure remained elevated. That combination raises the
      chance of slower utilization ramps or tougher pricing for China-focused SiC vendors. AscenPower's moat
      is therefore conditional. It has evidence of meaningful customer engagement and local auto-grade
      manufacturing progress, but the moat is not yet reinforced by public proof of sustained design-win
      revenue, 200mm manufacturing leadership, or captive downstream demand that would offset a softer EV
      cycle or a more aggressive incumbent response.
    claimRefs: [CP006, CP007, CP009, CP010, CP012, CP014]
