      topic: pricing-opacity
      missingEvidence: Comparable public list pricing, contract terms, or realized ASP evidence across AscenPower, merchant incumbents, and captive module alternatives.
      whyItMatters: Without price and contract visibility, it is hard to separate true cost advantage from temporary channel access or policy support.
      diligencePath: Collect distributor quotes, customer procurement records, or management disclosures that show per-unit pricing and contract structure.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: design-win-quality
      missingEvidence: Named SOP automotive programs, PPAP status, and revenue-bearing customer mix for AscenPower relative to captive OEM module programs.
      whyItMatters: Merchant competitiveness is stronger if customer agreements convert into production revenue rather than samples, tape-outs, or qualification-only relationships.
      diligencePath: Request customer references, qualification milestones, and revenue mix by sample versus production shipments.
      relatedQuestionRefs: [QP005, QP008]
