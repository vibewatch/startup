evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-disclosure
    missingEvidence: Named founders, executive roster, board seats, and control-right disclosures.
    whyItMatters: Governance concentration and succession risk cannot be evaluated from one named chairman alone.
    diligencePath: Request the current board deck, cap table, and management-org chart from the company or lead investor.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue run rate, gross margin, cash balance, burn, runway, and current headcount.
    whyItMatters: >-
      Without operating metrics, valuation and financing sufficiency cannot be underwritten from public milestones
      alone.
    diligencePath: Obtain monthly management accounts, cash bridge, and headcount by function for the last 12 months.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: private-evidence-only
    severity: material
    topic: customer-conversion
    missingEvidence: >-
      Named customers, program stage by customer, and proof of conversion from tape-out / sample to recurring production
      revenue.
    whyItMatters: Capacity buildout matters less if customer qualification and monetization are still shallow or concentrated.
    diligencePath: Request customer list, PPAP / automotive qualification status, shipment history, and concentration by account.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: direct-adverse-checks
    missingEvidence: Direct regulatory, litigation, outage, recall, or sanction records tied specifically to AscenPower.
    whyItMatters: The assigned pool's lack of a recorded company incident does not prove that no such incident exists.
    diligencePath: >-
      Search the relevant Chinese court, regulator, recall, and corporate-credit databases using the full legal entity
      name.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: customer-conversion
    missingEvidence: >-
      Named mass-production customers, PPAP or automotive qualification status by program, and evidence of which signed
      accounts are revenue-bearing production programs.
    whyItMatters: >-
      Customer count without program stage makes it hard to convert public traction into adoption timing, quality of
      demand, and valuation confidence.
    diligencePath: >-
      Request a program-level customer funnel showing sample, qualification, SOP, and revenue status, then verify at
      least two accounts through customer or supplier references.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Public geography mix, end-market split, ASP ranges, and wafer-yield disclosure that would support an actual SAM or
      SOM bridge.
    whyItMatters: >-
      Without these variables, broad market demand cannot be translated into share, margin, or capital-efficiency
      expectations for AscenPower.
    diligencePath: >-
      Ask management for mix and yield disclosures, then triangulate with customer references, capacity utilization, and
      comparable SiC device pricing.
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Comparable public list pricing, contract terms, or realized ASP evidence across AscenPower, merchant incumbents,
      and captive module alternatives.
    whyItMatters: >-
      Without price and contract visibility, it is hard to separate true cost advantage from temporary channel access or
      policy support.
    diligencePath: >-
      Collect distributor quotes, customer procurement records, or management disclosures that show per-unit pricing and
      contract structure.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: design-win-quality
    missingEvidence: >-
      Named SOP automotive programs, PPAP status, and revenue-bearing customer mix for AscenPower relative to captive
      OEM module programs.
    whyItMatters: >-
      Merchant competitiveness is stronger if customer agreements convert into production revenue rather than samples,
      tape-outs, or qualification-only relationships.
    diligencePath: Request customer references, qualification milestones, and revenue mix by sample versus production shipments.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized ASPs, contract structures, rebates, and customer concentration by product family.
    whyItMatters: >-
      Revenue quality cannot be judged from customer signings alone without knowing monetization level and
      concentration.
    diligencePath: Request customer contracts, invoice-level ASPs, and a revenue bridge by device family and end market.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, burn rate, runway, debt facilities, subsidy receipts, and project-finance obligations.
    whyItMatters: >-
      Capital adequacy is the main forward-looking underwriting question and cannot be resolved from public fundraising
      headlines alone.
    diligencePath: >-
      Obtain a monthly cash-flow model, debt agreements, subsidy-receipt schedule, and board-approved capex plan through
      the data room.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: Wafer yields, scrap, utilization, depreciation burden, and gross margin by node or product line.
    whyItMatters: Scale economics can help only if yield and utilization translate nameplate capacity into profitable output.
    diligencePath: Request fab KPI packs showing monthly output, yield, scrap, utilization, and gross margin by major SKU or node.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: automotive-qualification
    missingEvidence: >-
      Public PPAP/AEC-style qualification status, named SOP vehicle programs, and reliability/yield disclosures for the
      automotive-grade SiC portfolio.
    whyItMatters: >-
      Without qualification and production-program proof, the difference between tape-out activity and durable
      production revenue remains unclear.
    diligencePath: >-
      Request customer-ready qualification packs, named SOP references, and reliability summaries broken out by device
      family.
    relatedQuestionRefs:
      - QE004
      - QE007
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: product-documentation
    missingEvidence: >-
      Official datasheets, package information, process-node detail, application notes, and roadmap documentation for
      the disclosed SiC products.
    whyItMatters: >-
      Public product names and voltage figures are not enough to assess performance, interchangeability, or integration
      friction for customer programs.
    diligencePath: >-
      Collect current product briefs, datasheets, qualification matrices, and sample-evaluation collateral directly from
      the company or distributors.
    relatedQuestionRefs:
      - QE001
      - QE007
