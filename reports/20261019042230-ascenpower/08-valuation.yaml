      - [Risk rating, high, "Fab execution, pricing pressure, and opaque economics can impair equity outcomes."]
      - [Valuation stance, stretched, "The latest disclosed financing mark lacks matching public revenue or margin anchors."]
      - [Entry discipline, wait for structured proof, "Require economics disclosure, commercial conversion, and clean terms before paying up."]
    notes: >-
      Synthesizes the retrieved valuation evidence; recommendations are directional because public
      revenue, margin, and term-sheet data remain undisclosed.
    claimRefs: [CV002, CV003, CV005, CV010, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - [Strategic position, "Chinese automotive-grade SiC manufacturing remains policy-aligned and strategically scarce.", "Scarcity alone does not protect private marks if end markets soften or public comps reset.", "Show durable order conversion and margin proof rather than strategic narrative alone."]
      - [Capacity and customer proof, "Independent reporting points to mass production, 10000 wafers per month, and 40 plus signed customer programs.", "Signed tape-out or sample activity does not prove recurring revenue or attractive gross margins.", "Provide customer-by-customer conversion, ASP, and utilization evidence."]
      - [Industry structure, "Physics-limited substrate supply and the 200 millimeter transition can reward scaled fabs that execute.", "Merchant pricing can still compress when Chinese capacity expands and public leaders are financially stressed.", "Show cost position and yield advantage versus peers rather than only industry demand."]
      - [Valuation support, "A disclosed unicorn valuation and large state-backed round show outside capital appetite.", "Public comp evidence is weak because Wolfspeed trades at roughly USD 1.22 billion after a severe de-rating.", "Close the gap with current revenue, margin, and scenario-based return math."]
    notes: >-
      The table separates company-quality arguments from price-support arguments; the current blocker
      is not strategic relevance but limited public monetization evidence.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "8-inch expansion stays on schedule and signed programs convert into disclosed automotive or industrial production revenue.", "Paying above the last disclosed post-money mark is only reasonable if revenue, margin, and qualification data show a step-change before the next financing or exit event.", "Qualification delays, yield misses, and working-capital strain.", "Need fresh disclosures showing commercial conversion rather than sample activity."]
      - [Base, "Fab buildout remains real but monetization proof stays partial and merchant SiC comps remain cautious.", "Underwrite at or below the last disclosed financing anchor with downside protection because upside depends on diligence optionality rather than visible multiple expansion.", "Slow customer conversion and flat public comp sentiment.", "Current evidence fits this case best."]
      - [Bear, "NEV demand softens, OEM insourcing reduces merchant demand, and new capital arrives before economics are disclosed.", "Expect flat-to-down pricing versus the last disclosed round because dilution or preference overhang can absorb operating progress.", "Down-round risk, preference stack complexity, and weaker exit liquidity.", "Industry softness plus insourcing evidence already point to this downside path as credible."]
    notes: >-
      Scenario logic is directional instead of numeric because the retrieved pool does not disclose
      current revenue, margins, or share count needed for a defendable precise valuation model.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strategic demand and visible fab progress keep AscenPower investable, but price support remains blocked by economics opacity and industry downside signals.
    data:
      nodes:
        - label: Strategic SiC demand
          detail: Policy-backed Chinese silicon-carbide manufacturing still addresses a real supply bottleneck.
          claimRefs: [CV001, CV006]
        - label: Operating proof exists
          detail: Public reporting points to mass production, 10000-wafer monthly capacity, and 40 plus customer programs.
          claimRefs: [CV004, CV005]
        - label: Public price anchor is real
          detail: The latest disclosed public mark is a 2024 unicorn valuation above RMB 7 billion post-money.
          claimRefs: [CV002, CV003]
        - label: Public comps are weak
          detail: Wolfspeed's October 2026 market cap of about USD 1.22 billion shows public investors still punish SiC execution risk.
          claimRefs: [CV010]
        - label: Downside signals are active
          detail: 1Q26 NEV demand softened and major OEMs are developing in-house SiC modules.
          claimRefs: [CV007, CV008, CV009]
        - label: Recommendation = research-more
          detail: Without economics and term-sheet disclosure, the prudent stance is high risk and stretched valuation rather than buy.
          claimRefs: [CV011, CV012, CV014]
      edges:
        - from: Strategic SiC demand
          to: Operating proof exists
          relationship: Strategic relevance still needs factory execution.
          claimRefs: [CV006]
        - from: Operating proof exists
          to: Public price anchor is real
          relationship: Scale signals helped attract the latest disclosed financing.
          claimRefs: [CV002, CV005]
        - from: Public price anchor is real
          to: Public comps are weak
          relationship: Private price support must be judged against weaker listed comparables.
          claimRefs: [CV002, CV010]
        - from: Public comps are weak
          to: Downside signals are active
          relationship: Cyclical softness and insourcing raise downside risk for merchant fabs.
          claimRefs: [CV007, CV008, CV009, CV010]
        - from: Downside signals are active
          to: Recommendation = research-more
          relationship: Current public evidence does not justify paying for the upside case today.
          claimRefs: [CV011, CV012, CV014]
    approximationNotes: >-
      The flow is logical rather than quantitative; it shows how evidence themes combine into the
      recommendation, not a probabilistic model.
    claimRefs: [CV002, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV014]
callouts:
  - calloutType: recommendation
    title: Public evidence supports diligence, not underwriting
    body: >-
      The strongest current call is research-more: AscenPower has enough third-party evidence to
      merit continued work, but not enough public economics or terms disclosure to justify a buy
      recommendation at the last visible financing anchor.
    claimRefs: [CV002, CV005, CV011, CV012]
  - calloutType: assumption
    title: What would move the rating upward
    body: >-
      A better call would require disclosed revenue and gross margin, customer conversion beyond
      samples, clarity on preferences and debt seniority, and evidence that merchant demand remains
      durable despite OEM in-house SiC programs.
    claimRefs: [CV005, CV008, CV009, CV012, CV014]
