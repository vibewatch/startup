      - number: '4.4'
        title: 资本充足性是核心尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开来源确实显示出融资势头：36Kr 称 AscenPower 完成约人民币 10 亿元 A 轮，并披露投后估值超过人民币 70
              亿元；南沙政策支持可抵消部分晶圆厂资本开支。即便如此，已披露融资相对于项目规模仍显得较小，除非还有未公开的债务、补贴或客户预付款支持，否则意味着仍需继续融资。保留来源没有现金余额、债务条款、消耗、营运资本或
              runway，因此当前证据支持前瞻性判断，却不足以形成完整投资判断：AscenPower 可能正在建设具有战略意义的 SiC 资产，但公开数据仍无法解决其融资依赖。
