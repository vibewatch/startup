            body: >-
              公开记录足以识别 AscenPower 想卖什么，却不足以判断这些活动有多少已经变成持久收入。第三方报道描述其面向车规级和工业功率器件的独立 SiC 业务，客户 tape-out 和样品验证已在推进，终端覆盖
