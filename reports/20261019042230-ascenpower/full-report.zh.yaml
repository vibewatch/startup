  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略需求和可见的晶圆厂进展使 AscenPower 仍值得投资研究，但经济性不透明和行业下行信号仍阻碍价格支撑。
    data:
      nodes:
        - label: 战略性 SiC 需求
          detail: 政策支持的中国碳化硅制造仍在解决真实的供给瓶颈。
          claimRefs:
            - CV001
            - CV006
        - label: 存在经营证据
          detail: 公开报道指向量产、每月 10000 片晶圆产能和 40 多个客户项目。
          claimRefs:
            - CV004
            - CV005
        - label: 公开价格锚点真实存在
          detail: 最新披露的公开估值是 2024 年投后超过 RMB 7 billion 的独角兽估值。
          claimRefs:
            - CV002
            - CV003
        - label: 公开可比公司表现偏弱
          detail: Wolfspeed 2026 年 10 月市值约为 USD 1.22 billion，说明公开市场投资者仍在惩罚 SiC 执行风险。
          claimRefs:
            - CV010
        - label: 下行信号正在显现
          detail: 1Q26 NEV 需求走弱，且主要 OEM 正在开发自有 SiC 模块。
          claimRefs:
            - CV007
            - CV008
            - CV009
        - label: 建议 = 继续研究
          detail: 在经济性和条款清单尚未披露前，审慎立场应是高风险、估值偏高，而不是买入。
          claimRefs:
            - CV011
            - CV012
            - CV014
      edges:
        - from: Strategic SiC demand
          to: Operating proof exists
          relationship: 战略相关性仍需要工厂执行来兑现。
          claimRefs:
            - CV006
        - from: Operating proof exists
          to: Public price anchor is real
          relationship: 规模信号帮助吸引了最新一轮已披露融资。
          claimRefs:
            - CV002
            - CV005
        - from: Public price anchor is real
          to: Public comps are weak
          relationship: 私人市场价格支撑必须对照表现更弱的上市可比公司来判断。
          claimRefs:
            - CV002
            - CV010
        - from: Public comps are weak
          to: Downside signals are active
          relationship: 周期性走弱和自产趋势提高了商业化晶圆厂的下行风险。
          claimRefs:
            - CV007
            - CV008
            - CV009
            - CV010
        - from: Downside signals are active
          to: Recommendation = research-more
          relationship: 当前公开证据不足以支持今天为上行情景支付溢价。
          claimRefs:
            - CV011
            - CV012
            - CV014
    approximationNotes: 该流程是逻辑性的而非量化的；它展示证据主题如何汇聚成建议，而不是概率模型。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
