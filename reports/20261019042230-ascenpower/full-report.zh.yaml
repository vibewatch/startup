            body: >-
              指定资料中的管理层披露很少。唯一具名的高管是董事长 Xiao Guowei，他出现在 2023 年 6
              月的制造进展更新中；公司后来提供的简介则提到一支经验丰富的晶圆厂建设和技术团队，但未披露更完整的创始人名单、董事会或股权控制结构。融资情况同样不完整：目前最有力的证据是公司发布的 2024 年简介，称
