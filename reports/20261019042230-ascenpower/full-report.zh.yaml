companyProfile:
  summary: >-
    AscenPower 是一家总部位于广州的车规级碳化硅功率器件制造商，聚焦 SiC SBD/JBS、MOSFET 和 IGBT 产品，服务于电动汽车、工业电力、智能电网和光伏应用。公开来源披露了大规模 6 英寸和 8
    英寸产能建设、2024 年 A 轮融资，以及从样品和认证逐步走向更大规模生产的运营爬坡；但公司对收入、利润率和客户结构仍披露甚少。
  foundingLocation: Guangzhou, China
  headquarters: Nansha District, Guangzhou, China
  productSummary: 车规级碳化硅功率器件，包括 SiC SBD/JBS、MOSFET、IGBT 晶圆及相关电源解决方案。
  customerFocus: EV、工业电力、可再生能源、电网和光伏应用
  businessModel: 向汽车和工业电力转换项目销售 SiC 功率器件晶圆及相关半导体产品
