        - label: 行业资本周期压缩
          note: Wolfspeed 的重组表明，规模并不能消除 SiC 晶圆厂的资本压力。
          values:
            - value: Medium
              tone: medium
            - value: Medium-high
              tone: high
            - value: Low-Medium
              tone: medium
            - value: Medium
              tone: medium
