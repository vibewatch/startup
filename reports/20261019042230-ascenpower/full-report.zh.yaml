      - number: '3.3'
        title: OEM 内化与 SiC 规模经济脆弱性限制竞争持久性
        blocks:
          - type: paragraph
            body: >-
              这组资料中的反向证据，与其说是某项功能落后，不如说是产业结构问题。semiconductorx 称 Wolfspeed 在重资产开支和短期收入低于预期后进入 Chapter 11；这说明即使技术先进、垂直整合的
              SiC 龙头，也可能难以把晶圆厂规模转化为持久的股东价值。TrendForce 又提供了第二个压力点：1Q26 全球 NEV 销量同比下降，中国品牌在国内需求走弱时丢失份额，上游零部件成本压力仍高。对中国 SiC
              厂商而言，这会提高利用率爬坡放慢或定价更困难的概率。AscenPower 的护城河因此是有条件的：它有客户参与和本土车规级制造进展，但尚无持续 design-win 收入、200mm
              制造领先或下游自有需求的公开证明，无法抵消 EV 周期走弱或更强老牌厂商回应的影响。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
              - CP014
