              - CM013
      - number: '2.4'
        title: 尚未弥合的规模缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录仍无法为 AscenPower 单独得出可信的 SAM 或 SOM。没有披露地域组合，没有公开的按产品系列划分 ASP
              区间，没有晶圆良率，也没有具名的量产阶段汽车项目，投资人无法据此把晶圆厂产能转换为收入质量。证据足以说明公司面向一个增长中的 SiC
              需求池，但不足以说明它能拿到多大份额、以何种利润率拿到，或出口与国内业务如何分布。这些缺口直接影响采用时点，以及任何基于国产替代叙事的估值。
            claimRefs:
              - CM010
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 需求不等于可变现份额
            body: 独立信号支持 SiC 需求真实增长，但 AscenPower 对产能和已签客户的披露明显强于对可变现生产组合的披露，因此投资判断应围绕认证和转化，而不是宽泛 TAM。
            calloutType: insight
            claimRefs:
              - CM004
              - CM006
              - CM008
              - CM010
              - CM015
          - type: callout
            title: 内制与成本上涨可能压缩独立供应商上行空间
            body: OEM 转向自研 SiC 模块，以及 EV 平台整体成本压力，都可能削弱独立晶圆厂的定价能力，即使终端市场需求继续增长。
            calloutType: risk
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 国际老牌厂商、本土独立同行与 OEM 自建项目争夺同一批设计机会
        blocks:
          - type: paragraph
            body: >-
              保留资料不支持“单一同行”的狭窄框架。AscenPower 所处的是汽车和工业 SiC 市场，买方可在全球独立供应商、中国衬底和器件专业厂商，以及 OEM
              内部模块项目之间选择。在独立供应商一侧，AscenPower 已有 1200V 级芯片量产、超过 40 份客户协议，以及覆盖多家国内设计公司的 tape-out
              证据。这是实质进展，但同一证据集也显示出制造资产更广的大型企业：semiconductorx 将 Wolfspeed 描述为西方领先的垂直整合厂商，拥有专用 200mm 晶圆厂；TrendForce 则强调
              Mitsubishi 等其他老牌厂商也在扩产。与此同时，Li Auto 和 Nio 不只是生态客户，其自研 SiC 模块项目说明，一旦产量足以支撑内化，部分汽车平台可以完全绕开独立供应商。
            claimRefs:
              - CP001
