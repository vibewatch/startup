      - number: '2.3'
        title: 买方、采用驱动因素与限制
        blocks:
          - type: paragraph
            body: >-
              眼下的商业接口似乎是 SiC 设计公司、模块/集成伙伴和验证项目，而终端需求最终由 OEM 及工业平台升级拉动。公开爬坡更新称 AscenPower 已签约超过 40
              家客户，但未说明哪些账户已经贡献生产。需求方面，EV、PV、电网和工业电力场景，以及 OEM 转向更高电压架构，都有利于 SiC 采用；同时限制也很明显：TrendForce 警告上游零部件涨价会削弱下游 EV
              需求，Nio 自研 SiC 模块进展说明 OEM 可以内化部分产业链，即使制造仍外包，也会压缩独立晶圆厂的议价空间。
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
