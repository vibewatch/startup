        title: 身份、布局与产业版图
        blocks:
          - type: paragraph
            body: >-
              指定证据一致将 AscenPower（广东芯粤能半导体）描述为一家位于广州南沙、专注车规级和工业控制用碳化硅功率器件的制造及研发公司，而非无晶圆设计初创企业。两份公开来源将其建设锚定在 2021 年项目：规划投资
              RMB7.5 billion，年产 24 万片 6 英寸晶圆和 24 万片 8 英寸晶圆；公开来源还显示，产线于 2023 年 3 月贯通、2023 年 6 月量产，并在 2023 年底达到每月 1 万片 6
              英寸产出。各来源对产品范围的描述也一致：IGBT、SiC SBD/JBS 和 SiC
              MOSFET，面向新能源汽车、工业电力、智能电网和光伏应用。整体看，这是一个有真实实体里程碑的重资本制造项目，但仍缺少后续投资判断所需的审计运营披露。
