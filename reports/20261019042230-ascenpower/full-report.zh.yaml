  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              公开证据支持将 AscenPower 的市场定义为车规级和工业级碳化硅功率器件，而不是整个半导体栈或完整 EV 收入池。公司所述产品是用于新能源汽车、工业电源、智能电网和光伏系统的 SiC
              SBD/JBS、MOSFET 和 IGBT 功率器件，因此边界落在高压电力转换，而非控制软件、完整逆变器或整车装配。当前最主要的替代方案仍是低压设计中的硅基 IGBT 电力电子；只有当 SiC
              的效率、电压或热性能足以抵消额外成本时，AscenPower 才有胜算。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角与晶圆厂产能换算
        blocks:
          - type: paragraph
            body: >-
              现有独立规模信号较宽泛，但方向上有用。Compound Semiconductor 援引 TrendForce 称，SiC 功率器件市场到 2026 年应达到 $5.33 billion；TrendForce 的
              2026 年 EV 研究则显示，全年全球 NEV 销量为 23.35 million，仅 1Q26 就有 3.94 million。它们足以证明下游需求池有实质规模，但不能直接转成 AscenPower
              的收入机会，因为公司披露的是产能、客户数和送样里程碑，而非 ASP、良率或生产项目组合。因此，合理判断应受证据约束：公开终端市场很大，但 AscenPower 的可变现份额取决于认证和晶圆厂爬坡，而非宽泛的
              TAM 叙事。公开市场估值也不是稳定的需求代理：Wolfspeed 市值在 2024 和 2025 年大幅下跌、2026 年反弹，单一可比公司截面无法弥合规模估算缺口。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM015
