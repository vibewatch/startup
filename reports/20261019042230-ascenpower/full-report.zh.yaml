            body: >-
              正向论点是，AscenPower 位于一个具有战略意义的细分市场：中国车规级碳化硅制造，拥有政策支持、可见的晶圆厂建设，以及早期规模化客户送样证据。反向论点是，这正是资本密集型行业：公开市场降估值、终端需求放缓和
              OEM 内制，可能在独立晶圆厂证明经常性经济性之前压缩私营估值。公开证据足以支持尽调和情景分析，却不足以声称最新披露价格已经提供明显的安全边际。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.3'
        title: 情景投资判断
        blocks:
          - type: paragraph
            body: >-
              合理的投资判断框架应是方向性的，而非伪精确。乐观情景需要披露证据证明 AscenPower 的 6 英寸线已实现变现、8 英寸扩产风险已降低，以及汽车或工业 design win
              能在退出窗口关闭前从样品转为生产收入。基准情景假设晶圆厂故事仍真实，但由于独立 SiC 同行仍处在周期性重估中，估值支撑被限制在上一轮已披露融资锚点附近。悲观情景则是需求疲软、客户内制或条款悬置在
              AscenPower 发布更强商业证明前出现，导致估值持平到下调。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调门槛与论点破坏点
        blocks:
          - type: paragraph
            body: >-
              最终决策应由一份简短的尽调门槛清单驱动，而不是对半导体国产化的泛泛热情。第一，投资人需要与已宣布产能建设相匹配的当前收入、毛利率、良率、利用率和客户转化证据。第二，融资文件必须披露清算优先权、反稀释、债务或项目融资的优先级以及治理权，才能诚实建模股权回报。第三，团队需要证明，即使
              OEM 自建碳化硅模块，独立供应商需求仍然持久。如果这些门槛在纪律化价格下都通过，建议可以上调；否则，资金投入前投资论点就应被打破。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据支持尽调，不支持投资判断
            body: 当前最强结论是继续研究：AscenPower 拥有足够第三方证据值得继续工作，但在上一轮可见融资锚点下，公开经济性和条款披露仍不足以支持买入建议。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV011
              - CV012
          - type: callout
            title: 哪些信息会推动评级上调
            body: 更积极的判断需要披露收入和毛利率、超越样品阶段的客户转化、对优先权和债务级别的清晰说明，以及在 OEM 自研 SiC 项目背景下独立供应商需求仍然持久的证据。
            calloutType: assumption
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV014
