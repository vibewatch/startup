      - number: '4.3'
        title: 外部压力可能拖慢定价能力与晶圆厂利用率
        blocks:
          - type: paragraph
            body: >-
              行业长期有支撑，短期却很艰难。Technavio 仍预测 SiC 市场快速扩张，但供应商未必能吃到增长：CnEVPost 报道 Li Auto 已量产自有 SiC 模块，CNBC 援引 Rhodium
              的报道认为，中国 EV 最强的成本优势来自垂直整合、规模和营运资本纪律，而不只是补贴。TrendForce 又指出 1Q26 全球 NEV 销量同比下降 2%、中国需求疲弱且零部件成本上升。对
              AscenPower 而言，商业问题不仅是 SiC 是否有需求，还在于其中有多少需求会以可接受的价格和利用率留给独立供应商。
