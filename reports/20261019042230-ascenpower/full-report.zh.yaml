      - number: '1.3'
        title: 商业进展、外部压力与待解投资问题
        blocks:
          - type: paragraph
            body: >-
              指定证据支持早期制造进展，但尚不足以清晰判断运营表现。2023 年 6 月，AscenPower 称已签约超过 10 家 COT 客户；2024 年 11
              月公司简介称，使用其芯片的客户产品已在工业电力、光伏逆变器和充电桩终端实现批量生产。这一方向积极，但资料仍未给出具名的量产汽车客户、当前产生收入的客户数、收入 run rate、毛利率、员工数或现金
              runway。外部信号也让故事更复杂：独立行业梳理显示中国 SiC 产能正在激进扩张，Li Auto 2025 年 2 月披露 OEM 自研 SiC 已成事实，TrendForce 报告称 1Q26 全球 NEV
              销量同比下降 2%，而公开市场上可比的纯 SiC 公司波动很大，同行倍数不足以证明私营企业价值持久。公司制造进展真实，但披露风险仍然很高。
