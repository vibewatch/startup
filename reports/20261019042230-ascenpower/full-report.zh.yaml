      - number: '3.2'
        title: 公开证据更适合比较渠道与规模，而非价格
        blocks:
          - type: paragraph
            body: >-
              AscenPower 最有证据支持的差异化并不是最低价格，而是一个立足中国、具备车规级目标的独立供应商渠道。TrendForce 称一期正爬坡至年产 24 万片 6 英寸芯片，预留的二期目标为 8
              英寸产出；QCC 在 2025 年年报中列出 621 名参保员工，两者都更像真实运营实体，而不是实验室项目。但证据不足以证明 AscenPower 已达到规模领先者的水平。semiconductorx 将
              Wolfspeed 的定位与其首座专用 200mm SiC 晶圆厂联系起来，同一来源称 SICC、TanKeBlue、Sanan 和 BYD
              等中国厂商正在政策支持下激进扩张。因此公开记录真正支持的比较维度是渠道开放度、制造姿态和认证进度，而非单颗芯片价格或折扣；下方价格展项会明确保留未知项，不会编造肤浅的 ASP 排名。
            claimRefs:
