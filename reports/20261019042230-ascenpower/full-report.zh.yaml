          x: 1
          'y': 3
          detail: 为 Li Auto 自有 BEV 路线设计的量产自供模块项目，而非面向第三方销售。
        - label: Nio 内部建设
          x: 1
          'y': 2
          detail: 自供模块路径已达到 C-sample 阶段，但仍服务于 Nio 自有平台。
    approximationNotes: 分数是基于证据的 1–5 级序数定位，用于概括渠道开放程度和已披露规模，而不是衡量市场份额或成本。
    claimRefs:
      - CP002
      - CP005
      - CP008
      - CP009
      - CP010
      - CP011
      - CP014
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据指向一条从晶圆厂建设到认证再到规模化收入的重资本链条；利润率杠杆取决于晶圆规模和产能利用率，但现金转化仍未披露。
    data:
      nodes:
        - id: fab
          label: 晶圆厂建设
          value: RMB7.5B project
          unit: disclosed capex
          detail: 独立报道将 AscenPower 的 SiC 项目与 RMB7.5B 计划投资联系起来。
        - id: capacity
          label: 已安装产能
          value: 240k 6-inch + 240k 8-inch annual plan; 10k/month current line output
          unit: wafers
          detail: 公开来源同时显示长期名义产能目标和早期量产吞吐量信号。
        - id: qualification
          label: 客户认证
          value: 40+
          unit: signed tape-out customers
          detail: 36Kr 报道称，已有超过 40 个签署流片协议的客户，包括 OEM 和样品验证客户。
        - id: shipment
          label: 批量出货
          value: Revenue undisclosed
          unit: status
          detail: 保留的来源没有披露已出货晶圆价值、已确认收入，或从流片到持续生产的转化情况。
        - id: margin
          label: 毛利杠杆
          value: 8-inch / 200mm scale helps
          unit: cost driver
          detail: 行业来源称，更大尺寸晶圆能为 SiC 制造带来规模经济杠杆。
        - id: funding
          label: 现金转化与资金需求
          value: Runway undisclosed
          unit: capital status
          detail: 未披露现金、烧钱速度和债务条款，因此无法验证规模化对自筹增长的影响。
      edges:
        - from: fab
          to: capacity
          label: 资本开支为设备、洁净室和爬坡提供资金
        - from: capacity
          to: qualification
          label: 已安装产出支撑客户流片和验证
        - from: qualification
          to: shipment
          label: 从样品到经常性批量的转化尚未公开披露
        - from: shipment
          to: margin
          label: ASP、良率和产能利用率决定规模能否转化为毛利
        - from: margin
          to: funding
          label: 现金产生仍取决于营运资金和外部资本支持
    approximationNotes: 这是基于公开里程碑和行业成本驱动因素搭建的定性运营桥接，不是量化瀑布图，因为保留的来源没有披露 AscenPower 的收入、良率、毛利率或现金流数据。
    claimRefs:
      - CI001
      - CI005
      - CI007
      - CI010
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，从终端市场需求到晶圆厂执行和认证依赖，构成了分层的制造链条。
    data:
      layers:
        - label: 需求面
          detail: NEV 渗透和功率电子、工业电源、智能电网、光伏发电
        - label: 公开器件组合
          modules:
            - label: SiC SBD/JBS
            - label: SiC MOSFET
            - label: IGBT
        - label: 当前已披露产出信号
          outputs:
            - label: 1200V family
            - label: 16mOhm / 35mOhm specs
            - label: 10,000 6-inch 'chips/pieces' per month reported; denominator unclear
            - label: 40+ signed customers claimed
        - label: 制造资产
          modules:
            - label: 洁净室已完工
            - label: 240,000 片 6 英寸年设计产能
            - label: 240,000 片 8 英寸年设计产能
        - label: 商业转化信号
          outputs:
            - label: JW Insights-reported >10 COT clients
            - label: 36Kr/Pedaily-reported 40+ signed customers
        - label: 外部控制点
          outputs:
            - label: Automotive qualification and SOP conversion
            - label: Substrate and wafer-transition execution
            - label: NEV demand and component-cost cycle
    approximationNotes: 该架构只反映保留的公开证据中明确可见的层级，不是公司声称的工艺流程图。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE009
      - CE011
      - CE012
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持从细分市场定位到认证和量产前阶段的客户路径，但尚未推进到有明确名称的经常性生产订单。
    data:
      nodes:
        - label: 细分市场定位
          actor: EV, industrial, grid, and PV power-electronics buyers
          phase: Awareness
          touchpoints:
            - Public product positioning centers on NEV, industrial power, smart grid, and PV applications.
            - Multiple end markets broaden surface area but do not prove account conversion.
        - label: 签署流片协议
          actor: SiC design houses and OEM-linked programs
          phase: Qualification
          touchpoints:
            - 36Kr reported 40+ signed tape-out customers.
            - The disclosure does not identify which accounts progressed beyond evaluation.
        - label: COT 合作
          actor: Outsourced manufacturing customers
          phase: Commercial validation
          touchpoints:
            - EET China reported more than 10 signed COT customers.
            - The source does not disclose contract size, duration, or customer overlap with later counts.
        - label: 样品验证
          actor: OEM and application-validation teams
          phase: Pilot
          touchpoints:
            - 36Kr said the customer set included OEMs and sample-validation customers.
            - Sample validation is not proof of production revenue or renewals.
        - label: 客户专属 SKU 爬坡
          actor: Accounts with defined specifications
          phase: Pre-production
          touchpoints:
            - EET China said four customer-specific products were nearing mass production.
            - Public sources do not name the programs or state start-of-production timing.
        - label: 扩大生产
          actor: Repeat and scaled production customers
          phase: Expansion
          touchpoints:
            - This stage is the biggest evidence gap because no source discloses renewals, NRR, or top-customer mix.
            - OEM in-house SiC efforts suggest expansion will require sustained qualification wins.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU012
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在 AscenPower 尚未披露可持续经营证据之前，快速扩产、客户转化和行业定价压力交汇处的剩余风险最高。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余严重度
      rows:
        - label: 6 英寸 / 8 英寸爬坡良率
          note: 公开证据显示了速度和规模，但没有稳定良率曲线或毛利率证明。
          values:
            - value: High
              tone: high
            - value: High
              tone: high
            - value: Medium
              tone: medium
              note: 有经验的运营团队和政策支持有帮助，但已披露经营证据很薄弱。
            - value: High
              tone: high
        - label: OEM 自产
          note: Nio 和 Li Auto 均披露了内部开发 SiC 模块的进展。
          values:
            - value: High
              tone: high
            - value: High
              tone: high
            - value: Low-Medium
              tone: medium
              note: 缓释效果取决于找到自供给吸引力较低的细分市场。
            - value: High
              tone: high
        - label: EV 需求与定价波动
          note: 如果中国本土需求走弱，以中国为主的 EV 暴露会削弱议价能力。
          values:
            - value: Medium-high
              tone: high
            - value: High
              tone: high
            - value: Low-Medium
              tone: medium
            - value: Medium-high
              tone: high
        - label: 政策与融资依赖
          note: 该项目规模仍意味着未来需要继续筹集资本，超出已披露的 A 轮融资。
          values:
            - value: Medium
              tone: medium
            - value: High
              tone: high
            - value: Medium
              tone: medium
            - value: Medium-high
              tone: high
        - label: 监管 / 许可可见性缺口
          note: 指定的公开资料池未独立核实许可、EHS、出口管制或 IP 争议状态。
          values:
            - value: Medium
              tone: medium
            - value: High
