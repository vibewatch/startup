      - number: '4.2'
        title: 资本开支负担清晰，利润率桥接仍主要属于私有信息
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清晰的财务事实，是制造计划的规模。独立报道将项目与 RMB7.5 billion 规划投资、6 英寸 / 8 英寸双线建设联系起来；后续报道称产线已达到每月 1 万片并进入量产。这一点重要，因为
              SiC 经济性对晶圆尺寸、良率和利用率极其敏感：行业来源明确把转向 8 英寸视为规模经济杠杆，技术分析称 200mm 晶圆面积约为 150mm 的 1.78
              倍。但保留来源都未披露良率、报废、毛利率或折旧负担，因此规模可见，真实单位经济性桥接仍大多是私有信息。
