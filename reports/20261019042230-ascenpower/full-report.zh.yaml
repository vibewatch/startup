        title: 展示项
        blocks:
          - type: callout
            title: AscenPower 处于中间位置，而非边缘位置
            body: >-
              最强的公开证据把 AscenPower 放在全球独立供应商规模龙头与 OEM 自有替代方案之间：比 Li Auto 或 Nio 更开放地面向外部客户，但已披露的 200mm 规模小于 Wolfspeed
              及其他扩充大尺寸 SiC 产能的同行。
            calloutType: insight
            claimRefs:
