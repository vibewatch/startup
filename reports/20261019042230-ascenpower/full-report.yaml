              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and capital-formation risks
        blocks:
          - type: paragraph
            body: >-
              The chapter's direct public evidence does not show an active lawsuit, permit failure, or enforcement
              action against AscenPower, but it also does not clear those areas. The same source set shows a
              strategically important, state-backed project with a disclosed RMB7.5 billion investment plan and
              state-linked A-round leadership, which means regulatory continuity, environmental compliance, and future
              financing are material diligence items rather than closed questions. Sector comparables reinforce the
              financing risk: SemiconductorX says Wolfspeed filed Chapter 11 in mid-2025, while public market-cap
              trackers still show a sharply compressed equity value in 2026. That is a reminder that scale alone does
              not immunize SiC fabs from capital stress when utilization or pricing disappoints.
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR012
              - CR013
      - number: '7.3'
        title: Dependency and customer-conversion risks
        blocks:
          - type: paragraph
            body: >-
              The best public evidence of customer traction is still early-stage: 36Kr says AscenPower has signed
              tape-out deals with more than 40 customers and includes automakers plus sample-validation customers, but
              that is not the same as recurring production revenue. At the same time, both Nio and Li Auto disclosed
              progress on in-house SiC modules, showing that Chinese OEMs can internalize meaningful parts of the value
              chain rather than remain permanent external demand anchors. Combined with TrendForce's warning that
              domestic-demand concentration hurt Chinese BEV brands in 1Q26, AscenPower's partner risk is not just
              supplier concentration; it is whether a small set of automotive and design-house programs convert into
              durable, margin-supportive wafer volume before sector pricing resets.
            claimRefs:
              - CR003
              - CR006
              - CR008
              - CR009
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR011
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria to test before underwriting
            body: >-
              The thesis should worsen materially if AscenPower cannot show stable 8-inch yields, named SOP customers,
              and credible next-stage financing while the Chinese EV market remains price-sensitive and major OEMs
              continue to internalize SiC modules.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
          - type: callout
            title: What would de-risk the story fastest
            body: >-
              The most valuable diligence package would be a combined operating proof set: yield and scrap curves by
              wafer size, named production customers rather than tape-out counts, and documentary evidence on permits,
              quality qualifications, and any material legal or IP exposure.
            calloutType: insight
            claimRefs:
              - CR001
              - CR003
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The retrieved evidence supports continuing diligence, not paying up on conviction today. Independent
              coverage shows that AscenPower reached a unicorn-level financing mark in 2024 and built meaningful
              silicon-carbide manufacturing capacity, but the same public record still does not disclose revenue, gross
              margin, utilization economics, customer concentration, or liquidation preferences. That combination makes
              the investment question price-sensitive: a strong company story is not enough when the public record
              cannot show whether current throughput converts into durable, high-margin automotive revenue. The
              practical implication is research-more with a stretched valuation stance and a high risk rating until
              diligence closes economics and term-sheet gaps.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that AscenPower sits in a strategically important segment: Chinese automotive
              silicon-carbide manufacturing with policy backing, visible fab buildout, and evidence of early customer
              sampling at scale. The anti-thesis is that this is exactly the kind of capital-heavy segment where
              public-market de-rating, slower end-market demand, and OEM insourcing can compress private marks before
              merchant fabs prove recurring economics. Public evidence is therefore good enough to justify diligence and
              scenario work, but not good enough to claim that the latest disclosed price already offers an obvious
              margin of safety.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario underwriting
        blocks:
          - type: paragraph
            body: >-
              A sensible underwriting frame is directional rather than falsely precise. The bull case needs disclosed
              evidence that AscenPower's 6-inch line is monetizing, its 8-inch expansion is de-risked, and automotive or
              industrial design wins are converting from samples into production revenue before the exit window closes.
              The base case assumes the fab story remains real but valuation support stays capped near the last
              disclosed financing anchor because merchant silicon-carbide peers are still trading through a cyclical
              reset. The bear case is a flat-to-down repricing if demand softness, customer insourcing, or term-sheet
              overhangs appear before AscenPower publishes stronger commercial proof.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence gates and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The final decision should turn on a short list of diligence gates rather than generic enthusiasm for
              semiconductor localization. First, investors need current revenue, gross-margin, yield, utilization, and
              customer-conversion evidence tied to the announced capacity buildout. Second, the round documents need to
              show liquidation preferences, anti-dilution, debt or project-finance seniority, and governance rights so
              that equity returns can be modeled honestly. Third, the team needs proof that merchant demand remains
              durable despite OEM in-housing of silicon-carbide modules. If those gates clear at a disciplined entry
              price, the recommendation can improve; if they do not, the thesis should break before capital is
              committed.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports diligence, not underwriting
            body: >-
              The strongest current call is research-more: AscenPower has enough third-party evidence to merit continued
              work, but not enough public economics or terms disclosure to justify a buy recommendation at the last
              visible financing anchor.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV011
              - CV012
          - type: callout
            title: What would move the rating upward
            body: >-
              A better call would require disclosed revenue and gross margin, customer conversion beyond samples,
              clarity on preferences and debt seniority, and evidence that merchant demand remains durable despite OEM
              in-house SiC programs.
            calloutType: assumption
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV014
