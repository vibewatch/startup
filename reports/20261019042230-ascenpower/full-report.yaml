              - CM008
              - CM010
              - CM015
          - type: callout
            title: Internalization and cost inflation can compress merchant upside
            body: >-
              OEM moves toward in-house SiC modules and broader cost pressure across EV platforms can both weaken
              merchant foundry pricing power even if overall end-market demand keeps growing.
            calloutType: risk
            claimRefs:
