        - Public comp evidence is weak because Wolfspeed trades at roughly USD 1.22 billion after a severe de-rating.
        - Close the gap with current revenue, margin, and scenario-based return math.
    notes: >-
      The table separates company-quality arguments from price-support arguments; the current blocker is not strategic
      relevance but limited public monetization evidence.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
