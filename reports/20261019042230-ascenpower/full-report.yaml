      - number: '1.2'
        title: Leadership, funding, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure in the assigned pool is thin. The only named executive-level figure is
              chairman Xiao Guowei, who appears in the June 2023 manufacturing update, while a later company-supplied
              profile points to an experienced foundry-construction and technical team without naming the wider founder
              roster, board, or cap-table control structure. Funding visibility is similarly partial: the strongest
              current evidence is a company-originated 2024 profile stating that AscenPower completed an approximately
              RMB1 billion Series A in September 2024, and Hurun's 2025 unicorn list adds a valuation signal that the
              company crossed the US$1 billion threshold for private-company inclusion. What remains missing is the
              information diligence actually needs for control and financing risk: named Series A investors, governance
              rights, liquidation preferences, board composition, and whether the unicorn signal corresponds to a priced
              round or only an index estimate.
