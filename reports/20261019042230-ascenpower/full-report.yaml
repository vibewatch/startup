  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence implies a capex-heavy chain from fab buildout to qualification and volume revenue, with margin
      leverage dependent on wafer scale and utilization but cash conversion still undisclosed.
    data:
      nodes:
        - id: fab
          label: Fab buildout
          value: RMB7.5B project
          unit: disclosed capex
          detail: Independent reporting ties AscenPower's SiC project to RMB7.5B of planned investment.
        - id: capacity
          label: Installed capacity
          value: 240k 6-inch + 240k 8-inch annual plan; 10k/month current line output
          unit: wafers
          detail: Public sources show both the long-run nameplate ambition and an early mass-production throughput signal.
        - id: qualification
          label: Customer qualification
          value: 40+
          unit: signed tape-out customers
          detail: 36Kr reports more than 40 signed tape-out customers, including OEM and sample-validation accounts.
        - id: shipment
          label: Volume shipments
          value: Revenue undisclosed
          unit: status
          detail: >-
            No retained source discloses shipped wafer value, booked revenue, or conversion from tape-out to sustained
            production.
        - id: margin
          label: Gross-profit leverage
          value: 8-inch / 200mm scale helps
          unit: cost driver
          detail: Industry sources describe larger wafers as an economies-of-scale lever for SiC manufacturing.
        - id: funding
          label: Cash conversion and funding need
          value: Runway undisclosed
          unit: capital status
          detail: Without disclosed cash, burn, and debt terms, the effect of scale on self-funded growth cannot be verified.
      edges:
        - from: fab
          to: capacity
          label: Capex funds tools, clean rooms, and ramp
        - from: capacity
          to: qualification
          label: Installed output supports customer tape-out and validation
        - from: qualification
          to: shipment
          label: Conversion from samples to recurring volume is not publicly disclosed
        - from: shipment
          to: margin
          label: ASP, yield, and utilization determine whether scale becomes gross profit
        - from: margin
          to: funding
          label: Cash generation still depends on working capital and external capital support
    approximationNotes: >-
      This is a qualitative operating bridge built from public milestones and industry cost drivers; it is not a
