              - CU005
              - CU006
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU012
      - number: '6.3'
        title: Durability and concentration remain the biggest customer underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The central diligence problem is not whether AscenPower can attract customer interest; it is whether that
              interest converts into sticky, diversified production revenue. None of the assigned sources disclose
              renewal rates, NRR, churn, contract length, or top-customer concentration, so durability has to be treated
              as unverified. External market signals add pressure. TrendForce reported a 2% year-on- year decline in
              global NEV sales in 1Q26 and said China's NEV market underperformed, while major OEMs such as Li Auto and
              Nio are pushing SiC modules closer to in-house control or designated production partners. That does not
              disprove AscenPower's growth story, but it means the company still faces real procurement friction,
              pricing pressure, and concentration risk until it can show named production accounts, repeat orders, and
              account-level revenue mix.
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU013
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad funnel, narrow proof
            body: >-
              Public evidence supports a real customer funnel across automotive and industrial SiC programs, but the
              proof quality is still mostly anonymous counts and qualification milestones rather than named production
              customers or renewal data.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU012
              - CU013
          - type: callout
            title: OEM vertical integration can compress merchant-supplier leverage
            body: >-
              Li Auto and Nio's in-house or tightly partnered SiC module programs show that leading EV buyers may
              internalize more of the value chain, which can raise qualification standards and weaken pricing power for
              independent merchant suppliers.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The public downside case starts with execution rather than demand alone. 36Kr says AscenPower was founded
              in 2021, built its line in about 15 months, and now claims mass production at 10,000 wafers per month,
              while SemiconductorX describes SiC as a physics-limited process with slower boule growth, lower yields
              than silicon, and a consequential 150mm-to-200mm transition. That combination makes the company's
              6-inch/8-inch scale-up vulnerable to yield slippage, slower-than-expected customer conversion, and capex
              overruns. The demand backdrop is not forgiving: TrendForce reported a 2% YoY decline in global NEV sales
              in 1Q26 with China underperforming, so any ramp miss could coincide with weaker utilization and heavier
              pricing pressure.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR013
          - type: table
            tableRef: TR002
