      - number: '1.3'
        title: Traction, external pressure points, and open underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports early manufacturing traction, but it does not yet support a clean
              operating-performance read. In June 2023, AscenPower said it had signed more than 10 COT clients, and the
              November 2024 company profile says customer products using its chips had already reached batch production
              in industrial power, photovoltaic inverters, and charging-pile end markets. That is directionally
              positive, yet the pool still does not identify named mass-production automotive customers, current
              revenue-bearing customer count, revenue run rate, gross margin, headcount, or cash runway. External
              signals also complicate the story: independent industry mapping shows aggressive Chinese SiC capacity
              scaling, Li Auto's February 2025 disclosure shows OEM SiC insourcing is real, TrendForce reported a 2%
              year-over-year decline in global NEV sales in 1Q26, and the available public pure-play SiC comparator has
              been volatile enough that peer multiples are weak proof of durable private value. The result is a company
              with tangible manufacturing progress but still substantial disclosure risk.
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Manufacturing existence is better evidenced than economics
            body: >-
              The assigned pool does establish a real fab buildout: a 2021 launch, 2023 line connection and mass
              production, 10,000 wafers per month on the 6-inch line, and a 2024 financing event. Those are stronger
              than the usual aspirational startup signals.
            calloutType: strength
            claimRefs:
              - CO002
              - CO003
              - CO006
          - type: callout
            title: Governance opacity and industry pressure still dominate diligence
            body: >-
              The company can point to capacity and policy-backed momentum, but investors still need named investors,
              board/control rights, customer conversion proof, and hard operating metrics while the surrounding SiC
              market faces insourcing, softer NEV demand, and volatile peer valuations.
            calloutType: risk
            claimRefs:
