    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and industrial footprint
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently describes AscenPower (Guangdong Xinyueneng Semiconductor) as a
              Guangzhou, Nansha-based manufacturer and R&D company focused on automotive-grade and industrial-control
              silicon-carbide power devices, rather than a fabless design startup. Two public sources anchor the
              buildout around a 2021 project with a stated RMB7.5 billion investment plan for 240,000 6-inch wafers per
              year and 240,000 8-inch wafers per year, while public sources place line connection in March 2023, mass
              production in June 2023, and 10,000 wafers per month of 6-inch output by the end of 2023. Product scope is
              also consistent across sources: IGBT, SiC SBD/JBS, and SiC MOSFET devices targeting new-energy vehicles,
              industrial power, smart grids, and photovoltaic applications. The resulting picture is a real
              capital-intensive manufacturing program with credible physical milestones, but still without the audited
              operating disclosures that later underwriting will need.
