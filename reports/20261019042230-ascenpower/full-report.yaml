      - number: '4.2'
        title: Capex burden is clear; margin bridge is still largely private
        blocks:
          - type: paragraph
            body: >-
              The clearest financial fact in the public record is the size of the manufacturing ambition. Independent
              reporting ties the project to RMB7.5 billion of planned investment and dual 6-inch / 8-inch nameplate
              buildout, while later reporting says the line has already entered mass production at 10,000 wafers per
              month. That matters because SiC economics are unusually sensitive to wafer size, yield, and utilization:
              industry sources explicitly call out the shift to eight-inch manufacturing as an economies-of-scale lever,
              and technical analysis says a 200mm wafer carries about 1.78x the area of a 150mm wafer. The problem is
              that none of the retained sources disclose yield, scrap, gross margin, or depreciation burden, so scale is
              visible but the actual unit-economics bridge remains largely private.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI010
              - CI013
