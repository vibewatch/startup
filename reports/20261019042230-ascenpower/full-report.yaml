      - number: '3.2'
        title: Public evidence supports route-to-market and scale comparisons more cleanly than price comparisons
        blocks:
          - type: paragraph
            body: >-
              AscenPower's best-supported differentiation is not lowest-price disclosure; it is a China-based merchant
              route to market with automotive-grade ambitions. TrendForce says phase one was ramping toward 240,000
              annual 6-inch chips and that the reserved second phase targeted 8-inch output, while QCC lists 621 insured
              employees in the 2025 annual report, both consistent with a real operating footprint rather than a lab
              project. Still, the evidence does not place AscenPower at parity with the most disclosed scale leaders.
              semiconductorx ties Wolfspeed's positioning to a first dedicated 200mm SiC fab, and the same source says
              Chinese producers such as SICC, TanKeBlue, Sanan, and BYD are scaling aggressively with state support. The
              direct comparison the public record supports, therefore, is channel openness, manufacturing posture, and
              qualification progress. The public record does not support strong claims about per-unit chip pricing or
              discounting, so the pricing exhibit below stays explicit about unknowns instead of fabricating a
              superficial ASP league table.
