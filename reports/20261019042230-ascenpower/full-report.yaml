      - number: '3.3'
        title: Competitive durability is limited by OEM internalization and the fragile economics of SiC scale
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in this pool is less about one better feature and more about industry structure.
              semiconductorx says Wolfspeed entered Chapter 11 after heavy capex and weaker-than-expected near-term
              revenue, which matters because it shows that even a technologically advanced, vertically integrated SiC
              leader can struggle to convert fab scale into durable shareholder value. TrendForce adds a second pressure
              point: global NEV sales fell year over year in 1Q26, Chinese brands lost share when domestic demand
              weakened, and upstream component cost pressure remained elevated. That combination raises the chance of
              slower utilization ramps or tougher pricing for China-focused SiC vendors. AscenPower's moat is therefore
              conditional. It has evidence of meaningful customer engagement and local auto-grade manufacturing
              progress, but the moat is not yet reinforced by public proof of sustained design-win revenue, 200mm
              manufacturing leadership, or captive downstream demand that would offset a softer EV cycle or a more
              aggressive incumbent response.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: AscenPower is competing from the middle, not from the edge
            body: >-
              The strongest public evidence positions AscenPower between global merchant scale leaders and captive OEM
              substitutes: more externally open than Li Auto or Nio, but with less disclosed 200mm scale than Wolfspeed
              or other incumbents expanding large-format SiC capacity.
            calloutType: insight
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP014
          - type: callout
            title: Captive OEM modules shrink the default merchant opportunity set
            body: >-
              Li Auto's mass production and Nio's C-sample progress show that some EV OEMs are willing to internalize
              SiC modules once platform volume and performance needs justify it, reducing the assumption that every EV
              program will source merchant modules externally.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization is visible, but revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              The public record is enough to identify what AscenPower is trying to sell, but not enough to judge how
              much of that activity has turned into durable revenue. Third-party reporting describes a merchant SiC
              business aimed at automotive-grade and industrial power devices, with customer tape-out and
              sample-validation activity already underway, and it places the company in EV, smart-grid, photovoltaic,
              and industrial end markets. What is still missing is the revenue layer that matters most for underwriting:
              realized ASPs, customer concentration, segment mix, contract duration, and the conversion rate from signed
              tape-out programs into volume production. Even the more accessible English company-database surfaces
              remain skeletal, which reinforces that public databases are not substitutes for operating disclosure here.
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
              - CI014
