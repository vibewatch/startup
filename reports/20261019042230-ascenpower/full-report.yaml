              - CU004
              - CU005
              - CU012
              - CU015
      - number: '6.2'
        title: Adoption signals show a progressing funnel from qualification to early production
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is best read as a sequence of qualification milestones rather than as proof of
              durable recurring revenue. EET China, using company-sourced information from 2023, said AscenPower had
              signed more than 10 COT customers and was close to mass-producing four customer-specific products. 36Kr
              later reported that the production line had entered mass production, reached monthly capacity of 10,000
              wafers, and signed tape-out agreements with more than 40 customers, including OEMs and sample validation
              accounts. Huacheng separately highlighted IATF16949 certification, which reduces one major automotive
              procurement hurdle. Together these signals support a view that AscenPower has moved beyond pure lab-stage
              demand, but they still stop short of naming customers, volumes shipped, or revenue conversion from pilot
              and validation work into sustained production programs.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU012
