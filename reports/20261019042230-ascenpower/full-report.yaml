  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Merchant incumbents, local merchant peers, and captive OEM builds all compete for the same design slots
        blocks:
          - type: paragraph
            body: >-
              The retained pool does not support a narrow "one-peer" framing. AscenPower is selling into an automotive
              and industrial SiC market where buyers can choose among global merchant suppliers, Chinese substrate and
              device specialists, and internal OEM module programs. On the merchant side, AscenPower has public evidence
              of mass-produced 1200V-class chips, more than 40 customer agreements, and tape-out coverage across many
              domestic design companies. That is meaningful progress, but the same evidence set shows larger operators
              with broader manufacturing assets: semiconductorx describes Wolfspeed as the leading Western vertically
              integrated operator with a dedicated 200mm fab, while TrendForce highlights additional incumbent expansion
              from Mitsubishi. At the same time, Li Auto and Nio are not just customers of the ecosystem; their in-house
              SiC module programs show that some vehicle platforms can bypass merchant suppliers altogether, especially
              once production volume justifies internalization.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP009
              - CP010
              - CP011
              - CP014
