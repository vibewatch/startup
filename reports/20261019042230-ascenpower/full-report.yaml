              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The strongest public signal is execution speed on a hard manufacturing problem
            body: >-
              Independent reporting does not prove unit economics or automotive qualification, but it does show that
              AscenPower moved from project launch to clean-room completion and then to a mass-production narrative
              unusually quickly for a capital-intensive SiC fab build.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
          - type: callout
            title: Public maturity evidence lags the mass-production story
            body: >-
              The chapter's key risk is not that AscenPower lacks a visible product category, but that public evidence
              still stops short of named SOP customers, official datasheets, qualification disclosures, and
              practitioner/developer proof that would validate the automotive-grade positioning in day-to-day field use.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are broad, but public proof remains mostly anonymous
        blocks:
          - type: paragraph
            body: >-
              The assigned sources consistently position AscenPower as a supplier to automotive-grade and industrial
              power-device buyers rather than a single-program specialist. Company-sourced and independent profiles
              point to use cases in new-energy vehicles, industrial power, smart grids, and photovoltaic equipment,
              which matters because SiC demand is pulled by several end markets rather than just passenger EVs. That
              breadth improves theoretical account coverage, but the proof stack is still weighted toward anonymous
              aggregates instead of named production deployments. The strongest public adoption claims are counts of
              signed customers and tape-out programs, not customer names, contract values, or production revenue shares,
              so the chapter's customer story is directionally positive but still thin on directly verifiable
              account-level evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU012
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
