              - CI005
              - CI009
              - CI010
              - CI012
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI010
              - CI012
              - CI013
      - number: '4.3'
        title: External pressure points could slow pricing power and fab utilization
        blocks:
          - type: paragraph
            body: >-
              The industry backdrop is supportive in the long run but demanding in the near term. Technavio still
              forecasts fast SiC market expansion, yet supplier capture is not guaranteed: CnEVPost reported Li Auto
              mass-producing its own SiC modules, and CNBC's Rhodium-backed reporting argues that the strongest Chinese
              EV cost advantages come from vertical integration, scale, and working-capital discipline rather than
              subsidies alone. TrendForce adds a second caution, noting a 2% year-over-year decline in global NEV sales
              in 1Q26, weak Chinese demand, and rising component-cost pressure. For AscenPower, that combination means
              the commercial question is not only whether demand exists for SiC, but whether enough of that demand
              remains available to an independent merchant supplier at acceptable pricing and utilization.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
      - number: '4.4'
        title: Capital adequacy is the core diligence blocker
        blocks:
          - type: paragraph
            body: >-
              Public sources do show real financing momentum: 36Kr says AscenPower closed about RMB1 billion of Series A
              funding and reported a post-money valuation above RMB7 billion, and policy support in Nansha can offset a
              portion of fab capex. Even so, disclosed financing still looks small relative to the disclosed project
              scale, which implies further capital needs unless there is additional debt, subsidy, or
              customer-prepayment support that is not public. Because the retained sources do not disclose cash balance,
              debt terms, burn, working capital, or runway, the current evidence supports a forward-looking conclusion
              but not a full underwriting case: AscenPower may be building a strategically relevant SiC asset, but
              public data still leaves its financing dependency unresolved.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale can matter before revenue becomes visible
            body: >-
              The strongest bullish signal in the public record is not current revenue but the combination of disclosed
              nameplate ambition, reported mass-production progress, and industry evidence that larger wafers can
              materially improve SiC cost economics.
            calloutType: insight
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI010
          - type: callout
            title: Financing dependency remains the core underwriting risk
            body: >-
              Public financing disclosures are meaningful, but they are still small relative to the disclosed fab
              ambition and come without the cash, debt, or runway data needed to judge whether the business can
              self-fund its ramp.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is clear; maturity proof is still mostly company-framed
        blocks:
          - type: paragraph
            body: >
              The public evidence consistently describes AscenPower as a silicon-carbide power-device manufacturer
              focused on automotive and industrial power conversion rather than a broad semiconductor-design platform.
              Across JW Insights/Laoyaoba and 36Kr, the named portfolio is SiC SBD/JBS, MOSFET, and IGBT devices for
              new-energy vehicles, industrial power supplies, smart grids, and photovoltaic applications. The maturity
              signal is stronger than a concept-stage fab story: reporting says the company had reached mass production
              for a series of vehicle and industrial-control chips and disclosed 1200V plus 16mOhm/35mOhm
              specifications. The reports also use a 10,000-per-month 6-inch "chip" or "piece" capacity formulation
              without resolving whether the count denotes wafers or finished dies. The available evidence therefore
              remains weighted toward company-described progress rather than third-party verification of shipping
              programs, field reliability, or published product documentation.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE013
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE013
              - CE015
      - number: '5.2'
        title: The operating model is a fab buildout tied to wafer-scale execution and EV demand
        blocks:
          - type: paragraph
            body: >
              The architecture that is actually visible in public sources is an operating stack: clean-room completion,
              equipment move-in, line commissioning, then scale-up of 6-inch and 8-inch silicon-carbide capacity into
              customer tape-out and validation. AscenPower's project was reported as a RMB7.5 billion build with planned
              annual output of 240,000 6-inch and 240,000 8-inch SiC "chips," although the public wording does not
              settle whether those counts denote wafers or finished dies. The company framed the November 2022
              clean-room milestone as the handoff to equipment move-in and commissioning. Industry sources matter
              because they explain what the company narrative does not: TrendForce and SemiconductorX describe a SiC
              supply chain constrained by automotive adoption, expensive upstream materials, and the 150mm-to-200mm
              transition. AscenPower's product story therefore depends on sustaining substrate, tooling, qualification,
              and yield execution through a capital-intensive manufacturing ramp.
            claimRefs:
              - CE003
              - CE005
              - CE009
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE009
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE009
              - CE011
              - CE012
              - CE015
      - number: '5.3'
        title: Differentiation rests on domestic auto-grade positioning, but public controls remain under-documented
        blocks:
          - type: paragraph
            body: >
              Public differentiation claims are understandable: sources describe AscenPower as one of China's largest
              automotive-focused SiC manufacturing projects, highlight a fast 15-month buildout to formal line-through,
              and link the business to a domestic push for localized automotive-grade power semiconductors. Those are
              meaningful advantages if they translate into stable supply for local EV and industrial customers. The
              unresolved issue is control evidence. The available sources cite signed tape-out or sampling customers,
              but not named SOP automotive programs; they discuss product families and capacity, but not official
              datasheets, public qualification reports, or a visible developer or practitioner surface that would let
              outsiders inspect integration depth. Investors should therefore treat the moat as plausible but only
              partially verified, with the biggest diligence need on qualification, product documentation, and real
              customer production status.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE010
              - CE013
              - CE014
          - type: table
            tableRef: TE002
