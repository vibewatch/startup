  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          8-inch expansion stays on schedule and signed programs convert into disclosed automotive or industrial
          production revenue.
        - >-
          Paying above the last disclosed post-money mark is only reasonable if revenue, margin, and qualification data
          show a step-change before the next financing or exit event.
        - Qualification delays, yield misses, and working-capital strain.
        - Need fresh disclosures showing commercial conversion rather than sample activity.
      - - Base
        - Fab buildout remains real but monetization proof stays partial and merchant SiC comps remain cautious.
        - >-
          Underwrite at or below the last disclosed financing anchor with downside protection because upside depends on
          diligence optionality rather than visible multiple expansion.
        - Slow customer conversion and flat public comp sentiment.
        - Current evidence fits this case best.
      - - Bear
        - >-
          NEV demand softens, OEM insourcing reduces merchant demand, and new capital arrives before economics are
          disclosed.
        - >-
          Expect flat-to-down pricing versus the last disclosed round because dilution or preference overhang can absorb
          operating progress.
        - Down-round risk, preference stack complexity, and weaker exit liquidity.
        - Industry softness plus insourcing evidence already point to this downside path as credible.
    notes: >-
      Scenario logic is directional instead of numeric because the retrieved pool does not disclose current revenue,
      margins, or share count needed for a defendable precise valuation model.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
