  topStrengths:
    - Public evidence supports a real automotive-grade SiC manufacturing buildout with 6-inch and 8-inch capacity plans.
    - The company secured meaningful 2024 financing and appears to have strong local policy and industrial support.
    - >-
      Public disclosures tie the product set to end markets with durable demand drivers such as EVs, industrial power,
      grid, and solar.
  topRisks:
    - Revenue, gross margin, cash balance, burn, and runway remain undisclosed.
    - >-
      Named production-stage customers and the revenue-bearing mix between samples, tape-out, and production programs
      remain unclear.
    - >-
      Large-capex execution risk persists as the company ramps 6-inch and 8-inch capacity while competitors and OEMs
      internalize more SiC content.
  unresolvedGaps:
    - >-
      Revenue, gross margin, cash balance, burn, and runway are not publicly disclosed, blocking price-sensitive
      underwriting.
    - >-
      Named mass-production customers, PPAP / automotive verification status, and actual revenue-bearing mix between
      sample, tape-out, and production programs remain unclear.
    - >-
      Full board composition, control rights, cap-table percentages, and liquidation preferences for the 2024 Series A
      are not public.
    - >-
      The public project-scale story still contains unresolved tension between RMB7.5B and RMB9B total-investment
      claims.
