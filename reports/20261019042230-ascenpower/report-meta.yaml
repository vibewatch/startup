companyProfile:
  summary: >-
    AscenPower is a Guangzhou-based automotive-grade silicon carbide power-device manufacturer focused on SiC SBD/JBS,
    MOSFET, and IGBT products for electric vehicles, industrial power, smart-grid, and photovoltaic applications. Public
    sources describe a large 6-inch and 8-inch capacity buildout, a 2024 Series A financing round, and an operating ramp
    that has progressed from sample and qualification work toward larger-scale production, but the company still
    discloses little about revenue, margins, or customer mix.
  foundingLocation: Guangzhou, China
  headquarters: Nansha District, Guangzhou, China
  productSummary: >-
    Automotive-grade silicon carbide power devices, including SiC SBD/JBS, MOSFET, and IGBT wafers and related power
    solutions.
  customerFocus: EV, industrial power, renewable-energy, grid, and photovoltaic applications
  businessModel: >-
    Selling SiC power-device wafers and related semiconductor products into automotive and industrial power-conversion
    programs
  stage: Series A / growth-stage manufacturing
  fundingStatus: Completed a September 2024 Series A of about RMB1 billion / $142.4 million
  disclosureProfile: private-disclosed
  claimRefs:
    - CI001
    - CI003
    - CI005
summary:
  headline: >-
    AscenPower has a credible SiC manufacturing buildout and real funding momentum, but the public record still leaves
    revenue quality, customer conversion, and margin durability unresolved.
