company:
  name: AscenPower
chapter:
  number: 7
  title: Risks
  summary: >-
    AscenPower's most material downside is execution: a RMB7.5 billion silicon-carbide buildout
    moved from founding to claimed mass production in roughly three years even though SiC remains
    yield-sensitive, substrate-constrained, and mid-transition to 200mm economics. Chinese EV demand
    softness, rising component costs, and clear OEM insourcing by Nio and Li Auto mean utilization,
    customer conversion, and future financing remain more important than the topline "40+ customers"
    narrative.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The public downside case starts with execution rather than demand alone. 36Kr says AscenPower
      was founded in 2021, built its line in about 15 months, and now claims mass production at
      10,000 wafers per month, while SemiconductorX describes SiC as a physics-limited process with
      slower boule growth, lower yields than silicon, and a consequential 150mm-to-200mm transition.
      That combination makes the company's 6-inch/8-inch scale-up vulnerable to yield slippage,
      slower-than-expected customer conversion, and capex overruns. The demand backdrop is not
      forgiving: TrendForce reported a 2% YoY decline in global NEV sales in 1Q26 with China
      underperforming, so any ramp miss could coincide with weaker utilization and heavier pricing
      pressure.
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR007, CR013]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-and-capital-risks
    title: Regulatory, legal, and capital-formation risks
    body: >-
      The chapter's direct public evidence does not show an active lawsuit, permit failure, or
      enforcement action against AscenPower, but it also does not clear those areas. The same source
      set shows a strategically important, state-backed project with a disclosed RMB7.5 billion
      investment plan and state-linked A-round leadership, which means regulatory continuity,
      environmental compliance, and future financing are material diligence items rather than closed
      questions. Sector comparables reinforce the financing risk: SemiconductorX says Wolfspeed filed
      Chapter 11 in mid-2025, while public market-cap trackers still show a sharply compressed equity
      value in 2026. That is a reminder that scale alone does not immunize SiC fabs from capital
      stress when utilization or pricing disappoints.
    claimRefs: [CR002, CR010, CR011, CR012, CR013]
    tableRefs: [TR001]
  - id: dependency-and-conversion-risks
    title: Dependency and customer-conversion risks
    body: >-
      The best public evidence of customer traction is still early-stage: 36Kr says AscenPower has
      signed tape-out deals with more than 40 customers and includes automakers plus sample-validation
      customers, but that is not the same as recurring production revenue. At the same time, both
      Nio and Li Auto disclosed progress on in-house SiC modules, showing that Chinese OEMs can
      internalize meaningful parts of the value chain rather than remain permanent external demand
      anchors. Combined with TrendForce's warning that domestic-demand concentration hurt Chinese BEV
      brands in 1Q26, AscenPower's partner risk is not just supplier concentration; it is whether
      a small set of automotive and design-house programs convert into durable, margin-supportive
      wafer volume before sector pricing resets.
    claimRefs: [CR003, CR006, CR008, CR009, CR014]
    tableRefs: [TR003]
