callouts:
  - calloutType: risk
    title: Kill criteria to test before underwriting
    body: >-
      The thesis should worsen materially if AscenPower cannot show stable 8-inch yields, named SOP
      customers, and credible next-stage financing while the Chinese EV market remains price-sensitive
      and major OEMs continue to internalize SiC modules.
    claimRefs: [CR003, CR005, CR006, CR009, CR010, CR011]
  - calloutType: insight
    title: What would de-risk the story fastest
    body: >-
      The most valuable diligence package would be a combined operating proof set: yield and scrap
      curves by wafer size, named production customers rather than tape-out counts, and documentary
      evidence on permits, quality qualifications, and any material legal or IP exposure.
    claimRefs: [CR001, CR003, CR012, CR014]
