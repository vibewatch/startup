  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: metric-gaps
    missingEvidence: Current revenue, ARR, division-level revenue, active customer count, and audited headcount from management
      or investor materials.
    whyItMatters: These numbers determine whether Atoms is valued as a scaled operating platform or as a capitalized robotics
      option.
    diligencePath: Request board deck, management KPI bridge, payroll summary, and division-level P&L for 2024-2026.
    relatedQuestionRefs:
    - QO014
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-gaps
    missingEvidence: Complete board roster, investor rights, voting control, debt terms, and any related-party commercial
      agreements with Uber or other investors.
    whyItMatters: The public record only names Ben Horowitz, so control, downside protections, and conflict risks remain opaque.
    diligencePath: Request financing documents, shareholder register, board minutes, debt commitments, and strategic-investor
      side letters.
    relatedQuestionRefs:
    - QO010
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map
    missingEvidence: Ownership percentages, check sizes, and any unnamed cap-table holders or lenders not disclosed in public
      reporting.
    whyItMatters: The investor map is useful directionally but cannot establish control or economic exposure by stakeholder.
    diligencePath: Reconcile the public stakeholder list against the post-money capitalization table and debt schedule.
    relatedQuestionRefs:
    - QO011
    - QO013
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: TO004 milestone coverage and transport-traction
    missingEvidence: Named Atoms Transport pilots, customers, regulatory approvals, or technical specifications.
    whyItMatters: Transport is a core division in the strategy but has weaker public proof than Atoms Mining.
    diligencePath: Ask management for Transport roadmap, pilot contracts, safety case, and regulatory deployment plan.
    relatedQuestionRefs:
    - QO006
    - QO025
    relatedTableRefs:
    - TO004
