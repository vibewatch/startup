company:
  name: Atoms
chapter:
  number: 1
  title: Company Overview
  summary: Atoms is the March 2026 rebrand of City Storage Systems, turning the CloudKitchens parent into a Kalanick-led industrial
    automation holding company with Food, Mining, and Transport divisions. The chapter anchors the July 22, 2026 $1.7B a16z-led
    round, reported ~$10B valuation, Pronto mining proof points, and the leadership/adverse-history risks that later chapters
    should reuse without drifting.
sections:
- id: identity-and-operating-perimeter
  title: Identity and operating perimeter
  body: 'Atoms is the March 2026 public rebrand of City Storage Systems, the parent company that had been best known for CloudKitchens.
    That identity matters because Atoms is not a clean-sheet single-product robotics startup; it is an industrial automation
    holding company that rolls a delivery-optimized food-infrastructure business, a mining-autonomy asset, and an earlier
    transport-automation ambition into one Kalanick-led platform. The canonical perimeter is three divisions: Atoms Food,
    Atoms Mining, and Atoms Transport. Atoms Food inherits CloudKitchens’ kitchen-as-a-service real estate and delivery infrastructure
    and now also includes food-robotics work such as Lab37 and Bowl Builder. Atoms Mining is anchored by Pronto’s autonomous-haulage
    stack. Atoms Transport is less evidenced publicly and is best treated as a directional “wheelbase for robots” ambition
    rather than a proven commercial line. The practical overview conclusion is that Atoms combines live operating assets with
    a much broader bits-to-atoms thesis. This perimeter also prevents later chapters from treating CloudKitchens, Pronto,
    or Atoms Transport as separate companies when they are better analyzed as division-level exposures inside the same private
    platform.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO019
  - CO029
  - CO030
  - CO032
