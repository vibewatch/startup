- id: funding-valuation-and-stakeholders
  title: Funding, valuation, and stakeholders
  body: 'The current financing marker is unusually large for a private robotics and industrial-AI platform: Atoms announced
    a $1.7B round on July 22, 2026 led by Andreessen Horowitz, with Ben Horowitz joining the board. Reported equity participants
    include Uber, Bain Capital, Fifth Wall, Chemistry, A*, K5 Global, Abstract, SV Angel, and Alpha Square Group, while Yahoo
    Finance and The Robot Report also name major banks as debt partners without disclosing facility size. The reported or
    implied post-money valuation is approximately $10B, but that should remain medium-confidence because it is a press-derived
    figure, not an official Atoms disclosure. Funding history also includes the CloudKitchens base: a $400M 2019 Saudi PIF
    investment at roughly $5B and a Microsoft-included 2021 round reported at about $15B. Those historical marks should not
    be confused with the July 2026 Atoms valuation because the company perimeter and investor story have changed.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO017
  - CO018
  - CO037
  tableRefs:
  - TO003
  figureRefs: []
- id: milestones-proof-points-and-gaps
  title: Milestones, proof points, and metric gaps
  body: 'The milestone record has two distinct halves. The first half is CloudKitchens: 2016 founding, Kalanick’s 2018 City
    Storage Systems takeover, the 2019 Saudi PIF round, the 2021 Microsoft-included round, and the March 2026 Atoms rebrand.
    The second half is Pronto and the Atoms Mining proof path. Pronto’s public materials say it was founded in 2018; Heidelberg
    Materials and VentureBeat report more than 2M tons autonomously hauled at Lake Bridgeport; Pronto and Hitachi announced
    a July 2026 strategic partnership for open mine automation; and Pronto materials point to expansion toward 100+ trucks.
    These proof points make Atoms Mining better evidenced than Atoms Transport. Important cover metrics remain unavailable:
    current revenue, ARR, customer count, audited headcount, and division-level economics are not publicly disclosed. The
    chapter therefore treats the $1.7B round, reported ~$10B valuation, three divisions, and named deployment milestones as
    reusable facts, while preserving explicit gaps for private operating metrics.'
