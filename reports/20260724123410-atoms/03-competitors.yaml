- id: moat-durability
  title: Moat durability and incumbent response
  body: 'The adverse reading is that Atoms faces incumbents exactly where switching costs are highest. Mining and warehouse
    automation are not app categories where a buyer can churn weekly: deployments touch site maps, safety procedures, fleet
    maintenance, worker training, capital budgets, and uptime guarantees. Caterpillar, Sandvik, ASI, Symbotic, GreyOrange,
    and Locus each make claims that map to those buyer anxieties, and Hitachi’s partnership with Pronto validates the need
    for OEM channels even as it supports Atoms Mining. Food is less sticky because tenants, brands, and consumers can multi-home
    across kitchens, marketplaces, and delivery surfaces. Transport is strategically attractive but exposed: Aurora, Kodiak,
    Waabi, PlusAI, Gatik, and Bot Auto already offer clearer autonomous-freight narratives than Atoms Transport publicly provides.
    The moat case therefore rests on integration and compounding deployment data, not on the mere existence of specialized
    robots.'
  claimRefs:
  - CP014
  - CP015
  - CP016
  - CP029
  - CP030
  - CP033
  - CP034
  - CP035
  - CP038
  - CP039
