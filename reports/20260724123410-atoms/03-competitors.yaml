- id: capability-and-packaging
  title: Capability, pricing, and packaging comparison
  body: 'The capability comparison shows why Atoms’ breadth is simultaneously a differentiator and a diligence problem. No
    reviewed rival spans food infrastructure, food robotics, mining AHS, autonomous freight, and warehouse automation with
    the same stated ambition. However, specialists often show deeper proof in one buyer workflow. Caterpillar and Sandvik
    speak directly to mine safety and equipment operations; Gatik, PlusAI, Aurora, Kodiak, Waabi, and Bot Auto speak directly
    to freight buyers; Symbotic, GreyOrange, and Locus speak directly to warehouse throughput. Public pricing is too sparse
    to normalize into a rate card. CloudKitchens directs buyers to get price, Pronto and mining incumbents look enterprise
    quoted, Bot Auto packages freight as Transportation-as-a-Service, and Locus uses Robots-as-a-Service. Unknown cells are
    therefore important evidence, not cosmetic blanks: the lack of disclosed prices, contract terms, safety incidents, and
    realized deployment economics limits any claim that Atoms can underprice or outdeploy incumbents.'
