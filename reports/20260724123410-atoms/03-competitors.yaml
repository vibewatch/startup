  - FP003
- id: diligence-gaps
  title: Diligence gaps before underwriting displacement
  body: 'Several public-source gaps remain material. Komatsu, Epiroc, Zebra/FETCH, REEF, and Local Kitchens could not be supported
    with detailed current feature cells from the retrieved pages, so the matrix treats those entries cautiously rather than
    guessing. More importantly, Atoms itself has not disclosed enough division-level operating data to prove displacement.
    Investors need win/loss data against mining OEM AHS vendors, retrofit payback by haul profile, kitchen site utilization
    and churn, Bowl Builder throughput, realized pricing, safety performance, and Transport customer pilots. The absence of
    those metrics does not invalidate the strategy, but it means the competitive conclusion should be probabilistic: Atoms
    has a credible mining wedge and unusual cross-vertical ambition, while food and transport durability remain exposed to
    specialists, incumbents, and customer internal-build alternatives. This matters for diligence because a buyer-specific
    competitor set changes the burden of proof: Atoms must show why an operator should standardize on its system instead of
    buying a narrower incumbent product, delaying automation, or combining several specialist vendors. The next review should
    test these choices customer by customer.'
  claimRefs:
  - CP027
  - CP032
  - CP036
  - CP038
  - CP040
