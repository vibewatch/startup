- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence signal
  - Mitigation / diligence ask
  rows:
  - - Three-vertical physical-AI platform
    - Execution focus diluted across unrelated buyer sets
    - High
    - Atoms vision spans Food, Mining, Transport
    - Require division-level KPIs and capital allocation plan
  - - CloudKitchens real-estate network
    - Multi-brand food platforms and delivery marketplaces multi-home demand
    - Medium
    - Wonder, C3, CookUnity and Kitchen United each solve food demand differently
    - Compare site-level utilization and tenant churn
  - - Lab37 / Bowl Builder food automation
    - Chef Robotics and Miso provide narrower point automation
    - Medium
    - Food robotics vendors market physical AI and kitchen task automation
    - Benchmark throughput, labor savings, uptime, sanitation certification
  - - Pronto OEM-agnostic retrofit
    - Caterpillar, Sandvik, ASI and Komatsu-like incumbents bundle automation with fleets
    - High
    - Incumbent pages emphasize autonomous fleets, scale, safety and installed equipment
    - Ask for win/loss versus OEM AHS and retrofit payback
  - - Hitachi partnership
    - Partner could also preserve OEM leverage
    - Medium
    - Hitachi validates Pronto while highlighting open options for customers
    - Clarify exclusivity, channel economics, and roadmap control
  - - Atoms Transport wheelbase vision
    - Aurora, Kodiak, Waabi, PlusAI, Gatik and Bot Auto already target freight
    - High
    - Multiple rivals show driverless freight or OEM-partner proof
    - Require product definition and lane/customer pilots
  - - Warehouse logistics adjacency
    - Symbotic, GreyOrange and Locus have customer or deployment scale
    - Medium
    - Warehouse vendors claim Walmart proof, global sites, productivity improvements
    - Define where Transport stops and warehouse robotics begins
  - - Private integrated data advantage
    - Customers can defer, internally build, or buy point tools
    - Medium
    - Status quo and enterprise quote unknowns remain common
    - Demand cohort retention, safety incidents and ROI evidence
  notes: Severity ranks risk to Atoms differentiation, not the standalone attractiveness of each competitor.
