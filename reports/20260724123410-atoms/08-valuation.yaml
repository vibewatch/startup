- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Representative valuation references across Atoms Food, Mining and Transport with accessible 2026 public filings
      or market-data pages.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - DoorDash
    - Public food-delivery scale and market multiple
    - Premium delivery platform multiple from filing and market data
    - Best public benchmark for delivery marketplace economics
    - More mature, profitable and marketplace-heavy than Atoms Food
  - - Wonder
    - Private food-infrastructure round
    - Reported $9B-type private valuation context with heavy losses
    - Shows private appetite for vertically integrated food infrastructure
    - Not a public comp and economics differ
  - - Just Eat Takeaway
    - Public European delivery market cap
    - Lower-growth delivery platform valuation reference
    - Helps bound mature delivery downside
    - Europe-heavy and not a kitchen real-estate operator
  - - Ghost-kitchen market reports
    - Category size and startup valuation dispersion
    - Growth market but top-heavy private valuations
    - Frames Atoms Food market and compression risk
    - Market size does not equal investable value
  - - Caterpillar
    - Public heavy-equipment filing and market multiple
    - Mature OEM multiple and mining-exposure anchor
    - Sets durable industrial equipment baseline
    - Diversified industrial company, not pure autonomy
  - - Komatsu
    - Public heavy-equipment market-cap reference
    - Mining automation and electrification benchmark
    - Strategic mining-automation peer
    - Less directly comparable to software-like autonomy
  - - Symbotic
    - Public robotics automation filing and multiple
    - High-growth robotics automation reference
    - Shows robotics names can trade above industrial multiples
    - Warehouse automation rather than mining haulage
  - - Autonomous mining market
    - Independent market reports
    - Multi-billion-dollar market with growth forecasts
    - Supports option value for Atoms Mining
    - Market reports are not customer proof
  - - Aurora
    - Public autonomous-trucking filing and market data
    - Milestone-driven AV valuation reference
    - Best public proxy for Transport option value
    - Pre-scale economics make multiple volatile
  - - Kodiak
    - Autonomous-trucking transaction reference
    - SPAC/transaction-style valuation signal
    - Shows transport autonomy capital-market path
    - Fetched URL was inaccessible, so use only as low-confidence context
  notes: The table is a sample comparable set, not an exhaustive universe; multiples are directional because Atoms has no
    public divisional revenue.
