- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Food stabilizes, Mining scales signed deployments, Transport shows credible milestones
    - $14B-$18B supported if Mining earns platform-like credit and Food avoids further compression
    - Requires strong private financials and commercial mining proof
    - Possible but not yet public-evidence base case
  - - Base
    - Food receives moderated credit, Mining gets meaningful option value, Transport remains mostly option value
    - $8B-$11B pre-final terms; reported $10B sits near the upper-middle of supportable range
    - Limited public revenue and margin disclosure
    - Most consistent with public evidence
  - - Bear
    - Food is impaired, Mining is pilot-heavy, Transport burns capital without milestones
    - $4.5B-$6.5B support; reported $10B would be overvalued
    - Multiple compression, governance and capital intensity
    - Plausible enough to block buy rating
