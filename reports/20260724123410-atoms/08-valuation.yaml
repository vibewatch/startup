- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Food impairment
    - Food segment value support below $2B with weak occupancy or churn
    - Removes legacy asset support for $10B mark
    - Do not invest at current price
  - - Mining non-repeatability
    - No signed multi-site deployments or safety/utilization evidence
    - Eliminates highest-quality option value
    - Cut target valuation range materially
  - - Transport capital drain
    - Large burn with no commercial milestone path
    - Turns option value into funding overhang
    - Require ring-fenced budget or discount heavily
  - - Preference-stack overhang
    - Round terms create poor common-equity downside participation
    - Good headline valuation may not translate to common return
    - Demand term sheet detail before IC approval
  - - Governance/key-person issue
    - Material legal, safety, or conduct issue involving key leaders
    - Raises execution and exit discount
    - Pause investment pending board controls
  - - Comp multiple compression
    - Food delivery and robotics comps de-rate by 30%+ without offsetting proof
    - Base-case SOTP falls below reported valuation
    - Reprice or move to avoid
  notes: Triggers are designed to be monitorable in confirmatory diligence rather than generic risk statements.
  claimRefs:
  - CV031
  - CV032
  - CV035
  - CV036
  - CV038
  - CV039
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Divisional P&L
    - Revenue, gross margin, contribution margin and capex by Food, Mining and Transport
    - Required to replace SOTP estimates with operating value
    - CFO data room and audited management accounts
  - - Food unit economics
    - Occupancy, churn, rent yield, delivery-channel costs and brand cohort margins
    - Determines whether Food deserves anything near prior CloudKitchens marks
    - Ops review plus location cohort export
  - - Mining proof
    - Signed contracts, truck count, safety incidents, utilization and customer ROI
    - Determines whether Mining earns platform option value
    - Customer calls and deployment-level KPIs
  - - Transport milestones
    - Roadmap, partner contracts, regulatory status and burn by milestone
    - Prevents over-crediting a pre-commercial option
    - Product/engineering milestone review
  - - Financing terms
    - Liquidation preferences, seniority, anti-dilution and pro-rata rights
    - Headline post-money can overstate common-equity value
    - Review full financing documents
  - - Governance controls
    - Board rights, related-party policies, safety committee and key-person coverage
    - Mitigates Kalanick/Levandowski reputational discount
    - Legal diligence and board interviews
  notes: These asks are the minimum evidence needed to move from track to buy at or near the reported valuation.
