tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - CloudKitchens private kitchen facilities
    - Delivery-first restaurant operators
    - Live operating infrastructure
    - Purpose-built delivery, pickup, production, managed front-of-house, and plug-and-play kitchens
    - Site-level utilization, defect, churn, and real estate economics are not public
  - - CloudKitchens kitchen software and operations layer
    - Ghost-kitchen managers and brand operators
    - Live but incompletely documented
    - Order aggregation, marketplace strategy, real-time visibility, and analytics positioning
    - Exact proprietary software boundary versus third-party POS tools is not disclosed
  - - Lab37 Bowl Builder
    - Bowl, salad, and rice-bowl operators
    - Commercializing food-robotics product
    - Thermally controlled dispensers, robotic assembly, lidding, and bagging from online/offline orders
    - Public proof of throughput, uptime, and customer economics beyond company claims remains limited
  - - Food assembly patent family
    - Atoms / Lab37 engineering team
    - Published patent application
    - Conveys concrete mechanical architecture for bowl dispense, ingredient dispense, condiments, lidding, and bagging
    - Patent claims do not prove scaled manufacturing readiness or freedom to operate
  - - Pronto AHS Vision
    - Quarry and aggregate operators
    - Field-proven in named quarry deployments
    - Camera/GNSS-led, OEM-agnostic retrofit autonomy with smartphone route dispatch
    - Needs safety-case, ODD, incident, and uptime disclosure by site
  - - Pronto AHS VLR and VLR 360
    - Larger mines and harder operating environments
    - Announced tiered product line in 2026
    - Vision plus lidar/radar for all-weather and ultra-class mining environments
    - Public data on deep-pit production use is still early
  - - Atoms Transport wheelbase
    - Future robot logistics and heavy-transport users
    - Concept / earliest public stage
    - Extends bits-to-atoms transport thesis beyond Food and Mining
    - No public product spec, deployment, or customer evidence found
  notes: Maturity labels reflect public evidence only; private production deployments or internal roadmaps may be broader than the reviewed sources.
