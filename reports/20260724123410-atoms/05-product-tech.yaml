- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Atoms solution
  - Measurable benefit
  - Limitation
  rows:
  - - Launch a delivery-first food brand
    - Lease, build, permit, and staff a restaurant or commissary
    - CloudKitchens private kitchens optimized for delivery and pickup
    - Lower upfront investment and faster market entry are the stated benefits
    - Public evidence does not quantify occupancy or payback by site
  - - Manage multiple delivery apps
    - Operate separate tablets and update menus per marketplace
    - CloudKitchens and delivery API integration layer for menus, orders, and store operations
    - Fewer manual handoffs and real-time menu/order synchronization
    - Exact integration ownership and error-rate data are not disclosed
  - - Assemble high-volume bowl orders
    - Human makeline assembles, lids, and bags orders
    - Lab37 Bowl Builder automates dispense-to-bag-close workflow
    - Lab37 claims up to 50% labor-cost savings and fewer order defects
    - Company-claimed economics require cohort proof
  - - Autonomously run quarry haul routes
    - Drivers repeatedly move material on fixed or semi-fixed haul routes
    - Pronto AHS learns a route once and dispatches autonomous trucks by mobile app
    - Lake Bridgeport reportedly moved more than two million tons autonomously
    - Safety and downtime denominators remain private
  - - Retrofit mixed OEM fleets
    - Mines avoid replacing trucks solely for autonomy
    - Pronto drive-by-wire retrofit and OEM-agnostic AHS
    - Mixed Caterpillar and Komatsu fleet proof supports lower switching cost
    - Retrofit complexity by truck model is not public
  - - Extend autonomy into harsh mines
    - Vision-only systems face fog, dust, snow, and long stopping-distance limits
    - Pronto AHS VLR / VLR 360 adds lidar and radar to the vision stack
    - Wider operational design domain is the stated benefit
    - Production proof for the newest tiers is less mature than quarry evidence
  notes: Benefit statements are stated or inferable from public sources; unsupported numerical uplift is treated as a diligence gap.
