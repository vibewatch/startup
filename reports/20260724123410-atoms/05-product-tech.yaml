company:
  name: Atoms
chapter:
  number: 5
  title: Product & Technology
  summary: Atoms is a three-division physical-automation company whose public product evidence is strongest in Food and Mining and still sparse in Transport. The Food stack combines CloudKitchens delivery infrastructure, Lab37's Bowl Builder robot, kitchen software, and delivery-platform integrations; the Mining stack inherits Pronto's camera-first, OEM-agnostic autonomous-haulage system; Transport remains mostly a stated "wheelbase for robots" ambition rather than a separately documented product line.
sections:
- id: product-surface-across-three-divisions
  title: Product surface across Food, Mining, and Transport
  body: >
    Atoms should not be diligence-framed as a single robotics product. Public materials define it as an industrial automation holding company with three product surfaces: Atoms Food, Atoms Mining, and Atoms Transport. Atoms Food is the most vertically integrated surface because it combines CloudKitchens' delivery-optimized real estate and managed kitchen infrastructure with Lab37's food-robotics line. CloudKitchens describes private kitchens inside facilities built for delivery, pickup, and food production, while Lab37 describes Bowl Builder as a makeline robot that turns manually prepared ingredients into assembled, lidded, bagged orders. Atoms Mining is also concrete: Pronto says it delivers off-road autonomous haulage systems for mines and quarries, and its Atoms announcement says Pronto became the core technology engine of Atoms Mining. Atoms Transport is materially less mature in public evidence; Atoms' own vision page calls it a "wheelbase for robots," but no comparable external product page or deployment proof was found in the reviewed pack. This asymmetry drives the technical diligence agenda for every division.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE030
