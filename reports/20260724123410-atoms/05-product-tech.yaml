- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Food real estate and facility layer
    - Provides kitchen capacity, pickup, delivery, and production infrastructure
    - Local permits, sites, managed common areas, and delivery geography
    - Utilization, food-safety, and real estate fixed-cost risk
  - - Order and marketplace integration layer
    - Synchronizes menus, orders, pricing, availability, and operations across delivery channels
    - Uber Eats APIs, DoorDash Marketplace APIs, POS systems, webhooks, and operator data hygiene
    - API policy changes, rate limits, and marketplace fee economics
  - - Bowl Builder mechanical line
    - Dispenses containers, ingredients, condiments, lids, and bags for bowl orders
    - Ingredient preparation, thermal control, dispenser reliability, food packaging, and POS/order feed
    - Food variability, sanitation, downtime, and maintenance complexity
  - - Pronto perception layer
    - Detects obstacles and operating context for autonomous haulage
    - HDR cameras, GNSS, machine-learning perception, lidar/radar in VLR tiers
    - Dust, fog, snow, camera occlusion, and edge-case classification risk
  - - Pronto vehicle interface and controls
    - Actuates existing trucks and support vehicles
    - Retrofit drive-by-wire, vehicle CAN/interfaces, calibration, all-stop controls
    - Truck-model variability and safety certification gaps
  - - Pronto site operations software
    - Learns routes, dispatches trucks, applies site safeguards, monitors health
    - Mobile app, network coverage, maps/routes, operator procedures, system health checks
    - Route-change management, connectivity loss, and operational handoff risk
  - - Transport wheelbase platform
    - Future base for robotic logistics and movement of goods
    - Undisclosed autonomy stack, manufacturing, and deployment partners
    - Public product evidence too limited to underwrite maturity
  notes: The architecture is reconstructed from public product, patent, API, and job-posting evidence; it is not a private system diagram.
