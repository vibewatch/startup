- id: trust-controls-dependencies-and-diligence-gaps
  title: Trust controls, critical dependencies, and diligence gaps
  body: >
    The technical diligence risk is not absence of product; it is boundary opacity across a very broad physical-automation portfolio. Pronto publishes clearer safety and deployment language than most of Atoms: computer vision and GNSS, drive-by-wire retrofit, all-stop buttons, redundant neural networks, site safeguards, system health checks, and mixed-fleet support. Still, neither Atoms nor Pronto publishes a safety case, incident history, disengagement rate, formal certification package, or third-party audit of the AHS stack. Food has similar opacity: CloudKitchens and Lab37 describe purpose-built facilities, integration with POS and delivery systems, and robotics benefits, but public materials do not disclose uptime, robot utilization, defect rates, food-safety controls by site, or actual labor-savings cohorts. Developer signals from GitHub and engineering job postings show robotics, embedded, sensor-fusion, Linux, Git, CI/CD, simulation, camera-pipeline, CAN, and field-deployment work, but they do not substitute for production architecture documents.
