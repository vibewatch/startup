- id: operating-architecture-and-workflow
  title: Operating architecture and customer workflow
  body: >
    The strongest architecture evidence is operational rather than a single system diagram. In Food, the workflow starts with kitchen capacity, order generation through marketplaces or direct channels, order injection into POS or delivery systems, robotic assembly where Bowl Builder applies, and managed handoff through delivery-optimized facilities. Lab37's Bowl Builder page gives unusually concrete process steps: ingredient prep, loading thermally controlled dispensers, receiving orders, dispensing bowls, adding food and condiments, lidding, bagging, and completing the order. Delivery-platform documentation from Uber and DoorDash confirms that a restaurant technology stack can programmatically manage menus, stores, orders, and fulfillment; that does not prove CloudKitchens owns every integration, but it explains the interface layer the Food division must operate against. In Mining, Pronto's software learns a haul route from a human-driven pass, lets operators dispatch trucks from a smartphone app, and combines autonomy hardware, drive-by-wire, perception, site rules, all-stop controls, and fleet-management workflows.
