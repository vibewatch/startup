- id: technical-differentiation-and-maturity
  title: Technical differentiation and maturity
  body: >
    Atoms' differentiation is best supported where the company has published specific machine behavior or field deployments. Lab37's patent application for a food assembly and packaging robot describes a conveyance system, bowl dispenser, food dispensers, condiment dispensers, lidder, and bagger; that maps closely to the commercial Bowl Builder workflow and supports the claim that this is more than generic kitchen-automation marketing. Pronto's differentiation is the combination of OEM-agnostic retrofit economics, camera-led autonomy for quarry-class trucks, and a tiered path into more difficult mining environments with lidar and radar. The Heidelberg expansion release reports more than two million tons autonomously transported at Lake Bridgeport and plans for Mitchell, Indiana and Servtex, Texas deployments in 2026, while Hitachi and Komatsu partnership releases support the open-ecosystem and retrofit thesis. The maturity map is therefore uneven: mining autonomy has named field evidence, food robotics has technical and commercial product pages, and transport has the least disclosed roadmap.
  claimRefs:
