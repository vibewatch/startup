  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: bowl-builder-economics
    missingEvidence: Bowl Builder production uptime, cleaning cycle time, order defect rate, throughput by SKU, labor-savings cohorts, and customer P&L impact.
    whyItMatters: Lab37's labor-savings and consistency claims are central to the Food automation thesis but remain mostly company-claimed externally.
    diligencePath: Request site-level Bowl Builder telemetry, maintenance logs, sanitation procedures, before/after labor studies, and customer references.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
    - TE004
  - type: private-evidence-only
    severity: material
    topic: autonomous-haulage-safety
    missingEvidence: Pronto safety case, ODD definitions, incident history, disengagement or intervention rates, uptime, false-positive shutdowns, and third-party validation.
    whyItMatters: Autonomous haulage is safety-critical, and public deployment tonnage does not by itself prove reliability across all mine conditions.
    diligencePath: Request safety documentation, MSHA/operator approvals where applicable, deployment KPIs by site, and incident/postmortem records.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: transport-wheelbase
    missingEvidence: Public Atoms Transport product specification, customer deployment, roadmap, technical architecture, or partner validation.
    whyItMatters: Transport is one of the three canonical divisions but currently has the thinnest public evidence base.
    diligencePath: Ask management for Transport product briefs, prototype demos, autonomy-stack architecture, route-optimization evidence, and launch milestones.
    relatedQuestionRefs:
    - QE015
    - QE025
    - QE026
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: cross-division-architecture
    missingEvidence: Evidence that Food, Mining, and Transport share reusable software, hardware, data, or manufacturing platforms rather than operating as separate businesses.
    whyItMatters: The investment thesis depends partly on a bits-to-atoms platform story, but public evidence mostly validates individual divisions.
    diligencePath: Request shared platform roadmaps, org charts, code/module reuse data, manufacturing plans, and common safety/reliability tooling.
