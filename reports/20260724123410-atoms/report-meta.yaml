companyProfile:
  foundedDate: '2016-01-01'
  foundingLocation: Los Angeles, California, United States
  summary: >-
    Atoms is an industrial automation holding company led by Uber co-founder Travis Kalanick. It is the rebranded parent
    (City Storage Systems / CloudKitchens) that in March 2026 consolidated a ghost-kitchen and food-robotics business,
    the acquired autonomous-haulage company Pronto, and a nascent heavy-transport effort into three divisions: Atoms
    Food, Atoms Mining, and Atoms Transport. In July 2026 it raised $1.7B led by Andreessen Horowitz at a reported ~$10B
    valuation to pursue Kalanick's "bits-to-atoms" thesis of digitizing and automating the physical world.
  founders:
    - name: Travis Kalanick
      role: Founder & CEO
      background: >-
        Co-founder and former CEO of Uber (2009–2017); took control of City Storage Systems / CloudKitchens in 2018 and
        rebranded the group as Atoms in 2026.
      claimRefs:
        - CO007
  headquarters: United States
  productSummary: >-
    Three-division automation platform: Atoms Food (kitchen-as-a-service ghost kitchens, Lab37 food robotics, the "Bowl
    Builder" automated kitchen line), Atoms Mining (Pronto's vision-first, OEM-agnostic autonomous haulage retrofit for
    mining and quarries), and Atoms Transport (an early-stage "wheelbase for robots" logistics-automation effort).
  customerFocus: >-
    Restaurant operators and virtual food brands (Food); mining, quarry, and aggregates operators such as Heidelberg
    Materials (Mining); logistics, freight, and e-commerce fulfillment partners (Transport).
  businessModel: >-
    Kitchen-as-a-service real estate plus delivery-marketplace revenue (Food), autonomous-haulage deployment and
    software (Mining), and logistics-automation services (Transport).
  stage: Growth
  fundingStatus: >-
    $1.7B round led by a16z announced July 2026 (Uber, Bain Capital, Fifth Wall, Chemistry participating; Ben Horowitz
    joining the board); formerly CloudKitchens, which raised $400M from Saudi PIF in 2019 at ~$5B and a 2021
    Microsoft-included round reported at ~$15B.
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO003
    - CO007
    - CO009
    - CO012
    - CO015
