            body: >-
              公开留存证据是主要弱项。已审阅来源没有披露 NRR、GRR、流失、合同长度、续约率、餐饮运营商队列行为、Transport 试点转化或客户收入集中度。最佳重复使用代理指标是 Heidelberg 从
              Bridgeport 试点，到 Lake Bridgeport 生产里程碑， 再到更多 Heidelberg 站点和全球 100+ 卡车协议的路径。Food 的重复使用证据仅限运营商引语，包括 Coffee Q
              关于几乎每天看到同一批人下单的说法，以及 CloudKitchens 对快速进入新市场的“先落地再扩张”承诺。反向证据很重要：Forbes
              认为幽灵厨房面临配送费、高数字获客成本、低忠诚度、利润率压力和平台依赖，这些都直接挑战 Atoms Food 的持久性。因此承销立场是混合的。 Mining 有高质量但集中的客户证明；Food
              有很多引用，但市场和流失风险更高；Transport 没有具名公开客户证明，在合同、试点或收入证据出现前应按缺口处理。 实际尽调含义是，在给组合层面客户质量打分前，先要求私人证据。Atoms
              应能提供活跃厨房数量、同厨房入住率、餐饮品牌流失、Heidelberg 部署经济性、部署正常运行时间和 Transport 试点状态。如果这些材料不可得，公开记录只能支撑 Mining 的客户证明、Food
