            body: >-
              几项公开来源缺口仍然重要。Komatsu、Epiroc、Zebra/FETCH、REEF 和 Local Kitchens 的已获取页面无法支撑详细的当前功能单元格，
              因此矩阵谨慎处理这些条目，而不是猜。更重要的是，Atoms 自己披露的事业部级运营数据还不足以证明替代能力。投资人需要看到对矿山 OEM AHS 厂商的赢 /
              输数据、按运输剖面拆分的改装回本、厨房点位利用率和流失、Bowl Builder 吞吐、落地定价、安全表现和 Transport 客户试点。缺少这些指标并不推翻战略，但意味着竞争结论应是概率式：Atoms
              有可信的矿山楔子和罕见跨垂直野心，Food 和 Transport 的持久性仍暴露在专注玩家、在位者和客户自建替代方案之下。这对尽调很重要，因为按买方划分的竞争集合会改变举证责任：Atoms 必须说明，
