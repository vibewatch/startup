        blocks:
          - type: paragraph
            body: >-
              下一步不是继续做叙事研究，而是收集私有证据。投资人应要求提供分部 P&L、Food 入驻率和流失、配送渠道经济性、Mining 部署合同、安全记录、单车利用率、Transport 里程碑、烧钱、capex
              承诺和清算优先权结构条款。最重要的负面问题是治理和聚焦。Anthony Levandowski 的法律历史应直接进入 Mining 尽调；Kalanick
              两极化的运营声誉也应带来治理折价，即便新投资人财团质量很高。如果 Food 无法证明稳定贡献经济性，Mining 拿不出可重复商业部署记录，Transport
              在没有里程碑进展时消耗资本，或本轮优先权条款让普通股下行保护很弱，论点就会破裂。反过来，若 Mining 转成可重复平台，管理层又给出足够财务细节，证明 $10 billion
              估值由运营价值支撑而不只是野心支撑，建议可以从跟踪转向买入。
