        - 食品品牌
        - QSR 品牌，加技术 / 地产 / 数字营销
        - 数字餐饮品牌
        - 品牌 IP 与数字授权
        - 硬件机器人自动化证据较少
      - - CookUnity
        - 预制餐食
        - 声称 90M+ 份餐食、1M+ 客户
        - 预制餐订阅用户
        - 厨师网络和本地厨房
        - 买方和消费场景不同于幽灵厨房
      - - Chef Robotics
        - 食品机器人
        - 客户 logo 与 NSF 可清洁性声明
        - 食品制造商和运营商
        - 食品操作物理 AI
        - 范围是工作单元，而不是完整地产网络
      - - Miso Robotics
        - 食品机器人
        - 商用厨房 AI 平台
        - 餐厅运营商
        - 油炸和厨房任务自动化
        - 点状自动化更像与 Lab37 竞争，而不是与 Atoms Food 地产竞争
      - - Caterpillar Command
        - 矿山 AHS
        - 无需人工介入的自动运输车队
        - 大型矿山运营商
        - OEM 装机基础、经销商 / 服务信任
        - 相比 Pronto 定位，OEM 中立性更弱
      - - ASI Mining / ASI Robots
        - 矿山 / 工业自主化
        - 声称支持 100+ 种车辆、已部署 1,000+ 辆车
        - 工业车队运营商
        - 开放、改造、车队编排
        - 不绑定大型工程设备 OEM 品牌
      - - Sandvik AutoMine
        - 矿山自动化
        - 远程与自主移动设备组合
        - 地下和露天矿山
        - 自动化套件和矿山设备渠道
        - 更偏 Sandvik 生态，不如 OEM 中立改造叙事
      - - Komatsu FrontRunner
        - 矿山 AHS
        - 未检索到官方直接页面；市场包中提及
        - 大型矿山运营商
        - 已知在位品类存在感
        - 本章仍无法支撑详细的当前单元格
      - - Aurora
        - 自动驾驶卡车
        - 上市公司申报记录；无人驾驶货运声明
        - 长途货运车队
        - OEM 卡车集成和安全论证
        - 上市公司烧钱 / 规模透明度可能压迫 Atoms Transport
      - - Kodiak Robotics
        - 自动驾驶卡车
        - 统一的 Kodiak Driver；SensorPods
        - 卡车运输与国防邻近车队
        - 模块化传感器舱和跨应用 driver
        - 私营规模透明度较低
