      - number: '4.2'
        title: 按事业部拆分的单位经济性
        blocks:
          - type: paragraph
            body: >-
              核心尽调问题不是 Atoms 能否说出大市场，而是每个事业部扣除自身成本后能否赚到有吸引力的贡献利润。Food 必须覆盖物业租赁或持有成本、 建设改造、公用事业、用工支持、租户流失和配送渠道漏损。Mining
              自主运输路径更偏企业级，因为采石场和矿山运营商能为安全、利用率、燃料、轮胎和维护改善赋值， 但价格到价值的捕获比例未披露。Transport
              可能需要很长开发周期才产生收入。上市公司文件提供经济性框架：DoorDash 显示配送市场围绕 marketplace GOV 看利润率，Uber 显示规模化运输和配送仍背负很大的收入成本和
              R&D，Caterpillar 显示邻近矿山的设备业务承担库存、capex 和 R&D。这些是基准镜头，不是 Atoms
              私有指标的替代品。尽调中，管理层必须用真实发票和成本中心，把客户活动桥接到毛利，而不是用演示文稿级市场类比。 这个要求尤其重要，因为最强公开证据在 Mining，而最大历史资产底座很可能仍在 Food。
