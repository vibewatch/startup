        title: 资本充足性与资本强度
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 $1.7B 融资显著增强了 Atoms 的资产负债表容量，但它本身不能解决承销。资金至少要覆盖三类需求： Food 的地产和厨房自动化、Mining
              的机器人和部署支持，以及周期更长的运输自动化。历史 CloudKitchens 估值标记显示，这项业务过去也吸引过巨额资本， 包括 $400M 的 PIF 轮和后来据报道 $15B
              的估值；但这些标记是历史事实，不是当前现金流表。2026 年报道约 $10B
              的估值可用于情景框架，但不是官方公允价值。公开记录没有披露在手现金、现金消耗、自由现金流、债务、项目融资义务或可支撑月数；所有这些都必须保持 null，
              并附上尽调路径。这意味着这轮融资更像期权和时间，而不是已完成的去风险事件。若董事会预算显示多少资本预留给 Food 设施、矿山部署、Transport R&D 和公司开支，结论会明显改变。
