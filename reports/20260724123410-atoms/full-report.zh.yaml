        - 中途货运
        - 声称合同收入 >$600M
        - 零售 / 杂货中途运输
        - 受限路线和客户合同
        - 路线域窄于广义运输自主化
      - - Symbotic
        - 仓储自动化
        - Walmart 客户证明和 SEC 申报记录
        - 大型配送中心
        - 集成存储、机器人和 AI 软件
        - 仓储专用替代品，不是道路运输
      - - GreyOrange
        - 仓储自动化
        - 声称 3,000+ 个站点、100,000+ 个 agent
        - 零售 / 商业仓库
        - 异构车队编排
        - 主要在仓储节点内竞争
      - - Locus Robotics
        - 仓储 AMR
        - 声称生产率提升 2–3 倍；RaaS
        - 履约仓库
        - 快速部署 AMR 和 RaaS
        - 点状方案对比 Atoms 端到端野心
