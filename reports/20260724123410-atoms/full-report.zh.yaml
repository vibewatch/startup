      - number: '7.2'
        title: 市场、运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              Atoms Food 承接幽灵厨房问题集：疫情后需求正常化、设施级利用率不确定、依赖第三方配送市场、单位经济性不透明。已审阅资料包支撑谨慎立场， 因为 2026 年评论把幽灵厨房形容为遭遇 “ghosted”，而
              Uber Eats 和 DoorDash 材料显示，餐厅依赖市场入口和费率结构产生需求。 Atoms Mining 公开验证基础更好——Heidelberg Materials 报告自主运输超过 200
              万吨，Hitachi 签署战略 MOU——但这些验证点不能消除运营风险。 Pronto
              的改装、以摄像头为先的主张可以降低部署复杂度，但每条自动化矿山运输路线仍取决于感知可靠性、现场流程、天气、交通隔离、维护纪律和事故响应。
              一次严重安全事件就可能传导为客户暂停、监管审查、保险成本上升和估值信心下降。因此，关键尽调要求是按设施和站点提供运营证据，而不是更多汇总愿景语言。
              运营风险也可衡量。尽调包应包含队列级厨房入住率、机器人正常运行时间、自主运输脱离事件、安全事件和客户续约证据。缺少这些指标时，公开验证点是有用信号， 但不足以估算下行概率。
