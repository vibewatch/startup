        title: 按事业部拆分的客户分群
        blocks:
          - type: paragraph
            body: >-
              Atoms 的客户档案最好按三种不同商业化动作来读，而不是一个统一客户底座。Atoms Food 承接 CloudKitchens 模式：餐厅运营商、
              独立厨师、餐车、现有餐厅、虚拟品牌和企业餐饮概念租用面向配送的厨房产能，并依赖 CloudKitchens 的物流架构、共享设施和市场集成去触达应用内需求。 这一客群有宽度信号，包括官网的 600+ brands
              表述和博客中 400+ locations 的说法，但公开证据主要由营销驱动，没有披露活跃账户或分客群收入。 Atoms Mining 更集中但更可验证：Heidelberg Materials
              是具名工业客户，已有量化生产部署。Hitachi Construction Machinery 不是同一意义上的客户；它是伙伴 / 渠道，可能扩展 Pronto 触达矿山运营商的能力。Atoms
              Transport 更早期：公开来源描述了“机器人底盘”抱负， 但没有点名付费物流、货运或电商客户。这种分群也影响尽调顺序。Food 尽调应从入住率、品牌流失和市场渠道经济性开始；Mining
              尽调应从客户访谈、站点级正常运行时间、铺开速度和合同经济性开始；Transport 尽调应先确认是否存在付费买方。把三块分开，才能避免把公开 Heidelberg 证据过度记到 Food 或 Transport
