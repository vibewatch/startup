  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格语境
        blocks:
          - type: paragraph
            body: >-
              Atoms 的结论是跟踪，置信度中等，风险评级高，估值偏紧。正面很明显：公司刚在 2026 年 7 月 22 日完成 a16z 领投的 $1.7B 融资，Ben Horowitz 加入董事会，吸引 Uber
              和其他可信投资人，并把 City Storage Systems 重新框定为拥有 Food、Mining、Transport 事业部的物理 AI
              控股公司。这是强背书方和资本信号。估值上的负面同样重要：市场常讨论的约 $10B
              投后估值是报道值，不是官方确认；公开记录也没有披露分部收入、贡献利润、烧钱、清算优先权，或足以承销普通股回报的客户级证据。我的立场因此不是回避；
              资产太有意思，矿山期权也太大。但报道进入价格已经资本化大量未验证期权价值，所以正确的投委会答案是持续观察，在投资前要求私人证据或更低价格。 今天，耐心更合适。
