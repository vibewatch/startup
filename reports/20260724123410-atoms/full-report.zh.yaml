        - Atoms Food 可变现基础设施最接近的公开参照
      - - 采矿自动化和 AHS
        - 自动运输、钻探、远程作业、软件、感知、集成、服务
        - 不含自动化的一般采矿设备、商品生产收入
        - 矿山 / 采石场所有者或运营方、承包商、车队管理方
        - Atoms Mining / Pronto 的直接参照
      - - 物流自动化
        - 仓储自动化、运输管理、机器人、自动驾驶汽车、分拣、软件
        - 传统人工物流劳动力、非自动化货运经纪
        - 零售商、制造商、3PL、承运商、仓库运营方
        - Atoms Transport 的宽口径参照
      - - 仓储自动化
        - AS/RS、输送机、AMRs、WMS、拣选 / 包装机器人
        - 长途道路自动驾驶和非仓储运输网络
        - 仓库运营方、零售商、制造商、3PL
        - Transport 短期最可量化的子市场
      - - 自动驾驶卡车 / 道路自动驾驶
        - 自动驾驶系统、卡车自动驾驶、受监管的道路部署
        - 仅仓库机器人和人工驾驶货运
        - 承运商、托运人、车队所有者；监管者影响时间表
        - 高期权价值的相邻市场，但公开 SAM 边界最不清楚
    notes: 各行有意拆开消费者 GMV、基础设施收入、工业自动化 capex 和受监管的运输自动驾驶，避免本章混用不可兼容的市场池。
