      - number: '2.3'
        title: 增长驱动、约束与未解决的规模缺口
        blocks:
          - type: paragraph
            body: >-
              正向市场逻辑是，三个类别都有长期自动化需求：消费者仍在数字渠道买餐，矿山面对安全和劳动生产率压力，物流网络需要更快、更可视、用工更少的履约。
              谨慎点在于，各发布方定义市场的方法不同，估算彼此冲突。线上外卖可以指消费者 GMV，云厨房可以指设施收入，物流自动化可以纳入或排除仓库机器人，
              自动驾驶卡车也走着不同于仓库自动化的监管路径。结果是一张有用但不完整的市场地图：Atoms 可信地覆盖多个大型资金池，但公开证据没有拆出事业部级 SAM、当前
              SOM、单位经济性或部署产能。估值上，这些缺口很关键，因为 100 亿美元私人估值需要相信三块市场中至少一块能从宽泛自动化命题转成可重复、
              高毛利、资本效率高的收入。因此，本章把市场估算当作区间和代理镜头，而不是单一答案。高增长市场只有在 Atoms 能用客户可重复部署的产品拿到预算时才有意义。
              下一步尽调应自下而上：统计可服务点位和车队，按工作流估算年度合同价值，对比买方替代方案的回本，再分别给 Food、Mining、Transport 分配概率加权信用。
