          - type: paragraph
            body: >
              最强架构证据来自运营，而不是一张单一系统图。Food 的工作流始于厨房产能，订单由市场或直营渠道生成，注入 POS 或配送系统；适用 Bowl Builder
              时，机器人完成组装；最后由面向配送优化的设施托管交接。Lab37 的 Bowl Builder 页面给出罕见具体的流程步骤： 备料、装载温控分配器、接单、分配碗料、加入食品和调味料、加盖、装袋并完成订单。Uber
              和 DoorDash 的配送平台文档证实， 餐厅技术栈可以以程序化方式管理菜单、门店、订单和履约；这不能证明 CloudKitchens 拥有每一个集成，但解释了 Food 事业部必须对接的接口层。 Mining
              方面，Pronto 软件先从人工驾驶的一次路线中学习运输路线，让操作员用智能手机 app 调度卡车，并组合自主硬件、线控驾驶、感知、现场规则、 全停控制和车队管理工作流。
