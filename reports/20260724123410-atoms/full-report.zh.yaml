      - number: '8.2'
        title: 分部加总和可比估值
        blocks:
          - type: paragraph
            body: >-
              单一混合倍数掩盖的信息会多过揭示的信息。Atoms Food 应该对标 DoorDash、Wonder、Just Eat 和幽灵厨房市场数据，但 Food 板块应较 CloudKitchens
              旧高点打折：COVID 之后配送需求已常态化，私有幽灵厨房估值也显得头重脚轻。Atoms Mining 应该对标 Caterpillar、Komatsu、自动采矿市场报告，以及 Symbotic
              这类机器人公司；该板块拿到最多战略期权价值，是因为自动运输能带来可量化的安全、利用率和劳动生产率结果。 Atoms Transport 应该对标 Aurora、Kodiak
              这类自动驾驶卡车参照物，但商业规模尚未公开可见，基准情形价值仍应大幅按概率折现。 分部加总只有在 Mining 获得实质性估值认可时，才方向上支持 $10 billion 的讨论；Food
              单独撑不起这个估值，Transport 也太早期，无法独自补上差距。
