  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Atoms 最影响投资的风险不是某一起诉讼或许可证，而是创始人历史、IP 信任和受监管自动驾驶的碰撞。公司由 City Storage Systems 在 2026 年 3 月更名为 Atoms，把
              Food、Mining 和 Transport 放在同一个控股公司伞下。这立刻带来比普通餐厅科技公司更宽的法律表面。 Travis Kalanick 具备罕见融资和运营信誉，但他 2017 年从 Uber
              离职仍是治理尽调项，因为 Atoms 明确由创始人主导。 更尖锐的问题是 Anthony Levandowski：DOJ 和法院记录确认了 Google/Waymo 商业秘密盗窃案、18
              个月刑期、后续民事程序以及后来的赦免。 由于 Levandowski 的 Pronto 资产支撑 Atoms Mining，客户和伙伴不仅要承销自主运输表现，还要承销 IP
              卫生、代码来源、合同赔偿和董事会层面的控制。 MSHA、NHTSA、FMCSA 和州级 AV 规则构成第二层：自主运输和交通运输是受监管安全系统，不只是软件部署。实际承销后果是，法律尽调必须跑在估值工作之前，
              而不是之后。投资人应假设客户采购团队会询问 IP 来源、安全责任和领导层控制，尤其在矿山场景，设备正常运行和工人安全都是客户董事会级事项。这一门槛不可谈判。
