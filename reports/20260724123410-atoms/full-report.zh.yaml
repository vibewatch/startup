  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营边界
        blocks:
          - type: paragraph
            body: >-
              Atoms 是 City Storage Systems 在 2026 年 3 月公开更名后的品牌；这家公司此前作为 CloudKitchens 的母公司最为人所知。这层身份很关键：Atoms
              不是从零做起、只有单一产品的机器人初创，而是一个工业自动化控股平台，把面向配送优化的餐饮基础设施业务、 矿山自主运输资产，以及更早期的运输自动化抱负卷到同一个 Kalanick
              主导的平台里。标准边界是三个事业部：Atoms Food、Atoms Mining 和 Atoms Transport。Atoms Food 承接 CloudKitchens
              的厨房即服务地产与配送基础设施，也纳入 Lab37、Bowl Builder 等餐饮机器人工作。Atoms Mining 以 Pronto 的自动驾驶运输技术栈为核心。Atoms Transport
              公开证据更少，最合适的处理是把它当作方向性的“机器人底盘”抱负， 而不是已经跑通的商业线。概览结论很直接：Atoms 同时拥有在运资产和更宽的 bits-to-atoms 命题。这个边界也约束后续章节：
              CloudKitchens、Pronto 或 Atoms Transport 不应按独立公司处理，更适合作为同一私人平台里的事业部风险敞口来分析。
