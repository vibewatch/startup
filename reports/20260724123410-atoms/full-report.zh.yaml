      - number: '2.2'
        title: 买方分群与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图异常碎片化，因为 Atoms 卖的不是一个工作流。Food 里的经济买方可能是餐厅运营商、厨房地产运营商、品牌方或以配送驱动的餐饮创业者， 他们需要吞吐、租金弹性、配送市场入口和厨房用工效率。Mining
              里的预算所有者更接近拥有卡车车队的矿山、采石场或材料运营商，采购理由是可量化的生产率和安全收益。 Pronto 对矿山与采石场越野 AHS 的官方描述让这条预算线比 Atoms Transport
              更清晰；Transport 的买方可能是仓库运营商、3PL、 零售商、承运商或工业园区。采用路径因此从选址和工作流集成，走向安全 / 监管接受，再到车队规模化铺开。含义是：Atoms Food
              可以追求大量小点位，Atoms Mining 可以销售更少但更大的部署，Atoms Transport 需要更清楚地证明买方 / 用户 / 付款方闭环在哪里闭合。
              采用路径还随资本强度变化。云厨房点位理论上可以一处一处复制，但仍暴露于餐饮需求、配送平台经济性和本地许可。矿山部署可能需要更长的现场集成和安全保证，
              但成功改装能绑定昂贵资产，并带来可量化的利用率目标。物流自动化夹在两端之间：仓库机器人有可衡量的回本案例，道路无人运输则要跨过更高的公共安全和监管门槛。
