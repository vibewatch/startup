        blocks:
          - type: paragraph
            body: >
              Atoms 的差异化，在公司发布过具体机器行为或现场部署的地方支撑最强。Lab37 关于食品组装和包装机器人的专利申请描述了输送系统、碗分配器、 食品分配器、调味料分配器、加盖机和装袋机；这与商业 Bowl
              Builder 工作流高度贴合，支撑“它不只是泛泛的厨房自动化营销”这一判断。 Pronto 的差异点是不绑定 OEM
              的改装经济性、面向采石场级卡车的摄像头主导自动驾驶，以及借助激光雷达和雷达进入更困难矿山环境的分层路径。 Heidelberg 扩展稿称 Lake Bridgeport 已自主运输超过 200 万吨，并计划
              2026 年在 Indiana 州 Mitchell 和 Texas 州 Servtex 部署；Hitachi 和 Komatsu
              的合作稿也支撑开放生态和改装命题。因此成熟度地图并不均匀：矿山自主运输有具名现场证据， 餐饮机器人有技术和商业产品页，Transport 披露的路线图最少。
