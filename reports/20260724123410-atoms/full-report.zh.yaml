      - number: '8.3'
        title: 牛市、基准和熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景必须同时满足两件事：Food 在 COVID 后稳定在站得住脚的倍数上，Mining 证明自动化部署能反复卖进采石场和矿山。若如此，Atoms 估值可进入 $14 billion 至 $18
              billion 区间。基准情景更窄：Food 获得中等估值认可，Mining 拿到真实但尚未完全规模化的期权价值，Transport 主要仍是期权价值；最终资本结构调整前，对应约 $8 billion 至 $11
              billion。熊市情景重要，因为它并不牵强。若 Food 价值远低于 CloudKitchens 历史估值，Mining 又以试点为主，可支撑区间会下探至 $4.5 billion 至 $6.5
              billion。这种不对称解释了建议：Atoms 并非显然坏掉，但报道 $10 billion 估值缺少足够公开证据安全边际。
