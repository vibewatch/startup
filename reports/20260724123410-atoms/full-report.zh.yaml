  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：三个不同资金池，不是一个 TAM
        blocks:
          - type: paragraph
            body: >-
              不应拿一个泛机器人 TAM 给 Atoms 定价。Atoms 自己的愿景页把公司定义为横跨 Food、Mining、Transport 的物理自动化，这意味着三个独立市场测试。 Food
              从线上配送需求切入，但变现靠云厨房基础设施和自动化；Mining 是更窄的自主运输和矿山自动化预算，预算逻辑绑定安全、利用率和用工暴露； Transport
              则是更宽的物流自动化期权，其中仓库自动化比道路无人驾驶更可衡量。这个边界很重要：头部外卖市场是数千亿美元消费者 GMV，矿山自动化只是个位数十亿美元的工业 capex
              市场，而物流自动化规模很大程度取决于发布方是否纳入仓库、运输管理、机器人或自动驾驶车辆。因此，尽调立场应按组合看：Atoms
              暴露在庞大的物理世界自动化预算上，但每个事业部都需要自己的买方、采用节奏和验证标准。这也迫使后续章节保持纪律：竞争对手、单位经济性和估值倍数应按有关事业部对照，
              而不是拿最大头部市场套用。餐饮基础设施买方、矿山运营商和物流车队所有者采购周期、安全验证、实施伙伴、对运营扰动的容忍度都不同。因此，市场边界是尽调控制，不只是分类。
