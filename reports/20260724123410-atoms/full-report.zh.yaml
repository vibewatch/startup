        blocks:
          - type: paragraph
            body: >-
              财务上，Atoms 只有作为资本充足的平台期权才可投资，但不透明私人公司风险很重。最强证据是投资人新投 $1.7B 股权，Mining
              事业部有实在客户和伙伴信号。最弱证据是当前运营表现：没有公开来源披露收入、毛利、现金、烧钱、可支撑月数、订单、积压订单、入住率或事业部级盈利能力。 Food
              的反向解读尤其重要：幽灵厨房经济性在房东层面可能好看，但租户要承受平台费用、营销支出和需求正常化。下一步尽调不是做更大的市场规模测算， 而是进入私人财务资料室，拿事业部级 P&L、单位经济性、capex
              承诺，以及从 2026 年 7 月融资到下一次融资触发点的现金流桥。 在这套材料可得之前，任何估值模型都应使用保守运营假设，单独保留 Transport 期权，不要把未披露的 Food 或 Mining
