              技术尽调风险不是没有产品，而是很宽的物理自动化组合边界不透明。Pronto 发布的安全和部署语言比 Atoms 大多数材料更清楚： 计算机视觉和
              GNSS、线控驾驶改装、全停按钮、冗余神经网络、现场防护、系统健康检查和混合车队支持。即便如此，Atoms 和 Pronto 都没有公开 AHS
              技术栈的安全论证、事故历史、脱离率、正式认证包或第三方审计。Food 也有类似不透明性：CloudKitchens 和 Lab37 描述了专用设施、与 POS
              和配送系统集成以及机器人收益，但公开材料没有披露正常运行时间、机器人利用率、缺陷率、按站点拆分的食品安全控制或真实劳动力节省队列。 来自 GitHub
