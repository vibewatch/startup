  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Atoms 餐饮和采矿业务都把重复实体工作流转化为软件中介的运营循环。
    data:
      nodes:
        - id: source-demand
          label: 捕捉需求或任务
          detail: 餐厅订单或矿山运输请求进入操作系统。
        - id: configure-system
          label: 配置路线 / 菜单 / 订单
          detail: 菜单 / 订单 API 或人工示教的运输路线定义工作单元。
        - id: prepare-inputs
          label: 准备实体输入
          detail: 装载食材，或让卡车和运输路线就绪。
        - id: automate-execution
          label: 用机器人 / 自动化执行
          detail: Bowl Builder 组装订单，或 Pronto 执行自动运输路线。
        - id: monitor-safety-quality
          label: 监控安全和质量
          detail: 温控、系统健康检查、全停控制和现场保护措施约束作业。
        - id: handoff-output
          label: 交付输出
          detail: 装袋食品进入配送，或运输物料到达目的地。
        - id: optimize-loop
          label: 优化循环
          detail: 菜单、路线、利用率和系统健康数据反馈到下一轮。
      edges:
        - from: source-demand
          to: configure-system
          label: 数字指令
        - from: configure-system
          to: prepare-inputs
          label: 设置
        - from: prepare-inputs
          to: automate-execution
          label: 实体自动化
        - from: automate-execution
          to: monitor-safety-quality
          label: 控制和检查
        - from: monitor-safety-quality
          to: handoff-output
          label: 放行
        - from: handoff-output
          to: optimize-loop
          label: 运营数据
        - from: optimize-loop
          to: configure-system
          label: 更新设置
    approximationNotes: 流程合并了餐饮和采矿工作流，因为运输缺少足够公开流程细节。
