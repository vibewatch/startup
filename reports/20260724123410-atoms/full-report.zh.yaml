  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与披露画像
        blocks:
          - type: paragraph
            body: >-
              Atoms 在财务上很特殊：它不是只有一条收入线的单一运营公司，而是更名后的私人控股公司，揉合 CloudKitchens 地产基础设施、Pronto
              矿山自主运输，以及更早期的运输自动化命题。已审阅证据支持收入机制，不支持当前收入金额。Atoms Food 看起来靠建成的商业厨房、面向配送优化的设施和可能的附加服务变现，
              而客户经济性仍暴露于配送平台费用和租户营销支出。Atoms Mining 企业级证据更清楚：Pronto 的自主运输系统有客户和合作伙伴证据， 但没有公开单车、单站点、订阅或部署价格。Atoms
              Transport 财务能见度最低，除非管理层证明相反，否则应按未产生收入建模。因此，本章把所有公开披露的收入、 ARR、GMV、利用率和毛利字段视为
              null，除非来源直接支撑。实际承销后果是：收入确认应按合同逐一测试，不能从品牌标签推断。一个厨房点位、 一套已部署 AHS、一个运输机器人原型，会产生不同的会计、营运资本和支持成本结构。
