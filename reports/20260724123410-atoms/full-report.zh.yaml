        title: 依赖、资本分配与执行风险
        blocks:
          - type: paragraph
            body: >-
              公司的依赖地图异常宽。Atoms Food 依赖配送市场和地产利用率；Atoms Mining 依赖工业客户、OEM 关系、矿山安全监管者和 Pronto 技术信誉；Atoms Transport
              依赖尚未稳定的联邦与州级 AV 政策栈。2026 年 $1.7B 融资显著降低了近期融资焦虑， Uber
              参投也是强信号，但它也抬高了执行门槛，因为报道估值预期意味着三个事业部都必须拿出可信进展。这里，集团风险变得具体： Food、Mining 和 Transport 拥有不同买方、监管者、毛利结构、capex
              需求、部署周期和失败模式。管理层必须证明控股公司能分配资本和人才， 而不是用某一事业部的强头条遮住另一事业部的弱单位经济性。合适的投资人姿态是高风险跟踪：可信资产和资本都在，但淘汰标准应按月监控。
              这种依赖结构反对在管理层披露事业部级 KPI 前给 Atoms 完整平台信用。强资本伙伴可以买时间，但不能单独证明一个机器人厨房、一个采石场 AHS
              产品和道路运输自动驾驶之间有足够运营杠杆，足以支撑一个溢价倍数。
