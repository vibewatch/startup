  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Food、Mining 和 Transport 的产品界面
        blocks:
          - type: paragraph
            body: >
              不应把 Atoms 尽调成一个单一机器人产品。公开材料把它定义为拥有三块产品界面的工业自动化控股公司：Atoms Food、Atoms Mining 和 Atoms Transport。Atoms Food
              是垂直整合最深的一面，因为它把 CloudKitchens 面向配送优化的地产和托管厨房基础设施，与 Lab37 的餐饮机器人线组合起来。CloudKitchens
              描述的是专为配送、取餐和食品生产打造的设施内私有厨房；Lab37 则把 Bowl Builder 描述为流水线机器人，把人工预处理的食材做成组装好、盖好、装袋的订单。Atoms Mining
              也很具体：Pronto 称其为矿山和采石场提供越野自主运输系统， Atoms 公告称 Pronto 已成为 Atoms Mining 的核心技术引擎。公开证据中，Atoms Transport
              明显更不成熟；Atoms 自己的愿景页称它是“机器人底盘”，但已审阅资料包没有找到可比的外部产品页或部署证明。这种不对称决定了每个事业部的技术尽调议程。
