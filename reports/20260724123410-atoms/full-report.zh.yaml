  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 三线竞争格局
        blocks:
          - type: paragraph
            body: >-
              Atoms 进入的不是一个干净品类；它试图用餐饮基础设施、矿山自主运输和运输 / 物流自动化三条线去守住控股公司命题。餐饮侧最碎片化： CloudKitchens 面对共享厨房点位，Wonder 和
              CookUnity 聚合消费者餐饮需求，C3 聚合餐厅品牌，Chef Robotics 或 Miso
              用单点机器人攻厨房用工瓶颈。这种宽度削弱了简单“幽灵厨房竞争对手”的框架，因为买方可以用地产、软件、预制餐或机器人工位解决同一个运营问题。 矿山侧更窄，对 Atoms 也更可防守，因为 Pronto
              有清晰的不绑定 OEM 改装叙事；但这里在位厂商反击也最强，来自 Caterpillar、Sandvik、 ASI、Komatsu 级和 Epiroc 级厂商。Transport
