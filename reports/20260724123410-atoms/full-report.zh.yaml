        - 声称受 600+ 个品牌信任
        - 以配送为先的餐厅和品牌
        - 自有地产，加上为配送优化的厨房
        - 配送厨房模式被多品牌和点位聚合商复制
      - - Kitchen United Mix
        - 食品基础设施
        - 声称一个点位容纳 10+ 家餐厅
        - 共享取餐点内的消费者和餐饮品牌
