            body: >-
              概览是创始人主导。Travis Kalanick 是 Atoms 创始人兼 CEO，公开叙事离不开他的 Uber 经历，以及他离开 Uber 后对 City Storage Systems
              的控制。同一履历同时带来创始人与市场匹配，也带来关键人风险。Kalanick 多次把 Atoms 描述为 Uber 和 CloudKitchens 未完成的工作，但他也曾在 2017 年 6
              月因投资人压力和职场文化争议辞去 Uber 职务。2026 年 7 月融资让治理披露有所改善，因为 Ben Horowitz 据称将加入董事会；但已审阅公开记录仍没有完整董事会名单、委员会结构或控制权地图。
              Anthony Levandowski 围绕 Pronto 形成第二个关键人节点：Hitachi 称他为 Pronto CEO 兼联合创始人，而公开不利记录包括商业秘密案认罪、 18
              个月刑期和后来的赦免。这种组合让管理能力很重要，但并不干净。
