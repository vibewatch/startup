    title: 产品架构图
    type: stack
    layout: wide
    summary: Atoms 的技术栈是组合式架构：共享实体自动化野心，但各分部公开披露不均衡。
    data:
      layers:
        - label: Atoms 公司命题
          detail: 用实体自动化改造行业、让世界动起来；选择专用机器人，而非宽泛的人形通用路线。
          modules:
            - 从比特到原子的运营哲学
            - 跨栈能力
            - 工业自动化资本配置
        - label: 餐饮基础设施
          detail: CloudKitchens 面向配送优化的私有厨房和地产运营。
          modules:
            - 私有厨房
            - 物流优先架构
            - 托管前厅和设施服务
        - label: 餐饮机器人与软件
          detail: Lab37 Bowl Builder、订单集成、POS / 配送系统，以及 AI / 菜单 / 定价运营。
          modules:
            - 温控分配器
            - 机器人加盖和装袋
            - 配送 / POS 接口
            - 餐厅运营分析
        - label: 采矿自动化
          detail: Pronto AHS 车辆改装、感知、调度、线控驾驶和现场软件。
          modules:
            - Vision AHS
            - VLR / VLR 360
            - 移动调度
            - 混合车队改装
        - label: 运输野心
          detail: 公开说法是机器人底盘，但产品文档有限。
          modules:
            - 自动驾驶车辆栈
            - 路线优化命题
            - 未来机器人物流平台
    approximationNotes: 运输层基于 Atoms 的愿景语言和招聘 / 开发者信号，不是公开产品规格。
