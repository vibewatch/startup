- id: retention-expansion-and-risk
  title: Retention, expansion, and concentration risk
  body: 'Public retention evidence is the main weakness. No reviewed source discloses NRR, GRR, churn, contract length, renewal rates, food-operator cohort behavior, transport-pilot conversion, or customer revenue concentration. The best repeat-use proxy is Heidelberg’s path from Bridgeport pilot to Lake Bridgeport production milestone to additional Heidelberg sites and a global 100+ truck agreement. Food repeat-use proof is limited to operator quotes, including Coffee Q’s statement about seeing the same people order almost every day, and to CloudKitchens’ land-and-expand promise of fast new-market entry. The adverse evidence is important: Forbes argues that ghost kitchens face delivery fees, high digital acquisition costs, low loyalty, margin pressure, and platform dependency, all of which directly challenge Atoms Food durability. The resulting underwriting stance is mixed. Mining has high-quality but concentrated customer proof; Food has many references but more marketplace and churn risk; Transport has no named public customer proof and should be treated as a gap until contracts, pilots, or revenue evidence appear. The practical diligence implication is to request private evidence
    before assigning portfolio-level customer quality. Atoms should be able to provide active kitchen counts, same-kitchen occupancy, food-brand churn, Heidelberg deployment economics, deployment uptime, and Transport pilot status. If those materials are unavailable, the public record supports customer proof in Mining, market access in Food, and option value in Transport rather than a uniformly proven multi-division customer engine.'
