  rows:
  - - Atoms Food restaurant operators
    - Owner/operator or brand manager pays; kitchen staff use
    - Rent private delivery/takeout production kitchen
    - 600+ brands language; 400+ locations claimed in marketing/blog sources
    - Broad recurring facility and services base if kitchens stay occupied
    - No active operator count, churn, or segment revenue
  - - Atoms Food virtual / multi-brand operators
    - Founder or growth lead pays; same kitchen runs multiple brands
    - Launch delivery-only concepts and test cities
    - Named operators include Fuku Sushi, Coffee Q, Craft Burger, Florentine, and multi-brand concepts
    - Land-and-expand across cities and brands
    - Outcomes are promotional and not audited
  - - Atoms Mining aggregates / cement operators
    - Site, operations, or corporate technical buyers pay; quarry teams use
    - Retrofit autonomous haulage on existing mixed fleets
    - Heidelberg Materials Lake Bridgeport, Mitchell, Servtex, 100+ truck agreement
    - High-value industrial deployments with safety and productivity narrative
    - Only one named production customer found
  - - Atoms Mining OEM / channel partners
    - Partner executives and mining customers jointly influence
    - Open automation channel and customer access
    - Hitachi Construction Machinery strategic partnership
    - Potential distribution into global mining customer base
    - Partner proof, not direct customer revenue proof
  - - Atoms Transport logistics / freight prospects
    - Likely shipper, logistics, warehouse, or e-commerce operations buyer
    - Wheelbase for robots / movement automation
    - No named public customers found
    - Could be large if converted to freight or e-commerce deployments
    - Named pilots, contracts, and usage evidence absent
  notes: Segmentation is based on public customer and partner evidence through 2026-07-24; Transport rows are gap-qualified because named customers were not found.
