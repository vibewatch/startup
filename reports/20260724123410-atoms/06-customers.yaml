- id: adoption-and-named-proof
  title: Adoption trajectory and named customer proof
  body: 'The strongest proof is not a food logo wall; it is the Heidelberg Materials deployment. Pronto, Heidelberg, and International Mining all describe a mixed Caterpillar and Komatsu fleet at Lake Bridgeport that autonomously hauled more than two million tons over eight months, and Pronto/Business Wire subsequently announced 2026 expansion to Mitchell, Indiana and Servtex, Texas. Heidelberg’s own global release further states an agreement to deploy Pronto AHS to more than 100 haul trucks across more than a dozen sites. That progression moves the mining evidence from pilot to repeat expansion. Food proof is broader but softer: Down Beach quotes named operators such as Fuku Sushi, Coffee Q, Craft Burger, Florentine, and Niko Lambrou’s multi-brand kitchen, while CloudKitchens cites The Hive and other examples. Those references show real operator use cases, but not audited retention or unit economics. Hitachi adds customer-access validation by saying miners want open, mixed-fleet automation, but it does not substitute for named end-customer deployments. The evidence also has different freshness levels. The Heidelberg and Hitachi items are 2026-dated and therefore current to the run;
    many food examples are still useful but are weaker because they are testimonials and do not show whether the operator remains active, profitable, or renewing today. For underwriting, the distinction between active use and customer-sourced outcome proof should be preserved.'
