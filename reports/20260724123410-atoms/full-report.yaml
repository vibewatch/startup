      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next step is not more narrative research; it is private evidence collection. Investors should request
              divisional P&Ls, Food occupancy and churn, delivery-channel economics, Mining deployment contracts, safety
              records, truck-level utilization, Transport milestones, burn, capex commitments and preference-stack
              terms. The most important adverse issues are governance and focus. Anthony Levandowski’s legal history is
              directly relevant to Mining diligence, and Kalanick’s polarizing operating reputation warrants a
              governance discount even though the new investor syndicate is high quality. The thesis breaks if Food
              cannot demonstrate stable contribution economics, if Mining cannot document repeatable commercial
              deployments, if Transport consumes capital without milestone progress, or if the round’s preference terms
              leave common equity with poor downside protection. Conversely, the recommendation can move from track to
              buy if Mining converts into a repeatable platform and management provides enough financial detail to show
              that the $10 billion mark is supported by operating value rather than only by ambition.
            claimRefs:
