      - number: '1.2'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              The overview is founder-led. Travis Kalanick is the founder and CEO of Atoms, and the public narrative is
              inseparable from his Uber history and his post-Uber control of City Storage Systems. The same profile
              provides founder-market fit and key-person risk. Kalanick has repeatedly framed Atoms as unfinished work
              from Uber and CloudKitchens, but he also resigned from Uber in June 2017 after investor pressure and
              workplace-culture controversies. Governance disclosure improved with the July 2026 financing because Ben
              Horowitz is reported to join the board, yet the reviewed public record still does not provide a complete
              board roster, committee structure, or control-rights map. Anthony Levandowski adds a second key-person
              node through Pronto: Hitachi identifies him as Pronto CEO and co-founder, while the public adverse record
              includes a trade-secret guilty plea, 18-month sentence, and later pardon. That mix makes leadership
              capability central but not clean.
