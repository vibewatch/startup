      - number: '2.2'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is unusually fragmented because Atoms is not selling one workflow. In food, the economic
              buyer is a restaurant operator, kitchen real-estate operator, brand owner, or delivery-led food
              entrepreneur who needs throughput, rent flexibility, delivery-market access, and kitchen labor efficiency.
              In mining, the budget owner is closer to a mine, quarry, or materials operator with a truck fleet and a
              measurable productivity and safety case. Pronto’s official description of off-road AHS for mines and
              quarries makes that budget line more legible than Atoms Transport, where buyers could be warehouse
              operators, 3PLs, retailers, carriers, or industrial campuses. Adoption therefore moves from site selection
              and workflow integration to safety/regulatory acceptance and fleet-scale rollout. The implication is that
              Atoms Food can pursue many smaller locations, Atoms Mining can sell fewer but larger deployments, and
              Atoms Transport needs clearer proof of where the buyer/user/payer loop closes. The adoption path also
              differs by capital intensity. Cloud-kitchen sites can in theory be replicated location by location, but
              they remain exposed to food demand, delivery-platform economics, and local permitting. Mining deployments
              may require longer site integration and safety assurance, yet a successful retrofit can attach to
              expensive assets with quantifiable utilization targets. Logistics automation sits between those poles:
              warehouse robotics has measurable payback cases, while autonomous road transport must clear a higher
              public-safety and regulatory bar.
