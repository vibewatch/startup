        title: Customer segmentation by division
        blocks:
          - type: paragraph
            body: >-
              Atoms’ customer file is best read as three different go-to-market motions rather than one unified customer
              base. Atoms Food inherits the CloudKitchens model: restaurant operators, independent chefs, food trucks,
              existing restaurants, virtual brands, and enterprise food concepts rent delivery-oriented kitchen capacity
              and rely on CloudKitchens’ logistics architecture, shared facilities, and marketplace integrations to
              reach app-based demand. That segment has breadth signals, including the homepage’s 600+ brands language
              and blog references to 400+ locations, but the public evidence is mostly marketing-led and does not
              disclose active accounts or revenue by segment. Atoms Mining is much more concentrated but more
              verifiable: Heidelberg Materials is a named industrial customer with a quantified production deployment.
              Hitachi Construction Machinery is not a customer in the same sense; it is a partner/channel that may
              expand Pronto’s access to mining operators. Atoms Transport is earlier still: public sources describe a
              wheelbase-for-robots ambition but do not name paying logistics, freight, or e-commerce customers. This
              segmentation also matters for diligence sequencing. Food diligence should start with occupancy, brand
              churn, and marketplace-channel economics; Mining diligence should start with reference calls, site-level
              uptime, rollout pace, and contract economics; Transport diligence should start with whether a paid buyer
              exists at all. Treating the segments separately avoids over-crediting the public Heidelberg proof to the
              food or transport businesses.
