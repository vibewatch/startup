      - number: '8.3'
        title: Bull, base and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case requires two things to be true at the same time: Food stabilizes at a defensible post-COVID
              multiple and Mining proves it can sell repeatable autonomy deployments into quarries and mines. In that
              case, Atoms can grow into a $14 billion to $18 billion valuation range. The base case is narrower: Food
              receives moderate credit, Mining receives real but not fully scaled option value, and Transport remains
              mostly option value, producing roughly $8 billion to $11 billion before final capital-structure
              adjustments. The bear case matters because it is plausible. If Food is worth much less than the historical
              CloudKitchens marks and Mining remains pilot-heavy, the supported range falls toward $4.5 billion to $6.5
              billion. This asymmetry explains the recommendation: Atoms is not obviously broken, but at a reported $10
              billion it does not offer enough public-evidence margin of safety.
