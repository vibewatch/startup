  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosure profile
        blocks:
          - type: paragraph
            body: >-
              Atoms is financially unusual because it is not one operating company with one revenue line; it is a
              private, rebranded holding company that combines CloudKitchens real-estate infrastructure, Pronto mining
              autonomy, and an earlier-stage transport automation thesis. The reviewed evidence supports revenue
              mechanisms, not current revenue amounts. Atoms Food appears to monetize fully built commercial kitchens,
              delivery-optimized facilities, and likely ancillary services, while customer economics remain exposed to
              delivery-platform fees and tenant marketing spend. Atoms Mining has clearer enterprise proof: Pronto’s
              autonomous haulage system has customer and partner evidence, but no public per-truck, site, subscription,
              or deployment price. Atoms Transport has the least financial visibility and should be modeled as
              pre-revenue unless management proves otherwise. Therefore the chapter treats all disclosed public revenue,
              ARR, GMV, utilization, and gross margin fields as null unless a source directly supports them. The
              practical underwriting consequence is that revenue recognition should be tested contract by contract
              rather than inferred from brand labels. A kitchen site, a deployed autonomous-haulage system, and a
              transport robotics prototype create different accounting, working-capital, and support-cost profiles.
