        - label: Atoms corporate thesis
          detail: >-
            Physical automation to transform industry and move the world; specialized robots over broad humanoid
            generality.
          modules:
            - bits-to-atoms operating philosophy
            - cross-stack competence
            - industrial automation capital allocation
        - label: Food infrastructure
          detail: CloudKitchens' delivery-optimized private kitchens and real-estate operations.
          modules:
            - private kitchens
            - logistics-first architecture
            - managed front-of-house and facility services
        - label: Food robotics and software
          detail: Lab37 Bowl Builder, order integration, POS/delivery systems, AI/menu/pricing operations.
          modules:
            - thermally controlled dispensers
            - robotic lidding and bagging
            - delivery/POS interfaces
            - restaurant operations analytics
        - label: Mining autonomy
          detail: Pronto AHS vehicle retrofit, perception, dispatch, drive-by-wire, and site software.
          modules:
            - Vision AHS
            - VLR / VLR 360
            - mobile dispatch
            - mixed-fleet retrofit
        - label: Transport ambition
          detail: Publicly described as a wheelbase for robots with limited product documentation.
          modules:
            - autonomous vehicle stack
            - route optimization thesis
            - future robotic logistics platform
    approximationNotes: The transport layer is based on Atoms' vision language and job/developer signals, not a public product spec.
    claimRefs:
