  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: three distinct pools, not one TAM'
        blocks:
          - type: paragraph
            body: >-
              Atoms should not be valued against one generic robotics TAM. Its own vision page frames the company as
              physical automation across Food, Mining, and Transport, which creates three separate market tests. Food
              starts with online delivery demand but monetizes through cloud-kitchen infrastructure and automation;
              mining is a narrower autonomous-haulage and mining-automation budget tied to safety, utilization, and
              labor exposure; transport is a broader logistics-automation option where warehouse automation is more
              measurable than road autonomy. This boundary matters because the headline food-delivery market is hundreds
              of billions of dollars of consumer GMV, while mining automation is a single-digit-billion industrial capex
              market and logistics automation depends heavily on whether a publisher includes warehouses, transport
              management, robotics, or autonomous vehicles. The diligence stance is therefore portfolio-based: Atoms has
              exposure to large physical-world automation budgets, but each division needs its own buyer, adoption
              clock, and proof standard. This also forces discipline in later chapters: competitors, unit economics, and
              valuation multiples should be benchmarked against the relevant division rather than against the largest
              available headline market. A restaurant-infrastructure buyer, a mine operator, and a logistics fleet owner
              have different procurement cycles, safety proofs, implementation partners, and tolerance for operational
              disruption. The market boundary therefore functions as a diligence control, not merely a taxonomy.
