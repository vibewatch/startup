  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Three-front competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Atoms is not entering one clean category; it is trying to defend a holding-company thesis across food
              infrastructure, mining autonomy, and transport/logistics automation. The food side is the most fragmented:
              CloudKitchens competes with shared kitchen locations, Wonder and CookUnity aggregate consumer food demand,
              C3 aggregates restaurant brands, and Chef Robotics or Miso attack the labor bottleneck with point
              robotics. That breadth weakens any simple “ghost kitchen competitor” framing because buyers can solve the
              same operating problem through real estate, software, prepared meals, or robotic stations. The mining side
              is narrower and more defensible for Atoms because Pronto has a clear OEM-agnostic retrofit message, but it
              also faces the strongest incumbent response from Caterpillar, Sandvik, ASI, Komatsu-class and Epiroc-class
              vendors. Transport is the least defined public division and therefore has the widest competitor set:
              autonomous trucking vendors, middle-mile operators, and warehouse automation companies all bound the
              opportunity before Atoms discloses a concrete product.
