  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Atoms Food and Mining both convert repetitive physical workflows into software-mediated operating loops.
    data:
      nodes:
        - id: source-demand
          label: Capture demand or task
          detail: Restaurant orders or mine haul requests enter the operating system.
        - id: configure-system
          label: Configure route/menu/order
          detail: Menu/order APIs or a human-taught haul route establish the work unit.
        - id: prepare-inputs
          label: Prepare physical inputs
          detail: Ingredients are loaded, or trucks and haul routes are readied.
        - id: automate-execution
          label: Execute with robot/autonomy
          detail: Bowl Builder assembles orders or Pronto drives autonomous haul routes.
        - id: monitor-safety-quality
          label: Monitor safety and quality
          detail: Thermal controls, system health checks, all-stop controls, and site safeguards govern work.
        - id: handoff-output
          label: Handoff output
          detail: Bagged food moves to delivery, or hauled material reaches destination.
        - id: optimize-loop
          label: Optimize loop
          detail: Menu, route, utilization, and system-health data inform the next cycle.
      edges:
        - from: source-demand
          to: configure-system
          label: digital instruction
        - from: configure-system
          to: prepare-inputs
          label: setup
        - from: prepare-inputs
          to: automate-execution
          label: physical automation
        - from: automate-execution
          to: monitor-safety-quality
          label: controls and checks
        - from: monitor-safety-quality
          to: handoff-output
          label: release
        - from: handoff-output
          to: optimize-loop
          label: operating data
        - from: optimize-loop
          to: configure-system
          label: updated settings
    approximationNotes: Flow combines the Food and Mining workflows because Transport lacks sufficient public workflow detail.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
