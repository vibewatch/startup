      - - Three-division structure creates multiple shots on industrial automation upside
        - Evidence of unfocused capital allocation would increase conglomerate discount
      - - Mining autonomy could become the highest-quality option value
        - Lack of signed deployments, safety data, or repeatability would cut the option value
      - - Food has legacy infrastructure and market presence from CloudKitchens
        - Occupancy, churn, or margin deterioration would make old valuation marks irrelevant
      - - Transport could add venture-style upside
        - No milestone progress would justify only nominal base-case value
      - - Reported $10B mark is below the 2021 CloudKitchens peak
        - The 2021 mark was low-confidence and food-delivery multiples have since compressed
    notes: Anti-thesis items focus on what would change the valuation view, not on generic operating risk.
    claimRefs:
