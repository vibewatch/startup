      - number: '4.2'
        title: Unit economics by division
        blocks:
          - type: paragraph
            body: >-
              The central diligence issue is not whether Atoms can name large markets; it is whether each division can
              earn attractive contribution margin after division-specific costs. Food must cover property lease or
              ownership costs, buildout, utilities, labor support, tenant churn, and delivery-channel leakage. Mining
              autonomy has a more enterprise-grade path because quarry and mine operators can value safety, utilization,
              fuel, tire, and maintenance improvements, but the price-to-value capture is undisclosed. Transport likely
              requires long development cycles before revenue. Public-company filings help frame the economics: DoorDash
              shows delivery marketplaces track margin against marketplace GOV, Uber shows scaled transport and delivery
              still carry major cost-of-revenue and R&D burdens, and Caterpillar shows mining-adjacent equipment
              businesses carry inventory, capex, and R&D. These are benchmark lenses, not substitutes for Atoms’ own
              private metrics. In diligence, management should be forced to bridge from customer activity to gross
              profit using actual invoices and cost centers, not presentation-level market analogies. That is especially
              important because the strongest public proof sits in Mining while the largest legacy asset base likely
              remains Food.
