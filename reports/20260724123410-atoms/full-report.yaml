      - number: '8.2'
        title: Sum-of-parts and comparable valuation
        blocks:
          - type: paragraph
            body: >-
              A single blended multiple would hide more than it reveals. Atoms Food should be benchmarked against
              DoorDash, Wonder, Just Eat and ghost-kitchen market data, but the Food segment deserves a discount to the
              old CloudKitchens peak because delivery demand normalized after COVID and private ghost-kitchen valuations
              appear top-heavy. Atoms Mining should be benchmarked against Caterpillar, Komatsu, autonomous-mining
              market reports and robotics names such as Symbotic; that division receives the most strategic option value
              because autonomous haulage can produce measurable safety, utilization and labor-productivity outcomes.
              Atoms Transport should be benchmarked against Aurora and Kodiak-style autonomous-trucking references, yet
              its base-case value should remain heavily probability-weighted because commercial scale is not publicly
              visible. The resulting sum-of-parts is directionally supportive of a $10 billion discussion only if Mining
              receives meaningful credit; Food alone cannot carry the mark, and Transport is too immature to close the
              gap by itself.
