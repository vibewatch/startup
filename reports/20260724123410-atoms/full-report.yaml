  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price context
        blocks:
          - type: paragraph
            body: >-
              Atoms earns a track recommendation, medium confidence, high risk rating, and stretched valuation stance.
              The positive side is obvious: the company has just raised $1.7 billion in a July 22, 2026 a16z-led round,
              added Ben Horowitz to the board, attracted Uber and other credible investors, and reframed City Storage
              Systems as a physical-AI holding company with Food, Mining, and Transport divisions. That is a strong
              sponsor and capital signal. The negative side is equally important for valuation: the commonly discussed
              approximately $10 billion post-money mark is reported rather than officially confirmed, and the public
              record does not disclose divisional revenue, contribution margin, burn, liquidation preferences, or
              customer-level proof sufficient to underwrite common-equity returns. My stance is therefore not avoid; the
              assets are too interesting and the mining option is too large. But the reported entry price already
              capitalizes a lot of unproven option value, so the right IC answer is to monitor and demand private
              evidence or a lower price before investing. Today, patience is warranted.
            claimRefs:
