- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - IP / key-person risk
    - New legal claim, customer objection, or failed IP audit
    - Any material unresolved IP provenance finding
    - Pause investment until counsel signs off
  - - Mining safety risk
    - MSHA-reportable event, near-miss spike, or customer pause
    - Serious injury, enforcement action, or halted autonomous operations
    - Move stance toward avoid unless remediation is independently verified
  - - Food-unit economics risk
    - Vacancy, churn, or marketplace take-rate pressure
    - Sustained weak occupancy or no robotics labor-saving evidence
    - Reduce valuation credit for Atoms Food
  - - Transport regulatory risk
    - NHTSA/FMCSA/state constraints tighten
    - Required reporting or permits delay pilots materially
    - Treat Transport optionality as out-of-the-money
  - - Conglomerate capital-allocation risk
    - Divisional KPIs remain undisclosed after funding
    - No separate P&L, capex, customer, and safety metrics
    - Require down-round-protected entry or pass
  - - Partner concentration risk
    - Heidelberg expansion stalls or Hitachi MOU fails to convert
    - No repeatable mining deployments beyond initial proof points
    - Discount Mining from platform thesis to project thesis
  notes: Kill criteria convert broad concerns into observable events that should change the investment stance.
