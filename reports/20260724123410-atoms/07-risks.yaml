chapter:
  number: 7
  title: Risks
  summary: 'Atoms has credible assets and fresh capital, but its risk profile is unusually adverse-source-heavy: founder-governance history, Levandowski/IP trust, regulated mining and transport autonomy, ghost-kitchen market headwinds, and three-division capital allocation all require direct diligence before underwriting the $1.7B physical-AI expansion.'
sections:
- id: regulatory-legal-and-key-person-risk
  title: Regulatory, legal, and key-person risk
  body: 'Atoms’ most investment-relevant risk is not a single lawsuit or permit; it is the collision of founder history, IP trust, and regulated autonomy. The company is City Storage Systems rebranded in March 2026 into Atoms, with Food, Mining, and Transport under one holding-company umbrella. That immediately creates a wider legal surface than a normal restaurant-tech company. Travis Kalanick brings unusual fundraising and operating credibility, but his 2017 Uber resignation remains a governance diligence item because Atoms is explicitly founder-led. The sharper issue is Anthony Levandowski: DOJ and court records establish a Google/Waymo trade-secret theft case, an 18-month sentence, related civil proceedings, and a later pardon. Because Levandowski’s Pronto asset underpins Atoms Mining, customers and partners must underwrite not just autonomy performance, but also IP hygiene, code provenance, contractual indemnities, and board-level controls. MSHA, NHTSA, FMCSA, and state AV rules add
    a second layer: autonomous haulage and transport are regulated safety systems, not just software deployments. The practical underwriting consequence is that legal diligence must be run before valuation work, not after it. An investor should assume customer procurement teams will ask about IP provenance, safety accountability, and leadership controls, especially in mining where equipment uptime and worker safety are board-level concerns for customers. That threshold is non-negotiable.'
