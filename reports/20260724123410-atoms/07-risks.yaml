- id: market-operational-and-safety-risk
  title: Market, operational, and safety risk
  body: 'Atoms Food inherits the ghost-kitchen problem set: demand normalization after the pandemic, facility-level utilization uncertainty, dependence on third-party delivery marketplaces, and opaque unit economics. The reviewed source pack supports a skeptical stance because 2026 commentary frames ghost kitchens as being ‘ghosted,’ while Uber Eats and DoorDash materials show that restaurants depend on marketplace access and fee structures to generate demand. Atoms Mining has a better public proof base—Heidelberg Materials reported more than two million tons autonomously hauled, and Hitachi signed a strategic MOU—but those proof points do not eliminate operating risk. Pronto’s retrofit, camera-first proposition can reduce deployment complexity, yet every autonomous mine route still depends on perception reliability, site procedures, weather, traffic separation, maintenance discipline, and incident response. A single serious safety event could transmit into customer pauses, regulator scrutiny,
    insurance cost, and valuation confidence. The key diligence ask is therefore operational evidence by facility and site, not more aggregate vision language. The operating risk is also measurable. The diligence package should include cohort-level kitchen occupancy, robotics uptime, autonomous haulage disengagements, safety incidents, and customer renewal evidence. Without those metrics, public proof points are useful indicators but not enough to size downside probability.'
  claimRefs:
  - CR012
  - CR013
