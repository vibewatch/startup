  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash burn runway
    missingEvidence: Current cash balance, restricted cash, debt, monthly burn, committed capex, and runway months.
    whyItMatters: The $1.7B round cannot be underwritten without knowing how quickly real estate and robotics programs consume
      cash.
    diligencePath: Request bank statements, debt schedules, leases, capex budget, and monthly cash-flow forecast by division.
    relatedQuestionRefs:
    - QI018
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: division-level P&L
    missingEvidence: Revenue, gross margin, contribution margin, and operating expense by Food, Mining, and Transport.
    whyItMatters: Aggregated holding-company metrics would hide whether Mining traction subsidizes Food or Transport losses.
    diligencePath: Request management accounts and audited schedules by division and SKU for the past eight quarters.
    relatedQuestionRefs:
    - QI006
    - QI020
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: food unit economics
    missingEvidence: Active kitchens, occupancy, average rent, tenant churn, tenant-level contribution margin, and platform-fee
      burden.
    whyItMatters: Adverse ghost-kitchen economics can convert a nominally attractive rent model into high-churn revenue.
    diligencePath: Request facility cohort reports and anonymized tenant P&Ls after rent, labor, delivery fees, and marketing.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: mining bookings pricing
    missingEvidence: Pronto contract values, pricing model, ARR/bookings, backlog, gross margin, and deployment cost.
    whyItMatters: Customer proof does not prove Atoms can capture enough value from mining autonomy to earn attractive margins.
    diligencePath: Request signed customer contracts, renewal terms, implementation cost, support burden, and site-level ROI
      cases.
    relatedQuestionRefs:
    - QI004
    - QI015
    - QI016
    - QI017
    - QI022
    relatedTableRefs:
    - TI002
    - TI003
