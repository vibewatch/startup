- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'Financially, Atoms is investable only as a capitalized platform option with meaningful opaque-company risk. The strongest
    evidence is that investors supplied $1.7 billion of fresh equity and that the Mining division has tangible customer and
    partner signals. The weakest evidence is current operating performance: no public source discloses revenue, gross margin,
    cash, burn, runway, bookings, backlog, occupancy, or division-level profitability. The adverse read is especially important
    in Food, where ghost-kitchen economics can look attractive at the landlord level while tenants struggle with platform
    fees, marketing spend, and demand normalization. The next diligence step is therefore not a bigger market-sizing exercise;
    it is a private financial data room with division-level P&L, unit economics, capex commitments, and a cash-flow bridge
    from the July 2026 financing to the next financing trigger. Until that package is available, any valuation model should
    use conservative operating assumptions, keep transport optionality separate, and avoid capitalizing undisclosed Food or
    Mining revenue as if it were audited recurring software revenue.'
  claimRefs:
  - CI028
  - CI029
  - CI030
  - CI033
