- id: TI002
  title: Pricing / monetization table
  columns:
  - Line
  - Public pricing evidence
  - List vs realized status
  - Revenue-recognition issue
  - Diligence ask
  rows:
  - - CloudKitchens commercial kitchens
    - Official site describes fully built commercial kitchens for delivery, takeout, and production
    - List prices and realized rent not disclosed
    - Rent/service revenue may differ from tenant sales
    - Request rent schedule, occupancy, incentives, and tenant churn
  - - Delivery marketplace exposure
    - Uber Eats merchant page shows marketplace plan and promotion constructs
    - Comparable marketplace pricing, not Atoms pricing
    - Tenant contribution margin can be reduced by fees and promotions
    - Request tenant P&Ls and platform-fee share of GMV
  - - Pronto AHS
    - Official Pronto pages describe OEM-agnostic autonomous haulage benefits
    - Actual per-truck or site price not disclosed
    - Could mix hardware, software, deployment, and support
    - Request contract templates and ARR/backlog by site
  - - Hitachi / partner channel
    - Hitachi partnership supports distribution but not price
    - Partner economics undisclosed
    - Revenue may be direct, partner-led, or shared
    - Request channel margin, exclusivity, and implementation cost
  - - Transport automation
    - Atoms vision identifies transport as substrate
    - No public price or product package
    - Likely R&D-stage before revenue recognition
    - Request paid pilots and capitalization policy
  notes: Public pricing evidence is mostly mechanism-level; realized contract pricing remains a private diligence item.
