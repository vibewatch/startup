    - Rent and services for fully built delivery/takeout kitchens
    - Kitchen, facility, tenant, or service fee
    - null
    - Mechanism visible; value undisclosed
    - Request active kitchens, occupancy, average rent, churn, and gross margin
  - - Atoms Food / robotics
    - Bowl Builder and Lab37 automation layered into food production
    - Robot line, facility, or output unit
    - null
    - Strategic narrative visible; monetization undisclosed
    - Request deployed units, utilization, capex per line, and service revenue
  - - Atoms Mining / Pronto AHS
    - Autonomous haulage retrofit, software, support, and site deployment
    - Truck, site, subscription, or outcomes contract
    - null
    - Customer proof stronger than price disclosure
    - Request price book, ARR/bookings, backlog, and gross margin by site
  - - Atoms Transport
    - Automation for logistics and heavy transport
    - Vehicle, fleet, route, or platform fee
    - null
    - Earliest-stage; no public revenue signal
    - Request pilots, contracts, milestones, and budgeted R&D
  - - Balance-sheet capital
    - Equity financing to fund multi-division buildout
    - Equity dollars raised
    - $1.7B latest round
    - High-quality funding signal, not revenue
