- id: capital-adequacy-and-intensity
  title: Capital adequacy and capital intensity
  body: 'The July 2026 $1.7 billion raise materially improves Atoms’ balance-sheet capacity, but it does not by itself solve
    underwriting. The capital has to fund at least three different needs: real-estate and kitchen automation in Food, robotics
    and deployment support in Mining, and longer-cycle transport automation. Historical CloudKitchens marks show the business
    has attracted very large pools of capital before, including the $400 million PIF round and a reported later $15 billion
    valuation, yet those marks are historical and not a current cash-flow statement. The reported roughly $10 billion 2026
    valuation is useful for scenario framing, but not official fair value. The public record does not disclose cash on hand,
    burn, free cash flow, debt, project-finance obligations, or runway months; all of those must remain null with a diligence
    path. This means the round is best viewed as optionality and time, not a completed de-risking event. A board budget showing
    how much capital is reserved for Food facilities, mining deployments, transport R&D, and corporate overhead would materially
    change the conclusion.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI008
