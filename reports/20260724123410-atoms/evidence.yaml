evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: metric-gaps
    missingEvidence: >-
      Current revenue, ARR, division-level revenue, active customer count, and audited headcount from management or
      investor materials.
    whyItMatters: >-
      These numbers determine whether Atoms is valued as a scaled operating platform or as a capitalized robotics
      option.
    diligencePath: Request board deck, management KPI bridge, payroll summary, and division-level P&L for 2024-2026.
    relatedQuestionRefs:
      - QO014
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-gaps
    missingEvidence: >-
      Complete board roster, investor rights, voting control, debt terms, and any related-party commercial agreements
      with Uber or other investors.
    whyItMatters: The public record only names Ben Horowitz, so control, downside protections, and conflict risks remain opaque.
    diligencePath: >-
      Request financing documents, shareholder register, board minutes, debt commitments, and strategic-investor side
      letters.
    relatedQuestionRefs:
      - QO010
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map
    missingEvidence: >-
      Ownership percentages, check sizes, and any unnamed cap-table holders or lenders not disclosed in public
      reporting.
    whyItMatters: The investor map is useful directionally but cannot establish control or economic exposure by stakeholder.
    diligencePath: Reconcile the public stakeholder list against the post-money capitalization table and debt schedule.
    relatedQuestionRefs:
      - QO011
      - QO013
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: TO004 milestone coverage and transport-traction
    missingEvidence: Named Atoms Transport pilots, customers, regulatory approvals, or technical specifications.
    whyItMatters: Transport is a core division in the strategy but has weaker public proof than Atoms Mining.
    diligencePath: Ask management for Transport roadmap, pilot contracts, safety case, and regulatory deployment plan.
    relatedQuestionRefs:
      - QO006
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Atoms SAM/SOM
    missingEvidence: >-
      Division-level revenue, deployed sites, contract values, pricing, utilization, and win-rate data for Atoms Food,
      Mining, and Transport.
    whyItMatters: Without these inputs, broad market estimates cannot be converted into company-specific SAM or SOM.
    diligencePath: Request management KPI pack by division and reconcile it to customer contracts and deployment logs.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: Market sizing methodology
    missingEvidence: >-
      Publisher methodologies that reconcile whether figures include GMV, hardware, software, services, real estate, or
      transport-management spend.
    whyItMatters: Contradictory estimates change the apparent market size by billions and can distort valuation.
    diligencePath: Build a bottom-up market model from buyer workflows and include only spend pools Atoms can monetize.
    relatedQuestionRefs:
      - QM023
      - QM024
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: Transport pilots
    missingEvidence: Public Atoms Transport pilots, customer references, or regulatory filings.
    whyItMatters: Transport is the least bounded of the three markets and may be more thesis than current SAM.
    diligencePath: >-
      Search customer announcements, state AV filings, job postings, and procurement records; ask management for pilot
      pipeline.
    relatedQuestionRefs:
      - QM017
      - QM022
  - type: missing-source
    severity: material
    topic: komatsu-epiroc-details
    missingEvidence: >-
      Current official Komatsu FrontRunner and Epiroc autonomous haulage product pages with feature and deployment
      details.
    whyItMatters: Without retrievable official pages the mining feature matrix cannot fairly score those incumbents against Pronto.
    diligencePath: Request vendor collateral from mines and rerun official-site retrieval or procurement-document searches.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: atoms-economics
    missingEvidence: Atoms division-level pricing, win rates, retention, safety incidents, and deployment economics.
    whyItMatters: Competitive durability depends on realized ROI and switching costs, not just public positioning.
    diligencePath: Obtain management KPI pack, customer references, and cohort economics by division.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
      - TP004
  - type: access-blocked
    severity: minor
    topic: warehouse-fetch-details
    missingEvidence: Detailed Zebra / Fetch Robotics page content without 406 blocking.
    whyItMatters: Zebra may be a relevant warehouse AMR substitute, but unsupported details should not be inferred.
    diligencePath: Use alternate official pages, customer procurement records, or vendor briefings for feature validation.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: cash burn runway
    missingEvidence: Current cash balance, restricted cash, debt, monthly burn, committed capex, and runway months.
    whyItMatters: The $1.7B round cannot be underwritten without knowing how quickly real estate and robotics programs consume cash.
    diligencePath: Request bank statements, debt schedules, leases, capex budget, and monthly cash-flow forecast by division.
    relatedQuestionRefs:
      - QI018
