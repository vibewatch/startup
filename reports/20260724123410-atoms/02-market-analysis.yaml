company:
  name: Atoms
chapter:
  number: 2
  title: Market Analysis
  summary: 'Atoms operates across three distinct market pools: cloud-kitchen/food-delivery infrastructure, autonomous mining
    haulage, and logistics/transport automation. The market is large but not cleanly additive; food has the biggest headline
    GMV, mining has the clearest site-level ROI logic, and transport has the broadest but least bounded option value.'
sections:
- id: market-boundary
  title: 'Market boundary: three distinct pools, not one TAM'
  body: 'Atoms should not be valued against one generic robotics TAM. Its own vision page frames the company as physical automation
    across Food, Mining, and Transport, which creates three separate market tests. Food starts with online delivery demand
    but monetizes through cloud-kitchen infrastructure and automation; mining is a narrower autonomous-haulage and mining-automation
    budget tied to safety, utilization, and labor exposure; transport is a broader logistics-automation option where warehouse
    automation is more measurable than road autonomy. This boundary matters because the headline food-delivery market is hundreds
    of billions of dollars of consumer GMV, while mining automation is a single-digit-billion industrial capex market and
    logistics automation depends heavily on whether a publisher includes warehouses, transport management, robotics, or autonomous
    vehicles. The diligence stance is therefore portfolio-based: Atoms has exposure to large physical-world automation budgets,
    but each division needs its own buyer, adoption clock, and proof standard. This also forces discipline in later chapters:
    competitors, unit economics, and valuation multiples should be benchmarked against the relevant division rather than against
    the largest available headline market. A restaurant-infrastructure buyer, a mine operator, and a logistics fleet owner
    have different procurement cycles, safety proofs, implementation partners, and tolerance for operational disruption. The
    market boundary therefore functions as a diligence control, not merely a taxonomy.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM012
  - CM013
  - CM029
  - CM034
  - CM035
  tableRefs:
  - TM001
  - TM002
  figureRefs:
  - FM001
  - FM002
- id: buyers-and-adoption
  title: Buyer segmentation and adoption path
  body: 'The buyer map is unusually fragmented because Atoms is not selling one workflow. In food, the economic buyer is a
    restaurant operator, kitchen real-estate operator, brand owner, or delivery-led food entrepreneur who needs throughput,
    rent flexibility, delivery-market access, and kitchen labor efficiency. In mining, the budget owner is closer to a mine,
    quarry, or materials operator with a truck fleet and a measurable productivity and safety case. Pronto’s official description
    of off-road AHS for mines and quarries makes that budget line more legible than Atoms Transport, where buyers could be
    warehouse operators, 3PLs, retailers, carriers, or industrial campuses. Adoption therefore moves from site selection and
    workflow integration to safety/regulatory acceptance and fleet-scale rollout. The implication is that Atoms Food can pursue
    many smaller locations, Atoms Mining can sell fewer but larger deployments, and Atoms Transport needs clearer proof of
    where the buyer/user/payer loop closes. The adoption path also differs by capital intensity. Cloud-kitchen sites can in
    theory be replicated location by location, but they remain exposed to food demand, delivery-platform economics, and local
    permitting. Mining deployments may require longer site integration and safety assurance, yet a successful retrofit can
    attach to expensive assets with quantifiable utilization targets. Logistics automation sits between those poles: warehouse
    robotics has measurable payback cases, while autonomous road transport must clear a higher public-safety and regulatory
    bar.'
  claimRefs:
  - CM002
  - CM017
  - CM018
  - CM019
  - CM028
  - CM030
  - CM033
  - CM037
  - CM038
