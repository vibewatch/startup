- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Economic buyer
  - User/operator
  - Budget owner
  - Adoption trigger
  - Primary constraint
  rows:
  - - Food delivery GMV context
    - Consumer and delivery platform ecosystem
    - Diners, couriers, restaurants
    - Consumers fund GMV; platforms set economics
    - Convenience, mobile ordering, delivery density
    - Does not directly equal Atoms revenue
  - - Cloud kitchen operator
    - Virtual brand, restaurant chain, kitchen real-estate operator
    - Kitchen staff, robotics/workflow operators
    - Operations, real estate, or brand GM
    - Need lower capex and faster delivery-market expansion
    - Food safety, occupancy, delivery fees, labor
  - - Mining AHS retrofit
    - Mine or quarry operator
    - Truck fleet and dispatch teams
    - Mine GM, operations, safety, capex committee
    - Safety improvement, labor scarcity, utilization, cost/ton
    - Site integration, trust, regulatory/safety acceptance
  - - Mining automation software/services
    - Mine operator or contractor
    - Remote operations center, maintenance teams
    - Operations technology and mine planning
    - Need visibility and lower downtime
    - Integration with OEM fleets and legacy systems
  - - Warehouse automation
    - Retailer, manufacturer, 3PL
    - Warehouse associates and automation technicians
    - Supply-chain, operations, capex
    - E-commerce volume, labor scarcity, service-level pressure
    - Capex, change management, ROI proof
  - - Transport management automation
    - Shipper, 3PL, carrier
    - Dispatchers, planners, fleet teams
    - Logistics/procurement leadership
    - Need routing, visibility, and asset utilization
    - Fragmented data and switching costs
  - - Autonomous trucking adjacency
    - Carrier, shipper, fleet owner
    - Safety driver/remote operations/fleet ops
    - Fleet capex and regulatory compliance leaders
    - Driver scarcity and utilization upside
    - NHTSA/state regulatory path, liability, public trust
  - - Portfolio investor lens
    - Growth investor or strategic partner
    - Atoms corporate and division teams
    - Board/capital allocation
    - One division proving repeatable deployment economics
    - Execution focus across three unrelated markets
  notes: 'Buyer segmentation is partial: public evidence identifies category buyers, but Atoms-specific contract structures
    and budget owners are not disclosed.'
