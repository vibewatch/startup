tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance to Atoms
  rows:
  - - Online food delivery
    - Consumer GMV and platform-mediated meal or grocery delivery
    - Restaurant dine-in, unmanaged offline orders, platform fees not captured as infrastructure revenue
    - Consumers fund GMV; restaurants and platforms pay for enablement
    - Top-down demand context for Atoms Food
  - - Cloud / ghost kitchens
    - Kitchen facilities, delivery-optimized real estate, shared kitchens, automation inside fulfillment
    - All restaurant sales, grocery retail, pure delivery marketplace commissions
    - Restaurant brands, virtual brands, kitchen operators
    - Closest public proxy for Atoms Food monetizable infrastructure
  - - Mining automation and AHS
    - Autonomous haulage, drilling, remote operations, software, sensing, integration, services
    - General mining equipment without automation, commodity production revenue
    - Mine/quarry owner or operator, contractor, fleet manager
    - Direct proxy for Atoms Mining/Pronto
  - - Logistics automation
    - Warehouse automation, transport management, robotics, autonomous vehicles, sortation, software
    - Traditional manual logistics labor, non-automated freight brokerage
    - Retailer, manufacturer, 3PL, carrier, warehouse operator
    - Broad proxy for Atoms Transport
  - - Warehouse automation
    - AS/RS, conveyors, AMRs, WMS, picking/packing robotics
    - Long-haul road autonomy and non-warehouse transport networks
    - Warehouse operator, retailer, manufacturer, 3PL
    - Most measurable near-term Transport submarket
  - - Autonomous trucking / road autonomy
    - Automated driving systems, truck autonomy, regulated on-road deployment
    - Warehouse-only robotics and manually driven freight
    - Carrier, shipper, fleet owner; regulators influence timing
    - High-optionality adjacency but least bounded public SAM
  notes: Rows intentionally separate consumer GMV, infrastructure revenue, industrial automation capex, and regulated transport
    autonomy so the chapter does not mix incompatible market pools.
