- id: drivers-constraints-and-gaps
  title: Growth drivers, constraints, and unresolved sizing gaps
  body: 'The positive market case is that all three categories have secular automation demand: consumers still buy food through
    digital channels, mines face safety and labor-productivity pressure, and logistics networks need faster, more visible,
    less labor-intensive fulfillment. The caution is that the estimates are contradictory because publishers define the markets
    differently. Online food delivery can mean consumer GMV, cloud kitchens can mean facility revenue, logistics automation
    can include or exclude warehouse robotics, and autonomous trucking faces a different regulatory path from warehouse automation.
    The result is a useful but incomplete market map: Atoms can plausibly address multiple large pools, yet public evidence
    does not isolate division-level SAM, current SOM, unit economics, or deployment capacity. Those gaps matter for valuation
    because a USD 10 billion private valuation requires confidence that at least one of the three markets can convert from
    broad automation thesis to repeatable, high-margin, capital-efficient revenue. For that reason, the chapter treats market
    estimates as ranges and proxy lenses rather than a single answer. A high-growth market only matters if Atoms can capture
    budget with a product that customers can deploy repeatedly. The next diligence step is bottom-up: count addressable sites
    and fleets, estimate annual contract value by workflow, compare payback against buyer alternatives, and then assign probability-weighted
    credit to Food, Mining, and Transport separately.'
