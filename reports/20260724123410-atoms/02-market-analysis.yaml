- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Consumer digital ordering and delivery density
    - driver
    - current
    - Supports large Food demand context
    - Separate platform GMV from Atoms kitchen revenue
  - - Cloud-kitchen automation and lower real-estate capex
    - driver
    - current
    - Could improve unit throughput and site economics
    - Obtain Atoms Food site-level utilization and payback data
  - - Food-safety licensing and delivery-fee dependency
    - constraint
    - current
    - Can slow kitchen expansion and compress margins
    - Review market-by-market licensing and platform economics
  - - Mine safety and labor exposure
    - driver
    - current
    - Supports AHS ROI narrative and buyer urgency
    - Quantify incident reduction and human-hours removed per deployment
  - - Mine-site integration and OEM heterogeneity
    - constraint
    - current
    - Can lengthen deployments and services burden
    - Validate retrofit cycle time and maintenance model
  - - E-commerce and fulfillment speed expectations
    - driver
    - current
    - Supports warehouse/logistics automation demand
    - Identify where Atoms Transport product exists beyond thesis
  - - AV regulation and safety assurance
    - constraint
    - current-to-long-term
    - Makes road autonomy slower than controlled-site automation
    - Map NHTSA/state requirements and pilot geographies
  - - Publisher methodology spread
    - constraint
    - immediate
    - Makes one blended TAM unreliable
    - Build bottom-up SAM from Atoms deployments, pricing, and win rates
  notes: Drivers and constraints combine publisher market commentary with official/regulatory evidence; several require private
    Atoms operating data to quantify.
