  topStrengths:
    - 融资能力和背书都很强：$1.7B 轮由 a16z 领投（Ben Horowitz 入董事会），Uber、Bain Capital 和 Fifth Wall 参投。
    - >-
      Travis Kalanick 是经过验证的创始人型运营者；Pronto 是真实自动驾驶运输资产，已有 Heidelberg Materials 等点名部署，并与 Hitachi Construction Machinery
      合作。
    - CloudKitchens 带来纵向控制的地产和运营关系，给 Atoms 提供多数独立机器人公司缺少的分发优势。
  topRisks:
    - 关键人和声誉风险集中：Kalanick 曾被 Uber 赶下台；Anthony Levandowski（Pronto/Atoms Mining）背着一项已获赦免的商业秘密盗窃定罪。
    - 食品、采矿、运输三块业务关联度低且都吃资本，执行焦点和资本配置风险很高，也可能被市场打上集团折价。
    - 幽灵厨房市场有逆风：COVID 后需求回归常态，业务依赖配送费；自动驾驶车辆 / 采矿（MSHA）监管暴露也很重。
  unresolvedGaps:
    - 合并口径或分部口径收入、利润率、烧钱速度、现金跑道都未披露；约 $10B 估值来自媒体推断，并非公司确认。
    - 股权结构表、董事会构成，以及 $1.7B 融资的准确结构仍未披露。
    - Atoms Transport 基本仍处于产品前阶段，没有公开客户；Pronto 采矿业务的单位经济也没有独立验证。
