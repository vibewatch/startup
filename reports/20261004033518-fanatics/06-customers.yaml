chapter:
  number: 6
  title: "Customers"
  summary: "Fanatics leverages an aggregated customer base of over 100 million reachable sports fans and more than 95 million commerce customer profiles to cross-sell sports merchandise, collectibles, wagering, and prediction markets. However, high channel concentration with licensors like the NFL, lack of public disclosure on customer retention or cohort LTV, and customer-facing friction across privacy, fulfillment, and gaming ecosystems create material diligence questions."
sections:
  - id: "customer-segmentation-and-buyer-ecosystem"
    title: "Customer Base Segmentation and Buyer-Payer Dynamics"
    body: "Fanatics operates a multifaceted sports ecosystem with distinct customer segments spanning retail consumer fan merchandise buyers, high-intent sports bettors, collectibles marketplace hobbyists, and enterprise league partners [CU001, CU002]. At the top of the consumer funnel sits Fanatics Commerce, which captures sports fans purchasing licensed jerseys, headwear, and lifestyle apparel across digital league storefronts and more than 2,000 retail locations [CU001, CU005]. Fanatics Betting & Gaming targets adult wagering consumers across online sportsbooks, iGaming casino platforms, and physical venue sportsbooks, leaning on cross-sell from its commerce customer database rather than heavy external ad blitzes [CU003, CU008]. Collectibles buyers and live-breaking participants engage via Topps.com, Fanatics Collect, and Fanatics Live, where commercial account managers actively curate relationships with top-tier sellers and hobby collectors [CU004, CU009]. Meanwhile, B2B wholesale and enterprise licensing counterparties, such as Abercrombie & Fitch and major sports properties, depend on Fanatics as a central e-commerce and retail distribution partner [CU001, CU010]. Diligence notes that despite expansive reach, public visibility into standalone segment economics, user ARPU, and cross-segment conversion efficiency remains strictly limited [CU011]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-loyalty-mechanisms"
    title: "Adoption Trajectory, FanCash Loyalty, and Platform Scale"
    body: "The historical adoption trajectory of Fanatics demonstrates rapid scaling from a legacy sports apparel retailer into an integrated enterprise operating across more than 80 global offices and facilities [CU001, CU006]. The addressable consumer audience has expanded to over 100 million reachable fans globally, supported by mobile-first digital storefronts where mobile devices generate over 70% of platform traffic and up to 80% of peak revenue [CU001, CU005]. To drive repeat engagement and cross-division adoption, Fanatics introduced Fanatics ONE, an enterprise loyalty mechanism that unifies FanCash rewards across commerce, collectibles, and betting surfaces [CU001, CU007]. Product management initiatives specifically prioritize real-time ledger systems and engagement features to incentivize cross-platform adoption among sports fans [CU007]. However, external audits and diligence reveal that Fanatics does not publish cohort-level Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or annual active customer counts, leaving the true durability of fan repeat-purchase cycles unverified [CU011, CU012]."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof-and-enterprise-partnerships"
    title: "Enterprise Deployment Proof, Infrastructure Scaling, and B2B Relationships"
    body: "Enterprise and commercial deployment proof underscores Fanatics' institutional adoption and operational reach [CU001, CU010]. In consumer brand partnerships, apparel retailer Abercrombie & Fitch executed a formal agreement with Fanatics as its NFL e-commerce partner, enabling A&F's NFL collection to be sold through nflshop.com, NFL stadium stores, official team sites, and Fanatics web properties [CU010]. On the institutional finance and technology infrastructure sides, internal teams have deployed FloQast, ScyllaDB, and AWS to scale complex operations [CU005, CU006, CU013]. FloQast's accounting solution was adopted across global retail, wholesale, and online commerce teams to support over $8 billion in enterprise revenue and 300+ finance users, cutting days-to-close by 50% ahead of pre-IPO requirements [CU006]. Similarly, platform engineering teams migrated from Cassandra to ScyllaDB and consolidated global data center operations into three AWS regions, managing peak workloads of 280,000 IOPS and achieving up to 48% infrastructure cost savings [CU005, CU013]. These enterprise implementations illustrate the massive technological throughput required to serve global fan demand [CU005, CU013]."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "durability-risks-and-channel-concentration"
    title: "Customer Durability, Privacy Friction, and Counterparty Concentration"
    body: "Despite its immense scale, Fanatics faces concentrated commercial dependencies, channel friction, and customer trust challenges [CU001, CU014]. The business exhibits heavy counterparty concentration around exclusive licensing deals with major leagues and player associations (NFL, MLB, NBA), where any licensing dispute threatens merchandise supply and fan trust [CU001, CU014]. In the sports collectibles arena, dueling antitrust litigation with Panini highlighted the legal vulnerability of aggressive long-term rights lockups [CU014]. Concurrently, consumer privacy and tracking policies disclose extensive tracking via session replay tools, mobile SMS cart-abandonment triggers, and consumer data sharing across the Fanatics Family of Companies and commercial data partners, creating heightened regulatory compliance exposure across US jurisdictions [CU015]. In gaming and prediction markets, the acquisition of Water Street Labs and CX Clearinghouse marks a complex transition from retail intermediary to federally regulated CFTC exchange, subjecting customer onboarding to rigorous federal compliance [CU002, CU016]. Without verified disclosure on customer churn or cohort renewal rates, long-term customer durability remains a primary diligence uncertainty [CU011, CU012]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU015"
      - "CU016"
