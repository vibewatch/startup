      - "Valuation / return logic"
      - "Probability signal"
      - "Key risks"
      - "Downside trigger"
    rows:
      - - "Bull"
        - "Audited profitable growth across the mixed portfolio; newer segments add value; clean preference stack."
        - "$31B is a marker to validate, not a forecast; no target return is supportable without price and security terms."
        - "Low until audited evidence is supplied"
        - "Platform premium is not demonstrated by segment results."
        - "Any evidence that newer segments structurally consume cash or dilute mature commerce economics."
      - - "Base"
        - "Scale persists, but segment quality and current capital needs remain partly opaque."
        - "Require a material discount to the unresolved $22B-$31B public markers; no precise range is supportable."
        - "Most consistent with current public evidence"
        - "Stale revenue basis, mark conflict, dilution, and preference uncertainty."
        - "Offered price assumes the $31B mark without current audited support."
      - - "Bear"
        - "Weak segment economics, rights conflict, or multiple compression outweigh platform scale."
        - "Materially below $22B; exact downside cannot be quantified from public evidence."
        - "Plausible and insufficiently bounded"
        - "Legal conflict, illiquidity, unfavorable senior claims, and portfolio losses."
        - "Diligence reveals sustained losses, material senior overhang, or no credible exit path."
    notes: "Scenario boundaries use only the cited $22B and $31B vendor marks and historical revenue references; no enterprise value, equity bridge, probability, or return has been invented."
    claimRefs:
