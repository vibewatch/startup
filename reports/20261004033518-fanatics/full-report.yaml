              - CU010
              - CU013
              - CU016
      - number: '6.4'
        title: Customer Durability, Privacy Friction, and Counterparty Concentration
        blocks:
          - type: paragraph
            body: >-
              Despite its immense scale, Fanatics faces concentrated commercial dependencies, channel friction, and
              customer trust challenges [CU001, CU014]. The business exhibits heavy counterparty concentration around
              exclusive licensing deals with major leagues and player associations (NFL, MLB, NBA), where any licensing
              dispute threatens merchandise supply and fan trust [CU001, CU014]. In the sports collectibles arena,
              dueling antitrust litigation with Panini highlighted the legal vulnerability of aggressive long-term
              rights lockups [CU014]. Concurrently, consumer privacy and tracking policies disclose extensive tracking
              via session replay tools, mobile SMS cart-abandonment triggers, and consumer data sharing across the
              Fanatics Family of Companies and commercial data partners, creating heightened regulatory compliance
              exposure across US jurisdictions [CU015]. In gaming and prediction markets, the acquisition of Water
              Street Labs and CX Clearinghouse marks a complex transition from retail intermediary to federally
              regulated CFTC exchange, subjecting customer onboarding to rigorous federal compliance [CU002, CU016].
              Without verified disclosure on customer churn or cohort renewal rates, long-term customer durability
              remains a primary diligence uncertainty [CU011, CU012].
            claimRefs:
              - CU001
              - CU002
              - CU011
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Commerce-to-Gaming Cross-Sell Engine
            body: >-
              Fanatics' primary customer acquisition moat in sports betting is its existing database of over 95 million
              commerce customers, which provides a low-cost distribution channel compared to the massive customer
              acquisition spend of DraftKings and FanDuel [CU003, CU008].
            calloutType: insight
            claimRefs:
