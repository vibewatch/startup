              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
      - number: '7.3'
        title: Partner Concentration, Financial Architecture, and Execution Dependencies
        blocks:
          - type: paragraph
            body: >-
              The core business model of Fanatics relies upon long-term licensing agreements with major sports leagues,
              players associations, colleges, and international athletic bodies. The loss, non-renewal, or material
              renegotiation of exclusive rights with anchor counterparties such as the NFL, MLB, or NBA represents an
              existential threat to apparel and collectibles revenue streams. In sports betting, the company depends on
              state regulatory bodies, official sports data providers, and payment processors for continuous operation.
              Financially, while Fanatics secured $700 million in growth equity in December 2022 pushing its valuation
              to $31 billion, the company operates without public disclosure of its balance sheet, cash burn, or
              segment-level profitability. Scaling capital-intensive betting operations and absorbing multi-year
              licensing guarantees require disciplined cash management and debt governance. Additionally, execution
              risks remain elevated as the company integrates multi-vertical offerings—unifying sportsbook, casino, and
              prediction markets alongside core merchandise—which amplifies strategic and technological execution
              complexity across more than 22,000 global employees.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR011
