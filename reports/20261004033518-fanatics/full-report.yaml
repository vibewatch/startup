      - number: '6.2'
        title: Adoption Trajectory, FanCash Loyalty, and Platform Scale
        blocks:
          - type: paragraph
            body: >-
              The historical adoption trajectory of Fanatics demonstrates rapid scaling from a legacy sports apparel
              retailer into an integrated enterprise operating across more than 80 global offices and facilities [CU001,
              CU006]. The addressable consumer audience has expanded to over 100 million reachable fans globally,
              supported by mobile-first digital storefronts where mobile devices generate over 70% of platform traffic
              and up to 80% of peak revenue [CU001, CU005]. To drive repeat engagement and cross-division adoption,
              Fanatics introduced Fanatics ONE, an enterprise loyalty mechanism that unifies FanCash rewards across
              commerce, collectibles, and betting surfaces [CU001, CU007]. Product management initiatives specifically
              prioritize real-time ledger systems and engagement features to incentivize cross-platform adoption among
              sports fans [CU007]. However, external audits and diligence reveal that Fanatics does not publish
              cohort-level Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or annual active customer counts,
              leaving the true durability of fan repeat-purchase cycles unverified [CU011, CU012].
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
