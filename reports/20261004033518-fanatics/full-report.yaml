          - type: callout
            title: Unverified Durability and Cohort Economics
            body: >-
              While Fanatics highlights 100M+ reachable fans, the absence of public cohort retention data, Net Revenue
              Retention metrics, or churn disclosure leaves open questions regarding how many users transact outside of
              one-time championship event spikes [CU011, CU012].
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Environment
        blocks:
          - type: paragraph
            body: >-
              Fanatics operates across highly regulated and legally contentious commercial domains. In its betting and
              gaming division, the company offers real-money online sports betting, online casino, and prediction
              markets across multiple jurisdictions under state-level regulatory frameworks such as Tennessee's Sports
              Gaming Act. These operations require continuous regulatory approvals, strict anti-money laundering (AML)
              controls including Currency Transaction Reports and Suspicious Activity Reports, and mandatory
              self-exclusion compliance. Furthermore, the rapid growth of mobile sports wagering has catalyzed consumer
              protection scrutiny, product liability investigations, and plaintiff litigation concerning compulsive
              gambling behavior and platform safeguards. In collectibles, Fanatics' rapid consolidation of exclusive
              long-term licensing rights across the NBA, MLB, and NFL Players Association triggered high-stakes
              antitrust litigation from legacy incumbent Panini, resulting in dueling federal lawsuits alleging
              anti-competitive market foreclosure and fraud. In addition, the enterprise framework must manage global
              trade controls, intellectual property protections across 900 partner brands, and privacy compliance across
              millions of user accounts. The legal exposure demands ongoing monitoring of state sports wagering
              councils, federal court antitrust dockets, and privacy enforcement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Operational, Quality, and Security Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Fanatics' enterprise risk framework identifies daily operations, technology infrastructure, customer
              experience, and cybersecurity as primary vectors of potential disruption. Operating an omnichannel
              footprint of digital storefronts and more than 2,000 retail locations—including all Lids physical
              stores—creates severe logistics, inventory management, and supply chain exposure. Peak sporting events,
              league championships, and real-time product drops require fault-tolerant vertical manufacturing and
              immediate e-commerce scalability. On the technical infrastructure front, system availability and platform
              latency represent critical failure modes; outages during high-volume betting windows or major retail
              events directly generate financial loss and reputational brand damage. Furthermore, as stewards of
              consumer data for over 100 million sports fans globally, Fanatics faces heightened cyber threats and data
              breach risks across its commerce, loyalty, and wagering platforms. Corporate governance oversees these
              areas through an annual enterprise risk assessment led by internal audit and reported to the Board Audit
              Committee. Mitigations include a privacy-by-design architecture, vendor risk management protocols, and
              global information security policies.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
