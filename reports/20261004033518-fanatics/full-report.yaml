              - CU008
              - CU011
              - CU012
      - number: '6.3'
        title: Enterprise Deployment Proof, Infrastructure Scaling, and B2B Relationships
        blocks:
          - type: paragraph
            body: >-
              Enterprise and commercial deployment proof underscores Fanatics' institutional adoption and operational
              reach [CU001, CU010]. In consumer brand partnerships, apparel retailer Abercrombie & Fitch executed a
              formal agreement with Fanatics as its NFL e-commerce partner, enabling A&F's NFL collection to be sold
              through nflshop.com, NFL stadium stores, official team sites, and Fanatics web properties [CU010]. On the
              institutional finance and technology infrastructure sides, internal teams have deployed FloQast, ScyllaDB,
              and AWS to scale complex operations [CU005, CU006, CU013]. FloQast's accounting solution was adopted
              across global retail, wholesale, and online commerce teams to support over $8 billion in enterprise
              revenue and 300+ finance users, cutting days-to-close by 50% ahead of pre-IPO requirements [CU006].
              Similarly, platform engineering teams migrated from Cassandra to ScyllaDB and consolidated global data
              center operations into three AWS regions, managing peak workloads of 280,000 IOPS and achieving up to 48%
              infrastructure cost savings [CU005, CU013]. These enterprise implementations illustrate the massive
              technological throughput required to serve global fan demand [CU005, CU013].
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU010
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
