      - number: '4.4'
        title: Capital adequacy remains unobservable
        blocks:
          - type: paragraph
            body: >-
              The last broadly corroborated primary financing event in this pool is the approximately $700 million 2022
              round at a $31 billion valuation; reporting at the time said proceeds were reserved for strategic M&A
              rather than day-to-day operations. Tracxn reports $4.85 billion of total funding, but funding raised is
              not cash available. UpMarket still described Fanatics as private in March 2026, so no public-market filing
              closes the disclosure gap. The reviewed sources provide no audited cash, debt, burn, runway,
              working-capital, capex, or segment cash-flow schedule. The financial verdict is therefore research-more:
              revenue diversity is plausible and Collectibles may offer a favorable margin path, but liquidity, gaming
              investment needs, inventory exposure, and consolidated cash conversion remain ununderwritable.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
