      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Moat from Strategic League Alignment
            body: >-
              By granting equity stakes representing roughly 10% of the company to major sports leagues (NFL, MLB, NHL,
              MLS) and player associations, Fanatics turns key suppliers and licensors into economic partners, creating
              significant barriers to entry for rival commerce and collectibles operators [CO009].
            calloutType: strength
            claimRefs:
              - CO009
          - type: callout
            title: Unilateral Governance and Dual-Class Control
            body: >-
              Michael Rubin's super-voting stock grants him absolute voting control over strategic direction,
              acquisitions, and public listing timing regardless of outside institutional capital, leaving minority
              shareholders without governance leverage or exit timing guarantees [CO009].
            calloutType: risk
            claimRefs:
              - CO009
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              The commercial sports market has historically operated across silod verticals, separating physical apparel
              retail, trading card collecting, event ticketing, and sports wagering into distinct transactions. Fanatics
              explicitly redefines its addressable boundary as an integrated digital sports platform, encompassing
              licensed consumer merchandise, sports collectibles and memorabilia, sports betting, prediction markets,
              and live collector events. Within this boundary, Fanatics captures primary direct-to-consumer and
              wholesale retail spend across professional and collegiate sports merchandise, exclusive manufacturer
              revenue from physical and digital trading cards, and gaming gross gaming revenue (GGR) across licensed
              state wagering jurisdictions. Conversely, the company's addressable boundary excludes live media broadcast
              rights, direct player contract compensation, stadium infrastructure financing, and general unbranded
              activewear or athletic equipment manufacturing dominated by Nike, Adidas, and Dick's Sporting Goods.
              Status-quo substitutes include local mom-and-pop hobby card shops, third-party secondary marketplaces such
              as eBay, legacy independent sportsbooks like DraftKings and FanDuel, and league venue concessionaires. By
              aggregating exclusive league rights and vertical manufacturing capabilities, Fanatics positions itself to
              convert disparate transactional interactions into recurring customer lifetime value across the broader fan
              economy.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Segment TAMs, and Growth Trajectories
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total addressable market for Fanatics requires segmenting distinct industry sectors rather
              than relying on a single monolithic figure. In sports collectibles, third-party investment analyses such
              as Morgan Stanley estimate the global collectibles sector at approximately $100 billion, driven by surging
              adult investor demand, high-value one-of-one trading cards, and international soccer expansion culminating
              in major tournament licensing like the 2026 and 2031 FIFA World Cup cycles. In licensed merchandise,
              third-party industry forecasts project steady compound annual growth, with Fanatics generating
              approximately $6.2 billion in 2024 merchandise revenue and holding dominant exclusive manufacturing and
              e-commerce agreements with every major North American sports league. The online sports betting and
              prediction market vertical represents an additional multi-billion-dollar TAM, with legal sports betting
              expanding across more than 20 U.S. states covering 95% of the addressable domestic population. Fanatics
              targets $50 billion in long-term annual revenue across its ecosystem, aided by new financial lines such as
              branded credit cards and prediction markets. However, market sizing estimates diverge sharply depending on
              whether analysts view Fanatics as an apparel manufacturer trading at retail multiples or a
              technology-enabled sports ecosystem commanding media and software valuations.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Workflow Dynamics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The addressable buyer base for Fanatics bifurcates into institutional licensing partners and individual
              retail sports consumers. At the institutional tier, primary budget owners and decision-makers are sports
              leagues (NFL, MLB, NBA, NHL, MLS, FIFA) and players associations (NFLPA, MLBPA, NBPA). These licensors
              prioritize guaranteed minimum royalties, equity participation, global brand distribution, and rapid
              fulfillment during championship spikes. For individual consumers, purchasing behavior spans distinct
              cohorts: casual sports apparel buyers making event-driven championship purchases, dedicated hobbyist
              collectors purchasing physical trading card boxes and rare debut patch cards, and active sports bettors
              deploying weekly wagering bankrolls. Fanatics utilizes its proprietary FanGraph first-party data layer,
              which processes more than 2 billion daily fan signals across 100 million identified consumers, to map team
              affiliations, player preferences, and cross-vertical purchase intent. The introduction of the Fanatics ONE
              loyalty system and FanCash rewards provides an integrated adoption mechanism, enabling fans who buy a team
              jersey to seamlessly allocate earned rewards toward collectible cards or sports betting promotions.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Catalysts, Adoption Constraints, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Market expansion for Fanatics is propelled by major structural catalysts, including the commercialization
              of exclusive one-of-one debut patch cards in trading card packs, global football licensing expansion with
              FIFA and UEFA, and the integration of AI-driven personalized product discovery in partnership with Google
              Cloud. However, adoption and valuation face severe structural constraints. Aggressive market consolidation
              has triggered intense antitrust scrutiny, exemplified by ongoing federal antitrust litigation filed by
              rival Panini America alleging illegal monopolization of major professional sports trading card licenses.
              Public policy advocates such as the American Economic Liberties Project have documented sharp collector
              pushback against pack price doubling and diminished product choice. Furthermore, in sports betting,
              Fanatics contends with an entrenched duopoly in DraftKings and FanDuel, which collectively command over
              70% market share and demand substantial promotional spend. For private-market underwriters, critical
              diligence gaps remain regarding segment-specific customer retention rates, repeat wagering frequency, and
              unverified company targets, preserving substantial analytical uncertainty around forward TAM penetration.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Antitrust Scrutiny and Monopoly Backlash in Collectibles
            body: >-
              Fanatics' aggressive acquisition of exclusive rights across MLB, NBA, NFL, and FIFA has prompted an
              ongoing antitrust lawsuit from Panini America and complaints from consumer advocacy groups regarding
              doubled pack prices, threatening regulatory intervention or margin pressure.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
          - type: callout
            title: First-Party Data Moat via FanGraph and 2B Daily Signals
            body: >-
              By capturing over 2 billion daily signals across 100 million sports fans, Fanatics unifies browsing,
              jersey purchases, and betting behavior into FanGraph, enabling algorithmic cross-selling that
              single-vertical sports competitors cannot match.
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Multi-Front Competitive Landscape Across Segments
        blocks:
          - type: paragraph
            body: >-
              Fanatics does not compete against a single comprehensive replica of its conglomerate model. Instead, its
              ecosystem encounters specialized competitors across distinct operating verticals: traditional and
              experiential sporting goods retailers in commerce, incumbent trading card manufacturers in collectibles,
              and entrenched gaming operators in wagering and event contracts. In licensed sports commerce, Fanatics
              operates as a digitally dominated flywheel that manages e-commerce storefronts for leagues and teams while
              controlling physical retail assets like Lids. Conversely, brick-and-mortar incumbents such as Dick's
              Sporting Goods pursue an experiential destination strategy through concepts like House of Sport, seeking
              to anchor customer loyalty in physical retail and local community engagement rather than portable digital
              loyalty points. In collectibles, Fanatics disrupted the legacy status quo by capturing long-term exclusive
              licensing rights with major leagues and player associations, triggering direct antitrust and fraud
              litigation from incumbent manufacturer Panini. Meanwhile, Fanatics Betting and Gaming contends with mature
              operators DraftKings and FanDuel, which command superior live-betting liquidity and broader sports menus.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capabilities, Pricing Dynamics, and Platform Integration
        blocks:
          - type: paragraph
            body: >-
              Across capabilities and pricing, Fanatics relies on its proprietary FanCash ecosystem currency and
              vertical integration to differentiate against entrenched vertical specialists. In sports betting and
              gaming, independent testing indicates that Fanatics runs a standard market vig of approximately 4% to 5%
              on major sports leagues, maintaining softer pricing and more frequent positive-expected-value
              opportunities on alternative spreads and player-prop ladders compared to mature books. However, Fanatics
              remains constrained by a mobile-only architecture with no desktop wagering interface, narrower
              live-betting market depth than market leaders FanDuel and DraftKings, and a tightening limit policy on
              algorithmic wagering accounts. In prediction markets, Fanatics Markets operates as a CFTC-regulated
              introducing broker under a federal derivatives framework powered by Crypto.com Derivatives North America,
              competing against DraftKings Predictions. While Fanatics Markets emphasizes sports-led contract depth and
              a zero-line-item fee model where costs are embedded in spreads, DraftKings leverages a wider
              cross-category user base to deliver tighter order-book spreads and smoother liquidity across political and
              financial event contracts.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP013
      - number: '3.3'
        title: Switching Costs, Distribution Power, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The durability of Fanatics' competitive moat rests on exclusive intellectual property rights and
              cross-vertical customer retention rather than prohibitive structural switching costs. In retail commerce,
              sports apparel buyers face near-zero switching costs between online retailers and sporting goods stores,
              though Fanatics' multi-league exclusive manufacturing and e-commerce agreements create substantial
              supply-side access barriers. To lock in customer relationships across divisions, Fanatics deploys FanCash,
              an integrated rewards currency that can be redeemed across digital storefronts, sports betting bonus
              wagers, event tickets, and collectibles. However, in sports wagering and prediction markets, sports
              bettors and event traders routinely multi-home across multiple regulated applications to exploit signup
              bonuses and line shopping. Furthermore, Fanatics' aggressive expansion into trading cards precipitated
              intense legal counterattacks from Panini, underscoring ongoing regulatory and litigation exposure
              surrounding exclusive licensing arrangements.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP010
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Ecosystem Multi-Homing Limits FanCash Retention Moat
            body: >-
              While FanCash offers genuine cash-equivalent merchandise value for frequent sports apparel buyers, it does
              not prevent sports bettors or event contract traders from multi-homing across competing platforms like
              DraftKings and FanDuel to secure sharper live odds and higher market liquidity.
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: A broad monetization surface, not a single economic model
        blocks:
          - type: paragraph
            body: >-
              Fanatics describes a platform spanning commerce, collectibles, betting and gaming, events, prediction
              markets, advertising, credit-card initiatives, and studios. The economic mechanisms differ materially:
              merchandise combines manufacturing, wholesale, direct retail, and operated partner storefronts;
              collectibles monetize physical and digital products; gaming depends on wager volume and hold; and
              advertising sells access to the fan audience. Sacra further describes direct-to-consumer sales, wholesale
              licensing and manufacturing, and team or league online-store operation. This breadth creates cross-sell
              potential, but it also means consolidated revenue cannot be evaluated with one SaaS-style unit-economics
              framework. Each segment needs its own revenue-recognition, gross-margin, working-capital, and
              customer-acquisition bridge.
            claimRefs:
              - CI001
              - CI002
              - CI003
