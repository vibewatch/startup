              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Panini Antitrust Lawsuit and Collectibles Market Foreclosure
            body: >-
              The federal antitrust battle with Panini threatens the durability of Fanatics' trading card monopoly. An
              adverse legal judgment could result in treble damages, compulsory cross-licensing of player association
              rights, or forced contract restructuring across major professional sports leagues.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Compulsive Gambling Scrutiny and Emerging Mass Tort Exposure
            body: >-
              As online sports wagering expands nationwide, legal investigations into betting addiction, algorithmic
              promotional targeting, and platform guardrails introduce material litigation exposure and could prompt
              state regulatory bodies to impose tighter deposit and marketing restrictions.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Decision Logic
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and an unsupported-to-stretched
              valuation stance at the $31 billion headline mark. The positive case begins with Fanatics'
              company-reported reach across six sports businesses, more than 100 million fans, over 900 sports
              properties, and more than 22,000 employees. That scale may create cross-sell and rights advantages, but it
              does not establish consolidated profitability or a defensible entry price. The valuation record instead
              contains a live conflict: Forge still displays a $31 billion post-money mark, while Tracxn reports $22
              billion as of January 1, 2026. Those marks are vendor observations with different methodologies, not proof
              of a current arm's-length financing price. Investment approval should therefore remain conditional on
              audited segment results, an exact security price, and a complete capitalization waterfall.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The last broadly corroborated primary financing was approximately $700 million in December 2022 at a $31
              billion post-money valuation. The company-hosted Wall Street Journal excerpt says that capital was common
              stock reserved for strategic M&A rather than day-to-day operations, so the raise should not be treated as
              evidence of cash burn, runway, or present liquidity. Multiples.vc pairs that mark with $3.5 billion of
              recorded December 2022 revenue and an 8.9x revenue multiple, but the source describes the revenue as the
              value recorded alongside the round; it is not current revenue, ARR, audited segment revenue, or a current
              multiple. Its apparel references of roughly 1.1x to 2.0x revenue and the 3.9x private Gymshark reference
              are directional commerce context only, not independent like-for-like benchmarks for Fanatics' mixed
              commerce, collectibles, and wagering portfolio.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Thesis, Anti-Thesis, and Downside Evidence
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a scaled, multi-business sports platform can compound the value of league relationships
              and fan engagement across commerce, collectibles, betting, events, markets, and media. The anti-thesis is
              that public evidence does not show which segments earn attractive margins, how much capital newer
              activities require, or whether the businesses deserve one platform multiple. The 2023 Panini litigation
              also shows that valuable trading-card rights can produce material legal and competitive conflict.
              Cumulative-funding databases disagree as well: Multiples.vc reports $4.8 billion across nine rounds,
              whereas Tracxn and Forge report $4.85 billion across ten and $4.9 billion across eleven, respectively.
              These differences are not cash-available measures, but they reinforce the need to reconcile the financing
              history and fully diluted ownership before relying on historical funding totals in return analysis.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
      - number: '8.4'
        title: Scenario Boundaries, Exit Readiness, and Diligence
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports scenario boundaries rather than a precise valuation model. A bull case can
              preserve the $31 billion marker only if current audited results demonstrate profitable growth across the
              portfolio and clarify that newer segments create rather than consume value. A base case requires a
              material discount to the stale primary mark until the $22 billion versus $31 billion conflict is
              reconciled and security terms are known. A bear case is materially below $22 billion if segment losses,
              rights disputes, or multiple compression dominate. Neither target returns nor a hold period can be
              calculated responsibly without the entry security, dilution, debt, cash, and preference waterfall. Forge
              says Fanatics has not set an IPO date, and its latest-round rows do not disclose liquidation preference
              order or multiplier. Management materials, audited statements, charter documents, and evidence of
              executable liquidity are final diligence requirements, not optional refinements.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price and security terms are gating evidence
            body: >-
              Treat $31 billion as a historical financing marker, not a current valuation conclusion. A defensible
              decision requires the offered security price, fully diluted ownership, preference waterfall, current
              audited segment economics, and a credible liquidity path.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV014
              - CV015
              - CV016
