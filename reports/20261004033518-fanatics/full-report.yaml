      - number: '5.3'
        title: Operational Moats, Supply Chain Modernization, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Fanatics maintains a defensible technical and operational moat rooted in its vertically integrated
              manufacturing model, direct automated linkages with league rights holders, and exclusive multi-decade
              licensing rights. In trading card production, the acquisition of Topps prompted the development of the
              'New Card Factory' (NCF) digital operating system, an internal enterprise platform that replaced
              fragmented legacy spreadsheets and twenty-year-old proprietary tools with a governed single system of
              record. NCF integrates creative design, editorial metadata, inventory management, and physical printing
              plate constraints ('Alchemy' print sheet layouts), targeting a compression of production cycle timelines
              from 12 to 18 months down to 6 months while lowering quality assurance defect rates from 20% to below 5%.
              However, this technical complexity introduces substantial operating friction and systemic architectural
              risks. In supply chain technology, Fanatics Commerce is executing a complex transition from legacy ERP
              platforms (Oracle, Microsoft Dynamics 365, SAP) toward composable microservices architectures, exposing
              order management and inventory sync to potential data drift and fulfillment lag during peak retail surges.
              In betting and gaming, where Fanatics Sportsbook reaches approximately 95% of the addressable U.S. online
              sports wagering market across 24 states and online casinos in 4 states, engineering teams must maintain
              custom compliance rules, geofencing barriers, and responsible gaming transaction limits tailored to each
              jurisdiction. Furthermore, Fanatics faces external legal pressure over its vertical integration: rival
              manufacturer Panini filed antitrust litigation challenging Fanatics' exclusive licensing acquisitions
              across the NFL, NBA, and MLB, while Fanatics countersued alleging fraud, highlighting that the company's
              product software backbone remains tightly coupled to legal monopolies over exclusive sports licensing
              rights.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration and Scalable Cloud Elasticity
            body: >-
              By migrating legacy on-premises storefronts to the AWS Cloud Commerce Platform and developing proprietary
              prepress manufacturing software like New Card Factory, Fanatics pairs internet-scale cloud elasticity with
              direct control over physical apparel and collectibles production.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
              - CE012
          - type: callout
            title: ERP Modernization Overhead and Licensing Litigation Coupling
            body: >-
              Fanatics remains burdened by legacy ERP migration debt across supply chain operations, while its
              commercial software dominance remains vulnerable to antitrust challenges from displaced competitors like
              Panini regarding exclusive sports league licensing rights.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer-Payer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Fanatics operates a multifaceted sports ecosystem with distinct customer segments spanning retail consumer
              fan merchandise buyers, high-intent sports bettors, collectibles marketplace hobbyists, and enterprise
              league partners [CU001, CU002]. At the top of the consumer funnel sits Fanatics Commerce, which captures
              sports fans purchasing licensed jerseys, headwear, and lifestyle apparel across digital league storefronts
              and more than 2,000 retail locations [CU001, CU005]. Fanatics Betting & Gaming targets adult wagering
              consumers across online sportsbooks, iGaming casino platforms, and physical venue sportsbooks, leaning on
              cross-sell from its commerce customer database rather than heavy external ad blitzes [CU003, CU008].
              Collectibles buyers and live-breaking participants engage via Topps.com, Fanatics Collect, and Fanatics
              Live, where commercial account managers actively curate relationships with top-tier sellers and hobby
              collectors [CU004, CU009]. Meanwhile, B2B wholesale and enterprise licensing counterparties, such as
              Abercrombie & Fitch and major sports properties, depend on Fanatics as a central e-commerce and retail
              distribution partner [CU001, CU010]. Diligence notes that despite expansive reach, public visibility into
              standalone segment economics, user ARPU, and cross-segment conversion efficiency remains strictly limited
              [CU011].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
