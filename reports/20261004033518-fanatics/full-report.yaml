  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Ecosystem, Multi-Vertical Workflows, and User Experience
        blocks:
          - type: paragraph
            body: >-
              Fanatics delivers a unified sports fan ecosystem that spans licensed merchandise e-commerce, sports
              collectibles manufacturing, real-money wagering, prediction markets, live events, and media content. The
              fan journey begins across digital surfaces, where the company operates flagship web properties such as
              Fanatics.com alongside more than 900 official e-commerce sites for major professional leagues, collegiate
              athletic departments, and global football clubs. Across these touchpoints, consumer workflows center on
              discovery, personalization, checkout, and loyalty tracking. To streamline this experience, Fanatics is
              developing a universal mobile application known as FanApp, designed to unite merchandising, product
              discovery, personalization algorithms, and loyalty rewards into a single client journey. Beyond standard
              direct-to-consumer apparel purchasing, Fanatics provides specialized workflows across distinct business
              units: in collectibles, collectors purchase sealed wax hobby boxes, submit cards for grading or digital
              vaulting, and track real-time marketplace values; in betting and gaming, sports bettors navigate real-time
              odds feeds, construct multi-leg parlays via Bet Builder interfaces, and place live in-play wagers; and in
              retail, consumers interact with point-of-sale systems across more than 2,000 brick-and-mortar storefronts,
              including Lids locations and stadium team stores. Cross-vertical engagement is incentivized by Fanatics
              ONE, a unified loyalty framework that allows fans to earn rewards on merchandise purchases and deploy
              promotional credit across gaming and collectibles surfaces. However, because each vertical operates under
              distinct regulatory, operational, and fulfillment constraints, unifying these divergent workflows into a
              single cohesive interface requires continuous coordination across distributed engineering teams.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
              - CE010
              - CE012
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.2'
        title: System Architecture, Cloud Infrastructure, and Domain Engineering
        blocks:
          - type: paragraph
            body: >-
              The underlying technology architecture of Fanatics is structured around autonomous domain microservices
              deployed in public cloud infrastructure, primarily Amazon Web Services (AWS). Historically dependent on an
              on-premises monolithic infrastructure subject to hurricane disruptions in Florida data centers and severe
              concurrency bottlenecks during championship 'hot market' flash sales, Fanatics executed a multi-year
              migration to its AWS Cloud Commerce Platform (CCP). CCP decomposes core commerce operations into three
              primary domain services: Product Finding (entity recognition, product scoring, search indexing), Cart &
              Checkout (low-latency order capture, tokenized payment workflows, and 3D-Secure compliance), and Accounts
              Management (identity, profile configuration, and regional localization). The engineering organization
              operates as a polyglot technical environment: while core backend services leverage Go, Java, TypeScript,
              and Python with gRPC communication protocols, edge frontends and mobile layers deploy React, Kotlin
              Multiplatform, and Swift. Data persistence is distributed across relational engines including MySQL and
              PostgreSQL, high-throughput key-value caches like Redis, and document stores including Cassandra and
              DynamoDB. In its Betting and Gaming division, where platform requirements demand sub-second latency and
              fault tolerance, the technical architecture relies on distributed event-driven message streaming,
              Kubernetes pod orchestration, and WebSocket gateways capable of sustaining over 100,000 concurrent socket
              connections during peak live wagering windows. In supply chain and manufacturing, enterprise integration
              platforms manage bidirectional electronic data interchange (EDI) transactions (including ANSI X12 850
              purchase orders, 856 advance shipping notices, and 940 warehouse shipping orders) and REST APIs connecting
              third-party logistics providers (3PLs) and owned print-on-demand fulfillment centers.
            claimRefs:
              - CE006
              - CE007
