  - id: TV003
    title: Thesis / Anti-Thesis and View-Changing Evidence
    columns:
      - Side
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - - Thesis
        - Multi-business sports reach could support cross-sell and durable rights advantages.
        - Company reports six core businesses, 100M+ fans, 900+ sports properties, and 22,000+ employees.
        - Audited cohorts and segment contribution margins showing value creation across the ecosystem.
      - - Thesis
        - Strategic league participation may align rights holders with long-term platform outcomes.
        - The NFL led a $1.5B round at a $27B valuation, with other leagues and players' organizations participating.
        - Current rights duration, minimum guarantees, dilution, and renewal economics.
      - - Anti-thesis
        - The last primary mark and current vendor marks do not establish today's clearing value.
        - Public references conflict between $22B and $31B, while the $31B revenue basis is historical.
        - A recent arm's-length financing or verified secondary transaction with complete security terms.
      - - Anti-thesis
        - Rights concentration can create legal and competitive downside.
        - WSJ reported dueling Panini and Fanatics lawsuits after Fanatics' trading-card rights expansion.
        - Final case outcomes, settlement economics, and evidence that key rights remain durable.
    notes: >-
      Company-reported scale is not treated as independently verified; league financing and litigation are historical
      evidence, and all view-changing items require current primary diligence.
    claimRefs:
      - CV008
