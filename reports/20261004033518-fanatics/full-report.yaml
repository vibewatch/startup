      - number: '4.3'
        title: Distribution reach is a useful proxy, but not a CAC or margin disclosure
        blocks:
          - type: paragraph
            body: >-
              Fanatics reports more than 100 million reachable fans, over 900 sports-property partnerships, and more
              than 2,000 retail locations. Those figures indicate unusually broad owned and partner distribution, while
              Sacra reports more than 40 million annual e-commerce transactions and 25 million Lids transactions. Public
              evidence also points to materially different economics across segments: Sacra estimates partner revenue
              sharing of 6% to 8% of retail sales and says Collectibles exceeds a 20% EBITDA margin. However, list
              prices, realized discounts, betting promotional spend, hold, returns, fulfillment costs, CAC, repeat
              behavior, and payback are not disclosed. Reach therefore remains a GTM proxy rather than proof of
              efficient acquisition or durable contribution margin.
            claimRefs:
              - CI003
              - CI009
