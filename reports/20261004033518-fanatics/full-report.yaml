      - number: '1.2'
        title: Executive Leadership, Governance, and Control Structure
        blocks:
          - type: paragraph
            body: >-
              Corporate control is concentrated in founder, chairman, and chief executive officer Michael Rubin, who
              holds his equity position via private holding company Kynetic [CO007, CO009]. Although outside financial
              sponsors and strategic sports partners collectively hold the majority of outstanding equity, Rubin
              maintains voting control through super-voting common stock [CO009]. The executive management bench
              includes Glenn H. Schiffman as chief financial officer, Tucker Kain as chief strategy and growth officer,
              Andrew Low Ah Kee leading Fanatics Commerce, and Matt King directing Fanatics Betting & Gaming [CO007,
              CO008]. Strategic sports entities—including the NFL, MLB, NHL, MLS, and major players
              associations—collectively hold approximately 10% of equity, aligning key licensors directly with platform
              economics [CO009]. Despite this seasoned executive roster, key-person risk remains concentrated in Rubin,
              and the company has neither filed an S-1 registration statement nor established a publicly disclosed
              independent board committee structure [CO009, CO014].
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capitalization, Legal Exposure, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Fanatics has secured approximately $4.9 billion in cumulative equity and debt financing across ten
              disclosed rounds since 2012, culminating in a $700 million round in December 2022 that priced the business
              at a $31 billion valuation led by Clearlake Capital [CO010, CO011]. Prior valuation marks rose rapidly
              from $4.5 billion in 2017 to $18 billion in 2021 and $27 billion in March 2022, with participation from
              institutional backers including Silver Lake, SoftBank Vision Fund, Fidelity, and BlackRock [CO010, CO011].
              Rapid expansion into high-margin collectibles and wagering generated material antitrust and commercial
              friction, exemplified by dueling federal lawsuits with trading-card rival Panini following Fanatics'
              exclusive long-term rights acquisitions with MLB, NFLPA, and NBA [CO012]. The company continues aggressive
              organic product rollouts, including launching Fanatics Studios in January 2026, the unified Fanatics
              Sports & Casino betting and trading application in September 2026, and multi-year collectibles
              partnerships with UEFA and FIFA [CO008, CO013, CO015]. Nevertheless, secondary market marks have
              fluctuated between $25 billion and $33.5 billion, and absolute valuation marks lack public price discovery
              [CO009, CO016].
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
              - CO016
