chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Platform Evolution
        blocks:
          - type: paragraph
            body: >-
              Fanatics operates as a private global sports platform with dual corporate headquarters in New York, New
              York, and Jacksonville, Florida, operating under the formal entity Fanatics Holdings, Inc. [CO001]. The
              enterprise traces its corporate origins to 2011, when Michael Rubin reacquired the sports merchandise
              e-commerce assets following eBay's $2.4 billion acquisition of GSI Commerce, while earlier operational
              roots date back to Football Fanatics in 1995 and league e-commerce contracts established in 2002 [CO002,
              CO003]. The business has transitioned from a pure licensed apparel distributor into a multi-division
              sports ecosystem spanning Fanatics Commerce, Fanatics Collectibles, Fanatics Betting & Gaming, Fanatics
              Events, Fanatics Markets, and Fanatics Studios [CO004, CO008]. Platform scale encompasses over 100 million
              reachable fans globally, partnerships with more than 900 sports properties, relationships with over 6,000
              athletes, and a workforce exceeding 22,000 employees across more than 80 locations [CO005, CO006].
              However, public visibility into standalone segment revenues, unit margins, and consolidated operating
              profitability remains limited because Fanatics operates as an unlisted private entity without SEC
              reporting obligations [CO014].
