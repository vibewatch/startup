  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    summary: 决策推演始于公司披露的业务体量，历经相互矛盾的估值证据与非公开信息缺口，最终落脚于“继续研究”的审慎立场。
    data:
      nodes:
        - id: scale
          label: 具备规模效应的体育平台
          detail: 据公司披露，旗下拥有六大核心业务板块、100M+ 球迷、900+ 体育赛事合作资源及 22,000+ 名员工。
        - id: primary-mark
          label: 历史一级市场融资定价
          detail: 2022 年 12 月该轮融资筹得约 $700M，投后估值达 $31B。
        - id: mark-conflict
          label: 当前公开估值标杆分歧
          detail: 截至 2026 年 1 月，Tracxn 记录的估值为 $22B，而 Forge 则持续显示为 $31B。
        - id: stale-multiple
          label: 估值倍数依据滞后
          detail: 公开发布的 8.9x 估值倍数，采用的是 2022 年 12 月融资时记录的 $3.5B 收入基准。
        - id: private-gaps
          label: 未定价的非公开信息缺口
          detail: 当前各分部财务表现、流动性、股权稀释、负债情况及最新一轮优先股条款均未公开。
        - id: decision
          label: 继续研究
          detail: 在将预期回报计入投资判断前，需具备经审计的分部业绩、明确交易条款以及切实可行的退出路径。
    approximationNotes: 按逻辑递进的定性决策链路；节点顺序反映分析逻辑，不代表数值加权或转化率关系。
