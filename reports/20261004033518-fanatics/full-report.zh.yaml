            title: 电商向博彩转化的交叉销售引擎
            body: >-
              Fanatics 在体育博彩领域的核心获客壁垒，源于其现有的超过 95 million 电商客户数据库；相较于 DraftKings 与 FanDuel 巨额的外部获客买量投入，该资产提供了极低成本的分销渠道
              [CU003, CU008]。
