  - id: FE001
    title: Fanatics 多层平台与技术栈架构
    type: stack
    summary: 拆解 Fanatics 数字化平台架构，涵盖客户端体验、核心电商域、实时博彩服务与企业级供应链各层。
    data:
      layers:
        - label: 客户端与展示层
          detail: 全渠道触点，包括 Fanatics.com、900+ 联盟线上商城、iOS/Android 原生 FanApp、Lids 零售 POS 以及球场内的自助售卖终端。
        - label: 核心电商平台（AWS CCP）
          detail: 微服务架构，拆分为商品检索、购物车与结算（纳入令牌化 PCI 范围）以及支持区域本地化的账户管理。
        - label: 实时投注与博彩引擎
          detail: 分布式 WebSocket 流式基础设施，支持 100K+ 并发连接、Bet Builder 计算引擎以及跨州地理围栏。
        - label: 收藏品制造（NCF）
          detail: New Card Factory Product Builder 统筹 Topps 创意设计、编辑元数据、库存管理与印刷拼版排版。
        - label: 供应链与集成网络
          detail: 混合 API 与 EDI 网关，处理 ANSI X12 850/856/940 事务集，连接 ERP 骨干系统、自有仓储设施与第三方物流服务商。
        - label: 云基础设施与持久化层
          detail: AWS 多可用区底座、Kubernetes 容器编排、Redis 低延迟缓存，以及分布式关系型与 NoSQL 数据库（MySQL、Postgres、Cassandra）。
    approximationNotes: 平台架构参考公开披露的工程设计方案、技术博客文章以及在招基础设施岗位的职位要求。
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE009
      - CE011
      - CE012
      - CE014
  - id: FU001
    title: Fanatics 跨平台用户互动与业务拓展路径
    type: journey-map
    summary: 全景梳理球迷从初次触达、电商交易、会员积分注册，到博彩与收藏品板块跨业务延伸的全过程。
    data:
      items:
        - label: 漏斗顶端触达
          description: 赛季期间，球迷在球队官方网店、联盟跳转链接或球场实体零售店初次建立触点。
          touchpoints:
            - 联盟官方网站（NFLShop.com、MLBShop.com）
            - 球场内球队实体零售店
            - 社交媒体拆卡与直播营销
        - label: 电商交易转化
          description: 消费者在移动端优先商城购买正版授权服饰或装备，平台顺势沉淀账户信息。
          touchpoints:
            - 移动端响应式网页与 Fanatics 原生 App
            - 移动端流量占比超 70%，在售商品超 2M+ SKU
            - 集成会话追踪的数字支付结算
        - label: 会员积分整合（Fanatics ONE）
          description: 球迷加入 Fanatics ONE 会员生态，购买周边商品即可赚取 FanCash 积分奖励。
          touchpoints:
            - 注册 Fanatics ONE 奖励计划
            - FanCash 账户实时积分累计
            - 定向短信与邮件营销推送
        - label: 跨业务板块交叉销售
          description: 平台将用户交叉导流至 Fanatics Sportsbook 体育博彩、Topps 收藏品或预测市场业务。
          touchpoints:
            - Fanatics Sportsbook & Casino 促销优惠活动
            - Fanatics Live 拆卡专场与 Topps.com 新品发售
            - FanCash 积分在博彩投注与球星卡之间通用兑换
        - label: 业务韧性与留存循环
          description: 夺冠节点带来的爆发性需求、拆卡参与度以及职业体育赛季排期共同带动持续复购。
          touchpoints:
            - 季后赛夺冠纪念服饰发售
            - Instant Rips 收藏品即时拆卡直播
            - 在单一 App 内保持跨板块持续互动
        - label: 平台认同与社区生态
          description: 高黏性球迷与卡友转化为活跃社区成员，深度融入直播拆卡与球场线下体验。
          touchpoints:
            - 球场现场活动与 Super Bowl 快闪店
            - 直播购物社区拆卡聊天室
            - 卡友论坛以及拆出稀有卡（hits）的社交分享
    approximationNotes: 用户旅程各阶段展示了 Fanatics 自述的交叉销售模式；电商与博彩业务之间的转化率目前未见公开披露量化数据。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU007
      - CU008
      - CU009
      - CU010
