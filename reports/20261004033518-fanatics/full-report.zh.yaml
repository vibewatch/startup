      - number: '1.3'
        title: 资本历程、法律诉讼与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              自 2012 年以来，Fanatics 在 10 轮已公开的股债融资中累计筹集约 $4.9 billion，并在 2022 年 12 月由 Clearlake Capital 领投的融资中达到顶峰，该轮融资规模为
              $700 million，对应估值达 $31 billion [CO010, CO011]。此前公司估值快速攀升，从 2017 年的 $4.5 billion 跃升至 2021 年的 $18 billion 及
              2022 年 3 月的 $27 billion，吸引了 Silver Lake、SoftBank Vision Fund、Fidelity 和 BlackRock 等机构注资 [CO010,
              CO011]。向高毛利收藏品与博彩赛道的激进扩张引发了实质性反垄断与商业摩擦：在 Fanatics 拿下 MLB、NFLPA 及 NBA 的长期独家权益后，与球星卡老牌对手 Panini
              爆发了互诉联邦法院的诉讼纠纷 [CO012]。公司仍在积极推进自研产品落地，包括 2026 年 1 月成立 Fanatics Studios、2026 年 9 月上线整合型博彩与交易应用 Fanatics
              Sports & Casino，并与 UEFA 和 FIFA 达成多年期收藏品合作 [CO008, CO013, CO015]。即便如此，老股市场估值仍在 $25 billion 至 $33.5 billion
              之间波动，绝对估值点缺乏公开价格发现 [CO009, CO016]。
