  - id: FI001
    title: 收入至现金转换尽调桥接图
    type: flow
    summary: 球迷触达带动了多重变现引擎，但公开证据止步于经对账的毛利与现金转换测算。
    data:
      nodes:
        - id: audience
          label: 可触达球迷群体
          value: 100M+
          unit: fans
          detail: 公司自述触达规模；并非活跃客户或留存客群统计口径。
        - id: distribution
          label: 分销零售网络
          value: 900+ properties / 2,000+ locations
          detail: 公司披露的合作方及线下零售门店网络。
        - id: commerce
