            body: >-
              Fanatics 运营着庞杂的体育生态，客群清晰分层为：购买周边服饰的零售球迷、高意向博彩玩家、收藏品市场藏家以及企业级体育联盟伙伴 [CU001, CU002]。在 C 端漏斗顶端，Fanatics
