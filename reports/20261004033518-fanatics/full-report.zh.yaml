      - number: '7.3'
        title: 伙伴集中度、财务架构与执行依赖
        blocks:
          - type: paragraph
            body: >-
              Fanatics 的底层商业模式重度依附于同各大体育联盟、球员工会、大学院校及国际体育组织签订的长期授权协议。一旦失去与 NFL、MLB 或 NBA
              等核心伙伴的独家授权，或面临不续约及重大条款重订，将直接威胁服饰与收藏品业务的生命线。在体育博彩端，公司的持续运转依赖各州监管机构、官方体育数据服务商以及支付处理机构。财务上，尽管 Fanatics 于 2022
              年 12 月完成 $700 million 股权融资、将估值推升至 $31
              billion，但公司从未公开披露过资产负债表、烧钱速度或分部层面的盈利状况。规模化扩张重资产博彩业务与承担多年期保底授权费用，对现金管理与债务治理提出了极高要求。此外，随着公司整合跨赛道业务——将体育博彩、赌场及预测市场与核心周边商品揉为一体——全盘战略与技术落地的复杂性在超过
              22,000 名全球员工协同中进一步加剧，执行风险依然居高不下。
