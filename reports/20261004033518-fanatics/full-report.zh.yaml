      - number: '6.4'
        title: 客户留存持久度、隐私合规摩擦与交易对手集中度
        blocks:
          - type: paragraph
            body: >-
              尽管体量庞大，Fanatics 依然面临高度集中的商业依赖、渠道摩擦与客户信任挑战 [CU001,
              CU014]。公司重度依赖与主流联盟及球员工会（NFL、MLB、NBA）的独家授权协议，交易对手集中度极高，任何授权纠纷都会威胁周边供货并动摇球迷信任 [CU001, CU014]。在体育收藏品赛道，与
              Panini 相互提起的反垄断诉讼凸显出激进绑定长期权益的法律脆弱性 [CU014]。与此同时，消费者隐私与追踪政策披露，公司广泛运用会话回放工具、短信弃单挽留机制，并在 Fanatics
              关联公司群与商业数据合作伙伴之间共享用户数据，在全美多地面临趋严的监管合规风险 [CU015]。在博彩与预测市场领域，对 Water Street Labs 和 CX Clearinghouse
              的收购标志着其从零售中间商向受 CFTC 监管的联邦交易所艰难转型，客户开户入金面临严格的联邦合规审核 [CU002,
              CU016]。在缺乏经核实的客户流失率或队列续约率披露的情况下，长期客户生命周期的持久度依然是尽调的核心不确定性所在 [CU011, CU012]。
