            title: 收藏品业务反垄断审查与垄断反弹
            body: >-
              Fanatics 大举扫货拿下 MLB、NBA、NFL 和 FIFA 的独家权益，直接招致 Panini America
              提起反垄断诉讼，消费者权益组织亦就卡包价格翻倍提出抗议，令公司面临监管干预与利润率承压的潜在威胁。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
          - type: callout
            title: 基于 FanGraph 与每日 2B 行为信号的第一方数据壁垒
            body: 通过捕获 100 million 体育迷每日超过 2 billion 条行为信号，Fanatics 将浏览记录、球衣购买与投注行为统一汇入 FanGraph，实现了单一赛道体育竞争对手难以企及的算法交叉销售能力。
            calloutType: insight
