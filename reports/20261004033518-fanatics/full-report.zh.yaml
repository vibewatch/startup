      - number: '2.3'
        title: 买方客群划分、业务流动态与预算归属
        blocks:
          - type: paragraph
            body: >-
              Fanatics
              的目标买方群体分为机构授权合作伙伴与个人零售体育消费者。在机构端，核心预算掌握者与决策者是各体育联盟（NFL、MLB、NBA、NHL、MLS、FIFA）与球员工会（NFLPA、MLBPA、NBPA）。这些授权方最看重最低保底分成、股权参与、全球品牌分销，以及夺冠节点流量洪峰下的快速履约能力。面向个人消费者时，购买行为呈现出鲜明的人群分层：受夺冠事件驱动购买运动服饰的普通球迷、购买实体球星卡原盒及稀有首秀布标卡（debut
              patch cards）的硬核藏家，以及每周投入固定注额的活跃博彩玩家。Fanatics 运用其专有的 FanGraph 第一方数据层，对 100 million 已识别消费者每日超过 2 billion
              条球迷行为信号进行处理，精准描摹主队归属、球员偏好及跨品类购买意向。Fanatics ONE 会员体系与 FanCash
              积分机制的推出，搭建起统一的跨业务留存链路，让购买球队球衣的球迷能够顺畅将所获奖励用于兑换收藏卡或体育博彩优惠。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
