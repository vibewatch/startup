  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险环境
        blocks:
          - type: paragraph
            body: >-
              Fanatics
              运转于高监管且法律争议密集的商业领域。在博彩与游戏业务中，公司在田纳西州《体育博彩法》等各州级监管框架下，于多个行政管辖区提供真金在线体育博彩、在线赌场及预测市场服务。此类业务需要持续获取监管牌照，执行严格的反洗钱（AML）内控（包括大额交易报告和可疑交易报告），并落实强制性自我排除等合规机制。随着移动体育博彩的爆发式增长，围绕嗜赌成瘾与平台风控防线的消费者保护审查、产品责任调查及原告诉讼接踵而至。在收藏品领域，Fanatics
              火速垄断 NBA、MLB 及 NFL 球员工会的长期独家权益，直接引爆老牌厂商 Panini
              的高规格反垄断诉讼，双方在联邦法院展开互诉，指控对方排他性封锁市场及欺诈。此外，企业整体架构还必须应对全球贸易管制、900
              多个合作品牌的知识产权保护，以及涉及数以百万计用户账户的隐私合规要求。这些法律风险要求持续关注各州体育博彩委员会的动态、联邦法院的反垄断案卷以及隐私执法行动。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
