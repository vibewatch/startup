              Fanatics 披露其覆盖超过 100 million 名可触达球迷、900 多个体育机构合作伙伴以及 2,000 多处零售网点。这些数据体现出自有与合作分销渠道极其宽广；Sacra 另报道称其每年产生超过
              40 million 笔电商交易与 25 million 笔 Lids 线下交易。公开证据亦表明各分部的经济模型大相径庭：Sacra 测算合作伙伴分润占零售额的 6% 至 8%，并指出 Collectibles
              的 EBITDA 利润率超过
