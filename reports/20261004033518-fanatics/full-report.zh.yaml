            title: 未经验证的持久度与客户分群经济模型
            body: >-
              尽管 Fanatics 宣称拥有 100M+ 可触达球迷，但由于缺乏公开的队列留存数据、净留存率（NRR）指标或客户流失披露，究竟有多少用户能在单次夺冠热潮之外产生持续交易，仍有待打上问号 [CU011,
              CU012]。
            calloutType: risk
