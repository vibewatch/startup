      - number: '8.3'
        title: 投资逻辑、反向逻辑与下行证据
        blocks:
          - type: paragraph
            body: >-
              正方逻辑在于：跨业务的规模化体育平台，能将联盟合作关系与球迷黏性，在电商、收藏品、博彩、赛事、预测市场及媒体间持续复利放大。反方逻辑则指出：公开证据并未表明哪些板块能实现可观利润率、新兴业务需要耗费多少资本，各业务是否配得上统一的平台估值倍数也缺乏支撑。2023
              年 Panini 诉讼案亦表明，高价值球星卡版权容易引发重大法律纠纷与竞争冲突。累计融资数据库统计口径同样分歧明显：Multiples.vc 记录 9 轮累计 $4.8 billion；Tracxn 与
              Forge 则分别记录 10 轮 $4.85 billion 和 11 轮 $4.9
              billion。上述分歧虽非衡量账面可用现金的指标，但更印证了一点：在将历史融资总额用于回报分析前，必须理清融资历史并核实完全稀释后的股权结构。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
      - number: '8.4'
        title: 情景边界、退出成熟度与尽调要点
        blocks:
          - type: paragraph
            body: >-
              公开证据仅支持划定情景边界，不足以支撑精细的估值模型。乐观情景下，只有当前经审计业绩证明各业务组合实现盈利性增长，且新兴板块在创造价值而非消耗价值，$31 billion 估值锚点才得以维系。基准情景下，在
              $22 billion 与 $31 billion 的估值分歧得以化解且证券条款明确前，必须对过时的一级市场估值给予大幅折价。悲观情景下，若业务亏损、版权争端或估值倍数压缩成为主导因素，估值将大幅低于 $22
              billion。若未掌握入场证券类型、稀释情况、负债、现金及清算优先权分配瀑布，便无法审慎测算目标回报率与持有期限。Forge 称 Fanatics 尚未确定 IPO
              日期，且其最新一轮数据未披露清算优先权顺序或倍数。管理层资料、经审计报表、公司章程文件以及可执行流动性证明，属于尽调的终局必要前提，而非可选补充。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 附表与图表
        blocks:
          - type: callout
            title: 定价与证券条款构成核心门槛证据
            body: 应将 $31 billion 视为历史融资锚点，而非当前的估值结论。审慎的投资决策必须基于拟认购证券价格、完全稀释后持股比例、清算优先权瀑布、当前经审计的各板块财务数据，以及可信的流动性退出路径。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV014
              - CV015
              - CV016
