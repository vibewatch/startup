      - number: '2.2'
        title: 市场规模测算、分部 TAM 与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              评估 Fanatics 的总可用市场（TAM）必须拆解各细分赛道，而非依赖单一笼统数值。在体育收藏品领域，摩根士丹利等第三方投行分析预计全球收藏品市场规模约为 $100
              billion，主要受成年投资者需求激增、高价值独家单张（1-of-1）球星卡热度，以及围绕 2026 年和 2031 年 FIFA
              世界杯周期等大赛授权的国际足球扩张驱动。在特许周边领域，第三方行业预测显示该赛道保持稳健复合年增长，Fanatics 在 2024 年实现约 $6.2 billion
              周边收入，并握有北美各大主流职业联盟的主导性独家制造与电商协议。在线体育博彩与预测市场业务带来了数以十亿美元计的额外 TAM，合法体育博彩已扩展至美国 20 多个州，覆盖 95%
              的目标国内人口。在联名信用卡与预测市场等新金融业务助力下，Fanatics 锚定整个生态的长期年收入目标为 $50 billion。然而，市场测算分歧巨大，核心在于分析师究竟是将 Fanatics
              视为按零售估值倍数定价的服饰制造商，还是具备媒体与软件估值溢价的科技赋能体育生态。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
