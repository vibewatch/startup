        - 业务组合整体经审计实现盈利性增长；新业务板块创造增量价值；优先股堆叠清晰。
        - $31B 仅为待验证的市场标记而非业绩预测；在缺乏价格与证券条款前提下，无法推导任何目标回报。
        - 在获得经审计凭据前概率较低
        - 分部业绩尚未显现出平台溢价。
        - 出现任何证明新业务板块在结构上持续失血或侵蚀成熟电商业务利润的证据。
      - - 基准
        - 规模优势得以维持，但各分部质量与当前资金需求仍部分不透明。
        - 相对悬而未决的 $22B-$31B 公开标记需要实质性折价；公开证据无法支撑精确区间。
        - 与当前公开证据最为吻合
        - 收入基准滞后、估值标记冲突、股权稀释以及优先股条款不明确。
        - 交易报价直接锚定 $31B 估值标记，却缺乏当前经审计数据支持。
      - - 悲观
        - 分部财务表现疲软、版权纠纷或估值倍数压缩压垮了平台规模效应。
        - 实质性低于 $22B；下行底线无法仅凭公开证据进行量化。
        - 具备合理性且缺乏足够的下行边界保护
        - 法律纠纷、流动性匮乏、不利的高级债权求偿主张以及投资组合亏损。
        - 尽调查出持续性亏损、重大高级索赔悬顶，或缺乏可信的退出通道。
    notes: 情景边界仅采用所引述的 $22B 与 $31B 第三方估值标记及历史收入参考；未主观捏造任何企业价值、股权桥接、发生概率或回报水平。
