chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与平台演进
        blocks:
          - type: paragraph
            body: >-
              Fanatics 是一家未上市的全球体育平台，法定实体为 Fanatics Holdings, Inc.，在纽约州纽约市与佛罗里达州杰克逊维尔设有双总部 [CO001]。公司企业源头可追溯至 2011 年：在
              eBay 以 $2.4 billion 收购 GSI Commerce 之后，Michael Rubin 重新购回了体育商品电商资产；而更早的业务渊源则可追溯到 1995 年的 Football Fanatics
              以及 2002 年签下的体育联盟电商合约 [CO002, CO003]。公司已从单纯的特许服饰分销商，演进为横跨 Fanatics Commerce、Fanatics Collectibles、Fanatics
              Betting & Gaming、Fanatics Events、Fanatics Markets 和 Fanatics Studios 等多个业务条线的体育生态 [CO004,
              CO008]。目前平台在全球覆盖超过 100 million 可触达球迷，与 900 多个体育机构建立合作，连接逾 6,000 名运动员，并在 80 多个分支机构拥有超过 22,000 名员工 [CO005,
              CO006]。但由于 Fanatics 属于未上市私营企业，无需履行 SEC 申报义务，外界对其独立分部收入、单位利润率及合并营业利润率的公开可见度依然有限 [CO014]。
