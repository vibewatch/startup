  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 各分部面临的多线竞争格局
        blocks:
          - type: paragraph
            body: >-
              Fanatics
              并未遭遇能够完全复刻其集团模式的单一对手，而是在各细分垂直赛道迎战专业级竞争者：在电商领域面对传统及体验型体育用品零售商，在收藏品赛道对峙老牌球星卡制造商，在博彩与赛事合约业务中交锋根基深厚的博彩巨头。在特许体育电商领域，Fanatics
              以数字化飞轮模式运转，在掌控联盟与球队官方网店的同时操盘 Lids 等线下实体零售资产。与此相对，Dick's Sporting Goods 等传统实体零售商则押注 House of Sport
              等体验型目的地业态，试图通过线下零售场景与本地社区黏性锁死客户忠诚度，而非依赖线上通用的数字化会员积分。在收藏品领域，Fanatics 凭主流联盟与工会的长期独家授权打破原有格局，遭到老牌厂商 Panini
              提起反垄断及欺诈诉讼。Fanatics Betting and Gaming 则需面对 DraftKings 与 FanDuel 等成熟玩家，后两者的滚球投注流动性更充裕、赛事覆盖面也更广。
