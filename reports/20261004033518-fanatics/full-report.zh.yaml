      - number: '1.2'
        title: 管理层、公司治理与控制权结构
        blocks:
          - type: paragraph
            body: >-
              公司控制权高度集中在创始人、董事长兼首席执行官 Michael Rubin 手中，他通过私人控股公司 Kynetic 持有股权 [CO007,
              CO009]。尽管外部财务投资机构与战略体育合作伙伴合计持有过半已发行股份，Rubin 仍通过超级投票权普通股牢牢掌握表决控制权 [CO009]。高级管理团队成员包括首席财务官 Glenn H.
              Schiffman、首席战略与增长官 Tucker Kain、执掌 Fanatics Commerce 的 Andrew Low Ah Kee，以及挂帅 Fanatics Betting & Gaming 的
              Matt King [CO007, CO008]。包括 NFL、MLB、NHL、MLS 和主要球员工会在内的战略体育机构合计持有约 10% 股权，使核心授权方与平台经济利益直接绑定
              [CO009]。尽管管理层履历深厚，关键人风险依然高度系于 Rubin 一人；且公司既未提交 S-1 招股说明书，也未设立公开披露的独立董事会专门委员会架构 [CO009, CO014]。
            claimRefs:
