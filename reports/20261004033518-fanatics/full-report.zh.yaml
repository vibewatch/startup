      - number: '6.3'
        title: 机构落地实证、基建扩容与 B2B 合作关系
        blocks:
          - type: paragraph
            body: >-
              企业级落地实证展现了 Fanatics 的机构渗透度与运营半径 [CU001, CU010]。消费品牌合作上，服饰零售商 Abercrombie & Fitch 正式签约 Fanatics 作为其 NFL
              电商合作伙伴，A&F 的 NFL 系列得以入驻 nflshop.com、NFL 球场门店、球队官方网站以及 Fanatics 旗下网店售卖 [CU010]。财务与技术底层基建上，内部团队引入
              FloQast、ScyllaDB 和 AWS 支撑复杂业务的规模化运转 [CU005, CU006, CU013]。FloQast 财务软件落地全球零售、批发及线上电商团队，支撑超过 $8 billion
              的企业收入和 300 多名财务用户，赶在准 IPO 合规要求前将结账周期缩短了 50% [CU006]。平台工程团队从 Cassandra 迁移至 ScyllaDB，并将全球数据中心整合至 3 个 AWS
              区域，足以应对 280,000 IOPS 的峰值负载，并实现最高 48% 的基础设施成本节约 [CU005, CU013]。这些企业级落地案例印证了服务全球球迷需求所需的庞大技术吞吐能力 [CU005,
              CU013]。
