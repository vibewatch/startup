  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与决策逻辑
        blocks:
          - type: paragraph
            body: >-
              投资建议为继续研究（research-more），置信度中等，风险评级为高，对应 $31 billion 票面估值的态度为缺乏支撑至偏高（unsupported-to-stretched）。看好的一面在于
              Fanatics 公司披露的业务覆盖六大体育板块，拥有超过 100 million 名球迷、900 多个体育机构合作伙伴以及超过 22,000
              名员工。该等规模或许能形成交叉销售与版权优势，但并不足以确立合并盈利能力或具备安全边际的入场价格。当前的估值记录存在明显冲突：Forge 仍显示投后估值为 $31 billion，而 Tracxn 截至 2026
              年 1 月 1 日的数据则标为 $22
              billion。这些估值点属于采用不同统计口径的第三方机构监测数据，无法证明当下公允的独立融资定价。因此，投资决策应严格以经审计的分部业绩、明确的证券价格及完整资本分配顺序（waterfall）为前提。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV015
