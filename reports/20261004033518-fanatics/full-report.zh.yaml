      - number: '6.2'
        title: 渗透轨迹、FanCash 会员黏性与平台体量
        blocks:
          - type: paragraph
            body: >-
              从 Fanatics 的历史发展路径来看，公司迅速从传统体育服饰零售商蜕变为在 80 多处全球办公地与分支机构运转的综合企业 [CU001, CU006]。其目标受众在全球已扩大至 100 million
              以上可触达球迷；在移动优先的官方网店上，移动端贡献了超过 70% 的平台流量以及高达 80% 的峰值收入 [CU001, CU005]。为拉动高频复购与跨业务渗透，Fanatics 推出企业级会员机制
              Fanatics ONE，将 FanCash 奖励打通至电商、收藏品及博彩场景 [CU001, CU007]。产品团队重点搭建实时账本系统与互动功能，激励体育迷在跨平台间持续消费
              [CU007]。但外部审计与尽调发现，Fanatics 未公布队列层面的净留存率（NRR）、总留存率（GRR）或年度活跃客户数，球迷复购周期的真实持久度仍未得到验证 [CU011, CU012]。
