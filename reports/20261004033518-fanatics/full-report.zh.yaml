            body: >-
              Fanatics
              勾勒的平台版图横跨电商、收藏品、博彩与游戏、线下活动、预测市场、广告、信用卡业务以及内容工作室。各业务的底层商业逻辑存在本质差异：周边服饰融合了生产制造、批发、直接零售以及代运营合作伙伴官方网店；收藏品依靠实体与数字产品变现；博彩取决于投注流水与庄家抽水率（hold）；广告则向广告主售卖球迷触达渠道。Sacra
              亦梳理了其 D2C 销售、批发授权与制造，以及球队或联盟官方网店代运营模式。宽广的业务线带来了交叉销售潜力，但也意味着合并收入无法套用单一 SaaS
