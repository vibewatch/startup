      - number: '5.2'
        title: 系统架构、云基础设施与领域工程
        blocks:
          - type: paragraph
            body: >-
              Fanatics 的底层技术架构围绕部署在公有云基础设施（主要是
              AWS）上的自洽领域微服务搭建。早期系统依赖本地单体架构，不仅在佛罗里达数据中心容易遭遇飓风灾害冲击，且在夺冠抢购等突发流量高峰下存在严重的并发瓶颈；为此 Fanatics 推进了历时数年的云迁移，搭建起 AWS
              Cloud Commerce Platform（CCP）。CCP 将核心电商业务拆分为三大领域服务：商品检索（实体识别、商品打分、搜索索引）、购物车与结算（低延迟订单捕获、Token 化支付流程及
              3D-Secure 合规），以及账户管理（身份识别、用户画像配置与本地化）。研发团队采用多语言技术栈：核心后端服务采用 Go、Java、TypeScript 和 Python，辅以 gRPC
              通信协议；边缘前端与移动端则基于 React、Kotlin Multiplatform 和 Swift 构建。数据持久层分布于 MySQL 和 PostgreSQL 等关系型数据库、Redis
              等高吞吐键值缓存，以及 Cassandra 和 DynamoDB 等文档数据库中。在对亚秒级延迟和容错能力要求极高的 Betting and Gaming
              分部，技术架构依托分布式事件驱动消息流、Kubernetes 容器编排，以及在滚球高峰期能承受超过 100,000 个并发连接的 WebSocket
              网关。在供应链与制造端，企业级集成平台统管双向电子数据交换（EDI）事务（包括 ANSI X12 850 采购订单、856 预先发货清单和 940 仓库发货通知），并通过 REST API
              连接第三方物流（3PL）与自营按需印刷履约中心。
