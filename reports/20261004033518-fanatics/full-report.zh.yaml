      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              上一轮获广泛证实的股权融资，发生在 2022 年 12 月，融资金额约为 $700 million，对应投后估值为 $31
              billion。公司官网转引的《华尔街日报》报道指出，该轮所发普通股资金专用于战略并购，而非日常运营开支，因此该笔融资不能被视作评估烧钱速度、现金跑道或当前流动性的依据。Multiples.vc
              将该估值点与当时记录的 2022 年 12 月 $3.5 billion 收入配对，算出 8.9x
              的市销率；但该机构指明该收入仅是随轮次记录的基准数值，绝非当前收入、ARR、经审计的分部收入或现行估值倍数。其引用的服饰行业约 1.1x 至 2.0x 市销率参考值以及非上市企业 Gymshark 的 3.9x
              倍数，仅能作为电商赛道的大致参考，无法为 Fanatics 杂糅了电商、收藏品及博彩的混合资产组合提供具备可比性的独立基准。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
