    data:
      items:
        - label: 公司创立
          date: '2011-03-01'
          detail: Michael Rubin 将 GSI Commerce 出售给 eBay，并将 Fanatics 电商业务保留在 Kynetic 旗下。
          tone: positive
        - label: Series A 轮融资
          date: '2012-06-01'
          detail: 由 Insight Partners 与 Andreessen Horowitz 领投 $150M，估值达 $1.5B。
          tone: positive
        - label: SoftBank 巨额轮融资
          date: '2017-09-01'
          detail: SoftBank Vision Fund 领投 $1B 投资，体育联盟参投，估值达 $4.5B。
          tone: positive
        - label: 独家球星卡版权垄断
          date: '2021-08-01'
          detail: 锁定与 MLB、NFLPA 及 NBA 的独家长期球星卡授权，颠覆收藏品市场格局。
          tone: opportunity
        - label: 收购 Topps
          date: '2022-01-01'
          detail: 以约 $500M 收购老牌球星卡巨头 Topps，奠定 Fanatics Collectibles 业务基石。
          tone: positive
        - label: Series I 估值顶峰
          date: '2022-12-01'
          detail: 完成由 Clearlake Capital 领投的 $700M 融资，估值攀升至 $31B。
          tone: positive
        - label: 反垄断诉讼纷争
          date: '2023-08-07'
          detail: Panini 提起反垄断诉讼指控收藏品版权垄断；Fanatics 随后反诉商业欺诈。
          tone: adverse
        - label: 收购 PointsBet 美国业务
          date: '2023-08-31'
          detail: 耗资 $225M 收购 PointsBet USA 业务，加速推进全美各州体育博彩布局。
          tone: positive
        - label: 成立 Fanatics Studios
          date: '2026-01-13'
          detail: 携手 OBB Media 组建体育与娱乐合资公司 Fanatics Studios。
          tone: opportunity
        - label: 推出一体化博彩应用
          date: '2026-09-02'
          detail: 发布整合下注、交易与娱乐场玩法的统一应用 Fanatics Sports & Casino。
          tone: positive
