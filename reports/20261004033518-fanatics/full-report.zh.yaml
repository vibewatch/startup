  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与可触达支出
        blocks:
          - type: paragraph
            body: >-
              传统商业体育市场长期按垂直领域割裂运转，实体服饰零售、球星卡收藏、赛事票务以及体育博彩彼此独立。Fanatics
              明确将其目标市场边界重塑为一体化数字体育平台，业务囊括特许消费品周边、体育收藏品与纪念品、体育博彩、预测市场以及线下藏家活动。在此边界内，Fanatics 赚取职业及高校体育周边的 D2C
              与批发零售支出、实体及数字球星卡的独家制造商收入，以及各合法博彩州管辖内的博彩总收入（GGR）。相反，该边界排除了赛事直播版权、运动员合同直付薪酬、体育场馆基建融资，以及由 Nike、Adidas 和
              Dick's Sporting Goods 主导的无品牌大众运动服饰与器械制造。现存替代选项包括本地夫妻球星卡店、eBay 等第三方二级交易市场、DraftKings 与 FanDuel
              等传统独立体育博彩平台，以及球场特许经营商。通过整合联盟独家权益与垂直制造能力，Fanatics 致力于把零散的单次交易转化为覆盖整个球迷经济的持续客户终身价值。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
