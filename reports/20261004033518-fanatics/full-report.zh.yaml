  - id: TV003
    title: 正方论点 / 反方论点与关键反转证据
    columns:
      - 立场
      - 核心论点
      - 当前证据
      - 何种证据将改变研判
    rows:
      - - 正方论点
        - 覆盖体育全产业链的多业务触达能力有望促进交叉销售并形成稳固的版权壁垒。
        - 公司自述拥有六大核心业务、100M+ 球迷、900+ 个体育版权方以及 22,000+ 名员工。
        - 经审计的留存队列与分部边际贡献率证实了跨生态的价值创造。
      - - 正方论点
        - 体育联盟的战略入股可促使版权持有方与平台长期利益高度绑定。
        - NFL 曾在 $27B 估值下领投 $1.5B 融资，其他体育联盟及球员工会亦有跟投。
        - 当前版权期限、保底承诺、股权稀释以及续约商务条款的细节凭据。
      - - 反方论点
        - 上一轮一级市场融资标记与当前第三方估值无法确立当下的市场出清公允价值。
        - 公开估值参考在 $22B 与 $31B 之间存在冲突，且 $31B 的收入支撑基准属于历史数据。
        - 包含完整证券条款的近期公平交易融资凭据或经核实的二级市场老股交易。
      - - 反方论点
        - 版权高度集中可能引发法律诉讼与竞争层面的下行风险。
        - 据 WSJ 报道，在 Fanatics 扩张球星卡版权后，Panini 与 Fanatics 爆发联邦互诉。
        - 最终判决结果、和解财务条款，以及关键版权持续稳固的凭证。
    notes: 公司披露的规模指标未被视作经独立核实的信息；联盟入股与诉讼属于历史证据，所有反转依据均需一手尽调加以验证。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV013
