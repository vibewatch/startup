  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品生态、多赛道业务流程与用户体验
        blocks:
          - type: paragraph
            body: >-
              Fanatics 构建了一体化体育迷生态，业务涵盖特许周边电商、体育收藏品制造、真金博彩、预测市场、线下活动及媒体内容。球迷的数字旅程始于线上触点：除 Fanatics.com
              旗舰网站外，公司还为各大职业体育联盟、高校体育部和全球足球俱乐部运营着 900 多个官方电商网店。在这些触点上，消费链路紧扣浏览发现、个性化推荐、下单结算与积分追踪。为打通全流程体验，Fanatics
              推进研发通用移动应用 FanApp，旨在将商品购买、产品推荐、个性化算法与积分奖励整合至统一的客户端旅程。除常规 D2C 服饰消费外，Fanatics
              还针对各业务板块开辟了专门流程：在收藏品端，藏家可购买原封未拆的球星卡原盒、送评球星卡或进行数字保险库托管，并追踪二级市场实时价格；在博彩与游戏端，玩家可查看实时赔率、通过 Bet Builder
              串关工具下注，并参与滚球盘下注；在零售端，消费者在 2,000 多家实体网点（包括 Lids 门店与球场官方店）的 POS 系统前完成交互。跨赛道活跃度依托统一会员体系 Fanatics ONE
              带动，球迷购买周边所获积分可顺畅用于博彩与收藏品场景。然而，鉴于各业务板块面临的监管规定、运营模式与履约要求截然不同，要把这些差异巨大的业务流揉进统一界面，需要跨团队工程体系的持续协同。
