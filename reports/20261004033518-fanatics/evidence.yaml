    severity: material
    topic: segment-economics
    missingEvidence: >-
      Audited current revenue, gross margin, operating income, cash flow, capital employed, retention, and cohort
      economics by business segment.
    whyItMatters: >-
      Without segment economics, the mixed portfolio cannot be valued with a defensible multiple or used to calculate
      target returns and a hold period.
    diligencePath: >-
      Obtain audited consolidated and segment statements, quality-of-earnings work, operating KPIs, budgets, and
      board-approved forecasts under NDA.
