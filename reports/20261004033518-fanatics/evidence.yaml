evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-segment-margins
    missingEvidence: >-
      Audited segment income statements, division EBITDA contributions, gross margins, and net cash flow across
      Commerce, Collectibles, and Betting.
    whyItMatters: >-
      Without audited segment disclosure, investors cannot evaluate whether newer wagering and collectibles ventures are
      accretive or eroding core commerce profitability.
    diligencePath: >-
      Review audited private financial statements under NDA or examine an S-1 registration statement if Fanatics files
      for an initial public offering.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: segment-profitability-and-durability
    missingEvidence: >-
      Audited segment gross margins, repeat purchase frequencies, and cohort retention figures across Commerce,
      Collectibles, and Gaming.
    whyItMatters: >-
      Without audited segment unit economics, underwriting forward TAM penetration and long-term operating leverage
      remains speculative.
    diligencePath: Inspect audited private financial disclosure packs or confidential S-1 pre-filing registration drafts.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: Audited cash, debt, burn, runway, working-capital, capex, lease, covenant, and segment cash-flow schedules.
    whyItMatters: Historical funding does not establish current liquidity or the amount and timing of future financing needs.
    diligencePath: >-
      Obtain the latest audited financials, monthly management accounts, debt and lease schedules, covenant
      calculations, and a board-approved 24-month cash plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: A reconciled 2025 revenue total and segment schedule on a consistent gross-versus-net recognition basis.
    whyItMatters: >-
      The $9.60 billion and approximately $13 billion values imply materially different growth, mix, and valuation
      conclusions.
    diligencePath: Reconcile the analyst estimates to audited 2024 and 2025 financial statements and management's segment reporting.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit economics
    missingEvidence: >-
      Realized pricing, discounts, returns, licensing economics, gross margin, CAC, payback, retention, betting hold,
      promotional spend, and contribution margin by segment.
    whyItMatters: >-
      Scale and audience reach cannot establish revenue quality or a credible margin path without segment-level customer
      and cost economics.
    diligencePath: >-
      Request segment cohorts, price-volume-mix bridges, contract samples, unit-cost schedules, and contribution-margin
      waterfalls for Commerce, Collectibles, and Gaming.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: erp-migration
    missingEvidence: >-
      Technical migration completion percentage, rollout schedules, and realized order-processing latency metrics across
      the composable supply chain transformation.
    whyItMatters: >-
      Unfinished ERP migrations create potential inventory desynchronization and fulfillment failures during peak
      championship surges.
    diligencePath: >-
      Request engineering architecture transition reviews, ERP deprecation roadmaps, and warehouse execution system
      benchmark logs.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: gaming-reliability
    missingEvidence: >-
      Audited system uptime logs, service-level objective (SLO) compliance reports, and incident post-mortems for
      Fanatics Sportsbook during major peak wagering events.
    whyItMatters: >-
      Live in-play wagering profitability is severely impaired by WebSocket connection drops or latency spikes during
      high-volume sporting events.
    diligencePath: >-
      Request Datadog monitoring telemetry, load testing performance benchmarks, and historical regulatory incident
      reporting across state jurisdictions.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: antitrust-exposure
    missingEvidence: >-
      Detailed litigation reserves, legal contingency disclosures, and settlement terms in ongoing antitrust disputes
      with Panini.
    whyItMatters: >-
      Adverse antitrust rulings or forced licensing divestitures would threaten Fanatics Collectibles' operating
      monopoly and exclusive league deals.
    diligencePath: >-
      Review federal court docket filings, expert witness antitrust disclosures, and contractual licensing renewal
      clauses.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort retention rates, Gross Revenue Retention (GRR), and Net Revenue Retention (NRR) across licensed
      commerce and sports betting.
    whyItMatters: >-
      Without retention and repeat-purchase data, investors cannot verify whether platform growth is driven by recurring
      fan lifetime value or continuous replacement acquisition.
    diligencePath: >-
      Request confidential cohort retention tables by segment (commerce, betting, collectibles) and annual active
      transacting user counts during management diligence.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-deployments
    missingEvidence: >-
      Exhaustive roster of commercial brand partnerships and wholesale supplier contracts beyond sample public
      announcements.
    whyItMatters: >-
      Wholesale and co-branded retail deals represent expanding high-margin channels whose contractual terms and volume
      commitments are undisclosed.
    diligencePath: >-
      Request standard commercial contract templates, partner volume commitments, and top-10 wholesale partner
      contribution figures.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: litigation-exposure
    missingEvidence: Quantitative liability reserves and confidential settlement demand details regarding Panini antitrust litigation.
    whyItMatters: >-
      Treble damage liabilities or structural remedies could impair future collectibles cash flows and licensing
      exclusivity.
    diligencePath: Review litigation risk assessment memoranda and contingent liability disclosures in confidential data room.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: gambling-compliance
    missingEvidence: >-
      State-by-state regulatory audit logs, voluntary exclusion violation records, and customer dispute statistics
      across Fanatics Sportsbook jurisdictions.
    whyItMatters: >-
      Identifies whether problem gambling investigations threaten gaming license renewals or expose the platform to
