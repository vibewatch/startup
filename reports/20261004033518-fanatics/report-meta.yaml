companyProfile:
  summary: >-
    Fanatics is a private global sports platform that started in licensed commerce and has expanded into collectibles,
    betting and gaming, live events, prediction markets, and related fan services. The business is led by founder and
    CEO Michael Rubin, combines major league and partner distribution with a large reachable-fan footprint, and remains
    opaque on standalone segment margins, liquidity, and exit readiness because it does not report publicly as an SEC
    registrant.
