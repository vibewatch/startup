  title: "Competitors"
  summary: "Fanatics faces segmented competition across sports commerce, collectibles, and wagering rather than a single unified peer, confronting retail gravity from Dick's Sporting Goods, legal resistance from Panini in trading cards, and entrenched liquidity from DraftKings and FanDuel in sports wagering and prediction markets."
sections:
  - id: "competitive-landscape-overview"
    title: "Multi-Front Competitive Landscape Across Segments"
    body: "Fanatics does not compete against a single comprehensive replica of its conglomerate model. Instead, its ecosystem encounters specialized competitors across distinct operating verticals: traditional and experiential sporting goods retailers in commerce, incumbent trading card manufacturers in collectibles, and entrenched gaming operators in wagering and event contracts. In licensed sports commerce, Fanatics operates as a digitally dominated flywheel that manages e-commerce storefronts for leagues and teams while controlling physical retail assets like Lids. Conversely, brick-and-mortar incumbents such as Dick's Sporting Goods pursue an experiential destination strategy through concepts like House of Sport, seeking to anchor customer loyalty in physical retail and local community engagement rather than portable digital loyalty points. In collectibles, Fanatics disrupted the legacy status quo by capturing long-term exclusive licensing rights with major leagues and player associations, triggering direct antitrust and fraud litigation from incumbent manufacturer Panini. Meanwhile, Fanatics Betting and Gaming contends with mature operators DraftKings and FanDuel, which command superior live-betting liquidity and broader sports menus."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
    tableRefs:
      - "TP001"
  - id: "capabilities-and-differentiation"
    title: "Capabilities, Pricing Dynamics, and Platform Integration"
    body: "Across capabilities and pricing, Fanatics relies on its proprietary FanCash ecosystem currency and vertical integration to differentiate against entrenched vertical specialists. In sports betting and gaming, independent testing indicates that Fanatics runs a standard market vig of approximately 4% to 5% on major sports leagues, maintaining softer pricing and more frequent positive-expected-value opportunities on alternative spreads and player-prop ladders compared to mature books. However, Fanatics remains constrained by a mobile-only architecture with no desktop wagering interface, narrower live-betting market depth than market leaders FanDuel and DraftKings, and a tightening limit policy on algorithmic wagering accounts. In prediction markets, Fanatics Markets operates as a CFTC-regulated introducing broker under a federal derivatives framework powered by Crypto.com Derivatives North America, competing against DraftKings Predictions. While Fanatics Markets emphasizes sports-led contract depth and a zero-line-item fee model where costs are embedded in spreads, DraftKings leverages a wider cross-category user base to deliver tighter order-book spreads and smoother liquidity across political and financial event contracts."
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP011"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "switching-costs-and-moat-durability"
    title: "Switching Costs, Distribution Power, and Moat Durability"
    body: "The durability of Fanatics' competitive moat rests on exclusive intellectual property rights and cross-vertical customer retention rather than prohibitive structural switching costs. In retail commerce, sports apparel buyers face near-zero switching costs between online retailers and sporting goods stores, though Fanatics' multi-league exclusive manufacturing and e-commerce agreements create substantial supply-side access barriers. To lock in customer relationships across divisions, Fanatics deploys FanCash, an integrated rewards currency that can be redeemed across digital storefronts, sports betting bonus wagers, event tickets, and collectibles. However, in sports wagering and prediction markets, sports bettors and event traders routinely multi-home across multiple regulated applications to exploit signup bonuses and line shopping. Furthermore, Fanatics' aggressive expansion into trading cards precipitated intense legal counterattacks from Panini, underscoring ongoing regulatory and litigation exposure surrounding exclusive licensing arrangements."
    claimRefs:
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
      - "CP016"
    tableRefs:
      - "TP003"
