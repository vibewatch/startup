callouts:
  - calloutType: "strength"
    title: "Structural Moat from Strategic League Alignment"
    body: "By granting equity stakes representing roughly 10% of the company to major sports leagues (NFL, MLB, NHL, MLS) and player associations, Fanatics turns key suppliers and licensors into economic partners, creating significant barriers to entry for rival commerce and collectibles operators [CO009]."
    claimRefs:
      - "CO009"
  - calloutType: "risk"
    title: "Unilateral Governance and Dual-Class Control"
    body: "Michael Rubin's super-voting stock grants him absolute voting control over strategic direction, acquisitions, and public listing timing regardless of outside institutional capital, leaving minority shareholders without governance leverage or exit timing guarantees [CO009]."
    claimRefs:
      - "CO009"
