callouts:
  - calloutType: "risk"
    title: "Revenue cannot yet be bridged to liquidity"
    body: "The assigned evidence does not disclose audited cash, debt, burn, runway, working capital, capex, or segment cash flow, so historical funding cannot establish present capital adequacy."
    claimRefs: [CI010, CI011, CI012, CI014]
  - calloutType: "insight"
    title: "Diversification is economically uneven"
    body: "Commerce, Collectibles, Gaming, and adjacent businesses use different revenue units and cost structures; Sacra's internally inconsistent mix makes segment-level reconciliation a prerequisite to underwriting."
    claimRefs: [CI003, CI005, CI006, CI007, CI008, CI009]
