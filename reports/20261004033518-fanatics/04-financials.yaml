slug: "fanatics"
runDate: "2026-10-04"
company:
  name: "Fanatics"
chapter:
  number: 4
  title: "Financials"
  summary: "Fanatics has multiple monetization engines and credible scale signals, but the public record does not provide an auditable bridge from revenue to gross profit, cash generation, or runway. The strongest current revenue estimate is internally inconsistent, while the last broadly corroborated primary financing event dates to 2022, making capital adequacy the central underwriting blocker."
sections:
  - id: "revenue-architecture"
    title: "A broad monetization surface, not a single economic model"
    body: >-
      Fanatics describes a platform spanning commerce, collectibles, betting and gaming,
      events, prediction markets, advertising, credit-card initiatives, and studios.
      The economic mechanisms differ materially: merchandise combines manufacturing,
      wholesale, direct retail, and operated partner storefronts; collectibles monetize
      physical and digital products; gaming depends on wager volume and hold; and
      advertising sells access to the fan audience. Sacra further describes direct-to-consumer
      sales, wholesale licensing and manufacturing, and team or league online-store operation.
      This breadth creates cross-sell potential, but it also means consolidated revenue cannot
      be evaluated with one SaaS-style unit-economics framework. Each segment needs its own
      revenue-recognition, gross-margin, working-capital, and customer-acquisition bridge.
    claimRefs: [CI001, CI002, CI003]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: "traction-and-reporting-integrity"
    title: "Scale is visible; the financial baseline is not"
    body: >-
      Two market intermediaries repeat an estimated $8.1 billion of 2024 revenue and 16%
      year-over-year growth, but no audited filing in the assigned evidence verifies that
      baseline. The freshest analyst page is more problematic: Sacra's narrative estimates
      about $13 billion of 2025 revenue, while the same page's headline card displays
      $9.60 billion for 2025. Its approximate segment shares also total 104%, so they cannot
      serve as a clean revenue-mix schedule. The resulting evidence is useful for directional
      scale, not for valuation-grade forecasting. Diligence should reconcile reported,
      gross, and net revenue by segment and explain intercompany eliminations before any
      growth or margin case is underwritten.
    claimRefs: [CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: "pricing-gtm-and-margin"
    title: "Distribution reach is a useful proxy, but not a CAC or margin disclosure"
    body: >-
      Fanatics reports more than 100 million reachable fans, over 900 sports-property
      partnerships, and more than 2,000 retail locations. Those figures indicate unusually
      broad owned and partner distribution, while Sacra reports more than 40 million annual
      e-commerce transactions and 25 million Lids transactions. Public evidence also points
      to materially different economics across segments: Sacra estimates partner revenue
      sharing of 6% to 8% of retail sales and says Collectibles exceeds a 20% EBITDA margin.
      However, list prices, realized discounts, betting promotional spend, hold, returns,
      fulfillment costs, CAC, repeat behavior, and payback are not disclosed. Reach therefore
      remains a GTM proxy rather than proof of efficient acquisition or durable contribution
      margin.
    claimRefs: [CI003, CI009, CI016]
    tableRefs: [TI002]
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy remains unobservable"
    body: >-
      The last broadly corroborated primary financing event in this pool is the approximately
      $700 million 2022 round at a $31 billion valuation; reporting at the time said proceeds
      were reserved for strategic M&A rather than day-to-day operations. Tracxn reports
      $4.85 billion of total funding, but funding raised is not cash available. UpMarket still
      described Fanatics as private in March 2026, so no public-market filing closes the
      disclosure gap. The reviewed sources provide no audited cash, debt, burn, runway,
      working-capital, capex, or segment cash-flow schedule. The financial verdict is therefore
      research-more: revenue diversity is plausible and Collectibles may offer a favorable
      margin path, but liquidity, gaming investment needs, inventory exposure, and consolidated
      cash conversion remain ununderwritable.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015]
tables:
  - id: "TI001"
    title: "Revenue streams and economic mechanisms"
    columns: ["Stream", "Mechanism", "Unit", "Current public value/status", "Evidence quality", "Diligence ask"]
    rows:
      - ["Commerce direct-to-consumer", "Manufactured and third-party licensed merchandise sold through digital and physical channels", "Order / item", "Sacra estimates about 54% of 2025 revenue", "Third-party estimate; internally inconsistent total mix", "Revenue, gross margin, returns, and contribution profit by channel"]
      - ["Partner storefront operations", "Operation of team and league e-commerce sites", "Store order / partner contract", "More than 900 sports-property relationships reported by Fanatics", "Company-claimed relationship count", "Gross versus net recognition and economics by major partner"]
      - ["Physical retail", "Sales through stores including Lids", "Store transaction", "Sacra reports 25M annual Lids transactions", "Third-party estimate; period not independently audited", "Same-store sales, lease exposure, inventory turns, and four-wall margin"]
      - ["Collectibles", "Physical and digital trading cards, memorabilia, and related products", "Pack / card / collectible transaction", "Sacra estimates about $5B of 2025 revenue", "Third-party estimate; approximate and unaudited", "Revenue recognition, licensing minimums, print runs, inventory, and segment cash flow"]
      - ["Betting and gaming", "Sportsbook, iGaming, and prediction-market activity", "Wager / gaming transaction", "Sacra estimates about $1.6B of 2025 revenue", "Third-party estimate; gross-versus-net basis unspecified", "Handle, hold, promotional credits, gaming taxes, CAC, and state-level profitability"]
      - ["Advertising", "Media inventory across Fanatics properties and partner surfaces", "Campaign / impression", "Business exists; revenue not disclosed", "Company-described product with no financial breakout", "Rate card, net revenue, advertiser concentration, and gross margin"]
      - ["Events, studios, credit and loyalty", "Tickets, sponsorship, content, credit economics, and ecosystem rewards", "Event / contract / account", "Businesses or initiatives identified; economics not disclosed", "Company-described portfolio only", "Launch status, revenue ownership, partner splits, losses, and capital commitments"]
    notes: "Mechanisms combine company descriptions with Sacra estimates; segment values are approximate, unaudited, and do not form a reconciled revenue mix."
    claimRefs: [CI001, CI002, CI003, CI007, CI009, CI016]
  - id: "TI002"
    title: "Pricing and monetization evidence"
    columns: ["Offering", "Price / unit / contract model", "List versus realized evidence", "Discounts or unknowns", "Underwriting implication"]
    rows:
      - ["Commerce merchandise", "Per-item retail and wholesale sales", "No price book or realized average selling price in reviewed sources", "Promotions, returns, channel mix, and licensing costs unavailable", "Revenue scale cannot be converted to contribution margin"]
      - ["League and team storefronts", "Store-operation and revenue-sharing arrangements", "Sacra estimates partners receive 6%-8% of retail sales", "Contract-level guarantees, exclusions, and net recognition unavailable", "Partner economics may create durable access but constrain margin"]
      - ["Collectibles", "Per-product physical and digital sales", "No public realized price or product-mix schedule", "Licensing minimums, redemption obligations, and inventory exposure unavailable", "Reported margin signal cannot be stress-tested"]
      - ["Betting and gaming", "Wagering hold and gaming revenue", "No public handle, hold, or net-gaming-revenue bridge", "Bonuses, taxes, market-access fees, and acquisition incentives unavailable", "Revenue cannot be compared with commerce on a like-for-like basis"]
      - ["Advertising and adjacent services", "Campaign, media, sponsorship, credit, or event contracts", "No public rate card or realized yield", "Partner splits and launch-stage losses unavailable", "Optionality exists, but value contribution is not quantifiable"]
    notes: "The only numerical contract term in the assigned evidence is Sacra's estimated 6%-8% partner share of retail sales; all other realized pricing remains unavailable."
    claimRefs: [CI001, CI003, CI009, CI014]
  - id: "TI003"
    title: "Public unit-economics and capital-adequacy scoreboard"
    columns: ["Metric", "Public value", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["2024 revenue", "$8.1B; 16% year-over-year growth", "Medium; repeated by EquityZen and Sacra, not audited", "Provides a directional scale anchor", "Audited consolidated revenue and recognition policy"]
      - ["2025 revenue", "$9.60B headline card versus about $13B narrative estimate", "Low; one page conflicts internally", "Changes growth, mix, and valuation conclusions materially", "Reconciled 2025 income statement and source methodology"]
      - ["2025 Commerce revenue / mix", "Approximately $7B / 54%", "Low; Sacra estimate", "Tests the durability of the core profit engine", "Segment revenue, gross profit, and cash contribution"]
      - ["2025 Collectibles revenue / mix", "Approximately $5B / 38%", "Low; Sacra estimate", "Could be the principal margin expansion source", "Audited segment revenue, EBITDA, licensing and inventory schedule"]
      - ["2025 Gaming revenue / mix", "Approximately $1.6B / 12%", "Low; Sacra estimate", "Shows diversification but not profitability", "Net gaming revenue, state P&L, CAC, payback, and promotional spend"]
      - ["Collectibles EBITDA margin", "Greater than 20%", "Medium-low; Sacra estimate only", "Indicates a potentially attractive segment margin", "Audited EBITDA bridge and allocation policy"]
      - ["Total funding raised", "$4.85B", "Medium; Tracxn estimate", "Measures historical financing, not current liquidity", "Cap table, preferences, primary versus secondary proceeds, and remaining cash"]
      - ["Cash, debt, burn and runway", null, "Unavailable", "Determines financing dependency and downside resilience", "Audited balance sheet, monthly cash burn, debt schedule, covenants, and 24-month liquidity plan"]
    notes: "Null means the assigned public evidence did not disclose the metric; funding raised is not treated as cash available, and all Sacra segment figures require reconciliation."
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI012, CI014]
