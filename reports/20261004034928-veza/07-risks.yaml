callouts:
  - calloutType: "risk"
    title: "ServiceNow Platform Embedding and Vendor Lock-in"
    body: "Industry evaluations from CloudEagle highlight that as Veza becomes embedded within ServiceNow's Autonomous Security & Risk stack, replacing or decoupling its authorization engine becomes significantly harder. Enterprise customers face potential shifts in support structures, account management, and pricing models alongside strategic roadmap convergence."
    claimRefs:
      - "CR012"
      - "CR013"
  - calloutType: "insight"
    title: "Authorization Gaps as the Primary Breach Catalyst"
    body: "While legacy cybersecurity investments have focused heavily on perimeter defense and initial identity authentication, enterprise breaches predominantly stem from authorization abuse and toxic permission combinations. Securing data requires granular continuous mapping of effective permissions rather than passive role-based assumptions."
    claimRefs:
      - "CR003"
      - "CR008"
      - "CR010"
