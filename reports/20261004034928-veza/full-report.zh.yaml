      - number: '5.4'
        title: 专题分析
        blocks:
          - type: callout
            title: 从认证到授权的架构演进
            body: >-
              Veza 核心的技术防御壁垒在于将授权分析与身份认证解耦。传统身份提供商仅在登录环节核验用户身份（认证），却无法持续追踪通过认证的实体在多云环境中能操作哪些具体数据资产（实际授权）。Veza
              借由专门构建的元数据图谱，将各类云策略持续解析为规范的增删改查模型，精准覆盖了凭证滥用与权限提权攻击频发的盲区。
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: callout
            title: 连接器脆弱性与上游 API 依赖
            body: >-
              由于 Veza 采用免代理架构，从超 300 项云与 SaaS 集成中提取授权元数据，平台数据的实时性天然受限于第三方 API 的调用频率上限、轮询时间窗口以及上游数据架构变更。只读集成虽保障了运行稳定性，但外部
              IAM 权限模型的任何破坏性变更都要求快速更新连接器，以防图谱产生盲区。
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE014
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 企业级安全团队是核心采购决策方
        blocks:
          - type: paragraph
            body: >-
              Veza 的市场定位面向复杂企业，而非轻量级的身份管理场景。其官网主要面向需要在 SaaS、云端、本地、数据及自研系统中梳理实际生效权限的安全、身份、合规、数据与平台工程团队。SecurityWeek
              独立报道将该底层产品描述为面向企业级 SaaS 应用与云平台的软件；LeadIQ 同样强调其聚焦全球大型企业，并点名了 Wynn Resorts、Expedia 和 Blackstone 等客户。但 LeadIQ
              的信源可靠度偏低，且包含前后矛盾的地理位置数据，不宜作为权威参考。由此得出的最明确客群划分属于职能维度：CISO
              与身份主管很可能是出资买方，身份与安全一线运维人员是核心使用者，而业务应用或数据所有者则参与权限审查与修复。现有评估材料中没有任何公开来源披露按客户群体细分的收入、ACV、地域结构或付款方集中度。
            claimRefs:
              - CU001
              - CU004
              - CU014
