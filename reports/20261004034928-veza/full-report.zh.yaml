            body: >-
              Veza 官网与对外新闻稿列举了多家知名企业并详述了身份安全落地场景，提供了优于单纯“客户商标墙”的佐证。其《2026 年身份与访问现状报告》称，基于截至 2025 年观测到的数据，Veza 累计分析了 160
              家企业中超过 230B 条权限。这证明其具备可观的技术可见性，但并不等同于已披露的付费客户数、收入规模或留存分群。产品页面还声称支持超 300
              项免代理只读集成；这扩大了潜在的部署覆盖面，却不能证明每个连接器都在被高频使用。因此，公开证据虽能支撑其企业级相关性与生产环境级的数据体量，但应用深度、具体采购模块、部署时间节点及经独立验证的应用成效等问题依然悬而未决。
