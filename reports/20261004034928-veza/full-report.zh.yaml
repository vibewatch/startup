  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类分类与统计口径
        blocks:
          - type: paragraph
            body: >-
              企业身份架构已行至拐点：在分布式环境下，传统的身份与访问管理（IAM）系统已无法有效管控实际权限。以往，企业主要依赖 Okta
              等身份提供商以及传统目录架构，对人类员工开展身份认证并划分粗粒度的角色组。但现代云原生架构与微服务体系将数据分散在各大云服务商、Snowflake 等数据平台以及各类 SaaS 业务应用中。正如行业分析机构
              Omdia
              所指出的，现代身份安全涵盖三个相邻市场：身份安全态势管理（ISPM）、身份治理与管理（IGA）以及非人类身份（NHI）安全。在该分类标准下，计入本市场的软件支出包括细粒度授权映射、自动化用户访问认证、冲突权限组合识别、服务账户治理及机器身份追踪。反之，单纯的认证终端、物理生物识别门禁、消费者身份核验平台及网络边界防火墙均被排除在外。目前现状替代方案依然普遍：大型企业安全团队往往借助自研脚本、手工导出电子表格，或在
              ServiceNow 与 Jira 中建立静态工单流来审计权限。这类替代方案难以建立有效的多云访问控制，导致企业暴露在权限过度配置、孤儿账户丛生以及合规审计缺陷的风险之中。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场测算视角、增长轨迹与 TAM 约束
        blocks:
          - type: paragraph
            body: >-
              评估以授权为核心的身份安全市场规模，需要将泛网络安全口径拆解为可验证的产品品类。全球企业在身份安全与治理领域的支出，属于云基础设施防护中增速较快的细分赛道。尽管分析师自上而下的行业报告常将泛 IAM
              及数据安全软件的总可用市场（TAM）测算至数十亿美元，但自下而上的企业落地情况却揭示了关键的边界约束。具体而言，Veza 的目标客户主要集中在管理复杂混合多云架构、大量部署 SaaS
              应用及异构数据湖的大型企业。在这类企业中，机器身份和 API 服务账户数量已超过人类员工，使得所需管控的权限成倍膨胀。Veza《2026 年身份与访问现状报告》的行业数据显示，在典型企业环境中，单名员工平均拥有
              96,000 条权限，38% 的身份提供商账户处于闲置休眠状态，仅 55% 的权限符合安全与合规要求。因此，测算可服务市场（SAM）的门槛在于：企业是否运行着超过 300
              款应用与云系统，从而必须引入基于图拓扑的自动化授权解析，而非仅靠基础单点登录管控。而测算可获取市场（SOM），则取决于管理着数百亿条权限的 Fortune 500
              强企业、强监管金融机构和全球连锁酒店集团的实际采购意愿。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM014
      - number: '2.3'
        title: 买方画像、预算归属与采购落地路径
        blocks:
          - type: paragraph
            body: >-
              授权智能市场的采购决策涉及不同技术条线的买方与业务利益相关方。主要出资买方通常是首席信息安全官（CISO）或信息安全副总裁，负责把控企业风险化解、审计合规性及监管应对。次要预算相关方包括 IAM
              总监、云平台与网站可靠性工程（SRE）负责人以及数据治理主管。Choice Hotels International 等企业案例表明，向 AWS
              微服务架构迁移会导致跨分布式数据存储的权限关系急剧复杂化。采购流程通常始于安全与平台工程团队发现孤儿账户、游离策略或手工审查无法修复的合规审计隐患。若平台能以带外免代理方式采集元数据，并将违规策略分发至
              ServiceNow 等现有工单骨干系统中，往往能加快初期落地节奏。然而，采购决策权常割裂于管理云数据库的基础设施工程团队与管控传统目录访问的企业 IT 团队之间，需要跨部门达成共识方能敲定企业级订单。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 驱动因素、自主 AI 变量与市场瓶颈
        blocks:
          - type: paragraph
            body: >-
              授权治理市场的增长动力，来自非人类身份激增、监管政策趋严以及企业对自主 AI 智能体（Agent）的规模化部署。当企业在业务系统中铺开 AI 助手与自动化智能体时，机器凭证与自动化工作流呈爆发式增长。HFS
              Research 分析师强调，虽然企业自动化平台赋予了 AI 智能体跨客服与 IT 运营执行任务的能力，但自主执行必须依赖严苛的授权规则，以防止企业核心数据被未授权越权遍历。与此同时，GDPR、HIPAA 及
              Sarbanes-Oxley 等合规框架要求落实可验证的访问控制与最小特权原则，以防范勒索软件攻击。尽管有这些行业红利，多重实质约束依然制约着铺开速度。Linx Security
              的竞品评估指出，与自动化主动修复相比，需要人工手动执行查询的被动可见性引擎容易增加运营阻力。此外，据报道 ServiceNow 以 $1B 收购 Veza
              的交易，也让正在评估多年期生态绑定的企业买方产生了平台依赖与厂商锁定的顾虑。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 专题分析
        blocks:
          - type: callout
            title: 自主 AI 智能体成为授权治理的关键催化剂
            body: >-
              企业对自主智能体的引入，从根本上将身份安全从人类治理问题转变为实时机器授权挑战。当企业部署 AI 助手跨数据库和 SaaS
              工具执行操作时，静态的角色型访问模型便已难以为继。能够将实际生效权限细化映射至具体数据表与端点的授权图谱，成为确保 AI 智能体不越权调阅内部数据的必备基础设施。
            calloutType: insight
            claimRefs:
              - CM006
              - CM013
              - CM014
          - type: callout
            title: 收购后的平台绑定与修复摩擦
            body: >-
              并入 ServiceNow 虽然为深入企业 IT 工作流带来了前所未有的分发优势，却也为非 ServiceNow 环境引入了战略摩擦。第三方竞品评估指出，Veza
              过去以被动风险发现为主、依赖外部工单系统落实修复的做法，可能会劝退那些追求平台内自动化策略执行、或运行异构 IT 服务管理体系的潜在买方。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方可选路径
        blocks:
          - type: paragraph
            body: >-
              现有证据表明，该领域存在广泛的竞争群体，而非单一的直接对标阵营。竞品 C1.ai 列举了 9 款企业级 IGA
              替代方案，涵盖新兴自动化厂商、成熟治理套件、身份提供商扩展模块以及以特权访问管理（PAM）为主的平台；Krowdbase 则另行列出了 23
              款替代品，但鲜有产品层面的实质佐证。因此，买方的选择路径十分多元：既可选用 Veza 这类专注授权层的方案，亦可采购成熟 IGA 套件、主流 IdP 绑定的治理模块、身份认证或 PAM
              专业厂商产品，或继续沿用内部自研工具。本报告所获证据无法确认这些厂商可靠的融资额、收入或装机量数据，因此档案表中将规模标注为未知，而非以营销声量指代。面对这一分散格局，买方更宜依据控制平面与工作流契合度展开选型，而非参考泛化的竞品排名。
            claimRefs:
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
