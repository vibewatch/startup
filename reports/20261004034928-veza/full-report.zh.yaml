    sections:
      - number: '1.1'
        title: 身份定位、产品与运营现状
        blocks:
          - type: paragraph
            body: >-
              Veza 成立于 2020 年，三位联合创始人为 Tarun Thakur、Maohua Lu 与 Rob
              Whitcher，目前在公司官网上的职务分别为首席执行官、首席技术官与首席架构师。其产品是一款企业访问平台，以 Access Graph 为核心，打通并整合人、机器、第三方、应用程序、数据、本地系统及 SaaS
              之间的身份与权限。CNBC 于 2025 年 4 月报道称，公司总部位于加利福尼亚州 Los Gatos，员工规模为 200 人。LeadIQ 页面则显示其位于阿拉巴马州 Valley，员工区间为 51-200
              人；在缺乏企业直接确认的情况下，企业名录抓取的位置与人员数据不应推翻 CNBC 当时的报道。截至 2026 年 5 月，ServiceNow 称 Veza 已融入 ServiceNow AI
              Platform，但现有证据并未证实收购价格、交割日期或并入后是否保留独立的法人地位。
