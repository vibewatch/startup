      - number: '4.2'
        title: 业务拓展成效、增购动态与公开指标
        blocks:
          - type: paragraph
            body: >-
              公开披露的财务里程碑显示，Veza 在战略出售前保持了显著的商业扩张势头。结合 2025 年 4 月公布的 $108M Series D 轮融资，公司报告称其 2024
              年年经常性收入（ARR）同比增长超过一倍。此外，Veza 公布的企业级净留存率（NRR）接近 150%，表明当客户安全团队将更多云服务、数据库及 SaaS 平台接入 Access Graph
              时，老客增购扩展十分显著。其在头部企业市场的渗透尤为突出，客户覆盖 10 家 Fortune 500 强与 16 家 Fortune 1000 强机构，包括 Blackstone、Workday、Sallie
              Mae 和 Snowflake 等大型企业。Atlassian Ventures、Workday Ventures 及 Snowflake Ventures 在 Series D
              轮中的企业战投，既提供了资金背书，也印证了 Veza 集成能力的商业价值。然而，Veza 从未公开披露其以美元计的绝对基准 ARR、年合同价值（ACV）分布或客户集中度比例，给财务评估留下了实质性缺口。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: 成本结构、资本充足度与并购过渡
        blocks:
          - type: paragraph
            body: >-
              Veza 的成本结构符合典型高增长企业基础设施软件公司的特征，支出大头为技术研发人员薪酬、图处理基础设施的云算力费用以及全球企业级销售拓展。在四轮主要机构股权融资中，Veza 累计筹得 $235M
              股权资金，投资方包括 New Enterprise Associates、Accel、Google Ventures (GV)、True Ventures、Norwest Venture
              Partners、Ballistic Ventures 和 Blackstone Innovations Investments。员工规模从 2022 年发布前后的约 110 人，扩张至 2025 年年中的全球超
              190 人；公开行业名录在收购前跟踪到的员工数约为 191 至 230 人。尽管投后估值 $808M 的 $108M Series D
              轮融资为资产负债表提供了数年资金跑道，但独立运营的现金烧钱速度与毛利率动态已被 ServiceNow 的收购所覆盖。在 Veza 并入 ServiceNow 的自治安全与风险（Autonomous
              Security and Risk）产品线后，其独立资本充足度与融资需求已由母公司全盘承接，未来资金跑道与独立再融资考量随之失效，而未公开的独立毛利率及单位经济模型数据也已无法查证。
