  - id: FM001
    title: 身份授权市场规模层级
    type: pyramid
    summary: 分层市场规模结构展示广义企业 IAM 支出如何收敛至授权智能与 AI 治理领域。
    data:
      items:
        - label: 总可用市场（TAM）：全球企业 IAM 与身份安全
          valueNote: 涵盖身份认证、单点登录、目录服务与终端访问的广义企业 IT 支出
        - label: 相邻细分层：身份安全态势管理（ISPM）
          valueNote: 跨 SaaS 与企业云的持续权限发现及有效访问映射
        - label: 相邻细分层：身份治理与管理（IGA）
          valueNote: 策略驱动的权限管理、自动化访问认证，以及员工入离调转（JML）生命周期工作流
        - label: 相邻细分层：非人类身份（NHI）安全
          valueNote: 针对机器账户、API 密钥与服务令牌的资产盘点、归属追踪与特权控制
        - label: 可服务市场（SAM）：多云授权与权限治理
          valueNote: 具备混合多云架构、300+ 项 SaaS 集成且面临严重非人类权限泛滥的企业
        - label: 可获取市场（SOM）：企业授权智能与治理
          valueNote: 需要基于图谱的有效权限映射与最小特权执行的大型组织
        - label: 目标扩张层：自主 AI Agent 与机器身份治理
          valueNote: 部署自主 AI 工作流且需要实时授权控制平面的企业
    approximationNotes: 各市场层级代表定性的功能规模边界；由于非公开财务数据未披露且交易整合尚在进行，绝对美元总额受到限制。
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM006
      - CM007
      - CM014
