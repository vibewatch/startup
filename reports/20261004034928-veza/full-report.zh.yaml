              外部转述的一则 Veza 客户成功岗位招聘需求显示，该岗位负责管理约 8 到 10 家战略级企业客户，直接对接客户 CIO 和
              CISO，制定多年期成功方案，并对续约与增购结果直接负责。该职责还将落地深度、高管互动及实际产出价值列为客户健康度的前瞻指标。这些描述展示了其既定的商业拓展动作，而非已实现的留存成果。已审阅材料中没有公开披露任何净留存率（NRR）、总留存率（GRR）、客户流失率、续约率、分群增购、合同期限、实施周期或客户满意度统计基数，亦未揭示头部客户集中度风险。因此，投资者应将这种重度介入的高触达服务模式视为一种看似合理的长期维系机制，但其实际成效并未公开，不能直接作为经常性收入稳固的佐证。
