  - id: FU001
    title: 企业客户旅程与扩张闭环
    type: journey-map
    summary: Veza 公开资料描述了从访问可见性到治理与修复的工作流，并由高接触度客户成功举措提供支撑。
    data:
      items:
        - label: 发现
          detail: 映射所连接系统中的用户、用户组、角色、权限与资源。
          touchpoints:
            - Access Graph
            - 集成
        - label: 诊断
          detail: 识别休眠访问、过度特权、策略违规与配置漂移。
          touchpoints:
            - 访问可见性
            - 访问智能
        - label: 治理
          detail: 结合业务上下文对高危访问排定优先级并执行审查专项。
          touchpoints:
            - 访问审查
            - 职责分离
        - label: 修复
          detail: 借助受支持的工作流执行吊销、调配、取消调配或操作流转。
          touchpoints:
            - 生命周期管理
            - 访问授权
        - label: 证明价值
