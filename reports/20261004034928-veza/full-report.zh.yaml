      - number: '3.4'
        title: 护城河韧性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Veza 的护城河具有条件性，而非坚不可摧。Access Graph
              及其集成生态确实能确立有益的数据模型与工作流先发优势，尤其是当买方需要在多套系统中持续分析实际生效权限时。然而，两家企业名录列出的大量替代方案表明，治理、生命周期自动化、非人类身份覆盖以及面向 AI
              的访问控制已是兵家必争之地。Veza 自身报告称典型企业中单名员工平均关联 96,000 条权限，这一复杂度既能凸显归一化图谱的价值，也会吸引平台套件厂商与企业内部平台工程团队入局竞争。C1.ai 的页面宣称与
              ServiceNow
              的整合将拖慢产品演进节奏并带来迁移风险，但这仅是竞品单方面作出的预测，并非证实推迟的独立第三方证据。因此，护城河的稳固程度取决于经过验证的连接器保真度、实际修复成效、交易后产品研发投入以及客户续约行为，现有公开证据均未对此直接量化。
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: 专题分析
        blocks:
          - type: callout
            title: 并购过渡期风险未获独立证实
            body: 现有资料中预测研发路线推迟与迁移阻力的唯一来源，是竞品 C1.ai 撰写的对比材料。该论断应视为尽调排查提示，而非路线推迟或被迫迁移确已发生的证据。
            calloutType: risk
            claimRefs:
              - CP016
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、商业化机制与定价不透明度
        blocks:
          - type: paragraph
            body: >-
              Veza 以其 Access Platform 为核心，借助企业级 SaaS
              订阅与软件许可模式获取软件收入。该平台提供身份安全态势管理（ISPM）、身份治理与管理（IGA）、非人类身份（NHI）管理以及访问生命周期自动化能力。其商业化逻辑立足于跨系统的企业级规模，而非自助式用量计费。商业定价未在公开目录中分层发布，而是走直销定制报价路线，根据受监控目标系统数量、接入数据源体量、目录身份总数以及
              Access AI、Access Requests、Access AuthZ 等选配模块进行计价。尽管目录价格并不透明，但其面向企业的市场拓展主要依托预付式的年付及多年期 SaaS
              订阅合同，并借助涵盖增值经销商、全球系统集成商及云市场联盟的 Veza 身份合作伙伴计划（VIPP）开展渠道分发。由于 Veza 定位于分析与授权治理控制平面，可接入 AWS、Microsoft
              Azure、Google Cloud、Snowflake 及 Workday 等超过 250 至 300 项免代理集成，其历史合同额往往对应全企业级的安全采购范畴，在大型客户部署中展现出强劲的增购扩展能力。
