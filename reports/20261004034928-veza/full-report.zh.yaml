              - CP010
              - CP015
      - number: '3.2'
        title: 能力边界与差异化壁垒
        blocks:
          - type: paragraph
            body: >-
              Veza 对外宣传的核心差异化在于其 Access
              Graph：公司称该图谱能对人、机器、第三方以及云端、SaaS、数据与本地环境中的身份和权限进行归一化处理，以增删改查（CRUD）语言呈现实际生效权限，并接入了超 300
              项免代理只读集成。这为授权治理提供了差异化视角，但并非完整的身份控制技术栈。Veza 自身的零信任指南指出，该产品不是 ZTNA 隧道或 SSE 代理；RFP.wiki
              亦评价其在授权治理上得分较高，但原生单点登录（SSO）能力偏弱。因此，横向对比支持多产品协同架构：Veza 更适合作为 IdP、PAM
              或网络访问层的补充，而非全盘替代。需要指出的是，这些属于公开的产品宣传口径和采购网站评分，而非生产环境基准测试，连接器深度、修复质量及工作负载覆盖面仍需实际检验。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP010
      - number: '3.3'
        title: 商业模式与迁移替换动态
        blocks:
          - type: paragraph
            body: >-
              信息披露的不对称限制了商业维度的横向对比。RFP.wiki 称 Veza 并无公开定价，并在商业透明度（Commercial Clarity）一项上仅给出 1.4 / 5 分。C1.ai 虽发布了关于 Okta
              和 Microsoft Entra 的公开目录价说法，但由于数据出自竞品之手而非相关厂商当前的官方定价页面，仅能作为方向性的采购参考。Veza
              所宣称的连接器广度或能降低初期数据接入的阻力，但长期粘性则取决于沉淀在日常运营中的归一化权限模型、审查活动、生命周期策略、修复工作流以及审计凭证。现有材料中未见客户迁移研究、合同范本、续约数据或独立测算的迁移成本。因此，买方在断言其具备价格或迁移成本优势前，应在统一的业务范畴内综合比对实际年合同价值（ACV）、实施服务、连接器维护及退出支持条款。
            claimRefs:
              - CP002
              - CP007
              - CP011
              - CP012
              - CP015
