              Veza 披露的企业净留存率（NRR）接近 150%，其底层支撑是企业权限数量的指数级膨胀。平均每名企业员工积累约 96,000 条权限，且多云环境中的非人类身份成倍增长，当客户将更多数据平台、SaaS 工具及
