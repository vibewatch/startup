              ServiceNow 对 Veza 的整合终止了独立审计财务记录的公开渠道。鉴于收购对价、交易结构及独立毛利率均处于保密状态，投资评估人员无法证实 Veza
              在战略出售前是否实现了经营性现金流盈利或可持续的单位经济模型。
