  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台定义与 Access Graph 运行模型
        blocks:
          - type: paragraph
            body: >-
              Veza 将其产品定位为以授权为核心的身份安全平台，旨在解答现代 IT
              环境中企业运营的根本问题：谁能够且应当在何种数据上执行何种操作。该平台直击传统身份与访问管理系统的可见性与执行瓶颈——后者以往侧重于身份认证与孤立的角色从属关系，而非数据资产层面的实际生效权限。架构的核心是
              Veza Access Graph：作为一款 AI 原生图引擎，它将涵盖人类用户、服务账户、非人类身份（NHI）、用户组、角色、策略及细粒度资源的多云与 SaaS 身份生态进行全面拓扑映射。Access
              Graph
              能够遍历嵌套关系与异构访问策略以判定实际权限，把各大厂商复杂的专有访问模型，转化为以增、删、改、查为核心的标准化直观权限语言。这一以图为核心的范式，让企业安全团队得以系统性排查闲置休眠账户、发现过度配置的特权、监控特权身份，并在混合企业环境中持续落实最小特权零信任策略。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
