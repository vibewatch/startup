      - number: '5.2'
        title: 产品线划分、模块功能与企业工作流
        blocks:
          - type: paragraph
            body: >-
              该商业平台将功能整合为三大解决方案支柱：身份安全态势管理（ISPM）、现代身份治理与管理（IGA），以及非人类与 Agentic AI 身份安全。在 ISPM 支柱下，Veza 提供用于多云权限可视化的
              Access Visibility、基于 500 多个预置巡检查询与自动化工单接口的 Access Intelligence，以及用于比对授权权限与实际访问历史的 Access Monitoring。在现代
              IGA 支柱内，平台提供可自动筛选高危权限以推进认证活动的 Access Reviews、具备预演仿真能力以在权限开通前拦截策略违规的 Lifecycle Management、基于 Access Hub
              的自助式 Access Requests，以及可自动化执行策略以消除开通瓶颈的 Access AuthZ。针对自动化引发的身份激增，平台推出非人类身份（NHI）安全模块以清点服务账户与机密凭证，并配备 AI
              Agent Security 来管控自主智能体、界定人类责任人并为 AI 安全态势管理留存审计追踪记录。在 2026 年 3 月收购落地后，平台与 ServiceNow 的 AI Control Tower
              展开整合，进一步把 Veza 的授权图谱融入企业 IT 工作流中。
            claimRefs:
              - CE005
              - CE006
              - CE007
