      - number: '5.3'
        title: 连接器架构、平台安全与工程权衡
        blocks:
          - type: paragraph
            body: >-
              Veza 的系统架构高度依赖其分布式集成与采集层，支持覆盖主流云厂商（AWS、Azure、GCP）、SaaS 平台（Box、HashiCorp、Databricks）以及 Okta 等身份提供商的 300
              多个免代理只读连接器。采集流水线与后端服务主要使用 Golang 和 Java 构建，依托 RESTful API
              和微服务拉取授权元数据，无需在宿主机部署侵入式代理，亦不影响业务连续性。针对企业自研应用，平台提供 Open Authorization
              API，便于企业将自身访问元数据推送入库。运行安全与租户信任依托于完全租户隔离、传输与静态加密、默认零外部访问，并定期接受独立的渗透测试。平台的安全控制与设计实践已通过 SOC 2 Type I、SOC 2
              Type II 及 ISO 27001 认证。核心工程与运维风险主要集中在：第三方 API 升级带来的连接器维护负担、跨大规模云环境潜在的数据同步延迟，以及 Veza 融入 ServiceNow
              广阔产品矩阵过程中的研发路线整合。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
