          label: 广泛的授权平台
          description: 公司资料自述具备跨环境身份覆盖能力，并拥有超过 300 项集成。
        - id: operating-signal
          label: 方向性运营证据
          description: 公司披露的 ARR 增长与 NRR 表现强劲，但绝对收入仍未公开。
