        - 企业认证高峰周期的访问审查排期受限
    notes: 按严重程度排序。分析外部技术依赖、平台集中度及合作伙伴相关风险。
    claimRefs:
      - CR002
      - CR012
      - CR013
      - CR014
  - id: TV001
    title: 投资建议摘要
    columns:
      - 决策维度
      - 评估结论
      - 投资含义
    rows:
      - - 建议与置信度
        - 继续研究；中等置信度
        - 仅凭公开证据，不能为新的独立头寸做投资判断。
      - - 风险评级与估值立场
        - 信息风险高；当前估值未知
        - 将 $808.05M 视为历史 Series D 轮锚点，而非当前价格。
      - - 可投资性
        - Forge 记录并购于 2026 年 3 月完成，且无可用价格
        - 评估回报前，须取得交易文件及各证券层级收益明细。
    notes: 评估以 2025 年 4 月融资为历史参考，不预估未披露的收购对价或持有人收益。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV011
      - CV012
      - CV016
  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 视角
      - 基于证据的论点
      - 何种情况会改变观点
    rows:
      - - 投资逻辑：增长信号
        - Veza 称 ARR 同比增长超过一倍，企业级 NRR 接近 150%。
        - 经审计的 ARR 与客户留存队列数据，能将方向性增长转化为可做投资判断的商业数据。
      - - 投资逻辑：产品广度
        - 公司现有材料声称拥有 300+ 项集成，并覆盖人类、机器与第三方身份。
        - 独立的生产环境基准测试与续约证据，能强化护城河论据。
      - - 投资逻辑：战略背书
        - Atlassian Ventures、Workday Ventures 与 Snowflake Ventures 参与了 Series D 轮融资。
        - 若有证据表明存在协同获客商机、用量提升或付费部署，将展现商业价值而非单纯财务期权属性。
      - - 反向逻辑：信息披露与数据质量
        - 绝对收入金额未予披露，且 Forge 警告其数据可能采用有限且未经审计的输入项。
        - 经审计的财务数据与最终收购文件将收窄信息折价。
    notes: 公司发布的增长与产品陈述均作为单方主张呈现，独立信息源则提供融资、定位与信息披露背景。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报区间
      - 概率信号
      - 下行或确认触发条件
    rows:
      - - 乐观
        - 披露对价超过上一轮 Series D 标记；交割后产品广度与客户留存保持稳定。
        - 高于 $808.05M，但上限与各证券层级回报缺乏证据支撑。
        - 仅在最终对价与运营指标披露的前提下才偏向积极。
        - 若对价附带或有条件，或留存率转弱，该假设即失效。
      - - 基准
        - 记录的收购维持交割状态，但对价与股权分配瀑布流依然保密。
        - 无法确定；公开证据无法支撑任何站得住脚的下限或上限。
        - 当前公开记录支持将其作为核心证据状态，而非数值化概率。
        - 当交易文件揭示支付结构与分配收益时，该判断将改变。
      - - 悲观
        - 对价低于 Series D 标记，或者清算优先权、业绩对赌与股份滚动条款削减了普通股收益。
        - 低于 $808.05M，但底线及各证券类别亏损程度缺乏证据支撑。
        - 价格、优先权与支付条款未披露期间，风险依然存在。
        - 若交易价格低于估值标记、包含或有价值，或交割后留存疲软，则该情景得到证实。
    notes: 各区间特意相对于据报道的 Series D 投后估值设定；若赋予具体数值概率、收入倍数或各证券层级回报，将超出当前指定证据的范畴。
    claimRefs:
      - CV002
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 八个带日期的证据检查点梳理了 Veza 从创立到融资、治理乃至 ServiceNow 平台集成的历程，且未将据报道的谈判视为已签署的交易条款。
    data:
      items:
        - date: '2020'
          label: 创立
          detail: Tarun Thakur、Maohua Lu 与 Rob Whitcher 创立 Veza。
          tone: neutral
        - date: '2022-04-27'
          label: 走出隐身模式
          detail: 公司发布的新闻稿宣布获得超过 $110M 融资。
          tone: positive
        - date: '2023-08-10'
          label: 战略投资
          detail: Capital One Ventures 与 ServiceNow Ventures 参投，使官方公布的总融资额达到 $125M。
          tone: positive
        - date: '2023-08-10'
          label: 集成版图
          detail: Veza 称其集成数量已突破 125 项。
          tone: positive
        - date: '2023-08-10'
          label: 董事会动向
          detail: 公司披露任命 Phil Venables 为董事会成员。
          tone: neutral
        - date: '2025-04-28'
          label: Series D 轮
          detail: NEA 领投 $108M 轮次；SecurityWeek 称其估值为 $808M。
          tone: positive
        - date: '2025-11-27'
          label: 据报道的收购洽谈
          detail: CIO 报道称 ServiceNow 展开深入洽谈，交易金额超过 $1B，但整合问题尚未解决。
          tone: warning
        - date: '2026-05-05'
          label: ServiceNow 平台集成
          detail: ServiceNow 称 Veza 已集成至其 AI Platform，用于人类与非人类身份治理。
          tone: neutral
    approximationNotes: 2023 年董事会与集成检查点采用公告日期，原因在于原始新闻稿未提供具体的事件日期。2025 年收购事项明确属于洽谈报道，并非经确认的收购价格或交割结果。
