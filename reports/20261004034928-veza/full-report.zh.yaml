  - id: FE001
    title: Veza 端到端授权平台架构
    type: stack
    summary: 多层平台架构展示了数据从外部身份和数据源经由 Access Graph 规范化引擎流向治理应用的全过程。
    data:
      layers:
        - label: 应用与治理层
          detail: 面向客户的界面与自动化工作流，涵盖 ISPM、IGA、NHI 及 AI Agent 治理。
          items:
            - label: 访问可见性与监控
            - label: 访问智能（500+ 查询）
            - label: 自动化访问审查
            - label: 生命周期管理与访问授权
            - label: 非人类身份与 AI Agent 安全
            - label: Access Hub（员工门户）
        - label: 智能与分析层
          detail: AI 驱动的推荐、异常检测与自然语言搜索引擎。
          items:
            - label: Access AI 推理引擎
            - label: 特权冲突组合与职责分离检测
            - label: 最小特权策略评估
            - label: 自动化修复工单流转
        - label: Access Graph 与规范化核心
          detail: 对身份、策略与有效权限建模的分布式图数据引擎。
          items:
            - label: 高性能流式引擎
            - label: 规范授权对象模型
            - label: CRUD 语义转换层
            - label: 有效权限图遍历器
        - label: 集成与摄取层
          detail: 跨企业系统收集授权元数据的带外无代理连接器。
          items:
            - label: 300+ 只读连接器
            - label: 开放授权 API
            - label: 云基础设施适配器（AWS、GCP、Azure）
            - label: 身份与 SaaS 适配器（Okta、Box、Snowflake）
        - label: 企业安全与运营层
          detail: 底层基础设施安全、租户隔离与加密控制。
          items:
            - label: 原生租户数据隔离设计
            - label: 传输中与静态数据加密
            - label: 获 SOC 2 Type II 与 ISO 27001 认证的控制措施
            - label: 持续渗透测试与最小特权监控
        - label: 企业数据与目标资产层
          detail: Veza 评估的外部企业端点、云数据湖与业务应用。
          items:
            - label: 云平台（AWS、Azure、GCP）
            - label: 数据仓库与数据湖（Snowflake、Databricks）
            - label: SaaS 与生产力套件（Box、Microsoft 365）
            - label: 身份提供商（Okta、Entra ID、Ping）
