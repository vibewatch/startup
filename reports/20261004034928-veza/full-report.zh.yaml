        title: 融资历程、规模信号与战略转型
        blocks:
          - type: paragraph
            body: >-
              Veza 于 2022 年 4 月结束隐身状态，官方宣布累计融资超过 $110M。2023 年 8 月，Capital One Ventures 与 ServiceNow Ventures
              追投战略投资，官方公布的累计融资金额达 $125M，当时 Veza 还宣布支持的集成数量突破 125 项。2025 年 4 月，CNBC 与 SecurityWeek 报道称公司完成由 New
              Enterprise Associates 领投的 $108M Series D 轮融资；SecurityWeek 称公司估值为 $808M，CNBC 则报道称计入新资金后估值略高于 $800M。CIO
              随后报道称其自成立以来累计融资达 $235M。收入规模仍不透明：CNBC 称 Veza 未透露绝对收入金额，仅表示在截至 2025 年 1 月的财年内销售额增长超过一倍。CIO 在 2025 年 11
              月的一篇收购报道中提及双方曾探讨超过 $1B 的对价，但同时指出整合节奏、软件许可及独立产品定位尚存不确定性。上述见诸报道的谈判传闻并不能替代已签署的正式交易条款。
