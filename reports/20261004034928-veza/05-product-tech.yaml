chapter:
  number: 5
  title: "Product & Technology"
  summary: "Veza delivers an authorization-centric identity security platform built on its proprietary Access Graph, which translates disparate permissions across SaaS, cloud infrastructure, and data systems into a standardized create-read-update-delete model. Following its March 2026 acquisition by ServiceNow, the platform bridges identity security posture management and identity governance with enterprise agentic workflows, though production-scale verification for its newest AI-agent governance modules remains ongoing."
sections:
  - id: "core-platform-and-access-graph"
    title: "Core Platform Definition and the Access Graph Operating Model"
    body: "Veza defines its product offering as an authorization-centric identity security platform engineered to answer the foundational enterprise operational question: who can and should take what action on what data across modern IT environments. The platform addresses fundamental visibility and enforcement limitations inherent to traditional identity and access management systems, which historically focused on authentication and siloed role memberships rather than effective permissions at the data asset layer. At the technological core of the architecture lies the Veza Access Graph, an AI-native graph engine that maps an organization's multi-cloud and SaaS identity ecosystem across human users, service accounts, non-human identities (NHIs), groups, roles, policies, and granular resources. The Access Graph traverses nested relationships and heterogeneous access policies to determine effective permissions, converting complex vendor-specific access models into a standardized, intuitive permission vocabulary centered on create, read, update, and delete actions. This graph-centric paradigm enables enterprise security teams to systematically uncover dormant identity accounts, discover excessive entitlements, monitor privileged identities, and continuously enforce least-privilege Zero Trust policies across hybrid enterprise estates."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "product-modules-and-workflows"
    title: "Product Lines, Module Capabilities, and Enterprise Workflows"
    body: "The commercial platform organizes its capabilities into three primary solution pillars: Identity Security Posture Management (ISPM), modern Identity Governance and Administration (IGA), and Non-Human and Agentic AI Identity Security. Under the ISPM pillar, Veza provides Access Visibility for multi-cloud permission visualization, Access Intelligence powered by more than 500 pre-built inspection queries and automated ticketing hooks, and Access Monitoring to compare authorized access against actual access history. Within modern IGA, the platform delivers automated Access Reviews that prioritize high-risk entitlements for certification campaigns, Lifecycle Management featuring dry-run simulation capabilities to catch policy violations prior to provisioning, self-service Access Requests through Access Hub, and Access AuthZ to automate enforcement and eliminate provisioning bottlenecks. In response to identity sprawl from automation, the platform includes Non-Human Identity (NHI) Security to inventory service accounts and secrets, alongside AI Agent Security to govern autonomous agents, map human accountability, and maintain audit trails for AI Security Posture Management. Integration with ServiceNow's AI Control Tower following the March 2026 acquisition further links Veza's authorization graph into enterprise IT workflows."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE002"
  - id: "integrations-security-and-risks"
    title: "Connector Architecture, Platform Security, and Engineering Trade-Offs"
    body: "Veza's architecture depends heavily on its distributed integration and ingestion tier, which supports over 300 agentless, read-only connectors spanning major cloud providers (AWS, Azure, GCP), SaaS platforms (Box, HashiCorp, Databricks), and identity providers such as Okta. Ingestion pipelines and backend services, built primarily in Golang and Java, extract authorization metadata via RESTful APIs and microservices without deploying invasive host agents or risking service interruptions. For proprietary enterprise applications, the Open Authorization API allows organizations to publish access metadata into the platform. Operational security and tenant trust rely on complete tenant isolation, inflight and at-rest encryption, zero external access by design, and regular independent penetration testing. The platform's security controls and design practices hold certifications for SOC 2 Type I, SOC 2 Type II, and ISO 27001. Key engineering and operational risks center on connector maintenance overhead as third-party APIs evolve, potential data synchronization latency across sprawling cloud environments, and the post-acquisition integration roadmap as Veza transitions into ServiceNow's broader product portfolio."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
