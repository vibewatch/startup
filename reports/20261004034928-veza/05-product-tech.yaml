callouts:
  - calloutType: "insight"
    title: "The Architectural Shift from Authentication to Authorization"
    body: "Veza's core technological defensibility rests on decoupling authorization analysis from authentication. Traditional identity providers verify user identity at login (authentication), but fail to track what data assets an authenticated entity can manipulate across multi-cloud environments (effective authorization). By building a dedicated metadata graph that continuously parses cloud policies into a canonical create-read-update-delete model, Veza addresses the blind spot where credential abuse and privilege escalation attacks occur."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
  - calloutType: "risk"
    title: "Connector Fragility and Upstream API Dependency"
    body: "Because Veza operates an agentless architecture extracting authorization metadata from more than 300 cloud and SaaS integrations, platform data freshness is fundamentally constrained by third-party API rate limits, polling windows, and upstream schema changes. While read-only integration protects operational stability, any breaking change in external IAM permission models requires rapid connector updates to prevent graph blind spots."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE014"
