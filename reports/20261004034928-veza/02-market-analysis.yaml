callouts:
  - calloutType: "insight"
    title: "Autonomous AI Agents as the Critical Catalyst for Authorization"
    body: "The adoption of autonomous enterprise agents fundamentally transforms identity security from a human governance problem into a real-time machine authorization challenge. As organizations deploy AI assistants to take actions across enterprise databases and SaaS tools, static role-based access models break down. Authorization graphs that map effective permissions down to specific data tables and endpoints become mandatory infrastructure to ensure AI agents do not traverse unauthorized corporate records."
    claimRefs:
      - "CM006"
      - "CM013"
      - "CM014"
  - calloutType: "risk"
    title: "Post-Acquisition Platform Lock-in and Remediation Friction"
    body: "While integration into ServiceNow provides unprecedented distribution across enterprise IT workflows, it introduces strategic friction for non-ServiceNow environments. Third-party competitive evaluations note that Veza's historically passive risk discovery and reliance on external ticketing for remediation may alienate prospective buyers who require automated, in-platform policy enforcement or who operate heterogeneous IT service management ecosystems."
    claimRefs:
      - "CM015"
      - "CM016"
