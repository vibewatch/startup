company:
  name: "Veza"
chapter:
  number: 3
  title: "Competitors"
  summary: "Veza occupies an authorization-centric governance layer rather than the primary authentication, ZTNA, SSE, or PAM control planes, making both direct IGA vendors and adjacent identity platforms relevant alternatives. Its public differentiation rests on the Access Graph and broad connector coverage, while public pricing, independently tested capability comparisons, and the post-acquisition roadmap remain material evidence gaps."
sections:
  - id: "landscape-and-buyer-options"
    title: "Landscape and Buyer Options"
    body: >-
      The available evidence supports a broad competitive set rather than a single direct
      peer group. C1.ai, a competitor, names nine enterprise IGA alternatives spanning
      modern automation vendors, mature governance suites, identity-provider extensions,
      and PAM-led platforms; Krowdbase separately lists 23 alternatives, but provides
      little product-level proof. Buyers can therefore choose a focused authorization
      layer such as Veza, a mature IGA suite, governance bundled with an incumbent IdP,
      an authentication or PAM specialist, or continued internal tooling. The assigned
      evidence does not establish reliable funding, revenue, or installed-base figures
      for those vendors, so the profile table marks scale as unknown rather than using
      marketing reach as a proxy. This fragmented landscape favors evaluation by control
      plane and workflow fit, not by a single generic competitor ranking.
    claimRefs:
      - "CP009"
      - "CP013"
      - "CP014"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "capability-boundaries"
    title: "Capability Boundaries and Differentiation"
    body: >-
      Veza's public differentiation is its Access Graph: the company says it normalizes
      identities and entitlements across human, machine, third-party, cloud, SaaS, data,
      and on-premises contexts, expresses effective permissions in create-read-update-delete
      terms, and connects through more than 300 agentless read-only integrations. That is
      a differentiated authorization lens, but not a complete identity control stack.
      Veza's own Zero Trust guide says the product is not a ZTNA tunnel or SSE proxy, while
      RFP.wiki scores Veza strongly in authorization governance but weakly in native SSO.
      The comparison therefore supports a multi-product architecture: Veza can complement
      an IdP, PAM, or network-access layer rather than displace all of them. These are
      public product claims and procurement-site assessments, not production benchmarks,
      so connector depth, remediation quality, and workload coverage still require testing.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP008"
      - "CP015"
    tableRefs:
      - "TP002"
  - id: "commercial-and-switching-dynamics"
    title: "Commercial and Switching Dynamics"
    body: >-
      Commercial comparison is constrained by uneven disclosure. RFP.wiki reports no
      public Veza pricing and assigns a 1.4-of-5 Commercial Clarity score. C1.ai publishes
      list-price assertions for Okta and Microsoft Entra, but those figures come from a
      competing vendor rather than the vendors' current pricing pages, so they are useful
      only as directional procurement inputs. Veza's claimed connector breadth may lower
      initial data-ingestion friction, yet durable lock-in would arise later from normalized
      permission models, review campaigns, lifecycle policies, remediation workflows, and
      audit evidence embedded in operations. The pool contains no customer switching study,
      contract sample, renewal data, or independently measured migration cost. Buyers should
      consequently compare realized annual contract value, implementation services,
      connector maintenance, and exit assistance on a common scope before inferring a
      price or switching-cost advantage.
    claimRefs:
      - "CP002"
      - "CP007"
      - "CP011"
      - "CP012"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "moat-durability-and-displacement"
    title: "Moat Durability and Displacement Risk"
    body: >-
      Veza's moat appears conditional, not absolute. The Access Graph and integration
      footprint can create a useful data-model and workflow advantage, especially if
      buyers need consistent effective-permission analysis across many systems. However,
      the numerous alternatives identified by two directories show that governance,
      lifecycle automation, non-human identity coverage, and AI-oriented access controls
      are contested categories. Veza itself reports an average of 96,000 entitlements per
      worker in a typical enterprise, illustrating the complexity that can reward a
      normalized graph while also attracting suite vendors and internal platform teams.
      A C1.ai page argues that ServiceNow integration will delay the roadmap and create
      migration risk, but that is a competitor-issued forecast, not independent evidence
      of an observed delay. Durability therefore depends on verified connector fidelity,
      remediation outcomes, post-transaction product investment, and renewal behavior,
      none of which the assigned public evidence measures directly.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP009"
      - "CP013"
      - "CP014"
      - "CP016"
