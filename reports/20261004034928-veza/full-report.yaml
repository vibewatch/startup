  - id: FE001
    title: Veza End-to-End Authorization Platform Architecture
    type: stack
    summary: >-
      Multi-layered platform architecture illustrating data flow from external identity and data sources through the
      Access Graph normalization engine to governance applications.
    data:
      layers:
        - label: Application & Governance Layer
          detail: Customer-facing interface and automation workflows encompassing ISPM, IGA, NHI, and AI Agent governance.
          items:
            - label: Access Visibility & Monitoring
            - label: Access Intelligence (500+ queries)
            - label: Automated Access Reviews
            - label: Lifecycle Management & Access AuthZ
            - label: Non-Human Identity & AI Agent Security
            - label: Access Hub (Employee Portal)
        - label: Intelligence & Analytics Layer
          detail: AI-driven recommendation, anomaly detection, and natural language search engine.
          items:
            - label: Access AI Reasoning Engine
            - label: Toxic Combination & SoD Detection
            - label: Least-Privilege Policy Evaluation
            - label: Automated Remediation Ticketing
        - label: Access Graph & Normalization Core
          detail: Distributed graph data engine that models identities, policies, and effective permissions.
          items:
            - label: High-Performance Streaming Engine
            - label: Canonical Authorization Object Model
            - label: CRUD Semantic Translation Layer
            - label: Effective Permission Graph Traverser
        - label: Integration & Ingestion Layer
          detail: Out-of-band, agentless connectors collecting authorization metadata across enterprise systems.
          items:
            - label: 300+ Read-Only Connectors
            - label: Open Authorization API
            - label: Cloud Infrastructure Adapters (AWS, GCP, Azure)
            - label: Identity & SaaS Adapters (Okta, Box, Snowflake)
        - label: Enterprise Security & Operations Tier
          detail: Underlying infrastructure security, tenant isolation, and encryption controls.
          items:
            - label: Tenant Data Isolation by Design
            - label: Inflight & At-Rest Encryption
            - label: SOC 2 Type II & ISO 27001 Certified Controls
            - label: Continuous Penetration Testing & Least-Privilege Monitoring
        - label: Enterprise Data & Target Asset Tier
          detail: External enterprise endpoints, cloud data lakes, and business applications evaluated by Veza.
          items:
            - label: Cloud Platforms (AWS, Azure, GCP)
            - label: Data Warehouses & Lakes (Snowflake, Databricks)
            - label: SaaS & Productivity Suites (Box, Microsoft 365)
            - label: Identity Providers (Okta, Entra ID, Ping)
    approximationNotes: Logical architecture representation synthesized from Veza product documentation and technical whitepapers.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Enterprise customer journey and expansion loop
    type: journey-map
    summary: >-
      Veza's public materials describe a workflow from access visibility to governance and remediation, supported by
      high-touch customer-success activities.
    data:
      items:
        - label: Discover
          detail: Map users, groups, roles, permissions, and resources across connected systems.
          touchpoints:
            - Access Graph
            - Integrations
        - label: Diagnose
          detail: Identify dormant access, excessive privilege, policy violations, and drift.
          touchpoints:
            - Access Visibility
            - Access Intelligence
        - label: Govern
          detail: Prioritize risky access and execute review campaigns with business context.
          touchpoints:
            - Access Reviews
            - Separation of Duties
        - label: Remediate
          detail: Revoke, provision, deprovision, or route actions through supported workflows.
          touchpoints:
            - Lifecycle Management
            - Access AuthZ
        - label: Prove value
          detail: Tie adoption and realized outcomes to executive success plans and reviews.
          touchpoints:
            - Customer Success
            - Executive Business Reviews
        - label: Renew and expand
          detail: Extend coverage to additional systems, identities, and governance use cases.
          touchpoints:
            - Additional integrations
            - NHI and AI-agent security
    approximationNotes: >-
      Conceptual sequence derived from product and customer-success materials; no stage conversion rates, elapsed times,
      or customer-level expansion rates are publicly disclosed.
    claimRefs:
      - CU011
      - CU012
  - id: FR001
    title: Enterprise Authorization Risk Heatmap
    type: matrix
    summary: >-
      Matrix mapping enterprise identity and authorization risk domains across likelihood, impact, and mitigation
      maturity.
    data:
      columns:
        - Primary Vulnerability
        - Likelihood
        - Impact
        - Mitigation Maturity
        - Residual Severity
      rows:
        - label: Platform Lock-in
          values:
            - Deep ServiceNow integration reduces ecosystem portability
            - High
            - High
            - Moderate
            - High
        - label: Regulatory Fines
          values:
            - Inadequate authorization audits breach GDPR or HIPAA rules
            - Medium
            - High
            - Advanced
            - Medium
        - label: Credential Exploitation
          values:
            - Overprivileged dormant accounts facilitate credential abuse
            - High
            - High
            - Advanced
            - Medium
        - label: Non-Human Sprawl
          values:
            - Ungoverned service accounts and AI agents execute unvetted actions
            - High
            - High
            - Moderate
            - High
        - label: Connector Drift
          values:
            - API schema updates break out-of-band streaming metadata ingest
            - Medium
            - Medium
            - Advanced
            - Low
        - label: Financial Opacity
          values:
            - Private burn rate and unit economics obscure standalone efficiency
            - High
            - Medium
            - Early
            - Medium
