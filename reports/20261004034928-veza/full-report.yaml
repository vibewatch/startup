        title: Capital History, Scale Signals, and Strategic Transition
        blocks:
          - type: paragraph
            body: >-
              Veza emerged from stealth in April 2022 with a company-issued announcement of more than $110 million in
              funding. Strategic investments from Capital One Ventures and ServiceNow Ventures brought stated total
              financing to $125 million in August 2023, when Veza also said it had surpassed 125 integrations. In April
