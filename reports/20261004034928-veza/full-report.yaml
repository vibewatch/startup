  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform Definition and the Access Graph Operating Model
        blocks:
          - type: paragraph
            body: >-
              Veza defines its product offering as an authorization-centric identity security platform engineered to
              answer the foundational enterprise operational question: who can and should take what action on what data
              across modern IT environments. The platform addresses fundamental visibility and enforcement limitations
              inherent to traditional identity and access management systems, which historically focused on
              authentication and siloed role memberships rather than effective permissions at the data asset layer. At
              the technological core of the architecture lies the Veza Access Graph, an AI-native graph engine that maps
              an organization's multi-cloud and SaaS identity ecosystem across human users, service accounts, non-human
              identities (NHIs), groups, roles, policies, and granular resources. The Access Graph traverses nested
              relationships and heterogeneous access policies to determine effective permissions, converting complex
              vendor-specific access models into a standardized, intuitive permission vocabulary centered on create,
              read, update, and delete actions. This graph-centric paradigm enables enterprise security teams to
              systematically uncover dormant identity accounts, discover excessive entitlements, monitor privileged
              identities, and continuously enforce least-privilege Zero Trust policies across hybrid enterprise estates.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
