      - number: '5.2'
        title: Product Lines, Module Capabilities, and Enterprise Workflows
        blocks:
          - type: paragraph
            body: >-
              The commercial platform organizes its capabilities into three primary solution pillars: Identity Security
              Posture Management (ISPM), modern Identity Governance and Administration (IGA), and Non-Human and Agentic
              AI Identity Security. Under the ISPM pillar, Veza provides Access Visibility for multi-cloud permission
              visualization, Access Intelligence powered by more than 500 pre-built inspection queries and automated
              ticketing hooks, and Access Monitoring to compare authorized access against actual access history. Within
              modern IGA, the platform delivers automated Access Reviews that prioritize high-risk entitlements for
              certification campaigns, Lifecycle Management featuring dry-run simulation capabilities to catch policy
              violations prior to provisioning, self-service Access Requests through Access Hub, and Access AuthZ to
              automate enforcement and eliminate provisioning bottlenecks. In response to identity sprawl from
              automation, the platform includes Non-Human Identity (NHI) Security to inventory service accounts and
              secrets, alongside AI Agent Security to govern autonomous agents, map human accountability, and maintain
              audit trails for AI Security Posture Management. Integration with ServiceNow's AI Control Tower following
              the March 2026 acquisition further links Veza's authorization graph into enterprise IT workflows.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE008
              - CE009
      - number: '5.3'
        title: Connector Architecture, Platform Security, and Engineering Trade-Offs
        blocks:
          - type: paragraph
            body: >-
              Veza's architecture depends heavily on its distributed integration and ingestion tier, which supports over
              300 agentless, read-only connectors spanning major cloud providers (AWS, Azure, GCP), SaaS platforms (Box,
              HashiCorp, Databricks), and identity providers such as Okta. Ingestion pipelines and backend services,
              built primarily in Golang and Java, extract authorization metadata via RESTful APIs and microservices
              without deploying invasive host agents or risking service interruptions. For proprietary enterprise
              applications, the Open Authorization API allows organizations to publish access metadata into the
              platform. Operational security and tenant trust rely on complete tenant isolation, inflight and at-rest
              encryption, zero external access by design, and regular independent penetration testing. The platform's
              security controls and design practices hold certifications for SOC 2 Type I, SOC 2 Type II, and ISO 27001.
              Key engineering and operational risks center on connector maintenance overhead as third-party APIs evolve,
              potential data synchronization latency across sprawling cloud environments, and the post-acquisition
              integration roadmap as Veza transitions into ServiceNow's broader product portfolio.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Architectural Shift from Authentication to Authorization
            body: >-
              Veza's core technological defensibility rests on decoupling authorization analysis from authentication.
              Traditional identity providers verify user identity at login (authentication), but fail to track what data
              assets an authenticated entity can manipulate across multi-cloud environments (effective authorization).
              By building a dedicated metadata graph that continuously parses cloud policies into a canonical
              create-read-update-delete model, Veza addresses the blind spot where credential abuse and privilege
              escalation attacks occur.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: callout
            title: Connector Fragility and Upstream API Dependency
            body: >-
              Because Veza operates an agentless architecture extracting authorization metadata from more than 300 cloud
              and SaaS integrations, platform data freshness is fundamentally constrained by third-party API rate
              limits, polling windows, and upstream schema changes. While read-only integration protects operational
              stability, any breaking change in external IAM permission models requires rapid connector updates to
              prevent graph blind spots.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise security is the core buying surface
        blocks:
          - type: paragraph
            body: >-
              Veza is positioned for complex enterprises rather than lightweight identity administration. Its official
              surfaces address security, identity, compliance, data, and platform teams that need to map effective
              permissions across SaaS, cloud, on-premises, data, and custom systems. SecurityWeek independently
              described the underlying product as software for enterprise SaaS applications and cloud platforms, while
              LeadIQ repeats the focus on global enterprises and names Wynn Resorts, Expedia, and Blackstone. LeadIQ is
              low-reputation corroboration and even carries inconsistent location data, so it should not be treated as
              authoritative. The strongest segmentation conclusion is therefore functional: CISOs and identity leaders
              are likely economic buyers, identity and security operators are primary users, and application or data
              owners participate in reviews and remediation. No source in the assigned set discloses segment-level
              revenue, ACV, geography mix, or payer concentration.
            claimRefs:
              - CU001
              - CU004
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU010
              - CU013
              - CU014
      - number: '6.2'
        title: Named references and observed data scale indicate real use, not disclosed economics
        blocks:
          - type: paragraph
            body: >-
              Veza's homepage and syndicated company release name recognizable enterprises and describe
              identity-security use cases, providing stronger evidence than a logo wall alone. The 2026 State of
              Identity and Access report says Veza analyzed more than 230 billion permissions across 160 enterprises
              using data observed through 2025. That is evidence of substantial technical visibility, but it is not a
              disclosed paying-customer count, revenue measure, or retention cohort. The product page also claims more
              than 300 agentless, read-only integrations; this broadens the potential deployment surface without proving
              that each connector is actively used. The public proof therefore supports enterprise relevance and
              production-like data scale, while leaving adoption depth, licensed modules, deployment dates, and
              independently verified outcomes unresolved.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU014
      - number: '6.3'
        title: The operating model is designed around renewals and expansion
        blocks:
          - type: paragraph
            body: >-
              A reposted Veza customer-success role describes portfolios of approximately eight to ten strategic
              enterprise customers, executive engagement with CIOs and CISOs, multi-year success plans, and direct
              responsibility for renewal and expansion outcomes. It also identifies adoption depth, executive
              engagement, and realized value as leading indicators of account health. Those statements show the intended
              commercial motion, not achieved retention. The reviewed materials disclose no NRR, GRR, logo churn,
              renewal rate, cohort expansion, contract length, implementation duration, or customer-satisfaction
              denominator. They also do not identify top-customer exposure. Investors should therefore treat the
              high-touch model as a plausible durability mechanism whose effectiveness remains private, rather than as
              evidence of durable recurring revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
              - CU012
      - number: '6.4'
        title: ServiceNow may expand distribution while narrowing platform neutrality
        blocks:
          - type: paragraph
            body: >-
              Veza's company archive shows continued 2026 publication activity around the ServiceNow combination, but
              the assigned evidence does not quantify post-close cross-sell, retained customers, or packaging changes.
              Netwrix, a direct competitor rather than an independent benchmark, argues that folding Veza into
              ServiceNow's security portfolio creates roadmap and pricing uncertainty for non-ServiceNow customers. It
              also says remediation coverage depends on connectors and that heterogeneous legacy or custom on-premises
              environments may require manual intervention. The critique is commercially motivated, yet it identifies
              diligence questions that the official sources do not answer. Renewal analysis should test whether
              ServiceNow distribution improves expansion enough to offset neutrality concerns, connector gaps, migration
              friction, and possible changes in commercial terms.
            claimRefs:
              - CU009
              - CU010
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Retention remains the decisive missing customer metric
            body: >-
              Public references demonstrate use cases and enterprise relevance, but no assigned source discloses NRR,
              GRR, churn, renewal rates, customer concentration, or comparable cohorts.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Topology and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Evaluating enterprise authorization and access governance risks requires separating foundational identity
              security posture from the acute operational dependencies introduced by multi-cloud infrastructure and
              strategic acquisition. Veza addresses structural enterprise access vulnerabilities where workers
              accumulate excessive entitlements and dormant accounts multiply across fragmented identity providers.
              However, deploying an authorization graph across diverse software-as-a-service, cloud-native
              infrastructure, and emerging AI agent environments exposes organizations to operational complexity,
              integration drift, and architectural lock-in. This chapter ranks risk exposures across regulatory
              compliance, operational execution, platform dependencies, and financial capitalization based on verified
              technical characteristics and published market evaluations.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory Compliance and Legal Liabilities
        blocks:
          - type: paragraph
            body: >-
              Regulatory mandates including GDPR, HIPAA, and PCI-DSS have expanded beyond basic perimeter authentication
              to require verifiable least-privilege authorization and continuous entitlement auditing. Organizations
              face severe financial and legal penalties if unauthorized identities or over-privileged service accounts
              access protected customer or healthcare records. Traditional role-based access controls and manual
              certification campaigns frequently fail audit scrutiny because they do not reflect true effective
              permissions across complex hybrid multi-cloud data stores. While Veza provides out-of-band streaming
              metadata translation and automated access reviews to substantiate compliance, enterprises remain legally
              accountable for access misconfigurations, toxic combinations, and audit coverage gaps.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational, Security, and Architectural Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Operational security risks center on the sheer scale and complexity of identity ecosystems across
              enterprise data architectures. As organizations adopt distributed cloud architectures, non-human
              identities such as APIs, service accounts, and automated AI agents rapidly outnumber human personnel,
              multiplying potential attack paths and toxic permission combinations. When access permissions drift or
              service accounts retain dormant administrative privileges, attackers can leverage credential abuse to
              traverse enterprise databases and SaaS applications undetected. Veza's Access Platform counters these
              failure modes through continuous access monitoring, automated lifecycle deprovisioning, and pre-built
              policy violation queries, but deployment efficacy remains bounded by connector coverage and cross-platform
              synchronization latency.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Platform Dependencies, Acquisition Dynamics, and Financial Posture
        blocks:
          - type: paragraph
            body: >-
              Platform concentration and supplier dependency represent critical structural risks following ServiceNow's
              agreement to acquire Veza. Third-party evaluations emphasize that deep technical embedding within
              ServiceNow's AI Platform risks vendor lock-in, organizational support restructuring, and roadmap
              redirection away from non-ServiceNow environments. Concurrently, while Veza secured $108 million in Series
              D capital at an $808 million standalone valuation prior to transaction execution, standalone unit
              economics, annual recurring revenue, and cash burn metrics remain private. Customer organizations
              evaluating long-term authorization architecture must weigh the operational benefits of unified ServiceNow
              security workflows against switching costs and ecosystem neutrality risks.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: ServiceNow Platform Embedding and Vendor Lock-in
            body: >-
              Industry evaluations from CloudEagle highlight that as Veza becomes embedded within ServiceNow's
              Autonomous Security & Risk stack, replacing or decoupling its authorization engine becomes significantly
              harder. Enterprise customers face potential shifts in support structures, account management, and pricing
              models alongside strategic roadmap convergence.
            calloutType: risk
            claimRefs:
              - CR012
              - CR013
          - type: callout
            title: Authorization Gaps as the Primary Breach Catalyst
            body: >-
              While legacy cybersecurity investments have focused heavily on perimeter defense and initial identity
              authentication, enterprise breaches predominantly stem from authorization abuse and toxic permission
              combinations. Securing data requires granular continuous mapping of effective permissions rather than
              passive role-based assumptions.
            calloutType: insight
            claimRefs:
              - CR003
              - CR008
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and Investability
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more, with medium confidence, high information risk, and an unknown current
              valuation stance. The strongest public anchor is the April 2025 Series D: Veza raised $108 million,
              independent coverage and Forge place the post-money mark at about $808 million, and the company said
              cumulative equity raised reached $235 million [CV001, CV002, CV003]. That anchor is historical rather than
              investable. Forge now records an M&A announcement in December 2025 and closing in March 2026, labels
              market activity limited, and shows no available price [CV011, CV012]. Public evidence therefore does not
              support a current standalone entry price, target return, or holding-period case [CV016].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV011
              - CV012
              - CV016
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is strategic rather than conventionally financial. Veza reported more than doubling annual
              recurring revenue year over year and enterprise net revenue retention nearing 150% in its 2025 financing
              disclosure [CV004, CV005]. Its current product material claims more than 300 integrations, while its
              platform spans human, machine, and third-party identities across on-premise, SaaS, application, and data
              environments [CV008, CV009]. CNBC also reported a Gartner analyst's view that Veza focused on access
              visibility where adjacent providers lacked technology [CV010]. The anti-thesis is disclosure quality: CNBC
              said Veza was not disclosing revenue, and Forge cautions that its private-market data may rely on limited
              inputs without audit or independent verification [CV006, CV014]. Strategic participation from enterprise
              software vendors is useful validation, but it is not a substitute for audited economics [CV007].
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Scenarios, Comparables, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports relative scenarios, not precise return probabilities or dollar ranges. A
              bull outcome would require disclosed acquisition consideration above the $808.05 million Series D mark and
              proof that product breadth translated into durable economics. A base outcome is simply a completed
              strategic exit whose value to each security class remains indeterminate. A bear outcome is consideration
              below the last round or a waterfall that reduces common-holder proceeds; neither can be quantified without
              deal documents. Forge's own-company financing history provides only a milestone reference, moving from a
              reported $493.78 million Series C post-money valuation to $808.05 million at Series D [CV013, CV002]. It
              is not a public-company comparable set, and the current record does not support substituting named public
              peers or unsupported revenue multiples [CV006, CV016].
            claimRefs:
              - CV002
              - CV006
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit Readiness and Diligence Triggers
        blocks:
          - type: paragraph
            body: >-
              Veza has already reached a recorded strategic exit, so diligence should focus on realized security-level
              proceeds and post-close integration rather than IPO readiness [CV011]. The view improves only if
              definitive documents disclose purchase consideration, payment mix, rollover or earnout terms, and the
              preference waterfall; audited standalone revenue, gross margin, retention cohorts, and cash use are also
              needed to judge whether the 2025 mark represented efficient growth [CV006, CV016]. The view weakens if
              disclosed consideration is below $808.05 million, if material value is contingent, or if integration
              reduces product autonomy and customer retention. Forge's limited activity and unavailable price mean
              secondary indications cannot close these gaps [CV012], while its general warning that private securities
              are illiquid reinforces the need for documentary evidence rather than a modeled liquidity assumption
              [CV015].
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV011
              - CV012
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Veza may be a strategically valuable asset, but the public record does not establish the acquisition price
              or a current standalone security price. The call remains research-more until definitive deal economics and
              audited operating metrics are available [CV006, CV011, CV012, CV016].
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV016
          - type: callout
            title: Do not equate funding with value available
            body: >-
              The $235 million cumulative equity figure describes capital raised, not cash available at exit, and the
              $808.05 million Series D post-money valuation does not establish acquisition consideration or
              common-holder proceeds [CV002, CV003, CV016].
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV016
