      - number: '4.2'
        title: Commercial Traction, Expansion Dynamics, and Public Metrics
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed financial milestones indicate substantial commercial momentum preceding Veza's
              strategic exit. In conjunction with its $108 million Series D financing round announced in April 2025, the
              company reported that it more than doubled its annual recurring revenue (ARR) year-over-year during 2024.
              Furthermore, Veza reported enterprise Net Revenue Retention (NRR) nearing 150%, demonstrating extensive
              expansion across existing customer deployments as security teams connected additional cloud services,
              database repositories, and SaaS platforms to the Access Graph. Traction in top-tier enterprise tiers was
              highlighted by customer adoption across 10 Fortune 500 and 16 Fortune 1000 organizations, including major
              institutions such as Blackstone, Workday, Sallie Mae, and Snowflake. Strategic corporate venture
              investments from Atlassian Ventures, Workday Ventures, and Snowflake Ventures in the Series D round served
              as both financial backing and commercial validation of Veza's integrations. However, Veza has never
              publicly disclosed its absolute baseline ARR in US dollars, its annual contract value (ACV) distribution,
              or its customer concentration percentages, creating a material gap for financial underwriting.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Cost Structure, Capital Adequacy, and Acquisition Transition
        blocks:
          - type: paragraph
            body: >-
              Veza's cost structure reflects a typical high-growth enterprise infrastructure software profile, dominated
              by technical headcount, cloud compute expenses for graph-processing infrastructure, and global enterprise
              go-to-market investments. Across four primary institutional equity rounds, Veza raised a cumulative $235
              million in total equity financing from investors including New Enterprise Associates, Accel, Google
              Ventures (GV), True Ventures, Norwest Venture Partners, Ballistic Ventures, and Blackstone Innovations
              Investments. Headcount expanded from approximately 110 employees around its 2022 launch to more than 190
              worldwide by mid-2025, with public industry profiles tracking approximately 191 to 230 employees prior to
              acquisition. While the $108 million Series D round at an $808 million post-money valuation provided
              multi-year balance sheet runway, standalone cash burn and gross margin dynamics were superseded by
              ServiceNow's acquisition of the company. With Veza transitioning into ServiceNow's Autonomous Security and
              Risk portfolio, standalone capital adequacy and financing dependencies have been absorbed by the parent
              enterprise, rendering forward cash runway and independent refinancing triggers moot while permanently
              locking private standalone margin and unit-economics data.
