  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Taxonomy, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Enterprise identity architecture has reached an inflection point where conventional Identity and Access
              Management (IAM) systems fail to govern effective permissions in distributed environments. Historically,
              organizations relied on identity providers such as Okta and legacy directory architectures to authenticate
              human users and assign broad role-based groupings. However, modern cloud architectures and microservices
              disaggregate data across disparate cloud service providers, data platforms such as Snowflake, and SaaS
              business applications. As industry analyst Omdia notes, modern identity security spans three contiguous
              markets: Identity Security Posture Management (ISPM), Identity Governance and Administration (IGA), and
              Non-Human Identity (NHI) security. Within this market taxonomy, included software spend encompasses
              fine-grained authorization mapping, automated user access certifications, toxic combination discovery,
              service account governance, and machine identity tracking. Conversely, excluded spend includes pure-play
              authentication endpoints, physical biometric badges, consumer identity verification platforms, and network
              boundary firewalls. Status-quo substitutes remain widespread: large enterprise security teams frequently
              attempt to audit permissions using homegrown scripts, manual spreadsheet exports, or static ticketing
              workflows across ServiceNow and Jira. These status-quo workarounds fail to resolve effective multi-cloud
              access controls, exposing organizations to excessive privileges, orphaned accounts, and audit
              deficiencies.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses, Growth Trajectory, and TAM Constraints
        blocks:
          - type: paragraph
            body: >-
              Evaluating market sizing for authorization-centric identity security requires decomposing broad
              cybersecurity estimates into verifiable product categories. Global spending across enterprise identity
              security and governance represents a rapidly expanding subset of cloud infrastructure protection. While
              top-down analyst summaries frequently project multi-billion-dollar total addressable markets across
              broader IAM and data security software categories, bottom-up enterprise adoption reveals critical boundary
              constraints. Specifically, Veza's addressable boundary concentrates on enterprise environments managing
              complex hybrid multi-cloud footprints, extensive SaaS deployments, and heterogeneous data lakes. In
              enterprise environments, machine identities and API service accounts outnumber human staff members,
              multiplying the volume of managed entitlements. Industry data from Veza's 2026 State of Identity and
              Access Report indicates that in typical enterprise environments, an average worker holds 96,000
              entitlements, 38% of identity provider accounts are dormant, and only 55% of permissions are safe and
              compliant. Sizing the Serviceable Addressable Market (SAM) is therefore constrained by organizations
              operating over 300 applications and cloud systems that necessitate automated graph-based authorization
              translation rather than basic single-sign-on controls. Sizing the Serviceable Obtainable Market (SOM)
              requires analyzing deployment willingness among Fortune 500 enterprises, regulated financial institutions,
              and global hospitality chains managing tens of billions of permissions.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
