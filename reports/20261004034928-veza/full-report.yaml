      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics in the authorization intelligence market span distinct technical buyers and
              functional stakeholders. The primary economic buyer is typically the Chief Information Security Officer
              (CISO) or VP of Information Security, who owns corporate risk reduction, audit defensibility, and
              regulatory compliance posture. Secondary budget stakeholders include Identity and Access Management (IAM)
              directors, Cloud Platform and Site Reliability Engineering (SRE) leads, and Data Governance officers.
              Enterprise case studies, such as Choice Hotels International, illustrate that cloud migration to
              microservice architectures on AWS creates severe entitlement complexity across distributed data stores.
              Adoption workflows typically initiate when security and platform engineering teams discover orphaned
              accounts, unattached policies, or audit-readiness deficiencies that manual reviews cannot remediate.
              Platforms that ingest metadata agentlessly out-of-band and route policy violations into existing workflow
              backbones like ServiceNow accelerate initial deployment. However, purchasing authority often fragments
              between infrastructure engineering teams operating cloud databases and corporate IT teams managing
              traditional directory access, requiring cross-departmental consensus to finalize enterprise contracts.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Autonomous AI Dynamics, and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              Market momentum in authorization governance is propelled by the explosion of non-human identities,
              regulatory mandates, and enterprise deployment of autonomous AI agents. As organizations deploy AI
              assistants and automated agents across enterprise systems, machine tokens and automated workflows rapidly
              multiply. Analysts at HFS Research emphasize that while enterprise automation platforms enable AI agents
              to execute tasks across customer service and IT operations, autonomous execution requires rock-solid
              authorization rules to prevent unauthorized enterprise data traversal. Concurrently, regulatory frameworks
              including GDPR, HIPAA, and Sarbanes-Oxley require verifiable access controls and least-privilege
              enforcement to mitigate ransomware risks. Despite these tailwinds, material adoption constraints govern
              deployment velocity. Competitive evaluations by Linx Security point out that passive visibility engines
              requiring manual query execution can create operational friction compared to automated proactive
              remediation. Furthermore, the reported $1 billion acquisition of Veza by ServiceNow introduces platform
              dependency and vendor lock-in concerns for enterprise buyers evaluating multi-year ecosystem commitments.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Autonomous AI Agents as the Critical Catalyst for Authorization
            body: >-
              The adoption of autonomous enterprise agents fundamentally transforms identity security from a human
              governance problem into a real-time machine authorization challenge. As organizations deploy AI assistants
              to take actions across enterprise databases and SaaS tools, static role-based access models break down.
              Authorization graphs that map effective permissions down to specific data tables and endpoints become
              mandatory infrastructure to ensure AI agents do not traverse unauthorized corporate records.
            calloutType: insight
            claimRefs:
              - CM006
              - CM013
              - CM014
          - type: callout
            title: Post-Acquisition Platform Lock-in and Remediation Friction
            body: >-
              While integration into ServiceNow provides unprecedented distribution across enterprise IT workflows, it
              introduces strategic friction for non-ServiceNow environments. Third-party competitive evaluations note
              that Veza's historically passive risk discovery and reliance on external ticketing for remediation may
              alienate prospective buyers who require automated, in-platform policy enforcement or who operate
              heterogeneous IT service management ecosystems.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
