      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Veza's moat appears conditional, not absolute. The Access Graph and integration footprint can create a
              useful data-model and workflow advantage, especially if buyers need consistent effective-permission
              analysis across many systems. However, the numerous alternatives identified by two directories show that
              governance, lifecycle automation, non-human identity coverage, and AI-oriented access controls are
              contested categories. Veza itself reports an average of 96,000 entitlements per worker in a typical
              enterprise, illustrating the complexity that can reward a normalized graph while also attracting suite
              vendors and internal platform teams. A C1.ai page argues that ServiceNow integration will delay the
              roadmap and create migration risk, but that is a competitor-issued forecast, not independent evidence of
              an observed delay. Durability therefore depends on verified connector fidelity, remediation outcomes,
              post-transaction product investment, and renewal behavior, none of which the assigned public evidence
              measures directly.
