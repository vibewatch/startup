      - number: '3.2'
        title: Capability Boundaries and Differentiation
        blocks:
          - type: paragraph
            body: >-
              Veza's public differentiation is its Access Graph: the company says it normalizes identities and
              entitlements across human, machine, third-party, cloud, SaaS, data, and on-premises contexts, expresses
              effective permissions in create-read-update-delete terms, and connects through more than 300 agentless
