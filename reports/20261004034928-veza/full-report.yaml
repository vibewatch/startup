  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Mechanics, and Pricing Opacity
        blocks:
          - type: paragraph
            body: >-
              Veza generates software revenue through an enterprise subscription software-as-a-service (SaaS) and
              software licensing model anchored on its Access Platform. The platform provides Identity Security Posture
              Management (ISPM), Identity Governance and Administration (IGA), non-human identity (NHI) management, and
              access lifecycle automation. Monetization is fundamentally structured around multi-system enterprise scale
              rather than self-service consumption. Commercial pricing is not published on public catalog tiers;
              instead, commercial agreements require direct sales quoting and scale based on monitored target systems,
              connected data sources, directory identities, and optional modules such as Access AI, Access Requests, and
              Access AuthZ. While list pricing is opaque, enterprise go-to-market execution relies on annual and
              multi-year upfront SaaS subscriptions, complemented by channel distribution via the Veza Identity Partner
              Program (VIPP) spanning value-added resellers, global system integrators, and cloud marketplace alliances.
              Because Veza operates as an analytics and authorization governance control plane connecting to more than
              250 to 300 agentless integrations across AWS, Microsoft Azure, Google Cloud, Snowflake, and Workday, its
              contract sizes historically reflect enterprise-wide security scope, driving strong expansion inside
              large-scale deployments.
