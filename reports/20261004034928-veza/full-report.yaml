        title: Commercial and Switching Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercial comparison is constrained by uneven disclosure. RFP.wiki reports no public Veza pricing and
              assigns a 1.4-of-5 Commercial Clarity score. C1.ai publishes list-price assertions for Okta and Microsoft
              Entra, but those figures come from a competing vendor rather than the vendors' current pricing pages, so
              they are useful only as directional procurement inputs. Veza's claimed connector breadth may lower initial
              data-ingestion friction, yet durable lock-in would arise later from normalized permission models, review
              campaigns, lifecycle policies, remediation workflows, and audit evidence embedded in operations. The pool
              contains no customer switching study, contract sample, renewal data, or independently measured migration
