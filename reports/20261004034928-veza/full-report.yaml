        - Forge records M&A closed in March 2026 and no available price
        - Require transaction documents and security-level proceeds before assessing returns.
    notes: >-
      Assessments use the April 2025 financing as a historical reference and do not estimate undisclosed acquisition
      consideration or holder proceeds.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV011
      - CV012
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Lens
      - Evidence-Bounded Argument
      - What Would Change the View
    rows:
      - - 'Thesis: growth signal'
        - Veza said ARR more than doubled year over year and enterprise NRR neared 150%.
        - Audited ARR and cohort data would convert directional growth into underwritable economics.
      - - 'Thesis: product breadth'
        - >-
          Current company material claims 300+ integrations and coverage across human, machine, and third-party
          identities.
        - Independent production benchmarks and renewal evidence would strengthen the moat case.
      - - 'Thesis: strategic validation'
        - Atlassian Ventures, Workday Ventures, and Snowflake Ventures participated in the Series D.
        - >-
          Evidence of sourced pipeline, consumption lift, or paid deployments would show commercial rather than
          financial optionality.
      - - 'Anti-thesis: disclosure and data quality'
        - Absolute revenue was not disclosed, and Forge warns its data may use limited, unaudited inputs.
        - Audited financials and definitive acquisition documents would reduce the information discount.
    notes: >-
      Company-issued growth and product statements are presented as claims, while independent sources provide financing,
      positioning, and disclosure context.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull, Base, and Bear Scenarios
    columns:
      - Scenario
      - Explicit Assumptions
      - Valuation / Return Range
      - Probability Signal
      - Downside or Confirmation Trigger
    rows:
      - - Bull
        - Disclosed consideration exceeds the last Series D mark; product breadth and retention persist after close.
        - Above $808.05M, but upper bound and security-level return are unsupported.
        - Positive only if definitive consideration and operating metrics are disclosed.
        - Fails if consideration is contingent or retention weakens.
      - - Base
        - The recorded acquisition remains closed, but consideration and the capitalization waterfall stay private.
        - Indeterminate; no defensible lower or upper bound from public evidence.
        - Current public record supports this as the central evidence state, not a numerical probability.
        - Changes when transaction documents reveal payment mix and proceeds.
      - - Bear
        - Consideration is below the Series D mark or preferences, earnouts, and rollover terms reduce common proceeds.
        - Below $808.05M, but floor and loss by security class are unsupported.
        - Risk remains live while price, preferences, and payment terms are undisclosed.
        - Confirmed by a sub-mark price, contingent value, or weak post-close retention.
    notes: >-
      Ranges are deliberately relative to the reported Series D post-money valuation; assigning numerical probabilities,
      revenue multiples, or security-level returns would exceed the assigned evidence.
    claimRefs:
      - CV002
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Eight dated evidence checkpoints trace Veza from founding through financing, governance, and ServiceNow platform
      integration without treating reported talks as signed transaction terms.
    data:
      items:
        - date: '2020'
          label: Founded
          detail: Tarun Thakur, Maohua Lu, and Rob Whitcher started Veza.
          tone: neutral
        - date: '2022-04-27'
          label: Emergence from stealth
          detail: A company-issued release announced more than $110M in funding.
          tone: positive
        - date: '2023-08-10'
          label: Strategic investments
          detail: Capital One Ventures and ServiceNow Ventures invested, bringing stated total financing to $125M.
          tone: positive
        - date: '2023-08-10'
          label: Integration footprint
          detail: Veza said it had surpassed 125 integrations.
          tone: positive
        - date: '2023-08-10'
          label: Board signal
          detail: The company listed Phil Venables as appointed to its board.
          tone: neutral
        - date: '2025-04-28'
          label: Series D
          detail: NEA led a $108M round; SecurityWeek stated a $808M valuation.
          tone: positive
        - date: '2025-11-27'
          label: Reported acquisition discussions
          detail: CIO reported advanced ServiceNow talks above $1B and unresolved integration questions.
          tone: warning
        - date: '2026-05-05'
          label: ServiceNow platform integration
          detail: ServiceNow described Veza as integrated into its AI Platform for human and non-human identity governance.
          tone: neutral
    approximationNotes: >-
      The 2023 board and integration checkpoints use the announcement date because the underlying release does not
      provide separate event dates. The 2025 acquisition item is explicitly a report of discussions, not a confirmed
      purchase price or close.
    claimRefs:
      - CO001
      - CO004
      - CO009
      - CO011
      - CO012
      - CO013
      - CO015
      - CO016
  - id: FM001
    title: Identity Authorization Market Sizing Hierarchy
    type: pyramid
    summary: >-
      Hierarchical market sizing layers illustrating how broad enterprise IAM spend narrows to authorization
      intelligence and AI governance.
    data:
      items:
        - label: 'Total Addressable Market (TAM): Global Enterprise IAM & Identity Security'
          valueNote: >-
            Broad enterprise IT spending encompassing authentication, single sign-on, directory services, and endpoint
            access
        - label: 'Contiguous Segment Layer: Identity Security Posture Management (ISPM)'
          valueNote: Continuous permissions discovery and effective access mapping across SaaS and enterprise clouds
        - label: 'Contiguous Segment Layer: Identity Governance & Administration (IGA)'
          valueNote: >-
            Policy-driven entitlement administration, automated access certifications, and joiner-mover-leaver lifecycle
            workflows
        - label: 'Contiguous Segment Layer: Non-Human Identity (NHI) Security'
          valueNote: Inventory, ownership tracking, and privilege control for machine accounts, API keys, and service tokens
        - label: 'Serviceable Addressable Market (SAM): Multi-Cloud Authorization & Entitlement Governance'
          valueNote: >-
            Enterprises with hybrid multi-cloud footprints, 300+ SaaS integrations, and severe non-human entitlement
            sprawl
        - label: 'Serviceable Obtainable Market (SOM): Enterprise Authorization Intelligence & Governance'
          valueNote: Large organizations requiring graph-based effective permission mapping and least-privilege enforcement
        - label: 'Target Expansion Layer: Autonomous AI Agent & Machine Identity Governance'
          valueNote: Enterprises deploying autonomous AI workflows requiring real-time authorization control planes
    approximationNotes: >-
      Market layers represent qualitative functional sizing boundaries; absolute dollar totals are constrained by
      undisclosed private financials and pending transaction integration.
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM006
      - CM007
      - CM014
  - id: FP001
    title: 'Directional Positioning: Authorization Depth vs. Adjacent Control Breadth'
    type: quadrant
    summary: >-
      Ordinal placement separates focused authorization depth from breadth across authentication, governance, PAM, and
      network-access controls.
    data:
      points:
        - label: Veza
          x: 5
          'y': 3
          note: Focused authorization graph; complementary control planes remain external.
        - label: RSA
          x: 2
          'y': 4
          note: Authentication-led in the retained RFP.wiki comparison.
        - label: Okta
          x: 3
          'y': 4
          note: IdP-led suite placement based on a competitor-issued overview.
        - label: Microsoft Entra
          x: 3
          'y': 5
          note: Broad Microsoft identity context; cross-system depth not benchmarked.
        - label: SailPoint / Saviynt
          x: 4
          'y': 4
