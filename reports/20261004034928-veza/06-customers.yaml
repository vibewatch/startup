  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: Customer-level and cohort-level NRR, GRR, logo churn, renewal rates, contract durations, and realized expansion.
      whyItMatters: Durability and land-and-expand economics cannot be evaluated from named references or a customer-success job design.
      diligencePath: Obtain anonymized monthly cohorts, renewal schedules, gross and net retention bridges, and the ten largest expansion and contraction cases.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: Revenue by top customer, customer segment, geography, channel, and ServiceNow-originated versus direct account.
      whyItMatters: Concentration and channel dependency could materially alter revenue durability after the acquisition.
      diligencePath: Request the top-20 customer schedule with ARR, contract term, renewal date, products, origin channel, and post-close status.
      relatedQuestionRefs: [QU005, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: Exhaustive customer roster with production or pilot status, deployment dates, licensed modules, and quantified outcomes.
      whyItMatters: Public naming does not establish the breadth, maturity, or reference quality of the installed base.
      diligencePath: Reconcile CRM and billing exports to implementation records, then independently reference-check a stratified sample of current and churned accounts.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: independent-corroboration
      missingEvidence: Independent customer interviews or procurement records that verify outcomes for the named deployments.
      whyItMatters: Most available customer proof is issued or selected by Veza, and the third-party directory has weak reliability.
      diligencePath: Interview identity leaders at named customers and obtain redacted contracts, renewal orders, implementation milestones, and outcome baselines.
      relatedQuestionRefs: [QU008]
