        - Official homepage associates Veza with compliance and least-privilege work
        - Not explicitly disclosed
        - Customer quote links less access with lower identity risk
        - Public source omits baseline, measured reduction, timeframe, and renewal status
    notes: >-
      Partial enumeration limited to names and use cases visible in successful assigned sources;
      public evidence does not establish an exhaustive customer list or contract status.
    enumerationScope:
      coverage: sample
      basis: Named organizations visible in the successful assigned customer-evidence sources.
    claimRefs: [CU002, CU004, CU014]
figures:
  - id: FU001
    title: Enterprise customer journey and expansion loop
    type: journey-map
    summary: >-
      Veza's public materials describe a workflow from access visibility to governance and
      remediation, supported by high-touch customer-success activities.
    data:
      items:
        - label: Discover
          detail: Map users, groups, roles, permissions, and resources across connected systems.
          touchpoints:
            - Access Graph
            - Integrations
        - label: Diagnose
          detail: Identify dormant access, excessive privilege, policy violations, and drift.
          touchpoints:
            - Access Visibility
            - Access Intelligence
        - label: Govern
          detail: Prioritize risky access and execute review campaigns with business context.
          touchpoints:
            - Access Reviews
            - Separation of Duties
        - label: Remediate
          detail: Revoke, provision, deprovision, or route actions through supported workflows.
          touchpoints:
            - Lifecycle Management
            - Access AuthZ
        - label: Prove value
          detail: Tie adoption and realized outcomes to executive success plans and reviews.
          touchpoints:
            - Customer Success
            - Executive Business Reviews
        - label: Renew and expand
          detail: Extend coverage to additional systems, identities, and governance use cases.
          touchpoints:
            - Additional integrations
            - NHI and AI-agent security
    approximationNotes: >-
      Conceptual sequence derived from product and customer-success materials; no stage conversion
      rates, elapsed times, or customer-level expansion rates are publicly disclosed.
    claimRefs: [CU011, CU012]
