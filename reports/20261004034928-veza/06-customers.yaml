        - Company says it uses Veza for identity-security use cases
        - Not explicitly disclosed
        - No quantified outcome in the assigned sources
        - Company-issued naming; licensed modules and deployment date are private
      - - Blackstone
        - Large enterprise / financial services
        - Official material links Blackstone to identity-governance modernization
