company:
  name: Veza
chapter:
  number: 6
  title: Customers
  summary: >-
    Veza presents credible enterprise adoption signals through named security and identity
    references, a company-reported dataset spanning 160 enterprises, and a high-touch customer
    success model. The public record still does not disclose customer count, retention, contract
    duration, expansion rates, or concentration, while the ServiceNow integration creates a new
    source of roadmap and pricing uncertainty for customers outside that ecosystem.
sections:
  - id: buyer-and-segment-map
    title: Enterprise security is the core buying surface
    body: >-
      Veza is positioned for complex enterprises rather than lightweight identity administration.
      Its official surfaces address security, identity, compliance, data, and platform teams that
      need to map effective permissions across SaaS, cloud, on-premises, data, and custom systems.
      SecurityWeek independently described the underlying product as software for enterprise SaaS
      applications and cloud platforms, while LeadIQ repeats the focus on global enterprises and
      names Wynn Resorts, Expedia, and Blackstone. LeadIQ is low-reputation corroboration and even
      carries inconsistent location data, so it should not be treated as authoritative. The
      strongest segmentation conclusion is therefore functional: CISOs and identity leaders are
      likely economic buyers, identity and security operators are primary users, and application or
      data owners participate in reviews and remediation. No source in the assigned set discloses
      segment-level revenue, ACV, geography mix, or payer concentration.
    claimRefs: [CU001, CU004, CU014]
    tableRefs: [TU001]
  - id: adoption-and-reference-proof
    title: Named references and observed data scale indicate real use, not disclosed economics
    body: >-
      Veza's homepage and syndicated company release name recognizable enterprises and describe
      identity-security use cases, providing stronger evidence than a logo wall alone. The 2026
      State of Identity and Access report says Veza analyzed more than 230 billion permissions
      across 160 enterprises using data observed through 2025. That is evidence of substantial
      technical visibility, but it is not a disclosed paying-customer count, revenue measure, or
      retention cohort. The product page also claims more than 300 agentless, read-only
      integrations; this broadens the potential deployment surface without proving that each
      connector is actively used. The public proof therefore supports enterprise relevance and
      production-like data scale, while leaving adoption depth, licensed modules, deployment dates,
      and independently verified outcomes unresolved.
    claimRefs: [CU002, CU003, CU004, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: The operating model is designed around renewals and expansion
    body: >-
      A reposted Veza customer-success role describes portfolios of approximately eight to ten
      strategic enterprise customers, executive engagement with CIOs and CISOs, multi-year success
      plans, and direct responsibility for renewal and expansion outcomes. It also identifies
      adoption depth, executive engagement, and realized value as leading indicators of account
      health. Those statements show the intended commercial motion, not achieved retention. The
      reviewed materials disclose no NRR, GRR, logo churn, renewal rate, cohort expansion, contract
      length, implementation duration, or customer-satisfaction denominator. They also do not
      identify top-customer exposure. Investors should therefore treat the high-touch model as a
      plausible durability mechanism whose effectiveness remains private, rather than as evidence
      of durable recurring revenue.
    claimRefs: [CU005, CU006, CU007, CU008, CU012]
    figureRefs: [FU001]
  - id: post-acquisition-friction
    title: ServiceNow may expand distribution while narrowing platform neutrality
    body: >-
      Veza's company archive shows continued 2026 publication activity around the ServiceNow
      combination, but the assigned evidence does not quantify post-close cross-sell, retained
      customers, or packaging changes. Netwrix, a direct competitor rather than an independent
      benchmark, argues that folding Veza into ServiceNow's security portfolio creates roadmap and
      pricing uncertainty for non-ServiceNow customers. It also says remediation coverage depends
      on connectors and that heterogeneous legacy or custom on-premises environments may require
      manual intervention. The critique is commercially motivated, yet it identifies diligence
      questions that the official sources do not answer. Renewal analysis should test whether
      ServiceNow distribution improves expansion enough to offset neutrality concerns, connector
      gaps, migration friction, and possible changes in commercial terms.
    claimRefs: [CU009, CU010, CU015]
callouts:
  - calloutType: risk
    title: Retention remains the decisive missing customer metric
    body: >-
      Public references demonstrate use cases and enterprise relevance, but no assigned source
      discloses NRR, GRR, churn, renewal rates, customer concentration, or comparable cohorts.
    claimRefs: [CU007, CU008]
tables:
  - id: TU001
    title: Customer segmentation by buyer, user, and use case
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Strategic value
      - Evidence gap
    rows:
      - - Large regulated enterprise
        - "Buyer: CISO or CIO; users: identity, security, and compliance teams"
        - Access reviews, least privilege, audit readiness, and lifecycle governance
        - Named references include financial-services and large-enterprise organizations
        - High-value, multi-stakeholder governance deployment
        - No segment revenue, ACV, renewal, or contract-duration disclosure
      - - Cloud and SaaS-intensive enterprise
        - "Buyer: security or identity leader; users: cloud and platform teams"
        - Map effective permissions across cloud, SaaS, data, and identity systems
        - Company reports visibility across more than 230 billion permissions in 160 enterprises
        - Broad data surface can support expansion across systems
        - The 160-enterprise dataset is not identified as a paying-customer denominator
      - - Hybrid and on-premises enterprise
        - "Buyer: CIO or identity leader; users: IAM and application owners"
        - Govern legacy, custom, on-premises, and cloud access together
        - Product page claims more than 300 integrations
        - Connector breadth can lower deployment friction
        - Competitor alleges uneven remediation coverage outside supported connectors
      - - AI-agent and non-human identity program
        - "Buyer: CISO; users: security, identity, data, and AI platform teams"
        - Inventory and govern service accounts, keys, secrets, and AI-agent access
        - Official research reports a 17:1 machine-to-human identity ratio in its analyzed dataset
        - Emerging expansion surface adjacent to core identity governance
        - No public module attach rate, paying-account count, or realized customer outcome
    notes: >-
      Segments are analytical groupings from the reviewed product and customer materials; public
      sources do not disclose segment revenue, ACV, geography, or customer-count denominators.
    claimRefs: [CU001, CU003, CU010, CU013, CU014]
  - id: TU002
    title: Public customer adoption and operating-scale signals
    columns:
      - Metric or signal
      - Reported value
      - Period / basis
      - Source quality
      - Implication
      - Missing denominator or limitation
    rows:
      - - Permissions analyzed
        - More than 230 billion
        - Data observed through 2025 across 160 enterprises
        - Company-issued research with methodology disclosure
        - Indicates operation at large identity-data scale
        - Does not establish paying customers, ARR, or repeat usage
      - - Enterprises in research dataset
        - "160"
        - 2026 report using data observed through 2025
        - Company-issued and anonymized
        - Shows breadth of observed enterprise environments
        - Population selection, paid status, and overlap with customers are undisclosed
      - - Strategic accounts per customer-success portfolio
        - Approximately 8-10
        - Current 2026 job repost
        - Company-issued recruiting content syndicated by a job site
        - Supports a high-touch model for complex accounts
        - Staffing design is not total customer count or retention performance
      - - Product integrations
        - More than 300
        - Current product page at access date
        - Official product claim
        - Broadens potential deployment and expansion surfaces
        - No active-use rate, connector maturity distribution, or customer adoption denominator
    notes: >-
      Values retain the publishers' original units and populations; none should be interpreted as
      revenue, ARR, total paying customers, or independently audited retention.
    claimRefs: [CU003, CU005, CU013]
