company:
  name: "Veza"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Veza was founded in 2020 around authorization visibility and now presents an Access Graph spanning human, machine, and third-party identities. Its last supported standalone financing mark is the $808 million valuation reported with its April 2025 Series D; by May 2026, ServiceNow described Veza as integrated into its platform, while transaction terms and standalone financials remained undisclosed in the assigned evidence."

sections:
  - id: "identity-and-operating-status"
    title: "Identity, Product, and Operating Status"
    body: >-
      Veza traces its founding to 2020 and identifies Tarun Thakur, Maohua Lu,
      and Rob Whitcher as its three founders, with current company-page titles
      of chief executive officer, chief technology officer, and chief
      architect. The product is an enterprise access platform built around an
      Access Graph that unifies identities and entitlements across people,
      machines, third parties, applications, data, on-premises systems, and
      SaaS. CNBC reported Los Gatos, California, as headquarters in April 2025
      and a workforce of 200. A LeadIQ profile instead displayed Valley,
      Alabama, and a 51-200 employee band, so directory-derived location and
      staffing fields should not override the dated CNBC report without direct
      corporate confirmation. By May 2026, ServiceNow described Veza as
      integrated into the ServiceNow AI Platform, but the assigned evidence
      does not establish a purchase price, close date, or continuing
      standalone legal status.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Governance, and Key-Person Exposure"
    body: >-
      Public evidence supports the founders' titles but not a complete,
      current post-integration management roster or detailed professional
      biographies for all three founders. Their titles imply concentrated
      coverage of corporate direction, technical leadership, and architecture,
      yet the evidence does not quantify succession depth, retention terms, or
      decision rights. Veza's August 2023 announcement listed Phil Venables as
      newly appointed to the board, providing one verifiable governance
      datapoint rather than a complete board enumeration. The company page also
      lists nine institutional investors, but it does not disclose ownership,
      voting control, liquidation preferences, board seats, or secondary
      transactions. This leaves meaningful diligence work around key-person
      dependence and governance after the ServiceNow integration: the founder
      roles are visible, while the control framework and current board
      composition are not.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "capital-and-milestones"
    title: "Capital History, Scale Signals, and Strategic Transition"
    body: >-
      Veza emerged from stealth in April 2022 with a company-issued announcement
      of more than $110 million in funding. Strategic investments from Capital
      One Ventures and ServiceNow Ventures brought stated total financing to
      $125 million in August 2023, when Veza also said it had surpassed 125
      integrations. In April 2025, CNBC and SecurityWeek reported a $108 million
      Series D led by New Enterprise Associates; SecurityWeek gave a company
      valuation of $808 million, while CNBC described just over $800 million
      including fresh capital. CIO later reported $235 million raised since
      inception. Revenue remains opaque: CNBC said Veza did not disclose
      absolute revenue, only that sales more than doubled in the fiscal year
      ended in January 2025. CIO's November 2025 acquisition report cited
      discussions above $1 billion but also highlighted integration timing,
      licensing, and standalone-product uncertainty. Those reported talks are
      not a substitute for signed transaction terms.
    claimRefs:
      - "CO004"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO016"
    figureRefs:
      - "FO001"

