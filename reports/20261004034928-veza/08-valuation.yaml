    columns:
      - "Decision Dimension"
      - "Assessment"
      - "Investment Implication"
    rows:
      - - "Recommendation and confidence"
        - "Research-more; medium confidence"
        - "Do not underwrite a new standalone position from public evidence."
      - - "Risk rating and valuation stance"
        - "High information risk; current valuation unknown"
        - "Treat $808.05M as a historical Series D anchor, not a current price."
      - - "Investability"
        - "Forge records M&A closed in March 2026 and no available price"
        - "Require transaction documents and security-level proceeds before assessing returns."
    notes: "Assessments use the April 2025 financing as a historical reference and do not estimate undisclosed acquisition consideration or holder proceeds."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV006"
      - "CV011"
      - "CV012"
      - "CV016"
  - id: "TV002"
    title: "Thesis and Anti-Thesis"
    columns:
      - "Lens"
      - "Evidence-Bounded Argument"
      - "What Would Change the View"
    rows:
      - - "Thesis: growth signal"
        - "Veza said ARR more than doubled year over year and enterprise NRR neared 150%."
        - "Audited ARR and cohort data would convert directional growth into underwritable economics."
      - - "Thesis: product breadth"
        - "Current company material claims 300+ integrations and coverage across human, machine, and third-party identities."
        - "Independent production benchmarks and renewal evidence would strengthen the moat case."
      - - "Thesis: strategic validation"
        - "Atlassian Ventures, Workday Ventures, and Snowflake Ventures participated in the Series D."
        - "Evidence of sourced pipeline, consumption lift, or paid deployments would show commercial rather than financial optionality."
      - - "Anti-thesis: disclosure and data quality"
        - "Absolute revenue was not disclosed, and Forge warns its data may use limited, unaudited inputs."
        - "Audited financials and definitive acquisition documents would reduce the information discount."
    notes: "Company-issued growth and product statements are presented as claims, while independent sources provide financing, positioning, and disclosure context."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV014"
  - id: "TV003"
    title: "Bull, Base, and Bear Scenarios"
    columns:
      - "Scenario"
      - "Explicit Assumptions"
      - "Valuation / Return Range"
      - "Probability Signal"
      - "Downside or Confirmation Trigger"
    rows:
      - - "Bull"
        - "Disclosed consideration exceeds the last Series D mark; product breadth and retention persist after close."
        - "Above $808.05M, but upper bound and security-level return are unsupported."
        - "Positive only if definitive consideration and operating metrics are disclosed."
        - "Fails if consideration is contingent or retention weakens."
      - - "Base"
        - "The recorded acquisition remains closed, but consideration and the capitalization waterfall stay private."
        - "Indeterminate; no defensible lower or upper bound from public evidence."
        - "Current public record supports this as the central evidence state, not a numerical probability."
        - "Changes when transaction documents reveal payment mix and proceeds."
      - - "Bear"
        - "Consideration is below the Series D mark or preferences, earnouts, and rollover terms reduce common proceeds."
        - "Below $808.05M, but floor and loss by security class are unsupported."
        - "Risk remains live while price, preferences, and payment terms are undisclosed."
        - "Confirmed by a sub-mark price, contingent value, or weak post-close retention."
    notes: "Ranges are deliberately relative to the reported Series D post-money valuation; assigning numerical probabilities, revenue multiples, or security-level returns would exceed the assigned evidence."
    claimRefs:
      - "CV002"
      - "CV006"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
figures:
  - id: "FV001"
    title: "Recommendation Logic"
    type: "flow"
    summary: "A sequential evidence chain shows why strategic and product proof does not resolve the post-acquisition valuation gap."
    data:
      nodes:
        - id: "product-scope"
          label: "Broad authorization platform"
          description: "Company materials claim cross-environment identity coverage and more than 300 integrations."
        - id: "operating-signal"
          label: "Directional operating proof"
          description: "Company-reported ARR growth and NRR are strong, but absolute revenue remains private."
        - id: "series-d-anchor"
          label: "April 2025 financing anchor"
          description: "$108M Series D at approximately $808M post-money."
        - id: "closed-exit"
          label: "Recorded M&A close"
          description: "Forge records announcement in December 2025 and closing in March 2026."
        - id: "valuation-gap"
          label: "Price and waterfall unavailable"
          description: "No matched price or disclosed acquisition economics support a current valuation."
        - id: "recommendation"
          label: "Research-more"
          description: "Require definitive deal terms and audited financials before judging returns."
      edges:
        - from: "product-scope"
          to: "operating-signal"
        - from: "operating-signal"
          to: "series-d-anchor"
        - from: "series-d-anchor"
          to: "closed-exit"
        - from: "closed-exit"
          to: "valuation-gap"
        - from: "valuation-gap"
          to: "recommendation"
    approximationNotes: "The flow is qualitative and sequential; it does not estimate acquisition consideration, probabilities, or investment returns."
    claimRefs:
      - "CV004"
      - "CV008"
      - "CV009"
      - "CV011"
      - "CV012"
      - "CV016"
callouts:
  - calloutType: "recommendation"
    title: "Price-sensitive conclusion"
    body: "Veza may be a strategically valuable asset, but the public record does not establish the acquisition price or a current standalone security price. The call remains research-more until definitive deal economics and audited operating metrics are available [CV006, CV011, CV012, CV016]."
    claimRefs:
      - "CV006"
      - "CV011"
      - "CV012"
      - "CV016"
  - calloutType: "risk"
    title: "Do not equate funding with value available"
    body: "The $235 million cumulative equity figure describes capital raised, not cash available at exit, and the $808.05 million Series D post-money valuation does not establish acquisition consideration or common-holder proceeds [CV002, CV003, CV016]."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV016"
