schemaVersion: "report-v2"
artifact: "valuation"
slug: "veza"
runDate: "2026-10-04"
company:
  name: "Veza"
chapter:
  number: 8
  title: "Valuation"
  summary: "Veza's last public standalone financing was a $108 million Series D at an approximately $808 million post-money valuation, followed by an M&A announcement in December 2025 and closing in March 2026. With no observable matched price, disclosed acquisition consideration, or absolute revenue, the defensible recommendation is research-more rather than a numerical standalone valuation."
sections:
  - id: "decision-and-investability"
    title: "Decision and Investability"
    body: "Recommendation: research-more, with medium confidence, high information risk, and an unknown current valuation stance. The strongest public anchor is the April 2025 Series D: Veza raised $108 million, independent coverage and Forge place the post-money mark at about $808 million, and the company said cumulative equity raised reached $235 million [CV001, CV002, CV003]. That anchor is historical rather than investable. Forge now records an M&A announcement in December 2025 and closing in March 2026, labels market activity limited, and shows no available price [CV011, CV012]. Public evidence therefore does not support a current standalone entry price, target return, or holding-period case [CV016]."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV011"
      - "CV012"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs: []
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: "The thesis is strategic rather than conventionally financial. Veza reported more than doubling annual recurring revenue year over year and enterprise net revenue retention nearing 150% in its 2025 financing disclosure [CV004, CV005]. Its current product material claims more than 300 integrations, while its platform spans human, machine, and third-party identities across on-premise, SaaS, application, and data environments [CV008, CV009]. CNBC also reported a Gartner analyst's view that Veza focused on access visibility where adjacent providers lacked technology [CV010]. The anti-thesis is disclosure quality: CNBC said Veza was not disclosing revenue, and Forge cautions that its private-market data may rely on limited inputs without audit or independent verification [CV006, CV014]. Strategic participation from enterprise software vendors is useful validation, but it is not a substitute for audited economics [CV007]."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV014"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "scenarios-and-comparables"
    title: "Scenarios, Comparables, and Entry Discipline"
    body: "The assigned evidence supports relative scenarios, not precise return probabilities or dollar ranges. A bull outcome would require disclosed acquisition consideration above the $808.05 million Series D mark and proof that product breadth translated into durable economics. A base outcome is simply a completed strategic exit whose value to each security class remains indeterminate. A bear outcome is consideration below the last round or a waterfall that reduces common-holder proceeds; neither can be quantified without deal documents. Forge's own-company financing history provides only a milestone reference, moving from a reported $493.78 million Series C post-money valuation to $808.05 million at Series D [CV013, CV002]. It is not a public-company comparable set, and the current record does not support substituting named public peers or unsupported revenue multiples [CV006, CV016]."
    claimRefs:
      - "CV002"
      - "CV006"
      - "CV013"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs: []
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Diligence Triggers"
    body: "Veza has already reached a recorded strategic exit, so diligence should focus on realized security-level proceeds and post-close integration rather than IPO readiness [CV011]. The view improves only if definitive documents disclose purchase consideration, payment mix, rollover or earnout terms, and the preference waterfall; audited standalone revenue, gross margin, retention cohorts, and cash use are also needed to judge whether the 2025 mark represented efficient growth [CV006, CV016]. The view weakens if disclosed consideration is below $808.05 million, if material value is contingent, or if integration reduces product autonomy and customer retention. Forge's limited activity and unavailable price mean secondary indications cannot close these gaps [CV012], while its general warning that private securities are illiquid reinforces the need for documentary evidence rather than a modeled liquidity assumption [CV015]."
    claimRefs:
      - "CV006"
      - "CV011"
      - "CV012"
      - "CV015"
      - "CV016"
    tableRefs: []
    figureRefs:
      - "FV001"
