  topStrengths:
    - 具备差异化的授权核心平台，广泛覆盖企业级身份与访问场景。
    - 在大型软件与云生态中跑通了可信的企业级落地，并获得战略验证。
    - 最新披露的独立估值与融资历程提供了明确的历史基准。
  topRisks:
    - 独立时期的财务数据、客户数以及交易商业条款均未披露。
    - 融入 ServiceNow 带来了产品路线图、产品打包与中立性方面的不确定性。
    - 最新的公开估值属于历史数据，并非当前的独立价格。
  unresolvedGaps:
    - ServiceNow 官方收购价格、支付结构、留存滚存条款及交易清算瀑布流仍未披露。
    - Veza 最终独立运作阶段的绝对 ARR、营收、毛利率、烧钱速度、递延收入与现金储备仍未公开。
    - 客户集中度、续约情况、总留存率（GRR）、ACV 结构以及头部客户风险敞口均未公开披露。
    - 退出时的完整股权结构表、清算优先权、期权稀释情况以及最终董事会构成未公开获取。
    - 针对较新的 Access AuthZ、Access AI、AI 智能体以及 Access Agents 相关说法的独立生产环境证据依然有限。
    - 交割后在 ServiceNow 内部的产品路线图、打包策略以及 Veza 核心产品与工程负责人的留任情况仍不明确。
