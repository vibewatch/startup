summary:
  headline: >-
    Veza 打造了差异化的授权核心身份安全资产，也拿下了可信的企业级客户落地；但公开记录仅停留在 2025 年 4 月独立时期的 $808M 估值，且公司已被收购但交易条款未披露。因此应将 Veza
    视为已经收官的战略退出案例，而非当前的独立独角兽；在获得未公开的 ARR 与交易条款披露之前，不应对其最新公开估值给出任何溢价。
