evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-and-transaction-metrics
    missingEvidence: >-
      Absolute revenue, ARR, gross margin, cash, burn, customer count, signed ServiceNow consideration, payment mix,
      rollover terms, and transaction waterfall.
    whyItMatters: >-
      Without these denominators, funding and valuation marks cannot be converted into operating quality, runway, or
      realized transaction economics.
    diligencePath: >-
      Obtain audited standalone financials, a dated customer census, and the executed transaction agreement with closing
      and payment schedules.
    relatedQuestionRefs:
      - QO005
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current full board and executive roster, founder retention and succession terms, ownership percentages, option
      dilution, preferences, debt, and secondary transactions.
    whyItMatters: >-
      Named founders, one board appointment, and an investor logo list do not establish current control, governance
      quality, or key-person resilience.
    diligencePath: >-
      Review the current organization chart, board minutes, capitalization table, voting agreements, retention packages,
      and succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited segment revenue, standalone annual recurring revenue (ARR), and precise dollar-denominated TAM/SAM
      allocations for Veza's product suite.
    whyItMatters: >-
      Without segmented ARR figures, quantitative market sizing relies on qualitative analyst category boundaries and
      proxy enterprise scale metrics.
    diligencePath: >-
      Inspect post-acquisition ServiceNow financial filings and investor presentations for segmented security product
      revenue disclosures.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current Veza SKU definitions, pricing denominators, implementation fees, discount bands, renewal terms, and exit
      assistance.
    whyItMatters: >-
      Public list prices from other vendors cannot establish Veza's realized total cost or a like-for-like commercial
      advantage.
    diligencePath: >-
      Request a written Veza quote and normalize it against current first-party quotes from the shortlisted
      alternatives.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: acquisition-risk
    missingEvidence: >-
      Independent customer, partner, or ServiceNow evidence on the current roadmap, packaging, support model,
      migrations, and product investment.
    whyItMatters: >-
      The only retained delay forecast comes from a competitor and cannot establish an observed post-transaction
      outcome.
    diligencePath: >-
      Obtain ServiceNow product commitments and conduct reference calls with customers that renewed or expanded after
      the transaction.
    relatedQuestionRefs:
      - QP008
      - QP010
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A comparable production benchmark covering connector completeness, entitlement accuracy, remediation outcomes,
      deployment effort, and operating cost.
    whyItMatters: Vendor and directory comparisons describe scope but do not test Veza and alternatives against the same workloads.
    diligencePath: >-
      Run a paid proof of concept with identical applications, identity populations, policies, and remediation tasks for
      each finalist.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: absolute-revenue-scale
    missingEvidence: >-
      Audited absolute annual recurring revenue (ARR), recognized revenue, and revenue mix across software licenses and
      services.
    whyItMatters: >-
      Without baseline revenue figures in USD, growth rate percentages cannot establish scale, enterprise market share,
      or capital efficiency.
    diligencePath: >-
      Inspect target financial disclosure exhibits from ServiceNow regulatory filings or audited pre-acquisition
      financial statements.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: >-
      Gross margin percentage, multi-tenant cloud hosting infrastructure costs, customer acquisition cost (CAC) payback,
      and cash burn rate.
    whyItMatters: >-
      Gross margin determines long-term operating leverage and whether graph computation costs scale sustainably with
      entitlement volume.
    diligencePath: >-
      Request management reporting on cloud infrastructure expenses across AWS and Snowflake relative to subscription
      revenue cohorts.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: acquisition-terms-and-waterfall
    missingEvidence: >-
      Official acquisition transaction purchase price, cash-and-stock consideration mix, and liquidation preference
      distribution.
    whyItMatters: >-
      Clarifies final enterprise valuation realization relative to the $808 million Series D post-money benchmark and
      total invested capital.
    diligencePath: Review subsequent ServiceNow quarterly 10-Q and annual 10-K business combination disclosures.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: ai-agent-governance-benchmarks
    missingEvidence: >-
      Independent third-party technical benchmarks or published customer deployment studies quantifying performance,
      scale, and false-positive rates for Veza AI Agent Security and Access Agents.
    whyItMatters: >-
      Without independent performance audits, the production efficacy and scalability of Veza's emerging agentic AI
      governance capabilities remain unverified against enterprise workloads.
    diligencePath: >-
      Request customer deployment telemetry, AI agent audit logs, and reference call results directly from ServiceNow
      and Veza engineering leadership during technical diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Customer-level and cohort-level NRR, GRR, logo churn, renewal rates, contract durations, and realized expansion.
    whyItMatters: >-
      Durability and land-and-expand economics cannot be evaluated from named references or a customer-success job
      design.
    diligencePath: >-
      Obtain anonymized monthly cohorts, renewal schedules, gross and net retention bridges, and the ten largest
      expansion and contraction cases.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Revenue by top customer, customer segment, geography, channel, and ServiceNow-originated versus direct account.
    whyItMatters: Concentration and channel dependency could materially alter revenue durability after the acquisition.
    diligencePath: >-
      Request the top-20 customer schedule with ARR, contract term, renewal date, products, origin channel, and
      post-close status.
    relatedQuestionRefs:
      - QU005
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Exhaustive customer roster with production or pilot status, deployment dates, licensed modules, and quantified
      outcomes.
    whyItMatters: Public naming does not establish the breadth, maturity, or reference quality of the installed base.
    diligencePath: >-
      Reconcile CRM and billing exports to implementation records, then independently reference-check a stratified
      sample of current and churned accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: independent-corroboration
    missingEvidence: Independent customer interviews or procurement records that verify outcomes for the named deployments.
    whyItMatters: Most available customer proof is issued or selected by Veza, and the third-party directory has weak reliability.
    diligencePath: >-
      Interview identity leaders at named customers and obtain redacted contracts, renewal orders, implementation
      milestones, and outcome baselines.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: legal-regulatory-status
    missingEvidence: >-
      Comprehensive regulatory disclosures or public docket filings confirming the absence of pending litigation,
      antitrust reviews, or enforcement actions regarding Veza.
    whyItMatters: >-
      Unannounced regulatory inquiries or partner disputes could delay acquisition finalization or alter enterprise
      deployment rights.
    diligencePath: >-
      Review public federal court docket records, SEC merger filing disclosures from ServiceNow, and state corporate
      filings.
    relatedQuestionRefs:
      - QR009
  - id: EGR002
    type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Private operating metrics including current annual recurring revenue (ARR), net retention rate (NRR), gross
      margins, and customer churn rates.
    whyItMatters: >-
      Assessing standalone business sustainability and economic viability prior to acquisition close requires audited
      financial metrics.
    diligencePath: Request confidential disclosure schedules, GAAP audited financial statements, and board investor decks.
    relatedQuestionRefs:
      - QR006
  - id: EGR003
    type: enumeration-incomplete
    severity: minor
    topic: compliance-enumeration
    missingEvidence: >-
      Full jurisdictional matrix of global access compliance frameworks and certification audit requirements applicable
      to Veza customers.
    whyItMatters: >-
      Compliance scope variations across regional standards (e.g. ISO 27001, SOC 2 Type II, FedRAMP, DORA) impact
      enterprise procurement timelines.
    diligencePath: >-
      Inspect Veza's official compliance and trust portal documentation and third-party SOC 2 Type II audit
      attestations.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: acquisition-consideration
    missingEvidence: Definitive acquisition consideration, cash and equity mix, rollover or earnout terms, and closing adjustments.
    whyItMatters: >-
      These terms determine whether the exit exceeded the last financing mark and whether proceeds were immediate or
      contingent.
    diligencePath: Obtain the merger agreement, board materials, acquirer purchase-accounting disclosures, and closing statement.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV008
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Absolute ARR and revenue, gross margin, retention cohorts, operating loss, cash use, and deferred revenue for the
      final standalone periods.
    whyItMatters: >-
      Directional growth rates cannot establish an acquisition multiple, capital efficiency, or a defensible return
      case.
    diligencePath: >-
      Review audited standalone financial statements, quality-of-revenue workpapers, customer cohorts, and monthly
      cash-flow schedules.
    relatedQuestionRefs:
      - QV005
      - QV006
  - type: missing-source
    severity: material
    topic: external-comparables
    missingEvidence: >-
      A transaction-date comparable set with matched revenue definitions, growth, margins, retention, and acquisition or
      trading multiples.
    whyItMatters: Veza's own financing history is a milestone reference, not an independent market multiple benchmark.
    diligencePath: >-
      Build a dated identity-security comparable set from public filings and disclosed M&A transactions after private
      financials are available.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: capitalization-waterfall
    missingEvidence: >-
      Fully diluted capitalization, option dilution, liquidation preferences, participation rights, and security-level
      acquisition proceeds.
    whyItMatters: >-
      Enterprise value does not determine common or employee-holder returns without the preference and dilution
      waterfall.
    diligencePath: Obtain the final capitalization table, financing documents, waterfall model, and security-holder payout schedule.
    relatedQuestionRefs:
      - QV003
      - QV006
      - QV008
