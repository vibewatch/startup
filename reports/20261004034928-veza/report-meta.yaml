summary:
  headline: >-
    Veza built a differentiated authorization-centric identity-security asset and won credible enterprise adoption, but
    the public record tops out at an $808M April 2025 standalone valuation and an acquired status with undisclosed
    transaction terms. Treat Veza as a closed strategic-exit case rather than a current standalone unicorn, and require
    private ARR and deal-term disclosure before assigning any premium beyond the last public mark.
