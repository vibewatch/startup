callouts:
  - calloutType: "insight"
    title: "Expansion Economics Driven by Permission Sprawl"
    body: "Veza's reported net revenue retention nearing 150% is structurally underpinned by exponential enterprise permission proliferation. With an average corporate worker accumulating approximately 96,000 entitlements and enterprise non-human identities multiplying across multi-cloud environments, enterprise customers naturally expand Veza subscription tiers as they ingest additional data platforms, SaaS tools, and AI agent workloads into the Access Graph."
    claimRefs:
      - "CI007"
      - "CI010"
  - calloutType: "risk"
    title: "Post-Acquisition Financial Opacity for Independent Diligence"
    body: "ServiceNow's absorption of Veza terminates the availability of independent audited financial records. Because transaction purchase consideration, deal structure, and standalone gross margins remain confidential, underwriters cannot verify whether Veza achieved operational cash-flow profitability or sustainable unit economics prior to its strategic acquisition."
    claimRefs:
      - "CI014"
      - "CI015"
      - "CI016"
