chapter:
  number: 4
  title: "Financials"
  summary: "Veza scaled its enterprise authorization security platform to an $808 million valuation and $235 million in total equity funding through its April 2025 Series D, supported by reported triple-digit ARR growth and near-150% enterprise net revenue retention. However, standalone financial visibility ceases following its subsequent acquisition by ServiceNow, leaving absolute ARR, gross margins, cash burn, and realization economics unverified for private underwriting."
sections:
  - id: "revenue-model-and-monetization-mechanisms"
    title: "Revenue Model, Monetization Mechanics, and Pricing Opacity"
    body: "Veza generates software revenue through an enterprise subscription software-as-a-service (SaaS) and software licensing model anchored on its Access Platform. The platform provides Identity Security Posture Management (ISPM), Identity Governance and Administration (IGA), non-human identity (NHI) management, and access lifecycle automation. Monetization is fundamentally structured around multi-system enterprise scale rather than self-service consumption. Commercial pricing is not published on public catalog tiers; instead, commercial agreements require direct sales quoting and scale based on monitored target systems, connected data sources, directory identities, and optional modules such as Access AI, Access Requests, and Access AuthZ. While list pricing is opaque, enterprise go-to-market execution relies on annual and multi-year upfront SaaS subscriptions, complemented by channel distribution via the Veza Identity Partner Program (VIPP) spanning value-added resellers, global system integrators, and cloud marketplace alliances. Because Veza operates as an analytics and authorization governance control plane connecting to more than 250 to 300 agentless integrations across AWS, Microsoft Azure, Google Cloud, Snowflake, and Workday, its contract sizes historically reflect enterprise-wide security scope, driving strong expansion inside large-scale deployments."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "commercial-traction-and-growth-proxies"
    title: "Commercial Traction, Expansion Dynamics, and Public Metrics"
    body: "Publicly disclosed financial milestones indicate substantial commercial momentum preceding Veza's strategic exit. In conjunction with its $108 million Series D financing round announced in April 2025, the company reported that it more than doubled its annual recurring revenue (ARR) year-over-year during 2024. Furthermore, Veza reported enterprise Net Revenue Retention (NRR) nearing 150%, demonstrating extensive expansion across existing customer deployments as security teams connected additional cloud services, database repositories, and SaaS platforms to the Access Graph. Traction in top-tier enterprise tiers was highlighted by customer adoption across 10 Fortune 500 and 16 Fortune 1000 organizations, including major institutions such as Blackstone, Workday, Sallie Mae, and Snowflake. Strategic corporate venture investments from Atlassian Ventures, Workday Ventures, and Snowflake Ventures in the Series D round served as both financial backing and commercial validation of Veza's integrations. However, Veza has never publicly disclosed its absolute baseline ARR in US dollars, its annual contract value (ACV) distribution, or its customer concentration percentages, creating a material gap for financial underwriting."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
  - id: "cost-structure-capital-adequacy-and-exit-status"
    title: "Cost Structure, Capital Adequacy, and Acquisition Transition"
    body: "Veza's cost structure reflects a typical high-growth enterprise infrastructure software profile, dominated by technical headcount, cloud compute expenses for graph-processing infrastructure, and global enterprise go-to-market investments. Across four primary institutional equity rounds, Veza raised a cumulative $235 million in total equity financing from investors including New Enterprise Associates, Accel, Google Ventures (GV), True Ventures, Norwest Venture Partners, Ballistic Ventures, and Blackstone Innovations Investments. Headcount expanded from approximately 110 employees around its 2022 launch to more than 190 worldwide by mid-2025, with public industry profiles tracking approximately 191 to 230 employees prior to acquisition. While the $108 million Series D round at an $808 million post-money valuation provided multi-year balance sheet runway, standalone cash burn and gross margin dynamics were superseded by ServiceNow's acquisition of the company. With Veza transitioning into ServiceNow's Autonomous Security and Risk portfolio, standalone capital adequacy and financing dependencies have been absorbed by the parent enterprise, rendering forward cash runway and independent refinancing triggers moot while permanently locking private standalone margin and unit-economics data."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
