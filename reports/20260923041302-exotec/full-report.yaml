            title: EU AI Act and NIS2 create compounding regulatory risk for Deepsky WES with no confirmed compliance path
            body: >-
              Deepsky WES sits at the OT/IT boundary of critical logistics infrastructure. EU NIS2 (effective Oct 2024)
              creates cybersecurity compliance obligations; EU AI Act Annex III (effective Aug 2026) may classify
              Deepsky's warehouse AI as high-risk. Neither IEC 62443 nor SOC 2 Type II certifications are publicly
              confirmed. Both obligations converge before Exotec's likely next fundraise window — creating a regulatory
              risk that investors will need to assess in any Series E diligence.
            calloutType: insight
            claimRefs:
