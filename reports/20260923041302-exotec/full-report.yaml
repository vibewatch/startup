    type: standard
    columns:
      - User job
      - Current workflow (without Exotec)
      - Exotec solution
      - Measurable benefit
      - Limitation
    rows:
      - - Order fulfillment picking
        - Manual picker walks aisle, locates tote, picks item — 10–15 min journey (E.Leclerc CEO quote)
        - Skypod robot retrieves tote to picker workstation; Deepsky orchestrates
        - 'E.Leclerc: journey reduced from 10–15 min to under 5 min; Goldman Sachs: 4x productivity'
        - Requires minimum site footprint and robot count for ROI; not suitable for very small operations
      - - Storage density optimization
        - Static rack assignment; aisle access limits density
        - Deepsky dynamic storage slot assignment + 14m vertical rack
        - 'Goldman Sachs: 5x storage capacity vs. manual; 30% density increase (Next-Gen)'
        - Dense storage requires accurate inventory data; mis-slotting degrades performance
      - - Peak demand scaling
        - Hire temporary workers; accept degraded performance
        - Deploy rental robots from Exotec fleet for peak season
        - Elastic capacity without permanent headcount; 99%+ uptime during peak
        - Rental fleet availability not guaranteed; lead time for robot deployment unclear
      - - Multi-channel fulfillment
        - Separate each-pick and case-pick lines; high labor, multiple systems
        - 'Next-Gen Skypod: each+case in single robot cycle; Deepsky routes by order type'
        - Single system handles both; reduces capital spend on separate systems
        - Available only in Next-Gen (Feb 2025); Gen 1 does not support case picking natively
      - - System integration
        - Multiple vendors; custom integration per WMS/ERP
        - Deepsky API integrates with SAP, Oracle, Manhattan, Blue Yonder, JDA
        - Single orchestration layer; faster deployment vs. multi-vendor integration
        - Deepsky API certification status (SOC 2, ISO 27001) not publicly confirmed
