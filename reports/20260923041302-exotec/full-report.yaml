            body: >-
              Exotec's 99%+ uptime at production scale (1M+ cycles/day) is not a lab benchmark — it is a live
              operational metric backed by contractual SLAs across 135+ enterprise sites. This is the single most
              powerful technical proof point: at 4 m/s robot speed with autonomous charging, this scale of reliable
              operation at multi-robot fleets demonstrates engineering maturity that newer competitors cannot replicate.
