  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation framework and comparables
        blocks:
          - type: paragraph
            body: >
              Exotec's $2B Series D valuation (December 2021) implies an 8–9x revenue multiple on estimated $213–256M
              2024 revenue. This premium was justified at issuance by the 2021 warehouse automation market boom
              (post-COVID e-commerce investment surge) and Exotec's unique 3D AMR architecture. As of September 2026,
              that multiple must be re-evaluated against three years of changed market conditions.


              The most relevant public comparable is AutoStore Systems, which trades on Oslo Stock Exchange (AUTO.OL) at
              a market cap of approximately $2.8–3.5B on 2024 revenue of $645.7M — implying a 4–6x revenue multiple
              post-market-contraction. AutoStore's premium reflects its 68% gross margin, $1.1B+ total revenue base, and
              global installed base. Exotec's smaller scale, lower margin, and private discount would typically warrant
              a 30–40% private discount to a public comp — suggesting a fair-value range of $1.4–2.0B at current revenue
              levels, consistent with the base case scenario.


              Two additional comparables: Hai Robotics (private, China-based, raised $200M at ~$1B+ valuation in 2022)
              and 6 River Systems (acquired by Flexport in 2019 for ~$130M, smaller scale) provide market data points.
              The premium segment of the market — truly differentiated AMR vendors with significant backlog — trades at
              8–12x revenue in bull-market conditions and 4–7x in bear/recovery conditions. Exotec sits at the premium
              end of the AMR market given its technology differentiation, but the $2B valuation requires the premium
              multiple to hold through a challenging 2024–2025 market environment.


              The investment thesis rests on three value drivers: (1) the $400M Next-Gen Skypod backlog, which provides
              forward revenue visibility equivalent to 1.5–2 years of current revenue; (2) the Deepsky WES SaaS layer,
              which provides potential for higher-margin recurring revenue as the installed base grows (each new Skypod
              deployment adds a Deepsky SaaS seat); (3) the North America commercial buildout, which represents untapped
              TAM at an earlier stage of adoption curve than Exotec's EU home market.
            claimRefs:
              - CV001
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.2'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >
              The bull scenario assumes: Next-Gen Skypod delivers 50%+ throughput improvement at volume, driving strong
              customer references at Grainger and Oxford Industries; NA revenue doubles to $200M+ by end-2026 (from
              $100M+ 2023 order intake, growing); market recovery in 2025 drives 10–15% sector rebound; Deepsky WES SaaS
              ARR reaches $30–50M by 2027; Series E closes at $3–3.5B valuation in H1 2027 with a new lead investor.
              Implied 2027 revenue: $400–450M (30–40% CAGR from estimated 2024 base). At 8x, valuation = $3.2–3.6B; at
              10x (top-of-range SaaS narrative), $4.0–4.5B.


              The base scenario assumes: Next-Gen Skypod delivers on specifications but at lower-than-projected volume
              in 2025 (production ramp slower than $400M backlog target); NA revenue grows to $150–175M by end-2026;
              market recovers 3–5% in 2025; Deepsky SaaS layer contributes $15–25M ARR; Series E or strategic secondary
              at $1.8–2.2B in 2026–2027. Implied 2026 revenue: $300–350M (20–25% CAGR). At 6x, valuation = $1.8–2.1B —
              flat to modest premium to 2021 price.


              The bear scenario assumes: Next-Gen Skypod throughput underperforms (30–40% improvement vs. 50% claimed),
              creating adverse references at NA customers; market contraction continues into 2025 at 5–8%; Goldman Sachs
              exercises exit preference; capital required before positive cash flow, triggering a down-round at
              $1.2–1.5B or an opportunistic acquisition by a strategic buyer (Dematic / KION Group, Vanderlande /
              TomTom, or Murata Machinery). Implied sale price: $1.0–1.5B, representing a 25–50% loss to 2021 investors.


              The current evidence landscape — $400M Next-Gen backlog, 3 consecutive CNBC Disruptor 50, $100M+ NA order
              intake doubling YoY — skews toward the base case with upside optionality to the bull case, provided the
              four key diligence asks are verified before investment.
            claimRefs:
              - CV001
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: Recommendation, conditions, and kill criteria
        blocks:
          - type: paragraph
            body: >
              The conditional positive recommendation is grounded in Exotec's differentiated technology architecture,
              proven EU market position, credible NA commercial expansion, and unique Next-Gen Skypod product pipeline.
              Exotec has no direct equivalent among fully independent (non-Amazon) warehouse robotics vendors at this
              scale with this technology differentiation.


              Four conditions must be verified before investment commitment: (1) Manufacturing capacity: Exotec must
              confirm that Croix factory capacity and/or contract manufacturing is sufficient to deliver the $400M
              Next-Gen backlog within the committed customer timelines. (2) Next-Gen throughput proof: at least one
              commissioned Next-Gen Skypod site (Grainger or Oxford Industries) must demonstrate 45%+ throughput
              improvement in customer acceptance testing before investment. (3) IEC 62443 compliance: Deepsky WES must
              have an active IEC 62443 Level 2 certification path with a credible 2025 delivery date, given EU NIS2
              obligations for enterprise customers. (4) Cap table and Goldman exit alignment: Goldman Sachs fund
              timeline and exit preference must be aligned with a 2027+ IPO or secondary rather than a 2025–2026 forced
              sale.


              Investment-grade conditions are met on: technology differentiation (3D AMR architecture is
              hardware-defensible), EU market proof (135+ sites, E.Leclerc CEO 5-minute journey time reduction,
              Decathlon VP quote), and team quality (founders with track record, Goldman/83North board oversight).


              Kill criteria that would invalidate the thesis: Next-Gen Skypod fails customer acceptance at any of the
              first three NA sites; Deepsky WES suffers a cyberattack at a production customer site; Goldman Sachs
              initiates a secondary sale before 2026 without investor alignment; or Exotec misses its $400M backlog
              delivery timeline by more than two calendar quarters.
            claimRefs:
              - CV001
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              Conditional Positive — invest at base-case pricing ($1.8–2.2B) with four pre-investment diligence
              conditions verified
            body: >-
              Exotec is a genuinely differentiated warehouse robotics company with a defensible technology moat and
              strong EU market proof. The investment risk is primarily concentrated in four areas that can be verified
              pre-close: (1) manufacturing capacity adequacy, (2) Next-Gen Skypod throughput proof, (3) Deepsky IEC
              62443 security compliance, and (4) Goldman Sachs exit alignment. Subject to satisfactory verification of
              these four conditions, a conditional positive recommendation is appropriate at base-case pricing
              ($1.8–2.2B). Entry at bull-case pricing ($2.5B+) is not recommended without Next-Gen volume proof.
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: The 2021 $2B valuation is defensible in the base case but may require a down-round in the bear scenario
            body: >-
              AutoStore's public multiple compression (4–6x on $645M revenue) and the 2024 market contraction (7–11%)
              place Exotec's 8–9x implied multiple at the high end of current market. If Next-Gen Skypod underperforms
              or Goldman Sachs accelerates exit, a down-round at $1.2–1.5B is a realistic bear scenario. 2021-vintage
              investors should stress-test liquidation preference stacks accordingly.
            calloutType: insight
            claimRefs:
              - CV010
              - CV008
