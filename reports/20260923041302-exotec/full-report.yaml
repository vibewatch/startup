            body: >-
              Exotec's Deepsky WES software handles live warehouse operational data (inventory, order details,
              throughput KPIs) and integrates with customer ERP/WMS. Enterprise customers like Grainger (publicly
              traded, US) and Oxford Industries (NYSE) operate under strict IT security governance. The absence of
              publicly confirmed SOC 2 Type II or ISO 27001 certifications is a diligence gap that could delay
              enterprise sales or require costly certification work.
            calloutType: insight
