            title: >-
              Single-factory manufacturing in France is the highest-severity unmitigated risk given the $400M Next-Gen
              Skypod backlog
            body: >-
              Exotec's entire hardware production is concentrated at a single facility in Croix, France. No backup
              manufacturing site or contract manufacturer has been publicly announced. A plant disruption exceeding 2
              weeks would halt all new robot production, delay $400M in contracted Next-Gen Skypod systems, and trigger
