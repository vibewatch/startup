  - id: FE001
    title: Product architecture map
    type: stack
    data:
      layers:
        - label: Customer Systems Layer
          detail: ERP (SAP, Oracle), WMS (Manhattan, Blue Yonder, JDA) — customer-owned; Deepsky connects via API
        - label: Deepsky WES Platform
          detail: >-
            Order management, robot dispatch, traffic management, predictive maintenance, performance KPI dashboard;
            on-prem or hybrid cloud
        - label: Orchestration Interface
          detail: >-
            Deepsky API — robot commands to Skypod fleet; tote routing to Skypath; pick orders to Skypicker; sensors to
            monitoring
        - label: Skypod Robot Fleet
          detail: >-
            4WD 3D AMR robots; 4 m/s speed; 30kg payload; 14m rack climbing; regenerative braking; 5 min/hr autonomous
            charge
        - label: Skypath Conveyor System
          detail: Inter-zone tote transport; native integration with Deepsky; optional for smaller DCs
        - label: Skypicker Robotic Arm
          detail: 600 items/hr; CV-based item identification; each + case picking (Next-Gen); ML trained on customer SKU data
        - label: Physical Infrastructure
          detail: >-
            Standard industrial rack structure; workstation ports; charging stations; optimized for Skypod but
            retrofit-compatible
  - id: FU001
    title: Customer journey map
    type: journey-map
    data:
      items:
        - label: Awareness
          detail: >-
            Enterprise supply chain team sees Exotec at trade show (LogiMAT, ProMat) or via Goldman Sachs / integrator
            referral. CNBC Disruptor 50 creates brand awareness.
        - label: Evaluation
          detail: >-
            DC survey, ROI model, competitor evaluation (AutoStore, Hai Robotics). 9–18 month sales cycle. Goldman Sachs
            and named customer references (E.Leclerc, Grainger) accelerate evaluation.
        - label: Procurement
          detail: >-
            Multi-stakeholder approval (CSCO, CFO, IT, Operations). $5M–$50M+ capex budget. Goldman Sachs backing and
            83North provide institutional credibility for procurement committee.
        - label: Deployment
          detail: >-
            Skypod installation in existing building. Deepsky WES integration with ERP/WMS. Exotec field team
            commissioning. Typical deployment 3–9 months.
        - label: Go-live
          detail: >-
            Initial operation; SLA clock starts (99%+ uptime). Deepsky subscription begins. Customer trains operators;
            Skypicker arm calibrated to SKU set.
        - label: Expansion
          detail: >-
            Additional sites, robot count increases, or Next-Gen Skypod upgrade. $400M pre-launch backlog = existing
            customer expansion cycle confirmed.
