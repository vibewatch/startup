summary:
  headline: Exotec 是欧洲差异化最显著的仓储机器人厂商，拥有具防御性的 3D AMR 护城河以及 $400M Next-Gen 在手订单——在基准定价下呈有条件积极态度，但须满足四项投前尽调条件。
