  topStrengths:
    - Skypod 3D 货架攀爬 AMR 架构具备硬件防御壁垒：全球部署 135+ 个站点，未见体量相当的独立竞品。
    - 来自 Grainger、Oxford Industries（NYSE:OXM）、E.Leclerc 等 20+ 个项目的 $400M Next-Gen Skypod 发售前在手订单，锁定了未来 1.5–2 年的收入可见度。
    - Deepsky WES SaaS 层随着装机量扩张引入经常性收入潜力，拉动毛利率上行。
    - 连续 3 年入选 CNBC Disruptor 50（2022–2024），市场认可度持续得到验证；E.Leclerc CEO 与 Decathlon 运营副总裁的公开评价提供了明确的实名客户佐证。
    - 自 2022 年进入北美市场以来收入连年翻倍，2023 年新签订单突破 $100M，为总可用市场（TAM）扩张提供了扎实证据。
  topRisks:
    - 全部产能在法国 Croix 单一工厂：未披露备用生产基地或代工厂，一旦工厂运转受阻，$400M Next-Gen 在手订单将全面承压。
    - Series D 融资（2021 年 12 月）后超 4 年未获外部注资：资金充裕度未经证实；在缺乏审计报表的情况下，按估算烧钱速度推算，2026 年中可能出现资金需求。
    - Goldman Sachs Growth Equity 基金周期（2021 年募资）将在 2026–2028 年形成退出压力——存在估值低于 2021 年水平被迫首次公开募股（IPO）或进行老股交易的风险。
    - 欧盟《机械法规 2023/1230》（2027 年 1 月生效）、NIS2（2024 年 10 月生效）与《AI 法案》（2026 年 8 月生效）层层叠加合规成本并拉长上线周期。
    - 重硬件模式导致毛利率偏低（估算约 30–50%，远低于 AutoStore 的 68%），形成结构性研发投入劣势，制约 Exotec 的竞品应对能力。
  unresolvedGaps:
    - 经审计的财务数据（收入、毛利率、EBITDA、现金储备）未对外公开——所有财务测算均基于未经审计的第三方数据。
    - Next-Gen Skypod 缺乏客户验收实测数据（大批量吞吐量实证）——吞吐量提升 50% 的宣传尚未在实际生产环境中得到验证。
    - Deepsky WES SaaS 的年经常性收入（ARR）、净留存率（NRR）及合同条款均未披露——缺少该数据，SaaS 估值溢价完全处于推测状态。
    - 工厂产能（Croix 工厂年产量）、代工合作安排及供应链备用方案均未披露。
    - 股权结构表、Goldman Sachs 基金到期时间表以及清算优先权与优先股堆叠均未公开。
