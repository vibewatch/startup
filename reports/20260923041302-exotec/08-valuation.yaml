  - type: no-public-evidence
    topic: Non-EU/non-US comparable AMR companies in TV004 Comparable valuation table
    missingEvidence: Japan, Korea, and Middle East AMR companies (e.g., Murata Machinery ASRS business unit, Daifuku) do not
      have publicly reported revenue multiples or standalone valuation data. Private AMR companies in these markets are not
      enumerated in the comparable table.
    whyItMatters: Japan and Korea are target markets in Exotec's Series D use of proceeds. Regional comparables would improve
      multiple calibration for Exotec's non-Western expansion.
    relatedQuestionRefs:
    - QV009
    severity: low
  - type: no-public-evidence
    topic: 'Exotec audited financial statements: revenue, gross margin, EBITDA, cash position'
    missingEvidence: "Exotec has not published audited financials. The French SASU structure requires annual statutory accounts\
      \ submitted to the Greffe (commercial court registry), but these may be filed with a 6\u201318 month delay. All financial\
      \ estimates are third-party (Growjo) and unaudited."
    whyItMatters: Without audited financials, gross margin, burn rate, and capital adequacy cannot be independently verified.
      All valuation scenarios carry additional uncertainty premium.
    severity: critical
  - type: no-public-evidence
    topic: Next-Gen Skypod customer acceptance performance data (throughput verification)
    missingEvidence: Next-Gen Skypod was launched February 2025. No customer acceptance test results have been published as
      of September 2026. The 50% throughput improvement claim drives the entire $400M backlog rationale and NA sales narrative.
    whyItMatters: If Next-Gen throughput falls materially short of the 50% improvement target, the primary differentiation
      driver for the next revenue growth wave is compromised.
    severity: critical
  - type: no-public-evidence
    topic: Deepsky WES SaaS ARR, NRR, and contract terms
    missingEvidence: "No Deepsky SaaS ARR, NRR, contract length, or pricing terms have been publicly disclosed. The SaaS revenue\
      \ layer is a key valuation upside driver \u2014 without data, it is speculative."
    whyItMatters: "A Deepsky SaaS ARR of $30\u201350M at 120%+ NRR would substantially increase the valuation multiple justified\
      \ \u2014 the difference between a 6x and 9x revenue multiple."
    severity: high
