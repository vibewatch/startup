evidenceGaps:
  - type: data
    topic: Unicorn valuation evidence from on or after 2024-05-07
    missingEvidence: >-
      The $2B valuation was set in December 2021 (Series D). No subsequent financing round has been announced that would
      provide a post-2024-05-07 unicorn-confirming data point. The CNBC Disruptor 50 listing (2024) and operational
      milestone disclosures (1M+ daily cycles, Jan 2025) provide indirect evidence of continued unicorn status, but no
      new valuation round has been announced.
    whyItMatters: >-
      A 4+ year gap since the last valuation round means the $2B figure may not reflect current market conditions —
      warehouse automation market contracted 7–11% in 2024 and private market multiples have compressed.
    severity: medium
  - type: financial
    topic: Revenue, gross margin, and unit economics
    missingEvidence: >-
      No official revenue, gross margin, burn rate, or per-installation profitability disclosure from Exotec.
      Third-party estimates conflict ($213M vs. $256M); NDA financials are required.
    whyItMatters: >-
      Hardware/software integration business models can have very different margin profiles — positive gross margins but
      negative EBITDA is common. Without actuals, the $2B valuation cannot be tested against fundamentals.
