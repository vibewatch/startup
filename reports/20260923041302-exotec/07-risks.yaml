    topic: Manufacturing capacity, backup site, and contract manufacturer arrangements
    missingEvidence: No public disclosure of Exotec's annual robot production capacity at Croix, any contract manufacturing
      agreement, or backup production site. The $400M Next-Gen Skypod backlog requires significant production scale that cannot
      be assessed without this data.
    whyItMatters: Single-factory concentration is the most severe unmitigated operational risk. Without a backup plan, a 2-week+
      disruption would halt all deliveries.
    severity: critical
