      or ISMS documentation published by Exotec. EU NIS2 became effective October 2024.
    whyItMatters: EU enterprise customers (E.Leclerc, Carrefour) are likely classified as 'important entities' under NIS2
      and may require technology vendors to provide security attestations. Non-compliance could block Exotec from EU enterprise
      procurement.
    relatedQuestionRefs:
