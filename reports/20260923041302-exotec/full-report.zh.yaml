  - id: FU001
    title: 客户旅程全景图
    type: journey-map
    data:
      items:
        - label: 认知阶段
          detail: 大型企业供应链团队在行业展会（LogiMAT、ProMat）或经由 Goldman Sachs / 系统集成商引荐知晓 Exotec。入选 CNBC Disruptor 50 进一步建立品牌知名度。
        - label: 评估阶段
          detail: >-
            配送中心勘测、投资回报率（ROI）测算、竞品对比选型（AutoStore、Hai Robotics）。销售周期长达 9–18 个月。Goldman Sachs
            背书及知名客户案例（E.Leclerc、Grainger）加速推进评估。
        - label: 采购阶段
          detail: 跨部门联合审批（首席供应链官、首席财务官、IT、运营）。资本开支预算在 $5M–$50M+。Goldman Sachs 与 83North 注资为采购委员会提供坚实的机构信誉背书。
        - label: 部署阶段
          detail: 在现有厂房安装 Skypod。Deepsky WES 与 ERP/WMS 打通集成。Exotec 现场团队驻场调试。常规部署周期为 3–9 个月。
