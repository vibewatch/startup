      - number: '2.4'
        title: 支撑材料
        blocks:
          - type: callout
            title: 结构性顺风属于长期趋势而非周期波动——用工荒拉动 5 倍投资回报
            body: 物流领域的劳动力短缺属于结构性问题：美国仓储工人到岗情况未恢复至疫情前水平，欧洲同样面临类似掣肘。Exotec 将分拣效率提升 5 倍，构建起极具说服力的投资回报逻辑，足以穿越利率周期与行业下行期。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
          - type: callout
            title: 2024 年市场收缩（-7–11%）构成 Exotec 营收轨迹的近期逆风
            body: >-
              AutoStore 的公开监管文件证实，2024 年仓储自动化市场出现 7–11% 的收缩。这是一个负面信号：Exotec 未经核实的营收估算值（$213M–$256M）可能未能达到北美此前宣传的 2
              倍以上翻番增长轨迹。尽管行业预计将在 2025 年迎来复苏，但 2024 年的回调给未来增长预测增添了不确定性。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 主要的 G2P AS/RS 竞争对手
        blocks:
          - type: paragraph
            body: >
              AutoStore 是 Exotec 在 G2P AS/RS 领域最核心的可比竞品。AutoStore 采用立方体网格系统，机器人在高密度立体仓储网格顶部穿梭，通过垂直起吊料箱进行取货。其 2023 年营收为
              $645.7M，毛利率约 68%，调整后 EBITDA 约 48%——体量大约是 Exotec 估算营收的 3 倍，且盈利能力显著占优。AutoStore 在奥斯陆证券交易所上市，能直接对接公开资本市场。其
              2024 年推出的 R5 Pro 机器人提升了单机吞吐量并延展了平台的扩展性。相较于 Exotec，AutoStore
              的主要劣势在于：针对老旧既有厂房改造的灵活性较差（立方体结构需专门的厂房设计）、处理大型或异形 SKU 的能力偏弱，且单一系统内支持多渠道（整箱+单件）的能力有限。


              Hai Robotics 是亚洲增速最快的 G2P AMR 厂商。其箱式仓储机器人（ACR/HAIPICK）能够攀爬货架——与 Exotec 的技术路径类似——但初始资本支出更低，SKU 适配灵活性更高。Hai
              Robotics 在 LogiMAT 2025 上展出了 HaiPick Climb，直接瞄准欧洲市场。海柔对 Exotec
              的竞争威胁主要集中在对价格敏感的中端市场客户，这类客户更看重总部署成本，而非极致的系统吞吐量和多渠道处理能力。


              Ocado Solutions 采用与 AutoStore 类似的网格系统，专门针对大型生鲜电商履约中心进行优化。Ocado
              的目标市场较窄（主要集中在生鲜电商），但技术成熟度极高，其自研蜂群智能算法能同时调度数千台机器人。Ocado 正与 AutoStore 就网格机器人技术陷入持续的专利纠纷；该诉讼并未直接波及 Exotec
              的技术差异化。Geek+（极智嘉，中国非上市企业）则拥有更丰富的产品线，包含货到人穿梭车及自主移动机器人，在较小规模部署场景中与 Exotec 展开竞争。
            claimRefs:
              - CP001
