  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与知识产权风险
        blocks:
          - type: paragraph
            body: >
              Exotec 最具体的监管风险来自欧盟《机械法规》（EU Machinery Regulation 2023/1230）。该法规取代旧版《机械指令》（2006/42/EC），强制过渡截止期定在 2027 年 1
              月。新规收紧了移动自主机器人的准入要求（重点覆盖协作式与自主系统），要求重新进行符合性评估。Exotec 现有的 Gen 1 Skypod 车队按旧指令取得 CE 认证；2025 年 2 月发布的
              Next-Gen Skypod 则必须在 2027 年过渡节点前按新规完成符合性评估——这给发布前已签下的 $400M 合同套上了合规倒计时。若未能按期通过评估，签约的 Next-Gen 系统在欧盟这一
              Exotec 最大市场的交付进度恐将受阻。


              2024 年 10 月生效的欧盟 NIS2 指令把网络安全合规义务扩大到物流与制造等“关键”与“重要”实体。Exotec 的 Deepsky WES 运行在客户仓库的 OT/IT 边界，可能同时给
              Exotec（作为技术供应商）及其客户（作为关键实体）带来合规负担。Deepsky WES 软件尚未公开证实符合 IEC 62443 标准。2026 年 8 月生效的欧盟《人工智能法案》（Regulation
              2024/1689）将关键基础设施运营中的 AI 系统列为高风险类别——仓库编排 AI（即 Deepsky 的调度与优化算法）可能落入 Annex III
              范围，从而触发强制符合性评估、技术文档编写和风险管理等法定要求。


              知识产权与法律诉讼上，AutoStore 与 Ocado 曾围绕网格机器人技术打过多轮专利诉讼；一旦 Exotec 的欧洲专利组合遭遇挑战，其 3D 爬架架构同样可能面临竞品的专利诉讼。Exotec 已就
              Skypod 核心机械构件向欧洲专利局（EPO）提交专利申请，但专利组合的布局深度与覆盖地域尚未公开披露。法国本地知识产权保护在欧盟境内虽然坚挺，但若缺少 PCT 或各国单独申请，在欧盟境外的防护依然薄弱。
            claimRefs:
              - CR001
          - type: table
            tableRef: TR001
            claimRefs:
