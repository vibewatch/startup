  - id: FV001
    title: 投资建议决策树
    type: flow
    insight: 「有条件看好」这一结论汇集自四大维度：技术护城河（强）、欧洲市场验证（强）、北美商业化证据（初显）以及估值与财务风险（高）。严守进场价格纪律，并在投前逐一核实 4 项关键尽调诉求，是敲定无保留投资承诺的前提条件。
    data:
      nodes:
        - id: f1
          label: 技术护城河（强）
          description: 3D AMR 架构；Next-Gen 吞吐量提升 50%；Deepsky WES SaaS；落地 135+ 处站点
        - id: f2
          label: 欧洲市场验证（强）
          description: E.Leclerc CEO 对运转时效的背书；迪卡侬（Decathlon）运营副总裁评价；家乐福（Carrefour）、ASDA、优衣库（UNIQLO）标杆客户引述
        - id: f3
          label: 北美商业化证据（初显）
          description: 2023 年新签订单达 $100M+ 且同比翻番；斩获 Grainger 与 Oxford Industries 的 Next-Gen 合同
        - id: f4
          label: 估值与财务风险（高）
          description: $2B 估值对应 8–9x 收入倍数；长达 4+ 年的融资空窗期；单一工厂运营风险；Goldman Sachs 退出压力
        - id: f5
          label: 投前先决条件
          description: 产能审计；Next-Gen 吞吐量实测核验；IEC 62443 网络安全合规；股权结构表与 Goldman Sachs 诉求对齐
        - id: f6
          label: 有条件看好信号
          description: 技术独树一帜；欧洲验证充分；北美增长可信；管理层执行力强
        - id: f7
          label: 有条件看好建议
          description: 在核实 4 项尽调条件的前提下，按 $1.8–2.2B（基准情景）入场；切忌按乐观情景高价接盘
        - id: f8
          label: 一票否决指标
          description: Next-Gen 吞吐量不及预期；Goldman Sachs 强制退出；生产制造中断；Deepsky 遭遇网络攻击
