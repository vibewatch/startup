            body: >-
              Exotec 50 多家客户对应 135 多个站点，折合平均每家客户 2.7 个站点——但在未披露收入集中度数据的情况下，前五大客户究竟贡献了 30% 还是 60%
              的营收尚不得而知。面向大企业客户的硬件项目制业务通常存在显著的客户集中度。Deepsky 订阅与 SLA
              续约的净留存率（NRR）和总留存率（GRR）数据均未对外公开——当前对其留存能力的判断主要推断自结构性切换成本与复购替代指标（$400M 在手订单），而非基于量化指标的坐实确认。
