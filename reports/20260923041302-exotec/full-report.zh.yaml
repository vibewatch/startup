              Exotec 于 2021 年 12 月完成 $2B 估值的 Series D 轮融资，由 Goldman Sachs Asset Management
              旗下成长型股权投资部门领投。此轮融资标志着其成为法国第一家机器人独角兽，并在规模化层面验证了其产品（Skypod）及面向 50 多个大客户品牌的市场拓展策略。
