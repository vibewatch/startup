      - number: '2.2'
        title: 结构性增长驱动力与逆风
        blocks:
          - type: paragraph
            body: >
              仓储自动化的主要结构性驱动力包括：（1）物流与电商履约领域长期的劳动力短缺，Exotec
              系统可将人工拣选走动距离削减至原来的五分之一；（2）城市最后一公里配送时效要求提升（电商普遍转向当日达与次日达标准）；（3）机器人订阅模式（RaaS）将资本开支（CAPEX）转为运营支出（OPEX），让以往需要投资级信用评级才能上马自动化项目的中型企业也能负担得起；（4）欧美能效法规将自动化与可持续发展要求捆绑；（5）疫情后对供应链韧性的持续投资。上述驱动力均属结构性而非周期性因素，对市场长期增长形成有力支撑。


              当前最显著的逆风是 2024 年仓储自动化市场收缩 7–11%，这一数据见诸于 AutoStore
              的公开年报。该收缩反映了电商企业在疫情后的库存正常化调整，以及利率上调带来的资金成本敏感性。作为最具可比性的上市公司，AutoStore 将此视为周期性回调，并明确预测市场将在 2025 年复苏。2024
              年的市场收缩也是 Exotec 的核心考量项：公司未经核实的营收估算值（$213–256M）可能反映出其 2024 年增速相比 2022 至 2023 年每年翻番以上的节奏有所放缓。不过，Next-Gen
              Skypod 于 2025 年 2 月发布时携 $400M 上市前订单亮相——这些订单均是在 2024 年行业下行期锁定的——表明 Exotec 即便在逆市中也成功抢下了市场份额。
            claimRefs:
              - CM001
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM005
      - number: '2.3'
        title: 细分市场分析与买方画像
        blocks:
          - type: paragraph
            body: >
              Exotec 的主要客户板块包括：（1）零售与服装（Gap、UNIQLO、Decathlon、Oxford
              Industries）——按安装站点计为最大板块；（2）商超与餐饮服务（Carrefour、E.Leclerc、Cdiscount）——受益于欧洲线上下单自提（drive-through）履约模式的推广而快速增长；（3）工业分销与第三方物流（Grainger、Geodis）——以美国为主导，通常需要处理大量
              SKU；（4）医药与医疗保健——尚处起步阶段但监管要求严苛的板块。


              Exotec 的典型采购决策者是年营收在 $500M 以上、拥有 2 个以上配送中心的中大型零售商或分销商的供应链、物流或运营副总裁及总监。采购决策周期为 12–24 个月，单项目金额在 $5–50M
              以上，系统生命周期为 5–10 年。与现有 WMS 及 ERP 系统的对接是核心评估标准。向模块化 AS/RS
              的转变意味着买方越来越青睐能在既有厂房中安装、无需全新建厂（greenfield）的系统——Exotec 的非立方体货架架构恰好具备这一灵活性。


              买方格局区分直销客户（在自有配送中心部署 Skypod 的企业）与渠道合作伙伴（如将 Exotec 与输送机、分拣机捆绑集成的 E80 Group 等系统集成商）。渠道合作伙伴模式虽会摊薄毛利率，但能让
              Exotec 无需在每个地区搭建完整的直销团队即可加快市场渗透。
            claimRefs:
              - CM001
          - type: table
            tableRef: TM003
