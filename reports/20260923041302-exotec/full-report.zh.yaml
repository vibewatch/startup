      - number: '1.2'
        title: 融资历程与估值
        blocks:
          - type: paragraph
            body: >
              Exotec 历经多轮融资，累计融资金额达 $446M。关键轮次包括 2020 年的 $90M Series C 轮（Breega 领投，360 Capital、IRIS Capital 及 Bpifrance
              跟投），以及 2021 年 12 月具有里程碑意义的 $335M Series D 轮（Goldman Sachs Asset Management 领投，83North 及 Dell Technologies
              Capital 参投）。Series D 轮将 Exotec 的投后估值推高至 $2B，正式成为法国第一家机器人独角兽企业。截至本报告出具之日（2026 年 9 月），公司未公开披露后续融资，这意味着 $2B
              的估值已过去四年有余。


              Goldman Sachs 指出，Exotec 的“全球布局以及与行业标杆零售商和品牌合作的亮眼业绩”是核心投资逻辑。公司承诺将把资金投入大规模北美与亚洲扩张，并在 2025 年前招募 500
              名研发工程师。Christian Resch（Goldman Sachs）与 Gil Goren（83North）担任 Exotec 董事会成员。Goldman Sachs Growth Equity
              专注中后期非上市企业投资，其入局释放出强烈信号，说明其核实过的内部运营指标远优于公开披露的数据。


              自 2021 年 12 月以来未再进行后续融资，业内存在两种截然不同的推断：一是 Exotec 依靠 Series D 资金或许已能自主维持运转，暂时无需额外资金注入；二是市场行情（据 AutoStore
              年报，2024 年仓储自动化市场收缩 7–11%）可能削弱了新一轮融资的吸引力。在管理层直接披露前，尚无法确认哪种推断属实。法国国家主权投资基金 Bpifrance 联合领投 Series C
              轮，赋予了战略层面的背书——法国科技政策在积极扶持本土机器人独角兽诞生——但这并未改变其商业基本面。
            claimRefs:
              - CO001
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: 规模、运营与全球布局
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 1 月，Exotec 披露全球员工逾 1,300 人、客户站点超 135 处、服务品牌 50 余家，其 Skypod 车队每日完成超过 100 万次机器人循环（1M+ daily
              cycles）。这一单日 100 万次循环的里程碑于 2024 年公布，单个循环最多可处理四笔订单，同时附带 99%+ 的可用性承诺。公司全球营收自 2020 年以来增长两倍，累计系统销售额突破 $1B；2023
              年北美年新增订单额突破 $100M，美国销售额自 2022 年以来大致实现同比翻番。


              截至 2024 年底，北美员工数为 120 人，计划到 2025 年底突破 200 人，以软硬件工程人员为主。公司正在亚特兰大桃树街（Peachtree Street）装修第二个办公场地，用作 Skypod
              展厅和客户演示中心。公司还拓展至慕尼黑和首尔，以支持欧洲及亚太客户群。区域行业情报证实，Exotec 在 2024 至 2025 年间正打入包括奥地利和韩国在内的新市场。


              2025 年 2 月发布 Next-Generation Skypod 时披露，公司已在全球 20 多个保密项目中斩获 $400M 的商业化前订单，在正式发布前便验证了产品与市场契合度。公布的 Next-Gen
              客户包括 Oxford Industries（旗下拥有 Tommy Bahama、Lilly Pulitzer、Southern Tide）、W.W. Grainger（美国工业品分销商）以及
              E.Leclerc（法国商超）。E.Leclerc Seclin 首席执行官 Maxence Maurice 指出，Exotec 方案将客户到店履约时长从 10–15 分钟缩短至 5
              分钟以内——竞品尚未公开匹敌这一具体的吞吐量指标。Exotec 在营销材料中声称其货到人分拣效率较人工分拣提高 5 倍，这得到了 E.Leclerc 和 Decathlon Canada
              客户证言的佐证。这些知名客户的落地成效，确立了 Exotec 在零售、商超、服装和工业分销领域的 AS/RS 领跑地位。
            claimRefs:
              - CO001
