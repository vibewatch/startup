  - id: TR001
    title: 监管与法律风险登记表
    type: enumeration
    enumerationScope:
      coverage: partial
      rationale: >-
        Only EU and US regulatory frameworks directly applicable to Exotec's known operations are enumerated. Emerging
        markets (Japan, Korea) regulatory requirements are not fully assessed.
      basis: >-
        Primary regulatory text, EU Official Journal, US federal agency guidance, and trade press analysis of warehouse
        automation regulatory environment.
    columns:
      - 法规 / 许可 / 案例
      - 司法管辖区
      - 状态
      - 可能性
      - 严重程度
      - 缓解措施
      - 残留风险敞口
      - 尽调路径
    rows:
      - - 欧盟《机械法规》2023/1230（自主移动机器人）
        - 欧盟
        - 过渡期——2027 年 1 月起强制执行
        - 确定发生（自动生效）
        - 高——若未获认证，欧盟 Next-Gen 系统将面临交付延迟
        - Next-Gen 符合性评估持续推进；Exotec 具备良好 CE 认证记录
        - 若认证进展缓慢将面临 Next-Gen 延迟风险；Gen 1 设备不受影响
        - 核实 Next-Gen 2023/1230 符合性评估状态及时间表
      - - 欧盟《NIS2 指令》（关键实体网络安全）
        - 欧盟
        - 2024 年 10 月生效；成员国国内法转化持续推进
        - 中——若 Exotec 或客户被归类为“重要实体”则适用
        - 高——违规罚款最高达 €10M 或全球营业额的 2%
        - Deepsky WES 安全加固；IEC 62443 认证路径
        - Deepsky 的 IEC 62443 合规性尚未证实；欧盟客户面临风险敞口
        - 核实 Exotec 的 NIS2 合规义务评估；Deepsky 安全认证状态
      - - 欧盟《人工智能法案》附件三（高风险 AI 系统）
        - 欧盟
        - 2026 年 8 月生效；高风险分类审查持续进行
        - 中——仓储调度 AI 可能符合“关键基础设施”定义
        - 中高——强制要求风险管理、技术文档及符合性评估
        - Deepsky AI 算法文档；风险管理流程
        - 尚不明确 Deepsky 调度优化是否属于附件三高风险范畴
        - 确认 Deepsky WES AI 组件针对欧盟《人工智能法案》的分类分析结论
      - - GDPR（Deepsky WES 中的客户运营数据）
        - 欧盟
        - 生效中——GDPR 自 2018 年起强制执行
        - 低至中——仓库运营数据可能包含个人数据（工人绩效指标）
        - 中——罚款最高达 €20M 或全球营业额的 4%；欧盟客户标准合同条款（SCC）要求
        - 与欧盟客户签署数据处理协议；构建数据本地化架构
        - Deepsky 针对欧盟客户的数据本地化尚未确认；员工数据处理方式尚不明确
        - 核实客户合同中的 GDPR DPA 条款；数据本地化架构
      - - 美国 OSHA 机器人安全规范（29 CFR 1910.217 / ANSI/RIA R15.06）
        - 美国
        - 生效中；OSHA 对运行 Skypod 的北美客户现场实施巡检
        - 低——美国合规责任由客户方承担
        - 低至中——客户现场工伤可能引发产品责任风险敞口
        - 功能安全设计（等同于 ISO 3691-4）；上线时由 Exotec 提供现场支持
        - 客户现场机器人伤害引发的美国产品责任风险
        - 核实美国产品责任险保额；OSHA 事故记录
      - - 知识产权：Exotec 专利组合（EPO / 美国专利）
        - 欧盟、美国
        - 有效——已提交多项 EPO 专利申请
        - 低——尚未获悉针对 Exotec 的专利诉讼
        - 中——竞争对手可能对 3D 货架攀爬专利发起挑战
        - 已针对 Skypod 核心机械结构提交 EPO 申请；美国 PCT 申请可见度有限
        - 狭窄的专利权利要求可能被 Hai Robotics 规避设计
        - 核实美国专利申请状态；核心权利要求范围与保护广度
      - - AutoStore 与 Ocado 专利纠纷先例（知识产权风险参考）
        - 全球
        - 竞对之间持续诉讼（未涉及 Exotec）
        - 低——Exotec 基于货架的架构与魔方/网格系统存在本质差异
        - 低——无直接诉讼风险敞口
        - 架构差异化（3D 货架 vs. 魔方 vs. 网格）降低了诉讼风险
        - 现有架构下风险极低
        - 密切跟踪 AutoStore 或 Ocado 针对货架式 AMR 发起的新知识产权主张
