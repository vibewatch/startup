  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与规模
        blocks:
          - type: paragraph
            body: >
              Exotec 所属的目标市场是仓储自动化——具体为自动化立体仓储系统（AS/RS）中的货到人（G2P）细分领域，隶属于更广泛的仓储自动化产业。全球仓储自动化市场规模在 2024 年达 $26.5B（GM
              Insights 数据），2025 年达 $29.98B（Mordor Intelligence 数据），依据不同数据源，复合年增长率（CAGR）预计为 13.98–15.9%。Mordor 预测该市场到
              2031 年将达 $65.74B；GM Insights 则预计到 2034 年将以 15.9% 的 CAGR 达 $119B。硬件占到市场份额的 55.12%，而软件是增长最快的板块，到 2031 年的
              CAGR 为 14.87%。


              在这一市场中，AS/RS 系统在 2024 年占据 26.3% 的份额，而移动机器人（包括 Exotec 的 Skypod 在内的 AMR/ACR）在 2025 年占据仓储自动化市场 41.36% 的份额。在
              G2P 细分赛道中，Exotec 最直接的对手包括 AutoStore、Hai Robotics 和 SSI Schaefer，全球中大型企业站点的可触达市场估算在 $8–12B。零售与电商占仓储自动化总支出的
              28.41%（2025 年），是单一最大行业；医药与医疗保健是增速最快的垂直行业，CAGR 达 14.73%；第三方物流（3PL）服务商占客户群体的 38.96%。


              北美占据全球市场总支出的 35.51%，为最大的单一区域。亚太地区增长最快，至 2031 年的 CAGR 达 15.91%。欧洲是 Exotec 的发源地且仍保有强劲市场声量，约占全球总支出的 25–30%。
            claimRefs:
              - CM001
          - type: table
