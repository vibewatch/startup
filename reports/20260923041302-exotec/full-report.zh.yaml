  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 营收模式与收入构成
        blocks:
          - type: paragraph
            body: >
              Exotec 的营收模式划分为三类收入来源，契合其硬件、软件加服务的全栈定位。第一大核心来源是系统硬件——包括 Skypod 机器人、货架基础设施、工作站、Skypath 输送机以及 Skypicker
              机械臂——按工程项目以资本化设备形式交付。硬件在单个订单中占据最大份额，典型项目合同金额在 $5M 至 $50M+ 不等。硬件收入在交付或安装调试完成后确认，导致收入确认呈现与工程里程碑挂钩的阶段性波动特点。


              第二大来源是 Deepsky WES 软件，按订阅制或年度软件许可方式收费。Deepsky 负责统筹全仓硬件设备（含第三方硬件），并与客户的 ERP 及 WMS
              系统集成。随着安装基数的扩大，该收入板块具备复利效应；现有的 135
              多个站点奠定了最底层的经常性收入底盘。第三大来源是服务与维保——包含按项目单次结算的安装部署服务、多年期维保协议（SLA）以及操作人员培训。99%+ 的可用性承诺受到合同 SLA
              的法律约束，能按部署站点规模贡献持续稳定的经常性服务收入。


              第三方估算 Exotec 截至 2024 年的年营收在 $213–256M 之间。公司自身披露其营收自 2020 年以来增长两倍，累计系统销售额突破 $1B。2023 年北美订单签约额超过 $100M，较
              2022 年翻番。结合 135 多个站点和单日百万次以上的运行循环，推算其年收入运行率（revenue run-rate）处于 $200M–$300M 区间具备合理性，但目前尚无法得到独立审计证实。
            claimRefs:
              - CI001
          - type: table
            tableRef: TI001
            claimRefs:
