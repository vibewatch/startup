      - number: '7.2'
        title: 运营、合作伙伴与人才风险
        blocks:
          - type: paragraph
            body: >
              Exotec 最集中的单点运营风险在于法国 Croix 的单一制造工厂。Croix 基地一旦遭遇火灾、劳工行动（法国制造业素有罢工传统）或供应链中断，所有新机器人的生产就会全面停摆。鉴于签约的 $400M
              Next-Gen Skypod 合同亟待大规模硬件制造，这一敞口尤为致命。公司尚未公开披露任何代工备选方案或第二生产基地。零部件供应链风险同样存在：机器人驱动电机、LiDAR
              传感器以及车轮总成均采购自欧洲和亚洲供应商，面临关税风险（中美贸易摩擦、欧盟进口关税）与供货风险（芯片供应短缺）。


              合作伙伴与依赖风险集中在两大交易对手：一是 Goldman Sachs（拥有董事会席位且为主要资金方；Goldman 对下一轮条款或退出时点的决定将实质性影响 Exotec 的战略选择）；二是客户的企业级
              ERP/WMS 厂商（SAP、Oracle、Manhattan Associates）。Deepsky 的价值紧密绑定于对这些企业系统的 API 兼容性——任何厂商如果变更 API 协议或发生许可纠纷，都可能迫使
              Exotec 投入高昂成本重新开发。此外，若 Goldman 的退出时机（IPO 或出售）与 Exotec 创始人的战略偏好产生分歧，Goldman Sachs 的董事席位便构成潜在利益冲突。


              人才风险因两重因素而升高：(1) 对联合创始人 Romain Moulin（CEO，统筹产品与商业化）和 Renaud Heitz（CTO，掌舵技术与工程）的关键人物依赖。Exotec 的差异化架构深度根植于
              Heitz 的工程设想，CTO 一旦离职将直接危及研发连续性；(2) 北美激进的招聘扩张计划（2025 年员工数从 120 增至
              200+）带来交付质量风险——新地域的快速招人通常会引发文化融合难题、客户交付质量参差不齐以及早期员工流失率走高，可能在关键增长期损害北美客户关系。
            claimRefs:
              - CR001
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: 财务与市场风险
        blocks:
          - type: paragraph
            body: >
              Exotec 的财务风险主要由三大因素主导：(1) 重硬件模式带来的毛利差距——估算毛利率为 30–50%，远低于 AutoStore 公开的
              68%，形成了结构性的资本成本与研发投入劣势，且随时间推移不断累积；(2) 资金缺口——距离 D 轮融资（2021 年 12 月，融资金额 $335M）已过去 4 年多，尚未公开宣布 E
              轮融资或授信额度。月度烧钱速度估算为 $5M–$15M，意味着除非营业收入带来正向现金流，否则到 2026 年年中可能面临资金需求；(3) 市场收缩——仓储自动化市场在 2024 年收缩了 7–11%（源自
              AutoStore 2024 年年报），表明企业资本支出预算收紧，销售线索转化速度放缓。


              $400M 的 Next-Gen Skypod 在手订单带来了可观的远期收入能见度，但也引发了营运资金风险：硬件必须先制造出来才能收到项目回款，任何交付延误都会推迟收入确认并损害客户关系。Exotec
              若无法在不追加资本投入的前提下扩充 Croix 工厂产能以消化 $400M 硬件需求，积压订单就可能导致一段现金流为负的承压期，进而需要过桥融资。


              关键投资逻辑破裂风险包括：(1) Next-Gen Skypod 在规模化量产中未能兑现承诺的 50% 吞吐量提升——这将让 Oxford Industries 和 Grainger
              从正面标杆变为负面案例，摧毁北美销售势头；(2) 部署的 Deepsky WES 遭遇严重网络攻击，将重创 Exotec 声誉并引来 NIS2 与 IEC 62443 的执法处罚；(3) Goldman
              Sachs 强推低于 D 轮 $2B 估值的出售或 IPO，导致股权稀释或打乱战略节奏。
            claimRefs:
              - CR001
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: 图表与佐证
        blocks:
          - type: callout
            title: 面对 $400M 的 Next-Gen Skypod 在手订单，法国单一工厂制造是严重等级最高且未经化解的风险
            body: >-
              Exotec 全部硬件生产集中于法国 Croix 的单一场地，尚未公开披露任何备用制造基地或代工合作伙伴。工厂一旦停产超过 2 周，所有新机器人生产都会停滞，导致签约的 $400M Next-Gen Skypod
              系统交付延期，并触发客户赔偿条款。这是目前所披露的应对成熟度最低、严重等级最高的单一风险，且风险敞口随着在手订单规模同步放大。
            calloutType: insight
            claimRefs:
              - CR006
              - CR010
          - type: callout
            title: 欧盟《人工智能法案》与 NIS2 叠加施压，Deepsky WES 面临缺乏明确合规路径的双重监管风险
            body: >-
              Deepsky WES 处于关键物流基础设施的 OT/IT 边界。2024 年 10 月生效的欧盟 NIS2 带来网络安全合规要求；2026 年 8 月生效的欧盟《人工智能法案》Annex III 则可能把
              Deepsky 的仓储 AI 列入高风险类别。目前公司尚未公开证实获得 IEC 62443 或 SOC 2 Type II 认证。这两项合规要求均在 Exotec 下一轮潜在融资窗口前集中落地——投资者在 E
              轮尽调中必须严格审视这一监管风险。
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架与对标标的
        blocks:
          - type: paragraph
            body: >
              Exotec 在 2021 年 12 月的 D 轮估值为 $2B，对应 2024 年估算收入 $213–256M 的 8–9 倍市销率。当时能享有如此高溢价，依托的是 2021
              年仓储自动化市场的爆发（疫情后电商投资激增）以及 Exotec 独特的 3D AMR 架构。截至 2026 年 9 月，历经三年市场行情变迁，必须对这一倍数重新评估。


              最相关的上市对标公司是 AutoStore Systems。该公司在奥斯陆证券交易所上市（AUTO.OL），市值约 $2.8–3.5B，对应 2024 年收入 $645.7M——行业收缩后的市销率约为 4–6
              倍。AutoStore 的估值溢价来自其 68% 的高毛利率、$1.1B+ 的累计收入体量以及全球装机规模。相比之下，Exotec 规模较小、毛利率更低，再叠加上市折扣，相较公开市场标的一般要有 30–40%
              的非流动性折价——按当前收入水平测算，其公允价值区间在 $1.4–2.0B，与基准情景相吻合。


              另外两家对标标的提供了参考数据：Hai Robotics（非上市，中国公司，2022 年按 ~$1B+ 估值融资 $200M）与 6 River Systems（2019 年被 Flexport 以 ~$130M
              收购，体量较小）。市场的高端细分领域——即具备显著技术壁垒且手握大额订单的真正差异化 AMR 厂商——在牛市行情下享有 8–12 倍市销率，而在熊市或复苏期通常在 4–7 倍。凭借技术差异化，Exotec 稳居
              AMR 市场的高端梯队，但要撑住 $2B 估值，这一高估值倍数就必须顶住 2024–2025 年充满挑战的市场环境。


              其投资逻辑建立在三大价值驱动因素之上：(1) $400M 的 Next-Gen Skypod 在手订单，提供了相当于当前 1.5–2 年收入的远期能见度；(2) Deepsky WES SaaS
              软件层，随着装机量提升（每套新 Skypod 部署均会增加一个 Deepsky SaaS 席位），具备释放高毛利经常性收入的潜力；(3)
              北美商业化落地，相比欧洲本土市场，北美处于技术采纳曲线的更早期，蕴藏着未开发的 TAM。
            claimRefs:
              - CV001
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.2'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              乐观情景假设：Next-Gen Skypod 在量产中实现 50%+ 的吞吐量提升，在 Grainger 和 Oxford Industries 树立标杆客户口碑；北美收入在 2026 年底翻倍至
              $200M+（2023 年签约订单已达 $100M+，且持续增长）；2025 年市场回暖带动行业反弹 10–15%；Deepsky WES SaaS 年经常性收入（ARR）到 2027 年达到
              $30–50M；2027 年上半年完成 E 轮融资，由新领投方牵头，估值达 $3–3.5B。对应 2027 年隐含收入：$400–450M（较 2024 年估算基数实现 30–40% CAGR）。按 8
              倍市销率估算为 $3.2–3.6B；按 10 倍市销率（上限区间的 SaaS 叙事）估算为 $4.0–4.5B。


              基准情景假设：Next-Gen Skypod 性能达标，但 2025 年交付规模不及预期（产能爬坡慢于 $400M 在手订单目标）；北美收入在 2026 年底增至 $150–175M；2025 年市场温和复苏
              3–5%；Deepsky SaaS 业务贡献 $15–25M ARR；2026–2027 年以 $1.8–2.2B 估值完成 E 轮或战略性老股交易。对应 2026 年隐含收入：$300–350M（20–25%
              CAGR）。按 6 倍市销率估算为 $1.8–2.1B——估值与 2021 年基本持平或略有溢价。


              悲观情景假设：Next-Gen Skypod 吞吐量未达标（仅提升 30–40%，低于宣称的 50%），引发北美客户负面反馈；市场在 2025 年继续收缩 5–8%；Goldman Sachs
              行使退出优先权；在实现现金流转正前急需资金，从而触发 $1.2–1.5B 的下调估值融资（down-round），或是被战略买家（Dematic / KION Group、Vanderlande / TomTom
              或 Murata Machinery）低价收购。对应隐含出售价格：$1.0–1.5B，意味着 2021 年入局的投资者将面临 25–50% 的亏损。


              综合现有证据格局——$400M 的 Next-Gen 在手订单、连续 3 次入选 CNBC Disruptor 50 榜单、$100M+
              北美订单且同比翻倍——只要在投资前完成四项关键尽调条件的验证，整体判断倾向于基准情景，并保留博取乐观情景的上行期权。
            claimRefs:
              - CV001
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: 投资建议、先决条件与否决标准
        blocks:
          - type: paragraph
            body: >
              给出“有条件看好”的投资建议，底气来自 Exotec 差异化的技术架构、经验证的欧洲市场地位、可信的北美商业化扩张，以及独树一帜的 Next-Gen Skypod
              产品线。在完全独立（非亚马逊系）的仓储机器人厂商中，达到如此规模且具备这种技术差异化壁垒的，目前尚无同类玩家。


              在做出投资承诺前，必须核验四项先决条件：(1) 产能保障：Exotec 必须确认 Croix 工厂产能及代工方案足以在承诺期限内完成 $400M 的 Next-Gen 积压订单交付。(2) Next-Gen
              吞吐量实证：投资前，首批已投产的 Next-Gen Skypod 站点中至少须有一处（Grainger 或 Oxford Industries）在客户验收测试中实测出 45%+ 的吞吐量提升。(3) IEC
              62443 合规：考虑到欧盟 NIS2 对企业级客户的要求，Deepsky WES 必须具备推进中的 IEC 62443 Level 2 认证路径，并给出可信的 2025 年落地排期。(4) 股权结构表与
              Goldman 退出诉求一致：Goldman Sachs 的基金生命周期与退出偏好必须同 2027 年及以后的 IPO 或老股交易对齐，而非在 2025–2026 年被迫出售。


              已达到投资级标准的维度包括：技术差异化（3D AMR 架构具备坚实的硬件防御壁垒）、欧洲市场实证（135+ 处站点、E.Leclerc CEO 认可拣选时间缩减 5 分钟、Decathlon VP
              公开背书）以及团队素养（具备过往成功经验的创始人团队、Goldman 与 83North 的董事会监督）。


              将直接推翻投资逻辑的一票否决标准（Kill Criteria）：Next-Gen Skypod 在北美前三个站点中任何一处未能通过客户验收；Deepsky WES 在客户生产环境中遭遇网络攻击；Goldman
              Sachs 在未与投资人达成共识的情况下于 2026 年前启动老股出售；或者 Exotec 的 $400M 在手订单交付延误超过两个自然季度。
            claimRefs:
              - CV001
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
      - number: '8.4'
        title: 图表与佐证
        blocks:
          - type: callout
            title: 有条件看好——在核实投前四项尽调条件的前提下，按基准情景估值（$1.8–2.2B）入局
            body: >-
              Exotec 是一家具有真正差异化优势的仓储机器人企业，坐拥坚实的工程护城河与有力的欧洲市场实证。其投资风险主要集中在交割前即可核实的四个领域：(1) 制造产能充足性，(2) Next-Gen Skypod
              吞吐量实证，(3) Deepsky 的 IEC 62443 安全合规，以及 (4) Goldman Sachs
              的退出诉求一致性。若上述四项条件均得到满意核实，按基准情景估值（$1.8–2.2B）给出“有条件看好”的投资建议是恰当的。在缺乏 Next-Gen 批量放量实证的情况下，不建议按乐观情景估值（$2.5B+）入场。
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: 2021 年 $2B 估值在基准情景下尚可支撑，但在悲观情景下可能面临估值下调融资
            body: >-
              AutoStore 在公开市场的估值倍数回落（对应 $645M 收入为 4–6 倍市销率）以及 2024 年行业市场收缩（7–11%），使得 Exotec 隐含的 8–9 倍估值处于当前市场的高位区间。一旦
              Next-Gen Skypod 表现不及预期，或 Goldman Sachs 加速寻求退出，在 $1.2–1.5B 估值下进行估值下调融资（down-round）就是现实的悲观情景。2021
              年入局的投资者应据此对清算优先权堆叠进行压力测试。
            calloutType: insight
            claimRefs:
              - CV010
              - CV008
