      - number: '6.2'
        title: 采纳轨迹与客户扩张
        blocks:
          - type: paragraph
            body: >
              Exotec 的客户采纳轨迹有一系列清晰的运营里程碑佐证。从 2015 年成立时的 0 站点，到 2020 年达成 10 多个站点（首批商用交付），再到 2022 年突破 50 多个站点，并在 2024 年攀升至
              130–135 多个站点——2020 至 2024 年间站点数大致增长了 5–7 倍。北美采纳曲线是最核心的增长信号：北美订单签约额在 2023 年突破 $100M，较 2022 年翻番。自 2022
              年左右完成北美首单交付以来，北美市场一直被确立为公司的第一增长引擎。


              老客户复购动能至关重要：2025 年 2 月在 20 多个项目中锁定的 $400M Next-Gen Skypod 发布前合同，构成了最有力的采纳实证。签下 Next-Gen 系统的企业——Oxford
              Industries、Grainger、E.Leclerc——均为追加扩建的老客户，而非全新客群。这种复购行为有力证实了三点：（1）对初代系统的一线运营表现满意；（2）对 Exotec
              产品路线图充满信心；（3）多年期客户关系模型走得通。而在现有 135 多个站点之外的纯新增客户拓展情况，公开披露的信息相对有限。


              公司自称服务 50 多个知名品牌、累计部署 135 多个站点，折算下来平均每家客户部署约 2.7
              个站点——这表明相当比例的客户在首单落地后进行了扩建复购。不过，每家客户具体的建站分布数据尚未公开，客户集中度分析难以深入展开。
            claimRefs:
              - CU001
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: 标杆客户实证与留存评估
        blocks:
          - type: paragraph
            body: >
              客户佐证的质量因所处地域和合作年限而异。欧洲客户提供了最高质量的实证：E.Leclerc 首席执行官公开量化了运营效率提升（客户到店取货时长从 10–15 分钟降至 5 分钟以内）；Carrefour、Gap 和
              Decathlon 均被确认为公开交付客户。北美客户佐证的力度在不断增强：Grainger（纽交所代码：GWW，2023 年营收 $15.2B）与 Oxford
              Industries（纽交所代码：OXM）均为公开披露的 Next-Gen Skypod 客户，为北美大客户拓展树立了标杆级信誉。


              由于 Deepsky WES 的深度嵌入，客户留存的结构性壁垒极高。Deepsky 一旦与客户的 ERP 和 WMS 打通，切换成本便包括：（1）软件重新集成的研发成本（估计需耗费 3–6 个月的 IT
              工程时间）；（2）实体机器人与货架的拆除与置换开支；（3）过渡期内的仓库业务停摆风险；（4）一线仓储人员针对新系统重新培训的学习成本。上述多重切换成本共同构筑起老客留存的坚固护城河。


              最主要的客户留存风险在于 $400M Next-Gen Skypod 在手订单的实际交付表现。若 Next-Gen 系统在大规模投产后未能兑现宣称的吞吐量提升 50% 与存储密度增加 30%，像 Oxford
              Industries 和 Grainger 这类在纽交所上市、需公开披露供应链动态的企业，可能由正面背书转变为反向案例。其他反向客户佐证还包括：AutoStore 2024 年报提及行业市场整体收缩（下滑
              7–11%）——若自动化预算持续收紧，部分 Exotec 客户可能会推迟二期站点的扩建计划。
            claimRefs:
