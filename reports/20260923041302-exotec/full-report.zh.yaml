          detail: Deepsky API——向 Skypod 机队分发指令；向 Skypath 规划料箱路由；向 Skypicker 下达拣选任务；采集传感器数据接入监控
        - label: Skypod 机器人机队
          detail: 四驱 3D AMR 机器人；速度 4 m/s；负载 30kg；攀爬货架高度达 14m；搭载动能回收制动；每小时自主充电 5 分钟
