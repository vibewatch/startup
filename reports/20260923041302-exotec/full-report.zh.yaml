      - number: '5.2'
        title: 技术架构与工程差异化优势
        blocks:
          - type: paragraph
            body: >
              Skypod 机器人采用四轮驱动（4WD）架构与独立车轮控制，能在狭窄的货架巷道内实现精准的方向控制。机器人水平行驶速度最高达 4 m/s（13.1 ft/s）——处于 G2P 市场上 AMR
              的第一梯队。垂直攀爬依靠货架结构自带的导轨，机器人的驱动系统在切换至垂直运动时与导轨咬合。这种三维移动架构（单台机器人兼顾水平穿梭与垂直攀爬）构成了 Exotec 相比
              AutoStore（仅限网格顶部平面移动）和微型堆垛机（仅限垂直升降）的核心机械差异化优势。机器人配备动能回收系统——将减速过程中的动能转化为电能，降低净能耗。自主回充每小时仅耗时约 5
              分钟，无需人工干预；机器人在业务低谷期自动返回充电站，无需人工操作。


              Deepsky WES 是核心软件编排层。作为企业级软件平台，它通过 API 与客户的 ERP（SAP、Oracle）和 WMS（Manhattan Associates、Blue
              Yonder、JDA）打通。Deepsky 负责机器人派单调度、货位分配、交通管制、预测性维护告警以及运营绩效 KPI 报表。该软件不仅统筹 Exotec
              自家硬件，还能调度输送机、分拣机和第三方机器人等外部设备，将 Exotec 塑造成软件中立的整仓编排平台。Deepsky 支持本地部署（客户边缘基础设施）或混合云部署模式。


              设备制造集中在法国克鲁瓦（上法兰西大区），依托区域产业扶持政策与 Bpifrance
              的资金支持。机器人核心零部件包括驱动电机、车轮总成、传感器（激光雷达、接近传感器）以及充电接口——均采自欧洲与亚洲供应商。Skypicker 机械臂借助计算机视觉进行物品识别和抓取路径规划，其机器学习模型基于客户
              SKU 数据进行持续训练。
            claimRefs:
              - CE001
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: 可靠性、产品路线图与技术风险评估
        blocks:
          - type: paragraph
            body: >
              Exotec 最具说服力的技术论据源自一线实际运营：全球 135 多个生产站点单日运行循环破百万，可用性保持在 99%+。这是经受过生产规模实际检验的可靠性结论，绝非实验室跑分。99%+ 的可用性有合同 SLA
              兜底，具备明确的经济赔付约束。Deepsky 依靠实时监控（机器人健康遥测、电量状态、电机磨损）实现预测性维护，可在故障发生前主动介入检修。Exotec 客户成功与技术支持团队提供 24/7
              远程监控，并在出现硬件故障时派驻现场工程师。


              2025 年 2 月发布的 Next-Gen Skypod 路线图，标志着 Exotec 史上最大规模的技术迭代。核心提升包括：工作站吞吐量提升 50%、存储密度增加
              30%、单次机器人循环即可兼容单件与整箱拣选。来自 20 多个项目的 $400M 上市前订单，在正式商用前验证了客户对新一代产品的信心。公布的客户（Oxford
              Industries、Grainger、E.Leclerc）展现了跨行业采纳度（服装、工业品分销、商超）。


              核心技术风险包括：（1）制造集中度过高——单一工厂位于法国，带来供应链风险；一旦工厂停产将波及所有新系统的交付。（2）零部件供应链受限——电机与传感器供应商集中于欧美与亚洲；2021
              年后的芯片断供风波曾广泛冲击硬件机器人行业。（3）Deepsky 安全合规缺位——WES 软件平台未公开披露获得 SOC 2、ISO 27001 或 IEC 62443 等权威认证；大型企业客户（如
              Grainger、Oxford Industries）在投产前可能提出强制合规要求。（4）Skypicker 机器学习瓶颈——基于计算机视觉的抓取极度依赖 SKU 训练数据；在多 SKU 混合或高 SKU
              数量环境下的抓取性能衰减情况尚未公开披露。
            claimRefs:
              - CE001
