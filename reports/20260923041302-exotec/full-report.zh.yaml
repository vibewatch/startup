companyProfile:
  summary: >-
    Exotec 是一家法国仓储机器人企业，由机器人与机电工程背景的工程师 Romain Moulin（CEO）与 Renaud Heitz（CTO）于 2015 年创立。公司核心产品为 Skypod 系统，这是一款 3D
    自主移动机器人（AMR），能以 4 m/s 速度攀爬 14 米高的货架，以低于 100ms 的精度存取货物，并搭配负责统筹订单、机器人与输送机的 Deepsky WES（仓储执行系统）。2025 年 2 月发布的 Next-Gen
    Skypod 将吞吐量提升 50%，并在单一系统内打通单件与整箱分拣。Exotec 已在全球 50 多个品牌的 135 多个站点完成部署，发布前便斩获 $400M 的 Next-Gen 合同。公司于 2021 年 12 月以 $2B
    估值完成 $335M 的 Series D 轮融资（Goldman Sachs 与 83North 领投），此后未公布新一轮融资——截至 2026 年 9 月，资金充裕度已成为关键尽调问题。
