chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司沿革与创立
        blocks:
          - type: paragraph
            body: >
              2015 年 4 月 10 日，工程师 Romain Moulin 与 Renaud Heitz 在法国克鲁瓦（里尔都会区）注册成立 Exotec SAS。Moulin 是机器人工程师，曾联合创立 Bon
              Angle，出任 CEO；Heitz 则是资深软件与嵌入式系统工程师，出任 CTO。公司总部位于法国克鲁瓦（里尔），2022
              年在佐治亚州亚特兰大设立北美总部，并在德国慕尼黑与韩国首尔设有分支机构。核心使命是推动人机高效协同，依托货到人（G2P）自动化带来持久的仓储生产力。


              公司首款产品 Skypod 系统约于 2017 年实现商业化落地。早期的 AMR 往往局限在平面地面移动，而 Skypod
              凭借三维移动能力迅速建立差异化优势——自主机器人在巷道内横向穿行的同时，可沿垂直货架攀爬。这种三维移动能力构成核心技术壁垒，贯穿了后续所有产品迭代。
