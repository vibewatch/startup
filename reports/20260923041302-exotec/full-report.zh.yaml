  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体细分
        blocks:
          - type: paragraph
            body: >
              Exotec 的客户群横跨四大主力垂直行业：（1）生鲜商超零售（Carrefour、E.Leclerc、ASDA、Cdiscount）——欧洲生鲜到店自提履约是 Exotec
              最初的落地场景，按站点数算为第一大板块；（2）综合零售与服装（Gap Inc、Decathlon、UNIQLO、Oxford Industries）——Exotec
              最突出的北美标杆客户代表；（3）工业品分销（Grainger、Geodis）——Exotec 北美拓客主力；（4）电商与物流（Cdiscount、Geodis 及其他 3PL 运营商）。按地域划分，欧洲约占
              70–80%，北美约占 20–30%，日本则为刚起步的新兴市场。


              按客户规模划分，Exotec 主攻年营收 $500M 以上的中大型企业客户，因为一套 AS/RS 系统起步投资门槛在 $5M
              以上。采购方通常为副总裁级高管或首席供应链官，IT、财务与运营部门共同参与采购决策。买单方为企业主体——通常走资本开支（capex）预算。最终用户包括仓库运营主管、拣选员（人工或机械臂）以及负责打通
              Deepsky 与 WMS/ERP 的 IT 系统集成人员。


              E.Leclerc 落地案例是 Exotec 在生鲜商超领域的旗舰标杆：作为法国最大的商超零售商，其在多处站点进行了规模化部署，且获 CEO 亲自主推（客户取货时效从 10–15 分钟压缩至 5
              分钟以内）。Grainger 与 Oxford Industries 的落地部署（Next-Gen Skypod，2025 年）则是 Exotec
              在北美工业分销与服装领域的标杆代表——两家公司均在纽交所上市，遵循严格的大企业采购标准，为开拓北美大客户提供了极具公信力的背书。
            claimRefs:
              - CU001
