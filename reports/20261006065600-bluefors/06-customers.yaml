figures:
  - id: "FU001"
    title: "Bluefors Customer Adoption and Expansion Journey"
    type: "journey-map"
    summary: "Mapping the end-to-end customer journey from exploratory evaluation through capital procurement, installation, and long-term ecosystem expansion."
    data:
      nodes:
        - label: "1. Technical Evaluation & Proposal"
          detail: "Academic PIs and quantum hardware directors evaluate sub-10 mK cooling capacity, wiring options, and experimental volume with Bluefors sales physicists."
          touchpoints:
            - "Bluefors Lab trial facilities in Delft and Chicago"
            - "Scientific conferences and APS Global Physics Summit demonstrations"
            - "Custom engineering feasibility and cryogenic wiring proposals"
        - label: "2. Procurement & Custom Integration"
          detail: "Custom capital contract finalized; system configured with bespoke RF/DC wiring lines, superconducting magnets, and gas handling systems."
          touchpoints:
            - "Formal institutional research grant or competitive government tender"
            - "Gas handling specifications and Helium-3 isotopic mixture planning"
            - "Factory acceptance testing and dual-use export compliance clearance"
        - label: "3. Site Commissioning & Installation"
          detail: "Field engineers deliver and commission dilution refrigerator on customer premises; system achieves base operating temperature below 10 mK."
          touchpoints:
            - "Physical laboratory facility integration (compressor power and ceiling clearance)"
            - "Helium gas transfer and automated cooldown cycle verification"
            - "Hands-on researcher training and system control software orientation"
        - label: "4. Experimental Operations & Uptime"
          detail: "Customer conducts continuous low-temperature quantum computing or scientific experiments with ongoing factory technical support."
          touchpoints:
            - "Automated software monitoring and diagnostics logging"
            - "Cryomech pulse tube compressor maintenance and operational support"
            - "Direct technical liaison between laboratory researchers and Bluefors engineers"
        - label: "5. Land-and-Expand Fleet Scaling"
          detail: "Customer expands laboratory footprint by purchasing additional cryostats, modular platforms, wiring density upgrades, or helium recovery units."
          touchpoints:
            - "Procurement of Cryomech helium reliquefiers to recycle boil-off gas"
            - "Modular Cryogenic Platform upgrades for data center scaling"
            - "High-density flexible stripline and cryo-CMOS integration packages"
        - label: "6. Long-Term Fleet Maintenance & Uptime"
          detail: "Customers renew multi-year customer care contracts, source replacement pulse tube cold heads, and integrate next-generation gas handling infrastructure."
          touchpoints:
            - "Scheduled maintenance and cold head refurbishment agreements"
            - "On-site emergency engineering visits and sensor diagnostics support"
            - "Cryogenic measurement upgrades across subsequent quantum processor revisions"
    approximationNotes: "Journey phases represent the standard procurement, delivery, and expansion sequence documented across Bluefors technical sales and customer support operations."
