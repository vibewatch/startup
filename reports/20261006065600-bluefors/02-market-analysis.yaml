callouts:
  - calloutType: "insight"
    title: "The Cryogenic Wiring Crisis as the Principal Value Expansion Driver"
    body: "In quantum computing hardware, refrigerator value capture is shifting rapidly from the passive mechanical cryostat shell to the active internal signal delivery infrastructure. As processor sizes scale past 1,000 qubits, the requirement for 3,000 to 5,000 discrete transmission lines creates severe space and thermal bottlenecks, allowing Bluefors to capture premium margin on proprietary high-density flexible stripline wiring and integrated cryo-CMOS components."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Structural Inelasticity in Helium-3 Isotope Supply Chains"
    body: "Dilution refrigeration fundamentally depends on the quantum thermodynamics of helium-3 and helium-4 phase separation. With large dilution refrigerators requiring 18 to 40+ liters of scarce He-3 gas per charge, supply constraints linked to nuclear stockpile decays represent an unavoidable macroeconomic ceiling on rapid, unconstrained deployment across commercial quantum data centers."
    claimRefs:
      - "CM001"
      - "CM011"
      - "CM012"
