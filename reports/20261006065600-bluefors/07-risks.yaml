company:
  name: "Bluefors"
chapter:
  number: 7
  title: "Risks"
  summary: "Bluefors' clearest evidenced exposures are execution at global scale, dependence on controlled cryogenic inputs and installation quality, and an export-heavy operating footprint. The assigned public evidence does not establish litigation, regulatory breaches, recalls, outages, margins, cash burn, or counterparty concentration, so those items remain diligence gaps rather than asserted incidents."
sections:
  - id: "risk-ranking"
    title: "Risk ranking and residual exposure"
    body: >-
      The highest provisional residual risks are international execution and trade exposure, installation-input quality,
      and demand concentration around quantum and research infrastructure. The ranking reflects observable exposure rather
      than a recorded failure: DevCo reports that more than 90% of 2025 revenue was exported, Bluefors says more than
      1,500 systems are installed and fully operational worldwide, and its careers page describes global delivery by a
      workforce of more than 600. Those facts increase the consequence of logistics disruption, service inconsistency,
      or compliance friction, but the assigned sources do not report an actual violation or outage. The heatmap therefore
      labels likelihood and mitigation maturity as provisional and keeps unsupported incident frequencies unknown.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR011"
      - "CR015"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal"
    title: "Regulatory, legal, and safety uncertainty"
    body: >-
      Public-source coverage is insufficient for a definitive legal or regulatory conclusion. The evidence set describes
      cryogenic systems used in quantum computing and scientific research, a multi-country footprint, and an export share
      above 90%, all of which create a broad compliance surface. It does not, however, include a regulator filing, court
      record, sanctions decision, product recall, environmental permit, safety certification, or independent incident
      report. Export-control classification, destination licensing, helium-handling obligations, intellectual-property
      disputes, and cyber or product-safety history must therefore be verified in the data room. Absence of those records
      from this assigned pool is not evidence that no issue exists.
    claimRefs:
      - "CR005"
      - "CR007"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-quality"
    title: "Operational, quality, and scaling risk"
    body: >-
      The most concrete failure mode in the assigned material is process contamination. Bluefors' technical page says an
      LD installation needs at least 18 litres of helium-3, requires transfer during installation, and warns that mixtures
      from systems with oil pumps may contain impurities that can clog the system. Separately, customized systems put
      customers in direct contact with designing scientists and engineers, while the product stack spans wiring, filtering,
      amplification, diagnostics, and integrated magnets. That breadth can strengthen differentiation but also raises
      configuration-control, specialist-capacity, supplier-quality, and field-service demands. Public uptime, defect,
      warranty, recall, lead-time, and service-response data are not supplied, so mitigation maturity cannot be independently
      scored.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-triggers"
    title: "Dependencies, financial opacity, and thesis-break triggers"
    body: >-
      Bluefors disclosed EUR 217 million of 2025 revenue and 650 employees through investor DevCo, but the assigned sources
      provide no margin, cash-flow, working-capital, debt, backlog, customer-concentration, or supplier-concentration data.
      Funding raised or revenue must not be treated as cash availability, and no burn estimate is supportable here. The
      diligence plan should monitor four measurable triggers: export restrictions that delay material orders; repeated
      contamination or installation failures; service capacity failing to keep pace with the installed base; and a material
      demand or backlog contraction after product or acquisition expansion. Any unresolved legal restriction, recurring
      quality event, concentrated sole-source input, or deterioration in cash conversion should pause underwriting until
      quantified.
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR009"
      - "CR010"
      - "CR012"
      - "CR013"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
