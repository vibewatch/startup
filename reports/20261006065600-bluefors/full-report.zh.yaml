      - number: '7.3'
        title: 运营、质量与扩展风险
        blocks:
          - type: paragraph
            body: >-
              指定材料中最具体的故障模式是流程污染。Bluefors 技术页面称，LD 安装至少需要 18 litres
              helium-3，安装时需要转移，并警告油泵系统产生的混合物可能含有会堵塞系统的杂质。此外，定制系统让客户直接接触设计科学家和工程师，而产品栈覆盖布线、滤波、放大、诊断和集成磁体。产品广度可以强化差异化，但也提高了配置控制、专业人员产能、供应商质量和现场服务要求。公开材料没有提供正常运行时间、缺陷、保修、召回、交付周期或服务响应数据，因此无法独立评估缓解措施的成熟度。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
