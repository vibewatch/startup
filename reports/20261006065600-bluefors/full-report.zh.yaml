      - number: '8.2'
        title: 当前估值背景、倍数分析与投资判断情景
        blocks:
          - type: paragraph
            body: >-
              Bluefors 在 2026 年 9 月以独角兽身份建立了重要财务基准：年收入 €217 million，对应隐含估值 €1.0 billion，进入倍数约为历史收入的 4.6x [CV001, CV007,
              CV011]。自 2021 年起，芬兰主动持有型私募股权赞助方 DevCo Partners 持有多数股权；公司收入从 2024 年的 €200M 增长到 2025 年的
              €217M，同时在芬兰、美国、德国、日本和荷兰拥有超过 600 名专业人员，经营规模持续扩大 [CV007, CV012, CV013]。投资判断情景对应不同的行业路径：基准情景预计收入持续增长
              12%，实验室扩建和模块化低温平台推出支撑 EV/收入 4.5x–5.0x 的合理价值 [CV001, CV005]；乐观情景预计年增长 20%，量子数据中心超大规模建设和高密度布线互连问题解决后，倍数重估至
              6.0x–7.0x [CV006, CV011]；悲观情景则预计在商业量子融资长期放缓、氦-3 配额限制恶化的情况下，收入降至 €185M，倍数压缩至 2.5x–3.0x [CV006, CV008,
              CV009]。
            claimRefs:
