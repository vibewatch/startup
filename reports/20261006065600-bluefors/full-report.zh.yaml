  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排名与剩余暴露
        blocks:
          - type: paragraph
            body: >-
              暂定剩余风险最高的是国际执行与贸易暴露、安装投入品质量，以及对量子和研究基础设施的需求集中。该排名反映可观察暴露，而非已记录的失败：DevCo 报告称 2025 年超过 90% 的收入来自出口；Bluefors
              称全球已安装并完全运行的系统超过 1,500 套；其招聘页面描述了由 600
              多名员工提供全球交付。这些事实放大了物流中断、服务不一致或合规摩擦的后果，但指定来源没有报告实际违规或停运。因此，热力图将可能性和缓解成熟度标为暂定，并将没有依据的事件频率保留为未知。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR011
              - CR015
              - CR016
