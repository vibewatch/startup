      - number: '8.3'
        title: 投资建议、退出策略与尽调核验
        blocks:
          - type: paragraph
            body: >-
              我们给予 Bluefors “买入”建议，信心中等、风险中等，并以 €1.0B 交易估值为合理估值锚点 [CV001, CV011]。在整体仍偏投机的量子生态中，Bluefors
              兼具少见的盈利能力和实在的制造规模；学术研究资助以及面向全球已安装基数的售后服务，为下行提供即时保护 [CV004, CV014]。3 至 5 年投资周期内的自然退出路径包括在 Nasdaq Helsinki 或
              Euronext 上市，或出售给多元化工业仪器集团，例如 Oxford Instruments、Thermo Fisher Scientific 或 Keysight Technologies [CV006,
              CV011]。但 Bluefors 仍是 DevCo 私有持有的组合资产，没有公开审计资产负债表；最终执行投资前，必须核实准确毛利率、净债务杠杆和长期氦-3 供应量合同 [CV007, CV009,
              CV015]。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
