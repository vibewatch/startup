              - CU007
      - number: '6.2'
        title: 采用轨迹、累计安装量与具名部署证明
        blocks:
          - type: paragraph
            body: >-
              Bluefors 已展现经核实的商业采用，成为超低温科学仪器的硬件标杆；全球运行中的安装系统超过 1,500 套，年收入在 2024 年达到 EUR 200 million、2025 年达到 EUR 217
              million [CU001, CU008]。总收入超过 90% 来自国际出口，反映其在北美、欧洲和亚太地区的广泛采用 [CU001]。具名客户证明其深度融入生产型和原型量子路线图 [CU002,
              CU005]。2026 年 10 月，加拿大光子量子开发商 Xanadu 宣布与 Bluefors 开展数百万 USD
              的联合开发合作，为公用事业规模量子计算（USQC）设计模块化、经低温测试的原型及可大规模制造的数据中心模块 [CU002, CU009]。同样，2025 年 5 月，Bluefors 向日本 AIST 的
              G-QuAT Center 交付 18 套定制冷却系统，证明其在主权研究测试平台中进行多套部署的能力 [CU005]。Bluefors 与巴黎 cat-qubit 开发商 Alice & Bob
              的客户合作，以及与 Qblox、Delft Circuits 等低温控制和 I/O 专业公司的伙伴关系，也进一步证明了商业势头 [CU005, CU010]。但 B2B
              客户案例聚合平台的公开量化披露经常索引供应商软件画像，而非稀释制冷机硬件的原始遥测数据，因此详细客户使用日志、生产正常运行率和确切复购间隔仍属机密 [CU011]。
