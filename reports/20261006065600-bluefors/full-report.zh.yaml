      - - 同位素气体处理与调试
        - 手动转移气体混合物，存在同位素污染和管线堵塞风险
        - 配备专用 LN2 和 LHe 冷阱流程的气体处理系统
        - 在经核实的浓度阈值下安全转移 18L 至 40L He-3 充注量
        - 系统不会提前分析同位素组成，因此需要预先认证的气体批次
