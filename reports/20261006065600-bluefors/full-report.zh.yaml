      - number: '6.4'
        title: 论据
        blocks:
          - type: callout
            title: 全球标杆安装基数与战略客户护城河
            body: >-
              Bluefors 已在全球大学、国家实验室和商业量子计算开发商中安装超过 1,500
              套低温系统，拥有在位优势。深度客户工作流集成、专用实验室设施要求和多年期技术销售关系构成强大切换壁垒，保护市场份额和经常性售后收入。
            calloutType: strength
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
          - type: callout
            title: 量子比特互连瓶颈与量子融资敏感性
            body: >-
              随着量子处理器目标达到 1,000+ 个量子比特，3,000 到 5,000 个独立低温连接的需求给客户带来严峻的热和物理布线挑战。此外，商业量子硬件开发商是多单元模块化平台的主要增长驱动，因此 Bluefors
              仍暴露于量子行业更广泛的风险资本可得性和企业支出周期。
            calloutType: risk
            claimRefs:
              - CU002
              - CU003
