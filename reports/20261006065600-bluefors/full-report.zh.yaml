      - number: '7.4'
        title: 依赖、财务不透明与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              Bluefors 由投资方 DevCo 披露了 2025 年收入 EUR 217 million 和 650
              名员工，但指定来源没有提供利润率、现金流、营运资本、债务、订单积压、客户集中度或供应商集中度数据。融资额或收入不能被当作现金可得性，这里也无法支持任何烧钱估算。尽调计划应监测四个可量化触发器：导致重要订单延迟的出口限制；反复出现的污染或安装故障；服务能力跟不上安装基数；以及产品或收购扩张后需求或订单积压出现重大收缩。在任何未解决的法律限制、反复质量事件、集中于单一来源的投入品或现金转换恶化得到量化前，都应暂停投资判断。
