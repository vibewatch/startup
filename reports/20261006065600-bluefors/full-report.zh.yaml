        title: 运营里程碑、财务表现与尽调风险
        blocks:
          - type: paragraph
            body: >-
              财务上，Bluefors 2025 年年收入达到 €217 million，高于 2024 年披露的 €200 million；出口市场占公司总收入的 90% 以上。累计商业部署已超过 1,700
              套低温测量系统，向全球学术机构、研究设施和量子计算硬件开发商交付的低温冷却器超过 15,000 台。战略生态合作与机构部署进一步支撑商业势头，包括向日本 National Institute of
              Advanced Industrial Science and Technology (AIST) Global Research Center for Quantum-AI Fusion Technology
              (G-QuAT) 交付 18 套量子冷却系统，并与 Delft Circuits
              共同开发高密度量子输入/输出线缆。但尽调分析也指出关键战略约束：外部主权防务评估发现关键低温组件存在供应链依赖；更广泛的市场预测则记录了正在出现的量子布线危机和氦供应可得性挑战，这些问题需要下一代模块化低温集成来应对。
