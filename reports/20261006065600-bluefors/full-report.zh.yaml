            body: >-
              指定来源没有披露 Bluefors
              的目录价格、实际合同价格、折扣、交付周期、服务等级条款、渠道利润、供应商集中度或可比总拥有成本。官方页面引导买方选择定制系统并联系销售，这与按报价采购一致，但没有揭示经济性。页面还提出可靠性和市场领先地位主张，但证据集中没有独立基准、认证对比或客户采购记录加以支持。全球安装基数主张以及客户可直接接触工程师，说明公司具备触达能力和顾问式销售模式；但分销能力和合作伙伴准入仍未验证。因此，投资判断应把价格、性能、正常运行时间、互操作性和切换成本优势视为待尽调假设，而非已证明的护城河组成部分。
