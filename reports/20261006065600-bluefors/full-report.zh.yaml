      - number: '3.3'
        title: 切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              集成既能创造客户价值，也会带来锁定效应。随着冷却能力扩张，复用布线和系统架构应能降低升级扰动，但也可能让已安装平台成为后续扩容的默认路径。从技术上看，组件层面的多厂商并用似乎可行，因为市场上有专业布线、控制和制冷供应商；但指定证据没有记录实际互操作性。已识别的一份专利异议记录显示，Bluefors
              曾与 Oxford Instruments Nanotechnology Tools
              参与知识产权争议，但单一异议不能证明专利组合广度、实施自由或持久专利护城河。因此，护城河的持久性更明显地依赖安装基数、集成深度、服务和执行，而不是经独立证明的技术优越性。
            claimRefs:
