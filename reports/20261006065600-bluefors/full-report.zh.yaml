              - CM007
              - CM008
      - number: '2.4'
        title: 增长驱动、技术瓶颈与市场约束
        blocks:
          - type: paragraph
            body: >-
              超导和自旋量子比特处理器的量子比特数不断增加，推动市场增长，也造成低温工程师所称的“布线危机” [CM001, CM006]。量子比特规模超过 1,000 个的下一代系统，需要 3,000 到 5,000
              条独立同轴线、RF 线和 DC 线，把室温控制电子设备连接到 10 mK 以下的级段 [CM001]。这种指数级互连瓶颈正推动高密度柔性带状线、集成低温衰减器和 cryo-CMOS
              多路复用器的需求，以管理制冷机真空腔体内的热负荷与物理空间 [CM001, CM006, CM007, CM009]。


              但市场也面临严峻的供给侧和经济约束。首要结构性脆弱点是 helium-3 (^3He) 全球稀缺且价格波动；这种必需的非放射性同位素是实现 1 Kelvin 以下连续稀释冷却的前提 [CM001, CM011,
              CM012]。Bluefors XLD1000 等标准大型稀释系统，要运行至少需要 40 liters He-3 气体与 180 liters He-4 的混合物（对应 18%
              的同位素浓度）[CM011]。由于地球上的 He-3 产自核武器库存和重水反应堆中氚放射性衰变的工业副产物，全球总供应缺乏弹性 [CM011,
              CM012]。其他采用约束包括每套系统高额资本支出（单套安装通常超过数十万至数百万欧元）、实验室高切换成本、专用设施要求（例如三相压缩机电力和足够的净高），以及针对亚开尔文技术的严格两用出口法规 [CM001,
              CM003, CM004, CM011]。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM007
              - CM009
              - CM011
              - CM012
      - number: '2.5'
        title: 论据
        blocks:
          - type: callout
            title: 低温布线危机成为价值扩张的首要驱动
            body: >-
              在量子计算硬件中，制冷机的价值捕获正快速从被动机械式低温恒温器外壳转向内部主动信号传输基础设施。当处理器规模超过 1,000 个量子比特时，3,000 到 5,000 条独立传输线带来严重的空间和热约束，使
              Bluefors 能在自研高密度柔性带状线和集成 cryo-CMOS 组件上获取溢价利润。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
          - type: callout
            title: helium-3 同位素供应链的结构性缺乏弹性
            body: >-
              稀释制冷从根本上依赖 helium-3 与 helium-4 的相分离量子热力学。大型稀释制冷机每次充装需要 18 至 40+ liters 的稀缺 He-3
              气体，与核库存衰变相关的供应约束，构成商业量子数据中心快速、无约束部署无法绕开的宏观经济上限。
            calloutType: risk
            claimRefs:
              - CM001
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争框架与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争格局不只是稀释制冷机制造商清单。直接系统替代者包括 kiutra、Zero Point Cryogenics、Cryodynamics 和 Cryogenic
              Ltd；布线、控制和低温电子专业厂商也可能争夺技术栈中的单个层级。室温金刚石和光子量子架构属于计算架构层面的替代方案，因为其采用可能减少对 millikelvin
              基础设施的需求。现实中的现状是继续使用并逐步升级已安装的低温恒温器，内部集成也是买方选项之一，但指定来源没有证明任一路径的成本或普及程度。自动化公司目录需要谨慎看待：其中一个可比公司页面把 Bluefors
              与主要从事光纤和传感设备的企业归在一起，而非明确的低温同行。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.2'
        title: 产品广度、规模与战略方向
        blocks:
          - type: paragraph
            body: >-
              Bluefors 的差异化来自集成，而不是单一冷却组件。其公开材料将低温测量系统与 DC、RF 和光纤布线、滤波、放大、诊断、超导磁体、定制化和服务结合起来。公司披露已安装并运行的系统超过 1,500
              套，这是有用的规模信号，但仍是公司自报数据。其 2026 Modular Cryogenic Platform
              将布线插入件与冷却插入件分离，允许在不更换周边架构的情况下增加模块，从而把战略延伸到数据中心规模的部署。该路线图仍属未来规划：首个多模块平台计划于 2026 年末推出，因此公告规格不能视为已交付客户性能。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
