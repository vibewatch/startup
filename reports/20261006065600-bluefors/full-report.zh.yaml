  - id: FE001
    title: Bluefors 低温系统架构栈
    type: stack
    summary: Bluefors 低温测量系统的分层技术与运营架构，从环境基础设施一直延伸到毫开尔文量子载荷。
    data:
      layers:
        - label: 数据中心与设施基础设施
          detail: 可机架安装的压缩机、水冷机、电源，以及低矮型 HPC 数据中心占地集成。
        - label: 企业系统与 PLM 主干
          detail: Frends 中央集成平台连接 PLM 技术数据、ERP 物料清单与 CRM 工作流。
        - label: 真空容器与结构机架
          detail: 自支撑可扩展真空腔体，支持 800 kg 载荷和最多 36 个侧装布线端口。
        - label: 一级脉冲管预冷
          detail: Cryomech 脉冲管制冷机级，在 50K 和 4K 法兰处提供高制冷功率，并保持低振动性能。
        - label: 3He/4He 稀释制冷回路
          detail: 闭式循环稀释级利用氦-3/氦-4 相分离，实现超低毫开尔文基温。
        - label: 测量基础设施与量子载荷
          detail: 高密度柔性布线（FPC，每端口 240 个通道）、超导磁体、滤波器及量子比特芯片安装夹具。
    approximationNotes: 概念性架构栈，展示支撑 Bluefors 稀释制冷机的物理热级和运营软件层。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: Bluefors 客户采用与扩张旅程
    type: journey-map
    summary: 描绘客户从探索性评估、资本采购、安装到长期生态扩张的端到端旅程。
    data:
      nodes:
        - label: 1. 技术评估与方案
          detail: 学术 PI 和量子硬件负责人与 Bluefors 销售物理学家评估 10 mK 以下制冷能力、布线选项和实验空间。
          touchpoints:
            - Bluefors Lab trial facilities in Delft and Chicago
            - Scientific conferences and APS Global Physics Summit demonstrations
            - Custom engineering feasibility and cryogenic wiring proposals
        - label: 2. 采购与定制集成
          detail: 定制资本设备合同敲定；系统配置专用 RF/DC 布线、超导磁体和气体处理系统。
          touchpoints:
            - Formal institutional research grant or competitive government tender
            - Gas handling specifications and Helium-3 isotopic mixture planning
            - Factory acceptance testing and dual-use export compliance clearance
        - label: 3. 现场调试与安装
          detail: 现场工程师将稀释制冷机交付并在客户场地完成调试；系统达到低于 10 mK 的基准运行温度。
          touchpoints:
            - Physical laboratory facility integration (compressor power and ceiling clearance)
            - Helium gas transfer and automated cooldown cycle verification
            - Hands-on researcher training and system control software orientation
        - label: 4. 实验运行与正常运行时间
          detail: 客户在持续的工厂技术支持下，连续开展低温量子计算或科学实验。
          touchpoints:
            - Automated software monitoring and diagnostics logging
            - Cryomech pulse tube compressor maintenance and operational support
            - Direct technical liaison between laboratory researchers and Bluefors engineers
        - label: 5. 落地并扩展机群规模
          detail: 客户通过采购额外低温恒温器、模块化平台、布线密度升级或氦回收装置，扩大实验室规模。
          touchpoints:
            - Procurement of Cryomech helium reliquefiers to recycle boil-off gas
            - Modular Cryogenic Platform upgrades for data center scaling
            - High-density flexible stripline and cryo-CMOS integration packages
        - label: 6. 长期机群维护与正常运行时间
          detail: 客户续签多年客户关怀合同，采购替换用脉冲管冷头，并集成新一代气体处理基础设施。
          touchpoints:
            - Scheduled maintenance and cold head refurbishment agreements
            - On-site emergency engineering visits and sensor diagnostics support
            - Cryogenic measurement upgrades across subsequent quantum processor revisions
    approximationNotes: 旅程阶段代表 Bluefors 技术销售与客户支持运营中记录的标准采购、交付和扩展顺序。
