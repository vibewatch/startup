  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Bluefors 的可服务市场包括超低温（ULT）低温仪器和 10 millikelvin 以下的制冷基础设施，主要用于量子计算、先进科学研究和凝聚态物理 [CM001,
              CM006]。核心品类边界涵盖无制冷剂稀释制冷机测量系统、脉冲管低温冷却器、氦液化回收器和集成低温信号链，具体包括高密度同轴线与柔性带状线、微波衰减器、滤波器和低温放大组件 [CM001, CM006,
              CM007, CM010]。不属于这一直接商业品类的包括更高温的工业大宗制冷（如运行温度高于 77 K 的 LNG 处理或食品保存）以及非低温的经典计算数据中心冷却 [CM001]。


              在量子计算中，稀释制冷机是固态架构不可或缺的设备，尤其适用于 IBM、Google 和 Rigetti 推动的超导 transmon 电路以及硅自旋量子比特；这些架构严格要求低于 10 millikelvin
              的物理运行环境，以压低热噪声并保持量子相干性 [CM001, CM006, CM007]。现状替代方案及相邻冷却技术包括消耗液态 helium-4 和液氮浴的传统湿式稀释制冷机；但自 2007 年
              Bluefors 开创相关产品以来，商业市场已明确转向干式、闭循环脉冲管无制冷剂系统 [CM002, CM006, CM010]。囚禁离子、中性原子等其他量子模态通常在液氦温度（4
              K）下运行，或在超高真空腔体中使用激光冷却，因而具有不同的低温需求；Bluefors 通过专用脉冲管低温冷却器平台应对这些需求，而非使用 10 mK 以下稀释制冷机 [CM001, CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.2'
        title: 市场规模框架、TAM/SAM/SOM 层级与测算视角
        blocks:
          - type: paragraph
            body: >-
              低温量子基础设施的市场规模可从三个视角评估：超低温科学仪器总市场、2026 至 2036 年专业低温解决方案量子计算市场，以及 Bluefors 可服务的市场版图 [CM001, CM002, CM004,
              CM006]。更广义的全球低温设备和科学测量仪器行业构成数十亿美元规模的总可用市场（TAM），覆盖全球学术物理实验室、半导体测试平台和国家研究机构 [CM001, CM002,
              CM005]。在此基础上，可服务市场（SAM）聚焦低温量子计算基础设施，包括 10 mK 以下稀释制冷机、低温冷却器和集成信号链；行业分析师预计，随着硬件开发商扩大物理处理器规模，该市场将在 2026–2036
              年加速扩张 [CM001, CM006]。


              可获取市场（SOM）反映 Bluefors 直接竞争并占据市场领先地位的即时商业采购范围 [CM001, CM004, CM005]。Bluefors 报告 2024 年收入为 €200 million，2025
              年增至 €217 million，其中超过 90% 来自北美、欧洲和亚太地区的国际出口 [CM004]。独立目录和财务追踪数据库根据不同历史报告口径及公司子公司，估算其年收入运行率约为 $53.6 million
              至超过 €200 million；这反映了 Bluefors Oy 与 Cryomech 等被收购实体之间不同的合并边界 [CM002, CM004,
              CM005]。每套稀释制冷机的可获取金额空间，一个关键驱动因素是从裸机转向完整测量环境，后者配备多通道 RF 线、cryo-CMOS 电子设备和自动化气体处理 [CM001, CM006, CM010]。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM006
      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              超低温稀释制冷机的采购买方分为三类：商业量子计算硬件企业、学术及基础物理研究机构，以及政府/国防国家实验室 [CM001, CM003, CM004, CM005, CM008]。商业量子开发商包括
              IBM、Google 等超大规模云厂商，以及 IQM、Alice & Bob 等获得风投支持的纯量子公司；它们采购多套稀释制冷机阵列和模块化平台，预算通常归硬件工程副总裁和量子基础设施负责人管理 [CM001,
              CM003, CM008]。这一企业客群的采购周期看重低温可靠性、正常运行时间、交付计划以及高密度同轴线/带状线通道数量 [CM001, CM007, CM008]。


              学术机构和研究型大学代表 Bluefors 源自 Aalto University 低温实验室的传统根基 [CM002, CM003,
              CM004]。在学术客户中，预算由首席研究员（PI）和系主任掌握，主要来自多年期政府研究拨款、科学基金分配或慈善捐赠资本 [CM003, CM008]。在国家防务和政府实验室中，例如 2025 年 5 月接收
              18 套 Bluefors 量子冷却系统、用于其 G-QuAT Center 的日本 National Institute of Advanced Industrial Science and
              Technology (AIST)，采购遵循正式竞争性招标程序，并受战略技术主权、供应链完整性和两用出口管制合规要求约束 [CM003,
              CM008]。所有细分市场的技术销售都要求物理学家、销售工程师和客户实验室团队在专业领域上深度协同 [CM007, CM008]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
