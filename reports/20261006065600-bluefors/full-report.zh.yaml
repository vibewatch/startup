  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、技术护城河与商业反论点
        blocks:
          - type: paragraph
            body: >-
              Bluefors 的核心投资论点建立在其深厚的技术与商业统治力之上：它是全球量子硬件行业不可或缺的“卖铲人”[CV001, CV002]。公司的自动稀释制冷机和 Cryomech 脉管制冷机运行在低于 10
              毫开尔文的温度，构成超导量子比特和高灵敏度量子传感器所需的关键热环境 [CV002, CV003]。全球已安装的稀释制冷机超过 1,500 台、制冷机超过 15,000
              台，这道护城河进一步加深了实验室层面的高切换成本，也让其在顶尖大学、AIST 的 G-QuAT 等主权研究中心和商业硬件先行者中拥有很高的客户黏性 [CV001, CV004,
              CV005]。反过来，反论点集中在量子资本开支的周期性、实物商品的严重约束和地缘政治暴露 [CV006, CV007]。稀释系统高度依赖稀有的氦-3 气体：标准 LD 系统需要 18 升，大型 XLD1000
              型号至少需要 40 升；全球同位素稀缺与价格波动因此持续卡住供应链 [CV008, CV009]。此外，公司超过 90%
              的收入来自国际出口，多边两用物项出口管制趋严，加上商业量子公司可能暂停风险投资融资，都会压缩近期硬件交付量 [CV007, CV010]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
