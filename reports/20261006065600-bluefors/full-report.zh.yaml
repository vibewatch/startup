      - number: '6.3'
        title: 留存动态、扩张轨迹与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              低温仪器的客户留存和客户终身价值，结构上由高昂的实验室切换成本和深度物理工作流集成支撑 [CU004, CU006, CU007]。研究机构或量子企业一旦部署 Bluefors
              稀释制冷机，并配套定制射频（RF）、直流（DC）和光纤信号布线、自动化气体处理系统及专用 helium-3 气体充装，更换供应商所需的运营成本、校准停机时间和设施重构都很高 [CU004,
              CU007]。扩张遵循“先落地、再扩张”模式：客户先采购单台稀释制冷机（如 LD 或 XLD 系列），之后再扩充高毛利低温测量附件、高密度柔性线缆、Cryomech
              品牌脉冲管低温冷却器、机架式压缩机和氦液化回收升级 [CU004, CU010, CU012]。为承接企业扩张，Bluefors 运营区域枢纽和共享实验室设施，例如 Delft 的 Bluefors Lab 及
              University of Chicago Science Incubator 的共享设施，让潜在企业买方在投入资本前先试用设备 [CU005]。尽管切换壁垒很高，公司仍面临显著的集中度和采购脆弱性
              [CU002, CU003, CU013]。由于面向 1,000 个量子比特扩展的量子计算机需要 3,000 到 5,000
              个独立低温连接，客户资本部署会暴露于量子计算宏观融资周期、风险资本收缩和联邦拨款时间安排 [CU003, CU013]。ReviewBolt
              等第三方网络评论聚合平台给出的收入顶线估算互相矛盾或未经验证，说明信息不对称掩盖了非公开客户流失、净收入留存率（NRR）和大客户收入集中度 [CU014]。
            claimRefs:
              - CU002
              - CU003
