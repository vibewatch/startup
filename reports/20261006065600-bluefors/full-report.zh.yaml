  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层、买方画像与战略价值
        blocks:
          - type: paragraph
            body: >-
              Bluefors 的客户基础分为三大机构客群：商业量子计算企业、政府和国防研究实验室，以及学术物理系 [CU001, CU002]。Xanadu、IBM、Google 和 Rigetti
              等商业量子计算硬件开发商是战略价值和收入价值最高的客群，为公用事业规模的量子计算数据中心采购数百万美元级资本硬件系统、模块化低温平台和高密度实验线束 [CU001, CU002,
              CU003]。在这一企业客群中，买方通常是硬件工程副总裁或量子基础设施负责人，采购决策取决于 10 millikelvin 以下的冷却能力、真空容积、正常运行可靠性和多通道微波 I/O 集成 [CU002,
              CU003, CU004]。第二类是国家支持的研究机构，例如日本 National Institute of Advanced Industrial Science and Technology
              (AIST)，其为 Global Research and Development Center for Business by Quantum-AI Technology (G-QuAT) 接收了 18
              套先进量子冷却系统 [CU005]。这些机构客户通过由政府战略技术计划资助的全国竞争性招标采购大批量设备 [CU005]。第三类是全球大学物理和量子信息实验室，首席研究员（PI）依靠 Bluefors
              稀释制冷机开展基础凝聚态研究和探索性量子比特表征 [CU001, CU006]。学术客户单笔采购资本预算低于工业超大规模云厂商，但能在全球研究中心提供持续、多元的订单基础、售后服务机会和长期人才管线
              [CU001, CU007]。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
