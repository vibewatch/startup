      - number: '1.2'
        title: 产品组合、商业规模与全球运营
        blocks:
          - type: paragraph
            body: >-
              Bluefors 商业化的低温系统可将工作温度降至 10 millikelvin
              以下，为超导量子电路、量子计算处理器和高灵敏度量子传感器阵列提供必要的热环境。公司提供自动化无制冷剂稀释制冷机、脉冲管低温冷却器、模块化低温基础设施，以及覆盖直流、射频和光纤信号通道的高密度实验布线。借助位于纽约州
              Syracuse 的业务，Bluefors 通过 Cryomech 品牌商业化脉冲管低温冷却器和氦管理解决方案，显著扩大了制造与技术版图。公司在芬兰赫尔辛基和纽约州 Syracuse
              设有总部、研发及生产设施，在慕尼黑、东京和 Brooklyn 设有区域销售与客户服务办公室，并在 Chicago 和 Delft 设有专业客户演示实验室，形成国际运营网络。到 2025 年，全球员工人数已增至
              700 多人，分布于多个大洲。
