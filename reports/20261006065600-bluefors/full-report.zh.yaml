chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、所有权与治理
        blocks:
          - type: paragraph
            body: >-
              Bluefors Oy 是一家专业低温制冷设备、测量系统和模块化基础设施制造商，主要服务全球量子计算开发商与低温科学研究人员。公司运营起源可追溯至 2008 年芬兰赫尔辛基，最初是赫尔辛基理工大学低温实验室（现为
              Aalto University）前沿低温物理研究的商业分拆项目。2021 年，赫尔辛基主动持有型私募股权公司 DevCo Partners
              完成投资，推动公司从创始人控制转向机构所有，并加快国际扩张与工业化。公司由独立董事会治理，主席为 Kimmo Alkio；DevCo 合伙人 Lauri Stadigh 任副主席，DevCo 投资负责人
              Vanechka Patel、运营高管 Juha Räisänen，以及联合创始人 Rob Blaauwgeers 和 Pieter Vorselman 共同任董事。日常经营由首席执行官 Kim Povlsen
              负责；他此前曾任 Universal Robots A/S 总裁兼 CEO，并在 Schneider Electric 担任过多个高级管理职务。
