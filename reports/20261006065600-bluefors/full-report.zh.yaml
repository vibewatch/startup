  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 低温测量架构与物理技术栈
        blocks:
          - type: paragraph
            body: >-
              Bluefors 设计无制冷剂超低温测量系统，为量子信息科学和基础物理研究提供安静、稳定的热环境 [CE001, CE002]。物理运行模型的核心，是将闭循环脉冲管制冷与 Helium-3/Helium-4
              稀释制冷级结合，把基准温度降至 millikelvin 区间 [CE002, CE003, CE004]。主系统硬件包括成熟的 LD（标准型和 Ultra-Compact）及 XLD
              稀释制冷机系列，采用侧装端口，便于安装模块化测量基础设施 [CE003, CE004, CE005]。为应对把高频控制线从室温引至 millikelvin 级段时的极端热传导和信号衰减问题，Bluefors
              集成了 DC 线、同轴 RF 线缆、光纤、低温衰减滤波、信号放大和超导磁体等专业测量基础设施 [CE002, CE003]。机械结构采用多法兰冷级，从室温真空边界开始，依次经过 50 K 级、4 K
              脉冲管法兰、中间 still 和冷板，最终到达混合室底板 [CE003, CE005]。系统依靠闭循环氦气处理系统运行；标准 LD 单元需要 18 liters Helium-3，大型 XLD1000
              低温恒温器则至少需要 40 liters Helium-3 和 180 liters Helium-4 的既定同位素混合物 [CE005]。
            claimRefs:
