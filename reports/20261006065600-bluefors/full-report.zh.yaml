  - id: FV001
    title: Bluefors 投资建议决策流程
    type: flow
    summary: 决策架构展示从技术与商业规模、风险缓释到“买入”建议的逻辑链条。
    data:
      nodes:
        - id: market-leadership
          label: 低温技术领先地位
          detail: 在 10 mK 以下稀释制冷和脉冲管制冷机领域已成为稳固标准。
          tone: positive
        - id: commercial-scale
          label: 商业财务基线
          detail: 2025 年收入 €217M，全球已安装系统超过 1,500 套。
          tone: positive
        - id: critical-risks
          label: 供应与周期性风险因素
          detail: 氦-3 商品稀缺、两用物项出口管制，以及量子 VC 寒冬。
          tone: warning
        - id: operational-mitigations
          label: 现有护城河与缓释措施
          detail: 实验室切换成本高、配备氦回收系统，并在美国和欧盟双地制造。
          tone: positive
        - id: valuation-assessment
          label: 估值基准评估
          detail: 隐含估值 €1.0B 对应 4.6 倍 EV/收入的合理入场倍数。
          tone: neutral
        - id: final-recommendation
          label: 投资建议：买入
          detail: 纪律化配置资本，信心度为中等，重点核查资产负债表。
          tone: positive
    approximationNotes: 流程图按技术、运营、财务和估值标准，展示定性与定量投资判断关卡。
