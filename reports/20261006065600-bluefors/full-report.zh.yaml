        title: 收入来源、商业定价架构与产品组合
        blocks:
          - type: paragraph
            body: >-
              Bluefors 主要是一家超低温低温测量系统和低温冷却器子系统专业原始设备制造商，提供 LD、XLD 和超紧凑系列稀释制冷机，以及脉冲管低温冷却器和氦回收设备
              [CI001]。商业收入以资本设备硬件销售为核心，并由实验型低温测量基础设施补充，包括高密度 DC、RF 和光纤实验布线、信号放大、滤波诊断和集成无制冷剂超导磁体
              [CI002]。主稀释制冷机系统的商业交易通常是每套数十万至数百万级资本支出，具体取决于客户对实验线路容量、定制磁体和 helium-3 同位素充装的配置要求 [CI003,
              CI004]。目录价格不公开，而是按工程定制报价，因此标准价格表与实际合同价格之间存在信息不对称 [CI004]。经常性和售后变现来自 Cryomech
              品牌低温冷却器备件、机架式压缩机、氦液化回收器、脉冲管维护套件，以及从拆箱到全生命周期运营管理的直接工程支持服务 [CI005, CI006, CI007]。出口市场占总收入 90%
