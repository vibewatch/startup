        title: 展示项
        blocks:
          - type: callout
            title: 硬件领先与合理估值支撑严谨的买入建议
            body: >-
              Bluefors 是量子计算生态中优质的基础设施投资标的：产品领先地位无可争议，年收入 €217M，在 €1.0B 估值下进入 EV/收入倍数仅
              4.6x，颇具吸引力。私有持有使准确利润结构不透明，但学术和机构研究实验室带来的防御性现金流，为下行提供了显著保护。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV014
          - type: callout
            title: 氦-3 同位素依赖要求主动核验供应链
            body: 没有稀有氦-3 气体，稀释制冷无法运行；每套系统需要 18 至 40+ 升。潜在投资者必须把原料气体供应和再液化回收的采用情况视为关键尽调门槛，以确保长期制造连续性。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
