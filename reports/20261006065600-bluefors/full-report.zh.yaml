      - number: '4.2'
        title: 运营成本结构、氦经济学与规模驱动
        blocks:
          - type: paragraph
            body: >-
              Bluefors 的成本结构结合了精密机械制造、高规格电气装配和专业科学工程，分布于芬兰赫尔辛基与纽约州 Syracuse 两个制造基地 [CI009]。员工扩张与商业规模同步：Cryomech 收购前约 400
              人，2023 年合计接近 600 人，2024 年 642 人，到 2025 年增至 650 人，分布在芬兰、美国、德国、荷兰和日本的设施 [CI009,
              CI010]。直接材料成本高度暴露于全球低温商品供需，尤其是 Helium-3 和 Helium-4 同位素的供应与价格波动 [CI011]。稀释系统运行需要大量气体库存：标准 LD 系统至少需要 18
              liters He-3（浓度约 17%），而更大型的 XLD1000 系统至少需要 40 liters He-3 和 180 liters He-4
              [CI003]。这种同位素依赖使系统物料清单和客户调试预算暴露于氦采购通胀，促使 Bluefors 开发内部液化回收方案并探索长期月球供应协议，以隔离地面资源约束对运营利润率的影响 [CI006,
              CI011]。技术销售和现场工程也是重要运营支出，因为获客依赖专业物理学家与工程师提供顾问式技术方案，而非标准化交易销售 [CI012]。
