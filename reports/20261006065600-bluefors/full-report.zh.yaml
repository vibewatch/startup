      - number: '7.2'
        title: 监管、法律与安全不确定性
        blocks:
          - type: paragraph
            body: >-
              公开来源覆盖不足以得出确定的法律或监管结论。证据集描述了用于量子计算和科学研究的低温系统、跨多个国家的业务版图以及超过 90%
              的出口占比，这些因素共同形成广泛的合规范围。但证据集没有包括监管机构申报、法院记录、制裁决定、产品召回、环境许可、安全认证或独立事件报告。因此，出口管制分类、目的地许可、氦处理义务、知识产权争议，以及网络或产品安全历史，都必须在数据室中核实。指定材料中没有这些记录，并不证明不存在问题。
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR010
