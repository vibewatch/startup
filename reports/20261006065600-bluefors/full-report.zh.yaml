        - 提供连续统一的载荷空间，支持最多数十万个量子比特
        - 在 HPC 设施中需要较大的占地面积及设施基础设施集成
      - - 升级低温冷却与布线
        - 耦合式设计导致升级冷却或布线时都必须完全拆解
        - 物理解耦的冷却单元和测量布线插入件
        - 无需重新布线即可独立更换或升级冷却能力
        - 多模块腔体接口处的机械公差和真空密封复杂
      - - 布设高密度微波线路
        - 分立的半刚性不锈钢或同轴电缆造成严重热泄漏
        - 高密度柔性布线（FPC），每个侧装端口最多 240 个通道
        - 每个端口最多 240 个通道，并显著降低被动热传导
        - 与独立模块化同轴电缆线路相比，通道可重配置性有限
      - - 脉冲管一级热负荷
        - 标准 4K 脉冲管级在高布线负荷下受固定冷却功率限制
