companyProfile:
  summary: >-
    Bluefors is a Helsinki-based private manufacturer of cryogenic measurement systems,
    dilution refrigerators, and cryocoolers serving quantum computing developers, research
    institutes, and low-temperature physics labs. Founded in 2008 as an academic spin-off,
    the company has since scaled into an international industrial platform with DevCo Partners
    as majority owner and a 2025 revenue base of EUR 217 million.
