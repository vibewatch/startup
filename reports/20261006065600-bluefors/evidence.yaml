evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: equity-valuation-and-capitalization
    missingEvidence: >-
      Total transaction valuation and exact equity ownership percentages from DevCo's 2021 investment remain undisclosed
      private data.
    whyItMatters: >-
      Prevents independent determination of implied enterprise valuation, debt capitalization, and minority founder
      ownership stakes.
    diligencePath: Inspect DevCo annual fund disclosures or Finnish Trade Register (PRH) audited financial statements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: quantum-computing-revenue-breakdown
    missingEvidence: >-
      Segmented financial breakout separating quantum computing revenue from fundamental physics research and life
      sciences.
    whyItMatters: Obscures the exact commercial exposure to commercial quantum computing adoption versus academic research grants.
    diligencePath: Request management product line revenue reporting and customer segment breakdowns during diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: dual-use-compliance
    missingEvidence: >-
      Granular compliance audits and export license approval ratios for Bluefors dilution refrigerators under dual-use
      export control regimes.
    whyItMatters: Affects delivery timelines and addressable market access in non-allied international quantum research markets.
    diligencePath: Review European Commission dual-use trade licensing notices and national strategic export control filings.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-and-procurement
    missingEvidence: >-
      Realized quotes, discounts, contract duration, warranty, service levels, lead times, and comparable total cost of
      ownership.
    whyItMatters: Price-performance and lifecycle economics could reverse the apparent advantage of integration breadth.
    diligencePath: >-
      Obtain recent competing bids and customer contracts for matched cooling-power, wiring, magnet, installation, and
      service configurations.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: distribution-power
    missingEvidence: >-
      Channel mix, distributor and partner terms, supplier concentration, backlog, delivery lead times, and competitor
      access to critical components.
    whyItMatters: >-
      Distribution reach and constrained supply may determine win rates and deployment timing more than published
      feature breadth.
    diligencePath: >-
      Request channel and supplier schedules, backlog aging, lead-time history, and partner-sourced pipeline;
      corroborate through customer and supplier calls.
    relatedQuestionRefs:
      - QP010
  - type: missing-source
    severity: material
    topic: competitive-proof
    missingEvidence: >-
      Independent matched-condition benchmarks for cooling power, vibration, uptime, installation time, service
      response, and interoperability.
    whyItMatters: >-
      Company-issued reliability and leadership claims cannot establish a durable performance moat without comparable
      measurements.
    diligencePath: >-
      Commission reference calls and review acceptance-test data from customers that evaluated at least two cryogenic
      platforms.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-gaps
    missingEvidence: >-
      Audited gross margin percentages, cost of goods sold breakdowns, and operating EBITDA figures for FY2024 and
      FY2025.
    whyItMatters: >-
      Gross margin sustainability is essential to evaluate how effectively Bluefors absorbs cryogenic hardware component
      and helium isotope inflation.
    diligencePath: >-
      Request confidential historical financial statements and segment profitability breakdowns under an institutional
      NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: pricing
    missingEvidence: >-
      Standard baseline price schedule and average realized selling prices (ASP) across modular dilution refrigerator
      product lines.
    whyItMatters: >-
      Understanding list versus realized pricing informs unit sales velocity and capital efficiency across academic and
      commercial buyer classes.
    diligencePath: >-
      Obtain sanitized customer tender bids and recent historical quote schedules directly from commercial sales
      management.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: hpc-deployment
    missingEvidence: >-
      Production data center environmental qualification metrics, acoustic noise ratings, and MTBF benchmarks for the
      Modular Cryogenic Platform.
    whyItMatters: >-
      Data center operators require verified facility vibration thresholds, cooling water flow tolerances, and
      continuous operational uptime before hosting quantum systems.
    diligencePath: Request customer deployment test reports and facility integration manuals from Bluefors systems engineering.
    relatedQuestionRefs:
      - QE005
      - QE007
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: flex-wiring
    missingEvidence: >-
      Published S-parameter RF attenuation profiles, return loss curves, and inter-channel isolation figures across
      gigahertz frequencies for High-Density Flex Wiring.
    whyItMatters: >-
      Quantum engineers need exact insertion loss and phase stability data across operating microwave frequencies to
      validate qubit control fidelity.
    diligencePath: Obtain detailed component characterization datasheets from Bluefors measurement infrastructure product management.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Audited customer revenue concentration schedules identifying percentage of revenue derived from top 5 and top 10
      accounts.
    whyItMatters: >-
      High customer concentration among a few commercial quantum computing developers or sovereign national laboratory
      tenders could expose revenue to lumpy capital cycles.
    diligencePath: >-
      Request customer concentration tables by revenue tier and backlog commit status from Bluefors management under
      confidentiality.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: retention-and-nrr
    missingEvidence: >-
      Quantitative net revenue retention (NRR), gross revenue retention (GRR), and dilution refrigerator system
      replacement / upgrade cycle data.
    whyItMatters: >-
      Without historical cohort retention and repeat purchase rates, underwriters cannot verify the recurring quality of
      customer hardware expansion.
    diligencePath: >-
      Perform customer reference calls across academic and commercial accounts to audit repeat purchase frequency,
      maintenance attach rates, and contract renewals.
    relatedQuestionRefs:
      - QU005
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-deployments
    missingEvidence: >-
      Exhaustive global registry of all 1,500+ installed systems across institutional, government, and commercial
      laboratories.
    whyItMatters: >-
      A complete installed base enumeration would permit precise geographic, customer vertical, and fleet age
      distribution analysis.
    diligencePath: Review sanitized installed base telemetry or regional CRM shipment databases during confirmatory diligence.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: legal-regulatory
    missingEvidence: >-
      Primary records for export classifications and licenses, litigation, patents, recalls, safety, environmental
      permits, privacy, cyber incidents, and enforcement by Bluefors legal entity.
    whyItMatters: Without primary records, legal likelihood, mitigation maturity, and residual liability cannot be scored.
    diligencePath: >-
      Search regulator, customs, sanctions, court, patent-office, recall, environmental, and data-protection databases
      in each operating jurisdiction, then reconcile results to the data room.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Gross margin, EBITDA, cash flow, cash balance, debt, capex, inventory, backlog, working capital, warranty
      reserves, and cash-conversion history.
    whyItMatters: >-
      Revenue and funding history do not reveal cash burn, liquidity, capital intensity, margin resilience, or financing
      need.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, debt schedules, capex plans, backlog aging, and
