        - Not disclosed
        - Cooling system with configurable measurement infrastructure and magnets
        - Compare realized quote, acceptance criteria, warranty, uptime, and service terms
      - - Bluefors Modular Cryogenic Platform
        - Start with one module and add modules or replace inserts over time
        - Not disclosed
        - Expandable chamber, cooling inserts, wiring inserts, and large payload space
        - Model expansion cost against full-system replacement and platform lock-in
      - - Direct refrigerator alternatives
        - Product purchase model is visible; contract terms are not
        - Not disclosed
        - Refrigeration or cryostat platform, depending on vendor
        - Require like-for-like cooling power, wiring, service, and lead-time quotes
      - - Component specialists
        - Layer-specific equipment or integration
        - Not disclosed
        - Wiring, control hardware, cryogenic electronics, or cooling components
        - Multi-vendor integration may improve choice but add engineering and support burden
      - - Architecture substitute or internal build
        - Alternative architecture or internally integrated stack
        - Not disclosed
        - Potentially avoids or reduces dependence on a packaged dilution-refrigerator platform
        - Compare full lifecycle cost, technical risk, staffing, and time to deployment
    notes: >-
      No assigned source disclosed list or realized prices, discounts, contract duration, channel
