    title: Competitive positioning by integration breadth and cryogenic centrality
    type: quadrant
    summary: >-
      Ordinal positioning separates integrated cryogenic platforms from component specialists and
      quantum architectures that reduce or avoid cryogenic dependence.
    data:
      xAxis: "Integration breadth: narrow component (1) to full platform (5)"
      yAxis: "Cryogenic-system centrality: avoids cryogenics (1) to core refrigerator platform (5)"
      points:
        - label: Bluefors
          x: 5
          y: 5
          detail: Integrated cooling, measurement infrastructure, magnets, service, and modular expansion
        - label: kiutra
          x: 3
          y: 5
          detail: Alternative cooling technology positioned for Kelvin and sub-Kelvin use
        - label: Zero Point Cryogenics
          x: 3
          y: 5
          detail: Dilution refrigerators and cryostats for quantum sensing and computing
        - label: Cryogenic Ltd
          x: 4
          y: 4
          detail: Low-temperature systems, magnets, and measurement instruments
        - label: Cryogenic component specialists
          x: 2
          y: 3
          detail: Wiring, control, and electronics layers used within a broader system
        - label: Photonic or room-temperature architectures
          x: 4
          y: 1
          detail: System-level substitutes whose designs reduce or avoid cryogenic dependence
    approximationNotes: >-
      Scores are analyst-authored ordinal placements from described product scope, not measured
      performance, market share, or price; a one-point difference is not a quantified advantage.
    claimRefs: [CP015]
callouts:
  - calloutType: strength
    title: Integration is the clearest visible differentiator
    body: >-
      The assigned evidence supports product breadth and modularity more strongly than it supports
      claims of superior performance, price, or uptime.
    claimRefs: [CP001, CP002, CP004]
  - calloutType: risk
    title: Architecture substitution can bypass the category
    body: >-
      Photonic and room-temperature quantum approaches are not direct refrigerator competitors,
      but broader adoption could reduce the amount of ultra-low-temperature infrastructure needed.
    claimRefs: [CP008]
