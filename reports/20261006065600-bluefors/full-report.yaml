      - number: '7.3'
        title: Operational, quality, and scaling risk
        blocks:
          - type: paragraph
            body: >-
              The most concrete failure mode in the assigned material is process contamination. Bluefors' technical page
              says an LD installation needs at least 18 litres of helium-3, requires transfer during installation, and
              warns that mixtures from systems with oil pumps may contain impurities that can clog the system.
              Separately, customized systems put customers in direct contact with designing scientists and engineers,
              while the product stack spans wiring, filtering, amplification, diagnostics, and integrated magnets. That
              breadth can strengthen differentiation but also raises configuration-control, specialist-capacity,
              supplier-quality, and field-service demands. Public uptime, defect, warranty, recall, lead-time, and
              service-response data are not supplied, so mitigation maturity cannot be independently scored.
