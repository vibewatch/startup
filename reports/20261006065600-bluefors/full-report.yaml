            body: >-
              The highest provisional residual risks are international execution and trade exposure, installation-input
              quality, and demand concentration around quantum and research infrastructure. The ranking reflects
              observable exposure rather than a recorded failure: DevCo reports that more than 90% of 2025 revenue was
              exported, Bluefors says more than 1,500 systems are installed and fully operational worldwide, and its
              careers page describes global delivery by a workforce of more than 600. Those facts increase the
              consequence of logistics disruption, service inconsistency, or compliance friction, but the assigned
              sources do not report an actual violation or outage. The heatmap therefore labels likelihood and
              mitigation maturity as provisional and keeps unsupported incident frequencies unknown.
