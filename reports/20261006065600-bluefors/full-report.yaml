      - number: '6.2'
        title: Adoption Trajectory, Cumulative Installations, and Named Deployment Proof
        blocks:
          - type: paragraph
            body: >-
              Bluefors demonstrates verified commercial adoption that sets the hardware benchmark for ultra-low
              temperature scientific instrumentation, backed by an operational fleet exceeding 1,500 installed systems
              worldwide and annual revenue reaching EUR 200 million in 2024 and EUR 217 million in 2025 [CU001, CU008].
              More than 90% of total revenue is generated through international exports, reflecting broad geographical
              adoption across North America, Europe, and the Asia-Pacific region [CU001]. Named customer proof
              demonstrates deep integration into both production and prototype quantum roadmaps [CU002, CU005]. In
              October 2026, Canadian photonic quantum developer Xanadu announced a multi-million USD joint development
              collaboration with Bluefors to engineer a modular, cryo-tested cryogenic prototype and mass-manufacturable
              data center modules for utility-scale quantum computing (USQC) [CU002, CU009]. Similarly, in May 2025,
              Bluefors delivered 18 custom cooling systems to power AIST's G-QuAT Center in Japan, establishing
              multi-unit deployment capability within sovereign research testbeds [CU005]. Commercial momentum is
              further evidenced by customer collaborations with cat-qubit developer Alice & Bob in Paris and
              partnerships with cryogenic control and I/O specialists like Qblox and Delft Circuits [CU005, CU010].
              However, public quantitative disclosures from B2B customer case study aggregators frequently index vendor
              software profiles rather than primary dilution refrigerator hardware telemetry, leaving detailed customer
              utilization logs, production uptime rates, and exact repeat purchasing intervals confidential [CU011].
            claimRefs:
              - CU001
