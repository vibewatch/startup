        title: Operational Milestones, Financial Performance, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Financially, Bluefors reached €217 million in annual revenue in 2025, growing from €200 million reported
              in 2024, with export markets accounting for more than 90% of overall corporate receipts. Cumulative
              commercial deployments exceed 1,700 cryogenic measurement systems and more than 15,000 cryocoolers
              delivered to academic institutions, research facilities, and quantum computing hardware developers
              worldwide. Commercial momentum is reinforced by strategic ecosystem partnerships and institutional
              deployments, including the delivery of 18 quantum cooling systems to Japan's National Institute of
              Advanced Industrial Science and Technology (AIST) Global Research Center for Quantum-AI Fusion Technology
              (G-QuAT) and co-development of high-density quantum input/output cabling with Delft Circuits. However,
              diligence analysis highlights crucial strategic constraints: external sovereign defence assessments
              identify supply chain dependencies in critical cryogenic components, while wider market forecasts document
              an emerging quantum wiring crisis and helium supply availability challenges that require next-generation
              modular cryogenic integration.
