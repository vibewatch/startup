      - number: '4.2'
        title: Operating Cost Structure, Helium Economics, and Scale Drivers
        blocks:
          - type: paragraph
            body: >-
              The cost structure of Bluefors combines precision mechanical manufacturing, high-specification electrical
              assembly, and specialized scientific engineering across dual manufacturing hubs in Helsinki, Finland, and
              Syracuse, New York [CI009]. Headcount expansion has tracked commercial scaling, rising from approximately
              400 personnel prior to the Cryomech acquisition to close to 600 combined employees in 2023, 642 employees
              in 2024, and 650 employees by 2025 across facilities in Finland, the US, Germany, the Netherlands, and
              Japan [CI009, CI010]. Direct material costs are heavily exposed to global cryogenic commodity dynamics,
              most notably the supply and price volatility of Helium-3 and Helium-4 isotopes [CI011]. Dilution systems
              require substantial gas inventory to function; for instance, standard LD systems require a minimum of 18
              liters of He-3 (representing roughly 17% concentration), whereas larger XLD1000 systems demand at least 40
              liters of He-3 alongside 180 liters of He-4 [CI003]. This isotopic dependency exposes system
              bill-of-materials and customer commissioning budgets to helium procurement inflation, driving Bluefors to
              develop internal reliquefaction solutions and explore long-term lunar supply agreements to insulate
              operating margins from terrestrial resource constraints [CI006, CI011]. Technical sales and field
              engineering represent material operational expenditures, given that customer acquisition relies on
              specialized physicists and engineers engaging in consultative technical proposals rather than standard
              transactional sales motions [CI012].
            claimRefs:
              - CI003
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
