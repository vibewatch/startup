        title: Dependencies, financial opacity, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Bluefors disclosed EUR 217 million of 2025 revenue and 650 employees through investor DevCo, but the
              assigned sources provide no margin, cash-flow, working-capital, debt, backlog, customer-concentration, or
              supplier-concentration data. Funding raised or revenue must not be treated as cash availability, and no
              burn estimate is supportable here. The diligence plan should monitor four measurable triggers: export
              restrictions that delay material orders; repeated contamination or installation failures; service capacity
              failing to keep pace with the installed base; and a material demand or backlog contraction after product
              or acquisition expansion. Any unresolved legal restriction, recurring quality event, concentrated
              sole-source input, or deterioration in cash conversion should pause underwriting until quantified.
