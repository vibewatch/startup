        title: Exhibits
        blocks:
          - type: callout
            title: Established Industrial Revenue Scale and Global Export Moat
            body: >-
              Bluefors has achieved verified commercial scale unprecedented in the quantum cryogenic hardware sector,
              generating EUR 217 million in 2025 revenue with over 90% exported globally. Backed by DevCo's patient
              capital model and an installed base exceeding 1,500 systems, the company operates as the de facto hardware
              benchmark for dilution refrigeration.
            calloutType: strength
            claimRefs:
