            body: >-
              As quantum processors target 1,000+ qubits, demand for 3,000 to 5,000 individual cryogenic connections
              creates acute thermal and physical wiring challenges for customers. Furthermore, because commercial
              quantum hardware developers represent the primary growth driver for multi-unit modular platforms, Bluefors
              remains exposed to broader venture capital availability and enterprise spending cycles in the quantum
              sector.
            calloutType: risk
            claimRefs:
