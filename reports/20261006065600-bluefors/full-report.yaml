      - number: '8.2'
        title: Current Valuation Context, Multiples Analysis, and Underwriting Scenarios
        blocks:
          - type: paragraph
            body: >-
              Bluefors established a major financial benchmark in September 2026 by achieving unicorn status at an
              implied €1.0 billion valuation on €217 million in annual revenue, translating to an entry revenue multiple
              of approximately 4.6x trailing receipts [CV001, CV007, CV011]. Under majority ownership by Finnish
              active-ownership private equity sponsor DevCo Partners since 2021, the company has paired consistent
              top-line expansion—growing from €200M in 2024 to €217M in 2025—with operational scale exceeding 600
              specialized professionals across Finland, the United States, Germany, Japan, and the Netherlands [CV007,
              CV012, CV013]. Underwriting scenarios model distinct industry trajectories: the Base Case projects
              sustained 12% revenue growth and fair value around 4.5x–5.0x EV/revenue supported by ongoing lab
              expansions and modular cryogenic platform rollouts [CV001, CV005]; the Bull Case models 20% annual
              expansion and multiple rerating to 6.0x–7.0x driven by hyperscale quantum data center buildouts and solved
              high-density wiring interconnects [CV006, CV011]; while the Bear Case models revenue contraction to €185M
              and multiple compression to 2.5x–3.0x under an extended commercial quantum financing slowdown and
              worsening Helium-3 allocation limits [CV006, CV008, CV009].
            claimRefs:
