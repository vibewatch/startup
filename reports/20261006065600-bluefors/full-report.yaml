      - number: '1.2'
        title: Product Portfolio, Commercial Scale, and Global Operations
        blocks:
          - type: paragraph
            body: >-
              Bluefors commercializes cryogenic systems that achieve ultra-low operating temperatures below 10
              millikelvin, providing the necessary thermal environment for superconducting quantum circuits, quantum
              computing processors, and sensitive quantum sensor arrays. The company offers automated cryogen-free
              dilution refrigerators, pulse-tube cryocoolers, modular cryogenic infrastructure, and high-density
              experimental wiring spanning direct current, radio frequency, and fiber optic signal channels. Bluefors
              significantly broadened its manufacturing and technology footprint through its Syracuse, New York
              operations, commercializing pulse-tube cryocoolers and helium management solutions under the Cryomech
              brand. Operational scale is maintained across an international network comprising corporate headquarters,
              research, and production facilities in Helsinki, Finland and Syracuse, New York, regional sales and
              customer service offices in Munich, Tokyo, and Brooklyn, and specialized customer demonstration
              laboratories in Chicago and Delft. The global workforce expanded to over 700 employees across multiple
              continents by 2025.
