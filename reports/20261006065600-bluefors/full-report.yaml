              - CE008
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decoupling Cooling from Wiring Solves Quantum Scaling Bottlenecks
            body: >-
              By separating the physical cooling insert from side-loading measurement wiring in the Modular Cryogenic
              Platform, Bluefors removes the traditional one-time design constraint of dilution refrigerators, allowing
              data centers to incrementally scale qubit infrastructure.
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Helium-3 Isotopic Dependency and Field Maturation Horizon
            body: >-
              While Bluefors provides leading technical ergonomics, commercial systems remain structurally reliant on
              scarce Helium-3 isotope supplies. Additionally, multi-module platforms will not see production field
              validation until late 2026.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Strategic Value
        blocks:
          - type: paragraph
            body: >-
              The customer base of Bluefors divides into three primary institutional segments: commercial quantum
              computing enterprises, government and defense research laboratories, and academic physics departments
              [CU001, CU002]. Commercial quantum computing hardware developers—such as Xanadu, IBM, Google, and
              Rigetti—represent the highest strategic and revenue value segment, procuring multi-million-dollar capital
              hardware systems, modular cryogenic platforms, and dense experimental wiring harnesses for utility-scale
              quantum computing data centers [CU001, CU002, CU003]. In this enterprise segment, buyers are typically
              Vice Presidents of Hardware Engineering or Directors of Quantum Infrastructure whose purchasing decisions
              hinge on cooling capacity below 10 millikelvin, vacuum volume, uptime reliability, and multi-channel
              microwave I/O integration [CU002, CU003, CU004]. The second segment comprises state-backed national
              research institutions—such as Japan's National Institute of Advanced Industrial Science and Technology
              (AIST), which took delivery of 18 advanced quantum cooling systems for its Global Research and Development
              Center for Business by Quantum-AI Technology (G-QuAT) [CU005]. These institutional customers procure large
              fleets via competitive national tenders funded by strategic government technology initiatives [CU005]. The
              third segment consists of university physics and quantum information laboratories globally, where
              Principal Investigators (PIs) rely on Bluefors dilution refrigerators for fundamental condensed matter
              research and exploratory qubit characterization [CU001, CU006]. While academic accounts possess lower
              capital budgets per purchase than industrial hyperscalers, they provide an enduring, diversified baseline
              of orders, aftermarket service engagements, and long-term talent pipelines across global research hubs
              [CU001, CU007].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
