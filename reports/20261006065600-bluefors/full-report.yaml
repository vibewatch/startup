    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Ownership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Bluefors Oy is a specialized manufacturer of cryogenic refrigeration equipment, measurement systems, and
              modular infrastructure primarily serving quantum computing developers and low-temperature scientific
              researchers globally. The business traces its operational origins to 2008 in Helsinki, Finland,
              established as a commercial spin-off from pioneering low-temperature physics research conducted at the Low
              Temperature Laboratory of Helsinki University of Technology (now Aalto University). The enterprise
              transitioned from founder-led ownership in 2021 when Helsinki-based active-ownership private equity firm
              DevCo Partners completed an investment to accelerate international expansion and industrialization.
              Corporate governance is established around an independent board of directors chaired by Kimmo Alkio,
              featuring DevCo partner Lauri Stadigh as vice chair, DevCo investment professional Vanechka Patel,
              operational executive Juha Räisänen, alongside company co-founders Rob Blaauwgeers and Pieter Vorselman.
              Day-to-day corporate executive leadership is directed by Chief Executive Officer Kim Povlsen, who
              previously served as President and CEO of Universal Robots A/S and held multiple senior executive
              positions at Schneider Electric.
