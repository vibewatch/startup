evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, reserved matters, and current shareholder agreement.
    whyItMatters: >-
      Ownership and control are central to geopolitical and exit-risk underwriting, but public materials do not disclose
      modern governance detail.
    diligencePath: Request current cap table, board list, and shareholder rights matrix directly from management.
    relatedQuestionRefs:
      - QO007
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled round-by-round financing ledger covering 2019, 2024, 2025, and 2026 events.
    whyItMatters: >-
      CB Insights, Tracxn, and media coverage disagree on round count, dates, and whether the latest post-2024 event is
      2025 or 2026.
    diligencePath: Obtain signed financing announcements or legal closing documents and reconcile against database entries.
    relatedQuestionRefs:
      - QO017
      - QO018
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current audited employee count and location split.
    whyItMatters: Public employee signals vary and workforce scale matters for burn, operating leverage, and execution capacity.
    diligencePath: Request HR headcount by function and geography as of the latest quarter.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: Audited revenue, gross margin, customer count, and retention metrics.
    whyItMatters: The company is late-stage enough that investment decisions need more than device and service-call claims.
    diligencePath: >-
      Request management reporting pack with revenue segmentation, GM, major-customer mix, and recurring-service
      metrics.
    relatedQuestionRefs:
      - QO025
  - type: stale
    severity: minor
    topic: public-claims
    missingEvidence: Independent verification of device, station, and service-volume claims.
    whyItMatters: Scale figures are central to the bull case but most are company-sourced rather than independently audited.
    diligencePath: Cross-check large customer deployment contracts, network operations data, and third-party audits of service usage.
    relatedQuestionRefs:
      - QO009
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A full governance map showing board members, observer rights, and current control terms.
    whyItMatters: The leadership and founder table is intentionally partial and leaves important governance evidence unresolved.
    diligencePath: Request board roster, committee structure, and reserved matters schedule.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 investor chronology coverage
    missingEvidence: A reconciled round ledger with dates, amounts, investors, and post-money valuations.
    whyItMatters: The stakeholder or investor map preserves public conflicts and therefore remains incomplete by design.
    diligencePath: Request financing close documents and management cap-table history.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone coverage
    missingEvidence: >-
      A fuller dated chronology covering internal governance changes, financing close dates, and additional
      international milestones.
    whyItMatters: The milestone table is intentionally partial and should not be mistaken for a complete chronology of record.
    diligencePath: Request internal milestone chronology and financing close documents to extend the public timeline.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-by-vertical
    missingEvidence: >-
      Management view of addressable revenue by automotive, agriculture, survey/construction, and infrastructure
      verticals.
    whyItMatters: Third-party TAMs are broad and cannot substitute for Qianxun’s internal segment economics.
    diligencePath: Request internal pipeline and revenue bridge by vertical plus attach-rate assumptions.
    relatedQuestionRefs:
      - QM011
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pilot-conversion
    missingEvidence: Pilot-to-production conversion rates, average sales cycle, and renewal rates by segment.
    whyItMatters: Market growth only matters if deployments turn into durable billings.
    diligencePath: Request CRM funnel metrics and cohort renewals for each major vertical.
    relatedQuestionRefs:
      - QM009
      - QM023
      - QM025
  - type: conflicting-data
    severity: moderate
    topic: market-scope variance
    missingEvidence: A reconciled internal sizing memo that explains why management uses one market lens over others.
    whyItMatters: >-
      Published figures span from roughly $1.6B services to hundreds of billions in broad GNSS value, which can distort
      valuation narratives.
    diligencePath: Document chosen TAM/SAM methodology and exclude non-monetizable layers explicitly.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM004
      - QM022
  - type: private-evidence-only
    severity: moderate
    topic: international-coverage-unit-economics
    missingEvidence: >-
      Evidence showing what it costs Qianxun to support incremental countries without owning local infrastructure
      outright.
    whyItMatters: International expansion can look attractive in top-line claims but unattractive in local economics.
    diligencePath: Request country-level gross margin and partner model detail for overseas deployments.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: moderate
    topic: service-versus-hardware-mix
    missingEvidence: Current revenue split between correction services, devices, integration, and software.
    whyItMatters: >-
      Valuation quality depends heavily on whether the company is building a recurring service business or mainly
      selling hardware bundles.
    diligencePath: Request audited segment reporting or management-quality revenue by product family.
    relatedQuestionRefs:
      - QM011
      - QM025
  - type: private-evidence-only
    severity: material
    topic: win-rates
    missingEvidence: Competitive win/loss data by vertical and region.
    whyItMatters: Public positioning pages do not show where Qianxun actually beats Trimble, CHCNAV, u-blox, or HERE in live deals.
    diligencePath: Request CRM win/loss analysis and segment-level competitor attribution.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized contract pricing, discounting, and gross-margin comparison versus peers.
    whyItMatters: Public pricing opacity makes it hard to know whether Qianxun competes on performance or on price.
    diligencePath: Request sample contracts, price corridors, and margin by product family.
    relatedQuestionRefs:
      - QP010
      - QP011
      - QP021
  - type: private-evidence-only
    severity: moderate
    topic: switching-costs
    missingEvidence: Evidence on integration effort and replacement cost after deployment.
    whyItMatters: Moat durability depends on post-deployment stickiness rather than on website positioning.
    diligencePath: Interview customers and channel partners about migration burden.
    relatedQuestionRefs:
      - QP012
      - QP013
  - type: private-evidence-only
    severity: moderate
    topic: international-channel-control
    missingEvidence: Who owns customer relationships in overseas distributor or OEM channels.
    whyItMatters: Margin and renewal quality can diverge sharply if channel partners own the account.
    diligencePath: Map distributor contracts and renewal rights by region.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: conflicting-data
    severity: minor
    topic: technical-parity
    missingEvidence: Independent side-by-side performance benchmarks across key peers.
    whyItMatters: Public marketing surfaces classify peers well but do not prove comparative accuracy, uptime, or developer ease.
    diligencePath: Request benchmark results or run third-party field evaluations.
    relatedQuestionRefs:
      - QP021
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Revenue by stream and growth by stream.
    whyItMatters: >-
      Without stream segmentation, investors cannot tell whether value comes from recurring service or lower-quality
      hardware/project revenue.
    diligencePath: Request audited revenue bridge by product family and geography.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI022
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Gross margin by correction services, hardware, infrastructure, automotive, and agriculture.
    whyItMatters: Blended scale claims can mask unattractive unit economics.
    diligencePath: Request gross-margin waterfall and cost-to-serve assumptions by stream.
    relatedQuestionRefs:
      - QI014
      - QI022
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, and next-raise trigger.
    whyItMatters: A late-stage infrastructure company can still face funding risk even at a unicorn valuation.
    diligencePath: Request treasury snapshot and board-approved operating plan.
    relatedQuestionRefs:
      - QI019
      - QI023
  - type: private-evidence-only
    severity: moderate
    topic: channel-economics
