company:
  name: Qianxun Spatial Intelligence
chapter:
  number: 1
  title: Company Overview
  summary: Qianxun Spatial Intelligence is best-supported in public evidence as a Shanghai-founded 2015 Alibaba-Norinco joint
    venture that commercialized BeiDou-based high-precision positioning and timing services. The strongest current public
    facts point to a valuation above RMB 16 billion in August 2024, large-scale intelligent-driving deployments, and unusually
    broad infrastructure claims, but public round sizing, headcount, and governance transparency remain materially inconsistent
    across sources.
sections:
- id: identity-founding-and-positioning
  title: Identity, Founding, and Positioning
  body: |-
    Qianxun Spatial Intelligence presents itself as a global spatial-intelligence infrastructure company built around centimeter-level positioning, millimeter-level perception, and nanosecond-level timing. The strongest identity evidence clusters around August 2015: the official English site says the company was founded in August 2015, CB Insights and Tracxn also place founding in 2015, and Yicai specifies that Alibaba Group and China North Industries Group backed the company at formation. Public descriptions consistently place headquarters in Shanghai's Yangpu District and describe the service stack as built on BeiDou plus GPS, GLONASS, and Galileo. That means the cleanest framing is not “a generic mapping startup,” but a national-scale augmentation and location-cloud operator commercializing Chinese satellite-navigation infrastructure for enterprise and device ecosystems. Public materials also show the company has rebranded much of its overseas-facing activity under the SpatiX name while retaining the Qianxun SI corporate identity underneath. That distinction matters because many later English-language articles refer to SpatiX products first and the parent company second, which can obscure the continuity of the corporate story if diligence notes are not normalized. It also means some product and market claims sit on marketing surfaces instead of financial disclosures, so identity work in this chapter doubles as source-hygiene work for the rest of the report.
