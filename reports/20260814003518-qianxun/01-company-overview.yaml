  - What public evidence says
  - Why it matters
  - Key diligence ask
  enumerationScope:
    coverage: partial
    basis: Public materials identify the corporate parents, current CEO, and several investor names, but they do not disclose
      a full board roster or contemporary ownership table.
  rows:
  - - Chen Jinpei
    - CEO / external spokesperson
    - SpatiX blog and Kharon reference Chen Jinpei as CEO and as a spokesperson for the company strategy.
    - Leadership visibility is concentrated in one executive voice.
    - Request current management roster and board composition.
  - - Alibaba-linked interests
    - Original commercial co-founder and continuing influence
    - Official materials still describe Alibaba as largest shareholder; Kharon says Alibaba-linked executives still collectively
      own about 45%.
    - Cloud alignment and policy relevance can help distribution but heighten geopolitical scrutiny.
    - Verify current direct and indirect Alibaba holdings and governance rights.
  - - Norinco / China North Industries
    - Original strategic co-founder and continuing shareholder
    - Yicai says the company was founded by Norinco and Alibaba; Kharon says Norinco still holds 32%.
    - Military-industrial linkage is strategically valuable domestically but risky internationally.
    - Confirm current stake, board rights, and any dual-use program overlap.
  - - Latest disclosed financial investors
    - Strategic and local-government funds
    - 2024 coverage names Beijing Information Industry Development Investment Fund and other local-government-linked investors.
    - Public round composition suggests policy-backed capital, not only pure venture money.
    - Separate strategic, state, and financial investors by round and rights.
  - - Public governance gap
    - Board and independent governance not transparent
    - Reviewed public sources do not surface a current full board roster or independent-director structure.
    - Opaque governance constrains underwriting on control, conflicts, and exit preparedness.
    - Obtain board list, reserved matters, and shareholder agreement.
  notes: Enumeration is intentionally partial because public materials disclose enough to map control themes but not enough
    to rebuild the full cap table or governance structure.
