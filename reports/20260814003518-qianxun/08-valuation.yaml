- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and ARR
    - Current revenue, ARR, and segment mix
    - Valuation cannot be underwritten without a denominator
    - Management / CFO data room.
  - - Gross margin and cash use
    - Product-line margins, burn, and working-capital profile
    - Determines whether Qianxun deserves software-like or hardware-like multiples
    - Finance diligence workstream.
  - - Retention and concentration
    - NRR, churn, top-customer mix, renewal cadence
    - Durability matters more than deployment headlines
    - Commercial diligence and customer-reference calls.
  - - Cap table and preferences
    - Preferred stack, ratchets, board rights, and option pool
    - Headline valuation may not equal investor outcome value
    - Legal and finance diligence.
  - - Exit readiness and compliance
    - Audit readiness, IR capability, data/export compliance map
    - Drives timing and feasibility of public or strategic exits
    - Legal / audit / strategy workstream.
  notes: Each diligence ask corresponds to a missing denominator that could materially reprice the opportunity.
