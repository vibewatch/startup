- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Recurring corrections revenue scales across AV, drones, and infrastructure; governance questions narrow; margins prove
      software-like enough.
    - Supports upside toward the upper-$2B to mid-$3B band over time.
    - Execution breadth, geopolitics, and concentration still matter.
    - Requires strong private KPI proof and continued strategic wins.
  - - Base
    - Qianxun is a strategic platform with meaningful monetization, but economics are mixed and disclosure remains only partly
      improved.
    - Supports valuation anchored around the low-to-mid $2B range.
    - Opaque denominator and premium-compression risk.
    - Most consistent with retained public evidence today.
  - - Bear
    - Growth is real but revenue is lower than expected, hardware / project mix is heavy, and foreign upside is constrained.
    - Implies fair value can fall materially below the last public mark.
    - Geopolitical discount, lower gross margin, and concentration.
    - Becomes more likely if diligence does not close the denominator gap.
  notes: Scenario logic is based on strategic relevance plus comp framing, not on reported Qianxun revenue guidance.
