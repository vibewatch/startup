- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What public evidence says
  - What would change the view
  rows:
  - - Strategic positioning platform thesis
    - Official pages and financing coverage support a broad infrastructure and autonomy positioning narrative.
    - Upgrade if private revenue and margin quality are strong.
  - - Scarcity premium thesis
    - Few companies combine BeiDou-linked infrastructure roots, device reach, and autonomy exposure.
    - Upgrade if foreign and domestic enterprise customers show durable renewals.
  - - Commercialization thesis
    - Recent financing and product breadth suggest real operating momentum.
    - Upgrade if customer concentration and pricing quality are acceptable.
  - - 'Anti-thesis: opacity discount'
    - Revenue, retention, and cap-table details remain private.
    - Downgrade if management will not disclose core economics under NDA.
  - - 'Anti-thesis: geopolitical discount'
    - Alibaba / BeiDou links can constrain foreign procurement or exit paths.
    - Downgrade if key overseas markets block deployment on trust grounds.
  - - 'Anti-thesis: mixed-model margin risk'
    - Hardware and project exposure may weaken a software-like premium.
    - Downgrade if product-line gross margins are materially below strategic-platform expectations.
  notes: This table pairs the positive story with the exact evidence-sensitive factors that can reverse the call.
