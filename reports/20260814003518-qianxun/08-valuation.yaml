- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue denominator disappoints
    - Private revenue scale is materially below what a low-$2B mark implies
    - Scarcity narrative no longer offsets price risk
    - Move from pass to hold or fail.
  - - Margins are too hardware-heavy
    - Gross margin profile looks materially below strategic-platform expectation
    - Peer-set premium becomes hard to justify
    - Apply lower-multiple framework.
  - - Foreign expansion blocked
    - Priority overseas wins fail on trust or compliance screens
    - Bull-case optionality evaporates
    - Value the company primarily on domestic case.
  - - Customer concentration too high
    - A few OEM or infrastructure accounts dominate revenue
    - Durability and downside worsen
    - Demand pricing discount or concentration protections.
  - - Governance / preference overhang is heavy
    - Terms meaningfully subordinate new investors or common exit value
    - Headline valuation overstates actual economics
    - Reprice or walk.
  - - Audit / IPO readiness is weak
    - Company lacks systems for a transparent listing path
    - Exit timing stretches and liquidity discount grows
    - Lower expected return or extend hold horizon.
  notes: These are measurable kill criteria, not generic caution flags.
