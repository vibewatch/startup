chapter:
  number: 8
  title: Valuation
  summary: Qianxun merits a positive strategic view but only a price-sensitive valuation stance. The best-retained public
    anchor supports a roughly $2.2B valuation floor for serious consideration, while anything materially richer needs private
    proof on revenue, margins, retention, and governance that open sources do not provide.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and Price Discipline
  body: |-
    The public-evidence call on Qianxun is best described as pass, medium confidence, and medium-high risk—but only with price discipline. There is enough evidence to believe the company is strategically important: official materials show a broad positioning platform, recent news confirms continued financing momentum, and prior chapters establish meaningful relevance in automotive, infrastructure, devices, and adjacent autonomy workflows. That is stronger than a pre-revenue or purely aspirational deep-tech case. At the same time, public sources do not disclose the denominator that matters most for valuation. Revenue, gross margin, burn, retention, concentration, and preference overhang are still opaque. That makes the recommendation evidence-sensitive as much as business-quality sensitive.

    The cleanest retained public price anchor is the Yicai-reported valuation above RMB 16 billion, roughly $2.2 billion. A higher current mark may ultimately be correct, especially given user-provided context about later rounds, but it is not equally corroborated in the retained direct-source set. Investors therefore should not treat the upper end of the rumor range as self-proving. Instead, the right posture is: pass if entry is around or below the best-corroborated public mark and if private diligence closes the denominator gap; hold or fail if management expects investors to pay a substantially higher price without hard revenue-quality evidence. This is a classic case where company quality and valuation quality are not the same thing. Qianxun can be strategically valuable and still overpriced if the undisclosed economics do not support scarcity-premium assumptions.
