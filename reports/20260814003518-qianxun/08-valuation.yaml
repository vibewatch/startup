- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Trimble
    - ~$13.41B market cap / ~$3.68B TTM revenue
    - Mature industrial-positioning public comp; low-to-mid single-digit value-to-revenue context
    - Useful scale and transparency benchmark
    - Far larger and more diversified than Qianxun.
  - - Hexagon
    - ~EUR 5.4B sales in 2025
    - Upper-bound industrial measurement leader
    - Shows what scaled industrial measurement leadership looks like
    - Not a direct-stage or business-model match.
  - - TomTom
    - ~$0.60B market cap / ~$0.62B TTM revenue
    - Low-growth location-platform caution comp
    - Useful downside / caution benchmark for public maps-like pricing
    - Growth profile may be weaker than Qianxun’s.
  - - u-blox
    - ~$1.28B market cap / ~$0.29B 2024 revenue
    - GNSS-adjacent hardware and positioning comp
    - Useful for hardware / module valuation lens
    - Mix differs if Qianxun is more services-heavy.
  - - NextNav
    - ~$3.29B market cap / ~$4.02M TTM revenue
    - Strategic PNT optionality comp
    - Useful upside/scarcity benchmark
    - Can overstate what conventional revenue comps would support.
  - - Qianxun public anchor
    - ~$2.2B last well-corroborated mark
    - Private strategic-platform anchor
    - Most relevant current reference for entry discipline
    - Revenue denominator and preference stack undisclosed.
  notes: Comparable coverage is intentionally mixed because no single public peer captures Qianxun’s combination of infrastructure
    roots, product breadth, and opacity.
