  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-controls
    missingEvidence: SLA, uptime, incident history, redundancy design, and failover architecture.
    whyItMatters: Critical workflows need more than capability claims.
    diligencePath: Request architecture review, uptime history, and incident postmortems.
    relatedQuestionRefs:
    - QE021
    - QE024
    - QE025
  - type: private-evidence-only
    severity: material
    topic: security-and-privacy
    missingEvidence: Formal security, privacy, access-control, and incident-response documentation.
    whyItMatters: Cross-border and enterprise deployments increasingly depend on trust artifacts.
    diligencePath: Request security program overview, privacy controls, and audit/certification evidence.
    relatedQuestionRefs:
    - QE020
    - QE024
  - type: private-evidence-only
    severity: moderate
    topic: module-maturity
    missingEvidence: Paying customer counts, deployment depth, and support burden for each major module.
    whyItMatters: Breadth can hide immature sub-products.
    diligencePath: Request module-by-module maturity and revenue contribution.
