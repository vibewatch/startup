company:
  name: Qianxun Spatial Intelligence
chapter:
  number: 5
  title: Product & Technology
  summary: 'Qianxun’s product stack is best understood as a positioning infrastructure platform with multiple commercial surfaces:
    correction services, reference-station infrastructure, field hardware, automotive localization, and agriculture / construction
    / robotics solutions. The strongest public evidence supports breadth and deployment ambition, but architecture details,
    certification depth, and trust/safety controls remain only partially visible from public materials.'
sections:
- id: product-surface-and-module-map
  title: Product Surface and Module Map
  body: |-
    Qianxun’s public product surface spans far more than one correction feed. Official and SpatiX materials show at least five commercially distinct layers: correction services and positioning APIs, GNSS infrastructure and reference-station platforms, field hardware such as receivers and machine-control tools, automotive and robot positioning solutions, and precision-agriculture products such as QYX Pro. That breadth matters because it turns Qianxun from a pure data utility into a workflow-enabling platform. It also gives the company multiple ways to attach to the same customer, whether through infrastructure, devices, software, or vertical bundles. The product strategy appears to be horizontal physics plus vertical packaging: one positioning backbone is reused across agriculture, construction, rail, mapping, robotics, and intelligent driving, then expressed through different devices, bundles, and partner motions. The downside of that breadth is complexity. Every additional module implies more support, certification, distribution, and integration burden, and public sources do not fully disclose which modules are mature revenue drivers versus newer international expansion wedges. In practice this means product breadth is both an advantage and a diligence problem: the company can tell a larger platform story, but outside investors still need to separate flagship modules from experimental export motions and determine where support complexity could outrun product economics.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-workflow-and-dependencies
  title: Architecture, Workflow, and Dependencies
  body: |-
    The reviewed technical story points to a layered operating model. At the bottom sit GNSS constellations and BeiDou-centered signal inputs; above that sit augmentation stations, correction processing, and distribution networks; above that sit product modules such as RTK/PPP services, infrastructure tools, and field devices; and at the top sit vertical workflows such as survey, machine control, agriculture, rail, or robot localization. SpatiX materials repeatedly frame the company around centimeter-level positioning and the substitution of managed corrections for owned base stations, implying that cloud/network operations are core technical dependencies. Infrastructure products such as iStation18 and iStation Pro indicate that Qianxun is not only a service-layer provider but also a network-build and operating-platform provider. That architecture creates leverage, because improvements to coverage and reliability can benefit multiple verticals at once, but it also creates dependency risk around constellation quality, station density, communications links, and successful field integration. Public materials show strong workflow ambition, but they do not fully expose redundancy design, SLA detail, or failure-mode handling. Nor do they spell out support escalation paths or contractual performance commitments. For a product family that touches safety-sensitive and operations-critical workflows, that gap matters as much as feature breadth. A robust technical review should therefore test whether the same architecture can reliably span smartphones, vehicles, robots, agriculture, and construction without creating hidden integration fragility.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
