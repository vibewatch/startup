- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metrics
  - Impact
  - Exact diligence path
  rows:
  - - Revenue by stream
    - Without it, valuation cannot distinguish durable subscription value from hardware/project noise
    - Request monthly/quarterly revenue bridge by corrections, devices, automotive, agriculture, and infrastructure.
  - - Gross margin by stream
    - Need to know whether network and hardware economics scale attractively
    - Request GM waterfall and service-delivery cost by product line.
  - - Cash / burn / runway
    - Cannot judge capital adequacy or next-round pressure
    - Request latest cash balance, monthly burn, and 18-month plan.
  - - Customer concentration and contract length
    - Revenue quality depends on concentration and renewal risk
    - Request top-10 customer mix, average contract duration, and renewal schedule.
  - - Capex plan for station/network expansion
    - Infrastructure intensity may absorb more capital than software-like narratives imply
    - Request capex budget and network-expansion ROI by geography.
  - - Channel economics
    - Distributor-led growth may trade margin for reach
    - Request channel margin, rebates, and who owns renewals by region.
  notes: These are the minimum blockers to convert public traction into underwritable economics.
