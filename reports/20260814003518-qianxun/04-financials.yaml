- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Correction services / RTK / PPP
    - Subscription or service fee for precision corrections and coverage
    - Per device / endpoint / contract
    - Commercially active; public revenue not disclosed
    - Potentially high-quality recurring revenue
    - Request ARR, renewal, and gross margin by correction tier.
  - - GNSS infrastructure / reference-station platform
    - Network deployment, operation, or infrastructure contracts
    - Project / network / service contract
    - Public evidence shows large station footprint but not revenue
    - Likely mixed recurring and project economics
    - Request network monetization model and maintenance obligations.
  - - Field hardware and receivers
    - Sale of GNSS devices, kits, and related hardware
    - Per unit / channel order
    - Publicly marketed; revenue undisclosed
    - Lower-quality than subscription if one-off
    - Request hardware GM, inventory days, and channel rebates.
  - - Automotive / intelligent-driving solutions
    - Design-in, solution, or platform contract tied to vehicle programs
    - Program / OEM contract
    - Commercial traction claimed; revenue undisclosed
    - Potentially sticky if production-linked
    - Request number of paying programs and billed revenue per program.
  - - Precision agriculture solutions
    - Autopilot/task-control bundles and related services
    - Kit / seasonal / dealer / service contract
    - Commercially marketed; pricing not public
    - Could mix hardware, software, and channel economics
    - Request dealer economics, attach rates, and seasonal renewal behavior.
  notes: Public sources support stream existence but not stream-level revenue disclosure.
