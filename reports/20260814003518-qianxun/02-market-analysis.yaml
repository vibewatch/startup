- id: sizing-lenses-and-scope
  title: Sizing Lenses and Scope Discipline
  body: |-
    Public market data supports a favorable but non-uniform sizing picture. EUSPA’s 2026 downstream market work projects GNSS market expansion to €580 billion by 2034, which is useful as a top-down ceiling for application-layer value creation rather than as a direct revenue pool for Qianxun. Fortune Business Insights places the broader GNSS market at $335.0 billion in 2025 and $844.6 billion by 2034, while The Business Research Company sizes satellite-based GNSS augmentation at $13.29 billion in 2025 and $20.43 billion by 2030. Growth Market Reports adds two narrower lenses: a $5.82 billion 2024 GNSS augmentation market and a $7.5 billion 2024 high-precision GNSS market, both growing toward low-double-digit billions by 2033. Bosson/MarketResearch’s positioning-services report is narrower still at roughly $1.645 billion in 2025, capturing the services layer more directly relevant to subscription correction. These lenses bracket the opportunity from broad downstream value to narrowly monetized precision services. For diligence, the central task is not picking a single heroic TAM, but proving which layer Qianxun can monetize repeatedly: correction subscriptions, bundled devices, automotive modules, precision-agriculture kits, or broader autonomy infrastructure.
  claimRefs:
