chapter:
  number: 2
  title: Market Analysis
  summary: Qianxun’s real market is not the entire GNSS economy but the narrower high-precision positioning, correction-service,
    and autonomy-enablement layer that sits above basic satellite navigation chips. Multiple third-party sizing lenses still
    support a large and growing opportunity, but the biggest commercial variable is how much enterprise spend migrates from
    owned base-station workflows and low-accuracy navigation into subscription correction, integrated hardware, and vertical
    software bundles.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Substitutes
  body: |-
    Qianxun should be analyzed against the high-precision positioning stack rather than the entire satellite-navigation economy. EUSPA’s 2026 market framing shows GNSS value creation moving downstream into applications and services, while Qianxun’s own English surfaces emphasize correction services, reference-station infrastructure, and industry solutions for intelligent driving, agriculture, robots, drones, and surveying. That means the included spend is enterprise and OEM money paid for centimeter-grade positioning, correction subscriptions, reference networks, field hardware, and software workflows that depend on dependable PNT performance. Excluded spend is the broad mass-market GNSS chip and handset universe unless it converts into paid precision services or differentiated device features. Status-quo substitutes are self-built base stations, lower-cost survey workflows, lower-accuracy consumer GNSS, inertial-only localization in constrained environments, and incumbent geospatial vendors bundled into equipment purchases. The practical implication is that Qianxun’s market is narrower than headline “GNSS market” totals, but it is also higher value because buyers pay for accuracy, uptime, and workflow outcomes rather than raw signal access alone. The strongest market thesis is therefore not “all navigation is addressable,” but “specific verticals increasingly require correction-grade positioning to automate physical workflows.”
  claimRefs:
  - CM001
  - CM002
  - CM003
