tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Correction services / RTK / PPP subscriptions
    - Recurring fees for network corrections, uptime, support, and APIs
    - Commodity handset navigation and free coarse-location apps
    - OEM platform teams, survey managers, distributors, fleet operators
    - Core monetization layer most directly relevant to Qianxun.
  - - Reference-station and CORS infrastructure
    - Reference stations, network deployment, management software, and maintenance
    - Generic telecom towers or unrelated sensor networks
    - Government geospatial operators, private network builders, channel partners
    - Important where Qianxun sells network infrastructure or partners on rollout.
  - - High-precision field hardware
    - Receivers, antennas, machine-control systems, ag kits, surveying terminals
    - Mass-market consumer devices without paid precision features
    - Dealers, contractors, survey firms, farms, OEMs
    - Useful wedge but typically lower-quality revenue than pure subscription services.
  - - Automotive / robot localization stack
    - Integrated positioning modules, correction feeds, and validation tooling
    - General infotainment navigation or mapping alone
    - Automotive ADAS teams, robotics product leads
    - Strategic growth segment because design-ins can scale with production programs.
  - - Spatial workflow software
    - Task control, data visualization, mapping, and operational tools tied to precision workflows
    - Standalone GIS not dependent on precise correction inputs
    - Project managers, precision-ag operators, asset owners
    - Raises stickiness when bundled with hardware and service contracts.
  notes: Boundary focuses on monetizable precision-positioning layers instead of the entire satellite-navigation semiconductor
    economy.
