- id: buyers-payers-and-adoption-path
  title: Buyers, Payers, and Adoption Path
  body: |-
    The buyer map is fragmented by workflow rather than geography alone. In automotive and robotics, the technical user is the autonomy or sensor-fusion team, but the budget owner usually sits with an OEM platform, ADAS, or program-management function that must justify safety and production-readiness. In agriculture, the user may be the farmer or machine operator, yet the payer often becomes an equipment dealer, distributor, or OEM bundle owner when autopilot and task-control capability are embedded with hardware. Surveying, construction, and machine-control purchases are more operational: survey managers, project leads, and equipment owners pay for faster layout, reduced rework, and fewer base stations in the field. Public SpatiX materials reinforce this segmentation by marketing separately to RTK survey, smart agriculture, railway safety, solar construction, and autonomous robots. The adoption path is usually the same despite different vertical language: hardware or SDK evaluation, field accuracy validation, communications and correction-network integration, workflow fit, and then subscription or fleet rollout. That stepwise motion creates a useful wedge for Qianxun because once accuracy, coverage, and workflow tooling are validated, the customer becomes less eager to switch on price alone.
