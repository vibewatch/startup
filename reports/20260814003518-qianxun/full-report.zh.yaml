      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入分母不及预期
        - 私有收入规模明显低于 $2B 低段估值所隐含水平
        - 稀缺性叙事不再抵消价格风险
        - 从放行转为暂缓或否决。
      - - 毛利率过于硬件化
        - 毛利率明显低于战略平台应有预期
        - 同业溢价难以自圆其说
        - 改用更低倍数框架。
      - - 海外扩张受阻
        - 重点海外项目在信任或合规筛查中未通过
        - 乐观情景的期权价值消失
        - 主要按国内情景给公司估值。
      - - 客户集中度过高
