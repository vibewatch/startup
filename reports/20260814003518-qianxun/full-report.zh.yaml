  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Qianxun 的公开页面支持的是混合收入模式，而不是纯 SaaS 或纯硬件身份。公司及其 SpatiX 品牌营销校正服务、GNSS 基础设施、RTK 和测绘硬件、智能驾驶解决方案，以及 QYX Pro
              等精准农业产品。这至少意味着四条变现渠道：经常性校正或平台服务费、硬件 /
              设备销售、与基础设施建设相关的项目或部署收入，以及打包进垂直工作流的解决方案级收入。这也意味着会计复杂度，因为合同是订阅式、设备主导、渠道中介还是里程碑式，都会影响收入确认模式。公开牵引力信号远强于公开收入信号，由此形成典型后期尽调陷阱：漂亮的规模观感可以与未解决的变现质量并存。Yicai、Gasgoo
              和官方材料指向数十亿台设备服务、每日 10B+ 次服务、到 2025 年末 1T
              次月服务调用，以及显著的智能驾驶部署数量。这些指标重要，因为它们暗示商业相关性和网络利用率，但它们没有披露实际收入、续约质量或毛利。干净结论是，Qianxun
              拥有有意义的收入机会面，但公开证据尚未把经常性订阅经济性，与一次性硬件或项目收入区分开。
