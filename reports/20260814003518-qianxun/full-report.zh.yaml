  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              最高风险簇是监管和地缘政治，而不是纯产品问题。Qianxun 的公开故事与 Alibaba、BeiDou
              生态，以及中国战略基础设施目标绑定。这些联系在国内是优势：它们有助于解释公司为什么能在汽车、基础设施和定位密集型工作流中早早获得相关性。但同样的联系可能在海外市场触发强化尽调，尤其是买方触及电信、关键基础设施、国防相邻物流或敏感地理空间数据时。即使
              Qianxun 本身没有被明确点名，美国政策方向也重要，因为 FCC 2025–2026 年动作显示，限制正从具名厂商扩展到调查、认证实验室，以及外国生产 UAS、电力逆变器和先进机器人设备等类别。Qianxun
              的商业叙事与无人机、机器人和基础设施交叉，因此这些变化相关。


              中国法律语境又叠加第二层。数据安全法和国家情报法本身不能证明滥用，但它们强化了海外顾虑：数据处理和跨境地理空间运营不会只按商业维度评估。对海外客户，尤其是公共部门或基础设施运营方而言，这会转化为围绕数据托管、执法访问、本地化和合同控制的尽调。投资者因此应把法律和地缘政治风险视为市场拓展约束，而不只是头条声誉问题。正确承销姿态是，国内战略对齐在中国是护城河；在中国之外，它是折价因素，除非管理层能提供强有力的治理和合规证据。
