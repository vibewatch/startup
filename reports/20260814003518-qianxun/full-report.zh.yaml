  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与模块地图
        blocks:
          - type: paragraph
            body: >-
              Qianxun 的公开产品表面远不止一条校正数据流。官方和 SpatiX 材料显示，至少有五个商业上不同的层次：校正服务和定位 API、GNSS
              基础设施和参考站平台、接收机和机器控制工具等现场硬件、汽车和机器人定位解决方案，以及 QYX Pro 等精准农业产品。这个广度很重要，因为它把 Qianxun
              从纯数据公用事业，变成一个赋能工作流的平台。它也给公司提供了多种方式连接同一客户，无论通过基础设施、设备、软件，还是垂直捆绑。产品策略看起来是「横向物理层 +
              垂直包装」：同一套定位骨干在农业、建筑、铁路、地图、机器人和智能驾驶之间复用，再通过不同设备、组合和伙伴动作表达出来。广度的代价是复杂度。每增加一个模块，都意味着更多支持、认证、分销和集成负担；公开来源并未充分披露哪些模块已经是成熟收入驱动，哪些只是较新的国际扩张切口。落到实践中，产品广度既是优势，也是尽调问题：公司可以讲更大的平台故事，但外部投资者仍要把旗舰模块与试验性出口动作分开，并判断支持复杂度会在哪里跑赢产品经济性。
