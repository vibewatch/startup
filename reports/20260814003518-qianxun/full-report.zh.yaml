      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图不是单纯按地域切分，而是按工作流碎片化。在汽车和机器人领域，技术用户是自动驾驶或传感器融合团队，但预算所有者通常在 OEM 平台、ADAS
              或项目管理职能中，必须证明安全性和量产准备度。农业场景里，用户可能是农民或农机操作员；当自动驾驶和任务控制能力嵌入硬件后，付款方往往变成设备经销商、分销商或 OEM
              捆绑负责人。测绘、建筑和机器控制采购更偏运营：测绘经理、项目负责人和设备所有者为更快放样、更少返工和现场更少基站付费。公开 SpatiX 材料也通过分别面向 RTK
              测绘、智慧农业、铁路安全、光伏建设和自主机器人营销，强化了这种分层。不同垂直行业语言不同，但采用路径通常相同：硬件或 SDK
              评估、现场精度验证、通信和校正网络集成、工作流适配，然后才是订阅或车队级推出。这个分步动作给 Qianxun 留下了有用切口，因为一旦精度、覆盖和工作流工具通过验证，客户就不太愿意只因为价格而切换。
