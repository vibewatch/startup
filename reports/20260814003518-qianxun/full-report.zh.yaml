  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 公开证据说明什么
      - 什么会改变判断
    rows:
      - - 战略定位平台论点
        - 官方页面和融资报道支撑广义基础设施与自主系统定位叙事。
        - 若私有收入和利润率质量强，则上调判断。
      - - 稀缺性溢价论点
        - 很少有公司同时具备 BeiDou 相关基础设施根基、设备触达和自主系统敞口。
        - 若海外和国内企业客户展现持久续约，则上调判断。
      - - 商业化论点
        - 近期融资和产品广度显示真实经营动能。
        - 若客户集中度和定价质量可接受，则上调判断。
      - - 反论点：不透明折价
        - 收入、留存和股权结构细节仍未公开。
        - 若管理层不愿在 NDA 下披露核心经济性，则下调判断。
      - - 反论点：地缘政治折价
        - Alibaba / BeiDou 关联可能约束外国采购或退出路径。
        - 若关键海外市场因信任理由阻止部署，则下调判断。
      - - 反论点：混合模式利润率风险
        - 硬件和项目敞口可能削弱类软件溢价。
        - 若产品线毛利率显著低于战略平台预期，则下调判断。
    notes: 这张表把正面叙事与能逆转判断的证据敏感因素一一配对。
