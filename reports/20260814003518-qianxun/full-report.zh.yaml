  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Qianxun 面对的不是一个干净的同业集合。直接高精度定位类别包括 CHCNAV、ComNav Technology、Topcon、Trimble、u-blox 和 Point One
              Navigation，它们都在营销高精度 GNSS 或自动化定位能力。第二类是更大的地理空间和工业既有厂商，例如 Hexagon；其 Autonomy & Positioning
              部门远不止独立接收机，还延伸到企业工作流、安全和工业系统。第三类包括 HERE 和 TomTom 等更广的位置和地图平台，它们未必销售同一套校正栈，但仍会争夺 OEM
              心智、车辆项目、车队部署和开发者预算。NextNav 和 KINEXON 是有用的相邻参照，而不是完全匹配的产品对手：NextNav 强调韧性 PNT 和地理定位，KINEXON 则说明，部分买方需求可以通过经典
              GNSS 校正之外的实时位置系统满足。关键尽调点是，Qianxun 必须在不同垂直行业赢下不同比较：对 CHCNAV 或 Topcon 是测绘级精度，对 Point One 或 Trimble 是自动化准备度，对
              HERE、Hexagon 或 TomTom 是信任或集成广度。没有一个单一竞争者能解释整个格局，因此按细分市场做竞争地图，比一页总结性 logo 图更重要。
