      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Trimble
        - ~$13.41B 市值 / ~$3.68B TTM 收入
        - 成熟工业定位上市可比公司；提供低至中个位数价值 / 收入倍数参照
        - 有助于校准规模和透明度
        - 规模远大于 Qianxun，业务也更分散。
      - - Hexagon
