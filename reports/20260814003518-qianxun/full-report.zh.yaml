      - number: '1.3'
        title: 资本、所有权与治理
        blocks:
          - type: paragraph
            body: >-
              资本和所有权是公开记录最矛盾的地方，也因此对后续尽调最重要。Yicai 和 Gasgoo 均称，Qianxun 在 2024 年 8 月完成一轮战略融资，把估值推至 RMB 160 亿以上；CB Insights
              则把其支撑最充分的 2024 年 8 月标记折算为约 US$22.4 亿。Tracxn 给出的当前估值锚点更低，约 US$14.8 亿，同时显示 2019 年 Series A 融资 $1.41 亿，以及
              2026 年 2 月一轮未披露金额的 Series B。CB Insights 报告公司四轮累计融资 $1.4123 亿，最新可见投后估值标记同样在 2024 年 8 月。Kharon
              的公司记录分析补上一层关键治理信息：Qianxun 由 Alibaba 与 Norinco 作为合资公司设立，Norinco 据称仍持有 32%，即使 Alibaba 旗下创投载体重组了原始股权，Alibaba
              相关高管仍合计持有约 45%。这些事实同时带来战略优势——政策通道、云兼容性、产业相关性——也带来真实尽调风险，包括国家关联、跨境销售摩擦和有限的公开治理披露。做投资判断时，所有权故事不能只概括为「Alibaba
              支持」；更准确的理解是，一家商业野心很强、但战略牵连也很深的基础设施公司，其退出路径、海外市场准入和披露标准都可能不同于常规后期企业软件交易。
