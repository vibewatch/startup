      - number: '6.3'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              留存的公开证据远薄于部署证据。已审阅来源没有披露 NRR、GRR、流失、合同期限或 cohort
              数据。最好的公开代理指标是产品路线图活动的连续性、反复出现的现场验证文章、农业和测绘中增长的伙伴语言，以及若干客户类别看起来需要持续校正、基础设施支持或软件更新，而不是纯一次性硬件销售。这些指标暗示
              Qianxun
              可以在部署后形成扩张循环，尤其是客户依赖稳定校正或基础设施正常运行时间的场景。即便如此，报告不应过度主张：许多最强可见验证是公司自写案例，一些最宽的设备和服务数量主张也没有识别付费账户。集中度风险同样未解决。汽车看起来足够重要，少数大型
              OEM
              或项目关系可能主导收入；而渠道重的农业或海外扩张，可能把客户所有权留在合作伙伴手中。正确尽调姿态是：客户验证强于客户经济性验证；在获得合同、续约和组合数据之前，投资者不能称客户基础耐久。在此之前，应把公司视为商业上已被验证，但客户质量尚未公开透明。公开尽调还应按细分市场测试服务级支持负担。
