      - number: '3.3'
        title: 切换成本、护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Qianxun 最好的竞争故事是栈集成：校正服务、站点基础设施、垂直硬件和工作流解决方案，部署之后可以形成切换成本。但护城河耐久性在不同细分市场并不均匀。农业和建筑领域中，既有厂商可以把 GNSS
              打包进更广的设备生态。汽车和机器人领域里，赢家更可能是最早证明可靠性、开发者集成和量产准备度的供应商；因此即使初始定价不那么可见，Point One、u-blox 和 Trimble
              仍然相关。地图和位置平台中，HERE 和 TomTom 可能保持粘性，因为开发者和 OEM 已经依赖它们的软件资产。跨境信任姿态是另一个竞争维度：西方既有厂商在受监管或安全敏感采购中可能更容易推进，而
              Qianxun 在以 BeiDou 为中心的中国生态内可能拥有更强位置。主要反命题是商品化。如果高精度校正变成硬件供应商、云合作伙伴或地图平台嵌入的功能，除非 Qianxun
              证明更好的可靠性、本地基础设施密度，以及原始精度之外真正重要的垂直解决方案，否则差异化可能被压缩。另一个实际护城河测试是销售所有权：如果 Qianxun
              依赖合作伙伴获得国际渠道，这些合作伙伴在采购团队优先考虑文档深度、认证熟悉度或长期供应商历史时，也可以把需求导向知名度更高的既有厂商。因此，竞争尽调应少看抽象定位口号，多看细分市场胜率、部署后续约行为，以及公司能否在首次部署之后守住定价权。
