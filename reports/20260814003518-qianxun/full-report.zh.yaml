      - number: '2.2'
        title: 规模测算视角与范围纪律
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持一个有利但并不均匀的规模图景。EUSPA 的 2026 年下游市场研究预计 GNSS 市场到 2034 年扩张至 €5800 亿；这适合作为应用层价值创造的自上而下上限，而不是 Qianxun
              可直接拿到的收入池。Fortune Business Insights 把更广义 GNSS 市场规模放在 2025 年 $3350 亿、2034 年 $8446 亿；The Business Research
              Company 则估算卫星 GNSS 增强市场为 2025 年 $132.9 亿、2030 年 $204.3 亿。Growth Market Reports 又提供两个更窄视角：2024 年 GNSS 增强市场
              $58.2 亿，以及 2024 年高精度 GNSS 市场 $75 亿，两者到 2033 年都朝低双位数十亿美元增长。Bosson/MarketResearch 的定位服务报告更窄，2025 年约 $16.45
              亿，更直接覆盖与订阅校正相关的服务层。这些视角把机会从广义下游价值，到窄口径货币化高精度服务之间框住。尽调的核心任务不是挑一个激进 TAM，而是证明 Qianxun
              能反复变现哪一层：校正订阅、捆绑设备、汽车模块、精准农业套件，还是更广的自动化基础设施。
