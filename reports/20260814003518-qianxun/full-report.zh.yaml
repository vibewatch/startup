  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              分析 Qianxun 时，应把参照系放在高精度定位栈，而不是整个卫星导航经济。EUSPA 的 2026 年市场框架显示，GNSS 价值创造正向应用和服务下游迁移；Qianxun
              自己的英文页面也强调校正服务、参考站基础设施，以及面向智能驾驶、农业、机器人、无人机和测绘的行业解决方案。因此，纳入支出应是企业和 OEM 为厘米级定位、校正订阅、参考网络、现场硬件，以及依赖可靠 PNT
              性能的软件工作流支付的钱。广义大众 GNSS 芯片和手机市场不应纳入，除非它转化为付费高精度服务或差异化设备功能。现状替代品包括自建基站、成本更低的测绘流程、精度较低的消费级
              GNSS、受限环境中的纯惯性定位，以及随设备采购打包进来的既有地理空间厂商。实际含义是，Qianxun 的市场比头部「GNSS
              市场」总量更窄，但价值更高，因为买方支付的是精度、正常运行时间和工作流结果，而不只是原始信号接入。最强的市场论点不是「所有导航都可服务」，而是「特定垂直行业越来越需要校正级定位来自动化物理工作流」。
