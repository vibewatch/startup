      - number: '6.2'
        title: 具名客户验证与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              最强的具名验证集中在汽车，以及部分项目式部署。Gasgoo 报道称，Qianxun 的 FindAUTO 方案已部署在 30 多款车型上，并拿到来自 SAIC Motor、Geely、XPENG、Li
              Auto、IM Motors、Leapmotor、Hongqi 和 GAC AION 等具名品牌的 100 多个车型量产项目。官方历史页面也指向与 Huawei、Honor、Xiaomi、OPPO 和 VIVO
              等手机 OEM 的关系，说明 Qianxun 能嵌入汽车之外的设备生态。出行之外，SpatiX 文章提供了多垂直行业的客户验证式证据：光伏建设中的 Mahadev Engineerings、新疆
              Hotan-Ruoqiang Railway 建设、Golden Mount Bangkok 遗产点扫描、QYX Pro 农业演示和渠道发展，以及 Altay
              寒冷环境机器人或人形机器人演示。这些验证异质性很强——有些明显连接量产，有些是试点、案例研究或渠道建设时刻——但合在一起支持一个结论：Qianxun
              确实具备跨垂直行业部署动能。它们尚未说明的是，这种动能有多少绑定在大额经常性合同上，而不是一次性项目收入或营销色彩较重的展示性部署。这个区别尤其重要，因为同一组公开验证同时混合了车队规模汽车项目、单个项目证言和渠道建设展会叙事。
