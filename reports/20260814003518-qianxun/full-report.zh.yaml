companyProfile:
  summary: >-
    Qianxun Spatial Intelligence 是一家总部位于上海的后期私有空间智能公司，建立在 BeiDou 时代高精度定位基础设施商业化之上。公开证据支持其产品栈覆盖很广：校正服务、GNSS
    基础设施，以及面向汽车、基础设施、测绘、农业、机器人和设备生态的现场设备。公司的战略吸引力来自平台广度、与 Alibaba
    相关的创立背景，以及它与自动化和智能基础设施需求的关联；但收入质量、治理条款和海外市场牵引力的公开披露仍然有限。
