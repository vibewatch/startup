      - number: '7.2'
        title: 运营、技术与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Qianxun 的运营模型也暴露在一整套真实依赖之下。高精度定位质量依赖 GNSS
              信号完整性、站网密度、通信可靠性、集成商执行和现场支持。不同于简单的企业工作流应用，故障可以传导到安全、自动化、测绘精度或机器停机。NDTA 和 FPRI
              材料提醒我们，导航业务会继承争议频谱和卫星环境的上游脆弱性；对无人机、机器人或高可靠移动市场来说，干扰和欺骗不是理论边缘情形。公开材料暗示，Qianxun
              通过多星座设计和广泛校正网络覆盖缓解部分风险，但在已审阅英文语料中，公司没有公开披露详细正常运行时间、事故或 SLA 指标。


              依赖地图不止物理层。Qianxun 依赖
              OEM、分销商和伙伴渠道触达多个终端市场。这有助于扩张，但也意味着账户所有权、支持负担和续约控制可能部分落在公司之外。汽车验证可能集中在少数高价值项目中，海外品牌扩张和伙伴招募又引入另一层运营复杂度。投资者应把
              Qianxun 按基础设施平台承销：故障会快速进入客户运营，也会进入公司声誉。正确尽调问题因此应围绕正常运行时间、事故响应、出口准备度和伙伴治理机制，而不只是产品精度主张。
