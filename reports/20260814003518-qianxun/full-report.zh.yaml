      - number: '8.2'
        title: 可比框架与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比公司集合说明，Qianxun 应放在三个差异很大的公开参照类别之间。第一类是 Trimble 和 Hexagon 等成熟工业定位领导者，它们展示了测量、软件和工业工作流采用已经完全货币化时的规模样子。它们比
              Qianxun 大得多，也透明得多，因此更适合作为天花板参照，而不是直接同业倍数。第二类是
              TomTom，它给出谨慎案例：没有强增长或稀缺性溢价的位置和地图业务，交易估值可能大致落在收入规模水平，远低于私有独角兽头条所暗示的慷慨程度。第三类是
              NextNav，它代表另一个极端：即使常规收入规模尚未出现，市场也可能给战略 PNT 可选性赋予很高价值。u-blox 介于两者之间，同时说明 GNSS 相邻硬件敞口的价值和周期性。


              这些可比样本意味着，Qianxun 的公允区间压倒性取决于隐藏的分母质量。如果 Qianxun
              更接近低增长位置业务或硬件重模式，数十亿美元估值会显得昂贵。如果它更接近拥有强经常性校正收入、有意义切换成本和中国规模部署杠杆的战略基础设施平台，那么低到中段 $2B
              估值就更容易被证明合理。这就是为什么情景表使用牛、基准和熊的区间，而不是假装精确。基准情景假设 Qianxun 比 TomTom 更具战略性、比 NextNav 更已货币化，但仍不如 Trimble 或
              Hexagon 经验证且透明。牛市情景假设其具备经常性平台经济性，并能强力商业化 AV、无人机和基础设施需求。熊市情景假设地缘政治折价、集中度以及硬件 / 项目组合压制倍数。
