      - number: '3.2'
        title: 能力、定价与渠道比较
        blocks:
          - type: paragraph
            body: >-
              能力广度偏向既有厂商，而在特定用例中，专业化可能偏向 Qianxun。Trimble、Hexagon、Topcon 和 CHCNAV
              都展示了覆盖硬件、软件和现场工作流的宽产品组合，让它们在测绘、建筑和农业中天然拥有渠道杠杆。HERE 和 TomTom
              拥有强大的汽车和企业位置品牌，但它们从地图和平台角度竞争，而不是纯厘米级校正基础设施。u-blox 和 Point One 说明，模块化、适合 OEM
              的高精度定位产品很重要，尤其是在机器人和自动化项目中。整个品类的公开定价透明度很差：多数厂商隐藏企业定价、通过分销商销售，或把定位能力打包进更大的系统合同，增加谈判不透明度，也让外部更难给实际经济性做基准。定价可见度弱本身就是一个竞争事实，因为它让既有厂商可以战略性打折，并捆绑相邻软件、硬件和支持。对
              Qianxun 来说，实际渠道问题是，公司能否靠直接基础设施能力赢单，还是全球扩张必须依赖分销商、OEM 和系统集成商合作；后者会稀释利润率，但扩大触达。
