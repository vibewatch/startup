      - number: '4.2'
        title: 成本结构、单位经济与资本强度
        blocks:
          - type: paragraph
            body: >-
              成本结构比收入更容易推断，但仍难以验证。任何运营大型校正网络和增强基础设施的公司，都应承担可观的网络、支持、部署和持续维护成本；Qianxun
              自身及媒体报道的站点数量也指向真实资本强度。硬件产品线还带来库存、渠道、认证和支持负担，毛利率很可能低于软件化校正服务。u-blox、TomTom、Trimble 和 NextNav
              等相邻上市公司的申报文件只能作为方向性可比样本：它们显示定位业务可以把模块、软件、地图和服务组合起来，但利润率结构会随组合急剧变化。公开证据也提示，企业 / OEM
              销售周期很重要。汽车、基础设施和测绘部署在收入放量前，可能需要集成、验证和渠道协同。缺失的仍是真正的单位经济桥梁：CAC、回本周期、按收入流划分的毛利率、每个活跃端点的服务交付成本，以及经常性和非经常性收入的拆分。公开披露也没有给出回款质量和营运资本纪律。没有这些输入，正确的财务姿态是把公开规模主张视为需求证明，而不是有吸引力经济性的证明。
