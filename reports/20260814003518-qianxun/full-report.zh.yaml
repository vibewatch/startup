        - 收入韧性和下行保护变差
        - 要求价格折扣或集中度保护条款。
      - - 治理 / 优先权包袱沉重
        - 条款显著压低新投资者或普通股退出价值
        - 名义估值夸大真实经济收益
        - 重新定价或退出。
      - - 审计 / IPO 准备不足
