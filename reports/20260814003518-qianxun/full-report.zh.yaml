        - 所处阶段和商业模式都不直接匹配。
      - - TomTom
        - ~$0.60B 市值 / ~$0.62B TTM 收入
        - 低增长位置平台的警示性可比公司
        - 可作为公开地图类定价的下行 / 警示基准
        - 增长曲线可能弱于 Qianxun。
      - - u-blox
        - ~$1.28B 市值 / 2024 年收入 ~$0.29B
        - GNSS 邻近硬件与定位可比公司
        - 有助于用硬件 / 模组视角估值
        - 如果 Qianxun 服务占比更高，业务结构并不相同。
      - - NextNav
        - ~$3.29B 市值 / ~$4.02M TTM 收入
        - 战略 PNT 期权性可比公司
        - 可作为上行 / 稀缺性基准
        - 可能高估常规收入可比法能支撑的估值。
      - - Qianxun 公开锚点
        - 上一次证据较充分的估值约 $2.2B
        - 私有战略平台锚点
        - 最适合当前约束入场价格
        - 收入分母和优先权结构未披露。
    notes: 可比公司刻意混合选取，因为没有单一公开同业能同时覆盖 Qianxun 的 基础设施根基、产品宽度和信息不透明。
