      - number: '7.3'
        title: 财务模型、披露与执行风险
        blocks:
          - type: paragraph
            body: >-
              第三个风险簇是模型和执行风险。公开来源显示，Qianxun
              有有意义的融资支持和强战略野心，但没有披露把这种野心转化为清晰下行数学所需的收入、利润率、烧钱、海外销售组合或续约画像。融资数据库对精确融资额和估值时间线存在分歧，说明价格发现比独角兽标签更嘈杂。这一点重要，因为业务看起来混合了经常性校正、硬件、设备和项目式工作，这些都可能产生非常不同的利润率和营运资本画像。一家公司可以看起来具有战略不可替代性，同时经济性仍比投资者预期更软。


              执行广度进一步放大不确定性。管理层同时推进自动驾驶、农业、设备、机器人、铁路、智慧城市和低空经济叙事，并把品牌国际化为
              SpatiX。如果一个平台真的能跨垂直行业扩张，这会很有力；但它也可能稀释焦点、拉紧技术团队，并抬高支持复杂度。因此，当前整体风险评级是中高，而不是直接否定投资命题。公司看起来不是坏掉了，而是披露不足。投资者应让命题继续有效，但设置硬性否决条件：治理不透明必须收窄，安全控制必须验证，收入质量必须比单纯营销广度更强。
