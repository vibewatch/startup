      - number: '2.4'
        title: 增长驱动、约束与尽调重点
        blocks:
          - type: paragraph
            body: >-
              最可信的增长驱动来自自动化、数字化施工、精准农业、基础设施监测，以及从自有参考基础设施向托管校正服务迁移。第三方市场报告反复把需求增长与无人机、自动驾驶车辆、智能基础设施和更高价值企业工作流绑定。公司材料还补充了一个实用的微观驱动：校正服务可以替代或减少客户自建和维护基站网络的需求，在部分细分市场降低部署摩擦。但同样的来源也指出了真实采用约束。高精度基础设施资本密集，欺骗和干扰仍是结构性风险，许多企业买方在标准化供应商之前仍需要现场证明。主权导航政治也重要，因为定位基础设施触及国家系统、公共安全和军民两用敏感性。对
              Qianxun 而言，关键承销问题是需求是否集中在高端经常性服务，还是消散到一次性硬件交易和试点项目中。因此，最佳尽调路径是按垂直行业测试收入质量、部署后的切换成本、服务收入和设备收入之间的毛利差异，以及 OEM
              定点在多大程度上创造持久续约行为。
