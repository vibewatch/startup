      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 地缘政治筛查
        - 敏感外国交易反复卡在治理或信任审查
        - 两个或更多优先国家投标主要因政策原因失败
        - 暂停国际上行假设。
      - - 财务不透明
        - 管理层即使在 NDA 下也不披露收入结构、毛利率或集中度
        - 尽调后期仍拿不到核心经济指标
        - 不要按溢价估值承做。
      - - 运营可靠性
        - 正常运行时间、事件或 SLA 证据缺失或薄弱
        - 没有面向关键任务客户的可审计可靠性材料包
        - 上调运营风险折价。
      - - 客户质量风险
        - 具名部署无法转化为续约或扩张证明
        - 头部垂直领域均缺少续约数据
        - 假设耐久性更弱、倍数更低。
      - - 合规准备度
        - 没有清晰的数据流、出口或认证地图
        - 法律顾问无法为目标地区放行
        - 收窄海外市场情景。
      - - 管理层摊子过大
        - 垂直推进过多，却缺少负责到底的负责人
        - 没有针对新地区和产品的聚焦排序计划
        - 进一步下调执行倍数。
    notes: 这些触发因素设计成可监测指标，而不是定性口号。
