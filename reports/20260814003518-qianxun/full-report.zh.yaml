        title: 架构、工作流与依赖
        blocks:
          - type: paragraph
            body: >-
              已审阅技术叙事指向一个分层运营模型。最底层是 GNSS 星座和以 BeiDou 为中心的信号输入；其上是增强站、校正处理和分发网络；再上是 RTK/PPP
              服务、基础设施工具和现场设备等产品模块；最上层是测绘、机器控制、农业、铁路或机器人定位等垂直工作流。SpatiX 材料反复把公司框定在厘米级定位，以及用托管校正替代自有基站，暗示云 /
              网络运营是核心技术依赖。iStation18 和 iStation Pro 等基础设施产品说明，Qianxun
              不只是服务层提供商，也是网络建设和运营平台提供商。这套架构创造杠杆，因为覆盖和可靠性的提升可以一次性惠及多个垂直行业；但它也带来围绕星座质量、站点密度、通信链路和现场集成成功率的依赖风险。公开材料显示强烈的工作流野心，但没有充分暴露冗余设计、SLA
              细节或故障模式处理。支持升级路径和合同性能承诺也没有讲清。对于触及安全敏感和运营关键工作流的产品族，这个缺口与功能广度同样重要。因此，稳健的技术审查应测试同一架构能否可靠覆盖智能手机、车辆、机器人、农业和建筑，而不制造隐藏集成脆弱性。
