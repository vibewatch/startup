    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议仍保持正面，只是因为价格纪律抵消了披露缺口。
    data:
      nodes:
        - id: n1
          label: 战略相关性
          detail: 平台覆盖广、融资动能在、真实终端市场有暴露
        - id: n2
          label: 公开估值锚
          detail: 最有交叉验证的估值约为 $2.2B
        - id: n3
          label: 分母不透明
          detail: 收入、利润率、留存和股权结构细节缺失
        - id: n4
          label: 可比公司框架
          detail: Trimble / Hexagon / TomTom / u-blox / NextNav 对标公司
        - id: n5
          label: 地缘政治折价
          detail: Alibaba / BeiDou 关联和信任审查很重要
        - id: n6
          label: 建议：守住价格纪律才通过
          detail: 只有私下尽调补上关键缺口时才投资
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: 流程为定性判断，基于明确保留的证据和缺口。
