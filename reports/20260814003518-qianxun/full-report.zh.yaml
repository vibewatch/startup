  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买方与付款方
        blocks:
          - type: paragraph
            body: >-
              最好把 Qianxun 的客户群理解为一组 B2B 工作流细分，而不是一个单一「导航客户」类别。官方产品和解决方案页面，加之后续 SpatiX 文章，显示公司瞄准智能驾驶
              OEM、机器人和无人机运营方、测绘与制图团队、建筑和机器控制用户、农业经销商和农场、网络运营商，以及智慧城市或基础设施监测买方。用户通常是技术或运营人员，但付款方会随细分市场变化：汽车预算在 OEM
              项目中，农业往往流经经销商或设备渠道，测绘和机器控制在承包商或地理空间运营商手中，基础设施部署可能由企业、公共工程或网络运营买方出资。这对尽调很重要，因为 Qianxun 不是把一个 SKU
              卖给一种采购动作。它的商业触达取决于同一核心定位平台能否为非常不同的预算所有者重新包装，同时不损失利润率或支持质量。面向伙伴的测绘和农业文章也显示，分销是市场拓展设计的一部分，而不是事后补充；这提高了潜在触达，但也让终端客户所有权归属更复杂。因此，本章把广泛细分覆盖、具名采用证据和经常性收入耐久性分开处理；后者在公开材料中仍未披露。
