chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与定位
        blocks:
          - type: paragraph
            body: >-
              Qianxun Spatial Intelligence 将自己定位为一家全球空间智能基础设施公司，围绕厘米级定位、毫米级感知和纳秒级授时搭建能力。最强的身份线索集中在 2015 年 8
              月：官方英文网站称公司成立于 2015 年 8 月，CB Insights 和 Tracxn 也把成立时间放在 2015 年，Yicai 则明确 Alibaba Group 和 China North
              Industries Group 在公司创立时提供支持。公开描述一致把总部放在上海杨浦区，并称服务栈建立在 BeiDou 加 GPS、GLONASS 和 Galileo
              之上。因此，最干净的框架不是「普通地图创业公司」，而是一个国家级增强与位置云运营商，把中国卫星导航基础设施商业化，服务企业和设备生态。公开材料还显示，公司已把许多面向海外的活动改用 SpatiX
              品牌，同时底层仍保留 Qianxun SI 的公司身份。这个区别很重要，因为许多后来的英文文章先写 SpatiX
              产品，再写母公司；如果尽调笔记不做归一化，企业故事的连续性就会被遮住。这也意味着，一部分产品和市场主张停留在营销页面，而不是财务披露上，所以本章的身份梳理同时也是后续报告的来源校验工作。
