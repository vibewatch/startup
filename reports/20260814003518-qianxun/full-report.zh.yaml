      - number: '4.3'
        title: 资本充足性与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              融资记录暗示 Qianxun 为扩张反复需要外部资本，但公开记录仍过于不一致，无法判断当前资本是否充足。Yicai 和 Gasgoo 均指向 2024 年 8 月的一轮战略融资，把估值推至 RMB 160
              亿以上。CB Insights 和 Tracxn 都显示历史累计融资约 $1.41 亿，但对当前估值标记，以及最新可见 Series B 位于 2025 年还是 2026
              年存在分歧。与其说这些差异是历史琐事，不如说它们证明公开融资数据并不完整。已审阅来源中没有可靠的公开现金余额、烧钱速度或资金可支撑期披露。审阅材料也没有说明，网络扩张主要由经营现金流、战略投资者、渠道预付款，还是某种组合来支持。这迫使投资者采取保守看法：相对许多私有同业，公司看起来已进入后期且资金较充裕，但投资者无法判断当前资源对网络扩张、产品开发和国际市场拓展来说是充沛，还是仅仅够用。决定性的财务尽调要求很直接——按收入流拆分的收入、按收入流拆分的毛利率、当前现金余额、月度烧钱、资本开支计划，以及把战略规模主张转化为已计费经常性合同的情况。投资者还应询问，公司是否已经从依赖战略融资，跨入自我强化的经营杠杆；这个转变，而不是估值头条，才是财务质量真正的拐点。
