      - number: '1.2'
        title: 规模、产品广度与里程碑
        blocks:
          - type: paragraph
            body: >-
              对一家私有定位公司来说，Qianxun 的公开经营叙事异常宽。官方和近官方来源称，Qianxun 或 SpatiX 已向 21 亿至 26 亿台以上设备提供服务，覆盖 230 多个国家和地区，并在 2025
              年底突破单月 1 万亿次服务调用。核心产品集覆盖 SpatiX 定位服务、参考站和校正基础设施、面向智能驾驶的 FindAUTO、面向精准农业的 QYX Pro、RTK 接收机和混合测量设备，以及
              iStation18 等较新的参考站硬件。里程碑证据也显示，公司从国内 BeiDou 商业化，稳步转向更广的多行业基础设施：官方时间线提到 2020 年空间智能操作系统、2021 年亚太卫星覆盖、与 Huawei
              Mate40 的高精度定位合作，以及 2022 年冬奥会交通保障。后续 2026
              年博客和会议材料又把故事延展到自主机器人、光伏建设、铁路、农业和国际渠道搭建。最有吸引力的含义是横向复用：同一套校正和授时骨干，可以卖给汽车、手机、测绘、农业、基础设施监测和机器人，而不必每次重建物理层。主要需要警惕的是，这些规模数字大多来自公司本身，因此尽调应把它们视为方向上有用，但仍要求合同、部署或遥测数据印证。
