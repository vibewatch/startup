      - number: '8.3'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出逻辑有前景，但还不干净。从公开证据看，Qianxun
              更像一家可以继续融资战略资本，或走国内公开路径的公司，而不是一家已经立即准备好接受西方式透明度事件的公司。约束不是缺少叙事。事实上，叙事异常强：国家基础设施根基、Alibaba
              支持、产品广度，以及对长期自动化和智能基础设施趋势的明显暴露。约束是披露。投资者仍不够了解收入质量、优先权负担、海外销售敞口或治理权利，无法高信心承销回报区间。


              因此，最终尽调清单很直接。第一，证明分母：当前收入、毛利、烧钱，以及校正、设备和项目工作之间的组合。第二，证明耐久性：集中度、续约和细分市场客户经济性。第三，证明治理和退出准备度：股权结构表、优先权、董事会权利和审计准备度。第四，证明地缘政治风险已被定价，而不是被忽略。如果管理层能很好回答这些问题，围绕最后一个支撑充分公开标记给出通过结论是合理的，甚至可能偏保守。如果不能，正确结果就是把
              Qianxun 视为一家强公司，但价格证明不足。因此，本章底线是建设性的，但仅仅因为估值姿态明确基于区间，并绑定尽调里程碑，而不是只跟随叙事动能。
