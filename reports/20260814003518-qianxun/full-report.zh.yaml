  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 差分校正的经常性收入在自动驾驶、无人机和基础设施场景铺开；治理层面的疑点收窄； 利润率足够接近软件业务。
        - 随时间推移，可支撑估值上行至 $2B 高段到 $3B 中段。
        - 执行跨度、地缘政治和集中度仍然关键。
        - 需要私有 KPI 给出强证明，并持续拿下战略性订单。
      - - 基准
        - Qianxun 是具备实质变现的战略平台，但经济模型参差，披露只部分 改善。
        - 支撑估值锚定在 $2B 低段至中段。
        - 分母不透明，估值溢价存在压缩风险。
        - 与现有公开证据最匹配。
      - - 悲观
        - 增长确实存在，但收入低于预期，硬件 / 项目制占比偏重，海外上行空间 受限。
        - 意味着公允价值可能明显低于上一次公开估值标记。
        - 地缘政治折价、较低毛利率和集中度。
        - 如果尽调无法补上分母缺口，该情景概率上升。
    notes: 情景逻辑基于战略相关性和可比公司框架，不基于 Qianxun 披露的收入指引。
