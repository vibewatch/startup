        - 没有分母就无法承销估值
        - 管理层 / CFO 数据室。
      - - 毛利率和现金使用
        - 产品线毛利率、烧钱速度和营运资本状况
        - 决定 Qianxun 应该拿软件型还是硬件型倍数
        - 财务尽调工作流。
      - - 留存和集中度
        - NRR、流失率、头部客户结构、续约节奏
        - 持续性比部署新闻更重要
        - 商业尽调和客户背调电话。
      - - 股权结构和优先权
