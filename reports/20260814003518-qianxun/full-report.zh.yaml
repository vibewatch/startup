  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，对 Qianxun
              的判断最好表述为：通过，中等信心，中高风险——但前提是严守价格纪律。已有证据足以相信公司具有战略重要性：官方材料显示一个宽定位平台，近期新闻确认融资动能延续，前文也确立了公司在汽车、基础设施、设备和相邻自动化工作流中的实际相关性。这比预收入或纯愿景型深科技案例更强。与此同时，公开来源没有披露估值最关键的分母。收入、毛利、烧钱、留存、集中度和优先权负担仍不透明。因此，建议既取决于证据敏感度，也取决于业务质量。


              最干净保留的公开价格锚点是 Yicai 报道的 RMB 160 亿以上估值，约 $22
              亿。更高的当前标记最终可能正确，尤其考虑到用户提供的后续轮次背景；但在保留的直接来源集合中，它没有得到同等印证。因此，投资者不应把传闻区间上沿视为自证。更合适的姿态是：如果入场价格接近或低于支撑最充分的公开标记，并且私下尽调补上分母缺口，则通过；如果管理层要求投资者在缺乏硬收入质量证据的情况下支付大幅更高价格，则持有或否决。这是一个典型案例：公司质量和估值质量不是一回事。Qianxun
              可以具有战略价值，但如果未披露经济性支撑不了稀缺性溢价假设，仍可能被高估。
