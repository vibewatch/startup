  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付费方
      - 为何重要
    rows:
      - - 校正服务 / RTK / PPP 订阅
        - 网络校正、可用性保障、支持和 API 的经常性费用
        - 商品化手机导航和免费粗定位应用
        - OEM 平台团队、测绘经理、经销商、车队运营方
        - Qianxun 最直接的核心变现层。
      - - 基准站和 CORS 基础设施
        - 基准站、网络部署、管理软件和维护
        - 通用通信塔或无关传感器网络
        - 政府地理空间运营方、私有网络建设方、渠道伙伴
        - Qianxun 销售网络基础设施或合作铺设网络时，基准站 / CORS 很关键。
      - - 高精度现场硬件
        - 接收机、天线、机械控制系统、农业套件、测量终端
        - 没有付费精度功能的大众消费设备
        - 经销商、承包商、测绘公司、农场、OEM
        - 可作为切入口，但收入质量通常低于纯订阅服务。
      - - 汽车 / 机器人定位栈
        - 集成定位模块、校正数据流和验证工具
        - 通用车载娱乐导航或单独地图
        - 汽车 ADAS 团队、机器人产品负责人
        - 一旦设计导入，收入可随量产项目放大，因此汽车 / 机器人定位栈具备战略增长意义。
      - - 空间工作流软件
        - 与高精度工作流绑定的任务控制、数据可视化、制图和运营工具
        - 不依赖高精度校正输入的独立 GIS
        - 项目经理、精准农业运营方、资产所有者
        - 与硬件和服务合同打包时，可提高粘性。
    notes: 边界聚焦可变现的精密定位层，而不是整个卫星导航半导体经济。
    claimRefs:
      - CM001
      - CM003
      - CM015
      - CM017
      - CM031
