- id: capability-pricing-and-channel-comparison
  title: Capability, Pricing, and Channel Comparison
  body: |-
    Capability breadth favors the incumbents, while specialization can favor Qianxun in selected use cases. Trimble, Hexagon, Topcon, and CHCNAV all present broad portfolios spanning hardware, software, and field workflows, which gives them natural channel leverage in survey, construction, and agriculture. HERE and TomTom have powerful automotive and enterprise-location brands but compete from a mapping and platform angle rather than pure centimeter-correction infrastructure. u-blox and Point One show the importance of modular, OEM-friendly high-precision positioning offerings, especially for robotics and autonomy programs. Public pricing transparency is poor across the category: most vendors hide enterprise pricing, sell through distributors, or package positioning within larger system contracts, which increases negotiation opacity and makes realized economics harder to benchmark from outside. That weak pricing visibility itself is a competitive fact because it lets incumbents discount strategically and bundle adjacent software, hardware, and support. For Qianxun, the practical channel question is whether it can win through direct infrastructure capability or whether global scaling will require distributor, OEM, and systems-integrator partnerships that dilute margin but expand reach.
