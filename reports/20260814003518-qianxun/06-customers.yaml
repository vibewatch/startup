- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration Risk
  body: |-
    Public evidence on retention is much thinner than public evidence on deployment. There is no disclosed NRR, GRR, churn, contract-length, or cohort data in reviewed sources. The best public proxies are continuity of product-roadmap activity, repeat field-validation posts, growing partner language in agriculture and surveying, and the fact that several customer classes appear to require ongoing corrections, infrastructure support, or software updates rather than pure one-time hardware sales. Those indicators suggest Qianxun can create expansion loops after deployment, especially where customers depend on stable corrections or infrastructure uptime. Still, the report should not overclaim: many of the best visible proofs are company-authored case studies, and some of the broadest device and service-count claims do not identify paying accounts. Concentration risk is also unresolved. Automotive appears strategically important enough that a few major OEM or program relationships could dominate revenue, while channel-heavy agriculture or overseas expansion could leave partners owning the customer. The correct diligence stance is that customer proof is stronger than customer-economics proof, and investors need contract, renewal, and mix data before calling the base durable. Until then, the company should be treated as commercially validated but not yet publicly transparent on customer quality. Public diligence should also test service-level support burdens by segment.
