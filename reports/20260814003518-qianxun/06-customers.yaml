- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Intelligent-driving OEMs
    - 'Buyer: OEM ADAS/platform; User: localization engineers; Payer: vehicle program budget'
    - Lane-level localization and production intelligent driving
    - Strongest named public proof
    - Could create sticky, high-volume recurring service demand
    - No public contract value or renewal data.
  - - Smartphone / device OEMs
    - 'Buyer: device OEM; User: end device owner; Payer: device/OEM integration budget'
    - High-precision handset positioning and device features
    - Named OEM relationships in official timeline
    - Shows embed ability at device scale
    - Commercial model not disclosed.
  - - Agriculture dealers, OEMs, and farms
    - 'Buyer: dealer/OEM/farm owner; User: operator; Payer: dealer bundle or farm budget'
    - Autosteer, task control, input savings
    - Many recent product and channel posts
    - Potential recurring plus hardware bundle revenue
    - Payback, renewals, and channel economics undisclosed.
  - - Survey / construction / mapping users
    - 'Buyer: contractor, survey team, geospatial operator'
    - RTK survey, machine control, scanning, site layout
    - Multiple case-style proofs
    - Supports hardware + service + partner model
    - Customer count and repeat-purchase data absent.
  - - Rail / infrastructure / smart city / network operators
    - 'Buyer: operator, public works, enterprise or regional network owner'
    - Rail safety, monitoring, CORS, deformation or infrastructure positioning
    - Evidence present but more project-style
    - Strategic for infrastructure moat and public-sector relevance
    - Commercial cadence and public procurement depth unclear.
  notes: Segment framing distinguishes buyer, user, and payer because procurement motion changes materially by vertical.
