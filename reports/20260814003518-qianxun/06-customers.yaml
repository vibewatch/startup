- id: named-customer-proof-and-adoption
  title: Named Customer Proof and Adoption Trajectory
  body: |-
    The strongest named proof sits in automotive and in selected project-style deployments. Gasgoo reports that Qianxun’s FindAUTO solution has been deployed in over 30 vehicle models and secured production projects for more than 100 models from named brands including SAIC Motor, Geely, XPENG, Li Auto, IM Motors, Leapmotor, Hongqi, and GAC AION. Official history pages also point to smartphone-OEM relationships with Huawei, Honor, Xiaomi, OPPO, and VIVO, showing Qianxun’s ability to embed into device ecosystems beyond cars. Outside mobility, SpatiX posts provide customer-proof style evidence across multiple verticals: Mahadev Engineerings in solar construction, the Hotan-Ruoqiang Railway build in Xinjiang, Golden Mount Bangkok heritage-site scanning, QYX Pro agriculture demonstrations and channel development, and cold-environment robot or humanoid demonstrations in Altay. These proofs are heterogeneous—some are clearly production-linked, others are pilots, case studies, or channel-building moments—but taken together they support the conclusion that Qianxun has real cross-vertical deployment momentum. What they do not yet show is how much of that momentum is attached to large recurring contracts versus one-off project revenue or marketing-heavy showcase deployments. That distinction is especially important because the same public proof set mixes fleet-scale automotive programs with individual project testimonials and channel-building exhibition narratives.
