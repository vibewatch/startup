- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from corrections into devices and vertical solutions
    - Could hide low-margin hardware-heavy mixes
    - Blended economics may be weaker than installed-base optics suggest
    - Break revenue down by corrections, devices, projects, and services.
  - - Automotive production-program scaling
    - A few OEM programs may dominate revenue
    - Program loss could hit scale story disproportionately
    - Request top-customer concentration and active-program revenue.
  - - Agriculture dealer and partner expansion
    - Partners may own the customer relationship
    - Renewal ownership and margin may sit outside Qianxun
    - Inspect dealer contracts and support responsibilities.
  - - International field validation and partner recruitment
    - Overseas proof may remain pilot-heavy
    - Expansion narrative can outrun monetized deployment
    - Map paying countries versus test countries.
  - - Infrastructure and network-operator relationships
    - Public-sector or project concentration may create lumpy revenue
    - Cash generation could become irregular
    - Request backlog, tender, and maintenance-contract visibility.
  notes: Expansion looks plausible, but concentration and channel economics remain under-disclosed.
