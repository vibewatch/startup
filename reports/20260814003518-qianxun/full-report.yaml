      - number: '4.3'
        title: Capital Adequacy and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The funding record implies Qianxun has repeatedly required external capital to scale, but the public
              record is still too inconsistent to size present capital adequacy. Yicai and Gasgoo agree on an August
              2024 strategic financing that pushed valuation above RMB 16 billion. CB Insights and Tracxn both show
              roughly $141 million total funding historically, but differ on current valuation markers and whether the
              latest visible Series B sits in 2025 or 2026. Those discrepancies matter less as historical trivia than as
              evidence that public financing data is incomplete. There is no reliable public cash-on-hand, burn-rate, or
              runway disclosure in reviewed sources. Nor do reviewed materials disclose whether network expansion is
              funded mostly from operating cash generation, strategic investors, channel advances, or some combination
              thereof. That forces a conservative view: the company appears late-stage and well-funded relative to many
              private peers, but investors cannot determine whether current resources are abundant or merely adequate
              for network expansion, product development, and international go-to-market. The decisive financial
              diligence requests are straightforward—revenue by stream, gross margin by stream, current cash balance,
              monthly burn, capex plan, and the conversion of strategic scale claims into billed recurring contracts.
              Investors should also ask whether the company has already crossed from strategic financing dependency into
              self-reinforcing operating leverage, because that transition, not valuation headlines, is the real
              inflection point for financial quality.
