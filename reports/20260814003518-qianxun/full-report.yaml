      - number: '4.2'
        title: Cost Structure, Unit Economics, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              The cost structure is easier to infer than to verify. Any company operating large correction networks and
              augmentation infrastructure should face meaningful network, support, deployment, and ongoing maintenance
              costs, and Qianxun’s own and press-reported station counts point to real capital intensity. Hardware lines
              add inventory, channel, certification, and support burden that likely carry lower gross margins than
              software-like correction services. Comp filings from adjacent public peers such as u-blox, TomTom,
              Trimble, and NextNav are useful only as directional comparables: they show that positioning businesses can
              combine modules, software, maps, and services, but margin structure varies sharply by mix. Public evidence
              also suggests that enterprise/OEM sales cycles matter. Automotive, infrastructure, and survey deployments
              likely require integration, validation, and channel coordination before revenue scales. What remains
              missing is the actual unit-economics bridge: CAC, payback, gross margin by stream, service delivery cost
              per active endpoint, and the split between recurring and non-recurring revenue. Public disclosures also
              omit collections quality and working-capital discipline. Without those inputs, the correct financial
              stance is to treat public scale claims as demand proof, not as proof of attractive economics.
            claimRefs:
              - CI011
              - CI012
