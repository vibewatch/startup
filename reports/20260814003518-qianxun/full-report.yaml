      - - Base
        - >-
          Qianxun is a strategic platform with meaningful monetization, but economics are mixed and disclosure remains
          only partly improved.
        - Supports valuation anchored around the low-to-mid $2B range.
        - Opaque denominator and premium-compression risk.
