companyProfile:
  summary: >-
    Qianxun Spatial Intelligence is a Shanghai-based late-stage private spatial-intelligence company built on the
    commercialization of BeiDou-era precision-positioning infrastructure. Public evidence supports a broad product stack
    spanning correction services, GNSS infrastructure, and field devices for automotive, infrastructure, surveying,
    agriculture, robotics, and device ecosystems. The company’s strategic appeal comes from platform breadth,
    Alibaba-linked formation history, and relevance to autonomy and smart-infrastructure demand, but public disclosure
    on revenue quality, governance terms, and foreign-market traction remains limited.
  foundedDate: '2015-08-01'
