      - number: '1.2'
        title: Scale, Product Breadth, and Milestones
        blocks:
          - type: paragraph
            body: >-
              The public operating story is unusually broad for a private positioning company. Official and
              near-official sources claim that Qianxun or SpatiX has delivered services to more than 2.1 billion to 2.6
              billion devices, serves more than 230 countries and regions, and crossed one trillion monthly service
              calls by the end of 2025. The core product set spans SpatiX positioning services, reference-station and
              correction infrastructure, FindAUTO for intelligent driving, QYX Pro for precision agriculture, RTK
              receivers and hybrid measurement gear, and newer reference-station hardware such as iStation18. Milestone
              evidence also shows a steady shift from domestic BeiDou commercialization toward broader multi-industry
              infrastructure: official timeline pages reference the 2020 spatial intelligent operating system, 2021
              satellite coverage across Asia-Pacific, Huawei's Mate40 high-precision positioning collaboration, and 2022
              Winter Olympics transport support. Later 2026 blog and conference materials extend that story into
              autonomous robots, solar construction, rail, agriculture, and international channel building. The most
              attractive implication is horizontal reuse: one correction and timing backbone can be sold into autos,
              phones, survey, agriculture, infrastructure monitoring, and robotics without rebuilding the physics layer
              each time. The main caution is that most of those scale figures are company-originated, so diligence
              should treat them as directionally useful but still require contract, deployment, or telemetry
              corroboration.
