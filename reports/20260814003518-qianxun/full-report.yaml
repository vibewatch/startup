      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              The most credible growth drivers are autonomy, digital construction, precision agriculture, infrastructure
              monitoring, and the migration from owned reference infrastructure to managed correction services.
              Third-party market reports repeatedly tie demand growth to drones, autonomous vehicles, smart
              infrastructure, and higher-value enterprise workflows. Company materials add a practical micro-driver:
              correction services can replace or reduce the need for customers to build and maintain their own
              base-station networks, lowering deployment friction in some segments. But the same sources also highlight
              real adoption constraints. High-precision infrastructure is capital intensive, spoofing and jamming remain
              structural risks, and many enterprise buyers still need field proof before standardizing on a provider.
              Sovereign-navigation politics also matter because positioning infrastructure touches national systems,
              public safety, and dual-use sensitivities. For Qianxun specifically, the key underwriting question is
              whether demand concentrates in premium recurring services or dissipates into one-off hardware deals and
              pilot programs. The best diligence path is therefore to test revenue quality by vertical, switching costs
              after deployment, gross margin differences between service and device revenue, and the degree to which OEM
              design-ins create durable renewal behavior.
