  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Qianxun should be analyzed against the high-precision positioning stack rather than the entire
              satellite-navigation economy. EUSPA’s 2026 market framing shows GNSS value creation moving downstream into
              applications and services, while Qianxun’s own English surfaces emphasize correction services,
              reference-station infrastructure, and industry solutions for intelligent driving, agriculture, robots,
              drones, and surveying. That means the included spend is enterprise and OEM money paid for centimeter-grade
              positioning, correction subscriptions, reference networks, field hardware, and software workflows that
              depend on dependable PNT performance. Excluded spend is the broad mass-market GNSS chip and handset
              universe unless it converts into paid precision services or differentiated device features. Status-quo
              substitutes are self-built base stations, lower-cost survey workflows, lower-accuracy consumer GNSS,
              inertial-only localization in constrained environments, and incumbent geospatial vendors bundled into
              equipment purchases. The practical implication is that Qianxun’s market is narrower than headline “GNSS
              market” totals, but it is also higher value because buyers pay for accuracy, uptime, and workflow outcomes
              rather than raw signal access alone. The strongest market thesis is therefore not “all navigation is
              addressable,” but “specific verticals increasingly require correction-grade positioning to automate
              physical workflows.”
