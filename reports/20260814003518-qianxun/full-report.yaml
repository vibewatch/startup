        title: Customer Segments, Buyers, and Payers
        blocks:
          - type: paragraph
            body: >-
              Qianxun’s customer base is best understood as a set of B2B workflow segments rather than a single
              “navigation customer” class. Official product and solution pages, plus later SpatiX posts, show the
              company targeting intelligent-driving OEMs, robotics and drone operators, survey and mapping teams,
              construction and machine-control users, agriculture dealers and farms, network operators, and smart-city
              or infrastructure monitoring buyers. The user is often technical or operational, but the payer changes by
              segment: automotive budgets sit with OEM programs, agriculture often flows through dealers or equipment
              channels, surveying and machine control sit with contractors or geospatial operators, and infrastructure
              deployments may be funded by enterprise, public-works, or network-operator buyers. This matters for
              diligence because Qianxun is not selling one SKU to one procurement motion. Its commercial reach depends
              on whether the same core positioning platform can be repackaged for very different budget owners without
              losing margin or support quality. The presence of partner-facing surveying and agriculture posts also
              suggests that distribution is part of the go-to-market design, not an afterthought, which increases
              potential reach but complicates attribution of end-customer ownership. The chapter therefore separates
              broad segment coverage from named adoption proof and from recurring-revenue durability, which public
