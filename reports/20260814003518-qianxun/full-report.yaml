    rows:
      - - Bull
        - >-
          Recurring corrections revenue scales across AV, drones, and infrastructure; governance questions narrow;
          margins prove software-like enough.
        - Supports upside toward the upper-$2B to mid-$3B band over time.
        - Execution breadth, geopolitics, and concentration still matter.
