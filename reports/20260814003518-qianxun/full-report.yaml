  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Competitor Classes
        blocks:
          - type: paragraph
            body: >-
              Qianxun does not face one clean peer set. The direct precision-positioning class includes CHCNAV, ComNav
              Technology, Topcon, Trimble, u-blox, and Point One Navigation, all of which market high-accuracy GNSS or
              autonomy-positioning capabilities. A second class consists of larger geospatial and industrial incumbents
              such as Hexagon, whose Autonomy & Positioning division extends far beyond stand-alone receivers into
              enterprise workflows, safety, and industrial systems. A third class includes broader location and mapping
              platforms such as HERE and TomTom, which may not sell the same correction stack but still compete for OEM
              mindshare, vehicle programs, fleet deployments, and developer budgets. NextNav and KINEXON are useful
              adjacencies rather than perfect product matches: NextNav stresses resilient PNT and geolocation, while
              KINEXON shows that some buyer needs can be met through real-time location systems outside classic GNSS
              correction. The key diligence point is that Qianxun must win different comparisons in different verticals:
              survey-grade accuracy against CHCNAV or Topcon, autonomy readiness against Point One or Trimble, and trust
              or integration breadth against HERE, Hexagon, or TomTom. No single rival explains the whole landscape,
              which is why segment-specific competitive mapping matters more than one summary logo slide.
