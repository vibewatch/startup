      - number: '8.2'
        title: Comparable Frame and Scenario Ranges
        blocks:
          - type: paragraph
            body: >-
              The comp set says Qianxun should be framed between three very different public reference classes. First,
              mature industrial-positioning leaders like Trimble and Hexagon show what scale looks like when
              measurement, software, and industrial workflow adoption are already fully monetized. They are much larger
              and more transparent than Qianxun, so they are better as ceiling references than as direct peer multiples.
              Second, TomTom shows the cautionary case: location and mapping businesses without strong growth or premium
              scarcity can trade at roughly revenue-scale valuations that are far less generous than private-unicorn
              headlines imply. Third, NextNav shows the opposite extreme: the market can place very large value on
              strategic PNT optionality even before conventional revenue scale emerges. u-blox sits somewhere in
              between, illustrating both the value and the cyclicality of GNSS-adjacent hardware exposure.


              Those comps imply that Qianxun’s fair range depends overwhelmingly on hidden denominator quality. If
              Qianxun is closer to a low-growth location or hardware-heavy model, a multi-billion-dollar mark will look
              expensive. If it is closer to a strategic infrastructure platform with strong recurring corrections
              revenue, meaningful switching costs, and China-scale deployment leverage, then a low-to-mid $2B valuation
              is much easier to justify. That is why the scenario table uses bull, base, and bear bands instead of
              pretending to precision. Base case assumes Qianxun is more strategic than TomTom and more monetized than
              NextNav, but still less proven and less transparent than Trimble or Hexagon. Bull case assumes recurring
              platform economics and strong commercialization of AV, drone, and infrastructure demand. Bear case assumes
              geopolitical discounts, concentration, and hardware/project mix cap the multiple.
            claimRefs:
              - CV012
              - CV013
              - CV014
