      - number: '8.3'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit logic is promising but not yet clean. From public evidence, Qianxun looks more like a company that
              can raise additional strategic capital or pursue a domestic public path than one that is immediately ready
              for a Western-style transparency event. The constraint is not lack of narrative. In fact, the narrative is
              unusually strong: national infrastructure roots, Alibaba backing, product breadth, and obvious exposure to
              long-run autonomy and smart-infrastructure trends. The constraint is disclosure. Investors still do not
              know enough about revenue quality, preference overhang, foreign sales exposure, or governance rights to
              underwrite return ranges with high confidence.


              That means the final diligence agenda is straightforward. First, prove the denominator: current revenue,
              gross margin, burn, and the mix between corrections, devices, and project work. Second, prove durability:
              concentration, renewals, and segment-level customer economics. Third, prove governance and exit readiness:
              cap table, preferences, board rights, and audit readiness. Fourth, prove that geopolitical risk is priced
              rather than ignored. If management can answer those questions well, a pass verdict around the last
              well-supported public mark is reasonable and may even prove conservative. If not, then the proper outcome
              is to treat Qianxun as a strong company with insufficient price proof. The chapter’s bottom line is
              therefore constructive, but only because the valuation stance is explicitly range-based and tied to
              diligence milestones rather than to narrative momentum alone.
            claimRefs:
              - CV027
              - CV028
              - CV033
              - CV034
              - CV037
              - CV038
              - CV039
              - CV040
              - CV042
