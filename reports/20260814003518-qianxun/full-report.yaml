  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Module Map
        blocks:
          - type: paragraph
            body: >-
              Qianxun’s public product surface spans far more than one correction feed. Official and SpatiX materials
              show at least five commercially distinct layers: correction services and positioning APIs, GNSS
              infrastructure and reference-station platforms, field hardware such as receivers and machine-control
              tools, automotive and robot positioning solutions, and precision-agriculture products such as QYX Pro.
              That breadth matters because it turns Qianxun from a pure data utility into a workflow-enabling platform.
              It also gives the company multiple ways to attach to the same customer, whether through infrastructure,
              devices, software, or vertical bundles. The product strategy appears to be horizontal physics plus
              vertical packaging: one positioning backbone is reused across agriculture, construction, rail, mapping,
              robotics, and intelligent driving, then expressed through different devices, bundles, and partner motions.
              The downside of that breadth is complexity. Every additional module implies more support, certification,
              distribution, and integration burden, and public sources do not fully disclose which modules are mature
              revenue drivers versus newer international expansion wedges. In practice this means product breadth is
              both an advantage and a diligence problem: the company can tell a larger platform story, but outside
              investors still need to separate flagship modules from experimental export motions and determine where
              support complexity could outrun product economics.
