      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Geopolitical screening
        - Sensitive foreign deals repeatedly stall on governance or trust review
        - Two or more priority-country bids fail primarily on policy grounds
        - Pause international-upside assumptions.
      - - Financial opacity
        - Management will not disclose revenue mix, gross margin, or concentration under NDA
        - Core economic metrics remain unavailable late in diligence
        - Do not underwrite premium valuation.
      - - Operational reliability
        - Uptime, incident, or SLA evidence is missing or weak
        - No auditable reliability pack for mission-critical customers
        - Escalate operational-risk discount.
      - - Customer-quality risk
        - Named deployments do not translate into renewal or expansion proof
        - Renewal data absent across top verticals
        - Assume lower durability and lower multiple.
      - - Compliance readiness
        - No clear data-flow, export, or certification map exists
        - Counsel cannot clear target geographies
        - Restrict overseas market case.
      - - Management stretch
        - Too many vertical pushes without accountable owners
        - No focused sequencing plan for new geographies and products
        - Discount execution multiple further.
    notes: These triggers are designed to be monitorable rather than qualitative slogans.
