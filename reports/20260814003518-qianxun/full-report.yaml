  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Traction Proxies
        blocks:
          - type: paragraph
            body: >-
              Qianxun’s public surfaces support a mixed revenue model rather than a pure SaaS or pure hardware identity.
              The company and its SpatiX brand market correction services, GNSS infrastructure, RTK and survey hardware,
              intelligent-driving solutions, and precision-agriculture offerings such as QYX Pro. That suggests at least
              four monetization channels: recurring correction or platform service fees, hardware/device sales, project
              or deployment revenue tied to infrastructure buildout, and solution-level revenue bundled into vertical
              workflows. It also implies accounting complexity because the company may recognize revenue under different
              delivery patterns depending on whether a contract is subscription-like, device-led, channel-mediated, or
              milestone-based. Public traction signals are much stronger than public revenue signals, which creates a
              classic late-stage diligence trap: impressive scale optics can coexist with unresolved monetization
              quality. Yicai, Gasgoo, and official materials point to billions of devices served, 10B+ daily services,
              1T monthly service calls by late 2025, and significant intelligent-driving deployment counts. Those
              metrics matter because they imply commercial relevance and network utilization, but they do not disclose
              realized revenue, renewal quality, or gross profit. The clean conclusion is that Qianxun has a meaningful
              revenue opportunity surface, but public evidence does not yet separate recurring subscription economics
              from one-off hardware or project revenue.
