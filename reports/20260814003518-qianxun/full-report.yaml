      - number: '5.2'
        title: Architecture, Workflow, and Dependencies
        blocks:
          - type: paragraph
            body: >-
              The reviewed technical story points to a layered operating model. At the bottom sit GNSS constellations
              and BeiDou-centered signal inputs; above that sit augmentation stations, correction processing, and
              distribution networks; above that sit product modules such as RTK/PPP services, infrastructure tools, and
              field devices; and at the top sit vertical workflows such as survey, machine control, agriculture, rail,
              or robot localization. SpatiX materials repeatedly frame the company around centimeter-level positioning
              and the substitution of managed corrections for owned base stations, implying that cloud/network
              operations are core technical dependencies. Infrastructure products such as iStation18 and iStation Pro
              indicate that Qianxun is not only a service-layer provider but also a network-build and operating-platform
              provider. That architecture creates leverage, because improvements to coverage and reliability can benefit
              multiple verticals at once, but it also creates dependency risk around constellation quality, station
              density, communications links, and successful field integration. Public materials show strong workflow
              ambition, but they do not fully expose redundancy design, SLA detail, or failure-mode handling. Nor do
              they spell out support escalation paths or contractual performance commitments. For a product family that
              touches safety-sensitive and operations-critical workflows, that gap matters as much as feature breadth. A
              robust technical review should therefore test whether the same architecture can reliably span smartphones,
              vehicles, robots, agriculture, and construction without creating hidden integration fragility.
