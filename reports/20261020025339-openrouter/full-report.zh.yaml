    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 称其于 2023 年初以 LLM 市场起步，Tracxn
              则将公司所在地列为纽约市。它不是基础模型开发商，而是托管式路由与计费层：一个界面接入广泛的模型和供应商目录，并叠加路由、故障切换、用量追踪和企业控制。官网目前显示 500+ 个模型、80+ 家供应商、10M+
              全球用户和每月 600T+ tokens。这些规模数据由公司发布，应视为运营口径，而不是独立审计指标。Sacra
              将其描述为与推理支出挂钩的按用量模式，因此吞吐量具有商业意义，但本身并不能证明收入、利润率、留存或现金创造能力。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
