      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              开发者通常是第一批用户，因为统一端点能减少测试或切换模型时反复做集成的工作。对 AI
              原生产品团队而言，经济买方更可能是工程或平台负责人，他们关注更快的模型选择、故障切换和统一用量可见性。在大型企业，预算归属可能横跨 AI
              平台、云基础设施、FinOps、安全和采购；证据确认了这些控制功能，却没有指出一个普遍适用的预算负责人。采用通常从模型试验或应用集成开始，等流量规模让可靠性、策略执行和成本治理变得重要后再扩展。受监管或合同要求较重的部署，可能更偏好合同控制更清晰的直接供应商或云网关。
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              模型数量扩张和高 token 消耗催生了对中立路由层的需求：SiliconANGLE 引述 Deloitte 研究称，67% 的企业已经每月计算近十亿 tokens，而 OpenRouter
              的目录覆盖数百个模型。同样的动力也带来风险。IBM 认为，随着竞争对手和开源项目增多，网关可能商品化。独立评测将路由不透明、平台费、支持和计费投诉，以及自托管或合同控制有限列为规模化障碍。对估值而言，只有当
              OpenRouter 把路由流量转化为持久经济性，同时不把大型或受监管工作负载输给直接、自托管或云供应商替代方案时，用量增长才具有支持作用。公开来源没有披露全市场支出、客户集中度、抽成率或各买方细分的转化率。
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
