  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              最重要的暴露并非某个模型单独失效，而是在控制权变更待定期间，把路由、数据策略执行、用量核算和供应商结算集中于一个封闭的托管网关。这种集中会让治理和运营故障相互放大：路由缺陷可能变成隐私、成本或可用性事件，而所有权变化可能改变路由中立性的激励。OpenRouter
              报告了企业级触达规模：1,000 万全球用户、80+ 家供应商和 500+ 个模型，因此控制平面故障可能造成广泛影响。热力图因此只对剩余暴露进行定性评级，不暗示现有公开文件无法支持的经测量事故概率。
