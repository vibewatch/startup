        title: 成熟度、生态信号与差异化
        blocks:
          - type: paragraph
            body: >-
              产品成熟度体现在官方多语言 SDK 组合、agent 工具、示例、OpenAPI 规范，以及首页发布流中；后者在 2026 年 10
              月已包含企业私有端点。最清晰的差异化是广度加运营抽象：一次集成就能比较模型、应用路由偏好、统一用量并执行故障切换，无需客户运营自己的网关。一项第三方测试报告称，在为期两周、约 50,000
              次请求的聊天机器人运行中，三次上游宕机均未造成服务中断；但同一发布方也观察到 200-500
              毫秒的延迟变化和不透明的供应商选择。这是有方向性的证据，不是独立可靠性基准。持久护城河更依赖路由质量、供应商关系、开发者采用和运营信任，而非专有模型 IP。
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: 信任、可靠性、隐私与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              这一抽象层把可用性、数据处理、计费和支持集中到一个控制点。独立评测指出，封闭的路由逻辑、无法自托管部署，以及事后才能看到而非完全透明的供应商选择，限制了可审计性。评测还称，留存和隐私条件因上游供应商而异，零数据留存路径并不普遍。用户证据褒贬不一：一份
              2026 年 8 月的评测汇总了 33 条评论，Trustpilot 得分为
              1.8/5，投诉涉及支持延迟、计费、免费层限制、宕机和模型标识符变更。这些信号值得直接尽调，但不能证明事故频率。在企业投资判断前，应取得当前 SOC
              报告及范围、子处理方、数据流与留存矩阵、区域控制、正常运行时间与恢复历史、支持指标，以及通往直接供应商或自托管网关的经测试退出方案。
