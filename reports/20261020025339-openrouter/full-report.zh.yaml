  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的核心产品不是基础模型，而是托管式访问和路由层，让应用通过一个兼容 OpenAI 的契约访问多个模型。客户工作流从 API key 或官方 SDK
              开始，发送熟悉的聊天请求，按标识符选择模型，并接收标准化响应。这省去了维护不同供应商 SDK、凭据、响应解析器和计费账户的大量集成工作。当前首页显示 80+ 家供应商的 500+
              个活跃模型，但其他当前官方和第三方页面给出的数字更低，因此目录广度应视为有日期的运营快照，而不是稳定 KPI。公开的 TypeScript、Python、Go、agent
              和集成仓库，则把产品从单一端点扩展成支持多种客户端路径的生态。
            claimRefs:
              - CE001
              - CE002
