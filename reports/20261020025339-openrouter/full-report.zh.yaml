      - number: '5.2'
        title: 架构、部署与集成模式
        blocks:
          - type: paragraph
            body: >-
              可观察架构分为六层：应用工作流、客户端 SDK、标准化 API 契约、策略与供应商路由、上游模型执行，以及用量治理。OpenRouter 文档确立了 schema 标准化和公开的 OpenAPI
              界面；独立指南也证实，只需更换端点、密钥和模型标识符，就能替代多次直接集成。首选路径不可用或触及速率限制时，路由会在供应商之间选择或回退。这一设计减少了集成和故障切换工作，却在客户与每个上游供应商之间增加了对网关的依赖。因此，生产资格评估应针对客户实际工作负载测试供应商固定、回退、结构化输出、工具调用、流式传输、速率限制和错误语义，而不能只根据共享请求格式推断兼容性。
