          - type: paragraph
            body: >-
              OpenRouter 宣布完成由 CapitalG 领投的 $113M B 轮，数家基础设施供应商和现有投资者参与。Tracxn 和 Menlo 均佐证了该金额，但两者对时间的描述不同。Tracxn
              报告三轮融资共筹得 $166M，最近一次已知估值为 $1.3B；Menlo 也报告 $1.3B
