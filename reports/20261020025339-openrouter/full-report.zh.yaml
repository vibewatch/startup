            title: 公开证据不足以支撑全市场 TAM
            body: 留存证据衡量了 OpenRouter 的用量、目录覆盖和部分企业行为，但没有披露网关可触达的收入池、其中将继续采用多模型的部分，或买方会外包而非内部构建的份额。
