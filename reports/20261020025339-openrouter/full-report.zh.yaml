        - 供应商目录价转嫁，加收据称 5.5% 的积分购买费；企业报价
        - 统一目录、路由、计费、日志和企业控制
        - BYOK 额度和费用因套餐而异；折扣和实际支出不可得
        - 便利费随购买积分增加，除非企业条款抵消该费用
      - - LiteLLM
        - 免费开源自托管；企业支持另行定价
        - 兼容 OpenAI 的代理、路由、密钥、预算和钩子
        - 不含基础设施、数据库、Redis、人员和事故成本
        - 经济优势取决于足够的规模和运营能力
      - - Portkey
        - 免费开发者层级；据报道托管套餐每月 $49 起，企业套餐定制
        - 路由、日志、追踪、防护栏、预算和政策
        - 日志限制、留存和谈判后的企业价格各不相同
        - 当治理是采购触发点时，固定平台定价可能更具吸引力
      - - Cloudflare AI Gateway
        - 据报道核心网关功能免费；可选统一计费可能增加 5% 积分费
        - 边缘路由、缓存、速率限制、重试、日志和分析
        - 不含套餐存储限制和更广泛的 Cloudflare 成本
        - Cloudflare 已是网络控制平面的场景最具优势
      - - Vercel AI Gateway
        - 据报道每月提供 $5 入门积分，之后按供应商目录价计费且不加 token 价差
        - 多供应商端点、供应商政策、预算、日志和 AI SDK 集成
        - 付费层级和平台依赖需要结合当前合同审查
        - 已部署在 Vercel 上的应用可以低摩擦采用
      - - 直接供应商 API
        - 按供应商收取 token 或容量费用，不收网关费
        - 直接端点和支持关系
        - 集成、故障切换、账单核对和多供应商运营属于内部成本
        - 使用量集中在少数供应商时，经济性可能最佳
    notes: 定价是 2026 年对比来源中的某一时点公开快照，不是报价或客户实际账单。供应商推理费用、税费、企业折扣、基础设施成本和支持条款都可能变化，需要采购核实。
