              指定证据中的公开领导层记录较为有限。Tracxn 将 Alex Atallah 列为联合创始人兼 CEO，Menlo Ventures 称其为连续三次创业者，曾创办 OpenSea。Menlo 还将 Chris
              Clark 列为
              COO，并称其曾两次创办上市公司。这一组合说明团队具备创始人主导的产品和公司建设经验，但证据无法确认董事会构成、独立董事、投票控制、继任规划或更完整的高管梯队。处理企业工作负载的路由中介，关键缺口在于：它需要覆盖安全、财务、合规和供应商关系的治理深度，而不只是创始人与市场的匹配。
