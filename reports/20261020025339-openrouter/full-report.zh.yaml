            title: 广度正变成入场券
            body: OpenRouter 的低摩擦目录仍有价值，但对比来源反复指出，治理、自托管、评测和平台分销才是选择其他网关的理由。
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
          - type: callout
            title: 运营信任可能比目录规模更重要
            body: 围绕支持、计费、速率限制和宕机的公开评价褒贬不一，为提供更强合同、更明确所有权或既有云控制平面的替代方案创造了替代路径。
            calloutType: risk
            claimRefs:
