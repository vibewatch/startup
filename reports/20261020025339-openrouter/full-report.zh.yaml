  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场格局与竞争位置
        blocks:
          - type: paragraph
            body: >-
              买方的替代方案不只是其他托管聚合商，还包括 Portkey 和 Braintrust 这样的托管控制平面、LiteLLM 这样的自托管路由器、Cloudflare 和 Vercel 的平台原生网关、直接供应商
              API，以及内部路由层。独立对比一再将 OpenRouter 的优势概括为低摩擦的广度；当买方更看重治理、数据驻留、评测或基础设施所有权时，替代方案就更有吸引力。OpenRouter 自称覆盖 500+ 个模型和
              80 家供应商；这些数字说明规模，却不能证明供应独特，因为竞争网关也宣传多供应商的重叠访问能力。因此，它更像高效入口，而不是无人挑战的控制平面护城河。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
