  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是应用与模型供应商之间的托管式多模型访问、路由、计费和策略控制。OpenRouter 的目录与公开定位属于网关 /
              控制平面：客户通过一个界面访问不断变化的模型和供应商集合，而底层模型训练和推理供给不在边界内。企业治理、支出控制和用量报告是相邻扩展面，不是独立的模型市场。实际替代方案包括直接接入供应商、自建路由、自托管网关和云供应商网关。这个边界很重要，因为模型支出不会自动变成
              OpenRouter 可获取的收入；只有买方愿意为聚合、路由、可靠性或治理付费的流量和工作流，才属于可服务机会。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.2'
        title: 受证据约束的规模测算与采用信号
        blocks:
          - type: paragraph
            body: >-
              留存来源没有提供可信的全市场收入分母，也没有可比的 TAM/SAM/SOM 系列。因此，现有最强的规模证据是 OpenRouter 自身的运营规模。SiliconANGLE 报道 2026 年 5 月每周处理
              25 trillion tokens、用户超过 8M+；作为投资者且并非独立来源的 Menlo，则称其年化运行速率约为 1.5 quadrillion tokens。截至 10 月访问时，OpenRouter
              首页显示每月 600 trillion tokens 和超过 10M+
              全球用户。这些数字说明采用速度很快，但发行方、日期、期间和计量口径不同，不能视为一条经审计的增长序列。它们证明了品类需求和平台规模，而不是市场收入、OpenRouter 收入或可实现份额。
