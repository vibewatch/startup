  - id: FP001
    title: 按部署控制权与治理深度划分的竞争定位
    type: quadrant
    summary: 基于序数证据的定位显示，OpenRouter 优化的是托管广度；自托管和政策驱动型替代方案则用便利性换取控制权。
    data:
      xAxis:
        label: 部署控制权（1 = 提供商管理，5 = 买方控制）
        min: 1
        max: 5
      yAxis:
        label: 指定证据描述的治理深度（1 = 基础，5 = 全面）
        min: 1
        max: 5
      points:
        - label: OpenRouter
          x: 1
          'y': 4
          detail: 托管广度，并扩展了企业级路由、政策、预算和合规控制。
        - label: Portkey
          x: 3
          'y': 5
          detail: 强调托管治理，并提供可自托管的网关组件。
        - label: LiteLLM
          x: 5
          'y': 4
          detail: 部署控制权最高，治理功能由买方运营。
        - label: Cloudflare AI Gateway
          x: 1
          'y': 4
          detail: 托管边缘网关，提供政策、缓存、速率限制和分析功能。
        - label: Vercel AI Gateway
          x: 1
          'y': 3
          detail: 面向开发者的托管网关，提供预算、日志和提供商政策。
        - label: 直接提供商 API
          x: 5
          'y': 2
          detail: 直接控制端点，但跨提供商治理需要买方自行搭建。
    approximationNotes: 坐标是分析师根据指定来源编制的序数评分，不是实测基准。比较范围仅限部署归属和来源描述的控制平面广度；相差 1 分不代表量化的性能差距。
