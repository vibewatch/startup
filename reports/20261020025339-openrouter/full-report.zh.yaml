  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现机制
        blocks:
          - type: paragraph
            body: >
              OpenRouter 采用预付额度模式：客户创建账户、购买额度，并用一个 API key 访问整个目录。独立评测一致将供应商 token 价格描述为转嫁价，并指出自助服务的主要变现方式是对大多数额度购买收取
              5.5%
              费用，而不是把加价嵌入模型费率。企业合同通过定制费率折扣、开票、用量承诺、年度预付、支持和服务级别条款，形成第二条商业路径。自带密钥用量在达到传闻中的月度免收费阈值后，又提供了一个收费面。这些机制容易理解，但公开价目条款没有披露企业实际折扣、退款、额度失效、供应商返利或收入确认。
