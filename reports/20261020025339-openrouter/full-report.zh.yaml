  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与交易背景
        blocks:
          - type: paragraph
            body: >-
              两个独立二手来源将 OpenRouter 2026 年 5 月 B 轮金额定为 $113 million，投后估值约 $1.3 billion；FundedIQ 则记录两轮已披露融资共筹得 $153
              million。指定证据随后从融资估值转向一笔被报道的战略交易：Seonib、TechTimes 和 University 365 描述 8 月达成协议，由 Stripe 以超过 $7 billion 收购
              OpenRouter。这将比 5 月估值高出五倍以上，但不能作为干净的独立估值可比项。TechTimes 还报道 Stripe
              拒绝官方确认，最终价格可能变化。在缺少最终文件、交割条件、对价构成、持股比例、清算优先权或老股细节的情况下，无论融资轮次还是传闻交易，都无法揭示新老股东的回报。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV010
              - CV016
      - number: '8.2'
        title: 正向论点、反向论点与战略溢价
        blocks:
          - type: paragraph
            body: >-
              估值正向论点是规模加战略位置。OpenRouter 首页目前显示每月 token 超过 600 trillion、全球用户超过 1,000 万、80+ 家供应商和 500+ 个模型；University 365
              另行报告了 500+ 模型和 80+ 供应商的广度。即使底层模型变化，这种运营规模也能让中立的路由与计费层具备战略价值。反向论点是流量不等于收入，已披露融资不等于可用现金，5.5%
              的额度购买费也不能证明毛利率或持久留存。独立评测还指出路由不透明、缺乏自托管，以及支持或计费投诉。因此，传闻收购溢价更像控制权位置的价格，而不是金融投资者应将同一倍数套用于当前运营表现的证据。
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
              - CV013
              - CV016
      - number: '8.3'
        title: 情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于公开输入不支持传统收入倍数模型，情景框架必须继续由事件驱动。乐观情景下，交易以接近或高于被报道的 $7 billion
              对价完成，验证战略稀缺性；但持有人回报仍取决于入场价格、稀释和优先权。基准情景下，协议存在，但价格、结构、时间和交割确定性仍需确认；从 5
              月融资估值到传闻交易的可观察区间只是参考区间，不是公允价值。悲观情景下，传闻交易大幅变更或失败，留下缺乏经审计收入、利润率、留存或现金支持的 $1.3 billion
              融资估值。在取得所有权和交易文件前，任何目标回报或持有期 IRR 都缺乏依据。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
      - number: '8.4'
        title: 建议、退出准备度与尽调触发条件
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等、风险高，独立估值立场未知。被报道的战略兴趣说明存在退出准备度，但公开报道不能替代已签署协议、董事会和股东批准、监管条件及交割时间表。第一项尽调要求是已执行交易文件包和股权结构表；第二项是月度收入、净收入留存、毛利率、供应商集中度、客户集中度、现金和烧钱。若按传闻对价附近的现金交易得到确认，观点将转向兑现分析。价格大幅下调、交割失败、token
              用量恶化、供应商中立性丧失，或证据表明支持与计费问题损害留存，都会使论点失效。
            claimRefs:
              - CV005
              - CV006
              - CV013
              - CV016
