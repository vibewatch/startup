      - number: '3.2'
        title: 能力、部署与信任取舍
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的企业产品补上了几个历史缺口：它宣传模型和供应商白名单、零数据留存路由、区域控制、预算、回退、SSO、SCIM、DPA 和 SOC 2 Type
              II。这些是公司发布的声明，而非独立基准，因此采购方应核实范围和合同适用性。Portkey 主打托管式护栏与策略；LiteLLM 强调自托管和运营者控制；Cloudflare 与 Vercel
              把网关嵌入既有部署生态；直接 API
              则以增加集成工作为代价，换取最大的端点控制。这使合规姿态和运营所有权比模型数量更能拉开差异。指定兼容性页面没有产生可用的应用层文本，因此除公司笼统声明之外的集成广度在此仍未验证。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
      - number: '3.3'
        title: 定价、分销与切换
        blocks:
          - type: paragraph
            body: >-
              公开对比将 OpenRouter 描述为转嫁供应商 token 价格，并对购买额度收取 5.5%
              费用，同时另有自带密钥条款。自托管软件可以省掉网关费，但会换来基础设施、数据库、扩展、打补丁和事故响应工作。平台原生网关可以借助既有的 Cloudflare 或 Vercel 账户边界获胜；直接 API
              则去掉路由中介，却会增加凭据、计费关系和回退逻辑。在保留 OpenAI
              兼容接口的情况下，这些模式意味着代码层切换成本不高；但一旦策略、日志、预算和路由规则嵌入流程，运营切换成本可能很高。指定证据没有披露企业实际折扣、迁移工作量或多平台并用行为。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              目录广度容易商品化，因为多个网关都通过兼容 API 暴露规模大且彼此重叠的目录。OpenRouter
              更难替代的部分，是聚合需求、供应商路由、统一计费、运营遥测和企业策略控制的组合；但指定来源没有量化留存、独家供应商访问、路由带来的提升或客户集中度。反向证据来自运营端：独立评测显示公开评价褒贬不一，投诉集中在支持、计费、速率限制和宕机。传闻中的
              Stripe 收购或能扩大分销和采购触达，但同一报告称产品保持不变；当前证据不足以评估整合收益。因此，核心替代风险不是出现更大的目录，而是随着规模和合规要求上升，买方转向自托管控制、云原生网关或直接供应商关系。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP010
              - CP011
              - CP013
              - CP016
