  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Stripe 交易以接近或高于报道中的 $7B+ 对价完成交割。
        - 战略兑现压过独立估值倍数，但持有人回报仍取决于入场价格、稀释和优先权。
        - 价格调整、非现金对价、优先权负担或交割延迟。
        - 已签署协议、监管批准和有资金保障的交割安排。
      - - 基准
        - 协议确实存在，但公开条款仍不完整或可能变化。
        - $1.3B 至报道中的 $7B+ 是事件参考区间，不是公允价值区间，也不是目标回报。
        - 交易结构、所有权、条件和收入质量均未验证。
        - 直接确认，加上交易文件和经审计的运营指标。
      - - 悲观
        - 报道中的交易发生重大变化，或最终未能交割。
        - 没有可辩护的公开估值下限；5 月的 $1.3B 估值缺少已披露的利润率、留存、现金和集中度支持。
        - 倍数压缩、对路由中立性的担忧、竞争和运营投诉。
        - 对价降低、交割失败、使用量走弱或客户留存受损。
    notes: 情景均为有条件判断；由于缺少资本结构表、优先权、现金流和交易数据，刻意不赋予概率或精确 IRR。
    claimRefs:
