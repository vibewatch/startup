            - 客户评估与业务逻辑
          detail: 客户仍需负责模型选择和输出验证。
        - label: SDK 与集成层
          items:
            - TypeScript SDK
            - Python SDK
            - Go SDK
            - Agent 与 Vercel AI 集成
          detail: 公开代码库提供多个受支持的接入入口。
        - label: 标准化 API 合同
          items:
            - 兼容 OpenAI 的请求
            - 标准化响应
            - OpenAPI 规范
          detail: 对于模型特有功能，仍需测试兼容性。
        - label: 政策与提供商路由
          items:
            - 提供商选择
            - 回退机制
            - 成本与延迟偏好
            - 数据政策控制
          detail: 路由质量是核心，但外部无法独立观察。
        - label: 提供商与模型执行
          items:
            - 多个上游提供商
            - 前沿模型与开放权重模型
            - 提供商特定的容量与留存
          detail: 上游可用性和政策仍是外部依赖。
        - label: 治理与运营
          items:
            - 用量遥测
            - 统一计费
            - API 密钥控制
            - 支持与事故响应
          detail: 服务水平、审计范围和支持表现属于私下尽调事项。
    approximationNotes: 层级顺序反映可观察的客户工作流，而不是未披露的内部部署拓扑；数量和上游可用性会随时间变化。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE008
      - CE010
      - CE014
  - id: FU001
    title: 从试验到受治理企业使用的客户采用路径
    type: journey-map
    summary: 公开证据支持一条合理的采用路径，但各阶段之间的转化和留存仍未披露。
    data:
      nodes:
        - id: discover
          label: 发现模型
          detail: 开发者比较模型质量、价格和可用性。
          touchpoints:
            - Public model catalog
            - Single API key
        - id: prototype
          label: 制作原型
          detail: 初创企业和产品团队接入兼容 OpenAI 的端点。
          touchpoints:
            - Unified API
            - Consolidated billing
        - id: deploy
          label: 部署工作负载
          detail: 应用为生产流量增加提供商和模型回退。
          touchpoints:
            - Routing
            - Failover
        - id: organize
          label: 组织团队
          detail: 工作区、密钥和成员级控制支持更广泛的内部使用。
          touchpoints:
            - Usage reporting
            - Budget alerts
        - id: govern
          label: 治理企业使用
          detail: 安全、财务、采购和法务实施组织级政策。
          touchpoints:
            - Identity and data controls
            - Contract and invoicing
        - id: expand
          label: 扩展工作负载
          detail: 团队可以增加模型、提供商、应用和私有容量。
          touchpoints:
            - Price-aware routing
            - Private endpoints
    approximationNotes: 该概念序列基于已披露的产品界面和客户适配描述；节点顺序不是实测漏斗，也没有可用的转化率、阶段人数或留存率。
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU015
  - id: FR001
    title: 定性剩余风险热力图
    type: matrix
    summary: 治理和网关集中度的风险高于单个提供商故障，因为网关同时掌握路由、政策、遥测和计费控制。
    data:
      columns:
        - 影响
        - 可能性
        - 缓解措施成熟度
      rows:
        - label: 网关集中度
          values:
            - 高
            - 中
            - 部分
        - label: 数据治理与中立性
          values:
            - 高
            - 中
            - 部分
        - label: 提供商中断与路由失败
          values:
            - 高
            - 中
            - 已记录
        - label: 计费与支持失败
          values:
            - 高
            - 中
            - 部分
        - label: 收购交割与整合
          values:
            - 高
            - 中
            - 早期
        - label: 平台费与利润率压力
          values:
            - 中
            - 中
            - 有限
    approximationNotes: 序数标签是分析师基于引用证据作出的判断，不是概率，也不是独立测量的控制评分。
    claimRefs:
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开规模和战略兴趣支持继续关注，但未经验证的经济性和交易条款使推荐仍停留在“继续研究”。
    data:
      nodes:
        - id: scale
          label: 规模
          value: 600T+ monthly tokens; 10M+ users
          detail: 公司展示的运营量和覆盖范围，不是收入。
        - id: breadth
          label: 产品广度
          value: 500+ models; 80+ providers
          detail: 支持战略控制平面论点。
        - id: financing
          label: 融资锚点
          value: $113M Series B at about $1.3B post-money
          detail: 2026 年 5 月私募轮参考值。
        - id: transaction
          label: 报道中的退出
          value: $7B+ Stripe agreement
          detail: 二手报道；现有材料没有最终条款。
        - id: risk-filter
          label: 风险筛选
          value: Economics, terms, ownership, and retention unresolved
          detail: 运营投诉和路由不透明增加下行风险。
        - id: recommendation
          label: 推荐
          value: Research more
          detail: 在给入场价格之前，先核实交易和经审计的经济性。
    approximationNotes: 该顺序是分析性的，而非按价值比例排列；融资和交易的标题数值对应不同事件。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV011
      - CV013
      - CV016
