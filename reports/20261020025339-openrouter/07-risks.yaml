schemaVersion: "report-v2"
artifact: risks
slug: openrouter
runDate: "2026-10-20"
company:
  name: OpenRouter
chapter:
  number: 7
  title: Risks
  summary: >-
    OpenRouter's principal residual risk is concentration: a closed, hosted gateway sits
    between customers and hundreds of models while enforcing routing, privacy, and billing
    policy, and it is also subject to a reported but not-yet-confirmed-closing change of
    control. Documented enterprise controls mitigate parts of that exposure, but public
    evidence does not quantify incident frequency, provider concentration, or control
    effectiveness.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The most consequential exposure is not any single model failure; it is the concentration
      of routing, data-policy enforcement, usage accounting, and vendor settlement in one
      closed hosted gateway during a pending change-of-control process. That concentration
      makes governance and operational failures mutually reinforcing: a routing defect can
      become a privacy, cost, or availability event, while an ownership change can alter the
      incentives governing route neutrality. OpenRouter reports enterprise-scale reach of
      10 million global users, 80-plus providers, and 500-plus models, so failures at the
      control plane could have broad blast radius. The heatmap therefore rates residual
      exposure qualitatively rather than implying measured incident probabilities that the
      available public file does not support.
    claimRefs: [CR009, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-and-data-governance
    title: Regulatory, legal, and data-governance exposure
    body: >-
      The proposed Stripe transaction adds closing, integration, neutrality, and data-purpose
      questions. One secondary report described a price above $7 billion and cited material
      Chinese-origin model usage among U.S. enterprise traffic, but another analysis emphasized
      that the official announcements did not disclose price and that the agreement remained
      subject to closing conditions. Those distinctions matter: deal value is reported, not
      confirmed, and an agreement is not a completed acquisition. OpenRouter advertises zero
      data retention, region controls, a DPA, and SOC 2 Type II, yet the pool contains no
      independent control report or regulator record testing those controls. Until diligence
      obtains those materials, privacy and neutrality mitigations should be treated as
      documented product commitments rather than independently verified effectiveness.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR010]
    tableRefs: [TR001]
  - id: operational-quality-and-security
    title: Operational, quality, and security exposure
    body: >-
      OpenRouter says it retries requests across providers or models when a provider is down or
      rate-limited and charges nothing for failed or empty completions. That is a meaningful
      design mitigation, but independent reviews identify the other side of the abstraction:
      routing decisions can be hard to audit, model identifiers and prices can change, and
      public complaints cluster around billing, support, rate limits, and outages. These
      signals are not an audited incident dataset and should not be converted into a failure
      rate. The investable conclusion is narrower: production underwriting requires exported
      route logs, incident histories, recovery objectives, billing-reconciliation samples, and
      evidence that privacy rules survive every fallback path.
    claimRefs: [CR007, CR011, CR012, CR013, CR016]
    tableRefs: [TR002]
  - id: dependencies-mitigation-and-kill-criteria
    title: Dependencies, mitigations, and thesis-break criteria
    body: >-
      OpenRouter reduces dependence on any one model provider but increases dependence on the
      gateway itself. The enterprise proposition consolidates many models behind one contract,
      invoice, security policy, and support relationship; the proposed Stripe ownership adds a
      second concentration point around payments and financial telemetry. The platform fee also
      scales with usage, while public evidence does not disclose provider concentration or the
      economics of high-volume enterprise accounts. Mitigation should therefore be tested, not
      assumed: customers need exportable routing evidence, fixed-provider and no-fallback modes,
      tested direct-provider escape paths, reconciled invoices, and contractual data boundaries.
      Thesis-break triggers include unexplained route bias, repeated unreconciled billing events,
      failure to evidence control effectiveness, or closing terms that materially weaken
      portability and neutrality.
    claimRefs: [CR003, CR005, CR008, CR013, CR014, CR015]
    tableRefs: [TR003]
