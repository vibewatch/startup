  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: incident-frequency
      missingEvidence: Audited outage, fallback-failure, billing-error, and recovery-time metrics with a defined request denominator.
      whyItMatters: Without a denominator, public complaints and company reliability claims cannot support a measured likelihood estimate.
      diligencePath: Obtain 24 months of incident logs, status history, support tickets, invoice corrections, and SLA reports; reconcile samples to route telemetry.
      relatedQuestionRefs: [QR004, QR010]
      relatedTableRefs: [TR002]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-register
      missingEvidence: Independent control reports, regulator searches, litigation searches, executed transaction documents, and jurisdiction-specific legal analysis.
      whyItMatters: The public pool documents product controls and reported deal status but cannot establish exhaustive legal exposure or control effectiveness.
      diligencePath: Review the SOC 2 report, DPA and subprocessor list, legal docket searches, regulator correspondence, merger terms, and closing conditions.
      relatedQuestionRefs: [QR002, QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: vendor-concentration
      missingEvidence: Provider traffic shares, customer revenue concentration, direct-provider escape testing, and contractual portability rights.
      whyItMatters: Provider breadth does not show whether traffic, gross profit, or customer dependence is diversified.
      diligencePath: Obtain monthly route-share and gross-profit cohorts by provider and customer, then execute direct-provider failover and data-export tests.
      relatedQuestionRefs: [QR005, QR008]
      relatedTableRefs: [TR003]
    - type: access-blocked
      severity: minor
      topic: source-access-gap
      missingEvidence: Substantive rendered text from the prefetched Developers Digest review.
      whyItMatters: The successful HTTP response exposed only navigation text, so the page cannot support a risk claim.
      diligencePath: Use an already eligible alternate source in a later bounded repair or obtain an accessible archived copy outside this worker.
