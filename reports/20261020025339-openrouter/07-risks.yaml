  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved evidence
    rows:
      - - Upstream provider outage or rate limit
        - Medium
        - High
        - "Documented: automated provider/model fallback and no charge for failed or empty completions"
        - Medium
        - "Audited uptime, recovery objectives, fallback success rate, and correlated-provider failure tests"
      - - Billing, credit, or usage-ledger discrepancy
        - Medium
        - High
        - "Partial: budgets, alerts, usage reporting, and invoicing are advertised"
        - Medium-high
        - "Reconciliation samples, dispute aging, credit safeguards, and quantified incident history"
      - - Opaque or unintended route selection
        - Medium
        - High for regulated workloads
        - "Partial: provider controls and post-request telemetry exist"
        - Medium-high
        - "Pre-request determinism, route-decision audit trails, policy exception logs, and control testing"
      - - Model identifier or price change breaks production behavior
        - Medium
        - Medium
        - "Partial: broad catalog and centralized routing simplify changes but also centralize them"
        - Medium
        - "Versioning policy, deprecation notice periods, canary process, and customer migration metrics"
    notes: >-
      Severity ordering combines company-described mitigations with independent review signals;
      no public incident denominator was available, so likelihood labels are qualitative.
    claimRefs: [CR006, CR007, CR010, CR011, CR012, CR013, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Model and inference-provider supply
        - "80+ providers and 500+ models claimed by OpenRouter"
        - Breadth is disclosed; traffic concentration by provider is not
        - "Correlated outage, policy change, capacity shortage, or provider removal"
        - High
        - "Fallbacks reduce single-provider risk; residual concentration requires route-share data and stress tests"
      - - Hosted gateway and routing code
        - OpenRouter
        - "Closed service; independent review says it cannot be self-hosted or directly audited"
        - "Gateway outage, route bias, policy defect, or loss of auditability"
        - High
        - "Contractual SLA, exportable logs, direct-provider escape path; residual medium-high"
      - - Billing, tax, fraud, and prospective ownership
        - Stripe
        - "One contract and invoice are a convenience and a concentration point"
        - "Closing delay, integration defect, financial-data commingling, or changed commercial incentives"
        - High
        - "Data-purpose separation, reconciliation controls, portability, and closing covenants; residual high"
      - - Customer support and service recovery
        - OpenRouter support organization
        - "Independent review describes slow support and billing responses"
        - "Production issue persists without timely escalation or credit resolution"
        - Medium-high
        - "Named enterprise engineer and priority support are advertised; verify response history and remedies"
    notes: >-
      Concentration fields distinguish disclosed breadth from undisclosed traffic and revenue
      concentration; null quantitative concentration is treated as a diligence gap, not zero.
    claimRefs: [CR003, CR007, CR008, CR009, CR011, CR013, CR014]
