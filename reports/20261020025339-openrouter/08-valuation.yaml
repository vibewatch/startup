  evidenceGaps:
    - type: missing-source
      severity: material
      topic: acquisition-certainty
      missingEvidence: Executed acquisition agreement, consideration schedule, closing conditions, approvals, and current closing status.
      whyItMatters: The reported transaction is the dominant valuation event, but secondary reporting cannot establish realizable proceeds.
      diligencePath: Obtain the signed agreement, board materials, shareholder notices, regulatory filings, and a current closing checklist.
      relatedQuestionRefs: [QV003, QV007, QV008]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Audited revenue, ARR where applicable, gross margin, net revenue retention, provider concentration, customer concentration, cash, and burn.
      whyItMatters: Traffic volume and a platform fee do not establish durable revenue quality, profitability, or downside support.
      diligencePath: Review monthly financial statements, cohort retention, contribution margin by provider and customer, bank statements, and the operating plan.
      relatedQuestionRefs: [QV005, QV007, QV008]
      relatedTableRefs: [TV002, TV003]
    - type: private-evidence-only
      severity: material
      topic: ownership-and-preferences
      missingEvidence: Fully diluted cap table, option pool, liquidation preferences, participation rights, debt, secondary sales, and investor entry prices.
      whyItMatters: Enterprise value or headline consideration cannot be converted into holder returns without the ownership waterfall.
      diligencePath: Obtain the cap table, charter, financing documents, debt schedule, option grants, and transaction waterfall.
      relatedQuestionRefs: [QV001, QV008]
      relatedTableRefs: [TV001, TV003]
    - type: missing-source
      severity: minor
      topic: comparable-set
      missingEvidence: Auditable public-company, private-round, and M&A comparables with consistent revenue and margin denominators.
      whyItMatters: The two observed OpenRouter event values do not constitute a market multiple set.
      diligencePath: Build a banker-quality comparable set after receiving normalized revenue, gross profit, and growth metrics.
      relatedQuestionRefs: [QV004, QV007]
      relatedTableRefs: [TV003]
