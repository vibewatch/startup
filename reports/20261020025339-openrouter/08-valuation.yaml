company:
  name: OpenRouter
chapter:
  number: 8
  title: Valuation
  summary: >-
    OpenRouter's May 2026 financing established a roughly $1.3 billion post-money
    reference, while multiple secondary sources report an August agreement for
    Stripe to acquire the company for more than $7 billion. The strategic premium
    may be plausible given current usage scale, but the assigned public evidence
    does not establish definitive transaction terms, recurring revenue quality,
    margins, retention, ownership, or preferences; the recommendation is therefore
    research-more rather than underwriting either headline as investable fair value.
sections:
  - id: financing-and-transaction-context
    title: Financing and transaction context
    body: >-
      Two independent secondary sources place OpenRouter's May 2026 Series B at
      $113 million and the post-money valuation at roughly $1.3 billion, while
      FundedIQ records $153 million raised across two disclosed rounds. The assigned
      evidence then shifts from a financing mark to a reported strategic transaction:
      Seonib, TechTimes, and University 365 describe an August agreement for Stripe
      to acquire OpenRouter for more than $7 billion. That would exceed the May mark
      by more than five times, but it is not a clean standalone valuation comparable.
      TechTimes also reports that Stripe declined official confirmation and that the
      final price could change. Without definitive documents, closing conditions,
      consideration mix, ownership, liquidation preferences, or secondary details,
      neither the round nor the reported deal reveals the return to a new or existing
      shareholder.
    claimRefs: [CV001, CV002, CV005, CV006, CV007]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and strategic premium
    body: >-
      The valuation thesis is scale plus strategic position. OpenRouter's homepage
      currently displays more than 600 trillion monthly tokens, more than 10 million
      global users, 80-plus providers, and 500-plus models; University 365 separately
      reports the 500-plus-model and 80-plus-provider breadth. That operating scale
      can make a neutral routing and billing layer strategically valuable even when
      the underlying models change. The anti-thesis is that traffic is not revenue,
      disclosed funding is not cash available, and a 5.5% credit-purchase fee does
      not establish gross margin or durable retention. Independent reviews also flag
      opaque routing, lack of self-hosting, and support or billing complaints. The
      reported acquisition premium therefore reads as a control-position price, not
      evidence that a financial investor should apply the same multiple to current
      operating performance.
    claimRefs: [CV003, CV004, CV010, CV011, CV012, CV013, CV015]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-entry-discipline
    title: Scenarios and entry discipline
    body: >-
      The scenario frame must remain event-driven because public inputs do not support
      a conventional revenue-multiple model. In the bull case, a transaction closes
      near or above the reported $7 billion consideration and validates strategic
      scarcity, although holder returns still depend on entry price, dilution, and
      preferences. In the base case, an agreement exists but price, structure, timing,
      and closing certainty require confirmation; the observable range from the May
      financing mark to the reported deal is a reference interval, not fair value.
      In the bear case, the reported deal changes materially or fails, leaving the
      $1.3 billion financing mark without audited revenue, margin, retention, or cash
      support. No target return or holding-period IRR is defensible until ownership
      and transaction documents are available.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV009, CV014, CV015]
    tableRefs: [TV003]
  - id: recommendation-exit-and-diligence
    title: Recommendation, exit readiness, and diligence triggers
    body: >-
      The recommendation is research-more with medium confidence, high risk, and an
      unknown standalone valuation stance. Reported strategic interest suggests exit
      readiness, but public reporting is not a substitute for a signed agreement,
      board and shareholder approvals, regulatory conditions, and a closing schedule.
      The first diligence request is the executed transaction package and cap table;
      the second is monthly revenue, net revenue retention, gross margin, provider
      concentration, customer concentration, cash, and burn. A confirmed cash closing
      near the reported consideration would move the view toward realization analysis.
      A material price reduction, failed closing, deterioration in token volume, loss
      of provider neutrality, or evidence that support and billing problems impair
      retention would break the thesis.
    claimRefs: [CV005, CV006, CV013, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Research more, "Financing is corroborated; transaction terms and operating economics are not.", "Do not underwrite a new entry from headline values alone."]
      - [Confidence, Medium, "Several independent sources agree on the main events, but the pool lacks definitive transaction documents.", "Treat the conclusion as conditional on document diligence."]
      - [Risk rating, High, "Deal certainty, ownership economics, margin, retention, and concentration are unresolved.", "Require downside protection and explicit kill criteria."]
      - [Valuation stance, "Unknown / event-driven", "The $1.3B financing mark and reported $7B+ consideration measure different events.", "Do not present their interval as a standalone fair-value range."]
      - [Exit posture, "Reported strategic agreement", "Secondary sources describe a Stripe agreement; one source also says official confirmation was declined.", "Verify signing, consideration, conditions, and closing before assigning proceeds."]
    notes: >-
      Assessments use only the assigned public evidence as of 2026-10-20; reported
      transaction consideration is conditional and is not treated as cash received.
    claimRefs: [CV001, CV005, CV006, CV010, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Public evidence, What would change the view]
    rows:
      - [Thesis, "Scaled multi-model control plane", "Officially displayed 600T+ monthly tokens, 10M+ users, 80+ providers, and 500+ models.", "Sustained scale with audited monetization would strengthen the thesis."]
      - [Thesis, "Strategic scarcity", "Reported consideration exceeds the May financing mark by more than five times.", "A signed and closed transaction would validate the strategic premium."]
      - [Anti-thesis, "Economics remain opaque", "A 5.5% credit fee is reported, but round coverage says take rate and revenue were not disclosed.", "Audited revenue, gross margin, retention, and cash conversion are required."]
      - [Anti-thesis, "Governance and operating friction", "Reviews cite opaque routing, no self-hosting, and support or billing complaints.", "Transparent routing governance and improving retention evidence would reduce risk."]
    notes: >-
      The table separates company-displayed scale from third-party interpretation;
      none of the operating figures is treated as audited revenue.
    claimRefs: [CV003, CV007, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Stripe transaction closes near or above the reported $7B+ consideration.", "Strategic realization dominates standalone multiples; holder return still depends on entry, dilution, and preferences.", "Price adjustment, non-cash consideration, preference overhang, or delayed closing.", "Executed agreement, regulatory clearance, and a funded closing schedule."]
      - [Base, "An agreement exists, but public terms remain incomplete or mutable.", "$1.3B to reported $7B+ is an event-reference interval, not a fair-value range or target return.", "Unverified structure, ownership, conditions, and revenue quality.", "Direct confirmation plus transaction documents and audited operating metrics."]
      - [Bear, "The reported transaction changes materially or does not close.", "No defensible public floor; the May $1.3B mark lacks disclosed margin, retention, cash, and concentration support.", "Multiple compression, routing neutrality concerns, competition, and operating complaints.", "Lower consideration, failed closing, weaker usage, or impaired customer retention."]
    notes: >-
      Scenarios are conditional and intentionally avoid assigning probabilities or
      precise IRRs because cap-table, preference, cash-flow, and transaction data are absent.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV009, CV014, CV015]
figures:
