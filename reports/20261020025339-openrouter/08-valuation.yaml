    title: Recommendation logic
    type: flow
    summary: >-
      Public scale and strategic interest support relevance, but unverified economics
      and transaction terms keep the recommendation at research-more.
    data:
      nodes:
        - id: scale
          label: Scale
          value: "600T+ monthly tokens; 10M+ users"
          detail: "Company-displayed operating volume and reach, not revenue."
        - id: breadth
          label: Product breadth
          value: "500+ models; 80+ providers"
          detail: "Supports the strategic control-plane thesis."
        - id: financing
          label: Financing anchor
          value: "$113M Series B at about $1.3B post-money"
          detail: "May 2026 private-round reference."
        - id: transaction
          label: Reported exit
          value: "$7B+ Stripe agreement"
          detail: "Secondary reporting; definitive terms were not available in the pool."
        - id: risk-filter
          label: Risk filter
          value: "Economics, terms, ownership, and retention unresolved"
          detail: "Operational complaints and routing opacity add downside risk."
        - id: recommendation
          label: Recommendation
          value: Research more
          detail: "Verify the transaction and audited economics before pricing an entry."
    approximationNotes: >-
      The sequence is analytical rather than value-proportional; headline financing
      and transaction values describe different events.
    claimRefs: [CV001, CV004, CV006, CV011, CV013, CV016]
