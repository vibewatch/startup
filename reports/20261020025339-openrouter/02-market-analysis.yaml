schemaVersion: "report-v2"
artifact: market-analysis
slug: openrouter
runDate: 2026-10-20
company:
  name: OpenRouter
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    OpenRouter competes in the hosted multi-model gateway and inference-routing layer, not in
    model development itself. Public evidence shows strong platform-level demand signals, but
    it does not expose a defensible market-wide TAM, SAM, or attainable-share denominator.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is hosted multi-model access, routing, billing, and policy control
      between applications and model providers. OpenRouter's catalog and public positioning
      place it in a gateway/control-plane category: customers use one interface to reach a
      changing set of models and providers, while the underlying model training and inference
      supply remain outside the boundary. Enterprise governance, spend controls, and usage
      reporting are adjacent expansion surfaces rather than a separate model market. The
      practical substitutes are direct provider integrations, self-built routing, self-hosted
      gateways, and cloud-provider gateways. This boundary matters because model spending is
      not automatically OpenRouter-addressable revenue; only traffic and workflows for which
      buyers value aggregation, routing, reliability, or governance belong in the serviceable
      opportunity.
    claimRefs: [CM001, CM002, CM003, CM009, CM010, CM012, CM016]
    tableRefs: [TM001]
  - id: sizing-evidence
    title: Evidence-constrained sizing and adoption signals
    body: >-
      No retained source supplies a credible market-wide revenue denominator or a comparable
      TAM/SAM/SOM series. The strongest available sizing evidence is therefore operating-scale
      evidence for OpenRouter itself. SiliconANGLE reported 25 trillion tokens per week and
      more than 8 million users in May 2026; Menlo, an investor and therefore not independent,
      described an approximately 1.5 quadrillion-token annual run rate. By the October access
      date, OpenRouter's homepage displayed 600 trillion monthly tokens and more than 10 million
      global users. These figures indicate rapid adoption, but different issuers, dates,
      periods, and measurement conventions prevent treating them as one audited growth series.
      They establish category pull and platform scale, not market revenue, OpenRouter revenue,
      or attainable share.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyers, users, payers, and adoption path
    body: >-
      Developers are the initial users because a unified endpoint reduces repeated integration
      work when testing or switching models. For AI-native product teams, the economic buyer is
      more likely an engineering or platform leader seeking faster model selection, failover,
      and consolidated usage visibility. At larger enterprises, budget ownership can span AI
      platform, cloud infrastructure, FinOps, security, and procurement; the evidence confirms
      the control features but does not identify a universal budget owner. Adoption typically
      starts with model experimentation or application integration, then expands when traffic
      volume makes reliability, policy enforcement, and cost governance material. Regulated or
      contract-heavy deployments may instead prefer direct providers or cloud gateways with
      clearer contractual control.
    claimRefs: [CM001, CM009, CM010, CM012, CM016]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Model proliferation and high token consumption create demand for a neutral routing layer:
      SiliconANGLE cited a Deloitte study saying 67% of enterprises already compute almost one
      billion tokens per month, while OpenRouter's catalog spans hundreds of models. The same
      dynamics also create risk. IBM argues that gateways can become commoditized as rivals and
      open-source projects multiply. Independent reviews identify opaque routing, platform fees,
      support and billing complaints, and limited self-hosting or contract control as barriers
      at scale. For valuation, usage growth is supportive only if OpenRouter converts routed
      volume into durable economics without losing large or regulated workloads to direct,
      self-hosted, or cloud-provider alternatives. Public sources do not disclose market-wide
      spend, customer concentration, take rate, or conversion by buyer segment.
    claimRefs: [CM002, CM003, CM011, CM013, CM014, CM015, CM016]
callouts:
  - calloutType: risk
    title: Public evidence does not support a market-wide TAM
    body: >-
      The retained evidence measures OpenRouter usage, catalog breadth, and selected enterprise
      behavior. It does not disclose the revenue pool addressable by a gateway, the portion that
      will remain multi-model, or the share buyers will outsource rather than build internally.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM011]
