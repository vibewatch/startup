      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Annualized revenue", "Approximately $140M estimate relayed from Sacra", "Low", "Provides a directional scale marker only", "Obtain audited revenue and reconcile the estimate to recognized revenue"]
      - ["Gross margin", null, "Unavailable", "Tests whether fee income covers provider, payment, routing, and support costs", "Provide monthly gross margin and contribution margin by segment"]
      - ["CAC and payback", null, "Unavailable", "Determines whether apparent lean sales motion scales economically", "Provide fully loaded CAC, sales cycle, payback, and channel economics"]
      - ["Cash, burn, and runway", null, "Unavailable", "Determines capital adequacy and financing dependency", "Provide current cash, monthly net burn, debt, commitments, and downside runway"]
    notes: Null means the metric was not disclosed in the retained public evidence; the revenue value is an unaudited third-party estimate, not ARR or cash.
    claimRefs: [CI008, CI014, CI015, CI016]
