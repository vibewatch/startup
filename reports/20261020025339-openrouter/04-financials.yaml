          label: Customer
          detail: Developer or organization funds an account.
        - id: purchase
          label: Credit purchase
          detail: Customer prepays a shared balance.
        - id: platform-fee
          label: Platform fee
          detail: Reviews report 5.5% on most self-serve credit purchases.
        - id: usable-credit
          label: Usable credits
          detail: Balance is available across models and providers.
        - id: routed-inference
          label: Routed inference
          detail: Requests consume credits at reported provider list prices.
        - id: enterprise-layer
          label: Enterprise layer
          detail: Custom discounts, invoicing, commitments, support, and SLAs modify list mechanics.
      edges:
        - from: customer
          to: purchase
          label: prepays
        - from: purchase
          to: platform-fee
          label: fee assessed
        - from: platform-fee
          to: usable-credit
          label: remaining balance
