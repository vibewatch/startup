company:
  name: OpenRouter
chapter:
  number: 4
  title: Financials
  summary: OpenRouter has a visible transaction-fee model and strong company-reported usage, but the public file does not disclose gross margin, customer concentration, cash, burn, or runway. The financial case therefore rests on scale signals and pricing mechanics rather than auditable revenue quality or capital adequacy.
sections:
  - id: monetization-mechanics
    title: Monetization mechanics
    body: |
      OpenRouter uses a prepaid-credit model: customers create an account, buy credits, and use one API key across the catalog. Independent reviews consistently describe provider token prices as pass-through and identify the principal self-serve monetization as a 5.5% fee on most credit purchases, rather than a markup embedded in model rates. Enterprise contracts introduce a second commercial path through custom fee discounts, invoicing, volume commitments, annual prepayment, support, and service-level terms. Bring-your-own-key usage provides another fee surface after a reported monthly waiver threshold. These mechanics are understandable, but published list terms do not reveal realized enterprise discounts, refunds, credit breakage, provider rebates, or revenue recognition.
    claimRefs: [CI004, CI005, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency proxies
    body: |
      OpenRouter's current homepage reports 600 trillion monthly tokens, 10 million global users, more than 500 models, and more than 80 providers. CapitalG separately says weekly volume exceeded 25 trillion tokens and grew fivefold over six months. These are strong throughput and reach indicators, but neither source supplies paying-customer count, revenue retention, cohort conversion, or customer concentration. A homepage case headline says the company operates with a five-person sales team, which is a useful lean-GTM signal but not a CAC or payback calculation. The volume measures also use different periods and should not be converted into revenue without model mix, provider cost, free traffic, and effective fee data.
    claimRefs: [CI001, CI002, CI003, CI009, CI015]
    tableRefs: [TI002]
  - id: unit-economics-and-margin-visibility
    title: Unit economics and margin visibility
    body: |
      One secondary analysis relays Sacra's estimate of approximately $140 million in annualized revenue, but the retained evidence does not provide audited revenue, ARR, or a reconciliation to token volume. The 5.5% purchase fee establishes a potential take rate on self-serve credits, not gross margin: provider payment timing, processor fees, support, routing infrastructure, credits, enterprise discounts, and free traffic remain unknown. Pricing pressure is credible because competitor-authored comparisons market no-fee or self-hosted alternatives, while independent reviews warn that a percentage fee becomes material at scale. Billing and support complaints add collection, refund, and retention risk, but public review cohorts are not representative enough to quantify financial impact.
    claimRefs: [CI005, CI008, CI010, CI011, CI012, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: |
      Wikipedia reports a $113 million Series B in May 2026 at an approximately $1.3 billion valuation, and CapitalG confirms that it led the round. That financing is not evidence of current cash: no retained source discloses cash on hand, monthly burn, debt, working-capital commitments, provider prepayment obligations, or a next-round trigger. Current runway therefore cannot be calculated from the public record. The investable strengths are a legible fee mechanism, large reported usage, and potential operating leverage from a unified billing layer. The blockers are more fundamental: realized revenue, gross margin, customer concentration, CAC/payback, retention, provider economics, and capital obligations all require private diligence before valuation or financing resilience can be underwritten.
    claimRefs: [CI013, CI014, CI016]
callouts:
  - calloutType: risk
    title: Volume is not revenue
    body: Reported token throughput and user counts demonstrate activity, but model mix, free usage, realized fees, discounts, and provider costs are missing; converting those figures into revenue or gross profit would be speculative.
    claimRefs: [CI001, CI002, CI005, CI009, CI014]
