      - [LiteLLM, "Open-source self-hosted router", "More than 100 providers are claimed in comparison sources; funding and deployment scale were not established", "Platform teams with infrastructure capacity", "Self-hosting, virtual keys, budgets, and an OpenAI-compatible proxy", "Buyer owns uptime, upgrades, databases, caching, and security patching"]
      - [Cloudflare AI Gateway, "Platform-native managed gateway", "Scale and funding are inherited from the broader Cloudflare platform but not quantified in assigned evidence", "Cloudflare-native applications", "Edge caching, rate limits, analytics, and an existing network account boundary", "Best fit is ecosystem-dependent; independent quality evaluation remains separate"]
