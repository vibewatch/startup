      - ["Governance and access", "Enterprise allowlists, budgets, SSO, SCIM, ZDR, regions, and DPA are claimed", "Guardrails, virtual keys, budgets, and access controls are emphasized", "Virtual keys, budgets, limits, and guardrails are operator-configured", "Platform-account controls are available; exact parity is unverified", "Governance follows separate provider contracts and tooling"]
