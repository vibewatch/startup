      terms can change and require procurement verification.
    claimRefs: [CP008, CP009, CP013, CP014]
figures:
  - id: FP001
    title: Competitive positioning by deployment control and governance depth
    type: quadrant
    summary: >-
      Ordinal evidence-backed positioning shows OpenRouter optimized for managed breadth, while
      self-hosted and policy-heavy alternatives trade convenience for control.
    data:
      xAxis:
        label: "Deployment control (1 = vendor managed, 5 = buyer controlled)"
        min: 1
        max: 5
      yAxis:
        label: "Governance depth described in assigned evidence (1 = basic, 5 = extensive)"
        min: 1
        max: 5
      points:
        - label: OpenRouter
          x: 1
          y: 4
          detail: "Managed breadth with expanded enterprise routing, policy, budget, and compliance controls."
        - label: Portkey
          x: 3
          y: 5
          detail: "Managed governance emphasis plus a self-hostable gateway component."
        - label: LiteLLM
          x: 5
          y: 4
          detail: "Maximum deployment control, with governance features operated by the buyer."
        - label: Cloudflare AI Gateway
          x: 1
          y: 4
          detail: "Managed edge gateway with policy, caching, rate limits, and analytics."
        - label: Vercel AI Gateway
          x: 1
          y: 3
          detail: "Managed developer-centric gateway with budgets, logs, and provider policies."
        - label: Direct provider APIs
          x: 5
          y: 2
          detail: "Direct endpoint control, but cross-provider governance must be assembled by the buyer."
    approximationNotes: >-
      Coordinates are analyst-authored ordinal scores from the assigned sources, not measured
      benchmarks. They compare deployment ownership and described control-plane breadth only; a
      one-point difference is not a quantified performance gap.
    claimRefs: [CP004, CP005, CP006, CP007, CP013]
callouts:
  - calloutType: insight
    title: Breadth is becoming table stakes
    body: >-
      OpenRouter's low-friction catalog remains valuable, but comparison sources repeatedly position
      governance, self-hosting, evaluation, and platform distribution as the reasons to choose another
      gateway.
    claimRefs: [CP001, CP004, CP005, CP006, CP007]
  - calloutType: risk
    title: Operational trust can outweigh catalog size
    body: >-
      Mixed public sentiment around support, billing, rate limits, and outages creates a displacement
      path for alternatives that offer stronger contracts, tighter ownership, or an existing cloud
      control plane.
    claimRefs: [CP010, CP011, CP013]
