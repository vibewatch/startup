    rows:
      - [OpenRouter, "Provider list-price pass-through plus a reported 5.5% credit-purchase fee; enterprise quote", "Unified catalog, routing, billing, logs, and enterprise controls", "BYOK allowance and fees vary by plan; discounts and realized spend are unavailable", "Convenience fee scales with purchased credits unless enterprise terms offset it"]
      - [LiteLLM, "Free open-source self-hosting; enterprise support priced separately", "OpenAI-compatible proxy, routing, keys, budgets, and hooks", "Infrastructure, database, Redis, staffing, and incident costs are excluded", "Economic advantage depends on sufficient scale and operating capability"]
      - [Portkey, "Free developer tier and managed plans reported from $49 per month; enterprise custom", "Routing, logs, traces, guardrails, budgets, and policy", "Logging limits, retention, and negotiated enterprise price vary", "Fixed platform pricing may be attractive when governance is the buying trigger"]
      - [Cloudflare AI Gateway, "Core gateway features reported as free; optional unified billing can add a 5% credit fee", "Edge routing, caching, rate limits, retries, logs, and analytics", "Plan storage limits and broader Cloudflare costs are not included", "Strongest where Cloudflare is already the network control plane"]
      - [Vercel AI Gateway, "Reported $5 monthly starter credits, then provider list price without token markup", "Multi-provider endpoint, provider policies, budgets, logs, and AI SDK integration", "Paid-tier and platform dependencies require current contract review", "Low-friction choice for applications already deployed on Vercel"]
      - [Direct provider APIs, "Provider-specific token or capacity pricing without a gateway fee", "Direct endpoint and support relationship", "Integration, fallback, billing reconciliation, and multi-provider operations are internal costs", "Best economic fit may occur when usage concentrates on few providers"]
    notes: >-
      Pricing is a dated public snapshot from 2026 comparison sources, not a quote or realized customer
