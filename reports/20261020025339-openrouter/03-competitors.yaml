company:
  name: OpenRouter
chapter:
  number: 3
  title: Competitors
  summary: >-
    OpenRouter remains differentiated by rapid access to a broad hosted-model catalog, but gateway
    breadth is increasingly table stakes. The strongest alternatives compete on governance,
    self-hosting, platform-native distribution, evaluation workflows, or direct-provider control,
    leaving OpenRouter's durability dependent on enterprise controls, routing quality, and ecosystem
    convenience rather than catalog size alone.
sections:
  - id: landscape-and-positioning
    title: Landscape and competitive position
    body: >-
      The buyer's alternative set is wider than other hosted aggregators. It includes managed control
      planes such as Portkey and Braintrust, self-hosted routers such as LiteLLM, platform-native
      gateways from Cloudflare and Vercel, direct provider APIs, and an internal routing layer.
      Independent comparisons consistently describe OpenRouter's advantage as low-friction breadth,
      while alternatives become attractive when the buyer's priority shifts to governance, data
      residency, evaluation, or infrastructure ownership. OpenRouter itself claims more than 500
      models and 80 providers; those figures establish scale but do not prove unique supply, because
      competing gateways advertise overlapping multi-provider access. The resulting position is an
      efficient on-ramp, not an uncontested control-plane moat.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP007, CP008, CP014]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-trust-tradeoffs
    title: Capability, deployment, and trust trade-offs
    body: >-
      OpenRouter's enterprise surface narrows several historical gaps: it advertises model and
      provider allowlists, zero-data-retention routing, regional controls, budgets, fallbacks, SSO,
      SCIM, a DPA, and SOC 2 Type II. Those are company-issued claims rather than independent
      benchmarks, so procurement should verify scope and contractual applicability. Portkey is
      positioned around managed guardrails and policy; LiteLLM emphasizes self-hosting and operator
      control; Cloudflare and Vercel embed the gateway in an existing deployment ecosystem; and direct
      APIs maximize endpoint control at the cost of integration work. This makes compliance posture
      and operating ownership more discriminating than raw model count. The assigned compatibility
      page produced no usable app-level text, so integration breadth beyond the general company claim
      remains unverified here.
    claimRefs: [CP002, CP005, CP006, CP007, CP008, CP010, CP012, CP015]
    tableRefs: [TP002]
  - id: pricing-distribution-and-switching
    title: Pricing, distribution, and switching
    body: >-
      Public comparisons describe OpenRouter as passing through provider token prices while charging
      a 5.5% fee on credit purchases, with separate bring-your-own-key terms. Self-hosted software can
      remove a gateway fee but replaces it with infrastructure, database, scaling, patching, and
      incident-response work. Platform-native gateways can win through an existing Cloudflare or
      Vercel account boundary, while direct APIs remove the routing intermediary but multiply
      credentials, billing relationships, and fallback logic. These patterns imply modest code-level
      switching costs where OpenAI-compatible interfaces are preserved, but potentially material
      operational switching costs once policies, logs, budgets, and routing rules are embedded.
      Realized enterprise discounts, migration effort, and multi-homing behavior are not disclosed in
      the assigned evidence.
    claimRefs: [CP007, CP008, CP009, CP013, CP014]
    tableRefs: [TP003]
  - id: moat-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      Catalog breadth is vulnerable to commoditization because several gateways expose large,
      overlapping catalogs through compatible APIs. OpenRouter's more defensible layer is the
      combination of aggregated demand, provider routing, consolidated billing, operational telemetry,
      and enterprise policy controls, but the assigned sources do not quantify retention, exclusive
      provider access, routing lift, or customer concentration. The adverse evidence is operational:
      an independent review reports mixed public sentiment and complaints centered on support,
      billing, rate limits, and outages. Stripe's reported acquisition could strengthen distribution
      and procurement reach, yet the same report said the product continued unchanged; there is not
      enough current evidence to score integration benefits. The central displacement risk is therefore
      not a larger catalog, but a buyer choosing self-hosted control, a cloud-native gateway, or direct
      provider relationships as scale and compliance requirements rise.
    claimRefs: [CP002, CP004, CP005, CP007, CP010, CP011, CP013, CP016]
