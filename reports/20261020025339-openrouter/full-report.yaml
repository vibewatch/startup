  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive position
        blocks:
          - type: paragraph
            body: >-
              The buyer's alternative set is wider than other hosted aggregators. It includes managed control planes
              such as Portkey and Braintrust, self-hosted routers such as LiteLLM, platform-native gateways from
              Cloudflare and Vercel, direct provider APIs, and an internal routing layer. Independent comparisons
              consistently describe OpenRouter's advantage as low-friction breadth, while alternatives become attractive
              when the buyer's priority shifts to governance, data residency, evaluation, or infrastructure ownership.
              OpenRouter itself claims more than 500 models and 80 providers; those figures establish scale but do not
              prove unique supply, because competing gateways advertise overlapping multi-provider access. The resulting
              position is an efficient on-ramp, not an uncontested control-plane moat.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
