  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is hosted multi-model access, routing, billing, and policy control between
              applications and model providers. OpenRouter's catalog and public positioning place it in a
              gateway/control-plane category: customers use one interface to reach a changing set of models and
              providers, while the underlying model training and inference supply remain outside the boundary.
              Enterprise governance, spend controls, and usage reporting are adjacent expansion surfaces rather than a
              separate model market. The practical substitutes are direct provider integrations, self-built routing,
              self-hosted gateways, and cloud-provider gateways. This boundary matters because model spending is not
              automatically OpenRouter-addressable revenue; only traffic and workflows for which buyers value
              aggregation, routing, reliability, or governance belong in the serviceable opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing and adoption signals
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies a credible market-wide revenue denominator or a comparable TAM/SAM/SOM series.
              The strongest available sizing evidence is therefore operating-scale evidence for OpenRouter itself.
              SiliconANGLE reported 25 trillion tokens per week and more than 8 million users in May 2026; Menlo, an
              investor and therefore not independent, described an approximately 1.5 quadrillion-token annual run rate.
              By the October access date, OpenRouter's homepage displayed 600 trillion monthly tokens and more than 10
              million global users. These figures indicate rapid adoption, but different issuers, dates, periods, and
              measurement conventions prevent treating them as one audited growth series. They establish category pull
              and platform scale, not market revenue, OpenRouter revenue, or attainable share.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
