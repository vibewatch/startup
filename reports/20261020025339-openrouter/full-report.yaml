      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Developers are the initial users because a unified endpoint reduces repeated integration work when testing
              or switching models. For AI-native product teams, the economic buyer is more likely an engineering or
              platform leader seeking faster model selection, failover, and consolidated usage visibility. At larger
              enterprises, budget ownership can span AI platform, cloud infrastructure, FinOps, security, and
              procurement; the evidence confirms the control features but does not identify a universal budget owner.
              Adoption typically starts with model experimentation or application integration, then expands when traffic
              volume makes reliability, policy enforcement, and cost governance material. Regulated or contract-heavy
              deployments may instead prefer direct providers or cloud gateways with clearer contractual control.
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Model proliferation and high token consumption create demand for a neutral routing layer: SiliconANGLE
              cited a Deloitte study saying 67% of enterprises already compute almost one billion tokens per month,
              while OpenRouter's catalog spans hundreds of models. The same dynamics also create risk. IBM argues that
              gateways can become commoditized as rivals and open-source projects multiply. Independent reviews identify
              opaque routing, platform fees, support and billing complaints, and limited self-hosting or contract
              control as barriers at scale. For valuation, usage growth is supportive only if OpenRouter converts routed
              volume into durable economics without losing large or regulated workloads to direct, self-hosted, or
              cloud-provider alternatives. Public sources do not disclose market-wide spend, customer concentration,
              take rate, or conversion by buyer segment.
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
