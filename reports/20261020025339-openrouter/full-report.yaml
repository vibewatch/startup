      - number: '1.3'
        title: Capital, valuation, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              OpenRouter announced a $113M Series B led by CapitalG, with participation from several infrastructure
              vendors and existing investors. The amount is corroborated by Tracxn and Menlo, although the sources
              differ on timing. Tracxn reports $166M raised across three rounds and a $1.3B last known valuation; Menlo
              also reports a $1.3B valuation. Funding raised is not cash available, and none of the assigned sources
              discloses secondary proceeds, debt, liquidation preferences, ownership, or post-round cash. Earlier
              financing is also inconsistent: Sacra describes a $28M Series A in April 2025, whereas Tracxn reports $40M
              on June 25, 2025. The strategic investor roster can improve distribution and credibility, but it does not
              prove commercial contracts or governance rights.
