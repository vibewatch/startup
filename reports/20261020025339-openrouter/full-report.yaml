          - type: paragraph
            body: >-
              The strongest current commercial datapoint is still an estimate: Sacra puts August 2026 annualized revenue
              at $160M, up from $50M at the end of 2025. That metric is annualized revenue, not ARR, and the assigned
              evidence provides no audited revenue, gross margin, burn, runway, customer concentration, or retention.
