        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >
              OpenRouter's current homepage reports 600 trillion monthly tokens, 10 million global users, more than 500
              models, and more than 80 providers. CapitalG separately says weekly volume exceeded 25 trillion tokens and
              grew fivefold over six months. These are strong throughput and reach indicators, but neither source
              supplies paying-customer count, revenue retention, cohort conversion, or customer concentration. A
              homepage case headline says the company operates with a five-person sales team, which is a useful lean-GTM
              signal but not a CAC or payback calculation. The volume measures also use different periods and should not
              be converted into revenue without model mix, provider cost, free traffic, and effective fee data.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
