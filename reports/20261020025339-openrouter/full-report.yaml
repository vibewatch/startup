  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              OpenRouter's core product is not a foundation model; it is a hosted access and routing layer that lets an
              application address many models through one OpenAI-compatible contract. The customer workflow starts with
              an API key or official SDK, sends a familiar chat request, selects a model by identifier, and receives a
              normalized response. This removes much of the integration work involved in maintaining separate provider
              SDKs, credentials, response parsers, and billing accounts. The current homepage displayed 500+ active
              models across 80+ providers, while other current official and third-party surfaces cited lower figures, so
              catalog breadth should be treated as a dated operating snapshot rather than a stable KPI. Public
              TypeScript, Python, Go, agent, and integration repositories broaden the product from a single endpoint
              into an ecosystem of supported client paths.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE012
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE012
              - CE014
              - CE015
      - number: '5.2'
        title: Architecture, deployment, and integration model
        blocks:
          - type: paragraph
            body: >-
              The observable architecture has six layers: application workflows, client SDKs, a normalized API contract,
              policy and provider routing, upstream model execution, and usage governance. OpenRouter's documentation
              establishes schema normalization and a documented OpenAPI surface; independent guides corroborate that
              changing the endpoint, key, and model identifier can replace multiple direct integrations. Routing then
              selects or falls back among providers when a preferred path is unavailable or rate-limited. This design
              reduces integration and failover work but adds a gateway dependency between the customer and every
              upstream provider. Production qualification should therefore test provider pinning, fallbacks, structured
              outputs, tool calls, streaming, rate limits, and error semantics against the customer's actual workload
              rather than infer compatibility from the shared request shape alone.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
