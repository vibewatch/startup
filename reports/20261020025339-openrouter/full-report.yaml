      - number: '3.2'
        title: Capability, deployment, and trust trade-offs
        blocks:
          - type: paragraph
            body: >-
              OpenRouter's enterprise surface narrows several historical gaps: it advertises model and provider
              allowlists, zero-data-retention routing, regional controls, budgets, fallbacks, SSO, SCIM, a DPA, and SOC
              2 Type II. Those are company-issued claims rather than independent benchmarks, so procurement should
              verify scope and contractual applicability. Portkey is positioned around managed guardrails and policy;
              LiteLLM emphasizes self-hosting and operator control; Cloudflare and Vercel embed the gateway in an
              existing deployment ecosystem; and direct APIs maximize endpoint control at the cost of integration work.
              This makes compliance posture and operating ownership more discriminating than raw model count. The
              assigned compatibility page produced no usable app-level text, so integration breadth beyond the general
              company claim remains unverified here.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
