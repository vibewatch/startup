        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence does not support a market-wide TAM
            body: >-
              The retained evidence measures OpenRouter usage, catalog breadth, and selected enterprise behavior. It
              does not disclose the revenue pool addressable by a gateway, the portion that will remain multi-model, or
              the share buyers will outsource rather than build internally.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM006
