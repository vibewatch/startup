      - number: '4.3'
        title: Unit economics and margin visibility
        blocks:
          - type: paragraph
            body: >
              One secondary analysis relays Sacra's estimate of approximately $140 million in annualized revenue, but
              the retained evidence does not provide audited revenue, ARR, or a reconciliation to token volume. The 5.5%
              purchase fee establishes a potential take rate on self-serve credits, not gross margin: provider payment
              timing, processor fees, support, routing infrastructure, credits, enterprise discounts, and free traffic
              remain unknown. Pricing pressure is credible because competitor-authored comparisons market no-fee or
              self-hosted alternatives, while independent reviews warn that a percentage fee becomes material at scale.
              Billing and support complaints add collection, refund, and retention risk, but public review cohorts are
              not representative enough to quantify financial impact.
            claimRefs:
              - CI005
              - CI008
              - CI010
              - CI011
              - CI012
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >
              Wikipedia reports a $113 million Series B in May 2026 at an approximately $1.3 billion valuation, and
              CapitalG confirms that it led the round. That financing is not evidence of current cash: no retained
              source discloses cash on hand, monthly burn, debt, working-capital commitments, provider prepayment
              obligations, or a next-round trigger. Current runway therefore cannot be calculated from the public
              record. The investable strengths are a legible fee mechanism, large reported usage, and potential
              operating leverage from a unified billing layer. The blockers are more fundamental: realized revenue,
              gross margin, customer concentration, CAC/payback, retention, provider economics, and capital obligations
              all require private diligence before valuation or financing resilience can be underwritten.
            claimRefs:
              - CI013
              - CI014
