        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership record in the assigned evidence is narrow. Tracxn identifies Alex Atallah as
              co-founder and CEO, and Menlo Ventures describes him as a three-time founder who previously started
              OpenSea. Menlo also identifies Chris Clark as COO and a two-time former founder of a public company. This
              pairing suggests founder-led product and company-building experience, but the evidence does not establish
              board composition, independent directors, voting control, succession planning, or the broader executive
              bench. Those omissions matter because a routing intermediary handling enterprise workloads needs
              governance depth across security, finance, compliance, and provider relations, not only founder-market
              fit.
