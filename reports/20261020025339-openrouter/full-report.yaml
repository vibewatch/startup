              - CP010
              - CP012
      - number: '3.3'
        title: Pricing, distribution, and switching
        blocks:
          - type: paragraph
            body: >-
              Public comparisons describe OpenRouter as passing through provider token prices while charging a 5.5% fee
              on credit purchases, with separate bring-your-own-key terms. Self-hosted software can remove a gateway fee
              but replaces it with infrastructure, database, scaling, patching, and incident-response work.
              Platform-native gateways can win through an existing Cloudflare or Vercel account boundary, while direct
              APIs remove the routing intermediary but multiply credentials, billing relationships, and fallback logic.
              These patterns imply modest code-level switching costs where OpenAI-compatible interfaces are preserved,
              but potentially material operational switching costs once policies, logs, budgets, and routing rules are
              embedded. Realized enterprise discounts, migration effort, and multi-homing behavior are not disclosed in
              the assigned evidence.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Catalog breadth is vulnerable to commoditization because several gateways expose large, overlapping
              catalogs through compatible APIs. OpenRouter's more defensible layer is the combination of aggregated
              demand, provider routing, consolidated billing, operational telemetry, and enterprise policy controls, but
              the assigned sources do not quantify retention, exclusive provider access, routing lift, or customer
              concentration. The adverse evidence is operational: an independent review reports mixed public sentiment
              and complaints centered on support, billing, rate limits, and outages. Stripe's reported acquisition could
              strengthen distribution and procurement reach, yet the same report said the product continued unchanged;
              there is not enough current evidence to score integration benefits. The central displacement risk is
              therefore not a larger catalog, but a buyer choosing self-hosted control, a cloud-native gateway, or
              direct provider relationships as scale and compliance requirements rise.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP010
              - CP011
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is becoming table stakes
            body: >-
              OpenRouter's low-friction catalog remains valuable, but comparison sources repeatedly position governance,
              self-hosting, evaluation, and platform distribution as the reasons to choose another gateway.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Operational trust can outweigh catalog size
            body: >-
              Mixed public sentiment around support, billing, rate limits, and outages creates a displacement path for
              alternatives that offer stronger contracts, tighter ownership, or an existing cloud control plane.
            calloutType: risk
            claimRefs:
