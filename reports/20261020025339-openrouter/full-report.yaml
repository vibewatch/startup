  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization mechanics
        blocks:
          - type: paragraph
            body: >
              OpenRouter uses a prepaid-credit model: customers create an account, buy credits, and use one API key
              across the catalog. Independent reviews consistently describe provider token prices as pass-through and
              identify the principal self-serve monetization as a 5.5% fee on most credit purchases, rather than a
              markup embedded in model rates. Enterprise contracts introduce a second commercial path through custom fee
              discounts, invoicing, volume commitments, annual prepayment, support, and service-level terms.
              Bring-your-own-key usage provides another fee surface after a reported monthly waiver threshold. These
              mechanics are understandable, but published list terms do not reveal realized enterprise discounts,
              refunds, credit breakage, provider rebates, or revenue recognition.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
