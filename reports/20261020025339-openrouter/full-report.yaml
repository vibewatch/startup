  - id: FP001
    title: Competitive positioning by deployment control and governance depth
    type: quadrant
    summary: >-
      Ordinal evidence-backed positioning shows OpenRouter optimized for managed breadth, while self-hosted and
      policy-heavy alternatives trade convenience for control.
    data:
      xAxis:
        label: Deployment control (1 = vendor managed, 5 = buyer controlled)
        min: 1
        max: 5
      yAxis:
        label: Governance depth described in assigned evidence (1 = basic, 5 = extensive)
        min: 1
        max: 5
      points:
        - label: OpenRouter
          x: 1
          'y': 4
          detail: Managed breadth with expanded enterprise routing, policy, budget, and compliance controls.
        - label: Portkey
          x: 3
          'y': 5
          detail: Managed governance emphasis plus a self-hostable gateway component.
        - label: LiteLLM
          x: 5
          'y': 4
          detail: Maximum deployment control, with governance features operated by the buyer.
        - label: Cloudflare AI Gateway
          x: 1
          'y': 4
          detail: Managed edge gateway with policy, caching, rate limits, and analytics.
        - label: Vercel AI Gateway
          x: 1
          'y': 3
          detail: Managed developer-centric gateway with budgets, logs, and provider policies.
        - label: Direct provider APIs
          x: 5
          'y': 2
          detail: Direct endpoint control, but cross-provider governance must be assembled by the buyer.
    approximationNotes: >-
      Coordinates are analyst-authored ordinal scores from the assigned sources, not measured benchmarks. They compare
      deployment ownership and described control-plane breadth only; a one-point difference is not a quantified
      performance gap.
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
      - CP013
  - id: FI001
    title: Self-serve revenue model bridge
    type: flow
    summary: >-
      The public model converts prepaid customer funding into routed inference, with OpenRouter monetizing principally
      at credit purchase rather than through a disclosed token markup.
    data:
      nodes:
        - id: customer
          label: Customer
          detail: Developer or organization funds an account.
        - id: purchase
          label: Credit purchase
          detail: Customer prepays a shared balance.
        - id: platform-fee
          label: Platform fee
          detail: Reviews report 5.5% on most self-serve credit purchases.
        - id: usable-credit
          label: Usable credits
          detail: Balance is available across models and providers.
        - id: routed-inference
          label: Routed inference
          detail: Requests consume credits at reported provider list prices.
        - id: enterprise-layer
          label: Enterprise layer
          detail: Custom discounts, invoicing, commitments, support, and SLAs modify list mechanics.
      edges:
        - from: customer
          to: purchase
          label: prepays
        - from: purchase
          to: platform-fee
          label: fee assessed
        - from: platform-fee
          to: usable-credit
          label: remaining balance
        - from: usable-credit
          to: routed-inference
          label: funds usage
        - from: routed-inference
          to: enterprise-layer
          label: custom terms at scale
    approximationNotes: Qualitative mechanism only; the diagram does not estimate revenue, provider payout, gross profit, or cash timing.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
  - id: FE001
    title: OpenRouter product architecture map
    type: stack
    summary: >-
      A customer-facing stack from application workflows through normalized routing to upstream inference, with
      governance spanning the managed gateway.
    data:
      layers:
        - label: Application workflows
          items:
            - Prompts and messages
            - Tools and structured outputs
            - Customer evaluation and business logic
          detail: Customers retain responsibility for model choice and output verification.
        - label: SDK and integration layer
          items:
            - TypeScript SDK
            - Python SDK
            - Go SDK
            - Agent and Vercel AI integrations
          detail: Public repositories provide several supported entry points.
        - label: Normalized API contract
          items:
            - OpenAI-compatible requests
            - Normalized responses
            - OpenAPI specification
          detail: Compatibility must still be tested for model-specific features.
        - label: Policy and provider routing
          items:
            - Provider selection
            - Fallbacks
            - Cost and latency preferences
            - Data-policy controls
          detail: Routing quality is central but independently opaque.
        - label: Provider and model execution
          items:
            - Multiple upstream providers
            - Frontier and open-weight models
            - Provider-specific capacity and retention
          detail: Upstream availability and policies remain external dependencies.
        - label: Governance and operations
          items:
            - Usage telemetry
            - Consolidated billing
            - API-key controls
            - Support and incident response
          detail: Service levels, audit scope, and support performance are private diligence items.
    approximationNotes: >-
      The layer order reflects the observable customer workflow, not undisclosed internal deployment topology; counts
      and upstream availability change over time.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE008
      - CE010
      - CE014
  - id: FU001
    title: Customer adoption path from experiment to governed enterprise usage
    type: journey-map
    summary: >-
      The public evidence supports a plausible adoption sequence, while conversion and retention between stages remain
      undisclosed.
    data:
      nodes:
        - id: discover
          label: Discover models
          detail: Individual developers compare model quality, price, and availability.
          touchpoints:
            - Public model catalog
            - Single API key
        - id: prototype
          label: Prototype
          detail: Startup and product teams integrate an OpenAI-compatible endpoint.
          touchpoints:
            - Unified API
            - Consolidated billing
        - id: deploy
          label: Deploy a workload
          detail: Applications add provider and model fallbacks for production traffic.
          touchpoints:
            - Routing
            - Failover
        - id: organize
          label: Organize teams
          detail: Workspaces, keys, and member-level controls support broader internal use.
          touchpoints:
            - Usage reporting
            - Budget alerts
        - id: govern
          label: Govern enterprise use
          detail: Security, finance, procurement, and legal apply organization-level policies.
          touchpoints:
            - Identity and data controls
            - Contract and invoicing
        - id: expand
          label: Expand workloads
          detail: Teams can add models, providers, applications, and private capacity.
          touchpoints:
            - Price-aware routing
            - Private endpoints
    approximationNotes: >-
      Conceptual sequence based on disclosed product surfaces and customer-fit descriptions; node order is not a
      measured funnel and no conversion rates, stage populations, or retention rates are available.
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU015
