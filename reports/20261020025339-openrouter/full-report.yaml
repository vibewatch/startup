chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              OpenRouter says it began in early 2023 as an LLM marketplace, while Tracxn places the company in New York
              City. The product is a hosted routing and billing layer rather than a foundation-model developer: one
              interface exposes a broad catalog of models and providers, with routing, failover, usage tracking, and
              enterprise controls layered on top. The official website currently displays 500+ models, 80+ providers,
              10M+ global users, and 600T+ monthly tokens. Those scale figures are company-issued and should be treated
              as operating claims, not independently audited metrics. Sacra describes a usage-based model tied to
              inference spend, which makes throughput commercially relevant but does not by itself establish revenue,
              margin, retention, or cash generation.
