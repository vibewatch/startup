companyProfile:
  summary: >-
    OpenRouter is a New York-based multi-model gateway founded in early 2023. It gives developers and organizations a
    unified interface for model access, provider routing, failover, usage tracking, billing, and policy controls. Public
    evidence shows substantial company-reported usage and a well-funded strategic position, but operating economics,
    governance depth, and the status and terms of a reported Stripe transaction remain unresolved.
