schemaVersion: "report-v2"
artifact: customers
slug: openrouter
runDate: 2026-10-20
company:
  name: OpenRouter
chapter:
  number: 6
  title: Customers
  summary: >-
    OpenRouter shows strong aggregate adoption, including company-reported scale of 10M+ global
    users and 600T+ monthly tokens, while investor and third-party sources document earlier
    growth and developer-oriented use. Public evidence remains materially weaker on paying
    customer identity, retention, contract durability, and concentration.
sections:
  - id: adoption-scale
    title: Aggregate adoption is large, but mostly company-reported
    body: >-
      OpenRouter's current public surfaces report more than 10 million global users and more
      than 600 trillion monthly tokens. Those figures indicate a large usage surface, but they
      are company claims rather than independently audited customer metrics. A June 2025 Menlo
      Ventures investment note provides an earlier checkpoint of more than 2.5 million
      developers and says annual token processing rose from roughly 10 trillion to more than
      100 trillion over the prior year. Sacra later estimated annualized revenue of $160
      million in August 2026, up from $50 million at the end of 2025. That is a demand signal,
      not ARR, contracted backlog, active paid accounts, or proof of retention.
    claimRefs: [CU001, CU002, CU003, CU004, CU014]
    tableRefs: [TU002]
  - id: customer-segments
    title: The base spans individual builders through enterprise buying centers
    body: >-
      The clearest segmentation starts with individual developers and startup product teams
      seeking rapid model comparison, one integration, and consolidated billing. As deployments
      mature, the buying center broadens: OpenRouter's enterprise page explicitly addresses
      developers and engineering, finance and FinOps, security and risk, and procurement and
      legal. Sacra similarly describes indie hackers, product teams, and enterprises as three
      principal user groups. These sources support a progression from card-funded experimentation
      to organization-level governance, but they do not disclose segment revenue, paid conversion,
      geography, vertical mix, or the share of usage controlled by enterprise contracts.
    claimRefs: [CU006, CU007, CU008, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof
    title: Named proof is thinner than aggregate scale
    body: >-
      Menlo's 2025 note says OpenRouter powered Cline and integrated natively into VS Code,
      providing recognizable application and distribution references. A later independent
      review relays a company claim of more than 250,000 applications using OpenRouter, but
      does not enumerate those applications. None of these disclosures establishes whether
      Cline or Microsoft is a paying customer, identifies contract value, separates production
      from pilot traffic, or quantifies an end-customer outcome. The public file therefore
      supports broad developer adoption and integration reach more strongly than it supports a
      conventional named-customer roster. Customer references, invoices, and workload-level
      usage histories are required to validate production depth.
    claimRefs: [CU005, CU011]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Expansion is plausible; durability and concentration are unverified
    body: >-
      Token and estimated annualized-revenue growth are consistent with expanding workloads,
      while enterprise controls for workspace, key, and member budgets create a practical path
      from an individual integration to organization-wide usage. Competitive and independent
      reviews also identify the transition point: teams value OpenRouter for speed and breadth,
      but production requirements can increase demand for self-hosting, auditability, cost
      attribution, and support. Public complaints summarized by University-365 include weak
      support and billing responsiveness, and its verified Trustpilot snapshot was 1.8 out of
      5 from 33 reviews. Without NRR, GRR, churn, renewal, cohort, contract-term, and top-customer
      data, the durability of aggregate growth and exposure to a few large workloads cannot be
      underwritten.
    claimRefs: [CU007, CU009, CU010, CU012, CU013, CU014, CU015]
