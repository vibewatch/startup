  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rates, contract lengths, paid-account cohorts,
        satisfaction data, and renewal reasons by customer segment.
      whyItMatters: >-
        Aggregate users, token volume, and annualized-revenue estimates cannot establish whether
        customers repeat, renew, or expand after initial experimentation.
      diligencePath: >-
        Obtain monthly paid-account and revenue cohorts for at least 24 months, reconcile them to
        invoices, and interview a stratified sample of renewed, contracted, and churned customers.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Top 1, top 5, and top 10 customer shares of revenue, gross profit, and tokens; enterprise
        versus self-serve mix; and provider or channel-attributed revenue.
      whyItMatters: >-
        A few high-volume applications could account for a disproportionate share of the reported
        usage and estimated annualized revenue.
      diligencePath: >-
        Review the customer-level revenue and gross-profit ledger, token volume by account, and
        concentration sensitivity under loss of each top account.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-deployments
      missingEvidence: >-
        A current customer roster distinguishing paid customers, integrations, pilots, production
        workloads, contract value, workload volume, outcome, and referenceability.
      whyItMatters: >-
        Public application references do not establish a paying relationship, production depth,
