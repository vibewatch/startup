evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited revenue, ARR definition, gross margin, burn, runway, customer concentration, and retention metrics.
    whyItMatters: >-
      Annualized revenue estimates and funding totals do not establish recurring economics, cash availability, or
      financing durability.
    diligencePath: >-
      Obtain monthly financial statements, bank balances, cohort retention, customer concentration, and a revenue bridge
      reconciled to the general ledger.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board composition, observer rights, voting control, succession plan, and delegated
      functional ownership.
    whyItMatters: The public record identifies only two leaders and cannot establish governance resilience or oversight.
    diligencePath: >-
      Request the organization chart, board minutes and consents, charter documents, voting agreements, and key-person
      succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Full cap table, round-by-round primary and secondary proceeds, option pool, liquidation preferences, debt, and
      investor control rights.
    whyItMatters: >-
      Named investors and reported funding do not reveal ownership, dilution, preference overhang, or cash retained by
      the company.
    diligencePath: >-
      Review executed financing documents, post-money cap table, debt schedules, side letters, and funds-flow
      statements.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated employee roster and definitions reconciling the reported roughly 50 and 120 employee figures.
    whyItMatters: Headcount affects operating leverage, hiring pace, revenue-per-employee analysis, and integration planning.
    diligencePath: Obtain payroll and HRIS exports by month, distinguishing employees, contractors, and acquired personnel.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO002
  - type: conflicting-data
    severity: material
    topic: transaction-status
    missingEvidence: >-
      Executed merger agreement, closing notice, regulatory approvals, consideration structure, and post-close
      governance.
    whyItMatters: The assigned sources conflict on whether the Stripe transaction is announced, pending, or completed.
    diligencePath: >-
      Confirm status with company counsel and review the signed agreement, closing deliverables, approvals, and updated
      ownership records.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
