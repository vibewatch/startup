company:
  name: "OpenRouter"
chapter:
  number: 1
  title: "Company Overview"
  summary: "OpenRouter is a New York-based, early-2023 company positioning itself as a unified gateway to hundreds of AI models. Its May 2026 $113M Series B and company-reported usage scale indicate substantial momentum, but public sources disagree on earlier financing, headcount, and whether the reported Stripe transaction is complete."
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      OpenRouter says it began in early 2023 as an LLM marketplace, while Tracxn
      places the company in New York City. The product is a hosted routing and
      billing layer rather than a foundation-model developer: one interface
      exposes a broad catalog of models and providers, with routing, failover,
      usage tracking, and enterprise controls layered on top. The official
      website currently displays 500+ models, 80+ providers, 10M+ global users,
      and 600T+ monthly tokens. Those scale figures are company-issued and
      should be treated as operating claims, not independently audited metrics.
      Sacra describes a usage-based model tied to inference spend, which makes
      throughput commercially relevant but does not by itself establish revenue,
      margin, retention, or cash generation.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      The public leadership record in the assigned evidence is narrow. Tracxn
      identifies Alex Atallah as co-founder and CEO, and Menlo Ventures describes
      him as a three-time founder who previously started OpenSea. Menlo also
      identifies Chris Clark as COO and a two-time former founder of a public
      company. This pairing suggests founder-led product and company-building
      experience, but the evidence does not establish board composition,
      independent directors, voting control, succession planning, or the broader
      executive bench. Those omissions matter because a routing intermediary
      handling enterprise workloads needs governance depth across security,
      finance, compliance, and provider relations, not only founder-market fit.
    claimRefs: [CO012, CO013]
    tableRefs: [TO002]
  - id: "capital-and-stakeholders"
    title: "Capital, valuation, and strategic stakeholders"
    body: >-
      OpenRouter announced a $113M Series B led by CapitalG, with participation
      from several infrastructure vendors and existing investors. The amount is
      corroborated by Tracxn and Menlo, although the sources differ on timing.
      Tracxn reports $166M raised across three rounds and a $1.3B last known
      valuation; Menlo also reports a $1.3B valuation. Funding raised is not cash
      available, and none of the assigned sources discloses secondary proceeds,
      debt, liquidation preferences, ownership, or post-round cash. Earlier
      financing is also inconsistent: Sacra describes a $28M Series A in April
      2025, whereas Tracxn reports $40M on June 25, 2025. The strategic investor
      roster can improve distribution and credibility, but it does not prove
      commercial contracts or governance rights.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO003]
  - id: "scale-signals-and-open-status"
    title: "Scale signals, operating gaps, and transaction status"
    body: >-
      The strongest current commercial datapoint is still an estimate: Sacra
      puts August 2026 annualized revenue at $160M, up from $50M at the end of
      2025. That metric is annualized revenue, not ARR, and the assigned evidence
      provides no audited revenue, gross margin, burn, runway, customer
      concentration, or retention. Public headcount signals also diverge:
      Menlo described roughly 50 people in May, while Tracxn reported 120 in
      September; rapid hiring or different counting methods could explain the
      gap, but neither is demonstrated. An independent review reports mixed
      user sentiment centered on support, billing, rate limits, and outages.
      Finally, Tracxn labels the company acquired by Stripe, while Sacra calls
      the agreement pending and the review describes an announced acquisition.
      Legal close, consideration, and post-close control therefore remain open.
    claimRefs: [CO009, CO010, CO011, CO014, CO015, CO016]
    figureRefs: [FO001]
