  topStrengths:
    - Slate 似乎找到了真实未满足需求：一款价格大幅更低的电动皮卡，首车交付前已有超过 160,000 个预约。
    - 产品差异化不靠高端性能或软件叙事，而靠低配置制造、模块化配件和美国本土组装。
    - 作为尚未交付的车企，Slate 获得的投资支持异常深：最新一轮融资 $650 million，累计披露约 $1.4 billion。
    - 直销、NACS 充电接入和大范围第三方服务合作，拼出了一条不依赖大型经销商网络的上市路径。
  topRisks:
    - Slate 仍处于交付前阶段，还要完成认证、工装、供应商爬坡，并在 Warsaw 工厂跑通常规量产。
    - 预约漏斗不等于确定需求：早期兴趣来自可退款的 $50 预约，之后还要转成不可退款预购，再走到金额大得多的最终购买。
    - 公开服务准备度披露仍在变化，包括 RepairPal 门店数量口径不一致，以及保修服务可能并非所有地点都能提供的限制。
    - Series C 精确估值、优先股堆叠、当前毛利率展望和 2027 年可能资本需求仍未披露，独角兽估值难以精确核价。
  unresolvedGaps:
    - Series C 精确投后估值、清算优先权、任何债务或老股条款，以及投资人控制权。
    - 预约到预购的转化、取消 / 退款率，以及任何具名车队合同或采购订单。
    - 详细物料清单、供应商集中度、上市初期毛利率路径、烧钱速度、现金跑道和 2027 年融资需求。
    - 最终服务网点、保修 SLA，以及车辆上路后 RepairPal / 上门交付模式能否稳定执行。
