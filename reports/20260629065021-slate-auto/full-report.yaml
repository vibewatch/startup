companyProfile:
  summary: >-
    Slate Auto is a private American EV startup that emerged from the Re:Build / Re:Car incubation path and publicly
    launched its minimalist electric pickup concept in 2025. The company is trying to create a new low-cost EV lane by
    combining a stripped-down two-seat pickup, optional SUV-conversion kits, a large accessory catalog, direct sales,
    outsourced service support, and domestic manufacturing in Warsaw, Indiana. Public evidence supports meaningful
    investor conviction — including a $650 million April 2026 Series C and about $1.4 billion of cumulative disclosed
    funding — as well as unusually strong top-of-funnel demand through more than 160,000 reservations before deliveries
    begin. The core underwriting issue is execution, not awareness: Slate still has to certify the vehicle, ramp the
    Warsaw plant, convert refundable reservations into real buyers, and prove that a low-content $24,950 EV can still
    generate acceptable economics after accessories, service, and launch support.
