      - number: '3.2'
        title: Direct EV pickup peers win on range and utility, not affordability
        blocks:
          - type: paragraph
            body: >-
              The direct EV pickup peer set is commercially real but strategically mismatched. Cybertruck and R1T still
              start around $72,000 in review sources, while Lightning starts around $66,000 and GM's electric full-size
              trucks start in the mid-$50,000s to low-$60,000s. Those vehicles bring materially more range, far higher
              tow ratings, and more complete cabins, but they do so at two to three times Slate's entry price. The
              largest gap is range: Slate now advertises 205 miles, while Lightning reaches 320 miles and GM claims 478
              miles on max-range Silverado and Sierra trims. Utility gaps are similar. Lightning advertises up to 7,700
              pounds of towing, Silverado EV up to 12,500 pounds, and Sierra EV remains positioned as a fully capable
              full-size truck through GMC's EV dealer network. For buyers whose primary job is towing, long-distance
              travel, or full-family utility, those incumbents remain hard for Slate to displace. Slate is more likely
              to benefit from being the anti-premium truck than from beating these trucks on their own terms.
