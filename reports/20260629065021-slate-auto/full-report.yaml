  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Pre-launch bridge round before normal production
        - New equity needed before certification and normal Warsaw throughput are demonstrated
        - Raises down-round risk and proves the current capital base was not enough to bridge launch
        - Pause investment and re-underwrite at the new price
      - - Weak preorder conversion
        - Paid preorders convert materially below the reservation headline or churn after the first deposit wave
        - Demand narrative weakens and revenue assumptions move toward bear case
        - Reset volume assumptions and tighten valuation band
      - - Realized ASP drifts toward stripped base truck
        - Mix fails to show meaningful SUV or accessory uplift over the $24,950 headline
        - Revenue-per-unit assumptions compress and margin leverage weakens
        - Move from base-case to lower ASP valuation math
      - - Certification or throughput slip
        - Normal production and regulatory readiness move materially beyond management’s public timing
        - Extends pre-scale burn and increases probability of another capital raise
        - Treat as a financing-risk event, not just an operations delay
      - - Round terms prove aggressive investor protection
        - 2026 term sheet reveals heavy preferences or anti-dilution protection
        - Headline valuation overstates economic value available to new common-like money
        - Reprice the opportunity on fully diluted, preference-adjusted terms
    notes: >-
      The point of these triggers is to force action before narrative momentum hides deteriorating economics. Each
      trigger is observable from either public filings, official updates, or a management data room.
    claimRefs:
      - CV005
      - CV011
      - CV014
      - CV015
      - CV016
      - CV018
