      - number: '1.4'
        title: Factory Buildout, Demand Signals, and Launch Readiness
        blocks:
          - type: paragraph
            body: >-
              Slate's operating footprint now spans more than corporate and design functions. CNBC's June 2025 plant
              feature showed a beta facility in Lake Orion Township, Michigan building more than 70 vehicles for
              internal testing and certification, while multiple 2025-2026 local and company-linked sources confirmed
              that serial production is planned for the former RR Donnelley/LSC printing plant in Warsaw, Indiana. The
              retained local coverage is directionally consistent on the scale of that project: roughly $383.5 million
              to $400 million of investment, more than 2,000 full-time jobs, around 1.4 to 1.5 million square feet, and
              prior company statements pointing to as much as 150,000 units of annual capacity. WVPE adds detail on the
              intended scope of the plant, including battery-pack assembly, seat manufacturing, and general assembly.


              Demand signals are strong but not yet bankable in the same way as delivered units. Slate's April 2026
              press release confirmed more than 160,000 reservations, and CNBC reported more than 180,000 reservations
              when preorders officially opened on June 24, 2026. The preorder mechanics are deliberately designed to
              separate curiosity from harder commitment: the old reservation used a refundable $50 placeholder, while
              the live preorder requires a non-refundable deposit and locks in a delivery window. Official pages say
              first deliveries remain targeted for late 2026, with Q4 2026 normal production processes as the goal.
              Partnerships with RepairPal and Tesla's NACS/Supercharger ecosystem round out the launch stack, but
              federal certification and actual production ramp remain the gating steps between promising demand and real
              revenue.
