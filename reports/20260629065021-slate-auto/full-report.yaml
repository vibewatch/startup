  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Slate has enough real signal to stay on an investor’s screen: the company has raised a disclosed $650
              million Series C, sits at roughly $1.4 billion of cumulative public funding, moved reservations from
              160,000-plus at the round close to 180,000-plus by late June 2026, and now has concrete pricing and
              deposit terms. But those strengths do not make the valuation underwritten. The public record still does
              not disclose the 2026 post-money valuation, the preference stack, the current cash balance, or any audited
              revenue and margin base. That means valuation must be framed as price discipline around scenarios rather
              than a clean intrinsic model. On public evidence alone, the right stance is TRACK / RESEARCH-MORE with
              medium confidence and a high risk rating. If a new investor is being asked to pay something near the
              low-reputation rumor of more than $3 billion, that price already leans on a mostly bull-case launch. A
              disciplined investor should want either a much lower entry zone or post-launch proof that conversion,
              throughput, and gross margin are moving toward plan.
