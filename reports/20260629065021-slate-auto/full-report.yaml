chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              Slate Auto describes itself as a new American automaker built around one core proposition: a radically
              simple, affordable electric vehicle that owners can personalize over time instead of buying through
              traditional trim-package logic. Official pages emphasize that the company is designed in California and
              Michigan, engineered in Michigan, and manufactured in Warsaw, Indiana, while the federal NHTSA
              manufacturer registry lists 2716 Daley Drive in Troy, Michigan as the company address and Peter Faricy as
              CEO. That combination suggests the cleanest reusable identity for later chapters is not 'an Indiana
              startup' or 'a Bay Area startup,' but a distributed U.S. EV company with a Michigan corporate and
              engineering center, California design activity, and Indiana manufacturing.


              Slate's base product is a two-seat electric pickup sold direct to consumers, with add-on kits that convert
              it into a five-seat SUV and a broader accessory strategy that turns post-purchase personalization into
              part of the business model. Official product copy and June 2026 press coverage consistently frame the
              truck as intentionally stripped down: gray composite exterior, no paint shop, no central infotainment
              screen, and crank windows. The economic logic matters as much as the aesthetics. Slate is trying to remove
              capital-intensive manufacturing steps and feature creep so the headline vehicle can land near $25,000
              rather than chasing the premium end of the EV market. As of run date, the company remains pre-delivery
              rather than fully commercial, but it has moved beyond pure concept stage through beta manufacturing,
              federal registry presence, pricing disclosure, and a live preorder process.
