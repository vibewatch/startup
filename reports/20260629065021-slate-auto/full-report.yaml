  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Slate’s product is best understood as a low-content vehicle platform plus an accessory and conversion
              system, not as a conventional trim ladder. The factory-default truck is a two-seat pickup with tactile
              controls, a phone-first cabin, and a limited set of bundled features, while many of the buyer-visible
              upgrades are deferred into add-ons that can be installed at delivery, later through a partner shop, or by
              the owner. That matters because Slate is trying to simplify the customer decision: buy a cheap, workable
              base truck now, then add body style, wraps, speakers, racks, or SUV hardware only when the use case
              actually appears.


              The customer workflow therefore runs from affordability and basic utility into staged personalization. A
              buyer reserves or preorders, chooses whether the two-seat pickup is enough, then decides what accessories
              to add and which installation path to use. The upside is flexibility and lower initial sticker shock. The
              tradeoff is that some capability the market would normally expect in a factory build—rear seats, audio,
              wrap color, or even some convenience tech—arrives later, which makes the ownership workflow more
              configurable but also more operationally dependent on Slate’s accessory, delivery, and
              partner-installation execution.
