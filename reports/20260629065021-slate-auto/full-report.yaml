      - number: '8.5'
        title: Exit readiness, kill triggers, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Slate is not yet IPO-ready on public evidence. Even management has suggested 2027 would probably be too
              soon, which makes the practical near-term exit menu a private follow-on financing, a strategic commercial
              partnership, or patience until launch data exists. The real gating issue is not whether the product is
              interesting; it is whether the capital stack and operating proof are good enough to survive the high-burn
              interval between first deliveries and normal production. That points diligence toward a short,
              non-negotiable list: the exact Series C terms, current cash and monthly burn, preorder conversion by
              cohort, the bill-of-materials and gross-margin bridge, and certification plus plant-readiness milestones.
              Investors should also predefine thesis-break triggers. A 2027 bridge round before normal production,
              materially weak preorder conversion, ASP slippage toward the stripped base configuration, or major
              certification and throughput delays would all move Slate out of a trackable late-stage opportunity and
              into a potential down-round or recapitalization case.
