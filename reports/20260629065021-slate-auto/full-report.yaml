      - number: '5.5'
        title: Differentiation and technology risks
        blocks:
          - type: paragraph
            body: >-
              Slate’s differentiation is more architectural than algorithmic. The company is not winning attention with
              autonomous driving, giant batteries, or class-leading performance. It is instead bundling a set of
              operational choices that reinforce each other: a single-config factory build, unpainted composite panels,
              a phone-first cabin, deferred accessories, DIY repair content, and a third-party support network. Those
              choices do create a real wedge if buyers value low entry price, repairability, and the ability to
              reconfigure the vehicle after purchase.


              The same choices also define the downside case. The public spec has already evolved between reveal and
              June 2026. EPA and public crash outputs are still missing. Service coverage claims are internally
              inconsistent. Public sources still do not identify the current battery supplier or major component
              vendors, and the public careers surface is weaker than the factory rhetoric would suggest. In short, Slate
              has a plausible low-cost product architecture and an unusually coherent philosophy, but it remains a
              preproduction startup that still has to prove homologation, supplier execution, accessory logistics, and
              customer support in the real world.
