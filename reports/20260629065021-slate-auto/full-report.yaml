  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Manufacturing Ramp, Battery, and Supplier Risk
        blocks:
          - type: paragraph
            body: >-
              Slate still faces the classic EV-startup jump from story to stable throughput. The company’s own Warsaw
              page says the former R.R. Donnelley plant is still being tooled up to get trucks rolling later in 2026,
              while local coverage ties the site to a brownfield conversion, 2,000-plus promised jobs, and a first-truck
              timetable that still sits in the future rather than the rear-view mirror. That means investors are
              underwriting not a line that is already proving takt time, but a plant conversion that still has permit,
              staffing, tooling, and launch-quality work left to absorb.


              Battery supply is simultaneously a de-risker and a concentration point. SK On’s announced U.S.-made NCM
              supply agreement gives Slate a credible launch supplier and reduces pure import exposure at the pack
              level, but the public record still shows a single named battery counterparty. For a low-price vehicle with
              limited gross-margin headroom, any slip in cell qualification, battery cost, or upstream material
              inflation can propagate quickly into delayed deliveries or thinner contribution margin. Slate’s
              simplification thesis also creates a subtle risk: by replacing traditional paint-shop complexity with
              wraps, modular accessories, and multiple post-sale configurations, the company reduces some capex burden
              but increases the number of customer-visible fit, finish, and warranty-touch points that have to work the
              first time.
