      - number: '6.3'
        title: Fleet appeal, geography, distribution, and service support
        blocks:
          - type: paragraph
            body: >-
              Slate’s customer-access model is unconventional in a way that cuts both directions. On the positive side,
              the company is trying to make ordering national from day one: direct sales, home delivery for a fee, a
              public roadshow across the U.S., a daily support chat line, and a business/fleet intake path. That gives
              Slate a broader theoretical reach than a traditional dealer rollout would, especially for buyers in
              markets without startup-owned stores. The flip side is that trust and service depth have to be borrowed
              from partners. Slate is leaning heavily on RepairPal-powered service coverage, DIY maintenance content,
              and accessory installation through third parties instead of owned dealerships or branded service bays. The
              evidence supports a wide network in principle, but not a perfectly pinned-down launch footprint: different
              public surfaces reference centers typically within 100 miles, more than 3,000 shops, or the broader
              4,000-shop RepairPal network. That is enough to make service reach a strength in narrative terms, but
              still leaves an execution question for mainstream buyers and fleets that care about exact authorized
              coverage by ZIP code.
