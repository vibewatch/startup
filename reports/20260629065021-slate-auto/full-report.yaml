  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding base and capital-structure signals
        blocks:
          - type: paragraph
            body: >-
              Slate has already solved one problem that kills many EV startups: access to equity capital. Public sources
              point to roughly $1.4 billion of cumulative disclosed funding after a $650 million Series C led by TWG
              Global, with repeat backing around Bezos- and Walter-linked capital. That is a large war chest for a
              company still targeting first deliveries rather than reporting them. But the round does not come with the
              disclosures public-market investors would expect. None of the retained public sources gave a post-money
              valuation, full cap table, or a current cash balance. The other notable signal is structural rather than
              numeric: Carvana’s March 2026 proxy disclosed a 2025 warrant from an unnamed private consumer products
              company tied to a Mark Walter ownership overlap, and TechCrunch linked that warrant to Slate via Delaware
              paperwork. Even if that tie-up remains unconfirmed by the parties, it suggests Slate’s future financing
              story may blend strategic distribution or commercial optionality with plain venture equity.
