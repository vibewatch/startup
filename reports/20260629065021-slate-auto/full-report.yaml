        title: Factory economics, cost structure, and gross-margin constraints
        blocks:
          - type: paragraph
            body: >-
              Slate’s cost story is built around simplifying both the product and the plant. Company-linked and local
              coverage describe the Warsaw factory investment at nearly $400 million, while local abatement reporting
              points to a more explicit $363 million package split roughly between real-estate work and equipment.
              IDEM’s January 2026 notice confirms the site was still working through permit steps for new emitting units
              at the assembly plant, which is a reminder that launch capital is tied to a still-moving industrial
              project rather than a finished line. On the gross-margin side, Slate is removing obvious cost centers: no
              traditional paint shop, a single baseline configuration, manual windows, owner-device infotainment instead
              of a full connectivity stack, outsourced service capacity through RepairPal, and a direct-sales model.
              Those choices may lower fixed cost relative to a traditional dealer-plus-plant footprint, but they do not
              eliminate warranty exposure, certification risk, or the need for a credible bill-of-materials bridge.
              Management’s positive-gross-margin claim therefore remains a thesis, not a verified financial result.
