  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer jobs
        blocks:
          - type: paragraph
            body: >-
              Slate’s customer base is easiest to understand as three overlapping launch segments rather than one
              monolithic “EV truck buyer.” The first segment is the price-sensitive direct buyer who wants the cheapest
              credible new EV utility vehicle and is willing to live with crank windows, no fixed infotainment screen,
              and a narrow feature set if the up-front payment stays meaningfully below mainstream EV alternatives. The
              second segment is the DIY and personalization cohort. Slate is unusually explicit that the vehicle is
              meant to be wrapped, accessorized, modified, and even converted into an SUV over time, which appeals to
              buyers who see the truck as a platform rather than a finished trim package. The third segment is
              light-duty fleet and commercial use, where the selling points are compact size, simple maintenance, easy
              branding, and the ability to adapt a single base vehicle across multiple jobs. What Slate does not show
              yet is a real mix by revenue or unit volume. The public evidence is strong on intended buyer jobs, but
              still thin on which segment is actually paying the company today.
