      - number: '2.3'
        title: >-
          Buyer-user-payer segmentation: strongest fit sits with price-sensitive households, DIY owners, and constrained
          small businesses
        blocks:
          - type: paragraph
            body: >-
              Slate's most plausible early segments are not identical even if they all react to the same affordability
              problem. In consumer use cases, the buyer, user, and payer are often the same person or household, which
              makes sticker price, monthly payment, charging access, and willingness to self-configure central gating
              variables. That points toward value-oriented households, commuters with dedicated parking, DIY owners who
              like modular upgrades, and lifestyle buyers who want a truck form factor without full-size truck cost. In
              business use cases, the buyer and payer shift to an owner-operator, contractor, or small-fleet manager,
              while the user may be an employee. Those buyers care more about uptime, charging logistics, service
              coverage, and the lost commercial credit. Across both groups, direct sales and limited pickup centers
              compress the reachable segment further: interest is not enough unless the buyer can tolerate a preorder
              queue, late-2026 delivery, and nontraditional service logistics.
