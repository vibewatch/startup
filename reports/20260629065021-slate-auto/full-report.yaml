      - number: '7.2'
        title: Homologation, Environmental, and Policy Risk
        blocks:
          - type: paragraph
            body: >-
              Slate’s affordability story does not exempt it from automotive compliance complexity. NHTSA’s public
              guidance makes clear that a new U.S. manufacturer still has to submit VIN-decoding information before
              first sale, identify the manufacturer formally, and certify each vehicle to applicable FMVSS through
              labeling and self-certification. Slate already appears in NHTSA’s manufacturer database, but that is a
              registration signal rather than evidence that a production truck has cleared every launch gate. On the
              factory side, IDEM’s public notice shows Re:Car dba Slate Auto moved into a live FESOP process for the
              Warsaw assembly plant, with room for comments and final permit conditions that can still shape timing or
              operating constraints.


              Policy risk compounds the compliance burden. TechCrunch’s reporting and IRS guidance together show the
              original “under $20,000” framing depended on a federal credit landscape that changed, forcing Slate’s
              value proposition to stand more directly on unsubsidized economics. Meanwhile, the White House’s
              reciprocal-tariff posture keeps trade-policy volatility live even for a domestically assembled vehicle,
              because upstream components and materials still move through global supply chains. Longer term, NHTSA’s
              new AEB rule is a reminder that safety content requirements tighten over time, which matters for any
              automaker betting that simplicity alone preserves a durable cost advantage.
            claimRefs:
