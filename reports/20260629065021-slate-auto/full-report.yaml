      - number: '5.3'
        title: Repairability, service, and trust stack
        blocks:
          - type: paragraph
            body: >-
              Slate’s most distinctive non-manufacturing bet is that repairability and support can be outsourced and
              partially democratized without destroying the ownership experience. Official materials promise free
              manuals, diagnostics, Slate U tutorials, direct owner maintenance, accessory installation before delivery
              or afterward, and a RepairPal-backed national service footprint for customers who do not want the DIY
              path. That aligns tightly with the company’s minimalist hardware philosophy: fewer moving parts, fewer
              bundled electronics, and more owner agency.


              The risk is that this support model is still substantially theoretical. Slate’s own pages disagree on
              whether the network is 3,000 or 4,000-plus shops, while the RepairPal fine print says warranty service may
              not be available everywhere and that centers are typically within 100 miles rather than immediately local.
              High-voltage service coverage is narrower still at 200-plus EV-certified sites. Warranties are generous on
              paper, but the public record does not yet show real field performance, reimbursement economics, or how
              smoothly customers will move between DIY content, partner shops, and any future Slate-controlled digital
              surfaces.
