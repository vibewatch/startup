  - id: TV003
    title: Comparable valuation table
    columns:
      - Comparable
      - Public valuation or funding anchor
      - Proof / revenue anchor
      - Why it matters for Slate
      - Key limitation
    rows:
      - - Slate Auto
        - $650M Series C; no disclosed post-money; low-reputation rumor >$3B
        - 160K+ reservations at round close; 180K+ by late June; still pre-revenue publicly
        - Closest fact pattern and the reason price discipline matters
        - Round terms and current cash remain undisclosed
      - - Harbinger
        - $160M Series C; $358M total raised
        - FedEx order for 53 vehicles beginning in 2025
        - Shows a private EV manufacturer with smaller financing but earlier customer-backed proof
        - Medium-duty fleet trucks are not cheap consumer pickups
      - - Rivian
        - $20.98B market cap; ~3.8x market-cap / TTM revenue proxy
        - $5.52B TTM revenue
        - Useful public U.S. EV OEM benchmark for scale without sustained profitability
        - Much larger brand, plant base, and vehicle portfolio than Slate
      - - Lucid
        - $2.31B market cap; ~1.65x market-cap / TTM revenue proxy
        - $1.40B TTM revenue
        - Shows how public markets can compress EV OEMs even with real delivered revenue
        - Premium luxury positioning is far from Slate’s price point
      - - Tesla
        - $1.426T market cap; ~14.6x market-cap / TTM revenue proxy
        - $97.87B TTM revenue; audited 2025 10-K filed January 2026
        - Represents the scaled disclosure and scarcity upper bound, not a realistic near-term Slate multiple
        - Scale, profitability optionality, and data quality are incomparable
      - - Canoo
        - Chapter 7 liquidation; assets later sold for about $4M
        - Less than $50K in assets and $10M-$50M liabilities at filing
        - Best adverse reminder that EV capital can collapse if proof and liquidity slip
        - Failure path is an extreme downside, not a normal operating comparable
    notes: >-
      This comparable set is intentionally partial rather than exhaustive. It mixes private financings, public market
      proxies, and a distress case because no single bucket explains Slate’s pre-launch valuation problem on its own.
    enumerationScope:
      coverage: partial
      basis: >-
