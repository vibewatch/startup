  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Implied valuation logic
      - Probability signal
      - Why it could fail
    rows:
      - - Bear
        - 15K annual units; $28K realized revenue per unit; weak conversion; bridge financing needed
        - $420M revenue at ~0.8x-1.2x implies about $0.34B-$0.50B of value
        - Meaningful risk if production normalization slips and preorder conversion disappoints
        - Could be worse if certification or financing breaks before scale
      - - Base
        - 40K annual units; $30K realized revenue per unit; moderate conversion; no early recap required
        - $1.2B revenue at ~1.4x-1.8x implies about $1.68B-$2.16B of value
        - Most defensible public-evidence path if Slate launches and ramps unevenly but successfully
        - Still assumes much better execution than current public throughput
      - - Bull
        - 80K annual units; $32K realized revenue per unit; strong conversion and accessory mix; no major launch slip
        - $2.56B revenue at ~1.8x-2.5x implies about $4.61B-$6.40B of value
        - Requires Slate to move quickly toward management’s own break-even scale
        - Needs unusually strong capital efficiency for a first-time automaker
      - - If the next round prices above $3B
        - Investor pays before public proof of normal production, margins, or conversion
        - Entry is already above base-case fair value and leaning into the bull case
        - That can still work, but only with a real margin-of-safety collapse if 2027 capital is needed
        - A flat or down round becomes much easier to imagine
    notes: >-
      All scenario values are analyst estimates derived from public evidence, not company guidance. They are designed to
      frame price discipline rather than to claim forecasting precision.
