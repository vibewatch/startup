            body: >-
              Because Slate is still pre-revenue publicly, the cleanest way to value it is to reverse-engineer revenue
              and apply conservative public-market proxies. The scenario math here is explicit and intentionally simple:
              realized revenue per unit is built from the now-public base price, the SUV conversion upsell, and a modest
              accessory contribution, while annual unit cases reflect the gap between beta production, late-2026 launch
              goals, and management’s 80,000-unit break-even target. That yields a bear case around $420 million of
              revenue, a base case around $1.2 billion, and a bull case around $2.56 billion. Applying comp-informed
              revenue bands then produces a wide valuation spread from roughly $0.34 billion to $0.50 billion in the
              bear case, $1.68 billion to $2.16 billion in the base case, and $4.61 billion to $6.40 billion in the bull
              case. The key implication is straightforward: if the real private mark is around or above $3 billion, the
              next investor is already paying beyond the base case. That is where down-round risk begins to matter if
              2027 funding arrives before conversion and normal production are proven.
            claimRefs:
