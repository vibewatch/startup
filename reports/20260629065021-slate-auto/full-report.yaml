  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Slate is creating an affordable utility EV niche, not chasing premium electric trucks'
        blocks:
          - type: paragraph
            body: >-
              Slate's buyer-facing offer defines the relevant market more narrowly than the phrase “EV pickup” suggests.
              At $24,950, with a stripped-down two-seat base configuration, optional SUV conversion, and a direct-sales
              model, Slate is targeting buyers who want affordable utility and personalization rather than full-size
              towing, luxury interiors, or early-adopter status. That puts the most relevant substitute boundary around
              compact, value-oriented utility vehicles such as the Ford Maverick and around used EVs that now sit near
              gasoline parity, while premium EV trucks such as the F-150 Lightning and Rivian R1T mostly anchor the “too
              much truck, too much money” end of the comparison set. The result is a market definition that includes
              low-cost work-and-lifestyle utility spend, excludes heavy-duty hauling and premium adventure EV spend, and
              treats used EVs, compact crossovers, and hybrid compact trucks as real status-quo substitutes.
