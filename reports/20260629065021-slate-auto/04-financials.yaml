- id: TI002
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public status / value
  - Revenue quality
  - Diligence ask
  rows:
  - - Base truck sale
    - Direct sale of base two-seat EV truck
    - List MSRP public at $24,950; realized ASP unknown
    - Medium until gross-to-net is disclosed
    - Request pricing waterfall after fees, destination, financing, and incentives.
  - - SUV conversion / body style upsell
    - Squareback or Fastback conversion on same platform
    - Public starting points at $29,950 / $31,950
    - Medium; mix and attach still unknown
    - Request expected body-style mix and gross margin by variant.
  - - Wraps and accessories
    - After-sale personalization and utility accessories
    - 175+ accessories public; most under $500; some wraps up to ~$1,600
    - Low today because attach rate is unknown
    - Request attach-rate assumptions and gross margin by major accessory family.
  - - Financing and purchase services
    - Financing options promised as delivery nears
    - Publicly mentioned; economics undisclosed
    - Low
    - Request any lender economics, commissions, or captive-finance plans.
  - - Service and accessorization labor
    - RepairPal or partner-network service plus warranty work
    - Partner network public; revenue-share economics undisclosed
    - Low
    - Clarify whether Slate captures service gross profit or only avoids owned-service capex.
  - - Fleet sales
    - Fleet page and outreach exist, but no contract values are public
    - No disclosed fleet revenue or named binding customers
    - Low
    - Request pilot, fleet LOI, and margin assumptions by commercial segment.
  notes: Slate’s public revenue model is credible conceptually but mostly unproven financially; realized ASP and attach rates
    are the missing bridge.
