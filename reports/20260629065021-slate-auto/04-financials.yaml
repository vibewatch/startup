- id: burn-runway-financing-dependency
  title: Burn, runway, and financing dependency scenario framing
  body: 'Public investors can estimate parts of Slate’s cash story, but they cannot actually close it from disclosed sources.
    The company has said how much money it has raised, yet it has not said how much of that capital remains after factory
    work, engineering, certification, payroll, tooling, and launch preparation. Deposit economics help frame the scale mismatch:
    160,000 refundable reservations imply roughly $8 million of float, while a theoretical 180,000 fully paid $300 preorders
    would imply $54 million before adjusting for legacy $250 net orders and non-conversion. Either number is small relative
    to a disclosed factory spend band of roughly $363 million to $400 million. Management also declined to discuss runway
    while confirming it remains open to raising additional money as ramp approaches. The prudent scenario frame is therefore
    conditional: if certification, tooling, and preorder conversion stay on schedule, Slate may bridge into early deliveries
    without an emergency round; if the Q4 production timeline slips, additional equity or another strategic capital source
    becomes more likely because no public debt or project-finance facility has been disclosed.'
