- id: TI004
  title: Unit economics and margin-driver table
  columns:
  - Driver
  - Public fact / estimate
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Vehicle gross margin target
    - Management says every vehicle should be gross-margin positive.
    - medium
    - Core claim behind the affordability thesis.
    - Request BOM and contribution-margin bridge at launch volume and at 80k units.
  - - Break-even volume
    - ~80,000 vehicles per year versus 150,000-unit capacity.
    - medium
    - Defines required utilization before the model self-funds.
    - Validate fixed-cost base and break-even assumptions by month.
  - - Single baseline configuration
    - One core vehicle before conversion and accessories.
    - high
    - Could simplify tooling and reduce line complexity.
    - Confirm whether option variability is deferred off-line or absorbed in-line.
  - - No paint shop
    - Wrap-ready composite exterior avoids a traditional paint process.
    - high
    - Potentially meaningful capex and opex savings.
    - Quantify avoided paint-shop capex and downstream wrap support costs.
  - - Direct sales model
    - No franchised dealers.
    - high
    - Could reduce channel margin leakage but adds logistics burden.
    - Request SG&A bridge for delivery, returns, and customer support.
  - - Service model
    - RepairPal plus DIY manuals / diagnostics.
    - high
    - Lower owned-service footprint, but warranty economics still matter.
    - Request warranty reserve assumptions and partner reimbursement terms.
  - - Warranty stack
    - 10-year/110k battery-powertrain and 4-year/50k bumper-to-bumper.
    - high
    - Longer coverage can pressure gross margin if reserves are understated.
    - Review actuarial reserve model by failure mode.
  - - Sales mix upside
    - Management expects SUVs to represent ~60% of sales.
    - medium
    - Higher-price variants could rescue realized ASP and margin.
    - Request margin by body-style mix and accessory bundle.
  notes: Rows mix verified facts and management targets; any underwriting model should isolate company claims from independently
    verified inputs.
