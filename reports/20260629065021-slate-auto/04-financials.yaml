    - Inferred from no-runway disclosure and ongoing fundraising openness
    - Additional equity or strategic capital becomes more likely if Q4 ramp moves right.
  - - Debt / project finance
    - No public facility disclosed
    - Retained public sources and regulatory review
    - Equity appears to remain the visible funding instrument.
