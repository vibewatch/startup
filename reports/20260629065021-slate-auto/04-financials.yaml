- id: TI007
  title: Public financial gaps table
  columns:
  - Missing item
  - Why it matters
  - Current public status
  - Exact diligence path
  rows:
  - - Cash on hand
    - Directly determines runway into launch and ramp
    - Not disclosed
    - Request latest cash balance, minimum-liquidity covenant, and month-end bridge.
  - - Monthly burn
    - Needed to map financing dependency under delay scenarios
    - Not disclosed
    - Request monthly actuals plus management base/bear cash plan through 2027.
  - - Post-money valuation and cap table
    - Required for dilution and downside ownership math
    - Not disclosed publicly
    - Obtain closing cap table and term summary for the Series C.
  - - Debt / project-finance facilities
    - Changes risk allocation between equity and lenders
    - No public facility disclosed
    - Request all equipment finance, vendor finance, or warehouse-line documents.
  - - Accessory attach and realized ASP
    - Headline MSRP alone does not explain margin viability
    - Not disclosed
    - Request cohort conversion, attach, and gross-to-net waterfall by body style.
  - - Gross-margin bridge and BOM
    - Management claims cannot be tested without cost stack
    - Not disclosed
    - Request BOM, supplier quotes, battery assumptions, and warranty reserve model.
  - - Warranty reserve assumptions
    - Long coverage could change unit economics materially
    - Not disclosed
    - Review actuarial assumptions and failure-rate sensitivities.
  - - Certification timeline
    - Delay here extends pre-revenue burn
    - Open workstream as of late June 2026
    - Request homologation workback and contingency plan.
  - - Final incentive agreements
    - Abatement economics affect fixed cost and downside protection
    - Only local summary level visibility
    - Pull signed county/state incentive documents and clawback terms.
  notes: These are the missing items that keep Slate in “research more” territory from a financial underwriting perspective.
