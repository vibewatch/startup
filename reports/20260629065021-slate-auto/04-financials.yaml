tables:
- id: TI001
  title: Funding and capital-structure signals
  columns:
  - Signal
  - Public detail
  - Quality
  - Why it matters
  - Open diligence item
  rows:
  - - 2026 Series C
    - Slate disclosed a $650M round led by TWG Global.
    - high
    - Latest large equity infusion for launch and ramp.
    - Confirm close date, major participants, and any tranched commitments.
  - - Cumulative capital
    - Public reporting after the round points to roughly $1.4B raised to date.
    - high
    - Shows unusually deep equity backing for a pre-revenue automaker.
    - Reconcile gross raised versus cash still available.
  - - Strategic investor base
    - Backers publicly linked to Bezos/Walter/General Catalyst/Slauson/Piacentini.
    - medium
    - Repeat insiders may support follow-on financing if timelines slip.
    - Request investor rights, follow-on obligations, and board control.
  - - Carvana warrant
    - Carvana proxy disclosed a 2025 warrant from a private consumer products issuer valued at $1.5M.
    - high
    - Potential commercial or distribution optionality beyond plain equity.
    - Determine whether the issuer is Slate and whether any warrant has vested or been exercised.
  - - Post-money valuation
    - Not publicly disclosed in retained sources.
    - medium
    - Dilution, downside, and ownership modeling remain blocked.
    - Obtain the Series C term sheet summary and cap table.
  - - Debt / project finance
    - No public facility disclosed.
    - medium
    - Implies equity may still bear most launch and ramp risk.
    - Ask whether any equipment finance, vendor debt, or inventory line exists.
  notes: Public sources establish equity depth and a few strategic signals, but not the current cap table or residual liquidity.
