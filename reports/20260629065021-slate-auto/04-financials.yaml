- id: public-traction-vs-private-gaps
  title: Public traction proxies versus private financial gaps
  body: Slate is unusual in that public traction is not the same thing as public financial disclosure. The company can point
    to more than 160,000 reservations by April, more than 180,000 by late June, active plant retooling in Warsaw, a direct-to-consumer
    checkout flow, a visible accessory catalog, and a service/warranty framework. Those are real operating signals. But none
    of them substitute for the missing finance package that a diligence team would need to underwrite the story credibly.
    No retained source disclosed realized revenue, cash on hand, monthly burn, runway, gross margin at unit level, warranty
    reserve assumptions, projected accessory attach rate, final incentive contracts, or a post-money cap table. Even the strongest
    public demand indicators are still soft until Slate reports what percentage of reservation holders become paying buyers
    and at what realized gross-to-net price. In other words, the public story is directionally encouraging, while the investable
    financial model remains mostly private.
