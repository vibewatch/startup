- id: pricing-reservations-monetization
  title: Pricing, reservation economics, and revenue model
  body: 'The pricing stack is finally concrete enough to analyze. Slate’s public list price is $24,950 for the base truck,
    with the Squareback and Fastback SUV configurations at $29,950 and $31,950. That makes the product headline-cheap by U.S.
    EV standards, but the economics hinge on what happens after the headline price. Reservations originally cost a refundable
    $50, whereas preorders require a non-refundable $300 deposit, or $250 net for customers who already paid the reservation
    fee. That means reservation counts are a weak proxy for revenue quality: they signaled attention, not committed unit economics.
    Slate’s actual monetization logic is base-vehicle plus upsell — wraps, accessories, SUV conversions, financing options,
    and service support — with the company publicly touting more than 175 accessories and a product catalog where most items
    fall below $500. The central underwriting question is therefore not whether people like the $24,950 headline, but whether
    attach rates and conversion behavior lift realized ASP and contribution margin above a thin base-truck starting point.'
