- id: financial-verdict
  title: Financial verdict and key diligence blockers
  body: 'The financial verdict on Slate is not that the company lacks capital; it is that the public record still makes capital
    adequacy impossible to prove. The upside case is easy to articulate: a $24,950 entry point wins attention, a high-SUV/high-accessory
    mix raises realized ASP, simple manufacturing keeps the bill of materials lean, and a heavily funded launch gets to scale
    before the next fundraise becomes urgent. The downside case is equally clear. This is still a pre-revenue EV startup trying
    to move from prototypes and hand-built units into normal production within months, while permits, certification, warranty
    exposure, and delivery logistics remain live execution items. The most skeptical public source in this chapter argues
    that the disclosed raise may still understate what a production-scale EV program usually consumes. The right diligence
    stance is therefore research-more rather than buy the narrative at face value: verify the cash bridge, BOM, reserve model,
    preorder conversion funnel, and final incentive terms before treating the current capital base as sufficient.'
  claimRefs:
  - CI031
  - CI032
  - CI037
  - CI038
  - CI041
