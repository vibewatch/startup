company:
  name: Slate Auto
chapter:
  number: 4
  title: Financials
  summary: Slate is still pre-revenue publicly, but it has disclosed an unusually deep equity base of roughly $1.4 billion
    cumulative capital, including a $650 million Series C, to fund a Warsaw factory project that public sources size at roughly
    $363 million to $400 million. Pricing is now concrete at $24,950 for the base truck and $29,950 to $31,950 for SUV variants,
    yet cash on hand, burn, runway, realized ASP, and margin detail remain undisclosed. The underwriting hinge is whether
    direct-to-consumer launch and accessory upsell can offset manufacturing-ramp risk before Slate needs more capital.
sections:
- id: funding-capital-signals
  title: Funding base and capital-structure signals
  body: 'Slate has already solved one problem that kills many EV startups: access to equity capital. Public sources point
    to roughly $1.4 billion of cumulative disclosed funding after a $650 million Series C led by TWG Global, with repeat backing
    around Bezos- and Walter-linked capital. That is a large war chest for a company still targeting first deliveries rather
    than reporting them. But the round does not come with the disclosures public-market investors would expect. None of the
    retained public sources gave a post-money valuation, full cap table, or a current cash balance. The other notable signal
    is structural rather than numeric: Carvana’s March 2026 proxy disclosed a 2025 warrant from an unnamed private consumer
    products company tied to a Mark Walter ownership overlap, and TechCrunch linked that warrant to Slate via Delaware paperwork.
    Even if that tie-up remains unconfirmed by the parties, it suggests Slate’s future financing story may blend strategic
    distribution or commercial optionality with plain venture equity.'
