  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-c-valuation-disclosure
    missingEvidence: Post-money valuation, share count, liquidation stack, and investor ownership for the 2026 Series C.
    whyItMatters: Without cap-table detail, dilution risk and next-round ownership math cannot be underwritten.
    diligencePath: Request the board-approved financing summary, post-close cap table, and major investor side-letter summary.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI001
    - TI007
  - type: missing-source
    severity: material
    topic: cash-burn-runway
    missingEvidence: Current cash on hand, monthly burn, committed capex schedule, and runway bridge through launch.
    whyItMatters: Runway is the core question for a capital-intensive pre-revenue automaker; cumulative money raised is not
      the same thing as cash still available.
    diligencePath: Obtain the latest board deck or CFO operating plan with monthly cash waterfall, capex cadence, and downside-case
      liquidity triggers.
    relatedQuestionRefs:
    - QI016
    - QI022
    relatedTableRefs:
    - TI005
    - TI007
  - type: missing-source
    severity: material
    topic: incentive-terms
    missingEvidence: Official county or state resolutions confirming the final abatement schedule, clawbacks, and any performance
      conditions.
    whyItMatters: Factory economics and downside protection change materially if tax relief or grant timing differs from local
      summaries.
    diligencePath: Pull the signed county-council resolution, any state incentive contract, and the jobs-or-investment covenants
      tied to them.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI006
    - TI007
  - type: missing-source
    severity: material
    topic: realized-asp-and-attach-rate
    missingEvidence: Expected preorder conversion, accessory attach rate, SUV mix by cohort, and realized ASP gross-to-net
      bridge.
    whyItMatters: The low base-truck price leaves little room for error if accessories and SUV conversions do not lift realized
      gross profit.
    diligencePath: Request preorder funnel metrics, cohort conversion assumptions, and the internal accessory-attach model
      used for the 2027 budget.
    relatedQuestionRefs:
    - QI005
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
    - TI007
  - type: missing-source
    severity: blocking
    topic: gross-margin-bom
    missingEvidence: Bill of materials, battery-cost assumptions, warranty reserve model, and gross-margin bridge at 10k,
      50k, and 80k units.
    whyItMatters: Management’s gross-margin-positive claim cannot be tested without the cost stack and reserve assumptions.
    diligencePath: Request the detailed BOM, target commodity assumptions, supplier quotes, and contribution-margin bridge
      used in the launch plan.
    relatedQuestionRefs:
    - QI014
    - QI020
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
    - TI007
  - type: missing-source
    severity: material
    topic: launch-certification
    missingEvidence: Detailed certification timeline for safety, range, and other federal approvals required before customer
      deliveries.
    whyItMatters: A slip in certification timing would likely extend pre-revenue burn and change financing dependency.
    diligencePath: Request the homologation workback schedule, open test items, and contingency plan if approvals slip beyond
      Q4 2026.
    relatedQuestionRefs:
    - QI015
    - QI024
    relatedTableRefs:
    - TI005
    - TI007
