  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: A public dataset that isolates U.S. demand for sub-$30k electric pickups or comparable modular utility EVs by buyer income and vehicle use case.
    whyItMatters: Without a direct segment dataset, TAM, SAM, and SOM must rely on constrained proxy lenses rather than a defensible category total.
    diligencePath: Request paid segment data from Cox, S&P Global Mobility, Experian, or registration microdata by price band and body style; pair with OEM preorder conversion data if available.
    relatedQuestionRefs:
    - QM009
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: reservation-demand
    missingEvidence: Current reservation, preorder, and cancellation counts for Slate by geography and buyer type.
    whyItMatters: Preorder volume is the clearest near-term SOM signal, but the company has not published enough detail to distinguish curiosity from conversion-ready demand.
    diligencePath: Ask management for the live preorder funnel, deposit conversion rates, and waitlist mix by consumer versus business buyer.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM005
  - type: conflicting-data
    severity: material
    topic: slate-range-specs
    missingEvidence: A final EPA-facing range and battery specification sheet for the production-intent Blank Slate configuration.
    whyItMatters: The current official 205-mile marketing message does not line up cleanly with earlier third-party coverage describing 150-mile and 240-mile pack options, so buyer economics remain partially unsettled.
    diligencePath: Obtain the final order guide, homologation materials, and EPA certification targets once the production configuration is locked.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: service-footprint
    missingEvidence: The geographic footprint of Slate pickup centers, home-delivery coverage, and RepairPal-certified service capacity before first deliveries.
    whyItMatters: Direct-sales convenience and service coverage determine whether the nominal national market is actually reachable by mainstream utility buyers.
    diligencePath: Request launch-market rollout plans, service-partner contracts, and pickup-center opening milestones by metro area.
    relatedQuestionRefs:
    - QM013
    - QM026
    relatedTableRefs:
    - TM003
    - TM005
  - type: private-evidence-only
    severity: minor
    topic: buyer-finance-insurance
    missingEvidence: Slate-specific financing APRs, insurance quotes, and monthly payment examples for core household and contractor segments.
    whyItMatters: Slate is attacking an affordability problem, but monthly carrying cost could still narrow adoption if financing and insurance price above mass-market expectations.
    diligencePath: Collect lender and insurer pilot quotes once order banks and VIN-level underwriting become available.
    relatedQuestionRefs:
    - QM024
    - QM026
    relatedTableRefs:
    - TM003
    - TM005
