- id: drivers-and-constraints
  title: 'Drivers and constraints: domestic-assembly appeal helps, but credits, charging access, and fleet energization all cut into adoption'
  body: 'The strongest adoption driver in Slate''s favor is simple: it is one of the few public attempts to push a new EV utility vehicle into a mass-market sticker band. But the company is launching after the most visible purchase subsidies have already ended, so buyers must now justify the vehicle on utility and operating economics rather than tax-credit optics. That hurts both consumer and small-business cases. Charging is improving, yet the gating issue has shifted from aggregate charger count to fit and geography. Home charging works well for households with parking access, while renters and multifamily residents face extra coordination and infrastructure burdens. On the commercial side, the grid itself becomes a bottleneck when utilities cannot energize depots in time for vehicle delivery. Trade policy is also double-edged: a more protectionist tariff regime rewards domestic assembly narratives, but it can still keep imported-content costs and industry uncertainty elevated.'
