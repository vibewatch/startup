chapter:
  number: 2
  title: Market Analysis
  summary: Slate is trying to create an affordable utility EV niche rather than compete head-on with premium electric trucks. The market is real but materially constrained by lost federal credits, charging-fit filters, and late-2026 execution risk, so the right framing is evidence-constrained TAM / SAM / SOM rather than a single heroic EV-pickup headline.
sections:
- id: market-boundary
  title: 'Market boundary: Slate is creating an affordable utility EV niche, not chasing premium electric trucks'
  body: Slate's buyer-facing offer defines the relevant market more narrowly than the phrase “EV pickup” suggests. At $24,950, with a stripped-down two-seat base configuration, optional SUV conversion, and a direct-sales model, Slate is targeting buyers who want affordable utility and personalization rather than full-size towing, luxury interiors, or early-adopter status. That puts the most relevant substitute boundary around compact, value-oriented utility vehicles such as the Ford Maverick and around used EVs that now sit near gasoline parity, while premium EV trucks such as the F-150 Lightning and Rivian R1T mostly anchor the “too much truck, too much money” end of the comparison set. The result is a market definition that includes low-cost work-and-lifestyle utility spend, excludes heavy-duty hauling and premium adventure EV spend, and treats used EVs, compact crossovers, and hybrid compact trucks as real status-quo substitutes.
