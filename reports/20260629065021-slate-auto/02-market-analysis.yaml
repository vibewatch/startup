- id: constrained-sizing
  title: 'Constrained sizing: the limiting factor is affordability and fit, not the broad EV TAM headline'
  body: 'Accessible public evidence does not support a clean classical TAM for sub-$30k electric pickups, so the more honest framing is a constrained set of lenses. The broad EV market is real but currently in a trough: Q1 2026 sales fell 27% year over year and share sat at 5.8%, versus 10.5% in the Q3 2025 incentive rush. At the same time, long-run forecasts still cluster around roughly one-fifth to one-quarter of U.S. passenger sales by 2030, which means the growth story is delayed rather than dead. The immediate commercial insight is that Slate''s $24,950 sticker sits against an average EV transaction price above $57,000 and an average new vehicle price above $50,000. That creates a real affordability wedge, but it does not make the entire EV TAM addressable; Slate still has to pass utility-fit, charging-fit, and direct-sales-fit filters before broad EV interest becomes real demand.'
