- id: substitutes-switching-and-distribution
  title: Substitutes and distribution power are the nearer-term threat
  body: 'For mass-market conversion, the sharpest competitive pressure comes from substitutes rather than from Cybertruck envy. Ford Maverick is the clearest example: it sits only a few thousand dollars above Slate on list price, yet offers a familiar ownership experience, an available 4,000-pound tow rating, and the comfort of a mature dealer and service ecosystem. Efficient compact crossovers reinforce the same problem from a different angle. Toyota''s RAV4 and Honda''s CR-V Hybrid stay near the low-$30,000s to upper-$30,000s while offering mainstream practicality, fuel economy, and instant availability. Even used vehicles continue to matter because Cox reports used prices are still holding up in 2026 rather than collapsing. That means buyers who want value have several proven ways to avoid a startup launch. Slate''s direct-sales model may lower structural cost, but Ford and GM product pages still route customers to local dealers and inventory today. Until Slate publishes a comparable
    service and delivery map, distribution remains an incumbent advantage rather than a neutral variable.'
