- id: TP006
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation or diligence ask
  rows:
  - - Cheapest new EV truck entry price
    - Ford, Rivian, or another OEM launches a sub-$35k EV faster than Slate scales
    - High
    - Model post-incentive gross margins and monitor 2027 affordable-EV roadmaps
  - - DIY modularity and low-cost personalization
    - Buyers may see low feature content as cheapness rather than freedom
    - Medium
    - Track attach rates for SUV kits, wraps, and accessories by reservation cohort
  - - Compact urban-truck positioning
    - Maverick, crossovers, and used trucks already solve the same light-duty job
    - High
    - Test conquest rates from compact trucks and hybrids instead of premium EVs
  - - Direct-sales cost structure
    - Lack of visible service footprint can suppress conversions and repeat demand
    - High
    - Demand launch-market service map, turnaround SLAs, and third-party repair partnerships
  - - Fresh affordable-EV narrative
    - Startup peers like Canoo show that affordability alone does not guarantee survival
    - High
    - Stress-test balance sheet, certification cadence, and production ramp assumptions
  - - Potential first-mover window in compact EV trucks
    - TELO or future OEM offerings arrive after Slate proves the category
    - Medium
    - Assess whether software, community, or fleet relationships deepen before copycats launch
  notes: Severity is analytical judgment based on current evidence. This register is intentionally adverse because the chapter must preserve structural weaknesses, not just differentiation claims.
