company:
  name: Slate Auto
chapter:
  number: 3
  title: Competitors
  summary: 'Slate now has a credible 2026 launch price point at $24,950, but the competitive picture is bifurcated: direct EV pickup rivals are far more capable and expensive, while the more dangerous substitutes are cheaper conventional trucks, hybrids, and used vehicles that carry less execution risk. Slate''s moat is real on modularity and entry price, but structurally weak on service footprint, certification proof, and long-range / towing performance.'
sections:
- id: landscape-overview
  title: 'Landscape: premium EV trucks above, compact substitutes below'
  body: 'Slate now enters the market with a clearer commercial position than it had in 2025: the June 2026 preorder update reset the product around a $24,950 starting price, a 205-mile range target, and a stripped-down two-seat base truck that can later become a five-seat SUV. That price leaves Slate far below the headline EV truck incumbents — Tesla Cybertruck, Ford F-150 Lightning, Rivian R1T, Chevrolet Silverado EV, and GMC Sierra EV — but it also means the company is not really competing for the same buyer job those trucks emphasize. The full-size EV set sells range, towing, and brand-backed service reach; Slate sells low entry price, modularity, and the idea that buyers can start with a minimal truck and add only what they value. The more dangerous comparison set therefore sits lower in the ladder: Ford Maverick, efficient compact crossovers, and even used ICE trucks. Those alternatives already exist at scale, are easier to service, and often solve the same practical commuting-and-light-hauling
    job without asking customers to accept a startup launch risk.'
