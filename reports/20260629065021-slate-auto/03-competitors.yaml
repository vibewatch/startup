  evidenceGaps:
  - type: missing-source
    severity: material
    topic: service-network
    missingEvidence: A public map, count, and opening schedule for Slate retail, delivery, and service points before launch.
    whyItMatters: Direct sales only help if customers can get vehicles delivered and repaired quickly; without footprint evidence, incumbents retain a trust edge.
    diligencePath: Request Slate's launch-market service plan, third-party repair partnerships, and expected mobile-service coverage by metro.
    relatedQuestionRefs:
    - QP018
  - type: missing-source
    severity: material
    topic: launch-readiness
    missingEvidence: Public certification milestones, crash/safety status, and plant SOP evidence tied to the fourth-quarter 2026 delivery target.
    whyItMatters: Competitive timing matters because affordable EV headlines can be copied quickly; if launch slips, Maverick, R2, or Ford's future platform gain time.
    diligencePath: Ask management for homologation status, supplier PPAP completion, and the first customer-build date from Warsaw.
    relatedQuestionRefs:
    - QP019
  - type: private-evidence-only
    severity: material
    topic: reservation-conversion
    missingEvidence: Reservation-to-order conversion, cancellation, and paid-down-payment data by body style and option bundle.
    whyItMatters: Reservations are not demand quality; conversion determines whether Slate really has a defensible installed base before larger rivals respond.
    diligencePath: Request weekly reservation funnel data, paid order conversion by geography, and cancellation reasons segmented by truck versus SUV kit.
    relatedQuestionRefs:
    - QP026
