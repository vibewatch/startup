- id: moat-durability-and-risk
  title: Slate's moat is real on price and modularity, weak on readiness and service
  body: 'Slate does have a real wedge: no incumbent currently offers a $24,950 EV truck with this level of body-style flexibility, DIY personalization, or low-cost accessories. That gives the company a distinct story for urban buyers, fleets that want simple light-duty vehicles, and consumers who view cars more like configurable consumer products. But the moat is narrow because it depends on criteria incumbents do not need to optimize. The company is structurally weaker wherever buyers care about range, towing, four-door practicality, or guaranteed repair coverage. It is also weaker if affordability buyers start cross-shopping against Maverick, hybrids, or used trucks instead of against premium EV pickups. The adverse evidence is hard to ignore: Canoo already failed, Telo still has commercialization risk, and Slate itself still needs to prove certification, launch timing, and service coverage. The conclusion is not that Slate lacks differentiation; it is that its differentiation is price-led
    and execution-sensitive rather than infrastructure-led. If the launch lands cleanly, that can be enough. If it slips, bigger brands and cheaper substitutes both have room to squeeze it.'
