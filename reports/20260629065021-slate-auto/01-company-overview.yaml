- id: adverse-signals-and-key-gaps
  title: Adverse Signals and Key Remaining Gaps
  body: |-
    The two biggest public challenges to Slate's story both center on execution rather than concept. First, the headline affordability claim has weakened materially. When Slate emerged from stealth in 2025, the under-$20,000 framing depended on a federal EV tax credit that no longer exists. By June 2026 the real sticker price was $24,950 before fees, and even sympathetic coverage now frames sub-$20,000 ownership as a narrow state-incentive outcome rather than a national mass-market reality. Second, several sources question whether a stripped-down two-door truck will stay compelling once buyers add options or compare it with better-equipped small trucks and hybrids. That is not fatal, but it means Slate's true product-market test begins only when paid orders convert and vehicles ship.

    Governance and launch timing add another layer of risk. Faricy's appointment and Lewison's board exit can each be explained as normal transitions, yet together they raise the diligence premium on who actually controls strategic decisions going into production. CNBC also makes clear that Slate still had validation, certification, and full production-process milestones ahead of it as of late June 2026. Finally, the public data room is still thin where underwriting teams care most: no current valuation disclosure, no public cap table, no public headcount, no customer count, no pre-launch revenue, and no reservation-conversion statistics. Those absences do not negate the company, but they do prevent later chapters from treating the launch story as de-risked.
