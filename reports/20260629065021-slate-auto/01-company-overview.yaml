- calloutType: risk
  title: Reservation scale is impressive, but the affordability narrative has already weakened
  body: Slate's official and reported reservation numbers are strong, but they were built first on refundable $50 deposits and an earlier under-$20,000 narrative that no longer applies nationally. The operative diligence question is no longer 'can Slate attract interest?' but 'what fraction of interest converts into paid orders at $24,950 plus fees and accessories?'
  claimRefs:
