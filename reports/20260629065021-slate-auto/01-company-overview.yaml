company:
  name: Slate Auto
chapter:
  number: 1
  title: Company Overview
  summary: Slate Auto is a 2022-founded, privately held EV startup that grew out of Re:Build Manufacturing and now spans a Troy, Michigan corporate base, Michigan engineering, California design work, and a planned Warsaw, Indiana assembly plant. Public sources confirm a $650 million Series C in April 2026 that brought total capital to roughly $1.4 billion, more than 160,000 officially confirmed reservations with CNBC later reporting 180,000+, and first customer deliveries still targeted for late 2026. The main underwriting gaps are current post-money valuation, board composition after a Bezos-linked director exit, and whether refundable reservations will convert into durable paid demand.
sections:
- id: identity-footprint-product
  title: Identity, Footprint, and Product Architecture
  body: |-
    Slate Auto describes itself as a new American automaker built around one core proposition: a radically simple, affordable electric vehicle that owners can personalize over time instead of buying through traditional trim-package logic. Official pages emphasize that the company is designed in California and Michigan, engineered in Michigan, and manufactured in Warsaw, Indiana, while the federal NHTSA manufacturer registry lists 2716 Daley Drive in Troy, Michigan as the company address and Peter Faricy as CEO. That combination suggests the cleanest reusable identity for later chapters is not 'an Indiana startup' or 'a Bay Area startup,' but a distributed U.S. EV company with a Michigan corporate and engineering center, California design activity, and Indiana manufacturing.

    Slate's base product is a two-seat electric pickup sold direct to consumers, with add-on kits that convert it into a five-seat SUV and a broader accessory strategy that turns post-purchase personalization into part of the business model. Official product copy and June 2026 press coverage consistently frame the truck as intentionally stripped down: gray composite exterior, no paint shop, no central infotainment screen, and crank windows. The economic logic matters as much as the aesthetics. Slate is trying to remove capital-intensive manufacturing steps and feature creep so the headline vehicle can land near $25,000 rather than chasing the premium end of the EV market. As of run date, the company remains pre-delivery rather than fully commercial, but it has moved beyond pure concept stage through beta manufacturing, federal registry presence, pricing disclosure, and a live preorder process.
