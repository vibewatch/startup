- calloutType: insight
  title: Leadership and board changes are understandable for launch, but they reduce public governance clarity
  body: Faricy's appointment can be read as a deliberate move toward commercialization, while Lewison's exit can be read as a sponsor stepping back after capital formation. Both interpretations may be true. But together they mean the underwriting burden shifts toward private diligence on who now controls strategy, financing options, and launch go/no-go decisions.
