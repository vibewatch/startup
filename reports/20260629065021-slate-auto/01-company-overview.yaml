callouts:
- calloutType: strength
  title: Slate has a differentiated affordability architecture, not just a cheap-looking truck
  body: 'Slate''s strongest strategic asset is the coherence between product design and manufacturing design. The stripped-down interior, no-paint exterior, single baseline configuration, direct-sales model, and accessory-upgrade logic all serve the same goal: reducing launch capital and starting price at the same time. That is more substantive than a one-off price gimmick and explains why the company has been able to attract both capital and reservation interest.'
  claimRefs:
