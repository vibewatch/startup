  evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: An official or investor-backed Series C post-money valuation, plus board-approved valuation support such as a term sheet, 409A, or investor memo.
    whyItMatters: Without a current valuation, later chapters cannot assess whether Slate's $1.4B capital base is being raised at disciplined or deteriorating terms.
    diligencePath: Request the Series C term sheet, any board pricing memo, or a current investor deck; if unavailable, triangulate secondary marks from portfolio disclosures.
    relatedQuestionRefs:
    - QO013
    - QO029
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, observer list, and committee structure after Melinda Lewison's May 2026 departure.
    whyItMatters: Governance rights determine who can force financing, delay launch, or change strategic direction if the production ramp slips.
    diligencePath: Request the latest board list, stockholders agreement, and any side letters tied to Series B/Series C investors.
    relatedQuestionRefs:
    - QO009
    - QO026
    - QO029
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: demand-quality
    missingEvidence: Paid preorder counts, cancellation rates, and conversion by delivery window or customer cohort.
    whyItMatters: Reservation scale matters far less than conversion quality because Slate's original reservation signal was refundable and very cheap.
    diligencePath: Request weekly funnel data showing reservations, converted preorders, cancellations, and planned delivery timing by cohort.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: certification
    missingEvidence: A dated readiness view for EPA/NHTSA validation, homologation, crash, range, and production-process signoff before launch.
    whyItMatters: If certification or process readiness slips, the late-2026 delivery target and cash-use model both become less credible.
    diligencePath: Request the homologation plan, validation gate chart, and manufacturing launch checklist from program management.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: scale-disclosure
    missingEvidence: Current headcount, customer count, and any revenue or booked-order metrics before first deliveries.
    whyItMatters: These are the simplest public scale signals for whether Slate is still mostly an engineering project or has already become a commercial organization.
    diligencePath: Request an organization chart, payroll headcount, and internal KPI dashboard covering orders, customers, and revenue commitments.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: investor-ownership
    missingEvidence: Exact Series B amount, investor ownership percentages, and governance economics across Series A/B/C.
    whyItMatters: Slate's capital story is strong on totals but weak on dilution, liquidation structure, and who controls the downside if launch economics disappoint.
    diligencePath: Request the cap table, financing summaries, and board-consent package for the last two financing rounds.
    relatedQuestionRefs:
    - QO011
    - QO012
    - QO029
    relatedTableRefs:
    - TO003
