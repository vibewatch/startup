- id: capitalization-investor-base
  title: Funding History, Investor Base, and Valuation Visibility
  body: |-
    Slate is unusually well-capitalized for a company that has not yet begun customer deliveries. Official press, TechCrunch, WardsAuto, CNBC, and secondary funding coverage converge on the same top-line result: the company closed a $650 million Series C on April 13, 2026, led by TWG Global, and total capital raised reached roughly $1.4 billion. TechCrunch adds that the cap table includes General Catalyst, Bezos' family office, Slauson & Co., and former Amazon executive Diego Piacentini, while TechCrunch's May 2026 board story and CNBC's June 2025 feature imply roughly $700 million had already been raised across the first two rounds before Series C.

    Where public disclosure weakens is not the existence of capital but the exact ownership math behind it. A 2026 Tech Company News profile reports that the initial 2023 round exceeded $111 million, that a January 2025 Series B was undisclosed, and that the company may have been worth about $1.2 billion after that 2025 raise. None of the retained official or tier-one 2026 sources disclose a Series C post-money valuation, investor ownership percentages, board rights, or the exact Series B check size. This matters because Slate's capital story can be read two ways: as strong proof that sophisticated backers will fund a domestic affordable-EV thesis, or as evidence that the company still needs very heavy external capital before any customer revenue arrives. Later financial and valuation chapters should treat the public total-raised figure as solid, but the current valuation and governance rights as unresolved.
