- id: leadership-origins-governance
  title: Leadership, Founders, and Governance Visibility
  body: |-
    Slate's most visible leadership development in 2026 was the handoff from founding CEO Chris Barman to Peter Faricy. TechCrunch, Electrive, Carscoops, and CNBC all report that Faricy took over in March 2026 after prior senior roles at Amazon Marketplace, SunPower, McKinsey, and Bessemer-adjacent advisory work. Barman, a longtime Chrysler veteran and the company's first hire, moved into the President of Vehicles role and remained responsible for engineering, manufacturing, and getting the truck to market on time and on budget. That split is strategically coherent for a startup shifting from product incubation into commercial launch.

    Founder and governance visibility are less complete than executive visibility. Retained reporting consistently ties Slate's origins to Re:Build Manufacturing and the internal working name Re:Car, with Jeff Wilke identified as a co-founder and Amazon-network connector. TNW further names Re:Build CEO Miles Arnone as part of the creation story. Governance, however, is materially less transparent. TechCrunch and TNW both reported that Melinda Lewison of Bezos Expeditions left Slate's board by May 2026, removing direct Bezos-family-office board representation just months before launch. Beyond that departure and the CEO transition, the public source set does not provide a full current board roster, committee structure, or investor-governance map. For later chapters, the key takeaway is that Slate looks founder- and sponsor-shaped rather than governance-transparent.
