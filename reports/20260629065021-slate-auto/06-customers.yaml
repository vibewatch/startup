- id: durability-and-concentration-risks
  title: Reservation conversion, durability, and concentration risks
  body: The biggest weakness in Slate’s customer story is that it still sits one level above the evidence investors would really want. There are no delivered-owner cohorts, no renewal or satisfaction statistics, no disclosed reservation-to-preorder conversion rate, and no named fleet contracts that show the commercial channel is more than interest. That forces the chapter to rely on hand-raiser traction, buyer commentary, and management narrative rather than hard durability metrics. Concentration risk also matters. The story depends heavily on U.S.-only launch execution, on a direct-sales motion that asks buyers to trust a startup without a dealer network, and on accessory/SUV-kit attach rates that need to lift realized revenue per buyer. Reservation count is therefore best treated as a strong top-of-funnel signal, not as evidence that Slate has already solved conversion, retention, or fleet repeatability. Until the company discloses actual preorder conversion, early delivery fulfillment,
    and post-sale support performance, the right customer verdict remains constructive but provisional.
  claimRefs:
