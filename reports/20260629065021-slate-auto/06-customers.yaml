- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration or friction risk
  - impact
  - diligence path
  rows:
  - - Accessory and SUV-kit upsell
    - Attach rates are unproven and may fade if buyers treat Slate as a pure low-price commuter
    - Could compress realized ASP and weaken per-customer economics
    - Request early attach-rate disclosure by delivery cohort and trim path
  - - Retail direct-sales enthusiasm
    - Reservation pool may include many low-commitment bargain hunters rather than durable buyers
    - Customer count could fall sharply between reservation, preorder, and delivery
    - Request reservation-to-preorder and preorder-to-delivery conversion waterfalls
  - - Fleet diversification
    - No named fleet wins or public purchase commitments yet
    - Commercial demand may stay aspirational instead of balancing retail volatility
    - Request LOIs, pilots, and first public fleet reference accounts
  - - National service story
    - Authorized-footprint count is still fuzzy across official and media sources
    - Mainstream buyers may discount the promise if support feels ambiguous locally
    - Request a live ZIP-code service map and warranty-eligible location count
  - - Late-2026 launch narrative
    - Some independent and community signals already point to 2027 windows
    - Timing slippage could raise cancellations and damage trust
    - Request delivery-window cohort schedule and revision history
  - - U.S.-only launch
    - No international customer channel yet
    - Geographic revenue diversification is zero at launch
    - Confirm state-by-state launch restrictions and future expansion sequence
  notes: The expansion story is real, but nearly every upside driver still depends on conversion and execution rather than on delivered-owner data already visible in public.
