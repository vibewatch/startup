artifact: customers
slug: slate-auto
runDate: '2026-06-29'
company:
  name: Slate Auto
chapter:
  number: 6
  title: Customers
  summary: 'Slate’s customer story is promising but still pre-delivery: the company has unusually strong top-of-funnel evidence through 160,000-plus reservations, a visible preorder process, and active community discussion, yet it still lacks disclosed conversion, retention, or named fleet-contract proof. The likely winners are price-sensitive direct buyers, DIY personalization fans, and light-duty fleet operators, but the central risk is that enthusiasm around a cheap blank-slate concept fades once the commitment becomes a non-refundable deposit and then a roughly $25,000-$30,000 purchase. Customer diligence should therefore focus on conversion, service-footprint clarity, and first delivered-owner behavior rather than on reservation count alone.'
sections:
- id: customer-segments
  title: Customer segments and buyer jobs
  body: Slate’s customer base is easiest to understand as three overlapping launch segments rather than one monolithic “EV truck buyer.” The first segment is the price-sensitive direct buyer who wants the cheapest credible new EV utility vehicle and is willing to live with crank windows, no fixed infotainment screen, and a narrow feature set if the up-front payment stays meaningfully below mainstream EV alternatives. The second segment is the DIY and personalization cohort. Slate is unusually explicit that the vehicle is meant to be wrapped, accessorized, modified, and even converted into an SUV over time, which appeals to buyers who see the truck as a platform rather than a finished trim package. The third segment is light-duty fleet and commercial use, where the selling points are compact size, simple maintenance, easy branding, and the ability to adapt a single base vehicle across multiple jobs. What Slate does not show yet is a real mix by revenue or unit volume. The public evidence
    is strong on intended buyer jobs, but still thin on which segment is actually paying the company today.
  claimRefs:
  - CU014
  - CU015
