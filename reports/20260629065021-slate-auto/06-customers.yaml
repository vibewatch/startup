- id: traction-and-preorder-economics
  title: Reservation traction and preorder economics
  body: 'Slate has far more public demand signal than most pre-delivery EV startups, but the quality of that signal changes sharply as the buyer moves through the funnel. The original reservation was deliberately light commitment: a $50 fully refundable fee that secured a future chance to buy, not an order. By late spring 2026, public sources still cited more than 160,000 reservations, and at the June 24 reveal event management said the tally had already reached 180,000. That is a meaningful awareness and hand-raiser signal, yet it is not the same as paid demand. The next step is tougher: reservation holders receive a limited window to put down a non-refundable $300 preorder deposit, or $250 net if they already paid the reservation fee, before they have finalized accessories, financing, or exact out-the-door economics. The customer diligence question is therefore not whether Slate can attract clicks or email signups, but how many reservers convert once the purchase feels like a real five-figure
    commitment.'
