  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: slate-conversion-gap
    missingEvidence: Public reservation-to-preorder conversion, cancellation, and payment-failure cohorts by reservation month and delivery window.
    whyItMatters: Without conversion disclosure, the headline reservation count is an awareness signal rather than durable buyer proof.
    diligencePath: Request a reservation waterfall from reservations to preorders to executed purchase agreements to delivered units.
    relatedQuestionRefs:
    - QU019
    - QU026
  - type: private-evidence-only
    severity: material
    topic: slate-retention-gap
    missingEvidence: Any delivered-owner cohort, NPS, repeat-purchase, service-visit, or referral data once launch begins.
    whyItMatters: The chapter cannot make a strong durability call without post-delivery owner behavior.
    diligencePath: Request early owner cohort reporting after the first 90, 180, and 365 days of deliveries.
