  rows:
  - - Budget direct buyer
    - Individual buyer pays and uses
    - Cheap new EV utility vehicle and low-mile commuter
    - Review consensus plus reservation/preorder traction
    - Core launch volume thesis and affordability headline
    - No disclosed conversion rate from reservation to paid order
  - - DIY personalization enthusiast
    - Individual buyer pays; owner installs wraps, speakers, racks, and kits
    - Treat the vehicle as a customizable platform instead of a fixed trim
    - Official personalization page and forum enthusiasm around wraps and owner installs
    - Accessory attach and higher realized ASP upside
    - No public attach-rate or post-delivery accessory uptake data
  - - Household / family upgrader
    - Household payer; one or more riders
    - Turn a two-seat truck into a five-seat SUV as needs change
    - Official SUV-kit messaging and review coverage
    - Potential expansion beyond single-user work-truck niche
    - No public proof yet that families will accept the sparse base experience
  - - Light-duty fleet / government
    - Fleet operator or procurement team pays; staff use
    - Campus, municipal, service, maintenance, and utility-style work
    - Dedicated fleet page plus fleet-sales commentary at launch event
    - Could diversify mix away from purely retail demand
    - No named public fleet wins or signed purchase volumes
  - - Small business / vocational buyer
    - Owner-operator or small business pays and uses
    - Branded local service vehicle, compact cargo, easy wrap and accessory upfit
    - Fleet page plus Automotive Fleet reporting
    - High fit with simple upfits and local-service footprint
    - No public TCO case study or uptime proof versus incumbent ICE vans / trucks
  notes: Segmentation is based on official buyer-journey language, fleet positioning, review framing, and forum evidence. Slate does not publish a formal customer-mix split by unit, revenue, or buyer type.
