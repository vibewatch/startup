figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Journey from awareness to ownership for Slate’s main launch segments, showing where evidence is strong today and where it still depends on future execution.
  data:
    nodes:
    - id: n1
      label: Affordable-EV Awareness
      description: Budget-minded retail buyers discover Slate through media buzz about the cheapest plausible new EV truck.
    - id: n2
      label: Reservation
      description: Prospect pays a fully refundable $50 fee to secure future buying priority; commitment is intentionally light.
    - id: n3
      label: Preorder Window
      description: Reservation holder receives a delivery window and must decide within 30 days whether to convert to a non-refundable $250-$300 preorder deposit.
    - id: n4
      label: Personalize and Finance
      description: Buyer later chooses wraps, accessories, financing, and delivery method as the assigned window approaches.
    - id: n5
      label: Delivery / Pickup
      description: Customer either picks up the vehicle or pays for home delivery through Slate’s direct-sales model.
    - id: n6
      label: Service / Upgrade Loop
      description: Owner uses Slate U, authorized partners, and RepairPal-linked shops for maintenance, wraps, accessories, and possible SUV conversion.
    - id: n7
      label: Expansion Path
      description: If retail satisfaction is strong, the same platform can expand via accessory attach, second-vehicle household use, or fleet-style repeat orders.
  approximationNotes: The sequence is explicit on official buyer-journey pages, but only the first three stages have real public demand proof today. Post-delivery and repeat-order stages remain prospective.
  claimRefs:
  - CU003
  - CU006
  - CU007
  - CU013
  - CU021
  - CU046
