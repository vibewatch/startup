- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: sample
    basis: Covers the strongest public pre-delivery customer-proof examples found in forums, official pages, and fleet reporting. Slate has not yet begun normal customer deliveries, so the table relies on reservation holders, preorder community evidence, and named fleet-target commentary rather than delivered-owner case studies.
  columns:
  - customer / proof
  - segment
  - deployment / use case
  - production vs pilot
  - outcome / signal
  - limitation
  rows:
  - - eguidry and follow-on posters (SlateForums preorder thread)
    - Retail reservation / preorder community
    - Tracking assigned delivery windows and willingness to place the incremental $250-$300 preorder deposit
    - Pre-delivery preorder proof
    - Confirms that real reservation holders received preorder emails and were discussing binding next steps in real time
    - Forum self-reporting rather than verified purchase ledger
  - - ACC and other posters in second-thoughts thread
    - Price-sensitive commuter / second-vehicle shopper
    - Evaluating whether a bare-bones EV runabout is worth roughly $30k all-in
    - Pre-delivery preorder proof
    - Shows genuine buyer interest from users who want a basic commuter and no forced extras
    - Also shows willingness-to-buy is fragile once final pricing and fees are considered
  - - Forum DIY enthusiasts discussing wraps and self-install
    - DIY personalization segment
    - Ordering blank and adding wraps or accessories after delivery
    - Pre-delivery preorder proof
    - Supports that the DIY and customization value proposition is resonating with real prospects
    - Enthusiasm is anecdotal and not yet linked to paid accessory attach data
  - - State / local government, campus, and service fleets cited by Drew Walker
    - Fleet / commercial buyer
    - Compact Class 1 utility vehicle for maintenance, ports, campuses, and public-sector jobs
    - Pre-delivery targeted-customer proof
    - Shows named use-case buckets, not just generic “fleet” marketing
    - No public customer names, pilots, or order sizes
  - - Small business and vocational fleets cited by Drew Walker
    - Small-business commercial buyer
    - Brandable, adaptable local work vehicle with simple service path
    - Pre-delivery targeted-customer proof
    - Shows potential commercial expansion beyond retail consumers
    - Still management-described interest rather than executed public contracts
  notes: Because Slate is pre-delivery, the best public customer proof is reservation-holder behavior and named target-fleet categories rather than live owner case studies. This table should be refreshed once deliveries and fleet pilots become public.
