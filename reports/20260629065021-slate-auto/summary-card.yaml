  topStrengths:
    - >-
      Slate appears to have discovered real unmet demand for a radically cheaper EV truck, with more than 160,000
      reservations before first delivery.
    - >-
      The product concept is differentiated by low-content manufacturing, modular accessories, and domestic assembly
      rather than premium performance or software theater.
    - >-
      Investor support is unusually deep for a pre-delivery automaker, with $650 million raised in the latest round and
      roughly $1.4 billion disclosed cumulatively.
    - >-
      Direct sales, NACS charging access, and a broad third-party service partnership create a plausible go-to-market
      path without building a large dealer footprint.
  topRisks:
    - >-
      Slate remains pre-delivery and still must complete certification, tooling, supplier ramp, and normal-production
      execution at the Warsaw plant.
    - >-
      The reservation funnel is not the same as firm demand because early interest came through refundable $50
      reservations and later converts into a non-refundable preorder and then a much larger final purchase.
    - >-
      Public service-readiness disclosures still appear to be moving, including conflicting RepairPal shop counts and
      caveats that warranty work may not be available at all locations.
    - >-
      Exact Series C valuation, preference stack, current gross margin outlook, and likely 2027 capital needs remain
      undisclosed, making the unicorn mark hard to underwrite precisely.
  unresolvedGaps:
    - >-
      Exact Series C post-money valuation, liquidation preferences, any debt or secondary terms, and investor control
      rights.
    - Reservation-to-preorder conversion, cancellation/refund rates, and any named fleet contracts or purchase orders.
    - >-
      Detailed bill-of-materials, supplier concentration, launch gross margin path, burn, runway, and 2027 financing
      needs.
    - >-
      Final service footprint, warranty SLAs, and whether the RepairPal / home-delivery model performs consistently once
      vehicles are on the road.
