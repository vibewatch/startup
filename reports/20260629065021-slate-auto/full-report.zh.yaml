      - number: '8.4'
        title: 情景区间和下轮降估值风险
        blocks:
          - type: paragraph
            body: >-
              Slate 在公开口径上仍未有收入，因此最干净的估值方式，是反推收入并套用保守的公开市场代理。本章情景计算很明确，也刻意保持简单：单车实现收入由已公开基础价格、SUV
              转换加售和适度配件贡献构成；年度销量情景则反映 beta 生产、2026 年末首发目标和管理层 80,000 辆盈亏平衡目标之间的差距。结果是，熊市情景收入约 $420 million，基准情景约 $1.2
              billion，牛市情景约 $2.56 billion。再套用由可比公司启发的收入倍数区间，得出很宽的估值范围：熊市约 $0.34 billion 至 $0.50 billion，基准约 $1.68
              billion 至 $2.16 billion，牛市约 $4.61 billion 至 $6.40 billion。关键含义很直接：如果真实私募标记在 $3 billion
              左右或更高，下一位投资人已经在支付高于基准情景的价格。若 2027 年融资早于转化和正常生产被证明到来，下轮降估值风险就开始变得重要。
