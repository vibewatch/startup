companyProfile:
  summary: >-
    Slate Auto 是一家美国私营 EV 初创公司，沿 Re:Build / Re:Car 孵化路径走出，并在 2025 年公开发布极简电动皮卡概念。公司试图用一款精简的双座皮卡、可选 SUV
    改装套件、大型配件目录、直销、外包服务支持，以及位于 Indiana 州 Warsaw 的本土制造，开出一条新的低成本 EV 赛道。公开证据支持投资人信心很强——包括 2026 年 4 月 $650 million Series
    C，以及约 $1.4 billion 的累计披露融资——同时交付前预订已超过 160,000 辆，漏斗顶部需求异常强。核心承销问题不是认知度，而是执行：Slate 仍要完成车辆认证、爬坡 Warsaw
    工厂，把可退款预订转化为真实买家，并证明一辆低配置 $24,950 EV 在配件、服务和上市支持之后仍能跑出可接受经济性。
