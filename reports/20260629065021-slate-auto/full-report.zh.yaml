      - number: '5.4'
        title: 制造系统与上市准备
        blocks:
          - type: paragraph
            body: >-
              Slate 的制造故事与产品架构无法分开。公开来源持续显示一个分布式布局——Michigan 和 California 设计、Michigan 工程、Indiana 州 Warsaw
              整车制造——但生产论题取决于工厂层面的高度简化。地方和官方来源描述了一座改造后的 1.4 million 平方英尺前印刷厂、没有传统喷漆车间、单一基础卡车配置，以及远低于典型皮卡的零件数量。WVPE
              报道称，该场地计划容纳电池包组装、座椅制造和总装，说明 Slate 希望在工厂墙内拥有的不只是最终螺栓拼装可信度。


              即便如此，上市还没有在商业上被证明。Slate 自己的条款仍把卡车描述为预生产，Warsaw 页面称工厂仍在安装工装，地方报道也描述了预期 2026
              年末运营窗口前的拆除和改造进度。制造设计对平价目标看起来连贯；未回答的问题是，工厂、供应商和质量系统能否把一个简化概念推进为可靠的量产产品，同时不推迟时间表、不牺牲服务质量。
