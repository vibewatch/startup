  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Slate 的上市主张是在一个简单核心车辆之上，叠加模块化个性化、合作伙伴支持和极简数字界面。
    data:
      layers:
        - label: 所有权 / 社区层
          detail: 预留、预订、配件上新、巡展和仍处早期的车主社区，目标是在首次购买决策后继续维持参与。
        - label: 服务 / DIY 赋能层
          detail: RepairPal 门店、Slate U 教程、免费手册、诊断和后续 app 支持，定义了售后运营模式。
        - label: 座舱 / 用户界面层
          detail: 手机优先界面、实体控制、无标配信息娱乐系统，可选音响和平板配件。
        - label: 车辆核心层
          detail: 单电机 RWD 架构，当前 65 kWh LFP 电池包，205-mile 目标续航，11 kW AC / 120 kW DC 充电。
        - label: 制造简化层
          detail: 单一基础车型、无喷漆车间、低零件数量、复合材料外饰板和离线个性化，都是为了守住可负担性。
    approximationNotes: 层级顺序是分析框架，不是工程框图。它把 Slate 公开披露内容整理为影响上市经济性和车主体验的几个界面。
    claimRefs:
      - CE001
      - CE006
      - CE012
      - CE015
      - CE021
      - CE042
      - CE052
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 买家旅程从低入门价带来的好奇，走向配置、安装路径选择，并持续依赖后续支持。
    data:
      nodes:
        - id: n1
          label: 看到低价基础皮卡
          description: 客户注意到的是低配置 EV 主张，而不是高端皮卡替代品。
        - id: n2
          label: 检查使用场景匹配
          description: 买家判断双座皮卡现在能否覆盖任务，或之后是否需要 SUV 转换。
        - id: n3
          label: 预留 / 预订
          description: 车辆仍在预量产阶段时，客户下可退款预留或交付窗口预订。
        - id: n4
          label: 配置配件
          description: 客户选择贴膜、货架、音响、座椅或车身形态转换，而不是选择配置包。
        - id: n5
          label: 选择安装 / 服务路径
          description: 车主为配件和后续服务选择 DIY、交付前安装或合作门店支持。
        - id: n6
          label: 充电、驾驶、维护
          description: 只有充电、支持和质量闭环在日常使用中跑通，真实产品市场匹配才算被证明。
      edges:
        - from: n1
          to: n2
          label: 功能测试
        - from: n2
          to: n3
          label: 意向形成
        - from: n3
          to: n4
          label: 个性化
        - from: n4
          to: n5
          label: 安装选择
        - from: n5
          to: n6
          label: 车主现实
    approximationNotes: 该流程综合了公开订购、配件和支持机制，不是带有实测流失率的观测转化漏斗。
    claimRefs:
      - CE001
      - CE002
      - CE020
      - CE024
      - CE032
      - CE049
