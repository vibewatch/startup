  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：上有高端 EV 卡车，下有紧凑替代品
        blocks:
          - type: paragraph
            body: >-
              相比 2025 年，Slate 现在进入市场时商业定位更清楚：2026 年 6 月预购更新把产品重设为 $24,950 起步价、205 英里续航目标，以及一辆精简双座基础卡车，之后可变成五座 SUV。这个价格让
              Slate 远低于头牌 EV 卡车既有厂商——Tesla Cybertruck、Ford F-150 Lightning、Rivian R1T、Chevrolet Silverado EV 和 GMC
              Sierra EV——但也意味着公司并不真正在争夺这些卡车强调的同一个买家任务。全尺寸 EV 阵营卖续航、牵引和品牌背书的服务覆盖；Slate
              卖低入门价、模块化，以及买家能先从极简卡车开始、只加自己重视配置的想法。因此，更危险的比较集在梯子下方：Ford Maverick、高效紧凑跨界车，甚至二手 ICE
              卡车。这些替代品已经规模化存在，更容易维修，往往也能解决同样的通勤与轻载任务，却不要求客户承担初创公司上市风险。
