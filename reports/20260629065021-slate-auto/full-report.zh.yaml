  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 制造爬坡、电池和供应商风险
        blocks:
          - type: paragraph
            body: >-
              Slate 仍要完成 EV 初创公司从故事到稳定产出的经典跳跃。公司自己的 Warsaw 页面称，原 R.R. Donnelley 工厂仍在装配工装，目标是在 2026
              年晚些时候让卡车下线；本地报道则把该场地和棕地改造、承诺超过 2,000
              个就业岗位，以及仍在未来而非后视镜里的首车时间表联系在一起。这意味着投资人承销的不是一条已经验证节拍时间的产线，而是一座仍要消化许可、用工、工装和首发质量工作的工厂改造项目。


              电池供应同时是降风险因素，也是集中点。SK On 宣布的美国制造 NCM 供应协议，让 Slate
              拿到可信的首发供应商，并在电池包层面降低纯进口暴露；但公开记录仍只显示一个具名电池交易对手。对一款低价、毛利缓冲有限的车型来说，电芯认证、电池成本或上游材料通胀的任何滑坡，都可能迅速传导成交付延误或贡献利润变薄。Slate
              的简化论也带来一个更隐蔽的风险：公司用贴膜、模块化配件和多种售后配置，替代传统喷漆车间的复杂度，确实降低部分资本开支负担，却增加了客户看得见的装配、饰面和保修接触点数量，而且这些环节第一次就必须跑通。
