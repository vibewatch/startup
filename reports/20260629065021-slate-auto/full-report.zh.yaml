      - number: '4.6'
        title: 财务结论与关键尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              对 Slate 的财务结论不是公司缺钱，而是公开记录仍无法证明资本充足。上行情景很容易说清：$24,950 入门价赢得关注，高 SUV / 高配件组合抬高实际
              ASP，简单制造让物料清单保持轻量，重资本支持的上市在下一次融资变得紧迫前做到规模。下行情景同样清楚。公司仍是一家营收前 EV
              初创公司，试图在数月内从原型和手工制造车辆走向正常生产，而许可、认证、保修敞口和交付物流仍是实时执行事项。本章最怀疑的公开来源认为，已披露融资额可能仍低估了一个量产级 EV
              项目通常会消耗的资本。因此，正确尽调姿态是继续研究，而不是照单全收叙事：在把当前资本基础视为足够之前，先验证现金桥、BOM、准备金模型、预购转化漏斗和最终激励条款。
