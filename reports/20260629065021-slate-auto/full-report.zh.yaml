  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与买家任务
        blocks:
          - type: paragraph
            body: >-
              Slate 的客户基础最容易理解为三个重叠的上市细分，而不是一个单一的「EV 卡车买家」。第一类是价格敏感的直购者，想要最便宜、可信的新 EV 工具车；只要前期付款明显低于主流 EV
              替代品，他们愿意接受手摇车窗、没有固定信息娱乐屏和窄功能集。第二类是 DIY 和个性化人群。Slate 非常明确地说，这辆车就是要被贴膜、加配件、改装，甚至随时间改成
              SUV；这会吸引把卡车看作平台而不是成品配置包的买家。第三类是轻载车队和商用场景，卖点是紧凑尺寸、简单维护、易品牌化，以及用一款基础车适配多种任务。Slate
              尚未展示的，是按收入或销量划分的真实组合。公开证据强在预期买家任务，但仍薄在今天到底哪个细分正在向公司付款。
