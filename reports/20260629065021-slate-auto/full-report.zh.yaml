      - number: '5.5'
        title: 差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Slate 的差异化更像架构，而不是算法。公司并不是靠自动驾驶、巨型电池或同级领先性能赢得关注，而是把一组互相强化的运营选择捆在一起：单一配置出厂制造、未喷漆复合材料面板、手机优先座舱、延后配件、DIY
              维修内容和第三方支持网络。如果买家重视低入门价、可维修性，以及购车后重新配置车辆的能力，这些选择确实创造了真实楔子。


              同一组选择也定义了下行情景。公开规格从发布到 2026 年 6 月已经演变。EPA
              和公开碰撞结果仍缺失。服务覆盖说法内部不一致。公开来源仍未识别当前电池供应商或主要零部件供应商，公开招聘页面也弱于工厂叙事。简言之，Slate
              拥有一个可信的低成本产品架构和异常连贯的哲学，但它仍是一家预生产初创公司，还必须在真实世界证明认证、供应商执行、配件物流和客户支持。
