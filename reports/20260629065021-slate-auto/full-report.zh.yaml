    title: 风险传导图
    type: dag
    layout: wide
    summary: Slate 最危险的风险，是那些能迅速从运营传到客户信任、再传到现金需求的风险：上市或服务失败，可能在公司还没有大量车辆上路前，就演变成融资压力。
    data:
