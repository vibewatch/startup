      - number: '1.2'
        title: 领导层、创始人与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Slate 在 2026 年最显眼的领导层变化，是创始 CEO Chris Barman 交棒给 Peter Faricy。TechCrunch、Electrive、Carscoops 和 CNBC
              均报道，Faricy 在 2026 年 3 月接任，此前曾在 Amazon Marketplace、SunPower、McKinsey 任高级职位，并做过与 Bessemer 相邻的顾问工作。Barman 是
              Chrysler 长期老将，也是公司第一名员工，转任车辆总裁，继续负责工程、制造，以及按时、按预算把卡车推向市场。对一家从产品孵化转向商业发布的初创公司来说，这种分工在战略上说得通。


              创始人与治理的可见度不如高管可见度完整。留存报道持续把 Slate 的源头指向 Re:Build Manufacturing 和内部工作名 Re:Car，并把 Jeff Wilke 识别为联合创始人和
              Amazon 人脉连接者。TNW 还把 Re:Build CEO Miles Arnone 列入创建故事。但治理透明度明显更低。TechCrunch 和 TNW 均报道，Bezos Expeditions 的
              Melinda Lewison 到 2026 年 5 月已离开 Slate 董事会，在上市前数月撤掉了 Bezos 家族办公室的直接董事会代表。除这次离任和 CEO
              更替外，公开来源未提供完整的现任董事名单、委员会结构或投资人治理图谱。后续章节的关键结论是：Slate 看起来由创始人与赞助方塑形，而不是治理透明。
