  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发项
      - 门槛
      - 对论点的传导
      - 行动含义
    rows:
      - - 正常生产前出现上市前桥接轮
        - 在证明认证和 Warsaw 正常产能前，需要新增股权
        - 抬高下行轮风险，并证明当前资本基础不足以撑到上市
        - 暂停投资，并按新价格重新承销
      - - 预订转化偏弱
        - 付费预订转化显著低于预约标题数字，或首波订金后流失
        - 需求叙事走弱，收入假设向悲观情景移动
        - 重置销量假设，并收紧估值区间
      - - 实际平均售价向剥离配置的基础款皮卡漂移
        - 组合未能显示相对 $24,950 标价有明显 SUV 或配件提升
        - 单车收入假设压缩，利润率杠杆变弱
        - 从基准情景转向更低平均售价的估值测算
      - - 认证或产能滑坡
        - 正常生产和监管就绪明显晚于管理层公开时间表
        - 拉长规模化前现金消耗期，并提高再次融资概率
        - 视为融资风险事件，而不只是运营延误
      - - 轮次条款显示投资人保护激进
        - 2026 条款清单显示厚重优先权或反稀释保护
        - 表面估值夸大了新类普通股资金可获得的经济价值
        - 按完全稀释、优先权调整后的条款重新定价机会
    notes: 这些触发项的意义，是在叙事动能掩盖经济性恶化之前逼迫行动。每个触发项都可从公开申报、 官方更新或管理层资料室观察到。
