      - number: '3.5'
        title: Slate 的护城河在价格和模块化上真实存在，在准备度和服务上偏弱
        blocks:
          - type: paragraph
            body: >-
              Slate 确实有一个真实楔子：目前没有既有厂商提供一辆 $24,950 的 EV 卡车，同时具备这种车身形态灵活性、DIY
              个性化或低成本配件。这给公司一个清晰故事，面向城市买家、想要简单轻载车辆的车队，以及把汽车看作可配置消费品的消费者。但护城河很窄，因为它依赖的是既有厂商不必优化的标准。只要买家在意续航、牵引、四门实用性或有保障的维修覆盖，公司结构上就更弱。如果平价买家开始拿
              Maverick、混动车或二手卡车交叉比较，而不是拿高端 EV 皮卡比较，Slate 也更弱。负面证据很难忽视：Canoo 已经失败，Telo 仍有商业化风险，Slate
              自己也还要证明认证、上市时点和服务覆盖。结论不是 Slate 缺少差异化，而是它的差异化由价格主导、对执行敏感，而非由基础设施主导。如果上市干净落地，这可能足够；如果滑坡，更大品牌和更便宜替代品都有空间挤压它。
