      - number: '1.3'
        title: 融资历史、投资人基础与估值可见度
        blocks:
          - type: paragraph
            body: >-
              对一家尚未开始客户交付的公司来说，Slate 的资本化程度异常高。官方新闻稿、TechCrunch、WardsAuto、CNBC 以及二级融资报道指向同一个顶层结果：公司在 2026 年 4 月 13 日完成由
              TWG Global 领投的 $650 million Series C，累计融资约 $1.4 billion。TechCrunch 补充称，股东名册包括 General Catalyst、Bezos
              的家族办公室、Slauson & Co. 和前 Amazon 高管 Diego Piacentini；TechCrunch 2026 年 5 月董事会报道和 CNBC 2025 年 6 月专题则暗示，Series
              C 之前前两轮已累计融资约 $700 million。


              公开披露薄弱之处不在于资本是否存在，而在于背后的精确所有权数学。2026 年 Tech Company News 的一篇简介称，2023 年首轮融资超过 $111 million，2025 年 1 月
              Series B 未披露金额，公司在 2025 年融资后估值可能约 $1.2 billion。留存的官方或一线 2026 年来源均未披露 Series C 投后估值、投资人持股比例、董事会权利或 Series B
              精确支票规模。这很重要，因为 Slate 的资本故事可以有两种读法：一是老练投资人愿意为美国本土平价 EV
              论题出资的强证据；二是公司在任何客户收入到来前仍需要极重外部资本。后续财务和估值章节应把公开累计融资数字视为扎实，但把当前估值和治理权利视为未解决。
