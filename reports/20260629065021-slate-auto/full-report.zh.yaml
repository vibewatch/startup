      - number: '4.4'
        title: 烧钱、跑道与融资依赖的情景框架
        blocks:
          - type: paragraph
            body: >-
              公开市场投资人可以估算 Slate 现金故事的一部分，但无法用披露来源真正闭合。公司说了融资总额，却没说在工厂工程、工程研发、认证、薪酬、工装和上市准备后还剩多少资本。订金经济性可以框定规模错配：160,000
              个可退款预订意味着约 $8 million 浮存，而理论上 180,000 个全额支付的 $300 预购，在调整旧客户 $250 净订单和未转化前，意味着 $54 million。无论哪一个数字，相比约 $363
              million 至 $400 million
              的披露工厂支出区间都很小。管理层也拒绝讨论跑道，同时确认随着爬坡临近，公司仍愿意继续融资。因此，审慎情景框架应是有条件的：如果认证、工装和预购转化按计划推进，Slate
              也许能在没有紧急融资的情况下桥接到早期交付；如果 Q4 生产时间线滑坡，由于没有披露公开债务或项目融资工具，额外股权或另一项战略资本来源会更可能出现。
