      - number: '7.4'
        title: 融资、治理和执行风险
        blocks:
          - type: paragraph
            body: >-
              Slate 已经融到足够多的钱，值得认真看待；但公开披露的数据还不足以让跑道风险消失。TechCrunch 和 TNW 都指向在 $650 million Series C 之后累计融资约 $1.4
              billion，但公开来源仍让手头现金、债务能力、供应商付款条件、保修准备金和月度烧钱大多不透明。对一家私营初创公司来说可以理解，但也意味着外部投资人无法验证：如果交付滑坡，当前现金桥是否能从容覆盖认证、工装、首发库存、服务备件和爬坡低效。


              治理观感重要，因为量产前车企往往需要在模式自我造血前再融资一次。Slate 2026 年 3 月更换 CEO，随后在 2026 年 5 月失去 Bezos family-office
              董事会代表。任一事件都可以被温和解释为从孵化器时代领导转向运营领导；但两件事叠加，削弱了最初帮助公司获得关注和资本的光环。首批卡车尚未造出来时，领导层变动和投资人拉开距离的信号，比在一家已经规模化的制造商身上更重要，因为它们可能在业务最脆弱时抬高后续资本条件。
