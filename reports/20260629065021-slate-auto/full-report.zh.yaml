      - 多头论点
      - 反方论点
      - 什么会改变判断
    rows:
      - - 需求
        - 180K+ 预约显示，消费者对低价模块化 EV 确有兴趣
        - 预约一开始是可退款的 $50 占位，未必会转成硬订单
        - 按客群的预订转化与取消数据
      - - 经济性
        - 简单整车设计、无喷漆车间和配件加售，可能支撑少见的成本结构
        - 管理层盈利声明仍未验证，上市经济性仍是假设
        - BOM 加毛利桥接，并纳入质保假设
      - - 资本基础
        - 累计融资约 $1.4B，对一家未上市前投产的私营车企而言异常充足
        - 如果不披露资金续航和优先权，表面资本额仍可能掩盖较弱的未来经济性
        - 当前现金、月度现金消耗和 Series C 条款清单
      - - 市场位置
        - 低于 $25K 的入门价格，形成差异化的大众可负担性角度
        - 买家加购 SUV 套件、车身贴膜和选项后，实际成交价可能上移
        - 上市后的实际平均售价和组合数据
      - - 可比公司集合
        - Rivian、Lucid 和 Harbinger 证明，只要证据可信，投资人仍会支持 EV OEM
        - Canoo 和其他失败案例表明，爬坡证据迟到时，市场会迅速毁掉价值
        - 正常生产，以及环比转化和现金消耗表现
    notes: 反方论点不是 Slate 缺少关注，而是后期 EV 初创公司的定价可能跑得太快，超过证据变得 可投资的节点。
