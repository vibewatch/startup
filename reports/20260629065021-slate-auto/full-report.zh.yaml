            body: >-
              Slate 的融资背景按绝对金额看很强，但披露质量弱。公司和媒体报道确认了 2026 年 4 月轮次、接近 $1.4 billion 的总资本、2026
              年末交付意图，以及以数亿美元计的工厂投入。客户漏斗现在也更分层：早期预约是可退款的 $50 兴趣表达，预购则由 $300
              不可退款订金支持。这有助于估值框架，因为它把注意力和真实转化区分开来。即便如此，保留下来的一级或高声誉来源都没有披露当前跑道或投后估值，连索引该轮的市场数据页面也让估值一栏在公开视野中保持不透明。Carvana
              权证披露在战略上有意思，因为它暗示围绕 Mark Walter 关联资本存在商业可选性，但它没有解决核心承销问题。公开投资人仍看不到 Slate
              最新轮次是否带有激进反稀释、老股成分，或一个已经假设近乎完美执行的价格。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
