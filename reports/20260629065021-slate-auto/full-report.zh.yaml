      - number: '5.3'
        title: 可维修性、服务与信任栈
        blocks:
          - type: paragraph
            body: >-
              Slate 最有特色的非制造押注，是维修性和支持可以外包并部分民主化，而不毁掉拥有体验。官方材料承诺免费手册、诊断、Slate U 教程、车主直接维护、交付前或交付后配件安装，以及面向不想走 DIY 路径客户的
              RepairPal 支持全国服务覆盖。这与公司的极简硬件哲学高度一致：更少运动部件、更少捆绑电子功能，以及更多车主自主权。


              风险在于，这套支持模式仍相当理论化。Slate 自己的页面对网络规模说法不一致，有的称 3,000 家，有的称 4,000 多家门店；RepairPal 细则则称保修服务未必处处可得，服务中心通常在 100
              英里范围内，而不是近在本地。高压服务覆盖更窄，只有 200 多个 EV 认证站点。纸面保修很慷慨，但公开记录还没有显示真实现场表现、报销经济性，或客户在 DIY 内容、合作门店和未来任何 Slate
              控制的数字界面之间切换是否顺畅。
