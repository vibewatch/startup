chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与产品架构
        blocks:
          - type: paragraph
            body: >-
              Slate Auto 把自己定义为一家新的美国车企，核心命题很清楚：造一辆极简、平价的电动车，让车主随时间个性化，而不是按传统配置包逻辑购车。官方页面强调，公司在 California 和 Michigan
              设计，在 Michigan 工程开发，并在 Indiana 州 Warsaw 制造；同时美国联邦 NHTSA 制造商登记把公司地址列为 Michigan 州 Troy 的 2716 Daley Drive，CEO
              为 Peter Faricy。这组信息说明，后续章节最干净、可复用的身份不是「Indiana 初创公司」或「Bay Area 初创公司」，而是一家分布式美国 EV 公司：Michigan
              承担公司与工程中心，California 负责设计活动，Indiana 承担制造。


              Slate 的基础产品是一款直销给消费者的双座电动皮卡，可用加装套件改成五座 SUV；更大的配件策略，则把购后个性化做成商业模式的一部分。官方产品文案和 2026 年 6
              月报道都把这辆车描述为刻意精简：灰色复合材料外观、没有喷漆车间、没有中央信息娱乐屏、手摇车窗。经济逻辑和美学同样重要。Slate 试图去掉资本密集的制造环节和功能膨胀，让头牌车型落在约 $25,000，而不是追逐
              EV 市场高端。按运行日看，公司仍处于交付前阶段，尚未完全商业化，但已通过 beta 制造、联邦登记、价格披露和正在运行的预购流程，越过纯概念阶段。
