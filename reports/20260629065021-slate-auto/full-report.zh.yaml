      - number: '3.4'
        title: 替代品和分销力量是更近期威胁
        blocks:
          - type: paragraph
            body: >-
              大众市场转化里，最尖锐的竞争压力来自替代品，而不是 Cybertruck 羡慕。Ford Maverick 是最清楚的例子：标价只比 Slate 高几千美元，却提供熟悉的拥有体验、可选 4,000
              磅牵引能力，以及成熟经销商与服务生态的舒适感。高效紧凑跨界车从另一角度强化同一个问题。Toyota RAV4 和 Honda CR-V Hybrid 价格维持在 $30,000
              低段至高段附近，同时提供主流实用性、燃油经济性和即时可得性。二手车也继续重要，因为 Cox 报告称，2026 年二手车价格仍在支撑，而非崩盘。这意味着追求价值的买家有几条成熟路径，可以避开初创公司上市。Slate
              的直销模式也许能降低结构成本，但 Ford 和 GM 的产品页面今天仍把客户导向本地经销商和库存。在 Slate 公布可比的服务和交付地图之前，分销仍是既有厂商优势，而不是中性变量。
