      - number: '2.2'
        title: 受约束的规模测算：限制因素是平价和适配度，而不是宽泛 EV TAM 口号
        blocks:
          - type: paragraph
            body: >-
              可获得的公开证据不支持为低于 $30k 的电动皮卡做干净的经典 TAM，因此更诚实的框架是一组受约束视角。广义 EV 市场真实存在，但当前处在低谷：2026 年 Q1 销量同比下降 27%，份额为 5.8%，而
              2025 年 Q3 激励抢购期为 10.5%。与此同时，长期预测仍集中在到 2030 年占美国乘用车销量约五分之一至四分之一，这意味着增长故事是推迟，不是死亡。眼下的商业洞察是，Slate 的 $24,950
              标价面对的是超过 $57,000 的平均 EV 成交价，以及超过 $50,000 的平均新车价。这创造了真实的平价楔子，但并不让整个 EV TAM 都可触达；广义 EV 兴趣要变成真实需求，Slate
              仍需通过工具适配、充电适配和直销适配筛选。
