        title: 预订转化、耐久性和集中度风险
        blocks:
          - type: paragraph
            body: >-
              Slate
              客户故事最大的弱点，是证据层级仍比投资人真正想看的低一层。没有已交付车主队列，没有复购或满意度统计，没有披露从预约到预购的转化率，也没有具名车队合同能证明商业渠道不只是兴趣。这迫使本章依赖举手式需求、买家评论和管理层叙事，而不是硬性的耐久性指标。集中度风险同样重要。故事高度依赖只在美国首发的执行、一个要求买家在没有经销商网络时信任初创公司的直营动作，以及需要抬高单买家实际收入的配件
              / SUV 套件附加率。因此，预约数量最好被视为强劲的漏斗顶部信号，而不是 Slate
              已经解决转化、留存或车队可复制性的证据。在公司披露真实预购转化、早期交付履约和售后支持表现之前，正确的客户结论仍是建设性但暂定。
