      - number: '7.3'
        title: 客户转化、定价和服务 / 保修风险
        blocks:
          - type: paragraph
            body: >-
              预约簿有用，但它不等于已经验证的收入。Slate 的预约条款把最初 $50 费用描述为可全额退款，并明确不是购买协议；而 2026 年 6 月报道显示，公司在所有最终拥有细节敲定前，就要求客户转向 $300
              不可退款预购。许多初创公司的订单簿正是在这里接受压力测试：一旦买家必须把真实付款、配件、融资和交付不确定性，与他们已经熟悉的替代选择相比，热情就会转成流失。


              服务和保修设计带来第二个转化风险。Slate 公开服务页面承诺了对一家尚未建立实地车队的公司来说异常慷慨的电池和整车覆盖；RepairPal
              合作则意在用部分高压能力铺出全国触达。这可能让固定成本低于自建服务模式，但同一批公开材料也承认，并非每个地点都提供保修服务。如果客户发现最便宜的卡车需要实质性的配件加售、漫长等待，或参差不齐的服务执行，品牌可能失去它最需要的主流买家：重视确定性胜过新鲜感的价格敏感消费者。
