      - number: '1.5'
        title: 负面信号与主要剩余缺口
        blocks:
          - type: paragraph
            body: >-
              Slate 故事面临的两个最大公开挑战，都围绕执行而不是概念。第一，头牌平价主张已明显弱化。Slate 2025 年走出隐身时，「低于 $20,000」叙事依赖一项已不存在的联邦 EV 税收抵免。到 2026 年
              6 月，真实标价为 $24,950（不含费用）；即便友好报道也把低于 $20,000
              的拥有成本描述为狭窄的州激励结果，而不是全国大众市场现实。第二，多份来源质疑，一辆精简的双门卡车在买家加选配或拿它与配置更高的小型卡车、混动车比较后，吸引力能否守住。这并不致命，但意味着 Slate
              真正的产品市场匹配测试，要等付费订单转化、车辆交付后才开始。


              治理和上市时点又增加一层风险。Faricy 上任和 Lewison 退出董事会，都可以解释为正常过渡；但两件事放在一起，会提高尽调对量产前谁实际控制战略决策的要求。CNBC 也明确显示，截至 2026 年 6
              月下旬，Slate
              仍有验证、认证和完整生产流程里程碑待完成。最后，公开数据室在承销团队最关心的地方仍很薄：没有当前估值披露，没有公开股权结构，没有公开员工数，没有客户数，没有上市前收入，也没有预订转化统计。这些缺口并不否定公司，但会阻止后续章节把上市故事视为已去风险。
