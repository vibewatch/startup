              Faricy 上任可解读为公司有意走向商业化，Lewison 离开也可解读为赞助方在资本形成后后退一步。两种解读都可能成立。但放在一起，承销负担会转向私下尽调：现在谁控制战略、融资选项，以及上市 go/no-go
