      - number: '6.3'
        title: 车队吸引力、地理、分销与服务支持
        blocks:
          - type: paragraph
            body: >-
              Slate 的客户触达模式很不常规，利弊都很明显。好的一面是，公司从第一天起就想把订购做成全国化：直营销售、付费送车上门、横跨美国的公开路演、每日支持聊天热线，以及面向企业 /
              车队的线索入口。相比传统经销商铺开，这让 Slate 理论上能触达更广的买家，尤其是没有初创公司自营门店的市场。反面是，信任和服务深度必须向伙伴借。Slate 没有自有经销商或品牌服务车间，而是重押
              RepairPal 支持的服务覆盖、DIY 维护内容，以及第三方配件安装。证据原则上支持一个宽网络，但首发覆盖并没有完全钉死：不同公开页面提到的口径包括通常在 100 英里内的中心、超过 3,000
              家门店，或更广的 4,000 家 RepairPal 网络。这足以把服务触达讲成叙事强项，但主流买家和车队关心按邮编精确确认授权覆盖，执行问题仍在。
