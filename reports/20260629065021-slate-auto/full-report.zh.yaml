      - number: '5.2'
        title: 车辆架构与电子策略
        blocks:
          - type: paragraph
            body: >-
              当前公开架构刻意简单。截至 2026 年 6 月，Slate 留存官方规格材料汇聚到一个单后电机、后驱上市配置，65 kWh LFP 电池（63 kWh 可用电量）、205 英里预计续航，以及 11 kW AC
              / 120 kW DC NACS 充电设置。不过，公司的历史轨迹也很重要：2025 年 4 月发布材料描述了两种电池选项和 150 至 240 英里目标，而 2026 年 FAQ 称 Slate
              已提高标准续航包，不再承诺加长电池包。这种变化不一定意味着技术问题，但确实显示上市版本仍在接近投产时被简化和优化。


              电子策略对一辆 2026 年 EV 来说也不典型。Slate 拒绝标准仪表盘大屏栈，转而采用自带设备模式，提供手机或平板支架、可选音频配件，以及仍计划在 2026 年晚些时候推出的非必需移动
              app。实践中，这会去掉一部分软件复杂度和硬件成本，但也缩小了 Slate 相比单纯从 BOM 中删除功能，实际带来的嵌入式数字差异化空间。
