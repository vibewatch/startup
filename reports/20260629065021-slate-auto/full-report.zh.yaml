  - id: TV003
    title: 可比估值表
    columns:
      - 可比公司
      - 公开估值或融资锚点
      - 证据 / 收入锚点
      - 对 Slate 的意义
      - 关键限制
    rows:
      - - Slate Auto
        - $650M Series C；未披露投后估值；低声誉传闻 >$3B
        - 轮次关闭时 160K+ 预约；6 月下旬达 180K+；公开层面仍未产生收入
        - 最接近的事实模式，也说明价格纪律为什么关键
        - 轮次条款和当前现金仍未披露
      - - Harbinger
        - $160M Series C；累计融资 $358M
        - FedEx 订单，2025 年起交付 53 辆车
        - 显示一家融资规模更小、但更早拿到客户背书证据的私营 EV 制造商
        - 中型商用车队卡车不是便宜消费级皮卡
      - - Rivian
        - $20.98B 市值；约 3.8x 市值 / TTM 收入代理指标
        - $5.52B TTM 收入
        - 可作为美国上市 EV OEM 的有用基准：有规模，但尚未持续盈利
        - 品牌、工厂基础和车型组合都远大于 Slate
      - - Lucid
        - $2.31B 市值；约 1.65x 市值 / TTM 收入代理指标
        - $1.40B TTM 收入
        - 说明即便有真实交付收入，公开市场也能压缩 EV OEM
        - 高端豪华定位与 Slate 的价格带相距很远
      - - Tesla
        - $1.426T 市值；约 14.6x 市值 / TTM 收入代理指标
        - $97.87B TTM 收入；审计后的 2025 年 10-K 于 2026 年 1 月提交
        - 代表规模化披露和稀缺性的上限，不是 Slate 近期现实倍数
        - 规模、盈利可选性和数据质量都不可比
      - - Canoo
        - Chapter 7 清算；资产随后以约 $4M 售出
        - 申报时资产低于 $50K，负债 $10M-$50M
        - 最强反面提醒：如果证据和流动性滑坡，EV 资本可能崩塌
        - 失败路径是极端下行，不是正常经营可比
    notes: 这组可比对象刻意不追求穷尽。它混合了私募融资、公开市场代理指标和困境案例，因为没有 单一篮子能独自解释 Slate 的上市前估值问题。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the main valuation lenses that matter for Slate in June 2026: direct fact pattern, private
        manufacturing proof, public EV OEM multiples, and a distress floor case.
