        - 聚焦紧凑皮卡 / 模块化生活方式用途的低于 $30k 新电动多用途车支出
        - 高端 EV 卡车豪华配置或重载拖拽支出
        - 通常是同一家庭买方、用户和付款方
        - 直接纳入，因为 Slate 当前 MSRP 和车型形式定义了该细分
      - - 紧凑卡车替代
        - 由 Ford Maverick 类型买家带动的平价小卡车支出
        - 全尺寸工作卡车车队
        - 家庭或小企业业主通常既付款也使用车辆
        - 按每美元效用看，是最接近的存量替代
      - - 二手 EV 替代
        - 标价接近 $20k-$30k 区间的二手 EV 购买
        - 更高价的新 EV 购买
        - 预算敏感型家庭买家
        - 重要，因为二手 EV 定价如今接近二手 ICE 平价
      - - 高端 EV 卡车细分
        - 约 $50k 以上的探险或重载 EV 卡车支出
        - 预算型买家支出
        - 更高收入家庭或企业车队
        - 基本排除，因为价格和效用预期存在实质差异
      - - 直营 / 配件生态
        - 基础购买后追加的配件、贴膜和转换套件支出
        - 经销商 F&I 和加价支出
        - 买方和付款方通常是同一个人或家庭
        - 纳入，因为这是 Slate 经济模型的一部分，而非副业
    notes: 边界逻辑使用公开 MSRP、车型形式和替代数据，而不是付费类别定义；纳入和排除支出是基于观察到的比较组作出的分析估计。
