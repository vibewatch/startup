  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资基础与资本结构信号
        blocks:
          - type: paragraph
            body: >-
              Slate 已经解决了一个会杀死很多 EV 初创公司的问题：拿到股权资本。公开来源指向约 $1.4 billion 的累计披露融资，其中包括由 TWG Global 领投的 $650 million Series
              C，且 Bezos 和 Walter
              相关资本反复支持。对一家仍在瞄准首批交付而非报告交付的公司来说，这是一笔很大的弹药。但这一轮融资没有给出公开市场投资人会期待的披露。留存公开来源均未给出投后估值、完整股权结构或当前现金余额。另一个值得注意的信号不是数字，而是结构：Carvana
              2026 年 3 月代理文件披露，一家未具名私营消费品公司在 2025 年授予一份认股权证，背后有 Mark Walter 所有权重叠；TechCrunch 通过 Delaware 文件把该认股权证与 Slate
              关联起来。即便双方仍未确认这种绑定，它也暗示 Slate 未来融资故事可能把战略分销或商业可选性，与普通风投股权混在一起。
