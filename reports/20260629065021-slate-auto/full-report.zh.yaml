  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以 40K 辆 / $30K / 1.6x 的基础情景为中心，公开模型里最大的估值摆动来自销量、倍数和上市滑坡假设。
    data:
      items:
        - label: 年销量较基础情景 +20K 辆
          value: 0.96
        - label: 年销量较基础情景 -20K 辆
          value: -0.96
        - label: 实现 ASP 较基础情景 +$2K
          value: 0.13
        - label: 实现 ASP 较基础情景 -$2K
          value: -0.13
        - label: 收入倍数较基础情景 +0.5x
          value: 0.6
        - label: 收入倍数较基础情景 -0.5x
          value: -0.6
        - label: 2027 过桥轮 / 上市滑坡惩罚
          value: -0.7
      yAxis:
        label: 估计估值变化（USD B）
    approximationNotes: 数值是分析师围绕公开模型基础情景的估计：40,000 辆、每辆实现收入 $30,000、收入倍数 1.6x。这些是方向性敏感点，不是公司指引。
