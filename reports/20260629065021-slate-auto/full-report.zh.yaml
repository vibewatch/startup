      - number: '8.3'
        title: 可比框架
        blocks:
          - type: paragraph
            body: >-
              Slate 没有完美的公开类比，因此正确的可比组应混合公开 EV OEM、私营制造业轮次和困境警示案例。Tesla 是披露和规模上的异类，倍数远高，任何首发前初创公司都不应假设。Rivian
              更适合作为已经规模化但仍亏损的公开 EV OEM 基准；Lucid 则说明，即便是知名品牌，只要规模和现金消耗仍有争议，公开市场也能猛烈压缩估值。Harbinger 是更好的私营制造业可比，因为它以较小
              Series C 搭配了真实 FedEx 订单，说明客户背书证明更早出现在生命周期里。Canoo 是反向镜像：一家融过资、以某种形式进入过生产，最终仍走到 Chapter 7
              和微不足道资产结果的初创公司。合在一起，这些可比说明 Slate 既不该享有 Tesla 式稀缺定价，也不能只因需求标题很大就免考。市场奖励的是证明、披露的经济性和资本效率，远多于概念层面的预约量。
