      - number: '3.3'
        title: 平价新进入者同时展示了希望与失败
        blocks:
          - type: paragraph
            body: >-
              最相关的初创公司和未来产品证据双向切割。Telo 是最接近 Slate 的概念类比，因为它同样讲紧凑、极简电动卡车故事。但数据说明，这个类比更多是警示而非安慰：当前公布的 Telo 价格仍为 $41,520、续航
              260 英里，公司 2026 年官网仍处预订模式，早期报道期待 2025 年初发布如今显得乐观。Canoo 的警告更严厉。其 2025 年 1 月 Chapter 7 清算和立即停运，直接证明低价 EV
              叙事可能在规模和服务准备就绪前崩塌。未来压力同样重要。Rivian R2 官方定价为 2027 年 $44,990，Electrek 的 Slate 报道也提示 Ford 计划在 2027 年推出平价 EV
              皮卡。这意味着 Slate 作为最便宜新 EV 卡车也许会享受短暂头牌窗口，但如果量产或认证滑坡，它并没有明显长期不受挑战的车道。
