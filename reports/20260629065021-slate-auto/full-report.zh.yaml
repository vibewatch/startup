  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户流程
        blocks:
          - type: paragraph
            body: >-
              Slate
              的产品最好理解为低配置车辆平台加配件和改装系统，而不是传统配置梯级。出厂默认卡车是一辆双座皮卡，带实体控制、手机优先座舱和有限捆绑功能；许多买家可见升级被推迟到附加件中，可在交付时安装、之后通过合作门店安装，或由车主自己安装。这很重要，因为
              Slate 想简化客户决策：先买一辆便宜、能用的基础卡车，之后只有当使用场景真正出现时，再加车身形态、贴膜、音响、行李架或 SUV 硬件。


              因此，客户流程从平价和基础工具性走向分阶段个性化。买家先预订或预购，判断双座皮卡是否够用，再决定添加哪些配件、采用哪种安装路径。上行是灵活性和更低初始标价冲击；代价是市场通常期待在出厂车里出现的一些能力——后排座椅、音响、贴膜颜色，甚至部分便利技术——会更晚到来。这让拥有流程更可配置，但也更依赖
              Slate 的配件、交付和合作安装执行。
