  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 责任人或尽调路径
    rows:
      - - 2026 股权结构表和 Series C 条款清单
        - 投后估值、清算优先权、反稀释、老股转让组合和董事会权利
        - 不知道经济清偿顺位和稀释保护，表面估值就无法使用
        - NDA 下的管理层资料室和律师审阅
      - - 当前现金、现金消耗和资金续航
        - 手头现金、月度现金消耗、营运资金需求和桥接融资假设
        - 决定 Slate 能否在不进行 2027 年资本重组的情况下达到正常生产
        - NDA 下的 CFO 材料包和月度运营看板
      - - 按客群的预订转化
        - 预约到付费订单的转化、退款率，以及按地区或配置意向划分的取消情况
        - 区分真实需求与廉价可选性
        - 商业团队、CRM 和客群转化分析
      - - BOM 和利润率桥接
        - 整车层面的 COGS、质保假设、配件毛利和服务经济性
        - 检验 2027 年正现金流声明是否现实
        - 运营加财务审阅；供应商成本模型
      - - 认证和产能就绪
        - 准入认证状态、验证关口、正常生产时间和瓶颈图
        - 上市时间同时决定现金消耗，也决定情景测算从 2026 年开始还是滑到 2027 年
        - 制造和监管就绪审阅
      - - 商业渠道可选性
        - 若存在超出探索性联系的 Carvana、车队或战略客户关系条款
        - 可能带来分销杠杆或营运资本支持，但公开证据仍不完整
        - 业务拓展与合作伙伴合同审查
    notes: 前四项才是真正的硬性卡点。没有这些证据，Slate 仍可被描述、对标并持续跟踪，但不能作为后期定价轮被负责任地承销。
