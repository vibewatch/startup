      - number: '3.2'
        title: 直接 EV 皮卡同业赢在续航和工具性，而不是平价
        blocks:
          - type: paragraph
            body: >-
              直接 EV 皮卡同业在商业上真实存在，但战略上错位。评测来源中，Cybertruck 和 R1T 起价仍约 $72,000，Lightning 起价约 $66,000，GM 的电动全尺寸卡车起价在 $50,000
              中段至 $60,000 低段。这些车带来明显更长续航、更高牵引等级和更完整座舱，但价格是 Slate 入门价的两到三倍。最大差距是续航：Slate 现在宣传 205 英里，而 Lightning 达到 320
              英里，GM 声称 Silverado 和 Sierra 最大续航配置为 478 英里。工具性差距也类似。Lightning 宣传最高 7,700 磅牵引，Silverado EV 最高 12,500
              磅，Sierra EV 仍通过 GMC 的 EV 经销商网络定位为一辆完整能力的全尺寸卡车。对主要任务是牵引、长途旅行或全家工具性的买家来说，这些既有厂商仍很难被 Slate 替代。Slate
              更可能受益于成为反高端卡车，而不是在对方主场击败这些卡车。
