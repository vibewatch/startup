      - number: '2.5'
        title: 矛盾前景：Slate 在需求低谷上市，但价格点与市场新现实异常贴合
        blocks:
          - type: paragraph
            body: >-
              Slate 面对的市场矛盾很尖锐。短期数据难看：联邦抵免悬崖后销量下滑，车企取消投资，即便支持者也把 2026 年描述为 EV 采用更慢、更由市场驱动的阶段。但同一组证据也说明 Slate 为什么存在。平均 EV
              价格仍远高于普通买家舒适区，收入低于 $75,000 的家庭在新车市场份额下降，即便长期看多预测也开始依赖更小、更便宜的产品，而不是高端光环卡车。在这个背景下，Slate 的低价论题方向正确；但 2026
              年末上市意味着公司还必须熬过周期最难的一段：买家怀疑、车队经济性收窄、充电接入不均，以及生产规格未决。市场不是太小，只是比泛泛 EV TAM
              话术更有条件，因此尽调应聚焦可转化需求、充电适配和服务铺开，而不是头牌预订好奇心。
