              Slate 官方与报道中的预订数字很强，但它们最初建立在可退款 $50 订金和早期低于 $20,000 叙事上；后者在全国范围已不成立。可操作的尽调问题不再是「Slate 能否吸引兴趣？」，而是「在
              $24,950 加费用和配件后，多少兴趣会转成付费订单？」
