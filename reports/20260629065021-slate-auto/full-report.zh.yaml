  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Slate 主要上市客群从认知走到拥有的路径如下；图中标出哪些环节今天证据较强，哪些仍要等后续执行兑现。
    data:
      nodes:
        - id: n1
          label: 平价 EV 认知
          description: 看重预算的零售买家，因为媒体热议「最便宜且可信的新款 EV 皮卡」而认识 Slate。
        - id: n2
          label: 预约
          description: 潜在买家支付可全额退款的 $50 费用，锁定未来购买优先级；承诺门槛被刻意压低。
        - id: n3
          label: 预购窗口
          description: 预约用户收到交付窗口后，必须在 30 天内决定是否转为不可退款的 $250-$300 预购订金。
        - id: n4
          label: 个性化与融资
          description: 买家的分配窗口临近时，再选择车身贴膜、配件、融资和交付方式。
        - id: n5
          label: 交付 / 提车
          description: 在 Slate 直销模式下，客户要么自提车辆，要么付费选择送车上门。
        - id: n6
          label: 服务 / 升级循环
          description: 车主借助 Slate U、授权伙伴和接入 RepairPal 的门店，完成保养、贴膜、配件加装，以及可能的 SUV 改装。
        - id: n7
          label: 扩张路径
          description: 如果零售满意度够强，同一平台可以靠配件加购、家庭第二辆车使用，或类似车队的重复订单继续扩张。
    approximationNotes: 官方买家旅程页面明确给出了这一顺序，但今天只有前三个阶段有真实的公开需求验证。交付后和重复下单阶段仍属于前瞻假设。
    claimRefs:
      - CU003
      - CU006
      - CU007
      - CU013
      - CU021
      - CU046
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    summary: Slate 的公开需求漏斗，从低价可退款预约开始，进入难度高得多的不可退款预购，最后才是仍未验证的交付。
    data:
      items:
        - label: 媒体 / 社群认知
          value: 180000
        - label: 官方预约池
          value: 180000
        - label: 具备优先预购资格的预约用户
          value: 160000
        - label: 公开披露的不可退款订金转化
          value: 0
        - label: 公开披露的已交付车主
          value: 0
    approximationNotes: 180,000 个预约来自管理层在 6 月 24 日发布会上的口径。160,000 的水平是更早有公开记录的预约基数。最后两个阶段为零，表示公司尚未公开披露转化数或已交付车主数，并不代表真实数量一定为零。
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU041
      - CU045
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    summary: 公开客户验证在预购社群行为和车队兴趣类别上最强；留存可见度和生产成熟度最弱。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 留存可见度
        - 成熟度
      rows:
