      - number: '1.6'
        title: 展示
        blocks:
          - type: callout
            title: Slate 拥有差异化的平价架构，而不只是看起来便宜的卡车
            body: >-
              Slate
              最强的战略资产，是产品设计与制造设计之间的连贯性。精简内饰、无喷漆外观、单一基础配置、直销模式和配件升级逻辑，都服务于同一个目标：同时降低上市资本和起步价格。这比一次性低价噱头更实质，也解释了公司为什么能同时吸引资本和预订兴趣。
