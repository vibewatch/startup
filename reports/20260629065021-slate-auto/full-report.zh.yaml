  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Slate 在创造平价工具型 EV 细分市场，而不是追逐高端电动卡车
        blocks:
          - type: paragraph
            body: >-
              Slate 面向买家的提案，把相关市场定义得比「EV 皮卡」这个说法窄得多。$24,950、精简双座基础配置、可选 SUV 改装和直销模式，说明 Slate
              瞄准的是想要平价工具属性和个性化的买家，而不是全尺寸拖曳、豪华内饰或早期采用者身份。这把最相关的替代边界放在 Ford Maverick 等紧凑、价值导向工具车，以及当前价格已接近燃油车平价的二手 EV
              周围；F-150 Lightning 和 Rivian R1T 等高端 EV 卡车，更多只是比较集里「车太大、钱太多」的一端。结果是，市场定义纳入低成本工作与生活方式工具支出，排除重载牵引和高端冒险 EV
              支出，并把二手 EV、紧凑跨界车和混动紧凑卡车视为真实现状替代品。
