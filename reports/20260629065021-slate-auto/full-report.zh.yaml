      - number: '6.2'
        title: 预订牵引与预购经济性
        blocks:
          - type: paragraph
            body: >-
              相比多数交付前 EV 初创公司，Slate 拥有多得多的公开需求信号，但买家沿漏斗下行时，信号质量会急剧变化。最初的预订被刻意设计成轻承诺：$50 全额可退款费用，锁定未来购买机会，而不是订单。到 2026
              年晚春，公开来源仍引用超过 160,000 个预订；在 6 月 24 日发布活动上，管理层称数字已达
              180,000。这是有意义的认知和举手信号，但不等于付费需求。下一步更难：预订持有人会获得一个有限窗口，支付不可退款 $300 预购订金；如果此前已付预订费，则净额为
              $250。此时他们还没有最终确定配件、融资或确切落地价。客户尽调问题因此不是 Slate 能否吸引点击或邮箱注册，而是多少预订者会在购买开始像真实五位数承诺后转化。
