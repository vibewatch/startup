      - number: '1.4'
        title: 工厂建设、需求信号与上市准备
        blocks:
          - type: paragraph
            body: >-
              Slate 的运营布局已不止公司与设计职能。CNBC 2025 年 6 月工厂专题展示了 Michigan 州 Lake Orion Township 的 beta 设施，正在制造 70
              多辆用于内部测试和认证的车辆；多份 2025–2026 年地方与公司相关来源确认，量产计划落在 Indiana 州 Warsaw 的前 RR Donnelley/LSC
              印刷厂。留存地方报道在项目规模上方向一致：投资约 $383.5 million 至 $400 million，全职岗位超过 2,000 个，面积约 1.4 至 1.5 million
              平方英尺，且公司此前声明指向最高 150,000 辆年产能。WVPE 进一步补充了工厂范围，包括电池包组装、座椅制造和总装。


              需求信号很强，但还不能像已交付车辆那样入账。Slate 2026 年 4 月新闻稿确认预订超过 160,000 辆；CNBC 报道称，2026 年 6 月 24 日正式开放预购时，预订超过 180,000
              辆。预购机制有意把好奇心和更硬的承诺区分开：旧预订使用可退款 $50 占位费，而当前预购要求不可退款订金，并锁定交付窗口。官方页面称，首批交付目标仍为 2026 年末，Q4 2026 正常生产流程是目标。与
              RepairPal 和 Tesla NACS/Supercharger 生态的合作补齐了上市栈，但联邦认证和真实产能爬坡仍是从有前景需求走向真实收入的门槛。
