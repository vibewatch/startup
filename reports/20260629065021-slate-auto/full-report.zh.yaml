        title: 定价、预订经济性与收入模式
        blocks:
          - type: paragraph
            body: >-
              定价栈终于具体到可以分析。Slate 公开基础卡车标价为 $24,950，Squareback 和 Fastback SUV 配置分别为 $29,950 和 $31,950。按美国 EV
              标准，这让产品头牌足够便宜，但经济性取决于头牌价格之后发生什么。最初预订费用为可退款 $50，而预购要求不可退款 $300 订金；已支付预订费的客户净额为
              $250。这意味着预订量是收入质量的弱代理：它传递的是关注度，不是已承诺的单位经济性。Slate 真正的变现逻辑是基础车辆加上加购——贴膜、配件、SUV 改装、融资选项和服务支持——公司公开宣传有 175
              多种配件，产品目录中大多数商品低于 $500。因此，核心承销问题不是人们是否喜欢 $24,950 这个头牌，而是配件附加率和转化行为能否把实际 ASP 和贡献利润率抬到单薄的基础卡车起点之上。
