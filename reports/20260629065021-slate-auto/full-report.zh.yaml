      - number: '7.5'
        title: 风险优先级、监测项和推翻论点的触发器
        blocks:
          - type: paragraph
            body: >-
              读 Slate
              风险图谱，关键不是把每个风险都看成同等严重。优先级最高的是能快速级联的风险：工厂或认证延迟把交付往后推；可退款兴趣转成确定订单的转化偏弱；服务网络缺口放大保修或声誉损害；如果这些问题在单位经济性稳定前推高烧钱，融资压力会随之上来。这些风险最可能摧毁可选性，因为它们同时打击运营、收入可信度和资本获取。


              缓释因素存在，但公开证据只部分成熟。具名电池伙伴、可见的 Warsaw
              工厂、正在招募的服务网络，以及清晰差异化的产品概念，都是实打实的正面因素。它们只是还不能替代证明。尽调上，论点应收紧到可监测事件：最终许可放行、可信的认证路径、不可退款订单以健康比例转化、足够广的高压和保修覆盖，以及首批交付前后的治理稳定。如果这些标记没有按计划夯实，Slate
              就不再像一家聪明简化的卡车公司，而更像又一家资本密集型初创公司，发现简单化的工业落地比市场营销难得多。
