      - number: '2.4'
        title: 驱动与约束：本土组装叙事有帮助，但抵免、充电接入和车队通电都会侵蚀采用
        blocks:
          - type: paragraph
            body: >-
              Slate 最强的采用驱动很简单：它是少数公开尝试把新型 EV
              工具车推入大众市场标价带的公司之一。但公司在最显眼的购车补贴结束后上市，因此买家现在必须用工具价值和运营经济性来证明购车合理，而不能靠税收抵免观感。这会伤到消费和小企业两类案例。充电在改善，但门槛已从充电桩总量转向适配度和地理位置。有停车条件的家庭适合家充，租户和多户住宅居民则面临额外协调和基础设施负担。商业侧，如果公用事业无法按车辆交付节奏为场站通电，电网本身会成为瓶颈。贸易政策也有双刃性：更保护主义的关税制度奖励本土组装叙事，但仍可能推高进口内容成本和行业不确定性。
