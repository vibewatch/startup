      - number: '7.2'
        title: 认证、环保和政策风险
        blocks:
          - type: paragraph
            body: >-
              Slate 的平价故事不能让它绕开汽车合规复杂度。NHTSA 的公开指引说得很清楚，美国新制造商在首次销售前仍必须提交 VIN 解码信息，正式识别制造商，并通过标签和自我认证证明每辆车符合适用的
              FMVSS。Slate 已出现在 NHTSA 制造商数据库中，但这只是注册信号，不等于一辆量产卡车已经清过所有首发关口。工厂侧，IDEM 的公开通知显示，Re:Car dba Slate Auto 已进入
              Warsaw 总装厂的 FESOP 实时流程，公众意见和最终许可条件仍可能影响时间表或运营约束。


              政策风险进一步叠加合规负担。TechCrunch 报道和 IRS 指引合在一起显示，原本「低于 $20,000」的表述依赖联邦抵免环境，而该环境已经变化，迫使 Slate
              的价值主张更直接地站在无补贴经济性上。同时，白宫的对等关税立场让贸易政策波动继续存在，即便车辆在美国国内组装也一样，因为上游零部件和材料仍穿过全球供应链。更长期看，NHTSA 新 AEB
              规则提醒市场，安全内容要求会随时间收紧；对任何押注仅靠简单就能守住持久成本优势的车企，这一点都重要。
