      - number: '2.3'
        title: 买家—用户—付款方分层：最强匹配在价格敏感家庭、DIY 车主和受约束小企业
        blocks:
          - type: paragraph
            body: >-
              Slate
              最可能的早期客群并不相同，哪怕他们都对同一个平价问题有反应。消费场景里，买家、用户和付款方通常是同一个人或家庭，因此标价、月供、充电可得性和自配置意愿就是核心门槛。这指向价值导向家庭、有固定停车位的通勤者、喜欢模块化升级的
              DIY
              车主，以及想要卡车形态但不想承担全尺寸卡车成本的生活方式买家。商业场景里，买家和付款方变成业主经营者、承包商或小车队经理，用户可能是员工。这类买家更在意出勤率、充电物流、服务覆盖和失去的商用抵免。两类客群里，直销和有限取车中心都会进一步压缩可触达细分：有兴趣还不够，买家还必须能接受预购队列、2026
