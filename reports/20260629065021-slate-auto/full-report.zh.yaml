  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从真实需求和资本信号出发，穿过披露缺口和可比公司分散度，最终落到跟踪 / 继续研究的立场。
    data:
      nodes:
        - id: funding
          label: $650M Series C / 已融资约 $1.4B
          detail: 私人 EV 初创公司具备真实资本底座
        - id: demand
          label: 160K+ 至 180K+ 预约标题
          detail: 需求存在，但质量仍要验证
        - id: opacity
          label: 未披露投后估值或 runway
          detail: 价格和资本结构仍不透明
        - id: comps
          label: 公开可比公司区间很宽
          detail: 从 Lucid 式压缩到 Tesla 式溢价，跨度太大，无法精确定价
        - id: risk
          label: 上市前执行风险仍高
          detail: 认证、产出和转化仍要验证
        - id: output
          label: 跟踪 / 继续研究
