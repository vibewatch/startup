            body: >-
              Slate 有足够真实的信号留在投资人屏幕上：公司披露了 $650 million Series C，累计公开融资约 $1.4 billion；预约量从该轮完成时的 160,000 多，升至 2026 年 6
              月末的 180,000 多；如今也有了具体定价和订金条款。但这些强项还不足以承销估值。公开记录仍未披露 2026
              年投后估值、优先权结构、当前现金余额，或任何经审计的收入和利润率基础。这意味着估值必须围绕情景做价格纪律，而不是干净的内在价值模型。仅看公开证据，正确立场是跟踪 /
              继续研究，置信度中等，风险评级高。如果新投资人被要求支付接近声誉较弱传闻中超过 $3 billion
              的价格，该价格已经主要倚赖牛市情景首发。纪律严格的投资人应要求更低得多的进入区间，或等首发后证明转化、产出和毛利率正向计划靠拢。
