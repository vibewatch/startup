      - number: '6.4'
        title: 社区反应，以及购买一辆平价、无多余配置 EV 的意愿
        blocks:
          - type: paragraph
            body: >-
              Slate 的公众反应异常清晰，因为产品本身足够两极化。评测报道对核心取舍看法一致：Slate 按新 EV
              标准便宜，正是因为它砍掉许多默认便利功能，把个性化交给加装件。这确实吸引了一群买家：他们想要一辆简单通勤车、第二辆车，或一个可自己改装的项目式平台。同样的简化也带来怀疑。评测者反复指出，一旦加上目的地费、税费和想要的配件，「补贴后低于
              $20k」的情绪感受和更接近 $30k 的现实价格之间，差距就变得实质。论坛讨论也支持这种分裂。有些预订用户认为 $250-$300
              的预购步骤，是为一个颠覆性概念付出的小赌注；也有人说，一旦这辆卡车不再像一代人才有一次的便宜货，账就不再划算。换句话说，Slate 确实有买家真心喜欢，但这份喜欢有一个清晰可见的价格天花板。
