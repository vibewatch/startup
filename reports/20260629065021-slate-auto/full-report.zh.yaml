      - number: '8.5'
        title: 退出就绪度、终止触发器和最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开证据下，Slate 还没有 IPO 就绪。连管理层都暗示 2027
              年大概率太早，因此短期现实退出菜单是私募后续融资、战略商业合作，或耐心等到首发数据出现。真正的关口不是产品是否有意思，而是资本结构和运营证明是否足够好，能撑过首批交付到正常生产之间的高烧钱区间。这把尽调指向一份简短、不可妥协的清单：Series
              C 的准确条款、当前现金和月度烧钱、按队列的预购转化、物料清单与毛利率桥，以及认证和工厂就绪里程碑。投资人还应预先定义推翻论点的触发器。若 2027 年在正常生产前需要桥接轮、预购转化实质偏弱、ASP
              向剥离配置的基础版滑落，或认证和产出出现重大延迟，Slate 都会从一个可跟踪的后期机会，转入潜在降估值轮或资本重组案例。
