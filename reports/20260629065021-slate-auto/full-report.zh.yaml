          - type: paragraph
            body: >-
              Slate 的成本故事建立在同时简化产品和工厂上。公司相关和地方报道把 Warsaw 工厂投资描述为接近 $400 million；地方减税报道则给出更明确的 $363 million
              方案，大致分为房地产工程和设备。IDEM 2026 年 1 月通知确认，该装配厂新排放单元仍在推进许可步骤，这提醒我们，上市资本仍绑定在一个还在移动的工业项目上，而不是一条已完工产线。毛利侧，Slate
              正在去掉显而易见的成本中心：没有传统喷漆车间、单一基础配置、手动车窗、用车主设备替代完整连接栈作为信息娱乐、通过 RepairPal
              外包服务能力，以及直销模式。相比传统经销商加工厂布局，这些选择可能降低固定成本，但不会消除保修敞口、认证风险，或证明 BOM 桥接可信的需要。因此，管理层关于正毛利的说法仍是论题，不是已验证财务结果。
