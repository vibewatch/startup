        - id: service
          label: 保修或服务失败
        - id: launch
          label: 上市延后 / 产出偏低
        - id: customer
          label: 客户失望
        - id: revenue
          label: 收入不及预期
        - id: burn
          label: 更高烧钱 / 储备需求
        - id: capital
          label: 后续融资压力
        - id: valuation
          label: 估值受损
      edges:
        - from: permit
