            - 订金时间和交付窗口讨论很具体
            - 除举手式兴趣外仍无证据
            - 仅交付前
        - label: DIY 个性化爱好者
          values:
            - 有具名论坛帖子和官方产品页面
            - 他们为何喜欢这一概念，证据很强
            - 付费配件采用尚无验证
            - 仅交付前
        - label: 价格敏感的怀疑者
          values:
            - 有具名论坛和负面媒体证据
            - 对 $30k 全包价格的担忧很具体
            - 没有已衡量的取消率
            - 仅交付前
        - label: 车队 / 商业目标客户
          values:
            - 官方车队页面和行业媒体采访
            - 具体使用场景类别已经公开
            - 没有续约或合同验证
            - 仍在目标锁定阶段，还不是已交付项目
