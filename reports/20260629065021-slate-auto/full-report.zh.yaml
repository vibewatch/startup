  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值逻辑
      - 概率信号
      - 失败原因
    rows:
      - - 悲观
        - 年销量 15K；单车实际收入 $28K；转化偏弱；需要桥接融资
        - $420M 收入按约 0.8x-1.2x，意味着约 $0.34B-$0.50B 价值
        - 如果生产正常化延后且预订转化不及预期，风险有实际分量
        - 如果认证或融资在规模化前断裂，结果可能更差
      - - 基准
        - 年销量 40K；单车实际收入 $30K；中等转化；不需要早期资本重组
        - $1.2B 收入按约 1.4x-1.8x，意味着约 $1.68B-$2.16B 价值
        - 如果 Slate 成功上市并在波动中爬坡，这是公开证据下最站得住的路径
        - 仍假设执行显著好于当前公开产能
      - - 乐观
        - 年销量 80K；单车实际收入 $32K；强转化和配件组合；无重大上市延误
        - $2.56B 收入按约 1.8x-2.5x，意味着约 $4.61B-$6.40B 价值
        - 要求 Slate 迅速接近管理层自己的盈亏平衡规模
        - 对一家首次造车公司而言，需要异常强的资本效率
      - - 如果下一轮价格高于 $3B
        - 投资人在正常生产、利润率或转化出现公开证据前付款
        - 入场价已高于基准情景公允价值，并向乐观情景倾斜
        - 仍可能成功，但如果 2027 年需要资本，安全边际会真实坍缩
        - 平轮或下行轮会更容易想象
    notes: 所有情景价值都是分析师基于公开证据得出的估计，不是公司指引。它们用于框定价格纪律， 不是声称预测精度。
