  - id: FR001
    title: 风险热力图——剩余可能性 vs. 影响
    type: matrix
    layout: wide
    summary: Slate 最高的剩余风险集中在高可能性 / 高影响象限：上市准备度、转化质量、服务执行和融资韧性。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - 仲裁 / 声誉观感
            - 配件 ASP 不及预期
            - 关税 / 投入品通胀
            - 预约转预购流失
        - label: 中等可能性
          values:
            - 未来安全成本上升
            - DIY 责任归属争议
            - 独立门店一致性不足
            - Warsaw 上市延迟
        - label: 低可能性
          values:
            - 单一场地事件扰动
            - 许可重设计意外
            - 电池保修损失激增
            - 延迟后的融资挤压
    approximationNotes: 可能性和影响是基于保留来源的定性分析排序；这张热力图不是概率模型。
    claimRefs:
