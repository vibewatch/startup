      - number: '4.5'
        title: 公开牵引代理与私下财务缺口
        blocks:
          - type: paragraph
            body: >-
              Slate 的特别之处在于，公开牵引不等于公开财务披露。公司可以指向 4 月前超过 160,000 个预订、6 月下旬超过 180,000 个预订、Warsaw 工厂主动改造、DTC
              结账流程、可见配件目录，以及服务 /
              保修框架。这些都是真实运营信号。但尽调团队要可信承销这个故事，仍需要缺失的财务包；上述信号不能替代它。留存来源没有披露已实现收入、手头现金、月度烧钱、跑道、单位层面毛利、保修准备金假设、预计配件附加率、最终激励合同或投后股权结构。即便最强的公开需求指标，在
              Slate 报告多少比例预订者成为付费买家、以及实际毛到净价格之前，也仍然偏软。换句话说，公开故事方向上令人鼓舞，但可投资财务模型大多仍是私下信息。
