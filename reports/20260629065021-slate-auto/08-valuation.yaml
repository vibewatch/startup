- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Demand
    - 180K+ reservations suggest genuine consumer interest in a low-price modular EV
    - Reservations started as refundable $50 holds and may not translate into hard orders
    - Preorder conversion by cohort and cancellation data
  - - Economics
    - Simple vehicle design, no paint shop, and accessory upsell can support an unusual cost structure
    - Management profitability claims remain unverified and launch economics are still hypothetical
    - BOM plus gross-margin bridge with warranty assumptions
  - - Capital base
    - ~$1.4B raised is unusually deep for a private pre-launch automaker
    - Without runway and preference disclosure, headline capital can still mask weak future economics
    - Current cash, monthly burn, and Series C term sheet
  - - Market position
    - Sub-$25K entry price creates a differentiated mass-affordability angle
    - Actual transaction prices may drift higher once buyers add SUV kits, wraps, and options
    - Realized ASP and mix data after launch
  - - Comparable set
    - Rivian, Lucid, and Harbinger prove investors will still back EV OEMs with credible proof
    - Canoo and other failures show the market destroys value quickly when ramp proof is late
    - Normal production plus quarter-over-quarter conversion and cash-burn performance
  notes: The anti-thesis is not that Slate lacks interest; it is that late-stage EV startup pricing can outrun the point at which proof becomes investable.
