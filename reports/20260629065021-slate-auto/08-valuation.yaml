company:
  name: Slate Auto
chapter:
  number: 8
  title: Valuation
  summary: Slate Auto has credible capital and demand signals, but public evidence still does not disclose the 2026 post-money valuation, cap-table economics, or current runway, so valuation has to be framed through scenarios rather than false precision. Public EV benchmarks range from Lucid-like compression to Rivian-like growth multiples to Tesla’s scaled upper bound, while Harbinger and Canoo illustrate both customer-backed proof and catastrophic downside. On that basis, Slate looks worth tracking but not buying aggressively at an implied late-stage mark above roughly $3 billion; the public base case is materially lower at about $1.7 billion to $2.2 billion, and a 2027 financing need would raise real down-round risk.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Slate has enough real signal to stay on an investor’s screen: the company has raised a disclosed $650 million Series C, sits at roughly $1.4 billion of cumulative public funding, moved reservations from 160,000-plus at the round close to 180,000-plus by late June 2026, and now has concrete pricing and deposit terms. But those strengths do not make the valuation underwritten. The public record still does not disclose the 2026 post-money valuation, the preference stack, the current cash balance, or any audited revenue and margin base. That means valuation must be framed as price discipline around scenarios rather than a clean intrinsic model. On public evidence alone, the right stance is TRACK / RESEARCH-MORE with medium confidence and a high risk rating. If a new investor is being asked to pay something near the low-reputation rumor of more than $3 billion, that price already leans on a mostly bull-case launch. A disciplined investor should want either a much lower entry zone or
    post-launch proof that conversion, throughput, and gross margin are moving toward plan.'
