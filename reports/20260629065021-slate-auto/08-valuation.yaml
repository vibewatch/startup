- id: financing-context-and-valuation-opacity
  title: Financing context and valuation opacity
  body: 'Slate’s financing context is strong in absolute dollars but weak in disclosure quality. The company and its press coverage confirm the April 2026 round, total capital near $1.4 billion, late-2026 delivery intent, and factory spend measured in hundreds of millions. The customer funnel now also has a clearer hierarchy: earlier reservations were refundable $50 expressions of interest, while preorders are backed by $300 non-refundable deposits. That helps valuation framing because it distinguishes attention from real conversion. Even so, none of the retained primary or high-reputation sources disclose current runway or a post-money valuation, and even market-data pages that index the round leave the valuation line opaque in public view. The Carvana warrant disclosure is strategically interesting because it suggests commercial optionality around Mark Walter-linked capital, but it does not solve the core underwriting problem. Public investors still cannot see whether Slate’s latest round
    came with aggressive anti-dilution, secondary components, or a price that already assumes near-flawless execution.'
  claimRefs:
  - CV001
  - CV003
  - CV005
  - CV006
