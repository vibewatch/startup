- id: comparable-framework
  title: Comparable framework
  body: 'Slate has no perfect public analog, so the right comparable set mixes public EV OEMs, private manufacturing rounds, and distressed cautionary cases. Tesla is the disclosure and scale outlier, with a far richer multiple that no pre-launch startup should assume. Rivian is more useful as a scaled-but-still-lossmaking public EV OEM benchmark; Lucid shows how hard public markets can compress even a known brand once scale and cash consumption remain in debate. Harbinger is a better private manufacturing comp because it paired a smaller Series C with an actual FedEx order, signaling customer-backed proof earlier in the lifecycle. Canoo is the adverse mirror: a startup that raised capital, entered production in some form, then still ended in Chapter 7 and a de minimis asset outcome. Together these comps say Slate deserves neither Tesla-style scarcity pricing nor a free pass just because demand headlines are large. The market rewards proof, disclosed economics, and capital efficiency far
    more than concept-level reservation volume.'
  claimRefs:
