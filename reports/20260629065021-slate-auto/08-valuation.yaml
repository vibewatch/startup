  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: runway-disclosure
    missingEvidence: Current cash on hand, monthly burn, working-capital needs, and management’s internal runway bridge to normal production.
    whyItMatters: Without runway, investors cannot judge whether Slate can avoid a 2027 bridge round or how much valuation pressure a delay would create.
    diligencePath: Request the latest treasury and monthly operating package under NDA, including cash forecast and launch-spend bridge.
    relatedQuestionRefs:
    - QV011
    - QV025
  - type: private-evidence-only
    severity: material
    topic: valuation-opacity
    missingEvidence: Exact 2026 post-money valuation, liquidation preferences, anti-dilution protections, secondary mix, and board rights from the Series C term sheet.
    whyItMatters: Headline valuation is not enough for underwriting. Preferences and dilution can make an apparently acceptable round economically unattractive to new money.
    diligencePath: Review the executed Series C term sheet and cap table with counsel under NDA.
    relatedQuestionRefs:
    - QV012
    - QV025
  - type: stale
    severity: material
    topic: demand-conversion
    missingEvidence: Reservation-to-paid-preorder conversion by cohort, refund rates, and realized mix between base truck and SUV conversion intent.
    whyItMatters: Reservation headlines can overstate real demand quality. Conversion and mix drive both revenue and financing risk in the first 12 months after launch.
    diligencePath: Request cohort-level funnel data from commerce and finance teams after the first preorder months.
    relatedQuestionRefs:
    - QV003
    - QV025
    - QV028
  - type: missing-source
    severity: material
    topic: launch-readiness
    missingEvidence: A current regulatory and manufacturing readiness schedule covering homologation, validation gates, normal-production timing, and bottleneck remediation.
    whyItMatters: The valuation band moves materially if launch slips. Throughput and certification drive whether the base case starts on time or becomes a financing event.
    diligencePath: Request the latest manufacturing readiness review, validation signoff tracker, and launch milestone map from operations.
    relatedQuestionRefs:
    - QV009
    - QV026
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: TV003 comparable set is intentionally partial because many private EV rounds do not expose full valuation or unit-economics detail publicly.
    missingEvidence: A fuller comp sheet covering more private EV startups with disclosed post-money values, audited financials, and equivalent launch-stage unit economics.
    whyItMatters: Slate has no perfect public analog, so the comp table is useful but incomplete. Better private-round transparency would sharpen entry discipline and downside framing.
    diligencePath: Expand the comp set with private-market databases or management-shared comparables once access to non-public round data is available.
    relatedTableRefs:
    - TV003
