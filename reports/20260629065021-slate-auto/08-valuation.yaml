  - CV014
  - CV015
  - CV016
  - CV018
  - CV039
  - CV040
  - CV046
  - CV048
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - 2026 cap table and Series C term sheet
    - Post-money valuation, liquidation preferences, anti-dilution, secondary mix, and board rights
    - Headline valuation is unusable without knowing economic seniority and dilution protection
    - Management data room and counsel review under NDA
  - - Current cash, burn, and runway
    - Cash on hand, monthly burn, working-capital needs, and funding bridge assumptions
    - Determines whether Slate can reach normal production without a 2027 recap
    - CFO packet under NDA and monthly operating dashboard
  - - Preorder conversion by cohort
    - Reservation-to-paid-order conversion, refund rates, and any cancellations by geography or trim intent
    - Separates genuine demand from cheap optionality
    - Commerce, CRM, and cohort-conversion analysis
  - - BOM and margin bridge
    - Vehicle-level COGS, warranty assumptions, accessory gross profit, and service economics
    - Tests whether the 2027 positive cash-flow claim is realistic
    - Operations plus finance review; supplier-cost model
  - - Certification and throughput readiness
    - Homologation status, validation gates, normal production timing, and bottleneck map
    - Launch timing drives both burn and whether scenario math starts in 2026 or slips into 2027
    - Manufacturing and regulatory readiness review
  - - Commercial channel optionality
    - Carvana, fleet, or strategic-customer relationship terms if any exist beyond exploratory ties
    - Could provide distribution leverage or working-capital support, but public evidence is incomplete
    - Business-development and partner-contract review
  notes: Items one through four are the hard blockers. Without them, Slate can be framed, compared, and monitored, but not responsibly underwritten as a late-stage priced round.
