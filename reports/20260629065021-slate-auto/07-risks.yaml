  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: battery fallback
    missingEvidence: Any qualified second-source battery supplier, alternate chemistry path, or contractual fallback if SK On volume or quality slips.
    whyItMatters: Launch output and gross margin are concentrated on one named battery supplier in the public record.
    diligencePath: Request the battery-supply agreement summary, qualification timeline, and contingency sourcing plan.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: cash runway
    missingEvidence: Current cash balance, monthly burn, minimum cash covenant, supplier-payment terms, and management downside plan if launch slips.
    whyItMatters: Public capital raised is known, but capital adequacy through launch and ramp is not verifiable from retained sources.
    diligencePath: Obtain monthly cash bridge, 13-week cash forecast, capex schedule, and downside financing model.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: preorder conversion
    missingEvidence: Reservation-to-preorder conversion, order-to-cancel rate, and early pricing elasticity after the move to non-refundable deposits.
    whyItMatters: The difference between curiosity and committed demand is the single fastest way to change capacity and burn assumptions.
    diligencePath: Request weekly funnel metrics from reservations to paid preorders, by channel and customer segment.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR006
  - type: private-evidence-only
    severity: material
    topic: homologation testing
    missingEvidence: Crash-test status, FMVSS workback, validation owners, and any third-party test results or completion certificates.
    whyItMatters: Slate cannot sell legally or preserve timeline credibility without a completed certification package.
    diligencePath: Request the homologation program tracker, external lab schedule, and executive signoff cadence.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
