- id: customer-conversion-pricing-service
  title: Customer Conversion, Pricing, and Service/Warranty Risk
  body: |-
    The reservation book is useful, but it is not the same thing as proven revenue. Slate’s reservation terms describe the original $50 fee as fully refundable and explicitly not a purchase agreement, while June 2026 coverage shows the company asking customers to move into $300 non-refundable preorders before all final ownership details were settled. That is exactly where many startup order books get stress-tested: enthusiasm turns into attrition once buyers have to compare real payment, accessory, financing, and delivery uncertainty against substitutes they already know.

    Service and warranty design introduce a second conversion risk. Slate’s public service page promises unusually generous battery and bumper-to-bumper coverage for a company that has not yet built a field fleet, while the RepairPal partnership is meant to create nationwide reach with select high-voltage capability. That may keep fixed costs lower than a captive-service model, but the same public materials concede warranty service is not available at every location. If customers discover that the cheapest truck requires meaningful accessory upsell, long waits, or uneven service execution, the brand could lose the very mainstream buyers it needs most: price-sensitive consumers who value certainty over novelty.
