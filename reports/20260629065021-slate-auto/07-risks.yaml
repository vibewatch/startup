- id: financing-governance-execution
  title: Financing, Governance, and Execution Risk
  body: |-
    Slate has raised enough capital to be taken seriously, but not enough publicly disclosed data to make runway risk disappear. TechCrunch and TNW both point to roughly $1.4 billion raised after a $650 million Series C, yet public sources still leave cash on hand, debt capacity, supplier-payment terms, warranty reserves, and monthly burn largely opaque. That is acceptable for a private startup, but it means outside investors cannot verify whether the current cash bridge comfortably covers certification, tooling, launch inventory, service parts, and ramp inefficiency if deliveries slip.

    Governance optics matter because pre-production automakers often need one more financing event before the model is self-funding. Slate changed CEOs in March 2026 and then lost the Bezos family-office representative from its board in May 2026. Either event can be explained benignly as a shift from incubator-era leadership to operating leadership, but together they weaken the halo effect that helped the company raise attention and capital in the first place. When the first trucks have still not been built, leadership churn and investor-distance signals matter more than they would at an already scaled manufacturer because they can tighten the terms of any follow-on capital exactly when the business is most fragile.
  claimRefs:
