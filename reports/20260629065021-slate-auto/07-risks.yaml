callouts:
- calloutType: risk
  title: The preorder book is the first real adverse test
  body: Slate’s demand story only starts to mature when refundable curiosity becomes non-refundable commitment. Investors should treat preorder conversion quality, not reservation volume, as the decisive early read on whether the product’s low-price narrative survives contact with real buyer trade-offs.
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR041
- calloutType: risk
  title: Service is both the cost advantage and the brand-risk surface
  body: Using independent shops and DIY-friendly design can keep fixed costs down, but the public record already shows that warranty service and high-voltage capability are not identical everywhere. That makes post-sale execution one of the fastest ways for Slate to either validate or damage its affordability thesis.
  claimRefs:
  - CR020
  - CR021
  - CR022
  - CR023
  - CR040
- calloutType: recommendation
  title: Do not underwrite late-2026 deliveries on narrative alone
  body: Before relying on the current launch timeline, request the final permit path, the certification workback, preorder-conversion metrics, warranty/service SLAs, and the cash bridge through ramp. Without those proofs, the central downside is not that the truck is a bad idea; it is that the company reaches the expensive part of the launch before its operating evidence catches up.
  claimRefs:
  - CR003
  - CR005
  - CR014
  - CR021
  - CR025
  - CR026
  - CR044
