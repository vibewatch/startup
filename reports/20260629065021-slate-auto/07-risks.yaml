- id: TR005
  title: Mitigation and Kill Criteria Table
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Permit and plant readiness
    - Warsaw permit or tooling milestone slips
    - No clear final permit path or no credible launch-readiness evidence by planned SOP window
    - Re-underwrite launch timing and working-capital needs before adding capital
  - - Homologation / certification
    - FMVSS and VIN program remains opaque close to sale
    - Management cannot show pre-sale filing status, test plan, and signoff owners
    - Treat launch date as provisional and widen downside scenario
  - - Customer conversion
    - Reservations fail to convert into meaningful paid orders
    - Non-refundable preorder uptake is weak relative to reservation base or falls after final pricing
    - Assume lower utilization, slower working-capital turn, and higher marketing spend
  - - Service execution
    - HV and warranty coverage remains patchy
    - Material geographies remain outside practical warranty reach or SLA standards stay undefined
    - Increase expected warranty reserve and customer-acquisition friction assumptions
  - - Supplier concentration
    - Battery plan remains single-threaded
    - No secondary sourcing or visible contingency for battery disruption
    - Cut volume assumptions and stress margin under supplier delay
  - - Financing / governance
    - Further investor-distance signals emerge before scale
    - Another board/backer retreat, emergency raise, or unexplained leadership change occurs pre-delivery
    - Escalate to thesis-break review because capital access may be tightening at the wrong moment
  notes: Thresholds are analytical decision triggers for diligence, not reported company targets. They are designed to convert public uncertainty into monitorable go/no-go signals.
