- id: risk-prioritization-mitigations
  title: Risk Prioritization, Monitors, and Thesis-Break Triggers
  body: |-
    The right way to read Slate’s risk profile is not that every risk is equally severe. The highest-priority risks are the ones that can cascade rapidly: factory or certification delays that push deliveries out, weak conversion from refundable interest into firm orders, service-network gaps that magnify warranty or reputation damage, and financing strain if any of those issues lift burn before unit economics settle. Those are the risks most likely to destroy optionality because they hit operations, revenue credibility, and capital access at the same time.

    Mitigation exists, but it is only partly mature in public evidence. A named battery partner, a visible Warsaw plant, live service-network recruitment, and a clearly differentiated product concept are all real positives. They just do not yet substitute for proof. For diligence purposes, the thesis should tighten around monitorable events: final permit clearance, a credible certification path, evidence that non-refundable orders convert at healthy rates, broad enough high-voltage and warranty coverage, and governance stability through first deliveries. If those markers do not firm up on schedule, Slate stops looking like a cleverly simplified truck company and starts looking like another capital-intensive startup that discovered simplicity is harder to industrialize than to market.
