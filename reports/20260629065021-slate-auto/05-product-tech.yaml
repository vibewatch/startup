- id: manufacturing-system-and-launch-readiness
  title: Manufacturing system and launch readiness
  body: |-
    Slate’s manufacturing story is inseparable from the product architecture. Public sources consistently show a distributed footprint—design in Michigan and California, engineering in Michigan, and vehicle manufacturing in Warsaw, Indiana—but the production thesis depends on heavy simplification at the plant level. Local and official sources describe a repurposed 1.4 million-square-foot former printing facility, no traditional paint shop, a single baseline truck configuration, and a parts count far below a typical pickup. WVPE reports that the site is intended to hold battery-pack assembly, seat manufacturing, and general assembly, which suggests Slate wants more than final bolt-together credibility inside the factory walls.

    Even so, the launch is not yet commercially proven. Slate’s own terms still describe the truck as preproduction, the Warsaw page says the factory is still being tooled, and local reporting described demolition and retooling in progress before the expected late-2026 operating window. The manufacturing design looks coherent for affordability; the unanswered question is whether the plant, suppliers, and quality systems can move from a simplified concept to a reliable volume product without slipping timetable or degrading service quality.
