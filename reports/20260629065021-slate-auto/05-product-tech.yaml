figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Slate’s launch proposition layers a simple core vehicle under modular personalization, partner support, and a minimalist digital surface.
  data:
    layers:
    - label: Ownership / Community Layer
      detail: Reservation, preorder, accessory drops, tours, and a still-new owner community aim to keep engagement going after the initial purchase decision.
    - label: Service / DIY Enablement Layer
      detail: RepairPal shops, Slate U tutorials, free manuals, diagnostics, and later app support define the post-sale operating model.
    - label: Cabin / User Interface Layer
      detail: Phone-first interface, tactile controls, no standard infotainment stack, optional audio and tablet accessories.
    - label: Vehicle Core Layer
      detail: Single-motor RWD architecture, current 65 kWh LFP pack, 205-mile target, 11 kW AC / 120 kW DC charging.
    - label: Manufacturing Simplification Layer
      detail: Single baseline build, no paint shop, low parts count, composite exterior panels, and off-line personalization to protect affordability.
  approximationNotes: Layer order is analytical rather than an engineering block diagram. It organizes what Slate publicly discloses into the surfaces that matter for launch economics and ownership.
