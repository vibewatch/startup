tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Base pickup
    - Price-sensitive retail buyer or light-duty owner-operator
    - Current launch baseline; public specs materially updated in June 2026
    - Low-content factory build supports low sticker and later upsell
    - Need SOP build freeze and actual delivered spec set
  - - SUV conversion kit
    - Household buyer who sometimes needs rear seats
    - Publicly marketed and described, but not yet customer-proven
    - Lets one platform span pickup and 5-seat SUV use cases
    - Need install time, labor path, and regulatory treatment by body style
  - - Accessory / wrap marketplace
    - DIY owner, fleet upfitter, or delivery partner
    - Marketplace publicly described; attach-rate economics still undisclosed
    - Defers customization cost until after purchase and keeps factory baseline simple
    - Need live SKU count, margin structure, and delivery/install SLAs
  - - Charging stack
    - All owners; especially first-time EV buyers
    - Publicly specified with NACS and Tesla access
    - Simple home-charging story plus widely understood connector standard
    - Need final EPA charging curves and cold-weather performance data
  - - Service / repair stack
    - DIY owners plus customers using partner shops
    - RepairPal partnership announced; location count still inconsistent across pages
    - Combines open manuals and local third-party shops instead of owned centers
    - Need final roster, reimbursement terms, and field-service quality metrics
  - - Warsaw production system
    - Slate internal operations and launch buyers indirectly
    - Tooling and reindustrialization in progress
    - No paint shop, low parts count, and repurposed plant can reduce capex and complexity
    - Need PPAP, supplier readiness, and yield / scrap visibility
  notes: Each row mixes public facts with execution-stage interpretation. “Current public status” describes evidence maturity, not customer-delivery proof.
