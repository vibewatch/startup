- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Current public status
  - Scope
  - Evidence strength
  - Gap / caveat
  rows:
  - - Safety feature set
    - Publicly listed
    - FCW, AEB, ESC, airbags, backup camera, pedestrian ID, auto high beam
    - Official FAQ plus reveal release
    - No public crash result or final certification output yet
  - - Battery / powertrain warranty
    - Publicly listed
    - 10 years / 110,000 miles retaining 70% capacity
    - Official service and FAQ pages
    - Reserve assumptions and failure-rate data are undisclosed
  - - Vehicle warranty and roadside
    - Publicly listed
    - 4 years / 50,000 miles bumper-to-bumper plus roadside assistance
    - Official service and FAQ pages
    - No field claims data exist yet because launch is pre-delivery
  - - Repair information access
    - Publicly promised
    - Free manuals, diagnostics, and Slate U how-tos
    - Official service pages
    - No public sample manual or diagnostic portal is yet retained
  - - Service coverage
    - Partially specified
    - RepairPal shops plus 200+ high-voltage-certified locations
    - Official releases and outside coverage
    - Network count is inconsistent and warranty service may not be available everywhere
  - - Regulatory / certification outputs
    - Still pending
    - EPA range, public crash results, and launch compliance milestones
    - Official disclaimers and absence of public outputs
    - Biggest remaining trust gap before SOP
  notes: This table separates published control statements from independently observed proof. “Pending” means the company acknowledges the surface but has not yet produced public outputs.
