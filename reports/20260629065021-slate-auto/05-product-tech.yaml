- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workaround
  - Slate surface
  - Measurable benefit claim
  - Limitation / friction
  rows:
  - - Short-range personal hauling and commuting
    - Older ICE pickup or higher-priced new truck
    - Base two-seat truck with simple charging and low starting price
    - Lower entry price and fewer bundled features to pay for
    - Rear seats, rich infotainment, and final EPA/cost-of-insurance proof are missing
  - - Occasional family utility
    - Buy a crossover or larger truck full time
    - Convert pickup to 5-seat SUV when needed
    - One vehicle can cover more than one life stage
    - Conversion labor, homologation detail, and storage tradeoffs remain lightly documented
  - - DIY personalization hobby
    - Aftermarket installs on conventional vehicle
    - Attach points, Slate U tutorials, and wraps / accessory kits
    - Customization can happen after purchase and incrementally
    - Accessory compatibility and warranty treatment still need real-world proof
  - - Local contractor or light commercial duty
    - Compact ICE truck or van
    - Payload / tow envelope plus branding wraps and racks
    - Lower acquisition cost and flexible upfitting path
    - Tow rating is modest and service logistics are not yet proven
  - - First-time EV ownership
    - Avoid EVs because home charging seems complicated
    - Included charging cable, outlet-first education, Tesla/NACS message
    - Reduces charging-intimidation barrier
    - Apartment, winter, and towing use cases still depend on real-world validation
  notes: Benefits are public-value propositions, not verified customer outcomes. The table translates marketing into concrete jobs-to-be-done and constraints.
