- id: vehicle-architecture-and-electronics
  title: Vehicle architecture and electronics strategy
  body: |-
    The current public architecture is intentionally simple. As of June 2026, Slate’s retained official spec materials converge around a single rear-motor, rear-wheel-drive launch configuration, a 65 kWh LFP battery with 63 kWh usable energy, 205 miles of projected range, and an 11 kW AC / 120 kW DC NACS charging setup. The company’s own historical trail is important, though: reveal materials in April 2025 described two battery options and 150-to-240-mile targets, while the 2026 FAQ says Slate increased the standard-range package and no longer promises the extended pack. That shift does not necessarily imply a technical problem, but it does show the launch build is still being simplified and optimized close to start of production.

    The electronics strategy is also atypical for a 2026 EV. Slate rejects the standard dashboard-screen stack and instead pushes a bring-your-own-device model with a phone or tablet mount, optional audio accessories, and a non-essential mobile app that is still slated to launch later in 2026. In practice, that removes some software complexity and hardware cost, but it also narrows how much embedded digital differentiation Slate is actually bringing versus simply deleting features from the BOM.
