- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Public evidence
  - Key dependency
  - Technical risk
  rows:
  - - Composite exterior / no-paint body system
    - Cuts paint-shop capex and enables wraps
    - Official and design-review sources describe gray polypropylene composite panels
    - Panel durability, wrap supply, and quality control
    - Material and finish durability are not yet field-proven at customer scale
  - - Core propulsion system
    - Provides low-cost EV powertrain baseline
    - Public spec converges on single rear motor, RWD, 65 kWh LFP pack
    - Battery sourcing and thermal management
    - Supplier set and long-run degradation data are not public
  - - Charging architecture
    - Supports home and public charging
    - 11 kW AC, 120 kW DC, NACS, Tesla access, and Treehouse install partner
    - Tesla/NACS ecosystem and home-install partners
    - Real charging curve, charger reliability, and winter behavior remain unverified
  - - Phone-first cabin stack
    - Replaces embedded infotainment with consumer devices
    - Official pages say no CarPlay/Android Auto is needed because the phone is primary
    - App launch, mounts, and accessory ecosystem
    - Feature deletion can be efficient, but customer acceptance is still unproven
  - - Repairability / service layer
    - Combines DIY content with third-party shop support
    - Slate U, manuals, diagnostics, and RepairPal are all disclosed
    - RepairPal training and parts distribution
    - Coverage, reimbursement, and quality consistency are not transparent yet
  - - Warsaw manufacturing cell
    - Executes simplified baseline build before add-ons
    - Public sources describe tooling, battery-pack assembly, seat manufacturing, and general assembly
    - Supplier deliveries, labor ramp, and process capability
    - Retooling progress is visible, but SOP readiness and quality metrics are not
  notes: Architecture rows mix hardware, software, and operating processes because Slate’s differentiation depends on how those pieces reinforce one another.
