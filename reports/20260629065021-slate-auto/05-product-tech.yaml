  evidenceGaps:
  - type: missing-source
    severity: material
    topic: compliance-gap
    missingEvidence: Final EPA-certified range output, public crash-test result, and a visible launch compliance milestone log tying the 2026 truck to final homologation.
    whyItMatters: These are the clearest external proofs that the simplified truck is ready for real customer delivery rather than still being a promising preproduction concept.
    diligencePath: Request final EPA documentation, any NHTSA / USNCAP submission timing, and the internal SOP gate list for certification close-out.
    relatedQuestionRefs:
    - QE021
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: supply-chain-opacity
    missingEvidence: Named current cell supplier, pack assembler, composite panel supplier, key electronics vendors, and major accessory manufacturing partners for the June 2026 launch build.
    whyItMatters: Supplier concentration or late vendor changes can destabilize cost, quality, and start-of-production timing even when the public product philosophy looks coherent.
    diligencePath: Request supplier list, sourcing geographies, single-source exposures, and any launch-critical component alternatives.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: service-economics
    missingEvidence: RepairPal reimbursement terms, final warranty-service roster, parts-distribution model, and escalation path when an owner’s local shop cannot perform the needed work.
    whyItMatters: The outsourced service model is a core part of the Slate thesis; if the economics or fallback workflows are weak, the support story can fail even with a strong base product.
    diligencePath: Request the executed partner operating model, pilot-shop metrics, service-level targets, and warranty reserve assumptions.
    relatedQuestionRefs:
    - QE013
    - QE014
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: A direct public requisition feed or org chart showing the current depth of engineering, manufacturing, embedded, and quality hiring straight from Slate rather than from third-party aggregators.
    whyItMatters: Hiring intensity is a useful signal for technical build-out, but the retained public surface is weaker than the rhetoric around reindustrialization and launch scale.
    diligencePath: Pull a structured export from Slate’s Workday board or request a role-count breakdown by function and location.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: conflicting-data
    severity: material
    topic: spec-freeze
    missingEvidence: A clean change log that reconciles the older 150/240-mile dual-pack story with the June 2026 single-pack 205-mile launch spec, plus any impact on timing or margins.
    whyItMatters: Spec movement near SOP can be healthy simplification, but it can also hide supplier, cost, or validation pressure that matters for underwriting launch credibility.
    diligencePath: Ask management for the formal build freeze, battery roadmap decision memo, and what exactly was cut or deferred from the original reveal configuration.
    relatedQuestionRefs:
    - QE006
    - QE021
    relatedTableRefs:
    - TE003
    - TE005
