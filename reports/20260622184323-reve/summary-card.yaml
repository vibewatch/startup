  topStrengths:
    - >-
      Distinct product narrative around planning-first image generation, iterative editing stability, and native 4K
      output.
    - Founder bench has unusually strong Adobe and image-generation research credibility for a young startup.
    - Monetization surface is real rather than hypothetical, with visible paid plans and a beta API path.
    - Category demand is large and fast-moving, especially where creators need better text handling and controllability.
  topRisks:
    - Public evidence still does not disclose revenue quality, margins, retention, or customer concentration.
    - Visible private-market valuation context looks ahead of what external public evidence can currently underwrite.
    - High-fidelity image generation raises copyright, provenance, misuse, and policy-compliance exposure.
    - Native 4K generation and third-party AI dependencies imply meaningful compute and capital-intensity risk.
    - Competitive pressure from OpenAI, Adobe, Google, Midjourney, FLUX, and other image platforms caps pricing power.
  unresolvedGaps:
    - >-
      Independent corroboration of the visible $350 million round and ~$1.84 billion valuation reference remains
      incomplete.
    - No public disclosure of revenue, gross margin, burn, runway, or paid-customer cohort behavior.
    - No clean public view of enterprise/API mix, customer concentration, or contract durability.
    - Public evidence on safety controls, provenance tooling, and training-data governance remains thin.
