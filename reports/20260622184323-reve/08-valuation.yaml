    {
      "id": "comp-context",
      "title": "Comparable context: public comps, private references, and pricing pressure",
      "body": "A clean private-company DCF or EV/ARR model is impossible from public information, so the best available discipline is triangulation. First, use public market-cap-to-revenue shorthand for relevant software or visual-content comps. CompaniesMarketCap and Macrotrends put Adobe at roughly $76.42 billion of market cap against $24.453 billion of trailing-twelve-month revenue, Autodesk at about $39.46 billion against $6.888 billion, and Shutterstock at about $0.59 billion against $0.935 billion of annual revenue. Those rough ratios land near 3.1x, 5.7x, and 0.6x respectively. Second, use private and product comps cautiously. Midjourney, Runway, Recraft, OpenAI, BFL, Stability, Ideogram, and Adobe Firefly all show a market where image generation is already priced through subscriptions, credits, APIs, or platform bundles. That competition does not tell us what Reve is worth, but it does say that premium valuation must be earned through differentiated demand, not just model novelty.",
