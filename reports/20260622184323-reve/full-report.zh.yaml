      - number: '3.2'
        title: 能力、包装与定价对比
        blocks:
          - type: paragraph
            body: >-
              公开证据显示了几种不同的竞争形态。Reve 的差异化不在巨大信任边界或最深分发网络，而在更可控的规划加渲染工作流；当买方在意字体排印、精确修改或图像迭代时，这一点会变重要。OpenAI 和 Google 从
              API 与开发者优先角度竞争，公开用量计价和文档。BFL 与 FLUX 生态从两个方向同时竞争：一边披露较低的单图 API 价格，一边支持合作伙伴托管和开放模型访问，可能压缩整个品类的利润率。Midjourney
              仍是消费者和准专业用户基准，分层订阅价格清晰，并通过隐私升级变现。Recraft 以设计团队工作流、付费套餐所有权和隐私竞争。Getty 和 Shutterstock
              表明，有些买方愿意为安全、授权或平台聚合支付更多，而不是只为模型纯度付费。与此同时，Canva 和 Runway 最清楚地提醒市场：图像专用工具真正的替代品，往往是更宽的内容生产工作空间。
