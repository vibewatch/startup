      - number: '8.3'
        title: 可比参照：上市公司、私有公司参考与定价压力
        blocks:
          - type: paragraph
            body: >-
              仅靠公开信息，无法干净地搭出一家私有公司的 DCF 或 EV/ARR 模型，因此最可用的约束是三角校验。第一，用相关软件或视觉内容可比公司的市值 / 收入速算。CompaniesMarketCap 和
              Macrotrends 显示，Adobe 约 $76.42B 市值对应 $24.453B 的过去十二个月收入，Autodesk 约 $39.46B 对应 $6.888B，Shutterstock 约 $0.59B
              对应 $0.935B 年收入。粗略倍数分别约为 3.1x、5.7x 和
              0.6x。第二，谨慎使用私有公司与产品可比。Midjourney、Runway、Recraft、OpenAI、BFL、Stability、Ideogram 和 Adobe Firefly
              都说明，图像生成市场已经靠订阅、点数、API 或平台捆绑定价。竞争格局不能直接告诉我们 Reve 值多少钱，但足以说明：高估值必须靠差异化需求挣出来，不能只靠模型新鲜感。
