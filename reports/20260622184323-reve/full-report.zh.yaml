  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接生成器、套件、聚合器与替代品
        blocks:
          - type: paragraph
            body: >-
              Reve 合理的竞争集合比“其他文本生成图像创业公司”更宽。直接模型供应商包括 OpenAI、Google Imagen、Black Forest Labs、Recraft、Midjourney 和
              Stability AI。相邻创意工具套件包括 Canva 和 Runway；它们可能胜出，不是因为单一图像模型最好，而是因为把图像生成折进更宽的工作流。企业信任替代品包括 Getty 和
              Shutterstock，它们围绕法律舒适度和模型聚合销售。Adobe Firefly
              尤其重要，因为它同时扮演套件和平台角色：既是目的地产品，也是工作流界面，还是合作伙伴模型的分发方。开发者替代品又加一层。买方可以通过 OpenAI 和 Google API，通过
              BFL、fal.ai、Replicate、Hugging Face 的 FLUX 渠道，或通过 Shutterstock 等聚合器，接触相似的底层模型家族。这意味着 Reve
              同时在工作流、信任和分发上竞争，而不只是拼模型质量。
