      - CV042
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 收入质量
        - 经常性收入、付费客户数、留存和队列扩张
        - 这些决定可见估值是溢价但公平，还是仅仅过早
        - 管理层 KPI 包和数据室收入桥接
      - - 成本结构
        - 推理成本、GPU 承诺、扣除算力后的毛利率和支持负担
        - 4K 和迭代编辑工作流的服务成本可能很高
        - 财务和基础设施尽调
      - - 客户集中度
        - 头部账户敞口、渠道组合、企业与创作者拆分、续约
        - 集中度风险会同时改变下行空间和退出价值
        - 销售运营导出加两位客户访谈
      - - 股权结构 / 优先权
        - 清算优先权、员工稀释和最新董事会批准估值支撑
        - 私募轮条款会彻底改变新资金结果
        - 由律师参与的法律和融资尽调
    notes: 每项尽调要求都因为能直接改变建议而被选中；没有一项只是装饰。
    claimRefs:
      - CV011
      - CV012
      - CV032
      - CV033
      - CV039
      - CV040
      - CV041
      - CV042
