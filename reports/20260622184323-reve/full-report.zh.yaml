        blocks:
          - type: paragraph
            body: >-
              Reve 最强的公开差异化证据是定性的，而不是基准表格。官方材料和发布痕迹持续强调规划优先控制、字体排印、电影感美学，以及通过代码锁定图像元素的能力。这让 Reve
              更适合与高端创意工作流比较，而不是与通用低成本提示词 API 比较。竞争者材料把背景讲清楚了。OpenAI 提供带 token 化定价的多模态图像生成和编辑 API；Adobe 提供商业安全模型、自定义模型
              API、合成操作和来源凭证；Google 提供带 SynthID 水印的图像生成，并且已经从 Imagen 迁移到更新的 Gemini 原生图像模型；Black Forest Labs 及其生态强调 API
              规模和开放权重；Recraft 侧重向量生成、字体排印和创作者所有权；fal.ai 和 Hugging Face 展示更明确的模型机制和开发者易用性。相对这组玩家，Reve
              在可控性和设计品味上有差异化，但公开基准可见度不足。抽样的 Artificial Analysis 页面没有清楚显示 Reve 条目，因此投资人仍缺少一张强独立联赛表来定位产品。
