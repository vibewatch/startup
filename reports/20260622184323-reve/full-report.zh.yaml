    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Reve 官方材料一直把公司呈现为创意工具创业公司，而不是纯模型实验室。About 页面列名 Reve AI, Inc.，地点在 Palo
              Alto；主页和隐私政策则围绕图像生成、图像编辑、发现、策展，以及由编辑器牵引的工作流来定义服务。帮助中心和订阅文档显示，公司沿 Free、Lite、Pro 套餐走消费者到准专业用户的商业化路径，另有独立
              beta API 界面，而不是一个完全开放的平台生态。这个定位很关键：公司想变现的是工作流质量和可控性，不只是原始模型访问。证据也显示，Reve
              希望用户把产品理解为协作型创意软件：公开文案更强调规划、布局和直接操控，而不是只靠提示词合成图像。仍然不透明的是公司规模。审阅的官方页面没有披露员工数、客户数、除 Palo Alto
              联系信息之外的办公室数量，或正式董事会构成。
