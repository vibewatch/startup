  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础按待完成任务可见，而不是按具名账户列表可见
        blocks:
          - type: paragraph
            body: >-
              公开来源让 Reve 的目标客户基础比实际客户名册更容易理解。产品一直被定位给设计师、营销人员、创意团队和重复编辑工作流。官方网站强调可印刷的 4K 输出、字体排印和直接操控编辑；Hunted Space
              从设计师、营销人员和创意团队角度描述发布；ToolWorthy 把适配范围延伸到代理机构、产品团队和 AI 工程师；帮助中心则展示了支持、账单和内容管理界面，符合真实产品生命周期。beta API
              控制台重要，因为它增加了第二种买方 / 用户形态：不只是网页应用里的创作者，还有把生成能力接入流水线的开发者或自动化工作流。


              因此，今天最干净的分层是按任务，而不是按 logo：免费探索者、付费准专业用户、营销或代理机构团队，以及开发者 / API
              用户。仍缺的是通常会覆盖在这张地图之上的商业层：没有公开来源拆分各细分中有多少用户、谁在团队规模付费，或 API 支出是否正在成为客户基础中的重要份额。
