      - number: '4.3'
        title: 成本结构与资本强度：4K 输出和外部 AI 依赖主导叙事
        blocks:
          - type: paragraph
            body: >-
              官方主页给出最清晰的一手成本信号：Reve 2.0 原生渲染 4K-by-4K，也就是 16 megapixels；公司称其把架构扩到 1.0 的三倍参数，并使用更多算力。这些表述重要，因为原生 4K
              生成会压缩价格与成本之间的空间。公开可比公司显示，当输出质量或法律安全性提高时，成本底线会多快上升。Google 公布的 4K 图像输出价格约为每张 $0.15 到 $0.24；fal 的按 megapixel
              定价意味着 16MP 级输出约 $0.40；Getty 在把图像包进企业安全法律保护时，每次生成收费接近 $2。


              Reve 没有披露自身成本结构落在这个区间的哪个位置。隐私政策称公司使用第三方 AI 技术，说明至少部分服务交付成本由外部中介。ToolWorthy 也提到独立 API
              计费和使用上限；当推理成本有分量时，这类运营行为很常见。正确解读不是 Reve 一定不经济，而是公开记录让资本强度变得显而易见，却把毛利率、训练支出和供应商承诺留在黑箱里。
