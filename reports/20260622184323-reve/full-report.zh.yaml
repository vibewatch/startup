        title: GTM 动作与收入质量：自助需求可见，但转化耐久度不可见
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一种混合 go-to-market 动作。Hunted Space 把 Reve 2.0 描述给设计师、营销人员和创意团队；帮助中心显示订阅管理和支持基础设施；beta API
              控制台则指向第二类开发者或流水线买方。这在财务上有建设性，因为创意工具公司往往需要同时拿到自助采用和更高价值的工作流买方，才能支撑耐久的毛利。Adobe 的文件提供了成熟类比：创意软件可以同时通过
              SaaS、订阅、按次付费和渠道分发变现。


              问题在于，Reve 的公开需求证据仍更像发布期热度，而不是经常性收入披露。Product Hunt 热度从较温和的 1.0 条目提升到 2.0 发布看板，BGR 也把最初发布描述为病毒式传播，但 Hacker
              News 互动很薄，没有公开来源披露订阅用户数、流失、合同期限或企业转化。ToolWorthy 提到重度用户会很快转向
              Pro，这对变现方向正面，但仍只是定性代理。因此，收入质量仍是核心尽调缺口：公众兴趣可见，耐久付费用户分群不可见。
