      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              相关买方图谱比“消费者 vs 企业”更细。个人创作者和准专业用户最容易看见，因为 Reve 展示了 Free、Lite 和 Pro 套餐，Canva
              等同业也把图像生成放进自助创意套餐。营销和设计团队是第二类，因为 Canva 和 Adobe 把 AI 图像生成定义为日常内容生产工作流的一部分，而不是小众实验。对品牌敏感的企业团队是第三类：Getty
              产品围绕授权、赔偿和安全商业使用来销售，意味着它走的是法律审核动作，和爱好者或社交内容采购很不一样。开发者和 agent 构建者构成第四类，因为 Reve、OpenAI 和 Google 都提供 API
              或开发者文档，让图像生成变成另一个产品内部的功能。这个分层重要，因为预算所有者逐行变化：个人订阅、设计软件预算、营销活动或内容预算、经过法律审核的品牌预算、产品工程预算，采用速度不同，能支撑的价格点也不同。
