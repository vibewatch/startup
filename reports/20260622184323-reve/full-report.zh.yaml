      - number: '2.2'
        title: 规模测算视角：宽口径生成式 AI 市场与 Reve 相关切口
        blocks:
          - type: paragraph
            body: >-
              公开市场估算只有在先区分大类标题和 Reve 实际可服务切口之后才有用。Grand View、Global Market Insights 和 Fortune Business Insights 都显示生成式
              AI 市场庞大且高速增长，但它们的 2025 年估算从 USD 22.21 billion 到 USD 103.58 billion 不等，因为测量对象并不相同。Research and Markets
              明确纳入图像和视频合成以及 AI 创意设计平台，这解释了为什么宽口径数字可以支持预算池扩张的论点，却不能证明精确的纯图像 TAM。Adobe 过去十二个月收入超过 USD 24
              billion，也提醒相邻创意软件支出已经很可观，但这同样只是既有支出的代理指标，不是 Reve 的直接市场规模。实际结论是，宽口径生成式 AI 估算最好只作为上限背景层。Reve
              的可投资问题在更低一层：当字体排印、可控性和商业安全很重要时，创意生产、营销、电商和开发者支出中有多少会迁移到规划优先的图像生成。
