            body: >-
              当前公开客户故事中最重要的风险是证据集中，不一定是收入集中。公开证据集中在 Product
              Hunt、社区发布分析、基准网站和评测文章。这有助于证明认知度和早期工作流适配，但很少说明收入是否分散在许多付费账户中，还是集中在少数重度用户、团队或渠道。LLM Stats 和 LLM Reference
              页面也显示公开目录偏窄，这可能在平台成熟前限制交叉销售宽度。


