      - number: '5.4'
        title: 信任、安全、权利与技术风险
        blocks:
          - type: paragraph
            body: >-
              信任与合规记录能用，但不完整。最强直接证据来自法律和政策文本，而不是第三方认证：隐私政策称，第三方 LLM 可能为部分功能处理提示词或输出；生成内容可能根据设置公开；服务还收集账户和交易数据。BGR
              评测给出一个反向信号，认为 Reve 图像除元数据外没有清楚标为 AI。与此同时，U.S. Copyright Office
              指引凸显了该品类所有公司的两个真实外部风险：单靠提示词通常无法产生可获版权保护的输出；用受版权保护材料训练仍处于诉讼和政策争论中。竞争对手在缓解措施上更明确。Google 称 Imagen 输出带
              SynthID；Adobe 强调 Content Credentials 和商业安全训练；Recraft 对免费与付费输出的所有权区分发布得更清楚。保留的 Reve
              来源中缺少同等公开证据，并不能证明公司弱，但确实制造了围绕水印、来源证明、训练数据治理和企业信任控制的尽调缺口。公开信任信息落后于产品雄心。
