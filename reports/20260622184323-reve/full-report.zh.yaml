      - number: '3.3'
        title: 信任姿态、分发能力与规模不对称
        blocks:
          - type: paragraph
            body: >-
              即使模型市场变化很快，规模和信任仍然重要。Adobe 和 Reve
              以及多数私有同业处在根本不同的层级，因为它把大型上市公司规模、创意软件装机基础、合作伙伴模型市场和清晰的训练数据安全信息合在一起。按公开市值看，Getty 远小于 Adobe，但其 AI
              产品异常明确地谈授权、赔偿和商业安全输出。Shutterstock 的战略重要性不在于它是集合中最大公司，而在于它把模型选择变成市场问题：如果买方愿意在同一个界面中从 GPT
              Image、Imagen、Runway 和 Gemini
              中选择，即使上游模型仍有差异，聚合器也能拥有客户关系。其他玩家在企业合规或赔偿上的公开证据并不均衡，这本身就是尽调信号：最安全的供应商会在一开始就把故事讲清楚。对 Reve
              来说，缺口不是没有质量主张，而是其公开界面对治理和企业就绪度的展示，少于最强的信任优先替代品。
