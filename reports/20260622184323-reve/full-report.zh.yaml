companyProfile:
  summary: >-
    Reve 是一家位于 Palo Alto 的私有 AI 创意工具创业公司，重点做可控的文本生成图像和迭代式图像编辑。它公开讲述的产品主轴是 Reve 2.0：把规划和渲染拆开，原生生成 4K
    图像，并试图让布局、字体排印和编辑比只靠提示词的同类产品更可控。创始团队有 Adobe 和前沿图像模型背景，但公司公开披露仍很少覆盖融资细节、收入质量、客户集中度和运营规模。
