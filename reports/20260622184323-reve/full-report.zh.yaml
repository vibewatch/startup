  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险栈
        blocks:
          - type: paragraph
            body: >-
              Reve 的风险栈由政策敏感的产品能力和偏薄的公开运营披露共同牵引。公司营销的新图像模型称其参数量提升到 3x、使用更多算力，并原生生成 4K-by-4K；BGR
              则称输出可以真实到被误认为真实摄影，并且除元数据外没有清楚标为
              AI。这个组合提高了产品质量本身变成政策和信任风险的概率：更高保真输出可以改善采用，也会增加滥用暴露、内容真实性担忧和对防护措施的审视。我们审阅的公开材料确实显示了基础法律和隐私文档、API beta
              和支持中心，但没有显示成熟的公开信任门户、具名客户基础、事件档案或透明经济模型。对投资人来说，正确默认值不是“隐藏强项”，而是“在尽调补齐缺口前，残余不确定性很高”。
