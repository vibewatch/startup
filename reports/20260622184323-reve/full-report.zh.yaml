      - number: '6.3'
        title: 免费到付费和重复使用逻辑可信，但公开耐久指标缺失
        blocks:
          - type: paragraph
            body: >-
              最强的公开扩张逻辑是结构性的，而不是基于用户分群。ToolWorthy 称产品采用 Free、Lite 和 Pro 套餐，重度用户会很快转向 Pro；API
              使用则单独按点数计费。这意味着至少有两种方式可以扩大账户价值：更高频或更高强度的网页使用，以及工作流固化后的程序化 API
              使用。官方政策层又增加一层细节：订阅类型会影响用户内容的公开可见性和训练处理方式，说明不同档位也能表达不同的隐私和工作流需求。


              即便如此，本章还不能按 SaaS 口径承销耐久度。没有审阅来源发布
              NRR、GRR、流失、合同期限、续约率或客户满意度分数。评测者明确指出文档偏薄、预设和集成有限，以及部分工作流学习摩擦。这些不是推翻论点的因素，但意味着今天的公开证据更支持转化叙事，而不是留存叙事。公平读法是，Reve
              有可信的免费到付费和网页到 API 机制，但还没有公开耐久数据集。
