    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Reve
              自己的材料描述的是一款围绕模型架构打造的创意软件，而不只是提示词输出画廊。核心产品定义结合了文本生成图像、图像编辑、发现、策展，以及一个编辑器：用户可以在最终渲染前查看并修改类似代码的中间计划。官方论点在审阅的公开材料中保持一致：1.0
              证明，密集结构化表示在控制上优于只靠 caption 的条件约束；2.0 则用更多参数、更多算力、更多数据和原生 16-megapixel 输出进一步推进这个论点。按工作流看，今天的产品包有六个可见层：规划 /
              布局、渲染、迭代编辑与参考处理、对字体排印敏感的构图、订阅与账户控制，以及 beta API 界面。帮助中心提到 video
              energy，说明界面已经不再是纯静态图像；不过公开记录在视频上的厚度仍远低于图像生成。Reve 此处的主要强项是架构连贯、用户侧控制强，而不是公开文档覆盖面广。
