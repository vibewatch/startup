      - number: '8.5'
        title: 情景区间、尽调问题与打破论点的触发点
        blocks:
          - type: paragraph
            body: >-
              情景分析应刻意保持宽区间，因为最该避免的错误是假精确。如果 Reve
              最终证明自己能在规模化阶段拿到软件式经常性收入、差异化企业渠道，并且在重算力投入下仍有强贡献毛利，那么当前私有估值可以被证明合理，甚至保守。但如果业务仍由创作者拉动、对政策敏感，或基础设施成本过重，当前估值会在品类常态化后很快压缩。因此，最重要的尽调问题不是表面问题：投资人需要收入质量、客户集中度、队列行为、股权结构条款，以及安全运营细节。如果私有尽调显示客户面窄、成本结构性高企，或政策负担比变现增长更快，投资论点就应被打破。换句话说，当前融资参考应该拿来反向尽调，而不是盲目信任。
