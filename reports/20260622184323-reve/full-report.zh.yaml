        title: 收入模式与定价表面：公开标价存在，但实际经济性缺席
        blocks:
          - type: paragraph
            body: >-
              Reve 现在展示的公开表面足以确认它不只是研究演示，但还不足以完成承销判断。官方页面确认了消费者网页产品、套餐和账单支持流程、支付处理，以及 beta API 控制台。独立评测补上了可见价格卡：BGR 记录的
              2025 年 3 月发布期经济性是每天 20 张免费图、100 个入门点数，以及 $5 购买 500 点数；ToolWorthy 报告当前 Lite 和 Pro 档分别为每月 $7.99 和
              $19.99，另有独立 API 点数。LLM Stats 又给出一个公开 API 代理价格：每张生成图 $0.18。


              这个组合有用，因为它同时显示了几个变现表面：免费获客、经常性订阅套餐、充值式使用，以及开发者 / API 支出。它也不够充分，因为没有公开来源披露付费用户数、实际 ARPU、套餐结构、有效折扣或 API
              客户集中度。换句话说，标价看得清，但真实收入引擎仍大多属于私有信息。
