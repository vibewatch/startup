      - number: '7.2'
        title: 法律、版权、安全与政策风险
        blocks:
          - type: paragraph
            body: >-
              最难承销的公开风险不是已立案诉讼，而是生成图像法律、训练数据不透明和内容滥用之间的互动。Reve
              条款把许多争议导入仲裁，并为知识产权滥用保留法院救济；这提供了有用的程序保护，但不能实质证明训练栈干净，或输出会避免侵权冲突。Copyright Office 2025
              年报告强化了投资人不能忽视的两点。第一，美国版权法仍以人类作者身份为中心；Office 在解释许多纯 AI 生成输出为何不会自动获得版权保护时，明确讨论了 Midjourney 等图像生成系统。第二，Office
              的训练报告称，在生成式 AI 开发中使用受版权保护作品仍是活跃的法律和政策争议，包括未经授权摄入和近乎精确输出的担忧。BGR
              评测补充了实际产品角度：即使还没走到法庭测试，高度逼真的输出和薄弱的可见标识也会提高反弹、有害使用或平台政策冲突的概率。
