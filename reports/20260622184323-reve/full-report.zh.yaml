  - id: FM001
    title: 市场规模视角——从广义生成式 AI 到 Reve 可服务楔子
    type: pyramid
    layout: standard
    summary: 证据支持只把广义生成式 AI 估算当作天花板；Reve 竞争的是更窄一层，图像生成质量、排版、可编辑性和信任才是关键。
    data:
      items:
        - label: 广义生成式 AI 市场
          value: USD 22.2B to USD 103.6B in 2025
          detail: Grand View、Global Market Insights 和 Fortune 给出的广义生成式 AI 类别区间。
          tone: neutral
        - label: 创意和多模态工具子集
          value: Image, video, and design workflows
          detail: Research and Markets 加上 Canva 和 Adobe 显示，图像生成正越来越多地被打包进设计、视频和内容生产工作流。
          tone: neutral
        - label: 企业信任楔子
          value: Licensed, governable, commercially safe output
          detail: Getty 和 Adobe 凸显了买方细分：授权、溯源和法律风险缓释驱动采购。
          tone: warning
        - label: Reve 可触达楔子
          value: Planning-first image generation for creators, design teams, and developers
          detail: Reve 的公开定位强调 prompt 忠实度、排版、可编辑规划和自助定价，而不是整套生成式 AI 栈。
          tone: positive
    approximationNotes: 只有最宽一层有直接市场规模数字。较低层级是有证据支撑的定性切片，而不是已报告的数字 TAM。
