  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品类
        blocks:
          - type: paragraph
            body: >-
              分析 Reve 时，不能把它当成对整个生成式 AI
              经济的押注。它的主页和帮助界面指向一个更具体的商业任务：以更高提示词贴合度、更好字体排印和更强编辑控制来生成并迭代图像。因此，纳入支出应覆盖创作者自助订阅、设计套件内的付费图像生成、授权型商业图像生成产品，以及图像工作流的开发者
              / API 支出。还应包括影响同一买方决策的相邻收入，例如捆绑式设计或内容生产软件，其中 AI 图像生成只是众多功能之一。排除支出包括与图像工作流无关的通用 LLM
              订阅、除非通过同一套餐或预算销售的纯视频产品、通用云计算，以及不争夺同一工作流的传统创意软件支出。最强替代集合不只是其他图像模型：还包括 Canva、Adobe 等设计套件，Getty、Shutterstock
              等授权图库既有玩家，以及任何能让买方在不绑定单一模型供应商的情况下生成、编辑并商业化图像的 API 或平台层。
