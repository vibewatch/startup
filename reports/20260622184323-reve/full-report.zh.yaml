        - 不是直接的文生图可比对象，受创作者 / 消费者敞口也更小
      - - Shutterstock
        - 公开市值 / 年收入
        - $0.59B 市值和 $0.935B 2024 收入（约 0.6x）
        - 图像和内容商业参考，公开估值基准低得多
        - 商业模式和存量内容结构不同
      - - Midjourney
        - 官方定价语境
        - 月费 $10 到 $120 的套餐，另有收入超过 $1M 后的商业权利门槛
        - 展示用户今天能从强图像生成品牌买到什么
        - 定价不是估值，这里也未披露客户规模
      - - Runway
        - 官方定价语境
        - 免费层和付费套餐，月费从 $12 起，含每月额度
        - 展示多模态创意工具的买方预期
        - Runway 更偏视频，定价也不是估值
      - - BFL / fal / 开放模型语境
        - 官方和 API 定价语境
        - BFL API 可用，fal FLUX 定价为每百万像素 $0.025
        - 展示开放模型生态如何挤压高端定价
        - 基础设施定价不能直接转化为公司价值
      - - OpenAI / Adobe Firefly / Ideogram / Stability 竞争组
        - 战略市场语境
        - 资金充足的平台和现任玩家已经开放公开 API 或应用界面
        - 证实市场拥挤，差异化必须压过强渠道
        - 战略语境不是估值倍数
    notes: 这张表混合了估值参考和定价语境，因为图像模型同行的直接私营公司估值证据并不均衡；目的在于施加纪律，而不是制造虚假的可比性。
