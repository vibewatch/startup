  - id: TV005
    title: 论点破裂与终止触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 尽调后收入质量仍未披露
        - 管理层无法展示经常性收入、留存、毛利率和集中度
        - 可见私募标记仍缺少经济性支撑
        - 除非价格大幅重设，否则转为回避
      - - 安全或溯源控制公开失效
        - 出现可见有害输出或标注事件，且没有令人信服的补救
        - 政策折现率上升，企业信任下降
        - 暂停投资流程，直到控制措施通过验证
      - - 算力经济性持续偏弱
        - 扣除算力后的毛利率或单位经济性仍结构性较差
        - 产品差异化未转化为有吸引力的软件价值
        - 把增长视为昂贵使用量，而不是持久护城河
      - - 客户多元化缺失
        - 需求依赖狭窄创作者渠道或少数账户
        - 业务开始更像波动型应用，而不是平台
        - 向较低场景结果重新定价
    notes: 触发因素把公开不确定性转化为具体尽调结果，让建议保持价格敏感，而不是被叙事驱动。
    claimRefs:
      - CV018
