              页面独立证实 Park 从 2021 年博士毕业后加入创业公司
              Reve，为创始人叙事提供了有用的第三方支撑。合在一起看，这些履历显示团队罕见地同时具备产品、创意工具和前沿图像模型能力，尤其集中在可控生成和编辑上。短板是治理透明度。审阅材料没有公布董事会名单、具名外部投资人，也没有清楚区分创始人、高管和董事。这不代表治理弱，但后文也不能假设证据之外的股权结构或董事会动态。创始人与市场的匹配看起来很强；正式治理披露则偏少。
