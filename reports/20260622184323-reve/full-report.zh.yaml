      - number: '6.2'
        title: 公开采用证据在社区发布和外部上手评测中最强
        blocks:
          - type: paragraph
            body: >-
              Reve 确实有真实的公开采用信号，但集中在社区渠道和编辑部使用，而不是具名生产部署。Hunted Space 称，Reve 2.0 在 2026 年 6 月 9 日获得 115 个 Product Hunt
              赞同票、3 条评论，并拿到当日 #12。ToolWorthy 和 Fello AI 都重复了一个强劲的 2026 年 6 月基准快照：在 Image Arena 上以 3,455 票获得 1280 分，排名
              #2。BGR 给出了抓取集合中质量最高的具名使用证据，因为评测者实际使用了产品，编辑提示词，生成四张图，并直接描述体验。Magic Hour 又补充了一篇聚焦提示词遵循、字体排印和价格的具体外部评测。


              关键限制在于，这些来源都不是客户部署案例研究。Product Hunt
              指标显示认知，不显示收入。基准投票显示用户偏好，不显示留存。编辑评测证明外部人士使用了产品，但不证明团队把它纳入经常性工作流。因此，客户故事在漏斗顶部是真实的，在漏斗底部仍然偏薄。
