        blocks:
          - type: paragraph
            body: >-
              Reve 的商业化证据比融资披露更充分。官方帮助文章显示三档套餐，Lite 和 Pro 有清晰月费，相比免费档有大幅 energy 倍数，并给 Pro 提供部分视频 energy 权益。API
              控制台已经可见，但仍标为 beta，说明变现正在从消费者编辑器向外扩展，不过文档深度还没达到成熟开发者平台应有水平。条款和隐私政策也给出有意义的尽调事实。Reve
              对许多美国争议采用有约束力的仲裁，在部分场景下借助第三方 LLM 或 AI
              提供商处理用户提示词和输出，并且根据设置，生成或上传图像可能对其他用户或公众可见。这些是真实的运营政策选择，不是营销修辞。相比之下，审阅的公开记录没有披露累计融资、估值、客户数或员工规模。BGR 2025 年 3
              月文章补充了一些定价和使用上限信息，但它仍是第三方报道，不是可长期依赖的官方投资者披露。
