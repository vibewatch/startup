- id: commercialization-legal-and-disclosure-posture
  title: Commercialization, Legal, and Disclosure Posture
  body: Reve's commercialization evidence is better than its financing disclosure. Official help articles show three plans, clear monthly pricing for Lite and Pro, large energy multipliers versus the free tier, and some video-energy entitlements for Pro. The API console is visibly present but still labeled beta, which suggests monetization is expanding beyond the consumer editor but is not yet documented with the depth expected from mature developer platforms. The terms and privacy policy also reveal meaningful diligence facts. Reve uses binding arbitration for many U.S. disputes, processes user prompts and outputs through third-party LLM or AI providers in some cases, and may make generated or uploaded images visible to other users or the public depending on settings. These are real operating-policy choices, not marketing flourishes. By contrast, the reviewed public record does not disclose total capital raised, valuation, customer count, or workforce size. BGR's March 2025 article fills
    in some pricing and usage-limit color, but it is still third-party reporting rather than durable official investor disclosure.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
