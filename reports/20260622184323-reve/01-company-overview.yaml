  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance-disclosure
    missingEvidence: Named board members, independent directors, and non-founder executive roster.
    whyItMatters: Governance concentration, investor control, and succession depth all affect diligence confidence.
    diligencePath: Request board deck, cap table summary, and current org chart directly from management.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: funding-and-valuation
    missingEvidence: Verified financing history, total raised, valuation marks, named investors, and any secondaries or debt.
    whyItMatters: Without capital history, later valuation and runway analysis would rest on guesswork rather than evidence.
    diligencePath: Request financing chronology, investor list, SAFE or preferred terms summary, and latest board-approved valuation materials.
    relatedQuestionRefs:
    - QO013
    - QO014
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: workforce-and-customers
    missingEvidence: Current headcount, customer count, office footprint, and geographic distribution.
    whyItMatters: Scale metrics are part of the cover facts and materially change how investors interpret traction and burn.
    diligencePath: Request HR headcount snapshot, payroll geography split, and customer metrics by paying plan and API usage.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO018
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: A complete investor and governance stakeholder roster rather than the mixed operating-stakeholder proxy shown publicly.
    whyItMatters: The current table is useful for diligence framing but cannot substitute for a real cap-table and control-rights map.
    diligencePath: Rebuild the stakeholder table from financing documents and investor disclosures once they are available.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-completeness
    missingEvidence: A fuller chronology covering incorporation, funding, customer milestones, and internal releases.
    whyItMatters: The milestone table is the single chronology of record, so missing finance or customer events limit historical interpretation.
    diligencePath: Request a management-provided timeline with dated financing, hiring, product, and compliance events.
    relatedQuestionRefs:
    - QO019
    - QO021
    relatedTableRefs:
    - TO004
