company:
  name: Reve
chapter:
  number: 1
  title: Company Overview
  summary: Reve is a Palo Alto creative-tooling startup publicly built around controllable AI image generation, a small founder-led team with deep Adobe and research pedigrees, and a three-tier paid-plan model with a beta API. The reviewed public record is strongest on product philosophy, founders, pricing structure, and legal/privacy posture, while funding, valuation, board composition, and precise headcount remain undisclosed. That combination makes Reve easy to place strategically but still hard to underwrite as a company from public evidence alone.
sections:
- id: identity-business-model
  title: Identity and Business Model
  body: 'Reve''s official materials consistently present the company as a creative-tooling startup rather than as a pure model lab. The about page names Reve AI, Inc. and places the company in Palo Alto, while the homepage and privacy policy frame the service around image generation, image editing, discovery, curation, and an editor-led workflow. The help center and subscription documentation show a consumer-to-prosumer commercialization path built around Free, Lite, and Pro plans, with a separate beta API surface rather than a fully open platform ecosystem. That positioning matters because it implies the company is trying to monetize workflow quality and controllability, not just raw model access. The evidence is also clear that Reve wants users to think of the product as collaborative creative software: public copy emphasizes planning, layout, and direct manipulation more than prompt-only image synthesis. What remains opaque is company scale. None of the reviewed official pages disclose
    headcount, customer count, office count beyond Palo Alto contact details, or formal board composition.'
  claimRefs:
