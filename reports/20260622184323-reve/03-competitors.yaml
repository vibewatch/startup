company:
  name: Reve
chapter:
  number: 3
  title: Competitors
  summary: Reve competes in a crowded field that includes direct image-model vendors, design-suite bundles, licensed-stock incumbents, and API distribution layers. Its clearest edge is a planning-first workflow with strong typography and editability at low self-serve price points, but those strengths sit in a market where Adobe and Getty own more visible trust signals, OpenAI and Google own more visible developer distribution, and FLUX-based open or partner-hosted paths keep commoditization pressure high. Multi-homing looks structurally easy for creators, while enterprise switching costs increasingly attach to legal comfort, privacy, and workflow integration rather than raw image quality alone.
sections:
- id: landscape-and-classes
  title: 'Landscape: direct generators, bundles, aggregators, and substitutes'
  body: 'The right competitor set for Reve is wider than “other text-to-image startups.” Direct model vendors include OpenAI, Google Imagen, Black Forest Labs, Recraft, Midjourney, and Stability AI. Adjacent creative-tool bundles include Canva and Runway, both of which can win not because they are the single best image model but because they fold image generation into a broader workflow. Enterprise trust substitutes include Getty and Shutterstock, which sell around legal comfort and model aggregation. Adobe Firefly is especially important because it blends both bundle and platform roles: it is a destination product, a workflow surface, and a distributor of partner models. Developer substitutes add yet another layer. Buyers can access similar underlying model families through OpenAI and Google APIs, through FLUX channels at BFL, fal.ai, Replicate, and Hugging Face, or through aggregators such as Shutterstock. This means Reve is competing simultaneously on workflow, trust, and distribution—not
    just on model quality.'
