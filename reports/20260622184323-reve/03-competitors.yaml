- id: trust-distribution-and-scale
  title: Trust posture, distribution power, and scale asymmetry
  body: 'Scale and trust still matter even in a fast-moving model market. Adobe sits in a fundamentally different class from Reve and most private peers because it combines large public-company scale with a creative-software install base, a partner-model marketplace, and a clear training-data safety message. Getty is much smaller than Adobe by public-market value, but its AI product is unusually explicit about licensing, indemnification, and commercially safe output. Shutterstock is strategically important not because it is the biggest company in the set, but because it turns model selection into a marketplace problem: if buyers are happy choosing among GPT Image, Imagen, Runway, and Gemini within one interface, the aggregator can own the relationship even if the upstream models remain differentiated. Public evidence on enterprise compliance or indemnification is uneven across the rest of the field, which itself is a diligence signal: the safest vendors make that story legible up front.
    For Reve, the gap is not that it lacks quality claims; it is that its public surface reveals less about governance and enterprise readiness than the strongest trust-first substitutes.'
