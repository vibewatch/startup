    - Not a standalone creator-first community product in retained pack
  - - Adobe Firefly
    - Bundle + platform aggregator
    - ~USD 76.42B market cap; ~USD 24.45B TTM revenue
    - Creative teams, brands, enterprise buyers
    - Commercially safe posture, suite integration, partner-model distribution
