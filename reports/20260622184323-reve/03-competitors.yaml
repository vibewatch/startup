- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public price / unit
  - Contract model
  - Included capability signal
  - Unknowns / discount / caveat
  - Implication for Reve
  rows:
  - - Reve
    - Lite USD 7.99/mo; Pro USD 19.99/mo
    - Self-serve monthly subscription
    - Image generation plus higher energy; Pro adds monthly video energy
    - No public API price in retained pack
    - Aggressive creator pricing but limited public enterprise signal
  - - OpenAI GPT Image
    - Metered image generation via API; image guide calculator and gpt-image pricing references
    - Usage-based API
    - Text+image generation and editing in developer stack
    - No creator subscription surface in retained pack
    - Competes hard for developer use cases
  - - Google Imagen 4
    - USD 0.06/image (Ultra); USD 0.04/image upscale; USD 0.02/image (Fast)
    - Usage-based cloud API
    - Enterprise cloud distribution and multiple speed / quality tiers
    - End-user subscription packaging not shown here
    - Transparent per-image pricing can anchor buyer comparisons
  - - Black Forest Labs / FLUX
    - 2.5c/image dev; 5c/image pro; 4c/image FLUX1.1 pro
    - Usage-based API plus partner distribution
    - Low disclosed unit economics across model variants
    - Enterprise custom terms not public
    - Compression risk for image-only margins
  - - Midjourney
    - USD 10 / 30 / 60 / 120 per month
    - Self-serve subscription
    - Unlimited relax mode starts at Standard; privacy on upper tiers
    - No API in retained pack
    - Strong creator benchmark and easy multi-home option
  - - Getty Images
    - USD 49 for 25 generations; USD 149 for 100 generations
    - Credit package / agreement
    - Commercially safe images plus legal protection
    - Higher-cost trust-first product
    - Trust can support premium pricing versus creator tools
  - - Runway
    - Free with one-time credits; Standard USD 12/user/mo annually
    - Self-serve subscription
    - Broader image and video workflow
    - Not a pure image-only product
    - Adjacency risk from broader content workspace
  - - Recraft
    - Public pricing page focuses rights, credit rollover, and API availability
    - Self-serve subscription plus API
    - Paid plans deliver ownership, privacy, and commercial rights
    - Retained text is thinner on exact numeric tiers than peers
    - Rights model can outweigh pure price comparison
  notes: Rows intentionally mix subscription and usage-based models because buyers can solve the same job through either seat-based or metered products; some public pages expose packaging more clearly than exact current sticker price.
