  - - Black Forest Labs / FLUX
    - Model family + open distribution
    - Private; broad partner and open-model distribution
    - Developers, creators, enterprises
    - Low disclosed per-image API pricing, open and partner routes
    - Commodity exposure across many channels
  - - Recraft
    - Design-focused image platform
    - Private; public financial scale not disclosed
    - Designers, creatives, teams
    - Paid-plan ownership/privacy and design-team positioning
    - Rights on free plan are less buyer-friendly than paid plans
  - - Midjourney
    - Creator-first subscription rival
    - Private; public financial scale not disclosed
    - Creators, prosumers, small teams
    - Clear tiered subscription model and large creative mindshare
    - Privacy requires higher tiers; less workflow-bundle breadth in retained pack
  - - Canva
    - Adjacent design-suite substitute
    - Private global design platform; public financial scale not in retained pack
    - Design teams, marketers, entrepreneurs
    - Image generation bundled with broader content-production workflow
    - Image generation is one feature among many, not a dedicated image product
  - - Getty Images
    - Licensed / indemnified enterprise substitute
    - ~USD 0.47B market cap
    - Brand-sensitive enterprise buyers
    - Licensed training data, indemnification, commercial safety
    - Higher-cost trust-first product, not creator-cheap experimentation
  - - Shutterstock
    - Aggregator / stock incumbent substitute
    - ~USD 0.59B market cap
    - Creative teams, marketers, platform buyers
    - Model marketplace with multiple upstream engines in one interface
    - Buyer relationship may shift to the platform rather than the model
  notes: Scale cells use the strongest supportable public signal in the fetched pack; many private vendors do not disclose current financial scale publicly.
