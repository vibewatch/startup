- id: switching-costs-and-moat
  title: Switching costs, multi-homing, and moat durability
  body: The creator tier looks structurally multi-homed. Entry prices are low enough that many users can keep more than one tool active, while platform aggregators and partner-hosted model ecosystems make it easy to compare outputs. Hard lock-in is therefore unlikely to come from raw generation quality alone. It is more likely to come from rights management, privacy settings, brand-safe data posture, saved workflow artifacts, and integration depth. Recraft’s ownership terms, Midjourney’s Stealth monetization, Getty’s indemnification, and Adobe’s training-data posture all show that the market is increasingly competing on governance and workflow assurances, not just on aesthetics. The moat risk for Reve is that transparent per-image pricing from Google and BFL pressures it from below while large platforms like Adobe, Canva, and Shutterstock pressure it from above by owning the workflow or buyer relationship. Reve’s workflow differentiation is real, but the public record does not yet show a
    comparably strong distribution or trust moat.
