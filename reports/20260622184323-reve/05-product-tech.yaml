    - Supports prompt expansion or agentic/chat features
    - External LLM or AI providers named only generically in privacy text
    - Vendor-dependency and data-processing boundaries are unclear
  - - API and account platform
    - Commercial interface for users and developers
    - Beta console, help center, subscription system, and privacy controls
    - Docs, endpoint depth, and enterprise governance remain light
  notes: This architecture table stays close to the reviewed public record and avoids pretending that internal model or infrastructure details are more disclosed than they are.
