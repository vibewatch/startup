- id: trust-safety-rights-and-technology-risks
  title: Trust, Safety, Rights, and Technology Risks
  body: 'The trust and compliance record is functional but incomplete. The strongest direct evidence is legal and policy text rather than third-party certification: the privacy policy says third-party LLMs may process prompts or outputs for some features, generated content may be public depending on settings, and the service includes account and transactional data collection. The BGR review adds an adverse signal by arguing that Reve images are not clearly marked as AI beyond metadata. Meanwhile, U.S. Copyright Office guidance underscores two real external risks for all companies in this category: prompts alone usually do not create copyrightable outputs, and training on copyrighted materials remains the subject of lawsuits and policy debate. Competitors are more explicit on mitigation. Google says Imagen outputs carry SynthID; Adobe highlights Content Credentials and commercially safe training; Recraft publishes clearer ownership distinctions between free and paid outputs. The absence of
    equivalent public evidence in the retained Reve sources does not prove weakness, but it does create a diligence gap around watermarking, provenance, training-data governance, and enterprise trust controls. Public trust messaging lags product ambition.'
