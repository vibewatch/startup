chapter:
  number: 5
  title: Product & Technology
  summary: 'Reve''s public product file centers on a planning-first image stack in which images are represented as code, rendered at native 16MP, and iterated through direct manipulation rather than prompt roulette. The strongest technology differentiation signals are layout control, typography quality, agent-native intermediates, and a workflow that spans image generation, editing, and some video energy entitlements, but the public developer and benchmark surfaces remain relatively shallow for an advanced AI company. Trust posture is the main gap: compared with Adobe, Google, and several competitors, Reve''s reviewed materials say less about watermarking, provenance, benchmark visibility, and detailed API governance.'
sections:
- id: product-definition-and-module-map
  title: Product Definition and Module Map
  body: 'Reve''s own materials describe a product that should be read as creative software built around a model architecture, not merely a gallery of prompt outputs. The core product definition combines text-to-image generation, image editing, discovery, curation, and an editor that lets users inspect and modify an intermediate, code-like plan before final rendering. The official thesis is consistent across the reviewed public file: 1.0 proved that dense structured representations beat caption-only conditioning for control, and 2.0 pushes that thesis further with more parameters, more compute, more data, and native 16-megapixel output. In workflow terms, the product bundle today looks like six visible layers: planning/layout, rendering, iterative editing and reference handling, typography-sensitive composition, subscription and account controls, and a beta API surface. The help center''s mention of video energy shows the surface is not purely static-image anymore, though the public record
    is still much thinner on video than on image generation. Reve''s main strength here is coherent architecture plus user-facing control, not breadth of public documentation.'
