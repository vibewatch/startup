- id: section-3
  title: 'Cost structure and capital intensity: 4K output and external AI dependencies dominate the story'
  body: >-
    The official homepage gives the clearest first-party cost signal: Reve 2.0 renders natively at 4K-by-4K, or 16 megapixels, and the company says it scaled the architecture to three times the parameters with more compute than 1.0. Those statements matter because native 4K generation compresses the room between price and cost. Public comps show how quickly cost floors can rise when output quality or legal safety increases. Google's published 4K image-output prices sit around $0.15 to $0.24 per image, fal's per-megapixel pricing implies about $0.40 for a 16MP-class output, and Getty charges almost $2 per generation when it wraps the image in enterprise-safe legal protection.


    Reve does not disclose where inside that envelope its own cost structure sits. The privacy policy says the company uses third-party AI technologies, which suggests at least part of service delivery cost is externally mediated. ToolWorthy also notes separate API crediting and usage caps, which is exactly the kind of operational behavior that often appears when inference cost is meaningful. The correct read is not that Reve is necessarily uneconomic; it is that the public record makes capital intensity obvious while leaving gross margin, training spend, and vendor commitments opaque.
  claimRefs:
