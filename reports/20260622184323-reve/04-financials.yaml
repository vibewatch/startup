- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Paid user count by plan
    - Cannot translate Lite/Pro price points into ARR or retention quality
    - Ask management for cohort table with paid seats, churn, and ARPU by plan and month.
  - - API realized pricing and discounting
    - Cannot tell whether $0.180/image proxy survives enterprise discounts or bundling
    - Request API rate cards, enterprise addenda, and top-20 customer effective pricing.
  - - Gross margin by workflow
    - Cannot judge whether 4K generation is subsidized by pricing or profitable
    - Request cost of inference by resolution, edit type, and batch size.
  - - Cash, burn, and runway
    - Capital adequacy remains opaque and next-round risk cannot be timed
    - Request monthly cash waterfall, burn bridge, and runway scenarios.
  - - Customer concentration and contract terms
    - Revenue durability cannot be separated from launch buzz
    - Request top-customer exposure, contract length, renewal terms, and pipeline conversion data.
  notes: Every row is a live diligence blocker rather than a cosmetic detail; the missing metrics determine whether public adoption signals convert into financeable recurring revenue.
