  evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-disclosure
    missingEvidence: Public financing announcement, Form D, or investor-verified funding record for Reve
    whyItMatters: Capital adequacy and dilution cannot be judged from current public materials.
    diligencePath: Ask management for cap table, latest financing documents, and any filed fundraising notices.
    relatedQuestionRefs:
    - QI017
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, and runway scenarios
    whyItMatters: Without these numbers the chapter cannot determine whether 4K growth is financeable without near-term external capital.
    diligencePath: Request monthly cash waterfall, six months of burn, and runway under base and growth cases.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
