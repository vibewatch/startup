  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, repeat usage, and renewal cohorts
    whyItMatters: Customer durability cannot be separated from launch buzz without cohort evidence.
    diligencePath: Request retention dashboard by plan and API cohort.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU013
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: named-enterprise-proof
    missingEvidence: Named enterprise customers, procurement records, or case studies with measurable business outcomes
    whyItMatters: Current named proof is editorial and community-based rather than production-account based.
    diligencePath: Request signed customer references, procurement records, or revenue-qualified case studies.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-customer exposure, channel-sourced ARR share, and partner dependency
    whyItMatters: A small number of customers or channels could dominate revenue without any public visibility.
    diligencePath: Request top-10 customer schedule and acquisition-source revenue mix.
    relatedQuestionRefs:
