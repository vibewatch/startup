- id: section-4
  title: Channel dependence and concentration remain the main blind spots
  body: >-
    The most important risk in the current public customer story is concentration of proof, not necessarily concentration of revenue. Public evidence is clustered in Product Hunt, community launch analytics, benchmark sites, and review articles. That is useful for proving awareness and early workflow fit, but it says little about whether revenue is diversified across many paying accounts or concentrated in a few heavy users, teams, or channels. The LLM Stats and LLM Reference pages also suggest a narrow public catalog, which can limit cross-sell breadth until the platform matures.


    Compared with mature peers like Adobe Firefly or Getty Images, Reve's public customer proof is still light on enterprise logos, procurement wins, and retention evidence. That does not mean those customers do not exist; it means they are not visible in the fetched public set. The diligence conclusion is therefore cautious: Reve looks capable of attracting the right creative users, but customer durability and concentration still depend on private data that has not been surfaced publicly.
  claimRefs:
