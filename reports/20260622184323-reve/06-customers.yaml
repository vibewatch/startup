- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - scale / public signal
  - revenue / strategic value
  - gap
  rows:
  - - Free creators / explorers
    - 'Buyer: none initially; User: individual creator; Payer: later self-serve'
    - Prompted image generation and experimentation
    - Launch free credits, daily refresh, and public launch traction
    - Feeds top-of-funnel acquisition and training/data flywheel
    - No public conversion rate from free to paid.
  - - Paid prosumers
    - 'Buyer/User/Payer: individual creator or freelancer'
    - Regular generation, editing, and asset iteration
    - ToolWorthy reports Lite and Pro monthly plans
    - Most obvious recurring-revenue segment today
    - No paid-subscriber count or ARPU.
  - - Marketing / design teams
    - 'Buyer: team lead or company card; User: designer or marketer; Payer: business'
    - 4K hero images, ads, mockups, typography-heavy creative
    - Hunted and ToolWorthy repeatedly cite marketers, agencies, and creative teams
    - Likely higher willingness to pay for repeat-edit workflows
    - No named team customer or contract proof.
  - - Developer / pipeline users
    - 'Buyer: product or engineering team; User: automation workflow; Payer: company budget'
    - API-based create / edit / remix workflows
    - Beta API console plus review references to separate API credits
    - Expansion path beyond the web app
    - No public API customer logos or volume disclosure.
  - - Brand-safe enterprise evaluators
    - 'Buyer: brand / legal / creative ops; User: internal teams; Payer: enterprise'
    - Commercial creative where rights and privacy matter
    - Terms, privacy, and review references suggest commercial use considerations
    - Could support larger contracts if trust matures
    - No procurement or enterprise case studies found.
  notes: Segments are inferred from official positioning and review language; no public customer-count breakout by segment exists.
