- id: section-3
  title: Free-to-paid and repeat-use logic is plausible, but public durability metrics are missing
  body: >-
    The strongest public expansion logic is structural rather than cohort-based. ToolWorthy says the product uses Free, Lite, and Pro plans and that heavy users move to Pro quickly, while API usage is separately credit-based. That implies at least two ways to expand account value: more frequent or higher-intensity web usage, and programmatic API use once a workflow hardens. The official policy layer adds another nuance: subscription type affects public visibility and training treatment of user content, which means different tiers can also express different privacy and workflow needs.


    Even so, the chapter cannot underwrite durability in SaaS terms. No reviewed source publishes NRR, GRR, churn, contract length, renewal rates, or customer satisfaction scores. Reviewers explicitly flag thin documentation, limited presets and integrations, and some workflow-learning friction. Those are not thesis-breakers, but they do mean today's public evidence supports a conversion narrative more than a retention narrative. The fair read is that Reve has a credible free-to-paid and web-to-API mechanism, but not yet a public durability dataset.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
