- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration / channel risk
  - impact
  - diligence path
  rows:
  - - Separate API credits
    - API demand could become meaningful before any public logo proof exists
    - Positive for expansion, but hard to underwrite without customer mix
    - Request API customer count, spend bands, and top-customer concentration.
  - - Layout-first repeat editing
    - Workflow fit may support land-and-expand among agencies and teams
    - Positive if repeat edits drive stickiness
    - Request feature-level usage retention and seat expansion by account.
  - - Product Hunt / review concentration
    - Public proof is concentrated in launch and review channels
    - Raises risk that awareness outruns durable deployment
    - Request top acquisition channels and payback by source.
  - - Narrow public model catalog
    - One active provider page and tiny public family suggest limited cross-sell breadth today
    - Could cap multi-product expansion until the catalog broadens
    - Request roadmap, attach rates, and adjacent monetization plans.
  - - No disclosed named enterprise accounts
    - A few lighthouse or channel partners could dominate early revenue without public visibility
    - Customer concentration cannot be bounded
    - Request top-10 customer exposure and channel-sourced ARR share.
  notes: Risk rows translate public gaps into explicit diligence asks; they are not allegations of current concentration.
