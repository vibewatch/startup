chapter:
  number: 6
  title: Customers
  summary: 'Reve has credible top-of-funnel and hands-on usage signals across community launches, benchmark voting, and external reviewer tests, with a plausible free-to-paid and web-to-API expansion path. The public record is still much weaker on the questions that matter most for underwriting customer durability: named production customers, retention, renewal behavior, and concentration by account or channel.'
sections:
- id: section-1
  title: Customer base is visible by job-to-be-done, not by named account list
  body: >-
    Public sources make Reve's intended customer base easier to understand than its actual customer roster. The product is consistently framed for designers, marketers, creative teams, and repeat-edit workflows. The official site emphasizes print-ready 4K output, typography, and direct-manipulation editing; Hunted Space describes the launch in terms of designers, marketers, and creative teams; ToolWorthy extends that fit to agencies, product teams, and AI engineers; and the help center shows support, billing, and content-management surfaces that fit a real product lifecycle. The beta API console matters because it adds a second buyer/user shape: not just a creator in the web app, but a developer or automation workflow integrating generation into a pipeline.


    That means the cleanest segmentation today is by job rather than by logo: free explorers, paid prosumers, marketing or agency teams, and developer/API users. What is still missing is the commercial layer that would normally sit on top of that map: no public source breaks out how many users sit in each segment, who pays at team scale, or whether API spend is becoming a meaningful share of the customer base.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
