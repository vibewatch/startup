      - number: '4.4'
        title: 'Financial verdict: pricing is legible enough to benchmark, but capital adequacy is still a blocker'
        blocks:
          - type: paragraph
            body: >-
              The positive case is straightforward. Reve clearly has a monetized product, not just an unreleased lab
              model. It already shows billing operations, current paid plans, a beta API surface, and enough third-party
              traction to suggest people are testing or using the product in real workflows. Pricing is not irrational
              relative to the market: it sits above low-cost open or semi-open API competitors and well below premium
              enterprise-safe offers. The business therefore has the outline of a workable creative-tooling monetization
              stack.


              The negative case is equally clear. None of the reviewed official pages discloses capital raised,
              valuation, cash, burn, runway, paid-customer count, ARR, enterprise discounting, or contract terms. That
              leaves the underwriter with a market map but no balance-sheet map. Because the product is 4K-native and
              API-capable, the missing variables are not cosmetic; they determine whether adoption can scale without a
              new financing event. Until management discloses cohort economics, gross margin by workflow, and capital
              backing, the chapter supports only a partial financial view rather than a financeable conclusion.
