      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is founder-heavy and technically credible. Christian Cantrell publicly
              identifies himself as founder and Chief Product Officer at Reve after prior senior product roles at
              Stability AI and Adobe, while Taesung Park and Michaël Gharbi each identify as founders with deep
              image-generation research backgrounds and prior Adobe Research experience. Alexei Efros's Berkeley page
              independently corroborates Park's move from a 2021 PhD into startup Reve, which adds useful third-party
              support to the founder narrative. Collectively, these biographies point to an unusually strong mix of
              product, creative-tooling, and frontier image-model expertise, especially around controllable generation
              and editing. The weakness is governance transparency. Reviewed materials do not publish a board roster,
              named external investors, or a clear separation between founders, executives, and directors. That does not
              imply weak governance, but it does mean later chapters cannot assume cap-table or board dynamics that are
              not in evidence. Founder-market fit looks strong; formal governance disclosure looks sparse.
