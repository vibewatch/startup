      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The growth case is real but not frictionless. Major market publishers repeatedly point to enterprise
              productivity gains, workflow automation, and demand for digital content as the macro drivers behind
              generative-AI adoption; for Reve specifically, the most relevant micro driver is not generic “AI demand”
              but whether planning-first editing meaningfully improves high-frequency creative work such as ad concepts,
              social assets, product imagery, and typography-heavy design. Multimodal suites also lower adoption
              friction because buyers increasingly expect image generation to sit inside broader design, video, and
              collaboration workflows. The constraint side is equally important. The U.S. Copyright Office says
              copyright protection requires human authorship and that prompts alone are insufficient under current
              technology, while its training report treats consent, compensation, and fair-use treatment as live issues.
              The EU AI Act adds transparency and labeling obligations for certain generative outputs in 2026. Finally,
              low self-serve price points and many near-substitutes make multi-homing easy, so valuation should not
              assume consumer lock-in just because the category is growing quickly. The clearest premium segment is
              enterprise trust: products like Getty and Adobe show that licensing, provenance, and legal comfort can
              matter as much as raw model quality.
            claimRefs:
