              - CR039
              - CR040
      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The good news is that Reve is not without mitigants. The company has written legal and privacy policies,
              an API beta, a support center, a product architecture that claims greater layout control and lower
              degradation, and founder talent with deep creative-software backgrounds. Peer pricing pages also show that
              the category has converged on credits, subscriptions, API access, and explicit commercial-rights rules,
              which means several operational controls are legible enough to diligence. But none of those mitigants
              clears the central questions by itself. The thesis should weaken quickly if visible output abuse creates
              policy backlash, if training-data or ownership disputes become product constraints, if GPU or
              third-party-model costs keep pricing opaque, or if public and private customer diligence still cannot show
              diversified recurring demand. The burden of proof for the next diligence round should therefore focus on
              enterprise safety controls, customer concentration, cost-to-serve, and whether public sharing defaults
              create unnecessary legal or reputational exposure.
            claimRefs:
