      - number: '3.3'
        title: Trust posture, distribution power, and scale asymmetry
        blocks:
          - type: paragraph
            body: >-
              Scale and trust still matter even in a fast-moving model market. Adobe sits in a fundamentally different
              class from Reve and most private peers because it combines large public-company scale with a
              creative-software install base, a partner-model marketplace, and a clear training-data safety message.
              Getty is much smaller than Adobe by public-market value, but its AI product is unusually explicit about
              licensing, indemnification, and commercially safe output. Shutterstock is strategically important not
              because it is the biggest company in the set, but because it turns model selection into a marketplace
              problem: if buyers are happy choosing among GPT Image, Imagen, Runway, and Gemini within one interface,
              the aggregator can own the relationship even if the upstream models remain differentiated. Public evidence
              on enterprise compliance or indemnification is uneven across the rest of the field, which itself is a
              diligence signal: the safest vendors make that story legible up front. For Reve, the gap is not that it
              lacks quality claims; it is that its public surface reveals less about governance and enterprise readiness
              than the strongest trust-first substitutes.
            claimRefs:
              - CP006
              - CP007
              - CP018
              - CP020
              - CP026
              - CP027
              - CP030
              - CP036
              - CP037
              - CP038
      - number: '3.4'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The creator tier looks structurally multi-homed. Entry prices are low enough that many users can keep more
              than one tool active, while platform aggregators and partner-hosted model ecosystems make it easy to
              compare outputs. Hard lock-in is therefore unlikely to come from raw generation quality alone. It is more
              likely to come from rights management, privacy settings, brand-safe data posture, saved workflow
              artifacts, and integration depth. Recraft’s ownership terms, Midjourney’s Stealth monetization, Getty’s
              indemnification, and Adobe’s training-data posture all show that the market is increasingly competing on
              governance and workflow assurances, not just on aesthetics. The moat risk for Reve is that transparent
              per-image pricing from Google and BFL pressures it from below while large platforms like Adobe, Canva, and
              Shutterstock pressure it from above by owning the workflow or buyer relationship. Reve’s workflow
              differentiation is real, but the public record does not yet show a comparably strong distribution or trust
              moat.
