      - number: '3.2'
        title: Capability, packaging, and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows several different competitive shapes. Reve’s differentiator is not a huge trust
              perimeter or the deepest distribution network; it is a more controlled planning-and-rendering workflow
              that can matter when buyers care about typography, precise revisions, or image iteration. OpenAI and
              Google compete from an API and developer-first angle, with public usage-based pricing and documentation.
              BFL and the FLUX ecosystem compete from both directions at once: they disclose low per-image API pricing
              while also enabling partner hosting and open-model access that can compress margins across the category.
              Midjourney remains a consumer and prosumer benchmark with clear tiered subscription pricing and a
              monetized privacy upsell. Recraft competes on design-team workflow plus paid-plan ownership and privacy.
              Getty and Shutterstock show that some buyers will pay more for safety, licensing, or platform aggregation
              than for model purity. Canva and Runway, meanwhile, are the clearest reminder that the real alternative to
              an image-specific tool is often a broader content-production workspace.
