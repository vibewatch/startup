      - number: '2.2'
        title: 'Sizing lenses: broad generative-AI market versus Reve-relevant wedge'
        blocks:
          - type: paragraph
            body: >-
              Public market estimates are useful only after separating broad category headlines from Reve’s actual
              serviceable wedge. Grand View, Global Market Insights, and Fortune Business Insights all show large and
              fast-growing generative-AI markets, but their 2025 estimates span from USD 22.21 billion to USD 103.58
              billion because they are not measuring the same thing. Research and Markets explicitly includes image and
              video synthesis plus AI creative-design platforms, which helps explain why broad category numbers can
              support the thesis that budget pools are expanding without proving a precise image-only TAM. Adobe’s more
              than USD 24 billion of trailing-twelve-month revenue is also a reminder that adjacent creative-software
              spend is already substantial, but that too is an installed-spend proxy, not a direct market size for Reve.
              The practical conclusion is that broad generative-AI estimates are best treated as an upper-bound context
              layer. Reve’s investable question sits lower in the stack: how much of creative-production, marketing,
              ecommerce, and developer spend migrates to planning-first image generation where typography,
              controllability, and commercial-safety matter.
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
