        title: Legal, copyright, safety, and policy risk
        blocks:
          - type: paragraph
            body: >-
              The hardest public risk to underwrite is not a filed case but the interaction between generative-image
              law, training-data opacity, and content misuse. Reve's Terms route many disputes into arbitration and
              preserve court relief for intellectual-property misuse, which is useful process protection but not
              substantive proof that the training stack is clean or that outputs will avoid infringement conflicts. The
              Copyright Office's 2025 reports reinforce two points investors cannot wave away. First, U.S. copyright law
              still centers human authorship, and the Office explicitly discusses image-generation systems such as
              Midjourney when explaining why many purely AI-generated outputs do not automatically qualify for copyright
              protection. Second, the Office's training report says the use of copyrighted works in generative-AI
              development is a live legal and policy dispute, including concerns about unlicensed ingestion and
              near-exact outputs. BGR's review adds a practical product angle: highly realistic outputs and weak visible
              labeling increase the chance of backlash, harmful use, or platform-policy conflict even before a courtroom
              test arrives.
