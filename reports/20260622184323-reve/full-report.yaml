  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct generators, bundles, aggregators, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The right competitor set for Reve is wider than “other text-to-image startups.” Direct model vendors
              include OpenAI, Google Imagen, Black Forest Labs, Recraft, Midjourney, and Stability AI. Adjacent
              creative-tool bundles include Canva and Runway, both of which can win not because they are the single best
              image model but because they fold image generation into a broader workflow. Enterprise trust substitutes
              include Getty and Shutterstock, which sell around legal comfort and model aggregation. Adobe Firefly is
              especially important because it blends both bundle and platform roles: it is a destination product, a
              workflow surface, and a distributor of partner models. Developer substitutes add yet another layer. Buyers
              can access similar underlying model families through OpenAI and Google APIs, through FLUX channels at BFL,
              fal.ai, Replicate, and Hugging Face, or through aggregators such as Shutterstock. This means Reve is
              competing simultaneously on workflow, trust, and distribution—not just on model quality.
            claimRefs:
