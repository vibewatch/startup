    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              Reve's risk stack is led by policy-sensitive product power plus thin public operating disclosure. The
              company markets a new image model that says it moved to 3x more parameters, more compute, and native
              4K-by-4K generation, while BGR says the outputs can look real enough to be mistaken for authentic
              photography and are not clearly labeled as AI except through metadata. That combination raises the
              probability that product quality itself becomes a policy and trust risk: higher-fidelity output can
              improve adoption, but it also increases misuse exposure, content-authenticity concerns, and scrutiny of
              safeguards. The public materials we reviewed do show baseline legal and privacy documentation, an API
              beta, and a support center, but they do not show a mature public trust portal, named customer base,
              incident archive, or transparent economic model. For an investor, the correct default is therefore not
              “hidden strength” but “high residual uncertainty until diligence closes the gaps.”
