  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitute categories
        blocks:
          - type: paragraph
            body: >-
              Reve should not be analyzed as a claim on the entire generative-AI economy. Its homepage and help surfaces
              point to a more specific commercial job: generating and iterating on images with higher prompt fidelity,
              typography, and editing control. Included spend therefore covers self-serve subscriptions for creators,
              paid image generations inside design suites, licensed commercial image-generation products, and
              developer/API spend for image workflows. It also includes adjacent revenue that matters to the same buyer
              decision, such as bundled design or content-production software where AI image creation is one feature
              among many. Excluded spend includes general-purpose LLM subscriptions with no image workflow relevance,
              pure video-only products unless they are sold through the same plan or budget, generic cloud compute, and
              legacy creative software spend that does not compete for the same workflow. The strongest substitute set
              is not just other image models: it also includes design suites like Canva and Adobe, licensed-stock
              incumbents like Getty and Shutterstock, and any API or platform layer that lets the buyer generate, edit,
              and commercialize images without committing to a single model vendor.
            claimRefs:
              - CM001
              - CM002
              - CM003
