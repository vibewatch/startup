  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and the proof gap
        blocks:
          - type: paragraph
            body: >-
              The headline financing context is real enough to matter but still not strong enough to close valuation
              diligence by itself. Forge's public company page for Reve shows a roughly $1.84 billion Series B
              valuation, $390 million of funding to date, and a $350 million funding event dated June 23, 2025. That
              gives investors a plausible reference point for where private capital has recently marked the company. But
              public confidence should stop there. The same visible page also says market activity is limited and no
              direct private share price is available on the surface we fetched. The official Reve pages we reviewed do
              not supply the missing bridge: they do not disclose revenue, margin, customer count, retention, or a clear
              enterprise monetization profile, and even the public pricing page remains opaque in the fetch path we
              used. A valuation supported mainly by secondary-platform context, rather than by company economics,
              deserves a guarded rather than enthusiastic stance.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
