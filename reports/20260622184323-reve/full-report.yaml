chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Reve's official materials consistently present the company as a creative-tooling startup rather than as a
              pure model lab. The about page names Reve AI, Inc. and places the company in Palo Alto, while the homepage
              and privacy policy frame the service around image generation, image editing, discovery, curation, and an
              editor-led workflow. The help center and subscription documentation show a consumer-to-prosumer
              commercialization path built around Free, Lite, and Pro plans, with a separate beta API surface rather
              than a fully open platform ecosystem. That positioning matters because it implies the company is trying to
              monetize workflow quality and controllability, not just raw model access. The evidence is also clear that
              Reve wants users to think of the product as collaborative creative software: public copy emphasizes
              planning, layout, and direct manipulation more than prompt-only image synthesis. What remains opaque is
              company scale. None of the reviewed official pages disclose headcount, customer count, office count beyond
              Palo Alto contact details, or formal board composition.
