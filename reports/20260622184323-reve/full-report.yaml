  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and pricing surface: public list prices exist, but realized economics do not'
        blocks:
          - type: paragraph
            body: >-
              Reve now shows enough public surface area to confirm that it is more than a research demo, but not enough
              to close an underwriting case. Official pages confirm a consumer web product, a plans-and-billing support
              flow, payment processing, and a beta API console. Independent reviews then fill in the visible price card:
              BGR captured the March 2025 launch economics at 20 free images per day, 100 starter credits, and 500
              credits for $5, while ToolWorthy reports current Lite and Pro tiers at $7.99 and $19.99 per month plus
              separate API credits. LLM Stats adds a public API proxy of $0.18 per generated image.


              That combination is useful because it shows several monetization surfaces at once: free acquisition,
              recurring subscription plans, top-up usage, and developer/API spend. It is also insufficient because none
              of the public sources exposes paid-user count, realized ARPU, plan mix, effective discounting, or API
              customer concentration. In other words, the list prices are legible, but the actual revenue engine is
              still mostly private.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI007
              - CI008
              - CI009
