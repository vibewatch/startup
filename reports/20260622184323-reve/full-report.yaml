      - number: '8.5'
        title: Scenario ranges, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The scenario work should stay deliberately broad because false precision is the main error to avoid. If
              Reve eventually proves software-like recurring revenue at scale, a differentiated enterprise channel, and
              strong contribution margins despite heavy compute, then the current private mark could be defensible or
              even conservative. But if the business remains creator-led, policy-sensitive, or infrastructure-cost
              heavy, the present valuation could compress quickly as the category normalizes. The most important
              diligence asks are therefore not cosmetic: investors need revenue quality, customer concentration, cohort
              behavior, cap-table terms, and safety operations detail. The thesis should break if private diligence
              shows that customers are narrow, costs remain structurally high, or the policy burden rises faster than
              monetization. Put differently, the current financing reference is something to diligence against, not
              something to trust blindly.
