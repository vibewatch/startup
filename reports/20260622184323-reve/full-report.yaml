      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The relevant buyer map is more granular than “consumers versus enterprise.” Individual creators and
              prosumers are the easiest segment to see because Reve exposes Free, Lite, and Pro plans and peers like
              Canva also position image generation inside self-serve creative plans. Marketing and design teams are a
              second segment because Canva and Adobe frame AI image generation as part of everyday content-production
              workflows, not a niche experiment. Brand-sensitive enterprise teams are a third segment: Getty’s product
              is sold around licensing, indemnification, and safe commercial use, which signals a legal-review motion
              quite different from a hobbyist or social-content purchase. Developers and agent builders form a fourth
              segment because Reve, OpenAI, and Google all expose APIs or developer docs that let image generation
              become a feature inside another product. This segmentation matters because the budget owner changes by
              row: personal subscriptions, design-software budgets, campaign or content budgets, legal-reviewed brand
              budgets, and product engineering budgets all adopt at different speeds and underwrite different price
              points.
