companyProfile:
  summary: >-
    Reve is a Palo Alto-based private AI creative-tooling startup focused on controllable text-to-image generation and iterative image editing. Its public product narrative centers on Reve 2.0, which separates planning from rendering, generates native 4K images, and aims to make layout, typography, and editing more steerable than prompt-only peers. The founding bench combines Adobe and frontier image-model pedigree, but public company disclosure remains sparse on financing details, revenue quality, customer concentration, and operating scale.
