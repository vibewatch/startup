  topStrengths:
    - 产品叙事清晰：先规划再生成图像、迭代编辑更稳定，并支持原生 4K 输出。
    - 对一家年轻创业公司，创始团队在 Adobe 和图像生成研究上的可信度异常强。
    - 变现入口不是假设，已能看到付费套餐和 beta API 路径。
    - 类别需求大且变化快，尤其是创作者需要更好的文字处理和可控性时。
  topRisks:
    - 公开证据仍未披露收入质量、利润率、留存或客户集中度。
    - 可见私募市场估值语境走在外部公开证据目前可承销范围之前。
    - 高保真图像生成会带来版权、溯源、滥用和政策合规风险。
    - 原生 4K 生成和第三方 AI 依赖意味着算力与资本强度风险不低。
    - OpenAI、Adobe、Google、Midjourney、FLUX 及其他图像平台的竞争压力会封住定价权。
  unresolvedGaps:
    - 可见的 $350 million 融资和约 $1.84 billion 估值参考，仍缺少完整独立佐证。
    - 收入、毛利率、烧钱速度、现金跑道或付费客户队列表现没有公开披露。
    - 企业 / API 组合、客户集中度或合同耐久性没有清晰公开视图。
    - 安全控制、溯源工具和训练数据治理方面的公开证据仍偏薄。
