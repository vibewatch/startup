figures:
- id: FM001
  title: Market sizing lens — from broad generative AI to Reve's serviceable wedge
  type: pyramid
  layout: standard
  summary: The evidence supports using broad generative-AI estimates only as a ceiling; Reve competes in a narrower layer where image-generation quality, typography, editability, and trust matter.
  data:
    items:
    - label: Broad generative AI market
      value: USD 22.2B to USD 103.6B in 2025
      detail: Range spanned by Grand View, Global Market Insights, and Fortune for broad generative-AI categories.
      tone: neutral
    - label: Creative and multimodal tooling subset
      value: Image, video, and design workflows
      detail: Research and Markets plus Canva and Adobe show that image generation is increasingly bundled with design, video, and content-production workflows.
      tone: neutral
    - label: Enterprise-trust wedge
      value: Licensed, governable, commercially safe output
      detail: Getty and Adobe highlight the buyer segment where licensing, provenance, and legal-risk mitigation drive purchasing.
      tone: warning
    - label: Reve reachable wedge
      value: Planning-first image generation for creators, design teams, and developers
      detail: Reve's public positioning emphasizes prompt fidelity, typography, editable planning, and self-serve pricing rather than the whole generative-AI stack.
      tone: positive
  approximationNotes: Only the broadest layer has direct market-size figures. Lower layers are evidence-backed qualitative slices rather than reported numeric TAMs.
