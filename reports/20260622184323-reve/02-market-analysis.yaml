chapter:
  number: 2
  title: Market Analysis
  summary: Reve sits in AI text-to-image plus adjacent creative tooling rather than the whole generative-AI stack. Broad market publishers place 2025 generative-AI spend anywhere from USD 22.2 billion to USD 103.6 billion because they include different mixes of text, code, image, video, and enterprise software, so those figures are ceiling references rather than a direct TAM for Reve. The more decision-useful lens is a narrower wedge where creators, design teams, developers, and brand-sensitive enterprise buyers value prompt adherence, typography, editing control, and commercial-safety assurances—but that wedge still faces low switching costs, multi-homing, and copyright/compliance friction.
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitute categories
  body: 'Reve should not be analyzed as a claim on the entire generative-AI economy. Its homepage and help surfaces point to a more specific commercial job: generating and iterating on images with higher prompt fidelity, typography, and editing control. Included spend therefore covers self-serve subscriptions for creators, paid image generations inside design suites, licensed commercial image-generation products, and developer/API spend for image workflows. It also includes adjacent revenue that matters to the same buyer decision, such as bundled design or content-production software where AI image creation is one feature among many. Excluded spend includes general-purpose LLM subscriptions with no image workflow relevance, pure video-only products unless they are sold through the same plan or budget, generic cloud compute, and legacy creative software spend that does not compete for the same workflow. The strongest substitute set is not just other image models: it also includes design suites
    like Canva and Adobe, licensed-stock incumbents like Getty and Shutterstock, and any API or platform layer that lets the buyer generate, edit, and commercialize images without committing to a single model vendor.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM010
  - CM023
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses
  title: 'Sizing lenses: broad generative-AI market versus Reve-relevant wedge'
  body: 'Public market estimates are useful only after separating broad category headlines from Reve’s actual serviceable wedge. Grand View, Global Market Insights, and Fortune Business Insights all show large and fast-growing generative-AI markets, but their 2025 estimates span from USD 22.21 billion to USD 103.58 billion because they are not measuring the same thing. Research and Markets explicitly includes image and video synthesis plus AI creative-design platforms, which helps explain why broad category numbers can support the thesis that budget pools are expanding without proving a precise image-only TAM. Adobe’s more than USD 24 billion of trailing-twelve-month revenue is also a reminder that adjacent creative-software spend is already substantial, but that too is an installed-spend proxy, not a direct market size for Reve. The practical conclusion is that broad generative-AI estimates are best treated as an upper-bound context layer. Reve’s investable question sits lower in the stack:
    how much of creative-production, marketing, ecommerce, and developer spend migrates to planning-first image generation where typography, controllability, and commercial-safety matter.'
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM022
  - CM042
  tableRefs:
  - TM002
  figureRefs:
