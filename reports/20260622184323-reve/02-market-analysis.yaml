- id: buyer-segmentation
  title: Buyer, user, and payer segmentation
  body: 'The relevant buyer map is more granular than “consumers versus enterprise.” Individual creators and prosumers are the easiest segment to see because Reve exposes Free, Lite, and Pro plans and peers like Canva also position image generation inside self-serve creative plans. Marketing and design teams are a second segment because Canva and Adobe frame AI image generation as part of everyday content-production workflows, not a niche experiment. Brand-sensitive enterprise teams are a third segment: Getty’s product is sold around licensing, indemnification, and safe commercial use, which signals a legal-review motion quite different from a hobbyist or social-content purchase. Developers and agent builders form a fourth segment because Reve, OpenAI, and Google all expose APIs or developer docs that let image generation become a feature inside another product. This segmentation matters because the budget owner changes by row: personal subscriptions, design-software budgets, campaign or
    content budgets, legal-reviewed brand budgets, and product engineering budgets all adopt at different speeds and underwrite different price points.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM024
  - CM025
  - CM026
  - CM027
  - CM028
  tableRefs:
  - TM003
  figureRefs:
  - FM003
- id: growth-drivers-and-constraints
  title: Growth drivers, adoption constraints, and valuation relevance
  body: 'The growth case is real but not frictionless. Major market publishers repeatedly point to enterprise productivity gains, workflow automation, and demand for digital content as the macro drivers behind generative-AI adoption; for Reve specifically, the most relevant micro driver is not generic “AI demand” but whether planning-first editing meaningfully improves high-frequency creative work such as ad concepts, social assets, product imagery, and typography-heavy design. Multimodal suites also lower adoption friction because buyers increasingly expect image generation to sit inside broader design, video, and collaboration workflows. The constraint side is equally important. The U.S. Copyright Office says copyright protection requires human authorship and that prompts alone are insufficient under current technology, while its training report treats consent, compensation, and fair-use treatment as live issues. The EU AI Act adds transparency and labeling obligations for certain generative
    outputs in 2026. Finally, low self-serve price points and many near-substitutes make multi-homing easy, so valuation should not assume consumer lock-in just because the category is growing quickly. The clearest premium segment is enterprise trust: products like Getty and Adobe show that licensing, provenance, and legal comfort can matter as much as raw model quality.'
