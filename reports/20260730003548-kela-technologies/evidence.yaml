evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: Board composition, liquidation preferences, ownership percentages, and investor control rights.
    whyItMatters: These terms determine whether the headline valuation is economically meaningful for new investors.
    diligencePath: Request cap table, financing documents, and current board materials.
    relatedQuestionRefs:
      - QO015
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue, backlog conversion, gross margin, and services versus software mix.
    whyItMatters: Reported revenue and contract numbers are promising but too incomplete to benchmark economics cleanly.
    diligencePath: Request monthly KPI pack, audited statements, and revenue-recognition policy.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance-depth
    missingEvidence: Public board roster and executive bench beneath the founders.
    whyItMatters: The founders are visible, but scale durability depends on broader institutional depth.
    diligencePath: Request org chart, board list, and functional leadership biographies.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: kela-sam
    missingEvidence: >-
      A public breakdown of how much of Israeli, U.S., and allied modernization spend is truly contestable by a company
      like Kela.
    whyItMatters: Without it, market size can easily be overstated by borrowing too much from broad defense budgets.
    diligencePath: Request internal pipeline segmentation by buyer, program type, and geography.
    relatedQuestionRefs:
      - QM005
      - QM015
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pipeline-conversion
    missingEvidence: Pilot-to-program conversion rates and average procurement cycle length for Kela-specific deals.
    whyItMatters: This determines how quickly battlefield proof turns into economically meaningful revenue.
    diligencePath: Request CRM funnel by stage, program, and geography.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: segment-shares
    missingEvidence: A clean public estimate for the software share of Israeli defense exports or spend.
    whyItMatters: The public record is rich on broad budgets but thin on software-specific breakdowns.
    diligencePath: Triangulate public-company segment disclosures and procurement data in private diligence.
    relatedQuestionRefs:
      - QM025
      - QM020
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Public win/loss evidence against Elbit, Palantir, Shield AI, or Anduril-like alternatives.
    whyItMatters: Without real head-to-head outcomes, openness and speed remain hypotheses rather than measured advantages.
    diligencePath: Request competitive pipeline notes and closed-lost reasons.
    relatedQuestionRefs:
      - QP005
      - QP015
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-power
    missingEvidence: Actual pricing, renewal, and expansion behavior by customer type.
    whyItMatters: >-
      Moat durability in defense software is easier to prove through retention and pricing power than through
      architecture slides.
    diligencePath: Request price realization, renewals, and product attach rates.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: international-competitiveness
    missingEvidence: Comparable public evidence on Kela's success outside the Israeli wartime context.
    whyItMatters: Exportability is a core part of the moat thesis.
    diligencePath: Request U.S. and NATO pipeline, pilot, and partner conversion data.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: distribution-friction
