  topStrengths:
    - Kela 的创始团队与市场高度匹配，背景覆盖以色列防务研发、Palantir Israel、Rafael 和任务运营。
    - 公开报道显示，以色列防务体系已有机构级采用，包括 IDF、国防部语境和数十个部署点。
    - 产品逻辑押注开放架构的指挥控制集成，而不是单一传感器或机体，差异化更清楚。
    - Sequoia、Lux、In-Q-Tel 以及后续成长型投资人背书，让 Kela 拿到同阶段初创公司少见的资本和信号。
  topRisks:
    - 客户集中度似乎明显偏向以色列防务机构，公开证据还不足以证明盟国生产账户已经多元化。
    - 即便产品需求真实，出口管制、加密规则和采购摩擦也可能拖慢美国及盟国客户转化。
    - 相比目前披露的收入，报道中的 $1.2B 估值偏高，给执行失误留下的余地不多。
    - 毛利结构、续约行为、治理权利，以及软件杠杆和重服务交付之间的比例，公开披露仍然很薄。
  unresolvedGaps:
    - 最新一轮的准确投后融资条款、稀释、优先权和治理权利尚未披露。
    - 公开来源没有给出按收入划分的客户集中度、续约指标或清晰的活跃账户数量。
    - 毛利率、烧钱速度、现金 runway，以及软件订阅经济性和集成服务之间的平衡仍不透明。
    - 可靠性、事故和 uptime 披露不够公开，难以清楚承保任务关键平台的稳健性。
