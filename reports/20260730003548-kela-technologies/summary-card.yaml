  topStrengths:
    - >-
      Kela has unusually strong founder-market fit across Israeli defense R&D, Palantir Israel, Rafael, and mission
      operations.
    - >-
      Public reporting supports real institutional adoption in the Israeli defense ecosystem, including IDF and Ministry
      of Defense context plus dozens of deployment points.
    - >-
      The product thesis is differentiated around open-architecture command-and-control integration rather than a single
      sensor or airframe.
    - >-
      Investor support from Sequoia, Lux, In-Q-Tel, and later growth investors gives Kela capital and signaling few
      startups of this age possess.
  topRisks:
    - >-
      Customer concentration appears heavily skewed toward Israeli defense institutions, with limited public proof of
      diversified allied production accounts.
    - >-
      Export controls, encryption rules, and procurement friction could slow U.S. and allied conversion even if product
      demand is real.
    - >-
      The reported $1.2B valuation is rich relative to currently disclosed revenue and leaves limited room for execution
      slips.
    - >-
      Public disclosure remains thin on margin profile, renewal behavior, governance rights, and the mix between
      software leverage and services-heavy delivery.
  unresolvedGaps:
    - >-
      Exact post-money financing terms, dilution, preferences, and governance rights from the latest round are
      undisclosed.
    - Public sources do not provide customer concentration by revenue, renewal metrics, or clear active-account counts.
    - >-
      Gross margin, burn, cash runway, and the balance between software subscription economics and integration services
      remain opaque.
    - >-
      Reliability, incident, and uptime disclosures are not public enough to cleanly underwrite mission-critical
      platform robustness.
