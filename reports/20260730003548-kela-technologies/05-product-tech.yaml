  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Kela's product is best understood as an open command-layer integration platform that links sensors, drones, intelligence feeds, and effectors inside one battlefield workflow. Public evidence supports a real architecture thesis—open interfaces, partner modules, forward deployment, and expansion into munitions and sovereign communications—but it does not yet prove mature reliability or software-only economics at scale. The technology case is therefore credible and strategically interesting, but still execution dependent."
  },
  "sections": [
    {
      "id": "workflow-definition",
      "title": "Product definition in battlefield workflow terms",
      "body": "Kela is not best described as a drone company, a satellite company, or a stand-alone analytics vendor. The most consistent public description is an open-architecture command-and-control layer that helps military operators combine many systems inside one workflow. Official copy, launch reporting, Sequoia’s investor write-up, and later Globes coverage all point to the same operating idea: commercial and military sensors, AI models, edge devices, drones, radars, intelligence systems, and effectors should be stitched together faster than traditional prime-led redesign cycles usually allow. That framing matters because it defines the product in customer workflow terms rather than as a static feature list. Kela is selling time-to-integration, operator usability, and mission adaptability. The visible product surface already includes core integration software, partner modules, Starling UAV integration, and forward-deployed implementation. Investors should therefore read Kela as a workflow platform with multiple attach points, not as a single mission app. The company’s core promise is that operators should not have to wait for a full prime-contractor redesign before mixed fleets and new software tools can work together. That is a meaningful claim because battlefield speed is often worth more than feature perfection in isolation during urgent deployments in practice.",
