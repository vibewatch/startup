    {
      "id": "roadmap-differentiation-and-controls",
      "title": "Roadmap breadth, differentiation, and trust controls",
      "body": "Kela’s roadmap is broader than its current public proof, which is both a source of optionality and a source of risk. The space whitepaper and performance timeline show explicit ambition around sovereign LEO communications, hybrid GEO-to-LEO terminals, narrowband command links, and PNT resilience. Starling expands the stack into autonomous UAV workflows, while recruiting for tactical munitions suggests management is willing to extend toward physical systems that attach to the control layer. Differentiation therefore rests on openness, sovereign fit, and orchestration across many asset classes rather than on one closed subsystem. That can be strategically attractive in a fragmented defense environment, but it raises the bar for trust, safety, export discipline, and field reliability. Public evidence is still thin on uptime metrics or formal reliability disclosures, so the trust case rests more on battlefield relevance and disciplined positioning than on published benchmark data. Investors should view the product as technically credible, commercially ambitious, and still early in formal proof of robustness. The upside is real, but the route to durable advantage runs through disciplined execution rather than through narrative breadth alone. The more adjacent branches Kela adds, the more important standardized interfaces and quality controls become across the full platform over time everywhere.",
