  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Kela's risk profile is concentrated in three places: exportability and regulation, dependence on a narrow early customer base, and execution depth as the product expands across more operational branches. None of those risks automatically break the thesis, but all three can materially affect whether wartime traction becomes a durable cross-market defense platform. The company therefore looks promising but high-accountability: upside depends on disciplined scaling, not just on technical relevance."
  },
  "sections": [
    {
      "id": "regulatory-and-geopolitical",
      "title": "Regulatory, legal, and geopolitical risk",
      "body": "Kela sits in a category where regulation is part of the product, not a back-office function. DECA, the Ministry of Defense, Wassenaar, and the 2026 encryption-control update all point to the same risk: software, integrated systems, and foreign deployments can be slowed or reshaped by licensing and classification decisions. For a company that wants to translate Israeli battlefield proof into allied programs, export readiness is therefore a strategic dependency. The same fact pattern also creates geopolitical sensitivity. A heavy concentration in Israeli defense institutions gives Kela valuable proof, but it also ties near-term outcomes to one national-security environment and to the pace at which that proof can be translated abroad. Investors should treat exportability, regulatory packaging, and geography concentration as intertwined rather than separate risks. The practical result is that regulatory readiness, documentation quality, and product classification can influence sales timing almost as much as product performance. A company can be technically impressive and still lose momentum if approvals, legal interpretations, or customer export constraints move more slowly than the product roadmap. That makes legal execution quality a strategic variable rather than a support function inside the business today.",
