    {
      "id": "technical-operational-and-partner",
      "title": "Technical, operational, and partner-execution risk",
      "body": "Kela’s technical thesis depends on open-architecture integration, and that is both its advantage and one of its core risks. Integrating many systems raises testing burden, interface fragility, and mission-assurance demands. Public proof on uptime, failure rates, and incident history is still thin, so outside investors cannot independently verify how robust the platform is under sustained live use. Operationally, the visible roles in forward deployment, tactical munitions, and supply chain show that execution already extends beyond pure software. That broadens the surface area for delays, hardware dependence, and field-support intensity. Partner dependence adds another layer. The Starling deal is strategically valuable, but it also demonstrates that Kela’s outcomes can be affected by third-party module quality and integration performance. In short, the company’s product ambition is credible, yet the operational burden rises quickly as more workflows and hardware-linked branches attach to the platform. As a result, technical elegance alone is not enough; the company also needs repeatable field processes, partner governance, and disciplined scope control. Without those controls, the same openness that creates differentiation can turn into unstable delivery economics or hard-to-debug failure chains. This is exactly the sort of risk that may appear late, after early traction looks compelling and expectations have risen materially for now.",
      "claimRefs": [
        "CR005",
        "CR006",
        "CR007",
        "CR008",
        "CR014",
