    {
      "id": "disclosure-gaps-and-benchmarking",
      "title": "Disclosure gaps versus public comparables",
      "body": "The easiest way to understand Kela's remaining financial opacity is to compare it with what public comparables disclose. Palantir files audited revenue, segment performance, cash flow, and margin metrics. Elbit discloses revenue scale and public-valuation markers. Kela discloses none of those things in the public domain. The missing list is long: ARR, gross margin, cash, burn, DSO, cohort retention, software-versus-services mix, backlog aging, and financing terms. That does not mean the economics are weak, only that outside investors cannot verify them yet. The main financial judgment is therefore not that Kela lacks traction, but that the public evidence is still too thin to determine whether the company deserves software-like economics, integrator-like economics, or some hybrid multiple between them. Later valuation work should treat that uncertainty as a core input rather than as noise. For now, the absence of disclosure is itself a financial fact because it widens the plausible valuation range and raises the diligence burden on any new investor. It also means headline round size can distort perception if private metrics are materially better or worse than the public record implies at underwriting time. Disclosure quality remains a core diligence constraint. The practical conclusion is that Kela already looks commercially real, but its public evidence still supports only a directional model rather than a fully underwritten financial one. Investors should separate proof of demand from proof of durable economics until private data closes the gap.",
