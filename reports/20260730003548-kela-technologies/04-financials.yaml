    {
      "id": "capital-intensity-and-adequacy",
      "title": "Capital intensity, capital uses, and adequacy",
      "body": "Kela's financing path is extremely fast even by defense-tech standards, and the stated use of proceeds is clearly aggressive growth rather than quiet balance-sheet padding. Capital has funded engineering expansion, deployment acceleration, a factory, M&A, and the build-out of operational capabilities that touch hardware, logistics, and partner integrations. Those are all strategically sensible uses for a company trying to become a defense-platform integrator, but they are not the hallmarks of a low-capex software story. The 2026 round likely gives Kela strong near-term adequacy and allows it to bid, hire, and expand with confidence. It does not, however, settle questions about capital efficiency. The more Kela leans into factories, hardware-linked support, and sovereign-market readiness, the more important it becomes to see burn, working-capital dynamics, and return on deployed capital rather than only the headline size of the financing. In other words, fresh capital reduces immediate financing risk while making execution discipline more important, not less. The same growth investments that strengthen strategic position can also lengthen payback periods if contract conversion or export expansion trails hiring and build-out. Investors should therefore read the balance sheet story as one of option creation, not as proof that the underlying delivery model is already optimized. The practical conclusion is that Kela already looks commercially real, but its public evidence still supports only a directional model rather than a fully underwritten financial one. Investors should separate proof of demand from proof of durable economics until private data closes the gap.",
