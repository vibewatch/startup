  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Kela has credible evidence of real adoption inside Israel's defense establishment, including field projects, a growing deployment footprint, and a Starling workflow explicitly tied to the IDF and Ministry of Defense. What it does not yet disclose publicly is diversified account depth, renewal quality, or enough geography-level detail to prove durable multi-market customer strength. The customer case is therefore real but concentrated: strong enough to validate relevance, still too opaque to eliminate concentration and retention risk."
  },
  "sections": [
    {
      "id": "customer-base-and-named-proof",
      "title": "Customer base segmentation and named proof",
      "body": "Kela’s customer story is strongest when framed as an institutional defense-buyer story rather than as a conventional enterprise-software sales motion. Launch reporting already placed the company inside the Israeli defense establishment, and later reporting sharpened that into the IDF and Ministry of Defense orbit. The Starling agreement is especially useful because it gives one concrete institutional end-customer context for an important workflow: exclusive rights to sell, integrate, and deploy Pathfinder X for the IDF and Israeli Ministry of Defense. That is not the same as a broad disclosed customer list, but it is materially stronger than vague national-security interest. The same evidence also shows concentration. Public sources still do not enumerate agencies, units, program counts, or named contract cohorts. Investors should therefore read the current customer base as real, referenceable, and still heavily anchored in one sovereign ecosystem where operational proof is meaningful but public breadth is limited. In practical terms, Kela appears to be selling into systems where sponsor credibility, operator urgency, and ministry-level approval all matter at once. That combination can create very valuable customer relationships, but it rarely produces the kind of broad, easy-to-count account base seen in enterprise SaaS. It also means a handful of institutional champions can matter disproportionately over time.",
      "claimRefs": [
        "CU001",
