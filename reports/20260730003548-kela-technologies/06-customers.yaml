      ]
    },
    {
      "id": "durability-expansion-and-concentration",
      "title": "Durability, expansion path, and concentration risk",
      "body": "The main customer unknown is not whether Kela has buyers; it is whether today’s buyers will mature into a diversified, durable customer base across allied programs. There is no public renewal rate, churn, NRR, GRR, or average contract duration. Revenue and contract signals are large enough relative to company size that a small number of institutional programs may dominate outcomes. Expansion beyond Israel appears plausible, yet procurement pathways, export controls, and buyer politics are likely to slow conversion. Trade.gov, DECA, Wassenaar, and broader policy sources all point to the same conclusion: the next stage of customer growth is gated by compliance, channel access, and reference conversion, not only by product demand. The upside is real, but concentration and opacity remain central underwriting issues until named geography, account, and renewal data improve materially. For investors, that means customer quality should be judged less by headline revenue alone and more by whether Kela can show repeatable conversion from urgent domestic wins into stable allied programs with longer-lived budgets and clearer renewal behavior. Until then, even strong tactical adoption can coexist with meaningful commercial fragility and significant forecasting uncertainty for investors.",
