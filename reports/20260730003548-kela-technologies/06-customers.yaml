    {
      "id": "adoption-trajectory-and-delivery-model",
      "title": "Adoption trajectory, deployment footprint, and delivery model",
      "body": "The adoption story is visible enough to matter, but not detailed enough to remove ambiguity. Sequoia said Kela had multiple active projects in the field within months of starting development, and Globes later reported growth to dozens of deployment points. Those signals strongly suggest the company is operating beyond pure concept stage. At the same time, they do not show program size, customer count, or active-versus-dormant split. Hiring helps fill part of that gap. The forward-deployed engineer role implies that customer onboarding is operationally hands-on, while broader recruiting suggests ongoing deployment and support work. This is important because adoption quality depends not only on how many sites exist, but also on how much human effort is required to land, support, and expand each account. Kela may already have strong mission intimacy while still relying on a delivery model that remains heavier than ordinary software distribution. That distinction is crucial for underwriting because a company can look deeply embedded with customers while still scaling in a project-like pattern. The public record today supports operational relevance more clearly than it supports low-touch repeatability. It also suggests that account expansion may be earned through additional workflows and trust-building rather than through simple license upsell mechanics over time right now.",
      "claimRefs": [
        "CU004",
        "CU006",
        "CU010",
        "CU011",
        "CU031",
        "CU032"
      ],
      "tableRefs": [
