    {
      "id": "scale-milestones-and-open-questions",
      "title": "Scale signals, product extensions, and open diligence questions",
      "body": "Kela already shows stronger public scale signals than most Israeli defense startups at the same age, but those signals are still uneven. Independent outlets reported about $20 million of 2025 revenue, contracts above $50 million, roughly 150 employees, a southern Israel factory, and deployments that grew from a few sites to dozens. The Starling partnership, Pelanor acquisition, and the company's own space whitepaper all suggest a strategy of becoming the orchestration layer around a widening defense ecosystem rather than a single-product vendor. Recruiting evidence supports that read: Kela is hiring across forward deployment, supply chain, tactical munitions, and mission operations, which implies software plus hardware integration plus customer support. At the same time, the unresolved questions are material. The public record still does not show customer concentration by dollars, gross margin, renewal behavior, program-level economics, or governance structure. The company has clear strategic momentum, but the leap from a fast Israeli wartime integrator to a durable Western defense prime remains an investment thesis rather than a completed fact pattern. That is the central judgment for later chapters: Kela looks important enough to warrant full diligence, but still too young and too opaque to treat its current profile as settled. This matters because Kela is still young enough that each disclosed milestone acts as both operating evidence and identity proof. The company clearly has strategic momentum, but the public record still bundles battlefield urgency, investor enthusiasm, and early traction together more tightly than a mature diligence process would prefer.",
