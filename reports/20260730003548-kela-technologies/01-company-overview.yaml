      "id": "funding-and-stakeholders",
      "title": "Funding path and stakeholder map",
      "body": "The financing trajectory is extraordinary for a company founded in mid-2024. Public reporting shows a stealth launch with $39 million, then a first-year total of $100 million, then a May 2026 round of roughly $200 million at about a $1.2 billion valuation, and finally June 2026 descriptions of roughly $300 million raised overall. That pace tells two stories. First, investors clearly believe Kela occupies a strategic layer of defense modernization rather than a one-off subsystem category. Second, the company is being priced on expected market expansion and battlefield relevance much more than on disclosed economics. The investor roster is similarly notable: Sequoia and Lux anchored the early story, In-Q-Tel added national-security signaling, and the later syndicate brought growth capital from Stripes, D1, Bill Ackman, and Eric Schmidt. What is still missing is as important as what is visible. Public sources do not disclose board rights, liquidation preferences, dilution from the Pelanor acquisition, or the exact bridge between the earlier reported $100 million total and the later $300 million figure. This matters because Kela is still young enough that each disclosed milestone acts as both operating evidence and identity proof. The company clearly has strategic momentum, but the public record still bundles battlefield urgency, investor enthusiasm, and early traction together more tightly than a mature diligence process would prefer.",
