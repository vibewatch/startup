    {
      "id": "buyers-and-adoption",
      "title": "Buyer map, budget ownership, and adoption path",
      "body": "The buyer map is unusually specific. Kela's first customer set is not generic global enterprise; it is ministries of defense, military units, and allied security organizations with urgent integration needs. Sequoia framed the first wedge as border protection, while later reporting tied the company more directly to IDF and Ministry of Defense workflows. Trade.gov helps explain why these buyers behave differently from enterprise IT customers: a meaningful share of spend flows through FMF, DCC, local representative requirements, and other procurement pathways that reward credibility, local access, and long time horizons. Adoption is therefore driven by mission urgency and systems fragmentation more than by neat bottom-up software expansion. The same public sources also show why Kela is trying to climb from local execution toward U.S. and NATO demand: the buyer set values battlefield validation, fast iteration, and the ability to combine commercial and military modules without waiting for a full prime-contractor redesign. That means proof of operational relevance is necessary but not sufficient; Kela still has to survive procurement process, doctrine fit, export approval, and channel politics before a promising pilot becomes a durable budget line. It also means a small number of institutional sponsors can disproportionately shape commercial outcomes in the first few years. The underwriting point is that large defense budgets do not automatically become fast-converting software revenue. Kela still has to win sponsored programs, navigate export and interoperability rules, and prove that rapid integration changes procurement behavior rather than only producing pilot attention.",
