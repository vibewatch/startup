    {
      "id": "drivers-constraints-and-adjacencies",
      "title": "Growth drivers, adoption constraints, and adjacent pools",
      "body": "Three growth drivers stand out. First, conflict has accelerated demand for autonomous and data-intensive systems, which both CTech and VC Cafe describe directly. Second, investors increasingly believe Israeli defense startups can compete for allied contracts, not only domestic wartime budgets. Third, Kela's own roadmap is expanding the integration thesis into resilient communications and navigation, which could widen the platform's relevance from tactical control to sovereign infrastructure. The constraints are equally real. DECA makes export control compliance central, not optional. Trade.gov notes manpower shortages, component constraints, and long manufacturing and award cycles. EC Compliance adds that the 2026 encryption-control reform will force companies to classify products more carefully across civil and defense end-use regimes. These frictions do not kill the market, but they do mean that adoption is gated by procurement, export discipline, and sovereign-operating requirements in a way ordinary enterprise software investors can underestimate. In other words, the market can be large, urgent, and still slower to monetize than the surrounding excitement suggests. That tension is the core underwriting point: category demand appears real, but revenue timing will likely lag narrative momentum and budget conversion discipline for years. The underwriting point is that large defense budgets do not automatically become fast-converting software revenue. Kela still has to win sponsored programs, navigate export and interoperability rules, and prove that rapid integration changes procurement behavior rather than only producing pilot attention.",
