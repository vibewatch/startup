  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Kela's relevant market is not generic defense spending; it is the narrower but strategically important layer where militaries need open-architecture command-and-control, systems integration, autonomy orchestration, and increasingly resilient communications and navigation. Public evidence shows that the surrounding budget pools are large and growing, but adoption still depends on export law, procurement pathways, and operational proof rather than on ordinary enterprise-software dynamics. The result is a market with real scale potential and strong tailwinds, but one that demands disciplined bottom-up sizing and realistic assumptions about conversion speed."
  },
  "sections": [
    {
      "id": "boundary-and-sizing",
      "title": "Market boundary and evidence-constrained sizing",
      "body": "Kela is best understood as a defense integration and command-and-control platform company rather than as a drone maker, satellite company, or pure cyber tool vendor. The platform sits at the layer where mixed systems have to work together in real time: sensors, drones, intelligence feeds, radars, command interfaces, and increasingly communications and navigation resilience. That makes the relevant market boundary broader than any single hardware category but narrower than total defense spending. The most useful public sizing lenses therefore come from adjacent budget pools rather than from a single clean TAM number. Trade.gov reports roughly $31.5 billion of Israeli defense spending in 2024, $15 billion of defense exports, $39.2 billion of active FMS cases, and visible sub-sectors that include C4I, cyber/intelligence, satellites, radar/EW, and UAVs. Those numbers do not sum into Kela's serviceable market, but they do show that the company is operating inside budget pools large enough to support multiple billion-dollar outcomes if it can become a trusted orchestration layer. Just as importantly, this framing keeps later valuation work anchored to the narrow slice Kela may realistically win rather than to every dollar spent under a defense-modernization headline. It also avoids confusing adjacent procurement context with Kela's own plausible near-term revenue envelope and practical near-term deployment bandwidth. The underwriting point is that large defense budgets do not automatically become fast-converting software revenue. Kela still has to win sponsored programs, navigate export and interoperability rules, and prove that rapid integration changes procurement behavior rather than only producing pilot attention.",
