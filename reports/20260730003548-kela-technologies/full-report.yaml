      - number: '3.3'
        title: Moat durability and the remaining competitive gaps
        blocks:
          - type: paragraph
            body: >-
              The moat case for Kela is credible but not yet proven. If the company becomes the trusted command layer
              that lets buyers combine local and foreign systems faster than incumbents can, then it could own a
              strategic point of control across many subsystems. The sovereignty angle also matters: Kela can package
              battlefield credibility, trusted local integration, and communications-resilience optionality in a way
              that foreign peers cannot perfectly replicate. But the evidence gap is still material. Compared with
              Anduril, Shield AI, Palantir, Rafael, or Elbit, Kela has much thinner public customer proof, thinner
              pricing data, and thinner evidence on repeat wins outside the home market. It also lacks the broad
              installed program base incumbents can use to defend renewals and adjacent upsell. The company therefore
              looks more like an emerging contender than a demonstrated category winner. Investors should treat openness
              and speed as hypotheses with strong early support, not as fully proven moats. The clearest path to
              durability is not winning every subsystem battle, but becoming the default workflow layer that other
              systems must pass through. Until then, competitive risk remains structural rather than cosmetic for
              investors today globally everywhere. In defense procurement the strongest competitor is often the one with
              channel control, accreditation history, and sustainment confidence rather than the one with the neatest
              feature list. That raises the bar for Kela because openness must convert into program attachment, not just
              architectural appeal.
