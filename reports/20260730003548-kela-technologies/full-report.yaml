companyProfile:
  summary: >-
    Kela Technologies is a Tel Aviv defense-technology startup founded in July 2024 to build an open-architecture
    command-and-control layer that connects sensors, drones, radars, intelligence systems, and effectors inside one
    operator workflow. The company pairs founder credibility from Israeli defense R&D, Palantir Israel, Rafael, and IAF
    weapons engineering with unusually fast funding momentum, reported battlefield deployments, and a widening product
    scope spanning core C2 software, autonomous-UAV integrations, and hardware-adjacent execution. The core investment
    tension is that Kela appears strategically relevant and commercially real, yet public disclosure still lags its
    valuation on customer diversification, renewal quality, margins, and governance.
