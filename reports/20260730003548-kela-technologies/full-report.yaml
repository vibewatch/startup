  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in battlefield workflow terms
        blocks:
          - type: paragraph
            body: >-
              Kela is not best described as a drone company, a satellite company, or a stand-alone analytics vendor. The
              most consistent public description is an open-architecture command-and-control layer that helps military
              operators combine many systems inside one workflow. Official copy, launch reporting, Sequoia’s investor
              write-up, and later Globes coverage all point to the same operating idea: commercial and military sensors,
              AI models, edge devices, drones, radars, intelligence systems, and effectors should be stitched together
              faster than traditional prime-led redesign cycles usually allow. That framing matters because it defines
              the product in customer workflow terms rather than as a static feature list. Kela is selling
              time-to-integration, operator usability, and mission adaptability. The visible product surface already
              includes core integration software, partner modules, Starling UAV integration, and forward-deployed
              implementation. Investors should therefore read Kela as a workflow platform with multiple attach points,
              not as a single mission app. The company’s core promise is that operators should not have to wait for a
              full prime-contractor redesign before mixed fleets and new software tools can work together. That is a
              meaningful claim because battlefield speed is often worth more than feature perfection in isolation during
              urgent deployments in practice.
