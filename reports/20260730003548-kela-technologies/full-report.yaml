      - number: '8.2'
        title: Comparable set and scenario logic
        blocks:
          - type: paragraph
            body: >-
              The most useful public comparables are not perfect analogs, but they do bound the debate. Palantir is the
              strongest public command-layer software comparison, Elbit is the clearest mature sovereign-defense scale
              reference, and Anduril plus Shield AI are the most relevant private examples of investors paying up for
              strategic defense-technology narratives. None of those comps transfers cleanly to Kela. Palantir has
              audited disclosure and public-market scale; Elbit has large disclosed industrial revenue; Anduril and
              Shield AI still rely on private-market framing. Even so, they clarify the scenario logic. Kela’s bull case
              requires sticky platform economics and allied expansion. The bear case is that the company proves
              strategically relevant but economically closer to a project-heavy integrator. The base case sits in
              between: real traction, real optionality, and still incomplete underwriting. The public comp exercise is
              most useful when it narrows the plausible range and clarifies what Kela still must prove, not when it
              pretends a single market multiple can settle the question. In practice, the comps say more about the kinds
              of outcomes Kela might grow into than about the exact multiple it deserves today. They also show that
              disclosure quality is one of the biggest differences between a justified premium and a speculative one in
              this sector today.
            claimRefs:
              - CV006
