chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and founding team
        blocks:
          - type: paragraph
            body: >-
              Kela Technologies has moved from stealth to one of the most visible names in Israeli defense technology
              unusually quickly. The company's public identity is consistent across official, investor, and independent
              reporting: a secure, open platform for rapid integration of commercial and military systems, built first
              for Israeli battlefield requirements and then for broader Western defense markets. That framing matters
              because Kela is not presenting itself as a narrow drone maker or an intelligence consultancy. It is trying
              to become the command layer that stitches together sensors, drones, radars, intelligence feeds, and
              effectors inside one operator workflow. The founding team strengthens that positioning. Alon Dror
              contributes defense R&D and operational credibility, Hamutal Meridor adds Palantir-style go-to-market and
              strategic range, and Omer Bar-Ilan plus Jason Manne expand the engineering bench into algorithms, flight,
              and weapons-adjacent product work. The team composition signals founder-market fit, but it also
              concentrates a large amount of institutional authority in four operator-founders whose depth beneath them
              is only partially visible in public materials. This matters because Kela is still young enough that each
              disclosed milestone acts as both operating evidence and identity proof. The company clearly has strategic
              momentum, but the public record still bundles battlefield urgency, investor enthusiasm, and early traction
              together more tightly than a mature diligence process would prefer.
