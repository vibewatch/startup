            body: >-
              The available evidence suggests an architecture built around integration speed rather than around one
              proprietary sensor or airframe. The Android analogy, the official emphasis on rapid insertion, and
              Sequoia’s iteration-under-fire framing all support the view that Kela wants third parties to plug
              capabilities into a stable command layer. The forward-deployed engineer role adds an important practical
              detail: this is not a purely remote software business. Successful deployment appears to require
              customer-specific implementation, operational testing, and field support. Tactical-munitions and
              supply-chain roles imply that hardware-adjacent execution is increasingly part of the stack as well.
              Pelanor broadens that picture by adding cloud and AI engineering capabilities. This operating model is
              powerful if buyers value fast adaptation across mixed fleets, but it also means product quality depends on
              partner interfaces, deployment muscle, and execution discipline just as much as on elegant code. That mix
              is strategically attractive and operationally demanding at the same time. A platform that promises
              openness in combat conditions has to be robust not only in software terms, but also in deployment process,
              training, and partner coordination. In practice, architecture quality here includes the human systems that
