            body: >-
              Kela’s customer story is strongest when framed as an institutional defense-buyer story rather than as a
              conventional enterprise-software sales motion. Launch reporting already placed the company inside the
              Israeli defense establishment, and later reporting sharpened that into the IDF and Ministry of Defense
              orbit. The Starling agreement is especially useful because it gives one concrete institutional
              end-customer context for an important workflow: exclusive rights to sell, integrate, and deploy Pathfinder
              X for the IDF and Israeli Ministry of Defense. That is not the same as a broad disclosed customer list,
              but it is materially stronger than vague national-security interest. The same evidence also shows
              concentration. Public sources still do not enumerate agencies, units, program counts, or named contract
              cohorts. Investors should therefore read the current customer base as real, referenceable, and still
              heavily anchored in one sovereign ecosystem where operational proof is meaningful but public breadth is
              limited. In practical terms, Kela appears to be selling into systems where sponsor credibility, operator
              urgency, and ministry-level approval all matter at once. That combination can create very valuable
              customer relationships, but it rarely produces the kind of broad, easy-to-count account base seen in
              enterprise SaaS. It also means a handful of institutional champions can matter disproportionately over
