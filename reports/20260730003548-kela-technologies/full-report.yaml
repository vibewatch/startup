              matters because Kela is still early enough that it can win strategic relevance without yet having
              eliminated competitive or economic uncertainty. Fast fundraising can also hide problems if margin
              structure, pricing discipline, or services intensity lag the narrative. The main thesis-break conditions
              are straightforward: failure to diversify beyond a narrow sponsor set, regulatory or export blockage that
              prevents foreign conversion, or live-deployment reliability problems that damage trust. Those are the
              variables investors should monitor more closely than vanity growth metrics. That makes risk monitoring
              unusually concrete: investors need proof that the company is turning early momentum into repeatable,
              export-ready operating discipline. In other words, the central question is not whether Kela has
              opportunity, but whether it can professionalize fast enough to keep opportunity from outrunning control.
