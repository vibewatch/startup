  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue signals and monetization shape
        blocks:
          - type: paragraph
            body: >-
              The public record gives just enough financial evidence to show that Kela is more than a concept, but not
              enough to underwrite its economics with confidence. The two most important disclosed signals are roughly
              $20 million of 2025 revenue and contracts above $50 million in the same period. That spread strongly
              suggests a programmatic model where bookings, awards, or milestone-bearing contracts convert into
              recognized revenue over time. It also suggests that revenue quality matters as much as top-line growth.
              Kela is not obviously a pure SaaS vendor. The company appears to monetize a blend of platform software,
              field integration, support, and possibly hardware-adjacent deployments. Hiring for forward deployment and
              supply-chain work reinforces that interpretation. In practical terms, investors should treat Kela as a
              hybrid defense-technology business whose topline could grow quickly but whose margin profile may sit below
              that of a pure software company until more is known. The key unresolved issue is not whether revenue
              exists, but what portion of it is durable, recurring, and scalable without proportional services
              intensity. That distinction is crucial because a fast-growing integrator can look financially impressive
              long before it proves software-style margins or renewal economics. It also complicates peer comparison
              because software multiples and defense-prime multiples reward very different operating characteristics.
              The practical conclusion is that Kela already looks commercially real, but its public evidence still
              supports only a directional model rather than a fully underwritten financial one. Investors should
              separate proof of demand from proof of durable economics until private data closes the gap.
            claimRefs:
