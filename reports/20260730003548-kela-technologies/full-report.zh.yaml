      - number: '6.3'
        title: 持久性、扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户层面的主要未知，不是 Kela 有没有买方，而是今天的买方能否成长为覆盖盟友项目的多元、持久客户基础。公开资料没有披露续约率、流失率、NRR、GRR
              或平均合同期限。收入和合同信号相对公司规模已经足够大，少数机构项目可能主导结果。走出以色列看起来可行，但采购路径、出口管制和买方政治大概率会放慢转化。Trade.gov、DECA、Wassenaar
              和更广泛的政策来源都指向同一结论：下一阶段客户增长的闸门，是合规、渠道触达和参考案例转化，而不只是产品需求。上行空间真实存在，但在具名地域、账户和续约数据显著改善前，集中度和不透明仍是核心承销问题。对投资人而言，判断客户质量不能只看表面收入数字，更要看
              Kela 能否证明，紧迫的国内胜利可以可重复地转化为稳定盟友项目，并带来寿命更长的预算和更清晰的续约行为。在那之前，即便战术采用很强，也可能与实质商业脆弱性和显著预测不确定性并存。
