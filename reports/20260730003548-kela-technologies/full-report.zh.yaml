      - number: '4.3'
        title: 与公开可比公司的披露缺口
        blocks:
          - type: paragraph
            body: >-
              理解 Kela 剩余财务不透明度，最简单的方法是拿它和公开可比公司披露的内容相比。Palantir 提交经审计收入、分部表现、现金流和利润率指标。Elbit 披露收入规模和公开估值标记。Kela
              在公开领域没有披露这些内容。缺失清单很长：ARR、毛利率、现金、烧钱速度、DSO、队列留存、软件与服务组合、积压订单账龄，以及融资条款。这并不意味着经济性很弱，只说明外部投资人还无法验证。主要财务判断因此不是
              Kela
              缺少牵引，而是公开证据仍太薄，无法判断公司应享有软件式经济性、集成商式经济性，还是介于两者之间的混合倍数。后续估值工作应把这种不确定性作为核心输入，而不是噪音。眼下，披露缺失本身就是一项财务事实，因为它拉宽了合理估值区间，并提高任何新投资人的尽调负担。这也意味着，如果私有指标显著好于或差于公开记录，公布的轮次规模会在承销时扭曲认知。披露质量仍是核心尽调约束。实际结论是，Kela
              已经看起来商业上真实，但公开证据仍只支持方向性模型，而不是完整承销过的财务模型。投资人应把需求证明与持久经济性证明分开，直到私有数据补上缺口。
