      - number: '7.2'
        title: 技术、运营与合作伙伴执行风险
        blocks:
          - type: paragraph
            body: >-
              Kela
              的技术逻辑依赖开放架构集成，这既是优势，也是核心风险之一。集成大量系统会提高测试负担、接口脆弱性和任务保障要求。关于正常运行时间、故障率和事件历史的公开证明仍很薄，外部投资人无法独立验证平台在持续现场使用中的稳健性。运营上，前沿部署、战术弹药和供应链岗位说明，执行已经超出纯软件。这扩大了延误、硬件依赖和现场支持强度的暴露面。合作伙伴依赖又叠加一层。Starling
              交易有战略价值，但它也说明，Kela
              的结果会受到第三方模块质量和集成表现影响。简言之，公司的产品雄心可信，但随着更多工作流和硬件相关分支接入平台，运营负担会迅速上升。因此，只有技术优雅还不够；公司还需要可重复的现场流程、合作伙伴治理和有纪律的范围控制。缺少这些控制时，创造差异化的同一份开放性，可能变成不稳定的交付经济性或难以调试的故障链。这正是那类可能很晚才出现的风险：早期牵引已经显得有说服力，预期也已经显著升高。
