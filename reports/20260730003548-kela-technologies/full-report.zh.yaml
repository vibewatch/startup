      - number: '5.3'
        title: 路线图宽度、差异化与信任控制
        blocks:
          - type: paragraph
            body: >-
              Kela 的路线图比当前公开证明更宽，这既带来可选性，也带来风险。太空白皮书和业绩时间线明确显示，公司对主权 LEO 通信、混合 GEO-to-LEO 终端、窄带指挥链路和 PNT 韧性抱有野心。Starling
              把技术栈扩展到自主 UAV
              工作流，战术弹药招聘则暗示管理层愿意延伸到连接控制层的物理系统。因此，差异化落在开放性、主权适配，以及跨多种资产类别的编排上，而不是某个封闭子系统。在碎片化防务环境中，这具备战略吸引力，但也提高了信任、安全、出口纪律和现场可靠性的门槛。公开证据在正常运行时间指标或正式可靠性披露上仍很薄，因此信任论点更多建立在战场相关性和有纪律的定位上，而不是已发布的基准数据。投资人应把产品看作技术上可信、商业上雄心很大，但在稳健性正式证明上仍处早期。上行空间真实存在，但通往持久优势的路径靠的是有纪律的执行，而不是叙事宽度本身。Kela
              增加的相邻分支越多，随着时间推移，覆盖整个平台的标准化接口和质量控制就越重要。
            claimRefs:
              - CE017
