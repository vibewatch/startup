  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入信号与变现形态
        blocks:
          - type: paragraph
            body: >-
              公开记录给出的财务证据刚好足以说明 Kela 不只是一个概念，但还不足以让人有把握地承销其经济性。两个最重要的披露信号，是 2025 年收入约 $20 million，以及同期超过 $50 million
              的合同。两者之间的差距强烈指向一种项目化模型：订单、授标或带里程碑的合同，会随着时间转化为确认收入。它也说明，收入质量与收入增速同样重要。Kela 显然不是纯 SaaS
              供应商。公司看起来靠平台软件、现场集成、支持服务，以及可能的硬件相邻部署组合变现。前沿部署和供应链岗位招聘强化了这一判断。现实中，投资人应把 Kela
              视为一家混合型防务科技公司：收入线可能快速增长，但在更多信息披露前，利润率画像可能低于纯软件公司。关键未解问题不是有没有收入，而是其中多少收入耐久、经常性强，并能在不按比例增加服务强度的情况下扩张。这个区分很关键，因为一家快速增长的集成商，早在证明软件式利润率或续约经济性之前，就能显得财务表现亮眼。它也让同业比较更复杂，因为软件倍数和防务主承包商倍数奖励的是完全不同的经营特征。实际结论是，Kela
              已经看起来商业上真实，但公开证据仍只支持方向性模型，而不是完整承销过的财务模型。投资人应把需求证明与持久经济性证明分开，直到私有数据补上缺口。
