chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、使命与创始团队
        blocks:
          - type: paragraph
            body: >-
              Kela Technologies
              从隐身状态跃升为以色列防务科技中最受关注的名字之一，速度异常快。公司在官方、投资人和独立报道中的公开身份高度一致：一个安全、开放的平台，用来快速集成商用和军用系统，先为以色列战场需求打造，再面向更广阔的西方防务市场。这个定位很关键，因为
              Kela 不是把自己包装成一家狭义无人机厂商，也不是情报咨询公司。它想成为指挥层，把传感器、无人机、雷达、情报源和效应器缝进同一套操作员工作流。创始团队强化了这一定位。Alon Dror
              带来防务研发与作战可信度，Hamutal Meridor 带来 Palantir 式 GTM 和战略纵深，Omer Bar-Ilan 与 Jason Manne
              则把工程能力扩展到算法、飞行和武器相邻产品。团队构成显示创始人与市场匹配，但也把大量机构权威集中在四位运营型创始人身上；他们之下的组织深度，公开材料只能看见一部分。这一点重要，因为 Kela
              仍足够年轻，每个披露的里程碑同时承担运营证据和身份背书。公司显然具备战略势能，但公开记录把战场急迫性、投资人热情和早期牵引捆得太紧，超过成熟尽调流程希望看到的程度。
