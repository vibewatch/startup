      - number: '2.2'
        title: 买方版图、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方版图异常具体。Kela 的第一批客户不是泛泛的全球企业，而是有紧迫集成需求的国防部、军事单位和盟友安全组织。Sequoia 把最初切入口描述为边境保护，后续报道则更直接地把公司与 IDF
              和国防部工作流绑定。Trade.gov 有助于解释这些买方为什么不同于企业 IT 客户：相当一部分支出流经
              FMF、DCC、本地代表要求和其他采购路径，这些机制奖励可信度、本地触达和长周期耐心。因此，采用更多由任务紧迫性和系统碎片化驱动，而不是靠整齐的自下而上软件扩张。同一批公开来源也说明，Kela
              为什么试图从本地执行爬升到美国和 NATO
              需求：这类买方重视战场验证、快速迭代，以及不等待完整主承包商重设计就能组合商用和军用模块的能力。也就是说，运营相关性证明是必要条件，但还不够；一个有前景的试点要变成持久预算线，Kela
              还要穿过采购流程、条令匹配、出口审批和渠道政治。这也意味着，少数机构赞助方在前几年可能对商业结果产生不成比例的影响。承销要点是，庞大的防务预算不会自动转化为快速兑现的软件收入。Kela
              仍必须拿下有赞助方的项目，穿过出口和互操作规则，并证明快速集成能改变采购行为，而不只是制造试点关注。
