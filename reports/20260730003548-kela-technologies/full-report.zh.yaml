      - number: '6.2'
        title: 采用轨迹、部署足迹与交付模型
        blocks:
          - type: paragraph
            body: >-
              采用故事已经清晰到足以重要，但细节仍不足以消除歧义。Sequoia 称，Kela 在开始开发后的数月内就有多个现场活跃项目；Globes
              后来报道，部署点增长到数十个。这些信号强烈表明，公司已经超越纯概念阶段。与此同时，它们没有展示项目规模、客户数量，或活跃与休眠的拆分。招聘能补上一部分缺口。前沿部署工程师岗位说明，客户上线在运营上高度依赖人工；更广泛的招聘则指向持续部署和支持工作。这很重要，因为采用质量不仅取决于有多少站点，也取决于每个账户落地、支持和扩张需要多少人力。Kela
              可能已经与任务高度贴近，但仍依赖比普通软件分发更重的交付模型。这个区分对承销很关键，因为一家公司可以看起来深度嵌入客户，却仍以项目制方式扩张。今天的公开记录更清楚地支持运营相关性，而不是低接触可重复性。它还暗示，账户扩张可能要靠新增工作流和信任积累来获得，而不是靠简单的许可证增购机制。
