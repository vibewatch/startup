    summary: 公开事实支持很宽的估值区间，因为少数披露指标可以映射到差异很大的经济模型。
    data:
      items:
        - label: 保守集成商框架
          low: 0.5
          mid: 0.7
          high: 0.9
          unit: $B
        - label: 当前报道价格
          low: 1
          mid: 1.2
          high: 1.2
          unit: $B
        - label: 乐观平台框架
          low: 1.2
          mid: 1.6
          high: 2
          unit: $B
        - label: 收入信号
          low: 15
          mid: 20
          high: 25
          unit: $M
    approximationNotes: 区间是基于公开可比公司和披露信号的情景带，不是折现现金流。
    id: FV001
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV027
  - key: comp-matrix
    title: 可比估值矩阵
    type: matrix
    layout: wide
    summary: Kela 介于上市软件、上市国防和私营国防平台叙事之间。
    data:
      columns:
        - 披露深度
        - 战略溢价
        - 当前规模
        - 直接可比性
      rows:
        - label: Palantir
          values:
            - 高
            - 高
            - 极高
            - 中
        - label: Elbit
          values:
            - 高
            - 中
            - 极高
            - 中
        - label: Anduril
          values:
            - 低-中
            - 高
            - 高
            - 中
        - label: Shield AI
          values:
            - 低-中
            - 高
            - 中-高
            - 中
        - label: Kela
          values:
            - 低
            - 高
            - 低-中
            - 自身
    approximationNotes: 数值是定性比较，不是市场数据字段。
    id: FV002
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV016
      - CV017
  - key: scenario-kpis
    title: 情景门槛 KPI
    type: kpi
    layout: wide
    summary: 接下来最影响估值支撑的证据。
    data:
      items:
        - label: 收入信号
          value: ~$20M
        - label: 合同信号
          value: $50M+
        - label: 当前价格锚点
          value: ~$1.2B
        - label: 关键缺失指标
          value: Gross margin
        - label: 关键缺失指标
          value: Renewal data
        - label: 关键触发因素
          value: Named allied deployments
    approximationNotes: 这些是估值闸门，不是管理层仪表盘。
    id: FV003
    claimRefs:
      - CV002
      - CV003
      - CV014
      - CV034
  - key: decision-funnel
    title: 建议漏斗
    type: funnel
    layout: standard
    summary: 估值论证从公司质量走向价格纪律时，空间会逐步收窄。
    data:
      items:
        - label: 战略相关性
          value: 100
          detail: 公司显然值得关注
        - label: 公开牵引力
          value: 80
          detail: 存在收入和合同信号
        - label: 可比公司支撑
          value: 55
          detail: 可比公司支持溢价叙事，但不给精确定价
        - label: 承销信心
          value: 35
          detail: 关键经济指标和条款缺失
        - label: 价格确信度
          value: 20
          detail: 入场仍需要更多证明
    approximationNotes: 数值是序位信心权重，不是概率。
    id: FV004
    claimRefs:
      - CV018
      - CV032
      - CV033
      - CV039
