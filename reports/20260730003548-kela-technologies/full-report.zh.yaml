        blocks:
          - type: paragraph
            body: >-
              核心估值判断是：公司质量和估值吸引力不是同一个问题。公开证据支持认真尽调，因为 Kela
              明显处在一个战略相关市场，且推进速度快过大多数同龄公司。公开证据不支持不计价格盲目下判断。缺失的内容——轮次条款、稀释结构、毛利率、留存质量、地区结构，以及更清楚的软件杠杆证明——恰好是投资者判断溢价倍数是否合理所需的内容。因此，纯公开资料下的正确态度是建设性但价格敏感：公司值得接触，估值标记需要谨慎，重点看后续披露能否把业务推向可重复的平台形态，而不是高价值但低倍数的集成商形态。也就是说，当前最好的建议不是否定这个价格，而是在仅凭经济性就把本轮视为明显有吸引力之前，要求更硬的证据。换句话说，公司也许配得上溢价，但公开记录还没有让一个溢价入场点在缺少额外尽调支持时站稳。纪律严明的投资者可以继续看好资产，同时坚持价格与证据之间更紧的关系，并在现阶段要求更好的估值纪律。
