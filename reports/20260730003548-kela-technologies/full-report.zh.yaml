      - number: '3.2'
        title: 差异化、切换成本与渠道权力
        blocks:
          - type: paragraph
            body: >-
              Kela 最强的差异化主张不是某个硬件功能，而是开放、快速、主权化集成的承诺。官网、Sequoia 和独立报道都强调模块化、合作伙伴系统集成，以及战场条件下的快速部署。Starling 交易进一步说明，Kela
              希望把第三方模块编排进自己的操作系统，而不是坚持完全自有的终端产品。在买方继承旧传感器、碎片化机队和多个供应商的环境里，这一点具备战略吸引力。即便如此，切换成本仍然很高。军事买方关心条令、集成历史、认证、本地代表和长采购周期。大型同业的分销权力也更强。Palantir
              可借助上市公司规模，Shield AI 有美国重大自主化项目，Anduril 有资本与全栈野心，Elbit 则拥有根深蒂固的本土和出口关系。Rafael 与 Elbit
              还显示，既有玩家可以把战场软件包进更广泛的国家项目，初创公司很难替代。Kela
              的开放性是真实切口，但前提是它能转化成可重复的渠道触达和持久的项目绑定。没有可重复的参考案例，买方仍可能偏好开放性稍弱、但机构更熟悉且保障能力更广的既有玩家。在防务采购里，最强竞争者往往不是功能清单最漂亮的公司，而是掌握渠道控制、认证历史和保障信心的公司。这抬高了
              Kela 的门槛，因为开放性必须转化为项目绑定，而不只是架构吸引力。
