  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用战场工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              最适合描述 Kela 的，不是无人机公司、卫星公司，也不是独立分析工具供应商。公开材料中最一致的说法，是一个开放架构的指挥控制层，帮助军事操作员把多个系统合进同一套工作流。官方文案、启动报道、Sequoia
              的投资人文章和后续 Globes 报道，都指向同一个运营想法：商用和军用传感器、AI
              模型、边缘设备、无人机、雷达、情报系统和效应器，应当能比传统主承包商主导的重设计周期更快缝合起来。这个框架重要，因为它用客户工作流来定义产品，而不是一张静态功能清单。Kela
              卖的是集成时间、操作员可用性和任务适应性。可见的产品表面已经包括核心集成软件、合作伙伴模块、Starling UAV 集成，以及前沿部署实施。因此，投资人应把 Kela
              看成一个有多个挂载点的工作流平台，而不是单一任务应用。公司的核心承诺是，混合机队和新软件工具要协同工作，操作员不应等待完整的主承包商重设计。这是一项有意义的主张，因为在紧急部署中，战场速度在实践里往往比孤立的功能完美更值钱。
