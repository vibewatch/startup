      - number: '8.2'
        title: 可比样本与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              最有用的公开可比样本并不完美，但足以框住争论范围。Palantir 是最强的公开指挥层软件参照，Elbit 是最清晰的成熟主权防务规模参照，Anduril 和 Shield AI
              则是投资者愿意为战略防务科技叙事支付高价的私有市场样本。没有哪个可比样本能直接套到 Kela 身上。Palantir 有经审计披露和公开市场规模；Elbit 有大额披露工业收入；Anduril 和 Shield
              AI 仍主要依赖私募市场叙事。即便如此，它们让情景逻辑更清楚。Kela
              的乐观情形需要黏性平台经济性和盟友市场扩张。悲观情形是，公司证明了战略相关性，但经济性更接近项目型集成商。基准情形介于两者之间：牵引力真实、选择权真实，投资判断仍不完整。公开可比分析的价值，在于收窄合理范围并指出
              Kela 还必须证明什么，而不是假装一个市场倍数就能回答问题。实际上，这组可比样本更多说明 Kela
              可能长成哪类结果，而不是今天到底该给多少倍数。它们也显示，在当下这个板块里，披露质量是合理溢价与投机溢价之间最大的差别之一。
