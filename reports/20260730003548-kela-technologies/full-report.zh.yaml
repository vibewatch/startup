companyProfile:
  summary: >-
    Kela Technologies 是一家位于 Tel Aviv 的防务科技初创公司，成立于 2024 年 7
    月，目标是搭建开放架构的指挥控制层，把传感器、无人机、雷达、情报系统和效应器接进同一套操作员工作流。公司把以色列防务研发、Palantir Israel、Rafael 和 IAF
    武器工程背景带来的创始人可信度，与异常快速的融资节奏、据报道的战场部署，以及从核心 C2 软件到自主 UAV 集成、再到硬件相邻执行的更宽产品范围结合在一起。核心投资张力在于：Kela
    看起来具备战略相关性，也已经商业化落地，但在客户多元化、续约质量、利润率和治理上，公开披露仍落后于估值。
