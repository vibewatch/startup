      - number: '2.3'
        title: 增长驱动、采用约束与相邻预算池
        blocks:
          - type: paragraph
            body: >-
              三个增长驱动最突出。第一，冲突加速了对自主系统和数据密集型系统的需求，CTech 和 VC Cafe
              都直接描述了这一点。第二，投资人越来越相信，以色列防务初创公司不仅能争取国内战时预算，也能竞争盟友合同。第三，Kela
              自身路线图正把集成逻辑扩展到韧性通信和导航，这可能把平台相关性从战术控制拓宽到主权基础设施。约束同样真实。DECA 把出口管制合规放在核心位置，而不是可选项。Trade.gov
              提到人力短缺、组件限制，以及漫长的制造和授标周期。EC Compliance 还补充说，2026
              年加密管制改革将迫使公司更谨慎地在民用和防务最终用途制度之间对产品分类。这些摩擦不会杀死市场，但它们意味着，采用会受到采购、出口纪律和主权运营要求的闸门约束；普通企业软件投资人容易低估这一点。换句话说，市场可以很大、很紧迫，却仍比周围热度暗示的节奏更慢变现。这种张力就是核心承销要点：品类需求看起来真实，但收入时点很可能多年落后于叙事势能和预算转化纪律。承销要点是，庞大的防务预算不会自动转化为快速兑现的软件收入。Kela
              仍必须拿下有赞助方的项目，穿过出口和互操作规则，并证明快速集成能改变采购行为，而不只是制造试点关注。
