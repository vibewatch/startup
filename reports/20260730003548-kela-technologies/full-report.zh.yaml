            body: >-
              Kela 的护城河论点可信，但尚未证明。如果公司成为可信的指挥层，让买方能比既有玩家更快组合本地和外国系统，它就可能在多个子系统之间占据战略控制点。主权角度同样重要：Kela
              可以把战场可信度、可信本地集成和通信韧性可选项打包起来，这一点外国同业很难完全复制。但证据缺口仍很实质。与 Anduril、Shield AI、Palantir、Rafael 或 Elbit 相比，Kela
              的公开客户证明、定价数据，以及本土市场外重复获胜证据都薄得多。它也缺少既有玩家用来防守续约和相邻增购的广泛已安装项目基础。因此，公司看起来更像新兴挑战者，而不是已经证实的品类赢家。投资人应把开放性和速度视为有强早期支持的假设，而不是完全证明的护城河。通往持久性的最清晰路径，不是赢下每一场子系统战斗，而是成为其他系统必须穿过的默认工作流层。在那之前，对今天的全球投资者来说，竞争风险仍是结构性的，而非表面问题。在防务采购里，最强竞争者往往不是功能清单最漂亮的公司，而是掌握渠道控制、认证历史和保障信心的公司。这抬高了
