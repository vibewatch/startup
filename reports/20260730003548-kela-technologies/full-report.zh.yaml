  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与具名证明
        blocks:
          - type: paragraph
            body: >-
              Kela 的客户故事，放在机构防务买方语境里最强，而不是常规企业软件销售运动。启动报道已经把公司放进以色列防务体系，后续报道又把范围收紧到 IDF 和国防部周边。Starling
              协议尤其有用，因为它为一项重要工作流提供了一个具体机构终端客户场景：面向 IDF 和以色列国防部销售、集成和部署 Pathfinder X
              的独家权利。这不等于一份广泛披露的客户名单，但比模糊的国家安全兴趣实质得多。同一批证据也显示出集中度。公开来源仍没有列出机构、部队、项目数量或具名合同队列。因此，投资人应把当前客户基础理解为真实、可被引用，但仍重度锚定在一个主权生态中；作战证明有意义，公开广度却有限。现实中，Kela
              看起来卖进的是这样一套系统：赞助方可信度、操作员紧迫性和部级批准同时重要。这种组合可以创造很有价值的客户关系，但很少会产生企业 SaaS
              那种广泛且容易计数的账户基础。它也意味着，少数机构拥护者会随着时间产生不成比例的影响。
