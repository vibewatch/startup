            body: >-
              对一家 2024 年中才成立的公司来说，这条融资轨迹非同寻常。公开报道显示，公司以 $39 million 隐身启动，第一年累计融资达到 $100 million，随后在 2026 年 5 月以约 $1.2
              billion 估值完成约 $200 million 轮融资，最后在 2026 年 6 月被描述为累计融资约 $300 million。这个速度说明两件事。第一，投资人显然相信 Kela
              占据的是防务现代化中的战略层，而不是一次性子系统品类。第二，公司定价更多押注预期市场扩张和战场相关性，而不是已披露经济性。投资人名单同样醒目：Sequoia 和 Lux 锚定了早期故事，In-Q-Tel
              增加国家安全信号，后续财团又带来 Stripes、D1、Bill Ackman 和 Eric Schmidt 的成长资本。缺失的信息与可见信息同样重要。公开来源没有披露董事会权利、清算优先权、Pelanor
              收购带来的稀释，或早先报道的 $100 million 累计融资与后来的 $300 million 数字之间到底如何衔接。这一点重要，因为 Kela
              仍足够年轻，每个披露的里程碑同时承担运营证据和身份背书。公司显然具备战略势能，但公开记录把战场急迫性、投资人热情和早期牵引捆得太紧，超过成熟尽调流程希望看到的程度。
