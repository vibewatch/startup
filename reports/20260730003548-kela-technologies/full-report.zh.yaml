  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与最近的同业类别
        blocks:
          - type: paragraph
            body: >-
              Kela 面对的不是一个清晰的同业集合。它所处的位置，是软件驱动的指挥层、自主化栈和传统防务主承包商的交界。最接近的战略基准是 Anduril，因为它把软件、硬件和国家安全 GTM
              合进一个防务平台叙事。Shield AI 是强自主化对标，Palantir Gotham 是指挥层和数据融合对标，Elbit 则是最清晰的本土既有玩家，拥有成熟的主权关系和工业规模。Rafael 同样重要，因为
              Fire Weaver 等产品说明，以色列既有玩家已经理解数字化战场编排，也能把它封装进更大的武器和 C4ISR 组合。这个格局重要，因为 Kela
              不是只想打败一家无人机厂商或一家分析公司；它想成为买方需要多个系统快速协同时所信任的集成点。同业集合也暴露出这一尝试有多激进。公开可比公司的规模远高于 Kela 已披露数字，这意味着 Kela
              竞争的抓手更多是速度、开放性和战场迭代，而不是装机基础广度或机构收入体量。现实中，在考虑一个更新的平台进入者之前，每个买方已经可以从主承包商、自主化专家和指挥软件栈中选取某种组合，而且往往带着多年机构熟悉度和预算历史。
