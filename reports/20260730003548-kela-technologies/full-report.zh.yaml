  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与名义价格真正说明什么
        blocks:
          - type: paragraph
            body: >-
              公开估值锚已经足够清楚：到 2026 年 5 月，多家媒体称，Kela 正在以约 $1.2 billion 的估值融资约 $200 million。Kela 2024
              年中才成立，这个价格很惊人；解读它时，既要看当前经济性，也要看投资者预期。公开报道还给出了支撑该价格的关键规模信号——2025 年收入约 $20 million，合同额超过 $50
              million。数字证明了牵引力，但毛利质量、服务投入强度、积压订单转化仍留下很大的解读空间。因此，头部价格看起来更多是在定价战略重要性、潜在品类领导者身份，以及与战时需求相关的动能，而不是成熟且充分披露的财务质量。融资新闻更像一次战略信任票，而不是底层经济性风险已经完全出清的定论。投资者实际上是在提前为一种未来业务形态付费；这种形态说得通，但公开材料中仍只露出一部分。只有后续尽调能为投资者以可衡量方式补上叙事质量与经济可见度之间的缺口，这种提前付费才站得住。
