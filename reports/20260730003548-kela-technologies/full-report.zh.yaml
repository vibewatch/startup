      - number: '1.3'
        title: 规模信号、产品延展与未解尽调问题
        blocks:
          - type: paragraph
            body: >-
              与同龄的多数以色列防务初创公司相比，Kela 已经拿出更强的公开规模信号，但这些信号仍不均衡。独立媒体报道了约 $20 million 的 2025 年收入、超过 $50 million 的合同、约 150
              名员工、以色列南部工厂，以及从少数地点增长到数十处的部署。Starling 合作、Pelanor
              收购和公司自己的太空白皮书，都指向同一条战略：围绕不断扩大的防务生态成为编排层，而不是做单一产品供应商。招聘证据也支持这一判断：Kela
              正在招聘前沿部署、供应链、战术弹药和任务运营岗位，意味着软件加硬件集成，再加客户支持。与此同时，未解问题很实质。公开记录仍没有展示按金额划分的客户集中度、毛利率、续约行为、项目级经济性或治理结构。公司拥有明确战略势能，但从快速的以色列战时集成商，跨到持久的西方防务主承包商，仍是一条投资逻辑，而不是已经完成的事实链。这是后续章节的核心判断：Kela
              重要到值得完整尽调，但仍太年轻、也太不透明，不能把当前画像视为定局。这一点重要，因为 Kela
              仍足够年轻，每个披露的里程碑同时承担运营证据和身份背书。公司显然具备战略势能，但公开记录把战场急迫性、投资人热情和早期牵引捆得太紧，超过成熟尽调流程希望看到的程度。
