        blocks:
          - type: paragraph
            body: >-
              Kela 的财务和战略风险，被涌入防务科技的资本速度放大了。Anduril、Shield AI、Mach、Saronic 和 Epirus
              的公开信息显示，资金充足的同业会抬高客户预期、加剧招聘压力，并让品类控制权更具争夺性。这很重要，因为 Kela
              仍处早期，可能已经赢得战略相关性，却还没有消除竞争或经济不确定性。如果利润率结构、定价纪律或服务强度落后于叙事，快速融资也可能遮住问题。主要投资逻辑破裂条件很直接：无法跳出狭窄赞助方集合，监管或出口阻塞导致海外转化受阻，或现场部署可靠性问题损害信任。投资人应比虚荣增长指标更密切地盯住这些变量。这让风险监控异常具体：投资人需要证据，证明公司正在把早期势能转化为可重复、出口就绪的运营纪律。换句话说，核心问题不是
              Kela 有没有机会，而是它能否足够快地专业化，避免机会跑在控制能力前面。因此，这里的风险纪律不是悲观，而是在检验叙事速度与运营成熟度是否保持平衡。资本充裕不会免除这一义务，也不会降低执行问责。
