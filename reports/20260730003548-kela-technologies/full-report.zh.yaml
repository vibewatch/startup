  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              理解
              Kela，更合适的口径是防务集成与指挥控制平台公司，而不是无人机制造商、卫星公司或纯网络安全工具供应商。平台所处的位置，是混合系统必须实时协同的那一层：传感器、无人机、情报源、雷达、指挥界面，以及越来越重要的通信和导航韧性。因此，相关市场边界比任何单一硬件品类更宽，但又比全部防务开支更窄。最有用的公开规模视角，不是一个干净的
              TAM 数字，而是相邻预算池。Trade.gov 报告称，2024 年以色列防务支出约 $31.5 billion，防务出口额 $15 billion，活跃 FMS 案例 $39.2 billion，并有
              C4I、网络 / 情报、卫星、雷达 / EW 和 UAV 等可见子板块。这些数字不能直接相加得出 Kela 的可服务市场，但它们说明，只要 Kela
              能成为可信的编排层，公司所在预算池足以支撑多个十亿美元级结果。同样重要的是，这个框架能把后续估值工作锚定在 Kela
              现实可能拿下的窄切片上，而不是把防务现代化标题下的每一美元都算进去。它也避免把相邻采购背景误当作 Kela
              自身合理的近期收入边界和实际近期部署带宽。承销要点是，庞大的防务预算不会自动转化为快速兑现的软件收入。Kela 仍必须拿下有赞助方的项目，穿过出口和互操作规则，并证明快速集成能改变采购行为，而不只是制造试点关注。
