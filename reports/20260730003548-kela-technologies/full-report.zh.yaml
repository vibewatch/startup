  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              Kela 所在品类里，监管是产品的一部分，不是后台职能。DECA、国防部、Wassenaar 和 2026
              年加密管制更新都指向同一种风险：软件、集成系统和海外部署，可能被许可和分类决定放慢或重塑。对一家想把以色列战场证明转化为盟友项目的公司来说，出口就绪因此是战略依赖。同一事实链也带来地缘政治敏感性。以色列防务机构的高度集中给
              Kela
              带来有价值证明，但也把近期结果绑定到一个国家安全环境，以及该证明向海外转化的速度。投资人应把可出口性、监管包装和地域集中度视为相互缠绕的风险，而不是彼此独立。实际结果是，监管就绪、文档质量和产品分类对销售时点的影响，几乎可以和产品表现一样大。一家公司技术上可以很强，但如果审批、法律解释或客户出口约束慢于产品路线图，势能仍会流失。这让法律执行质量成为业务里的战略变量，而不只是支持职能。
