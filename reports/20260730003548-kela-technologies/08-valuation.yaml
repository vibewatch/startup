  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Kela has enough public traction and category relevance to justify serious investor interest, but the current valuation context still relies more on strategic narrative and future optionality than on fully disclosed economics. The company could eventually earn a premium if it proves durable command-layer control across allied markets, yet the public record today does not make that premium obviously cheap. The right stance is therefore constructive on company quality but disciplined on price."
  },
  "sections": [
    {
      "id": "financing-context-and-price-anchor",
      "title": "Financing context and what the headline price really says",
      "body": "The public valuation anchor is clear enough: by May 2026, multiple outlets reported that Kela was raising about $200 million at roughly a $1.2 billion valuation. That is a remarkable price for a company founded in mid-2024 and it should be read as a signal about investor expectations as much as about present economics. Public reporting also supplied the most important scale markers behind that price—roughly $20 million of 2025 revenue and more than $50 million of contracts. Those numbers validate traction, but they still leave a wide range of interpretations around margin quality, services intensity, and backlog conversion. The headline price therefore appears to reflect strategic importance, perceived category leadership potential, and wartime-relevant momentum more than mature, fully disclosed financial quality. For that reason, the financing headline should be interpreted as a strategic vote of confidence rather than as definitive proof that the underlying economics are already fully de-risked. Investors are effectively paying in advance for a future shape of business that is plausible, but still only partially visible in public materials. That is acceptable only if later diligence closes the gap between narrative quality and economic visibility in a measurable way for investors later.",
      "claimRefs": [
        "CV001",
