    {
      "id": "entry-discipline-and-final-stance",
      "title": "Entry discipline, recommendation, and thesis-break triggers",
      "body": "The central valuation judgment is that company quality and valuation attractiveness are not the same question. Public evidence supports serious diligence because Kela clearly sits in a strategically relevant market and has progressed faster than most peers of similar age. Public evidence does not support blind underwriting at any price. The missing pieces—round terms, dilution stack, gross margin, retention quality, geography mix, and clearer proof of software leverage—are exactly the pieces investors need to know whether a premium multiple is deserved. The right public-only stance is therefore constructive but price sensitive: be open to the company, cautious on the mark, and focused on whether future disclosures move the business toward a repeatable platform profile rather than a high-value but lower-multiple integrator profile. That means the best current recommendation is not to dismiss the price, but to demand sharper evidence before treating the round as plainly attractive on economics alone. Put differently, the company may merit a premium, but the public record has not yet earned a premium entry without additional diligence support. A disciplined investor can stay positive on the asset while still insisting on a tighter price-to-proof relationship and better valuation hygiene today for now now.",
