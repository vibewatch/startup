    {
      "id": "differentiation-and-switching-costs",
      "title": "Differentiation, switching costs, and channel power",
      "body": "Kela's strongest differentiation claim is not a single hardware feature; it is the promise of open, fast, sovereign integration. The official site, Sequoia, and independent reporting all emphasize modularity, partner system integration, and rapid deployment in battlefield conditions. The Starling deal reinforces that Kela wants to orchestrate third-party modules inside its own operating system rather than insist on wholly proprietary end products. That is strategically attractive in a buyer environment where programs inherit old sensors, fragmented fleets, and multiple suppliers. Still, switching costs remain high. Military buyers care about doctrine, integration histories, accreditation, local representatives, and long procurement cycles. Large peers also have stronger distribution power. Palantir can lean on public-company scale, Shield AI on major U.S. autonomy programs, Anduril on capital and full-stack ambition, and Elbit on entrenched domestic and export relationships. Rafael and Elbit also show how incumbents can wrap battlefield software into broader national programs that are hard for a startup to displace. Kela's openness is a real wedge, but only if it converts into repeatable channel access and enduring program attachment. Without repeatable references, buyers may still prefer a less open but more institutionally familiar incumbent with broader sustainment capacity. In defense procurement the strongest competitor is often the one with channel control, accreditation history, and sustainment confidence rather than the one with the neatest feature list. That raises the bar for Kela because openness must convert into program attachment, not just architectural appeal.",
      "claimRefs": [
        "CP014",
        "CP015",
        "CP012",
        "CP017",
        "CP029",
