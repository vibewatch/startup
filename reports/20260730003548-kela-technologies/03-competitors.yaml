  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Kela's competitive set spans full-stack defense-tech platforms like Anduril, autonomy specialists like Shield AI, command-layer software leaders like Palantir, and domestic incumbents like Elbit. Kela's clearest differentiators are open architecture, rapid battlefield integration, and sovereign local fit, but those strengths are being tested against peers with much deeper public customer proof, channel power, and scale. The company therefore looks competitively interesting rather than competitively settled: it may carve out a defensible control point, but the moat still needs repeatable win evidence."
  },
  "sections": [
    {
      "id": "landscape-map",
      "title": "Competitive landscape and closest peer classes",
      "body": "Kela does not face one clean peer set. It sits where software-led command layers, autonomy stacks, and incumbent defense primes overlap. The nearest strategic benchmark is Anduril because it combines software, hardware, and national-security GTM into one defense-platform narrative. Shield AI is a strong autonomy comparison, Palantir Gotham is a command-layer and data-fusion comparison, and Elbit is the clearest domestic incumbent with established sovereign relationships and industrial scale. Rafael also matters because products like Fire Weaver show that incumbent Israeli players already understand digital battlefield orchestration and can package it inside larger weapons and C4ISR portfolios. That landscape matters because Kela is not just trying to beat one drone vendor or one analytics company; it is trying to establish itself as the integration point buyers trust when they want many systems to work together quickly. The peer set also reveals how ambitious that attempt is. Public comparator scales are far above Kela's disclosed numbers, which means Kela is competing more on speed, openness, and battlefield iteration than on breadth of installed base or institutional revenue. In practical terms, Kela is entering a field where every buyer can already choose some combination of prime contractor, autonomy specialist, and command software stack before it considers a newer platform entrant, often with years of prior institutional familiarity and budget history.",
      "claimRefs": [
        "CP001",
