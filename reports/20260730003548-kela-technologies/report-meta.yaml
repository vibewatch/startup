  productSummary: >-
    Kela sells an open-architecture command-and-control platform designed to integrate commercial and
    military systems quickly across sensors, drones, radars, intelligence feeds, and effectors,
    while extending into partner-enabled autonomous-UAV workflows and selected hardware-adjacent
    mission areas.
  customerFocus: >-
