  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The narrow market boundary is network detection and response: observing packets or flow records on
              physical networks and cloud VPC mirrors to identify behavior that endpoint agents may not see. Vectra
              broadens that core into identity, cloud, SaaS, investigation, response, and posture improvement, but those
              adjacencies should not be counted as if all cybersecurity spend were addressable. EDR, SIEM, firewalls,
              IPS, and manual SOC analysis remain substitutes or complements rather than automatically included spend. A
              customer review describes those controls as more reactive and Vectra as an added proactive layer; that
              supports workflow relevance, not proof that Vectra displaces every incumbent budget. Channel reporting
              also identifies fragmented hybrid estates as the operating problem, so the most credible boundary is
              complex enterprises needing cross-domain behavioral visibility, not the entire security software market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
