  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Architectural Delineation
        blocks:
          - type: paragraph
            body: >-
              The enterprise threat detection landscape spans specialized Network Detection and Response (NDR) vendors,
              broad Extended Detection and Response (XDR) suites, Security Information and Event Management (SIEM) data
              platforms, and hyperscaler native logging CP001. Within the core NDR domain, Vectra AI and Darktrace
              represent two dominant but divergent philosophical architectures CP002. Vectra AI organizes its
              architecture around physical and virtual network sensors, cloud API connectors, and an Attack Signal
              Intelligence engine that maps observed network anomalies directly to MITRE ATT&CK techniques CP003, CP005.
              This contrasts with Darktrace's Enterprise Immune System, which models entity behavioral baselines and
              flags any statistical deviation rather than filtering through technique-specific attack models CP004,
              CP006. Beyond pure NDR specialists, enterprise buyers increasingly evaluate Vectra AI against consolidated
              security operations suites such as Palo Alto Networks Cortex XSIAM CP007. In buyer evaluations on
              PeerSpot, Cortex XSIAM ranks 8th in AI-powered cybersecurity platforms while Vectra AI ranks 7th, with
              reviewers highlighting Vectra's strength in east-west network traffic detection and false-positive
              reduction alongside demands for improved SIEM integration and deployment flexibility CP008, CP009.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
