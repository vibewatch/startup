      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on operating and product signals rather than valuation proof. Latka reports $120
              million of 2025 revenue, while Vectra's historical release reported 181% revenue growth and 67%
              enterprise-customer growth in 2017. The current company site positions the platform across on-premises,
              multi-cloud, identity, and response workflows, and the company's AI-scam analysis describes a large and
              growing fraud problem. These are supportive demand and scope indicators, but most are company-issued or
              not independently audited. The anti-thesis is stronger on price: current revenue quality, growth, margins,
              retention, cash burn, debt, and customer concentration are absent from the assigned public evidence, while
              cumulative funding estimates range from $266 million to $425 million.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Valuation framing and scenarios
        blocks:
          - type: paragraph
            body: >-
              A simple cross-vintage reference divides Latka's reported $1.2 billion 2021 valuation by its reported $120
              million 2025 revenue, producing roughly 10.0x. That is not a transaction multiple: the numerator and
              denominator come from different periods, the revenue is not identified as ARR, and neither current net
              debt nor preference claims is available. It is useful only as a diagnostic showing how much evidence is
              missing. Bull, base, and bear cases therefore use observable proof requirements rather than invented
              equity ranges. The bull case requires current growth and retention proof; the base case requires price
              protection against stale inputs; the bear case is triggered by weak growth, impaired liquidity, or
              preference and debt overhang.
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Diligence priorities and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The decisive work is transaction-specific. Obtain audited or management-certified 2025 and
              trailing-twelve-month revenue, ARR only if contractually defined, gross margin, net retention, burn, cash,
              debt, and customer concentration. Reconcile the cap table to the four incompatible public funding totals,
              then inspect every preferred series for liquidation preference, participation, dividends, conversion,
              seniority, anti-dilution, and investor rights. Request a recent 409A, any secondary indications with dates
              and volumes, and board materials supporting the 2026 plan. Exit readiness should be treated as unproven
              until audited reporting, governance, predictable growth, and a credible liquidity path are demonstrated. A
              down-round, weak retention, or material senior preference overhang would break the current tracking
              thesis.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Track Vectra AI, but do not treat the 2021 unicorn valuation as a current entry price; require
              transaction-specific evidence before underwriting returns.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV011
              - CV013
              - CV015
              - CV016
          - type: callout
            title: Funding totals cannot be reconciled publicly
            body: >-
              The retained sources report four different cumulative funding totals, so neither capital raised nor
              preference overhang should be inferred from a single database.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
