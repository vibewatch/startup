        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The evidence points to enterprise SecOps as the user center: security analysts investigate prioritized
              detections, while CISO or security-operations budgets bear the license, deployment, and retention cost. A
              verified large-enterprise manufacturing reviewer reports M365 and Azure AD integration, illustrating an
