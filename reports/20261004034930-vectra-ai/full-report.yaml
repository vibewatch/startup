  - id: FE001
    title: Vectra AI Platform Architecture and Data Flow Pipeline
    type: stack
    summary: >-
      Six-tier architectural processing stack illustrating packet capture, cloud connectors, metadata enrichment, AI
      behavioral detection, agentic API interfaces, and automated downstream response.
    data:
      layers:
        - label: 'Layer 1: On-Premise Wire Ingestion'
          detail: Passive packet capture via physical and virtual SPAN/TAP sensors up to multi-trillion-bit aggregate scale.
          modules:
            - label: Physical Network Sensors
              detail: High-throughput appliances capturing raw east-west data center packets.
            - label: Virtual Branch Sensors
              detail: Lightweight sensors capturing traffic across distributed corporate branch subnets.
        - label: 'Layer 2: Cloud & Identity Event Streaming'
          detail: Agentless API ingestion across multi-cloud control planes, SaaS tenants, and identity providers.
          modules:
            - label: Cloud VPC Connectors
              detail: Agentless telemetry streaming from AWS, Azure, GCP, and OCI environments.
            - label: Identity Audit Log Streamers
              detail: Real-time authentication and directory event ingestion from Microsoft Entra ID.
        - label: 'Layer 3: Metadata Extraction & Session Enrichment'
          detail: Normalization and protocol parsing that extracts behavioral metadata without payload decryption.
          modules:
            - label: Session Normalization Engine
              detail: Processes billions of sessions per hour into structured flow metadata.
            - label: Cognito Recall Store
              detail: Stores protocol metadata (TLS handshakes, DNS, Kerberos) for threat hunting.
        - label: 'Layer 4: Behavioral Detection & Attack Signal Intelligence'
          detail: Machine learning algorithms and 35+ patented models mapping >90% of MITRE ATT&CK techniques.
          modules:
            - label: Behavioral Analytics Engine
              detail: Evaluates anomaly vectors for lateral movement, C2, and privilege escalation.
            - label: Entity Correlation & Prioritization
              detail: Tracks attacker progression across changing IP addresses and identity accounts.
        - label: 'Layer 5: Developer & Agentic AI Interface Layer'
          detail: REST APIs and Model Context Protocol (MCP) server endpoints enabling automated AI agent interactions.
          modules:
            - label: Enterprise REST API Platform
              detail: OpenAPI/Swagger documented services built on Python and PostgreSQL backend.
            - label: Model Context Protocol (MCP) Server
              detail: Exposes security context and findings safely to external LLMs and agentic workflows.
        - label: 'Layer 6: Actionable Signal & Ecosystem Response'
          detail: Automated alert triage, 360 Response containment, and downstream SOAR/EDR integration.
          modules:
            - label: 360 Response Engine
              detail: Enforces automated containment across identity and network perimeters.
            - label: Ecosystem Integrations
              detail: Bidirectional alerting and host isolation via SIEM, EDR, and SOAR tools.
    approximationNotes: >-
      Represents conceptual enterprise architecture derived from Vectra technical documentation and engineering
      specifications.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE011
