      - number: '6.3'
        title: Durability signals and customer friction
        blocks:
          - type: paragraph
            body: >-
              Multi-year use and product expansion are positive durability signals, but neither substitutes for
              retention data. The anonymous reviewer describes more than three years of use, an on-premises deployment,
              planned acquisition of Microsoft 365 and Azure AD coverage, and participation in a PaaS visibility beta.
              The same account reports meaningful friction: initial tuning takes four to eight weeks, Cognito Detect
              reporting is too limited for customized host reports without manual work, and pricing is above average.
              Those drawbacks matter because implementation effort and premium pricing can affect renewal and expansion
              even when detection quality is valued. The retained evidence contains no NRR, GRR, logo churn, renewal
              rate, contract duration, satisfaction trend, or support-service-level data. Customer durability therefore
              remains a material diligence gap rather than a quantified strength.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU016
      - number: '6.4'
        title: Expansion loops and channel dependence
        blocks:
          - type: paragraph
            body: >-
              Expansion appears to combine product breadth, continuous releases, integrations, and partner-delivered
              services. The 9.14 release states that connected Remote Support customers received algorithm improvements
              through the update service and that Traffic Visibility Drop Alerting had completed rollout to all
              customers. Exabeam supplies an adjacent SIEM and automation path by ingesting Vectra detections and
              correlating them with user, host, and cloud activity. At the route-to-market layer, Channel Insider
              reports that Vectra works exclusively with channel partners, while partner coverage and marketing
              materials emphasize MSSP and channel-team collaboration. These mechanisms can widen implementation and
              managed-service coverage, but public sources provide no partner-sourced revenue share, reseller
              concentration, attach rate, procurement cycle, or expansion-rate denominator. The channel is therefore
              both a distribution asset and an unquantified dependency.
            claimRefs:
              - CU010
