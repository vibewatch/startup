        blocks:
          - type: paragraph
            body: >-
              No retained source supplies a comparable standalone NDR revenue pool, forward CAGR, vendor share, or a
              denominator from which to calculate Vectra's TAM, SAM, or SOM. The defensible approach is therefore to
              rank addressability conditions rather than invent market values. The broad opportunity begins with
              organizations exposed to hybrid attack paths, narrows to enterprises that fund a SOC and can feed network
              telemetry, then narrows again to buyers willing to add a specialist behavioral layer. Federal
              organizations form a distinct lane because an independent comparison reports FedRAMP High authorization,
              while the commercial lane remains quote-based and lacks a directly comparable median Vectra contract
              benchmark. A 181% revenue-growth figure from Vectra's 2018 announcement is a historical company claim
              about 2017 performance; it is neither current market growth nor a basis for extrapolating present
              addressable spend.
