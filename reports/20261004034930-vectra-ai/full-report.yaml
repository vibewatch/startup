      - number: '6.2'
        title: Adoption trajectory and production proof
        blocks:
          - type: paragraph
            body: >-
              The available evidence demonstrates use, not a complete growth curve. Vectra AI's August 2026 release says
              the company is trusted by more than 2,000 organizations, while a customer reviewer reports more than three
              years of use in an environment with about 8,000 users. That reviewer describes four to eight weeks of
              initial triage and tuning before value appeared, followed by no more than 10 to 20 events per day and less
              than 1% of activity requiring action. Named references add outcome-level evidence: Gamma says correlated
              network, identity, and cloud context compresses investigation and response, while Blackstone says a
              one-day integration added more than 50 detections. These examples are credible deployment signals, but
              they are not a cohort, and no denominator establishes how representative the outcomes are across the
              installed base.
            claimRefs:
              - CU001
