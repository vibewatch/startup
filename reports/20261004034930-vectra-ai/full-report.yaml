  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence chain moves from commercial signals through stale and conflicting valuation inputs to a
      track/research-more decision.
    data:
      nodes:
        - id: commercial-scale
          label: Reported commercial scale
          detail: Latka reports $120M of 2025 revenue, without audited support in the retained set.
        - id: historical-mark
          label: Historical financing mark
          detail: Independent databases place the 2021 Series F post-money valuation near $1.2B.
        - id: cross-vintage
          label: Cross-vintage diagnostic
          detail: The two reported figures imply about 10.0x, but they are from different periods and revenue is not ARR.
        - id: funding-conflict
          label: Funding totals conflict
          detail: Public totals span $266M to $425M under different coverage conventions.
        - id: liquidity-gap
          label: Current price unavailable
          detail: Forge reports limited activity and no retained last matched price.
        - id: recommendation
          label: Track / research-more
          detail: Require current financial, cap-table, preference, debt, and transaction evidence before investing.
      edges:
        - from: commercial-scale
          to: historical-mark
        - from: historical-mark
          to: cross-vintage
        - from: cross-vintage
          to: funding-conflict
        - from: funding-conflict
          to: liquidity-gap
        - from: liquidity-gap
          to: recommendation
    approximationNotes: The 10.0x diagnostic divides a 2021 valuation by reported 2025 revenue and is not a current market multiple.
    claimRefs:
