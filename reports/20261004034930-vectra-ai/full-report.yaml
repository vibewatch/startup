        title: Identity, product, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Vectra AI presents itself as an AI-native security and observability platform spanning on-premises,
              multi-cloud, identity, SaaS, and AI environments. Its current positioning extends beyond alert generation:
              the product narrative combines observability, threat detection, investigation and response, and posture
              improvement. The company says it began in 2011 and now serves more than 1,700 customers with more than 600
              employees. LeadIQ independently places headquarters in San Jose, California, but the assigned evidence
              does not establish a complete current office list. Scale figures are company-reported and should not be
              treated as audited operating metrics.
