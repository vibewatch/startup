      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by hybrid complexity, tool fragmentation, identity compromise, and AI-enabled attacks
              that cross network, cloud, identity, and SaaS boundaries. Vectra's own material says unified detection is
              replacing single-surface tools, while Channel Insider reports a platform shift toward exposure management,
              response, and value reporting. Those are credible adoption themes but remain partly vendor-framed. The
              clearest constraints come from customer evidence: cost can limit adoption; on-premises deployments require
              capacity design, traffic copies, and packet-broker placement; retention can expand with purchased storage;
              and initial setup may require support and tuning. Channel reporting adds execution risk because proactive
              exposure management was scheduled for phased rollout through 2026. For valuation, the implication is a
              potentially valuable regulated-enterprise niche offset by unknown category size, undisclosed price
              realization, infrastructure friction, and unquantified conversion from product breadth to durable revenue.
