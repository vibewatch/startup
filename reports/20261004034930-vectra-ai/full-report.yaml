  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Register and Investment Implications
        blocks:
          - type: paragraph
            body: >-
              Evaluating Vectra AI's enterprise durability requires disaggregating risk across financial structure,
              commercial positioning, and platform architecture. The most acute exposure is structural valuation
              overhang: having raised $130 million in April 2021 at a post-money valuation of $1.2 billion, Vectra AI
              has not disclosed a subsequent equity round, audited ARR, or cash burn rate in over five years. Without
              demonstrated top-line acceleration or GAAP profitability, private equity holders face substantial multiple
              compression or down-round risk in public markets. Commercially, Vectra AI operates in a category under
              heavy siege from platform consolidators like Microsoft and Palo Alto Networks, which bundle basic NDR
              telemetry into broad enterprise security agreements. Operationally, practitioner feedback underscores
              persistent implementation hurdles, including hardware sensor deployment sizing, high storage costs for
              cloud metadata retention, and recurring alert bursts following software updates that disrupt SOC
              workflows.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
