  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Enterprise Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              The Vectra AI Platform is designed to operate within modern enterprise Security Operations Centers (SOCs)
              as an automated, behavioral detection and response engine. Traditional security perimeters and
              signature-based tools struggle to detect stealthy adversaries who leverage compromised credentials,
              legitimate administrative utilities, and encrypted channels to move laterally across internal subnets.
              Vectra AI addresses this operational blind spot by continuously inspecting raw bidirectional network
              traffic, public cloud control planes (AWS, Microsoft Azure, Google Cloud Platform, Oracle Cloud
              Infrastructure), identity providers (Microsoft Entra ID / Active Directory), and SaaS environments. In
              customer workflow terms, the platform acts as an automated triage analyst: it ingests raw wire data and
              event streams, reconstructs conversations into enriched security metadata, evaluates behavioral anomalies
              against machine learning models, and prioritizes active threats into consolidated incident campaigns. This
              behavioral approach eliminates reliance on static signatures, allowing SOC teams to detect unknown
              adversary tradecraft—such as command-and-control beacons, internal reconnaissance scans, and privilege
              escalation attempts—at machine speed. By triaging millions of raw network interactions into a handful of
              high-fidelity alerts, the platform drastically cuts alert fatigue and compresses incident investigation
              cycles.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE011
              - CE014
      - number: '5.2'
        title: Modular Product Suite and Technical Operating Model
        blocks:
          - type: paragraph
            body: >-
              Vectra AI's product line is structured as a modular suite of capabilities built on a distributed
              collection and centralized analytics architecture. Physical or virtual sensors (formerly deployed under
              the Cognito brand) capture east-west packet traffic via network TAP or SPAN ports in on-premises data
              centers and remote enterprise sites, while native API connectors extract virtual private cloud flow logs,
              identity telemetry, and audit events from cloud providers. The technical operating pipeline follows four
              sequential stages: ingestion, behavioral analytics, signal attribution, and automated response. The
              ingestion pipeline processes multi-trillion-bit traffic scale and billions of sessions per hour,
              transforming raw packets into structured, security-enriched metadata. Rather than storing full packet
              captures or attempting invasive SSL/TLS payload decryption, the system analyzes traffic timing, packet
              sizes, protocol negotiations, and session behaviors. Patented Attack Signal Intelligence correlates
              anomalies between ephemeral IP addresses, Active Directory user accounts, and cloud identity roles.
              Integrations with enterprise SIEM platforms, data lakes, and EDR systems allow security operations teams
              to trigger automated host isolation or identity containment when high-confidence attack behavior is
              detected.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE008
