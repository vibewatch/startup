    notes: "Assessments use only the assigned public sources; recommendation language is analytical and no current equity-value range is inferred."
    claimRefs: [CV002, CV011, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence boundary, What would change the view]
    rows:
      - [Thesis, "Reported revenue scale", "Latka reports $120M of 2025 revenue; the figure is not independently audited in the retained set.", "Audited revenue, ARR definition, growth, margin, and retention would strengthen conviction."]
      - [Thesis, "Historical commercial momentum", "Vectra reported 181% revenue growth and 67% customer growth for 2017.", "Current cohort and renewal evidence is needed because the signal is historical and company-issued."]
      - [Thesis, "Broad platform scope", "Vectra describes coverage spanning enterprise observability, detection, response, and posture.", "Independent win/loss, deployment, and expansion data would validate monetization."]
      - [Anti-thesis, "Financing record conflict", "Retained totals range from $266M to $425M and use different round counts.", "A company-certified cap table and financing ledger would resolve the denominator and senior claims."]
      - [Anti-thesis, "Illiquid and stale valuation evidence", "Forge reports limited activity and the disclosed post-money mark dates to 2021.", "Recent arm's-length transactions with price, volume, rights, and date would improve price discovery."]
    notes: "Company-issued operating and product statements are separated from independent financing databases; unresolved conflicts are not averaged."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV009, CV011, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Current growth and retention validate durable expansion; margins and cash conversion support scaling.", "A premium could be considered only against a verified current revenue base and clean preference stack; no public range is supportable.", "Recent audited growth, strong NRR, and competitive secondary bids.", "Growth deceleration, weak retention, or senior claims absorbing exit value."]
      - [Base, "Revenue scale is real but growth and unit economics remain unverified; liquidity stays limited.", "Demand a material evidence and illiquidity discount to any seller reference; size exposure only after full cap-table review.", "Stable renewals, adequate runway, and a recent arm's-length price.", "No current financial package or a price anchored solely to the 2021 round."]
      - [Bear, "Reported revenue is not recurring or profitable enough, financing needs rise, or preferences are onerous.", "Equity value could be impaired despite enterprise value; preserve capital and decline the transaction.", "Down-round indications, weak cash runway, or widening bid-ask dispersion.", "Debt, liquidation preferences, or operating misses materially subordinate common equity."]
    notes: "Scenarios deliberately avoid unsupported numeric valuation ranges and probabilities; each depends on private diligence not present in the assigned evidence."
    claimRefs: [CV001, CV002, CV010, CV011, CV012, CV013, CV015, CV016]
