evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current GAAP revenue, ARR, growth, gross margin, net retention, cash balance, debt, free cash flow, and burn.
    whyItMatters: Without current operating economics, financing need, durability, and valuation cannot be underwritten.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, ARR bridge, cohort retention, debt schedule, and
      a 24-month cash forecast.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: funding
    missingEvidence: >-
      A current cap table, post-2021 financing history, secondary transactions, valuation evidence, preferences, and
      investor rights.
    whyItMatters: The 2021 post-money valuation is too old to establish current enterprise or common-equity value.
    diligencePath: >-
      Request the fully diluted cap table, charter, financing documents, debt agreements, option ledger, and any
      secondary transaction data.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Original founder attribution, complete executive and board roster, committee assignments, ownership, tenure,
      succession plans, and recent departures.
    whyItMatters: Public biographies show functional breadth but cannot resolve key-person risk or governance control.
    diligencePath: >-
      Review the board book, organizational chart, founder history, employment agreements, equity ledger, and three-year
      executive departure log.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent company-specific evidence on litigation, regulatory matters, outages, breaches, layoffs, complaints,
      or other adverse events.
    whyItMatters: The assigned pool's absence of an adverse record cannot establish that no adverse event occurred.
    diligencePath: >-
      Run legal and regulatory database checks, obtain the litigation schedule, review incident and outage logs, and
      interview customers and former employees.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A current independent standalone NDR revenue pool, CAGR, vendor share, and consistent geographic denominator.
    whyItMatters: Without comparable category values, numeric TAM, SAM, and SOM would overstate precision and distort valuation.
    diligencePath: >-
      Obtain current full-text analyst market-share and forecast research, then reconcile category definitions before
      calculating any addressable value.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Current Vectra price books, realized annual contract values, discounting, retention-cost schedules, and
      segment-level booking mix.
    whyItMatters: >-
      Public reviews establish cost friction but cannot quantify willingness to pay, sales efficiency, or attainable
      market share.
    diligencePath: >-
      Review anonymized contracts, pipeline cohorts, renewal data, and management pricing waterfalls by customer
      segment.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitive-win-loss-rates
    missingEvidence: >-
      Audited head-to-head win/loss rates between Vectra AI and Darktrace or Palo Alto Networks Cortex XSIAM in
      enterprise proof-of-concept evaluations.
    whyItMatters: >-
      Direct win rates would confirm whether Vectra's alert fidelity outweighs Darktrace's autonomous response and Palo
      Alto's consolidation pricing advantages.
    diligencePath: Request anonymized quarterly win-loss reports and displacement metrics from Vectra sales operations.
  - id: gap-pricing-discounts
    type: private-evidence-only
    severity: minor
    topic: discount-schedules
    missingEvidence: >-
      Actual realized contract discounting schedules and average selling price (ASP) concessions against list capacity
      pricing.
    whyItMatters: >-
      Reported spend ranges ($100k-$500k) represent list guidance; enterprise discounts determine true total cost of
      ownership against bundled XDR alternatives.
    diligencePath: Review customer contract exhibits and partner discount tiers under non-disclosure.
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current ARR, GAAP revenue, growth, gross margin, net retention, churn, and product-level revenue mix.
    whyItMatters: These metrics determine revenue quality, operating leverage, and whether historical growth persisted.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, ARR bridges, and retention cohorts through the
      data room.
    relatedQuestionRefs:
      - QI001
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      SKU-level list prices, realized prices, discounts, contract terms, renewal uplifts, and professional-services
      rates.
    whyItMatters: >-
      A single customer's price perception cannot establish pricing power, discount discipline, or recurring revenue
      mechanics.
    diligencePath: Review anonymized contracts, order forms, discount approvals, renewals, and price-realization analysis by segment.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Fully loaded CAC, sales cycle, win rate, quota attainment, channel economics, and CAC payback by customer segment.
    whyItMatters: >-
      The sales-assisted motion may create attractive contract values or a costly acquisition model; public evidence
      cannot distinguish them.
    diligencePath: >-
      Request CRM cohort exports, sales-capacity plans, channel agreements, and finance-reconciled CAC and payback
      schedules.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, runway forecast, debt schedule, cap table, liquidation preferences, and reconciled
      financing history.
    whyItMatters: >-
      Public trackers disagree on capital raised and valuation, while neither financing totals nor secondary marks
      establish cash available to the business.
    diligencePath: >-
      Reconcile the general ledger, bank statements, board-approved forecast, debt documents, and fully diluted cap
      table.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-sdk-availability
    missingEvidence: >-
      Public documentation, code repositories, or package releases for Vectra AI's Model Context Protocol (MCP) server
      implementations and REST API SDKs.
    whyItMatters: >-
      Independent developers and SecOps teams cannot verify the integration overhead or schema maturity of agentic
      workflows without private sales and NDA access.
    diligencePath: >-
      Request Vectra AI API developer documentation, OpenAPI specification files, and sample MCP client/server
      implementations during technical diligence.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: minor
    topic: remote-sensor-hardware-specs
    missingEvidence: >-
      Published appliance sizing guides, bandwidth saturation thresholds, and hardware pricing for remote branch
      sensors.
    whyItMatters: >-
      Distributed enterprises cannot accurately project multi-branch total cost of ownership (TCO) without private
      vendor price lists and hardware capacity models.
    diligencePath: Review vendor hardware pricing sheets and obtain sensor throughput benchmarks under high SSL/TLS connection load.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-and-contracts
    missingEvidence: Current NRR, GRR, logo churn, renewal rate, average contract duration, cohort expansion, and satisfaction data.
    whyItMatters: >-
      Deployment examples cannot establish recurring-revenue durability or whether customer value persists across the
      installed base.
    diligencePath: >-
      Request customer cohorts, renewal schedules, churn reasons, NRR and GRR bridges, contract-duration distributions,
      and satisfaction trends under NDA.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: customer-and-channel-concentration
    missingEvidence: >-
      Top-customer revenue shares, partner-sourced pipeline and revenue, reseller concentration, channel margins, and
      procurement-cycle data.
    whyItMatters: >-
      Exclusive channel reliance may widen distribution while creating concentration, margin, and partner-execution
      exposure.
    diligencePath: >-
      Request top-10 customer and partner revenue schedules, direct-versus-channel bookings, partner attrition, margins,
      and sales-cycle cohorts.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      A complete current customer roster with deployment stage, modules, start date, renewal status, outcomes, and
      contract value.
    whyItMatters: >-
      Three public examples cannot show production prevalence, vertical diversity, outcome distribution, or reference
      selection bias.
    diligencePath: Reconcile CRM and billing exports to a stratified reference sample and validate outcomes directly with customers.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: blocking
    topic: financial-burn-and-arr
    missingEvidence: Audited annual recurring revenue (ARR), GAAP gross margin, operating cash burn rate, and available cash runway.
    whyItMatters: >-
      As a unicorn valued at $1.2B in 2021 without subsequent funding announcements, Vectra AI's solvency, runway, and
      true equity value cannot be determined without private financial statements.
    diligencePath: >-
      Require audited financial statements, historical income statements, and cash flow reports under strict
      non-disclosure agreement.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Current cap table, debt schedule, liquidation preferences, participation, conversion, dividends, anti-dilution
      provisions, and investor rights.
    whyItMatters: Senior claims and conversion economics determine how enterprise value translates into common-equity proceeds.
    diligencePath: >-
      Obtain company-certified capitalization and debt ledgers plus executed financing documents, then model proceeds by
      security class.
    relatedQuestionRefs:
      - QV007
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited or management-certified current revenue, defined ARR, growth, gross margin, net retention, burn, cash,
      debt, and concentration data.
    whyItMatters: >-
      Without current operating and cash data, no defensible valuation range, target return, or financing-need
      assessment can be produced.
    diligencePath: >-
      Request audited statements, monthly management accounts, ARR bridge, cohort retention, cash forecast, debt
      documents, and customer concentration schedules.
    relatedQuestionRefs:
      - QV010
