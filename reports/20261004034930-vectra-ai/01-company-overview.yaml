company:
  name: Vectra AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Vectra AI is a San Jose-based enterprise cybersecurity vendor founded in
    2011, with a current company-reported footprint of 600+ employees, 1,700+
    customers, 468 channel partners, and operations in 113 countries. The last
    primary financing anchor in the assigned evidence is the April 2021
    $130 million round at a $1.2 billion post-money valuation; current revenue,
    valuation, capitalization, and cash metrics remain undisclosed.
sections:
  - id: identity-and-operating-scale
    title: Identity, product, and operating scale
    body: >-
      Vectra AI presents itself as an AI-native security and observability
      platform spanning on-premises, multi-cloud, identity, SaaS, and AI
      environments. Its current positioning extends beyond alert generation:
      the product narrative combines observability, threat detection,
      investigation and response, and posture improvement. The company says it
      began in 2011 and now serves more than 1,700 customers with more than 600
      employees. LeadIQ independently places headquarters in San Jose,
      California, but the assigned evidence does not establish a complete
      current office list. Scale figures are company-reported and should not be
      treated as audited operating metrics.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: capital-and-stage
    title: Capital history and stage assessment
    body: >-
      The strongest financing evidence is historical rather than current.
      Blackstone announced a $130 million growth round on April 29, 2021,
      taking cumulative funding above $350 million at a $1.2 billion post-money
      valuation. LeadIQ reports the more precise but database-derived figure of
      $353 million across nine rounds. These disclosures support a late-stage
      private-company profile, not a current valuation: no assigned source
      provides a later priced round, secondary transaction, debt balance,
      liquidation stack, revenue, ARR, margins, retention, or cash runway.
      Accordingly, the 2021 valuation is a dated transaction marker rather than
      an investable present-day price.
    claimRefs: [CO007, CO008, CO009]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Hitesh Sheth remains the named president and CEO, and the current
      leadership roster covers finance, product, engineering, data science,
      managed detection and response, revenue, technology, legal, people,
      marketing, business operations, and cloud. CFO Don Dixon adds public
      listing and strategic transaction experience, while Martin Roesch adds a
      founder-operator profile through Sourcefire and the 2025 Netography
      acquisition. The breadth reduces single-function dependence, but the
      assigned evidence does not identify Vectra AI's original founders,
      disclose executive ownership, or establish committee composition and
      voting control. CEO continuity and the investor-heavy board therefore
      remain governance diligence priorities.
    claimRefs: [CO010, CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: evolution-and-open-diligence
    title: Platform evolution, distribution, and open diligence
    body: >-
      Recent operating signals point to expansion rather than a narrow
      network-detection posture. Channel Insider describes both a unified
      control model across the hybrid attack lifecycle and an Ascent program
      that gives resellers, integrators, and MSSPs roles in co-selling,
      implementation, managed services, and optimization. That strategy may
      broaden delivery capacity, but phased 2026 exposure-management rollout
      shows that part of the platform narrative was still forward-looking.
      Vectra's own AI-scam guide supplies demand context, not independent proof
      of product efficacy. The pool contains no company-specific adverse source,
      so litigation, outages, breaches, layoffs, and regulatory matters remain
      unresolved rather than presumed absent.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: [FO001]
