company:
  name: Vectra AI
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a sales-assisted enterprise platform with professional-services
    and capacity-expansion opportunities, but it does not expose the operating metrics needed
    to underwrite revenue quality, unit economics, or runway. Third-party funding and valuation
    datasets also disagree materially, so financing history and secondary-market marks should
    not be treated as cash availability or a current equity value.
sections:
  - id: revenue-model-and-gtm
    title: Revenue model and go-to-market
    body: >-
      Vectra presents a multi-surface security platform spanning observability, threat detection
      and response, and posture improvement, but the assigned evidence does not publish SKU-level
      pricing or contract mechanics. The website routes prospects to an expert introduction,
      which is consistent with a sales-assisted enterprise motion rather than self-service
      checkout. It also lists Professional Services, while a customer review describes storage
      duration as dependent on purchased capacity. Together, these signals support a likely mix
      of core platform licensing, module or capacity expansion, and services, but they do not
      establish revenue mix, subscription term, recognition policy, realized price, or discounting.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing and unit-economics evidence
    body: >-
      The strongest public pricing evidence is qualitative and adverse: one customer described
      Vectra as above average in price and not economical, while also calling the pricing
      transparent. That same review says an on-premises deployment requires capacity design and
      reports an initial four-to-eight-week tuning period. These observations suggest that
      customer value depends on environment size, deployment architecture, storage requirements,
      and implementation effort. They do not reveal Vectra's gross margin, support burden,
      services margin, customer acquisition cost, payback, net retention, or contribution margin.
      Management data is therefore required before inferring attractive SaaS economics.
    claimRefs: [CI004, CI005, CI006, CI016]
    tableRefs: [TI002, TI003]
  - id: capital-and-valuation
    title: Capital adequacy and valuation signals
    body: >-
      Historical financing demonstrates access to growth capital, not current liquidity. Vectra
      said its 2018 Series D would fund global sales and marketing plus product development, an
      allocation consistent with a research- and go-to-market-intensive model. Current trackers
      are not reconcilable: Tracxn reports $425 million raised, while Yahoo Finance's Forge data
      reports $352.23 million and Clay reports $352.04 million. Valuation indicators also diverge
      between Tracxn's $1.2 billion figure and Forge's caveated $782.97 million estimate. None of
      those figures discloses cash on hand, debt, burn, runway, or liquidation preferences.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The public record supports category demand and a potentially expandable enterprise model,
      but not an investable financial forecast. Vectra's historical 181% revenue-growth claim is
      from 2017 and cannot proxy for current growth; its 2026 threat research describes cheaper
      attacker tooling, which supports customer urgency but is not evidence of Vectra revenue.
      The assigned sources contain no current ARR, GAAP revenue, gross margin, net retention,
      customer acquisition cost, cash burn, runway, or debt schedule. The financial stance is
      therefore evidence-constrained: revenue quality, margin path, and capital adequacy remain
      material diligence blockers until management supplies audited operating data and current
      financing terms.
    claimRefs: [CI008, CI014, CI015, CI016]
tables:
