    title: Revenue streams and monetization mechanisms
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Core security platform, "Sales-assisted platform license", "Not disclosed", "Platform scope is public; price and term are not", "Potentially recurring but unverified", "Provide ARR by product, contract term, and recognition policy"]
      - [Module expansion, "Additional network, identity, cloud, SaaS, or AI coverage", "Not disclosed", "Multi-surface scope is public; attach rate is not", "Expansion potential is unquantified", "Provide module attach rates, expansion ARR, and churn"]
      - [Storage or capacity, "Purchased retention or deployment capacity", "Capacity and retention period", "One customer tied retained data duration to storage purchased", "Usage-linked expansion signal from one customer", "Provide capacity tiers, realized price, and infrastructure gross margin"]
      - [Professional services, "Implementation and advisory services", "Not disclosed", "Service offering is listed publicly; revenue mix is not", "May support adoption but dilute blended margin", "Provide services revenue, utilization, delivery cost, and services margin"]
    notes: "Mechanisms are bounded by official product surfaces and one customer review; no row states list price, realized revenue, or audited revenue mix."
    claimRefs: [CI001, CI002, CI003, CI004, CI006]
  - id: TI002
    title: Pricing and commercialization evidence
    columns: [Evidence item, Observed value or status, Basis, Confidence, Implication]
    rows:
      - [Public list price, null, "No price appears in the retained official pages", Low, "Cannot benchmark entry price or discounting"]
      - [Sales motion, "Request an expert introduction", "Official website call to action", Medium, "Suggests negotiated enterprise selling"]
      - [Relative price, "Above average and not economical", "Single customer review", Medium, "Potential procurement friction; not a market-wide benchmark"]
      - [Storage economics, "Retention depends on storage purchased", "Single customer review; customer chose one month", Medium, "Capacity can create expansion revenue and customer cost"]
      - [Implementation effort, "Four to eight weeks of initial triage and tuning", "Single on-premises customer review", Medium, "Time-to-value and service cost may vary by architecture"]
    notes: "Null means the assigned evidence does not disclose a value; customer observations are directional and are not representative pricing statistics."
    claimRefs: [CI002, CI004, CI005, CI006]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - [Current ARR, null, Low, "Defines recurring scale and growth base", "Provide monthly ARR bridge by product and geography"]
      - [Current GAAP revenue and growth, null, Low, "Separates billed recurring value from recognized revenue", "Provide audited revenue and quarterly growth"]
      - [Gross margin, null, Low, "Tests hosting, appliance, support, and services burden", "Provide gross margin by software, appliance, and services"]
      - [Net retention and churn, null, Low, "Tests expansion quality and durability", "Provide logo and dollar retention cohorts"]
      - [CAC and payback, null, Low, "Tests efficiency of the sales-assisted motion", "Provide fully loaded CAC, sales cycle, and payback by segment"]
      - ["Cash, burn, and runway", null, Low, "Determines financing dependency and next-round timing", "Provide bank statements, monthly burn, forecast, and minimum-cash covenant"]
      - [Debt and preference stack, null, Low, "Determines claims ahead of common equity", "Provide debt schedule, cap table, liquidation preferences, and investor rights"]
    notes: "All nulls are evidence gaps rather than zero values; funding raised and private-market valuation estimates are not substitutes for operating metrics or cash availability."
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI016]
