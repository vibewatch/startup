  - id: TP001
    title: 企业威胁检测与响应竞品格局
    columns:
      - 竞品 / 解决方案
      - 主要类别
      - 架构与传感器模型
      - 核心差异化优势
      - 架构局限性
    rows:
      - - Vectra AI 平台
        - NDR / ITDR 专精厂商
        - 物理/虚拟传感器 + 云端 API 连接器 + Attack Signal Intelligence
        - 映射至 ATT&CK 的行为模型、高告警保真度、深度 Microsoft 365/Azure AD 关联分析
        - 缺乏原生自动化遏制能力；依赖外部 EDR/SOAR 进行阻断
      - - Darktrace (EIS & Antigena)
        - NDR 与自主防御
        - 网络探针 + 云端/SaaS 连接器 + Enterprise Immune System
        - 自学习异常基线；借由 Antigena 实现毫秒级自主遏制
        - 告警量较大需持续调优；模块化授权显著推高成本
      - - Palo Alto Networks Cortex XSIAM
        - 整合型 SecOps / XDR
        - 端点代理 + 网络防火墙 + 集中式云端数据湖
        - 统一企业遥测、原生 XSOAR 编排、集成数字取证
        - 附加组件可能推高整体成本；对 Palo Alto 生态存在较强的平台锁定效应
      - - 云原生日志服务 (AWS/Azure)
        - 云基础设施厂商
        - VPC Flow Logs、GuardDuty、CloudTrail 及 Defender for Cloud 等原生日志
        - 零传感器硬件、顺畅的云原生启用、低门槛切入成本
        - 缺乏跨云实体关联分析、本地部署可见性及深度横向威胁建模
    notes: 数据综合自 Decryption Digest 架构对比（2026 年）、PeerSpot 用户评价（2026 年）及厂商技术文档。
