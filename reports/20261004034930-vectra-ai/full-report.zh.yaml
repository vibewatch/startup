  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品分析
        blocks:
          - type: paragraph
            body: >-
              该公司的狭义市场边界属于网络检测与响应（NDR）：即通过监听物理网络及云端 VPC 镜像中的数据包或流记录，捕捉终端探针无法觉察的异常行为。Vectra
              虽将核心能力延伸至身份、云端、SaaS、威胁调查、应急响应及安全态势优化，但不应将这些延伸领域视作其全盘可吞吐的网安支出。EDR、SIEM、防火墙、IPS 及人工 SOC
              分析依然是替代品或互补品，而非自然转化的软件预算。有客户反馈认为传统安全防线较为被动，而 Vectra 构成了额外的主动防御层；这说明 Vectra 已嵌入运维工作流，但不足以证明 Vectra
              能吃下所有既有预算。渠道报道亦将混合环境的碎片化列为主要运营难题，因此其最为可靠的目标客群边界，是对跨域行为可见性有硬性需求的大型复杂企业，而非全部网络安全软件市场。
