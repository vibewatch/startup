      - number: '3.2'
        title: 检测理念、响应模式与产品差异化
        blocks:
          - type: paragraph
            body: >-
              各类威胁检测架构的分野，核心在于对告警量控制与响应自动化理念的不同取舍 CP002。Vectra AI 的 Attack Signal Intelligence
              以压缩无效告警和提升分析师效率为先，将告警严重度与确定性融合成“紧急度评分”（Urgency Score），把跨主机与跨账号的多阶段攻击链条归纳聚合 CP005。独立架构分析表明，Vectra
              将特定网络异动——包括 Kerberoasting、DCSync、NTLM 中继（NTLM relay）及命令与控制（C2）心跳信标——映射到 MITRE ATT&CK 战术中，实现了可审计的防御覆盖
              CP003, CP005。反观 Darktrace，其以异常检测为核心的思路固然能捕获未建模的 0day 偏差，但往往伴随较高的告警量，需耗费人力反复调优 CP006。在威胁处置上，Darktrace 依靠内置的
              Antigena 实现原生自主遏制，无需人工介入即可在毫秒级切断网络连接或隔离设备 CP010。Vectra AI 则刻意回避了原生自主阻断，转向与第三方 EDR、防火墙及 SOAR 系统联动编排，对接
              CrowdStrike Falcon、SentinelOne 以及 Palo Alto Networks XSOAR 等工具 CP011。这套方案照顾了大型企业的既有变更管理流程，却也意味着缺乏成熟 SOAR
              建设的企业必须跨厂商拼凑编排，方能匹敌机器级的遏制时效 CP010, CP011。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
              - CP011
      - number: '3.3'
        title: 生态锁定效应、定价机制与护城河壁垒
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 的核心竞争壁垒建立在与 Microsoft 生态的深度打通、企业级混合云探针的伸缩能力，以及专业渠道伙伴体系之上 CP007, CP012。通过关联 Azure Active
              Directory（现更名为 Entra ID）、Microsoft 365、AWS VPC Flow Logs 以及本地核心网络汇聚点的遥测数据，Vectra 能够呈现贯穿网络与身份领域的统一实体时间线
              CP007。然而，大企业的集约化采购趋势带来了不容忽视的商业替代风险。PeerSpot 上的评测反馈反映出 Vectra AI 定价偏高，用户特别指责其软件授权模式陈旧且附加模块层层加价
              CP009。横向定价对比显示，中型企业采购 Vectra AI 的年费支出在 $100,000 到 $500,000 之间；若计入邮件、OT 及 SaaS 等模块加价，该区间与 Darktrace 的
              $100,000 到 $600,000 年费区间大致相当 CP012。此外，Palo Alto Networks、Microsoft 与 Cisco 等巨头力推平台整合，企业采购在权衡单独采购 NDR
              授权成本与大型综合安全协议时，也会对单点产品形成持续的压价动力 CP008, CP009。Vectra 则靠扩大渠道分销守住份额，利用全球 Ascent 合作伙伴计划及专项销售资源，在全球各地大力拓展 MSP 与
              MSSP 合作矩阵 CP013, CP014。
