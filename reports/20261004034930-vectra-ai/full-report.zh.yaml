      - number: '5.4'
        title: 部署取舍、基础设施约束与技术局限
        blocks:
          - type: paragraph
            body: >-
              尽管 Vectra AI
              的无代理（Agentless）架构避免了主机端性能损耗，但在企业级部署中依然带来了显著的运维权衡与硬件门槛。第三方运维评估及企业实际落地反馈直指几大长期技术痛点：首先，在分支机构密布的高分布式企业网中铺设硬件探针，会耗费大笔资金与带宽预算；一旦网络吞吐骤增，偏远分支的小型探针容易触碰上行链路带宽上限。其次，尽管借助云端
              API 授权可以秒级接入云租户，但本地探针的规格选型、物理分流端口（TAP）敷设以及初始基线训练，通常需要 4 到 8
              周的细致微调，才能把合规运维工具和安全扫描器带来的误报噪音清理干净。再次，一线安全人员反映其自带的控制台报表相对简陋僵化，时间维度的自由度较低，满足审计合规需求的原生数据导出能力受限。最后，技术人员指出，核心版本大更新偶尔会引发短期的告警噪音激增，底层模型在新环境下重新建立基准时，需要运维人员格外耗费精力盯防。
            claimRefs:
              - CE013
