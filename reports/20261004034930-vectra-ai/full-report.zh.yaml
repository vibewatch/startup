              所需的分母。因此，更具说服力的做法是梳理潜在客群的准入层级，而非凭空捏造市场规模。最广义的受众涵盖面临混合攻击敞口的企业；向下收窄至自建 SOC
              且具备网络遥测接入能力的企业；再进一步筛选出愿为专业行为检测层买单的客户。联邦政府机构属于独立分支，第三方比对材料指其已通过 FedRAMP High 认证；商业市场则均属按需报价，缺少可直接参照的 Vectra
              合同金额中位数。Vectra 曾在 2018 年官方披露过 181% 的收入增幅，但这仅是针对 2017 年业绩的历史公司口径，绝非当前行业增速，亦不能用来线性推断当下的可触达支出。
