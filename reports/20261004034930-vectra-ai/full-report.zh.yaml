  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观情景
        - 当前增长与留存印证了可持续扩张；利润率与现金转化支撑规模化发展。
        - 只有在当前收入基数经过验证且优先股堆叠清晰的前提下才可考虑溢价；无公开区间能够提供支撑。
        - 近期经审计的增速、强劲的 NRR 以及具备竞争力的老股买方报价。
        - 增速放缓、留存疲软，或优先求偿主张吸干退出价值。
      - - 基准情景
        - 收入规模真实，但增长与单位经济模型仍未获验证；流动性依旧受限。
        - 对比任何卖方参考价，均需索取实质性的证据不足与流动性折扣；仅在全面审查股权结构表后再确定敞口规模。
        - 稳定的续约、充足的现金跑道以及近期的公允交易价格。
        - 缺少当前完整的财务数据包，或价格完全锚定 2021 年轮次。
      - - 悲观情景
        - 据报道的收入经常性不足或盈利能力欠佳，融资需求上升，或清算优先权过于苛刻。
        - 尽管企业价值犹存，股权价值仍可能受损；应保留资金并拒绝该笔交易。
        - 出现下调轮迹象、现金跑道告急，或买卖价差进一步扩大。
        - 负债、清算优先权或经营脱靶，实质性压缩普通股求偿顺位。
    notes: 各情景刻意避免未经支撑的数值化估值区间与概率；每种情景均取决于指定证据中未包含的非公开尽调。
    claimRefs:
      - CV001
      - CV002
      - CV010
      - CV011
