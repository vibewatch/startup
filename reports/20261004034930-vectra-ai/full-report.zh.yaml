  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 证据链从商业化信号出发，穿过陈旧且相互冲突的估值数据，最终导向“观察 / 继续研究”决策。
    data:
      nodes:
        - id: commercial-scale
          label: 据报道商业化规模
          detail: 据 Latka 报道，2025 年收入为 $120M，但留存资料中缺乏审计支持。
        - id: historical-mark
          label: 历史融资估值标记
          detail: 独立数据库将 2021 年 Series F 轮投后估值定在约 $1.2B。
        - id: cross-vintage
          label: 跨期比对诊断
          detail: 两项报道数据推导出的倍数约为 10.0x，但二者分属不同时期，且收入不等同于 ARR。
        - id: funding-conflict
          label: 融资总额数据冲突
          detail: 因统计口径不同，公开累计融资总额介于 $266M 至 $425M 之间。
        - id: liquidity-gap
          label: 当前价格缺失
          detail: Forge 报告称交易活跃度有限，且未留存最新撮合价格。
        - id: recommendation
          label: 观察 / 继续研究
          detail: 投资前须获取最新的财务、股权结构表、优先权、债务及交易证据。
      edges:
        - from: commercial-scale
          to: historical-mark
        - from: historical-mark
          to: cross-vintage
        - from: cross-vintage
          to: funding-conflict
        - from: funding-conflict
          to: liquidity-gap
        - from: liquidity-gap
          to: recommendation
    approximationNotes: 该 10.0x 诊断指标系以 2021 年估值除以报道的 2025 年收入计算得出，并非当前市场倍数。
