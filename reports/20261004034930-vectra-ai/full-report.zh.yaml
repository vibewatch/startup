  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与底层技术架构分野
        blocks:
          - type: paragraph
            body: >-
              企业级威胁检测赛道涵盖专业网络检测与响应（NDR）厂商、综合扩展检测与响应（XDR）套件、安全信息与事件管理（SIEM）数据平台以及云巨头原生日志体系 CP001。在纯 NDR 核心领域，Vectra AI 与
              Darktrace 代表了两种主流但截然不同的底层架构理念 CP002。Vectra AI 依托物理及虚拟网络探针、云端 API 连接器以及 Attack Signal Intelligence
              引擎，将监测到的网络异动直接映射到 MITRE ATT&CK 战术技术矩阵 CP003, CP005。相比之下，Darktrace 的 Enterprise Immune System
              侧重为实体行为建立基线模型，标记任何统计学层面的偏差，而非借助特定攻击技法模型进行过滤 CP004, CP006。在专用 NDR 之外，大型企业客户在评估时也频频将 Vectra AI 与 Palo Alto
              Networks Cortex XSIAM 等一体化安全运维套件相比较 CP007。在 PeerSpot 买家评测中，Cortex XSIAM 在 AI 驱动网安平台中排名第 8，Vectra AI 位居第
              7；评测者认可 Vectra 在东西向网络流量检测及降低误报率上的表现，同时也敦促其改善 SIEM 集成度与部署灵活性 CP008, CP009。
            claimRefs:
