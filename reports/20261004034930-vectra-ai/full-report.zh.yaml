      - number: '5.2'
        title: 模块化产品套件与技术运行模式
        blocks:
          - type: paragraph
            body: >-
              Vectra AI 的产品体系由模块化套件构成，建立在“分布式采集、集中式分析”的基础架构之上。部署在本地数据中心及远端企业分支的物理或虚拟探针（过往归于 Cognito 品牌），借助网络 TAP 或 SPAN
              端口采集东西向数据包流量；原生 API 连接器则负责从主流云厂商抽取 VPC
              流日志、身份遥测数据及审计日志。其核心技术流水线严格遵循四个前后相继的步骤：数据接入、行为分析、信号归因以及自动化响应。数据接入层每小时可支撑数万亿比特流量及数十亿会话的处理，将底层原始数据包解析为结构化的安全增强元数据。系统并未留存全量数据包（PCAP），也未试图进行侵入式的
              SSL/TLS 报文解密，而是针对流量传输时延、包体大小、协议交互与会话行为特征展开分析。获得专利认可的 Attack Signal Intelligence 能对动态分配的 IP 地址、Active
              Directory 域账号以及云端身份角色之间的异常关联建档。与企业级 SIEM 平台、数据湖及 EDR 系统的互通，让安全运营人员在侦测到高置信度恶意行为时，能够瞬时发起自动化的主机隔离或身份权限封锁。
            claimRefs:
