            title: 累计融资总额无法在公开渠道对齐
            body: 现有信源给出了四种互不一致的累计融资金额，因此不能单凭某一个数据库的记录，来推断其过往筹资规模或潜在的清算优先权负担。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
