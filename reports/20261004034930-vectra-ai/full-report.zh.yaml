              Vectra AI 将自身定位为横跨本地部署、多云、身份、SaaS 与 AI 环境的 AI
              原生安全及可观测性平台。其当前业务重心已超越单纯的告警生成：产品叙事整合了可观测性、威胁检测、调查与响应以及安全态势改进。公司自述成立于 2011 年，目前拥有超过 600 名员工，服务客户逾 1,700
              家。第三方数据机构 LeadIQ 显示其总部设在加利福尼亚州 San Jose，但手头证据无法还原完整的现存办事处分布。相关规模数据皆为公司口径，不应直接视作经审计的运营指标。
