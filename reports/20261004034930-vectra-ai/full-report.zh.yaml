  - id: FE001
    title: Vectra AI 平台架构与数据流流水线
    type: stack
    summary: 六层架构处理栈，涵盖数据包捕获、云连接器、元数据扩充、AI 行为检测、智能体 API 接口以及下游自动化响应。
    data:
      layers:
        - label: 第 1 层：本地线缆流量摄取
          detail: 通过物理与虚拟 SPAN/TAP 探针进行被动数据包捕获，聚合吞吐可达数万亿比特量级。
          modules:
            - label: 物理网络探针
              detail: 捕获数据中心东西向原始数据包的高吞吐硬件设备。
            - label: 虚拟分支探针
              detail: 捕获分布式企业分支子网流量的轻量级探针。
        - label: 第 2 层：云与身份事件流传输
          detail: 横跨多云控制平面、SaaS 租户及身份提供商的无 Agent API 数据摄取。
          modules:
            - label: 云 VPC 连接器
              detail: 来自 AWS、Azure、GCP 及 OCI 环境的无 Agent 遥测数据流。
            - label: 身份审计日志传输器
              detail: 实时摄取来自 Microsoft Entra ID 的身份验证与目录事件。
        - label: 第 3 层：元数据提取与会话扩充
          detail: 在不对载荷解密的情况下提取行为元数据的规范化与协议解析。
          modules:
            - label: 会话规范化引擎
              detail: 每小时将数十亿个会话处理为结构化网络流元数据。
            - label: Cognito Recall 存储库
              detail: 存储协议元数据（TLS 握手、DNS、Kerberos）供威胁搜寻使用。
        - label: 第 4 层：行为检测与攻击信号情报
          detail: 机器学习算法与 35+ 项专利模型，覆盖 >90% 的 MITRE ATT&CK 技术。
          modules:
            - label: 行为分析引擎
              detail: 评估横向移动、C2 以及权限提升的异常向量。
            - label: 实体关联与优先级排序
              detail: 追踪攻击者在变动的 IP 地址和身份账户间的渗透进展。
        - label: 第 5 层：开发者与智能体 AI 接口层
          detail: 提供 REST API 与 Model Context Protocol（MCP）服务端点，支持自动化 AI 智能体交互。
          modules:
            - label: 企业级 REST API 平台
              detail: 基于 Python 与 PostgreSQL 后端构建、具备 OpenAPI/Swagger 文档的服务。
            - label: Model Context Protocol (MCP) 服务器
              detail: 安全地向外部大语言模型与智能体工作流开放安全上下文与分析发现。
        - label: 第 6 层：可执行信号与生态响应
          detail: 自动化告警分诊、360 Response 遏制以及下游 SOAR/EDR 集成。
          modules:
            - label: 360 Response 引擎
              detail: 横跨身份与网络边界执行自动化遏制。
            - label: 生态系统集成
              detail: 借助 SIEM、EDR 和 SOAR 工具实现双向告警与主机隔离。
    approximationNotes: 展示源自 Vectra 技术文档与工程规范的概念性企业架构。
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE011
  - id: FU001
    title: 客户采用与增购路径
    type: journey-map
    summary: 基于所留存信源整理的客户路径：从混合可见性需求出发，历经部署、调优、日常运营、模块增购，直至合作伙伴主导的服务。
    data:
      items:
        - label: 识别可见性盲区
          stage: 需求
          persona: CISO / SOC leader
          touchpoints:
            - 网络与身份行为
            - 混合攻击面
          experience: The buyer seeks context after preventive controls miss post-compromise behavior.
        - label: 验证适配度
          stage: 评估
          persona: Security architect
          touchpoints:
            - 技术验证
            - 集成规划
          experience: Public references show integration outcomes, but procurement duration is not disclosed.
        - label: 部署与调优
          stage: 实施
          persona: SOC and network engineer
          touchpoints:
            - 本地部署或云端部署
            - 单条用户评价提及需经历四至八周调优
          experience: Environment-specific triage precedes steady-state value in the attributable review.
        - label: 运行检测流程
          stage: 采用
          persona: SOC analyst
          touchpoints:
            - 调查上下文
            - 流量可见性告警
          experience: Named and attributable users report workflow and alert-volume benefits.
        - label: 扩大防御面
          stage: 增购
          persona: Cloud and identity security owner
          touchpoints:
            - Microsoft 365 与 Azure AD
            - 智能体 SOC 工作流
          experience: Module breadth creates expansion paths, but no attach-rate denominator is public.
        - label: 引入伙伴服务
          stage: 规模化
          persona: MSSP / channel partner
          touchpoints:
            - 联合交付
            - SIEM 与自动化集成
          experience: Ascent and Exabeam illustrate service and integration loops without revenue-mix disclosure.
    approximationNotes: 该顺序路径基于公开产品、客户、评价及合作伙伴证据分析综合而成；并非经实测的转化漏斗。
