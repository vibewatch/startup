  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与企业工作流集成
        blocks:
          - type: paragraph
            body: >-
              Vectra AI Platform
              面向现代企业安全运营中心（SOC），定位于自动化行为检测与响应引擎。传统的网络边界及基于特征签名的工具很难揪出隐蔽的攻击者——后者通常利用失窃凭据、合法系统管理工具并通过加密通道在内网子网间横向移动。Vectra
              AI 专为解决这一盲区而生，持续监听双向原始网络流量、公有云控制平面（AWS、Microsoft Azure、Google Cloud Platform、Oracle Cloud
              Infrastructure）、身份提供商（Microsoft Entra ID / Active Directory）及 SaaS
              环境。在客户的实际工作流中，该平台充当了自动化分诊分析师的角色：摄取原始线缆数据与事件流，将通信会话重构为富安全元数据，依托机器学习模型评估行为异动，并将活跃威胁聚合并按优先级梳理成完整的攻击事件链（campaigns）。这种行为分析机制摆脱了对静态特征码的依赖，让
              SOC 团队能以机器级的响应速度识别未知的攻击战术——如 C2 回连信标、内网探测扫描和提权尝试。通过把数以百万计的底层网络交互提炼为少数高置信度告警，平台有效缓解了告警疲劳，大幅压降了事件调查处置周期。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
