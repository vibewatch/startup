              - CV015
              - CV016
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正面投资逻辑主要建立在运营和产品侧信号上，而非坚实的估值依据。据 Latka 报道，其 2025 年收入达 $120M；Vectra 历史公告亦曾披露 2017 年实现 181% 的营收增幅与 67%
              的企业客户数增幅。公司官网现将平台定位于打通本地、多云、身份及应急响应全链路，其官方 AI
              诈骗态势研判亦描述了一个庞大且仍在蔓延的欺诈威胁环境。这些属于支撑市场需求与业务广度的指标，但大多属于企业单方口径或未经独立第三方审计。估值证据让反向逻辑更站得住脚：在现有公开证据中，当下的收入质量、实际增速、利润率水平、客户留存、现金消耗速度、负债状况以及客户集中度通通缺位，而累计融资额在各家数据库中的估算值在
              $266M 到 $425M 之间宽幅震荡。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: 估值框架与情景分析
        blocks:
          - type: paragraph
            body: >-
              拿 Latka 报道中 2021 年的 $1.2B 估值除以其披露的 2025 年 $120M 营收，得出的粗算倍数约为
              10.0x。但这绝非具备实操意义的交易倍数：分子与分母取自截然不同的年份，收入口径未注明是否为
              ARR，当下的净债务与优先清算权诉求更是一无所知。这一粗略算式仅能作为辅助诊断工具，反衬出关键依据的匮乏。因此，乐观、基准与悲观情景分析更适合依据可观察的验证条件展开，而非生硬编造估值区间。乐观情景成立的前提是拿到当下稳健增长与客户留存的确凿证据；基准情景要求针对陈旧输入变量提供充足的价格安全边际；悲观情景则可能由增速停滞、流动性受损或优先股与债务堆叠重压所诱发。
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 尽调核心事项与退出成熟度评估
        blocks:
          - type: paragraph
            body: >-
              最具决定性的工作必须结合具体的交易方案推进。首要任务是调取经审计或管理层签署认定的 2025 年度及过去 12 个月（TTM）收入，核实有合同明确界定的
              ARR、毛利率、净留存率、现金消耗、账面现金、负债以及客户集中度。梳理股权结构表，理清公开渠道四种截然冲突的累计融资金额；逐一审查各轮优先股在清算优先权、参与分配权、股息率、转股权、受偿顺序、反稀释以及投资人特殊权利上的具体条款。索要最近一期的
              409A 估值报告、带有明确日期与交易量的老股挂牌交易意向，以及支撑 2026
              年业务规划的董事会纪要。在经审计的财报、健全的治理架构、可预测的稳健增长以及清晰的流动性兑现通路完全显现之前，其退出成熟度应被视作尚未得到证实。估值倒挂（down-round）、留存率滑坡或严重的优先受偿堆叠，都将直接打破当前的“观察”逻辑。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 附注展例
        blocks:
          - type: callout
            title: 价格敏感型尽调结论
            body: 对 Vectra AI 维持“观察”评级，切勿把 2021 年的独角兽估值当作当前的入场价格；在进行投资回报测算前，必须获取针对具体交易的详尽底层凭证。
            calloutType: recommendation
            claimRefs:
