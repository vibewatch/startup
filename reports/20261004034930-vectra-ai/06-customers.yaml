company:
  name: "Vectra AI"
chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence supports real enterprise adoption: Vectra AI says it serves more than 2,000 organizations, and named or attributable users describe deployed integrations, multi-year use, and measurable SOC workflow benefits. The durability case remains incomplete because no retained source discloses NRR, GRR, churn, contract length, customer concentration, or channel-level revenue mix."
sections:
  - id: "customer-segments-and-buyers"
    title: "Customer segments, buyers, and security jobs"
    body: >-
      Vectra AI addresses enterprise security teams that need behavioral visibility across
      network, identity, cloud, SaaS, and AI environments. Public proof points place CISOs
      and security-operations leaders around the buying decision, with SOC analysts,
      threat hunters, and security engineers as daily users. The company says more than
      2,000 organizations use its platform, but that figure does not disclose paying
      status, segment mix, geography, or revenue contribution. Evidence in this pool is
      strongest for large and technically complex organizations: Gamma discusses
      cross-domain investigation, Blackstone describes a rapid integration, and an
      anonymous reviewer describes an 8,000-user environment. MSSPs and integration
      partners form a second route to users, while Vectra AI Pro adds build-your-own,
      embedded-agent, and expert-assisted adoption paths. No public source resolves who
      pays in partner-delivered deployments or how end-customer economics are shared.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU012"
      - "CU015"
    tableRefs:
      - "TU001"
  - id: "adoption-and-production-proof"
    title: "Adoption trajectory and production proof"
    body: >-
      The available evidence demonstrates use, not a complete growth curve. Vectra AI's
      August 2026 release says the company is trusted by more than 2,000 organizations,
      while a customer reviewer reports more than three years of use in an environment
      with about 8,000 users. That reviewer describes four to eight weeks of initial
      triage and tuning before value appeared, followed by no more than 10 to 20 events
      per day and less than 1% of activity requiring action. Named references add
      outcome-level evidence: Gamma says correlated network, identity, and cloud context
      compresses investigation and response, while Blackstone says a one-day integration
      added more than 50 detections. These examples are credible deployment signals, but
      they are not a cohort, and no denominator establishes how representative the
      outcomes are across the installed base.
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-friction"
    title: "Durability signals and customer friction"
    body: >-
      Multi-year use and product expansion are positive durability signals, but neither
      substitutes for retention data. The anonymous reviewer describes more than three
      years of use, an on-premises deployment, planned acquisition of Microsoft 365 and
      Azure AD coverage, and participation in a PaaS visibility beta. The same account
      reports meaningful friction: initial tuning takes four to eight weeks, Cognito
      Detect reporting is too limited for customized host reports without manual work,
      and pricing is above average. Those drawbacks matter because implementation effort
      and premium pricing can affect renewal and expansion even when detection quality is
      valued. The retained evidence contains no NRR, GRR, logo churn, renewal rate,
      contract duration, satisfaction trend, or support-service-level data. Customer
      durability therefore remains a material diligence gap rather than a quantified
      strength.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU016"
  - id: "expansion-and-channel-dependence"
    title: "Expansion loops and channel dependence"
    body: >-
      Expansion appears to combine product breadth, continuous releases, integrations,
      and partner-delivered services. The 9.14 release states that connected Remote
      Support customers received algorithm improvements through the update service and
      that Traffic Visibility Drop Alerting had completed rollout to all customers.
      Exabeam supplies an adjacent SIEM and automation path by ingesting Vectra detections
      and correlating them with user, host, and cloud activity. At the route-to-market
      layer, Channel Insider reports that Vectra works exclusively with channel partners,
      while partner coverage and marketing materials emphasize MSSP and channel-team
      collaboration. These mechanisms can widen implementation and managed-service
      coverage, but public sources provide no partner-sourced revenue share, reseller
      concentration, attach rate, procurement cycle, or expansion-rate denominator. The
      channel is therefore both a distribution asset and an unquantified dependency.
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
