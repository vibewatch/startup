callouts:
  - calloutType: "risk"
    title: "Structural Overhang: The 2021 Unicorn Benchmark"
    body: "Vectra AI's $1.2 billion post-money valuation established in April 2021 represents a significant capital structure overhang. In the absence of published ARR, revenue growth, or margin disclosure, private investors face severe multiple compression risks if public enterprise software multiples do not support a $1.2B enterprise value at exit."
    claimRefs:
      - "CR001"
      - "CR015"
  - calloutType: "insight"
    title: "Operational Mitigation: Overcoming Upgrade Noise via Tuning"
    body: "While enterprise practitioners report that software updates can trigger brief bursts of noise as machine learning algorithms recalibrate, the platform's core behavioral detection eliminates up to 99% of ambient noise during steady-state operations, demonstrating high long-term operational resilience once baseline tuning is complete."
    claimRefs:
      - "CR004"
      - "CR010"
