  - id: TM004
    title: "Growth Drivers and Constraints Table"
    columns:
      - Driver / constraint
      - Direction
      - Evidence
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - CSRD and post-omnibus reporting pressure
        - Positive but narrower than before
        - Direct scope narrowed materially, but reporting expectations persist for many large companies and their suppliers
        - Current / 2026 onward
        - Supports demand, but shrinks the directly forced universe
        - What share of EcoVadis pipeline comes from voluntary versus mandatory reporting buyers?
      - - Final CSDDD and value-chain due diligence
        - Positive
        - Due-diligence duties remain for very large firms and preserve value-chain risk management needs
        - Medium term through 2029
        - Supports human-rights and supplier-risk workflows
        - How much demand is concentrated in the very-large-company tier now left in scope?
      - - California SB 253 and SB 261
        - Positive
        - Emissions disclosure and climate-risk reporting widen budget ownership beyond procurement alone
        - Current / 2026 onward
        - Supports carbon-data and disclosure integration use cases
        - What share of demand is U.S.-state-led rather than EU-led?
      - - UFLPA and modern-slavery compliance
        - Positive
        - Import and supply-chain transparency rules keep traceability and supplier screening high on the agenda
        - Current
        - Supports supplier due-diligence and evidence workflows
        - How often do customers buy these features standalone versus bundled with ratings?
      - - Scope 3 liability and ROI pressure
        - Positive
        - Unmanaged Scope 3 can create large liabilities while supplier engagement can improve returns
        - Current / 2030 horizon
        - Strengthens CFO-level sponsorship for data collection and engagement
        - Are measured customer ROI cases broad or concentrated in a few advanced accounts?
      - - Supplier data quality and coverage gaps
        - Negative
        - 30% of suppliers still report no emissions data and visibility beyond Tier 1 remains weak
        - Current
        - Slows activation and reduces immediate monetization of advanced modules
        - What proportion of deals stall because suppliers cannot provide usable data?
      - - Assurance and audit bottlenecks
        - Negative
        - SB 253 phases in assurance while market commentary points to verifier scarcity and higher costs
        - 2026-2030
        - Raises implementation friction and may delay customer rollouts
        - Does EcoVadis mitigate auditor bottlenecks through workflow design or partners?
      - - ESG ratings regulation and methodology scrutiny
        - Negative / trust-positive long term
        - Providers face authorization, governance, and methodology transparency burdens
        - 2026 onward
        - Improves category legitimacy over time but adds near-term compliance cost
        - What cost, timeline, and product changes are required for EcoVadis to comply fully?
    notes: Direction reflects market impact, not legal desirability; several rows strengthen demand while simultaneously increasing implementation friction or vendor-side compliance cost.
