  - id: buyers-users-payers-and-adoption-path
    title: "Buyer, User, Payer, Budget Owner, and Adoption Path"
    body: >-
      The buyer map is broader than procurement alone, but procurement still appears to be the operational center of gravity. EcoVadis' 2026 Barometer explicitly frames sustainable procurement as an operating system that embeds supplier ESG intelligence into sourcing and supplier relationship decisions, and it says 98% of surveyed companies have already started embedding ESG data into procurement processes. That evidence makes procurement the most consistent day-to-day user and workflow owner. The same materials also show why procurement rarely acts alone. The buyer sample includes large multinationals with a high share of C-suite respondents, and the beyond-compliance reporting survey includes heads of sustainability, compliance, CFOs, CIOs, supply-chain, and human-rights functions. Reporting data is already being used in operational planning, financial planning, and supply-chain risk assessment, which implies that finance, risk, sustainability, and compliance teams become sponsors or co-owners once the use case expands beyond supplier scorecards into carbon, reporting, or transition-risk workflows.

      The payer and budget path therefore depends on the trigger. If the trigger is sourcing resilience or supplier-performance management, budget ownership can sit in procurement transformation, SRM, or category leadership. If the trigger is SB 253, CSRD, or Scope 3 readiness, the sponsor broadens to sustainability, controllership, disclosure, internal audit, or CFO-sponsored risk programs because assurance, reporting architecture, and financial-planning consequences enter the buying process. If the trigger is SB 261 or sustainable-finance readiness, climate-risk and reporting teams become more visible even though the product still depends on supplier data collection.

      The adoption path is also sequential rather than instantaneous. Buyers first identify a regulatory, resilience, or customer-pressure problem; then they map suppliers and data gaps; then they layer ratings, carbon, and due-diligence tooling into sourcing and reporting workflows; and only after that do they move into supplier improvement, incentives, and financing linkages. The Barometer's move away from SAQs and toward ratings, training, joint innovation, and product-level carbon data shows that the winning vendors are not just databases. They are workflow systems that connect procurement decisions to finance, disclosure, and supplier action.
