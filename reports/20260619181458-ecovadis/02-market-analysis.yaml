  evidenceGaps:
    - type: missing-source
      severity: material
      topic: som-gap
      missingEvidence: Public paid-account counts, module attach rates, and segment-specific ARR by ratings, risk, carbon, and reporting workflows.
      whyItMatters: Without these figures, the chapter cannot convert workflow evidence into a defendable SOM or revenue-pool estimate.
      diligencePath: Request management materials, product pricing sheets, and segment mix from EcoVadis or investors.
      relatedQuestionRefs: [QM023, QM024]
    - type: conflicting-data
      severity: material
      topic: omnibus-scope
      missingEvidence: A single authoritative count of how many companies remain directly in scope after the final omnibus package.
      whyItMatters: Proposal-stage and final-agreement summaries preserve 80% versus 90% reduction language, which materially affects any regulation-led sizing story.
      diligencePath: Pull the final directive text, EU Council implementation notes, and specialist legal tallies into one reconciled scope memo.
      relatedQuestionRefs: [QM006, QM022]
    - type: private-evidence-only
      severity: material
      topic: pricing-and-roi
      missingEvidence: Contract pricing, land-and-expand pattern, and realized ROI by buyer segment.
      whyItMatters: Valuation depends on monetization and retention, not just market existence and workflow urgency.
      diligencePath: Review customer contracts, win/loss data, and board-level SaaS KPI packs.
      relatedQuestionRefs: [QM024, QM026]
    - type: enumeration-incomplete
      severity: minor
      topic: california-demand
      missingEvidence: Clean public count of how many businesses doing business in California clear the SB 253 and SB 261 revenue thresholds.
      whyItMatters: The California demand lens is conceptually strong but still lacks a direct covered-entity count from the official statute.
      diligencePath: Use CARB, tax-base, or third-party compliance datasets to estimate covered entity counts by sector.
      relatedQuestionRefs: [QM004, QM023]
    - type: access-blocked
      severity: minor
      topic: gated-omnibus-guidance
      missingEvidence: Full text of EcoVadis' gated omnibus FAQ and CSRD guide rather than teaser pages.
      whyItMatters: The teasers confirm scope and timing topics but not the full methodological detail or examples those guides may contain.
      diligencePath: Obtain the complete gated downloads or ask EcoVadis for the underlying PDF decks.
      relatedQuestionRefs: [QM006, QM024]
