callouts:
  - calloutType: insight
    title: "Voluntary demand matters almost as much as mandatory scope"
    body: The omnibus package sharply reduced the number of companies directly forced into CSRD and CSDDD, but the surveyed out-of-scope companies largely plan to keep reporting anyway. That makes EcoVadis' market less a pure compliance burst and more a procurement and reporting infrastructure layer whose demand persists after direct legal scope narrows.
    claimRefs:
      - CM014
      - CM015
      - CM016
      - CM017
  - calloutType: risk
    title: "The market exists, but data quality and provider scrutiny cap fast monetization"
    body: Supplier emissions data is still sparse, assurance requirements are rising, and ESG ratings providers themselves now face methodology and governance regulation. Those frictions do not negate demand, but they do make the revenue pool more execution-constrained than a generic ESG-software bull case suggests.
    claimRefs:
      - CM024
      - CM042
      - CM043
      - CM047
      - CM048
