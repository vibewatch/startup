- id: retention-visibility-and-supplier-friction
  title: Retention visibility and supplier friction
  body: 'This is the most important bearish section of the chapter. EcoVadis has broad public proof of adoption surfaces, but it does not publish NRR, GRR, buyer renewal, supplier reassessment rates, or churn by cohort. The only retention signals that are directly visible are qualitative: DHL’s program is embedded deeply enough to look sticky, Brenntag’s annual assessments imply recurring use, and Amazon Business creates another usage surface that could reinforce continuity. Against that, supplier-side friction is not imaginary. The archived G2 corpus includes praise for structure and benchmarking but also explicit complaints about the time needed to gather supporting documents and that pricing can be high for smaller businesses. Sector initiatives are one answer to that burden because they reduce duplicate questionnaires, but they do not eliminate the fact that some supplier participation is effectively customer-mandated. The 2026 ESG ratings regulation also raises a separate burden vector:
    methodology scrutiny and disclosure expectations may increase effort for both providers and rated companies. Net result: public evidence supports real use, but not enough to underwrite retention durability with confidence.'
  claimRefs:
