figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Maps the most visible public customer journey from buyer mandate through supplier assessment, score sharing, partner embedding, and ongoing improvement.
  data:
    nodes:
    - id: buyer-mandate
      label: Buyer mandate
      description: A procurement or sustainability leader decides to require EcoVadis assessments for suppliers or to use ratings in sourcing and compliance workflows.
    - id: supplier-onboarding
      label: Supplier onboarding
      description: The supplier completes a tailored questionnaire, uploads evidence, and receives analyst-reviewed scorecards or carbon metrics.
    - id: score-sharing
      label: Score sharing
      description: Results are shared with requesting customers and can be reused with multiple clients or sector-initiative members.
    - id: workflow-embedding
      label: Workflow embedding
      description: Ratings, medals, and risk signals are surfaced in SRM, procurement, marketplace, or reporting tools such as JAGGAER, Amazon Business, Workiva, and Watershed.
    - id: improvement
      label: Corrective action and training
      description: Customers use dashboards, corrective-action plans, e-learning, and carbon guidance to improve supplier performance over time.
    - id: expansion
      label: Expansion into adjacent modules
      description: Customers may add carbon-data, worker-voice, or partner-connected workflows once the rating program is in place.
  approximationNotes: This is a conceptual journey synthesized from multiple public workflow pages rather than a disclosed funnel from one named account.
