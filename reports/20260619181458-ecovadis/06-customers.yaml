- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact on chapter view
  - Public evidence
  - Diligence path
  rows:
  - - Amazon Business marketplace deployment
    - Could remain limited to a subset of EU sellers and commodity purchases
    - Strong workflow fit for tail spend, but unclear revenue depth
    - EcoVadis blog + BusinessWire + ESG Today
    - Request number of participating sellers, active buyers, and GMV influenced by EcoVadis filters
  - - JAGGAER supplier-management integration
    - Partner route may be easier to market than to monetize directly
    - Supports embedded-workflow moat
    - JAGGAER partner page
    - Request partner-sourced ARR, attach rates, and active customer logos
  - - Workiva carbon-data integration
    - Carbon adoption may expand module usage without proving core-rating retention
    - Important cross-sell route into finance and disclosure workflows
    - PR Newswire + ESG Today + Workiva guide
    - Request mutual-customer count and cross-sell conversion from ratings into carbon
  - - Watershed scope-3 integration
    - Scope 3 demand is real, but partner announcements do not reveal buyer retention or spend
    - Strengthens product adjacency and decarbonization relevance
    - Watershed + PR Newswire + ESG Today
    - Request active connected accounts and module-level retention
  - - Sector initiatives / consortium sales
    - Coalition sales can reduce supplier burden but may compress account ownership and pricing power
    - Useful acquisition channel with uncertain economics
    - Sector initiatives page + Brenntag page
    - Request member counts, renewal rates, and average suppliers activated per initiative
  - - Mandatory buyer programs
    - Supplier resentment or support failures can raise churn risk on the supplier-paid side
    - Main bearish customer angle in public evidence
    - DHL PDF + G2 + ESG Today burden article
    - Request completion-time data, support SLAs, and supplier-renewal outcomes by account type
  notes: This table separates visible expansion vectors from the unresolved revenue-concentration and supplier-fatigue risks that public sources cannot settle.
