- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Strategic value
  - Main gap
  rows:
  - - Enterprise buyers / procurement organizations
    - 'Buyer: CPO / sustainable procurement team; user: procurement, SRM, risk; payer: enterprise buyer'
    - Supplier risk scoring, onboarding, RFP gating, contract conditions, reporting
    - DHL, Merck, Brenntag, Amazon Business buyer workflow, barometer
    - Core enterprise control point with direct compliance and sourcing value
    - No disclosed count of paying buyers vs total network
  - - Rated suppliers / sellers
    - 'Buyer: supplier compliance lead; user: ESG / sales / operations; payer: assessed supplier'
    - Respond to customer mandates, share scorecards, earn medals, benchmark peers
    - Plans & pricing, G2 reviews, Amazon Business seller badges
    - Turns customer mandates into recurring supplier subscription revenue
    - Public ROI for smaller suppliers is mixed and cost sensitivity is visible
  - - Finance / private equity
    - 'Buyer: PE operating partner / ESG lead; user: portfolio teams; payer: fund or institution'
    - Benchmark portfolio companies and inform diligence or value creation
    - Palladium, Helios, Invest-NL story
    - Expands TAM beyond procurement into portfolio oversight
    - No public revenue mix or retention data by financial-customer cohort
  - - Sector-initiative members
    - 'Buyer: industry coalition member; user: procurement + sustainability teams; payer: member buyer'
    - Share supplier scorecards, reduce duplicate questionnaires, monitor sector dashboards
    - Sector initiatives page; Brenntag TfS practice
    - Creates consortium-driven acquisition and lower supplier-friction narrative
    - Membership counts and economics by initiative are undisclosed
  - - Technology and reporting partners
    - 'Buyer: partner platform owner or mutual customer; user: procurement, carbon, finance teams; payer: mutual customer / partner program'
    - Embed EcoVadis data into SRM, marketplaces, carbon reporting, and human-rights workflows
    - JAGGAER, Amazon Business, Workiva, Watershed, Ulula worker voice
    - Channel leverage extends EcoVadis into daily workflows without direct UI switching
    - Partner-driven adoption is easier to prove than direct buyer retention
  notes: Rows summarize public customer archetypes only; EcoVadis does not publish a canonical split of paid buyers, supplier subscribers, or channel-attributed revenue.
