- id: expansion-vectors-and-concentration-risk
  title: Expansion vectors and concentration risk
  body: 'EcoVadis appears to have several credible expansion routes even though its customer economics remain opaque. Sector initiatives create consortium-led growth; JAGGAER, Amazon Business, Workiva, and Watershed create software distribution routes; the carbon module creates cross-sell from ratings into Scope 3; and finance use cases expand the story beyond procurement teams into portfolio oversight. That breadth is strategically positive because it reduces dependence on one buyer persona. The unresolved problem is concentration transparency. Public sources are much better at counting rated companies than at distinguishing which participants are high-value enterprise buyers, which are suppliers paying under customer pressure, and which are lighter-touch network participants. The same issue shows up in monetization disclosure: partner announcements prove workflow relevance, but not how much ARR they contribute or how sticky they are. For diligence, the key ask is a segment-level bridge
    from buyer accounts to supplier subscriptions to partner-sourced expansion, plus top-customer concentration and renewal data. Until that is disclosed, the chapter supports a strong adoption narrative but only a medium-confidence durability view.'
  claimRefs:
  - CU041
  - CU042
  - CU043
  - CU044
  - CU048
  - CU050
