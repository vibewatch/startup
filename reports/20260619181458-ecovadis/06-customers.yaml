  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric / signal
  - Public value
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - NRR
    - Not disclosed
    - All buyer cohorts
    - Low
    - Request NRR by buyer, supplier, and carbon modules for the last three fiscal years
  - - GRR / logo retention
    - Not disclosed
    - All buyer cohorts
    - Low
    - Request gross retention, logo churn, and top-20 account renewals
  - - Renewal rate for supplier subscriptions
    - Not disclosed
    - Rated suppliers
    - Low
    - Request annual reassessment and paid-renewal rates by supplier size bucket
  - - Mandatory-program stickiness
    - Visible at DHL
    - Large enterprise buyers
    - Medium
    - Request how many suppliers complete assessments and how often scores are reused in sourcing
