  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rates, and reassessment rates by buyer and supplier cohort.
    whyItMatters: Customer durability is central to underwriting the value of a two-sided procurement network, and public sources do not reveal whether growth is coming from renewals, new mandates, or partner distribution.
    diligencePath: Request cohort retention tables for enterprise buyers, supplier subscriptions, and carbon-module cross-sells for the last three fiscal years.
    relatedQuestionRefs:
    - QU017
    - QU018
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A canonical current customer roster or a management-approved list of top named deployments by segment, country, and module.
    whyItMatters: The named-customer proof table is representative rather than exhaustive, so investors cannot tell whether public references are concentrated in a few marquee accounts or broadly distributed.
    diligencePath: Request the top 25 named buyer accounts, supplier cohorts, and partner-linked deployments with start date, module mix, and current status.
    relatedQuestionRefs:
    - QU007
    - QU008
    - QU009
    - QU010
    - QU011
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-mix
    missingEvidence: Revenue split among enterprise buyers, suppliers, finance users, and partner-sourced accounts.
    whyItMatters: EcoVadis public network metrics blur together rated companies, buyers, and suppliers, making it impossible to infer concentration, ARPA, or gross margin by cohort from public sources alone.
    diligencePath: Request a management bridge from rated companies to paid accounts, including buyer count, supplier count, partner-sourced count, and top-10 revenue concentration.
    relatedQuestionRefs:
    - QU022
    - QU024
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
  - type: missing-source
    severity: minor
    topic: seller-conversion
    missingEvidence: Number of Amazon Business sellers displaying EcoVadis recognition and any resulting conversion or spend-lift metrics.
    whyItMatters: The Amazon Business launch is strong workflow proof, but commercial significance cannot be sized without adoption and conversion data.
    diligencePath: Request active seller count, badge penetration by country, buyer usage of the filter, and GMV influenced by EcoVadis recognition.
    relatedQuestionRefs:
    - QU007
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: stale
    severity: minor
    topic: older-customer-testimonials
    missingEvidence: Fresh 2026 or 2025 customer-owned references for Merck-level regulated buyers beyond EcoVadis-hosted testimonials.
    whyItMatters: Several marquee references still depend on 2023 customer-story content, which may not reflect current scope or renewal status.
    diligencePath: Request current reference calls or refreshed case studies from Merck, DHL, Brenntag, or equivalent regulated buyers.
    relatedQuestionRefs:
    - QU008
    - QU018
