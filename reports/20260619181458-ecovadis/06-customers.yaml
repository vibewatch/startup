callouts:
- calloutType: strength
  title: Procurement workflow fit is the strongest public proof
  body: 'The chapter’s clearest evidence is that EcoVadis sits inside real buyer workflows: DHL uses it in qualification and SRM, JAGGAER exposes it in supplier management, and Amazon Business moved sustainability signals to the point of purchase. That is better customer proof than logo lists alone.'
  claimRefs:
  - CU016
  - CU021
  - CU024
  - CU035
- calloutType: risk
  title: Retention underwriting remains weak despite broad adoption proof
  body: Public sources never disclose NRR, GRR, renewal, or churn by cohort. Supplier complaints about documentation effort and pricing mean the network can be large while still hiding meaningful friction on the paying-supplier side.
  claimRefs:
  - CU033
  - CU037
  - CU038
  - CU049
- calloutType: recommendation
  title: Diligence should request a buyer-versus-supplier revenue bridge
  body: Management should provide the split of paid enterprise buyers, paid supplier subscribers, partner-attributed accounts, top-customer concentration, and renewal rates by module. Without that bridge, public scale metrics are informative but not enough to underwrite customer durability.
  claimRefs:
  - CU041
  - CU048
