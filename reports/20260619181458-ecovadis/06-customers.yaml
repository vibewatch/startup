- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Covers the major named customer proofs directly fetched for chapter 6 across enterprise buyers, finance users, and channelized procurement deployments; EcoVadis does not publish a full customer roster, so this is a representative public subset rather than an exhaustive list.
  columns:
  - Customer / program
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Public outcome or proof
  - Limitation
  rows:
  - - Merck
    - Enterprise buyer
    - Trusted supplier ratings and regulatory alignment in sustainable procurement
    - Production reference
    - Merck procurement executive testimonial says EcoVadis provides trusted ratings, regulatory support, and business benefits
    - Short testimonial with no spend, seat, or renewal metrics
  - - DHL Group
    - Enterprise buyer
    - Mandatory supplier sustainability assessment integrated into qualification, SRM, annual reviews, and preferred-supplier criteria
    - Production reference
    - Customer-owned PDF states the assessment is mandatory for selected suppliers and procurement uses the scorecard in multiple processes
    - No disclosed supplier completion rate or renewal economics
  - - Brenntag
    - Enterprise buyer / sector member
    - Annual supplier sustainability assessments through TfS and EcoVadis-linked purchasing decisions
    - Production reference
    - Customer-owned supply-chain page says suppliers are required to undergo assessments for transparency and purchasing decisions
    - Scope is described as a number of suppliers, not the full base
  - - Jakala
    - Enterprise buyer
    - Full-suite sustainable-procurement workflow for supplier engagement, transparency, and risk reduction
    - Production reference
    - 2025 customer story says EcoVadis helps drive supplier engagement at every level
    - No quantitative ROI or retention data
  - - Palladium / Helios / Invest-NL
    - Finance / private equity
    - Portfolio-company ESG benchmarking and investment decision support
    - Production reference
    - Finance story says firms use EcoVadis to benchmark portfolio companies and inform decisions
    - Grouped proof, not a quantified deployment count
  - - Amazon Business sellers with EcoVadis medals
    - Supplier / channel deployment
    - Marketplace visibility and sustainable-procurement filtering for day-to-day purchases
    - Production reference
    - EcoVadis and BusinessWire say sellers can display verified medals or badges and buyers can use them in search
    - Proof is channel functionality, not direct disclosure of seller conversion or renewal
