- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: 'Public adoption evidence is broad but uneven. EcoVadis does disclose large top-of-funnel metrics: 150,000+ rated companies, 48,000+ carbon reporters, and a 2026 buyer survey with 1,000 large multinationals and about 2,000 suppliers. The barometer also shows that ESG data is no longer niche inside procurement, with 98% of surveyed companies embedding it somewhere in their processes and 26% covering more than half of spend with third-party ratings. The better proof of real customer usage comes from named production references. Merck describes trusted supplier ratings and regulatory support, DHL publishes a customer-owned program deck that makes EcoVadis mandatory for selected suppliers and feeds results into qualification and SRM, Brenntag requires supplier assessments through TfS, Jakala cites full-suite deployment, and the finance story shows private-equity portfolio benchmarking. Amazon Business is the clearest 2026 production workflow launch because the feature changes buyer search
    behavior and seller profiles on a live marketplace rather than merely announcing a conceptual partnership. The weakness is that none of these named proofs come with contract values, seat counts, or renewal statistics.'
