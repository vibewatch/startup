  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency-and-realized-discounting
    missingEvidence: Public or customer-verified pricing for EcoVadis and the main peers, including module structure, supplier
      fees, and realized enterprise discounting.
    whyItMatters: Without real pricing, the chapter can compare commercial motion but cannot quantify where EcoVadis is cheaper,
      more expensive, or easier to land.
    diligencePath: Request current price books, sample MSAs or order forms, and a win-loss pack with realized ASPs by module.
  - type: private-evidence-only
    severity: material
    topic: actual-win-loss-and-coexistence-rates
    missingEvidence: Customer-level data on whether EcoVadis displaces Sedex, audit incumbents, risk tools, Watershed, or
      Workiva versus coexisting with them.
    whyItMatters: The fetched public pages explain why multi-homing is plausible, but they do not reveal how often EcoVadis
      actually consolidates spend.
    diligencePath: Ask management for named competitive takeouts, coexistence statistics, and attach-rate by product line
      in the top 100 accounts.
  - type: private-evidence-only
    severity: material
    topic: methodology-change-log-and-supplier-burden
    missingEvidence: Internal data on questionnaire length, response rates, supplier completion friction, and any planned
      methodology changes ahead of ESGR compliance.
    whyItMatters: The bearish case hinges on whether broad platform coverage creates supplier fatigue or manageable workflow
      leverage.
    diligencePath: Request methodology governance documents, supplier NPS or completion metrics, and pre/post-change customer
      communications.
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-long-tail-not-fully-enumerated
    missingEvidence: A fully exhaustive long tail of niche supplier-risk, carbon, and audit vendors by region and vertical.
    whyItMatters: This chapter prioritizes the archetypes and the most decision-relevant peers rather than every niche regional
      provider.
    diligencePath: Build a broader market map from procurement RFP shortlists, G2/RFI data, and customer reference calls.
    relatedTableRefs:
    - TP001
