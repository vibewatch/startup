- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor / class
  - Category
  - Scale / positioning signal
  - Target buyer or workflow
  - Differentiation
  - Limitation
  rows:
  - - EcoVadis
    - Supplier sustainability platform
    - 150,000+ companies rated; combines ratings, IQ, and carbon modules
    - Procurement, responsible sourcing, supplier ESG and Scope 3 programs
    - One supplier-facing stack spanning assessments, monitoring, corrective action, and carbon collaboration
    - Public pricing is opaque and suppliers may face meaningful onboarding and data-request burden
  - - Sedex / SMETA
    - Audit-network and data-sharing platform
    - 95,000-business community and world’s most widely used social audit per Sedex
    - Procurement teams that want shared audit artifacts and corrective-action workflows
    - Strong audit-network legitimacy and explicit data sharing to reduce repeat audits
    - More audit- and site-assessment anchored than EcoVadis’ analyst-scored platform
  - - IntegrityNext
    - Software-native sustainability orchestration
    - 600+ industry leaders; ROI, coverage, and onboarding metrics published
    - Enterprises automating supplier compliance and risk programs
    - Closest software-native orchestration peer in the fetched set
    - Public materials emphasize outcomes but not transparent pricing or buyer-count economics
  - - Prewave / Sphera / LRQA EiQ
    - Risk monitoring and due-diligence intelligence
    - Prewave cites 1.6m suppliers and 4.5m daily data points; Sphera and LRQA emphasize N-tier and continuous monitoring
    - Risk, procurement, and due-diligence teams prioritizing alerts and mapping
    - Stronger real-time monitoring narrative than point-in-time assessments alone
    - Less clearly positioned as a universal supplier scorecard and medal system
  - - LRQA / Intertek / QIMA / BSI
    - Assurance, audit, standards, and inspection incumbents
    - Large expert and auditor networks plus standards or inspection heritage
    - Accounts led by audits, certifications, product compliance, or sector standards
    - High trust for service-heavy assurance and field verification
    - Heavier services motion and less obvious software standardization than EcoVadis
  - - Assent
    - Product compliance and sustainability software
    - 1000+ industry leaders and AI supplier-data narrative
    - Manufacturing and product-compliance teams
    - Strong compliance-data automation for regulated product environments
    - Narrower than a procurement-led supplier ratings network
  - - Watershed / Workiva
    - Carbon and reporting substitutes
    - Watershed focuses on supplier-specific Scope 3 data; Workiva on audit-ready ESG reporting
    - Climate, controllership, disclosure, and assurance teams
    - Can win carbon or reporting budgets without replacing all procurement workflows
    - Narrow substitutes for modules, not full replacements for ratings plus monitoring plus procurement integration
  - - Sustainalytics / investor ratings class
    - Investor-oriented ESG ratings
    - Methodology and public-data transparency position updated in 2025
    - Investors and issuers managing capital-markets signaling
    - Useful for capital-markets benchmarking and relative investor risk views
    - Not designed as a supplier onboarding and corrective-action workflow for procurement
  notes: Rows group the most decision-relevant archetypes evidenced in the fetched set rather than every niche ESG or procurement
    tool.
