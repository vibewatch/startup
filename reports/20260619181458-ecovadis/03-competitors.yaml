- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Vendor / class
  - Public pricing signal
  - Commercial motion
  - Included capability signal
  - Unknowns
  - Implication
  rows:
  - - EcoVadis
    - No public list price on reviewed pages
    - Sales-led platform sale
    - Ratings, risk intelligence, corrective actions, carbon collaboration
    - Module pricing, supplier-side fees, and enterprise discounting are not public
    - Procurement must buy into a broader value story rather than benchmark transparent SKU prices
  - - IntegrityNext
    - No public list price
    - Demo-led enterprise motion
    - Compliance automation, supplier coverage, orchestration
    - Seat, supplier, or usage economics are not public
    - Direct peer but pricing opacity preserves negotiation friction
  - - Prewave
    - No public list price
    - Talk-to-expert enterprise motion
    - Risk-event intelligence and due-diligence efficiency
    - Alert-volume, supplier-count, or module pricing not public
    - Competes on urgency and automation more than transparent packaging
  - - Assent
    - Book-a-demo motion
    - Sales-led platform sale
    - Compliance data extraction and supplier engagement
    - Actual contract economics not public
    - Can win where product-compliance ROI is easier to explain than broad ESG orchestration
  - - Workiva / Watershed
    - Demo-led / contact sales
    - Enterprise reporting or carbon motion
    - Audit-ready ESG reporting or supplier-specific Scope 3 management
    - Bundle structure and realized pricing not public
    - Narrow substitutes can still win budget if the buyer only needs reporting or carbon outcomes
  - - Sedex / audit incumbents
    - Pricing not disclosed on fetched pages
    - Service-plus-platform and audit-program motion
    - Audits, standards, corrective actions, assurance
    - Audit day rates, network discounts, and multi-service bundles not public
    - Buyers may compare EcoVadis against existing audit budgets rather than against another software SKU
  notes: The common pattern across the fetched set is sales-led packaging, so lack of list pricing is itself a competitive
    fact rather than a missing scrape.
