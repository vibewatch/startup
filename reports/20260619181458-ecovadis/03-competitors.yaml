- id: TP004
  title: Switching Cost, Multi-Homing, and Win/Loss Triggers
  columns:
  - Buyer trigger
  - EcoVadis advantage
  - Rival class likely to win
  - Why the rival wins
  - Multi-homing risk
  rows:
  - - Procurement wants one supplier-facing ESG control layer
    - Broadest combination of ratings, monitoring, action plans, and carbon collaboration
    - IntegrityNext or broader orchestration peers
    - If buyer prefers a different orchestration UX or incumbent relationship
    - Medium once scorecards and supplier workflows are embedded
  - - Customer or regulator requires auditable site-level assurance
    - EcoVadis can complement but not replace field audits
    - Sedex / SMETA, Intertek, LRQA, QIMA
    - Audits and standards create a more acceptable artifact for assurance-heavy programs
    - High because audits often remain alongside software
  - - Risk team wants real-time alerts and multi-tier mapping
    - EcoVadis IQ is credible but not the only answer
    - Prewave, Sphera, LRQA EiQ
    - Monitoring-first tools lead with alerts, network mapping, and incident detection
    - High because monitoring can be layered next to EcoVadis Ratings
  - - Climate team needs supplier-specific Scope 3 data quickly
    - EcoVadis Carbon extends reach into carbon
    - Watershed or Workiva
    - These tools market measurement and reporting outcomes more directly to climate and finance owners
    - High because carbon tools can coexist with procurement software
  - - Existing enterprise already owns inspection, certification, or reporting systems
    - EcoVadis can add procurement workflow value
    - Audit incumbents or reporting platforms
    - Budget owner may only fund the missing capability rather than a full platform replacement
    - High because adjacent systems reduce urgency to consolidate
  notes: This table captures the practical win/loss logic implied by the fetched positioning pages rather than claiming proprietary
    market-share data.
