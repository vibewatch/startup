  rows:
  - - Broad module surface across ratings, risk, and carbon
    - Point tools win one budget line at a time
    - High
    - Watershed, Workiva, Prewave, and audit incumbents each cover slices of the job
    - Need module attach-rate and bundle-retention data, not just network scale
  - - Trusted ratings and scorecards
    - EU ESG ratings regulation forces methodology and governance disclosure
    - High
    - ESG Today, Skadden, and Cuatrecasas all describe authorization and transparency obligations
    - Ask management how much product and compliance work is needed before July-November 2026 deadlines
  - - Embedded supplier workflows create switching cost
    - Buyers can multi-home across audits, monitoring, carbon, and reporting
    - High
    - Sedex, Intertek, Workiva, and Watershed all support adjacent layers that do not require full replacement
    - Need actual displacement and coexistence rates in enterprise accounts
  - - ESG ratings create defensible trust signal
    - Methodology opacity and ratings divergence reduce trust
    - Medium-high
    - IOSCO, IMD, MIT Sloan, and Stanford all describe transparency or comparability problems
    - Request methodology-change logs, response-rate data, and customer QA processes
  - - Category tailwinds from regulation
    - ESG backlash can slow broad-label adoption even if compliance work continues
    - Medium
    - London Business School describes ESG politicization and quieter external narratives
    - Test whether pipeline messaging is shifting from ESG language to risk, resilience, or compliance language
  notes: Severity reflects exposed competitive risk in the fetched evidence set, not a probabilistic forecast built from private
