- id: pricing-substitutes-and-switching-costs
  title: Pricing, Substitutes, and Switching Costs
  body: 'The fetched pages make clear that competitive pressure is not only about features; it is also about packaging and
    adoption friction. Across EcoVadis, IntegrityNext, Prewave, Assent, Workiva, and Watershed, the public surfaces are overwhelmingly
    demo-led and do not expose list pricing, which means buyers must underwrite value through a sales process rather than
    through transparent self-serve economics. That makes multi-homing easier. A company can keep Sedex or Intertek for audits,
    add Prewave or Sphera for alerts, use Watershed for Scope 3, and rely on Workiva for reporting without ever consolidating
    those jobs into one vendor. EcoVadis'' own pages also emphasize tailored onboarding, assessments, data collection, and
    supplier engagement, while Sedex explicitly sells the opposite benefit of shared audit data that reduces repeat audit
    collection. The consequence is a mixed switching-cost picture: EcoVadis can become sticky once embedded in procurement
    rules and supplier programs, but it is vulnerable in accounts that already own adjacent tooling and only need one missing
    module rather than a broad platform standardization.'
  claimRefs:
