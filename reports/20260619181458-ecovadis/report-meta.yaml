  customerFocus: Enterprise procurement and supply-chain teams, rated suppliers, investors, and partner platforms that need supplier sustainability data and workflow tooling
  businessModel: Subscription software and network products sold across supplier plans, enterprise ratings and risk programs, carbon modules, and partner-integrated workflow products
