companyProfile:
  summary: >
    EcoVadis is a Paris-founded private software and data company that sells sustainability
    ratings, scorecards, supplier-risk/compliance, carbon, and worker-voice tools into
    procurement and supply-chain workflows. Public evidence supports a 2007 founding, continued
    co-founder leadership, a multi-product monetization model, and substantial network scale,
    including 150,000+ to 175,000+ businesses in the ecosystem depending on source date and
    definition. The diligence constraint is disclosure quality: public materials support the
    funding chronology and strategic relevance, but not a current 2026 view of ARR, margins,
    retention, debt, cash, or equity value.
