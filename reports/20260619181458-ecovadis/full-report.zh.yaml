      - number: '8.5'
        title: 建议姿态、尽调关口与退出准备度
        blocks:
          - type: paragraph
            body: >-
              综合来看，证据支持继续研究，而不是明确买入或回避。EcoVadis
              有足够可见质量，仍值得纳入可投名单：规模、资方质量、多产品评级与碳堆栈、真实流程嵌入，以及可能提高可信供应商数据战略价值的监管背景。但建议强度不能超过证据强度。公开层面仍没有干净的 2026 年
              ARR、净留存、毛利率、现金、债务、投诉量或股权结构表披露；没有 ESMA 备案进展的公开确认；也没有合作伙伴集中度，或仍依赖被 Omnibus
              削弱的广泛合规叙事的增长占比拆分。这让合理姿态变成价格敏感且有条件。纪律严明的投资者应把估值视为在 2022 年独角兽门槛之上未知；若当前 ARR
              和留存强劲，门槛附近可能公平；在尽调证明之前，高于门槛则偏高。退出方面，公开记录比起近期 IPO，更支持战略收购逻辑：市场显然重视数据、风险和鉴证业务，但公开投资者会要求比 EcoVadis
              当前披露强得多的信息。因此，优先任务不是打磨估值小数点，而是把不透明转化为可验证的承销输入。
