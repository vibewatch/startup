      - number: '7.3'
        title: 财务、治理与不透明风险
        blocks:
          - type: paragraph
            body: >-
              作为私营公司，EcoVadis 很难承销：公开表面足够强，能暗示规模，却太弱，无法量化当前财务质量。抓取记录显示了清晰的历史融资故事：公司 2022 年宣布一轮 $500 million 融资，并称累计融资超过
              $725 million；Astorg 仍展示 €100 million ARR、1,912 名员工、700 多个企业采购团队的收购快照；General Atlantic 仍释放赞助信号。但这些来源都没有提供当前
              2026 年 ARR、利润率、留存、债务、契约或现金数据。本次最容易获取的法定备案表面是 EcoVadis UK Limited 的 Companies House
              页面；该页面有信息量，主要因为范围很窄：它显示的是本地实体反复提交的小公司账目和确认声明，而不是合并母公司经济性。


              这种不透明不是表面问题。公司把自己定位为可信的可持续基础设施，监管者也正好在提高对方法治理、投诉处理和数据透明度的预期。如果 Omnibus
              收窄强制市场，或供应商负担恶化转化和续约，导致增长放缓，外部投资者在影响体现为融资事件之前几乎看不到公开信号。治理质量也有同样问题：EcoVadis
              现在披露了更多方法流程，但对当前盈利能力、净留存、投诉量、客户集中度或董事会层面的风险管理披露仍不足，外部人无法区分一个健康的规模化网络，和一个由过往资本补贴出来的采用故事。对尽调来说，当前数字缺失本身就是一阶风险因素，而不是报告脚注。
