  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局和玩家原型
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 并不在一个边界清晰的同业组里竞争。其当前产品栈已覆盖供应商可持续发展评级、实时 ESG 风险映射和供应商碳数据协作，因此相关格局至少可拆成四类原型。第一类是软件原生供应商可持续发展平台，例如
              IntegrityNext，在编排和合规工作流上最接近。第二类是审计和网络驱动的采购基础设施，例如 Sedex/SMETA，以及 LRQA 和 Intertek
              等大型鉴证提供商，它们靠审计、标准和纠正行动解决任务，而不是靠分析师评分网络。第三类是风险情报软件，例如 Prewave、Sphera 和 LRQA
              EiQ，重点放在预警、多层级映射和尽调监控。第四类是更窄的替代工具，例如 Watershed 和 Workiva，它们争夺 Scope 3 测量和 ESG 报告预算，但不复制 EcoVadis
              完整的采购主导评级层。这种市场结构很重要，因为买方只解决问题的一块，也可能绕开完整 EcoVadis 部署。
