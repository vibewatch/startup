          - type: callout
            title: 主要折价来自证据质量，不只是需求质量
            body: 保持纪律的最大原因是，当前 ARR、NRR、现金、债务和优先权潜在压力数据仍未公开，而监管和方法负担正变得更重要，不是更不重要。
            calloutType: risk
