              EcoVadis 呈现出来的不是单功能 ESG 工具。抓取到的当前页面显示，它是一套以采购为中心的套件，从供应商可持续发展评级起步，延伸到 contactless
              风险情报和轻量问卷，再扩展到碳协作、员工声音和合作伙伴连接的报告工作流。公开产品和定价页面把套件拆分为 Sustainability Ratings、IQ Plus、Vitals、Carbon Action
              Manager、Product Carbon Footprint 工具，以及更广的风险管理打包。这种宽度重要，因为公司不只是给供应商打分；它试图进入
              onboarding、风险分诊、纠正行动、碳报告和企业采购运营。变现和打包证据是真实的，但并不完全透明。EcoVadis
              清楚展示定制化问卷、专家验证评估、评分卡、奖章和交易伙伴评级权，同时仍不披露关键方案的可用标价。因此，产品论点在工作流覆盖上很强，在可公开检查的商业细节上较弱。
