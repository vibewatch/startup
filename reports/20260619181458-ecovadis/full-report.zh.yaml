            body: >-
              历史股权融资可见，即便当前流动性不可见。公开披露支持 2016 年 Partech 轮、2020 年约 $200 million 的 CVC 领投轮，以及 2022 年由 Astorg 和
              BeyondNetZero / General Atlantic 领投、约 500 million 的融资，使累计融资超过 $725 million。2022 年新闻稿还称，CVC
              在该交易后仍是最大机构股东。这些事实重要，因为它们支持这样一种看法：EcoVadis 带着可观股权支持和投资者赞助进入当前成长阶段。同一证据集仍无法说明当前资本充足性。本次抓取中唯一容易获得的法定申报表面是
              EcoVadis UK Limited 在 Companies House 的申报历史，它暴露的是本地实体的年度小公司账目和确认声明，而非合并母公司现金、债务或
              runway。因此，公开证据支持融资历史和投资者存在，但不能让外部人判断 EcoVadis 是否自我供血、承担债务，或接近下一次融资触发点。
