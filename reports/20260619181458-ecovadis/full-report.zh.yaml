      - number: '1.4'
        title: 里程碑、合作伙伴、监管顺风和不利监督背景
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 的里程碑显示，公司正在从供应商评级专家走向更广的供应链运营基础设施。历史里程碑包括 2007 年在巴黎成立、2016 年 Partech 融资、2020 年 CVC 和 Bain 资本进入，以及
              2022 年切换为目的驱动章程并完成大额成长轮融资。更近的里程碑强调产品和网络扩张：2024 年收购 Ulula，2026 年 Amazon Business 对奖章和徽章的集成，以及 2026 年与
              Watershed 和 Workiva 的合作，把供应商专属碳数据拉入下游报告工作流。2026 年官方研究产品又通过记录买方对供应链可视性、Scope 3 数据和嵌入式 ESG 情报的持续压力，强化了商业论点。


              同一环境也带来真实的不利压力。EcoVadis 有望受益于 CSRD、LkSG、强迫劳动、分类法和气候披露复杂性，但评级提供商也正面对更严审查。ESG Today、Skadden 和 Cuatrecasas
              均称，EU ESG Ratings Regulation 将对 EcoVadis 这类提供商施加方法论、治理和授权要求。Cooley、MIT Sloan、Stanford 和 London Business
              School 的更广泛批评则指出，ESG 评级与可持续发展披露长期存在方法不一致、报告负担、政治化和反弹风险。后续章节应采取平衡结论：监管是 EcoVadis
              产品的需求顺风，但同一监管和声誉环境也提高了公司自身的执行与透明度义务。
