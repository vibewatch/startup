  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型 / 视角
      - 公开指标
      - 估值 / 状态
      - 相关性
      - 主要限制
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public comparables and adjacencies fetched for this chapter across
        data-and-ratings franchises, assurance providers and supply-chain transparency platforms; it excludes non-public
        revenue multiples and confidential M&A data not available from public evidence.
    rows:
      - - MSCI
        - 公开可持续发展 / 分析业务
        - 2026 年 6 月市值约 $42.26B；2024 年收入增长近 13%
        - 大型、已披露的公开业务
        - 展示耐久的数据与评级基础设施如何获得公开市场溢价
        - 业务范围更宽、透明度更高，财务披露也比 EcoVadis 更充分。
      - - Moody's
        - 公开风险 / 评级 / 数据业务
        - 2026 年 6 月市值约 $78.72B；40 多个国家约 16000 名员工
        - 大型、已披露的公开业务
        - 可作为可信风险数据经济性和披露标准的上限视角
        - 信用 / 数据组合比可持续采购工作流更宽。
      - - Intertek
        - 公开鉴证 / TIC 服务商
        - 2026 年 6 月市值约 $11.79B；2025 年收入 £3.43bn；调整后利润率 18.1%
        - 规模化鉴证与合规运营商
        - 可用于观察信任检查和尽调市场价值
        - 服务占比高的经济性不同于网络化评级软件模型。
      - - SGS
        - 公开测试 / 检验 / 认证服务商
        - 2026 年 6 月市值约 $22.26B；100000 名员工，2500 个办公室 / 实验室
        - 规模化全球鉴证运营商
        - 展示大型信任与合规基础设施市场的规模
        - 运营足迹和资本强度与 EcoVadis 差异很大。
      - - Sedex
        - 私有供应链透明度平台
        - 95000 家企业和 115000 个供应链站点；SMETA 是领先审计方法
        - 私有相邻业务，抓取证据中无公开估值
        - 证实买方需要多买方数据共享、审计和尽调工作流
        - 没有可用的公开估值或利润率披露。
      - - LRQA
        - 私有负责任采购与鉴证平台
        - 将负责任采购定位为连接式风险管理，结合鉴证、咨询和数据驱动的情报
        - 私有相邻业务，抓取证据中无公开估值
        - 证实负责任采购和持续供应链监控是拥挤的战略工作流
        - 无公开财务数据，且更宽的鉴证组合降低可比性。
      - - JAGGAER + EcoVadis 集成
        - 工作流相邻，不是直接估值可比
        - EcoVadis 评分卡、基准比较和纠正行动嵌入采购工作流
        - 战略相关性可比，不是市场倍数
        - 展示 EcoVadis 可以成为买方记录系统的一部分
        - 有助解释护城河和被去中介化风险，但不给出干净的估值基准。
    notes: 本表有意采用定性方法；公开记录能支撑质量和市场类别的强参照点， 但不能给出干净的当前 EcoVadis 倍数。
