chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、产品和当前网络规模
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 将自己定位为创立于巴黎的商业可持续发展评级提供商，而不是泛 ESG 咨询公司。公司官网称，公司成立于 2007 年，在巴黎启动，并已成长为全球可信的可持续发展评级提供商。同一官方材料，加上
              Astorg 的投资页面，描述了一套产品栈：把评级、评分卡、情报、碳工具和协作式绩效改进工作流组合起来，服务全球供应链。这个定位很关键，因为它把 EcoVadis
              放在采购软件、供应商风险基础设施和可持续发展报告的交叉点，而不是一次性咨询项目里。


              公开规模披露很强，但必须按时间顺序读。2024 年和 2026 年官方材料提到网络内 150,000+ 至 175,000+ 家企业、44,000+ 名买方、1,300+
              个采购组织，以及与可持续发展洞察相连的数万亿美元支出。较早的 2022 年前后来源则引用 55,000+ 家供应商，或覆盖 175 个国家的 95,000
              家企业。这些数字未必相互矛盾；它们看起来反映了不同日期和不同计量口径。仍缺失的是一个单一、当前、经审计的客户指标，能清晰区分付费企业客户、被评级公司、买方、供应商和更广泛的网络参与者。
