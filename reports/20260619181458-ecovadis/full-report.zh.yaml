  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出、排除支出和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 应被分析为供应商可持续发展基础设施，而不是包罗万象的 ESG 软件名目，也不是纯粹面向投资者的 ESG 评级供应商。其自身关于可持续采购、价值链排放、ESG
              报告和监管的解释材料，一贯把产品放在采购寻源、供应商尽调、Scope 3 数据收集，以及跨价值链合规报告周边。这意味着纳入支出是买方为收集、验证、评分、监控并改进供应商 ESG
              和碳数据而付费的工作流：供应商评估和评分卡、风险筛查、纠正行动和参与工具、碳数据收集、采购决策集成，以及对已越过直接运营边界的法规提供报告支持。

              排除支出同样重要。这个市场不等于全部 ESG 报告软件、全部可持续发展咨询、全部可持续金融产品，或全部面向投资者的 ESG 评级。它也排除实地审计劳务、碳抵消，以及广义 ERP
              或采购套件支出，除非这些钱专门用于购买经过验证的可持续发展情报和供应商工作流编排。相邻品类仍然重要，因为它们塑造边界：企业 ESG
              报告和财务工具消费其输出，而采购套件和内部合规团队既可成为分销伙伴，也可成为替代方案。

              现状仍然真实，应该压住任何膨胀的 TAM 叙事。EcoVadis 自己的 2026 Barometer 显示，多数买方已开始整合 ESG 数据，但许多仍依赖人工或局部数字化连接；报告还明确称，领先买方正从 SAQ
              转向第三方评级、培训和联合创新。ESG 报告页面同样把供应商行为准则、问卷和碎片化内部数据收集描述为常见做法。换句话说，替代集合并非假设：电子表格、供应商自证、行为准则、定期审计、咨询主导的报告项目，以及围绕
              GRI 或 UN Global Compact 等标准搭建的内部模型，仍是许多账户的默认选择。当这些人工替代方案对采购、财务和合规团队来说太慢、太碎片化或证据太弱时，EcoVadis 才会赢。
