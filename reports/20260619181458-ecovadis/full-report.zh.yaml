      - number: '2.4'
        title: 增长驱动、采用约束、矛盾和未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              增长逻辑很强，但应窄口径陈述。监管持续把供应商数据、人权尽调和价值链排放推入企业核心流程。UK Modern Slavery Act 要求每年发布关于供应链的透明度声明；UFLPA
              围绕与新疆相关商品建立可反驳推定，并把举证负担转给进口商；SB 253 和 SB 261 把气候披露扩展到价值链排放和气候风险报告；即使 omnibus 削减之后，CSRD 和 CSDDD
              仍保留大型公司义务和价值链压力。EcoVadis 的其他页面和 Barometer 随后说明了其经济意义：买方把监管准备、风险降低、创新和韧性列为主要收益，而 Scope 3
              不作为被描述为责任和融资问题，而不只是可持续发展愿景。

              主要采用约束同样重要。供应商数据仍不完整，30% 的供应商不提供排放数据，Index 数据集中的正式 GHG 盘查或 Scope 3 报告比例也很低。SB 253 增加第三方鉴证要求和潜在审计师瓶颈，SB 261
              则扩大气候风险披露预期，却没有解决数据碎片化。SEC 气候规则已不再提供稳定的联邦顺风，因为该规则被中止，California 和 EU 成为更清晰的需求锚点。与此同时，ESG Ratings
              Regulation 通过强制方法论披露、治理控制和授权路径，提高了 EcoVadis 这类提供商的合规负担。长期看，这确实会提升品类信任，但短期也是成本和执行负担。

              最大的未解问题是商业问题，而非主题问题。公开来源没有拆出 EcoVadis 的付费账户基础、模块附加率、实际定价、净留存，或评级、风险、碳与相邻财务 / 报告工作流之间的拆分。它们也没有证明，被移出直接 CSRD
              范围的公司中，有多少仍会购买软件，而不是继续采用人工报告或咨询主导的合规工作。用于估值时，本章可以支撑市场存在、紧迫性和工作流宽度，但不能支撑精确 SOM
              或有把握的收入池转化率。因此，正确的尽调姿态是平衡：市场真实、正在成熟且与监管相连，但比泛 ESG 软件论点所暗示的更窄，也更受执行约束。
