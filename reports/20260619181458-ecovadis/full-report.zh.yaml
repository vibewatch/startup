      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 最好的公开数据结论是继续研究，而不是给故事加价
            body: EcoVadis 有足够可见平台质量，值得留在可投名单上，但当前经济性披露不足，无法支撑有信心的溢价估值判断。
            calloutType: recommendation
            claimRefs:
              - CV006
