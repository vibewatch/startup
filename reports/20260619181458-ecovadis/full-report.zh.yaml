      - number: '8.4'
        title: 可比公司视角与情景框架
        blocks:
          - type: paragraph
            body: >-
              公开可比公司适合判断方向，不适合给精度。MSCI 和 Moody's 显示，可信评级、数据和风险业务可以支撑很大的公开市值：CompaniesMarketCap 在 2026 年 6 月列示二者约为 $42.26
              billion 和 $78.72 billion；其投资者材料强调广泛的数据、分析和风险基础设施。但这些业务比 EcoVadis 宽得多、透明得多，财务披露也充分得多。Intertek 和 SGS
              给出相反教训：二者证明信任、鉴证和合规业务可以在公开市场值数十亿美元，但其运营模式更重服务，经济性也不是一个软件与网络故事的正确基准。Sedex 和 LRQA
              是有用的私营相邻案例，因为它们证明买方愿意为供应链中的尽调、审计和透明度基础设施付费，但仍无法解出 EcoVadis 自己的当前价格。正确用法，是把 EcoVadis
              夹在高溢价数据业务与规模化鉴证业务之间，再加入私营公司不透明折价。在这个框架下，基准情形应围绕 2022 年独角兽状态暗示的公开最低值，而不是新的自上而下标价。要获得高于门槛的上行，公司需要证明 ARR 已远超
              2022 年 €100 million 的资方快照，且监管强化护城河的速度快于抬高成本的速度。若合规驱动需求收缩、供应商负担拖慢参与，或隐藏的留存和利润率质量弱于规模故事，下破门槛的下行也变得合理。
