      - number: '2.2'
        title: 受证据约束的规模测算视角、区间和矛盾
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多种规模测算视角，但不支持一个针对 EcoVadis 的干净独立 TAM。第一个视角是监管范围。EcoVadis 的 CSRD 材料和 European Commission 的 CSRD
              页面，把旧披露制度锚定在全球约 50,000 家公司，但 2025-2026 年 omnibus 进程大幅缩小了直接受监管范围。Commission 2025 年 2 月提案描述了 CSRD 范围约 80%
              的削减，而后来关于最终政治协议的报道则描述了更严格的 >1,000 名员工和 >EUR450 million 收入门槛，估计剔除 90%
              的公司。这个矛盾不是噪音；它是核心证据，说明只绑定监管的市场增长叙事必须打折。

              第二个视角是相邻尽调范围。最终 CSDDD 现在聚焦超大型公司，门槛为 5,000 名员工和 EUR1.5 billion 营业额，合规时间为 2029 年 7 月，但仍保留
              chains-of-activities 尽调，并正式支持对严重影响开展基于风险的工作。第三个视角是装机基础和受治理支出。EcoVadis 称，超过 $2.5 trillion
              支出现在流经可持续发展风险洞察，175,000+ 家企业使用其平台，Index 和 Barometer 数据集覆盖 100,000+ 家已评分公司、约 200,000 张评分卡、1,000 家跨国公司和近
              2,000 家供应商。这些不是 TAM 美元，但相比泛泛的市场研究标题，它们更能证明企业工作流渗透。

              第四个视角是采用成熟度和数据质量。Barometer 显示，可持续采购在大型企业中已较成熟，但供应商准备度仍不均衡：只有约一半买方能看见大多数 Tier 1 供应商，且 30%
              的供应商仍不提供排放数据。这意味着可服务需求存在，但收入池受供应商数据不完整、数字集成不均衡，以及 EcoVadis 不公开披露付费客户数、定价、附加率或分部 ARR 的事实约束。因此，本章把 TAM 和 SOM
              视为未解尽调问题，用实体数量、支出治理和工作流成熟度视角替代虚构的精确市场规模数字。
