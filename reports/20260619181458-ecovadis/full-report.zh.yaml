  - id: TV005
    title: 论点破裂与终止触发表
    columns:
      - 触发因素
      - 门槛或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 当前 ARR / 留存数据不及预期
        - 管理层无法证明 ARR 显著高于 2022 年赞助方快照，或显示续约质量偏弱
        - 围绕 2022 年门槛的基准情形失去支撑
        - 调回熊市情形，要求更低价格，或退出。
      - - ESGR 准备延迟
        - 随着 2026 年截止日期临近，没有可信证据显示通知申报准备或治理落地就绪
        - 成本上升，连续性和声誉风险也增加
        - 上调风险评级，暂停高倍数逻辑。
      - - Omnibus 驱动的需求压缩持续
        - 管线仍绑定在已收窄的强制合规用例上，战略性抵消较弱
        - 相对鉴证类同行的叙事溢价被侵蚀
        - 下调牛市概率，将估值视角移向门槛附近或以下。
      - - 供应商负担 / 方法论争议上升
        - 投诉、申诉或证据负担恶化，且透明度或转化率没有改善
        - 网络效应走弱，客户信任不再那么耐久
        - 对增长和留存假设施加额外折价。
      - - 合作伙伴集中度高
        - 一个主要嵌入式平台掌握买方关系，或贡献大量订单
        - EcoVadis 变成组件，而不是控制点
        - 在集中度和经济性披露前，将上行空间视为受限。
    notes: 触发因素是可观察或可尽调的事件，能改变推荐结论，同时不假装公开投资者已经拥有完美数据。
