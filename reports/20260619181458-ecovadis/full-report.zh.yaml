      - number: '6.4'
        title: 留存可见度和供应商摩擦
        blocks:
          - type: paragraph
            body: >-
              这是本章最重要的偏空部分。EcoVadis 对采用表面有广泛公开证明，但不发布 NRR、GRR、买方续约、供应商复评率或按 cohort 的流失。直接可见的留存信号只有定性信号：DHL
              的项目嵌入足够深，看起来有黏性；Brenntag 的年度评估暗示经常性使用；Amazon Business 创造了另一个可能强化连续性的使用表面。与此相对，供应商侧摩擦并非想象。归档 G2
              语料既有对结构和对标的赞赏，也有明确抱怨：收集支持文件耗时，且定价对较小企业可能偏高。行业倡议是缓解负担的一种答案，因为它们减少重复问卷，但不能消除部分供应商参与实质上由客户强制的事实。2026 年 ESG
              评级监管还增加了另一条负担向量：方法论审查和披露预期可能提高提供商和被评级公司双方的工作量。净结果是：公开证据支持真实使用，但不足以有把握地承销留存持久性。
