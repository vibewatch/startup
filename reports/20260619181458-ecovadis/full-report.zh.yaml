            body: >-
              EcoVadis 发布了许多规模指标，但它们不可互换。2022 年融资新闻稿披露：95,000+ 家企业使用平台，上一年收入增长 50%，1,300 名员工，15,000 家公司参与 Carbon Action
              Module，超过 500,000 家公司经 IQ 筛查。2024 年和 2025 年目的材料进一步推进规模叙事：1,300+ 个采购组织、44,000+ 名买方、150,000+ 家被评级公司、175,000+
              家企业使用更广平台、55,838 家公司报告至少一项 GHG 指标，以及超过 $2.5 trillion 支出与可持续发展洞察相连。这些是有意义的运营信号，也支持 EcoVadis
              坐在大型经常性工作流上的论点。不过，它们并未解决付费客户数量或 ARR 这个核心财务问题。买方、被评级供应商、被筛查公司和员工用户都会扩大生态宽度，但公开证据没有把它们调和成一个披露的收入分母。
