  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 品类
      - 规模 / 定位信号
      - 目标买方或工作流
      - 差异化
      - 局限
    rows:
      - - EcoVadis
        - 供应商可持续发展平台
        - 已评级 150,000+ 家公司；结合评级、IQ 和碳模块
        - 采购、负责任采购、供应商 ESG 和 Scope 3 项目
        - 一套面向供应商的技术栈，覆盖评估、监控、纠正措施和碳协作
        - 公开定价不透明，供应商可能承受不小的入驻和数据请求负担
      - - Sedex / SMETA
        - 审计网络和数据共享平台
        - Sedex 称其拥有 95,000 家企业社区和全球最广泛使用的社会审计
        - 希望共享审计材料和纠正措施工作流的采购团队
        - 审计网络合法性强，并明确共享数据以减少重复审计
        - 比 EcoVadis 的分析师评分平台更锚定审计和现场评估
      - - IntegrityNext
        - 软件原生可持续发展编排
        - 600+ 行业领导者；发布 ROI、覆盖率和入驻指标
        - 自动化供应商合规和风险项目的企业
        - 已抓取集合中最接近的软件原生编排同业
        - 公开材料强调结果，但不透明披露定价或买方数量经济性
      - - Prewave / Sphera / LRQA EiQ
        - 风险监控和尽职调查情报
        - Prewave 提到 1.6m 家供应商和 4.5m 个每日数据点；Sphera 和 LRQA 强调 N-tier 和持续监控
        - 优先关注预警和映射的风险、采购和尽职调查团队
        - 实时监控叙事强于单纯的一次性评估
        - 作为通用供应商评分卡和奖牌系统的定位不够清晰
      - - LRQA / Intertek / QIMA / BSI
        - 鉴证、审计、标准和检验存量机构
        - 大型专家和审计师网络，加上标准或检验传承
        - 由审计、认证、产品合规或行业标准牵头的账户
        - 在服务密集型鉴证和现场核验上信任度高
        - 服务动作更重，软件标准化不如 EcoVadis 明显
      - - Assent
        - 产品合规和可持续发展软件
        - 1000+ 行业领导者和 AI 供应商数据叙事
        - 制造和产品合规团队
        - 面向受监管产品环境的合规数据自动化能力强
        - 比采购牵头的供应商评级网络更窄
      - - Watershed / Workiva
        - 碳和报告替代品
        - Watershed 聚焦供应商特定 Scope 3 数据；Workiva 聚焦可审计 ESG 报告
        - 气候、财务控制、披露和鉴证团队
        - 可在不替换全部采购工作流的情况下赢得碳或报告预算
        - 是模块的窄替代，不是评级加监控加采购集成的完整替代
      - - Sustainalytics / 投资者评级类别
        - 面向投资者的 ESG 评级
        - 2025 年更新方法论和公开数据透明度定位
        - 管理资本市场信号的投资者和发行人
        - 适合资本市场基准比较和相对投资者风险视角
        - 不是为采购的供应商入驻和纠正措施工作流设计
    notes: 各行归纳已抓取材料中最影响决策的原型，而不是覆盖每一个小众 ESG 或采购工具。
