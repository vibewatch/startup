      - number: '6.2'
        title: 采用轨迹和具名证明
        blocks:
          - type: paragraph
            body: >-
              公开采用证据很广，但不均衡。EcoVadis 确实披露了大型漏斗顶部指标：150,000+ 家被评级公司、48,000+ 家碳报告方，以及一项包含 1,000 家大型跨国公司和约 2,000 家供应商的 2026
              年买方调查。Barometer 还显示，ESG 数据在采购中已不再小众：98% 的受访公司把它嵌入某些流程，26% 用第三方评级覆盖超过一半支出。更能证明真实客户使用的是具名生产引用。Merck
              描述可信供应商评级和监管支持；DHL 发布客户自有项目材料，要求选定供应商必须使用 EcoVadis，并把结果输入资格认定和 SRM；Brenntag 要求通过 TfS 开展供应商评估；Jakala
              引用了全套件部署；财务案例展示了私募股权组合公司对标。Amazon Business 是 2026 年最清晰的生产工作流发布，因为该功能改变了实时 marketplace
              上的买方搜索行为和卖方档案，而不只是宣布概念性合作。弱点是，这些具名证明都没有附带合同金额、席位数或续约统计。
