  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开数据边界与已知估值锚
        blocks:
          - type: paragraph
            body: >-
              给 EcoVadis 估值的第一条规则，是把真正公开的事实与仅仅合理的推测分开。公开证据确实确认了 2022 年一场很大的融资事件、Astorg 和 General Atlantic
              的持续背书，以及相当的运营规模。EcoVadis 2022 年 6 月称，公司融资 $500 million，使累计融资超过 $725 million；Goodwin 将该轮描述为让 EcoVadis 成为第
              27 家法国独角兽的事件。Astorg 仍展示一份 2022 年收购快照：€100 million ARR、1,912 名员工、700 多个企业采购团队和 55,000 多家供应商。EcoVadis
              当前公司页面补充了更新但仍非财务的规模标记：超过 150,000 家被评级公司、超过 100,000 个活跃评级订阅者，以及超过 1,900 人的团队。公开记录没有提供的，正是估值纪律最需要的部分：当前 2026
              年 ARR、增长、留存、利润率、债务、现金或优先权堆栈细节。Companies House 只给出本地英国实体的备案表面，不是合并经济性。因此，正确的估值框架不是一个精确标记价格，而是一组受约束的锚：已验证的
              2022 年独角兽门槛、过时的 2022 年 ARR 快照，以及一个 2024–2026 年的运营规模故事；这个故事清楚暗示公司已成熟，但仍没有解决当前单位经济性。
