        - id: supplier-onboarding
          label: 供应商上线
          description: 供应商完成定制问卷、上传证据，并收到经分析师审查的记分卡或碳指标。
        - id: score-sharing
          label: 分数共享
          description: 结果会共享给提出请求的客户，也可复用于多个客户或行业倡议成员。
        - id: workflow-embedding
          label: 工作流嵌入
          description: 评级、奖章和风险信号会出现在 SRM、采购、市场或报告工具中，例如 JAGGAER、Amazon Business、Workiva 和 Watershed。
        - id: improvement
          label: 纠正行动和培训
          description: 客户使用仪表盘、纠正行动计划、在线学习和碳指导，随时间改善供应商表现。
        - id: expansion
          label: 扩展到邻近模块
          description: 评级项目落地后，客户可能增加碳数据、员工声音或伙伴连接工作流。
    approximationNotes: 这是一条由多个公开工作流页面综合出的概念旅程，不是某个具名账户披露的漏斗。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU016
      - CU024
      - CU032
      - CU035
      - CU036
      - CU043
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 展示公开证明如何从宽泛的网络规模主张，收窄到小得多的具名生产引用，再收窄到更少的已披露留存信号。
    data:
      items:
        - label: 公开网络规模主张
          value: 150000
        - label: 公开买方调查样本
          value: 1000
        - label: 本章使用的具名买方 / 金融证明
          value: 6
        - label: 已抓取的客户自有工作流文件
          value: 3
        - label: 已披露公开留存指标
          value: 0
    approximationNotes: 各项刻意混合了不同视角下的计数，用来显示公开证明在哪些位置变薄；关键不在数学转化，而在从网络宽度到可承保留存数据的披露衰减。
    claimRefs:
      - CU007
      - CU008
      - CU012
      - CU014
      - CU018
      - CU019
      - CU033
      - CU041
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 按证据质量和留存可见度评估具名客户证明，而不是把每个 logo 都视为同等强度的客户证明。
    data:
      columns:
        - 工作流深度可见
        - 客户自有佐证
        - 结果具体度
        - 留存可见度
      rows:
        - label: DHL Group
          values:
            - 高 — 强制流程覆盖资格认证、SRM、年度审查和优选供应商
            - 高 — DHL HTML 页面加 DHL PDF
            - 中 — 流程使用清晰，但没有 ROI 数字
            - 低 — 无续约、采用率或流失数据
        - label: Brenntag / Merck / Jakala
          values:
            - 中 — 采购用例清晰
            - 中 — Brenntag 或 Merck 为部分账户提供佐证
            - 低到中 — 定性收益占主导
            - 低 — 无合同或 cohort 指标
        - label: Amazon / 伙伴渠道
          values:
            - 中 — 工作流嵌入在购买或报告节点清晰可见
            - 中 — 存在伙伴和媒体佐证
            - 中 — 功能发布和用户动作具体
            - 低 — 商业转化和卖家留存未披露
    approximationNotes: 定性分档反映佐证深度，不代表商业重要性；留存可见度低并不否定使用，但会限制承保信心。
    claimRefs:
      - CU013
      - CU016
      - CU017
      - CU018
      - CU021
      - CU022
      - CU024
      - CU033
      - CU034
  - id: FU004
    title: 伙伴工作流
    type: flow
    layout: wide
    summary: 展示 EcoVadis 如何位于供应商评估与面向买方的采购、市场和报告端点之间。
    data:
      nodes:
        - id: supplier-data
          label: 供应商数据收集
          description: 供应商提供问卷答复、文件、记分卡授权或碳指标。
        - id: ecovadis-core
          label: EcoVadis 评级 / 碳层
          description: EcoVadis 分析师验证证据、生成记分卡、跟踪风险，并产出碳或员工声音输出。
        - id: buyer-procurement
          label: 买方采购团队
          description: 企业买方在上线、RFP、合同条件、订购和 SRM 工作流中使用评级。
        - id: jaggaer
          label: JAGGAER SRM
          description: 供应商评级、奖章、仪表盘和 360° Watch 发现会在供应商管理软件中可见。
        - id: amazon
          label: Amazon Business
          description: 奖章和徽章会在去中心化企业采购和搜索工作流中可见。
        - id: workiva
          label: Workiva
          description: 供应商碳数据流入可审计披露和碳核算工作流。
        - id: watershed
          label: Watershed
          description: 供应商碳数据被建模进脱碳和董事会报告工作流。
    approximationNotes: 流程节点代表已抓取页面记录的集成端点；它不是严格的系统架构图。
    claimRefs:
      - CU005
      - CU021
      - CU024
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU043
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: EcoVadis 最严重的风险集中在监管、产品可信度和不透明度，而非传统实体运营。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - 本地化伙伴摩擦
            - SEC 规则碎片化支持负担
            - 供应商问卷负担
            - ESGR 授权 / 就绪风险
        - label: 中可能性
          values:
            - 轻微方法论混淆
            - 评论网站投诉短期升温
            - 伙伴去中介化
            - Omnibus 驱动的合规 TAM 收缩
        - label: 低可能性
          values:
            - 单一区域申报异常
            - 一次性工作流宕机
            - 严重公开分数完整性争议
            - 当前不透明度掩盖的突发财务压力
    approximationNotes: 可能性和影响是基于已抓取证据集的定性排序，不是管理层提供的概率。
    claimRefs:
      - CR002
      - CR005
      - CR006
      - CR013
      - CR023
      - CR030
      - CR032
      - CR043
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管变化、方法论负担和伙伴层叠，都会传导到增长质量、留存和估值信心。
    data:
      nodes:
        - id: esgrr
          label: ESGR 监管
        - id: omnibus
          label: Omnibus 收窄
        - id: method
          label: 方法论变动
        - id: burden
          label: 供应商负担
        - id: partners
          label: 伙伴控制的工作流
        - id: opacity
          label: 财务不透明
        - id: cost
          label: 合规成本
        - id: trust
          label: 分数信任 / 可解释性
        - id: retention
          label: 转化 / 留存风险
        - id: growth
          label: 增长质量风险
        - id: valuation
          label: 估值信心
      edges:
        - from: esgrr
          to: cost
        - from: esgrr
          to: trust
        - from: omnibus
          to: growth
        - from: method
          to: trust
        - from: method
          to: burden
        - from: burden
          to: retention
        - from: partners
          to: retention
        - from: partners
          to: growth
        - from: opacity
          to: valuation
        - from: cost
          to: growth
        - from: trust
          to: retention
        - from: retention
          to: growth
        - from: growth
          to: valuation
    approximationNotes: 边代表从来源集推断出的分析性因果关系；未按披露收入或流失数据加权。
    claimRefs:
      - CR003
      - CR005
      - CR010
      - CR013
      - CR018
      - CR021
      - CR030
      - CR034
      - CR043
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: EcoVadis 现在位于监管机构、被评级供应商、企业买方和越来越强势的工作流伙伴之间。
    data:
      nodes:
        - id: eco
          label: EcoVadis
        - id: esma
          label: ESMA / ESGR
        - id: suppliers
          label: 被评级供应商
        - id: buyers
          label: 企业买方
        - id: workiva
          label: Workiva
        - id: watershed
          label: Watershed
        - id: jaggaer
          label: JAGGAER
        - id: partnernet
          label: 伙伴生态
        - id: carbon
          label: 碳数据网络
      edges:
        - from: esma
          to: eco
        - from: suppliers
          to: eco
        - from: buyers
          to: eco
        - from: eco
          to: carbon
        - from: carbon
          to: workiva
        - from: carbon
          to: watershed
        - from: eco
          to: jaggaer
        - from: eco
          to: partnernet
        - from: workiva
          to: buyers
        - from: watershed
          to: buyers
        - from: jaggaer
          to: buyers
    approximationNotes: 这张图只展示结构性依赖关系；不意味着已披露按伙伴划分的收入集中度。
    claimRefs:
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR039
      - CR042
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论来自可见平台质量与缺失当前财务披露之间的张力。
    data:
      nodes:
        - id: anchors
          label: 已知锚点
          description: 2022 年 $500m 融资、独角兽地位和赞助方背书支撑当前规模代理指标
        - id: assets
          label: 战略资产
          description: 分层定价、碳产品、工作流嵌入和采购相关性
        - id: burdens
          label: 折价因素
          description: ESGR 负担、Omnibus 需求削减、方法论分歧、供应商负担
        - id: opacity
          label: 缺失的经济性
          description: 无公开 2026 ARR、NRR、利润率、现金、债务或股权结构明细
        - id: posture
          label: 继续研究
          description: 把价值视为场景驱动；不要承保新的溢价点估计
      edges:
        - from: anchors
          to: posture
          label: 建立最低底部背景
        - from: assets
          to: posture
          label: 支撑可投资性
        - from: burdens
          to: posture
          label: 迫使折价
        - from: opacity
          to: posture
          label: 阻碍精确定价
    approximationNotes: 决策流是分析性的，概括证据如何被加权；它不是管理层提供的投资备忘录。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV010
      - CV015
      - CV016
      - CV017
      - CV018
      - CV020
      - CV039
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 用一套简单分析打分，展示几项最大证据对估值信心的示意性影响。
    data:
      items:
        - label: 2022 年独角兽融资锚点
          value: 2
        - label: 当前规模代理指标 150k+ / 100k+ / 1900+
          value: 2
        - label: 定价广度与碳产品交叉销售
          value: 1
        - label: 嵌入工作流与伙伴验证
          value: 1
        - label: ESGR 合规负担
          value: -2
        - label: Omnibus 需求收窄
          value: -2
        - label: 方法论分歧 / 仅依赖公开信息的压力
          value: -2
        - label: 无公开 ARR / NRR / 现金 / 股权结构
          value: -3
    approximationNotes: 数值表示对名义分数的分析性信心影响，不是已披露百分比或收入变化。
    claimRefs:
      - CV002
      - CV006
      - CV010
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间锚定 EcoVadis 2022 年成为独角兽所隐含的公开最低值，而不是未披露的当前估值。
    data:
      items:
        - label: 乐观情形
          low: 1.6
          mid: 2
          high: 2.4
          notes: ARR 需要远高于 2022 年投资方快照，留存强劲，监管继续加深护城河。
          claimRefs:
            - CV036
        - label: 基准情形
          low: 1
          mid: 1.3
          high: 1.6
          notes: EcoVadis 仍具战略价值，但不透明带来的折价依然明显。
          claimRefs:
            - CV037
        - label: 悲观情形
          low: 0.7
          mid: 0.85
          high: 1
          notes: Omnibus 压缩需求、负担投诉和经济性走弱，把价值拉向 2022 年底线，甚至低于该底线。
          claimRefs:
            - CV038
        - label: 破局情形
          low: 0.4
          mid: 0.55
          high: 0.7
          notes: 融资或尽调事件暴露留存偏弱、优先权包袱沉重，或 ESGR 出现重大滑坡。
          claimRefs:
            - CV041
    approximationNotes: 倍数是公开 2022 年独角兽底线（隐含门槛 > $1B）的 x 倍，不是新的股权报价。
    claimRefs:
      - CV002
      - CV003
      - CV020
      - CV036
      - CV037
      - CV038
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 投委会式打分显示，EcoVadis 是一门好生意，但证据质量弱于价格纪律所需。
    data:
      items:
        - label: 市场 / 工作流贴合度
          value: 4 / 5
          detail: 采购、碳和尽调工作流明确存在，也具备战略用途。
          claimRefs:
            - CV013
            - CV014
            - CV017
        - label: 平台 / 变现广度
          value: 4 / 5
          detail: 分层评级、碳产品和企业套餐，意味着多条经常性变现路径。
          claimRefs:
            - CV010
            - CV011
        - label: 披露质量
          value: 2 / 5
          detail: 公司披露了规模和投资方质量，但没有披露精确估值所需的当前经济性。
          claimRefs:
            - CV012
            - CV020
        - label: 监管定位
          value: 3 / 5
          detail: 监管可能加深护城河，但也会抬高执行成本，并招来更多方法论审视。
          claimRefs:
            - CV016
            - CV017
            - CV018
        - label: 可比公司支撑
          value: 3 / 5
          detail: 上市同业验证了品类价值，但在披露水平和模式组合上，没有一家能与 EcoVadis 干净对标。
          claimRefs:
            - CV022
            - CV023
            - CV024
            - CV025
            - CV026
            - CV027
            - CV028
            - CV029
        - label: 估值就绪度
          value: 2 / 5
          detail: 足够搭情景框架，不足以支持激进的价格建议。
          claimRefs:
            - CV039
            - CV040
            - CV042
    approximationNotes: 分数是基于已抓取证据集的分析判断，应按相对评分理解，不是客观评级。
    claimRefs:
      - CV010
      - CV011
      - CV012
