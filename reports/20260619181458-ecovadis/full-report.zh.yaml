      - number: '2.3'
        title: 买方、用户、付款方、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比采购本身更宽，但采购看起来仍是运营重心。EcoVadis 的 2026 Barometer 明确把可持续采购描述为一个操作系统，把供应商 ESG 情报嵌入寻源和供应商关系决策，并称 98%
              的受访公司已开始把 ESG 数据嵌入采购流程。这一证据让采购成为最稳定的日常用户和工作流负责人。同一材料也说明采购很少单独行动。买方样本包括大量 C-level
              受访者的大型跨国公司，beyond-compliance
              报告调查则包括可持续发展、合规、CFO、CIO、供应链和人权职能负责人。报告数据已被用于运营规划、财务规划和供应链风险评估，这意味着一旦用例从供应商评分卡扩展到碳、报告或转型风险工作流，财务、风险、可持续发展和合规团队就会成为赞助方或共同负责人。

              因此，付款方和预算路径取决于触发因素。如果触发因素是寻源韧性或供应商绩效管理，预算所有权可落在采购转型、SRM 或品类领导层。如果触发因素是 SB 253、CSRD 或 Scope 3
              准备度，赞助方会扩展到可持续发展、主计长、披露、内审或 CFO 赞助的风险项目，因为鉴证、报告架构和财务规划后果会进入购买流程。如果触发因素是 SB 261
              或可持续金融准备度，气候风险和报告团队会更显眼，尽管产品仍依赖供应商数据收集。

              采用路径也是顺序推进，而非一蹴而就。买方先识别监管、韧性或客户压力问题；再映射供应商和数据缺口；接着把评级、碳和尽调工具叠加进寻源和报告工作流；之后才进入供应商改进、激励和融资联动。Barometer 所显示的从
              SAQ 转向评级、培训、联合创新和产品级碳数据，说明赢家供应商不只是数据库，而是能把采购决策连接到财务、披露和供应商行动的工作流系统。
