      - number: '6.5'
        title: 扩张向量和集中度风险
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 看起来拥有多条可信扩张路径，尽管客户经济性仍不透明。行业倡议创造联盟主导增长；JAGGAER、Amazon Business、Workiva 和 Watershed
              创造软件分发路径；碳模块创造从评级向 Scope 3
              的交叉销售；财务用例把故事从采购团队扩展到投资组合监督。这种宽度在战略上是正向的，因为它降低了对单一买方角色的依赖。未解问题是集中度透明度。公开来源更擅长统计被评级公司，而不是区分哪些参与者是高价值企业买方、哪些是受客户压力付费的供应商、哪些是更轻触达的网络参与者。变现披露也出现同样问题：合作伙伴公告证明工作流相关性，但不证明它们贡献多少
              ARR 或有多黏。用于尽调时，关键索取项是一个从买方账户到供应商订阅再到合作伙伴来源扩张的分部级桥接，加上头部客户集中度和续约数据。在披露之前，本章支持强采用叙事，但只支持中等置信度的持久性判断。
