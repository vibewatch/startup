        title: 护城河持久性和监管压力
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 护城河的乐观版本是宽度。抓取到的竞争对手很少能把供应商评估、基于新闻的风险监控、纠正行动工作流和供应商碳协作组合进同一叙事，因此 EcoVadis
              可以合理防守更窄的点工具。悲观版本是，同样的宽度也让它暴露在 ESG 评级品类最薄弱的部分。ESG Today、Skadden 和 Cuatrecasas 表明，EU 的 ESG
              评级制度将要求授权、方法论披露，以及 E、S、G 评级之间更强的隔离或透明度。IOSCO、IMD、MIT Sloan 和 Stanford
              都描述了一个长期存在透明度、可比性和方法论问题的品类。Sustainalytics
              放弃非公开发行人信息，说明大型既有玩家已经在调整。监管最终可能强化可信既有玩家，但也会增加合规成本，并促使客户质疑为什么要运行多套评估、问卷和重叠工具。London Business School 对 ESG
              反弹的描述又增加了更软的需求风险：工作仍会持续，但 ESG 这个标签本身已更具政治负荷。
