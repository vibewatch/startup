      - number: '1.3'
        title: 融资历史、投资者，以及公开 KPI 覆盖到底有多远
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 的融资历史有大致轮廓可见。公司页面记录了 2016 年 Partech 融资，以及 2020 年 €200 million CVC 轮融资加 Bain 少数股权投资。证据最完整的融资事件是
              2022 年 6 月轮：官方新闻稿、Business Wire 转载、Astorg 页面和 General Atlantic 页面均支持一笔由 Astorg 和 BeyondNetZero / General
              Atlantic 领投的 $500 million 融资，GIC 和 Princeville 也被点名。上述材料还称累计融资超过 $725 million，且 CVC 在该轮之后仍是最大机构股东。


              更难的问题不是股权历史，而是当前 KPI 精度。Astorg 的投资页面给出一个有用但未标明日期 / 类似收购时点的快照：€100 million ARR、1,912 名员工、巴黎总部，以及 700+
              个企业采购团队触达 55,000+ 家供应商。2024-2026 年官方材料提供了更新的网络数字，但没有清晰重申当前 ARR、估值、债务、二级交易或股权结构集中度。因此，公开可得的最佳结论是：EcoVadis
              是一家后期成长型私营公司，拥有可观股权支持和广泛生态渗透；但其当前估值和财务运行率只能从公开来源中部分看见。
