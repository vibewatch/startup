  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 证据
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - CSRD 和 Omnibus 后的报告压力
        - 正向，但范围比此前更窄
        - 直接范围显著收窄，但许多大型公司及其供应商仍面临报告预期
        - 当前 / 2026 年起
        - 支撑需求，但压缩被直接强制覆盖的公司范围
        - EcoVadis 管线中，自愿报告买方和强制报告买方各占多少？
      - - 最终 CSDDD 和价值链尽职调查
        - 正向
        - 尽职调查义务仍适用于超大型公司，并保留价值链风险管理需求
        - 中期至 2029 年
        - 支撑人权和供应商风险工作流
        - 需求现在有多少集中在仍被纳入范围的超大型公司层级？
      - - California SB 253 和 SB 261
        - 正向
        - 排放披露和气候风险报告把预算负责人从采购扩展到更多职能
        - 当前 / 2026 年起
        - 支撑碳数据和披露集成用例
        - 需求中有多少由美国州级规则驱动，而不是由 EU 驱动？
      - - UFLPA 和现代奴隶制合规
        - 正向
        - 进口和供应链透明度规则让可追溯性和供应商筛查持续处在议程高位
        - 当前
        - 支撑供应商尽职调查和证据工作流
        - 客户多常单独购买这些功能，而不是把它们与评级打包？
      - - Scope 3 责任和 ROI 压力
        - 正向
        - 未管理的 Scope 3 可能造成巨额负债，而供应商互动可改善回报
        - 当前 / 2030 年视角
        - 强化 CFO 层面对数据采集和互动的赞助
        - 已量化的客户 ROI 案例覆盖面广，还是集中在少数高级账户？
      - - 供应商数据质量和覆盖缺口
        - 负向
        - 30% 供应商仍不报告排放数据，Tier 1 以外的可见性仍弱
        - 当前
        - 拖慢激活，并降低高级模块的即时变现
        - 有多少交易因供应商无法提供可用数据而停滞？
      - - 鉴证和审计瓶颈
        - 负向
        - SB 253 分阶段引入鉴证，市场评论同时指向核验方稀缺和成本上升
        - 2026-2030
        - 增加落地摩擦，并可能推迟客户上线
        - EcoVadis 是否靠工作流设计或合作伙伴缓解审计师瓶颈？
      - - ESG 评级监管和方法论审视
        - 负向 / 长期利于信任
        - 提供商面临授权、治理和方法论透明度负担
        - 2026 年起
        - 长期提升品类合法性，但短期增加合规成本
        - EcoVadis 要完全合规，需要哪些成本、时间表和产品变化？
    notes: 方向反映市场影响，而不是法律价值判断；其中几行会强化需求，同时增加落地摩擦或供应商侧合规成本。
