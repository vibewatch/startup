      - number: '8.2'
        title: 可能支撑相对通用采购软件溢价的战略资产
        blocks:
          - type: paragraph
            body: >-
              即便缺少当前财务披露，正向估值论据也真实存在。EcoVadis 的变现表面是多层的，不是单一问卷产品。定价页面显示，公司有独立的 Carbon Rating 产品，以及从 Basic 到
              Premium、Select、Corporate 的分层 Sustainability Ratings 阶梯，释放出 land-and-expand 设计、基于服务的 upsell，以及向碳工作流
              cross-sell 的信号。合作伙伴页面显示，分数不是装饰。JAGGAER 直接在供应商管理中展示 EcoVadis 记分卡、奖章、基准和纠正行动流程，并称这些记分卡可帮助供应商获得或保住业务。Workiva
              将 EcoVadis 定位为领先的供应链 ESG 风险平台之一，并描述了一个持续数周、证据密集的评估，其输出会影响披露和价值链决策。Bain–EcoVadis
              研究更进一步，主张在选定可持续议题上的先进表现与更强盈利能力或增长相关。即便该研究有自利成分，它也说明了这项业务为何具有战略意义：采购、碳、尽调和财务用户都能为同一底层数据层找到预算理由。叠加当前 150,000
              多家被评级公司、100,000 多名活跃评级订阅者的规模信号，牛市叙事是：EcoVadis 更接近供应链可持续情报基础设施，而不是狭窄的供应商问卷工具。
