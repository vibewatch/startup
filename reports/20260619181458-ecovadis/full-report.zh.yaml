    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分和买方原型
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 更像一个多边采购网络，而不是单一同质 SaaS
              客户基础。最清晰的公开原型包括：在寻源和合规项目中使用评级的企业买方；付费接受评估并分享评分卡的供应商；用来对标被投公司的财务或私募股权用户；跨行业协调评估的行业倡议成员；以及把 EcoVadis
              数据嵌入相邻工具的技术合作伙伴。这种细分重要，因为买方、用户和付款方往往不是同一人。采购团队可能强制评估，供应商 ESG
              团队可能完成并支付评估，内部财务或合规用户则在后续消费输出。公开页面也显示买方侧和供应商侧价值主张确有差异：买方获得控制、可视性和政策执行，供应商获得可复用评分卡、徽章、对标，以及通过一次评估满足多个客户请求的能力。公开层面，EcoVadis
              最强的定位是采购和供应链合规的工作流基础设施，而不是简单徽章提供商。
