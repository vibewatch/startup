      - number: '7.2'
        title: 方法、负担与产品可信度风险
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 的产品风险不只是 ESG 评级在抽象层面有争议；更关键的是，EcoVadis 把一个文档密集、嵌入流程的评级过程商业化，而分数结果会影响供应商获得业务的机会。EcoVadis
              自己的方法材料描述了一个覆盖四大主题、21 项标准的框架，使用公司文档、第三方背书和 360° Watch
              监测；合作伙伴指南则描述了数周问卷工作、锁定提交，以及分数对上传证据质量和完整度的敏感性。在采购场景中，JAGGAER
              显示，最终的奖章、权重和改进指标会直接出现在供应商管理流程里，并能帮助供应商获得或保住业务。也就是说，可解释性、一致性和负担不是后台问题，而是客户直接感知的问题。


              外部资料把下行风险讲得更尖锐。IOSCO 将方法透明度不足和利益冲突列为行业核心问题；ESG Today 指出，由于议题选择、估算以及缺失数据处理不同，不同评级机构的分数可能显著分化。Sustainalytics
              转向仅使用公开输入尤其相关：它发现，移除非公开信息后，私营公司的分数变化更大；这说明，如果全市场转向更依赖公开披露的方法，私营或轻披露公司可能受罚。EcoVadis 自己的 2026 年 Q1
              发布说明也确认规则仍在持续大幅变化，包括新的披露文件、新版本管理、新咨询机制和修订后的证据覆盖规则。再叠加供应商一侧对流程繁重、偏重文档、有时昂贵的批评，核心产品风险就很清楚：EcoVadis
              的方法仍在公开演进，公司却必须同时捍卫分数公平性和参与经济性。
