  - id: TV006
    title: 最终尽调要求表
    columns:
      - 优先级
      - 尽调要求
      - 重要性
      - 缺失时是否构成阻碍
    rows:
      - - P1
        - 当前 ARR 桥接、毛利率、NRR/GRR 和续约队列
        - 判断 2022 年独角兽下限是否仍可捍卫，还是已经过时
        - 是
      - - P1
        - 现金、债务、烧钱、契约和流动性续航期细节
        - 区分耐久规模和资本支撑的规模
        - 是
      - - P1
        - 股权结构和清算优先权瀑布
        - 必须用它把企业价值情景转换成实际股权结果
        - 是
      - - P1
        - ESGR 授权工作计划、负责人和里程碑证据
        - 检验监管究竟会增强护城河，还是变成执行风险
        - 是
      - - P2
        - 合作伙伴收入集中度、商业条款，以及关键集成的路线图治理
        - 厘清合作伙伴嵌入会加深护城河，还是限制议价权
        - 否，但影响上行权重
      - - P2
        - 投诉、申诉、评分反转和供应商完成率指标
        - 检验方法论负担在规模化后是否可控，还是隐藏的流失来源
        - 否，但影响下行概率
    notes: P1 项是严肃价格谈判的最低承保要求；P2 项主要重估牛市和熊市情形权重。
