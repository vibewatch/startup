        - 与监管和客户审计绑定的人权、劳工、伦理和供应商风险筛查
        - 现场审计劳动本身、广泛法律咨询或通用制裁软件
        - 采购、合规、法务、人权团队
        - 核心且与监管挂钩
      - - Scope 3 供应商数据和碳协作
        - 供应商碳问卷、原始数据收集、产品碳数据、碳记分卡
        - 抵消、可再生证书、独立能源采购、非供应商气候分析
        - 可持续、采购、财务、披露团队
        - 核心增长相邻领域，正进入核心平台价值
      - - 采购决策集成
        - 嵌入寻源、供应商资格、合同条款和 SRM 工具的 ESG 标准
        - 整个 ERP / 采购套件支出，除非明确绑定 ESG 情报
        - 采购转型、CIO、运营 sponsor
        - 重要分发和流程层
      - - 企业 ESG 报告和鉴证
        - 消费供应商数据输出的报告架构、鉴证准备、披露流程
        - 与供应商或价值链数据无关的所有企业报告软件
        - CFO、财务控制、可持续报告、内部审计
        - 相邻，但不是 EcoVadis 的全部市场
      - - 现状替代方案和内部自建
        - 电子表格、SAQ、供应商行为准则、定期审计、顾问主导的数据收集、手工框架
