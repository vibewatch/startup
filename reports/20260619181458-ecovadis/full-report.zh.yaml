      - number: '1.2'
        title: 创始人、领导梯队、治理信号和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              管理层披露在高管履历层面异常丰富，但在传统治理层面相对单薄。EcoVadis 的领导团队页面仍把联合创始人 Pierre-François Thaler 和 Frédéric Trinel
              放在公司中心：Thaler 负责客户、营销、解决方案和影响力相关职能，Trinel 负责人事、财务、评估和技术。页面还展示了比早期公司通常会公布的更宽的管理梯队，包括
              CFO、首席评级官、首席人力资源官、首席企业发展官、首席影响力官、CTO、CMO 和 CPO。这种宽度是正向运营信号，因为它削弱了公司日常执行仍只靠创始人的观感。


              同时，本次抓取的公开材料没有提供常规董事会名单、董事履历，或能让外部投资者追踪正式控制权的股权结构 / 治理页面。最具体的监督披露反而来自 2025 年 Purpose Report，其中称 Purpose
              Committee
              由五名外部成员和三名内部成员组成，每年开会四次。这有意义，但不能替代完整董事会或投资者权利披露。因此，尽调姿态是中等关键人依赖：公司运营上已不像单薄团队，但创始人仍是公开记录中最清晰的战略主人，治理细节也仍披露不足。
