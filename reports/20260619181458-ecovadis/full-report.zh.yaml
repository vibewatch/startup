      - number: '8.3'
        title: 尽管平台质量高，折价仍必须保持宽
        blocks:
          - type: paragraph
            body: >-
              不能把 EcoVadis 按高溢价公共数据业务承销，是因为几乎每个吸引人的特征都有可见反重。ESG Today 和 IMD 都把欧盟 ESG Ratings Regulation 描述为一股力量：从 2026
              年起，它会提高 EcoVadis 等供应商的透明度、治理和授权负担。同一组 ESG Today 报道显示，最终 Omnibus package 对 CSRD 和 CSDDD
              短期监管覆盖面的削减远比最初提案更激进；评级机构受更多监督的同时，天然受监管需求减少。Sustainalytics 转向仅使用公开输入，对 EcoVadis
              有影响，因为移除非公开数据后，私营公司经历了更大的分数变化；这支持了一个判断：方法和证据规则能实质改变轻披露公司的结果。学术来源把同一点磨得更尖：Open Research Europe 调查称，不同供应商的
              ESG 评级相关性低；MDPI 批判性综述称，分歧、定义不清和报告不均带来可靠性问题。这一背景就是核心估值折价。EcoVadis
              可能具有战略重要性，但它仍是在一个方法负担上升、可比性受争议的市场里销售证据密集型分数；公司本身又不披露当前 ARR 和留存指标，无法支撑按上市公司式溢价倍数付费。
            claimRefs:
