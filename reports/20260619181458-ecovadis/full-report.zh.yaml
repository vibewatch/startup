      - number: '7.5'
        title: 缓释措施、否决标准与尽调问题
        blocks:
          - type: paragraph
            body: >-
              最可监控的否决标准，与监管、方法变动、合作伙伴依赖和不透明绑定。第一，EcoVadis 需要一条可见且可信的 ESG Ratings Regulation 时间表通关路径。若到 2026 年末窗口前仍没有
              ESMA 通知或授权进展的公开证据，或公司被迫做出重大产品 / 流程变化却没有清晰客户沟通，风险应立即上调。第二，投资者应观察市场范围是否滑坡：如果公司无法证明战略采购需求足以抵消 Omnibus
              造成的纯合规需求减少，增长质量就应打折。第三，供应商体验必须监测，不能假设。围绕成本、文档负担或分数可解释性的投诉若持续上升，就会有实质影响，因为评估直接影响供应商的商业准入，而嵌入合作伙伴的流程会让不满更难隐藏。


              关键尽调问题直接且可证伪。要求提供精确的 ESGR 准备项目、具名负责人和授权时间表；当前 ARR、毛利率、净留存、续约和投诉量数据；Omnibus 前后与 CSRD/CSDDD
              驱动用例绑定的收入和销售管线占比；方法变化影响分析和咨询记录；以及主要生态合作伙伴的商业条款或集中度。如果管理层能证明强留存、干净的投诉趋势、有限依赖集中度和可信的欧盟授权计划，当前风险栈的大部分会变得可管理。否则，下行情形仍是：EcoVadis
              正进入生命周期中监管更重、审查更多的阶段，但公开财务透明度太低，对政策驱动需求叙事又过于敏感。
