  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 维度
      - 正方论点
      - 反方论点
    rows:
      - - 平台角色
        - EcoVadis 处在采购、碳和尽职调查工作流中，有机会变成战略基础设施
        - 嵌入式工作流也可能把 EcoVadis 降格为由合作伙伴或买方控制的上游数据组件。
      - - 变现广度
        - 分层评级、碳产品和企业套包显示不止一条经常性收入流
        - 公开页面仍遮蔽实际定价、折扣、ACV 和续约结构。
      - - 需求驱动
        - 监管和供应链审视让可信供应商数据随时间更相关
        - Omnibus 大幅收窄近期强制报告范围，削弱了部分紧迫性叙事。
      - - 规模信号
        - 150000+ 家已评级公司、100000+ 名活跃已评级订阅方和 1900+ 名员工，意味着真实市场存在感
        - 规模代理指标无法揭示当前 ARR、毛利率、净留存、债务或现金。
      - - 方法论地位
        - 如果执行得好，基于证据的评分和治理升级可以加深信任
        - 学术、分析师和市场来源都显示 ESG 评级分歧、方法论负担和透明度风险。
      - - 估值设置
        - 2022 年赞助方支持和独角兽身份给出硬性的最低外部锚点
        - 该锚点已经陈旧；没有新的经济性证据，高于该锚点的估值可能由叙事驱动，而不是证据驱动。
    notes: 牛市和熊市论点刻意成对呈现，以保持建议对价格和证据敏感。
