      - number: '3.3'
        title: 定价、替代方案和切换成本
        blocks:
          - type: paragraph
            body: >-
              抓取页面清楚表明，竞争压力不只关乎功能，也关乎打包和采用摩擦。在 EcoVadis、IntegrityNext、Prewave、Assent、Workiva 和 Watershed
              中，公开页面几乎都由演示驱动，不披露标价，意味着买方必须通过销售流程评估价值，而不是通过透明的自助经济性做判断。这让多栖使用更容易。一家公司可以保留 Sedex 或 Intertek 做审计，增加 Prewave
              或 Sphera 做预警，用 Watershed 做 Scope 3，并依赖 Workiva 做报告，而从不把这些任务整合到一个供应商。EcoVadis 自己的页面也强调定制化
              onboarding、评估、数据收集和供应商参与，而 Sedex 明确销售相反收益：共享审计数据能减少重复审计收集。结果是切换成本图景混合：一旦嵌入采购规则和供应商项目，EcoVadis
              可以变得黏性很强；但在已经拥有相邻工具、只需要一个缺失模块而非广泛平台标准化的账户中，它也很脆弱。
