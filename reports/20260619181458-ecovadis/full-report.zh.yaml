  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 估值视角
      - 概率信号
      - 必须成立的前提
    rows:
      - - 牛市
        - 当前 ARR 显著高于 2022 年 €100m 赞助方快照；净留存强劲；ESGR 合规加深护城河；碳和合作伙伴工作流复合增长
        - 2022 年独角兽底线的 1.6x-2.4x
        - 低到中
        - 管理层证明当前 ARR 续约质量强、投诉趋势干净，且合作伙伴集中度有限。
      - - 基准情形
        - EcoVadis 仍具战略相关性，但不透明度仍在，监管同时抬高价值与成本；增长延续， 但缺少足以决定性重估的证据
        - 2022 年独角兽下限的 1.0x-1.6x
        - 中
        - 当前 ARR 和留存足以守住 2022 年门槛，但还不足以抹掉不透明带来的折价。
      - - 熊市情形
        - Omnibus 削弱合规驱动的紧迫性，供应商负担拖慢参与，隐含经济性弱于规模指标所暗示的水平
        - 2022 年独角兽下限的 0.7x-1.0x
        - 中
        - ARR 增长温和、续约质量参差，或管理层无法证明经营杠杆和现金耐久性。
      - - 破裂情形
        - 一轮融资或战略事件暴露出留存疲弱、清算优先权压力沉重，或 ESGR 执行出现重大滑坡
        - 低于 2022 年独角兽下限的 0.7x
        - 低但不可忽视
        - 公开信息不透明，可能遮住一个没有网络故事那么耐久的业务。
    notes: 区间是基于情景的分析带，锚点是 2022 年独角兽身份这一公开事实，而不是新披露的 2026 年股权价值。
