  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与市场范围风险
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 对监管变化格外敏感，因为它的核心产品本身正被纳入监管，而许多帮助创造客户需求的披露制度又在收窄。EcoVadis 表示，其评级落入欧盟 ESG Ratings Regulation
              范围，并将申请 ESMA 授权；ESMA 和法律摘要则显示，存量供应商面临 2026 年 7 月 2 日申请启动、8 月 2 日通知截止、11 月 2 日授权截止的时间表。这形成了硬性运营里程碑：EcoVadis
              仅为继续在欧盟市场销售，就必须补上治理、投诉、方法披露和冲突控制基础设施。这一负担不是理论问题；EcoVadis 自己的 2026 年更新称，公司已经在调整方法治理、版本管理和咨询流程，以对齐规则。


              与此同时，短期由合规驱动的可服务市场正在被削减。ESG Today 和 EcoVadis 自己的监管评论显示，最终 Omnibus package 将 CSRD 收窄至员工超过 1,000 人且收入达到 €450
              million 以上的公司，并将 CSDDD 推至员工 5,000 人、收入 €1.5 billion，同时削弱责任和气候计划义务。EcoVadis
              认为，即便门槛移动，风险管理和采购韧性仍然重要；这个判断方向上成立，但也凸显风险：部分需求可能仍具战略性，可 EcoVadis
              销售叙事里的紧迫感，有一部分来自广泛强制披露和尽职调查铺开，而这些铺开现在已显著变小。因此，公司在 2026 年面临双重挤压：评级供给侧成本和审查上升，需求侧立刻受监管的买方池却变窄。
