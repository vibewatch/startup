        - 监管、方法论负担、Omnibus 需求收窄和披露不透明，仍都是活跃承保风险。
      - - 估值立场
        - 高于 2022 年独角兽底线 1.0x 的部分未知
        - 没有当前 ARR、留存、现金和优先权证据时，不要显著高于公开 2022 年独角兽门槛出价。
      - - 基础入场纪律
        - 约为 2022 年独角兽底线的 1.0x
        - 只有管理层证明当前 ARR 和续约质量强劲，才可承保接近上一次已验证门槛的价格。
      - - 上行情景条件
        - 只有当前 ARR 远高于 2022 年赞助方快照，且监管强化护城河的速度快于成本上升，1.6x-2.4x 门槛才可能成立
        - 牛市上行是有条件的，不是公开事实。
    notes: 门槛指 EcoVadis 在 2022 年成为独角兽所隐含的公开最低值；它是情景锚点，不是当前报价。
