  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: technical-assurance
    missingEvidence: Public or customer-shareable uptime history, SLA commitments, security-certification register, privacy attestations, and infrastructure-control documentation.
    whyItMatters: These materials are needed to test platform reliability, security posture, and enterprise readiness beyond marketing and partner claims.
    diligencePath: Request the trust center package, security questionnaires, certification inventory, and recent uptime or incident reporting used in enterprise procurement.
    relatedQuestionRefs:
    - QE025
    - QE026
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: api-and-connector-depth
    missingEvidence: Developer-facing API references, connector schemas, field dictionaries, and implementation examples for procurement or reporting integrations.
    whyItMatters: Public evidence proves integration positioning but not implementation depth, data model quality, or integration-maintenance burden.
    diligencePath: Request API documentation, sample payloads, connector installation guides, and a live demo of a customer integration.
    relatedQuestionRefs:
    - QE015
    - QE016
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: carbon-reliability-validation
    missingEvidence: Independent validation of Carbon Data Reliability Levels, PCF data quality improvement, and error-rate reduction versus industry-average methods.
    whyItMatters: Carbon Data Network claims are strategically important, but investors still need proof that data reliability and workflow outcomes are materially better than alternatives.
    diligencePath: Request third-party validation studies, customer before/after comparisons, and audit findings tied to CAM or CDN deployments.
    relatedQuestionRefs:
    - QE014
    - QE023
    - QE027
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: worker-voice-outcomes
    missingEvidence: Public grievance volumes, resolution times, remediation rates, retaliation safeguards, and buyer adoption metrics for Worker Voice workflows.
    whyItMatters: Worker voice is differentiated and strategically important, but public outcome metrics are too thin to assess whether the capability is mature at scale.
    diligencePath: Request anonymized case-volume dashboards, remediation SLA reports, and buyer references using Worker Voice Connect or Ulula inside active programs.
    relatedQuestionRefs:
    - QE020
    - QE021
    - QE024
    relatedTableRefs:
    - TE001
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: module-adoption-and-economics
    missingEvidence: Module-level adoption, attach rates, renewal patterns, and usage depth across Ratings, IQ Plus, carbon, and worker-voice products.
    whyItMatters: Product breadth is clear, but underwriting product defensibility and revenue quality requires proof that newer modules are not just marketing adjacencies.
    diligencePath: Request module-level customer counts, attach and renewal cohorts, and case studies showing production usage across procurement, carbon, and worker-voice workflows.
