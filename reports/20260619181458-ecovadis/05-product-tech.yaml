- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role in operating model
  - Public evidence
  - Dependency or risk
  rows:
  - - Methodology and standards layer
    - Defines themes, criteria, and alignment to external frameworks
    - 21 criteria across four themes; aligned to GRI, UNGC, ISO-style standards
    - If methodology changes or regulatory definitions shift, scores and comparability can move
  - - Supplier input layer
    - Collects questionnaires, documents, and direct supplier data
    - Customized questionnaires, up to 27 verified documents, carbon reporting inputs, PCF tooling
    - Public sources do not disclose validation throughput, rejection rates, or API field schemas
  - - Assessment and risk engine layer
    - Turns supplier inputs and external data into ratings, risk profiles, and dashboards
    - Analyst verification, 360° Watch, supplier-specific risk models, and carbon reliability checks
    - No public architecture diagram, model governance pack, or uptime metrics
  - - Buyer workflow layer
    - Lets enterprises compare suppliers, manage actions, and export reporting data
    - Scorecards, corrective actions, dashboards, pre-filled reports, and climate metrics
    - Public pages show outputs but not permissioning, audit logs, or retention controls
  - - Worker voice layer
    - Adds anonymous grievance and worker-feedback signals to due-diligence workflows
    - Ulula channels across SMS, WhatsApp, IVR, apps, surveys, and dashboards
    - No public case-volume or remediation-SLA statistics
  - - Ecosystem integration layer
    - Moves EcoVadis data into procurement, carbon-accounting, and reporting tools
    - API statement plus JAGGAER, Workiva, Watershed, Sweep, and Normative references
    - Public integration depth is described functionally rather than with inspectable connector specs
  notes: This is an evidence-backed operating architecture, not a software-stack diagram. The fetched corpus describes inputs, scoring, workflows, and integrations more clearly than backend systems or infrastructure controls.
