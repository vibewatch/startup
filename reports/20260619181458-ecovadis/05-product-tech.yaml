chapter:
  number: 5
  title: Product & Technology
  summary: EcoVadis publicly shows a broad procurement-centric sustainability intelligence suite spanning analyst-validated ratings, contactless risk screening, carbon collaboration, and worker-voice workflows, with a defensible data and standards story but limited inspectable technical internals. The strongest evidence supports methodology-backed workflow depth, partner distribution, and supplier-data reuse; the weakest area is public disclosure of APIs, architecture, uptime, security certifications, and module-level adoption economics.
sections:
- id: product-suite-and-customer-jobs
  title: Product suite, users, and procurement jobs-to-be-done
  body: EcoVadis does not present as a single-feature ESG tool. The fetched current surfaces show a procurement-centered suite that starts with supplier sustainability ratings, extends into contactless risk intelligence and light questionnaires, and then broadens into carbon collaboration, worker voice, and partner-connected reporting workflows. Public product and pricing pages split the suite across Sustainability Ratings, IQ Plus, Vitals, Carbon Action Manager, Product Carbon Footprint tooling, and broader risk-management packaging. That breadth matters because the company is not only scoring suppliers; it is trying to sit inside onboarding, risk triage, corrective action, carbon reporting, and enterprise procurement operations. The monetization and packaging evidence is real, but it is not fully transparent. EcoVadis clearly exposes customized questionnaires, expert-validated assessments, scorecards, medals, and trading-partner rating rights while still withholding usable list prices
    on key plans. The product thesis is therefore strong on workflow coverage and weaker on publicly inspectable commercial detail.
