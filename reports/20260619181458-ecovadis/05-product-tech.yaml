- id: methodology-data-model-and-operating-workflow
  title: Methodology, data model, and operating workflow
  body: The product’s most visible technical defensibility is methodological rather than architectural. The methodology overview, Ratings page, IQ Plus page, Vitals page, Carbon page, and JAGGAER integration page all describe a workflow built from structured questionnaires, supporting documents, analyst review, external monitoring, and reusable scorecards. EcoVadis explicitly discloses a 21-criteria framework across four themes, with inputs from customer-provided documentation, third-party endorsements, and 360° Watch external monitoring. IQ Plus then expands the operating model by letting buyers screen entire supply bases without first contacting each supplier, while Vitals adds a lighter direct-input questionnaire for broader due-diligence coverage. Carbon Action Manager extends the same operating logic into Scope 3 and product-carbon workflows by combining supplier reporting, reliability checks, carbon scorecards, and dashboards. The fetched corpus therefore supports a coherent data model
    built around supplier profiles, criteria, scorecards, documents, dashboards, and corrective action loops even though it does not expose backend architecture diagrams or public API schemas.
