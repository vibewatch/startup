- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - Workflow job
  - Evidence-backed status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Sustainability Ratings
    - Suppliers and procurement teams
    - Run full sustainability assessments and share scorecards
    - Clearly GA and deeply packaged on current pricing and solution pages
    - Analyst-validated scorecards, medals, corrective actions, and network reuse
    - No public module ARR, renewal, or transparent list pricing
  - - IQ Plus
    - Procurement, compliance, and risk teams
    - Screen the supply base without first contacting every supplier
    - Clearly GA on current product page
    - Contactless AI-powered mapping plus document and live-news layers
    - No public false-positive, model-accuracy, or workflow-volume metrics
  - - Vitals
    - Procurement and due-diligence teams
    - Collect lighter direct supplier data at scale
    - Clearly active and positioned as IQ Plus companion
    - Free 30-minute questionnaire with multilingual onboarding and regulatory dashboards
    - No public completion-rate or conversion-to-Ratings data
  - - Carbon Action Manager / Carbon Data Network / PCF
    - Procurement, sustainability, and reporting teams
    - Collect primary supplier carbon data and move it into Scope 3 workflows
    - Clearly active, with 2025-2026 launch and partner-expansion evidence
    - Supplier collaboration, reliability scoring, 35+ metrics, and downstream partner integrations
    - No public independent benchmark on data-quality uplift or module adoption by cohort
  - - Worker Voice / Ulula
    - Responsible sourcing and human-rights teams
    - Capture anonymous worker feedback and grievance resolution signals
    - Clearly active on LP and risk-management pages, but still newer than Ratings
    - Direct worker channels add a new data source beyond audits and questionnaires
    - No public grievance-resolution rates, alert volumes, or long-term customer outcome data
  notes: This matrix covers the modules that were publicly identifiable in the fetched 2025-2026 EcoVadis product corpus; commercial packaging is more visible than module-specific economics or adoption depth.
