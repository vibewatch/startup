  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: current-arr-and-retention
      missingEvidence: Current ARR gross margin NRR/GRR churn and renewal cohort data for the consolidated company.
      whyItMatters: Without current recurring-revenue quality metrics the 2022 unicorn threshold cannot be responsibly moved up or down with confidence.
      diligencePath: Request the latest board pack or management accounts with ARR bridge cohort retention gross margin and cash-burn commentary.
      relatedQuestionRefs: [QV018]
      relatedTableRefs: [TV006]
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-and-preferences
      missingEvidence: Current cap table liquidation preferences participating features convertibles and any debt seniority.
      whyItMatters: Enterprise-value scenarios are not the same as common-equity outcomes when a heavily funded private company has layered preference rights.
      diligencePath: Request the cap table charter summary and waterfall model used internally for board and financing analysis.
      relatedQuestionRefs: [QV031]
      relatedTableRefs: [TV006]
    - type: private-evidence-only
      severity: material
      topic: esgrr-readiness
      missingEvidence: A dated status update on ESMA notification application readiness governance owners and any identified blockers.
      whyItMatters: If ESGR readiness is weaker than public messaging suggests regulatory burden becomes a valuation discount rather than a moat enhancer.
      diligencePath: Request the ESGR authorization workplan owners external counsel memo and milestone tracker.
      relatedQuestionRefs: [QV032]
      relatedTableRefs: [TV005, TV006]
