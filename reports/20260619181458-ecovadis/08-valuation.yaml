  researchQuestions:
    - {id: QV001, question: What is the last hard public equity-value anchor for EcoVadis today?, type: verification, targets: [contentRequirements/2], status: answered}
    - {id: QV002, question: Did the 2022 financing clearly put EcoVadis above unicorn status?, type: verification, targets: [contentRequirements/2], status: answered}
    - {id: QV003, question: What public evidence exists on total capital raised and sponsor quality?, type: enumeration, targets: [contentRequirements/2], status: answered}
    - {id: QV004, question: What public sponsor or investor pages still confirm continuing backing in 2026?, type: freshness, targets: [contentRequirements/2], status: answered}
    - {id: QV005, question: What current scale proxies are publicly disclosed for rated companies subscribers and employees?, type: quantification, targets: [contentRequirements/0], status: answered}
    - {id: QV006, question: Does EcoVadis now show a mature executive bench beyond the founders?, type: verification, targets: [contentRequirements/0], status: answered}
    - {id: QV007, question: How does the public pricing architecture show breadth of monetization?, type: mechanism, targets: [contentRequirements/0, plannedTables/recommendation-summary-table], status: answered}
    - {id: QV008, question: Does the public product ladder imply land-and-expand or upsell potential?, type: mechanism, targets: [contentRequirements/0, plannedTables/thesis-anti-thesis-table], status: answered}
    - {id: QV009, question: Do company materials explicitly connect EcoVadis ratings to value creation or profitability?, type: verification, targets: [contentRequirements/0], status: answered}
    - {id: QV010, question: Do workflow partners show that EcoVadis scores affect real supplier or buyer decisions?, type: verification, targets: [contentRequirements/0], status: answered}
    - {id: QV011, question: How burdensome can the EcoVadis process be for suppliers and rated companies?, type: adverse, targets: [contentRequirements/0], status: answered}
    - {id: QV012, question: Does the EU ESG Ratings Regulation raise transparency and compliance costs for providers like EcoVadis?, type: freshness, targets: [contentRequirements/0], status: answered}
    - {id: QV013, question: Does the final Omnibus package reduce the near-term regulated demand backdrop that EcoVadis can sell into?, type: adverse, targets: [contentRequirements/0], status: answered}
    - {id: QV014, question: Are private companies more exposed if ESG ratings move toward public-only evidence?, type: comparison, targets: [contentRequirements/0], status: answered}
    - {id: QV015, question: Are ESG ratings structurally divergent across providers in ways that justify a valuation discount?, type: comparison, targets: [contentRequirements/0], status: answered}
