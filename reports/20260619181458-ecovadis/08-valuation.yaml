schemaVersion: report-v2
artifact: valuation
slug: ecovadis
runDate: '2026-06-19'
company:
  name: EcoVadis
chapter:
  number: 8
  title: Valuation
  summary: >-
    EcoVadis looks like a strategically relevant private sustainability-ratings and workflow
    platform, but the public record supports scenario discipline more than a fresh 2026 point
    estimate. The last hard external anchor is the 2022 unicorn financing; upside exists if
    current ARR and retention are far above the 2022 sponsor snapshot and regulation hardens
    moat, while downside grows if Omnibus narrows compliance-led demand, methodology burden
    rises, and disclosure opacity hides weaker economics. The evidence therefore supports a
    research-more posture and treating any valuation materially above the 2022 unicorn
    threshold as stretched until management discloses current ARR, retention, cash, cap-table
    and ESMA-readiness detail.
sections:
  - id: valuation-boundary-and-known-anchors
    title: Public-data boundary and known valuation anchors
    body: >-
      The first rule for valuing EcoVadis is to separate what is actually public from what is
      merely plausible. Public evidence does confirm a very large 2022 financing event,
      continuing sponsorship from Astorg and General Atlantic, and substantial operating
      scale. EcoVadis said in June 2022 that it raised $500 million, bringing total capital
      raised above $725 million, while Goodwin described that round as the event that made
      EcoVadis the 27th French unicorn. Astorg still presents a 2022 acquisition snapshot
      with €100 million ARR, 1,912 headcount, 700-plus enterprise procurement teams and
      55,000-plus suppliers. EcoVadis' current company pages add fresher but still
      non-financial scale markers: more than 150,000 rated companies, more than 100,000
      active rated subscribers, and a team of more than 1,900 people. What the public
      record does not provide is the piece that matters most for valuation discipline:
      current 2026 ARR, growth, retention, margin, debt, cash, or preference-stack detail.
      Companies House gives only a local UK entity filing surface, not consolidated
      economics. That means the right valuation frame is not a precise marked price but a
      constrained set of anchors: a verified 2022 unicorn threshold, a stale 2022 ARR
      snapshot, and a 2024-2026 operating-scale story that clearly implies maturity but
      still does not solve current unit economics.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: strategic-assets-that-could-justify-a-premium
    title: Strategic assets that could justify a premium to generic procurement software
    body: >-
      The positive valuation case is real even without current financial disclosure. EcoVadis
      has a multi-layered monetization surface, not a single survey product. The pricing
      page shows a separate Carbon Rating offer and a tiered Sustainability Ratings ladder
      from Basic to Premium, Select and Corporate, which signals land-and-expand design,
      service-based upsell, and cross-sell into carbon workflows. Partner pages show that
      scores are not ornamental. JAGGAER exposes EcoVadis scorecards, medals, benchmarking
      and corrective-action workflows directly inside supplier management, and says the
      resulting scorecards can help suppliers gain or retain business. Workiva frames
      EcoVadis as one of the leading supply-chain ESG risk platforms and describes a
      weeks-long, evidence-heavy assessment whose outputs matter for disclosure and value-
      chain decision-making. The Bain–EcoVadis study goes further by arguing that advanced
      performance on selected sustainability topics correlates with stronger profitability or
      growth. Even if that study is self-interested, it clarifies why the business can
      matter strategically: procurement, carbon, due-diligence and finance users can all
      justify budget for the same underlying data layer. Combined with the current scale
      signals of 150,000-plus rated companies and 100,000-plus active rated subscribers, the
      bull case is that EcoVadis is closer to infrastructure for supply-chain sustainability
      intelligence than to a narrow vendor questionnaire tool.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV014, CV015, CV016, CV017, CV018]
    tableRefs: [TV002]
    figureRefs: [FV004]
  - id: why-the-discount-has-to-stay-wide
    title: Why the discount has to stay wide despite platform quality
    body: >-
      The reason not to underwrite EcoVadis like a premium public data franchise is that
      nearly every attractive feature comes with a visible counterweight. ESG Today and IMD
      both describe the EU ESG Ratings Regulation as a force that will raise transparency,
      governance and authorization burdens on providers like EcoVadis from 2026 onward. The
      same ESG Today coverage shows that the final Omnibus package cuts the near-term
      regulatory footprint of CSRD and CSDDD far more aggressively than originally proposed,
      leaving less naturally regulated demand even while raters face more oversight.
      Sustainalytics' move to public-only inputs matters for EcoVadis because private firms
      experienced larger score changes when non-public data was removed, which supports the
      view that methodology and evidence rules can materially alter outcomes for lightly
      disclosing companies. Academic sources sharpen the same point: the Open Research
      Europe survey says ESG ratings have low correlation across providers, while the MDPI
      critical review says divergence, unclear definitions and uneven reporting create
      reliability problems. That backdrop is the core valuation discount. EcoVadis may be
      strategically important, but it is still selling an evidence-heavy score into a market
      where methodology burden is rising, comparability is contested, and the company itself
      does not disclose the current ARR and retention metrics that would justify paying a
      public-style premium multiple.
    claimRefs: [CV019, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029]
    tableRefs: []
    figureRefs: [FV002]
  - id: comparable-lens-and-scenario-framework
    title: Comparable lens and scenario framework
    body: >-
      Public comparables are useful for direction, not for precision. MSCI and Moody's show
      that trusted ratings, data and risk franchises can support very large public values:
      CompaniesMarketCap lists them at roughly $42.26 billion and $78.72 billion
      respectively in June 2026, while their investor materials emphasize broad data,
      analytics and risk infrastructure. But those are much broader, more transparent, and
      more financially disclosed franchises than EcoVadis. Intertek and SGS are the
      opposite lesson: both prove that trust, assurance and compliance businesses can be
      worth billions in public markets, but their operating models are more service-heavy
      and their economics are not the right benchmark for a software-and-network story.
      Sedex and LRQA are useful private adjacencies because they demonstrate that buyers will
      pay for due-diligence, audit and transparency infrastructure in supply chains, but they
      still do not solve EcoVadis' own current price. The right way to use this set is to
      bracket EcoVadis between premium data franchises and scaled assurance businesses, then
      add a private-company opacity discount. Under that framework, the base case should
      revolve around the public minimum implied by 2022 unicorn status rather than a fresh
      top-down mark. Above-threshold upside requires proof that ARR has grown far beyond the
      2022 €100 million sponsor snapshot and that regulation strengthens moat faster than it
      raises cost. Below-threshold downside becomes plausible if compliance-led demand
      shrinks, supplier burden slows participation, or hidden retention and margin quality
      are weaker than the scale story suggests.
    claimRefs: [CV003, CV020, CV030, CV031, CV032, CV033, CV034, CV035, CV036, CV037, CV038, CV039]
    tableRefs: [TV003, TV004]
    figureRefs: [FV003]
  - id: recommendation-posture-and-diligence-gates
    title: Recommendation posture, diligence gates and exit readiness
    body: >-
      Taken together, the evidence supports a research-more recommendation rather than a
      clean buy or avoid call. EcoVadis has enough visible quality to stay investable:
      scale, sponsor quality, a multi-product ratings-and-carbon stack, real workflow
      embedding, and a regulatory backdrop that could increase the strategic value of
      trusted supplier data. But the recommendation cannot be stronger than the evidence.
      There is still no clean public 2026 ARR, net retention, gross margin, cash, debt,
      complaint-volume or cap-table disclosure; no public confirmation of ESMA filing
      progress; and no public breakdown of partner concentration or the share of growth that
      still depends on broad compliance narratives weakened by Omnibus. That makes the fair
      posture price-sensitive and conditional. A disciplined investor should treat valuation
      as unknown above the 2022 unicorn threshold, potentially fair around that threshold if
      current ARR and retention are strong, and stretched above it until diligence proves
      otherwise. Exit-wise, the public record supports strategic-acquirer logic more readily
      than near-term IPO logic: the market clearly values data, risk and assurance
      franchises, but public investors would demand much stronger disclosure than EcoVadis
      currently provides. The priority task is therefore not to refine decimal places on
      valuation, but to convert opacity into verifiable underwriting inputs.
    claimRefs: [CV020, CV035, CV036, CV037, CV038, CV039, CV040, CV041, CV042, CV043, CV044]
    tableRefs: [TV005, TV006]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Position, Evidence-constrained implication]
    rows:
      - [Recommendation, Research More, Business quality is credible but current financial and cap-table opacity is too high for a buy call.]
      - [Confidence, Medium, There is enough evidence to frame scenarios but not enough to publish a fresh 2026 point estimate.]
      - [Risk Rating, High, 'Regulation methodology burden Omnibus demand narrowing and disclosure opacity all remain live underwriting risks.']
      - [Valuation Stance, Unknown above 1.0x 2022 unicorn floor, Do not pay materially above the public 2022 unicorn threshold without current ARR retention cash and preference evidence.]
      - [Base Entry Discipline, Around 1.0x 2022 unicorn floor, A price near the last verified threshold can be underwritten only if management proves strong current ARR and renewal quality.]
      - [Upside Condition, 1.6x-2.4x threshold possible only if current ARR is far above the 2022 sponsor snapshot and regulation hardens moat faster than cost, Bull upside is conditional not a public fact.]
    notes: Threshold means the public minimum implied by EcoVadis becoming a unicorn in 2022; it is a scenario anchor, not a quoted current mark.
    claimRefs: [CV001, CV002, CV020, CV039, CV040, CV041, CV042, CV043]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Dimension, Thesis, Anti-thesis]
    rows:
      - [Platform role, EcoVadis sits in procurement carbon and due-diligence workflows that can become strategic infrastructure, Embedded workflows can also reduce EcoVadis to an upstream data component controlled by partners or buyers.]
      - [Monetization breadth, Tiered ratings carbon products and enterprise packages suggest more than one recurring revenue stream, Public pages still hide realized pricing discounting ACV and renewal structure.]
      - [Demand drivers, Regulation and supply-chain scrutiny make trusted supplier data more relevant over time, Omnibus sharply narrows near-term mandatory reporting scope weakening part of the urgency story.]
      - [Scale signals, 150000+ rated companies 100000+ active rated subscribers and 1900+ employees imply real market presence, Scale proxies do not reveal current ARR gross margin net retention debt or cash.]
      - [Methodology position, Evidence-based scoring and governance upgrades can deepen trust if executed well, Academic analyst and market sources all show ESG rating divergence methodological burden and transparency risk.]
      - [Valuation setup, 2022 sponsor backing and unicorn status give a hard minimum external anchor, That anchor is stale; without fresh economics valuation above it can become narrative-driven rather than evidence-driven.]
    notes: Bull and bear cases are intentionally paired to keep the recommendation price-sensitive and evidence-sensitive.
    claimRefs: [CV006, CV010, CV011, CV014, CV015, CV018, CV019, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Core assumptions, Valuation lens, Probability signal, What must be true]
    rows:
      - [Bull, Current ARR is materially above the 2022 €100m sponsor snapshot; net retention is strong; ESGR compliance deepens moat; carbon and partner workflows compound growth, 1.6x-2.4x of the 2022 unicorn floor, Low to medium, Management proves current ARR strong renewal quality clean complaint trends and limited partner concentration.]
      - [Base, EcoVadis remains strategically relevant but opacity persists and regulation increases both value and cost; growth continues without decisive re-rating evidence, 1.0x-1.6x of the 2022 unicorn floor, Medium, Current ARR and retention are healthy enough to defend the 2022 threshold but not strong enough to erase the opacity discount.]
      - [Bear, Omnibus cuts compliance-led urgency supplier burden slows participation and hidden economics are weaker than scale metrics imply, 0.7x-1.0x of the 2022 unicorn floor, Medium, ARR growth is modest renewal quality is mixed or management cannot show operating leverage and cash durability.]
      - [Break case, A financing or strategic event exposes weak retention heavy preference overhang or material ESGR execution slippage, Below 0.7x of the 2022 unicorn floor, Low but non-trivial, Public opacity hides a business that is less durable than the network story suggests.]
    notes: Ranges are analytical scenario bands anchored to the public fact of 2022 unicorn status rather than a newly disclosed 2026 equity value.
    claimRefs: [CV002, CV003, CV016, CV017, CV018, CV020, CV021, CV035, CV036, CV037, CV038, CV039, CV040, CV041]
  - id: TV004
    title: Comparable valuation table
    columns: [Comparable, Type / lens, Public metric, Valuation / status, Relevance, Main limitation]
    enumerationScope:
      coverage: partial
      basis: Covers the most decision-useful public comparables and adjacencies fetched for this chapter across data-and-ratings franchises, assurance providers and supply-chain transparency platforms; it excludes non-public revenue multiples and confidential M&A data not available from public evidence.
    rows:
      - [MSCI, Public sustainability / analytics franchise, June 2026 market cap about $42.26B; 2024 revenue growth nearly 13%, Large disclosed public franchise, Shows how durable data-and-ratings infrastructure can command premium public value, Much broader more transparent and more financially disclosed than EcoVadis.]
      - [Moody's, Public risk / ratings / data franchise, June 2026 market cap about $78.72B; about 16000 employees in 40+ countries, Large disclosed public franchise, Useful upper-bound lens for trusted risk-data economics and disclosure standards, Credit/data mix is broader than sustainability procurement workflows.]
      - [Intertek, Public assurance / TIC provider, June 2026 market cap about $11.79B; 2025 revenue £3.43bn; adjusted margin 18.1%, Scaled assurance and compliance operator, Useful for trust inspection and due-diligence market value, Service-heavy economics differ from a networked ratings software model.]
      - [SGS, Public testing / inspection / certification provider, June 2026 market cap about $22.26B; 100000 employees and 2500 offices/labs, Scaled global assurance operator, Shows size of large trust-and-compliance infrastructure markets, Operational footprint and capital intensity are very different from EcoVadis.]
      - [Sedex, Private supply-chain transparency platform, 95000 businesses and 115000 supply-chain sites; SMETA is a leading audit method, Private adjacency no public valuation in fetched evidence, Confirms buyer demand for multi-buyer data sharing audits and due-diligence workflows, No usable public valuation or margin disclosure.]
      - [LRQA, Private responsible sourcing and assurance platform, Positions responsible sourcing as connected risk management with assurance advisory and data-driven intelligence, Private adjacency no public valuation in fetched evidence, Confirms that responsible sourcing and ongoing supply-chain monitoring are crowded strategic workflows, No public financials and broader assurance mix reduce comparability.]
      - [JAGGAER + EcoVadis integration, Workflow adjacency not direct valuation comp, EcoVadis scorecards benchmarking and corrective actions sit inside procurement workflows, Strategic relevance comp not a market multiple, Shows EcoVadis can become part of the buyer system of record, Helps explain moat and disintermediation risk but does not provide a clean valuation benchmark.]
    notes: This table is qualitative by design; the public record supports strong reference points for quality and market category but not a clean current EcoVadis multiple.
    claimRefs: [CV013, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV031, CV032, CV033, CV034, CV035]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [Trigger, Threshold or event, Transmission to thesis, Action implication]
    rows:
      - [Current ARR / retention data disappoints, Management cannot show ARR materially above the 2022 sponsor snapshot or shows weak renewal quality, Base case around the 2022 threshold loses support, Reset to bear case demand lower price or step away.]
      - [ESGR readiness slips, No credible evidence of notification filing readiness or governance implementation as 2026 deadlines approach, Cost rises while continuity and reputation risk increase, Raise risk rating and suspend premium-multiple logic.]
      - [Omnibus-driven demand compression persists, Pipeline remains tied to now-narrowed mandatory compliance use cases with weak strategic offset, Narrative premium over assurance-like peers erodes, Cut bull probability and move valuation lens toward or below threshold.]
      - [Supplier burden / methodology disputes rise, Complaints appeals or evidence burdens worsen without better transparency or conversion, Network effects weaken and customer trust becomes less durable, Apply extra discount to growth and retention assumptions.]
      - [Partner concentration is high, A major embedded platform owns the buyer relationship or drives a large share of bookings, EcoVadis becomes a component not the control point, Treat upside as capped until concentration and economics are disclosed.]
    notes: Triggers are observable or diligencable events that can move the recommendation without pretending public investors already have perfect data.
    claimRefs: [CV015, CV016, CV017, CV018, CV020, CV021, CV035, CV036, CV037, CV038, CV040]
  - id: TV006
    title: Final diligence asks table
    columns: [Priority, Diligence ask, Why it matters, Blocker if absent]
    rows:
      - [P1, Current ARR bridge gross margin NRR/GRR and renewal cohorts, Determines whether the 2022 unicorn floor is still defendable or stale, Yes]
      - [P1, Cash debt burn covenant and liquidity runway detail, Separates durable scale from capital-supported scale, Yes]
      - [P1, Cap table and liquidation preference waterfall, Required to convert enterprise-value scenarios into actual equity outcomes, Yes]
      - [P1, ESGR authorization workplan owners and milestone evidence, Tests whether regulation is a moat enhancer or an execution hazard, Yes]
      - [P2, Partner revenue concentration commercial terms and roadmap governance for key integrations, Clarifies whether partner embedding deepens moat or caps bargaining power, No but affects upside weighting]
      - [P2, Complaint appeal score-reversal and supplier-completion metrics, Tests whether methodology burden is manageable at scale or a hidden churn source, No but affects downside probability]
    notes: P1 items are minimum underwriting requirements for a serious price conversation; P2 items mainly reweight the bull and bear cases.
    claimRefs: [CV020, CV035, CV036, CV037, CV038, CV039, CV040, CV041, CV042, CV044]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation is driven by the tension between visible platform quality and missing current financial disclosure.
    data:
      nodes:
        - id: anchors
          label: Known anchors
          description: 2022 $500m round unicorn status sponsor backing current scale proxies
        - id: assets
          label: Strategic assets
          description: Tiered pricing carbon products workflow embedding procurement relevance
        - id: burdens
          label: Discount factors
          description: ESGR burden Omnibus demand cuts methodology divergence supplier burden
        - id: opacity
          label: Missing economics
          description: No public 2026 ARR NRR margin cash debt or cap-table detail
        - id: posture
          label: Research More
          description: Treat value as scenario-based; do not underwrite a fresh premium point estimate
      edges:
        - {from: anchors, to: posture, label: creates minimum floor context}
        - {from: assets, to: posture, label: supports investability}
        - {from: burdens, to: posture, label: forces discount}
        - {from: opacity, to: posture, label: blocks precise pricing}
    approximationNotes: Decision flow is analytical and summarizes how evidence is weighted; it is not a management-provided investment memo.
    claimRefs: [CV001, CV002, CV006, CV010, CV015, CV016, CV017, CV018, CV020, CV039, CV042]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Illustrative impact of the biggest evidence items on valuation confidence using a simple analytical point system.
    data:
      items:
        - {label: 2022 unicorn financing anchor, value: 2}
        - {label: Current scale proxies 150k+ / 100k+ / 1900+, value: 2}
        - {label: Pricing breadth and carbon cross-sell, value: 1}
        - {label: Workflow embedding and partner proof, value: 1}
        - {label: ESGR compliance burden, value: -2}
        - {label: Omnibus demand narrowing, value: -2}
        - {label: Methodology divergence / public-only pressure, value: -2}
        - {label: No public ARR / NRR / cash / cap table, value: -3}
    approximationNotes: Values are analytical confidence impacts on a notional score, not disclosed percentages or revenue deltas.
    claimRefs: [CV002, CV006, CV010, CV015, CV016, CV017, CV018, CV019, CV020, CV021, CV022, CV023, CV024, CV025, CV026]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Scenario bands are anchored to the public minimum implied by EcoVadis becoming a unicorn in 2022 rather than to an undisclosed current mark.
    data:
      items:
        - label: Bull case
          low: 1.6
          mid: 2.0
          high: 2.4
          notes: Requires ARR far above the 2022 sponsor snapshot strong retention and regulation deepening moat.
          claimRefs: [CV036]
        - label: Base case
          low: 1.0
          mid: 1.3
          high: 1.6
          notes: EcoVadis remains strategically relevant but opacity discount stays meaningful.
          claimRefs: [CV037]
        - label: Bear case
          low: 0.7
          mid: 0.85
          high: 1.0
          notes: Omnibus demand compression burden complaints and weaker economics pull value toward or below the 2022 floor.
          claimRefs: [CV038]
        - label: Break case
          low: 0.4
          mid: 0.55
          high: 0.7
          notes: A financing or diligence event reveals weak retention heavy preference overhang or material ESGR slippage.
          claimRefs: [CV041]
    approximationNotes: Multiples are x of the public 2022 unicorn floor (> $1B implied threshold), not fresh quoted equity values.
    claimRefs: [CV002, CV003, CV020, CV036, CV037, CV038, CV041]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-style scoring shows a good business with weaker evidence quality than price discipline requires.
    data:
      items:
        - label: Market / workflow relevance
          value: '4 / 5'
          detail: Procurement carbon and due-diligence workflows are clearly real and strategically useful.
          claimRefs: [CV013, CV014, CV017]
        - label: Platform / monetization breadth
          value: '4 / 5'
          detail: Tiered ratings carbon products and enterprise packages imply multiple recurring monetization paths.
          claimRefs: [CV010, CV011]
        - label: Disclosure quality
          value: '2 / 5'
          detail: The company discloses scale and sponsor quality but not the current economics needed for precise valuation.
          claimRefs: [CV012, CV020]
        - label: Regulatory positioning
          value: '3 / 5'
          detail: Regulation can deepen moat but also raises execution cost and methodology scrutiny.
          claimRefs: [CV016, CV017, CV018]
        - label: Comparable support
          value: '3 / 5'
          detail: Public peers validate category value but none are cleanly comparable to EcoVadis on disclosure and model mix.
          claimRefs: [CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029]
        - label: Valuation readiness
          value: '2 / 5'
          detail: Enough for scenario framing not enough for an aggressive price recommendation.
          claimRefs: [CV039, CV040, CV042]
    approximationNotes: Scores are analytical judgments based on the fetched evidence set and should be read as relative not objective ratings.
    claimRefs: [CV010, CV011, CV012, CV016, CV017, CV018, CV020, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV039, CV040, CV042]
callouts:
  - calloutType: recommendation
    title: Best public-data call is research more not price up the story
    body: EcoVadis has enough visible platform quality to stay on the investable list but not enough current economic disclosure to support a confident premium valuation call.
    claimRefs: [CV006, CV010, CV020, CV039, CV042]
  - calloutType: risk
    title: The main discount is evidence quality not just demand quality
    body: The biggest reason to stay disciplined is that current ARR NRR cash debt and preference-overhang data remain private while regulation and methodology burden are becoming more important not less.
    claimRefs: [CV016, CV019, CV020, CV041]
  - calloutType: assumption
    title: Bull upside needs more than scale proxies
    body: To justify value materially above the 2022 unicorn threshold management would need to prove strong current ARR growth healthy retention manageable complaint trends and limited partner concentration.
    claimRefs: [CV003, CV006, CV036, CV043]
