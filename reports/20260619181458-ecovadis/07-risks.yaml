  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-quality
    missingEvidence: Current 2026 ARR, gross margin, cash, debt, burn, NRR and renewal disclosure for the consolidated group.
    whyItMatters: Without current financial-quality metrics, outsiders cannot tell whether EcoVadis’ growth is durable, efficient or capital-dependent as regulation shifts.
    diligencePath: Request the latest board pack or investor update with ARR bridge, retention cohorts, cash runway and capital-structure detail.
    relatedQuestionRefs:
    - QR019
    - QR027
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: esma-authorization-status
    missingEvidence: A dated public or diligenced status update showing whether EcoVadis has notified ESMA, prepared its application package, or identified any authorization blockers.
    whyItMatters: The ESGR timetable is a hard continuity milestone for operating ratings in the EU, and public generic readiness language is weaker than milestone evidence.
    diligencePath: Request the ESGR workplan, filing checklist, external counsel memo and any ESMA correspondence or pre-notification record.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: execution-depth-and-support-capacity
    missingEvidence: Named owners, headcount and KPIs for methodology governance, complaint handling, supplier support and partner integration functions.
    whyItMatters: The risk stack in 2026 is execution-heavy, and public product pages do not show whether EcoVadis has enough operating depth to absorb regulation and burden complaints at scale.
    diligencePath: Request org charts, leadership assignments, complaint-volume trends, SLA metrics and support staffing by region or product.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: minor
    topic: partner-economics-and-concentration
    missingEvidence: Revenue mix, contract terms, exclusivity provisions and concentration by major ecosystem partners such as Workiva, Watershed and JAGGAER.
    whyItMatters: The public record proves workflow importance but not whether any one partner can materially compress pricing power or own the customer relationship.
    diligencePath: Request partner revenue attribution, termination terms, renewal dates and roadmap governance for major embedded partners.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR003
