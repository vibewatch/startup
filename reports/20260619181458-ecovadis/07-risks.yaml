- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - ESGR authorization failure or delay
    - ESMA register, EcoVadis disclosures, external legal updates
    - No visible notification/application progress by the late-2026 regulatory window or evidence of remediation demand from ESMA
    - Mark up regulatory risk immediately; treat EU continuity as impaired until resolved
  - - Omnibus-driven demand compression
    - Management pipeline mix, customer win themes, board commentary
    - Bookings or new logos remain heavily tied to now-narrowed CSRD/CSDDD compliance use cases with no offset from resilience or carbon workflows
    - Cut growth assumptions and discount policy-led TAM narrative
  - - Supplier-burden backlash
    - Review-site complaints, customer references, methodology update cadence
    - Persistent rise in complaints about cost, evidence burden, or opaque scoring without offsetting improvement in trust or conversion
    - Raise churn/conversion risk and test whether smaller suppliers are becoming structurally harder to monetize
  - - Financial-opacity persists into next financing or strategic event
    - Management diligence room, investor materials, statutory filings
    - Company still will not disclose current ARR, cash, debt, NRR or complaint trends when external capital or M&A is discussed
    - Treat opacity itself as a thesis-break on underwriting quality
  - - Partner disintermediation
    - Partner product launches, contract renewals, customer reference patterns
    - Major embedded partner begins to own the scoring/disclosure layer or materially downgrades EcoVadis prominence
    - Reassess whether EcoVadis remains strategic infrastructure or has become a replaceable data vendor
