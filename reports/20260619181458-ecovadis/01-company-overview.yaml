company:
  name: EcoVadis
chapter:
  number: 1
  title: Company Overview
  summary: EcoVadis is a Paris-founded private software and data company that sells sustainability ratings, scorecards, carbon, and supplier-risk tooling into procurement and supply-chain workflows. Public evidence cleanly supports the 2007 founding, continuing co-founder leadership, a large 2022 funding round, and a much larger 2024-2026 network footprint, but it does not cleanly disclose a current valuation, ARR, debt stack, or board/cap-table detail. The chapter should therefore be reused as the canonical identity and chronology layer, while later chapters preserve explicit gaps on current financial scale and governance depth.
sections:
- id: identity-business-model-and-scale
  title: Identity, headquarters, product, and current network scale
  body: 'EcoVadis presents itself as a Paris-founded provider of business sustainability ratings rather than as a generic ESG consultancy. Its own company page says the business was founded in 2007, launched in Paris, and has grown into a globally trusted provider of sustainability ratings. The same official corpus, plus Astorg''s investment page, describes a product stack that combines ratings, scorecards, intelligence, carbon tools, and collaborative performance-improvement workflows for global supply chains. That framing matters because it places EcoVadis at the intersection of procurement software, supplier-risk infrastructure, and sustainability reporting, not just in one-off advisory work.


    Public scale disclosures are strong but must be read chronologically. Official 2024 and 2026 materials talk about 150,000+ to 175,000+ businesses in the network, 44,000+ buyers, 1,300+ procurement organizations, and trillions of dollars of spend connected to sustainability insights. Older 2022-era sources instead cite 55,000+ suppliers or 95,000 businesses across 175 countries. These figures are not necessarily contradictory; they appear to reflect different dates and measurement lenses. What remains missing is a single, current, audited customer metric that cleanly distinguishes paid enterprise customers from rated companies, buyers, suppliers, and broader network participants.'
