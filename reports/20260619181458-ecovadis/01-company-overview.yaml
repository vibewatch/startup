  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-arr-gap
    missingEvidence: A current board-approved or audited disclosure of valuation, ARR, revenue run rate, and share count.
    whyItMatters: Without a current financial snapshot, this chapter can only anchor on older funding disclosures and investor-page metrics, which weakens valuation and financial-risk analysis.
    diligencePath: Request the latest financing deck, board package, or audited management accounts from the company or lead investors.
    relatedQuestionRefs:
    - QO014
    - QO015
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-disclosure-gap
    missingEvidence: A full board roster, committee map, and cap-table/control-rights summary for EcoVadis.
    whyItMatters: The public record shows executives and a purpose committee but not the formal control structure needed to assess investor rights, independence, and escalation paths.
    diligencePath: Obtain a current board deck, shareholder agreement summary, and official director list from management or lead investors.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: capital-structure-gap
    missingEvidence: Disclosure of debt facilities, credit lines, secondaries, or any off-balance-sheet financing arrangements.
    whyItMatters: Open sources currently support only equity-round history, leaving leverage, liquidity cushions, and shareholder-liquidity signals largely unknown.
    diligencePath: Ask management and lead investors for debt schedules, facility agreements, and secondary-transaction history.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: customer-definition-gap
    missingEvidence: A single current definition and count for paying enterprise customers versus rated companies, suppliers, buyers, and procurement organizations.
    whyItMatters: The company publishes several ecosystem metrics, but valuation and GTM work need a cleaner denominator for contracted revenue-bearing customers.
    diligencePath: Request current KPI definitions from investor reporting or customer-success operations and reconcile them to billing counts.
    relatedQuestionRefs:
    - QO005
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: leadership-change-log-gap
    missingEvidence: A dated changelog or press trail showing which executives joined or left over the last 24 months.
    whyItMatters: The current leadership page shows a broad bench, but without a dated change log the chapter cannot confidently call out recent leadership turnover or stability.
    diligencePath: Review archived leadership pages, press releases, and LinkedIn / executive biographies in a follow-up refresh focused on leadership chronology.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount-vintage-gap
    missingEvidence: A dated employee count that reconciles the 1,300, 1,700, and 1,912 public workforce signals.
    whyItMatters: Headcount is a key scale metric and current open-source signals use different dates or contexts, making a single 2026 figure unsafe to assert.
    diligencePath: Request an as-of-date HR headcount or audited people metric from management, and map each public figure to its date and definition.
    relatedQuestionRefs:
    - QO016
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage-gap
    missingEvidence: A comprehensive corporate timeline with exact dates for major launches, acquisitions, governance changes, and geographic expansions.
    whyItMatters: The public milestone set is strong enough for chapter reuse, but it is still assembled from different source types and therefore not guaranteed exhaustive.
    diligencePath: Request an investor or corporate-history timeline and reconcile it against public announcements for exact date completeness.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO004
