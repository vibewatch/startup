- id: funding-history-and-kpi-coverage
  title: Funding history, investors, and how far public KPI coverage really goes
  body: 'EcoVadis'' funding history is visible in broad strokes. The company page records Partech funding in 2016 and a €200 million CVC round plus Bain minority investment in 2020. The most fully supported financing event is the June 2022 round: the official press release, Business Wire republication, Astorg page, and General Atlantic page all support a $500 million financing led by Astorg and BeyondNetZero / General Atlantic, with GIC and Princeville also named. Those materials also state that total capital raised exceeded $725 million and that CVC remained the largest institutional shareholder after the round.


    The harder problem is not equity history but current KPI precision. Astorg''s investment page gives a useful but undated/at-acquisition-style snapshot of €100 million ARR, 1,912 headcount, Paris headquarters, and 700+ enterprise procurement teams reaching 55,000+ suppliers. Official 2024-2026 materials give fresher network numbers, but they do not cleanly restate current ARR, valuation, debt, secondaries, or cap-table concentration. As a result, the best public conclusion is that EcoVadis is a late-growth private company with substantial equity backing and broad ecosystem penetration, while its current valuation and financial run rate remain only partially visible from open sources.'
