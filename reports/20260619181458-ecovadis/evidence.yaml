evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-arr-gap
    missingEvidence: A current board-approved or audited disclosure of valuation, ARR, revenue run rate, and share count.
    whyItMatters: >-
      Without a current financial snapshot, this chapter can only anchor on older funding disclosures and investor-page
      metrics, which weakens valuation and financial-risk analysis.
    diligencePath: >-
      Request the latest financing deck, board package, or audited management accounts from the company or lead
      investors.
    relatedQuestionRefs:
      - QO014
      - QO015
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-disclosure-gap
    missingEvidence: A full board roster, committee map, and cap-table/control-rights summary for EcoVadis.
    whyItMatters: >-
      The public record shows executives and a purpose committee but not the formal control structure needed to assess
      investor rights, independence, and escalation paths.
    diligencePath: >-
      Obtain a current board deck, shareholder agreement summary, and official director list from management or lead
      investors.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: capital-structure-gap
    missingEvidence: Disclosure of debt facilities, credit lines, secondaries, or any off-balance-sheet financing arrangements.
    whyItMatters: >-
      Open sources currently support only equity-round history, leaving leverage, liquidity cushions, and
      shareholder-liquidity signals largely unknown.
    diligencePath: Ask management and lead investors for debt schedules, facility agreements, and secondary-transaction history.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-definition-gap
    missingEvidence: >-
      A single current definition and count for paying enterprise customers versus rated companies, suppliers, buyers,
      and procurement organizations.
    whyItMatters: >-
      The company publishes several ecosystem metrics, but valuation and GTM work need a cleaner denominator for
      contracted revenue-bearing customers.
    diligencePath: >-
      Request current KPI definitions from investor reporting or customer-success operations and reconcile them to
      billing counts.
    relatedQuestionRefs:
      - QO005
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership-change-log-gap
    missingEvidence: A dated changelog or press trail showing which executives joined or left over the last 24 months.
    whyItMatters: >-
      The current leadership page shows a broad bench, but without a dated change log the chapter cannot confidently
      call out recent leadership turnover or stability.
    diligencePath: >-
      Review archived leadership pages, press releases, and LinkedIn / executive biographies in a follow-up refresh
      focused on leadership chronology.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount-vintage-gap
    missingEvidence: A dated employee count that reconciles the 1,300, 1,700, and 1,912 public workforce signals.
    whyItMatters: >-
      Headcount is a key scale metric and current open-source signals use different dates or contexts, making a single
      2026 figure unsafe to assert.
    diligencePath: >-
      Request an as-of-date HR headcount or audited people metric from management, and map each public figure to its
      date and definition.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage-gap
    missingEvidence: >-
      A comprehensive corporate timeline with exact dates for major launches, acquisitions, governance changes, and
      geographic expansions.
    whyItMatters: >-
      The public milestone set is strong enough for chapter reuse, but it is still assembled from different source types
      and therefore not guaranteed exhaustive.
    diligencePath: >-
      Request an investor or corporate-history timeline and reconcile it against public announcements for exact date
      completeness.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: som-gap
    missingEvidence: >-
      Public paid-account counts, module attach rates, and segment-specific ARR by ratings, risk, carbon, and reporting
      workflows.
    whyItMatters: >-
      Without these figures, the chapter cannot convert workflow evidence into a defendable SOM or revenue-pool
      estimate.
    diligencePath: Request management materials, product pricing sheets, and segment mix from EcoVadis or investors.
    relatedQuestionRefs:
      - QM023
      - QM024
  - type: conflicting-data
    severity: material
    topic: omnibus-scope
    missingEvidence: A single authoritative count of how many companies remain directly in scope after the final omnibus package.
    whyItMatters: >-
      Proposal-stage and final-agreement summaries preserve 80% versus 90% reduction language, which materially affects
      any regulation-led sizing story.
    diligencePath: >-
      Pull the final directive text, EU Council implementation notes, and specialist legal tallies into one reconciled
      scope memo.
    relatedQuestionRefs:
      - QM006
      - QM022
  - type: private-evidence-only
    severity: material
    topic: pricing-and-roi
    missingEvidence: Contract pricing, land-and-expand pattern, and realized ROI by buyer segment.
    whyItMatters: Valuation depends on monetization and retention, not just market existence and workflow urgency.
    diligencePath: Review customer contracts, win/loss data, and board-level SaaS KPI packs.
    relatedQuestionRefs:
      - QM024
      - QM026
  - type: enumeration-incomplete
    severity: minor
    topic: california-demand
    missingEvidence: >-
      Clean public count of how many businesses doing business in California clear the SB 253 and SB 261 revenue
      thresholds.
    whyItMatters: >-
      The California demand lens is conceptually strong but still lacks a direct covered-entity count from the official
      statute.
    diligencePath: Use CARB, tax-base, or third-party compliance datasets to estimate covered entity counts by sector.
    relatedQuestionRefs:
      - QM004
      - QM023
  - type: access-blocked
    severity: minor
    topic: gated-omnibus-guidance
    missingEvidence: Full text of EcoVadis' gated omnibus FAQ and CSRD guide rather than teaser pages.
    whyItMatters: >-
      The teasers confirm scope and timing topics but not the full methodological detail or examples those guides may
      contain.
    diligencePath: Obtain the complete gated downloads or ask EcoVadis for the underlying PDF decks.
    relatedQuestionRefs:
      - QM006
      - QM024
  - type: missing-source
    severity: material
    topic: pricing-transparency-and-realized-discounting
    missingEvidence: >-
      Public or customer-verified pricing for EcoVadis and the main peers, including module structure, supplier fees,
      and realized enterprise discounting.
    whyItMatters: >-
      Without real pricing, the chapter can compare commercial motion but cannot quantify where EcoVadis is cheaper,
      more expensive, or easier to land.
    diligencePath: Request current price books, sample MSAs or order forms, and a win-loss pack with realized ASPs by module.
  - type: private-evidence-only
    severity: material
    topic: actual-win-loss-and-coexistence-rates
    missingEvidence: >-
      Customer-level data on whether EcoVadis displaces Sedex, audit incumbents, risk tools, Watershed, or Workiva
      versus coexisting with them.
    whyItMatters: >-
      The fetched public pages explain why multi-homing is plausible, but they do not reveal how often EcoVadis actually
      consolidates spend.
    diligencePath: >-
      Ask management for named competitive takeouts, coexistence statistics, and attach-rate by product line in the top
      100 accounts.
  - type: private-evidence-only
    severity: material
    topic: methodology-change-log-and-supplier-burden
    missingEvidence: >-
      Internal data on questionnaire length, response rates, supplier completion friction, and any planned methodology
      changes ahead of ESGR compliance.
    whyItMatters: >-
      The bearish case hinges on whether broad platform coverage creates supplier fatigue or manageable workflow
      leverage.
    diligencePath: >-
      Request methodology governance documents, supplier NPS or completion metrics, and pre/post-change customer
      communications.
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-long-tail-not-fully-enumerated
    missingEvidence: A fully exhaustive long tail of niche supplier-risk, carbon, and audit vendors by region and vertical.
    whyItMatters: >-
      This chapter prioritizes the archetypes and the most decision-relevant peers rather than every niche regional
      provider.
    diligencePath: Build a broader market map from procurement RFP shortlists, G2/RFI data, and customer reference calls.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
