      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, Contradictions, and Open Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The growth case is strong but should be stated narrowly. Regulation keeps pushing supplier data,
              human-rights due diligence, and value-chain emissions into core enterprise processes. The UK Modern
              Slavery Act requires annual transparency statements about supply chains; UFLPA creates a rebuttable
              presumption around Xinjiang-linked goods and shifts proof burdens to importers; SB 253 and SB 261 extend
              climate disclosures into value-chain emissions and climate-risk reporting; and even after the omnibus
              cuts, CSRD and CSDDD still preserve large-company obligations and value-chain pressure. Separate EcoVadis
              pages and the Barometer then show why this matters economically: buyers cite regulatory preparedness, risk
              reduction, innovation, and resilience as leading benefits, and Scope 3 inaction is framed as a liability
              and financing problem rather than just a sustainability aspiration.

              The main adoption constraints are equally important. Supplier data remains incomplete, with 30% of
              suppliers providing no emissions data and low rates of formal GHG inventories or Scope 3 reporting in the
              Index dataset. SB 253 adds third-party assurance requirements and potential auditor bottlenecks, while SB
              261 widens climate-risk disclosure expectations without solving data fragmentation. The SEC climate rule
              no longer offers a stable federal tailwind because the rule was stayed, leaving California and the EU as
              clearer demand anchors. At the same time, the ESG Ratings Regulation increases the compliance burden on
              providers like EcoVadis by forcing methodology disclosure, governance controls, and authorization
              pathways. That is a real trust-positive for the category over time, but it is also a cost and execution
              burden in the near term.

              The biggest unresolved questions are commercial rather than thematic. Public sources do not isolate
              EcoVadis' paid-account base, module attach rates, realized pricing, net retention, or the split between
              ratings, risk, carbon, and adjacent finance/reporting workflows. They also do not prove how many of the
              companies removed from direct CSRD scope will still buy software rather than continue with manual
              reporting or consultant-led compliance work. For valuation work, that means the chapter can support market
              existence, urgency, and workflow breadth, but not a precise SOM or a confident revenue-pool conversion
              rate. The correct diligence posture is therefore balanced: the market is real, maturing, and
              regulation-linked, but narrower and more execution-constrained than a generic ESG-software thesis would
              imply.
