              EcoVadis' funding history is visible in broad strokes. The company page records Partech funding in 2016
              and a €200 million CVC round plus Bain minority investment in 2020. The most fully supported financing
              event is the June 2022 round: the official press release, Business Wire republication, Astorg page, and
