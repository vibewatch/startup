      - number: '2.2'
        title: Evidence-Constrained Sizing Lenses, Range, and Contradictions
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports multiple sizing lenses, but not one clean standalone TAM for EcoVadis. The first
              lens is regulatory scope. EcoVadis' CSRD materials and the European Commission's CSRD pages anchor the old
              disclosure regime at roughly 50,000 companies globally, but the 2025-2026 omnibus process sharply reduced
              that directly regulated universe. The Commission's February 2025 proposal described an approximately 80%
              cut to CSRD scope, while later reporting on the final political agreement described a tougher >1,000
              employee and >EUR450 million revenue threshold that removes an estimated 90% of companies. That
              contradiction is not noise; it is central evidence that market-growth narratives tied to regulation alone
              must be discounted.

              The second lens is adjacent due-diligence scope. The final CSDDD now focuses on very large companies, with
              5,000 employees and EUR1.5 billion turnover thresholds and July 2029 compliance timing, but it still keeps
              chains-of-activities due diligence in play and formally supports risk-based work on severe impacts. The
              third lens is installed base and governed spend. EcoVadis says more than $2.5 trillion of spend now runs
              through sustainability risk insights, 175,000+ businesses use its platform, and the Index and Barometer
              datasets cover 100,000+ scored companies, roughly 200,000 scorecards, 1,000 multinationals, and nearly
              2,000 suppliers. Those are not TAM dollars, but they are stronger evidence of enterprise workflow
              penetration than a generic market-research headline would be.

              The fourth lens is adoption maturity and data quality. The Barometer shows sustainable procurement is
              already mature in large enterprises, yet supplier readiness remains uneven: only around half of buyers
              have visibility into most Tier 1 suppliers, and 30% of suppliers still provide no emissions data. That
              means serviceable demand exists, but the revenue pool is constrained by incomplete supplier data, uneven
              digital integration, and the fact that EcoVadis does not publicly disclose paid-customer counts, pricing,
              attach rates, or segment-level ARR. The chapter therefore treats TAM and SOM as unresolved diligence
              questions and uses entity-count, spend-governance, and workflow-maturity lenses instead of inventing a
              precise market-size number.
