              This is the most important bearish section of the chapter. EcoVadis has broad public proof of adoption
              surfaces, but it does not publish NRR, GRR, buyer renewal, supplier reassessment rates, or churn by
              cohort. The only retention signals that are directly visible are qualitative: DHL’s program is embedded
