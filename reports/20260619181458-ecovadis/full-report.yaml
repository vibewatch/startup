          - type: callout
            title: The main discount is evidence quality not just demand quality
            body: >-
              The biggest reason to stay disciplined is that current ARR NRR cash debt and preference-overhang data
              remain private while regulation and methodology burden are becoming more important not less.
            calloutType: risk
