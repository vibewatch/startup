      - number: '7.4'
        title: Ecosystem, competition and execution risk
        blocks:
          - type: paragraph
            body: >-
              EcoVadis' ecosystem strategy is strategically powerful and strategically dangerous. The company explicitly
              says it relies on a broad partner network and APIs so that ratings and carbon data can sit inside
              procurement, ERP, risk and disclosure tools. JAGGAER shows EcoVadis deeply embedded in supplier-management
              workflows; Workiva and Watershed show EcoVadis increasingly positioned as the upstream supplier-data
              engine inside broader carbon-accounting and disclosure stacks. That helps distribution and may strengthen
              switching costs for some customers, but it also creates dependence on partners that often own the primary
              user interface, the surrounding workflow and the final disclosure context. If those platforms improve
              their own scoring, data-ingestion or assurance layers, EcoVadis risks sliding from strategic system to
              replaceable data module.


              This matters because adjacent platforms already frame the workflow in audit-grade and disclosure-centric
              language. Workiva explicitly says disclosure is moving from voluntary to mandatory and places EcoVadis
              data inside a governed system built for assurance; Watershed says the goal is to replace broad averages
              with actual supplier data. Those claims are commercially positive, but they also raise execution
              expectations on data quality, uptime, and methodological stability. More broadly, the same ecosystem that
              expands EcoVadis' reach also intensifies competition because procurement teams can compare EcoVadis not
              only with direct supply-chain raters but with broader carbon and disclosure platforms that keep moving
              upstream. The risk is not that partnerships fail tomorrow; it is that partners become the customer
              relationship and disclosure control point while EcoVadis absorbs the regulatory, methodological and
              supplier-engagement burden underneath.
