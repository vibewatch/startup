      - number: '8.4'
        title: Comparable lens and scenario framework
        blocks:
          - type: paragraph
            body: >-
              Public comparables are useful for direction, not for precision. MSCI and Moody's show that trusted
              ratings, data and risk franchises can support very large public values: CompaniesMarketCap lists them at
              roughly $42.26 billion and $78.72 billion respectively in June 2026, while their investor materials
              emphasize broad data, analytics and risk infrastructure. But those are much broader, more transparent, and
              more financially disclosed franchises than EcoVadis. Intertek and SGS are the opposite lesson: both prove
              that trust, assurance and compliance businesses can be worth billions in public markets, but their
              operating models are more service-heavy and their economics are not the right benchmark for a
              software-and-network story. Sedex and LRQA are useful private adjacencies because they demonstrate that
              buyers will pay for due-diligence, audit and transparency infrastructure in supply chains, but they still
              do not solve EcoVadis' own current price. The right way to use this set is to bracket EcoVadis between
              premium data franchises and scaled assurance businesses, then add a private-company opacity discount.
              Under that framework, the base case should revolve around the public minimum implied by 2022 unicorn
              status rather than a fresh top-down mark. Above-threshold upside requires proof that ARR has grown far
              beyond the 2022 €100 million sponsor snapshot and that regulation strengthens moat faster than it raises
              cost. Below-threshold downside becomes plausible if compliance-led demand shrinks, supplier burden slows
              participation, or hidden retention and margin quality are weaker than the scale story suggests.
