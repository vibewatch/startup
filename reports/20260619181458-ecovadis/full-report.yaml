  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer archetypes
        blocks:
          - type: paragraph
            body: >-
              EcoVadis behaves more like a multi-sided procurement network than a single homogeneous SaaS customer base.
              The clearest public archetypes are enterprise buyers that use ratings inside sourcing and compliance
              programs, suppliers that pay to be assessed and share scorecards, finance or private-equity users
              benchmarking portfolio companies, sector-initiative members coordinating assessments across an industry,
              and technology partners embedding EcoVadis data into adjacent tools. That segmentation matters because
              buyer, user, and payer are often different people. A procurement team may mandate assessments, a supplier
              ESG team may complete and pay for them, and internal finance or compliance users may consume the outputs
              later. The public pages also show a real difference between the buyer-side value proposition and the
              supplier-side one: buyers get control, visibility, and policy enforcement, while suppliers get reusable
              scorecards, badges, benchmarking, and the ability to satisfy multiple customer requests through one
              assessment. Publicly, EcoVadis is strongest when it is framed as workflow infrastructure for procurement
              and supply-chain compliance rather than as a simple badge provider.
