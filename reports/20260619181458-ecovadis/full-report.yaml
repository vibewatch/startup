              complaints about the time needed to gather supporting documents and that pricing can be high for smaller
              businesses. Sector initiatives are one answer to that burden because they reduce duplicate questionnaires,
              but they do not eliminate the fact that some supplier participation is effectively customer-mandated. The
              2026 ESG ratings regulation also raises a separate burden vector: methodology scrutiny and disclosure
              expectations may increase effort for both providers and rated companies. Net result: public evidence
