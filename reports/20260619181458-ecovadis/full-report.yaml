      - Type / lens
      - Public metric
      - Valuation / status
      - Relevance
      - Main limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public comparables and adjacencies fetched for this chapter across
        data-and-ratings franchises, assurance providers and supply-chain transparency platforms; it excludes non-public
        revenue multiples and confidential M&A data not available from public evidence.
    rows:
      - - MSCI
        - Public sustainability / analytics franchise
        - June 2026 market cap about $42.26B; 2024 revenue growth nearly 13%
        - Large disclosed public franchise
        - Shows how durable data-and-ratings infrastructure can command premium public value
        - Much broader more transparent and more financially disclosed than EcoVadis.
      - - Moody's
        - Public risk / ratings / data franchise
        - June 2026 market cap about $78.72B; about 16000 employees in 40+ countries
        - Large disclosed public franchise
        - Useful upper-bound lens for trusted risk-data economics and disclosure standards
        - Credit/data mix is broader than sustainability procurement workflows.
      - - Intertek
        - Public assurance / TIC provider
        - June 2026 market cap about $11.79B; 2025 revenue £3.43bn; adjusted margin 18.1%
        - Scaled assurance and compliance operator
        - Useful for trust inspection and due-diligence market value
        - Service-heavy economics differ from a networked ratings software model.
      - - SGS
        - Public testing / inspection / certification provider
        - June 2026 market cap about $22.26B; 100000 employees and 2500 offices/labs
        - Scaled global assurance operator
        - Shows size of large trust-and-compliance infrastructure markets
        - Operational footprint and capital intensity are very different from EcoVadis.
      - - Sedex
        - Private supply-chain transparency platform
        - 95000 businesses and 115000 supply-chain sites; SMETA is a leading audit method
        - Private adjacency no public valuation in fetched evidence
        - Confirms buyer demand for multi-buyer data sharing audits and due-diligence workflows
        - No usable public valuation or margin disclosure.
      - - LRQA
        - Private responsible sourcing and assurance platform
        - >-
          Positions responsible sourcing as connected risk management with assurance advisory and data-driven
          intelligence
        - Private adjacency no public valuation in fetched evidence
        - Confirms that responsible sourcing and ongoing supply-chain monitoring are crowded strategic workflows
