      - number: '8.3'
        title: Why the discount has to stay wide despite platform quality
        blocks:
          - type: paragraph
            body: >-
              The reason not to underwrite EcoVadis like a premium public data franchise is that nearly every attractive
              feature comes with a visible counterweight. ESG Today and IMD both describe the EU ESG Ratings Regulation
              as a force that will raise transparency, governance and authorization burdens on providers like EcoVadis
              from 2026 onward. The same ESG Today coverage shows that the final Omnibus package cuts the near-term
              regulatory footprint of CSRD and CSDDD far more aggressively than originally proposed, leaving less
              naturally regulated demand even while raters face more oversight. Sustainalytics' move to public-only
              inputs matters for EcoVadis because private firms experienced larger score changes when non-public data
              was removed, which supports the view that methodology and evidence rules can materially alter outcomes for
              lightly disclosing companies. Academic sources sharpen the same point: the Open Research Europe survey
              says ESG ratings have low correlation across providers, while the MDPI critical review says divergence,
              unclear definitions and uneven reporting create reliability problems. That backdrop is the core valuation
              discount. EcoVadis may be strategically important, but it is still selling an evidence-heavy score into a
              market where methodology burden is rising, comparability is contested, and the company itself does not
              disclose the current ARR and retention metrics that would justify paying a public-style premium multiple.
