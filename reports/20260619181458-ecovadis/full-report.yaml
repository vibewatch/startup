  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The most severe EcoVadis risks cluster around regulation, product credibility and opacity rather than classic
      physical operations.
    data:
      columns:
        - Low impact
        - Medium impact
        - High impact
        - Critical impact
      rows:
        - label: High likelihood
          values:
            - Localized partner friction
            - SEC-rule fragmentation support burden
            - Supplier questionnaire burden
            - ESGR authorization / readiness risk
        - label: Medium likelihood
          values:
            - Minor methodology confusion
            - Review-site complaint flare-up
            - Partner disintermediation
            - Omnibus-driven compliance TAM contraction
        - label: Low likelihood
          values:
            - Single-region filing anomaly
            - One-off workflow outage
            - Severe public score-integrity controversy
            - Sudden financing stress hidden by current opacity
    approximationNotes: >-
      Likelihood and impact are qualitative rankings derived from the fetched evidence set rather than
      management-provided probabilities.
