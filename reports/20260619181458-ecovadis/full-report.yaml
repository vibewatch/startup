  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Archetypes
        blocks:
          - type: paragraph
            body: >-
              EcoVadis does not compete in one clean peer group. Its own current product stack now spans supplier
              sustainability ratings, real-time ESG risk mapping, and supplier carbon-data collaboration, so the
              relevant landscape breaks into at least four archetypes. The first is software-native supplier
              sustainability platforms such as IntegrityNext, which look closest on orchestration and compliance
              workflow. The second is audit- and network-led procurement infrastructure such as Sedex/SMETA and large
              assurance providers such as LRQA and Intertek, which solve the job through audits, standards, and
              corrective actions rather than an analyst-scored network. The third is risk-intelligence software such as
              Prewave, Sphera, and LRQA EiQ, which emphasize alerts, multi-tier mapping, and due-diligence monitoring.
              The fourth is narrower substitute tooling such as Watershed and Workiva, which compete for Scope 3
              measurement and ESG reporting budgets without replicating EcoVadis' full procurement-led ratings layer.
              This market structure matters because buyers can solve only one slice of the problem and still bypass a
              full EcoVadis rollout.
