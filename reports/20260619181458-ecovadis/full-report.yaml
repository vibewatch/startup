        title: Founders, leadership bench, governance signals, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership disclosure is unusually rich at the executive-biography level and relatively light at the
              classic governance level. EcoVadis' leadership page still places co-founders Pierre-François Thaler and
              Frédéric Trinel at the center of the company, with Thaler leading customer-, marketing-, solution-, and
              impact-facing functions and Trinel leading people, finance, evaluations, and technology. The page also
              surfaces a materially broader bench than an early-stage company would usually publish, including a CFO,
              chief rating officer, chief human resources officer, chief corporate development officer, chief impact
              officer, CTO, CMO, and CPO. That breadth is a positive operating signal because it reduces the appearance
              that the company is still founder-only in day-to-day execution.


              At the same time, the fetched public set does not provide a normal board roster, director biographies, or
              a cap-table/governance page that would let an outside investor trace formal control. The most concrete
              oversight disclosure comes instead from the 2025 Purpose Report, which says a Purpose Committee with five
              external and three internal members meets four times per year. That is meaningful, but it is not a
              substitute for a full board or investor-rights disclosure. The resulting diligence posture is moderate
              key-person dependence: the business no longer looks operationally thin, but the founders remain the
              clearest public owners of strategy and the public record still leaves governance detail under-disclosed.
