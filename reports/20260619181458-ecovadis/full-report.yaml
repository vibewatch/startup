              - CV002
              - CV003
              - CV020
              - CV036
              - CV037
              - CV038
              - CV041
      - number: '8.5'
        title: Recommendation posture, diligence gates and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Taken together, the evidence supports a research-more recommendation rather than a clean buy or avoid
              call. EcoVadis has enough visible quality to stay investable: scale, sponsor quality, a multi-product
              ratings-and-carbon stack, real workflow embedding, and a regulatory backdrop that could increase the
              strategic value of trusted supplier data. But the recommendation cannot be stronger than the evidence.
              There is still no clean public 2026 ARR, net retention, gross margin, cash, debt, complaint-volume or
              cap-table disclosure; no public confirmation of ESMA filing progress; and no public breakdown of partner
              concentration or the share of growth that still depends on broad compliance narratives weakened by
              Omnibus. That makes the fair posture price-sensitive and conditional. A disciplined investor should treat
              valuation as unknown above the 2022 unicorn threshold, potentially fair around that threshold if current
              ARR and retention are strong, and stretched above it until diligence proves otherwise. Exit-wise, the
              public record supports strategic-acquirer logic more readily than near-term IPO logic: the market clearly
              values data, risk and assurance franchises, but public investors would demand much stronger disclosure
              than EcoVadis currently provides. The priority task is therefore not to refine decimal places on
              valuation, but to convert opacity into verifiable underwriting inputs.
            claimRefs:
