      - number: '7.2'
        title: Methodology, burden and product-credibility risk
        blocks:
          - type: paragraph
            body: >-
              EcoVadis' product risk is not just that ESG ratings are controversial in the abstract; it is that EcoVadis
              monetizes a document-heavy, workflow-embedded rating process whose score outcomes influence supplier
              access to business. EcoVadis' own methodology materials describe a four-theme, 21-criteria framework
              drawing on company documentation, third-party endorsements and 360° Watch monitoring, while partner guides
              describe weeks of questionnaire work, locked submissions and score sensitivity to the quality and
              completeness of uploaded evidence. In procurement contexts, JAGGAER shows that the resulting medals,
              weightings and improvement indicators are visible directly inside supplier-management workflows and can
              help suppliers gain or retain business. That makes explainability, consistency and burden customer-facing
              rather than back-office issues.


              External sources sharpen the downside. IOSCO flags lack of methodology transparency and conflicts of
              interest as core sector problems, and ESG Today notes that scores can vary substantially across raters
              because of topic selection, estimation and treatment of missing data. Sustainalytics' move to public-only
              inputs is especially relevant: it found that private firms saw bigger score changes when non-public
              information was removed, which suggests any market-wide move toward public-disclosure-heavy methods can
              penalize private or lightly reporting companies. EcoVadis' own Q1 2026 release notes confirm meaningful
              ongoing rule changes, including new disclosure documents, new versioning, new consultation mechanics and
              revised evidence-coverage rules. Add supplier-side criticism that the process is laborious,
              documentation-biased and sometimes expensive, and the core product risk becomes clear: EcoVadis must
              defend both the fairness of the score and the economics of participation while its methodology is still
              evolving in public.
