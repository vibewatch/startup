      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Best public-data call is research more not price up the story
            body: >-
              EcoVadis has enough visible platform quality to stay on the investable list but not enough current
              economic disclosure to support a confident premium valuation call.
            calloutType: recommendation
