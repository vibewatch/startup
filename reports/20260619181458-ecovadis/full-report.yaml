  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Current ARR / retention data disappoints
        - Management cannot show ARR materially above the 2022 sponsor snapshot or shows weak renewal quality
        - Base case around the 2022 threshold loses support
        - Reset to bear case demand lower price or step away.
      - - ESGR readiness slips
        - No credible evidence of notification filing readiness or governance implementation as 2026 deadlines approach
        - Cost rises while continuity and reputation risk increase
        - Raise risk rating and suspend premium-multiple logic.
      - - Omnibus-driven demand compression persists
        - Pipeline remains tied to now-narrowed mandatory compliance use cases with weak strategic offset
        - Narrative premium over assurance-like peers erodes
        - Cut bull probability and move valuation lens toward or below threshold.
      - - Supplier burden / methodology disputes rise
        - Complaints appeals or evidence burdens worsen without better transparency or conversion
        - Network effects weaken and customer trust becomes less durable
        - Apply extra discount to growth and retention assumptions.
      - - Partner concentration is high
        - A major embedded platform owns the buyer relationship or drives a large share of bookings
        - EcoVadis becomes a component not the control point
        - Treat upside as capped until concentration and economics are disclosed.
    notes: >-
      Triggers are observable or diligencable events that can move the recommendation without pretending public
      investors already have perfect data.
