        title: Exhibits
        blocks:
          - type: callout
            title: Voluntary demand matters almost as much as mandatory scope
            body: >-
              The omnibus package sharply reduced the number of companies directly forced into CSRD and CSDDD, but the
              surveyed out-of-scope companies largely plan to keep reporting anyway. That makes EcoVadis' market less a
              pure compliance burst and more a procurement and reporting infrastructure layer whose demand persists
              after direct legal scope narrows.
            calloutType: insight
