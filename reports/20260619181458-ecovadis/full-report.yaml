  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public-data boundary and known valuation anchors
        blocks:
          - type: paragraph
            body: >-
              The first rule for valuing EcoVadis is to separate what is actually public from what is merely plausible.
              Public evidence does confirm a very large 2022 financing event, continuing sponsorship from Astorg and
              General Atlantic, and substantial operating scale. EcoVadis said in June 2022 that it raised $500 million,
              bringing total capital raised above $725 million, while Goodwin described that round as the event that
              made EcoVadis the 27th French unicorn. Astorg still presents a 2022 acquisition snapshot with €100 million
              ARR, 1,912 headcount, 700-plus enterprise procurement teams and 55,000-plus suppliers. EcoVadis' current
              company pages add fresher but still non-financial scale markers: more than 150,000 rated companies, more
              than 100,000 active rated subscribers, and a team of more than 1,900 people. What the public record does
              not provide is the piece that matters most for valuation discipline: current 2026 ARR, growth, retention,
              margin, debt, cash, or preference-stack detail. Companies House gives only a local UK entity filing
              surface, not consolidated economics. That means the right valuation frame is not a precise marked price
              but a constrained set of anchors: a verified 2022 unicorn threshold, a stale 2022 ARR snapshot, and a
              2024-2026 operating-scale story that clearly implies maturity but still does not solve current unit
              economics.
