              The harder problem is not equity history but current KPI precision. Astorg's investment page gives a
              useful but undated/at-acquisition-style snapshot of €100 million ARR, 1,912 headcount, Paris headquarters,
              and 700+ enterprise procurement teams reaching 55,000+ suppliers. Official 2024-2026 materials give
              fresher network numbers, but they do not cleanly restate current ARR, valuation, debt, secondaries, or
              cap-table concentration. As a result, the best public conclusion is that EcoVadis is a late-growth private
              company with substantial equity backing and broad ecosystem penetration, while its current valuation and
              financial run rate remain only partially visible from open sources.
