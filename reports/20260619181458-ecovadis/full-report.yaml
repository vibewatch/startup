  - id: FE003
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      The buyer workflow begins with supplier mapping and data collection, then moves through scoring, risk monitoring,
      carbon and worker inputs, and finally into procurement and reporting systems.
    data:
      nodes:
        - id: buyer
          label: Buyer team
          detail: Procurement, compliance, sustainability, and reporting owners define the workflow
        - id: supplier
          label: Supplier
          detail: Provides questionnaires, documents, emissions inputs, or worker-channel context
        - id: ratings
          label: Ratings
          detail: Full assessment, scorecard, medals, and corrective-action anchor
        - id: iq
          label: IQ Plus / Vitals
          detail: Contactless mapping and lighter supplier engagement broaden coverage
        - id: carbon
          label: Carbon workflows
          detail: CAM, CDN, and PCF tools collect and structure supplier-specific carbon data
        - id: worker
          label: Worker voice
          detail: Ulula-derived surveys and grievances add direct labor-rights signals
        - id: dashboards
          label: Dashboards and exports
          detail: Scorecards, climate metrics, and regulatory or management reporting outputs
        - id: partners
          label: Partner systems
          detail: JAGGAER, Workiva, Watershed, and other connected procurement or reporting tools
      edges:
        - to: iq
          label: maps supply base and sets diligence scope
          from: buyer
        - to: ratings
          label: submits questionnaires and documents
          from: supplier
        - to: ratings
          label: prioritizes suppliers for deeper review
          from: iq
        - to: carbon
          label: shares emissions and product data
          from: supplier
        - to: worker
          label: enables direct worker channels around sites and supply chains
          from: supplier
        - to: dashboards
          label: creates scorecards and action plans
          from: ratings
        - to: dashboards
          label: adds metrics, maturity, and decarbonization views
          from: carbon
        - to: dashboards
          label: adds grievance and labor-risk visibility
          from: worker
        - to: partners
          label: feeds procurement and disclosure workflows
          from: dashboards
    claimRefs:
      - CE018
      - CE019
      - CE027
      - CE028
      - CE032
      - CE034
      - CE039
      - CE043
  - id: FE004
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      EcoVadis’ product defensibility depends on supplier participation, standards alignment, external data feeds, and
      partner distribution, while its biggest public risk is the lack of inspectable technical-assurance detail.
    data:
      nodes:
        - id: standards
          label: External standards
          detail: GRI, UNGC, and related frameworks anchor the methodology and compliance narrative
        - id: supplierdata
          label: Supplier data and documents
          detail: Questionnaires, verified documents, emissions inputs, and remediation actions
        - id: monitoring
          label: External monitoring feeds
          detail: 360° Watch news, watchlists, and third-party data points
        - id: workerchannels
          label: Worker voice channels
          detail: Ulula surveys, grievances, and anonymous reporting
        - id: partners
          label: Partner systems
          detail: JAGGAER, Workiva, Watershed, Sweep, Normative, and broader procurement/reporting ecosystems
        - id: core
          label: EcoVadis core platform
          detail: Scores, profiles, dashboards, and data exchange orchestrated across modules
        - id: gap
          label: Public technical-assurance gap
          detail: >-
            No public uptime page, SLA metrics, security-certification register, or detailed API reference found in
            fetched corpus
      edges:
        - to: core
          label: defines criteria and reporting alignment
          from: standards
        - to: core
          label: provides raw assessment and carbon inputs
          from: supplierdata
        - to: core
          label: adds ongoing external risk signals
          from: monitoring
        - to: core
          label: adds human-rights and grievance signals
          from: workerchannels
        - to: partners
          label: exports or embeds data into customer workflows
          from: core
        - to: core
          label: limits outside-in diligence on platform quality
          from: gap
    claimRefs:
      - CE026
      - CE030
      - CE031
      - CE039
      - CE047
      - CE048
      - CE049
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Maps the most visible public customer journey from buyer mandate through supplier assessment, score sharing,
      partner embedding, and ongoing improvement.
    data:
      nodes:
        - id: buyer-mandate
          label: Buyer mandate
          description: >-
            A procurement or sustainability leader decides to require EcoVadis assessments for suppliers or to use
            ratings in sourcing and compliance workflows.
        - id: supplier-onboarding
          label: Supplier onboarding
          description: >-
            The supplier completes a tailored questionnaire, uploads evidence, and receives analyst-reviewed scorecards
            or carbon metrics.
        - id: score-sharing
          label: Score sharing
          description: >-
            Results are shared with requesting customers and can be reused with multiple clients or sector-initiative
            members.
        - id: workflow-embedding
          label: Workflow embedding
          description: >-
            Ratings, medals, and risk signals are surfaced in SRM, procurement, marketplace, or reporting tools such as
            JAGGAER, Amazon Business, Workiva, and Watershed.
        - id: improvement
          label: Corrective action and training
          description: >-
            Customers use dashboards, corrective-action plans, e-learning, and carbon guidance to improve supplier
            performance over time.
        - id: expansion
          label: Expansion into adjacent modules
          description: >-
            Customers may add carbon-data, worker-voice, or partner-connected workflows once the rating program is in
            place.
    approximationNotes: >-
      This is a conceptual journey synthesized from multiple public workflow pages rather than a disclosed funnel from
      one named account.
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU016
      - CU024
      - CU032
      - CU035
      - CU036
      - CU043
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Shows how public proof narrows from broad network-scale claims to a much smaller set of named production
      references and an even smaller set of disclosed retention signals.
    data:
      items:
        - label: Public network scale claims
          value: 150000
        - label: Public buyer survey sample
          value: 1000
        - label: Named buyer / finance proofs used in this chapter
          value: 6
        - label: Customer-owned workflow documents fetched
          value: 3
        - label: Public retention metrics disclosed
          value: 0
    approximationNotes: >-
      Items deliberately mix counts with different lenses to visualize where public proof thins out; the key point is
      not mathematical conversion but disclosure drop-off from network breadth to underwriteable retention data.
