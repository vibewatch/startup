  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, Excluded Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              EcoVadis should be analyzed as supplier sustainability infrastructure, not as a catch-all ESG software
              name and not as a pure investor-facing ESG ratings vendor. Its own sustainable procurement, value-chain
              emissions, ESG reporting, and regulation explainers consistently place the product around sourcing,
              supplier due diligence, Scope 3 data collection, and compliance reporting across value chains. That means
              included spend is the set of workflows where buyers pay to collect, validate, score, monitor, and improve
              supplier ESG and carbon data: supplier assessments and scorecards, risk screening, corrective-action and
              engagement tooling, carbon data collection, procurement decision integration, and reporting support for
              regulations that now reach beyond direct operations.

              The excluded spend matters just as much. This market does not equal all ESG reporting software, all
              sustainability consulting, all sustainable-finance products, or all investor-oriented ESG ratings. It also
              excludes physical audit labor, carbon offsets, and broad ERP or procurement-suite spend unless those
              dollars are specifically buying verified sustainability intelligence and supplier workflow orchestration.
              Adjacent categories remain important because they shape the boundary: enterprise ESG reporting and finance
              tools consume the outputs, while procurement suites and internal compliance teams can act as distribution
              partners or substitutes.

              The status quo is still real and should cap any inflated TAM story. EcoVadis' own 2026 Barometer shows
              most buyers have started integrating ESG data, but many still rely on manual or partial digital
              connections, and the report explicitly says leading buyers are moving beyond SAQs toward third-party
              ratings, training, and joint innovation. ESG reporting pages likewise describe supplier codes of conduct,
              questionnaires, and fragmented internal data collection as common practice. In other words, the substitute
              set is not hypothetical: spreadsheets, supplier self-attestations, codes of conduct, periodic audits,
              consultant-led reporting projects, and internal models built around standards such as GRI or the UN Global
              Compact remain the default in many accounts. EcoVadis wins when those manual substitutes become too slow,
              too fragmented, or too weakly evidenced for procurement, finance, and compliance teams.
