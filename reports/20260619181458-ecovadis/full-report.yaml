  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Assesses named customer proofs by evidence quality and retention visibility instead of treating every logo as
      equally strong customer proof.
    data:
      columns:
        - Workflow depth visible
        - Customer-owned corroboration
        - Outcome specificity
        - Retention visibility
      rows:
        - label: DHL Group
          values:
            - High — mandatory process across qualification, SRM, annual reviews, and preferred suppliers
            - High — DHL HTML page plus DHL PDF
            - Medium — process usage is clear but no ROI figures
            - Low — no renewal, adoption-rate, or churn data
        - label: Brenntag / Merck / Jakala
          values:
            - Medium — procurement use case is clear
            - Medium — Brenntag or Merck corroboration exists for some accounts
            - Low to Medium — qualitative benefits dominate
            - Low — no contract or cohort metrics
        - label: Amazon / partner channels
          values:
            - Medium — workflow embedding is clear at point of purchase or reporting
            - Medium — partner and media corroboration exists
            - Medium — feature launch and user action are specific
            - Low — commercial conversion and seller retention undisclosed
    approximationNotes: >-
      Qualitative bins reflect corroboration depth, not commercial importance; low retention visibility does not negate
      usage, but it does limit underwriting confidence.
