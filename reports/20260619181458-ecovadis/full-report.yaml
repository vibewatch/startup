              offer between supplier-side Sustainability Ratings subscriptions and a separate Carbon Rating path, then
              ladders those packages through Basic, Premium, Select, and Corporate tiers. Product pages add the
              buyer-side layer: Ratings, IQ Plus, Carbon Action Manager, and partner-connected carbon data workflows.
              That evidence supports a broad multi-product model spanning supplier subscriptions, enterprise procurement
              budgets, and adjacent reporting workflows. The important caveat is that list packaging is not the same as
              realized economics. The pricing page often shows dashes or unavailable cells instead of explicit amounts,
              and no fetched source discloses average contract value, module attach, discounting, or renewal structure.
