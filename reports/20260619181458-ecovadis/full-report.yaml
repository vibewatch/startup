  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and market-scope risk
        blocks:
          - type: paragraph
            body: >-
              EcoVadis is unusually exposed to regulatory change because its core product is itself becoming regulated
              while many of the disclosure regimes that help create customer demand are being narrowed. EcoVadis states
              that its ratings fall within the scope of the EU ESG Ratings Regulation and that it will seek ESMA
              authorization, while ESMA and legal summaries show that incumbent providers face a July 2, 2026
              application start, an August 2 notification deadline and a November 2 authorization deadline. That creates
              a hard operational milestone: EcoVadis must add governance, complaints, methodology-disclosure and
              conflict-control infrastructure simply to keep selling into the EU market. The burden is not theoretical;
              EcoVadis' own 2026 update says it is already changing methodology governance, versioning and consultation
              processes to align with the rule.


              At the same time, the near-term compliance-led addressable market is being cut back. ESG Today and
              EcoVadis' own regulatory commentary show that the final Omnibus package narrowed CSRD to companies above
              1,000 employees and €450 million of revenue and pushed CSDDD to 5,000 employees and €1.5 billion of
              revenue, while also weakening liability and climate-plan obligations. EcoVadis argues that risk management
              and procurement resilience still matter even if thresholds move, which is directionally true, but that
              argument itself highlights the risk: some demand may remain strategic, yet part of the urgency embedded in
              EcoVadis' sales narrative came from broad mandatory disclosure and due-diligence rollouts that are now
              materially smaller. The company therefore faces a double squeeze in 2026: more cost and scrutiny on the
              supply side of ratings, and a narrower immediately regulated buyer pool on the demand side.
            claimRefs:
