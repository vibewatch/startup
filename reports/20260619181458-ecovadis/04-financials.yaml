- id: unit-economics-quality-and-underwriting-blockers
  title: Unit economics quality and underwriting blockers
  body: 'The strongest financial positives in the fetched corpus are breadth of monetization, durable procurement embedding, and evidence that EcoVadis is moving into higher-value climate and disclosure workflows. The weakest area is financial quality visibility. There is no fetched disclosure for gross margin, CAC, payback, churn, NRR, debt, cash balance, or free cash flow. Even the best current revenue signals are indirect: Astorg publishes a €100m ARR snapshot tied to its 2022 entry, while the 2022 company release gives revenue growth rather than a run-rate figure. That means public sources support direction, not precision. The adverse case also has to stay explicit. New EU ESG ratings regulation will require authorization, governance, and methodology disclosure from providers in EcoVadis’ category, potentially increasing compliance costs and scrutiny at exactly the moment the company is expanding its role in procurement, carbon data, and audit-ready reporting. For underwriting, EcoVadis
    looks strategically important and commercially broad, but still unusually opaque on the metrics that drive confidence in revenue quality and margin durability.'
