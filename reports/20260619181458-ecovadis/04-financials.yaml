- id: traction-proxies-versus-paying-customer-ambiguity
  title: Public traction proxies versus paying-customer ambiguity
  body: EcoVadis publishes many scale metrics, but they are not interchangeable. The 2022 financing release disclosed 95,000+ businesses using the platform, 50% revenue growth over the prior year, 1,300 employees, 15,000 companies engaged with Carbon Action Module, and more than 500,000 companies screened with IQ. The 2024 and 2025 purpose materials move the scale story forward with 1,300+ procurement organizations, 44,000+ buyers, 150,000+ rated companies, 175,000+ businesses using the broader platform, 55,838 companies reporting at least one GHG metric, and more than $2.5 trillion in spend linked to sustainability insights. Those are meaningful operating signals and support the thesis that EcoVadis sits on a large recurring workflow. They do not, however, solve the core financial question of paying-customer count or ARR. Buyers, rated suppliers, screened companies, and worker users all expand ecosystem breadth, but public evidence does not reconcile them into one disclosed revenue denominator.
