- id: TI005
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - What it supports
  - What remains unknown
  - Diligence ask
  rows:
  - - 2016 funding
    - Partech announced first institutional funding and described 30,000 customers and 320 employees
    - Confirms early growth equity sponsorship
    - Round size beyond €30m does not answer current liquidity
    - Request full historical cap table and share classes
  - - 2020 funding
    - Business Wire announced c.$200m CVC investment and board seats
    - Confirms large growth capital and governance involvement
    - No public post-money valuation or use-of-proceeds accounting
    - Request 2020 closing deck and ownership table
  - - 2022 funding
    - Official and Business Wire releases disclosed approximately 500m financing and total capital raised above $725m
    - Confirms substantial late-growth equity backing
    - No public current cash balance, dilution, or remaining dry powder
    - Request cash bridge from 2022 close to current date
  - - Largest institutional holder
    - 2022 release says CVC remained largest institutional shareholder
    - Suggests investor continuity after new round
    - No current shareholder percentages or liquidation stack
    - Request current ownership schedule and investor rights summary
  - - Cash / burn / runway
    - No fetched public disclosure
    - Nothing reliable can be concluded from open sources
    - Current liquidity position is unknown
    - Request latest board pack with cash, burn, runway, and covenant status
  - - Debt / credit facilities
    - No fetched public disclosure
    - Cannot assess leverage or refinancing risk
    - Debt burden, if any, is unknown
    - Request debt schedule, lender docs, and off-balance-sheet obligations
  - - Acquisition capacity
    - 2022 release earmarked funds for strategic acquisitions; 2024 Ulula acquisition confirms some deployment
    - Supports growth-use-of-funds logic
    - How much capital remains after expansion and M&A is unknown
    - Request post-acquisition liquidity and M&A reserve policy
  notes: Historical financing is visible; current capital adequacy is not. Unknown fields remain blank because the fetched record does not disclose them.
