- id: TI004
  title: Unit economics visibility table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current ARR
    - Not publicly disclosed in fetched 2024-2026 sources; only Astorg’s €100m acquisition snapshot is visible
    - medium
    - Core underwriting anchor for valuation and growth quality
    - Request monthly ARR bridge and product/module split
  - - Revenue growth
    - 50% over the prior 12 months at June 2022 financing
    - high
    - Shows historical momentum but not current pace
    - Request 2023-2026 quarterly growth cadence
  - - Gross margin
    - Not disclosed
    - high
    - Needed to distinguish software economics from analyst/service drag
    - Request gross margin by product line and service allocation policy
  - - CAC / payback
    - Not disclosed
    - high
    - Needed to underwrite efficient growth and capital needs
    - Request new-logo and expansion CAC plus payback by segment
  - - NRR / churn
    - Not disclosed
    - high
    - Needed to assess durability of recurring revenue
    - Request GRR, NRR, logo churn, and cohort renewal tables
  - - Implementation / service intensity
    - Partially implied by analyst review, onboarding, and account-manager features
    - medium
    - May create labor cost that affects margin path
    - Request implementation staffing model and attach to subscription mix
  - - Partner monetization economics
    - Not disclosed for Workiva / Watershed integrations
    - medium
    - Important if future growth relies on data-workflow partnerships
    - Request partner revenue-share terms and direct versus indirect bookings
  notes: Nulls are genuine public-data gaps, not zeroes. The table distinguishes disclosed historical growth from missing recurring-software efficiency metrics.
