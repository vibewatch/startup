chapter:
  number: 4
  title: Financials
  summary: EcoVadis publicly discloses enough to map a multi-product recurring revenue model and a well-funded growth history, but not enough to underwrite current ARR, margins, cash, debt, or paying-customer counts. The chapter therefore lands on a late-growth private software-and-data business with credible scale proxies and weak underwriting-grade financial transparency.
sections:
- id: revenue-model-and-pricing-visibility
  title: Revenue model and pricing visibility
  body: 'EcoVadis is not publicly transparent enough to let an outside investor build a clean revenue waterfall, but it is transparent enough to show the shape of monetization. The official pricing surface splits the offer between supplier-side Sustainability Ratings subscriptions and a separate Carbon Rating path, then ladders those packages through Basic, Premium, Select, and Corporate tiers. Product pages add the buyer-side layer: Ratings, IQ Plus, Carbon Action Manager, and partner-connected carbon data workflows. That evidence supports a broad multi-product model spanning supplier subscriptions, enterprise procurement budgets, and adjacent reporting workflows. The important caveat is that list packaging is not the same as realized economics. The pricing page often shows dashes or unavailable cells instead of explicit amounts, and no fetched source discloses average contract value, module attach, discounting, or renewal structure. In underwriting terms, public evidence clearly describes
    what EcoVadis sells, but not the actual revenue mix or realized unit pricing.'
