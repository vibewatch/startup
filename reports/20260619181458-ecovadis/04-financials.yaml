- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Buyer / payer
  - Public status
  - Revenue-quality comment
  - Diligence ask
  rows:
  - - Sustainability Ratings subscription
    - Assessment plus recurring scorecard sharing and benchmarking
    - Supplier / rated company
    - Clearly disclosed as packaged tiers
    - Likely recurring, but realized pricing and renewal behavior are not public
    - Request cohort renewals, ACV, and module attach by tier
  - - Carbon Rating subscription
    - Carbon questionnaire, scorecard, benchmarking, and sharing
    - Supplier / rated company
    - Clearly disclosed as separate offer
    - Shows carbon as monetizable module, but price realization is not public
    - Request price cards, usage mix, and conversion from Ratings to Carbon
  - - Corporate multi-entity management
    - Group document sharing and entity scorecard management
    - Large enterprise groups
    - Disclosed as Corporate tier feature set
    - Implies expansion revenue within enterprise groups but no disclosed seat/entity economics
    - Request entity count per contract and parent-child pricing rules
  - - IQ Plus risk intelligence
    - Contactless risk mapping, live monitoring, documents, dashboards
    - Enterprise procurement / compliance buyer
    - Product page clearly shows enterprise use case
    - Appears software-like and recurring, but no disclosed contract size or margin profile
    - Request booked ARR, implementation scope, and average seats or suppliers covered
  - - Carbon Action Manager / Carbon Data Network
    - Supplier carbon data collection, scorecards, dashboards, compliance workflows
    - Enterprise procurement / sustainability buyer
    - Clearly disclosed on product pages and partner launches
    - Supports larger enterprise workflows, but monetization of data-network usage is not public
    - Request module pricing, attach rate, and supplier-activation economics
  - - Partner-integrated reporting workflows
    - EcoVadis data feeds Workiva or Watershed workflows
    - Shared enterprise buyer budget
    - Publicly evidenced through partnerships
    - Strategically important for wallet share, but no take-rate or revenue-share terms are public
    - Request partner contracts, pricing responsibilities, and logo-to-revenue conversion
  notes: Rows separate what is visibly sold from what is still unknown about realized pricing, contract value, and revenue mix.
