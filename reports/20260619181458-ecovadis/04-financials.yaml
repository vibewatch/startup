- id: TI006
  title: Public financial gaps and filing surfaces table
  columns:
  - Surface
  - What is public
  - Strength
  - Missing detail
  - Implication
  rows:
  - - Official pricing page
    - Packaging, feature ladders, company-size segmentation
    - Good for monetization architecture
    - No usable price points or realized pricing metrics
    - Supports business-model mapping but not revenue modeling
  - - Official and investor pages
    - Timeline, financing milestones, old ARR/headcount snapshots
    - Good for chronology and category positioning
    - No current valuation, ARR, or margin disclosure
    - Supports direction, not precision
  - - Companies House filing history
    - Annual small-company accounts and confirmation statements for EcoVadis UK Limited
    - Useful statutory proof that at least one entity files accounts
    - No consolidated parent-company financial statements on the fetched page
    - Entity-level compliance is not group-level transparency
  - - 2025 Purpose Report release
    - Network, GHG, worker, and purpose-governance metrics
    - Good for operating-scale proxies and purpose oversight
    - No paid-customer, cash, debt, or profitability disclosure
    - Helpful for scale narrative, weak for underwriting
  - - Partnership announcements
    - Audit-ready carbon data and workflow integrations
    - Good for product expansion evidence
    - No pricing, contract value, or revenue-share terms
    - Commercial breadth is visible but economics are hidden
  - - Adverse regulation coverage
    - ESGR authorization, methodology, and governance requirements
    - Good for compliance-cost risk framing
    - No EcoVadis-specific authorization outcome disclosed yet
    - Regulatory burden is visible before financial impact is quantified
  notes: This table separates evidence surfaces that are genuinely informative from those that still fail to provide underwriting-grade financial detail.
