- id: capital-structure-filing-surfaces-and-adequacy
  title: Capital structure, filing surfaces, and capital adequacy
  body: Historical equity financing is visible even though current liquidity is not. Public disclosures support a 2016 Partech round, a roughly $200 million CVC-led 2020 round, and an approximately 500 million 2022 round led by Astorg and BeyondNetZero / General Atlantic that pushed total capital raised above $725 million. The 2022 release also says CVC remained the largest institutional shareholder after that transaction. Those facts matter because they support the view that EcoVadis entered its current growth phase with substantial equity backing and investor sponsorship. The same evidence set still stops short of current capital adequacy. The only easy statutory filing surface fetched in this run is Companies House filing history for EcoVadis UK Limited, which exposes annual small-company accounts and confirmation statements for a local entity rather than consolidated parent-company cash, debt, or runway. Public evidence therefore supports financing history and investor presence, but
    it does not let an outsider determine whether EcoVadis is self-funding, carrying debt, or nearing another financing trigger.
