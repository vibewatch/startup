  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Current product-by-product ARR or revenue mix across Ratings, Carbon, IQ, and partner-driven workflows.
    whyItMatters: Without mix, it is impossible to judge whether growth is concentrated in high-quality recurring software or in more service-heavy modules.
    diligencePath: Request a management-prepared ARR bridge by module, segment, and geography for 2024-2026.
    relatedQuestionRefs:
    - QI006
    - QI009
    relatedTableRefs:
    - TI001
    - TI004
  - type: private-evidence-only
    severity: material
    topic: paid-customer-definition
    missingEvidence: A clean reconciliation from buyers, rated suppliers, screened companies, and GHG reporters to paying customers and contracted accounts.
    whyItMatters: Public network metrics are large, but they cannot be converted into revenue quality or concentration without a denominator that maps to contracts.
    diligencePath: Request customer-count definitions, account hierarchy rules, and module attach by cohort.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR, churn, and implementation-cost allocations by product line.
    whyItMatters: These metrics determine whether EcoVadis behaves like a high-quality recurring software business or a more labor-intensive hybrid model.
    diligencePath: Request cohort retention tables, gross-margin schedules, and sales-efficiency dashboards from finance.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt facilities, and covenant position.
    whyItMatters: Historical fundraising alone does not answer whether the company is self-funding, leveraged, or nearing another financing trigger.
    diligencePath: Request latest board pack, cash bridge from the 2022 financing, debt schedule, and 12-24 month operating plan.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: consolidated-financials
    missingEvidence: Consolidated parent-company statutory accounts, valuation support, and a current ownership table.
    whyItMatters: Entity-level UK filings do not substitute for group-level visibility into revenue quality, capital structure, or dilution.
    diligencePath: Request current cap table, investor rights summary, and latest consolidated financial statements or lender-quality management accounts.
    relatedQuestionRefs:
    - QI018
    - QI024
    - QI025
    relatedTableRefs:
    - TI005
    - TI006
  - type: stale
    severity: material
    topic: current-arr
    missingEvidence: A 2024-2026 ARR or revenue run-rate update that supersedes Astorg’s acquisition-era snapshot and the 2022 growth disclosure.
    whyItMatters: Current ARR is the most important missing underwriting metric and the fetched public record only offers stale or indirect proxies.
    diligencePath: Request the most recent monthly ARR dashboard, board-approved budget, and any lender or investor reporting package.
    relatedQuestionRefs:
    - QI009
    - QI025
    relatedTableRefs:
    - TI004
    - TI006
