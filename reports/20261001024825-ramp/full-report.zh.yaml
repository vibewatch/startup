      - number: '5.2'
        title: 软件架构、基础设施与智能体自动化
        blocks:
          - type: paragraph
            body: >-
              Ramp 采用云端微服务和分布式沙箱执行环境，以加快开发和生产部署。内部工程团队使用 Inspect 编码智能体；它在 Modal Sandboxes 中运行。每个沙箱启动时都会加载完整技术栈，包括
              PostgreSQL、Redis、Temporal、RabbitMQ、OpenCode 智能体、VS Code 服务端以及用于视觉回归验证的 Chromium VNC 堆栈。分布式定时任务每 30
              分钟克隆一次代码仓库并生成最新文件系统快照，使新的智能体会话能在数秒内完成初始化。部署仅数月，Inspect 在 Ramp 前后端代码仓库中支撑的已合并 PR 比例便从 30% 跃升至 50% 以上，且
              Inspect 本身 80% 以上的代码均由该智能体自主编写。核心财务处理上，Ramp 针对 NetSuite、QuickBooks Online、Xero、Sage Intacct 和 Workday 等主流
              ERP 平台构建了双向同步管道。
