        title: 要点展台
        blocks:
          - type: callout
            title: 投资立场：在当前隐含估值倍数下维持跟踪
            body: >-
              Ramp 执行速度快，也在把产品拓展到 AI 原生财务工作流；但 $44B 至 $60B 估值相当于运行率收入的 29x 至 40x。在一手尽调核实软件业务利润率及清算优先权结构前，投资者应维持
              TRACK（跟踪）立场。
