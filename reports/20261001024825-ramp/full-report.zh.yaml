      - number: '4.2'
        title: 商业经济模型、GTM 效率与获客路径
        blocks:
          - type: paragraph
            body: >-
              Ramp 以免费基础版做产品驱动增长（PLG），先吸引快速成长的中小企业，再把它们转化为高价值企业客户。申请授信的企业须在绑定的美国商业银行账户中至少保有
              $25,000，以便在没有个人担保的情况下按月偿还记账卡欠款。年化收入至少 $100,000 的企业客户已超过 3,200 家；企业支出额同比增长超过 100%。Ramp 与
              NetSuite、QuickBooks Online、Sage Intacct 实时同步，深度嵌入财务核算流程，增加了运营切换成本，并支撑较高的 NRR。AP
              和发票数字化还让供应商带来新的使用者，提升销售效率；Ramp 因而能从一个部门扩展到采购、差旅等场景，不必同比例扩充直销团队。
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI010
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
