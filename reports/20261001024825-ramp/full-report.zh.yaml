  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与评级建议
        blocks:
          - type: paragraph
            body: >-
              Ramp 2026 年的经营进展突出，但入场估值风险也很高。公司称年化收入超过 $1B、自由现金流转正，年化采购额超过 $200B，活跃企业账户超过 70,000。企业卡和支出工作流的领先地位有业务数据支撑；但
              2026 年 6 月 F 轮投后估值已达 $44B，据报道后续洽谈估值甚至达到 $60B，抬高了投资门槛。按年化收入计算，隐含估值为 29x 至 40x，远高于历史金融科技交易和上市 SaaS 同行。因此建议维持
              TRACK（跟踪）立场，风险评级为高。按当前后期私募估值投资前，应进一步核实净软件毛利率、交易抽佣率和优先清算权结构。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
