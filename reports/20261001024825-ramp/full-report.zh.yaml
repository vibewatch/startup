      - CV003
      - CV004
      - CV005
      - CV008
      - CV014
  - id: TV002
    title: 投资逻辑与反向逻辑评估表
    columns:
      - 核心支柱
      - 正向逻辑支撑
      - 反向逻辑抗辩
      - 逻辑破裂 / 观点调整触发条件
    rows:
      - - 运营规模与增速
        - Ramp 年化总交易额（TPV）达 $200B，服务 70,000+ 家企业，TPV 同比增速约 170%，展现出赛道主导地位。
        - 若核心使用场景仍局限于同质化的企业卡刷卡支付，刷卡交易规模增长未必能转化为高毛利的软件收入。
        - TPV 同比增速放缓至 50% 以下，或大企业客户年化流失率加速突破 15%。
      - - AI 产品架构
        - Ramp 推出了自主会计智能体、Token 支出管理及智能体发卡功能，构建起专有 AI 护城河。
        - 竞争对手及大模型厂商或将支出管理 AI 功能同质化，使自动对账沦为标配基础能力而非付费增值功能。
        - 无法证明 Ramp Plus 与 AI 智能体模块贡献超过 $100M 的独立 ARR。
      - - 大企业客户渗透
        - 3,200+ 家大企业客户贡献年化收入超 $100,000，涵盖 Shopify、Uber、Figma 及 Visa 等知名企业。
        - 大企业支出管理项目面临传统 ERP 存量厂商的激烈销售阻力，且大客户销售周期漫长。
        - 新增知名大企业客户停滞，或客户合同整合偏向 Rippling 等一站式打包套件。
      - - 估值与估值倍数
        - Ramp 年化收入突破 $1B 且自由现金流转正，支撑其在一级市场估值中位居前十分位。
        - 对应 29x 至 40x 收入估值倍数，Ramp 较公开市场高增长金融科技与支付可比标的享有 4x 至 8x 的倍数溢价。
        - 公开市场估值倍数进一步收缩，或老股转让折价超过 30% 完成交割。
    notes: 本分析将关键投资驱动因素与结构性反向观点进行对比；触发条件代表可量化的信号，用于促成评级上调或下调。
