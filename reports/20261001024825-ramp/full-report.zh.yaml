            body: >-
              为拓展美国以外的客户，Ramp 的 Money Platform International 团队搭建多币种账本和跨境支付通道，接入 SEPA、BACS、SWIFT 网络。平台支持在 33 个国家本地发卡，也可在
              200 多个法域以 40 多种货币报销员工费用。企业安全措施包括单点登录（SSO）、持续欺诈监测、自动化合规评估智能体，以及财务记录的字段级加密。不过，Ramp 仍依赖 Sutton Bank 等外部银行和
