      - number: '4.3'
        title: 营业成本结构、毛利率走向与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              尽调 Ramp 的财务表现，首先要分清支付业务和软件业务的毛利率。传统 SaaS 支出管理软件的毛利率通常为 75% 至
              85%；刷卡手续费占比较高的模式则要扣除银行赞助费、清算网络费用和客户返现，后者最高可达交易额的 1.5% 至 5%。Ramp 尚未公开经审计的营业成本和毛利率构成，因此外部估算差距很大。Sacra 估计，截至
              2026 年 5 月，Ramp 年化收入运行率达到 $1.5B；Bloomberg 也报道称运行率超过 $1.5B，公司则确认年化收入突破 $1B。要判断综合毛利率更接近支付处理（45% 至
              60%）还是企业软件（70% 以上），仍须补齐关键数据，才能评估其二级市场估值倍数。
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
