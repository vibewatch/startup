            title: 变现模式转型：从纯刷卡分成迈向混合 SaaS
            body: 虽然企业卡手续费分成仍承载着 Ramp 每年 $200B+ 交易量的大头，但向 Ramp Plus 及企业级定制合同的延展，标志着公司正朝着享有更高估值倍数的经常性订阅收入实现关键转型。
