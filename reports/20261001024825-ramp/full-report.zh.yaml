chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与平台架构
        blocks:
          - type: paragraph
            body: >-
              Ramp Business Corporation 于纽约市创立，专注财务运营与支出自动化 [CO001]。平台把企业卡发卡、软件驱动的费用管理、应付账款自动化、采购、商旅预订和资金管理整合到同一界面
              [CO004]。传统企业卡机构主打员工积分和消费福利；Ramp 则把平台定位为财务管控引擎，目标是压缩浪费性支出、找出重复的 SaaS 订阅并自动记账 [CO004]。Ramp
              总部位于曼哈顿，通过特拉华州注册主体在全美运营，并持有支持多主体商业账户所需的有效监管与支付牌照 [CO002]。
            claimRefs:
              - CO001
              - CO002
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              Eric Glyman、Karim Atiyeh 和 Gene Lee 于 2019 年 3 月共同创立 Ramp，目前仍以高管和运营负责人的身份带领公司 [CO001]。创办 Ramp 前，三人共同打造并扩大了
              Paribus，一项自动追踪消费品价格并提供返现的服务；Capital One 于 2016 年收购了 Paribus [CO003]。三人在大型商业银行共事的经历，直接影响了 Ramp
              的财务数据管道和企业卡核保技术设计 [CO003]。在 CEO Eric Glyman 和 CTO Karim Atiyeh 的领导下，Ramp 采用独立的赞助银行发卡模式，与 Celtic
              Bank、Sutton Bank、Column N.A. 和 Lead Bank 合作；申请经核保批准后，客户可获 Visa 品牌企业信用卡 [CO005]。
            claimRefs:
              - CO001
              - CO003
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
      - number: '1.3'
        title: 融资历程与机构投资方阵营
        blocks:
          - type: paragraph
            body: >-
              Ramp 的融资历程既体现机构投资者快速加码，也反映出公司估值对金融科技周期的敏感度 [CO006]。2021 年 8 月，Thrive Capital 领投 $300M C 轮，Ramp
              由此跻身独角兽行列，估值达 $3.9B [CO006]；2022 年 3 月，公司又以 $8.1B 估值完成 $750M D 轮股权与债权融资 [CO007]。金融科技市场随后回调，Khosla Ventures
              领投的 2023 年 8 月 D-2 轮将估值拉回至 $5.8B [CO008]。业务此后再度提速：2025 年 11 月估值升至 $32B [CO009]；2026 年 6 月，ICONIQ
              Capital、GIC 和 Ontario Teachers' Pension Plan 联合领投 $750M F 轮，估值达到 $44B [CO011]。Ramp 累计股权融资已超过
              $3B，已搭建起一张涵盖多家顶尖主权财富基金、养老金和风险投资机构的股权结构表 [CO011]。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
