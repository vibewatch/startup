    title: 投资建议决策逻辑
    type: flow
    summary: 从经验证的业务规模与收入势能，递进推导至 TRACK 建议与尽调要求。
    data:
      nodes:
        - id: N1
          label: 业务规模：$200B TPV 与 70,000 家客户
          detail: Ramp 展现出经验证的高速发展态势，TPV 同比增幅达 170%，且自由现金流转正。
          tone: positive
        - id: N2
          label: 营收里程碑：$1.0B+ 至 $1.5B 年化运行率
          detail: 年化营收在 2025 年底突破 $1B，预计到 2026 年中达 >$1.5B。
          tone: positive
        - id: N3
          label: 融资现状：$44B Series F 与 $60B 估值洽谈
          detail: 估值在 12 个月内由 $16B 跃升至 $44B；围绕 $60B 估值的讨论尚处早期阶段。
          tone: warning
        - id: N4
          label: 估值阻力：29x–40x 隐含营收倍数
          detail: 估值溢价大幅超越 Brex 对标基准（$5.15B 并购对价）及上市金融科技可比公司。
          tone: critical
        - id: N5
          label: 未经证实的经济模型：毛利率与清算优先权
          detail: 刷卡手续费（Interchange）与软件毛利拆分及清算优先权条款仍未公开披露。
          tone: warning
        - id: N6
          label: 最终立场：建议 TRACK 并等待一手深度尽调
          detail: 建议密切监控业务推进，待估值回归常态或争取到下行保护条款后再行介入。
          tone: neutral
