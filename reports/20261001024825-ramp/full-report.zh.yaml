      - number: '8.4'
        title: 市场可比标的、尽调重点与投资逻辑预警
        blocks:
          - type: paragraph
            body: >-
              Capital One 于 2026 年以 $5.15B 收购主要竞争对手 Brex，为 Ramp 估值提供了重要参照。这笔交易显示，传统银行可以按个位数收入倍数收购同类发卡业务。若 Ramp 要支撑 $44B
              至 $60B 估值，管理层必须证明：超过 3,200 家年化收入逾 $100,000 的企业客户，以及 AI 智能体架构，足以抵挡传统金融服务的同质化竞争。若年化 TPV 增速跌破 50%、大型企业 NRR
              停滞，或 Sutton Bank 的 BIN 赞助条款明显恶化，投资逻辑就会受损。参与老股交易或未来融资前，投资人应要求直接查阅经审计的毛利率构成、分客群留存数据和清算优先权层级。
            claimRefs:
              - CV005
