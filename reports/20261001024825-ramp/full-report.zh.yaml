companyProfile:
  summary: >-
    Ramp 是一家处于后期阶段的非上市金融科技企业支出管理平台，集成了企业卡、费用报销、账单支付、采购协同、商旅预订、企业银行及会计自动化功能。公开证据显示，公司拥有超过 70,000 家企业客户、逾 $1B 年化收入，并在 2026
    年 6 月获得 $44B 估值；但公司至今仍未公开披露经审计的毛利率、净收入留存率（NRR），以及刷卡手续费与软件订阅收入的具体构成比例。
