      - number: '7.4'
        title: 合作方依赖与高估值预期互为制约
        blocks:
          - type: paragraph
            body: >-
              Visa 是既有证据中唯一明确指名的支付清算网络依赖方：Ramp 称其企业卡使用 Visa 网络，并在融资公告中披露与 Visa 签署了多年期合作协议，共同开发具备实时管控的 AI
              智能体支付。但现有证据未披露商业分成条款、续约权益、SLA 保障水平、赞助银行集中度或可替代性，因此单凭合作关系的存在并不能推定系统具备抗风险韧性。财务层面，公司完成 $750M
              原始股权融资且自报自由现金流转正，虽缓解了迫在眉睫的融资担忧，但并未展现当前可用流动性、经常性收入、毛利率或潜在坏账损失敞口。Finovate 对其估值的质疑以及篇幅受限、滞后的 PM Insights
              报告，进一步突显出在认定该估值具备下行保护前，必须获取经审计财报、完全稀释后的股权结构表、合作方经济条款并进行情景压力测试。
