            body: >-
              产品线的广度让平台顺理成章地从企业卡和报销切入应付账款、采购、商旅、银行账户、数据报表及会计集成，但现有材料并未量化交叉销售、续约率、金额毛留存率（GRR）、净收入留存率（NRR）、客户流失率、同客群留存表现或客户集中度
