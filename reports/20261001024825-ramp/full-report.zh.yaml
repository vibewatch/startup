  - id: TV001
    title: 投资建议汇总表
    columns:
      - 维度
      - 评级 / 立场
      - 核心依据
      - 决策含义
    rows:
      - - 投资建议
        - TRACK（持续跟踪）
        - $44B 至 $60B 的隐含估值对应 29x 至 40x 年化收入（$1.5B 年化运行率）。
        - 保持密切跟踪；待一手毛利率与客户留存数据核实后再考虑股权投资。
      - - 置信度
        - 中
        - 公开一手数据证实了 $750M F 轮融资与 $1B+ 收入规模；$60B 老股转让谈判传闻尚未获证实。
        - 对业务规模与发展势头置信度高，但对资本结构经济性的置信度适中。
      - - 风险评级
        - 高
        - 估值倍数面临重大压缩风险；主要竞争对手 Brex 被 Capital One 收购的价格仅为 $5.15B。
        - 若增长放缓或 AI 工作流商业化变现无法抵消交换费费率压缩，下行保护将较为有限。
      - - 估值立场
        - 偏高（Stretched）
        - 估值在 12 个月内翻了三倍（从 2025 年 6 月的 $16B 跃升至 2026 年 6 月的 $44B）；老股转让传闻达 $60B。
        - 须在企业级 ARR 增长与软件利润率扩张上均达完美表现，方能支撑当前每股估值。
    notes: 投资立场综合总结，结合了已证实的 2026 年 6 月 F 轮定价、据报道 2026 年 9 月老股交易讨论以及公开可比公司基准。
    claimRefs:
