      - number: '1.4'
        title: 经营规模、业务里程碑与战略阻力
        blocks:
          - type: paragraph
            body: >-
              到 2026 年年中，Ramp 已披露拥有 70,000 多家活跃企业客户，企业卡与应付账款年化采购交易额超过 $200B [CO012]。公司还称年化收入突破
              $1B、经营性自由现金流转正，朝自我造血迈出关键一步 [CO014]。2026 年初，Ramp 收购英国及欧洲支付平台 Billhop 和差旅服务商
              Juno，并在伦敦、斯德哥尔摩设立区域运营中心，开始拓展国际业务 [CO010]。竞争也在升温：Capital One 已达成以 $5.15B 收购主要对手 Brex 的协议 [CO013]。Brex
              因此可直接借助大型银行的资产负债表和低成本资金；Ramp 则要靠独立赞助银行伙伴守住份额，同时面对外界对其刷卡手续费分成与软件订阅收入比例不透明的质疑 [CO013, CO015]。
            claimRefs:
