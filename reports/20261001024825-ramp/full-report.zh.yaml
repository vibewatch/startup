      - number: '8.3'
        title: 情景分析：乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析从 2026 年 6 月入场价格出发，估算未来三年的经营路径和估值结果。乐观情景下，收入达到 $3.0B 或更高，AI 会计自动化占净收入 40%，并以 25x 至 30x 倍数 IPO，股权估值可达
              $75B 至 $90B，对应 1.7x 至 2.0x 回报。基准情景下，三年收入达到 $2.0B 至 $2.5B，估值回归 18x 至 22x 收入，退出估值为 $40B 至 $50B；以 2026 年 6
              月入场的投资者可获约 1.0x 至 1.2x 回报。悲观情景下，宏观逆风压缩企业 IT 预算，刷卡手续费增速降至 25%，市场估值下修至 8x 至 12x 收入。企业价值届时可能降至 $15B 至 $25B，相较
              $44B 融资估值，投资本金将损失 45% 至 65%。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
