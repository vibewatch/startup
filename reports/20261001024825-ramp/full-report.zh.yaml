      - number: '4.4'
        title: 资本实力、现金流与投资判断
        blocks:
          - type: paragraph
            body: >-
              在完成由 ICONIQ、GIC 和安大略省教师退休金计划联合领投的 2026 年 6 月 F 轮融资后，Ramp 资本实力雄厚；该轮以 $44B 投后估值发行新股，募集 $750M。公司累计股权融资额已突破
              $3B。管理层确认 Ramp 已实现自由现金流转正，显著降低了未来对外部融资的依赖及短期内稀释股权的需求。尽管管理层重申了最终推进首次公开募股（IPO）的规划但未明确具体时间表，参与老股转让或意向 IPO
              份额配售的投资人，必须审慎权衡 Ramp 已获验证的经营体量（$200B+ 交易额、70,000+ 账户、逾 $1B 年化收入）与最新一轮融资所隐含的高达 ~29x 至 44x
              市销率估值倍数。机构若要建立投资确信度，前提是必须获取经审计的 ASC 606 收入确认明细表、刷卡综合抽佣率（take-rate）走势以及客户数毛留存率（gross logo retention）等核心指标。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI012
              - CI015
