  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与核心产品功能
        blocks:
          - type: paragraph
            body: >-
              Ramp 提供企业支出管理和财务运营平台，帮助企业管住开支、自动处理 AP，并加快月结。平台把 Visa 企业记账卡、费用管理、发票处理、商旅预订、供应商采购和 FDIC
              保险保障的企业银行账户接入同一工作流。财务团队可在交易发生时设定供应商限额；员工能通过短信、Slack 或手机上传票据，系统自动匹配刷卡记录，并将发票与采购订单进行二方或三方匹配。Ramp 服务超过 70,000
              家企业，企业卡和 AP 年化支付额超过 $100B；公司称结账速度提高 75%，平均成本降低 5%。
