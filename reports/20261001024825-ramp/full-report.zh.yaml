  - id: TV003
    title: 乐观 / 基准 / 悲观估值情景表
    columns:
      - 情景
      - 经营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率判断
    rows:
      - - 乐观情景（$75B–$90B 退出估值）
        - ARR 在 24 个月内扩张至 $3.0B+；软件收入占比升至 40%；净利率达到 25%。
        - 假设以 25x–30x 软件与金融科技混合倍数成功 IPO，相对于 $44B F 轮入场估值取得 1.7x–2.0x 回报。
        - 宏观经济下行致使企业 IT 预算收紧，或监管层对企业卡刷卡交换费设置上限。
        - 25% —— 取决于 TPV 持续保持三位数增长以及 AI 会计智能体商业化成功变现。
      - - 基准情景（$40B–$50B 退出估值）
        - 收入在 3 年内达到 $2.0B–$2.5B；TPV 年增速维持在 50–70%；综合毛利率稳定在 55%。
        - 退出估值倍数压缩至 18x–22x 收入；$44B 估值入场的投资者获得约 1.0x–1.2x 资本回报。
        - 长期高利率环境推迟科技公司 IPO 进程，并压低晚期一级市场估值倍数。
        - 50% —— 兼顾赛道领导地位与估值倍数回归常态的最可能路径。
      - - 悲观情景（$15B–$25B 退出估值）
        - 收入增速放缓至 25%；刷卡交换费率面临下行压力；来自 Brex 及 Rippling 的价格竞争加剧。
        - 估值重估至公开市场金融科技 8x–12x 收入倍数，相对于 $44B 估值导致 45%–65% 的资本减值。
        - 资本结构中的清算优先权引发后轮股权持有人的严重稀释。
        - 25% —— 若宏观经济下行冲击交易规模与初创企业支出，则风险极高。
    notes: 情景模型基于 2026 年 6 月 F 轮融资起算的 3 年投资周期；回报率反映未经清算优先权调整的企业整体估值增长。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV011
      - CV012
