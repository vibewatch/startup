  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Ramp 所在市场是帮助企业管控、审批、支付和核算支出的财务运营软件，涵盖企业卡、费用管理、应付账款、采购、预算、供应商管理、商旅及会计或 ERP 集成。个人零售银行、加密货币兑换、无障碍坡道，以及全部 B2B
              交易总额均不在范围内。企业实际可替代方案包括单点工具、银行发行的企业卡、ERP 模块、电子表格、邮件审批和人工对账。划清边界很重要：检索结果还包括加密货币「入金通道」和实体模块化坡道研究；它们只是名称碰撞，并非
              Ramp 的相邻业务或可触达收入。相关范围内，一份竞品对比将 Ramp 描述为以企业卡为核心的财务运营平台，并在报销流程上增加账单支付和采购模块。
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: 受限于可用证据的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              现有资料能展示 Ramp 的经营规模，却不足以可靠估算 TAM、SAM 或 SOM。Ramp 称平台有 70,000 多家企业用户，企业卡与 AP 年化支付额超过 $100B；另一份公开报告则分析了逾
              40,000
              家企业的数十亿笔脱敏汇总交易。这些数字反映客户采用、支付吞吐量和专有数据覆盖面，不是收入、ARR、品类总支出或合格买家数量。两份加密货币入金通道报告对基期规模和预测增速也有明显分歧，且讨论的是完全不同的产品类别。因此，展台保留每项指标的原单位与分母，把品类市场规模列为证据缺口，不把支付额或客户数硬折算成估值输入。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM008
              - CM010
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM008
              - CM009
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM006
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: 决策买家、实际用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的经济决策买家是负责支出管控和财务效率的财务负责人；财务总监、AP
              团队、采购部门、业务主管和员工则参与不同环节。这一判断来自产品模块，以及竞品对比所描述的选型分歧：由财务主导的企业卡与费用自动化，还是更深入的采购治理。客户通常先用企业卡或费用管理，再扩展到账单支付、采购、预算、商旅、多主体管控和
              ERP 同步，带来交叉销售空间。但公开资料没有披露合同金额、模块附加率、实施周期、买家转化率或各客群留存率。Ramp 的公开 API 文档证明其提供开发者接口；现有材料太有限，无法判断哪些集成会实质影响采购决策。
            claimRefs:
              - CM001
              - CM006
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动因素、制约瓶颈与估值相关性
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的增长动力包括整合工作流、实时管控支出、减少手工处理，以及打通企业卡、发票、预算和会计系统的可视性。Ramp 称客户平均可节省 5%
              或更多开支，但公司注明这只是示例估算，可能计入节省工时、返现和非刷卡支出，也不保证实际收益，因此不能单独作为 ROI 证据。主要制约来自产品边界：竞品认为 Ramp
              的采购能力建在企业卡优先的平台上，尚未覆盖端到端战略寻源、直接物料流程或持续的供应商风险监控。客户切换成本、监管壁垒、实施投入和预算归属也缺少量化数据。缺乏独立的品类规模和分客群经济模型会影响估值判断；交易额和客户数不能替代可变现市场规模、收入质量、留存或利润率证据。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM013
              - CM014
      - number: '2.5'
        title: 要点展台
        blocks:
          - type: callout
            title: 切勿将支付交易额误当作 TAM
            body: Ramp 披露的年化企业卡与 AP 支付交易额仅衡量流经平台的资金体量，并不能直接折算为软件收入、年度经常性收入（ARR）、可触达支出规模或变现抽佣率（take rate）。
            calloutType: risk
            claimRefs:
              - CM003
              - CM013
          - type: callout
            title: 品类覆盖拓展了增长边界，但也加剧了竞争
            body: 统一的产品界面有助于推动模块拓展，但也让 Ramp 同时正面迎战发卡行、报销工具、AP 平台、采购系统和 ERP 工作流，各赛道的采购买家及替换成本大相径庭。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场分类与演进变局
        blocks:
          - type: paragraph
            body: >-
              Ramp 面对五类竞争者：风投支持的企业记账卡公司、传统银行商业卡发行方、以发票和 AP 为核心的自动化软件、差旅与费用管理（T&E）软件，以及面向开发者和初创公司的商业银行平台。过去，Brex 是 Ramp
              最直接的同行；两家公司都率先按企业现金余额自动核保，且不要求个人无限连带担保。Capital One 以 $5.15B 收购 Brex 的交易于 2026 年 4 月 7 日交割，竞争格局由此改写，Ramp
              成为少数仍独立运营、且已具规模的记账卡与财务运营平台中的领先者。与此同时，American Express、Corpay
              等传统发卡行凭商业授信覆盖面和协商制刷卡手续费返利竞争；BILL、Expensify、SAP Concur 等订阅软件则守住应付账款和差旅管理等核心流程。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP008
              - CP012
      - number: '3.2'
        title: 功能矩阵与架构取舍
        blocks:
          - type: paragraph
            body: >-
              Ramp 与替代方案的差别不只是功能多少，更在于产品架构。Ramp 用自动规则和 Policy Agent 在员工刷卡时即时执行费用政策；SAP Concur 等传统工具则多在交易后审计。它还把 AP
              自动化、企业卡、票据识别和核心 ERP 同步纳入免费基础版。但这套模式也划定了产品边界：Ramp 不像 Expensify 和 Navan 那样支持自带卡（BYOC）；客户必须把支出全部转到 Ramp 发行的
              Visa 记账卡上，才能使用自动化工作流。此外，客户须在美国商业银行账户中至少存有 $25,000，并具备公司法人身份，因此个体经营者和资金紧张的小企业难以申请，而这类客户常由
              Bluevine、传统商业银行或零售小微信用卡服务。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
      - number: '3.3'
        title: 商业模式与产品定价策略对比
        blocks:
          - type: paragraph
            body: >-
              企业支出管理主要有三种收费模式：刷卡手续费补贴免费基础版、按席位收取 SaaS 订阅费，以及商业银行返利。Ramp
              主要靠美国境内刷卡手续费分成赚钱，因此核心平台可免费使用，虚拟卡不限量，基础账单支付也不收费。高级采购、多主体审批和 NetSuite、Sage Intacct 等深度 ERP 集成则放在 Ramp
              Plus，价格为每人每月 $15，另收未公开的平台费。以 AP 为主的竞品 BILL 每人每月收取 $49 至 $89 的 SaaS 费，同时通过 BILL Spend & Expense 提供免费卡。Ramp
              给持卡人统一返现，最高 1.5%，不再靠积分刺激刷卡；但习惯了 Brex 特定品类最高 7 倍积分或 Amex 奖励的高频差旅团队，可能因此不满。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.4'
        title: 迁移成本、护城河韧性与下行风险
        blocks:
          - type: paragraph
            body: >-
              更换企业卡和支出管理软件并不轻松：公司得给全体员工换卡，还要重新配置会计集成规则。Ramp 上线后客户满意度很高，在 Capterra 的 221 条评价中获 4.9
              分，用户体验评分领先同行。但需求复杂的大企业仍可能换用其他产品。多主体集团、设有海外子公司或 ERP 配置复杂的企业，可能受限于 Ramp 偏美国市场的信用核保、3%
              外币转换费，或缺少非营利组织原生基金会计功能。此类客户常转向 Corpay、Airbase（Paylocity）、Stampli 或 Tipalti 等专业 AP 平台，也可能保留 JPMorgan Chase
              或 Capital One 的商业银行关系，以应对授信额度波动。
            claimRefs:
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: 要点展台
        blocks:
          - type: callout
            title: Capital One 收购 Brex 加剧赛道分化
            body: >-
              Capital One 于 2026 年 4 月以 $5.15B 收购 Brex，纯风投支持的企业卡公司正面竞争由此告一段落。Brex
              仍有强劲的全球发卡能力，但并入持牌金融机构后，大企业核保可能趋于保守，产品路线也可能偏离原计划。与此同时，Ramp 更凸显为唯一具备规模化优势的独立财务运营平台。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: 不支持自带卡限制了大企业渗透
            body: >-
              不支持自带卡（BYOC）是 Ramp 刷卡手续费收入模式的支柱，也限制了长期渗透空间。与传统商业银行关系紧密，或依赖 Amex / Chase 企业卡积分体系的机构，若不全面换卡就无法使用 Ramp 软件，因此
              Expensify、Navan 等竞品更容易争取这类客户。
            calloutType: risk
            claimRefs:
              - CP005
              - CP014
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入构成、变现机制与定价体系
        blocks:
          - type: paragraph
            body: >-
              Ramp 主要靠两条业务线变现：刷卡交易手续费分成（interchange）和软件订阅。企业记账卡是基础收入来源；年化采购交易额超过 $200B，Ramp 从 Visa
              商业网络商户结算中分得手续费。为降低企业采用门槛，基础版不收席位费，实体卡和虚拟卡不限量，并提供 AP 账单处理、票据采集和双向会计同步。Ramp Plus 每人每月收费
              $15，企业客户还可签订定制合同，以使用多主体管理、精细采购流程和 AI 预算智能体。公司也从跨境交易收费：国际刷卡收取 3% 货币转换费；Ramp Treasury 的资产管理规模超过
              $1.5B，公司可赚取利差。不过，客户续约反馈显示，持卡数至少为 15 张的账户续约时开始被收取 $5,000 至 $10,000 的最低平台费，反映公司在潜在上市前加大变现力度。
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
