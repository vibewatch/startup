      - number: '8.2'
        title: 融资轨迹与估值纪律
        blocks:
          - type: paragraph
            body: >-
              2023 至 2026 年，Ramp 融资和估值扩张明显提速，成为非公开金融科技市场估值倍数扩张最快的案例之一。公司 2023 年估值为 $13B，2025 年 6 月升至 $16B；一年后，Ramp 以
              $44B 估值完成 $750M 新股融资，估值近乎三倍。GIC、Ontario Teachers' Pension Plan、ICONIQ、Goldman Sachs Alternatives 和 Morgan
              Stanley 等机构参与本轮。累计股权融资已超过 $3B；独立追踪机构统计，Ramp 15 轮融资共筹得 $3.22B。看多逻辑认为，AI 会计智能体、AP 自动化和代币化支出管理将推动 Ramp
              从交易型刷卡手续费模式转向高毛利的经常性软件收入。反向逻辑则指出，刷卡手续费仍是收入根基；若同质化竞争削弱软件定价能力，毛利率仍会承压。
            claimRefs:
              - CV001
