              CU012]。这些都是厂商对目标市场的描述，不是实际客户或收入分布。现有证据只能支持按工作流划分客群的假设，无法估算各客群的客户数、平均收入或集中度。竞品比较还指出，需要采购直接物料或 BOM 的工业制造企业与
