        title: 要点展台
        blocks:
          - type: callout
            title: 平台核心转向：从消费奖励走向支出优化
            body: Ramp 不靠个人积分或返利鼓励刷卡消费，而是用软件自动识别浪费、帮客户削减运营开支；这与传统企业卡的奖励模式不同 [CO004]。
            calloutType: insight
            claimRefs:
              - CO004
          - type: callout
            title: 银行整合浪潮下的赞助银行依赖隐忧
            body: >-
              Ramp 依赖 Celtic Bank、Sutton Bank 等合作银行；相较之下，竞争对手 Brex 可直接借助 Capital One 的资产负债表和更低资金成本，双方因此存在潜在的结构性不对称
              [CO005, CO013]。
            calloutType: risk
            claimRefs:
              - CO005
