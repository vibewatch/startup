            body: >-
              Capital One 以 $5.15B 收购主要竞品 Brex，为企业支出管理交易提供了更审慎的定价参照。Ramp 估值接近 Brex 的 9 倍；要支撑这一溢价，Ramp
              的软件收入就必须持续三位数增长，并顶住大型银行捆绑销售的竞争。
