  - id: FE001
    title: Ramp 集成产品与技术架构体系
    type: stack
    summary: 展示用户端工作流界面、智能体编排、总账基础设施及合作金融通道的整体架构层次。
    data:
      layers:
        - label: 客户端接入与交互层
          detail: 托管式 Web 控制台、iOS/Android 原生移动应用、Slack 机器人及短信收据解析服务。
          modules:
            - Ramp Web 控制台（React / TypeScript 应用）
            - 移动端 App（iOS 与 Android 收据采集及虚拟卡管理）
            - 接入网关（Slack 集成机器人、短信解析、Chrome 浏览器插件）
        - label: 智能分析与自主智能体层
          detail: AI 驱动的信息提取、自动化政策合规校验、反欺诈检测及后台记账归类智能体执行。
          modules:
            - Inspect 后台代码智能体（Modal Sandboxes、OpenCode、VS Code server）
            - Ramp 智能引擎（OCR 准确率达 99% 的发票信息提取、政策智能体）
            - 分布式编排（Modal Cron 30 分钟快照、Dicts 锁机制、Queues 任务路由）
        - label: 核心应用与编排层
          detail: 分布式事件编排、状态机、交易级数据存储及可观测性管线。
          modules:
            - 工作流状态引擎（Temporal 工作流、RabbitMQ 消息中间件、Python 微服务）
            - 企业数据层（PostgreSQL 事务型数据库、Redis 分布式缓存）
            - 可观测性技术栈（Datadog 遥测、Sentry 错误监控、LaunchDarkly 特性开关）
        - label: 金融通道与合作结算层
          detail: 受监管发卡通道、境内外银行桥接通道及双向 ERP 适配器。
          modules:
            - 发卡通道（依托 Sutton Bank 提供的 BIN 赞助，接入 Visa 记账卡网络）
            - 支付通道网关（美国境内 ACH、当日 ACH、Fedwire、SEPA、BACS、SWIFT）
            - ERP 同步连接器（NetSuite、QuickBooks Online、Xero、Sage Intacct、Workday）
        - label: 企业安全与合规层
          detail: 企业身份认证、审计日志记录、基于角色的访问控制（RBAC）及交易反欺诈筛查。
          modules:
            - 企业级 SSO（SAML 2.0 / Okta 集成、多因素身份验证）
            - 政策与审计风控（动态支出规则、不可篡改审批日志、SOC 2 合规认证）
            - 数据加密（针对银行凭证及交易元数据的字段级加密）
        - label: 全球银行与流动性管理层
          detail: 受 FDIC 存款保险保障的运营账户、多币种托管总账及现金管理生息基础设施。
          modules:
            - 存款账户（享有 FDIC 转付式存款保险保障、免账户管理费的银行账户）
            - 现金管理生息（通过 Invesco Premier US Government Money Portfolio 提供次日流动性）
            - 多币种总账（外汇结算与多实体账务合并）
    approximationNotes: 架构分层综合了 Ramp 工程团队披露资料、招聘岗位要求以及已发布的合作伙伴案例研究。
