chapter:
  number: 6
  title: "Customers"
  summary: "Ramp says more than 70,000 businesses use its financial-operations platform and that card plus accounts-payable volume exceeds $100 billion on an annualized basis. The supplied evidence demonstrates breadth and named references, but it does not disclose active-paid-customer definitions, retention cohorts, customer concentration, or independently verified expansion economics."
sections:
  - id: "segment-fit-and-buying-context"
    title: "Segment Fit and Buying Context"
    body: >-
      The available evidence supports broad organizational fit rather than a
      quantified customer mix. Ramp's product surface combines corporate cards,
      expenses, accounts payable, travel, banking, procurement, accounting
      automation, controls, reporting, and integrations, which places finance
      administrators at the center while employees participate through cards,
      receipts, reimbursements, and approvals [CU006]. Precoro describes the
      primary design center as mid-market businesses with roughly 25 to 5,000
      employees, while JAGGAER's competitor comparison extends the stated fit
      from startups through multinational enterprises [CU009, CU012]. These are
      issuer-defined positioning statements, not a disclosed distribution of
      customers or revenue. The evidence therefore supports a segmented
      workflow hypothesis, but not customer counts, average revenue, or
      concentration by segment. Industrial buyers with direct-materials or
      bill-of-materials sourcing needs are a weaker fit according to a
      competitor-issued comparison [CU014].
    claimRefs:
      - "CU006"
      - "CU009"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "reported-adoption-and-usage-scale"
    title: "Reported Adoption and Usage Scale"
    body: >-
      Ramp's help center says more than 70,000 businesses use the platform, and
      its homepage repeats that figure while naming Notion, Shopify, Webflow,
      Eventbrite, Poshmark, and Quora [CU001, CU005]. The help center separately
      reports more than $100 billion in annualized card and accounts-payable
      payment volume, more than $12 billion of customer savings, 27.5 million
      hours saved, and average savings of at least 5% [CU002, CU003, CU004].
      Every one of those commercial metrics is company-issued; the savings
      percentage is explicitly described as illustrative and may include card
      and non-card effects rather than a guaranteed realized return [CU004].
      Ramp's 2026 research paper uses a linked sample of 21,559 U.S. firms, but
      that analytical sample is not a customer-count KPI and should not be
      combined with the 70,000-business claim [CU007]. The paper also cautions
      that adopters were already larger, more technical, and faster-growing,
      limiting causal interpretation of adoption outcomes [CU008].
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "named-references-and-proof-quality"
    title: "Named References and Proof Quality"
    body: >-
      Ramp's homepage provides the strongest named-customer material in the
      assigned evidence set. It presents outcome claims for Glossier, Webflow,
      Poshmark, Notion, and other organizations, but the statements remain
      vendor-curated and do not disclose contract value, deployment date,
      renewal status, paid-seat count, or card and accounts-payable volume
      [CU005]. Precoro independently repeats that Shopify, Notion, and Glossier
      are among businesses that have used Ramp, providing a second issuer for
      some names but not independent verification of current production status
      or outcomes [CU010]. Accordingly, the named-customer exhibit is a sample
      of public references, not an exhaustive installed-base roster. The
      Browserbase page demonstrates that a partner published a case study about
      building Ramp finance agents, but the prefetched text contains only its
      title, so it cannot substantiate deployment scope or customer results
      [CU015].
    claimRefs:
      - "CU005"
      - "CU010"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-diligence"
    title: "Durability, Expansion, and Diligence Priorities"
    body: >-
      Product breadth creates plausible adjacency from cards and expenses into
      accounts payable, procurement, travel, banking, reporting, and accounting
      integrations, but the supplied sources do not quantify cross-sell,
      renewal, gross retention, net retention, churn, cohort behavior, or
      customer concentration [CU006]. Fast setup may help adoption: JAGGAER's
      competitor comparison says card and accounts-payable implementations are
      reported to become operational within a week [CU013]. That same
      competitor-issued source says Ramp lacks direct-materials and
      bill-of-materials sourcing, while Precoro describes reduced depth for
      highly complex accounts-payable environments and possible workflow or ERP
      workarounds [CU011, CU014]. Those constraints may cap expansion in complex
      enterprises, but neither competitor source is an independent benchmark.
      A search collision also matters for diligence hygiene: the assigned SEC
      result is a LiveRamp Holdings filing under ticker RAMP, not a filing by
      the private fintech company analyzed here [CU016]. It is retained only to
      document that mismatch, not as evidence about Ramp's customers.
    claimRefs:
      - "CU006"
      - "CU011"
      - "CU013"
      - "CU014"
      - "CU016"
    figureRefs:
      - "FU001"
