  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Rating / Stance
      - Key Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - TRACK
        - Implied valuation of $44B to $60B reflects 29x to 40x annualized revenue ($1.5B run rate).
        - >-
          Maintain active monitoring; defer equity participation until primary gross margin and retention data are
          verified.
      - - Confidence
        - Medium
        - Public primary data confirms $750M Series F and $1B+ revenue; unconfirmed secondary talks at $60B.
        - High confidence in operating scale and traction, but moderate confidence in capital structure economics.
      - - Risk Rating
        - High
        - Significant multiple compression risk; Capital One acquired primary competitor Brex for only $5.15B.
        - >-
          Downside protection is limited if growth slows or AI workflow monetisation fails to offset interchange
          compression.
      - - Valuation Stance
        - Stretched
        - Valuation tripled in 12 months ($16B in June 2025 to $44B in June 2026); secondary talks at $60B.
        - Requires perfection in enterprise ARR growth and software margin expansion to justify current price per share.
    notes: >-
      Summary of investment stance synthesising verified June 2026 Series F pricing, reported September 2026 secondary
      round discussions, and public comparable benchmarks.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV008
      - CV014
  - id: TV002
    title: Thesis / Anti-Thesis Assessment
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter
      - Thesis-Break / View-Change Trigger
    rows:
      - - Operating Scale & Velocity
        - >-
          Ramp is expanding TPV at ~170% YoY with $200B annualized volume and 70,000+ businesses, showing category
          dominance.
        - >-
          Interchange volume growth may not convert to high-margin software revenue if core usage remains commoditized
          corporate card payments.
        - TPV growth slows below 50% YoY or enterprise customer churn accelerates above 15% annually.
      - - AI Product Architecture
        - >-
          Ramp has launched autonomous accounting agents, token spend management, and agentic card issuance,
          establishing a proprietary AI moat.
        - >-
          Competitors and LLM providers may commoditize spend-management AI features, rendering automated reconciliation
          a baseline capability rather than a paid tier.
        - Failure to demonstrate standalone ARR contribution from Ramp Plus and AI agent modules exceeding $100M.
      - - Enterprise Penetration
        - >-
          3,200+ enterprise customers generate over $100,000 in annualized revenue, including Shopify, Uber, Figma, and
          Visa.
        - >-
          Enterprise spend programs face intense sales friction against legacy ERP incumbents with long enterprise sales
          cycles.
        - Stalling enterprise logo additions or contract consolidation favoring bundled enterprise suites like Rippling.
      - - Valuation & Multiples
        - >-
          Ramp generated over $1B in annualized revenue with positive free cash flow, warranting a top-decile private
          valuation premium.
        - >-
          At 29x to 40x revenue multiples, Ramp trades at 4x to 8x the multiple of high-growth public fintech and
          payments peers.
        - Public market multiples compress further or secondary share transactions clear at discounts greater than 30%.
    notes: >-
      Analysis contrasts key investment drivers with structural counter-arguments; triggers represent measurable
      quantitative signals that would prompt a rating upgrade or downgrade.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV012
      - CV015
  - id: TV003
    title: Bull / Base / Bear Valuation Scenarios
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case ($75B–$90B Exit)
        - ARR expands to $3.0B+ within 24 months; software revenue reaches 40% of mix; net margin reaches 25%.
        - >-
          Assumes successful IPO at 25x–30x software-fintech blended multiple, yielding 1.7x–2.0x return on $44B Series
          F entry.
        - Slowing macroeconomic enterprise IT budgets or regulatory cap on corporate card interchange fees.
        - 25% — Dependent on continued triple-digit TPV growth and monetization of AI accounting agents.
      - - Base Case ($40B–$50B Exit)
        - Revenue reaches $2.0B–$2.5B in 3 years; TPV grows at 50–70% annually; blended gross margin stabilizes at 55%.
        - >-
          Exit multiple compresses to 18x–22x revenue; investors at $44B valuation achieve roughly 1.0x–1.2x capital
          return.
        - Prolonged high interest rate environment delaying tech IPOs and depressing late-stage private multiples.
        - 50% — Reflects most probable path balancing market leadership against multiple normalization.
      - - Bear Case ($15B–$25B Exit)
        - >-
          Revenue growth decelerates to 25%; interchange rates face downward pressure; Brex/Rippling price competition
          intensifies.
        - >-
          Valuation re-rates to public fintech multiples of 8x–12x revenue, resulting in a 45%–65% capital impairment
          from $44B valuation.
        - Capital structure liquidation preferences trigger severe dilution for later-stage equity holders.
        - 25% — High risk if macroeconomic downturn impairs transactional volume and startup spend.
    notes: >-
      Scenario models assume a 3-year investment horizon from the June 2026 Series F round; returns reflect gross
      enterprise valuation expansion before liquidation preference adjustments.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV011
      - CV012
