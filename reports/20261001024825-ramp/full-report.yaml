              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Ramp's relevant market is financial operations software used to control, approve, pay, and account for
              company spending. The core boundary includes corporate cards, expense management, accounts payable,
              procurement, budgets, vendor management, travel, and accounting or ERP integration. It excludes consumer
              banking, crypto conversion, physical accessibility ramps, and the gross value of all business-to-business
              commerce. The practical substitutes are narrower point products, bank-issued cards, ERP modules,
              spreadsheets, email approvals, and manual reconciliation. This boundary matters because the assigned
              search results included both crypto "on-ramp" research and physical modular-ramp research. Those sources
              establish terminology collisions, not adjacencies or addressable revenue for Ramp. Within the relevant
              boundary, a competitor-issued comparison describes Ramp as card-led financial operations with bill pay and
              procurement layered onto the original expense workflow.
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports several operating-scale lenses but no defensible TAM, SAM, or SOM. Ramp
              says more than 70,000 businesses use the platform and that it supports more than $100 billion in
              annualized card and AP payment volume. A separate Ramp publication analyzes billions of aggregated,
              anonymized transactions from over 40,000 businesses. These figures indicate adoption, payment throughput,
              and proprietary data coverage; none is revenue, annual recurring revenue, total category spend, or the
              number of qualified buyers. The two crypto on-ramp reports also disagree sharply on base value and
              forecast growth, while describing an entirely different product category. Accordingly, the sizing exhibit
              keeps each metric's unit and denominator intact and records a market-size gap rather than converting
              payment volume or customer count into an unsupported valuation input.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM008
              - CM010
              - CM013
