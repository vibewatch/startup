  - id: TR002
    title: Operational, Quality, and Security Risk Register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitoring indicator / unresolved gap
    rows:
      - - Incorrect or unauthorized automated finance action
        - Medium
        - High
        - 'Partial: Ramp says actions are auditable and money movement requires human confirmation'
        - Medium-high until production error and override data are reviewed
        - Track override rates, false approvals, fraud losses, journal corrections, and customer escalations
      - - Cross-product outage or degraded payment workflow
        - Medium
        - High
        - 'Unknown: no uptime, RTO, RPO, or independent incident record was available in the assigned pool'
        - High because the product suite spans multiple finance workflows
        - Obtain status history, incident postmortems, recovery tests, uptime by product, and material SLA credits
      - - Release, acquisition, and geographic-expansion control failure
        - Medium
        - High
        - 'Developing: the company reports rapid shipping and two acquisitions'
        - Medium-high while integration and compliance evidence remains private
        - Track escaped defects, rollback frequency, acquired-system migrations, audit findings, and launch delays
      - - Fraud, access-control, or data-protection failure at scale
        - Medium
        - High
        - 'Partial: SSO, card controls, fraud monitoring, and encryption are described'
        - Medium-high without tested effectiveness and loss denominators
        - >-
          Review fraud basis points, privileged-access reviews, encryption scope, breach history, and third-party test
          results
    notes: >-
      Likelihood and severity are qualitative assessments; the source pool provides company-described controls but no
      independent operating-effectiveness, loss-rate, or availability measures.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR015
  - id: TR003
    title: Partner and Financial-Model Dependency Register
    columns:
      - Dependency
      - Counterparty / input
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure / kill criterion
    rows:
      - - Card network and issuing ecosystem
        - Visa; other financial-institution partners not identified in the retained evidence
        - Card acceptance, issuing relationship, and AI-agent payment controls
        - Unknown
        - Changed economics, restricted use, service disruption, or non-renewal
        - High
        - Multi-year Visa relationship and real-time controls are company-reported
        - >-
          High until contracts and alternatives are tested; thesis break if a critical partner materially restricts
          service
      - - Finance-system and AI workflow integrations
        - ERP, accounting, payment, and model ecosystems
        - Data ingestion, coding, reconciliation, approvals, and payment execution
        - Unknown
        - API change, model degradation, data mismatch, or vendor outage
        - High
        - Ramp describes auditability and human confirmation for money movement
        - Medium-high; thesis break if error remediation erodes automation value or customer trust
      - - Growth financing and valuation expectations
        - $750 million 2026 primary financing at a $44 billion valuation
        - Funds expansion and establishes a high private-market reference point
        - High expectation dependence; current cash availability is undisclosed
        - Growth or margin shortfall causes multiple compression and limits exit options
        - High
        - Ramp reported positive free cash flow; Sacra estimated $1.5 billion annualized revenue
        - >-
          High until audited revenue quality and margins are known; thesis break on sustained deceleration without
          margin proof
    notes: >-
      Funding raised is not treated as cash available, company-reported annualized revenue is not labeled ARR, and
      public sources do not quantify contractual concentration or switching costs.
