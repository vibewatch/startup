figures:
  - id: "FM001"
    title: "Evidence-constrained addressability hierarchy"
    type: "pyramid"
    summary: >-
      Separates Ramp's supported core and expansion workflows from unquantified
      substitutes and explicitly excluded homonym markets.
    data:
      items:
        - label: "Core: cards and expense control"
          value: "Included"
          detail: "Directly documented Ramp product surface"
        - label: "Core: accounts payable"
          value: "Included"
          detail: "Bill processing, approvals, and payments"
        - label: "Expansion: procurement and vendors"
          value: "Included with scope limits"
          detail: "Documented workflows, but enterprise sourcing depth is disputed"
        - label: "Expansion: travel, banking, and multi-entity"
          value: "Included with unknown attach"
          detail: "Documented modules without segment revenue or adoption rates"
        - label: "Substitutes: banks, ERP modules, and manual workflows"
          value: "Unquantified"
          detail: "Relevant alternatives without assigned market-share evidence"
        - label: "Crypto and physical ramp markets"
          value: "Excluded"
          detail: "Terminology collisions, not Ramp addressable markets"
    approximationNotes: >-
      This is a qualitative boundary hierarchy, not a proportional funnel or
      numeric TAM model; layer widths do not encode market size.
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM011"
      - "CM012"
      - "CM013"
