company:
  name: "Ramp"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Ramp competes in financial operations software spanning cards, expenses,
    accounts payable, procurement, and accounting automation, but the assigned
    evidence does not support a defensible category TAM, SAM, or SOM. Company
    disclosures show more than 70,000 business customers and over $100 billion
    in annualized card and AP payment volume; those are adoption and throughput
    indicators, not market-size estimates.
sections:
  - id: "market-boundary"
    title: "Market Boundary and Status-Quo Alternatives"
    body: >-
      Ramp's relevant market is financial operations software used to control,
      approve, pay, and account for company spending. The core boundary includes
      corporate cards, expense management, accounts payable, procurement,
      budgets, vendor management, travel, and accounting or ERP integration.
      It excludes consumer banking, crypto conversion, physical accessibility
      ramps, and the gross value of all business-to-business commerce. The
      practical substitutes are narrower point products, bank-issued cards,
      ERP modules, spreadsheets, email approvals, and manual reconciliation.
      This boundary matters because the assigned search results included both
      crypto "on-ramp" research and physical modular-ramp research. Those
      sources establish terminology collisions, not adjacencies or addressable
      revenue for Ramp. Within the relevant boundary, a competitor-issued
      comparison describes Ramp as card-led financial operations with bill pay
      and procurement layered onto the original expense workflow.
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Evidence-Constrained Sizing"
    body: >-
      The available evidence supports several operating-scale lenses but no
      defensible TAM, SAM, or SOM. Ramp says more than 70,000 businesses use the
      platform and that it supports more than $100 billion in annualized card
      and AP payment volume. A separate Ramp publication analyzes billions of
      aggregated, anonymized transactions from over 40,000 businesses. These
      figures indicate adoption, payment throughput, and proprietary data
      coverage; none is revenue, annual recurring revenue, total category
      spend, or the number of qualified buyers. The two crypto on-ramp reports
      also disagree sharply on base value and forecast growth, while describing
      an entirely different product category. Accordingly, the sizing exhibit
      keeps each metric's unit and denominator intact and records a market-size
      gap rather than converting payment volume or customer count into an
      unsupported valuation input.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM005"
      - "CM008"
      - "CM010"
      - "CM013"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyers, Users, Payers, and Adoption Path"
    body: >-
      The economic buyer is most plausibly a finance leader responsible for
      spend control and accounting efficiency, while controllers, accounts
      payable teams, procurement teams, managers, and employees operate
      different parts of the workflow. This segmentation is inferred from the
      product modules and from a competitor comparison that frames the buying
      choice around finance-led card and expense automation versus deeper
      purchasing governance. Adoption can begin with cards or expense
      management, then extend into bill payment, procurement, budgets, travel,
      multi-entity control, and ERP synchronization. That expansion path creates
      cross-sell potential, but the evidence does not disclose contract values,
      module attachment, implementation duration, buyer conversion, or retention
      by segment. Ramp's public API documentation confirms a developer surface
      exists, although the assigned fetched text is too thin to establish which
      integrations materially influence purchase decisions.
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM011"
      - "CM012"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Growth Drivers, Constraints, and Valuation Relevance"
    body: >-
      The strongest supported adoption drivers are workflow consolidation,
      real-time spend controls, reduced manual processing, and visibility across
      cards, invoices, budgets, and accounting systems. Ramp claims customers
      save 5% or more on average, but its own qualification says the calculation
      is illustrative, may include time savings, cashback, and non-card spend,
      and is not a guarantee. That limits its use as independent ROI evidence.
      The principal constraint in the assigned evidence is product-boundary
      pressure: a competitor argues that Ramp's procurement capabilities are
      layered onto a card-first platform and do not extend to full-cycle
      strategic sourcing, direct-material workflows, or continuous supplier-risk
      intelligence. Switching costs, regulation, implementation effort, and
      budget ownership remain insufficiently quantified. For valuation, the
      absence of independent category sizing and segment economics is material:
      throughput and customer counts cannot substitute for monetizable market
      size, revenue, retention, or margin evidence.
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM007"
      - "CM013"
      - "CM014"
callouts:
  - calloutType: "risk"
    title: "Do Not Treat Payment Volume as TAM"
    body: >-
      Ramp's reported annualized card and AP payment volume measures money
      processed through the platform. It does not establish software revenue,
      annual recurring revenue, addressable spend, or take rate.
    claimRefs:
      - "CM003"
      - "CM013"
  - calloutType: "insight"
    title: "Category Breadth Creates Both Expansion and Competition"
    body: >-
      A unified product surface can support module expansion, but it also places
      Ramp against card issuers, expense tools, AP platforms, procurement
      systems, and ERP workflows with different buyers and switching costs.
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM011"
