evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-breakdown
    missingEvidence: >-
      Audited financial breakdown distinguishing card interchange revenue, net float income, and recurring software
      subscription revenue from Ramp Plus.
    whyItMatters: >-
      Gross margin profiles and long-term operating leverage differ substantially between interchange-driven transaction
      volume and high-margin recurring software fees.
    diligencePath: >-
      Request management profit-and-loss statements, revenue composition breakdowns, and merchant discount schedule
      disclosures under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization-table-and-preference-stack
    missingEvidence: >-
      Complete capitalization table detailing preferred share classes, liquidation preferences, option pools, and
      secondary transaction share transfers across institutional investors.
    whyItMatters: >-
      Multi-round late-stage capitalizations with rapid valuation step-ups and step-downs may carry senior liquidation
      preferences or governance covenants that impair common equity returns.
    diligencePath: >-
      Obtain the certified Certificate of Incorporation, investor rights agreements, and audited capitalization schedule
      from company counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-limit
    missingEvidence: >-
      A relevant independent market model with an explicit financial-operations category definition, base year,
      geography, revenue pool, and methodology.
    whyItMatters: >-
      Without a valid denominator, Ramp's customer and payment-volume figures cannot be converted into TAM, SAM, SOM,
      penetration, or market share.
    diligencePath: >-
      Obtain current spend-management research from a named analyst or build a bottom-up buyer-count and software-spend
      model from regulator, card-network, procurement, and public-company disclosures.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment-level customer counts, contract values, conversion rates, module attachment, retention, implementation
      time, and buyer win-loss records.
    whyItMatters: >-
      These metrics determine whether the broad workflow surface produces efficient expansion and durable
      serviceable-market capture.
    diligencePath: >-
      Request management cohort data and validate it through sampled contracts, CRM exports, implementation records, and
      reference calls by customer size.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM008
  - type: missing-source
    severity: material
    topic: adoption-gaps
    missingEvidence: >-
      Independent buyer research on switching costs, budget ownership, regulatory requirements, ROI realization, and
      failed implementations.
    whyItMatters: >-
      Company claims and a competitor comparison cannot establish adoption timing or constraint severity across customer
      segments.
    diligencePath: >-
      Conduct finance-leader interviews, review procurement records, and obtain implementation and churn data from
      customers and former customers.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin and net revenue retention (NRR) disclosures breaking out interchange transaction gross
      margins versus recurring software subscription margins.
    whyItMatters: >-
      Blended gross margin determines whether Ramp should be valued as a high-margin enterprise SaaS business (75-80%+
      gross margin) or an interchange-driven payments processor (40-60% gross margin).
    diligencePath: >-
      Request audited GAAP income statement with cost of revenue schedule, card processing fees, and cohort-level net
      retention metrics during pre-IPO data room access.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-composition
    missingEvidence: >-
      Exact dollar and percentage split between interchange fee volume, Ramp Plus/Enterprise subscription fees, treasury
      spread, and travel booking commissions.
    whyItMatters: >-
      Understanding revenue quality requires knowing the recurring SaaS software foundation versus transaction
      volume-dependent payment processing.
    diligencePath: >-
      Obtain management reporting package showing product-line revenue segmentation and customer contract ACV
      distribution.
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: Cohort-level NRR, GRR, logo churn, renewal rates, contract duration, and satisfaction measures by segment.
    whyItMatters: Customer-count breadth does not establish recurring-revenue durability or expansion economics.
    diligencePath: >-
      Request board-approved cohort tables, renewal schedules, churn reasons, and customer-reference calls segmented by
      company size and first product.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete current customer-reference roster with deployment status, start date, products used, contract value,
      and renewal status.
    whyItMatters: >-
      Vendor-presented logos and selected outcomes cannot establish the breadth or current production status of the
      installed base.
    diligencePath: >-
      Sample CRM and billing records, then confirm a stratified set of references directly with customer finance
      leaders.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-count-denominator
    missingEvidence: >-
      Definitions for active, paid, approved, transacting, and consolidated legal-entity customers behind the
      70,000-business claim.
    whyItMatters: Different denominator definitions can materially change adoption and monetization interpretation.
    diligencePath: >-
      Reconcile the public count to monthly active transacting entities, paid software accounts, and consolidated parent
      organizations.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: expansion-and-concentration
    missingEvidence: Product attach, cohort expansion, top-customer share, segment revenue mix, and channel or partner-sourced revenue.
    whyItMatters: Product breadth is only a potential expansion mechanism until attach rates and concentration are quantified.
    diligencePath: >-
      Request cohort product-attach matrices, top-20 customer exposure, segment revenue, and partner-attribution
      reports.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-status
    missingEvidence: >-
      A current legal-entity and license map, regulator correspondence, litigation schedule, privacy assessments, and
      material financial-partner agreements.
    whyItMatters: >-
      Public product and sector sources do not establish Ramp's exact permissions, contractual responsibilities, or
      unresolved legal exposure.
    diligencePath: >-
      Request documents from management and counsel, then verify licenses and material proceedings directly with the
      relevant regulators and courts.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: operational-incidents
    missingEvidence: >-
      Independent uptime records, security incidents, fraud-loss rates, model error rates, postmortems, RTO/RPO results,
      and control-test outcomes.
    whyItMatters: >-
      Company-described controls do not show whether they work consistently at production scale or whether material
      incidents have occurred.
    diligencePath: >-
      Review status history, incident logs, SOC reports, penetration tests, loss data, customer escalations, and board
      risk reporting.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Partner-by-partner payment volume, economics, renewal dates, termination rights, service levels, and tested
      migration alternatives.
    whyItMatters: >-
      A named Visa relationship does not establish the resilience or substitutability of the full issuing and banking
      ecosystem.
    diligencePath: >-
      Obtain all material partner contracts and concentration schedules, interview counterparties, and review
      contingency migration tests.
    relatedQuestionRefs:
      - QR004
      - QR009
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited revenue composition, recurring-revenue definitions, gross margin, credit and fraud losses, liquidity,
      burn, and the fully diluted preference stack.
    whyItMatters: >-
      Annualized revenue, positive free cash flow, funding raised, and valuation do not reveal revenue durability, cash
      available, or downside preference economics.
    diligencePath: >-
      Reconcile audited financials to management metrics and bank statements, then model dilution, preference, and
      multiple-compression scenarios.
    relatedQuestionRefs:
      - QR005
      - QR009
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capitalization-preferences
    missingEvidence: >-
      Detailed capitalization table and liquidation preference structure for Series E and Series F funding rounds,
      specifically senior liquidation preferences or guaranteed return hurdles.
    whyItMatters: >-
      A $44B to $60B valuation supported by $750M+ in fresh primary capital may carry 1x or higher liquidation
      preferences that dilute common stock and earlier preferred shareholders in downside scenarios.
    diligencePath: >-
      Request confidential cap table disclosures, certificate of incorporation amendments, and investor rights
      agreements during primary confirmatory diligence.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: gross-margin-composition
    missingEvidence: >-
      Audited gross margin breakdown between interchange volume net of rewards and software subscription fees (Ramp
      Plus, Ramp Stack, AI Agents).
    whyItMatters: >-
      Payment volume interchange typically commands 40–60% gross margins versus 80%+ for pure enterprise SaaS. Blended
      gross margin directly governs whether a 29–40x revenue multiple is supportable.
    diligencePath: >-
      Obtain management-prepared segment financial statements showing net interchange revenue, SaaS revenue, cost of
      revenue, and processing fees.
    relatedQuestionRefs: []
