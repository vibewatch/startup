callouts:
  - calloutType: "insight"
    title: "The Capital One Acquisition of Brex Polarizes the Category"
    body: "Capital One's $5.15 billion acquisition of Brex in April 2026 marks the end of pure-play venture-backed card rivalry. While Brex retains strong global card capabilities, absorption into a regulated financial institution raises enterprise underwriting conservatism and potential roadmap drift, cementing Ramp's market role as the sole scaled, independent financial operations platform."
    claimRefs:
      - "CP002"
      - "CP003"
  - calloutType: "risk"
    title: "The BYOC Exclusion Limits Enterprise Expansion"
    body: "Ramp's refusal to support Bring Your Own Card (BYOC) is central to its interchange revenue model, but it presents an enduring adoption ceiling. Organizations with deeply entrenched commercial banking relationships or travel programs tied to Amex/Chase corporate cards cannot adopt Ramp's software without a complete card transition, favoring competitors like Expensify and Navan."
    claimRefs:
      - "CP005"
      - "CP014"
