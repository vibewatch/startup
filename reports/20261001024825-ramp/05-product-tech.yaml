figures:
  - id: FE001
    title: "Ramp Integrated Product and Technology Architecture Stack"
    type: stack
    summary: "High-level architectural layers connecting user-facing workflow surfaces, agent orchestration, ledger infrastructure, and partner financial rails."
    data:
      layers:
        - label: "Client Ingestion & Interaction Layer"
          detail: "Hosted web dashboard, iOS/Android native mobile applications, Slack bots, and SMS receipt parsing services."
          modules:
            - "Ramp Web Dashboard (React / TypeScript application)"
            - "Mobile Apps (iOS and Android receipt capture and virtual card controls)"
            - "Ingestion Gateways (Slack integration bots, SMS parsing, Chrome extension)"
        - label: "Intelligence & Autonomous Agent Layer"
          detail: "AI-driven extraction, automated policy enforcement, fraud detection, and background coding agent execution."
          modules:
            - "Inspect Background Coding Agent (Modal Sandboxes, OpenCode, VS Code server)"
            - "Ramp Intelligence Engine (99% OCR accuracy invoice extraction, policy agent)"
            - "Distributed Orchestration (Modal Cron 30-min snapshots, Dicts locks, Queues routing)"
        - label: "Core Application & Orchestration Layer"
          detail: "Distributed event orchestration, state machines, transactional data storage, and observability pipelines."
          modules:
            - "Workflow State Engine (Temporal workflows, RabbitMQ message brokers, Python microservices)"
            - "Enterprise Data Layer (PostgreSQL transactional database, Redis distributed caching)"
            - "Observability Stack (Datadog telemetry, Sentry error monitoring, LaunchDarkly feature flags)"
        - label: "Financial Rails & Partner Clearing Layer"
          detail: "Regulated card issuing rails, domestic and international banking bridges, and bidirectional ERP adapters."
          modules:
            - "Card Issuance Rails (Visa network charge card infrastructure via Sutton Bank BIN sponsorship)"
            - "Payment Rail Gateways (Domestic ACH, Same-Day ACH, Fedwire, SEPA, BACS, SWIFT)"
            - "ERP Sync Connectors (NetSuite, QuickBooks Online, Xero, Sage Intacct, Workday)"
        - label: "Corporate Security & Compliance Layer"
          detail: "Enterprise identity, audit logging, role-based access control, and transaction fraud screening."
          modules:
            - "Enterprise SSO (SAML 2.0 / Okta integration, multi-factor authentication)"
            - "Policy & Audit Controls (Dynamic spend rules, immutable approval logs, SOC 2 compliance)"
            - "Data Encryption (Field-level encryption for banking credentials and transaction metadata)"
        - label: "Global Banking & Liquidity Management Layer"
          detail: "FDIC-insured operating accounts, multi-currency holding ledgers, and cash management yield infrastructure."
          modules:
            - "Deposit Accounts (FDIC pass-through insured banking accounts with zero maintenance fees)"
            - "Cash Management Yield (Next-day liquidity via Invesco Premier US Government Money Portfolio)"
            - "Multi-Currency Ledger (Foreign exchange settlement and multi-entity consolidation)"
    approximationNotes: "Architecture layers synthesized from Ramp engineering disclosures, job specifications, and published partner case studies."
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE009
