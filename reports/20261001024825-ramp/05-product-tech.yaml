chapter:
  number: 5
  title: "Product & Technology"
  summary: "Ramp delivers an integrated spend management, corporate card, AP automation, procurement, travel, and banking platform operating across 70,000+ businesses with over $100B in annualized card and AP volume. Its technical architecture integrates Modal-hosted container sandboxes and background agents that generate over half of internal engineering pull requests, alongside multi-currency international rails."
sections:
  - id: product-definition-overview
    title: "Platform Definition and Core Product Capabilities"
    body: "Ramp operates an enterprise spend management and financial operations platform designed to control corporate spending, automate accounts payable, and streamline accounting close. The platform consolidates corporate charge cards on the Visa network, expense management, invoice processing, travel booking, vendor procurement, and FDIC-insured business banking into a single unified workflow. By embedding spend controls directly at the point of transaction, Ramp allows finance teams to enforce dynamic vendor-specific limits, auto-match receipts via SMS, Slack, or mobile upload, and execute automated two-way and three-way matching against purchase orders. Operating across more than 70,000 businesses, Ramp processes over $100 billion in annualized payment volume across card and accounts payable workflows, delivering reported 75% faster book closing and 5% average cost reductions."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: modular-architecture-and-operating-model
    title: "Software Architecture, Infrastructure Primitives, and Agent Automation"
    body: "Ramp's software architecture combines modern cloud microservices with advanced distributed sandbox execution for rapid development and production deployment. For internal developer tooling and engineering execution, Ramp operates 'Inspect', an internal background coding agent running inside Modal Sandboxes. Each sandbox spins up a full-stack environment containing PostgreSQL, Redis, Temporal, RabbitMQ, an OpenCode agent, a VS Code server, and a Chromium VNC stack for visual regression verification. A distributed cron job clones repositories and creates fresh filesystem snapshots every 30 minutes, allowing new agent sessions to initialize in seconds. Within months of deployment, Inspect expanded from powering 30% to over 50% of merged pull requests across Ramp's frontend and backend repositories, with over 80% of Inspect itself authored by the agent. For core financial processing, Ramp maintains bidirectional synchronization pipelines into primary ERP platforms including NetSuite, QuickBooks Online, Xero, Sage Intacct, and Workday."
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE002
  - id: international-rails-and-trust-security
    title: "International Payment Rails, Security Controls, and Platform Dependencies"
    body: "To support global customer expansion beyond domestic US spend, Ramp's Money Platform International team develops multi-currency ledgers and cross-border payment rails interfacing with SEPA, BACS, and SWIFT networks. The platform supports local card issuance across 33 countries and employee expense reimbursements in more than 40 currencies across 200+ global jurisdictions. Enterprise security and trust controls incorporate single sign-on (SSO), continuous fraud monitoring, automated policy evaluation agents, and field-level encryption for financial records. However, Ramp remains dependent on external banking and BIN sponsorship partners such as Sutton Bank, external cloud infrastructure on Modal and AWS, and third-party global banking clearinghouses, creating operational and regulatory counterparty risks that require ongoing diligence."
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE003
