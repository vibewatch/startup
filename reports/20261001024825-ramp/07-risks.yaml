callouts:
  - calloutType: risk
    title: "Do not infer safety from a thin adverse record"
    body: "The assigned pool did not provide a company-specific regulator filing, court record, independent incident history, or quantified partner concentration. That absence is an evidence gap, not proof that Ramp has had no enforcement, litigation, outage, fraud, or concentration event."
    claimRefs:
      - CR013
      - CR014
  - calloutType: recommendation
    title: "Gate conviction on private control and contract evidence"
    body: "Require audited revenue quality, partner termination and economics schedules, legal-entity and license maps, incident postmortems, fraud-loss rates, and independent control testing before treating scale or positive free cash flow as sufficient downside protection."
    claimRefs:
      - CR003
      - CR004
      - CR009
      - CR011
      - CR016
