company:
  name: "Ramp"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Ramp is an AI-powered spend management platform combining corporate cards, expense automation, accounts payable, and procurement for over 70,000 businesses. Founded in 2019 in New York City, the company reached a $44 billion valuation following its $750 million Series F financing in June 2026, processing over $200 billion in annualized purchase volume with positive operating free cash flow."
sections:
  - id: "identity-and-mission"
    title: "Corporate Identity and Platform Architecture"
    body: "Ramp Business Corporation operates as a specialized financial operations and spend automation platform founded in New York City [CO001]. The company combines corporate card issuance with software-driven expense management, accounts payable automation, procurement workflows, business travel booking, and treasury management in a unified interface [CO004]. Unlike traditional corporate card issuers that emphasize employee rewards and consumer perks, Ramp positions its platform as a financial control engine designed to eliminate wasteful corporate expenditures, detect duplicate SaaS subscriptions, and automate bookkeeping workflows [CO004]. Headquartered in Manhattan, Ramp conducts its nationwide operations through its primary Delaware corporate entity, maintaining active regulatory and payment licenses to support multi-entity commercial accounts [CO002]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "founding-and-governance"
    title: "Founders, Executive Leadership, and Governance"
    body: "Ramp was established in March 2019 by co-founders Eric Glyman, Karim Atiyeh, and Gene Lee, who continue to lead the organization in executive and operational capacities [CO001]. Prior to founding Ramp, all three executives built and scaled Paribus, an automated consumer price-tracking and rebate service that was acquired by Capital One in 2016 [CO003]. This shared operational background within a major commercial banking institution directly informed Ramp's technical approach to financial data pipelines and corporate card underwriting [CO003]. Under Chief Executive Officer Eric Glyman and Chief Technology Officer Karim Atiyeh, Ramp operates an independent sponsor-bank issuing model, partnering with Celtic Bank, Sutton Bank, Column N.A., and Lead Bank to originate Visa-branded corporate credit cards subject to underwriting approval [CO005]."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investors"
    title: "Financing History and Institutional Investor Base"
    body: "Ramp's capital structure reflects rapid institutional scaling alongside sensitivity to broader fintech market cycles [CO006]. The company reached unicorn status in August 2021 with a $300 million Series C led by Thrive Capital at a $3.9 billion valuation [CO006], followed by a $750 million Series D equity and debt round at an $8.1 billion valuation in March 2022 [CO007]. During the subsequent fintech market correction, Ramp navigated a valuation reset to $5.8 billion in its August 2023 Series D-2 financing led by Khosla Ventures [CO008]. Growth subsequently re-accelerated, with Ramp reaching a $32 billion valuation in November 2025 [CO009] and securing a $750 million Series F financing round in June 2026 led by ICONIQ Capital, GIC, and Ontario Teachers' Pension Plan at a $44 billion valuation [CO011]. With over $3 billion in total equity raised, Ramp has assembled an institutional cap table spanning premier sovereign wealth, pension, and venture capital investors [CO011]."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO011"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-milestones"
    title: "Operating Scale, Market Milestones, and Strategic Headwinds"
    body: "By mid-2026, Ramp reached significant commercial scale, reporting over 70,000 active business customers and exceeding $200 billion in annualized purchase volume across cards and accounts payable [CO012]. The company reported surpassing $1 billion in annualized revenue while achieving positive operating free cash flow, representing a major transition toward self-sustaining profitability [CO014]. In early 2026, Ramp expanded internationally by acquiring UK and European payments platform Billhop and guest travel service Juno, opening corporate hubs in London and Stockholm [CO010]. However, Ramp faces rising competitive pressure following Capital One's $5.15 billion agreement to acquire primary rival Brex [CO013]. While Brex gains direct access to a top-tier bank balance sheet and low-cost funding, Ramp must defend its market share through independent sponsor-bank arrangements while managing opacity surrounding the exact revenue split between card interchange and software subscriptions [CO013, CO015]."
    claimRefs:
      - "CO010"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
