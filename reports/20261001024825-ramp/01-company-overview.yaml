callouts:
  - calloutType: "insight"
    title: "Platform Shift from Rewards to Expense Optimization"
    body: "Ramp's core differentiation relies on reversing traditional corporate card incentives: rather than driving transactional spend through consumer points and rewards, the platform deploys software automation to flag waste and cut client operating expenses [CO004]."
    claimRefs:
      - "CO004"
  - calloutType: "risk"
    title: "Sponsor-Bank Dependence in an Aggregating Banking Landscape"
    body: "Ramp's dependence on partner banks like Celtic Bank and Sutton Bank introduces potential structural asymmetry against rival Brex, which benefits from Capital One's direct balance sheet and lower capital costs [CO005, CO013]."
    claimRefs:
      - "CO005"
      - "CO013"
