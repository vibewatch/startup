company:
  name: Science Corporation
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Science's first commercial market is narrower than generic "bionic eye" rhetoric
    implies: PRIMA is currently positioned for severely sight-impaired adults with
    geographic atrophy caused by dry age-related macular degeneration, with Europe
    now open through CE mark but reimbursement and implantation throughput still
    country-specific. The retained evidence supports a large disease burden and a
    differentiated restorative outcome, but it does not disclose the reimbursed
    SAM/SOM or launch pricing needed to turn prevalence into a near-term revenue
    model.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitute
    body: >-
      The retained sources define PRIMA's market around a specific late-stage
      blindness workflow rather than the entire ophthalmology market. PRIMA is
      described as a subretinal photovoltaic implant plus specialized glasses for
      adults with geographic atrophy caused by dry age-related macular degeneration,
      where lost central vision limits reading, facial recognition, and other
      detail-dependent tasks. That boundary matters because the same sources also
      frame the status quo differently for earlier and later disease stages:
      approved drugs can slow lesion growth, but the cited retained evidence says
      they do not restore vision that has already been lost. Science's first
      commercial product therefore fits best as a late-stage rescue or restoration
      modality, not as a general AMD therapy or a replacement for earlier disease
      management.
    claimRefs: [CM001, CM002, CM003, CM004, CM011, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing and adjacency
    body: >-
      Public evidence supports only an evidence-constrained sizing model. The broad
      top-down anchor is disease burden: multiple retained sources cite more than
      five million people globally with AMD-associated geographic atrophy. The next
      layers narrow quickly because public disclosures do not quantify how many of
      those patients have the severe central-vision loss, clinical eligibility, and
      reimbursed access needed for PRIMA today. Instead, the strongest bottom-up
      evidence is operational: a 38-patient, 17-site, five-country evidence base
      underlies the CE mark, commercial availability spans 30 European countries,
      and Germany is the first expected paying market. Science is also extending
      PRIMA into Stargardt disease and retinitis pigmentosa, which widens strategic
      adjacency, but those sources still stop short of a source-backed SAM/SOM for
      the near-term launch.
    claimRefs: [CM002, CM003, CM005, CM007, CM009, CM010, CM012, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-users-and-payers
    title: Buyer, user, and payer path
    body: >-
      The user is clearer than the buyer. Sources consistently identify the patient
      as a severely sight-impaired adult with geographic atrophy from dry AMD, while
      the workflow runs through specialist ophthalmology centers that can implant,
      activate, and follow the device. The payer path is still emerging rather than
      proven: company and independent coverage say reimbursement applications and
      site activations are underway across Europe, with Germany expected to host the
      first commercial implant. That means the commercial sale depends less on
      theoretical prevalence than on whether retina centers, local reimbursement
      authorities, and surgeons convert the CE mark into funded procedures. Public
      materials retained for this chapter do not disclose ASP, reimbursement code,
      or budget-owner detail, so those economics remain a diligence gap rather than
      an authored assumption.
    claimRefs: [CM003, CM005, CM006, CM007, CM013, CM014]
    tableRefs: [TM003]
  - id: adoption-drivers-and-constraints
    title: Adoption drivers and constraints
    body: >-
      Science has several real adoption drivers: a differentiated restorative claim,
      peer-reviewed and widely re-reported trial outcomes, CE-marked access across a
      broad European footprint, and substantial capitalization earmarked for
      commercialization, manufacturing, and operations. The same evidence also
      surfaces the key constraints. Europe is open legally but not yet proven
      economically because reimbursement remains country-specific and the first
      commercial implant is only just beginning in Germany. The U.S. path remains
      investigational despite Breakthrough Device and Humanitarian Use Device
      designations. And the broader disease burden should not be mistaken for
      immediate market capture: current public evidence supports a clinically narrow
      late-stage segment, with pricing, conversion, and center-capacity assumptions
      still undisclosed.
    claimRefs: [CM006, CM007, CM008, CM010, CM013, CM014, CM015]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Late-stage GA from dry AMD (current PRIMA launch)
        - >-
          Device, implantation workflow, site activation, follow-up, and reimbursement
          pathway for restoring central vision.
        - >-
          Earlier-stage GA management, anti-AMD care outside severe central-vision loss,
          and broader ophthalmology spending.
        - >-
          Specialist retina centers and country-specific reimbursement pathways; exact
          budget owner is not publicly disclosed.
        - Core launch market supported by CE mark and retained launch reporting.
      - - U.S. pre-commercial pathway
        - Regulatory, trial, and launch-preparation activity while approval remains pending.
        - Recognized commercial revenue or reimbursed routine care in the U.S.
        - FDA pathway first; payer pathway follows only after authorization.
        - Large strategic market, but not part of today's commercial footprint.
      - - Stargardt disease adjacency
        - Future clinical expansion into inherited retinal disease.
        - Current marketed indication and current launch revenue.
        - Rare-disease ophthalmology channels; reimbursement route not yet disclosed.
        - Strategic expansion option cited by Science, not current go-to-market.
      - - Retinitis pigmentosa adjacency
        - Future clinical expansion into inherited retinal disease.
        - Current marketed indication and current launch revenue.
        - Rare-disease ophthalmology channels; reimbursement route not yet disclosed.
        - Extends long-term platform scope beyond dry AMD.
    notes: >-
      Boundary reflects retained public evidence only; sources define indication,
      workflow, and exclusions but do not disclose pricing or precise payer economics.
    claimRefs: [CM001, CM003, CM005, CM012, CM013, CM015]
