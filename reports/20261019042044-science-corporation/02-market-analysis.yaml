          note: Current-generation PRIMA is described for advanced/severe central-vision loss.
          claimRefs: [CM003]
        - label: Evidence base
          displayValue: "38"
          unit: patients
          valueNote: 17 sites / 5 countries
          claimRefs: [CM009]
        - label: Functional reading signal
          displayValue: "84%"
          note: Reported ability to read letters, numbers, and words at 12 months.
          claimRefs: [CM010]
        - label: Legal launch footprint
          displayValue: "30"
          unit: European countries
          note: CE mark defines availability, not reimbursed demand.
          claimRefs: [CM005, CM006]
        - label: Near-term paying market
          displayValue: "1"
          unit: first market (Germany)
          note: Initial commercial implants and reimbursement conversion begin there.
          claimRefs: [CM007, CM014]
    approximationNotes: >-
      The layers mix prevalence, trial, geography, and launch-stage metrics because
      retained public sources do not disclose a single reimbursed SAM/SOM series.
    claimRefs: [CM003, CM006, CM007, CM009, CM010, CM014]
callouts:
  - calloutType: insight
    title: PRIMA enters where status quo stops restoring vision
    body: >-
      The strongest market driver is not generic BCI enthusiasm; it is the specific
      late-stage gap where approved GA therapies can slow disease progression but do
      not restore central vision that has already been lost.
    claimRefs: [CM001, CM011, CM015]
  - calloutType: risk
    title: CE mark does not equal proven reimbursement
    body: >-
      Europe's 30-country legal footprint is meaningful, but near-term adoption still
      hinges on Germany-first reimbursement conversion, site activation, and surgeon
      throughput that are not publicly quantified in the retained evidence.
    claimRefs: [CM005, CM006, CM007, CM014]
