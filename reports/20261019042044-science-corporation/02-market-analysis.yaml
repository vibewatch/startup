        - Global
        - ">5 million people with AMD-associated GA"
        - null
        - Epidemiology statement repeated across launch and clinical materials.
        - medium
        - Broad disease burden, not a PRIMA-eligible or reimbursed patient count.
      - - Science Corporation / Inside BCI
        - 2025-2026
        - Europe trial footprint
        - 38 patients / 17 sites / 5 countries
        - null
        - Pivotal PRIMAvera cohort underpinning the CE-mark evidence package.
        - medium
        - Clinical trial population is proof of efficacy, not demand or paid adoption.
      - - Business Wire / MobiHealthNews / Inside BCI
        - 2026
        - Europe
        - 30 European countries
        - null
        - CE mark under EU MDR defines legal launch footprint.
        - medium
        - Availability footprint does not prove reimbursement, center readiness, or volume.
      - - Science Corporation / NeuroFounders / MassDevice
        - 2024-2026
        - Adjacent retinal-disease populations
        - "Stargardt: 1 in 10,000; RP: 1 in 4,000"
        - null
        - Company-announced expansion into inherited retinal disease adjacencies.
        - low
        - Population-rate descriptors are not a disclosed SAM/SOM for PRIMA's near-term launch.
    notes: >-
      Public sources support burden, evidence-base, footprint, and adjacency lenses,
      but not a source-backed reimbursed SAM/SOM or adoption-rate curve.
    claimRefs: [CM002, CM005, CM009, CM010, CM012]
