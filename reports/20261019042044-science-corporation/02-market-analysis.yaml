        - Reimbursement pathway under local German coverage decisions
        - Referral -> evaluation -> implant -> activation -> reading-function follow-up
        - Not publicly disclosed
        - First reimbursed commercial implants in Germany
      - - Broader European CE-marked footprint
        - Specialist ophthalmology centers activated by Science
        - Adults with advanced/severe central-vision loss from GA
        - Country-specific reimbursement applications
        - Country launch sequencing after CE mark and site activation
        - Not publicly disclosed
        - Local payer acceptance and center activation
      - - U.S. future launch
        - Science and clinical sites preparing regulatory pathway
        - Comparable late-stage GA patients if FDA pathway clears
        - No public payer path yet; device remains investigational
        - Breakthrough/HUD designations -> U.S. authorization -> reimbursement work
        - Not publicly disclosed
        - FDA marketing authorization or exemption
      - - Adjacent inherited retinal diseases
        - Research-stage clinical investigators and future centers
        - Stargardt and RP patients in future trials
        - Not yet disclosed
        - Clinical expansion before commercial rollout
        - Not publicly disclosed
        - Evidence from expansion trials, not current sales
    notes: >-
      Buyer and user path is visible in public launch reporting, but payer identity,
      ASP, and budget ownership remain undisclosed.
    claimRefs: [CM003, CM006, CM007, CM012, CM013, CM014]
