company:
  name: Science Corporation
chapter:
  number: 1
  title: Company Overview
  summary: 'Science Corporation has crossed from clinical-stage narrative to early commercial execution in Europe: PRIMA launched with a July 2026 CE mark, while March 2026 financing lifted disclosed funding to roughly $490 million. The public record still leaves the key valuation inputs unresolved, because reimbursement, pricing, customer counts, revenue, board control, and even official headcount remain materially undisclosed.'
sections:
- id: identity-and-current-stage
  title: Identity and current stage
  body: 'Science presents itself as a neural-engineering platform rather than a single-product startup, but the current operating story is much more specific: PRIMA is the asset that has moved the company from research posture into an early commercial phase. The company says it was founded in 2021, and the assigned independent reporting places the headquarters in Alameda, California, with Paris continuity around the PRIMA program. That combination matters because the business is now bifurcated by geography: Europe has a CE-marked product, while the United States still sits in a pre-commercial regulatory path. In practical diligence terms, Science is best framed as an early-commercial retinal-BCI company in Europe and a still-regulatory-stage device company in the U.S., not yet a scaled medtech revenue story.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO010
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: leadership-capital-and-governance
  title: Leadership, capital, and governance visibility
  body: 'Leadership visibility is high at the founder level and much thinner beneath it. Max Hodak remains the primary public face across acquisition, financing, and launch milestones, which is useful for narrative coherence but also signals key-person concentration. The 2026 financing materials show some bench expansion, especially around Darius Shahida’s strategy role, while independent coverage adds Alan Mardinly and Murat Günel to the visible operating roster. Capital access is a real strategic advantage: a $230 million Series C and roughly $490 million cumulative funding give Science more time and infrastructure than most neurotech peers. What the public record still does not give is governance depth—board composition, investor rights, and preference terms remain outside the accessible evidence set.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO016
  tableRefs:
  - TO002
  - TO003
- id: clinical-and-regulatory-proof
  title: Clinical and regulatory proof points
  body: 'The strongest foundation under the current story is that Science is not selling an unvalidated concept. The PRIMA launch materials consistently anchor on a clinical package that spans 38 patients, 17 sites, and five countries, alongside outcome claims around letter-score improvement and restored reading ability. That is materially stronger than a typical pre-pivotal BCI narrative. Just as important, the company’s ophthalmic position is not fully homegrown: acquiring PRIMA from Pixium in 2024 supplied the asset that now carries both the clinical evidence and the CE-mark launch. For later chapters, this means PRIMA should be treated as the company’s core proof-of-execution asset, while the rest of the platform remains earlier and less commercially evidenced.'
  claimRefs:
  - CO010
  - CO011
  - CO012
- id: commercial-conversion-and-open-metrics
  title: Commercial conversion and open metrics
  body: 'The adverse read is not that Science lacks technical proof; it is that the market still lacks the operating metrics needed to convert a technical breakthrough into an investable business case. Independent reporting explicitly flags the next bottleneck: reimbursement by country, beginning with Germany, rather than the CE mark alone. U.S. commercialization is even less mature because regulatory process remains incomplete despite special designations. At the same time, the most important judgment metrics—valuation support, headcount quality, customer count, revenue, pricing, and board control—remain partially disclosed at best. That combination supports a view of Science as heavily financed and strategically differentiated, but still early in proving commercial repeatability.'
  claimRefs:
  - CO004
  - CO013
  - CO014
  - CO015
  - CO016
