evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Current post-money valuation support, share price, ownership by investor, liquidation preferences, and any
      secondary transaction terms.
    whyItMatters: >-
      The public valuation marker is third-party-reported and cannot be underwritten without cap-table structure and
      investor-rights detail.
    diligencePath: >-
      Request the latest financing deck, cap table, financing documents, and any secondary-sale summary from management
      or lead investors.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Revenue, implant volumes, pricing, reimbursement status by country, customer pipeline, and any early commercial
      ASP or margin data.
    whyItMatters: >-
      The company has crossed a regulatory milestone, but the investment case depends on whether launch converts into
      paid adoption and economics.
    diligencePath: >-
      Ask for German reimbursement status, first-implant timing, launch KPIs, pricing assumptions, and the first
      12-month commercial plan.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, observer rights, protective provisions, and investor control thresholds tied to the
      latest financing.
    whyItMatters: >-
      Founder concentration and a large late private round make control terms central to underwriting downside,
      follow-on dynamics, and exit flexibility.
    diligencePath: >-
      Request board list, charter documents, financing term summaries, and any side-letter rights granted to major
      investors.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: >-
      Official employee count, geographic split, and functional mix across R&D, manufacturing, clinical, and
      go-to-market teams.
    whyItMatters: >-
      A third-party estimate gives directional scale, but execution capacity and burn implications depend on the actual
      staffing base.
    diligencePath: Request an org chart or employee count by function and geography, plus hiring plans tied to the CE-mark launch.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: eu-reimbursement-pricing
    missingEvidence: >-
      Public launch materials do not disclose ASP, reimbursement code, covered procedure economics, or who pays in
      Germany and other first-wave countries.
    whyItMatters: >-
      Without payer mechanics, the report cannot convert legal availability into a credible near-term revenue model or
      adoption curve.
    diligencePath: >-
      Obtain Germany launch-center reimbursement submissions, payer correspondence, and at least one quoted ASP /
      procedure economics discussion from management or launch hospitals.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: reimbursed-sam-som
    missingEvidence: >-
      No retained public source quantifies the severe GA patient pool that is clinically eligible, reimbursable, and
      reachable inside the CE-marked European footprint.
    whyItMatters: >-
      The chapter can support only an evidence-constrained sizing lens, not a source-backed SAM/SOM needed for
      underwriting commercialization volume.
    diligencePath: >-
      Build a market model from clinician interviews, GA severity splits, referral patterns, and country-by-country
      reimbursement readiness rather than extrapolating from disease prevalence alone.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: launch-conversion-throughput
    missingEvidence: >-
      Public sources do not disclose surgeon capacity, site activation counts, patient waitlists, or conversion from
      patient interest to completed commercial implants.
    whyItMatters: >-
      These operating metrics determine whether PRIMA's first-market launch can scale beyond symbolic early cases and
      influence valuation timing.
    diligencePath: >-
      Request launch dashboard metrics from Science or first-wave European centers covering trained surgeons, activated
      sites, scheduled implants, and average time from referral to procedure.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: enumeration-incomplete
    severity: material
    topic: competitor-coverage
    missingEvidence: >-
      A current census of retinal prostheses, cortical vision implants, named drug and gene-therapy substitutes,
      internal-build options, and assistive-technology alternatives.
    whyItMatters: >-
      Without a broader census, the chapter cannot establish relative scale, crowding, likely entrants, or which
      alternatives buyers actually shortlist.
    diligencePath: >-
      Obtain a specialist ophthalmology market map and verify each active program against trial registries, regulator
      records, and company technical materials.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Device and procedure list prices, realized reimbursement, contract structure, discounts, support obligations, and
      total cost of ownership by launch country.
    whyItMatters: >-
      Commercial availability does not reveal buyer affordability, provider margin, access velocity, or price-based
      competitive defensibility.
    diligencePath: >-
      Request redacted German launch contracts, reimbursement submissions and decisions, site economics, and patient
      out-of-pocket schedules.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Surgeon training time, implantation throughput, revision or removal rates, rehabilitation burden, hardware
      replacement cycles, and patient retention.
    whyItMatters: >-
      These variables determine capacity, lock-in, adoption friction, and whether alternatives can displace PRIMA after
      implantation.
    diligencePath: >-
      Interview activated European sites and request procedure logs, training protocols, follow-up schedules,
      device-service data, and discontinuation records.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: comparative-evidence
    missingEvidence: >-
      Independent head-to-head or matched-cohort evidence comparing PRIMA with disease-modifying therapies, gene
      therapy, assistive devices, and cortical implants.
    whyItMatters: >-
      Single-arm clinical outcomes cannot establish relative efficacy, invasiveness, safety, durability, or lifetime
      value.
    diligencePath: >-
      Commission an ophthalmology KOL review and compare regulator dossiers, trial endpoints, adverse events,
      durability, and patient-reported outcomes on a common basis.
    relatedQuestionRefs:
      - QP002
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Latest cash balance, quarterly burn, runway, and any debt or credit-facility terms.
    whyItMatters: >-
      The new financing changes capital adequacy, but without cash and burn data an investor cannot tell how much launch
      runway actually remains.
    diligencePath: >-
      Request the latest board deck or monthly finance pack showing unrestricted cash, burn bridge, runway, and debt
      covenants.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: private-evidence-only
    severity: material
    topic: pricing-and-reimbursement
    missingEvidence: Per-country reimbursement codes, approved payment rates, implant ASP, and realized net price after discounts.
    whyItMatters: >-
      CE marking creates commercial possibility, but reimbursement economics determine whether procedures can scale into
      meaningful revenue.
    diligencePath: >-
      Request launch-country pricing sheets, payer submissions, and the first reimbursement decisions or signed hospital
      pricing terms.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Device COGS, gross margin, service cost per implant, referral funnel, CAC, sales-cycle length, and payback period.
    whyItMatters: >-
      Without unit economics, the chapter can describe launch mechanics but not the margin path or capital efficiency of
      scaling PRIMA.
    diligencePath: >-
      Request a launch unit-economics model with COGS, support burden, commercial headcount assumptions, and actual
      funnel data from early centers.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-commercial-traction
    missingEvidence: Post-launch implant counts, recognized revenue, collection timing, and initial payer mix from Europe.
    whyItMatters: >-
      The current record shows readiness and clinical credibility, but not whether launch has started to produce durable
      commercial proof.
    diligencePath: >-
      Request monthly European launch KPIs: implanted patients, activated sites, reimbursed procedures, outstanding
      receivables, and country mix.
    relatedQuestionRefs:
      - QI001
      - QI004
    relatedTableRefs:
      - TI001
