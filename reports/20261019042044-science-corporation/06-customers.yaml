  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-metrics-disclosure
    missingEvidence: Installed patient count, implants completed by country and center, active reimbursed sites, registry size, and conversion from registry to implant.
    whyItMatters: Without these denominators, clinical efficacy proof cannot be translated into a view on actual customer adoption velocity or launch efficiency.
    diligencePath: Request monthly launch metrics by country and center, including implants completed, active sites, registry signups, and implant conversion.
    relatedQuestionRefs:
    - QU002
    - QU007
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, churn, renewal timing, contract length, top-center share of implants, ASP, and payer-mix disclosure.
    whyItMatters: These are the metrics needed to judge whether early clinical-site activation becomes durable, diversified customer revenue rather than a concentrated launch.
    diligencePath: Ask management for cohort retention, renewal, concentration, and pricing data by geography, plus center-level volume concentration and payer mix.
    relatedQuestionRefs:
    - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A complete list of named implanting centers, reference clinicians, and any commercial hospital accounts beyond the public examples in this chapter.
    whyItMatters: The chapter can cite strong named proof surfaces, but public evidence does not show whether adoption is broad across sites or concentrated among a small number of champions.
    diligencePath: Request the current roster of implanting centers, launch hospitals, and reference clinicians, with status labels for trial, early access, and reimbursed commercial use.
    relatedQuestionRefs:
    - QU003
    relatedTableRefs:
    - TU003
