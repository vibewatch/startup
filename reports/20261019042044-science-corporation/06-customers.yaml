company:
  name: Science Corporation
chapter:
  number: 6
  title: Customers
  summary: Science has strong clinical adoption proof for PRIMA and a real European launch path, but its public customer evidence is still site- and investigator-led rather than account- and revenue-led. The strongest support is the 38-patient multicenter study, CE-marked availability across 30 European countries, and early Germany reimbursement activation; the biggest unresolved issues are implant counts, retention, concentration, and payer conversion.
sections:
- id: segment-and-go-to-market
  title: Customer surface is still narrow, clinical, and GA-first
  body: 'Science''s current customer surface is narrow and medically specific: PRIMA is aimed first at people blinded by geographic atrophy from age-related macular degeneration, with the public commercial path centered on Europe and especially Germany. Public materials also show a second buyer layer of retina clinicians and hospital sites that evaluate, implant, and seek reimbursement for the system, while retinitis pigmentosa and Stargardt disease remain expansion cohorts rather than today''s disclosed paying base. That means the present customer story is still a blend of trial users, activated clinical sites, and pre-commercial demand capture, not a disclosed installed base of recurring accounts.'
  claimRefs:
  - CU001
  - CU005
  - CU006
  - CU010
  - CU014
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-proof-and-rollout
  title: Adoption proof is compelling clinically, but commercialization metrics are still sparse
  body: The strongest adoption proof is clinical rather than revenue-based. The 12-month PRIMA dataset covered 38 patients across 17 sites in five countries, with 84% reporting the ability to read letters, numbers, and words and 80% achieving significant prosthetic acuity improvement. By October 2026, 36-month follow-up still showed no new safety signal between months 12 and 36, but only 27 patients were evaluable for safety and 18 for efficacy, so durability evidence remains encouraging yet denominator-limited. Commercially, CE mark approval across 30 European countries and active reimbursement and site activation work indicate launch readiness, but public sources still stop short of disclosing implant counts, revenue by center, or active paid-account totals.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU011
  - CU012
  tableRefs:
  - TU002
- id: durability-expansion-and-concentration
  title: Named proof exists at the clinician/site layer; retention and concentration are still opaque
  body: 'Named proof is strongest at the clinician and site layer: Frank Holz at University Hospital of Bonn, Mahi Muqit at Moorfields, and Matthew Simunovic''s planned Sydney trials all show specialist adoption surfaces that matter for a surgical retinal product. Science also launched a patient registry intended to identify candidates and track functional measures such as reading, face recognition, and mobility, which is useful evidence of funnel-building. But the assigned public evidence does not disclose churn, renewal, contract length, average selling price, or top-center concentration, so the real durability question is not whether PRIMA can help blinded patients - that proof is compelling - but how quickly activated centers turn into reimbursed, repeat implant volume.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU013
  tableRefs:
  - TU003
