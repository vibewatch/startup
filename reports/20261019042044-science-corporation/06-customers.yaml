  - CU003
  - CU004
  - CU005
- calloutType: risk
  title: Commercial durability is still opaque
  body: The key remaining customer risk is not whether PRIMA can work; it is whether early European site activation converts into reimbursed implant volume without concentration around a handful of clinicians or centers.
  claimRefs:
  - CU006
  - CU011
  - CU012
  - CU013
