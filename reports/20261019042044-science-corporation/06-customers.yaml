- calloutType: insight
  title: Clinical proof is stronger than sales disclosure
  body: Science can point to credible multicenter patient outcomes and a real CE-marked launch, but it still does not publicly disclose the installed-base metrics that would prove repeat commercial adoption.
  claimRefs:
