    - Commercial launch reference; public volume undisclosed
    - Holz said CE marking makes PRIMA commercially available to patients and restores central vision in blinded GA patients.
    - Named clinician quote, but no hospital purchasing or implant-count disclosure.
  - - Moorfields Eye Hospital / Mahi Muqit
    - Retina clinical site / long-term follow-up
    - Presented 36-month PRIMAvera data at EURETINA
    - Clinical follow-up, not disclosed commercial account
    - Muqit said patients who gained vision kept it, and even improved it, over three years.
    - Evidence is durability proof from trial follow-up, not repeat commercial utilization.
