      - number: '5.2'
        title: Clinical maturity, regulatory status, and deployment path
        blocks:
          - type: paragraph
            body: >-
              The evidence base is unusually concrete for an implantable neurotechnology company. The pivotal PRIMA
              program enrolled 38 patients across 17 sites in five countries, with 12-month data showing central-vision
              restoration for a majority of participants and 36-month follow-up indicating durability among the
              evaluable cohort. Commercial maturity has also advanced: PRIMA is CE marked in the EU, registered for UK
              supply, and being launched first through Germany and other European sites before any US commercialization.
              The main caveat is that the latest durability and launch claims still come primarily from company-issued
              updates rather than broad post-market evidence.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE013
      - number: '5.3'
        title: Differentiation and platform breadth
        blocks:
          - type: paragraph
            body: >-
              PRIMA's differentiation is not just that it stimulates the retina; it appears to be the first commercially
              cleared retinal implant specifically positioned to restore central vision in AMD- related geographic
              atrophy, a narrower and more defensible claim than generic "first BCI" marketing. Science is also trying
              to differentiate beyond a single-device company: its March 2026 financing update tied PRIMA
              commercialization to a broader pipeline that includes other retinal indications, biohybrid interfaces,
              perfusion technology, and an in-house MEMS foundry and tooling ecosystem. That platform story could matter
              if manufacturing and iteration speed become a moat, but public evidence today is still strongest for PRIMA
              itself rather than the adjacent programs.
            claimRefs:
              - CE010
