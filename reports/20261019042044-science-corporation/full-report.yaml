              - CE003
              - CE009
              - CE011
      - number: '5.4'
        title: Controls, dependencies, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Product risk now shifts from proving that PRIMA can work at all to proving that Science can scale it
              safely and economically. The 36-month update is directionally reassuring because no new safety signal
              emerged after year one, but surgery-related events were concentrated early and commercialization still
              depends on country-by-country reimbursement, site activation, and sustained manufacturing quality. Public
              materials in this source set say little about software validation, cybersecurity, data handling,
              complaint/CAPA processes, or implant-manufacturing yield, so the diligence burden has moved from clinical
              plausibility toward operating controls.
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer surface is still narrow, clinical, and GA-first
        blocks:
          - type: paragraph
            body: >-
              Science's current customer surface is narrow and medically specific: PRIMA is aimed first at people
              blinded by geographic atrophy from age-related macular degeneration, with the public commercial path
              centered on Europe and especially Germany. Public materials also show a second buyer layer of retina
              clinicians and hospital sites that evaluate, implant, and seek reimbursement for the system, while
              retinitis pigmentosa and Stargardt disease remain expansion cohorts rather than today's disclosed paying
              base. That means the present customer story is still a blend of trial users, activated clinical sites, and
              pre-commercial demand capture, not a disclosed installed base of recurring accounts.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU010
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU010
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption proof is compelling clinically, but commercialization metrics are still sparse
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption proof is clinical rather than revenue-based. The 12-month PRIMA dataset covered 38
              patients across 17 sites in five countries, with 84% reporting the ability to read letters, numbers, and
              words and 80% achieving significant prosthetic acuity improvement. By October 2026, 36-month follow-up
              still showed no new safety signal between months 12 and 36, but only 27 patients were evaluable for safety
              and 18 for efficacy, so durability evidence remains encouraging yet denominator-limited. Commercially, CE
              mark approval across 30 European countries and active reimbursement and site activation work indicate
              launch readiness, but public sources still stop short of disclosing implant counts, revenue by center, or
              active paid-account totals.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU011
              - CU012
      - number: '6.3'
        title: Named proof exists at the clinician/site layer; retention and concentration are still opaque
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest at the clinician and site layer: Frank Holz at University Hospital of Bonn, Mahi
              Muqit at Moorfields, and Matthew Simunovic's planned Sydney trials all show specialist adoption surfaces
              that matter for a surgical retinal product. Science also launched a patient registry intended to identify
              candidates and track functional measures such as reading, face recognition, and mobility, which is useful
              evidence of funnel-building. But the assigned public evidence does not disclose churn, renewal, contract
              length, average selling price, or top-center concentration, so the real durability question is not whether
              PRIMA can help blinded patients - that proof is compelling - but how quickly activated centers turn into
              reimbursed, repeat implant volume.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical proof is stronger than sales disclosure
            body: >-
              Science can point to credible multicenter patient outcomes and a real CE-marked launch, but it still does
              not publicly disclose the installed-base metrics that would prove repeat commercial adoption.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Commercial durability is still opaque
            body: >-
              The key remaining customer risk is not whether PRIMA can work; it is whether early European site
              activation converts into reimbursed implant volume without concentration around a handful of clinicians or
              centers.
            calloutType: risk
            claimRefs:
              - CU006
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory clearance has arrived faster than reimbursement or U.S. approval
        blocks:
          - type: paragraph
            body: >-
              PRIMA's CE mark is a meaningful de-risking event because it turns Science from a purely clinical-stage
              retinal-implant developer into a company with an EU-cleared commercial product, but the available evidence
              also shows that clearance is only the first gate. Science says DEKRA authorized commercial availability
              across 30 European countries, yet it simultaneously says reimbursement applications and site activations
              are still country-specific and that Germany is merely the first expected implant market. Independent
              coverage makes the same point more starkly: Europe can still fail to convert regulatory clearance into
              paid procedures if German reimbursement, hospital onboarding, or real-world implant cadence disappoints.
              On the U.S. side, Science remains in a pre-commercial state; Breakthrough Device and Humanitarian Use
              Device designations improve engagement with FDA, but they do not authorize launch and still leave the
              company exposed to timing risk on an eventual Humanitarian Device Exemption decision.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
