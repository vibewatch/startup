  - id: FP001
    title: Competitive positioning by commercialization evidence and restoration specificity
    type: quadrant
    summary: >-
      Evidence-backed ordinal placement separates the commercially available PRIMA system from earlier-stage or
      non-restorative alternatives without implying market-share rank.
    data:
      xAxis:
        label: Commercialization evidence (1=early/experimental, 5=available)
        min: 1
        max: 5
      yAxis:
        label: Restoration specificity (1=non-restorative, 5=trial-backed form vision)
        min: 1
        max: 5
      points:
        - label: Science PRIMA current system
          x: 5
          'y': 5
          detail: CE marked and registered for UK supply, with reported form-vision outcomes.
        - label: PRIMA next-generation system
          x: 1
          'y': 4
          detail: Company roadmap for improved implant, glasses, processing, and ergonomics.
        - label: Pixium-origin PRIMA platform
          x: 3
          'y': 5
          detail: Predecessor platform acquired by Science; not evidenced as a current standalone rival.
        - label: Neuralink Blindsight
          x: 1
          'y': 3
          detail: Cortical approach with FDA Breakthrough Device designation but no outcomes in the assigned pool.
        - label: Progression-slowing treatments
          x: 4
          'y': 1
          detail: Alternative class that does not restore already-lost vision in the cited comparison.
        - label: Experimental gene therapy
          x: 1
          'y': 2
          detail: Experimental alternative identified by a PRIMA investigator, without comparative results.
    approximationNotes: >-
      Coordinates are analyst ordinal scores, not measured market shares or clinical effect sizes. Scores use only stage
      and functional claims present in the assigned evidence; one-point differences are not statistically meaningful.
    claimRefs:
      - CP004
      - CP006
      - CP008
      - CP009
      - CP010
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports the launch-to-revenue chain, but not the monetary amounts at any step.
    data:
      nodes:
        - id: demand
          label: Eligible GA patient demand
          displayValue: '>5M people affected globally'
          note: Disease burden supports demand, not company revenue.
        - id: sites
          label: Clinical site activation and patient onboarding
          displayValue: Country-specific activations underway
          note: Commercialization starts through activated clinical centers.
        - id: implant
          label: PRIMA implantation procedure
          displayValue: First commercial implant expected soon in Germany
          note: Readiness is public; realized implant volume is not.
        - id: reimbursement
          label: Reimbursement approval and payment
          displayValue: Applications underway; no public rates
          note: Main bottleneck between launch and cash collection.
        - id: revenue
          label: Recognized device/procedure revenue
          displayValue: Public value unavailable
          note: No retained source discloses revenue, ARR, or net price.
        - id: gross-profit
          label: Gross profit after device and service cost
          displayValue: Public value unavailable
          note: Manufacturing, support, and service-cost disclosures are absent.
      edges:
        - from: demand
          to: sites
          label: Patient identification and referral
        - from: sites
          to: implant
          label: Activated center performs implantation
        - from: implant
          to: reimbursement
          label: Procedure must be paid for
        - from: reimbursement
          to: revenue
          label: Approved payment becomes recognized revenue
        - from: revenue
          to: gross-profit
          label: Revenue less hardware, clinical, and support cost
    approximationNotes: >-
      The sequence is source-backed, but monetary values at each node are mostly undisclosed and are intentionally left
      qualitative.
    claimRefs:
      - CI005
      - CI006
      - CI011
      - CI012
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: PRIMA combines implant hardware, external optics, processing, and commercial deployment layers.
    data:
      layers:
        - label: Clinical target
          detail: Geographic atrophy due to dry AMD with severe central vision loss
          items:
            - Late-stage GA patients
            - Central form-vision restoration use case
        - label: Implant layer
          detail: Subretinal photovoltaic implant placed under the atrophic macula
          modules:
            - 378 light-powered pixels
            - 2 mm x 2 mm x 30 um implant
            - Array of artificial photoreceptors
        - label: External optics and compute
          detail: Wearable and processing components required for day-to-day use
          modules:
            - Specialized glasses
            - Front-facing camera
            - Near-infrared projector
            - External visual-processing computer
            - Zoom / magnification workflow
        - label: Validation and rollout
          detail: Clinical proof and first-market launch path
          outputs:
            - 38-patient, 17-site, five-country trial base
            - CE-marked EU commercial launch
            - Germany-first reimbursement and site activation path
            - Next-gen resolution / field-of-view work
        - label: Commercial delivery
          detail: Country-level reimbursement, trained sites, and patient support convert approval into use
          outputs:
            - Germany-first commercial pathway
            - Country-specific reimbursement applications
            - Clinical-site activation
        - label: Lifecycle controls
          detail: Manufacturing quality, software assurance, surveillance, and service sustain the implanted system
          outputs:
            - Manufacturing yield remains undisclosed
            - Cybersecurity and data controls remain undisclosed
            - Post-market support metrics remain undisclosed
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      PRIMA's customer journey still runs from candidate identification and clinical-site activation to a narrow
      first-market reimbursement loop.
    data:
      items:
        - label: Candidate identification
          actor: Patients with advanced GA from AMD
          touchpoints:
            - Severe central-vision-loss screening
            - GA-first targeting before broader retinal cohorts
          note: Current customer targeting is narrow and indication-specific.
          tone: neutral
        - label: Registry intake
          actor: Prospective patients and Science
          touchpoints:
            - patients.science.xyz interest capture
            - Tracks reading, face recognition, and mobility
          note: Shows funnel building, but public sources do not disclose registry volume.
          tone: warning
        - label: Clinical evaluation
          actor: Retina specialists and activated sites
          touchpoints:
            - Professional-network education
            - Country-specific clinical site activations in Europe
          note: Adoption depends on specialist-center activation rather than broad self-serve demand.
          tone: neutral
        - label: Implant and reimbursement launch
          actor: European hospitals and payers
          touchpoints:
            - CE mark authorizes 30 European countries
            - Germany is the first disclosed commercial implant market
          note: Commercial access exists, but reimbursement conversion is still in progress.
          tone: warning
        - label: Functional outcome proof
          actor: Implanted patients and investigators
          touchpoints:
            - 84% could read letters, numbers, and words
            - 80% achieved significant acuity improvement at 12 months
          note: The strongest customer proof is clinical benefit, not disclosed unit economics.
          tone: positive
        - label: Durability and expansion loop
          actor: Existing users, clinicians, and next-indication centers
          touchpoints:
            - 36-month follow-up showed no new safety signal
            - RP and Stargardt trials plus next-gen implants feed expansion
          note: Durability evidence is encouraging, but commercial renewals and concentration are still undisclosed.
          tone: warning
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
      - CU011
      - CU012
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Six core risks are scored across likelihood, impact, and mitigation maturity to show where residual exposure
      remains highest.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
      rows:
        - label: EU reimbursement conversion
          values:
            - text: High
            - text: High
            - text: Medium
              note: Clinical efficacy is strong, but payer and site activation proof is still pending.
        - label: U.S. HDE / FDA timing
          values:
            - text: Medium
            - text: High
            - text: Medium
              note: Breakthrough and HUD designations help, but marketing authorization is still unresolved.
        - label: 36-month durability evidence base
          values:
            - text: Medium
            - text: High
            - text: Medium
              note: The follow-up is encouraging but only 18 patients were evaluable for efficacy.
        - label: Procedure-related event recurrence
          values:
            - text: Medium
            - text: Medium-High
            - text: Medium
              note: Reported events improved over time, but public commercial surveillance does not yet exist.
        - label: Manufacturing and site activation scale-up
          values:
            - text: Medium
            - text: Medium-High
            - text: Early
              note: Science says it is expanding operations, but public capacity metrics are absent.
        - label: PRIMA funding the broader platform
          values:
            - text: Medium-High
            - text: High
            - text: Medium
              note: Series C provides runway, yet management explicitly tied PRIMA cash generation to the rest of Science.
    approximationNotes: Likelihood/impact buckets are qualitative synthesis of the cited evidence, not company-published scores.
    claimRefs:
      - CR004
      - CR007
      - CR008
      - CR010
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Clinical proof and CE-marked launch readiness are real positives, but commercialization economics and price
      support remain the gating nodes.
    data:
      nodes:
        - id: proof
          label: Clinical proof
          detail: 38 patients, 17 sites, 5 countries; 84% reported reading letters, numbers, and words.
        - id: launch
          label: Regulatory launch proof
          detail: CE mark granted across 30 European countries; first commercial implant expected in Germany.
        - id: capital
          label: Financing capacity
          detail: Science raised $230M in Series C and has roughly $490M total disclosed capital.
        - id: gaps
          label: Commercial gaps
          detail: Public sources still lack verified revenue, profitability, reimbursement economics, and cap-table detail.
        - id: price
          label: Price anchor
          detail: Public valuation support centers on a roughly $1.5B March 2026 reference from secondary sources.
        - id: call
          label: Recommendation
          detail: Track / stretched until reimbursement and launch KPIs make the price underwriteable.
          tone: risk
      edges:
        - from: proof
          to: launch
          label: de-risks product
        - from: launch
          to: capital
          label: supports commercialization
        - from: capital
          to: gaps
          label: does not solve disclosure
        - from: gaps
          to: price
          label: limits valuation support
        - from: price
          to: call
          label: drives entry discipline
    approximationNotes: >-
      Flow summarizes qualitative underwriting dependencies rather than implied conversion rates or probability-weighted
      valuation math.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV014
      - CV015
