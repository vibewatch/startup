  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than implantable retinal devices. A buyer can select PRIMA, wait for a
              visual-cortex implant such as Neuralink's Blindsight, use treatments intended to slow disease progression,
              pursue experimental gene therapy, or remain with no restorative intervention. Within the assigned
              evidence, PRIMA is the only option documented as commercially available in Europe for restoring form
              vision in geographic atrophy; MobiHealthNews reported CE marking across 30 European countries and
              identified Blindsight as an adjacent cortical approach. Science acquired PRIMA intellectual property and
              related assets from Pixium Vision in 2024, so Pixium is better treated as the platform predecessor than as
              a current operating rival. The resulting map is a partial competitive set, not an exhaustive enumeration
              of retinal-device, pharmaceutical, or low-vision-assistance alternatives.
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP010
