              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.2'
        title: Clinical proof is strong, but the operating envelope is still narrow
        blocks:
          - type: paragraph
            body: >-
              The clinical case for PRIMA is far better than for most implantable-neurotech launches, yet the
              operational risk has not disappeared. Science's January summary of the pivotal dataset showed visually
              meaningful gains across a 38-patient, 17-site European trial, and the October 2026 update extended that
              story to 36 months without a newly reported safety signal. That is good evidence that the product can
              work, but it is not the same thing as broad post-market reliability. The 36-month dataset only had 27
              patients evaluable for safety and 18 for efficacy, and the adverse-event profile is still fundamentally a
              surgery-dependent one. Investors therefore need to treat early Europe rollout as a monitored scale-up:
              every first-wave commercial implant, reimbursement approval, and site activation matters because there is
              not yet a large installed base to absorb execution noise.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
      - number: '7.3'
        title: The balance sheet lowers immediate solvency risk but raises execution pressure
        blocks:
          - type: paragraph
            body: >-
              Science is not facing a near-term capital drought by startup standards: management says it raised
              approximately $490 million since 2021, including an oversubscribed $230 million Series C in March 2026,
              and said the proceeds are intended to commercialize PRIMA while expanding manufacturing and the broader
              pipeline. That reduces acute fundraising risk for the next launch steps, but it does not remove model
              risk. Hodak told TechCrunch that the vision business is supposed to finance the company's longer-term
              biohybrid work, which means PRIMA is not just a product milestone but the economic bridge for the rest of
              Science's thesis. If reimbursement arrives slowly, manufacturing ramps unevenly, or U.S. approval slips,
              the company could still face a mismatch between the capital already raised and the revenue proof needed to
              justify it.
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: The thesis breaks on reimbursement slippage, U.S. delay, or new post-market safety noise
        blocks:
          - type: paragraph
            body: >-
              The highest-value diligence now is not another generic technology review; it is a short list of concrete
              checkpoints. First, confirm whether Germany converts CE-mark clearance into reimbursed procedures at a
              pace that supports broader EU rollout rather than a symbolic launch. Second, obtain primary evidence on
              the U.S. regulatory path, because public reporting still describes the HDE/HUD route in directional rather
              than filed-and-timed terms. Third, test whether the favorable 36-month safety update survives real-world
              use once commercial implants begin. Finally, pressure-test the company's operating plan by asking how much
              manufacturing throughput, site capacity, and reimbursement visibility PRIMA must achieve before management
              can credibly claim that the product is financing the rest of the platform. Missing any of those
              checkpoints would move the current risk stack from manageable to thesis-breaking.
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: CE mark de-risks product validity, not market access
            body: >-
              Science has crossed the most important European regulatory threshold, but the evidence still points to
              reimbursement, hospital activation, and the U.S. HDE path as the true near-term gating items.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
          - type: callout
            title: Series C buys time only if PRIMA becomes a paying product
            body: >-
              The company has substantial capital for a private neurotech startup, yet management also framed PRIMA as
              the business that should finance the rest of the platform, making launch conversion a core assumption
              rather than a side benefit.
            calloutType: assumption
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: callout
            title: Three thesis-break triggers deserve immediate tracking
            body: >-
              Treat delayed German reimbursement, U.S. HDE slippage, or new commercial-use safety noise as reasons to
              reassess valuation and financing assumptions before expanding conviction.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Science now has evidence of both product efficacy and initial regulatory commercialization: PRIMA produced
              peer-reviewed functional-vision gains in a 38-patient, 17-site trial, and the device has since received a
              CE mark for commercial availability in Europe. That materially improves product and regulatory confidence.
              The underwriting problem is price, not whether the technology is real. Public valuation support still
              appears to be a roughly $1.5 billion March 2026 mark circulated by secondary databases and cited by Inside
              BCI as Bloomberg-reported, while public sources still do not disclose revenue, profitability, or
              reimbursement economics. At that information level, the investable call is track rather than buy, and
              entry discipline should assume commercialization proof still has to be earned in market.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
      - number: '8.2'
        title: Why the thesis is promising but not yet investable at price
        blocks:
          - type: paragraph
            body: >-
              The positive case is straightforward: Science raised another $230 million in March 2026, bringing total
              disclosed capital to about $490 million, and management has aimed that capital at PRIMA commercialization
              plus broader manufacturing and pipeline build-out. Clinical efficacy is unusually concrete for an
              implantable neurotechnology company, and CE marking gives the company a real launch path instead of a
              purely precommercial story. The anti-thesis is equally clear. The company is still pre-disclosure on the
              operating metrics that matter most to valuation support, including revenue, profitability, and cap-table
              economics. Even its strongest independent valuation references are secondary-source marks, not a
              company-disclosed benchmark tied to commercial KPIs. That makes the company attractive strategically, but
              hard to price aggressively today.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario ranges and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case requires fast conversion of regulatory proof into reimbursed use: Germany must move from
              expected first commercial implant to repeatable funded procedures, and the U.S. pathway needs to stay on a
              credible HDE or other approval timetable. In that outcome, the last reported valuation could be sustained
              or exceeded because Science would look less like a long-dated platform bet and more like the first
              neurotechnology company with credible product revenue. The base case is slower. CE mark, reimbursement
              applications, and site activations are real progress, but they do not yet prove adoption or unit
              economics, so a flat-to-slightly-down outcome versus the last round remains plausible. The bear case is
              straightforward: narrow reimbursement, delayed uptake, or U.S. slippage would expose how little public
              revenue evidence supports the current price.
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should focus on the handful of facts that can actually move the recommendation.
              First, obtain German reimbursement terms, target ASP, and early implant cadence; a CE mark without funded
              procedures is not the same as scalable commercialization. Second, request post-launch operating
              disclosure: implants completed, booked sites, training throughput, manufacturing yield, and gross margin
              expectations. Third, inspect the cap table and preference stack, including any participation rights or
              conversion mechanics that could subordinate new money even if headline valuation appears unchanged. A
              thesis break would be evidence that Europe remains effectively private-pay or highly limited-access, that
              the U.S. pathway slips materially, or that the next financing resets below the last reported mark before
              launch KPIs are visible.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
