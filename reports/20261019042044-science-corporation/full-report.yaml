    summary: >-
      Science’s progression from 2021 founding to 2026 CE-mark launch shows that PRIMA acquisition and financing
      clustered tightly ahead of commercialization.
    data:
      items:
        - period: April 2021
          label: Science founded
          detail: >-
            Max Hodak founded Science after leaving Neuralink, establishing the neural-engineering platform that would
            later absorb PRIMA.
          tone: neutral
          claimRefs:
            - CO002
            - CO008
        - period: April 2024
          label: PRIMA acquired from Pixium
          detail: >-
            Science acquired the PRIMA retinal implant assets from Pixium Vision, giving it the ophthalmic platform
            behind the current launch.
          tone: neutral
          claimRefs:
            - CO010
        - period: January 2026
          label: Peer-reviewed PRIMA evidence publicized
          detail: >-
            Science publicized NEJM-backed PRIMA results covering 38 patients across 17 sites in five countries, with
            functional-reading and acuity gains.
          tone: positive
          claimRefs:
            - CO011
            - CO012
        - date: '2026-03-05'
          label: Series C closes
          detail: >-
            An oversubscribed $230M Series C lifted disclosed lifetime funding to about $490M and funded
            commercialization plus infrastructure buildout.
          tone: positive
          claimRefs:
            - CO005
            - CO007
        - period: March 2026
          label: Trial expansion announced
          detail: >-
            Science said PRIMA studies would expand into Stargardt disease and retinitis pigmentosa while U.S.
            regulatory work continued.
          tone: neutral
          claimRefs:
            - CO007
        - date: '2026-07-22'
          label: CE mark and European launch
          detail: PRIMA received CE marking from DEKRA and launched commercially across 30 European countries.
          tone: positive
          claimRefs:
            - CO003
        - period: July 2026
          label: Germany reimbursement setup underway
          detail: >-
            Science said country-specific reimbursement applications and site activations were underway, with the first
            commercial implant expected soon in Germany.
          tone: risk
          claimRefs:
            - CO013
        - period: '2026'
          label: U.S. pathway still open
          detail: >-
            Outside coverage stressed that special FDA designations did not yet equal approval and that U.S. marketing
            still required further regulatory clearance.
          tone: risk
          claimRefs:
            - CO004
    approximationNotes: null
    claimRefs:
      - CO002
      - CO003
      - CO005
