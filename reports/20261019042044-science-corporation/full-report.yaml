    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current stage
        blocks:
          - type: paragraph
            body: >-
              Science presents itself as a neural-engineering platform rather than a single-product startup, but the
              current operating story is much more specific: PRIMA is the asset that has moved the company from research
              posture into an early commercial phase. The company says it was founded in 2021, and the assigned
              independent reporting places the headquarters in Alameda, California, with Paris continuity around the
              PRIMA program. That combination matters because the business is now bifurcated by geography: Europe has a
              CE-marked product, while the United States still sits in a pre-commercial regulatory path. In practical
              diligence terms, Science is best framed as an early-commercial retinal-BCI company in Europe and a
              still-regulatory-stage device company in the U.S., not yet a scaled medtech revenue story.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO010
