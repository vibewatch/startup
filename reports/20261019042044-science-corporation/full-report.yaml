          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
              - CI014
      - number: '4.2'
        title: Public traction exists, but unit economics do not
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction evidence is clinical, not financial. Science’s NEJM summary and launch
              materials point to a 38-patient, 17-site, five-country study in which 84% of patients reported reading
              letters, numbers, and words and 80% achieved at least 0.2 logMAR improvement at 12 months. A later
              36-month update reported a 29-letter mean improvement among efficacy-evaluable patients. Those outcomes
              matter commercially because they give Science a differentiated efficacy story for physicians, patients,
              and payers. But they do not answer the financial questions that an investor would need to price execution:
              public sources do not disclose realized revenue, implant volumes, gross margin, CAC, payback, cash burn,
              or service-delivery cost. Even the reimbursement pathway is described only at the process level. The
              result is a chapter where adoption potential is visible, but the actual conversion of that potential into
              recurring gross profit remains unobserved.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.3'
        title: Capital adequacy improved, but financing dependency remains
        blocks:
          - type: paragraph
            body: >-
              The refresh meaningfully changes Science’s financing position. In March 2026 the company closed a $230
              million Series C, bringing total capital raised to about $490 million, and Inside BCI reported an
              approximate $1.25 billion post-money valuation. Management says the round funds PRIMA commercialization
              while also expanding research, manufacturing, and operational infrastructure, which implies that this
              capital is meant to carry both launch and continued platform build-out. That lowers immediate liquidity
              pressure versus the prior report, but it does not remove financing dependency because there is still no
              public cash balance, burn, runway, or debt disclosure. Management’s own language is also forward-looking:
              the goal is to become the first BCI company to scale and achieve profitability, not to demonstrate that
              profitability has already been reached. Practically, that means the next financing inflection is still
              likely to depend on evidence that Europe can turn CE marking into reimbursed procedures while the U.S.
              path remains pending.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI012
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Science’s financial story is investable only as a milestone transition, not as a fully underwritten
              operating model. The company now has both a large 2026 funding round and a launched European product,
              which is a better setup than a pure pre-commercial clinical asset. But nearly every underwriting input
              that would turn that setup into conviction is still missing from public evidence: no disclosed revenue
              line, no price realization, no contribution margin, no installation pace, no channel or reimbursement
              economics, and no current cash-runway statement. The 36-month safety disclosure is directionally
              reassuring, yet it also confirms that clinical complications and regulatory timing still matter to revenue
              conversion. The judgment for this chapter is therefore cautious: Science may have enough capital to push
              PRIMA through early commercialization, but diligence should treat margin path, launch efficiency, and
              next-round timing as open items until the company discloses actual implant and reimbursement performance.
            claimRefs:
              - CI004
              - CI007
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial availability has arrived before public economic visibility
            body: >-
              Science has a launchable product in Europe, but there is still no public ASP, reimbursement rate, implant
              run rate, or gross-margin disclosure to prove that launch is translating into scalable economics.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
          - type: callout
            title: The Series C improves capital adequacy, not proof of self-funding
            body: >-
              The $230 million raise materially reduces near-term financing pressure, yet management still describes
              profitability as an objective and the public record still omits cash, burn, and runway figures.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI012
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered system and user workflow
        blocks:
          - type: paragraph
            body: >-
              PRIMA is best understood as a treatment workflow for severely sight-impaired adults with geographic
              atrophy from dry AMD, not as a chip alone. The company and multiple independent write-ups describe a
              subretinal photovoltaic implant paired with specialized glasses and external compute that projects
              near-infrared light onto the implant so patients can recover central form vision for tasks such as reading
              letters, numbers, and words. That matters for diligence because the customer-facing deliverable includes
              hardware, surgical implantation, image processing, optical wearables, and post-implant support, so
              technical risk spans the whole stack rather than only the implant itself.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE011
