    summary: Public evidence supports a layered market-access view rather than a clean public TAM/SAM/SOM series.
    data:
      items:
        - label: Disease burden
          displayValue: '>5M'
          unit: global GA patients
          note: Broad AMD-associated geographic atrophy prevalence anchor.
          claimRefs:
            - CM002
        - label: Current clinical phenotype
          displayValue: subset only
          note: Current-generation PRIMA is described for advanced/severe central-vision loss.
          claimRefs:
            - CM003
        - label: Evidence base
          displayValue: '38'
          unit: patients
          valueNote: 17 sites / 5 countries
          claimRefs:
            - CM009
        - label: Functional reading signal
