              - CP008
              - CP009
              - CP010
              - CP014
      - number: '3.2'
        title: Capability differentiation and proof burden
        blocks:
          - type: paragraph
            body: >-
              PRIMA combines a photovoltaic subretinal implant with camera-equipped glasses that transmit power and
              image data through near-infrared light. That architecture preserves a distinct competitive proposition: it
              stimulates remaining retinal cells rather than the visual cortex and is intended to restore lost
              functional central vision rather than merely slow progression. The evidence base is meaningful but narrow.
              The reported pivotal study involved 38 patients at 17 sites in five countries, and multiple assigned
              sources repeated that 80% achieved the stated visual-acuity threshold at 12 months. Serious adverse events
              were concentrated early and 95% reportedly resolved within two months, but MassDevice noted that the
              company did not disclose the number of serious adverse events. Consequently, trial differentiation should
              not be mistaken for a broad head-to-head benchmark.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: Commercialization, pricing, and buying friction
        blocks:
          - type: paragraph
            body: >-
              Science has moved beyond a premarket-only posture in Europe: its patient page says PRIMA is CE marked in
              the European Union and registered for supply in the United Kingdom, while independent reporting says the
              first commercial implantation was expected in Germany. The company also said that country-specific
              reimbursement applications and clinical-site activations were underway. Those steps create a distribution
              lead over alternatives represented only by an FDA designation, but they do not establish adoption
              economics. The assigned evidence contains no disclosed device price, procedure price, realized
              reimbursement, contract model, discounting, or comparative lifetime cost. Surgical implantation and
              dedicated glasses plausibly create training and workflow friction, yet no source quantifies switching
              cost, removal burden, multi-homing, or provider capacity.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP007
              - CP012
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              PRIMA's near-term moat is a bundle of clinical evidence, regulatory clearance, inherited retinal
              intellectual property, specialized manufacturing, and site activation rather than a proven price or
              network-effect advantage. Science's $230 million Series C and approximately $490 million of cumulative
              capital support commercialization and a broader neural-engineering portfolio, while its roadmap extends to
              a next-generation implant and glasses and additional retinal diseases. This capital and scope may
              reinforce execution, but the same breadth can diffuse focus. Displacement risk remains material from
              cortical implants, improved disease-modifying therapies, gene therapy, and future entrants that offer less
              invasive treatment or stronger reimbursement. The assigned pool does not support a conclusion about
              comparative funding, clinical efficacy, pricing, surgeon capacity, channel control, or long-term patient
              retention across these alternatives.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Near-term differentiation
            body: >-
              PRIMA combines published multicenter clinical outcomes with European commercial authorization, a stronger
              public proof position than any named implant alternative in the assigned source pool.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
          - type: callout
            title: Competitive evidence is not yet procurement-grade
            body: >-
              No assigned source supplies head-to-head outcomes, net pricing, reimbursement amounts, procedure capacity,
              retention, or a broad census of active competitors.
            calloutType: risk
            claimRefs:
