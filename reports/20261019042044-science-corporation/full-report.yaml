      - number: '1.2'
        title: Leadership, capital, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is high at the founder level and much thinner beneath it. Max Hodak remains the
              primary public face across acquisition, financing, and launch milestones, which is useful for narrative
              coherence but also signals key-person concentration. The 2026 financing materials show some bench
              expansion, especially around Darius Shahida’s strategy role, while independent coverage adds Alan Mardinly
              and Murat Günel to the visible operating roster. Capital access is a real strategic advantage: a $230
              million Series C and roughly $490 million cumulative funding give Science more time and infrastructure
              than most neurotech peers. What the public record still does not give is governance depth—board
              composition, investor rights, and preference terms remain outside the accessible evidence set.
            claimRefs:
