  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitute
        blocks:
          - type: paragraph
            body: >-
              The retained sources define PRIMA's market around a specific late-stage blindness workflow rather than the
              entire ophthalmology market. PRIMA is described as a subretinal photovoltaic implant plus specialized
              glasses for adults with geographic atrophy caused by dry age-related macular degeneration, where lost
              central vision limits reading, facial recognition, and other detail-dependent tasks. That boundary matters
              because the same sources also frame the status quo differently for earlier and later disease stages:
              approved drugs can slow lesion growth, but the cited retained evidence says they do not restore vision
              that has already been lost. Science's first commercial product therefore fits best as a late-stage rescue
              or restoration modality, not as a general AMD therapy or a replacement for earlier disease management.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM012
              - CM013
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing and adjacency
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports only an evidence-constrained sizing model. The broad top-down anchor is disease
              burden: multiple retained sources cite more than five million people globally with AMD-associated
              geographic atrophy. The next layers narrow quickly because public disclosures do not quantify how many of
              those patients have the severe central-vision loss, clinical eligibility, and reimbursed access needed for
              PRIMA today. Instead, the strongest bottom-up evidence is operational: a 38-patient, 17-site, five-country
              evidence base underlies the CE mark, commercial availability spans 30 European countries, and Germany is
              the first expected paying market. Science is also extending PRIMA into Stargardt disease and retinitis
              pigmentosa, which widens strategic adjacency, but those sources still stop short of a source-backed
              SAM/SOM for the near-term launch.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM009
              - CM010
              - CM012
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
