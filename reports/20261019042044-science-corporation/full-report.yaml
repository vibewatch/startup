  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and launch bridge
        blocks:
          - type: paragraph
            body: >-
              Public evidence now supports a real revenue mechanism for Science, but not a quantified one. PRIMA is no
              longer framed solely as a clinical program: Science and multiple trade publications say the device has CE
              marking, is commercially available across 30 European countries, and is preparing for its first German
              implant. That moves the company from pure R&D financing into launch execution. The monetization path is
              still high-touch and sequential rather than software-like: site activation, patient identification,
              implantation, reimbursement approval, then recognized device/procedure revenue. The missing commercial
              detail is what keeps the model from being underwritten. The same launch disclosures say reimbursement
              applications are underway, but none of the retained sources publish ASP, payer rates, discounts, contract
              terms, or realized implant revenue. Science also continues to describe Biohybrid, Vessel, MEMS Foundry,
              and the BCI Ecosystem as investment areas, not as separately disclosed revenue contributors, so PRIMA
              appears to be the only evidenced near-term revenue engine.
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
