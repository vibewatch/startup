      - number: '1.3'
        title: Clinical and regulatory proof points
        blocks:
          - type: paragraph
            body: >-
              The strongest foundation under the current story is that Science is not selling an unvalidated concept.
              The PRIMA launch materials consistently anchor on a clinical package that spans 38 patients, 17 sites, and
              five countries, alongside outcome claims around letter-score improvement and restored reading ability.
              That is materially stronger than a typical pre-pivotal BCI narrative. Just as important, the company’s
              ophthalmic position is not fully homegrown: acquiring PRIMA from Pixium in 2024 supplied the asset that
              now carries both the clinical evidence and the CE-mark launch. For later chapters, this means PRIMA should
              be treated as the company’s core proof-of-execution asset, while the rest of the platform remains earlier
              and less commercially evidenced.
            claimRefs:
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Commercial conversion and open metrics
        blocks:
          - type: paragraph
            body: >-
              The adverse read is not that Science lacks technical proof; it is that the market still lacks the
              operating metrics needed to convert a technical breakthrough into an investable business case. Independent
              reporting explicitly flags the next bottleneck: reimbursement by country, beginning with Germany, rather
              than the CE mark alone. U.S. commercialization is even less mature because regulatory process remains
              incomplete despite special designations. At the same time, the most important judgment metrics—valuation
              support, headcount quality, customer count, revenue, pricing, and board control—remain partially disclosed
              at best. That combination supports a view of Science as heavily financed and strategically differentiated,
              but still early in proving commercial repeatability.
            claimRefs:
              - CO004
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Best available proof point
            body: >-
              Science is no longer only a platform story: PRIMA now combines peer-reviewed human outcomes with a real
              CE-marked launch, which is rarer and more investable than an earlier-stage neurotech claim set.
            calloutType: strength
            claimRefs:
              - CO003
              - CO011
              - CO012
          - type: callout
            title: Commercial proof still trails technical proof
            body: >-
              The next diligence step is not another efficacy slide; it is evidence that reimbursement, pricing, first
              implants, and U.S. regulatory progress can convert a breakthrough device into a repeatable business.
            calloutType: risk
            claimRefs:
              - CO004
              - CO013
              - CO014
