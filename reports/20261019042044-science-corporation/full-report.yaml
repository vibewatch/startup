              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: Buyer, user, and payer path
        blocks:
          - type: paragraph
            body: >-
              The user is clearer than the buyer. Sources consistently identify the patient as a severely sight-impaired
              adult with geographic atrophy from dry AMD, while the workflow runs through specialist ophthalmology
              centers that can implant, activate, and follow the device. The payer path is still emerging rather than
              proven: company and independent coverage say reimbursement applications and site activations are underway
              across Europe, with Germany expected to host the first commercial implant. That means the commercial sale
              depends less on theoretical prevalence than on whether retina centers, local reimbursement authorities,
              and surgeons convert the CE mark into funded procedures. Public materials retained for this chapter do not
              disclose ASP, reimbursement code, or budget-owner detail, so those economics remain a diligence gap rather
              than an authored assumption.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Science has several real adoption drivers: a differentiated restorative claim, peer-reviewed and widely
              re-reported trial outcomes, CE-marked access across a broad European footprint, and substantial
              capitalization earmarked for commercialization, manufacturing, and operations. The same evidence also
              surfaces the key constraints. Europe is open legally but not yet proven economically because reimbursement
              remains country-specific and the first commercial implant is only just beginning in Germany. The U.S. path
              remains investigational despite Breakthrough Device and Humanitarian Use Device designations. And the
              broader disease burden should not be mistaken for immediate market capture: current public evidence
              supports a clinically narrow late-stage segment, with pricing, conversion, and center-capacity assumptions
              still undisclosed.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: PRIMA enters where status quo stops restoring vision
            body: >-
              The strongest market driver is not generic BCI enthusiasm; it is the specific late-stage gap where
              approved GA therapies can slow disease progression but do not restore central vision that has already been
              lost.
            calloutType: insight
            claimRefs:
              - CM001
              - CM011
              - CM015
          - type: callout
            title: CE mark does not equal proven reimbursement
            body: >-
              Europe's 30-country legal footprint is meaningful, but near-term adoption still hinges on Germany-first
              reimbursement conversion, site activation, and surgeon throughput that are not publicly quantified in the
              retained evidence.
