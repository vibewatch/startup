      - [Preserve residual natural vision while adding prosthetic central vision, Surgery can trade off benefit versus retinal damage, Subretinal placement under the atrophic macula preserved mean natural vision in reported follow-up, No significant decline in mean natural vision reported in trial updates, Serious adverse events were concentrated in the early postoperative period]
      - [Extend platform into adjacent inherited retinal disease indications, No public restorative option from Science beyond GA is yet commercial, Company is expanding PRIMA trials to Stargardt disease and retinitis pigmentosa, Broader indication roadmap can increase asset leverage if successful, Expansion remains company-claimed and pre-commercial]
    notes: >-
      Benefit cells preserve reported trial metrics and denominators; they should not be read as
