  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-controls
      missingEvidence: Public software-validation, cybersecurity, data-handling, and complaint/CAPA documentation for the camera, projector, and external processing stack.
      whyItMatters: The product is a wearable-plus-implant system, so commercialization risk includes digital controls and field support, not only implant efficacy.
      diligencePath: Request design-control summaries, cybersecurity test artifacts, post-market surveillance SOPs, and incident logs for the external system components.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: reimbursement
      missingEvidence: Country-level reimbursement terms, ASPs, and first-commercial-implant conversion metrics for Germany and other EU launch markets.
      whyItMatters: CE marking creates legal availability, but revenue scale depends on payer adoption and site activation economics.
      diligencePath: Obtain German reimbursement pathway status, first commercial contract terms, and early implant volume by launch site.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: manufacturing-yield
      missingEvidence: Public manufacturing-yield, quality-system, and service-readiness metrics for the MEMS foundry and PRIMA supply chain.
      whyItMatters: A vertically integrated moat is only valuable if device output, quality, and replacement logistics hold at commercial volumes.
      diligencePath: Request foundry throughput, scrap/yield history, supplier dependencies, and field-service SLAs before underwriting scale assumptions.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: No public repository, package-registry activity, practitioner forum, engineering talk, or integration-partner technical assessment appeared in the assigned source pool.
      whyItMatters: A practitioner-community proxy would provide external evidence on technical execution where a conventional public developer surface is unlikely for an implantable medical device.
      diligencePath: Review professional-society programs, surgical training materials, engineering conference talks, partner technical posts, and public recruiting presentations.
