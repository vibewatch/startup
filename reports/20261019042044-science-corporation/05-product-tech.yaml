company:
  name: Science Corporation
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Science's product is a clinically validated retinal-vision-restoration system rather than
    a standalone implant: PRIMA combines a subretinal photovoltaic chip, specialized glasses,
    and external processing to restore central form vision in advanced geographic atrophy.
    The product is materially more mature than most neural-interface hardware because it is
    CE marked in Europe with 36-month follow-up data, but commercialization still depends on
    reimbursement execution, manufacturing scale-up, and control systems that are not
    publicly described in the assigned evidence set.
sections:
  - id: delivered-system
    title: Delivered system and user workflow
    body: >-
      PRIMA is best understood as a treatment workflow for severely sight-impaired adults with
      geographic atrophy from dry AMD, not as a chip alone. The company and multiple independent
      write-ups describe a subretinal photovoltaic implant paired with specialized glasses and
      external compute that projects near-infrared light onto the implant so patients can recover
      central form vision for tasks such as reading letters, numbers, and words. That matters for
      diligence because the customer-facing deliverable includes hardware, surgical implantation,
      image processing, optical wearables, and post-implant support, so technical risk spans the
      whole stack rather than only the implant itself.
    claimRefs: [CE001, CE002, CE003, CE005, CE011]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: maturity-and-deployment
    title: Clinical maturity, regulatory status, and deployment path
    body: >-
      The evidence base is unusually concrete for an implantable neurotechnology company. The
      pivotal PRIMA program enrolled 38 patients across 17 sites in five countries, with 12-month
      data showing central-vision restoration for a majority of participants and 36-month follow-up
      indicating durability among the evaluable cohort. Commercial maturity has also advanced:
      PRIMA is CE marked in the EU, registered for UK supply, and being launched first through
      Germany and other European sites before any US commercialization. The main caveat is that the
      latest durability and launch claims still come primarily from company-issued updates rather
      than broad post-market evidence.
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002]
  - id: differentiation-and-platform
    title: Differentiation and platform breadth
    body: >-
      PRIMA's differentiation is not just that it stimulates the retina; it appears to be the first
      commercially cleared retinal implant specifically positioned to restore central vision in AMD-
      related geographic atrophy, a narrower and more defensible claim than generic "first BCI"
      marketing. Science is also trying to differentiate beyond a single-device company: its March
      2026 financing update tied PRIMA commercialization to a broader pipeline that includes other
      retinal indications, biohybrid interfaces, perfusion technology, and an in-house MEMS foundry
      and tooling ecosystem. That platform story could matter if manufacturing and iteration speed
      become a moat, but public evidence today is still strongest for PRIMA itself rather than the
      adjacent programs.
    claimRefs: [CE010, CE012, CE013]
    tableRefs: [TE003]
  - id: controls-and-scaling-risks
    title: Controls, dependencies, and diligence gaps
    body: >-
      Product risk now shifts from proving that PRIMA can work at all to proving that Science can
      scale it safely and economically. The 36-month update is directionally reassuring because no
      new safety signal emerged after year one, but surgery-related events were concentrated early
      and commercialization still depends on country-by-country reimbursement, site activation, and
      sustained manufacturing quality. Public materials in this source set say little about software
      validation, cybersecurity, data handling, complaint/CAPA processes, or implant-manufacturing
      yield, so the diligence burden has moved from clinical plausibility toward operating controls.
    claimRefs: [CE007, CE009, CE010, CE011]
