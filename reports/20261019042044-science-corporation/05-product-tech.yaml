    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Subretinal photovoltaic implant, Converts projected light into retinal stimulation, Surgical placement under atrophic macula and retained inner-retina pathway, Implant safety and durability must hold across wider commercial use]
      - [Glasses with camera and projector, Capture scene and send near-infrared image to implant, Wearable optics and patient adherence, "Limited public data on field maintenance, replacement cycles, or support burden"]
      - [External processor / compute chain, Processes visual information and supports magnification workflow, Image-processing quality and seamless system integration, Public materials do not describe software assurance or cybersecurity controls]
      - [Clinical and commercialization operations, Activate sites and reimbursement pathways for implant use, Country-specific reimbursement and trained implant centers, Launch breadth may lag the headline CE footprint]
    notes: >-
      Architecture merges official descriptions with independent reporting; control-system and
      launch-scale risks remain partially undisclosed.
    claimRefs: [CE002, CE003, CE009, CE011]
