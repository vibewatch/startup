chapter:
  number: 4
  title: Financials
  summary: Science entered October 2026 with materially stronger near-term financing after a $230 million Series C and a CE-marked European launch for PRIMA, but the public record still stops short of underwriting basics. There is still no disclosed revenue, ASP, reimbursement rate, gross margin, CAC/payback, or cash-runway data, so the chapter supports a commercialization transition thesis rather than a modelable medtech P&L.
sections:
- id: revenue-model-and-launch-bridge
  title: Revenue model and launch bridge
  body: 'Public evidence now supports a real revenue mechanism for Science, but not a quantified one. PRIMA is no longer framed solely as a clinical program: Science and multiple trade publications say the device has CE marking, is commercially available across 30 European countries, and is preparing for its first German implant. That moves the company from pure R&D financing into launch execution. The monetization path is still high-touch and sequential rather than software-like: site activation, patient identification, implantation, reimbursement approval, then recognized device/procedure revenue. The missing commercial detail is what keeps the model from being underwritten. The same launch disclosures say reimbursement applications are underway, but none of the retained sources publish ASP, payer rates, discounts, contract terms, or realized implant revenue. Science also continues to describe Biohybrid, Vessel, MEMS Foundry, and the BCI Ecosystem as investment areas, not as separately
    disclosed revenue contributors, so PRIMA appears to be the only evidenced near-term revenue engine.'
  claimRefs:
  - CI005
  - CI006
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: traction-without-unit-economics
  title: Public traction exists, but unit economics do not
  body: 'The strongest public traction evidence is clinical, not financial. Science’s NEJM summary and launch materials point to a 38-patient, 17-site, five-country study in which 84% of patients reported reading letters, numbers, and words and 80% achieved at least 0.2 logMAR improvement at 12 months. A later 36-month update reported a 29-letter mean improvement among efficacy-evaluable patients. Those outcomes matter commercially because they give Science a differentiated efficacy story for physicians, patients, and payers. But they do not answer the financial questions that an investor would need to price execution: public sources do not disclose realized revenue, implant volumes, gross margin, CAC, payback, cash burn, or service-delivery cost. Even the reimbursement pathway is described only at the process level. The result is a chapter where adoption potential is visible, but the actual conversion of that potential into recurring gross profit remains unobserved.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs:
  - TI003
- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy improved, but financing dependency remains
  body: 'The refresh meaningfully changes Science’s financing position. In March 2026 the company closed a $230 million Series C, bringing total capital raised to about $490 million, and Inside BCI reported an approximate $1.25 billion post-money valuation. Management says the round funds PRIMA commercialization while also expanding research, manufacturing, and operational infrastructure, which implies that this capital is meant to carry both launch and continued platform build-out. That lowers immediate liquidity pressure versus the prior report, but it does not remove financing dependency because there is still no public cash balance, burn, runway, or debt disclosure. Management’s own language is also forward-looking: the goal is to become the first BCI company to scale and achieve profitability, not to demonstrate that profitability has already been reached. Practically, that means the next financing inflection is still likely to depend on evidence that Europe can turn CE marking into
    reimbursed procedures while the U.S. path remains pending.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI007
  - CI012
  - CI015
- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'Science’s financial story is investable only as a milestone transition, not as a fully underwritten operating model. The company now has both a large 2026 funding round and a launched European product, which is a better setup than a pure pre-commercial clinical asset. But nearly every underwriting input that would turn that setup into conviction is still missing from public evidence: no disclosed revenue line, no price realization, no contribution margin, no installation pace, no channel or reimbursement economics, and no current cash-runway statement. The 36-month safety disclosure is directionally reassuring, yet it also confirms that clinical complications and regulatory timing still matter to revenue conversion. The judgment for this chapter is therefore cautious: Science may have enough capital to push PRIMA through early commercialization, but diligence should treat margin path, launch efficiency, and next-round timing as open items until the company discloses actual implant
    and reimbursement performance.'
  claimRefs:
  - CI004
  - CI007
  - CI010
  - CI011
  - CI012
  - CI015
