- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Total capital raised since founding
    - $490 million
    - High
    - Shows the balance-sheet support available for commercialization and continued platform build-out
    - Verify current unrestricted cash after burn, debt, and any earmarks
  - - Latest financing round
    - $230 million Series C; Inside BCI reported approximately $1.25 billion post-money valuation
    - High
    - Sets the cost of capital and the valuation hurdle that launch evidence must clear
    - Round documents, liquidation stack, and any convert or participation mechanics
  - - Public revenue / ARR / implant run rate
    - null
    - Low
    - Without actual conversion data, revenue quality cannot be underwritten
    - Monthly implants, recognized revenue, geography mix, and repeat procedure cadence
  - - Gross margin / manufacturing and service cost
    - null
    - Low
    - Device economics depend on implant manufacturing, glasses hardware, support, and surgical-service burden
    - COGS, foundry yield, warranty/service cost, and contribution margin by implant
  - - CAC / sales cycle / payback proxy
    - Clinical-site activation plus reimbursement approval implies a high-touch medtech GTM motion
    - Medium
    - Commercial efficiency determines how quickly capital converts into durable revenue
    - Referral funnel, sales-cycle length, site ramp, and payer-approval timeline
  - - Clinical durability / safety proxy
    - 29-letter mean improvement at 36 months; serious adverse events concentrated in first 6 months
    - Medium
    - Outcomes and complication profile affect physician adoption, payer willingness, and downstream support cost
    - Post-market complication cost, explant/reintervention rate, and follow-up resource load
  notes: Null values mean the retained public record does not disclose the metric; qualitative proxies are labeled explicitly rather than treated as measured financial outputs.
