  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Latest cash balance, quarterly burn, runway, and any debt or credit-facility terms.
    whyItMatters: The new financing changes capital adequacy, but without cash and burn data an investor cannot tell how much launch runway actually remains.
    diligencePath: Request the latest board deck or monthly finance pack showing unrestricted cash, burn bridge, runway, and debt covenants.
    relatedQuestionRefs:
    - QI005
    - QI006
  - type: private-evidence-only
    severity: material
    topic: pricing-and-reimbursement
    missingEvidence: Per-country reimbursement codes, approved payment rates, implant ASP, and realized net price after discounts.
    whyItMatters: CE marking creates commercial possibility, but reimbursement economics determine whether procedures can scale into meaningful revenue.
    diligencePath: Request launch-country pricing sheets, payer submissions, and the first reimbursement decisions or signed hospital pricing terms.
    relatedQuestionRefs:
    - QI002
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Device COGS, gross margin, service cost per implant, referral funnel, CAC, sales-cycle length, and payback period.
    whyItMatters: Without unit economics, the chapter can describe launch mechanics but not the margin path or capital efficiency of scaling PRIMA.
    diligencePath: Request a launch unit-economics model with COGS, support burden, commercial headcount assumptions, and actual funnel data from early centers.
    relatedQuestionRefs:
    - QI006
    - QI007
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: realized-commercial-traction
    missingEvidence: Post-launch implant counts, recognized revenue, collection timing, and initial payer mix from Europe.
    whyItMatters: The current record shows readiness and clinical credibility, but not whether launch has started to produce durable commercial proof.
    diligencePath: 'Request monthly European launch KPIs: implanted patients, activated sites, reimbursed procedures, outstanding receivables, and country mix.'
    relatedQuestionRefs:
    - QI001
    - QI004
    relatedTableRefs:
    - TI001
