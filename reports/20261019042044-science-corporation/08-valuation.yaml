- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Argument
  - What would change the view
  rows:
  - - Thesis
    - PRIMA combines unusually strong clinical proof with a CE-marked European launch path and substantial financing support.
    - A documented ramp in reimbursed implants would strengthen the case that Science can convert proof into durable revenue.
  - - Anti-thesis
    - The public entry price is still being asked before outsiders can verify revenue, profitability, or preference-stack economics.
    - Management disclosure of launch KPIs, economics, and cap-table terms would reduce the underwriting gap.
  - - Investment posture
    - The company is strategically important enough to track closely, but the current public evidence set is not enough for a valuation-led buy call.
    - A better price or clearer commercialization metrics would justify revisiting the recommendation.
  notes: This table separates company quality from entry price; a stronger business can still be a weak risk-adjusted buy if public valuation support is thin.
  claimRefs:
  - CV001
  - CV003
  - CV008
  - CV011
  - CV013
  - CV014
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Germany reimbursement converts quickly, first commercial implants lead to visible procedure volume, and the U.S. pathway stays on track.
    - Above the last reported ~$1.5B mark can be defended because reimbursement and launch data would support a premium for first-in-market proof.
    - Manufacturing scale-up or U.S. delay still matters, but the company would be earning the multiple.
    - Needs confirmed reimbursement wins and early commercial throughput.
  - - Base
    - CE mark and first implants arrive, but payer uptake and unit economics take time to prove.
    - Around the last reported mark remains difficult but possible; upside is limited until operating KPIs become public.
    - Flat revenue visibility can turn the round into dead money for new investors.
    - Most consistent with today's evidence set.
  - - Bear
    - Reimbursement is narrow, U.S. authorization slips, or the next financing arrives before launch metrics are credible.
    - Below the last reported mark becomes plausible because public support already relies on secondary pricing references rather than disclosed performance.
    - Down-round or structured-preference protection could impair common-equivalent returns.
    - Triggered by delayed implant cadence, weak payer access, or a reset financing.
  notes: Scenario ranges are anchored to the last reported public valuation reference rather than an unsupported DCF or revenue multiple, because public revenue and margin data are not disclosed.
