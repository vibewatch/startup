company:
  name: Science Corporation
chapter:
  number: 8
  title: Valuation
  summary: Science has crossed an important proof point with peer-reviewed PRIMA efficacy and a July 2026 CE-marked European launch, but the public entry price is still hard to underwrite. The best-circulating valuation anchor remains roughly $1.5 billion from secondary sources while revenue, reimbursement economics, and cap-table terms remain undisclosed, so the recommendation stays track with a stretched valuation stance.
sections:
- id: recommendation-price-discipline
  title: Recommendation and price discipline
  body: 'Science now has evidence of both product efficacy and initial regulatory commercialization: PRIMA produced peer-reviewed functional-vision gains in a 38-patient, 17-site trial, and the device has since received a CE mark for commercial availability in Europe. That materially improves product and regulatory confidence. The underwriting problem is price, not whether the technology is real. Public valuation support still appears to be a roughly $1.5 billion March 2026 mark circulated by secondary databases and cited by Inside BCI as Bloomberg-reported, while public sources still do not disclose revenue, profitability, or reimbursement economics. At that information level, the investable call is track rather than buy, and entry discipline should assume commercialization proof still has to be earned in market.'
  claimRefs:
  - CV003
  - CV004
  - CV006
  - CV007
  - CV008
  - CV014
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-vs-underwriting-gaps
  title: Why the thesis is promising but not yet investable at price
  body: 'The positive case is straightforward: Science raised another $230 million in March 2026, bringing total disclosed capital to about $490 million, and management has aimed that capital at PRIMA commercialization plus broader manufacturing and pipeline build-out. Clinical efficacy is unusually concrete for an implantable neurotechnology company, and CE marking gives the company a real launch path instead of a purely precommercial story. The anti-thesis is equally clear. The company is still pre-disclosure on the operating metrics that matter most to valuation support, including revenue, profitability, and cap-table economics. Even its strongest independent valuation references are secondary-source marks, not a company-disclosed benchmark tied to commercial KPIs. That makes the company attractive strategically, but hard to price aggressively today.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV008
  - CV011
  - CV013
  tableRefs:
  - TV002
- id: scenario-ranges-and-downside
  title: Scenario ranges and downside triggers
  body: 'The bull case requires fast conversion of regulatory proof into reimbursed use: Germany must move from expected first commercial implant to repeatable funded procedures, and the U.S. pathway needs to stay on a credible HDE or other approval timetable. In that outcome, the last reported valuation could be sustained or exceeded because Science would look less like a long-dated platform bet and more like the first neurotechnology company with credible product revenue. The base case is slower. CE mark, reimbursement applications, and site activations are real progress, but they do not yet prove adoption or unit economics, so a flat-to-slightly-down outcome versus the last round remains plausible. The bear case is straightforward: narrow reimbursement, delayed uptake, or U.S. slippage would expose how little public revenue evidence supports the current price.'
  claimRefs:
  - CV004
  - CV005
  - CV009
  - CV010
  - CV014
  - CV015
  tableRefs:
  - TV003
- id: diligence-asks-and-thesis-breaks
  title: Final diligence asks and thesis-break triggers
  body: 'The next diligence cycle should focus on the handful of facts that can actually move the recommendation. First, obtain German reimbursement terms, target ASP, and early implant cadence; a CE mark without funded procedures is not the same as scalable commercialization. Second, request post-launch operating disclosure: implants completed, booked sites, training throughput, manufacturing yield, and gross margin expectations. Third, inspect the cap table and preference stack, including any participation rights or conversion mechanics that could subordinate new money even if headline valuation appears unchanged. A thesis break would be evidence that Europe remains effectively private-pay or highly limited-access, that the U.S. pathway slips materially, or that the next financing resets below the last reported mark before launch KPIs are visible.'
  claimRefs:
  - CV005
  - CV008
  - CV009
  - CV010
  - CV012
  - CV015
tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Field
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - track
    - Clinical and regulatory proof improved, but public price support still outruns disclosed operating evidence.
    - Keep the company active in pipeline, but do not force entry at the last reported mark.
  - - Confidence
    - medium
    - Evidence is strong on product efficacy and launch readiness, weaker on revenue and reimbursement economics.
    - Require hard launch data before upgrading to buy.
  - - Risk rating
    - high
    - Commercial execution, reimbursement, and U.S. regulatory conversion remain unresolved.
    - Underwrite with meaningful downside and timing uncertainty.
  - - Valuation stance
    - stretched
    - Roughly $1.5B public price support is secondary-source and not tied to disclosed revenue or margin metrics.
    - Seek either a lower entry or materially better commercialization proof.
  notes: Assessment reflects only public evidence reviewed in this chapter; the ~$1.5B valuation anchor is secondary-source, while revenue, profitability, and cap-table terms remain undisclosed.
