        blocks:
          - type: paragraph
            body: >-
              PRIMA 的临床案例远好于多数可植入神经科技上市项目，但运营风险并未消失。Science 1 月对关键性数据集的总结显示，一项覆盖 38 名患者、17 个站点的欧洲试验取得了具有视觉意义的改善；2026 年
              10 月更新又将这一结果延伸至 36 个月，且没有新报告的安全信号。这是产品能够工作的良好证据，但并不等同于广泛的上市后可靠性。36 个月数据中，安全性可评估患者只有 27 人，疗效可评估患者只有 18
              人，不良事件画像从根本上仍受手术影响。因此，投资人应将欧洲早期上市视为受监控的放量过程：每一例首批商业植入、每项报销批准和每个站点启用都很重要，因为目前还没有足够大的安装基数来吸收执行噪音。
