  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 临床证据和 CE 标志上市准备是真正的利好，但商业化经济性和价格支撑仍是关键卡点。
    data:
      nodes:
        - id: proof
          label: 临床证据
          detail: 38 名患者、17 个站点、5 个国家；据报告，84% 能够阅读字母、数字和单词。
        - id: launch
          label: 监管上市证据
          detail: CE 标志覆盖 30 个欧洲国家；德国预计完成首例商业植入。
        - id: capital
          label: 融资能力
          detail: Science 在 C 轮融资中筹集 $230M，披露的累计资本约为 $490M。
        - id: gaps
          label: 商业化缺口
          detail: 公开来源仍缺乏经验证的收入、盈利能力、报销经济性和股权结构细节。
        - id: price
          label: 价格锚点
          detail: 公开估值支撑集中在二级来源给出的约 $1.5B、2026 年 3 月参考值。
        - id: call
          label: 建议
          detail: 继续跟踪 / 估值偏高，直到报销和上市 KPI 足以支撑该价格的投资判断。
          tone: risk
      edges:
        - from: proof
          to: launch
          label: 降低产品风险
        - from: launch
          to: capital
          label: 支持商业化
        - from: capital
          to: gaps
          label: 无法解决披露问题
        - from: gaps
          to: price
          label: 限制估值支撑
        - from: price
          to: call
          label: 决定入场纪律
    approximationNotes: 流程总结定性的投资判断依赖，而不是隐含转化率或概率加权估值计算。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV014
      - CV015
