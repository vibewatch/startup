      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              PRIMA 的近期壁垒来自临床证据、监管许可、继承而来的视网膜知识产权、专门化制造和站点启用的组合，而不是已经验证的价格优势或网络效应。Science 的 $230 million Series C 和约
              $490 million
              累计资本支持商业化及更广泛的神经工程组合；其路线图还延伸到下一代植入物和眼镜，以及更多视网膜疾病。这种资本和范围可能强化执行，但同样的广度也可能分散重点。皮层植入物、疗效更好的疾病修饰疗法、基因疗法，以及提供更低侵入性治疗或更强报销能力的新进入者，都带来实质性替代风险。指定证据不足以判断这些替代方案之间的融资、临床疗效、定价、外科医生产能、渠道控制或长期患者留存差异。
