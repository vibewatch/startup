      - number: '4.3'
        title: 资本充足性改善，但融资依赖仍在
        blocks:
          - type: paragraph
            body: >-
              本次更新实质性改变了 Science 的融资状况。公司于 2026 年 3 月完成 $230 million Series C，使累计融资达到约 $490 million；Inside BCI 报道其投后估值约为
              $1.25 billion。管理层称本轮资金将支持 PRIMA
              商业化，同时扩充研发、制造和运营基础设施；这笔钱既要支撑上市，也要继续建设平台。与上一份报告相比，短期流动性压力下降，但融资依赖并未消失，因为仍没有公开的现金余额、现金消耗、资金续航或债务披露。管理层自己的措辞也仍面向未来：目标是成为首家实现规模化和盈利的
              BCI 公司，而不是证明盈利已经实现。实际而言，下一次融资拐点仍可能取决于欧洲能否把 CE 标志转化为获得报销的手术，而美国路径仍在等待中。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI012
              - CI015
      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Science 的财务故事只有作为里程碑转折才具有投资价值，还不是一套完整可承保的经营模型。公司如今既有大规模 2026
              年融资，也有已在欧洲上市的产品，这比纯粹的商业化前临床资产更好。但几乎所有能把这一基础转化为投资信心的承保输入，仍缺少公开证据：没有披露收入线、价格实现、贡献利润率、安装速度、渠道或报销经济性，也没有当前现金续航说明。36
              个月安全性披露在方向上令人放心，但也确认临床并发症和监管时点仍会影响收入转化。因此，本章判断仍需谨慎：Science 可能拥有足够资本推动 PRIMA
              进入早期商业化，但在公司披露实际植入和报销表现前，尽调应将利润率路径、上市效率和下一轮融资时间视为待解问题。
            claimRefs:
              - CI004
              - CI007
              - CI010
              - CI011
              - CI012
              - CI015
