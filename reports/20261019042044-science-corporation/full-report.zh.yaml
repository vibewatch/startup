figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Science 从 2021 年成立到 2026 年 CE 标志上市的进展显示，PRIMA 收购和融资都紧密集中在商业化前。
    data:
      items:
        - period: April 2021
          label: Science 成立
          detail: Max Hodak 离开 Neuralink 后创立 Science，搭建了后来吸收 PRIMA 的神经工程平台。
          tone: neutral
          claimRefs:
            - CO002
            - CO008
        - period: April 2024
          label: 从 Pixium 收购 PRIMA
          detail: Science 从 Pixium Vision 收购 PRIMA 视网膜植入资产，获得支撑当前上市的眼科平台。
          tone: neutral
          claimRefs:
            - CO010
        - period: January 2026
          label: PRIMA 同行评审证据公开
          detail: Science 公开了 NEJM 支持的 PRIMA 结果：五个国家 17 个站点的 38 名患者出现功能性阅读和视力提升。
          tone: positive
          claimRefs:
            - CO011
            - CO012
        - date: '2026-03-05'
          label: C 轮融资完成
          detail: 超额认购的 $230M C 轮融资将披露的累计融资额推至约 $490M，并为商业化和基础设施建设提供资金。
          tone: positive
          claimRefs:
            - CO005
            - CO007
        - period: March 2026
          label: 宣布扩大试验
          detail: Science 表示，PRIMA 研究将扩展至 Stargardt 病和视网膜色素变性，同时美国监管工作继续推进。
          tone: neutral
          claimRefs:
            - CO007
        - date: '2026-07-22'
          label: CE 标志和欧洲上市
          detail: PRIMA 获得 DEKRA 的 CE 标志，并在 30 个欧洲国家商业上市。
          tone: positive
          claimRefs:
            - CO003
        - period: July 2026
          label: 德国报销准备进行中
          detail: Science 表示，各国报销申请和站点启用正在推进，德国预计很快完成首例商业植入。
          tone: risk
          claimRefs:
            - CO013
        - period: '2026'
          label: 美国路径仍开放
          detail: 外部报道强调，FDA 的特殊认定尚不等于批准，美国营销仍需进一步监管许可。
          tone: risk
          claimRefs:
            - CO004
