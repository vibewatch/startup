      - number: '3.2'
        title: 能力差异化与证明负担
        blocks:
          - type: paragraph
            body: >-
              PRIMA
              将光伏视网膜下植入物与配备摄像头的眼镜结合，通过近红外光传输电力和图像数据。这一架构形成了清晰的竞争主张：它刺激残存视网膜细胞，而不是视觉皮层；目标是恢复丧失的可用中央视力，而不只是减缓疾病进展。证据基础有分量，但范围狭窄。报道的关键性研究覆盖五个国家的
              17 个站点、38 名患者，多份指定来源重复称，12 个月时有 80% 达到既定视力阈值。严重不良事件集中在早期，据报道 95% 在两个月内缓解，但 MassDevice
              指出公司没有披露严重不良事件数量。因此，试验差异化不应被误认为广泛的头对头基准。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: 商业化、定价与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Science 在欧洲已走出仅限上市前的阶段：患者页面称 PRIMA 已在欧盟获得 CE 标志，并在英国注册供应；独立报道则称首例商业植入预计在德国完成。公司还表示，各国报销申请和临床站点启用正在推进。这些步骤让
              Science 相比只有 FDA
              认定的替代方案拥有分销先发优势，但并不能证明采用经济性。指定证据没有披露设备价格、手术价格、实际报销、合同模式、折扣或全生命周期成本比较。手术植入和专用眼镜可能带来培训及工作流摩擦，但没有来源量化切换成本、取出负担、多归属或服务提供方产能。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
