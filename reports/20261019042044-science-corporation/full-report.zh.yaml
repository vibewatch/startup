      - number: '2.3'
        title: 买方、用户与支付方路径
        blocks:
          - type: paragraph
            body: >-
              用户比买方更清晰。来源一致将患者定义为患有干性 AMD
              地图样萎缩的严重视力受损成年人，而整个流程要经过能够植入、启动并随访设备的专科眼科中心。支付方路径仍在形成，尚未得到验证：公司和独立报道称，欧洲各地正在推进报销申请和站点启用，德国预计将完成首例商业植入。因此，商业销售取决于视网膜中心、当地报销机构和外科医生能否把
              CE 标志转化为有资金支持的手术，而不只是理论患病率。留存的公开材料没有披露 ASP、报销代码或预算负责人细节，因此这些经济性属于尽调缺口，而非本报告自行假设。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              Science 有几个真实的采用驱动因素：差异化的恢复性主张、经同行评审且被广泛重复报道的试验结果、覆盖广泛欧洲区域的 CE
              标志准入，以及为商业化、制造和运营预留的大量资本。同一批证据也暴露出关键约束。欧洲在法规上已经开放，但经济性尚未得到验证，因为报销仍按国家分别推进，而首例商业植入才刚在德国启动。尽管获得 Breakthrough
              Device 和 Humanitarian Use Device
              认定，美国路径仍处于研究阶段。更广泛的疾病负担也不能等同于即时市场获取：当前公开证据支持的是一个临床范围狭窄的晚期细分市场，定价、转化率和中心产能假设仍未披露。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: PRIMA 切入现状治疗无法恢复视力的空白
            body: 最强的市场驱动因素不是泛泛的 BCI 热情，而是一个具体的晚期空白：获批的 GA 疗法可以减缓疾病进展，却无法恢复已经丧失的中央视力。
            calloutType: insight
            claimRefs:
              - CM001
              - CM011
              - CM015
          - type: callout
            title: CE 标志不等于报销已获验证
            body: 欧洲 30 国的法律覆盖面很有意义，但近期采用仍取决于以德国为先的报销转化、站点启用和外科医生吞吐量，而留存证据没有公开量化这些指标。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局比可植入视网膜设备更广。买方可以选择 PRIMA，等待 Neuralink 的 Blindsight
              等视觉皮层植入物，使用旨在减缓疾病进展的疗法，尝试实验性基因疗法，或继续不接受恢复性治疗。在指定证据中，PRIMA
              是唯一被记录为已在欧洲商业供应、用于恢复地图样萎缩患者形态视力的方案；MobiHealthNews 报道其已在 30 个欧洲国家获得 CE 标志，并将 Blindsight 认定为相邻的皮层路径。Science
              于 2024 年从 Pixium Vision 收购 PRIMA 知识产权及相关资产，因此 Pixium
              更适合被视为平台前身，而不是当前运营中的竞争对手。由此形成的是部分竞争集合，而非对视网膜器械、药品或低视力辅助方案的穷尽式枚举。
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP010
