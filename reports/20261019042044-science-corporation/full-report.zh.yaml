  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管许可跑在报销和美国批准之前
        blocks:
          - type: paragraph
            body: >-
              PRIMA 获得 CE 标志是一次重要的去风险事件，因为它让 Science 从纯临床阶段的视网膜植入物开发商变成拥有欧盟许可商业产品的公司；但现有证据也显示，获批只是第一道门。Science 称 DEKRA
              已授权在 30
              个欧洲国家商业供应，但同时也称报销申请和站点启用仍按国家推进，德国只是预计首个植入市场。独立报道更直接地指出：如果德国报销、医院导入或真实植入节奏令人失望，欧洲仍可能无法把监管许可转化为付费手术。在美国，Science
              仍处于商业化前阶段；Breakthrough Device 和 Humanitarian Use Device 认定有助于与 FDA 沟通，但并不授权上市，公司仍面临未来 Humanitarian Device
              Exemption 决定的时点风险。
