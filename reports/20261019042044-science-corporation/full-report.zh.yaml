        title: 临床成熟度、监管状态与部署路径
        blocks:
          - type: paragraph
            body: >-
              可植入神经科技公司的证据基础异常具体。PRIMA 关键性项目覆盖五个国家的 17 个站点、38 名患者；12 个月数据显示多数参与者恢复了中央视力，36
              个月随访则表明可评估队列的效果具有持久性。商业成熟度也在提升：PRIMA 已在欧盟获得 CE
