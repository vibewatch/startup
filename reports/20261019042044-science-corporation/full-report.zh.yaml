      - CE002
      - CE003
      - CE004
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: PRIMA 的客户旅程仍从候选人识别和临床站点启用，走向狭窄的首个市场报销闭环。
    data:
      items:
        - label: 候选人识别
          actor: 来自 AMD 晚期 GA 患者
          touchpoints:
            - 重度中央视力丧失筛查
            - 在更广泛的视网膜人群前优先定位 GA
          note: 当前客户定位范围狭窄，且针对特定适应症。
          tone: neutral
        - label: 登记入组
          actor: 潜在患者和 Science
          touchpoints:
            - patients.science.xyz 兴趣登记
            - 跟踪阅读、面部识别和行动能力
          note: 这显示漏斗正在搭建，但公开来源没有披露登记人数。
          tone: warning
        - label: 临床评估
          actor: 视网膜专科医生和已启用站点
          touchpoints:
            - 专业网络教育
            - 欧洲各国临床站点启用
          note: 采用取决于专科中心启用，而不是广泛的自助需求。
          tone: neutral
        - label: 植入和报销上市
          actor: 欧洲医院和支付方
          touchpoints:
            - CE 标志授权覆盖 30 个欧洲国家
            - 德国是首个披露的商业植入市场
          note: 商业准入已经存在，但报销转化仍在推进。
          tone: warning
        - label: 功能性结果证明
          actor: 已植入患者和研究人员
          touchpoints:
            - 84% 能够阅读字母、数字和单词
            - 80% 在 12 个月时实现显著视力改善
          note: 最强的客户证明是临床获益，而不是已披露的单位经济性。
          tone: positive
        - label: 持久性和扩张闭环
          actor: 现有用户、临床医生和下一适应症中心
          touchpoints:
            - 36 个月随访未显示新的安全性信号
            - RP 和 Stargardt 试验及下一代植入体推动扩张
          note: 持久性证据令人鼓舞，但商业续约和集中度仍未披露。
          tone: warning
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
      - CU011
      - CU012
