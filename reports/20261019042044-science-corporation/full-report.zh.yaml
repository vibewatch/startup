        - 德国报销快速落地，首批商业植入带来可见的手术量，美国路径保持在轨道上。
        - 由于报销和上市数据将支持对首个市场验证成果的溢价，估值可以高于最近报告的约 $1.5B。
        - 制造扩产或美国延迟仍然重要，但公司将开始配得上这一倍数。
        - 需要确认的报销成功案例和早期商业处理量。
      - - 基准
        - CE 标志和首批植入落地，但支付方接受度和单位经济性仍需时间验证。
        - 回到上次披露估值附近仍有难度但并非不可能；在运营 KPI 公开前，上行空间有限。
        - 收入可见度停滞，可能让新投资者把这轮融资变成沉没资金。
        - 与当前证据集最一致。
      - - 悲观
        - 报销范围狭窄、美国审批延期，或下一轮融资在上市指标变得可信前就已到来。
        - 跌破上次披露估值变得合理，因为公开支撑已经依赖二级市场定价参考，而非披露的经营表现。
        - 下轮融资或结构化优先权保护可能损害普通股等价回报。
        - 由植入节奏延迟、支付方准入疲弱或融资重置触发。
    notes: 情景区间锚定上次披露的公开估值参考，而不是缺乏支撑的 DCF 或收入倍数，因为公开收入和利润率数据未披露。
