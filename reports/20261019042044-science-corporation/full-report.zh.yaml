      - number: '1.3'
        title: 临床与监管证明点
        blocks:
          - type: paragraph
            body: >-
              当前故事最扎实的基础，是 Science 并非在销售未经验证的概念。PRIMA 上市材料始终聚焦一套临床资料：覆盖 38 名患者、17
              个站点和五个国家，并包含字母评分改善及阅读能力恢复等结果主张。这明显强于典型的关键性试验前 BCI 叙事。同样重要的是，公司的眼科资产并非完全自研：2024 年从 Pixium 收购
              PRIMA，为如今的临床证据和 CE 标志上市提供了基础。在后续章节中，应把 PRIMA 视为公司的核心执行证明资产，而平台其余部分仍处于更早阶段，商业证据也更少。
            claimRefs:
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: 商业转化与待补指标
        blocks:
          - type: paragraph
            body: >-
              负面判断并不是 Science 缺乏技术证明，而是市场仍缺少把技术突破转成可投资商业案例所需的经营指标。独立报道明确指出下一道瓶颈是按国家推进报销，起点是德国，而不只是拿到 CE
              标志。尽管获得了特殊认定，美国商业化仍更不成熟，因为监管流程尚未完成。同时，最重要的判断指标——估值依据、员工质量、客户数、收入、定价和董事会控制权——最多也只是部分披露。这一组合支持这样的判断：Science
              资金充足且战略差异化明显，但距离证明商业模式可重复仍处早期。
            claimRefs:
              - CO004
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前最佳证明点
            body: Science 已不再只是平台故事：PRIMA 如今将同行评审的人体结果与真实的 CE 标志上市结合起来，这比早期神经科技公司的主张更少见，也更具投资价值。
            calloutType: strength
            claimRefs:
              - CO003
              - CO011
              - CO012
