      - number: '7.4'
        title: 报销拖延、美国延迟或新的上市后安全噪音会击穿论点
        blocks:
          - type: paragraph
            body: >-
              现在最有价值的尽调不是再做一次泛泛的技术审查，而是跟踪一小组具体检查点。第一，确认德国能否把 CE
              标志许可转化为足以支持更广泛欧盟上市的报销手术，而不是象征性上市。第二，取得美国监管路径的一手证据，因为公开报道仍以方向性措辞描述 HDE/HUD 路径，而不是已提交且有时间表的路径。第三，测试有利的 36
              个月安全更新在商业植入开始后的真实使用中能否维持。最后，反向压力测试公司的运营计划：PRIMA
              需要达到多少制造吞吐、站点产能和报销可见度，管理层才有资格声称产品正在为平台其余部分提供资金。任何一个检查点缺失，都可能让当前风险组合从可管理变成击穿投资论点。
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: CE 标志降低产品有效性风险，不等于市场准入
            body: Science 已跨过最重要的欧洲监管门槛，但证据仍指向报销、医院启用和美国 HDE 路径，这些才是近期真正的闸门。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
          - type: callout
            title: Series C 只有在 PRIMA 成为付费产品时才是在买时间
            body: 对一家私营神经科技初创公司而言，Science 资本充足；但管理层也将 PRIMA 定义为应为平台其余部分提供资金的业务，因此上市转化是核心假设，而不是额外收益。
            calloutType: assumption
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: callout
            title: 三个击穿论点的触发器值得立即跟踪
            body: 如果德国报销延迟、美国 HDE 路径滑坡，或商业使用出现新的安全噪音，应在进一步提高投资信心前重新评估估值和融资假设。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR012
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Science 如今同时拥有产品疗效和初步监管商业化证据：PRIMA 在一项覆盖 38 名患者、17 个站点的试验中取得同行评审的功能性视力改善，此后设备又获得了在欧洲商业供应的 CE
              标志。这实质性提高了产品和监管信心。承保问题在于价格，而不是技术是否真实。公开估值依据似乎仍是 2026 年 3 月约 $1.5 billion 的估值，这一数字由二级数据库流传并被 Inside BCI 引用为
              Bloomberg 报道；但公开来源仍未披露收入、盈利能力或报销经济性。在这一信息水平下，可投资判断是跟踪而非买入，入场纪律应假定商业化证明仍需在市场中挣出来。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV014
              - CV015
      - number: '8.2'
        title: 论点有吸引力，但按当前价格尚不可投资的原因
        blocks:
          - type: paragraph
            body: >-
              正面情况很清楚：Science 于 2026 年 3 月再次融资 $230 million，使已披露资本达到约 $490 million；管理层将资金投向 PRIMA
              商业化以及更广泛的制造和管线建设。可植入神经科技公司的临床疗效异常具体，CE
              标志也给了公司真实的上市路径，而不是纯粹的商业化前故事。反面论点同样清楚。公司仍未披露最影响估值依据的经营指标，包括收入、盈利能力和股权结构经济性。即使是最有力的独立估值参考，也只是二级来源估值，而非与商业
              KPI 挂钩的公司披露基准。因此，公司在战略上有吸引力，但今天很难激进定价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: 情景区间与下行触发器
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求监管证明迅速转化为获得报销的使用：德国必须从预计首例商业植入走向可重复的有资金支持手术，美国路径也需维持可信的 HDE 或其他批准时间表。在这种结果下，最近一次报告的估值可以维持甚至上升，因为
              Science 看起来会更像首家拥有可信产品收入的神经科技公司，而不是长期平台押注。基准情景更慢。CE
              标志、报销申请和站点启用都是真实进展，但尚不能证明采用或单位经济性，因此相对上一轮持平至小幅下行仍有可能。悲观情景很直接：报销范围狭窄、采用延迟或美国路径滑坡，会暴露出支持当前价格的公开收入证据有多么有限。
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV015
      - number: '8.4'
        title: 最终尽调问题与击穿论点的触发器
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应集中于真正能改变建议的少数事实。第一，取得德国报销条款、目标 ASP 和早期植入节奏；没有获得资金支持的手术，CE
              标志不等于可规模化商业化。第二，要求上市后的运营披露：已完成植入数、已签约站点、培训吞吐量、制造良率和毛利率预期。第三，检查股权结构表和优先股堆叠，包括任何可能让新资金处于次位的参与权或转换机制，即使
              headline valuation 看起来没有变化。若证据显示欧洲实际上仍是私费或准入高度受限、美国路径大幅延迟，或在上市 KPI 可见前下一轮融资低于最近报告估值，则投资论点会被击穿。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
