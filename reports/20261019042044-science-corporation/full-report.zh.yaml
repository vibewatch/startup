  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 交付系统与用户流程
        blocks:
          - type: paragraph
            body: >-
              PRIMA 更适合被理解为一套面向患有干性 AMD
              地图样萎缩、严重视力受损成年人的治疗流程，而不是一块单独的芯片。公司及多篇独立报道描述了一种视网膜下光伏植入物，配合专用眼镜和外部计算系统，将近红外光投射到植入物上，使患者恢复中央形态视力，用于阅读字母、数字和单词等任务。这对尽调很重要，因为面向客户交付的不只是植入物，还包括硬件、手术植入、图像处理、光学可穿戴设备和植入后支持，技术风险覆盖整套系统，而非只有植入物本身。
