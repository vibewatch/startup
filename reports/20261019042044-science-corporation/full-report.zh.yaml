            title: 商业证明仍落后于技术证明
            body: 下一步尽调不应再看一页疗效幻灯片，而应寻找报销、定价、首批植入和美国监管进展能否把突破性器械变成可重复业务的证据。
            calloutType: risk
            claimRefs:
