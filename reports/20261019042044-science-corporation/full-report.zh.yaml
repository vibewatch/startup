            body: >-
              产品风险如今从证明 PRIMA 能否工作，转向证明 Science 能否安全且经济地规模化。36
              个月更新在方向上令人放心，因为第一年之后没有出现新的安全信号；但手术相关事件集中在早期，商业化仍取决于逐国报销、站点启用和持续的制造质量。指定来源集中的公开材料很少涉及软件验证、网络安全、数据处理、投诉与
              CAPA 流程或植入物制造良率，因此尽调重点已从临床可行性转向运营控制。
