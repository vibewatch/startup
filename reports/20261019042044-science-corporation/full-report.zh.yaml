  - id: FE001
    title: 产品架构图
    type: stack
    summary: PRIMA 结合了植入硬件、外部光学、处理系统和商业部署层。
    data:
      layers:
        - label: 临床目标
          detail: 干性 AMD 导致的地图状萎缩及重度中央视力丧失
          items:
            - 晚期 GA 患者
            - 中央形状视觉恢复用例
        - label: 植入层
          detail: 置于萎缩黄斑下方的视网膜下光伏植入体
          modules:
            - 378 个光供电像素
            - 2 mm x 2 mm x 30 um 植入体
            - 人工光感受器阵列
        - label: 外部光学和计算
          detail: 日常使用所需的可穿戴和处理组件
          modules:
            - 专用眼镜
            - 前置摄像头
            - 近红外投影仪
            - 外部视觉处理计算机
            - 缩放 / 放大流程
        - label: 验证和推广
          detail: 临床证据和首个市场的上市路径
          outputs:
            - 38 名患者、17 个站点、五个国家的试验基础
            - 获 CE 标志的欧盟商业上市
            - 以德国为首的报销和站点启用路径
            - 下一代分辨率 / 视野工作
        - label: 商业交付
          detail: 各国报销、受训站点和患者支持将批准转化为实际使用
          outputs:
            - 以德国为首的商业路径
            - 各国报销申请
            - 临床站点启用
        - label: 生命周期控制
          detail: 制造质量、软件保障、监测和服务维持植入系统运行
          outputs:
            - 制造良率仍未披露
            - 网络安全和数据控制仍未披露
            - 上市后支持指标仍未披露
    approximationNotes: null
    claimRefs:
