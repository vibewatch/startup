  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与上市桥接
        blocks:
          - type: paragraph
            body: >-
              公开证据如今支持 Science 存在真实的收入机制，但尚未量化。PRIMA 已不再只是临床项目：Science 和多家行业媒体称，该设备已获得 CE 标志，在 30
              个欧洲国家商业供应，并准备在德国完成首例植入。这让公司从纯研发融资转向上市执行。变现路径仍是高接触、顺序推进的流程，而非软件式模式：站点启用、患者识别、植入、报销批准，随后确认设备及手术收入。商业细节的缺失，正是模型尚不足以进行投资判断的原因。同一批上市披露称报销申请正在推进，但仍没有公开
              ASP、支付方费率、折扣、合同条款或实际植入收入。Science 也继续将 Biohybrid、Vessel、MEMS Foundry 和 BCI Ecosystem
              描述为投资领域，而非单独披露的收入贡献者，因此目前有证据支持的近期收入引擎似乎只有 PRIMA。
