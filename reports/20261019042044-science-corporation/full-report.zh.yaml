  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              留存来源将 PRIMA 的市场定义在特定的晚期失明治疗流程，而不是整个眼科市场。PRIMA
              被描述为视网膜下光伏植入物加专用眼镜，面向因干性年龄相关性黄斑变性而患地图样萎缩的成年人；中央视力丧失会限制阅读、面部识别及其他依赖细节的任务。这一边界很重要，因为同一批来源也区分了早期和晚期疾病的现状治疗：获批药物可以减缓病灶生长，但引用的留存证据称，它们无法恢复已经丧失的视力。因此，Science
              的首个商业产品最适合被视为晚期挽救或恢复疗法，而不是一般性的 AMD 疗法，也不是早期疾病管理的替代品。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM012
              - CM013
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模与邻接机会
        blocks:
          - type: paragraph
            body: >-
              公开证据只支持一套受证据约束的规模模型。自上而下的宽口径锚点是疾病负担：多份留存来源称，全球有超过 500 万人患有与 AMD 相关的地图样萎缩。再往下，口径迅速收窄，因为公开披露没有量化其中有多少人同时具备
              PRIMA 当前所需的严重中央视力丧失、临床资格和获得报销的条件。相反，最强的自下而上证据来自运营：一套覆盖 38 名患者、17 个站点和五个国家的证据支撑了 CE 标志；商业供应覆盖 30
              个欧洲国家；德国是预计首个付费市场。Science 也在将 PRIMA 拓展到 Stargardt 病和视网膜色素变性，这扩大了战略邻接面，但这些来源仍不足以支撑近期开市的有来源 SAM/SOM。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM009
              - CM010
              - CM012
              - CM014
