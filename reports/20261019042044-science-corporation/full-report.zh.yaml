            body: >-
              按初创公司标准，Science 并未面临近期资本枯竭：管理层称自 2021 年以来已筹资约 $490 million，其中包括 2026 年 3 月超额认购的 $230 million Series
              C，并称资金将用于 PRIMA 商业化以及扩充制造和更广泛的管线。这降低了下一步上市工作的急性募资风险，但没有消除商业模型风险。Hodak 告诉
              TechCrunch，视觉业务应为公司长期生物混合工作提供资金；PRIMA 不只是产品里程碑，也是 Science
              整体论点的经济桥梁。如果报销推进缓慢、制造爬坡不均或美国批准延期，公司仍可能面临已筹资本与足以证明其合理性的收入证据之间不匹配。
