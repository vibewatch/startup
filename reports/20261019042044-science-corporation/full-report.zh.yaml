        title: 差异化与平台广度
        blocks:
          - type: paragraph
            body: >-
              PRIMA 的差异化不只在于刺激视网膜；它似乎是首个获得商业许可、且专门定位于恢复 AMD 相关地图样萎缩中央视力的视网膜植入物，这一主张比泛泛的“首个 BCI”营销更窄，也更可守。Science
              也在尝试超越单一设备公司：其 2026 年 3 月融资更新将 PRIMA 商业化与更广泛的管线联系起来，包括其他视网膜适应症、生物混合接口、灌注技术，以及内部 MEMS Foundry
              和工具生态。如果制造和迭代速度最终形成壁垒，这一平台故事可能很重要；但目前公开证据最强的仍是 PRIMA，而不是邻近项目。
