  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持从上市到收入的链条，但不支持其中任何一步的金额。
    data:
      nodes:
        - id: demand
          label: 符合条件的 GA 患者需求
          displayValue: '>5M people affected globally'
          note: 疾病负担支持需求，不代表公司收入。
        - id: sites
          label: 临床站点启用和患者入组
          displayValue: Country-specific activations underway
          note: 商业化从已启用的临床中心开始。
        - id: implant
          label: PRIMA 植入手术
          displayValue: First commercial implant expected soon in Germany
          note: 准备状态已公开；实际植入量尚未公开。
        - id: reimbursement
          label: 报销批准和付款
          displayValue: Applications underway; no public rates
          note: 上市和现金回收之间的主要瓶颈。
        - id: revenue
          label: 确认的器械 / 手术收入
          displayValue: Public value unavailable
          note: 保留来源没有披露收入、ARR 或净价。
        - id: gross-profit
          label: 扣除器械和服务成本后的毛利
          displayValue: Public value unavailable
          note: 制造、支持和服务成本披露缺失。
      edges:
        - from: demand
          to: sites
