        - from: implant
          to: reimbursement
          label: 手术必须获得支付
        - from: reimbursement
          to: revenue
          label: 获批付款转为确认收入
        - from: revenue
          to: gross-profit
          label: 收入扣除硬件、临床和支持成本
    approximationNotes: 该顺序有来源支持，但各节点的金额大多未披露，因此有意保留为定性描述。
    claimRefs:
