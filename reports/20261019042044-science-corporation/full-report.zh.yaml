chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Science 将自己定位为神经工程平台，而不是单一产品初创公司，但当前经营故事要具体得多：PRIMA 是把公司从研究阶段推入早期商业化的核心资产。公司称成立于 2021 年，指定的独立报道则将总部定位在
              Alameda, California，并指出 PRIMA 项目与 Paris 之间存在延续关系。这一组合很关键，因为公司如今按地域分化：欧洲已有 CE
              标志产品，美国仍处于商业化前监管路径。就尽调而言，Science 最适合被定义为一家在欧洲处于早期商业化阶段的视网膜 BCI
              公司，以及一家在美国仍处监管阶段的器械公司，                            而不是一个尚未形成规模化收入的医疗科技故事。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO010
