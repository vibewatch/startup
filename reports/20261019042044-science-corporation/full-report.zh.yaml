      - number: '4.2'
        title: 已有公开牵引力，但尚无单位经济性
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引力证据来自临床，而不是财务。Science 的 NEJM 摘要和上市材料指向一项覆盖 38 名患者、17 个站点和五个国家的研究，其中 84% 的患者称能够阅读字母、数字和单词，80% 在 12
              个月时至少改善 0.2 logMAR。后续 36 个月更新称，在疗效可评估患者中平均改善 29
              个字母。这些结果具有商业意义，因为它们为医生、患者和支付方提供了差异化疗效故事。但它们没有回答投资人定价执行所需的财务问题：公开来源没有披露实际收入、植入量、毛利率、CAC、回本周期、现金消耗或服务交付成本。报销路径也只按流程描述。结果是，采用潜力看得见，但潜力能否转化为经常性毛利润仍无公开观察。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
