      - number: '1.2'
        title: 领导层、资本与治理透明度
        blocks:
          - type: paragraph
            body: >-
              创始人层面的领导力曝光度很高，但其下方的团队信息薄得多。Max Hodak 仍是收购、融资和上市里程碑的主要公开代表，这有助于保持叙事一致，却也暴露出关键人物集中度。2026 年融资材料显示团队有所扩充，尤其是
              Darius Shahida 的战略职能；独立报道还将 Alan Mardinly 和 Murat Günel 纳入可见的经营团队。资本获取是明确的战略优势：$230 million 的 Series C 和约
              $490 million 的累计融资，让 Science 比多数神经科技同行拥有更充足的时间和基础设施。但公开记录仍无法说明治理深度——董事会构成、投资人权利和优先权条款都不在可获取证据范围内。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO016
