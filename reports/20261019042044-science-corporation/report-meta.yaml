  topStrengths:
    - Strong published clinical evidence for functional vision restoration.
    - CE-marked European launch converts PRIMA from a trial asset into a real commercial product.
    - Large disclosed capital base supports commercialization and platform build-out.
  topRisks:
    - Reimbursement, pricing, and launch economics remain undisclosed and country-specific.
