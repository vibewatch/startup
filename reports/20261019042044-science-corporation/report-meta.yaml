companyProfile:
  summary: >-
    Science Corporation is a private neural-engineering and medical-device company best known for PRIMA, a subretinal
    photovoltaic retinal prosthesis aimed at restoring central vision in geographic atrophy from dry age-related macular
    degeneration. The company has moved from a clinical-stage posture into early European commercialization after a
    CE-marked launch, but its operating picture is still opaque because revenue, reimbursement economics, and governance
    terms remain only partially disclosed.
  foundedDate: null
  founders:
    - name: Max Hodak
      role: Cofounder and CEO
      background: Former Neuralink president and the public face of Science's financing and commercialization narrative.
      claimRefs:
        - CO002
        - CO008
  foundingLocation: null
  headquarters: Alameda, California, United States
  productSummary: >-
    PRIMA combines a subretinal photovoltaic implant, specialized glasses, and external processing to restore functional
    central vision for severely sight-impaired adults with geographic atrophy.
  customerFocus: >-
    Severely sight-impaired adults with geographic atrophy from dry AMD, served through specialist retina centers and
    country-specific reimbursement pathways.
  businessModel: >-
    Implant and procedure revenue through specialist retina centers, with reimbursement determined country by country
    and Europe as the first commercial market.
  stage: Early commercial in Europe; pre-commercial in the U.S.
