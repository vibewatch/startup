    whyItMatters: The current evidence base is still mostly pivotal-trial and company-announcement material, so post-market execution could change the risk ranking quickly.
    diligencePath: Track first commercial cases in Germany, request a launch dashboard from management, and compare commercial outcomes against the pivotal trial baseline each quarter.
