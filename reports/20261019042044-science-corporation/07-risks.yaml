company:
  name: Science Corporation
chapter:
  number: 7
  title: Risks
  summary: 'Science''s current risk stack is dominated by commercialization execution rather than proof-of-concept: PRIMA now has CE-mark clearance and encouraging clinical data, but European reimbursement remains country-by-country and U.S. commercialization still depends on an unresolved Humanitarian Device Exemption path. The March 2026 Series C gives Science time to launch, yet it also raises the cost of delay because PRIMA is expected to finance the company''s broader biohybrid roadmap before post-market safety, pricing, and manufacturing unknowns are fully de-risked.'
sections:
- id: regulatory-and-market-access
  title: Regulatory clearance has arrived faster than reimbursement or U.S. approval
  body: 'PRIMA''s CE mark is a meaningful de-risking event because it turns Science from a purely clinical-stage retinal-implant developer into a company with an EU-cleared commercial product, but the available evidence also shows that clearance is only the first gate. Science says DEKRA authorized commercial availability across 30 European countries, yet it simultaneously says reimbursement applications and site activations are still country-specific and that Germany is merely the first expected implant market. Independent coverage makes the same point more starkly: Europe can still fail to convert regulatory clearance into paid procedures if German reimbursement, hospital onboarding, or real-world implant cadence disappoints. On the U.S. side, Science remains in a pre-commercial state; Breakthrough Device and Humanitarian Use Device designations improve engagement with FDA, but they do not authorize launch and still leave the company exposed to timing risk on an eventual Humanitarian Device
    Exemption decision.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR012
  - CR013
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: clinical-durability-and-operations
  title: Clinical proof is strong, but the operating envelope is still narrow
  body: 'The clinical case for PRIMA is far better than for most implantable-neurotech launches, yet the operational risk has not disappeared. Science''s January summary of the pivotal dataset showed visually meaningful gains across a 38-patient, 17-site European trial, and the October 2026 update extended that story to 36 months without a newly reported safety signal. That is good evidence that the product can work, but it is not the same thing as broad post-market reliability. The 36-month dataset only had 27 patients evaluable for safety and 18 for efficacy, and the adverse-event profile is still fundamentally a surgery-dependent one. Investors therefore need to treat early Europe rollout as a monitored scale-up: every first-wave commercial implant, reimbursement approval, and site activation matters because there is not yet a large installed base to absorb execution noise.'
  claimRefs:
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
  - TR002
- id: capital-structure-and-dependency
  title: The balance sheet lowers immediate solvency risk but raises execution pressure
  body: 'Science is not facing a near-term capital drought by startup standards: management says it raised approximately $490 million since 2021, including an oversubscribed $230 million Series C in March 2026, and said the proceeds are intended to commercialize PRIMA while expanding manufacturing and the broader pipeline. That reduces acute fundraising risk for the next launch steps, but it does not remove model risk. Hodak told TechCrunch that the vision business is supposed to finance the company''s longer-term biohybrid work, which means PRIMA is not just a product milestone but the economic bridge for the rest of Science''s thesis. If reimbursement arrives slowly, manufacturing ramps unevenly, or U.S. approval slips, the company could still face a mismatch between the capital already raised and the revenue proof needed to justify it.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  tableRefs:
  - TR003
- id: kill-criteria-and-diligence-path
  title: The thesis breaks on reimbursement slippage, U.S. delay, or new post-market safety noise
  body: The highest-value diligence now is not another generic technology review; it is a short list of concrete checkpoints. First, confirm whether Germany converts CE-mark clearance into reimbursed procedures at a pace that supports broader EU rollout rather than a symbolic launch. Second, obtain primary evidence on the U.S. regulatory path, because public reporting still describes the HDE/HUD route in directional rather than filed-and-timed terms. Third, test whether the favorable 36-month safety update survives real-world use once commercial implants begin. Finally, pressure-test the company's operating plan by asking how much manufacturing throughput, site capacity, and reimbursement visibility PRIMA must achieve before management can credibly claim that the product is financing the rest of the platform. Missing any of those checkpoints would move the current risk stack from manageable to thesis-breaking.
  claimRefs:
  - CR002
  - CR004
  - CR006
  - CR007
  - CR008
  - CR011
  - CR012
  - CR013
