  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: eu-reimbursement-rollout
    missingEvidence: Germany launch pricing, reimbursement basis, first-payer approvals, and evidence on whether patients or hospitals bear any uncovered cost.
    whyItMatters: CE-mark clearance is commercially meaningful only if reimbursement converts it into repeatable paid procedures at attractive unit economics.
    diligencePath: Request Germany launch deck, payer correspondence, initial hospital contracts, and first-case reimbursement outcomes from management.
    relatedQuestionRefs:
    - QR002
    - QR006
    - QR008
    relatedTableRefs:
    - TR001
    - TR003
  - type: missing-source
    severity: material
    topic: us-regulatory-status
    missingEvidence: Primary FDA/HDE filing status, review milestones, population caps, and any open clinical or manufacturing conditions tied to a U.S. approval path.
    whyItMatters: The U.S. market is a major part of the upside case, and public coverage still describes timing directionally rather than from primary regulatory records.
    diligencePath: Obtain FDA correspondence, the HDE filing package or submission receipt, and management's milestone plan for a U.S. decision.
    relatedQuestionRefs:
    - QR001
    - QR007
    - QR008
    relatedTableRefs:
    - TR001
    - TR003
  - type: missing-source
    severity: material
    topic: manufacturing-scale
    missingEvidence: Commercial manufacturing throughput, implant and glasses yields, field-service readiness, and any supplier redundancy for the launch configuration.
    whyItMatters: Even strong clinical demand can stall if implant supply, glasses servicing, or site support cannot scale with the first reimbursed markets.
    diligencePath: Request operations KPIs, launch-capacity plan, supplier map, and any internal service-level targets for Europe.
    relatedQuestionRefs:
    - QR004
