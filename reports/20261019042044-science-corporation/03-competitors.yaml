schemaVersion: report-v2
artifact: competitors
slug: science-corporation
runDate: 2026-10-19
company:
  name: Science Corporation
chapter:
  number: 3
  title: Competitors
  summary: >-
    PRIMA is differentiated from progression-slowing treatments and the one named
    neural-implant peer in the assigned evidence by its subretinal architecture,
    trial-backed restoration of form vision, and current European commercial status.
    The competitive conclusion remains provisional because public pricing, comparative
    outcomes, switching economics, and competitor scale are not disclosed in this source set.
sections:
  - id: landscape-and-alternatives
    title: Landscape and buyer alternatives
    body: >-
      The relevant landscape is broader than implantable retinal devices. A buyer can
      select PRIMA, wait for a visual-cortex implant such as Neuralink's Blindsight,
      use treatments intended to slow disease progression, pursue experimental gene
      therapy, or remain with no restorative intervention. Within the assigned evidence,
      PRIMA is the only option documented as commercially available in Europe for
      restoring form vision in geographic atrophy; MobiHealthNews reported CE marking
      across 30 European countries and identified Blindsight as an adjacent cortical
      approach. Science acquired PRIMA intellectual property and related assets from
      Pixium Vision in 2024, so Pixium is better treated as the platform predecessor
      than as a current operating rival. The resulting map is a partial competitive
      set, not an exhaustive enumeration of retinal-device, pharmaceutical, or
      low-vision-assistance alternatives.
    claimRefs: [CP004, CP008, CP009, CP010]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-clinical-proof
    title: Capability differentiation and proof burden
    body: >-
      PRIMA combines a photovoltaic subretinal implant with camera-equipped glasses
      that transmit power and image data through near-infrared light. That architecture
      preserves a distinct competitive proposition: it stimulates remaining retinal
      cells rather than the visual cortex and is intended to restore lost functional
      central vision rather than merely slow progression. The evidence base is meaningful
      but narrow. The reported pivotal study involved 38 patients at 17 sites in five
      countries, and multiple assigned sources repeated that 80% achieved the stated
      visual-acuity threshold at 12 months. Serious adverse events were concentrated
      early and 95% reportedly resolved within two months, but MassDevice noted that
      the company did not disclose the number of serious adverse events. Consequently,
      trial differentiation should not be mistaken for a broad head-to-head benchmark.
    claimRefs: [CP001, CP002, CP003, CP009, CP010, CP011]
    tableRefs: [TP002]
  - id: commercialization-and-buying-friction
    title: Commercialization, pricing, and buying friction
    body: >-
      Science has moved beyond a premarket-only posture in Europe: its patient page says
      PRIMA is CE marked in the European Union and registered for supply in the United
      Kingdom, while independent reporting says the first commercial implantation was
      expected in Germany. The company also said that country-specific reimbursement
      applications and clinical-site activations were underway. Those steps create a
      distribution lead over alternatives represented only by an FDA designation, but
      they do not establish adoption economics. The assigned evidence contains no
      disclosed device price, procedure price, realized reimbursement, contract model,
      discounting, or comparative lifetime cost. Surgical implantation and dedicated
      glasses plausibly create training and workflow friction, yet no source quantifies
      switching cost, removal burden, multi-homing, or provider capacity.
    claimRefs: [CP004, CP005, CP006, CP007, CP012, CP016]
    tableRefs: [TP003]
  - id: moat-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      PRIMA's near-term moat is a bundle of clinical evidence, regulatory clearance,
      inherited retinal intellectual property, specialized manufacturing, and site
      activation rather than a proven price or network-effect advantage. Science's
      $230 million Series C and approximately $490 million of cumulative capital support
      commercialization and a broader neural-engineering portfolio, while its roadmap
      extends to a next-generation implant and glasses and additional retinal diseases.
      This capital and scope may reinforce execution, but the same breadth can diffuse
      focus. Displacement risk remains material from cortical implants, improved
      disease-modifying therapies, gene therapy, and future entrants that offer less
      invasive treatment or stronger reimbursement. The assigned pool does not support
      a conclusion about comparative funding, clinical efficacy, pricing, surgeon
      capacity, channel control, or long-term patient retention across these alternatives.
    claimRefs: [CP008, CP009, CP010, CP013, CP014, CP015, CP016]
