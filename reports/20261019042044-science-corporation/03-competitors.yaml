      - ["Experimental gene therapy", "Adjacent substitute", "Described as experimental by a trial clinician", "Degenerative eye disease", "Potential biological treatment rather than an electronic prosthesis", "No named program, comparative outcome, commercial stage, or pricing evidence in the assigned pool"]
      - ["No restorative intervention", "Status quo", "Historically no option restoring lost central vision, according to cited clinicians", "Patients with severe irreversible central vision loss", "Avoids surgery and device dependence", "Quality-of-life, care-cost, and assistive-device evidence are not quantified"]
      - ["Pixium Vision PRIMA platform", "Predecessor technology", "Intellectual property and related assets acquired by Science in 2024", "Retinal stimulation for geographic atrophy", "Source platform for the current PRIMA system", "Not evidenced as a current standalone competitor after the asset acquisition"]
