      Partial landscape limited to entities and alternative classes explicitly identified
      in the assigned prefetched sources; unknown funding, pricing, scale, and outcomes are
      not estimated.
    claimRefs: [CP004, CP008, CP009, CP010, CP015]
  - id: TP002
    title: Capability and evidence comparison
    columns: [Buying criterion, Science PRIMA, Neuralink Blindsight, Progression-slowing therapy, Experimental gene therapy]
    rows:
      - ["Anatomical target", "Subretinal; stimulates remaining retinal cells", "Visual cortex", "Not specified in assigned evidence", "Not specified in assigned evidence"]
      - ["Functional objective", "Restore functional central form vision", "Vision-related neural implant; outcome evidence not supplied", "Slow disease progression", "Experimental vision treatment; objective not quantified"]
      - ["Public clinical proof", "38 patients, 17 sites, five countries; 12-month outcomes reported", Unknown, Unknown, Unknown]
      - ["Regulatory/commercial posture", "CE marked in EU and registered for UK supply", "FDA Breakthrough Device designation reported", Unknown, Experimental]
      - ["External hardware or procedure", "Surgical implant plus camera/projector glasses", "Implant architecture not detailed in assigned evidence", Unknown, Unknown]
    notes: >-
      Cells marked Unknown mean the assigned pool did not contain support; the table does
      not infer parity, infer inferiority, or substitute company comparisons for independent
      benchmarking.
    claimRefs: [CP001, CP002, CP004, CP006, CP007, CP009, CP010]
  - id: TP003
    title: Pricing, packaging, and access comparison
    columns: [Alternative, Price or unit, Contract or access model, Included capability, Underwriting implication]
    rows:
      - [Science PRIMA, "Not disclosed", "Country-specific reimbursement applications and clinical-site activation underway", "Implant, dedicated glasses, image processing, and zoom", "Commercial availability is established, but realized net price and provider economics remain unknown"]
      - [Neuralink Blindsight, "Not disclosed", "No commercial model in assigned evidence", "Cortical stimulation concept", "Designation alone does not establish access, timing, or price"]
      - ["Progression-slowing therapies", "Not disclosed", "No product-level access model in assigned evidence", "Disease-progression management", "Cannot compare lifetime cost or reimbursement with PRIMA"]
      - ["No restorative intervention", "Not applicable as a product price", "Existing care and assistive workflows not quantified", "Avoids implant purchase and procedure", "Status-quo cost and quality-of-life tradeoff remain unmeasured"]
    notes: >-
      Public list price, procedure fees, discounts, reimbursement amounts, service terms,
      and realized pricing were absent from the assigned prefetched sources as of 2026-10-19.
    claimRefs: [CP005, CP007, CP012, CP016]
figures:
  - id: FP001
    title: Competitive positioning by commercialization evidence and restoration specificity
    type: quadrant
    summary: >-
      Evidence-backed ordinal placement separates the commercially available PRIMA system
      from earlier-stage or non-restorative alternatives without implying market-share rank.
    data:
      xAxis:
        label: "Commercialization evidence (1=early/experimental, 5=available)"
        min: 1
        max: 5
      yAxis:
        label: "Restoration specificity (1=non-restorative, 5=trial-backed form vision)"
        min: 1
        max: 5
      points:
        - {label: "Science PRIMA current system", x: 5, y: 5, detail: "CE marked and registered for UK supply, with reported form-vision outcomes."}
        - {label: "PRIMA next-generation system", x: 1, y: 4, detail: "Company roadmap for improved implant, glasses, processing, and ergonomics."}
        - {label: "Pixium-origin PRIMA platform", x: 3, y: 5, detail: "Predecessor platform acquired by Science; not evidenced as a current standalone rival."}
        - {label: "Neuralink Blindsight", x: 1, y: 3, detail: "Cortical approach with FDA Breakthrough Device designation but no outcomes in the assigned pool."}
        - {label: "Progression-slowing treatments", x: 4, y: 1, detail: "Alternative class that does not restore already-lost vision in the cited comparison."}
        - {label: "Experimental gene therapy", x: 1, y: 2, detail: "Experimental alternative identified by a PRIMA investigator, without comparative results."}
    approximationNotes: >-
      Coordinates are analyst ordinal scores, not measured market shares or clinical
      effect sizes. Scores use only stage and functional claims present in the assigned
      evidence; one-point differences are not statistically meaningful.
    claimRefs: [CP004, CP006, CP008, CP009, CP010, CP014]
callouts:
  - calloutType: strength
    title: Near-term differentiation
    body: >-
      PRIMA combines published multicenter clinical outcomes with European commercial
      authorization, a stronger public proof position than any named implant alternative
      in the assigned source pool.
    claimRefs: [CP002, CP003, CP004, CP009]
  - calloutType: risk
    title: Competitive evidence is not yet procurement-grade
    body: >-
      No assigned source supplies head-to-head outcomes, net pricing, reimbursement
      amounts, procedure capacity, retention, or a broad census of active competitors.
    claimRefs: [CP012, CP015, CP016]
