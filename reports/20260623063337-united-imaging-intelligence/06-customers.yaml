- id: retention-and-durability
  title: Retention, durability, and switching costs
  body: 'On durability, UII has a strong structural argument and almost no disclosed data. The structural case is that uAI is frequently embedded natively in UIH scanners and integrated into hospital PACS/RIS, which raises switching costs: replacing the AI typically means disrupting the imaging workflow or the underlying hardware relationship, and the uAI Clinical Portal consolidates 60-plus applications so a hospital that standardizes on it accrues training and integration lock-in. Regulatory breadth reinforces stickiness, because a hospital that has validated cleared applications in its clinical pathway is unlikely to re-validate a competitor without cause. These are real retention tailwinds common to deeply integrated clinical infrastructure.


    The data case is essentially empty. UII publishes no net revenue retention, gross retention, churn, renewal rate, contract length, or customer-satisfaction score, and there is no public cohort showing repeat usage over time. Because most adoption is bundled with hardware, even the parent''s filings do not expose AI-software renewal behavior. The honest read is that durability is plausible on mechanism but unproven on metrics, and every retention claim must be converted into a null with an explicit diligence ask: request NRR/GRR by hospital tier, application-level active-use and renewal cohorts, contract terms, and churn reasons under NDA. Loss-making listed peers such as Airdoc show that broad clinical adoption does not guarantee durable, profitable revenue.'
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  tableRefs:
  - TU004
- id: expansion-and-concentration
  title: Expansion paths and concentration risk
  body: 'UII''s expansion engine is a land-and-expand loop anchored on the parent channel: a hospital buys a UIH scanner with embedded AI, adopts the uAI Clinical Portal for additional cleared applications, then expands into newer agents and foundation-model capabilities as they commercialize, while overseas growth follows UIH''s rapid international build-out (overseas parent revenue rose more than 50 percent in 2025). This is a powerful motion because the hardware relationship pre-qualifies the account and lowers AI customer-acquisition cost relative to software-only rivals.


    The same structure creates concentration risk on three fronts. First, channel and ownership concentration: UII''s distribution, brand, and much of its installed base depend on parent UIH, so the customer relationship is only partly UII''s own. Second, geographic and segment concentration in China''s Tier-3 hospital market, where value-based procurement and budget pressure compress prices and where AI software lacks a national reimbursement line. Third, geopolitical concentration risk on the growth frontier: US and European expansion faces documented trust, supply-chain-security, data-privacy, and US-China trade-tension headwinds that can slow or block procurement at exactly the academic accounts UII most wants. No public disclosure quantifies top-customer revenue concentration, so the magnitude of single-account or single-channel dependence remains a material open diligence item rather than a measured figure.'
