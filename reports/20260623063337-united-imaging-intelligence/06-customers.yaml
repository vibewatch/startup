company:
  name: United Imaging Intelligence
chapter:
  number: 6
  title: Customers
  summary: United Imaging Intelligence (UII) sells clinical-AI software to hospitals, but its customer base is best understood through its parent United Imaging Healthcare (UIH, 688271.SH), whose imaging hardware is the primary distribution channel. UII reports its uAI applications running across more than 4,000 medical institutions, and UIH carries that AI into an installed base spanning 100-plus countries, over 640 cumulative US systems, and named academic sites such as UC Davis Health (a uMR 680 MRI customer) and European hospitals in Italy, France, and Lithuania. At ECR 2026 UII showcased 30 CE-certified AI applications validated in multicenter settings across four continents. The adoption signal is genuine - production platforms, not pilots - but the public record discloses no standalone UII customer count, no named-account revenue, no renewal, churn, or net-revenue-retention data, and no separation of AI software value from bundled hardware. Concentration on the parent channel and on China's Tier-3 market, plus US-China trust and trade friction, are the principal durability risks.
sections:
- id: customer-segmentation
  title: Customer base and segmentation
  body: 'United Imaging Intelligence serves hospitals and health systems, with radiology departments and hospital IT as the primary buyers, radiologists and clinicians as the users, and the hospital itself as the payer because China has no national reimbursement line for standalone diagnostic-AI software. The customer base segments along three visible axes. By geography, the core market is China''s public hospital system, especially large Tier-3 and Tier-3A teaching hospitals, while an expanding overseas footprint rides the parent United Imaging Healthcare (UIH) channel into Europe, North America, Asia, and South America. By use case, customers adopt uAI for triage, lesion detection, segmentation, structured radiology reporting, and increasingly AI agents for chest CT, brain MRI, and ultrasound. By channel, UII reaches customers two ways: AI embedded natively in UIH scanners and PACS, and standalone uAI Clinical Portal (uCP) software licensed to hospitals that may run mixed-vendor fleets.


    The scale signal is real. UII states its 12 platforms and 100-plus applications are deployed across more than 4,000 medical institutions, and the parent reports an installed base spanning more than 100 countries and regions with over 640 cumulative United States systems by the end of 2025. China''s national health system has pushed AI-assisted diagnostics into more than 1,200 Tier-3A hospitals during 2025-2026, the exact pool UII targets. But the public disclosures conflate institutions, deployed applications, and hardware accounts, so the count of paying UII software customers - distinct from hospitals that merely own a UIH scanner with embedded AI - is not separable from the outside.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
