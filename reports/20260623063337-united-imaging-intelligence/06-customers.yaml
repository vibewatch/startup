- id: named-customer-proof
  title: Named customer proof and reference quality
  body: 'Named, externally verifiable customers are the strongest test of adoption, and here UII''s evidence is uneven. The clearest public reference is UC Davis Health, whose radiology equipment list shows a United Imaging 1.5T uMR 680 MRI system in production - an independent, customer-side disclosure rather than a vendor case study. Industry coverage names additional UIH installations in Italy (including a uCT 960+), France, Germany, and Lithuania, and flagship uMR Omega 3T ultra-wide-bore systems have been placed at US imaging providers such as X-Ray Associates of New Mexico. In China, leading academic centers including Fudan University''s Zhongshan Hospital in Shanghai have been referenced as uAI users. At ECR 2026, UII presented multicenter validation spanning Europe, Asia, North America, and South America for its 30 CE-certified applications.


    Two qualifications matter for diligence. First, most named proof attaches to UIH hardware accounts; the disclosures rarely isolate which sites pay for uAI software as a distinct line, so a hardware reference is not automatically a software-revenue reference. Second, the newest autonomous AI agents - report-writing, ultrasound-robot, and image-to-report agents shown at RSNA 2025 and ECR 2026 - are demonstrated and validated in research settings but lack independent, production-grade outcome evidence at named sites. The proof matrix therefore rates the cleared imaging applications as high-maturity with solid corroboration, while the agentic tier scores high on ambition but low on independent retention and outcome visibility.'
