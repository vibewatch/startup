- id: founders-leadership-and-governance
  title: Founders, leadership, and governance
  body: 'UII''s leadership is anchored by Xiang "Sean" Zhou, identified across company and third-party sources as co-founder and (co-)CEO and the firm''s legal representative. Zhou, a long-time medical-imaging and machine-learning researcher, has been the public face of the company at industry forums including the 2025 World Artificial Intelligence Conference (WAIC), where he outlined the multimodal-agent strategy. Dijia Wu is identified as chief technology officer, and profile databases list a deep bench of research vice-presidents including Feng Shi, Yaozong Gao, and Shanhui Sun. The company emphasizes a globally recruited AI research team split across Shanghai, Beijing, Wuhan, and a Boston-area subsidiary, UII America, Inc., in Burlington, Massachusetts.


    Governance is dominated by the parent relationship. United Imaging Healthcare is both the corporate parent and a continuing investor in the Series A, which means UIH founder Xue Min''s group exercises substantial control and the AI subsidiary''s strategy is tightly coupled to the listed parent. That coupling is a double-edged dependency: it gives UII privileged access to imaging data, a hardware distribution channel, and brand trust, but it also concentrates key-person and key-shareholder risk and complicates an independent governance narrative.


    Public board composition, the post-Series-A cap table, and the precise division of economics between UII and UIH are not disclosed. 36Kr reported in 2025 that UII is weighing an independent public listing, which would, if pursued, force fuller governance and financial disclosure; until then, diligence on board seats, investor rights, and related-party terms with the parent rests largely on private materials. The depth of the research bench is a genuine strength, but the opacity of governance and the parent''s control are the clearest open questions in the identity picture.'
