- id: S803
  title: Scenarios, upside, and downside
  body: 'The bull case for United Imaging Intelligence is coherent. If AI monetizes as a high-margin software attach to the parent''s expanding installed base, if exports scale into Europe and allied markets, and if standalone revenue is already in the 200-to-350-million-dollar range by 2028, an eight-to-twelve-times multiple supports a two-to-four-billion-dollar value. The base case is narrower: UII grows alongside the parent and converts clearances into modest paid usage, leaving the present mark only modestly defensible at six-to-nine-times revenue. The bear case is plausible because valuation here is acutely sensitive to a missing denominator. If Chinese hospital AI willingness-to-pay stays weak, as listed peer losses imply, if geopolitics caps exports through BIOSECURE-style restrictions, or if revenue is far below estimate, then listed imaging-AI bands near two-to-five-times revenue become the relevant anchor and downside expands quickly. At 1.4 billion dollars, an investor is already discounting much of the good news and leaving little room for monetization disappointment.'
  claimRefs:
  - CV015
  - CV022
  - CV024
  - CV026
  - CV031
