company:
  name: United Imaging Intelligence
chapter:
  number: 8
  title: Valuation
  summary: "United Imaging Intelligence's June 2025 Series A set a roughly 1.4-billion-dollar post-money mark on a seven-year-old company backed by E Fund, Shanghai state investors, and its listed parent United Imaging Healthcare (688271.SH). The strategic case is strong: real hospital deployment across 4,000-plus institutions, about thirteen NMPA Class III clearances, and a credible platform story. But the price is hard to underwrite with conviction because United Imaging Intelligence discloses no standalone revenue, margin, or retention, so the implied multiple is unknowable. Listed Chinese imaging-AI peers such as Airdoc trade near 1.8x EV/revenue while remaining loss-making, and Tempus screens near 7.1x, so a 1.4-billion-dollar private mark already embeds a heavy strategic and state-backing premium. The disciplined public-evidence call is research-more with a stretched valuation stance."
