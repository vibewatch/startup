  - FV003
- id: S804
  title: Valuation benchmarks and what they imply
  body: 'External multiple benchmarks help frame how aggressive the United Imaging Intelligence mark is. HealthTech merger-and-acquisition valuations entering 2026 mostly cleared around mid-single-digit revenue multiples with low-teens EBITDA, while premium AI and data platforms stretched above that band. AI-startup advisory work cites a much wider distribution, with the strongest platform names reaching ten-to-fifty-times forward revenue. In Hong Kong, Chapter 18A pre-revenue biotech and medical-AI listings have priced near fifteen-to-thirty-times forward revenue when near-term revenue is projectable, and higher for differentiated platforms. United Imaging Intelligence could plausibly justify a double-digit revenue multiple if its standalone revenue is modest but fast-growing with software margins, which would place the 1.4-billion-dollar mark inside, not beyond, the premium private band. The decisive unknown remains the denominator: the same headline price is either reasonable or stretched depending entirely on a revenue figure that the company has not disclosed.'
