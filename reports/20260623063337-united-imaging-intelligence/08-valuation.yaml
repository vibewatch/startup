sections:
- id: S801
  title: Recommendation and price discipline
  body: 'The right public-evidence posture on United Imaging Intelligence today is research-more, not avoid and not buy. The strategic and clinical story is strong: the June 2025 Series A of roughly 139 million dollars priced the company near a 1.4-billion-dollar post-money valuation, anchored by E Fund, Shanghai state investors, and a listed parent in United Imaging Healthcare. Deployment is real, spanning more than four thousand institutions with a deep regulatory stack of NMPA Class III, CE, and FDA clearances. The problem is price discipline. United Imaging Intelligence discloses no standalone revenue, gross margin, or retention, so the multiple implied by the 1.4-billion-dollar mark is literally unknowable from public evidence. That forces underwriting to rely on a strategic narrative rather than a denominator. The recommendation is cautious because valuation support, not clinical relevance, is the central unresolved question, and the burden of proof now sits squarely on diligence.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV005
  - CV010
  - CV015
  - CV031
  - CV038
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
  - FV004
- id: S802
  title: Comparable discipline and the parent anchor
  body: 'Listed comparables are the necessary discipline tool when a private mark lacks a denominator. The closest scaled reference is the parent itself: United Imaging Healthcare carried a market capitalization near 85 billion yuan in mid-2026 at roughly six times sales, with 2025 revenue of about 13.8 billion yuan and net profit near 1.87 billion yuan. That is a hardware-led multiple, not a pure software-AI one, but it bounds expectations. Among imaging-AI peers, the listed Chinese player Airdoc trades near 1.8 times enterprise value to revenue while remaining loss-making, and broader Chinese imaging-AI peers cluster in low single-digit revenue multiples. Against US-listed Tempus near 7.1 times and private references such as Viz.ai at a 1.2-billion-dollar 2022 mark, United Imaging Intelligence at 1.4 billion dollars sits at the premium end of its peer set. The signal is not that UII is overvalued, but that its mark already embeds a large strategic and state-backing premium over where public imaging-AI economics actually clear.'
