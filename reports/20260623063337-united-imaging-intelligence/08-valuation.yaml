- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Standalone revenue and ARR bridge
    - UII-only recognized revenue, recurring share, growth, and parent-related revenue split.
    - The price is acutely sensitive to a denominator that is currently undisclosed.
    - Finance diligence, management-certified revenue bridge, and parent carve-out schedules.
  - - Gross margin and monetization model
    - Per-app pricing, bundled-versus-paid mix, and gross margin after compute and support.
    - Premium multiples only hold if AI software economics are genuinely attractive.
    - Finance and product diligence with pricing-realization analysis.
  - - Retention and deployment depth
    - Paid-institution count, usage depth, and renewal or churn across the 4,000-plus footprint.
    - Logo breadth without depth would not support a durable premium.
    - Customer reference calls and deployment-telemetry review.
  - - Parent-dependency and related-party terms
    - Distribution, IP, compute, and pricing terms between UII and UIH.
    - Economic reality can diverge sharply from the headline private mark.
    - Counsel review of related-party agreements and cap table.
  - - Geopolitical export exposure
    - Share of pipeline reliant on US and allied markets exposed to BIOSECURE and FDA risk.
    - Export restrictions could remove a core leg of the bull case.
    - Regulatory and trade-counsel scenario analysis.
  notes: If these asks cannot be answered cleanly, the right posture is patience rather than aggressive price-taking on a strategic narrative.
