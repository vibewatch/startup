- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - value
  - rationale
  rows:
  - - Recommendation
    - research-more
    - Strategic backing and real deployment are genuine, but the valuation rests on undisclosed standalone economics.
  - - Confidence
    - medium
    - The financing headline is well corroborated, yet core operating denominators are entirely absent from the public record.
  - - Risk Rating
    - high
    - A premium private mark meets monetization, geopolitical, and parent-dependency risk before any audited unit economics exist.
  - - Valuation Stance
    - stretched
    - A 1.4-billion-dollar mark on an undisclosed revenue base already prices in successful AI monetization that Chinese peers have struggled to show.
  - - Decision implication
    - Stay engaged for strategic optionality but require standalone revenue, margin, and retention before underwriting the price.
    - The gate is denominator disclosure and monetization proof, not strategic relevance.
  notes: This recommendation is price-sensitive and evidence-sensitive; cleaner standalone disclosures or a lower entry could move the stance.
