  topStrengths:
    - E Fund、上海国投等国资关联锚定方，加上上市母公司 UIH，带来少见的融资耐久性和政策一致性。
    - 已在中国 4,000 多家机构、全球 3,000 多家机构落地，显示真实临床拉力。
    - 监管组合很深：13 项 NMPA Class III、15 项 FDA、31 项 CE 许可，相比获证更薄的竞争者形成门槛。
    - uAI 平台覆盖广（12 个平台、100+ 应用），2025 年又转向多模态基础模型，支撑长期平台叙事。
    - 可优先使用母公司 UIH 的影像数据、硬件分销渠道和品牌信任，独立创业公司很难匹配。
  topRisks:
    - 未披露独立收入、利润率或留存，因此约 $1.4B 标记隐含的倍数不可知，也可能偏高。
    - 中国医院 AI 变现弱，Airdoc 等上市同行仍在亏损，说明付费意愿是真风险。
    - 对母公司 UIH 的结构性依赖很重，集中关键股东和治理风险，也让独立估值更复杂。
    - 地缘政治暴露（BIOSECURE 式措施、FDA 对中国器械的审查、数据治理张力）威胁出口乐观情景。
    - NMPA Class III 变更控制和不成熟的 AI 支付政策，可能让获证变成成本中心，而不是收入驱动。
  unresolvedGaps:
    - United Imaging Intelligence 的独立收入、ARR、增长和母公司相关收入拆分完全未披露。
    - uAI 软件的毛利率、实际定价和捆绑 / 付费组合未公开。
    - 4,000+ 部署足迹中的付费机构数量、使用深度和留存未知。
    - 与母公司 UIH 围绕分销、IP、算力和定价的关联交易条款未披露。
    - Series A 后股权结构表、董事会构成和独立员工数未公开。
