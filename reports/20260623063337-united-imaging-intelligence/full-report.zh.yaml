  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和变现架构
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 是上市母公司 United Imaging Healthcare（UIH，688271.SH）旗下独立融资的医疗 AI 业务，变现对象是软件和临床 AI
              应用，而不是影像硬件。作为私营子公司，它不披露独立收入、ARR 或净利润，因此只能从产品披露和母公司报表重建收入架构。UII 通过两个可见渠道变现 AI：嵌入或打包进 UIH 扫描仪和 PACS
              的应用，以及销售给医院的独立 uAI 软件许可。公司报告截至 2025 年中，已有 12 个产品平台、100 多个 AI 应用，部署于 4,000 多家医疗机构，并由 13 张 NMPA 三类证、15 项 FDA
              清除和 31 项 CE 认证支撑。


              未公开的信息与已公开信息同样关键。UII 不公布按检查或按席位的标价；与多数中国影像 AI 厂商一样，它通过医院采购或设备打包销售，这遮住了实际定价和独立收入归因。公司在 FDA 2026 年 Q1 放射 AI
              授权名单中排名第五（约 40
              项已清除设备），说明持续投入产品和研发，但清除宽度只是投入代理指标，不是收入数字。因此，收入模型方向上看得清——向庞大装机基础销售打包加独立软件——但收入质量和规模仍藏在母公司合并报表里。
