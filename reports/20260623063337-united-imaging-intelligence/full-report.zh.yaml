      - number: '2.2'
        title: 规模测算视角与公开 SAM 逻辑的局限
        blocks:
          - type: paragraph
            body: >-
              UII 的核心地域是中国；最干净的窄口径公开视角，是中国医学图像分析软件。Grand View Research 将该市场 2022 年规模估为 USD 422.8M，并预计到 2030 年 CAGR 约
              24.9%。这是最直接相关的分析师品类，但相对于 UII 自称覆盖 4,000 多家机构而言，该口径既小又旧，意味着 2022 年后市场可能快速增长，或 UII 捕获的份额已超出这个窄定义。


              更宽口径的市场大得多，但也更松。中国整体医疗 AI 市场 2023 年约 USD 1.59B，按一家机构数字，预计 2028 年达到 USD 7.33B（CAGR 约 42%），2030 年达到 USD
              18.88B；另一家机构预计中国医疗 AI 2025 年为 USD 2.67B，到 2035 年升至 USD 84.11B。这些数字圈出了 UII
              的相邻上行空间——临床决策支持、报告、医院运营——但它们把药物发现、远程医疗和非影像分析也纳入其中，因此高估了 UII 今天可触达的收入。专门的中国放射 AI 平台市场如今被作为 2026
              年快速增长细分市场单独跟踪，是最接近 UII 实际服务市场的代理指标。


              诚实的尽调结论是：已审阅的公开来源没有给出干净的 UII 专属 SAM 或 SOM，无法把其付费医院收入机会与相邻池子拆开；中国估算本身在不同出版方之间也相差一个数量级。软件和解决方案，而非硬件，是中国医疗 AI
              支出的主导且最快增长板块；政府投资也支撑该品类，例如 2018 年宣布的 USD 2.1B 北京 AI 产业园。北美在 2025 年仍持有最大区域份额（约 44–45%），亚太则是增长最快区域，因此 UII
              位于最高增长地域，但不是最大收入地域。
