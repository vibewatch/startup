      - number: '3.2'
        title: 能力、定价和分销对比
        blocks:
          - type: paragraph
            body: >-
              从监管和清除规模看，平台型既有厂商大幅领先。FDA 2026 年 Q1 名单显示，GE HealthCare 以 130 项放射 AI 授权排名第一，其后是 Siemens
              Healthineers（95）、Philips（58）和 Canon（48）；United Imaging 以 40 项排名第五，领先 Aidoc（33）。全球纯软件公司中，Aidoc 2026 年 4
              月完成由 Goldman Sachs 领投的 USD 150M Series E，累计融资超过 USD 500M，并运营 aiOS 企业平台和 CARE 临床基础模型；后者获得首个综合基础模型分诊系统 FDA
              清除，已部署到近 2,000 家医院，每年分析 6,000 多万例病例。Viz.ai 已融资约 USD 252M，估值 USD 1.2B，覆盖约 1,600–2,000 家医院，并在 CMS
              报销的大血管闭塞卒中检测上领先。Annalise.ai 现为 Harrison.AI 子公司，以宽度差异化，单个工具覆盖 124 多项胸部 X-ray 发现和 130 多项 CT 脑部发现。


              资本和变现图景暴露了 UII 的竞争缺口。分析师评论指出，资本正转向具备规模、监管深度和工作流所有权的企业基础设施 AI 厂商，而不是单一用途工具；仅 Aidoc 一家的累计融资就已超过 UII 约 USD
              139M Series A 的三倍。在美国，CMS 报销——包括 2026 年用于冠状动脉和主动脉钙化分析的新计费代码——是主要商业驱动，Viz.ai 已获 CMS 报销且盈利；中国没有同等全国 AI
              报销，因此美国纯软件公司能跑 SaaS 订阅模式，中国厂商大多不能。


              中国定价不透明：多数厂商通过医院采购销售，或把 AI 与设备打包，而不是公布每次检查价格。UII 的差异化在于垂直整合——AI 嵌入 UIH 扫描仪和 PACS，再叠加宽广的 uAI 组合；但相对 Aidoc 和
              Viz.ai，其限制在于离开自家硬件之后，企业级全院软件集成叙事不够开放，也不够灵活。
