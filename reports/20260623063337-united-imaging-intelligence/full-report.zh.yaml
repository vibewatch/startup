        - 经营亏损持续，类似 Airdoc 等上市同业
        - 高端倍数逻辑会塌向公开影像 AI 区间。
        - 按 2x-5x 收入可比重新切估值。
      - - 地缘政治出口天花板变硬
        - BIOSECURE 式限制或 FDA 行动阻断美国及盟友销售
        - 国际上行空间和出口驱动的乐观情景都会消失。
        - 下调乐观概率，并扩大下行情景。
      - - 母公司依赖转为不利
        - UIH 重新分配资本、重组 UII，或关联方条款变化
        - 头条估值不再代表可独立投资的经济性。
        - 暂停，直到独立治理和经济性清晰。
      - - 许可无法转化为付费使用
        - NMPA Class III 审批停留为无报销的成本中心
        - 监管护城河会变成费用，而不是耐久收入。
        - 将护城河主张视为未证实，并相应折价。
    notes: 这些触发条件刻意绑定估值传导，而不是宽泛经营风险。
    claimRefs:
      - CV015
      - CV022
      - CV031
      - CV034
      - CV035
      - CV038
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 责任方或尽调路径
    rows:
      - - 独立收入与 ARR 桥接
        - UII 单独口径确认收入、经常性占比、增长，以及母公司相关收入拆分。
        - 价格对目前未披露的分母极其敏感。
        - 财务尽调、管理层认证收入桥接，以及母公司剥离明细。
      - - 毛利率与变现模型
        - 单应用定价、捆绑与付费组合，以及扣除算力和支持后的毛利率。
        - 只有 AI 软件经济性真正有吸引力，高端倍数才站得住。
        - 财务和产品尽调，叠加定价兑现分析。
      - - 留存与部署深度
        - 付费机构数量、使用深度，以及 4,000 多家覆盖中的续约或流失。
        - 只有客户名单广度、没有深度，撑不起耐久溢价。
        - 客户访谈和部署遥测审查。
      - - 母公司依赖与关联方条款
        - UII 与 UIH 之间的分销、IP、算力和定价条款。
        - 经济现实可能与头条私募标记大幅偏离。
        - 法律顾问审查关联方协议和股权结构表。
      - - 地缘政治出口敞口
        - 依赖美国及盟友市场的项目管线占比，并暴露于 BIOSECURE 和 FDA 风险。
        - 出口限制可能拿掉乐观情景的一条核心支柱。
        - 监管与贸易法律顾问做情景分析。
    notes: 如果这些问题不能清楚回答，正确姿态是耐心等待，而不是基于战略叙事激进接价。
    claimRefs:
      - CV015
      - CV031
      - CV032
      - CV034
      - CV035
      - CV038
