      - number: '7.3'
        title: 运营、质量与技术风险
        blocks:
          - type: paragraph
            body: >-
              UII 的运营和技术风险集中在临床安全、模型可靠性，以及嵌入医院影像工作流的软件安全。uAI
              应用会影响分诊、检测、分割和报告；一旦出现假阴性，或模型无法从训练数据泛化到新医院的扫描仪、协议或患者组合，就可能造成临床伤害并引发监管行动。NMPA
              变更控制规则意味着，修复或更新已部署模型本身也是受治理、证据负担重的流程，而不是静默补丁。RSNA 2025 和 ECR 2026
              展示的最新自主智能体把风险抬得更高，因为自主性越高，基准表现与可追责真实世界临床行为之间的距离越大；具名站点的独立生产级验证仍有限。


              网络安全和数据处理是第二条运营轴线。系统一旦集成进医院 PACS/RIS，某些情况下还原生嵌入 UIH 扫描仪，就会形成攻击面，也带来 PIPL 和《数据安全法》下的患者数据保护义务；UII
              对安全架构、控制措施或事件历史公开披露很少，因此韧性必须验证，不能假设。供应链和制造风险主要落在母公司 UIH 硬件业务上，但会通过捆绑部署，以及任何组件或出口限制传导到 UII。诚实判断是，UII
              的质量和许可广度是真实缓释因素，但使用层面的可靠性数据、安全披露和上市后监测证据并不公开，必须取得；一旦确认临床事件或召回，就是清晰的论点击穿触发器。
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
