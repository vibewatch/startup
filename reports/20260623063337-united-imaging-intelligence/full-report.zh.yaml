      - number: '5.5'
        title: 信任、安全、安保与合规
        blocks:
          - type: paragraph
            body: >-
              UII 的质量与合规底座来自监管准入。uAI Easy Triage ICH（K242292）在 2024 年 9 月获得 FDA 510(k) Class II 许可，可在非增强头部 CT
              上分诊疑似颅内出血；uAI Portal（K240411）也已获 FDA 许可，用于 AI 驱动的血管 CT 分割；uAI EasyTriage-Rib 和 DeepRecon MR
              重建工具继续扩充已获批产品组合。到 2025 年中，UII 称约有 15 项 FDA 许可、31 项 CE 认证、13 项 NMPA Class III 批准，其中 NMPA Class III
              是中国最高风险器械类别，需要严格临床评价。FDA 申报由专业监管伙伴 MCRA 支持，说明公司进入美国市场所需的质量体系已经有一定成熟度。


              透明度上，UII 比多数同行走得更远：公开发布开放基准
              MedVidBench，并提供第三方评估排行榜。但公开记录里仍有三个信任缺口。最新自主智能体的独立第三方临床验证证据仍有限。公司很少披露平台的数据隐私架构、安全控制，以及符合 PIPL
              的数据处理细节。从开源基础模型走向付费、受治理的医院产品，商业化路径也尚未完整说明。综合看，监管许可和基准透明度很强，但独立验证、隐私 /
              安全披露、开源到收入的桥梁更薄；这些是基础模型泛化到真实临床场景之外的主要产品技术风险。
