  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 的风险面，不太像一家初创公司的脆弱性，更像一家依附上市影像母公司的中国医疗 AI
              公司所处的政策与结构环境。按剩余严重性排序，最高层是外部风险，且大多不受管理层控制：美国针对中国生物技术和影像采购的国家安全限制、中国 NMPA 对高风险 AI 软件的审批复杂性，以及 PIPL
              和《数据安全法》下的健康数据隐私与本地化规则。第二层是对母公司 United Imaging
              Healthcare（UIH）的结构性依赖，分销、资本、品牌和装机基础都集中在单一交易对手身上。第三层是运营和技术风险——临床 AI
              安全、模型泛化、召回、医院部署系统的网络安全。第四层是财务模型和执行风险，母公司实力会压低这一风险，但独立经济数据未披露又把风险抬高。


              这里的严重性综合了发生概率、影响和缓释成熟度。监管和地缘政治风险影响高、发生概率上升、公司侧缓释能力低，因为 UII 不能绕开 BIOSECURE Act 或改写 NMPA
              证据要求，只能适应。依赖风险影响高，但母公司的财务健康和一致激励能部分缓释。运营风险为中等，监管许可和质量体系是部分缓释因素。克制的读法是，UII
              的主要威胁是外生且缓慢移动，而非急性风险，因此可以监测：下方每项顶层风险都带有可度量的论点击穿触发器；诉讼敞口、安全事件、收入集中等未确认事项，会以明确尽调路径标出，而不是默认良性。
