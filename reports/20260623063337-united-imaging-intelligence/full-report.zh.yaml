      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管敞口是 UII 的定义性风险，而且双向延伸。在中国，NMPA 将高风险诊断和决策支持 AI 归为 Class
              III——最高风险级别——要求用本地代表性数据做强制临床评价、证明统计稳健性，为会演进或自我修改的算法预先设定变更控制，并在任何用于训练或验证的患者数据上遵守 PIPL、《数据安全法》和《网络安全法》。NMPA
              的 2025–2026 年标准项目和高端器械指导，继续把门槛推向国际接轨，同时保留中国特有的临床和网络安全要求。因此，每个新 uAI
              应用、每次模型更新，都是一个新的监管项目，而不是一次性许可。健康数据本地化和跨境传输安全评估，也进一步限制 UII 如何用多站点数据训练模型，或从中国基础设施服务海外客户。


              在美国和盟友市场前沿，法律风险正在升级。BIOSECURE Act 已于 2025 年 12 月 18 日作为 FY2026 NDAA 第 851
              节成为法律，限制联邦机构以及与联邦相关的承包商和受资助方，从被列为「受关注生物技术公司」的主体采购「生物技术设备或服务」；OMB 名单应在 2026 年 12 月前发布，而国防部第 1260H
              条「中国军事公司」指定已在 2026 年扩展。即便 UII 或 UIH 尚未被具体指定，寒蝉效应叠加 FDA 对中国来源器械的供应链和网络安全审查，也可能拖慢联邦资助美国医院的采购。公开记录中没有发现直接点名
              UII 的 IP 诉讼，但 medtech 本就诉讼密集，放射 AI 的专利 / NPE 活动正在上升；因此没有披露案件是尽调缺口，不是健康证明。
