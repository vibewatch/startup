      - number: '8.2'
        title: 可比公司纪律与母公司锚点
        blocks:
          - type: paragraph
            body: >-
              私募估值缺少分母时，上市可比公司是必要的纪律工具。最接近的规模化参照是母公司本身：United Imaging Healthcare 在 2026 年中市值接近人民币 850 亿元，约为收入的六倍；2025
              年收入约人民币 138 亿元，净利润接近人民币 18.7 亿元。这是硬件主导的倍数，不是纯软件 AI 倍数，但能给预期设边界。影像 AI 同行中，中国上市公司 Airdoc 的企业价值 / 收入约为 1.8
              倍，且仍在亏损；更广泛的中国影像 AI 同行聚集在低个位数收入倍数。对照美国上市 Tempus 约 7.1 倍、Viz.ai 2022 年 12 亿美元估值等私募参照，United Imaging
              Intelligence 的 14 亿美元位于同业高端。信号不是 UII 已被高估，而是其估值已经嵌入相对公开影像 AI 经济模型更高的战略和国资背书溢价。
