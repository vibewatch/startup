      - number: '8.5'
        title: 下一步必须证明什么
        blocks:
          - type: paragraph
            body: >-
              决定性尽调路径很直接。投资者需要 United Imaging Intelligence 的独立收入，至少需要管理层认证的收入桥；需要经常性与项目型收入拆分、扣除算力和支持后的毛利率、4,000
              多家机构足迹中的留存和使用深度，以及与母公司的关联交易条款。公开证据足以说明 UII 在临床和战略上重要；但不足以说明新投资者应在没有这些材料时接受 14
              亿美元估值。地缘政治敞口还增加了第二道门槛：必须量化依赖美国和盟友市场的管线占比，并对照 BIOSECURE 式和 FDA
              风险，因为出口限制可能拿掉牛市情景的一条核心支柱。在这些输入到位之前，本章信息很简单：保持兴趣，把公司留在积极尽调中，但让它自己挣来溢价，而不是把战略欣赏自动转化成价格接受。
