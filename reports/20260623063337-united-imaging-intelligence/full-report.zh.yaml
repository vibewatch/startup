  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 服务医院和医疗系统，主要买方是放射科和医院 IT，使用者是放射科医生和临床医生，付款方则是医院本身，因为中国没有面向独立诊断 AI
              软件的全国医保支付项目。客户基础沿三条可见轴线分层。按地域，核心市场是中国公立医院体系，尤其是大型三甲和三级教学医院；海外版图则借母公司 United Imaging
              Healthcare（UIH）渠道进入欧洲、北美、亚洲和南美。按用例，客户采用 uAI 做分诊、病灶检测、分割、结构化放射报告，并越来越多用于胸部 CT、脑 MRI、超声等 AI 智能体。按渠道，UII
              用两种方式触达客户：AI 原生嵌入 UIH 扫描仪和 PACS；以及向可能运行多厂商设备的医院授权独立 uAI Clinical Portal（uCP）软件。


              规模信号是真实的。UII 称其 12 个平台、100 多个应用已部署到 4,000 多家医疗机构；母公司称装机基础覆盖 100 多个国家和地区，到 2025 年底美国累计系统超过 640 套。中国国家医疗体系在
              2025–2026 年把 AI 辅助诊断推入 1,200 多家三甲医院，正是 UII 瞄准的池子。但公开披露把机构数、部署应用数和硬件账户混在一起，因此外部无法拆出付费 UII
              软件客户数量，也无法区分这些医院只是拥有带嵌入式 AI 的 UIH 扫描仪，还是单独购买了软件。
