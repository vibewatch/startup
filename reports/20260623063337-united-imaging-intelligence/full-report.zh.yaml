      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              UII 的扩张引擎，是锚定母公司渠道的落地再扩张循环：医院先购买带嵌入式 AI 的 UIH 扫描仪，再为更多已获批应用采用 uAI Clinical
              Portal，随后在新智能体和基础模型能力商业化后继续扩展；海外增长则跟随 UIH 快速国际化铺开（母公司 2025 年海外收入增长超过 50%）。这种打法有力，因为硬件关系先筛选了账户，也让 AI
              获客成本低于纯软件对手。


              同一结构在三条线上制造集中度风险。第一，渠道和所有权集中：UII 的分销、品牌和很大一部分装机基础依赖母公司 UIH，因此客户关系只有一部分属于 UII
              自己。第二，地域和客群集中在中国三级医院市场；该市场受带量采购和预算压力挤压价格，AI
              软件又没有全国医保支付项目。第三，增长前沿的地缘政治集中风险：美国和欧洲扩张面对已有记录的信任、供应链安全、数据隐私和中美贸易紧张阻力，这些阻力可能拖慢或阻断采购，恰好发生在 UII
              最想拿下的学术账户。公开披露没有量化前几大客户收入集中度，因此单账户或单渠道依赖的幅度仍是重大开放尽调项，而不是已测量数字。
