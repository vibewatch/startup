      - number: '7.4'
        title: 伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              UII 最独特的结构性风险，是对母公司 United Imaging Healthcare 的依赖。UIH 提供把嵌入式 uAI
              带进医院的硬件渠道、很大一部分品牌和全球服务足迹、很大一块装机基础，并通过更大集团提供资本和战略方向。这种集中是一把双刃的缓释工具：母公司 2025 年人民币 138.0
              亿元收入和强资产负债表，降低了融资和分销风险；但也意味着 UII 的客户关系、定价权，甚至监管命运，都只有一部分掌握在自己手里。UIH 一旦遭遇冲击——1260H
              列名、出口限制、带量采购下需求下滑——会直接传导到子公司。国资相关所有权和投资者又增加了双向政治对齐风险：在中国有本土偏好，在美国则引发更高疑虑。


              母公司之外，依赖风险还包括：少数基础模型和 uAI Clinical Portal 作为价值交付的单一平台；中国带量采购压低医院采购预算；下一轮融资对资本提供方的依赖。UII
              没有披露前几大账户收入拆分，客户集中度幅度未知，因此单账户或单渠道依赖是重大开放项。下方依赖地图和登记表把每个关键交易对手——母公司、监管机构、重点医院、资本提供方、平台组件——对应到失败场景、严重性评级和尽调路径；失去母公司支持或被美国正式指定，是最清晰的依赖论点击穿点。
