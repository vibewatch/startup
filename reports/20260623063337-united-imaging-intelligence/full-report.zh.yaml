      - number: '4.4'
        title: 资本充足性和融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本获取能力是 UII 公开财务图景中最强的一块。公司在 2025 年 6 月完成约 RMB 1B（约 USD 139M）Series A，由 E Fund Management 和 Shanghai
              Guotou（SIG）共同领投，Shanghai United Investment 等参与。该轮隐含投前估值约 RMB 9B（约 USD 1.3B），投后约 USD 1.4B。管理层称资金将用于大型医疗 AI
              模型研发、覆盖影像、文本和语音的多模态医疗 agent，以及医院数字化和智能化业务系统；UII 也据称正在考虑独立上市。


              资产负债表图景在承销真正需要开始的地方戛然而止。UII 不披露现金余额、月度烧钱或
              runway，也没有记录到公开债务或项目融资义务。融资时间线已在公司概览章节覆盖；出于财务分析目的，相关事实在此作为有独立来源的本地论断重述。相对全球同行，这轮融资规模不大——仅 Aidoc 的累计融资就超过
              UII Series A 的三倍——但 2026 年中国资本环境支持融资，母公司也提供深厚资产负债表和渠道。对 UIH 的财务依赖（共享研发、合并报表和硬件销售渠道）既是 UII
              最大资产，也是集中度风险，因为独立投资人无法把 UII 的偿付能力从母公司中剥离出来。
