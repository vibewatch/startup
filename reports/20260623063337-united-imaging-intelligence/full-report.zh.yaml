      - number: '4.5'
        title: 财务结论和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              最可支撑的承销观点是：UII 资本获取能力强、母公司有力，但作为独立实体还无法干净承销。积极面真实存在：以约 USD 1.4B 估值完成 USD 139M Series A，部署基础超过 4,000
              家机构，FDA 清除数位居全球前五，母公司 2025 年经审计收入 RMB 13.80B、利润 RMB 1.87B。公开财务信号中最强的是 Series A 与母公司经审计增长的组合，而不是 UII
              自身财报——后者并未公开存在。


              风险同样具体。主要尽调阻断项，是未披露的独立收入、毛利率、烧钱速度、runway 和留存。同行证据具有警示意义：Airdoc 2025 年年报警告，即便获得 NMPA 三类批准，商业化仍存在风险；分析师预计其要到
              2026 年左右、在约 102% 收入增长基础上才能盈亏平衡——这提醒投资人，中国医疗 AI
              变现很难，且缺少报销支持。净判断是：对资本获取和母公司实力信心高，对部署规模信心中等，对独立单位经济和偿付能力信心低。任何投资论证都应把独立收入质量、利润率路径和母公司依赖结构列为一阶尽调事项，而不是收尾问题。
