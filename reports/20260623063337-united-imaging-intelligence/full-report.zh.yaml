      - number: '6.2'
        title: 采用轨迹与部署深度
        blocks:
          - type: paragraph
            body: >-
              UII 的采用故事更像真实生产部署，而不是试点阶段实验；但支撑指标大多描述平台广度或母公司硬件足迹，并非离散的 UII 软件账户。uAI Clinical Portal 在单一工作界面整合 60 多个应用；到
              2025 年中，UII 称约有 13 项 NMPA Class III 批准、15 项 FDA 许可、31 项 CE 认证，并在 ECR 2026 展示 30 个 CE
              认证应用。这种监管广度说明产品已获准在多个司法辖区用于常规临床。第三方对中国医院 AI 的报道提到，放射报告工作流改善约 30%；UII 也指向覆盖数千病例的多中心验证。


              但部署漏斗混用了无法拼成清晰转化图的单位。最上层是至少运行一个 uAI 应用的数千家机构；下面是 UIH 在 100 多个国家的硬件账户；再下面是更少的、具名且可公开引用的医院部署；底部则是 RSNA 2025
              和 ECR 2026 展示、仍在成形的 AI 智能体，其独立生产级验证仍有限。UII 没有披露单应用使用量、活跃使用率、复购或续约数量，也没有给出能把「4,000
              家机构」换算成席位、阅片量或经常性收入的分母。轨迹向上且覆盖面广，但深度和耐久性只能推断，尚未被计量。
