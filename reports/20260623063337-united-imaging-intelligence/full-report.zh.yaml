      - number: '5.2'
        title: 架构与基础模型运营模式
        blocks:
          - type: paragraph
            body: >-
              UII 产品由多模态医疗大模型驱动，整合临床语言、视觉和语音。架构可追溯到 RSNA 2024 发布的 uAI PLUS（Pretrained Large Models for Unified
              Solutions），它结合医学影像基础模型、医疗 LLM 和多模态 LLM；更新的则是 uAI NEXUS 套件。2026 年 4 月，UII 开源 uAI NEXUS
              MedVLM，被描述为首个开源医学视频大语言模型，并被 CVPR 2026 接收，显示其研究深度获得全球计算机视觉社区认可。


              技术核心记录在一篇公开研究论文中（arXiv:2512.06581）。MedVLM 建立在 MedVidBench 之上；MedVidBench 是一个包含 531,850
              个视频指令对的基准，横跨八类临床来源。训练流程先做监督微调，再接 MedGRPO——一种强化学习框架，引入跨数据集奖励归一化和医疗 LLM 裁判，以防训练崩塌。尽管只使用 4B 和 7B 参数，该模型优于
              GPT-5.4 和 Gemini 3.1 等更大的通用模型；在手术安全评估上准确率达到 89.4%，而 GPT-5.4 为 1.8%。UII 在
              GitHub（UII-AI/MedGRPO-Code）发布开源代码、模型权重、MedVidBench 数据集和公开排行榜。生产环境中，同一模型谱系支撑的应用会整合 DICOM 摄取、AI 分析、结构化报告和
              PACS/RIS 连接，而不是作为孤立点工具运行。
