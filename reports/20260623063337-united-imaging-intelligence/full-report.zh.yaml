      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              UII 的领导层以 Xiang "Sean" Zhou 为核心；公司和第三方资料均将其列为联合创始人、（联席）CEO 及公司法定代表人。Zhou 长期研究医学影像和机器学习，也是公司在行业论坛上的公开面孔，包括
              2025 年 World Artificial Intelligence Conference（WAIC），他在会上阐述了多模态 agent 战略。Dijia Wu
              被列为首席技术官，资料数据库还显示公司有一支深厚的研究副总裁团队，包括 Feng Shi、Yaozong Gao 和 Shanhui Sun。公司强调其全球化招募的 AI
              研究团队分布在上海、北京、武汉，以及位于马萨诸塞州 Burlington 的波士顿地区子公司 UII America, Inc.。


              治理由母公司关系主导。United Imaging Healthcare 既是公司母公司，也是 Series A 的持续投资方，意味着 UIH 创始人 Xue Min 所在集团拥有实质控制权，AI
              子公司的战略与上市母公司紧密绑定。这种绑定是一把双刃剑：UII 因此获得影像数据、硬件分销渠道和品牌信任的优先入口，但也集中了承担关键人物和关键股东风险，并让独立治理叙事更复杂。


              公开信息没有披露董事会构成、Series A 后股权表，以及 UII 与 UIH 之间经济利益的精确划分。36Kr 在 2025 年报道称 UII
              正在考虑独立上市；若推进，治理和财务披露会被迫更充分。在此之前，对董事席位、投资人权利和与母公司的关联交易条款做尽调，主要仍依赖私有材料。研究团队深度是真实优势，但治理不透明和母公司控制，是身份图景中最清楚的开放问题。
