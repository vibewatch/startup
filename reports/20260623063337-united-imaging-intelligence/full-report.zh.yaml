      - number: '8.4'
        title: 估值基准及其含义
        blocks:
          - type: paragraph
            body: >-
              外部倍数基准有助于判断 United Imaging Intelligence 的估值有多激进。进入 2026 年，HealthTech 并购估值大多在中个位数收入倍数、低双位数 EBITDA 附近成交；优质
              AI 和数据平台则能高于这一带。AI 初创顾问工作提到的分布更宽，最强平台型公司可达到未来收入的 10 至 50 倍。香港市场上，Chapter 18A 的未盈利 biotech 和医疗 AI
              上市公司，在短期收入可预测时估值接近未来收入 15 至 30 倍，差异化平台则更高。如果 UII 的独立收入规模不大但增长快、且具备软件利润率，United Imaging Intelligence
              也许能证明双位数收入倍数合理，从而让 14 亿美元估值落在高端私募区间之内，而非之外。决定性未知仍是分母：同一个标价是否合理或偏贵，完全取决于公司尚未披露的收入数字。
            claimRefs:
              - CV007
