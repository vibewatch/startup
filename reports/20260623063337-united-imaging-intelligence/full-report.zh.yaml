      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自政策和劳动力。中国国家 AI 战略和数字健康任务推动医院采用 AI，放射科医生短缺则让自动分诊和量化在经济上说得通。监管方面，NMPA 根据临床风险，将 AI
              诊断软件作为二类或三类医疗器械监管；其创新医疗器械特别审查程序为开创性 AI 提供加速审批路径，UII 已借此累积三类证。2026 年，NMPA 发布更新后的 AI 分类指导，并提出覆盖 AI 和影像的 80
              多项行业标准计划；第 52 号公告（2026）则规范了产品如何重新分类，例如从二类转为三类。这些举措增加清晰度，也抬高了新进入者需要提交的证据和成本门槛。


              约束同样具体，并会压在估值上。第一，报销：中国 DRG 医院支付体系通常不单独报销 AI
              影像软件，成本由医院预算吸收；报销不成熟叠加临床验证门槛高，使许多已获批产品卡在试点，难以放大为付费部署。第二，数据治理：根据中国 PIPL，医疗健康数据属于敏感个人信息，需要单独同意和数据本地化；2026 年
              1 月 1 日生效的跨境数据传输认证措施，也给任何把数据移出境外的厂商增加合规负担。第三，市场估算宽且互相矛盾，投资人无法用单一可信 TAM 锚定 UII 估值。


              从估值看，市场背景是双刃剑。UII 位于最高增长地域和最大需求应用领域，拥有特权母公司渠道和可信的创新器械监管路径——这些都支撑其约 USD 1.4B
              估值。但缺少报销项目、规模来源相差一个数量级、三类审批负担和数据治理成本，正是把巨大理论市场与真实付费收入隔开的摩擦。市场真实且快速增长；尽调要证明的是，UII 能把部署转化为可报销或已纳入预算的经常性收入。
