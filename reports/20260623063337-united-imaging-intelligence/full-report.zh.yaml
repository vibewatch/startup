      - number: '6.3'
        title: 具名客户证明与引用质量
        blocks:
          - type: paragraph
            body: >-
              具名且可外部核验的客户，是检验采用情况的最强证据；在这一点上，UII 的证据并不均匀。最清晰的公开引用是 UC Davis Health，其放射设备清单显示一套 United Imaging 1.5T uMR
              680 MRI 系统已在生产中使用——这是客户侧独立披露，不是厂商案例。行业报道还点名 UIH 在意大利（包括一台 uCT 960+）、法国、德国、立陶宛的装机；旗舰 uMR Omega 3T 超宽孔系统也已进入
              X-Ray Associates of New Mexico 等美国影像服务机构。在中国，复旦大学附属中山医院等领先学术中心被提及为 uAI 用户。ECR 2026 上，UII 展示了其 30 个 CE
              认证应用在欧洲、亚洲、北美、南美的多中心验证。


              尽调中有两个限定条件很关键。第一，大多数具名证明挂在 UIH 硬件账户上；披露很少单独说明哪些站点把 uAI 软件作为独立项目付费，因此硬件引用不能自动等同于软件收入引用。第二，最新自主 AI 智能体——RSNA
              2025 和 ECR 2026
              展示的报告撰写、超声机器人、图像到报告智能体——已在研究环境中演示和验证，但缺少具名站点的独立生产级结果证据。因此，证明矩阵应把已获批影像应用评为成熟度高、佐证扎实；智能体层的雄心很高，但独立留存和结果可见度偏低。
