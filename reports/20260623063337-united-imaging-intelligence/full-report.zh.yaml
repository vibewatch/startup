chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 将自己定位为一家国际化医疗 AI
              公司，构建覆盖完整临床路径的人工智能软件，从筛查、诊断延伸到治疗和随访。其中国法律主体为上海联影智能科技股份有限公司，总部位于上海市徐汇区云锦路 701 号。公司是 United Imaging
              Healthcare Technology Group（UIH）旗下专门的 AI 子公司；UIH 是上海证券交易所科创板上市的医学影像硬件制造商（688271.SH）。UII 以「uAI」品牌销售软件，覆盖
              CT、MR、PET/CT、X-ray 和超声等模态。


              对一家私营医疗 AI 公司而言，UII 的产品面异常宽。到 2025 年中，管理层称公司已有 12 个产品平台、100 多个 AI 应用，并围绕 uAI Clinical
              Portal（uCP）组织，把疾病检测、量化和报告应用打包进医院工作流。2025 年，UII 将叙事重心转向名为「Yuanzhi」（元智）的多模态医疗基础模型，以及由图像、语言、语音和视频模型组成的 uAI
              NEXUS 套件，从单病种检测器转向多病种「agent」产品，例如一次胸部 CT 扫描可筛查 73 项胸部发现的 agent。


              商业模式是向医疗机构销售软件，并高度借力母公司已安装的影像设备基础。UII 称其 AI 产品已进入中国 4,000 多家医疗机构，软件既作为嵌入式智能运行在 UIH 扫描仪上，也可运行在第三方硬件上。公司称约
              80% 员工为研发人员，更像一家软件和模型公司，而非设备制造商。公开信息仍缺少独立收入、利润率和定价，投资人无法脱离 UIH 单独承销这门生意。
