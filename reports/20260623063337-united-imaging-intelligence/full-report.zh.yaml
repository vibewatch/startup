    title: 正方 / 反方论点表
    columns:
      - 论点
      - 正方
      - 什么会改变判断
    rows:
      - - 战略背书
        - 国家相关锚定方易方达和上海国投，加上上市母公司 UIH，给了少见的融资耐久度和政策同向性。
        - 如果母公司支持或国家资本胃口降温，融资与需求顺风都会减弱。
      - - 落地证明
        - AI 工具覆盖 4,000 多家机构，并拥有约十三项 NMPA Class III 许可，证明临床拉动真实存在。
        - 如果已安装部署很浅、靠捆绑免费铺开，或变现很低，平台叙事会变薄。
      - - 监管护城河
        - 大量 NMPA Class III 加上 CE 和 FDA 许可，抬高了相对许可更薄竞争者的门槛。
        - 如果审批无法转化为付费、可报销使用，护城河就是监管成本，而不是收入。
      - - 估值支撑
        - 如果独立收入已在 $100M-$200M 区间且具备软件毛利率，$1.4B 标记可以说得通。
        - 如果收入低得多，或毛利率很薄，相比上市影像 AI 可比公司，价格会显得很贵。
      - - 变现现实
        - 母公司 UIH 的设备带动效应，可能让 UII 把 AI 作为附加软件层变现。
        - 如果中国医院对 AI 的支付意愿像同业亏损所暗示的那样持续偏弱，变现就会滑坡。
