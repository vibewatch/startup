      - number: '8.3'
        title: 情景、上行与下行
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 的牛市情景是连贯的。如果 AI 能作为高毛利软件附着在母公司扩张中的装机基础上变现，如果出口能在欧洲和盟友市场放量，如果到 2028 年独立收入已在 2
              亿至 3.5 亿美元区间，8 至 12 倍收入倍数可以支撑 20 亿至 40 亿美元价值。基准情景更窄：UII 随母公司增长，把许可转化为适度付费使用，使当前估值只算勉强可辩护，约为 6 至 9
              倍收入。熊市情景也可信，因为这里的估值对缺失分母高度敏感。如果中国医院 AI 付费意愿仍弱，正如上市同行亏损所暗示；如果地缘政治通过 BIOSECURE 式限制封顶出口；或如果收入远低于估计，那么上市影像 AI
              约 2 至 5 倍收入区间就会成为相关锚点，下行会迅速扩大。在 14 亿美元估值上，投资者已经提前折现了相当多好消息，给变现失望留下的空间很小。
