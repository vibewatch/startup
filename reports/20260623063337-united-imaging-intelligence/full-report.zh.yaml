        title: 成本结构、利润率和资本强度
        blocks:
          - type: paragraph
            body: >-
              UII 业绩并入母公司 UIH，未单独报告，因此公开数据无法判断其独立毛利率——这是结构性限制，不是临时缺口。母公司的审计数字仍能勾勒 UII 所贡献的经济背景。UIH 报告 2025 年收入 RMB
              13.80B，同比增长 33.98%；归母净利润 RMB 1.87B，同比增长 48.14%。2025 年半年报显示收入 RMB 6.02B（增长 12.79%），归母净利润 RMB 998M，海外收入 RMB
              1.14B，服务收入 RMB 0.82B。


              研发强度是资本强度最清晰的信号：UIH 2025 年投入 RMB 2.62B 研发（增长 15.95%），约占收入 19%；上半年单独投入 RMB 1.14B，其中相当部分投向 UII 参与构建的 AI
              和平台技术。利润率面临国内逆风：中国集中带量采购（VBP）对影像设备形成降价压力，母公司通过高端产品和快速增长的海外组合来对冲。2026 年一季度业绩——收入 RMB 2.91B（增长 17.34%），净利润
              RMB 0.40B（增长 7.78%）——显示利润增速慢于 2025 全年。关键在于，AI 诊断软件通常不在中国医保或 DRG 体系下报销，因此厂商以较低费用直接与医院签约；Ping An
              等盈利同行，主要靠生态交叉销售变现，而不是独立影像 AI 定价。
