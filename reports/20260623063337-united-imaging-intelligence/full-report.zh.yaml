      - number: '6.4'
        title: 留存、耐久性与切换成本
        blocks:
          - type: paragraph
            body: >-
              耐久性上，UII 有很强的结构性论据，却几乎没有披露数据。结构性逻辑在于，uAI 常常原生嵌入 UIH 扫描仪，并集成进医院 PACS/RIS，从而抬高切换成本：替换 AI
              通常意味着打断影像工作流或底层硬件关系；uAI Clinical Portal 又整合 60
              多个应用，医院一旦标准化使用，就会积累培训和集成锁定。监管广度也强化粘性，因为医院在临床路径中验证过已获批应用后，通常不会无故重新验证竞品。这些都是深度集成临床基础设施常见的真实留存顺风。


              数据层面基本是空的。UII 不发布净收入留存、毛留存、流失率、续约率、合同期限或客户满意度分数，也没有公开队列展示随时间的重复使用。多数采用与硬件捆绑，连母公司文件也暴露不出 AI
              软件续约行为。诚实的判断是，耐久性在机制上可信，但指标上未被证明；每一项留存主张都应转化为带明确尽调问题的空值：在 NDA 下索取按医院层级拆分的
              NRR/GRR、应用级活跃使用和续约队列、合同条款、流失原因。Airdoc 等亏损上市同行说明，广泛临床采用并不保证收入耐久且有利润。
            claimRefs:
              - CU029
              - CU030
              - CU031
              - CU032
