  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              基于今天的公开证据，United Imaging Intelligence 的正确姿态是继续研究（research-more），不是回避，也不是买入。战略和临床故事很强：2025 年 6 月 Series A
              融资约 1.39 亿美元，投后估值接近 14 亿美元，由易方达、上海国资投资方和上市母公司 United Imaging Healthcare 锚定。部署真实存在，覆盖 4,000 多家机构，监管堆栈也很深，拥有
              NMPA Class III、CE 和 FDA 许可。问题在价格纪律。United Imaging Intelligence 没有披露独立收入、毛利率或留存，因此 14
              亿美元估值隐含的倍数，从公开证据看根本无法得知。这迫使承销判断依赖战略叙事，而不是分母。建议谨慎，是因为核心未解问题是估值支撑，而不是临床相关性；举证责任现在完全落在尽调上。
