      - number: '7.5'
        title: 财务、执行风险、缓释措施与退出标准
        blocks:
          - type: paragraph
            body: >-
              财务模型风险是 UII 主要敞口里最可控的一类，但并非可以忽略。2025 年 6 月 Series A 融资约 1.39 亿美元、估值约 14
              亿美元，加上资金雄厚的上市母公司，使近期急性偿付风险不高。风险在质量和耐久性，而不是生存：UII 没有披露独立收入、毛利率、烧钱速度或 runway；中国没有诊断 AI
              软件的全国医保支付项目；带量采购压缩价格；Airdoc 等亏损上市同行——连续五年净亏损——说明广泛临床采用未必能转化为有利润、可持续的收入。执行和人员风险集中在留住稀缺 AI 与临床监管人才、扩大尚未形成收入的
              AI 智能体商业化，以及管理从开源到付费产品的桥梁；这些都没有公开量化。


              缓释纪律让这些风险变得可投资。每项顶层风险都对应一个可监测指标和论点击穿触发器：UII 或 UIH 被 BIOSECURE/1260H 正式指定，NMPA 执法行动或撤回许可，已报道临床安全事件或召回，母公司
              UIH 财务显著恶化，下一轮融资 down-round
              或停滞，或出现单一客户收入集中超过审慎阈值的证据。下方传导图展示每项风险如何流向收入、客户、利润率、融资和估值；退出标准表把每项风险配上可度量触发器和行动含义。凡证据缺失之处——安全事件、诉讼、合同集中、独立经济数据——本章记录具体尽调问题，而不是凭直觉给出安全感。
