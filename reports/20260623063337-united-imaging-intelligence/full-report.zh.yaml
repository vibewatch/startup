  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 交付的是统一医疗 AI 平台，品牌为 uAI，运行在临床工作流内，而不是作为独立分析工具存在。从客户视角看，平台接收影像检查，运行 AI
              分析，生成结构化诊断报告，支持治疗计划，并把数据送入医院运营仪表盘。UII 称其产品组合包含 12 个产品平台、100 多个 AI 应用，覆盖 CT、MR、X-ray、超声和病理，并通过 uAI Clinical
              Portal（uCP）/ uAI Discover 部署；该门户与医院 PACS 集成，并支持跨模态的 60 多个应用。


              最重要的产品转向，是从窄任务自动化转向能在诊疗路径中理解、推理和行动的协作式「AI agents」。RSNA 2025 上，UII 展示 uAI Insight，一个执行多模态推理和临床关联的影像到报告
              agent；uAI Agent for Chest CT Reporting 可从一次扫描中检测 73 种胸部疾病，AUC 约 95%；Brain MRI agent 可识别 47 种神经系统疾病；uAI
              Agent for Ultrasound 以具身机械臂形态交付；另有 uAI Avatar 助手和医院管理 agent。这些 agent
              定义了平台现在瞄准的用户任务：更快报告、自主采集、患者预诊互动和运营质量监测。
