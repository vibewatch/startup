      - number: '5.4'
        title: 差异化——技术、数据和监管护城河
        blocks:
          - type: paragraph
            body: >-
              UII 最强技术差异化，是在医学视频理解上拥有开源基础模型领导力，并由 CVPR 2026 接收以及公开基准、代码、权重和排行榜验证；这些资产邀请全球开发者社区参与，而这种透明姿态在通常闭源的中国医疗 AI
              厂商中很少见。开放既是可信度和招聘信号，也是在为行业设定评估标准。


              还有三条护城河强化技术领先。第一，与母公司 United Imaging Healthcare 的垂直整合，让 UII 能与扫描仪共同设计 AI——例如 uMR 系统上的 DeepRecon
              图像重建——形成纯软件对手难以复制的软硬件循环。第二，大规模、多样化、来自临床的训练语料，经由医院合作不断精炼，是会随部署复利的数据护城河。第三，横跨 FDA、NMPA 和 CE
              的监管宽度本身就是差异化资产；UII 在 FDA 2026 年 Q1 放射 AI 授权名单上以约 40
              项已清除设备排名第五，优于更窄的竞争者。开放问题在于耐久性：开源旗舰模型会吸引快速跟随，因此护城河更多取决于数据、硬件共同设计和清除宽度，而不是模型保密。
