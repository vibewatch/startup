            body: UII 依赖母公司 UIH 提供分销、品牌、资本和装机基础，这降低融资风险，但意味着 UIH 的任何冲击——1260H 列名、出口限制或需求下滑——都会直接传导到子公司；客户集中度未披露，也让单账户依赖无法计量。
            calloutType: risk
            claimRefs:
