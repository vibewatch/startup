      - number: '5.3'
        title: 部署、集成、可靠性和路线图
        blocks:
          - type: paragraph
            body: >-
              UII 的 AI 已广泛部署：它通过 uAI Clinical Portal 运行在中国 4,000 多家医疗机构，并安装于欧洲、亚洲、北美和南美；该门户集中处理 DICOM 摄取、AI 分析、结构化报告和医院
              IT 集成。这是基础设施式部署——PACS/RIS 集成和结构化报告——而不是研究试点，符合医院要求的可靠性门槛。


              产品路线图可从 UII 的主要会议节奏中看见。RSNA 2025 上，公司以「Agent Radiologist: Are We There Yet?」为主题，展示覆盖报告、超声采集和医院管理的下一代
              agent。ECR 2026 上，公司强调放射 AI 的验证和规模化，引用 60 多个应用和 30 多项 CE 认证，并突出与 Massachusetts General Hospital
              等领先中心进行的多中心、多厂商验证合作。最新里程碑是 2026 年 4 月开源 MedVLM；这与 ECR 2026 的规模化叙事一起，标志着 UII 正从清除驱动的应用厂商，转向基础模型和 agent
              平台。集成宽度和区域支持是优势；不够可见的是最新自主 agent 的独立可靠性和 uptime 数据。
