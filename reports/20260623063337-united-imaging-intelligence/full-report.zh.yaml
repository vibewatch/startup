  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 竞争的是医学影像 AI 市场：这是一类把机器学习用于 CT、MRI、X-ray、超声、PET
              和核医学扫描的软件，服务检测、量化、分诊和报告。这个边界最直接相关：纳入的支出，是医院和影像中心用于诊断 AI 软件、工作流工具及其背后基础模型的预算；排除的支出，是影像硬件本身（母公司 UIH
              的业务）、通用医院 IT 和非影像临床软件。几乎每个 UII 应用的现状替代方案，都是没有 AI 辅助的人类放射科医生阅片；这个替代方案在决策点上不额外收费，才是 AI 必须替代或增强的真正竞争者。


              公开机构对这一品类的测算跨度很大且口径不一。Grand View Research 估计全球 AI 医学影像市场 2025 年约 USD 1.8B，到 2033 年升至 USD 20.2B，CAGR 约
              35%；The Business Research Company 估计 2026 年为 USD 5.29B，到 2030 年达到 USD 20.28B，CAGR 约 39.9%；Coherent Market
              Insights 则仅将 2026 年估为 USD 2.20B。因此，2026 年全球数字大致落在 USD 2.2–5.3B，取决于使用哪家的品类定义；任何单一 TAM 幻灯片都应被打上问号。


              在该品类中，需求按应用和模态集中。神经学是 2025 年收入占比最高的单一应用领域，约 37%；计算机断层扫描是领先模态，约占
              34–42%；肿瘤学则因癌症发病率上升，属于增长最快的应用之一。医院是主导终端用户，占支出超过 60%；全球放射科医生短缺，是把 AI 拉入工作流的最清晰结构性驱动因素。UII 宽广的 uAI 组合——胸部
              CT、神经、肿瘤、心血管等——直接映射到这些最大细分市场。
