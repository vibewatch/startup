    summary: 14 亿美元估值对应的收入倍数，取决于未披露的分母，差异会很大；上市同业给低端区间提供锚点。
    data:
      items:
        - label: 收入 $100M 时的隐含倍数
          value: 14
          detail: 若独立收入约为 $100M，支撑 $1.4B 估值所需的收入倍数。
          tone: negative
        - label: 收入 $140M 时的隐含倍数
          value: 10
          detail: 若收入约等于母公司 UIH 2025 年销售额的十分之一，对应的倍数。
          tone: warning
        - label: 收入 $200M 时的隐含倍数
          value: 7
          detail: 若变现已经较强，对应的倍数大致接近 Tempus。
          tone: neutral
        - label: 收入 $280M 时的隐含倍数
          value: 5
          detail: 若收入规模较大，对应倍数接近上市影像 AI 区间上沿。
          tone: positive
        - label: Tempus EV/revenue 倍数
          value: 7.1
          detail: 2026 年上市高端健康 AI 基准倍数。
          tone: neutral
        - label: Airdoc EV/revenue 倍数
          value: 1.8
          detail: 仍在亏损的中国上市影像 AI 同业倍数。
          tone: negative
    approximationNotes: 条形图把假设收入水平下的隐含所需倍数与上市同业锚点放在一起；由于 UII 未披露收入，这些只是估值纪律工具，不是预测。
    claimRefs:
      - CV003
      - CV016
      - CV018
      - CV019
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开证据，区间横跨当前估值；只有变现和出口规模同时跑通，结果才会落在当前估值之上。
    data:
      items:
        - label: 熊市情形
          low: 150
          mid: 350
          high: 550
          displayValue: $0.15B-$0.55B
          detail: 收入停在 $60M-$110M 附近，上市同业倍数主导估值。
          tone: negative
        - label: 基准情形
          low: 900
          mid: 1300
          high: 1800
          displayValue: $0.9B-$1.8B
          detail: 借助母公司稳步增长，并采用克制的中国软件倍数。
          tone: warning
        - label: 牛市情形
          low: 2000
          mid: 3100
          high: 4200
          displayValue: $2.0B-$4.2B
          detail: 高利润率 AI 附加销售叠加国际出口规模。
          tone: positive
    approximationNotes: 区间是基于公开证据的简单情景输出；收入分母缺失，因此刻意避免给出虚假的 DCF 精度。
    claimRefs:
      - CV003
      - CV015
      - CV031
      - CV034
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: United Imaging Intelligence 在背书和部署上得分较高，但独立经济性可见度和当前价格支撑偏弱。
    data:
      items:
        - label: 市场机会
          score: 8
          detail: 中国医学影像 AI 市场规模大、有政策支持，并保留出口选择权。
          tone: positive
        - label: 部署证明
          score: 8
          detail: 4,000 多家机构和深厚的获批矩阵，证明临床需求真实存在。
          tone: positive
        - label: 战略背书
          score: 9
          detail: 国资相关锚定方和上市母公司，带来少见的融资韧性。
          tone: positive
        - label: 经济性可见度
          score: 2
          detail: 公司未公开披露独立收入、利润率或留存。
          tone: negative
        - label: 变现护城河
          score: 4
          detail: 获批实力强，但同业亏损显示医院为 AI 付费的意愿偏弱。
          tone: warning
        - label: 估值支撑
          score: 4
          detail: 14 亿美元估值建立在未知分母上，已经预设高质量执行。
          tone: warning
        - label: 风险隔离
          score: 3
          detail: 地缘政治出口限制和对母公司的重度依赖，会同时放大上行与下行。
          tone: negative
    approximationNotes: 分数是锚定公开引用证据的 0-10 序数判断，并非公司披露的管理层 KPI。
    claimRefs:
      - CV005
      - CV008
      - CV015
      - CV022
      - CV031
      - CV034
      - CV038
