      - number: '1.4'
        title: 里程碑、监管进展和负面信号
        blocks:
          - type: paragraph
            body: >-
              UII 的里程碑从 2017 年 12 月成立开始，随后快速累积监管清除并发布基础模型。公司在 2020 年凭 COVID-19 胸部 CT 分诊软件获得全国关注，之后取得多张 NMPA 三类证；自 2024
              年起，又获得美国 FDA 510(k) 清除，包括用于颅内出血分诊的 uAI Easy Triage ICH，以及 uAI Portal 后处理平台。按 FDA 2025 年底统计，「United
              Imaging」持有 38 项已清除放射 AI 设备，在所有厂商中排名第五，仅次于 GE HealthCare、Siemens Healthineers、Philips 和 Canon，并领先 Aidoc。


              产品发布动能延续到 2025–2026 年。RSNA 2025 上，UII 发布 uAI Insight 图像到报告 agent 和具身 AI 机械臂超声系统；ECR 2026 上，公司展示 30 多个 CE
              认证应用和 uCP 门户的 60 多个应用；2026 年 4 月，公司开源 uAI NEXUS MedVLM，这是一款被 CVPR 2026 接收的医学视频语言模型。2025 年 6 月 Series
              A，以及报道称公司考虑独立 IPO，共同构成一段推进很快的近期历史。


              负面和怀疑信号主要是结构性问题，而非丑闻驱动。UII 所处的中国医疗 AI 市场拥挤且部分商品化，AI 报销机制仍不成熟，许多已获批产品难以把清除转化为医院付费收入；公司对母公司 UIH
              在数据、渠道和资本上的高度依赖，本身就是集中度风险；中美技术和数据治理摩擦，也会给一家寻求西方市场的中国医疗 AI 厂商带来出口和采购不确定性。市场、财务、风险和估值章节会展开这些主题。
