  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与对手画像
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence 面向一个高度拥挤的市场销售产品：公开追踪器显示，截至 2026 年，中国活跃医学影像 AI
              厂商有数百家，获得充足融资的竞争者也有数十家。竞争集合横跨六层——中国本土直接纯软件公司、生态巨头、平台型设备厂商、全球纯软件公司、现状替代方案和医院内部自建——UII 与每一层都有重叠。


              直接中国同行是最显眼的竞争者。Infervision（Tuixiang）2016 年成立于北京，八轮融资约 USD 213M，聚焦 X-ray 和 CT 诊断。DeepWise（Shenrui）成立于 2017
              年，获 Legend Capital 和 CICC 支持，融资约 USD 115M，专注癌症和卒中放射 AI，并在 2026
              年中国医学装备展发布新的多模态影像平台。Airdoc（Eaglevision，02251.HK）2021 年 11 月在港交所成为中国第一家 AI 医学影像 IPO，估值约 RMB
              5.8B，专攻视网膜筛查，并报告 2025 年收入约 USD 24.1M。Shukun Technology 同样成立于 2017 年，领先于心血管和肿瘤 AI，2026 年正准备由 Goldman
              Sachs、Sequoia 和 Qiming 支持的香港 IPO；Yitu Healthcare 则在 600 多家顶级医院运行癌症筛查和 NLP 诊断。


              纯软件公司之外，是生态巨头和既有厂商。Ping An Smart Healthcare 以一体化金融医疗 AI 套件覆盖 170 多个城市、40,000 多家机构；Tencent
              Miying（AIMIS）提供云端影像 AI，拥有已获三类证的产品，并接入 Tencent 生态。平台型既有厂商——GE HealthCare、Siemens Healthineers、Philips 和
              Canon——把 AI 直接嵌入扫描仪和 PACS，并主导 FDA 授权数量。UII 的位置很独特：像既有厂商一样，它通过母公司 UIH 掌握硬件渠道；又像纯软件公司一样，它销售宽广的独立 AI 组合。
