      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              UII 的主要买方是中国三级医院，尤其是最先进的三甲医院；这些机构影像量最高，拥有资本预算和临床研究任务，也最先采用 AI。到 2026 年，已有 1,200 多家三甲医院采用 AI
              辅助诊断系统，用于放射、病理或两者兼有，说明顶层医院已进入主流渗透阶段。第三方影像中心是医院之外正在出现的次级渠道。


              医院内部，用户和付款方并不相同。用户是放射或病理科室及其临床医生；付款方是医院资本和 IT 预算，有时由省级卫健部门采购补足，因为全国没有专门为这类软件直接付费的 AI
              报销项目。因此，预算归属分散在医院行政、科室和省级部门之间，AI
              软件要与其他资本优先事项竞争，而不是动用一个封闭资金池。典型采用路径从科室试点开始，到科室部署，再到全院使用，偶尔扩展为省级铺开；每一步都被采购规则和临床验证要求卡住。


              UII 享有一种由母公司身份带来的结构性买方优势：United Imaging Healthcare 的影像设备销售，把 UII 软件带入同一批医院账户，因此 AI
              会与买方已在采购的扫描仪一起销售或嵌入其中。更广义上，国内厂商受益于中国集中化医疗数据和极大患者量，相比面临数据本地化壁垒的西方进入者，拥有训练数据优势。中国医院采用
              AI，主要是为了缓解放射科医生短缺、标准化诊断，并满足国家数字健康任务；这恰好与 UII 领先的应用方向对齐。
