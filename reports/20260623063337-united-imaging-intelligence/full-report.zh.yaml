      - number: '1.3'
        title: 融资历史、投资人和规模
        blocks:
          - type: paragraph
            body: >-
              UII 融资历史中最硬的数据点，是 2025 年 6 月的 Series A。36Kr、DealStreetAsia 和 Insight 等多家媒体报道称，UII 完成约 RMB 1B（约 $139M）融资，由
              E Fund Management（易方达）和 Shanghai Guotou Investment（Shangguo，上国投资）共同领投，Shanghai Alliance/United
              Investment、Sun Rock Capital、Suzhou Capital Group、Tsing Song（Qingsong）Capital、Junwei Venture
              Capital、Zhangjiagang Venture Capital、Wuhan Optics Valley industrial investment，以及母公司 United Imaging
              Healthcare 参与。不同来源对共同领投方和参投方命名略有差异；部分转载将 SIG Property Management 与 E Fund 并列为领投方，这一点值得与股权表核对。


              估值口径把 UII 明确推入独角兽区间。报道显示其投前估值接近 RMB 9B（约 $1.25B），融资后投后估值约 $1.4B，使 UII 在成立约七年后成为中国估值最高的独立医疗 AI
              公司之一。公司称融资将用于多模态大模型研发、医院数智化系统和商业化铺开，而非战略转向。


              规模声明很强，但对分母敏感。UII 引用 12 个产品平台、100 多个 AI 应用、13 张 NMPA 三类医疗器械证、15 项美国 FDA 清除和 31 项 CE 认证，产品已部署到中国 4,000
              多家医疗机构，并在全球完成 3,000 多家医院部署。母公司 UIH 报告 2025 年收入约 RMB 13.8B，同比增长约 34%；这能说明 UII 所依托的渠道，但不是 UII
              自身收入。公开记录支持其监管和部署规模已相当可观，但 UII 的独立收入、ARR、员工人数和烧钱速度仍未披露，必须视为缺口。
