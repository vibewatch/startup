            body: >-
              从牵引力看，UII 更像一个真实部署的平台，而不是试点阶段工具：4,000 多家机构运行其应用，清除组合在 FDA 名单中全球排名第五。但这种牵引力的效率主要靠推断。UII 的核心 GTM 动作是母公司 UIH
              的硬件渠道，把 AI 带入医院设备账户，并提供软件型对手难以匹配的分销经济性。反面是，打包销售模糊了 AI 与硬件各自贡献多少收入；UII 也不披露销售周期、合同条款、CAC、回本期或收入集中度。


              同行证据把收入质量问题衬得很尖锐。资本深度是一个竞争变量：UII 约 USD 139M 的 Series A，相比 Aidoc 等全球纯软件公司（累计融资超过 USD 500M）偏小，限制了基础模型研发火力。中国
              2026 年创投反弹——亚洲一季度融资约 USD 27.4B，其中多数流向中国且由 AI 领跑——支持后续资本可得性。但上市中国可比公司令人警醒：Airdoc 报告 2024 年净亏损
              CN¥255M，尽管收入增长，仍已连续五年净亏损。这些代理指标说明 UII 有规模和渠道，但其独立变现效率无法从公开数据证明。
