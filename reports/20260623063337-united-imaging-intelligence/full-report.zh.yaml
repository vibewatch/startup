      - number: '3.3'
        title: 护城河、切换成本和被替代风险
        blocks:
          - type: paragraph
            body: >-
              UII 最强护城河，是母公司 UIH 的硬件渠道：购买 United Imaging 扫描仪的医院账户，也会被带入 UII AI；国内数据规模和中国本土监管位置进一步强化这一点。AI 一旦嵌入扫描仪工作流和医院
              PACS，切换成本就会上升，有利于 UII 和平台型既有厂商这类整合供应商；分销权也偏向硬件销售商（GE、Siemens、Philips、UIH），纯软件初创公司难以匹配。


              但每条护城河都有可信威胁。渠道优势会被部分抵消，因为中国医院会多宿主，并行运行多家厂商的
              AI；市场密度高——数百家厂商——压低定价，也加速单病种检测器商品化。监管宽度真实但可复制：Infervision、DeepWise 和 Tencent
              也持有三类证。基础模型规模正在成为新前沿，资本更厚的全球纯软件公司投入超过 UII——Aidoc 的 CARE 对比 UII 的 uAI NEXUS；Annalise 和 Aidoc 的宽度战略也与 UII
              的多病种 agent 路线收敛，因此单靠宽度不太可能长期差异化。医院内部自建和开源医疗模型，正在研究型医院成为增长中的现状替代方案；Airdoc 和 Shukun 的 IPO
              路径也表明同行在融资进入公开市场，追逐同一批医院预算。


              从估值相关定位看，UII 约 USD 1.4B 的估值高于上市 Airdoc（IPO 时约 RMB 5.8B），但低于全球龙头的融资基础，意味着它背负一个需要由竞争力证明的溢价。没有公开来源显示 UII
              在与具名同行的正面替代中获胜；Viz.ai 的盈利能力和 CMS 报销也给美国对手带来 UII 尚不能匹配的商业化优势。耐久结论是，UII
              在渠道和数据上确有护城河，但护城河可被挑战；只有把这些优势转化为可报销、抗多宿主的经常性收入，竞争边才守得住。
