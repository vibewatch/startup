      - number: '1.3'
        title: Funding history, investors, and scale
        blocks:
          - type: paragraph
            body: >-
              The hard datapoint in UII's financing history is its June 2025 Series A. Multiple outlets, including 36Kr,
              DealStreetAsia, and Insight, report that UII completed a roughly RMB 1 billion round (about $139 million)
              co-led by E Fund Management (易方达) and Shanghai Guotou Investment (Shangguo, 上国投资), with participation from
              Shanghai Alliance/United Investment, Sun Rock Capital, Suzhou Capital Group, Tsing Song (Qingsong)
              Capital, Junwei Venture Capital, Zhangjiagang Venture Capital, Wuhan Optics Valley industrial investment,
              and the parent United Imaging Healthcare. Reported sourcing varies on the precise co-lead and participant
              naming, with some reposts crediting SIG Property Management alongside E Fund, a discrepancy worth
              reconciling against the cap table.


              Valuation framing puts UII firmly in unicorn territory. Coverage indicates a pre-money valuation near RMB
              9 billion (roughly $1.25 billion), implying a post-money valuation around $1.4 billion after the raise,
              making UII one of China's most valuable independent medical-AI companies roughly seven years after
              founding. The company says proceeds will fund multimodal large-model development, hospital
              digital-intelligence systems, and commercial roll-out, rather than a pivot.


              Scale claims are strong but denominator-sensitive. UII cites 12 product platforms, more than 100 AI
              applications, 13 Class III NMPA medical-device certificates, 15 US FDA clearances, and 31 CE
              certifications, with products deployed across more than 4,000 Chinese medical institutions and 3,000-plus
              hospital deployments worldwide. Parent UIH reported 2025 revenue of about RMB 13.8 billion, up roughly 34%
              year on year, which contextualizes the channel UII rides but is not UII's own revenue. The public record
              supports meaningful regulatory and deployment scale, but UII's standalone revenue, ARR, headcount, and
              burn remain undisclosed and must be treated as gaps.
