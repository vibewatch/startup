      - number: '5.4'
        title: Differentiation - technology, data, and regulatory moat
        blocks:
          - type: paragraph
            body: >-
              UII's strongest technical differentiation is open-source foundation-model leadership in medical video
              understanding, validated by CVPR 2026 acceptance and a public benchmark, code, weights, and leaderboard
              that invite the global developer community - a transparency posture rare among Chinese medical-AI vendors,
              which usually keep models closed. That openness doubles as a credibility and recruiting signal and as a
              way to set an evaluation standard the field measures against.


              Three further moats reinforce the technology lead. First, vertical integration with parent United Imaging
              Healthcare lets UII co-design AI with scanners - for example DeepRecon image reconstruction on uMR systems
              - a hardware-software loop software-only rivals cannot easily replicate. Second, a large, diverse,
              clinically sourced training corpus, refined through hospital collaboration, is a data moat that compounds
              with deployment. Third, regulatory breadth across FDA, NMPA, and CE - with UII ranking fifth on the FDA's
              Q1-2026 radiology-AI authorization list at about 40 cleared devices - is itself a differentiation asset
              versus narrower competitors. The open question is durability: open-sourcing the flagship model invites
              fast-following, so the moat depends on data, hardware co-design, and clearance breadth more than on model
              secrecy.
