  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence delivers a unified medical-AI platform, branded uAI, that operates inside the
              clinical workflow rather than as a standalone analytics tool. In customer terms, the platform takes an
              imaging study, runs AI analysis, generates structured diagnostic reports, supports treatment planning, and
              feeds hospital-operations dashboards. UII describes a portfolio of 12 product platforms and more than 100
              AI applications across CT, MR, X-ray, ultrasound, and pathology, deployed through the uAI Clinical Portal
              (uCP) / uAI Discover, which integrates with hospital PACS and supports more than 60 applications across
              modalities.


              The most important product shift is from narrow task automation to collaborative "AI agents" that
              understand, reason, and act across the care pathway. At RSNA 2025 UII showcased uAI Insight, an
              imaging-to-report agent performing multimodal reasoning and clinical correlation; a uAI Agent for Chest CT
              Reporting that detects 73 thoracic diseases from a single scan at roughly 95% AUC, and a Brain MRI agent
              identifying 47 neurological conditions; a uAI Agent for Ultrasound delivered as an embodied robotic arm;
              and a uAI Avatar assistant plus a hospital-management agent. These agents define the user jobs the
              platform now targets: faster reporting, autonomous acquisition, patient pre-diagnosis interaction, and
              operational quality monitoring.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
