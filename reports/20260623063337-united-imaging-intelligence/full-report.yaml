      - number: '6.4'
        title: Retention, durability, and switching costs
        blocks:
          - type: paragraph
            body: >-
              On durability, UII has a strong structural argument and almost no disclosed data. The structural case is
              that uAI is frequently embedded natively in UIH scanners and integrated into hospital PACS/RIS, which
              raises switching costs: replacing the AI typically means disrupting the imaging workflow or the underlying
              hardware relationship, and the uAI Clinical Portal consolidates 60-plus applications so a hospital that
              standardizes on it accrues training and integration lock-in. Regulatory breadth reinforces stickiness,
              because a hospital that has validated cleared applications in its clinical pathway is unlikely to
              re-validate a competitor without cause. These are real retention tailwinds common to deeply integrated
              clinical infrastructure.


              The data case is essentially empty. UII publishes no net revenue retention, gross retention, churn,
              renewal rate, contract length, or customer-satisfaction score, and there is no public cohort showing
              repeat usage over time. Because most adoption is bundled with hardware, even the parent's filings do not
              expose AI-software renewal behavior. The honest read is that durability is plausible on mechanism but
              unproven on metrics, and every retention claim must be converted into a null with an explicit diligence
              ask: request NRR/GRR by hospital tier, application-level active-use and renewal cohorts, contract terms,
              and churn reasons under NDA. Loss-making listed peers such as Airdoc show that broad clinical adoption
              does not guarantee durable, profitable revenue.
