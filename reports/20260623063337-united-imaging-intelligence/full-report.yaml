  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call stays cautious because strategic backing and deployment are real, but the price anchor outruns any
      disclosed standalone economics.
    data:
      nodes:
        - id: a
          label: Strategic backing
          detail: E Fund, Shanghai state investors, and listed parent UIH anchor the round.
          tone: positive
        - id: b
          label: Real deployment
          detail: AI tools across 4,000-plus institutions with about thirteen NMPA Class III clearances.
          tone: positive
        - id: c
          label: Premium price anchor
          detail: A ~1.4-billion-dollar Series A already assumes successful monetization.
          tone: warning
        - id: d
          label: Evidence gap
          detail: No standalone revenue, margin, or retention is publicly disclosed.
          tone: negative
        - id: e
          label: Decision
          detail: Research-more and treat the price as stretched until economics are verified.
          tone: neutral
      edges:
        - from: a
          to: e
          label: supports
        - from: b
          to: e
          label: supports
        - from: c
          to: e
          label: caution
        - from: d
          to: e
          label: gates
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV015
      - CV031
      - CV038
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The 1.4-billion-dollar mark implies very different revenue multiples depending on an undisclosed denominator, and
      listed peers anchor the low end.
    data:
      items:
        - label: Implied x at $100M rev
          value: 14
          detail: Revenue multiple needed to support $1.4B if standalone revenue is about $100M.
          tone: negative
        - label: Implied x at $140M rev
          value: 10
          detail: Multiple if revenue approximates a tenth of parent UIH's 2025 sales.
          tone: warning
        - label: Implied x at $200M rev
          value: 7
          detail: Multiple if monetization is already strong; roughly Tempus-like.
          tone: neutral
        - label: Implied x at $280M rev
          value: 5
          detail: Multiple if revenue is large; near upper public imaging-AI band.
          tone: positive
        - label: Tempus EV/revenue
          value: 7.1
          detail: Listed premium health-AI benchmark multiple in 2026.
          tone: neutral
        - label: Airdoc EV/revenue
          value: 1.8
          detail: Listed Chinese imaging-AI peer multiple while loss-making.
          tone: negative
    approximationNotes: >-
      Bars mix implied required multiples at hypothetical revenue levels with listed-peer anchors; they are
      valuation-discipline tools, not forecasts, because UII discloses no revenue.
    claimRefs:
      - CV003
      - CV016
      - CV018
      - CV019
      - CV031
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      On public evidence the range straddles the current mark, landing above it only if monetization and export scale
      both succeed.
    data:
      items:
        - label: Bear case
          low: 150
          mid: 350
          high: 550
          displayValue: $0.15B-$0.55B
          detail: Revenue stalls near $60M-$110M and listed-peer multiples dominate.
          tone: negative
        - label: Base case
          low: 900
          mid: 1300
          high: 1800
          displayValue: $0.9B-$1.8B
          detail: Steady parent-linked growth with disciplined China software multiples.
          tone: warning
        - label: Bull case
          low: 2000
          mid: 3100
          high: 4200
          displayValue: $2.0B-$4.2B
          detail: High-margin AI attach plus international export scale.
          tone: positive
    approximationNotes: >-
      Ranges are simple scenario outputs on public evidence; they intentionally avoid false DCF precision given the
      missing revenue denominator.
    claimRefs:
      - CV003
      - CV015
      - CV031
      - CV034
      - CV038
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      United Imaging Intelligence scores well on backing and deployment, but poorly on standalone economic visibility
      and current price support.
    data:
      items:
        - label: Market opportunity
          score: 8
          detail: Large, policy-supported China medical-imaging-AI market with export optionality.
          tone: positive
        - label: Deployment proof
          score: 8
          detail: 4,000-plus institutions and a deep clearance stack evidence real clinical pull.
          tone: positive
        - label: Strategic backing
          score: 9
          detail: State-linked anchors and a listed parent give rare financing durability.
          tone: positive
        - label: Economic visibility
          score: 2
          detail: No standalone revenue, margin, or retention is publicly disclosed.
          tone: negative
        - label: Monetization moat
          score: 4
          detail: Clearances are strong, but peer losses show weak hospital AI willingness-to-pay.
          tone: warning
        - label: Valuation support
          score: 4
          detail: A 1.4-billion-dollar mark on an unknown denominator already assumes premium execution.
          tone: warning
        - label: Risk insulation
          score: 3
          detail: Geopolitical export limits and heavy parent dependency cut both ways.
          tone: negative
    approximationNotes: Scores are ordinal 0-10 judgments anchored to cited public evidence, not company-disclosed management KPIs.
    claimRefs:
      - CV005
      - CV008
      - CV015
      - CV022
      - CV031
      - CV034
      - CV038
