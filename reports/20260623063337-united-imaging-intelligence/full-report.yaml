      - number: '1.4'
        title: Milestones, regulatory progress, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              UII's milestone arc runs from a December 2017 founding through a rapid build-out of regulatory clearances
              and foundation-model launches. The company gained early national prominence in 2020 for COVID-19 chest-CT
              triage software, then accumulated Class III NMPA certificates and, from 2024, US FDA 510(k) clearances
              including uAI Easy Triage ICH for intracranial-hemorrhage triage and the uAI Portal post-processing
              platform. By the FDA's end-2025 tally, "United Imaging" held 38 cleared radiology AI devices, placing it
              fifth among all vendors behind GE HealthCare, Siemens Healthineers, Philips, and Canon, and ahead of
              Aidoc.


              Product-launch momentum continued into 2025-2026. At RSNA 2025 UII debuted the uAI Insight image-to-report
              agent and an embodied-AI robotic-arm ultrasound system; at ECR 2026 it presented more than 30 CE-certified
              applications and the uCP portal's 60-plus apps; and in April 2026 it open-sourced uAI NEXUS MedVLM, a
              medical-video language model accepted to CVPR 2026. The June 2025 Series A and reported consideration of
              an independent IPO round out a fast-moving recent history.


              Adverse and skeptical signals are mostly structural rather than scandal-driven. UII operates in a crowded,
              partly commoditized Chinese medical-AI market where reimbursement for AI remains immature and many
              approved products struggle to convert clearances into paid hospital revenue; its heavy dependence on the
              parent UIH for data, channel, and capital is itself a concentration risk; and US-China technology and
              data-governance tensions create export and procurement uncertainty for a Chinese medical-AI vendor seeking
              Western markets. These themes, flagged here, are developed in the market, financials, risks, and valuation
              chapters.
