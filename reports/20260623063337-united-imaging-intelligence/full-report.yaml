      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are policy and workforce. China's national AI strategy and digital-health
              mandates push hospitals to adopt AI, and the radiologist shortage makes automated triage and
              quantification economically legible. On the regulatory side, the NMPA regulates AI diagnostic software as
              Class II or Class III medical devices depending on clinical risk, and its Innovative Medical Device
              special-review programme offers an accelerated approval pathway for pioneering AI - a route UII has used
              to accumulate Class III certificates. In 2026 the NMPA issued updated AI classification guidance and a
              more than 80-item industry-standards plan covering AI and imaging, and Announcement No. 52 (2026)
              standardised how products are reclassified, for example from Class II to Class III. These moves add
              clarity but also raise the evidentiary and cost bar for new entrants.


              The constraints are equally concrete and weigh on valuation. First, reimbursement: AI imaging software is
              generally not separately reimbursed under China's DRG hospital-payment system, so its cost is absorbed
              into hospital budgets, and immature reimbursement plus high clinical-validation bars leave many cleared
              products stuck in pilots rather than scaled paid deployment. Second, data governance: medical and health
              data is classified as sensitive personal information under China's PIPL, requiring separate consent and
              data localisation, and cross-border data-transfer certification measures that took effect on 1 January
              2026 add compliance burden for any vendor moving data abroad. Third, the wide and contradictory market
              estimates mean an investor cannot anchor UII's valuation to a single confident TAM.


              For valuation, the market backdrop is double-edged. UII operates in the highest-growth geography and the
              largest-demand application segments, with a privileged parent channel and a credible innovative-device
              regulatory track - all supportive of its roughly USD 1.4 billion valuation. But the absence of a
              reimbursement line, the order-of-magnitude disagreement among sizing sources, the Class III approval
              burden and the data-governance costs are exactly the frictions that separate a large theoretical market
              from realised, paid revenue. The market is real and fast-growing; the diligence ask is proof that UII
              converts deployment into reimbursed or budgeted recurring revenue.
            claimRefs:
