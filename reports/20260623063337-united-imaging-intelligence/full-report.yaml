        title: Expansion paths and concentration risk
        blocks:
          - type: paragraph
            body: >-
              UII's expansion engine is a land-and-expand loop anchored on the parent channel: a hospital buys a UIH
              scanner with embedded AI, adopts the uAI Clinical Portal for additional cleared applications, then expands
              into newer agents and foundation-model capabilities as they commercialize, while overseas growth follows
              UIH's rapid international build-out (overseas parent revenue rose more than 50 percent in 2025). This is a
              powerful motion because the hardware relationship pre-qualifies the account and lowers AI
              customer-acquisition cost relative to software-only rivals.


              The same structure creates concentration risk on three fronts. First, channel and ownership concentration:
              UII's distribution, brand, and much of its installed base depend on parent UIH, so the customer
              relationship is only partly UII's own. Second, geographic and segment concentration in China's Tier-3
              hospital market, where value-based procurement and budget pressure compress prices and where AI software
              lacks a national reimbursement line. Third, geopolitical concentration risk on the growth frontier: US and
              European expansion faces documented trust, supply-chain-security, data-privacy, and US-China trade-tension
              headwinds that can slow or block procurement at exactly the academic accounts UII most wants. No public
              disclosure quantifies top-customer revenue concentration, so the magnitude of single-account or
