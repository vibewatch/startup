      - number: '2.2'
        title: Sizing lenses and the limits of public SAM logic
        blocks:
          - type: paragraph
            body: >-
              UII's core geography is China, and the cleanest narrow public lens for it is China medical image-analysis
              software, which Grand View Research valued at USD 422.8 million in 2022 with a roughly 24.9% CAGR to 2030.
              That is the most directly relevant analyst category, but it is small and dated relative to UII's own claim
              of deployment across 4,000-plus institutions, which signals either rapid market growth since 2022 or that
              UII captures share well beyond this narrow definition.


              The broader lenses are much larger but looser. China's overall AI-in-healthcare market was about USD 1.59
              billion in 2023, projected to USD 7.33 billion by 2028 (roughly 42% CAGR) and USD 18.88 billion by 2030 on
              one analyst's numbers; a different house projects China healthcare AI at USD 2.67 billion in 2025 rising
              to USD 84.11 billion by 2035. Those figures bracket UII's adjacency upside - clinical decision support,
              reporting, hospital operations - but they overstate the revenue UII can address today because they fold in
              drug discovery, telemedicine and non-imaging analytics. A dedicated China radiology-AI-platforms market is
              now tracked as its own fast-growing 2026 segment, which is the closest proxy to UII's actual served
              market.


              The honest diligence conclusion is that no reviewed public source isolates a clean UII-specific SAM or SOM
              that separates its paid hospital revenue opportunity from adjacent pools, and the China estimates
              themselves diverge by an order of magnitude across publishers. Software and solutions, not hardware, is
              the dominant and fastest segment of China's healthcare-AI spend, and government investment - such as the
              USD 2.1 billion Beijing AI industrial park announced in 2018 - underpins the category. North America still
              held the largest regional share (about 44-45% in 2025) while Asia-Pacific is the fastest-growing region,
              so UII sits in the highest-growth geography but not the largest-revenue one.
