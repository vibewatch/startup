              expectations. Among imaging-AI peers, the listed Chinese player Airdoc trades near 1.8 times enterprise
              value to revenue while remaining loss-making, and broader Chinese imaging-AI peers cluster in low
              single-digit revenue multiples. Against US-listed Tempus near 7.1 times and private references such as
              Viz.ai at a 1.2-billion-dollar 2022 mark, United Imaging Intelligence at 1.4 billion dollars sits at the
              premium end of its peer set. The signal is not that UII is overvalued, but that its mark already embeds a
