          - type: paragraph
            body: >-
              UII's adoption story looks like genuine production deployment rather than pilot-stage experimentation, but
              most of the supporting metrics describe the platform breadth or the parent's hardware footprint rather
              than discrete UII software accounts. The uAI Clinical Portal unifies more than 60 applications in a single
              workflow surface, and UII reports roughly 13 NMPA Class III approvals, 15 FDA clearances, and 31 CE
              certifications as of mid-2025, with 30 CE-certified applications featured at ECR 2026 - a regulatory
              breadth that signals products cleared for routine clinical use across multiple jurisdictions. Third-party
              coverage of Chinese hospital AI describes workflow improvements on the order of 30 percent for radiology
              reporting, and UII has pointed to multicenter validation across thousands of cases.


              The deployment funnel, however, mixes units that cannot be reconciled into a clean conversion picture. At
              the top sit thousands of institutions running at least one uAI application; below that sit UIH's hardware
              accounts in 100-plus countries; below that sit the smaller set of named, publicly referenceable hospital
              deployments; and at the base sit the still-emerging AI-agent showcases from RSNA 2025 and ECR 2026 whose
              independent, production-grade validation remains limited. UII discloses no per-application utilization, no
              active-use rate, no repeat-purchase or renewal counts, and no denominator that would convert "4,000
              institutions" into seats, studies read, or recurring revenue. The trajectory is upward and broad, but its
              depth and durability are inferred, not measured.
