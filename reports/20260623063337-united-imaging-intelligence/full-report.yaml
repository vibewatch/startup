  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence serves hospitals and health systems, with radiology departments and hospital
              IT as the primary buyers, radiologists and clinicians as the users, and the hospital itself as the payer
              because China has no national reimbursement line for standalone diagnostic-AI software. The customer base
              segments along three visible axes. By geography, the core market is China's public hospital system,
              especially large Tier-3 and Tier-3A teaching hospitals, while an expanding overseas footprint rides the
              parent United Imaging Healthcare (UIH) channel into Europe, North America, Asia, and South America. By use
              case, customers adopt uAI for triage, lesion detection, segmentation, structured radiology reporting, and
              increasingly AI agents for chest CT, brain MRI, and ultrasound. By channel, UII reaches customers two
              ways: AI embedded natively in UIH scanners and PACS, and standalone uAI Clinical Portal (uCP) software
              licensed to hospitals that may run mixed-vendor fleets.


              The scale signal is real. UII states its 12 platforms and 100-plus applications are deployed across more
              than 4,000 medical institutions, and the parent reports an installed base spanning more than 100 countries
              and regions with over 640 cumulative United States systems by the end of 2025. China's national health
              system has pushed AI-assisted diagnostics into more than 1,200 Tier-3A hospitals during 2025-2026, the
              exact pool UII targets. But the public disclosures conflate institutions, deployed applications, and
              hardware accounts, so the count of paying UII software customers - distinct from hospitals that merely own
              a UIH scanner with embedded AI - is not separable from the outside.
