      - number: '8.5'
        title: What must be proven next
        blocks:
          - type: paragraph
            body: >-
              The decisive diligence path is straightforward. An investor needs United Imaging Intelligence standalone
              revenue or at minimum a management-certified revenue bridge, the recurring-versus-project split, gross
              margin after compute and support, retention and depth across the four-thousand-plus institution footprint,
              and clarity on related-party terms with the parent. Public evidence is strong enough to show that UII
              matters clinically and strategically; it is not strong enough to show that a new investor should accept
              the 1.4-billion-dollar mark without these materials. Geopolitical exposure adds a second gate: the share
              of pipeline reliant on US and allied markets must be sized against BIOSECURE-style and FDA risk, because
              export restrictions could remove a core leg of the bull case. Until those inputs arrive, the chapter's
              message is simple: stay interested and keep the company in active diligence, but make it earn the premium
              rather than converting strategic admiration into automatic price acceptance.
            claimRefs:
              - CV031
              - CV032
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
          - type: table
            tableRef: TV006
