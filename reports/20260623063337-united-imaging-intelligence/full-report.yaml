chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence positions itself as an international medical-AI company that builds
              artificial-intelligence software across the full clinical pathway, from screening and diagnosis through
              treatment and follow-up. Its Chinese legal entity is Shanghai United Imaging Intelligence Co., Ltd.
              (上海联影智能科技股份有限公司), headquartered at 701 Yunjin Road, Xuhui District, Shanghai. The company is the dedicated
              AI subsidiary of United Imaging Healthcare Technology Group (UIH), the Shanghai Stock Exchange STAR
              Market-listed medical-imaging hardware maker (688271.SH), and it markets its software under the umbrella
              "uAI" brand spanning CT, MR, PET/CT, X-ray, and ultrasound modalities.


              The product surface is unusually broad for a private medical-AI firm. By mid-2025 management described 12
              product platforms and more than 100 AI applications, organized around the uAI Clinical Portal (uCP) that
              bundles disease-detection, quantification, and reporting apps into hospital workflows. In 2025 UII
              reframed itself around a multimodal medical foundation model it calls "Yuanzhi" (元智), and the uAI NEXUS
              suite of image, language, speech, and video models, moving from single-disease detectors toward
              multi-disease "agent" products such as a chest-CT agent that screens 73 thoracic findings from one scan.


              The business model is software sold into healthcare institutions, leveraged heavily by the parent's
              installed base of imaging equipment. UII says its AI products have entered more than 4,000 medical
              institutions across China and that its software runs on UIH scanners as embedded intelligence as well as
              on third-party hardware. Roughly 80% of staff are described as research-and-development personnel,
              consistent with a software-and-models company rather than a device manufacturer. What remains undisclosed
              on public surfaces is the standalone revenue, margin, and pricing that would let an investor underwrite
              the business independently of UIH.
