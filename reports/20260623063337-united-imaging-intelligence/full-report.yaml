        - label: Training pipeline
          note: SFT plus MedGRPO reinforcement learning
        - label: Application layer
          note: 100+ uAI apps and clinical AI agents
        - label: Integration layer
          note: uAI Clinical Portal - DICOM, structured reporting, PACS/RIS
        - label: Hardware co-design layer
          note: AI tuned to parent UIH scanners (e.g., DeepRecon on uMR)
