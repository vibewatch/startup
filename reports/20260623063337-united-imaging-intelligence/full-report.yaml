      - number: '7.3'
        title: Operational, quality, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Operational and technical risk for UII centers on clinical safety, model reliability, and the security of
              software embedded in hospital imaging workflows. Because uAI applications inform triage, detection,
              segmentation, and reporting, a false negative or a model that fails to generalize from training data to a
              new hospital's scanners, protocols, or patient mix can cause clinical harm and regulatory action; NMPA
              change-control rules mean that fixing or updating a deployed model is itself a governed, evidence-heavy
              process rather than a quiet patch. The newest autonomous agents shown at RSNA 2025 and ECR 2026 raise the
              stakes because higher autonomy widens the gap between demonstrated benchmark performance and accountable,
              real-world clinical behavior, and independent production-grade validation at named sites remains limited.


              Cybersecurity and data-handling are the second operational axis. Systems integrated into hospital PACS/RIS
              and, in some cases, native to UIH scanners create an attack surface and a patient-data-protection
              obligation under PIPL and the Data Security Law; UII discloses little public detail on its security
              architecture, controls, or incident history, so resilience must be verified rather than assumed.
              Supply-chain and manufacturing risk sits mostly with the parent UIH hardware business but transmits to UII
              through bundled deployments and any component or export restriction. The honest read is that UII's quality
              and clearance breadth are real mitigants, but utilization-level reliability data, security disclosures,
              and post-market surveillance evidence are not public and must be obtained, with a confirmed clinical
              incident or recall as a clear thesis-break trigger.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
          - type: table
            tableRef: TR002
            claimRefs: []
      - number: '7.4'
        title: Partner, dependency, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              UII's most distinctive structural risk is its dependence on parent United Imaging Healthcare. UIH supplies
              the hardware channel that carries embedded uAI into hospitals, much of the brand and global service
              footprint, a large share of the installed base, and - through the broader group - capital and strategic
              direction. This concentration is a double-edged mitigant: the parent's RMB 13.80 billion 2025 revenue and
              strong balance sheet de-risk financing and distribution, but they also mean the customer relationship,
              pricing power, and even regulatory fate of UII are only partly its own, and any shock to UIH - a 1260H
              listing, an export restriction, a demand slump under value-based procurement - transmits directly to the
              subsidiary. State-linked ownership and investors add political-alignment risk that cuts both ways:
              domestic preference in China, heightened suspicion in the US.


              Beyond the parent, dependency risk includes reliance on a small set of foundation models and the uAI
              Clinical Portal as the single platform through which value is delivered, on hospital procurement budgets
              pressured by China's value-based procurement, and on capital providers for the next financing round.
              Customer-concentration magnitude is unknown because UII discloses no top-account revenue split, so
              single-account or single-channel dependence is a material open item. The dependency map and register below
              trace each critical counterparty - parent, regulators, key hospitals, capital providers, and platform
              components - to a failure scenario, a severity rating, and a diligence path, with loss of parent support
              or a binding US designation as the clearest dependency thesis-breaks.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
          - type: table
