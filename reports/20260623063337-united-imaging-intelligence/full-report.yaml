  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity ranking
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence's risk surface is shaped less by start-up fragility than by the policy and
              structural environment around a Chinese medical-AI company tethered to a listed imaging parent. Ranking by
              residual severity, the top tier is external and largely outside management control: US national-security
              restrictions on Chinese biotech and imaging procurement, China's own NMPA approval complexity for
              high-risk AI software, and health-data privacy and localization rules under PIPL and the Data Security
              Law. The second tier is structural dependency on parent United Imaging Healthcare (UIH) for distribution,
              capital, brand, and installed base, which concentrates channel and ownership risk in a single
              counterparty. The third tier is operational and technical - clinical-AI safety, model generalization,
              recalls, and cybersecurity of hospital-deployed systems - and the fourth is financial-model and execution
              risk, muted by parent strength but elevated by undisclosed standalone economics.


              Severity here blends likelihood and impact with mitigation maturity. Regulatory and geopolitical risks
              score high impact and rising likelihood with low company-side mitigation, because UII cannot legislate
              around the BIOSECURE Act or rewrite NMPA evidence requirements; it can only adapt. Dependency risk scores
              high impact but is partly mitigated by the parent's financial health and aligned incentives. Operational
              risk scores moderate, with regulatory clearances and quality systems as partial mitigants. The disciplined
              read is that UII's principal threats are exogenous and slow-moving rather than acute, which makes them
              monitorable: each top risk below carries a measurable thesis-break trigger, and unconfirmed items -
              litigation exposure, security incidents, and revenue concentration - are flagged with explicit diligence
              paths rather than assumed benign.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
