  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and rival profiles
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence sells into a densely populated market: public trackers describe hundreds of
              active Chinese medical-imaging-AI vendors and dozens of well-funded contenders as of 2026. The competitive
              set spans six layers - direct Chinese pure-plays, ecosystem giants, platform-incumbent device makers,
              global pure-plays, status-quo substitutes, and internal hospital builds - and UII overlaps with all of
              them.


              The direct Chinese peers are the most visible rivals. Infervision (Tuixiang), founded in Beijing in 2016,
              has raised about USD 213 million over eight rounds and focuses on X-ray and CT diagnosis. DeepWise
              (Shenrui), founded in 2017, has raised about USD 115 million backed by Legend Capital and CICC,
              specializes in cancer and stroke radiology AI, and unveiled new multimodal imaging platforms at the 2026
              China Medical Equipment exhibition. Airdoc (Eaglevision, 02251.HK) became China's first AI-medical-imaging
              IPO on the Hong Kong exchange in November 2021 at roughly RMB 5.8 billion, specializes in retinal
              screening, and reported about USD 24.1 million of 2025 revenue. Shukun Technology, also founded in 2017,
              leads cardiovascular and tumor AI and was preparing a Hong Kong IPO in 2026 backed by Goldman Sachs,
              Sequoia and Qiming, while Yitu Healthcare runs cancer-screening and NLP diagnostics across more than 600
              top hospitals.


              Beyond the pure-plays sit ecosystem giants and incumbents. Ping An Smart Healthcare reaches more than
              40,000 institutions across 170-plus cities with an integrated finance-healthcare AI suite, and Tencent
              Miying (AIMIS) offers cloud imaging AI with Class III-cleared products plugged into the Tencent ecosystem.
              The platform incumbents - GE HealthCare, Siemens Healthineers, Philips and Canon - embed AI directly into
              scanners and PACS and dominate the FDA authorization count. UII's position is distinctive: like the
              incumbents it owns the hardware channel through parent UIH, but like the pure-plays it sells a broad
              standalone AI portfolio.
