  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The right public-evidence posture on United Imaging Intelligence today is research-more, not avoid and not
              buy. The strategic and clinical story is strong: the June 2025 Series A of roughly 139 million dollars
              priced the company near a 1.4-billion-dollar post-money valuation, anchored by E Fund, Shanghai state
              investors, and a listed parent in United Imaging Healthcare. Deployment is real, spanning more than four
              thousand institutions with a deep regulatory stack of NMPA Class III, CE, and FDA clearances. The problem
              is price discipline. United Imaging Intelligence discloses no standalone revenue, gross margin, or
              retention, so the multiple implied by the 1.4-billion-dollar mark is literally unknowable from public
              evidence. That forces underwriting to rely on a strategic narrative rather than a denominator. The
              recommendation is cautious because valuation support, not clinical relevance, is the central unresolved
              question, and the burden of proof now sits squarely on diligence.
