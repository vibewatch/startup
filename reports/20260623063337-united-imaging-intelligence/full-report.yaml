  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              United Imaging Intelligence operates as the independently financed medical-AI arm of listed parent United
              Imaging Healthcare (UIH, 688271.SH), monetizing software and clinical-AI applications rather than imaging
              hardware. As a private subsidiary it discloses no standalone revenue, ARR, or net income, so its revenue
              architecture must be reconstructed from product disclosures and the parent's filings. UII monetizes its AI
              through two visible channels: applications embedded in or bundled with UIH scanners and PACS, and
              standalone uAI software licenses sold to hospitals. The company reports 12 product platforms and more than
              100 AI applications deployed across over 4,000 medical institutions, supported by 13 NMPA Class III
              certificates, 15 FDA clearances and 31 CE certifications as of mid-2025.


              What is not public matters as much as what is. UII publishes no per-study or per-seat list pricing; like
              most Chinese imaging-AI vendors it sells through hospital procurement or equipment bundling, which
              obscures realized pricing and standalone revenue attribution. Its fifth-place ranking on the FDA's Q1-2026
              radiology-AI authorization list (about 40 cleared devices) signals sustained product and R&D investment,
              but clearance breadth is an input proxy, not a revenue figure. The revenue model is therefore
              directionally legible - bundled-plus-standalone software into a large installed base - while the quality
              and scale of that revenue remain hidden inside the parent's consolidated accounts.
