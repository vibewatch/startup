            body: >-
              Named, externally verifiable customers are the strongest test of adoption, and here UII's evidence is
              uneven. The clearest public reference is UC Davis Health, whose radiology equipment list shows a United
              Imaging 1.5T uMR 680 MRI system in production - an independent, customer-side disclosure rather than a
