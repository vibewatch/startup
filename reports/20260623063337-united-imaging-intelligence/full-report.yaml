      - number: '4.3'
        title: Cost structure, margins, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Because UII's results consolidate into parent UIH and are not separately reported, its standalone gross
              margin is not knowable from public data - a structural limitation rather than a temporary gap. The
              parent's audited figures nonetheless frame the economics UII contributes to. UIH reported 2025 revenue of
              RMB 13.80 billion, up 33.98% year on year, and net profit attributable to shareholders of RMB 1.87
              billion, up 48.14%. Half-year 2025 results show RMB 6.02 billion of revenue (up 12.79%) and RMB 998
              million of net profit attributable to the parent, with overseas revenue of RMB 1.14 billion and service
              revenue of RMB 0.82 billion.


              R&D intensity is the clearest signal of capital intensity: UIH invested RMB 2.62 billion in R&D in 2025
              (up 15.95%) - roughly 19% of revenue - and RMB 1.14 billion in the first half alone, much of it directed
              at AI and platform technology that UII helps build. Margins face a domestic headwind: China's volume-based
              procurement (VBP) imposes downward price pressure on imaging equipment, which the parent offsets through
              premium products and a fast-growing overseas mix. First-quarter 2026 results - revenue of RMB 2.91 billion
              (up 17.34%) and net profit of RMB 0.40 billion (up 7.78%) - show a slower profit trajectory than full-year
              2025. Critically, AI diagnostic software is generally not reimbursed under China's health-insurance or DRG
              system, so vendors strike direct hospital deals at modest fees, and profitable peers such as Ping An
              monetize mainly through ecosystem cross-sell rather than standalone imaging-AI pricing.
