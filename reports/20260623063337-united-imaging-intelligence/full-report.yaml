  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Layered view of how UII turns clinical data into AI agents, from foundation models up through PACS-integrated
      applications.
    data:
      items:
        - label: Data layer
          note: MedVidBench and large clinical imaging/video corpora
        - label: Foundation-model layer
