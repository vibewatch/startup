    AI subsidiary of Shanghai-listed United Imaging Healthcare (UIH, 688271.SH). Its uAI platform spans 12 product
    platforms and more than 100 AI applications across CT, MR, PET/CT, X-ray, and ultrasound, with a 2025 pivot toward
