  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Standalone revenue disclosed far below estimate
        - Verified UII revenue materially under ~$100M without exceptional margins
        - The 1.4-billion-dollar mark loses its denominator support immediately.
        - Do not underwrite at the Series A headline price.
      - - Hospital AI monetization stays weak
        - Sustained operating losses mirroring listed peers like Airdoc
        - The premium multiple logic collapses toward public imaging-AI bands.
        - Re-cut valuation to 2x-5x revenue comps.
      - - Geopolitical export ceiling hardens
        - BIOSECURE-style restrictions or FDA action blocking US and allied sales
        - International upside and the export-led bull case both fall away.
        - Lower bull probability and widen downside scenarios.
      - - Parent dependency turns adverse
        - UIH reallocates capital, restructures UII, or related-party terms shift
        - Headline valuation stops representing independent investable economics.
        - Pause until standalone governance and economics are clear.
      - - Clearances do not convert to paid usage
        - NMPA Class III approvals plateau as cost centers without reimbursement
        - The regulatory moat becomes expense rather than durable revenue.
        - Treat moat claims as unproven and discount accordingly.
    notes: These triggers are deliberately tied to valuation transmission rather than broad operating risk.
    claimRefs:
      - CV015
      - CV022
      - CV031
      - CV034
      - CV035
      - CV038
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Standalone revenue and ARR bridge
        - UII-only recognized revenue, recurring share, growth, and parent-related revenue split.
        - The price is acutely sensitive to a denominator that is currently undisclosed.
        - Finance diligence, management-certified revenue bridge, and parent carve-out schedules.
      - - Gross margin and monetization model
        - Per-app pricing, bundled-versus-paid mix, and gross margin after compute and support.
        - Premium multiples only hold if AI software economics are genuinely attractive.
        - Finance and product diligence with pricing-realization analysis.
      - - Retention and deployment depth
        - Paid-institution count, usage depth, and renewal or churn across the 4,000-plus footprint.
        - Logo breadth without depth would not support a durable premium.
        - Customer reference calls and deployment-telemetry review.
      - - Parent-dependency and related-party terms
        - Distribution, IP, compute, and pricing terms between UII and UIH.
        - Economic reality can diverge sharply from the headline private mark.
        - Counsel review of related-party agreements and cap table.
      - - Geopolitical export exposure
        - Share of pipeline reliant on US and allied markets exposed to BIOSECURE and FDA risk.
        - Export restrictions could remove a core leg of the bull case.
        - Regulatory and trade-counsel scenario analysis.
    notes: >-
      If these asks cannot be answered cleanly, the right posture is patience rather than aggressive price-taking on a
      strategic narrative.
    claimRefs:
      - CV015
      - CV031
      - CV032
      - CV034
