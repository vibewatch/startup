        title: Trust, safety, security, and compliance
        blocks:
          - type: paragraph
            body: >-
              UII's quality and compliance posture is anchored in regulatory clearances. uAI Easy Triage ICH (K242292)
              received FDA 510(k) Class II clearance in September 2024 for triage of suspected intracranial hemorrhage
              on non-contrast head CT, and uAI Portal (K240411) is FDA-cleared for AI-based vascular CT segmentation;
              uAI EasyTriage-Rib and the DeepRecon MR reconstruction tool extend the cleared portfolio. UII reports
              roughly 15 FDA clearances, 31 CE certifications, and 13 NMPA Class III approvals as of mid-2025, with NMPA
              Class III being China's highest-risk device class requiring rigorous clinical evaluation. The FDA
              submissions were supported by specialist regulatory partner MCRA, evidence of quality-system maturity for
              US market entry.


              On transparency, UII goes further than most peers by publishing open benchmarks (MedVidBench) and a public
              leaderboard for third-party evaluation. But three trust gaps remain in the public record. Independent
              third-party clinical-validation evidence for the newest autonomous agents is still limited. UII discloses
              little public detail on data-privacy architecture, security controls, and PIPL-aligned data handling for
              its platform. And the commercialization path from open-source foundation models to paid, governed hospital
              products is not yet fully described. The net read is strong on regulatory clearance and benchmark
              transparency, but thinner on independent validation, privacy/security disclosure, and the
              open-source-to-revenue bridge - the principal product-technical risks alongside foundation-model
              generalization to real clinical settings.
