chapter:
  number: 2
  title: Market Analysis
  summary: United Imaging Intelligence sells into the AI-in-medical-imaging market, whose global size public analysts place anywhere from about USD 2.2 billion to USD 5.3 billion in 2026 with 35-40% growth, while UII's home market - China medical image-analysis software - was a narrower USD 422.8 million in 2022 inside a USD 1.59-7.33 billion China healthcare-AI pool. Tier-3A hospitals are the primary buyers, with more than 1,200 already deploying AI diagnostics, and the parent UIH equipment channel pulls UII software into those same accounts. The bull case rests on a radiologist shortage, national AI-and-digital-health mandates, and NMPA's innovative-device pathway; the bear case rests on divergent and unreliable market estimates, the absence of a clean reimbursement line for AI software under DRG payment, heavy Class III approval and PIPL data-governance burdens, and the lack of any public UII-specific SAM or SOM.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: 'United Imaging Intelligence competes in the AI-in-medical-imaging market, the software category that applies machine learning to CT, MRI, X-ray, ultrasound, PET and nuclear scans for detection, quantification, triage and reporting. That is the directly relevant boundary: included spend is hospital and imaging-center budget for diagnostic-AI software, workflow tools and the foundation models behind them, while excluded spend is the imaging hardware itself (the parent UIH''s business), generic hospital IT, and non-imaging clinical software. The status-quo substitute for almost every UII application is unaided human radiologist reading, which remains free at the point of decision and is the real competitor that AI must displace or augment.


    Public sizing of this category is wide and inconsistent. Grand View Research estimates the global AI medical imaging market at about USD 1.8 billion in 2025 rising to USD 20.2 billion by 2033 at roughly 35% CAGR; The Business Research Company puts 2026 at USD 5.29 billion reaching USD 20.28 billion by 2030 at about 39.9% CAGR; and Coherent Market Insights values 2026 at only USD 2.20 billion. The 2026 global figure therefore spans roughly USD 2.2-5.3 billion depending on whose category definition is used, a spread that should make any single TAM slide suspect.


    Within that category, demand is concentrated by application and modality. Neurology was the single largest application segment at around 37% of 2025 revenue and computed tomography the leading modality at roughly 34-42%, while oncology is among the fastest-growing applications on rising cancer incidence. Hospitals are the dominant end-user, accounting for over 60% of spend, and the global shortage of radiologists is the clearest structural driver pulling AI into the workflow. UII''s broad uAI portfolio - chest CT, neuro, oncology, cardiovascular and more - maps directly onto the largest of these segments.'
