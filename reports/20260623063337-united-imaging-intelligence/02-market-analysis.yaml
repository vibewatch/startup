  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: A UII-specific SAM or SOM separating its paid hospital revenue opportunity from adjacent imaging and healthcare-AI pools.
    whyItMatters: Without an isolated served-market figure, the roughly USD 1.4 billion valuation cannot be tied to a defensible share of a defined market.
    diligencePath: Request management segmentation of UII revenue by application, hospital tier, and geography to ground a bottom-up SAM.
    relatedQuestionRefs:
    - QM010
    - QM011
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: A reconciled market estimate; public 2026 global figures span USD 2.2-5.3B and China estimates diverge by an order of magnitude.
    whyItMatters: Order-of-magnitude disagreement among publishers means no single TAM can anchor growth or valuation assumptions.
    diligencePath: Triangulate analyst methodologies and prefer the narrowest directly comparable China imaging-software lens over broad healthcare-AI pools.
    relatedQuestionRefs:
    - QM012
    - QM003
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: reimbursement
    missingEvidence: A national framework or codes that reimburse AI imaging software in China beyond province-level pilots.
    whyItMatters: Absent a reimbursement line, AI cost is absorbed in hospital budgets, which caps paid scale-up and pressures realized revenue.
    diligencePath: Request UII data on paid versus bundled deployments and any provincial bundled-payment or add-on-code participation.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: minor
    topic: buyer-economics
    missingEvidence: Per-site pricing, budget ownership, and contract structure for UII deployments across hospital tiers.
    whyItMatters: Fragmented budget ownership and the parent channel make headline deployment counts an unreliable proxy for revenue.
    diligencePath: Request representative contracts, pricing, and the split between UIH-bundled and standalone software sales.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM003
