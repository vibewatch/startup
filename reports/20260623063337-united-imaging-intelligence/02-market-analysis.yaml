- id: buyers-users-and-budget-owners
  title: Buyer, user, and payer segmentation
  body: 'The primary buyers for UII are China''s tertiary hospitals, especially the most advanced Tier-3A institutions, which run the highest imaging volumes and have the capital budgets and clinical-research mandates to adopt AI first. By 2026 more than 1,200 Tier-3A hospitals had adopted AI-assisted diagnostic systems for radiology, pathology or both, signalling mainstream penetration in the top tier. Third-party imaging centres are an emerging secondary channel alongside hospitals.


    Inside a hospital the user and the payer differ. The user is the radiology or pathology department and its clinicians; the payer is the hospital''s capital and IT budget, sometimes topped up by provincial health-bureau procurement, because there is no dedicated national AI reimbursement line that funds the software directly. Budget ownership is therefore fragmented across hospital administration, departments and provincial bureaus, and AI software competes against other capital priorities rather than drawing on a ring-fenced pool. The typical adoption path runs from a departmental pilot, to departmental deployment, to hospital-wide use, and occasionally to a provincial roll-out, gated at each step by procurement rules and clinical-validation requirements.


    UII enjoys a structural buyer advantage that is specific to its parentage: United Imaging Healthcare''s imaging-equipment sales pull UII software into the same hospital accounts, so the AI is sold alongside or embedded in scanners the buyer is already purchasing. Domestic vendors more broadly benefit from China''s centralised health data and very large patient volumes, which provide a training-data advantage over Western entrants who face data-localisation barriers. Chinese hospitals adopt AI mainly to relieve the radiologist shortage, standardise diagnosis and satisfy national digital-health mandates, which aligns demand with exactly the applications UII leads in.'
