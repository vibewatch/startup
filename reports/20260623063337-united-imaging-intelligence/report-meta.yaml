companyProfile:
  summary: United Imaging Intelligence (UII) is a private Shanghai medical-AI company founded in December 2017 as the dedicated AI subsidiary of Shanghai-listed United Imaging Healthcare (UIH, 688271.SH). Its uAI platform spans 12 product platforms and more than 100 AI applications across CT, MR, PET/CT, X-ray, and ultrasound, with a 2025 pivot toward the multimodal medical foundation model "Yuanzhi" and the uAI NEXUS suite. Public evidence supports a deep regulatory portfolio (13 NMPA Class III, 15 FDA, 31 CE), deployment across more than 4,000 Chinese institutions, and a June 2025 Series A near a $1.4 billion valuation, but the company discloses no standalone revenue, margin, headcount, or cap-table terms.
  foundedDate: '2017-12-01'
  founders:
    - name: Xiang "Sean" Zhou
      role: Co-founder & (co-)CEO
      background: Long-time medical-imaging and machine-learning researcher who is UII's public strategy voice and legal representative.
      claimRefs: [CO008]
    - name: Dijia Wu
      role: Chief Technology Officer
      background: Senior medical-AI researcher leading UII's model and platform engineering across the uAI suite.
      claimRefs: [CO009]
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: uAI software suite spanning disease detection, quantification, automated reporting, and clinical-workflow apps delivered through the uAI Clinical Portal, plus the Yuanzhi multimodal foundation model and uAI NEXUS image, language, speech, and video models, running both embedded on UIH scanners and on third-party hardware.
  customerFocus: Hospitals and medical institutions, especially Chinese Tier-3 hospitals, leveraging parent UIH's installed imaging-equipment base, with growing European and US deployment.
  businessModel: AI software sold into healthcare institutions, monetized as an attach to imaging workflows and the parent's equipment channel; standalone pricing and revenue model are not publicly disclosed.
  stage: Series A private
  fundingStatus: ~RMB 1 billion ($139M) Series A in June 2025 co-led by E Fund Management and Shanghai Guotou at roughly a $1.4 billion post-money valuation, with parent UIH participating; prior rounds and total lifetime funding are not publicly disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO007, CO008, CO009, CO013, CO016, CO018, CO021, CO031, CV001, CV003]
summary:
  headline: United Imaging Intelligence has genuine state-backed deployment scale and a credible platform, but public evidence leaves the ~$1.4B mark hard to underwrite without any standalone economics.
