- id: partner-and-dependency-risk
  title: Partner, dependency, and concentration risk
  body: 'UII''s most distinctive structural risk is its dependence on parent United Imaging Healthcare. UIH supplies the hardware channel that carries embedded uAI into hospitals, much of the brand and global service footprint, a large share of the installed base, and - through the broader group - capital and strategic direction. This concentration is a double-edged mitigant: the parent''s RMB 13.80 billion 2025 revenue and strong balance sheet de-risk financing and distribution, but they also mean the customer relationship, pricing power, and even regulatory fate of UII are only partly its own, and any shock to UIH - a 1260H listing, an export restriction, a demand slump under value-based procurement - transmits directly to the subsidiary. State-linked ownership and investors add political-alignment risk that cuts both ways: domestic preference in China, heightened suspicion in the US.


    Beyond the parent, dependency risk includes reliance on a small set of foundation models and the uAI Clinical Portal as the single platform through which value is delivered, on hospital procurement budgets pressured by China''s value-based procurement, and on capital providers for the next financing round. Customer-concentration magnitude is unknown because UII discloses no top-account revenue split, so single-account or single-channel dependence is a material open item. The dependency map and register below trace each critical counterparty - parent, regulators, key hospitals, capital providers, and platform components - to a failure scenario, a severity rating, and a diligence path, with loss of parent support or a binding US designation as the clearest dependency thesis-breaks.'
  claimRefs:
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
