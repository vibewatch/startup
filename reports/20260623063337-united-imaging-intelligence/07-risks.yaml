- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: 'Regulatory exposure is UII''s defining risk, and it runs in two directions. In China, the NMPA classifies high-risk diagnostic and decision-support AI as Class III - the highest-risk tier - requiring mandatory clinical evaluation with locally representative data, statistical robustness, predefined change-control for evolving or self-modifying algorithms, and compliance with PIPL, the Data Security Law, and the Cybersecurity Law for any patient data used in training or validation. The NMPA''s 2025-2026 standards programs and high-end-device guidance keep moving the goalposts toward international alignment while preserving China-specific clinical and cybersecurity demands, so each new uAI application and each model update is a fresh regulatory project, not a one-time clearance. Health-data localization and cross-border-transfer security assessments further constrain how UII can train models on multi-site data or serve overseas customers from Chinese infrastructure.


    On the US and allied frontier, legal risk is escalating. The BIOSECURE Act became law on 18 December 2025 as Section 851 of the FY2026 NDAA, restricting federal agencies and federally linked contractors and grant recipients from procuring "biotechnology equipment or services" from designated "biotechnology companies of concern," with the OMB list due by December 2026 and Department of Defense Section 1260H "Chinese military company" designations already expanding in 2026. Even before a specific UII or UIH designation, the chilling effect plus FDA supply-chain and cybersecurity scrutiny of Chinese-origin devices can slow procurement at federally funded US hospitals. Direct IP litigation naming UII is not found in the public record, but medtech is highly litigious and patent/NPE activity in radiology AI is rising, so the absence of disclosed cases is a diligence gap rather than a clean bill of health.'
  claimRefs:
