- id: operational-and-technical-risk
  title: Operational, quality, and technical risk
  body: 'Operational and technical risk for UII centers on clinical safety, model reliability, and the security of software embedded in hospital imaging workflows. Because uAI applications inform triage, detection, segmentation, and reporting, a false negative or a model that fails to generalize from training data to a new hospital''s scanners, protocols, or patient mix can cause clinical harm and regulatory action; NMPA change-control rules mean that fixing or updating a deployed model is itself a governed, evidence-heavy process rather than a quiet patch. The newest autonomous agents shown at RSNA 2025 and ECR 2026 raise the stakes because higher autonomy widens the gap between demonstrated benchmark performance and accountable, real-world clinical behavior, and independent production-grade validation at named sites remains limited.


    Cybersecurity and data-handling are the second operational axis. Systems integrated into hospital PACS/RIS and, in some cases, native to UIH scanners create an attack surface and a patient-data-protection obligation under PIPL and the Data Security Law; UII discloses little public detail on its security architecture, controls, or incident history, so resilience must be verified rather than assumed. Supply-chain and manufacturing risk sits mostly with the parent UIH hardware business but transmits to UII through bundled deployments and any component or export restriction. The honest read is that UII''s quality and clearance breadth are real mitigants, but utilization-level reliability data, security disclosures, and post-market surveillance evidence are not public and must be obtained, with a confirmed clinical incident or recall as a clear thesis-break trigger.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
