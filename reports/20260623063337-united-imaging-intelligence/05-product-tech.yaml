chapter:
  number: 5
  title: Product and Technology
  summary: United Imaging Intelligence delivers a unified medical-AI platform (uAI) that spans imaging analysis, diagnostic reporting, treatment planning, and hospital operations, increasingly packaged as multimodal "AI agents" rather than single-task tools. The technology rests on multimodal medical foundation models - uAI PLUS and uAI NEXUS - and in 2026 UII open-sourced uAI NEXUS MedVLM, described as the first open-source medical video large language model, accepted to CVPR 2026 with a 531,850-pair MedVidBench dataset, public GitHub code, model weights, and a leaderboard. Products integrate with hospital PACS/RIS, run more than 60 applications through the uAI Clinical Portal, and carry FDA, NMPA Class III, and CE clearances across CT, MR, X-ray, and ultrasound. UII's differentiation is real - open foundation-model leadership, a deep clinical data moat, and vertical co-design with parent UIH hardware - but independent clinical-validation evidence for the newest agents, data-privacy controls, and the open-source-to-revenue path remain under-disclosed.
sections:
- id: product-definition-and-modules
  title: Product definition and module map
  body: 'United Imaging Intelligence delivers a unified medical-AI platform, branded uAI, that operates inside the clinical workflow rather than as a standalone analytics tool. In customer terms, the platform takes an imaging study, runs AI analysis, generates structured diagnostic reports, supports treatment planning, and feeds hospital-operations dashboards. UII describes a portfolio of 12 product platforms and more than 100 AI applications across CT, MR, X-ray, ultrasound, and pathology, deployed through the uAI Clinical Portal (uCP) / uAI Discover, which integrates with hospital PACS and supports more than 60 applications across modalities.


    The most important product shift is from narrow task automation to collaborative "AI agents" that understand, reason, and act across the care pathway. At RSNA 2025 UII showcased uAI Insight, an imaging-to-report agent performing multimodal reasoning and clinical correlation; a uAI Agent for Chest CT Reporting that detects 73 thoracic diseases from a single scan at roughly 95% AUC, and a Brain MRI agent identifying 47 neurological conditions; a uAI Agent for Ultrasound delivered as an embodied robotic arm; and a uAI Avatar assistant plus a hospital-management agent. These agents define the user jobs the platform now targets: faster reporting, autonomous acquisition, patient pre-diagnosis interaction, and operational quality monitoring.'
