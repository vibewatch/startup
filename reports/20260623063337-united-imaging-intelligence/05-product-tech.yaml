- id: architecture-and-operating-model
  title: Architecture and foundation-model operating model
  body: 'UII''s products are powered by multimodal medical large models that integrate clinical language, vision, and speech. The architecture traces to uAI PLUS (Pretrained Large Models for Unified Solutions), debuted at RSNA 2024, which combines medical imaging foundation models, medical LLMs, and multimodal LLMs, and to the newer uAI NEXUS suite. In April 2026 UII open-sourced uAI NEXUS MedVLM, described as the first open-source medical video large language model and accepted to CVPR 2026, signalling research depth recognized by the global computer-vision community.


    The technical core is documented in a public research paper (arXiv:2512.06581). MedVLM is built on MedVidBench, a benchmark of 531,850 video-instruction pairs across eight clinical sources, and is trained through supervised fine-tuning followed by MedGRPO - a reinforcement-learning framework that introduces cross-dataset reward normalization and a medical-LLM judge to prevent training collapse. Despite using only 4B and 7B parameters, the model outperforms much larger general-purpose models such as GPT-5.4 and Gemini 3.1, reaching 89.4% accuracy on surgical-safety assessment versus 1.8% for GPT-5.4. UII released open code on GitHub (UII-AI/MedGRPO-Code), model weights, the MedVidBench dataset, and a public leaderboard. In production, the same model lineage feeds applications that integrate DICOM ingestion, AI analysis, structured reporting, and PACS/RIS connectivity rather than operating as isolated point tools.'
