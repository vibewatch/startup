- id: financial-verdict-and-blockers
  title: Financial verdict and diligence blockers
  body: 'The most supportable underwriting view is that UII has strong capital access and a powerful parent, but is not yet cleanly underwritable as a standalone entity. The positives are real: a USD 139 million Series A at an approximately USD 1.4 billion valuation, a deployed base of more than 4,000 institutions, a top-five global FDA clearance position, and a parent generating RMB 13.80 billion of audited 2025 revenue and RMB 1.87 billion of profit. The strongest public financial signal is the combination of that Series A and the parent''s audited growth - not any standalone UII statements, which do not exist publicly.


    The risks are equally concrete. The primary diligence blockers are undisclosed standalone revenue, gross margin, burn, runway, and retention. Peer evidence is cautionary: Airdoc''s 2025 annual report warned that commercialization remains at risk despite NMPA Class III approval, and analysts expect breakeven only around 2026 on roughly 102% revenue growth - a reminder that Chinese medical-AI monetization is hard and reimbursement support is absent. The net read is high confidence in capital access and parent strength, moderate confidence in deployment scale, and low confidence in standalone unit economics and solvency. Any investment case should treat standalone revenue quality, margin path, and the parent-dependency structure as first-order diligence items rather than cleanup questions.'
