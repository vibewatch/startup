- id: capital-adequacy-and-financing
  title: Capital adequacy and financing dependency
  body: 'Capital access is the strongest part of UII''s public financial picture. The company closed a Series A of about RMB 1 billion (roughly USD 139 million) in June 2025, co-led by E Fund Management and Shanghai Guotou (SIG) with Shanghai United Investment and others participating. The round implied a pre-money valuation of about RMB 9 billion (~USD 1.3 billion), an approximately USD 1.4 billion post-money mark. Management has said proceeds will fund large medical-AI model R&D, multimodal medical agents spanning imaging, text and voice, and hospital digital and intelligent business systems, and UII is reportedly considering an independent listing.


    The balance-sheet picture stops where underwriting needs to begin. UII discloses no cash on hand, monthly burn, or runway, and no public debt or project-finance obligations are recorded. Funding chronology is covered in the Company Overview chapter; for financial purposes the relevant facts are restated here as local claims with their own sources. Relative to global peers the round is modest - Aidoc alone has raised more than three times UII''s Series A - but the 2026 China capital environment is supportive and the parent provides a deep balance sheet and channel. The financial dependency on UIH (shared R&D, consolidated reporting, and the hardware sales channel) is simultaneously UII''s biggest asset and a concentration risk, since a stand-alone investor cannot isolate UII''s solvency from the parent.'
  claimRefs:
  - CI022
