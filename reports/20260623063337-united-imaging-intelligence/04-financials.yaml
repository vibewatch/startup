company:
  name: United Imaging Intelligence
chapter:
  number: 4
  title: Financials
  summary: United Imaging Intelligence (UII) is the privately funded medical-AI subsidiary of listed United Imaging Healthcare (UIH, 688271.SH), and the public financial record is almost entirely about the parent rather than the subsidiary. UIH disclosed RMB 13.80 billion of 2025 revenue (up 33.98%), RMB 1.87 billion net profit, and RMB 2.62 billion of R&D, anchoring UII's resourcing and channel. UII itself raised a roughly RMB 1 billion (~USD 139 million) Series A in June 2025 at an approximately USD 1.4 billion valuation, but discloses no standalone revenue, ARR, gross margin, burn, or runway. Its AI is monetized by bundling into UIH scanners and by selling uAI software to 4,000-plus institutions, yet China has no national AI-software reimbursement line, and loss-making listed peers such as Airdoc show how hard medical-AI monetization is. The result is high confidence in capital access and parent strength, but low confidence in standalone unit economics and solvency.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization architecture
  body: 'United Imaging Intelligence operates as the independently financed medical-AI arm of listed parent United Imaging Healthcare (UIH, 688271.SH), monetizing software and clinical-AI applications rather than imaging hardware. As a private subsidiary it discloses no standalone revenue, ARR, or net income, so its revenue architecture must be reconstructed from product disclosures and the parent''s filings. UII monetizes its AI through two visible channels: applications embedded in or bundled with UIH scanners and PACS, and standalone uAI software licenses sold to hospitals. The company reports 12 product platforms and more than 100 AI applications deployed across over 4,000 medical institutions, supported by 13 NMPA Class III certificates, 15 FDA clearances and 31 CE certifications as of mid-2025.


    What is not public matters as much as what is. UII publishes no per-study or per-seat list pricing; like most Chinese imaging-AI vendors it sells through hospital procurement or equipment bundling, which obscures realized pricing and standalone revenue attribution. Its fifth-place ranking on the FDA''s Q1-2026 radiology-AI authorization list (about 40 cleared devices) signals sustained product and R&D investment, but clearance breadth is an input proxy, not a revenue figure. The revenue model is therefore directionally legible - bundled-plus-standalone software into a large installed base - while the quality and scale of that revenue remain hidden inside the parent''s consolidated accounts.'
