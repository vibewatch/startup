  - type: missing-source
    severity: material
    topic: head-to-head
    missingEvidence: Public head-to-head clinical or commercial displacement data for UII versus named competitors.
    whyItMatters: Without win/loss or accuracy comparisons, UII's competitive superiority claims cannot be independently verified.
    diligencePath: Request UII competitive win-rate data, bake-off results, and independent benchmark studies against named peers.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP002
  - type: conflicting-data
    severity: minor
    topic: pricing
    missingEvidence: Transparent per-study or per-seat pricing for UII and its Chinese peers.
    whyItMatters: Bundled procurement and opaque pricing make it impossible to compare real competitive pricing power.
    diligencePath: Request representative contract values and discount structures across vendors and hospital tiers.
    relatedQuestionRefs:
