    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: valuation-comp
    missingEvidence: Comparable revenue multiples reconciling UII's ~$1.4B mark with listed Airdoc and global pure-plays.
    whyItMatters: A premium over listed peers must be justified by superior growth or moat, which public data does not yet confirm.
    diligencePath: Build a peer revenue-multiple comparison once UII discloses standalone revenue.
