- id: capability-pricing-comparison
  title: Capability, pricing, and distribution comparison
  body: 'On regulatory and clearance scale, the platform incumbents lead by a wide margin. The FDA''s Q1-2026 list shows GE HealthCare first with 130 radiology-AI authorizations, then Siemens Healthineers (95), Philips (58) and Canon (48); United Imaging ranks fifth with 40, ahead of Aidoc (33). Among global pure-plays, Aidoc raised a USD 150 million Series E in April 2026 led by Goldman Sachs, bringing total funding above USD 500 million, and runs the aiOS enterprise platform and CARE clinical foundation model - the latter receiving a first FDA clearance for a comprehensive foundation-model triage system, deployed across nearly 2,000 hospitals analyzing more than 60 million cases a year. Viz.ai has raised about USD 252 million at a USD 1.2 billion valuation, reached roughly 1,600-2,000 hospitals, and leads CMS-reimbursed large-vessel-occlusion stroke detection. Annalise.ai, now a Harrison.AI subsidiary, differentiates on breadth, covering 124-plus chest X-ray findings and 130-plus CT-brain findings in single tools.


    The capital and monetization picture exposes UII''s competitive gap. Analyst commentary notes that capital is shifting toward enterprise-infrastructure AI vendors with scale, regulatory depth and workflow ownership rather than single-use tools, and Aidoc alone has now raised more than three times UII''s roughly USD 139 million Series A. In the US, CMS reimbursement - including new 2026 billing codes for coronary and aortic calcium analysis - is a major commercial driver, and Viz.ai is CMS-reimbursed and profitable; no equivalent national AI reimbursement exists in China, so US pure-plays can run SaaS subscription models that Chinese vendors largely cannot.


    Pricing in China is opaque: most vendors sell through hospital procurement or bundle AI with equipment rather than publishing per-study prices. UII''s differentiation is vertical integration - AI embedded in UIH scanners and PACS plus a broad uAI portfolio - but its relative limitation versus Aidoc and Viz.ai is a less open, less flexible enterprise-wide software-integration story outside its own hardware.'
