      of magnitude.
    whyItMatters: Order-of-magnitude disagreement among publishers means no single TAM can anchor growth or valuation assumptions.
    diligencePath: >-
      Triangulate analyst methodologies and prefer the narrowest directly comparable China imaging-software lens over
      broad healthcare-AI pools.
    relatedQuestionRefs:
      - QM012
      - QM003
    relatedTableRefs:
      - TM002
