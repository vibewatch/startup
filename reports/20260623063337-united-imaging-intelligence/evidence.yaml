evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: UII's standalone revenue, ARR, gross margin, and burn rate.
    whyItMatters: >-
      UII is valued near $1.4 billion, but public evidence exposes no standalone financials, so the valuation cannot be
      underwritten on operating metrics.
    diligencePath: Request audited UII financials or board reporting separating UII results from parent UIH.
    relatedQuestionRefs:
      - QO014
      - QO025
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Post-Series-A board roster, investor rights, and related-party terms with parent UIH.
    whyItMatters: >-
      Governance and parent control are central to assessing key-person and related-party risk, yet board composition
      and cap-table terms are not public.
    diligencePath: Request the cap table, shareholders' agreement, and related-party transaction schedule with UIH.
    relatedQuestionRefs:
      - QO008
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      A definitive co-lead and full investor list reconciling E Fund + Shanghai Guotou vs reposts citing SIG Property
      Management.
    whyItMatters: Slightly different investor naming across sources affects how state-linked the syndicate is judged to be.
    diligencePath: Confirm the syndicate and stakes against the official cap table and AMAC filing.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current employee count and the precise R&D-staff share.
    whyItMatters: Headcount and R&D intensity bear on burn, scalability, and key-person dependence.
    diligencePath: Request HR headcount by function and recent hiring/attrition data.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: >-
