    severity: material
    topic: reimbursement
    missingEvidence: A national framework or codes that reimburse AI imaging software in China beyond province-level pilots.
    whyItMatters: >-
      Absent a reimbursement line, AI cost is absorbed in hospital budgets, which caps paid scale-up and pressures
      realized revenue.
    diligencePath: >-
      Request UII data on paid versus bundled deployments and any provincial bundled-payment or add-on-code
      participation.
