chapter:
  number: 6
  title: Customers
  summary: Tripledot’s customer base is best modeled as a mass-market mobile player portfolio sold through app stores and monetized through both direct player spend and advertising counterparties. Public evidence supports meaningful adoption in several evergreen titles and much broader diversification after the AppLovin deal, but retention, title-level concentration, and advertiser-side customer disclosure remain materially under-public.
sections:
- id: consumer-segments-and-channel-structure
  title: Consumer segments and channel structure
  body: |-
    Tripledot's customer base is best understood as a stack of mass-market mobile players acquired through app stores, not as a classic enterprise account list. The visible Android catalog spans 62 apps, more than 500 million cumulative downloads, and a 4.72 average rating on AppBrain, with puzzle still the dominant genre but card, word, and casual adjacencies clearly present. Google Play's live developer page surfaces Woodoku, Solitaire, Blackjack, Sudoku, and Word Hop as emblematic front doors into that base, while the homepage says Tripledot's games entertain millions. That mix implies multiple player archetypes: daily logic-puzzle users, card-routine users, word or brain-training users, and newer audiences added through recent launches and acquired portfolios.

    The buyer, user, and payer roles also split more than the genre labels suggest. In legacy puzzle and card titles, the downloader and the player are usually the same person, and direct spend flows through Apple or Google billing rails rather than through Tripledot's own checkout. At the same time, the privacy notice makes clear that non-paying users still matter because advertising partners, ad exchanges, and related ad-tech firms monetize attention inside the apps. Terms and privacy disclosures also show that Facebook or Apple sign-in, public profiles, leaderboards, and other social features can sit between the player and the game. The result is a customer map with end users at the center, app stores and payment processors as critical distribution and payer intermediaries, and ad-tech counterparties as a second payer class for ad-funded sessions.
