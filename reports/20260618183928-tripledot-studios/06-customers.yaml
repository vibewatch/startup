  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: title-concentration
    missingEvidence: Title-level DAU, revenue, payer conversion, and gross-profit contribution by game are needed to verify whether the post-AppLovin portfolio is genuinely diversified or still dominated by one or two legacy hits.
    whyItMatters: The public claim that no single game exceeds 10% of net revenue materially changes how resilient the customer base looks, but outside sources cannot verify it.
    diligencePath: Request a post-close top-title dashboard with monthly DAU, revenue, payer conversion, and gross margin by game and by geography.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: platform-and-advertiser-mix
    missingEvidence: Named advertising or mediation partners, platform revenue share, referral mix, and install or billing dependence by Apple, Google, and Facebook-connected flows are missing from the public record.
    whyItMatters: Customer quality depends on whether Tripledot controls distribution and monetization or is materially exposed to a few platforms or ad networks.
    diligencePath: Request platform-by-platform install, revenue, and billing splits plus a mediation-stack and top-network concentration table for legacy and acquired titles.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-curves
    missingEvidence: Public sources do not provide title-level D1, D7, D30, payer conversion, reactivation, churn, or spend-retention curves for any major Tripledot title.
    whyItMatters: Repeat-use features and update cadence are directionally helpful, but they are not enough to underwrite durability or lifetime value with investor-grade confidence.
    diligencePath: Request cohort dashboards for Woodoku, Solitaire, Blackjack, Spades, and the largest acquired titles, including payer and non-payer retention.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A broader, more representative set of named player testimonies or case studies across titles is needed to move beyond three Woodoku review anecdotes.
    whyItMatters: The current table proves real production usage and recent friction, but it is too narrow to serve as a balanced, diligence-grade view of the customer base.
    diligencePath: Expand the sample with retained app-store reviews across more titles, customer-survey outputs, or direct player-research materials from management.
    relatedQuestionRefs:
    - QU012
    - QU024
    relatedTableRefs:
    - TU003
