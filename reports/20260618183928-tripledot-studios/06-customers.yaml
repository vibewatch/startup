- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Evidence
  - Upside
  - Concentration / channel risk
  - Impact
  - Diligence path
  rows:
  - - Portfolio diversification after AppLovin
    - 25M DAU, 12 studios, more than 25 live games, and a no-single-game-above-10%-of-net-revenue claim
    - Broader customer mix and lower headline single-title dependence
    - Public claim is not backed by title-level revenue or DAU disclosures
    - If wrong, legacy hits may still dominate economics
    - Request top-title revenue, DAU, and payer-contribution table post-close
  - - U.S. and Asia expansion
    - Deal coverage says the transaction expands Tripledot into key strategic markets including the U.S. and Asia
    - Broader geographic audience and monetization reach
    - Public record does not show country-level bookings or platform mix
    - Regional concentration could still be hidden
    - Request geography-by-title DAU and bookings bridge
  - - App-store and billing rails
    - Privacy and terms say Apple, Google, and social-platform accounts are embedded in account access and payments
    - Efficient global distribution without building direct checkout
    - High dependence on platform rules, fees, and ranking algorithms
    - Policy changes can hit acquisition and monetization simultaneously
    - Request platform share of installs, revenue, and paid UA spend
  - - Advertising partners as payers
    - Privacy notice confirms ad exchanges and ad-tech companies are part of the monetization stack
    - Non-paying users can still monetize through IAA
    - No named advertiser, mediation, or demand-partner concentration is disclosed
    - A small number of networks could carry outsize economic weight
    - Request mediation stack, top-network share, and advertiser concentration by acquired title
  - - Social / community loops
    - Public profiles, leaderboards, Facebook competition, and chat or messaging are mentioned in policy and app pages
    - Supports lighter-weight expansion and replay without pure paid acquisition
    - No evidence shows how much traffic is actually social or organic
    - Community features may be marginal rather than core
    - Request referral, invite, and organic-install attribution data
  - - Legacy flagship dependence
    - Woodoku still dwarfs many long-tail titles on public install and review proxies
    - Strong anchor title supplies durable audience
    - Public sources still do not show how much revenue depends on Woodoku specifically
    - A monetization or store-ranking shock could still hurt the base
    - Request title P&Ls, by-game cohorts, and scenario analysis for Woodoku downside
  notes: Upside and risk are paired deliberately because Tripledot’s post-deal customer story is public at the portfolio level but still opaque at the title and channel level.
