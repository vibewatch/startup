- id: expansion-monetization-and-concentration
  title: Expansion, monetization, and concentration
  body: |-
    The AppLovin transaction changes the customer story from a handful of legacy casual hits to a broader global portfolio with both direct-spend and ad-funded economics. Business Wire and GamesBeat describe a combined company with more than 25 live games, around 25 million daily active users, nearly $2 billion of annual gross revenue, 12 studios, and explicit expertise in both in-app purchase and in-app advertising models. That materially broadens Tripledot's likely audience beyond puzzle-heavy solo players and should improve customer diversification across genres, geographies, and monetization styles. Independent deal coverage also frames the transaction as a way to deepen Tripledot's reach in the U.S. and Asia.

    But concentration and channel risk remain materially under-disclosed. Management says no single game should exceed 10% of post-close net revenue, yet public sources do not show title-level DAU, payer conversion, or revenue by game. The privacy notice confirms that advertising partners matter and the terms confirm that Apple, Google, and social-platform accounts are embedded in the operating flow, but the public record does not name advertiser customers, quantify mediation dependence, or break revenue by platform. The right diligence stance is therefore balanced. Tripledot looks diversified enough to matter, and newer titles like Spades show that the catalog can still add audience, but the evidence base is still dominated by app-store proxies and portfolio-level press claims rather than revenue-grade customer analytics.
