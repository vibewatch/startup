  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Channel / geography signal
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Legacy puzzle flagship
    - Buyer=user=player; payer=player plus ad-supported non-payers
    - Global app-store distribution; visible on Google Play and AppBrain
    - Daily logic and relaxation loop
    - Woodoku at 130M lifetime downloads and 432K Google Play reviews
    - Flagship attention anchor with both spend and ad-yield potential
    - No DAU, payer conversion, or geography split by title
  - - Evergreen card routine
    - Buyer=user=player; payer=player plus ad-supported non-payers
    - Google Play mass-market card segment
    - Habitual solitaire sessions and daily challenges
    - Solitaire at 51M lifetime downloads and 560K last-30-day downloads
    - Second large evergreen audience reduces dependence on one puzzle hit
    - No disclosed spend mix or session depth
  - - Social-casino-adjacent practice play
    - Buyer=user=player; payer=player plus advertisers
    - Card category with no-real-money positioning
    - Risk-free blackjack training and casual table play
    - Blackjack at 6.8M lifetime downloads and 130K last-30-day downloads
    - Adds card reach without regulated wagering exposure
    - No public monetization or demographic split
  - - Word / logic routine
    - Buyer=user=player; payer=player or advertiser
    - Google Play plus multilingual word audience
    - Daily decoding, crossword, and brain-training loops
    - Cryptogram and Word Hop add daily challenge, leaderboard, and multi-language surfaces
    - Broadens use case from pure puzzle into repeat word play and social loops
    - No hard public title-level usage metrics for Word Hop or Cryptogram
  - - Long-tail classic puzzle niche
    - Buyer=user=player; payer=player or advertiser
    - Android app-store long tail
    - Classic sudoku play with hints, stats, and autosave
    - Sudoku shows only 54K lifetime downloads and about 120 last-30-day downloads
    - Illustrates catalog breadth even when a title is not a scaled winner
    - Very limited public proof on retention or economics
  - - Acquired diversified IAP / IAA portfolio
    - User=player; payer=player and advertiser
    - Post-deal reach into the U.S., Asia, and additional studios
    - Broader casual, hybrid-casual, and ad-funded title mix
    - 25M DAU and nearly $2B gross revenue claims after the AppLovin deal
    - Main expansion vector away from single-title legacy concentration
    - No public advertiser list or title-level mix across acquired apps
  notes: Segment rows mix legacy Tripledot titles with the post-AppLovin audience layer; scale signals are public proxies, not audited customer counts.
