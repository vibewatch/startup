      claimRefs: [CO005, CO006]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    A portfolio of casual and puzzle-led mobile games distributed through app stores, including legacy titles such as
    Woodoku, Solitaire, Blackjack, Sudoku, Triple Tile, and Word Hop, plus the studios and franchises acquired from
    AppLovin including Wordscapes, Project Makeover, Cooking Madness, and Mobile Strike.
  customerFocus: >-
    Mass-market mobile players across casual puzzle, card, word, and adjacent genres; after the AppLovin deal the
    company also serves advertising-supported and mixed-monetization audiences across a broader studio portfolio.
  businessModel: >-
    Free-to-play mobile gaming monetized through a mix of in-app purchases and, after the AppLovin portfolio deal,
    a broader in-app advertising plus IAP model across multiple studios and titles.
  stage: late-stage private
  fundingStatus: >-
    At least $202 million of disclosed pre-acquisition equity financing across the 2018, 2021, and 2022 rounds,
    followed by the 2025 AppLovin portfolio acquisition structured around $400 million cash at close plus roughly
    20% Tripledot equity, with public evidence of secured financing via a Bank of America collateral-agent charge.
