      role: Co-founder and CEO
      background: Gaming operator previously associated with Product Madness and the scale-up of social casino titles.
      claimRefs: [CO005, CO006]
    - name: Akin Babayigit
      role: Co-founder
      background: Casual-games operator previously linked in public reporting to Peak Games and King.
      claimRefs: [CO005, CO006]
    - name: Eyal Chameides
