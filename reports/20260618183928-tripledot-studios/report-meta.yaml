  topStrengths:
    - Profitable pre-deal operating history and a demonstrably scalable casual-games platform.
    - Post-AppLovin portfolio breadth reduces single-title concentration and adds IAP plus IAA monetization capabilities.
    - Public scale claims of 12 studios, 23 cities, 25M+ DAU, and nearly $2B gross revenue place Tripledot in a real global peer set.
    - The implied ~$2.0B post-close mark remains below larger strategic mobile-gaming precedents like Scopely and Zynga.
  topRisks:
    - Public scale is framed in gross revenue rather than audited net revenue, EBITDA, or free cash flow.
    - Post-close debt terms and covenant headroom remain opaque despite the Bank of America charge signal.
    - Current cap table, liquidation preferences, and AppLovin governance rights are not publicly disclosed.
    - Integration complexity rose sharply after absorbing 10 studios and a much broader product mix.
    - Platform, privacy, and ad-load risks remain material in a mature mobile-games market.
  unresolvedGaps:
    - Audited 2025 net revenue, EBITDA, and a gross-to-net bridge for the combined company.
    - Signed debt documents, current principal balance, maturity profile, and covenant package.
    - Current cap table and liquidation preferences, including AppLovin's exact information or governance rights.
    - Title-level revenue, DAU, retention, and gross-to-net mix across the acquired and legacy portfolio.
    - Full board composition, committee structure, and post-close integration ownership.
