    missingEvidence: Current CPI, ROAS, and retention by platform, geography, and channel for Tripledot’s major titles.
    whyItMatters: >-
      Public category benchmarks show the market economics, but they do not reveal whether Tripledot is outperforming or
      underperforming peers in user acquisition efficiency.
    diligencePath: >-
      Request channel-level UA dashboards, cohort retention curves, and paid-versus-organic install mix for the top
