evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      A current board roster, committee structure, and executive org chart that explains founder roles and outside
      directors after the AppLovin close.
    whyItMatters: Later chapters cannot assess control, key-person dependence, or oversight quality from the public record alone.
    diligencePath: >-
      Request the latest board deck, org chart, and governance memo covering founder responsibilities and
      independent-director roles.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-acquisition-financing
    missingEvidence: >-
      A live shareholder register, AppLovin equity terms, any refinancing of the originally filed promissory note
      structure, and the underlying debt documents tied to the Bank of America charge.
    whyItMatters: >-
      Recommendation quality depends on knowing whether current ownership, leverage, and counterparty rights materially
      changed when the acquisition closed.
    diligencePath: >-
      Request the current cap table, the signed acquisition financing package, and any note payoff or amendment
      documents.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-completeness
    missingEvidence: >-
      A complete internal chronology covering every financing date, studio integration milestone, leadership change, and
      any adverse operating event after the acquisition.
    whyItMatters: >-
      The public milestone record is good enough for a high-level overview but not complete enough to serve as a
      diligence-grade operating history.
    diligencePath: >-
      Request an internal milestone log spanning formation, all financings, product launches, studio integrations, and
      governance changes.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: title-level-revenue-mix
    missingEvidence: >-
      Title-level DAU, bookings, and revenue concentration data proving the post-close claim that no single game
      contributes more than 10% of net revenue.
    whyItMatters: >-
      The investment case changes materially if reported diversification rests on one or two aging flagships rather than
      on a broad portfolio of resilient titles.
    diligencePath: >-
      Request post-close title P&Ls, cohort retention by flagship title, and the monthly dashboard management uses to
      track concentration.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: precise-sam
    missingEvidence: >-
      A public market study that isolates puzzle, card, word, and hybrid-casual spend on mobile while clearly separating
      in-app purchase revenue from advertising revenue.
    whyItMatters: >-
      Without a boundary-clean public dataset, the chapter can only show layered revenue proxies instead of a single
      precise SAM or SOM percentage.
    diligencePath: >-
      Request Tripledot management’s internal market-sizing deck or a commissioned third-party study with explicit
      inclusion and exclusion rules.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM010
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization-mix
    missingEvidence: >-
      Post-acquisition title-level revenue split by IAP versus IAA, broken out by legacy Tripledot titles, acquired
      AppLovin titles, geography, and platform.
    whyItMatters: >-
      This is the key evidence needed to judge whether the AppLovin acquisition materially widened Tripledot’s served
      market or mainly increased scale inside its existing niches.
    diligencePath: >-
      Request a monthly post-close revenue bridge, top-title concentration table, and monetization-mix dashboard from
      management.
    relatedQuestionRefs:
      - QM009
      - QM013
      - QM015
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
