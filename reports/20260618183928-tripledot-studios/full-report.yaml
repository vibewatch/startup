  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Tripledot's main risks transmit into value through revenue durability, margin flexibility, and strategic freedom
      rather than through one isolated failure mode.
    data:
      nodes:
        - label: Platform enforcement
          note: Store rules and billing requirements can directly affect release cadence and monetization
        - label: Privacy / children compliance
          note: Ad-tech and audience rules can escalate from disclosure gaps into policy action
        - label: Player sentiment & QA
          note: Ad load, crashes, or fairness perceptions can hit retention before reported revenue moves
        - label: Integration complexity
          note: More studios, titles, and tools widen execution risk
        - label: Financing opacity
          note: Unknown lender terms can limit flexibility even if the business remains profitable
        - label: Revenue durability
          note: Distribution, retention, and title mix determine whether scale is stable
        - label: Margin flexibility
          note: Billing rules, UA costs, and partner take-rates affect monetization quality
        - label: Strategic flexibility
          note: Debt terms and integration burden can constrain future M&A or operating moves
        - label: Valuation multiple
          note: Residual uncertainty pushes investors to apply a discount even if growth persists
      edges:
        - from: Platform enforcement
          to: Revenue durability
          label: Distribution or billing friction can hit bookings
        - from: Privacy / children compliance
          to: Margin flexibility
          label: Ad and data constraints can lower monetization efficiency
        - from: Player sentiment & QA
          to: Revenue durability
          label: Retention weakens when ads or bugs degrade experience
        - from: Integration complexity
          to: Player sentiment & QA
          label: More codebases and teams increase release and QA risk
        - from: Integration complexity
          to: Strategic flexibility
          label: Management bandwidth is absorbed by portfolio control
        - from: Financing opacity
          to: Strategic flexibility
          label: Unknown covenants may limit capital allocation
        - from: Revenue durability
          to: Valuation multiple
          label: Weaker durability lowers confidence
        - from: Margin flexibility
          to: Valuation multiple
          label: Lower monetization quality compresses valuation
        - from: Strategic flexibility
          to: Valuation multiple
          label: Constraint risk increases discount rate
