      - number: '1.3'
        title: Portfolio footprint and operating scale
        blocks:
          - type: paragraph
            body: >-
              Open-platform evidence supports the view that Tripledot is more than a one-hit studio. Google's developer
              page visibly clusters well-known casual titles such as Woodoku, Solitaire, Blackjack, Sudoku, and Word Hop
              under the Tripledot banner. AppBrain goes further, tracking 62 Android apps and showing Tripledot ranking
              in the top 100 across more than ten countries. Woodoku remains the clearest flagship signal inside that
              broader portfolio: AppBrain estimates roughly 130 million downloads and about 430 thousand ratings, while
              Google Play shows roughly 432 thousand reviews. At the same time, the surrounding app pages demonstrate
              genre spread rather than dependence on a single mechanic, with offline solitaire, fair-random-dealing
              blackjack, and daily challenge word-logic gameplay all visible in the live catalog.


              The AppLovin portfolio acquisition lifts those product signals into a much larger operating-footprint
              story. GamesBeat and Business Wire said the combined company would have 12 studios across 23 cities, more
              than 2,500 team members, more than 25 live games, about 25 million daily active users, and nearly $2
              billion of annual gross revenue. GamesBeat also listed the pre-deal office network as London, Warsaw,
              Minsk, Barcelona, Jakarta, and Melbourne, illustrating that Tripledot was already internationally
              distributed before absorbing another 10 studios. The scale story is therefore plausible and directionally
              well supported. What remains unverified in public is the title-level mix beneath it: Woodoku looks very
              large, but management's claim that no single game exceeds 10% of net revenue still needs internal
              dashboards rather than external app-store proxies.
