  - id: FU001
    title: Customer journey map
    type: flow
    layout: standard
    summary: >-
      Tripledot’s visible customer journey starts with app-store discovery, branches into payer and non-payer paths, and
      reconnects through support and social features that can drive repeat use.
    data:
      nodes:
        - label: App-store discovery
          note: Google Play and AppBrain are the clearest public storefronts for Tripledot’s legacy player acquisition.
        - label: First-session loop
          note: Familiar puzzle, card, and word mechanics lower onboarding friction for casual players.
        - label: Repeat-play features
          note: Daily challenges, offline play, stats, autosave, and weekly content are used to build habit loops.
        - label: Player-spend path
          note: Virtual items and offers convert some retained players through Apple or Google billing.
        - label: Ad-funded non-payer path
          note: Advertising partners monetize attention from non-spending sessions inside the apps.
        - label: Community and support layer
          note: >-
            Leaderboards, Facebook competition, public profiles, and support replies keep some users engaged beyond one
            session.
      edges:
        - from: App-store discovery
          to: First-session loop
          label: Discovery becomes install
        - from: First-session loop
          to: Repeat-play features
          label: Simple loop becomes routine
        - from: Repeat-play features
          to: Player-spend path
          label: Retention creates payer opportunity
        - from: Repeat-play features
          to: Ad-funded non-payer path
          label: Retention also creates ad inventory
        - from: Repeat-play features
          to: Community and support layer
          label: Social and service tools reinforce replay
