      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Tripledot’s portfolio suggests four economically distinct but behaviorally related segments. Woodoku is a
              daily logic-puzzle product for adults; Solitaire is a relaxing card habit with offline play and daily
              challenges; Cryptogram extends the same routine into word and codebreaking play; and the post-AppLovin
              footprint adds hybrid-casual and broader ad-monetized loops. Those segments share short-session
              accessibility, but they do not share exactly the same payer architecture.


              In pure puzzle and card titles, the user and the payer are often the same individual using a small
              household entertainment budget through Apple or Google billing. In ad-led or hybrid-casual loops, the
              player is still the user, but a second payer appears: advertisers buying impressions, rewarded-video
              completions, or other attention inventory. That distinction matters because Business Wire explicitly
              frames the enlarged Tripledot as having expertise in both IAP and IAA models. Market demand should
              therefore be segmented by monetization design as much as by genre.


              Udonis reinforces the value of that lens. Casual games are the dominant source of installs, and casual ads
              also influence mid-core installs, which means the category does not just monetize players directly; it
              also exports acquisition demand and ad inventory across the wider mobile ecosystem. Adoption usually
              begins with low-friction discovery, then converts either into direct spending through progression and
              convenience or into ad yield through repeated non-paying play.
            claimRefs:
              - CM017
