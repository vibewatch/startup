  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Tripledot is not selling a single game to a single audience. Its public product surface shows a portfolio
              system built around short-session mobile entertainment loops for puzzle, card, word, and casual sorting
              players. The official homepage frames the company as a data-driven game creator that equips studios with
              data, tools, and support, while the Google Play developer page and AppBrain show a broad Android footprint
              spanning dozens of apps and multiple genres. Flagship titles illustrate the pattern. Woodoku uses a
              familiar 9x9 logic board, Solitaire and Spades convert classic card play into mobile-friendly sessions,
              Word Hop and Cryptogram provide daily brain-training loops, and Triple Tile, Nut Sort, Blockbash, Car Out,
              Pick Pack, and Get Color expand the portfolio into newer match, sort, and traffic-puzzle formats. The
              player workflow is also consistent across many titles: discover the app in the store, install without
              heavy onboarding, play short rounds including offline in several flagship titles, then return through
              daily challenges, weekly content, hints, leaderboards, or limited-time events. That repetition makes
              Tripledot's product system look like a casual-games operating model that wraps common retention mechanics
              around many genre skins rather than a one-off franchise business. It also lets the company reuse
              discovery, monetization, and support patterns without requiring each title to stand up a completely
              separate operating stack.
