        title: Architecture, studio support, and external dependencies
        blocks:
          - type: paragraph
            body: >-
              The public architecture story is less about a proprietary backend stack than about how Tripledot
              orchestrates mobile distribution, monetization, studio integration, and content cadence. Consumers access
              titles primarily through Apple, Google, and in some cases Amazon payment and distribution rails;
              Tripledot's privacy materials explicitly say those platforms process purchases, while some services also
              rely on Apple Sign-in, Facebook sign-in, imported contacts, and public leaderboards or head-to-head
              features. At the operating-model layer, Business Wire describes a shared support system across marketing,
              product, AI, and monetization, which is consistent with the company's stated ambition to be a data-driven
              multi-studio group rather than only a developer of internally originated casual apps. The AppLovin close
              notice and AppLovin 8-K add an important technical-operations detail: ten studios transferred to Tripledot
