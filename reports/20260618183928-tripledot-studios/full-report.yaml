      - number: '4.2'
        title: GTM motion, cost structure, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Tripledot’s go-to-market motion looks like classic scaled mobile gaming rather than enterprise sales:
              performance marketing, live operations, app-store distribution, and portfolio cross-promotion. Management
              told PocketGamer that 2021 growth came from diversifying titles and using strong marketing plus live-ops
              capabilities, and InvestGame says the AppLovin deal is supposed to improve user-acquisition efficiency and
              profitability by extending those internal tools across the acquired studios. Udonis and Sensor Tower
              provide the clearest public proxies for what that means economically in 2026: casual installs are still
              available at meaningful but not trivial cost, with Android CPI around $0.63 versus iOS around $2.23,
              overall D7 ROAS around 7.6%, and a market backdrop where sessions and IAP spend are rising even as
              downloads fall.


              That combination makes cost structure more important than category size. Public evidence from Take-Two’s
              mobile-heavy portfolio is useful here even though it is not a Tripledot disclosure. Take-Two says 96.4% of
              net revenue is digital, 79.4% comes from recurrent consumer spending, platform fees are recorded in cost
              of revenue, and mobile gross margin runs below console or PC because Apple and Google take their share
              before publishers see net receipts. It also says player-acquisition spending lives in sales and marketing,
              which means contribution margin can swing quickly with launch cadence and ad-market efficiency.


              InvestGame adds a second proxy from the exact assets Tripledot bought: AppLovin’s gaming apps were a much
              smaller EBITDA contributor than revenue contributor, and margins struggled to get much above 20%. That
              does not prove Tripledot’s post-close margin, but it does support a sober reading. The margin path depends
              less on headline DAU and more on whether Tripledot can improve UA efficiency, ad yield, and live-ops
              retention faster than platform fees, ad load, and portfolio complexity eat the gains.
