      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term drivers are monetization depth and portfolio breadth, not raw download expansion.
              Sensor Tower says casual delivered the largest absolute in-app purchase growth in 2024 and hybridcasual
              IAP revenue grew 37% year over year, while Udonis highlights merge mechanics, mini-games, tournaments, and
              hybrid monetization as active design frontiers. The AppLovin deal matters because it gives Tripledot more
              titles, more geographies, and more operating experience across both IAP and ad-funded models, which should
              improve cross-promotion and reduce dependence on any single hit.


              The constraints are just as real. Newzoo says mobile is slowing in mature markets. Business of Apps shows
              puzzle downloads remain below the 2020 peak. Sensor Tower says developers are refocusing on live
              operations because acquiring fresh audiences is harder in a privacy-centric world, and VentureBeat quotes
              Tripledot management directly on how Apple’s privacy changes reshaped user acquisition. Udonis adds the
              financial expression of that pressure: casual CPI is still meaningful, especially on iOS, while early ROAS
              remains modest.


              Trust is also a real adoption constraint. Current Woodoku reviews complain about intrusive ads, lag, and
              perceived unfairness, and Google Play’s data-safety disclosure shows the extent of activity and
              device-level data flows common in ad-funded mobile games. Meanwhile, scaled incumbents such as King, Jam
              City, Scopely, Zynga, Take-Two, and Playtika show how crowded and capability-intensive this market already
              is. Execution, not category novelty, is the gating variable.
