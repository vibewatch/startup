  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Platform, privacy, and legal risk
        blocks:
          - type: paragraph
            body: >-
              Tripledot's highest-severity external risk is structural reliance on Apple and Google to acquire,
              distribute, bill, and police access to its games. The company's own documents say purchases are processed
              by Apple, Google, or Amazon; users may need social-network or app-store accounts; and users pay app-store
              or connectivity fees to use the service. Apple describes a curated store that reviews apps across safety,
              business, privacy, and legal criteria, while Google requires compliant handling of user data and use of
              Play billing for digital goods. That means Tripledot's monetization is not just commercially concentrated
              on app stores; it is contractually and procedurally routed through them.


              Privacy adds a second layer of risk. Tripledot discloses IDFA or GAID collection, marketing partners,
              social widgets, and cross-device advertising links, so the compliance surface is wider than a single
              first-party game client. The company also says its services are not intended for children under 16, yet
              FTC and ICO guidance shows that general-audience services and online games can still fall into
              child-access obligations. Google reinforces that point through Families rules and ad-SDK requirements. The
              result is a high-impact legal and regulatory perimeter with only medium mitigation maturity: policy text
              exists, but public audit-grade proof of vendor governance, children-risk review, and incident handling
              does not.
