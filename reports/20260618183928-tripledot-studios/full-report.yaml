      - number: '3.2'
        title: 'Peer profiles: incumbents, public operators, and puzzle-first specialists'
        blocks:
          - type: paragraph
            body: >-
              King remains the clearest incumbent benchmark for casual puzzle because Candy Crush still throws off
              billion-dollar annual revenue and the broader King catalog still presents itself as a 200-plus-title
              entertainment platform. Playtika is a different kind of threat: a public company with multi-billion-dollar
              revenue, heavy live-ops discipline, social-casino depth, and an acquisition habit that lets it buy casual
              growth as well as build it. Scopely brings another model entirely, pairing deep community and franchise
              design with sovereign-backed capital after the Savvy acquisition. Jam City has less public financial
              detail in the retained sources, but it still claims billions of installs and a long-running casual
              franchise base. Zynga inside Take-Two matters because the parent explicitly bought a mobile publishing
              platform, not just a set of aging titles, and can now move console and PC IP into mobile with LiveOps and
              ad-tech support.


              Dream Games is the most relevant puzzle-first peer because it shows that focus can still beat breadth when
              execution is sharp enough. Its official pages and Google Play positioning frame Royal Match as polished,
              event-heavy, and ad free, which is a meaningful contrast with ad-supported casual portfolios. Business of
              Apps also keeps Playrix in the frame as a puzzle heavyweight behind Homescapes, Gardenscapes, and Fishdom.
              The result is a two-front competitive challenge for Tripledot: broad multi-studio operators can outspend
