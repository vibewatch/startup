      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Not all the news is negative. Tripledot does have visible mitigants: diversified title mix;
              no-single-game-over-10%-of-net-revenue guidance; current privacy and data-safety disclosures; deletion and
              opt-out mechanisms; encryption-in-transit language; and active app-store support responses. But these are
              mostly policy-surface mitigants rather than audit-grade controls. The public corpus still lacks the signed
              debt package, title-level dashboards, platform incident history, vendor-risk artifacts, and post-close
              governance detail that would convert those mitigants into something fully underwriteable.


              The right investment posture is therefore conditional. Monitor for any app-store enforcement or
              billing-policy dispute, persistent review deterioration on flagship titles, evidence that acquired studios
              require heavy turnaround, or lender terms that materially reduce strategic flexibility. If Tripledot can
              furnish debt documents, board and org-chart transparency, and title-level retention plus monetization
              dashboards, the deal may look like prudent diversification. If it cannot, the residual risk remains high
              because the company has traded single-title concentration for a much larger matrix of platform, privacy,
              financing, and execution exposures.
