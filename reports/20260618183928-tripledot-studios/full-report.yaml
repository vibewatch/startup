      - number: '5.3'
        title: Trust, safety, quality, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public trust and quality disclosures are consumer-mobile oriented rather than enterprise-grade. Positive
              signals exist: the privacy notice is current as of April 2026, the terms of service define accounts,
              virtual items, age gates, and feature terms, Woodoku's Google Play data-safety panel discloses major
              collection and sharing categories, encryption in transit is stated, and users can request deletion. The
              privacy policy also names service providers, analytics, advertising partners, and payment processors,
              which helps identify the real dependency map behind the portfolio. But the quality and compliance picture
              remains incomplete. Tripledot does not publish a public status page, title-level SLA, audit trail, or
              public security certification package, and public reliability evidence therefore comes mostly from store
              reviews and update cadence rather than from audited uptime or incident data. Woodoku's reviews show player
              complaints about lag, unsaved progress, and intrusive ads, while Zephyr-linked privacy and terms pages
              indicate at least some acquired titles still rely on separate controller and advertising-network
              disclosures. The product moat is therefore operational breadth and portfolio diversification, but the
              underwriting risk is dependence on store platforms, advertising ecosystems, and uneven post-acquisition
              policy unification rather than on a clearly disclosed, independently audited control layer.
