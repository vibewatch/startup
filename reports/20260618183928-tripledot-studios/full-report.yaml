      - number: '3.3'
        title: Distribution, monetization, and the real switching costs
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is thin because these businesses do not compete through transparent rate cards.
              The visible comparison is free-to-play packaging: how much content is accessible before friction, whether
              the game leans toward in-app purchases or ads, how hard the event cadence pulls players back, and how well
              a publisher can cross-promote other titles. Playtika's filing is useful here because it quantifies
              platform dependence and shows how exposed even a scaled operator is to Apple, Google, Facebook, and
              payment or policy shifts. Take-Two's Zynga rationale shows another layer of power: once an operator owns
              mobile distribution, ad-tech, and LiveOps muscle, it can deploy those tools across a much wider IP base
              than a standalone studio can.


              For players, switching into a new game is easy; switching out of a habit can be hard. Events, teams,
              leaderboards, castle-renovation progress, social status, and portfolio familiarity create real lock-in
              over time even when download is free. Royal Match's recurring competitions illustrate that dynamic
              cleanly. Tripledot's enlarged catalog helps because it can spread user acquisition and cross-promotion
              across more titles than before, but the same logic favors Zynga, King, and Scopely at even larger scale.
              The competition is therefore less about one-off mechanic novelty and more about who owns enough content,
              monetization expertise, and promotion surface to keep players moving within their own ecosystem.
