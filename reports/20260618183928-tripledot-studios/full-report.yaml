  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Newzoo’s $188.8 billion global games figure is a ceiling, not Tripledot’s market. Tripledot’s visible
              catalog is overwhelmingly mobile casual: the Google Play developer page leads with Woodoku, Solitaire,
              Blackjack, Sudoku, Word Hop, and related titles, while AppBrain tracks 62 Android apps and places 42 of
              them in puzzle. That evidence points to a practical served market of free-to-play casual mobile games,
              especially puzzle, card, word, and adjacent hybrid-casual experiences on iOS and Android, rather than the
              whole games economy.


              The exclusion line matters. Tripledot’s Blackjack listing explicitly says no real money is at risk, so its
              card adjacency is social and free-to-play, not regulated gambling. The company also does not look like a
              hypercasual studio chasing ultra-short title lifecycles. Its store pages emphasize offline play, daily
              challenges, repeat routines, and long-session brain-training or relaxation. TechCrunch’s 2022 interview
              captured the underlying job-to-be-done clearly when management described phone play replacing puzzle books
              and other spare-moment entertainment for users who would not even call themselves gamers.


              In market terms, Tripledot is selling low-friction daily attention. The closest substitutes are other free
              casual apps, puzzle books, card decks, word games, and short-session entertainment habits that compete for
              the same personal downtime. The relevant adjacency set is therefore broader than puzzle IAP alone, but
              still far narrower than total mobile or total games TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
