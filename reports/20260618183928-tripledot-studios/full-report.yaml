chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal shell, and founding story
        blocks:
          - type: paragraph
            body: >-
              Tripledot's public identity is unusually clear at the brand level and slightly messy at the legal-document
              level. The homepage describes a group built around creativity plus data and pitches Tripledot as a
              platform that gives studios tools, insight, and support to produce global mobile hits. Current
              company-controlled address evidence points to London: the careers page lists The Lantern on Hampstead
              Road, and Companies House shows the same address as the registered office for Tripledot Studios Limited.
              The legal shell behind that operating story is older than the marketing narrative. Companies House records
              an active UK private company, number 10245307, incorporated on 22 June 2016 under SIC 58210, while the
              acquisition announcement and later press coverage tell the simpler public story that Tripledot was founded
              in London in 2017 by Lior Shiff, Akin Babayigit, and Eyal Chameides.


              The discrepancy does not necessarily undermine the founding story, but it does matter for diligence
              because it distinguishes operating launch from incorporation. Another disclosure lag reinforces that
              caution: Tripledot's privacy notice was updated in April 2026 yet still names the older Charterhouse Mews
              address as the registered address, even though filing history shows the registered office moved to
              Hampstead Road in July 2023. Governance visibility is also limited. Companies House confirms officer-level
              records and shows Akin Babayigit resigned as director in April 2022, but the website does not explain the
              role of outside directors or publish a board or committee structure. This chapter should therefore anchor
              later work on the registry-backed facts, not on the cleanest marketing shorthand.
