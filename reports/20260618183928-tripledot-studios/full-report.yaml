      - number: '1.4'
        title: How to use this ground-truth set
        blocks:
          - type: paragraph
            body: >-
              For later chapters, the safest reusable facts are the company identity, the disclosed funding arc through
              2022, the existence and broad shape of the AppLovin transaction, and the visible breadth of the
              mobile-games portfolio. Those points are corroborated across registry records, company announcements, the
              AppLovin filing stack, and independent games-industry reporting. By contrast, the chapter should not be
              read as proof of a clean current cap table, settled post-close leverage, or a fully transparent governance
              model. The stale registered address in the 2026 privacy notice shows that Tripledot's public web
              disclosures are not perfectly synchronized, and the shift from a filed promissory-note structure to a
              cash-close announcement shows why transaction summaries alone are insufficient.


              The Woodoku review pattern is also a useful warning for downstream analysis. Scale and download success
              are real, but some current customer-facing evidence points to ad load, lag, and perceived fairness
              friction inside a flagship title. That does not invalidate the broader company story; it simply means
              product quality, monetization intensity, and portfolio resilience need to be tested directly in the
              product and customer chapters. Treat this overview as a strong but not filing-grade identity layer: solid
              enough to anchor facts, but explicit about the ownership, financing, and operating-mix questions that
              still need management materials.
            claimRefs:
              - CO003
              - CO016
              - CO018
              - CO019
              - CO023
