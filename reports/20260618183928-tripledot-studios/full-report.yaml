  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape after AppLovin: Tripledot now competes up the stack'
        blocks:
          - type: paragraph
            body: >-
              The AppLovin transaction materially changed Tripledot's competitive frame. Public deal coverage and the
              closing announcement point to a company with 12 studios, operations across 23 cities, more than 2,500 team
              members, roughly 25 million daily active users, and nearly $2 billion of annual gross revenue. That scale
              means the most relevant peers are no longer just other casual-puzzle builders. Tripledot now overlaps with
              King on puzzle incumbency, with Playtika on data-led live-ops monetization, with Scopely on franchise
              portfolio scale, with Jam City on broad casual catalog competition, with Take-Two/Zynga on diversified
              mobile publishing, and with Dream Games on premium puzzle execution.


              The category backdrop also got tougher, not easier. Sensor Tower says mobile gaming returned to growth in
              2024, but it also says the winning pattern is deeper live services, hybrid monetization, and stronger
              reuse of existing audiences. Business of Apps shows puzzle is still a very large genre, yet one that looks
              mature rather than wide open. In that environment, substitutes are not just direct puzzle clones. They
              include any scaled operator that can buy attention cheaply, cross-promote across a large catalog, port
              known IP to mobile, or retain players through events and habit loops. The practical diligence read-through
              is that Tripledot's real contest is for player time, app-store ranking, user-acquisition efficiency, and
              operating leverage across many studios.
            claimRefs:
