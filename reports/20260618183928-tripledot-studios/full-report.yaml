companyProfile:
  summary: >-
    Tripledot Studios is a London-founded mobile-games company built around data-driven creation and operation of casual
    free-to-play titles. It became a unicorn in 2022 after raising $116 million at a $1.4 billion valuation, then used
    the 2025 acquisition of AppLovin's mobile games portfolio to reposition itself from a fast-growing casual-games
    operator into a multi-studio global consolidator. Public post-close disclosures describe a company with 12 studios
    across 23 cities, more than 2,500 team members, more than 25 million daily active users, and nearly $2 billion of
    annual gross revenue, although audited operating detail remains private.
