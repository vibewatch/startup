      - number: '7.3'
        title: Capital structure and governance risk
        blocks:
          - type: paragraph
            body: >-
              The cleanest diligence blocker is post-close financing opacity. AppLovin's May 2025 8-K announced a
              structure with $150 million cash at close, a $250 million secured promissory note carrying 11% interest,
              broad guarantees, asset pledges, and restrictive covenants. The later AppLovin closing release said the
              transaction actually closed for $400 million in cash plus roughly 20% equity and that no promissory note
              was issued. Companies House then shows an outstanding Bank of America collateral-agent charge created on
              the June 30, 2025 closing date. Together, those sources show that real secured financing sat behind
              closing, but the public record does not reveal current principal, pricing, amortization, or covenant
              headroom.


              Governance visibility is thinner than scale would suggest. Companies House shows Lior Shiff as an active
              director and records multiple resignations, while older press coverage still frames the public leadership
              bench around the original founders. Public materials reviewed do not provide a full post-close board list,
              executive org chart, or risk oversight structure. That makes key-person and integration-governance risk
              material, not because leadership is obviously weak, but because the public evidence base is still too
              shallow for a business this large and newly consolidated.
