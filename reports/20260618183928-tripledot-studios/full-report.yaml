      - number: '3.4'
        title: Moat durability, trust posture, and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence argues against giving any casual-puzzle operator a permanent moat credit. Sensor
              Tower says the category is leaning harder into live services because new audience creation is more
              difficult, and Business of Apps shows puzzle remains large but mature. That means strong operators can
              copy retention structures even when they cannot copy a specific brand. Playtika's 10-K makes the risk more
              explicit on the public side: platform dependence, social-casino enforcement risk, and concentration in a
              few top games all remain material even at multi-billion-dollar scale. On the puzzle side, Business of Apps
              notes that Playrix's Homescapes and Gardenscapes ad creatives were historically sanctioned for
              misrepresenting core gameplay, while current Woodoku reviews show that ad load and performance complaints
              can still erode trust for casual hits.


              Tripledot's moat after the AppLovin deal is therefore organizational, not mystical. If it can reuse data
              science, product judgment, monetization practice, and operating talent across a broader portfolio, it can
              defend itself against both puzzle specialists and scaled public operators. If integration stumbles, then
              the deal simply moved Tripledot into a tougher weight class without giving it a durable new edge. Dream
              Games' ad-free proposition is a particularly useful warning: one strong rival can win by being cleaner,
              not bigger. The diligence conclusion is that Tripledot's competitive durability depends on integration
              quality, player-trust management, and portfolio-level execution more than on any single title or mechanic.
