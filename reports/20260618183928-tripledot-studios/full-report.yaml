  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Down-round or recap
        - Any new disclosed financing below the 2022 $1.4B unicorn reference point
        - Would show that the post-close narrative mark was not durable even before disclosure improved.
        - Move from track to avoid unless new evidence fully explains the reset.
      - - Debt burden worse than assumed
        - Facility documents reveal heavy secured leverage, tight covenants, or refinancing pressure
        - Would mean the current equity story is materially more levered than the headline valuation suggests.
        - Re-cut the valuation as an equity stub rather than a clean enterprise story.
      - - Diversification fails
        - Public or diligence evidence shows one title or studio still dominates economics beyond the stated 10% ceiling
        - Would weaken the main thesis that the AppLovin deal reduced hit concentration risk.
        - Apply a sharper concentration discount and lower scenario upside.
      - - Revenue quality disappoints
        - Audited net revenue or EBITDA proves materially weaker than the gross-revenue narrative implies
        - Would undermine the fair-value case and move the mark closer to public-market discount comps.
        - Reduce the base case toward the bear band and revisit the recommendation.
    notes: >-
      These triggers are intentionally observable from either public filings, public financings, or a standard diligence
      pack. They convert a broad caution into concrete decision rules.
    claimRefs:
      - CV013
      - CV016
      - CV036
      - CV041
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Revenue quality
        - Audited 2025 net revenue, EBITDA, and gross-to-net bridge by legacy and acquired portfolio
        - Transforms the current gross-revenue narrative into an underwriteable valuation input.
        - Request audited financial statements plus title-level management bridge schedules.
      - - Debt package
        - Signed Bank of America facility agreement, principal, pricing grid, amortization, maturity, and covenants
        - Determines how much of the current enterprise story actually belongs to equity holders.
        - Obtain executed credit documents and the first post-close compliance certificate.
      - - Cap table and preferences
        - >-
          Fully diluted cap table, AppLovin share count, board or information rights, liquidation preferences, and
          anti-dilution terms
        - Without this, common-equity return math remains guesswork.
        - Request the latest cap-table export and shareholder-rights summary.
      - - Portfolio concentration
        - Top-title revenue, bookings, DAU, payer conversion, and ad-monetization mix
        - Tests whether diversification is real or only headline-deep.
        - Review title-level dashboard exports for the top ten games and acquired studios.
      - - Integration performance
        - Legacy-versus-acquired retention, margin, and synergies by studio for the first post-close quarters
        - Shows whether the acquisition improved value or just enlarged operating complexity.
        - Request monthly integration KPI pack and budget-versus-actual reporting.
    notes: >-
      These asks are the shortest path from public directional analysis to investment-grade underwriting. Without them,
      the recommendation should stay in track mode.
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV050
