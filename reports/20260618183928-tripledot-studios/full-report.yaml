  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Public evidence supports a wide valuation band with the center of gravity near the current narrative mark rather
      than a clear upside-dislocated bargain.
    data:
      items:
        - label: Bear band — leverage or revenue-quality miss
          low: 800
          high: 1400
          unit: $M
        - label: Base band — scale is real, disclosure still thin
          low: 1800
          high: 2400
          unit: $M
        - label: Bull band — integration and revenue quality both prove out
          low: 3000
          high: 4000
          unit: $M
    approximationNotes: >-
      Ranges are public-comp and evidence-quality bands, not DCF outputs. They deliberately separate what can be
      supported today from what would require internal financial disclosure.
    claimRefs:
      - CV033
      - CV039
      - CV040
      - CV041
      - CV045
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Tripledot scores well on market scale and portfolio breadth, but poorly on financing transparency and valuation
      support.
    data:
      items:
        - label: Market size and durability
          value: 4
          unit: /5
          note: Large casual and puzzle markets still exist, even if mobile growth is mature.
        - label: Portfolio diversification
          value: 4
          unit: /5
          note: The AppLovin deal materially broadened studio and monetization mix.
        - label: Revenue-quality visibility
          value: 2
          unit: /5
          note: Gross revenue is public; audited net revenue and EBITDA are not.
        - label: Financing transparency
          value: 1
          unit: /5
          note: The Bank of America charge is visible, but the signed facility package is not.
        - label: Comparable support
          value: 3
          unit: /5
          note: The mark is bracketed by public and M&A anchors, but not conclusively cheap.
        - label: Exit readiness
          value: 2
          unit: /5
          note: A later strategic sale is easier to support than a near-term IPO.
    approximationNotes: >-
      Scores are ordinal judgments derived only from the retained public evidence set as of 2026-06-18. They are a
      decision aid, not management-provided KPIs.
    claimRefs:
      - CV012
      - CV028
      - CV029
      - CV034
