  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer segments and channel structure
        blocks:
          - type: paragraph
            body: >-
              Tripledot's customer base is best understood as a stack of mass-market mobile players acquired through app
              stores, not as a classic enterprise account list. The visible Android catalog spans 62 apps, more than 500
              million cumulative downloads, and a 4.72 average rating on AppBrain, with puzzle still the dominant genre
              but card, word, and casual adjacencies clearly present. Google Play's live developer page surfaces
              Woodoku, Solitaire, Blackjack, Sudoku, and Word Hop as emblematic front doors into that base, while the
              homepage says Tripledot's games entertain millions. That mix implies multiple player archetypes: daily
              logic-puzzle users, card-routine users, word or brain-training users, and newer audiences added through
              recent launches and acquired portfolios.


              The buyer, user, and payer roles also split more than the genre labels suggest. In legacy puzzle and card
              titles, the downloader and the player are usually the same person, and direct spend flows through Apple or
              Google billing rails rather than through Tripledot's own checkout. At the same time, the privacy notice
              makes clear that non-paying users still matter because advertising partners, ad exchanges, and related
              ad-tech firms monetize attention inside the apps. Terms and privacy disclosures also show that Facebook or
