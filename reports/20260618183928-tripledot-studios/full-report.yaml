      - number: '6.2'
        title: Named proof and durability proxies
        blocks:
          - type: paragraph
            body: >-
              Public named-customer proof is strongest at the review layer, especially on Woodoku. Three recent named
              Google Play reviewers show real production use rather than logo-only social proof: one reviewer said the
              game felt rigged but was still worth using to pursue a gas-rewards milestone in April 2026, another
              described lag, crashes, lost progress, and heavy ad load in March 2025, and a third said ads could
              interrupt play within seconds in May 2025. Those anecdotes do not prove population-wide retention or
              monetization quality, but they do prove live-session use on a current production title, and they are fresh
              enough to matter for 2026 diligence. Google Play also shows Tripledot support responding to these
              complaints, which indicates a live service rather than an abandoned back catalog app.


              Durability is easier to proxy than to prove. Tripledot's public app surfaces repeatedly emphasize daily
              challenges, weekly puzzle additions, statistics, autosave, hints, streaks, offline play, leaderboards, and
              Facebook competition — classic habit-loop tools for repeat engagement in consumer mobile games. AppBrain
              and Google Play metrics reinforce that these are not dormant listings: Woodoku still averaged about 490
              thousand downloads in the last 30 days, Solitaire about 560 thousand, Blackjack about 130 thousand, and
              Spades about 210 thousand, while sampled 2018-2020 titles still show updates in 2025-2026. That is
              credible evidence of ongoing repeat use and live ops, but it is still proxy evidence. Public sources do
              not disclose title-level cohorts, payer conversion, GRR, churn, or advertiser-side renewal behavior.
