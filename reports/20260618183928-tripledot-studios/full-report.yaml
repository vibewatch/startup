      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The biggest financial diligence blocker is not demand; it is financing opacity. Company Overview already
              established the historical funding arc through 2022, but Financials needs the current implication:
              Tripledot used an $800 million acquisition to jump from a profitable mid-scale studio into a multi-studio
              consolidator, and the public debt story changed meaningfully between signing and closing. AppLovin’s 8-K
              described only $150 million cash at close, an 18-month seller note at 11% interest, broad guarantees,
              asset pledges, and restrictive covenants. The July 2025 closing release then said the deal actually closed
              for $400 million cash plus equity and that no promissory note was issued. Companies House separately shows
              a Bank of America collateral-agent charge created on the closing date.


              That sequence supports one important conclusion and leaves several critical unknowns. The conclusion is
              that the cash close depended on external financing or at least financing-ready documentation; the 8-K
              explicitly said part of the cash consideration was expected to be debt-funded, and the later secured
              charge strongly suggests a non-trivial lender package survived even though the seller note did not. The
              unknowns are just as important: current debt principal, amortization, covenant package, interest burden,
              and whether the seller-note economics were replaced one-for-one with bank debt or only partially.


              Public sources also do not disclose cash on hand, burn, or runway. That means capital adequacy cannot be
              solved from press releases alone. The best outside reading is that Tripledot is not obviously
              undercapitalized, because it closed a transformational transaction and still kept AppLovin as a minority
              equity holder, but neither is it transparently capitalized. Without the debt agreements and an updated
              cash bridge, any runway view would be guesswork.
            claimRefs:
              - CI001
