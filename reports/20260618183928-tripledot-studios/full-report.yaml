      - number: '2.2'
        title: Sizing lenses and practical serviceable market
        blocks:
          - type: paragraph
            body: >-
              Public sizing data supports a layered approach rather than a clean one-line TAM. At the broadest level,
              Newzoo puts total games consumer spend at $188.8 billion in 2025 and explicitly says mobile growth is
              slowing in mature markets. A much tighter platform lens comes from Sensor Tower, which says mobile game
              in-app purchases reached $82 billion in 2024, up 4% year over year even as downloads fell 7% to 49
              billion. Narrower again, Business of Apps puts global puzzle revenue at $9.1 billion in 2022 after $9.5
              billion in 2021 and says puzzle has ranked third on revenue charts since 2019.


              A flagship-title lens shows why the niche is still economically meaningful. Business of Apps says Candy
              Crush generated $1.088 billion in 2024, reached 180 million monthly players, and exceeded 3.6 billion
              lifetime downloads. For Tripledot specifically, the AppLovin acquisition makes the relevant served pool
              broader than puzzle-only IAP, because the combined portfolio adds expertise in both in-app purchase and
              in-app advertising models and adds more than 25 live games at much larger scale.


              What public evidence does not provide is a clean Tripledot-fit SAM across puzzle, card, word, and
              hybrid-casual monetization after the deal. Available datasets mix all-platform spend, mobile IAP-only
              spend, puzzle-only revenue, and advertiser economics. The right conclusion is therefore
              evidence-constrained: Tripledot competes in a multi-billion-dollar served market, but precise TAM/SAM/SOM
              math still needs internal genre, geography, and monetization-split disclosures.
