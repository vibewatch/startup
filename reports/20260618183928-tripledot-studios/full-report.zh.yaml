  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、正向论点和反向论点
        blocks:
          - type: paragraph
            body: |-
              Tripledot 的投资论点是真实的，但不能不看价格。正面看，公开来源支持这样一家公司：
              在 AppLovin 交易前已经盈利，已证明自己有休闲游戏运营引擎，随后又借 2025 年收购增加了工作室、组合宽度、地理触达，以及 IAP 加 IAA 的混合变现。
              扩大后的公司声称拥有超过 2,500 万日活用户、接近 $2B 年总收入，且没有单款游戏超过净收入的 10%。这些理由足以支持一个判断：Tripledot 已经从「单一爆款风险」叙事，转向「规模化组合」叙事。

              反向论点同样重要。公开证据仍没有披露经审计净收入、EBITDA、债务服务，
              或交割后清算优先权栈。公司声称的规模数字是年总收入，不是上市公司口径的
              net bookings 或净收入，因此隐含约 $2.0B 估值看似便宜，可能被夸大。
              市场背景健康但成熟，并非爆发式增长；私营公司不透明应当对应折价，
              而不是溢价。因此建议是 TRACK，而不是 BUY：当前价格方向上可以支持，但
              在没有更深披露或更明显折价入口前，公开证据还不足以支撑高确信资金入场。
