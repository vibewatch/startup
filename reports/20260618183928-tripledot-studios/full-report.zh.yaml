  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 平台、隐私和法律风险
        blocks:
          - type: paragraph
            body: >-
              Tripledot 最严重的外部风险，是结构性依赖 Apple 和 Google 来获客、分发、计费并管理游戏访问。公司自己的文件称，购买由 Apple、Google 或 Amazon
              处理；用户可能需要社交网络或应用商店账户；用户还要支付应用商店或连接费用才能使用服务。Apple 描述的是一个策展式商店，会按安全、商业、隐私和法律标准审核应用；Google
              要求合规处理用户数据，并对数字商品使用 Play 计费。也就是说，Tripledot 的变现不仅在商业上集中于应用商店，也在合同和流程上经由它们路由。


              隐私又加了一层风险。Tripledot 披露会收集 IDFA 或 GAID，使用营销合作伙伴、社交组件和跨设备广告链接，因此合规面比单一第一方游戏客户端更宽。公司还称其服务不面向 16 岁以下儿童，但 FTC 和
              ICO 指引显示，面向大众的服务和在线游戏仍可能落入儿童访问义务。Google 通过 Families 规则和广告 SDK
              要求强化了这一点。因此，公司面临高影响的法律和监管边界，但缓释成熟度只有中等：政策文本存在，公开层面却没有能达到审计级别的供应商治理、儿童风险审查和事件处理证明。
