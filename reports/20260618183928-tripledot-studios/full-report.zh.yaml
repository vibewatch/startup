  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: Tripledot 确实有规模，产品组合也够宽，因此估值判断落在公允区间；但债务、净收入质量和股权结构仍不透明，还不足以支持买入。
    data:
      nodes:
        - id: predeal
          label: 交易前验证：盈利运营商，2022 年完成 $1.4B 融资
        - id: scale
          label: 交割后规模：25M+ DAU，毛收入近 $2B
        - id: price
          label: 当前叙事估值：隐含约 $2.0B
        - id: gap
          label: 披露缺口：债务条款、净收入、优先权
        - id: comps
          label: 可比区间：高于 Playtika 底部，低于 Scopely 和 Zynga 先例
        - id: output
          label: 输出：跟踪 / 公允 / 高风险
      edges:
        - from: predeal
          to: scale
          label: 证明执行底盘
        - from: scale
          to: price
          label: 支撑更高估值
        - from: price
          to: comps
          label: 需要外部验证
        - from: gap
          to: output
          label: 卡住买入确信
        - from: comps
          to: output
          label: 让结论停在公允，而非便宜
    approximationNotes: 节点标签是对证据集的编辑性压缩，不是概率模型。该图意在说明：即便规模真实，推荐仍只能停在跟踪。
    claimRefs:
      - CV001
      - CV006
      - CV012
      - CV016
      - CV033
      - CV038
      - CV042
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值最大的摆动来自债务透明度和毛收入转净收入的效率，而不是收入总额叙事再小幅变化。
    data:
      items:
        - label: 净收入质量好于担忧
          value: 500
        - label: 杠杆温和，契约干净
          value: 300
        - label: 多元化说法完全得到验证
          value: 250
        - label: 毛收入转净收入偏弱
          value: -600
        - label: 杠杆沉重，或契约限制严格
          value: -500
        - label: 集中度高于 10% 说法
          value: -250
    approximationNotes: 柱状条展示相对当前粗略叙事估值的股权价值方向性变化，单位为 $M，并非管理层指引。该图只用公开证据，隔离出新投资人最该盯住的驱动因素。
    claimRefs:
      - CV013
      - CV015
      - CV016
      - CV034
      - CV035
      - CV036
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持的估值区间很宽，重心靠近当前叙事估值，而不是明显被错杀、上行空间清晰的便宜资产。
    data:
      items:
        - label: 熊市区间——杠杆或收入质量不及预期
          low: 800
          high: 1400
          unit: $M
        - label: 基准区间——规模真实，披露仍薄
          low: 1800
          high: 2400
          unit: $M
        - label: 牛市区间——整合与收入质量均跑通
          low: 3000
          high: 4000
          unit: $M
    approximationNotes: 区间来自公开可比公司和证据质量分层，不是 DCF 输出。它刻意区分了今天能支撑的判断，以及必须等内部财务披露后才能确认的判断。
    claimRefs:
      - CV033
      - CV039
      - CV040
      - CV041
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Tripledot 在市场规模和产品组合宽度上得分不错，但融资透明度和估值支撑偏弱。
    data:
      items:
        - label: 市场规模与韧性
          value: 4
          unit: /5
          note: 即便移动端增长已成熟，休闲和益智游戏的大市场仍在。
        - label: 产品组合多元化
          value: 4
          unit: /5
          note: AppLovin 交易显著拓宽了工作室和变现组合。
        - label: 收入质量可见度
          value: 2
          unit: /5
          note: 毛收入已公开；经审计净收入和 EBITDA 未公开。
        - label: 融资透明度
          value: 1
          unit: /5
          note: Bank of America 的抵押权登记可见，但已签署的授信文件包不可见。
        - label: 可比支撑
          value: 3
          unit: /5
          note: 该估值被公开市场和 M&A 锚点夹住，但不能得出便宜的结论。
        - label: 退出准备度
          value: 2
          unit: /5
          note: 相比近期 IPO，较晚的战略出售更容易被证据支撑。
    approximationNotes: 评分是截至 2026-06-18 基于保留公开证据集给出的序数判断。它们是决策辅助，不是管理层提供的 KPI。
    claimRefs:
      - CV012
      - CV028
      - CV029
      - CV034
      - CV036
      - CV044
      - CV045
      - CV046
