  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Tripledot
              不是把一款游戏卖给一类受众。其公开产品表面显示，它围绕益智、纸牌、文字和休闲排序玩家，搭建了短会话移动娱乐循环的资产组合系统。官网把公司定位为数据驱动的游戏创作者，为工作室配备数据、工具和支持；Google
              Play 开发者页面和 AppBrain 则展示了一个覆盖数十款应用和多个品类的广泛 Android 足迹。旗舰产品体现了这一模式。Woodoku 使用熟悉的 9x9 逻辑棋盘，Solitaire 和
              Spades 把经典纸牌转成适合移动端的会话，Word Hop 和 Cryptogram 提供每日脑力训练循环，Triple Tile、Nut Sort、Blockbash、Car Out、Pick Pack 和
              Get Color 则把组合扩展到新的匹配、排序和交通益智格式。许多产品的玩家工作流也一致：在商店发现应用，无需重度 onboarding
              即可安装，玩短局——若干旗舰产品还支持离线——再通过每日挑战、每周内容、提示、排行榜或限时活动回流。这种重复让 Tripledot
              的产品系统更像一个休闲游戏运营模型：它把常见留存机制包裹在多种品类皮肤上，而不是一次性 IP 生意。公司也因此能复用发现、变现和支持模式，不需要每款游戏都搭一套完全独立的运营栈。
