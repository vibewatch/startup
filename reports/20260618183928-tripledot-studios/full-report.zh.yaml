      - number: '4.2'
        title: GTM 动作、成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Tripledot 的 go-to-market 动作看起来像典型的规模化移动游戏，而不是企业销售：效果营销、live operations、应用商店分发和资产组合交叉推广。管理层告诉
              PocketGamer，2021 年增长来自产品多元化，以及强营销和 live-ops 能力；InvestGame 称，AppLovin
              交易的目标是把这些内部工具延伸到被收购工作室，从而提升用户获取效率和盈利能力。Udonis 和 Sensor Tower 给出了 2026 年最清晰的公开经济代理指标：休闲安装仍能买到，但成本不低，Android
              CPI 约 $0.63，iOS 约 $2.23，整体 D7 ROAS 约 7.6%；市场背景则是会话和 IAP 支出上升、下载下降。


              这一组合让成本结构比品类规模更重要。Take-Two 移动端占比较高的资产组合提供了有用公开证据，尽管它不是 Tripledot 披露。Take-Two 称，96.4% 净收入来自数字渠道，79.4% 来自
              recurrent consumer spending，平台费计入收入成本；由于 Apple 和 Google 在发行商看到净回款前先抽成，移动端毛利率低于主机或
              PC。公司还表示，玩家获取支出计入销售和营销，这意味着贡献利润率会随着上线节奏和广告市场效率快速摆动。


              InvestGame 又从 Tripledot 买下的具体资产给出第二个代理指标：AppLovin 的游戏应用对 EBITDA 的贡献远小于对收入的贡献，利润率很难明显超过 20%。这不能证明 Tripledot
              交割后的利润率，但支持一个清醒读法。利润率路径更少取决于标题 DAU，更多取决于 Tripledot 能否提升 UA 效率、广告收益和 live-ops
              留存，其速度要快过平台费、广告负荷和资产组合复杂度吃掉收益的速度。
