      - number: '2.2'
        title: 规模测算视角与实际可服务市场
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据支持分层看法，而不是一行干净的 TAM。最宽口径下，Newzoo 预计 2025 年游戏消费者总支出为 $188.8 billion，并明确表示成熟市场的移动端增长在放缓。更收窄的平台视角来自
              Sensor Tower：2024 年移动游戏应用内购买达到 $82 billion，同比增长 4%，尽管下载量下降 7% 至 49 billion。再往下，Business of Apps 称全球益智游戏收入从
              2021 年的 $9.5 billion 降至 2022 年的 $9.1 billion，并表示益智品类自 2019 年以来一直位居收入榜第三。


              旗舰产品视角说明，这个细分市场仍有足够经济意义。Business of Apps 称，Candy Crush 在 2024 年创造 $1.088 billion 收入，月活玩家达到 180
              million，生命周期下载量超过 3.6 billion。对 Tripledot 而言，AppLovin 收购让相关服务池不再局限于益智
              IAP，因为合并后的资产组合同时增加了应用内购买和应用内广告模型能力，并以大得多的规模新增超过 25 款在线游戏。


              公开证据没有给出一个干净、适配 Tripledot 的 SAM，用来覆盖交易后的益智、纸牌、文字和 hybrid-casual 变现。现有数据集混合了全平台支出、仅移动 IAP
              支出、仅益智收入和广告主经济性。因此，正确结论必须受证据约束：Tripledot 竞争的是一个数十亿美元级的可服务市场，但精确的 TAM/SAM/SOM 计算仍需要内部品类、地域和变现拆分披露。
