      - number: '7.3'
        title: 资本结构和治理风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的尽调阻断项，是交割后融资不透明。AppLovin 2025 年 5 月 8-K 公告的结构包括交割时 $150M 现金、一张 $250M 有担保本票且利率 11%、广泛担保、资产质押和限制性契约。后来的
              AppLovin 交割公告称，交易实际以 $400M 现金加约 20% 股权完成，没有发行本票。Companies House 随后显示，Bank of America 作为抵押代理人在 2025 年 6 月
              30 日交割日设立的押记仍未解除。合起来看，真实的有担保融资确实支撑了交割；但公开记录没有说明当前本金、定价、摊还或契约余量。


              治理可见度也低于公司规模应有水平。Companies House 显示 Lior Shiff
              仍是现任董事，并记录了多次辞任；较早新闻报道仍围绕原始创始人描绘公开领导层。已审阅的公开材料没有提供完整的交割后董事会名单、高管组织图或风险监督结构。因此，关键人和整合治理风险具有实质性，不是因为领导层明显薄弱，而是因为对于这样规模且刚完成整合的业务，公开证据基础仍太浅。
