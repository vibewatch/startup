      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              近期最强驱动不是原始下载扩张，而是变现深度和资产组合广度。Sensor Tower 称，休闲品类在 2024 年贡献了应用内购买的最大绝对增长，hybridcasual IAP 收入同比增长 37%；Udonis
              则强调合并机制、小游戏、锦标赛和混合变现仍是活跃设计前沿。AppLovin 交易之所以重要，是因为它给 Tripledot 带来更多产品、更多地域，以及横跨 IAP
              和广告资助模型的更多运营经验，这应能改善交叉推广，并降低对任何单一爆款的依赖。


              约束同样真实。Newzoo 称移动端在成熟市场放缓。Business of Apps 显示，益智游戏下载量仍低于 2020 年峰值。Sensor Tower
              称，在隐私优先的世界里，获取新受众更难，开发者正重新聚焦 live operations；VentureBeat 直接引用 Tripledot 管理层，说明 Apple 隐私变化如何重塑用户获取。Udonis
              补上了这种压力的财务表达：休闲 CPI 仍有分量，尤其是在 iOS 上，而早期 ROAS 仍偏温和。


              信任也是现实的采用约束。当前 Woodoku 评论抱怨侵入式广告、卡顿和公平性感知问题；Google Play 的数据安全披露显示，广告资助移动游戏常见的活动和设备级数据流规模不小。与此同时，King、Jam
              City、Scopely、Zynga、Take-Two、Playtika 等规模化在位者说明，这个市场已经拥挤且高度依赖能力。卡住增长的变量是执行，不是品类新鲜感。
