        - from: Acquired studios
          to: Tripledot publishing stack
          label: 更多游戏、团队和整合负担
        - from: Bank of America collateral agent
          to: Tripledot publishing stack
          label: 资本结构边界
        - from: Tripledot publishing stack
          to: Player revenue and retention
          label: 质量与变现执行
