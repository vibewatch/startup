      - number: '4.4'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个建设性但不完整的财务判断。建设性，是因为 Tripledot 看起来像真实产现金的移动运营商，而不是投机性、收入前工作室：2022 年来源报道其盈利，当前资产组合很宽，产品目录在 2026
              年仍活跃维护，AppLovin 收购似乎降低了单款游戏依赖，同时扩大 IAP 和广告变现。在品类层面，这是收入韧性的正确形态。


              不完整，是因为承销真正关心的每一项都藏在私有看板后。公开来源没有给出单款游戏 bookings、 cohort 留存、实际平台抽成率、IAP 与 IAA
              结构、净收入桥、当前营运资本表现或当前杠杆。即便最显眼的标题——近 $2 billion 年化总收入——单独也不够，因为总收入不等于确认后的净收入或毛利。同样，尽管有 Bank of America
              押记和更早的卖方本票契约表，最终债务包仍存在重大披露不足。


              因此，结论不是基本面负面，而是尽调质量需要谨慎。通过多元化，收入质量可能在改善；如果 Tripledot 的 UA
              和变现打法能迁移到被收购工作室，利润率扩张也有可能；资本强度低于硬件或制造企业，但高于纯有机工作室，因为收购融资可以主导现金故事。本章的卡点很直接：承销前，尽调需要单款游戏
              P&L、净收入桥，以及替代或并列于原始本票结构的已签署债务包。
