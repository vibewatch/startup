  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱
      - 投资论点
      - 反论点
      - 什么会改变判断
    rows:
      - - 市场
        - 休闲和益智游戏仍是大体量、习惯驱动的品类，支出和参与度有韧性。
        - Newzoo 和 Sensor Tower 指向成熟移动增长，而不是新一轮品类重估。
        - 品类增长更快，或定价权证据更充分，会强化上行情形。
      - - 产品和组合
        - AppLovin 交易把 Tripledot 从较小的休闲游戏专家，变成多元化移动游戏组合运营商。
        - 被收购工作室之间的整合复杂度可能稀释运营收益，并推迟协同兑现。
        - 按原有工作室与被收购工作室拆分披露交割后 KPI，会降低不确定性。
      - - 客户
        - 公司称拥有 25M+ DAU，且没有单款游戏超过净收入的 10%；若属实，多元化将显著改善。
        - 10% 上限仍是管理层口径，未由游戏级 bookings 或 DAU 披露验证。
        - 游戏级收入和 DAU 桥会把该支柱从叙事推向证据。
      - - 财务
        - 如果净收入质量和杠杆好于市场担忧，约 $2.0B 的隐含估值可以辩护。
        - 总收入公开，净收入未公开，债务包仍属私有。
        - 经审计的 2025 净收入、EBITDA 和偿债情况会显著提高确信度。
      - - 竞争
        - Tripledot 估值仍显著低于 Scopely 和 Zynga；如果整合成功，仍有空间。
        - Playtika 等公开市场可比公司显示，市场可能以更保守方式给规模化移动发行商定价。
        - 持续的净收入质量和更强披露，会支持降低公开市场折价权重。
      - - 风险和融资
        - 交割时用现金替代卖方票据，简化了观感，并让 AppLovin 作为 20% 股东保持利益一致。
        - Bank of America 押记表明，杠杆仍是隐藏但重要的权益变量。
        - 完整债务文件和交割后股权结构表，会最快改变建议。
    notes: 各支柱有意把市场、产品、客户、财务、竞争和风险连接到估值判断。若干反论点单元仍未解决，因为缺失证据是私有信息，而不是原则上无法获得。
