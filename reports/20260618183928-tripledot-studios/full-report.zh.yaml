      - number: '8.4'
        title: 退出准备度、thesis-break 触发点和最终尽调要求
        blocks:
          - type: paragraph
            body: |-
              按外部投资者能像承销申报级上市公司那样承销的标准看，Tripledot 今天还没有公开退出准备度。公司未来可能支撑 IPO 或溢价战略出售，但公开 证据仍缺少
              让新投资者把当前私募标记视为经审计承销事实的要素。更
              可支持的中期退出路径，是后续战略出售、由 sponsor 支持的二级交易，或在整合里程碑和债务透明度改善后的再融资 流动性
              事件。

              因此，实际尽调议程很窄，但价值很高。第一，投资者需要经审计的 2025 年净 收入、
              EBITDA 和总到净桥接。第二，需要已签署的 Bank of America 贷款文件包， 包括本金、
              到期日、契约余量，以及对未来 M&A 或分配的任何限制。第三，需要当前 cap table 和
              清算优先权，包括 AppLovin 的治理或信息权。thesis-break 触发点也能 从公开证据看出：披露 down-round、债务条款让股权杠杆远高于 标题标记
              所暗示的水平，或出现分散化弱于宣传的证据，都会迅速削弱公允价值 论点。
