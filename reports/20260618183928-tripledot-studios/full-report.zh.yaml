      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最大的财务尽调障碍不是需求，而是融资不透明。公司概览已经确立了截至 2022 年的历史融资弧线，但财务章节需要提取当前含义：Tripledot 借一笔 $800 million
              收购，从盈利的中等规模工作室跃迁为多工作室整合者，而公开债务故事在签约和交割之间发生了实质变化。AppLovin 的 8-K 描述的是交割时仅 $150 million 现金、一张 18 个月期且利率 11%
              的卖方本票、广泛担保、资产质押和限制性契约。2025 年 7 月交割新闻稿随后称，交易实际以 $400 million 现金加股权完成，且没有发行本票。Companies House 另行显示，Bank of
              America 抵押代理人押记在交割日创设。


              这一顺序支持一个重要结论，也留下几个关键未知数。结论是，现金交割依赖外部融资，或至少依赖已准备好的融资文件；8-K
              明确说部分现金对价预计由债务融资提供，后来的担保押记强烈暗示，即便卖方本票没有留下，仍有非小额贷款人安排存续。未知数同样重要：当前债务本金、摊还、契约包、利息负担，以及卖方本票经济性是一比一被银行债务替代，还是只被部分替代。


              公开来源也没有披露账上现金、burn 或 runway。这意味着资本充足性无法只靠新闻稿解决。最佳外部读法是，Tripledot 并不明显资本不足，因为它完成了转型级交易，并让 AppLovin
              继续作为少数股权持有人；但它也不是透明资本化。没有债务协议和更新后的现金桥，任何 runway 判断都是猜测。
