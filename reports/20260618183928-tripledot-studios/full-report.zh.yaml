      - number: '8.2'
        title: 融资背景、当前标记和入场纪律
        blocks:
          - type: paragraph
            body: |-
              公开估值轨迹在标题层面很直接，细节之下却很凌乱。2022 年 2 月，Tripledot
              以 $1.4B 估值融资 $116M，此前有 2021 年 $78M Series A 和更早一轮 $8M 融资。
              2025 年 5 月，AppLovin 签署出售其游戏组合的协议，对价被描述为 约 $800M。
              已签署的 8-K 结构为交割时 $150M 现金、一张 $250M 有担保本票，以及
              相当于 Tripledot 完全稀释股份约 20% 的股权。到 2025 年 7 月交割通知时， 交易变为 $400M
              现金加约 20% 股权，且没有发行本票。

              但这仍不意味着 Tripledot 无债交割。AppLovin 文件称 Tripledot 预计使用债务 融资，
              Companies House 也显示，Bank of America 作为抵押代理人的押记在交割日设立。 MobileGamer 随后
              报道，AppLovin 持有的 20% 股权价值约 $400M，隐含约 $2.0B 的交割后
              估值叙事。方向上可信，但承销质量不够。公开证据没有显示
              已签署银行贷款、当前本金余额、契约组合或清算优先权 栈。入场
              纪律因此必须随证据调整：在当前叙事估值下，投资者应要求 披露；
              若没有披露，就应要求实质折价，而不是把标题估值视为 自我验证。
