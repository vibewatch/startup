      - number: '7.4'
        title: 缓释、监测指标和 thesis-break 触发点
        blocks:
          - type: paragraph
            body: >-
              并非所有消息都是负面的。Tripledot 确实有可见缓释因素：产品组合分散；没有单款游戏超过净收入 10%
              的指引；当前隐私和数据安全披露；删除和退出机制；传输中加密措辞；以及活跃的应用商店支持回复。但这些主要是政策表层缓释，而不是审计级控制。公开语料仍缺少已签署债务包、单款游戏仪表盘、平台事件历史、供应商风险材料和交割后治理细节；这些才会把缓释因素变成可充分承销的东西。


              因此，正确的投资姿态是有条件推进。需要监测任何应用商店执法或计费政策争议、旗舰产品评论持续恶化、被收购工作室需要重度扭转的证据，或会显著降低战略灵活性的贷款人条款。如果 Tripledot
              能提供债务文件、董事会和组织图透明度，以及单款游戏留存与变现仪表盘，这笔交易可能看起来像审慎分散化。若无法提供，剩余风险仍高，因为公司用单款游戏集中度换来了一张大得多的平台、隐私、融资和执行暴露矩阵。
