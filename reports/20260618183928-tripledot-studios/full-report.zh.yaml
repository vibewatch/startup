      - - 估值立场
        - 合理
        - 该估值低于更大型战略交易先例，接近上市移动游戏发行商倍数的低端，但并不明显便宜。
        - 价格可以辩护，但安全边际有限。
      - - 入场纪律
        - 披露优先，或相对隐含当前估值给出实质折价
        - 公开证据没有揭示已签署债务包、净收入桥或优先股堆栈。
        - 缺少这些信息时，价格越高，承销应越难。
      - - 退出姿态
        - 后续战略出售或赞助方二级交易，比近期 IPO 更能支撑
        - 整合刚刚发生，公开报告仍是私营公司式稀薄披露。
        - 通过整合证据承销价值创造，而不是押注快速公开流动性。
    notes: 本表把公开证据转化为可投资性判断，不是经审计的公平性意见。该建议明确受价格和披露影响。
