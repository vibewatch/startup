  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 可观察的免费游戏用户活动先通过广告展示和应用内购买转成 Tripledot 收入，再由平台和广告网络扣减决定净收入质量。
    data:
      nodes:
        - label: 免费安装与重新激活
          note: 效果营销、应用商店和交叉推广把玩家带入旗舰游戏。
        - label: 每日游戏会话
          note: 长青益智、牌类和文字循环创造重复游玩和广告库存。
        - label: 广告展示 / 参与
          note: 隐私声明和应用页面显示，多款游戏都有广告栈。
        - label: 应用内购买转化
          note: 旗舰游戏展示价格梯度、筹码包，以及去广告或工具型购买。
        - label: 总收款
          note: 公司材料引用年总收入，而非经审计净收入。
        - label: 平台与广告网络扣减
          note: Apple/Google 费用加广告技术收入分成，可能位于总收款与净收入之间。
        - label: 净收入 / 毛利润
          note: 公开记录未披露最终确认收入或利润率桥。
      edges:
        - from: Free install and reactivation
          to: Daily gameplay sessions
          label: 玩家进入免费游戏循环
        - from: Daily gameplay sessions
          to: Ad impressions / engagement
          label: 非付费玩家通过广告变现
        - from: Daily gameplay sessions
          to: In-app purchase conversion
          label: 付费玩家购买礼包或便利
        - from: Ad impressions / engagement
          to: Gross receipts
          label: 广告收入贡献
        - from: In-app purchase conversion
          to: Gross receipts
          label: IAP 收入贡献
        - from: Gross receipts
          to: Platform and ad-network deductions
