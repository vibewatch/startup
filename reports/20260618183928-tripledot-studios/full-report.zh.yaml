        - 多元化被证明真实，总收入到净收入转化强于担忧，杠杆足够温和，使公开估值低估盈利质量。
        - 3000-4000
        - 如果出现类似上市公司的收入质量，相对约 $2.0B 叙事入场价约为 1.5x-2.0x。
        - 低概率情形，需要经审计财务证据加干净债务披露。
        - 净收入转化弱、杠杆高，或集中度高于 10% 声称。
      - - 基准
        - 规模真实，但披露仍是私营公司式稀薄，市场继续把业务估在更接近低端上市移动可比公司的水平。
        - 1800-2400
        - 持平至小幅上行；若没有重大负面意外，当前估值大致合理。
        - 当前公开记录下最能支撑的情形。
        - 债务或利润率披露显著差于市场当前假设。
      - - 悲观
        - 杠杆重于预期，整合拖累，或经审计净收入显著低于总收入叙事。
        - 800-1400
        - 当前叙事估值的 0.4x-0.7x，包括重新触及或跌破 2022 年独角兽估值水平的可能。
        - 反向但仍合理，因为关键承销变量仍属私有。
        - 任何公开证据显示降价轮、资本重组或重大集中度失准。
    notes: 情景区间是方向性的公开证据筛查，不是完整 DCF 或 LBO 输出。它们有意区分当前公开记录能支撑什么，以及只有内部数据才能确认什么。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV045
      - CV050
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 日期或状态
      - 规模视角
      - 估值
      - 倍数或框架视角
      - 相关性和限制
    rows:
      - - Tripledot Series B 轮
        - 2022 私募轮
        - 盈利的休闲游戏运营商，约 25M-30M MAU 和约 200 名员工
        - $1.4B
        - 私募融资估值；收入未披露
        - 最好的内部基准，但它早于 AppLovin 带来的规模跃迁，也没有提供公开收入桥。
      - - Tripledot 交割后叙事
        - 2025 交割 / 2026 公开叙事
        - 12 个工作室、23 个城市、25M+ DAU、近 $2B 年总收入
        - 隐含 ~$2.0B
        - 约 1.0x 声称总收入；债务和净收入未知
        - 最相关的当前估值，但仍停留在标题层面，未经审计。
      - - Scopely
        - 2023 出售给 Savvy
        - 规模化、移动优先的多元化组合运营商
        - $4.9B
        - 战略并购锚点，而不是该来源集里的干净收入倍数
        - 有用的上限式先例，但后续 Monopoly GO 动能使直接比较不完美。
      - - Zynga
        - 2022 出售给 Take-Two
        - $6.1B 备考过去 12 个月净 bookings
        - $12.7B
        - 约 2.1x 过去 12 个月净 bookings
        - 显示战略性移动规模能拿到的价格，但包含上市公司和协同背景。
      - - Playtika
        - 公开市场，2026-06-18
        - $2.79B TTM 收入
        - $1.33B 市值 / $3.07B EV
        - ~1.10x EV/收入 和 ~0.47x 市销率
        - 规模化移动发行最好的公开底部式可比，尽管社交赌场组合不同。
      - - Take-Two
        - 公开市场，2026-06-18
        - 主机、PC 和移动端 TTM 收入 $6.66B
        - 市值 $42.34B / EV $43.31B
        - ~6.51x EV/收入
        - 多元 IP 深度的高端参照有用，但不是纯移动游戏可比公司。
      - - King
        - 2016 年被 Activision Blizzard 收购
        - 以 Candy Crush 为核心的休闲游戏 IP 平台
        - $5.9B
        - 历史 IP 价值锚点
        - 交易周期较旧，但仍能提示耐久休闲规模的上限。
    notes: 这组可比参照混合了私募轮次、战略 M&A 和公开市场锚点，因为这种刚整合完成的私有移动游戏组合，没有单一干净可比对象。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public transaction and market anchors for a scaled mobile-games portfolio as of
        2026-06-18, not every historical gaming deal or private peer round.
    claimRefs:
      - CV001
      - CV008
      - CV012
      - CV017
      - CV020
      - CV024
      - CV026
      - CV032
      - CV033
      - CV034
  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 为何打破论点
      - 行动含义
    rows:
      - - 下轮融资或资本重组降价
        - 任何新披露融资低于 2022 年 $1.4B 独角兽参照点
        - 即使披露改善之前，交割后的叙事估值也站不住。
        - 除非新证据能完整解释重估，否则从跟踪转为回避。
      - - 债务负担重于假设
        - 融资文件显示担保杠杆高、契约紧或再融资压力大
        - 当前股权故事的杠杆程度会显著高于标称估值暗示。
        - 按股权尾部价值重切估值，而不是按干净企业价值故事看。
      - - 多元化失败
        - 公开或尽调证据显示，单一游戏或工作室仍在经济性上超过所称 10% 上限
        - AppLovin 交易降低爆款集中风险这一核心论点会被削弱。
        - 加更陡的集中度折价，并下调情景上行空间。
      - - 收入质量不及预期
        - 经审计净收入或 EBITDA 显著弱于总收入叙事暗示
        - 公允价值论证会被削弱，估值标记更接近公开市场折价可比对象。
        - 将基准情景降向熊市区间，并重新评估建议。
    notes: 这些触发因素刻意设计成可从公开备案、公开融资或标准尽调包中观察到。它们把宽泛谨慎转成具体决策规则。
    claimRefs:
      - CV013
      - CV016
      - CV036
      - CV041
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入质量
        - 2025 年经审计净收入、EBITDA，以及按原有与收购组合拆分的总额到净额桥
        - 把当前总收入叙事转成可承销的估值输入。
        - 索取经审计财务报表，以及游戏级管理口径桥表。
      - - 债务包
        - 已签署的 Bank of America 融资协议、本金、定价表、摊还、到期日和契约
        - 判断当前企业价值故事中有多少真正属于股权持有人。
        - 获取已签署信贷文件和交割后首份合规证书。
      - - 股权结构与优先权
        - 完全稀释股权结构表、AppLovin 持股数、董事会或信息权、清算优先权和反稀释条款
        - 没有这些，普通股回报测算仍只是猜。
        - 索取最新股权结构表导出和股东权利摘要。
      - - 组合集中度
        - 头部游戏收入、bookings、DAU、付费转化和广告变现组合
        - 验证多元化是真落地，还是只停在标题层面。
        - 审阅前十大游戏和收购工作室的游戏级仪表盘导出。
      - - 整合表现
        - 交割后最初几个季度，按工作室拆分的原有与收购留存、利润率和协同
        - 看这笔收购是在增值，还是只是放大运营复杂度。
        - 索取月度整合 KPI 包和预算对实际报告。
    notes: 这些问题是从公开方向性分析走向投资级承销的最短路径。拿不到它们，建议应停留在跟踪模式。
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV050
