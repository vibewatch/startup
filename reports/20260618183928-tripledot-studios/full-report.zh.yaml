      - number: '3.2'
        title: 同业画像：在位者、上市运营商与益智优先专家
        blocks:
          - type: paragraph
            body: >-
              King 仍是休闲益智最清晰的在位标杆，因为 Candy Crush 仍能产出十亿美元级年收入，King 更广的目录也仍把自己呈现为一个拥有 200 多款产品的娱乐平台。Playtika
              是另一类威胁：这是一家收入数十亿美元级的上市公司，live-ops 纪律很重，社交赌场根基深，并且有并购习惯，既能买来休闲增长，也能自己做。Scopely 则带来完全不同的模型：Savvy 收购后，它把深社区和
              IP 设计与主权资本结合起来。Jam City 在保留来源中的公开财务细节较少，但仍声称拥有数十亿安装量和长期运营的休闲 IP 基础。Take-Two 旗下的 Zynga
              重要，是因为母公司明确买下的是移动发行平台，而不是一组老化产品；它现在可以借助 LiveOps 和广告技术支持，把主机和 PC IP 推向移动端。


              Dream Games 是最相关的益智优先同业，因为它说明，只要执行足够锐利，聚焦仍能打赢广度。其官方页面和 Google Play 定位把 Royal Match
              塑造成精致、活动密集且无广告的产品，这与广告支持型休闲组合形成有意义对照。Business of Apps 也把 Playrix 留在益智重量级框架内，背后产品包括 Homescapes、Gardenscapes
              和 Fishdom。结果是，Tripledot 面临两线竞争挑战：广泛的多工作室运营商可以在支出和分发上压过它，而聚焦的益智专家仍可能在单一品类上做得更精致、留得更深。
