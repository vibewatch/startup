      - number: '6.3'
        title: 扩张、变现和集中度
        blocks:
          - type: paragraph
            body: >-
              AppLovin 交易把客户故事从少数老牌休闲爆款，改写成一个同时拥有直接付费和广告资助经济模式的更广全球组合。Business Wire 和 GamesBeat 描述的合并后公司拥有 25 款以上在线游戏、约
              2,500 万日活用户、接近 $2B 年总收入、12 个工作室，并明确具备应用内购买和应用内广告两种模式的经验。这大幅拓宽了 Tripledot
              可能触达的受众，不再只是偏益智的单人玩家，也应当改善品类、地区和变现方式上的客户分散度。独立交易报道还把这笔交易解释为加深 Tripledot 在美国和亚洲触达的一种方式。


              但集中度和渠道风险仍严重披露不足。管理层称，交割后没有单款游戏应超过净收入的 10%，但公开来源没有给出按游戏划分的 DAU、付费转化或收入。隐私声明确认广告合作伙伴很重要，条款也确认 Apple、Google
              和社交平台账户嵌入运营流程；但公开记录没有点名广告主客户，没有量化 mediation 依赖，也没有按平台拆分收入。因此，正确的尽调姿态应当保持平衡。Tripledot 看起来已经足够分散，值得重视，Spades
              等新产品也显示目录仍能增加受众；但证据基础仍由应用商店代理指标和组合层面的新闻稿主张主导，而不是收入级客户分析。
