  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: AppLovin 之后的格局：Tripledot 现在向堆栈上游竞争
        blocks:
          - type: paragraph
            body: >-
              AppLovin 交易实质性改变了 Tripledot 的竞争框架。公开交易报道和交割公告指向一家拥有 12 个工作室、覆盖 23 个城市运营、超过 2,500 名团队成员、约 25 million 日活用户、近
              $2 billion 年化总收入的公司。这个规模意味着，最相关的同业不再只是其他休闲益智开发商。Tripledot 现在与 King 在益智在位优势上重叠，与 Playtika 在数据驱动 live-ops
              变现上重叠，与 Scopely 在 IP 资产组合规模上重叠，与 Jam City 在广泛休闲目录竞争上重叠，与 Take-Two/Zynga 在多元化移动发行上重叠，也与 Dream Games
              在精品益智执行上重叠。


              品类背景也更难，而不是更容易。Sensor Tower 称移动游戏在 2024 年恢复增长，但也指出胜出模式是更深的 live services、混合变现和更强的存量受众复用。Business of Apps
              显示，益智仍是很大的品类，但更像成熟市场，而不是完全打开的蓝海。在这种环境下，替代品不只是直接的益智克隆。任何能够低价买量、在大目录内交叉推广、把知名 IP
              移植到移动端，或靠活动和习惯循环留住玩家的规模化运营商，都是替代压力。尽调的实际读数是：Tripledot 真正争夺的是玩家时间、应用商店排名、用户获取效率，以及跨多个工作室的运营杠杆。
