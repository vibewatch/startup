      - - 变现和测量层
        - 运行 IAP、广告、奖励和数据驱动优化
        - 支付处理方、广告伙伴、分析、设备 ID 和营销伙伴
        - 隐私声明和官方收购理由提供的证据质量高
        - 高度依赖外部广告技术和归因生态
      - - 多工作室整合层
