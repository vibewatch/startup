      - number: '7.2'
        title: 运营、质量和伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              AppLovin 交易后，运营风险画像发生了实质变化。Tripledot 原本已经管理一个较宽的 Android 目录，但这笔交易又增加了分布在 17 个新增城市的 10 个工作室，把合并边界推到 12
              个工作室、2,500 多人和接近 $2B 总收入。这是分散化，也是一道 live ops、工具和治理难题：更多品类、更多代码库、更多广告和钱包配置、更多应用商店关系、更多 QA
              表面。公开产品页面显示，公司仍在纸牌和文字产品里持续推出重复游戏机制，所以目录是活跃的，不是沉睡资产。


              不利面在实时消费者情绪里看得见。近期 Woodoku 评论提到像被操纵的结果、卡顿、崩溃、进度丢失，以及严重到让游戏暂时无法玩的广告打断；Tripledot
              的公开回复也承认广告干扰。市场数据说明休闲游戏仍有规模，但在隐私中心化的世界里，获客更难，且 iOS 的 CPI 仍显著高于 Android。因此，运营风险不是需求不足，而是 Tripledot
              能否吸收大得多的组合，同时不把会话过度变现、不拉低质量，也不在旗舰产品情绪转弱时反应变慢。
