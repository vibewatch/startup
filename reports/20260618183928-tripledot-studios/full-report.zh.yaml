chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律壳与创立故事
        blocks:
          - type: paragraph
            body: >-
              Tripledot 的公开身份在品牌层面异常清楚，在法律文件层面则略显杂乱。官网描述的是一个围绕创意和数据搭建的集团，并把 Tripledot
              包装成平台：向工作室提供工具、洞察和支持，帮助它们做出全球移动爆款。公司当前可控地址证据指向伦敦：招聘页面列出 Hampstead Road 上的 The Lantern，Companies House
              也显示同一地址是 Tripledot Studios Limited 的注册办公室。支撑这个运营故事的法律壳早于营销叙事。Companies House 记录了一家仍在运营的英国私人公司，编号
              10245307，2016 年 6 月 22 日注册，SIC 代码 58210；而收购公告和后续媒体报道讲的是更简单的公开故事：Tripledot 于 2017 年在伦敦由 Lior Shiff、Akin
              Babayigit 和 Eyal Chameides 创立。


              这个差异不一定削弱创立故事，但尽调时很重要，因为它把运营启动和公司注册区分开来。另一处披露滞后也提示要谨慎：Tripledot 的隐私通知在 2026 年 4 月更新，却仍把较早的 Charterhouse
              Mews 地址列为注册地址，尽管备案历史显示注册办公室已在 2023 年 7 月迁至 Hampstead Road。治理可见度同样有限。Companies House 确认了高管层面记录，并显示 Akin
              Babayigit 于 2022 年 4 月辞任董事，但官网没有解释外部董事角色，也没有公布董事会或委员会结构。因此，本章后续分析应锚定注册记录支持的事实，而不是最顺滑的营销简称。
