      - number: '1.2'
        title: 资本形成与交易结构
        blocks:
          - type: paragraph
            body: >-
              Tripledot 的融资历史显示，公司主要用外部资本放大一个已经跑通的运营模型。Global Corporate Venturing 报道，2018 年公司完成由 Velo Partners 领投的 $8
              million 融资，随后在 2021 年 4 月以 $500 million 估值完成 $78 million Series A。TechCrunch、VentureBeat 和 GCV 随后都指向 2022
              年 2 月的 Series B：公司以 $1.4 billion 估值融资 $116 million，由 20VC 领投，Access Industries、Lightspeed Venture Partners
              和 Eldridge 参投。同一批 2022 年报道描绘的是一家已经盈利、月活约 25 million 至 30 million、全球员工约 200 人的公司。换句话说，Tripledot
              不是在融救命钱，而是在给资产组合扩张和并购融资。


              这一策略最终落到 AppLovin 交易上，但融资图景需要谨慎处理，因为不同来源和日期给出的公开版本并不一致。Business Wire 的公告把交易描述为约 $800
              million，现金和股权各占一半。AppLovin 的 8-K 给出了硬机制：交割时支付 $150 million 现金，一张 $250 million、利率 11% 的有担保本票，以及相当于
              Tripledot 完全稀释后股份约 20% 的股权；尽管计划债务融资，交易没有融资条件。但后来的交割公告称，交易以 $400 million 现金加约 20% 股权完成，没有发行本票。Companies
              House 随后显示，2025 年 6 月 30 日创设了一项尚未解除的 Bank of America 押记。这一顺序支持一个清楚结论：Tripledot
              完成了转型级交易，但最终债务栈和当前股权结构仍需要一手尽调材料，而不能只看新闻稿简写。
