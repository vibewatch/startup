    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Tripledot 可见的拐点集中在 2021-2022 年融资，以及 2025 年 AppLovin 带来的跃迁。
    data:
      items:
        - date: '2016-06-22'
          label: 英国实体注册成立
          detail: Companies House 为 Tripledot Studios Limited 创建法律壳。
        - date: '2017'
          label: 公开创立故事开始
          detail: Tripledot 称公司由 Shiff、Babayigit 和 Chameides 在伦敦创立。
        - date: '2018'
          label: 早期 Velo 轮
          detail: Global Corporate Venturing 报道，Velo Partners 领投一轮 $8M 融资。
