  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 消费者细分和渠道结构
        blocks:
          - type: paragraph
            body: >-
              理解 Tripledot 的客户基础，最好把它看成一层通过应用商店获取的大众移动玩家，而不是传统企业客户名单。可见的 Android 产品目录覆盖 62 款应用，累计下载超过 5 亿次，在 AppBrain
              上平均评分 4.72；益智仍是主导类型，但纸牌、文字和休闲邻近品类也很清楚。Google Play 的在线开发者页面把 Woodoku、Solitaire、Blackjack、Sudoku 和 Word Hop
              放在前台，成为进入这批用户的代表入口；官网则称 Tripledot
              的游戏娱乐了数以百万计的玩家。这个组合意味着多类玩家画像并存：每天玩逻辑谜题的用户、把纸牌当日常的用户、文字或脑力训练用户，以及近期新品和收购组合带来的新受众。


              买方、用户和付费方的角色也比品类标签显示的更分散。在老牌益智和纸牌游戏里，下载者和玩家通常是同一个人，直接消费经由 Apple 或 Google 的计费通道，而不是 Tripledot
              自己的收银台。与此同时，隐私声明明确显示，非付费用户仍然重要，因为广告合作伙伴、广告交易平台和相关广告技术公司会在应用内把注意力变现。条款和隐私披露还显示，Facebook 或 Apple
              登录、公开个人资料、排行榜和其他社交功能，可能夹在玩家和游戏之间。因此，客户地图以终端用户为中心，应用商店和支付处理方是关键分发与付费中介，广告技术交易对手则构成广告资助场次的第二类付费方。
