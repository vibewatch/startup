      - number: '1.4'
        title: 如何使用这组底层事实
        blocks:
          - type: paragraph
            body: >-
              后续章节最安全、可复用的事实，是公司身份、截至 2022 年已披露的融资弧线、AppLovin 交易的存在及大致结构，以及移动游戏组合可见的广度。这些点在注册记录、公司公告、AppLovin
              备案文件和独立游戏行业报道之间相互印证。相反，本章不应被解读为当前股权结构清晰、交割后杠杆已经尘埃落定，或治理模型完全透明的证明。2026 年隐私通知中的过期注册地址说明，Tripledot
              的公开网页披露并不完全同步；从已备案本票结构转向现金交割公告，也说明仅靠交易摘要远远不够。


              Woodoku
              的评论模式也给下游分析提了醒。规模和下载成功是真实的，但部分当前面向用户的证据指向旗舰产品内部的广告负荷、卡顿和公平性感知摩擦。这并不推翻更大的公司故事；它只意味着产品质量、变现强度和资产组合韧性需要在产品和客户章节直接测试。应把这份概览视为强但非申报级的身份层：足以锚定事实，同时明确仍需管理层材料回答的所有权、融资和运营结构问题。
