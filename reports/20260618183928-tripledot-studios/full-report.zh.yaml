companyProfile:
  summary: >-
    Tripledot Studios 是一家创立于伦敦的移动游戏公司，围绕数据驱动的休闲免费游戏创作与运营搭建业务。公司在 2022 年以 $1.4 billion 估值融资 $116 million 后成为独角兽，随后借 2025
    年收购 AppLovin 移动游戏资产组合，把自己从高速增长的休闲游戏运营商，重新定位为多工作室、全球化的整合平台。交割后的公开披露称，公司拥有分布在 23 个城市的 12 个工作室、超过 2,500 名团队成员、超过 25
    million 日活用户、近 $2 billion 年化总收入，但经审计的运营细节仍未公开。
  foundedDate: '2017-01-01'
  founders:
    - name: Lior Shiff
      role: 联合创始人兼 CEO
      background: 游戏运营者，此前与 Product Madness 及社交赌场游戏的规模化有关。
