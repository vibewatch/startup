        title: 图表
        blocks:
          - type: callout
            title: 公开证据支持跟踪价格，而不是在迷雾中加价买入
            body: Tripledot 当前叙事估值可信到值得密切跟踪，但透明度不足，除非有更深的财务和债务披露，否则不支持买入建议。
