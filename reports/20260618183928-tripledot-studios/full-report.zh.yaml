      - number: '5.3'
        title: 信任、安全、质量与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开信任和质量披露偏消费者移动端，而非企业级。正面信号存在：隐私通知截至 2026 年 4 月仍是最新版本，服务条款界定了账户、虚拟物品、年龄门槛和功能条款，Woodoku 的 Google Play
              数据安全面板披露了主要收集和共享类别，声明了传输加密，用户也可以请求删除。隐私政策还点名服务提供商、分析、广告伙伴和支付处理商，有助于识别资产组合背后的真实依赖图。但质量和合规图景仍不完整。Tripledot
              没有公布公开状态页、单款游戏 SLA、审计轨迹或公共安全认证包，因此公开可靠性证据主要来自商店评论和更新节奏，而不是经审计的 uptime 或事故数据。Woodoku
              评论显示，玩家抱怨卡顿、进度未保存和侵入式广告；Zephyr
              相关隐私和条款页面也说明，至少部分被收购产品仍依赖单独的控制者和广告网络披露。因此，产品护城河是运营广度和资产组合多元化；承销风险则是对商店平台、广告生态以及收购后政策统一不均的依赖，而不是某个清楚披露、独立审计过的控制层。
