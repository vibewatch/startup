  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与替代品
        blocks:
          - type: paragraph
            body: >-
              Newzoo 给出的 $188.8 billion 全球游戏规模是上限，不是 Tripledot 的市场。Tripledot 可见产品目录几乎全是移动休闲游戏：Google Play 开发者页面以
              Woodoku、Solitaire、Blackjack、Sudoku、Word Hop 及相关产品为主；AppBrain 追踪 62 款 Android 应用，其中 42 款归入
              puzzle。证据指向的实际服务市场，是 iOS 和 Android 上的免费休闲移动游戏，尤其是益智、纸牌、文字及相邻的 hybrid-casual 体验，而不是整个游戏经济。


              排除边界很重要。Tripledot 的 Blackjack 页面明确写明没有真钱风险，因此它与纸牌的相邻关系是社交和免费游玩，不是受监管博彩。公司也不像追逐超短生命周期产品的 hypercasual
              工作室。其商店页面强调离线游玩、每日挑战、重复习惯，以及长会话的脑力训练或放松体验。TechCrunch 2022
              年访谈清楚抓住了底层待办任务：管理层说，手机游戏正在替代益智书和其他碎片时间娱乐，服务的是那些甚至不会自称玩家的用户。


              从市场角度看，Tripledot 卖的是低摩擦的每日注意力。最接近的替代品，是其他免费休闲应用、益智书、纸牌、文字游戏，以及争夺同一段个人空闲时间的短会话娱乐习惯。因此，相关相邻集合比单纯的 puzzle IAP
              更宽，但仍远窄于总体移动或总体游戏 TAM。
