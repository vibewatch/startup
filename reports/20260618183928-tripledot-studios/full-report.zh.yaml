      - number: '3.3'
        title: 分发、变现与真正的转换成本
        blocks:
          - type: paragraph
            body: >-
              公开定价证据很薄，因为这些公司不靠透明价目表竞争。可见比较项是免费游玩的包装：摩擦出现前有多少内容可玩，游戏更偏应用内购买还是广告，活动节奏多强地把玩家拉回来，以及发行商能多好地交叉推广其他产品。Playtika
              的备案在这里有用，因为它量化了平台依赖，显示即便规模化运营商也暴露在 Apple、Google、Facebook 以及支付或政策变化之下。Take-Two 对 Zynga
              的收购理由展示了另一层权力：一旦运营商拥有移动分发、广告技术和 LiveOps 能力，就能把这些工具部署到比独立工作室宽得多的 IP 基础上。


              对玩家而言，切入一款新游戏很容易；离开一个习惯却可能很难。活动、团队、排行榜、城堡翻新进度、社交地位和对资产组合的熟悉感，都会随着时间形成真实锁定，哪怕下载免费。Royal Match
              反复举办的竞赛清楚说明了这种动态。Tripledot 扩大的目录有帮助，因为它能把用户获取和交叉推广分摊到比过去更多的产品上；但同一逻辑在更大规模上也有利于 Zynga、King 和
              Scopely。因此，竞争更少关乎一次性的机制新鲜感，更多关乎谁拥有足够的内容、变现能力和推广表面，把玩家留在自己的生态内流动。
