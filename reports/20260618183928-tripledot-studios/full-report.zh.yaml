      - number: '1.3'
        title: 资产组合足迹与运营规模
        blocks:
          - type: paragraph
            body: >-
              开放平台证据支持一个判断：Tripledot 不只是一款爆款游戏工作室。Google 开发者页面清楚地把 Woodoku、Solitaire、Blackjack、Sudoku、Word Hop 等知名休闲产品归在
              Tripledot 旗下。AppBrain 给出的证据更进一步，追踪到 62 款 Android 应用，并显示 Tripledot 在十多个国家进入前 100。Woodoku
              仍是这个更大组合里最清晰的旗舰信号：AppBrain 估计其下载量约 130 million、评分约 430 thousand；Google Play 显示约 432 thousand
              条评论。与此同时，周边应用页面展示的是品类扩散，而不是依赖单一机制：离线 Solitaire、公平随机发牌 Blackjack、每日挑战式文字逻辑玩法，都出现在在线目录中。


              AppLovin 资产组合收购把这些产品信号抬升为一个大得多的运营足迹故事。GamesBeat 和 Business Wire 称，合并后公司将拥有分布在 23 个城市的 12 个工作室、超过 2,500
              名团队成员、超过 25 款在线游戏、约 25 million 日活用户、近 $2 billion 年化总收入。GamesBeat 还列出交易前办公室网络：伦敦、华沙、明斯克、巴塞罗那、雅加达和墨尔本，说明
              Tripledot 在吸收另 10 个工作室之前就已经国际化分布。因此，规模叙事可信，方向上也有较好支撑。公开层面仍未验证的是规模之下的单款游戏结构：Woodoku
              看起来很大，但管理层称没有任何单款游戏超过净收入 10%，这仍需要内部看板，而不是外部应用商店代理指标。
