      - number: '6.2'
        title: 具名证据和耐久性代理指标
        blocks:
          - type: paragraph
            body: >-
              公开具名客户证据最强的一层在评论，尤其是 Woodoku。三位近期 Google Play 具名评论者显示的是真实生产使用，而不是只有 logo 的社会证明：一位评论者在 2026 年 4
              月称游戏像被操纵，但为了冲击汽油奖励里程碑仍值得使用；另一位在 2025 年 3 月描述了卡顿、崩溃、进度丢失和广告负载过重；第三位在 2025 年 5
              月称广告会在几秒内打断游戏。这些轶事不能证明全体用户的留存或变现质量，但能证明当前在线产品存在活跃会话，而且新鲜度足以进入 2026 年尽调。Google Play 还显示 Tripledot
              支持团队在回应这些投诉，说明这是一个在线服务，而不是被遗弃的旧目录应用。


              耐久性更容易用代理指标判断，难以直接证明。Tripledot 的公开应用界面反复强调每日挑战、每周新增谜题、统计、自动保存、提示、连续打卡、离线游戏、排行榜和 Facebook
              竞赛——这些都是消费移动游戏里驱动重复参与的经典习惯循环工具。AppBrain 和 Google Play 指标也说明，这些不是沉睡列表：过去 30 天 Woodoku 仍约有 49 万次下载，Solitaire
              约 56 万次，Blackjack 约 13 万次，Spades 约 21 万次；抽样的 2018-2020 年产品在 2025-2026 年仍有更新。这是持续重复使用和 live ops
              的可信证据，但仍然只是代理证据。公开来源没有披露单款游戏 cohort、付费转化、GRR、流失或广告主侧续约行为。
