  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、变现结构与确认边界
        blocks:
          - type: paragraph
            body: >-
              Tripledot 的公开收入故事容易勾勒，但仍难承销。可观察模型是通过益智、纸牌和文字游戏免费分发，变现来自应用内购买和广告的组合，而不是预付费下载。Apple 和 Google
              商店证据显示，Woodoku、Blackjack 和 Cryptogram 都带有广告和应用内购买层，Solitaire 则呈现为广告主导的常青纸牌产品。隐私通知还确认，Tripledot
              与广告主、广告交易平台和广告技术供应商共享玩家信息，这正是广告支持型移动游戏组合在运营上需要做的事。


              AppLovin 收购把这一模型从老牌常青益智和纸牌变现，扩展到一个更大的资产组合；管理层和独立报道都称，该组合在 IAP
              和广告经济之间取得平衡。这个多元化故事在财务上重要，因为它与一个主张绑定：交割后没有任何单款游戏应超过净收入
              10%。如果属实，收入质量实质性改善：单款集中度更低、交叉推广表面更大、可优化变现的安装基础更大。公开牵引力方向上也强，从 2022 年 25 million 至 30 million 月活，走到交易后约 25
              million 日活和近 $2 billion 年化总收入。


              承销问题在于，公开记录停在标题层面。官方材料说的是年化总收入，但没有解释哪些项目被 gross up 或 net down，平台费在披露数字之上还是之下，也没有说明广告网络收入分成如何进入收入确认。单款游戏
              IAP 价格阶梯和去广告包容易验证；实际结构、抽成率、退款和净收入桥则无法验证。这让收入质量优于单爆款工作室，但从外部尽调看仍达不到会计级精度。
