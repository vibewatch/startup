      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              Tripledot 的资产组合指向四类经济属性不同、行为上相近的用户段。Woodoku 是面向成人的每日逻辑益智产品；Solitaire 是带离线游玩和每日挑战的轻松纸牌习惯；Cryptogram
              把同一套日常机制延伸到文字和破译玩法；AppLovin 之后的足迹则加入 hybrid-casual 和更广的广告变现循环。这些细分都共享短会话、低门槛，但付费架构并不完全相同。


              在纯益智和纸牌产品中，用户和付费方通常是同一个人，通过 Apple 或 Google 账单花费小额家庭娱乐预算。在广告主导或 hybrid-casual
              循环中，玩家仍是用户，但会出现第二个付费方：购买展示、激励视频完成或其他注意力库存的广告主。这一区分很关键，因为 Business Wire 明确把扩大后的 Tripledot 定义为同时具备 IAP 和 IAA
              模型能力。市场需求因此应按变现设计分层，至少要和按品类分层同等重要。


              Udonis 进一步强化了这一视角的价值。休闲游戏是安装量的主要来源，休闲广告也影响 mid-core
              游戏安装，这意味着该品类不只是直接向玩家变现；它还在更广的移动生态中输出获客需求和广告库存。采用通常从低摩擦发现开始，然后要么通过进度和便利性转化为直接消费，要么通过反复非付费游玩转化为广告收益。
