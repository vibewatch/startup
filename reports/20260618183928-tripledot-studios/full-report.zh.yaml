    type: funnel
    layout: standard
    summary: 公开采用代理指标从组合级 Android 触达到旗舰安装量、新游戏动能，再收窄到交易后的日活受众。
    approximationNotes: 这是代理漏斗，不是字面意义上的转化瀑布。它叠加了不同的公开受众锚点——累计 Android 下载量、旗舰游戏安装量、合并后公司的 DAU 和新游戏月度安装信号——因为 Tripledot 没有发布一条同口径可比的客户漏斗。
