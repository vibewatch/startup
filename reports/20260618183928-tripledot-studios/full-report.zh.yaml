      - number: '8.3'
        title: 可比公司、情景逻辑和估值区间
        blocks:
          - type: paragraph
            body: |-
              最清晰的公开可比结论不是单一数字，而是一个区间。高端看，Scopely $4.9B 出售和
              Zynga $12.7B 被收购显示，当买方相信移动平台具备耐久系列资产、
              跨产品运营杠杆和大型战略期权价值时，规模化移动平台可以拿到什么价格。低端看，Playtika 2026 年 6 月公开
              估值说明，即便是拥有数十亿美元收入的规模化移动发行商，当市场折价增长质量、集中度和品类组合时，也可能按约 1.1x 企业
              价值 / 收入交易。相比之下，Take-Two
              的公开倍数高得多，因为它把移动与主机、PC 和自有 IP 深度结合；AppLovin
              当前倍数则由广告技术经济性驱动，因此不是干净的游戏可比。

              在这个框架下，Tripledot 隐含约 $2.0B 的标记并不明显荒唐。它仍低于更大的 战略 M&A
              先例，也离公开移动发行商收入倍数的低端不远。但 总收入与净收入的问题
              很关键：接近 $2B 年总收入，不能一比一转化为上市公司净 收入、
              营业收入或自由现金流。因此，情景分析不支持 BUY。牛市情景成立的前提是 组合分散、收入质量和适度杠杆都被证明；基准情景把 今天的叙事
              价值视为大致公允；熊市情景则显示，如果杠杆重于 预期，或总到净转换偏弱，股权支撑会多快压缩。
