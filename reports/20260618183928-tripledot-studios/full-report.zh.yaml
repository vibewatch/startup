  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Tripledot 的主要风险通过收入耐久性、利润率灵活性和战略自由度传导到价值，而不是通过某个孤立失效模式。
    data:
      nodes:
        - label: 平台执行
          note: 商店规则和计费要求可直接影响发布节奏和变现
        - label: 隐私 / 儿童合规
          note: 广告技术和受众规则可能从披露缺口升级为政策行动
        - label: 玩家口碑和质保
          note: 广告负载、崩溃或公平性感知，可能先于已报告收入影响留存
        - label: 整合复杂度
          note: 工作室、游戏和工具越多，执行风险越宽
        - label: 融资不透明
          note: 即使业务仍盈利，未知的贷款方条款也可能限制灵活性
        - label: 收入耐久性
          note: 分发、留存和游戏组合决定规模是否稳定
        - label: 利润率灵活性
          note: 计费规则、UA 成本和伙伴抽成影响变现质量
        - label: 战略灵活性
          note: 债务条款和整合负担可能约束未来并购或运营动作
        - label: 估值倍数
          note: 即使增长延续，剩余不确定性也会促使投资者打折
      edges:
        - from: Platform enforcement
          to: Revenue durability
          label: 分发或计费摩擦可能打击预订收入
        - from: Privacy / children compliance
          to: Margin flexibility
          label: 广告和数据约束可能降低变现效率
        - from: Player sentiment & QA
          to: Revenue durability
          label: 广告或缺陷损害体验时，留存会走弱
        - from: Integration complexity
          to: Player sentiment & QA
          label: 更多代码库和团队抬高发布与质保风险
        - from: Integration complexity
          to: Strategic flexibility
          label: 组合控制会吃掉管理层带宽
        - from: Financing opacity
          to: Strategic flexibility
          label: 未知契约可能限制资本配置
        - from: Revenue durability
          to: Valuation multiple
          label: 耐久性走弱会降低信心
        - from: Margin flexibility
          to: Valuation multiple
          label: 变现质量下降会压缩估值
        - from: Strategic flexibility
          to: Valuation multiple
          label: 约束风险推高折现率
    claimRefs:
      - CR017
      - CR018
      - CR025
      - CR029
      - CR030
      - CR038
      - CR039
      - CR045
      - CR046
      - CR047
      - CR049
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Tripledot 的发行栈依赖一组紧密的分发、计费、广告技术和融资交易对手；它们的政策可层层传导到经营结果。
    data:
      nodes:
        - label: Apple App Store
          note: iOS 分发和审核关口
        - label: Google Play
          note: Android 分发、政策关口和计费轨道
        - label: Apple / Google / Amazon 支付
          note: 应用内购买的第三方处理
        - label: 广告技术和社交伙伴
          note: 营销、跨设备链接、组件和分析
        - label: 收购工作室
          note: 十个新增工作室组织和游戏集合
        - label: Bank of America 抵押品代理
          note: 有担保贷款方边界的可见标记
        - label: Tripledot 发行栈
          note: 核心实时运营、变现、产品和支持层
        - label: 玩家收入和留存
          note: 这些依赖最终会影响的经济产出
      edges:
        - from: Apple App Store
          to: Tripledot publishing stack
          label: 分发与审核
        - from: Google Play
          to: Tripledot publishing stack
          label: 分发、政策与计费
        - from: Apple / Google / Amazon payments
          to: Tripledot publishing stack
