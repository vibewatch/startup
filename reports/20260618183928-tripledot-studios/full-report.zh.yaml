      - number: '5.2'
        title: 架构、工作室支持与外部依赖
        blocks:
          - type: paragraph
            body: >-
              公开架构故事的重点，不是某个专有后端栈，而是 Tripledot 如何编排移动分发、变现、工作室整合和内容节奏。消费者主要通过 Apple、Google，有时也通过 Amazon
              的支付和分发轨道访问产品；Tripledot 的隐私材料明确称，这些平台处理购买，而部分服务还依赖 Apple Sign-in、Facebook
              登录、导入联系人，以及公开排行榜或一对一功能。在运营模型层，Business Wire 描述了覆盖营销、产品、AI
              和变现的共享支持系统，这与公司成为数据驱动、多工作室集团的表述一致，而不只是内部孵化休闲应用的开发商。AppLovin 交割通知和 AppLovin 8-K 又补充了一个重要技术运营细节：10 个工作室转入
              Tripledot，协议还设想了过渡服务、共享记录访问和其他交割后整合机制。公开商店页面也显示出可见的运营异质性。几款经典 Tripledot 产品使用 Tripledot
              支持和法律表面，而一些较新的排序和交通类产品仍指向 Zephyr Mobile 支持或政策页面。这说明，在继承来的工作室、产品管线和政策栈仍在迁移的资产之上，公司已经叠加了一个中央发行层。
