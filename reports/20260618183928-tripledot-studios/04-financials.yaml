- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Gross-to-net revenue bridge
    - Only annual gross revenue is claimed publicly
    - Cannot calculate net revenue quality, platform deductions, or gross margin
    - Request audited revenue-recognition policy and monthly gross-to-net bridge by platform.
  - - Title-level bookings and IAP/IAA mix
    - No public by-title split
    - Cannot verify concentration, monetization durability, or ad dependency
    - Request title P&Ls, payer mix, ad ARPDAU, and revenue concentration dashboard.
  - - Current debt balance and covenants
    - Seller note described; final bank package undisclosed
    - Cannot assess refinancing risk, interest burden, or covenant headroom
    - Request signed debt documents, payoff letters, and lender compliance certificates.
  - - Cash balance, burn, and runway
    - No public disclosure
    - Cannot judge capital adequacy or next-round urgency
    - Request trailing 12-month cash bridge, operating burn, and board budget package.
  - - Working-capital cadence
    - No receivables, deferred revenue, or payables detail
    - Cannot model seasonal cash conversion or marketing prepay pressure
    - Request monthly working-capital schedule and cash-conversion analysis.
  notes: Each row is a real diligence blocker rather than a cosmetic gap; none can be closed reliably from public evidence alone.
