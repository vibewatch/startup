  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: title-level-economics-and-revenue-recognition
    missingEvidence: A title-level gross-to-net bridge covering bookings, IAP-versus-IAA mix, platform fees, ad-network revenue share, refunds, and gross profit by major title.
    whyItMatters: Revenue quality and margin sustainability cannot be underwritten from gross-revenue headlines or storefront price ladders alone.
    diligencePath: Request monthly title P&Ls, a formal revenue-recognition memo, and dashboards showing bookings, net revenue, and gross profit by title and platform.
    relatedQuestionRefs:
    - QI022
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: post-close-leverage-and-runway
    missingEvidence: The signed debt package or payoff package that replaced or supplemented the original seller note, plus current cash, burn, and covenant headroom.
    whyItMatters: Capital adequacy, interest burden, and refinancing risk are impossible to judge while the live debt stack and liquidity runway remain undisclosed.
    diligencePath: Request the executed debt agreements, closing funds-flow memo, monthly cash bridge, and lender compliance certificates since June 2025.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: working-capital-cadence
    missingEvidence: Receivables, payables, deferred revenue, and app-store settlement timing by platform.
    whyItMatters: Even asset-light gaming businesses can experience cash stress if UA spend, platform settlement timing, or deferred revenue creates working-capital swings.
    diligencePath: Request monthly working-capital schedules by platform and title for the last 12 months.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI003
    - TI005
