summary: Tripledot looks like a diversified free-to-play mobile-games operator whose revenue quality likely improved after the AppLovin portfolio acquisition, but public evidence still stops short of an underwriteable net-revenue, margin, and debt picture. The core blockers are unresolved post-close leverage, missing title-level IAP-versus-IAA economics, and no public cash or runway disclosure.
sections:
- id: revenue-model-mix-and-recognition
  title: Revenue model, monetization mix, and recognition limits
  body: |-
    Tripledot’s public revenue story is easy to sketch and still hard to underwrite. The observable model is free-to-play distribution across puzzle, card, and word titles, with monetization coming from a mix of in-app purchases and advertising rather than from paid upfront downloads. Apple and Google storefront evidence shows Woodoku, Blackjack, and Cryptogram all carry both advertising and in-app purchase layers, while Solitaire surfaces as an ad-led evergreen card title. The privacy notice also confirms that Tripledot shares player information with advertisers, ad exchanges, and ad-tech providers, which is exactly what an ad-supported mobile-game portfolio would need to do operationally.

    The AppLovin acquisition broadened that model from legacy evergreen puzzle and card monetization into a larger portfolio that management and independent coverage describe as balancing IAP and ad-based economics. That diversification story matters financially because it is paired with the claim that no single game should exceed 10% of post-close net revenue. If true, revenue quality improved materially: less title concentration, more cross-promotion surface, and a larger installed base from which to optimise monetization. Public traction is directionally strong too, moving from 25 to 30 million monthly users in 2022 to about 25 million daily active users and nearly $2 billion of annual gross revenue after the deal.

    The underwriting problem is that the public record stops at the headline. Official materials say annual gross revenue, but they do not explain what is grossed up or netted down, whether platform fees sit above or below the disclosed figure, or how ad-network revenue share flows through recognition. The existence of title-level IAP price ladders and ad-removal packs is easy to verify; the realized mix, take rates, refunds, and net-revenue bridge are not. That leaves revenue quality better than a one-hit studio, but still not accounting-grade from outside diligence.
