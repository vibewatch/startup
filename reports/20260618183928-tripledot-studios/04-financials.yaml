- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: |-
    Public evidence supports a constructive but incomplete financial view. Constructive, because Tripledot looks like a real cash-generating mobile operator rather than a speculative pre-revenue studio: 2022 sources reported profitability, the current portfolio is broad, the product catalog is actively maintained in 2026, and the AppLovin acquisition appears to have reduced single-title dependence while expanding both IAP and ad-based monetization. In category terms, that is the right shape for revenue resilience.

    Incomplete, because every item that matters for underwriting still disappears behind private dashboards. Public sources do not give title-level bookings, cohort retention, realized platform take rates, the IAP-versus-IAA mix, net revenue bridges, current working-capital behavior, or current leverage. Even the most visible headline, nearly $2 billion of annual gross revenue, is not enough on its own because gross revenue is not the same as recognized net revenue or gross profit. Likewise, the final debt package remains materially under-disclosed despite the Bank of America charge and the earlier seller-note covenant schedule.

    The verdict is therefore not negative on fundamentals but cautious on diligence quality. Revenue quality is plausibly improving through diversification; margin expansion is plausible if Tripledot’s UA and monetization playbooks travel to the acquired studios; capital intensity is lower than hardware or manufacturing businesses but higher than a pure organic studio because acquisition financing can dominate the cash story. The chapter’s gating blocker is straightforward: before underwriting, diligence needs title-level P&Ls, a net-revenue bridge, and the signed debt package that replaced or sat alongside the original note structure.
