  rows:
  - - Tripledot (reference)
    - Multi-studio casual and puzzle operator
    - 12 studios, 23 cities, 25M DAU, nearly $2B gross revenue after AppLovin portfolio close
    - Broad casual mobile audience across puzzle, card, word, and newly acquired adjacent genres
    - 25+ live games plus acquired portfolio spanning IAP and IAA models
    - Now scaled enough to matter globally, but must integrate a much more diverse studio mix
  - - King
    - Incumbent puzzle portfolio leader
    - 200+ titles and Candy Crush still at roughly $1B 2024 revenue
    - Mainstream puzzle and casual players
    - Candy Crush ecosystem plus adjacent casual titles
    - Scale and franchise depth are strong; growth is more incumbent defense than fresh category creation
  - - Playtika
    - Public live-ops and monetization specialist
    - $2.76B 2024 revenue with 98.4% from in-game purchases
    - Paying mobile players, especially social casino and live-ops heavy segments
    - Portfolio of multiple mobile titles, personalized offers, D2C and IAP optimization
    - Disclosure is strong, but concentration, platform dependence, and regulatory exposure remain material
  - - Scopely
    - Sovereign-backed diversified franchise operator
    - $4.9B Savvy acquisition and breakout momentum from Monopoly GO
    - Community-driven mobile players across social, casual, and licensed franchises
    - Portfolio of franchise games with strong events and social loops
    - Capital depth is high; direct puzzle overlap is less pure than King or Dream Games
  - - Jam City
    - Scaled casual catalog peer
    - Company says franchises have amassed billions of installs since 2010
    - Mass-market mobile players across casual and entertainment-led titles
    - Long-running global franchises and interactive entertainment portfolio
    - Current public financial detail is thinner than public-company peers
  - - Zynga / Take-Two
    - Cross-platform mobile publishing platform
    - Take-Two paid about $12.7B and says the combined business exceeds 10B mobile downloads
    - Players across casual, puzzle, social casino, sports, and IP-led mobile games
    - Diversified mobile publishing, LiveOps, Chartboost, and console-to-mobile IP pipeline
    - Less puzzle-pure than King or Dream Games, but structurally powerful on distribution and IP reuse
  - - Dream Games
    - Puzzle-first premium specialist
    - Founded in 2019; global hits in Royal Match and Royal Kingdom
    - Match-3 and puzzle players seeking polish, progression, and event competition
    - Focused puzzle portfolio centered on Royal Match universe
    - Narrower portfolio than Tripledot, but sharper category focus and cleaner UX proposition
  notes: Scale cells mix disclosed company metrics with independently reported deal context; no row implies audited like-for-like profitability or title-level economics.
