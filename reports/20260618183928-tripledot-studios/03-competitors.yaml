callouts:
- calloutType: insight
  title: The competitive lens changed more than the product mix did
  body: The AppLovin deal re-rated Tripledot into the same strategic bucket as scaled portfolio operators. Even if many flagship games still look casual and puzzle-led, the real benchmark now is who runs the better multi-studio operating system.
  claimRefs:
  - CP001
  - CP022
  - CP038
- calloutType: risk
  title: Integration is the main moat test
  body: Tripledot gained scale, genre breadth, and monetization diversity, but it also inherited studios that are farther from its historic center of gravity. If portfolio learning does not travel well across those teams, the acquisition raises complexity faster than it raises defensibility.
  claimRefs:
  - CP002
  - CP037
  - CP038
- calloutType: insight
  title: Ad-free puzzle polish is a live competitive wedge
  body: Dream Games shows that a narrower puzzle specialist can still pressure a bigger operator by promising smoother sessions, more events, and less ad friction. That matters because user trust and habit quality can be as important as raw portfolio size.
  claimRefs:
  - CP020
  - CP027
  - CP035
