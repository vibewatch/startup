- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Portfolio scale alone is enough to create durable advantage
    - Scaled rivals already exist above Tripledot, especially Scopely, Playtika, and Zynga / Take-Two
    - High
    - Public sources show several operators with larger or more disclosed scale and stronger distribution engines
    - Test whether post-deal cross-promotion, UA efficiency, and retention actually improved versus pre-deal levels
  - - Puzzle expertise is defensible on its own
    - "King and Dream Games show specialists can still dominate puzzle without matching Tripledot\u2019s broader portfolio"
    - High
    - Candy Crush remains a billion-dollar franchise and Royal Match still differentiates on ad-free polish and events
    - "Request title-level retention, payer conversion, and event engagement for Tripledot\u2019s top puzzle titles"
  - - Data science can offset weaker disclosure
    - Public peers disclose enough to benchmark pressure on concentration, platform dependence, and margins while Tripledot does not
    - Medium
    - "Playtika\u2019s 10-K lays out platform, concentration, and margin risks in detail; Tripledot does not provide equivalent public granularity"
    - Obtain internal board materials on title concentration, platform mix, and margin by top games
  - - Broader genre exposure lowers execution risk
    - "AppLovin added studios outside Tripledot\u2019s historic casual center, increasing integration complexity"
    - High
    - Mobile Marketing Reads highlights genre differences including midcore and 4X-heavy additions
    - Break out acquired versus legacy studio KPIs, org design, and creative leadership continuity
  - - Player trust is secondary in casual puzzle
    - Ad load, misleading creatives, or UX friction can still damage retention and brand perception
    - Medium
    - Business of Apps cites past ASA intervention on Playrix creatives, while Woodoku reviews complain about ads and performance
    - Track review sentiment, ad-load thresholds, and event satisfaction by flagship title
  - - Market growth will lift all strong operators
    - Live-services arms race can commoditize mechanics and reward only the best operators
    - High
    - Sensor Tower says publishers are leaning harder on existing titles and hybrid monetization as new audience creation gets harder
    - "Benchmark Tripledot\u2019s live-ops tooling, event cadence, and reuse of best practices across studios versus leading peers"
  notes: Severity is underwriting severity as of 2026-06-18, not a legal judgment; each risk is framed against the public evidence retained for this chapter.
