  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-unit-economics
    missingEvidence: Title-level bookings, ad-mix, payer conversion, UA payback, and contribution-margin data for Tripledot, Dream Games, Jam City, and Scopely's key mobile titles.
    whyItMatters: Without unit-economics disclosure, the chapter can compare scale and design direction but cannot determine whether Tripledot's new size is actually more efficient than leading rivals.
    diligencePath: Request monthly title dashboards for the top ten games, including payer conversion, ROAS payback windows, ad share of revenue, and contribution margin by studio.
