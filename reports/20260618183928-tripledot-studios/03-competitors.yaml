  rows:
  - - Tripledot
    - Free download; no public portfolio rate card
    - Historically casual F2P, now broader mix of IAP and IAA after AppLovin
    - Breadth and diversification; management says no single game >10% of net revenue post-deal
    - Title-level ad mix, payback, and contribution margin remain private
    - Scale improved, but proof of efficient integration is still missing
  - - King
    - Free-to-play freemium puzzle model
    - Long-tail puzzle content and franchise extensions
    - Familiar mechanics, giant installed base, and deep content backlog
    - Current portfolio-level ad mix and title-level economics are not publicly granular
    - King is the incumbent proof that puzzle depth alone can still compound at scale
  - - Playtika
    - Free-to-play with heavy IAP and D2C optimization
    - Personalized live-ops, social-casino spending loops, and in-game offers
    - Designed to maximize payer conversion and retention
    - Exact title-by-title margin and casual acquisition ROI are not public
    - Tripledot gains scale but still lacks Playtika-level public evidence on monetization rigor
  - - Scopely
    - Free-to-play event and social-loop packaging
    - Community competition, franchise events, and social progression
    - Strong habit formation and friend-based retention
    - No public title-by-title pricing formula or ROI disclosure in retained sources
    - Tripledot must match event quality and community stickiness, not only catalog size
  - - Jam City
    - Free-to-play casual packaging in retained public view
    - Franchise-driven casual monetization
    - Large historical install base
    - Current pricing, live-ops cadence, and profitability detail are not public here
    - Jam City competes more on breadth than transparency
  - - Zynga / Take-Two
    - Free-to-play mobile publishing with ad-tech support
    - LiveOps, cross-marketing, and potential console-to-mobile IP conversion
    - Diverse portfolio lowers single-title dependence
    - Current segment-level unit economics for specific franchises are not public in retained sources
    - "This is a likely entrant class that can bring outside IP into Tripledot\u2019s lanes"
  - - Dream Games
    - Free-to-play but flagship Royal Match is explicitly marketed as 100% ad free
    - IAP-led progression, thousands of levels, and event rewards
    - Clean session flow and premium-feeling UX
    - Private funding, margin, and marketing economics are opaque
    - Dream Games shows that ad-light polish can be a true competitive wedge
  notes: This category competes through free-to-play packaging, event cadence, ad load, and IAP design rather than transparent list prices or enterprise contracts.
