tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Public-evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track
        - 'The implied ~$2.0B mark is directionally supportable, but the public record is still gross-revenue-based and debt-opaque.'
        - 'Do not treat the current narrative price as a blind buy signal.'
      - - Confidence
        - Medium
        - 'Funding, transaction structure, public comps, and market context are visible, but audited net revenue and debt terms are not.'
        - 'Good enough for directional valuation work, not enough for fully underwritten conviction.'
      - - Risk rating
        - High
        - 'Execution, leverage opacity, and private-company disclosure limits dominate the downside case.'
        - 'Require tighter diligence or a wider entry discount.'
      - - Valuation stance
        - Fair
        - 'The mark is below larger strategic precedents and near lower-end public mobile-publisher multiples, but not clearly cheap.'
        - 'Price can be defended, but margin of safety is limited.'
      - - Entry discipline
        - 'Disclosure first, or a material discount to the implied current mark'
        - 'Public evidence does not reveal the signed debt package, net revenue bridge, or preference stack.'
        - 'Without those items, underwriting should get harder as price rises.'
      - - Exit posture
        - 'Later strategic sale or sponsor secondary is more supportable than a near-term IPO'
        - 'Integration is recent and public reporting is still private-company thin.'
        - 'Underwrite value creation through integration proof rather than fast public liquidity.'
    notes: >-
      This table converts public evidence into an investability call, not an audited fairness opinion. The recommendation is
      explicitly price-sensitive and disclosure-sensitive.
