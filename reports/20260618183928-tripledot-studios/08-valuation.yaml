callouts:
  - calloutType: recommendation
    title: Public evidence supports tracking the price, not paying through the fog
    body: >-
      Tripledot's current narrative valuation is credible enough to monitor closely, but not transparent enough to support a
      buy recommendation without deeper financial and debt disclosure.
    claimRefs:
      - CV008
      - CV015
      - CV042
      - CV045
  - calloutType: risk
    title: Debt opacity is the single biggest hidden variable
    body: >-
      The difference between fair and stretched is likely less about DAU and more about what sits inside the Bank of America
      facility, including covenants, amortization, and any constraints on future capital actions.
    claimRefs:
      - CV007
      - CV016
      - CV036
      - CV048
  - calloutType: assumption
    title: Treat the ~$2B mark as a directional narrative, not an audited fairness opinion
    body: >-
      The 20% equity stake and cash-close math support a rough current mark, but public evidence still does not reconcile that
      headline to net revenue, EBITDA, or a fully diluted common-equity waterfall.
    claimRefs:
      - CV008
      - CV009
      - CV015
      - CV049
