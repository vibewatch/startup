figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from real scale and portfolio breadth into a fair but non-buy valuation call because debt,
      net-revenue quality, and cap-table visibility remain unresolved.
    data:
      nodes:
        - id: predeal
          label: 'Pre-deal proof: profitable operator, $1.4B 2022 round'
        - id: scale
          label: 'Post-close scale: 25M+ DAU and nearly $2B gross revenue'
        - id: price
          label: 'Current narrative mark: roughly $2.0B implied'
        - id: gap
          label: 'Disclosure gap: debt terms, net revenue, preferences'
        - id: comps
          label: 'Comp bracket: above Playtika floor, below Scopely and Zynga precedents'
        - id: output
          label: 'Output: TRACK / FAIR / HIGH RISK'
      edges:
        - from: predeal
          to: scale
          label: demonstrates execution base
        - from: scale
          to: price
          label: supports a higher mark
        - from: price
          to: comps
          label: needs external validation
        - from: gap
          to: output
          label: blocks buy conviction
        - from: comps
          to: output
          label: keeps stance fair, not cheap
    approximationNotes: >-
      Node labels are editorial reductions of the evidence set rather than a probability model. The figure is intended to show
      why the recommendation stops at track despite real scale.
    claimRefs:
      - CV001
      - CV006
      - CV012
      - CV016
      - CV033
      - CV038
      - CV042
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The biggest valuation swings come from debt transparency and gross-to-net revenue conversion, not from another small
      change in the headline top-line story.
    data:
