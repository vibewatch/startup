  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market
        - 'Casual and puzzle gaming remain large, habit-driven categories with durable spend and engagement.'
        - 'Newzoo and Sensor Tower point to mature mobile growth rather than a fresh category re-rating.'
        - 'Faster category growth or better proof of pricing power would strengthen the upside case.'
      - - Product and portfolio
        - 'The AppLovin deal transformed Tripledot from a smaller casual specialist into a diversified mobile portfolio operator.'
        - 'Integration complexity across acquired studios can dilute operational gains and delay synergies.'
        - 'Post-close KPI disclosure by legacy versus acquired studios would reduce uncertainty.'
      - - Customers
        - 'The company claims 25M+ DAU and no single game above 10% of net revenue, which would materially improve diversification.'
        - 'The 10% cap is still management-stated and not validated by title-level bookings or DAU disclosure.'
        - 'A title-level revenue and DAU bridge would move this pillar from narrative to proof.'
      - - Financials
        - 'A roughly $2.0B implied mark can be defended if net revenue quality and leverage are better than feared.'
        - 'Gross revenue is public, net revenue is not, and the debt package is still private.'
        - 'Audited 2025 net revenue, EBITDA, and debt service would materially improve conviction.'
      - - Competition
        - 'Tripledot is still materially below Scopely and Zynga on valuation, leaving room if integration succeeds.'
        - 'Public-market comparables like Playtika show the market can value scaled mobile publishers much more conservatively.'
        - 'Sustained net-revenue quality and stronger disclosure would justify leaning away from the public-market discount.'
      - - Risk and financing
        - 'Replacing the seller note with cash at close simplified optics and kept AppLovin aligned as a 20% shareholder.'
        - 'The Bank of America charge suggests leverage remains a hidden but important equity variable.'
        - 'Full debt documents and the post-close cap table would most quickly change the recommendation.'
    notes: >-
      Pillars intentionally connect market, product, customers, financials, competition, and risk to the valuation call.
      Several anti-thesis cells remain unresolved because the missing evidence is private rather than unavailable in principle.
