  - id: exit-readiness-thesis-breakers-and-diligence
    title: Exit readiness, thesis-break triggers, and final diligence asks
    body: |-
      Tripledot is not publicly exit-ready today in the sense that an outside investor can underwrite it like a filing-grade
      public company. The business may eventually support an IPO or a premium strategic sale, but public evidence still lacks
      the ingredients that would let a new investor treat the current private mark as an audited underwriting fact. The more
      supportable medium-term exit paths are a later strategic sale, a sponsor-backed secondary, or a refinanced liquidity
      event after integration milestones and debt transparency improve.

      The practical diligence agenda is therefore narrow and high value. First, investors need audited 2025 net revenue,
      EBITDA, and a gross-to-net bridge. Second, they need the signed Bank of America facility package, including principal,
      maturity, covenant headroom, and any limits on future M&A or distributions. Third, they need the current cap table and
      liquidation preferences, including AppLovin's governance or information rights. Thesis-break triggers are also visible
      from public evidence: a disclosed down-round, debt terms that make the equity far more levered than the headline mark
      suggests, or evidence that diversification is weaker than advertised would all undermine the fair-value case quickly.
