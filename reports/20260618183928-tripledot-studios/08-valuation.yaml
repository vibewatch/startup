  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-net-revenue-and-ebitda
      missingEvidence: Audited 2025 net revenue, EBITDA, and a gross-to-net bridge for legacy versus acquired studios.
      whyItMatters: The current valuation narrative relies on gross revenue and cannot be translated cleanly into public-comp multiples or debt-service coverage without this bridge.
      diligencePath: Request audited annual statements plus a management schedule reconciling gross revenue to net revenue, EBITDA, and cash generation by portfolio segment.
      relatedQuestionRefs:
        - QV009
        - QV021
        - QV022
        - QV025
    - type: private-evidence-only
      severity: material
      topic: debt-package
      missingEvidence: The signed Bank of America credit agreement, including funded principal, interest margin, maturity, amortization, covenant headroom, and permitted-liens basket.
      whyItMatters: Debt can move Tripledot from a fairly priced strategic asset to a stretched equity stub if leverage or covenant restrictions are heavier than outside investors assume.
      diligencePath: Obtain the executed facility package, the first compliance certificate, and any board materials describing post-close refinancing plans.
      relatedQuestionRefs:
        - QV010
        - QV026
        - QV027
    - type: private-evidence-only
      severity: material
      topic: cap-table-preferences
      missingEvidence: A current fully diluted cap table showing AppLovin's exact share count, liquidation preferences, anti-dilution provisions, and any board or information rights.
      whyItMatters: The headline valuation says little about common-equity outcomes if preferences or protective terms materially alter the waterfall.
      diligencePath: Request the latest cap-table export, shareholder-rights summary, and the post-close governance matrix.
      relatedQuestionRefs:
        - QV011
        - QV026
        - QV029
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-universe
      missingEvidence: Private-round or secondary-market marks for other scaled casual or hybrid-casual operators such as Dream Games or Playrix.
      whyItMatters: The current comparable table is decision-useful but still incomplete on private peer marks, which limits precision when triangulating a private-company discount.
      diligencePath: Add private-market comp sheets, recent secondary marks, or investor materials for peer casual-game operators before final investment committee review.
      relatedQuestionRefs:
        - QV012
        - QV013
        - QV014
      relatedTableRefs:
        - TV004
