runDate: '2026-06-18'
company:
  name: Tripledot Studios
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports Tripledot as a real, profitable pre-deal casual-games operator that used the 2025 AppLovin
    acquisition to jump from a $1.4 billion 2022 unicorn mark to an implied roughly $2.0 billion post-close narrative.
    That headline is directionally supported by scale and still sits below larger mobile-gaming precedents such as Scopely
    and Zynga, but it remains underwriting-incomplete because the public story uses gross rather than audited net revenue,
    while debt terms and the preference stack remain private. The most supportable call is TRACK at medium confidence,
    high risk, and a FAIR valuation stance pending audited revenue quality, debt, and cap-table disclosure.
sections:
  - id: recommendation-and-thesis
    title: Recommendation, thesis, and anti-thesis
    body: |-
      Tripledot's investment thesis is real, but it is not price-agnostic. On the pro side, public sources support a company
      that was already profitable before the AppLovin transaction, had a demonstrated casual-games operating engine, and then
      used the 2025 acquisition to add studios, portfolio breadth, geographic reach, and mixed IAP-plus-IAA monetization.
      The enlarged company claims more than 25 million daily active users, nearly $2 billion of annual gross revenue, and a
      revenue mix where no single game exceeds 10% of net revenue. Those are credible reasons to believe Tripledot moved from
      a one-hit-risk narrative toward a scaled portfolio narrative.

      The anti-thesis is just as important. Public evidence still does not reveal audited net revenue, EBITDA, debt service,
      or the post-close preference stack. The company-claimed scale figure is annual gross revenue, not a public-company-style
      net bookings or net revenue figure, so the apparent cheapness of an implied ~$2.0 billion valuation can be overstated.
      The market backdrop is healthy but mature rather than explosive, and private-company opacity deserves a discount rather
      than a premium. The recommendation is therefore TRACK, not BUY: the current price is directionally supportable, but the
      public evidence does not yet justify conviction capital without either deeper disclosure or a more obviously discounted
      entry.
