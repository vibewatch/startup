  - id: comparable-set-and-scenario-analysis
    title: Comparable set, scenario logic, and valuation range
    body: |-
      The cleanest public comp lesson is not a single number but a bracket. At the high end, Scopely's $4.9 billion sale and
      Zynga's $12.7 billion takeout show what scaled mobile platforms can command when buyers believe in durable franchises,
      cross-title operating leverage, and large strategic option value. At the lower end, Playtika's June 2026 public
      valuation shows that even a scaled mobile publisher with billions of revenue can trade around roughly 1.1x enterprise
      value to revenue when the market discounts growth quality, concentration, and genre mix. Take-Two, by contrast, trades
      at a much richer public multiple because it combines mobile with console, PC, and owned IP depth, while AppLovin's
      current multiple is driven by ad-tech economics and is therefore not a clean games comparable.

      On that frame, Tripledot's implied ~$2.0 billion mark is not obviously absurd. It is still below bigger strategic M&A
      precedents and not far from the lower end of public mobile-publisher revenue multiples. But the gross-versus-net issue
      matters: nearly $2 billion of annual gross revenue does not translate one-for-one into public-company net revenue,
      operating income, or free cash flow. That is why the scenario analysis does not support a BUY call. The bull case works
      if portfolio diversification, revenue quality, and modest leverage all prove out; the base case treats today's narrative
      value as roughly fair; and the bear case shows how quickly equity support can compress if leverage is heavier than
      expected or gross-to-net conversion is weak.
