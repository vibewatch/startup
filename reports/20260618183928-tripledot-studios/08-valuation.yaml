  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Implied valuation range ($M)
      - Return logic versus ~current mark
      - Probability signal
      - Key invalidators
    rows:
      - - Bull
        - 'Diversification proves real, gross-to-net conversion is stronger than feared, and leverage is modest enough that the public mark understates earnings quality.'
        - '3000-4000'
        - 'Roughly 1.5x-2.0x from a ~$2.0B narrative entry if public-company-like revenue quality emerges.'
        - 'Lower-probability case that needs audited financial proof plus clean debt disclosure.'
        - 'Weak net-revenue conversion, high leverage, or concentration above the 10% claim.'
      - - Base
        - 'Scale is real, but disclosure remains private-company thin and the market keeps valuing the business closer to lower-end public mobile comparables.'
        - '1800-2400'
        - 'Flat to modest upside; current mark is roughly fair if no major negative surprise appears.'
        - 'Most supportable case on the current public record.'
        - 'Debt or margin disclosure materially worse than the market currently assumes.'
      - - Bear
        - 'Leverage is heavier than expected, integration drags, or audited net revenue is materially below the gross-revenue narrative.'
        - '800-1400'
        - '0.4x-0.7x of the current narrative mark, including the possibility of revisiting or undercutting the 2022 unicorn level.'
        - 'Adverse but still plausible because key underwriting variables remain private.'
        - 'Any public evidence of a down-round, recap, or major concentration miss.'
    notes: >-
      Scenario ranges are directional public-evidence screens rather than full DCF or LBO outputs. They intentionally separate
      what the current public record can support from what only internal data could confirm.
