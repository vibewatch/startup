  - id: financing-context-and-entry-discipline
    title: Financing context, current mark, and entry discipline
    body: |-
      The public valuation arc is straightforward at the headline level and messy beneath it. In February 2022, Tripledot
      raised $116 million at a $1.4 billion valuation, after a $78 million Series A in 2021 and an earlier $8 million round.
      In May 2025, AppLovin signed a sale agreement for its gaming portfolio with consideration framed as roughly $800 million.
      The signed 8-K structure was $150 million cash at close, a $250 million secured promissory note, and equity equal to
      roughly 20% of Tripledot's fully diluted shares. By the July 2025 close notice, the transaction had resolved as $400
      million cash plus approximately 20% equity, with no promissory note issued.

      That still does not mean Tripledot closed debt-free. AppLovin's filing said Tripledot expected to use debt financing,
      and Companies House shows a Bank of America collateral-agent charge created on the closing date. MobileGamer then
      reported that the 20% AppLovin stake was worth about $400 million, implying a roughly $2.0 billion post-close
      valuation narrative. The direction is plausible, but the underwriting quality is not. Public evidence does not show the
      signed bank facility, the current principal balance, the covenant set, or the liquidation preference stack. Entry
      discipline therefore has to be evidence-sensitive: at the current narrative mark, investors should require disclosure;
      absent disclosure, they should require a material discount rather than treat the headline mark as self-validating.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
