callouts:
- calloutType: insight
  title: AppLovin turns Tripledot from a mostly single-payer studio into a dual-payer market participant
  body: Before the AppLovin acquisition, Tripledot already looked like a scaled casual studio, but the deal changes the market lens more than the headline size alone suggests. Business Wire and GamesBeat both frame the combined company as operating across both IAP and IAA business models, which means Tripledot now competes for both household entertainment spend and advertiser budgets. That widens the practical served market beyond puzzle-only payer conversion and makes hybrid-casual execution strategically more relevant than it was pre-close.
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM040
  - CM042
- calloutType: risk
  title: This market is monetizing better even as acquisition gets harder
  body: The casual category is not dead, but the easy-growth era appears over. Sensor Tower shows monetization improving while downloads fall, Udonis shows real CPI and modest early ROAS, and Tripledot management has already described how privacy changes complicated user acquisition. That combination means upside comes from retention, live ops, and portfolio management rather than from assuming that category growth alone will carry returns.
  claimRefs:
  - CM010
  - CM012
  - CM028
  - CM029
  - CM030
  - CM031
