  evidenceGaps:
  - type: missing-source
    severity: material
    topic: precise-sam
    missingEvidence: A public market study that isolates puzzle, card, word, and hybrid-casual spend on mobile while clearly separating in-app purchase revenue from advertising revenue.
    whyItMatters: Without a boundary-clean public dataset, the chapter can only show layered revenue proxies instead of a single precise SAM or SOM percentage.
    diligencePath: Request Tripledot management’s internal market-sizing deck or a commissioned third-party study with explicit inclusion and exclusion rules.
    relatedQuestionRefs:
    - QM006
    - QM007
    - QM010
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization-mix
    missingEvidence: Post-acquisition title-level revenue split by IAP versus IAA, broken out by legacy Tripledot titles, acquired AppLovin titles, geography, and platform.
    whyItMatters: This is the key evidence needed to judge whether the AppLovin acquisition materially widened Tripledot’s served market or mainly increased scale inside its existing niches.
    diligencePath: Request a monthly post-close revenue bridge, top-title concentration table, and monetization-mix dashboard from management.
    relatedQuestionRefs:
    - QM009
    - QM013
    - QM015
    - QM025
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: minor
    topic: channel-performance
    missingEvidence: Current CPI, ROAS, and retention by platform, geography, and channel for Tripledot’s major titles.
    whyItMatters: Public category benchmarks show the market economics, but they do not reveal whether Tripledot is outperforming or underperforming peers in user acquisition efficiency.
    diligencePath: Request channel-level UA dashboards, cohort retention curves, and paid-versus-organic install mix for the top legacy and acquired titles.
    relatedQuestionRefs:
    - QM017
    - QM018
    - QM022
    relatedTableRefs:
