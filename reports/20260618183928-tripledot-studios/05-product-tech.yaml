  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control or signal
      - Status
      - Scope
      - Why it helps
      - Remaining gap
    rows:
      - - Privacy notice updated April 30 2026
        - Public and current
        - Companywide services
        - Shows named controller, rights language, and processing categories
        - Does not substitute for security architecture or audit reports
      - - Google Play data-safety label for Woodoku
        - Public and title-specific
        - One flagship game
        - Exposes collection, sharing, deletion, and encryption disclosures to users
        - Coverage for the broader portfolio is not summarized in one place
      - - Encryption in transit and deletion request path
