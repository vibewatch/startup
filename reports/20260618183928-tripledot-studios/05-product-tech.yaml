  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enterprise-security-controls
      missingEvidence: Public SOC 2, ISO 27001, security whitepaper, incident-response, or data-residency documentation for the game portfolio or central platform.
      whyItMatters: The enlarged multi-studio group handles accounts, device identifiers, payments, advertising, and support flows across jurisdictions, but the public trust package remains mostly legal text and app-store labels.
      diligencePath: Request the current security program summary, third-party audit reports, data-flow diagrams, and incident history by title family and by central publishing platform.
      relatedQuestionRefs:
        - QE023
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: portfolio-reliability-metrics
      missingEvidence: Title-level uptime, crash-free session rate, save-loss rate, support SLA, ad-load policy, and incident metrics for flagship games.
      whyItMatters: Public reviews surface lag, lost progress, and ad-friction complaints, but investors need telemetry to determine whether those are isolated anecdotes or systemic quality issues.
      diligencePath: Request internal quality dashboards, crash analytics, support ticket response metrics, and incident logs for Woodoku and the largest post-acquisition titles.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE004
        - TE005
    - type: private-evidence-only
      severity: material
      topic: integration-uniformity
      missingEvidence: Exact mapping of which acquired titles still run on separate support, privacy, and monetization stacks and the timeline to unify them under Tripledot systems.
      whyItMatters: Public Zephyr-linked surfaces imply not every title is on the same policy or operating layer yet, which affects compliance uniformity, support economics, and control consistency.
      diligencePath: Request a title-by-title integration matrix covering studio owner, support routing, privacy controller, ad-tech stack, payment flow, and migration status.
      relatedQuestionRefs:
        - QE021
        - QE025
      relatedTableRefs:
        - TE001
        - TE003
        - TE005
