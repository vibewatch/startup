company:
  name: Tripledot Studios
chapter:
  order: 5
  number: 5
  title: Product & Technology
  summary: >-
    Tripledot's product is best understood as a data-driven mobile-games operating platform rather than a single hit title:
    the company runs a wide casual portfolio across puzzle, card, word, and sort genres, distributes through app stores,
    reuses retention patterns such as offline play and daily challenges, and adds shared studio support across product,
    AI, monetization, and marketing. The post-AppLovin portfolio gives it scale and genre diversification, but the public
    evidence also shows meaningful dependence on Apple/Google store rails, ad-tech and identity partners, and the still
    heterogeneous operating surfaces of acquired studios.
sections:
  - id: portfolio-workflow
    title: Product surface and customer workflow
    body: >-
      Tripledot is not selling a single game to a single audience. Its public product surface shows a portfolio system built
      around short-session mobile entertainment loops for puzzle, card, word, and casual sorting players. The official
      homepage frames the company as a data-driven game creator that equips studios with data, tools, and support, while the
      Google Play developer page and AppBrain show a broad Android footprint spanning dozens of apps and multiple genres.
      Flagship titles illustrate the pattern. Woodoku uses a familiar 9x9 logic board, Solitaire and Spades convert classic
      card play into mobile-friendly sessions, Word Hop and Cryptogram provide daily brain-training loops, and Triple Tile,
      Nut Sort, Blockbash, Car Out, Pick Pack, and Get Color expand the portfolio into newer match, sort, and traffic-puzzle
      formats. The player workflow is also consistent across many titles: discover the app in the store, install without
      heavy onboarding, play short rounds including offline in several flagship titles, then return through daily challenges,
      weekly content, hints, leaderboards, or limited-time events. That repetition makes Tripledot's product system look
      like a casual-games operating model that wraps common retention mechanics around many genre skins rather than a one-off
      franchise business. It also lets the company reuse discovery, monetization, and support patterns without requiring each
      title to stand up a completely separate operating stack.
    claimRefs:
      - CE001
      - CE002
