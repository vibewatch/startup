        - Store-facing data practices
        - Creates baseline trust signal for a consumer app portfolio
        - No public statement on at-rest encryption, incident handling, or recovery targets
      - - TOS controls for accounts, virtual items, updates, and age gates
        - Publicly stated
        - Company service framework
        - Sets clear rules for account use and software-update authority
        - Does not provide measurable quality or uptime commitments
      - - Zephyr privacy and terms surfaces on some titles
        - Publicly visible
        - Affiliate or inherited title operations
        - Indicates some support and compliance pathways are at least documented
        - Also shows policy fragmentation across the enlarged title estate
      - - Public player-review complaints on Woodoku
        - Adverse quality signal
        - Real-world user experience
        - Gives visibility into lag, save-loss, and ad-friction issues
        - Review snippets are anecdotal and not equivalent to fleetwide reliability data
    notes: >-
      This table separates visible consumer safeguards from missing enterprise-style controls. Public legal and store-policy
