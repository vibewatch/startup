  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Tripledot solution
      - Measurable benefit
      - Limitation
    rows:
      - - Fill a short downtime session
        - Install from the app store and start a simple level quickly
        - Offline-friendly puzzle and card titles with low-friction onboarding
        - Expands addressable play moments beyond always-online sessions
        - Session length and day-1 conversion are not public
      - - Return daily without needing deep narrative commitment
        - Rely on streaks, challenge calendars, or update nudges
        - Daily challenges, weekly puzzles, limited-time events, and new levels
        - Supports repeat engagement across multiple genres
        - Public live-ops calendar and completion rates are undisclosed
      - - Personalize comfort and skill level
        - Use hints, undo, difficulty, customization, or left-handed mode
        - Solitaire and Spades foreground accessibility and customization tools
        - Reduces frustration and broadens mainstream casual appeal
        - Formal accessibility disclosures are limited in the public corpus
      - - Compete or socialize selectively
        - Connect to leaderboards, Facebook, or public usernames where available
        - Word Hop and privacy materials show leaderboards, friends, and profile surfaces
        - Adds retention paths without requiring every title to be synchronous multiplayer
        - Cross-title moderation and abuse controls are not publicly described
      - - Monetize free play while preserving mass-market reach
        - Use free download, ads, chips, bonuses, or optional purchases
        - Portfolio spans in-app purchase and in-app advertising models
        - Creates genre and monetization diversification
        - Title-level ad impression load and payer mix are not public
      - - Get support or manage data rights
        - Use in-app help, support emails, deletion requests, and privacy pages
        - Tripledot and Zephyr-linked titles expose support and legal channels publicly
        - Gives users at least basic service and privacy recourse
        - Public support response times and resolution rates are not disclosed
    notes: >-
      Workflow rows synthesize what is visible on store listings and legal pages. Public sources show player-facing loops, but
      not private retention metrics, customer-support analytics, or monetization economics by title.
