  - id: operating-platform
    title: Architecture, studio support, and external dependencies
    body: >-
      The public architecture story is less about a proprietary backend stack than about how Tripledot orchestrates mobile
      distribution, monetization, studio integration, and content cadence. Consumers access titles primarily through Apple,
      Google, and in some cases Amazon payment and distribution rails; Tripledot's privacy materials explicitly say those
      platforms process purchases, while some services also rely on Apple Sign-in, Facebook sign-in, imported contacts, and
      public leaderboards or head-to-head features. At the operating-model layer, Business Wire describes a shared support
      system across marketing, product, AI, and monetization, which is consistent with the company's stated ambition to be a
      data-driven multi-studio group rather than only a developer of internally originated casual apps. The AppLovin close
      notice and AppLovin 8-K add an important technical-operations detail: ten studios transferred to Tripledot and the
      agreement contemplated transition services, shared records access, and other post-close integration mechanics. Public
      store pages also show visible operating heterogeneity. Several classic Tripledot titles use Tripledot support and legal
      surfaces, while some newer sort and traffic titles still point to Zephyr Mobile support or policy pages. That implies a
      central publishing layer on top of a still-migrating estate of inherited studios, title pipelines, and policy stacks.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
