callouts:
  - calloutType: strength
    title: Diversified casual portfolio is the core product moat
    body: >-
      The strongest product advantage is not a single game mechanic but the combination of a broad casual catalog, shared
      data-driven studio support, and multiple monetization paths. Public sources show dozens of Android titles, more than
      25 live games post-deal, both IAP and ad-driven business models, and a post-acquisition portfolio where no single game
      is expected to exceed 10% of net revenue. That architecture lowers single-title dependence and gives Tripledot more
      room to recycle retention mechanics across genres.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE035
      - CE043
  - calloutType: risk
    title: Platform and ad-tech dependence is structural, not incidental
    body: >-
      Tripledot's public product stack depends heavily on third-party rails: app stores handle discovery, updates, and in-app
      purchase processing; privacy materials name advertising, analytics, and payment partners; and some social/account flows
      depend on Apple or Facebook identity surfaces. Those dependencies are normal for mobile gaming, but they mean pricing,
      attribution, policy, or privacy changes at Apple, Google, Amazon, or major ad partners can directly affect product
      economics and operations.
    claimRefs:
      - CE027
      - CE030
      - CE031
      - CE034
      - CE040
  - calloutType: risk
    title: Post-acquisition title estate still shows integration seams
    body: >-
      The AppLovin deal gave Tripledot major scale quickly, but the public product estate is not yet fully uniform. The 8-K
      contemplated transition services after close, and several active sort or traffic titles still point to Zephyr Mobile
      support or legal pages rather than a fully unified Tripledot surface. That does not prove operational weakness, but it
      does indicate that title migration, policy harmonization, and studio-system consolidation were still ongoing in the
      public footprint after the acquisition.
    claimRefs:
      - CE022
      - CE023
      - CE024
      - CE036
      - CE037
      - CE040
