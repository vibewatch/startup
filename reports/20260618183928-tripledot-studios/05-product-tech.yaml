tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Product line / module
      - Primary user
      - Public scope
      - Maturity / status
      - Differentiation
      - Diligence gap
    rows:
      - - Woodoku / core block-puzzle line
        - Puzzle players seeking short logic sessions
        - 9x9 block puzzle with offline play and weekly/daily content loops
        - Scaled flagship with 130M AppBrain downloads
        - Combines sudoku-like board clarity with casual repeat play
        - Revenue mix, retention, and crash-free-session metrics are not public
      - - Card line (Solitaire, Spades, Blackjack)
        - Card and casino-style casual players
        - Offline-friendly classic card loops with hints, stats, customization, and chips
        - Live and mature in store listings
        - Familiar mechanics reduce onboarding friction across multiple SKUs
        - Real multiplayer depth, lifetime value, and ad load are undisclosed
      - - Word line (Cryptogram, Word Hop)
        - Brain-training and word-puzzle players
        - Daily challenges, handcrafted puzzles, streaks, languages, and leaderboards
        - Live and content-driven
        - Extends portfolio beyond match/card play into language-based retention loops
        - Public install, revenue, and moderation metrics are sparse
      - - Tile / sort / traffic line (Triple Tile, Nut Sort, Blockbash, Pick Pack, Car Out, Get Color)
        - Casual sort and match players
        - Weekly updates, limited-time events, 3D sorting, and relaxation-oriented loops
        - Live but operationally heterogeneous
        - Broadens genre coverage and live-ops reuse beyond original hit titles
        - Some titles still route support and policies to Zephyr Mobile surfaces
      - - AppLovin-acquired studio franchises
        - Global mobile players across casual and adjacent genres
        - Added studios include PeopleFun, Machine Zone, Magic Tavern, and others
        - Integrated since June 2025 close
        - Expands scale, diversification, and both IAP and IAA monetization reach
        - Product harmonization by studio and title is not publicly mapped in detail
      - - Shared studio support layer
        - Internal product, data, and monetization teams
        - Central data, tools, support, AI, marketing, and monetization practices
        - Publicly stated operating model rather than named product SKU
        - Lets Tripledot position itself as a data-driven multi-studio platform
        - No public org chart, toolchain inventory, or cross-studio SLA framework
    notes: >-
      Matrix combines official portfolio statements, Google Play surfaces, and third-party portfolio tracking. Tripledot does
      not publish a single canonical SKU sheet that maps every live title to a studio, support stack, and monetization model.
    claimRefs:
