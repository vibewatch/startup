  topStrengths:
    - 交易前已有盈利运营历史，休闲游戏平台也证明能规模化。
    - AppLovin 之后的组合更宽，降低单一游戏集中度，并补上 IAP 与 IAA 变现能力。
    - 12 个工作室、23 座城市、25M+ DAU、近 $2B 总收入等公开规模主张，把 Tripledot 放进真正的全球可比公司组。
    - 隐含约 ~$2.0B 交割后估值，仍低于 Scopely、Zynga 等更大型战略手游交易先例。
  topRisks:
    - 公开规模以总收入呈现，而不是经审计净收入、EBITDA 或自由现金流。
    - 尽管 Bank of America 抵押登记释放了信号，交割后债务条款和契约余量仍不透明。
    - 当前股权结构表、清算优先权和 AppLovin 治理权未公开披露。
    - 吸收 10 个工作室和更广产品组合后，整合复杂度急剧上升。
    - 成熟手游市场里，平台、隐私和广告负载风险仍然重要。
  unresolvedGaps:
    - 合并后公司经审计 2025 年净收入、EBITDA，以及总收入到净收入的桥接。
    - 已签署债务文件、当前本金余额、到期结构和契约包。
    - 当前股权结构表和清算优先权，包括 AppLovin 的准确信息权或治理权。
    - 收购组合与原有组合按游戏拆分的收入、DAU、留存和总收入到净收入结构。
    - 完整董事会构成、委员会结构和交割后整合负责人。
