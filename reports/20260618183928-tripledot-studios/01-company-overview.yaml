  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, and executive org chart that explains founder roles and outside directors after the AppLovin close.
    whyItMatters: Later chapters cannot assess control, key-person dependence, or oversight quality from the public record alone.
    diligencePath: Request the latest board deck, org chart, and governance memo covering founder responsibilities and independent-director roles.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-acquisition-financing
    missingEvidence: A live shareholder register, AppLovin equity terms, any refinancing of the originally filed promissory note structure, and the underlying debt documents tied to the Bank of America charge.
    whyItMatters: Recommendation quality depends on knowing whether current ownership, leverage, and counterparty rights materially changed when the acquisition closed.
    diligencePath: Request the current cap table, the signed acquisition financing package, and any note payoff or amendment documents.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-completeness
    missingEvidence: A complete internal chronology covering every financing date, studio integration milestone, leadership change, and any adverse operating event after the acquisition.
    whyItMatters: The public milestone record is good enough for a high-level overview but not complete enough to serve as a diligence-grade operating history.
    diligencePath: Request an internal milestone log spanning formation, all financings, product launches, studio integrations, and governance changes.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: title-level-revenue-mix
    missingEvidence: Title-level DAU, bookings, and revenue concentration data proving the post-close claim that no single game contributes more than 10% of net revenue.
    whyItMatters: The investment case changes materially if reported diversification rests on one or two aging flagships rather than on a broad portfolio of resilient titles.
    diligencePath: Request post-close title P&Ls, cohort retention by flagship title, and the monthly dashboard management uses to track concentration.
