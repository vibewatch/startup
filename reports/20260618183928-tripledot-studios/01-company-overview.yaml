- id: capital-formation-and-transaction-structure
  title: Capital formation and transaction structure
  body: |-
    Tripledot's funding history shows a company that used outside capital mainly to compound an already working operating model. Global Corporate Venturing reports an $8 million round in 2018 led by Velo Partners, followed by a $78 million Series A in April 2021 at a $500 million valuation. TechCrunch, VentureBeat, and GCV then converge on the February 2022 Series B: $116 million at a $1.4 billion valuation, led by 20VC with Access Industries, Lightspeed Venture Partners, and Eldridge also participating. The same 2022 reporting painted a business that was already profitable, had roughly 25 to 30 million monthly users, and employed around 200 people globally. In other words, Tripledot was not raising rescue capital; it was financing portfolio expansion and M&A.

    That strategy culminated in the AppLovin transaction, but the financing picture needs careful handling because the public versions differ by source and date. Business Wire's announcement framed the deal as approximately $800 million and half cash, half equity. AppLovin's 8-K gave the hard mechanics: $150 million cash at closing, a $250 million secured promissory note at 11% interest, and equity equal to roughly 20% of Tripledot's fully diluted shares, with no financing condition despite planned debt funding. Yet the closing announcement later said the deal settled with $400 million cash plus approximately 20% equity and no note issued. Companies House then showed an outstanding Bank of America charge created on 30 June 2025. That sequence supports a clear conclusion: Tripledot executed a transformational deal, but the final debt stack and current ownership picture still need primary diligence materials rather than press shorthand.
