- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Platform enforcement or billing-policy conflict
    - App-store correspondence, rejection, or monetization-policy notice
    - Any material Apple or Google policy action affecting a top title or shared SDK pattern
    - Pause underwriting until incident scope, remediation, and recurrence controls are evidenced
  - - Flagship quality and ad-load deterioration
    - Store reviews, internal crash/retention dashboards, support backlog
    - Persistent multi-quarter decline in flagship sentiment or evidence that ads materially impair play
    - Re-cut revenue durability and UA payback assumptions before investing
  - - Integration slippage across acquired studios
    - Integration KPI pack and title-level operating reviews
    - Missed integration milestones, duplicated systems without owners, or repeated live-ops incidents across multiple acquired titles
    - Treat diversification as complexity, not risk reduction, in the base case
  - - Opaque or restrictive lender package
    - Signed debt documents and current compliance certificate
    - If docs cannot be produced or show covenants that materially limit strategic flexibility
    - Do not underwrite post-close leverage-adjusted upside
  - - Governance or key-person disruption
    - Board roster, org chart, succession and delegated P&L ownership
    - Unexpected leadership exit or inability to evidence second-line owners for major functions
    - Increase discount rate and require tighter governance protections
  - - Privacy or children-policy control failure
    - Incident logs, vendor review records, age-audience assessments
    - Any unresolved policy incident involving children, sensitive data, or non-compliant ad tooling
    - Assume elevated distribution and regulatory risk until controls are independently validated
  notes: Several triggers are documentary rather than purely numeric because the core public gap is missing private control evidence, not just missing public market data.
