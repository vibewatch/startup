  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: post-close-debt-package
    missingEvidence: Signed debt agreements, current principal outstanding, covenant package, compliance certificate, and lender reporting requirements.
    whyItMatters: Without the real post-close lender terms, downside cases on flexibility, refinancing, and cash leakage are guesswork.
    diligencePath: Request the executed debt documents, latest compliance certificate, and lender presentation used at or after closing.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
  - type: private-evidence-only
    severity: blocking
    topic: title-level-mix-and-retention
    missingEvidence: Title-level DAU, bookings, net revenue, payer mix, ad monetization mix, retention, and UA payback for the largest legacy and acquired titles.
    whyItMatters: Diversification only reduces risk if the acquired mix is not hiding weak cohorts, heavy ad dependency, or one or two oversized cash generators.
    diligencePath: Request a title dashboard that bridges DAU, bookings, net revenue, ad revenue, payer conversion, and cohort retention for the top 10 titles.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: governance-structure
    missingEvidence: Current board composition, committee structure, executive org chart, and delegated P&L ownership across the acquired studio set.
    whyItMatters: Public founder narratives are not enough to judge whether Tripledot has the bench depth to control a much larger post-close platform.
    diligencePath: Request the latest board deck summary, committee list, executive roster, and integration ownership map.
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: privacy-and-children-controls
    missingEvidence: Vendor list, age-audience assessments, DPIAs or equivalent privacy reviews, incident log, and policy correspondence with Apple or Google.
    whyItMatters: Policy text and store disclosures show the perimeter, but not whether the company has mature control execution across legacy and acquired titles.
    diligencePath: Request trust-and-safety control documents, privacy review outputs, and a 24-month platform-policy incident register.
    relatedTableRefs:
    - TR001
    - TR002
    - TR005
