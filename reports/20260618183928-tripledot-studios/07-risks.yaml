- id: operational-integration-and-partner-risk
  title: Operational, quality, and partner dependency risk
  body: |-
    The operating risk profile changed materially after the AppLovin deal. Tripledot already managed a broad Android catalog, but the transaction adds 10 studios across 17 additional cities and pushes the combined perimeter to 12 studios, more than 2,500 people, and nearly $2 billion of gross revenue. That is diversification, but it is also a live-ops, tooling, and governance challenge: more genres, more codebases, more ad and wallet configurations, more app-store relationships, and more QA surfaces. Public title pages show the company still ships repeat-play mechanics across card and word titles, so the catalog is active rather than dormant.

    The adverse side is visible in live consumer sentiment. Recent Woodoku reviews cite rigged-feeling outcomes, lag, crashes, lost progress, and ad interruptions severe enough to make the game temporarily unplayable, while Tripledot's public responses acknowledge ad interference. Market data says casual gaming still has scale, but audience acquisition is harder in a privacy-centric world and CPI remains meaningfully higher on iOS than Android. The operational risk, then, is not lack of demand; it is whether Tripledot can absorb a much larger portfolio without over-monetizing sessions, lowering quality, or becoming slower to react when flagship sentiment turns.
  claimRefs:
