- id: TV001
  title: Recommendation summary table
  columns:
  - decision field
  - current view
  - decision implication
  rows:
  - - Recommendation
    - research-more
    - Stay engaged, but do not underwrite new money at the old peak mark without private diligence.
  - - Confidence
    - medium
    - Scale and historic financing are visible, but current valuation and economics are not.
  - - Risk rating
    - high
    - Downside can transmit through litigation, disclosure gaps, betting execution, and consumer friction.
  - - Valuation stance
    - stretched
    - Peak pricing screens above most public analogs without equivalent disclosure.
  - - Entry discipline
    - Prefer sub-$20B to mid-$20B screens unless disclosure improves
    - A better price or better evidence is needed before conviction rises.
  - - Hold / exit posture
    - Track with explicit diligence gates
    - Upgrade only if a fresh mark and audited segment evidence tighten the underwriting range.
  notes: Recommendation is price-sensitive, not quality-insensitive; the table converts the comp screen and disclosure gaps into an investability call.
