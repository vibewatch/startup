- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - Fanatics has real platform breadth across commerce, collectibles, betting, and live events.
    - thesis
    - Optionality matters only if segment economics and cross-sell evidence prove durable.
  - - The reported 2022 valuation peak was supported by unusually large scale for a private sports platform.
    - thesis
    - A fresher financing mark or audited revenue would make the historical price easier to benchmark.
  - - Commerce still appears to drive most of the revenue base, which limits how much pure-tech multiple expansion is justified.
    - anti-thesis
    - A higher share of high-margin collectibles or betting contribution would improve the mix.
  - - Public filings do not disclose current preferences, segment margins, or exit mechanics.
    - anti-thesis
    - A filing-grade disclosure set would materially improve conviction.
  - - Litigation, labor, and customer-friction evidence can deepen downside beyond normal multiple compression.
    - anti-thesis
    - Cleaner legal and operating signals would reduce the severity of the bear case.
  - - Fanatics may still deserve a premium to plain sports retail if loyalty, events, and betting deepen fan monetization.
    - thesis
    - That premium becomes more defensible if management proves current monetization outside legacy commerce.
  notes: Arguments are intentionally tied to investability at the observed price range rather than to generic admiration for the company or founder.
