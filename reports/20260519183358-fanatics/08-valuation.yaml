- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Revenue reaches about $10B, collectibles and betting scale, and the market pays about 4.5x sales for proven multi-line optionality.
    - Implied value about $45B, or roughly 1.45x the old $31B peak before dilution.
    - Requires clean legal posture, better disclosure, and better-than-publicly-shown mix quality.
    - 20%
  - - Base
    - Revenue lands near $8.5B and the market pays about 3.0x sales for a scaled but still opaque private platform.
    - Implied value about $25.5B, closer to the earlier $27B round than the later $31B peak.
    - Good execution may still not outrun disclosure discounts and mix concerns.
    - 55%
  - - Bear
    - Revenue stays near $7B and the market pays about 1.5x sales as litigation and lower-quality economics dominate the story.
    - Implied value about $10.5B, implying severe downside from the 2022 peak mark.
    - Multiple compression compounds with legal, labor, and customer-service frictions.
    - 25%
  notes: Scenario values are analyst estimates anchored to the public $7B-$8B revenue range, public comps, and explicit downside transmission factors; not a DCF.
