  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: preference-overhang
    missingEvidence: Current cap-table waterfall, liquidation preferences, ratchets, and any senior instruments ahead of new money.
    whyItMatters: Late-stage return math can look attractive on headline enterprise value while being mediocre on common-equity outcomes.
    diligencePath: Request financing documents and a full cap-table waterfall from management or the lead investor under NDA.
    relatedQuestionRefs:
    - QV013
  - type: stale
    severity: material
    topic: current-valuation-mark
    missingEvidence: A fresh 2025-2026 primary, secondary, or board-mark valuation for Fanatics rather than the 2022 round headlines.
    whyItMatters: A stale peak mark can make a company look more expensive or cheaper than the market actually clears today.
    diligencePath: Obtain the latest board deck, recent secondary transaction data, or lead-investor pricing memo.
    relatedQuestionRefs:
    - QV028
    - QV030
  - type: missing-source
    severity: material
    topic: segment-economics
    missingEvidence: Segment revenue, gross margin, and contribution profit for Commerce, Collectibles, and Betting & Gaming.
    whyItMatters: The valuation method changes materially depending on whether Fanatics is mostly a retail-margin business or a higher-quality platform mix.
    diligencePath: Request audited or banker-prepared segment bridges and cohort data before treating optionality as monetized.
    relatedQuestionRefs:
    - QV028
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A broader comp set including private secondary marks, transaction precedents, and richer sports-platform analogs.
    whyItMatters: The current public comp screen is useful but still imperfect because no listed business mirrors Fanatics' exact mix.
    diligencePath: Expand the comp book with banker transaction comps and private secondary evidence during full IC diligence.
    relatedQuestionRefs:
    - QV021
    - QV024
    relatedTableRefs:
    - TV004
