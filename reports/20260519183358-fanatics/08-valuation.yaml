company:
  name: Fanatics
chapter:
  number: 8
  title: Valuation
  summary: Fanatics is clearly scaled and diversified, but the best public valuation anchors are still the 2022 $27B and $31B rounds plus unaudited $7B to $8B revenue markers from 2023-2024. That puts the historical peak mark at roughly 3.9x to 4.4x sales, richer than most sports betting, sports retail, and sports-data public comps and only loosely comparable to eBay-like marketplace screens despite materially thinner disclosure. The evidence supports a research-more recommendation with medium confidence, high risk, and a stretched valuation stance until Fanatics discloses a fresher mark, a clearer cap table, or audited segment economics.
sections:
- id: recommendation-price-discipline
  title: Recommendation and price discipline
  body: |-
    Fanatics deserves to be valued as more than a licensed-jersey retailer. Its own investor page now presents a six-business platform spanning commerce, collectibles, betting and gaming, live events, markets, and studios, backed by more than 100 million fans, more than 900 sports properties, and more than 2,000 retail locations. That breadth explains why private investors were willing to pay growth-company prices for what still has a large commerce core. The 2022 financing record is also unusually clear for a private company: MarketScreener captured a $27 billion post-money round in March 2022, and SportsPro later reported a roughly $700 million financing at a $31 billion valuation, with proceeds aimed partly at further M&A.

    The problem is that the public underwriting bridge stops there. SportsPro's $8 billion 2023 revenue expectation and Sacra's later $7 billion revenue marker are directionally strong, but they are not the same thing as audited segment disclosures, current preferences, or a fresh financing mark. Using those public revenue anchors, the widely reported $31 billion price implies roughly 3.9x to 4.4x sales. That is not absurd for a marketplace-style platform, but it is expensive relative to most public sports betting, sports retail, and sports-data analogs. The right conclusion is therefore price-sensitive rather than admiration-sensitive: Fanatics looks real, scaled, and strategically important, but the old peak mark still asks investors to pay up for optionality that the public record does not yet quantify cleanly.
