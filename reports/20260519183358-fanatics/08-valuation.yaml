- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Representative May 2026 public comps spanning sports retail, betting, sports data, and marketplace analogs plus Fanatics' own historical peak screen.
  columns:
  - comparable
  - metric
  - multiple / valuation status
  - relevance
  - limitation
  rows:
  - - DICK'S Sporting Goods
    - $19.00B market cap; $17.22B TTM revenue
    - 1.10x P/S
    - Best public sports-retail anchor for licensed merchandise and store economics.
    - Retail-only model lacks Fanatics' betting, collectibles, and media optionality.
  - - DraftKings
    - $12.74B market cap; $6.29B TTM revenue
    - 2.04x P/S
    - Useful screen for U.S. sportsbook optionality and promotional intensity.
    - Pure-play betting business; no commerce or collectibles offset.
  - - Flutter Entertainment
    - $16.92B market cap; $17.02B TTM revenue
    - 1.00x P/S
    - Best large-scale betting comp for regulated global sportsbook exposure.
    - Mix does not include licensed-commerce or trading-card economics.
  - - Sportradar
    - $4.10B market cap; 1.33B EUR TTM revenue
    - 2.68x P/S
    - Useful B2B analog for sports-data, media, and betting infrastructure optionality.
    - Smaller, narrower, and more enterprise-like than Fanatics.
  - - eBay
    - $50.84B market cap; $11.60B TTM revenue
    - 4.39x P/S
    - Closest marketplace-style benchmark for scaled take-rate commerce and audited disclosure.
    - More mature, more audited, and less exposed to betting or collectibles litigation.
  - - Fanatics historical peak
    - $31B valuation; public revenue anchors of $7B-$8B
    - 3.9x-4.4x implied sales
    - Shows that private investors paid marketplace-like pricing for diversified optionality.
    - Widely cited mark is stale and unsupported by current public filings or cap-table detail.
  notes: Comparable set is intentionally sample-based; multiples mix public market data and an implied private screen, so comp selection and disclosure differences matter as much as the raw x-sales number.
