        - 2022 financing explicitly targeted M&A and Fanatics used large acquisitions to expand
        - If acquired assets underperform, the platform thesis weakens quickly
        - Still central to the current business shape
        - Medium
        - Evidence that acquired businesses meet retention and margin targets
      - - Private disclosure gap
        - No public filing-grade segment detail or cap-table terms are visible in the reviewed materials
        - Unknown preferences, reserve obligations, and segment margins make downside harder to bound
        - Structural and ongoing
        - Critical
        - Direct diligence access to cap table, reserves, and segment P&L
    notes: >-
      This table translates public funding, reward-program, and public-comp evidence into economic downside channels
      rather than trying to restate the valuation chapter.
