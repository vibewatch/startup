      - number: '3.3'
        title: Moat durability depends on partner access and cross-sell, not on absence of substitutes
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence for Fanatics' moat is still distribution and identity. More than 900 sports
              properties, more than 2,000 retail locations including Lids, and the continued existence of official NFL,
              MLB, NBA, and NHL stores show that Fanatics sits close to rights holders and controls privileged commerce
              touchpoints. If the company can keep turning that traffic into loyalty, collectibles, and betting
              behavior, its platform breadth remains hard to reproduce. That is the best case behind the integrated-fan
              thesis.


              The adverse case is that this moat is contractual and therefore fragmentable. Sacra argues that roughly
              80% of Fanatics' revenue still comes from commerce and wholesale apparel, and also argues that leagues
              have already started reopening distribution to Amazon and other channels. If that is right, Fanatics' core
              profit engine is exposed exactly where public specialists are most transparent and where multi-homing is
              easiest. A fan can buy jerseys from official league shops, hats from Lids, retro gear from FansEdge, list
              graded cards through PSA and eBay, and place wagers with DraftKings or Flutter without ever using a single
              integrated Fanatics loop. Public-company rivals also file current 10-Ks or equivalent materials, which
              makes their operating cadence easier to benchmark than Fanatics' private holding-company narrative. The
              core diligence question is therefore not whether substitutes exist — they clearly do — but whether
              Fanatics can maintain superior rights access and better cross-sell economics than those substitutes once
              promotional intensity and channel fragmentation rise.
