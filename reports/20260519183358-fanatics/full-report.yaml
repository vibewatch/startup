  - id: TR006
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Collectibles litigation
        - Jones and related cases survive dismissal or defeat arbitration motions
        - Any merits-stage class certification or adverse early ruling
        - Move the risk rating upward and require outside-counsel reserve analysis before underwriting
      - - State gaming compliance
        - A state market suspension, partner-loss, or formal regulator action occurs
        - Loss of a meaningful operating state or material privacy/gaming inquiry
        - Cut sportsbook value assumptions and re-underwrite state-by-state reach
      - - Customer-service quality
        - Direct complaint rates, refund disputes, or delivery misses remain elevated through peak seasons
        - Internal metrics fail to improve despite support tooling
        - Assume weaker cross-sell and lower trust in commerce-led acquisition
      - - Promo economics
        - FanCash and bonus-bet cost rises without matching gross-win or retention improvement
        - Contribution margin weakens or promo reserve data disappoints
        - Lower betting and loyalty multiple assumptions
      - - Dependency concentration
        - PointsBet- or Topps-linked integrations miss milestones or rights relationships deteriorate
        - Migration delays, rights disputes, or leadership churn in acquired units
        - Treat the platform thesis as integration-risk-heavy rather than synergistic
      - - Disclosure / valuation
        - Next financing or credible secondary valuation prints materially below recent public marks
        - Any fresh mark well below the $25B-$31B public range
        - Treat the prior valuation case as broken and reset return expectations
    notes: >-
      These triggers are intentionally observable. They are designed to convert qualitative risk discussion into
      explicit go / no-go conditions for future diligence.
