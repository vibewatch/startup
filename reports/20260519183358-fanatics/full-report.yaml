      - number: '3.2'
        title: Capability breadth helps Fanatics, but specialists win on focus and pricing clarity
        blocks:
          - type: paragraph
            body: >-
              Fanatics' biggest differentiator is still that one company can move a fan from official merchandise into
              collectibles and then into betting with the same identity and rewards logic. The investor page frames that
              integrated ecosystem explicitly, while the sportsbook page shows how FanCash now extends into wagering.
              But the reviewed competitor surfaces also show why breadth alone is not a knockout blow. DICK'S competes
              on broad assortment, store pickup, same-day delivery, and explicit rewards promotions. DraftKings
              positions itself as a top-rated sportsbook and already discloses far more sportsbook revenue than anything
              Fanatics Betting has published. Flutter is larger still, and its investor materials frame a global
              regulated betting portfolio rather than a narrow U.S. launch story.


              Collectibles are even more revealing. PSA does not need to win primary issuance to win the trust layer.
              Its homepage and Collectors Club pages show a direct monetization model built around authentication,
              grading, subscriptions, and per-card fees, while Collectors' news feed documents how eBay, Goldin, and PSA
              have been assembled into a tighter end-to-end hobby workflow. That gives collectors a credible alternative
              to staying inside Fanatics' owned rails. Pricing evidence is also uneven across the chapter: Fanatics
              Sportsbook and DICK'S surface actionable offers on the fetched pages, and PSA publishes explicit
              membership and grading prices, but many rival fee stacks remain dynamic, state-specific, or undisclosed on
              the pages reviewed. That lack of stable apples-to-apples pricing is itself a competitive fact because it
              makes public comparison harder and forces diligence onto realized economics instead of headline promos.
