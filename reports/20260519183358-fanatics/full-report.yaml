      - number: '7.2'
        title: Operational, customer, security, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Fanatics' operational risk profile is not theoretical. The direct customer evidence in SmartCustomer's
              review corpus points to recurring friction around shipping timeliness, damaged or wrong items, discount
              disputes, and return value being pushed into gift cards or credits rather than clean refunds. The company
              clearly knows support is a critical surface — the help desk centers order tracking, cancellations, and
              refunds — but the adverse review signal implies that support tooling has not fully neutralized execution
              problems at scale. That is meaningful because commerce is still the volume gateway into the wider Fanatics
              ecosystem, and repeated service failures can lower conversion into higher-margin categories rather than
              merely hurt one order.


              Security and operational controls in the sportsbook business add another layer of execution burden. Public
              terms say only one account is allowed, funds are segregated, and withdrawals or refunds may still take up
              to five working days after checks. The responsible-disclosure program is a genuine mitigation — it gives
              researchers a channel — but it is also narrowly drafted, forbids broad testing, and refuses to speak for
              third parties. On the dependency side, Fanatics' current sportsbook scale is inseparable from the
              PointsBet acquisition, which transferred not just market access but entities, platform rights, Banach
              technology, employees, and office infrastructure. Topps adds similar complexity on the collectibles side
              with a 100-plus-country footprint. The practical implication is that Fanatics is now operating several
              integration-sensitive businesses at once, with customer trust, technology reliability, and partner
              continuity tightly linked.
