  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and user jobs
        blocks:
          - type: paragraph
            body: >-
              Fanatics is not selling a single application so much as a coordinated set of fan workflows. The
              investor-relations page now groups commerce, collectibles, betting and gaming, Fanatics Fest, markets, and
              studios into one platform, while partner storefronts and brand pages show those surfaces touching
              different buyer jobs at different points of intent. Commerce storefronts cover official team gear and
              broad licensed assortment; Topps NOW handles low-ticket moment-driven drops; Fanatics Collect handles
              higher-consideration auctions and custody; Fanatics Live adds creator-led discovery and box-breaking;
              sportsbook adds regulated wagering and casino play; and Fanatics Fest brings loyalty and premium in-person
              experiences into the same funnel. The product logic is therefore less about one consumer UI and more about
              capturing fan attention in whichever mode—shopping, collecting, betting, or attending—feels most natural
              at a given moment, then using FanCash and account identity to keep those surfaces connected. What matters
              for diligence is that these are not isolated adjacencies. MLB Shop and NBA Store surface Topps products
              inside league-store shopping flows, Fanatics Live can move cards directly into Collect, and Fanatics Fest
              forces account identity and rewards into a live-event purchase journey. That cross-sell design suggests
              Fanatics is using product breadth to lower reacquisition cost and to convert a general sports fan into a
              repeat collector, bettor, or event attendee without asking the user to learn a wholly separate brand each
              time.
