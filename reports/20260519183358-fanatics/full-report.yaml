  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competition is a stack, not a single 1:1 peer
        blocks:
          - type: paragraph
            body: >-
              Fanatics' competitive set only makes sense when broken into jobs-to-be-done rather than corporate logos.
              In merchandise, the company still benefits from controlling official league storefront infrastructure and
              from partner channels like Lids, but buyers can also solve the same gear purchase through DICK'S, league
              shops, and specialty sites like FansEdge. In collectibles, the real substitutes are not only other issuers
              but the trust-and-liquidity stack around PSA, eBay, and Goldin, where grading, vaulting, listing, and
              auction can all happen without Fanatics owning the relationship. In betting, Fanatics Sportsbook is
              competing against scaled specialists, especially DraftKings and Flutter's portfolio, plus incumbents like
              PENN.


              That is why no reviewed public company matches Fanatics exactly. DICK'S is bigger in disclosed
              sports-retail revenue but lacks Fanatics' official-store control and betting/collectibles adjacency. eBay
              is much larger and more liquid as a marketplace but does not own licensed sports demand. DraftKings and
              Flutter are clearer sportsbook benchmarks because they disclose scale directly, but neither offers the
              same merchandise entry point. Sportradar matters differently: it is not the bettor-facing app, but it
              controls data, league relationships, and integrity services that sportsbooks and leagues can use without
              Fanatics. The diligence implication is that Fanatics should be evaluated as a stitched platform fighting
              vertical specialists, not as a normal apparel retailer or a normal sportsbook.
            claimRefs:
