      - number: '6.3'
        title: Durability, expansion logic, and concentration or service friction
        blocks:
          - type: paragraph
            body: >-
              Fanatics’ expansion logic is visible almost everywhere in the current customer surfaces. The shopping app
              offers up to 5% FanCash on gear; Fanatics Fest rewards ticket buyers with FanCash and tier points;
              sportsbook app pages advertise FanCash on bets; and FanCash marketing explicitly frames the reward as
              something that can be earned when customers shop, bet, or play and then redeemed across gear, bonus bets,
              collectibles, and tickets. That cross-experience currency is strategically important because it is the
              clearest public evidence that Fanatics wants to convert a one-time merchandise shopper into a
              multi-surface customer with higher lifetime value. The same logic also creates concentration risk: if
              official league-store rights weaken, if Topps underperforms with collectors, or if sportsbook access
              narrows in key states, the cross-sell flywheel becomes less powerful.


              Durability evidence, however, is much weaker than the promotional story. Reviewed public sources do not
              disclose NRR, GRR, churn, active customer counts, or repeat purchase rates for any major segment. The
              strongest public satisfaction data in this chapter is actually adverse: the SmartCustomer review page
              shows a 1.9-star rating from 3,950 reviews and recurring complaints around customer service, shipping
              delays, returns, and gift-card handling. Responsible-gaming tools add another nuance. They are good
              compliance features, but they also underline that sportsbook engagement is regulated and deliberately
              constrained. The result is a split conclusion: Fanatics clearly has multiple customer entry points and a
              visible loyalty layer, but the public record still does not prove that those entry points convert into
              durable, low-friction, high-retention customer economics.
