  - id: TV005
    title: Thesis-break and hard-stop triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Revenue quality breaks
        - Fresh diligence shows revenue materially below the public $7B-$8B anchors
        - Undermines both the historical multiple and the base-case scenario.
        - Re-cut valuation toward the bear range and halt any price-agnostic enthusiasm.
      - - Preference stack surprises
        - New financing terms show heavy liquidation or ratchet protection ahead of new money
        - Shrinks common-equity upside even if the enterprise value holds.
        - Do not invest without a revised cap-table model.
      - - Litigation accelerates
        - Collectibles or consumer cases expand into material cash or operating constraints
        - Adds downside that public comp screens do not capture.
        - Move the case toward bear and demand legal reserve analysis.
      - - Betting economics disappoint
        - Sportsbook contribution remains structurally subsidy-heavy despite state footprint
        - Weakens the optionality premium embedded in the peak multiple.
        - Treat betting as a narrative drag rather than an upside kicker.
      - - Disclosure still absent at next mark
        - A fresh round arrives without audited segments or current margin detail
        - Makes any new valuation harder, not easier, to underwrite.
        - Maintain research-more posture even if the headline price moves up.
    notes: >-
      Triggers are designed to be monitorable and to map directly back to valuation discipline rather than generic
      company-quality concerns.
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV058
      - CV059
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Current valuation
        - Fresh primary, secondary, or board-mark valuation from 2025-2026
        - A stale 2022 peak mark is not enough to price new money.
        - Obtain management deck, board materials, or lead-investor confirmation.
      - - Cap table / preferences
        - Liquidation stack, ratchets, warrants, and any senior instruments
        - Common-equity and late-stage return math can change materially.
        - Request cap-table waterfall and financing documents under NDA.
      - - Segment economics
        - Revenue, gross margin, and contribution profit by Commerce, Collectibles, and Betting
        - Mix quality determines whether Fanatics deserves retail, marketplace, or hybrid multiples.
        - Request audited or banker-prepared segment bridge.
      - - Legal / regulatory exposure
        - Case status, reserves, and any settlements across collectibles, labor, or customer matters
        - Downside is not purely a multiple issue if cash costs are rising.
        - Run counsel memo and docket review before any IC approval.
      - - Betting and loyalty proof
        - State-level betting contribution and Fanatics ONE conversion economics
        - Optionality premium only works if newer businesses produce durable monetization.
        - Request cohort data and state-level P&L cut for recent quarters.
    notes: >-
      These asks are the minimum package needed to move from public-market triangulation to investment-grade
      underwriting.
    claimRefs:
      - CV051
      - CV052
      - CV058
      - CV060
