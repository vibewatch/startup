      - number: '8.2'
        title: Comparable screen and scenario math
        blocks:
          - type: paragraph
            body: >-
              The public comp set is imperfect, but it is still useful. DICK'S provides a sports-retail anchor,
              DraftKings and Flutter provide sports-betting screens, Sportradar provides a sports-data and
              betting-infrastructure screen, and eBay provides the closest marketplace-style multiple benchmark. On that
              lens, Fanatics' historical 3.9x to 4.4x sales screen sits above DICK'S, Flutter, DraftKings, and
              Sportradar, and roughly in line only with eBay's richer marketplace multiple. The comp lesson is not that
              Fanatics was obviously overvalued in 2022; it is that the market paid eBay-like pricing for a business
              that still carries more private-company opacity and a more heterogeneous mix of lower-margin commerce,
              newer betting exposure, and litigation-sensitive collectibles operations.


              Scenario math therefore matters more than point estimates. A disciplined 2.5x revenue screen on the $8
              billion public revenue anchor suggests roughly $20 billion of value, well below the widely cited $31
              billion peak. A reasonable base case of $8.5 billion of revenue at 3.0x implies about $25.5 billion, while
              a bear case of $7 billion at 1.5x falls to about $10.5 billion if disclosure gaps and downside signals
              start to dominate the story. The bull case only becomes compelling if Fanatics can prove that its platform
              optionality converts into higher-quality economics: roughly $10 billion of revenue at 4.5x would justify
              about $45 billion. With a 20/55/25 bull-base-bear weighting, the probability-weighted outcome lands around
              $25.7 billion, which is directionally closer to the earlier $27 billion round than to the later $31
              billion peak.
