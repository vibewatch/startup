companyProfile:
  summary: >-
    Fanatics grew out of Football Fanatics, founded in Jacksonville in 1995, and was later built into the current
    platform by Michael Rubin after the sports e-commerce assets were repurchased from eBay in 2011. Today the company
    presents itself as a six-business ecosystem spanning Commerce, Collectibles, Betting & Gaming, Fanatics Fest,
    Fanatics Markets, and Fanatics Studios, with more than 100 million fans, more than 900 sports properties, and more
    than 2,000 retail locations across its footprint. Public evidence indicates that the commerce and wholesale base
    still supplies most revenue, while Topps, sportsbook, loyalty, and live-event layers carry the diversification
    narrative.
  foundingLocation: Jacksonville, FL, USA
