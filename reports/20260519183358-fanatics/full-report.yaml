      - number: '8.3'
        title: Exit readiness, downside triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The clearest reason not to underwrite Fanatics at the old peak mark is not lack of demand proof; it is
              lack of disclosure-grade proof. The SEC search set still shows no S-1, S-1/A, 424B, or S-4 for Fanatics,
              which means public readers still cannot inspect audited segment revenue, gross margin, recognized betting
              economics, the current preference stack, or any exit mechanics that would normally frame a late-stage
              valuation call. Public eBay filings illustrate the gap: a marketplace comp can be inspected through annual
              reports and proxy materials, while Fanatics still cannot.


              Downside also looks more operational than a pure spreadsheet haircut. CourtListener already shows a thick
              docket around Fanatics-related matters, including collectibles cases, while customer review aggregation
              and NLRB search results imply consumer and labor friction that could compound rather than offset multiple
              compression. Those issues do not negate the upside case, but they do change the diligence order. The first
              questions for a real investment process should be: what is the current mark, what sits ahead of new money
              in the cap table, what do segment-level margins look like, and how much of the betting and collectibles
              expansion is actually durable rather than merely narrative-rich. Until those questions are answered, the
              most defensible posture is research-more with explicit hard-stop triggers rather than conviction buying.
