  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and privacy risk stack
        blocks:
          - type: paragraph
            body: >-
              Fanatics now carries a more complex legal and regulatory profile than a simple licensed-merchandise
              business. The court record is the clearest adverse signal: CourtListener's reviewed search shows a thick
              Fanatics litigation universe and specifically surfaces a fresh 2025-2026 cluster around collectibles,
              while the Jones docket confirms that the dispute is already in active motion practice with both dismissal
              and arbitration fights underway. That matters because the defendants are not only Fanatics entities but
              also leagues, players associations, and OneTeam, so any durable dispute can spill into the very rights
              network that powers both commerce and collectibles.


              Sportsbook expansion adds a second layer of exposure. PASPA's fall created the opportunity, but the
              reviewed AGA, RG.org, Census, and Pennsylvania terms materials all point to the same operating reality:
              Fanatics only participates where states permit it, where local licenses remain intact, and where
              geolocation, age gating, identity verification, and operator conduct stay within regulatory boundaries.
              The privacy stack is also consequential. Public sportsbook policies say precise geolocation is sensitive
              data, contemplate sharing data with regulators and leagues, and expose opt-out mechanics that depend on
              site-specific cookies. Fanatics ONE then extends that surface by explicitly exchanging rewards and
              FanCash-related incentives for personal data and partner sharing. The combined legal risk is therefore not
              only “lawsuits”; it is a compounding mix of IP and consumer litigation, state gaming compliance, privacy
              obligations, and loyalty-program scrutiny.
