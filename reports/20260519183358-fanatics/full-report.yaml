      - number: '2.3'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are clear. Merchandise benefits from global streaming reach, moment-driven
              drops, and collaboration-led premiumization. Trading cards benefit from adult investment demand, digital
              distribution, creator and streamer ecosystems, and service layers like grading that deepen lifetime value
              after the initial sale. Sports betting was structurally unlocked by the 2018 PASPA decision and has grown
              through state legalization, mobile access, and a regulated data ecosystem. Sacra's analysis adds the
              platform angle: Fanatics has already built a 100 million-plus fan audience through commerce and can try to
              recycle that attention into higher-growth, higher-margin categories such as Topps, betting, and live
              experiences. That cross-sell logic helps explain why private investors underwrote a platform valuation
              rather than a plain apparel multiple.


              But the constraints matter just as much. Sacra also argues that core retail growth is slowing and that
              leagues have begun reopening distribution to Amazon and other channels, which weakens the assumption that
              legacy commerce can permanently dominate fan spend. Betting remains state-by-state, politically contested,
              and exposed to policy fights over event contracts and oversight. Collectibles sizing is noisy because many
              market reports blend sports cards with broader trading card games, entertainment cards, or digital assets.
              And no public source cleanly isolates Fanatics' own serviceable market split across merchandise,
              collectibles, and betting. The valuation implication is straightforward: Fanatics can plausibly
              participate in several large pools, but the highest-multiple parts of the story rely on rights durability,
              regulatory access, and the ability to convert a commerce customer into a collector or bettor without
              losing trust or margin along the way.
