      - number: '5.3'
        title: Trust controls, maturity, and roadmap gaps
        blocks:
          - type: paragraph
            body: >-
              Trust and quality controls are visible, but unevenly disclosed. Sportsbook surfaces expose
              responsible-gaming tools and policy links directly, which is appropriate for a regulated product. Fanatics
              Live and Fanatics Collect also expose help-center and workflow surfaces, and Instant Rips explicitly
              claims authentication and verification for cards. Even so, the public record is much stronger on product
              availability than on process detail. Fanatics does not publicly show the deeper fraud-review,
              vault-control, certification, uptime, or marketplace-loss metrics that would let an investor underwrite
              the control stack with confidence. The sharpest external adverse signal remains the commerce layer, where
              third-party reviews cluster around customer-service and shipping complaints. A second strategic caution is
              digital collectibles: Candy.com now points users to Candy.io while the original domain is being marketed
              for sale, which makes that part of the thesis look secondary to cards, auctions, live commerce, and
              betting. Overall maturity is real, but disclosure is still thin where trust underwriting matters most. The
              trust picture is also asymmetric across business lines. Betting has the clearest visible control layer
              because regulation forces explicit disclosures; collectibles has partial trust evidence through
              authentication claims, support content, Vault references, and the continuing relevance of third-party
              grading rails; and commerce has the most adverse external feedback because fulfillment and support
              failures are directly felt by end customers. That means the next diligence step is not finding more
              product surfaces—they are already abundant—but getting operating evidence that the controls, service
              levels, and fraud processes behind those surfaces are as integrated as the customer-facing story implies.
