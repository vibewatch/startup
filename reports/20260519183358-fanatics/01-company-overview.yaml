  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance transparency and incomplete stakeholder map
    missingEvidence: Current board composition, committee structure, any independent director roster, and a fully reconciled investor-rights map.
    whyItMatters: A platform of this scale has multiple regulated and litigated businesses, so governance quality and investor-rights clarity affect risk control, exit readiness, and the usefulness of TO003.
    diligencePath: Request current board materials, observer rights, shareholder agreement summary, and the latest cap-table rights matrix.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation reset detail
    missingEvidence: Direct documentation for the reported 2024–2025 tender process, any secondary-clearing price, and resulting share-count implications.
    whyItMatters: Entry valuation discipline depends on whether the reset was isolated employee liquidity or a broader repricing of the cap table.
    diligencePath: Obtain board consents, tender terms, and cap-table snapshots covering the most recent secondary transactions.
    relatedQuestionRefs:
    - QO014
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Debt balances, covenant package, and liquidation preference stack across major private rounds.
    whyItMatters: Without debt and preference detail it is difficult to assess downside protection, IPO readiness, or M&A flexibility.
    diligencePath: Request the latest balance sheet, debt schedule, and preferred stock rights summary.
    relatedQuestionRefs:
    - QO016
  - type: conflicting-data
    severity: minor
    topic: employee count
    missingEvidence: A single authoritative employee count reconciled across Fanatics corporate, investor, and consumer sites.
    whyItMatters: Headcount is a core cover metric and an indirect indicator of operating leverage across Fanatics’ divisions.
    diligencePath: Ask management to reconcile total employees by division, geography, and whether retail-store labor is included.
    relatedQuestionRefs:
    - QO018
  - type: private-evidence-only
    severity: material
    topic: disclosure readiness and incomplete milestone chronology
    missingEvidence: A formal IPO readiness timeline or internal documentation showing whether an S-1 process has been started but not filed, plus a management-approved chronology that fills any missing financing, regulatory, and governance milestones.
    whyItMatters: Exit timing and disclosure burden are central to the return case for a very large late-stage private company, and TO004 is intentionally partial until management validates the full milestone sequence.
    diligencePath: Request IPO-preparation workstreams, auditor status, capital-markets timeline assumptions, and an internal milestone chronology used by finance or corporate development.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO004
