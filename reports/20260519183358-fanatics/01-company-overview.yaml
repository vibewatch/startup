company:
  name: Fanatics
chapter:
  number: 1
  title: Company Overview
  summary: Fanatics has evolved from a licensed-merchandise specialist into a multi-division sports platform spanning commerce, collectibles, betting and gaming, events, and media-like fan experiences. Public sources consistently show exceptional scale — 100M+ reachable fans, 900+ sports properties, 2,000+ retail locations including Lids, and a latest public revenue anchor of $8.1B — but they also show disclosure gaps typical of a private holding company. The strongest strategic inflection points were the Topps acquisition, the PointsBet US acquisition, and the continued use of league-store control to cross-sell fans into newer, higher-margin categories.
sections:
- id: identity-scale
  title: Identity, footprint, and platform structure
  body: |-
    Fanatics has moved well beyond its original identity as an online jersey seller. The corporate and investor relations pages now frame the business as an integrated sports platform built around six connected businesses: commerce, collectibles, betting and gaming, live events, studios, and markets. That framing matters because it explains why the company publishes scale metrics that look much larger than a pure apparel retailer: more than 100 million reachable fans, more than 900 sports properties, more than 6,000 athlete and celebrity relationships, and more than 2,000 retail locations including the Lids store base. The league-specific storefronts for the NFL, MLB, NBA, and NHL still route through the Fanatics operating model, so the legacy commerce engine remains the front door to the ecosystem. The current strategy is not simply to sell more merchandise; it is to own the fan relationship at multiple points of spend and engagement, then recycle that demand into collectibles, betting, and experiences.

    Headquarters evidence also reflects the company’s hybrid identity. Third-party profiles place the formal address at 95 Morton Street in New York City, while the historical operating center and brand roots remain in Jacksonville. That split is consistent with Fanatics’ evolution from a Florida-origin sports merchandiser into a larger holding company with finance, media, and betting ambitions. The same pattern shows up in employee counts: the corporate and investor pages say 22,000+, but the older consumer about page still references 8,000+, suggesting that newer businesses and expanded distribution assets are being counted at the platform level. For diligence purposes, the right takeaway is that Fanatics is large, but the precise current employee boundary is not perfectly standardized across its own public surfaces.
