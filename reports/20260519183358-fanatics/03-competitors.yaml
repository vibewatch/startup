callouts:
  - calloutType: strength
    title: Integrated fan identity is still unusual
    body: Fanatics remains one of the few reviewed companies that can move a fan from official merchandise into rewards, collectibles, and betting under one umbrella, which is the strongest argument that the platform deserves to be judged on more than legacy apparel economics.
    claimRefs: [CP001, CP047, CP057]
  - calloutType: risk
    title: Specialists are larger and more transparent in every vertical they own
    body: DICK'S, eBay, DraftKings, Flutter, Sportradar, and PSA each disclose a clearer economic lens or a sharper specialist workflow than Fanatics does publicly, so the burden of proof sits on Fanatics' cross-sell economics rather than on the absence of alternatives.
    claimRefs: [CP009, CP012, CP018, CP023, CP028, CP030, CP056]
  - calloutType: risk
    title: Merchandise moat is contractual, not invulnerable
    body: The same partner-controlled distribution that gives Fanatics leverage today can weaken if leagues fragment rights, reopen channels, or decide that owning the customer relationship matters more than routing everything through one dominant operator.
    claimRefs: [CP050, CP051, CP052]
