company:
  name: Fanatics
chapter:
  number: 3
  title: Competitors
  summary: Fanatics has no clean one-to-one public peer; instead it competes against a stack of specialists that each attack one layer of the fan wallet with more focus or more disclosure. DICK'S, league stores, Lids/FansEdge, eBay plus PSA plus Goldin, DraftKings, Flutter, PENN, and Sportradar all constrain a different piece of the thesis. That means Fanatics' moat is durable only if contractual distribution access and cross-sell conversion stay stronger than the specialist alternatives.
sections:
  - id: no-single-peer
    title: Competition is a stack, not a single 1:1 peer
    body: |-
      Fanatics' competitive set only makes sense when broken into jobs-to-be-done rather than corporate logos. In merchandise, the company still benefits from controlling official league storefront infrastructure and from partner channels like Lids, but buyers can also solve the same gear purchase through DICK'S, league shops, and specialty sites like FansEdge. In collectibles, the real substitutes are not only other issuers but the trust-and-liquidity stack around PSA, eBay, and Goldin, where grading, vaulting, listing, and auction can all happen without Fanatics owning the relationship. In betting, Fanatics Sportsbook is competing against scaled specialists, especially DraftKings and Flutter's portfolio, plus incumbents like PENN.

      That is why no reviewed public company matches Fanatics exactly. DICK'S is bigger in disclosed sports-retail revenue but lacks Fanatics' official-store control and betting/collectibles adjacency. eBay is much larger and more liquid as a marketplace but does not own licensed sports demand. DraftKings and Flutter are clearer sportsbook benchmarks because they disclose scale directly, but neither offers the same merchandise entry point. Sportradar matters differently: it is not the bettor-facing app, but it controls data, league relationships, and integrity services that sportsbooks and leagues can use without Fanatics. The diligence implication is that Fanatics should be evaluated as a stitched platform fighting vertical specialists, not as a normal apparel retailer or a normal sportsbook.
    claimRefs: [CP001, CP002, CP003, CP004, CP009, CP010, CP012, CP013, CP017, CP018, CP021, CP023, CP026, CP028, CP030, CP034, CP035, CP036, CP037, CP038, CP039, CP042, CP043, CP044, CP045, CP046]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capabilities-pricing-distribution
    title: Capability breadth helps Fanatics, but specialists win on focus and pricing clarity
    body: |-
      Fanatics' biggest differentiator is still that one company can move a fan from official merchandise into collectibles and then into betting with the same identity and rewards logic. The investor page frames that integrated ecosystem explicitly, while the sportsbook page shows how FanCash now extends into wagering. But the reviewed competitor surfaces also show why breadth alone is not a knockout blow. DICK'S competes on broad assortment, store pickup, same-day delivery, and explicit rewards promotions. DraftKings positions itself as a top-rated sportsbook and already discloses far more sportsbook revenue than anything Fanatics Betting has published. Flutter is larger still, and its investor materials frame a global regulated betting portfolio rather than a narrow U.S. launch story.

      Collectibles are even more revealing. PSA does not need to win primary issuance to win the trust layer. Its homepage and Collectors Club pages show a direct monetization model built around authentication, grading, subscriptions, and per-card fees, while Collectors' news feed documents how eBay, Goldin, and PSA have been assembled into a tighter end-to-end hobby workflow. That gives collectors a credible alternative to staying inside Fanatics' owned rails. Pricing evidence is also uneven across the chapter: Fanatics Sportsbook and DICK'S surface actionable offers on the fetched pages, and PSA publishes explicit membership and grading prices, but many rival fee stacks remain dynamic, state-specific, or undisclosed on the pages reviewed. That lack of stable apples-to-apples pricing is itself a competitive fact because it makes public comparison harder and forces diligence onto realized economics instead of headline promos.
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP015, CP016, CP017, CP018, CP021, CP022, CP023, CP030, CP031, CP032, CP033, CP047, CP048, CP049, CP053, CP054, CP057]
    tableRefs: [TP002, TP003]
    figureRefs: [FP002]
  - id: moat-durability-switching
    title: Moat durability depends on partner access and cross-sell, not on absence of substitutes
    body: |-
      The strongest evidence for Fanatics' moat is still distribution and identity. More than 900 sports properties, more than 2,000 retail locations including Lids, and the continued existence of official NFL, MLB, NBA, and NHL stores show that Fanatics sits close to rights holders and controls privileged commerce touchpoints. If the company can keep turning that traffic into loyalty, collectibles, and betting behavior, its platform breadth remains hard to reproduce. That is the best case behind the integrated-fan thesis.

      The adverse case is that this moat is contractual and therefore fragmentable. Sacra argues that roughly 80% of Fanatics' revenue still comes from commerce and wholesale apparel, and also argues that leagues have already started reopening distribution to Amazon and other channels. If that is right, Fanatics' core profit engine is exposed exactly where public specialists are most transparent and where multi-homing is easiest. A fan can buy jerseys from official league shops, hats from Lids, retro gear from FansEdge, list graded cards through PSA and eBay, and place wagers with DraftKings or Flutter without ever using a single integrated Fanatics loop. Public-company rivals also file current 10-Ks or equivalent materials, which makes their operating cadence easier to benchmark than Fanatics' private holding-company narrative. The core diligence question is therefore not whether substitutes exist — they clearly do — but whether Fanatics can maintain superior rights access and better cross-sell economics than those substitutes once promotional intensity and channel fragmentation rise.
    claimRefs: [CP002, CP003, CP004, CP015, CP016, CP036, CP037, CP038, CP039, CP040, CP041, CP043, CP044, CP045, CP046, CP050, CP051, CP052, CP055, CP056, CP057]
    tableRefs: [TP004]
    figureRefs: [FP003]
