    notes: Sample competitor set emphasizes the specific jobs that pressure Fanatics rather than every sports company in the market; scale fields are the best public run-rate or market-cap anchors found in reviewed sources.
    claimRefs: [CP001, CP002, CP003, CP004, CP009, CP010, CP012, CP013, CP017, CP018, CP021, CP023, CP026, CP028, CP030, CP031, CP032, CP033, CP034, CP035, CP042, CP043, CP045, CP046]
