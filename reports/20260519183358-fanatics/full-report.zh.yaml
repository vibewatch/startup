      - number: '1.3'
        title: 里程碑、多元化与反向背景
        blocks:
          - type: paragraph
            body: >-
              Fanatics 最重要的战略里程碑，是把平台从服饰向外拓宽的动作。收购 Topps 给了公司一个旗舰收藏品品牌，也让它更直接掌握授权球星卡经济。收购 PointsBet US 让 Fanatics
              Betting and Gaming 立刻获得接近全国的覆盖，而不必从零开始按州慢慢搭建。Fanatics Fest 和 Fanatics ONE / FanCash
              联动，显示管理层试图把活动、忠诚度、媒体和消费连接到同一个会员身份里，让生态对消费者变得可感知。再加上联盟店铺控制权，这些动作解释了为什么 Fanatics
              越来越像一个建立在球迷身份之上的体育操作系统，而不是简单零售商。


              同一轮扩张的反面，是复杂度和法律暴露快速上升。CourtListener 已经显示 2025–2026 年诉讼日程在变厚，包括与收藏品有关的集体诉讼，以及与球星卡授权相关、带有反垄断色彩的争议。与此同时，SEC
              搜索仍未显示公开提交的 S-1，因此外部人看不到经审计分部披露、清晰董事会细节，也看不到债务和优先权包袱的透明图景。实际尽调结论是：Fanatics
              已经明确具备规模，战略上也重要，但它当前的私营公司披露制度，落后于公司正在运营的平台宽度。
