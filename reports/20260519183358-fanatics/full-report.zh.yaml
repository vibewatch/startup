  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Representative May 2026 public comps spanning sports retail, betting, sports data, and marketplace analogs plus
        Fanatics' own historical peak screen.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值状态
      - 相关性
      - 局限
    rows:
      - - DICK'S Sporting Goods 零售商
        - $19.00B 市值；$17.22B TTM 收入
        - 1.10x P/S 倍数
        - 授权商品和门店经济性上，最好的上市体育零售锚点。
        - 纯零售模式缺少 Fanatics 的博彩、收藏品和媒体可选性。
      - - DraftKings
        - $12.74B 市值；$6.29B TTM 收入
        - 2.04x P/S 倍数
        - 筛选美国体育投注业务可选性和促销强度时有用。
        - 纯博彩业务；没有电商或收藏品抵消。
      - - Flutter Entertainment
        - $16.92B 市值；$17.02B TTM 收入
        - 1.00x P/S 倍数
        - 监管下全球体育投注业务敞口中，规模化博彩业务的最佳可比。
        - 组合不包含授权电商或球星卡经济性。
      - - Sportradar
        - $4.10B 市值；1.33B EUR TTM 收入
        - 2.68x P/S 倍数
        - 体育数据、媒体和博彩基础设施可选性的 B2B 类比。
        - 比 Fanatics 更小、更窄，也更偏企业服务。
      - - eBay
        - $50.84B 市值；$11.60B TTM 收入
        - 4.39x P/S 倍数
        - 规模化抽佣型电商和经审计披露上，最接近市场型平台的基准。
        - 更成熟、审计更充分，对博彩或收藏品诉讼暴露更少。
      - - Fanatics 历史峰值
        - $31B 估值；公开收入锚点为 $7B-$8B
        - 3.9x-4.4x 隐含销售倍数
        - 显示私有投资者曾为多元可选性支付类似市场型平台的定价。
        - 广泛引用的估值标记已经陈旧，缺少当前公开文件或股权结构细节支撑。
    notes: 可比集合刻意采用样本方式；倍数混合上市市场数据和隐含私有筛选，因此可比选择与披露差异和原始销售倍数同等重要。
