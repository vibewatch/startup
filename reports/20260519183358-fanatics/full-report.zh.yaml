      - number: '5.2'
        title: 运营架构与依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一种联邦式运营架构。Fanatics 同时维持许多品牌店铺和伙伴入口，收购则用来扩展能力，而不只是增加流量。Topps 交易带来实体和数字球星卡基础设施、全球运营和专业员工。PointsBet
              交易加入平台资产、量化交易模型、ADW/iGaming 运营和更宽分销。Fanatics Live 增加带物流和分析能力的卖方操作系统，Instant Rips 则把揭晓后的卡片直接转入 Fanatics
              Collect 来闭环。已审阅来源都不能证明所有业务线共用一个完整技术底座，因此最有证据支撑的解释是：Fanatics
              运营的是一个协调组合，在可见处共享身份、忠诚度和商业编排，但底层仍有重要的业务单元专属依赖。这意味着授权、目录管理、物流、直播审核和受监管投注控制，和纯软件产品设计同样重要。公开材料也显示，各层产品成熟度不同。周边和伙伴店铺运营上成熟但信任受挑战；收藏品拥有最丰富的工作流集成；直播电商有活跃卖方流动性，但几乎没有公开
              KPI 披露；体育投注层受益于导入的平台资产和明确监管覆盖。换句话说，当产品触点能按客户工作流串起来时，Fanatics 的架构最强；当投资者只能从伙伴页面和发布文案推断不可见内部系统时，它最弱。
