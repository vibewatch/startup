  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Fanatics 不应只按授权球衣零售商估值。其投资者页面现在把公司描述成一个覆盖六块业务的平台：电商、收藏品、博彩与游戏、现场活动、市场和工作室；背后有超过 1 亿名球迷、超过 900 个体育权益方，以及超过
              2,000 个零售网点。这个广度解释了为什么私募投资人愿意用成长股价格，买入一家仍以大体量电商为核心的公司。对私企来说，2022 年融资记录也异常清楚：MarketScreener 记录了 2022 年 3
              月投后估值 $27 billion 的一轮融资；SportsPro 随后报道，公司以 $31 billion 估值融资约 $700 million，部分资金将用于继续 M&A。


              问题在于，公开承销桥接材料到此为止。SportsPro 对 2023 年收入的 $8 billion 预期，以及 Sacra 后来的 $7 billion
              收入标记，方向上都很强，但它们不是经审计的分部披露、当前优先权条款，也不是新的融资估值。用这些公开收入锚点计算，被广泛报道的 $31 billion 价格约等于 3.9x 到 4.4x
              销售额。对交易平台式业务来说这并不荒唐，但相较大多数公开体育博彩、体育零售和体育数据可比公司，仍然偏贵。因此，正确结论不是看公司有多令人钦佩，而是看价格是否守纪律：Fanatics
              真实、有规模、战略位置重要，但旧的峰值估值仍要求投资人为尚未被公开资料清楚量化的可选性付高价。
