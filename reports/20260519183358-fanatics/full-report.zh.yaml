      - number: '6.3'
        title: 持久性、扩张逻辑以及集中或服务摩擦
        blocks:
          - type: paragraph
            body: >-
              Fanatics 的扩张逻辑几乎在当前所有客户触点上都能看到。购物应用为装备提供最高 5% FanCash；Fanatics Fest 用 FanCash 和等级积分奖励购票者；Sportsbook
              应用页面宣传投注可得 FanCash；FanCash 营销则明确把奖励描述成一种客户购物、投注或游戏时可以赚取，并可在装备、Bonus
              Bets、收藏品和门票间兑换的资产。这种跨体验货币在战略上很重要，因为它是最清晰的公开证据，说明 Fanatics
              想把一次性周边买家转成更高生命周期价值的多触点客户。同一逻辑也带来集中风险：如果官方联盟店权利削弱、Topps 在收藏者中表现不佳，或体育投注在关键州准入收窄，交叉销售飞轮就会变弱。


              不过，持久性证据远弱于促销故事。审阅过的公开来源没有披露任何主要分部的 NRR、GRR、流失、活跃客户数或复购率。本章最强的公开满意度数据反而是反向的：SmartCustomer 评价页面显示，3,950
              条评价给出 1.9 星，并围绕客服、发货延迟、退货和礼品卡处理反复投诉。负责任博彩工具又增加一层细节。它们是好的合规功能，但也提醒我们，体育投注参与度受监管且刻意受限。结论因此是分裂的：Fanatics
              明显拥有多个客户入口和可见忠诚度层，但公开记录仍未证明这些入口能转化为持久、低摩擦、高留存的客户经济性。
