        - 更新的融资估值标记或经审计收入，会让历史价格更容易对标。
      - - 电商似乎仍贡献大部分收入基础，因此纯科技公司式倍数扩张的合理空间有限。
        - 反向逻辑
        - 高利润率收藏品或博彩贡献占比更高，会改善收入组合。
      - - 公开文件未披露当前优先权、分部利润率或退出机制。
        - 反向逻辑
        - 达到监管文件级别的披露包会显著提高信心。
      - - 诉讼、劳工和客户摩擦证据可能把下行加深到正常倍数压缩之外。
        - 反向逻辑
        - 更干净的法律和运营信号会降低悲观情景的严重性。
      - - 如果忠诚度、活动和博彩加深球迷变现，Fanatics 可能仍应相对普通体育零售享有溢价。
        - 投资逻辑
        - 如果管理层证明传统电商之外的当前变现能力，这一溢价会更站得住。
    notes: 这些论点刻意绑定观察到价格区间下的可投资性，而不是泛泛称赞公司或创始人。
