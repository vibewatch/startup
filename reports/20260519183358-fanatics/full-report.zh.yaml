      - number: '6.2'
        title: 采用轨迹与生产级客户证据
        blocks:
          - type: paragraph
            body: >-
              最强的采用证据是方向性的，而不是完整财务证据。Fanatics 公司材料称，公司如今可触达 1 亿多球迷；2022 年 Topps 收购公告则提到全球 8,000 多万体育迷数据库。购物应用宣传 150
              多万件商品，说明消费者选品极广，尽管它没有披露实际活跃买家。投注方面，PointsBet 之后的版图更明确：Fanatics 称，这笔收购让其体育投注产品可覆盖 95%
              可触达的美国线上体育投注者市场，并把运营延伸到 19 个零售点。Sportsbook 应用页面进一步证明这不是测试部署；页面描述了多个州的实时投注、四个州的赌场产品可用性、快速注册、提款追踪，以及庞大的 iOS
              评分基础。


              在公开记录能显示真实触点和清晰用户动作的地方，具名证据最强。官方联盟店证明了真实生产级商品销售。Fanatics Fest 说明现场活动参与者可以被转化为 Fanatics ONE 账户和赚取 FanCash
              的客户。PointsBet 迁移措辞显示，Fanatics 继承并迁移了真实体育投注用户，而不只是授权技术。Topps 在收藏品侧提供了最好证据，因为 Fanatics
              明确买下了一家已经服务全球收藏者、球迷和零售商的业务。仍缺的是投资者最想要的一层：按分部列示的活跃客户数、复购率或队列结果。因此，本章可以证明宽度、真实上线和部分采用代理指标，但不能证明分部层面的持久变现。
