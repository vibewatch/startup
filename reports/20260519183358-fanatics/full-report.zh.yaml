          - type: callout
            title: 权利与监管可能给上行设限
            body: 两个上行空间最大的垂直领域，也有最强的外部约束：权利方控制 Fanatics 能发行和销售什么，州和监管机构控制投注能在哪里、以什么条件扩张。
            calloutType: risk
            claimRefs:
              - CM023
              - CM032
              - CM033
              - CM034
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争是一组堆栈，不是单一 1:1 可比公司
        blocks:
          - type: paragraph
            body: >-
              只有把要完成的任务拆开，Fanatics 的竞争集合才说得通，而不是按公司 logo 粗暴归类。周边商品里，公司仍受益于控制官方联盟店铺基础设施，以及 Lids 这类合作渠道，但买家也可以通过
              DICK'S、联盟店铺和 FansEdge 这类垂直网站完成同样的装备购买。收藏品里，真正替代者不只是其他发行方，还包括 PSA、eBay 和 Goldin 周围的信任与流动性堆栈；评级、托管、上架和拍卖都可以在
              Fanatics 不拥有关系的情况下发生。体育投注里，Fanatics Sportsbook 面对的是已成规模的专门玩家，尤其是 DraftKings、Flutter 组合，以及 PENN 等老牌玩家。


              所以，已审阅的上市公司没有一家能精确匹配 Fanatics。DICK'S 披露的体育零售收入更大，但没有 Fanatics 的官方店控制权，也没有投注 / 收藏品邻接。eBay
              作为市场平台规模大得多、流动性更强，但并不拥有授权体育需求。DraftKings 和 Flutter 是更清晰的体育投注平台基准，因为它们直接披露规模，但两者都没有同样的周边入口。Sportradar
              的意义又不同：它不是面向投注者的应用，而是控制数据、联盟关系和诚信服务，投注平台和联盟可以绕开 Fanatics 使用这些能力。尽调含义是：应把 Fanatics
              看成一个拼接式平台，在和垂直专家作战；不能把它当普通服饰零售商或普通体育投注平台。
