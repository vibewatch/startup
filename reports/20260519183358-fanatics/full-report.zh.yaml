      - number: '5.3'
        title: 信任控制、成熟度与路线图缺口
        blocks:
          - type: paragraph
            body: >-
              信任与质量控制可以看到，但披露不均衡。体育投注触点直接展示负责任博彩工具和政策链接，这符合受监管产品应有状态。Fanatics Live 和 Fanatics Collect
              也展示帮助中心和工作流界面，Instant Rips 明确声称为卡片提供鉴定和验证。即便如此，公开记录更能证明产品可用性，而不是流程细节。Fanatics
              并未公开展示更深的欺诈复核、金库控制、认证、正常运行时间或市场损失指标，这些指标才足以让投资者有信心承销控制堆栈。最尖锐的外部反向信号仍来自商务层，第三方评价集中在客服和发货投诉。第二个战略警示是数字收藏品：Candy.com
              如今把用户导向
              Candy.io，原域名正在挂牌出售，这让这部分投资逻辑看起来次于卡片、拍卖、直播电商和投注。整体成熟度真实存在，但在信任承销最关键的地方，披露仍偏薄。各业务线的信任图景也不对称。投注有最清晰的可见控制层，因为监管迫使明确披露；收藏品借鉴定声称、支持内容、Vault
              引用和第三方评级轨道的持续相关性，提供部分信任证据；商务的外部反馈最差，因为履约和支持失败会被终端客户直接感知。因此，下一步尽调不是寻找更多产品触点——触点已经很多——而是拿到运营证据，证明这些触点背后的控制、服务水平和反欺诈流程，和前台客户故事一样整合。
