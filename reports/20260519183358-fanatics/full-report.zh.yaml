      - number: '7.3'
        title: 财务模型、估值敏感性与硬性止损条件
        blocks:
          - type: paragraph
            body: >-
              财务风险不在于公司马上会资不抵债，而在于承销质量。2022 年融资叙事很激进：SportsPro 报道估值为 $31 billion，M&A 能力更强，预计收入约 $8 billion，预期现金超过 $2
              billion。但 DMR 引用的后续公开报道显示，2024 年估值降到 $25 billion；也就是说，在更完整的信息披露出现之前，公开标记已经下调。与此同时，以 Fanatics
              的业务组合看，当前公开可比公司给出的估值要求仍然不低。DraftKings 约为 2.0x 销售额，Flutter 约为 1.0x，eBay 约为 4.4x；Fanatics
              仍需要投资人相信，电商、收藏品、博彩和忠诚度体系可以并存，并产生类似交易平台的上行空间。


              因此模型有两个相互勾连的风险。第一，激励经济账仍不透明。公开 FanCash 材料承诺在购物、下注和游戏中最高返
              10%，把赚取比例与下注赔率挂钩，还允许公司随时变更或终止计划；但外界看不到公开的准备金、回本或贡献毛利披露，无法判断实际成本。第二，诉讼、隐私和客服问题会比单纯收入增长更快传导进估值，因为它们同时击中信任、留存和监管容忍度。因此，可投资姿态是有条件的：如果诉讼扩大、忠诚度经济账不成立，或下一轮私募估值远低于上一轮公开区间，就应把投资逻辑视为已经破裂，而不是只是延后。
