  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 球迷生态中的客户分层与入口
        blocks:
          - type: paragraph
            body: >-
              理解 Fanatics，最好把它看成一家服务多种客户模式的公司。这些模式都从体育迷身份出发，但变现方式不同。最清晰的分层是传统周边买家，他们来到 Fanatics.com 或 Fanatics
              应用，购买主要联盟和许多相邻运动的官方授权服饰、球衣、帽子、纪念品和季节性发售。但客户图景已经不止于此。应用还打包票务购买、实时比分和奖励；Fanatics Fest 变现线下参与；Topps
              把平台延伸到收藏者、爱好店和国际零售；Fanatics Sportsbook 面向下注合法州的受监管投注者。客户不只是买一件球衣的球迷，而是一个可复用的球迷身份，可以在商务、收藏品、活动和投注之间移动。


              渠道结构同样重要。Fanatics 仍通过 NFL Shop、MLBShop、NBA Store 和 NHL Shop
              等具名伙伴店铺触达客户；这些是与联盟权利绑定的线上生产级商务部署，不是猜测性合作。FansEdge 和 Lids 增加相邻渠道，偏向复古街头服饰、帽子和实体店存在。Topps 再次拓宽客户地图，因为它服务 100
              多个国家的收藏者、球迷和零售商。换句话说，Fanatics
              的客户基于产品线、渠道和监管触点分层：大众装备买家、应用优先的忠诚度会员、活动参与者、收藏者、零售商和投注者都在同一个更大平台内，但行为方式不同，创造价值的条件也不同。
