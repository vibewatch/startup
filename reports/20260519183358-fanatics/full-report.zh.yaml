  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 基于证据梳理 Fanatics 六个最重要的风险簇，同时权衡发生可能性、影响和当前缓释成熟度。
    approximationNotes: 评级是基于所引述主张做出的分析综合，不是公司发布的分数。高 / 中 / 低取值把已审阅的法律、客户、政策和经济性证据转成监控视角。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 收藏品诉讼簇
          values:
            - 高
            - 严重
            - 低-中
            - 严重
        - label: 州级牌照和隐私合规
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 客服和履约摩擦
          values:
            - 高
            - 高
            - 中
            - 高
        - label: PointsBet / Topps 依赖集中
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 促销和 FanCash 经济性
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 披露和估值重置
          values:
            - 中
            - 严重
            - 低
            - 高
    claimRefs:
      - CR048
      - CR049
      - CR050
      - CR051
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律、运营、激励和依赖风险如何传导到 Fanatics 的收入质量、利润率和估值。
    approximationNotes: 节点和边代表分析师对已审阅证据的综合判断。图中展示的是因果路径，不是实测系数。
    data:
      nodes:
        - id: litigation
          label: 收藏品诉讼
          type: risk
          detail: Jones 及相关诉状带来法律成本和权利关系压力
        - id: regulation
          label: 州级牌照 / 隐私
          type: risk
          detail: 博彩审批、地理定位和敏感数据处理必须持续合规
        - id: service
          label: 客服摩擦
          type: risk
          detail: 配送、退款和支持失误会削弱品牌信任
        - id: promo
          label: FanCash / 促销经济性
          type: risk
          detail: 基于赔率的奖励和奖励投注规则会影响利润率和用户感知
        - id: dependency
          label: PointsBet / Topps 依赖
          type: risk
          detail: 收购来的牌照、员工、技术和权利组合仍然关键
        - id: trust
          label: 客户信任 / 留存
          type: output
          detail: 跨业务互动要靠用户信任电商和博彩流程
        - id: margin
          label: 贡献利润率
          type: output
          detail: 促销成本、法律费用和支持摩擦会影响经济性
        - id: valuation
          label: 估值 / 融资
          type: output
          detail: 任何下行都可能因私募市场估值标记下调而放大
      edges:
        - from: litigation
          to: trust
          label: 损害品牌 / 权利方信心
        - from: litigation
          to: valuation
          label: 抬高法律成本和准备金风险
        - from: regulation
          to: trust
          label: 隐私或合规问题打击信心
        - from: regulation
          to: valuation
          label: 缩小可触达市场 / 增加审查
        - from: service
          to: trust
          label: 削弱复购和交叉销售
        - from: service
          to: margin
          label: 推高退款和支持成本
        - from: promo
          to: margin
          label: 可能侵蚀单位经济性
        - from: promo
          to: trust
          label: 奖励规则不清会制造摩擦
        - from: dependency
          to: trust
          label: 整合失手会拖累产品质量
        - from: dependency
          to: valuation
          label: 协同逻辑变弱
        - from: trust
          to: valuation
          label: 留存下降 / 增长走弱
        - from: margin
          to: valuation
          label: 倍数压缩
    claimRefs:
      - CR012
      - CR036
      - CR034
      - CR043
      - CR050
      - CR049
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 从规模和可选性推到估值判断：Fanatics 的平台宽度和融资证据真实存在，但披露缺口和下行传导节点让建议停在“继续研究”，而不是“买入”。
    approximationNotes: 节点标签是对证据集的编辑部摘要，不是实测概率。
    data:
      nodes:
        - id: scale
          label: 规模：100M+ 球迷、900+ 项资产、2,000+ 零售点
        - id: mix
          label: 可选性：电商 + 收藏品 + 博彩 + 活动
        - id: price
          label: 历史价格：先 $27B、后 $31B；约 3.9x-4.4x 销售额
        - id: gap
          label: 约束：没有公开 S-1 / S-1-A / 424B / S-4，也没有当前股权结构表细节
        - id: risk
          label: 约束：诉讼、劳工和客户摩擦信号
        - id: rec
          label: 输出：继续研究 / 偏高，直到有更新的估值证据
      edges:
        - from: scale
          to: mix
          label: 支撑溢价故事
        - from: mix
          to: price
          label: 帮助解释 2022 年峰值估值标记
        - from: price
          to: gap
          label: 需要更充分披露
        - from: gap
          to: rec
          label: 挡住确信度
        - from: risk
          to: rec
          label: 抬高下行严重性
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV039
      - CV040
      - CV052
      - CV053
      - CV054
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 敏感性条形图展示：用公开 $7B-$10B 收入区间，以及审慎和接近峰值的销售额倍数做简单筛选时，Fanatics 股权价值如何变化。
    approximationNotes: 条形图是基于公开收入锚点的简化销售额倍数筛选，不是企业价值模型，也未按稀释调整。
    data:
      items:
        - label: 1.5x × $7B（悲观）
          value: 10500
        - label: 2.5x × $8B（审慎筛选）
          value: 20000
        - label: 3.0x × $8.5B（基准）
          value: 25500
        - label: 3.9x × $8B（2022 峰值视角）
          value: 31000
        - label: 4.4x × $7B（Sacra 锚点上的峰值）
          value: 31000
        - label: 4.5x × $10B（乐观）
          value: 45000
    claimRefs:
      - CV039
      - CV040
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 区间图展示从下行重置到可选性成功兑现的合理估值带。除非新披露补上关键缺口，估值重心仍低于外界广泛引用的 $31B 峰值。
    approximationNotes: 这些区间是围绕乐观、基准和悲观情景给出的编辑部估值带；未嵌入 DCF、杠杆或优先清算瀑布。
    data:
      items:
        - label: 悲观区间——披露和法律阴影主导
          low: 10000
          high: 15000
          unit: $M
        - label: 基准区间——平台已成规模，但仍不透明
          low: 20000
          high: 31000
          unit: $M
        - label: 乐观区间——可选性兑现，披露改善
          low: 31000
          high: 45000
          unit: $M
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
      - CV058
      - CV059
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的 1-5 分记分卡，覆盖主要估值驱动因素。Fanatics 在规模和可选性上得分较好，在披露质量和估值支撑上偏弱，整体落在继续研究区间。
    approximationNotes: 评分是仅基于运行日公开证据的编辑部评估。
    data:
      items:
        - label: 市场 / 品类可选性
          value: 4
          unit: /5
          note: 博彩、周边商品和交易卡相邻市场都很大。
        - label: 收入规模证据
          value: 4
          unit: /5
          note: 公开锚点集中在 $7B 至 $8B 收入附近。
        - label: 平台多元化
          value: 4
          unit: /5
          note: 电商、收藏品、博彩、活动和忠诚度都有公开触点。
        - label: 披露质量
          value: 1
          unit: /5
          note: 没有公开 S-1、S-1/A、424B 或 S-4，也没有当前优先股堆叠。
        - label: 法律 / 运营清洁度
          value: 2
          unit: /5
          note: 法院、劳工和客户摩擦信号抬高下行严重性。
        - label: 估值支撑
          value: 2
          unit: /5
          note: 在缺少审计支撑的情况下，私募峰值价格高于多数上市可比公司。
    claimRefs:
      - CV002
      - CV009
      - CV018
      - CV020
      - CV022
      - CV023
      - CV024
      - CV025
      - CV050
      - CV052
      - CV057
