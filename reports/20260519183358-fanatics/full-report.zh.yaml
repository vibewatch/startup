  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与隐私风险堆栈
        blocks:
          - type: paragraph
            body: >-
              Fanatics 如今背负的法律和监管画像，比一家简单授权周边公司复杂得多。法院记录是最清楚的反向信号：CourtListener 审阅搜索显示 Fanatics 诉讼版图正在变厚，并明确露出 2025–2026
              年围绕收藏品的一组新案件；Jones 案卷则确认，该争议已经进入活跃动议阶段，驳回和仲裁争执都在推进。这一点重要，因为被告不只是 Fanatics 实体，还包括联盟、球员工会和
              OneTeam；任何持久争议都可能外溢到支撑商务和收藏品的权利网络。


              体育投注扩张增加第二层暴露。PASPA 失效创造了机会，但已审阅的 AGA、RG.org、Census 和 Pennsylvania 条款材料都指向同一个运营现实：Fanatics
              只能在州允许、当地牌照保持有效，且地理定位、年龄门槛、身份验证和运营商行为都守住监管边界的地方参与。隐私堆栈也很关键。公开体育投注政策称精确地理位置属于敏感数据，预期会与监管机构和联盟共享数据，并提供依赖特定网站
              cookie 的退出机制。Fanatics ONE 又把这个触点向外延伸，明确用奖励和 FanCash 相关激励交换个人数据和伙伴共享。因此，综合法律风险不只是“诉讼”；而是 IP
              与消费者诉讼、州博彩合规、隐私义务和忠诚度计划审查叠加起来的组合。
