      - number: '7.2'
        title: 运营、客户、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Fanatics 的运营风险不是纸面问题。SmartCustomer
              评论库里的直接客户证据反复指向几类摩擦：发货不准时、商品破损或发错、折扣争议，以及退货价值被导入礼品卡或账户额度，而不是直接退款。公司显然知道客服是关键触点——帮助中心把订单追踪、取消和退款放在核心位置——但反向评论信号说明，客服工具还没有在规模化运营中完全消化执行问题。这一点重要，因为电商仍是进入
              Fanatics 更大生态的流量入口；服务失败反复出现，伤害的不只是单笔订单，还可能压低用户向更高毛利品类转化的概率。


              体育博彩业务的安全和运营控制又压上一层执行负担。公开条款写明，用户只能有一个账户，资金隔离存放；提款或退款即便通过检查，也可能最多再等五个工作日。负责任披露计划是真正的缓释项——它给研究人员留了通道——但条款也写得很窄，禁止大范围测试，且不代表第三方发声。依赖项上，Fanatics
              现有体育博彩平台规模离不开 PointsBet 收购；那笔交易转过来的不只是市场准入，还包括实体、平台权利、Banach 技术、员工和办公基础设施。收藏品侧也因为 Topps 有 100
              多个国家的足迹而更复杂。实际含义是，Fanatics 现在同时运营几块高度依赖整合的业务，客户信任、技术可靠性和伙伴连续性绑得很紧。
