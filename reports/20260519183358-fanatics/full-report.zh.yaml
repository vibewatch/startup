        - 单卡评级、会员费、金库保管及相关购后服务
        - 未经认证的原卡点对点交易
        - 重度收藏者、经销商和转售者付费；终端用户可与买方不同
        - 说明收藏品变现不止于初次售卡
      - - 二级市场和拍卖
        - 高端收藏品的转售、拍卖和价值兑现流程
        - 未追踪的非正式交换和私人销售
