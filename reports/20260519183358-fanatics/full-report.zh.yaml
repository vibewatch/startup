      - number: '3.2'
        title: 能力宽度帮 Fanatics 加分，但专家玩家赢在专注和定价清晰度
        blocks:
          - type: paragraph
            body: >-
              Fanatics 最大的差异化，仍是同一家公司可以用同一套身份和奖励逻辑，把一个球迷从官方周边带到收藏品，再带到投注。投资者页面明确框定这种一体化生态，体育投注页面则显示 FanCash
              已经延伸进下注。但审阅过的竞品页面也说明，宽度本身不是一击致胜。DICK'S 依靠丰富选品、门店自提、当日送达和明确的奖励促销竞争。DraftKings
              把自己定位为高评分体育投注平台，并已披露的体育投注收入远高于 Fanatics Betting 公开过的任何数字。Flutter 规模更大，投资者材料呈现的是全球受监管投注组合，而不是狭窄的美国上线故事。


              收藏品更能说明问题。PSA 不必赢下一级发行，也能赢下信任层。它的首页和 Collectors Club 页面展示了围绕鉴定、评级、订阅和单卡费用建立的直接变现模型；Collectors 的新闻流则记录了
              eBay、Goldin 和 PSA 如何被组装成更紧密的端到端爱好者工作流。这给收藏者提供了一个可信替代选择，不必留在 Fanatics 自有轨道内。章节中的定价证据也不均衡：Fanatics
              Sportsbook 和 DICK'S 在抓取页面上给出了可执行优惠，PSA
              公布了明确的会员和评级价格，但许多竞品费率堆栈在审阅页面上仍是动态、按州变化或未披露的。这种稳定可比定价缺失本身就是竞争事实，因为它让公开比较更难，也迫使尽调从标题促销转向实际经济性。
