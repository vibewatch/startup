  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型：商务主导的飞轮，外接收藏品、投注和现场变现
        blocks:
          - type: paragraph
            body: >-
              最清楚的财务结论是，Fanatics 的起点仍是一个非常大的商务底座，不是纯软件或媒体模型。Sacra 称，约 80%
              收入仍来自为电商店铺提供动力和批发服饰；投资者和公司材料则显示，管理层正在这个核心之上叠加新的变现层：收藏品、体育投注和赌场、FanCash 忠诚度、现场商务。GlobalData
              进一步证明这是一套多产品运营模型，而不是单一店铺零售商，因为它在同一家公司资料中列出实体和数字球星卡、纪念品、线上体育投注、iGaming、商品销售支持、履约、制造和授权服务。简单说，Fanatics
              似乎先通过授权商务变现球迷注意力，再把注意力导向相邻、潜在利润率更高的触点。


              新层重要，是因为即便传统周边业务利润率低于市场平台或软件公司，它们也会改变 Fanatics 复合提升单个球迷收入的方式。Topps 收购带来一个覆盖 100 多个国家的全球收藏品版图；Fanatics
              Collect 和 Fanatics Live 则展示出更循环的模型，卡片可以购买、竞拍、直播拆盒、托管、重新上架，或卖回换即时抵扣。体育投注触点把同样模式延伸到投注，包含 Bonus Bets、最高 10%
              风格的 FanCash 优惠和基于赔率的奖励。Fanatics ONE 再用等级积分和忠诚度激励把这些体验连起来。这些并不能证明实际利润率质量，但能证明官方定价和激励机制已经不止球衣加价。财务问题因此不是
              Fanatics 是否有多条收入流——显然有——而是混合业务里有多少仍像重库存商务，有多少更像高价值参与型产品。
