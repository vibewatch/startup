  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 三条相邻赛道的市场边界与规模测算
        blocks:
          - type: paragraph
            body: >-
              Fanatics
              并不处在一个干净单一的品类里。证据指向三个相邻变现池：授权体育周边、球星卡与收藏品、受监管体育博彩。它们共享同一批体育迷，但运行方式不同。周边商品报告定义了最宽的实物商品层，通常包括带有官方体育标识的服饰、鞋履、配件、玩具、游戏和收藏品。球星卡报告则捕捉到一个增长更快但更窄的收藏品层，其经济性不止一次销售，还延伸到评级、鉴定和转售。投注又增加第三层，有自己的监管者、逐州铺开节奏和消费者钱包动态。把这一切都当成一个单体总可用市场（TAM），会夸大精确度，也掩盖重要运营约束。


              方向上，规模证据很强，但方法上噪音很大。Mordor Intelligence 预计授权体育周边市场将在 2026 年达到 $44.99B、2031 年达到 $59.59B；Data Bridge 则从更低的
              2024 年 $37.03B 基数出发，到 2032 年达到 $55.42B。球星卡方面，Mordor 预计市场从 2026 年 $15.11B 增至 2031 年 $24.36B；Strategic
              Market Research 将更宽的集换卡牌市场列为 2024 年 $15.8B、2030 年 $23.5B。体育投注方面，RG.org 报告 2025 年美国受监管体育投注平台的下注额为
              $165.58B、总博彩收入为 $16.80B；AGA 报告 2025 年美国所有博彩品类总博彩收入为 $125B。因此，正确的尽调读法应该是分层，而不是单一：Fanatics
              的平台叙事建立在参与多个大市场之上，但这些市场的定义、增速和地理边界不能互换。
