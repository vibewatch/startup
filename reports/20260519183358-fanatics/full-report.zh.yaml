      - - 受监管的美国体育博彩 / iGaming
        - 线上和零售体育博彩收入、州税基及相关合法博彩支出
        - 非法 / 离岸下注；不受州监管的预测合约；非博彩娱乐
        - 个人下注者既是用户也是付款方；州政府卡住供给
        - 这是挂在 Fanatics Sportsbook 上的受监管互动层
      - - 权利和授权层
