      - number: '8.3'
        title: 退出准备度、下行触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              不按旧峰值估值承销 Fanatics，最清晰的理由不是需求证明不足，而是缺少披露级证明。SEC 搜索集仍没有 Fanatics 的 S-1、S-1/A、424B 或
              S-4；这意味着公开读者仍看不到经审计的分部收入、毛利率、已确认博彩经济账、当前优先股堆叠，或通常用于判断晚期估值的任何退出机制。公开 eBay
              文件把缺口衬得很清楚：交易平台可比公司可以通过年报和委托书核验，Fanatics 仍做不到。


              下行也更像运营问题，而不是单纯给表格打折。CourtListener 已经显示 Fanatics 相关事项的案卷很厚，包括收藏品案件；客户评论聚合和 NLRB
              搜索结果则暗示消费者与劳工摩擦，这些问题可能与估值倍数压缩叠加，而不是彼此抵消。上述问题不否定上行案例，但会改变尽调顺序。真正进入投资流程时，第一批问题应是：当前估值是多少，新资金前面还有什么优先权，分部级利润率长什么样，以及博彩和收藏品扩张有多少是真正耐久，而不只是叙事丰富。在这些问题回答之前，最可辩护的姿态是继续研究，并设置明确硬性止损触发器，而不是凭信念买入。
