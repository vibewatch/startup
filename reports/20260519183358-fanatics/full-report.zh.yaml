      - number: '2.2'
        title: 各垂直领域的买方、付款方与采用路径不同
        blocks:
          - type: paragraph
            body: >-
              Fanatics
              各条垂直线的买方和预算逻辑差异很大。授权周边里，终端买方是体育迷，购买金额相对小、由赛事和时点驱动，属于可选消费；供给侧则由联盟、球队和球员工会控制，它们首先决定什么能被销售。收藏品里，Topps NOW
              定价显示一个低客单价冲动消费层，但 PSA 的会员和评级经济显示第二层更专业：收藏者、拆盒主播、经销商和转售者会支付周期性费用和单卡处理费，用来鉴定、评级并变现库存。Topps 自己的收购公告也强调，这不只是
              DTC 爱好者生意：品牌服务 100 多个国家和 10 个运营国家的收藏者、球迷和零售商。


              投注的采购模型完全不同。付款方是个人投注者，不是企业预算负责人；关键摩擦也不是单纯批发授权，而是开户、监管、钱包纪律和留存。BetFanatics 的 Responsible Gaming
              页面明确把下注定义为娱乐，要求设定固定预算，并不鼓励过度下注；即便客户是同一个球迷，这在经济性上也不同于购买周边或收藏品。因此，采用路径是多边的：权利方把住供给，Fanatics
              借商务转化球迷，收藏品靠发行叠加评级和转售把热情变现，投注只有在州准入和负责任博彩合规允许时才能变现参与度。也正因为这种分层，Fanatics 的市场分析需要买方、用户和付款方地图，而不是一条混合需求曲线。
