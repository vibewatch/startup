chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与平台结构
        blocks:
          - type: paragraph
            body: >-
              Fanatics
              早已远离最初的线上球衣卖家身份。公司和投资者关系页面如今把这门生意包装成一个一体化体育平台，围绕六个相连业务搭建：商务、收藏品、体育投注与游戏、现场活动、工作室和市场。这个表述重要，因为它解释了为什么公司公布的规模指标远大于一家纯服饰零售商：可触达
              1 亿多球迷，覆盖 900 多个体育资产，拥有 6,000 多个运动员和名人关系，以及 2,000 多个零售点，包括 Lids 门店底座。NFL、MLB、NBA 和 NHL 的联盟专属店铺仍通过 Fanatics
              运营模式承接，所以老的商务引擎仍是生态入口。当前战略并不只是多卖周边；而是在多个消费和参与节点上拥有球迷关系，再把需求回流到收藏品、投注和体验。


              总部证据也反映出公司的混合身份。第三方资料把正式地址放在 New York City 的 95 Morton Street，历史运营中心和品牌根基则仍在 Jacksonville。这种分裂符合 Fanatics
              的演化路径：从 Florida 起家的体育周边商，变成一家带有金融、媒体和投注野心的大型控股公司。员工数也呈现同样模式：公司和投资者页面写 22,000+，较早的消费者 about 页面仍写
              8,000+，说明新业务和扩张后的分销资产正在平台层面被纳入统计。尽调上应抓住的结论是：Fanatics 规模很大，但它自己公开页面对当前员工边界并没有完全统一。
