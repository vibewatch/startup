      - number: '3.3'
        title: 护城河能否持久，取决于伙伴准入和交叉销售，不取决于替代品是否缺席
        blocks:
          - type: paragraph
            body: >-
              Fanatics 护城河最强的证据仍是分销和身份。900 多个体育资产、2,000 多个零售点（包括 Lids），以及官方 NFL、MLB、NBA 和 NHL 店铺持续存在，都说明 Fanatics
              离权利方很近，并控制着有特权的商务触点。如果公司能持续把这些流量转成忠诚度、收藏品和投注行为，平台宽度仍然很难复制。这就是一体化球迷论的最佳情景。


              反向情景是，这条护城河是合同性的，因此可以被拆碎。Sacra 认为 Fanatics 约 80% 收入仍来自商务和批发服饰，也认为联盟已经开始把分销重新开放给 Amazon 等渠道。如果判断成立，Fanatics
              的核心利润引擎恰好暴露在公开专家最透明、多归属最容易的地方。一个球迷可以在官方联盟店买球衣，在 Lids 买帽子，在 FansEdge 买复古装备，通过 PSA 和 eBay 上架评级卡，再用
              DraftKings 或 Flutter 下注，全程不进入任何一个 Fanatics 一体化闭环。上市竞品还会提交最新 10-K 或同等材料，使其运营节奏比 Fanatics
              的私营控股公司叙事更容易做基准。核心尽调问题因此不是替代品是否存在——它们显然存在——而是当促销强度和渠道碎片化上升后，Fanatics 能否维持比这些替代品更优的权利准入和交叉销售经济性。
