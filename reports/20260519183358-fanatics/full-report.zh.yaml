  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入达到约 $10B，收藏品和博彩放量，市场愿为已经验证的多线可选性支付约 4.5x 销售倍数。
        - 隐含价值约 $45B，稀释前约为旧 $31B 峰值的 1.45x。
        - 需要干净的法律态势、更充分披露，以及好于公开材料所示的组合质量。
        - 20%
      - - 基准
        - 收入落在接近 $8.5B，市场为规模化但仍不透明的私有平台支付约 3.0x 销售倍数。
        - 隐含价值约 $25.5B，更接近早前 $27B 轮次，而非后来的 $31B 峰值。
        - 良好执行仍可能跑不赢披露折价和组合担忧。
        - 55%
      - - 悲观
        - 收入维持在接近 $7B，诉讼和较低质量经济性主导叙事，市场只支付约 1.5x 销售倍数。
        - 隐含价值约 $10.5B，意味着较 2022 年峰值标记有严重下行。
        - 倍数压缩与法律、劳工和客户服务摩擦叠加。
        - 25%
    notes: 情景价值是分析师估算，锚定公开 $7B-$8B 收入区间、上市可比公司和明确的下行传导因素；不是 DCF。
