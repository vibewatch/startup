  - id: TV005
    title: 投资逻辑破裂与硬性停止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量破裂
        - 最新尽调显示收入显著低于公开 $7B-$8B 锚点
        - 同时削弱历史倍数和基准情景。
        - 把估值重切到悲观区间，并停止任何无视价格的热情。
      - - 优先股堆叠意外
        - 新融资条款显示新资金前面有沉重清算优先权或反稀释棘轮保护
        - 即使企业价值守住，普通股上行也会缩水。
        - 没有修订后的股权结构表模型，不投资。
      - - 诉讼加速
        - 收藏品或消费者案件扩大为重大现金成本或运营约束
        - 增加上市可比筛选捕捉不到的下行。
        - 把案例推向悲观情景，并要求法律准备金分析。
      - - 博彩经济性不及预期
        - 尽管已有州级足迹，体育投注业务贡献仍结构性依赖补贴
        - 削弱峰值倍数中嵌入的可选性溢价。
        - 把博彩视为叙事拖累，而不是上行加成。
      - - 下一次估值标记仍缺披露
        - 新一轮到来，却没有经审计分部或当前利润率明细
        - 让任何新估值更难而不是更容易承销。
        - 即便名义价格上行，也维持继续研究姿态。
    notes: 触发因素设计为可监控项，并直接映射回估值纪律，而不是泛泛的公司质量担忧。
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV058
      - CV059
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前估值
        - 来自 2025-2026 年的新股、老股或董事会标记估值
        - 陈旧的 2022 年峰值标记不足以给新资金定价。
        - 获取管理层材料、董事会材料或领投方确认。
      - - 股权结构表 / 优先权
        - 清算优先权堆叠、反稀释棘轮、认股权证和任何优先级工具
        - 普通股和后期回报测算可能发生实质变化。
        - 在 NDA 下索取股权结构表分配瀑布和融资文件。
      - - 分部经济性
        - 电商、收藏品和博彩的收入、毛利率和贡献利润
        - 组合质量决定 Fanatics 应享受零售、市场型平台还是混合倍数。
        - 索取经审计或投行准备的分部桥接表。
      - - 法律 / 监管敞口
        - 收藏品、劳工或客户事项中的案件状态、准备金和任何和解
        - 如果现金成本上升，下行就不只是倍数问题。
        - 任何 IC 批准前，先跑律师备忘录和案卷审查。
      - - 博彩和忠诚度证据
        - 按州拆分的博彩贡献和 Fanatics ONE 转化经济性
        - 只有新业务产出可持续变现，可选性溢价才成立。
        - 要求提供最近几个季度的队列数据和按州拆分的 P&L。
    notes: 这些材料是从公开市场交叉校验走向投资级承销所需的最低包。
    claimRefs:
      - CV051
      - CV052
      - CV058
      - CV060
