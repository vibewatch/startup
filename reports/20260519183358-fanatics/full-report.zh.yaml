      - number: '4.2'
        title: 公开牵引力、单位经济代理指标与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开收入锚点足以证明规模，即使未经审计。Sacra 给出的 Fanatics 收入为 2021 年 $3.4B、2023 年 $7B；SportsPro 则报道称，管理层预计 2023 年收入约
              $8B。这些数字方向上一致，说明公司规模已远大于多数独立体育投注运营商，更接近大型上市零售或平台同行的收入体量。同行筛选在这里有用：StockAnalysis 给出的 2025 年收入分别是 DraftKings
              $6.05B、eBay $11.10B、Flutter $16.38B、DICK'S $17.22B。因此，Fanatics
              已经大到不能按一个小众收藏品或投注创业公司分析，但仍太不透明，不能像一个披露完整的上市平台那样分析。


              公开单位经济证据更薄。Sacra 所称约 $19 的获客成本（CAC）和 >100M 球迷既有基础，暗示 Fanatics
              可以在自有渠道内低成本获客或重新激活用户；这在战略上重要，因为当获客从既有球迷流量开始时，Bonus Bets、FanCash
              和直播电商抵扣更容易被融资。但同一份公开记录也说明为什么承销仍不完整：公司不披露分业务线毛利率、已确认的体育投注促销费用、库存周转、退货准备金，或直播电商和收藏品贡献利润率。资本充足性方向上也为正，但仍不完整。MarketScreener
              与 SportsPro 合在一起显示，公司先以 $27B 估值融资 $1.5B，后又以 $31B 估值融资约 $700M；SportsPro 还称 Fanatics 预计 2022 年底现金超过 $2B。这意味着
              2022–2023 年扩张靠的是强势融资，不是困境融资。缺失的问题是：这些资本投向
              Topps、PointsBet、直播电商和更宽生态建设后，后续发生了什么。公开读者仍看不到当前烧钱速度、现金跑道、债务或租赁能见度。
