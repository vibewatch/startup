  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品触点与用户任务
        blocks:
          - type: paragraph
            body: >-
              Fanatics 卖的不是单一应用，更像一组协调好的球迷工作流。投资者关系页面如今把商务、收藏品、体育投注与游戏、Fanatics
              Fest、市场和工作室归入同一个平台；伙伴店铺和品牌页面则显示，这些触点在不同意图节点上服务不同买方任务。商务店铺覆盖官方球队装备和广泛授权选品；Topps NOW 处理低客单价、时点驱动的发售；Fanatics
              Collect 承接更高决策成本的拍卖和托管；Fanatics Live 增加创作者驱动的发现和拆盒；Sportsbook 增加受监管下注和赌场玩法；Fanatics Fest
              则把忠诚度和高端线下体验带入同一漏斗。因此，产品逻辑不是围绕一个消费者 UI，而是在购物、收藏、投注或线下参与这些最自然的时刻捕捉球迷注意力，再用 FanCash
              和账户身份把触点连起来。尽调上重要的是，这些不是孤立邻接。MLB Shop 和 NBA Store 在联盟店购物流里露出 Topps 产品，Fanatics Live 可以把卡片直接转入
              Collect，Fanatics Fest 则把账户身份和奖励压进现场活动购买旅程。这个交叉销售设计说明，Fanatics
              正在用产品宽度降低重新获客成本，把普通体育迷转成复购收藏者、投注者或活动参与者，同时不要求用户每次都学习一个完全独立的品牌。
