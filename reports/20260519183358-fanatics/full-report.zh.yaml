      - number: '8.2'
        title: 可比公司筛选与情景测算
        blocks:
          - type: paragraph
            body: >-
              公开可比公司集合并不完美，但仍然有用。DICK'S 提供体育零售锚点，DraftKings 和 Flutter 提供体育博彩参照，Sportradar 提供体育数据与博彩基础设施参照，eBay
              则是最接近交易平台式倍数的基准。按这个镜头看，Fanatics 历史上 3.9x 到 4.4x 销售额的估值高于 DICK'S、Flutter、DraftKings 和 Sportradar，大致只有 eBay
              更高的交易平台倍数能对上。可比公司的启示并不是 Fanatics 在 2022 年显然被高估；而是市场用 eBay
              式价格买入了一家公司，但它仍有更多私企信息不透明、业务组合更杂，且包含低毛利电商、较新的博彩敞口和对诉讼敏感的收藏品运营。


              因此，情景测算比点估值更重要。用严格的 2.5x 收入倍数套在 $8 billion 公开收入锚点上，价值约为 $20 billion，明显低于广泛引用的 $31 billion 峰值。合理基准情景是收入
              $8.5 billion、倍数 3.0x，对应约 $25.5 billion；如果披露缺口和下行信号开始主导叙事，悲观情景下收入 $7 billion、倍数 1.5x，价值会降到约 $10.5
              billion。乐观情景只有在 Fanatics 能证明平台可选性能转化为更高质量经济账时才有吸引力：约 $10 billion 收入、4.5x 倍数可以支撑约 $45 billion。按乐观 / 基准 / 悲观
              20/55/25 加权，概率加权结果约为 $25.7 billion，方向上更接近早前 $27 billion 一轮，而不是后来的 $31 billion 峰值。
