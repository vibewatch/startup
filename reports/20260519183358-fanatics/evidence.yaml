evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance transparency and incomplete stakeholder map
    missingEvidence: >-
      Current board composition, committee structure, any independent director roster, and a fully reconciled
      investor-rights map.
    whyItMatters: >-
      A platform of this scale has multiple regulated and litigated businesses, so governance quality and
      investor-rights clarity affect risk control, exit readiness, and the usefulness of TO003.
    diligencePath: >-
      Request current board materials, observer rights, shareholder agreement summary, and the latest cap-table rights
      matrix.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation reset detail
    missingEvidence: >-
      Direct documentation for the reported 2024–2025 tender process, any secondary-clearing price, and resulting
      share-count implications.
    whyItMatters: >-
      Entry valuation discipline depends on whether the reset was isolated employee liquidity or a broader repricing of
      the cap table.
    diligencePath: Obtain board consents, tender terms, and cap-table snapshots covering the most recent secondary transactions.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Debt balances, covenant package, and liquidation preference stack across major private rounds.
    whyItMatters: >-
      Without debt and preference detail it is difficult to assess downside protection, IPO readiness, or M&A
      flexibility.
    diligencePath: Request the latest balance sheet, debt schedule, and preferred stock rights summary.
    relatedQuestionRefs:
      - QO016
  - type: conflicting-data
    severity: minor
    topic: employee count
    missingEvidence: A single authoritative employee count reconciled across Fanatics corporate, investor, and consumer sites.
    whyItMatters: Headcount is a core cover metric and an indirect indicator of operating leverage across Fanatics’ divisions.
    diligencePath: Ask management to reconcile total employees by division, geography, and whether retail-store labor is included.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: disclosure readiness and incomplete milestone chronology
    missingEvidence: >-
      A formal IPO readiness timeline or internal documentation showing whether an S-1 process has been started but not
      filed, plus a management-approved chronology that fills any missing financing, regulatory, and governance
      milestones.
    whyItMatters: >-
      Exit timing and disclosure burden are central to the return case for a very large late-stage private company, and
      TO004 is intentionally partial until management validates the full milestone sequence.
    diligencePath: >-
      Request IPO-preparation workstreams, auditor status, capital-markets timeline assumptions, and an internal
      milestone chronology used by finance or corporate development.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: fanatics-platform-sam
    missingEvidence: >-
      No independent public source isolates a Fanatics-specific serviceable available market that cleanly splits
      merchandise, collectibles, and betting into one bottom-up model.
    whyItMatters: >-
      Without a bottom-up SAM, the market case can demonstrate adjacency and scale but cannot prove what revenue ceiling
      is realistically serviceable by the current operating footprint.
    diligencePath: >-
      Request management's internal TAM/SAM framework by vertical, geography, and rights package, then reconcile it to
      public market reports and actual state access.
    relatedQuestionRefs:
      - QM023
      - QM026
    relatedTableRefs:
      - TM002
      - TM004
  - type: conflicting-data
    severity: minor
    topic: merchandise-market-definition-variance
    missingEvidence: >-
      Public licensed-merchandise reports use different start years, included categories, and geographic baselines,
      which prevents one canonical headline number.
    whyItMatters: >-
      Using a single market estimate without preserving that variance would overstate precision and distort valuation
      framing for the core commerce business.
    diligencePath: >-
      Normalize all third-party merchandise reports to one year and one included-spend definition, or build an internal
      bottoms-up merchandise model from rights, category, and geography splits.
    relatedQuestionRefs:
      - QM022
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-conversion
    missingEvidence: >-
      No public evidence discloses Fanatics' actual conversion rates from merchandise buyers into Topps customers,
      graders, or sportsbook users.
    whyItMatters: >-
      The platform valuation relies on cross-sell economics; without actual conversion and retention data, the market
      thesis remains plausible but unproven.
    diligencePath: >-
      Request cohort analysis showing commerce-to-collectibles and commerce-to-betting conversion, repeat frequency, and
      gross-margin contribution by migrated user.
    relatedQuestionRefs:
      - QM019
      - QM024
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: addressable-online-bettor-denominator
    missingEvidence: >-
      Fanatics discloses access to 95% of the addressable online sports bettor market, but the public materials do not
      reveal the exact denominator or methodology behind that figure.
    whyItMatters: >-
      The size of the betting opportunity is sensitive to whether the denominator is based on adult population, wagering
      handle, active bettors, or legal-state availability.
    diligencePath: >-
      Ask management to define the addressable-online-bettor denominator and reconcile it to state-by-state revenue and
      population data.
    relatedQuestionRefs:
      - QM023
      - QM026
    relatedTableRefs:
      - TM002
