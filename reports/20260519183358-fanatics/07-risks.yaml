- id: financial-model-and-kill-criteria
  title: Financial model, valuation sensitivity, and kill criteria
  body: 'The financial risk is less about imminent insolvency than about underwriting quality. The 2022 financing narrative was ambitious: SportsPro reported a $31 billion valuation, more M&A capacity, roughly $8 billion of projected revenue, and more than $2 billion of expected cash. But later public coverage cited by DMR points to a lower $25 billion valuation in 2024, which means the public mark already moved down before any broad disclosure upgrade arrived. At the same time, current public comps remain demanding for a company with Fanatics'' mix. DraftKings screens around 2.0x sales, Flutter around 1.0x, and eBay around 4.4x, while Fanatics still asks investors to believe that commerce, collectibles, betting, and loyalty can coexist with marketplace-like upside.


    That creates two linked model risks. First, incentive economics remain opaque. Public FanCash materials promise up to 10% rewards across shopping, betting, and play, tie earn rates to bet odds, and let the company change or terminate the program at will; yet there is no public reserve, payback, or contribution-margin disclosure showing what this costs in practice. Second, litigation, privacy, and customer-service problems can transmit into valuation faster than raw top-line growth would suggest because they hit trust, retention, and regulatory tolerance at once. The investable posture is therefore conditional: if litigation broadens, if loyalty economics look uneconomic, or if the next private mark lands far below the last public range, the thesis should be treated as broken rather than merely delayed.'
