  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: labor-regulatory-visibility
    missingEvidence: Case-level labor disputes, facility complaints, or NLRB matter summaries tied directly to Fanatics operating entities are not visible from the reviewed public NLRB fetch output.
    whyItMatters: If warehouses, concessions, or betting operations have a larger hidden labor dispute load, current execution-risk scoring is understated.
    diligencePath: Request a legal-matter schedule listing labor, wage, safety, and NLRB-related matters by entity and facility.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
  - type: conflicting-data
    severity: material
    topic: ftc-enforcement-visibility
    missingEvidence: The reviewed FTC cases page did not surface Fanatics-specific case text, but that does not rule out inquiries, closed matters, or non-obvious captioning under affiliates.
    whyItMatters: Consumer-protection or competition exposure could materially change the legal-risk score, especially where loyalty, privacy, or promotion design is involved.
    diligencePath: Obtain outside-counsel confirmation of any FTC inquiries, CID activity, closed matters, or competition reviews involving Fanatics or affiliates.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: promo-liability-and-reserves
    missingEvidence: No public disclosure shows FanCash reserve accounting, bonus-bet liability, promo payback, or sportsbook contribution margin by state.
    whyItMatters: Reward-heavy acquisition can look attractive in growth terms while still destroying unit economics or creating reserve overhang that public pages do not show.
    diligencePath: Request monthly promo expense, FanCash accruals, redemption rates, breakage, and state-level gross-win to contribution-margin bridges.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: litigation-outcome-timing
    missingEvidence: Publicly reviewed sources show filings and motions, but not enough accessible merits-stage rulings to estimate likely damages, settlement range, or dismissal probability across the full case cluster.
    whyItMatters: The difference between early dismissal and merits-stage class certification is large enough to move valuation, reserve assumptions, and partner-relationship risk.
    diligencePath: Monitor Jones and related dockets weekly; obtain litigation counsel memo on dismissal, arbitration, and class-certification probabilities.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR006
