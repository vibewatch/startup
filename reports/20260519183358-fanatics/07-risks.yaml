    - Cross-property identity and partner sharing increase enforcement and complaint risk
    - Review internal data map, sensitive-data retention rules, and state privacy complaint volumes
  - - Fanatics ONE financial-incentive and loyalty disclosures
    - Consumer / privacy / loyalty programs
    - Public notice says benefits are exchanged for personal data and may involve partner sharing or sale concepts
    - Medium
    - High
