summary:
  headline: >-
    Fanatics is a real, scaled sports platform with credible diversification optionality and public
    revenue anchors around $7B to $8B, but stale valuation marks, opaque segment economics, and
    cap-table uncertainty keep the investability call at research-more rather than buy.
