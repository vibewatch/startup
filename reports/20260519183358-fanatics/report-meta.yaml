companyProfile:
  summary: >-
    Fanatics grew out of Football Fanatics, founded in Jacksonville in 1995, and was later built
    into the current platform by Michael Rubin after the sports e-commerce assets were repurchased
    from eBay in 2011. Today the company presents itself as a six-business ecosystem spanning
    Commerce, Collectibles, Betting & Gaming, Fanatics Fest, Fanatics Markets, and Fanatics
    Studios, with more than 100 million fans, more than 900 sports properties, and more than 2,000
    retail locations across its footprint. Public evidence indicates that the commerce and wholesale
    base still supplies most revenue, while Topps, sportsbook, loyalty, and live-event layers carry
    the diversification narrative.
  foundingLocation: Jacksonville, FL, USA
  headquarters: New York, NY, USA
  productSummary: >-
    Fanatics sells licensed sports apparel and merchandise, operates league and team storefronts,
    owns Topps trading cards and related collectibles surfaces, runs Fanatics Sportsbook and Casino,
    ties experiences together with FanCash and Fanatics ONE loyalty, and monetizes fan engagement
    through events such as Fanatics Fest and adjacent marketplace/media properties.
  customerFocus: >-
    Sports fans, licensed-merchandise shoppers, collectors, bettors, and live-event attendees,
    plus leagues, teams, rights holders, and retail partners that use Fanatics commerce and
    distribution infrastructure.
  businessModel: >-
    Multi-surface sports platform with a large commerce-and-wholesale revenue core, augmented by
    collectibles sales and services, sportsbook and casino monetization, loyalty-driven repeat
    engagement, live-event economics, and marketplace-style optionality around fan identity.
  stage: Private
  fundingStatus: >-
    Public financing anchors show a $1.5B March 2022 round at a $27B post-money valuation, a later
    roughly $700M financing at a $31B valuation, and a subsequently reported 2024 reset near $25B.
    Public sources still do not disclose current cap-table preferences, current mark, or audited
    segment profitability.
