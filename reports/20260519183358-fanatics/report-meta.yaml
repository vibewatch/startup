subtitle: Scaled Sports Platform — Real Optionality, Thin Disclosure, Stretched Public Valuation Anchors
coverageNotes: >-
  Fanatics remains a private company without audited public financial statements, segment reporting,
  or a current disclosed cap table. Revenue, valuation, and total-capital figures in this report are
  drawn from a mix of company claims, press coverage, and analyst research notes. The strongest
  public anchors are the 2022 $27B and $31B private rounds, a reported 2024 reset near $25B, and
  third-party revenue markers around $7B to $8B. Gross margin, EBITDA, net debt, cohort retention,
  and preference-stack details remain undisclosed.
