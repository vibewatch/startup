    - Integrated and active
    - Topps acquisition added global operations; NOW drops show real-time licensed release cadence
    - No public print-run economics or return-rate disclosure
  - - Fanatics Collect
    - Collectors and sellers
    - Live and active
    - Marketplace supports buy/bid/sell behavior with recurring weekly auctions
    - No public GMV, take rate, fraud-loss, or seller-quality metrics
  - - Fanatics Live
    - Breakers, creators, collectors
    - Live and active
    - Creator-run live shows plus Instant Rips and LiveOS create differentiated interactive commerce
    - No public viewer, moderation, or conversion metrics
  - - Fanatics Sportsbook & Casino
    - Bettors and casino users
    - Scaled distribution after PointsBet close
    - Banach/PointsBet technology plus FanCash rewards and broad state coverage
