- id: operating-architecture-and-dependencies
  title: Operating architecture and dependencies
  body: The public evidence points to a federated operating architecture. Fanatics keeps many branded storefronts and partner entry points live at once, while acquisitions extend capability rather than merely adding traffic. The Topps transaction brought physical and digital trading-card infrastructure, global operations, and specialized employees. The PointsBet deal added platform assets, quantitative trading models, ADW/iGaming operations, and broader distribution. Fanatics Live adds a seller-side operating system with logistics and analytics, while Instant Rips closes the loop by transferring revealed cards directly into Fanatics Collect. None of the reviewed sources proves a fully shared technical backbone across all business lines, so the best evidence-backed interpretation is that Fanatics runs a coordinated portfolio with shared identity, loyalty, and commercial orchestration where visible, but meaningful business-unit-specific dependencies still sit underneath. That makes licensing,
    catalog management, logistics, live moderation, and regulated betting controls just as important as pure software product design. The public materials also show that product maturity differs by layer. Merchandise and partner stores appear operationally mature but trust-challenged, collectibles has the richest workflow integration, live commerce has active seller liquidity but little public KPI disclosure, and sportsbook benefits from imported platform assets plus clear regulatory overlays. In other words, Fanatics' architecture looks strongest where product surfaces can be chained together in customer workflow terms and weakest where the investor must infer unseen internal systems from partner pages and launch copy.
