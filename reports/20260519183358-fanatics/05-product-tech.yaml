  evidenceGaps:
  - type: missing-source
    severity: material
    topic: internal architecture disclosure
    missingEvidence: A product/engineering architecture overview showing the shared identity, catalog, order-management, or entitlement layers across commerce, live, collect, betting, and events.
    whyItMatters: The public evidence proves many product surfaces exist, but it does not show whether Fanatics runs them on common internal services or through looser business-unit orchestration.
    diligencePath: Request an engineering architecture review with platform, commerce, collectibles, and betting leads plus sample service maps and dependency diagrams.
    relatedQuestionRefs:
    - QE015
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: collectibles trust workflow
    missingEvidence: Detailed process documentation for authentication, fraud review, vault controls, seller screening, and buyer-protection handling inside Fanatics Collect and Fanatics Live.
    whyItMatters: Instant Rips claims cards are authenticated and the support center exposes Vault/help surfaces, but the public materials do not explain the control stack well enough to underwrite shrinkage, dispute, or counterfeit risk.
    diligencePath: Ask for operating SOPs, fraud-loss history, vault procedures, and sample marketplace dispute-resolution metrics.
    relatedQuestionRefs:
    - QE020
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: live and collect adoption metrics
    missingEvidence: GMV, active buyers/sellers, watch time, take rate, repeat purchase, and vault utilization metrics for Fanatics Live and Fanatics Collect.
    whyItMatters: The surfaces are visibly live, but underwriting product maturity requires conversion, retention, and monetization evidence rather than only activity snapshots.
    diligencePath: Request KPI dashboards or board materials covering Live, Collect, Instant Rips, and Topps NOW cohorts.
    relatedQuestionRefs:
    - QE010
    - QE013
    - QE014
    relatedTableRefs:
