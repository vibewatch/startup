- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary surface
  - Scale or proof
  - Strategic value
  - Current gap
  rows:
  - - Mass-market team-gear shopper
    - Fan / fan / fan or household
    - Fanatics.com, Fanatics app, official league stores
    - 1.5M+ products in app; live official stores across major leagues
    - Core commerce demand and top-of-funnel acquisition
    - No disclosed active buyer count or repeat purchase rate
  - - App-first loyalty member
    - Fan / fan / fan
    - Fanatics app plus Fanatics ONE rewards
    - App bundles shopping, tickets, scores, and FanCash
    - Best chance to raise lifetime value across surfaces
    - No disclosed app MAU, DAU, or conversion rate
  - - Collector / hobby-shop or retailer
    - Collector, retailer / collector end-user / collector or retailer
    - Topps products and collectibles surfaces
    - Topps serves collectors, fans, and retailers in 100+ countries
    - Extends monetization beyond apparel into higher-value hobby spend
    - No disclosed post-acquisition collector count or revenue mix
  - - Sports bettor
    - Bettor / bettor / bettor
    - Fanatics Sportsbook & Casino
    - 95% addressable market reach claim plus live state footprint
    - Adds regulated wagering and higher-frequency engagement
    - State legality, 21+ rules, and responsible-gaming limits cap scale
  - - Live-event attendee
    - Fan / attendee / attendee
    - Fanatics Fest
    - Ticket purchase requires Fanatics ONE account and earns FanCash / tier points
    - Connects fandom, commerce, loyalty, and offline experiences
    - No disclosed attendance, spend per attendee, or repeat-event rate
  - - Hat and vintage-channel shopper
    - Fan / fan / fan
    - Lids and FansEdge
    - Lids emphasizes hundreds of stores; FansEdge skews toward vintage streetwear
    - Broadens reach beyond flagship storefronts and price points
    - No disclosed channel mix or economics versus core Fanatics.com
  notes: Segments are defined by customer job and channel, not by legal entity; public sources prove breadth of surfaces but not buyer counts by segment.
