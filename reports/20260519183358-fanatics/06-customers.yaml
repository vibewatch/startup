- id: adoption-and-proof
  title: Adoption trajectory and production-grade customer proof
  body: |-
    The strongest adoption evidence is directional rather than fully financial. Fanatics’ corporate materials say the company now reaches more than 100 million fans, while the 2022 Topps acquisition release referenced a database of more than 80 million sports fans globally. The shopping app advertises more than 1.5 million products, signaling a very broad consumer assortment even though it does not disclose actual active buyers. In betting, the post-PointsBet footprint is more explicit: Fanatics said the acquisition made its sportsbook available to 95% of the addressable U.S. online sports bettor market and extended operations to 19 retail locations. The sportsbook app pages reinforce that this is not a test deployment; they describe live betting across many states, casino availability in four states, fast signup, withdrawal tracking, and a large iOS ratings base.

    Named proof is strongest where the public record shows a live surface and a clear user action. The official league stores demonstrate real production merchandising. Fanatics Fest shows that live-event attendees can be converted into Fanatics ONE accounts and FanCash-earning customers. PointsBet migration language shows that Fanatics inherited and moved real sportsbook users rather than merely licensing technology. Topps gives the best proof on the collectibles side because Fanatics explicitly bought a business already serving collectors, fans, and retailers worldwide. What remains missing is the layer most investors would really want: active customer counts, repeat purchase rates, or cohort-level outcomes by segment. The chapter can therefore prove breadth, live deployment, and some adoption proxies, but not durable monetization at the segment level.
