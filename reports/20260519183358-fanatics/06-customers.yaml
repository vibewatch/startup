- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk or friction
  - Impact
  - Current evidence
  - Diligence path
  rows:
  - - FanCash and Fanatics ONE across commerce, events, and betting
    - Rewards are powerful but terms are conditional and require data-sharing participation
    - Expansion upside depends on redemption and repeat behavior actually lifting lifetime value
    - Cross-surface reward claims are visible across app, festival, and sportsbook pages
    - Request cohort lift for members versus non-members
  - - Official league-store network
    - Commerce still depends on licensed rights and partner storefront relationships
    - If rights weaken, acquisition costs and conversion quality could deteriorate
    - NFL, MLB, NBA, and NHL stores are active production channels
    - Request contract term, renewal, and revenue-share concentration data
  - - Topps collectors and retailer network
    - Collectibles expansion depends on hobby health and channel execution
    - A weaker hobby cycle or retailer concentration would limit cross-sell upside
    - Topps serves collectors, fans, and retailers globally; PSA ecosystem remains active
    - Request active collector count, top accounts, and Topps segment contribution
  - - Sportsbook rollout
    - Growth remains limited to legal states, 21+ users, and responsible-gaming guardrails
    - Addressable market can change slower than marketing suggests
    - PointsBet close expanded footprint, but state gating remains explicit
    - Request active bettors by state and promotional efficiency
  - - Customer service and returns
    - Adverse review evidence suggests friction in shipping, refunds, gift cards, and quality
    - Poor service could impair repeat purchase and brand trust
    - 1.9-star review summary and specific complaint excerpts are current
    - Request CSAT, refund timing, and complaint-resolution metrics
  - - Customer concentration disclosure
    - Public record does not quantify top-customer, top-partner, or channel mix concentration
    - Durability cannot be underwritten confidently without concentration data
    - No reviewed public source provides segment-level concentration numbers
    - Request top-10 customer or channel exposure and partner concentration by revenue
  notes: The table combines expansion logic with the frictions that could break it; several rows remain diligence-led because the public record stops at customer surface proof, not customer economics.
