  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer retention metrics
    missingEvidence: Segment-level NRR, GRR, churn, repeat purchase, and repeat wagering cohorts for commerce, collectibles, betting, and live events.
    whyItMatters: Public rewards surfaces imply repeat engagement, but without cohort data it is impossible to underwrite durability or lifetime value by segment.
    diligencePath: Request monthly cohort tables for buyers, collectors, bettors, and event attendees, including repeat rates, redemption rates, and churn by acquisition channel.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-customer, top-partner, and channel concentration percentages plus revenue share by league-store contract and top collectibles accounts.
    whyItMatters: Fanatics depends on rights-linked channels and partner storefronts, so concentration could be far higher than the customer-surface diversity suggests.
    diligencePath: Request top-10 partner and channel concentration by revenue, renewal status of core league contracts, and share of demand routed through affiliated storefronts.
    relatedQuestionRefs:
    - QU024
    - QU026
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: active customer denominators
    missingEvidence: Active customers, app MAUs, funded sportsbook accounts, and Fanatics ONE member counts by period and by segment.
    whyItMatters: Public reach claims and app ratings prove awareness, but they do not convert directly into active usage or monetized customer counts.
    diligencePath: Request monthly active users, active buyers, active bettors, and Fanatics ONE members, plus conversion from fan reach to transacting customer.
    relatedQuestionRefs:
    - QU007
    - QU008
