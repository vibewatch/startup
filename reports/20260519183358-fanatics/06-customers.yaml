  - - MLB / NBA / NHL fans via official stores
    - League-specific apparel and memorabilia storefronts
    - Production
    - Active stores selling current merchandise for each league
    - 'High: official partner storefronts'
    - Proves deployment, not retention or economics
  - - Topps collectors and retailers
    - Trading cards and collectibles distribution
    - Production
    - Topps serves collectors, fans, and retailers in 100+ countries and 10 operating countries
    - 'High: acquisition release with concrete scope'
    - Does not disclose customer count or retailer concentration
  - - PointsBet-migrated bettors
    - Online sportsbook and casino migration into Fanatics platform
    - Production
    - Company says it migrated PointsBet customers and technology over the prior year
    - 'High: official integration statement'
    - No disclosed migrated-customer count or retention
  - - Fanatics Fest attendees
    - Ticketed live event tied to loyalty account
    - Production
    - Ticket purchases require Fanatics ONE and earn FanCash plus tier points
    - 'High: current event site'
    - No disclosed attendance or repeat attendance rate
