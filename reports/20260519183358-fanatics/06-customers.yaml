company:
  name: Fanatics
chapter:
  number: 6
  title: Customers
  summary: Fanatics serves a broad but uneven customer base that spans team-gear shoppers, Topps collectors and retailers, bettors, Fanatics ONE members, and live-event attendees. Public evidence is strongest for live surface breadth — official league stores, a 1.5M-product shopping app, near-national sportsbook access, and a Fanatics Fest loyalty loop — but much weaker for retention, concentration, and segment-level economics. The result is clear proof of adoption surfaces and cross-sell intent, paired with real service-friction signals and major diligence gaps around active customer counts, repeat rates, and top-channel dependence.
sections:
- id: segments-and-entry-points
  title: Customer segments and entry points across the fan ecosystem
  body: |-
    Fanatics is best understood as a company serving multiple customer modes that all start with sports fandom but monetize it differently. The clearest segment is the traditional merchandise shopper who comes to Fanatics.com or the Fanatics app to buy officially licensed apparel, jerseys, hats, memorabilia, and seasonal drops across the major leagues and many adjacent sports. But that is no longer the whole customer picture. The app also bundles ticket purchases, live scores, and rewards; Fanatics Fest monetizes in-person attendance; Topps extends the platform into collectors, hobby shops, and international retail; and Fanatics Sportsbook addresses regulated bettors in states where wagering is legal. The customer is not just a fan buying one jersey; it is a reusable fan identity that can move among commerce, collectibles, events, and betting.

    The channel structure also matters. Fanatics still reaches customers through named partner storefronts such as NFL Shop, MLBShop, the NBA Store, and NHL Shop, which are live production commerce deployments tied to league rights rather than speculative partnerships. FansEdge and Lids add adjacent channels that tilt toward vintage streetwear, hats, and physical-store presence. Topps broadens the customer map again because its business serves collectors, fans, and retailers in more than 100 countries. Put differently, Fanatics’ customer base is segmented by product line, channel, and regulatory surface: mass-market gear shoppers, app-first loyalty members, event attendees, collectors, retailers, and bettors all sit inside the same broader platform, but they do not behave the same way or generate value on the same terms.
