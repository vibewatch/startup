- calloutType: insight
  title: This is a stitched platform market, not one neat TAM
  body: The evidence supports a large opportunity, but only by combining merchandise, collectibles, and regulated betting layers that use different buyers, regulators, and valuation logics. Any single-number TAM should be treated as a simplification, not a fact.
  claimRefs:
  - CM001
  - CM014
  - CM036
  - CM037
- calloutType: strength
  title: Collectibles and betting are the higher-growth narrative layers
  body: "Public market reports point to faster growth in trading cards and regulated betting than in licensed merchandise, which is why cross-sell into those categories matters so much for Fanatics\u2019 upside case."
  claimRefs:
  - CM005
