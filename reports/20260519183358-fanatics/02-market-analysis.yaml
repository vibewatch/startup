- id: buyers-payers-adoption
  title: Buyers, payers, and adoption paths differ by vertical
  body: |-
    The buyer and budget logic changes materially across Fanatics' verticals. In licensed merchandise, the end buyer is the sports fan making relatively small, event-driven discretionary purchases, while the supply side is controlled by leagues, teams, and players associations that determine what can be sold in the first place. In collectibles, Topps NOW pricing shows a low-ticket impulse layer, but PSA's membership and grading economics show a second, more professionalized layer where collectors, breakers, dealers, and resellers will pay recurring fees and per-card processing charges to authenticate, grade, and monetize inventory. Topps' own acquisition announcement reinforces that this is not only a DTC hobby business: the brand serves collectors, fans, and retailers across more than 100 countries and 10 operating countries.

    Betting has a different procurement model entirely. The payer is the individual bettor, not an enterprise budget owner, and the relevant frictions are onboarding, regulation, wallet discipline, and retention rather than wholesale licensing alone. BetFanatics' responsible-gaming page explicitly frames wagering as entertainment, urges fixed budgets, and discourages oversizing wagers, which is economically different from merchandise or collectible spend even when the same fan is the customer. The result is a multi-sided adoption path. Rights holders gate supply, Fanatics converts fans through commerce, collectibles monetize passion through issuance plus grading and resale, and betting monetizes engagement only where state access and responsible-gaming compliance allow it. That segmentation is why Fanatics' market analysis needs buyer, user, and payer maps instead of one blended demand curve.
  claimRefs:
