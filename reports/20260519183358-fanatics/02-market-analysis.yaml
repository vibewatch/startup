- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Streaming and real-time sports moments expand merchandise demand
    - Positive
    - Current / ongoing
    - Supports event-driven drops and global fan reach
    - How much GMV is now driven by real-time drops versus evergreen catalog?
  - - Fashion collaborations and premiumization lift average selling prices
    - Positive
    - Current / medium term
    - Merchandise can grow value faster than simple unit volume
    - What share of mix is premium / limited-edition versus commodity apparel?
  - - Adult-investor and creator demand supports card-market growth
    - Positive
    - Current / medium term
    - Collectibles may grow faster than core merch and deepen secondary monetization
    - How much demand is repeat-investor behavior versus casual fandom?
  - - PASPA repeal and state legalization unlock sportsbook growth
    - Positive
    - Since 2018
    - Betting TAM exists only because states can legalize and regulate it
    - What additional states or product types remain unavailable to Fanatics?
  - - Cross-sell from 100M+ fan audience into collectibles and betting
    - Positive
    - Current / medium term
    - Platform story supports higher valuation if conversion is real
    - What are actual cross-sell conversion rates from commerce into newer verticals?
  - - Rights fragmentation and channel reopening to Amazon / others
    - Negative
    - Current / medium term
    - Could compress merchandise moat and force more promotional economics
    - How exclusive and durable are the largest league and player contracts?
  - - State-by-state regulation and event-contract disputes
    - Negative
    - Current / ongoing
    - Betting rollout remains politically and geographically constrained
    - How exposed is Fanatics to adverse policy or slower approvals?
  - - Analyst methodology variance across merchandise, cards, and betting
    - Negative
    - Persistent
    - Creates a range, not a single precise platform TAM
    - Can management provide a bottom-up SAM split by vertical and geography?
  notes: The growth register ties each driver or constraint to valuation relevance and next-step diligence rather than treating market growth as self-explanatory.
