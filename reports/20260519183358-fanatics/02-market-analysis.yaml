  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fanatics-platform-sam
    missingEvidence: No independent public source isolates a Fanatics-specific serviceable available market that cleanly splits merchandise, collectibles, and betting into one bottom-up model.
    whyItMatters: Without a bottom-up SAM, the market case can demonstrate adjacency and scale but cannot prove what revenue ceiling is realistically serviceable by the current operating footprint.
    diligencePath: Request management's internal TAM/SAM framework by vertical, geography, and rights package, then reconcile it to public market reports and actual state access.
    relatedQuestionRefs:
    - QM023
    - QM026
    relatedTableRefs:
    - TM002
    - TM004
  - type: conflicting-data
    severity: minor
    topic: merchandise-market-definition-variance
    missingEvidence: Public licensed-merchandise reports use different start years, included categories, and geographic baselines, which prevents one canonical headline number.
    whyItMatters: Using a single market estimate without preserving that variance would overstate precision and distort valuation framing for the core commerce business.
    diligencePath: Normalize all third-party merchandise reports to one year and one included-spend definition, or build an internal bottoms-up merchandise model from rights, category, and geography splits.
    relatedQuestionRefs:
    - QM022
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-conversion
    missingEvidence: No public evidence discloses Fanatics' actual conversion rates from merchandise buyers into Topps customers, graders, or sportsbook users.
    whyItMatters: The platform valuation relies on cross-sell economics; without actual conversion and retention data, the market thesis remains plausible but unproven.
    diligencePath: Request cohort analysis showing commerce-to-collectibles and commerce-to-betting conversion, repeat frequency, and gross-margin contribution by migrated user.
    relatedQuestionRefs:
    - QM019
    - QM024
    - QM026
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: addressable-online-bettor-denominator
    missingEvidence: Fanatics discloses access to 95% of the addressable online sports bettor market, but the public materials do not reveal the exact denominator or methodology behind that figure.
    whyItMatters: The size of the betting opportunity is sensitive to whether the denominator is based on adult population, wagering handle, active bettors, or legal-state availability.
    diligencePath: Ask management to define the addressable-online-bettor denominator and reconcile it to state-by-state revenue and population data.
    relatedQuestionRefs:
    - QM023
    - QM026
    relatedTableRefs:
    - TM002
