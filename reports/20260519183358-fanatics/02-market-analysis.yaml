tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters
  rows:
  - - Licensed sports merchandise
    - Officially licensed apparel, footwear, accessories, toys, games, and fan gear
    - Generic athleisure without team IP; non-licensed third-party apparel
    - Fan as buyer and payer; leagues control supply side
    - This is the legacy commerce engine and the broadest physical-goods layer
  - - Trading cards primary issuance
    - Pack, box, and drop sales from licensed sports and entertainment card products
    - Pure non-sports tabletop games unless a source explicitly includes them
    - Collectors, fans, breakers, hobby shops, and retailers
    - Topps gives Fanatics first-party exposure to a faster-growing collectibles segment
  - - Authentication / grading services
    - Per-card grading, membership fees, vaulting, and related post-purchase services
    - Unauthenticated raw-card peer-to-peer trades
    - Serious collectors, dealers, and resellers pay; end user can differ from buyer
    - Shows that collectibles monetization extends beyond the initial card sale
  - - Secondary marketplace and auctions
    - Resale, auction, and value-realization workflows for high-end collectibles
    - Untracked informal swaps and private sales
    - Collectors and resellers
    - Important for lifetime value and premium-card economics, but hard to size precisely
  - - Regulated U.S. sports betting / iGaming
    - Online and retail sportsbook revenue, state tax base, and related legal gaming spend
    - Illegal / offshore wagering; prediction contracts outside state oversight; non-gaming entertainment
    - Individual bettor is user and payer; states gate supply
    - This is the regulated engagement layer attached to Fanatics Sportsbook
  - - Rights and licensing layer
    - League, team, and player-association rights that determine what inventory can be sold
    - Unaffiliated fan-created products or generic betting content
    - Rights holders negotiate; fans do not
    - Rights owners are upstream gatekeepers across merchandise and collectibles
  notes: Included and excluded spend are constrained to the verticals Fanatics can currently monetize directly or through owned businesses; the table intentionally separates rights control from end-customer spend.
