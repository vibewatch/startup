company:
  name: Fanatics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Fanatics should be analyzed as a stitched exposure to three adjacent markets rather than one clean TAM: global licensed sports merchandise, global trading cards and collectibles, and regulated U.S. sports betting. The evidence supports a large aggregate opportunity, but also shows that each layer grows at a different pace, is governed by different buyers and regulators, and carries different constraints. That matters for valuation because the core merch market appears mid-single-digit growth, while collectibles and betting expand faster but depend more heavily on rights, regulation, and cross-sell execution.'
sections:
- id: market-boundary-sizing
  title: Market boundary and sizing across three adjacencies
  body: |-
    Fanatics is not sitting inside a single neat category. The evidence points to three adjacent monetization pools that share the same sports fan but behave differently: licensed sports merchandise, trading cards and collectibles, and regulated sports betting. Merchandise reports define the broadest physical-goods layer and consistently include apparel, footwear, accessories, toys, games, and collectibles bearing official sports marks. Trading-card reports then capture a faster-growing but narrower collectibles layer whose economics extend beyond first sale into grading, authentication, and resale. Betting adds a third layer with its own regulators, state-by-state rollout, and consumer wallet dynamics. Treating all of that as one monolithic TAM would overstate precision and hide important operational constraints.

    The sizing evidence is directionally strong but methodologically noisy. Mordor Intelligence projects licensed sports merchandise to reach $44.99 billion in 2026 and $59.59 billion by 2031, while Data Bridge starts from a lower $37.03 billion 2024 base and reaches $55.42 billion by 2032. For trading cards, Mordor sees a move from $15.11 billion in 2026 to $24.36 billion by 2031, while Strategic Market Research puts the broader trading-cards market at $15.8 billion in 2024 and $23.5 billion by 2030. In betting, RG.org reports $165.58 billion of 2025 handle and $16.80 billion of gross gaming revenue in regulated U.S. sportsbooks, while AGA reports $125 billion of total U.S. gross gaming revenue across gaming categories in 2025. The right diligence read is therefore layered, not singular: Fanatics' platform narrative rests on participating in several large markets whose definitions, growth rates, and geographic boundaries are not interchangeable.
