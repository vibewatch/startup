company:
  name: Fanatics
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence suggests Fanatics is still fundamentally a commerce-and-wholesale revenue engine
    with higher-growth attachments in collectibles, sportsbook, live commerce, and loyalty rather
    than a clean software or marketplace story. The best supportable public top-line range is
    roughly $7B to $8B in 2023 plus historical cash support above $2B, but public disclosures still
    do not provide segment revenue, gross margin, burn, debt, or working-capital detail. That leaves
    Fanatics financially scaled and probably well capitalized, yet still under-disclosed for
    high-confidence underwriting of margin path or capital needs.
sections:
  - id: revenue-model-pricing
    title: >-
      Revenue model: commerce-led flywheel with attached collectibles, betting, and live
      monetization
    body: >-
      The clearest financial takeaway is that Fanatics still starts from a very large commerce base,
      not from a pure software or media model. Sacra says roughly 80% of revenue still comes from
      powering e-commerce storefronts and wholesaling apparel, while the investor and company
      materials show management layering newer monetization on top of that core: collectibles,
      sportsbook and casino, FanCash loyalty, and live commerce. GlobalData reinforces that this is
      a multi-product operating model rather than a single-storefront retailer because it lists
      physical and digital trading cards, memorabilia, online sports betting, iGaming, merchandising
      support, fulfillment, manufacturing, and licensing services within one company profile. Put
      simply, Fanatics appears to monetize fan attention first through licensed commerce and only
      then through adjacent, potentially higher-margin surfaces.


      The newer layers matter because they change how Fanatics can compound revenue per fan even if
      the legacy merch business remains lower margin than a marketplace or software company. The
      Topps acquisition added a global collectibles footprint with sales in more than 100 countries,
      while the Fanatics Collect and Fanatics Live properties show a more circular model in which
      cards can be bought, bid on, broken live, vaulted, relisted, or sold back for instant credits.
      The sportsbook surfaces extend the same pattern into betting with Bonus Bets, up-to-10%-style
      FanCash offers, and odds-based rewards. Fanatics ONE then links those experiences through tier
      points and loyalty incentives. None of that proves realized margin quality, but it does prove
      that official pricing and incentive mechanics are broader than jersey markup alone. The
      financial question is therefore not whether Fanatics has multiple revenue streams — it clearly
      does — but how much of the blended business still behaves like inventory-heavy commerce versus
      higher-value engagement products.
