  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: segment-margin-disclosure
      missingEvidence: >-
        Segment revenue, gross margin, and contribution profit for commerce, collectibles,
        sportsbook, live commerce, and any event business.
      whyItMatters: >-
        The valuation and underwriting framework changes materially depending on how much profit
        comes from inventory-heavy commerce versus higher-margin adjacencies.
      diligencePath: >-
        Request audited segment P&Ls, management reporting bridges, and promo-adjusted contribution
        margins by business line.
      relatedQuestionRefs:
        - QI015
        - QI024
      relatedTableRefs:
        - TI003
        - TI005
    - type: stale
      severity: material
      topic: burn-and-runway
      missingEvidence: >-
        Current cash balance, monthly burn or free cash flow, and runway months after deploying the
        2022 financing into acquisitions and expansion.
      whyItMatters: >-
        Historical cash headlines do not tell investors whether Fanatics is currently self-funding,
        nearing breakeven, or moving toward another financing event.
      diligencePath: >-
        Request a current cash-flow statement, monthly burn bridge, and base / bull / bear runway
        scenarios from finance leadership.
      relatedQuestionRefs:
        - QI016
      relatedTableRefs:
        - TI004
        - TI005
    - type: missing-source
      severity: material
      topic: obligations-schedule
      missingEvidence: >-
        Debt facilities, lease liabilities, licensing guarantees, minimum commitments, and any
        credit-support or working-capital facilities.
      whyItMatters: >-
        Hidden fixed obligations can change downside severity and can make an apparently well-funded
        company less flexible than headline cash suggests.
      diligencePath: >-
        Request debt agreements, lease tables, minimum guarantee schedules, and any
        off-balance-sheet commitment summary.
      relatedQuestionRefs:
        - QI017
      relatedTableRefs:
        - TI004
        - TI005
    - type: missing-source
      severity: material
      topic: working-capital-and-inventory
      missingEvidence: >-
        Inventory turns, returns reserve policy, fulfillment cost detail, vault liabilities, and any
        card-buyback reserve assumptions.
      whyItMatters: >-
        A commerce-led model can consume more capital and produce lower normalized margin than the
        top-line story suggests unless inventory and returns are tightly managed.
      diligencePath: >-
        Request working-capital bridges, reserve methodology, inventory aging, and returns data
        across merchandise and collectibles.
      relatedQuestionRefs:
        - QI018
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: partner-concentration
      missingEvidence: >-
        Revenue and gross profit concentration by league, rights-holder, store contract, and major
        enterprise partner.
      whyItMatters: >-
        Concentration and contract economics determine bargaining power, renewal risk, and the
        durability of the low-CAC commerce flywheel.
      diligencePath: >-
        Request top-partner concentration analysis, contract renewal dates, and margin by major
        relationship.
      relatedQuestionRefs:
        - QI024
        - QI025
      relatedTableRefs:
        - TI005
