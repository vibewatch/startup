  - id: traction-unit-economics-capital
    title: Public traction, unit-economics proxies, and capital adequacy
    body: >-
      The public top-line anchors are strong enough to establish scale, even if they are not
      audited. Sacra puts Fanatics at $3.4B of revenue in 2021 and $7B in 2023, while SportsPro
      reports management projected about $8B of 2023 revenue. Those figures are directionally
      consistent with a business that is already much larger than most stand-alone sports betting
      operators and closer to the revenue scale of large public retail or platform peers. The peer
      screen is useful here: StockAnalysis puts 2025 revenue at $6.05B for DraftKings, $11.10B for
      eBay, $16.38B for Flutter, and $17.22B for DICK'S. Fanatics therefore looks too large to
      analyze as a niche collectibles or betting startup, but it is still too opaque to analyze like
      a fully disclosed public platform.


      Public unit-economics evidence is thinner. Sacra's roughly $19 CAC claim and the >100M-fan
      installed base suggest that Fanatics can acquire or reactivate users cheaply inside owned
      channels, which is strategically important because bonus bets, FanCash, and live-commerce
      credits are easier to fund when acquisition starts from existing fan traffic. But the same
      public record also shows why underwriting remains incomplete: the company does not disclose
      gross margin by business line, recognized sportsbook promo expense, inventory turns, returns
      reserves, or contribution margins for live commerce and collectibles. Capital adequacy is also
      directionally positive but incomplete. MarketScreener and SportsPro together show $1.5B raised
      at $27B, then roughly $700M more at $31B, and SportsPro says Fanatics expected to end 2022
      with more than $2B of cash. That suggests 2022-2023 expansion was financed from strength, not
      distress. The missing piece is what happened after that capital was deployed into Topps,
      PointsBet, live commerce, and broader ecosystem build-out. Public readers still do not have
      current burn, runway, debt, or lease visibility.
