company:
  name: Skyryse
chapter:
  number: 7
  title: Risks
  summary: Skyryse faces primary execution and regulatory risk centered on novel FAA Part 27 Special Conditions for digital
    fly-by-wire flight control annunciation and the replacement of mechanical cyclic feedback. While FAA design approval and
    $300M in Series C capital mitigate near-term liquidity pressure, the company remains exposed to single-supplier airframe
    concentration with Robinson, military pilot cultural resistance to irreversible software-defined control, and an elevated
    $1.15B valuation multiple prior to commercial delivery revenue.
sections:
- id: regulatory-certification-risk
  title: FAA Part 27 Special Conditions and Regulatory Certification Exposure
  body: Skyryse's fundamental regulatory challenge stems from introducing digital fly-by-wire flight controls into normal
    category rotorcraft historically governed by mechanical linkage standards. Under 14 CFR Part 27, existing airworthiness
    regulations were drafted around rudimentary pushrod controls and do not contain safety standards for full fly-by-wire
    architectures. In April 2026, the FAA published proposed Special Conditions (Notice No. 27-26-01-SC, Docket FAA-2025-5245)
    establishing new certification requirements for Skyryse's modification of the Robinson R66. Because digital fly-by-wire
    eliminates physical cyclic feedback, the FAA mandated visual annunciation of commanded control positions and operating
    modes to prevent pilot mode confusion. Although Skyryse achieved FAA design approval for its flight control computers
    in 2025 and entered for-credit flight testing, obtaining final Supplemental Type Certification remains an open gating
    milestone before commercial aircraft deliveries can commence.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR008
  - CR011
  tableRefs:
  - TR001
- id: operational-technical-safety-risk
  title: Fly-by-Wire Failure Modes, Human Factors, and Operational Reliability
  body: Operating an aircraft-agnostic software flight operating system creates distinct technical failure modes across flight
    control software integrity, sensor fusion, and pilot interaction. Skyryse engineered SkyOS with triple redundant flight
    control computers targeting a catastrophic failure probability below 10^-9 per flight hour. However, the elimination of
    mechanical backup introduces severe human-factors risks, particularly during degraded operating modes or abrupt automated
    handoffs. Defense aviators and commercial utility operators express persistent skepticism regarding software-defined flight
    controls that prevent manual mechanical override during emergency situations. While Skyryse has logged over 2,800 crewed
    flight test hours and 10,000 simulated flight hours—including automated autorotation and emergency autoland demonstrations—scaling
    software across divergent platforms from the Robinson R66 to the UH-60 Black Hawk and Cirrus SR22 expands the risk of
    unmodeled aerodynamic corner cases.
  claimRefs:
  - CR004
  - CR005
  - CR009
  - CR010
  tableRefs:
  - TR002
- id: partner-manufacturing-dependencies
  title: Airframe OEM Dependencies and Supply Chain Concentration
  body: Skyryse's commercial go-to-market strategy depends heavily on third-party airframe manufacturers, creating substantial
    counterparty concentration risk. The company's primary commercial vehicle, the Skyryse One, relies exclusively on Robinson
    Helicopter Company for new R66 airframes and retrofit coordination. Robinson produces approximately 300 total aircraft
    annually, with the turbine-powered R66 representing roughly one-third of output, creating a theoretical ceiling on annual
    production scaling. Additionally, Robinson's unmanned division has partnered simultaneously with Sikorsky on the competing
    TURBINETRUCK utility rotorcraft UAS, introducing strategic channel conflict. On defense programs, Skyryse's integration
    onto Army Black Hawks and uncrewed attritable airplanes faces elongated federal procurement timelines and defense budget
    competition. Any operational disruption at Robinson or shift in military procurement priorities directly threatens Skyryse's
    projected delivery volume.
  claimRefs:
  - CR006
  - CR012
  tableRefs:
  - TR003
- id: financial-burn-and-valuation-overhang
  title: Pre-Revenue Capital Burn, Valuation Pricing, and Diligence Kill Triggers
  body: Skyryse is capitalized with over $605 million in lifetime equity financing, including a $300 million Series C closed
    in February 2026 at a post-money valuation of $1.15 billion. However, this valuation capitalizes substantial future software-defined
    aviation adoption before the company has demonstrated recurring commercial delivery revenue. With heavy ongoing expenditures
    required for for-credit flight test operations, avionics production tooling, and engineering overhead across helicopter
    and fixed-wing platforms, cash burn is substantial. If final FAA certification slips or conversion of prospective fleet
    reservations stalls, Skyryse risks significant multiple compression or down-round financing. Clear investment diligence
    kill triggers must monitor FAA issue paper closure velocity, flight test anomalies, and Robinson airframe delivery cadence.
  claimRefs:
  - CR007
  - CR013
  - CR014
  figureRefs:
  - FR001
