callouts:
- calloutType: risk
  title: Regulatory Novelty in Part 27 Fly-by-Wire Certification
  body: The FAA's determination that existing 14 CFR Part 27 airworthiness regulations lack adequate safety standards for
    digital fly-by-wire controls underscores Skyryse's foundational regulatory hurdle. Replacing mechanical cyclic pushrods
    eliminates physical tactile feedback, requiring dedicated visual displays of commanded positions and operating modes to
    prevent pilot mode confusion.
  claimRefs:
  - CR001
  - CR002
- calloutType: recommendation
  title: Diligence Kill Triggers for Ongoing Flight Testing
  body: Investors must establish explicit kill criteria tied to FAA for-credit flight testing milestones. Any failure to achieve
    final Part 27 STC issuance within scheduled cash runway, or negative human-factors findings regarding pilot situational
    awareness during degraded flight control modes, represents an immediate thesis-break trigger.
  claimRefs:
  - CR003
  - CR007
