callouts:
- calloutType: insight
  title: Retrofit Speed vs. Clean-Sheet Aircraft Certification
  body: Skyryse’s focus on Supplemental Type Certificates allows the company to leverage established, airworthy type certificates
    from Robinson, Sikorsky, and Cirrus. This regulatory pathway sidesteps the multibillion-dollar capital requirements and
    protracted timeline of certifying brand-new eVTOL airframes, creating a faster potential route to commercial scale if
    FAA issue papers clear smoothly.
  claimRefs:
  - CP001
  - CP002
  - CP009
- calloutType: risk
  title: Incumbent Flight-Control Response and Dual-Use Platform Rivalry
  body: While Skyryse has validated multi-airframe compatibility with its 91-day Black Hawk integration, aerospace primes
    like Sikorsky are vigorously defending military and utility rotorcraft programs with in-house autonomy initiatives such
    as TURBINETRUCK and Matrix technology. Skyryse must maintain superior software integration velocity to prevent OEMs from
    standardizing alternative autonomy stacks.
  claimRefs:
  - CP005
  - CP006
  - CP010
