      - number: '4.3'
        title: 成本结构与单机经济性不透明
        blocks:
          - type: paragraph
            body: >-
              SkyOS
              的经济可行性取决于硬件集成成本、飞控计算机制造费用和持续飞行测试开销相对于单机售价的关系。传统航空电子及线传飞控改装包含三重冗余飞控计算机、机电执行器、传感器套件和触屏显示器，物料成本很高。Robinson
              Helicopter 每年约生产 300 架民用直升机；其基础 Robinson R66 机体售价超过 $1 million，构成制造基准。但 Skyryse 尚未公开 Skyryse One
              改装的实际单机售价、零部件制造成本或安装工时。国防场景下，飞行员在高威胁环境中偏好手动接管，可能拖慢部署。由于毛利率和客户获取成本仍是严格保密数据，商业出货前，独立财务评估必须把单机盈利能力视为未经验证的尽调缺口。
