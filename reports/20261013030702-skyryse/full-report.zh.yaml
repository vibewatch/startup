      - number: '5.2'
        title: 驾驶舱现代化、动态包线保护与紧急自动着陆
        blocks:
          - type: paragraph
            body: >
              SkyOS 的飞行员界面把传统周期、总距和反扭矩踏板整合为统一的人机界面：一根 4
              轴操纵杆和两块触屏。确定性飞控软件持续计算动态飞行包线保护，主动防止气动失速、空间迷向、过扭矩和危险涡环状态。发动机启动、起飞、稳定悬停和着陆等高负荷常规动作可通过触控指令完成，同时保留飞行员的最终控制权。2026
              年 3 月，Skyryse 宣布计划在 SkyOS 中加入覆盖旋翼机和固定翼飞机的紧急自动着陆能力。现有商业自动着陆系统只在固定翼飞机上运行并沿铺装跑道导航，而 SkyOS
              的紧急自动着陆会处理直升机动力学，包括功率管理、自转进入或动力下降、障碍物规避、地形感知和接地。人载线传飞控基础还允许机体由飞行员驾驶，或转为无人航空系统（UAS），无需从根本上重新设计飞控执行器和软件架构。
            claimRefs:
