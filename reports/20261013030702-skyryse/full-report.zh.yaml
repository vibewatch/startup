      - - 悬停与低速机动
        - 持续高负荷地微调周期变距、总距和脚蹬
        - 单个控制杆输入，并自动保持稳定悬停
        - 大幅降低飞行员疲劳；防止地面效应中的失控
        - 侧风包线受机电作动器最大控制能力限制
      - - 飞行中发动机紧急失效
