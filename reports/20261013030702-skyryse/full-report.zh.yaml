            title: 改装速度对比全新飞机认证
            body: >-
              Skyryse 专注补充型号合格证，可以利用 Robinson、Sikorsky 和 Cirrus 已有且适航的型号合格证。这条监管路径绕开了认证全新 eVTOL 机体所需的数十亿美元资本和漫长周期；只要 FAA
              issue papers 顺利清零，就可能更快实现商业规模化。
