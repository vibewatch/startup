  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将融资估值、认证里程碑和采用阻力连接到跟踪建议的分析决策树。
    data:
      nodes:
        - id: valuation-context
          label: C 轮估值（融资超过 $605M，估值 $1.15B）
          role: input
        - id: certification-progress
          label: FAA 最终设计批准与积分测试
          role: technical-proof
        - id: fleet-partnerships
          label: 军民两用机队协议（Black Hawk、R66、Cirrus）
          role: commercial-pull
        - id: adoption-hurdles
          label: 飞行员对全面自动化的抵触与财务信息不透明
          role: headwind
        - id: execution-risk
          label: 资本密集度高，认证时间不确定
          role: risk-factor
        - id: valuation-assessment
          label: 估值判断：相较公开证据偏高
          role: valuation-assessment
        - id: final-recommendation
          label: 建议：持续跟踪待验证的收入与交付证据
          role: conclusion
      edges:
        - from: valuation-context
          to: certification-progress
        - from: certification-progress
          to: fleet-partnerships
        - from: fleet-partnerships
          to: adoption-hurdles
        - from: adoption-hurdles
          to: execution-risk
        - from: execution-risk
          to: valuation-assessment
        - from: valuation-assessment
          to: final-recommendation
