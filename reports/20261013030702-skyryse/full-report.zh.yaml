              - CP010
              - CP014
      - number: '3.3'
        title: 定价模式、产品组合与切换经济性
        blocks:
          - type: paragraph
            body: >-
              航空自动化的交付模式对应不同的资本投入和运营商切换成本。全新设计的 eVTOL
              公司计划建设垂直整合的客运网络，把飞机制造和运营风险内部化，不直接向机队运营商销售硬件。相反，现有航空电子供应商把安全升级包装成新机上的高价工厂选装配置。Skyryse 采用混合商业路径：一边销售 Skyryse
              One 等交钥匙飞机，一边为 Robinson R66 和 UH-60 Black Hawk
              等现有旋翼机队提供售后改装套件。商业运营商和军方机构改装已有资产，可以避开数百万美元级的资本替换周期并保留熟悉的机体，但仍要承担飞机改装停机、飞行员培训调整和未经验证的长期维护开销。
            claimRefs:
