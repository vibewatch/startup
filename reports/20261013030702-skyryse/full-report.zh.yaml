        title: 商业牵引与飞行认证进度
        blocks:
          - type: paragraph
            body: >-
              受监管航空硬件的商业化速度严格受监管里程碑约束。2024 年 10 月，FAA 为首架 Skyryse One 颁发 Special Airworthiness
              Certificate，批准扩大飞行运营，Skyryse 因此取得关键制造里程碑。2025 年，FAA 批准 SkyOS 飞控计算机最终设计，平台进入 For-Credit
              飞行测试。与此同时，公司在多个关键航空垂直领域建立战略集成协议：Air Methods 和 United Rotorcraft 负责应急医疗机体，California Department of Forestry
              and Fire Protection（CAL FIRE）负责航空消防，U.S. Army 负责降低旋翼机飞行员工作负荷。Skyryse 与 Robinson Helicopter 的合作还为 R66
              平台上的无人旋翼机开发提供了专门工业路径。飞行测试已从直升机扩展至固定翼飞机，代表性成果包括 UH-60 Black Hawk 的 91 天集成，以及 2025 年末 Cirrus SR22 的飞行验证。
