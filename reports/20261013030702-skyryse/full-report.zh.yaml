  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现架构
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的商业变现集中在三条渠道：新生产飞机整机安装、售后机体改装，以及国防任务集成。公司的旗舰商业产品 Skyryse One 以涡轮动力 Robinson R66 机体为基础，配备由 SkyOS
              驱动的单杆、双触屏线传飞控驾驶舱。Skyryse 通过每个交付名额收取 $2,500
              可退款预订订金启动商业客户招募，并称首批生产版在六个月内售罄。除民用通用航空外，公司还利用软件驱动的自主能力和可选有人驾驶能力，瞄准 UH-60 Black Hawk
              等军用旋翼机的现代化。长期商业化计划包括全生命周期软件支持、年度导航数据更新和机队维护订阅，但正式的持续 SaaS 定价档位尚未公开。由于 Skyryse 仍在等待最终 FAA
              认证、处于交付前阶段，已报告的收入牵引主要是客户订金积压，而非实际商业出货或 GAAP 收入。
