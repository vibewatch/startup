      - - 乐观情景
        - FAA 在 2027 年前完成认证；Robinson R66 和 Black Hawk 改装快速扩大；军方可消耗型机队采用率提升
        - 商业 IPO 或战略国防收购时估值 $2.5B - $3.5B；相对 C 轮价格回报 2.2x - 3.0x
        - FAA 测试停滞，或军费削减取消可消耗型固定翼项目
        - 25%
      - - 基准情景
        - 2027 年末取得认证；专业民用运营商和国防测试平台持续采用；改装节奏温和
        - 估值 $1.2B - $1.6B；回报 1.0x - 1.4x，在估值温和增长的同时保住投入资本
        - 智能作动器供应链延迟，或机队运营商改装周期拉长
        - 55%
      - - 悲观情景
        - FAA 认证长期延迟至 2028 年之后；飞行员采用阻力限制民用销售；高现金消耗迫使公司重组资本
        - 估值下调至 $400M - $600M；后期投资者资本损失 50% - 65%
        - 监管反对电传飞控包线保护，或流动性耗尽，需要结构化救助融资
        - 20%
    notes: 情景分析建模了 24-36 个月投资周期内的预期估值区间、回报倍数和运营触发因素。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV010
      - CV012
      - CV013
      - CV014
