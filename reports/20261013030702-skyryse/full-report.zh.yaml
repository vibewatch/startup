              由于缺少公开披露的财务和运营指标，客户留存持久性及扩张动态难以评估。Skyryse 既未披露净收入留存率、流失率、合同金额，也未披露订金转订单比例。公司的扩张策略依靠多机型机队运营商和国防指挥体系中的
              land-and-expand。但商业规模化仍有很大监管及运营摩擦：航空安全自动化必须在数千个软件边界案例上完成全面验证，才能取得 FAA
