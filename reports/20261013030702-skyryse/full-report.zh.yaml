            title: 现有厂商的飞控应对与双用途平台竞争
            body: >-
              Skyryse 已通过 91 天 Black Hawk 集成验证多机体兼容性，但 Sikorsky 等航空航天巨头正借助 TURBINETRUCK 和 Matrix 技术
              等内部自主项目，积极守住军用及通用旋翼机项目。Skyryse 必须保持更快的软件集成速度，避免 OEM 把其他自主技术栈标准化。
