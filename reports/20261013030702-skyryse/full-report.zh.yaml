      - number: '5.3'
        title: 平台部署广度、国防集成与尽调缺口
        blocks:
          - type: paragraph
            body: >
              Skyryse 已把部署路线从最初的商业改装平台、涡轮动力 Skyryse One（Robinson R66）扩展出去。FAA 于 2024 年 10 月颁发 Special Airworthiness
              Certificate 后，又在 2025 年批准 SkyOS 飞控计算机最终设计，允许公司推进 FAA For-Credit 飞行验证测试。在运营演示中，Skyryse 用 91 天完成 Sikorsky
              UH-60 Black Hawk 集成，并于 2025 年 12 月实现自动起飞、悬停和着陆。2025 年 10 月，公司在 Cirrus SR22 上完成首次固定翼测试飞行。2026 年 6 月，Skyryse
              与 Robinson Helicopter Company 合作开发 R66 无人旋翼机变体，用于国防情报、监视、侦察（ISR）和空射效应（ALE）。此外，公司已与 United Rotorcraft、Air
              Methods、CAL FIRE 和 Mitsubishi Corporation 宣布商业集成协议，覆盖 Airbus H-125、H-130、Bell 407 和 Pilatus
              PC-12。关键尽调缺口仍包括 FAA 补充型号合格证（STC）的确切时间表、剩余 issue papers、开源开发者工具链支持，以及航空公司或机队运营约束下的全生命周期软件维护框架。
