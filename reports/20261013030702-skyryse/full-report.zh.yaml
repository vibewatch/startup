  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Skyryse
              处于航空飞行自动化与线传飞控航空电子市场，核心边界包括数字飞控计算机、简化飞行操作（SVO）界面和软件驱动的飞行包线保护。其可服务边界是在获认证飞机上，用一体化数字架构替换传统机械连杆、周期与总距操纵杆以及模拟仪表。公司有意排除原始机体制造、涡轮发动机大修和结构复合材料制造，将
              SkyOS
              定位为不依赖机型的软件与硬件平台。商业运营商的现状替代方案，是由两名飞行员操控复杂机械系统，并在低能见度环境下承受较高认知负荷。公务和通用航空中的现有替代品主要是传统双轴自动驾驶仪，缺少包线保护、自动自转和一键紧急自动着陆。Skyryse
              计划把现有获认证机型变成软件管理的飞机，争取航空电子改装预算和 OEM 工厂集成费，而不是直接与机体制造商竞争。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM009
      - number: '2.2'
        title: 民用、国防与 OEM 视角下受限的可服务市场测算
        blocks:
          - type: paragraph
            body: >-
              测算 SkyOS 的可服务市场，需要把自上而下的航空航天航空电子基准，与 Skyryse 已公布集成平台的自下而上机队数量结合起来。全球飞行甲板航空电子及飞控系统 TAM 每年约为 $55B 至
              $65B，但其中主要是 Skyryse 近期不聚焦的商用运输客机。严格定义的 SAM 聚焦约 35,000 架活跃民用涡轮直升机和军用轻型通用旋翼机，这些机型适合数字线传飞控升级，在北美及盟国形成 $8.5B 至
              $12.0B 的设备与软件机会。在这一边界内，Skyryse 的 SOM 由其与 Air Methods、United Rotorcraft、CAL FIRE 及 U.S. Army 签署的集成协议支撑，对应
              $650M 至 $1.2B 的合作伙伴机队机会。此外，新生产飞机的工厂集成可带来持续 OEM 收入；Robinson Helicopter Company 每年约生产 300 架飞机，其中涡轮 R66
              占交付量的三分之一。受制于产能爬坡和正式合同转化，近期已验证的初始运行率仍限于 $25M 至 $35M。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.3'
        title: 不同运营环境下的买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              SkyOS 的采用受应急医疗服务、航空消防、军用航空和私人机主飞行员之间不同的采购流程及经济激励驱动。在应急医疗服务中，Air Methods
              等运营商的机队高管根据飞行安全要求和减少可控飞行撞地（CFIT）事故的目标做采购决策，报销则来自私营医疗保险公司和医院运输合同。公共安全及野外消防机构，如 CAL
              FIRE，通过州级紧急灾害拨款采购航空资产，重点是在浓烟造成的低能见度环境下实现自动悬停和着陆。国防采购通过 U.S. Army 项目执行办公室走双用途路径，Title 10 采购和 RDT&E
              资金支持可选有人驾驶能力及无人情报任务的快速集成，Skyryse 的 91 天 Black Hawk
              集成就是验证。最后，企业和私人通用航空中的高净值机主飞行员用私人资本购买飞机，关注简化的触屏操作和自动紧急恢复系统，因为这些系统能降低飞行员资质门槛。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、认证瓶颈与采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              SkyOS 的采用势头来自商业航空严重的飞行员短缺、军方对自主物流不断扩大的双用途需求，以及 U.S. Department of Transportation 的 National Advanced Air
              Mobility Strategy 等联邦计划。但市场渗透仍受运营和监管摩擦制约。FAA Part 27 和 Part 23 下的补充型号合格审定（STC）要求严格验证，飞控计算机必须满足灾难性失效概率
              10^-9 的阈值。虽然 FAA 于 2025 年批准 SkyOS 飞控计算机最终设计，并为 Skyryse One 颁发 Special Airworthiness Certificate，正式
              For-Credit
              飞行测试仍在进行。除认证外，机队运营商在安装线传飞控硬件时还要承担显著停机时间和资本支出，并面对用数字单杆控制替代机械连杆所引发的飞行员抵触。更关键的尽调缺口仍在：公开公告没有披露合同定价模式、维护版税结构，以及非约束性机队预订转化为正式采购订单的比例，因此近期收入兑现仍需通过私人执行情况核验。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 双用途架构缓解民用认证滞后
            body: >-
              Skyryse 一边推进 FAA Part 27 和 Part 23 民用机队补充型号合格审定，一边在 UH-60 Black Hawk 上展示 91
              天军用集成速度，形成双轨路径并分散运营风险。军方和公共安全运营商可在民用认证完成正式 For-Credit 飞行测试之前，依据国防适航机构批准部署任务自动化。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
          - type: callout
            title: 合作公告之外的商业转化仍不透明
            body: Skyryse 已公布空中医疗、公共安全和 OEM 制造领域的知名机队合作，但公开记录没有正式订单数量、不可退款订金条款或持续软件许可费。长期估值能否站住，取决于非约束性机队集成协议能否转成产生现金的改装安装。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              围绕 Skyryse 的竞争格局分为三类战略路径：专门打造电动垂直起降（eVTOL）飞机的 OEM、专注货运飞行自动化的开发商，以及现有航空电子供应商。Joby Aviation 和 Archer
              Aviation 等知名先进空中交通初创公司拥有数十亿美元公开估值，但必须承担整机制造、地面电池基础设施和新型 FAA powered-lift 型号认证的融资责任。相比之下，Skyryse
              专注软件和线传飞行操作系统层，通过补充型号合格证瞄准现有民用及军用机体。Reliable Robotics 等无人飞行开发商则优先为定期货运支线航线提供远程驾驶。Sikorsky 和 Textron
              等现有厂商同时探索内部自主项目及商业合作，以保护自身机体特许经营权，抵御软件定义带来的颠覆。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP008
      - number: '3.2'
        title: 能力、架构与监管比较
        blocks:
          - type: paragraph
            body: >-
              飞行自动化的技术差异主要取决于控制深度、界面简化程度和认证范围。传统通用航空驾驶舱依赖复杂机械连杆，直升机飞行员要掌握彼此不同的周期、总距和反扭矩踏板输入，固定翼飞行员则要掌握驾驶杆和方向舵踏板。Garmin
              Autoland 等现有安全创新能提供关键的紧急下降与着陆自动化，但在正常飞行中处于待机状态。Skyryse 的 SkyOS
              通过数字线传驱动、人体工学单杆、双触屏和动态包线保护，提供持续、全时的简化飞行操作。公司已在天生不稳定的旋翼机和稳定的固定翼机体上验证该架构，获得 FAA 飞控计算机最终设计批准并推进 For-Credit
              飞行测试；在已获认证的飞行简化能力上，它远远领先于仍停留在概念阶段的竞争者。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP009
              - CP013
