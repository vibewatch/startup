            title: 双用途改装策略降低市场进入摩擦
            body: |
              Skyryse 不建造定制飞机，而是把 SkyOS 做成适用于 Robinson R66、UH-60 Black Hawk 等成熟机体的通用改装方案，借助既有客户型号评级和成熟维护生态。
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU011
          - type: callout
            title: 认证依赖拖慢收入转化
            body: |
              商业及国防合作目前仍是开发和飞行演示合作；在 FAA 补充型号合格证最终完成前，实际机队部署和现金流创造无法规模化。
            calloutType: risk
            claimRefs:
              - CU002
              - CU007
              - CU009
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: FAA Part 27 特殊条件与监管认证风险
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的根本监管难题，是把数字线传飞控引入过去由机械连杆标准监管的正常类旋翼机。14 CFR Part 27 现有适航法规围绕基础推杆控制编写，没有完整线传架构的安全标准。2026 年 4 月，FAA
              发布拟议 Special Conditions（Notice No. 27-26-01-SC，Docket FAA-2025-5245），为 Skyryse 改装 Robinson R66
              建立新的认证要求。由于数字线传飞控取消了实体周期反馈，FAA 要求通过视觉提示显示指令控制位置和运行模式，以防止飞行员模式混淆。虽然 Skyryse 于 2025 年取得飞控计算机设计批准并进入
              For-Credit 飞行测试，最终取得补充型号合格证仍是商业交付启动前尚未完成的关键里程碑。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
      - number: '7.2'
        title: 线传飞控失效模式、人因与运营可靠性
        blocks:
          - type: paragraph
            body: >-
              运行不依赖机型的软件飞行操作系统，会在飞控软件完整性、传感器融合和飞行员交互上产生不同技术失效模式。Skyryse 为 SkyOS 配置三重冗余飞控计算机，目标是把每飞行小时灾难性失效概率控制在 10^-9
              以下。但取消机械备份也带来严重人因风险，尤其是在降级运行模式或自动控制突然交接时。国防飞行员和商业通用航空运营商持续质疑软件定义飞控，因为它在紧急情况下阻止手动机械接管。Skyryse 已记录超过 2,800
              小时有人飞行测试和 10,000 小时模拟飞行测试，包括自动自转及紧急自动着陆演示；然而，把软件从 Robinson R66 扩展到 UH-60 Black Hawk 和 Cirrus SR22
              等差异很大的平台，也会放大未建模气动边界案例的风险。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
      - number: '7.3'
        title: 机体 OEM 依赖与供应链集中
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的商业市场进入策略高度依赖第三方机体制造商，因此面临明显的交易对手集中风险。公司的主要商业飞机 Skyryse One 完全依赖 Robinson Helicopter Company 提供新
              R66 机体并协调改装。Robinson 每年约生产 300 架飞机，其中涡轮动力 R66 约占三分之一，构成理论年产能上限。与此同时，Robinson 的无人机部门又与 Sikorsky 合作开发竞争性的
              TURBINETRUCK 通用旋翼机 UAS，带来渠道冲突。在国防项目上，Skyryse 集成 Army Black Hawk 和无人可消耗飞机还要面对漫长的联邦采购周期及国防预算竞争。Robinson
              的任何运营中断，或军方采购重点变化，都会直接威胁 Skyryse 的预计交付量。
            claimRefs:
              - CR006
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR012
              - CR013
      - number: '7.4'
        title: 收入前现金消耗、估值定价与尽调否决触发器
        blocks:
          - type: paragraph
            body: >-
              Skyryse 累计获得超过 $605 million 股权融资，其中包括 2026 年 2 月完成的 $300 million Series C，投后估值为 $1.15
              billion。但该估值在公司尚未证明持续商业交付收入前，就为大量未来软件定义航空采用进行了资本化。为推进 For-Credit
              飞行测试、航空电子生产工具和横跨直升机及固定翼平台的工程工作，公司持续支出很高，现金消耗也很大。如果最终 FAA 认证延期，或潜在机队预订转化停滞，Skyryse
              可能遭遇显著估值倍数压缩或下轮融资。投资尽调应明确监测 FAA issue paper 关闭速度、飞行测试异常和 Robinson 机体交付节奏等否决触发器。
            claimRefs:
              - CR007
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR014
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Part 27 线传飞控认证的监管新颖性
            body: >-
              FAA 认定现有 14 CFR Part 27 适航法规缺少数字线传飞控的充分安全标准，凸显了 Skyryse
              的基础监管障碍。替换机械周期推杆会取消实体触觉反馈，因此需要专门的视觉显示来呈现指令位置和运行模式，避免飞行员模式混淆。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 持续飞行测试的尽调否决触发器
            body: >-
              投资者必须围绕 FAA For-Credit 飞行测试里程碑设定明确否决标准。如果在计划现金跑道内未能取得最终 Part 27
              STC，或降级飞控模式下飞行员态势感知出现负面人因结论，都应视为立即打破投资论点的触发器。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与融资估值背景
        blocks:
          - type: paragraph
            body: >-
              Skyryse 在 2026 年初完成超过 $300 million 的 Series C 后，投后估值达到 $1.15 billion；本轮由 Autopilot Ventures 和老股东 Fidelity
              Management & Research Company 领投。注资使累计股权融资超过 $605 million，为完成 FAA 认证并在民用及国防平台上扩大 SkyOS
              线传飞控操作系统提供资金。核心投资论点是：SkyOS 可成为通用的软件定义航空电子标准，用智能执行器替代复杂机械飞控连杆，降低飞行员工作负荷并消除机械单点故障。公司在 2025 年取得飞控计算机 FAA
              最终设计批准，并在 91 天内完成 UH-60 Black Hawk 直升机的自动起飞、悬停和着陆，技术势头明显。但反方论点指出，在没有公开持续收入或毛利率指标的 $1.15 billion
              私人估值下，后期投资人正为一个仍然资本密集、受严格适航验证约束的航空航天集成模式支付软件级高倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: 推荐立场与分析框架
        blocks:
          - type: paragraph
            body: >-
              我们对 Skyryse 的总体建议是继续跟踪，信心中等；风险评级为高，估值立场偏贵。继续跟踪是在有吸引力的军民两用技术验证与估值风险、采用阻力之间取得平衡。技术和商业验证方面，Skyryse
              已取得重要进展：FAA 已将 SkyOS 推进到可计入认证的飞行测试阶段，Air Methods、United Rotorcraft 和 Robinson Helicopter
              等商业合作伙伴也已承诺在直升机和固定翼机队中开展集成项目。此外，向美国军方特种作战部队交付可消耗无人飞机的国防协议，证明政府市场存在高优先级需求。反过来，较高风险评级源于尚未验证的商业转化率、漫长的监管孵化周期，以及已有记录的飞行员顾虑——在关键运行场景下是否应完全交由数字电传飞控掌舵。由于公开财务数据仍未披露，以当前
              $1.15 billion 估值进入的安全边际有限，因此只有在商业交付得到验证或估值出现明显折价时，直接投资才更稳妥。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: 情景分析与估值分布
        blocks:
          - type: paragraph
            body: >-
              为评估三年投资周期内潜在的风险调整后回报，我们围绕认证时点、改装转化和国防采用建立三种经营情景。乐观情景（概率 25%）下，Skyryse 在 2027 年前取得 FAA 最终补充型号合格证，以 $1.8
              million 定价的 First Edition Skyryse One 飞机快速放量交付，并将国防合作转化为多年期持续采购项目，退出估值可达 $2.5 billion 至 $3.5
              billion。基准情景（概率 55%）下，认证在 2027 年末完成，专业公用运营商和军方飞行测试平台逐步采用，估值稳定在 $1.2 billion 至 $1.6
              billion，能够保住投入资本。悲观情景（概率 20%）下，认证推迟到 2028 年以后，飞行员的文化阻力和作动器供应约束压低改装交付；若现金消耗持续，该情景将触发结构化资本重组，估值降至 $400
              million 至 $600 million。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 尽调重点与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              潜在投资者在考虑参与一级或二级股权前，必须优先完成三项直接尽调。第一，在 NDA 约束下查阅经审计财务报表和单位经济模型，厘清硬件作动器与 SkyOS 持续软件许可各自的准确毛利率。第二，审查 FAA
              认证时间表，重点核对尚未关闭的认证问题文件和剩余的可计入认证飞行测试要求。第三，与机队合作伙伴——包括美国陆军、CAL FIRE 和 Robinson
              Helicopter——进行确认性沟通，核实确定订单承诺及取消条款。明确的论点失效触发条件包括：（1）FAA 认证出现任何重大僵局，或飞控计算机需要重新设计；（2）King Air 或 Black Hawk
              项目的旗舰国防协议终止或不再续签；（3）无法把最初的 Skyryse One 预订转化为已完成的商业交付；（4）现金消耗计划外加速，需要结构化债务或带惩罚性的优先股融资。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 对高估值保持跟踪
            body: >-
              Skyryse 已展示突破性的航空自动化能力，也达成了关键 FAA 设计里程碑，但 $1.15B 的 Series C
              估值已提前计入大规模商业化，而经审计的财务证据尚未跟上。投资者应跟踪认证进展，等商业交付得到验证后再投入资本。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
          - type: callout
            title: 飞行员对自动化的阻力与资本密集度
            body: 军用和民用市场的军民两用扩张同时面临两重阻力：飞行员根深蒂固地偏好实体手动控制，以及航空航天飞行测试和机体集成持续需要大量资本。
            calloutType: risk
            claimRefs:
              - CV002
              - CV010
