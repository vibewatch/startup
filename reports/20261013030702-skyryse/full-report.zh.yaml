        title: 展示材料
        blocks:
          - type: callout
            title: 通用软件定义飞行架构
            body: Skyryse 的核心战略差异在于把飞控自动化与具体机体解耦；公司已在 Robinson 旋翼机、UH-60 Black Hawk 和 Cirrus 固定翼飞机上验证 SkyOS，并采用三重冗余航空电子设备。
