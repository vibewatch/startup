  - id: FI001
    title: SkyOS 商业化与变现路径
    type: flow
    summary: 从飞行自动化研发和 FAA 认证，到客户预订和机队部署的端到端商业化进程。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI012
    data:
      nodes:
        - label: 核心平台研发
          detail: 用 10 年开发不依赖机型的电传飞控自动化软硬件
        - label: FAA 飞行测试与批准
          detail: 获得飞控计算机设计批准并完成积分飞行测试
        - label: 客户预订与订金
          detail: 首发版售罄；已收取 $2,500 预订订金，对应下一批交付名额
        - label: 机体改装与制造
          detail: 接入 Robinson R66 生产基础设施和机队合作伙伴
        - label: 军民两用国防部署
          detail: 为美国陆军和国防运营商提供无人及可选有人驾驶能力
        - label: 经常性软件与机队服务
          detail: 通过飞行软件维护、安全更新和生命周期许可获得长期收入
  - id: FE001
    title: SkyOS 分层飞行操作系统架构
    type: stack
    summary: SkyOS 的模块化功能栈，展示人机界面、计算冗余、作动及机体集成层。
    data:
      layers:
        - label: 人机界面层
          modules:
            - 单个四轴飞行操纵杆
            - 双交互式触摸屏
            - 滑动指令手势界面
          detail: 用简化触控和单手指令取代传统的总距杆、周期变距杆和脚蹬。
        - label: 确定性飞行管理与安全层
          modules:
            - 确定性专家飞控律
            - 动态飞行包线保护
            - 通用应急自动着陆引擎
          detail: 在不依赖云端的情况下执行空气动力学限制和自主应急着陆序列。
        - label: 三重冗余计算层
          modules:
            - 飞控计算机 A（FCC 1）
            - 飞控计算机 B（FCC 2）
            - 飞控计算机 C（FCC 3）
          detail: 不同架构的并行处理器，按照 DO-178C 软件和 DO-254 复杂硬件标准完成验证。
        - label: 传感器融合与环境感知层
          modules:
            - 多传感器惯性测量单元
            - 空气数据计算与皮托静压管阵列
            - 地形感知与障碍物探测传感器
          detail: 向飞控计算机提供实时姿态、空速和地形空间数据。
        - label: 机电作动层
          modules:
            - 专利直驱作动器
            - 重量中性的替换组件
            - 双通道配电线束
          detail: 无需液压管路，直接操纵旋翼斜盘和操纵面。
        - label: 机体集成层
          modules:
            - Robinson R66 涡轮直升机（Skyryse One）
            - Sikorsky UH-60 Black Hawk 旋翼机
            - Cirrus SR22 单引擎活塞式飞机
          detail: 通用机体适配让不同平台采用相同的软件控制逻辑。
    approximationNotes: 各层将实体航空电子设备和软件逻辑归入模块化功能层级。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
      - CE014
      - CE015
  - id: FU001
    title: 客户采用路径与扩张图
    type: journey-map
    summary: SkyOS 从运营商评估、认证里程碑、改装安装到机队扩张的采用路径。
    data:
      items:
        - label: 1. 运营商评估
          touchpoints:
            - 高管简报
            - 飞行模拟器演示
            - 工作负荷降低建模
          detail: 运营商评估简化飞行器运行和安全包线保护，比较传统飞行员培训负担。
        - label: 2. 意向书与预订
          touchpoints:
            - 订金协议
            - 机队转换规划
            - 飞机可用性排期
          detail: 商业运营商和私人买家为 Skyryse One 及机队改装项目锁定转换名额。
        - label: 3. 飞行演示与试点项目
          touchpoints:
            - 飞行测试遥测复核
            - 自动悬停与着陆演示
            - 任务情景评估
          detail: 国防机构和公共安全部门在 Black Hawk、Cirrus SR22 等平台上测试 SkyOS 能力。
        - label: 4. FAA 适航认证
          touchpoints:
            - 补充型号合格证（STC）
            - 积分飞行验证
            - 飞控计算机合规性
          detail: 这是关键关口：改装套件投入创收运营前，必须取得 FAA 正式批准。
        - label: 5. 机队改装与投运
          touchpoints:
            - MRO 安装（91 天周期）
            - 航空电子线束集成
            - 飞行员转换简报
          detail: 在维修中心安装电传飞控计算机和触摸屏硬件。
        - label: 6. 机队扩张与自主运行
          touchpoints:
            - 跨平台软件部署
            - 无人航空系统（UAS）
            - 应急自动着陆启用
          detail: 客户将 SkyOS 扩展到混合旋翼机和固定翼机队，解锁无人或可选有人驾驶运行。
    approximationNotes: 路径阶段依据已宣布的 Skyryse 合作伙伴集成阶段，对典型航空机队改装生命周期建模。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
