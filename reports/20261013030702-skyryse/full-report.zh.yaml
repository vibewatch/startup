chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品架构与运营版图
        blocks:
          - type: paragraph
            body: >-
              Skyryse, Inc. 是一家总部位于加州 El Segundo、2016 年由 Dr. Mark Groden 创立的航空航天自动化公司。公司开发不依赖机型、以软件定义的飞行操作系统
              SkyOS，用数字线传飞控自动化替代传统机械飞控连杆。SkyOS 通过三重冗余飞控计算机整合主飞控、机载系统和包线保护，设计目标是满足 Federal Aviation Administration
              对灾难性失效概率 10⁻⁹ 的要求。驾驶舱则用一根四轴飞控操纵杆和两块触屏替代复杂的机械驾驶杆、周期变距杆和方向舵踏板，飞行员可用标准化触控手势启动发动机、起飞、悬停和着陆。Skyryse
              在加州四处专用设施开展运营：El Segundo 的总部和先进实验室、Hawthorne 的飞机系统集成设施，以及 Camarillo
              的飞行线测试设施。公司仍采取私人披露口径，不公开商业收入、单机利润率和客户订金数据。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO015
      - number: '1.2'
        title: 创始人领导、治理与监管资历
        blocks:
          - type: paragraph
            body: >-
              Skyryse 采用以 CEO Mark Groden 为核心的创始人治理模式。Groden 拥有传感器数据融合博士学位和 60
              多项航空自动化专利，是公司的首席技术愿景负责人及主要发言人；由于他直接持有核心系统架构专利，并主导飞行自动化设计理念，机构投资者面临明显的关键人物风险。为缓解监管审批瓶颈和认证执行风险，Skyryse
              组建了由资深航空监管者和运营负责人组成的有影响力顾问委员会，包括前 FAA 认证负责人 Lirio Liu、前 FAA 总法律顾问 Marc Nichols、前 National Transportation
              Safety Board 副主席 Bruce Landsberg，以及前 NASA 管理局长 Dan Goldin。该监管班底为公司推进 FAA
              严格的商用飞机型号认证路径提供战略指导，帮助系统适航合规直接对接联邦安全监管框架。
            claimRefs:
              - CO001
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO008
              - CO009
      - number: '1.3'
        title: 资本结构、估值与利益相关者财团
        blocks:
          - type: paragraph
            body: >-
              Skyryse 于 2026 年 2 月完成超过 $300 million 的 Series C，投后估值升至 $1.15 billion，成为风险资本支持的航空自动化独角兽。此交易使公司各轮累计股权融资超过
              $605 million。Series C 由风险投资机构 Autopilot Ventures 与老股东、机构资产管理公司 Fidelity Management & Research Company
              共同领投，Latham & Watkins LLP 提供法律顾问。投资财团还吸引了 Qatar Investment Authority、ArrowMark Partners、Atreides
              Management、BAM Elevate、Baron Capital Group、Durable Capital Partners、Positive Sum、Rokos Capital
              Management's RCM Private Markets Fund 和 Woodline Partners 等机构及主权资本，并有早期投资人 Bill Ford
              参与。然而，在公司严格保密单机经济性、现金消耗和资产负债表跑道的情况下，$1.15 billion 估值已经计入了经过验证的收入形成之前的大幅商业扩张。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: 飞行自动化里程碑、FAA 认证与国防路线
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的技术验证从 2017 年最初的 Robinson R44 直升机测试，逐步推进到军用机体集成。2024 年 10 月，FAA 为首架预生产 Skyryse One 颁发 Special
              Airworthiness Certificate；2025 年，FAA 最终批准 SkyOS 飞控计算机设计，使其进入正式 FAA For-Credit 飞行测试。为展示跨平台通用性，公司于 2025 年 10
              月完成搭载 SkyOS 的 Cirrus SR22 飞机首飞，并于 2025 年 12 月在 91 天内完成改装 UH-60 Black Hawk 直升机的自动起飞、悬停和着陆。2026 年 6
              月，Robinson Helicopter Company 与 Skyryse 宣布战略合作，将为国防情报、监视、侦察及空射效应任务生产自主、无人化 R66
              旋翼无人机系统。不过，国防部署仍面临军方飞行员不愿将控制权交给自动系统，以及 Robinson 与 Sikorsky 等竞争性平台合作带来的运营障碍。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
