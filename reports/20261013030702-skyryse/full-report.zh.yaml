  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 通用飞行操作系统与三重冗余架构
        blocks:
          - type: paragraph
            body: >
              Skyryse 将 SkyOS 定位为不依赖机型的飞行操作系统，旨在统一不同旋翼机和固定翼机体的飞控。SkyOS
              不在老旧机械连杆上外挂辅助自动驾驶仪，而是用三重冗余、异构飞控计算机（FCC）和一组机电执行器替代传统液压及机械控制链。正常运行时，三台独立计算机并行计算飞控律；一台故障时，另外两台可无缝维持完整飞行功能；第二台也故障时，系统会指示飞行员立即着陆。该架构按
              DO-178C、DO-254 和 ARP 4754 下严格的 FAA 机载软硬件认证标准设计。在 Robinson R66
              改装中，机电执行器阵列和数字航空电子线束相对拆除的机械硬件实现净重量不变，保留飞机有效载荷，并为通用航空和军用改装建立基线。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
