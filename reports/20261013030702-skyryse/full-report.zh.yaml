        title: 客户分层与买方经济性
        blocks:
          - type: paragraph
            body: >
              Skyryse 把目标市场分为四类主要客户：公共安全与应急机构、军方及国防运营商、商业机队运营商，以及私人机主飞行员。各层客户的核心经济价值都是用 SkyOS
              改装老旧机体，降低飞行员培训摩擦，并通过动态包线保护消除气动事故。商业和应急医疗领域的 Air Methods、United Rotorcraft 等机队运营商，把 SkyOS
              看作标准化航空电子套件，可在无需购买全新设计飞机的情况下升级多种直升机机型。私人机主飞行员则看重 Skyryse One
              改装带来的简化单杆和触屏界面，因为它降低了驾驶旋翼机的门槛。但在所有客户群中，从非约束性预订转为付费改装安装的意愿，在商业 FAA 认证完成前仍未经证明。
