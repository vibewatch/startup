      - number: '4.4'
        title: 资本充足性与财务尽调结论
        blocks:
          - type: paragraph
            body: >-
              Skyryse 于 2026 年 2 月完成超过 $300 million 的超额认购 Series C，投后估值为 $1.15 billion，显著加强了资产负债表。Autopilot Ventures 与
              Fidelity Management & Research Company 共同领投，Qatar Investment Authority、Durable Capital Partners 和 Baron
              Capital Group 参与，使累计股权融资超过 $605 million。这笔大额注资提供了多年运营跑道，可完成 FAA For-Credit 飞行验证，并扩大计划于 2026 年交付的初始 Skyryse
              One 产量。但航空认证项目经常延期，工程消耗率也可能升高。从投资评估角度看，Skyryse 资本充足且有顶级投资人支持，但 $1.15 billion
              估值已计入成功型号认证和快速商业扩张，而公开财务证据尚不存在。关键投资评估障碍包括未经验证的现金消耗率、保密的国防合同金额，以及缺少经审计的毛利率数据。
