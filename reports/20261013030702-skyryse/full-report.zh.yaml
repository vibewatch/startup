      - number: '3.4'
        title: 护城河持久性与现有厂商反应
        blocks:
          - type: paragraph
            body: >-
              Skyryse 的竞争护城河来自专有线传飞控软件、丰富的真实及模拟飞行测试数据，以及与 FAA 认证机构的深度技术配合。公司用 91 天完成 Black Hawk
              集成，证明软件定义架构可以快速升级老旧机体。但长期防御力仍面临挑战。老牌机体制造商拥有数十年的客户关系、已获认证的分销渠道和雄厚工程资源，既能自研线传飞控套件，也能与竞争航空电子供应商合作；Robinson
              同时与 Skyryse 和 Sikorsky 合作就是例子。此外，商业普及还要克服飞行员对自动包线接管的文化性抵触，并确保改装套件毛利能够承受复杂的制造和监管维护要求。
            claimRefs:
              - CP005
