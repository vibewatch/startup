callouts:
- calloutType: insight
  title: Dual-Use Architecture Mitigates Civil Certification Lag
  body: Skyryse's dual-track approach—advancing FAA Part 27 and Part 23 supplemental type certification for civilian fleets
    while demonstrating rapid 91-day military integration on the UH-60 Black Hawk—provides critical operational diversification.
    Military and public safety operators can deploy mission automation under defense airworthiness authorities while civilian
    certification completes formal for-credit flight testing.
  claimRefs:
  - CM001
  - CM003
  - CM005
- calloutType: risk
  title: Commercial Conversion Opaque Beyond Partnership Announcements
  body: While Skyryse has announced prominent fleet partnerships across air medical, public safety, and OEM manufacturing,
    public records lack firm order quantities, non-refundable deposit terms, and recurring software licensing fees. Long-term
    valuation support depends on converting non-binding fleet integration agreements into cash-generative retrofit installations.
  claimRefs:
  - CM006
  - CM007
  - CM014
