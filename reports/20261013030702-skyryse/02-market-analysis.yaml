  title: Market Analysis
  summary: Skyryse targets a $10.5B serviceable rotorcraft and general aviation retrofit market with SkyOS, its universal
    fly-by-wire operating system. While partnerships across air medical, public safety, and the U.S. Army validate commercial
    and defense pull, revenue velocity remains constrained by FAA Part 27 and Part 23 certification timelines and opaque contractual
    conversion economics.
sections:
- id: market-definition-and-boundaries
  title: Market Boundary, Category Scope, and Status-Quo Substitutes
  body: Skyryse operates in the aviation flight automation and fly-by-wire avionics market, defining its core boundary around
    digital flight control computers, simplified vehicle operation (SVO) interfaces, and software-driven flight envelope protection.
    The company's addressable boundary encompasses the replacement of legacy mechanical linkages, cyclic and collective sticks,
    and analog gauges on certified aircraft with an integrated digital architecture. It deliberately excludes raw airframe
    manufacturing, turbine engine overhauls, and structural composite fabrication, positioning SkyOS as an aircraft-agnostic
    software and hardware platform. The status-quo substitute for commercial operators consists of dual human pilot flight
    crews managing complex mechanical controls subject to high cognitive workload during degraded visual environments. In
    business and general aviation, incumbent alternatives are limited to traditional dual-axis autopilots that lack envelope
    protection, automated autorotation, or single-touch emergency autoland capabilities. By transforming existing certified
    type models into software-managed aircraft, Skyryse aims to capture avionics retrofit budgets and OEM factory integration
    fees rather than competing directly with airframe manufacturers.
  claimRefs:
  - CM001
  - CM002
  - CM004
  - CM006
  - CM012
  tableRefs:
  - TM001
- id: addressable-market-sizing-and-models
  title: Constrained Addressable Market Sizing Across Civil, Defense, and OEM Lenses
  body: Sizing the addressable market for SkyOS requires evaluating top-down aerospace avionics benchmarks alongside bottom-up
    fleet counts across Skyryse's announced integration platforms. The global flight deck avionics and flight control system
    total addressable market (TAM) spans $55B to $65B annually, but is heavily dominated by commercial transport airliners
    that fall outside Skyryse's near-term focus. A disciplined serviceable addressable market (SAM) concentrates on the roughly
    35,000 active civil turbine helicopters and military light utility rotorcraft eligible for digital fly-by-wire modernization,
    yielding an addressable equipment and software opportunity of $8.5B to $12.0B across North America and allied nations.
    Within this boundary, Skyryse's serviceable obtainable market (SOM) is anchored by its announced integration agreements
    with Air Methods, United Rotorcraft, CAL FIRE, and the U.S. Army, representing an addressable partner fleet opportunity
    of $650M to $1.2B. Additionally, factory integration on new production aircraft offers recurring OEM revenue, notably
    exemplified by Robinson Helicopter Company's production run-rate of approximately 300 aircraft per year, where the turbine
    R66 accounts for one-third of deliveries. Initial near-term validated run-rates remain constrained to $25M to $35M pending
    production ramp and firm contract conversion.
