- id: buyer-segmentation-and-procurement-pathways
  title: Buyer, User, and Payer Segmentation Across Operating Environments
  body: Adoption of SkyOS is governed by distinct procurement workflows and economic incentives across emergency medical services,
    aerial firefighting, military aviation, and private owner-pilots. In emergency medical services, fleet executives at operators
    like Air Methods make procurement decisions driven by flight safety mandates and the reduction of controlled flight into
    terrain (CFIT) accidents, while reimbursement flows from private healthcare insurers and hospital transport contracts.
    In public safety and wildland firefighting, state agencies such as CAL FIRE acquire aviation assets through state emergency
    disaster appropriations, prioritizing automated hover and landing in degraded visual environments caused by dense smoke.
    Defense procurement follows a dual-use path through U.S. Army program executive offices, where Title 10 procurement and
    RDT&E funding support rapid integration of optionally piloted capabilities and uncrewed intelligence missions, validated
    by Skyryse's 91-day Black Hawk integration. Finally, high-net-worth owner-pilots in corporate and private general aviation
    fund aircraft acquisitions from private capital, responding to simplified touchscreen operations and automated emergency
    recovery systems that lower pilot qualification hurdles.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM005
  - CM007
  - CM009
  - CM010
