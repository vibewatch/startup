companyProfile:
  summary: >-
    Skyryse is a private aviation automation company that develops SkyOS, a universal fly-by-wire flight operating
    system for helicopters and airplanes. The platform replaces conventional mechanical flight controls with triply
    redundant digital control computers, a single-stick cockpit interface, and touchscreen workflows, with deployments
    demonstrated across rotorcraft and fixed-wing aircraft while the company advances FAA certification and defense
    partnerships.
  foundedDate: '2016-01-01'
  founders:
    - name: Mark Groden
      role: Founder and CEO
      background: Doctorate in sensor data fusion and more than 60 aerial automation patents.
      claimRefs:
        - CO008
        - CO001
  foundingLocation: California
  headquarters: El Segundo, California
  productSummary: >-
    SkyOS is an aircraft-agnostic flight operating system that combines triply redundant flight control computers, a
    single 4-axis control stick, touchscreen cockpit workflows, and envelope protection for retrofit and OEM aircraft
    integration.
  customerFocus: Commercial fleet operators, emergency services, defense organizations, OEM partners, and private owner-pilots.
  businessModel: >-
    Skyryse monetizes through aircraft retrofits, OEM integration, defense programs, and ongoing software and support
    layers tied to SkyOS deployments.
  stage: Series C
  fundingStatus: >-
    Raised more than $300 million in a February 2026 Series C at a $1.15 billion post-money valuation, bringing total
