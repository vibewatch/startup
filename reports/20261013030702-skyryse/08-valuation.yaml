- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key Assumptions
  - Valuation / Return Logic
  - Primary Downside Triggers
  - Probability Signal
  rows:
  - - Bull Case
    - FAA certification completed by 2027; rapid scaling of Robinson R66 and Black Hawk retrofits; military attritable fleet
      adoption expands
    - $2.5B - $3.5B valuation at commercial IPO or strategic defense acquisition; 2.2x - 3.0x return on Series C price
    - FAA testing stalls or military budget cuts cancel attritable fixed-wing programs
    - 25%
  - - Base Case
    - Certification achieved in late 2027; steady adoption across specialized civil operators and defense testbeds; modest
      retrofit pacing
    - $1.2B - $1.6B valuation; 1.0x - 1.4x return preserving invested capital with modest valuation growth
    - Supply chain delays for smart actuators or elongated fleet operator retrofitting cycles
    - 55%
  - - Bear Case
    - Prolonged FAA certification delays past 2028; pilot adoption friction limits civil sales; high cash burn forces recapitalization
    - $400M - $600M valuation down-round; 50% - 65% capital impairment for late-stage investors
    - Regulatory pushback on fly-by-wire envelope protections or liquidity exhaustion requiring structured rescue financing
    - 20%
  notes: Scenario analysis modeling expected valuation ranges, return multiples, and operational triggers across 24-36 month
    investment horizons.
