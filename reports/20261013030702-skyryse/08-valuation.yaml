- id: scenario-analysis-and-valuation-distribution
  title: Scenario Analysis and Valuation Distribution
  body: To evaluate potential risk-adjusted return profiles across a three-year investment horizon, we model three operating
    scenarios anchored in certification timing, retrofit conversion, and defense adoption. In the bull case (25% probability),
    Skyryse secures final FAA supplemental type certification by 2027, rapidly scales deliveries of its First Edition Skyryse
    One aircraft priced at $1.8 million, and converts defense partnerships into multi-year recurring procurement programs,
    justifying an exit valuation between $2.5 billion and $3.5 billion. In the base case (55% probability), certification
    completes in late 2027 with measured adoption across specialized utility operators and military flight testbeds, resulting
    in a steady valuation range of $1.2 billion to $1.6 billion that preserves invested capital. In the bear case (20% probability),
    certification delays extend past 2028 while pilot cultural resistance and actuator supply constraints depress retrofit
    deliveries; sustained cash burn under this scenario would trigger a structured recapitalization at a valuation between
    $400 million and $600 million.
  claimRefs:
  - CV001
  - CV002
  - CV005
  - CV006
  - CV010
  - CV012
  - CV013
  - CV014
