  - TV003
- id: diligence-path-and-thesis-break-triggers
  title: Diligence Priorities and Thesis-Break Triggers
  body: 'Prospective investors must prioritize three direct diligence workstreams before considering primary or secondary
    equity participation. First, investors should examine audited financial statements and unit economics under NDA to establish
    exact gross margin profiles for hardware actuators versus recurring SkyOS software licenses. Second, diligence must audit
    the FAA certification timeline, focusing on open certification issue papers and remaining for-credit flight test requirements.
    Third, confirmatory discussions should be conducted with fleet partners—including the U.S. Army, CAL FIRE, and Robinson
    Helicopter—to verify firm order commitments and cancellation provisions. Clear thesis-break triggers include: (1) any
    material FAA certification impasse or redesign requirement for flight control computers; (2) termination or non-renewal
    of flagship defense agreements on King Air or Black Hawk programs; (3) failure to convert initial Skyryse One reservations
    into completed commercial deliveries; or (4) unplanned cash burn acceleration requiring structured debt or punitive preference
    equity.'
