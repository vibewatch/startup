- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Core Thesis Argument
  - Anti-Thesis Counterargument
  - Validation Milestone
  rows:
  - - Technology Platform
    - SkyOS universal fly-by-wire replaces complex mechanical controls with smart actuators across helicopters and airplanes
    - Integration across varied airframes introduces software certification complexity and maintenance overhead
    - FAA full type certification and airworthiness approvals on multiple aircraft models
  - - Dual-Use Market Pull
    - Strong demand from defense (U.S. Army, special ops attritable aircraft) and civil operators (CAL FIRE, EMS)
    - Defense procurement cycles are volatile and civil operators face high fleet retrofit capital expenditure hurdles
    - Conversion of signed agreements and MOUs into firm, funded procurement orders
  - - Pilot Adoption
    - Simplified single-stick and touchscreen interface lowers pilot training burden and enhances flight envelope protection
    - Experienced commercial and military pilots resist relinquishing physical mechanical authority to automated software
    - Operator feedback and flight hours accumulated in real-world for-credit and operational trials
  - - Unit Economics & Scale
    - Software-defined avionics enable high gross margin recurring licensing once base aircraft integration is certified
    - Upfront integration engineering requires extensive non-recurring engineering costs and custom certification testing
    - Demonstration of scalable retrofit margins exceeding 50% across standardized production lines
  notes: Evaluation of core investment pillars comparing expansion opportunities against operational, regulatory, and adoption
    headwinds.
