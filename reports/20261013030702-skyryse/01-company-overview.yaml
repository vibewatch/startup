  title: Valuation Disconnect and Commercial Proof Gaps
  body: While Skyryse commands a $1.15 billion post-money valuation supported by premier institutional capital, the company
    has not published verified commercial revenue, unit backlog conversion, or gross margin figures, while facing end-user
    friction from military pilots resisting fully automated flight controls.
  claimRefs:
