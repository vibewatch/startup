company:
  name: Skyryse
chapter:
  number: 1
  title: Company Overview
  summary: Skyryse is an aerospace automation company developing SkyOS, a universal software-defined flight operating system
    with triply redundant fly-by-wire controls designed to replace mechanical linkages in helicopters and airplanes. Founded
    in 2016 by CEO Mark Groden, the company achieved unicorn status in February 2026 with an over-$300M Series C round valuing
    it at $1.15B, supported by more than $605M in total equity from Autopilot Ventures, Fidelity, and QIA. Operating across
    four California sites, Skyryse is executing FAA For-Credit flight testing following 2025 design approval, while expanding
    dual-use defense initiatives through a June 2026 uncrewed R66 UAS partnership with Robinson Helicopter.
sections:
- id: identity-and-operating-footprint
  title: Corporate Identity, Product Architecture, and Operating Footprint
  body: Skyryse, Inc. is an aerospace automation company headquartered in El Segundo, California, founded in 2016 by Dr. Mark
    Groden. The company develops SkyOS, an aircraft-agnostic, software-defined flight operating system engineered to replace
    traditional mechanical flight linkages with digital fly-by-wire automation. SkyOS integrates primary flight controls,
    vehicle systems, and envelope protection through triply redundant flight control computers designed to satisfy the Federal
    Aviation Administration's 10⁻⁹ catastrophic failure probability requirements. In the cockpit, complex mechanical yokes,
    cyclic sticks, and rudder pedals are replaced with a single four-axis flight control stick and two touchscreen interfaces,
    allowing pilots to initiate engine start, pickup, hover, and setdown procedures through standardized touch gestures. Operating
    across four dedicated California facilities—comprising corporate headquarters and advanced labs in El Segundo, aircraft
    systems integration in Hawthorne, and flight line testing in Camarillo—Skyryse maintains a private disclosures posture,
    withholding commercial revenue, unit margins, and customer deposit figures.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO015
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Founder Leadership, Governance, and Regulatory Pedigree
  body: Skyryse operates under founder-led governance centered on Chief Executive Officer Mark Groden, who holds a doctorate
    in sensor data fusion and over sixty aerial automation patents. Groden serves as the principal technical visionary and
    public spokesperson, creating acute key-person exposure for institutional backers given his direct ownership of core system
    architectural patents and flight automation design philosophies. To mitigate regulatory clearance bottlenecks and certification
    execution risk, Skyryse has assembled an influential advisory board comprising veteran aviation regulators and operational
    leaders. Advisory participants include former FAA Certification Chief Lirio Liu, former FAA Chief Counsel Marc Nichols,
    former National Transportation Safety Board Vice Chairman Bruce Landsberg, and former NASA Administrator Dan Goldin. This
    regulatory bench provides strategic guidance as the company navigates the FAA's rigorous commercial aircraft type certification
    pathway, ensuring system airworthiness compliance aligns directly with federal safety oversight frameworks.
  claimRefs:
  - CO001
  - CO008
  - CO009
  tableRefs:
  - TO002
- id: capitalization-and-stakeholder-syndicate
  title: Capitalization Structure, Valuation, and Stakeholder Syndicate
  body: In February 2026, Skyryse completed a Series C financing exceeding $300 million that escalated the company's post-money
    valuation to $1.15 billion, establishing it as a venture-backed aviation automation unicorn. The transaction brought Skyryse's
    cumulative equity capital raised across all financing rounds to more than $605 million. The Series C round was co-led
    by venture capital firm Autopilot Ventures and returning institutional asset manager Fidelity Management & Research Company,
    with legal counsel provided by Latham & Watkins LLP. The syndicate attracted diverse institutional and sovereign capital,
    including the Qatar Investment Authority, ArrowMark Partners, Atreides Management, BAM Elevate, Baron Capital Group, Durable
    Capital Partners, Positive Sum, Rokos Capital Management's RCM Private Markets Fund, and Woodline Partners, joining early
    backer Bill Ford. However, the $1.15 billion valuation prices in substantial commercial scaling ahead of verified revenue
    generation, as the company maintains strict confidentiality over unit economics, cash burn, and balance sheet runway.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO015
  tableRefs:
  - TO003
- id: operational-milestones-and-defense-expansion
  title: Flight Automation Milestones, FAA Certification, and Defense Trajectory
  body: Skyryse's technical validation path has progressed through successive platform demonstrations from initial Robinson
    R44 helicopter testing in 2017 to military airframe integrations. In October 2024, the FAA granted a Special Airworthiness
    Certificate for the first pre-production Skyryse One aircraft, followed in 2025 by final FAA design approval for SkyOS
    flight control computers, enabling entry into formal FAA For-Credit flight testing. Demonstrating cross-platform universality,
    Skyryse completed the maiden flight of a SkyOS-equipped Cirrus SR22 airplane in October 2025 and conducted automated pickup,
    hover, and setdown of a retrofitted UH-60 Black Hawk helicopter in December 2025 following a rapid 91-day integration.
    In June 2026, Robinson Helicopter Company and Skyryse announced a strategic teaming agreement to manufacture an autonomous,
    uncrewed R66 rotary-wing unmanned aerial system for defense intelligence, surveillance, reconnaissance, and launched-effects
    missions. Nevertheless, defense deployment confronts operational hurdles, including military pilot reluctance toward automated
    control takeover and competing platform partnerships like Robinson's collaboration with Sikorsky.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
