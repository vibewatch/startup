  title: Customers
  summary: Skyryse targets commercial fleet operators, defense agencies, and private aviators through retrofit partnerships
    and dual-use OEM agreements, but production adoption remains gated by FAA supplemental type certification and unproven
    reservation-to-delivery economics.
sections:
- id: customer-segmentation-and-buyer-economics
  title: Customer Base Segmentation and Buyer Economics
  body: 'Skyryse defines its target market across four primary customer segments: public safety and emergency agencies, military
    and defense operators, commercial fleet operators, and private owner-pilots. The core economic proposition across each
    tier centers on retrofitting legacy airframes with SkyOS to reduce pilot training friction and eliminate aerodynamic accidents
    through dynamic envelope protection. In the commercial and emergency medical sectors, fleet operators such as Air Methods
    and United Rotorcraft evaluate SkyOS as a standardized avionics suite capable of modernizing diverse helicopter models
    without requiring the capital expense of procuring clean-sheet aircraft. For individual owner-pilots, the Skyryse One
    retrofit promises a simplified single-stick and touchscreen interface that lowers barriers to rotorcraft flight. However,
    across all customer segments, the willingness to transition from non-binding reservations to paid retrofit installations
    remains unproven pending commercial FAA certification.

    '
  claimRefs:
  - CU001
  - CU002
  - CU011
  tableRefs:
  - TU001
- id: adoption-trajectory-and-flight-milestones
  title: Adoption Trajectory and Production Milestones
  body: 'The adoption trajectory of Skyryse has transitioned from early law enforcement trials to flight demonstrations across
    diverse aircraft classes. In 2016 and 2017, Skyryse trialed an initial flight automation system on a Robinson R44 with
    first responders and police in Tracy, California, establishing early operational proofs of concept. Between 2024 and 2026,
    Skyryse progressed into FAA for-credit flight testing on its flagship Skyryse One demonstrator. In December 2025, the
    company achieved an automated pickup, hover, and setdown of a Sikorsky UH-60 Black Hawk after an intensive 91-day integration,
    demonstrating platform portability on heavy utility rotorcraft. In October 2025, Skyryse completed the debut flight of
    SkyOS on a Cirrus SR22 single-engine airplane, validating the universal architecture on fixed-wing platforms. While these
    technical demonstrations establish cross-platform feasibility, they represent development milestones rather than revenue-generating
    customer deliveries.

    '
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU012
  tableRefs:
  - TU002
- id: customer-proof-and-named-partnerships
  title: Customer Proof and Partner Relationships
  body: 'Skyryse has announced integration agreements spanning commercial, defense, and public safety organizations. In June
    2026, the company formed a strategic partnership with Robinson Helicopter Company to manufacture an uncrewed rotary-wing
    aerial system (RWUAS) based on the turbine-powered R66. Robinson brings high-volume manufacturing capacity of roughly
    300 helicopters annually, offering an industrial pathway to produce autonomous aircraft at scale. On the defense front,
    Skyryse announced an agreement to deliver uncrewed, attritable King Air aircraft for U.S. military special operations
    in contested environments, expanding its backlog alongside Black Hawk automation demonstrations. Furthermore, announced
    fleet relationships with CAL FIRE, Mitsubishi Corporation, and air medical providers Air Methods and United Rotorcraft
    span platforms including the Airbus H-125, H-130, Bell 407, and Pilatus PC-12. Despite these high-profile references,
    all announced customer relationships operate as collaborative developmental or demonstration partnerships rather than
    firm production delivery contracts.

    '
  claimRefs:
  - CU003
  - CU008
  - CU010
  - CU014
  tableRefs:
  - TU003
- id: retention-expansion-and-concentration-risks
  title: Retention Durability, Expansion Friction, and Concentration Risks
  body: 'Assessing customer retention durability and expansion dynamics is constrained by the absence of publicly disclosed
    financial and operating metrics. Skyryse discloses neither net revenue retention, churn rates, contract values, nor deposit-to-order
    conversion percentages. The company''s expansion strategy relies on land-and-expand dynamics within multi-aircraft fleet
    operators and defense commands. However, commercial scaling encounters substantial regulatory and operational friction:
    aviation safety automation requires exhaustive validation across thousands of software edge cases to secure FAA Supplemental
    Type Certification (STC), creating prolonged adoption lag. Furthermore, military and professional pilots frequently exhibit
    cultural resistance toward automated flight controls, prioritizing direct tactile override in high-stakes tactical environments.
    Until FAA certification clears and installed aircraft counts materialize, customer concentration remains skewed toward
    research partnerships and government flight trials.

    '
  claimRefs:
  - CU007
  - CU009
  - CU013
  figureRefs:
  - FU001
