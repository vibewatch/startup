callouts:
- calloutType: insight
  title: Dual-Use Retrofit Strategy Reduces Go-To-Market Friction
  body: 'By developing SkyOS as an aircraft-agnostic retrofit for proven airframes like the Robinson R66 and UH-60 Black Hawk
    rather than building a bespoke aircraft, Skyryse leverages existing customer type ratings and established maintenance
    ecosystems.

    '
  claimRefs:
  - CU001
  - CU003
  - CU011
- calloutType: risk
  title: Certification Dependencies Stall Revenue Conversion
  body: 'Commercial and defense partner agreements currently function as development and flight demonstration partnerships;
    actual fleet deployments and cash flow generation cannot scale until FAA supplemental type certification is finalized.

    '
