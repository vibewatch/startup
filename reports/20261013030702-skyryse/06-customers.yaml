figures:
- id: FU001
  title: Customer adoption journey and expansion map
  type: journey-map
  summary: Adoption journey for SkyOS across operator evaluation, certification milestones, retrofit installation, and fleet
    expansion.
  data:
    items:
    - label: 1. Operator Evaluation
      touchpoints:
      - Executive briefings
      - Flight simulator demonstrations
      - Workload reduction modeling
      detail: Operators evaluate simplified vehicle operations and safety envelope protection against legacy pilot training
        burdens.
    - label: 2. Letter of Intent & Reservation
      touchpoints:
      - Deposit agreements
      - Fleet conversion planning
      - Aircraft availability scheduling
      detail: Commercial operators and private buyers secure conversion slots for Skyryse One and fleet retrofit programs.
    - label: 3. Flight Demonstration & Pilot Program
      touchpoints:
      - Flight test telemetry review
      - Automated hover and landing demos
      - Mission scenario evaluations
      detail: Defense agencies and public safety bodies test SkyOS capabilities on platforms such as the Black Hawk and Cirrus
        SR22.
    - label: 4. FAA Airworthiness Certification
      touchpoints:
      - Supplemental Type Certification (STC)
      - For-credit flight verification
      - Flight control computer compliance
      detail: Critical gate where FAA formal approval is required before retrofit kits can be installed in revenue service.
    - label: 5. Fleet Retrofit & Commissioning
      touchpoints:
      - MRO installation (91-day cycle)
      - Avionics harness integration
      - Pilot transition briefing
      detail: Hardware installation of fly-by-wire flight control computers and touchscreens at maintenance centers.
    - label: 6. Fleet Expansion & Autonomous Operations
      touchpoints:
      - Cross-platform software deployment
      - Uncrewed aerial systems (UAS)
      - Emergency autoland activation
      detail: Customers expand SkyOS across mixed rotorcraft and fixed-wing fleets, unlocking uncrewed or optionally piloted
        operations.
  approximationNotes: Journey stages model typical aviation fleet retrofit lifecycles based on announced Skyryse partner integration
    phases.
