      - number: '1.4'
        title: Flight Automation Milestones, FAA Certification, and Defense Trajectory
        blocks:
          - type: paragraph
            body: >-
              Skyryse's technical validation path has progressed through successive platform demonstrations from initial
              Robinson R44 helicopter testing in 2017 to military airframe integrations. In October 2024, the FAA
              granted a Special Airworthiness Certificate for the first pre-production Skyryse One aircraft, followed in
              2025 by final FAA design approval for SkyOS flight control computers, enabling entry into formal FAA
              For-Credit flight testing. Demonstrating cross-platform universality, Skyryse completed the maiden flight
              of a SkyOS-equipped Cirrus SR22 airplane in October 2025 and conducted automated pickup, hover, and
              setdown of a retrofitted UH-60 Black Hawk helicopter in December 2025 following a rapid 91-day
              integration. In June 2026, Robinson Helicopter Company and Skyryse announced a strategic teaming agreement
              to manufacture an autonomous, uncrewed R66 rotary-wing unmanned aerial system for defense intelligence,
              surveillance, reconnaissance, and launched-effects missions. Nevertheless, defense deployment confronts
              operational hurdles, including military pilot reluctance toward automated control takeover and competing
              platform partnerships like Robinson's collaboration with Sikorsky.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
