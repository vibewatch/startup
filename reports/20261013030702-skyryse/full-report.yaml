              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Use Certification Architecture
            body: >
              Skyryse's choice to develop a human-rated, optionally piloted fly-by-wire foundation enables a dual-track
              deployment model. Civil airframes pursue commercial FAA Supplemental Type Certification (STC), while
              military and disaster-response platforms such as the UH-60 Black Hawk and CAL FIRE aircraft operate under
              Public Aircraft Operations (PAO) frameworks, generating operational flight data in parallel with civil
              certification.
            calloutType: insight
            claimRefs:
              - CE002
              - CE005
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >
              Skyryse defines its target market across four primary customer segments: public safety and emergency
              agencies, military and defense operators, commercial fleet operators, and private owner-pilots. The core
              economic proposition across each tier centers on retrofitting legacy airframes with SkyOS to reduce pilot
              training friction and eliminate aerodynamic accidents through dynamic envelope protection. In the
              commercial and emergency medical sectors, fleet operators such as Air Methods and United Rotorcraft
              evaluate SkyOS as a standardized avionics suite capable of modernizing diverse helicopter models without
              requiring the capital expense of procuring clean-sheet aircraft. For individual owner-pilots, the Skyryse
              One retrofit promises a simplified single-stick and touchscreen interface that lowers barriers to
              rotorcraft flight. However, across all customer segments, the willingness to transition from non-binding
              reservations to paid retrofit installations remains unproven pending commercial FAA certification.
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
