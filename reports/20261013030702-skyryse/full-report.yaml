      - number: '6.3'
        title: Customer Proof and Partner Relationships
        blocks:
          - type: paragraph
            body: >
              Skyryse has announced integration agreements spanning commercial, defense, and public safety
              organizations. In June 2026, the company formed a strategic partnership with Robinson Helicopter Company
              to manufacture an uncrewed rotary-wing aerial system (RWUAS) based on the turbine-powered R66. Robinson
              brings high-volume manufacturing capacity of roughly 300 helicopters annually, offering an industrial
              pathway to produce autonomous aircraft at scale. On the defense front, Skyryse announced an agreement to
              deliver uncrewed, attritable King Air aircraft for U.S. military special operations in contested
              environments, expanding its backlog alongside Black Hawk automation demonstrations. Furthermore, announced
              fleet relationships with CAL FIRE, Mitsubishi Corporation, and air medical providers Air Methods and
              United Rotorcraft span platforms including the Airbus H-125, H-130, Bell 407, and Pilatus PC-12. Despite
              these high-profile references, all announced customer relationships operate as collaborative developmental
              or demonstration partnerships rather than firm production delivery contracts.
            claimRefs:
              - CU003
