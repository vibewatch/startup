      - number: '6.4'
        title: Retention Durability, Expansion Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Assessing customer retention durability and expansion dynamics is constrained by the absence of publicly
              disclosed financial and operating metrics. Skyryse discloses neither net revenue retention, churn rates,
              contract values, nor deposit-to-order conversion percentages. The company's expansion strategy relies on
              land-and-expand dynamics within multi-aircraft fleet operators and defense commands. However, commercial
              scaling encounters substantial regulatory and operational friction: aviation safety automation requires
              exhaustive validation across thousands of software edge cases to secure FAA Supplemental Type
              Certification (STC), creating prolonged adoption lag. Furthermore, military and professional pilots
              frequently exhibit cultural resistance toward automated flight controls, prioritizing direct tactile
              override in high-stakes tactical environments. Until FAA certification clears and installed aircraft
              counts materialize, customer concentration remains skewed toward research partnerships and government
              flight trials.
            claimRefs:
