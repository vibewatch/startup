      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Use Retrofit Strategy Reduces Go-To-Market Friction
            body: >
              By developing SkyOS as an aircraft-agnostic retrofit for proven airframes like the Robinson R66 and UH-60
              Black Hawk rather than building a bespoke aircraft, Skyryse leverages existing customer type ratings and
              established maintenance ecosystems.
            calloutType: insight
            claimRefs:
              - CU001
