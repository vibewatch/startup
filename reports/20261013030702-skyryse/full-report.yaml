  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: FAA Part 27 Special Conditions and Regulatory Certification Exposure
        blocks:
          - type: paragraph
            body: >-
              Skyryse's fundamental regulatory challenge stems from introducing digital fly-by-wire flight controls into
              normal category rotorcraft historically governed by mechanical linkage standards. Under 14 CFR Part 27,
              existing airworthiness regulations were drafted around rudimentary pushrod controls and do not contain
              safety standards for full fly-by-wire architectures. In April 2026, the FAA published proposed Special
              Conditions (Notice No. 27-26-01-SC, Docket FAA-2025-5245) establishing new certification requirements for
              Skyryse's modification of the Robinson R66. Because digital fly-by-wire eliminates physical cyclic
              feedback, the FAA mandated visual annunciation of commanded control positions and operating modes to
              prevent pilot mode confusion. Although Skyryse achieved FAA design approval for its flight control
              computers in 2025 and entered for-credit flight testing, obtaining final Supplemental Type Certification
              remains an open gating milestone before commercial aircraft deliveries can commence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
      - number: '7.2'
        title: Fly-by-Wire Failure Modes, Human Factors, and Operational Reliability
        blocks:
          - type: paragraph
            body: >-
              Operating an aircraft-agnostic software flight operating system creates distinct technical failure modes
              across flight control software integrity, sensor fusion, and pilot interaction. Skyryse engineered SkyOS
              with triple redundant flight control computers targeting a catastrophic failure probability below 10^-9
              per flight hour. However, the elimination of mechanical backup introduces severe human-factors risks,
              particularly during degraded operating modes or abrupt automated handoffs. Defense aviators and commercial
              utility operators express persistent skepticism regarding software-defined flight controls that prevent
              manual mechanical override during emergency situations. While Skyryse has logged over 2,800 crewed flight
              test hours and 10,000 simulated flight hours—including automated autorotation and emergency autoland
              demonstrations—scaling software across divergent platforms from the Robinson R66 to the UH-60 Black Hawk
              and Cirrus SR22 expands the risk of unmodeled aerodynamic corner cases.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
      - number: '7.3'
        title: Airframe OEM Dependencies and Supply Chain Concentration
        blocks:
          - type: paragraph
            body: >-
              Skyryse's commercial go-to-market strategy depends heavily on third-party airframe manufacturers, creating
              substantial counterparty concentration risk. The company's primary commercial vehicle, the Skyryse One,
              relies exclusively on Robinson Helicopter Company for new R66 airframes and retrofit coordination.
              Robinson produces approximately 300 total aircraft annually, with the turbine-powered R66 representing
              roughly one-third of output, creating a theoretical ceiling on annual production scaling. Additionally,
              Robinson's unmanned division has partnered simultaneously with Sikorsky on the competing TURBINETRUCK
              utility rotorcraft UAS, introducing strategic channel conflict. On defense programs, Skyryse's integration
              onto Army Black Hawks and uncrewed attritable airplanes faces elongated federal procurement timelines and
              defense budget competition. Any operational disruption at Robinson or shift in military procurement
              priorities directly threatens Skyryse's projected delivery volume.
            claimRefs:
              - CR006
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR012
              - CR013
      - number: '7.4'
        title: Pre-Revenue Capital Burn, Valuation Pricing, and Diligence Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              Skyryse is capitalized with over $605 million in lifetime equity financing, including a $300 million
              Series C closed in February 2026 at a post-money valuation of $1.15 billion. However, this valuation
              capitalizes substantial future software-defined aviation adoption before the company has demonstrated
              recurring commercial delivery revenue. With heavy ongoing expenditures required for for-credit flight test
              operations, avionics production tooling, and engineering overhead across helicopter and fixed-wing
              platforms, cash burn is substantial. If final FAA certification slips or conversion of prospective fleet
              reservations stalls, Skyryse risks significant multiple compression or down-round financing. Clear
              investment diligence kill triggers must monitor FAA issue paper closure velocity, flight test anomalies,
              and Robinson airframe delivery cadence.
            claimRefs:
              - CR007
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Novelty in Part 27 Fly-by-Wire Certification
            body: >-
              The FAA's determination that existing 14 CFR Part 27 airworthiness regulations lack adequate safety
              standards for digital fly-by-wire controls underscores Skyryse's foundational regulatory hurdle. Replacing
              mechanical cyclic pushrods eliminates physical tactile feedback, requiring dedicated visual displays of
              commanded positions and operating modes to prevent pilot mode confusion.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Diligence Kill Triggers for Ongoing Flight Testing
            body: >-
              Investors must establish explicit kill criteria tied to FAA for-credit flight testing milestones. Any
              failure to achieve final Part 27 STC issuance within scheduled cash runway, or negative human-factors
              findings regarding pilot situational awareness during degraded flight control modes, represents an
              immediate thesis-break trigger.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Financing Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Skyryse reached a $1.15 billion post-money valuation in early 2026 following a Series C financing round of
              over $300 million led by Autopilot Ventures and returning backer Fidelity Management & Research Company.
              This capital infusion brought cumulative equity financing to over $605 million, capitalizing the company
              to complete FAA certification and scale its SkyOS fly-by-wire operating system across civilian and defense
              platforms. The core investment thesis rests on SkyOS serving as a universal, software-defined avionics
              standard that replaces complex mechanical flight linkages with smart actuators, reducing pilot workload
              and eliminating mechanical single points of failure. The company demonstrated significant technical
              momentum in 2025 by securing FAA final design approval for its flight control computers and successfully
              executing automated pickup, hover, and landing on a UH-60 Black Hawk helicopter after a rapid 91-day
              integration. However, the anti-thesis emphasizes that at a $1.15 billion private valuation without
              disclosed recurring revenue or gross margin metrics, late-stage investors are paying a steep software-like
              multiple for what remains a capital-intensive aerospace integration model subject to stringent
              airworthiness verification.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: Recommendation Stance and Analytical Framework
        blocks:
          - type: paragraph
            body: >-
              We assign Skyryse an overall recommendation of track with medium confidence, a high risk rating, and a
              stretched valuation stance. The track recommendation balances compelling dual-use technology validation
              against valuation risk and adoption headwinds. On the technical and commercial axis, Skyryse has achieved
              notable validation: the FAA has advanced SkyOS into for-credit flight testing, and commercial partners
              including Air Methods, United Rotorcraft, and Robinson Helicopter have committed to integration programs
              across helicopter and fixed-wing fleets. Furthermore, defense agreements to deliver uncrewed attritable
              airplanes for U.S. military special operations establish high-priority government market demand.
              Conversely, the high risk rating is driven by unproven commercial conversion rates, long regulatory
              gestation cycles, and documented pilot hesitation regarding full digital fly-by-wire authority in critical
              operating regimes. Because public financial data remains undisclosed, entry at the current $1.15 billion
              valuation offers limited margin of safety, making direct investment prudent only upon verified commercial
              deliveries or at a meaningful discount.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: Scenario Analysis and Valuation Distribution
        blocks:
          - type: paragraph
            body: >-
              To evaluate potential risk-adjusted return profiles across a three-year investment horizon, we model three
              operating scenarios anchored in certification timing, retrofit conversion, and defense adoption. In the
              bull case (25% probability), Skyryse secures final FAA supplemental type certification by 2027, rapidly
              scales deliveries of its First Edition Skyryse One aircraft priced at $1.8 million, and converts defense
              partnerships into multi-year recurring procurement programs, justifying an exit valuation between $2.5
              billion and $3.5 billion. In the base case (55% probability), certification completes in late 2027 with
              measured adoption across specialized utility operators and military flight testbeds, resulting in a steady
              valuation range of $1.2 billion to $1.6 billion that preserves invested capital. In the bear case (20%
              probability), certification delays extend past 2028 while pilot cultural resistance and actuator supply
              constraints depress retrofit deliveries; sustained cash burn under this scenario would trigger a
              structured recapitalization at a valuation between $400 million and $600 million.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Diligence Priorities and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Prospective investors must prioritize three direct diligence workstreams before considering primary or
              secondary equity participation. First, investors should examine audited financial statements and unit
              economics under NDA to establish exact gross margin profiles for hardware actuators versus recurring SkyOS
              software licenses. Second, diligence must audit the FAA certification timeline, focusing on open
              certification issue papers and remaining for-credit flight test requirements. Third, confirmatory
              discussions should be conducted with fleet partners—including the U.S. Army, CAL FIRE, and Robinson
              Helicopter—to verify firm order commitments and cancellation provisions. Clear thesis-break triggers
              include: (1) any material FAA certification impasse or redesign requirement for flight control computers;
              (2) termination or non-renewal of flagship defense agreements on King Air or Black Hawk programs; (3)
              failure to convert initial Skyryse One reservations into completed commercial deliveries; or (4) unplanned
              cash burn acceleration requiring structured debt or punitive preference equity.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track Stance on Stretched Valuation
            body: >-
              While Skyryse has demonstrated breakthrough aviation automation and achieved critical FAA design
              milestones, the $1.15B Series C valuation prices in significant commercial scaling ahead of audited
              financial proof. Investors should track certification progress and await commercial delivery verification
              before committing capital.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
          - type: callout
            title: Pilot Automation Friction and Capital Intensity
            body: >-
              Dual-use scaling across military and civilian markets faces dual headwinds: entrenched pilot cultural
              preference for physical manual controls and the substantial ongoing capital requirements of aerospace
              flight testing and airframe integration.
            calloutType: risk
            claimRefs:
              - CV002
              - CV010
