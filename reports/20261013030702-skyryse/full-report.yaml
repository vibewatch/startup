            title: Certification Dependencies Stall Revenue Conversion
            body: >
              Commercial and defense partner agreements currently function as development and flight demonstration
              partnerships; actual fleet deployments and cash flow generation cannot scale until FAA supplemental type
              certification is finalized.
            calloutType: risk
            claimRefs:
