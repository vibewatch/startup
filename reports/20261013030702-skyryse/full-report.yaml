              - CM010
      - number: '2.4'
        title: Growth Drivers, Certification Bottlenecks, and Adoption Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption momentum for SkyOS is catalyzed by severe pilot shortages across commercial aviation, expanding
              dual-use military requirements for autonomous logistics, and federal initiatives such as the U.S.
              Department of Transportation's National Advanced Air Mobility Strategy. However, market penetration faces
              substantial operational and regulatory friction. Supplemental Type Certification (STC) under FAA Part 27
              and Part 23 requires rigorous verification, where flight control computers must satisfy catastrophic 10^-9
              failure probability thresholds. Although the FAA granted final design approval for SkyOS flight control
              computers in 2025 and issued a Special Airworthiness Certificate for Skyryse One, formal for-credit flight
              testing remains ongoing. Beyond certification, fleet operators face significant aircraft downtime and
              capital outlay during fly-by-wire hardware installation, alongside pilot resistance to digital
              single-stick controls replacing mechanical linkages. Furthermore, critical diligence gaps remain: public
              announcements omit contractual pricing models, maintenance royalty structures, and the proportion of
              non-binding fleet reservations that convert into binding purchase orders, leaving near-term revenue
              realization subject to private execution verification.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
              - CM013
              - CM014
