      - number: '4.3'
        title: Cost Structure and Unit Economics Opacity
        blocks:
          - type: paragraph
            body: >-
              The economic feasibility of SkyOS depends on hardware integration costs, flight computer manufacturing
              expenses, and ongoing flight test overhead relative to unit sales prices. Traditional avionics and
              fly-by-wire retrofits carry substantial bill-of-materials costs, including triple-redundant flight control
              computers, electromechanical actuators, sensor suites, and touchscreen displays. Robinson Helicopter
              manufactures roughly 300 civil helicopters annually, establishing a manufacturing benchmark where base
              Robinson R66 airframes trade above $1 million. However, Skyryse has not publicly released realized unit
              selling prices, component manufacturing costs, or installation labor requirements for Skyryse One
              conversions. In defense applications, pilot preference for manual control override in high-threat
              environments represents a behavioral headwind that may affect deployment pace. Because gross margins and
              customer acquisition costs remain strictly private data, independent financial underwriting must treat
              unit profitability as an unverified diligence gap until commercial shipments commence.
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI013
          - type: table
            tableRef: TI003
