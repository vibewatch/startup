        - Single 4-axis control stick and dual interactive touchscreen displays
        - Translates pilot intent into digital commands; provides flight telemetry
        - High-reliability avionics power buses and display touch digitizers
        - Cockpit display glare, software display latency, or digitizer failure modes
      - - Flight Computing & Processing Layer
        - Triply redundant, dissimilar flight control computers (FCCs)
        - Executes deterministic control laws, sensor fusion, and envelope protection
        - Dissimilar hardware architectures to eliminate common-cause processor faults
        - Unforeseen edge cases in deterministic expert algorithms under severe turbulence
      - - Actuation & Mechanical Interface Layer
        - Patented electromechanical linear actuators
        - Directly drives aerodynamic flight control surfaces and swashplates
        - Redundant electrical power feeds and mechanical pushrod linkages
        - Thermal limits, mechanical gear wear, and actuator jam tolerance requirements
      - - Sensor Fusion & Environmental Sensing
        - Inertial measurement units, GPS, air data computers, radar/terrain sensors
        - Delivers real-time aircraft state estimation and terrain proximity awareness
        - Sensor calibration and multi-sensor data fusion consistency checks
        - Sensor blinding in degraded visual environments (brownout, fog, heavy precipitation)
    notes: >-
