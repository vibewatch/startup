      - number: '2.2'
        title: Constrained Addressable Market Sizing Across Civil, Defense, and OEM Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for SkyOS requires evaluating top-down aerospace avionics benchmarks
              alongside bottom-up fleet counts across Skyryse's announced integration platforms. The global flight deck
              avionics and flight control system total addressable market (TAM) spans $55B to $65B annually, but is
              heavily dominated by commercial transport airliners that fall outside Skyryse's near-term focus. A
              disciplined serviceable addressable market (SAM) concentrates on the roughly 35,000 active civil turbine
              helicopters and military light utility rotorcraft eligible for digital fly-by-wire modernization, yielding
              an addressable equipment and software opportunity of $8.5B to $12.0B across North America and allied
              nations. Within this boundary, Skyryse's serviceable obtainable market (SOM) is anchored by its announced
              integration agreements with Air Methods, United Rotorcraft, CAL FIRE, and the U.S. Army, representing an
              addressable partner fleet opportunity of $650M to $1.2B. Additionally, factory integration on new
              production aircraft offers recurring OEM revenue, notably exemplified by Robinson Helicopter Company's
              production run-rate of approximately 300 aircraft per year, where the turbine R66 accounts for one-third
              of deliveries. Initial near-term validated run-rates remain constrained to $25M to $35M pending production
              ramp and firm contract conversion.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
