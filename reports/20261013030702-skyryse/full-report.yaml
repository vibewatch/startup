      - number: '1.2'
        title: Founder Leadership, Governance, and Regulatory Pedigree
        blocks:
          - type: paragraph
            body: >-
              Skyryse operates under founder-led governance centered on Chief Executive Officer Mark Groden, who holds a
              doctorate in sensor data fusion and over sixty aerial automation patents. Groden serves as the principal
              technical visionary and public spokesperson, creating acute key-person exposure for institutional backers
              given his direct ownership of core system architectural patents and flight automation design philosophies.
              To mitigate regulatory clearance bottlenecks and certification execution risk, Skyryse has assembled an
              influential advisory board comprising veteran aviation regulators and operational leaders. Advisory
              participants include former FAA Certification Chief Lirio Liu, former FAA Chief Counsel Marc Nichols,
              former National Transportation Safety Board Vice Chairman Bruce Landsberg, and former NASA Administrator
              Dan Goldin. This regulatory bench provides strategic guidance as the company navigates the FAA's rigorous
              commercial aircraft type certification pathway, ensuring system airworthiness compliance aligns directly
              with federal safety oversight frameworks.
