  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Skyryse operates in the aviation flight automation and fly-by-wire avionics market, defining its core
              boundary around digital flight control computers, simplified vehicle operation (SVO) interfaces, and
              software-driven flight envelope protection. The company's addressable boundary encompasses the replacement
              of legacy mechanical linkages, cyclic and collective sticks, and analog gauges on certified aircraft with
              an integrated digital architecture. It deliberately excludes raw airframe manufacturing, turbine engine
              overhauls, and structural composite fabrication, positioning SkyOS as an aircraft-agnostic software and
              hardware platform. The status-quo substitute for commercial operators consists of dual human pilot flight
              crews managing complex mechanical controls subject to high cognitive workload during degraded visual
              environments. In business and general aviation, incumbent alternatives are limited to traditional
              dual-axis autopilots that lack envelope protection, automated autorotation, or single-touch emergency
              autoland capabilities. By transforming existing certified type models into software-managed aircraft,
              Skyryse aims to capture avionics retrofit budgets and OEM factory integration fees rather than competing
              directly with airframe manufacturers.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
