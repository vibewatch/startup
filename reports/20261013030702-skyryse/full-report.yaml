              - CU002
              - CU011
      - number: '6.2'
        title: Adoption Trajectory and Production Milestones
        blocks:
          - type: paragraph
            body: >
              The adoption trajectory of Skyryse has transitioned from early law enforcement trials to flight
              demonstrations across diverse aircraft classes. In 2016 and 2017, Skyryse trialed an initial flight
              automation system on a Robinson R44 with first responders and police in Tracy, California, establishing
              early operational proofs of concept. Between 2024 and 2026, Skyryse progressed into FAA for-credit flight
              testing on its flagship Skyryse One demonstrator. In December 2025, the company achieved an automated
              pickup, hover, and setdown of a Sikorsky UH-60 Black Hawk after an intensive 91-day integration,
              demonstrating platform portability on heavy utility rotorcraft. In October 2025, Skyryse completed the
              debut flight of SkyOS on a Cirrus SR22 single-engine airplane, validating the universal architecture on
              fixed-wing platforms. While these technical demonstrations establish cross-platform feasibility, they
              represent development milestones rather than revenue-generating customer deliveries.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
