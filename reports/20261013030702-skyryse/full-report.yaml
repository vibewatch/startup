        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Use Architecture Mitigates Civil Certification Lag
            body: >-
              Skyryse's dual-track approach—advancing FAA Part 27 and Part 23 supplemental type certification for
              civilian fleets while demonstrating rapid 91-day military integration on the UH-60 Black Hawk—provides
              critical operational diversification. Military and public safety operators can deploy mission automation
              under defense airworthiness authorities while civilian certification completes formal for-credit flight
              testing.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM005
          - type: callout
            title: Commercial Conversion Opaque Beyond Partnership Announcements
            body: >-
              While Skyryse has announced prominent fleet partnerships across air medical, public safety, and OEM
              manufacturing, public records lack firm order quantities, non-refundable deposit terms, and recurring
              software licensing fees. Long-term valuation support depends on converting non-binding fleet integration
              agreements into cash-generative retrofit installations.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Skyryse divides into three distinct strategic approaches:
              purpose-built electric vertical takeoff and landing (eVTOL) original equipment manufacturers, specialized
              cargo flight autonomy developers, and incumbent avionics providers. While high-profile advanced air
              mobility startups such as Joby Aviation and Archer Aviation command multibillion-dollar public valuations,
              they are obligated to finance complete aircraft manufacturing, ground battery infrastructure, and novel
              FAA powered-lift type certifications. In contrast, Skyryse focuses exclusively on the software and
              fly-by-wire flight operating system layer, targeting existing civil and military airframes through
              Supplemental Type Certificates. Concurrently, uncrewed flight developers like Reliable Robotics prioritize
              remote piloting for scheduled cargo feeder routes. Incumbents like Sikorsky and Textron are exploring both
              internal autonomous programs and commercial partnerships to protect their airframe franchises against
              software-defined disruption.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
              - CP014
          - type: table
            tableRef: TP001
