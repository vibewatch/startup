      - number: '4.4'
        title: Capital Adequacy and Financial Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Skyryse significantly reinforced its balance sheet in February 2026 by completing an oversubscribed Series
              C funding round exceeding $300 million at a post-money valuation of $1.15 billion. Co-led by Autopilot
              Ventures and Fidelity Management & Research Company, with participation from the Qatar Investment
              Authority, Durable Capital Partners, and Baron Capital Group, the raise increased cumulative equity
              funding to more than $605 million. This substantial capital injection provides multi-year operating runway
              to complete FAA for-credit flight verification and scale initial Skyryse One deliveries scheduled for
              2026. Nevertheless, aviation certification programs are notorious for schedule extensions and elevated
              engineering burn rates. From an underwriting perspective, Skyryse exhibits strong capitalization and
              top-tier investor backing, but the $1.15 billion valuation prices in successful type certification and
              rapid commercial scaling before public financial proof exists. Key underwriting blockers include
              unverified cash burn run-rates, confidential defense contract values, and lack of audited gross margin
              data.
            claimRefs:
