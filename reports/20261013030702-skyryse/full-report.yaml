      - number: '4.2'
        title: Commercial Traction and Flight Certification Progression
        blocks:
          - type: paragraph
            body: >-
              Commercialization velocity in regulated aviation hardware is strictly governed by regulatory milestones.
              Skyryse achieved a pivotal manufacturing milestone in October 2024 when the FAA granted a Special
              Airworthiness Certificate for its first Skyryse One aircraft, authorizing expanded flight operations. This
              progress advanced in 2025 when the FAA approved the final design of SkyOS flight control computers, moving
              the platform into for-credit flight testing. In parallel with civilian certification, Skyryse established
              strategic integration agreements across key aviation verticals. Notable fleet partners include Air Methods
              and United Rotorcraft for emergency medical airframes, the California Department of Forestry and Fire
              Protection (CAL FIRE) for aerial firefighting, and the U.S. Army for rotorcraft pilot workload reduction.
              Furthermore, Skyryse's partnership with Robinson Helicopter provides a dedicated industrial pathway for
              uncrewed rotary-wing aircraft development on the R66 platform. Flight testing has expanded from
              helicopters to fixed-wing aircraft, highlighted by a 91-day integration onto a UH-60 Black Hawk and flight
              validation on a Cirrus SR22 in late 2025.
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI008
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
