chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Architecture, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Skyryse, Inc. is an aerospace automation company headquartered in El Segundo, California, founded in 2016
              by Dr. Mark Groden. The company develops SkyOS, an aircraft-agnostic, software-defined flight operating
              system engineered to replace traditional mechanical flight linkages with digital fly-by-wire automation.
              SkyOS integrates primary flight controls, vehicle systems, and envelope protection through triply
              redundant flight control computers designed to satisfy the Federal Aviation Administration's 10⁻⁹
              catastrophic failure probability requirements. In the cockpit, complex mechanical yokes, cyclic sticks,
              and rudder pedals are replaced with a single four-axis flight control stick and two touchscreen
              interfaces, allowing pilots to initiate engine start, pickup, hover, and setdown procedures through
              standardized touch gestures. Operating across four dedicated California facilities—comprising corporate
              headquarters and advanced labs in El Segundo, aircraft systems integration in Hawthorne, and flight line
              testing in Camarillo—Skyryse maintains a private disclosures posture, withholding commercial revenue, unit
              margins, and customer deposit figures.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
