      - number: '1.3'
        title: Capitalization Structure, Valuation, and Stakeholder Syndicate
        blocks:
          - type: paragraph
            body: >-
              In February 2026, Skyryse completed a Series C financing exceeding $300 million that escalated the
              company's post-money valuation to $1.15 billion, establishing it as a venture-backed aviation automation
              unicorn. The transaction brought Skyryse's cumulative equity capital raised across all financing rounds to
              more than $605 million. The Series C round was co-led by venture capital firm Autopilot Ventures and
              returning institutional asset manager Fidelity Management & Research Company, with legal counsel provided
              by Latham & Watkins LLP. The syndicate attracted diverse institutional and sovereign capital, including
              the Qatar Investment Authority, ArrowMark Partners, Atreides Management, BAM Elevate, Baron Capital Group,
              Durable Capital Partners, Positive Sum, Rokos Capital Management's RCM Private Markets Fund, and Woodline
              Partners, joining early backer Bill Ford. However, the $1.15 billion valuation prices in substantial
              commercial scaling ahead of verified revenue generation, as the company maintains strict confidentiality
              over unit economics, cash burn, and balance sheet runway.
