      - number: '3.3'
        title: Pricing Models, Packaging, and Switching Economics
        blocks:
          - type: paragraph
            body: >-
              Delivery models across aviation automation reflect divergent capital commitments and operator switching
              costs. Clean-sheet eVTOL companies plan vertically integrated passenger transportation networks,
              internalizing aircraft manufacturing and operating risks without selling hardware directly to fleet
              operators. Conversely, incumbent avionics providers package safety upgrades into premium factory-installed
              option tiers on newly produced airframes. Skyryse utilizes a hybrid commercial motion: selling turnkey
              aircraft like the Skyryse One alongside aftermarket retrofit kits for existing rotorcraft fleets like the
              Robinson R66 and UH-60 Black Hawk. For commercial operators and military agencies, retrofitting existing
              assets avoids multimillion-dollar capital replacement cycles and preserves trusted airframes. However,
              operators face transition barriers including aircraft modification downtime, pilot training adjustments,
              and unverified long-term maintenance overhead.
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP008
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP012
      - number: '3.4'
        title: Moat Durability and Incumbent Response Dynamics
        blocks:
          - type: paragraph
            body: >-
              Skyryse’s competitive moat rests on proprietary fly-by-wire flight control software, extensive real-world
              and simulated flight test datasets, and deep technical alignment with FAA certification authorities. By
              demonstrating an agile 91-day integration onto the Black Hawk, the company proved that its
              software-defined architecture can rapidly modernize legacy airframes. Nevertheless, long-term
              defensibility faces meaningful challenges. Established airframe manufacturers retain multi-decade customer
              relationships, certified distribution channels, and substantial engineering resources to develop internal
              fly-by-wire suites or partner with competing avionics suppliers, as evidenced by Robinson’s dual
              engagements with both Skyryse and Sikorsky. Furthermore, widespread commercial adoption requires
              overcoming pilot cultural reluctance toward automated envelope overrides and ensuring that retrofit kit
              gross margins withstand complex manufacturing and regulatory maintenance requirements.
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Retrofit Speed vs. Clean-Sheet Aircraft Certification
            body: >-
              Skyryse’s focus on Supplemental Type Certificates allows the company to leverage established, airworthy
              type certificates from Robinson, Sikorsky, and Cirrus. This regulatory pathway sidesteps the
              multibillion-dollar capital requirements and protracted timeline of certifying brand-new eVTOL airframes,
              creating a faster potential route to commercial scale if FAA issue papers clear smoothly.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP009
          - type: callout
            title: Incumbent Flight-Control Response and Dual-Use Platform Rivalry
            body: >-
              While Skyryse has validated multi-airframe compatibility with its 91-day Black Hawk integration, aerospace
              primes like Sikorsky are vigorously defending military and utility rotorcraft programs with in-house
              autonomy initiatives such as TURBINETRUCK and Matrix technology. Skyryse must maintain superior software
              integration velocity to prevent OEMs from standardizing alternative autonomy stacks.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Skyryse's commercial monetization model centers on three distinct channels: complete new production
              aircraft installations, aftermarket airframe retrofits, and defense mission integrations. The company's
              flagship commercial offering, the Skyryse One, is built on a turbine-powered Robinson R66 airframe and
              features a single-stick, dual-touchscreen fly-by-wire cockpit powered by SkyOS. Skyryse initiated
              commercial customer intake by collecting refundable reservation deposits of $2,500 per delivery slot,
              reporting that its inaugural production edition sold out within six months. Beyond civil general aviation,
              Skyryse targets defense aircraft modernization, leveraging software-driven autonomy and optionally piloted
              vehicle capabilities to address military rotorcraft such as the UH-60 Black Hawk. Long-term
              commercialization plans anticipate lifecycle software support, annual navigation data updates, and fleet
              maintenance subscriptions, although formal recurring SaaS pricing tiers have not been publicly disclosed.
              Because Skyryse remains in the pre-delivery phase pending final FAA certification, reported revenue
              traction consists primarily of customer deposit backlogs rather than realized commercial shipments or GAAP
              revenue.
            claimRefs:
