      - number: '3.2'
        title: Capability, Architecture, and Regulatory Comparison
        blocks:
          - type: paragraph
            body: >-
              Technical differentiation in flight automation depends heavily on control depth, interface simplification,
              and certification scope. Traditional general aviation cockpits rely on complex mechanical linkages,
              requiring pilots to master disparate cyclic, collective, and anti-torque pedal inputs in helicopters or
              yoke and rudder pedals in fixed-wing aircraft. Incumbent safety innovations like Garmin Autoland provide
              critical emergency descent and landing automation but remain dormant during standard flight operations.
              Skyryse’s SkyOS introduces continuous, full-time simplified vehicle operations via digital fly-by-wire
              actuation, a single ergonomic control stick, dual touchscreens, and dynamic envelope protection. Skyryse
              has proven this architecture across both inherently unstable rotorcraft and stable fixed-wing airframes,
              receiving FAA final design approval for its flight control computers and advancing into For-Credit flight
              testing, positioning it well ahead of conceptual competitors in certified flight simplification.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP009
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP013
          - type: figure
