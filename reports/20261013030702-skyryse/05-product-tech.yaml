figures:
- id: FE001
  title: SkyOS Layered Flight Operating System Architecture
  type: stack
  summary: Modular functional stack of SkyOS detailing human interface, computing redundancy, actuation, and airframe integration
    layers.
  data:
    layers:
    - label: Human-Machine Interface Layer
      modules:
      - Single 4-Axis Flight Control Stick
      - Dual Interactive Touchscreen Displays
      - Swipe-to-Command Gesture Interface
      detail: Replaces conventional cyclic, collective, and pedals with simplified touch and single-hand commands.
    - label: Deterministic Flight Management & Safety Layer
      modules:
      - Deterministic Expert Flight Control Laws
      - Dynamic Flight Envelope Protection
      - Universal Emergency Autoland Engine
      detail: Enforces aerodynamic limits and autonomous emergency landing sequences without cloud dependency.
    - label: Triply Redundant Computing Layer
      modules:
      - Flight Control Computer A (FCC 1)
      - Flight Control Computer B (FCC 2)
      - Flight Control Computer C (FCC 3)
      detail: Dissimilar parallel processors validated under DO-178C software and DO-254 complex hardware standards.
    - label: Sensor Fusion & Environmental Awareness Layer
      modules:
      - Multi-Sensor Inertial Measurement Units
      - Air Data Computing & Pitot-Static Arrays
      - Terrain Awareness & Obstacle Detection Sensors
      detail: Provides real-time attitude, airspeed, and terrain spatial data to the flight control computers.
    - label: Electromechanical Actuation Layer
      modules:
      - Patented Direct-Drive Actuators
      - Weight-Neutral Replacement Assemblies
      - Dual-Channel Power Distribution Harness
      detail: Directly manipulates swashplates and control surfaces without hydraulic fluid lines.
    - label: Airframe Integration Layer
      modules:
      - Robinson R66 Turbine Helicopter (Skyryse One)
      - Sikorsky UH-60 Black Hawk Rotorcraft
      - Cirrus SR22 Single-Engine Piston Aircraft
      detail: Universal airframe adaptation delivering identical software control logic across platforms.
  approximationNotes: Layer representation categorizes physical avionics and software logic into modular functional tiers.
