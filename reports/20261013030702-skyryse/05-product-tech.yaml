chapter:
  number: 5
  title: Product & Technology
  summary: Skyryse develops SkyOS, a universal software-driven fly-by-wire flight operating system engineered to replace complex
    mechanical controls with triply redundant computing and an intuitive single-stick touchscreen interface. The company has
    demonstrated its architecture across the Robinson R66, UH-60 Black Hawk, and Cirrus SR22 while advancing formal FAA certification
    testing.
sections:
- id: product-architecture-and-control-laws
  title: Universal Flight Operating System and Triply Redundant Architecture
  body: 'Skyryse positions SkyOS as an aircraft-agnostic flight operating system designed to standardize flight controls across
    diverse rotorcraft and fixed-wing airframes. Rather than bolting supplementary autopilots onto legacy mechanical linkages,
    SkyOS replaces traditional hydraulic and mechanical control runs with triply redundant, dissimilar flight control computers
    (FCCs) paired with an array of electromechanical actuators. In standard operations, three independent computers calculate
    flight control laws in parallel. If an individual flight control computer experiences a fault, the remaining two computers
    sustain complete flight functionality seamlessly. Should a second computer fail, the system directs the pilot to land
    immediately. This architecture is engineered to satisfy stringent FAA airborne software and hardware certification criteria
    under DO-178C, DO-254, and ARP 4754. On the Robinson R66 retrofit installation, the electromechanical actuator array and
    digital avionics harness achieve net-neutral weight relative to the removed mechanical hardware, preserving aircraft useful
    load while establishing a baseline for general aviation and military retrofits.

    '
  claimRefs:
