callouts:
- calloutType: insight
  title: Dual-Use Certification Architecture
  body: 'Skyryse''s choice to develop a human-rated, optionally piloted fly-by-wire foundation enables a dual-track deployment
    model. Civil airframes pursue commercial FAA Supplemental Type Certification (STC), while military and disaster-response
    platforms such as the UH-60 Black Hawk and CAL FIRE aircraft operate under Public Aircraft Operations (PAO) frameworks,
    generating operational flight data in parallel with civil certification.

    '
  claimRefs:
  - CE002
  - CE005
  - CE012
  - CE014
