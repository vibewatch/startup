- id: human-machine-interface-and-operational-envelope
  title: Cockpit Modernization, Dynamic Envelope Protection, and Emergency Autoland
  body: 'The pilot interface for SkyOS consolidates conventional cyclic, collective, and anti-torque pedals into a unified
    human-machine interface consisting of a single 4-axis control stick and two touchscreen displays. Deterministic flight
    control software continuously calculates dynamic flight envelope protection, actively preventing aerodynamic stalls, spatial
    disorientation, over-torque conditions, and dangerous vortex ring states. Routine high-workload maneuvers such as engine
    start, takeoff, stable hover initiation, and landing setdown can be commanded through touch inputs while retaining the
    pilot as the central authority. In March 2026, Skyryse announced plans to introduce an emergency autoland capability within
    SkyOS spanning both rotorcraft and fixed-wing airplanes. Unlike existing commercial autoland systems that operate exclusively
    on fixed-wing airplanes navigating paved runways, SkyOS emergency autoland addresses helicopter dynamics by managing power,
    autorotation entry or powered descent, obstacle clearance, terrain sensing, and touchdown. Furthermore, the human-rated
    fly-by-wire foundation allows airframes to operate with a pilot on board or transition into uncrewed aerial systems (UAS)
    without requiring fundamental redesigns of the flight control actuators or software architecture.

    '
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE002
- id: platform-maturity-and-certification-roadmap
  title: Platform Deployment Breadth, Defense Integration, and Diligence Gaps
  body: 'Skyryse has broadened its deployment roadmap beyond its initial commercial retrofit platform, the turbine-powered
    Skyryse One (Robinson R66). Following a Special Airworthiness Certificate issued by the FAA in October 2024, the FAA granted
    final design approval for the SkyOS flight control computers in 2025, permitting Skyryse to advance into FAA for-credit
    flight verification testing. Across operational demonstrations, Skyryse completed a 91-day integration on a Sikorsky UH-60
    Black Hawk, executing automated pickup, hover, and setdown in December 2025. In October 2025, Skyryse conducted its first
    fixed-wing test flight on a Cirrus SR22. Additionally, in June 2026, Skyryse partnered with Robinson Helicopter Company
    to develop an uncrewed rotary-wing variant of the R66 for defense intelligence, surveillance, and reconnaissance (ISR)
    and air-launched effects (ALE). Beyond these milestones, commercial integration agreements have been announced with partners
    including United Rotorcraft, Air Methods, CAL FIRE, and Mitsubishi Corporation across Airbus H-125, H-130, Bell 407, and
    Pilatus PC-12 aircraft. Crucial diligence gaps remain regarding the precise timeline for FAA Supplemental Type Certification
    (STC), remaining issue papers, open-source developer toolchain support, and lifecycle software maintenance frameworks
    under airline or fleet operating constraints.

    '
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
