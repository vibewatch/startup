            body: >-
              Cornerstone 的采用轨迹主要通过里程碑事件显现，而不是一套干净的经营 KPI 仪表盘。最强的硬信号来自 CUHK / Prince of Wales Hospital 项目披露的 55
              台以上手术，说明系统已经越过一次性演示，进入重复临床使用。第二个重要的 2026 年证明点是 Woodlands Health
              装机，它显示新加坡监管进展已经转化为站点级部署。除了直接医院里程碑，Cornerstone 在教育和活动上的足迹也表明，公司有意先建立外科医生认知，再做广泛收入披露：EAU26 London 活动称触达超过
