      - 驱动因素 / 约束
      - 方向
      - 时间
      - 市场含义
      - 对 Cornerstone 的尽调问题
    rows:
      - - 人口老龄化和慢性病患病率上升
        - 驱动因素
        - 当前且在加速
        - 手术量提高，尤其是泌尿、骨科、妇科；直接扩大需求
        - 核实 Cornerstone 面向老龄化地区（日本、中国）的管线策略
      - - AI 集成和先进影像采用
        - 驱动因素
        - 当前和近期
        - 没有 AI 指导的平台劣势会越来越大；Cornerstone 需要自研技术栈来完成集成
        - 确认 Sentire 路线图是否包含 AI 指导的手术辅助功能
      - - 政府现代化和本土制造商偏好
        - 驱动因素
        - 当前（中国、印度、韩国、日本）
        - 本土进入者受益于采购偏好；压缩西方厂商份额
        - 核实 Cornerstone 是否进入过任何中国政府支持的医院采购项目
      - - 高性价比和模块化平台开发
        - 驱动因素 / 竞争压力
        - 近期
        - 平台性价比门槛正在抬高；模块化设计（CMR Versius）正在重塑预期
        - 索取 Cornerstone 系统定价，以及相对 da Vinci 和 Versius 的总拥有成本对比
      - - 高资本成本和报销缺口
        - 约束
        - 当前且持续
        - 采用范围限于资本充足的医院；二线和农村市场渗透放慢
        - 评估 Cornerstone 是否提供融资、租赁或按使用量付费模式，以降低前期门槛
      - - 外科医生培训要求（20–30 例学习曲线）
        - 约束
        - 当前
        - 采购后充分利用会被延后；医院需要足够培训能力
        - 确认 Cornerstone 的培训吞吐量，以及从安装到具备临床就绪的平均时间
    notes: 驱动因素和约束代表多份市场报告中的分析师共识；除非另有说明，均针对亚太软组织机器人手术市场。
