      - number: '3.2'
        title: 在位者与主要挑战者画像
        blocks:
          - type: paragraph
            body: >-
              Intuitive Surgical 的 da Vinci 产品组合横跨四代系统——da Vinci Xi、X、SP，以及新的 da Vinci 5。2024 年 3 月推出的 da Vinci 5 引入
              Force Feedback 技术和 AI 驱动分析，树立了新的能力标杆。其 FDA 批准适应证覆盖泌尿外科、普外腹腔镜、妇科和普胸外科手术。单季度安装 431 台系统，说明 Intuitive
              的商业速度远超任何挑战者。其关键护城河来自根深蒂固的培训生态（接受 da Vinci
              控制训练的外科医生会在心理上锚定该界面）、器械和耗材锁定（专有器械达到固定使用次数后失效），以及庞大的已发表临床证据基础。MedTech Dive 报道指出，香港早期 Sentire 用户认为其界面与 da
              Vinci 控制相似，这既验证了 da Vinci 作为参考体验的相关性，也表明 Cornerstone 有意降低转换难度。

              Medtronic 的 Hugo RAS 系统于 2026 年完成美国商业化上市。Medtronic 2026 年 3 月获得 FDA 许可，将其 Stealth AXiS
              机器人系统扩展至颅脑和耳鼻喉手术，并加入基于 AI 的导航；这表明 Medtronic 正在打造多系统机器人手术业务，而不是单一平台。Hugo 的定位是普外科中 da Vinci
              的模块化、成本敏感替代方案。Medtronic 拥有分销基础设施、服务组织和医院关系，Hugo 的爬坡速度可能快过任何纯机器人公司；不过，相比 Intuitive，其软组织机器人履历仍有限。

              CMR Surgical 2025 年 4 月融资 2 亿美元，明确用于支持 Versius 在美国扩张和全球商业化。Versius Plus 系统已取得胆囊切除术 FDA 510(k)
              许可，并已提交良性妇科适应证的 510(k)。其模块化设计不需要专用手术室，对无法把一间 OR 固定给机器人手术的医院是真实流程优势；vLimeLite 荧光可视化系统则把 ICG
              成像作为集成标准功能。Versius Plus 生态包含两个数字应用——面向外科医生的 Versius Connect（近实时手术日志）和面向医院的 Versius
              Team（实时仪表盘）——构成一层软件差异化。CMR 的 45,000 台累计病例是真实世界量级里程碑，但仍远小于 Intuitive 的装机基础。
