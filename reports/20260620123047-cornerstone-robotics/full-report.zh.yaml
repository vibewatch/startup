  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              全球手术机器人市场由一个主导性在位者（Intuitive Surgical）、一批融资充足的直接挑战者，以及越来越多瞄准价格可及性缺口的区域新进入者构成。Intuitive Surgical
              约占全球软组织机器人手术病例的 60%，2026 年 Q1 收入 27.7 亿美元，同比增长 23%，且单季度在全球新增安装 431 台 da Vinci
              系统。这种规模形成复利型竞争护城河：更大的装机量带来更多器械和服务收入，进而资助持续研发，拉大与挑战者的能力差距。

              直接挑战者层级已集中到少数融资充足的平台。CMR Surgical（英国 Cambridge）按可衡量临床量看是最活跃的挑战者，其 Versius 平台全球累计 45,000
              台病例，并位居全球使用量第二的机器人手术平台。CMR 2025 年 4 月完成 2 亿美元融资，并取得胆囊切除术 FDA 510(k) 许可，使其成为美国软组织市场中对 Intuitive
              最可信的竞争威胁。Medtronic 经过多年开发后于 2026 年在美国商业化推出 Hugo，首次把全球最大医疗器械公司带入美国市场与 Intuitive 直接竞争。

              区域挑战者已出现，目标是填补亚太和新兴市场的可及性缺口。SS Innovations（印度）借 SSi Mantra 3 主打成本效益和本土制造定位。Cornerstone Robotics 在亚太 / 中国 /
              英国走廊占据类似定位，强调自研、垂直整合，以及在三个司法辖区（中国、欧盟、新加坡）的监管批准；在多数非西方新进入者仍处于临床试验阶段时，这一点尤其突出。因此，竞争格局沿三条轴线分化：规模和装机量（Intuitive
              主导）、美国市场许可和资金深度（CMR、Medtronic），以及具备多司法辖区批准的亚太本土定位（Cornerstone、SS Innovations）。
