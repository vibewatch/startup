            body: >-
              投资案例今天并未破裂，但只有在明确监控纪律下才具备可投性。Cornerstone 已经通过拿下 CE MDR 和新加坡 HSA
              认证、建立医院培训关系、融得大量资本，展现出一定的风险缓释能力。这些是真正的去风险步骤，不是表面信号。即便如此，最高严重度风险仍是可监控，而不是已解决。最重要的 thesis-break 触发项包括：美国 FDA
              路径失败或无限期缺席，重大产品召回或严重安全信号，旗舰学术伙伴流失，暗示资本压力的 down-round 或被迫 bridge，以及阻断中国零部件供应的地缘政治扰动。投资者应把未来 12 到 24
              个月视为验证期，监管进展、质量表现、部署转化和融资韧性都需要同时守住。如果这些信号一起走弱，下行会很快从运营传导到收入假设和估值支撑。
