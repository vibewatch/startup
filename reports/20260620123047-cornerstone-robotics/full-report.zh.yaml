      - number: '4.5'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              公开财务结论是好坏参半。正面看，Cornerstone Robotics
              具备严肃品类参与者画像：已披露融资可观、多市场监管推进、正式制造能力，以及经常性收入模型雏形。负面看，真正投资判断所需的几乎所有指标仍未披露。本次审阅未找到公开收入、ARR、利润率、装机量、使用率、现金余额或经审计财务报表。该缺口尤其重要，因为手术机器人是长尾业务，收入质量取决于服务挂载、手术吞吐、维护强度和长期成本吸收。在独角兽规模融资下，这种不透明对私营医疗科技公司并不罕见，但仍是重大尽调阻断点。下一步尽调很直接：在投资人把这个故事视为完全可融资之前，管理层应提供按收入流拆分的收入桥、分业务线毛利率、系统投放量、手术量、月度烧钱，以及经审计或至少贷款级财务报表。
