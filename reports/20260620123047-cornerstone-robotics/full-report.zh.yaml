      - number: '4.4'
        title: 资本充足性与融资续航
        blocks:
          - type: paragraph
            body: >-
              对 Cornerstone Robotics 来说，最强的公开财务事实不是收入，而是融资。公司似乎已在披露轮次中累计融资约 4.35 亿美元，并在 2025 年 11 月完成约 2
              亿美元融资。对一家私营医疗科技公司而言，这是一笔可观弹药，也很可能是其能够建设制造能力、支持多地理市场并继续推进监管扩张的主要原因。即便如此，已融资金额不等于账上现金。公开记录没有披露当前现金、债务、烧钱速度、营运资本占用或贷款约束义务。可以从基础设施规模和手术机器人行业常态推断方向性烧钱水平，但区间仍很宽，且高度依赖假设。合理结论是，Cornerstone
              看起来有足够资金在短期继续扩张；但在管理层披露系统采用和经常性收入是否正在吸收固定成本之前，公司仍依赖融资。
