            body: >-
              本次审阅的公开材料描述了一个连贯但不完整的架构栈。Cornerstone 称其掌握机械架构、复杂软件算法、电气架构、软件架构和视觉技术；Sentire® 与机器人手术页面则补充了实践中重要的功能部件：5 mm 和
              8 mm
              机器人器械、集成内窥镜成像、冷光源、防雾支持、外科医生控制台手动控制、灵活腕式运动，以及内置震颤过滤。质量页面还将系统定位为完全自研，并由公司控制的设施生产，同时配套三个全球研发中心和六个业务中心。这支持垂直整合假设，但不是完全开放的技术架构。审阅的公开页面没有披露软件安全生命周期标准、网络安全加固模型、更新路径、网络架构，或营销中“实时反馈”背后的机制。制造与供应故事同样只给出方向而非完整清单：材料强调大湾区生产和供应链深度，但未披露零部件层面的集中度、关键供应商和冗余。
