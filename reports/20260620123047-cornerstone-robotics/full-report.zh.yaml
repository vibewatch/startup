              Cornerstone Robotics 的公开单位经济几乎完全依赖基准推断。公司没有披露 Sentire ASP、服务合同价值、器械定价、毛利率、客户生命周期价值或
              CAC。这迫使尽调从竞争对手语境出发。在手术机器人领域，成熟系统是昂贵资本采购，伴随可观维护尾部和经常性器械收入；因此，Sentire
              定价落在高六位数到低七位数美元区间是合理假设，但仍未验证。商业问题不只是医院能否买得起第一套系统，而是使用率能否升到足以让服务和耗材拉动抵消安装与支持成本。从这个意义上看，单位经济方向上可理解，但数字仍不透明。投资人可以勾勒从系统销售到经常性毛利的桥，但还无法验证实际定价、折扣纪律或销售效率。这使投资判断逻辑依赖可比公司，而不是公司披露。
