  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现结构
        blocks:
          - type: paragraph
            body: >-
              虽然 Cornerstone Robotics 没有公布价目表，但它已经呈现出典型手术机器人收入栈的构件。本次审阅的公开记录支持四层变现：Sentire
              平台首台销售、年度或多年期服务和维护、按手术消耗的无菌耗材和器械，以及专业教育或培训服务。这一结构重要，是因为它意味着收入质量最终不只取决于一次性机器人出货，更取决于经常性服务挂载率和手术量拉动。尽调问题在于，公司披露这些活动存在，比披露背后经济性更清楚。本章审阅的公开来源没有给出标价、折扣政策、合同期限或收入确认细节。因此，模型可信但仍停留在框架层面：投资人能看见收入应从哪里来，却看不清其中有多少已经实现、具备经常性，或能增厚利润率。
