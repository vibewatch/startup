      - number: '4.3'
        title: 成本结构与资本密集度
        blocks:
          - type: paragraph
            body: >-
              Cornerstone 的成本结构更像硬件驱动的医疗科技平台，而不是软件公司。官方足迹显示，公司拥有三个研发中心、六个业务中心和一座 30000
              平方米中国制造设施；这些都意味着在收入公开可见之前，就已经有可观固定开支。制造会带来工装、库存、QA、现场服务准备和备件义务。临床与监管工作又叠加一层：一旦手术机器人进入多个市场，公司必须支持培训、上市后监测、文档和本地化商业支持。这些成本不是临时上市项目；它们会随着装机量增长而持续存在。这也是公开收入不透明如此关键的原因。没有使用率、装机量或毛利率数据，就无法判断
              Cornerstone 仍处于规模化前的固定成本吸收阶段，还是已经走向经营杠杆。品类背景显示，这是一种重营运资本模型：固定成本前置，经常性盈利随后才到来。
