      - number: '3.3'
        title: 区域挑战者与替代方案画像
        blocks:
          - type: paragraph
            body: >-
              SS Innovations International（印度）由 Dr. Sudhir Srivastava 创立；他保持着全球机器人跳动心脏全内镜冠状动脉旁路移植（TECAB）手术数量最多的纪录。其 SSi
              Mantra 3 于 2025 年 3 月推出，定位为印度首个本土手术机器人系统的最先进版本，并明确以成本效益为议程，瞄准全球服务不足人群。SS Innovations 产品线现已覆盖五套不同系统——SSi
              Mantra 3、SSi Mudra、SSi Maya、SSi Yantra 和 SSi Sutra——显示产品组合正在放大。MarketsAndMarkets 将 SS Innovations
              识别为亚太初创企业和中小企业，且拥有强产品组合与商业战略。和 Cornerstone 一样，SS Innovations 正在追求在位系统长期供给不足的价格可及性定位。不过，SS Innovations
              没有公开披露系统数量、收入或装机量。

              Moon Surgical 的 Maestro 系统代表另一种竞争角度——半主动机器人辅助，而不是完整机器人平台——但研究时公司网站返回 404 错误，限制了对 Maestro
              当前商业状态或适应证范围的独立验证。这并不把 Moon Surgical 排除在尽调之外，但意味着本章无法从公开来源独立验证其画像。

              现状替代方案——传统腹腔镜手术——仍是所有市场使用最广、病例量最高的竞争选项。拥有大量腹腔镜塔装机和受训外科医生的医院，在考虑采用机器人时面临真实转换成本。任何机器人平台的转换论证都要证明：临床结果、外科医生人体工学和医院吞吐效率的改善，足以抵消资本成本、培训开销和一次性器械溢价。Cornerstone
              所称让手术更可及的使命，以及五路径培训项目，直接对应了阻碍医院从腹腔镜转向机器人手术的障碍。
