      - number: '6.4'
        title: 留存、耐久性与满意度缺口
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据明显弱于公开部署证据。Cornerstone 没有披露
              NRR、GRR、流失率、合同期限、续约时间表、耗材带动收入或装机基数利用率。也没有独立来源的客户满意度调查、经同行评审的合作伙伴案例研究或广泛医院证言，能让投资者区分外科医生好奇心与持久账户采用。现有最佳代理指标是连续性信号：CUHK
              / Prince of Wales Hospital 自 2022 年以来持续活跃，Portsmouth 研究在 2026
              年中仍被描述为进行中，专业教育项目也暗示反复培训触点，而不是一次性卖完就走。这些代理指标有价值，但不能替代商业留存数据。即便是 2026 年 EAU26
              的外科医生互动数字，也只是认知信号，不是医院体系内重复采购或扩张的证据。实际结论是，耐久性仍是开放尽调项：公开证据没有显示客户失败，但也没有量化证明续约、满意度或落地后扩张经济性。
