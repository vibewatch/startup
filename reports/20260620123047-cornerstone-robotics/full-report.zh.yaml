      - number: '7.2'
        title: 运营、供应链与质量风险
        blocks:
          - type: paragraph
            body: >-
              手术机器人在尚未规模化前就会带来运营风险，而 Cornerstone
              还叠加了一层清晰的集中度风险，因为其制造足迹公开绑定中国。这使公司暴露于零部件瓶颈、海关或出口管制扰动；一旦现场出现质量问题，恢复速度也可能更慢。平台还是单一产品系统：任何严重设备缺陷、无菌器械问题、软件故障或不良事件，都可能一次性扰乱全部商业化，而不只是某条产品线。公开记录在一个狭窄意义上令人鼓舞：截至
              2026 年 6 月，未识别出召回、不良器械事件集群或监管执法通知。但这种缺位应被视为早期观察，而不是风险已经退出。Cornerstone
              的质量页面显示公司已建立部分正式制造和质量控制，但公开材料中没有第三方审计细节、网络安全认证或患者数据治理架构。因此，质量、服务准备度和网络韧性都只得到部分证据支撑。
