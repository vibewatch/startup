  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Cornerstone 的隐含估值对商业验证变量最敏感，而这些变量尚未公开披露。
    approximationNotes: 敏感性分数是序数评分，不是市场推导的 beta；它们衡量的是基于公开证据，每个驱动因素可能撬动多少估值支撑。
    claimRefs:
      - CV003
      - CV017
      - CV029
      - CV031
      - CV033
      - CV035
    data:
      items:
        - label: 收入披露
