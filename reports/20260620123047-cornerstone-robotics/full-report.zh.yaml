              公开估值背景由一个事实和一个缺口主导。事实是，Cornerstone 似乎在 2025 年 11 月融资后跨过独角兽门槛，目前公开披露累计融资约
              $435M。缺口是，本次审阅的公开来源没有提供收入、毛利率、年度经常性服务收入、手术量或现金 burn
              细节。这个缺口很关键，因为它挡住了最直观的承销捷径：收入倍数。投资者可以说公司资金充足，也可以说外部媒体推断其估值超过
              $1B，但无法用披露的基本面测试价格是激进还是保守。因此，入场纪律必须基于情景，而不是公式。正确的公开问题不是 Cornerstone 是否是一家好公司，而是在经济性不透明、未知优先权
              overhang、以及资本强度大概率持续的背景下，当前隐含估值是否留下足够安全边际。没有更清晰的收入和 cap table 证据，最好的纪律是跟踪，而不是追逐融资头条。
