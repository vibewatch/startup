  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间较宽，因为公开证据更能支持方向，难以支撑精确数值。
    approximationNotes: 区间为作者估算，基于市场增长、阶段匹配和融资背景搭建，不是贴现现金流或收入倍数模型的输出。
    claimRefs:
      - CV009
      - CV016
      - CV021
      - CV022
    data:
