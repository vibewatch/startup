        title: 信任、质量、合规与路线图
        blocks:
          - type: paragraph
            body: >-
              相比设备软件栈，网站层面的信任与合规图景更充分。Cornerstone 质量页面引用 ISO 13485:2016 认证，以及覆盖 R&D、生产、销售和使用的质量管理体系；隐私和 cookie
              页面披露了数据处理法律基础、国际传输、非中国用户服务器位置、用户权利和网站 cookie 类别。新闻稿和伙伴材料也给出一致监管时间线：在中国内地和香港获 NMPA 批准用于临床，2025
              年首次在英国开展临床研究，2026 年 5 月取得 CE MDR 与新加坡 HSA 认证。这些都是有意义的信任信号，但不能替代缺失的网络安全控制、上市后监测指标、正常运行时间、事故率或现场服务 SLA
              披露。公开材料隐含的路线图因此更偏运营，而不是具体功能：深化英国培训和售后服务，扩大新加坡使用和工作流适配，并推进更多适应证和批准。投资人应把它理解为一条可信的商业化路径，且已有真实合规工作完成；但尚不能视为设备可靠性治理已完全透明的证据。
