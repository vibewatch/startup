  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              手术机器人市场指用于辅助外科医生通过机器人辅助手段开展微创操作的系统及配套耗材。纳入的支出包括机器人手术系统硬件、手术器械和附件（如套管针、抓钳、持针器、摄像头），以及软件、服务和维护合同。不纳入的支出包括没有机器人控制的纯腹腔镜塔、开放手术器械，以及诊断机器人或药房机器人等非手术机器人应用。部分重叠的相邻市场包括骨科机器人平台（如
              Stryker Mako、Zimmer Biomet ROSA）、立体定向神经外科系统，以及心脏专用机器人平台；不同报告会视方法论将其打包纳入或排除，这也是总市场规模估计差异很大的关键原因。

              现状替代方案是传统腹腔镜手术：这是一种成熟技术，拥有庞大的非机器人视频塔和器械装机基础。只接受过腹腔镜路径训练的外科医生构成转换成本壁垒，因为他们必须投入大量时间学习机器人控制台。医院还会把机器人手术与混合路径（特定步骤用腹腔镜
              + 机器人）比较，在部分场景下也会与开放手术比较。任何机器人新进入者的采用问题，不只是临床表现，还包括总拥有成本、报销匹配度，以及医院多快能把外科医生病例量做起来以证明资本开支合理。Cornerstone
              Robotics 竞争的范围覆盖亚太四大领先专科——泌尿外科、普外科、妇科和胸外科——这些专科合计约占亚太应用量的 75%，这让公司与所有主要平台正面竞争，而不是占据一个小众市场。
