      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              手术机器人系统的主要买方是医院资本预算委员会，通常由首席医疗官、首席财务官和各专科负责人共同构成。用户是受过培训的外科医生，他们在采购中也会充当内部推动者或反对者。多数亚太市场的付款方是医院本身——资金来自政府整笔拨款、医院运营预算或患者付费收入——而国家医保方案对机器人辅助手术的报销并不一致，且通常按具体术式决定。日本和韩国等市场已存在部分机器人辅助手术的国家医保报销；中国的报销仅限于
              NMPA 批准用途下的部分机构；新加坡的 NHS 类似方案部分覆盖机器人手术。在英国（Cornerstone 的 Portsmouth 研究所在地），NHS England 对机器人手术的报销取决于 NICE
              指南和地方委托安排，因此同一国家内部也存在差异。

              医院采用的触发点通常是病例量与病例集中度的组合：医院需要预计年度手术量足以在五到七年内摊销系统成本。若系统定价在 100 万至 200 万美元区间，通常需要支持专科合计每年 100–200+
              台手术。学术医疗中心、大型私立医院和亚洲城市教学医院最可能成为第一批采用者，因为它们拥有外科医生群体、培训基础设施和患者量，可以更快跨过盈亏平衡门槛。较小的区域医院和日间手术中心则是价格下降、耗材成本正常化之后打开的长尾机会。

              Cornerstone
              的专业教育项目分为五条路径：e-learning、模拟器培训、干实验室培训、湿实验室培训和高级培训。手术室照护团队另有现场培训。这套结构化项目会直接影响买方经济性，因为它能缩短医院达到临床准备状态的时间，并降低单台手术学习曲线，从而缩短盈亏平衡周期。
