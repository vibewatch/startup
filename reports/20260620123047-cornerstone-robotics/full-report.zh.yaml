      - number: '7.3'
        title: 竞争与商业化风险
        blocks:
          - type: paragraph
            body: >-
              竞争风险是本章最持久的战略威胁，因为 Cornerstone 进入的是一个买方行为已经偏向规模化龙头的领域。Intuitive 的装机基数和经常性器械与服务模式抬高了切换成本；Medtronic、CMR
              Surgical、SS Innovations、Moon Surgical 及其他进入者，也在争夺同一批外科医生拥护者和医院资本委员会。Cornerstone
              因此需要的不只是监管批准：它还需要证据、培训吞吐量、采购胜利、报销路径，以及让医院采用新平台而非扩张既有平台的理由。公开记录仍显示，其学术和政府医院 go-to-market
              以灯塔合作为中心，而不是广泛分销商网络或大众市场转售商基础。这抬高了合作伙伴集中度和试验转收入的风险。报销也未解决。未识别出专门的 Sentire
              报销结构或公开披露的保险覆盖协议，因此即便认证之后，采购仍可能依赖研究预算、捆绑医院资金或缓慢的资本审批周期。
