              detail: NHS 信托和公司信源都支持该调研。
            - label: 弱
              tone: risk
              detail: 中期结果或病例数尚未公开。
            - label: 弱
              tone: risk
              detail: 没有公开证据显示该 NHS 信托已全面采购或转化为合同。
        - label: Woodlands Health
          values:
            - label: 中
              tone: positive
              detail: 装机已确认，但病例量成熟度尚未公开。
            - label: 强
              tone: positive
              detail: 客户场点和公司信源都支持这次装机。
            - label: 弱
              tone: risk
              detail: 公司未披露结果或使用率统计。
            - label: 弱
              tone: risk
              detail: 定价和后续订单未披露。
        - label: NHG / NTU 伙伴关系
          values:
            - label: 弱
              tone: risk
              detail: 关系仍停留在 MOU 和培训阶段，尚未确认装机。
            - label: 强
              tone: positive
              detail: NHG/NTU 与 Cornerstone 均承认这项合作。
            - label: 弱
              tone: risk
              detail: 手术、结果或部署里程碑均未公开。
            - label: 弱
              tone: risk
              detail: 公司未披露商业合同。
        - label: EAU26 外科医生互动
          values:
            - label: 弱
              tone: neutral
              detail: 会议兴趣属于漏斗顶端线索，不等于场点级部署。
            - label: 弱
              tone: risk
              detail: 证据来自公司，未与医院采用挂钩。
            - label: 弱
              tone: risk
              detail: 公司只披露互动数量，未披露转化或临床使用。
            - label: 弱
              tone: risk
              detail: 活动之后没有宣布采购或新的合作关系。
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
