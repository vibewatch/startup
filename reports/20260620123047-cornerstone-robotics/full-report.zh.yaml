          label: CUHK / PWH 旗舰验证
        - id: singapore_sites
          label: 新加坡伙伴与 Woodlands
        - id: uk_trial
          label: Portsmouth 英国试验
        - id: regulators
          label: NMPA / EU / HSA / 未来 FDA
        - id: investors
