        - 首个披露收入基数或经审计 KPI 组合，会让情景分析明显更站得住
        - 中
    notes: 该表带有判断色彩，但以证据为主；它总结了在当前隐含估值下，公开数据能支撑什么、不能支撑什么。
    claimRefs:
      - CV003
      - CV015
      - CV017
      - CV018
      - CV040
      - CV043
  - id: TV002
    title: 正方 / 反方投资论点表
    description: Balanced case framing that shows why Cornerstone merits continued attention without earning a buy call today.
    columns:
      - 论点类型
      - 论点
      - 证据
      - 什么会改变该观点
    rows:
      - - 正方
        - APAC 手术机器人增长足够快，能支撑有意义的长期价值创造
        - 多家分析机构指向十几个百分点的增长和上升的区域 TAM
        - 如果市场增长大幅放缓，或报销仍然关闭，战略上行会被压缩
      - - 正方
        - Cornerstone 已在多个司法辖区展示真实监管执行力
        - 中国、CE MDR 和新加坡里程碑说明产品和监管能力可信
        - 如果批准无法转化为付费部署，监管信号的价值会下降
      - - 正方
        - 强融资支持降低短期生存风险
        - 多个来源称 2025 年融资规模大且超额认购
        - 如果下一轮融资需要重置估值或过桥，支持信号会转弱
      - - 反方
        - 收入不透明，估值测试无从下手
        - 尽管隐含估值已到独角兽级别，仍没有公开收入、利润率或使用率披露
        - 披露收入年化口径和商业合同基础，会显著提高信心
      - - 反方
        - 客户证明仍集中在试点、合作方和参考站点
        - 公开证据强调安装和合作，多于持续商业采用
        - 具名付费医院合同或使用率披露，会缓和这一担忧
      - - 反方
        - 竞争激烈且资金充足
        - Intuitive、Medtronic、CMR Surgical 和 SS Innovations 都带来不同形式的压力
        - 差异化装机爬坡或成本优势，会让竞争更可控
    notes: 正方论点成立，但每个积极因素仍需要商业证明点，才能充分守住当前估值。
    claimRefs:
      - CV008
      - CV011
      - CV017
      - CV027
      - CV034
      - CV040
      - CV045
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    description: Scenario framing for valuation where explicit assumptions matter more than single-point precision.
    columns:
      - 情景
      - 关键假设
      - 隐含估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊市
        - 试验站点转化不佳，美国路径仍遥远，定价压力压缩采用
        - 估值下探至 $500M-$700M，因为相对可见商业证明，公司看起来融资过度
        - 降价轮风险、部署密度放慢、战略可选性转弱
        - ~30%
      - - 基准
        - Cornerstone 转化部分灯塔站点，维持监管动能，并在 2027-2028 年开始披露可信商业收入
        - 当前融资信号得到基本面部分支撑，估值维持在约 $1.0B-$1.5B
        - 证明可能来得太慢，优先权条款可能压制普通股，竞争压力也可能加剧
        - ~50%
      - - 牛市
        - 中国和 APAC 推广顺利放大，更多批准扩张 TAM，公司展示可复制的多站点商业牵引力
        - 如果平台在可能退出窗口前获得战略稀缺性价值，估值达到约 $2.5B-$4.0B
        - 执行复杂度、报销拖累和资本密集型扩张，都可能打断爬坡
        - ~20%
    notes: 所有情景区间都是作者估计，锚定阶段、市场增长和融资背景，而不是披露收入或利润率数据。
    claimRefs:
      - CV004
      - CV009
      - CV016
      - CV022
      - CV025
  - id: TV004
    title: 可比估值表
    description: Relevant comparable companies and programs, emphasizing stage fit over false precision on private multiples.
    columns:
      - 可比公司
      - 阶段 / 类型
      - 指标
      - 倍数 / 估值
      - 相关性
      - 局限
    rows:
      - - Intuitive Surgical
        - 公开市场领导者
        - 收入 / 市场领导力基准
        - 公开大市值公司，常以高收入倍数讨论
        - 显示成熟手术机器人平台在公开市场能赚到什么
        - 过于成熟、披露过多，不能作为 Cornerstone 当下的直接倍数类比
      - - CMR Surgical
        - 私有 CE 认证挑战者
        - 融资强度 / 商业化阶段
        - 更广泛扩张前，报告融资约 ~$600M
        - 最适合作为私有阶段参照，说明严肃挑战者可能需要多少资本
        - 无公开估值和详细收入披露
      - - SS Innovations
        - 私有新兴市场进入者
        - 定价姿态 / APAC 式可负担性
        - 相对 Cornerstone 规模较小，面向新兴市场
        - 有助于框定亚洲市场对成本敏感的采用风险
        - 阶段、范围和临床画像均不同于 Cornerstone
      - - Medtronic Hugo
        - 战略现有巨头项目
        - 分销和战略背书
        - 由规模大得多的医疗科技母公司支持，而非独立估值
        - 显示小型进入者要在渠道触达上竞争有多难
        - 不是拥有可拆分估值披露的独立公司
      - - Cornerstone Robotics
        - 私有 APAC 聚焦挑战者
        - 价格 / 已投资本锚点
        - 披露融资约 $435M，隐含估值 >$1B，约为已投资本 2.3x
        - 框定在收入披露前，今天的私募估值要求投资者相信什么
        - 不是基于收入的倍数，也不能直接对比公开医疗科技指标
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This table covers the decision-relevant public and private comparable references repeatedly surfaced in public
        evidence for Cornerstone's current stage and market position.
    notes: 对公开决策语境而言，可比集合已经完整；但没有数据库访问或管理层材料，私募轮估值精度仍不完整。
    claimRefs:
      - CV005
      - CV006
      - CV010
      - CV021
      - CV023
      - CV028
      - CV029
      - CV031
      - CV032
  - id: TV005
    title: 论点破坏和终止触发项表
    description: Monitorable events that would materially change the recommendation or invalidate the valuation case.
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 美国市场路径失败
        - 到 2027 年中仍没有可信 FDA 策略，或之后申报收到负面反馈
        - 削弱长期 TAM，也削弱战略退出可选性
        - 下调上行假设，并重新审视独角兽估值是否仍能成立
      - - 安全或召回事件
        - 重大召回、现场措施，或持续不良事件模式
        - 损害产品信任、放慢采用，并提高责任风险
        - 转入尽调暂停，从第一性原理重新承销平台
      - - 商业转化停滞
        - 参考站点仍是试点，没有具名付费扩张
        - 证实监管证明没有转化为收入证明
        - 维持或加深继续研究立场，避免把规模化提前计入价格
      - - 降价轮融资
        - 下一次主要融资价格明显低于当前隐含估值
        - 释放议价能力转弱、稀释和可能高估的信号
        - 下调估值区间，并细查优先权悬压
      - - 中国相关供应扰动
        - 零部件或制造中断拖慢交付或服务支持
        - 直接打击推广速度，并提高资本需求
        - 下调牛市 / 基准概率，并要求连续性证据
    notes: 这些是分析师定义、与估值支撑挂钩的终止触发项，不是管理层指引或正式投资者权利条款。
    claimRefs:
      - CV018
      - CV023
      - CV025
      - CV033
      - CV043
  - id: TV006
    title: 最终尽调要求表
    description: Highest-value next asks for converting this public-view chapter into an underwrite-grade valuation memo.
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入和财务
        - 经审计财务报表、收入年化口径、现金消耗和利润率桥
        - 没有收入和现金消耗，估值倍数与资金续航假设仍是猜测
        - 要求经审计或审阅财务，以及管理层账目
      - - 股权结构表和优先权堆栈
        - 清算优先权、反稀释、优先级，以及各轮所有权
        - 优先权堆栈很重时，普通股回报可能与名义估值严重背离
        - 从公司法律顾问取得股权结构表和股东文件
      - - 美国 FDA 策略
        - 提交路径、时间，以及任何预提交或顾问材料
        - 美国对 TAM 和退出可比公司仍有战略重要性
        - 与管理层和外部顾问审阅监管计划
      - - 私有可比轮次数据
        - CMR Surgical 和类似资产的轮次估值或结构化估值标记
        - 在这一阶段，私募可比比公开市场倍数更相关
        - 从 PitchBook、Dealogic 或投资者推荐来源获取
      - - 独立临床结果
        - 来自具名合作站点的同行评议手术数据
        - 临床证明影响采用、报销和战略收购方信心
        - 要求研究清单、发表论文和主要研究者访谈
    notes: 这些要求按其改善估值精度的直接程度排序，而不是按获取难易度排序。
    claimRefs:
      - CV012
      - CV014
      - CV017
      - CV019
      - CV036
