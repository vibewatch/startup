            body: >-
              已披露时间线显示，对于一家硬件属性很重的手术机器人公司，Cornerstone 的推进速度异常快。公司称其 2019 年成立，2020 年完成概念验证，2021 年融资超过 7,500 万美元，2023
              年完成超过 9,000 万美元的 B+ 轮，2024 年 Sentire 获 NMPA 批准，2025 年 1 月完成超过 7,000 万美元 Series C，2025
