  - id: FR001
    title: Cornerstone Robotics 风险热力图：严重度与可能性
    type: matrix
    layout: wide
    summary: 公开证据显示，综合风险最高的三块是竞争护城河压力、缺少美国准入，以及与中国相关的运营集中度。
    approximationNotes: 热力图位置仅基于公开证据的专家判断；公司未披露内部企业风险排序。
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR007
      - CR011
      - CR012
      - CR032
      - CR043
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 监管 / 法律
          values:
            - 未出现重大执法行动
            - 英国或新市场进入速度落后于欧盟
            - FDA 缺位持续，同时 CE MDR 义务增加成本
        - label: 运营 / 质量
          values:
            - 未发生质量事件
            - 服务和网络安全短板拖慢采用
            - 中国制造冲击或缺陷打断部署
        - label: 竞争护城河
          values:
            - 新客户只按价格采购
            - 新兴进入者切碎需求
            - Intuitive 和 Medtronic 的切换成本护城河挡住份额提升
        - label: 商业化
          values:
            - 灯塔场点快速转化为规模化订单
            - 采购周期拉长销售转化
            - 报销和证据缺口推迟医院广泛采用
        - label: 财务 / 治理
          values:
            - 现有现金足以支撑规模化
            - 治理缺口仍可承受但未解决
            - 收入不透明和创始人集中削弱下一轮融资议价力
  - id: FR002
    title: Cornerstone Robotics 风险传导图：从监管与竞争摩擦到收入和估值
    type: dag
    layout: wide
    summary: 主要下行情景从 FDA 缺位、存量巨头竞争和采购摩擦出发，传导到部署变慢、经常性收入密度走弱，并最终压迫估值。
    claimRefs:
      - CR002
      - CR007
      - CR011
      - CR022
      - CR029
      - CR031
      - CR033
      - CR040
      - CR045
    data:
      nodes:
        - id: fda_gap
          label: 尚无美国 FDA 许可
        - id: incumbent_moat
          label: Intuitive / Medtronic 装机基础护城河
        - id: procurement_drag
          label: 医院采购缓慢
        - id: reimbursement_gap
          label: 缺少 Sentire 专属报销证据
        - id: partner_concentration
          label: 灯塔场点集中
        - id: slower_deployments
          label: 部署转化变慢
        - id: lower_recurring_density
          label: 器械 / 服务收入密度下降
        - id: margin_pressure
          label: 利润率压缩风险
        - id: valuation_stress
          label: 估值与融资承压
      edges:
        - from: fda_gap
          to: slower_deployments
        - from: incumbent_moat
          to: slower_deployments
        - from: procurement_drag
          to: slower_deployments
        - from: reimbursement_gap
          to: slower_deployments
        - from: partner_concentration
          to: slower_deployments
        - from: slower_deployments
          to: lower_recurring_density
        - from: lower_recurring_density
          to: margin_pressure
        - from: slower_deployments
          to: margin_pressure
        - from: margin_pressure
          to: valuation_stress
        - from: fda_gap
          to: valuation_stress
        - from: incumbent_moat
          to: valuation_stress
  - id: FR003
    title: Cornerstone Robotics 关键依赖图：制造、伙伴与资本
    type: dag
    layout: standard
    summary: 从公开信息看，Cornerstone 的依赖链条贯穿中国制造、旗舰医院伙伴、监管机构和后续资本方。
