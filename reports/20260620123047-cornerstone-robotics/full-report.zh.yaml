      - number: '8.4'
        title: 退出路径与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Cornerstone 并非明显应该回避，但从公开证据看也尚未达到退出就绪。战略收购可以想象，因为大型医疗科技平台可能看重 Cornerstone 在 APAC
              的监管落点、工程团队和正在形成的装机基数叙事；如果商业收入、结果数据和治理透明度在未来几年显著改善，IPO
              也可能变得现实。不过眼下，决定性问题不是哪条退出路径最令人兴奋，而是哪些证据仍挡住了达到承销级信心。投资者需要经审计财务、cap table 和优先权细节、独立结果数据，以及更清晰的 FDA
              计划，才能把可选性转化为估值支撑。如果重大监管、安全、融资或伙伴转化信号转负，投资论点也可能迅速破裂。上述组合导向一个实际结论：把公司留在主动观察名单，定义明确的上调和 kill
              触发项，并抵制把超额认购的私人融资轮当作已验证商业基本面的替代品。
