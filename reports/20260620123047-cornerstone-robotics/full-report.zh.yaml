        title: 差异化、IP 与监管护城河
        blocks:
          - type: paragraph
            body: >-
              Cornerstone 的公开差异化叙事建立在三根支柱上：全栈自研、监管进展，以及嵌入临床的培训网络。公司反复把 Sentire® 描述为自有、垂直整合 R&D 的产物，而非第三方组装；CE 与新加坡 HSA
              公告也明确把这种整合与供应链韧性、运营稳定性和长期创新联系起来。这一点重要，因为竞争平台强调的优势不同。CMR 的 Versius Plus 页面突出紧凑模块化、房间间移动性和数字应用生态；SS
              Innovations 强调可负担和可及。相比之下，Cornerstone 将自己呈现为高质量、具备监管能力的新进入者，其护城河应来自平台控制和证据生成。护城河较弱的一条腿是公开 IP 可见度。Google
              Patents、Google Scholar 和其他已审阅从业者界面，在抓取 URL 中没有给出可明确归因的专利族数量或同行评审技术文献，因此 IP
              存在是合理推断，但权利要求、司法辖区和防御性的公开地图仍很薄。这意味着，今天更容易用于投资判断的是监管里程碑，而不是专利资产或软件技术诀窍的深度。
