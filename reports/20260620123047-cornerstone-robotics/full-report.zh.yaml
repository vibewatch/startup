        title: 具名临床合作伙伴部署
        blocks:
          - type: paragraph
            body: >-
              具名证明是真实的，但成熟度并不均衡。最清晰的锚点是 CUHK / Prince of Wales Hospital 关系：CUHK 称 Sentire 自 2022 年 8 月以来已完成超过 55
              台手术；这是唯一公开披露、绑定具体站点的手术量数据，也让香港成为公司的主要验证基地。英国方面，Cornerstone 在 2025 年中宣布于 Portsmouth 的 Queen Alexandra
              Hospital 启动结直肠临床研究；公开记录仍指向一项进行中的研究，而不是已经完成的商业部署。新加坡方面，Woodlands Health 在 2026 年 4
              月披露首个本地装机，是认证转化为香港以外真实医院部署的最干净证据。相比之下，NHG / NTU 关系仍停留在 2025 年 7 月围绕研究和培训的 MOU；截至 2026 年 6 月，尚未确认装机。CUHK
              Medical Centre 强化了香港生态叙事，但公开证据还不能证明它是 Sentire 的在用生产客户。五个名字放在一起看，模式很清楚：先做临床验证，再披露商业化。
