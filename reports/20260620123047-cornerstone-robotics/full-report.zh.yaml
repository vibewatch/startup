      - number: '3.4'
        title: 转换成本、护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              相比多数医疗器械，手术机器人会形成异常强的转换成本。医院采用一套机器人平台后，需要培训外科医生（20–30 台病例达到熟练）、搭建 OR
              流程并教育照护团队。这些投入大多不能迁移：换用不同机器人平台通常意味着以全成本在新系统上重新培训、重新认证。Intuitive 的 da Vinci
              护城河尤其深，因为其装机基础足够大，多数培训机器人外科医生的医院、医学院和 fellowship 项目都使用 da Vinci，由此形成一种独立于医院决策之外持续存在的外科医生偏好系统。在 fellowship
              中接受 da Vinci 训练的外科医生，执业时会偏好 da Vinci；希望招聘这些外科医生的医院也必须适配 da Vinci。

              Cornerstone 目前的护城河主张比 Intuitive
              更薄，但在特定地理市场可能具备耐久性。其自研模式意味着它控制完整技术栈——机械、软件、影像、AI——从而能够快速迭代，并比依赖授权核心模块的公司拥有更低结构性成本。其多司法辖区监管批准（NMPA、CE
              MDR、HSA）为竞争对手在这些辖区设置了正式市场准入壁垒。CUHK MOU、Portsmouth NHS Trust 合作和新加坡 Woodlands Hospital
              部署是早期参考站点；若能扩大，将形成支持外科医生倡导和后续医院决策的临床证据基础。

              Cornerstone 的主要护城河风险在于，可及性定位并非专有：CMR Surgical、SS Innovations 以及可能还有其他新进入者都在向同一叙事靠拢，而手术机器人挑战者融资环境一直较热。CMR
              2025 年融资 2 亿美元，与 Cornerstone 同期 2
              亿美元融资并列，说明资金层面的竞争强度。谁先把早期临床合作转化为大型、多站点部署合同，谁就会建立培训飞轮优势，使客户离开其平台变得昂贵。Cornerstone
              当前披露的位置——三个活跃临床站点——仍让市场高度不确定：它能否在定位相近但美国存在更深的挑战者（CMR）整合可及型机器人利基之前达到这一规模。
