  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与临床范围
        blocks:
          - type: paragraph
            body: >-
              Cornerstone Robotics 将 Sentire® 呈现为微创手术机器人平台，而不是单一一次性资产或纯软件模块。纵观产品、机器人手术和 2026
              年批准材料，公司描述的是一套系统：外科医生坐在手术室控制台前，经小切口操控内窥镜和器械，并依赖高清 3D
              可视化、实时控制算法和震颤过滤，把手术意图转化为可重复动作。公开流程材料一致把系统拆分为外科医生控制台、视觉车、患者侧机器人、内窥镜技术和手术器械；虽然所审阅页面没有公开确切机械臂数量、占地面积和其他硬件规格，但这些信息已足以映射客户工作流。当前授权语言在普外科、妇科、胸外科和泌尿外科上最强，胃肠和肝胆胰用例也出现在产品文案中，更多作为更广管线或适应证语境。关键尽调结论是：产品定义已足够具体，可用于流程分析；但工程细节披露仍少于商业就绪型信息。
