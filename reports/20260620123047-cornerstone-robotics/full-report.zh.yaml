    sections:
      - number: '1.1'
        title: 身份、布局与运营范围
        blocks:
          - type: paragraph
            body: >-
              Cornerstone Robotics 将自己定位为一家香港手术机器人公司，目标是让高质量微创手术更普及、更高效。官方材料显示，公司总部位于香港科学园，并将 Sentire®
              平台描述为完全自研的机器人系统，服务普外科、妇科、胸外科和泌尿外科。公司称，其拥有三个全球研发中心、六个业务中心和一座位于中国的 30,000
              平方米制造设施，这与一条把香港科研身份和深圳周边制造规模结合起来的扩张路径相吻合。公开披露还显示，公司运营足迹更广，覆盖香港、深圳、北京、上海、Boston、Amsterdam，以及 Portsmouth
              合作中心。尽调中需要把握的细微点是：公司披露基础设施和地域广度比披露商业规模更清楚，因此足迹应被视为已验证运营存在，而不是广泛装机收入的证据。公司官网仍保留一段通用监管免责声明，其口径似乎比最新批准公告更宽泛、更保守，提示公开网页文案可能滞后于监管记录。尽调时，投资人应依据带日期的新闻稿和伙伴披露来梳理里程碑顺序，而把静态网站语言视为更新频率较低的维护面。
