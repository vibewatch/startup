              认证。独立媒体又叠加了两个重要但确定性较低的信息：香港投资管理有限公司牵头或锚定了 2025 年融资，且该轮估值超过 10 亿美元。主要披露缺口仍是员工人数、定价、装机量、CUHK
              试验语境之外的手术量，以及经审计财务。这些缺失并不否定临床和融资里程碑，但也意味着后期商业化证据仍比里程碑叙事本身更薄。里程碑披露强、运营披露弱，在风投支持的医疗科技公司中并不少见；但在这里更关键，因为手术机器人需要长期服务尾部、培训经济性和严格的上市后执行。因此，公司在监管和融资标题上看起来已较成熟，但在通常用来验证耐久性的商业运营数据上仍部分不透明。
