      - number: '5.3'
        title: 工作流整合与培训
        blocks:
          - type: paragraph
            body: >-
              相比原始硬件规格，Cornerstone 对培训工作流给出了更多公开细节；这个平台依赖外科医生采用和服务执行，因此这点很重要。专业教育页面列出分阶段路径，结合
              e-learning、模拟器训练、干实验室训练、湿实验室训练、高级训练，以及面向手术室照护团队的现场支持。CUHK 合作提供了外部佐证，说明这不只是营销文案：MOU
              明确覆盖教育、研究、临床应用和向教学医院转化；CU Medicine 描述了自 2022 年 8 月以来在 Prince of Wales Hospital 完成 55
              台手术，并把该系统定位为未来医生培训、远程指导和下一代机器人开发的载体。国际上，Portsmouth
              临床研究和后续英国商业声明表明，公司把培训、临床技术支持和售后服务一起打包，作为推广运营模型。因此，工作流叙事在流程层面可信，但公开材料没有披露认证时长、熟练门槛或服务水平承诺。
