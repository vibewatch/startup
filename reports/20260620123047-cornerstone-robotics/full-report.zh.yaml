  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Cornerstone 的正向估值案例首先来自品类逻辑，而不是已报告的财务产出。手术机器人仍是结构性吸引人的医疗科技细分，亚太是增长更快的区域之一，Cornerstone
              也已经证明自己能穿过中国、欧洲和新加坡的艰难监管路径。这些不是表面里程碑：它们意味着真实的工程、临床、制造和融资能力。公司似乎也融到了足够资本，可以在围绕 Sentire
              平台建立参考客户基础的同时继续资助商业化。这是故事仍值得研究、具备可投研究价值的核心原因。反论点同样重要。公开证据仍没有显示收入、利润率、装机经济性，或可复制的非学术客户转化。换句话说，Cornerstone
              可能是一家处在好市场中的可信公司，但以当前独角兽标记来看，尚未形成清晰可支撑的估值。最诚实的公开姿态是：把市场强度和监管验证视为必要但不充分，直到商业证明和定价清晰度出现。
