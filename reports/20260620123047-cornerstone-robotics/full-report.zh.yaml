      - number: '2.2'
        title: 多个分析师视角下的 TAM、SAM 与 SOM 测算
        blocks:
          - type: paragraph
            body: >-
              四家主要分析机构给出的 2025 年全球基线估计介于 66 亿美元（DataMintelligence）至 109 亿美元（IntelMarketResearch）之间；MarketsAndMarkets 和
              Grand View Research 给出的 2024 年基线分别约为 119.8 亿美元和 114.8 亿美元。低高之间约 1.6 倍的宽幅区间，反映了是否纳入骨科和专科平台等范围取舍。到 2030
              年的前瞻预测同样分化：IntelMarketResearch 预计 2034 年达到 321 亿美元（CAGR 12.4%），MarketsAndMarkets 预计 2030 年达到 271.4
              亿美元（CAGR 14.7%），Grand View Research 预计 2030 年达到 231.3 亿美元（CAGR 12.4%），DataMintelligence 预计 2033 年达到 168.9
              亿美元（CAGR 11.3%）。这些估计应被理解为区间，而不是调和成单点估值，因为公开摘要材料没有披露方法论差异。

              亚太子市场的估计更一致。MarketsAndMarkets 测算 2025 年为 20.4 亿美元，2031 年增至 48.1 亿美元，CAGR 15.4%。Precedence Research 估计 2025
              年为 11.6 亿美元、2026 年为 12.9 亿美元，2035 年达到 34.8 亿美元，CAGR 11.6%。MarketResearch.com（Analyst View）估计 2025 年为 12.8
              亿美元，至 2033 年 CAGR 为 13.5%。这些亚太估计区间更窄（约 1.6 倍差距），且一致显示该地区 CAGR 高于全球平均，使其成为对新进入者最有吸引力的增长区域。仅中国就是重大机会：根据 Wind
              Info 数据，2023 年市场约为 120 亿元人民币（16.7 亿美元），预计 2026 年达到 300 亿元人民币，隐含国内 CAGR 42.61%，由政府推动本土厂商驱动。

              Cornerstone 的 SAM 可近似为亚太软组织机器人手术市场中，可由普外 / 妇科 / 胸外 / 泌尿四专科平台触达的部分。鉴于这四个专科约占亚太应用量的 75–80%，2025 年 SAM 约在 9
              亿至 16 亿美元区间。公开证据不足以支持 SOM 估计，因为 Cornerstone 未披露装机量、手术量或定价；这应记录为重大证据缺口。
