      - number: '6.5'
        title: 集中度风险与扩张路径
        blocks:
          - type: paragraph
            body: >-
              客户集中度目前是本章最清晰的风险之一。每一项具名 Sentire
              关系都落在同一类宽泛买方画像中：能够承接试验、培训和早期临床评估的学术、教学或政府关联医院。集中度带来两个相关问题。第一，收入敏感性可能很高，因为公开证明仍高度依赖少数旗舰机构，尤其是 CUHK / Prince
              of Wales Hospital 这一香港基地。第二，更广泛铺开需要穿过缓慢的采购系统：NHS 医院需要证据、治理批准和资本规划；新加坡扩张需要单一装机之外的公立体系买入；香港全体系规模化则可能需要
              Hospital Authority 在 43 家医院网络内行动，而这一点尚未宣布。上行空间在于，CE MDR 和 HSA 认证现在扩大了欧洲和新加坡的可触达医院池，APAC
              手术机器人需求增长也足以支撑更大的商业机会。即便如此，在 Cornerstone 把培训、MOU 和研究转化为学术 / 政府细分以外可复制合同之前，扩张应被视为有希望，但尚未去风险。
