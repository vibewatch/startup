  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与市场定位
        blocks:
          - type: paragraph
            body: >-
              Cornerstone 公开可见的客户基础仍然很窄，而且高度集中在机构客户。所有具名关系都落在学术医疗中心、教学医院或政府关联医疗体系内；截至 2026 年 6
              月，尚未披露已确认的私立医院客户、门诊手术中心客户或由保险方资助的生产账户。这一点很关键，因为公司销售的是高资本开支的微创手术机器人，采购流程由医院管理层和专科科室主导，日常用户却是外科医生和手术室团队。因此，公开披露的客户分层首先按机构类型和地理区域展开：香港学术医院支撑了早期验证，英国
              NHS 教学医院代表欧洲临床研究路径，新加坡公立部门合作伙伴则是认证后的第一条扩张通道。按专科分层同样重要：Sentire
              面向普通外科、妇科、胸外科和泌尿外科，扩大了大型医院内部的买方范围，但每个站点仍要跨过培训、资本预算和临床治理门槛，试点才可能变成规模化铺开。在合同条款披露之前，最稳妥的承销假设是：这些关系更像试点、研究或早期部署证明，而不是多元化付费客户基础的证据。
