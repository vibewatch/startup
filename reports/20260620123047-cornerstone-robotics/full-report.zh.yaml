companyProfile:
  summary: >-
    Cornerstone Robotics 是一家总部位于香港的手术机器人公司，2019 年由 Samuel Au 与联合创始人 Jerry Wang、Alexis Cheng 创立。其旗舰平台 Sentire®
    是完全自研的微创手术机器人，面向普外科、妇科、胸外科和泌尿外科。公司称，其在中国拥有三个研发中心、六个业务中心和一座 30,000 平方米制造设施，并与香港、中国内地、英国和新加坡的临床伙伴合作。公开披露显示，Sentire®
    2024 年获中国 NMPA 批准，2025 年启动英国临床研究并与新加坡 NHG/NTU 合作，2026 年取得 EU CE MDR 与新加坡 HSA 认证。融资是主要强项：已披露累计融资约 4.35 亿美元，外部媒体推断
    2025 年 11 月轮后估值进入独角兽区间。核心尽调缺口不在技术可信度，而在商业透明度：未找到公开收入、价目表、装机量或经审计财务披露。
