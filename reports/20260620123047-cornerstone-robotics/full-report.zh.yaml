  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Cornerstone 具备真实的监管动能，但仍有一个会对估值产生不成比例影响的市场准入缺口。公司早前公开披露了中国 NMPA 批准，随后在 2026 年 5 月获得 CE MDR 和新加坡 HSA
              认证，但公司新闻稿或独立报道中尚未出现可比的美国 FDA clearance。这意味着，即便现有对手继续扩大装机基数和外科医生锁定，Sentire
              仍缺席全球最大的手术机器人利润池。获批后，法律与合规负担也不会结束：CE MDR
              不是一次性事件，持续的上市后监督、投诉处理和现场纠正行动义务，会随着装机基数增长而变得昂贵。英国商业化还多一层复杂性，因为脱欧后的市场准入不同于欧盟 CE MDR；Portsmouth 的 NHS
              活动更应被理解为临床证据生成，而不是 MHRA 支持下广泛商业铺开的证明。公开搜索未发现诉讼、制裁或执法行动，但 IP 深度、自由实施分析和隐私控制披露仍然很薄。
