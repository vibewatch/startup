  topStrengths:
    - >-
      Multi-jurisdiction regulatory progress across China, the EU, and Singapore is unusually strong for a late-stage
      private surgical robotics challenger
    - >-
      The company combines founder-led technical depth, in-house platform development, and meaningful Hong Kong
      institutional sponsorship
