      - number: '4.3'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Cornerstone’s cost structure looks like that of a hardware-led medtech platform rather than a software
              company. The official footprint points to three R&D hubs, six business centers, and a 30000-square-meter
              manufacturing facility in China, all of which imply meaningful fixed expense before revenue is visible
              publicly. Manufacturing drives tooling, inventory, QA, field-service readiness, and spare-parts
              obligations. Clinical and regulatory work add another layer: once a surgical robot enters multiple
              markets, the company must support training, post-market surveillance, documentation, and localized
              commercial support. Those costs are not temporary launch items; they continue as the installed base grows.
              This is why public revenue opacity matters so much. Without utilization, installed-base, or gross-margin
              data, it is impossible to know whether Cornerstone is still in a pre-scale absorption phase or already
              moving toward operating leverage. The category backdrop suggests a heavy working-capital model where fixed
              costs are front-loaded and recurring profitability comes later.
