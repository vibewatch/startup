      - number: '6.5'
        title: Concentration risk and expansion pathway
        blocks:
          - type: paragraph
            body: >-
              Customer concentration is currently one of the chapter's clearest risks. Every named Sentire relationship
              sits in the same broad buyer archetype: academic, teaching, or government-linked hospitals that can host
              trials, training, and early clinical evaluation. That concentration raises two related issues. First,
              revenue sensitivity is likely high because public proof still depends heavily on a small number of
              flagship institutions, especially the Hong Kong base at CUHK / Prince of Wales Hospital. Second, broader
              rollout requires slow procurement systems: NHS hospitals need evidence, governance approval, and capital
              planning; Singapore expansion requires public-system buy-in beyond a single installation; and Hong Kong
              system-wide scale would likely require Hospital Authority action across a 43-hospital network that has not
              yet been announced. The upside is that CE MDR and HSA certification now widen the addressable hospital
              universe in Europe and Singapore, while APAC surgical-robotics demand is growing quickly enough to support
              a larger commercial opportunity. Still, until Cornerstone converts training, MOUs, and investigations into
              repeatable contracts outside the academic/government niche, expansion should be viewed as promising but
              not yet de-risked.
