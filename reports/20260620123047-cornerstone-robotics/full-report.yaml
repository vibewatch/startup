      - number: '8.4'
        title: Exit pathways and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Cornerstone is not an obvious avoid, but it is also not exit-ready from a public-evidence standpoint. A
              strategic acquisition is imaginable because larger medtech platforms may value Cornerstone's APAC
              regulatory foothold, engineering team, and emerging installed-base narrative, while an IPO could become
              realistic if commercial revenue, outcomes data, and governance transparency improve materially within
              several years. For now, however, the decisive issue is not which exit path looks most exciting but what
              evidence still blocks underwrite-grade confidence. Investors need audited financials, cap-table and
              preference detail, independent outcomes, and a sharper FDA plan before translating optionality into
              valuation support. The thesis can also break quickly if a major regulatory, safety, financing, or
              partner-conversion signal turns negative. That combination leads to a practical conclusion: keep the
              company on the active watchlist, define explicit upgrade and kill triggers, and resist treating an
              oversubscribed private round as a substitute for demonstrated commercial fundamentals.
            claimRefs:
              - CV012
              - CV014
              - CV018
              - CV022
