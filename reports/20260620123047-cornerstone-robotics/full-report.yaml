      - number: '6.4'
        title: Retention, durability, and satisfaction gaps
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is materially thinner than public deployment evidence. Cornerstone has not
              disclosed NRR, GRR, churn, contract length, renewal schedules, consumables pull-through, or installed-base
              utilization. There are also no independently sourced customer-satisfaction surveys, peer-reviewed partner
              case studies, or broad hospital testimonials that would let an investor separate surgeon curiosity from
              durable account adoption. The best available proxies are continuity signals: CUHK / Prince of Wales
              Hospital has stayed active since 2022, the Portsmouth investigation was still presented as ongoing in
              mid-2026, and the professional-education program implies repeated training touchpoints rather than a
              one-time sale-and-walk-away motion. Those proxies matter, but they are not substitutes for commercial
              retention data. Even the 2026 EAU26 surgeon-engagement figure is an awareness signal, not evidence of
              repeat purchasing or expansion inside a hospital system. The practical takeaway is that durability remains
              an open diligence area: there is no public evidence of customer failure, but there is also no quantified
              proof of renewals, satisfaction, or land-and-expand economics.
