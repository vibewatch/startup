              Cornerstone's education and events footprint suggests the company is deliberately building surgeon
              awareness before broad revenue disclosure: the EAU26 London event cited engagement with more than 100
              surgeons, and the professional-education pages describe a structured training ladder across specialties.
              The problem for diligence is denominator quality. Cornerstone does not publish installed-base count,
              utilization, aggregate procedure volume, training-graduate totals, or commercial revenue by customer. That
              means the public story supports momentum and multi-market engagement, but not a precise assessment of
              conversion efficiency from training interest to durable hospital adoption.
