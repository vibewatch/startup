        title: Product Definition and Clinical Scope
        blocks:
          - type: paragraph
            body: >-
              Sentire® is presented as Cornerstone Robotics' minimally invasive surgical robotic platform rather than a
              single disposable asset or software-only module. Across the product, robotic-surgery, and 2026 approval
              materials, the company describes a system in which the surgeon sits at a console in the operating room,
              manipulates the endoscope and instruments through small incisions, and relies on high-definition 3D
              visualization, real-time control algorithms, and tremor filtration to translate surgical intent into
              repeatable motions. Public workflow materials consistently break the system into a surgeon console, vision
              cart, patient-side robot, endoscopic technologies, and surgical instruments, which is enough to map the
              customer workflow even though exact arm count, footprint, and other hardware specifications are not
              publicly disclosed in the reviewed pages. Current authorization language is strongest around general
              surgery, gynecology, thoracic surgery, and urology, with gastrointestinal and hepato-biliary-pancreatic
              use cases also appearing in product copy as broader pipeline or indication context. The key diligence
              takeaway is that the product definition is concrete enough for workflow analysis, but still lighter on
              engineering detail than on commercial-ready messaging.
