              The public financial verdict is mixed. On the positive side, Cornerstone Robotics has the profile of a
              serious category participant: meaningful disclosed funding, multi-market regulatory progress, formal
              manufacturing capacity, and the outlines of a recurring-revenue model. On the negative side, nearly every
              metric needed for a real underwrite remains undisclosed. No public revenue, ARR, margin, installed-base
              count, utilization, cash balance, or audited financial statements were found in this review. That gap is
              especially important because surgical robotics is a long-tail business where revenue quality depends on
              service attachment, procedure throughput, maintenance intensity, and cost absorption over time. At
              unicorn-scale fundraising, that level of opacity is not unusual for private medtech, but it is still a
              material diligence blocker. The next diligence step is straightforward: management should provide a
              revenue bridge by stream, gross margin by line, system placements, procedure volumes, monthly burn, and
