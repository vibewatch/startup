  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating scope
        blocks:
          - type: paragraph
            body: >-
              Cornerstone Robotics presents itself as a Hong Kong-based surgical robotics company focused on making
              high-quality minimally invasive surgery more accessible and efficient. Its official materials place the
              headquarters at Hong Kong Science Park and describe the Sentire® platform as a fully in-house robotic
              system for general surgery, gynecology, thoracic surgery, and urology. The company says it has three
              global R&D hubs, six business centers, and a 30,000-square-meter manufacturing facility in China, which is
              consistent with a buildout strategy that combines Hong Kong research identity with Shenzhen-area
              manufacturing scale. Public disclosures also show a broader operating footprint that spans Hong Kong,
              Shenzhen, Beijing, Shanghai, Boston, Amsterdam, and a Portsmouth collaboration hub. The important
              diligence nuance is that the company discloses infrastructure and geographic breadth more clearly than
              commercial scale, so footprint should be treated as verified operating presence rather than proof of broad
              installed-base revenue. The company homepage still contains a generic regulatory disclaimer that appears
              broader and more conservative than the newer approval announcements, which is a reminder that public web
              copy may lag the regulatory record. For diligence purposes, that means investors should rely on the dated
              press releases and partner disclosures for milestone sequencing, while treating static website language as
              a lower-frequency maintenance surface.
