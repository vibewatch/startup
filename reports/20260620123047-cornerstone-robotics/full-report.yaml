  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Cornerstone Robotics presents the ingredients of a classic surgical-robotics revenue stack even though it
              does not publish the price sheet. The public record reviewed here supports four monetization layers:
              initial sale of the Sentire platform, annual or multi-year service and maintenance, per-procedure sterile
              disposables and instruments, and professional education or training services. That structure matters
              because it implies revenue quality will eventually depend less on one-time robot shipments than on
              recurring service attachment and procedure pull-through. The problem for diligence is that the company
              discloses the existence of these activities more clearly than it discloses the associated economics. No
              public source reviewed for this chapter gives list pricing, discount policy, contract duration, or
              revenue-recognition detail. The result is a credible but still schematic model: investors can see where
              revenue should come from, but not how much of it is currently realized, recurring, or margin-accretive.
