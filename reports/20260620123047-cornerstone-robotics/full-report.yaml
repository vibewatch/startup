      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              Cornerstone has enough market tailwind, regulatory validation, and financing support to stay on the active
              watchlist, but revenue opacity prevents a defensible buy-style call at the current implied unicorn
              valuation.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV015
              - CV040
          - type: callout
            title: Revenue opacity drives valuation uncertainty
            body: >-
              Because Cornerstone does not disclose revenue, gross margin, or utilization, revenue multiples are
              uncomputable and all public valuation scenarios rest on assumptions rather than current operating
              evidence.
            calloutType: risk
            claimRefs:
              - CV003
              - CV022
              - CV029
          - type: callout
            title: CMR Surgical is the most useful private-stage benchmark
            body: >-
              CMR Surgical offers the best public stage analog for capital intensity and commercialization timing, even
              though its own valuation is not transparently disclosed to the market.
            calloutType: insight
            claimRefs:
