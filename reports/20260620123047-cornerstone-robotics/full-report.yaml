          - type: callout
            title: Revenue and burn are estimated, not verified
            body: >-
              Public fundraising disclosures are strong enough to suggest meaningful runway, but the company does not
              disclose revenue, gross margin, or audited burn. Any financial-risk view in this chapter should therefore
              be read as a bounded estimate rather than as a management-verified operating model.
            calloutType: assumption
