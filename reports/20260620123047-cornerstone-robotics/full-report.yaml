        title: Customer base segmentation and market positioning
        blocks:
          - type: paragraph
            body: >-
              Cornerstone's publicly visible customer base is still narrow and institutionally concentrated. Every named
              relationship sits inside an academic medical center, teaching hospital, or government-linked health
              system, with no confirmed private-hospital customer, ambulatory surgery center, or insurer-funded
              production account disclosed by June 2026. That matters because the company is selling a high-capex
              minimally invasive surgery robot whose buying process is led by hospital leadership and specialty
              departments, while the daily users are surgeons and OR teams. Publicly disclosed segmentation therefore
              breaks first by institution type and geography: Hong Kong academic hospitals anchored the early validation
              effort, a UK NHS teaching hospital represents the European clinical-investigation path, and Singapore
              public-sector partners represent the first post-certification expansion lane. Segmenting by specialty also
              matters: Sentire is positioned for general surgery, gynecology, thoracic surgery, and urology, which
              broadens the buyer set inside large hospitals but still requires each site to clear training, capital
              budgeting, and clinical-governance hurdles before a pilot can become a scaled rollout. Until contract
              terms are disclosed, the safest underwriting assumption is that these relationships are pilot, research,
              or early deployment proof points rather than evidence of a diversified paying customer base.
