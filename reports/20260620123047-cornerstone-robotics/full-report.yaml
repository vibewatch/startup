      - number: '8.3'
        title: Comparable set and market benchmarks
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is informative here, but only if it respects stage differences. Intuitive Surgical is
              the strategic benchmark because it shows what a scaled surgical-robotics platform can look like
              financially and competitively, yet it is too mature to function as a direct multiple analog for a private
              company with undisclosed revenue. CMR Surgical is more useful because it demonstrates how much capital a
              CE-marked challenger may need before commercialization broadens. SS Innovations helps frame
              emerging-market pricing pressure, while Medtronic's Hugo illustrates how difficult it is for a smaller
              entrant to compete against a strategic incumbent with global channels. The market backdrop does support a
              premium narrative: analyst sources consistently describe surgical robotics as a high-growth category, with
              Asia Pacific expanding quickly enough to make regional leadership strategically valuable. But the
              comparable set still leads to caution rather than conviction. Public benchmarks suggest Cornerstone may
              deserve serious attention as a funded category participant; they do not prove that the current
              private-market mark is cheap.
            claimRefs:
