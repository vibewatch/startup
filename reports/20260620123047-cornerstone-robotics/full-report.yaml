      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The primary buyer of surgical robotic systems is the hospital capital budget committee, typically a
              combination of the chief medical officer, chief financial officer, and department heads in relevant
              specialties. The user is the trained surgeon, who also acts as an internal advocate or detractor during
              procurement. The payer in most APAC markets is the hospital itself — either from government block grants,
              hospital operating budgets, or patient fee income — with reimbursement from national health schemes
              covering robotic-assisted procedures on an inconsistent, procedure-specific basis. In markets like Japan
              and South Korea, some national health insurance reimbursement for robotic-assisted procedures exists; in
              China, reimbursement is limited to select facilities under NMPA-approved use; in Singapore, NHS-equivalent
              schemes partially cover robotic procedures. In the UK (where Cornerstone has its Portsmouth
              investigation), NHS England reimbursement for robotic surgery depends on NICE guidance and local
              commissioning, creating variability even within the same country.

              The adoption trigger for a hospital is typically a combination of volume and volume concentration: a
              hospital needs projected annual procedure volumes sufficient to amortize system cost over five to seven
              years. For a system priced in the US$1–2M range, this typically requires 100–200+ procedures per year
              across the supported specialties. Academic medical centers, large private hospitals, and teaching
              hospitals in urban Asia are the highest-probability first adopters because they have the surgeon
              populations, training infrastructure, and patient volumes to cross the break-even threshold faster.
              Smaller regional hospitals and ambulatory surgery centers represent the long-tail opportunity unlocked as
              prices fall and consumable costs normalize.

              Cornerstone's professional education program spans five distinct pathways: e-learning, simulator training,
              dry-lab training, wet-lab training, and advanced training. The operating-room care team receives separate
              on-site training. This structured program is materially relevant to buyer economics because it reduces the
              hospital's time-to-clinical-readiness and lowers the per-procedure learning curve, which in turn shortens
              the break-even horizon.
