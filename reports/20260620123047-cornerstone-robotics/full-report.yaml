            title: China manufacturing geopolitical exposure
            body: >-
              Cornerstone's China-linked manufacturing footprint creates an exposure that is strategically larger than a
              normal supplier-risk issue. If export controls, customs friction, or geopolitical escalation affect
              advanced robotics inputs, the company has no publicly disclosed alternate manufacturing strategy to
              protect rollout continuity.
            calloutType: risk
            claimRefs:
              - CR005
