        title: Capital Adequacy and Funding Runway
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial fact for Cornerstone Robotics is not revenue but funding. The company
              appears to have raised about USD 435 million across disclosed rounds, culminating in an approximately USD
              200 million financing in November 2025. That is a substantial war chest for a private medtech company and
              likely the main reason the business could build manufacturing capacity, support multiple geographies, and
              continue regulatory expansion. Even so, capital raised is not the same as cash on hand. The public record
              does not disclose current cash, debt, burn, working-capital draw, or covenant obligations. A directional
              burn estimate can be inferred from the scale of infrastructure and the norms of surgical robotics, but the
              range remains broad and highly assumption-driven. The right conclusion is that Cornerstone looks funded
              enough to keep scaling in the near term, yet still financing-dependent until management discloses whether
              system adoption and recurring revenue are absorbing the fixed-cost base.
