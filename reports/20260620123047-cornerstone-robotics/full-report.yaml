      - number: '1.3'
        title: Funding history, regulatory milestones, and remaining disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The disclosed timeline shows unusually fast progression for a hardware-heavy surgical robotics company.
              Cornerstone says it was founded in 2019, reached proof of concept in 2020, raised more than US$75 million
              in 2021, added a US$90 million-plus B+ round in 2023, won NMPA approval for Sentire in 2024, raised more
              than US$70 million in a January 2025 Series C, launched a UK clinical investigation and Singapore
              partnership in mid-2025, closed an approximately US$200 million financing in November 2025, and achieved
              EU CE MDR plus Singapore HSA certifications in May 2026. Independent media add two important but
              less-certain overlays: that Hong Kong Investment Corporation led or anchored the 2025 financing and that
              the round valued the company above US$1 billion. The main disclosure gaps remain headcount, pricing,
              installed base, procedure volume outside the CUHK trial context, and audited financials. Those omissions
              do not negate the clinical and financing milestones, but they do mean later-stage commercialization
              evidence is still thinner than the milestone narrative itself. This imbalance between milestone disclosure
              and operating disclosure is common in venture-backed medtech, but it matters more here because surgical
              robotics requires long service tails, training economics, and disciplined post-market execution. The
              company therefore looks mature on regulatory and fundraising headlines, yet still partially opaque on the
              commercial operating data that would normally confirm durability.
