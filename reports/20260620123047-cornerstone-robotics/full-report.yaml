  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive valuation case for Cornerstone starts with category logic rather than reported financial
              output. Surgical robotics remains a structurally attractive medtech segment, Asia Pacific is one of the
              faster-growing geographies, and Cornerstone has already demonstrated that it can navigate a difficult
              regulatory path across China, Europe, and Singapore. Those are not cosmetic milestones: they imply real
              engineering, clinical, manufacturing, and financing capability. The company also appears to have raised
              enough capital to keep funding commercialization while building a reference base around the Sentire
              platform. That is the core reason the story remains investable to study. The anti-thesis is equally
              important. Public evidence still does not show revenue, margins, installation economics, or repeatable
              non-academic customer conversion. In other words, Cornerstone may be a credible company in a good market
              without yet being a clearly supportable valuation at the current unicorn mark. The most honest public
              posture is to treat market strength and regulatory validation as necessary but insufficient until
              commercial proof and pricing clarity emerge.
            claimRefs:
              - CV003
              - CV008
              - CV011
              - CV015
              - CV026
