  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              Cornerstone has real regulatory momentum, but it still has a market-access gap that matters
              disproportionately for valuation. The company publicly disclosed China NMPA approval earlier, then CE MDR
              and Singapore HSA certification in May 2026, yet no comparable US FDA clearance has been surfaced in
              company releases or independent coverage. That means Sentire remains absent from the world's largest
              surgical-robotics profit pool even as incumbent rivals continue to expand installed base and surgeon
              lock-in. The legal and compliance burden also continues after approval: CE MDR is not a one-time event,
              and ongoing post-market surveillance, complaint handling, and field-corrective-action obligations can
              become expensive as the installed base grows. UK commercialization adds another nuance because post-Brexit
              market entry is distinct from EU CE MDR, while the Portsmouth NHS activity is best read as
              clinical-evidence generation rather than proof of broad commercial MHRA-backed rollout. Public searches
              found no litigation, sanctions, or enforcement actions, but IP depth, freedom-to-operate analysis, and
              privacy controls remain thinly disclosed.
            claimRefs:
              - CR001
