            body: >-
              Cornerstone has given more public detail to training workflow than to raw hardware specifications, which
              is important for a platform that depends on surgeon adoption and service execution. The professional
              education page lays out a staged pathway that combines e-learning, simulator work, dry-lab training,
              wet-lab training, advanced training, and on-site support for the operating-room care team. The CUHK
