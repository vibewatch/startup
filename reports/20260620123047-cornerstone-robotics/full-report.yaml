      - number: '7.3'
        title: Competition and commercialization risks
        blocks:
          - type: paragraph
            body: >-
              Competitive risk is the chapter's most persistent strategic threat because Cornerstone is entering a field
              where buyer behavior already favors scale incumbents. Intuitive's installed base and recurring
              instrument-and-service model create high switching costs, while Medtronic, CMR Surgical, SS Innovations,
              Moon Surgical, and other entrants compete for the same surgeon champions and hospital capital committees.
              Cornerstone therefore needs more than regulatory approvals: it needs evidence, training throughput,
              procurement wins, reimbursement pathways, and a reason for hospitals to adopt a new platform instead of
              expanding an existing one. The public record still shows an academic- and government-hospital go-to-market
              centered on lighthouse partnerships rather than a broad distributor network or mass-market reseller base.
              That raises partner concentration and trial-to-revenue conversion risk. Reimbursement is also unresolved.
              No dedicated Sentire reimbursement structure or publicly disclosed insurance coverage agreement was
              identified, so procurement may rely on research budgets, bundled hospital funding, or slow
              capital-approval cycles even after certification.
