  - id: TR005
    title: Mitigation and Kill Criteria Table
    description: Practical monitoring triggers, decision thresholds, and likely investment implications.
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - US market-entry failure
        - Evidence of FDA pre-submission, filing, or regulator feedback
        - No credible US pathway disclosed by mid-2027 or a negative FDA signal after filing
        - Cut US-upside assumptions and reassess whether the company can justify venture-scale valuation without the US
      - - Product safety or quality breakdown
        - Recall notice, serious adverse-event cluster, or regulator safety communication
        - Any Class I-equivalent recall, field corrective action, or repeated serious incident pattern
        - Move to immediate diligence hold and re-underwrite revenue durability and liability exposure
      - - China supply-chain disruption
        - Export-control escalation, customs delays, or component shortages affecting robotics inputs
        - Production lead times extend materially or service support is interrupted for key markets
        - Increase discount rate, require continuity plan, and reduce rollout assumptions
      - - Financing stress or down-round risk
        - New capital raise terms, emergency bridge, or materially weaker investor syndicate
        - Next major round occurs at a lower valuation or under visibly constrained terms
        - Reassess runway, governance leverage, and dilution-adjusted return case
      - - Flagship partner or lighthouse-site loss
        - Public withdrawal, stalled trial, or non-expansion by CUHK, Portsmouth, or Woodlands-type sites
        - Any flagship site exits or remains non-converting after extended evaluation windows
        - Downgrade commercial proof quality and slow expected reference-site driven adoption
    notes: >-
      Thresholds are analyst-defined monitoring triggers rather than management guidance, and they should be updated as
      private diligence reveals contract terms or filing status.
