          - type: callout
            title: Treat named relationships as pilot or research proof until contracts are public
            body: >-
              The prudent diligence posture is to treat all named Cornerstone customer relationships as pilot, research,
              training, or early-deployment proof unless and until commercial pricing, contract length, renewal status,
              and installed-base expansion are publicly documented. The absence of those terms is more important than
              the prestige of the hospital names.
