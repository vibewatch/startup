  - id: TV002
    title: Thesis / Anti-Thesis Table
    description: Balanced case framing that shows why Cornerstone merits continued attention without earning a buy call today.
    columns:
      - Argument Type
      - Argument
      - Evidence
      - What Would Change This View
    rows:
      - - Thesis
        - APAC surgical robotics is growing quickly enough to support meaningful long-run value creation
        - Multiple analyst sources point to mid-teens growth and a rising regional TAM
        - If market growth slowed sharply or reimbursement stayed closed, strategic upside would compress
      - - Thesis
        - Cornerstone has demonstrated real regulatory execution across several jurisdictions
        - China, CE MDR, and Singapore milestones indicate credible product and regulatory capability
        - If approvals failed to translate into paying deployments, the regulatory signal would be less valuable
      - - Thesis
        - Strong financing support reduces short-term survival risk
        - The 2025 round was large and described as oversubscribed by multiple sources
        - If the next financing required a reset or bridge, the support signal would weaken
      - - Anti-thesis
        - Revenue opacity makes valuation testing impossible
        - No public revenue, margin, or utilization disclosure exists despite the unicorn-level implication
        - A disclosed revenue run rate and commercial contract base would materially improve confidence
      - - Anti-thesis
        - Customer proof still appears concentrated in pilots, partners, and reference sites
        - Public evidence highlights installations and partnerships more than recurring commercial adoption
        - Named paying hospital contracts or utilization disclosures would soften this concern
      - - Anti-thesis
        - Competition is intense and well funded
        - Intuitive, Medtronic, CMR Surgical, and SS Innovations all create different forms of pressure
        - A differentiated installed-base ramp or cost advantage would make the competition more manageable
    notes: >-
      The thesis is real, but each positive factor still requires a commercial proof point before it can fully defend
      the current valuation.
