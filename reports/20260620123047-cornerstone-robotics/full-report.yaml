companyProfile:
  summary: >-
    Cornerstone Robotics is a Hong Kong-headquartered surgical robotics company founded in 2019 by Samuel Au and
    co-founders Jerry Wang and Alexis Cheng. Its flagship Sentire® platform is a fully in-house minimally invasive
    surgery robot positioned for general surgery, gynecology, thoracic surgery, and urology. The company says it
    combines three R&D hubs, six business centers, and a 30,000-square-meter manufacturing facility in China with
    clinical partnerships in Hong Kong, mainland China, the UK, and Singapore. Public disclosures show China NMPA
    approval in 2024, a UK clinical investigation and NHG/NTU Singapore partnership in 2025, and EU CE MDR plus
    Singapore HSA certifications in 2026. Financing is a major strength, with about USD 435 million of disclosed capital
    raised and outside media inferring a unicorn valuation after the November 2025 round. The main diligence gap is not
    technical credibility but commercial transparency: no public revenue, price sheet, installed-base, or audited
    financial disclosure was found.
