      - number: '7.4'
        title: Financial model and governance risks
        blocks:
          - type: paragraph
            body: >-
              Cornerstone has raised large amounts of capital, but public financial transparency is still materially
              below what an investor would want for underwriting a hardware-heavy commercialization phase. The company
              has not disclosed revenue, ARR, gross margin, procedure-linked recurring revenue, or audited burn, so
              outside analysis cannot distinguish healthy investment intensity from a business model that may require
              frequent external capital. The most defensible public view is that the company has meaningful cash support
              after the 2025 financing, but runway remains an estimate rather than a verified fact. Governance risk is
              similarly centered on disclosure gaps. Samuel Au is the dominant public executive identity, while board
              composition, independent oversight, finance leadership depth, and succession planning are not clearly
              documented. That combination of founder concentration, limited reporting, and government-linked investor
              support is not inherently negative, but it does raise questions about control, accountability, and how
              resilient the company would be under a product delay, financing reset, or policy shock.
