              has mastered mechanical architecture, complex software algorithms, electrical architecture, software
              architecture, and visual technologies, while the Sentire® and robotic-surgery pages add the functional
              pieces that matter in practice: 5 mm and 8 mm robotic instruments, integrated endoscopic imaging, a cold
