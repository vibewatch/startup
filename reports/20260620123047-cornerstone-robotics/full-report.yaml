            - UK or new-market entry lags EU pace
            - FDA absence persists while CE MDR obligations add cost
        - label: Operational / Quality
          values:
            - No quality event occurs
            - Service and cybersecurity gaps slow adoption
            - China manufacturing shock or defect disrupts deployments
        - label: Competitive Moat
          values:
            - New accounts buy on price alone
            - Emerging entrants fragment demand
            - Intuitive and Medtronic switching-cost moat blocks share gain
        - label: Commercialization
          values:
            - Lighthouse sites convert quickly to scaled orders
            - Procurement cycles lengthen sales conversion
            - Reimbursement and evidence gaps delay broad hospital uptake
        - label: Financial / Governance
