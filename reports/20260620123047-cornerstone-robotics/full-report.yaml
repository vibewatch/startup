      - number: '1.2'
        title: Leadership, governance, and institutional ecosystem
        blocks:
          - type: paragraph
            body: >-
              Founder Samuel Au is the central public face of Cornerstone Robotics, and the evidence base consistently
              ties the company to surgeon training, academic partnerships, and Hong Kong innovation-policy institutions.
              Cornerstone materials and CUHK coverage identify Jerry Wang and Alexis Cheng as co-founders alongside Au,
              while the CUHK seminar and MOU announcement show visible participation from the Hong Kong Financial
              Secretary, Hospital Authority leadership, Hong Kong Investment Corporation, Hong Kong Science and
              Technology Parks, and CU Medicine. That pattern matters because it suggests governance-by-ecosystem in
              addition to founder control: the company is not just selling a robot, it is embedding itself in university
              hospitals, policy circles, and regional medtech capacity-building. The tradeoff is key-person
              concentration. Public discourse overwhelmingly centers on Samuel Au, and there is limited public
              disclosure on board composition, independent directors, or formal governance controls beyond investor and
              institutional affiliations. That combination creates a useful signaling effect for customers and
              investors, but it also means diligence should distinguish reputational sponsorship from hard contractual
              support. None of the public materials reviewed here provide a current board list, ownership percentages,
              or formal committee structure, so institutional visibility should not be mistaken for fully transparent
              governance.
