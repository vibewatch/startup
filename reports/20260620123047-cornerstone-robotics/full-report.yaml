  - id: FU001
    title: Customer journey map
    type: journey-map
    description: Institutional path from early academic engagement to potential scaled hospital deployment.
    layout: wide
    summary: >-
      Cornerstone's public customer journey starts with academic validation and regulatory clearance, then moves through
      training and local clinical proof before any broader commercial rollout is visible.
    claimRefs:
      - CU001
      - CU004
      - CU017
      - CU018
      - CU024
      - CU031
    data:
      nodes:
        - label: Academic research collaboration
          detail: >-
            Initial relationships are framed through MOU, co-development, or clinical-research structures with teaching
            hospitals and medical schools.
          tone: neutral
        - label: Regulatory clearance in target market
          detail: Market access follows NMPA, CE MDR, or HSA approval before a hospital can move toward live clinical use.
          tone: positive
        - label: Surgeon training and professional education
          detail: >-
            Cornerstone uses events, proctoring, and education programs to build local familiarity before broader
            deployment.
          tone: positive
        - label: Site-level clinical investigation or installation
          detail: >-
            Named sites then progress into clinical investigation, commissioning, or repeated-use programs such as
            CUHK/PWH or Woodlands Health.
          tone: positive
        - label: Reference-site validation
          detail: >-
            Procedure counts, surgeon engagement, and institutional prestige create the proof needed for neighboring
            systems to evaluate adoption.
          tone: positive
        - label: Procurement and expansion decision
          detail: >-
            Broader rollout still depends on hospital authority approval, capital budgets, and whether a pilot converts
            into a system-wide commercial contract.
          tone: risk
