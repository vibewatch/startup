      - number: '4.2'
        title: Unit Economics and Pricing Intelligence
        blocks:
          - type: paragraph
            body: >-
              Public unit economics for Cornerstone Robotics are almost entirely benchmark-based. The company does not
              disclose Sentire ASP, service contract value, instrument pricing, gross margin, customer lifetime value,
              or CAC. That forces diligence to start from competitor context. In surgical robotics, established systems
              are expensive capital purchases with meaningful maintenance tails and recurring instrument revenue, so a
              Sentire price band in the high-six-figure to low-seven-figure range is plausible even if still unverified.
              The commercial question is not just whether hospitals can afford the first system, but whether utilization
              becomes high enough for service and disposable pull-through to offset installation and support costs. In
              that sense, unit economics are directionally understandable while still numerically opaque. Investors can
              sketch the bridge from system sale to recurring gross profit, but they cannot yet validate realized
              pricing, discount discipline, or sales efficiency. That leaves the underwriting case dependent on
              comparable-company logic rather than company disclosure.
