  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The surgical robotics market is defined as systems and associated consumables used to assist surgeons
              performing minimally invasive procedures through robotic-assisted platforms. Included spend covers robotic
              surgery system hardware, surgical instruments and accessories (e.g., trocars, graspers, needle holders,
              cameras), and software, service, and maintenance contracts. Excluded spend includes pure laparoscopic
              towers without robotic control, open-surgery instrumentation, and non-surgical robotic applications such
              as diagnostic or pharmacy robotics. Adjacent markets that partially overlap include orthopedic robotic
              platforms (e.g., Stryker Mako, Zimmer Biomet ROSA), stereotactic neurosurgical systems, and
              cardiac-specific robotic platforms that some reports bundle or exclude depending on methodology — a key
              reason for the wide range of total market estimates.

              The status-quo substitute is conventional laparoscopic surgery: a well-established technique with a large
              installed base of non-robotic video towers and instruments. Surgeons trained exclusively on laparoscopic
              approaches represent a switching-cost barrier as they must invest significant time learning robotic
              consoles. Hospitals also compare robotic surgery against hybrid approaches (laparoscopic + robotic for
              specific steps) and, in some settings, against open surgery. The relevant adoption question for any
              robotic entrant is not merely clinical performance but total cost of ownership, reimbursement alignment,
              and the speed at which the hospital can build surgeon volume to justify the capital outlay. Cornerstone
              Robotics competes across all four of the leading APAC specialties — urology, general surgery, gynecology,
              and thoracic — that together represent approximately 75% of APAC application volume, putting it in direct
              competition with all major platforms rather than occupying a niche.
