            body: >-
              Cornerstone's public differentiation case rests on three pillars: full-stack in-house development,
              regulatory progress, and a clinically embedded training network. The company repeatedly describes Sentire®
              as the output of proprietary, vertically integrated R&D rather than a third-party assembly exercise, and
              the CE plus Singapore HSA announcement explicitly links that integration to supply-chain resilience,
              operational stability, and long-term innovation. That matters because competing platforms emphasize
              different advantages. CMR's Versius Plus page leans into compact modularity, room-to-room mobility, and a
              digital app ecosystem, while SS Innovations emphasizes affordability and accessibility. Cornerstone, by
              contrast, presents itself as a high-quality, regulatory-capable entrant whose moat should come from
              platform control and evidence generation. The weaker leg of the moat is public IP visibility. Google
              Patents, Google Scholar, and other reviewed practitioner surfaces did not yield a clearly attributable
              patent-family count or peer-reviewed technical corpus in the fetched URLs, so the existence of IP is
              plausible but the public map of claims, jurisdictions, and defensibility remains thin. That means
              regulatory milestones are easier to underwrite today than the depth of the patent estate or software
