            title: Clinical validation breadth exceeds a single-market story
            body: >-
              Cornerstone already has meaningful proof across Hong Kong, the UK, and Singapore. That breadth matters
              because it shows Sentire is not confined to one hospital or one regulatory regime: CUHK / Prince of Wales
              Hospital gives repeated-use validation, Portsmouth provides an NHS evidence path, and Woodlands Health
              demonstrates the first Singapore installation after certification.
