  - id: TV003
    title: Bull / Base / Bear Scenario Table
    description: Scenario framing for valuation where explicit assumptions matter more than single-point precision.
    columns:
      - Scenario
      - Key Assumptions
      - Implied Valuation Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bear
        - Trial sites do not convert well, US pathway stays distant, and pricing pressure compresses adoption
        - Valuation falls toward $500M-$700M because the company looks overfunded relative to visible commercial proof
        - Down-round risk, slower deployment density, and weaker strategic optionality
        - ~30%
      - - Base
        - >-
          Cornerstone converts some lighthouse sites, keeps regulatory momentum, and begins disclosing credible
          commercial revenue by 2027-2028
        - Valuation holds around $1.0B-$1.5B as current financing signals become partially supported by fundamentals
        - >-
          Proof may arrive too slowly, preference terms may overhang common equity, and competitive pressure may
          intensify
        - ~50%
      - - Bull
        - >-
          China and APAC rollout scale well, additional approvals expand TAM, and the company shows repeatable
          multi-site commercial traction
        - >-
          Valuation reaches roughly $2.5B-$4.0B if the platform earns strategic scarcity value before a likely exit
          window
        - Execution complexity, reimbursement drag, and capital-intensive scaling can all break the ramp
        - ~20%
    notes: >-
      All scenario ranges are author estimates anchored on stage, market growth, and funding context rather than
      disclosed revenue or margin data.
