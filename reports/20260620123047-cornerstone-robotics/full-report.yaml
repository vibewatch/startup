            title: Customer concentration remains heavily academic and government-linked
            body: >-
              Every publicly named Sentire relationship sits in an academic medical center, teaching hospital, or
              government health system. That concentration raises risk around procurement speed, budget cycles, and
              external proof quality, especially because no private-sector hospital customer or mature commercial
              contract has been publicly disclosed.
            calloutType: risk
            claimRefs:
