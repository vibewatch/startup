        title: Exhibits
        blocks:
          - type: callout
            title: Competitive moat challenge
            body: >-
              Intuitive Surgical's installed base, surgeon familiarity, and recurring-instrument economics are the most
              durable long-term risk in the Cornerstone thesis. Even if Sentire continues to win regulatory milestones,
              the harder problem is persuading hospitals to switch capital, workflow, and training budgets away from
              platforms they already know.
            calloutType: risk
            claimRefs:
