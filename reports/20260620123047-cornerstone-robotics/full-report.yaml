      - number: '7.2'
        title: Operational, supply-chain, and quality risks
        blocks:
          - type: paragraph
            body: >-
              Surgical robotics creates operational risk even before scale, and Cornerstone adds a clear concentration
              layer because its manufacturing footprint is publicly tied to China. That exposes the company to component
              bottlenecks, customs or export-control disruption, and slower recovery if a quality problem emerges in the
              field. The platform is also a single-product system: any serious device defect, sterile-instrument issue,
              software fault, or adverse event could disrupt all commercialization at once rather than just a product
              line. The public record is encouraging in one narrow sense because no recall, adverse-device-event
              cluster, or regulator enforcement notice was identified through June 2026. But that absence should be
              treated as an early-stage observation, not as proof that risk has been retired. Cornerstone's quality page
              suggests some formal manufacturing and quality controls are in place, yet no third-party audit detail,
              cybersecurity certification, or patient-data governance architecture was found in public materials. That
              leaves quality, service readiness, and cyber-resilience only partially evidenced.
            claimRefs:
              - CR004
