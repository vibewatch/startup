      - number: '7.5'
        title: Kill criteria, mitigations, and monitoring
        blocks:
          - type: paragraph
            body: >-
              The investment case is not broken today, but it is only investable with explicit monitoring discipline.
              Cornerstone has already shown some mitigation capacity by winning CE MDR and Singapore HSA certifications,
              building hospital training relationships, and raising substantial capital. Those are real de-risking
              steps, not cosmetic signals. Even so, the highest-severity risks remain monitorable rather than solved.
              The most important thesis-break triggers are a failed or indefinitely absent US FDA pathway, a material
              product recall or serious safety signal, the loss of flagship academic partners, a down-round or forced
              bridge that implies capital stress, and geopolitical disruption that blocks component supply from China.
              Investors should treat the next 12 to 24 months as a validation period in which regulatory progress,
              quality performance, deployment conversion, and financing resilience all need to hold simultaneously. If
              those signals weaken together, the downside can transmit quickly from operations into revenue assumptions
              and valuation support.
