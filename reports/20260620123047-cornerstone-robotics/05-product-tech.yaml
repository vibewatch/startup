- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - Sentire Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Perform minimally invasive soft-tissue surgery
    - Console-based robotic MIS with visual magnification and wristed tools
    - Surgeon controls endoscope and instruments through small incisions
    - Public copy claims smoother, more precise, repeatable motion
    - No independent benchmark or outcome delta is published in reviewed URLs
  - - Set up imaging and maintain intraoperative visualization
    - OR team manages camera, connection, and visibility tools
    - Vision cart plus integrated endoscopic technologies
    - 3D enlarged views and anti-fog/cold-light features are publicly described
    - Workflow timing and troubleshooting burden are not quantified
  - - Bring new surgeons onto the platform
    - Didactic plus simulation then lab and advanced practice
    - PEP pathway spans e-learning, simulator, dry lab, wet lab, and advanced training
    - Training stack is concretely listed rather than implied
    - No published credentialing time or minimum-case threshold
  - - Train the operating-room care team
    - On-site room preparation and system support
    - Dedicated on-site training for the OR care team
    - Signals that adoption model includes perioperative staff, not just surgeons
    - No public staffing model or field-service staffing ratio
  - - Adapt workflows at new sites
    - Pilot testing, operation training, and workflow adaptation
    - UK and Singapore programs pair installation with training and technical support
    - Supports localized rollout and clinical workflow adjustment
    - No public deployment economics or throughput data
  notes: Benefits are presented as company or partner-described workflow outcomes, not independent comparative endpoints.
