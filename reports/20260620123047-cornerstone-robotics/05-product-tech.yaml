- id: workflow-integration-training
  title: Workflow Integration and Training
  body: 'Cornerstone has given more public detail to training workflow than to raw hardware specifications, which is important for a platform that depends on surgeon adoption and service execution. The professional education page lays out a staged pathway that combines e-learning, simulator work, dry-lab training, wet-lab training, advanced training, and on-site support for the operating-room care team. The CUHK partnership adds external corroboration that this is not just marketing copy: the MOU explicitly covers education, research, clinical applications, and translation into teaching hospitals, while CU Medicine described 55 operations at Prince of Wales Hospital since August 2022 and framed the system as a vehicle for future physician training, tele-mentoring, and next-generation robotic development. Internationally, the Portsmouth clinical investigation and later UK commercial statements indicate that training, clinical technical support, and after-sales service are being packaged together
    as the operating model for rollout. The resulting workflow story is credible at a process level, but public materials do not disclose credentialing duration, proficiency thresholds, or service-level commitments.'
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE025
  - CE030
- id: differentiation-ip-regulatory-moat
  title: Differentiation, IP, and Regulatory Moat
  body: 'Cornerstone''s public differentiation case rests on three pillars: full-stack in-house development, regulatory progress, and a clinically embedded training network. The company repeatedly describes Sentire® as the output of proprietary, vertically integrated R&D rather than a third-party assembly exercise, and the CE plus Singapore HSA announcement explicitly links that integration to supply-chain resilience, operational stability, and long-term innovation. That matters because competing platforms emphasize different advantages. CMR''s Versius Plus page leans into compact modularity, room-to-room mobility, and a digital app ecosystem, while SS Innovations emphasizes affordability and accessibility. Cornerstone, by contrast, presents itself as a high-quality, regulatory-capable entrant whose moat should come from platform control and evidence generation. The weaker leg of the moat is public IP visibility. Google Patents, Google Scholar, and other reviewed practitioner surfaces did
    not yield a clearly attributable patent-family count or peer-reviewed technical corpus in the fetched URLs, so the existence of IP is plausible but the public map of claims, jurisdictions, and defensibility remains thin. That means regulatory milestones are easier to underwrite today than the depth of the patent estate or software know-how.'
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE038
  - CE039
