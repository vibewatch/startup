- id: system-architecture-tech-stack
  title: System Architecture and Technology Stack
  body: 'The reviewed public materials describe a coherent but incomplete architecture stack. Cornerstone says it has mastered mechanical architecture, complex software algorithms, electrical architecture, software architecture, and visual technologies, while the Sentire® and robotic-surgery pages add the functional pieces that matter in practice: 5 mm and 8 mm robotic instruments, integrated endoscopic imaging, a cold light source, anti-fog support, manual control at the surgeon console, flexible wristed motion, and built-in tremor filtration. The quality page also frames the system as wholly developed in house and produced from a company-controlled facility, alongside three global R&D centers and six business hubs. That supports a thesis of vertical integration, but not a fully open technical architecture. No reviewed public page disclosed the software safety lifecycle standard, cyber hardening model, update pathway, network architecture, or the mechanism behind the marketed ''real-time
    feedback'' language. The manufacturing and supply story is similarly directional rather than exhaustive: Greater Bay Area production and supply-chain depth are highlighted, but part-level concentration, critical suppliers, and redundancy are not.'
  claimRefs:
