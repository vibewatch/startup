- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control/Certification
  - Status
  - Scope
  - Gap
  rows:
  - - ISO 13485:2016
    - Explicitly cited on quality page
    - Quality management system spanning lifecycle
    - No public audit scope, certificate number, or site list in reviewed URLs
  - - China NMPA approval
    - Company and CUHK partner materials say approved
    - Clinical applications and mainland/Hong Kong use
    - No public decision notice was surfaced from an NMPA record in this run
  - - EU CE mark under MDR
    - Officially announced 2026-05-25
    - General surgery, gynecology, thoracic, and urology
    - No detailed notified-body dossier or EUDAMED entry was surfaced
  - - Singapore HSA certification
    - Officially announced 2026-05-25
    - Same four specialty categories plus Singapore rollout
    - No public certificate document was surfaced in reviewed URLs
  - - Website privacy controls
    - Published and detailed
    - Legal basis, retention, rights, cross-border transfer, Singapore storage for non-China users
    - Applies to website data handling, not necessarily device telemetry or clinical system security
  - - Cookie transparency
    - Published and detailed
    - Essential, analytics, preference, advertising, and third-party cookies
    - No public mapping from web analytics controls to product-device analytics
  - - Post-market reliability governance
    - Not publicly quantified
    - Would cover uptime, incidents, recalls, and service SLAs
    - No public reliability dashboard or field-service metrics surfaced
  notes: Compliance evidence is stronger on approvals and website governance than on device cybersecurity and post-market operating transparency.
