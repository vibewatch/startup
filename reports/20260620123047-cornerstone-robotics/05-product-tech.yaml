tables:
- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module/Component
  - User/Stakeholder
  - Maturity/Status
  - Differentiation
  - Diligence Gap
  rows:
  - - Surgeon console
    - Lead surgeon
    - Publicly described and in clinical use
    - Console-led telemanipulation with real-time control and 3D visualization
    - Exact ergonomics, console latency, and feedback mechanism not publicly specified
  - - Patient-side robot and instruments
    - Surgeon plus OR team
    - Publicly described; specialty use and UK/Singapore activity disclosed
    - 5 mm and 8 mm robotic instruments with flexible wrist motion
    - Arm count, reach envelope, and instrument changeover metrics are not public
  - - Vision cart and endoscopic technologies
    - OR team
    - Publicly described
    - Integrated cold light source, anti-fog feature, and enlarged 3D views
    - Camera pipeline, recording, and data export details are undisclosed
  - - Professional Education Program
    - Surgeons and OR care team
    - Live public program page
    - Structured pathway from e-learning to wet-lab and advanced training
    - Credentialing duration, pass criteria, and refresher cadence are undisclosed
  - - Clinical validation network
    - Hospital partners and regulators
    - CUHK and Portsmouth activities publicly disclosed
    - Embedded trials and teaching-hospital use support workflow learning
    - No public multicenter outcomes dataset or ClinicalTrials.gov record surfaced
  - - Commercial support layer
    - Hospital administrators and service teams
    - UK training/support model publicly described
    - One-stop training, clinical technical support, and after-sales framing
    - Formal SLA, spare-parts strategy, and uptime commitments are not public
  notes: Matrix reflects public-facing product assets and workflow supports; hardware specifications remain less complete than training and regulatory disclosures.
  enumerationScope:
    coverage: partial
    basis: The matrix captures the publicly identifiable modules and workflow assets visible in reviewed product, training, and partner materials as of the run date, not the full bill of materials.
