  evidenceGaps:
  - type: missing-source
    severity: material
    topic: feedback-mechanism
    missingEvidence: Independent technical documentation or regulatory summaries that describe whether Sentire's feedback feature is true force sensing, haptic rendering, or software-estimated feedback.
    whyItMatters: Feedback fidelity is presented as a differentiator, but buyer confidence and surgeon ergonomics depend on how the mechanism actually works.
    diligencePath: Request IFU sections, engineer interviews, demo lab observation, or notified-body submission excerpts describing the feedback architecture.
    relatedQuestionRefs:
    - QE008
  - type: missing-source
    severity: material
    topic: hardware-specifications
    missingEvidence: Public or confidential specifications for arm count, system footprint, reach envelope, weight, and docking geometry.
    whyItMatters: Hospital fit, room turnover, and capital planning depend on concrete system specifications that are absent from the reviewed public materials.
    diligencePath: Obtain the latest product brochure, IFU, or procurement pack from Cornerstone and verify against site-planning documents.
    relatedQuestionRefs:
    - QE006
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: minor
    topic: training-duration
    missingEvidence: Published guidance on credentialing duration, case minimums, and remediation or recertification rules for surgeons and OR staff.
    whyItMatters: Adoption cost and deployment timing are driven by how long the pathway takes and how much on-site support it requires.
    diligencePath: Request the current PEP curriculum guide, assessment rubric, and implementation plan used for new hospital launches.
    relatedQuestionRefs:
    - QE007
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: material
    topic: patent-estate
    missingEvidence: Named patent families, jurisdictions, assignees, and claim themes that can be clearly tied to Cornerstone Robotics and Sentire.
    whyItMatters: Regulatory progress alone does not quantify defensibility; investors need a real map of IP breadth and freedom-to-operate posture.
    diligencePath: Run a company-assisted patent search by legal entity names and product aliases, then reconcile to outside counsel and board materials.
    relatedQuestionRefs:
    - QE012
  - type: private-evidence-only
    severity: material
    topic: cybersecurity-and-reliability
    missingEvidence: Device software lifecycle evidence, cybersecurity controls, logging, patch management, uptime history, and service SLA data.
    whyItMatters: For regulated robotics, weak disclosure on software assurance and field reliability leaves a major risk to hospitals, regulators, and investors.
    diligencePath: Request IEC 62304- and cybersecurity-related documentation, post-market surveillance summaries, incident logs, and field-service KPIs.
    relatedQuestionRefs:
    - QE014
    - QE026
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: clinical-evidence-corpus
    missingEvidence: A company-specific clinical-trial registry entry, peer-reviewed study set, or multicenter outcomes publication for Sentire.
    whyItMatters: Public milestone announcements are meaningful, but durable product underwriting requires independently inspectable clinical evidence beyond marketing and partner commentary.
    diligencePath: Request the trial registry identifiers, manuscripts in preparation, and post-market clinical follow-up plans for Hong Kong, UK, and Singapore sites.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: minor
    topic: developer-signal
    missingEvidence: Accessible public practitioner or developer traces such as open repositories, public job detail, conference code releases, or technical demo channels attributable to Cornerstone.
    whyItMatters: A hardware-first medtech company can legitimately keep code private, but the absence of easy public developer traces limits outside validation of engineering community traction.
    diligencePath: Ask management for engineering hiring materials, talk abstracts, internal software team composition, and any restricted-access technical presentations.
    relatedQuestionRefs:
