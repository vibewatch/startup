- id: trust-quality-compliance-roadmap
  title: Trust, Quality, Compliance, and Roadmap
  body: 'The trust and compliance picture is better developed for the website surface than for the device software stack. Cornerstone''s quality page cites ISO 13485:2016 certification and a quality-management system spanning R&D, production, sales, and usage, while the privacy and cookie pages disclose legal bases for data processing, international transfers, server location for non-China users, user rights, and the categories of website cookies in use. Press and partner materials also provide a consistent regulatory chronology: NMPA-cleared clinical use in mainland China and Hong Kong, first UK clinical investigation in 2025, and CE MDR plus Singapore HSA certification in May 2026. Those are meaningful trust signals, but they do not replace missing public disclosures on cybersecurity controls, post-market surveillance metrics, uptime, incident rates, or field-service SLAs. The roadmap implied by public materials is therefore operational rather than feature-specific: deepen UK training
    and after-sales service, scale Singapore usage and workflow adaptation, and pursue further indications and approvals. Investors should read that as a credible commercialization path with real compliance work already done, but not yet as proof of fully transparent device reliability governance.'
