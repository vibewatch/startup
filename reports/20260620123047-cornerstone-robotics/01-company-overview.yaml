  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: Installed base, annual procedure counts, and paid-hospital customer counts by geography.
    whyItMatters: The milestone story is strong, but commercial traction cannot be underwritten without utilization and customer-conversion evidence.
    diligencePath: Request a market-by-market installed-base table, paid-case volumes, and named reference sites under NDA.
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: List price, service contract economics, disposable-instrument economics, and gross-margin profile for Sentire.
    whyItMatters: Accessibility claims depend on whether the platform is materially cheaper to acquire and operate than incumbent systems.
    diligencePath: Obtain price sheets, service terms, and gross-margin bridge by system, instrument, and maintenance revenue.
  - type: missing-source
    severity: minor
    topic: formal-governance
    missingEvidence: Current board composition, independent directors, and investor control rights.
    whyItMatters: Founder-led execution is clear, but governance quality affects financing flexibility and exit timing.
    diligencePath: Request the latest board list, shareholder agreement summary, and post-money cap table from the data room.
    relatedTableRefs:
    - TO003
  - type: stale
    severity: minor
    topic: regulatory-disclosure-consistency
    missingEvidence: Updated website-wide regulatory language aligned with the company’s public approval status in China, the EU, and Singapore.
    whyItMatters: A stale disclaimer can confuse customers and suggests the public web estate lags regulatory reality.
    diligencePath: Ask management for a canonical market-by-market regulatory status sheet and website update cadence.
