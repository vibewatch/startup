    - Currently an inferred pathway, not confirmed customer revenue
  - - Mainland China post-approval hospital market
    - Buyer would be hospital procurement committees and provincial systems; users are surgeons across four specialties
    - Expansion opportunity after NMPA approval
    - Cornerstone has China approval but has not publicly disclosed a named mainland hospital customer in this chapter's source set
    - Largest long-run installed-base opportunity if local adoption scales
    - No named site, installed-base count, or utilization disclosed
