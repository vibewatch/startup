  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-retention-metrics
    missingEvidence: Comparable public customer-count, deployment, or retention disclosures for similarly staged surgical-robotics entrants that would allow a fair benchmark against Cornerstone's named-site count.
    whyItMatters: Without stage-matched benchmarks, it is difficult to say whether Cornerstone's small named-customer base is normal for this commercialization phase or evidence of slower-than-peer adoption.
    diligencePath: Request a management-selected and investor-selected peer set with installed-base, procedure-volume, and repeat-site metrics at comparable post-approval stages.
    relatedQuestionRefs: [QU006, QU017]
    relatedTableRefs: [TU003, TU004, TU005]
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing
    missingEvidence: Sentire system pricing, maintenance terms, instrument economics, and contract values by site or geography.
    whyItMatters: Customer quality cannot be converted into revenue quality without knowing contract size, recurring revenue mix, and the economics of a live installation.
    diligencePath: Request sample contracts, price books, service agreements, and any revenue bridge from installed sites to recognized revenue.
    relatedQuestionRefs: [QU014, QU021]
    relatedTableRefs: [TU002, TU005]
  - type: enumeration-incomplete
    severity: minor
    topic: installed-base-count
    missingEvidence: A complete installed-base and active-trial roster, including unnamed mainland China sites if any exist.
    whyItMatters: Public named-site evidence is enough to show early traction but not enough to quantify total commercial scale.
    diligencePath: Request a site-by-site deployment ledger with launch date, status, indication set, and current utilization.
    relatedQuestionRefs: [QU009]
    relatedTableRefs: [TU001, TU002, TU003]
  - type: missing-source
    severity: material
    topic: hospital-authority-procurement
    missingEvidence: Public statements, tender records, pilot notices, or policy documents showing whether the Hospital Authority has evaluated Sentire for broader Hong Kong procurement.
    whyItMatters: Hong Kong's system-wide upside is significant, but it cannot be underwritten while HA stance remains opaque and procurement timing unknown.
    diligencePath: Search HA tender and technology-evaluation records, then request any direct correspondence or pilot status from management.
    relatedQuestionRefs: [QU022, QU025]
    relatedTableRefs: [TU005]
  - type: missing-source
    severity: minor
    topic: named-clinical-champions
    missingEvidence: Public identification of named surgeons, department heads, or clinical teams acting as Sentire champions at partner hospitals.
    whyItMatters: Named physician champions help investors assess whether adoption is broad-based inside each hospital or concentrated in a single sponsor.
    diligencePath: Request surgeon-reference lists, conference speakers, and proctor rosters tied to each named site.
