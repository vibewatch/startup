callouts:
- calloutType: strength
  title: Clinical validation breadth exceeds a single-market story
  body: >-
    Cornerstone already has meaningful proof across Hong Kong, the UK, and Singapore. That breadth matters because
    it shows Sentire is not confined to one hospital or one regulatory regime: CUHK / Prince of Wales Hospital gives
    repeated-use validation, Portsmouth provides an NHS evidence path, and Woodlands Health demonstrates the first
    Singapore installation after certification.
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU008
- calloutType: risk
  title: Customer concentration remains heavily academic and government-linked
  body: >-
    Every publicly named Sentire relationship sits in an academic medical center, teaching hospital, or government
    health system. That concentration raises risk around procurement speed, budget cycles, and external proof quality,
    especially because no private-sector hospital customer or mature commercial contract has been publicly disclosed.
  claimRefs:
  - CU007
  - CU020
  - CU027
  - CU035
- calloutType: assumption
  title: Treat named relationships as pilot or research proof until contracts are public
  body: >-
    The prudent diligence posture is to treat all named Cornerstone customer relationships as pilot, research,
    training, or early-deployment proof unless and until commercial pricing, contract length, renewal status, and
    installed-base expansion are publicly documented. The absence of those terms is more important than the prestige
    of the hospital names.
  claimRefs:
  - CU015
  - CU018
  - CU031
  - CU035
